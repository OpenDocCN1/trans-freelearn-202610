- pgno: 126
  md: "In the following screenshot, you can see just the right-hand melody. For each\
    \ note, I've assigned individual velocities. These fluctuations make the melody\
    \ seem less robotic and more lifelike:\n\n![](img/e7035ac7133980a2ff428c56c901384d_126_0.png)\n\
    \nFigure 4.9 – Melody velocity of the right hand\n\nYou may be wondering whether\
    \ you should increase velocity or decrease velocity for notes. What value should\
    \ you choose? I can't give you that answer. What velocity you choose is subject\
    \ to preference and will depend on your musical piece. Here are a few pointers,\
    \ though:\n\n+   - The more prominent the melody, the more dynamic range you can\
    \ have. Your ears will notice the changes in dynamics. If you want your listener\
    \ to be focusing on an instrument, you can change the dynamics more.\n+   \n+\
    \   - Although velocity is often tied to volume, it's better to think of volume\
    \ as a separate effect. You can adjust the volume later when you're mixing volumes\
    \ and/or with compression effects. Think about velocity as how much energy and\
    \ intensity you want to be inserted into playing each note. You can have a very\
    \ low velocity to create soft sounds on your instruments and then hike up the\
    \ volume in the mixing stage.\n+   \n+   - If you want an instrument to take focus,\
    \ increase its velocity relative to other instruments. If you want an instrument\
    \ to leave focus, decrease its velocity. The same idea applies to volume too.\
    \ Increasing the volume of an instrument focuses your attention on it, while decreasing\
    \ it tends to make it seem less important."
  merge: -1
  img_proc: true
- pgno: 127
  md: 'With that, we''ve learned how to use velocity to add realism to percussive
    instruments, but how do we add realism to non-percussive instruments? For that,
    we need articulations.


    # Using articulations


    When you''re using instrument plugins that attempt to mimic live instruments,
    you will need to experiment with instrument articulations to add realism and interest
    to the sound. There are many types of articulations, and these are instrument-specific.
    Articulation refers to the transition between notes. For example, articulations
    include slurs, phrase marks, staccatos, staccatissimos, accents, sforzandos, rinforzandos,
    and legatos.


    Here''s a reference list of articulations that you may encounter:


    +   - **Legato (slurs):** These are long and drawn out and blend one note into
    the next. They often include a short half-step rise at the beginning of the sample.
    On string instruments, this can be done by sliding a finger along the string while
    moving continuously from one note to the next.

    +   - **Staccato:** These are short and quick. It''s easy to identify that one
    note has finished before the next one. They are often thought of as the opposite
    of playing legato notes, and there''s lots of space between notes. On string instruments,
    this involves the player alternating between up and down bow movements.

    +   - **Crescendo:** This provides a continuous increase in the volume of a sound.
    With sampled instruments, it sounds more natural than a crossfade.

    +   - **Decrescendo:** This provides a continuous decrease in the volume of a
    sound. With sampled instruments, it sounds more natural than a crossfade.

    +   - **Glissando:** There are two possible meanings here. In general, it means
    a short upward run before the starting note. On harps, this means strumming the
    strings instead of plucking them.

    +   - **Sustain:** This involves holding a note out until the next note, though
    this does not prepare the player for the following note. Usually, these samples
    are looped so that they can be played indefinitely. If you use sustain notes on
    their own, they may sound quite fake. To make them sound more realistic, you''ll
    need to use expression automation to blend a sequence of sustained chords into
    the next sequence. We''ll show you how to use expressions later in this chapter.

    +   - **Trill:** This is a rapid alternating between two notes.

    +   - **Sforzando:** This involves playing a note with extra force to add more
    emphasis to it over other notes near it.

    +   - **Vibrato:** This changes the pitch of a note. In some articulations, vibrato
    starts after a slight delay, which allows faster sequences of notes to be performed
    before vibrato is applied.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'The following is a list of string instrument-specific articulations:


    +   - **Martelé:** This is where the bow pushes on each string and the sound stops
    between notes. This makes each note strongly accented.

    +   - **Pizzicato:** This involves plucking the string instrument using fingers
    instead of a bow, which creates a short sound that cuts through the rest of the
    orchestra.

    +   - **Spiccato:** This is a playing method where the bow bounces off the string
    while playing each note.

    +   - **Tremelo:** This is where the same notes are repeated by quickly alternating
    between the bow strokes without leaving the bow. This is often used in horror
    films.


    On some orchestral instruments, you may have the option to use key switches. This
    is where hitting certain MIDI notes will cause different articulations to turn
    on.


    So far, we''ve learned about a list of articulations, but it''s hard to imagine
    what this means until you''ve heard them. Let''s look at a quick example so that
    you can see articulations in action:


    +   1. Load up two or three instances of the FLEX plugin in the **Channel** rack.

    +   2. Navigate to **Essential Strings** or **Essential Winds**. You''ll find
    a list of different instrument articulations, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_128_0.png)


    Figure 4.10 – FLEX articulations'
  merge: -1
  img_proc: true
- pgno: 129
  md: '3. For each instance of FLEX, choose a different instrument articulation. For
    example, you may wish to pick **Violins Staccato**, **Violins Pizzicato**, or
    **Violins Sustain**.


    Each of these instrument articulations will provide a different sound for the
    instrument.


    Instrument articulations are important for mimicking realism from a live player.
    While playing, live musicians constantly alternate the articulations they''re
    playing. They''ll jump from short staccato notes to long legato notes. They''ll
    crescendo and decrescendo in volume and add emphasis to notes at various stages.


    When you compose for the violin, for example, you''ll want to include a variety
    of articulations in your sound to mimic a real instrument. After composing a melody,
    you can load up several versions of your violin instrument with different articulations
    (or use key switches). You can then assign melody notes to the desired instrument
    articulation. You must do this for each orchestral instrument. Do this strategically
    and you''ll find that your instruments sound very lifelike and much more interesting
    than without articulations.


    With that, we''ve learned about instrument articulations. Next, let''s learn about
    expression.


    # Using expression


    On sustain articulations, where you''re using string, brass, and woodwinds, you
    may notice that changing the velocity doesn''t seem to do anything. These instruments
    may or may not use velocity. Velocity is intended for instruments that involve
    physically hitting the instrument to produce the sound. Since nothing is being
    hit with certain string, brass, and woodwind articulations, how do we control
    the intensity of the sound?


    Some instrument plugins allow you to control an effect called **expression**.
    If you have a MIDI keyboard with a mod wheel, often, the mod wheel is hooked up
    to this *expression* effect by default. Expression controls the intensity of the
    sound. You''ll notice similarities between expression and velocity. Increasing
    expression, similar to increasing velocity, will increase the intensity of the
    sound.


    By default, FL Studio doesn''t come with any instruments that use expression (that
    I am aware of). You will need an instrument that has a dedicated expression controller.
    Examples of such instruments include Native Instruments orchestral instrument
    plugins or EastWest orchestral plugins, but there are lots of orchestral instrument
    plugins available on the market that have an expression effect. You can find some
    for free by doing a quick Google search for `orchestral instrument vst plugins`.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# What is expression good for?


    Automating expression is useful for a variety of situations. Expression can be
    used in the following scenarios:


    +   - Increasing or decreasing the intensity of your instruments. With orchestral
    string, brass, or woodwind instruments, adjusting expression is generally preferable
    over changing volume. Changing expression sounds more natural and lifelike. With
    a string instrument, the tonal intensity usually increases when the player plays
    louder. It''s not just a volume change – the whole sound changes too.

    +   - Expression helps make the transition between the sustain chords feel more
    natural. Sustain note chords can sound fake and flat when you''re transitioning
    from one chord to the next. Why? Usually, a sustain chord has a slow attack when
    the first note occurs. When you hit the next chord, you have to hear the slow
    attack again when, what you actually want is to continue from the first chord
    sound into the second. You can automate expression to make this transition less
    noticeable.


    > **Note**

    > Some instruments include legato articulations. Legato articulations sound reasonably
    realistic when transitioning between notes. However, the notes are usually limited
    to single notes at a time rather than chords. To get around this issue, if you
    wanted you could load up several instance of the plugin using legato articulations
    and have each instance hit different chord notes.


    # Manually adding expression to your orchestral instruments


    Let''s learn how to automate expression for our instruments. First, let''s learn
    about the manual method. After that, we''ll learn about the fine-tuned method,
    which requires you to have a MIDI keyboard with a mod wheel.


    To add expression, you need an orchestra instrument that has an expression effect
    that can be automated. Usually, string, woodwind, and brass instrument plugins
    come with this effect. I recommend the Native Instruments or EastWest instrument
    plugins, as suggested at the beginning of this chapter, but you can use any that
    you like.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'In the following steps, I assume that you have an orchestral plugin. If not,
    you will need to acquire one before you can follow the remaining steps. In my
    example, I am using an EastWest orchestral instrument; FL Studio does not come
    with this instrument by default:


    +   1. Go to the plugin options at the top left of your orchestral instrument
    plugin and select the **Browse parameters** option:


    ![](img/e7035ac7133980a2ff428c56c901384d_131_0.png)


    After selecting **Browse parameters**, a list of all the plugin effects that are
    available for your instrument will appear in the Browser. Hopefully, your plugin
    will have an *expression* effect.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '2. Right-click on the expression and choose Create automation clip:


    ![](img/e7035ac7133980a2ff428c56c901384d_132_0.png)


    Figure 4.12 – Create automation clip


    This will create an automation clip in the playlist.


    3. Then, left-click in the automation curve to draw and shape the curve. Increasing
    the curve will increase expression; decreasing it will reduce it.


    The following screenshot shows an example of me automating an expression curve
    for my string sustain chords:


    ![](img/e7035ac7133980a2ff428c56c901384d_132_1.png)


    Figure 4.13 – Automating an expression in the playlist'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'In the preceding screenshot, we can see the playlist. In this playlist, we
    can see the MIDI chord pattern and expression automation curve we just created.


    To make the expression effect feel more realistic, it can be a good idea to change
    the direction of the expression slope when you change chords.


    In the preceding screenshot, I used an extreme example of automating expression.
    Here, we can see that the slope changes from moving up and down at the same time
    to changing from one MIDI chord to the next. In some situations, this may make
    your chord transitions sound more lifelike.


    # Fine-tuned method for adding expression to your orchestral instruments


    If you have a MIDI keyboard with a mod wheel and your instrument connects the
    mod wheel to an expression effect, you can record expression automation directly
    while playing the song. If this is the case, it''s very easy to record expression.


    Let''s learn how:


    +   1. Press the record button (automation, score), as highlighted in the following
    screenshot. A pop-up menu will appear.

    +   2. Select the **Notes and automation** option, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_133_0.png)


    Figure 4.14 – Notes and automation'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'If you don’t have notes already, play notes with your MIDI keyboard while recording.
    Alternatively, you can have the notes already inputted in the Piano roll, and
    just record your mod wheel automation on top of your existing notes.


    While the notes are playing, move the mod wheel to control the instrument''s expression.
    Moving the mod wheel up will increase the expression''s intensity, while moving
    it down will decrease the expression''s intensity.


    The following figure shows an example of a mod wheel on a MIDI keyboard:


    ![](img/e7035ac7133980a2ff428c56c901384d_134_0.png)


    Figure 4.15 – Mod wheel


    (https://commons.wikimedia.org/wiki/File:Moog_LP_Pitch_%26_Mod_Wheel.jpg)


    If you want to use both hands while playing the MIDI keyboard instead of having
    one hand on a mod wheel, you could connect an expression pedal to your MIDI keyboard.
    Then, you can automate the expression using your foot while playing notes with
    both hands. The following figure shows an example of an expression pedal:


    ![](img/e7035ac7133980a2ff428c56c901384d_134_1.png)


    Figure 4.16 – Expression pedal


    (https://commons.wikimedia.org/wiki/File:KORG_CX-3_(2000)_expression_pedal.jpg)'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'After recording automation using the mod wheel, you will see an automation
    curve, similar to the one shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_135_0.png)


    Then, you can left-click the automation curve to refine the curve to your desired
    shape.


    The Piano roll isn''t just limited to automating expression and velocity. By left-clicking
    on the Control button at the bottom left of the Piano roll, you can swap between
    the parameters you wish to automate. For example, you can automate panning, volume,
    and pitch. Any effects that you control in the pattern will show up here. You
    can also use this menu to switch back to controlling note velocity.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'The following screenshot shows the various channel controls:


    ![](img/e7035ac7133980a2ff428c56c901384d_136_0.png)


    Figure 4.18 – Choosing a parameter to automate


    With that, you know how to use expression to add dynamic changes to your orchestral
    compositions. Next, we''ll learn how to compose orchestral music using MIDI.


    # Orchestral MIDI programming


    Let''s get to the real meat and potatoes of this chapter: tips on composing for
    orchestral compositions. In the new few sections, we''ll mostly focus on MIDI
    programming for string instruments. By learning how to compose for strings, you''ll
    learn about lots of transferrable tools and techniques that can be applied to
    composing orchestral compositions regardless, of whether you''re composing for
    string, woodwind, brass, or percussion instruments.


    Becoming good at composing for strings will give you transferable skills to compose
    for many orchestral instruments. So, although I will talk specifically about strings,
    you''ll find that these lessons carry over to other orchestral instruments too.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# Composing for string instruments


    When we talk about string orchestral instruments, we''re referring to the contrabass,
    cello, viola, and first and second violins. Composers devote a lot of attention
    to the string section of an orchestra. String instruments present a lot of freedom
    in terms of what can be done. They are extremely expressive in sound, blend in
    well with other orchestral instruments, and have lots of different articulations
    to experiment with. It''s an opportunity for composers to show off their skills.


    When composing for string instruments, you''ll come across the terms *double stops*
    and *divisi*, both of which we will look at in the following subsections.


    # Double stops


    **Double stops** refer to playing two notes at the same time on a string instrument.
    There are also triple stops and quadruple stops. Playing more than two strings
    at a time is difficult because it''s tricky to bow more than two strings simultaneously.
    It''s difficult to get your fingers into a double stop and difficult to get out
    gracefully. If you give a piece of music to a string player and the score is filled
    with triple stops and quadruple stops, you may discover that you''ve given your
    musician an unplayable piece.


    Double stops are not such a big deal in a full orchestra, though. This is because
    the orchestra can divide the notes among musicians. When given to an orchestra,
    melodies that would involve double, triple, and quadruple stops are often split
    into separate instruments for musicians to play.


    # Divisi


    How do you avoid double stops? You use divisi. Dividing notes into separate instruments
    is called **divisi**. Divisi is not always the best choice in all situations.
    Divisi should be avoided in the first violin and bass. Divisi in the first violin
    can sound overly shrill and piercing. It''s better to have divisi in the second
    violin.


    Divisi in the bass should usually be avoided too. Divisi in the bass can result
    in overly muddy, crunchy notes that all mush together. For this reason, it''s
    best to avoid chords in the low-end registers, such as on the contrabass. Divisi
    in string instruments usually works best in cellos, violas, and second violins.'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'In the majority of situations, you only need five-note voices for a nicely
    balanced chord, one for each string instrument – contrabass, cello, viola, first
    violin, and second violin. Usually, the two lowest voices on the cello and contrabass
    double each other, and or play the same note in different octave registers. This
    helps give the bass notes a bit of body. It''s often best to avoid differing notes
    between the cello and the contrabass unless you intentionally want crunchy, muddy
    sounds.


    After assigning a melody to an instrument with a thin sound, you may notice that
    the playback of the instrument sounds quite thin. In such a case, it helps to
    double the notes an octave apart (layer a note with another of the same pitch
    but an octave higher). This can help thicken the sound.


    When you''re composing for wind instruments, such as brass and woodwind instruments,
    it can be easy to forget that wind instruments have physical limitations, should
    a live musician play your piece. If a live musician plays your composition someday,
    they will need breaks to catch their breath. To solve this, leave rests in-between
    phrases so that your musicians can breathe.


    # String instrument considerations with vocals


    In pop songs, you need to leave frequency space for the vocals. Identify notes
    and frequencies that have the same range that vocals reside in. Then, see whether
    a string instrument is competing with the vocal. If it is, consider transposing
    the string instrument up or down an octave. If it doesn''t sound good once you''ve
    done this, you may want to consider swapping the notes with another string instrument
    that fits that register better.


    The following screenshot shows an example of comparing frequencies from a string
    instrument with the frequencies of a vocal:'
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/e7035ac7133980a2ff428c56c901384d_139_0.png)


    Figure 4.19 – Frequency comparison


    In the preceding screenshot, we can see that the vocal occupies frequencies higher
    than 100 Hz. The string instrument occupies frequencies higher than 100 Hz. It''s
    possible that in some situations, the frequencies from the string instrument may
    overpower the vocal since they are occupying the same frequency range. This may
    result in the vocal being drowned out.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Vocals are always the focus. Strings and other orchestral instruments are there
    to support the vocals. When you''re creating counter-melodies with vocals, string
    instruments should occur when the vocals hold a note or take a break. When the
    vocal takes a break, the strings can take focus. When the vocal comes back in,
    the strings should have less movement so that they aren''t distracting.


    # Tips for composing orchestral chord progressions


    Is there just one way to start a chord progression? No. Any music theory book
    will tell you that. You could start with the bassline and build chords on top
    of that. You could start with a catchy melody and then build the bassline chords
    to support it. You could start with a rhythmic pattern first. You could search
    for the perfect sound that inspires you and build around the sound. There are
    many valid approaches, and you''ll develop a preference that works best for you.


    Saying you can make music in a lot of ways isn''t very helpful, though. Let''s
    assume that you took the first approach and built a bassline with your contrabass
    or another bass instrument. In this case, don''t start building full chords right
    away. Building full chords from the start usually results in building very simple
    chords. Instead, once you have your bassline, you can add a single melody on top
    with another instrument such as the viola. You should layer your melodies on top
    of one another, making sure that each one improves the overall composition.


    I come from a piano background. So, for me, the logical place to start is to improvise
    a chord progression on the piano. On the piano, the notes in the chords always
    end up being spaced close together. Why? Because my fingers are physically close
    to one another. If I were to swap the piano instrument with a string section,
    all my notes would probably be clumped together in just the viola or cello registers.
    It''s easy to fix this issue, though – all I need to do is transpose notes in
    my chord progression up or down a few octaves to fit into the register of the
    violin, contrabass, and so on.


    # Can I have too many melodies?


    When you have a bassline and a melody on top, how do you know whether it''s safe
    to add another melody or when a new melody will distract from the overall effect?


    In your melodies, you should have rests and places where your notes sustain for
    a while. It''s during these pauses that you have the opportunity to introduce
    movement with a new melody. Movements that go up and down in pitch demand your
    attention. You want the focus to be on one melody at a time. In other words, when
    your viola holds a note or pauses, it''s an opportunity for your second violin
    melody to take over with some melody movement.'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'When your second violin melody rests or holds a note, you can have your cellos
    do some movement. You want the focus to be on one melody at each point. When a
    melody reaches a logical hold or rest, shift the focus to another instrument.
    It''s all about taking turns between active movement from one instrument section
    to the next. This way, the instruments feel like they''re playing off each other.
    This example is a bit of an over simplification and I''m sure you can find exceptions.
    But its a useful way of thinking to keep in mind.


    A good rule of thumb is that if you solo any instrument, the melody should sound
    interesting on its own. If not, you likely need to either improve the melody or
    add articulations to give it some more character.


    If you choose to have clashing notes, such as a seventh note combined with a root
    note, it usually sounds better to have the clashing notes in the higher registers
    (above C3) rather than the lower registers. Anything in a register that''s lower
    than C3 usually results in a muddy sound. In the higher registers, there''s space
    for the clashing sounds, so they''ll sound better than lower registers. The following
    screenshot shows two examples of seventh note partial chords. It''s using notes
    C and B, which are being played by sustain string instruments.


    ![](img/e7035ac7133980a2ff428c56c901384d_141_0.png)


    Figure 4.20 – Seventh note partial chords'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'The seventh note partial chord on the left is in the lower register. It sounds
    terrible to listen to as it''s muddy and clashing. On the right, I''ve moved the
    seventh note up a few registers. This note, although still a seventh note, sounds
    much better. It has its own frequency space and doesn''t feel like it''s competing
    with the tonic note.


    When transitioning from one sequence of block chords to the next, it''s usually
    a good idea to have as little movement as possible between chords. Jumping up
    and down registers can sound jarring and should be avoided unless that''s the
    intended effect. Instead, you want your chord progressions to be subtly expanding
    and contracting throughout the piece as you transition between chords.


    Favor expanding and contracting chord progressions over linear vertical movements
    up and down. The following screenshot shows two examples of chord progressions:


    ![](img/e7035ac7133980a2ff428c56c901384d_142_0.png)


    Figure 4.21 – Linear versus expanding chord progression


    In the preceding screenshot, we can see an example of a mundane chord progression
    on the left and a more interesting chord progression on the right. I''ve used
    the same bassline for each in purple and added accompanying notes to form chords.
    On the left-hand side, we can see a linear vertical chord progression movement.
    All the notes are moving in the same direction. If you were to listen to this,
    it would sound boring and predictable.


    On the right, we can see a chord progression where the overall movement of the
    chords expands up and down simultaneously. This is much more interesting to hear.
    An expansive or contractive movement in a chord progression is much more interesting
    to listen to than a linear movement.'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Let''s provide some general guidelines for orchestral composing. This order
    is a suggestion, so you will likely jump around these steps as you see fit:


    +   1. Come up with basslines and add melodies to play over them, one at a time.

    +   2. Spread your instrument voices out, assigning them to the logical string
    instrument registers – for example, high notes for the first violin and low notes
    for the contrabass and cello. You''ll have to transpose up or down octaves based
    on what makes sense when you listen to it.

    +   3. Brainstorm ways to add rhythm and movement to the composition. Experiment
    with rhythm syncopation to avoid sounding overly repetitive and predictable. Consider
    adding percussive elements to add syncopation and rhythm. Drum percussion is rarely
    a single instrument played in isolation. It''s almost always a collection of layers
    of several percussive instruments playing simultaneously.

    +   4. Add vertical movement to your melodies. If you find that a melody section
    is repetitive, consider jumping it up or down an octave. A downward movement in
    notes feels like it''s losing energy, whereas an upward movement feels like it''s
    gaining energy. Therefore, you will often see a downward movement in notes at
    the end of a chorus, when it''s transitioning into a verse, and you''ll often
    see an upward movement when it''s transitioning into the chorus when we want higher
    energy.

    +   5. Add rests and hold notes to add space to your melodies. This gives space
    for new melodies to be introduced for other instruments. Doing this makes your
    instruments sound like they''re playing off one another.

    +   6. Don''t feel like you need all your instruments to be playing at all times.
    It''s much more interesting to have instrument sections gradually fade in and
    out throughout the song. If you have all your instruments playing right at the
    start, you''re depriving yourself of the chance to build up, layering all the
    instruments into a massive wall of sound crescendo later on.

    +   7. Add articulations for your instruments.

    +   8. Consider layering with additional orchestral instruments. For example,
    if you want your string instruments to have more attack, you may consider adding
    another string instrument with a punchier articulation, or a percussive instrument
    such as a xylophone. After layering, you may discover that some other orchestral
    instruments, such as brass or woodwind, fit in better than your original string
    instruments, so you''ll need to do some swapping around.

    +   9. Once you''ve added your articulations and layering, you can think about
    dynamics. It''s a good idea to leave this until the end because any automation
    will need to be redone if you move your notes around. Refine the velocity of your
    notes and add expression to your instruments. Finally, add crescendos and decrescendos.'
  merge: -1
  img_proc: true
- pgno: 144
  md: "+   10. Balance the volume levels between your instruments. **EQ (equalize)**\
    \ your instrument frequencies to give space for each instrument and focus attention\
    \ on the main melody. Use automation so that your volume levels and/or expression\
    \ change desirably throughout the song.\n+   \n+   11. In some situations, you\
    \ may consider swapping out the contrabass with a synthetic bass to hit the low\
    \ frequencies. If you want to create what's known as a *wall of sound*, this is\
    \ a way to hit the low resonating rumbly frequencies. If so, you will want to\
    \ add a low pass filter for your synth bass instrument. By doing this, your synth\
    \ bass frequencies focus on the low end and don't overpower the rest of your mix.\n\
    \n# Tips for making sampled instruments sound realistic\n\nTo make your MIDI notes\
    \ sound more like live string instruments, you may want to consider the following\
    \ tips:\n\n+   - Sample libraries don't know when a note is going to end. Real\
    \ musicians get ready to come off of notes and have a natural decrescendo. You\
    \ can attempt to mimic the decrescendo by automating expression.\n+   \n+   -\
    \ When a live orchestra begins playing a note, there's a slight crescendo when\
    \ they start – a slight swell. Good sample libraries usually do this for you,\
    \ but if you're using a cheap sample library, then you may have to find a workaround\
    \ to make this happen.\n+   \n+   - When real musicians play, their notes aren't\
    \ exactly 100% in time. Naturally, there are some random fluctuations. You may\
    \ be tempted to quantize everything with MIDI programming to get everything timed\
    \ perfectly. Quantizing is a Piano roll effect that shifts notes to fit in with\
    \ the Piano roll grid and removes any imprecision. Although this snaps everything\
    \ to the Piano roll grid, it also makes everything overly robotically perfect.\
    \ You can try to fix this by using an effect called **Humanize**, which exists\
    \ on some digital audio workstations such as **Cubase**.\n\nHumanize adds a little\
    \ random variation to the start and end times of your notes. FL Studio doesn't\
    \ have a **Humanize** effect, so you'll have to go in and manually adjust the\
    \ start and end times of your notes if you want to add some random variation.\n\
    \nIt's a lot of work trying to randomize by hand and even if you have a Humanize\
    \ effect tool, it can still sound like it's lacking the realism of a live player.\
    \ For this reason, high-level composers usually record their MIDI piano playing\
    \ live and keep the timing of their playing with slight modifications. They also\
    \ record their expression while playing, as opposed to going in and adding expression\
    \ afterward. They do this using the mod wheel or a MIDI keyboard pedal."
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   - If all the note velocities are the same, your music will sound robotic.
    It''s a good idea to add randomness to your note velocities to make them sound
    more like live instruments. For percussive instruments (especially drums), you
    should always be adding some velocity variation.


    # Adding random variation to your note velocities


    FL Studio lets you add random variations to your note velocities. This can be
    done using a tool called the **Randomizer**. Let''s learn how to use the Randomizer
    to add randomness to note velocities:


    +   1. In the Piano roll, select the Piano roll options | Tools | Randomize dropdown,
    as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_145_0.png)


    Figure 4.22 – Randomize'
  merge: -1
  img_proc: true
- pgno: 146
  md: '+   2. Disable the **Pattern** and **Bipolar** buttons. Adjust the velocity
    (**VEL**) knob to your velocity preference, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_146_0.png)


    *Figure 4.23 – Randomizing velocity*


    +   3. After adjusting the knob, you''ll find that the notes in your composition
    have been assigned some randomness to their note velocity. You may also want to
    randomize the panning and pitch.


    With that, you know how to make your orchestral MIDI notes sound more realistic.


    # Considerations for mixing orchestral compositions


    When mixing, you strive to achieve a nice balance between the low, mid, and high
    frequencies. This means you need to be careful when you''re choosing instruments.
    Your note choice will also dictate whether you can achieve a nice balance. For
    example, the bass should rarely lie more than an octave from the part above it.
    Anything much more and you''ll find that you''re lacking in the mid frequencies.
    This is the reason why you should usually focus on five voices in the string section
    (one for each section – contrabass, cello, viola, first violin, and second violin).
    Achieving a good composition of these five voices will give you a nice balance
    of lows, mids, and highs.'
  merge: -1
  img_proc: true
- pgno: 147
  md: "Fortunately, in digital audio workstations, we have fine control over our sounds\
    \ and can create combinations of sound that would be very difficult to achieve\
    \ in the real world. We can use a tool for this called **equalization (EQ)**.\
    \ If an instrument is being drowned out, we can use EQ to carve out frequencies\
    \ to enhance our instruments. For example, we can make cuts to frequencies to\
    \ leave room for other instruments or boost frequencies that are too soft.\n\n\
    **Reverb** is an effect that simulates natural-sounding echoes in a space. When\
    \ you're mixing sampled instruments, adding reverb effects can help blend your\
    \ orchestral instruments. It makes it sound like all the instruments exist in\
    \ the same room. Reverb often disappears behind the dialog when music is played\
    \ at a low volume, so you can usually add quite a bit of reverb.\n\n> **Tip**\n\
    > \n> Turn your speakers down until you just barely hear the music and see whether\
    \ it still sounds like it needs reverb.\n\nFor percussive instruments such as\
    \ piano, harp, or percussion, a slight delay effect can help bring it to life.\n\
    \nWhen you're adding EQ, it's often a good idea to roll off the bottom and top\
    \ frequencies of your instruments if you have poorly sampled instruments. This\
    \ isn't necessary if you have good, sampled libraries.\n\nAt a pro level, composers\
    \ don't use key switches for their instrument plugins. Key switches can become\
    \ cumbersome when carrying out finely-tuned mixing for instrument articulations\
    \ when they are frequently changing articulations. Doing so would require you\
    \ to change your automation effects when you want to rearrange your note positioning.\
    \ It's much easier to assign articulations to different instruments and mix them\
    \ individually. Also, if you want to layer in instruments from different sample\
    \ libraries, key switching makes it hard to keep track of where an articulation\
    \ begins and ends.\n\nWhen you're listening to your composition, you may notice\
    \ some instruments overpowering others before you mix. With live orchestras, composers\
    \ must account for what instruments can be layered together. If the wrong combination\
    \ of instruments is paired up, some instruments may be drowned out entirely."
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Understanding instrument frequency ranges can give you an idea of how to balance
    out your instruments so that you can achieve the desired sound. The following
    diagram shows the frequency ranges for instruments:


    ![](img/e7035ac7133980a2ff428c56c901384d_148_0.png)


    Figure 4.24 – Instrument frequency chart

    (https://commons.wikimedia.org/wiki/File:Estensione_Strumenti_Musicale.jpg)


    If you find that most of your instruments are occupying the same frequency range,
    you may find your instruments drowning each other out. In this case, it''s worth
    swapping an instrument for one in a different frequency range.


    While you''re listening to your compositions, you can use plugins to visually
    see the frequency ranges in your mixer channels. If you can, you may want to look
    into spectrogram plugins. Spectrogram plugins provide you with a fine-grained
    insight into your song''s frequencies.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Considerations for live orchestras


    Why do we use live orchestras if plugin sample libraries are so good? Live orchestras
    have a few advantages over sampled orchestra plugins. In live orchestras, you
    have access to much more natural-sounding articulations. For example, when you
    play a sustain instrument sample, your digital audio workstation doesn''t know
    when you plan to stop playing the note. So, it just loops the sample and then
    abruptly ends. When a real player plays a sustained note, the musician can make
    the sound flow in and out of the note naturally.


    Live musicians can get ready to play the note before it begins and get ready to
    end the note before it ends with a decrescendo. Note that the top-of-the-line
    sample libraries are getting good at trying to make this sound natural, so this
    is becoming less and less of an issue.


    Another reason you should use live orchestras is due to recording through microphones.
    When you record an orchestra, you have close microphones (called **tree mics**),
    microphones that are further away (called **wide mics**), and microphones to capture
    the whole room, including reverb (called **surround mics**). When the orchestra
    plays, your tree mics capture some of the orchestral instruments next to them.


    Parts of other orchestra instruments will bleed into each tree mic recording.
    This makes it sound natural. When you use a sample library, you don''t get the
    sound of all the instruments blending into each other naturally. Try adding a
    reverb effect to place all your orchestral instruments in a simulated room to
    mimic this behavior.


    Now that we''ve learned how to compose orchestral compositions, let''s summarize
    this chapter.


    # Summary


    The ability to compose for orchestra is highly valued when composing for films
    and video games. Understanding orchestral MIDI composing techniques lets you quickly
    compose orchestral music and deliver scores to be played by live musicians.


    In this chapter, you learned how to create orchestral music using MIDI programming.
    You learned about the various plugins you can use to create orchestral music.
    You also learned how to use velocity, articulations, and expression to add realism
    to your compositions. Finally, you learned about various orchestral MIDI programming
    techniques, tips for making sampled instruments sound real, and mixing ideas.


    In the next chapter, you''ll learn how to create sheet music for musicians, sync
    music to visuals, and also how to create sound effects.'
  merge: -1
  img_proc: true
