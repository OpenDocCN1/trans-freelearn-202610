- pgno: 156
  md: 'Starting a new project is okay, assuming you want to be composing your entire
    song from scratch, but that''s not a very efficient way to compose. We''re going
    to learn a much faster, and easier, approach. We''ll take our entire FL Studio
    composition and then transfer it over to MuseScore. Essentially, we''re doing
    the equivalent of copying and pasting MIDI music notes so that MuseScore can do
    most of the music notation work for us. This will save you a tremendous amount
    of time.


    Frankly, I was blown away the first time I saw how easy the following technique
    is. Perhaps you will be too. Here''s how to create sheet music with MuseScore
    using a project from FL Studio:


    +   1. Download and install MuseScore.


    +   2. Create a song in FL Studio.


    To execute the following steps, you need a song in FL Studio to export as MIDI
    data. You can use any song you''ve created in FL Studio as long as it uses some
    MIDI notes in the Piano roll.


    +   3. We''re about to export your project as MIDI data. Before that, make sure
    you save a copy of your project as a backup. Preparing your project for MIDI exporting
    will irreversibly modify your project. Therefore, you must save a backup copy
    first so that you have access to the original in case you want to make further
    adjustments.


    +   4. Make sure all your instruments in the Channel rack are appropriately named.
    MuseScore will label each section based on the instrument name you set up in the
    Channel rack.


    You can rename instruments by right-clicking Rename, color and icon... on an instrument
    in the Channel rack, as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_156_0.png)


    Figure 5.3 – Naming your instruments prior to exporting'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'Make sure you give your instruments names that are easily recognizable later
    on.


    +   5. In FL Studio, navigate to **Tools | Macros | Prepare for MIDI export**,
    as shown in the following screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_157_0.png)


    Figure 5.4 – Prepare for MIDI export


    After selecting **Prepare for MIDI export**, a series of steps will be performed
    on your project to prepare for MIDI exporting.


    +   6. Navigate to **FILE | Export | MIDI File**. A pop-up window will appear
    prompting you to save your MIDI file and give it a name. Remember where you save
    your MIDI file.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '7. Make sure that MID is selected and then click Start, as shown in the following
    screenshot:


    ![](img/e7035ac7133980a2ff428c56c901384d_158_0.png)


    Figure 5.5 – Rendering a song as MIDI


    Your song has been rendered as a MIDI file. We can now import this into MuseScore.


    8. Open up MuseScore.


    9. Select Load score from file and select the MIDI file you exported from FL Studio.
    The following screenshot shows how you can import your project:'
