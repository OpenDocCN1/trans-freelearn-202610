  '
- "# 第 6 部分：用音乐影响情绪和设计情感音乐\n\n作为作曲家，你有能力控制观众的情绪。视觉效果的含义取决于伴随的音频。你只需通过音效的选择，就能将一个什么也没发生的无聊场景变成一个强烈的情感时刻。你可以通过音乐选择让场景变得快乐或悲伤、放松或紧张、浪漫或可怕。\n\
  \n电影中反复出现的有几种常见情绪。在本章中，我们将介绍多个技巧，帮助你为各种情绪设计音乐情绪。\n\n在本章中，我们将涵盖以下主题：\n\n- 什么是恐惧？\n\
  - 设计惊吓\n- 设计 creepy 音乐\n- 作曲快乐和悲伤音乐\n- 作曲浪漫音乐\n- 在音乐中制造紧张感并为预告片作曲史诗音乐\n\n如果你是初学者，感到不知所措，请放心，你不需要记住本章讨论的技术。本章旨在作为参考指南，你可以在需要特定情绪音乐时随时查阅。这些技术针对偶尔出现的特定情况。\n\
  \n在本章中，我们将尝试不仅给你提供为特定情绪作曲的工具，还提供某些声音为何让你产生特定感受的理由。有了这种理解，你将获得洞察力，可以自行实验并想出新的声音。\n\
  \n### 作曲诡异音乐\n\n了解如何使用声音让观众感到不舒服是作曲家拥有的绝佳工具。如果做得正确，音乐可以同时让观众感到恐惧，同时让他们完全投入并沉浸在故事中。在我们吓唬观众之前，我们需要了解恐惧是什么。\n\
  \n#### 什么是恐惧？\n\n恐惧是对潜在危险的不确定性的心理反应。从生物学角度来看，恐惧帮助你避免可能伤害你的情况。\n\n让我们想想你在野外漫游的远古祖先，在他们狩猎和觅食食物的时候。在森林或丛林的黑暗中，他们看不到周围发生了什么。他们的耳朵密切聆听可能伤害他们的生物的声音。\n\
  \n\n\n\n\n未知是危险的。数千年来，我们的耳朵变得敏感，能够区分熟悉的声音和不熟悉的声音。任何被耳朵解读为威胁的东西，都可能使我们的身体进入高度警觉状态。你的身体会将血液输送到有助于战斗或逃跑的器官；你的心跳加速，耳朵高度集中聆听，眼睛四处张望。这些都是生存机制，旨在在面对潜在威胁时提高你的生存几率。如果我们想用声音来产生这些生物反应，我们需要创造一个感官环境，让听众相信自己处于危险的场景中。\n\
  \n什么声音会让我们觉得可能有危险？乍一看并不那么明显。请注意，恐惧也有不同种类。有时，我们会感到脊背发凉。有时，我们会因惊吓而跳起。有时，我们看到令人不安和困扰的图片，但并没有明显的威胁。我们如何解释所有这些不同的恐惧形式？我们需要心理拼图中的另一块，而这块就叫做**认知失调**。\n\
  \n## 理解认知失调\n\n认知失调是对不一致或矛盾信息的感知。当你遇到不一致或矛盾的信息时，你的大脑会努力理解这些信息。在某些情况下，这会导致身体进入应激状态，你会体验到恐惧。\n\
  \n我们可以通过组合听起来不自然地搭配的声音，为耳朵创造认知失调。通过创造一种不熟悉的听觉情境，我们可以让自己感到不舒服。将令人不安的声音与令人不安的视觉效果配对，你就拥有了一个在观众心中激发恐惧的绝佳情境。\n\
  \n以下是认知失调的一个例子：\n\n### 紧张场景 + 无辜音乐 = 令人毛骨悚然\n\n你的眼睛看到一个非常强烈的场景。也许演员看起来很紧张，正在惊慌失措。现在，将这个紧张的场景与听起来非常无辜的声音叠加——它会与视觉冲突并产生认知失调。\n\
  \n在许多涉及小丑、杀人儿童玩具或被附身儿童的恐怖电影中，你会听到无辜的音乐。它可能包含玩具的声音、旋转木马音乐或儿童歌唱的声音。如果这种声音伴随着紧张的场景出现，大脑会将其解读为令人毛骨悚然。\n\
  \n如果你反转前面的等式，你可能会得到一种可以被解读为有趣的情况。\n\n一个好的惊吓是由以下技巧创造的。首先，令人毛骨悚然的音乐逐渐增强，为震惊事件做好准备。在令人毛骨悚然的音乐达到强度高潮后，会有一段短暂的安静时刻来制造期待，随后是一个响亮的、令人害怕且不和谐或冲突的声音。这个结尾的声音与震惊的视觉效果配对。\n\
  \n我在前一段提到过令人毛骨悚然的音乐的累积。每当你听到声音强度的上升或下降时，这通常意味着我们将使用自动化。我们在*第4章 管弦乐MIDI作曲*中学习了如何使用自动化来增加表现力和音量。**Expression**是一种用于调整音乐强度和音量的效果。以下截图显示了一个示例：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_183_0.png)\n\n图6.1 – 自动化令人毛骨悚然声音的强度\n\
  \n在前面的截图中，自动化被用来随着时间的推移增加乐器声音的表现力。使用自动化，乐器声音的强度增加到渐强，然后降低到寂静，随后是一个令人害怕的声音。\n\n与适当的视觉效果配对，令人毛骨悚然的声音会累积到惊喜揭露。我们随后将强度降低到寂静，持续一会儿。这会让观众在期待惊吓时感到不安，因为他们经历的累积感觉必须导向某个地方。最后，我们用令人害怕的声音和图像组合来震惊观众，从而完成惊吓。\n\
  \n记住顺序：*令人毛骨悚然的音乐累积起来，随后是几秒钟的寂静，然后是一个令人害怕的声音。*如果你直接进入令人害怕的声音，你就错过了建立必要的累积，让听众处于脆弱状态。令人毛骨悚然的音乐之后的短暂寂静是吓唬观众最重要的悬念时刻。寂静是一个不确定性的时刻，听众不确定接下来会发生什么。如果你让听众保持在脆弱状态一段时间，恐惧会进一步累积，场景会感觉更可怕。\n\
  \n## 设计可怕的声音\n\n我们已经确定了惊吓的关键部分。它由**令人毛骨悚然的音乐**后跟**令人害怕的声音**组成。在接下来的页面中，我们将诊断这些是如何创造的。让我们先从惊吓的令人害怕的声音部分开始——即提供最终惊吓的部分——然后我们将学习如何制作**令人毛骨悚然的音乐**。\n\
  \n令人害怕的声音可以是任何听起来不熟悉和不自然的声音——你在日常环境中不常遇到的声音。有几种类型的声音是吓唬听众的良好候选者：\n\n- **频率跳跃**：极端的频率跳跃会让听众感到惊讶。\n\
  \n  频率跳跃是指从高频率跳到低频率，或反之亦然。请记住，频率只是音高的另一个词。换句话说，我们说的是音高的任何极端变化。音高的极端突然跳跃在日常环境中并不常见。通常从高到低或从低到高时会有逐渐的上升或下降。\n\
  \n  使用FL Studio，创建频率跳跃非常容易。只需从高八度的音符移动到低八度的音符，或反之亦然。\n- **非标准和声**：非标准和声是听起来不和谐的声音——也就是说，不和谐的声音。如果你忘记了不和谐的声音是什么，请参考*第3章\
  \ 使用主题、主导动机和音阶设计音乐*。\n\n  不和谐的冲突声音可以发挥巨大作用。一个标志性的例子是阿尔弗雷德·希区柯克电影《惊魂记》中谋杀场景期间小提琴的不和谐尖叫。\n\
  \n  以下显示了非常不和谐的冲突音符的示例：\n\n  ![](img/e7035ac7133980a2ff428c56c901384d_185_0.png)\n\
  \n  图6.2 – 不和谐的音符\n\n  不和谐的音符相互冲突，并且可以通过使用类似尖叫的刺耳乐器来进一步增强。在阿尔弗雷德·希区柯克的电影《惊魂记》中，所使用的乐器是尖叫的小提琴。\n\
  - **混沌噪音**：混沌的声音可以创造一种让人感到恐慌和混乱的情境。例如，如果你将视觉效果与大量愤怒人群的声音配对，喊叫和无序奔跑，这可以被解读为一种压倒性的情境。与白噪声相似的声音也可能让人感到非常有压力和痛苦，这可能是使用它们所期望的效果。\n\
  - **超出预期范围的声音**：乐器通常预期在特定的音高范围内演奏。如果超出该范围演奏（无论是更高还是更低），它们听起来会非常令人不安。例如，如果你有一段人类声音的录音，其音高降低到不自然的低水平，这听起来会令人不安。对乐器也同样适用。将乐器的音高改变到不自然的低或高水平会听起来非常令人不安。\n\
  - **类似尖叫的声音**：我们的耳朵对听到尖叫声高度敏感。这是一种具有进化起源的生物安全机制，旨在提醒我们危险，确保当有人因恐惧而尖叫时，你会注意尖叫的来源。\n\
  \n我们已经介绍了可以在惊吓的“吓”部分用来吓唬观众的声音。接下来，让我们看看如何为惊吓的累积部分创建令人毛骨悚然的音乐。\n\n\n\n\n\n## 设计恐怖音乐\n\
  \n恐怖音乐可用于多种场景。有时，你只需要一些氛围音效来表现特定的环境或主题。如果你想增添神秘、悬疑的气氛，或未知的感觉，本节正是你所需要的。\n\n恐怖音乐由非自然和陌生的声音组成。这些声音越显得不寻常，就越有可能成为令听众不安的绝佳素材。\n\
  \n在 FL Studio 中，你可以通过以下技术创建被视作恐怖的声音：\n\n- 音乐失谐\n- 中途突然转调\n- 反转音乐\n- 减慢、加快及突然变速\n\
  - 混响、故障效果和延迟，可用于增强上述任何方法\n\n## 失谐音乐\n\n大多数音乐都经过优化，以鼓励音符之间相互和谐。彼此不和谐的音符称为*不和谐音*。相比之下，声音越和谐，听起来就越悦耳，乐器通常也会调校得尽可能合调。如果你想制造恐怖的声音，你可以采取一种完全相反的方法，设计故意失谐的乐器。我们在*第3章\
  \ 使用主题、主导动机和音阶设计音乐*中已讨论了协和与不协和。\n\n## 中途突然转调\n\n大多数歌曲在整首歌中保持相同的调性。这样，音乐听起来贯穿始终一致。音乐既设定了听众对接下来可能出现的音符的期望，也满足了这种期望。如果要从一个调过渡到另一个调，我们会尽可能平滑地过渡。当\
  \ DJ 为人群播放歌曲时，他们会安排曲目顺序，使得歌曲间的切换能处于相近的调性，让过渡显得不那么突然，流动也更自然。\n\n我们学习了如何使用和弦转轮技巧在调性之间过渡，相关内容已在*第3章\
  \ 使用主题、主导动机和音阶设计音乐*中讨论过。\n\n如果你想给听众带来一阵惊喜，你可以在全曲中突然转入与彼此不相似的调性。这种声音非常不寻常，会让你的耳朵聚焦于调性的变化。这种变化会感觉非常出乎意料，并将听众从当下情境中抽离。这就像电影中打破第四面墙，演员直视镜头看着观众。你让听众意识到音乐已完全改变。突然变速也能给听众带来这种效果。\n\
  \n## 反转音乐\n\n一般而言，声音向前播放。将声音倒放，尤其是放慢速度后，可能产生一些恐怖甚至骇人的声音。黑胶唱片收藏者中流行一种游戏：倒放著名歌曲，寻找隐藏信息。这可能会产生一些非常奇怪且仿佛是来自另一个世界的声音。\n\
  \n在 FL Studio 中，你可以通过在播放列表中的样本上右键单击两次，然后选择 Reverse 按钮，来反转任何声音样本的声音。以下截图展示了一个示例：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_187_0.png)\n\n图6.3 – 反转音频样本\n\n如果你想让声音更加恐怖，还可以考虑放慢音频的时间和音高。\n\
  \n## 将音频渲染为波形\n\n如果你的乐器正在播放 MIDI 音符，而你想反转声音，则不能仅仅双击播放列表中的样本。在反转声音之前，你需要额外一步。你需要先将\
  \ MIDI 音符转换为音频波形。完成后，声音就变成了常规音频样本，可以使用之前描述的方法进行反转。\n\n你可以使用称为**渲染为音频**的技术（更常称为**冻结音频**）将乐器的\
  \ MIDI 音符音乐转换为音频样本。\n\n让我们来学习具体做法：\n\n- 1. 将你的乐器从通道机架路由到混音器。我们在*第2章 浏览 FL Studio\
  \ 的关键功能*中已学习过如何操作。以下截图展示了一个示例：\n\n![](img/e7035ac7133980a2ff428c56c901384d_188_0.png)\n\
  \n图6.4 – 将通道机架乐器路由到混音器\n\n- 2. 在你想将其音频渲染为波形的乐器上，选择**启用磁盘录音**按钮。你可以同时选择多条轨道，如下面的截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_189_0.png)\n\n图6.5 – 启用磁盘录音\n\n3. 在混音器中，选择\
  \ 选项 | 磁盘录音 | 渲染为波形文件，如下面的截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_189_1.png)\n\
  \n图6.6 – “渲染为波形文件”选项\n\n将出现一个包含各项选项的窗口菜单，如下面的截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_190_0.png)\n\
  \n图6.7 – 渲染混音器轨道窗口\n\n- 4. 调整模式，以指明你要渲染的是样式还是歌曲。样式指的是所选的一段音符乐句，而歌曲指的是整个编排。\n\n-\
  \ 5. 点击开始。通道机架中的乐器将播放 MIDI 音符，混音器将录制声音，从而创建音频样本。随后，这段音频将输出为一个样本，可以放入播放列表中：\n\n![](img/e7035ac7133980a2ff428c56c901384d_190_1.png)\n\
  \n图6.8 – 输出波形\n\n然后，你可以双击播放列表中的样本，以访问反转样本控制项：\n\n![](img/e7035ac7133980a2ff428c56c901384d_191_0.png)\n\
  \n图6.9 – 反转渲染后的音频样本\n\n利用渲染为音频技术，你可以将混音器中带或不带效果的任意声音转换为样本，然后进行反转。\n\n## 减慢、加快和突然变速\n\
  \n音频速度的变化可能是出乎意料的事件。放慢的音乐往往是非常恐怖的声音，尤其是同时伴随音乐音高下降时。\n\n更改样本速度与更改整首歌曲的速度方法不同。如果你想更改样本速度并使其保持在新速度，请左键双击该样本，然后更改**音高**和**时间**值，如下面的截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_192_0.png)\n\n图6.10 – 更改样本的速度和音高\n\n\
  这种方法会改变歌曲中某一特定时刻的速度。然而，它并不能随时间逐渐自动化样本的速度和/或音高变化。\n\n如果你想随时间改变速度，你需要为整个项目更改速度。你可以通过右键单击项目速度并选择**创建自动化剪辑**来实现。\n\
  \n这将允许你调整速度以加快或减慢歌曲，如下面的截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_193_0.png)\n\
  \n图6.11 – 自动化速度\n\n通过自动化，你可以随时间增加或减少歌曲的速度，如下面的截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_193_1.png)\n\
  \n图6.12 – 自动化速度\n\n在上面的截图中，我们可以看到歌曲的速度随时间加快。你也可以自动化为相反效果，让歌曲随时间减慢，并且可以在整首歌中设置多次变化。\n\
  \n## 混响、失真、故障效果和延迟\n\n混响、失真、故障效果和延迟等效果是可用来创造非自然声音的工具。通常，目标是使用恰到好处的混响和延迟来支撑现有声音，而不让效果引起注意，但如果你试图创造奇异超凡的声音，情况就不同了。尽情发挥，调高混响、延迟、失真或你能想到的任何其他效果。\n\
  \n我们已经讨论了制造恐怖音乐的技术和效果。但还缺少一个重要元素——使用哪些音符来配合乐器，以创造令人毛骨悚然的恐怖音乐。接下来让我们学习这一点。\n\n##\
  \ 恐怖与惊悚音乐的音符组合\n\n某些音符组合听起来熟悉而舒缓，但另一些组合可能听起来非常陌生且令人不安。在本节中，我们将讨论可用于创作恐怖或惊悚音乐的音符组合。我们将讨论的技术包括以下内容：\n\
  \n- 恐怖高音与恐怖低音的组合叠加\n- 小调中的音符\n- 冲突音符\n- 错误音符\n- 按固定比率递增音符\n\n## 恐怖高音与恐怖低音的组合叠加\n\
  \n一种非自然且常被认为恐怖的情况是，同时将高音与低音配对，而中间频率相对较少。这在自然中并不常见。通常，一个声源产生的噪音涵盖了低频率、高频率或整个频谱。但你很少会听到来自单一声音源只有低频和高频、中间却没有任何内容的声音。\n\
  \n这种罕见的声音会让你的耳朵竖起并注意，因为它们听到了一些本不该预期到的声音。要创造这种效果，请将主要频率较低的乐器与主要频率较高的乐器叠加。\n\n\n\n\
  \n\n## 小调中的音符\n\n小调中的音符给人一种悲伤或可怕的感觉。如果用柔和的乐器演奏，会显得悲伤或美丽。如果用阴森的乐器演奏，则会显得毛骨悚然。\n\n\
  ## 冲突的音符\n\n如果你想制造惊吓效果，需要一种能突然跳出来抓住听众注意力的声音，可以考虑使用冲突的音符。冲突的音符是极不和谐的音符。\n\n具体来说，冲突的音符组合包括以下内容：\n\
  \n- 同时演奏一个根音和相隔三个全音的音符。例如在以下截图中所示：\n\n    ![](img/e7035ac7133980a2ff428c56c901384d_195_0.png)\n\
  \n    Figure 6.13 – Three whole tones apart\n\n    在前面的截图中，我选择了一个相隔三个全音的音符组合——在这个例子中是\
  \ C 和 F♯。只要保持三个全音的距离，你可以使用任何音符。\n\n- 同时演奏相隔一个半音的任意两个音符，如以下截图所示：\n\n    ![](img/e7035ac7133980a2ff428c56c901384d_195_1.png)\n\
  \n    Figure 6.14 – A semitone apart\n\n    在前面的截图中，你可以看到两个音符 C 和 B，相隔一个半音。这些音符示例并不局限于直接相邻，也可以分布在不同的八度上。\n\
  \n## 错误的音符\n\n在大多数音乐中，我们期望歌曲保持在给定的调性内。调内的音符彼此和谐。这听起来很愉快。如果你想采取相反的做法，可以创作令人不愉快的音乐。演奏不属于给定调性的错误音符，或者甚至可以考虑从一个调性的音符开始，然后逐渐偏离该调性进入混乱的境地。\n\
  \n如果你想生成混乱、随机的音符，FL Studio Piano roll 有一个名为 **Randomize** 的工具，专为创建随机的音符变化而设计。\n\n\
  以下步骤说明如何即时生成随机音符：\n\n- 1. 选择一个模式并打开 Piano roll。\n- 2. 选择 **Tools | Randomize** 选项，如以下截图所示：\n\
  \n    ![](img/e7035ac7133980a2ff428c56c901384d_196_0.png)\n\n    Figure 6.15 – Randomize\n\
  \n- 3. **Randomize** 工具将会出现。选择 **Seed** 按钮，如以下截图所示：\n\n在尝试随机化设置并选择 **Accept** 后，你会看到随机音符被生成，如以下截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_198_0.png)\n\nFigure 6.17 – Random notes\n\
  \n如果你不喜欢当前版本的音符，可以一直按随机化器的 **Seed** 按钮来生成新的随机变化。\n\n## 按固定比率递增\n\n如果你喜欢创造听起来混乱的不规则音符组合，有多种方法可以实现。通常，插入随机性会达到你想要的效果。但如果我们不想承受随机弹奏音符带来的完全混乱呢？有没有一种可重复的方法来创建仍然听起来不和谐但更连贯的音符？有的。\n\
  \n大多数音阶都局限于单一八度内的音符。音符的限制为歌曲提供了结构，并使旋律对听众来说可预测。\n\n如果你想要听起来不寻常、与众不同的效果，可以考虑按恒定间隔递增。例如，全音音阶使用按全音递增的音符。以下三个截图显示了按固定间隔比率递增的示例：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_199_0.png)\n\nFigure 6.18 – Incrementing\
  \ by whole tones\n\n前面的截图显示了按两个半音递增，也称为全音。\n\n你可以用很多方式选择不同的固定间隔。以下截图显示了按三个半音递增时会得到什么：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_199_1.png)\n\nFigure 6.19 – Incrementing\
  \ by three semitones\n\n在所有这些示例中，我使用 C 作为根音，但你可以使用任何音符作为根音。以下截图显示了按四个半音递增时会发生什么：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_200_0.png)\n\nFigure 6.20 – Incrementing\
  \ by four semitones\n\n使用按固定比率递增的音符组合会产生非常奇怪的声音。如果在合适的乐器上演奏，它会显得相当阴森。\n\n到目前为止，我们已经学习了如何创作吓唬观众的音乐以及如何设计惊吓效果。它由阴森的音乐渐进组成，随后短暂安静下来营造期待感，然后以可怕的声音大揭露来震惊观众。\n\
  \n我们学习了可用于震惊听众的声音、用于创造阴森声音的技术和效果，以及可用于创造可怕或阴森音乐的音符组合。在创作可怕音乐时，我们关注的是不和谐的声音——即它们相互冲突、不协调，并且出乎意料且不熟悉。\n\
  \n现在，让我们进入更熟悉的音乐领域，学习如何为特定情绪创作音乐。\n\n## 为特定情绪创作音乐\n\n电影中的某些场景需要特定的情绪。作为电影作曲家，你很可能会被告知场景所需的情绪类型。然后你的任务就是弄清楚如何为该情绪创作音乐。\n\
  \n本节中的技术旨在作为为特定情绪创作音乐的一般指导方针。它们并不是硬性规则；有很大的实验空间。但如果你需要一个起点，这些指导方针应该能帮你开始。\n\n有许多技术可以为给定情绪创作音乐。你可能想先研究其他项目中类似情绪的歌曲是如何制作的，或者你可以查看各种音阶，看看是否有一种能提供接近你目标情绪的声音。\n\
  \n如果你想查看一些音阶，可以查看网站 `https://femurdesign.com/omni/`，它允许你快速探索各种音阶的声音。以下截图显示了该网站上的\
  \ OMNI 工具：\n\n![](img/e7035ac7133980a2ff428c56c901384d_201_0.png)\n\nFigure 6.21\
  \ – OMNI\n\nOMNI 允许你快速浏览音阶并查看给定调性中的音符听起来如何。顶部是所选音阶，你可以通过它进行导航。左侧有一个和弦轮，允许你为音阶选择根音。右侧是一个控制器，让你控制音效的混响和延音量。底部有一个键盘，允许你在音阶中演奏音符。\n\
  \n如果你想快速浏览一些音阶并听听它们的声音，这个网站非常方便。\n\n## 创作快乐的音乐\n\n快乐的音乐构成了你在广播中听到的音乐的大部分。如果你查看排行榜上的热门歌曲，其中大部分都是大调音阶。为什么？大调音阶被听众认为是快乐的声音。快乐的音乐让人感到快乐，而人们喜欢感到快乐。在本节中，我们将看看创作快乐音乐的技巧。\n\
  \n> **如果你想知道为什么大调音阶听起来快乐，请查看 Adam Neely 的以下视频：**\n> \n> `https://www.youtube.com/watch?v=9rEqrPwVITY&ab_channel=AdamNeely`\n\
  \n创作快乐情绪音乐时应考虑以下技巧：\n\n- **大调式 – Ionian、Lydian 和 Mixolydian：** 歌曲是否听起来快乐最重要的因素是音符选择。有三种调式非常适合创作听起来快乐的音乐。它们是\
  \ **Ionian、Lydian** 和 **Mixolydian** 调式。如果你想快速创作快乐音乐，请选择适合这些音阶的音符。如果你需要复习，我们在 *Chapter\
  \ 3, Designing Music with Themes, Leitmotifs, and Scales* 中详细讨论了调式。\n\n- **活泼的节奏\
  \ – 不一定快但活泼：** 快乐的音乐通常具有活泼的节奏。如果你边走边听音乐，你可能会注意到你的步伐往往与你听的歌曲节奏一致。这不是巧合。你的身体会本能地对周围环境做出反应。慢音乐让你想放慢速度，快音乐让你想加快速度。\n\
  \n    在快步行走时，人类心脏大约每分钟跳动 110–120 次。如果你希望听众以步行速度移动，请瞄准这个范围。如果你希望听众移动得更快，可以增加节奏。大多数电子舞曲的节奏通常在\
  \ 124–130 bpm 范围内。这是配合歌曲节拍步行、跳舞或慢跑时不错的速度。\n\n- **偏好硬声而非柔声：** 冲击力强的声音比柔和、起音慢的声音传递更多能量。鼓和打击乐器通常是更硬、更有冲击力的声音。因此，如果你的歌曲缺乏能量，可以考虑加入一些鼓或更多打击乐声音。\n\
  \n\n\n\n\n## 用音乐影响情绪与设计情感化音乐\n\n> **注意**\n>\n> 如果你想获取更详细的乐理教程，以便更深入地掌握挂留和弦，可以访问\
  \ Michael New 的这个 YouTube 频道：https://www.youtube.com/c/MichaelNew/featured。其中包含大量关于和弦理论以及挂留和弦构成的深入讲解。\n\
  \n- **慢速节奏：** 悲伤的音乐通常伴随着较慢的速度。请记住，一个人快走时的平均心率约为每分钟 110–120 次。如果你想要更悲伤的音乐，那么速度应该设定得比快走时的心率更慢。\n\
  \n  即使一首曲子是小调，速度也会影响其效果。由汉斯·季默创作的《加勒比海盗》系列电影主题曲就是一个例子。季默曾好奇，如果用**小调**谱写这首歌并加快速度，结果会怎样。结果，这首歌听起来更有活力，如今已成为该系列电影的主题曲。《加勒比海盗》的主题曲虽然是小调，但听起来并不悲伤。快速的速度和\
  \ 6/8 拍号创造了一种全新的感觉。如果你想创造出独特的风格，不妨考虑改变速度或拍号会对音乐的感觉产生怎样的影响。\n\n- **音符之间留出大量空间：**\
  \ 对于快歌，你可以塞入大量音符，因为它们会被快速演奏。而对于较为悲伤的慢歌，你希望让音符持续更久，把它们拉长。\n\n- **让音符持续延音：** 在缓慢、悲伤的歌曲中，你可以充分利用氛围音效。这是长音持续音、拉长的铺底音色、弦乐以及持续钢琴音符大展身手的好地方。\n\
  \n- **混响：** 如果你希望声音悠长而延绵，首先想到的应该是混响。混响是一种模拟空间内回声效果的效果器，能让你的声音延音更久。\n\n- **给每件乐器留出空间：**\
  \ 在舞曲中，你会在不同乐器之间快速切换，依靠节奏相互呼应。而在悲伤的歌曲中，你不需要同时塞入大量乐器。你可以在乐器切换时给它们留出空间，也有机会让独奏乐器尽情发挥，绽放光彩。\n\
  \n- **用颤音增添额外情感：** 通过使用颤音，可以使长音更具表现力。如果你使用弦乐器，颤音是一种有用的演奏技法，可以在需要强调情感时使用。\n\n- **连奏技法：**\
  \ 在快节奏音乐中，你依赖打击乐器带来的干脆音色。而在悲伤音乐中，你希望声音彼此融合。连奏技法可以让你创造出这种效果。\n\n- **柔和的乐器音色：** 如果你希望音符之间相互融合，就需要考虑使用那些天然就能融为一体的乐器。在悲伤音乐中，你希望使用音色柔和的乐器。小提琴、大提琴等弦乐器是绝佳选择。\n\
  \n- **下行走向：** 上行音符进行往往与昂扬、欢快的旋律相关。而下行音符进行（通常是下行的低音线条）则与较为悲伤的旋律相关。\n\n我们已经学习了创作悲伤音乐的技巧。接下来，让我们学习如何创作浪漫音乐。\n\
  \n### 创作浪漫音乐\n\n浪漫音乐是快乐与悲伤音乐的结合。它行走于两者之间的中线，融合两种情绪，既不过于偏向悲伤，也不过于偏向快乐。悲伤的元素让听者感到沉思与沉重，而快乐的元素则让听者感到愉悦与轻盈。\n\
  \n以下技巧可用于创作浪漫音乐。\n\n- **小调调式——伊奥利亚、弗里吉亚、多利亚、洛克里亚：** 小调调式常与悲伤联系在一起，但也可以与美感相关联。大多数浪漫音乐都以小调调式创作。\n\
  \n- **弦乐器和轻柔的打击乐器：** 弦乐器具有极强的表现力，它们允许你在拉长的音符上使用颤音技法。大提琴和小提琴常常与浪漫音乐联系在一起。小提琴可以表现出翱翔于管弦乐队之上的旋律，这在许多浪漫作品中效果颇佳。竖琴、钢琴等柔和的打击乐器也非常适合浪漫音色。总的来说，你应该避免使用生硬、冲击力强的打击乐音色。\n\
  \n- **连奏与颤音：** 通常，你应当倾向于使用彼此融合、悠长而富有表现力的音符。连奏技法能让你将音符无缝地衔接在一起。你也可以通过颤音让悠长的音符更具表现力。\n\
  \n- **慢速节奏：** 浪漫作品通常采用较慢的速度。\n\n我们已经学习了如何创作浪漫音乐。接下来，让我们学习如何制造张力。\n\n### 制造张力 / 为预告片创作史诗音乐\n\
  \n到目前为止，我们专注于特定的情绪：快乐、悲伤和浪漫。如果你的歌曲需要充满能量和张力，该怎么办？如果你在为电影预告片作曲，有时你需要创作所谓的**史诗音乐**。这种音乐通常是预告片所需要的。史诗音乐是让人感到强大而激烈的音乐。\n\
  \n以下是一些在场景中营造紧张感的技巧：\n\n- **大鼓：** 如果你想让音乐听起来宏大而有力，一个快捷方法就是引入大鼓的音色，例如定音鼓、低音鼓、锣、定音鼓和大镲。创建打击节奏，并将鼓声层层叠加。\n\
  \n  加入压缩和混响效果可以让鼓声听起来更宏大。混响是模拟回声的术语。物体所处的空间越大，可能的声反射就越多；乐器和环境越大，回声的机会也就越多。\n\n-\
  \ **贝斯与铜管乐器：** 宏大而深沉的声音传达出规模与深度。如果你想让某件事物更具史诗感，你需要有强劲的低音乐器作为配乐的基础。\n\n  管弦乐中的铜管声部能够传达出强有力的声音，因此你可能需要考虑加入这一声部的乐器。圆号往往能穿透混音并脱颖而出。铜管乐器家族包括小号、法国号、长号和低音大号。\n\
  \n- **低沉浑厚的声音：** 如果你想传达宏大场景的规模和尺度，就需要深沉低音。为此，寻找大型乐器或模拟它们的声音。大型乐器会产生更大的混响，因此你需要找到支持该声音的混响效果。\n\
  \n- **谢泼德音调：** 在电影《敦刻尔克》中，作曲家汉斯·季默在其大部分配乐中使用了被称为“谢泼德音调”的技巧，这部电影曾因其音乐获得奥斯卡提名。谢泼德音调用来描述一种似乎永无休止的上升音高，它不断攀升，永不停歇。\n\
  \n以下截图展示了谢泼德音调波形示例：\n\n![](img/e7035ac7133980a2ff428c56c901384d_207_0.png)\n\n图\
  \ 6.22 – 谢泼德音调\n\nhttps://upload.wikimedia.org/wikipedia/commons/4/48/Shepard_Tones_spectrum_linear_scale.png\n\
  \n创建谢泼德音调并不像提高声音频率那么简单。如果你把声音频率提高到足够高，耳朵就无法再听到这个声音了。相反，谢泼德音调的原理是：当声音频率接近高值时，它开始逐渐消失；同时，一个新的低频声音逐渐浮现，取代高频声音。这种方式让人感觉音高在持续攀升。\n\
  \n如果你想更多了解谢泼德音调，可以观看 VOX 关于谢泼德音调的视频《让《敦刻尔克》如此紧张的声音错觉》(https://youtu.be/lvWTQcZbLgY)。\n\
  \n- **丰满的和声：** 将你的声音分层。如果你奏出一个音符，可以加倍演奏，或与多种乐器在不同的八度上演奏同一个音。注意低频端，力量感通常来自那里。通过分层，你可以创造出强大而包罗万象的声音墙。\n\
  \n- **对比：** 在平静与激烈的时刻之间转换。如果之前出现的是平静得多的内容，那么后来的声音会显得更加激烈。更激烈的场景通常有更多的打击乐和扑面而来的贝斯音色。因此，你通常需要在这些激烈时刻到来之前逐步铺垫，而不是一开始就直接进入高潮。\n\
  \n\n\n\n"
- "# 第 7 部分：使用 Wwise 为视频游戏创建交互式音乐\n\n本章将为您介绍如何为视频游戏创建交互式音乐。您将了解什么是交互式音乐以及 **水平重排序**\
  \ 和 **垂直重混音** 的技术。\n\n我们将通过使用 **Wave Works Interactive Sound Engine (Wwise)** 音频引擎软件来实现这一点，该软件允许您自定义音乐在视频游戏中的集成方式。在\
  \ Wwise 中，我们将下载一个预先构建好音效和音乐的演示游戏。使用该演示游戏，我们将了解如何应用交互式音乐技术。最后，我们将学习如何在 FL Studio\
  \ 中创建用于垂直重混音的音乐。\n\n在本章中，我们将涵盖以下主题：\n\n- 什么是交互式音乐？\n- 开始使用 Wwise\n- 了解水平重排序\n- 在\
  \ Wwise 中实现水平重排序\n- 了解垂直重混音\n- 在 Wwise 中实现垂直重混音\n- 在 FL Studio 中创建用于垂直重混音的音乐\n\n\
  ### 什么是交互式音乐？\n\n视频游戏需要制作大量的音乐。游戏中发生的任何事情都可能需要音效。其中许多音效会在游戏过程中发生变化。对于每个环境和关卡，您可能希望考虑创建能够适应玩家操作的音乐。\n\
  \n以下是您在为视频游戏作曲时可能需要考虑的游戏音效列表：\n\n- 预告片\n- 角色\n- 按钮点击\n- 菜单\n- 加载关卡屏幕\n- 进入新关卡\n\
  - 完成关卡\n- 每个 Boss 的音乐\n- 进入新房间\n- 获得物品\n- 成就\n- 环境的环境音\n- 战斗音效\n- 过场动画\n- 游戏内角色正在收听的音乐\n\
  - 胜利\n- 失败\n\n为了创建交互式音乐，您需要工具来告诉游戏何时更改音乐。一些游戏构建软件内置了创建交互式音乐的工具，而且游戏引擎的工具每年都在改进。目前，如果您想要对一切进行精细控制，您可能需要学习专门用于创建交互式音乐的中间件软件。\n\
  \n市场上有多款用于创建交互式音乐的中间件软件。其中最受欢迎的两款是 Wwise，可在 `https://www.audiokinetic.com/` 获取，以及\
  \ FMOD，可在 `https://www.fmod.com/` 获取。这两种软件示例允许您操纵视频游戏的音频，并与 Unity 和 Unreal Engine\
  \ 等游戏开发软件具有集成支持（目前是两款最大的游戏开发软件）。\n\n这两种音频引擎软件都非常出色，如果您从事视频游戏音效集成工作，很可能会需要使用 Wwise\
  \ 或 FMOD。\n\n以下屏幕截图显示了 Audiokinetic 网站上的 Wwise：\n\n![](img/e7035ac7133980a2ff428c56c901384d_211_0.png)\n\
  \n图 7.1 – Audiokinetic 的 Wwise\n\n在本章的示例中，我们将使用 Wwise，因此要跟随示例，您需要下载该软件。您可以在 `https://www.audiokinetic.com/`\
  \ 下载 Wwise。\n\n### 开始使用 Wwise\n\n让我们安装一个随 Wwise 提供的演示游戏，以便我们可以了解交互式音乐如何被使用。\n\n\
  先说一下，接下来的步骤相当繁琐。刚开始使用 Wwise 时感到有点吃力也不要觉得不好意思。第一次接触时，它是一个相当复杂的软件，需要花时间理解：\n\n1. 下载\
  \ Audiokinetic 网站上的安装程序后，您会看到一个提示下载最新版本的窗口。\n\n    ![](img/e7035ac7133980a2ff428c56c901384d_212_0.png)\n\
  \n    图 7.2 – Wwise 启动器\n\n2. 选择 Install... 按钮后，您会看到以下窗口：\n\n    图 7.3 – 安装示例\n\n\
  3. 确保勾选 **Samples** 以获取演示文件。然后，选择您想要部署的平台。\n\n    在本例中，我使用的是 Windows 电脑，因此我选择了 **Windows**。然后，选择您希望在电脑上下载软件的位置。\n\
  \n4. 在前面的屏幕截图中，我同时下载了 Cube 游戏以及一些我鼓励您查看的其他演示示例。对于本章的目的，我们将使用 **Cube (Demo)** 游戏，因此请确保勾选此选项。\n\
  \n5. 接下来，它会询问您是否要安装任何附加插件。对于我们的演示目的，我们不会添加任何额外插件。\n\n    ![](img/e7035ac7133980a2ff428c56c901384d_214_0.png)\n\
  \n    图 7.4 – 安装 Wwise 软件\n\n6. 点击 Install。Wwise 和示例游戏将开始下载。\n\n7. 安装完成后，在 Wwise\
  \ 启动器中，进入 **SAMPLES | Wwise** 并找到 Cube 游戏，如以下屏幕截图所示：\n\n    ![](img/e7035ac7133980a2ff428c56c901384d_215_0.png)\n\
  \n    图 7.5 – 定位 Cube 游戏\n\n    在前面的屏幕截图中，您可以看到有多个 Wwise 示例可用。对我们最重要的就是 Cube 游戏。\n\
  \n8. 我鼓励您通过选择 **Run Cube** 选项来游玩 Cube 游戏。这将加载一个完全可用的游戏。以下屏幕截图显示了游戏的示例画面：\n\n   \
  \ ![](img/e7035ac7133980a2ff428c56c901384d_216_0.png)\n\n    图 7.6 – Cube 游戏玩法\n\
  \n    花点时间在 Cube 中尝试一下，以了解游戏玩法。它是一款第一人称射击风格的游戏。您使用键盘上的 W、A、S 和 D 键移动，并使用鼠标环顾四周和射击。\n\
  \n9. 如果您按下键盘上的 Esc，您可以跳转到不同的地图或退出游戏，如以下屏幕截图所示：\n\n    ![](img/e7035ac7133980a2ff428c56c901384d_217_0.png)\n\
  \n    图 7.7 – 退出 Cube\n\n我们对游戏演示有了大致了解。现在是时候看看 Wwise 如何在游戏中运用音乐了：\n\n1. 返回 Wwise\
  \ 启动器，进入 SAMPLES 并选择 Open in Wwise (64-Bit) 选项，如以下屏幕截图所示：\n\n    ![](img/e7035ac7133980a2ff428c56c901384d_217_1.png)\n\
  \n    图 7.8 – 在 Wwise 中打开 Cube\n\n    这将打开 Cube 游戏到 Wwise 中。\n\n我们打开了 Cube 演示游戏到\
  \ Wwise 中。您会发现它已填充了演示用的音效，因此已经为我们设置好了大量内容可以查看。\n\n如果您查看 Project Explorer，您会看到 Audio\
  \ 和 Events 选项卡。Audio 包含游戏中加载的所有音频样本。Events 列出了触发音频样本播放的事件。\n\n在前面的屏幕截图中，我们可以看到 Audio\
  \ 选项卡当前处于选中状态。音频文件夹中可以加载和播放声音样本。如果您展开文件夹并探索一下，您会发现游戏中当前正在使用的大量音效，如以下屏幕截图所示：\n\n\
  ![](img/e7035ac7133980a2ff428c56c901384d_219_0.png)\n\n图 7.11 – 播放声音\n\n您可以通过左键单击选择任意声音，然后按空格键来收听。选择音频样本会打开\
  \ Sound Property Editor，您可以在其中对声音进行调整，例如更改音高或添加滤波器和效果。\n\n**Events** 选项卡列出了事件触发器，用于发出游戏应执行操作的信号，例如播放特定音频文件。以下屏幕截图显示了\
  \ **Events** 选项卡：\n\n![](img/e7035ac7133980a2ff428c56c901384d_220_0.png)\n\n图 7.12\
  \ – Events 选项卡\n\n当游戏中触发事件时，您会告诉它播放 **Audio** 选项卡文件夹中加载的声音。事件最初是在游戏设计引擎中创建的。换句话说，事件是在\
  \ Unreal Engine、Unity 或您使用的任何游戏引擎中创建的。在游戏引擎中，您会指定事件链接到 Wwise。执行此操作的步骤因游戏引擎而异，因此该主题超出了本章的范围。幸运的是，对于我们的示例，Cube\
  \ 游戏已经为我们创建了事件。\n\n在以下屏幕截图中，我们可以看到 **ItemHealth100** 事件被告知播放 **Item_Magic** 和 **Health_Cue**\
  \ 音频，这些文件存在于 **Audio** 选项卡文件夹中：\n\n\n![](img/e7035ac7133980a2ff428c56c901384d_221_0.png)\n\
  \n图 7.13 – 触发事件播放音频\n\n对于游戏中的每个事件触发器，你都可以指定一个音频采样让该事件播放。在右侧，你还可以为音频文件分配播放概率，使其有时才播放音频，以免变得过于重复。\n\
  \n为游戏创建新音效需要你知道事件名称。因此，你需要列出你想要触发的事件的确切名称拼写列表。\n\n事件是在游戏本身中创建的，而你在 Wwise 中使用相同的名称，所以如果你正在处理一个实际的游戏，你需要与开发人员协调，以确定应该使用哪些事件名称。\n\
  \n我们已经学习了声音和事件在 Wwise 中工作的基本原理。Wwise 是一个庞大的主题，完全学习它需要一本书。本章的目标是专注于学习交互式音乐，而不是学习\
  \ Wwise 的所有内容。所以，让我们深入到第一个交互式音乐主题：水平重排序。\n\n## 理解水平重排序\n\n水平重排序允许你无缝地在音乐曲目之间切换，将多个歌曲音轨组合起来，使其感觉像一首歌曲。\n\
  \n如果没有水平重排序，你会播放一首音乐曲目，然后等到它结束后再播放下一首。这听起来会很突兀，并在玩家玩游戏时将他们从当下抽离。如果你想要自然而沉浸的体验，通常希望音乐感觉是从一首歌流畅地过渡到下一首，而没有突然的间断。\n\
  \n此外，如果你反复播放完全相同的歌曲，它会显得非常重复并让听众感到厌倦。水平重排序允许你在音频采样之间切换，并在选择下一首歌曲音轨时添加随机变化。\n\n水平重排序有助于在歌曲片段之间切换。如果做得正确，听众不会意识到他们听了几个不同的片段。它会感觉像一首连贯的歌曲，具有变化，可以无限循环。\n\
  \n## 在 Wwise 中实现水平重排序\n\nCube 演示版内置了水平重排序的示例。让我们花点时间看看 Cube 游戏是如何使用水平重排序的：\n\n-\
  \ 1. 进入交互式音乐布局，如以下屏幕截图所示。你也可以按 F10 来访问此布局：\n\n![](img/e7035ac7133980a2ff428c56c901384d_222_0.png)\n\
  \n图 7.14 – 交互式音乐\n\n- 2. 在交互式音乐层级下，选择 Combat 文件夹。\n\n- 3. 选择 Combat 文件夹后，按空格键，你会听到音乐开始播放。注意在音乐播放列表编辑器中，当前播放音轨旁边会出现一个小黄箭头。随着音乐播放，它会从一个音轨切换到下一个，如以下屏幕截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_223_0.png)\n\n图 7.15 – 水平重排序\n\n音乐依次播放\
  \ **Combat-A** 和 **Combat-B**。然后，有 50% 的概率会播放 **Combat-Bridge**，然后有 50% 的概率会播放 **Combat-TransToBridge**\
  \ 和 **Combat-Bridge** 音轨。\n\n游戏正在播放一个循环，但是一个根据设定概率变化的循环。有时它只播放 **Combat-A** 和 **Combat-B**\
  \ 音轨。有时它会播放 **Combat-Bridge**，有时会播放 **Combat-TransToBridge** 和 **Combat-Bridge**\
  \ 音轨。以这种方式播放音乐有助于为听众创造一些音频的随机变化。\n\n音乐片段可以从 **Audio** 选项卡拖放到 **Music Playlist Editor**\
  \ 中。然后你可以指定歌曲播放的顺序和概率。\n\n你可能会想知道在 **Music Playlist Editor** 中出现的一些术语是什么意思：\n\n\
  - **Weight** 表示播放该音轨的概率。你可以分配概率来随机化音轨是否在序列中接下来播放。\n- **Loop Count** 表示序列组在继续之前应重复播放多少次。\n\
  - **Sequence Continuous** 表示它会将序列组中的所有音轨一个接一个地播放。\n- **New Group** 允许你添加包含音乐片段播放的条件。你可以在顺序播放（按顺序播放）或根据你分配的权重添加一些随机性来决定何时播放音轨之间进行选择。以下屏幕截图显示了一个示例。\n\
  - **Random Step** 允许你在选项之间随机选择。在以下屏幕截图中，这意味着它可能会切换到 **Combat-Bridge** 或 **Combat-TransToBridge**\
  \ 音轨：\n\n![](img/e7035ac7133980a2ff428c56c901384d_224_0.png)\n\n图 7.16 – 音乐播放列表编辑器显示水平重排序\n\
  \n只要视频游戏中存在循环，就有机会使用水平重排序创建随时间变化的音乐，为听众创造一些音乐变化。正确使用时，你的音乐会感觉不那么重复。\n\n我们已经看到了 Wwise\
  \ 中如何进行水平重排序的示例。接下来，让我们学习关于垂直混音。\n\n## 理解垂直混音\n\n根据任何给定关卡中发生的事件，你可以打开或关闭歌曲的音层。这与你在\
  \ FL Studio 中分层乐器并打开/关闭音层的方式非常相似。\n\n**垂直混音** 是描述你在游戏运行时混合不同音频音层的方式的术语。在垂直混音中，你有一系列歌曲中的音频片段，你根据游戏中设定的条件选择播放或不播放。\n\
  \n例如，当你进入一个关卡时，一首歌曲开始播放，带有简单的旋律。当你遇到敌人时，新的旋律和乐器会在原有旋律之上叠加。这是同一首歌，但你只是打开了额外的音乐音层。\n\
  \n## 在 Wwise 中实现垂直混音\n\n你可以通过多种技术进行垂直混音。Wwise 允许你使用状态、开关、实时参数控制和触发器。这些都是你可以在 Wwise\
  \ 中使用的控制。任何这些方法都可用于打开或关闭音频。\n\n你只需要满足某些条件，以便你可以启用歌曲音层的打开或关闭。你还希望在打开和关闭音频音层之间平滑过渡，以便声音变化是逐渐的，而不是突然的。\n\
  \n在以下示例中，我们将继续使用 Cube 演示项目。我们将创建一个新的开关，然后告诉我们的音乐根据开关的值打开或关闭。最后，我们将学习如何通过淡入淡出音层来平滑地过渡音乐音层的打开和关闭。\n\
  \n让我们学习如何在 Wwise 中实现垂直混音：\n\n- 1. 首先，确保你处于 **Interactive Music** 布局，如以下屏幕截图所示。你也可以按\
  \ F10 来访问此布局。如果你在示例过程中发现缺少某些面板，请检查你是否处于 **Interactive Music** 布局，因为离开此布局可能会导致面板无法显示在屏幕上：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_226_0.png)\n\n图 7.17 – 交互式音乐布局\n\n- 2.\
  \ 我们需要创建一个开关。在 Game Syncs 选项卡中，右键单击 Music 并创建一个新的开关组，如以下屏幕截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_227_0.png)\n\
  \n图 7.18 – 创建开关组\n\n- 3. 为其命名；在我的例子中，我将其命名为 Energy_Level。右键单击开关组，然后创建至少两个新开关并为其命名。在我的例子中，我将它们命名为\
  \ High_Energy 和 Low_Energy。以下屏幕截图显示了创建开关的示例：\n\n![](img/e7035ac7133980a2ff428c56c901384d_227_1.png)\n\
  \n图 7.19 – 创建开关\n\n你已经创建了一个开关组并在其中添加了开关。现在我们需要将我们的音乐片段连接到开关。\n\n- 4. 在 Audio 选项卡中，找到一个音乐片段。在我的例子中使用\
  \ Cube 演示游戏，我选择了一个预先存在的吉他乐器片段，如以下屏幕截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_228_0.png)\n\
  \n图 7.20 – 选择吉他片段\n\n- 5. 双击音乐片段。在前面的屏幕截图中，我选择了 Combat-A-Gtr1_138bpm4-4_L8M-P0。这将打开音乐音轨属性编辑器。\n\
  \n- 6. 在音乐音轨属性编辑器中，导航到 General Settings 选项卡。将 Track Type 设置为 Switch，Group 设置为开关容器名称，在我的例子中是\
  \ Energy_Level，以及默认开关状态，在我的例子中是 Low_Energy。这些是你刚刚创建的开关的名称。以下屏幕截图显示了一个示例：\n\n\n\n\
  ![](img/e7035ac7133980a2ff428c56c901384d_229_0.png)\n\nFigure 7.21 – Setting Track\
  \ Type, Group, and Default Switch/State\n\n我们已启用分段以使用开关。现在需要告诉 Wwise 根据开关值播放什么音频。\n\
  \n7. 在 Music Segment Editor 中，右键单击要连接到开关的音频轨道旁边的按钮，选择 Set Association，并选择要用于播放音频的开关值，如以下屏幕截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_229_1.png)\n\nFigure 7.22 – Connecting\
  \ audio with a switch\n\n8. 对要连接到开关的每个音频剪辑重复步骤 7。\n\n![](img/e7035ac7133980a2ff428c56c901384d_230_0.png)\n\
  \nFigure 7.23 – Audio\n\n连接音频剪辑与开关后，您应该会在音频剪辑上看到开关标签的名称，如前一屏幕截图所示。\n\n9. 让我们测试一下我们的开关是否正常工作。通过在\
  \ Music Segment Editor 中左键单击要收听的剪辑的 S 按钮来单独播放音频剪辑。按下空格键。您会听到音乐分段播放分配给默认开关值的音频。\n\
  \n10. 让我们使用我们的开关并听听音频如何变化。在 Transport Control 面板中，导航到 Switches 选项卡。您将看到刚刚创建的开关容器和开关。在我的例子中，开关容器名称为\
  \ Energy_Level，默认开关状态设置为 Low_Energy。\n\n11. 当您按下空格键收听音乐分段时，左键单击以下屏幕截图所示的下拉框，并在以下屏幕截图所示的开关值之间切换：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_231_0.png)\n\nFigure 7.24 – Transport\
  \ Control\n\n音乐分段会根据开关值播放音频剪辑。如果开关设置为 Low_Energy，则会播放连接到 Low_Energy 的音频剪辑。\n\n恭喜，我们的音乐已实现垂直混音！根据开关状态，不同层的音频现在会打开或关闭。这可以在任何想要音乐根据游戏活动变化时使用。\n\
  \n音乐目前在更改开关值时变化非常突然。如果音乐逐渐淡入淡出会听起来更好。让我们学习如何做到这一点。\n\n- 1. 在 Music Track Property\
  \ Editor 中，选择 Transitions 选项卡。\n- 2. 在列表中选择名为 Transition 的项目。\n- 3. 将 Exit source\
  \ at 设置为 Next Bar 值。\n- 4. 确保已勾选 **Fade-out** 和 **Fade-in**。如果您想编辑淡入或淡出所需的时间，可以选择\
  \ **Fade-out** 和 **Fade-in** 按钮旁边的 **Edit…** 按钮并调整时间。\n\n![](img/e7035ac7133980a2ff428c56c901384d_232_0.png)\n\
  \n*Figure 7.25 – Music Track Property Editor transitions*\n\n如果您播放音乐分段并在 **Transport\
  \ Control** 面板中更改开关值，您会听到剪辑逐渐打开和关闭，淡入淡出。\n\n我们的音乐现在在音乐层之间优雅地过渡。您现在知道如何使用 Wwise 创建垂直混音的音乐。\n\
  \n> **Note**\n> \n> 如果您想要更多示例，*Unlock Audio* YouTube 频道提供了一些很棒的 Wwise 教程：`https://www.youtube.com/watch?v=mi॓XVv3QBaE&ab_channel=UnlockAudio`。\n\
  > \n> 如果您想观看更深入介绍 Wwise 的视频，Audiokinetic 在其 YouTube 频道上提供了其产品的教程：`https://www.youtube.com/channel/UCuv_-Z-CrnYup-N_dVpdCYg`。\n\
  \n我们已经学习了如何在 Wwise 中集成垂直混音的音乐。然而，您可能会想知道我们如何获得彼此完美同步的音乐层。有没有简单的方法可以导出歌曲的层以用于垂直混音？有的。\n"
- '## Creating music for vertical remixing in FL Studio


  为垂直混音准备音乐需要几个步骤。垂直混音是指可以打开和关闭的歌曲剪辑层。我们需要几个同步且听起来和谐的器乐层。


  我们的做法是取 FL Studio 中现有的歌曲并将歌曲的各个部分组织为层。然后导出这些层。


  我们需要创建一系列层组合成一首歌，然后将这些层导出为单独的文件。这些层随后在 Wwise 中重新组合并叠加。


  用于垂直混音的每个音乐层都应听起来不错，并且与其他层同步。至少，这意味着层应使用相同的调性和相同的速度。您在任何给定层中包含的内容由您决定，但您需要提前规划。


  以下屏幕截图显示了在 FL Studio 中为垂直混音创建的歌曲的简化示例：


  ![](img/e7035ac7133980a2ff428c56c901384d_233_0.png)


  Figure 7.26 – Layers in FL Studio


  在前面的屏幕截图中，您可以看到我创建了五个层。有琶音乐器层、合成器层、低音层、鼓层和打击乐效果层。我已将这些层中的所有声音路由到各自的混音器通道轨道，如以下屏幕截图所示：


  ![](img/e7035ac7133980a2ff428c56c901384d_234_0.png)


  Figure 7.27 – Routing each layer to its own mixer track


  在前面的屏幕截图中，我们可以看到五个混音器通道轨道：Arp、Saw Synths、Bass、Drums 和 Percussion FX。它们已被仔细命名。稍后，当我们导出歌曲时，它将使用这些通道轨道的名称，因此能够通过名称识别轨道非常重要。


  导出歌曲时，我们可以导出每个混音器通道作为自己的音频剪辑。这将以与所有其他层相同的长度和时间同步导出歌曲层剪辑。这对于我们稍后重新组合它们很重要。


  让我们学习如何导出适合垂直混音的歌曲：


  - 1. 确保您已正确将轨道路由到混音器通道并为通道命名，以便以后可以识别歌曲层。

  - 2. 准备导出歌曲时，转到 FILE | Export | Wave file...，如以下屏幕截图所示：


  ![](img/e7035ac7133980a2ff428c56c901384d_235_0.png)


  Figure 7.28 – Exporting audio for vertical remixing


  选择保存文件的位置后，您将看到渲染窗口弹出，如以下屏幕截图所示：


  ![](img/e7035ac7133980a2ff428c56c901384d_236_0.png)


  Figure 7.29 – Exporting audio for Vertical Remixing


  - 3. 如果您希望剪辑可循环，请确保已选择 **Wrap remainder**。通常，当您的歌曲播放时，如果您有任何混响效果，这将在歌曲完成后播放并逐渐淡出。如果您只播放一次歌曲，这通常是您想要的。然而，如果您希望歌曲剪辑循环，那么您希望循环末尾的混响在循环第二次开始时播放。这样，您就不会注意到剪辑之间的突然过渡。选择
  **Wrap remainder** 允许这种情况发生。


  如果您选择 **Cut Remainder** 选项而不是 **Wrap remainder**，您会听到歌曲逐渐淡出以及任何淡出的混响。如果您不希望歌曲在结束时突然结束，这可能是可取的。这只是取决于您是否希望在循环再次播放时听到混响。


  另外，需要注意的是，第一次听到歌曲剪辑播放时，您可能不希望在开始时听到结束混响循环。这是一个具体情况，您需要考虑。您可能希望导出两个版本，一个带有 **Wrap
  remainder**，一个带有 **Cut Remainder**，以便同时使用这两个版本。


  - 4. 确保已打开 **Split mixer tracks**。这将为每个混音器通道轨道制作一个新轨道。此选项仅在导出 WAV 文件时可用。如果您看不到此选项可用，请确保已选择
  **WAV**。


  - 5. 选择 **Start**，您的歌曲将被导出。导出后，您会看到 FL Studio 生成了文件列表，如以下屏幕截图所示：


  ![](img/e7035ac7133980a2ff428c56c901384d_237_0.png)


  Figure 7.30 – Files generated


  每个混音器通道轨道都会记录发送到它的音频并创建新的音频轨道。


  在前面的屏幕截图中，您会注意到有突出显示的文件名为 **Vertical Remixing Example_Current** 和 **Vertical Remixing
  Example_Master**。**Vertical Remixing Example_Current** 文件是在主通道上应用任何效果之前的歌曲。**Vertical
  Remixing Example_Master** 轨道是在主通道上应用任何效果之后的歌曲。






  养成在重新组合音轨时为了日后方便而对每个文件重新命名的习惯。你很可能希望在文件名中包含歌曲的节奏和调性。


  如果你把所有导出的音频片段拖回 FL Studio，你会看到它们都与彼此同步对齐，如下图所示：


  ![](img/e7035ac7133980a2ff428c56c901384d_238_0.png)


  图 7.31 – 重新导入的片段


  注意所有音频音轨是如何相互对齐的。它们都同步且长度相同，这正是我们进行垂直混音所需的。


  你现在已经学会如何创建分层音乐片段以用于垂直混音。


  ## 总结


  在本章中，我们学习了如何创建交互式音乐。交互式音乐是根据游戏中的事件发生而在电子游戏中发生变化的音乐。这为玩家创造了更沉浸的体验。


  我们学习了音频引擎中间件 Wwise，它用于在电子游戏中设置音乐。我们学习了如何使用水平重排序来创建随时间演变的音乐，有助于使音乐不那么重复。我们学习了如何在
  Wwise 中实现此功能。


  我们学习了垂直混音，以便根据游戏过程中发生的动作改变歌曲的配器。我们看到了如何在 Wwise 中实现它。


  最后，我们学习了如何在 FL Studio 中为垂直混音创建音乐。


  在下一章中，我们将学习在作曲时如何克服创作障碍。我们将介绍一系列模板，以确保你的音乐达到制作级别的质量。最后，我们将讨论额外的学习资源。

  '
- "## 克服创作障碍\n\n难以想出歌曲的点子吗？遇到创作障碍？觉得自己已经用尽了所有创造力，再也没有音乐可创作了？别担心；我来帮你。创作障碍是作曲的正常部分。它在你刚开始时就会发生，专业人士也会遇到。但没关系，你可以而且会克服它。你只需要尝试一些创造性策略。\n\
  \n幸运的是，我为你整理了一份策略清单，当你缺乏灵感时可以用它们来开始制作音乐。随时在你卡住时参考：\n\n- 在乐器上即兴演奏音乐，甚至尝试一种新乐器。\n\
  - 试着用你的 MIDI 键盘或鼓垫玩玩。\n- 尝试 FL Studio 的音阶功能并尝试新的音阶。\n- 铺设一段鼓点。\n- 按照常规流程进行。打开 **数字音频工作站\
  \ (DAW)**，设置项目，并添加你打算编写的关键段落。人们认为成就来自于 *灵感 -> 动力 -> 行动* 的循环，然而实际上循环是 *行动 -> 灵感 ->\
  \ 动力 -> 行动*。开始行动，事情就会开始运转。\n- 使用现有歌曲作为灵感。在 YouTube 上听一首歌并在 DAW 中找出其主和弦。将和弦上移或下移几个调，进行一些和弦反转，并将歌曲的节奏调整为更慢或更快。砰！你就有了已经听起来不错的歌曲的起点。\n\
  - 使用之前的歌曲作为灵感。如果你在上一首歌中再加一个副歌会怎样？\n- 识别音乐主题。想想电视剧或电影中的一个角色，例如达斯·维达、印第安纳·琼斯或超人。然后想想他们拥有的关键特征。如果为那个角色制作原声带，它会听起来像什么？\n\
  - 看一张实物图像，比如一个地方——也许是你度假去过的地方、视频游戏中的一个地点，或杂志或网上的生动图片。然后围绕为该图像制作旋律来创作你的歌曲。\n- 预设滚动\
  \ – 选择一个合成器并滚动浏览预设。弹奏几个音符，直到找到感觉良好的声音。\n- 采样滚动 – 滚动浏览采样，直到找到可以构建的旋律。\n- 通过选择合成器并进行实验来设计新声音。即使没有旋律出现，你也会有一个很酷的新乐器可供下次使用。\n\
  - 选择你喜欢的曲目并对其进行混音。\n- 尝试使用现有的 MIDI 文件。有些人说这是在作弊，但我不同意。你不能单独使用一个 MIDI 文件并期望得到一首完整的歌曲，无论\
  \ MIDI 文件有多好。MIDI 文件是激发一些和弦来开始创作的绝佳方式。将和弦上移或下移几个音符，添加一些和弦反转，稍微改变节奏，瞧，你已经有了可以开始工作的东西。\n\
  - 合作 – 与朋友交流想法。\n- 尝试新的乐器插件。\n- 尝试盲目实验。压力下？什么都听起来不好？感到沮丧？大脑在放松和享受乐趣时比在压力下更具创造力。给自己许可去失败。失败是学习的关键步骤。将随机元素组合在一起，看看会得到什么。有时灵感会在最意想不到的时候到来。\n\
  - 尝试新技术。查看 YouTube 教程并学习新东西。\n- 查看你通常不会尝试的流派，看看你能想出什么。\n- 以人声为核心构建。是否通常先作曲然后再添加人声旋律以适应歌曲？试试反过来——先录制人声，然后围绕它制作歌曲。\n\
  - 从节奏开始。通常想出一个律动和贝斯线比想出旋律容易得多。而且一旦贝斯线进行起来，旋律往往会神奇地出现。\n- 使用动机。什么是动机？它是一段简短的音乐想法或音符片段。写下几个音符。完整的旋律稍后会形成。\n\
  - 去一个新地点。新地点可以给你灵感。查看你附近的音乐活动和聚会。\n- 听一首你喜欢的歌并思考你如何制作类似的东西。\n- 录制声音。选择一个地点或物体并录制其声音；例如，咖啡馆、商店、海滩、公园…\n\
  - 设置计时器并强迫自己在计时器结束前工作（30-60 分钟应该有效）。\n- 写出来。在纸上或白板上用图表、箭头和颜色勾画出你的音乐想法。\n- 想出一个通过你的歌曲讲述的故事。整体信息和你想传达的感觉是什么？\n\
  - 听新音乐。考虑来自另一个国家或语言的音乐。\n- 考虑使用 Scaler 2 插件来创作旋律：\n\n  Scaler 2 是一个音乐理论插件，可帮助你构建和弦进程。以下截图显示了\
  \ Scaler 2：\n\n  ![](img/e7035ac7133980a2ff428c56c901384d_244_0.png)\n\n  图 8.1\
  \ – Scaler 2\n\n  Scaler 2 提供的功能包括以下内容：\n\n  - 导入现有歌曲：Scaler 2 可以识别歌曲中使用的和弦 MIDI\
  \ 音符，以便你可以在自己的作品中使用它们。\n  - 给定一个和弦，Scaler 2 可以根据调性提出在接下来逻辑上合适的和弦建议。它可以根据流派或艺术家的风格提出这些建议。\n\
  \n要了解更多信息并获取 Scaler 2，请访问 https://www.pluginboutique.com/product/3-Studio-Tools/93-Music-Theory-Tools/6439-Scaler-2。\n\
  \n## 原声带作曲模板\n\n我非常喜欢清单——有序的列表以确保你执行所有先决步骤。清单可以帮助你确保已关注每个步骤，尤其是那些容易被忽视的步骤。有些步骤感觉很小，但如果被遗忘，可能会导致日后出现大问题。Atul\
  \ Gawande 所著的书籍 *《清单宣言》* 提供了使用清单改善工作流程益处的令人信服的论据。我强烈推荐阅读它。\n\n作曲的步骤是一个重复的过程，你会在每个音乐制作项目中一遍又一遍地经历。音乐制作步骤可以分解为顺序列表。本节将为你提供一系列可供调整和使用的列表，以确保你在作曲时关注所有重要事项。出于组织方便，有三个清单对应音乐制作过程的三个不同阶段。\n\
  \n以下是收集原声带需求、作曲音乐和混音音乐的清单。\n\n### 原声带需求清单\n\n此清单旨在处理原声带作曲的业务方面。使用此清单应有助于你在为客户咨询音乐项目时涵盖许多重要的业务任务：\n\
  \n- 1. 与客户一起浏览项目：\n  - a. 如果为电影配乐，请与客户一起观看电影，并在需要音乐的每个场景中记录所需的情感。列出需要音效的项目。\n  -\
  \ b. 如果为视频游戏配乐，请询问每个关卡所需的强度和情绪。列出游戏中需要音效的项目。\n    - i. 确定音乐是否需要交互。\n- 2. 安排一个系统来跟踪提交给客户的音乐状态。*第\
  \ 1 章，《为客户作曲的业务》* 提供了使用原声带规划文档的方法。\n- 3. 如果客户为项目视觉提供了临时音乐，请浏览每个临时音轨并询问客户为何为场景选择它们。询问每个场景的用户体验目标是什么。这将帮助你避免对任何特定的临时音轨产生过度依赖。\n\
  \n\n\n\n\n- 4. 将配乐规划表发送给客户审批，以确保你已识别出所有需要音乐和音效的项目。\n- 5. 如果为客户提供咨询服务，请起草一份发票，逐项列出你打算提供的服务：\n\
  \  - a. 确定你预计会产生的一切费用。\n  - b. 协商预算。将发票发送给客户并获得他们的批准。\n  - c. 获得他们的书面同意。\n- 6. 保存你可能产生的任何费用的收据副本，以便你可以获得客户的补偿和/或用于商业税务费用扣除。\n\
  - 7. 如果与其他音乐人合作，请事先确定合作时如何共享你的音乐。提前商定如何就项目变更相互通知。第1章“为客户作曲的业务”建议使用 Splice 软件进行版本控制管理。与任何合作者进行一次试运行，以确保你们意见一致，并且能够毫无问题地共享项目。\n\
  - 8. 与客户讨论如何交付音乐。应使用什么格式，如何标注，以及如何组织声音以方便双方？\n- 9. 如果你能够保留所创作配乐音乐的权利，那么是时候注册你的音乐以收取版税了：\n\
  \  - a. 找到为你所在地区收取版税的组织。例如，在美国，你可以使用美国作曲家、作家和出版商协会（ASCAP）、广播音乐公司（BMI）或欧洲舞台作者与作曲家协会（SESAC）。\n\
  \  - b. 使用你所在地区的征收机构（如 SoundExchange）注册你的音乐，以收取公开表演版税。\n  - c. 将你的音乐上传到你选择的数字发行服务，让你的音乐进入流媒体平台以收取版税。如果你选择使用\
  \ DistroKid 作为你的数字发行服务提供商，以下链接可为你提供第一年的折扣：https://distrokid.com/vip/seven/701180。\n\
  \n## 混音检查清单\n\n此检查清单旨在处理你创作的每首歌曲的混音和母带处理步骤。遵循此检查清单应能帮助你获得精良且可投入生产的音乐：\n\n- 1. 对于每种乐器，考虑应用压缩、饱和/失真或其他效果以达到所需的声音。\n\
  - 2. 平衡每种乐器的音量，以突出你的主旋律。\n- 3. 判断乐器之间是否相互淹没，并使用均衡器为每种乐器留出空间。检查乐器之间的相位干扰。\n- 4. 对于每种乐器，应用减法均衡调整以去除刺耳的共振声音。\n\
  - 5. 考虑添加混响效果，使你的乐器听起来像是在同一个房间里演奏，以增加真实感。\n- 6. 对你的音乐进行母带处理。如果你还没有母带处理软件，我推荐 Izotope\
  \ 的 Ozone 插件。在母带处理链中，你可能需要执行以下操作：\n  - a. 确定歌曲的频率范围区域：低频、中频和高频。大多数母带处理插件使用三个或四个频率范围。\n\
  \  - b. 使用立体声成像插件改善立体声宽度。\n  - c. 应用均衡器来平衡你的低频和高频。\n  - d. 为整体混音添加压缩。\n  - e. 使用动态均衡器并对混音应用减法均衡。\n\
  \  - f. 添加限制器/最大化器以防止削波并将整体音量提高到所需的响度。\n- 7. 将任何复杂的混音和/或母带处理链保存为预设，以便日后客户要求调整时可以快速应用。\n\
  \n在 FL Studio 混音器中，将混音器轨道上的所有效果保存或复制到另一条轨道非常容易。你可以通过转到 **混音器选项 | 文件 | 将混音器轨道状态另存为…**\
  \ 来保存任何选定的混音器轨道。以下截图显示了一个示例：\n\n![](img/e7035ac7133980a2ff428c56c901384d_249_0.png)\n\
  \n图 8.2 – 保存混音器轨道\n\n执行上述步骤可以将预设保存到计算机上的文件中，该文件可以在完全不同的项目中打开。或者，你可以单击 **将混音器轨道状态另存为…**\
  \ 按钮并将其拖到另一个混音器通道上。这会将选定的混音器轨道效果复制到另一条轨道上。\n\n- 8. 经常向客户提交音乐并接收反馈/批准。在提交每首歌曲后提醒客户提供反馈或批准。在最后发送所有歌曲并希望他们会喜欢一切，是*灾难的根源*。\n\
  \n你可能不熟悉音乐混音检查清单中讨论的一些术语。混音和母带处理的主题超出了本书的范围。如果你有兴趣学习混音和母带处理的细节，可以考虑阅读我的书《音乐制作人的\
  \ FL Studio 20 终极指南》。我还在 https://www.chesternsky.com/ 提供教授这些主题的课程。\n\n## 总结\n\n\
  在本章中，我们学习了如何克服创作瓶颈。我们还查看了几个模板检查清单，你可以遵循这些清单来确保你已关注音乐创作过程中的重要步骤。\n\n## 分享你的音乐\n\n\
  如果你想与其他读者和学生分享你的音乐，并征求其他音乐家的反馈，欢迎在以下 Facebook 群组中发布你的音乐：https://www.facebook.com/groups/musicproducerandcomposercommunity。\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_250_0.png)\n\n图 8.3 – 音乐制作人与作曲家社区 Facebook\
  \ 页面\n\n该群组旨在为音乐家分享音乐和资源。\n\n## 后续步骤\n\n如果你喜欢阅读本书，并想知道下一步可以做什么，还有更多资源可供你继续音乐之旅。\n\
  \n## 作者的其他作品\n\n如果你想深入了解 FL Studio，并学习混音、母带处理以及音乐营销/出版，请查看我的书《音乐制作人的 FL Studio 20\
  \ 终极指南：使用 FL Studio 创作专业品质的音乐》，由 Packt Publishing 出版。\n\n![](img/e7035ac7133980a2ff428c56c901384d_251_0.png)\n\
  \n图 8.4 – 音乐制作人的 FL Studio 20 终极指南\n\n在这本书中，你将探索 FL Studio 庞大的工具集，并发现创作音乐的最佳实践、技巧和窍门。你将学习如何设置你的工作室环境、创建节拍、创作旋律和和弦进行、使用效果混合声音以及导出歌曲。随着你的进阶，你将了解如何使用钢琴卷帘、混音器控制台、音频包络、压缩类型、均衡器、声码器、人声切片以及用于增加立体声宽度的工具。\n\
  \n本书向你介绍了混音最佳实践，并向你展示了如何对歌曲进行母带处理。在此过程中，你将探索故障效果并创建自己的乐器和自定义设计的效果链。你还将涵盖 ZGameEditor\
  \ Visualizer，这是一种用于为你的歌曲创建响应式视觉效果的的工具。最后，你将学习如何注册、销售和推广你的音乐以赚取版税。\n\n## 视频课程\n\n\
  我提供多种畅销课程，涵盖音乐制作、FL Studio 和配乐作曲。如果你有兴趣报名参加我的课程或查看我提供的其他产品，请访问网站 `https://www.chestersky.com/`。\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_252_0.png)\n\n图 8.5 – Chestersky.com\n\
  \n在网站上，你将找到有关音乐制作和配乐作曲的课程。\n\n## 社交媒体账号\n\n如果你喜欢这本书，欢迎与我联系。我还会定期在我的社交媒体账号上发布音乐制作资源：\n\
  \n- **网站：** `https://www.chestersky.com/`\n- **Facebook：** `https://www.facebook.com/RealChesterSky/`\n\
  - **Twitter：** `https://twitter.com/RealChesterSky`\n- **Instagram：** `https://www.instagram.com/iamchestersky/`\n\
  \n\n\n\n## 延伸阅读\n\n如果你想了解音乐职业生涯的商业层面，我强烈推荐阿里·赫斯特兰德（Ari Herstand）所著的《如何在新音乐产业中脱颖而出：建立忠实粉丝群并以音乐人身份谋生的实用技巧》。这本书无疑是我读过的关于音乐产业的最佳著作，我怎么推荐都不为过。\n\
  \n在本书中，我们简要提及了收集版税的服务。你可能会想，版税究竟是如何收取的？你能分到多少版税？表面上看，这似乎是个简单的问题。然而法律细节实际上非常复杂。如果你想了解版税的收取方式，请阅读唐纳德·帕斯曼（Donald\
  \ Passman）所著的《关于音乐产业你需要知道的一切》。\n"
