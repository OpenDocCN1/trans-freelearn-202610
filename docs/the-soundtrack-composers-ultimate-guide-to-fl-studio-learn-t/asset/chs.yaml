- '# 第 3 部分'
- "## 用主题、leitmotif 和音阶设计音乐\n\n在本章中，我们讨论作曲家的音乐理论。我们将为如何将音乐理论应用于电影和游戏作曲提供基础背景。我们将讨论动机、主题和\
  \ leitmotif 的概念如何用于构思音乐想法。我们将讨论音阶是什么以及如何使用它们。我们将使用音阶来解释调式是什么以及如何使用它们。最后，这些概念将使我们能够使用五度圈和弦轮工具来展示音阶之间的关系，以及如何在歌曲中从一个音乐调性平滑过渡到另一个调性。\n\
  \n本章将涵盖以下主题：\n\n- 作曲家的工具箱\n- 理解和使用主题、动机和 leitmotif\n- 理解音阶\n- 理解和使用调式\n- 理解升号和降号\n\
  - 使用五度圈和弦轮\n\n## 作曲家的工具箱\n\n当你坐下来作曲时（通常在钢琴和电脑前），你会面对一张空白画布。至少在电影中是这样描绘的。看起来什么都没有，你必须去创造。从局外人的角度来看，似乎音乐只是从你身上倾泻而出。那是关于作曲音乐的浪漫童话式思维方式。\n\
  \n音乐从你身上爆发听起来很美，但如果你需要持续按需创作音乐，这就不是很可靠。音乐来自哪里？我们演奏的音符并不是随机的。某些音符组合和旋律有时听起来非常和谐。似乎有时所有音符都流动并相互支撑。这是怎样发生的？一定存在某种音符组合之间的关系，使得这种情况得以发生。\n\
  \n你被分配了一个电影作曲任务。你已经看到了需要为其创作音乐的故事。你如何开始？你如何制作符合你期望风格并保持一致的音乐？有哪些框架可以帮助指导这一过程？本章旨在回答所有这些问题。\n\
  \n当你真正开始作曲任务时，这可以是一门非常技术性的艺术。你可以将作曲与木匠用木头雕刻雕塑相比较。是的，你在雕刻之前需要有一个想制作的东西的想法，但创作在很大程度上取决于你拥有的工具。掌握工具越多，你找到的机会就越多。理解如何使用工具以及工具背后的大局是相辅相成的。\n\
  \n作曲家有很多工具可以使用，我们将在本书中探索其中许多。为了充分利用软件工具，你需要对音乐有概念上的理解。在本章中，我们将专注于大局理论，以弄清你在作曲什么。然后，在后面的章节中，我们将研究实现你构想的工具。到本章结束时，你将理解音乐理论如何应用于作曲音乐。\n\
  \n## 主题、动机和 leitmotif\n\n在开始作曲之前，我们需要想出一些作曲的参数。主题、动机和 leitmotif 是构思音乐想法的工具。它们可以帮助我们理解场景的意义并定义我们希望音乐具有的品质。\n\
  \n如果你上过写作或电影评论课程，你可能已经熟悉主题、动机和 leitmotif 这些术语。然而，这些术语的解释可能因授课者而异，而且通常不是在音乐语境中使用。在我们讨论的语境中，我们将按如下方式定义这些术语：\n\
  \n### Motif\n\n一个 **motif** 是无法在叙事中代表具体事物的片段化音乐想法。它是一组或短语的音符，传达一个想法。它是你能做出有意义的最小音乐量。当你在叙事的不同点重放这一组音符时，动机将会意味着不同的东西。重要的是，你在整个故事中不断回到这个音乐想法。如果你不断扩展这个音乐想法并延伸它，它可以演变成一个音乐主题。\n\
  \n作为动机的例子，在阿尔弗雷德·希区柯克执导的 1960 年电影《惊魂记》中，当淋浴谋杀场景发生时，我们听到小提琴的尖叫声。这是一种高音、冲突、不和谐的声音，令人不愉快且刺耳。这个声音与谋杀的声音联系在一起。\n\
  \n### Theme\n\n一个 **theme** 是一个可以代表叙事中具体事物的完整音乐想法，但不一定需要。它是一首可识别的旋律，整首或部分作品都是基于它。当你听到一个音乐主题时，你就知道这首歌指的是一个特定的故事。\n\
  \n每当你观看一部电视剧时，该剧都有主题曲。这首歌与该剧联系在一起。主题通常被认为是一种概括该剧想法的声音。\n\n在许多现场歌剧和舞台表演中，现场乐队会在演出开始前演奏音乐。此时，他们会演奏该剧的几个音乐主题。这通常是整场演出中演奏的几首音乐作品的混音合集。\n\
  \n让我们讨论一个例子。在乔治·卢卡斯执导的电影《星球大战》、《帝国反击战》和《绝地归来》中，每当你看到达斯·维达这个角色时，都会播放一首特定的歌曲。这首歌就是《帝国进行曲》，更\
  \ commonly 称为达斯·维达的主题。你在整部电影中将这种声音与达斯·维达联系在一起。达斯·维达的主题与这个角色联系得如此紧密，很难想象曾经没有音乐的时候。我们理所当然地认为当角色出现时音乐会同时播放。\n\
  \n想象一下我们从未听过为达斯·维达使用的音乐。让我们思考达斯·维达主题的音乐并尝试逆向工程作曲家约翰·威廉姆斯可能如何想出这段音乐。\n\n假装你在静音观看《星球大战》，第一次在视频中看到达斯·维达。尝试构思音乐想法时，你有什么信息可用？\n\
  \n通过观察达斯·维达出现的场景，我们学到了一些东西。维达是电影的反派。他邪恶、强大、有力量、指挥着军队。当他走进一个房间时，他吸引了周围所有人的注意。他总是穿着黑色全身盔甲。如果你取消静音并聆听，当他说话时，他有一种深沉的男性化声音，听起来很凶险。\n\
  \n我们只是看了角色的外表，我们已经有很多信息可以开始构思音乐。约翰·威廉姆斯选择以进行曲风格制作维达的主题。如果我们想强化角色的外表是某种军事指挥官的形式，那么以军进行曲节奏的音乐就是一个合乎逻辑的选择。如果我们想表达力量的概念，那么我们很可能想要使用能够支撑这种感觉的乐器。约翰·威廉姆斯最终使用了大量低音弦乐音符、大量打击乐和大型铜管乐器。\n\
  \n思考 leitmotif 可以帮助你选择想要使用的声音和乐器。你可以查看角色、地点、事件或其他重要物品，看看它们有什么意义。然后，尝试弄清楚什么声音适合传达那种意义。\n\
  \n我们已经了解了动机、主题和 leitmotif 以及它们如何用于构思音乐想法。接下来，让我们学习关于音阶的知识。\n\n## 理解音阶\n\n尝试学习任何旋律乐器，迟早你会学到音阶。如果你想创作歌曲，了解音阶是必需的。\n\
  \n谈论音阶时，大多数音乐书籍直接深入音乐记谱，要求你背诵音阶，并留下你可能永远不会阅读的页本书。我看过很多这样的书籍和讲座，发现其中大多数完全令人难忘。我们将尝试另一种方法来帮助你了解我们为什么使用音阶以及如何应用它们。这将帮助你理解音乐理论而不是死记硬背。事实上，你几乎不需要记住任何东西；软件可以为你完成几乎所有工作。\n\
  \n在本章中，我们将探索以下问题的答案：音阶到底是什么？我们为什么要有它们？它们对作曲为什么重要？以及如何在数字音频工作站中应用音阶的音乐理论？\n\n让我们先解释音阶是什么。所有声音都是由空气中振动的分子产生的。它们以我们解释为波长的模式簇振动。频率是我们用来描述每秒通过空气的波长数量的术语。以下图示展示了我们如何将振动的空气分子解释为声波的示例。\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_88_0.png)\n\n图 3.1 – 波长\n\n乐器使空气分子以特定频率振动。当空气以特定恒定频率振动时，我们的耳朵会将噪音解释为音高。如果你有弦乐器，你会熟悉将乐器弦调音到特定频率的想法，这样当你拨动琴弦时，你会得到期望的音高。\n\
  \n\n\n\n我们根据音频频率给它们命名，称之为音符音高。例如，当在钢琴上演奏时，我们将220 Hz的频率命名为A，更确切地说是A3。和弦被定义为同时演奏的三个或更多音符。当你同时播放三个或更多不同的音频波长时，你就是在创造和弦。\n\
  \n如果我们把音符的频率加倍会发生什么？下图展示了220 Hz和440 Hz波形的对比。\n\n![](img/e7035ac7133980a2ff428c56c901384d_89_0.png)\n\
  \n图3.2 – 频率\n\n440 Hz的频率听起来正好是220 Hz频率的两倍高。我们给这个音程起了一个名字：**八度**。八度是一个音高与另一个频率翻倍音高之间的音程。这两个声音一起演奏时听起来很和谐。对于任何两个频率成倍数关系的声音都是如此。到目前为止，我们所说的只是根音与相隔一个八度的音搭配得很好。\n\
  \n好的，220 Hz的频率是我们所知的A3音符，440 Hz是A4。那么220 Hz到440 Hz之间的范围呢？在那个音程内，有一系列频率可供选择。如果我们把220\
  \ Hz的音与220 Hz到440 Hz之间的某个音搭配，我们怎么知道这个音符组合在一起是否会好听？\n\n随着时间的推移，我们注意到某些频率比组合在一起听起来确实很好。例如，如果我们使用A3音符（频率220\
  \ Hz）与一个音程比为3:2（330 Hz）的音符搭配，它们会很好听。那个330 Hz的第二个音符通常称为E3。不过，用音程比来思考会让人困惑。与其记住音程比的名称，我们使用一些常用术语。对于3:2的音程比（A3与E3配对），我们使用术语**纯五度**。\n\
  \n下面的表格展示了在伴奏根音时听起来悦耳的音程。该表格按从协和到不协和的顺序排列，**协和**是指声音与根音和谐，**不协和**是指音符与根音不协调：\n\n\
  | 音程名称 | 音符之间的频率比关系 |\n|---|---|\n| 根音 | 1:1 |\n| 八度 | 2:1 |\n| 纯五度 | 3:2 |\n| 纯四度\
  \ | 4:3 |\n| 大三度 | 5:4 |\n| 小六度 | 5:3 |\n| 小三度 | 6:5 |\n| 大六度 | 8:5 |\n| 大二度 | 9:8\
  \ |\n| 小七度 | 9:5 |\n| 小二度 | 16:15 |\n| 大七度 | 15:8 |\n\n图3.3 – 从协和到不协和\n\n以纯五度为例，其频率比关系是3:2。我们的耳朵喜欢根音与3:2频率比的声音搭配时的和谐感。我们的耳朵喜欢听到优美、均匀间隔的音程，如2:1、3:2、4:2、5:4和5:3。当我们偏离这些整齐的音程时，耳朵会将声音解读为更加不协和。\n\
  \n最和谐的音程是纯五度、纯四度、大三度和小三度。如果你想让音符与根音搭配，通常会考虑包含这些音程。\n\n八度意味着你将根音与频率恰好为其两倍的音符进行比较。西方音乐把一个八度划分为12个半音音程。西方音乐有12个音符：A、A#、B、C、C#、D、D#、E、F、F#、G和G#。\n\
  \n下表假设我们以220 Hz的根音频率为起点，按频率从最小到最大列出了这些音符。它显示了根音相对于其他音符之间的频率比：\n\n| 音符之间的纯律频率比关系\
  \ | 音符 | 音程名称 | 纯律频率（Hz） | 十二平均律频率（Hz） |\n|---|---|---|---|---|\n| 1:1 | A3 | 根音\
  \ | 220 | 220 |\n| 16:15 | A# | 小二度（m2） | 234.7 | 233.1 |\n| 9:8 | B | 大二度（M2） |\
  \ 247.5 | 246.9 |\n| 6:5 | C | 小三度（m3） | 264 | 261.6 |\n| 5:4 | C# | 大三度（M3） | 275\
  \ | 277.2 |\n| 4:3 | D | 纯四度（P4） | 293.3 | 293.7 |\n| 7:5 | D# | 三全音 | 308 | 311.1\
  \ |\n| 3:2 | E | 纯五度（P5） | 330 | 329.6 |\n| 8:5 | F | 小六度（m6） | 352 | 349.2 |\n\
  | 5:3 | F# | 大六度（M6） | 366.67 | 370 |\n| 9:5 | G | 小七度（m7） | 396 | 392 |\n| 15:8\
  \ | G# | 大七度（M7） | 412.5 | 415.3 |\n| 2:1 | A4 | 八度 | 440 | 440 |\n\n图3.4 – 音符音程\n\
  \n上图将440 Hz到220 Hz之间的范围划分为12个音程分段。你可以看到每个频率对应的音符。你可能想知道标题为“十二平均律频率（Hz）”的那一列是什么意思。\n\
  \n## 什么是十二平均律频率（Hz）？\n\n在“十二平均律频率（Hz）”这一列中，你会注意到一些频率与比率并不完全一致。例如，对于频率为220 Hz的根音，纯五度应该是330\
  \ Hz。然而，在“十二平均律频率（Hz）”列中，频率却是329.6 Hz。实际上，我们不会把乐器音高调成330 Hz，而是调成329.6 Hz。这是为什么呢？\n\
  \n我们之所以用不同的方式调音，是为了能轻松地转换乐器上的调性，而无需重新调音到新的调。例如，如果我们以D#（308 Hz）为根音，并搭配一个频率比为3:2的音符，那就意味着我们需要搭配一个频率为462\
  \ Hz的A#音符。但由于我们的乐器是按A调调音的，A#音符是469.3 Hz。这意味着乐器听起来会走调。那么，我们该如何解决这个问题呢？我们会有意把某些音符调得稍微偏离。虽然稍微偏离，但并不是那么明显。这样调音让我们可以自由地轻松切换到以根音为调，并让音阶中的其他音符听起来大致在调上。\n\
  \n## 为什么西方音乐使用12个音符？\n\n像小提琴和长号这样的乐器可以演奏出不同于12个音符的音。你可以在12个音符之间演奏其他频率。为什么普遍使用12个音高？为什么不是更多或更少？那226\
  \ Hz或227 Hz的频率呢？其他音程比呢？为什么它们没有出现在这个列表中？\n\n过去一些音乐家曾尝试制造把八度划分为非12个音程的乐器，比如把一个八度分成19个或24个音符。如果你演奏弦乐器或铜管乐器，是有可能演奏出其他音程的音符的。\n\
  \n多年来，我们意识到某些频率比在我们听来很好听，尤其是纯五度、纯四度、大三度和小三度。使用12个音符可以确保我们轻松获得这些和谐频率比，如纯五度、纯四度、大三度和小三度。虽然我们可以使用超过12个的音程，但我们发现这些音程通常听起来更不协和，也更刺耳。所以，我们使用12个音符是因为它能让我们创造出和谐的声音。\n\
  \n## 什么是音阶？\n\n音阶是一个八度内互补音符的精选组合。这些音符按频率从低到高排列。在西方音乐中，我们把八度划分为12个半音音程。音阶使用的音符少于12个，它们是从这12个音符中挑选出的互补音符。音阶是一种框架，试图引导你演奏出听起来和谐的音符。\n\
  \n## 为什么音阶对作曲很重要？如何用音阶作曲？\n\n你选择什么样的音阶在很大程度上决定了音乐的情绪。例如，如果你只使用小调音阶中的音符，你的音乐就会带有悲伤或阴郁的色彩。如果你只使用大调音阶中的音符，你的音乐听起来就会欢快而轻快。\n\
  \n通过理解每种音阶的情绪和色调，你可以选择与期望情绪相匹配的音阶。要做到这一点，我们需要知道有哪些音阶可供我们使用。\n\n\n\n\nFL Studio 提供了查找给定音阶包含哪些音符的支持。让我们探索一些帮助我们使用音阶作曲的工具：\n\
  \n1. 在 Channel 架中加载一个旋律乐器，例如 FL Keys。如果您需要复习如何使用 Channel 架或钢琴卷帘，我们在第 2 章《Navigating\
  \ Through the Key Features of FL Studio》中讨论过它。\n2. 打开乐器的钢琴卷帘并选择印章工具。\n\n![](img/e7035ac7133980a2ff428c56c901384d_93_0.png)\n\
  \n*Figure 3.5 – Stamp tool*\n\n会出现一个下拉菜单，列出大量 MIDI 音符预设。它显示和弦、音阶以及打击序列的建议。本章感兴趣的是\
  \ Melodic Scales 选择。\n\n3. 左键单击一个音阶，例如 **Minor Harmonic** 音阶，如以下屏幕截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_94_0.png)\n\
  \n*Figure 3.6 – Choose scale*\n\n5. 使用钢琴卷帘更改调性非常简单。左键单击钢琴卷帘中添加的任意音符。您会注意到它们作为一组被选中。将所有音符向上移动一个音高，如以下屏幕截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_96_0.png)\n\n*Figure 3.8 – Transpose\
  \ key*\n\n通过将所有音符向上拖动一个音高，我们已将音符转调到新的调上。在此例中，我们的音符现在的主音是 C#。这意味着我们现在使用的是 C# 小调的和声小调，而不是\
  \ C 小调。此 C# 和声小调的音符是 C#、D#、E、F#、G#、A 和 C。\n\n哇，转调到新调非常容易。我们不需要进行任何计算来转调音符。我们所做的只是选择音符并将其向上或向下移动一个增量，FL\
  \ Studio 就会完成转调的所有工作。如果您曾经有过弄清楚如何转调音乐的任务，您会意识到这是一个改变游戏规则的事情。在钢琴卷帘中更改音乐调性非常容易，几乎不需要费力去弄清楚使用哪些音符。\n\
  \n您已经了解了音阶是什么以及如何更改调性。但您还不知道如何使用它们来获得所需的音调情绪。为此，我们需要介绍模式的概念。\n\n## Understanding\
  \ modes\n\n**Modes** 是音阶，但是一种特定的音阶类型。它们在作曲时有一些有用的应用，我们可以用它们来创造特定的情绪。\n\n让我们再看看钢琴卷帘印章工具中前面部分看到的一些音阶。如果再次打开印章工具，您会注意到有一系列音阶名称。如果您之前没有学习过音乐理论，其中一些音阶可能对您来说很陌生。例如，您可以看到音阶\
  \ **Aeolian, Pentatonic, Dorian, Locrian, Lydian, Mixolydian,** 和 **Phrygian**，如以下屏幕截图所示，以及许多其他音阶：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_97_0.png)\n\n*Figure 3.9 – Modes*\n\n\
  这些是什么？这些是模式。模式是一种音阶类型。按逻辑顺序排列的七种模式是 **Ionian, Dorian, Phrygian, Lydian, Mixolydian,\
  \ Aeolian,** 和 **Locrian**。它们彼此相关。为了说明如何相关，我们需要一个视觉参考。\n\n使用印章工具选择 **Major Scale**\
  \ 并将其放置在 C 音上。\n\n![](img/e7035ac7133980a2ff428c56c901384d_98_0.png)\n\n*Figure\
  \ 3.10 – Major Scale, also known as Ionian mode*\n\n上一个屏幕截图中的音阶通常被称为 **C major scale**。它也被称为\
  \ **Ionian mode for C**。术语 *major scale* 只是 Ionian 模式的更常用名称。Ionian 模式是由以下音组成的组合：\n\
  \n- Root\n- Major second\n- Major third\n- Perfect fourth\n- Perfect fifth\n- Major\
  \ sixth\n- Major seventh\n\n当我们演奏 Ionian 音阶中的音符时，通常被认为是欢快的旋律。让我再说一遍。*Major scale\
  \ = Ionian mode.* 它们是同一件事。\n\n如果我们使用相同的音符，但开始使用 Ionian 模式中的第二个音符会怎样？换句话说，我们将 Ionian\
  \ 音阶的主音设为第七个音，如以下屏幕截图所示。\n\n![](img/e7035ac7133980a2ff428c56c901384d_99_0.png)\n\
  \n*Figure 3.11 – Dorian mode*\n\n这个新音阶使用相同的音符但以 D 为主音。这称为 Dorian 模式。\n\n这里发生了什么？我们做了非常了不起的事情，但您可能还未意识到其影响。即使我们使用与\
  \ Ionian 模式相同的音符，我们也创造了一个新模式。这听起来可能不是什么大事，直到您意识到 Ionian 模式演奏的音乐听起来与移调到 Dorian 模式演奏的音乐相当不同。Dorian\
  \ 模式演奏的音符具有独特的个性，听起来与 Ionian 模式不同。\n\n在 Ionian 音阶中，音阶中有七个可能的音符可供选择。相应地，有七种可能的模式。正如我们刚才看到的，如果我们从\
  \ Ionian 向上移一个音，我们就会得到 Dorian。如果我们继续向上移，我们会得到 Phrygian、Lydian、Mixolydian、Aeolian，最后是\
  \ Locrian。如果我们再向上移一个，我们就会上升一个八度并回到 Ionian 模式。\n\n这是一件大事，当您开始创作旋律时，您会开始意识到它有多重要。您开始的主音将导致歌曲的不同情绪。以\
  \ Ionian 模式的主音开始，您的音乐听起来会很欢快和轻快。以 Aeolian 模式的主音开始，您的音乐听起来会很悲伤、美丽和黑暗。\n\n## How to\
  \ use modes\n\n音乐的情绪取决于使用什么模式。如果您为配乐作曲，您可以选择一种情绪，然后找出最能体现这种情绪的模式。\n\n下面的列表详细说明了模式及其相关的情绪，以及一些现实生活中的例子。我鼓励您快速谷歌这些歌曲，以便对使用不同模式可以创作什么音乐有一个概念：\n\
  \n- **Ionian mode**: Major key, happy music.\n  - *Let It Be – The Beatles*\n  -\
  \ *Free Fallin' – Tom Petty*\n- **Dorian mode**: Jazzy. It's a minor scale with\
  \ a raised sixth.\n  - *Pokémon Go Theme Song*\n  - *Ballad of the Goddess – Hajime\
  \ Wakai & Takeshi Hama (The Legend of Zelda: Skyward Sword)*\n  - *Halo – Martin\
  \ O'Donnell and Michael Salvatori*\n- **Phrygian mode**: Dark, emotional.\n  - *Time\
  \ in a Bottle – Jim Croce*\n  - *Doctor Who theme song – Murray Gold*\n- **Lydian\
  \ mode**: Jazzy, worldly, triumphant sounds. It's a major scale with a raised fourth.\n\
  \  - *Six Feet Under theme – Thomas Newman*\n  - *Superman Theme song – John Williams*\n\
  \  - *E.T. theme song – John Williams*\n- **Mixolydian mode**: Great for triumphant\
  \ sounds with brass and strings. It's a major scale with a lowered seventh.\n  -\
  \ *Staff Roll – Super Mario Galaxy*\n  - *Bundle of Joy – Michael Giacchino (Inside\
  \ Out Film)*\n- **Aeolian mode**: Minor key, sad, beautiful, melancholic, dark.\n\
  \  - *Manners Maketh Man – Henry Jackman and Matthew Margeson (Kingsman: The Secret\
  \ Service)*\n  - *The Medallion Calls – Klaus Badelt, Hans Zimmer (Pirates of the\
  \ Caribbean)*\n  - *The Game Is On – David Arnold and Michael Price (Sherlock)*\n\
  - **Locrian mode**: A bit strange sounding. Not used very often unless you want\
  \ odd-sounding music. Mostly used for jazz.\n\n如果您试图为音乐实现某种情绪和音调，请考虑选择适合您情绪/音调的模式并创作符合其中的音符。\n\
  \n## What notes are in my scale?\n\n我如何知道音阶应使用哪些音符？FL Studio 的好处是您不必担心任何给定音阶中的音符是什么。钢琴卷帘印章工具可以帮助您即时找到要使用的音符。\n\
  \n在印章工具中，您会注意到有比本章迄今为止涵盖的更多的音阶。每个音阶都提供其独特的情绪。例如，使用布鲁斯音阶会使您的音乐听起来像布鲁斯流派的音乐。我鼓励您尝试选择不同的音阶，看看它们如何改变作品的情绪和音调。\n\
  \n如果您需要检查给定音阶中的音符，www.pianoscales.org 是一个提供视觉参考的绝佳网站。该网站列出了大量可用的音阶。\n\n\n\n\n\n\
  要查找关于调式的部分，请导航到如下截图所示的 **Jazz Scale Piano** 选项卡：\n\n![](img/e7035ac7133980a2ff428c56c901384d_102_0.png)\n\
  \n图 3.12 – 爵士音阶与即兴演奏\n\n进入 **Jazz Scale Piano** 页面后，你会看到调式音阶的列表。如果选择其中一个，你会看到从所选主音开始的该调式所使用的音符。\n\
  \n随后你会看到钢琴图表的列表，说明该调式允许使用的音符，如下截图所示。\n\n![](img/e7035ac7133980a2ff428c56c901384d_103_0.png)\n\
  \n图 3.13 – 自然大调\n\n使用该网站，很容易识别出在任何音阶中演奏歌曲时可以使用哪些音符。\n\n我们已经学习了音阶和调式。但在作曲时是否有参考来直观地看到应使用什么音阶？有的：它被称为使用幽灵音符（休止音符）。\n\
  \n## 使用幽灵音符作为音阶参考\n\n在音阶内作曲时，这里有一个有用的小技巧。它被称为使用幽灵音符（又名休止音符）。幽灵音符可用于直观地识别所选音阶中的音符：\n\
  \n1. 在 Channel 架中添加一个旋律乐器。例如，选择 **FL Keys**。\n2. 为 Channel 架中的乐器命名，例如 `Ghost Notes`。\n\
  3. 在 Channel 架中复制该乐器并赋予不同的名称，例如 `Piano`。\n\n![](img/e7035ac7133980a2ff428c56c901384d_104_0.png)\n\
  \n图 3.14 – 创建名为 Ghost Notes 的乐器\n\n4. 打开名为 **Ghost Notes** 的乐器的钢琴卷帘。\n5. 打开印章工具并选择所需的音阶将其添加到钢琴卷帘中。例如，你可以选择大调音阶。\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_105_0.png)\n\n图 3.15 – 大调音阶\n\n6. 静音你添加的音阶中的音符。你可以使用钢琴卷帘顶部的静音工具，然后拖动以静音想要静音的音符。另一种方法是双击右键并在想要静音的音符旁边按住并拖动以静音想要静音的音符。\n\
  \n以下截图显示了音阶中被静音的音符。\n\n![](img/e7035ac7133980a2ff428c56c901384d_106_0.png)\n\n图\
  \ 3.16 – 用于参考的静音音符\n\n播放该模式时，乐器会保持静音。然而，这些音符作为视觉参考，帮助我们在作曲时提供指导，说明哪些音符可以使用。\n\n\
  7. 在钢琴卷帘中切换乐器，例如切换到我们命名为 `Piano` 的乐器。\n8. 在钢琴卷帘网格中，你会看到由 **Ghost Notes** 乐器演奏的静音音符的淡轮廓。这些是音阶中可以使用的音符。\n\
  \n以下截图显示，尽管我们正在为 **Piano** 乐器作曲音符，但我们可以看到 **Ghost Notes** 乐器中使用的音符。\n\n以下截图显示了添加与幽灵音符重叠的音符的示例。\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_108_0.png)\n\n图 3.18 – 添加音符\n\n该技术可用于任何音阶，并且可以为你节省大量时间。你不再需要花费精力去弄清楚给定音阶中的音符。你只需使用印章工具放置音阶音符，即可立即开始在其上作曲。\n\
  \n我们已经学习了如何使用音阶作曲；接下来，让我们学习音乐术语如何帮助我们使用音阶。\n\n## 理解升号与降号\n\n本章后面我们将解释如何使用音乐和弦轮工具进行作曲。但和弦轮要求你首先了解什么是升号和降号。在钢琴上，你会注意到有白键和黑键。白键是全音。我们将全音赋予字母名称\
  \ C、D、E、F、G、A 和 B。钢琴上的黑键是白键之间的半音。我们称这些为升号和降号。升号用 # 符号表示。降号用 b 符号表示。以下图表显示了带有音符标签的钢琴音符。\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_109_0.png)\n\n图 3.19 – 升号与降号\n\n你会注意到每个黑键都有两个名称。例如，C\
  \ 和 D 之间的黑键名称为 C# 和 Db。C# 和 Db 表示同一个音符。\n\n为了澄清，升号和降号并不意味着黑键。升号只是表示音高提高一个半音，降号只是表示音高降低一个半音。这使你具有记谱自由，例如如果你想使用双升号和双降号。\n\
  \n为什么同一个音符会有升号和降号两种不同的术语？原因是为了帮助为读者澄清信息。\n\n这里有一个例子说明如果没有使用升号和降号的规则，音乐记谱会多么令人困惑。如果我们有一个\
  \ C 和弦：C、E 和 G，如果我想将该 C 和弦改为小调版本，我应该如何称呼这些音符？正确的方法是称呼它们为 C、Eb 和 G。这样，我们可以保持与大调相同的音符名称。如果我们为这个和弦使用升号命名，它将是\
  \ C、D# 和 G。无论你如何命名，我们都是降低了半音，但一种方式保持了字母命名。保持字母命名使试图阅读音乐的音乐家更容易。\n\n升号或降号列在乐谱开头，以告诉音乐家歌曲应使用什么调。它列在所谓的\
  \ **调号** 中。以下截图显示了调号的示例：\n\n![](img/e7035ac7133980a2ff428c56c901384d_110_0.png)\n\
  \n图 3.20 – 调号\n\nhttps://upload.wikimedia.org/wikipedia/commons/1/1d/Db_minor_key_signature.png\n\
  \n调号显示高音谱号和低音谱号符号，然后在右侧列出升号或降号的数量。这告诉音乐家该作品应使用哪些升号和降号。音乐家随后可以使用此信息来确定歌曲应使用什么调。\n\
  \n我们知道了什么是升号和降号以及调号。有了这些信息，我们现在可以学习如何使用 **五度圈和弦轮。**\n\n## 使用五度圈和弦轮\n\n**五度圈和弦轮**\
  \ 是音乐家用作音乐理论备忘单的视觉工具。它是一个包含调号列表的图表，并且能非常快速地向读者传达大量信息。\n\n五度圈图表可用于多种目的。它可用于将音乐从一个调转置到另一个调。现场音乐家可能会在尝试确定使用什么调时使用它来协助即兴演奏。作为作曲者，你可能会在想要改变调时使用此工具，例如在大小调之间来回切换。以下图表显示了五度圈的简单版本。\n\
  \n## 调号\n\n![](img/e7035ac7133980a2ff428c56c901384d_111_0.png)\n\n图 3.21 – 五度圈\n\
  \nhttps://commons.wikimedia.org/wiki/File:Music_Scale_Theory_-_Circle_of_Fifths.png\n\
  \n从顶部中心开始，内圈列出了大调（自然大调）的名称，例如 C。圆圈外部列出了该调的音乐理论调号记谱。它从 C 调开始，该调的音阶中没有升号和降号。\n\n还记得本章前面我们学习过，纯五度是说我们从根音移动到频率间隔关系为\
  \ 3:2 的第二个音的简洁说法——例如从音符 C 移动到 G。这会产生一起演奏时听起来非常好的音符组合。如果我们从根音 C 移动一个纯五度，我们会落在音符 G\
  \ 上。G 调的音阶中有一个升号。如果我们从根音 G 向上移动一个纯五度，我们会落在音符 D 上。D 调的音阶中有两个升号。\n\n试图从记忆中回忆这一点很乏味。除非你面前有一架钢琴可以查看，否则你很可能已经在试图跟踪所有这些字母时感到困惑。五度圈将使你不必记住任何信息。\n\
  \n五度圈使弄清楚每个音阶中的音符变得容易。在图表上，你每次顺时针围绕五度圈递增时移动一个纯五度。例如，从顶部中心的 C 调开始。如果向右移动一个增量，你会落在\
  \ G 调，这正好是一个纯五度。\n\n\n\n\n\n当你继续沿着圆圈顺时针移动时，升号的数量每次增加一个，直到到达C#大调。\n\n如果你从C调开始，逆时针移动，则会按纯五度下行。逆时针移动调号会依次增加降号，直到到达Cb大调。\n\
  \n换句话说，这个图展示了所有大调音阶调之间如何相互关联，也展示了不同音阶之间升号和降号的差异。\n\n所以，五度圈可以帮助我们识别一个大调中包含哪些音符。这就是这个图的全部作用吗？哦不……它做的远不止这些。我们才刚刚开始。让我们来看一个更详细的五度圈图示。\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_112_0.png)\n\n在最内圈，它列出了五度圈中各个调的关系小调。这些是使用与大调相同音符的小调音阶。它们具有相同的调号。\n\
  \n哇……竟然有多个音阶使用相同的音符，而且排列得如此整齐？这是巧合吗？不，不是。事实上，它必然是这样。让我们解释一下原因。\n\n回想一下，本章前面我们学过调式。所有调式对于给定音阶都使用相同的音符，只是使用不同的主音。第一个调式我们称为伊奥尼亚调式，它等同于大调音阶。第五个调式我们称为爱奥利亚调式，它等同于自然小调音阶。自然小调音阶使用与大调音阶相同的音符，但从不同的主音开始。\n\
  \n理论上，如果你愿意费心，可以在五度圈图上列出所有调式，但看起来会过于繁琐。相反，在大多数情况下，五度圈图只列出每个调号对应的大调和/或小调。\n\n好了，这个图有很多非常酷的特性，但我如何在实践中使用它呢？当你作曲时，有时你会想改变歌曲的调。这个五度圈图可以帮助你改变调。\n\
  \n为什么你想改变歌曲的调呢？让我们退一大步，看看我们如何理解声音的变化。\n\n如果你想让音乐听起来能量在增加，有几种方法可以做到。你可以增加力度或演奏法强度（将在第4章“管弦乐MIDI作曲”中讨论），提高速度，或者就本章主题而言，提高声音本身的音高。\n\
  \n通过改变调并将音符移调到另一个调，你可以升高或降低音符音高，使音乐听起来能量水平在上升或下降。如果你想让音乐在能量上有所变化，一种方法就是换到一个新的调。此外，改变调还能增加变化，这很有用。它让你基本上可以重复演奏同一旋律两次，却不会让听众觉得重复。\n\
  \n让我们回到五度圈。如果我们想改变调，如何使用五度圈来实现呢？在五度圈上顺时针移动到下一个调，会增加调中的升号数量，但每次只增加一个。如果我们从C调开始，它没有升号，在五度圈上向右移动一个增量，就会到达G调，它有一个升号。这意味着音阶本身只是稍有变化。对听众来说，这是一个轻微的过渡。\n\
  \n另一方面，如果你从C大调开始，过渡到F#大调，听众会感觉这是一个极端的变化。我们要增加六个升号。这意味着什么呢？这意味着如果你想改变调，围绕五度圈每次以小的增量顺时针或逆时针移动，对听众来说会不那么刺耳。在五度圈上大幅移动对听众来说听起来像是极端的跳跃。\n\
  \n如果你从C大调开始，想通过五度圈改变调，一个不错的选择是顺时针移动一个增量到G大调，或逆时针移动一个增量到F大调。这两种调的改变对听众来说都是微妙的过渡。你一次跳过的调增量越多，过渡就越刺耳。\n\
  \n五度圈和弦轮有多个好处。它让你快速识别每个音阶对应的调号，从而知道可以演奏哪些音符。它还能让你识别在改变调时，可以平滑过渡到哪些音阶。\n\n## 总结\n\
  \n在本章中，我们学习了一系列可用于音乐创作的工具和框架。我们学习了动机、主导动机和主题，以及如何使用它们来为作曲构思。\n\n我们学习了音阶是什么、它们如何帮助我们确定要使用的音符，以及如何在实践中应用。我们学习了调式及其用法。我们学习了如何使用FL\
  \ Studio钢琴卷帘窗的图章工具，无需学习和记忆音阶细节，即可轻松为任何给定音阶添加音符。最后，我们学习了如何使用五度圈和弦轮工具来查看音阶之间的相互关系，以及如何在音阶之间平滑过渡。\n\
  \n在下一章中，我们将学习管弦乐作品的作曲技巧。\n"
- '# 第 4 部分'
- "管弦乐MIDI作曲\n\n在本章中，你将学习可用于创作管弦乐的工具。具体来说，你将学习如何使用MIDI编程来制作管弦乐。我们会让你配置好可用于创作此类音乐的工具。在此过程中，你将学习弦乐编排、和弦进行的技巧，如何让编程乐器听起来更逼真，以及一些混音最佳实践。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 为什么学习管弦乐作曲？\n- 推荐的管弦乐工具插件\n- 使用力度、演奏法和表情\n- 管弦乐MIDI编程\n-\
  \ 管弦乐和弦进行作曲技巧\n- 混音管弦乐作品的注意事项\n\n## 为什么学习管弦乐作曲？\n\n在为电影作曲时，你必须能够为各种风格和流派作曲。尽管你可能对某一小众流派有特别的偏好，但具备从一种风格切换到另一种风格的能力会给你带来更多机会。具备创作管弦乐作品的能力，能让你拥有一个全面、均衡的技术和工具技能库可供借鉴。\n\
  \n擅长音乐创作意味着你拥有多样化的作曲技能。创作管弦乐音乐是接触各种作曲情境的好方法。创作管弦乐MIDI音乐迫使你积累以下方面的经验：\n\n- 理解如何创作和弦进行，并在不同乐器之间分配配器\n\
  - 理解现场原声乐器所呈现的限制和可能性\n- 理解如何让乐器插件听起来更真实、更不“合成”\n- 使用打击乐来产生动感，并知道如何在乐器声部之间过渡\n- 编排配器。平衡音量并使用均衡器为各个乐器声部留出频率空间\n\
  \n这些技能是拥有管弦乐作曲经验后自然获得的副产品。本章将为你提供入门的基础。我们将从作曲所需的工具开始，然后进入有趣的部分，学习管弦乐MIDI作曲，让你自己也能创作音乐。\n\
  \n不过在开始之前，我们需要一些管弦乐器。\n\n## 推荐的管弦乐工具插件\n\n要创作管弦乐，你需要管弦乐器插件。如果你刚接触这方面，我建议你先玩玩FLEX。它是一个免费插件，随所有版本的FL\
  \ Studio附带。\n\n你可以将FLEX插入通道机架来加载它，如下面的截图所示：\n\n\n\n![](img/e7035ac7133980a2ff428c56c901384d_117_0.png)\n\
  \n图4.1 – 插入FLEX\n\n这将加载FLEX插件。在FLEX左上角，你会看到一个名为“FREE”的选项卡。点击进入后，会显示一个你可以在FLEX中下载的免费插件列表。下载这些插件。完成这些操作后，FLEX中就会出现诸如基础弦乐等插件包，如下面的截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_117_1.png)\n\n图4.2 – FLEX\n\n当你安装FLEX自带的免费预设包时，你会找到一个包含管弦乐器的乐器库可供使用。例如，FLEX包含**基础贝斯吉他**、**基础吉他**、**基础钢琴**、**基础弦乐**和**基础管乐**等预设包。\n\
  \n在**基础弦乐**和**基础管乐**包中，你会发现乐器的不同演奏法。在名为**通用MIDI音色库**的包中，你会发现鼓组。这些可以为你的作品提供出色的打击乐音色库，如下面的截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_118_0.png)\n\n图4.3 – FLEX鼓组\n\n**通用MIDI音色库**还列出了各种管弦乐器的乐器预设，如竖琴、萨克斯、教堂合唱、定音鼓、电颤琴、筒鼓、钟琴、吉他、原声贝斯乐器、木鱼和木琴。如果你在寻找一些不太常用的乐器，你还会找到班卓琴、风笛和教堂管风琴。\n\
  \nFLEX允许你按名称或与声音关联的乐器标签来搜索乐器声音。下面的截图显示了你可以搜索的乐器类型和风格标签：\n\n![](img/e7035ac7133980a2ff428c56c901384d_119_0.png)\n\
  \n通过按类型或风格选择标签，你可以在FLEX中筛选乐器，精确定位你想要的音色。底部还有一个搜索栏，你可以在其中按名称搜索乐器。\n\nFLEX是我遇到过的最直观的乐器插件之一，而且如前所述，它随FL\
  \ Studio免费提供。\n\n## 推荐的付费乐器插件\n\nFLEX对新手来说还可以，但与市场上一些最好的管弦乐插件相比，它还有所不足。当你想要花钱购买一些最先进的乐器插件时，以下是我的一些推荐：\n\
  \n- **Native Instruments** (https://www.native-instruments.com/) 提供了大量的乐器插件和效果器。Native\
  \ Instruments的产品是全球音乐制作人和作曲家的行业标配。他们还销售MIDI键盘，这些键盘常被专业人士使用。我是他们产品的忠实粉丝。\n- **EastWest\
  \ Sounds** (https://www.soundsonline.com/) 提供了用于电影配乐的最先进管弦乐器，多年来已被众多好莱坞电影采用。\n\n\
  \  他们于2021年推出的插件**Opus**是一个改变游戏规则的产品。它是一个管弦乐音色库插件，包含了你期望在管弦乐队中找到的所有乐器。但Opus真正与众不同之处在于一个名为**管弦乐编排器**的功能。该功能提供了一套专为管弦乐编曲而设计的MIDI预设。它可以为管弦乐编曲提供建议，然后你可以根据自己的喜好进行调整。\n\
  \n  如果你想制作传统管弦乐队的声音，**管弦乐编排器**是你的不二之选。这是一个绝佳的工具，可以学习如何在管弦乐队中巧妙运用MIDI乐器和演奏法。\n\n\
  - **Spectrasonics的Omnisphere插件** (https://www.spectrasonics.net/products/omnisphere/)\
  \ 提供了大量非常适合电影配乐的乐器。\n\n至此，我们已经了解了可用于创作管弦乐的一些工具。不过，拥有乐器插件只是第一步。现在，我们需要学习如何使用它们。那么，我们怎样才能有效地使用它们呢？\n\
  \n## 什么让乐器插件听起来真实？\n\n即使是演奏相同的音符和相同的歌曲，初学者音乐家与专业人士的表现也会显著不同。这是为什么呢？\n\n让我们以钢琴为例。钢琴在按下琴键时发出声音。琴键触发琴槌敲击琴弦，从而发出声响。初学者在演奏时，对乐器没有太多控制。音符的音量可能相同，节奏可能忽快忽慢，演奏者也没有刻意将自己的个性融入表演中。\n\
  \n专业人士演奏时，他们对乐器有完全的控制。演奏者会精心控制演奏的速度。他们决定每个音符的演奏力度。在整个曲目中，双手可能以不同的音量演奏。他们的右手（通常负责主旋律）可能会比左手（负责伴奏）稍微响亮一些。\n\
  \n## 每日一题\n\n| 题干 | 已知 | x | y | x + y |\n| --- | --- | --- | --- | --- |\n| 1 |\
  \ 2 | 3 | 4 | 5 |\n\n解：由题意可得，x = 3，y = 4，所以 x + y = 7。\n\n让我们看一个如何有效使用力度的示例：\n\n\
  1. 在**通道机架**中加载**FL Keys**或其他钢琴乐器。\n2. 在钢琴卷帘窗中打开该乐器。\n3. 左键单击钢琴卷帘窗添加一些音符：\n\n  \
  \ ![](img/e7035ac7133980a2ff428c56c901384d_122_0.png)\n\n   图4.5 – 控制\n\n   添加这些音符后，你应该会看到类似于上面的截图。在钢琴卷帘窗的左下角，你会看到**控制**，后面跟着当前已启用的控制项。默认情况下，**力度**已启用。\n\
  \n4. 如果你没有看到**力度**，左键单击**控制**。会出现一个下拉菜单，你可以在其中选择**音符力度**：\n\n   ![](img/e7035ac7133980a2ff428c56c901384d_123_0.png)\n\
  \n   图4.6 – 音符力度\n\n   选择**音符力度**后，底部网格将变为音符力度的控制区。对于添加的每个音符，钢琴卷帘窗底部网格中会出现一条线，表示音符力度。在选中音符的情况下，左键单击底部网格，可以改变线的高度。线越高，力度越大。\n\
  \n5. 左键单击为音符添加不同的力度。下面的截图显示了这一点：\n\n   ![](img/e7035ac7133980a2ff428c56c901384d_124_0.png)\n\
  \n   图4.7 – 改变音符力度\n\n   在上面的截图中，你可以看到我为音符添加了渐增的力度。随着音符的播放，它们会变得更响亮、更加鲜明有力。\n\n\
  6. 选中音符后，可以按住左Alt键并滚动鼠标滚轮来微调力度。\n\n太棒了——我们已经知道如何控制力度了！那又怎样？我们为什么要在意呢？控制力度能让我们的乐器模拟现场音乐家的演奏方式。有策略地选择音符力度能让我们的乐器插件听起来栩栩如生。\n\
  \n要为你的声音添加真实感，你需要将每段创作的旋律的力度按以下步骤分解：\n\n1. 找到最重要的旋律，并为其分配比伴奏旋律更高的整体力度。\n2. 对于每段旋律和伴奏，找出旋律的整体动势。分配力度以强调这种动势。\n\
  \n在下面的截图中，你可以看到右手旋律部分。我为每个音符分配了单独的力度。这些起伏让旋律听起来不那么机械，更富有生命力：\n\n![](img/e7035ac7133980a2ff428c56c901384d_126_0.png)\n\
  \n图4.9 – 右手旋律的力度\n\n你可能想知道应该增大还是减小音符的力度。应该选择什么数值？我无法给出答案。力度的选择取决于个人偏好，也取决于你的音乐作品。不过，以下是一些提示：\n\
  \n- 旋律越突出，你可以使用的动态范围就越大。你的耳朵会注意到动态的变化。如果你希望听者专注于某个乐器，你可以更多地改变动态。\n- 虽然力度通常与音量相关，但最好将音量视为一个独立的效果。你可以稍后在混音阶段通过音量调节和/或压缩效果来调整音量。将力度视为你想要注入到每个音符演奏中的能量和强度。你可以使用非常低的力度在乐器上产生柔和的声音，然后在混音阶段提高音量。\n\
  - 如果你希望某个乐器成为焦点，请相对于其他乐器提高其力度。如果你希望某个乐器退出焦点位置，则降低其力度。这同样适用于音量。提高乐器的音量会让你的注意力集中在它上面，而降低音量则会使其显得不那么重要。\n\
  \n\n\n\n\n## 使用演奏法\n\n到目前为止，我们已经学会如何使用力度为打击乐器增加真实感，但如何为非打击乐器增加真实感呢？为此，我们需要演奏法。\n\
  \n当你使用试图模仿现场乐器的乐器插件时，你需要尝试不同的乐器演奏法来为声音增加真实感和趣味性。演奏法有很多种，且是乐器特定的。演奏法指的是音符之间的过渡。例如，演奏法包括连音、乐句记号、断奏、重断奏、重音、强音、渐强连音和连奏。\n\
  \n以下是你可能会遇到的演奏法参考列表：\n\n- **Legato (slurs)：** 这些是长而拖出的音符，会将一个音符与下一个音符融合在一起。它们通常在采样开始时包含一个短暂的半音上扬。在弦乐器上，这可以通过在移动到下一个音符的同时用手指沿着琴弦滑动来实现。\n\
  - **Staccato：** 这些是短而快的。很容易辨认出一个音符结束后再开始下一个音符。它们通常被认为是演奏连奏音符的相反方式，音符之间有很多空间。在弦乐器上，这涉及演奏者交替进行上弓和下弓动作。\n\
  - **Crescendo：** 这会提供声音音量的持续增加。对于采样乐器来说，这听起来比交叉淡入淡出更自然。\n- **Decrescendo：** 这会提供声音音量的持续减少。对于采样乐器来说，这听起来比交叉淡入淡出更自然。\n\
  - **Glissando：** 这里有两个可能的含义。一般来说，它指的是在起始音符之前的一个短暂上行滑音。在竖琴上，这意味着拨奏琴弦而不是弹拨它们。\n- **Sustain：**\
  \ 这涉及将一个音符保持到下一个音符，尽管这并不会为演奏者准备下一个音符。通常，这些采样是循环的，以便可以无限期地演奏。如果你单独使用延音音符，它们可能会听起来很假。为了让它们听起来更真实，你需要使用表情自动化来将一系列延音和弦与下一个序列融合。我们将在本章后面向你展示如何使用表情。\n\
  - **Trill：** 这是在两个音符之间快速交替。\n- **Sforzando：** 这涉及用额外的力度演奏一个音符，以使其在附近的其他音符上更具强调。\n\
  - **Vibrato：** 这会改变音符的音高。在某些演奏法中，颤音在轻微延迟后开始，这使得可以在应用颤音之前演奏更快的音符序列。\n\n以下是弦乐器特定的演奏法列表：\n\
  \n- **Martelé：** 这是指弓压在每根琴弦上，音符之间的声音会停止。这使得每个音符都强烈地被重音强调。\n- **Pizzicato：** 这涉及使用手指而不是弓拨奏弦乐器，这会产生一种短促的声音，可以穿透整个管弦乐队。\n\
  - **Spiccato：** 这是一种演奏方法，弓在演奏每个音符时都会从琴弦上弹起。\n- **Tremolo：** 这是指通过快速交替弓法而不离开弓来重复相同的音符。这通常用于恐怖电影。\n\
  \n在某些管弦乐器上，你可能有使用键位切换的选项。这是指按下某些 MIDI 音符会使不同的演奏法被激活。\n\n到目前为止，我们已经了解了演奏法的列表，但在听到它们之前，很难想象这意味着什么。让我们看一个快速的例子，以便你可以看到演奏法在实际中的效果：\n\
  \n1. 在 **Channel** 架中加载两个或三个 FLEX 插件实例。\n2. 导航到 **Essential Strings** 或 **Essential\
  \ Winds**。你会找到不同乐器演奏法的列表，如以下屏幕截图所示：\n\n   ![](img/e7035ac7133980a2ff428c56c901384d_128_0.png)\n\
  \n   Figure 4.10 – FLEX articulations\n\n3. 对于每个 FLEX 实例，选择不同的乐器演奏法。例如，你可能希望选择 **Violins\
  \ Staccato**、**Violins Pizzicato** 或 **Violins Sustain**。\n\n每种乐器演奏法都会为乐器提供不同的声音。\n\
  \n乐器演奏法对于模仿现场演奏者的真实感非常重要。在演奏时，现场音乐家会不断交替他们正在演奏的演奏法。他们会从短促的断奏音符跳到长的连奏音符。他们会在音量上渐强和渐弱，并在各个阶段对音符加以强调。\n\
  \n当你为小提琴作曲时，例如，你希望在你的声音中包含各种演奏法来模仿真实的乐器。在创作旋律后，你可以加载几个带有不同演奏法的小提琴乐器版本（或使用键位切换）。然后你可以将旋律音符分配给所需的乐器演奏法。你必须对每个管弦乐器都这样做。策略性地执行此操作，你会发现你的乐器听起来非常逼真，比没有演奏法时更有趣。\n\
  \n到此，我们已经了解了乐器演奏法。接下来，让我们学习关于表情。\n\n## 使用表情\n\n在延音演奏法上，当你使用弦乐、铜管和木管乐器时，你可能会注意到改变力度似乎什么也不做。这些乐器可能使用也可能不使用力度。力度适用于通过物理敲击乐器来产生声音的乐器。由于某些弦乐、铜管和木管演奏法中没有任何东西被敲击，我们如何控制声音的强度？\n\
  \n一些乐器插件允许你控制一种称为 **expression** 的效果。如果你有一个带调制轮的 MIDI 键盘，通常，调制轮默认连接到此 *expression*\
  \ 效果。Expression 控制声音的强度。你会注意到表情和力度之间有相似之处。增加表情，与增加力度类似，会增加声音的强度。\n\n默认情况下，FL Studio\
  \ 不附带任何使用表情的乐器（据我所知）。你需要一个具有专用表情控制器的乐器。这样的乐器示例包括 Native Instruments 管弦乐器插件或 EastWest\
  \ 管弦乐插件，但市场上有很多具有表情效果的管弦乐器插件。你可以通过快速 Google 搜索 `orchestral instrument vst plugins`\
  \ 找到一些免费的。\n\n## 表情有什么用？\n\n自动化表情对于各种情况很有用。表情可用于以下场景：\n\n- 增加或减少乐器的强度。对于管弦乐弦乐、铜管或木管乐器，调整表情通常比改变音量更可取。改变表情听起来更自然、更逼真。对于弦乐器来说，当演奏者演奏得更响时，音调强度通常会增加。这不仅仅是音量变化——整个声音也会发生变化。\n\
  - 表情有助于使延音和弦之间的过渡感觉更自然。延音音符和弦在从一个和弦过渡到下一个和弦时听起来可能很假且平淡。为什么？通常，延音和弦在第一个音符出现时有一个缓慢的起音。当你按下下一个和弦时，你必须再次听到缓慢的起音，而你真正想要的是从第一个和弦声音继续到第二个。你可以自动化表情来使这种过渡不那么明显。\n\
  \n> **Note**\n> 一些乐器包含连奏演奏法。连奏演奏法在音符之间过渡时听起来相当逼真。然而，音符通常一次仅限于单个音符而不是和弦。为了绕过这个问题，如果你愿意，你可以加载几个使用连奏演奏法的插件实例，并让每个实例击中不同的和弦音符。\n\
  \n## 手动为你的管弦乐器添加表情\n\n让我们学习如何为我们的乐器自动化表情。首先，让我们学习手动方法。之后，我们将学习精细调整方法，这需要你拥有一台带调制轮的\
  \ MIDI 键盘。\n\n要添加表情，你需要一个具有可自动化的表情效果的管弦乐器。通常，弦乐、木管和铜管乐器插件都附带此效果。我推荐 Native Instruments\
  \ 或 EastWest 乐器插件，如本章开头所述，但你可以使用任何你喜欢的。\n\n\n\n\n在以下步骤中，我假设你有一个管弦乐插件。如果没有，你需要先获取一个，然后才能继续后续步骤。在我的示例中，我使用的是EastWest管弦乐器；FL\
  \ Studio默认不附带此乐器：\n\n- 1. 转到管弦乐器插件左上角的插件选项，然后选择**浏览参数**选项：\n\n![](img/e7035ac7133980a2ff428c56c901384d_131_0.png)\n\
  \n选择**浏览参数**后，浏览器中将出现可用于你乐器的所有插件效果列表。希望你的插件会有一个*表现力*效果。\n\n2. 右键单击表现力并选择“创建自动化剪辑”：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_132_0.png)\n\n图4.12 – 创建自动化剪辑\n\n这将在播放列表中创建一个自动化剪辑。\n\
  \n3. 然后，在自动化曲线上左键单击以绘制和调整曲线形状。提高曲线会增加表现力；降低曲线则会减弱表现力。\n\n下面的截图展示了我在弦乐持续和弦上自动化表现力曲线的示例：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_132_1.png)\n\n图4.13 – 在播放列表中自动化表现力\n\n\
  在前面的截图中，我们可以看到播放列表。在这个播放列表中，我们可以看到我们刚刚创建的MIDI和弦模式和表现力自动化曲线。\n\n为了让表现力效果更逼真，在切换和弦时改变表现力斜线的方向可能是个好主意。\n\
  \n在前面的截图中，我使用了一个极端的自动化表现力示例。在这里，我们可以看到斜线从同时上下移动变为从一个MIDI和弦到下一个和弦的变化。在某些情况下，这可能会使你的和弦转换听起来更逼真。\n\
  \n## 为管弦乐器添加表现力的微调方法\n\n如果你的MIDI键盘带有调制轮，并且你的乐器将调制轮连接到表现力效果，你可以在演奏歌曲时直接录制表现力自动化。如果是这种情况，录制表现力非常容易。\n\
  \n让我们来学习如何操作：\n\n- 1. 按下录音按钮（自动化、乐谱），如下面的截图所示。将出现一个弹出菜单。\n- 2. 选择**音符和自动化**选项，如下面的截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_133_0.png)\n\n图4.14 – 音符和自动化\n\n如果你还没有音符，请在录音时用MIDI键盘演奏音符。或者，你也可以在钢琴卷帘中预先输入音符，然后在现有音符之上录制调制轮自动化。\n\
  \n在音符播放时，移动调制轮来控制乐器的表现力。向上移动调制轮会增加表现力的强度，向下移动则会减弱表现力的强度。\n\n下图显示了MIDI键盘上的调制轮示例：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_134_0.png)\n\n图4.15 – 调制轮\n\n(https://commons.wikimedia.org/wiki/File:Moog_LP_Pitch_%26_Mod_Wheel.jpg)\n\
  \n如果你想在演奏MIDI键盘时双手并用，而不是一只手放在调制轮上，你可以将表情踏板连接到MIDI键盘。然后，你可以用脚来自动化表现力，同时双手演奏音符。下图显示了表情踏板的示例：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_134_1.png)\n\n图4.16 – 表情踏板\n\n(https://commons.wikimedia.org/wiki/File:KORG_CX-3_(2000)_expression_pedal.jpg)\n\
  \n使用调制轮录制自动化后，你将看到一条自动化曲线，类似于下面的截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_135_0.png)\n\
  \n然后，你可以左键单击自动化曲线，将其调整为你想要的形状。\n\n钢琴卷帘不仅限于自动化和表现力、力度。通过左键单击钢琴卷帘左下角的控制按钮，你可以在想要自动化的参数之间切换。例如，你可以自动化声像、音量和音高。你在模式中控制的任何效果都会显示在这里。你也可以使用此菜单切换回控制音符力度。\n\
  \n下面的截图显示了各种通道控制：\n\n![](img/e7035ac7133980a2ff428c56c901384d_136_0.png)\n\n图4.18\
  \ – 选择要自动化的参数\n\n至此，你知道如何使用表现力为你的管弦乐作品添加动态变化。接下来，我们将学习如何使用MIDI创作管弦乐。\n\n## 管弦乐MIDI编程\n\
  \n让我们进入本章的核心内容：管弦乐作曲的技巧。在接下来的几节中，我们将主要关注弦乐器的MIDI编程。通过学习如何为弦乐作曲，你将学到许多可转移的工具和技术，这些工具和技术可以应用于管弦乐作曲，无论你是为弦乐、木管、铜管还是打击乐器作曲。\n\
  \n擅长为弦乐作曲将为你提供为许多管弦乐器作曲的可转移技能。因此，虽然我会专门讨论弦乐，但你会发现这些课程也适用于其他管弦乐器。\n\n## 为弦乐器作曲\n\n\
  当我们谈论管弦乐中的弦乐器时，我们指的是低音提琴、大提琴、中提琴以及第一小提琴和第二小提琴。作曲家对管弦乐中的弦乐声部给予了大量关注。弦乐器在可做的事情方面提供了很大的自由度。它们在声音上极具表现力，能很好地与其他管弦乐器融合，并且有许多不同的演奏法可供尝试。这是作曲家展示自己技能的机会。\n\
  \n在为弦乐器作曲时，你会遇到*双音*和*分部*这两个术语，我们将在下面的小节中探讨它们。\n\n### 双音\n\n**双音**指的是在弦乐器上同时演奏两个音符。还有三音和四音。同时演奏两根以上的弦是很困难的，因为同时运弓超过两根弦很棘手。让手指进入双音位置很难，优雅地离开也很难。如果你给弦乐演奏者一首乐谱，而乐谱中满是三音和四音，你可能会发现你给了你的音乐家一首无法演奏的曲目。\n\
  \n不过，在完整的管弦乐队中，双音并不是什么大问题。这是因为管弦乐队可以在音乐家之间分配音符。当交给管弦乐队时，涉及双音、三音和四音的旋律通常会被分成独立的乐器供音乐家演奏。\n\
  \n### 分部\n\n如何避免双音？使用分部。将音符分割到不同的乐器被称为**分部**。分部并非在所有情况下都是最佳选择。在第一小提琴和低音声部应避免分部。第一小提琴分部听起来可能过于尖锐刺耳。最好在第二小提琴中进行分部。\n\
  \n低音声部通常也应避免分部。低音声部中的分部可能导致过于浑浊、刺耳的音符全部混在一起。因此，最好避免在低音区（如低音提琴上）使用和弦。弦乐器中的分部通常在大提琴、中提琴和第二小提琴中效果最好。\n\
  \n在大多数情况下，你只需要五个声部就能构成一个平衡良好的和弦，每个弦乐器一个声部——低音提琴、大提琴、中提琴、第一小提琴和第二小提琴。通常，大提琴和低音提琴这两个最低的声部相互重叠，或者在不同八度音区演奏相同的音符。这有助于给低音音符增加一些厚重感。通常最好避免大提琴和低音提琴之间出现不同的音符，除非你故意想要刺耳、浑浊的声音。\n\
  \n当你将旋律分配给一个声音单薄的乐器时，你可能会注意到该乐器的播放听起来相当单薄。在这种情况下，将音符相隔八度重叠（将一个音符与另一个相同音高但高八度的音符叠加）会有所帮助。这可以帮助加厚声音。\n\
  \n在为管乐器（如铜管和木管乐器）作曲时，很容易忘记管乐器有物理限制——如果真人音乐家演奏你的作品的话。如果有一天有真人音乐家演奏你的作品，他们需要停顿来喘口气。要解决这个问题，请在乐句之间留有休止符，以便你的音乐家呼吸。\n\
  \n## 弦乐器与人声的注意事项\n\n在流行歌曲中，你需要为人声留出频率空间。识别与人声音域相同的音符和频率。然后，看看弦乐器是否与人声冲突。如果有冲突，考虑将弦乐器向上或向下移调一个八度。如果这样处理后听起来不好，你可能需要考虑将这些音符换给更适合该音区的另一种弦乐器。\n\
  \n下面的截图展示了弦乐器频率与人声频率对比的示例：\n\n\n![](img/e7035ac7133980a2ff428c56c901384d_139_0.png)\n\
  \n图4.19 – 频率对比\n\n在前面的截图中，我们可以看到人声占据的频率高于100 Hz。弦乐器也占据高于100 Hz的频率。在某些情况下，弦乐器的频率可能会盖过人声，因为它们处于相同的频率范围。这可能导致人声被淹没。\n\
  \n人声始终是焦点。弦乐和其他管弦乐器是用来支撑人声的。当你创作与人声搭配的对位旋律时，弦乐器应该在人声保持一个音符或休息时出现。当人声休息时，弦乐可以成为焦点。当人声重新进入时，弦乐应该减少移动，以免分散注意力。\n\
  \n## 管弦乐和弦进行创作技巧\n\n开始一个和弦进行只有一种方法吗？不。任何音乐理论书都会告诉你这一点。你可以从低音线开始，并在其上构建和弦。你可以先创作一段抓耳的旋律，然后构建低音线和弦来支撑它。你也可以先从节奏型开始。你可以寻找激发你的完美音色，然后围绕该音色进行构建。有很多有效的方法，你会逐渐形成最适合自己的偏好。\n\
  \n不过，说你可以用多种方式创作音乐并没有太大帮助。假设你采用了第一种方法，用你的低音提琴或其他低音乐器构建了一条低音线。在这种情况下，不要马上开始构建完整的和弦。从一开始就构建完整的和弦通常会导致构建非常简单的和弦。相反，一旦你有了低音线，你可以用另一种乐器（如中提琴）在上面添加一个旋律。你应该将旋律一层一层地叠加，确保每一层都能提升整体作品。\n\
  \n我有钢琴背景。因此，对我来说，合理的起点是在钢琴上即兴演奏一个和弦进行。在钢琴上，和弦中的音符总是会靠得很近。为什么？因为我的手指在物理上就相互靠近。如果我把钢琴换成弦乐组，我所有的音符可能都会挤在中提琴或大提琴的音域里。不过，这个问题很容易解决——我只需要将和弦进行中的音符移高或移低几个八度，以适应小提琴、低音提琴等乐器的音域。\n\
  \n## 旋律会不会太多？\n\n当你有一条低音线和一段旋律叠加在上面时，你如何知道何时可以安全地添加另一段旋律，或者何时新的旋律会分散整体效果的注意力？\n\n\
  在你的旋律中，你应该有休止符和音符持续一段时间的地方。正是在这些停顿中，你才有机会用新的旋律引入动态。音高上下移动的动态会吸引你的注意力。你希望每次只聚焦于一个旋律。换句话说，当你的中提琴保持一个音符或暂停时，这是你的第二小提琴旋律通过一些旋律动态接管的好机会。当你的第二小提琴旋律休止或保持一个音符时，你可以让大提琴做一些动态。你希望在每一个点上焦点都集中在一段旋律上。当一段旋律达到一个合乎逻辑的延长音或休止符时，将焦点转移到另一件乐器上。关键在于从一个乐器声部到下一个乐器声部轮流进行主动的旋律动态。这样，乐器听起来就像在互相呼应。这个例子有点过于简化了，我相信你能找到例外。但这是一个有用的思考方式，值得记住。\n\
  \n一个好的经验法则是，如果你让任何一件乐器独奏，其旋律本身听起来也应该很有趣。如果不是，你可能需要改进旋律或添加演奏法来赋予它更多个性。\n\n如果你选择使用冲突的音符，比如七度音与根音组合，通常将冲突音符放在较高音区（C3\
  \ 以上）会比放在较低音区效果更好。任何低于 C3 的音区通常会导致浑浊的声音。在较高音区，冲突音有空间，因此听起来会比低音区更好。下面的截图展示了两个七度部分和弦的示例。它使用了\
  \ C 和 B 两个音符，由持续弦乐器演奏。\n\n![](img/e7035ac7133980a2ff428c56c901384d_141_0.png)\n\n\
  图4.20 – 七度部分和弦\n\n左边的七度部分和弦位于较低音区。听起来很糟糕，因为浑浊且冲突。在右边，我把七度音移高了几个音区。这个音符虽然仍然是七度音，但听起来好多了。它有自己的频率空间，感觉不会与根音竞争。\n\
  \n从一个块状和弦序列过渡到下一个序列时，通常最好让和弦之间的移动尽可能少。上下跳跃音区听起来会很刺耳，除非是有意为之，否则应该避免。相反，你希望你的和弦进行在整首曲子中随着和弦之间的转换而微妙地扩张和收缩。\n\
  \n与线性的上下垂直移动相比，更倾向于扩张和收缩的和弦进行。下面的截图展示了两个和弦进行的示例：\n\n![](img/e7035ac7133980a2ff428c56c901384d_142_0.png)\n\
  \n图4.21 – 线性与扩张性和弦进行对比\n\n在前面的截图中，我们可以看到左边是一个平凡的和弦进行示例，右边是一个更有趣的和弦进行。我用紫色标示了每个进行中相同的低音线，并添加了伴奏音符来构成和弦。在左侧，我们可以看到线性垂直的和弦进行移动。所有音符都朝同一方向移动。如果你去听，会觉得很无聊且可预测。\n\
  \n在右边，我们可以看到一种和弦进行，其中和弦的整体动态同时向上和向下扩张。这听上去有趣得多。和弦进行中的扩张或收缩动态比线性动态更值得聆听。\n\n让我们提供一些管弦乐创作的一般指南。这个顺序只是一个建议，因此你可能会根据自己的需要在这些步骤之间跳跃：\n\
  \n1. 想出低音线，并逐一添加旋律在其上方演奏。\n2. 将你的乐器声部分散开来，分配到合理的弦乐器音域中——例如，高音给第一小提琴，低音给低音提琴和大提琴。你需要根据聆听时的感觉来决定上移或下移八度。\n\
  3. 头脑风暴为作品添加节奏和动态的方法。尝试节奏切分，避免听起来过于重复和可预测。考虑加入打击乐元素来增加切分和节奏。鼓类打击乐很少是单独演奏的单一乐器，它几乎总是由多种打击乐器同时演奏的分层组合。\n\
  4. 为你的旋律添加垂直动态。如果你发现某个旋律段落重复，可以考虑将其上移或下移一个八度。音符向下移动感觉像是在失去能量，而向上移动感觉像是在获得能量。因此，你经常会看到在副歌结尾、即将过渡到主歌时音符向下移动，而在过渡到副歌时（我们想要更高能量的时候）音符向上移动。\n\
  5. 添加休止符和延音，为你的旋律留出空间。这为其他乐器引入新旋律提供了空间。这样做会让你的乐器听起来像是在互相呼应。\n6. 不要觉得你需要所有乐器一直演奏。让各个乐器声部在整个歌曲中逐渐淡入淡出会更有趣。如果一开始就让所有乐器演奏，你就剥夺了自己逐步构建、将所有乐器层层叠加成巨大的声音墙并在后期渐强的机会。\n\
  7. 为你的乐器添加演奏法。\n8. 考虑叠加额外的管弦乐器。例如，如果你希望弦乐器更有冲击力，可以考虑添加另一件演奏法更具冲击力的弦乐器，或像木琴这样的打击乐器。叠加之后，你可能会发现其他一些管弦乐器，如铜管或木管，比你原来的弦乐器更合适，因此你需要做一些替换。\n\
  9. 在添加了演奏法和叠加之后，你可以考虑力度动态。建议将这一步留到最后，因为如果你移动音符，任何自动化都需要重做。优化音符的力度，并为你的乐器添加表情。最后，添加强弱渐强和渐弱。\n\
  \n\n\n\n\n10. 在乐器之间平衡音量电平。**EQ（均衡）**你的乐器频率，为每件乐器腾出空间并将注意力集中在主旋律上。使用自动化，使你的音量电平和/或表现力在整首歌曲中按期望变化。\n\
  \n11. 在某些情况下，你可以考虑用合成贝斯替换大提琴来击出低频。如果你想创造众所周知的*墙式音效*，这是一种击出低共振隆隆低频的方法。如果是这样，你需要为你的合成贝斯乐器添加一个低通滤波器。通过这样做，你的合成贝斯频率专注于低端，而不会压倒你的混音中的其他部分。\n\
  \n## 使采样乐器听起来更逼真的技巧\n\n要让你的 MIDI 音符听起来更像现场弦乐器，你可以考虑以下技巧：\n\n- 采样库不知道音符何时会结束。真正的音乐家会准备好离开音符并产生自然的渐弱。你可以通过自动化表现力来尝试模仿渐弱。\n\
  - 当现场管弦乐队开始演奏音符时，开始时会有一个轻微的渐强——一个轻微的渐强。好的采样库通常会为你完成此操作，但如果你使用的是廉价采样库，那么你可能需要找到一种变通方法来实现这一点。\n\
  - 当真正的音乐家演奏时，他们的音符并不完全 100% 准时。自然地，会有一些随机波动。你可能会想用 MIDI 编程将所有内容量化以使所有时间都完美。量化是一种钢琴卷帘效果，它将音符移动以适应钢琴卷帘网格并消除任何不精确。虽然这会将所有内容捕捉到钢琴卷帘网格上，但也会使所有内容过于机械般完美。你可以尝试通过使用名为\
  \ **Humanize** 的效果来修复这个问题，该效果存在于一些数字音频工作站中，例如 **Cubase**。\n\nHumanize 会为你的音符的开始和结束时间添加一点随机变化。FL\
  \ Studio 没有 **Humanize** 效果，因此如果你想添加一些随机变化，就必须手动调整音符的开始和结束时间。\n\n手动随机化是一项大量工作，即使你有\
  \ Humanize 效果工具，它仍然可能听起来缺乏现场演奏的真实感。出于这个原因，高级作曲家通常会现场录制他们的 MIDI 钢琴演奏并保留演奏的节奏，稍作修改。他们还在演奏时录制表现力，而不是事后添加表现力。他们使用调制轮或\
  \ MIDI 键盘踏板来做到这一点。\n\n- 如果所有音符力度都相同，你的音乐听起来会很机械。最好为你的音符力度添加随机性，使其听起来更像现场乐器。对于打击乐器（尤其是鼓），你应该始终添加一些力度变化。\n\
  \n## 为你的音符力度添加随机变化\n\nFL Studio 允许你为音符力度添加随机变化。这可以使用名为 **Randomizer** 的工具来完成。让我们学习如何使用\
  \ Randomizer 为音符力度添加随机性：\n\n1. 在钢琴卷帘中，选择钢琴卷帘选项 | 工具 | Randomize 下拉菜单，如以下屏幕截图所示：\n\
  \n![](img/e7035ac7133980a2ff428c56c901384d_145_0.png)\n\n图 4.22 – Randomize\n\n\
  2. 禁用 **Pattern** 和 **Bipolar** 按钮。根据你的力度偏好调整力度 (**VEL**) 旋钮，如以下屏幕截图所示：\n\n![](img/e7035ac7133980a2ff428c56c901384d_146_0.png)\n\
  \n*图 4.23 – 随机化力度*\n\n3. 调整旋钮后，你会发现你的作品中的音符已被分配了一些音符力度的随机性。你也可以随机化声像和音高。\n\n有了这些，你就知道如何让你的管弦乐\
  \ MIDI 音符听起来更逼真了。\n\n## 管弦乐作品混音的注意事项\n\n在混音时，你力求在低频、中频和高频之间实现良好的平衡。这意味着你在选择乐器时需要小心。你的音符选择也会决定你是否能实现良好的平衡。例如，贝斯很少会比其上方的部分高出一个八度以上。任何更多，你就会发现中频不足。这就是为什么你通常应该专注于弦乐部分的五个声部（每个声部一个——大提琴、低音提琴、中提琴、第一小提琴和第二小提琴）。实现这五个声部的良好组合将为你提供低频、中频和高频的良好平衡。\n\
  \n幸运的是，在数字音频工作站中，我们对声音有精细的控制，可以创建在现实世界中很难实现的音色组合。我们可以使用一种名为 **均衡（EQ）** 的工具来实现这一点。如果一种乐器被淹没，我们可以使用\
  \ EQ 来雕刻频率以增强我们的乐器。例如，我们可以削减频率以给其他乐器留出空间，或提升过软的频率。\n\n**混响** 是一种模拟空间中自然回声的效果。当你在混音采样乐器时，添加混响效果可以帮助融合你的管弦乐器。它使所有乐器听起来都存在于同一个房间中。混响在音乐以低音量播放时会消失在对话后面，因此你通常可以添加相当多的混响。\n\
  \n> **提示**\n> \n> 将扬声器调低，直到你几乎听不到音乐，并看看它是否仍然听起来需要混响。\n\n对于钢琴、竖琴或打击乐等打击乐器，轻微的延迟效果可以帮助使其栩栩如生。\n\
  \n当你添加 EQ 时，如果你有采样质量不佳的乐器，通常最好将乐器的底部和顶部频率滚降。如果有好的采样库，则不需要这样做。\n\n在专业级别，作曲家不会为他们的乐器插件使用键位切换。键位切换在进行乐器演奏法的精细混音时会变得繁琐，尤其是在演奏法频繁变化时。这样做需要你在重新排列音符位置时更改自动化效果。更简单的方法是将演奏法分配给不同的乐器并单独混音它们。此外，如果你想从不同的采样库中分层乐器，键位切换会使跟踪演奏法的开始和结束变得困难。\n\
  \n当你聆听你的作品时，你可能会注意到在混音之前某些乐器压倒了其他乐器。对于现场管弦乐队，作曲家必须考虑可以一起分层的乐器。如果错误的乐器组合配对，一些乐器可能会完全被淹没。\n\
  \n了解乐器频率范围可以让你了解如何平衡乐器，以便实现所需的音效。以下图表显示了乐器的频率范围：\n\n![](img/e7035ac7133980a2ff428c56c901384d_148_0.png)\n\
  \n图 4.24 – 乐器频率图表\n(https://commons.wikimedia.org/wiki/File:Estensione_Strumenti_Musicale.jpg)\n\
  \n如果你发现大多数乐器都占据相同的频率范围，你可能会发现乐器互相淹没。在这种情况下，值得用不同频率范围的乐器替换一种乐器。\n\n当你聆听你的作品时，你可以使用插件在混音器通道中直观地看到频率范围。如果可以的话，你可能想了解一下频谱图插件。频谱图插件为你提供了歌曲频率的精细见解。\n\
  \n## 现场管弦乐队的注意事项\n\n如果插件采样库这么好，为什么我们还要使用现场管弦乐队？现场管弦乐队相比采样管弦乐插件有几个优势。在现场管弦乐队中，你可以获得更自然的演奏法。例如，当你播放一个延音乐器采样时，你的数字音频工作站不知道你计划何时停止演奏音符。所以，它只是循环采样然后突然结束。当真正的演奏者演奏一个延音音符时，音乐家可以让声音自然地进出音符。\n\
  \n现场音乐家可以在音符开始前做好准备，并在音符结束前做好准备并进行渐弱。请注意，最顶级的采样库在使这种声音听起来自然方面做得很好，所以这变得越来越少是一个问题。\n\
  \n你应该使用现场管弦乐队的另一个原因是通过麦克风录制。当你录制一个管弦乐队时，你有近距离麦克风（称为 **tree mics**）、更远的麦克风（称为 **wide\
  \ mics**）和用于捕捉整个房间的声音，包括混响（称为 **surround mics**）的麦克风。当管弦乐队演奏时，你的 tree mics 会捕捉到它们旁边管弦乐器的一些声音。\n\
  \n其他管弦乐器的部分会渗入每个 tree mic 录音中。这使其听起来自然。当你使用采样库时，你得不到所有乐器自然融合的声音。尝试添加混响效果以将所有管弦乐器放置在模拟房间中以模仿这种行为。\n\
  \n现在我们已经学习了如何创作管弦乐作品，让我们总结本章。\n\n## 总结\n\n为管弦乐队作曲的能力在为电影和电子游戏作曲时备受推崇。了解管弦乐 MIDI\
  \ 作曲技术可以让你快速创作管弦乐音乐并交付由现场音乐家演奏的配乐。\n\n在本章中，你学习了如何使用 MIDI 编程创建管弦乐音乐。你了解了可以用来创作管弦乐音乐的各种插件。你还学习了如何使用力度、演奏法和表现力为你的作品增添真实感。最后，你学习了各种管弦乐\
  \ MIDI 编程技术、使采样乐器听起来逼真的技巧和混音思路。\n\n在下一章中，你将学习如何为音乐家创建乐谱、将音乐与视觉同步，以及如何创建音效。\n\n\n\
  \n\n"
- '# 第 5 部分'
- '## 使用 MuseScore 创建乐谱，使用 Fruity Video Player 进行配乐，以及叙事音乐


  作为一名作曲家，你应该掌握一些工具技能。其中之一就是为现场音乐家创建乐谱。这需要熟悉音乐记谱软件。其中最受欢迎的软件之一是 MuseScore。使用 MuseScore，你可以导出你的音乐项目并轻松快速地生成乐谱。


  你应该能够将音乐与视觉同步。导演会要求你的音乐在某些标记处响起，你应该知道如何对音乐进行时间编排以实现这一点。这可以使用数字音频工作站中的视频插件来完成。在本章中，我们将学习如何使用
  FL Studio 的 Fruity Video Player 工具将音频与视觉同步。


  开始一个新项目是可以的，前提是你想从头开始创作整首歌曲，但这并不是一种高效的作曲方式。我们将学习一种更快、更简单的方法。我们将把整个 FL Studio 作品转移到
  MuseScore。基本上，我们是在做相当于复制粘贴 MIDI 音乐音符的工作，这样 MuseScore 就可以为我们完成大部分音乐记谱工作。这将为你节省大量的时间。


  说实话，我第一次看到以下技术有多么容易时，我感到非常震惊。也许你也会如此。以下是如何使用 FL Studio 项目通过 MuseScore 创建乐谱的方法：


  - 1. 下载并安装 MuseScore。

  - 2. 在 FL Studio 中创建一个歌曲。


  要执行以下步骤，你需要在 FL Studio 中有一个歌曲以便导出为 MIDI 数据。只要它在钢琴卷帘中使用了一些 MIDI 音符，你就可以使用你在 FL Studio
  中创建的任何歌曲。


  - 3. 我们即将将你的项目导出为 MIDI 数据。在此之前，请确保保存一份项目的副本作为备份。为 MIDI 导出准备项目将不可逆地修改你的项目。因此，你必须先保存备份副本，以便在需要进一步调整时可以访问原始文件。

  - 4. 确保 Channel 架中的所有乐器都已适当命名。MuseScore 将根据你在 Channel 架中设置的乐器名称为每个部分命名。


  你可以通过在 Channel 架上右键单击乐器并选择 Rename, color and icon... 来重命名乐器，如以下屏幕截图所示：


  ![](img/e7035ac7133980a2ff428c56c901384d_156_0.png)


  图 5.3 – 在导出前为你的乐器命名


  确保为你的乐器赋予以后容易识别的名称。


  - 5. 在 FL Studio 中，导航到 **Tools | Macros | Prepare for MIDI export**，如以下屏幕截图所示：


  ![](img/e7035ac7133980a2ff428c56c901384d_157_0.png)


  图 5.4 – 准备 MIDI 导出


  选择 **Prepare for MIDI export** 后，将对你的项目执行一系列步骤以准备 MIDI 导出。


  - 6. 导航到 **FILE | Export | MIDI File**。将出现一个弹出窗口提示你保存 MIDI 文件并为其命名。记住你保存 MIDI 文件的位置。


  7. 确保选择了 MID，然后点击 Start，如以下屏幕截图所示：


  ![](img/e7035ac7133980a2ff428c56c901384d_158_0.png)


  图 5.5 – 将歌曲渲染为 MIDI


  你的歌曲已渲染为 MIDI 文件。我们现在可以将其导入 MuseScore。


  8. 打开 MuseScore。


  9. 选择 Load score from file 并选择你从 FL Studio 导出的 MIDI 文件。以下屏幕截图显示了如何导入你的项目：


  ![](img/e7035ac7133980a2ff428c56c901384d_159_0.png)


  图 5.6 – 加载乐谱


  选择你的 MIDI 文件后，MuseScore 将使用 MIDI 文件中的数据填充一份乐谱。以下屏幕截图显示了 MuseScore 从 FL Studio 项目生成的乐谱：


  ![](img/e7035ac7133980a2ff428c56c901384d_159_1.png)


  图 5.7 – MuseScore 添加你的歌曲


  哇！这很容易。我们完全不需要担心音符的放置和间距问题。


  你会注意到 MuseScore 犯了一些错误。例如，它对乐器的命名做出了可能正确也可能不正确的假设。你需要在 MuseScore 中之后去修复这些问题。此外，MuseScore
  可以导入音符，但不知道如何直接从数字音频工作站导入表情记号。对于这一点，你需要手动添加音乐记号。


  不用担心，有很多工具可以添加乐谱细节，例如标题、速度、调号和表情记号。在 MuseScore 的左侧，你会看到包含音乐记号的调色板列表。


  ![](img/e7035ac7133980a2ff428c56c901384d_160_0.png)


  图 5.8 – 包含音乐记号的调色板列表


  通过左键单击任意调色板下拉箭头，你可以看到可用的记号列表。然后你可以左键单击并将记号拖到你的乐谱上。


  添加音乐记号非常容易；只需从左侧的调色板中获取你需要的项目并将其拖到你的总谱上。非常直观。


  恭喜！你现在知道如何从 FL Studio 导出项目到 MuseScore 以创建乐谱。接下来，让我们学习如何使用 Fruity Video Player 将音乐与视觉同步。


  ## 使用 Fruity Video Player 将音乐与视觉同步


  如果你在电影制作团队早期就加入，导演可能会要求你在拍摄前为场景创作一首具有关键情感的歌曲。你会创作歌曲，编辑在素材准备好时调整画面以适应歌曲。这是你最容易的情况。它允许你有很大的灵活性和自由度进行实验，同时限制最少。如果为动画配乐，音乐几乎总是在动画阶段之前完成，这意味着动画师可以围绕音乐进行设计。


  但音乐并不总是先于视觉。这在你被要求在后期制作中为画面配乐时尤其如此。在某些情况下，导演会给你一部电影的剪辑版，并告诉你根据画面为音乐配乐。如果导演不喜欢前一位作曲家创作的音乐，这意味着你需要介入并修复或重新配乐。


  如果视频素材已经存在，你需要调整你的音乐以在电影中的某些关键时刻响起，使其适应视觉所要求的关键时间点。FL Studio 提供了用于规划音乐时间并将音乐与视频同步的工具。


  FL Studio 中同步音乐与视频的工具称为 **Fruity Video Player**。Fruity Video Player 随 FL Studio
  Signature Edition 及更高版本提供。


  让我们开始使用 Fruity Video Player 进行配乐：


  - 1. 在 Channel 架中，右键单击一个乐器并选择 Insert | Fruity Video Player。


  ![](img/e7035ac7133980a2ff428c56c901384d_162_0.png)


  图 5.9 – 插入 Fruity Video Player


  插件将加载，你会看到以下内容：


  ![](img/e7035ac7133980a2ff428c56c901384d_163_0.png)


  图 5.10 – Fruity Video Player


  Fruity Video Player 允许你加载视频以与视觉同步播放。


  - 2. 点击插件外部可能会导致它被背景面板隐藏。这很烦人，因为你通常希望视频播放器始终可见。我们可以通过点击下拉插件选项并选择 **Detached** 来修复这个问题，如以下屏幕截图所示：


