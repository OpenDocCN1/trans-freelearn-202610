- '## 2 探索 FL Studio 的关键功能


  在本章中，我们将讨论数字音频工作站 FL Studio 的主要功能。我们将讨论 FL Studio 是什么、如何获取它，并初步了解其核心工具。具体来说，我们将讨论如何使用通道机架、钢琴卷帘、播放列表、浏览器和混音器。最后，我们将学习如何录制音频和导出音乐。


