  ![](img/e7035ac7133980a2ff428c56c901384d_39_1.png)


  图 1.8 – Splice 网站


  在撰写本文时，Splice 还无法像 Git 那样合并不同文件版本之间的更改，因此每次只能有一个人对最新版项目进行修改，你们无法同时修改。这意味着，每次你打算处理项目文件时，都必须登录
  Splice 并打开项目的最新版本。如果你不这样做，很可能会发现自己在处理一个过时版本的项目文件。


  Splice 还提供了一个免版税声音素材库，你可以付费后在项目中使用。它还允许你租用乐器插件，直到付清相当于直接购买插件所需的金额，之后插件就归你所有。因此，如果你眼下手头拮据但又需要插件设备，这可能是一个比直接购买乐器插件更方便的替代方案。


  当你登录 Splice 时，会看到类似这样的界面：


  ![](img/e7035ac7133980a2ff428c56c901384d_40_0.png)


  图 1.9 – Splice 仪表板


  在左侧面板中，你可以看到项目导航、下载采样，或查看 Splice 中可用的工具。


  每次保存项目时，Splice 都会向仓库中添加一个新版本。你可以为单个轨道添加注释，供协作者查看。如果你们使用相同的数字音频工作站，可以从 Splice 打开项目文件，此后它会自动保持项目文件同步。下面的截图展示了
  Splice Studio 的示例，它用于管理歌曲版本：


