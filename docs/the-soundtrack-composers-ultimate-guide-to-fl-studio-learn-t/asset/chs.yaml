  你可以在 https://www.krotosaudio.com/weaponiser/ 了解更多关于 Weaponiser 的信息。


  ### Omnisphere


  Spectrasonics **Omnisphere** 是一款知名合成器。它是一款 MIDI 插件，拥有大量采样独特乐器的曲目，非常适合音效设计。


