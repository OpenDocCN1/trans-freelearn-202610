  - Record Union (https://www.recordunion.com/)

  - ReverbNation (https://www.reverbnation.com/)

  - Symphonic (https://symphonicdistribution.com/)

  - iMusician (https://imusician.pro/en/)


  > **注意：**

  > 如果你选择使用 DistroKid 作为你的数字分发服务提供商，以下链接可让你第一年享受折扣：https://distrokid.com/vip/seven/701180。


  如果可以，尽量通过协商保留你歌曲的权利。收取音乐版税是作曲家可以获得的一个额外收入来源。


  ### 总结


  在本章中，我们学习了为客户作曲的商业知识。我们了解了如何获得为客户创作音乐的工作，以快速启动你的作曲生涯。我们讨论了如何显得专业，以便客户认真对待你的建议，还学习了如何准备客户会议，从而有效利用客户的时间。我们学习了如何规划电影配乐，以便合理安排时间，如何在共享项目文件时与他人协作，以及如何使用
  Splice 进行版本控制。最后，我们讨论了如何收取你的音乐版税。


  在下一章中，我们将学习如何使用数字音频工作站，以便你能够开始作曲。

