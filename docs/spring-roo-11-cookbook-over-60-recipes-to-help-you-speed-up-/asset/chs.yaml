  \ 字段上 JSR 303 @DecimalMax 和 @DecimalMin 注释指定的约束的 Flight 实体。在 FlightDataOnDemand.java\
  \ 中定义 setOrigin 和 setDestination 方法会导致从 FlightDataOnDemand_Roo_DataOnDemand.aj 文件中删除具有相同签名的方法。\n\
  \n- 更改了 FlightIntegrationTest.java 中的 @RooIntegrationTest 注释，以指示 Roo 不生成 findAll、findEntries\
