  \n```\n.. roo> perform eclipse\n```\n\n- 5. 现在，将 flightapp-web 项目导入到您的 Eclipse IDE\
  \ 中。\n\n- 6. 修改 Flight.java 和 FlightDescription.java 以实现 java.io.Serializable 接口，如下所示：\n\
  \n```\nimport java.io.Serializable;\n...\npublic class Flight implements Serializable\
