  \ 方法后，您的 FlightController.java 应如下所示：\n\n```java\n@WebScaffold(...)\n@RequestMapping(\"\
  /flights\")\n@Controller\npublic class FlightController {\n    @Autowired\n    private\
  \ transient JmsTemplate jmsTemplate;\n\n    @RequestMapping(method = RequestMethod.POST)\n\
