  赫曼吉妮·巴里\n\n**开发编辑**\n妮哈·马利克\n雷什玛·桑达雷桑\n\n**制作协调员**\n尼莱什·R. 莫海特\n阿尔温·罗伊\n\n**技术编辑**\n\
  万吉特·D'souza\n梅林·谢赫\n\n**封面设计**\n尼莱什·R. 莫海特\n\n## 关于作者\n\n阿希什·萨林拥有 11 多年的经验，使用 Java\
  \ EE 技术架构和开发应用程序。他是 Java EE 平台的 Sun 认证企业架构师。他撰写了许多关于使用 Liferay、DWR、JSF 和 Spring\
  \ Portlet MVC 的门户和富 Internet 应用程序的文章。\n\n阿希什也是 *门户组件行动* (`http://manning.com/sarin/`)\
  \ 由 *曼宁出版公司* 出版。\n\n编写 Spring Roo 1.1 Cookbook 是一次非常满意的经历，因为它涵盖了众多技术。\n\n我要感谢托比亚斯·吕蒂克在本书审阅期间提供出色的反馈。这对改进本书的技术内容和呈现方式大有帮助。\n\
