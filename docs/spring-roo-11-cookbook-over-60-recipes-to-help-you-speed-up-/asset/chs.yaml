  Created SRC_TEST_JAVA\\..MyFlightDod_Roo_DataOnDemand.aj\n\n## 工作原理\n\ndod 命令接受两个参数：\n\
  \n- entity: 需要创建“数据按需”类的实体的完全限定名。\n- class: “数据按需”类的名称。该类标注了 @RooDataOnDemand 注解。如果未指定此参数，则默认类名为\
  \ <entity-name>DataOnDemand，其中 <entity-name> 是实体的简单名称。\n\ndod 命令生成相应的“数据按需”Java\
  \ 类、 *_Roo_DataOnDemand.aj 和 *_Roo_Configurable.aj。现在，你可以在集成测试类中使用新创建的“数据按需”Java\
