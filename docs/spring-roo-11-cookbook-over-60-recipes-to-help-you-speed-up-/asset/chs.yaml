  />\n```\n\n- 3. 打开 SRC_MAIN_WEBAPP/WEB-INF/i18n\\messages.properties，并按如下所示修改 welcome_text\
  \ 属性值：\n\n```\nwelcome_text=Flight Application allows you to perform CRUD operations\
  \ on Flight and FlightDescription JPA entities. It also allows you to search for\
  \ a FlightDescription based on origin and destination.\n```\n\n- 4. 将 banner-graphic.png（来自此章附带的文件）复制到\
  \ SRC_MAIN_WEBAPP\\images 目录。\n\n- 5. 从 Spring Roo 1.1.5 开始，Roo shell 不会主动监控 JSPX\
  \ 文件的更改；因此，请重启 Roo shell。您现在会发现 id 为 c_flightdescription 和 c_flight 的 `<menu:category>`\
  \ 标记的 z 属性值已更改为用户管理。\n\n### 工作原理\n\nRoo 生成的 Web 应用程序使用 messages.properties 和 application.properties\
  \ 资源包来支持 Web 用户界面的国际化。application.properties 文件包含 Roo 生成的 Web 应用程序各个 Web 页面上显示的菜单和表单字段的标签。application.properties\
  \ 文件中包含的标签源自 JPA 实体及其字段的名称。此外，应用程序主页上显示的 Web 应用程序名称也包含在 application.properties 文件中。messages.properties\
  \ 包含适用于所有 Roo 生成的 Web 应用程序且不特定于单个 Web 应用程序的通用消息。例如，Save 按钮和 Reset 按钮的标签在 messages.properties\
  \ 文件中指定。有关如何使用这些属性文件来国际化或本地化 Roo 生成的 Spring Web MVC 应用程序的详细信息，请参阅“国际化 Roo 生成的 Web\
  \ 应用程序”配方。\n\n当 JPA 实体发生更改时，并非所有由 Roo 生成的文件都由 Roo 管理。例如，仅当向域模型添加新的 JPA 实体或向其添加新字段时，Roo\
  \ 才会修改 application.properties 文件。删除字段或 JPA 实体不会自动从 application.properties 文件中删除对应的字段或\
  \ JPA 实体的标签属性。但是，修改 JPA 实体中字段的名称会导致向 application.properties 文件添加新属性。由于 Roo 永远不会尝试管理\
  \ application.properties 文件中定义的现有标签属性，因此您可以安全地更改它们。messages.properties 文件包含通用标签；因此，一旦生成，它永远不会由\
  \ Roo 管理。\n\nmenu.jspx 文件和 WEB-INF/views 文件夹内包含的 JSPX 文件由 Spring Roo 管理。如果您添加、修改或删除\
  \ JPA 实体中的字段，则 Roo 负责更新相应的 JSPX 视图（位于 WEB-INF/views 内）以反映更改。menu.jspx 文件由 Roo 管理，以确保在创建新的\
  \ Spring Web MVC 控制器或向已有控制器的 JPA 实体添加查找器方法时，会在 menu.jspx 中添加其他菜单选项。\n\n现在，让我们来看看基于对\
  \ Roo 生成的 flight-app 项目执行的操作，我们是如何实现修改后的主页的：\n\n\n\n## 更改显示的应用程序名称和欢迎文本\n\n要更改应用程序名称和欢迎文本，我们首先需要找到显示\
  \ Web 应用程序主页的 JSPX 视图，然后在 `application.properties` 文件中找到相应属性，该属性由 JSPX 视图用于显示应用程序名称和欢迎文本。或者，您可以先在\
  \ `application.properties` 文件中查看要更改的标签的属性键，然后使用 IDE 搜索使用这些属性键的 JSPX 文件。\n\n我们先来查找显示\
  \ `flight-app` 应用程序主页的 JSPX 视图。在 `webmvc-config.xml` 文件中，以下 `<view-controller>`\
  \ 元素表明，当 Web 应用程序根目录 `/` 收到请求时，视图名称为 `index`：\n\n```\n<mvc:view-controller path=\"\
  /\" view-name=\"index\"/>\n```\n\n现在，`webmvc-config.xml` 中的以下 `UrlBasedViewResolver`\
  \ 表明，我们需要在 Tiles 定义 XML 文件中查找名为 `index` 的 Tiles 定义，以找到视图：\n\n```\n<bean class=\"\
  org.springframework.web.servlet.view.\nUrlBasedViewResolver\" id=\"tilesViewResolver\"\
  >\n<property name=\"viewClass\"\nvalue=\"org.springframework.web.servlet.view.\n\
  tiles2.TilesView\"/>\n</bean>\n```\n\n`webmvc-config.xml` 中的以下 `TilesConfigurer`\
  \ 配置表明在哪里查找 Tiles 定义 XML，以找到名为 `index` 的 Tiles 定义：\n\n```\n<bean class=\"org.springframework.web.servlet.view.tiles2.TilesConfigurer\"\
  \ id=\"tilesConfigurer\">\n<property name=\"definitions\">\n<list>\n<value>/WEB-INF/layouts/layouts.xml</value>\n\
  <value>/WEB-INF/views/**/views.xml</value>\n</list>\n</property>\n</bean>\n```\n\
  \n快速浏览 `TilesConfigurer` 指定的 XML 配置文件可发现，`index` Tiles 定义在 `SRC_MAIN_WEBAPP/WEB-INF/views/views.xml`\
  \ 文件中定义，如下所示：\n\n```\n<definition name=\"index\" extends=\"default\">\n<put-attribute\
  \ name=\"body\"\nvalue=\"/WEB-INF/views/index.jspx\" />\n</definition>\n```\n\n\
  如我们将在“向 Roo 生成的 Web 应用程序添加静态视图”一节中看到的，<put-attribute> 元素指的是负责显示页面主体内容（不包括页眉、页脚和菜单）的\
  \ JSPX 文件。因此，/WEB-INF/views/index.jspx 是显示 flight-app 应用程序主页的文件。\n\n以下代码显示 index.jspx\
  \ 文件的内容：\n\n```\n<div xmlns:spring=\"http://www.springframework.org/tags\"\n xmlns:util=\"\
  urn:jsptagdir:/WEB-INF/tags/util\" .. >\n\n    <spring:message var=\"app_name\"\
  \ code=\"application_name\" .../>\n    <spring:message var=\"title\"\n        code=\"\
  welcome_titlepane\" arguments=\"${app_name}\" .../>\n\n    <util:panel id=\"title\"\
  \ title=\"${title}\">\n        <h3>\n            <spring:message code=\"welcome_h3\"\
  \n                arguments=\"${app_name}\" />\n        </h3>\n        <p>\n   \
  \         <spring:message code=\"welcome_text\" />\n        </p>\n    </util:panel>\n\
  </div>\n```\n\nSpring 标签库中的 <message> 标签从资源包中检索消息和标签，对于 flight-app 应用程序，这些资源包是 Roo\
  \ 生成的 application.properties 和 messages.properties 文件。code 属性标识需要从资源包中获取其值的属性键。var\
  \ 属性标识将返回的属性值分配给的变量。arguments 属性指定需要传递给 <message> 标签的参数，这些参数通常由 <message> 标签实现用于填充从资源包中检索的消息或标签中指定的占位符。\n\
  \n<panel> 标签是 Roo 在执行 controller all 命令时安装的自定义标签之一。<panel> 标签用于显示可折叠面板。要查看 <panel>\
  \ 标签的实现，请参阅 /WEB-INF/tags/util/panel.tagx 文件。\n\n下表显示了 `index.jspx` 文件中由 `<message>`\
  \ 标签指定的消息和标签所在的属性文件及其值：\n\n| 代码 | 属性值 |\n|---|---|\n| application_name | 定义在 application.properties\
  \ 中。<br>值：Flight-app。 |\n| welcome_titlepane | 定义在 messages.properties 中。<br>值：Welcome\
  \ to {0}。 |\n| welcome_h3 | 定义在 messages.properties 中。<br>值：Welcome to {0}。 |\n\
  | welcome_text | 定义在 messages.properties 中。<br>值：Spring Roo 提供交互式、轻量级的 ... |\n\n\
  `welcome_titlepane` 和 `welcome_h3` 的值中的 {0} 表示一个占位符，它由 `<message>` 元素的 arguments\
  \ 属性中指定的值填充。\n\n给定的表表明，如果更改 `application_name` 属性，将更改主页上显示的应用程序名称。如果更改 `welcome_text`\
  \ 属性，将更改默认的欢迎文本。\n\n## 更改菜单选项\n\n`menu.jspx` 文件显示 Roo Web 应用程序中的菜单选项。下表描述了构成 `menu.jspx`\
  \ 文件的标签：\n\n| 标签 | 描述 |\n|---|---|\n| `<menu>` | `<menu>` 自定义标签（定义在 `menu.tagx`\
  \ 中）定义一个菜单。 |\n| `<category>` | `<category>` 标签（定义在 `category.tagx` 中）定义菜单中的顶级类别。\
  \ |\n| `<item>` | `<item>` 标签（定义在 `item.tagx` 中）定义菜单类别中的项目。 |\n\n以下属性适用于 Spring\
  \ Roo 安装的所有标签（包括菜单的 <menu>、<item> 和 <category> 标签）：\n\n- id: id 属性由 Roo 用于检查 JSPX\
  \ 文件中元素的存在性。对于 Roo 生成的视图，id 属性的值派生自 JPA 实体名和字段名。例如，由 `<menu:item>` 元素创建的菜单项 **Create\
  \ new Flight Description** 的 id 属性值为 `i_flightdescription_new`，它派生自 `FlightDescription`\
  \ JPA 实体的名称。如果移除 id 为 `i_flightdescription_new` 的 `<menu:item>` 元素，则 Roo 会发现该元素已被移除，并会将其_再次_添加到\
  \ JSPX 文件中。\n\n- 在某些情况下，id 属性的值也会由标签实现用于确定在标签实现中应使用的消息或标签。例如，如果未指定 `messageCode`\
  \ 属性，则 `item.tagx` 实现会使用 `<menu:item>` 元素的 `i_flightdescription_new` id 来查找与菜单项关联的标签。\n\
  \n- render: render 属性指定是否应渲染标签的内容。默认情况下，render 属性的值为 `true`，即应渲染标签的内容（包括封闭标签）。如果不希望渲染标签及其封闭标签的内容，请将该值设置为\
  \ `false`。\n\n- z: z 属性由 Spring Roo 内部用于检查开发者是否对标签进行了任何修改。正是 z 属性允许 Roo 执行往返操作。z\
  \ 属性的值表示 JSPX 文件中某个标签的哈希键，该哈希键基于标签名、标签中存在的属性及其值计算得出。z 属性永不参与哈希键的计算。此外，标签中指定属性的顺序也不会在哈希键计算中被考虑。\n\
  \n- 如果对标签进行任何修改（通过添加属性、修改属性值或删除任何属性），Roo 会发现这一点，因为该标签的哈希键现在将不再与 Roo 为该标签计算的哈希键匹配。在出现不匹配的情况，Roo\
  \ 会将 z 的值简单地设置为 `user-managed`。\n\n## Roo 安装的 JSP 标签中 z 属性的意义\n\n让我们来看看 menu.jspx\
  \ 中的以下元素，以了解 z 属性的相关性：\n\n```\n<menu:item id=\"i_flightdescription_new\"\nmessageCode=\"\
  global_menu_new\"\nurl=\"/flightdescriptions?form\"\nz=\"DFDc4F2kZR5yns4ZeMk5pr3E84=\"\
  \ />\n```\n\n\n\n给定的 <item> 元素显示了一个标记为 **创建新航班描述** 的菜单项。\n<item> 标签的 url 属性用于标识处理\
  \ Web 请求的 Web 控制器，当点击 **创建新航班描述** 菜单选项时触发该请求。由于 url 属性值为 /flightdescriptions?form，且与\
  \ FlightDescriptionController 类级别的 @RequestMapping 注解值匹配（请参阅 FlightDescriptionController.java\
  \ 文件），因此当点击 **创建新航班描述** 菜单选项时，由 FlightDescriptionController 处理该请求。如果将 url 属性（以及\
  \ FlightController.java 中对应的类级别 @RequestMapping 注解）更改为，例如，/fds?form，则 Roo 会自动将 <item>\
  \ 元素的 z 属性值更新为 user-managed，这意味着 Roo 不再管理该元素。在本示例的后续部分，我们将探讨如何将元素从用户托管模式切换回 Roo\
  \ 托管模式。\n\n## 了解 Roo 生成的 JSPX 文件\n\n让我们来看一下 /WEB-INF/views/flights/create.jspx 视图，该视图显示了用于创建\
  \ Flight 实体的表单。以下代码显示了 create.jspx 的内容：\n\n```\n<div xmlns:field=\"urn:jsptagdir:/WEB-INF/tags/form/fields\"\
  \nxmlns:form=\"urn:jsptagdir:/WEB-INF/tags/form\" xmlns:jsp=\"http://java.sun.com/JSP/Page\"\
  \ xmlns:spring=\"http://www.springframework.org/tags\"\n...\n<form:create id=\"\
  fc_sample_roo_flightapp_domain_Flight\"\nmodelAttribute=\"flight\"\npath=\"/flights\"\
  \ render=\"${fn:empty dependencies}\"\nz=\"JEBB+QGFrFLKSzYDOjyDjJnTPc=\" >\n<field:datetime\n\
  dateTimePattern=\"${{flight_departuredate_date_format}}\"\nfield=\"departureDate\"\
  \nid=\"c_sample_roo_flightapp_domain_Flight_departureDate\"\nz=\"BtcAuQvStTt55J3J6zFybfhksXa=\"\
  \ />\n...\n<field:select field=\"flightDescription\"\nid=\"..\" itemValue=\"flightDescId\"\
  \nitems=\"${{flightdescriptions}}\"\npath=\"/flightdescriptions\" required=\"true\"\
  \nz=\"MPt8rEJwJ7fZFpQUZPDn6K7+A8OE=\" />\n...\n</form:create>\n...\n</div>\n```\n\
  \n关于 Roo 生成的 `create.jspx` 文件，有几点值得注意：\n\n- `<create>` 自定义标签（请参阅 `/WEB-INF/tags/form/create.tagx`）用于创建\
  \ HTML 表单。如果你查看 `create.tagx` 文件，会发现它使用 Spring 的 `form` 标签库来创建表单。`render` 属性指定，如果存在在创建\
  \ `Flight` 实体之前需要创建的某些依赖项，则不应渲染表单。稍后我们将看到 `dependencies` 变量的来源。\n\n- `<datetime>`\
  \ 自定义标签（请参阅 `/WEB-INF/tags/form/fields/datetime.tagx`）用于创建一个文本字段，以输入航班出发日期。`field`\
  \ 属性标识已为其创建文本字段的 `Flight` JPA 实体的字段。该文本字段与 `dijit`（Dojo 的 UI JavaScript 库）日期日历相关联，以简化向字段输入日期。\n\
  \n- `<select>` 自定义标签（请参阅 `/WEB-INF/tags/form/fields/select.tagx`）用于创建一个下拉框，用于选择我们即将创建的航班关联的航班描述。同样，`field`\
  \ 属性标识已为其创建下拉框的 `Flight` JPA 实体的字段。`required` 属性指定创建 `Flight` 实体时是否必须选择航班描述。由于 `required`\
  \ 属性的值为 `true`，你必须从下拉框中选择一个航班描述才能创建 `Flight` 实体。\n\n可以看出，Roo 智能地决定使用 `<datetime>`\
  \ 标签来创建对应 `Date` 类型的字段，例如 `Flight` 实体的 `departureDate` 字段。Roo 还解析了 `Flight` 和 `FlightDescription`\
  \ JPA 实体之间的 `@ManyToOne` 关系，并创建了一个下拉框（使用 `<select>` 标签）来选择航班描述。由于 `Flight` 和 `FlightDescription`\
  \ 实体之间的 `@ManyToOne` 关系还带有 `@NotNull` 注解（JSR-303 注解），Roo 通过将 `<select>` 标签的 `required`\
  \ 属性设置为 `true`，在用户界面一侧转换了该依赖关系。\n\n现在，让我们看看 `<create>` 标签如何使用 `dependencies` 变量来决定是否渲染创建\
  \ `Flight` 表单。在创建 `Flight` 实体时，你会注意到的一件事是它会要求你先创建 `FlightDescription`，如下图所示：\n\n\
  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_185_0.png)\n\n如屏幕截图所示，Web 应用程序没有显示 **创建新航班**\
  \ 表单，而是显示一条说明，指出我们需要先创建航班描述。显示说明的决定由 `dependencies` 变量作出，如下所示：\n\n```\n<form:create\
  \ id=\"fc_sample_roo_flightapp_domain_Flight\"\n modelAttribute=\"flight\"\n path=\"\
  /flights\" **render=\"${empty dependencies}\"**\n ...\n```\n\n`dependencies` 变量由\
  \ `FlightController` 添加到请求中。`FlightController` 根据 `Flight` JPA 实体参与的关系来识别其依赖项。由于\
  \ `Flight` 实体与 `FlightDescription` 实体具有非空多对一关系，`FlightController` 将其作为依赖项添加到 `dependencies`\
  \ 变量中，如 `FlightController_Roo_Controller.aj` 文件的内容所示：\n\n```\n@RequestMapping(params\
  \ = \"form\", method = RequestMethod.GET)\npublic String FlightController.createForm(Model\
  \ model)\n{\n    model.addAttribute(\"flight\", new Flight());\n    addDateTimeFormatPatterns(model);\n\
  \    List dependencies = new ArrayList();\n    if (FlightDescription.countFlightDescriptions()\
  \ == 0)\n    {\n        dependencies.add(new String[]{\"flightDescription\",\n \
  \           \"flightdescriptions\"});\n    }\n    model.addAttribute(\"dependencies\"\
  , dependencies);\n    return \"flights/create\";\n}\n```\n\n`createForm` 方法负责渲染用于创建\
  \ `Flight` 实体实例的表单。给定代码显示，如果未找到 `FlightDescription` 实体实例，则 `createForm` 方法会向 `dependencies`\
  \ 模型属性添加一个 `String[]`。`dependencies` 属性包含当前不可用于创建 `Flight` 实例的依赖项。只有当 `dependencies`\
  \ 属性为空时，才会渲染创建 `Flight` 实体的表单，这一点我们已经见过。\n\n我们之前看到，可以将 JSPX 文件中的元素从 Roo 托管模式切换到\
  \ `user-managed` 模式。在某些场景中，你可能希望从 `user-managed` 模式切换回 Roo 托管模式。让我们来看看如何操作：\n\n\
  ## 将元素从用户托管模式切换到 Roo 托管模式\n\n我们看到，Spring Roo 完成了大量繁重工作来创建 Web 应用程序的用户界面。这包括创建 JSPX\
  \ 文件、安装自定义标签、创建 Spring Web MVC 控制器、创建 Web 应用程序上下文 XML 文件、创建 Web 应用程序部署描述符、创建 Tiles\
  \ 定义、安装主题等。我们还看到，用于显示航班描述的 `<select>` 标签的 `required` 属性值被设置为 `true`，因为 Flight JPA\
  \ 实体与 FlightDescription 实体存在非空多对一关系。\n\n假设我们希望 `departureDate` 字段的文本框在创建 `Flight`\
  \ 实体时也是必填的。你可以给 `Flight` JPA 实体的 `departureDate` 字段添加 `@NotNull` JSR-303 注解，并让 Roo\
  \ 负责将 `departureDate` 文本框的 `required` 属性值设置为 `true`。我们再假设，不想对 `Flight` 实体做任何更改，且在从用户界面创建\
  \ `Flight` 实体时必须在 `departureDate` 字段中输入日期。我们只需将 `required` 属性值设置为 `true`，如下所示：\n\
  \n```\n<field:datetime\ndateTimePattern=\"${flight_departuredate_date_format}\"\n\
  field=\"departureDate\" required=\"true\"\nid=\"c_sample_roo_flightapp_domain_Flight_departureDate\"\
  \nz=\"BtcAuQvStTt55J3J6zFybhfkSxA=\" />\n```\n\n由于我们已将 `required` 属性的默认值从 `false`\
  \ 更改为 `true`，因此实际上已经修改了该元素；因而，Roo 会将 `z` 属性的值设置为 user-managed。Spring Roo 中的用户托管元素不参与往返操作；因此，如果你对\
  \ `Flight` 实体的 `departureDate` 字段进行任何修改，Roo 将 *不会* 对 `create.jspx` 文件中的 `departureDate`\
  \ 元素做出相应修改。例如，如果你从 `Flight` 实体中删除 `departureDate` 字段，则 Roo 不会从 `create.jspx` 中删除\
  \ `departureDate` 元素。如果你希望修改后的表单元素再次变为 Roo 托管，只需将 `z` 属性的值设置为 `？` 即可。`？` 的值指示 Roo\
  \ 基于当前属性及其值重新计算 `z` 属性的值，从而使 Roo 能够判断将来表单元素是否发生变化。\n\n正如我们刚才讨论的，你可以通过添加或修改一个或多个属性来控制\
  \ JSPX 视图中的 Roo 托管表单元素。建议在对表单元素进行更改后，通过将 `z` 属性的值设置为 `？` 来恢复 Roo 托管模式。在 Roo 托管模式下，Roo\
  \ 会处理对 JPA 实体的任何修改，从而省去对视图进行调整的工作。\n\n### 另请参阅\n\n- 请参阅 Spring Roo 中 Web 控制器和视图的往返操作支持示例，查看\
  \ Roo 中往返操作支持的示例\n\n\n\n\n\n- 请参阅“向 Roo 生成的 Web 应用程序添加静态视图”配方，了解如何将自定义 Web 页面添加到\
  \ Roo 生成的 Web 应用程序中\n- 请参阅“为特定 JPA 实体创建 Spring MVC 控制器”配方，了解如何指示 Roo 不为某些功能生成视图的详细信息。\n\
  \n## Spring Roo 中 Web 控制器和视图的往返支持\n\n在 Roo 生成的应用程序中，您可以更改 JPA 实体，并让 Roo 负责对控制器和视图进行必要的更改。在本配方中，我们将通过一个示例场景，演示对\
  \ JPA 实体的更改如何传播到相应的控制器和视图。\n\n### 准备工作\n\n删除 C:\\\\roo-cookbook 目录中 ch04-recipe\
  \ 子目录的内容。\n\n将 ch04_web-app.roo 脚本复制到 ch04-recipe 目录中。\n\n执行 ch04_web-app.roo 脚本，该脚本将创建\
  \ flight-app Roo 项目，将 Hibernate 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 Flight 和 FlightDescription\
  \ JPA 实体，并定义 Flight 与 FlightDescription 实体之间的多对一关系。如果您使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 C:\\\\roo-cookbook\\\\ch04-recipe 目录启动 Roo shell。\n\n执行 controller all 命令，为\
  \ flight-app 项目中的 JPA 实体创建相应的控制器和视图，如下所示：\n\n```\n.. roo> controller all --package\
  \ ~.web\n```\n\n执行 perform eclipse 命令以更新项目的类路径设置，如下所示：\n\n```\n.. roo> perform eclipse\n\
  ```\n\n现在，将项目导入到您的 Eclipse IDE 中。\n\nFlightDescription.java 文件中的以下代码显示了 FlightDescription\
  \ 实体，我们将在本配方中修改它，以感受 Roo 的往返功能：\n\n```\n@RooJavaBean\n@RooToString\n@RooEntity(identifierField\
  \ = \"flightDescId\",\nidentifierColumn = \"FLIGHT_DESC_ID\",\ntable = \"FLIGHT_DESC_TBL\"\
  ,\nfinders = {\"findFlightDescriptionsByDestinationAndOrigin\" })\npublic class\
  \ FlightDescription\n{\n    @NotNull\n    @Column(name = \"ORIGIN_CITY\")\n    private\
  \ String origin;\n    @NotNull\n    @Column(name = \"DESTINATION_CITY\")\n    private\
  \ String destination;\n    @NotNull\n    @Column(name = \"PRICE\")\n    private\
  \ Float price;\n}\n```\n\n### 操作步骤...\n\n要查看 Web 控制器和视图的往返支持，请按照以下步骤操作：\n\n- 1.\
  \ 在编辑器中打开 FlightDescription.java 文件。\n\n- 2. 从 @RooEntity 注解中删除 finders 属性及其值，并保存\
  \ FlightDescription.java 文件。Roo shell 将显示 Roo 为响应删除 finders 属性而采取的操作，如下所示：\n\n```\n\
  Updated SRC_MAIN_WEBAPP\\WEB-INF\\views\\menu.jspx\nDeleted SRC_MAIN_JAVA\\...\\\
  web\\FlightDescriptionController_Roo_Controller_Finder.aj\nDeleted SRC_MAIN_JAVA\\\
  ...\\domain\\FlightDescription_Roo_Finder.aj\n```\n\n- 3. 将 origin 字段的名称更改为 originCity，destination\
  \ 字段的名称更改为 destinationCity，并保存 FlightDescription.java 文件。Roo shell 将显示 Roo 为响应我们的更改而采取的以下操作：\n\
  \n```\nUpdated ...\\WEB-INF\\views\\flightdescriptions\\list.jspx\nUpdated ...\\\
  WEB-INF\\views\\flightdescriptions\\show.jspx\nUpdated ...\\WEB-INF\\views\\flightdescriptions\\\
  create.jspx\nUpdated ...\\WEB-INF\\views\\flightdescriptions\\update.jspx\nUpdated\
  \ ...\\WEB-INF\\i18n\\application.properties\nUpdated ...\\domain\\FlightDescription_Roo_JavaBean.aj\n\
  Updated SRC_MAIN_JAVA\\...\\web\\ApplicationConversionServiceFactoryBean_Roo_ConversionService.aj\n\
  Updated SRC_MAIN_JAVA\\...\\domain\\FlightDescription_Roo_ToString.aj\n```\n\n-\
  \ 4. 从 price 字段中删除 @NotNull JSR 303 注解，并保存 FlightDescription.java 文件。现在，Roo shell\
  \ 将显示针对该更改的以下输出：\n\n```\nUpdated... \\WEB-INF\\views\\flightdescriptions\\create.jspx\n\
  Updated... \\WEB-INF\\views\\flightdescriptions\\update.jspx\n```\n\n### 工作原理...\n\
  \n现在让我们来看看当我们修改 FlightDescription.java 时 Spring Roo 做了什么。当移除 finders 元素时，Spring\
  \ Roo 在 flight-app 项目中做出了以下调整：\n\n- Spring Roo 删除了包含查找器方法实现的 FlightDescription_Roo_Finder.aj\
  \ ITD。\n\n> 如果 JPA 实体定义了多个查找器方法，则从 @RooEntity 注解的 finders 属性中删除单个查找器方法将仅从 ITD 文件中删除相应的查找器方法。\n\
  \n- 最初创建 FlightDescriptionController_Roo_Controller_Finder.aj ITD 时，它包含一个用于显示表单的方法（参阅\
  \ /WEB-INF/views/flightdescriptions/findFlightDescriptionsByDestinationAndOrigin.jspx），允许根据出发地和目的地城市搜索\
  \ FlightDescription。它还包含一个用于搜索 FlightDescription 实例并显示结果的方法（参阅 /WEB-INF/views/flightdescriptions/list.jspx）。现在，由于查找器方法已被移除，显示搜索表单和搜索结果的控制器方法也被移除。需要注意的是，在\
  \ Spring Roo 1.1.3 中，负责搜索实体实例的方法不会在 FlightDescriptionController_Roo_Controller_Finder.aj\
  \ 中创建。此错误已在 Spring Roo 1.1.4 及更高版本中修复。\n\n> 需要注意的是，即使 findFlightDescriptionsByDestinationAndOrigin.jspx\
  \ 文件在 flight-app 应用程序中不再需要，Spring Roo 也不会将其删除。您需要手动从 Roo 项目中删除 JSPX 文件。这是因为 Spring\
  \ Roo 不会自动删除应用程序中不再需要的 JSPX 文件。\n\n- 由于查找器方法已被移除，菜单选项“按目的地和城市查找”也已从 menu.jspx 文件中移除。\n\
  \n当修改 origin 和 destination 字段名称时，Roo 将执行以下修改：\n\n- 在 `FlightDescription_Roo_JavaBean.aj`\
  \ ITD 中，`origin` 和 `destination` 字段的 getter 和 setter 方法已分别替换为 `originCity` 和 `destinationCity`\
  \ 的 getter 和 setter 方法。\n\n- 在 `FlightDescription_Roo_ToString.aj` ITD 中，`toString`\
  \ 方法已修改为包含 `destinationCity` 和 `originCity` 字段的值，而不是 `origin` 和 `destination` 字段。\n\
  \n- 在“从 JPA 实体自动生成 Spring MVC 控制器和 JSPX 视图”配方中，我们讨论了 Roo 生成的 `ApplicationConversionServiceFactoryBean`\
  \ 如何由 Web 应用程序上下文 XML 中定义的 `<mvc:annotation-driven>` 元素配置。我们之前看到，flight-app 项目的\
  \ `*_Roo_ConversionService.aj` 文件将代表 `Flight` 和 `FlightDescription` JPA 实体的转换器的静态类引入\
  \ `ApplicationConversionServiceFactoryBean` 类中。\n\n- 以下代码显示在 `ApplicationConversionServiceFactoryBean_Roo_ConversionService.aj`\
  \ 中定义的 `FlightDescriptionConverter` 静态类，它返回 `FlightDescription` 实体的转换器：\n\n```\n\
  import org.springframework.core.convert.converter.Converter;\nprivileged aspect\
  \ ApplicationConversionServiceFactoryBean_Roo_ConversionService {\n...\nstatic class\
  \ ApplicationConversionServiceFactoryBean.FlightDescriptionConverter implements\n\
  Converter<FlightDescription, java.lang.String> {\npublic String convert(FlightDescription\n\
  flightDescription){\nreturn new StringBuilder().\nappend(flightDescription.getOrigin()).\n\
  append(\"\").\nappend(flightDescription.getDestination()).\nappend(\" \").\nappend(flightDescription.getPrice()).toString();\n\
  }\n}\n...\n}\n```\n\n在给定代码中，`FlightDescriptionConverter` 静态类实现了 Spring 的 `Converter`。它将\
  \ `FlightDescription` JPA 实体转换为 `String` 表示形式。`FlightDescription` 的 `String` 表示形式是通过简单连接其每个字段的值来创建的。\n\
  \n由于我们将 `origin` 和 `destination` 字段的名称修改为 `originCity` 和 `destinationCity`，Roo 修改了\
  \ `FlightDescription` Converter 类以使用字段的修改后的 getter 方法。这些修改引起的变化可概述如下：\n\n- `application.properties`\
  \ 文件已修改为为 `originCity` 和 `destinationCity` 字段添加充当标签的新属性，如下所示：\n\n```\nlabel_sample_roo_flightapp_domain_flightdescription_destinationcity=Destination\
  \ City\nlabel_sample_roo_flightapp_domain_flightdescription_origincity=Origin City\n\
  ```\n\n如您所料，属性名称源自 JPA 实体所在的包，即 JPA 实体名称和字段名称。还需要注意的是，一旦将属性添加到 `application.properties`\
  \ 文件中，Roo 永远不会将其删除或修改。Roo 始终在 `application.properties` 文件中创建新属性。因此，如果您频繁修改 JPA 实体字段，将导致\
  \ `application.properties` 文件中不需要的属性激增，您需要手动将其删除。\n\n- JSPX 视图：`/WEB-INF/views/flightdescriptions/`\
  \ 中的 `create.jspx`、`update.jspx`、`show.jspx` 和 `list.jspx` 文件已修改，以反映 `FlightDescription`\
  \ JPA 实体字段名称的更改。需要注意的是，如果 JSPX 视图中定义的字段不是 Roo 管理的，即 `z` 属性的值为 'user-managed'，则 Roo\
  \ 不会响应 JPA 实体的更改对该字段进行任何修改。\n\n当从 `FlightDescription` 的 `price` 字段中移除 `@NotNull`\
  \ JSR 303 注解时，Roo 会将此更改级联到 `/WEB-INF/views/flightdescriptions/create.jspx` 和 `/WEB-INF/views/flightdescriptions/update.jspx`\
  \ 视图。Roo 对这些视图所做的唯一更改是从显示 Web 用户界面上 `price` 字段的 `<input>` 自定义标签元素中移除 `required`\
  \ 属性。\n\n### 更多内容...\n\nRoo 对 JSPX 视图的往返支持非常复杂，可以处理 Roo 管理的 JPA 实体中的以下更改：\n\n- 字段名称更改\n\
  - 字段类型更改\n- 与字段关联的 JSR 303 注解更改\n\n\n\n\n\n- 字段移除\n- 新字段添加\n\n如果希望 JSPX 中的某个元素在\
  \ Roo 管理的 JPA 实体对应字段被修改时保持不变，则可以手动将 z 属性值设置为用户管理。此更改的副作用是，如果添加或修改相应的 JPA 实体字段，Roo\
  \ 将在 JSPX 视图中创建一个新元素。\n\n## 另请参阅\n\n- 参阅“修改 Roo 生成的视图”配方，了解如何修改由 Spring Roo 创建的视图\n\
  - 参阅“向 Roo 生成的 Web 应用程序添加静态视图”配方，了解 Roo 如何支持向 Spring MVC Web 应用程序添加静态视图\n\n## 为特定\
  \ JPA 实体创建 Spring MVC 控制器\n\ncontroller all 命令可让你为所有尚未创建对应控制器的 JPA 实体创建控制器。如果你想控制控制器映射的\
  \ Web 请求路径或控制器支持的操作，则应使用 controller scaffold 命令。\n\n### 准备工作\n\n删除 C:\\\\roo-cookbook\
  \ 目录下 ch04-recipe 子目录的内容。\n\n将 ch04_web-app.roo 脚本复制到 ch04-recipe 目录中。\n\n执行 ch04_web-app.roo\
  \ 脚本，该脚本会创建 flight-app Roo 项目，将 Hibernate 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 Flight\
  \ 和 FlightDescription JPA 实体，并在 Flight 与 FlightDescription 实体之间定义多对一关系。如果你使用的数据库不是\
  \ MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\n从 C:\\\\roo-cookbook\\\\ch04-recipe 目录启动 Roo\
  \ shell。\n\n### 操作方法\n\n以下步骤展示如何使用 `controller scaffold` 命令为 JPA 实体创建控制器：\n\n1.\
  \ 执行 `controller scaffold` 命令创建 `FlightController`，如下所示：\n\n```\nroo> controller\
  \ scaffold --class ~.web.FlightController --entity ~.domain.Flight --path /myflightpath\
  \ --disallowedOperations update,delete\n```\n\n2. 执行 `perform eclipse` 命令以更新类路径设置，并在\
  \ Eclipse IDE 中导入项目。\n\n### 工作原理\n\n下表描述了传递给 `controller scaffold` 命令的每个参数的用途：\n\
  \n| 参数 | 描述 |\n|---|---|\n| class（必需） | 要创建的控制器类的完全限定名称。 |\n| entity（可选） | Roo 管理的\
  \ JPA 实体类（即使用 `@RooEntity` 注解的类）的完全限定名称，由生成的控制器用作表单支撑对象。该参数的值转换为 `@RooWebScaffold`\
  \ 注解的 `formBackingObject` 属性的值。 |\n| path（可选） | 标识 `/WEB-INF/views/` 内包含与控制器对应的\
  \ JSPX 视图的子目录。该参数的值转换为 `@RooWebScaffold` 注解的 `path` 属性的值。`path` 参数的值还转换为生成的控制器中\
  \ `@RequestMapping` 类级注解的值。 |\n| disallowedOperations（可选） | 生成的控制器不支持的操作的逗号分隔列表。例如，如果值为\
  \ `update, delete`，则生成的控制器不包含用于更新和删除生成控制器所对应的 JPA 实体的方法。该参数的唯一有效值为 `update`、`delete`\
  \ 和 `create`。 |\n\n`FlightController.java` 文件中的以下代码展示了由 `controller scaffold` 命令创建的\
  \ `FlightController`：\n\n```\n@RooWebScaffold(path = \"myflightpath\", formBackingObject\
  \ = Flight.class, update = false, delete = false)\n@RequestMapping(\"/myflightpath\"\
  )\n@Controller\npublic class FlightController {\n}\n```\n\n如给定代码所示，@RooWebScaffold\
  \ 注解的 path 属性值和 @RequestMapping 注解的值均源自 controller scaffold 命令的 path 参数值。controller\
  \ scaffold 命令的 disallowedOperations 参数值用于 @RooWebScaffold 注解中，以指定生成的控制器不支持的操作。\n\
  \n下表描述了 @RooWebScaffold 注解的元素：\n\n| 元素 | 描述 |\n|---|---|\n| path | 指定 /WEB-INF/views/\
  \ 内包含与控制器对应创建的 JSPX 视图的文件夹。 |\n| formBackingObject | 指定控制器用作表单支撑对象的 JPA 实体类。 |\n\
  | update | 指示更新操作是否由控制器的 *_Roo_Controller.aj AspectJ ITD 定义。如果为 true，Roo 会创建用于更新相应\
  \ Roo 管理的 JPA 实体的 JSPX 视图。默认值为 true。 |\n| create | 指示创建操作是否由控制器的 *_Roo_Controller.aj\
  \ AspectJ ITD 定义。如果为 true，Roo 会创建用于创建相应 Roo 管理的 JPA 实体的 JSPX 视图。默认值为 true。 |\n|\
  \ delete | 指示删除操作是否由控制器的 *_Roo_Controller.aj AspectJ ITD 定义。如果为 true，Roo 生成的 JSPX\
  \ 视图提供删除相应 Roo 管理的 JPA 实体的选项。默认值为 true。 |\n| exposeFinders | 公开 Roo 管理的 JPA 实体中定义的查找器方法。如果公开了查找器方法，则会创建一个\
  \ *_Roo_Controller_Finder.aj ITD，其中包含用于呈现输入搜索条件的表单、搜索实例并显示搜索结果的方法。默认值为 true。 |\n\
  | exposeJson | 指示如果相应的 Roo 管理的 JPA 实体使用 @RooJson 类级注解进行注解，则使用 JSON 公开控制器功能（创建、更新、显示和删除）。默认值为\
  \ true。有关如何为 Roo 管理的 JPA 实体和 Spring Web MVC 控制器添加 JSON 支持的详细信息，请参阅“向域对象和控制器添加 JSON\
  \ 支持”配方。 |\n\n下表描述了 *_Roo_Controller.aj ITD 中包含的方法（假设生成了所有控制器操作）：\n\n| 方法 | 描述 |\n\
  |---|---|\n| createForm | 显示创建实体的表单。创建表单支撑对象的新实例（即 @RooWebScaffold 注解的 formBackingObject\
  \ 属性指定的 Roo 管理的 JPA 实体），添加持久化 Roo 管理的 JPA 实体所需的依赖项（这些依赖项包括参与关系的实体，例如持久化 Flight 实体需要\
  \ FlightDescription），并添加日期/时间模式（如果需要）。 |\n| create | 持久化控制器公开的 Roo 管理实体。还会对实例执行\
  \ JSR 303（如果可用）验证。添加日期/时间模式（如果需要）。 |\n| show | 显示持久化实体实例的详细信息。添加日期/时间模式（如果需要）。 |\n\
  | list | 显示持久化实体实例的列表。添加日期/时间模式（如果需要）。还添加对数据分页的支持。 |\n| updateForm | 显示更新实体实例的表单。添加日期/时间模式（如果需要）。\
  \ |\n| update | 持久化对实体实例的更改。添加日期/时间模式（如果需要）。 |\n| delete | 删除实体实例。 |\n\n> 更多内容...\n\
  \n如本配方所示，controller scaffold 命令提供选项以帮助创建自定义控制器。即使你已使用 controller all 命令创建了控制器，仍可通过设置\
  \ @RooWebScaffold 注解的属性来自定义控制器。\n\n让我们来看看如何在 *_Roo_Controller.aj 文件中覆盖自动生成的方法：\n\
  \n## 覆盖自动生成的控制器方法\n\n在某些场景下，你可能希望覆盖 *_Roo_Controller.aj 文件的自动生成方法以提供自定义实现。要覆盖在 ITD\
  \ 中定义的方法，只需在控制器 Java 文件中定义一个同名方法（参数和返回类型可以相同或不同）即可。\n\n假设在我们的 flight-app Web 应用程序中，需要满足以下要求：\n\
  \n- 目前，在更新 Flight 实体实例时，FlightController 在只读视图中显示更新后的实体实例。需要更改此默认功能，使得在更新后，控制器显示\
  \ Flight 实例列表。\n- 为满足此要求，需要覆盖 FlightController_Roo_Controller.aj ITD 中定义的 update\
  \ 方法的默认行为。要覆盖 update 方法的默认行为，只需在 FlightController.java 文件中定义一个 update 方法（参数和返回类型可以相同或不同），如下所示：\n\
  \n```\n@RequestMapping(method = RequestMethod.PUT)\npublic String update(@Valid\
  \ Flight flight, ..) {\n...\nreturn \"redirect: /myflightpath/list\";\n}\n```\n\n\
  在给定代码中，update 方法在持久化对 Flight 实体的更改后，将用户重定向到 myflightpath/list（而不是 /myflightpath/{flightId}）。\n\
  \n> 在 Spring Roo 1.1.3 中，如果你尝试通过在 *Controller.java 文件中定义方法来覆盖 *_Roo_Controller.aj\
  \ 文件中定义的方法，Roo 会报错说该方法已在 *Controller.java 文件中定义。此问题在 Spring Roo 1.1.4 及更高版本中已解决。\n\
  \n## 另请参阅\n\n- 参阅“为 JPA 实体手动创建 Spring MVC 控制器”配方，了解如何手动创建控制器。\n- 参阅“从 JPA 实体自动生成\
  \ Spring MVC 控制器和 JSPX 视图”配方，了解如何使用 controller all 命令生成实体。\n\n\n\n\n\n## 为 JPA 实体手动创建\
  \ Spring MVC 控制器\n\n如果要创建自定义控制器，Roo 提供了 `controller` 类命令，用于创建控制器和 JSPX 视图的骨架结构，以便您快速上手。\n\
  \n假设在我们的 `flight-app` 应用程序中有以下实体：\n\n- `Customer`: 表示航班预订应用程序中的客户\n- `Address`:\
  \ 表示客户的地址\n\n为简单起见，假设 `Customer` 和 `Address` 实体之间存在一对一双向关系，且 `Customer` 是关系的所有者。`Customer`\
  \ 实体只有一个字段：`customerName`，而 `Address` 实体有两个字段：`addressLine1` 和 `addressLine2`。\n\
  \n假设 `flight-app` 应用程序要求 `Customer` 和相应的 `Address` 实体从同一个表单创建。当用户输入客户姓名并单击 **Add\
  \ address** 按钮（如下一张截图所示）时，表单将展开以显示用于输入客户地址信息和保存客户详细信息的表格。以下截图显示了输入信息的表单：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_198_0.png)\n\
  \n在给定的截图中，单击 **Save** 按钮将创建一个 `Customer` 以及相应的 `Address` 实体实例。\n\n如前所述，Roo 生成的视图一次只允许创建或更新单个实体。在此场景中，我们需要同时创建\
  \ `Customer` 和 `Address` 实体。这不仅要求我们创建自定义视图，还需要创建自定义控制器。\n\n### 准备工作\n\n删除 `C:\\\
  roo-cookbook` 目录中 `ch04-recipe` 子目录的内容。\n\n将 `ch04_manual_controller.roo` 脚本复制到\
  \ `ch04-recipe` 目录中。\n\n执行 `ch04_manual_controller.roo` 脚本，该脚本将创建 flight-app Roo\
  \ 项目，将 Hibernate 设置为持久性提供程序，将 MySQL 配置为应用程序数据库，创建 Flight、FlightDescription、Customer\
  \ 和 Address JPA 实体，定义 Flight 和 FlightDescription 实体之间的多对一关系以及 Customer 和 Address\
  \ 实体之间的一对一关系。如果您使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\n从 `C:\\roo-cookbook\\\
  ch04-recipe` 目录启动 Roo shell。\n\n### 操作步骤\n\n要了解如何为给定的应用程序需求使用手动创建的 Spring Web MVC\
  \ 控制器，请按以下步骤操作：\n\n- 1. 执行 `web mvc setup` 命令，以设置 Spring Web MVC 工件，并将 Roo 项目转换为\
  \ Web 项目：\n  ```\n  roo> web mvc setup\n  ```\n\n- 2. 执行 `controller class` 命令，如下所示：\n\
  \  ```\n  roo> controller class --class ~.web.CustomerController\n  --preferredMapping\
  \ /customer\n  ```\n  Created SRC_MAIN_JAVA\\sample\\roo\\flightapp\\web\\CustomerController.java\n\
  \  Created SRC_MAIN_WEBAPP\\WEB-INF\\views\\customer\n  Created SRC_MAIN_WEBAPP\\\
  WEB-INF\\views\\customer\\index.jspx\n  Updated SRC_MAIN_WEBAPP\\WEB-INF\\i18n\\\
  application.properties\n  Created SRC_MAIN_WEBAPP\\WEB-INF\\views\\menu.jspx\n \
  \ Created SRC_MAIN_WEBAPP\\WEB-INF\\tags\\menu\\menu.tagx\n  Created SRC_MAIN_WEBAPP\\\
  WEB-INF\\tags\\menu\\item.tagx\n  Created SRC_MAIN_WEBAPP\\WEB-INF\\tags\\menu\\\
  category.tagx\n  Created SRC_MAIN_WEBAPP\\WEB-INF\\views\\customer\\views.xml\n\n\
  - 3. 在处理 `web mvc setup` 命令期间，许多依赖项被添加到 `flight-app` 项目的 `pom.xml` 文件中，因此执行 Roo\
  \ 的 `perform eclipse` 命令以更新 Eclipse 项目的 `.classpath` 文件：\n  ```\n  roo> perform\
  \ eclipse\n  ```\n  现在，在 Eclipse IDE 中导入 `flight-app` 项目。\n\n- 4. 在 Customer.java\
  \ 文件中，通过将 @OneToOne JPA 注解的 optional 属性值设置为 false，使 Customer 和 Address 实体之间的关联成为强制性。此外，将\
  \ @OneToOne 的 cascade 属性值设置为 CascadeType.ALL。以下清单显示了 Customer.java 中修改后的 @OneToOne\
  \ 注解：\n\n  ```\n  import javax.persistence.CascadeType;\n  ..\n  @RooEntity(table\
  \ = \"CUSTOMER_TBL\")\n  public class Customer {\n      @NotNull\n      @Column(name\
  \ = \"CUST_NAME\")\n      private String customerName;\n      @OneToOne(optional\
  \ = false, cascade = CascadeType.ALL)\n      @JoinColumn(name = \"CUSTOMER_ID\"\
  )\n      private Address address;\n  }\n  ```\n\n- 5. 在 Address.java 文件中，通过将 @OneToOne\
  \ 注解的 optional 属性值设置为 false，使 Address 和 Customer 实体之间的关联成为强制性。由于 Customer 实体是关系的所有者，请将\
  \ @OneToOne JPA 注解的 mappedBy 属性值设置为 address。以下清单显示了 Address.java 中修改后的 @OneToOne\
  \ 注解：\n\n  ```\n  ...\n  @RooEntity(table = \"ADDRESS_TBL\")\n  public class Address\
  \ {\n      @NotNull\n      @Column(name = \"ADDRESS_LINE1\")\n      private String\
  \ addressLine1;\n      ...\n      @OneToOne(optional = false, mappedBy = \"address\"\
  )\n      private Customer customer;\n  }\n  ```\n\n  如同 Spring Roo 1.1.5 中，field\
  \ reference 命令不支持任何参数来指定一对一双向关系的所有者；因此，您需要编辑 Java 源代码来指定 @OneToOne 注解的 mappedBy\
  \ 属性值。另一方面，field set 命令确实提供 mappedBy 参数来指定关系所有者。\n\n- 6. 将 SRC_MAIN_JAVA 文件夹中 sample.roo.flightapp.web\
  \ 包下的 CustomerController.java 文件替换为本章源代码文件夹中包含的文件。\n\n将 `/WEB-INF/views/customer/`\
  \ 文件夹中的 `index.jspx` 文件替换为本章源代码文件夹中包含的 `index.jspx` 文件。\n\n退出 Roo shell，并使用以下 maven\
  \ 命令将 `flight-app` 项目部署到嵌入式 Tomcat 实例作为动态 Web 应用程序：\n\n```\n.ch04-recipe> mvn tomcat:run\n\
  ```\n\n现在，您可以通过访问以下 URL 来访问 `flight-app` 应用程序：\n`http://localhost:8080/flight-app`\n\
  \n如果您看到以下网页，则表示您已成功在嵌入式 Tomcat 实例上部署 `flight-app` 应用程序：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_201_0.png)\n\
  \n在给定的截图中，选择 **Customer Controller View** 菜单选项将带您进入创建 `Customer` 和 `Address` 实体的表单。\n\
  \n### 工作原理\n\n`controller` 类命令用于创建手动控制器。它接受以下参数：\n\n- `class`: 您要创建的控制器类的完全限定名。\n\
  \n- `preferredMapping`: 控制器映射到的请求路径。`preferredMapping` 参数的值用于推导生成的控制器中 `@RequestMapping`\
  \ 类级注解的值。`preferredMapping` 的值还用于在 `/WEB-INF/views/` 内部创建一个子文件夹，用于包含与生成的控制器对应的 JSPX\
  \ 视图和 tiles 定义 XML 文件。\n\n如输出所示，执行 `controller` 类命令时，Roo 执行以下操作：\n\n- 创建骨架 `CustomerController`\
  \ Web 控制器，将控制器实现细节留给开发者提供。\n\n- 在 `/WEB-INF/views/` 内部创建 `customer` 子文件夹。\n\n- 在\
  \ `/WEB-INF/views/customer` 文件夹中创建骨架 `index.jspx` 视图，将视图详细信息留给开发者提供。\n\n- 在 `/WEB-INF/views/customer`\
  \ 文件夹中创建 tiles 定义 XML 文件 `views.xml`。它包含单个 tiles 定义 `customer/index`，对应 `index.jspx`\
  \ 视图。如我们稍后将看到的，骨架 `CustomerController` 实现使用 `customer/index` tiles 定义来显示 `index.jspx`\
  \ 视图。\n\n- 将 `Customer Controller View` 标签添加到 `application.properties` 文件中，该文件被\
  \ `menu.jspx` 文件用于显示调用 `CustomerController` Web 控制器的菜单选项。\n\n- 将标记为 `Customer Controller\
  \ View` 的菜单选项添加到 `menu.jspx` 文件中，用于调用 `CustomerController` Web 控制器。\n\n需要注意的是，执行\
  \ `controller class` 命令时不会创建 AspectJ ITD 文件。\n\n以下来自 `CustomerController.java` 文件的代码显示了由\
  \ `controller class` 命令生成的 `CustomerController`：\n\n```\n@RequestMapping(\"/customer/**\"\
  )\n@Controller\npublic class CustomerController {\n\n    @RequestMapping\n    public\
  \ void get(ModelMap modelMap, ...) { }\n\n    @RequestMapping(method = RequestMethod.POST,\
  \ value = \"{id}\")\n    public void post(@PathVariable Long id, ...) { }\n\n  \
  \  @RequestMapping\n    public String index() {\n        return \"customer/index\"\
  ;\n    }\n}\n```\n\n如给定代码所示，生成的控制器将控制器的实现留给开发者编写。当单击 **Customer Controller View**\
  \ 菜单选项时，将调用 `index()` 方法。`index()` 方法只是返回 `customer/index`，从而显示 `index.jspx` 视图。\n\
  \nRoo 生成的 `CustomerController` 几乎没有任何用处，因此您需要编写其功能。随本章源代码提供的 `CustomerController.java`\
  \ 文件包含创建 `Customer` 和 `Address` 实体所需的功能。让我们现在看看提供的 `CustomerController.java` 文件中定义的方法：\n\
  \n\n\nCustomerController 的 index() 方法将 Customer JPA 实体设置为表单支持对象，并添加另一个模型属性，用于标识是否显示表单的地址部分。CustomerController.java\
  \ 文件中的以下代码展示了 index() 方法：\n\n```java\n@RequestMapping\npublic String index(Model\
  \ model) {\nmodel.addAttribute(\"showAddressSection\", false);\nCustomer customer\
  \ = new Customer();\ncustomer.setAddress(new Address());\nmodel.addAttribute(\"\
  customer\", customer);\nreturn \"customer/index\";\n}\n```\n\nindex() 方法设置 showAddressSection\
  \ 和 customer 模型属性。showAddressSection 属性被 index.jspx 视图用作标志，以决定是否显示或隐藏表单的地址部分。customer\
  \ 模型属性代表 Customer JPA 实体，它充当表单支持对象。\n\n现在，当用户单击“添加地址”按钮时，将调用 CustomerController\
  \ 的以下 showAddress 方法：\n\n```java\n@RequestMapping(method = RequestMethod.POST,\n\
  params = \"user-action=showAddressForm\")\npublic String showAddress(@Valid Customer\
  \ customer,\nBindingResult result, Model model, ...) {\nif (result.hasErrors())\
  \ {\nmodel.addAttribute(\"customer\", customer);\n} else {\nmodel.addAttribute(\"\
  showAddressSection\", true);\nmodel.addAttribute(\"customer\", customer);\n}\nreturn\
  \ \"customer/index\";\n}\n```\n\n给定代码中的 @RequestMapping 注解指定，当请求类型为 HTTP POST 且\
  \ user-action 请求参数的值为 showAddressForm 时，将调用 showAddress 方法。如果没有绑定或验证错误，则 showAddressSection\
  \ 模型属性将设置为 true。\n\n如果 showAddressSection 模型属性的值为 true，则表示 index.jspx 视图将显示表单的地址部分，以允许用户为客户输入地址。现在，用户可以输入地址信息并单击“保存”按钮以持久化\
  \ Customer 和关联的 Address JPA 实体实例。当用户单击“保存”按钮时，将调用 CustomerController 的以下 create\
  \ 方法：\n\n```java\n@RequestMapping(method = RequestMethod.POST,\n\tparams = \"user-action=create\"\
  )\npublic String create(@Valid Customer customer, ...) {\n\tcustomer.persist();\n\
  \treturn \"customer/index\";\n}\n```\n\n给定代码中的 @RequestMapping 注解表示，当请求类型为 HTTP\
  \ POST 且 user-action 请求参数的值为 create 时，将调用 create 方法。\n\n以下代码展示了修改后的 /WEB-INF/views/customer/index.jspx\
  \ 文件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n\
  <jsp:root xmlns:c=\"http://java.sun.com/jsp/jstl/core\"\n\txmlns:spring=\"http://www.springframework.org/tags\"\
  \n\txmlns:form=\"http://www.springframework.org/tags/form\">\n<form:form modelAttribute=\"\
  customer\"\n\taction=\"customer\" method=\"POST\">\n<form:errors cssClass=\"errors\"\
  \ delimiter=\"&lt;p/&gt;\" />\n<c:choose>\n\t<c:when test=\"${not showAddressSection}\"\
  >\n\t\t<spring:message text=\"Customer name\" />:\n\t\t<form:input path=\"customerName\"\
  \ />\n\t\t<input type=\"submit\" value=\"Add address\" />\n\t\t<input type=\"hidden\"\
  \ name=\"user-action\"\n\t\t\tvalue=\"showAddressForm\" />\n\t</c:when>\n\t<c:otherwise>\n\
  \t\t<spring:message text=\"Customer name\" />:\n\t\t<form:input path=\"customerName\"\
  \ onclick=\"blur();\" />\n\t\t<input type=\"submit\" value=\"Add address\"\n\t\t\
  \tdisabled=\"disabled\" />\n\t\t<input type=\"hidden\" name=\"user-action\"\n\t\t\
  \tvalue=\"create\" />\n\t</c:otherwise>\n\t<table>\n\t\t<thead>\n\t\t\t<tr>\n\t\t\
  \t\t<td colspan=\"2\">Address</td>\n\t\t\t</tr>\n\t\t</thead>\n\t\t<tr>\n\t\t\t\
  <td>\n\t\t\t\t<label for=\"addressLine1\">\nAddress Line 1\n\t\t\t\t</label>\n\t\
  \t\t</td>\n\t\t\t...\n\t\t</tr>\n\t</table>\n</form:form>\n</jsp:root>\n```\n\n\
  给定的 index.jspx 文件表明，我们可以在不使用 Spring Roo 安装的自定义标签库的情况下创建 JSPX 视图，也可以创建自己的自定义标签库并用它来创建\
  \ JSPX 视图。index.jspx 使用 Spring 的 form 标签库来创建 HTML 表单。showAddressSection 模型属性用于显示或隐藏表单的地址部分。user-action\
  \ 隐藏输入字段将设置为适当的值（showAddressForm 或 create），具体取决于用户单击的是“添加地址”按钮还是“保存”按钮。\n\n## 还有更多...\n\
  \n我们了解了如何使用 Roo 生成的 JPA 实体并编写自定义 JSPX 视图和 Web 控制器来创建 Web 应用程序。现在，我们来看看 Roo 为 @OneToMany\
  \ 关系生成的视图存在的一个特定局限性：\n\n## 为一对多关系脚手架 Spring Web MVC 应用程序\n\nSpring Roo 不会为一对多关系中的“一”端脚手架\
  \ HTML 元素。让我们通过一个示例来看看这一点：\n\n在 flight-app 应用程序中，Booking 实体实例表示客户对航班的预订。在特定航班上，可能存在多个预订；因此，Flight\
  \ 和 Booking 实体之间的关系是一对多。随本书附带的 ch04_one_to_many.roo 脚本执行以下操作：\n\n- 创建 Flight 和 Booking\
  \ 实体\n- 在 Flight 和 Booking 实体之间创建一对多关系\n- 为实体创建控制器和 JSPX 视图\n\n退出 Roo shell 并删除\
  \ ch04-recipe 的内容。执行 ch04_one_to_many.roo 脚本，并使用 maven 运行生成的 Spring Web MVC 应用程序（如“打包、部署和使用\
  \ Roo 生成的 Spring MVC 应用程序”配方中所述）。\n\n现在，使用生成的 Web 应用程序中 **创建新预订** 菜单选项创建一个 Booking\
  \ 实例，如以下屏幕截图所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_206_0.png)\n\n创建 Booking\
  \ 实例后，您就可以创建新的 Flight 实例，并将 Flight 与新创建的 Booking 实例关联。要创建新的 Flight 实例，请选择 **创建新航班**\
  \ 菜单选项，该选项将显示创建 Flight 实例的表单，如下图所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_206_1.png)\n\
  \n如给定的屏幕截图所示，Spring Roo 没有脚手架一个 HTML 元素来选择多个 Booking 实例，以帮助在 Flight 和 Booking 实体实例之间创建一对多关系。那么，当关系是一对多时，我们如何在实体之间创建关系呢？要使用脚手架\
  \ Spring Web MVC 应用程序来管理 Booking 和 Flight 实体之间的关系，请在 Booking 实体（关系的多端）中指定带 @ManyToOne\
  \ 注解的字段，以在 Booking 和 Flight 实体之间创建多对一关系。现在，您可以创建 Flight 实例（而无需指定关联的 Booking 实例），并从创建\
  \ Booking（关系的多端）实例的表单中管理 Booking 和 Flight 实例之间的关系。\n\n如果您不想向 Booking 实体添加带 @ManyToOne\
  \ 注解的字段，可以修改 /WEB-INF/flights/create.jspx 视图（用于显示创建 Flight 实例表单）以添加一个字段，该字段显示一个多选列表框以显示\
  \ Booking 实例。create.jspx 中的以下 <field:simple> 自定义标签（由 Roo 安装）将显示消息：**此关系从 Booking\
  \ 端进行管理**，当您选择菜单选项以查看创建 Flight 实例的表单时：\n\n```xml\n<field:simple field=\"bookings\"\
  \n  id=\"c_sample_roo_flightapp_domain_Flight_bookings\"\n  messageCode=\"entity_reference_not_managed\"\
  \n  messageCodeAttribute=\"Booking\" z=\"...\" />\n```\n\n您可以使用 `<field:select>`\
  \ 标签（由 Roo 安装）替换 `<field:simple>` 标签，该标签显示一个多选列表框：\n\n```xml\n<field:select field=\"\
  bookings\"\n  id=\"c_sample_roo_flightapp_domain_Flight_bookings\"\n  itemValue=\"\
  id\" items=\"${bookings}\" multiple=\"true\"\n  path=\"/bookings\"/>\n```\n\n如果您查看\
  \ FlightController_Roo_Controller.aj 文件，会找到一个带 @ModelAttribute 注解的方法，该方法将所有 Booking\
  \ 实例存储在名为 bookings 的模型属性中。在给定的代码中，bookings 模型属性由 `<field:select>` 标签的 `items` 属性引用，以在多选列表框中显示\
  \ Booking 实例。\n\n## 另请参见\n\n- 请参阅“在实体之间创建一对多（或多对多）关系”配方\n- 第 3 章配方\n\n## 向 Roo 生成的\
  \ Web 应用程序添加静态视图\n\n在 Spring Web MVC 应用程序中，静态视图是指无需显式创建控制器类的视图。我们之前了解到，Roo 脚手架的\
  \ Spring Web MVC 应用程序使用 Spring mvc 架构中的 `<view-controller>` 元素来配置静态视图。静态视图没有显式控制器，但在幕后，Spring\
  \ 的内置 `ParameterizableViewController` 用于呈现静态视图。有关 Roo 生成的 Web 应用程序中预配置静态视图的详细信息，请参阅“从\
  \ JPA 实体自动生成 Spring MVC 控制器和 JSPX 视图”配方。\n\n在本配方中，我们将查看 Roo 的 `web mvc install view`\
  \ 命令，该命令用于创建静态视图。\n\n### 准备工作\n\n删除 `C:\\roo-cookbook` 目录中 `ch04-recipe` 子目录的内容。\n\
  \n将 `ch04_web-app.roo` 脚本复制到 `ch04-recipe` 目录中。\n\n\n\n\n执行 `ch04_web-app.roo` 脚本来创建\
  \ `flight-app` Roo 项目，将 Hibernate 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 `Flight` 和 `FlightDescription`\
  \ JPA 实体，并在 `Flight` 和 `FlightDescription` 实体之间定义多对一关系。如果使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，则相应地修改脚本。\n\
  \n从 `C:\\roo-cookbook\\ch04-recipe` 目录启动 Roo shell。\n\n执行 `controller all` 命令，为\
  \ `flight-app` 项目中的 JPA 实体创建相应的控制器和视图，如下所示：\n\n```\n.. roo> controller all --package\
  \ ~.web\n```\n\n执行 `perform eclipse` 命令以更新项目的类路径设置，如下所示：\n\n```\n.. roo> perform\
  \ eclipse\n```\n\n现在，将 `flight-app` 项目导入到您的 Eclipse IDE 中。\n\n### 操作方法...\n\n要向\
  \ Roo 生成的 Web 应用程序添加静态视图，请执行 `web mvc install view` 命令，如下所示：\n\n```\n.. roo> web\
  \ mvc install view --path /static/views --viewName help --title Help\n```\n\n```\n\
  Created SRC_MAIN_WEBAPP\\WEB-INF\\views\\static\\views\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\views\\static\\views\\help.jspx\nManaged SRC_MAIN_WEBAPP\\WEB-INF\\i18n\\\
  application.properties\nManaged SRC_MAIN_WEBAPP\\WEB-INF\\views\\menu.jspx\nCreated\
  \ SRC_MAIN_WEBAPP\\WEB-INF\\views\\static\\views\\views.xml\nManaged SRC_MAIN_WEBAPP\\\
  WEB-INF\\spring\\webmvc-config.xml\n```\n\n### 工作原理...\n\n下表描述了 `web mvc install\
  \ view` 命令接受的参数：\n\n| 参数 | 说明 |\n| :--- | :--- |\n| `path` | 指定在 `/WEB-INF/views/`\
  \ 文件夹中创建视图的子文件夹。 |\n| `viewName` | 视图 JSPX 文件的名称。 |\n| `title` | 指定可访问静态视图的菜单选项名称。\
  \ |\n\n正如 `web mvc install view` 命令的输出所示，执行该命令后 Spring Roo 会执行以下操作：\n\n- 在 /WEB-INF/views\
  \ 文件夹内创建 /static/views 目录。Roo 使用 path 参数的值来确定要创建的目录。\n- 在 /WEB-INF/views/static/views\
  \ 目录内创建 help.jspx 文件。viewName 参数的值用作 JSPX 文件的名称。\n- 向 application.properties 添加值为\
  \ Help 的属性，即，title 参数的值用作新添加属性的值。该属性由 menu.jspx 用于显示 **帮助** 菜单选项。**帮助** 菜单选项允许访问新创建的\
  \ help.jspx 视图。\n- 在 /WEB-INF/views/static/views/views.xml 中创建 tiles 定义 XML 文件，包含用于显示\
  \ help.jspx 视图的单个 tiles 定义，如下所示：\n\n```xml\n<tiles-definitions>\n    <definition\
  \ extends=\"default\" name=\"static/views/help\">\n        <put-attribute name=\"\
  body\"\n            value=\"/WEB-INF/views/static/views/help.jspx\"/>\n    </definition>\n\
  </tiles-definitions>\n```\n\n- 向 webmvc-config.xml 添加 `<view-controller>` 元素，以便在无需编写控制器的情况下访问\
  \ help.jspx 视图，如下所示：\n\n`<mvc:view-controller path=\"/static/view/help\"/>`\n\n\
  ## 另请参阅\n\n- 有关如何创建自定义控制器和视图的详细信息，请参阅 *手动为 JPA 实体创建 Spring MVC 控制器* 配方。\n\n## 国际化\
  \ Roo 生成的 Web 应用程序\n\nRoo 通过为标签和消息使用资源包，支持完整 UI 的国际化。在本配方中，我们将查看 Roo 的 `web mvc\
  \ install language` 命令，并了解它如何简化 Roo 生成的 Web 用户界面的国际化。\n\n### 准备工作\n\n删除 C:\\roo-cookbook\
  \ 目录内 ch04-recipe 子目录的内容。\n\n将 ch04_web-app.roo 脚本复制到 ch04-recipe 目录中。\n\n执行 ch04_web-app.roo\
  \ 脚本，该脚本创建 flight-app Roo 项目，将 Hibernate 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 Flight\
  \ 和 FlightDescription JPA 实体，并在 Flight 和 FlightDescription 实体之间定义多对一关系。如果使用的数据库不是\
  \ MySQL，或者连接设置与脚本中指定的不同，则相应地修改脚本。\n\n从 C:\\roo-cookbook\\ch04-recipe 目录启动 Roo shell。\n\
  \n执行 controller all 命令，为 flight-app 项目中的 JPA 实体创建相应的控制器和视图，如下所示：\n\n```\n.. roo>\
  \ controller all --package ~.web\n```\n\n执行 perform eclipse 命令以更新项目的类路径设置，如下所示：\n\
  \n```\n.. roo> perform eclipse\n```\n\n现在，将项目导入到您的 Eclipse IDE 中。\n\n### 操作方法...\n\
  \n要对 Roo 生成的 Web 用户界面进行国际化，请执行 web mvc install language，如下所示：\n\n```\n.. roo> web\
  \ mvc install language --code es\n```\n\n```\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\\
  i18n\\messages_es.properties\nCreated SRC_MAIN_WEBAPP\\images\\es.png\nManaged SRC_MAIN_WEBAPP\\\
  WEB-INF\\views\\footer.jspx\n```\n\n### 工作原理...\n\nweb mvc install language 命令接受一个参数：code，用于标识需要为其添加支持的\
  \ Web 应用程序的语言代码。code 参数接受一个预定义的语言代码，具体取决于 Spring Roo 支持的语言。Spring Roo 为以下语言代码的标准消息和标签包含翻译：de（德语）、en（英语）、es（Espanol）、it（意大利语）、nl（荷兰语）和\
  \ sv（瑞典语）。\n\n执行 web mvc install language 命令时，Roo 通过执行以下操作来处理该命令：\n\n- 在 /WEB-INF/i18n/\
  \ 文件夹中创建 messages_es.properties\n- 在 images 目录中为语言复制图像图标 (es.png)\n- 更新 /WEB-INF/views/footer.jspx\
  \ 以显示语言的图像图标\n\n要检查 Espanol 语言支持是否已正确安装，请部署并运行 flight-app 应用程序。添加 Espanol 语言支持后，flight-app\
  \ 应用程序的主页如下图所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_211_0.png)\n\n如给定截图所示，将显示一个其他图像图标，以允许用户将\
  \ Web 应用程序的语言更改为 Espanol。当用户单击与语言对应的图像图标时，请求中会设置 lang 请求参数，LocaleChangeInterceptor（在\
  \ /WEB-INF/spring/webmvc-config.xml 中配置）使用该参数来更改当前区域设置。\n\n在 /WEB-INF/spring/webmvc-config.xml\
  \ 中配置的 CookieLocaleResolver 在浏览器中存储名为 locale 的 cookie，以便用户在每次访问 Web 应用程序时都不需要更改其首选语言。\n\
  \n## 更多内容...\n\n在“从 JPA 实体自动生成 Spring MVC 控制器和 JSPX 视图”配方中，我们讨论过 messages.properties\
  \ 包含所有 Roo 生成的 Web 应用程序共用的消息和标签，而 application.properties 包含特定于应用程序的消息和标签。\n\n由于\
  \ Roo 无法为特定于应用程序的消息和标签提供翻译，因此 web mvc install language 命令不会创建 application_<language-code>.properties\
  \ 文件。开发者需要为特定语言代码创建 application_<language-code>.properties 文件并提供翻译。\n\n## 另请参阅\n\
  \n- 有关 LocaleChangeInterceptor 和 CookieLocaleResolver 配置的信息，请参阅“从 JPA 实体自动生成 Spring\
  \ MVC 控制器和 JSPX 视图”配方。\n\n## 添加或修改 Roo 生成的主题\n\n主题是定义 Web 应用程序整体外观和感觉的 CSS 和图像文件集合。Spring\
  \ Web MVC 框架为定义和应用主题提供了内置支持。在“从 JPA 实体自动生成 Spring MVC 控制器和 JSPX 视图”配方中，我们简要介绍了 Roo\
  \ 生成的 Spring Web MVC 应用程序中的主题支持。在本配方中，我们将详细了解如何向 Roo 生成的 Spring Web MVC 应用程序添加新主题以及修改\
  \ Roo 安装的默认主题。\n\n在本配方中，我们将对 Roo 生成的 `flight-app` Web 应用程序进行以下修改：\n\n- 添加新的自定义主题\n\
  - 修改现有主题，以显示不同的菜单标题背景颜色和不同的标题图像\n- 添加新的 `standard` 主题，当语言为 `es`（即 Espanol）时应用该主题\n\
  \n### 准备工作\n\n删除 `C:\\roo-cookbook` 目录内 `ch04-recipe` 子目录的内容。\n\n将 `ch04_web-app.roo`\
  \ 脚本复制到 `ch04-recipe` 目录中。\n\n执行 `ch04_web-app.roo` 脚本，该脚本创建 `flight-app` Roo 项目，将\
  \ Hibernate 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 `Flight` 和 `FlightDescription` JPA\
  \ 实体，并在 `Flight` 和 `FlightDescription` 实体之间定义多对一关系。如果使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，则相应地修改脚本。\n\
  \n从 `C:\\roo-cookbook\\ch04-recipe` 目录启动 Roo shell。\n\n执行 `controller all` 命令，为\
  \ `flight-app` 项目中的 JPA 实体创建相应的控制器和视图，如下所示：\n\n```\n.. roo> controller all --package\
  \ ~.web\n```\n\n执行 `perform eclipse` 命令以更新项目的类路径设置，如下所示：\n\n```\n.. roo> perform\
  \ eclipse\n```\n\n现在，将 `flight-app` 项目导入到您的 Eclipse IDE 中。\n\n\n\n## 如何执行...\n\n\
  要添加新主题并修改现有主题，请按照此处给出的步骤操作：\n\n- 1. 在 /WEB-INF/classes 文件夹中创建 custom.properties\
  \ 文件并设置以下属性：\n\n```\nstyleSheet=resources/styles/custom.css\nheader_image=resources/images/custom_image.png\n\
  ```\n\ncustom.properties 文件表示定义我们要添加到 flight-app 应用程序的自定义主题的文件。\n\n- 2. 在 /WEB-INF/classes\
  \ 文件夹中创建 standard_es.properties 文件并设置以下属性：\n\n```\nstyleSheet=resources/styles/standard_es.css\n\
  header_image=resources/images/standard_es_image.png\n```\n\nstandard_es.properties\
  \ 文件表示定义语言为 es 时的标准主题的文件。\n\n- 3. 更新 /WEB-INF/classes 文件夹中的 alt.properties 文件，使其包含以下属性：\n\
  \n```\nstyleSheet=resources/styles/alt.css\nheader_image=resources/images/alt_image.png\n\
  ```\n\nalt.properties 文件表示定义备用主题的文件。该主题由 Roo 安装。\n\n- 4. 更新 /WEB-INF/classes 文件夹中的\
  \ standard.properties 文件，使其包含以下属性：\n\n```\nstyleSheet=resources/styles/standard.css\n\
  header_image=resources/images/standard_image.png\n```\n\nstandard.properties 文件表示定义标准主题的文件。该主题由\
  \ Roo 安装。\n\n- 5. 将随本章附带的 alt_image.png（备用主题横幅图片）、custom_image.png（新添加自定义主题横幅图片）、standard_es_image.png（语言为\
  \ es 时新添加标准主题横幅图片）和 standard_image.png（标准主题横幅图片）复制到 flight-app 应用程序的 SRC_MAIN_WEBAPP/images/\
  \ 文件夹中。\n\n- 6. 复制 SRC_MAIN_WEBAPP/styles/alt.css（备用主题的 CSS）并将其命名为 custom.css（新添加自定义主题的\
  \ CSS）。通过修改 #menu h2 定义中的 background 元素来更改菜单标题的背景颜色，如下所示：\n\n```\n#menu h2 {\n \
  \ color: #fff;\n  background: #3f0;\n  text-transform: uppercase;\n  font-weight:\
  \ bold;\n  font-size: 12px;\n}\n```\n\n- 7. 更改 standard.css（标准主题 CSS）文件中 #menu h2\
  \ 定义的 background 元素，如下所示：\n\n```\n#menu h2 {\n  color: #fff;\n  background: #06c;\n\
  \  text-transform: uppercase;\n  font-weight: bold;\n  font-size: 12px;\n}\n```\n\
  \n- 8. 复制 SRC_MAIN_WEBAPP/styles/standard.css 并将其命名为 standard_es.css（语言为 es 时新添加标准主题的\
  \ CSS）。通过修改 #menu h2 定义中的 background 元素来更改菜单标题的背景颜色，如下所示：\n\n```\n#menu h2 {\n \
  \ color: #fff;\n  background: #f0f;\n  text-transform: uppercase;\n  font-weight:\
  \ bold;\n  font-size: 12px;\n}\n```\n\n- 9. 修改 /WEB-INF/tags/util/theme.tagx 文件以添加切换到自定义主题的超链接（或者，您也可以复制随本章源代码附带的\
  \ theme.tagx 文件）：\n\n```\n...\n<c:out value=\" | \" />\n<spring:url var=\"url_theme3\"\
  \ value=\"\">\n  <spring:param name=\"theme\" value=\"custom\" />\n  <c:if test=\"\
  ${not empty param.page}\">\n    <spring:param name=\"page\" value=\"${param.page}\"\
  \ />\n  </c:if>\n  <c:if test=\"${not empty param.size}\">\n    <spring:param name=\"\
  size\" value=\"${param.size}\" />\n  </c:if>\n</spring:url>\n\n<spring:message code=\"\
  global_theme_custom\" var=\"theme_custom\" />\n\n<a href=\"${url_theme3}\" title=\"\
  ${theme_custom}\">${theme_custom}</a>\n```\n\n给定代码中的 <spring:message> 标签显示 **自定义**\
  \ 链接，该链接允许将主题切换到 custom。\n\n- 10. 将以下属性添加到 /WEB-INF/i18n/messages.properties 文件中：\n\
  \n```\nglobal_theme_custom=custom\n```\n\n此属性由 theme.tagx 用于显示 **自定义** 链接。\n\n-\
  \ 11. 更新 /WEB-INF/views/header.jspx 文件以使用主题文件中定义的 header_image 属性作为横幅图片（或者，使用随本章附带的\
  \ header.jspx 文件）：\n\n```\n<spring:theme code=\"header_image\" var=\"headerImg\"\
  />\n<spring:url value=\"/${headerImg}\" var=\"banner\" />\n```\n\n- 12. 使用 web mvc\
  \ install language 命令添加对 es（西班牙语）的语言支持，如下所示：\n\n```\n..\\roo> web mvc install language\
  \ --code es\n```\n\n- 13. 使用 Maven 将 flight-app 应用程序部署到嵌入式 Tomcat 实例中，如下所示：\n\n\
  ```\n..\\roo> mvn tomcat:run\n```\n\n## 工作原理...\n\n让我们深入了解 Spring MVC 应用程序中主题的配置和使用方式：\n\
  \n在 webmvc-config.xml 中，ResourceBundleThemeSource 由 Spring Roo 配置。使用 ResourceBundleThemeSource\
  \ 时，所有主题资源（图像和 CSS）都定义在一个属性文件（主题源）中，该文件位于类路径根目录（即 /WEB-INF/classes 目录）中。因此，/WEB-INF/classes\
  \ 中的每个属性文件都构成一个主题定义文件。默认情况下，Roo 在 /WEB-INF/classes 目录中创建两个属性文件：standard.properties\
  \ 和 alt.properties。可以说，在 Roo 生成的 Spring Web MVC 应用程序中，默认安装了两个主题。那么，这些属性文件包含什么内容？每个属性文件都包含构成主题一部分的\
  \ CSS 和图像的信息。alt.properties 文件包含以下属性：\n\n```\nstyleSheet=resources/styles/alt.css\n\
  ```\n\nstandard.properties 文件包含以下属性：\n\n```\nstyleSheet=resources/styles/standard.css\n\
  ```\n\n如您所见，alt.properties 和 standard.properties 均定义了 styleSheet 属性，该属性引用一个 CSS\
  \ 文件。根据您在 Roo 生成的 Web 应用程序中选择的主题，将应用适当的样式表到 Web 应用程序。\n\n您可能会问的下一个问题是——Spring Web\
  \ MVC 应用程序如何知道应用哪个主题？好吧，这时以下 Roo 生成的 CookieThemeResolver 配置就派上用场了：\n\n```\n<bean\
  \ class=\"org.springframework.web.servlet.theme.CookieThemeResolver\" id=\"themeResolver\"\
  \ p:cookieName=\"theme\" p:defaultThemeName=\"standard\"/>\n```\n\ncookieName 属性指定\
  \ cookie 的名称，该 cookie 包含应用于 Web 应用程序的主题。如果未找到 cookie，则配置使用 defaultThemeName 属性标识的主题（即\
  \ standard）；因此，由 standard.properties 定义的主题默认由 Roo 生成的 Spring Web MVC 应用程序使用。\n\n\
  现在，我们知道如何使用属性文件定义主题以及如何为 Spring Web MVC 应用程序配置主题。现在让我们看看 JSPX 视图如何访问主题资源：\n\nJSPX\
  \ 视图使用 Spring 标签库的 <theme> 标签访问属性文件中定义的主题资源（例如图像和 CSS），如下所示：\n\n```\n<spring:theme\
  \ code=\"header_image\" var=\"headerImg\" />\n```\n\ncode 属性用于标识您要从主题属性文件中访问的属性名称。<theme>\
  \ 标签的 var 属性指定存储属性值的变量名称。读取属性所依据的主题属性文件取决于应用于 Web 应用程序的当前主题。例如，如果当前主题是 standard，则从\
  \ standard.properties 文件中读取 header_image 属性；如果当前主题是 custom，则从 custom.properties\
  \ 文件中读取 header_image 属性，以此类推。\n\nResourceBundleThemeSource 还支持配置本地化主题。例如，/WEB-INF/classes\
  \ 中的 standard_es.properties 文件定义了主题资源，当语言为 es 且主题为 standard 时应用这些资源。\n\n现在，让我们来看看如何在\
  \ Roo 生成的 Web 应用程序的网页底部添加自定义主题名称。您只需修改 theme.tagx 文件，该文件负责显示所有主题超链接。当您选择心仪的主题时，ThemeChangeInterceptor\
  \ 就会介入，它允许在每个请求中更改当前主题。\n\n\n\n\n以下截图显示了当当前主题为修改后的标准主题时，`flight-app` 应用程序主页的外观：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_217_0.png)\n\n在给定的截图中，您会注意到 **航班描述**\
  \ 和 **航班** 等菜单标题的背景颜色发生了变化。您还会注意到，而不是默认的标题图像，显示了包含文本 **图像（标准）** 的图像。由于我们为每个主题复制了不同的图像，因此会显示一张不同的图像，用于标识当前应用于\
  \ Web 应用程序的主题。\n\n以下截图显示了当我们从页脚选择 Espanol 语言而不更改当前标准主题时，`flight-app` 应用程序的主页：\n\n\
  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_217_1.png)\n\n同样，请注意菜单标题背景颜色的变化以及标题图像的变化。\n\
  \n以下截图显示了当所选语言为英语且主题为自定义主题时，flight-app Web 应用程序的主页：\n\n## 还有更多...\n\n在某些场景中，您可能在\
  \ /WEB-INF/classes 目录中拥有其他属性文件。例如，您可能在 /WEB-INF/classes 中有一个 log4j.properties 文件供\
  \ log4j 库使用。在这种情况下，您可能希望将主题属性文件保存在与类路径根不同的文件夹中。您可以通过使用 ResourceBundleThemeSource\
  \ 的 basenamePrefix 属性来实现这一点。例如，考虑 webmvc-config.xml 文件中 ResourceBundleThemeSource\
  \ 的以下配置：\n\n```\n<bean class=\"org.springframework.ui.context.support.ResourceBundleThemeSource\"\
  \ id=\"themeSource\"\np:basenamePrefix=\"themes.\"/>\n```\n\nbasenamePrefix 属性的值\
  \ themes. 实际上表示 ResourceBundleThemeSource 应在 /WEB-INF/classes/themes 目录中查找主题。\n\n\
  ## 另请参见\n\n- 有关 webmvc-config.xml 文件中定义的配置的更多信息，请参阅“从 JPA 实体自动生成 Spring MVC 控制器和\
  \ JSPX 视图”配方\n\n## 为领域对象和控制器添加 JSON 支持\n\n假设您使用 Roo 开发了应用程序的持久层。现在，您希望通过 RESTful\
  \ 接口将 Roo 生成的 JPA 实体中定义的 CRUD 操作和动态查找器方法暴露给外部。\n\nRoo 支持通过使用 JSON 文档交换数据的 RESTful\
  \ 接口来暴露 JPA 实体的 CRUD 操作和动态查找器。由于 Roo 生成的 RESTful 接口使用 JSON，您可以修改 Roo 生成的 Spring\
  \ Web MVC 应用程序的 JSPX 页面，以使用 Ajax 与这些 RESTful 接口进行交互。\n\nRoo 提供两个命令，用于向 Roo 项目中的现有类添加\
  \ JSON 支持：\n\n- - json add：使用 class 参数指定的类添加 JSON 支持\n\n- - json all：为使用 @RooJavaBean\
  \ 注解的所有类添加 JSON 支持\n\njson add 和 json all 命令会将 @RooJson 注解添加到 Java 类中。@RooJson 注解会导致创建与使用\
  \ @RooJson 注解的类对应的 *_Roo_Json.aj AspectJ ITD。在本配方中，我们将查看 *_Roo_Json.aj AspectJ ITD\
  \ 和 @RooJson 注解。\n\n需要注意的是，@RooJson 注解允许您控制相应的 *_Roo_Json.aj ITD 文件中与 JSON 相关的方法的自动生成。\n\
  \n### 准备工作\n\n删除 C:\\roo-cookbook 目录中 ch04-recipe 子目录的内容。\n\n将 ch04_web-app.roo\
  \ 脚本复制到 ch04-recipe 目录中。\n\n执行 ch04_web-app.roo 脚本，该脚本会创建 flight-app Roo 项目，将 Hibernate\
  \ 设置为持久性提供程序，将 MySQL 配置为应用程序的数据库，创建 Flight 和 FlightDescription JPA 实体，并定义 Flight\
  \ 和 FlightDescription 实体之间的多对一关系。如果您使用的数据库不是 MySQL，或者您的连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 C:\\roo-cookbook\\ch04-recipe 目录启动 Roo shell。\n\n执行 controller all 命令，为 flight-app\
  \ 项目中的 JPA 实体创建控制器和 JSPX 视图，如下所示：\n\n```\n.. roo> controller all --package ~.web\n\
  ```\n\n执行 perform eclipse 命令以更新项目的类路径设置，如下所示：\n\n```\n.. roo> perform eclipse\n\
  ```\n\n现在，将 flight-app 项目导入到 Eclipse IDE 中。\n\n### 操作步骤...\n\n要添加 json 支持，请针对 Flight\
  \ JPA 实体执行 json add 命令：\n\n```\n~.domain.Flight roo> json add --class ~.domain.Flight\n\
  Updated SRC_MAIN_JAVA\\...\\domain\\Flight.java\nCreated SRC_MAIN_JAVA\\...\\domain\\\
  Flight_Roo_Json.aj\nCreated SRC_MAIN_JAVA\\...\\web\\FlightController_Roo_Controller_Json.aj\n\
  ```\n\n或者，向 Flight.java 类添加 @RooJson 注解。向 Flight 实体添加 @RooJson 注解与针对 Flight 实体执行\
  \ json add 命令效果相同。添加 @RooJson 注解将导致自动生成 Flight_Roo_Json.aj 和 FlightController_Roo_Controller_Json.aj\
  \ AspectJ ITD。\n\n### 工作原理...\n\n执行 json add 命令会将类（通过 class 参数指定）标记为 @RooJson 注解。如果类使用了\
  \ @RooJson 注解，Roo 会创建一个 *_Roo_Json.aj AspectJ ITD，该 ITD 定义了将该类的对象转换为 JSON 文档及其反向转换的方法。\n\
  \n我们看到，当针对 Flight 实体执行 json addon 命令时，还会创建一个 FlightController_Roo_Controller_Json.aj\
  \ AspectJ ITD。如果 FlightController.java 类中 @RooWebScaffold 的 exposeJson 属性值为 true，则会创建此\
  \ ITD。如果未指定 @RooWebScaffold 的 exposeJson 属性，则默认值为 true。\n\n如果 exposeJson 属性的值为 true，并且\
  \ Web 控制器使用的作为表单后备对象的 JPA 实体使用了 @RooJson 注解，则 Roo 会创建与 Web 控制器类对应的 *_Roo_Controller_Json.aj\
  \ ITD。此 ITD 定义了基于 JSON 的方法，用于执行 JPA 实体的 CRUD 操作和执行动态查找器方法。例如，FlightController_Roo_Controller_Json.aj\
  \ ITD 将 JSON 相关方法引入 FlightController.java 类，用于对 Flight 实体执行 CRUD 操作。\n\n以下清单显示了与使用\
  \ @RooJson 注解的 Flight 实体相对应的 Flight_Roo_Json.aj ITD 文件中定义的方法：\n\n```\nimport flexjson.JSONDeserializer;\n\
  import flexjson.JSONSerializer;\n\nprivileged aspect Flight_Roo_Json {\n    public\
  \ String Flight.toJson() {\n        return new JSONSerializer().exclude(\"*.class\"\
  ).\n        serialize(this);\n    }\n    public static Flight Flight.fromJsonToFlight(String\
  \ json) {\n        return new JSONDeserializer<Flight>().use(null,\n        Flight.class).deserialize(json);\n\
  \    }\n    public static String Flight.toJsonArray(\n        Collection<Flight>\
  \ collection) {\n        ...\n    }\n    public static Collection<Flight>\n    \
  \    Flight.fromJsonArrayToFlights(String json) {\n        ...\n    }\n}\n```\n\n\
  在给定的代码清单中，Roo 使用 Flexjson 库来支持 JSON 文档的序列化和反序列化。在 Flight_Roo_Json.aj 中定义的自动生成的 JSON\
  \ 方法如下：\n\n- - toJson：将当前 Flight 对象转换为 JSON 文档\n\n- - fromJsonToFlight：将作为参数传递的\
  \ JSON 文档转换为 Flight 对象\n\n- - toJsonArray：将 Flight 对象的集合转换为包含数组的 JSON 文档\n\n- -\
  \ fromJsonArrayToFlights：将 JSON 数组文档转换为 Flight 对象的集合\n\n- - 如果您想要自定义 @RooJson 生成的\
  \ JSON 方法的名称，可以使用 @RooJson 注解的以下属性：\n\n  - - fromJsonArrayMethod：用于自定义 fromJsonArrayTo<_class_name_>\
  \ 方法的名称\n\n  - - fromJsonMethod：用于自定义 fromJson<_class_name_> 方法的名称\n\n  - - toJsonArrayMethod：用于自定义\
  \ toJsonArray 方法的名称\n\n  - - toJsonMethod：用于自定义 toJson 方法的名称\n\n<class_name> 指的是\
  \ JSON 方法适用的 JPA 实体类的名称。如果某个元素的值为 \"\"，则 Roo 不会在 *_Roo_Json.aj 文件中生成相应的方法。\n\n\n\
  \n\n\n需要注意的是，你可以使用 `json add` 命令为任何类添加 JSON 支持。例如，如果你创建一个 `MyKlass` 类并使用 `@RooJson`\
  \ 对其进行注解，那么 Roo 将自动生成给定的方法，其中 `<class-name>` 为 `MyKlass`。\n\n## 排除序列化的字段\n\n要排除序列化为\
  \ JSON 格式的字段，你只需使用 `@JSON(include=false)` 注解对该字段或其对应的 getter 方法进行注解即可。\n\n在某些 JavaScript\
  \ 库（如 EXT JS）中，预期 JSON 文档包含根节点。你可以通过使用 `json add` 命令的 `rootName` 参数，或设置 `@RooJson`\
  \ 注解的 `rootName` 属性，来指示 Roo 设置生成的 JSON 文档的根节点。当使用 `json add` 命令的 `rootName` 参数时，生成的\
  \ `@RooJson` 注解的 `rootName` 属性将被设置为 `rootName` 命令参数的值。\n\n以下代码片段显示了当 `Flight.java`\
  \ 文件上 `@RooJson` 注解的 `rootName` 属性设置为 `myRoot` 时的 `Flight_Roo_Json.aj` ITD：\n\n\
  ```\nimport flexjson.JSONDeserializer;\nimport flexjson.JSONSerializer;\n\nprivileged\
  \ aspect Flight_Roo_Json {\n    public String Flight.toJson() {\n        return\
  \ new JSONSerializer().rootName(\"myRoot\").exclude(\"*.class\").serialize(this);\n\
  \    }\n    ...\n    public static String Flight.toJsonArray(\n        Collection<Flight>\
  \ collection) {\n        return new JSONSerializer().\n        rootName(\"myRoot\"\
  ).exclude(\"*.class\").\n        serialize(collection);\n    }\n    ...\n}\n```\n\
  \n给定代码显示，如果指定了 `@RooJson` 注解的 `rootName` 属性，则 `*_Roo_Json.aj` ITD 的 `toJson` 和 `toJsonArray`\
  \ 方法将使用 Flexjson 的 `JSONSerializer` 对象的 `rootName` 方法将 JSON 文档的根节点设置为 `myRoot`。传递给\
  \ `rootName` 方法的参数是为 `@RooJson` 注解的 `rootName` 属性设置的值。\n\n以下代码显示了 FlightController_Roo_Controller_Json.aj\
  \ ITD，该 ITD 是因为 FlightController.java 文件中 @RooWebScaffold 的 exposeJson 属性值为 true\
  \ 而生成的：\n\n```\nimport org.springframework.http.ResponseEntity;\nimport org.springframework.web.bind.annotation.ResponseBody;\n\
  privileged aspect FlightController_Roo_Controller_Json {\n\n@RequestMapping(value\
  \ = \"/{flightId}\",\nmethod = RequestMethod.GET,\nheaders = \"Accept=application/json\"\
  )\n@ResponseBody\npublic Object FlightController.\nshowJson(@PathVariable(\"flightId\"\
  ) Long flightId) {\nFlight flight = Flight.findFlight(flightId);\nif (flight ==\
  \ null) {\nHttpHeaders headers= new HttpHeaders();\nheaders.add(\"Content-Type\"\
  , \"application/text\");\nreturn new ResponseEntity<String>(headers,\nHttpStatus.NOT_FOUND);\n\
  }\nreturn flight.toJson();\n}\n...\n}\n```\n\n给定代码显示了 ITD 添加到 FlightController.java\
  \ 类的 showJson 方法。showJson 方法是 ITD 中定义的许多与 JSON 相关的方法之一。showJson 方法将 Flight 对象作为\
  \ JSON 文档返回。showJson 方法返回通过请求 URI 指定标识符的 flight 实体的 JSON 表示形式。如果请求 URL 为 /flights/10，则\
  \ showJson 方法将返回标识符值为 10 的 Flight 实体实例的 JSON 表示形式。@ResponseBody 注解指示 Spring Web\
  \ MVC 框架将响应写入 HTTP 响应体中。@RequestMapping 注解的 headers 属性指定 Web 请求中必须存在的请求头。\n\n要测试\
  \ FlightController_Roo_Controller_Json.aj 中定义的与 JSON 相关的方法，你可以使用 Firefox 的 Poster\
  \ 插件，也可以使用 Linux 的 curl 命令。\n\n### 另请参阅\n\n- 请参阅“为特定 JPA 实体创建 Spring MVC 控制器”和“从\
  \ JPA 实体自动生成 Spring MVC 控制器和 JSPX 视图”的示例，以查看 Roo 生成的方法的详细信息。\n\n## 为 Web 控制器创建和执行\
  \ Selenium 测试\n\n自动化 Web 应用程序测试是任何 Web 应用程序开发工作的重要组成部分。Spring Roo 提供了针对 Spring Web\
  \ MVC 控制器自动生成 Selenium 测试的支持。在本示例中，我们将介绍如何使用 Roo 为 Web 控制器生成 Selenium 测试，以及如何使用\
  \ Selenium Maven 插件来执行这些测试。\n\n### 准备工作\n\n删除 `C:\\roo-cookbook` 目录内 `ch04-recipe`\
  \ 子目录的内容。\n\n将 `ch04_web-app.roo` 脚本复制到 `ch04-recipe` 目录中。\n\n执行 `ch04_web-app.roo`\
  \ 脚本，该脚本会创建 `flight-app` Roo 项目，将 Hibernate 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 `Flight`\
  \ 和 `FlightDescription` JPA 实体，并定义 `Flight` 和 `FlightDescription` 实体之间的多对一关系。如果你使用的数据库不是\
  \ MySQL，或者你的连接设置与脚本中指定的不同，请相应地修改脚本。\n\n从 `C:\\roo-cookbook\\ch04-recipe` 目录启动 Roo\
  \ shell。\n\n执行 `controller all` 命令，为 `flight-app` 项目中的 JPA 实体创建相应的控制器和视图，如下所示：\n\
  \n```\n.. roo> controller all --package ~.web\n```\n\n执行 `perform eclipse` 命令以更新项目的类路径设置，如下所示：\n\
  \n```\n.. roo> perform eclipse\n```\n\n现在，将 `flight-app` 项目导入到你的 Eclipse IDE 中。\n\
  \n安装 Firefox Web 浏览器，它是执行 Selenium 测试时默认使用的浏览器。如果你想使用其他 Web 浏览器，请参阅本示例的 _工作原理..._\
  \ 部分。\n\n### 操作步骤...\n\n以下步骤演示如何创建 Selenium 测试：\n\n- 1. 执行 `selenium test` 命令为 `FlightDescriptionController`\
  \ 创建 Selenium 测试，如下所示：\n\n```\n.. roo> selenium test --controller ~.web.FlightDescriptionController\
  \ --name testFlightDescriptionController --serverUrl http://localhost:8080/\nCreated\
  \ SRC_MAIN_WEBAPP\\selenium\nCreated SRC_MAIN_WEBAPP\\selenium\\test-flightdescription.xhtml\n\
  Created SRC_MAIN_WEBAPP\\selenium\\test-suite.xhtml\nManaged SRC_MAIN_WEBAPP\\WEB-INF\\\
  i18n\\application.properties\nManaged SRC_MAIN_WEBAPP\\WEB-INF\\views\\menu.jspx\n\
  Managed ROOT\\pom.xml\n```\n\n- 2. 执行 selenium test 命令为 FlightController 创建 Selenium\
  \ 测试，如下所示：\n\n.. roo> selenium test --controller ~.web.FlightController --name testFlightController\
  \ --serverUrl http://localhost:8080/\nCreated SRC_MAIN_WEBAPP\\selenium\\test-flight.xhtml\n\
  Managed SRC_MAIN_WEBAPP\\selenium\\test-suite.xhtml\n\n- 3. 退出 Roo shell，并通过执行 tomcat:run\
  \ 目标在内嵌 Tomcat（或 Jetty）实例中运行 flight-app 项目：\n\n.. recipe> mvn tomcat:run\n\n- 4.\
  \ 打开另一个命令提示符，并执行 selenium:selenese Maven 目标来运行 Selenium 测试，如下所示：\n\n.. recipe> mvn\
  \ selenium:selenese\n\n### 工作原理...\n\nselenium test 命令为 Web 控制器创建 Selenium 测试。下表描述了\
  \ selenium test 命令接受的参数：\n\n| 参数 | 描述 |\n| :--- | :--- |\n| controller | 指定需要为其创建\
  \ Selenium 测试的 Web 控制器的完全限定名。 |\n| name | 生成的 Selenium 测试的名称。 |\n| serverUrl | Web\
  \ 应用程序运行所在服务器的 URL。serverUrl 参数的默认值为 http://localhost:8080/。在使用 Selenium Maven 插件执行\
  \ Selenium 测试时，将使用 serverUrl 参数的值。 |\n\n第一次执行 selenium test 命令时，Roo 将执行以下任务：\n\n\
  - 创建 SRC_MAIN_WEBAPP/selenium 文件夹，所有 Selenium 测试均在此创建\n- 创建 test-<JPA-entity-name>.xhtml\
  \ 文件，该文件表示用于测试 Web 控制器的 Selenium 脚本。<JPA-entity-name> 是 Web 控制器所管理的 JPA 实体的名称。\n\
  - 创建 test-suite.xhtml 文件，该文件包含构成 Web 应用程序一部分的 Selenium 测试集合。\n- 向 application.properties\
  \ 文件添加一个值为 Selenium Tests 的新标签属性。menu.jspx 文件使用该标签来显示一个菜单类别，你将在其中找到一个名为“Test Suite”的超链接。单击\
  \ Test Suite 链接将显示构成 Web 应用程序一部分的所有 Selenium 测试列表。\n- 更新 pom.xml 文件以配置 Selenium\
  \ Maven 插件。以下 XML 片段显示了 Selenium Maven 插件的配置：\n\n```\n<plugin>\n<groupId>org.codehaus.mojo</groupId>\n\
  <artifactId>selenium-maven-plugin</artifactId>\n<version>1.1</version>\n<configuration>\n\
  <suite>src\\main\\webapp\\selenium\\test-suite.xhtml</suite>\n<browser>*firefox</browser>\n\
  <results>\n${project.build.directory}/selenium.html</results>\n<startURL>http://localhost:4444</startURL>\n\
  </configuration>\n</plugin>\n```\n\n<configuration> 元素配置 Selenium Maven 插件的设置。<suite>\
  \ 元素标识 Selenium 测试套件，在运行 selenium:selenese 目标时将执行该套件。<browser> 元素指定用于执行 Selenium\
  \ 测试的 Web 浏览器。值 *firefox 表示将使用 Firefox Web 浏览器执行测试。如果要使用 IE 执行 Selenium 测试，则请将 *iexplore\
  \ 指定为 <browser> 元素的值。如果要使用任何其他浏览器，则请将 *custom 指定为该值。<startURL> 标识 Selenium 服务器运行所在的\
  \ URL。Selenium 服务器充当运行 Selenium 测试的浏览器与正在测试的 Web 应用程序之间的代理。selenium:selenese 目标启动\
  \ Selenium 服务器，执行测试套件中定义的测试，并在测试执行完成时停止服务器。<results> 元素指定存储 Selenium 测试结果的位置。${project.build.directory}\
  \ 变量指的是你项目的 target 目录。\n\n\n\n\n\n当您执行 selenium:selenese 目标时，Firefox 网络浏览器会自动打开，并执行\
  \ test-suite.xhtml 中定义的测试。执行结果保存在 /target/selenium.html 文件中。\n\n现在让我们来看看执行 selenium\
  \ test 命令时创建的 XHTML 文件（代表 Selenium 测试脚本）：\n\n## Selenium 测试脚本\n\nSelenium 脚本是简单的\
  \ HTML 文件。以下清单显示了 test-flightdescription.xhtml 脚本的内容：\n\n```\n<html ..>\n..\n<title>testFlightDescriptionController</title>\n\
  ..\n<table border=\"1\" cellpadding=\"1\" cellspacing=\"1\">\n..\n<tbody>\n<tr>\n\
  <td>open</td>\n<td>\nhttp://localhost:8080/flight-app/flightdescriptions?form&amp;lang=en_IN\n\
  </td>\n</tr>\n<tr>\n<td>type</td>\n<td>origin_id</td>\n<td>someOrigin1</td>\n</tr>\n\
  ..\n<tr>\n<td>clickAndWait</td>\n<td>/input [@id='proceed']</td>\n</tr>\n..\n</html>\n\
  ```\n\nSelenium 的 HTML 测试脚本由多个表格行（即 <tr> 元素）组成，每行包含三个列（由 <td> 元素表示）。每个列都有特定的语义。第一列标识要执行的\
  \ Selenium 命令。例如，open 命令指示 Selenium 打开一个 URL，而 type 命令在 input 类型的 HTML 元素中输入一个值。type\
  \ 命令还可用于在下拉框中选择值、选择复选框等等。clickAndWait 命令指示 Selenium 执行单击操作，并等待新页面在响应单击操作后加载。表格行的第二列标识\
  \ Selenium 命令的目标。例如，test-flightdescription.xhtml 中的 open 命令打开以下 URL：\n\n```\nhttp://localhost:8080/flight-app/flightdescriptions?form&amp;lang=en_IN\n\
  ```\n\n给定的 URL 打开了用于创建 FlightDescription JPA 实体的网页。这是在 flight-app Web 应用程序中选择创建新航班描述菜单选项时打开的同一表单。\n\
  \ntest-flightdescription.xhtml 中显示的 type 命令为 id 值为 _origin_id 的输入字段输入值。创建 FlightDescription\
  \ 实体的 HTML 表单中 Origin 字段的 id 属性值为 _origin_id。clickAndWait 命令使用 XPath 表达式指示 Selenium\
  \ 单击 id 属性值为 proceed 的按钮。创建 FlightDescription 实例的表单中保存按钮的 id 属性值为 proceed。\n\nSelenium\
  \ 脚本中表格行的第三列指定命令用于执行其操作所使用的值。例如，在 test-flightdescription.xhtml 文件中，type 命令将 id 为\
  \ _origin_id 的输入字段的值设置为 someOrigin1（即第三个 <td> 元素中指定的值）。根据命令的不同，表格行的第二列和第三列可能为空。例如，对于\
  \ open 和 clickAndWait 命令，表格行的第三列为空。\n\n如果您完整查看 test-flightdescription.xhtml 脚本，它正在打开用于创建新\
  \ FlightDescription 实体的表单，为表单中的输入字段输入值并单击保存按钮。这意味着，test-flightdescription.xhtml\
  \ 的成功执行表示在数据库中创建了一个 FlightDescription JPA 实体。同样，test-flight.xhtml 脚本创建了一个 Flight\
  \ JPA 实体实例。\n\n## Selenium 测试套件\n\nRoo 在 SRC_MAIN_WEBAPP/selenium 文件夹中创建的 test-suite.xhtml\
  \ 文件指定了由 Selenium Maven 插件执行的测试。以下清单显示了 test-suite.xhtml 文件的内容：\n\n```\n<html xmlns=\"\
  http://www.w3.org/1999/xhtml\" lang=\"en\" xml:lang=\"en\">\n..\n<tr>\n<td>\n<a\
  \ href=\"http://localhost:8080/flight-app/resources/selenium/test-flightdescription.xhtml\"\
  >\ntestFlightDescriptionController\n</a>\n</td>\n</tr>\n<tr>\n<td>\n<a href=\"http://localhost:8080/flight-app/resources/selenium/test-flight.xhtml\"\
  >\ntestFlightController\n</a>\n</td>\n</tr>\n</table>\n</body>\n</html>\n```\n\n\
  在 test-suite.xhtml 中，每个 <td> 元素指定作为测试套件一部分执行的 Selenium 测试脚本。需要注意的是用于指定测试脚本位置的 URL。test-flightdescription.xhtml\
  \ 和 test-flight.xhtml 由 ResourceHttpRequestHandler 处理程序静态提供，该处理程序在 webmvc-config.xml\
  \ 中通过 MVC 架构的 resources 元素配置，如下所示：\n\n```\n<mvc:resources location=\"/\"\n    classpath:/META-INF/web-resources/\"\
  \n    mapping=\"/resources/**\" />\n```\n\n有关 <resources> 元素配置的更多信息，请参阅“从 JPA 实体自动生成\
  \ Spring MVC 控制器和 JSPX 视图”配方。\n\n需要注意的是，Selenium 测试按其在 test-suite.xhtml 文件中指定的顺序执行。\n\
  \n您可以通过部署由 Roo 生成的 Web 应用程序，并在 **SELENIUM 测试** 类别下选择 **测试套件** 菜单选项来查看测试套件中测试的详细信息，如以下屏幕截图所示：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_230_0.png)\n\n对于 flight-app 应用程序，选择 **测试套件**\
  \ 选项会显示 test-suite.xhtml，进而可用于查看 test-flightdescription.xhtml 和 test-flight.xhtml\
  \ 文件的详细信息。\n\n## 还有更多…\n\n以下是关于 Spring Roo 生成的 Selenium 测试需要注意的几个重要点：\n\n- Spring\
  \ Roo 生成的 Selenium 测试不支持往返功能。例如，如果添加、删除或修改 Flight JPA 实体的属性，那么相应的 Selenium 测试脚本\
  \ test-flight.xhtml 不会由 Roo 修改。您可以删除由 Roo 生成的 Selenium 测试脚本，并使用 selenium test 命令重新生成它们。\n\
  - 如我们所见，Roo 仅为控制器公开的表单支撑对象创建 Selenium 测试。因此，您无法为不支持创建表单支撑对象的控制器创建 Selenium 测试，即控制器中\
  \ @RooWebScaffold 注解的 create 属性值为 false。如果对指定 @RooWebScaffold 的 create 属性值为 false\
  \ 的控制器执行 selenium test 命令，则 Roo 会报错，称控制器不支持创建 Selenium 测试。\n- Roo 不会为手动创建的控制器生成\
  \ Selenium 测试。因此，如果您生成的控制器没有 @RooWebScaffold 注解，那么无法使用 Roo 为其生成 Selenium 测试。如果对未标记\
  \ @RooWebScaffold 注解的控制器执行 selenium test 命令，则 Roo 会报错，称该控制器似乎不是由 Roo 生成的控制器。\n\n\
  Roo 通过检查由 Roo 生成的控制器公开的表单支撑对象（在 Roo 生成的控制器中为 JPA 实体）的属性来生成 Selenium 测试。生成的 Selenium\
  \ 测试假设用于创建 JPA 实体（由 Web 控制器作为表单支撑对象公开）的表单始终会显示，但实际情况并非总是如此。例如，如果您访问 **创建新航班** 菜单选项，那么如果尚未创建一个或多个\
  \ `FlightDescription` 实例，则不会显示用于创建 `Flight` 实例的表单。因此，如果 `test-suite.xhtml` 指定在 `test-flightdescription.xhtml`\
  \ 之前执行 `test-flight.xhtml`，则如果尚未创建任何 `FlightDescription` 实例，`test-flight.xhtml`\
  \ 的执行将失败。\n\n由 Spring Roo 生成的 Selenium 测试不会对由 Roo 生成的 Web 应用程序功能进行彻底的测试；它仅测试创建 JPA\
  \ 实体实例的控制器功能。建议使用 Selenium-IDE（作为 Firefox 插件提供）来录制和执行测试脚本。如果您正在寻找更复杂的测试方法，则可以使用\
  \ Selenium-IDE 创建测试脚本，将其保存为 JUnit4 或 TestNG 测试，修改测试以满足特定测试要求（例如，通过从数据库检索 JPA 实体实例来验证其是否保存成功），并使用\
  \ Maven Surefire 插件执行 JUnit4 或 TestNG 测试。\n\n## 另请参阅\n\n- 请参阅第 2 章中关于 *持久实体集成测试创建*\
  \ 配方，了解 Roo 如何支持为 JPA 实体自动生成集成测试的详细信息。\n\n\n\n\n\n## 使用 GWT、Flex 和 Spring Web Flow\
  \ 进行 Web 应用程序开发\n\n在本章中，我们将介绍：\n\n- 从 JPA 实体生成 GWT 应用程序脚手架\n- 开始 Flex 应用程序开发\n-\
  \ 从 JPA 实体生成 Flex 应用程序脚手架\n- 开始使用 Spring Web Flow\n\n### 简介\n\n在上一章中，我们了解到 Roo 可以从应用程序中的\
  \ JPA 实体生成 Spring Web MVC 控制器和 JSPX 视图。在本章中，我们将介绍可从 JPA 实体生成 GWT 和 Flex 前端的 Roo\
  \ 命令。此外，在本章中，我们将了解如何使用 Roo 为应用程序添加对 Spring Web Flow 的支持。\n\n### 从 JPA 实体生成 GWT 应用程序脚手架\n\
  \n在本示例中，我们将介绍 `gwt setup` 命令，该命令可从 JPA 实体生成 GWT 制品。\n\n### 准备工作\n\n在您的系统中创建一个新目录（`C:\\\
  roo-cookbook\\ch05-gwt`）。将随本书提供的 `ch05_gwt_app.roo` 脚本复制到 `ch05-gwt` 目录。从 `ch05-gwt`\
  \ 目录启动 Roo shell，并使用 `script` 命令执行 `ch05_gwt_app.roo` 脚本。执行 `ch05_gwt_app.roo` 脚本将执行以下操作：\n\
  \n- 创建 `flightapp-gwt` Eclipse 项目\n- 将 Hibernate 设置为持久性提供程序\n- 将 MySQL 配置为应用程序的数据库\n\
  - 创建 `Flight` 和 `FlightDescription` JPA 实体，并在 `Flight` 和 `FlightDescription` 实体之间定义多对一关系\n\
  \n如果您使用的数据库不是 MySQL，或者您的连接设置与脚本中指定的不同，请相应修改脚本。\n\n安装 **Eclipse IDE 的 Google 插件**（`http://code.google.com/eclipse/`）；它简化了使用\
  \ Eclipse IDE 开发 GWT 应用程序。\n\n### 操作步骤\n\n按照以下步骤生成 GWT 应用程序脚手架：\n\n1. 执行 `gwt setup`\
  \ 命令，如下所示：\n\n```\n..roo>gwt setup\n....\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\spring\n\
  Created SRC_MAIN_WEBAPP\\WEB-INF\\spring\\webmvc-config.xml\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\web.xml\nUpdated ROOT\\pom.xml [...]\nCreated SRC_MAIN_JAVA\\sample\\roo\\\
  flightapp\\client\nCreated SRC_MAIN_JAVA\\sample\\roo\\flightapp\\ApplicationScaffold.gwt.xml\n\
  Created SRC_MAIN_JAVA\\sample\\roo\\flightapp\\client\\managed\\request\nCreated\
  \ SRC_MAIN_JAVA\\sample\\roo\\flightapp\\client\\scaffold\\request\nCreated SRC_MAIN_WEBAPP\\\
  index.html\nCreated SRC_MAIN_WEBAPP\\ApplicationScaffold.html\n...\n```\n\n为简洁起见，上面仅显示了部分输出。\n\
  \n2. 自 Spring Roo 1.1.3 起，gwt setup 命令会创建特定于 GAE（Google App Engine）的 Java 文件，您需要从生成的源代码中删除这些文件。为此，在进行下一步之前，请从\
  \ flightapp-gwt 项目中删除以下文件夹：\n- src/main/java/sample/roo/flightapp/server/gae\n-\
  \ src/main/java/sample/roo/flightapp/shared/gae\n- src/main/java/sample/roo/flightapp/client/scaffold/gae\n\
  \n如果您使用的是 Spring Roo 1.1.5，则不会生成特定于 GAE 的 Java 文件。\n\n3. 执行 perform eclipse 命令，以更新\
  \ flightapp-gwt Eclipse 项目的 .classpath 文件，并将项目性质转换为 gwt：\n..roo>perform eclipse\n\
  \n4. 将 flightapp-gwt 项目导入 Eclipse IDE。向 flightapp-gwt 项目的生成路径（**项目属性 | Java 生成路径\
  \ | 添加库**）中添加 **Google Web Toolkit** 库，以便项目在 Eclipse IDE 中不会显示任何编译错误。\n\n5. 如果您想使用\
  \ **GWT Maven 插件**（http://mojo.codehaus.org/gwt-maven-plugin/）运行 GWT 应用程序，请退出 Roo\
  \ shell 并执行 GWT Maven 插件的 gwt:run 目标，如下所示（或者，您可以跳到下一步）：\n..recipe>mvn clean compile\
  \ gwt:run\n\n执行 gwt:run 目标将打开 **GWT 开发模式** 窗口，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_235_0.png)\n\
  \n6. 如果您想从 Eclipse IDE 运行 GWT 应用程序，请在 Eclipse IDE 中右键单击 **flightapp-gwt** 项目，并选择\
  \ **Google | Web Toolkit 设置...** 选项。选择 **Web 应用程序** 选项并勾选 **此项目具有 WAR 目录** 选项，如下所示：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_236_0.png)\n\n如屏幕截图所示，将 **WAR 目录** 值设置为\
  \ `src/main/webapp`——即包含 `ApplicationScaffold.html` 主机页面的 Maven 标准 WAR 目录。确保 **从此目录启动和部署**\
  \ 选项未勾选。\n\n7. 在 Eclipse IDE 中右键单击 **flightapp-gwt** 项目，并选择 **运行方式 | Web 应用程序**\
  \ 选项。在 **HTML 页面选择** 对话框中选择 `ApplicationScaffold.html`（或 `index.html`）页面，如下图所示：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_236_1.png)\n\n您在此屏幕上选择的 HTML 页面代表负责加载\
  \ GWT 应用程序的主机 HTML 页面。ApplicationScaffold.html 和 index.html 文件都位于 flightapp-gwt\
  \ GWT 应用程序的 src/main/webapp 目录中。index.html 是一个简单的 HTML 页面，仅加载 ApplicationScaffold.html\
  \ 页面——即 flightapp-gwt GWT 应用程序的主机 HTML 页面。\n\n首次运行 GWT 应用程序时，系统将要求您选择 flightapp-gwt\
  \ 项目的 WAR 目录位置，即 target/flightapp-gwt-0.1.0.BUILD-SNAPSHOT。\n\n8. 运行方式 | **Web 应用程序**\
  \ 选项会启动嵌入式 Jetty 服务器（随 **Eclipse 的 Google 插件** 捆绑）并以开发模式运行 GWT 应用程序。在开发模式下，GWT 应用程序像普通\
  \ Java 应用程序一样执行，且不会编译为 JavaScript。这使得可以在开发阶段调试 GWT 应用程序，当应用程序准备好投入生产时，只需编译 GWT 应用程序即可创建相应的\
  \ JavaScript 文件。在开发模式下，Eclipse IDE 会显示一个新的 **开发模式** 视图，其中包含访问 GWT 应用程序的链接，如下所示：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_237_0.png)\n\n9. 单击 **开发模式** 视图中显示的 URL，以便在默认\
  \ Web 浏览器中打开，或右键单击 URL 以选择要在其中打开它的浏览器。如果 flightapp-gwt 应用程序部署成功，您将看到应用程序的主页，如下所示：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_237_1.png)\n\n现在，您可以使用 **航班** 和 **航班描述**\
  \ 菜单选项对 Flight 和 FlightDescription JPA 实体执行 CRUD 操作。\n\n### 原理\n\ngwt setup 命令由\
  \ Spring Roo 的 GWT 插件处理。\n\n您可能会想知道，为什么 Roo 生成的 GWT 用户界面中没有显示与 FlightDescription\
  \ JPA 实体中的 findFlightDescriptionsByDestinationAndOrigin 查找器方法相对应的链接？截至 Spring Roo\
  \ 1.1.5，GWT 插件不会向生成的 GWT 应用程序添加查找器功能。\n\ngwt setup 命令负责为对 JPA 实体执行 CRUD 操作生成 GWT\
  \ Activities、Places、Proxies 和 Views 的脚手架。让我们先看一下 Roo 生成的 GWT 模块描述符文件 ApplicationScaffold.gwt.xml，该文件描述了一个\
  \ GWT 模块。\n\n### GWT 模块描述符\n\nRoo 在 flightapp-gwt 项目的根包 sample.roo.flightapp 中创建\
  \ ApplicationScaffold.gwt.xml。它定义了模块依赖项、源代码路径、属性、延迟绑定配置和模块入口点。让我们看一下 ApplicationScaffold.gwt.xml\
  \ 中定义的一些重要元素。\n\n默认情况下，GWT 模块的名称来源于模块描述符的位置。由于 Roo 在 sample.roo.flightapp 包中创建 ApplicationScaffold.gwt.xml\
  \ 文件，因此模块的名称是 sample.roo.flightapp.ApplicationScaffold。ApplicationScaffold.gwt.xml\
  \ 文件使用 <module> 元素的 rename-to 属性将模块重命名为 applicationScaffold，如下所示：\n\n```\n<module\
  \ rename-to=\"applicationScaffold\">\n```\n\nGWT 编译器在由模块名称标识的目录中生成 JavaScript 代码；因此，我们的\
  \ applicationScaffold 模块代码将生成在生成的 WAR 文件的 applicationScaffold 子目录中。\n\n模块描述符的 <inherits>\
  \ 元素指定了模块依赖的模块。例如，applicationScaffold 依赖于 GWT 的 User、Logging、Activity、Places 等内置模块，如下所示：\n\
  \n```\n<inherits name='com.google.gwt.activity.Activity' />\n<inherits name='com.google.gwt.place.Place'\
  \ />\n<inherits name=\"com.google.gwt.user.User\"/>\n<inherits name='com.google.gwt.logging.Logging'\
  \ />\n```\n\n\n\n\n\n模块描述符的 `<source>` 元素指定包，包括其子包（相对于 `ApplicationScaffold.gwt.xml`\
  \ 文件的类路径位置），这些包包含 GWT 编译器需要翻译成 JavaScript 的 Java 类，如 `applicationScaffold` 模块所示：\n\
  \n```\n<source path='client' />\n<source path='shared' />\n```\n\n给定的 `<source>`\
  \ 元素指示 GWT 编译器翻译 `sample.roo.flightapp.client` 和 `sample.roo.flightapp.shared` 包及其子包中包含的\
  \ Java 类。\n\n模块描述符的 `<public>` 元素指定包（及其子包），这些包包含公开可访问的资源，例如图像和 CSS 文件，如下所示：\n\n\
  ```\n<public path=\"public\" />\n```\n\n与 `<source>` 元素一样，`<public>` 元素指定包相对于模块描述符文件类路径位置的位置。\n\
  \n`ApplicationScaffold.gwt.xml` 文件为模块配置日志记录，如下所示：\n\n```\n<set-property name=\"\
  gwt.logging.enabled\" value=\"TRUE\"/>\n<set-property name=\"gwt.logging.logLevel\"\
  \ value=\"INFO\"/>\n<set-property name=\"gwt.logging.consoleHandler\"\nvalue=\"\
  ENABLED\"/>\n<set-property name=\"gwt.logging.developmentModeHandler\"\nvalue=\"\
  ENABLED\"/>\n<set-property name=\"gwt.logging.simpleRemoteHandler\"\nvalue=\"DISABLED\"\
  />\n...\n```\n\n在此代码中，`gwt.logging.enabled` 属性为 `applicationScaffold` 模块启用日志记录，`gwt.logging.logLevel`\
  \ 属性将日志级别设置为 INFO，`gwt.logging.consoleHandler` 属性使日志记录器输出显示在 IDE 控制台中，`gwt.logging.developmentModeHandler`\
  \ 属性使日志记录器输出显示在 IDE 的“开发模式”控制台中，`gwt.logging.simpleRemoteHandler` 属性禁用日志消息的远程日志记录。稍后在本示例中，我们将看到\
  \ `gwt.logging.simpleRemoteHandler` 属性设置为 `ENABLED` 以启用服务器端的日志记录消息。\n\nRoo 生成的 GWT\
  \ 应用程序默认提供对移动 Safari 浏览器的支持。因此，如果您正在开发 GWT 应用程序，它将在使用移动 Safari 浏览器的手机上无缝运行。如果使用移动\
  \ Safari 浏览器访问应用程序，则 GWT 应用程序将创建适合在移动设备上显示的 Web UI。为了同时支持桌面和移动 Safari 浏览器，`applicationScaffold`\
  \ 模块使用了 GWT 编译器的延迟绑定特性。\n\n要使用延迟绑定特性，模块描述符的 `<define-property>` 元素用于定义名为 mobile.user.agent\
  \ 的新属性，如下所示：\n\n```\n<define-property name=\"mobile.user.agent\"\n        values=\"\
  mobilesafari, none\"/>\n```\n\nvalues 属性指定 mobile.user.agent 属性可以接受的逗号分隔值列表。\n\n\
  要设置 mobile.user.agent 属性值，模块描述符使用 `<property-provider>` 元素，如下所示：\n\n```\n<property-provider\
  \ name=\"mobile.user.agent\">\n    <![CDATA[\n        var ua = navigator.userAgent.toLowerCase\
  \ ();\n        ...\n    ]]>\n```\n\nCDATA 部分包含用于从 Web 浏览器发送到托管 GWT 应用程序的服务器的用户代理信息中获取\
  \ mobile.user.agent 值的 JavaScript。\n\n现在，最重要的部分：延迟绑定规则在 applicationScaffold 模块描述符文件中使用替换技术定义，如下所示：\n\
  \n```\n<replace-with\n        class=\"...client.scaffold.ioc.MobileInjectorWrapper\"\
  >\n    <when-type-is\n        class=\"...client.scaffold.ioc.DesktopInjectorWrapper\"\
  />\n    <all>\n        <when-property-is name=\"mobile.user.agent\"\n          \
  \  value=\"mobilesafari\"/>\n    </all>\n</replace-with>\n```\n\n此配置指示 GWT 编译器：如果\
  \ mobile.user.agent 属性的值为 mobilesafari，则用 MobileInjectorWrapper 替换 DesktopInjectorWrapper\
  \ 的代码（在为 applicationScaffold 模块生成 JavaScript 时）。之所以可行，是因为 DesktopInjectorWrapper\
  \ 和 MobileInjectorWrapper 都实现了同一接口 InjectorWrapper。当 GWT 编译器执行时，它使用延迟绑定规则（在模块描述符文件中定义）为移动\
  \ Safari 和桌面浏览器生成单独的 flightapp-gwt 应用程序 JavaScript 代码。这样可确保桌面和移动浏览器下载专门针对该浏览器类型的\
  \ JavaScript 代码。例如，移动 Safari 浏览器不会下载特定于桌面 Web 浏览器的 JavaScript 代码，反之亦然。需要创建 DesktopInjectorWrapper\
  \ 或 MobileInjectorWrapper 实例的类使用 com.google.gwt.core.client.GWT 类的 create 静态方法，指示\
  \ GWT 编译器使用延迟绑定实例化 DesktopInjectorWrapper 或 MobileInjectorWrapper 实例。\n\n> 为移动 Safari\
  \ 浏览器生成的代码遵循与桌面浏览器代码相似的设计方法；因此，在本书中，我们将限制讨论特定于桌面浏览器的 Roo 生成代码。\n\n模块描述符还使用 <entry-point>\
  \ 元素描述 GWT 应用程序的*入口点*，如 applicationScaffold 模块所示：\n\n```\n<entry-point\nclass=\"\
  sample.roo.flightapp.client.scaffold.Scaffold\"/>\n```\n\n上述代码表明，Scaffold 类代表 applicationScaffold\
  \ 模块的入口点。Scaffold 类实现 GWT 的 com.google.gwt.core.client.EntryPoint 接口——这是入口点类的强制性要求。\n\
  \n## GWT 模块的入口点\n\n如前所述，flightapp-gwt 应用程序的 Scaffold 类代表进入 applicationScaffold 模块的入口点。Scaffold\
  \ 类实现 GWT 的 EntryPoint 接口并实现其 onModuleLoad 方法来引导 flightapp-gwt 应用程序，如下所示：\n\n```\n\
  Scaffold.java\npackage sample.roo.flightapp.client.scaffold;\n\nimport com.google.gwt.core.client.EntryPoint;\n\
  import com.google.gwt.core.client.GWT;\n\npublic class Scaffold implements EntryPoint\
  \ {\n    final private InjectorWrapper injectorWrapper =\n    GWT.create(DesktopInjectorWrapper.class);\n\
  \n    public void onModuleLoad() {\n    injectorWrapper.getInjector().getScaffoldApp().run();\n\
  \    }\n}\n```\n\n此代码中首先需要注意的是使用 com.google.gwt.core.client.GWT 类的 create 方法来创建\
  \ DesktopInjectorWrapper 实例。由于移动 Safari 浏览器需要将 DesktopInjectorWrapper 实现替换为 MobileInjectorWrapper，因此\
  \ DesktopInjectorWrapper 使用 GWT 类的 create 方法创建。\n\nonModuleLoad 方法类似于 Java 的 main\
  \ 方法，负责初始化 flightapp-gwt 应用程序。在 Scaffold 类中，onModuleLoad 方法负责创建应用程序的 Web UI、向 EventBus\
  \ 注册事件处理程序等。DesktopInjectorWrapper 和 MobileInjectorWrapper 类代表围绕 GIN 的 Ginjector\
  \ 实现的包装器。\n\n## 使用 GIN 进行依赖注入\n\nGIN 是一种依赖注入框架，它使用 Google Guice 框架来支持 GWT 应用程序中的依赖注入。在\
  \ GWT 应用程序中，整个应用程序所需的对象引用可以使用 GIN 或工厂来创建。Roo 生成的 flightapp-gwt GWT 应用程序使用 GIN 来创建\
  \ EventBus、ApplicationRequestFactory 和 PlaceController——这些对象在 flightapp-gwt 应用程序中广泛使用。下表描述了这些对象在\
  \ flightapp-gwt 应用程序中的重要性：\n\n| 对象 | 描述 |\n|---|---|\n| EventBus | EventBus 用于在\
  \ GWT 应用程序中发布事件和注册事件处理程序。 |\n| ApplicationRequestFactory | 一个扩展 GWT RequestFactory\
  \ 接口的 Roo 生成接口。该接口的实现由 GWT 编译器生成。flightapp-gwt 应用程序使用 RequestFactory 与 JPA 层进行交互。\
  \ |\n| PlaceController | GWT Place 代表 GWT 应用程序中的一个位置。如果您从 flightapp-gwt 应用程序的 UI\
  \ 中选择 Flights 菜单选项，则它代表一个位置。现在，如果您从 UI 中选择 FlightDescriptions 选项，则它代表应用程序中的另一个位置。GWT\
  \ 的 PlaceController 用于在 GWT 应用程序中从一个位置导航到另一个位置。 |\n\n现在我们知道了 flightapp-gwt 应用程序中使用哪些对象，让我们看看\
  \ GIN 如何创建这些对象，以及这些对象如何被注入到依赖它们的对象中。\n\n\n\n\n\n要了解 Ginjector 在 flightapp-gwt 中的使用方式，让我们来看一下以下类图：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_243_0.png)\n\n在此类图中，Ginjector 接口是 GIN\
  \ API 的一部分。ScaffoldInjector 和 DesktopInjector 由 Roo 生成。以下是在上述类图中需要注意的重要点：\n\n- ScaffoldInjector\
  \ 扩展 Ginjector 接口，定义一个名为 getScaffoldApp 的方法，该方法返回类型为 ScaffoldApp 的实例。\n\n- ScaffoldApp\
  \ 是由 Roo 生成的类，用于定义桌面和移动浏览器初始化 GWT 应用程序的契约。\n\n- DesktopInjector 扩展 ScaffoldInjector，并重写\
  \ getScaffoldApp 方法以返回 ScaffoldDesktopApp。这种返回类型的更改完全合法，因为 ScaffoldDesktopApp 是\
  \ ScaffoldApp 类的子类。\n\n- ScaffoldDesktopApp 负责创建面向桌面 Web 浏览器的 Web UI，并在应用程序投入使用前执行所有初始化工作。同样，ScaffoldMobileApp\
  \ 负责创建移动浏览器的 Web UI。\n\nGIN 的 Ginjector 接口是 GIN 框架的核心，负责执行依赖注入。要使用 Ginjector，GWT\
  \ 应用程序必须执行以下操作：\n\n- 定义一个扩展 Ginjector 的接口——在 flightapp-gwt 中，这就是 DesktopInjector\
  \ 接口。GWT 编译器负责提供该接口的实现。\n\n- 在接口中定义一个或多个方法，用于返回应用程序其他部分将使用的顶级对象。Ginjector 根据 Ginjector\
  \ 配置的绑定，通过注入低级对象的依赖项来创建顶级对象。在 flightapp-gwt 应用程序中，ScaffoldDesktopApp 和 ScaffoldMobileApp\
  \ 表示顶级对象。\n\n- 定义一个 GinModule 或 AbstractGinModule 类（两者均属于 GIN API），用于定义依赖项的绑定。flightapp-gwt\
  \ 中的 ScaffoldModule 类为 EventBus、PlaceController 和 ApplicationRequestFactory 定义绑定。\n\
  \n- 在希望 Ginjector 执行依赖注入的类的方法、构造函数或字段上使用 @Inject 注释（属于 Guice API）进行标注。在 flightapp-gwt\
  \ 中，ApplicationDetailsActivities、ApplicationMasterActivities 等使用 @Inject 注释来让 Ginjector\
  \ 注入依赖项。\n\n现在，让我们来看看 Roo 为之前描述的每个活动创建的代码。\n\n以下代码显示 DesktopInjector 接口：\n\n```\n\
  DesktopInjector.java\npackage sample.roo.flightapp.client.scaffold.ioc;\n..\nimport\
  \ sample.roo.flightapp.client.scaffold.ScaffoldDesktopApp;\nimport com.google.gwt.inject.client.GinModules;\n\
  \n@GinModules(value = {ScaffoldModule.class})\npublic interface DesktopInjector\
  \ extends ScaffoldInjector {\n\n    ScaffoldDesktopApp getScaffoldApp();\n}\n```\n\
  \nDesktopInjector 扩展 ScaffoldInjector 接口（后者又扩展 GIN 的 Ginjector 接口），并定义一个名为 getScaffoldApp\
  \ 的方法，该方法返回 ScaffoldDesktopApp 对象。因此，由 GWT 编译器生成的 Ginjector 实现的责任是返回一个 ScaffoldDesktopApp\
  \ 实例，其所有依赖项均已注入适当的实现。\n\n@GinModules 注释指定负责定义依赖项及其提供程序的类（该类实现 `GinModule` 接口或扩展\
  \ `AbstractGinModule` 抽象类）。以下代码显示 `ScaffoldModule` 类，该类将 `EventBus`、`PlaceController`\
  \ 和 `ApplicationRequestFactory` 依赖项绑定到各自的提供程序：\n\n```java\nScaffoldModule.java\n\
  package sample.roo.flightapp.client.scaffold.ioc;\n\nimport com.google.gwt.event.shared.EventBus;\n\
  import com.google.gwt.event.shared.SimpleEventBus;\nimport com.google.gwt.inject.client.AbstractGinModule;\n\
  import com.google.gwt.place.shared.PlaceController;\nimport com.google.inject.Inject;\n\
  import com.google.inject.Provider;\nimport com.google.inject.Singleton;\n\npublic\
  \ class ScaffoldModule extends AbstractGinModule {\n\n    @Override\n    protected\
  \ void configure() {\n        bind(EventBus.class).\n        to(SimpleEventBus.class).in(Singleton.class);\n\
  \        bind(ApplicationRequestFactory.class).\n        toProvider(RequestFactoryProvider.class).\n\
  \        in(Singleton.class);\n        bind(PlaceController.class).\n        toProvider(PlaceControllerProvider.class).\n\
  \        in(Singleton.class);\n    }\n\n    static class PlaceControllerProvider\
  \ implements Provider<PlaceController> {\n\n        private final PlaceController\
  \ placeController;\n\n        @Inject\n        public PlaceControllerProvider(EventBus\
  \ eventBus) {\n            this.placeController = new PlaceController(eventBus);\n\
  \        }\n\n        public PlaceController get() {\n            return placeController;\n\
  \        }\n    }\n\n    static class RequestFactoryProvider implements\n    Provider<ApplicationRequestFactory>\
  \ {\n\n    }\n}\n```\n\n由 Roo 生成的 ScaffoldModule 类扩展 AbstractGinModule 并重写 configure\
  \ 方法，以将依赖项与其提供程序关联。AbstractGinModule 的 bind 方法将依赖项绑定到其提供程序。in(Singleton.class) 指示为应用程序仅创建\
  \ EventBus、PlaceController 和 ApplicationRequestFactory 的单个实例。PlaceControllerProvider\
  \ 和 RequestFactoryProvider 静态内部类分别表示 PlaceController 和 RequestFactory 实例的提供程序。SimpleEventBus（属于\
  \ GWT API）是 EventBus 的一个实现。\n\n这段代码中需要注意的一个重要点是，PlaceControllerProvider 使用 @Inject\
  \ 注释来指示 Ginjector 注入 EventBus 的实现。因此，如果您正在创建对象层次结构，那么请在 Ginjector 中定义返回顶级对象的方法，因为层次结构中的低级对象可以使用\
  \ @Inject 注释利用 Ginjector 的依赖注入功能。\n\n以下图表总结了 Scaffold 类如何利用 GIN 框架来引导应用程序：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_246_0.png)\n\
  \nScaffold 类的 onModuleLoad 方法调用 DesktopInjectWrapper 的 getInjector 方法来访问 Ginjector\
  \ 实现，随后调用 getScaffoldApp 以获取 ScaffoldDesktopApp 的实例。以下序列图进一步澄清了类之间方法调用的顺序：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_247_0.png)\n\
  \n在上述序列图中，对 DesktopScaffoldApp 的 run 方法的调用会导致 Web UI 的初始化。\n\n既然我们了解了 flightapp-gwt\
  \ 应用程序如何使用 GIN 并自行初始化，我们将研究 GWT 的 EntityProxy 和 RequestFactory 接口，以及脚手架代码如何使用它们。\n\
  \n## EntityProxy、RequestContext 和 RequestFactory 接口\n\n实体代理表示客户端（JavaScript 端）对象，用于模拟服务器端上的实体，在\
  \ flightapp-gwt GWT 应用程序中，该实体是 JPA 实体。实体代理充当客户端与服务器之间传输数据的手段。在 GWT 中，充当实体代理的客户端对象扩展\
  \ GWT 的 EntityProxy 接口，并为相应服务器端实体中定义的字段定义抽象 getter 和 setter 方法。在 flightapp-gwt 中，我们有\
  \ Flight 和 FlightDescription JPA 实体；因此，Roo 分别生成相应的实体代理 FlightProxy 和 FlightDescriptionProxy。默认情况下，Roo\
  \ 在实体代理中为相应 JPA 实体类中定义的所有属性创建抽象 getter 和 setter 方法。以下代码显示 FlightProxy 实体代理：\n\n\
  ```\nFlightProxy.java\npackage sample.roo.flightapp.client.managed.request;\n\n\
  import com.google.gwt.requestfactory.shared.EntityProxy;\nimport com.google.gwt.requestfactory.shared.ProxyForName;\n\
  import org.springframework.roo.addon.gwt.RooGwtMirroredFrom;\n\n@RooGwtMirroredFrom(\"\
  sample.roo.flightapp.domain.Flight\")\n@ProxyForName(\"sample.roo.flightapp.domain.Flight\"\
  )\npublic interface FlightProxy extends EntityProxy {\n    abstract Long getId();\n\
  ```\n\n\n\nabstract Integer getVersion();\nabstract Date getDepartureDate();\nabstract\
  \ Date getArrivalDate();\nabstract FlightDescriptionProxy getFlightDescription();\n\
  abstract void setId(Long id);\n...\n\nRoo 的 @RooGwtMirroredFrom 注释指定了创建 FlightProxy\
  \ 实体代理所对应的 JPA 实体的完全限定类名。\n\n> 正是 @RooGwtMirroredFrom 注释使实体代理与相应的 JPA 实体保持同步。\n\n\
  GWT 的 @ProxyForName 注释指定实体代理所代表的服务器端实体。请注意，在上面的代码中，getFlightDescription 方法被定义为返回\
  \ FlightDescriptionProxy，因为它代表与 FlightDescription JPA 实体对应的实体代理。\n\n要调用服务器端服务，GWT\
  \ 应用程序的客户端代码需要为远程服务提供客户端存根。客户端代码使用服务存根来调用远程服务。服务存根由扩展 GWT 的 RequestContext 接口并定义与相应远程服务方法签名相似的方法的接口来定义。我们将稍后看到远程服务类中定义的方法与客户端服务存根之间的区别。\n\
  \n默认情况下，Roo 生成富实体，生成的应用程序没有服务层；因此，对于 Roo 生成的 GWT 应用程序，服务存根定义了与 JPA 实体类对应的方法。以下代码显示了\
  \ flightapp-gwt 应用程序中与 Flight JPA 实体对应的 Roo 生成的 FlightRequest 服务存根：\n\n```\nFlightRequest.java\n\
  package sample.roo.flightapp.client.managed.request;\nimport com.google.gwt.requestfactory.shared.InstanceRequest;\n\
  import com.google.gwt.requestfactory.shared.Request;\nimport com.google.gwt.requestfactory.shared.RequestContext;\n\
  import com.google.gwt.requestfactory.shared.ServiceName;\nimport org.springframework.roo.addon.gwt.RooGwtMirroredFrom;\n\
  @RooGwtMirroredFrom(\"sample.roo.flightapp.domain.Flight\")\n@ServiceName(\"sample.roo.flightapp.domain.Flight\"\
  )\npublic interface FlightRequest extends RequestContext {\n    abstract Request<java.lang.Long>\
  \ countFlights();\n    abstract Request<java.util.List<? extends FlightProxy>>\n\
  \    findAllFlights();\n    ....\n    abstract InstanceRequest<? extends FlightProxy,\
  \ java.lang.Void>\n    remove();\n    abstract InstanceRequest<? extends FlightProxy,\
  \ java.lang.Void>\n    persist();\n}\n```\n\n正如此代码所示，FlightRequest 服务存根扩展了 GWT 的\
  \ RequestContext 接口。GWT 的 @ServiceName 注释指定与客户端服务存根对应的服务器端服务类的完全限定名称，在 FlightRequest\
  \ 存根的情况下即为 Flight JPA 实体。上述代码显示 FlightRequest 服务存根定义了返回以下内容的方法：\n\n- Request<T>\
  \ - 其中 T 表示服务器端类中相应方法的实际返回类型。例如，countFlights 方法在 Flight JPA 实体中返回 java.lang.Long，FlightRequest\
  \ 存根中的 countFlights 方法也是如此。如果服务器端服务类中的方法返回实体，则客户端服务存根返回相应的实体代理。例如，Flight JPA 实体中的\
  \ findAllFlights 方法返回 java.util.List<Flight>，因此 FlightRequest 存根中的 findAllFlights\
  \ 方法返回 java.util.List<FlightProxy>。需要注意的是，与服务器端服务的静态方法对应的方法在客户端服务存根中返回 Request<T>\
  \ 类型。\n\n- InstanceRequest<P, T> - 其中 P 表示相应服务器端服务方法作用的实体类型，T 表示方法的实际返回类型。例如，Flight\
  \ JPA 实体的 persist 方法作用于 Flight 实体实例并返回 void；因此，FlightRequest 存根中相应方法的返回类型是 InstanceRequest<FlightProxy,\
  \ java.lang.Void>。请注意，只有与服务器端服务上的实例方法对应的存根方法才返回 InstanceRequest。\n\n> 正是 Roo 的 @RooGwtMirroredFrom\
  \ 注释使客户端存根与相应的 JPA 实体保持同步。\n\n现在，让我们看看 RequestFactory 如何帮助客户端代码与服务器端代码之间的通信。\n\n\
  RequestFactory 充当实体代理与服务器端相应实体之间的通信桥梁。RequestFactory 管理实体代理，并负责将服务器端实体属性值复制到相应的实体代理，反之亦然。在您的\
  \ GWT 应用程序中，需要定义一个扩展 RequestFactory 接口的接口，并提供返回服务器端服务客户端存根的方法。Roo 创建了一个 ApplicationRequestFactory\
  \ 类（我们之前讨论过，这是使用 GIN 创建的），如下所示：\n\n```\npackage sample.roo.flightapp.client.managed.request;\n\
  \nimport sample.roo.flightapp.shared.scaffold.ScaffoldRequestFactory;\n\npublic\
  \ interface ApplicationRequestFactory extends\nScaffoldRequestFactory {\n    FlightRequest\
  \ flightRequest();\n    FlightDescriptionRequest flightDescriptionRequest();\n}\n\
  ```\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_250_0.png)\n\n上图显示 ApplicationRequestFactory\
  \ 扩展了 Roo 生成的 ScaffoldRequestFactory 接口，而该接口又扩展了 GWT 的 RequestFactory 接口。创建这种层次结构的目的是，如果您想要定义自定义客户端服务存根方法，则可以将它们添加到\
  \ ScaffoldRequestFactory。\n\n> > ApplicationRequestFactory 由 Roo 管理；因此，您不应手动修改它以添加自定义客户端服务存根方法。相反，请将它们添加到\
  \ ScaffoldRequestFactory。\n\n实体代理与服务器端实体之间的交互通过在 GWT Web 应用程序的 web.xml 文件中配置 GWT\
  \ 的 RequestFactoryServlet 来实现。\n\n> > 您不需要在 flightapp-gwt 项目的 web.xml 文件中配置 RequestFactoryServlet，因为在执行\
  \ gwt setup 命令时，Roo 会在 web.xml 文件中配置 GWT 的 RequestFactoryServlet。\n\n以下代码显示了 flightapp-gwt\
  \ 应用程序 web.xml 文件中 RequestFactoryServlet 的配置：\n\n```\nweb.xml\n<servlet>\n  <servlet-name>requestFactory</servlet-name>\n\
  \  <servlet-class>\n    com.google.gwt.requestfactory.server.RequestFactoryServlet\n\
  \  </servlet-class>\n</servlet>\n<servlet-mapping>\n  <servlet-name>requestFactory</servlet-name>\n\
  \  <url-pattern>/gwtRequest</url-pattern>\n</servlet-mapping>\n```\n\n此配置显示，默认情况下\
  \ Roo 将 RequestFactoryServlet 映射到 /gwtRequest URL，您可以更改该映射。如果更改 RequestFactoryServlet\
  \ 的 URL 映射，则还需要更改 ScaffoldModule（我们之前讨论过的 Roo 生成的 GIN 模块）创建 ApplicationRequestFactory\
  \ 的方式。\n\nRequestFactory 要求服务器端实体必须定义无参构造函数、getId、getVersion 和 find<Entity> 方法。getVersion\
  \ 应该返回版本，getId 应该返回与实体实例关联的唯一 ID，而 find<Entity> 方法接受实体 ID 并返回相应的实体实例。因此，如果您使用 Roo\
  \ entity 命令创建实体，请确保不要将标识符字段或版本字段的名称设置为除 id 和 version 之外的任何名称。当您执行 Roo gwt setup\
  \ 命令，并且 Roo 发现 ID 和 版本 字段的名称与 id 和 version 不同时，则它不会为 GWT 应用程序生成脚手架。\n\n现在，让我们看看\
  \ Roo 生成的 GWT 中的一些活动和位置。\n\n## 活动和位置\n\nRoo 生成的 GWT 代码由许多基类和接口组成，旨在为对 JPA 实体执行 CRUD\
  \ 操作提供一致的方法。在本节中，我们将介绍一些重要的类、接口和概念，这些内容将为您理解 Roo 生成的 GWT 代码提供起点。\n\nRoo 生成的 GWT\
  \ Web UI 由一个 **主显示区域** 和一个 **详情显示区域** 组成。**主显示区域** 显示可从 Web UI 管理的实体列表。以列表形式显示 **Flight**\
  \ 和 **FlightDescriptions** 的小部件代表 **主显示区域**。**详情显示区域** 显示可以对 **主显示区域** 中显示的每个实体执行的活动。显示系统中\
  \ **Flight** 或 **FlightDescription** 实体实例列表、用于创建新实体实例的表单、用于编辑实体实例的表单等的区域代表 **详情显示区域**。\n\
  \n以下图显示了 flightapp-gwt 应用程序中的 **主显示区域** 和 **详情显示区域**：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_252_0.png)\n\
  \n现在，让我们来看看 Roo 生成的 flightapp-gwt 应用程序中活动、位置和视图的一些示例。\n\n\n\n\n\nActivities负责驱动视图并处理显示区域中用户交互生成的事件。它是通过实现GWT的Activity接口或扩展GWT的AbstractActivity抽象类来创建的。以下图表显示了Roo为flightapp-gwt应用程序生成的一些活动：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_253_0.png)\n\n此图显示，*FlightDescriptionDetailsActivity*和*FlightDetailsActivity*继承自*AbstractActivity*抽象类，而*FlightDescriptionListActivity*和*FlightListActivity*类实现了*Activity*接口。<entity-name>DetailsActivity活动在**详情显示区域**中显示现有实体实例的详细信息时驱动视图并管理用户交互。<entity-name>ListActivity活动在**详情显示区域**中显示实体实例列表时驱动视图并管理用户交互。\n\
  \nPlace是显示区域内可以转换为URL的位置。Activity映射到一个place（可转换为URL），从而使Activity可以通过URL访问。place是通过扩展GWT的Place抽象类来创建的。place实现类还定义了place实例如何转换为URL。Roo在flightapp-gwt中生成的ProxyPlace和ProxyListPlace类是GWT中place的示例。以下图表显示了ProxyPlace和ProxyListPlace类定义的属性：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_254_0.png)\n\nProxyPlace对应“详情”显示区域中的一个place，ProxyListPlace对应主显示区域中的一个place。创建ProxyPlace实例时，它知道正在为其创建place实例的EntityProxy（由proxyClass属性标识）、要在EntityProxy上执行的操作（由operation属性标识）以及EntityProxy的唯一标识符（由类型为EntityProxyId的proxyId属性标识）。同样，创建ProxyListPlace时，它知道正在为其创建place实例的EntityProxy（由proxyType属性标识）。\n\
  \n每个显示区域都关联一个ActivityMapper，它将显示区域中的每个Place映射到一个Activity。它是通过实现GWT的ActivityMapper接口来创建的。ActivityMapper定义了一个方法getActivity(Place\
  \ place)，返回与place对应的活动。在flightapp-gwt应用程序中，ApplicationMasterActivities是主显示区域的ActivityMapper，ApplicationDetailsActivities是详情显示区域的ActivityMapper。以下类图显示了Roo在flightapp-gwt项目中创建的ActivityMappers：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_255_0.png)\n\n此图显示，Roo创建了与Flight和FlightDescription\
  \ JPA实体相对应的FlightActivitiesMapper和FlightDescriptionActivitiesMapper类。尽管这些活动映射器不实现GWT的ActivityMapper接口，但它们在flightapp-gwt应用程序中充当活动映射器。这些活动映射器返回特定于EntityProxy的Activity实例。<entity-name>ActivitiesMapper类的getActivity方法接受一个ProxyPlace（表示详情显示区域中的一个place）参数并返回该place的Activity。ApplicationDetailsActivities活动映射器（适用于Web\
  \ UI的详情显示区域）负责根据要执行用户操作的JPA实体创建FlightActivitiesMapper和FlightDescriptionActivities实例。ApplicationMasterActivities根据从主显示区域选择的JPA实体返回FlightListActivity或FlightDescriptionListActivity。\n\
  \nActivityManager与一个显示区域相关联，并在用户从一个place导航到另一个place时启动和停止活动。它是通过传入ActivityMapper实例和EventBus实例来创建GWT的ActivityManager类的实例。在flightapp-gwt中，当执行ScaffoldDesktopApp的run方法时，ActivityManager会为“主”和详情显示区域创建，如以下序列图所示：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_256_0.png)\n\n## 处理实体代理特定处理\n\nRoo创建了一个抽象泛型类ApplicationEntityTypesProcessor<T>，用于处理脚手架GWT应用程序中的不同实体代理。ApplicationEntityTypesProcessor<T>由基于实体代理类型执行功能的类实现。以下代码清单显示了flightapp-gwt项目的ApplicationEntityTypesProcessor<T>类：\n\
  \n```\nApplicationEntityTypesProcessor.java\npackage sample.roo.flightapp.client.managed.request;\n\
  \npublic abstract class ApplicationEntityTypesProcessor<T> {\n\nprivate final T\
  \ defaultValue;\n\nprivate T result;\n\nprivate static void process(\nApplicationEntityTypesProcessor<?>\
  \ processor,\nClass<?> clazz) {\nif (FlightProxy.class.equals(clazz)) {\n    processor.handleFlight((FlightProxy)\
  \ null);\n    return;\n}\nif (FlightDescriptionProxy.class.equals(clazz)) {\n  \
  \  processor.handleFlightDescription(\n    (FlightDescriptionProxy) null);\n   \
  \ return;\n}\nprocessor.handleNonProxy(null);\n}\n...\n\npublic abstract void handleFlight(FlightProxy\
  \ proxy);\n\npublic abstract void handleFlightDescription(FlightDescriptionProxy\
  \ proxy);\n\npublic T process(Class<?> clazz) {\nsetResult(defaultValue);\nApplicationEntityTypesProcessor.process(this,\
  \ clazz);\nreturn result;\n}\n...\n```\n\nApplicationEntityTypesProcessor<T>类表示一个泛型类。handleFlight和handleFlightDescription方法定义为抽象方法；因此，子类需要提供这些方法的实现。\n\
  \n> 你会在ApplicationEntityTypesProcessor<T>类中为每个实体代理定义一个抽象handleXXX方法。\n\nresult属性标识在调用ApplicationEntityTypesProcessor<T>类的公共process方法时要返回的结果。请注意，result属性的返回类型是泛型类型——由与参数关联的泛型类型决定。公共process方法接受实体代理的类或对象作为参数，并在内部调用私有process方法，后者又根据实体代理对象或类调用handleFlight或handleFlightDescription方法。\n\
  \n那么，handleXXX方法在实现类中预期做什么？它只是设置一个返回值，该值在调用公共process方法时返回。让我们在示例的上下文中看看这一点。\n\n\
  我们之前提到过，ApplicationDetailsActivities类代表Roo生成的GWT应用程序中详情显示区域的ActivityMapper。ApplicationDetailsActivities通过实现ApplicationEntityTypesProcessor<T>类，返回特定于FlightProxy实体代理的FlightActivitiesMapper或特定于FlightDescriptionProxy实体代理的FlightDescriptionActivitiesMapper实例。\n\
  \nApplicationDetailsActivities扩展了ApplicationDetailsActivities_Roo_Gwt类，该类实际实现了ActivityMapper\
  \ GWT接口。\n\n以下代码展示了ApplicationDetailsActivities如何使用ApplicationEntityTypesProcessor<T>类：\n\
  \n```\nApplicationDetailsActivities_Roo_Gwt.java\npublic Activity getActivity(Place\
  \ place) {\n    ...\n    final ProxyPlace proxyPlace = (ProxyPlace) place;\n   \
  \ return new ApplicationEntityTypesProcessor<Activity>() {\n    @Override\n    public\
  \ void handleFlight(FlightProxy proxy) {\n        setResult(new FlightActivitiesMapper(requests,\n\
  \                placeController).getActivity(proxyPlace));\n    }\n\n    @Override\n\
  \    public void handleFlightDescription(FlightDescriptionProxy\n            proxy)\
  \ {\n        setResult(new FlightDescriptionActivitiesMapper(requests,\n       \
  \         placeController).getActivity(proxyPlace));\n    }\n    }.process(proxyPlace.getProxyClass());\n\
  }\n```\n\n在此代码中，需要注意以下重要事项：\n\n- ApplicationEntityTypesProcessor<T>与Activity类型关联。\n\
  - handleFlight方法将返回值设置为从FlightActivitiesMapper返回的Activity。\n- handleFlightDescription方法将返回值设置为从FlightDescriptionActivitiesMapper返回的Activity。\n\
  - 在末尾调用ApplicationEntityTypesProcessor<T>的process方法，以获取由handleFlight或handleFlightDescription方法设置的返回值。\n\
  \n\n\n\n这段代码表明 ApplicationEntityTypesProcessor<T> 泛型类与 Activity 类型相关联，用于检索特定于 FlightProxy\
  \ 或 FlightDescriptionProxy 的 Activity。同样，Roo 生成的 GWT 代码使用 ApplicationEntityTypesProcessor<T>\
  \ 类来执行其他特定于实体代理的处理，例如在 **主显示区域** 中呈现实体列表。\n\n## 还有更多...\n\n现在让我们来看看：\n\n- 如何在嵌入式\
  \ Jetty 容器中编译和运行 Roo 生成的 GWT 应用程序\n- 如何访问 Roo 生成的 flightapp-gwt 应用程序的移动版本\n- Roo\
  \ 生成的 GWT 应用程序中的往返支持\n- 如何启用远程日志\n\n## 在嵌入式 Jetty 容器中编译和运行 GWT 应用程序\n\n在开发模式下，GWT\
  \ 应用程序不会被编译为 JavaScript。您可以通过执行 `mvn jetty:run-exploded` 命令，将 GWT 应用程序编译为 JavaScript\
  \ 并使用嵌入式 Jetty 容器运行，如下所示：\n\n```\nC:\\roo-cookbook\\ch05-gwt> mvn jetty:run-exploded\n\
  ```\n\n现在，您可以通过输入以下 URL 来访问 `flightapp-gwt` 应用程序：`http://localhost:8080/flightapp-gwt/index.html`\n\
  \n## 访问 GWT 应用程序的移动版本\n\n如果您已使用 `mvn jetty:run-exploded` 命令编译并部署了 `flightapp-gwt`\
  \ 应用程序，则可以使用以下 URL 访问 `flightapp-gwt` 应用程序的移动版本：\n\n```\nhttp://localhost:8080/flightapp-gwt/index.html&m=true\n\
  ```\n\n如果您正在开发模式下运行 `flightapp-gwt` 应用程序，则请使用以下 URL：\n\n```\nhttp://127.0.0.1:8888/ApplicationScaffold.html?gwt.codesvr=127.0.0.1:9997&m=true\n\
  ```\n\n无论哪种情况，您都会看到 flightapp-gwt 应用程序的移动版本，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_260_0.png)\n\
  \n在此屏幕截图中，**航班** 和 **航班描述** 选项可点击，选择它们后即可开始对 JPA 实体实例执行 CRUD 操作。\n\n## GWT 应用程序的往返支持\n\
  \n如果您在 Roo 脚手架的 GWT 应用程序中添加、修改或删除了 JPA 实体中的任何字段，Roo 将相应地对 GWT 制品进行必要的更改。要查看 Roo\
  \ 对脚手架 GWT 应用程序的往返支持，请从 flightapp-gwt 项目的根目录启动 Roo shell，并使用 field 命令向 FlightDescription\
  \ 实体添加 aircraftModel 字段，或直接从 IDE 中编辑 FlightDescription.java 文件。作为对 aircraftModel\
  \ 属性添加的响应，Roo shell 显示 Roo 采取的以下操作：\n\n```\nUpdated ...FlightDescriptionProxy.java\n\
  Updated ...FlightDescriptionListView_Roo_Gwt.java\nUpdated ...FlightDescriptionDetailsView_Roo_Gwt.java\n\
  Updated ...FlightDescriptionDetailsView.ui.xml\nUpdated ...FlightDescriptionEditView_Roo_Gwt.java\n\
  Updated ...FlightDescriptionEditView.ui.xml\n...\n```\n\n输出显示，Roo 会更新 GWT 实体代理 FlightDescriptionProxy\
  \ 及其他 GWT 制品，以反映对 FlightDescription JPA 实体的修改。需要注意的另一重要点是，大部分修改仅限于 *\\_Roo_Gwt.java\
  \ 文件——即由 Roo 管理的文件。因此，如果您对不遵循 *\\_Roo_Gwt.java 命名约定的文件进行更改，则 Roo 会保留此类更改（修改 *.client.managed.*\
  \ 包中的 Java 文件的情况除外）。在 Roo 脚手架的 GWT 应用程序中，*\\_Roo_Gwt.java 文件相当于 *\\_Roo_.aj AspectJ\
  \ ITD 文件，也就是说，Roo 通过仅修改 *\\_Roo_Gwt.java 文件来尽量减少对脚手架 GWT 代码的影响。\n\n## 启用远程日志\n\n\
  GWT 日志框架模拟 Java Logging API，从而可以记录来自 sample.roo.client 包及其子包中 Java 代码的消息。如前所述，sample.roo.client\
  \ 包及其子包中包含的 Java 类会被 GWT 编译器转换为 JavaScript。GWT 中的远程日志功能使客户端代码能够将日志消息发送到服务器端日志基础架构。要配置远程日志，请在\
  \ ApplicationScaffold.gwt.xml 文件中将 gwt.logging.simpleRemoteHandler 属性的值设置为 ENABLED：\n\
  \n```\n<set-property name=\"gwt.logging.simpleRemoteHandler\"\nvalue=\"ENABLED\"\
  />\n```\n\n上述配置可启用消息的远程日志。GWT 提供了 RemoteLoggingServiceImpl servlet，它充当处理从客户端接收的日志消息的处理程序。您需要在\
  \ web.xml 文件中配置 RemoteLoggingServiceImpl servlet，如下所示：\n\n```\n<servlet>\n<servlet-name>remoteLogger</servlet-name>\n\
  <servlet-class>\ncom.google.gwt.logging.server.RemoteLoggingServiceImpl\n</servlet-class>\n\
  </servlet>\n```\n\n```\n<servlet-mapping>\n<servlet-name>remoteLogger</servlet-name>\n\
  <url-pattern>\n/applicationScaffold/remote_logging\n</url-pattern>\n</servlet-mapping>\n\
  ```\n\n需要注意的是，RemoteLoggingServiceImpl servlet 应映射到 /<module_name>/remote_logging\
  \ URL。\n\n由于 GWT 编译器将客户端 Java 类中的方法名称转换为 JavaScript 时会对其进行混淆，因此您需要在 ApplicationScaffold.gwt.xml\
  \ 文件中设置以下属性来重新符号化或反混淆它们：\n\n```\n<set-property name=\"compiler.emulatedStack\" value=\"\
  true\" />\n<set-configuration-property\nname=\"compiler.emulatedStack.recordLineNumbers\"\
  \nvalue=\"true\" />\n<set-configuration-property\nname=\"compiler.emulatedStack.recordFileNames\"\
  \nvalue=\"true\" />\n```\n\n此外，您还需要使用 GWT 编译器的 `-extra` 选项创建符号映射目录，并将其放置在服务器端代码可访问的目录中，例如生成的\
  \ WAR 文件的 `WEB-INF/classes` 目录。\n\n## 另请参阅\n\n- 有关 Roo 如何从 JPA 实体脚手架 Spring MVC\
  \ 应用程序的详细信息，请参阅第 4 章（使用 Spring Web MVC 进行 Web 应用程序开发）中的“从 JPA 实体自动生成 Spring MVC\
  \ 控制器和 JSPX 视图”配方。\n\n## 开始进行 Flex 应用程序开发\n\n在前一个配方中，我们了解了如何使用 Roo 脚手架一个完整的 GWT\
  \ 应用程序。在本配方中，我们将了解 Roo 如何简化为 Roo 项目设置 Flex。在下一个配方“从 JPA 实体脚手架 Flex 应用程序”中，我们将了解\
  \ Roo 如何生成功能齐全的 Flex 应用程序，以便对 JPA 实体实例执行 CRUD 操作。\n\n## 准备工作\n\n编写本书时，Flex 插件与 Spring\
  \ Roo 1.1.3 及以上版本不兼容，因此请下载 Spring Roo 1.1.2。\n\n编写本配方时，所使用的 Flex 插件是 Flex Spring\
  \ Roo 插件仓库中日期为 15-Aug-2011 的快照版本 (`http://s3browse.springsource.com/browse/maven.springframework.org/snapshot/org/springframework/flex/roo.addon/org.springframework.flex.roo.addon/1.0.0.BUILD-SNAPSHOT/`)。下载名为\
  \ `org.springframework.flex.roo.addon-xx.jar` 的 JAR 文件，并将其复制到 Roo 的 bundle 目录中，或使用\
  \ `osgi start` 命令（如第 7 章“开发插件和从项目中删除 Roo”中所述）进行安装。\n\nFlex 插件是可安装插件的一个示例。有关可安装插件的更多信息，请参见第\
  \ 7 章“开发插件和从项目中删除 Roo”。\n\n在系统中创建新目录 `C:\\roo-cookbook\\ch05-flex`，并从 `ch05-flex`\
  \ 目录启动 Roo shell。输入 `help` 命令，检查输出中是否显示 `flex setup`、`flex removing scaffold` 和\
  \ `flex remoting all` 命令。如果在 `help` 命令的输出中看到 `flex` 命令，则表示您已成功安装 Flex 插件。\n\n将随本书提供的\
  \ ch05_flex_app.roo 脚本复制到 ch05-flex 目录。现在，使用 script 命令执行 ch05_flex_app.roo 脚本。执行\
  \ ch05_flex_app.roo 脚本将创建 flightapp_flex Eclipse 项目，将 Hibernate 设置为持久化提供程序，将 MySQL\
  \ 配置为应用程序的数据库，创建 Flight 和 FlightDescription JPA 实体，并定义 Flight 和 FlightDescription\
  \ 实体之间的多对一关系。如果您使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，则请相应地修改脚本。\n\n虽然不是必需的，但您可能还希望下载 Flash\
  \ Builder 4 并将其作为 Eclipse 插件安装，以简化编辑本配方中 Roo 生成的 MXML 和 ActionScript 文件。\n\n## 操作方法\n\
  \n要设置 Flex 应用程序，请按以下步骤操作：\n\n- 1. 执行 flex setup 命令，在 flightapp_flex 项目中创建与 Spring\
  \ BlazeDS 集成相关的配置制品：\n\n```\n... roo> flex setup\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\\
  flex\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\flex\\services-config.xml\n...\nCreated\
  \ SRC_MAIN_WEBAPP\\WEB-INF\\spring\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\spring\\flex-config.xml\n\
  Created SRC_MAIN_WEBAPP\\WEB-INF\\spring\\webmvc-config.xml\n...\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\web.xml\nManaged SRC_MAIN_WEBAPP\\WEB-INF\\web.xml\n...\nManaged SRC_MAIN_WEBAPP\\\
  WEB-INF\\spring\\webmvc-config.xml\nManaged ROOT\\pom.xml [Added dependency com.adobe.flex.\n\
  framework:flex-framework:4.0.0.14159]\nManaged ROOT\\pom.xml [Added dependency org.springframework.\n\
  flex:spring-flex-core:1.5.0.BUILD-SNAPSHOT]\n...\nCreated ROOT\\.flexProperties\n\
  Created ROOT\\.actionScriptProperties\n...\nCreated ROOT\\src\\main\\flex\\flightapp_flex_scaffold.mxml\n\
  Created SRC_MAIN_WEBAPP\\flightapp_flex_scaffold.html\nCreated ROOT\\src\\main\\\
  flex\\flightapp_flex_scaffold-config.xml\n```\n\n\n\n\n- 2. 将 Spring 快照版本的 Maven\
  \ 仓库包含在你的 `pom.xml` 文件中，以便 Flex 插件可以下载尚未在 Spring 的里程碑或发布 Maven 仓库中提供的 Flex 插件依赖项：\n\
  \n```xml\n<repositories>\n<repository>\n<id>spring-maven-snapshot</id>\n<name>Spring\
  \ Maven Snapshot Repository</name>\n<url>\nhttp://maven.springframework.org/snapshot\n\
  </url>\n</repository>\n...\n</repositories>\n```\n\n- 3. 在 `pom.xml` 文件中配置 Flexmojos\
  \ Maven 插件的插件仓库（有关详细信息，请参阅插件文档：http://repository.sonatype.org/content/sites/flexmojos-site/3.8/plugin-info.html），如下所示：\n\
  \n```xml\n<pluginRepositories>\n<pluginRepository>\n<id>flexmojos-repository</id>\n\
  <url>\nhttp://repository.sonatype.org/content/groups/flexgroup/\n</url>\n</pluginRepository>\n\
  ...\n</pluginRepositories>\n```\n\n- 4. 执行 `perform eclipse` 命令，使用 `pom.xml` 文件中新添加的依赖项更新项目的类路径设置。它还将\
  \ Flex 和 ActionScript 性质添加到 `flightapp_flex` Eclipse 项目中。\n\n## 工作原理...\n\n`flex\
  \ setup` 命令由 Roo 的 Flex 插件处理。\n\n`flex setup` 命令配置 Spring BlazeDS 集成，并创建开发 Flex\
  \ 4 应用程序所需的必要工件。下表描述了由 `flex setup` 命令创建的一些重要目录和文件：\n\n| 目录 / 文件 | 说明 |\n| --- |\
  \ --- |\n| SRC_MAIN_WEBAPP/history | 包含 history.css、history.js 和 historyFrame.html\
  \ 文件，用于管理浏览器历史记录。 |\n| SRC_MAIN_WEBAPP/WEB-INF/flex/services-config.xml | services-config.xml\
  \ 是 BlazeDS 配置文件，包含 BlazeDS 的通道和相应的端点配置。 |\n| SRC_MAIN_WEBAPP/WEB-INF/spring/flex-config.xml\
  \ | flex-config.xml 将 BlazeDS MessageBroker 配置为 Spring 管理的 Bean。 |\n| SRC_MAIN_WEBAPP/WEB-INF/spring/webmvc-config.xml\
  \ | Spring 的 Web 应用程序上下文 XML，由 web.xml 文件中定义的 DispatcherServlet 加载。此外，webmvc-config.xml\
  \ 文件从 flex-config.xml 导入 Bean 定义。 |\n| ROOT/html-template | html-template 目录包含 index.template.html\
  \ 文件，该文件充当嵌入 Flex 应用程序的 HTML 模板。Roo 在 SRC_MAIN_WEBAPP 目录中生成 flightapp_flex_scaffold.html\
  \ 文件（基于 index.template.html 文件），用于嵌入我们的 Flight App Flex 应用程序。因此，要加载我们的 Flight App\
  \ Flex 应用程序，需要在 Web 浏览器中加载 flightapp_flex_scaffold.html 页面。 |\n| ROOT/src/main/flex/flightapp_flex_scaffold.mxml\
  \ | flightapp_flex_scaffold.mxml 是主应用程序 MXML 文件，用于定义应用程序的布局和初始用户界面。 |\n| ROOT/src/main/flex/flightapp_flex_scaffold-config.xml\
  \ | flightapp_flex_scaffold-config.xml 文件会替换默认的 Flex 编译器设置。在“从 JPA 实例构建脚手架 Flex\
  \ 应用程序”示例中，我们将看到该 XML 文件包含与 Roo 为每个 JPA 实例构建的主视图（MXML 文件）对应的完全限定 ActionScript 类名称。\
  \ |\n\n现在让我们来看看 Spring Roo 创建的重要配置文件。\n\nwebmvc-config.xml 文件是 Spring 的 Web 应用程序上下文\
  \ XML 文件，由 flightapp_flex 项目 web.xml 文件中配置的 DispatcherServlet 加载。webmvc-config.xml\
  \ 文件导入 flex-config.xml 应用程序上下文 XML 文件中的 Bean 定义，如下所示：\n\n```\nwebmvc-config.xml\n\
  <beans ...>\n...\n<import resource=\"flex-config.xml\" />\n</beans>\n```\n\n> 有关\
  \ webmvc-config.xml 文件中定义的其他元素的信息，请参阅第 4 章，使用 Spring Web MVC 进行 Web 应用程序开发。\n\n\
  flex-config.xml 使用 Spring Flex 模式的 `<message-broker>` 元素来配置和初始化 BlazeDS MessageBroker，如下所示：\n\
  \n```\nflex-config.xml\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
  \n    xmlns:flex=\"http://www.springframework.org/schema/flex\"\n    ...>\n\n<flex:message-broker\
  \ mapping-order=\"1\">\n    <flex:mapping pattern=\"/messagebroker/*\"/>\n    <flex:message-service\
  \ default-channels=\"longpolling-amf\" />\n</flex:message-broker>\n\n</beans>\n\
  ```\n\n默认情况下，`<message-broker>` 元素将 /WEB-INF/flex/services-config.xml 文件视为 BlazeDS\
  \ MessageBroker 的配置文件。如果你更改了 flightapp_flex 中 services-config.xml 文件的名称或位置，则使用 `<message-broker>`\
  \ 元素的 services-config-path 属性来指定你的 BlazeDS 配置 XML 文件。\n\nFlex 模式的 `<mapping>` 元素将来自\
  \ DispatcherServlet 的传入请求映射到 /messagebroker/* 路径——即 BlazeDS MessageBroker 通道在 services-config.xml\
  \ 中映射到的路径，我们稍后将看到这一点。\n\n`<message-service>` 元素配置一个 BlazeDS flex.messaging.services.MessageService\
  \ 对象，该对象为应用程序中消息生产者和消费者之间提供发布-订阅消息传递。default-channels 属性指定 Flex 客户端用于访问 MessageService\
  \ 或从中接收消息的消息通道。longpolling-amf 值指的是 services-config.xml 中已启用轮询的 AMFChannel。\n\n\
  > 重要的是要注意，尽管 Roo 配置了 MessageService，但 Roo 生成的 Flex 应用程序并未使用它。\n\n下面的清单显示了 Roo 生成的\
  \ services-config.xml 文件中配置的通道：\n\n```\nservices-config.xml\n<channels>\n    <channel-definition\
  \ id=\"amf\"\n        class=\"mx.messaging.channels.AMFChannel\">\n        <endpoint\n\
  \        url=\"http://{server.name}:{server.port}/{context.root}/messagebroker/amf\"\
  \n        class=\"flex.messaging.endpoints.AMFEndpoint\"/>\n    </channel-definition>\n\
  \    ...\n    <channel-definition id=\"longpolling-amf\"\n    class=\"mx.messaging.channels.AMFChannel\"\
  >\n    <endpoint url=\"http://{server.name}:{server.port}/{context.root}/messagebroker/amflongpolling\"\
  \n    class=\"flex.messaging.endpoints.AMFEndpoint\"/>\n    <properties>\n    <polling-enabled>true</polling-enabled>\n\
  \    ...\n    </properties>\n    </channel-definition>\n    ...\n</channels>\n```\n\
  \n此代码清单显示了由 Roo 创建的通道定义。`<channel-definition>` 元素定义一个通道。id 属性是通道的唯一标识符，Flex 客户端使用它来连接到端点。class\
  \ 属性标识通道的类型。封闭的 `<endpoint>` 元素定义与通道对应的端点。`<endpoint>` 元素的 url 属性指定服务器的 URL，class\
  \ 属性指定端点类。Flex 组件使用通道与 BlazeDS 端点进行通信。例如，上述代码清单表明 AMFChannel 由 Flex 用于与 AMFEndpoint\
  \ 通信。\n\nurl 属性值中使用的 {server.name} 和 {server.port} 令牌在运行时会根据下载 SWF 文件的服务器 URL 进行替换。{context.root}\
  \ 令牌会替换为在编译时根据 pom.xml 文件中 Flexmojos Maven 插件定义的 `<contextRoot>` 配置选项计算出的值。稍后在本示例中，我们将查看\
  \ Roo 为 flightapp_flex 项目生成的 Flexmojos Maven 插件配置。\n\n发送到 DispatcherServlet 的传入请求被路由到\
  \ BlazeDS MessageBroker，因为 flex-config.xml 中 `<mapping-pattern>` 元素的值（即 /messagebroker/*）映射到\
  \ services-config.xml 中 `<endpoint>` 元素的 url 属性值（http://.../messagebroker/..）。\n\
  \n我们之前看到，longpolling-amf 通道被 MessageService 用作传输消息的默认通道。该通道的 `<polling-enabled>`\
  \ 属性设置为 true，这意味着 longpolling-amf 通道已启用轮询。\n\n\n\n\nservices-config.xml 文件中的以下 <services>\
  \ 元素显示了应用程序级默认频道配置：\n\n```\n<services>\n<default-channels>\n<channel ref=\"amf\"\
  \ />\n</default-channels>\n</services>\n```\n\n此 <default-channels> 元素指定，如果 Flex\
  \ 组件未指定要使用的频道，则使用 amf 频道进行通信。\n\nRoo 还使用 <logging> 元素在 services-config.xml 中配置服务器端日志记录，如下所示：\n\
  \n```\n<logging>\n<target class=\"flex.messaging.log.ConsoleTarget\"\nlevel=\"Warn\"\
  >\n<properties>\n<prefix>[BlazeDS] </prefix>\n<includeDate>false</includeDate>\n\
  <includeTime>false</includeTime>\n<includeLevel>false</includeLevel>\n<includeCategory>false</includeCategory>\n\
  </properties>\n<filters>\n<pattern>Endpoint.*</pattern>\n<pattern>Service.*</pattern>\n\
  <pattern>Configuration</pattern>\n</filters>\n</target>\n</logging>\n```\n\n日志配置指定日志消息写入的位置、写入的消息类型、写入方式，以及每个类别（如\
  \ Endpoint、Service 等）生成的日志消息。flex.messaging.log.ConsoleTarget 的 class 属性（target\
  \ 元素的）值表示日志消息写入到标准输出。level=\"Warn\" 表示仅写入警告级别的消息。在上述代码中，<properties> 元素指定日志消息带有\
  \ [BlazeDS] 前缀，并包含日期、时间、日志级别和类别。<filters> 元素将日志记录限制为由 <pattern> 子元素定义的类别。\n\n现在让我们来看一下充当主应用程序文件的脚手架\
  \ MXML 文件——即包含 Flex Spark 组件库中 Application 组件的 MXML 文件。以下代码清单显示了 flightapp_flex_scaffold.mxml\
  \ 文件：\n\n```\nflightapp_flex_scaffold.mxml\n<s:Application xmlns:fx=\"http://ns.adobe.com/mxml/2009\"\
  \n    xmlns:s=\"library://ns.adobe.com/flex/spark\"\n    xmlns:mx=\"library://ns.adobe.com/flex/mx\"\
  >\n<fx:Script>\n<![CDATA[\n    ...\n    protected function\n    entityList_doubleClickHandler(event:MouseEvent):void\n\
  \    {\n        ...\n    }\n]]>\n</fx:Script>\n\n<fx:Declarations>\n<s:ArrayList\
  \ id=\"entities\"/>\n</fx:Declarations>\n\n<s:ChannelSet id=\"remotingChannels\"\
  >\n    <s:AMFChannel id=\"amf\" url=\n    \"http://localhost:8080/flightapp_flex/messagebroker/amf\"\
  />\n</s:ChannelSet>\n</fx:Declarations>\n\n<s:Group id=\"mainGroup\" height=\"100%\"\
  \ width=\"100%\">\n    <s:layout>\n    <s:HorizontalLayout/>\n    </s:layout>\n\n\
  \    <s:Panel id=\"entityPanel\" title=\"Entity List\" height=\"100%\">\n    <s:List\
  \ id=\"entityList\" dataProvider=\"{entities}\"\n        width=\"100%\" height=\"\
  100%\"\n        toolTip=\"Double-Click the selected Entity\"\n        doubleClickEnabled=\"\
  true\"\n        doubleClick=\"entityList_doubleClickHandler(event)\"/>\n    </s:Panel>\n\
  </s:Group>\n\n</s:Application>\n```\n\n此 MXML 显示了 flightapp_flex 应用程序的用户界面。`<Panel>`\
  \ 标签创建了一个包含 Spark List 组件的 Spark Panel 组件。List 组件显示可从用户界面管理的实体列表。实体列表由 `<ArrayList>`\
  \ 标签定义。请注意，`<List>` 标签的 dataProvider 属性值为 {entities}，而 `<ArrayList>` 标签的 id 属性值为\
  \ entities，这意味着 List 组件显示的实体列表来自由 `<ArrayList>` 标签定义的列表。不过，`<ArrayList>` 标签不包含任何元素；因此，目前列表为空。\n\
  \n> 当我们执行 flex remoting all 或 flex remoting scaffold 命令来为 JPA 实体脚手架一个远程处理目标时，`<ArrayList>`\
  \ 标签将用子元素填充，正如我们将在“从 JPA 实体脚手架 Flex 应用程序”配方中看到的那样。\n\n`<List>` 的 doubleClick 属性指定当用户双击列表中的项目时，将调用\
  \ `entityList_doubleClickHandler(event)` ActionScript 方法。在“从 JPA 实体脚手架远程处理目标”配方中，我们将详细介绍\
  \ `entityList_doubleClickHandler(event)` 方法的实现。\n\n`<ChannelSet>` 标签创建一个 ChannelSet——一组用于与\
  \ BlazeDS 服务器通信的频道。如前所述，Roo 在 services-config.xml 中将 amf 频道（频道类型为 AMFChannel）定义为默认的应用程序级频道；因此，Roo\
  \ 生成的 `<ChannelSet>` 标签使用 `<AMFChannel>` 标签创建一个 AMFChannel。`<AMFChannel>` 的 url\
  \ 属性指定相应的端点 URL。\n\n> 由于 `<AMFChannel>` 标签的 url 属性将 BlazeDS 服务器的位置指定为 localhost，因此您的\
  \ Roo 生成的 flightapp_flex 应用程序仅在 BlazeDS 服务器本地运行时才能工作。为了避免硬编码端点 URL，建议将 ChannelSet\
  \ 配置外部化到一个 XML 文件中，该文件在 Flex 应用程序初始化时解析，并随后用于与 BlazeDS 服务器通信。\n\n如前所述，Roo 生成了一个\
  \ flightapp_flex_scaffold-config.xml 配置文件，用于覆盖默认的 Flex 编译器设置。请注意，该文件遵循的命名约定为：<MXML\
  \ 文件名>-config.xml，其中 <MXML 文件名> 是创建的配置文件所对应的 MXML 文件的名称。在编译名为 myApp.mxml 的 MXML\
  \ 文件时，Flex 编译器会在 MXML 文件所在位置查找名为 myApp-config.xml 的配置文件，并使用它来覆盖默认的编译器选项。以下清单显示了\
  \ flightapp_flex_scaffold-config.xml 文件的内容：\n\n```\n<flex-config xmlns=\"http://www.adobe.com/2006/flex-config\"\
  >\n    <includes append=\"true\">\n    </includes>\n</flex-config>\n```\n\n正如代码所示，flightapp_flex_scaffold-config.xml\
  \ 没有做任何有趣的事情。在“从 JPA 实体脚手架 Flex 应用程序”配方中，我们将在执行 flex remoting all 或 flex remoting\
  \ scaffold 命令后对该文件进行更新时详细讨论它。\n\n## 更多内容...\n\n如前所述，Roo 在 `flightapp_flex` 项目的 `pom.xml`\
  \ 文件中配置了 Flexmojos Maven 插件。现在让我们详细了解一下 Flexmojos 插件配置。\n\n## Flexmojos Maven 插件配置\n\
  \nFlexmojos Maven 插件提供许多功能，但为了简洁起见，我们将只关注 `flexmojos:compile-swf` 目标，该目标负责编译 Flex\
  \ 项目的源代码（MXML 和 ActionScript 文件）并将其打包为 SWF 文件。以下清单显示了 `flightapp_flex` 项目 `pom.xml`\
  \ 文件中 Flexmojos Maven 插件的配置：\n\npom.xml\n\n```\n<plugin>\n    <groupId>org.sonatype.flexmojos</groupId>\n\
  \    <artifactId>flexmojos-maven-plugin</artifactId>\n    <version>3.7.1</version>\n\
  \    <executions>\n        <execution>\n            <id>compile-scaffold-swf</id>\n\
  \            <phase>process-resources</phase>\n            <goals>\n           \
  \     <goal>compile-swf</goal>\n            </goals>\n            <configuration>\n\
  \                <incremental>true</incremental>\n                <sourceFile>\n\
  \                    ${basedir}/src/main/flex/${project.name}_scaffold.mxml\n  \
  \              </sourceFile>\n                <sourcePaths>\n                  \
  \  <path>${basedir}/src/main/flex</path>\n                </sourcePaths>\n     \
  \           <output>\n${basedir}/src/main/webapp/${project.name}_scaffold.swf\n\
  </output>\n<contextRoot>${project.build.finalName}</contextRoot>\n<services>\n${basedir}/src/main/webapp/WEB-INF/\n\
  flex/services-config.xml\n</services>\n<debug>true</debug>\n</configuration>\n</execution>\n\
  </executions>\n<dependencies>\n<dependency>\n<groupId>com.adobe.flex</groupId>\n\
  <artifactId>compiler</artifactId>\n<version>4.0.0.14159</version>\n<type>pom</type>\n\
  </dependency>\n</dependencies>\n</plugin>\n```\n\n在此清单中，`<configuration>` 元素配置 Flexmojos\
  \ Maven 插件。\n\n`<sourceFile>` 元素标识插件要编译的主应用程序 MXML 文件，即 flighttracker_flex_scaffold.mxml\
  \ 文件。\n\n`<sourcePaths>` 指定项目 ActionScript 文件所在的基目录或目录，这对应于 /src/main/flex，即执行 `flex\
  \ remoting all` 或 `flex remoting scaffold` 命令时创建的目录。\n\n`<output>` 指定生成的 SWF 文件的名称和位置，对于\
  \ flighttracker_flex 项目，该位置为 SRC_MAIN_WEBAPP/flighttracker_flex_scaffold.swf。\n\n\
  `<contextRoot>` 元素指定 Web 应用程序的上下文根，这对应于值 flighttracker_flex-0.1.0.BUILD-SNAPSHOT。\n\
  \n`<contextRoot>` 元素的值用于替换 services-config.xml 文件中定义的端点 URL 中指定的 `{context.root}`\
  \ 标记。\n\n`<services>` 元素指定定义频道和相应端点的 services-config.xml 文件。\n\n`<dependency>` 元素指定\
  \ Flexmojos Maven 插件依赖于 Flex 编译器。\n\n请注意，依赖类型为 `pom` 而非 `jar`。\n\n由于依赖类型为 `pom`，相应\
  \ `pom` 文件（可在 `https://repository.sonatype.org/content/groups/flexgroup/` 处找到）中指定的依赖项会被添加到\
  \ Flexmojos Maven 插件所需的依赖项中。\n\n\n\n\n## 另请参阅\n\n- 参考“从 JPA 实体脚手架 Flex 应用程序”配方，以了解如何使用\
  \ Roo 脚手架远程目标和 Flex 用户界面\n\n## 从 JPA 实体脚手架 Flex 应用程序\n\n在上一个配方中，我们了解了如何设置项目以使用 Flex\
  \ 和 Spring BlazeDS 集成。在本配方中，我们进一步脚手架了一个完整的 Flex 应用程序，该应用程序与 BlazeDS 交互，以对 JPA 实体执行\
  \ CRUD 操作。\n\n### 准备工作\n\n本配方是上一个配方“Flex 应用程序开发入门”的扩展；因此，执行上一个配方中描述的步骤，设置 flightapp_flex\
  \ 项目以使用 Flex 和 Spring BlazeDS 集成。\n\n从 C:\\roo-cookbook\\ch05-flex 目录启动 Roo shell——即在完成“Flex\
  \ 应用程序开发入门”配方时创建 flightapp_flex 项目的目录。\n\n### 操作步骤...\n\n要脚手架 Flex 应用程序，请按照以下步骤操作：\n\
  \n- 1. 执行 `flex remoting all` 命令，如下所示：\n\n```\n.. roo> flex remoting all --package\
  \ ~.flex\nCreated SRC_MAIN_JAVA\\sample\\roo\\flightapp\\flex\nCreated ..\\FlightDescriptionService.java\n\
  Created ..\\FlightDescriptionService_Roo_Service.aj\n..\nCreated ROOT\\src\\main\\\
  flex\\sample\\roo\\flightapp\\domain\nCreated ..\\FlightDescription.as\nUpdated\
  \ ROOT\\src\\main\\flex\\flightapp_flex_scaffold.mxml\nUpdated ROOT\\src\\main\\\
  flex\\flightapp_flex_scaffold-config.xml\nCreated ROOT\\src\\main\\flex\\sample\\\
  roo\\flightapp\\presentation\\\nflightdescription\nCreated ..\\FlightDescriptionEvent.as\n\
  Created ..\\FlightDescriptionView.mxml\nCreated ..\\FlightDescriptionForm.mxml\n\
  ```\n\n- 2. 此处显示的输出已按 Roo 创建的目录优先、随后是目录中创建的文件的顺序进行组织。Spring Roo shell 不会按上述方式显示输出。为简洁起见，输出仅显示与\
  \ FlightDescription JPA 实体相对应的创建文件。\n\n- 3. 退出 Roo shell，并从包含 `flightapp_flex` 项目的目录执行\
  \ `mvn install` 来构建 `flightapp_flex` 项目：\n  C:\\roo-cookbook\\ch05-flex>mvn install\n\
  \n- 4. 执行 Tomcat Maven 插件的 `tomcat:run` 目标（从包含 `flightapp_flex` Roo 项目的目录）以启动嵌入式\
  \ Tomcat 实例：\n  C:\\roo-cookbook\\ch05-flex>mvn tomcat:run\n\n- 5. 打开 Web 浏览器并访问\
  \ `flightapp_flex_scaffold.html` 文件，该文件充当我们 Flex 应用程序的 HTML 包装器：`http://localhost:8080/flightapp_flex/flightapp_flex_scaffold.html`。如果\
  \ Web 浏览器尚未安装 Flash Player 10 或更高版本，系统将提示您安装它。还建议为 Web 浏览器安装 Flash 调试器，以查看与 Flex\
  \ 应用程序交互时引发的任何异常。如果您看到以下 Flex 应用程序用户界面，则表示您已成功将 Flex 应用程序部署到 Tomcat 上：\n\n| 实体列表\
  \ |\n|---|\n| FlightDescription |\n| Flight |\n\n- 6. 此屏幕截图显示了可以使用 Flex 应用程序管理的\
  \ JPA 实体列表。由于 `flightapp_flex` 项目包含 `Flight` 和 `FlightDescription` 实体，因此它们在列表中显示。\n\
  \n- 7. 要对 `FlightDescription` 和 `Flight` 实体实例执行 CRUD 操作，请双击列表中的 JPA 实体名称。以下屏幕截图显示双击列表中的\
  \ **FlightDescription** 项目时显示的屏幕：\n\n| 实体列表 | FlightDescription 列表 |\n| :--- | :---\
  \ |\n| FlightDescription | 新建 FlightDescription |\n| Flight | 源 | 目的地 |\n\n### 工作原理...\n\
  \n`flex remoting all` 命令由 Spring Roo 的 Flex 插件处理。\n\nFlex 客户端通过 BlazeDS RemotingService\
  \ 与服务器端 BlazeDS 远程目标（即 Java 对象）进行交互。由于我们使用的是 Spring BlazeDS 集成，远程目标被配置为 Spring 服务组件，并且\
  \ RemotingService 由 Spring `flex` 架构的 `<message-broker>` 元素配置了合理的默认值（请参阅 SRC_MAIN_WEBAPP\\\
  WEB-INF\\spring\\flex-config.xml 文件）。`flex remoting all` 命令的 `package` 参数指定创建远程目标的包。\n\
  \n> 需要注意的是，Flex 客户端使用 MessageService 与消息目标（可能是 JMS 队列或主题）进行交互，并使用 RemotingService\
  \ 与远程目标（Java 对象）进行交互。\n\n以下表格描述了执行 `flex remoting all` 命令时创建的重要目录和文件：\n\n| 目录 /\
  \ 文件 | 说明 |\n| :--- | :--- |\n| SRC_MAIN_JAVA\\sample\\roo\\flightapp\\flex | 包含由\
  \ Roo 为 flightapp_flex 应用程序中每个尚不存在远程目标的 JPA 实体创建的远程目标。此目录基于 `flex remoting all`\
  \ 命令的 `package` 参数值创建。 |\n| ROOT\\src\\main\\flex\\sample\\roo\\flightapp\\domain\
  \ | 包含 Roo 生成的 ActionScript 类，这些类映射到 flightapp_flex 应用程序中的 JPA 实体。 |\n| ROOT\\src\\\
  main\\flex\\sample\\roo\\flightapp\\presentation\\flightdescription | 包含用于对 FlightDescription\
  \ JPA 实体执行 CRUD 操作的 MXML 文件和 ActionScript 类。目录名称源自 JPA 实体的名称。 |\n| ROOT\\src\\main\\\
  flex\\sample\\roo\\flightapp\\presentation\\flight | 包含用于对 Flight JPA 实体执行 CRUD\
  \ 操作的 MXML 文件和 ActionScript 类。目录名称源自 JPA 实体的名称。 |\n\n执行 `flex remoting all` 命令时，它会为应用程序中每个尚不存在远程目标的\
  \ JPA 实体创建一个远程目标（也是 Spring 服务组件）。远程目标定义用于对相应 JPA 实体执行 CRUD 操作的方法。以下代码清单显示了由 Roo\
  \ 为 FlightDescription JPA 实体创建的远程目标 FlightDescriptionService 类：\n\n```\nFlightDescriptionService.java\n\
  package sample.roo.flightapp.flex;\n\nimport org.springframework.flex.roo.addon.RooFlexScaffold;\n\
  import sample.roo.flightapp.domain.FlightDescription;\nimport org.springframework.flex.remoting.RemotingDestination;\n\
  import org.springframework.stereotype.Service;\n\n@RooFlexScaffold(entity = FlightDescription.class)\n\
  @RemotingDestination\n@Service\npublic class FlightDescriptionService {\n}\n```\n\
  \n在此代码中，@RooFlexScaffold 注解指示 Roo 生成相应的 AspectJ ITD 文件。此 AspectJ ITD 文件将方法引入 FlightDescriptionService\
  \ 类，用于对 FlightDescription 实体执行 CRUD 操作。@RooFlexScaffold 注解的 entity 属性指定 FlightDescriptionService\
  \ 类所管理的 JPA 实体。Spring 的 @RemotingDestination 注解指示 FlightDescriptionService 类被导出为远程目标。\n\
  \n由 Spring 管理的 MessageBroker 负责将从 Flex 客户端接收的消息路由到 RemotingService，后者反过来调用 Spring\
  \ 管理的远程目标上的方法。@Service 注解指示 FlightDescriptionService 表示 Spring 的服务组件。使用 @Service\
  \ 注解可确保 FlightDescriptionService 使用 Spring 的类路径扫描功能自动注册到 Spring 的 Web 应用程序上下文中（请参阅\
  \ webmvc-config.xml 文件中定义的 `<component-scan>` 元素）。\n\n以下代码清单显示了与 FlightDescriptionService\
  \ 类中的 @RooFlexScaffold 注解相对应的 AspectJ ITD 文件：\n\n```\nFlightDescriptionService_Roo_Service.aj\n\
  package sample.roo.flightapp.flex;\n\nimport java.lang.Long;\nimport java.util.List;\n\
  import sample.roo.flightapp.domain.FlightDescription;\n\nprivileged aspect FlightDescriptionService_Roo_Service\
  \ {\n\n    public FlightDescription\n        FlightDescriptionService.show(Long\
  \ id) {\n        ...\n        return FlightDescription.findFlightDescription(id);\n\
  \    }\n\n    public List<FlightDescription>\n        FlightDescriptionService.list()\
  \ {\n        return FlightDescription.findAllFlightDescriptions();\n    }\n\n  \
  \  ...\n}\n```\n\n此代码显示 FlightDescriptionService_Roo_Service.aj 在 FlightDescriptionService\
  \ 类中为 FlightDescription JPA 实体引入了 CRUD 操作。虽然上述代码未显示，但也为读取 FlightDescription JPA\
  \ 实体列表引入了分页支持。\n\n\n\n\n与 @RooFlexScaffold 注释对应的 AspectJ ITD 文件的名称遵循以下命名约定：<JPA-entity-name>Service_Roo_Service.aj，其中\
  \ <JPA-entity-name> 是 @RooFlexScaffold 注释的 entity 属性所指定的 JPA 实体的名称。\n\n从 Flex 客户端调用\
  \ Spring 管理的 remoting 目标方法可能需要发送和接收对象。例如，FlightDescriptionService 的 show 方法返回一个\
  \ FlightDescription 对象，而 create 方法接受一个 FlightDescription 对象。Flex 允许通过自动将 ActionScript\
  \ 对象转换为 Java 对象（反之亦然）来在 Flex 客户端和 remoting 目标方法之间交换数据。由于 flightapp_flex 应用程序中的 Flex\
  \ 客户端与 FlightDescriptionService remoting 目标交换航班描述详细信息，Roo 会生成与 FlightDescriptionService\
  \ 管理的 JPA 实体对应的 ActionScript 类。以下代码显示了与 FlightDescription JPA 实体对应的 Roo 生成的 FlightDescription.as\
  \ ActionScript 类：\n\n```\nFlightDescription.as\npackage sample.roo.flightapp.domain{\n\
  [RemoteClass(alias=\"sample.roo.flightapp.domain.FlightDescription\")]\npublic class\
  \ FlightDescription {\npublic var destination:String;\npublic var id:Number;\npublic\
  \ var origin:String;\npublic var price:Number;\npublic var version:Number;\n}\n\
  }\n```\n\n此代码显示，FlightDescription.as ActionScript 类定义的属性与相应的 FlightDescription JPA\
  \ 实体相同。[RemoteClass] 元数据标签指定 ActionScript 对象映射到的远程 Java 对象。alias 属性指定 ActionScript\
  \ 对象映射到的远程 Java 对象的完全限定类名。\n\nRoo 为每个 JPA 实体创建 ActionScript 和 MXML 文件，以便可以从脚手架 Flex\
  \ 用户界面对 JPA 实体执行 CRUD 操作。下表描述了这些 Roo 生成的文件（位于 ROOT\\src\\main\\flex\\sample\\roo\\\
  flightapp\\presentation\\flightdescription 和 ROOT\\src\\main\\flex\\sample\\roo\\\
  flightapp\\presentation\\flight 目录中）：\n\n| 文件 | 描述 |\n| :--- | :--- |\n| `<JPA-entity-name>Event.as`\
  \ | `flash.events.Event` 的子类，用于定义不同的事件类型，例如当 JPA 实体被创建、编辑或修改时生成的创建、编辑和删除事件。在 `flightapp_flex`\
  \ 项目中，`FlightEvent.as` 和 `FlightDescriptionEvent.as` 表示事件类。 |\n| `<JPA-entity-name>View.mxml`\
  \ | 显示实体实例列表以及创建、编辑和删除实体实例选项的 MXML 文件。在 `flightapp_flex` 项目中，`FlightView.mxml` 和\
  \ `FlightDescriptionView.mxml` MXML 文件分别显示 Flight 和 FlightDescription 实体实例列表，以及创建、编辑和删除实体实例的选项。\
  \ |\n| `<JPA-entity-name>Form.mxml` | 显示创建实体实例表单的 MXML 文件。在 `flightapp_flex` 项目中，`FlightForm.mxml`\
  \ 和 `FlightDescriptionForm.mxml` 文件分别显示创建 Flight 和 FlightDescription JPA 实体实例的表单。\
  \ |\n\n以下代码显示了 Roo 创建的 `FlightDescriptionEvent.as` ActionScript 类：\n\n```\npackage\
  \ sample.roo.flightapp.presentation.flightdescription\n{\n    import flash.events.Event;\n\
  \    import sample.roo.flightapp.domain.FlightDescription;\n    public class FlightDescriptionEvent\
  \ extends Event {\n    public static const CREATE:String =\n    \"flightDescriptionCreate\"\
  ;\n    public static const UPDATE:String =\n    \"flightDescriptionUpdate\";\n \
  \   public static const DELETE:String =\n    \"flightDescriptionDelete\";\n    public\
  \ var flightDescription:FlightDescription;\n    public function FlightDescriptionEvent(type:String,\n\
  \    flightDescription:FlightDescription,\n    bubbles:Boolean = true, cancelable:Boolean\
  \ = false) {\n    this.flightDescription = flightDescription;\n    super(type, bubbles,\
  \ cancelable);\n    }\n    }\n}\n```\n\nFlightDescriptionEvent 类是 flash.events.Event\
  \ 类的子类，并定义了三种不同的事件类型：flightDescriptionCreate、flightDescriptionUpdate 和 flightDescriptionDelete。FlightDescription\
  \ ActionScript 对象（对应于服务器端的 FlightDescription JPA 实体）表示 FlightDescriptionEvent 事件类型所携带的有效载荷。\n\
  \n如前所述，在 flightapp_flex 应用程序中，flightapp_flex_scaffold.mxml 文件定义了应用程序的初始用户界面。执行 flex\
  \ remoting all 命令时，我们在输出中看到了 flightapp_flex_scaffold.mxml 文件已更新。以下代码显示了 Roo 对 flightapp_flex_scaffold.mxml\
  \ 文件所做的修改：\n\n```\nflightapp_flex_scaffold.mxml\n...\n<fx:Declarations>\n  <s:ArrayList\
  \ id=\"entities\">\n    <fx:String>FlightDescription</fx:String>\n    <fx:String>Flight</fx:String>\n\
  \  </s:ArrayList>\n</fx:Declarations>\n...\n</fx:Declarations>\n...\n<s:Panel id=\"\
  entityPanel\" title=\"Entity List\" height=\"100%\">\n  <s:List id=\"entityList\"\
  \ dataProvider=\"{entities}\"\n    width=\"100%\" height=\"100%\"\n    toolTip=\"\
  Double-Click the selected Entity\"\n    doubleClickEnabled=\"true\"\n    doubleClick=\"\
  entityList_doubleClickHandler(event)\" />\n</s:Panel>\n</s:Group>\n```\n\n如果将此代码与我们在之前教程中看到的\
  \ flightapp_flex_scaffold.mxml 文件代码进行比较，您会发现唯一的变化是向 <ArrayList> 添加了 <fx:String>\
  \ 元素。Roo 为应用程序中的每个 JPA 实体创建一个 <fx:String> 元素。默认情况下，<fx:String> 元素的值是相应 JPA 实体的简单名称。由于\
  \ <List> 组件使用 <ArrayList> 作为其数据提供程序，<List> 组件现在在用户界面中显示 Flight 和 FlightDescription\
  \ 列表项，如下所示：\n\n| 实体列表 | |\n| --- | |\n| FlightDescription | |\n| Flight | |\n\n\
  此屏幕截图显示，Roo 并未为 FlightDescription JPA 实体中定义的查找器方法 findFlightDescriptionsByDestinationAndOrigin\
  \ 生成对应的列表项。\n\n当您双击上面列表中的某一项时，将调用 `flightapp_flex_scaffold.mxml` 文件中定义的 `entityList_doubleClickHandler`\
  \ ActionScript 方法，该方法会显示由 `FlightDescriptionView.mxml` 或 `FlightView.mxml` 生成的用户界面，具体取决于双击的列表项。以下代码显示了\
  \ `entityList_doubleClickHandler` 方法：\n\n```\nprotected function\nentityList_doubleClickHandler(event:MouseEvent):void\
  \ {\n..\nvar selectedEntity:String = entityList.selectedItem;\nvar selectedEntityPackage:String\
  \ =\nselectedEntity.toLowerCase();\n\nvar viewClass:Class =\ngetDefinitionByName(\"\
  sample.roo.flightapp.presentation.\"\n+ selectedEntityPackage+\"::\"+selectedEntity+\"\
  View\")\nas Class;\nif (viewClass != null) {\nvar newView:UIComponent = UIComponent(new\
  \ viewClass());\n...\nmainGroup.addElement(newView);\n}\n...\n}\n```\n\n由于 MXML\
  \ 文件被编译为 ActionScript 类，`FlightDescriptionView.mxml` 和 `FlightView.mxml` 文件分别转换为\
  \ `FlightDescriptionView` 和 `FlightView` ActionScript 类。`entityList_doubleClickHandler`\
  \ 方法从列表中获取所选项的值（即 **航班描述** 或 **航班**），并向其追加 'View' 字符串——使连接后的值变为 `FlightDescriptionView`\
  \ 或 `FlightView`。然后，`entityList_doubleClickHandler` 创建 `FlightDescriptionView` 或\
  \ `FlightView` 的实例，并将其添加到主用户界面中。\n\n以下序列图总结了 entityList_doubleClickHandler 方法所起的作用：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_282_0.png)\n\n需要注意的是，flightapp_flex_scaffold.mxml\
  \ 文件的 entityList_doubleClickHandler 方法从不直接引用 FlightView 或 FlightDescriptionView\
  \ ActionScript 类。实际上，flightapp_flex 项目中的任何其他 MXML 或 ActionScript 类都不引用 FlightView\
  \ 和 FlightDescriptionView 类。这的副作用是，Flex 编译器不会将 FlightDescriptionView 和 FlightView\
  \ 包含在生成的 SWF 文件中。为了指示 Flex 编译器包含 FlightDescriptionView 和 FlightView ActionScript\
  \ 类，Roo 将它们的完全限定名称添加到 flightapp_flex_scaffold-config.xml 文件中，如下所示：\n\n```\nflightapp_flex_scaffold-config.xml\n\
  <flex-config xmlns=\"http://www.adobe.com/2006/flex-config\">\n<includes append=\"\
  true\">\n<symbol>sample.roo.flightapp.presentation.flightdescription.FlightDescriptionView</symbol>\n\
  <symbol>\nsample.roo.flightapp.presentation.flight.FlightView\n</symbol>\n</includes>\n\
  </flex-config>\n```\n\n<symbol> 元素指定了 Flex 编译器应在生成的 SWF 文件中包含的 ActionScript 类。\n\
  \n\n\n\nFlightDescriptionView.mxml 显示一个 **新建 FlightDescription** 按钮，如果单击它，将调用 showForm\
  \ 方法。FlightDescriptionView.mxml 的 showForm 方法显示用于创建 FlightDescription 实体实例的表单（由\
  \ FlightDescriptionForm.mxml 表示），如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_283_0.png)\n\
  \n下面的序列图显示单击新建 FlightDescription 按钮时幕后发生了什么：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_283_1.png)\n\
  \n该序列图显示 showForm 方法创建 FlightDescriptionForm 和 FlightDescription 对象。FlightDescription\
  \ 对象（对应 FlightDescription JPA 实体）充当 Web 应用程序中常见的表单支撑对象。showForm 方法将 FlightDescription\
  \ 对象设置到 FlightDescriptionForm 实例中。另外，showForm 向 FlightDescriptionForm 添加了 FlightDescriptionEvent.CREATE\
  \ 事件的事件侦听器。\n\n下面的代码显示了 showForm 方法：\n\n```\nprivate function showForm\n(flightDescription:FlightDescription\
  \ = null):void {\nvar form:FlightDescriptionForm =\nPopUpManager.createPopUp(this,\
  \ FlightDescriptionForm, true)\nas FlightDescriptionForm;\nform.flightDescription\
  \ = flightDescription != null ?\nflightDescription : new FlightDescription();\n\n\
  form.addEventListener(FlightDescriptionEvent.CREATE,\nflightDescriptionView_flightDescriptionCreateEventHandler);\n\
  }\n```\n\n这段代码表明，addEventListener 方法接受 FlightDescriptionForm 对象监听的事件类型，即 FlightDescriptionEvent.CREATE。addEventListener\
  \ 还接受当 FlightDescriptionForm 对象接收到事件时要调用的处理程序方法的名称。因此，如果 FlightDescriptionForm 对象接收到\
  \ FlightDescriptionEvent.CREATE 事件，将导致调用 flightDescriptionView_flightDescriptionCreateEventHandler\
  \ 方法。我们稍后会回到处理程序方法，但首先来看看 FlightDescriptionEvent.CREATE 事件是如何生成的。\n\n下面的序列图显示，当用户按下\
  \ Save 按钮以创建 FlightDescription JPA 实体实例时，会生成 FlightDescriptionEvent.CREATE 事件：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_284_0.png)\n\n该序列图显示，单击 **Save** 按钮会导致调用\
  \ FlightDescriptionForm.mxml 中定义的 processSave 方法。processSave 方法使用 mx.validators.Validator\
  \ 验证用户输入的表单数据。如果数据验证成功，则将表单数据设置到 FlightDescription ActionScript 对象中。processSave\
  \ 方法现在会创建一个类型为 FlightDescriptionEvent.CREATE 的 FlightDescriptionEvent 事件，并将 FlightDescription\
  \ ActionScript 对象作为事件的有效载荷传递。调用 dispatchEvent 方法会将新创建的事件分发给侦听器。\n\n因此，接收到 FlightDescriptionEvent.CREATE\
  \ 事件后，将调用 flightDescriptionView_flightDescriptionCreateEventHandler，如前所述。下面的代码显示了\
  \ flightDescriptionView_flightDescriptionCreateEventHandler 方法，它调用 FlightDescriptionService\
  \ 的 create 方法来创建 FlightDescription JPA 实体的实例：\n\n```\nprotected function\nflightDescriptionView_flightDescriptionCreateEventHandler\n\
  (event:FlightDescriptionEvent):void {\n    flightDescriptionService.create(event.flightDescription);\n\
  }\n...\n```\n\n前面代码中的 flightDescriptionService 对象代表一个 mx.rpc.remoting.RemoteObject，Flex\
  \ 客户端使用它来访问远程处理目标。RemoteObject 使用 <RemoteObject> 标签在 FlightDescriptionView.mxml\
  \ 中定义，如下所示：\n\n```\n<s:RemoteObject channelSet=\"{remotingChannels}\"\n    destination=\"\
  flightDescriptionService\"\n    fault=\"flightDescriptionService_faultHandler(event)\"\
  \n    id=\"flightDescriptionService\">\n...\n</s:RemoteObject>\n```\n\n在这段代码中，{remotingChannels}\
  \ 标识用于与服务器端 Java 对象通信所使用的 ChannelSet。我们在前面的示例中看到，flightapp_flex 应用程序使用的远程处理通道是在\
  \ flightapp_flex_scaffold.mxml 文件中使用 <ChannelSet> 标签定义的。destination 属性指定通过 RemoteObject\
  \ 访问的远程处理目标。\n\n### 更多内容...\n\nFlex 插件提供往返支持，即，对 JPA 实体的修改会传播到 MXML 和 ActionScript\
  \ 文件中。\n\nFlex 插件不提供用于控制构成 Spring 管理的远程处理目标一部分的方法的任何支持。例如，你无法使用 `@RooFlexScaffold`\
  \ 注解来控制属于 `FlightDescriptionService_Roo_Service.aj` 文件的方法。\n\n如果你希望 Spring 管理的远程处理目标中的某个方法对\
  \ Flex 客户端不可访问，则只需执行 push-in 重构，或者在相应的 Java 类中定义该方法并向其添加 Spring 的 `@RemotingExclude`\
  \ 注解即可。\n\nSpring Roo 使用 JPA 实体中指定的 JSR 303 注解来在 MXML 文件中添加 Flex 验证器。例如，如果 JPA 实体字段指定了\
  \ `@NotNull` JSR 303 注解，则 Roo 会添加一个 Flex `StringValidator` 或 `NumberValidator`，用于检查表单中的字段不为空白。请注意，Flex\
  \ 插件对 JSR 303 注解的支持有限。\n\n### 另请参阅\n\n- 请参阅“Flex 应用程序开发入门”，了解如何为 Roo 项目设置 Flex\n\
  \n## Spring Web Flow 入门\n\n在第 4 章，*使用 Spring Web MVC 进行 Web 应用程序开发* 中，我们了解到 Roo\
  \ 简化了 Spring Web MVC 应用程序的构建。在本示例中，我们将了解 Roo 如何设置 Roo 项目以使用 Spring Web Flow——这是一个构建在\
  \ Spring Web MVC 之上的框架。\n\nSpring Web Flow 允许将 Web 应用程序建模为一组流，其中每个流表示一个有限状态机。\n\n\
  > Spring Roo 1.1.3 中对 Spring Web Flow 的支持已损坏；因此，必须使用 Spring Roo 1.1.4 或 1.1.5 来执行本示例。本示例使用\
  \ Spring Roo 1.1.5 开发。\n\n### 准备工作\n\n在系统中创建新目录 `C:\\roo-cookbook\\ch05-webflow`，并将随本书附带的\
  \ `ch05_webflow_app.roo` 脚本复制到 `ch05-webflow` 目录中。\n\n从 ch05-webflow 目录启动 Roo shell，并使用\
  \ script 命令执行 ch05_webflow_app.roo 脚本。执行 ch05_webflow_app.roo 脚本会创建 flightapp-webflow\
  \ Eclipse 项目，将 Hibernate 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，并创建 Flight、FlightDescription、Customer\
  \ 和 Address JPA 实体。Customer 实体与 Address 实体具有一对一关系，Flight 实体与 FlightDescription 实体具有多对一关系。如果使用的数据库不是\
  \ MySQL，或者连接设置与脚本中指定的不同，则相应地修改脚本。\n\n### 操作步骤\n\n1. 执行 Web 流 Roo 命令以创建 Customer\
  \ 流，如下所示：\n\n```\nroo> web flow --flowName customer\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\\
  spring\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\spring\\webflow-config.xml\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\spring\\webmvc-config.xml\n...\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\views\\\
  customer\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\views\\customer\\flow.xml\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\views\\customer\\view-state-1.jspx\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\\
  views\\customer\\view-state-2.jspx\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\views\\customer\\\
  end-state.jspx\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\views\\menu.jspx\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\views\\customer\\views.xml\n...\nUpdated ROOT\\pom.xml [...; added dependency\
  \ org.springframework.webflow:spring-webflow:2.2.1.RELEASE]\n```\n\n2. 执行 perform\
  \ eclipse 命令以更新项目的类路径设置：\n\n```\nroo> perform eclipse\n```\n\n3. 现在可以将 flightapp_webflow\
  \ 项目导入 Eclipse IDE 中。\n\n4. 退出 Roo shell，并从 ch05-webflow 目录执行 Tomcat Maven 插件的 tomcat:run\
  \ 目标，将 flightapp_webflow 项目部署到嵌入式 Tomcat 容器中：\n\n```\nC:\\roo-cookbook\\ch05-webflow>\
  \ mvn tomcat:run\n```\n\n\n\n\n\n- 在您喜欢的浏览器中打开 http://localhost:8080/flightapp_webflow\
  \ URL。如果看到以下页面，则表示您的应用程序已成功部署在嵌入式 Tomcat 容器中：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_288_0.png)\n\
  \n- 单击“Enter Customer flow”菜单选项以启动由 web flow 命令安装的示例流程。此屏幕截图显示启动 Customer 流程时流程中的第一步：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_288_1.png)\n\n- CANCEL 按钮结束 Customer\
  \ 流程，PROCEED 按钮将带您进入流程的下一步。\n\n## 工作原理\n\nSpring Web Flow 允许将 Web 应用程序创建为一组流程，其中每个流程定义一系列状态、转换和操作。由\
  \ Spring Web Flow 插件处理的 web flow 命令，会创建使用 Spring Web Flow 快速开发 Web 应用程序所需的构件。flowName\
  \ 是一个可选参数，用于指定要创建的流程的名称。如果未指定 flowName 参数，Roo 将创建一个示例流程。\n\n第一次执行 web flow 命令时，它主要会创建您在第\
  \ 4 章“使用 Spring Web MVC 进行 Web 应用程序开发”中已经见过的文件和目录。在本示例中，我们将重点介绍 Roo 专门为使用 Spring\
  \ Web Flow 开发应用程序而创建的文件和目录。需要注意的是，web flow 命令只会创建一个示例流程，它为您创建自定义流程提供了起点。\n\n从 web\
  \ flow 命令的输出可以看出，Roo 不仅创建了 webmvc-config.xml 文件（在执行 web mvc install 命令时也会创建该文件），还创建了\
  \ webflow-config.xml 文件。webflow-config.xml 文件是应用程序上下文 XML 文件，用于定义特定于 Spring Web\
  \ Flow 的特殊 Bean，例如 FlowHandlerMapping、FlowHandlerAdapter 等等。webmvc-config.xml Web\
  \ 应用程序上下文 XML 定义了我们在第 4 章“使用 Spring Web MVC 进行 Web 应用程序开发”中讨论过的 Bean。此外，它现在使用 Spring\
  \ Beans 模式的 <import> 元素导入了 webflow-config.xml 中的 Bean 定义，如下所示：\n\n```\n<import resource=\"\
  webflow-config.xml\" />\n```\n\nRoo 使用 flowName 参数的值在 /WEB-INF/views 文件夹中创建同名目录，其中包含与流程相关的构件。默认情况下，Roo\
  \ 只会创建一个示例流程，以让您开始创建自己的流程。下表描述了在执行 web flow --flowName customer 命令时，在 /WEB-INF/views/customer\
  \ 目录中创建的与流程相关的构件：\n\n| 文件名 | 描述 |\n|---|---|\n| flow.xml | 定义流程状态、转换和操作的 XML 文件\
  \ |\n| view-state-1.jspx | 对应 Customer 流程第一个视图状态的 JSPX 文件 |\n| view-state-2.jspx\
  \ | 对应 Customer 流程第二个视图状态的 JSPX 文件 |\n| end-state.jspx | 对应 Customer 流程结束视图状态的 JSPX\
  \ 文件 |\n| views.xml | Tiles 配置 XML 文件，其中包含用于在 Customer 流程中显示 JSPX 页面的 Tiles 定义 |\n\
  \n让我们先来看看如何在流程定义 XML 文件中定义流程。下面的清单显示了在 WEB-INF/views/customer 文件夹中创建的 flow.xml 文件：\n\
  \n```\nflow.xml\n<flow xmlns=\"http://www.springframework.org/schema/webflow\" ..>\n\
  \n<view-state id=\"view-state-1\" view=\"customer/view-state-1\">\n    <transition\
  \ on=\"success\" to=\"view-state-2\"/>\n    <transition on=\"cancel\" to=\"end-state\"\
  />\n</view-state>\n\n<view-state id=\"view-state-2\" view=\"customer/view-state-2\"\
  >\n    <transition on=\"cancel\" to=\"end-state\"/>\n</view-state>\n\n<end-state\
  \ id=\"end-state\" view=\"customer/end-state\"/>\n\n</flow>\n```\n\n正如该代码所示，每个流程定义\
  \ XML 文件都以 <flow> 根元素开始。<view-state> 元素定义一个视图状态，即渲染视图的状态。<view-state> 元素的 id 属性在流程定义\
  \ XML 文件中唯一标识该状态。由于流程定义 XML 文件中定义的第一个状态是流程的起始状态，因此 view-state-1 表示 Customer 流程的起始状态。<view-state>\
  \ 元素的 view 属性指定应呈现给用户的视图。由于 Roo 生成的 Spring Web Flow 应用程序使用 Apache Tiles 2 框架，view\
  \ 属性的值表示视图的逻辑名称。与 view 属性值对应的实际视图是根据 WEB-INF/views/customer/views.xml 文件中包含的 Tiles\
  \ 定义来确定的。<end-state> 元素定义流程的结束状态。view 属性定义在达到流程结束状态时呈现的视图的逻辑名称。一个流程可以定义多个结束状态，在某些情况下，结束状态可能不呈现视图。\n\
  \n<transition> 元素指定在发生事件时流程将转换到的状态。on 属性指定触发转换的事件，to 属性指定流程转换到的状态。例如，如果 Customer\
  \ 流程处于 view-state-1 状态且接收到 success 事件，则流程将转换到 view-state-2 状态；如果接收到 cancel 事件，则流程将转换到\
  \ end-state。如您所见，状态转换会导致 Spring Web Flow 应用程序中从一个页面导航到另一个页面。\n\n现在让我们来看看 Roo 为 flightapp_webflow\
  \ 项目生成的 webflow-config.xml 文件中定义的 Bean。\n\n### Spring Web Flow 配置\n\nwebflow-config.xml\
  \ 定义了一个 HandlerMapping，它返回一个 FlowHandler 以启动流程的执行，如下所示：\n\n```xml\n<bean class=\"\
  org.springframework.webflow.mvc.servlet.FlowHandlerMapping\">\n  <property name=\"\
  order\" value=\"0\" />\n  <property name=\"flowRegistry\" ref=\"flowRegistry\" />\n\
  </bean>\n```\n\norder 属性指定相对于 Web 应用程序上下文中配置的其他 HandlerMapping 实现所分配给 FlowHandlerMapping\
  \ 的优先级。该值可以是 Integer.MIN_VALUE 到 Integer.MAX_VALUE 之间的任何值。order 属性的值越低，HandlerMapping\
  \ 实现的优先级越高。因此，如果 Web 应用程序上下文中配置的 HandlerMapping 实现指定的 order 属性值大于 0，则其优先级低于 FlowHandlerMapping。当\
  \ DispatcherServlet 尝试查找用于处理请求的处理程序时，HandlerMapping 实现的优先级才会发挥作用。\n\n> 优先级最高（即 order\
  \ 值最低）的 HandlerMapping 配置首先由 DispatcherServlet 查询，以查找匹配的处理程序；未指定 order 属性的 HandlerMapping\
  \ 配置被赋予最低优先级。\n\nFlowHandlerMapping 的 flowRegistry 属性指定一个 FlowDefinitionRegistry，其中包含应用程序中所有流程定义的注册表。Spring\
  \ Web Flow 模式中的以下 <flow-registry> 元素定义了一个流程注册表：\n\n```xml\n<webflow:flow-registry\
  \ id=\"flowRegistry\"\n  flow-builder-services=\"flowBuilderServices\"\n  base-path=\"\
  /WEB-INF/views\">\n  <webflow:flow-location-pattern value=\"/**/flow.xml\" />\n\
  </webflow:flow-registry>\n```\n\nbase-path 属性指定定位流程定义 XML 文件所基于的位置。base-path 属性的值\
  \ /WEB-INF/views 表示流程定义 XML 文件位于 /WEB-INF/views 文件夹的相对位置。<flow-location-pattern>\
  \ 指定用于查找流程定义 XML 文件的位置模式，相对于 base-path。值 /**/flow.xml 表示 /WEB-INF/views 文件夹或其子文件夹中的\
  \ flow.xml 文件代表流程定义 XML 文件。\n\n流程会使用唯一 ID 注册到流程注册表中，该唯一 ID 由流程定义 XML 文件的名称（如果未指定\
  \ base-path 属性）或流程定义 XML 文件相对于 base-path 属性值的位置来确定。由于 Roo 生成的 webflow-config.xml\
  \ 文件使用了 base-path 属性，因此分配给流程的唯一 ID 由流程定义 XML 文件相对于 base-path 属性值的位置来确定。例如，flightapp-webflow\
  \ 项目中的 Customer 流程定义 XML 文件位于 /WEB-INF/views/customer 文件夹（相对于 base-path），而 base-path\
  \ 属性为 /WEB-INF/views。如果从流程定义 XML 位置 (/WEB-INF/views/customer) 减去 base-path 值 (/WEB-INF/views)，则会返回该流程在流程注册表中注册的唯一\
  \ ID——对于 Customer 流程而言，该 ID 为 customer。\n\n当 FlowHandlerMapping（通过 DispatcherServlet）接收到请求时，它会检查流程注册表是否包含与当前请求路径匹配的唯一\
  \ ID 的流程。如果找到匹配项，则它会返回一个启动匹配流程执行的 FlowHandler，否则返回 null。当返回 null 时，DispatcherServlet\
  \ 会查询 Web 应用程序上下文中的下一个 HandlerMapping，以查找用于处理请求的处理程序。\n\n<flow-registry> 元素的 flow-builder-services\
  \ 属性指定 FlowBuilderServices 的一个实现，该实现用于配置构建在流程注册表中注册的流程所需的自定义服务。例如，如果您想要配置自定义 ConversionService\
  \ 或 ViewFactoryCreator，可以将 FlowBuilderServices 实例的引用指定为 flow-builder-services 属性值的值。由于\
  \ Roo 生成的 Spring Web Flow 应用程序使用 Apache Tiles 2 框架，FlowBuilderServices 已配置了一个 ViewFactoryCreator，该\
  \ ViewFactoryCreator 将 URL 映射到 TilesView（在第 4 章“使用 Spring Web MVC 进行 Web 应用程序开发”中有详细说明），如下所示：\n\
  \n```\n<bean id=\"mvcViewFactoryCreator\" class=\"org.springframework.webflow.mvc.builder.MvcViewFactoryCreator\"\
  >\n<property name=\"viewResolvers\" ref=\"tilesViewResolver\" />\n</bean>\n```\n\
  \nMvcViewFactoryCreator 是 ViewFactoryCreator 的一个实现，用于创建 ViewFactory 来呈现基于 Spring\
  \ Web MVC 的视图，例如 JSP。MvcViewFactoryCreator 的 viewResolvers 属性指定视图解析策略。tilesViewResolver（在\
  \ webmvc-config.xml 文件中定义）代表一个 UrlBasedViewResolver，用于解析与 URL 对应的视图名称。由于 Roo 生成的\
  \ Spring Web Flow 应用程序使用 Apache Tiles 2 框架，UrlBasedViewResolver 将 URL 解析为 TilesView，如下所示：\n\
  \n```\n<bean class=\"org.springframework.web.servlet.view.UrlBasedViewResolver\"\
  \nid=\"tilesViewResolver\">\n<property name=\"viewClass\" value=\"org.springframework.web.servlet.view.tiles2.TilesView\"\
  />\n</bean>\n\n\n\n\n\n请参阅第 4 章，Spring Web MVC Web 应用程序开发，以获取有关 UrlBasedViewResolver\
  \ 的更多信息。\n\n让我们现在退后一步，看看请求是如何映射到流的，以及视图是如何根据客户流的视图状态解析的。如果你查看 menu.jspx 文件，你会发现菜单选项\
  \ **进入客户流** 引用 /customer URL，如下所示：\n\n```\n<menu:item id=\"i_flows_customer\" messageCode=\"\
  webflow_menu_enter\"\nurl=\"/customer\" z=\".\"/>\n```\n\n因此，当你单击 **进入客户流** 菜单选项时，FlowHandlerMapping\
  \ 会尝试查找唯一 ID 为 `customer` 的流（从请求路径中删除前导 '/' 即可得到要查找的流 ID）。由于我们的客户流具有 `customer`\
  \ 唯一 ID，FlowHandlerMapping 将返回一个 FlowHandler 实例，该实例启动客户流的执行。由于客户流的 flow.xml 中的第一个\
  \ `<view-state>` 元素定义了客户流的起始状态，因此将渲染与第一个 `<view-state>` 元素对应的视图。第一个 `<view-state>`\
  \ 元素的 `view` 属性为 `customer/view-state-1`，它表示一个逻辑视图名称。由于 Roo 生成的 Spring Web Flow\
  \ 应用程序使用 Apache Tiles 2 框架，应用程序中的 Tiles 配置 XML 文件（包括 /WEB-INF/views/customer/views.xml\
  \ Tiles 配置 XML 文件）将被查询，以找到与逻辑视图名称 `customer/view-state-1` 对应的 Tiles 定义。以下代码清单显示了\
  \ /WEB-INF/views/customer/views.xml 文件：\n\n```\n<tiles-definitions>\n<definition\
  \ extends=\"default\" name=\"customer/*\">\n<put-attribute name=\"body\"\nvalue=\"\
  /WEB-INF/views/customer/{1}.jspx\"/>\n</definition>\n</tiles-definitions>\n```\n\
  \n`<definition>` 元素的 `name` 属性值为 `customer/*`，与逻辑视图名称 `customer/view-state-1` 匹配。因此，我们现在知道适用于客户流第一个\
  \ `<view-state>` 元素的 Tiles 定义。另一个值得注意的地方是 `<put-attribute>` 元素值中使用了标记 `{1}`。标记 `{1}`\
  \ 指的是在逻辑视图名称中 `customer/` 字符串之后出现的第一个值——对于客户流的第一个 `<view-state>` 元素，该值为 `view-state-1`。同样，如果逻辑视图名称为\
  \ `customer/x/y/z`，则标记 `{1}` 的值为 x，标记 `{2}` 的值为 y，`{3}` 的值为 z。这使得为客户流第一个 `<view-state>`\
  \ 元素渲染的视图为 /WEB-INF/views/customer/view-state-1.jspx。\n\n现在，回到 webflow-config.xml，流由\
  \ FlowHandler 启动并由 FlowExecutor 执行，并配置了以下 FlowHandlerAdapter 实现：\n\n```\n<bean class=\"\
  org.springframework.webflow.mvc.servlet.FlowHandlerAdapter\">\n<property name=\"\
  flowExecutor\" ref=\"flowExecutor\" />\n</bean>\n<webflow:flow-executor id=\"flowExecutor\"\
  \ />\n```\n\nSpring webflow 架构的 `<flow-executor>` 元素安装了一个 FlowExecutor，FlowHandler\
  \ 实现使用它来执行流。如果需要，可以通过扩展 AbstractFlowHandler 类来创建自定义 FlowHandler 实现。\n\n## 使用 Spring\
  \ Web MVC 和 Spring Web Flow 开发应用程序\n\n你还会发现 webflow-config.xml 文件中配置了以下 bean：\n\n\
  ```\n<bean class=\"org.springframework.web.servlet.mvc.annotation.AnnotationMethodHandlerAdapter\"\
  \ />\n<bean class=\"org.springframework.web.servlet.mvc.SimpleControllerHandlerAdapter\"\
  \ />\n```\n\n当在 Spring Web MVC 中使用带有 @Controller 注解的控制器时，使用 AnnotationMethodHandlerAdapter；当使用实现\
  \ Spring Web MVC Controller 接口的控制器时，使用 SimpleControllerHandlerAdapter。\n\n你可能会问，当我们使用\
  \ Spring Web Flow 而不是 Spring Web MVC 时，为什么要配置这些 HandlerAdapter 实现。嗯，Spring Web Flow\
  \ 通常与 Spring Web MVC 一起使用，因为你的 Web 应用程序中的并非所有内容都代表一个流。例如，在航班预订应用程序中，Booking 可能代表跨一系列步骤的流程，但创建\
  \ Flight 实体可能不是。这就是为什么执行 Web 流命令不仅能够使用 Spring Web Flow 进行开发，还能够使用 Spring Web MVC\
  \ 进行开发的原因。如果你查看 webmvc-config.xml 文件，它定义了 Spring mvc 架构的 <annotation-driven> 元素，如下所示：\n\
  \n```\n<mvc:annotation-driven/>\n```\n\n<annotation-driven> 元素配置了 AnnotationMethodHandlerAdapter\
  \ 和 DefaultAnnotationHandlerMapping bean，以支持使用带注解的控制器开发 Spring Web MVC 应用程序。由于 webflow-config.xml\
  \ 显式定义了 FlowHandlerAdapter，它覆盖了由 <annotation-driven> 隐式配置的 AnnotationMethodHandlerAdapter\
  \ bean。这就是 Roo 在 webflow-config.xml 文件中显式配置 AnnotationMethodHandlerAdapter bean\
  \ 的原因。\n\n要了解 Spring Web Flow 和 Spring Web MVC 如何在同一应用程序中共存，请在 flightapp_webflow\
  \ 项目中为 Flight 和 FlightDescription JPA 实体脚手架 Spring Web MVC 控制器，如下所示：\n\n```\n..\
  \ roo> controller scaffold --class ~.controller.FlightController --entity ~.domain.Flight\n\
  ```\n\n```\n.. roo> controller scaffold --class ~.controller.FlightDescriptionController\
  \ --entity ~.domain.FlightDescription\n```\n\n执行 controller scaffold Roo 命令将在 com.sample.flightapp.controller\
  \ 包中生成 Spring Web MVC 带注解的控制器。此外，它还将分别在 /WEB-INF/views/flights 和 /WEB-INF/views/flightdescriptions\
  \ 文件夹中生成与 Flight 和 FlightDescription JPA 实体对应的 JSPX 视图和 Tiles 配置 XML 文件。现在，退出 Roo\
  \ shell 并将 flightapp_webflow 项目部署到嵌入式 Tomcat 容器中，如下所示：\n\n```\nC:\\roo-cookbook\\\
  ch05-webflow> mvn tomcat:run\n```\n\n在你喜欢的浏览器中打开 http://localhost:8080/flightapp_webflow\
  \ URL。如果你看到以下页面，则表示你的应用程序已成功部署到嵌入式 Tomcat 容器中：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_295_0.png)\n\
  \n如该屏幕截图所示，flightapp_webflow 应用程序既包含通过 Web 流命令创建的 Spring Web Flow 流，也包含通过控制器脚手架命令创建的\
  \ Spring Web MVC 控制器。\n\n## 更多内容...\n\nSpring Web Flow 提供支持，可将模型属性与视图状态关联，从而可以创建包含表单提交的流。例如，你可以修改客户流，使用户首先在客户表单中输入详细信息（该表单将表单字段值绑定到\
  \ `Customer` JPA 实体），然后输入地址详细信息（该表单将表单字段值绑定到 `Address` JPA 实体），最后同时将 `Customer`\
  \ 和 `Address` 实例持久化到数据库中。\n\n## 另请参阅\n\n- 请参阅第 4 章，Spring Web MVC Web 应用程序开发，中的“从\
  \ JPA 实体创建 Spring MVC 控制器和 JSPX 视图”配方，以查看 `webmvc-config.xml` 文件中定义的 bean 的描述。\n"
- "# 6 电子邮件、消息传递、Spring Security、Solr 和 GAE\n\n在本章中，我们将介绍：\n\n- 使用 JavaMail API 发送电子邮件\n\
  - 发送和接收 JMS 消息\n- 为你的应用程序配置 Spring Security\n- 将 Spring Security 与 Apache Directory\
  \ Server 配合使用\n- 在 GAE 上部署 GWT 应用程序\n- 在 GAE 上部署 Spring Web MVC 应用程序\n- 使用 Solr\
  \ 为你的领域模型添加搜索功能\n\n## 简介\n\n在本章中，我们将介绍支持通过 JavaMail API 发送电子邮件、发送和接收 JMS 消息、为应用程序配置\
  \ Spring Security、将 Spring 和 GWT 应用程序部署到 Google App Engine (GAE) 以及使用 Solr 搜索服务器为应用程序的领域模型添加搜索功能的\
  \ Roo 命令。\n\n## 使用 JavaMail API 发送电子邮件\n\nSpring 框架提供了 JavaMailSenderImpl、SimpleMailMessage\
  \ 等类，可简化通过 JavaMail API 发送电子邮件。在本配方中，我们将介绍有助于配置这些类的 Roo 命令。为了验证我们应用程序中的电子邮件功能是否正常工作，我们将通过\
  \ Gmail 发送一封电子邮件。\n\n### 准备工作\n\n在系统中创建新目录 C:\\roo-cookbook\\ch06-email。将 ch06_web_app.roo\
  \ 脚本复制到 ch06-email 目录。如果你使用的数据库不是 MySQL，或者你的连接设置与脚本中指定的不同，请相应地修改脚本。\n\n从 ch06-email\
  \ 目录启动 Roo shell 并使用 script 命令执行 ch06_web_app.roo 脚本。执行 Roo 脚本将创建一个 flightapp-web\
  \ Eclipse 项目，该项目代表由 Flight 和 FlightDescription JPA 实体组成的 Spring Web MVC 应用程序。\n\n\
  ### 操作步骤...\n\n为了简化电子邮件发送，请按照以下步骤操作：\n\n- 1. 执行电子邮件发送器设置命令，为你想要用来发送电子邮件的 Gmail 帐户提供用户名和密码参数值。在以下命令中，将\
  \ <username> 和 <password> 参数值替换为分别反映你的 Gmail 帐户用户名和密码的值。需要注意的是，你不需要将 @gmail.com\
  \ 指定为用户名的值，因为它是从 hostServer 参数派生的。如果你使用不同的邮件服务器来发送电子邮件，请相应地修改参数值。\n- ... roo> email\
  \ sender setup --hostServer smtp.gmail.com --port 587 --protocol SMTP --username\
  \ <username> --password <password>\n- Updated SRC_MAIN_RESOURCES\\META-INF\\spring\\\
  applicationContext.xml\n- Updated ROOT\\pom.xml [Added dependencies ... javax.mail:mail:1.4.1,\
  \ javax.activation:activation:1.1.1]\n- Created SRC_MAIN_RESOURCES\\META-INF\\spring\\\
  email.properties\n\n- 2. 执行电子邮件模板设置命令，以指定电子邮件消息的发件人和主题（将 <username> 替换为你的 Gmail\
  \ 帐户用户名），如下所示：\n\n\n... roo> email template setup --from <username>@gmail.com\n\
  --subject \"A new Flight instance has been created\"\n\n已更新 SRC_MAIN_RESOURCES\\\
  META-INF\\spring\\applicationContext.xml\n已更新 SRC_MAIN_RESOURCES\\META-INF\\spring\\\
  email.properties\n\n- 3. 使用 field email template 命令，将 Spring 的 MailSender 和 SimpleMailMessage\
  \ 字段以及 sendMessage 方法添加到 FlightController.java 中，如下所示：\n\n```\nroo> field email\
  \ template --class ~.web.FlightController\n```\n\n已更新 ..\\flightapp\\web\\FlightController.java\n\
  \n- 4. 执行 perform eclipse 命令以更新项目的类路径设置：\n\n```\nroo> perform eclipse\n```\n\n-\
  \ 5. 将 flightapp-web Eclipse 项目导入 Eclipse IDE。\n\n- 6. 打开 FlightController_Roo_Controller.aj\
  \ 文件，复制在 FlightController.java 中引入 create(...) 方法的声明，并将其粘贴到 FlightController.java\
  \ 文件中。\n\n> 如果您使用的是 Spring Roo 1.1.3，则需从 FlightController_Roo_Controller.aj 文件中删除\
  \ create 方法声明。之所以需要这样做，是因为 Spring Roo 1.1.3 中不会自动移除来自 FlightController_Roo_Controller.aj\
  \ 文件的 create 声明。\n\n当用户输入航班信息并提交创建新 Flight 实例的请求时，会调用 FlightController 类的 create\
  \ 方法。添加 create(...) 方法后，您的 FlightController.java 应如下所示：\n\n```java\n@RooWebScaffold(...)\n\
  @RequestMapping(\"/flights\")\n@Controller\npublic class FlightController {\n  \
  \  @Autowired\n    private transient MailSender mailTemplate;\n    @Autowired\n\
  \    private transient SimpleMailMessage simpleMailMessage;\n    @RequestMapping(method\
  \ = RequestMethod.POST)\n    public String create(@Valid Flight flight,\n    BindingResult\
  \ bindingResult, Model uiModel,\n    HttpServletRequest httpServletRequest) {\n\
  \    flight.persist();\n        return \"redirect:/flights/\" +\n              \
  \  encodeUrlPathSegment(flight.getFlightId().toString(),\n                httpServletRequest);\n\
  \    }\n\npublic void sendMessage(java.lang.String mailTo,\n        java.lang.String\
  \ message) {\n        ...\n    }\n}\n```\n\n在给定的代码中，create 方法已通过从 FlightController_Roo_Controller.aj\
  \ AspectJ ITD 文件复制而直接添加到 FlightController.java 中。在 ITD 中，create 方法声明如下：\n\n```\n\
  public String FlightController.create(...)\n```\n\n将该方法复制到 FlightController.java\
  \ 文件时，请确保从方法名中删除 FlightController。因此，FlightController.java 中的该方法变为：\n\n```\npublic\
  \ String create(...)\n```\n\n当您在 FlightController.java 中添加与 FlightController_Roo_Controller.aj\
  \ 具有相同签名的 create(...) 方法时，Roo 会从 FlightController_Roo_Controller.aj 中删除 create(...)\
  \ 方法。在 Eclipse IDE 中刷新 flightapp-web 项目，以便查看 Roo 所做的修改。\n\n- 7. 现在，通过在 flight.persist()\
  \ 方法调用后立即添加以下代码片段来修改 FlightController.java 中的 create(...) 方法：\n\n```\nsendMessage(\"\
  <username>@gmail.com\", \"A new instance of Flight entity with id \" + flight.getFlightId()\
  \ + \" has been created.\");\n```\n\n在此代码中，将 <username> 替换为您的 Gmail 账户用户名。\n\n-\
  \ 8. 退出 Roo shell，并在 ch06-email 目录中执行 Tomcat Maven 插件的 tomcat:run 目标，以在嵌入式 Tomcat\
  \ 容器中部署 flightapp-web 项目，如下所示：\n\n```\nC:\\roo-cookbook\\ch06-email> mvn tomcat:run\n\
  ```\n\n使用以下 URL 从 Web 浏览器访问 `flightapp-web` 应用程序：`http://localhost:8080/flightapp-web`。您现在应该看到\
  \ `flightapp-web` 应用程序的以下主页：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_301_0.png)\n\
  \n从菜单中选择 **创建新航班描述** 选项，该选项将显示创建新 `FlightDescription` 实体实例的表单。创建 `FlightDescription`\
  \ 实例后，选择 **创建新航班** 菜单选项以创建 `Flight` 实例。以下截图显示了创建 `Flight` 实例的表单：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_301_1.png)\n\
  \n输入 **出发日期**、**到达日期** 和 **航班描述** 信息，然后单击 **保存** 按钮。保存 `Flight` 实例将向您的 Gmail 账户发送一封电子邮件，主题为\
  \ **新的 Flight 实例已创建**，消息为 **ID 1 的 Flight 实体新实例已创建**。随着您创建更多 `Flight` 实例，每创建一个 `Flight`\
  \ 实例就会向您的 Gmail 账户发送一封电子邮件。\n\n## 工作原理...\n\nJavaMail API 提供了 Session、Transport、Authenticator\
  \ 等类，用于撰写、发送和读取电子邮件。如果您想直接使用 JavaMail API 发送电子邮件消息，则需要知道如何使用不同的 JavaMail API 类和接口。Spring\
  \ 框架通过提供一组类和接口来抽象 JavaMail API 的内部工作原理，从而简化了编写需要发送电子邮件功能的程序。此外，Spring 提供了一个异常层次结构，用于抽象在撰写、解析和发送电子邮件或与邮件服务器进行身份验证时抛出的异常。\n\
  \n以下图显示了提供电子邮件发送功能的 Spring 重要类和接口。您可以在 Spring 框架的 org.springframework.mail 和 org.springframework.mail.javamail\
  \ 包中找到这些类和接口。\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_302_0.png)\n\nMailSender\
  \ 接口是一个定义电子邮件发送功能的通用接口。如所示图，它定义了两个 send 方法，接受 Spring 的 SimpleMailMessage 和 SimpleMailMessage[]\
  \ 对象作为参数。\n\nJavaMailSender 接口扩展了 MailSender 接口，并定义了使用 JavaMail API 发送电子邮件特有的方法。JavaMailSender\
  \ 定义了诸如 createMimeMessage（用于创建 MimeMessage 实例，属于 JavaMail API 的一部分）、send（用于发送 MimeMessage）等方法。有关\
  \ Spring 定义的方法完整列表，请参阅 JavaMailSender 接口的 Spring API 文档。Spring 通过 JavaMailSenderImpl\
  \ 类提供了 JavaMailSender 接口的具体实现，您可以在应用程序中使用它来发送电子邮件。\n\n需要注意的是，MailSender 接口定义接受 SimpleMailMessage\
  \ 或 SimpleMailMessage[] 对象作为参数的 send 方法，而 JavaMailSender 接口定义接受 MimeMessage 或 MimeMessage[]\
  \ 对象作为参数的 send 方法。SimpleMailMessage 是 Spring 框架的一部分，用于创建由 from、to、电子邮件正文等组成的简单邮件消息。如果您想发送由附件、内联图像等组成的更精细的消息，则应使用\
  \ MimeMessage 来创建您的邮件消息。\n\n现在我们已对发送电子邮件时涉及的不同类和接口有了基本了解，让我们来看看在 flightapp-web 应用程序中用于设置电子邮件支持和发送电子邮件的各种\
  \ Spring Roo 命令。\n\n## 设置电子邮件发送支持\n\n电子邮件发送设置 Roo 命令通过在 Spring 应用程序上下文中配置 JavaMailSenderImpl\
  \ 来在 Roo 项目中设置电子邮件发送支持。执行电子邮件发送设置命令时，Roo 会执行以下操作：\n\n- 已更新 SRC_MAIN_RESOURCES\\\
  META-INF\\spring\\applicationContext.xml 文件，以将 JavaMailSenderImpl 配置为 Spring bean\n\
  - 创建了 SRC_MAIN_RESOURCES\\META-INF\\spring\\email.properties 文件，该文件包含用于设置 JavaMailSenderImpl\
  \ 实例的属性。email.properties 文件中定义的属性来自电子邮件发送设置命令指定的参数。\n- 已更新 pom.xml 文件，以反映对 JavaMail\
  \ 和 Java Activation Framework (JAF) JAR 文件的依赖。\n\n以下清单显示了 applicationContext.xml\
  \ 文件中的 JavaMailSenderImpl 配置：\n\n```xml\n<bean class=\"org.springframework.mail.javamail.JavaMailSenderImpl\"\
  \ id=\"mailSender\">\n<property name=\"host\" value=\"${email.host}\"/>\n<property\
  \ name=\"protocol\" value=\"${email.protocol}\"/>\n<property name=\"port\" value=\"\
  ${email.port}\"/>\n<property name=\"username\" value=\"${email.username}\"/>\n<property\
  \ name=\"password\" value=\"${email.password}\"/>\n<property name=\"javaMailProperties\"\
  >\n<props>\n<prop key=\"mail.smtp.auth\">true</prop>\n<prop key=\"mail.smtp.starttls.enable\"\
  >true</prop>\n</props>\n</property>\n</bean>\n```\n\n\n\n\n在给定的 XML 中，JavaMailSenderImpl\
  \ 被配置了诸如 host、protocol、port 等属性。这些属性的值来自 email.properties 文件。\n\n下面的清单显示了 email.properties\
  \ 文件：\n\n```\nemail.host=smtp.gmail.com\nemail.password=<password>\nemail.port=587\n\
  email.protocol=smtp\nemail.username=<username>\n```\n\n而不是 <username> 和 <password>，你将看到为电子邮件发送者设置命令指定的用户名和密码值。email.properties\
  \ 文件由 Spring 的 PropertyPlaceholderConfigurer 读取，以填充 JavaMailSender 配置中定义的占位符。applicationContext.xml\
  \ 文件使用 Spring 上下文的 <property-placeholder> 元素来配置 PropertyPlaceholderConfigurer，如下所示：\n\
  \n```\n<context:property-placeholder location=\"classpath*:META-INF/spring/*.properties\"\
  />\n```\n\nlocation 属性指定 PropertyPlaceholderConfigurer 将在项目的 META-INF/spring 目录中查找属性文件。\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_304_0.png)\n\n现在让我们看看如何设置 SimpleMailMessage\
  \ 实例：\n\n## 设置邮件消息\n\n电子邮件模板设置命令将 SimpleMailMessage 配置为 applicationContext.xml 文件中的\
  \ bean。电子邮件模板设置命令接受两个参数：from 和 subject，分别标识电子邮件的发件人和主题。当执行电子邮件发送者设置命令时，Roo 会执行以下操作：\n\
  \n- 将 SimpleMailMessage 配置为 applicationContext.xml 中的 Spring 托管 bean，如下所示：\n\n```\n\
  <bean class=\"org.springframework.mail.SimpleMailMessage\"\n  id=\"templateMessage\"\
  >\n  <property name=\"from\" value=\"${email.from}\" />\n  <property name=\"subject\"\
  \ value=\"${email.subject}\" />\n</bean>\n</beans>\n```\n\n${email.from} 和 ${email.subject}\
  \ 占位符的值来自 email.properties 文件。\n\n- 更新 email.properties 文件以包含 email.from 和 email.subject\
  \ 属性，它们的值来自传递给电子邮件模板设置命令的 from 和 subject 参数的值：\n- email.from=<username>@gmail.com\n\
  - email.subject=A new Flight instance has been created\n\n现在 JavaMailSenderImpl\
  \ 和 SimpleMailMessage 实例已在应用程序上下文 XML 文件中配置，我们将查看如何发送电子邮件。\n\n## 发送邮件\n\n要从企业应用程序发送电子邮件，您需要访问已在\
  \ Spring 应用程序上下文中注册的 JavaMailSenderImpl 和 SimpleMailMessage 实例。引用这些实例的属性会由 field\
  \ email template Roo 命令自动添加到类中。以下代码清单显示了在对其执行 field email template 命令后的 FlightController.java\
  \ 类：\n\n```\nimport org.springframework.mail.MailSender;\n...\npublic class FlightController\
  \ {\n    @Autowired\n    private transient MailSender mailTemplate;\n    @Autowired\n\
  \    private transient SimpleMailMessage simpleMailMessage;\n    public void sendMessage(java.lang.String\
  \ mailTo,\n    java.lang.String message) {\n    simpleMailMessage.setTo(mailTo);\n\
  \    simpleMailMessage.setText(message);\n    mailTemplate.send(simpleMailMessage);\n\
  \    }\n}\n```\n\n在给定的代码中，mailTemplate 属性引用 JavaMailSenderImpl 实例，simpleMailMessage\
  \ 属性引用已在 Spring 应用程序上下文中注册的 SimpleMailMessage 实例。需要注意的是，mailTemplate 属性的类型是 MailSender\
  \ 而不是 JavaMailSender。此外，还向 FlightController.java 添加了一个用于发送电子邮件的 sendMessage 方法。sendMessage\
  \ 方法接受用于标识电子邮件收件人地址和电子邮件文本内容或正文的参数。sendMessage 方法使用 MailSender 的 send(SimpleMailMessage)\
  \ 方法发送电子邮件。\n\n现在您可以从 FlightController.java 类的方法中调用 send 方法来发送电子邮件。在我们的示例场景中，在 Flight\
  \ 实例持久化后，我们从 create 方法中调用了 send 方法，如下所示：\n\n```\n@RequestMapping(method = RequestMethod.POST)\n\
  public String create(@Valid Flight flight,\nBindingResult bindingResult, Model uiModel,\n\
  HttpServletRequest httpServletRequest) {\n...\nflight.persist();\nsendMessage(\"\
  <username>@gmail.com\",\n\"A new instance of Flight entity with id \"\n+ flight.getFlightId()\n\
  + \"has been created.\");\nreturn \"redirect:/flights/\" +\nencodeUrlPathSegment((flight.getFlightId()).toString(),\n\
  httpServletRequest);\n}\n```\n\n## 更多内容...\n\n现在让我们看看如何异步发送电子邮件、如何发送包含附件、内联图片等的更精细电子邮件，最后如何在\
  \ JNDI 中配置了 JavaMail Session 时发送电子邮件。\n\n## 异步发送电子邮件\n\n迄今在本示例中讨论的电子邮件发送具有同步性。通常，应用程序会异步发送电子邮件——这可以通过\
  \ Spring 的 @Async 注解实现。field email template 命令支持 async 参数，该参数指示 Roo 执行以下操作：\n\n\
  - 创建标注了 Spring @Async 注解的 sendMessage 方法\n\n- 使用 Spring 任务命名空间的 <annotation-driven>\
  \ 元素启用对 @Async 注解方法的检测，如下所示：\n- <task:annotation-driven executor=\"asyncExecutor\"\
  \n  mode=\"aspectj\" />\n\nexecutor 属性引用 java.util.concurrent.Executor 接口的实现，负责执行标注了\
  \ @Async 的方法。\n\n- 使用 Spring 任务命名空间的 <executor> 元素在应用程序上下文 XML 中配置 Spring 的 ThreadPoolTaskExecutor，如下所示：\n\
  - <task:executor id=\"asyncExecutor\"\n  pool-size=\"${executor.poolSize}\" />\n\
  \nSpring 的 ThreadPoolTaskExecutor 配置了一个 java.util.concurrent.ThreadPoolExecutor\
  \ 实例（java.util.concurrent.Executor 的一个实现），线程池大小由 pool-size 属性值指定。${executor.poolSize}\
  \ 占位符的值来自 email.properties 文件。\n\n- 将 executor.poolSize 属性添加到 email.properties 文件中，如下所示：\n\
  \nexecutor.poolSize=10\n\n要在创建 FlightDescription 实例时异步发送邮件，请针对 FlightDescriptionController\
  \ 类执行以下 field email template 命令，如下所示：\n\n```\n.. roo> field email template --class\
  \ ~.web.FlightDescriptionController --async\n```\n\n现在，将 create(...) 方法从 FlightDescriptionController_Roo_Controller.aj\
  \ 复制到 FlightDescriptionController.java 并添加对 sendMessage(...) 方法的调用，如下所示：\n\n```\n\
  @RequestMapping(method = RequestMethod.POST)\npublic String create(@Valid FlightDescription...\
  \ ) {\n...\nflightDescription.persist();\nsendMessage(\"<username>@gmail.com\",\n\
  \"FlightDescription instance created\");\nreturn \"redirect:/flightdescriptions/\"\
  \ + ..\n}\n```\n\n## 发送带附件的电子邮件\n\n如前所述，如果您想发送带有附件、内联图片等的邮件，则需要使用 MimeMessage 而不是\
  \ SimpleMailMessage。field email template 命令将 SimpleMailMessage 和 MailSender 类型的属性添加到\
  \ Java 类中，如下所示：\n\n```\n@Autowired\nprivate transient MailSender mailTemplate;\n\
  @Autowired\nprivate transient SimpleMailMessage simpleMailMessage;\n```\n\n现在，MailSender\
  \ 定义接受 SimpleMailMessage 或 SimpleMailMessage[] 对象作为参数的方法。另一方面，JavaMailSender 定义接受\
  \ MimeMessage 或 MimeMessage[] 对象作为参数的方法。因此，我们需要将 mailTemplate 属性的类型从 MailSender\
  \ 更改为 JavaMailSender（MailSender 的子接口），以发送 MimeMessage 类型的消息。此外，我们需要从类中删除 simpleMailMessage\
  \ 属性，因为在发送带有附件或内联图片的邮件消息时，我们需要 MimeMessage 类型的邮件消息而不是 SimpleMailMessage。\n\n那么，我们如何创建\
  \ MimeMessage 呢？Spring 提供了以下简化创建 MimeMessage 的实用程序类：\n\n- MimeMessagePreparator：用于准备\
  \ MimeMessage 的回调接口\n- MimeMessageHelper：提供用于创建和填充 MimeMessage 方法的帮助程序类\n\n以下代码显示了修改后的\
  \ FlightDescriptionController.java，它使用 MimeMessageHelper 在创建新的 FlightDescription\
  \ 实例时发送带附件的邮件消息：\n\n```\nimport javax.mail.MessagingException;\nimport javax.mail.internet.MimeMessage;\n\
  import org.springframework.mail.javamail.JavaMailSender;\nimport org.springframework.mail.javamail.MimeMessageHelper;\n\
  import org.springframework.scheduling.annotation.Async;\n...\npublic class FlightDescriptionController\
  \ {\n\n@Autowired\nprivate transient JavaMailSender mailTemplate;\n\n@RequestMapping(method\
  \ = RequestMethod.POST)\npublic String create(@Valid FlightDescription\nflightDescription...)\
  \ {\n...\nflightDescription.persist();\nsendMessage(...);\nreturn \"redirect:/flightDescriptions/\"\
  \ + ...);\n}\n\n@Async\npublic void sendMessage(java.lang.String mailTo,\njava.lang.String\
  \ message) throws MessagingException {\nMimeMessage mimeMessage =\nmailTemplate.createMimeMessage();\n\
  MimeMessageHelper helper =\n```\n\n\n\n\n\n```java\nnew MimeMessageHelper(mimeMessage,\
  \ true);\nhelper.setTo(mailTo);\nhelper.setText(message);\nhelper.addAttachment(\"\
  logo.gif\",\nnew File(\"C:/logo.gif\"));\nmailTemplate.send(mimeMessage);\n}\n}\n\
  ```\n\n在 FlightDescriptionController.java 中我们做了以下更改：\n\n- 将 mailMessage 属性的返回类型从\
  \ MailSender 更改为 JavaMailSender\n- 删除了类型为 SimpleMailMessage 的 simpleMailMessage\
  \ 属性，因为我们需要 MimeMessage 实例来发送带附件的邮件\n- 修改了 sendMessage 方法，使其使用 MimeMessageHelper\
  \ 类来创建 MimeMessage 实例并向其中添加附件。\n\n## 在 JNDI 中配置 JavaMail Session 来发送电子邮件\n\n如果在应用服务器的\
  \ JNDI 中配置了 JavaMail Session，则需要修改 Roo 项目的 applicationContext.xml 文件，以使用在 JNDI 中配置的\
  \ JavaMail Session 创建 JavaMail SenderImpl 实例，如下所示：\n\n```xml\n<beans ... xmlns:jee=\"\
  http://www.springframework.org/schema/jee\" ...\nxsi:schemaLocation=\"http://www.springframework.org/schema/jee\
  \ http://\nwww.springframework.org/schema/jee/spring-jee-3.0.xsd\">\n......\n<jee:jndi-lookup\
  \ id=\"mailSession\" jndi-name=\"mail/session\" />\n<bean class=\"org.springframework.mail.javamail.JavaMailSenderImpl\"\
  \nid=\"mailSender\">\n<property name=\"session\" value=\"mailSession\"/>\n</bean>\n\
  .....\n```\n\n给定代码中所示的 Spring jee 命名空间的 jndi-lookup 元素，负责访问名称为 \"mail/session\"\
  （由 jndi-name 属性引用）的在 JNDI 中配置的 JavaMail Session，并使其在 bean id 为 \"mailSession\" 的\
  \ Spring 应用程序上下文中可用。\n\n## 另请参阅\n\n- 请参阅下一条配方，使用 JMS 发送和接收消息，以了解如何使用 JMS 发送和接收消息\n\
  \n## 发送和接收 JMS 消息\n\nSpring Roo 提供了基于 JMS (Java Message Service) API 开发消息传递应用程序的支持。截至\
  \ Spring Roo 1.1.5，Roo 支持的唯一 JMS 提供程序是嵌入式 ActiveMQ(http://activemq.apache.org/)；它与访问它的\
  \ Java 应用程序配置在同一 JVM 中。\n\n在本配方中，我们将探讨 Spring Roo 如何使用嵌入式 ActiveMQ 支持发送和接收 JMS 消息。\n\
  \n## 准备工作\n\n在 C:\\roo-cookbook 目录中创建一个名为 ch06-jms 的子目录。\n\n将 ch06_web_app.roo 脚本复制到\
  \ ch06-jms 目录中。\n\n执行 ch06_web_app.roo 脚本，该脚本会创建 flightapp-web Roo 项目，将 Hibernate\
  \ 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 Flight 和 FlightDescription JPA 实体，并定义 Flight\
  \ 与 FlightDescription 实体之间的多对一关系。此外，该脚本使用 controller all 命令从 JPA 实体生成 Spring Web\
  \ MVC 应用程序。如果您使用的数据库不是 MySQL 或连接设置与脚本中指定的不同，则相应地修改脚本。\n\n从 C:\\roo-cookbook\\ch06-jms\
  \ 目录启动 Roo shell。\n\n在本配方中，我们将探讨如何将新创建的 Flight 实例的属性作为 JMS 消息发送到队列目标，并使用异步消息监听器从队列中读取\
  \ JMS 消息。\n\n## 操作方法\n\n要将 flight-app 设置为 JMS 消息传递应用程序，请按照此处给出的步骤操作：\n\n- 1. 执行\
  \ jms setup 命令为 flightapp-web 应用程序创建一个新的 Spring 应用程序上下文 XML 文件，该文件将嵌入式 ActiveMQ\
  \ 配置为 JMS 提供程序，配置名为 myDestination 的 JMS 目标队列，并配置 Spring 的 JmsTemplate 用于发送 JMS 消息，如下所示：\n\
  \n```\n.. roo> jms setup --provider ACTIVEMQ_IN_MEMORY --destinationName myDestination\
  \ --destinationType QUEUE\n```\n\n已创建 ..\\META-INF\\spring\\applicationContext-jms.xml\
  \ ...\n\n已更新 ROOT\\pom.xml [已添加依赖项 org.apache.activemq:activemq-core:5.4.2]\n\n\
  - 2. 执行 field jms template 命令将 Spring 的 JmsTemplate 注入到 FlightController.java。FlightController\
  \ 使用 JmsTemplate 向第一步中配置的嵌入式 ActiveMQ 发送 JMS 消息。\n\n```\n.. roo> field jms template\
  \ --class ~.web.FlightController\n--fieldName jmsTemplate\n```\n\n已更新 ...\\sample\\\
  roo\\flightapp\\web\\FlightController.java\n\n- 3. 执行 jms listener 命令创建一个 MyListener\
