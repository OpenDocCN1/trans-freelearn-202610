  \ Packt 的标准。\n\n感谢妮哈·马利克在改善本书结构和呈现方式方面所做的出色工作。还要感谢乌沙·艾耶给我为 Packt 撰写的机会。\n\n## 关于评审员\n\
  \n**托比亚斯·吕蒂克**在软件领域拥有 11 多年的经验。作为顾问和软件架构师，他为德国蓝筹公司及其当前雇主塑造了各种关键任务应用程序。他的背景还包括项目管理和软件开发最佳实践的教学。职业生涯早期，托比亚斯对开源和敏捷开发方法论产生了热情，这至今仍在驱动他的工作。他很幸运参与了两个基于\
  \ Roo 的重大项目的成功交付；其中一个是几乎完全由开源组件构建的面向公众的地理信息系统。\n\n托比亚斯是认证的 Scrum Master、项目管理专业人士\
  \ (PMP)，并持有德国卡尔斯鲁厄理工学院（卓越大学）的计算机科学学位。\n\n目前，他作为新西兰一家政府实体的高级应用解决方案架构师工作，在那里他架构企业应用并领导开发团队将他的解决方案付诸实施。\n\
  \n托比亚斯喜欢写作，并通过他在各种杂志上发表的文章以及他关于 OpenSSH 的书分享他在软件开发领域的经验。\n\n**约翰·约瑟夫·瑞安 III** 是\
  \ Principigram™ LLC 的创始人兼系统工程总监。他专精于基于 Java 技术的门户 Web 开发和系统集成。他在广泛的技术栈和实现语言的数据中心系统方面拥有丰富经验。约翰拥有得克萨斯大学阿灵顿分校的计算机科学与工程学士学位，以及南卫理公会大学的系统工程硕士学位。\n\
  \n约翰说：“不要根据一个人能背诵什么来衡量其技能。要衡量他们掌握新技能或定义新问题的能力。生活和商业在于解决新问题，而不是背诵技术诗句。”\n\n除了对本出版物进行技术审阅外，约翰还参与了多本基于\
  \ Spring 和 Portal 的图书评审，并认为自己只在一个领域是专家，能够在任何领域迅速发挥作用。\n\n> 我要感谢我的妻子南西的支持。我也要感谢我的爸爸乔教会我努力工作的价值，感谢我的妈妈安向我展示积极态度的力量。最后，我要感谢\
  \ Yahshua 赋予我生命和世间的一切美好。\n\n## www.PacktPub.com\n\n## 支持文件、电子书、折扣优惠等\n\n你可以访问 www.PacktPub.com\
