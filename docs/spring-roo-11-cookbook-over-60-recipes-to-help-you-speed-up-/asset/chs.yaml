  \n- 11. 退出 Roo shell，并从 ch06-jms 目录执行 Tomcat Maven 插件的 tomcat:run 目标，以在嵌入式 Tomcat\
  \ 容器中部署 flightapp-web 项目，如下所示：\n\n  `C:\\roo-cookbook\\ch06-jms> mvn tomcat:run`\n\
  \n- 12. 使用以下 URL 从 Web 浏览器访问 flightapp-web 应用程序：http://localhost:8080/flightapp-web。您现在应该看到\
  \ flightapp-web 应用程序的以下主页：\n\n  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_313_0.png)\n\
  \n- 13. 从显示创建新 FlightDescription 实例表单的菜单中选择 **创建新航班描述** 选项。创建 FlightDescription\
  \ 实例后，选择 **创建新航班** 菜单选项来创建 Flight 实例。以下屏幕截图显示了创建 Flight 实例的表单：\n\n  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_313_1.png)\n\
  \n- 14. 输入 **出发日期**、**到达日期** 和 **航班描述** 信息，然后单击 **保存** 按钮。保存 Flight 实例会导致向 myDestination\
  \ 队列发送一条 JMS 消息，其中包含新创建的 Flight 实例及其关联的 FlightDescription 实例属性的详细信息。\n\n\n\n\n\n\
  15. MyListener JMS 消费者异步从 myDestination 队列读取 JMS 消息并将其写入标准输出，如下所示：\n\n```\nJMS message\
  \ received: DepartureDate: Tue Feb 01 00:00:00 IST 2011, ArrivalDate: Wed Feb 02\
  \ 00:00:00 IST 2011, FlightDescription: Origin: NYC, Destination: INDIA, Price:\
  \ 1200.0\n```\n\n## 工作原理...\n\nRoo 的 JMS 插件负责处理 JMS 相关命令，即：jms setup、jms listener\
  \ 和 field jms template。\n\nSpring 简化了企业应用与 JMS 提供者的集成。Spring 的 JmsTemplate 类是一个辅助类，它使应用程序能够同步发送和接收\
  \ JMS 消息。JmsTemplate 类持有 javax.jms.ConnectionFactory 实例的引用——用于与 JMS 提供者创建连接。\n\n\
  > 我们示例中的 JMS 提供者是嵌入式（或内存中）ActiveMQ。需要注意的是，Roo 仅支持将嵌入式 ActiveMQ 作为 JMS 提供者。如果要使用任何其他\
  \ JMS 提供者或独立的 ActiveMQ，则需要更改 Roo 生成的 JMS 提供者配置。\n\n让我们来看看在 flightapp-web 应用程序中用于设置\
  \ JMS 提供者以及发送和接收 JMS 消息的各种命令。\n\n## 设置 JMS 提供者\n\njms setup 命令为您的企业应用程序设置 JMS 提供者。jms\
  \ setup 命令接受以下参数：\n\n- provider：必填参数，指定需要为其添加支持的 JMS 提供者。Roo 为此参数定义的唯一可接受值是 ACTIVEMQ_IN_MEMORY，用于将嵌入式\
  \ ActiveMQ 设置为 JMS 提供者。\n\n- destinationName：可选参数，指定应用程序访问的 JMS 目标名称。如果未指定，则目标名称为\
  \ myDestination。\n\n- destinationType：可选参数，用于标识通过 destinationName 参数指定的 JMS 目标类型。Roo\
  \ 为此参数定义的两个可能值为 QUEUE（如果 JMS 目标类型为队列）和 TOPIC（如果 JMS 目标类型为主题）。如果未指定，则目标类型默认为 QUEUE。\n\
  \njms setup 命令创建一个应用程序上下文 XML 文件：位于 SRC_MAIN_RESOURCES/META-INF/spring 目录下的 applicationContext-jms.xml。applicationContext-jms.xml\
  \ 文件配置嵌入式 ActiveMQ broker、JmsTemplate、JMS ConnectionFactory、JMS 目标和消息监听器容器。\n\n\
  下面的代码清单显示了 applicationContext-jms.xml 中的嵌入式 ActiveMQ broker 配置：\n\n```\n<beans xmlns=\"\
  http://www.springframework.org/schema/beans\"\nxmlns:amq=\"http://activemq.apache.org/schema/core\"\
  \ ...>\n<amq:broker persistent=\"false\" useJmx=\"true\">\n<amq:transportConnectors>\n\
  <amq:transportConnector uri=\"tcp://localhost:61616\"/>\n</amq:transportConnectors>\n\
  </amq:broker>\n...\n</beans>\n```\n\namq 命名空间引用 ActiveMQ 架构，它允许在 Spring 的应用程序上下文\
  \ XML 文件中配置 ActiveMQ。<broker> 元素配置名为 localhost 的嵌入式 ActiveMQ broker。如果要为 broker\
  \ 指定自定义名称，可以使用 <broker> 元素的 brokerName 属性。persistent 属性指定 ActiveMQ broker 接收到的 JMS\
  \ 消息是否持久化到数据存储中。值 false 指示 broker 不持久化消息。如果将 persistent 属性的值指定为 true，则 ActiveMQ\
  \ 将 KahaDB 配置为消息的默认数据存储。useJmx 属性指定 broker 的服务是否通过 JMX 公开。如果属性值为 true，则可以使用 JMX\
  \ 客户端调用 ActiveMQ broker 的服务，例如启动或停止 broker、添加或删除主题和队列 JMS 目标等等。<transportConnectors>\
  \ 元素定义 ActiveMQ broker 监听客户端连接的传输连接器。给定代码清单中的 <transportConnector> 元素指定一个 tcp 传输连接器，它监听端口\
  \ 61616。\n\nJMS ConnectionFactory 在 applicationContext-jms.xml 文件中配置，如下所示：\n\n```\n\
  <amq:connectionFactory brokerURL=\"vm://localhost\"\nid=\"jmsFactory\"/>\n\n<bean\
  \ class=\"org.springframework.jms.connection.\nCachingConnectionFactory\" id=\"\
  cachingConnectionFactory\">\n<property name=\"targetConnectionFactory\">\n<ref local=\"\
  jmsFactory\"/>\n</property>\n</bean>\n```\n\namq 命名空间的 <connectionFactory> 元素配置\
  \ JMS ConnectionFactory。JMS ConnectionFactory 通常在应用程序服务器中配置，并由应用程序通过 JNDI 获取。如果\
  \ ConnectionFactory 在应用程序服务器中配置，则可以使用 Spring jee 架构的 <jndi-lookup> 元素来获取它。brokerURL\
  \ 属性标识连接 ActiveMQ broker 的 URL。brokerURL 属性的值为 vm://localhost，这意味着客户端使用 VM（虚拟机）协议访问名为\
  \ localhost 的 ActiveMQ broker。之所以使用 vm 协议，是因为客户端（在本例中为 flightapp-web 应用程序）和 broker\
  \ 位于同一个 JVM 中。使用 VM 协议可确保性能提升，因为客户端与 broker 之间的通信不涉及网络开销，客户端直接调用 broker 的方法。\n\n\
  Spring 的 CachingConnectionFactory 类是一个 JMS ConnectionFactory 适配器，它缓存 JMS Session、MessageConsumer\
  \ 和 MessageProducer 的实例以提升性能。targetConnectionFactory 属性标识 ConnectionFactory，CachingConnectionFactory\
  \ 实例使用它来获取 JMS Connection。给定配置中的 targetConnectionFactory 属性引用由 amq 命名空间的 <connectionFactory>\
  \ 元素创建的 JMS ConnectionFactory。\n\n在 jms setup 命令中，我们还传递了 JMS 目标名称（myDestination）和类型（QUEUE），JMS\
  \ 插件使用它们在 applicationContext-jms.xml 文件中配置名为 myDestination 的 JMS 队列，如下所示：\n\n```\n\
  <amq:queue id=\"myDestination\" physicalName=\"myDestination\"/>\n```\n\n这里，amq\
  \ 命名空间的 <queue> 元素配置名为 myDestination 的 JMS 队列。physicalName 属性指定 ActiveMQ 中 JMS 队列的名称。JMS\
  \ 目标通常在应用程序服务器中配置，并由应用程序通过 JNDI 获取。如果 JMS 目标在应用程序服务器中配置，则可以使用 Spring jee 架构的 <jndi-lookup>\
  \ 元素来获取它。\n\nSpring 的 JmsTemplate 也在 applicationContext-jms.xml 文件中配置，如下所示：\n\n\
  ```\n<bean class=\"org.springframework.jms.core.JmsTemplate\"\n id=\"jmsTemplate\"\
  >\n <property name=\"connectionFactory\"\n ref=\"cachingConnectionFactory\"/>\n\
  \ <property name=\"defaultDestination\" ref=\"myDestination\"/>\n </bean>\n```\n\
  \nconnectionFactory 属性引用 CachingConnectionFactory 实例。JmsTemplate 定义接受 JMS Destination\
  \ 对象或 JMS 目标名称作为参数的 send 方法。defaultDestination 属性引用当使用的 send 方法不接受 JMS Destination\
  \ 对象或 JMS 目标名称作为参数时用于发送或接收消息的 JMS 目标。\n\n为了让 flightapp-web 应用程序能够异步接收 JMS 消息，jms\
  \ setup 命令在 applicationContext-jms.xml 文件中配置 Spring 的消息监听器容器，如下所示：\n\n```\n<beans\
  \ xmlns=\"http://www.springframework.org/schema/beans\"\nxmlns:jms=\"http://www.springframework.org/schema/jms\"\
  \ ...>\n...\n<jms:listener-container connection-factory=\"jmsFactory\"\ndestination-type=\"\
  queue\" />\n...\n</beans>\n```\n\n消息监听器容器从 JMS 提供者接收消息并将其分发给消息消费者实现。消息监听器容器节省了编写异步消息消费所需代码的工作，这些代码包括向\
  \ JMS 提供者注册、管理事务等等。\n\n在给定的配置中，Spring jms 命名空间的 `<listener-container>` 元素创建一个消息监听器容器。`connection-factory`\
  \ 属性标识容器用于与 JMS 提供者创建连接的 JMS ConnectionFactory。`destination-type` 标识容器接收消息的 JMS\
  \ 目标类型（队列、主题或持久主题）。可以在 `<listener-container>` 内部添加 Spring jms 命名空间的 `<listener>`\
  \ 元素，以定义监听器容器分发消息进行处理的消息消费者。\n\n现在让我们来看看如何使用 JmsTemplate 类发送 JMS 消息。\n\n## 使用 JMS\
  \ 模板发送消息\n\nfield jms template 命令将 JmsTemplate 实例自动注入由 `class` 参数标识的类中。fieldName\
  \ 参数标识添加 JmsTemplate 的字段名称。\n\n下面的代码显示了 FlightController.java 文件，我们在其中使用 jms template\
  \ 命令添加了 JmsTemplate 字段：\n\n```\nimport org.springframework.jms.core.JmsTemplate;\n\
  ...\npublic class FlightController {\n\n@Autowired\nprivate transient JmsTemplate\
  \ jmsTemplate;\n\npublic void sendMessage(Object messageObject) {\njmsTemplate.convertAndSend(messageObject);\n\
  }\n}\n```\n\n\n\n\n给定的代码显示，`jms template` 命令向 `FlightController` 类添加了一个 `JmsTemplate`\
  \ 字段和一个 `sendMessage` 方法。`sendMessage` 方法接受 `Object` 类型作为参数，表示你想作为 JMS 消息发送到 JMS\
  \ 目标的对象。`sendMessage` 方法调用 `JmsTemplate` 的 `convertAndSend` 方法，该方法将传入的对象转换为 JMS\
  \ 消息，并将其发送到由 `setDefaultDestination(...)` 方法设置的默认目标或由应用程序上下文 XML 文件中 `JmsTemplate`\
  \ 的 `defaultDestination` 属性指定的目标。对于 Roo 生成的代码，`JmsTemplate` 的默认目标由 `defaultDestination`\
  \ 属性指定（请参阅 `flightapp-web` 项目的 `applicationContext-jms.xml` 文件）。\n\n所以，你可能会问——对象与\
  \ JMS 消息之间的转换是如何执行的？Spring 提供了一个 `MessageConverter` 接口，你可以实现它来定义如何处理从 Java 对象到 JMS\
  \ 消息以及反之的转换。Spring 提供了一个内置的 `MessageConverter` 实现：`SimpleMessageConverter`，它由 `JmsTemplate`\
  \ 默认使用，并负责 `String` 与 JMS `TextMessage`、`byte[]` 与 JMS `BytesMessage`、`Map` 与 JMS\
  \ `MapMessage` 之间以及 `Serializable` 对象与 JMS `ObjectMessage` 之间的转换。由于 `flightapp-web`\
  \ 应用程序中的 `Flight` 和 `FlightDescription` 对象实现了 `Serializable` 接口，因此 `JmsTemplate`\
  \ 的 `convertAndSend` 方法将它们转换为 JMS `ObjectMessage` 实例。\n\n## 创建 JMS 消息消费者\n\n`jms\
  \ listener` 命令创建一个异步 JMS 消息消费者。如果你希望应用程序同步消费消息，则可以使用 `JmsTemplate` 的一个 `receive`\
  \ 方法。如果你还想使用 `SimpleMessageConverter` 将接收到的 JMS 消息转换为 Java 对象，则可以使用 `JmsTemplate`\
  \ 的 `receiveAndConvert(...)` 方法来接收消息。\n\n`jms listener` 命令创建一个消息消费者，并更新 `applicationContext-jms.xml`\
  \ 文件以创建一个新的消息监听器容器，该容器包含新创建的消息消费者作为监听器。在 `flightapp-web` 的情况下，`jms listener` 命令创建\
  \ `MyListener` JMS 消息消费者，并将以下配置添加到 `applicationContext-jms.xml` 文件中：\n\n```xml\n\
  <bean class=\"sample.roo.flightapp.web.MyListener\"\n  id=\"myListener\"/>\n\n<jms:listener-container\
  \ connection-factory=\"jmsFactory\"\n  destination-type=\"queue\">\n  <jms:listener\
  \ destination=\"myDestination\"\n    method=\"onMessage\" ref=\"myListener\"/>\n\
  </jms:listener-container>\n```\n\n`<bean>` 元素将 `MyListener` 消息消费者配置为 Spring bean。\n\
  \nSpring `jms` 命名空间的 `<listener>` 元素定义一个消息监听器，消息监听器容器（由包围的 `<listener-container>`\
  \ 元素指定）将 JMS 消息分派给该监听器进行处理。`<listener-container>` 的 `destination-type` 属性源自 `jms\
  \ listener` 命令的 `destinationType` 参数值。`ref` 属性指向消息消费者实例，该实例负责处理 JMS 消息。`destination`\
  \ 属性（对应于 `jms listener` 命令的 `destinationName` 参数值）标识消息消费者（通过消息容器监听器）从中接收 JMS 消息以进行处理的\
  \ JMS 目标。`method` 属性指定消息消费者类中负责处理接收到的 JMS 消息的方法名称。\n\n因此，通过为 `flightapp-web` 执行\
  \ `jms listener` 命令，我们创建了 `MyListener` 类，该类负责处理由 `myDestination` JMS 目标接收到的 JMS\
  \ 消息。`MyListener.java` 中的以下代码清单显示了 Roo 生成的 `MyListener` 类：\n\n```java\npublic class\
  \ MyListener {\n\n    public void onMessage(Object message) {\n        System.out.println(\"\
  JMS message received: \" + message);\n    }\n\n}\n```\n\n如给定代码所示，Roo 生成的消息监听器不实现任何接口或扩展任何类，并定义一个接受\
  \ JMS 消息作为参数的 `onMessage` 方法。`onMessage` 没有做任何有趣的事情——它只是将消息打印到标准输出。\n\n### 更多内容...\n\
  \n现在让我们看看如何从企业应用程序异步发送 JMS 消息：\n\n### 异步发送 JMS 消息\n\n`field jms template` 命令支持一个\
  \ `async` 参数，你可以使用它来指定 Roo 生成的 `sendMessage` 方法带有 Spring 的 `@Async` 注解。对象上带有 `@Async`\
  \ 注解的方法将由 Spring 使用 `java.util.concurrent.ThreadPoolExecutor` 异步执行。如果指定了 `async`\
  \ 参数，Roo 将执行以下操作：\n\n- 创建带有 Spring `@Async` 注解的 `sendMessage` 方法\n- 通过 Spring 的\
  \ task 命名空间的 `<annotation-driven>` 元素在 applicationContext.xml 中启用对带有 `@Async` 注解的方法的检测，如下所示：\n\
  \n  ```xml\n  <task:annotation-driven executor=\"asyncExecutor\"\n  mode=\"aspectj\"\
  \ />\n  ```\n\n  `executor` 属性引用 `java.util.concurrent.Executor` 接口的一个实现，负责执行带有\
  \ `@Async` 注解的方法。\n\n- 使用 Spring 的 task 命名空间的 `<executor>` 元素在 applicationContext.xml\
  \ 中配置 Spring 的 `ThreadPoolTaskExecutor`，如下所示：\n\n  ```xml\n  <task:executor id=\"\
  asyncExecutor\"\n  pool-size=\"${executor.poolSize}\" />\n  ```\n\nSpring 的 `ThreadPoolTaskExecutor`\
  \ 配置了一个 `java.util.concurrent.ThreadPoolExecutor` 实例（`java.util.concurrent.Executor`\
  \ 的一个实现），线程池大小由 pool-size 属性值指定。`${executor.poolSize}` 占位符的值来自 Roo 生成的 `jms.properties`\
  \ 文件，如下所示：\n\n```\nexecutor.poolSize=10\n```\n\n### 另请参阅\n\n- 请参阅“使用 JavaMail API\
  \ 发送电子邮件”配方，了解如何从应用程序发送电子邮件\n\n## 为应用程序配置 Spring Security\n\nRoo 支持通过 security setup\
  \ 命令为你的应用程序配置 Spring Security。在本配方中，我们将查看当你执行 security setup 命令时，Roo 添加到你的应用程序中的安全相关配置。在下一个配方“将\
  \ Spring Security 与 Apache Directory Server 配合使用”中，我们将探讨如何扩展 Spring Security 配置以使用\
  \ Apache Directory Server 来满足 Roo 生成的 Web 应用程序的安全要求，以及如何引入方法级安全。\n\n### 准备工作\n\n\
  在 C:\\roo-cookbook 目录中创建一个名为 ch06-security 的子目录。\n\n将 ch06_web_app_security.roo\
  \ 脚本复制到 ch06-security 目录中。\n\n执行 ch06_web_app_security.roo 脚本，该脚本会创建 flightapp-web\
  \ Roo 项目，设置 Hibernate 作为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 Flight、FlightDescription\
  \ 和 Booking JPA 实体，定义 Flight 和 FlightDescription 实体之间的多对一关系，以及 Booking 和 Flight\
  \ JPA 实体之间的多对一关系。此外，该脚本还使用 controller all 命令来脚手架 Spring Web MVC 应用程序。如果你使用的数据库不是\
  \ MySQL，或者你的连接设置与脚本中指定的不同，请相应地修改脚本。\n\n从 C:\\roo-cookbook\\ch06-security 目录启动 Roo\
  \ shell。\n\n### 操作步骤\n\n要通过 security setup 命令为你的应用程序配置 Spring Security，请按以下步骤操作：\n\
  \n- 1. 执行 security setup 命令为 flightapp-web Spring Web MVC 应用程序设置 Spring Security，如下所示：\n\
  \n  ```\n  .. roo> security setup\n  Updated ROOT\\pom.xml [Added property 'spring-security.version'\
  \ with value '3.0.5.RELEASE']\n  Updated ROOT\\pom.xml [Added dependencies org.springframework.security:spring-security-core:${spring-security.version}],\
  \ ...]\n  Created SRC_MAIN_RESOURCES\\META-INF\\spring\\applicationContext-security.xml\n\
  \  Created SRC_MAIN_WEBAPP\\WEB-INF\\views\\login.jspx\n  Updated SRC_MAIN_WEBAPP\\\
  WEB-INF\\views\\views.xml\n  Updated SRC_MAIN_WEBAPP\\WEB-INF\\web.xml\n  Updated\
  \ SRC_MAIN_WEBAPP\\WEB-INF\\spring\\webmvc-config.xml\n  ```\n\n- 2. 执行 perform\
  \ eclipse 命令以更新项目的类路径设置：\n\n  ```\n  .. roo> perform eclipse\n  ```\n\n- 3. 将 flightapp-web\
  \ Eclipse 项目导入 Eclipse IDE\n\n\n\n\n## 工作原理...\n\n安全设置命令由 Roo 的 **Security 插件**\
  \ 处理。安全设置命令仅在你通过执行 Roo 的某个控制器命令安装了 Spring Web MVC 构件后，*之后* 才可用。这限制了安全插件仅用于使用 Spring\
  \ Web MVC 的项目。\n\nSecurity 插件处理安全设置命令并执行以下操作：\n\n- 向 flightapp-web 项目的 pom.xml 文件添加名为\
  \ `spring-security-version`、值为 3.0.5 的属性，如下所示：\n\n```xml\n<project ...>\n  ...\n\
  \  <name>flightapp-web</name>\n  <properties>\n    <roo.version>1.1.2.RELEASE</roo.version>\n\
  \    <spring.version>3.0.5.RELEASE</spring.version>\n    <spring-security.version>\n\
  \      3.0.5.RELEASE</spring-security.version>\n    ...\n  </properties>\n  ...\n\
  </project>\n```\n\nspring-security-version 属性标识应用程序所需的 Spring Security 框架版本。pom.xml\
  \ 中的 `<dependency>` 元素引用了 Spring Security 版本号属性，如下所示：\n\n```xml\n<dependency>\n\
  \  <groupId>org.springframework.security</groupId>\n  <artifactId>spring-security-config</artifactId>\n\
  \  <version>${spring-security.version}</version>\n</dependency>\n```\n\n```xml\n\
  <dependency>\n  <groupId>org.springframework.security</groupId>\n  <artifactId>spring-security-web</artifactId>\n\
  \  <version>${spring-security.version}</version>\n</dependency>\n```\n\n如给定配置所示，将\
  \ flightapp-web 应用程序所需的 Spring Security 版本号定义为 pom.xml 文件中的属性，可以确保 pom.xml 定义的依赖属于同一版本的\
  \ Spring Security 的 JAR 文件。\n\n- 在 SRC_MAIN_RESOURCES/META-INF/spring 目录中创建应用程序上下文\
  \ XML 文件：applicationContext-security.xml。applicationContext-security.xml 文件配置应用程序的身份验证和授权要求。\n\
  \n- 向 flightapp-web 应用程序的 web.xml 文件添加 Spring Security 的 DelegatingFilterProxy Servlet\
  \ 过滤器，如下所示：\n\n```xml\n<filter>\n<filter-name>springSecurityFilterChain</filter-name>\n\
  <filter-class>org.springframework.web.filter.DelegatingFilterProxy</filter-class>\n\
  </filter>\n\n<filter-mapping>\n<filter-name>springSecurityFilterChain</filter-name>\n\
  <url-pattern>/*</url-pattern>\n</filter-mapping>\n```\n\nDelegatingFilterProxy Servlet\
  \ 过滤器充当进入 Spring Security Web 模块的入口点，该模块处理 Web 请求安全。过滤器 springSecurityFilterChain\
  \ 的名称引用在 applicationContext-security.xml 文件中配置的 Spring Security FilterChainProxy\
  \ 实例的名称。DelegatingFilterProxy 过滤器将 Web 请求委派给 FilterChainProxy 实例以执行 Web 请求安全。\n\n\
  - 在 SRC_MAIN_WEBAPP/WEB-INF/views 目录中创建登录 JSPX 页面 login.jspx。\n\n- 在 SRC_MAIN_WEBAPP/WEB-INF/views/views.xml\
  \ Tiles 定义 XML 文件中为登录页面添加 Tiles 定义，如下所示：\n\n```xml\n<definition extends=\"public\"\
  \ name=\"login\">\n<put-attribute name=\"body\"\nvalue=\"/WEB-INF/views/login.jspx\"\
  />\n</definition>\n```\n\n- 在 webmvc-config.xml 文件（位于 SRC_MAIN_WEBAPP/WEB-INF/spring\
  \ 目录）中配置 ParameterizableViewController（通过 Spring mvc 命名空间的 view-controller 元素），用于将请求分发到\
  \ login.jspx 页面，如下所示：\n\n```xml\n<mvc:view-controller path=\"/login\"/>\n```\n\n\
  - 更新 flightapp-web 项目的 pom.xml 文件，以包含对 Spring Security JAR 文件的依赖，例如 spring-security-core、spring-security-config\
  \ 等等。\n\n让我们现在详细查看 applicationContext-security.xml 文件。\n\n## Spring Security 应用程序上下文\
  \ XML 文件\n\napplicationContext-security.xml 文件配置 Spring Security Bean，这些 Bean 用于请求的身份验证和授权。如我们稍后将看到的，Roo\
  \ 生成的 applicationContext-security.xml 并没有做太多事情，但为配置应用程序特定的安全性提供了一个良好的起点。\n\n###\
  \ AuthenticationManager 配置\n\n应用程序的身份验证机制在 applicationContext-security.xml 中通过 Spring\
  \ 安全命名空间的 <authentication-manager> 元素进行配置，如下所示：\n\n```xml\n<authentication-manager\
  \ alias=\"authenticationManager\">\n<authentication-provider>\n<password-encoder\
  \ hash=\"sha-256\" />\n<user-service>\n<user name=\"admin\" password=\"...\" \n\
  authorities=\"ROLE_ADMIN\" />\n<user name=\"user\" password=\"...\" \nauthorities=\"\
  ROLE_USER\" />\n</user-service>\n</authentication-provider>\n</authentication-manager>\n\
  ```\n\n让我们详细查看给定配置中的每个元素，以及它们如何协同工作为应用程序提供身份验证服务：\n\n- <authentication-manager>：它注册\
  \ Spring Security 的 AuthenticationManager 实现的一个实例，该实例负责提供身份验证服务。AuthenticationManager\
  \ 将身份验证委托给使用 <authentication-provider> 子元素配置的 AuthenticationProvider。\n\n- <authentication-provider>：它注册\
  \ Spring Security 的 AuthenticationProvider 实现的一个实例。Spring Security 提供了 AuthenticationProvider\
  \ 接口的几个内置实现，以简化在应用程序中融合不同的身份验证机制。例如，如果你使用 JA-SIG CAS 进行身份验证，可以使用 CasAuthenticationProvider\
  \ 实现；如果你使用 LDAP 服务器进行身份验证，可以使用 LdapAuthenticationProvider，等等。AuthenticationProvider\
  \ 实现的使用通过 <authentication-provider> 元素的 ref 属性指定。如果未指定 ref 属性（如 Roo 生成的 applicationContext-security.xml\
  \ 的情况），则注册 DaoAuthenticationProvider 实现。DaoAuthenticationProvider 使用 Spring Security\
  \ 的 UserDetailsService 来验证用户。UserDetailsService 根据应用程序用户输入的用户名加载包含用户名、密码和授予的权限的用户详细信息。DaoAuthenticationProvider\
  \ 通过将应用程序用户输入的密码与 UserDetailsService 加载的用户详细信息进行比较来验证用户。\n\n- <user-service>：它创建一个内存中的\
  \ UserDetailsService 实例，该实例从属性文件或嵌套的 <user> 元素中读取用户详细信息。\n\n- <user>：它定义应用程序的一个用户。name\
  \ 和 password 属性标识身份验证所需的用户名和密码。\n\n- <password-encoder>：它在将提交的密码与 UserDetailsService\
  \ 检索的密码进行比较之前，将提交的密码转换为哈希版本。hash 属性指定用于编码密码的哈希算法。\n\n### Web 请求安全配置\n\n以下 `<http>`\
  \ 元素显示了如何在 applicationContext-security.xml 文件中配置 Web 请求安全：\n\n```xml\n<http auto-config=\"\
  true\" use-expressions=\"true\">\n    <form-login\n        login-processing-url=\"\
  /resources/j_spring_security_check\"\n        login-page=\"/login\"\n        authentication-failure-url=\"\
  /login?login_error=t\"/>\n    <logout logout-url=\"/resources/j_spring_security_logout\"\
  />\n    <intercept-url pattern=\"/choices/**\"\n        access=\"hasRole('ROLE_ADMIN')\"\
  />\n    <intercept-url pattern=\"/member/**\"\n        access=\"isAuthenticated()\"\
  \ />\n    <intercept-url pattern=\"/resources/**\"\n        access=\"permitAll\"\
  \ />\n    <intercept-url pattern=\"/**\" access=\"permitAll\" />\n</http>\n```\n\
  \n让我们现在详细查看给定配置中的元素如何定义 Web 请求安全：\n\n- <http>：它包含 HTTP 安全配置元素。它创建一个 bean 名称为 springSecurityFilterChain\
  \ 的 Spring Security FilterChainProxy 实例。需要注意的是，FilterChainProxy Bean 的名称与 web.xml\
  \ 文件中配置的 DelegatingFilterProxy Servlet 过滤器的名称相同。\n\nauto-config 属性自动配置提供基于表单的登录、注销和\
  \ HTTP BASIC 身份验证服务的 Spring Security Bean。\n\nuse-expression 属性指定 <intercept-url>\
  \ 元素（在本配方后面讨论）的 access 属性是否可以接受 EL 表达式。\n\n- <form-login>：它在应用程序上下文中配置 Spring Security\
  \ 的 UsernamePasswordAuthenticationFilter 过滤器 Bean（一个实现 Servlet API 的 javax.servlet.Filter\
  \ 接口的 Bean）和 LoginUrlAuthenticationEntryPoint Bean。UsernamePasswordAuthenticationFilter\
  \ 过滤器 Bean 由 FilterChainProxy 用于执行身份验证。\n\nUsernamePasswordAuthenticationFilter\
  \ 使用提交请求中的用户名和密码，针对配置的身份验证提供程序尝试进行身份验证。需要注意的是，包含用户名和密码的请求参数的名称必须分别为 j_username 和\
  \ j_password。如果你检查 Roo 生成的 login.jspx 文件中 flightapp-web 项目的参数，你会发现用户名和密码字段的名称分别为\
  \ j_username 和 j_password。\n\nLoginUrlAuthenticationEntryPoint Bean 使用 UsernamePasswordAuthenticationFilter\
  \ 启动基于表单的登录身份验证。\n\nlogin-page 属性指定登录页面的 URL。该属性的值由 LoginUrlAuthenticationEntryPoint\
  \ 用于呈现登录页面。该属性的值为 /login，这意味着 webmvc-config.xml 中配置的 <mvc:view-controller path=\"\
  /login\" /> 控制器负责呈现登录页面。\n\nlogin-processing-url 属性指定登录表单提交到的 URL。UsernamePasswordAuthenticationFilter\
  \ 处理提交到其 filterProcessesUrl 属性标识的 URL 的请求。login-processing-url 属性的值用于设置 UsernamePasswordAuthenticationFilter\
  \ 的 filterProcessesUrl 属性。login-processing-url 属性的值为 /resources/j_spring_security_check，这与\
  \ Roo 生成的 flightapp-web 项目的 login.jspx 文件中 HTML <form> 元素的 action 属性值相同。\n\n\n\n\
  \nauthentication-failure-url 属性指定登录失败时用户被重定向到的 URL。该属性的值 /login?login_error=t 表示\
  \ webmvc-config.xml 中配置的 <mvc:view-controller path=\"/login\"/> 控制器将再次渲染登录页面。URL\
  \ 中的 login_error 参数由 login.jspx 页面用于在登录页面上显示身份验证失败消息，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_327_0.png)\n\
  \n- <logout>: 它配置了负责处理退出请求的 LogoutFilter 过滤器 bean。LogoutFilter 处理提交给其 filterProcessesUrl\
  \ 属性所标识 URL 的请求。logout-url 属性的值用于设置 LogoutFilter 的 filterProcessesUrl 属性。对于 Roo\
  \ 生成的 applicationContext-security.xml，logout-url 的值为 /resources/j_spring_security_logout。footer.jspx\
  \ 文件（位于 /WEB-INF/views 目录中）包含在用户已登录时显示的注销超链接。注销超链接引用 /resources/j_spring_security_logout\
  \ URL，这意味着当用户单击注销超链接时，请求由 LogoutFilter 过滤器 bean 处理。\n\n- <intercept-url>: 它定义 URL\
  \ 模式和相应的访问权限。pattern 属性指定 URL 模式，access 属性指定访问权限。如前所述，<http> 元素的 use-expression\
  \ 属性设置为 true；因此，access 属性可以接受布尔 EL 表达式。如果表达式返回的值为 true，则授予对 pattern 属性指定的 URL 模式的访问权限。\n\
  \nhasRole、isAuthenticated() 和 permitAll 是内置表达式的示例。如果经过身份验证的主体的角色为 ROLE_ADMIN，hasRole('ROLE_ADMIN')\
  \ 返回 true。如果用户不是匿名用户，isAuthenticated() 返回 true。permitAll 表达式始终返回 true。\n\n`<http>`\
  \ 元素注册了 Spring Security 的 `AccessDecisionManager` 实现，用于对 Web URL 访问做出访问决策。传入的 Web\
  \ 请求将按照其在 `<http>` 元素中出现的顺序，与 `<intercept-url>` 元素指定的 URL 模式进行匹配。如果找到匹配项，将由 `AccessDecisionManager`\
  \ 实现使用它来做出访问决策。由于传入的 Web 请求按照其在 `<http>` 元素中出现的顺序与 URL 模式（由 `<intercept-url>` 元素指定）进行匹配，因此应先声明更具体的\
  \ URL 模式，再声明更通用的 URL 模式。\n\n## 将 Spring Security 与 Apache Directory Server 配合使用\n\
  \n本示例在之前示例的基础上进行扩展，展示了一个使用 Spring Web MVC 开发的功能完善的 Flight Booking 应用程序，该应用程序使用 Spring\
  \ Security 实现 Web 请求和 *方法级* 安全。我们将查看需要对 `security setup` 命令生成的配置和工件进行哪些修改或添加，以创建安全感知的\
  \ Flight Booking 应用程序。\n\n在深入探讨如何使用 Spring Security 满足这些要求的详细信息之前，我们先快速了解一下 Flight\
  \ Booking 应用程序的安全要求。\n\n### Flight Booking 应用程序要求\n\nFlight Booking 应用程序的用户针对 Apache\
  \ Directory Server 进行身份验证，该服务器包含应用程序用户、详细信息及其角色信息。Flight Booking 应用程序的经过身份验证的用户可以拥有\
  \ `ROLE_ADMIN_USER` 或 `ROLE_APP_USER` 角色。对应用程序功能的访问权限根据经过身份验证用户的角色授予或限制。\n\nFlight\
  \ Booking 应用程序的 Web 请求安全要求限制对菜单选项的未授权访问。以下屏幕截图显示了 Flight Booking 应用程序的主菜单：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_329_0.png)\n\
  \n下表根据角色定义了每个菜单选项（如给定屏幕截图所示）的访问权限：\n\n| 菜单选项 | 可访问的角色 |\n|---|---|\n| 创建新的 FlightDescription\
  \ | ROLE_ADMIN_USER |\n| 列出所有 Flight Description | |\n| 按目的地和原点查找 | |\n| 创建新的 Flight\
  \ | |\n| 列出所有 Flight | |\n| 创建新的 Booking | ROLE_APP_USER |\n| 列出所有 Booking | ROLE_ADMIN_USER\
  \ |\n\n如给定表所示，拥有 ROLE_ADMIN_USER 角色的应用程序用户可以访问 Flight、FlightDescription 和 Booking\
  \ JPA 实体的 Web 页面。拥有 ROLE_APP_USER 角色的应用程序用户只能访问与 Booking JPA 实体对应的 Web 页面。\n\n尽管\
  \ Create new Booking 和 List all Bookings 链接对 ROLE_APP_USER 和 ROLE_ADMIN_USER 角色都可访问（如前表所示），但应用程序还必须满足以下安全要求（这些要求最终将转换为方法级安全要求）：\n\
  \n- 拥有 ROLE_APP_USER 角色的用户可以创建新的 Booking 实例，但无法编辑或删除现有的 Booking 实例\n- 拥有 ROLE_ADMIN_USER\
  \ 角色的用户可以编辑或删除现有的 Booking 实例，但无法创建新的 Booking 实例\n\n### 准备工作\n\n将 ch06-ldap-security.zip\
  \ 文件的内容提取到 C:\\roo-cookbook 目录中。这将在 C:\\roo-cookbook 中创建 ch06-ldap-security 目录。ch06-ldap-security\
  \ 目录包含一个 flightapp-web Web 项目，该项目表示安全感知的 Flight Booking 应用程序。此 flightapp-web 项目是我们在之前示例中创建的\
  \ flightapp-web 项目的扩展。它包含对 Spring Security 生成工件的修改，以及针对 Flight Booking 应用程序的地址 Web\
  \ 请求和方法级安全要求的几项额外更改。\n\n如果您使用的数据库不是 MySQL，或者您的连接设置与 flightapp-web 项目的 database.properties\
  \ 文件中指定的不同，请相应地修改 database.properties 文件。\n\n打开命令提示符，并切换到 C:\\roo-cookbook\\ch06-ldap-security\
  \ 目录。\n\n### 操作方法\n\n要使用 Spring 应用程序配置安全设置，请按以下步骤操作：\n\n1. 将 flightapp-web 项目部署为内嵌\
  \ Tomcat 实例中的动态 Web 应用程序：\n\n```\n..\\ch06-ldap-security> mvn tomcat:run\n```\n\n\
  这将下载 flightapp-web 项目的 pom.xml 文件中定义的依赖项。现在，您可以通过访问以下 URL 来访问 flightapp-web 应用程序：\n\
  \n```\nhttp://localhost:8080/flightapp-web\n```\n\n如果您看到以下网页，则表示您已成功将 flightapp-web\
  \ 应用程序部署到内嵌 Tomcat 实例中：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_330_0.png)\n\
  \n2. 选择 **创建新的 Flight Description** 菜单选项，这将显示 Flight Booking 应用程序的登录屏幕，如下所示：\n\n\
  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_331_0.png)\n\n3. 在 **名称** 标记的字段中输入 **admin**，在\
  \ **密码** 标记的字段中输入 **admin**，并单击 **提交** 按钮登录到应用程序。**admin** 用户拥有 **ROLE_ADMIN_USER**\
  \ 角色。\n\n**admin** 用户与 **ROLE_ADMIN_USER** 角色关联；因此，**admin** 用户会看到创建新 **FlightDescription**\
  \ 实例的表单，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_331_1.png)\n\n4. 按照屏幕截图输入航班描述详细信息，并单击\
  \ **保存** 按钮以创建新的 **FlightDescription** 实例。\n\n5. 现在，选择 **创建新的 Flight** 菜单选项以查看创建新\
  \ `Flight` 实例的表单，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_332_0.png)\n\n\
  6. 在 **到达日期** 和 **出发日期** 字段中设置日期，并在标记为 **航班描述** 的组合框中选择新创建的 `FlightDescription`。将\
  \ **航班号** 字段的值设置为 **MYFLT-101**。现在，单击 **保存** 按钮在数据库中创建新的 `Flight` 实例。\n\n7. 在给定的表单中，您可能会注意到，在\
  \ Roo 生成的 Flight Booking Spring Web MVC 应用程序中，我们可以设置到达和出发日期，但无法设置航班的到达或出发时间。这是因为\
  \ Roo 生成的 Spring Web MVC 应用程序使用 Dijit 库的 dijit.form.DateTextBox 组件在 JSPX 视图中渲染 JPA\
  \ 实体的 java.util.Date 类型字段。您可以通过修改 Roo 安装的 datetime.tagx 标签（请参阅 flightapp-web 的 WEB-INF/tags/form/fields\
  \ 目录）或创建自己的自定义标签来修改此行为，该自定义标签将 java.util.Date JPA 字段渲染为表单字段，同时使用 dijit.form.DateTextBox（用于选择日期）和\
  \ dijit.form.TimeTextBox（用于选择时间）。这样，用户就可以为该字段选择日期和时间值。\n\n8. 由于我们已经创建了 `FlightDescription`\
  \ 实例和关联的 `Flight` 实例，是时候在 MYFLT-101 航班上创建预订了。选择 **创建新的 Booking** 菜单选项以查看创建新 `Booking`\
  \ 实例的表单，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_332_1.png)\n\n\n\n\n9.\
  \ 从**Flight**字段中选择MYFLT-101航班号，并在**Booked By**字段中输入一个名称。如果您现在单击**Save**按钮以保存Booking实例，您将收到**Access\
  \ denied to admin**消息，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_333_0.png)\n\
  \n显示访问被拒绝消息是因为ROLE_ADMIN_USER角色的用户没有权限调用Booking JPA实体的persist方法。选择**Logout**超链接以从Flight\
  \ Booking应用程序注销。\n\n10. 现在，从菜单选项中选择**Create new Booking**选项。Flight Booking应用程序会要求您登录，因为所有菜单选项仅对经过身份验证的用户可用。使用名称**ashish**和密码**ashish**登录。用户**ashish**具有ROLE_APP_USER角色。\n\
  \n11. 如第五步所述创建一个新的Booking实例。这一次，Booking实例创建成功，因为ROLE_APP_USER有权调用Booking JPA实体的persist方法。\n\
  \n12. 现在，选择**Create new Flight Description**菜单选项。这将显示**Access denied to ashish**消息，如下所示：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_333_1.png)\n\n显示访问被拒绝消息是因为Flight Booking应用程序的Web请求安全限制用户访问与Flight和FlightDescription\
  \ JPA实体相关的菜单选项。另外，如果您以**ashish**身份登录并尝试修改或删除现有的Booking实例，那么应用程序将拒绝您的访问。原因在于，只有具有ROLE_ADMIN_USER角色的用户才有权调用Booking\
  \ JPA实体的merge和remove方法。\n\n## 工作原理...\n\n在“为您的应用程序配置Spring Security”配方中，我们讨论了由`security\
  \ setup`命令生成的Spring Security配置。由于由`security setup`命令创建的配置仅有助于我们开始向应用程序添加安全性，因此本配方扩展了由`security\
  \ setup`命令创建的配置，以演示如何将身份验证和授权快速集成到Roo生成的Web应用程序中。在本节中，我们将查看我们对`security setup`命令生成的配置和工件所做的哪些修改或添加，以创建一个安全感知的Flight\
  \ Booking应用程序。\n\n让我们先了解如何设置Apache Directory Server作为Flight Booking应用程序的身份验证源。\n\
  \n## 设置嵌入式Apache Directory Server\n\nSpring Security命名空间提供了一个`<ldap-server>`元素，用于配置要对其进行身份验证的外部LDAP服务器的位置。它也可用于创建嵌入式Apache\
  \ Directory Server实例。如果指定了`<ldap-server>`元素的url属性，则表示正在使用外部LDAP服务器进行身份验证。如果未指定url属性，则将创建一个嵌入式Apache\
  \ Directory Server实例。\n\n`flightapp-web`项目的`applicationContext-security.xml`文件配置了嵌入式Apache\
  \ Directory Server实例，如下所示：\n\n```xml\n<ldap-server ldif=\"classpath:application_users.ldif\"\
  \nroot=\"dc=sample,dc=com\" />\n```\n\nldif属性指定LDIF（LDAP数据交换格式）文件的位置，该文件包含嵌入式LDAP服务器加载的用户信息。您将在`flightapp-web`项目的`WEB-INF/classes`目录中找到`application_users.ldif`文件。root属性指定LDAP目录树的根。\n\
  \n以下图显示了由`application_users.ldif`文件定义的LDAP目录树：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_334_0.png)\n\
  \n给定的图显示，用户组administrator和appuser定义在ou=groups下，应用程序用户admin和ashish定义在ou=users下。用户ashish的DN（区别名）为uid=ashish,ou=users,dc=sample,dc=com，用户admin的DN为uid=admin,ou=users,dc=sample,dc=com。administrator组条目的DN为cn=administrator,ou=groups,dc=sample,dc=com，appuser组条目的DN为cn=appuser,ou=groups,dc=sample,dc=com。\n\
  \n定义在ou=groups下的条目的uniqueMember属性标识属于该组的应用程序用户。例如，在cn=administrator条目中，uniqueMember属性值为uid=admin,ou=users,dc=sample,dc=com（用户admin的DN），这意味着admin用户属于administrator组。同样，ashish属于appuser组。\n\
  \nou=groups下条目的businessCategory属性标识属于该组的用户的角色。如给定的图所示，用户admin的角色是admin_user，用户ashish的角色是app_user。\n\
  \n由于Flight Booking应用程序使用嵌入式Apache Directory Server，因此已将以下JAR依赖项添加到flightapp-web项目的pom.xml文件中：\n\
  \n- apacheds-protocol-shared\n- apacheds-protocol-ldap\n- apacheds-core-entry\n\
  - apacheds-core\n- apacheds-server-jndi\n- shared-ldap\n\n> 由于Spring Security支持嵌入式Apache\
  \ Directory Server的1.5.5版本，因此所有给定的JAR文件均属于1.5.5版本。\n\n由于我们使用Spring Security的LDAP支持，因此spring-security-ldap\
  \ JAR依赖项也已添加到pom.xml文件中。\n\n## 对LDAP服务器进行身份验证\n\n要对嵌入式LDAP服务器进行身份验证，已将以下配置添加到applicationContext-security.xml文件中：\n\
  \n```xml\n<authentication-manager>\n<authentication-provider>\n<ldap-user-service\
  \ group-search-filter=\"uniqueMember={0}\"\n group-search-base=\"ou=groups\"\n user-search-base=\"\
  ou=users\"\n user-search-filter=\"uid={0}\"\n group-role-attribute=\"businessCategory\"\
  \ />\n</authentication-provider>\n</authentication-manager>\n```\n\n<ldap-user-service>配置了LdapUserDetailsService（我们之前讨论过的UserDetailsService的一个实现），它从LDAP服务器加载包含用户名、密码和角色的用户详细信息。身份验证是通过将用户输入的密码与LdapUserDetailsService实例加载的用户详细信息进行比较来执行的。\n\
  \n<ldap-user-service>元素接受以下属性：\n\n- user-search-base: 指定执行用户搜索的目录树部分。值ou=users表示将在定义在DN下的条目上执行搜索，即ou=users,dc=sample,dc=com。\n\
  \n- user-search-filter: 它指定用于在目录树中搜索用户的过滤条件。值uid={0}表示搜索uid属性值等于用户在登录表单中输入的用户名的用户条目。值{0}将被用户在登录表单中输入的用户名替换。\n\
  \n- group-search-base: 它指定执行组搜索的目录树部分。值ou=groups表示将在定义在DN下的条目上执行搜索，即ou=groups,dc=sample,dc=com。\n\
  \n- group-search-filter: 它指定用于在目录树中搜索组的过滤条件。值uniqueMember={0}表示搜索uniqueMember属性值等于用户DN的组条目。\n\
  \n如果用户ashish尝试登录Flight Booking应用程序，则将使用user-search-base和 user-search-filter属性的值来搜索用户。这将返回DN为uid=ashish,ou=users,dc=sample,dc=com的条目。现在，将使用group-search-filter和group-search-base属性的值来搜索uniqueMember属性值为uid=ashish,ou=users,dc=sample,dc=com的组条目。这将返回cn=appuser,ou=groups,dc=sample,dc=com条目，因为它包含值为uid=ashish,ou=users,dc=sample,dc=com的uniqueMember属性。\n\
  \n- group-role-attribute: 它指定用作角色名称的组条目属性。由于group-role-attribute的值是businessCategory，如果为身份验证用户返回的组条目是cn=administrator,ou=groups,dc=sample,dc=com，那么用户的角色是admin_user——即该条目的businessCategory属性的值。\n\
  \n\n\n\n需要注意的是，Spring Security的LDAP身份验证机制默认会在身份验证后返回的角色名称前添加ROLE_前缀。因此，如果admin用户对航班预订应用程序进行身份验证，那么它获得的不是admin_user角色，而是ROLE_ADMIN_USER角色。同样，用户ashish获得的是'ROLE_APP_USER'角色。\n\
  \n现在让我们看看如何为航班预订应用程序配置Web请求安全。\n\n## 配置Web请求安全\n\n`security`命名空间的以下`<http>`元素显示了如何在flightapp-web项目的applicationContext-security.xml文件中配置Web请求安全：\n\
  \n```xml\n<http auto-config=\"true\" use-expressions=\"true\">\n<access-denied-handler\
  \ error-page=\"/accessdenied\" />\n<form-login ... />\n<logout logout-url=\"/resources/j_spring_security_logout\"\
  \ />\n<intercept-url pattern=\"/flights/**\"\naccess=\"hasRole('ROLE_ADMIN_USER')\"\
  \ />\n<intercept-url pattern=\"/flightdescriptions/**\"\naccess=\"hasRole('ROLE_ADMIN_USER')\"\
  \ />\n<intercept-url pattern=\"/bookings/**\"\naccess=\"hasAnyRole('ROLE_APP_USER','ROLE_ADMIN_USER')\"\
  \ />\n<intercept-url pattern=\"/accessdenied/**\"\naccess=\"hasAnyRole('ROLE_APP_USER',\
  \ 'ROLE_ADMIN_USER')\" />\n</http>\n```\n\n与前面的示例一样，我们讨论了Roo生成的applicationContext-security.xml文件中的`<http>`元素；但这里我们只关注专门为满足flightapp-web应用程序的Web安全要求而添加的配置元素。在给定代码中，我们添加了以下元素来为航班预订应用程序配置Web请求安全：\n\
  \n- `<access-denied-handler>`：它配置当用户请求的页面被拒绝访问时向用户显示的错误页面。error-page属性指定错误页面的URL。webmvc-config.xml中的`<mvc:view-controller\
  \ path=\"/accessdenied\"/>`条目配置ParameterizableViewController，负责渲染拒绝访问页面——位于`/WEB-INF/views`目录中的accessdenied.jspx。\n\
  \n- `<intercept-url>`：它定义航班预订应用程序的URL模式和相应的访问权限。让我们来看看为航班预订应用程序定义的每个`<intercept-url>`元素：\n\
  \n```xml\n<intercept-url pattern=\"/flights/**\"\naccess=\"hasRole('ROLE_ADMIN_USER')\"\
  \ />\n```\n\n- 模式/flights/**指的是专门用于管理Flight JPA实体实例的所有Web页面。hasRole('ROLE_ADMIN_USER')表达式指定，专门用于管理Flight\
  \ JPA实体实例的页面只能由具有ROLE_ADMIN_USER角色的用户访问。\n\n```xml\n<intercept-url pattern=\"/flightdescriptions/**\"\
  \naccess=\"hasRole('ROLE_ADMIN_USER')\" />\n```\n\n- 模式/flightdescriptions/**指的是专门用于管理FlightDescription\
  \ JPA实体实例的所有Web页面。hasRole('ROLE_ADMIN_USER')表达式指定，专门用于管理FlightDescription JPA实体实例的页面只能由具有ROLE_ADMIN_USER角色的用户访问。\n\
  \n```xml\n<intercept-url pattern=\"/bookings/**\"\naccess=\"hasAnyRole('ROLE_APP_USER',\
  \ 'ROLE_ADMIN_USER')\" />\n```\n\n- 模式/bookings/**指的是专门用于管理Booking JPA实体实例的所有Web页面。hasAnyRole('ROLE_APP_USER',\
  \ 'ROLE_ADMIN_USER')表达式指定，专门用于管理Booking JPA实体实例的页面只能由具有ROLE_ADMIN_USER或ROLE_APP_USER角色的用户访问。\n\
  \n```xml\n<intercept-url pattern=\"/accessdenied/**\"\naccess=\"hasAnyRole('ROLE_APP_USER',\
  \ 'ROLE_ADMIN_USER')\" />\n```\n\n- 模式/accessdenied/**指的是显示**拒绝访问**...消息的Web页面。hasAnyRole('ROLE_APP_USER',\
  \ 'ROLE_ADMIN_USER')表达式指定，拒绝访问页面可供具有ROLE_ADMIN_USER或ROLE_APP_USER角色的用户访问。这一点很重要，因为拒绝访问页面不应对匿名用户开放。\n\
  \n现在让我们看看如何在航班预订应用程序中配置方法级安全。\n\n## 配置方法级安全\n\n航班预订应用程序中的方法级安全由applicationContext-security.xml文件中的`<global-method-security>`元素启用，如下所示：\n\
  \n```xml\n<global-method-security mode=\"aspectj\"\n secured-annotations=\"enabled\"\
  />\n```\n\nmode属性值指定是使用Spring AOP（它会代理目标对象）还是AspectJ（Spring的AspectJ安全切面会在加载时或编译时织入类中）来保护方法。由于Booking\
  \ JPA实体是在Spring容器之外创建的，要使用Spring的@Secured注解（将在下一节中讨论）来保护由Booking JPA实体定义的方法，需要使用AspectJ。mode属性的值aspectj指示Spring将AnnotationSecurityAspect（可在Spring\
  \ Security的spring-security-aspects JAR文件中找到）织入使用@Secured注解的类中。secured-annotations属性指定是否为应用程序上下文启用或禁用@Secured注解的使用。enabled值表示Spring\
  \ Security将保护所有使用@Secured方法级注解的方法。Spring还支持使用JSR-250安全注解、安全表达式（如hasRole、hasPermission等）以及<global-method-security>元素的<protect-pointcut>子元素来实现方法级安全。您可以结合使用不同的方法来在应用程序中实现方法级安全。\n\
  \n由于我们使用AspectJ模式为航班预订应用程序实现方法级安全，因此已将spring-security-aspects JAR的依赖项添加到pom.xml文件中，并更新了pom.xml文件中的AspectJ编译器插件配置以包含spring-security-aspects，如下所示：\n\
  \n```xml\n<plugin>\n <groupId>org.codehaus.mojo</groupId>\n <artifactId>aspectj-maven-plugin</artifactId>\n\
  \ ...\n <configuration>\n <outxml>true</outxml>\n <aspectLibraries>\n <aspectLibrary>\n\
  \ <groupId>org.springframework</groupId>\n <artifactId>spring-aspects</artifactId>\n\
  \ </aspectLibrary>\n <aspectLibrary>\n <groupId>org.springframework.security</groupId>\n\
  \ <artifactId>spring-security-aspects</artifactId>\n </aspectLibrary>\n </aspectLibraries>\n\
  \ ...\n </configuration>\n </plugin>\n```\n\n`<aspectLibrary>`元素指定包含切面的JAR文件。spring-aspects\
  \ JAR包含用于织入@Transactional支持的切面，spring-security-aspects JAR包含用于在类中织入@Secured支持的切面。\n\
  \n> 您还可能会注意到，航班预订应用程序中使用了Spring Security版本3.1.0 RC1，因为3.1版本之前的spring-security架构不支持`<global-method-security>`元素的mode属性。\n\
  \n既然我们已经了解了如何为航班预订应用程序配置方法级安全，现在可以使用@Secured注解来标注Booking JPA实体方法了。\n\n## 向JPA实体方法添加@Secured注解\n\
  \nSpring Security的@Secured注解可用于方法级，以防止未经授权的访问方法。@Secured注解指定授权调用该方法的用户角色。\n\n在Roo生成的应用程序中，向JPA实体方法添加Spring\
  \ Security的@Secured注解是一个比较复杂的过程。Roo在*_Roo_Entity.aj AspectJ ITD文件中定义JPA实体方法，不建议应用程序开发人员修改该文件。要向JPA实体方法添加@Secured注解，请执行push-in重构（请参阅第7章）以将方法移动到实体的Java类中，或者简单地将方法从AspectJ文件复制到实体的Java类中。例如，对于Booking\
  \ JPA实体，persist方法已从Booking_Roo_Entity.aj文件复制到Booking.java文件，如下所示：\n\n```java\n@RooEntity(identifierColumn\
  \ = \"BOOKING_ID\")\npublic class Booking {\n    @PersistenceContext\n    transient\
  \ EntityManager entityManager;\n    ...\n    @Transactional\n    @Secured(\"ROLE_APP_USER\"\
  )\n    public void persist() {\n        if (this.entityManager == null)\n      \
  \      this.entityManager = entityManager();\n        this.entityManager.persist(this);\n\
  \    }\n\n    public static final EntityManager entityManager() {\n        EntityManager\
  \ em = new Booking().entityManager;\n        ...\n        return em;\n    }\n}\n\
  \n\n给定的代码显示，`persist` 方法已从 `Booking_Roo_Entity.aj` 复制到 `Booking.java` 文件中。`@Secured`\
  \ 注解已添加到 `persist` 方法，以使其安全。\n\n需要注意的是，从 AspectJ ITD 复制方法到 Java 文件 *不需要* 同时移动依赖的方法和属性。例如，将\
  \ `persist` 方法从 `Booking_Roo_Entity.aj` 移动到 `Booking.java` *不需要* 移动 `entityManager`\
  \ 属性和 `entityManager()` 方法，如代码所示。这样做是为了简化代码理解。\n\n## 在 GAE 上部署 GWT 应用程序\n\nGAE（Google\
  \ App Engine）是 Google 提供的云计算平台，为部署 Web 应用程序提供基础架构。在本配方中，我们将探讨 Roo 如何简化为 GAE 开发应用程序。我们还将了解如何创建和部署\
  \ Roo 脚手架生成的 GWT 应用程序。在 *在 GAE 上部署 Spring Web MVC 应用程序* 配方中，我们将了解可以部署到 GAE 的 Spring\
  \ Web MVC 应用程序。\n\n## 准备工作\n\n如果你只想使用适用于 Java 的 App Engine SDK 在本地运行 GWT 应用程序，那么你不需要注册\
  \ Google App Engine 并创建 *应用程序标识符*。如果你想将应用程序部署到 GAE，请按照此处提到的步骤为你的应用程序创建应用程序标识符。\n\
  \n- 1. 通过访问以下网址注册免费的 Google App Engine 账户：`http://appengine.google.com`。登录后，你将看到以下欢迎页面：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_341_0.png)\n\n- 2. 现在，你需要创建一个唯一标识你的应用程序并用于在\
  \ GAE 上部署应用程序的 *应用程序标识符*。单击 **Create Application** 按钮，它将要求你选择国家信息和手机号码以生成验证码，如下所示：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_342_0.png)\n\n- 3. 提供通过短信接收到的验证码后，你可以按以下屏幕截图所示创建应用程序标识符：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_342_1.png)\n\n- 4. 为 **应用程序标识符** 字段输入一个唯一值，并为\
  \ **应用程序标题** 输入一个值。如给定的屏幕截图所示，应用程序标识符名称会添加到 **.appspot.com** 之前以形成访问应用程序的 URL。因此，如果你的唯一标识符是\
  \ **myappid**，那么在 GAE 上部署应用程序后，可以通过访问 `http://myappid.appspot.com` 来访问它。\n\n现在，我们已准备好创建要部署到\
  \ GAE 的 GWT 应用程序。\n\n在 `C:\\roo-cookbook` 目录内创建子目录 `ch06-gae-gwt`，并从 `C:\\roo-cookbook\\\
  ch06-gae-gwt` 启动 Roo shell。\n\n## 操作步骤...\n\n要创建 Roo 脚手架生成的 GWT 应用程序并将其部署到 GAE，请按照此处给出的步骤操作：\n\
  \n- 1. 使用 project 命令创建 flightapp-gae-gwt 项目：\n\n```\n... roo project --topLevelPackage\
  \ sample.roo.flightapp --java 6 --projectName flightapp-gae-gwt\n```\n\n- 2. 使用\
  \ persistence setup 命令设置 DataNucleus 作为持久化提供程序，并将 GOOGLE_APP_ENGINE 设置为数据库。applicationId\
  \ 参数是可选的，如果你只想在本地测试应用程序，则不需要指定它。\n\n```\n... roo persistence setup --provider DATANUCLEUS\
  \ --database GOOGLE_APP_ENGINE --applicationId <your application identifier>\n```\n\
  \n```\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\appengine-web.xml\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\logging.properties\nUpdated SRC_MAIN_RESOURCES\\log4j.properties\n```\n\
  \n```\nUpdated ROOT\\pom.xml [Added property 'gae.home' with value '${user.home}/.m2/repository/com/google/appengine/appengine-java-sdk/1.4.0/appengine-java-sdk-1.4.0']\n\
  ```\n\n```\nUpdated ROOT\\pom.xml [Added dependencies com.google.appengine.orm:datanucleus-appengine:1.0.7.final...]\n\
  ```\n\n```\nUpdated ROOT\\pom.xml [Added plugin maven-gae-plugin]\n```\n\n```\n\
  Updated ROOT\\pom.xml [Added plugin maven-datanucleus-plugin]\n```\n\n为了简洁，给定的输出仅显示\
  \ Roo 执行的 GAE 特定操作。\n\n- 3. 创建 FlightDescription JPA 实体并向其添加字段，如下所示：\n\n```\n...\
  \ roo entity --class ~.domain.FlightDescription --identifierType java.lang.Long\
  \ --testAutomatically\n```\n\n```\n... roo field string --fieldName origin --notNull\n\
  ```\n\n```\n... roo field string --fieldName destination --notNull\n```\n\n```\n\
  ... roo field number --type java.lang.Float --fieldName price --notNull\n```\n\n\
  - 4. 使用 `gwt setup` 命令生成 GWT 应用程序脚手架：\n\n```\n... roo> gwt setup\n```\n\n- 5. 如果你想将\
  \ `flightapp-gae-gwt` 导入 Eclipse IDE，请执行 `perform eclipse` 命令：\n\n```\n... roo>\
  \ perform eclipse\n```\n\n- 6. 退出 Roo shell 并执行 Maven GAE 插件的 `gae:run` 目标，以便在随适用于\
  \ Java 的 App Engine SDK 捆绑的 Google App Engine 开发 Web 服务器上在本地运行 `flightapp-gae-gwt`\
  \ 应用程序，如下所示：\n\n```\nC:\\roo-cookbook\\ch06-gae-gwt> mvn gae:run\n```\n\n- 7. 当我们执行\
  \ `persistence setup` 命令时，Maven GAE 插件已在 `flightapp-gae-gwt` 项目的 `pom.xml` 文件中配置。开发服务器成功启动后将显示以下消息：服务器正在\
  \ `http://localhost:8080/` 上运行\n\n- 8. 现在，打开你喜欢的 Web 浏览器并访问 `http://localhost:8080`\
  \ 以访问 GWT `flightapp-gae-gwt` Web 应用程序，该应用程序允许你对 `FlightDescription` JPA 实体执行 CRUD\
  \ 操作，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_344_0.png)\n\n- 9. 在本地测试应用程序后，你可以通过执行\
  \ Maven GAE 插件的 `gae:deploy` 目标将 flightapp-gae-gwt 应用程序部署到 GAE，如下一命令所示。如果你没有创建应用程序标识符，并将其指定为\
  \ persistence setup 命令的 applicationId 参数的值，那么此步骤将失败。\n\n```\nC:\\roo-cookbook\\\
  ch06-gae-gwt> mvn gae:deploy\n```\n\nBeginning server interaction for <your-application-identifier>...\n\
  ...\nEmail: <email-id>@gmail.com\nPassword for <email-id>@gmail.com:\n...\n\n- 10.\
  \ 如给定输出所示，在部署应用程序时，你需要提供用于注册 Google App Engine 的电子邮件地址和相应密码。\n\n- 11. 一旦 flightapp-gae-gwt\
  \ 应用程序成功部署到 GAE，你可以通过以下 URL 访问它：\n\nhttp://<your-application-identifier>.appspot.com\n\
  \n由于 flightapp-gae-gwt 应用程序是安全应用程序，你将需要使用你的 Google 账户或 OpenID 凭据登录。\n\n## 工作原理...\n\
  \n`persistence setup` 命令会判断，如果 database 参数的值为 GOOGLE_APP_ENGINE，则目标部署环境为 Google\
  \ App Engine。如果 database 参数的值为 GOOGLE_APP_ENGINE，则必须将 DATANUCLEUS 指定为 provider 参数的值。\n\
  \n你可能会疑惑，为什么必须指定持久化提供程序为 DataNucleus 且数据库为 GOOGLE_APP_ENGINE。其实，Google App Engine\
  \ 使用一种专有的无模式对象数据存储（即 BigTable）来持久化应用程序数据。Java 应用程序可以通过 DataNucleus App Engine 插件（这不是\
  \ Maven 插件，而是 DataNucleus 插件）使用 JPA 或 JDO 访问 BigTable 数据存储。DataNucleus 是一个独立产品，允许使用\
  \ JDO 和 JPA API 访问数据存储（包括 RDBMS、Excel、XML、LDAP 等等）。此外，DataNucleus App Engine 插件由\
  \ Google 开发和维护，专门用于与 GAE 配合使用。因此，可以说，通过使用 DataNucleus，开发人员可以在其应用程序中使用 JDO 或 JPA\
  \ API 来访问或持久化数据，而不考虑应用程序使用的数据存储。如果你的应用程序使用不同类型的数据源，这可能特别有用。\n\n\n\n\n\n在响应持久化设置时，Roo\
  \ 执行以下操作：\n\n- 在 `WEB-INF` 目录中创建 `appengine-web.xml` 文件\n- 在 `pom.xml` 中添加对 DataNucleus\
  \ `App Engine` 插件的依赖\n- 在 `pom.xml` 中配置 Maven `GAE` 插件\n- 在 `pom.xml` 中配置 Maven\
  \ `DataNucleus` 插件\n- 为 Java 日志记录 API 创建 `logging.properties` 配置\n- 在 `META-INF`\
  \ 目录中创建 `persistence.xml` 文件，该文件提供持久化提供程序（在本例中为 `DataNucleus`）信息\n- 在 `META-INF/spring`\
  \ 目录中创建 `applicationContext.xml` 文件，该文件包含事务管理器和 JPA `EntityManagerFactory` 定义\n\n\
  现在让我们来看看 `appengine-web.xml` 文件和 Roo 配置的插件。\n\n## appengine-web.xml\n\n`appengine-web.xml`\
  \ 是 GAE 特定的配置文件，用于指定应用程序标识符、应用程序版本、应用程序中的静态文件和资源文件、系统属性等。以下清单显示了 Roo 为 `flightapp-gae-gwt`\
  \ 项目生成的 `appengine-web.xml` 内容：\n\n```\n<appengine-web-app xmlns=\"http://appengine.google.com/ns/1.0\"\
  >\n    <application>myappid</application>\n    <version>1</version>\n    <sessions-enabled>true</sessions-enabled>\n\
  \    <system-properties>\n        <property name=\"java.util.logging.config.file\"\
  \n        value=\"WEB-INF/logging.properties\"/>\n        <property\n        name=\"\
  appengine.orm.disable.duplicate.emf.exception\"\n        value=\"false\"/>\n   \
  \ </system-properties>\n</appengine-web-app>\n```\n\n`<appengine-web-app>` 是 `appengine-web.xml`\
  \ 的根元素。`<application>` 元素指定应用程序标识符，其值来自 `persistence setup` 命令的 `applicationId`\
  \ 参数。\n\n`<version>` 元素指定您在 GAE 上部署的应用程序代码的版本标识符。当您想要在将应用程序设置为对用户可访问的默认版本之前，先在 GAE\
  \ 上测试已部署的应用程序时，应用程序版本标识符尤其有用。假设，您已经在 GAE 上部署了版本 1 的航班预订应用程序。现在，您对应用程序代码进行了一些更改，以修复错误或添加/修改应用程序功能。要在\
  \ GAE 上测试修改后的应用程序，请将 `<version>` 元素更改为不同的值，假设为 2，并使用 Maven GAE 插件的 gae:deploy 目标（稍后介绍）在\
  \ GAE 上部署应用程序。GAE 使用 `<version>` 元素的值来确定现有应用程序代码是否需要由新部署的应用程序代码替换，或者创建新版本的应用程序代码。由于新部署的航班预订应用程序代码版本为\
  \ 2，而现有应用程序代码版本为 1，因此 GAE 会创建新版本的应用程序，您可以通过访问以下 URL 来访问该应用程序：http://<app-version>.latest.<application-id>.appspot.com。假设航班预订应用程序的应用程序标识符为\
  \ myappid，部署的版本为 2，则 URL 变为 http://2.latest.myappid.appspot.com。\n\n`<sessions-enabled>`\
  \ 元素启用 GAE 的会话持久化功能，即会话数据被持久化到 App Engine 的数据存储中。因此，如果您使用 HttpSession 的 setAttribute\
  \ 方法在 Web 应用程序中设置会话数据，则该数据会被存储在 App Engine 的数据存储中。由于会话对象被持久化，您在会话中设置的对象必须实现 java.io.Serializable\
  \ 接口。\n\n`<system-properties>` 元素定义应用程序可用的系统属性。App Engine 支持通过 Java 的 Logging API\
  \ 进行应用程序日志记录（请参阅 java.util.logging 包）。日志配置是从文件中读取的，该文件指定为 java.util.logging.config.file\
  \ 系统属性的值。在 flightapp-gae-gwt 项目的 appengine-web.xml 文件中，`<system-properties>` 元素的\
  \ `<property>` 子元素指定 java.util.logging.config.file 系统属性的值为 WEB-INF/logging.properties。同样，值为\
  \ true 的 appengine.orm.disable.duplicate.emf.exception 系统属性指示 App Engine 在应用程序尝试为持久化单元创建多个\
  \ javax.persistence.EntityManagerFactory 实例时不引发异常。默认情况下，App Engine 期望每个持久化单元只存在一个\
  \ EntityManagerFactory 实例，尝试创建重复的 EntityManagerFactory 实例会导致异常。\n\n## Maven GAE\
  \ 插件\n\nMaven GAE 插件通过提供目标，简化了为 App Engine 开发 Java 应用程序的过程，这些目标有助于下载和解压缩 App Engine\
  \ SDK、启动和停止 App Engine 开发服务器、将应用程序部署到 App Engine、从 App Engine 检索应用程序日志等。\n\n以下清单显示了\
  \ flightapp-gae-gwt 项目的 pom.xml 中定义的特定于 Maven GAE 插件的配置：\n\n```\n<project ...>\n\
  ...\n<properties>\n...\n<gae.home>\n${user.home}/.m2/repository/com/google/appengine/\n\
  appengine-java-sdk/1.4.0/appengine-java-sdk-1.4.0\n</gae.home>\n</properties>\n\
  ...\n<plugin>\n<groupId>net.kindleit</groupId>\n<artifactId>maven-gae-plugin</artifactId>\n\
  <version>0.5.7</version>\n<configuration>\n<unpackVersion>1.4.0</unpackVersion>\n\
  </configuration>\n<executions>\n<execution>\n<phase>validate</phase>\n<goals>\n\
  <goal>unpack</goal>\n</goals>\n</execution>\n</executions>\n</plugin>\n</project>\n\
  ```\n\ngae.home 属性指定解压缩版本的 App Engine SDK 的位置。\n\n插件 `<configuration>` 的子元素 `<unpackVersion>`\
  \ 指定要解压缩的插件版本。`<execution>` 元素指定 Maven GAE 插件的 gae:unpack 目标在 validate 构建生命周期阶段执行。validate\
  \ 构建生命周期阶段是 Maven 验证项目是否正确并且所有构建所需信息均可用的阶段。gae:unpack 目标将 GAE SDK 解压缩到 gae.home\
  \ 属性指定的位置。\n\nSpring Roo 1.1.3 生成的 pom.xml 使项目依赖于 GAE SDK 1.4.0 和 Maven GAE 插件 0.5.7，如我们刚才看到的清单所示。在撰写本书时，GAE\
  \ SDK 的当前版本为 1.5.1，Maven GAE 插件的版本为 0.8.4。要更改 GAE SDK 的版本，请修改 gae.home 属性。要更改 Maven\
  \ GAE 插件的版本，只需修改配置 Maven GAE 插件的 `<plugin>` 元素的 `<version>` 子元素的值即可。如果您使用的是 Spring\
  \ Roo 1.1.5，则项目已使用 GAE SDK 1.5.1 和 Maven GAE 插件 0.8.4。\n\n以下表格指定了 Maven GAE 插件定义的一些目标：\n\
  \n| 目标 | 描述 |\n|---|---|\n| gae:run | 在 GAE 开发 Web 服务器上本地运行项目 |\n| gae:deploy |\
  \ 将应用程序上传到 GAE 服务器 |\n| gae:logs | 从 GAE 服务器检索应用程序日志 |\n| gae:version | 显示插件和 GAE\
  \ SDK 版本 |\n\n现在让我们来看看 Maven DataNucleus 插件及其在 GAE 应用程序中发挥的作用。\n\n## Maven DataNucleus\
  \ 插件\n\n要使类持久化，DataNucleus 期望该类必须实现 JDO 的 PersistenceCapable 接口。我们为什么现在要谈论 JDO 呢？嗯，这是因为\
  \ DataNucleus 对 JPA 的支持是建立在 JDO 之上的。这意味着，即使您使用 @Entity JPA 注释对域类进行了注释，DataNucleus\
  \ 也无法持久化它们。为了使开发人员无需在其域类中实现 PersistenceCapable 接口，DataNucleus 提供了一个增强器，该增强器作用于编译后的域类，并通过字节码增强实现\
  \ PersistenceCapable 接口。Maven DataNucleus 插件提供 datanucleus:enhance 目标，用于增强使用 @Entity\
  \ 注释的 JPA 类。以下代码显示了此过程：\n\n```\n<plugin>\n<groupId>org.datanucleus</groupId>\n<artifactId>maven-datanucleus-plugin</artifactId>\n\
  <version>1.1.4</version>\n<configuration>\n<mappingIncludes>**/*.class</mappingIncludes>\n\
  <enhancerName>ASM</enhancerName>\n<api>JPA</api>\n<mappingExcludes>**/GaeAuthFilter.class</mappingExcludes>\n\
  </configuration>\n<execution>\n<execution>\n<phase>compile</phase>\n<goals>\n```\n\
  \n\n```\n<goal>enhance</goal>\n</goals>\n</execution>\n</executions>\n</plugin>\n\
  ```\n\n在插件配置中，`<execution>` 元素指定 datanucleus:enhance 目标在编译构建生命周期阶段执行。因此，在编译 Java\
  \ 源文件时，Maven DataNucleus 插件会增强已编译的 JPA 领域类。`<mappingIncludes>` 元素指定应包含在增强中的类。`<mappingExcludes>`\
  \ 指定不应考虑用于增强的类。\n\n`<api>` 元素指定增强是针对 JPA 还是 JDO。由于在 flightapp-gae-gwt 项目中使用的是 JPA，`<api>`\
  \ 元素的值为 jpa。`<enhancerName>` 元素指定 ASM 作为值，这基本上是指 DataNucleus 用于增强字节码的 ASM 框架 (`http://asm.ow2.org/`)。\n\
  \n让我们来看看由 Roo 生成的 FlightDescription 实体：\n\n## 持久实体\n\n由于 GAE datastore 不是关系型数据库，您会发现，在使用关系型数据库的\
  \ JPA 时适用的一些概念，在将 JPA 与 GAE datastore 一起使用时将不再适用。\n\n以下代码显示了由 Roo 生成的 FlightDescription\
  \ JPA 实体。\n\n```\n@RooJavaBean\n@RooToString\n@RooEntity\npublic class FlightDescription\
  \ {\n\n    @NotNull\n    private String origin;\n\n    @NotNull\n    private String\
  \ destination;\n\n    @NotNull\n    private Float price;\n\n}\n```\n\n给定的代码显示，我们没有使用\
  \ `@Column` 和 `@Table` JPA 注解来标识保存实体实例的表以及持久实体字段映射到的表列。由于 GAE datastore 是无模式的，您无需指定表或列信息。您仍然可以使用\
  \ JSR 303 注解，例如本代码中的 `@NotNull`，来验证您的领域对象。\n\n以下代码显示了 FlightDescription_Roo_Entity.aj\
  \ AspectJ ITD 文件：\n\n```\nprivileged aspect FlightDescription_Roo_Entity {\n\n \
  \   declare @type: FlightDescription: @Entity;\n\n    @PersistenceContext\n    transient\
  \ EntityManager FlightDescription.entityManager;\n\n    @Id\n    @GeneratedValue(strategy\
  \ = GenerationType.IDENTITY)\n    @Column(name = \"id\")\n    private Long FlightDescription.id;\n\
  \n    @Version\n    @Column(name = \"version\")\n    private Integer FlightDescription.version;\n\
  \n    ...\n}\n```\n\n值得注意的是，主键生成策略指定为 GenerationType.IDENTITY。在 GAE 中，这意味着在相关事务完成或您显式调用\
  \ EntityManager 的 flush 方法之前，标识符值不会分配给 FlightDescription 实体。\n\n让我们来看看 flightapp-gae-gwt\
  \ 应用程序如何确保只有经过身份验证的用户才能访问它。\n\n## GAE 应用程序中的身份验证和授权\n\n与其他任何 Web 应用程序一样，flightapp-gae-gwt\
  \ 应用程序的 Web 请求安全约束在应用程序的 web.xml 文件中指定。以下清单显示了 flightapp-gae-gwt 应用程序 web.xml 文件中的\
  \ `<security-constraint>` 元素：\n\n```\n<security-constraint>\n<display-name>...</display-name>\n\
  <web-resource-collection>\n    <web-resource-name>...</web-resource-name>\n    <url-pattern>*.html</url-pattern>\n\
  </web-resource-collection>\n<auth-constraint>\n    <role-name>*</role-name>\n</auth-constraint>\n\
  </security-constraint>\n```\n\n`<url-pattern>` 指定任何匹配 `*.html` 模式的 URL 都受到保护，并需要身份验证。对于\
  \ flightapp-gae-gwt 应用程序，应用程序的主页是 index.html，它根据 `<url-pattern>` 元素指定的 URL 模式受到保护。由于对\
  \ flightapp-gae-gwt 应用程序的入口受到限制，用户在访问应用程序之前需要使用其 Google 账户凭据进行身份验证。`<role-name>`\
  \ 元素将 * 指定为值，这意味着任何经过身份验证的用户都可以访问该应用程序。如果您希望 GAE 上的应用程序也可供匿名用户访问，则从 web.xml 文件中删除\
  \ `<security-constraint>` 元素。\n\n如果从 flightapp-gae-gwt 项目的 web.xml 中删除 `<security-constraint>`\
  \ 元素并将应用程序上传到 GAE 服务器，您会发现尝试访问 flightapp-gae-gwt 应用程序仍会要求身份验证。这种行为背后的原因是 Roo 生成的\
  \ web.xml 文件中配置了 sample.roo.flightapp.server.gae.GaeAuthFilter Servlet 过滤器。GaeAuthFilter\
  \ 是一个由 Roo 生成的 Servlet 过滤器，用于检查用户是否已登录。如果用户未登录，则它会将用户重定向到 Google 账户登录页面。GaeAuthFilter.java\
  \ 中的以下代码清单显示了 GaeAuthFilter 类：\n\n```\nimport com.google.appengine.api.users.UserService;\n\
  import com.google.appengine.api.users.UserServiceFactory;\n\npublic class GaeAuthFilter\
  \ implements Filter {\n...\n\npublic void doFilter(...) ... {\n    UserService userService\
  \ =\n    UserServiceFactory.getUserService();\n    ...\n\nif (!userService.isUserLoggedIn())\
  \ {\n    String requestUrl = request.getHeader(\"requestUrl\");\n    if (requestUrl\
  \ == null) {\n    requestUrl = request.getRequestURI();\n    }\n    response.setHeader(\"\
  login\",\n    userService.createLoginURL(requestUrl));\n    response.sendError(HttpServletResponse.SC_UNAUTHORIZED);\n\
  \    return;\n}\n...\n}\n```\n\n在给定代码中，UserServiceFactory 是 GAE 特定的类，其 getUserService\
  \ 方法返回 UserService 的实例。UserService 接口定义了用于创建登录和注销 URL、获取当前登录用户详细信息、检查用户是否已登录等方法。在此代码中，GaeAuthFilter\
  \ 通过调用 isUserLoggedIn() 方法检查用户是否已登录。如果用户未登录，GaeAuthFilter 将使用 UserService 的 createLoginURL(..)\
  \ 方法创建登录 URL 并将用户重定向到该 URL。\n\n关于 GaeAuthFilter 另一个值得注意的有趣点是它的映射。以下清单显示了 web.xml\
  \ 文件中 GWT 的 RequestFactoryServlet 和 GaeAuthFilter 的映射：\n\n```\n<filter-mapping>\n\
  \  <filter-name>GaeAuthFilter</filter-name>\n  <url-pattern>/gwtRequest/*</url-pattern>\n\
  </filter-mapping>\n\n<servlet-mapping>\n  <servlet-name>requestFactory</servlet-name>\n\
  \  <url-pattern>/gwtRequest</url-pattern>\n</servlet-mapping>\n```\n\nGaeAuthFilter\
  \ 和 GWT 的 RequestFactoryServlet 的 `<url-pattern>` 元素显示，发送到 RequestFactoryServlet\
  \ 的 Web 请求会被 GaeAuthFilter 拦截。这确保了如果会话过期，应用程序用户将被重定向到 Google 账户登录页面。\n\nUserService\
  \ 提供了一个 getCurrentUser 方法，如果用户已登录，则返回 User 对象。User 对象包含经过身份验证的用户的用户 ID、昵称和电子邮件信息。如果您的应用程序需要捕获更多有关用户的信息（例如其首选项、地址等），则需要将此类信息作为应用程序数据的一部分来保存。\n\
  \n默认情况下，App Engine 定义的唯一角色是 admin，您可以将其指定为 `<role-name>` 元素的值。admin 角色分配给应用程序管理员，即您使用\
  \ GAE 的 Admin Console 添加的用户。Admin Console 让您对 GAE 上已部署的应用程序拥有完全控制权。它允许您管理 datastore、测试应用程序的不同版本、创建应用程序等等。您可以通过访问以下\
  \ URL 来访问 Admin Console：http://appengine.google.com。您可以使用 UserService 的 isUserAdmin\
  \ 方法来确定登录用户是否属于 admin 角色。\n\n尽管 GAE 仅支持 admin 角色，但您仍然可以通过引入应用程序特定角色，在 App Engine\
  \ 应用程序中实现基于角色的安全性。您可以将应用程序特定角色信息作为应用程序数据的一部分来保存。例如，您可以将 Spring Security 框架与 GWT\
  \ 或 Spring Web MVC 应用程序一起使用，以根据分配给用户的角色实现 Web 请求安全性和方法级安全性。\n\n\n\n\n\n## 在 GAE\
  \ 上部署 Spring Web MVC 应用程序\n\n自 Spring Roo 1.1.5 起，Roo 生成的 Spring Web MVC 应用程序无法在\
  \ GAE 上运行。其原因与 GAE 和 Roo 生成的 Spring MVC 应用程序所使用的 JSTL 版本不匹配有关。此外，Roo 生成的 JPA 实体仅支持非拥有关系（有关拥有关系和非拥有关系的信息，请参阅\
  \ http://code.google.com/appengine/docs/java/datastore/jdo/relationships.html）。在本示例中，我们将探讨一个\
  \ Spring 3.0 Web MVC 应用程序（该应用使用可在 GAE 上运行的 JSTL 标签），该应用由 FlightDescription 和 Flight\
  \ JPA 实体组成，并演示如何在 JPA 实体之间创建单向拥有一对多关系。FlightDescription 实体位于一对多关系的“一”端。\n\n如果您使用的是\
  \ Spring Roo 1.2.x，则 Roo 生成的 Spring Web MVC 应用程序可以成功部署到 GAE 上。\n\n## 准备工作\n\n如果您仅想使用适用于\
  \ Java 的 App Engine SDK 在本地运行 Spring Web MVC 应用程序，则无需注册 Google App Engine 并创建应用程序标识符。如果您想将应用程序部署到\
  \ GAE，请按照前面示例中描述的步骤操作，并确保修改 WEB-INF/appengine-web.xml 文件中的应用程序标识符。建议您将应用程序部署到 GAE\
  \ 服务器上，因为我们还将讨论管理控制台提供的某些功能。\n\n将随本书附带的 ch06-gae-spring-mvc.zip 文件解压到 C:\\roo-cookbook\
  \ 目录。解压 ZIP 文件将创建一个名为 ch06-gae-spring-mvc 的目录，其中包含 flightapp-gae-spring-mvc Eclipse\
  \ 项目。flightapp-gae-spring-mvc 项目使用 App Engine SDK 版本 1.4.2 和 Maven GAE Plugin 0.8.2。\n\
  \n## 操作步骤\n\n要在 GAE 上部署 Spring Web MVC 应用程序，请按照以下步骤操作：\n\n- 1. 打开命令提示符并进入 c:\\roo-cookbook\\\
  ch06-gae-spring-mvc 目录。执行 mvn gae:run 命令，将 flightapp-gae-spring-mvc 项目部署到 App Engine\
  \ 开发 Web 服务器：\n    C:\\roo-cookbook\\ch06-gae-spring-mvc> mvn gae:run\n\n- 2. 开发\
  \ Web 服务器成功启动后，打开 Web 浏览器并访问以下 URL：http://localhost:8080。如果看到以下页面，则表示您的 flightapp-gae-spring-mvc\
  \ 项目已成功部署：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_355_0.png)\n\n- 3. 给定的截图显示了我们的航班预订应用程序的主页，当前允许管理\
  \ Flight 和 FlightDescription 对象。选择 **管理航班描述** 超链接允许用户创建和查看 FlightDescription 实例。此外，它还允许用户添加与\
  \ FlightDescription 实例关联的子 Flight 实例。**管理航班** 选项允许用户创建和删除 Flight 实例。\n\n- 4. 选择\
  \ **管理航班描述** 选项以查看应用程序中的 FlightDescription 实例，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_355_1.png)\n\
  \n- 5. 由于我们尚未创建任何 FlightDescription 实例，表格显示 **未找到记录** 消息。\n\n- 6. 选择 **创建航班描述**\
  \ 选项以查看创建新 FlightDescription 实例的表单，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_355_2.png)\n\
  \n- 7. 按给定截图所示输入 **FlightDescription** 详细信息，然后单击 **创建** 按钮。新创建的 **FlightDescription**\
  \ 实例将显示在 **FlightDescription** 实例列表中，如下所示：\n\n| 出发地 | 目的地 | 价格 | 操作 |\n|---|---|---|---|\n\
  | NYC | DELHI | 1200 | 查看 删除 |\n\n- 8. **FlightDescription** 记录对应的 **查看** 按钮显示 **FlightDescription**\
  \ 详细信息以及与 **FlightDescription** 实例关联的 **Flight** 详细信息。**删除** 按钮将删除 **FlightDescription**\
  \ 实例以及关联的 **Flight** 实例。\n\n- 9. 单击 **主页** 链接返回应用程序的主页，并选择 **管理航班** 链接以查看 **Flight**\
  \ 实例，如下所示：\n\n| 航班名称 | 操作 |\n|---|---|\n| 未找到记录 | |\n\n- 10. 选择 **创建航班** 链接以查看创建\
  \ **Flight** 实例的表单，如下所示：\n\n| 字段 | 值 |\n|---|---|\n| 航班名称 | FLT-100 |\n| 航班描述 |\
  \ NYC - DELHI 仅需 1200 美元 |\n\n- 11. 将 **FLT-100** 输入为 **航班名称** 字段的值，并将 **NYC – DELHI\
  \ 仅需 1200 美元** 选择为 **航班描述** 字段的值。单击 **创建** 按钮以创建 **Flight** 实例（航班名称为 **FLT-100**），它是\
  \ **FlightDescription** 实例（出发地：NYC，目的地：DELHI，价格：1200）的子实例。同样，创建名为 **FLT-200**、**FLT-300**\
  \ 和 **FLT-400** 的航班。现在，如果您转到 **FlightDescription** 列表页面并单击 **查看** 按钮，则将看到新创建的 **Flight**\
  \ 实例作为 **NYC-DELHI-1200 FlightDescription** 实例的子实例，如下所示：\n\n| 航班描述 | | |\n|---|---|---|\n\
  | 出发地 | 目的地 | 价格 |\n| NYC | DELHI | 1200 |\n| 关联航班 | | |\n| 航班名称 | | |\n| FLT-100\
  \ | | |\n| FLT-200 | | |\n| FLT-300 | | |\n| FLT-400 | | |\n\n- 12. 给定的截图显示了与 FlightDescription\
  \ 实例关联的 Flight 实例。\n\n- 13. 如果您现在通过选择对应于 NYC-DELHI-1200 FlightDescription 实例的 Delete\
  \ 按钮（如下一个截图所示）来删除 FlightDescription 实例，则它也将删除关联的 Flight 实例。\n\n| 出发地 | 目的地 | 价格\
  \ | 操作 |\n|---|---|---|---|\n| NYC | DELHI | 1200 | 查看 删除 |\n\n## 工作原理\n\nGAE 数据存储是一个非关系型数据库，其中实体之间的关系被建模为拥有关系或非拥有关系。拥有关系基于父子关系的概念，其中子实例不能在没有父实例的情况下存在。在非拥有关系中，实例可以独立于与其他实体的关系而存在。\n\
  \n拥有关系最好可视化为树结构，其中树的根是一个实体实例，是所有实体的最终父实例。以下图示展示了一个拥有关系的示例，其中 FlightDescription 是根实体，Flight\
  \ 实体实例为其子实例，Booking 实体实例是 Flight 实体的子实例。\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_358_0.png)\n\
  \n在给定的图中，FlightDescription (NYC-DELHI-1200) 位于树的根部。Flight 实例 (FLT-100, FLT-200,\
  \ FLT-300, FLT-400) 是 FlightDescription (NYC-DELHI-1200) 实例的子实例。Booking (ashish,\
  \ greg) 实例是 Flight (FLT-400) 实例的子实例。如果在 App Engine 数据存储中存储的实体定义了这种父子关系，则这些实体被称为属于同一实体组。您可以将实体组视为树，树顶部是一个根实体，该根实体没有任何父实例。在此图中，FlightDescription\
  \ (NYC-DELHI-1200) 表示根实体。关于拥有关系的另一个重要点是，除了根实体外，实体组中的所有其他实体都不能在没有父实例的情况下创建。例如，Flight\
  \ 实体实例不能在没有 FlightDescription 实例的情况下存在，Booking 实例不能在没有 Flight 实例的情况下存在。\n\n在 GAE\
  \ 中，创建拥有关系会限制您可以为子实体定义的主键类型。其原因是，子实体实例除了需要知道其自身实体 ID 外，还需要知道其在实体组中的父实例。拥有关系中子实体的主键类型为\
  \ com.google.appengine.api.datastore.Key 或 com.google.appengine.api.datastore.Key\
  \ 的编码字符串形式。GAE 提供了一个 KeyFactory 类（将在本示例后面讨论），您可以使用它来创建 Key 实例，或将 Key 实例值转换为字符串（称为\
  \ Key 的编码形式）并反之亦然。\n\n\n\n\n\n在非拥有关系中，每个实体实例相互独立存在。例如，Student 和 Course 实体之间的关系是非拥有关系的一个示例。Student\
  \ 实体可以在没有 Course 的情况下存在，Course 实体也可以在没有 Student 的情况下存在。\n\n在我们的航班预订应用程序中，FlightDescription\
  \ 和 Flight 实体之间的关系是拥有关系的一个示例，其中 Flight 实体实例不能在没有 FlightDescription 实例的情况下存在。让我们现在看看在航班预订应用程序中，FlightDescription\
  \ 和 Flight 实体之间是如何创建拥有的一对多关系的。\n\n## 拥有关系\n\n下面的代码清单显示了 FlightDescription 实体的一些重要方法和属性：\n\
  \n```java\nimport com.google.appengine.api.datastore.Key;\nimport com.google.appengine.api.datastore.KeyFactory;\n\
  \n@Entity\npublic class FlightDescription {\n\t@Id\n\t@GeneratedValue(strategy =\
  \ GenerationType.IDENTITY)\n\t@Basic\n\tprivate Key flightDescriptionId;\n\n\t@Basic\n\
  \t@NotNull\n\tprivate String origin;\n\t...\n\n\t@OneToMany\n\tprivate List<Flight>\
  \ flights;\n\n\t...\n\n\t@Transactional\n\tpublic void persist() {\n\t\tif (this.entityManager\
  \ == null)\n\t\t\tthis.entityManager = entityManager();\n\t\tthis.entityManager.persist(this);\n\
  \t}\n\n\t@Transactional\n\tpublic static FlightDescription\n\tfindFlightDescription(String\
  \ key) {\n\t\treturn\n\t\t(FlightDescription)entityManager().createQuery(\"select\
  \ o\n\t\tfrom FlightDescription o where o.flightDescriptionId =\n\t\t:id\").setParameter(\"\
  id\",\n\t\tKeyFactory.stringToKey(key)).getSingleResult();\n\t}\n\t...\n\tpublic\
  \ String getFlightDescriptionKeyAsString() {\n\t\treturn KeyFactory.keyToString(flightDescriptionId);\n\
  \t}\n\t...\n}\n```\n\n给定的代码显示，FlightDescription 实体的主键类型为 com.google.appengine.api.datastore.Key。Key\
  \ 不仅保存实体的主键，还保存实体实例所属实体组的信息。由于 FlightDescription 表示一个根实体（即没有父实体），Key 字段不会包含实体组信息。带有\
  \ @OneToMany 注解的 flights 字段定义了 FlightDescription 和 Flight 实体之间的拥有关系。\n\n如果是非拥有关系，flights\
  \ 字段将采用以下形式：\n\n```\nprivate List<Key> flights;\n```\n\n在这里，flights 字段引用 Flight\
  \ 实体实例的主键。此外，该字段没有使用 @OneToMany 注解。\n\nFlightDescription 实体的 findFlightDescription\
  \ 方法接受 Key 的编码 String 值，以查找匹配的 FlightDescription。KeyFactory 类提供 keyToString 和 stringToKey\
  \ 方法，用于在 Key 与其编码的 String 形式之间进行相互转换。当你通过 Web 应用程序的用户界面在实体之间创建关系时，这尤其有用。用于获取 FlightDescription\
  \ 对象的查询使用了 KeyFactory 类，从其 String 表示形式获取 Key 并将其作为查询的一部分，如下所示：\n\n```\nentityManager().createQuery(\"\
  select o\nfrom FlightDescription o where o.flightDescriptionId =\n:id\").setParameter(\"\
  id\",\nKeyFactory.stringToKey(key)).getSingleResult();\n```\n\nFlightDescription\
  \ 的 persist 方法表明，你不需要设置主键的值。它由 App Engine 设置。\n\nFlightDescription 实体的 getFlightDescriptionKeyAsString\
  \ 方法使用 KeyFactory 类将实体的主键作为编码的 String 值返回。\n\n让我们现在看看如何对 Flight 实体进行建模。\n\n下面的代码清单显示了\
  \ Flight 实体值得注意的属性和方法：\n\n```java\n@Entity\npublic class Flight {\n\n    @Id\n \
  \   @GeneratedValue(strategy = GenerationType.IDENTITY)\n    @Basic\n    private\
  \ Key flightId;\n\n    @Basic\n    @NotNull\n    private String flightName;\n\n\
  \    private transient String encodedFlightDescriptionId;\n\n    @Transactional\n\
  \    public void persist() {\n        if (this.entityManager == null)\n        \
  \    this.entityManager = entityManager();\n\n        Key parentKey = KeyFactory.stringToKey(\n\
  \            encodedFlightDescriptionId);\n\n        Key flightKey = KeyFactory.createKey(parentKey,\n\
  \            Flight.class.getSimpleName(), flightName);\n\n        setFlightId(flightKey);\n\
  \        this.entityManager.persist(this);\n    }\n\n    public String getEncodedFlightDescriptionId()\
  \ {\n        return encodedFlightDescriptionId;\n    }\n\n    public String getFlightKeyAsString()\
  \ {\n        return KeyFactory.keyToString(flightId);\n    }\n}\n```\n\n在给定的代码中，`flightId`\
  \ 表示 `Flight` 实体的主键。`Flight` 实体的 `persist` 方法使用 `KeyFactory` 类的 `createKey` 方法来创建主键。`createKey(parent,\
  \ kind, name)` 方法接受 **父** 实体的主键信息（在 `Flight` 实体的情况下，`FlightDescription` 是父实体）、**种类**（类似于关系型数据库中表的概念）以及用于在\
  \ **种类** 中唯一标识实体的键的 **名称**。对于 `Flight` 实体的主键，`种类` 指的是实体类的简单名称：`Flight.class.getSimpleName()`，键的\
  \ `名称` 是 `Flight` 实体的 `flightName` 属性。因此，如果你使用 `flightName` 为 `FLT-100` 重新创建一个 `Flight`\
  \ 实体，它将覆盖现有的 `Flight (FLT-100)` 实体实例。GAE datastore 不支持复合主键，但你可以通过在创建键的 `名称` 时串联多个实体字段值来实现此目的。\n\
  \n`encodedFlightDescriptionId` 是作为 `Flight` 实体实例父实体的 `FlightDescription` 主键的 `String`\
  \ 形式。当用户从用户界面中选择 `FlightDescription` 以创建 `Flight` 实例时，将设置 `encodedFlightDescriptionId`\
  \ 的值，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_362_0.png)\n\n与 `FlightDescription\
  \ (NYC-DELHI-1200)` 实体实例对应的 `<option>` 元素呈现如下所示：\n\n```\n<option value=\"<string\
  \ value of Key>\">NYC-DELHI for only 1200 USD</option>\n```\n\n`value` 属性指定了 `FlightDescription`\
  \ 主键（类型为 `Key`）的 `String` 形式。因此，当用户单击 **创建** 按钮时，`Key` 的 `String` 值将绑定到 `Flight`\
  \ 实例的 `encodedFlightDescriptionId` 字段。\n\n`flightapp-gae-spring-mvc` 项目包含 `KeyEditor`\
  \ 属性编辑器类，该类使用 `KeyFactory` 在 `Key` 与 `String` 格式之间执行相互转换。使用此属性编辑器而不是 Spring `ConversionService`\
  \ 实现，是因为 `ConversionService` 实现目前无法与 Spring `form` 标签库的 `<options>` 标签一起工作。\n\n\
  让我们现在看看如何使用 Admin Console 管理 GAE datastore 中持久化的数据。\n\n## 使用 Admin Console 管理持久化数据\n\
  \n你可以使用 Admin Console 查看、编辑和删除应用程序在 GAE datastore 中持久化的数据。转到 http://appengine.google.com\
  \ 并登录，以查看你创建的应用程序，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_363_0.png)\n\
  \n给定的屏幕截图显示了我在 GAE 中创建的两个应用程序。roo-cookbook-spring-mvc 应用程序对应我们在本示例中看到的应用程序。选择该应用程序将显示该应用程序的\
  \ Dashboard，你可以在其中查看与应用程序相关的不同统计信息。我们只关心查看在 datastore 中保存的数据，因此从 Dashboard 中选择 Datastore\
  \ Viewer 选项。Datastore Viewer 显示你在 datastore 中保存的实体，如下一个屏幕截图所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_363_1.png)\n\
  \n给定的屏幕截图显示了我们创建的 `FlightDescription` kind 的数据。你可以使用 **查询** 选项卡使用 **GQL** 查询 datastore。你也可以删除或编辑实体实例。如果将\
  \ `kind` 更改为 `Flight`，则 Admin Console 将显示你创建的 `Flight` 实体，如下所示：\n\n| □ | ID/名称 |\
  \ 版本 | 航班名称 |\n|---|---|---|---|\n| □ | name=FLT-100 | 1 | FLT-100 |\n| □ | name=FLT-200\
  \ | 1 | FLT-200 |\n| □ | name=FLT-300 | 1 | FLT-300 |\n| □ | name=FLT-400 | 1 |\
  \ FLT-400 |\n\n给定的屏幕截图显示，为 `Flight` 实例主键设置的 `name` 在 **ID/名称** 列下显示。\n\n## 更多内容...\n\
  \n如果你正在为 App Engine 设计实体，请注意，在事务内你只能操作属于同一实体组的实体。因此，如果你有属于不同实体组的 `Student` 和 `Course`\
  \ 实体，则无法在单个事务中创建或更新它们。\n\n从 Spring Roo 1.1.3 开始，你只能在实体之间创建 _非拥有_ 关系。例如，如果你使用 `field\
  \ reference` 或 `field set` 命令添加关系字段，那么与 JPA 实体对应的 `*_Roo_JavaBean.aj` AspectJ ITD\
  \ 文件会从 JPA 实体 Java 源文件的相应字段中移除 `@OneToMany`、`@OneToOne`、`@ManyToOne` 或 `@ManyToMany`\
  \ 注解，从而产生一个 _非拥有_ 关系。下面的代码片段展示了 AspectJ ITD 文件如何从 Java 源文件中移除关系注解：\n\n```\nprivileged\
  \ aspect FlightDescription_Roo_JavaBean {\n\ndeclare @field: * FlightDescription.flights:\
  \ -@OneToMany;\n...\n}\n```\n\n\n\n\n\n给定代码显示，如果 FlightDescription 和 Flight 实体是使用\
  \ Spring Roo 创建的，那么 FlightDescription 的 flights 字段（指代 Flight 实体集合）上的 @OneToMany\
  \ 注解将被 FlightDescription_Roo_JavaBean.aj AspectJ ITD 文件删除。减号 (-) 表示 @OneToMany 注解将从\
  \ FlightDescription.java 文件中删除。\n\n## 另请参阅\n\n- 参阅《在 GAE 上部署 GWT 应用程序》示例，查看 App\
  \ Engine 上 GWT 应用程序的示例\n\n## 使用 Solr 为领域模型添加搜索功能\n\nApache Solr 是一个构建在 Apache Lucene\
  \ 搜索引擎库之上的开源搜索平台。Spring Roo 的 Solr 插件提供了将 Roo 生成的领域模型与 Solr 平台集成的支持。在本示例中，我们将了解\
  \ Roo 如何使用 SolrJ Java 客户端库将领域模型数据添加到 Solr 服务器中以建立索引，并根据用户提供的查询参数搜索领域模型数据。\n\n##\
  \ 准备工作\n\n要查看 Roo 对 Solr 的支持，您需要下载并运行 Solr 服务器，具体步骤如下：\n\n- 1. 从 Solr 网站下载 Solr\
  \ 服务器 1.4.0 版 ZIP 文件，并将包解压到一个目录。将解压后的目录称为 SOLR_HOME。\n- 2. 进入 SOLR_HOME\\example\
  \ 目录并启动 Solr 服务器：\n  C:...\\apache-solr-1.4.0\\example> java -jar start.jar\n- 3.\
  \ 打开网页浏览器，通过访问以下 URL 验证 Solr 服务器是否已成功启动：http://localhost:8983/solr/admin/\n\n现在，在\
  \ C:\\roo-cookbook 目录中创建一个名为 ch06-solr 的子目录，复制 ch06_web_app.roo 脚本，并从 C:\\roo-cookbook\\\
  ch06-solr 启动 Roo shell。\n\n## 操作步骤\n\n按照以下步骤添加搜索功能：\n\n- 1. 执行 ch06_solr.roo 脚本，如下所示：\n\
  \  roo> script --file ch06_web_app.roo\n\n该脚本创建一个包含 Flight 和 FlightDescription JPA\
  \ 实体的 flightapp-web Roo 项目。\n\n- 2. 使用 solr setup 命令为 flightapp-web 项目设置 Solr：\n\
  \n```\nroo> solr setup\n```\n\n```\nUpdated ROOT\\pom.xml [Added dependency org.apache.solr:solr-solrj:1.4.0]\n\
  Created SRC_MAIN_RESOURCES\\META-INF\\spring\\solr.properties\nUpdated SRC_MAIN_RESOURCES\\\
  META-INF\\spring\\applicationContext.xml\n```\n\n- 3. 通过执行 solr all 命令使项目中的所有 JPA\
  \ 实体可搜索，如下所示：\n\n```\nroo> solr all\n```\n\n```\nUpdated SRC_MAIN_JAVA\\...\\FlightDescription.java\n\
  Updated SRC_MAIN_JAVA\\...\\Flight.java\nCreated SRC_MAIN_JAVA\\...\\Flight_Roo_SolrSearch.aj\n\
  Created SRC_MAIN_JAVA\\...\\FlightDescription_Roo_SolrSearch.aj\n```\n\n- 4. 创建一个负责搜索\
  \ Solr 文档的控制器，如下所示：\n\n```\nroo> controller class --class ~.web.FlightDescriptionSearchController\
  \ --preferredMapping /flightdescriptionsearch\n```\n\n```\nCreated SRC_MAIN_JAVA\\\
  ...\\FlightDescriptionSearchController.java\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\\
  views\\flightdescriptionsearch\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\views\\flightdescriptionsearch\\\
  index.jspx\n```\n\n将随本章附带的源代码中的 MySolrField.java 和 FlightDescriptionSearchController.java\
  \ 文件复制到 sample.roo.flightapp.web 包中。此外，使用随本章附带的源代码中的 index.jsp 文件替换 /WEB-INF/views/flightdescriptionsearch/index.jsp。\n\
  \n- 5. 执行 perform eclipse 命令，以便将 flightapp-web 项目导入到 Eclipse IDE 中，如下所示：\n\n```\n\
  roo> perform eclipse\n```\n\n- 6. 退出 Roo shell，并在 ch06-solr 目录中执行 Maven Tomcat 插件的\
  \ tomcat:run 目标，将 flightapp-web 项目部署到嵌入式 Tomcat 容器中，如下所示：\n\n```\nC:\\roo-cookbook\\\
  ch06-solr> mvn tomcat:run\n```\n\n7. 打开网页浏览器并访问 http://localhost:8080/flightapp-web。如果看到以下\
  \ Web 应用程序主页，则表示 flightapp-web 项目已成功部署到 Tomcat：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_367_0.png)\n\
  \n在给定的截图中，Flight Description Search Controller View 菜单选项会向 FlightDescriptionSearchController\
  \ 类发送请求，该类随后呈现位于 /WEB-INF/views/flightdescriptionsearch 文件夹中的 index.jsp 页面。\n\n\
  8. 此时，请确保 Solr 服务器已启动并运行。现在，选择 Create new Flight Description 菜单选项以查看在数据库中创建新 FlightDescription\
  \ 实体的表单，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_367_1.png)\n\n给定的截图显示，您需要输入以下字段的信息：Price、Origin\
  \ 和 Destination。使用以下表格中显示的信息创建两个 FlightDescription 实例：\n\n| 实例 | 价格 | 起点 | 目的地 |\n\
  |---|---|---|---|\n| Instance-1 | 1200 | NYC | DELHI |\n| Instance-2 | 1400 | MUMBAI\
  \ | ATLANTA |\n\n- 9. 当您创建 `FlightDescription` 实体实例时，Roo 的 Solr 支持会将实体数据添加到 Solr\
  \ 中以进行索引和搜索。选择 **航班描述搜索控制器视图** 菜单选项，该选项会搜索 Solr 服务器中包含名为 `flightdescription_solrsummary_t`\
  \ 字段的文档，并以表格形式显示，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_368_0.png)\n\n\
  - 10. 给定的截图显示四个表：其中两个标题为 **Solr 文档 – 所有字段**，其余两个标题为 **Solr 文档 – 匹配字段**。标题为 **Solr\
  \ 文档 – 所有字段** 的表显示包含 `flightdescription_solrsummary_t` 字段的 Solr 文档的所有字段，而标题为 **Solr\
  \ 文档 – 匹配字段** 的表仅显示包含 `flightdescription_solrsummary_t` 字段的 Solr 文档的 `flightdescription.origin_s`\
  \ 字段。\n\n我们将在 *操作原理...* 部分回到这些字段，了解幕后工作原理。\n\n## 工作原理\n\nSolr 搜索平台与 Roo 生成的领域模型之间的集成通过以下方式实现：\n\
  \n- 为 Roo 项目配置 Solr\n- 定义将领域模型数据添加到 Solr 索引的方法\n- 定义查询 Solr 搜索服务器的方法\n\n现在，让我们来看看\
  \ Roo 如何简化 Solr 集成。\n\n## 为 Roo 项目配置 Solr\n\nsolr setup 命令为 Roo 项目配置 Solr。执行 solr\
  \ setup 命令时，Roo 将执行以下操作：\n\n- 在 pom.xml 文件中添加项目对 SolrJ 1.4.0 的依赖。JPA 实体使用 SolrJ\
  \ 将实体数据添加到 Solr 索引并查询 Solr 搜索服务器。\n\n- 通过在 applicationContext.xml 文件中添加 Spring 任务命名空间的\
  \ <annotation-driven> 元素，启用项目对 @Async 注解方法的支持，如下所示：\n\n```\n<task:annotation-driven\
  \ executor=\"asyncExecutor\"\n    mode=\"aspectj\" />\n```\n\nexecutor 属性指 java.util.concurrent.Executor\
  \ 接口的实现，负责执行 @Async 注解的方法。\n\n- 通过使用 Spring 任务命名空间的 <executor> 元素在 applicationContext.xml\
  \ 中配置 Spring 的 ThreadPoolTaskExecutor，如下所示：\n\n```\n<task:executor id=\"asyncExecutor\"\
  \n    pool-size=\"${executor.poolSize}\" />\n```\n\nSpring 的 ThreadPoolTaskExecutor\
  \ 配置一个 java.util.concurrent.ThreadPoolExecutor 实例（java.util.concurrent.Executor\
  \ 的实现），其线程池大小由 pool-size 属性值指定。${executor.poolSize} 占位符的值来自 solr.properties 文件。\n\
  \n- 在 applicationContext.xml 文件中配置 SolrJ 的 CommonsHttpSolrServer 实例（SolrJ SolrServer\
  \ 抽象类的子类），以允许 JPA 实体通过 HTTP 协议与 Solr 搜索服务器交互：\n\n```\n<bean class=\"org.apache.solr.client.solrj.impl.CommonsHttpSolrServer\"\
  \ id=\"solrServer\">\n    <constructor-arg value=\"${solr.serverUrl}\" />\n</bean>\n\
  ```\n\n幕后，CommonsHttpSolrServer 使用 Apache Commons HttpClient 与 Solr 搜索服务器进行交互。CommonsHttpSolrServer\
  \ 的构造函数接受 Solr 搜索服务器的 URL 作为参数。`<constructor-arg>` 元素将构造函数参数的值指定为 `${solr.serverUrl}`，它引用\
  \ `solr.properties` 文件中定义的 `solr.serverUrl` 属性。\n\n- 在 `SRC_MAIN_RESOURCES\\META-INF\\\
  spring\\` 目录中创建一个 `solr.properties` 文件。该属性文件定义了一个 `executor.poolSize` 属性，用于指定 `ThreadPoolExecutor`\
  \ 所需的线程池大小，如下所示：\n\n```\nexecutor.poolSize=10\n```\n\n`solr.properties` 文件还包含一个\
  \ `solr.serverUrl` 属性，用于标识 Solr 搜索服务器运行的 URL，如下所示：\n\n```\nsolr.serverUrl=http://localhost:8983/solr\n\
  ```\n\n如果 Solr 服务器运行在不同的主机或端口上，请更改 `solr.properties` 文件中的 URL，或使用 `solr` setup 命令的\
  \ `searchServerUrl` 参数来指定 Solr 搜索服务器 URL。\n\n## 将领域模型数据添加到 Solr 索引并搜索 Solr 文档\n\n\
  假设您想搜索 `origin` 字段为 NYC 的 `FlightDescription` 实例。您可以针对持久化 `FlightDescription` 实例的数据库执行此搜索，也可以将\
  \ `FlightDescription` 实例数据添加到 Solr 索引并针对其进行搜索。我们将了解 Roo 如何支持将实体实例数据添加到 Solr 索引，并在下一部分中了解如何在\
  \ Solr 搜索服务器中查询这些数据。\n\n虽然有多种方法可以将数据推送到 Solr，但 Roo 使用 SolrJ 客户端库与 Solr 搜索服务器进行交互。执行\
  \ `solr all` Roo 命令时，它会通过 AspectJ ITD 向 JPA 实体类添加某些方法，当实体被添加、删除或更新时触发这些方法。这些方法负责使用\
  \ SolrJ 客户端库从 Solr 索引中添加、更新和删除实体数据。\n\n执行 `solr all` 命令时，Roo 将执行以下操作：\n\n- 向 JPA\
  \ 实体类添加 `@RooSolrSearchable` 注解，以触发创建相应的 `*_Roo_SolrSearch.aj` AspectJ ITD 文件。\n\
  \n以下代码清单显示了执行 `solr all` 命令后 `flightapp-web` 项目的 `FlightDescription` JPA 实体：\n\n\
  ```\n@RooEntity(identifierColumn = \"FLIGHT_DESC_ID\", table = \"FLIGHT_DESC_TBL\"\
  , finders = { \"findFlightDescriptionsByDestinationAndOrigin\" })\n```\n\n\n\n\n\
  \n@RooSolrSearchable\npublic class FlightDescription {\n...\n}\n```\n\n给定代码显示，@RooSolrSearchable\
  \ 注解已添加到 FlightDescription 实体。如果你查看 Flight 实体，你会发现 @RooSolrSearchable 注解也已添加到它。\n\
  \n- 创建一个 *_Roo_SolrSearch.aj AspectJ ITD 文件（对应于项目中的每个 JPA 实体。_*_Roo_SolrSearch.aj）将方法引入\
  \ JPA 实体类，用于从 Solr 索引中添加、更新和删除实体。另外，_*_Roo_SolrSearch.aj 定义用于使用 SolrJ 客户端库查询 Solr\
  \ 服务器的方法。\n\n## *_Roo_SolrSearch.aj AspectJ ITD 引入的方法和属性\n\n让我们现在来看看 FlightDescription_Roo_SolrSearch.aj\
  \ 文件引入的方法和属性：\n\n- solrServer 属性指向在 applicationContext.xml 文件中配置的 CommonsHttpSolrServer\
  \ bean，如下所示：\n\n```java\n@Autowired\ntransient SolrServer FlightDescription.solrServer;\n\
  ```\n\n- solrServer()：一个静态方法，返回 ITD 文件引入的 solrServer 属性，如下所示：\n\n```java\npublic\
  \ static final SolrServer FlightDescription.solrServer() {\n    SolrServer _solrServer\
  \ = new FlightDescription().solrServer;\n    ..\n    return _solrServer;\n}\n```\n\
  \n- indexFlightDescriptions：一个静态方法，将 FlightDescription 实体实例的集合添加到 Solr 索引中，如下所示：\n\
  \n```java\nimport org.springframework.scheduling.annotation.Async;\n...\n@Async\n\
  public static void FlightDescription.indexFlightDescriptions\n(Collection<FlightDescription>\
  \ flightdescriptions) {\n    java.util.List<SolrInputDocument> documents =\n   \
  \ new java.util.ArrayList<SolrInputDocument>();\n    \n    for (FlightDescription\
  \ flightdescription :\n    flightdescriptions) {\n        SolrInputDocument sid\
  \ = new SolrInputDocument();\n        sid.addField(\"id\", \"flightdescription_\"\
  \ +\n                flightdescription.getId());\n        sid.addField(\"flightdescription.id_l\"\
  ,\n                flightdescription.getId());\n        sid.addField(\"flightdescription.origin_s\"\
  ,\n                flightdescription.getOrigin());\n        ...\n        sid.addField(\"\
  flightdescription.price_f\",\n                flightdescription.getPrice());\n \
  \       sid.addField(\"flightdescription_solrsummary_t\", ...);\n        documents.add(sid);\n\
  \    }\n    try {\n        SolrServer solrServer = solrServer();\n        solrServer.add(documents);\n\
  \        solrServer.commit();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n}\n```\n\n给定代码显示，indexFlightDescriptions 方法标注了 Spring 的 @Async 注解，这意味着它是异步调用的。该方法遍历所有\
  \ FlightDescription 实例（作为方法参数传递）并创建一个 SolrInputDocument 列表。SolrJ 的 SolrInputDocument\
  \ 类表示你想要馈送到 Solr 服务器以进行索引的文档。SolrInputDocument 的 addField 方法标识你想要添加到文档的字段。\n\nRoo\
  \ 添加到 SolrInputDocument 的字段名具有以下命名约定：\n<entity-simple-name>.<field-name>_<field-type>\n\
  \n这里，entity-simple-name 是 JPA 实体的简单名称，field-name 是字段的名称，field-type 是字段的类型。因此，origin\
  \ 字段以 flightdescription.origin_s 的名称添加到 SolrInputDocument，price 字段以 flightdescription.price_f\
  \ 的名称添加。\n\n如果 JPA 实体字段类型不是 Integer、String、Long、Boolean、Float、Double 或 Date，则 JPA\
  \ 实体字段添加到 SolrInputDocument 时的字段名如下所示：\n<entity-simple-name>.<field-name>_t\n\n\
  例如，`flightapp-web` 项目中的 `Flight` 类包含类型为 `FlightDescription` 的 `flightDescription`\
  \ 关系字段，该字段以 `flight.flightdescription_t` 的名称添加到 `SolrInputDocument`（参考 `Flight_Roo_SolrSearch.aj`\
  \ AspectJ ITD 文件）。\n\n你可能会想知道，为什么 Roo 不使用确切名称将 JPA 实体字段添加到 `SolrInputDocument` 中。以下是\
  \ Solr 工作原理的简要说明：\n\n`SolrInputDocument` 表示你要添加到 Solr 搜索服务器的文档。该文档由字段组成，你需要告诉 Solr\
  \ 搜索服务器，其中哪些字段应该被 **索引**。需要注意的是，如果某个字段 *未* 被索引，则你无法基于该字段搜索或排序文档。你通过在 `SOLR_HOME\\\
  example\\solr\\conf` 目录中的 `schema.xml` 文件中指定字段，告诉 Solr 搜索服务器文档的哪些字段应该被索引。Solr 具有动态字段的概念，即如果字段遵循标准命名约定，则它会被\
  \ Solr 搜索服务器自动索引。`schema.xml` 文件中的以下 XML 片段定义了将由 Solr 自动索引的动态字段：\n\n```xml\n<dynamicField\
  \ name=\"*_s\" type=\"string\" indexed=\"true\" stored=\"true\"/>\n<dynamicField\
  \ name=\"*_l\" type=\"long\" indexed=\"true\" stored=\"true\"/>\n<dynamicField name=\"\
  *_t\" type=\"text\" indexed=\"true\" stored=\"true\"/>\n<dynamicField name=\"*_f\"\
  \ type=\"float\" indexed=\"true\" stored=\"true\"/>\n```\n\n给定的 XML 片段指示 Solr 索引与模式\
  \ `*_s`、`*_l`、`*_t` 或 `*_f` 匹配的任何字段。因此，现在你可以看到 Roo 生成的字段名与 Solr 定义的动态字段之间的联系。\n\n\
  indexFlightDescriptions 方法还向 `SolrInputDocument` 添加了一个 `id` 字段名。任何 SolrInputDocument\
  \ 必须包含一个名为 id 的字段，该字段在 Solr 索引中 *唯一* 标识文档。默认情况下，Roo 将 id 字段的值设置为 \"flightdescription_\"\
  \ + flightdescription.getId()。我们将在本节后面看到，此 id 字段值用于从 Solr 索引中删除文档。\n\nindexFlightDescriptions\
  \ 方法还在 SolrInputDocument 中添加了一个额外字段 flightdescription_solrsummary_t，以便可以用于搜索 Solr\
  \ 为 FlightDescription JPA 实体索引的所有文档。同样，Flight_Roo_SolrSearch.aj AspectJ ITD 的 indexFlightDescriptions\
  \ 方法在 SolrInputDocument 中添加 flight_solrsummary_t 字段，以允许搜索 Solr 为 Flight JPA 实体索引的文档。\n\
  \n`indexFlightDescriptions` 方法中的以下代码将 `SolrInputDocument`s 添加到 Solr 索引：\n\n```java\n\
  SolrServer solrServer = solrServer();\nsolrServer.add(documents);\nsolrServer.commit();\n\
  ```\n\n- indexFlightDescription：一个静态方法，将 FlightDescription 实体实例添加到 Solr 索引，如下所示：\n\
  \n```java\npublic static void\nFlightDescription.indexFlightDescription(FlightDescription\n\
  flightdescription) {\nList<FlightDescription> flightdescriptions =\nnew ArrayList<FlightDescription>();\n\
  flightdescriptions.add(flightdescription);\nindexFlightDescriptions(flightdescriptions);\n\
  }\n```\n\n如给定代码所示，indexFlightDescription 方法将将 FlightDescription 实例添加到 Solr 索引的责任委托给\
  \ indexFlightDescriptions 方法。\n\n- deleteIndex：一个静态方法，删除与 FlightDescription JPA\
  \ 实体实例对应的 Solr 文档，如下所示：\n\n```java\n@Async\npublic static void\nFlightDescription.deleteIndex(FlightDescription\n\
  flightdescription) {\nSolrServer solrServer = solrServer();\ntry {\nsolrServer.deleteById(\"\
  flightdescription_\" +\nflightdescription.getId());\nsolrServer.commit();\n} catch\
  \ (Exception e) {\ne.printStackTrace();\n}\n}\n```\n\n在给定代码中，SolrServer 的 deleteById\
  \ 方法删除（从 Solr 索引中）id 属性值为 \"flightdescription_\" + flightdescription.getId() 的文档。Spring\
  \ 的 @Async 注解意味着 deleteIndex 方法被异步调用。\n\n- postPersistOrUpdate 方法，当 FlightDescription\
  \ JPA 实体实例在数据库中被持久化或更新时调用。该方法负责使用修改后的 JPA 实体实例数据添加或更新 Solr 索引，如下所示：\n\n```java\n\
  import javax.persistence.PostPersist;\nimport javax.persistence.PostUpdate;\n...\n\
  @PostUpdate\n@PostPersist\nprivate void FlightDescription.postPersistOrUpdate()\
  \ {\n    indexFlightDescription(this);\n}\n```\n\n@PostUpdate 和 @PostPersist JPA\
  \ 注解表明，当 FlightDescription JPA 实体在数据库中被更新或持久化时，将调用 postPersistOrUpdate 方法。对 indexFlightDescription\
  \ 方法的调用表明，实体数据已更新或添加到 Solr 索引。\n\n- preRemove 方法，通过调用 deleteIndex 方法从 Solr 索引中删除实体数据：\n\
  \n```java\nimport javax.persistence.PreRemove;\n...\n@PreRemove\nprivate void FlightDescription.preRemove()\
  \ {\n    deleteIndex(this);\n}\n```\n\n@PreRemove JPA 注解意味着，preRemove 方法在 JPA 实体实例从数据库中删除之前被调用。\n\
  \n- search(SolrQuery query) 方法，允许搜索与搜索查询匹配的 Solr 文档：\n\n```java\npublic static QueryResponse\
  \ FlightDescription.search(SolrQuery\nquery)\n    {\n        try {\n           \
  \ return solrServer().query(query);\n        } catch (Exception e) {\n         \
  \   e.printStackTrace();\n        }\n    return new QueryResponse();\n}\n```\n\n\
  \n\n\nSolrQuery 表示一个查询对象，其中包含执行搜索所依据的字段信息、要返回的字段等。SolrServer 的 query 方法使用 Apache\
  \ Commons HttpClient 将搜索请求发送到 Solr 搜索服务器，并返回一个 QueryResponse 对象，你可以从中提取与搜索查询匹配的\
  \ Solr 文档。\n\n- search(String) 方法，仅返回 Solr 搜索服务器中与 FlightDescription 实体对应的 Solr\
  \ 文档：\n\n```\npublic static QueryResponse FlightDescription.search(String queryString)\
  \ {\n String searchString = \n \"FlightDescription_solrsummary_t:\" + queryString;\n\
  \ return search(new SolrQuery(searchString.toLowerCase()));\n}\n```\n\n在给定代码中，SolrQuery\
  \ 对象是使用 searchString 创建的。searchString 指定用于查找匹配 Solr 文档的 Solr 查询。由于 searchString\
  \ 已经包含常量值 \"FlightDescription_solrsummary_t:\"，这意味着你只能搜索包含 \"FlightDescription_solrsummary_t\"\
  \ 字段的 Solr 文档。如果你还记得之前的讨论，\"FlightDescription_solrsummary_t\" 字段仅在与 FlightDescription\
  \ 实体对应的 Solr 文档中可用。\n\n现在让我们来看看 FlightDescriptionSearchController 控制器如何使用 FlightDescription\
  \ JPA 实体中定义的搜索方法来搜索由 Solr 搜索服务器索引的文档。\n\n### 搜索 Solr 文档\n\nFlightDescriptionSearchController\
  \ 定义了用于搜索与 FlightDescription 实体对应的 Solr 文档的方法。以下代码清单显示了 FlightDescriptionSearchController\
  \ 类：\n\n```\n@Controller\npublic class FlightDescriptionSearchController {\n private\
  \ List<List<MySolrField>> getAllFields() {\n QueryResponse response = FlightDescription.search(\"\
  *\");\n SolrDocumentList documentList = response.getResults();\n return getSolrDocumentFieldList(documentList);\n\
  \ }\n\n private List<List<MySolrField>> getMatchingFields() {\n SolrQuery solrQuery\
  \ = new SolrQuery().\n setQuery(\"flightdescription_solrsummary_t:*\").\n setParam(\"\
  fl\", \"flightdescription.origin_s\");\n QueryResponse response =\n FlightDescription.search(solrQuery);\n\
  \ SolrDocumentList documentList = response.getResults();\n return getSolrDocumentFieldList(documentList);\n\
  \ }\n\n private List<List<MySolrField>>\n getSolrDocumentFieldList(SolrDocumentList\
  \ list) {\n List<List<MySolrField>> matchingDocList\n = new ArrayList<List<MySolrField>>();\n\
  \ ...\n return matchingDocList;\n }\n}\n```\n\ngetAllFields 方法调用 FlightDescription\
  \ 实体的 search(String queryString) 方法，并将 * 作为方法参数传递。如我们之前所见，FlightDescription 的 search(String\
  \ queryString) 方法将创建以下查询：\"FlightDescription_solrsummary_t:*\"，这意味着搜索包含 \"FlightDescription_solrsummary_t\"\
  \ 字段的所有 Solr 文档。此查询将返回我们添加到 Solr 索引中的与 FlightDescription 实体对应的所有 Solr 文档。\n\ngetMatchingFields\
  \ 方法调用 search(SolrQuery query) 方法并传递 SolrQuery 对象，该对象查询与 FlightDescription JPA 实体对应的所有\
  \ Solr 文档，但指定查询结果应仅包含 flightdescription.origin_s 字段。SolrQuery 的 setQuery 参数指定查询，setParam\
  \ 指定结果中应仅返回 flightdescription.origin_s 字段。\n\nQueryResponse 对象的 getResults 方法返回\
  \ SolrDocumentList，表示查询返回的匹配 Solr 文档列表。\n\ngetSolrDocumentFieldList 方法以 SolrDocumentList\
  \ 作为参数并从中提取 SolrDocument 实例。然后，该方法从每个 SolrDocument 实例中提取字段名和值以创建 List<List<MySolrField>>。MySolrField\
  \ 表示我们在 flightapp-web 项目中创建的一个自定义类，用于表示 SolrDocument 中的单个字段值对。\n\n/WEB-INF/views/flightdescriptionsearch/index.jsp\
  \ JSP 页面显示由 getFields 和 getMatchingFields 方法返回的数据。这就是为什么选择 Flight Description Search\
  \ Controller View 菜单选项会显示两种不同类型的表格。一种表格类型显示所有 Solr 文档字段，另一种表格类型仅显示 flightdescription.origin_s\
  \ 字段。\n\n### 更多内容……\n\nSolr 索引在带有 @PreRemove、@PostPersist 和 @PostUpdate 注释的方法中更新。那么，如果事务无法提交但实体数据已作为\
  \ Solr 文档存储在 Solr 搜索服务器中呢？你需要自己负责维护完整性，因为 Roo 无法帮助你。\n\n现在让我们来看看 @RooSolrSearchable\
  \ 定义的属性，用于自定义 *_Roo_SolrSearch.aj AspectJ ITD 中 Roo 生成的方法名称。\n\n### 自定义 Roo 生成的\
  \ *_Roo_SolrSearch.aj AspectJ ITD\n\n下表描述了 @RooSolrSearchable 注解的属性：\n\n| Attribute\
  \ | Description |\n|---|---|\n| deleteIndexMethod | 为 `deleteIndex` 方法指定自定义名称。值为空\
  \ \"\" 指示 Roo 不生成 `deleteIndex` 方法。 |\n| indexMethod | 为 `index` 方法指定自定义名称。值为空 \"\
  \" 指示 Roo 不生成 `index` 方法。 |\n| postPersistOrUpdateMethod | 为 `postPersistOrUpdate`\
  \ 方法指定自定义名称。值为空 \"\" 指示 Roo 不生成 `postPersistOrUpdate` 方法。 |\n| preRemoveMethod |\
  \ 为 `preRemove` 方法指定自定义名称。值为空 \"\" 指示 Roo 不生成 `preRemove` 方法。 |\n| searchMethod\
  \ | 为接受 `SolrQuery` 作为参数的 `search` 方法指定自定义名称。值为空 \"\" 指示 Roo 不生成接受 `SolrQuery` 参数的\
  \ `search` 方法。 |\n| simpleSearchMethod | 为接受 `String` 作为参数的 `search` 方法指定自定义名称。值为空\
  \ \"\" 指示 Roo 不生成接受 `String` 参数的 `search` 方法。 |\n"
- "# 开发加载项并从项目中移除 Roo\n\n在本章中，我们将介绍：\n\n- 为加载项开发设置 GnuPG\n- 安装可安装的加载项\n- 开发简单的加载项\n\
  - 开发高级加载项\n- 将非 OSGi JDBC 驱动程序转换为 OSGi 兼容的 bundle\n- 通过 push-in 重构移除 Roo\n- 通过 pull-out\
  \ 重构将 Roo 添加到项目\n- 升级到最新版本的 Roo\n\n## 简介\n\n在之前的章节中，我们看到执行 Roo 命令会触发 Roo 加载项中的代码生成逻辑。你可能希望为基础或可安装加载项尚不支持的功能创建自定义加载项。例如，目前没有\
  \ Roo 加载项支持使用 Spring Portlet MVC 创建 Java portlet。因此，我们可以开发一个 Roo 加载项，它负责从 JPA 实体生成\
  \ Spring Portlet MVC 控制器和 JSP。\n\n在本章中，我们将介绍一些示例，展示 Roo 如何简化加载项的安装、开发和发布。此外，我们还将概述\
  \ Roo 架构和在开发和测试加载项时会很有用的 Roo 命令。\n\n## 为加载项开发设置 GnuPG\n\nRoo 使用 GnuPG (http://www.gnupg.org/)\
  \ 对加载项进行签名。加载项签名可确保 Roo 用户仅下载和安装受信任的加载项。Roo 的加载项创建者模块使用其秘密 PGP 密钥对加载项进行签名，并将公共 PGP\
  \ 密钥发布到公共密钥服务器。Roo 用户需要通过将公共 PGP 密钥添加到 Roo 的密钥存储中，明确告知 Roo 它信任某个加载项。这样，Roo 就可以下载和安装该加载项。如果未将公共\
  \ PGP 密钥添加到 Roo 的密钥存储中，则不会下载和安装该加载项。\n\n在本示例中，我们将了解如何安装 GnuPG、创建密钥对（包含秘密密钥和公共密钥）以及将公共密钥发布到公共密钥服务器。\n\
  \n### 准备工作\n\n如果你使用的是 Windows 或 UNIX，请从以下位置下载并安装 GnuPG：http://www.gnupg.org/download/。如果你使用的是\
  \ Mac，请从以下位置下载并安装 GnuPG for Mac：http://macgpg.sourceforge.net/。\n\n在 Windows 上安装\
  \ GnuPG 将创建以下安装目录：C:\\\\Program Files\\\\GNU\\\\GnuPG。\n\n### 操作步骤\n\n以下步骤将演示如何设置\
  \ GnuPG：\n\n1. 打开命令提示符，执行以下 GnuPG `list-secret-keys` 命令以查看你可能之前创建的秘密 PGP 密钥：\n\n\
  ```\nC:\\\\Users\\\\Ashish>gpg --list-secret-keys\ngpg: keyring 'C:/Users/Ashish/AppData/Roaming/gnupg\\\
  \\secring.gpg'\ncreated\n```\n\n输出显示，如果未找到 `secring.gpg` 文件，则会创建该文件。`secring.gpg`\
  \ 文件包含密钥信息。\n\n2. 使用 GnuPG 的 `gen-key` 命令创建包含秘密 PGP 密钥和公共 PGP 密钥的新密钥对，如下所示：\n\n\
  ```\nC:\\\\Users\\\\Ashish>gpg --gen-key\n...\nPlease select what kind of key you\
  \ want:\n```\n\n\n- (1) RSA 和 RSA（默认）\n- (2) DSA 和 Elgamal\n- (3) DSA（仅签名）\n- (4)\
  \ RSA（仅签名）\n- 你的选择？1\n- ...\n\n执行 gen-key 命令会询问多个问题，例如电子邮件 ID、真实姓名、密钥类型和长度等。在被要求选择所需密钥类型时，请选择选项\
  \ 1（RSA 和 RSA（默认））或 2（DSA 和 Elgamal），因为该密钥可同时用于加密和解密。\n\n最后，系统会要求你提供一个密码短语来保护你的秘密\
  \ PGP 密钥。\n\n请记住该密码短语，因为在构建自定义附加组件时需要提供它。\n\n- 3. 要验证密钥对是否已成功创建，请执行 GnuPG 的 list-secret-keys\
  \ 命令：\n\n```\nC:\\Users\\Ashish>gpg --list-secret-keys\n```\n\n```\nC:\\Users\\\
  Ashish\\AppData\\Roaming\\gnupg\\secring.gpg\n---------------------------------------\n\
  sec 2048R/BFB28A4D 2011-04-30\nuid Ashish Sarin (This is my key)\n<ashish.k.sarin@gmail.com>\n\
  ssb 2048R/9FCAFB76 2011-04-30\n```\n\n如果看到上述输出，表示你的密钥对已成功生成。sec 密钥 ID 为 BFB28A4D，它代表你的公开\
  \ PGP 密钥的密钥 ID，你需要将其发布到公共密钥服务器。\n\n- 4. 现在，使用 GnuPG 的 send-keys 命令发布公钥，如下所示：\n\n\
  ```\ngpg --send-keys --keyserver hkp://pgp.mit.edu <public-key-id>\n```\n\n这里，<public-key-id>\
  \ 是执行 list-secret-keys 命令时列出的 sec 密钥 ID。在我这里，<public-key-id> 为 BFB28A4D。\n\n## 它的工作原理...\n\
  \n我们了解到，GnuPG 用于创建密钥对并将公开 PGP 密钥发布到公共密钥服务器。由于大多数公共密钥服务器共享密钥，因此你不需要将密钥发送到所有公共密钥服务器。\n\
  \n## 另请参见\n\n- 请参阅“安装可安装的附加组件”一节，了解如何安装附加组件\n- 请参阅“开发简单附加组件”一节，了解 Spring Roo 如何使用你的秘密密钥为自定义附加组件签名\n\
  \n## 安装可安装的附加组件\n\n不属于 Spring Roo 发行版一部分的附加组件被称为可安装的附加组件。因此，任何不是基础附加组件的附加组件都是可安装的附加组件。在本示例中，我们将探讨如何安装可安装的附加组件，以及在此过程中遇到的挑战。\n\
  \n## 准备工作\n\n请参阅“为附加组件开发设置 GnuPG”一节，在系统上设置 GnuPG。\n\n在系统中创建新目录 C:\\roo-cookbook\\\
  ch07-service，并从 ch07-service 目录启动 Roo shell。\n\n执行 ch07_jpa_setup.roo 脚本将创建 flight-app\
  \ Roo 项目，将 Hibernate 设置为持久性提供程序，并将 MySQL 配置为应用程序的数据库。如果你使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n## 操作步骤\n\n以下步骤将演示如何安装可安装的附加组件：\n\n- 1. 在 Roo shell 中输入以下命令并按 Tab 键：\n\n```\n\
  roo> addon install bundle --bundleSymbolicName\n```\n\n```\nDisplay all 308 possibilities?\
  \ (y or n)\n```\n\nRoo 会询问是否应显示所有可用附加组件的符号名称。按 Y 键指示 Roo 列出所有附加组件。你会发现列表中有几个 gvNIX\
  \ (https://code.google.com/p/gvnix/) Roo 附加组件，它们的 bundle 符号名称以 \"org.gvnix.\" 开头。为了本示例的目的，我们将安装\
  \ gvNIX Service Management 附加组件，其 bundle 符号名称为 org.gvnix.service.roo.addon。使用 Service\
  \ Management 附加组件，你可以快速创建企业应用程序的服务层。\n\n- 2. 现在，使用 addon install bundle 命令安装 gvNIX，如下所示：\n\
  \n```\nroo> addon install bundle --bundleSymbolicName org.gvnix.service.roo.addon\n\
  ...\nDownloaded 100% of org.gvnix.service.roo.addon-0.6.0.jar.asc\n\nDownload URL\
  \ 'http://gvNIX.googlecode.com/svn/repo/org/gvnix/org.gvnix.service.roo.addon/0.6.0/org.gvnix.service.roo.addon-0.6.0.jar'\
  \ failed\n\nThis resource was signed with PGP key ID '0xC5FC814B', which is not\
  \ currently trusted\n```\n\n输出显示，gvNIX Service Management Roo 附加组件无法下载和安装，因为它是用\
  \ PGP 密钥 ID 0xC5FC814B 签名的，而你的 Spring Roo 安装不信任该密钥 ID。\n\n- 3. 使用 pgp trust Roo\
  \ 命令将 PGP 密钥 ID 0xC5FC814B 添加到 Roo 的密钥库中，如下所示：\n\n```\nroo> pgp trust --keyId 0xC5FC814B\n\
  ```\n\n- 4. 既然我们已告知 Spring Roo 信任用于为 gvNIX Service Management Roo 附加组件签名的 PGP 密钥\
  \ ID，现在可以使用 addon install bundle 命令安装 gvNIX Service Management Roo 附加组件，如下所示：\n\n\
  ```\nroo> addon install bundle --bundleSymbolicName org.gvnix.service.roo.addon\n\
  ```\n\n```\nTarget resource(s):\n-------------------\n\ngvNIX - Spring Roo - Addon\
  \ - Services Management (0.6.0)\n\nDeploying...done.\n\nSuccessfully installed add-on:\
  \ gvNIX - Spring Roo - Addon - Services Management [version: 0.6.0]\n```\n\n输出显示，gvNIX\
  \ Service Management 附加组件已被 Spring Roo 成功安装，且 gvNIX Service Management 附加组件提供的命令可供\
  \ Roo shell 使用。例如，你现在会发现以下 Roo 命令可供 Roo shell 使用：service class、service import ws\
  \ 和 service operation。\n\n## 它的工作原理...\n\n附加组件列表来自 RooBot 的索引文件。RooBot 是由 VMWare\
  \ 托管的服务，用于索引公开可用的 OBR（OSGi Bundle Repository）文件。OBR 表示附加组件仓库，OBR 文件是一个 XML 文件（通常名为\
  \ repository.xml），包含关于附加组件及其发布 URL 的信息。请注意，OBR 仓库不一定物理托管附加组件，而可能仅提供一个 OBR 文件，其中包含附加组件的详细信息以及发布它们的\
  \ URL。开发者为其在自己网站上发布的 Roo 附加组件提供一个 OBR 文件。OBR 文件由 RooBot 索引，RooBot 确保用于下载附加组件的 URL\
  \ 使用 httpgpg://（而不是 http://）URL 进行签名验证。\n\n每次通过执行 Roo 批处理文件启动 Roo shell 时，Spring\
  \ Roo 都会下载 RooBot 的索引文件，以便你可以搜索和安装附加组件。重要的是要注意，RooBot 不物理托管附加组件。当你执行 addon search\
  \ 或 addon list 命令时，Spring Roo 会参考 RooBot 的索引文件来执行可用附加组件的搜索和列表。\n\n当你尝试使用 addon install\
  \ bundle 或 addon install id 命令安装 Roo 附加组件时，会使用 RooBot 索引文件中附加组件的 httpgpg:// URL\
  \ 来下载和安装该附加组件。使用 httpgpg:// URL 要求 Spring Roo 首先下载附加组件的 PGP 签名文件（.asc 文件）和 URL，并验证你的\
  \ Spring Roo 安装是否信任用于为签名文件签名的 PGP 密钥 ID。如果你的 Spring Roo 安装不信任该 PGP 密钥 ID，它将不尝试下载附加组件。\n\
  \n在本示例中，当我们首次尝试下载 gvNIX Service Management Roo 附加组件时，出现了错误，因为 PGP 签名文件是使用 Spring\
  \ Roo 安装不信任的 PGP 密钥 ID 签名的。因此，我们使用 pgp trust Roo 命令将 PGP 密钥 ID 添加到 Spring Roo 的密钥库中，并重新尝试下载\
  \ gvNIX Service Management Roo 附加组件。Spring Roo 将受信任的密钥存储在用户主目录中的 .spring_roo_pgp.bpg\
  \ 文件中。\n\n## 更多内容...\n\n需要注意的是，addon 命令（addon info bundle、addon info id、addon install\
  \ bundle、addon install id、addon list、addon search、addon upgrade）仅适用于已在 RooBot 索引文件中注册的附加组件。例如，你无法搜索或安装未在\
  \ RooBot 索引文件中列出的 Roo 附加组件。\n\n## 默认信任附加组件\n\n如果你希望在无需将 PGP 密钥 ID 添加到 Roo 密钥库的情况下下载附加组件，可以执行\
  \ pgp automatic trust Roo 命令，如下所示：\n\n```\nroo> pgp automatic trust\n```\n\n执行 pgp\
  \ automatic trust 命令会指示 Roo 不验证下载的附加组件 PGP 签名文件是否由受信任的 PGP 密钥 ID 签名。需要注意的是，启用 Roo\
  \ 的自动 PGP 密钥信任功能可能不安全。\n\n如果你想关闭自动 PGP 密钥信任功能，只需重新执行 pgp automatic trust 命令即可。\n\
  \n## 安装未由 RooBot 索引的附加组件\n\n可能存在这样的场景：Roo 附加组件未在 RooBot 中注册，但你仍想安装和使用它。如果 Roo 附加组件仅供组织内部使用，则你不会将其发布到\
  \ RooBot，或者你可能希望在将其注册到 RooBot 之前彻底测试该附加组件。在这种情况下，你需要使用 osgi obr url add 命令将附加组件仓库的\
  \ OBR URL 添加到 Roo 安装中，然后执行 osgi obr start 命令下载并安装附加组件。\n\n让我们来看一个示例场景，其中你使用 osgi\
  \ obr url add 和 osgi obr start 命令下载并安装 Roo 附加组件。\n\ngvNIX (https://code.google.com/p/gvnix/)\
  \ Google Code 项目提供多个 Roo 附加组件，涉及服务管理（如前所述）、报告、主题等。尽管 gvNIX 附加组件已在 RooBot 中发布，但我们可以直接使用\
  \ osgi obr url add 和 osgi obr start 命令下载并安装它们。\n\n要添加托管附加组件的仓库的 OBR URL，你需要找到包含附加组件列表及其发布\
  \ URL 的 OBR XML 文件。对于 gvNIX Google Code 项目，OBR 文件名为 repository.xml，位于项目的 repo 目录中。\n\
  \n你可以执行以下步骤，将 gvNIX 项目的 OBR 文件 URL 添加到 Roo 安装中：\n\n- 访问 gvNIX Google Code 项目并选择\
  \ Source | Browse 选项以查看 repository.xml 文件。由于我们需要使用 osgi obr url add 命令将此 repository.xml\
  \ 文件的 URL 添加到 Roo 安装中，请访问 Google Code 上 gvNIX 项目的 Source | Browse 选项，并打开 repo 目录中的\
  \ repository.xml 文件。\n\n\n\n\n\n> Google Code以HTML格式呈现`repository.xml`文件的内容，您在浏览器中现在看到的URL并不是`repository.xml`文件的URL位置。\n\
  \n- 要获取`repository.xml`文件的实际位置，请选择HTML页面右侧菜单中显示的**查看原始文件**链接。您现在在浏览器中看到的URL是 http://gvnix.googlecode.com/svn/repo/repository.xml。\n\
  \n- 现在，如示例所示，将`repository.xml`文件的URL添加到Roo安装中：\n\n```\nroo> osgi obr url add --url\
  \ http://gvnix.googlecode.com/svn/repo/repository.xml\n```\n\n如这里所述，您可以向Roo安装添加多个OBR文件URL。添加OBR文件URL后，您可以下载并安装OBR文件中定义的Roo\
  \ add-on。例如，我们现在可以安装gvNIX项目`repository.xml`文件中列出的add-on，如这里所示为gvNIX项目的Web Report\
  \ add-on：\n\n```\nroo> osgi obr start --bundleSymbolicName org.gvnix.web.report.roo.addon\n\
  Target resource(s):\n---------------------------------\ngvNIX - Spring Roo - Addon\
  \ - Web Report (0.6.0)\nDeploying...done.\n```\n\n由于`osgi obr start`命令使用OBR文件中定义的URL下载add-on，因此OBR文件中的下载URL可能使用`http://`而不是`https://`。这可能不安全，因为使用`http://`URL下载add-on时不需要Spring\
  \ Roo PGP签名验证。\n\n## 另请参阅\n\n- 参阅*开发简单 add-on*教程，了解如何直接安装add-on JAR文件\n\n## 开发简单\
  \ add-on\n\nRoo提供一个add-on创建者add-on，可简化自定义add-on的开发。您可以使用add-on创建者暴露的命令来创建简单或高级add-on。\n\
  \n简单add-on旨在向pom.xml文件添加项目依赖项，或向项目添加配置工件。例如，在第4章《使用Spring Web MVC进行Web应用程序开发》中，我们了解到Roo在脚手架Spring\
  \ Web MVC应用程序时会安装JSP自定义标签。与使用Roo安装的JSP自定义标签不同，您可以创建一个简单的Roo add-on，用根据您的应用程序要求定制的标签替换Roo安装的JSP自定义标签。\n\
  \n另一方面，当您想要创建新的Java类、接口和AspectJ ITD文件时，需要高级add-on。例如，Portlet add-on将从JPA实体脚手架控制器和JSP。\n\
  \n在本教程中，我们将介绍addon create simple命令，它创建一个简单的Roo add-on，用自定义标签替换Roo为Spring MVC应用程序安装的一些标签。我们还将了解如何在Roo项目中使用新创建的add-on。\n\
  \n如第1章《Spring Roo入门》中所述，Roo基于Apache Felix OSGi容器构建，Roo add-on代表OSGi bundle。在本章介绍Roo\
  \ add-on开发教程的过程中，我们将涉及您需要了解的一些OSGi概念，以便理解add-on的工作原理。\n\n## 准备工作\n\n在您的系统中创建一个新目录C:\\\
  \\roo-cookbook\\\\ch07-simple-add-on，并从ch07-simple-add-on目录启动Roo shell。\n\n## 操作步骤...\n\
  \n以下步骤将演示如何开发一个简单add-on：\n\n1. 执行addon create simple命令，如示例所示，以创建com.roo.addon.mysimple\
  \ add-on项目：\n\n```\nroo> addon create simple --topLevelPackage com.roo.addon.mysimple\n\
  --description \"Mysimple addon\" --projectName \"Mysimple addon\"\n\nCreated ROOT\\\
  \\pom.xml\nCreated ROOT\\\\readme.txt\nCreated ROOT\\\\legal\nCreated ROOT\\\\legal\\\
  \\LICENSE.TXT\n\nCreated SRC_MAIN_JAVA\\\\...\\\\MysimpleCommands.java\nCreated\
  \ SRC_MAIN_JAVA\\\\com\\\\...\\\\MysimpleOperations.java\nCreated SRC_MAIN_JAVA\\\
  \\...\\\\MysimpleOperationsImpl.java\nCreated SRC_MAIN_JAVA\\\\...\\\\MysimplePropertyName.java\n\
  Created ROOT\\\\src\\\\main\\\\assembly\\\\assembly.xml\nCreated SRC_MAIN_RESOURCES\\\
  com\\roo\\addon\\mysimple\\info.tagx\nCreated SRC_MAIN_RESOURCES\\com\\roo\\addon\\\
  mysimple\\show.tagx\n```\n\n2. 执行perform eclipse命令以创建Eclipse IDE特定的配置文件：\n\n```\n\
  roo> perform eclipse\n```\n\n3. 现在，将com.roo.addon.mysimple Eclipse项目导入到Eclipse IDE中。\n\
  \n## 工作原理...\n\naddon create simple命令创建一个Roo add-on，该add-on向Roo shell贡献命令，并定义在执行这些命令时被调用的操作。package参数指定add-on的顶级包，也用作add-on项目的名称。addon\
  \ create simple命令生成以下类和接口，<last-part-of-top-level-package>指的是topLevelPackage参数值中最后一个'.'索引之后的文本。在我们的示例中，topLevelPackage参数值为com.roo.addon.mysimple，这使得<last-part-of-top-level-package>的值为mysimple：\n\
  \n- <last-part-of-top-level-package> Commands.java类：定义add-on向Roo shell贡献的方法\n- <last-part-of-top-level-package>\
  \ Operations.java接口：定义包含与Roo命令对应的大部分处理逻辑的方法\n- <last-part-of-top-level-package>\
  \ OperationsImpl.java类：实现*Operations.java接口\n- <last-part-of-top-level-package>\
  \ PropertyName.java枚举类型：定义传递给Roo命令的参数的可能值\n\n通过addon create simple命令生成的add-on为您提供了自定义add-on开发的起点。生成的add-on不具备太多功能，只是展示您通常会在add-on中创建的类和接口。您需要修改生成的add-on以执行特定于您要求的功能。\n\
  \n让我们首先查看由addon create simple命令创建的、为com.roo.addon.mysimple add-on定义命令和操作的Java类和接口。\n\
  \n### MysimpleCommands类\n\n以下代码清单显示了MysimpleCommands类，该类定义add-on向Roo shell贡献的命令：\n\
  \n```\nimport java.util.logging.Logger;\nimport org.apache.felix.scr.annotations.Component;\n\
  import org.apache.felix.scr.annotations.Reference;\nimport org.apache.felix.scr.annotations.Service;\n\
  import org.springframework.roo.shell.converters.StaticFieldConverter;\n\n@Component\n\
  @Service\npublic class MysimpleCommands implements CommandMarker {\nprivate Logger\
  \ log = Logger.getLogger(getClass().getName());\n\n@Reference private MysimpleOperations\
  \ operations;\n\n@Reference private StaticFieldConverter\nstaticFieldConverter;\n\
  \nprotected void activate(ComponentContext context) {\nstaticFieldConverter.add(MysimplePropertyName.class);\n\
  }\n\nprotected void deactivate(ComponentContext context) {\nstaticFieldConverter.remove(MysimplePropertyName.class);\n\
  \n...\n}\n```\n\n以下是关于MysimpleCommands类的一些重要注意事项：\n\n- MysimpleCommands类通过带有@CliCommand注解的方法定义mysimple\
  \ add-on向Roo shell贡献的Roo命令。我们将在本节稍后讨论mysimple add-on贡献的命令。当从shell执行Roo命令时，会导致执行MysimpleCommands类中相应的带有@CliCommand注解的方法。\n\
  \n- MysimpleCommands类使用@Component和@Service Apache Felix注解进行注解。@Component和@Service注解具有源级保留策略，由Apache\
  \ Felix Maven SCR插件（http://felix.apache.org/site/apache-felix-maven-scr-plugin.html）使用，以生成OSGi的服务组件运行时（SCR）所需的XML配置——SCR负责管理MysimpleCommands组件的生命周期，并将其作为服务注册到OSGi服务注册表。使用@Component和@Service注解对MysimpleCommands进行注解可确保（如有需要）可以从其他Roo\
  \ add-on访问MysimpleCommands对象（使用@Reference Apache Felix注解）。\n\n- MysimpleCommands类实现Roo的CommandMarker接口。CommandMarker是一个标记接口，即它不声明任何方法。Roo查找实现CommandMarker接口的组件，以识别向Roo\
  \ shell贡献命令的组件。\n\n- Apache Felix的@Reference注解类似于Spring的@Autowired注解，用于解析组件的服务依赖项。MysimpleOperations和StaticFieldConverter是MysimpleCommands组件的服务依赖项。通过@Reference注解，MysimpleOperations和StaticFieldConverter服务对MysimpleCommands可访问，因为实现MysimpleOperations和StaticFieldConverter接口的类也使用@Service和@Component注解进行注解——这使它们对其他Roo\
  \ add-on可访问。\n\n- MysimpleOperations定义实现add-on贡献的Roo命令所执行的主要功能的方法。这些方法由MysimpleCommands类中定义的方法调用。\n\
  \n- StaticFieldConverter代表一个Spring Converter，它为从Roo shell传递到MysimpleCommands类中相应@CliCommand注解方法的参数值提供类型安全。\n\
  \n- 由于Roo add-on作为OSGi bundle部署在底层Apache Felix OSGi容器上，activate和deactivate方法分别代表由OSGi容器调用以激活和停用Roo\
  \ add-on的生命周期方法。对于mysimple add-on，activate方法将MysimplePropertyName枚举类型添加到StaticFieldConverter实现中。在deactivate方法中，mysimple\
  \ add-on从StaticFieldConverter实现中移除MysimplePropertyName枚举类型。\n\n- 现在我们了解了MysimpleCommands类在mysimple\
  \ add-on中所扮演的角色，让我们来看看MysimpleCommands类中向Roo shell注册命令并处理从Roo shell执行的这些Roo命令的方法。\n\
  \n\n\n\n## 定义 Roo 命令\n\n以下代码清单显示了 MysimpleCommands 类的方法，这些方法定义了 mysimple 插件暴露的 Roo\
  \ 命令：\n\n```\nimport org.springframework.roo.shell.CliCommand;\nimport org.springframework.roo.shell.CliOption;\n\
  ...\n\n@Reference private MysimpleOperations operations;\n\n@CliCommand(value =\
  \ \"say hello\",\n    help = \"Prints welcome message to the Roo shell\")\npublic\
  \ void sayHello(\n    @CliOption(key = \"name\", mandatory = true,\n        help\
  \ = \"State your name\") String name,\n    @CliOption(key = \"countryOfOrigin\"\
  , mandatory = false,\n        help = \"Country of origin\") MysimplePropertyName\
  \ country) {\n    log.info(\"Welcome \" + name + \"!\");\n    ...\n}\n\n@CliCommand(value\
  \ = \"web mvc install tags\",\n    help=\"Replace default Roo MVC tags used for\
  \ scaffolding\")\npublic void installTags() {\n    operations.installTags();\n}\n\
  ```\n\n在前面的代码中，我们可以看到：\n\n- @Reference 注解按类型执行自动装配，并将引用绑定到实现 MysimpleOperations\
  \ 接口的服务。由于 MysimpleOperationsImpl 实现了 MysimpleOperations 接口，MysimpleOperationsImpl\
  \ 对象的引用被注入到 MysimpleCommands 实例中。\n\n- @CliCommand 是 Roo 的方法级注解，用于标识向 Roo shell\
  \ 贡献命令的方法。value 属性指定由插件向 Roo shell 贡献的命令名称。例如，mysimple 插件向 Roo shell 贡献 say hello\
  \ 和 web mvc install tags 命令。help 属性指定在执行 help Roo 命令时显示在命令旁边的帮助文本。当从 Roo shell 执行\
  \ Roo 命令时，Roo 会执行相应的带 @CliCommand 注解的方法。例如，如果你从 Roo shell 执行 say hello 命令，Roo 会执行\
  \ MysimpleCommands 类的 sayHello 方法，该方法使用 Java Logging API 在 Roo shell 上打印欢迎消息。同样，如果你执行\
  \ web mvc install tags 命令，Roo 会执行 MysimpleCommands 类的 installTags 方法。installTags\
  \ 方法会调用 MysimpleOperationsImpl 类的 installTags 方法，该方法将 info.tagx 和 show.tagx 标签文件复制到你的\
  \ Roo 项目中。在本教程的后面，我们将详细介绍 MysimpleOperationsImpl 类的 installTags 方法。\n\n- @CliOption\
  \ 是 Roo 的方法参数级注解，用于指定 Roo 命令接受的参数。key 属性指定命令参数的名称，mandatory 属性指定参数是必选还是可选，help 属性指定与参数关联的帮助文本。例如，say\
  \ hello 命令接受两个参数——name 和 countryOfOrigin。name 参数是必选的，countryOfOrigin 是可选的。\n\n参数的\
  \ Java 类型可以是简单的 String，也可以是复杂类型。对于 say hello 命令，name 参数的类型为 String，countryOfOrigin\
  \ 的类型为 MysimplePropertyName。Roo 为常见 Java 类型（如 String、Date、Enum、Locale、boolean 等）提供转换器。你也可以创建自定义转换器，并将其作为\
  \ OSGi 服务注册到 Roo。Roo 会使用已注册的转换器，将为参数指定的值转换为方法期望的 Java 类型。对于 mysimple 插件，Roo 会将 say\
  \ hello Roo 命令中 countryOfOrigin 参数输入的值转换为 MysimplePropertyName 类型。在本教程后面，我们将看到，使用\
  \ MysimplePropertyName（一个枚举）作为 countryOfOrigin Roo 参数的 Java 类型，可为参数值提供 Tab 补全功能。我们之前看到，MysimplePropertyName\
  \ 类在 activate 方法中被添加到 StaticFieldConverter 实例中。这样做是为了让 StaticFieldConverter 能够将\
  \ say hello Roo 命令中 countryOfOrigin 参数的值转换为 MysimplePropertyName 类型。\n\n现在让我们来看看，如果某些前置条件未满足，如何使\
  \ Roo 命令对 Roo shell 不可用。\n\n## 使 Roo 命令不可用\n\n如果某些前置条件未满足，你可能希望使 Roo 命令对 Roo shell\
  \ 不可用。例如，如果你尚未使用 project 命令创建 Roo 项目，那么 Roo 不允许你使用 persistence setup 命令设置 JPA 持久化提供程序。\n\
  \n- @CliAvailabilityIndicator 是 Roo 的方法级注解，可让你指定 Roo 命令对 Roo shell 可用必须满足的前置条件。以下代码显示了\
  \ MysimpleCommands 类中定义 say hello 和 web mvc install tags 命令可用性条件的方法：\n\n```\nimport\
  \ org.springframework.roo.shell.CliAvailabilityIndicator;\n...\n@Reference private\
  \ MysimpleOperations operations;\n...\n@CliAvailabilityIndicator(\"say hello\")\n\
  public boolean isSayHelloAvailable() {\n    return true;\n}\n\n@CliAvailabilityIndicator(\"\
  web mvc install tags\")\npublic boolean isInstallTagsCommandAvailable() {\n    return\
  \ operations.isInstallTagsCommandAvailable();\n}\n```\n\n在代码中，带 @CliAvailabilityIndicator\
  \ 注解的方法定义了 say hello 和 web mvc install tags 命令的可用性。@CliAvailabilityIndicator 注解中指定的值标识了用于确定命令可用性而执行该方法的\
  \ Roo 命令名称。例如，isSayHelloAvailable 方法定义了 say hello 命令的可用性，isInstallTagsCommandAvailable\
  \ 方法定义了 web mvc install tags 命令的可用性。带 @CliAvailabilityIndicator 注解的方法的返回类型为 boolean，且该方法必须是公共方法且不接受任何参数。如果带\
  \ @CliAvailabilityIndicator 注解的方法返回的值为 true，则表示相应命令可用，否则不可用。\n\n由于 isSayHelloAvailable\
  \ 方法始终返回 true，say hello 命令对 Roo shell 始终可用。另一方面，isInstallTagsCommandAvailable 方法会查询\
  \ MysimpleOperations 实现，以确定 web mvc install tags 命令的可用性。\n\n现在让我们来看看 MysimpleOperationsImpl\
  \ 类，该类定义了当 mysimple 插件的 Roo 命令从 Roo shell 执行时执行的大部分逻辑。\n\n## MysimpleOperations\
  \ 接口和 MysimpleOperationsImpl 类\n\nMysimpleOperations 接口定义了三个方法，如下表所示：\n\n| 方法 |\
  \ 描述 |\n|---|---|\n| boolean isInstallTagsCommandAvailable() | 检查 SRC_MAIN_WEBAPP/WEB-INF\
  \ 目录下的 tags 子目录是否存在于你的 Roo 项目中。如果目录存在，则返回 true。 |\n| String getProperty(String)\
  \ | 接受系统属性作为参数并返回其值。 |\n| void installTags() | 将 info.tagx 和 show.tagx 标签文件从 mysimple\
  \ 插件复制到你的 Roo 项目中。 |\n\nMysimpleOperationsImpl 类实现了 MysimpleOperations 接口。MysimpleCommands\
  \ 类中定义的方法主要将逻辑处理委托给 MysimpleOperations 接口的实现。以下代码显示了 MysimpleOperationsImpl 类（为简洁起见，未显示方法）：\n\
  \n```\nimport org.springframework.roo.process.manager.FileManager;\nimport org.springframework.roo.project.ProjectOperations;\n\
  \n@Component\n@Service\npublic class MysimpleOperationsImpl\nimplements MysimpleOperations\
  \ {\nprivate static final char SEPARATOR = File.separatorChar;\n\n@Reference private\
  \ FileManager fileManager;\n\n@Reference private ProjectOperations projectOperations;\n\
  ... }\n```\n\nMysimpleOperationsImpl 类使用了 @Component 和 @Service Apache Felix 注解，这意味着\
  \ OSGi 的 SCR 负责管理 MysimpleOperationsImpl 组件的生命周期，并将其作为服务注册到 OSGi 服务注册表中。与 MysimpleCommands\
  \ 一样，你可以使用 @Reference Apache Felix 注解从其他插件访问 MysimpleOperationsImpl 实例。\n\n\n\n\
  Roo 提供许多内置服务，用于简化附加组件开发。FileManager 和 ProjectOperations 类型分别代表 Roo 提供的用于管理文件（如创建、读取、更新文件、撤销功能等）和对\
  \ Roo 项目执行操作（如向 pom.xml 文件添加依赖、更新项目类型等）的服务。FileManager 服务和 ProjectOperations 分别由\
  \ Roo 的 Process Manager 和 FileManager 核心模块提供。需要注意的是，附加组件与 Roo 中的核心模块不同。核心模块提供 Spring\
  \ Roo 工具的重要功能，如文件系统监控、向 Roo shell 注册命令等。由附加组件提供的 Roo 命令由 Spring Roo 用户执行以进行代码生成，但由核心模块提供的\
  \ Roo 命令主要用于访问 Spring Roo 的内部功能，如获取元数据、设置轮询速度等。\n\n前面我们已经看到，MysimpleOperations 的\
  \ isInstallTagsCommandAvailable 方法由 MysimpleCommands 类的 isInstallTagsCommandAvailable\
  \ 方法调用，用于检查 web mvc install tags 命令的可用性。以下代码展示了 MysimpleOperationsImpl 的 isInstallTagsCommandAvailable\
  \ 方法：\n\n```\npublic boolean isInstallTagsCommandAvailable() {\n    return\n   \
  \     projectOperations.isProjectAvailable() &&\n        fileManager.exists(projectOperations.getProjectMetadata()\n\
  \        .getPathResolver().getIdentifier(Path.SRC_MAIN_WEBAPP,\n        \"WEB-INF\"\
  \ + SEPARATOR + \"tags\"));\n}\n```\n\n在代码中，isInstallTagsCommandAvailable 方法使用 ProjectOperation\
  \ 服务来检查 Roo 项目是否存在。该方法还使用 FileManager 服务来检查 Roo 项目的 SRC_MAIN_WEBAPP/WEB-INF 目录中是否存在\
  \ tags 子目录。如果 tags 目录不存在或尚未创建 Roo 项目，则该方法返回 false。这意味着，如果尚未创建包含 SRC_MAIN_WEBAPP/WEB-INF\
  \ 目录中 tags 子目录的 Roo 项目，则 web mvc install tags Roo 命令对 Roo shell 不可用。\n\n前面我们已经看到，MysimpleCommands\
  \ 的 installTags 方法调用 MysimpleOperations 的 installTags 方法。以下代码展示了由 MysimpleOperationsImpl\
  \ 类实现的 installTags 方法：\n\n```\nimport org.springframework.roo.process.manager.MutableFile;\n\
  import org.springframework.roo.project.Path;\nimport org.springframework.roo.project.PathResolver;\n\
  import org.springframework.roo.project.ProjectOperations;\nimport org.springframework.roo.support.util.FileCopyUtils;\n\
  import org.springframework.roo.support.util.TemplateUtils;\n...\npublic void installTags()\
  \ {\n    PathResolver pathResolver =\n    projectOperations.getProjectMetadata().getPathResolver();\n\
  \n    createOrReplaceFile(..., \"info.tagx\");\n    createOrReplaceFile(..., \"\
  show.tagx\");\n}\n\nprivate void createOrReplaceFile(String path, String fileName)\n\
  {\n    String targetFile = path + SEPARATOR + fileName;\n\n    MutableFile mutableFile\
  \ = fileManager.exists(targetFile) ?\n    fileManager.updateFile(targetFile) :\n\
  \    fileManager.createFile(targetFile);\n    try {\n    FileCopyUtils.copy(TemplateUtils.getTemplate(getClass(),\n\
  \    fileName), mutableFile.getOutputStream());\n    } catch (IOException e) {\n\
  \    throw new IllegalStateException(e);\n    }\n}\n```\n\n在代码中，installTags 方法将\
  \ mysimple 附加组件的 SRC_MAIN_RESOURCE/com/roo/addon/mysimple 目录中的 info.tagx 和 show.tagx\
  \ 文件复制到你 Roo 项目的 SRC_MAIN_WEBAPP/WEB-INF/tags 目录中。createOrReplace 方法是 installTags\
  \ 方法用于复制文件的方法。下表描述了 installTags 和 createOrReplace 方法用于复制标签文件所使用的类：\n\n| 类 | 描述 |\n\
  |---|---|\n| PathResolver | 用于定位你 Roo 项目中的文件和目录。你可以使用 ProjectOperations 服务获取对 PathResolver\
  \ 的引用。 |\n| MutableFile | 表示你 Roo 项目中要创建、修改或删除的文件。你可以使用 FileManager 服务获取对 MutableFile\
  \ 实例的引用。 |\n| FileCopyUtils | 实用程序类，提供将资源从附加组件复制到你 Roo 项目的方法。 |\n| TemplateUtils\
  \ | 用于解析附加组件项目中模板文件的实用程序类。我们将在后面详细讨论模板。 |\n\n现在让我们来看看 MysimplePropertyName 枚举类型，它为\
  \ web mvc install tags 命令的 countryOfOrigin 参数定义常量。\n\n## MysimplePropertyName 枚举类型\n\
  \n以下代码展示了 MysimplePropertyName 枚举类型，它为 web mvc install tags 命令的 countryOfOrigin\
  \ 参数值定义常量：\n\n```\npublic enum MysimplePropertyName {\n    AUSTRALIA(\"Australia\"\
  ),\n    UNITED_STATES(\"United States\"),\n    GERMANY(\"Germany\"),\n    NOT_SPECIFIED(\"\
  None of your business!\");\n\n    private String propertyName;\n\n    private MysimplePropertyName(String\
  \ propertyName) {\n        Assert.hasText(propertyName, \"Property name required\"\
  );\n        this.propertyName = propertyName;\n    }\n\n    ...\n}\n```\n\n在代码中，常量\
  \ AUSTRALIA 关联值 Australia，UNITED_STATES 关联值 United States，依此类推。前面我们已经看到，countryOfOrigin\
  \ 参数的类型为 MysimplePropertyName。我们只能为 Roo shell 中的参数传递 String 类型值，因此应将 countryOfOrigin\
  \ 参数的值指定为什么，以及它如何转换为 MysimplePropertyName。当你为 countryOfOrigin 参数输入部分值并按 Tab 键时，Roo\
  \ 内部会查询 MysimplePropertyName 以查找匹配的常量。例如，如果你将 countryOfOrigin 参数的值设为 au，Roo 会尝试在\
  \ MysimplePropertyName 中查找与 au 匹配的常量并自动完成该值。由于匹配不区分大小写，Roo shell 会将 countryOfOrigin\
  \ 参数的值 au 自动完成为 AUSTRALIA。\n\n以下图示总结了简单附加组件的工作原理：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_398_0.png)\n\
  \n该图显示，CommandMarker 是 Roo 提供的接口，由 MysimpleCommands 类实现。MysimpleCommands 类调用 MysimpleOperationsImpl\
  \ 类的方法来处理 mysimple 附加组件暴露的命令。MysimpleCommands 和 MysimpleOperationsImpl 类使用 Roo 提供的服务来执行所需功能。\n\
  \n## 还有更多内容\n\n在本节中，我们将了解：\n\n- 如何在本地部署 mysimple 附加组件以测试 Roo 命令\n- 如何使用枚举类型和 Java\
  \ 类中定义的常量为 Roo 命令实现 Tab 补全支持\n- 如何使用 @CliAvailabilityIndicator 注解为方法定义多个由 *Command\
  \ 类暴露的 Roo 命令的可用性\n- 附加组件中的模板是什么以及它们通常如何使用\n- 附加组件的 pom.xml 文件中的插件和依赖配置\n\n## 部署和运行\
  \ mysimple 附加组件\n\n创建附加组件后，在将其提供给其他开发者之前，你可能想先测试其功能。在本节中，我们将了解如何在本地部署和测试使用 `create\
  \ addon simple` 命令创建的 mysimple 附加组件。\n\n要使用 mysimple 附加组件，需要将其转换为符合 OSGi 规范的 JAR\
  \ 包。为此，请从包含 mysimple 附加组件项目的目录执行 `mvn clean install`，如下所示：\n\n```\nC:\\roo-cookbook\\\
  ch07-simple-add-on> mvn clean install -Dgpg.passphrase=<thephrase>\n```\n\n此处，`<thephrase>`\
  \ 是你使用 GnuPG（也称为 GPG）对附加组件签名时提供的密码短语。有关如何设置 GnuPG 以及为签名附加组件创建密码短语的信息，请参阅 *设置用于附加组件开发的\
  \ GnuPG* 配方。\n\n执行 `mvn clean install` 命令会在 mysimple 附加组件项目的 `target` 目录中创建 `com.roo.addon.mysimple-0.1.0.BUILD-SNAPSHOT.jar`\
  \ 附加组件 OSGi 包。现在，让我们了解如何在 Roo 项目中使用 mysimple 附加组件。\n\n## 在 Roo 项目中使用 mysimple 附加组件\n\
  \n以下步骤将演示如何使用附加组件：\n\n1. 在系统中创建新目录 `C:\\roo-cookbook\\ch07-addon-test`，并从此目录启动 Roo\
  \ shell。\n\n2. 执行 `ch07_web_app.roo` 脚本以创建 `flight-app` Spring Web MVC 项目。\n\n3.\
  \ 执行 `osgi start` 命令来安装并激活 mysimple 附加组件，如下所示：\n```\nroo> osgi start --url file:///C:/roo-cookbook/ch07-simple-add-on/target/com.roo.addon.mysimple-0.1.0.BUILD-SNAPSHOT.jar\n\
  ```\n此处，`url` 参数指定你要安装并激活的附加组件 OSGi 包的位置。\n\n`osgi start` 命令安装 mysimple 附加组件。该命令还用于通过将附加组件\
  \ JAR 文件的 `http://` 或 `https://` URL 作为 `url` 参数的值，下载并安装位于网站上的 Roo 附加组件。\n\n4. 要验证附加组件是否已成功安装，请在\
  \ Roo shell 中输入 `say` 并按 `Tab` 键。Roo 应会将命令自动补全为 `say hello`，如下所示：\n`roo> say hello`\n\
  \n\n\n\n- 5. 再次按 Tab 键，让 Roo 显示 say hello 命令的必需 name 参数，如下所示：\n\nroo> say hello\
  \ --name\n\n- 6. 将 Ron 作为 name 参数的值，然后输入 -- 并按 Tab 键以查看 say hello 命令的可选参数：\n\nroo>\
  \ say hello --name Ron --\n\n- 7. 由于 say hello 命令的唯一可选参数是 countryOfOrigin，因此在 Roo\
  \ shell 中会显示它：\n\nroo> say hello --name Ron --countryOfOrigin\n\n- 8. 现在，再次按 Tab\
  \ 键以查看可以传递给 countryOfOrigin 参数的参数值。您将看到以下输出：\n\nroo> say hello --name Ron --countryOfOrigin\n\
  \n```\nAUSTRALIA       GERMANY       NOT_SPECIFIED   UNITED_STATES\n```\n\n输出显示，countryOfOrigin\
  \ 只能接受四个可能值中的一个：AUSTRALIA、GERMANY、NOT_SPECIFIED 和 UNITED_STATES。\n\n- 9. 输入 aus\
  \ 作为 countryOfOrigin 参数的值，然后按 Tab 键让 Roo 执行值的自动补全，如下所示：\n\nroo> say hello --name\
  \ Ron --countryOfOrigin aus\nroo> say hello --name Ron --countryOfOrigin AUSTRALIA\n\
  \n如所示，Roo 为 countryOfOrigin 参数的值执行自动补全。countryOfOrigin 参数的可能值来自 MysimplePropertyName\
  \ 枚举类型。\n\n- 10. 现在，按 Enter 键让 mysimple 插件处理 say hello 命令。您将看到类似于以下内容的输出：\n\n~.web.controller\
  \ roo> say hello --name Ron --countryOfOrigin\nAUSTRALIA\n\nWelcome Ron!\nCountry\
  \ of origin: Australia\nIt seems you are a running JDK 1.6.0_23\nYou can use the\
  \ default JDK logger anywhere in your add-on to send messages to the Roo shell\n\
  \n执行 `say hello` 命令时，由 `MysimpleCommands` 类的 `sayHello` 方法进行处理。\n\n- 11. 现在，执行 mysimple\
  \ 插件的 `web mvc install tags`，将 `info.tagx` 和 `show.tagx` 文件安装到 `flight-app` Roo\
  \ 项目中：\n\n```\nroo> web mvc install tags\n```\n\n```\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\tags\\util\\info.tagx\nUpdated SRC_MAIN_WEBAPP\\WEB-INF\\tags\\form\\show.tagx\n\
  ```\n\n执行 `web mvc install tags` 的输出显示，`info.tagx` 文件已添加到 `flight-app` 项目，`show.tagx`\
  \ 文件已被替换。`web mvc install tags` 命令由 `MysimpleCommands` 类的 `installTags` 方法处理，该方法又将其委托给\
  \ `MysimpleOperationsImpl` 类的 `installTags` 方法。\n\n如果您对 mysimple 插件进行了修改并想将其重新部署到\
  \ Spring Roo，则可以使用 `osgi update` 命令，如下所示：\n\n```\nroo> osgi update --url file:///C:/roo-cookbook/ch07-simple-add-on/target/com.roo.addon.mysimple-0.1.0.BUILD-SNAPSHOT.jar\n\
  ```\n\n如果您想卸载 mysimple 插件，则可以使用 `osgi uninstall` 命令，如下所示：\n\n```\nroo> osgi uninstall\
  \ --bundleSymbolicName com.roo.addon.mysimple\n```\n\n`bundleSymbolicName` 参数用于标识要从\
  \ Spring Roo 卸载的插件名称。卸载插件后，该插件公开的 Roo 命令将不再可供 Roo shell 使用。\n\n## 带常量值的 Tab 补全功能\n\
  \n`MysimplePropertyName` 枚举类型定义了常量，这些常量表示 Roo 命令参数可以接受的可能值。您并不局限于使用枚举类型来定义参数值的常量。假设我们不想使用\
  \ `MySimplePropertyName` 枚举类型，而是想使用一个定义国家常量的 `Country` 类。以下代码展示了可以用来替代 `MySimplePropertyName`\
  \ 枚举类型的 `Country` 类：\n\n```\npublic class Country {\npublic static final Country\
  \ AUSTRALIA =\nnew Country(\"Australia\");\npublic static final Country NOT_SPECIFIED\
  \ =\nnew Country(\"None of your business!\");\npublic static final Country UNITED_STATES\
  \ =\nnew Country(\"United States\");\npublic static final Country GERMANY =\nnew\
  \ Country(\"Germany\");\n\nprivate String countryName;\n\npublic Country(String\
  \ countryName) {\nthis.countryName = countryName;\n}\n\npublic String getCountryName()\
  \ {\nreturn countryName;\n}\n}\n```\n\n前面的代码显示，Country 类为每个国家定义了常量，这些常量代表 countryOfOrigin\
  \ 参数的可能值。现在，要使用 Country 类代替 MysimplePropertyName 枚举，您只需在 MysimpleCommands 类中将对其的引用替换为\
  \ Country，如下所示：\n\n```\npublic class MysimpleCommands implements CommandMarker {\n\
  @Reference private StaticFieldConverter staticFieldConverter;\n\nprotected void\
  \ activate(ComponentContext context) {\nstaticFieldConverter.add(Country.class);\n\
  }\n\nprotected void deactivate(ComponentContext context) {\nstaticFieldConverter.remove(Country.class);\n\
  }\n```\n\n```\n@CliCommand(value = \"say hello\",\nhelp = \"Prints welcome message\
  \ to the Roo shell\")\npublic void sayHello(... , @CliOption(key = \"countryOfOrigin\"\
  ,\nmandatory = false,\nhelp = \"Country of origin\") Country country) {\n\nlog.info(\"\
  Welcome \" + name + \"!\");\nlog.warning(\"Country of origin: \" + (country == null\
  \ ?\nCountry.NOT_SPECIFIED.getCountryName() :\ncountry.getCountryName())) ;\n...\n\
  }\n...\n```\n\n前面的代码显示，Country 类必须添加到 StaticFieldConverter 服务中，并且必须指定为 sayHello\
  \ 方法中 countryOfOrigin 参数的类型。\n\n## 使用 @CliAvailabilityIndicator 实现多个命令的可用性\n\n在\
  \ mysimple 插件中，使用分别标注了 @CliAvailabilityIndicator 的方法来指示 say hello 和 web mvc install\
  \ tags 命令的可用性。如果您想使用单个标注了 @CliAvailabilityIndicator 的方法来指示 mysimple 插件提供的多个 Roo\
  \ 命令的可用性，请在 @CliAvailabilityIndicator 注解中指定命令数组。例如，您可以在 MysimpleCommands 中定义以下方法，以指示\
  \ say hello 和 web mvc install tags 命令始终可供 Roo shell 使用：\n\n```\n@CliAvailabilityIndicator({\"\
  say hello\",\n\"web mvc install tags\"})\npublic boolean isCommandAvailable() {\n\
  \    return true;\n}\n```\n\n在前面的代码中，@CliAvailabilityIndicator 注解指定了一个 Roo 命令数组（say\
  \ hello 和 web mvc install tags），其可用性由 isCommandAvailable 方法进行检查。\n\n## Roo 插件中的模板\n\
  \n插件项目中的模板是资源，在执行插件的一个或多个命令时，会被复制到 Roo 项目中。例如，当您执行 web mvc install tags 命令时，info.tagx\
  \ 和 show.tagx 文件会从插件复制到 Roo 项目。模板也可以是图片、XML 文件、属性文件等等，由插件命令复制到 Roo 项目中。\n\n模板位于插件项目的\
  \ SRC_MAIN_RESOURCES 目录中。例如，在 mysimple 插件的情况下，info.tagx 和 show.tagx 文件位于 SRC_MAIN_RESOURCES/com/roo/addon/mysimple\
  \ 目录中。插件使用 TemplateUtils 类访问模板，然后使用 FileCopyUtils 类将其复制到 Roo 项目。TemplateUtils 定义了以下两个用于访问插件中模板的静态方法：\n\
  \n- String getTemplatePath(Class<?> clazz, String templateFilename)：此方法通过 templateFilename\
  \ 参数返回模板文件的路径。clazz 参数的包信息用于获取 SRC_MAIN_RESOURCES 目录中包含模板文件的子目录。\n\n例如，如果 clazz\
  \ 参数表示包名为 com.roo.addon.mysimple 的类，而 templateFileName 参数的值为 show.tagx，则 getTemplatePath\
  \ 方法返回 SRC_MAIN_RESOURCES/com/roo/addon/mysimple/show.tagx 文件的路径。您也可以将模板文件的相对路径作为\
  \ templateFilename 参数的值。例如，如果将 templateFilename 的值指定为 WEB-INF/myconfig.xml，则模板文件的路径变为\
  \ SRC_MAIN_RESOURCES/com/roo/addon/mysimple/WEB-INF/myconfig.xml。\n\n- InputStream\
  \ getTemplate(Class<?> clazz, String templateFileName)：此方法返回指向模板文件的 java.io.InputStream。在\
  \ mysimple 插件的情况下，MySimpleOperationsImpl 类的 createOrReplaceFile 方法使用 TemplateUtils\
  \ 类来获取 info.tagx 和 show.tagx 文件的 InputStream。\n\n在某些插件中，模板文件可能是 XML 文件，插件在将其复制到\
  \ Roo 项目之前需要对其进行修改。要修改 XML 模板，Roo 提供了 XMLUtils 类，插件可以使用它来修改 XML 模板文件的内容。让我们看一个场景，该场景展示了插件如何在将\
  \ XML 模板文件复制到 Roo 项目之前修改其内容。\n\n以下 config.xml 文件展示了一个 Spring 应用程序上下文 XML 文件，它代表了插件的模板\
  \ XML 文件：\n\n```\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\n\
  xmlns:context=\"http://www.springframework.org/schema/context\" ...>\n<context:component-scan\
  \ base-package=\"\"/>\n...\n</beans>\n```\n\n在 config.xml 文件中，Spring 上下文命名空间的 <component-scan>\
  \ 元素指定了通过 base-package 属性扫描的包。这些包（及其子包）中标注了 @Component、@Service 和 @Repository Spring\
  \ 注解的类会自动注册到 Spring 的应用程序上下文中。由于插件在执行 Roo 命令时会将 config.xml 文件复制到 Roo 项目，因此插件事先不知道需要为\
  \ base-package 属性指定什么值。这就是 config.xml 文件中 base-package 属性的值为空的原因。\n\n以下代码展示了插件如何读取\
  \ config.xml 文件、对其进行修改，然后将修改后的 config.xml 写入 Roo 项目：\n\n```\nimport org.springframework.roo.metadata.MetadataService;\n\
  import org.springframework.roo.project.PathResolver;\nimport org.springframework.roo.project.ProjectMetadata;\n\
  import org.springframework.roo.support.util.XmlUtils;\nimport org.w3c.dom.Document;\n\
  ```\n\n\n\n\n\n```java\nimport org.w3c.dom.Element;\nimport java.io.ByteArrayOutputStream;\n\
  import java.io.OutputStreamWriter;\n\n@Component\n@Service\npublic class FileWriterOperationsImpl\n\
  implements FileWriterOperations {\n@Reference private MetadataService metadataService;\n\
  ...\npublic void copyApplicationContextXML() {\nProjectMetadata projectMetadata\
  \ =\n(ProjectMetadata) metadataService.get(ProjectMetadata.\ngetProjectIdentifier());\n\
  \nInputStream templateInputStream =\nTemplateUtils.getTemplate(getClass(),\n\"config.xml\"\
  );\nDocument config;\ntry {\nconfig = XmlUtils.getDocumentBuilder().\nparse(templateInputStream);\n\
  } catch (Exception ex) {...}\n\nElement rootElement = (Element) config.getDocumentElement();\n\
  \nXmlUtils.findFirstElementByName(\"context:component-scan\",\nrootElement).setAttribute(\"\
  base-package\",\nprojectMetadata.getTopLevelPackage().\ngetFullyQualifiedPackageName());\n\
  \nByteArrayOutputStream outputStream =\nnew ByteArrayOutputStream();\n\nXmlUtils.writeXml(XmlUtils.createIndentingTransformer(),\n\
  outputStream,\nconfig);\nString xmlContent = outputStream.toString();\n\nFileCopyUtils.copy(xmlContent,\
  \ new OutputStreamWriter(...));\n}\n...\n}\n```\n\nFileWriterOperationsImpl 类与 mysimple\
  \ 插件的 MysimpleOperationsImpl 类类似。它定义了 copyApplicationContextXML 方法，该方法负责将插件中的 config.xml\
  \ 文件复制到 Roo 项目。\n\nMetadataService 类表示 Roo 提供的一种服务，用于检索 Roo 项目、Java 类型、字段、方法等的元数据信息。元数据是通过\
  \ Roo 的 MetadataService 使用元数据标识字符串获取的，其格式为：MID:<fully-qualified-class-name>#<instance-identification-key>，其中\
  \ <fully-qualified-class-name> 是元数据类型，<instance-identification-key> 是元数据所适用的 Java\
  \ 类型。如果元数据未与 Java 类型关联，则元数据字符串格式为：MID:<fully-qualified-class-name>。如果元数据标识字符串的格式为\
  \ MID:<fully-qualified-class-name>#<instance-identification-key>，则称为实例级元数据标识字符串。如果元数据标识字符串的格式为\
  \ MID:<fully-qualified-class-name>，则称为类级元数据标识字符串。在 FileWriterOperationsImpl 类中，ProjectMetadata\
  \ 表示一种元数据类型，用于保存 Roo 项目的详细信息，如项目名称、顶层包名称、依赖项等。ProjectMetadata 的 getProjectIdentifier()\
  \ 方法返回 Roo 项目的元数据标识字符串，并将其传递给 MetadataService 以检索 ProjectMetadata 实例。\n\nTemplateUtils\
  \ 类用于获取指向 config.xml 文件的 java.io.InputStream。随后使用 XmlUtils 类解析 config.xml 文件以构建\
  \ org.w3c.dom.Document 实例。XmlUtils 的 findFirstElementByName 方法用于查找 config.xml 中\
  \ <context:component-scan> 元素的第一个出现位置。findFirstElementByName 方法返回一个 org.w3c.dom.Element\
  \ 实例。Element 的 setAttribute 方法用于将 <context:component-scan> 元素的 base-package 属性值设置为\
  \ Roo 项目的顶层包。XmlUtils 的 writeXml 方法将 Document 对象写入 java.io.OutputStream。XmlUtils\
  \ 的 createIndentingTransformer 方法创建一个 javax.xml.transform.Transformer 实例，该实例将 Document\
  \ 对象中的条目缩进 4 个字符。如果您要对 XML 执行自定义转换，可以创建一个自定义 Transformer 实现，并将其传递给 XmlUtils 类的 writeXml\
  \ 方法。\n\n假设您有一个名为 flight-app 的 Roo 项目，其顶层包为 com.sample.flightapp。现在假设您执行了一个 Roo\
  \ 命令，从而导致执行插件中 FileWriterOperationsImpl 类的 copyApplicationContextXML 方法。该 copyApplicationContextXML\
  \ 方法将读取 config.xml 模板文件，将 <context:component-scan> 元素的 base-package 属性设置为 com.sample.flightapp，并将修改后的\
  \ config.xml 写入 flight-app Roo 项目。\n\n现在让我们来看看 mysimple 插件项目 pom.xml 文件中定义的一些重要配置。\n\
  \n## pom.xml 文件\n\n通过 addon create simple 命令创建的插件的 pom.xml 文件包含以下配置：\n\n- 简单插件所依赖的核心\
  \ Spring Roo 模块在 pom.xml 文件中进行配置。如果您的插件使用了其他插件，则需要在 pom.xml 文件中进行配置。\n- 默认情况下，Google\
  \ Code 被配置为插件的 SCM（软件配置管理）仓库。\n- Maven assembly 插件用于打包插件。您可以执行 perform assembly\
  \ Roo 命令或 assembly 插件的 assembly:single 目标，将插件打包为 ZIP 文件。装配描述文件 assembly.xml 位于插件的\
  \ src/main/assembly 文件夹中。\n- Maven release 插件用于发布插件。在完成插件的本地测试后，您可以通过执行 mvn release:prepare\
  \ release:perform Maven 命令，将插件发布到 Google Code（或您在 pom.xml 文件中配置的 SCM）。\n- Maven\
  \ GPG 插件用于使用 GnuPG 对插件项目的构件进行签名。\n- Maven bundle 插件用于将插件打包为符合 OSGi 标准的 bundle。您会发现，插件\
  \ pom.xml 文件中 <packaging> 元素的值被指定为 bundle，这意味着插件被打包为一个 OSGi bundle。\n\n## 故障排除的\
  \ OSGi 命令\n\n部署插件后，您可以通过从 Roo shell 使用以下 OSGi 命令来检查它是否成功安装：\n\n- osgi ps：列出 OSGi\
  \ bundle 及其状态。如果您已成功安装 mysimple 插件，则执行 osgi ps 命令应显示 mysimple 插件为 active 状态，如下所示：\n\
  \  [Active] [1] Mysimple add-on (0.1.0.BUILD-SNAPSHOT)\n- osgi log：显示 OSGi 容器日志。如果您的插件未能成功安装，可以参考容器日志来排查安装问题。\n\
  - osgi scr list：列出已向 OSGi 容器注册的服务和组件。如果您已成功安装 mysimple 插件，则执行 osgi scr list 命令应显示命令和操作类型，如下所示：\n\
  \  [181] [active] com.roo.addon.mysimple.MysimpleOperationsImpl\n  [180] [active]\
  \ com.roo.addon.mysimple.MysimpleCommands\n\n在上述输出中，数字 180 和 181 分别表示 OSGi 容器分配给\
  \ MysimpleCommands 和 MysimpleOperations 类型的组件 ID。\n\n- osgi scr info：显示已向 OSGi 容器注册的组件或服务的详细信息。该命令接受一个必需参数\
  \ componentId。您可以使用此命令来查找组件无法解析的依赖项。如果您已成功安装 mysimple 插件，则执行 osgi scr info --componentId\
  \ 180（将 180 替换为执行 osgi scr list 命令时显示的 MysimpleCommands 的组件 ID）应显示 MysimpleCommands\
  \ 的依赖项是否已满足，如下所示：\n\n```\nID: 180\nName: com.roo.addon.mysimple.MysimpleCommands\n\
  State: active\nServices: org.springframework.roo.shell.CommandMarker\n...\nReference:\
  \ staticFieldConverter\nSatisfied: satisfied\nService Name: org.springframework.roo.shell.converters.StaticFieldConverter\n\
  ...\nReference: operations\nSatisfied: satisfied\nService Name: com.roo.addon.mysimple.MysimpleOperations\n\
  ```\n\n输出表明，MysimpleCommands 的 StaticFieldConverter 和 MysimpleOperations 依赖项已成功解析。\n\
  \n## 另请参阅\n\n- 请参阅“开发高级插件”教程，了解如何开发可创建新 Java 类、接口和 AspectJ ITD 文件的插件\n\n## 开发高级插件\n\
  \n如果您希望在执行一个或多个 Roo 命令时生成 Java 代码（类和接口）及 AspectJ ITD，则应创建一个高级 Roo 插件。\n\n\n\n\n\n\
  Spring Roo 对简单和高级加载项一视同仁。简单和高级加载项之间的区别存在，以便您可以根据自定义加载项需求选择合适的加载项模板。由 `addon create\
  \ simple` 命令创建的加载项模板在您想要创建自定义加载项（用于向 `pom.xml` 文件添加项目依赖项并向项目添加配置工件）时非常有用。在本示例中，我们将介绍\
  \ `addon create advanced` 命令，如果您想要创建自定义加载项以生成 Java 代码和 AspectJ ITD，则该命令非常有用。\n\n\
  ## 准备工作\n\n在系统中创建新目录 `C:\\roo-cookbook\\ch07-advanced-add-on`，并从 `ch07-advanced-add-on`\
  \ 目录启动 Roo shell。\n\n## 操作步骤...\n\n以下步骤将演示如何创建高级加载项：\n\n- 1. 执行 `addon create advanced`\
  \ 命令，如下所示，以创建 `com.roo.addon.myadvanced` 加载项项目：\n\n  ```\n  ..roo> addon create\
  \ advanced --topLevelPackage com.roo.addon.myadvanced\n  ...\n  Created SRC_MAIN_JAVA\\\
  ...\\MyadvancedCommands.java\n  Created SRC_MAIN_JAVA\\...\\MyadvancedOperations.java\n\
  \  Created SRC_MAIN_JAVA\\...\\MyadvancedOperationsImpl.java\n  Created SRC_MAIN_JAVA\\\
  ...\\MyadvancedMetadata.java\n  Created SRC_MAIN_JAVA\\...\\MyadvancedMetadataProvider.java\n\
  \  Created SRC_MAIN_JAVA\\...\\RooMyadvanced.java\n  Created SRC_MAIN_RESOURCES\\\
  ...\\configuration.xml\n  ```\n\n输出仅显示 Roo 命令生成的一些重要文件，我们将在本示例中讨论这些文件。\n\n- 2. 执行\
  \ `perform eclipse` 命令以创建 Eclipse-IDE 特定的配置文件：\n\n  ```\n  roo> perform eclipse\n\
  \  ```\n\n  现在，将 `com.roo.addon.myadvanced` Eclipse 项目导入 Eclipse IDE。\n\n## 工作原理...\n\
  \n`addon create advanced` 命令创建一个 Roo 加载项模板，您可以将其用作创建自定义 Roo 加载项的起点，该自定义加载项可生成 Java\
  \ 类、接口和 AspectJ ITD。以下类和接口由 `addon create advanced` 命令生成。`<last-part-of-top-level-package>`\
  \ 指的是 topLevelPackage 参数值中最后一个 '.' 之后的文本。在我们的示例中，topLevelPackage 参数值为 com.roo.addon.myadvanced，这使得\
  \ `<last-part-of-top-level-package>` 的值为 'myadvanced'。\n\n- `<last-part-of-top-level-package>Commands.java`\
  \ 类：定义加载项贡献给 Roo shell 的方法。\n- `<last-part-of-top-level-package>Operations.java`\
  \ 接口：定义包含 *Commands.java 类中定义的命令的处理逻辑的方法。\n- `<last-part-of-top-level-package>OperationsImpl.java`\
  \ 类：实现 *Operations.java 接口。\n- `<last-part-of-top-level-package>Metadata.java` 类：表示与此加载项关联的元数据。在此类中，您需要编写创建\
  \ Java 类、接口和 AspectJ ITD 的代码。\n- `<last-part-of-top-level-package>MetadataProvider.java`\
  \ 类：创建与此加载项关联的元数据。\n- `Roo<last-part-of-top-level-package>.java` 类：表示 Roo 注释（类似于其他\
  \ Roo 注释，如 @RooEntity、@RooJavaBean、@RooSolrSearchable 等），它触发此加载项生成 Java 类、接口和 AspectJ\
  \ ITD。\n\n您可能已经注意到，在 SRC_MAIN_RESOURCES\\com\\roo\\addon\\myadvanced 目录中也会生成一个 configuration.xml\
  \ 文件。configuration.xml 文件定义了加载项添加到 Roo 项目 pom.xml 文件中的依赖项。\n\n## MyadvancedCommands\
  \ 类\n\n以下代码显示了 MyAdvancedCommands 类的方法，该类定义了 myadvanced 加载项公开的 Roo 命令：\n\n```\n\
  @Component\n@Service\npublic class MyadvancedCommands implements CommandMarker {\n\
  \    @Reference private MyadvancedOperations operations;\n\n    @CliAvailabilityIndicator({\
  \ \"myadvanced setup\",\n                                \"myadvanced add\", \"\
  myadvanced all \" })\n\n    public boolean isCommandAvailable() {\n        return\
  \ operations.isCommandAvailable();\n    }\n\n    @CliCommand(value = \"myadvanced\
  \ add\",\n        help = \"Some helpful description\")\n    public void add(@CliOption(key\
  \ = \"type\",\n        mandatory = true,\n        help = \"The java type to apply\
  \ this annotation to\")\n        JavaType target) {\n        operations.annotateType(target);\n\
  \    }\n\n    @CliCommand(value = \"myadvanced all\",\n        help = \"Some helpful\
  \ description\")\n    public void all() {\n        operations.annotateAll();\n \
  \   }\n\n    @CliCommand(value = \"myadvanced setup\",\n        help = \"Setup Myadvanced\
  \ addon\")\n    public void setup() {\n        operations.setup();\n    }\n}\n```\n\
  \n如代码所示，myadvanced 加载项向 Roo shell 注册了以下命令：\n\n- myadvanced setup：执行使用加载项所需的初始设置。执行此命令时，myadvanced\
  \ 加载项会更新 pom.xml 文件中的项目依赖项。\n- myadvanced add：使用 @RooMyAdvanced 注释注释 Java 类（通过 myadvanced\
  \ add 命令的 type 参数指定）。在前面的代码中，您会注意到传递给 add 方法的 Java 类是 JavaType 类型。JavaType 表示一种\
  \ Roo 特定的类，用于简化访问 Java 类型的简单名称和包名称。使用 @RooMyAdvanced 注释注释 Java 类型会启动 myadvanced\
  \ 加载项的代码生成。\n- myadvanced all：查找项目中使用 @RooJavaBean 注释注释的所有 Java 类型（我们很快就会看到 myadvanced\
  \ 加载项如何执行此操作），并使用 @RooMyAdvanced 注释注释它们。使用 @RooMyAdvanced 注释注释 Java 类型会启动 myadvanced\
  \ 加载项的代码生成。\n\nMyAdvancedCommands 类还定义了一个带有 @CliAvailabilityIndicator 注释的方法，用于决定\
  \ myadvanced setup、myadvanced add 和 myadvanced all 命令的可用性。\n\n现在让我们来看看 MyadvancedOperationsImpl\
  \ 类，该类提供了 myadvanced 加载项公开的命令的实现。\n\n## MyadvancedOperationsImpl 类\n\n以下代码显示了 MyadvancedOperationsImpl\
  \ 类。代码未显示 annotateType 和 annotateAll 方法的实现，这些内容将在本节后面详细讨论。\n\n```\nimport ... .roo.classpath.PhysicalTypeMetadataProvider;\n\
  import ... .roo.classpath.TypeLocationService;\nimport ... .roo.metadata.MetadataService;\n\
  import ... .roo.model.JavaType;\nimport ... .roo.project.ProjectOperations;\nimport\
  \ ... .roo.project.Dependency;\nimport ... .roo.project.DependencyScope;\nimport\
  \ ... .roo.project.DependencyType;\nimport ... .roo.project.Repository;\nimport\
  \ ... .roo.support.util.XmlUtils;\nimport org.w3c.dom.Element;\n\n@Component\n@Service\n\
  public class MyadvancedOperationsImpl implements\n    MyadvancedOperations {\n\n\
  \    @Reference private MetadataService metadataService;\n    @Reference private\
  \ PhysicalTypeMetadataProvider\n        physicalTypeMetadataProvider;\n    @Reference\
  \ private ProjectOperations projectOperations;\n    @Reference private TypeLocationService\
  \ typeLocationService;\n    ...\n\n    public boolean isCommandAvailable() {\n \
  \       return projectOperations.isProjectAvailable();\n    }\n\n    public void\
  \ annotateType(JavaType javaType) { ... }\n\n    public void annotateAll() { ...\
  \ }\n    public void setup() {\n        projectOperations.addRepository(\n     \
  \       new Repository(\"Myadvanced Roo add-on repository\",\n            \"Myadvanced\
  \ Roo add-on repository\",\n            \"https://com-roo-addon-myadvanced.googlecode.com/svn/repo\"\
  ));\n\n        List<Dependency> dependencies = new ArrayList<Dependency>();\n  \
  \      dependencies.add(\n            new Dependency(\"com.roo.addon.myadvanced\"\
  ,\n            \"com.roo.addon.myadvanced\", \"0.1.0.BUILD-SNAPSHOT\",\n       \
  \     DependencyType.JAR, DependencyScope.PROVIDED));\n\n        for (Element dependencyElement\
  \ :\n            XmlUtils.findElements(\"/configuration/batch/\" +\n           \
  \ \"dependencies/dependency\",\n            XmlUtils.getConfiguration(getClass())))\
  \ {\n            dependencies.add(new Dependency(dependencyElement));\n        }\n\
  \n        projectOperations.addDependencies(dependencies);\n    }\n}\n```\n\nMyadvancedOperationsImpl\
  \ 类引用了 Roo 提供的以下服务：\n\n- **MetadataService**：Roo 提供的服务，用于检索 Roo 项目、Java 类型、字段、方法等的元数据信息。有关更多详细信息，请参阅\
  \ *Developing a simple add-on* 示例。\n- **PhysicalTypeMetadataProvider**：一个元数据提供程序，用于为类、接口、枚举或注释类型提供元数据。如本节后面所述，MyadvancedOperationsImpl\
  \ 类使用此元数据提供程序来获取需要使用 @RooMyAdvanced 注释进行注释的 Java 类型的元数据信息。\n\n\n\n\n\n- ProjectOperations:\
  \ 由 myadvanced 插件在 isCommandAvailable 和 setup 方法中使用，用于检查 Roo 项目是否存在并修改 Roo 项目的 pom.xml\
  \ 文件，如给定代码所示。给定代码中的 isCommandAvailable 方法使用 ProjectOperations 的 isProjectAvailable\
  \ 方法来确定是否已创建 Roo 项目。isCommandAvailable 方法由 MyadvancedCommands 类中带有 @CliAvailabilityIndicator\
  \ 注解的方法调用。此代码中的 setup 方法使用 ProjectOperations 的 addRepository 方法将插件的仓库信息添加到 Roo 项目的\
  \ pom.xml 文件中。默认情况下，该仓库指向插件的 Google Code 仓库目录（参阅 myadvanced 插件的 pom.xml 文件）。setup\
  \ 方法通过使用 addDependencies 方法，将 Roo 项目对 myadvanced 插件的依赖以及 configuration.xml（位于 SRC_MAIN_RESOURCES/com/roo/addon/myadvanced\
  \ 中）文件中定义的依赖添加进去。setup 方法使用 XmlUtils 类的 getConfiguration 方法来加载 configuration.xml\
  \ 文件。\n\n- TypeLocationService: Roo 服务，用于帮助在 Roo 项目中定位 Java 类型。例如，可以使用 TypeLocationService\
  \ 查找带有特定注解的 Java 类型。\n\n- 当执行 myadvanced add 命令时，会调用 MyadvancedOperationsImpl 类的\
  \ annotateType 方法。以下代码显示了 annotateType 方法的实现：\n\n```\nimport ...roo.classpath.PhysicalTypeDetails;\n\
  import ...roo.classpath.PhysicalTypeMetadata;\nimport ...roo.classpath.PhysicalTypeMetadataProvider;\n\
  import ...roo.classpath.TypeLocationService;\nimport ...roo.classpath.details.MemberFindingUtils;\n\
  import ...roo.classpath.details.MutableClassOrInterfaceTypeDetails;\nimport ...roo.classpath.details.annotations.AnnotationMetadataBuilder;\n\
  ...\n@Reference private MetadataService metadataService;\n@Reference private PhysicalTypeMetadataProvider\n\
  \        physicalTypeMetadataProvider;\n...\npublic void annotateType(JavaType javaType)\
  \ {\n        String id =\n                physicalTypeMetadataProvider.findIdentifier(javaType);\n\
  \        PhysicalTypeMetadata physicalTypeMetadata =\n                (PhysicalTypeMetadata)\
  \ metadataService.get(id);\n        PhysicalTypeDetails physicalTypeDetails =\n\
  \                physicalTypeMetadata.getMemberHoldingTypeDetails();\n        MutableClassOrInterfaceTypeDetails\
  \ mutableTypeDetails =\n                (MutableClassOrInterfaceTypeDetails) physicalTypeDetails;\n\
  \        if (MemberFindingUtils.getAnnotationOfType(\n                mutableTypeDetails.getAnnotations(),\n\
  \                new JavaType(RooMyadvanced.class.getName())) == null) {\n     \
  \       JavaType rooRooMyadvanced =\n                    new JavaType(RooMyadvanced.class.getName());\n\
  \            AnnotationMetadataBuilder annotationBuilder =\n                   \
  \ new AnnotationMetadataBuilder(rooRooMyadvanced);\n            mutableTypeDetails.addTypeAnnotation(\n\
  \                    annotationBuilder.build());\n        }\n}\n```\n\nannotateType\
  \ 方法接受一个 JavaType 参数。该 JavaType 参数表示您在 myadvanced add 命令的 type 参数值中指定的 Java 类型。annotateType\
  \ 方法执行以下操作，以使用 @RooMyadvanced 注解对 JavaType 参数进行注解：\n\n- 获取需要应用注解的 JavaType 的元数据识别字符串。这是通过使用\
  \ Roo 的 PhysicalTypeMetadataProvider 类的 findIdentifier 方法实现的。\n\n假设 myadvanced add\
  \ 命令如下所示执行：\n\n```\n... roo> myadvanced add --type sample.roo.flightapp.domain.Flight\n\
  ```\n\n在 myadvanced add 命令中，type 参数的值为 sample.roo.flightapp.domain.Flight。此 Java\
  \ 类型由 Roo 传递给 MyadvancedOperationsImpl 类的 annotateType 方法。PhysicalTypeMetadataProvider\
  \ 类的 findIdentifier 方法返回的元数据识别字符串如下：\n\n```\nMID:org.springframework.roo.classpath.PhysicalTypeIdentifier#SRC_MAIN_JAVA?sample.roo.flightapp.domain.Flight\n\
  ```\n\n- 使用 Java 类型的元数据识别字符串获取 PhysicalTypeMetadata 对象，该对象表示有关 Java 类型的元数据信息。\n\n\
  - 使用 PhysicalTypeMetadata 的 getMemberHoldingTypeDetails 方法检索 PhysicalTypeDetails。PhysicalTypeDetails\
  \ 提供 PhysicalTypeMetadata 所表示的 Java 类型的详细信息。\n\n- 将 PhysicalTypeDetails 转换为 MutableClassOrInterfaceTypeDetails。MutableClassOrInterfaceTypeDetails\
  \ 用于修改其所表示的 Java 类型，即传递给 MyadvancedOperationsImpl 类的 annotateType 方法的 JavaType 参数。除其他外，您可以使用\
  \ MutableClassOrInterfaceTypeDetails 对象从 Java 类型中添加或删除字段、方法和注解。\n\n> 需要注意的是，从 Spring\
  \ Roo 1.2.x 开始，对 Java 类型的修改是使用 Roo 的 TypeManagementService 而不是 Roo 的 MutableClassOrInterfaceTypeDetails\
  \ 来执行的。\n\n- 使用 MemberFindingUtils 工具类检查 Java 类型是否已带有 @RooMyadvanced 注解。\n\n- 使用\
  \ AnnotationMetadataBuilder 创建 @RooMyadvanced 注解，并使用 MutableClassOrInterfaceTypeDetails\
  \ 对象将其添加到 Java 类型中。\n\n- 以下代码显示了 MyadvancedOperationsImpl 类的 annotateAll 方法，该方法将\
  \ @RooMyadvanced 注解添加到所有带有 @RooJavaBean 注解的 Java 类型上：\n\n```\nimport ...roo.classpath.TypeLocationService;\n\
  import ...roo.model.JavaType;\n...\npublic void annotateAll() {\n    for (JavaType\
  \ type:\n        typeLocationService.findTypesWithAnnotation(\n        new JavaType(\"\
  org.springframework.roo.addon. \" +\n        \"javabean.RooJavaBean\"))) {\n   \
  \     annotateType(type);\n    }\n}\n```\n\n如上述代码所示，annotateAll 方法使用 TypeLocationService\
  \ 查找带有 @RooJavaBean 注解的 Java 类型，然后调用 annotateType 方法以使用 @RooMyadvanced 注解对 Java\
  \ 类型进行注解。\n\n现在让我们来看看 myadvanced 插件如何使用 MyadvancedMetadataProvider 类触发代码生成。\n\n\
  ## MyadvancedMetadataProvider 类\n\nMyadvancedMetadataProvider 类表示一个 OSGi 组件，当 Java\
  \ 类型带有 @RooMyadvanced 注解时，该组件会创建一个 MyadvancedMetadata 实例。MyadvancedMetadata 反过来会创建一个\
  \ AspectJ ITD，并向其中添加一个方法和一个字段。在本节中，我们将了解 Roo 生成的 MyadvancedMetadataProvider 是如何实现的。\n\
  \n以下代码显示了 MyadvancedMetadataProvider 类的一些方法：\n\n```\nimport org.apache.felix.scr.annotations.Component;\n\
  import org.apache.felix.scr.annotations.Service;\nimport org.osgi.service.component.ComponentContext;\n\
  import ...roo.classpath.PhysicalTypeIdentifier;\nimport ...roo.classpath.PhysicalTypeMetadata;\n\
  import ...roo.classpath.itd.AbstractItdMetadataProvider;\nimport ...roo.classpath.itd.ItdTypeDetailsProvidingMetadataItem;\n\
  import org.springframework.roo.model.JavaType;\nimport org.springframework.roo.project.Path;\n\
  \n@Component\n@Service\npublic final class MyadvancedMetadataProvider extends\n\
  AbstractItdMetadataProvider {\n\nprotected void activate(ComponentContext context)\
  \ {\nmetadataDependencyRegistry.\nregisterDependency(PhysicalTypeIdentifier.\ngetMetadataIdentifierType(),\
  \ getProvidesType() );\n\naddMetadataTrigger(\nnew JavaType(RooMyadvanced.class.getName()\
  \ ));\n}\n\nprotected void deactivate(ComponentContext context) {\nmetadataDependencyRegistry.\n\
  deregisterDependency(PhysicalTypeIdentifier.\ngetMetadataIdentifierType(), getProvidesType()\
  \ );\n\nremoveMetadataTrigger(\nnew JavaType(RooMyadvanced.class.getName() ));\n\
  }\n...\n}\n```\n\n上述代码显示，MyadvancedMetadataProvider 扩展了 Roo 的 AbstractItdMetadataProvider\
  \ 抽象类。AbstractItdMetadataProvider 类定义了生成 AspectJ ITD 的插件所需的通用功能。activate 方法由 Apache\
  \ Felix OSGi 容器在安装 myadvanced 插件时调用。\n\n## 依赖注册和注销\n\n在第 4 章《使用 Spring Web MVC 进行\
  \ Web 应用程序开发》中，您看到如果在 *Controller.java 类中重新定义 *_Roo_Controller.aj 文件中的方法，则 Roo 会自动从\
  \ *_Roo_Controller.aj 文件中删除该方法。我们还看到，当您修改 @RooEntity 或 @RooWebScaffold 注解时，会导致相应的\
  \ AspectJ ITD 发生修改。Roo 使用元数据识别字符串维护 Roo 项目中 Java 类型（可能是类、接口或 @Roo* 注解）之间的依赖关系，从而使\
  \ Roo 在对 Java 类型进行更改时能够管理 AspectJ ITD 中包含的代码。\n\n现在让我们详细查看 MyadvancedMetadataProvider\
  \ 类 activate 方法中的以下代码片段：\n\n```\nmetadataDependencyRegistry.\n    registerDependency(PhysicalTypeIdentifier.\n\
  \        getMetadataIdentifierType(), getProvidesType());\n```\n\nmetadataDependencyRegistry\
  \ 是 Roo 的 AbstractItdMetadataProvider 类中定义的 protected 属性，类型为 MetadataDependencyRegistry。MetadataDependencyRegistry\
  \ 实例跟踪元数据识别字符串之间的依赖关系。registerDependency 方法用于指定元数据识别字符串之间的依赖关系。PhysicalTypeIdentifier\
  \ 表示一个 Roo 类，用于为 Roo 项目中的 Java 类型创建元数据识别字符串。\n\n在上述代码中，PhysicalTypeIdentifier.getMetadataIdentifierType()\
  \ 代码返回 MID:org.springframework.roo.classpath.PhysicalTypeIdentifier，而 MyadvancedMetadata.getMetadataIdentifierType()\
  \ 返回 MID:com.roo.addon.myadvanced.MyadvancedMetadata。由于这两个元数据识别字符串都不包含其适用的 Java\
  \ 类型，因此它们是类级元数据识别字符串。您可以在类级或实例级元数据识别字符串之间创建依赖关系。\n\nMID:org.springframework.roo.classpath.PhysicalTypeIdentifier\
  \ 表示上游依赖，而 MID:com.roo.addon.myadvanced.MyadvancedMetadata 表示下游依赖。当对上游依赖进行更改时，Roo\
  \ 会负责通知所有下游依赖，这会导致重新创建下游元数据。MetadataProviders 负责处理通知。因此，在 myadvanced 插件的情况下，当 Roo\
  \ 项目中的 Java 类型（由 MID:org.springframework.roo.classpath.PhysicalTypeIdentifier 表示）发生更改时，它会通知\
  \ MyadvancedMetadataProvider 实例。\n\n\n\n\n\n激活方法中指定的元数据依赖项应在元数据提供程序的停用方法中注销。元数据依赖项使用\
  \ MetadataDependencyRegistry 实例的 deregisterDependency 方法注销，MyadvancedMetadataProvider\
  \ 示例如下：\n\n```\nprotected void deactivate(ComponentContext context) {\n    metadataDependencyRegistry.deregisterDependency(PhysicalTypeIdentifier.getMetadataIdentifierType(),\
  \ getProvidesType()));\n    ... }\n```\n\n## 注册和注销元数据创建触发器\n\n元数据依赖注册可确保在上游依赖项发生更改时通知元数据的下游依赖项。要指定触发元数据创建的内容，元数据提供程序使用\
  \ AbstractItdMetadataProvider 类的 addMetadataTrigger 方法，MyadvancedMetadataProvider\
  \ 示例如下：\n\n```\nprotected void activate(ComponentContext context) {\n    metadataDependencyRegistry.registerDependency(PhysicalTypeIdentifier.getMetadataIdentifierType(),\
  \ getProvidesType()));\n    addMetadataTrigger(new JavaType(RooMyadvanced.class.getName()));\n\
  }\n```\n\n在前面的代码中，addMetadataTrigger 方法接受 RooMyadvanced Java 类型。这意味着每当 Java 类型使用\
  \ @RooMyadvanced 注解进行注释时，MyadvancedMetadataProvider 将创建 MyadvancedMetadata 的实例。\n\
  \n元数据触发器由元数据提供程序在停用方法中移除，MyadvancedMetadataProvider 类示例如下：\n\n```\nprotected void\
  \ deactivate(ComponentContext context) {\n    ... removeMetadataTrigger(new JavaType(RooMyadvanced.class.getName()));\n\
  }\n```\n\n现在让我们看看当 Java 类型使用 @RooMyadvanced 注解进行注释时，Spring Roo 在幕后如何生成代码。\n\n##\
  \ 插件的代码生成功能\n\n以下时序图显示了 myadvanced 插件如何处理 myadvanced add --type sample.roo.flightapp.domain.Flight\
  \ 命令，其中 Flight 类表示 Roo 项目中要添加 @RooMyadvanced 注解的 JPA 实体。\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_420_0.png)\n\
  \n该图显示，当执行 myadvanced add 命令时，会调用 MyadvancedCommands 实例的 add 方法，并将类型参数值传递给 add 方法。您可能会注意到\
  \ add 方法接受 JavaType 类型的参数，但我们没有为其向 Roo shell 注册自定义转换器。这是因为 Roo 负责将类型参数值转换为 JavaType\
  \ 类型。JavaType 包含关于类型参数值的简单名称和包名称信息。在我们的例子中，传递给 add 方法的 JavaType 参数包含我们指定为类型参数值的\
  \ Flight 类的简单名称和包名称信息。MyadvancedCommands 的 add 方法调用 MyadvancedOperationsImpl 类的\
  \ annotateType 方法，并传递包含 Flight 类信息的 JavaType 实例。annotateType 方法使用 @RooMyadvanced\
  \ 注解对 Flight.java 文件进行注释。\n\n使用 @RooMyadvanced 注解对 Flight.java 进行注释会导致向 Roo 的文件监控服务发出通知，表明\
  \ Flight.java 文件已被修改。以下时序图显示了 Roo 的文件监控服务如何向 MetadataDependencyRegistry 通知 Flight.java\
  \ 文件的更改：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_420_1.png)\n\n前面的图显示，文件监控服务通知\
  \ PhysicalTypeMetadataProvider Flight.java 文件已被修改。如前面所述，PhysicalTypeMetadataProvider\
  \ 为 Roo 项目中的 Java 类型提供元数据。当 Flight.java 被修改时，PhysicalTypeMetadataProvider 会收到通知，因为\
  \ PhysicalTypeMetadataProvider 是文件更改事件的注册监听器。接收到文件更改通知后，PhysicalTypeMetadataProvider\
  \ 要求 MetadataDependencyRegistry 实例通知任何注册的下游依赖项。如前面所见，MyadvancedMetadataProvider\
  \ 的 activate 方法将 MID:com.roo.addon.myadvanced.MyadvancedMetadata 注册为 MID:org.springframework.roo.classpath.PhysicalTypeIdentifier\
  \ 的下游依赖项。MID:org.springframework.roo.classpath.PhysicalTypeIdentifier 表示 PhysicalTypeMetadataProvider\
  \ 创建的类级元数据标识字符串，表示 Roo 项目中的 Java 类型。因此，Flight.java 的更改会导致通知创建 MID:com.roo.addon.myadvanced.MyadvancedMetadata\
  \ 元数据标识字符串的元数据提供程序，即 MyadvancedMetadataProvider。\n\n以下时序图显示了 MetadataDependencyRegistry\
  \ 如何通知 MyadvancedMetadataProvider 创建 MyadvancedMetadata：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_421_0.png)\n\
  \n在前面的图中，MetadataProvider 表示 Roo 中所有元数据提供程序实现的接口，MetadataItem 表示 MetadataProvider\
  \ 实现创建的元数据。对于 myadvanced 插件，MyadvancedMetadataProvider 实现 MetadataProvider 接口，MyadvancedMetadata\
  \ 实现 MetadataItem 接口。\n\n前面的时序图显示，MetadataDependencyRegistry 通知 MetadataService，以告知元数据提供程序（在\
  \ myadvanced 插件中为 MyadvancedMetadataProvider）下游依赖项。\n\n> MetadataService 是 Roo 中的一个中心服务，了解系统中所有元数据提供程序。您无需将元数据提供程序注册到\
  \ MetadataService，因为如果实现了 MetadataProvider 接口，它可以自动将 OSGi 服务检测为元数据提供程序。\n\n当下游依赖项的\
  \ MetadataProvider（在 myadvanced 插件中为 MyadvancedMetadataProvider）收到通知时，将创建 MetadataItem（在\
  \ myadvanced 插件中为 MyadvancedMetadata），我们稍后将看到。MetadataService 使用 MetadataIdentificationUtils\
  \ 实用程序类来获取与下游依赖项的元数据标识字符串对应的 MetadataProvider 类。一旦获得下游依赖项的 MetadataProvider，MetadataService\
  \ 就会通知 MetadataProvider。\n\nMetadataProvider 需要知道要为哪个 Java 类型创建 MetadataItem。例如，在\
  \ myadvanced 插件示例中，MyadvancedMetadataProvider 需要知道需要为 Flight.java 类创建 MyadvancedMetadata。MetadataProvider\
  \ 将下游依赖项的类级 MID（MID:com.roo.addon.myadvanced.MyadvancedMetadata）转换为实例级 MID（MID:com.roo.addon.myadvanced.MyadvancedMetadata\
  \ #SRC_MAIN_JAVA?sample.roo.flightapp.domain.Flight），以标识要为其创建 MetadataItem 的 Java\
  \ 类型。创建 MetadataItem 实例时，将生成代码。\n\n现在让我们看看 MyadvancedMetadataProvider 的一些方法，这些方法在创建\
  \ MyadvancedMetadata 实例中起着重要作用：\n\n```\nimport ...roo.classpath.itd.ItdTypeDetailsProvidingMetadataItem;\n\
  ...\npublic final class MyadvancedMetadataProvider extends AbstractItdMetadataProvider\
  \ {\n...\nprotected ItdTypeDetailsProvidingMetadataItem getMetadata(String metadataIdentificationString,\n\
  \    JavaType aspectName,\n    PhysicalTypeMetadata governorPhysicalTypeMetadata,\n\
  \    String itdFilename) {\n    return new MyadvancedMetadata(metadataIdentificationString,\n\
  \        aspectName, governorPhysicalTypeMetadata);\n}\n```\n\n```\npublic String\
  \ getItdUniquenessFilenameSuffix() {\n    return \"Myadvanced\";\n}\n```\n\n```\n\
  protected String getGovernorPhysicalTypeIdentifier(String metadataIdentificationString)\
  \ {\n    JavaType javaType = MyadvancedMetadata.getJavaType(metadataIdentificationString);\n\
  \    Path path = MyadvancedMetadata.getPath(metadataIdentificationString);\n   \
  \ return PhysicalTypeIdentifier.createIdentifier(javaType, path);\n}\n```\n\n```\n\
  protected String createLocalIdentifier(JavaType javaType, Path path) {\n    return\
  \ MyadvancedMetadata.createIdentifier(javaType, path);\n}\n```\n\n```\npublic String\
  \ getProvidesType() {\n    return MyadvancedMetadata.getMetadataIdentifierType();\n\
  }\n```\n\n\n\nMyadvancedMetadataProvider 类扩展 AbstractIdMetadataProvider 抽象类，并使用模板方法设计模式。前面代码中所示的方法由\
  \ AbstractIdMetadataProvider 类中定义的具体方法调用。下表描述了每个方法的用途：\n\n| 方法名 | 描述 |\n|---|---|\n\
  | getMetadata | 此方法负责创建并返回 MetadataItem（在 myadvanced 插件的情况下为 MyadvancedMetadata）。\
  \ |\n| getItdUniquenessFilenameSuffix | 此方法返回应用于命名 AspectJ ITD 文件的后缀。由于此方法返回 \"\
  Myadvanced\"，因此此插件创建的 AspectJ ITD 文件名为 *_Roo_Myadvanced.aj。 |\n| getGovernorPhysicalTypeIdentifier\
  \ | 返回接收由 *_Roo_Myadvanced.aj AspectJ ITD 文件定义的方法的 Java 类型的实例级 MID。在我们的示例中，Flight\
  \ 是接收由 *_Roo_Myadvanced.aj 定义的方法的 Java 类型。 |\n| getProvidesType | 此方法返回类级 MID，用于标识此\
  \ MetadataProvider 实现所提供的 MetadataItem。此方法将创建 MID 的责任委托给 MetadataItem 实现类。 |\n|\
  \ createLocalIdentifier | 为指定的 Java 类型和路径参数创建本地实例级 MID。此方法将 MID 的创建委托给 MetadataItem\
  \ 实现类。 |\n\ngetMetadata 方法负责通过传递 MyadvancedMetadata 所依赖的信息来创建 MyadvancedMetadata。下表描述了传递给\
  \ getMetadata 方法的参数：\n\n| 方法参数 | 描述 |\n|---|---|\n| metadataIdentificationString\
  \ | 这表示 MyadvancedMetadata 的实例级元数据。由于 Flight.java 文件使用了 @RooMyadvanced 注解，因此此参数的值为：MID:com.roo.addon.myadvanced.MyadvancedMetadata\
  \ #SRC_MAIN_JAVA?sample.roo.flightapp.domain.Flight。此值由元数据提供程序的超类通过调用 createLocalIdentifier\
  \ 方法和 getProvidesType 方法创建。 |\n| aspectName | 这表示与插件创建的 AspectJ ITD 文件对应的 JavaType。\
  \ |\n| governorPhysicalTypeMetadata | 表示 PhysicalTypeMetadata 实例，用于标识要为其创建 AspectJ\
  \ ITD 文件的 Java 类型。由于 Flight.java 文件使用了 @RooMyadvanced 注解，因此此参数表示与 Flight.java 类对应的\
  \ PhysicalTypeMetadata。 |\n| itdFilename | 这表示 MyadvancedMetadata 创建的 AspectJ ITD\
  \ 文件的名称。此文件的名称由元数据提供程序的超类通过调用 getItdUniquenessFilenameSuffix 方法派生而来。由于 Flight.java\
  \ 文件使用了 @RooMyadvanced 注解，因此文件名为 Flight_Roo_Myadvanced.aj。 |\n\n现在，让我们来看看负责创建 AspectJ\
  \ ITD 文件并向其中添加方法和字段的 MyadvancedMetadata 类。\n\n以下代码显示了 MyadvancedMetadata 类：\n\n\
  ```\npublic class MyadvancedMetadata\nextends AbstractItdTypeDetailsProvidingMetadataItem\
  \ {\nprivate static final String PROVIDES_TYPE_STRING =\nMyadvancedMetadata.class.getName();\n\
  private static final String PROVIDES_TYPE =\nMetadataIdentificationUtils.create(PROVIDES_TYPE_STRING);\n\
  \npublic MyadvancedMetadata(String identifier,\nJavaType aspectName,\nPhysicalTypeMetadata\
  \ governorPhysicalTypeMetadata) {\n\nsuper(identifier, aspectName, governorPhysicalTypeMetadata);\n\
  builder.addField(getSampleField());\nbuilder.addMethod(getSampleMethod());\nitdTypeDetails\
  \ = builder.build();\n}\n\nprivate FieldMetadata getSampleField() {\n...}\n\nprivate\
  \ MethodMetadata getSampleMethod() {\n...}\n\n...\npublic static final String getMetadataIdentifierType()\
  \ {\nreturn PROVIDES_TYPE;\n}\n...\n}\n```\n\n前面的代码显示，MyadvancedMetadata 定义了两个常量和几个方法。PROVIDES_TYPE_STRING\
  \ 常量指 MyadvancedMetadata 类的完全限定名，PROVIDES_TYPE 指 MyadvancedMetadata 类提供的元数据类型。PROVIDES_TYPE\
  \ 的值为 MID:com.roo.addon.myadvanced.MyadvancedMetadata。\n\nMyadvancedMetadata 扩展\
  \ AbstractItdTypeDetailsProvidingMetadataItem 抽象类，该类为希望创建与 Java 类型对应的 AspectJ ITD\
  \ 文件的插件提供通用功能。MyadvancedMetadata 的构造函数使用 MyadvancedMetadataProvider 传递的信息来创建 AspectJ\
  \ ITD 文件。为了简化 AspectJ ITD 文件的创建，使用了 Roo 的 ItdTypeDetailsBuilder 实例（在构造函数中由 builder\
  \ 变量表示）。ItdTypeDetailsBuilder 的 addField 和 addMethod 方法用于添加构成 AspectJ ITD 一部分的字段和方法的信息。上述代码中的\
  \ getSampleField 和 getSampleMethod 方法分别返回 FieldMetadata 和 MethodMetadata，它们表示要添加到\
  \ AspectJ ITD 的字段和方法。\n\n以下代码显示了 MyadvancedMetadata 类的 getSampleField 方法：\n\n```\n\
  private FieldMetadata getSampleField() {\nint modifier = 0;\n\nFieldMetadataBuilder\
  \ fieldBuilder =\nnew FieldMetadataBuilder(getId(),\nmodifier,\nnew ArrayList<AnnotationMetadataBuilder>(),\n\
  new JavaSymbolName(\"sampleField\"),\nJavaType.STRING_OBJECT);\n\nreturn fieldBuilder.build();\n\
  }\n```\n\nRoo 的 FieldMetadataBuilder 用于创建 FieldMetadata 实例。下面是传递给 FieldMetadataBuilder\
  \ 构造函数的参数详细信息：\n\n- getId(): 标识字段将由 AspectJ ITD 引入的 Java 类型\n- modifier: 表示字段的访问修饰符\n\
  - new ArrayList<AnnotationMetadataBuilder>(): 包含必须添加到字段的注解的信息\n- new JavaSymbolName(\"\
  sampleField\"): 字段名\n- JavaType.STRING_OBJECT: 字段的 Java 类型\n\n同样，MyadvancedMetadata\
  \ 的 getSampleMethod 方法使用 Roo 的 MethodMetadataBuilder 来创建 MethodMetadata 实例。\n\n\
  现在您已了解 myadvanced 插件的工作原理，可以像我们使用 mysimple 插件一样在 Roo 项目中使用它。\n\n### 更多内容...\n\n\
  Roo 提供 `metadata for type` 命令来查看 Java 类型的元数据。您也可以使用 `metadata trace` 命令来查看元数据事件通知的发生情况。\n\
  \n### 另请参阅\n\n- 参阅 *开发简单插件* 配方，了解如何开发简单插件\n\n## 将非 OSGi JDBC 驱动程序转换为 OSGi 兼容的包\n\
  \n在第 3 章 Spring Roo 中的高级 JPA 支持中，我们讨论了 Roo 的数据库逆向工程过程要求数据库的 JDBC 驱动程序作为 OSGi 包可用。在本配方中，我们将了解如何使用\
  \ `addon create wrapper` 命令将 H2 数据库的 JDBC 驱动程序转换为 OSGi 包，并在数据库逆向工程中使用它。\n\n### 准备工作\n\
  \n从  下载打包为 ZIP 文件的 H2 数据库，并将其解压到 C:\\roo-cookbook\\ 目录。解压 H2 数据库 ZIP 文件将在 C:\\roo-cookbook\
  \ 目录中创建一个名为 h2 的目录。\n\n### 操作步骤...\n\n以下步骤将演示如何将非 OSGi JDBC 驱动程序转换为 OSGi 兼容的包：\n\
  \n1. 转到 C:\\roo-cookbook\\h2\\bin 目录并双击 h2.bat 文件。这将启动 H2 数据库，并在默认 Web 浏览器中打开 H2\
  \ 控制台，如下面的屏幕截图所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_428_0.png)\n\n请确保将\
  \ **通用 H2 (服务器)** 选为 **已保存的设置** 选项的值，且 **JDBC URL** 字段的值为 `jdbc:h2:tcp://localhost/~myflightappdb`。单击\
  \ **连接** 按钮登录到 H2 控制台。这将自动在 H2 数据库中创建 `myflightappdb`。\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_429_0.png)\n\
  \n现在，将以下 SQL 语句粘贴到给定屏幕截图中显示的文本区域，并通过单击 **运行 (Ctrl+Enter)** 按钮执行它：\n\n```\nDROP TABLE\
  \ IF EXISTS 'customer_tbl';\nCREATE TABLE IF NOT EXISTS 'customer_tbl' (\n 'cust_id'\
  \ int(10) NOT NULL,\n 'cust_dob' date NOT NULL,\n 'cust_name' varchar(50) NOT NULL,\n\
  \ PRIMARY KEY ('cust_id','cust_dob')\n)\n```\n\n执行 SQL 语句将在 `myflightappdb` 数据库中创建\
  \ `CUSTOMER_TBL` 表。\n\n3. 创建 `C:\\roo-cookbook\\ch07-recipes\\driver` 目录，并将 `h2*.jar`\
  \ 文件从 `C:\\roo-cookbook\\h2\\bin` 目录复制到 `driver` 目录。\n\n4. 打开命令提示符，转到 `C:\\roo-cookbook\\\
  ch07-recipes\\driver`，并执行 `maven install` 命令：\n\n```\nC:\\roo-cookbook\\driver>\
  \ mvn install:install-file \n-Dfile=h2-1.3.160.jar -DgroupId=com.h2database -DartifactId=h2\
  \ \n-Dversion=1.3.160 -Dpackaging=jar\n```\n\n此处假设 H2 数据库驱动程序 JAR 文件是 `h2-1.3.160.jar`\
  \ 文件。\n\n5. 创建 `C:\\roo-cookbook\\ch07-recipes\\wrapper` 目录，并从中启动 Roo shell。\n\n\
  \n\n\n\n- 6. 执行 addon create wrapper 命令，创建一个封装 h2-1.3.60.jar Maven 构件的 Roo 插件：\n\
  \n```\n... roo addon create wrapper --topLevelPackage com.h2.roo.jdbc --groupId\
  \ com.h2database --artifactId h2 --version 1.3.60 --vendorName H2 --licenseUrl http://www.h2database.com\n\
  ```\n\n- 7. 修改 pom.xml 文件，将以下 `<Import-Package>` 元素添加到 Maven Bundle Plugin 的配置中：\n\
  \n```\n<instructions>\n<Import-Package>javax.servlet.*;resolution:=optional,\norg.apache.lucene.*;resolution:=optional,\n\
  org.slf4j.*;resolution:=optional\n</Import-Package>\n...\n</instructions>\n```\n\
  \n- 8. 现在，退出 Roo shell 并执行以下 Maven 目标以生成 H2 数据库驱动程序的 OSGi 版本：\n\n```\nC:\\roo-cookbook\\\
  ch07-recipes\\wrapper> mvn bundle:bundle\n```\n\n此 Maven 目标会在项目的 target 目录中创建名为\
  \ com.h2.roo.jdbc.h2-1.3.60.0001.jar 的 OSGi 兼容 H2 数据库驱动程序。\n\n- 9. 创建 C:\\roo-cookbook\\\
  ch07-recipes\\flight-app 目录并从该目录启动 Roo shell。\n\n- 10. 在 flight-app 目录内创建新的 Roo\
  \ 项目：\n\n```\n... roo project --topLevelPackage sample.roo.flightapp --java 6 --projectName\
  \ flight-app\n```\n\n- 11. 将 Hibernate 设置为 myflightappdb H2 数据库的持久性提供程序：\n\n```\n\
  ... roo persistence setup --provider HIBERNATE --database H2_IN_MEMORY --databaseName\
  \ myFlightAppDB\n```\n\n- 12. 将 'sa' 设置为连接 H2 数据库时使用的用户名：\n\n```\n... roo database\
  \ properties set --key database.username --value sa\n```\n\n- 13. 现在，执行 perform\
  \ eclipse 命令以创建 Eclipse IDE 特定的配置文件：\n\n```\n... roo perform eclipse\n```\n\n- 14.\
  \ 将 flight-app 项目导入 Eclipse IDE，并修改 SRC_MAIN_RESOURCES/META-INF/spring/database.properties\
  \ 文件中的 database.url 属性，使其指向 myflightappdb H2 数据库，如下所示：\n\n```\ndatabase.password=\n\
  database.url=jdbc:h2:tcp://localhost/~/myflightappdb\ndatabase.username=sa\ndatabase.driverClassName=org.h2.Driver\n\
  ```\n\n- 15. 现在，安装我们之前创建的 OSGi 兼容的 H2 数据库驱动程序：\n\n```\nroo> osgi start --url file:///C:/roo-cookbook/ch07-recipes/wrapper/target/com.h2.roo.jdbc.h2-1.3.60.0001.jar\n\
  ```\n\n- 16. 执行数据库逆向工程命令，指示 Roo 创建与 H2 数据库中 CUSTOMER_TBL 对应的 JPA 实体：\n\n```\nroo>\
  \ database reverse engineer --schema PUBLIC\n```\n\n## 工作原理...\n\naddon create wrapper\
  \ 命令创建一个封装 Maven 构件的插件。Apache Felix Maven Bundle Plugin 的 bundle 目标为插件项目创建 OSGi\
  \ 兼容的 JAR。\n\n`<Import-Package>` 元素指定捆绑包所需或可选的包。\n\n## 另请参阅\n\n- 请参阅第 3 章的“从数据库创建实体”配方，了解数据库逆向工程命令的工作原理\n\
  \n## 使用推入重构移除 Roo\n\nSpring Roo 负责管理 Roo 项目中的 AspectJ ITD。由于 AspectJ ITD 由 Roo 管理，您不得修改它们。在某些情况下，您可能希望修改\
  \ AspectJ ITD 文件以满足应用程序的要求。例如，您可能希望修改 AspectJ ITD 文件中方法的实现。\n\n在第 6 章“发送电子邮件、消息传递、Spring\
  \ Security、Solr 和 GAE”的“使用 JavaMail API 发送电子邮件”配方中，我们将 FlightController_Roo_Controller.aj\
  \ 文件中的 create(...) 方法复制到 FlightController.java 文件，因为我们希望修改 create(...) 方法的实现。如果\
  \ Roo 发现 Java 源文件中定义了方法，它会从相应的 AspectJ ITD 文件中删除具有相同签名的方法。因此，当我们将 create(...) 方法复制到\
  \ FlightController.java 文件时，Roo 从 FlightController_Roo_Controller.aj 文件中删除了 create(...)\
  \ 方法。如果需要在许多位置执行此操作，复制粘贴方法可能非常棘手。在此配方中，我们将探讨如何使用 Eclipse IDE 将特定方法和属性推入到相应的 Java\
  \ 源文件中。\n\n### 准备工作\n\n如果您使用的不是 STS 以外的任何 IDE，请确保安装了 AJDT（AspectJ 开发工具）。\n\n创建目录\
  \ C:\\roo-cookbook\\ch07-recipes\\push-in 并复制 ch07_web_app.roo 脚本。现在，从 push-in 目录启动\
  \ Roo shell 并使用 script 命令执行脚本。执行脚本将创建一个 flight-app Spring Web MVC 应用程序。\n\n### 操作步骤...\n\
  \n以下步骤将演示如何移除 Roo：\n\n- 1. 将 flight-app Roo 项目导入 Eclipse IDE。\n\n- 2. 在项目资源管理器中选择\
  \ Flight_Roo_ToString.aj AspectJ ITD 文件，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_432_0.png)\n\
  \n- 3. 打开 Flight_Roo_ToString.aj 文件后，在 Eclipse IDE 的大纲视图中，您将看到 Flight_Roo_ToString.aj\
  \ 文件中定义的方法和属性详细信息，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_433_0.png)\n\
  \n- 4. 现在，在大纲视图中右键单击 Flight.toString() : String 元素并选择“重构”选项，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_433_1.png)\n\
  \n- 5. 选择 **重构 | 推入...** 选项将显示以下对话框：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_434_0.png)\n\
  \n- 6. 对话框显示以下信息：\n\n  - 声明切面：显示 AspectJ ITD 文件的名称\n  - 类型间名称：显示从 **大纲** 视图中选择的\
  \ AspectJ ITD 中的声明\n  - Flight：显示声明目标的 Java 类名称\n\n- 7. 选择 **预览** 按钮将显示如果继续此重构操作，将对目标\
  \ Flight 类进行的更改，如下所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_435_0.png)\n\n\
  此屏幕截图显示，`Flight_Roo_ToString.aj` 文件中定义的 `toString` 方法将添加到 `Flight.java` 文件。另外，请注意，如果继续此重构操作，将导致\
  \ `Flight_Roo_ToString.aj` 文件被删除。如果您想保留空的 `Flight_Roo_ToString.aj` 文件，则取消选中 `删除\
  \ ...Flight_Roo_ToString.aj` 选项。\n\n- 8. 单击 **确定** 按钮以完成重构。您现在将看到，`Flight_Roo_ToString.aj`\
  \ AspectJ ITD 中定义的 `toString` 方法已移动到 `Flight.java` 文件。\n\n- 9. 可选地，如果您要撤销重构，只需选择\
  \ Eclipse IDE 的 **编辑 | 撤销** 选项。\n\n### 工作原理...\n\n推入重构类似于 IDE 提供的其他重构机制。根据 AspectJ\
  \ ITD 声明，IDE 会确定声明的目标，并将代码从 ITD 文件移动到目标 Java 源文件。\n\n请注意，如果您要从项目中完全移除 Roo，还需要从项目的\
  \ pom.xml 文件中删除对 Roo 的依赖，并从项目中删除所有 @Roo* 注释（及相应的 import 语句）。\n\n### 更多...\n\n让我们看看如何将单个\
  \ AspectJ ITD 文件中的所有声明推入目标 Java 源文件，以及如何将 Roo 项目中所有 AspectJ ITD 文件中的所有声明推入各自的目标\
  \ Java 源文件。\n\n### 推入重构—单个 AspectJ ITD 文件\n\n要将单个 AspectJ ITD 文件中的所有声明推入目标 Java\
  \ 源文件，请从项目资源管理器中右键单击 AspectJ ITD 文件，或右键单击大纲视图中表示 AspectJ ITD 类型的元素，并选择“重构 | 推入”选项。\n\
  \n以下屏幕截图显示当您从项目资源管理器中选择 flight-app 项目的 Flight_Roo_JavaBean.aj ITD 文件并选择“重构 | 推入”选项时显示的对话框。\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_436_0.png)\n\n此屏幕截图显示，Flight_Roo_JavaBean.aj\
  \ 文件中的所有声明现在都成为重构过程的一部分。\n\n### 推入重构—整个项目\n\n要在整个项目中执行推入重构，请从项目资源管理器中选择项目并选择“重构\
  \ | 推入”选项。\n\n\n\n\n\n## 另请参阅\n\n- 请参阅*“使用提取重构将 Roo 添加到项目”*配方，了解如何从 Java 类中将方法和属性提取到\
  \ AspectJ ITD 文件\n\n## 使用提取重构将 Roo 添加到项目\n\n提取重构是推入重构的逆操作。在推出重构中，您将从 Java 源文件提取方法和属性，并将其移动到\
  \ AspectJ ITD 文件中。此功能在以下情况下特别有用：\n\n- 如果您之前在 Roo 项目上执行过推入重构，而现在希望再次使用 Spring Roo\
  \ 开发您的项目\n- 如果您已部分开发一个项目，而现在希望在其开发中使用 Spring Roo\n- 在本配方中，我们将探讨如何将 `toString` 方法从\
  \ `Flight.java` 文件提取到 `Flight_To_String.aj` 文件中。\n\n## 准备工作\n\n请按照*“使用推入重构移除 Roo”*配方中指定的说明，将\
  \ `Flight_To_String.aj` 文件中定义的 `toString` 方法推送到 `Flight.java` 文件。\n\n## 操作步骤\n\n\
  按照以下步骤将代码从 Java 源文件移动到 AspectJ ITD 文件中：\n\n- 1. 在 `sample.roo.flightapp.domain`\
  \ 包中创建一个 `Flight_To_String.aj` 文件，如下所示：\n\n```\npackage sample.roo.flightapp.domain;\n\
  \npublic aspect Flight_To_String { }\n```\n\n这是一个空切面，我们打算从 Java 源文件中将字段、构造方法、方法等提取到其中。\n\
  - 2. 在 Eclipse IDE 中打开 `Flight.java` 文件。\n- 3. 从 **Outline** 视图中右键单击 toString 方法，并选择\
  \ **重构 | 提取 ITD...**，如下截图所示：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_438_0.png)\n\
  \n- 4. 选择 **提取 ITD** 选项将显示以下对话框，以便让您指定应将所选 `toString` 方法添加到的 AspectJ ITD 文件：\n\n\
  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_438_1.png)\n\n在上述截图中，将 `sample.roo.flightapp.domain.Flight_To_String`\
  \ 输入为 **目标切面** 的名称，并确保选中 **将切面设为特权** 选项。\n\n- 5. 单击 **确定** 将 toString 方法提取到 Flight_To_String.aj\
  \ 文件中。\n\n## 更多内容\n\n如果您希望为现有项目使用 Spring Roo，则需要将 Java 源文件中的方法、属性或构造方法移动到 AspectJ\
  \ ITD 文件中。这些 ITD 文件随后将由 Spring Roo 管理。您需要确保仅将可由 Roo 管理的 Java 元素移动到 AspectJ ITD 文件中。这些\
  \ AspectJ ITD 文件遵循的命名约定应符合 Roo 期望的命名约定。您还需要在 pom.xml 文件中添加必要的 Roo 相关依赖项。\n\n## 另请参阅\n\
  \n- 请参阅“使用推入重构移除 Roo”配方，以便从您的项目中移除 Roo\n\n## 将 Roo 升级到最新版本\n\nRoo 简化了将项目从之前的版本升级到最新版本的过程。您只需从\
  \ Roo 项目的根目录启动 Roo shell 即可。Roo 会针对该版本对 AspectJ ITD 文件进行必要的调整。\n\n在本配方中，我们将查看一个在\
  \ 1.1.3 版本上创建的 Roo 项目，并将其升级到 1.1.5。\n\n## 准备工作\n\n解压本书附带的 ch06-ldap-security.zip\
  \ 文件。解压 ZIP 文件将创建一个名为 ch06-ldap-security 的目录，该目录代表一个使用 Spring Roo 1.1.3 开发的 Roo\
  \ 项目。\n\n## 操作步骤\n\n按照以下步骤升级您的 Roo 版本：\n\n- 1. 从 ch06-ldap-security 目录启动 Roo shell；您将看到以下输出：\n\
  \n```\nUpdated ROOT\\pom.xml [updated property 'roo.version' to '1.1.5.RELEASE']\n\
  Updated SRC_MAIN_JAVA\\...\\domain\\Booking_Roo_ToString.aj\n... SRC_MAIN_JAVA\\\
  ...\\web\\FlightDescriptionController_Roo_Controller_Finder.aj\n...\n```\n\n输出显示，Roo\
  \ 修改的文件之一是 `FlightDescriptionController_Roo_Controller_Finder.aj`。如果您查看此文件，将发现 Roo\
  \ 已添加一个负责搜索 `Flight` 实例的方法。现在，请查看第 4 章《使用 Spring Web MVC 进行 Web 应用程序开发》中的这句话：\n\n\
  > 需要注意的是，在 Spring Roo 1.1.3 中，负责搜索实例的方法不会在 `FlightDescriptionController_Roo_Controller_Finder.aj`\
  \ 中创建。\n>\n> 此错误在 Spring Roo 1.1.4 及更高版本中已修复。\n\n您可以看到，将 Roo 升级到 1.1.5 自动修复了 Roo\
  \ 1.1.3 中存在的错误。\n\n## 工作原理\n\n我们之前提到过，Roo 负责管理 Roo 项目中的 AspectJ ITD 文件。因此，当您升级到更高版本的\
  \ Roo 时，Roo 会负责修改项目中 AspectJ ITD 文件里的代码。\n\n## 更多内容\n\nRoo 的升级过程具有破坏性，也就是说，您无法撤销升级过程中\
  \ Roo 所做的更改。因此，在从项目基目录启动 Roo shell 之前，请确保备份您的项目副本。\n"
