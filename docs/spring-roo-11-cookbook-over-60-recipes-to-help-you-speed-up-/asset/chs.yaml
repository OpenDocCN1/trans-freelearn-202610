- "# Getting Started with Spring Roo\n\n在本章中，我们将介绍以下主题：\n\n- 设置 Roo\n- 从 Roo 获取帮助和提示\n\
  - 创建 Roo 项目\n- 将 Roo 项目导入 Eclipse 或 IntelliJ IDEA IDE\n- 配置日志记录\n- 查看属性文件中定义的属性\n\
  - 管理属性文件中定义的属性\n- 创建 Java 类\n- 向 Java 类添加属性\n- 创建 Java 接口\n- 从 Roo shell 引用类型\n\
  - 从 Roo 脚本创建应用程序工件\n\n## Introduction\n\nJava 为企业应用程序开发提供了优秀的平台，但往往受到生产力问题的拖累。例如，如果您想开发\
  \ Web 应用程序，则需要学习 Web 框架、创建 JSP 或视图、实现服务层、将服务与持久化框架集成、实现持久化逻辑、为不同应用程序层创建配置文件、编写单元和集成测试、编写构建脚本，等等。哎呀！即使是创建一个使用标准\
  \ Java 框架集的简单 Web 应用程序，似乎也是一项大量的工作。这就是许多组织转向提供快速开发简单或中等复杂度应用程序平台的原因。随着 Spring 和\
  \ Hibernate 等开源框架的出现，Java 平台在开发者生产力和简单性方面得到了巨大提升；但在与 Ruby on Rails 等平台相比时，它在生产力水平上仍未达到标准，直到\
  \ Spring Roo 的出现。\n\nSpring Roo 是 Java 编程语言的下一代快速应用程序开发工具。它是一个开源工具，隶属于 SpringSource（http://www.springsource.org/）项目。使用\
  \ Spring Roo 开发的应用程序采用 Spring 编程模型，该模型已有交付可移植、可测试和可维护企业应用程序的成功记录。\n\nSpring Roo\
  \ 是一个易于使用的工具，用于快速使用 Spring、Hibernate、AspectJ、Spring Web Flow、Spring Security、GWT、Flex\
  \ 等公认框架开发 Java 企业应用程序。Spring Roo 负责为您的企业应用程序创建项目结构，添加使用 Maven 构建和部署应用程序的支持，根据您选择的技术创建应用程序架构，根据您选择的测试框架创建单元和集成测试，等等。Spring\
  \ Roo 提供了一个交互式、直观的文本界面，您可以通过分步输入应用程序的详细信息来在几分钟内创建一个可运行的应用程序。\n\n> > 使用 Spring Roo\
  \ 时，由企业应用程序开发人员选择要在应用程序开发中使用的技术或框架。例如，您可以为持久化选择 Hibernate 或 OpenJPA，为 Web 层选择 Spring\
  \ Web Flow 或 GWT。\n\n那么，使用 Spring Roo 开发应用程序需要学习什么？正如我们稍后将看到的，使用 Spring Roo 开发企业应用程序几乎不需要学习任何东西。Spring\
  \ Roo 的关键目标一直是利用企业开发人员的现有知识，并自动化开发人员在典型企业应用程序开发项目中必须执行的大多数任务。这使开发人员的生产力大幅提高，几乎没有学习曲线。难道您不觉得很兴奋吗？您可以使用标准\
  \ Java 技术快速开发 Java 企业应用程序，而无需学习任何新东西。\n\n在开始使用 Spring Roo 工具之前，让我们先了解一下使用 Spring\
  \ Roo 的关键优势：\n\n- 提高企业开发人员的生产力：Spring Roo 根据开发人员提供的指令或从 Spring Roo 已生成的代码中推断的内容自动生成代码，从而提高企业开发人员的生产力。\n\
  - 贯穿项目生命周期的生产力提升：Spring Roo 不仅能让您快速启动项目，而且在项目整个生命周期中都能提供生产力提升。\n- 无额外的抽象层：Spring\
  \ Roo 不试图向企业开发人员隐藏实现细节，使开发人员能够轻松理解代码并根据需要对其进行修改。\n- 无运行时依赖：如果您使用 Spring Roo 开发应用程序，在运行时，您的应用程序代码仅依赖于您用于开发应用程序的框架，不多不少。\n\
  - 无供应商锁定：如果您决定不再使用 Spring Roo，您可以使用 Eclipse IDE 或 STS（Spring Tool Suite——SpringSource\
  \ 的 Eclipse 变体）从应用程序中移除 Spring Roo 特定的细节。\n\n下图展示了您可以使用 Spring Roo 做什么以及能获得的益处：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_21_0.png)\n\n给定的图示表明，您也可以使用 Spring Roo\
  \ 来创建概念验证、创建原型以及学习新技术。使用 Spring Roo，您可以在几分钟内快速创建一个可运行的应用程序，这使其成为开发原型和创建概念验证的理想选择。开发人员可以使用\
  \ Spring Roo 创建一个使用其想要学习的技术的简单应用程序，并对其进行试验，或者浏览 Roo 生成的源代码以快速了解该技术。\n\n\n\n\n\n\
  在本章中，我们将探讨一些帮助你开始使用 Spring Roo 开发企业应用程序的示例。本章中的示例重点演示如何设置 Roo、创建 Roo 项目、创建一些项目构件、从\
  \ Roo shell 获取各种 Roo 命令的帮助和提示，并在你喜爱的 IDE 中导入 Roo 项目。本章将为本书后面章节中将要介绍的更高级示例奠定基础。\n\
  \n## 设置 Roo\n\n要开始使用 Spring Roo，首先需要做的是在你的笔记本电脑或台式机上设置 Roo 工具。\n\n在本示例中，我们将探讨如何安装\
  \ Spring Roo 并验证它已准备就绪。\n\n> **要有效地使用 Spring Roo，我需要学习什么？**\n> \n> 如果你是一位经验丰富的 Java\
  \ 企业级开发人员，那么使用 Spring Roo 几乎不需要学习任何新知识。如果你知道 AspectJ ITDs（类型间声明）的工作原理，那么了解 Spring\
  \ Roo 在幕后所做的工作会很有帮助。随着你阅读本书中的各个示例，你将找到足够的细节来了解 Spring Roo 如何使用 AspectJ ITDs。\n\n\
  ## 准备工作\n\n由于你将要安装 Spring Roo，首先需要从 Spring Roo 官方主页（`http://www.springsource.org/roo/start`）下载\
  \ Spring Roo ZIP 归档文件。此外，请确保你的机器上已安装以下软件：\n\n- Java SE 6 或更高版本（`http://java.sun.com/javase/downloads/index.jsp`）。\n\
  - Apache Maven 3.x 或更高版本（`http://maven.apache.org/download.html`）。\n- 本书中的示例使用 Apache\
  \ Maven 3.0.2\n\n## 操作步骤...\n\n要安装 Spring Roo，只需按照给定步骤操作即可：\n\n- 1. 将下载的 Spring\
  \ Roo ZIP 归档文件解压到一个目录中。解压 Spring Roo ZIP 文件后，你将看到如下截图所示的目录结构（不包括 `cache` 目录）：\n\n\
  | 项目 | 说明 |\n| --- | --- |\n| annotations | 包含用于启动 Roo shell 的 Roo 批处理文件和 shell\
  \ 脚本。 |\n| bin | 包含构成 Roo 的一部分的 OSGi bundle |\n| cache | 包含已安装的 OSGi bundle |\n\
  | docs | 包含特定于已安装 Roo 版本的 Roo 文档 |\n| samples | 包含示例 Roo 脚本 |\n| readme.txt | |\n\
  \n- 2. 将 JAVA_HOME 环境变量设置为指向 Java SE 安装目录。\n\n- 3. 将 ROO_HOME 环境变量设置为指向 Roo 安装目录。\n\
  \n- 4. 如果你使用的是 Windows，请将 ROO_HOME/bin 目录添加到 PATH 环境变量中。如果你使用的是 Linux 或 Mac OS X，请创建指向\
  \ ROO_HOME/bin/roo.sh shell 脚本的符号链接。\n\n- 5. 除非验证安装，否则 Roo 安装不完整。因此，在 C:\\roo-cookbook\
  \ 目录中创建 ch01-recipe 子目录，打开命令提示符，并进入 ch01-recipe 目录。现在，执行 roo.bat 批处理文件，如以下命令所示：\n\
  \n> **下载示例代码**\n> \n> 你可以从 http://www.PacktPub.com 的账户中下载已购买的所有 Packt 图书的示例代码文件。如果你在其他地方购买了本书，可以访问\
  \ http://www.PacktPub.com/support 并注册，以便将文件直接发送到你的电子邮箱。\n\n```\nC:>\\cd roo-cookbook\n\
  C:\\roo-cookbook>cd ch01-recipe\nC:\\roo-cookbook\\ch01-recipe>roo\n\n__   __  \
  \ __\n/  \\_/  \\_/  \\\n/  /  /  /  /  /  /  /\n/  _,_  /  /  /  /  /\n/ / | |\
  \ / / / / / /\n1.1.1.RELEASE [rev 156ccd6]\n```\n\n```\nWelcome to Spring Roo. For\
  \ assistance press TAB or type \"hint\"\nthen hit ENTER.\n..\nroo>\n```\n\n- 6.\
  \ 如果你看到如所示的输出，则表示你已成功安装 Spring Roo。你会注意到，当你执行 `roo.bat` 或 `roo.sh` 时，命令提示符会更改为 `roo>>`。现在你可以开始使用\
  \ Spring Roo 了。\n\n## 工作原理...\n\nSpring Roo 构建在 Apache Felix（http://felix.apache.org/site/index.html）OSGi\
  \ 容器之上，该容器促进应用程序的模块化和动态组装。bundle 目录包含构成 Spring Roo 发行版一部分的 OSGi bundle。这些 bundle\
  \ 提供 Roo 所需的核心服务以及支持代码生成的附加组件。当你第一次通过执行 Roo 批处理文件或 shell 脚本启动 Spring Roo 时，这些 bundle\
  \ 将被安装并复制到 Spring Roo 安装的 cache 目录中。\n\n## 更多内容...\n\nSpring Roo 随附某些作为 Spring Roo\
  \ 发行版一部分的核心服务和基础附加组件。Roo shell、文件系统监视器、引导程序等核心服务为附加组件执行其预定职责提供了必要的基础设施。附加组件是 Spring\
  \ Roo 的核心，它们提供代码生成功能。例如，电子邮件附加组件添加电子邮件支持，JPA（Java Persistence API）附加组件有助于设置 JPA\
  \ 提供程序、创建 JPA 实体及其关系等。\n\n由于 Roo 附加组件符合 OSGi 标准，你还可以创建自定义附加组件或下载第三方附加组件，并将其作为 Spring\
  \ Roo 安装的一部分来安装，以扩展 Roo 的功能。\n\n## 在 Eclipse/STS 中使用 Spring Roo\n\n由于 Roo 是命令行驱动的工具，你可能希望将其与\
  \ Eclipse 或 STS 等功能丰富的 IDE 集成，以简化应用程序开发。如果你使用的是 STS，则无需担心将 Roo 与其集成，因为 STS 中内置了对\
  \ Roo 的支持。如果你想将 Roo 与 Eclipse 集成，可以像安装任何其他 Eclipse 插件一样在 Eclipse 中安装 STS 组件。\n\n\
  如果你使用的是任何其他 IDE，或者不希望将你的 Eclipse IDE 与 Spring Roo 集成，则可以在后台运行 Spring Roo 并使用你喜爱的\
  \ IDE 开发企业应用程序。当你使用 IDE 对企业应用程序进行修改时，Spring Roo 将在后台工作以管理企业应用程序。\n\n以下截图显示了 Spring\
  \ Roo 从 Eclipse IDE 内部启动。它显示 roo> 提示符现在显示在一个文本框旁边，你可以在其中输入 Roo 命令：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_25_0.png)\n\
  \n如果你将给定截图中显示的输出与你之前从命令提示符启动 Roo shell 时看到的输出进行比较，你会发现它们不相同。真的吗？是的，在 Eclipse 或 STS\
  \ 的情况下，要使用 Roo 命令的自动完成功能（欢迎文本中建议），你需要使用 CTRL + SPACE 而不是 TAB。\n\n## 另请参阅\n\n- 下一个示例标题为\"\
  从 Roo 获取帮助和提示\"，展示了 Spring Roo 如何提供有关使用 Roo shell 的上下文敏感提示以及如何随时访问帮助。\n\n## 从 Roo\
  \ 获取帮助和提示\n\nSpring Roo shell 的关键功能之一是它能为开发人员提供上下文敏感的提示。Spring Roo 的提示功能能在几分钟内提供开发可用企业应用程序的逐步指导。例如，如果你还没有在运行\
  \ Roo shell 的目录中创建 Roo 项目，则发出 hint 命令将告诉你如何创建 Roo 项目。如果 Roo 发现执行 Roo shell 的目录中包含一个\
  \ Roo 项目，但尚未设置 JPA 持久性提供程序，则它会建议你为项目设置持久性提供程序（例如 OpenJPA 和 Hibernate）。\n\n> **什么是\
  \ Roo 项目？**\n> \n> Roo 项目只不过是一个源代码由 Java 源文件和 .aj（AspectJ）文件组成的 Java 项目。如果你决定摆脱\
  \ Roo，可以轻松做到这一点，因为生成的代码在运行时不依赖于任何 Roo 库。请参阅第 7 章中的\"从你的项目中删除 Roo 特定详细信息\"示例，以了解如何使用\
  \ Eclipse 和 STS 等 IDE 来删除 Roo。\n\n`help` 命令提供特定版本的 Spring Roo 支持的命令列表，并附带每个命令用途的简短描述。`help`\
  \ 命令列出的命令是你可以从 Roo shell 执行的唯一命令。\n\n需要注意的是，如果 `help` 命令列出的某些 Roo 命令不适用于你的 Roo 项目，则可能无法执行它们。例如，如果你尚未为企业应用程序设置\
  \ JPA 持久性提供程序，Roo shell 不允许你执行创建 JPA 实体的命令。\n\n## 准备工作\n\n要执行本示例中定义的命令，首先创建一个空目录，你将从中启动\
  \ Roo shell。例如，你可以在 `C:` 驱动器的 `cookbook-recipe` 目录中创建名为 `ch01-recipe` 的子目录。进入 `ch01-recipe`\
  \ 目录并执行 `roo.bat` 批处理文件以启动 Roo shell。\n\n## 操作步骤...\n\n要从 Roo 获取帮助和提示，请按照给定步骤操作：\n\
  \n- 1. 要从 Spring Roo 获取帮助，你只需要在 Roo shell 中输入 `help` 命令。但是，在我们的例子中，我们会稍有不同的做法。不要输入完整的命令名，而是输入字母\
  \ `h` 并按 `TAB`（如果你使用的是独立安装的 Spring Roo）或 `CTRL + SPACE`（如果你使用的是安装在 Eclipse IDE 或\
  \ STS 中的 Spring Roo）。你将从 Roo shell 获得以下输出：\n\n```\nroo> h\nhelp hint\nroo> h\n```\n\
  \n如所示的代码中，Roo shell 提供它找到的匹配命令列表。在此例中，是 `help` 和 `hint`。现在，将 `he` 输入 Roo shell 并按\
  \ `TAB` 或 `CTRL + SPACE`。你会注意到，Roo shell 现在会自动为你完成命令，以反映匹配的 `help` 命令。\n\n一旦你输入\
  \ `help` 命令，你将获得 Spring Roo 支持的命令列表，如下所示：\n\n```\nroo> help\n......\n* class - Creates\
  \ a new Java class source file in any project path\n* interface - Creates a new\
  \ Java interface source file in any project path\n* project - Creates a new project\n\
  ```\n\n\n\n- quit - 退出 shell\n- version - 显示 shell 版本\n- .....\n\n如你所见，`help` 命令提供了\
  \ Spring Roo 支持的所有命令的简短描述。例如，它告诉你可以使用 `quit` 命令退出 Roo shell，并使用 `version` 命令了解当前正在使用的\
  \ Spring Roo 版本。\n\n2. 既然你知道 `help` 命令很有用，让我们来试试 `hint` 命令，如下所示：\n\n```\nroo> hint\n\
  Welcome to Roo! We hope you enjoy your stay!\nBefore you can use many features of\
  \ Roo, you need to start a new\nproject.\nTo do this, type 'project' (without the\
  \ quotes) and then hit TAB.\nEnter a --topLevelPackage like 'com.mycompany.projectname'\
  \ (no\nquotes).\nWhen you've finished completing your --topLevelPackage, press\n\
  ENTER.\nYour new project will then be created in the current working\ndirectory.\n\
  .....\n```\n\n从给定输出可以看出，Spring Roo 显示了使用 `project` 命令创建项目的提示。我们将在后续示例中使用 `hint`\
  \ 命令来发现它在创建完全功能项目中的有用性。\n\n### 工作原理...\n\n如前所述，Spring Roo 由核心服务和插件组成。插件旨在根据开发者执行的命令生成代码。在执行\
  \ `hint` 和 `help` 等命令时，Roo 不会生成任何代码。你可以说这些命令由核心服务处理，而不是由任何 Spring Roo 插件处理。\n\n\
  ### 更多内容...\n\nSpring Roo 还提供向 Roo 命令传递参数的选项，这将在后面的章节中介绍。另外，当你从 Roo shell 执行命令时，它会被记录在\
  \ Roo 脚本文件中，这将在 `Log file for executed Roo commands` 章节中说明。\n\n## 向 Roo 命令传递参数\n\
  \n与大多数 Roo 命令一样，`help` 和 `hint` 命令接受参数。参数是传递给 Roo 命令以自定义命令行为的其他参数。例如，`help` 命令接受\
  \ `command` 参数，而 `hint` 命令接受 `topic` 参数。\n\n此前，我们看到 `help` 命令提供了 Spring Roo 支持的命令的高级详细信息。`command`\
  \ 参数用于指定需要详细帮助信息的命令名称，包括可传递给 Roo 命令的必需和可选参数的信息。同样，`hint` 命令的 `topic` 参数提供特定主题的详细信息。`command`\
  \ 和 `hint` 参数是可选参数；Roo shell 不强制你指定它们。\n\n在大多数情况下，Roo 期望你按照以下格式指定参数：\n\n```\n--\
  \ <argument-name> <argument-value>\n```\n\n为了简化 `hint` 和 `help` 命令的使用，Roo 允许你在没有不必要的花哨功能的情况下指定参数。例如，你可以输入\
  \ `help project` 命令以获取 `project` 命令的帮助信息，或者输入 `hint jpa` 命令以获取与 JPA 相关的提示。\n\nRoo\
  \ shell 的以下输出显示了执行 `help project` 和 `hint jpa` 命令的结果：\n\n```\nroo> help project\n\
  ```\n\n```\nKeyword:         project\nDescription:     Creates a new project\nKeyword:\
  \         ** default **\nKeyword:         topLevelPackage\nHelp:            The\
  \ uppermost package name (this becomes the\n<groupId> in Maven and also the '~'\
  \ value when using Roo's shell)\nMandatory:       true\n.....\n```\n\n```\nroo>\
  \ hint jpa\n```\n\nRoo 需要安装 JPA 提供程序和关联数据库。\n\n键入 'persistence setup' 然后按三次 TAB。\n\
  \n.....\n\n从给定输出可以看出，help 命令提供了关于命令的确切详细信息。例如，help project 命令表明 project 命令接受名为 topLevelPackage\
  \ 的必需参数。hint jpa 命令提供了关于 jpa 主题的高级详细信息。\n\n那么问题来了，如何找到可用提示的主题呢？嗯，你可以通过执行 hint topics\
  \ 命令从 Roo 中找到这些主题，如下所示：\n\n```\nroo> hint topics\n```\n\n```\nThe following hints\
  \ are available to help you use Roo:\ngeneral, start, jpa, entities, fields, relationships,\n\
  controllers, finders, eclipse, logging\nJust type 'hint topic_name' (without quotes)\
  \ to view a specific hint.\n```\n\n给定的输出表明，Spring Roo 对以下主题提供提示：jpa、entities、fields、relationships\
  \ 等等。\n\nhelp 和 hint 命令是最常用的命令；建议在使用 Roo 项目时按需使用它们。\n\n## 已执行 Roo 命令的日志文件\n\n假设你使用\
  \ Spring Roo 创建了一个包含 Spring Web MVC 和 Hibernate 框架的企业应用程序。此外，你执行了 Roo 命令，为企业应用程序中创建的某些类添加了电子邮件和\
  \ JMS 消息发送支持。现在，假设你的组织需要创建一个类似的项目，该项目使用 Spring Web MVC、Hibernate 框架，并需要电子邮件和 JMS\
  \ 消息发送功能。你可以重新执行之前企业应用程序中使用的所有 Roo 命令来创建新的企业应用程序，或者直接执行之前企业应用程序的 Roo 脚本。\n\n当你从\
  \ Roo shell 执行命令时，它会被记录在名为 log.roo 的 Roo 脚本文件中。你会注意到在 ch01-recipe 目录中创建了一个 log.roo\
  \ 脚本文件。log.roo 脚本包含你使用 Roo shell 执行的命令，以及启动或退出 Roo shell 时的详细信息。如果你想要回顾执行过的命令，或者想要使用\
  \ Spring Roo 的 script 命令执行同一组命令，Spring Roo 的此功能会很有用。稍后你将看到如何执行 Roo 脚本文件，这将在本章的“从\
  \ Roo 脚本创建应用程序工件”示例中说明。\n\n### 另请参见\n\n- 下一个示例“创建 Roo 项目”展示了如何使用 `help` 命令发现 `project`\
  \ 命令的详细信息，该命令用于创建 Roo 项目。\n\n## 创建 Roo 项目\n\n这是你将看到 Spring Roo 进行实际工作以帮助你创建 Java\
  \ 企业应用程序的第一个示例。此示例展示了如何使用 `project` 命令创建 Roo 项目。按照此示例操作的最终结果将是一个遵循标准 Maven 目录结构的项目。在此示例中创建的项目可以打包为\
  \ JAR 文件，因为它没有 Web 层。在 *第 4 章：使用 Spring Web MVC 进行 Web 应用程序开发* 和 *第 5 章：使用 GWT、Flex\
  \ 和 Spring Web Flow 进行 Web 应用程序开发* 中，你将看到如何使用 Spring Roo 创建企业应用程序的 Web 层。你在此示例中创建的项目将充当本章其余示例的基础。\n\
  \n### 准备工作\n\n首先要做的是创建一个空目录，你将在其中创建 Roo 项目。如果尚未创建，请在 `C:\\roo-cookbook` 目录中创建 `ch01-recipe`\
  \ 子目录。通过执行 Roo 批处理文件或 shell 脚本，从 `ch01-recipe` 目录启动 Roo shell，如下所示：\n\n```\nC:\\\
  roo-cookbook\\ch01-recipe>roo\n```\n\n### 操作方法...\n\n要创建 Roo 项目，请从 Roo shell 执行\
  \ `project` 命令，如下所示：\n\n```\nroo>project --topLevelPackage sample.roo.flightapp\
  \ --java 6 --projectName flight-app\n```\n\n```\nCreated C:\\roo-cookbook\\ch01-recipe\\\
  pom.xml\n......\nCreated SRC_MAIN_RESOURCES\\META-INF\\spring\\applicationContext.xml\n\
  Created SRC_MAIN_RESOURCES\\log4j.properties\n```\n\n```\nsample.roo.flightapp roo>\n\
  ```\n\n执行 `project` 命令后，请注意 Roo 提示符的变化。提示符的变化表明你现在正在使用顶级包为 `sample.roo.flightapp`\
  \ 的项目。如果从已包含 Roo 项目的目录启动 Roo shell，则 Roo 提示符不会改变。\n\n### 工作原理...\n\n下表描述了传递给 `project`\
  \ 命令的每个参数的用途：\n\n| Argument | Purpose |\n| --- | --- |\n| topLevelPackage | 这是一个必需参数，用于标识项目的基础或根包。你将在\
  \ Roo 命令中频繁使用波形符号 (~) 引用此包。此参数的值将成为 maven pom.xml 文件中 `<groupId>` 元素的值。 |\n| java\
  \ | 这是一个可选参数，用于指定 Java 版本（必须是 5、6 或 7），Roo 项目的源代码和编译类应与该版本兼容。如果未指定，Spring Roo 会自动检测\
  \ Java 版本。 |\n| projectName | 这是一个可选参数，用于指定项目名称。此参数的值将成为 maven pom.xml 文件中 `<artifact-id>`\
  \ 和 `<name>` 元素的值。如果未指定，则使用 `topLevelPackage` 参数值指定的包名的最后一部分。例如，如果 `topLevelPackage`\
  \ 参数值为 `sample.roo.flightapp`，且未指定 `projectName` 参数，则假设 `projectName` 参数的值为 `flightapp`。\
  \ |\n\n> ### 定期使用 TAB 或 CTRL + SPACE 来发现必需和可选属性及其预定义值\n> \n> 由于很难记住不同 Roo 命令的所有必需和可选属性，因此建议你使用\
  \ TAB（如果你使用的是独立 Roo）或 CTRL + SPACE（如果你在 Eclipse 或 STS 中使用 Roo）来使用 Roo 的自动完成功能。Roo\
  \ 不仅提供 Roo 命令的自动完成（如我们在之前的示例中所见），而且在你按下 TAB 或 CTRL + SPACE 时还会显示命令的必需参数。如果你想了解命令的可选参数，只需输入\
  \ -- 然后按 TAB 或 CTRL + SPACE。为防止用户输入任意值，命令参数可能只能接受该参数的一组预定义值中的某个特定值。预定义值由负责处理命令的插件定义。如果参数接受\
  \ Roo 的一组预定义值中的某个值，则在你按下 TAB 或 CTRL + SPACE 时会显示该值。\n\n\n\n\nSpring Roo 分发版附带一个\
  \ **Maven 插件**，负责处理 `project` 命令。还有更多 Roo 命令由 Maven 插件处理，您将在本书后面看到。\n\n`project`\
  \ 命令的输出表明，它会创建名为 `SRC_MAIN_JAVA`、`SRC_MAIN_WEBAPP` 等的目录。这些名称是 Maven 插件创建的标准目录的逻辑名称。下表显示了在\
  \ `flight-app` 项目中，每个名称映射到的目录：\n\n| Path value | 项目目录 |\n|:---|:---|\n| SRC_MAIN_JAVA\
  \ | 指 Java 源目录的根目录，其中包含应用程序的 Java 源文件：ch01-recipe\\src\\main\\java。 |\n| SRC_MAIN_RESOURCES\
  \ | 目录的根目录，其中包含 Java 企业应用程序所需的资源（Spring 的应用程序上下文 XML、数据库属性文件、log4j 属性文件、persistence.xml\
  \ 文件等）：ch01-recipe\\src\\main\\resources。 |\n| SRC_TEST_JAVA | Java 源目录的根目录，其中包含单元测试和集成测试：ch01-recipe\\\
  src\\test\\java。 |\n| SRC_TEST_RESOURCES | 目录的根目录，其中包含单元测试和集成测试期间所需的资源：ch01-recipe\\\
  src\\test\\resources。 |\n| SRC_MAIN_WEBAPP | Web 应用程序目录，其中包含网页、图片、样式表和 Web 应用程序配置：ch01-recipe\\\
  src\\main\\webapp。 |\n| ROOT | 指项目的根目录，在 flight-app 项目中为 ch01-recipe。 |\n| SPRING_CONFIG_ROOT\
  \ | 指包含 Spring 应用程序上下文 XML 文件的目录。在 flight-app 项目的上下文中，这指 ch01-recipe\\src\\main\\\
  resources\\META-INF\\spring。 |\n\n从 `project` 命令的执行可以看出，它不仅创建了 Maven 化的项目，还创建了 Spring\
  \ 的 `applicationContext.xml`、Maven 的 `pom.xml` 文件和 `log4j.properties` 文件。以下 XML\
  \ 代码显示了 `applicationContext.xml` 文件的内容，其中包含一些有趣的细节：\n\n```\n<beans ...>\n\n<context:property-placeholder\n\
  \     location=\"classpath*:META-INF/spring/*.properties\"/>\n\n<context:spring-configured/>\n\
  \n<context:component-scan base-package=\"sample.roo.flightapp\">\n    <context:exclude-filter\n\
  \         expression=\".*_Roo_.*\" type=\"regex\"/>\n    <context:exclude-filter\
  \ expression=\n        \"org.springframework.stereotype.Controller\"\n        type=\"\
  annotation\"/>\n</context:component-scan>\n</beans>\n```\n\n从 applicationContext.xml\
  \ 的内容可以得出的重要推论如下：\n\n- Spring `context` 命名空间的 `<property-placeholder>` 元素定义表明，您必须将包含\
  \ Spring bean 配置信息的属性文件放在 META-INF/spring 目录中，以便 Spring 应用程序上下文可以读取它们。在下一章中，我们将看到\
  \ Roo 生成的应用程序如何使用此方法从外部属性文件读取数据库属性。\n\n- Spring `context` 命名空间的 `<spring-configured>`\
  \ 元素指定，使用 `@Configurable` 注解标注的对象将使用 Spring 进行配置，即使它们是在 Spring 容器之外创建的。在 Spring\
  \ 容器之外创建的对象包括使用 `new` 运算符或通过反射以编程方式创建的对象。我们将在第 2 章“使用 JPA 持久化对象”中看到 `@Configurable`\
  \ 注解的示例用法。\n\n- Spring `context` 命名空间的 `<component-scan>` 元素指定，在 `sample.roo.flightapp`\
  \ 包或其子包中找到的 Spring 组件（即使用 `@Service`、`@Repository` 和 `@Component` Spring 注解标注的组件）将自动注册到\
  \ Spring 应用程序上下文中。本章稍后，我们将使用此功能在 flight-app 项目中创建一个服务类，该类将自动注册到 Spring 应用程序上下文。\n\
  \n项目创建期间生成的另一个重要工件是 Maven 使用的 pom.xml 文件。以下 XML 代码展示了项目命令中指定的参数值如何用于创建 flight-app\
  \ 项目的 pom.xml 文件：\n\n```\n<project >\n......\n<groupId>sample.roo.flightapp</groupId>\n\
  <artifactId>flight-app</artifactId>\n<packaging>jar</packaging>\n<version>0.1.0.BUILD-SNAPSHOT</version>\n\
  <name>flight-app</name>\n</project>\n```\n\n您可能注意到 `<packaging>` 元素的值是 `jar` 而不是\
  \ `war`。其原因是我们尚未为 flight-app 应用程序添加 Web 层。我们将在第 4 章“使用 Spring Web MVC 开发 Web 应用程序”和第\
  \ 5 章“使用 GWT、Flex 和 Spring Web Flow 开发 Web 应用程序”中了解如何使用 Spring Roo 创建 Web 应用程序。\n\
  \npom.xml 还包含默认可用于 Roo 项目的 Maven 插件。下表总结了新创建的 flight-app 项目可用的一些重要 Maven 插件：\n\n\
  | Maven 插件 | 用途 |\n|:---|:---|\n| IDEA 插件 | 您可以使用此插件将 flight-app 项目转换为 IntelliJ\
  \ IDEA 项目。 |\n| Eclipse 插件 | 您可以使用此插件将 flight-app 项目转换为 Eclipse 项目。 |\n| AspectJ\
  \ 编译器插件 | 此插件将 AspectJ 切面织入您的项目类中。此插件由 Spring Roo 内部使用。我们将在第 2 章中看到 AspectJ 编译器的实际运作。\
  \ |\n| Tomcat 和 Jetty 插件 | 开发期间可以使用这些插件以嵌入模式运行 Tomcat 或 Jetty 来测试 Web 应用程序。 |\n\n\
  ### 更多内容...\n\n您并不总是从头开始创建项目，并且可能会发现 Spring Roo 足够有吸引力（随着我们了解其各种功能，您会发现）可以用于您现有的基于\
  \ Spring 的 Java 项目。在这种情况下，您需要执行以下操作：\n\n- 1. 将您现有的基于 Spring 的项目转换为由 Spring Roo 的\
  \ project 命令创建的标准 Maven 项目。\n- 2. 将 AspectJ 编译器插件添加到项目的 pom.xml 文件中。\n- 3. 将现有项目中的\
  \ bean 定义移动到 META-INF/spring 目录中的 applicationContext.xml 文件。\n- 4. 将用于配置 Spring\
  \ bean 的属性文件移动到 META-INF/spring/ 目录。\n\n要将现有项目转换为 Roo 项目，您还需要执行其他操作，我们将在相关配方中讨论。\n\
  \n### 另请参阅\n\n- “配置日志”配方讨论了如何在 Roo 项目中配置日志\n- 请参阅“创建 Java 类”和“创建 Java 接口”配方，了解如何使用\
  \ Spring Roo 在应用程序中创建类/接口\n\n## 将 Roo 项目导入 Eclipse 或 IntelliJ IDEA IDE\n\n如“设置 Roo”配方中所述，您可以使用\
  \ STS 或安装了 STS 组件的 Eclipse 来处理 Roo 项目。或者，您可以创建必要的项目文件以将 Roo 项目导入 Eclipse 或 IntelliJ\
  \ IDEA IDE（用于直接处理 Java 源文件和配置文件），并单独在独立模式下运行 Spring Roo shell 以执行 Roo 命令。\n\n在本配方中，我们将了解如何通过执行\
  \ Spring Roo 提供的命令将 Roo 项目导入 Eclipse 或 IntelliJ IDEA。\n\n### 准备工作\n\n从包含 `flight-app`\
  \ Roo 项目的 `C:\\roo-cookbook\\ch01-recipe` 目录启动 Roo shell。\n\n### 操作步骤\n\n要将 Roo\
  \ 项目导入 Eclipse 或 IntelliJ IDEA，请执行以下步骤：\n\n- 1. 要创建 Eclipse 特定的项目文件，请从 Roo shell\
  \ 执行 `perform eclipse` 命令，如下所示：\n  `roo> perform eclipse`\n\n  或者，您可以使用 `perform`\
  \ 命令执行 Maven Eclipse 插件的 `eclipse:eclipse` Maven 目标，如下所示：\n  `roo> perform command\
  \ --mavenCommand eclipse:eclipse`\n\n- 2. 要创建 IntelliJ IDEA 特定的项目文件，请使用 `perform`\
  \ 命令执行 Maven IDEA 插件的 `idea:idea` Maven 目标，如下所示：\n  `roo> perform command --mavenCommand\
  \ idea:idea`\n\n### 工作原理\n\n`perform eclipse` 和 `perform command` 命令由 Spring Roo\
  \ 的 Maven 插件处理。`perform eclipse` 命令生成 Eclipse IDE 特定的配置文件，例如 `.project` 和 `.classpath`\
  \ 文件。在幕后，`perform eclipse` 命令执行 Maven eclipse 插件的 `eclipse:eclipse` 目标。\n\n\n\n\n\
  perform 命令用于执行 Maven 命令。它接受一个单一的必需参数 mavenCommand，用于标识要执行的 Maven 目标。\n\nSpring Roo\
  \ 在项目创建时会在 pom.xml 文件中配置 Maven IDEA 和 Eclipse 插件；你无需将它们添加到 Roo 项目中即可使用本配方中展示的命令。\n\
  \n### 更多内容…\n\n如果你使用的 IDE 不是 STS，请确保安装了 AJDT（AspectJ 开发工具），因为在使用包含 AspectJ 切面的项目时，它能提供更好的开发体验。例如，在安装了\
  \ AJDT 的 Eclipse IDE 中打开 Java 源文件时，“交叉引用”选项卡会显示适用于所选 Java 源文件的各种 AspectJ 声明，你可以选择这些声明以打开相应的\
  \ AspectJ ITD 文件。\n\n### See also\n\n- 请参阅“设置 Roo”配方，了解如何使用 STS 或 Eclipse（带有 STS\
  \ 组件）进行 Spring Roo 开发\n- 请参阅第 7 章“开发插件并从项目中移除 Roo”中的“从项目中移除 Roo 特定详细信息”配方，了解如何将\
  \ Roo 项目转换为普通 Java 项目\n\n## Configuring logging\n\n在“创建 Roo 项目”配方中，你了解到创建新项目时，会自动创建带有默认日志配置的\
  \ log4j.properties 文件。在大多数实际项目中，你可能希望自定义默认的日志配置。默认情况下，log4j.properties 文件将根日志记录器配置为\
  \ ERROR 级别，并且未为项目启用日志记录。\n\n在本配方中，我们将介绍 logging setup 命令，用于修改日志配置。\n\n### Getting\
  \ ready\n\n从 C:\\roo-cookbook\\ch01-recipe 目录启动 Roo shell，该目录包含 flight-app Roo 项目。\n\
  \n### How to do it...\n\n使用 `logging setup` 命令可以指定日志级别及其适用的包，步骤如下：\n\n- 1. 以下 `logging\
  \ setup` 命令用于将 rootLogger 的日志级别更改为 `DEBUG`（默认值为 `ERROR`），并为 `flight-app` 应用程序中的所有类启用\
  \ `DEBUG` 级别日志记录：\n\n```\nroo> logging setup --level DEBUG --package ROOT\nUpdated\
  \ SRC_MAIN_RESOURCES\\log4j.properties\n```\n\n```\nroo> logging setup --level DEBUG\
  \ --package PROJECT\nUpdated SRC_MAIN_RESOURCES\\log4j.properties\n```\n\n正如命令执行输出所示，Roo\
  \ 对 `log4j.properties` 文件做了一些更改。\n\n> **留意命令的输出**\n> 执行 Roo 命令时，它会显示创建了哪些文件和目录或更新了哪些文件。如果你想查看命令执行时生成的代码，这将非常有用。\n\
  \n- 2. 要确认已对 `log4j.properties` 进行更改，可以直接打开文件查看，也可以使用 `properties list` 命令（将在下一配方中介绍）。\n\
  \n### How it works...\n\n`logging setup` 命令由 Spring Roo 的 **Logging 插件** 处理。下表描述了\
  \ `logging setup` 命令接受的参数：\n\n| 参数 | 用途 |\n| :--- | :--- |\n| `level` | 这是必需参数，用于标识日志级别。它只能采用预定义的值之一，如\
  \ `DEBUG`、`ERROR`、`INFO` 等。 |\n| `package` | 这是可选参数，用于指定日志级别适用的包。它只能采用预定义的值之一，如\
  \ `PROJECT`、`ALL_SPRING`、`PERSISTENCE` 等。 |\n\n### There's more...\n\n从 Spring Roo\
  \ 1.1.3 开始，使用 logging setup 命令无法将自定义包名称作为 `package` 参数的值；因此，你可以通过使用 `properties\
  \ set` 命令（本章后面将介绍）或直接编辑 `log4j.properties` 文件来设置自定义包名称。\n\n### See also\n\n- “查看属性文件中定义的属性”、“从属性文件中删除属性”和“向属性文件添加属性”配方展示了如何在\
  \ Roo 项目中管理属性文件。\n\n## Viewing properties defined in a properties file\n\n如果项目包含属性文件，你可能想查看其内容。例如，在之前创建\
  \ flight-app Roo 项目时，还创建了包含日志配置的 log4j.properties 文件。在本配方中，我们将介绍 properties list\
  \ 命令，用于查看 log4j.properties 文件的内容。\n\n### Getting ready\n\n从 C:\\roo-cookbook\\ch01-recipe\
  \ 目录启动 Roo shell，该目录包含 flight-app Roo 项目。\n\n### How to do it...\n\n要查看属性文件的内容，properties\
  \ list 命令需要属性文件的路径和名称。以下 properties list 命令显示 log4j.properties 文件的内容：\n\n```\nroo>\
  \ properties list --name log4j.properties --path SRC_MAIN_RESOURCES\n```\n\n```\n\
  log4j.appender.R = org.apache.log4j.RollingFileAppender\nlog4j.appender.R.File =\
  \ application.log\n...\nlog4j.logger.sample.roo.flightapp = DEBUG\nlog4j.rootLogger\
  \ = DEBUG, stdout\n```\n\n### How it works...\n\n**属性文件插件** 负责处理 `properties list`\
  \ 命令。下表描述了它接受的参数：\n\n| 参数 | 用途 |\n| :--- | :--- |\n| path | 这是必需参数，用于标识属性文件的路径。它只接受\
  \ ROOT、SPRING_CONFIG_ROOT、SRC_MAIN_WEBAPP 等预定义值。 |\n| name | 这是必需参数，用于指定要查看其内容的属性文件名称。\
  \ |\n\n### See also\n\n- 下一配方 *管理属性文件中定义的属性* 展示了如何在 Roo 项目的属性文件中添加、删除和修改属性。\n\n\
  ## Managing properties defined in a properties file\n\n在本配方中，我们将介绍可用于添加、删除和修改属性文件中定义的属性的\
  \ Roo 命令。我们将使用 flight-app 项目的 log4j.properties 文件来演示命令的使用。\n\n下表展示了我们将添加、修改和从 log4j.properties\
  \ 文件中删除的属性：\n\n| 属性 | 操作 |\n| :--- | :--- |\n| log4j.appender.R.File = application.log\
  \ | **已修改**为 log4j.appender.R.File = flightapp.log |\n| log4j.rootLogger = debug,\
  \ stdout | **已修改**为 log4j.rootLogger = ERROR |\n| log4j.appender.stdout = org.apache.log4j.ConsoleAppender\
  \ | 从 log4j.properties 中移除 |\n| log4j.logger.sample.roo.flightapp.service = ERROR\
  \ | 添加到 log4j.properties |\n\n### Getting ready\n\n从 C:\\roo-cookbook\\ch01-recipe\
  \ 目录启动 Roo shell，该目录包含 flight-app Roo 项目。\n\n### How to do it...\n\n要管理属性文件中定义的属性，请按照以下步骤操作：\n\
  \n- 1. `properties set` 命令用于修改属性，如下所示：\n\n```\nroo> properties set --name log4j.properties\
  \ --path SRC_MAIN_RESOURCES --key log4j.appender.R.File --value flightapp.log\n\
  ......\nroo> properties set --name log4j.properties --path SRC_MAIN_RESOURCES --key\
  \ log4j.rootLogger --value ERROR\n```\n\n- 2. `properties remove` 命令用于删除属性，如下所示：\n\
  \n```\nroo> properties remove --name log4j.properties --path SRC_MAIN_RESOURCES\
  \ --key log4j.appender.stdout\n```\n\n- 3. `properties set` 还可用于添加新属性，如下所示：\n\n\
  ```\nroo> properties set --name log4j.properties --path SRC_MAIN_RESOURCES --key\
  \ log4j.logger.sample.roo.flightapp.service --value DEBUG\n```\n\n### How it works...\n\
  \n与 `properties list` 命令一样，`properties set` 和 `properties remove` 命令由 **属性文件插件**\
  \ 提供。下表描述了 `properties set` 和 `properties remove` 命令都接受的参数：\n\n| 参数 | 用途 |\n|---|---|\n\
  | path | 这是必需参数，用于标识属性文件的路径。有关其可接受值的详细信息，请参阅 *查看属性文件中定义的属性* 和 *创建 Roo 项目* 配方。 |\n\
  | name | 这是必需参数，用于指定要移除其属性的属性文件名称 |\n| key | 这是必需参数，用于指定要从属性文件中移除的属性的键 |\n\n`properties\
  \ set` 命令接受 `properties remove` 命令接受的所有参数。此外，它还接受一个必需参数 `value`，用于指定由 `properties\
  \ set` 命令设置的属性值。如果在属性文件中找到匹配的属性，则使用新值更新现有属性。如果未找到匹配的属性，则将新属性添加到属性文件中。\n\n\n\n\n\n\
  ### 还有更多...\n\n你也可以使用自己喜欢的 IDE 来更改属性文件。如果你正在创建一个作为其他项目模板的新 Roo 项目，使用属性命令向属性文件添加、修改和删除属性可能会很有价值。\n\
  \n如果你想修改日志配置，应该首先考虑使用 `logging` 设置命令（前面在 *配置日志* 配方中已介绍）。如果你想修改数据库属性，应该使用数据库命令（在\
  \ *第 2 章，使用 JPA 持久化对象* 中的 *管理数据库配置属性* 配方中有介绍）。\n\n### 另请参见\n\n- *配置日志* 配方介绍了如何使用\
  \ Spring Roo 命令配置日志\n- *管理数据库配置属性* 配方介绍了如何使用 Spring Roo 命令配置数据库属性\n\n## 创建 Java\
  \ 类\n\n你可以在 Roo 项目中创建 Java 类，可以使用自己选择的 IDE，也可以使用 `class` 命令。如果使用 Roo 创建类，样板代码（包括\
  \ `toString` 以及属性的 getter 和 setter 方法）会自动生成，并由 Spring Roo 管理，保存在单独的 AspectJ ITD\
  \ 文件中。\n\n### 准备工作\n\n从 `C:\\roo-cookbook\\ch01-recipe` 目录启动 Roo shell，该目录包含 `flight-app`\
  \ Roo 项目。\n\n### 操作步骤...\n\n你可以使用 `class` 命令创建 Java 类，如下所示：\n\n```\nroo> class --class\
  \ sample.roo.flightapp.service.FlightService\n--rooAnnotations\n\nCreated SRC_MAIN_JAVA\\\
  sample\\roo\\flightapp\\service\nCreated SRC_MAIN_JAVA\\sample\\roo\\flightapp\\\
  service\\FlightService.java\nCreated SRC_MAIN_JAVA\\sample\\roo\\flightapp\\service\\\
  FlightService_Roo_Serializable.aj\n\n~.service.FlightService roo>\n```\n\n执行 `class`\
  \ 命令时，请注意 Roo 提示符会变为引用新创建的 Java 类。在下一个标题为“向 Java 类添加字段”的配方中，我们将看到更改后的 Roo 提示符如何简化对所引用类执行命令。此外，请注意，如果\
  \ service 目录不存在，Spring Roo 会自动创建它。\n\n> 某些命令参数（如 `rooAnnotations`）充当命令处理器的标志，你无需指定其值。\n\
  > 仅将其作为命令的一部分指定，即表示该参数的值为 true 或 yes。\n\n### 工作原理...\n\n`class` 命令接受下表列出的参数：\n\n\
  | 参数 | 用途 |\n| :--- | :--- |\n| class | 它是一个必需参数，用于标识你要创建的 Java 类的完全限定名。你可以使用波浪号符号\
  \ `~` 指定完全限定类名，也可以多次使用 `TAB`（或 `CTRL` + `SPACE`）让 Spring Roo 为你补全包名。`~` 符号引用 Roo\
  \ 项目的顶级包。例如，在 `flight-app` 项目中，它引用 `sample.roo.flightapp` 包。你可以使用此符号指定你想要在其中创建 Java\
  \ 类的包（相对于顶级包）。 |\n| rooAnnotations | 它是一个可选参数，用于指定常见的 Roo 注解，例如 @RooJavaBean、@RooToString\
  \ 和 @RooSerializable，这些注解会添加到生成的 Java 类中。如果未指定，则不会将这些注解添加到生成的 Java 类中。 |\n| path\
  \ | 它是一个可选参数，用于指定创建类所在的源目录路径。默认情况下，路径为 SRC_MAIN_JAVA。 |\n| extends | 它是一个可选参数，用于指定\
  \ Java 类所扩展的类的完全限定名。你可以使用此参数名创建扩展自超类的类。 |\n| abstract | 它是一个可选参数，用于指示类是抽象类还是具体类。你可以使用此参数创建抽象类。\
  \ |\n| permitReservedWords | 它是一个可选参数，用于指示 Roo 是否应允许创建名称是保留字的类。默认情况下，Roo 不允许创建名称使用保留字的\
  \ Java 类。例如，默认情况下你无法创建名为 New 的类。 |\n\n从 `class` 命令接受的参数列表可以看出，Spring Roo 不提供任何参数来让你指定生成的\
  \ Java 类要实现的接口。如果你希望 Java 类实现一个或多个接口，则需要手动修改类定义。\n\n如 `class` 命令的输出所示，除了 `FlightService.java`，Roo\
  \ 还会创建一个 `FlightService_Roo_Serializable.aj` 文件——一个 AspectJ ITD，用于使 `FlightService`\
  \ 类实现 `java.io.Serializable` 接口。\n\nRoo 生成的 AspectJ ITD 遵循以下命名约定：\n\n`<java-class-name>_Roo_<add-on-name>.aj`\n\
  \n其中 `<java-class-name>` 是 AspectJ ITD 适用的 Java 类名称。\n\n`<add-on-name>` 是负责管理 AspectJ\
  \ ITD 的 Spring Roo 插件名称。\n\n`*_Roo_*.aj` 文件由 Roo 管理，你不应直接修改或删除它们。\n\n以下代码展示了如何使用\
  \ `class` 命令通过 `FlightService.java` 文件生成 `FlightService` 类：\n\n```\npackage sample.roo.flightapp.service;\n\
  \nimport org.springframework.roo.addon.javabean.RooJavaBean;\nimport org.springframework.roo.addon.tostring.RooToString;\n\
  import org.springframework.roo.addon.serializable.RooSerializable;\n\n@RooJavaBean\n\
  @RooToString\n@RooSerializable\npublic class FlightService { }\n```\n\n在给定代码中，因为我们在\
  \ `class` 命令中指定了 `rooAnnotations` 参数，所以向生成的 `FlightService` 类添加了 Roo 注解。\n\n为简化调试，开发人员通常会重写\
  \ `java.lang.Object` 类的 `toString` 方法，以输出包含类中所有属性值的字符串。使用 Spring Roo，你无需执行此任务，因为如果你的类使用了\
  \ @RooToString 注解，Spring Roo 会负责在你向 Java 类添加、修改或删除属性时创建和更新 `toString` 方法。\n\n当你向\
  \ `FlightService` 类添加属性时，Roo 会创建一个 `FlightService_Roo_ToString.aj`——一个向 `FlightService`\
  \ 类添加 `toString` 方法的 AspectJ ITD，以及一个 `FlightService_Roo_JavaBean.aj`——一个为 `FlightService`\
  \ 类中定义的属性添加 getter 和 setter 方法的 AspectJ ITD。这些切面的创建是由 `FlightService` 类中 @RooToString\
  \ 和 @RooJavaBean 注解的存在触发的。\n\n要查看这两个 ITD 文件，向 FlightService 类添加以下属性：\n\n```\nprivate\
  \ String origin;\n```\n\n如果你的 Roo shell 正在运行，一旦保存 FlightService 类，Roo 就会在与 FlightService\
  \ 类相同的包中生成 FlightService_Roo_ToString.aj 文件和 FlightService_Roo_JavaBean.aj 文件。如果你观察\
  \ Roo shell，会发现 Roo 报告已创建 FlightService_Roo_ToString.aj 和 FlightService_Roo_JavaBean.aj\
  \ 文件，如下所示：\n\n```\nCreated SRC_MAIN_JAVA\\sample\\roo\\flightapp\\service\\\nFlightService_Roo_ToString.aj\n\
  ```\n\n```\nCreated SRC_MAIN_JAVA\\sample\\roo\\flightapp\\service\\\nFlightService_Roo_JavaBean.aj\n\
  ```\n\n以下代码展示了 FlightService_Roo_ToString.aj AspectJ ITD 如何向 FlightService 类添加 toString\
  \ 方法：\n\n```\npackage sample.roo.flightapp.service;\n\nprivileged aspect FlightService_Roo_ToString\n\
  {\n    public String FlightService.toString()\n    {\n        StringBuilder sb =\
  \ new StringBuilder();\n        sb.append(\"Origin: \");\n        sb.append(getOrigin());\n\
  \        return sb.toString();\n    }\n}\n```\n\n给定代码显示 FlightService_Roo_ToString\
  \ 是一个特权切面，即它可以访问其他切面和类中甚至 **私有** 成员。声明 public String FlightService.toString() 向\
  \ FlightService 类添加一个公共 toString 方法，该方法不接受任何参数并返回一个字符串。花括号内的所有内容都是 toString 方法的实现。AspectJ\
  \ ITD 文件中的每个声明都标识该声明的目标。在代码中，声明中的 FlightService 表示 FlightService 类是目标；因此，它会将 toString\
  \ 方法添加到 FlightService 类。在“向 Java 类添加字段”配方中，我们将看到当你向 FlightService 类添加更多属性时，Spring\
  \ Roo 如何自动更新 toString 方法。\n\n\n\n\n下图总结了前一节列表中的 FlightService_Roo_ToString.aj 文件如何为\
  \ Flight 类声明添加 toString 方法：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_45_0.png)\n\
  \n> 在 Spring Roo 中，AspectJ ITD 负责向 Java 类添加字段、方法和构造函数，并使其实现接口或扩展自父类。Spring Roo 负责管理这些\
  \ ITD，您不应直接修改或删除它们。\n\n以下代码显示了 FlightService_Roo_JavaBean.aj AspectJ ITD 文件：\n\n\
  ```\nprivileged aspect FlightService_Roo_JavaBean\n{\n\npublic String FlightService.getOrigin()\n\
  {\n    return this.origin;\n}\n\npublic void FlightService.setOrigin\n(String origin)\n\
  {\n    this.origin = origin;\n}\n}\n```\n\n给定代码表明 FlightService_Roo_JavaBean.aj\
  \ 也是一个 privileged aspect，它将两个方法引入 FlightService 类：getOrigin 和 setOrigin，用于获取和设置\
  \ origin 属性的值。\n\nFlightService_Roo_Serializable.aj AspectJ ITD 定义 FlightService\
  \ 类实现 java.io.Serializable 接口，如下所示：\n\n```\npackage sample.roo.flightapp.service;\n\
  \nimport java.io.Serializable;\n\nprivileged aspect FlightService_Roo_Serializable\n\
  {\n    declare parents: FlightService implements Serializable;\n\nprivate static\
  \ final long FlightService.serialVersionUID = 5059552858884348572L;\n\n}\n```\n\n\
  在给定代码中，declare parents: FlightService implements Serializable 语句声明 FlightService\
  \ 类实现 java.io.Serializable 接口。下图总结了此声明的含义：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_46_0.png)\n\
  \n语句 private static final long FlightService.serialVersionUID = 5059552858884348572L，为包含它的\
  \ FlightService 类添加了一个 serialVersionUID 字段（如果您的类实现 Serializable 接口，则定义的就是此字段）。\n\
  \n### 更多内容...\n\n如果您希望 Roo 管理类中 `toString` 方法以及属性的 getter 和 setter 方法的创建，建议在 `class`\
  \ 命令中使用 `rooAnnotations` 参数。\n\n> Roo 注解具有源级保留策略，这意味着您的应用程序在运行时不依赖于 Roo 注解。\n\n\
  ## 将现有 Spring 项目迁移至使用 Spring Roo\n\n如果您正在将现有基于 Spring 的项目迁移至 Roo，从本示例中可以看出，您应执行以下操作：\n\
  \n- 1. 从所有现有类中移除 `toString` 方法，并添加 `@RooToString` 注解。\n- 2. 从类中移除 `Serializable`\
  \ 接口的实现，改为使用 `@RooSerializable` 注解对类进行注解。\n- 3. 从 Java 类中移除 getter 和 setter 方法，改为使用\
  \ `@RooJavaBean` 注解对类进行注解。\n\n> **将服务类注册到 Spring 应用程序上下文**\n>\n> 使用 Spring Roo 无法创建自动注册到\
  \ Spring 应用程序上下文的服务类；因此，如果您希望服务类被自动注册，请使用 `@Service` 注解对其进行注解。只要服务类位于顶层目录中，它就会注册到\
  \ Spring 应用程序上下文中（有关详细信息，请参阅*创建 Roo 项目*示例中描述的 `<component-scan>` 元素）。\n\n### @RooToString—自定义\
  \ toString 方法的名称\n\n我们看到，使用 `@RooToString` 注解会在相应的 AspectJ ITD 文件中创建一个名为 `toString`\
  \ 的方法。您可以使用 `@RooToString` 注解的 `toStringMethod` 属性为 `toString` 方法指定自定义名称，如下所示：\n\
  \n```\n`@RooToString(toStringMethod = \"myToString\")\npublic class MyCustomClass\
  \ { private String myAttr; }`\n```\n\n在给定代码中，toStringMethod 属性将 myToString 指定为充当\
  \ MyCustomClass 的 toString 方法的方法名称。与 @RooToString 注解对应的 ITD 文件 MyCustomClass_Roo_ToString.aj\
  \ 现在将创建一个类似于 toString 但名为 myToString 的方法，如下所示：\n\n```\nprivileged aspect MyCustomClass_Roo_ToString\n\
  {\n    public String MyCustomClass.myToString ()\n    {\n        StringBuilder sb\
  \ = new StringBuilder();\n        sb.append(\"MyAttr: \" ).append(getMyAttr());\n\
  \        return sb.toString();\n    }\n}\n```\n\n### @RooToString—从 toString 方法中排除属性\n\
  \n在某些情况下，您可能希望限制属性成为自动生成的 toString 方法的一部分。@RooToString 注解提供了 excludeFields 属性，可让您指定应从自动生成的\
  \ toString 方法中排除的属性数组，如下所示：\n\n```\n@RooToString(excludeFields={\"someAttribute\"\
  })\npublic class MyCustomClass { ... }\n```\n\n在此代码中，@RooToString 注解指示 MyCustomClass\
  \ 类的 toString 方法不得包含 someAttribute 属性。\n\n### 另请参阅\n\n- 《向 Java 类添加属性》示例解释了如何使用\
  \ roo 向 Java 类添加属性\n- 《创建 Java 接口》示例解释了如何从 Roo shell 创建 Java 接口\n\n## 向 Java 类添加属性\n\
  \n您可以从 IDE 或使用 Spring Roo 的 field 命令，向 Roo 项目中的 Java 类添加属性。与使用 IDE 相比，使用 Roo 添加属性具有优势，我们将在本示例中了解这些优势。下表显示了我们将添加到\
  \ flight-app 项目中 sample.roo.flightapp.domain 包下的 Passenger 类的属性名称和类型：\n\n| 字段名称\
  \ | 类型 |\n| :--- | :--- |\n| firstName | java.lang.String |\n| lastName | java.lang.String\
  \ |\n| age | java.lang.Integer |\n| address | sample.roo.flightapp.domain.Address\
  \ |\n\n### 准备工作\n\n从包含 flight-app 项目的 C:\\roo-cookbook\\ch01-recipe 目录启动 Roo shell。\n\
  \n### 操作步骤...\n\nRoo 提供了 field 命令，您可以使用它们向 Java 类添加不同类型的字段，如下所示：\n\n- 1. 创建 Address\
  \ 类，它是 Passenger 类中的属性类型，如下所示：\n\n  ```\n  roo> class --class ~.domain.Address --rooAnnotations\n\
  \  ```\n\n- 2. 创建 Passenger 类，我们将使用 field 命令向其中添加属性，如下所示：\n\n  ```\n  sample.roo.flightapp.domain.Address\
  \ roo> class --class ~.domain.Passenger --rooAnnotations\n  ```\n\n- 3. 使用 field\
  \ string 命令向 Passenger 类添加 firstName 和 lastName 属性，如下所示：\n\n  ```\n  sample.roo.flightapp.domain.Passenger\
  \ roo> field string\n  --fieldName firstName\n\n  Updated ..\\Passenger.java\n \
  \ Created ..\\Passenger_Roo_JavaBean.aj\n  Created ..\\Passenger_Roo_ToString.aj\n\
  \n  .. roo> field string --fieldName lastName\n\n  Updated ..\\Passenger.java\n\
  \  Updated ..\\Passenger_Roo_JavaBean.aj\n  Updated ..\\Passenger_Roo_ToString.aj\n\
  \  ```\n\n- 4. 使用 field number 命令向 Passenger 类添加 age 属性，如下所示：\n\n  ```\n  .. roo>\
  \ field number --fieldName age --type java.lang.Integer\n  ```\n\n  ```\n  Updated\
  \ ..\\Passenger.java\n  Updated ..\\Passenger_Roo_JavaBean.aj\n  Updated ..\\Passenger_Roo_ToString.aj\n\
  \  ```\n\n- 5. 使用 field other 命令向 Passenger 类添加 Address 类型的 address 属性，如下所示：\n\n\
  \  ```\n  .. roo> field other --fieldName address --type sample.roo.flightapp.domain.Address\n\
  \  ```\n\n  ```\n  Updated ..\\Passenger.java\n  Updated ..\\Passenger_Roo_JavaBean.aj\n\
  \  Updated ..\\Passenger_Roo_ToString.aj\n  ```\n\n这些命令的给定输出表明，当首次向 Passenger 类添加属性时，将创建\
  \ Passenger_Roo_JavaBean.aj 和 Passenger_Roo_ToString.aj 文件。您可能会注意到，每次添加属性时，Passenger_Roo_JavaBean.aj\
  \ 和 Passenger_Roo_ToString.aj AspectJ ITD 文件也会更新。\n\n### 工作原理...\n\nSpring Roo 提供多种\
  \ field 命令，用于向 Java 类添加不同类型的属性。例如，field string 用于添加 String 类型字段，field date 用于添加\
  \ java.util.Date 或 java.util.Calendar 类型字段，field other 用于添加自定义 Java 类型字段，依此类推。\n\
  \n> 有些 field 命令（如 field set 和 field reference）仅适用于 JPA 实体，因此不适用于您在 Roo 项目中创建的每个\
  \ Java 类。此外，field 命令接受某些参数，这些参数只有在目标 Java 类是 JPA 实体时才有意义。我们将在第 2 章中讨论特定于 JPA 实体的\
  \ field 命令。\n\nfield string、field other 和 field number 命令接受 name 参数，该参数标识要添加到 Java\
  \ 类的属性名称。field other 和 field number 还需要指定属性的类型。\n\n以下代码显示了 Passenger_Roo_JavaBean.aj\
  \ AspectJ ITD，当我们向 Passenger 类添加字段时，Spring Roo 对其进行了修改：\n\n\nprivileged aspect Passenger_Roo_JavaBean\n\
  {\n    public String Passenger.getFirstName()\n    {\n        return this.firstName;\n\
  \    }\n\n    public void Passenger.setFirstName(String firstName)\n    {\n    \
  \    this.firstName = firstName;\n    }\n\n    ...\n}\n```\n\n给定的代码显示，Passenger_Roo_JavaBean.aj\
  \ 已被 Spring Roo 更新，以便为添加到 Passenger 类的每个字段引入 getter 和 setter 方法。之所以能实现此功能，是因为 Passenger\
  \ 类中存在 @RooJavaBean 注解。\n\n以下代码显示 Passenger_Roo_ToString.aj AspectJ ITD，当向 Passenger\
  \ 类添加字段时，它也被 Spring Roo 修改了：\n\n```\nprivileged aspect Passenger_Roo_ToString\n\
  {\n    public String Passenger.toString()\n    {\n        StringBuilder sb = new\
  \ StringBuilder();\n        sb.append(\"FirstName: \").append(getFirstName()).append(\"\
  , \");\n        sb.append(\"LastName: \").append(getLastName()).append(\", \");\n\
  \        sb.append(\"Age: \").append(getAge()).append(\", \");\n        sb.append(\"\
  Address: \").append(getAddress());\n        return sb.toString();\n    }\n}\n```\n\
  \n如给定代码所示，它为 Passenger 类引入了一个 toString 方法，该方法返回一个包含每个属性值的拼接字符串。之所以能实现此功能，是因为 Passenger\
  \ 类使用了 @RooToString 注解。\n\n### 如果使用 IDE 添加属性怎么办？\n\nSpring Roo 会主动监视带有 Roo 注解的类的变化，任何类的变化都会触发\
  \ Spring Roo 更新相应的 AspectJ ITD 文件。因此，无论你是使用 Roo shell 还是 IDE 向 Java 类添加属性，都无关紧要。\n\
  \n以下图显示了 Spring Roo 如何管理 AspectJ ITD 文件：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_52_0.png)\n\
  \n给定的图显示，当你从某个目录启动 Spring Roo shell 时，它会主动监视文件系统中带有 Roo 注解（例如 @RooToString、@RooJavaBean\
  \ 等）的 Java 类。当这些 Java 类中的任何一个使用 IDE 或其他编辑器修改时，Spring Roo 会检查与这些 Java 类对应的 AspectJ\
  \ ITD 文件（遵循 *_Roo_*.aj 命名约定，如前所述）是否与 Java 类保持同步。如果不同步，它会相应地更新 AspectJ ITD 文件。Spring\
  \ Roo 使用插件来对 AspectJ ITD 文件进行修改。\n\n## 还有更多内容...\n\n本示例表明，如果你希望 Roo 自动为所有属性生成 `toString`\
  \ 方法以及 getter 和 setter 方法，则请使用 `@RooToString` 和 `@RooJavaBean` 注解对类进行注解。\n\n> **如果\
  \ Spring Roo 未运行时添加了属性怎么办？**\n> \n> 当你启动 Roo shell 时，它会检查 AspectJ ITD 是否与相应的 Java\
  \ 类保持同步。如果存在差异，Roo 会更新 AspectJ ITD 文件以反映 Java 类的当前状态。此时，如果 Roo 发现某个 ITD 文件不再需要，它甚至可能会删除该\
  \ ITD 文件。例如，如果你从 `Passenger` 类中移除所有属性，那么相应的 `Passenger_Roo_JavaBean.aj` 和 `Passenger_Roo_ToString.aj`\
  \ 文件会被 Roo 自动删除。\n\nSpring Roo 不提供用于移除或修改属性的命令。因此，如果你想要移除或修改 Java 类中现有的属性，可以使用 IDE\
  \ 来完成。Spring Roo 会负责在相应的 AspectJ ITD 文件中移除或修改该属性。\n\n## @RooJavaBean—控制 getter 和\
  \ setter 方法的生成\n\n我们看到，使用 @RooJavaBean 注解会为类中的所有字段引入 getter 和 setter 方法。在某些情况下，你可能希望控制这些\
  \ getter 和 setter 方法的生成。@RooJavaBean 允许你使用 gettersByDefault 和 settersByDefault 属性来实现这一点。这些属性指定是否应该默认生成\
  \ getter 和 setter 方法。这些属性的默认值为 true，这意味着 @RooJavaBean 注解会在相应的 *_Roo_JavaBean.aj\
  \ ITD 为类中定义的所有字段创建 getter 和 setter 方法。\n\n如果将 gettersByDefault 和 settersByDefault\
  \ 元素的值都指定为 false，则 Spring Roo 会删除相应的 AspectJ ITD 文件。\n\n### 另请参阅\n\n- 创建 Java 接口示例展示了如何使用\
  \ Spring Roo 创建 Java 接口\n- 第 2 章“使用 JPA 持久化对象”中的“向持久化实体添加字段”示例展示了 field 命令可用的其他参数\n\
  \n## 创建 Java 接口\n\n你可以使用 Spring Roo 的 interface 命令或 IDE 来创建 Java 接口。在本示例中，我们将看到如何创建名为\
  \ FlightServiceIntf 的接口。\n\n### 准备工作\n\n从 C:\\roo-cookbook\\ch01-recipe 目录启动 Roo\
  \ shell，该目录包含 flight-app Roo 项目。\n\n### 操作步骤...\n\nSpring Roo 提供了 interface 命令来创建\
  \ Java 接口，如下所示：\n\n```\nroo> interface --class sample.roo.flightapp.service.FlightServiceIntf\n\
  ```\n\n```\nCreated SRC_MAIN_JAVA\\sample\\roo\\flightapp\\service\\FlightServiceIntf.java\n\
  ```\n\n```\nsample.roo.flightapp.service.FlightServiceIntf roo>\n```\n\n### 工作原理...\n\
  \n以下表格描述了 interface 命令接受的参数：\n\n| 参数 | 用途 |\n| --- | --- |\n| class | 这是必需参数，用于指定\
  \ Java 接口的完全限定名。 |\n| path | 这是可选参数，用于标识创建接口的目录，默认为 SRC_MAIN_JAVA。 |\n| permitReservedWords\
  \ | 这是可选参数，指示 Spring Roo 允许在 Java 接口名称中使用保留字。 |\n\n### 还有更多内容...\n\n使用 Spring Roo，你可以在\
  \ Java 接口中添加常量或声明方法。要添加常量或方法，需要使用 IDE。你可能已经注意到，interface 命令中不提供 rooAnnotations 参数；因此，你可以安全地假设，当你对\
  \ Java 接口进行修改时，Spring Roo 不会生成任何相应的代码。\n\n### 另请参阅\n\n- 创建 Java 类示例展示了如何使用 Spring\
  \ Roo 创建 Java 类\n\n## 从 Roo shell 引用类型\n\n在某些场景中，你可能希望将命令的焦点设置到特定的 Java 类型上。例如，你可能希望\
  \ Roo shell 在特定的 Java 类型上执行 field 命令，这样你就不需要在 field 命令中指定 class 参数了。\n\n### 准备工作\n\
  \n从 C:\\roo-cookbook\\ch01-recipe 目录启动 Roo shell，该目录包含 flight-app Roo 项目。\n\n###\
  \ 操作步骤...\n\nSpring Roo 提供了 focus 命令，允许你将命令的目标更改为不同的 Java 类型。以下步骤序列展示了如何使用 focus\
  \ 命令在不同类型之间切换：\n\n- 1. 执行以下 `focus` 命令以指定你要处理 `flight-app` 项目。这将更改 Roo 提示符以反映 Roo\
  \ 项目的顶级包名：\n  \n  ```\n  roo> focus --class ~\n  ```\n  \n- 2. 使用 `class` 命令创建 `FlightDesc`\
  \ 类。使用 ~ 表示你正在相对于项目顶级包名指定类的包名。这将更改 Roo 提示符以引用 `FlightDesc` 类型，如下所示：\n  \n  ```\n\
  \  sample.roo.Flightapp roo> class --class ~.domain.FlightDesc\n  --rooAnnotations\n\
  \  \n  Created SRC_MAIN_JAVA\\sample\\roo\\flightapp\\domain\\FlightDesc.java\n\
  \  ```\n  \n- 3. 使用 `class` 命令创建 `Flight` 类。这将更改 Roo 提示符，从引用 `FlightDesc` 类型改为引用新创建的\
  \ `Flight` 类型，如下所示：\n  \n  ```\n  ~.domain.FlightDesc roo> class --class ~.domain.Flight\n\
  \  --rooAnnotations\n  \n  Created SRC_MAIN_JAVA\\sample\\roo\\flightapp\\domain\\\
  Flight.java\n  ```\n  \n- 4. 使用 `focus` 命令切换到 `FlightDesc` 类型。这将更改 Roo 提示符，从引用 `Flight`\
  \ 类型改为引用 `FlightDesc` 类型，如下所示：\n  \n  ```\n  ~.domain.Flight roo> focus --class\
  \ ~.domain.FlightDesc\n  ```\n  \n- 5. 如下所示，向 `FlightDesc` 类添加 `from_city` 和 `to_city`\
  \ 属性。由于 Roo 提示符当前引用的类型是 `FlightDesc`，因此你不需要指定 `class` 参数：\n  \n  ```\n  ~.domain.FlightDesc\
  \ roo> field string from_city\n  ~.domain.FlightDesc roo> field string to_city\n\
  \  ```\n\n\n\n\n\n- 6. 无需将焦点切换到 `Flight` 类，即可使用 `field` 命令结合 `class` 参数向 `Flight`\
  \ 类添加 `flight_Id` 属性，如下所示。`class` 参数指定命令的目标是 `Flight` 类，而非当前引用的 `FlightDesc` 类：\n\
  \n```\n~.domain.FlightDesc roo> field number --fieldName flight_Id --type java.lang.Integer\
  \ --class ~.domain.Flight\n```\n\n### 工作原理...\n\n`focus` 命令的 `class` 参数允许您指定要使用的\
  \ Java 类型的完全限定名。`~` 符号用于指示在创建 Roo 项目时所指定的 Roo 项目的顶级包。\n\n> 在 Roo 项目中，使用 `~` 符号可以简化为任何需要\
  \ Java 类型完全限定名的参数提供值。\n\n### 更多内容...\n\n使用 `focus` 命令主要是为了简化针对特定 Java 类型编写命令。如果在某些情况下您不想使用\
  \ `focus` 命令，则始终可以使用命令的 `class` 参数来指定命令的目标 Java 类型。\n\n### 另请参阅\n\n- 创建 Java 类的配方展示了如何使用\
  \ Spring Roo 创建 Java 类\n- 向 Java 类添加属性的配方展示了如何使用 Spring Roo 向 Java 类添加属性\n\n## 从\
  \ Roo 脚本创建应用程序构件\n\n在某些场景下，您可能希望通过从文本文件向 Spring Roo 输入一组 Roo 命令来生成完整的企业应用程序骨架。针对此类场景，Spring\
  \ Roo 提供了 `script` 命令，允许您执行文本文件中包含的命令。惯例是将包含命令的脚本文件命名为带 `.roo` 扩展名的文件。\n\n> Roo\
  \ 脚本无非是包含 Roo 命令的文本文件。命令按其在文本文件中出现的顺序执行。\n\n在本配方中，我们将了解如何执行随本书提供的 `ch01.roo` 文本文件中包含的命令。`ch01.roo`\
  \ 文件包含命令，可让您创建一个全新的 `flight-app` 项目。\n\n### 准备工作\n\n如果 Roo shell 仍然打开，则退出它并删除 `C:\\\
  roo-cookbook\\ch01-recipe` 目录中的所有文件。从本书的网站下载 `ch01.roo` 文件并将其复制到 `C:\\roo-cookbook\\\
  ch01-recipe`。从 `C:\\roo-cookbook\\ch01-recipe` 目录启动 Roo shell。\n\n### 操作步骤\n\n要创建应用程序骨架，请执行\
  \ `script` 命令，指定包含 Roo 命令的文件，如下所示：\n\n```\nroo>script --file ch01.roo --lineNumbers\n\
  ```\n\n### 工作原理...\n\n`script` 命令接受以下参数：\n\n| 参数 | 用途 |\n|---|---|\n| `file` | 这是一个必需参数，指定包含\
  \ Roo 命令的文件名 |\n| `lineNumbers` | 这是一个可选参数，指示 Roo shell 打印正在从文件中执行的命令的行号 |\n\n###\
  \ 更多内容...\n\n在 Spring Roo 中您**不会**找到的功能之一是撤销前一条命令的执行。例如，如果您使用 `field` 命令添加了一个字段，而现在想要回滚其所做的更改，则无法实现。如果您错误地执行了\
  \ Roo 命令，可以从 `log.roo` 文件中将其删除，并使用 `script` 命令重新执行 `log.roo` 中的命令。\n\n如果 Roo 命令因某些原因执行失败，则会在\
  \ `log.roo` 文件中将其注释掉。因此，您无需担心从 `log.roo` 文件中删除执行失败的命令。\n\n### 另请参阅\n\n- 设置 Roo 的配方展示了如何开始使用\
  \ Spring Roo。\n"
- "# 2 使用 JPA 持久化对象\n\n在本章中，我们将介绍：\n\n- 为您的项目设置 JPA 提供程序\n- 查看数据库配置属性\n- 管理数据库配置属性\n\
  - 创建持久实体\n- 向持久字段添加 JSR 303 约束\n- 为持久实体创建集成测试\n- 为测试实体创建新的“按需数据”\n- 为持久实体创建模拟测试\n\
  - 执行持久实体测试\n- 控制持久实体的自动生成方法\n- 创建与多个数据库交互的应用程序\n- 打包您的 Roo 项目\n\n## 简介\n\n**Java\
  \ 持久化 API (JPA)** 提供了一种用于将 Java 对象持久化到关系数据库的标准 API。本章中的配方探讨了配置数据源和 JPA 提供程序（例如 Hibernate\
  \ 和 OpenJPA）的 Roo 命令，以及创建企业应用程序持久实体的 Roo 命令。\n\n如果您仅在持久化层使用 Spring，本章将向您展示如何使用 Roo\
  \ 快速开发应用程序的持久化层。您会注意到，使用 Roo 生成的应用程序没有 DAO（数据访问对象）层，因为 Roo 生成的领域实体本身就功能丰富，在持久实体中定义了查找器和\
  \ CRUD 方法。同样，使用 Roo 生成的应用程序没有用于抽象业务服务（而后者又可以访问持久实体）的服务层。如果您想为企业应用程序创建服务层，则由您自行创建服务。如果业务逻辑跨越多个持久实体，或者您希望在服务层中设置事务边界，或者您希望将业务逻辑封装在服务层中，等等，都应该为企业应用程序创建服务层。\n\
  \n在第 4 章“使用 Spring Web MVC 开发 Web 应用程序”和第 5 章“使用 GWT、Flex 和 Spring Web Flow 开发 Web\
  \ 应用程序”中，我们将看到 Spring Roo 生成应用程序的 Web 层，该层直接与持久实体交互——留给服务层和数据访问层处理。\n\n## 为项目设置\
  \ JPA 提供程序\n\n在企业应用程序中，数据持久化在一个或多个数据存储中。JPA 提供了一种用于管理关系数据库中数据的标准 API。在本任务中，我们将了解\
  \ `persistence setup` 命令，以配置 Roo 项目的 JPA 持久化提供程序。\n\n### 准备工作\n\n在 `C:\\roo-cookbook`\
  \ 目录中创建一个子目录 `ch02-recipes`。\n\n要设置 JPA 提供程序，我们首先需要创建一个 Roo 项目。要创建新的 Roo 项目，请从本书的网站下载\
  \ `ch02.roo` 文件并将其复制到 `ch02-recipes` 目录。\n\n打开命令提示符并进入 `ch02-recipes` 目录。现在，启动 Roo\
  \ shell 并使用 `script` 命令执行 `ch02.roo` 脚本中的命令，如第 1 章“从 Roo 脚本创建应用程序构件”配方中所述。成功执行 `ch02.roo`\
  \ 脚本将创建一个 `flight-app` Eclipse 项目，您可以将其导入 Eclipse IDE。\n\n### 操作步骤\n\n以下步骤将演示如何设置\
  \ JPA 提供程序：\n\n- 1. 要将 Hibernate 设置为应用程序的 JPA 提供程序，请执行 `persistence setup` 命令，如下所示：\n\
  \n```\nroo> persistence setup --provider HIBERNATE --database MYSQL --databaseName\
  \ myFlightAppDB\nUpdated SRC_MAIN_RESOURCES\\META-INF\\spring\\applicationContext.xml\n\
  ```\n\n```\nCreated SRC_MAIN_RESOURCES\\META-INF\\persistence.xml\n```\n\n```\n\
  Created SRC_MAIN_RESOURCES\\META-INF\\spring\\database.properties\n```\n\n```\n\
  Updated ROOT\\pom.xml [Added dependencies mysql:mysql-connector-java:5.1.13, org.hibernate:hibernate-core:3.6.1.Final,\
  \ ...]\n```\n\n- 2. 执行 perform eclipse Roo 命令，如下所示：\n\n```\nroo> perform eclipse\n\
  ```\n\n- 3. 将 flight-app Roo 项目导入您的 Eclipse IDE。\n\n> 建议：每当发现 Roo 命令更新了 pom.xml\
  \ 文件，然后执行 perform eclipse（针对 Eclipse IDE）或 perform command --mavenCommand idea:idea（针对\
  \ IntelliJ IDEA）时，都应更新项目的类路径设置。这之后应在 IDE 中刷新项目。\n\n### 工作原理...\n\npersistence setup\
  \ 命令由 Spring Roo 的 JPA 插件处理。以下表格描述了 persistence setup 命令接受的参数：\n\n| 参数 | 描述 |\n\
  | :--- | :--- |\n| provider | 这是一个必需参数，指定要为企业应用程序使用的 JPA 提供程序。该参数接受预定义值，例如 HIBERNATE、OPENJPA\
  \ 等。 |\n| database | 这是一个必需参数，用于标识企业应用程序用于持久化应用程序数据的数据库产品。它接受预定义值，例如 MYSQL、DB2 等。\
  \ |\n| databaseName | 标识企业应用程序交互的数据库名称。仅当企业应用程序不使用 JNDI 绑定的数据源时，此参数才有用。 |\n| hostName\
  \ | 标识远程数据库的位置。默认为 localhost。仅当企业应用程序不使用 JNDI 绑定的数据源时，此参数才有用。 |\n| jndiDataSource\
  \ | 指定应用程序使用的 JNDI 绑定数据源。 |\n\n\n\n\n\n| 参数 | 描述 |\n| :--- | :--- |\n| username\
  \ | 标识连接数据源所需的用户名。仅当企业应用程序未使用JNDI绑定的数据源时，此参数才有用。 |\n| password | 标识连接数据源所需的密码。仅当企业应用程序未使用JNDI绑定的数据源时，此参数才有用。\
  \ |\n| applicationId | 如果要将应用程序部署到Google App Engine，则标识应用程序标识符。我们将在第6章的“在GAE上部署GWT应用程序”配方中详细讨论此参数。\
  \ |\n| persistenceUnit | 指定Roo生成的persistence.xml文件中要使用的持久化单元名称。如果您的应用程序与多个数据库交互，则必须使用此参数。\
  \ |\n| transactionManager | **[自Spring Roo 1.1.5起支持]** 与持久化单元对应的事务管理器名称。如果您的应用程序与多个数据库交互，则必须使用此参数。\
  \ |\n\n如`persistence setup`命令的输出所示，我们的flight-app Roo项目中以下文件被创建或修改：\n\n- `persistence.xml`:\
  \ 这是一个新创建的文件，由JPA提供程序用于发现持久化提供程序信息，在flight-app项目中，该提供程序是Hibernate。\n- `database.properties`:\
  \ 这是一个新创建的文件，包含数据源信息，例如用户名、密码、数据源URL和驱动程序类。\n- `applicationContext.xml`: 此文件在我们创建Roo项目时创建。此文件现已修改，以包含数据源、事务管理器和JPA\
  \ EntityManagerFactory定义。本节稍后将详细介绍这些定义。\n- `pom.xml`: 此文件在我们创建Roo项目时创建。它现在已修改，以包含MySQL连接器、Hibernate、Hibernate\
  \ Validator等的项目依赖项。这表明Roo仅在您为企业应用程序添加额外功能时才向项目添加依赖项。例如，如果您未使用JPA，则除非执行`persistence\
  \ setup`命令，否则JPA相关依赖项不会添加到您的项目中。\n\n以下XML片段显示了由Spring Roo创建的persistence.xml文件：\n\
  \n```\n<persistence ...>\n<persistence-unit name=\"persistenceUnit\"\ntransaction-type=\"\
  RESOURCE_LOCAL\">\n<provider>org.hibernate.ejb.HibernatePersistence</provider>\n\
  <properties>\n<property name=\"hibernate.dialect\"\nvalue=\"org.hibernate.dialect.MySQL5InnoDBDialect\"\
  />\n<property name=\"hibernate.hbm2ddl.auto\" value=\"create\"/>\n...\n</properties>\n\
  </persistence-unit>\n</persistence>\n```\n\n前面的清单显示，Roo根据您提供给persistence setup命令的JPA提供程序和数据库信息创建persistence.xml文件。<persistence-unit>元素的name属性指定持久化单元名称。如果未指定persistence\
  \ setup的persistenceUnit参数，则默认情况下，Roo将name属性值设置为persistenceUnit。hibernate.hbm2ddl.auto属性的create值表示每次创建Hibernate\
  \ SessionFactory时，都会重新创建数据库。您可能希望根据JPA实体中提供的映射来更改hibernate.hbm2ddl.auto属性的值，将其从create更改为validate或update或create-drop，具体取决于您希望Hibernate如何管理数据库架构。\n\
  \n此外，如果您的企业应用程序更新多个数据源，则应将persistence-unit元素的transaction-type属性值设置为JTA（Java事务API），而不是RESOURCE_LOCAL。\n\
  \n以下代码显示了执行persistence setup命令时添加到applicationContext.xml文件的元素：\n\n```\n<bean class=\"\
  org.apache.commons.dbcp.BasicDataSource\"\ndestroy-method=\"close\" id=\"dataSource\"\
  >\n<property name=\"driverClassName\"\nvalue=\"${database.driverClassName}\"/>\n\
  <property name=\"url\" value=\"${database.url}\"/>\n<property name=\"username\"\
  \ value=\"${database.username}\"/>\n<property name=\"password\" value=\"${database.password}\"\
  />\n...\n</bean>\n\n<bean\nclass=\"org.springframework.orm.jpa.JpaTransactionManager\"\
  \nid=\"transactionManager\">\n<property name=\"entityManagerFactory\"\n        \
  \      ref=\"entityManagerFactory\"/>\n</bean>\n```\n\n```\n<tx:annotation-driven\
  \ mode=\"aspectj\"\n              transaction-manager=\"transactionManager\"/>\n\
  ```\n\n```\n<bean\n    class=\"org.springframework.orm.jpa.\n    LocalContainerEntityManagerFactoryBean\"\
  \n    id=\"entityManagerFactory\">\n    <property name=\"dataSource\" ref=\"dataSource\"\
  />\n</bean>\n```\n\n如前面的XML所示，persistence setup命令添加的其他bean如下：\n\n- dataSource: 指javax.sql.DataSource对象，表示应用程序的数据源。数据源的属性包含在persistence\
  \ setup创建的database.properties文件中。由于applicationContext.xml文件中存在<property-placeholder>元素，Spring的应用程序上下文会读取database.properties文件（请参阅第1章中的“创建Roo项目”配方）。\n\
  - entityManagerFactory: 指Spring的工厂bean，负责创建JPA EntityManagerFactory。您应该使用LocalContainerEntityManagerFactoryBean，因为它对EntityManagerFactory的配置提供了最大控制权。\n\
  - transactionManager: 指JpaTransactionManager bean，如果您的应用程序使用单个EntityManagerFactory（即仅使用单个数据库或事务资源），则此bean非常合适。\n\
  \nSpring事务架构（spring-tx-3.0.xsd）的<annotation-driven>元素建议您使用Spring的@Transactional注解将方法标记为事务性。mode属性的值aspectj表示AspectJ事务切面在加载时或编译时被织入类中。如果您想使用Spring的AOP框架为@Transactional注解的bean（通常是您的服务类）创建代理，则请将mode属性的值指定为proxy，或者根本不指定mode属性。\n\
  \n如果保持mode属性值为aspectj（建议这样做），则应注意以下要求：\n\n- 为您的应用程序启用编译时（或加载时）织入。您无需担心此问题，因为如果将Roo项目打包为WAR或JAR（请参阅本章中的“打包您的Roo项目”配方），则将使用AspectJ编译器Maven插件（请参阅第1章中的“创建Roo项目”配方）来将AspectJ事务切面（定义在spring-aspects.jar文件中）织入带有@Transactional注解的Roo方法中。\n\
  - 在具体类上使用@Transactional注解，而不是在接口上使用。\n\n## 更多内容...\n\n现在，让我们看看如何在Spring Roo生成的应用程序中使用JNDI绑定的数据源。\n\
  \n## JNDI绑定的数据源\n\n在大多数实际应用程序中，javax.sql.DataSource对象是从JNDI获取的，而不是从属性文件中定义的属性创建的。要访问JNDI绑定的数据源，请不要依赖Spring为应用程序创建DataSource，而是使用persistence\
  \ setup的jndiDataSource参数来指定DataSource的JNDI名称，如下所示：\n\n```\npersistence setup --provider\
  \ HIBERNATE --database MYSQL --jndiDataSource jdbc/accountDB\n```\n\n如果指定了jndiDataSource参数，则Spring\
  \ Roo将Spring的jee架构的jndi-lookup元素添加到applicationContext.xml文件中，如下所示：\n\n```\n<beans\
  \ ... xmlns:jee=\"http://www.springframework.org/schema/jee\" ...\nxsi:schemaLocation=\"\
  http://www.springframework.org/schema/jee http://\nwww.springframework.org/schema/jee/spring-jee-3.0.xsd\"\
  >\n.....\n<jee:jndi-lookup id=\"dataSource\" jndi-name=\"jdbc/accountDB\" />\n.....\n\
  ```\n\n如上所示，jndi-lookup元素负责访问名为jdbc/accountDB（由jndi-name属性引用）的JNDI中配置的DataSource，并使其作为bean\
  \ id为dataSource在Spring的应用程序上下文中可用。\n\n如果将前面的applicationContext.xml文件与先前显示的文件进行比较，您可以发现唯一的区别是dataSource\
  \ bean如何提供给Spring的应用程序上下文。\n\n\n\n\n\n## 另请参阅\n\n- 请参阅“创建持久实体”配方，了解如何创建持久实体\n- 请参阅“创建与多个数据库交互的应用程序”配方，了解如何开发与多个数据库交互的应用程序的详细信息\n\
  \n## 查看数据库配置属性\n\n在本配方中，我们将了解 `database properties list` 命令如何让我们查看数据库属性列表及其值，这些值在\
  \ `database.properties` 文件中指定。\n\n### 准备工作\n\n请参阅 *为您的项目设置 JPA 提供程序* 配方，以创建 *flight-app*\
  \ Roo 项目，并使用 *persistence setup* 命令设置持久性提供程序。\n\n> 如果您在 Roo 项目中使用的是 JNDI 绑定的数据源，则不需要本配方。\n\
  \n### 操作方法\n\n按照以下步骤查看数据库属性：\n\n- 1. 从 C:\\roo-cookbook\\ch02-recipes 目录启动 Roo shell。\n\
  - 2. 要查看定义在 SRC_MAIN_RESOURCES\\META-INF\\spring\\ 目录中的 database.properties 文件中的数据库属性，可以使用\
  \ database properties list 命令，如下所示：\n  ```\n  roo> database properties list\n  ```\n\
  \n  ```\n  database.driverClassName = com.mysql.jdbc.Driver\n  database.password\
  \ =\n  database.url = jdbc:mysql://localhost:3306/myFlightAppDB\n  database.username\
  \ =\n  ```\n\n### 工作原理\n\ndatabase properties list 命令由 JPA 加载项处理。除了使用 database properties\
  \ list 命令，您还可以使用 properties list 命令（请参阅第 1 章中的“查看属性文件中定义的属性”配方），该命令显示属性文件中包含的属性。使用任一命令的最终结果相同，唯一的区别是您需要在\
  \ properties list 命令中指定名称和路径参数来引用 database.properties 文件。\n\n### 更多内容\n\n除了使用 Spring\
  \ Roo，您还可以使用 Eclipse 或 STS 等 IDE 查看 database.properties 文件。使用 Spring Roo 的 database\
  \ properties list 命令的整体思路是让开发人员可以在不切换到 IDE 的情况下查看数据库属性。\n\n### 另请参阅\n\n- 下一个配方“管理数据库配置属性”展示了您如何添加、删除和修改\
  \ Roo 项目中 database.properties 文件中定义的属性。\n\n## 管理数据库配置属性\n\n在上一个配方中，我们了解了如何使用 database\
  \ properties list 命令查看 database.properties 文件中定义的数据库配置属性。在本配方中，我们将了解如何使用 database\
  \ properties set 和 database properties remove 命令从 database.properties 文件中添加、修改或删除属性。\n\
  \n以下表格显示了我们将从 database.properties 文件中添加、修改和删除的属性：\n\n| 属性 | 操作 |\n| --- | --- |\n\
  | database.username | 修改为 database.username = root |\n| database.password | 修改为\
  \ database.password = asarin |\n| database.url = jdbc:mysql://localhost:3306/myFlightAppDB\
  \ | 从 database.properties 中移除 |\n| database.modified.url = jdbc:mysql://localhost:3406/myFlightAppDB\
  \ | 添加到 database.properties |\n| database.initialPoolSize=10 | 添加到 database.properties\
  \ |\n\n### 准备工作\n\n请参阅“为您的项目设置 JPA 提供程序”配方，以创建 flight-app Roo 项目，并使用 persistence\
  \ setup 命令设置持久性提供程序。\n\n从 C:\\roo-cookbook\\ch02-recipes 目录启动 Roo shell。\n\n> 如果您在\
  \ Roo 项目中使用的是 JNDI 绑定的数据源，则不需要本配方。\n\n### 操作方法\n\n以下步骤将向您展示如何添加、修改或删除属性：\n\n- 1.\
  \ 如果您想要修改 database.properties 文件中定义的属性，database properties set 命令非常有用，如下所示：\n  ```\n\
  \  roo> database properties set --key database.username --value root\n  roo> database\
  \ properties set --key database.password --value asarin\n  ```\n\n- 2. database\
  \ properties set 命令也可以用于向 database.properties 文件中添加新属性，如下所示：\n  ```\n  roo> database\
  \ properties set --key database.modified.url --value jdbc:mysql://localhost:3406/myFlightAppDB\n\
  \  roo> database properties set --key database.initialPoolSize --value 10\n  ```\n\
  \n- 3. database properties remove 命令用于从 database.properties 文件中删除现有属性，如下所示：\n  ```\n\
  \  roo> database properties remove --key database.url\n  ```\n\n### 工作原理\n\ndatabase\
  \ properties set 和 database properties remove 命令由 JPA 加载项处理。除了使用这些命令，您还可以使用 properties\
  \ set 和 properties remove 命令，如第 1 章“Spring Roo 入门”中的“管理属性文件中定义的属性”配方所示。\n\n需要注意的是，如果您修改了\
  \ database.properties 文件中的属性名称，则这些修改必须反映在 Roo 项目的 applicationContext.xml 文件中定义的\
  \ dataSource bean 中。\n\n### 更多内容\n\n除了使用 Spring Roo，您还可以使用 Eclipse 或 STS 等 IDE 修改\
  \ `database.properties` 文件。使用 Roo 命令修改 `database.properties` 文件允许开发人员使用 `script`\
  \ 命令重播从 Roo shell 执行的操作。\n\n### 另请参阅\n\n- 请参阅本章前面描述的“查看数据库配置属性”配方，了解如何使用 Roo 命令查看\
  \ `database.properties` 文件中定义的属性。\n\n## 创建持久实体\n\n在本配方中，我们将了解 Spring Roo 如何使用 `entity`\
  \ 和 `field` 命令简化 JPA 实体的创建。在本配方中，我们将创建一个具有复合主键的 `Flight` JPA 实体。请参阅第 3 章“Spring\
  \ Roo 中的高级 JPA 支持”中的“在实体之间创建多对一关系”配方，了解如何创建带有代理键的持久实体。\n\n以下图表显示了 `Flight` 实体及其复合主键\
  \ (`FlightKey`) 的属性：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_69_0.png)\n\n###\
  \ 准备工作\n\n退出 Roo shell 并删除 `C:\\roo-cookbook\\ch02-recipes` 目录的内容。\n\n执行 `ch02_jpa_setup.roo`\
  \ 脚本。它会创建一个 `flight-app` Roo 项目，并使用 `persistence setup` 命令将 Hibernate 设置为持久性提供程序。如果您使用的数据库不是\
  \ MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\n从 C:\\roo-cookbook\\ch02-recipes 目录启动 Roo shell。\n\
  \n随本书附带的 ch02_persistent_entities.roo 脚本会创建 flight-app 项目，将 Hibernate 设置为持久性提供程序，修改\
  \ database.properties 文件中的 database.username 和 database.password 属性，并执行本配方中所示的命令。\n\
  \n### 操作方法\n\n以下步骤将演示如何创建持久实体：\n\n- 1. 使用 `entity` 命令在 `sample.roo.flightapp.domain`\
  \ 包中创建 Flight 实体：\n  ```\n  roo> entity --class ~.domain.Flight --identifierType\
  \ ~.domain.FlightKey --table FLIGHT_TBL\n  ```\n\n- 2. 使用 `field` 命令向 `Flight` 实体添加字段：\n\
  \  ```\n  roo> field number --type java.lang.Integer --fieldName numOfSeats\n  roo>\
  \ field string --fieldName origin\n  roo> field string --fieldName destination\n\
  \  roo> field date --type java.util.Date --fieldName createdDate\n  roo> field date\
  \ --type java.util.Date --fieldName modifiedDate\n  roo> field string --fieldName\
  \ createdBy\n  roo> field string --fieldName modifiedBy\n  ```\n\n- 3. 将焦点切换到 `FlightKey`\
  \ 类（在步骤 1 中创建 Flight 实体时，该类在 `sample.roo.flightapp.domain` 包中自动生成）：\n  ```\n  roo>\
  \ focus --class ~.domain.FlightKey\n  ```\n\n- 4. 向 `FlightKey` 类添加 `flightId` 和\
  \ `departureDate` 字段：\n  ```\n  roo> field string --fieldName flightId\n  roo> field\
  \ date --fieldName departureDate --type java.util.Date\n  ```\n\n出于简洁性考虑，`entity`\
  \ 命令的输出未在上方显示。我们将在 *操作方法...* 部分讨论与 JPA 实体对应生成的重要 ITD 文件。\n\n\n\n\n\n## 工作原理...\n\
  \n实体命令用于创建 JPA 持久化实体。它提供了一组参数，这些参数应足以满足您在开发企业应用持久层时遇到的大多数场景。例如，mappedSuperclass\
  \ 参数使用 @MappedSuperclass JPA 注解标记类（请参阅第 3 章《Spring Roo 高级 JPA 支持》中的“创建映射超类”示例），inheritanceType\
  \ 参数添加 @Inheritance JPA 注解，以便让您指定持久化继承层次结构中类所遵循的继承策略，等等。\n\n接下来的表格描述了您可以传递给 entity\
  \ 命令的参数：\n\n| 参数 | 描述 |\n| :--- | :--- |\n| class | 这是一个必填参数，用于指定持久化实体类的完全限定名。指定完全限定名时，可以使用\
  \ '~' 符号。 |\n| mappedSuperclass | 指示 Roo 该类是“映射超类”。如果指定，生成的类将使用 @MappedSuperclass\
  \ JPA 注解进行标注。 |\n| extends | 标识实体类的父类。 |\n| abstract | 指定生成的实体是抽象实体。 |\n| inheritanceType\
  \ | 指定用于持久化实体的继承策略。它接受以下值之一：JOINED、SINGLE_TABLE 和 TABLE_PER_CLASS。如果指定，它会在实体类中添加\
  \ @Inheritance JPA 注解。 |\n| table | 指定实体映射到的表名。 |\n| identifierField | 指定实体中标识符字段的名称。默认情况下，标识符字段的名称为\
  \ id。 |\n| identifierType | 指定标识符字段的 Java 类型。此参数可以接受 Roo 预定义的值，例如 java.lang.Long、java.lang.Double\
  \ 等，也可以接受自定义 Java 类型。 |\n| identifierColumn | 指定标识符字段映射到的表列。如果您的实体使用复合主键，则不得使用此参数。\
  \ |\n| versionField | 指定实体中版本字段的名称。默认情况下，版本字段的名称为 version。 |\n| versionColumn |\
  \ 版本字段映射到的表列。 |\n| testAutomatically | 指示 Roo 为实体自动生成集成测试。我们将在“为持久化实体创建集成测试”示例中详细讨论持久化实体的集成测试。\
  \ |\n| schema, catalog | 用于指定数据库表名限定符的参数。这些参数转换为 @Table JPA 注解的 schema 和 catalog\
  \ 属性。 |\n| persistenceUnit | 持久化单元的名称，在 persistence.xml 文件中定义，持久化实体与此关联。 |\n| transactionManager\
  \ | [自 Spring Roo 1.1.5 起支持] 持久化实体使用的事务管理器的名称。 |\n\n如果您的实体使用复合主键，则需要使用自定义 Java 类型。例如，Flight\
  \ 实体将 FlightKey 指定为 identifierType，因为它是 Flight 实体的复合主键类。还要注意，当您执行 entity 命令时，复合主键类会自动生成。\n\
  \n您可能已经注意到，我们用于向 Flight JPA 实体添加字段的 field 命令，与我们在第 1 章《Spring Roo 入门》中的“向 Java 类添加属性”示例中用于向\
  \ Java 类添加属性的 field 命令是同一个。\n\n```\n@RooJavaBean\n@RooToString\n@RooEntity(identifierType\
  \ = FlightKey.class, table= \"FLIGHT_TBL\")\npublic class Flight {\n    private\
  \ Integer numOfSeats;\n    private String origin;\n    private String destination;\n\
  \    ...\n}\n```\n\n在 Flight.java 代码中，@RooJavaBean 和 @RooToString 注解是最常用的 Roo 注解。有关\
  \ @RooJavaBean 和 @RooToString 的更多信息，请参阅第 1 章《Spring Roo 入门》中的“创建 Java 类”和“向 Java\
  \ 类添加属性”示例。@RooEntity 注解提供了有关持久化实体（即前面代码中的 Flight 实体）的详细信息。identifierType 属性指定 Flight\
  \ 实体的标识符类型，即 FlightKey——Flight 实体的复合主键类。table 属性指定 Flight JPA 实体映射到的数据库表。\n\n> 您会注意到，实体的字段未使用\
  \ JPA @Column 注解来提供字段与相应 FLIGHT_TBL 表列之间的映射。稍后在本示例中，我们将了解如何使用 field 命令为字段指定表列映射。\n\
  \n@RooEntity 注解使用 ITD 文件 Flight_Roo_Entity.aj 引入了一些持久化相关方法和属性，如下所示：\n\n```\nprivileged\
  \ aspect Flight_Roo_Entity {\n\tdeclare @type: Flight: @Entity;\n\n\tdeclare @type:\
  \ Flight: @Table(name = \"FLIGHT_TBL\");\n\n\t@PersistenceContext\n\ttransient EntityManager\
  \ Flight.entityManager;\n\n\t@EmbeddedId\n\tprivate FlightKey Flight.id;\n\n\t@Version\n\
  \t@Column(name = \"version\")\n\tprivate Integer Flight.version;\n\n\tpublic FlightKey\
  \ Flight.getId() {\n\t\treturn this.id;\n\t}\n\n\tpublic void Flight.setId(FlightKey\
  \ id) {\n\t\tthis.id = id;\n\t}\n\n\tpublic Integer Flight.getVersion() {\n\t\t\
  return this.version;\n\t}\n\n\tpublic void Flight.setVersion(Integer version) {\n\
  \t\tthis.version = version;\n\t}\n\n\t...\n}\n```\n\n为简洁起见，前面代码清单中省略了持久化相关方法（例如\
  \ persist、remove 等）。自动生成的持久化相关方法将在“控制持久化实体的自动生成方法”示例中讨论。如您所见，Spring Roo 生成了创建功能齐全的\
  \ JPA 实体所需的代码。\n\nFlight_Roo_Entity.aj 中的以下代码在 Flight 类中添加了 @Table 和 @Entity JPA\
  \ 注解：\n\n```\ndeclare @type: Flight: @Entity;\ndeclare @type: Flight: @Table(name\
  \ = \"FLIGHT_TBL\");\n```\n\n在 Flight_Roo_Entity.aj 中，FlightKey 字段使用了 @EmbeddedId\
  \ 注解，因为它是 Flight 实体的复合主键类。Roo 还在 Flight_Roo_Entity.aj 中创建了一个 version 字段，该字段映射到 Flight\
  \ 实体映射表的 version 列。如果我们创建一个不使用复合主键的持久化实体，那么 Spring Roo 将使用 @Id 注解而非 @EmbeddedId\
  \ 来标注主键。\n\n在生成实体时，Spring Roo 还会生成一个 <entity-name>_Roo_Configurable.aj ITD 文件，用于向实体添加\
  \ Spring 的 @Configurable 注解。在此，<entity-name> 是持久化实体的名称。\n\n实体实例通常由 JPA 提供程序或通过 new\
  \ 运算符在 Spring 应用程序上下文之外创建。在实体中使用 @Configurable 注解特别有用，因为它允许将 Spring 应用程序上下文中配置的\
  \ Bean 注入到实体实例中。正因有 @Configurable 注解，Spring 才能将 EntityManager 实例注入到持久化实体中。\n\n以下代码清单显示了\
  \ flight-app 应用程序的 FlightKey 类：\n\n```\n@RooToString\n@RooIdentifier\npublic final\
  \ class FlightKey {\n    private String flightId;\n    private Date departureDate;\n\
  }\n```\n\n在代码中，Spring Roo 的 @RooIdentifier 注解负责为字段添加构造函数、getter 和 setter 方法，并还为\
  \ FlightKey 复合主键类提供 hashCode 和 equals 方法的实现。Spring Roo 会生成一个与复合主键类上的 @RooIdentifier\
  \ 注解对应的 <entity-name>_Roo_Identifier.aj ITD 文件。在此，<entity-name> 是持久化实体的名称。\n\n以下代码显示了在\
  \ FlightKey_Roo_Identifier.aj ITD 文件中定义的方法和属性：\n\n```\nprivileged aspect FlightKey_Roo_Identifier\
  \ {\n    declare @type: FlightKey: @Embeddable;\n\n    public FlightKey.new(String\
  \ flightId, Date departureDate) {}\n}\n```\n\n\n\n```\nprivate FlightKey() {}\n\n\
  public String FlightKey.getFlightId() {\n    return this.flightId;\n}\n\npublic\
  \ Date FlightKey.getDepartureDate() {\n    return this.departureDate;\n}\n\npublic\
  \ boolean FlightKey.equals(Object obj) {}\n\npublic int FlightKey.hashCode() {}\n\
  \n}\n```\n\n为简洁起见，代码中未显示方法和构造函数的实现细节。正如代码所示，FlightKey_Roo_Identifier.aj ITD 向 FlightKey\
  \ 类添加了以下方法、构造函数、字段和注解：\n\n- 向 FlightKey 类添加 @Embeddable JPA 注解，这是必需的，因为 FlightKey\
  \ 类使用 @EmbeddedId JPA 注解添加到了 Flight 实体中\n- 向 FlightKey 类添加无参构造函数\n- 向 FlightKey\
  \ 类添加接受 FlightKey 类中定义的字段作为参数的构造函数\n- 为 FlightKey 类中定义的字段添加 getter 和 setter 方法\n\
  - 为 java.lang.Object 类的 equals 和 hashCode 方法添加实现\n\n@RooIdentifier 注解接受两个属性——gettersByDefault\
  \ 和 settersByDefault，它们允许你控制 FlightKey 类中定义的字段的 getter 和 setter 方法的创建。@RooIdentifier\
  \ 还接受第三个属性 dbManaged，如果 JPA 实体是由 Roo 使用数据库逆向工程创建的，则该属性很有用。我们将在第 3 章“Spring Roo 中的高级\
  \ JPA 支持”的“从数据库创建实体”配方中详细讨论 dbManaged 属性。\n\n### 还有更多...\n\n我们现在将学习如何向持久实体添加字段，这些字段包含有关字段映射到的表列的信息。\n\
  \n## 在持久实体字段中添加表列信息\n\n从 Flight.java 文件中删除 origin 字段，并确保 Spring Roo 在后台运行，以从 AspectJ\
  \ ITD 文件中删除 origin 字段。\n\n现在，使用 field 命令向 Flight 持久实体添加 origin 字段，并将 origin 字段映射到的表列名称\
  \ FLT_ORIGIN 指定为 column 参数的值：\n\n```\n~.domain.Flight roo> field string --fieldName\
  \ origin --column FLT_ORIGIN\n```\n\ncolumn 参数的存在表示该字段使用 @Column JPA 注解进行注解，其中 column\
  \ 参数的值表示 @Column 注解的 name 属性的值，如下所示：\n\n```\n@RooJavaBean\n@RooToString\n@RooEntity(table\
  \ = \"FLIGHT_TBL\")\npublic class Flight {\n\n    @Column(name = \"FLT_ORIGIN\"\
  )\n    private String origin;\n\n}\n```\n\n随本书附带的 Roo 脚本 ch02_persistent_fields.roo\
  \ 包含用于创建由 Flight 实体和 FlightKey 类组成的 flight-app 项目的命令。此外，该脚本还为 Flight 实体和 FlightKey\
  \ 类中定义的所有持久字段添加数据库列映射。建议你退出 Roo shell，删除 ch02-recipes 目录中的所有文件，并通过执行 ch02_persistent_fields.roo\
  \ 脚本重新创建 flight-app Roo 项目。\n\n### Roo 命令中的 class 参数\n\n我们在一些配方中看到，focus 命令用于将命令引用从\
  \ Roo 项目中的一个类或接口切换到另一个类或接口，随后是应用于该类或接口的 Roo 命令。与使用 focus 命令不同，你可以使用 roo 命令的 class\
  \ 参数（如果 roo 命令支持）来显式指定命令适用的类或接口。例如，我们可以在不使用 focus 命令的情况下向 FlightKey 类添加 flightId\
  \ 字段，如下所示：\n\n```\n...roo> field string --class ~.domain.Flight --fieldName origin\
  \ --column FLT_ORIGIN\n```\n\n从 field 命令可以看出，我们可以指定命令适用的类的完全限定名。\n\n### 另请参见\n\n\
  - 请参阅“控制持久实体自动生成的方法”配方，了解如何控制与持久实体对应的 Spring Roo 生成的方法\n\n## 向持久字段添加 JSR 303 约束\n\
  \nJSR 303（Bean 验证）定义了一种基于注解的 JavaBeans 验证的标准方法。在本配方中，我们将探讨如何使用 Spring Roo 的 field\
  \ 命令向实体的持久字段添加 JSR 303 验证约束。\n\n下表显示了适用于我们 flight-app 项目中 Flight 实体和 FlightKey 类所定义字段的验证约束：\n\
  \n| 持久字段 | 约束 | JSR 303 注解 |\n| --- | --- | --- |\n| Flight -> createdDate | 非空\
  \ | @NotNull |\n| Flight -> createdBy | 非空 | @NotNull |\n| Flight -> numOfSeats\
  \ | 非空 | @NotNull |\n| | 最大座位数 200 | @DecimalMax (\"200\") |\n| | 最小座位数 100 | @DecimalMin\
  \ (\"100\") |\n| Flight -> origin | 非空 | @NotNull |\n| | origin 值的最大长度为 20，最小长度为\
  \ 3 | @Size (min=3, max=20) |\n| Flight -> destination | 非空 | @NotNull |\n| | destination\
  \ 值的最大长度为 20，最小长度为 3 | @Size (min=3, max=20) |\n| FlightKey -> flightId | 非空 | @NotNull\
  \ |\n| FlightKey -> departureDate | 非空 | @NotNull |\n\n### 准备工作\n\n退出 Roo shell\
  \ 并删除 C:\\roo-cookbook\\ch02-recipes 目录的内容。\n\n执行 ch02_jpa_setup.roo 脚本。它将创建一个 flight-app\
  \ Roo 项目，并使用 persistence setup 命令将 Hibernate 设置为持久化提供程序。如果你使用的数据库不是 MySQL，或者你的连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 C:\\roo-cookbook\\ch02-recipes 目录启动 Roo shell。\n\n### 操作步骤\n\n按照以下步骤添加 JSR 303\
  \ 约束：\n\n- 1. 使用 entity 命令在 sample.roo.flightapp.domain 包中创建 Flight 实体：\n  ..roo>\
  \ entity --class ~.domain.Flight --identifierType ~.domain.FlightKey --table FLIGHT_TBL\n\
  \n- 2. 向 Flight 实体添加 numOfSeats、origin、destination、createdBy、modifiedBy、createdDate\
  \ 和 modifiedDate 字段，如下所示：\n  ..roo> field number --type java.lang.Integer --fieldName\
  \ numOfSeats --column NUM_OF_SEATS --notNull --decimalMin 100 --decimalMax 200\n\
  \  ..roo> field string --fieldName origin --column FLT_ORIGIN --notNull --sizeMin\
  \ 3 --sizeMax 20\n  ..roo> field string --fieldName destination --column FLT_DESTINATION\
  \ --notNull --sizeMin 3 --sizeMax 20\n  ..roo> field date --type java.util.Date\
  \ --fieldName createdDate --column CREATED_DATE --notNull\n  ..roo> field string\
  \ --fieldName createdBy --column CREATED_BY --notNull\n\n- 3. 使用 focus 命令将 Roo 提示符设置为\
  \ FlightKey 主键类：\n  ..roo> focus --class ~.domain.FlightKey\n\n- 4. 向 FlightKey\
  \ 实体添加 flightId 和 departureDate 字段，如下所示：\n  ..roo> field string --fieldName flightId\
  \ --column FLIGHT_ID --notNull\n  ..roo> field date --fieldName departureDate --type\
  \ java.util.Date --notNull --column FLT_DEP_DATE\n\n### 工作原理...\n\n在 `field` 命令中，你可以使用\
  \ `notNull`、`nullRequired`、`decimalMax`、`decimalMin`、`regexp`、`sizeMax` 和 `sizeMin`\
  \ 等参数来指定适用于字段的验证约束。使用这些参数将生成带有 JSR 303 注解的字段，如下所示为 `Flight` 实体：\n\n```\npublic class\
  \ Flight {\n    @NotNull\n    @DecimalMin(\"100\")\n    @DecimalMax(\"200\")\n \
  \   @Column(name=\"NUM_OF_SEATS\")\n    private Integer numOfSeats;\n\n    @NotNull\n\
  \    @Column(name = \"FLT_ORIGIN\")\n    @Size(min = 3, max = 20)\n    private String\
  \ origin;\n\n    @NotNull\n    @Column(name = \"FLT_DESTINATION\")\n    @Size(min\
  \ = 3, max = 20)\n    private String destination;\n    .....\n}\n```\n\n### 还有更多...\n\
  \n使用 JSR 303 约束并不局限于领域对象；你可以在任何类中使用 JSR 303 约束，无论该类用于哪个层。例如，你可以在 Web 层的命令对象或表单支撑对象中使用\
  \ JSR 303 约束。\n\n### 另请参见\n\n- 请参阅“创建持久实体”配方，了解如何创建持久实体并向其中添加字段\n\n\n\n\n\n## 控制持久实体自动生成的方法\n\
  \n当使用 Roo 创建持久实体时，会自动生成多个方法以简化实体的使用和测试。例如，在“创建持久实体”配方中创建了 Flight 实体后，相应的 Flight_Roo_Entity.aj\
  \ AspectJ ITD 文件将被创建，其中包含 persist、remove、merge、flush、findFlight 等方法。\n\n在本配方中，我们将了解如何通过以下方式控制实体方法的生成：\n\
  \n- 指定方法所使用的前缀\n- 指示 Roo 不生成特定方法\n\n为了本配方的目的，我们将指示 Roo 对 Flight 实体执行以下操作：\n\n- 将自动生成的\
  \ persist 方法名称更改为 save\n- 将自动生成的 findFlight 方法名称更改为 finderForFlight\n- 不要生成 countFlights\
  \ 和 findFlightEntries 方法\n\n### 准备工作\n\n退出 Roo shell，删除 C:\\roo-cookbook\\ch02-recipes\
  \ 目录的内容。\n\n执行 ch02_jsr303_fields.roo 脚本。该脚本会创建 flight-app Roo 项目，并使用 persistence\
  \ setup 命令将 Hibernate 设置为持久化提供程序。该脚本还会创建 Flight 实体（其复合主键类为 FlightKey），并向 Flight\
  \ 和 FlightKey 类添加字段。如果您使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\n从 C:\\roo-cookbook\\\
  ch02-recipes 目录启动 Roo shell。\n\n### 具体步骤...\n\n以下步骤将向您展示如何控制自动生成的方法：\n\n- 1. 在您喜欢的\
  \ IDE 中打开 Flight.java 文件。\n- 2. 将 @RooEntity 注释更改为：@RooEntity(identifierType = FlightKey.class,\
  \ persistMethod=\"save\", countMethod=\"\",\nfindMethod=\"finderFor\", findEntriesMethod=\"\
  \")\n\n- 3. 您将在 Roo shell 中看到以下输出：\n\n```\nUpdated SRC_MAIN_JAVA\\\\sample\\\\roo\\\
  \\flightapp\\\\domain\\\\Flight_Roo_Entity.aj\n```\n\n### 工作原理...\n\nRoo 的 @RooEntity\
  \ 注释负责管理相应的 *_Roo_Entity.aj AspectJ ITD 文件中定义的方法。@RooEntity 注释定义了允许您指定 Roo 生成的方法前缀的属性，并可控制是否生成特定方法。@RooEntity\
  \ 注释还定义了可用于指定实体标识符和版本字段名称、类型及表列信息的属性。\n\n在前面的代码中，@RooEntity 注释指定了以下信息：\n\n- identifierType\
  \ = FlightKey.class：指定 Flight 实体的标识符类型为 FlightKey 类。默认值为 Long。\n- persistMethod\
  \ = \"save\"：值 'save' 表示 Roo 不会生成 persist 方法，而是生成名为 save 的方法。\n- countMethod = \"\
  \"：由于值为 \"\"，表示 Roo 不得生成 countFlights 方法。\n- findEntriesMethod = \"\"：由于值为 \"\"\
  ，表示 Roo 不得生成 findFlightEntries 方法。\n- findMethod = \"finderFor\"：由于值为 finderFor，Roo\
  \ 不会生成 findFlight 方法，而是生成名为 finderForFlight 的方法。\n\n下表描述了 @RooEntity 注释定义的所有属性：\n\
  \n| @RooEntity 属性 | 描述 |\n| --- | --- |\n| countMethod, findAllMethod, findEntriesMethod,\
  \ findMethod, flushMethod, mergeMethod, persistMethod, removeMethod | 用于指定生成方法的前缀的属性。值为\
  \ \"\" 表示 Roo 不会生成该方法。 |\n| identifierColumn, identifierField, identifierType |\
  \ 用于指定 JPA 实体标识符信息的属性，包括标识符字段映射到的表列名称、AspectJ ITD 文件中的标识符字段名称以及标识符字段的 Java 类型。 |\n\
  | versionField, versionType, versionColumn | 用于指定版本字段信息的属性，包括版本字段映射到的表列名称、AspectJ\
  \ ITD 文件中的版本字段名称以及版本字段的 Java 类型。 |\n| finders | 指定 Roo 为其生成动态查找方法的方法名称的属性。 |\n|\
  \ mappedSuperclass | 指示 Roo 生成 @MappedSuperclass 注释而不是 @Entity。我们将在第 3 章“Spring\
  \ Roo 中的高级 JPA 支持”中了解映射超类的用法。 |\n| inheritanceType | 要用于 JPA 实体的继承类型。 |\n| persistenceUnit\
  \ | 实体关联的持久化单元的名称，在 persistence.xml 中定义。 |\n| transactionManager | [自 Spring Roo\
  \ 1.1.5 起支持] 与实体关联的事务管理器的名称。 |\n\n> **另请参阅**\n> 请参阅“创建持久实体”配方，了解如何使用 Roo 创建 JPA\
  \ 实体\n\n## 为持久实体创建集成测试\n\nSpring Roo 提供了一个 test integration 命令，用于简化持久实体的集成测试创建。在本配方中，我们将了解如何为实体创建集成测试。\n\
  \n### 准备工作\n\n退出 Roo shell，删除 C:\\roo-cookbook\\ch02-recipes 目录的内容。\n\n执行 ch02_jsr303_fields.roo\
  \ 脚本。该脚本会创建 flight-app Roo 项目，并使用 persistence setup 命令将 Hibernate 设置为持久化提供程序。该脚本还会创建\
  \ Flight 实体（其复合主键类为 FlightKey），并向 Flight 和 FlightKey 类添加字段。如果您使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 C:\\roo-cookbook\\ch02-recipes 目录启动 Roo shell。\n\n### 具体步骤...\n\n以下步骤将向您展示如何创建集成测试：\n\
  \n- 1. 将 Roo 命令的焦点更改为 Flight 实体：\n  ```\n  roo> focus --class ~.domain.Flight\n\
  \  ```\n\n- 2. 执行 `test integration` 命令：\n  ```\n  ~.domain.Flight> test integration\n\
  \  Created ...FlightDataOnDemand.java\n  Created ...FlightIntegrationTest.java\n\
  \  Created ...FlightDataOnDemand_Roo_DataOnDemand.aj\n  Created ...FlightIntegrationTest_Roo_IntegrationTest.aj\n\
  \  Created ... FlightDataOnDemand_Roo_Configurable.aj\n  Created ... Flight_Roo_Configurable.aj\n\
  \  ```\n\n### 工作原理...\n\n`test integration` 命令会在 src\\test\\java 文件夹中生成文件。`test\
  \ integration` 命令的输出显示生成了以下文件：\n\n`test integration` 命令的输出显示生成了以下文件：\n\n- `FlightDataOnDemand.java`：表示一个“按需数据”类，为\
  \ `Flight` 实体的自动化集成测试提供必要数据。\n\n- FlightDataOnDemand_Roo_DataOnDemand.aj：此 AspectJ\
  \ ITD 文件定义在编译期间添加到 FlightDataOnDemand 类中的方法。此 AspectJ ITD 文件中定义的方法负责动态创建 10 个 Flight\
  \ 实体实例并将其存储在数据库中（即种子数据）。在执行集成测试时会使用这些 Flight 实例。AspectJ ITD 创建的实体实例符合适用于实体持久字段的\
  \ JSR 303 约束。默认情况下，与测试方法关联的事务在测试方法完成后会回滚——这就是执行集成测试后您不会在数据库表中看到种子数据的原因。请参阅“执行持久实体测试”配方，了解\
  \ Spring 的 @Rollback 注释的示例用法，用于指定与测试方法关联的事务不得回滚。\n\n- FlightIntegrationTest.java：表示\
  \ Flight 实体的 JUnit 集成测试类。\n\n- FlightIntegrationTest_Roo_IntegrationTest.aj：负责为\
  \ Flight 实体定义集成测试方法的 AspectJ ITD。\n\n- FlightDataOnDemand_Roo_Configurable.aj 和\
  \ Flight_Roo_Configurable.aj：分别向 FlightDataOnDemand 和 Flight 类添加 @Configurable 注释的\
  \ AspectJ ITD。\n\n让我们现在详细查看每个文件。\n\n以下清单显示了 FlightDataOnDemand.java 类：\n\n```\n\
  import org.springframework.roo.addon.dod.RooDataOnDemand;\nimport sample.roo.flightapp.domain.Flight;\n\
  \n@RooDataOnDemand(entity = Flight.class)\npublic class FlightDataOnDemand { }\n\
  ```\n\n代码清单展示了 Roo 的 @RooDataOnDemand 注释的用法，该注释标识 FlightDataOnDemand 类为其创建集成测试种子数据的持久实体。@RooDataOnDemand\
  \ 注释负责创建相应的 *_Roo_DataOnDemand.aj AspectJ ITD 文件。@RooDataOnDemand 接受两个属性来自定义种子数据生成的行为：\n\
  \n- entity：标识需要为其创建种子数据的持久实体。\n\n- quantity：要为实体创建的记录数，默认值为 10。如果您想为实体的集成测试创建更多记录，请为此属性指定适当的值。\n\
  \n\n\n\n\n如果您使用 JMeter 等性能测试工具来测试企业应用 JPA 层的性能，可以在 JMeter 中创建测试计划时修改 FlightIntegrationTest\
  \ JUnit 测试类，并将其用作 JUnit Request Sampler（或者可以为 FlightIntegrationTest 创建包装器并使用 Java\
  \ Request Sampler）。这能让您快速开始测试数据访问代码的性能。基于持久实体的性能测试要求，您可以调整 @RooDataOnDemand 注解的\
  \ quantity 属性值。例如，如果您想在数据库中存在 n 条记录时测试数据访问层的性能，则将 quantity 属性值指定为 n。\n\n下面的清单显示了\
  \ FlightDataOnDemand_Roo_DataOnDemand.aj AspectJ ITD 文件，该文件在编译时将方法、属性和注解织入 FlightDataOnDemand.java\
  \ 类中：\n\n```\nprivileged aspect FlightDataOnDemand_Roo_DataOnDemand {\n\n    declare\
  \ @type: FlightDataOnDemand: @Component;\n\n    private Random FlightDataOnDemand.rnd\
  \ =\n        new java.security.SecureRandom();\n\n    private List<Flight> FlightDataOnDemand.data;\n\
  \n    public Flight FlightDataOnDemand.getNewTransientFlight (int\n    index) {...}\n\
  \n    public Flight FlightDataOnDemand.getSpecificFlight (int\n    index) {...}\n\
  \n    public Flight FlightDataOnDemand.getRandomFlight () {...}\n\n    public boolean\
  \ FlightDataOnDemand.modifyFlight (Flight obj)\n    {...}\n\n    public void FlightDataOnDemand.init()\
  \ {...}\n\n}\n```\n\n代码清单显示 AspectJ ITD 执行以下操作：\n\n- 将 @Component 注解添加到 FlightDataOnDemand\
  \ 类，以便它自动注册到 Spring 的应用程序上下文中。这样您就可以创建自定义集成测试，在其中可以自动装配一个或多个 *DataOnDemand 类。\n\
  - 创建 java.security.SecureRandom 类的实例，用于生成随机数。\n- 声明一个列表，用于保存由 \"数据按需\" 类生成的 `Flight`\
  \ 实体。这些 `Flight` 实体实例代表由 \"数据按需\" 类生成的种子数据。\n- 定义 `getNewTransientFlight(int index)`\
  \ 方法，用于根据 `index` 参数的值生成一个 `unique` `Flight` 实例。`getNewTransientFlight` 方法创建符合实体持久字段所指定的\
  \ JSR 303 注解的持久实体实例。例如，`Flight` 实体为 `origin` 和 `destination` 字段指定了 `@Size(min =\
  \ 3, max = 20)` JSR 303 注解（请参阅 `Flight.java` 类）；因此，`getNewTransientFlight` 方法会尝试（也就是说，不保证，我们稍后将看到）确保\
  \ `origin` 和 `destination` 字段的大小符合相应的 JSR 303 注解。\n- 定义 `getSpecificFlight(int index)`\
  \ 方法，它返回由 \"数据按需\" 类维护的种子数据集合中指定 `index` 处的 `Flight` 实体。\n- 定义 `getRandomFlight()`\
  \ 方法，它返回 \"数据按需\" 类维护的种子数据集合中由 `java.security.SecureRandom` 实例获取的随机索引处的 `Flight`\
  \ 实体。\n- 定义 `modifyFlight(Flight obj)` 方法，该方法应修改作为参数传递的 `Flight` 实体并返回修改的成功或失败。但它仅返回\
  \ `false`，也就是说，它永远不会修改传递的 `Flight` 实例。\n- 定义 `init()` 方法，该方法负责为 `Flight` 实体的集成测试创建种子数据。它使用\
  \ `getNewTransientFlight(int index)` 方法在数据库中创建 `Flight` 实体。数据库中创建的 `Flight` 实体数量由\
  \ `@RooDataOnDemand` 注解的 `quantity` 属性值确定。\n\n需要注意的是，`init()` 方法会被 `*_Roo_DataOnDemand.aj`\
  \ 中定义的方法内部调用，以确保每次调用测试方法时都会在数据库中创建一组新的种子数据。\n\n### JSR 303 注解和种子数据\n\nSpring Roo\
  \ 生成的 \"数据按需\" 类为创建符合 JSR 303 注解的实体实例提供了有限支持。截至 Spring Roo 1.1.3，它仅支持 `@NotNull`、`@Past`\
  \ 和 `@Future` JSR 303 约束，并对最大和最小范围注解提供了一些支持。如果您的项目使用任何其他 JSR 303 注解，则建议在 `*DataOnDemand.java`\
  \ 类中为实体字段创建自己的 setter 方法。\n\n下面的清单显示了 FlightIntegrationTest.java 类：\n\n```\nimport\
  \ org.junit.Test;\nimport org.springframework.roo.addon.test.RooIntegrationTest;\n\
  \n@RooIntegrationTest(entity = Flight.class )\npublic class FlightIntegrationTest\
  \ {\n  @Test\n  public void testMarkerMethod() {\n  }\n}\n```\n\n代码清单显示了 Roo 的 @RooIntegrationTest\
  \ 注解的存在，该注解表示要为 Flight 实体创建集成测试 AspectJ ITD。testMarkerMethod 是一个示例 JUnit 测试方法。@RooIntegrationTest\
  \ 注解接受 entity 属性，用于标识创建集成测试的持久实体——在 FlightIntegrationTest 类中即为 Flight。此外，@RooIntegrationTest\
  \ 注解定义了属性，可让您控制 Roo 在相应的 *_Roo_IntegrationTest.aj AspectJ ITD 中自动生成的集成测试方法。\n\n\
  下面的清单显示了 Roo 为 FlightIntegrationTest 类生成的 FlightIntegrationTest_Roo_IntegrationTest.aj\
  \ AspectJ ITD 文件：\n\n```\nimport org.junit.Test;\nimport org.junit.runner.RunWith;\n\
  import org.springframework.test.context.ContextConfiguration;\nimport org.springframework.test.context.junit4.SpringJUnit4ClassRunner;\n\
  \nprivileged aspect FlightIntegrationTest_Roo_IntegrationTest {\n  declare @type:\
  \ FlightIntegrationTest:\n    @RunWith(SpringJUnit4ClassRunner.class);\n\n  declare\
  \ @type: FlightIntegrationTest:\n    @ContextConfiguration(locations =\n      \"\
  classpath:/META-INF/spring/applicationContext.xml\");\n\n  declare @type: FlightIntegrationTest:@Transactional;\n\
  \n  @Autowired\n  private FlightDataOnDemand FlightIntegrationTest.dod;\n\n  @Test\n\
  \  public void FlightIntegrationTest.testFindAllFlights() {\n    ...\n  }\n\n  @Test\n\
  \  public void FlightIntegrationTest.testPersist() {\n    ...\n  }\n\n  ...\n}\n\
  ```\n\n前面的代码显示 AspectJ ITD 执行以下操作：\n\n- 将 JUnit 的 @RunWith 注解添加到 FlightIntegrationTest\
  \ 类，指示使用 Spring 的 SpringJUnit4ClassRunner 来运行 JUnit 测试。\n- 将 Spring 的 @ContextConfiguration\
  \ 注解添加到 FlightIntegrationTest 类，该注解指定用于执行测试的 Spring 应用程序上下文 XML 文件的位置。默认情况下，它设置为使用\
  \ META-INF/spring 文件夹中的 applicationContext.xml 文件。如果您想使用不同的应用程序上下文 XML 来运行测试，则在\
  \ FlightIntegrationTest 类中指定 @ContextConfiguration 注解。\n- 将 Spring 的 @Transactional\
  \ 注解添加到 FlightIntegrationTest 类，这意味着在 FlightIntegrationTest 中定义（或由 AspectJ ITD 织入）的所有测试方法都是事务性的。\n\
  - 声明集成测试方法，例如 testFindAllFlights、testPersist 等。测试方法使用 FlightDataOnDemand（一个 \"数据按需\"\
  \ 类）实例来创建 Flight 实例（种子数据）以测试 Flight 实体，并从数据库中检索随机的 Flight 实例。\n\n## 还有更多...\n\n\
  在某些场景中，您可能希望自定义由 *DataOnDemand*.java 类创建的种子数据，并控制 Spring Roo 自动生成的集成测试方法。\n\n##\
  \ 自定义种子数据创建\n\n如果您使用 Spring Roo 不支持的 JSR 303 注解，则需要创建自定义 setter 方法（在 *._Roo_DataOnDemand.aj\
  \ 中定义）来设置持久实体字段值。下面的清单显示了 Roo 为 Flight 实体自动生成的一些 setter 方法（setNumOfSeats 和 setOrigin）；下面是\
  \ FlightDataOnDemand_Roo_DataOnDemand.aj 方法：\n\n```\npublic Flight FlightDataOnDemand.getNewTransientFlight(int\
  \ index) {\n  sample.roo.flightapp.domain.Flight obj = new sample.roo.flightapp.domain.Flight();\n\
  }\n```\n\n\n\n```\nsetEmbeddedId(obj, index);\nsetNumOfSeats(obj, index);\nsetOrigin(obj,\
  \ index);\nsetDestination(obj, index);\n...\nreturn obj;\n}\n```\n\n```\nprivate\
  \ void FlightDataOnDemand.setEmbeddedId(Flight obj,\nint index) {\njava.lang.String\
  \ flightId = \"flightId_\" + index;\n...\nobj.setId(embeddedIdClass);\n}\n```\n\n\
  ```\nprivate void FlightDataOnDemand.setNumOfSeats(Flight obj,\nint index) {\njava.lang.Integer\
  \ numOfSeats = new Integer(index);\nobj.setNumOfSeats(numOfSeats);\n}\n```\n\n```\n\
  private void FlightDataOnDemand.setOrigin(Flight obj,\nint index) {\njava.lang.String\
  \ origin = \"origin_\" + index;\nif (origin.length() > 20) {\norigin = origin.substring(0,\
  \ 20);\n}\nobj.setOrigin(origin);\n}\n...\n```\n\n在代码清单中，关于创建的 Flight 实体，有几点需要注意：\n\
  \n- 创建 Flight 实体时会处理 @NotNull JSR 303 注解，但 numOfSeats 字段上的 @DecimalMax 和 @DecimalMin\
  \ JSR 303 注解被完全忽略（参考代码清单中的 setNumOfSeats 方法）。\n\n- origin 和 destination 字段上的 @Size\
  \ 注解只得到部分支持，因为该方法仅检查分配给 destination（或 origin）字段的值的最大长度是否为 20。它不检查最小长度是否为 3。（参考代码清单中的\
  \ setOrigin 方法。）\n\n- 组合键是动态创建并设置的（参考上一个清单中的 setEmbeddedId 方法）。\n\n要解决 FlightDataOnDemand_Roo_DataOnDemand.aj\
  \ 自动生成的 Flight 实体实例中 JSR 303 支持的问题，可以在 FlightDataOnDemand.java 类中编写自定义的 setNumOfSeats、setOrigin\
  \ 和 setDestination 方法，这些方法将执行以下操作：\n\n- 检查 origin 和 destination 字段的长度在 @Size 定义的范围内\n\
  \n- 提供对 @DecimalMin 和 @DecimalMax JSR 303 注解的检查\n\n需要注意的是，如果在 FlightDataOnDemand.java\
  \ 类中创建 setNumOfSeats、setOrigin 和 setDestination 方法，则 Roo 会将这些方法从相应的 FlightDataOnDemand_Roo_DataOnDemand.aj\
  \ AspectJ ITD 中删除。这要求 FlightDataOnDemand.java 类中方法的签名必须与相应的 FlightDataOnDemand_Roo_DataOnDemand.aj\
  \ AspectJ ITD 文件中定义的方法签名相同。同样，你可以通过在 FlightDataOnDemand.java 类中编写方法来自定义 FlightDataOnDemand_Roo_DataOnDemand.aj\
  \ 的任何方法。\n\n下图显示了 Roo 如何从 FlightDataOnDemand_Roo_DataOnDemand.aj 文件中删除 setNumOfSeats、setOrigin\
  \ 和 setDestination 方法：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_90_0.png)\n\n\
  图中显示，**Spring Roo Shell** 监视 **FlightDataOnDemand.java** 类（因为它标注了 Roo 的 **@RooDataOnDemand**\
  \ 注解）。当对 **FlightDataOnDemand.java** 类进行任何更改时，Roo 会触发负责管理与 **FlightDataOnDemand.java**\
  \ 类对应的 AspectJ ITD 文件的插件。对于 **FlightDataOnDemand**，Roo 会触发 **Dod add-on**（“数据按需”）来更新\
  \ **FlightDataOnDemand_Roo_DataOnDemand.aj** AspectJ ITD，以便 AspectJ ITD 与 **FlightDataOnDemand.java**\
  \ 类保持同步。当你在 **FlightDataOnDemand.java** 类中添加 **setNumOfSeats**、**setOrigin** 和 **setDestination**\
  \ 方法时，**Dod add-on** 会检查这些方法是否已经存在。如果存在，**Dod add-on** 会将这些方法从 **FlightDataOnDemand_Roo_DataOnDemand.aj**\
  \ AspectJ ITD 中删除。\n\n需要注意的是，修改标注了 Roo 注解的 Java 类可能会影响多个 AspectJ ITD。例如，如果从 **Flight_Roo_JavaBean.aj**\
  \ 中删除 **modifiedBy** 字段，Roo 将更新 **Flight_Roo_ToString.aj** 和 **FlightDataOnDemand_Roo_DataOnDemand.aj**\
  \ AspectJ ITD 文件，以反映 **modifiedBy** 字段的删除。\n\n## 控制集成测试方法\n\n如前所述，**\\*IntegrationTest.java**\
  \ 中的 **@RooIntegrationTest** 注解定义了属性，可让你控制 Roo 在 **\\*_Roo_IntegrationTest.aj**\
  \ AspectJ ITD 文件中自动生成的集成测试方法。**@RooIntegrationTest** 注解定义了以下属性来控制集成测试方法的自动生成：count、find、findAll、findAllMaximum、findEntries、flush、merge、persist\
  \ 和 remove。如果任何属性的值指定为 false，则相应的测试方法将从 **\\*_Roo_IntegrationTest.aj** AspectJ ITD\
  \ 文件中删除。例如，**testFindAllFlights** 方法会在数据库中查找所有 **Flight** 实例，出于性能考虑，这可能并不可取。要指示\
  \ Spring Roo 从 **FlightIntegrationTest_Roo_IntegrationTest.aj** 文件中删除自动生成的 **testFindAllFlights**\
  \ 方法，只需在 **@RooIntegrationTest** 注解中将 **findAll** 属性的值指定为 false，如下所示：\n\n```\n@RooIntegrationTest(entity\
  \ = Flight.class, findAll=false)\npublic class FlightIntegrationTest {\n    ...\n\
  }\n```\n\n## 在实体创建时生成集成测试\n\n在本示例中，我们了解了如何使用 **test integration** 命令创建集成测试。你还可以使用\
