  http://PacktLib.PacktPub.com\n\n你需要针对 IT 问题的即时解决方案吗？PacktLib 是 Packt 的在线数字图书馆。在这里，你可以访问、阅读并搜索\
  \ Packt 的整个图书库。\n\n## 为什么订阅？\n\n- 可在 Packt 出版的每本书中全文检索\n- 复制、粘贴、打印和书签内容\n- 按需获取，可通过\
  \ Web 浏览器访问\n\n## Packt 账户持有者的免费访问权限\n\n如果你在 www.PacktPub.com 上拥有 Packt 账户，可以使用它立即访问\
  \ PacktLib，并查看九本完全免费的图书。只需使用你的登录凭据即可立即访问。\n\n## 前言\n\nSpring Roo 是一种易于使用的生产力工具，可用于使用\
  \ Spring、Hibernate、AspectJ、Spring Web Flow、Spring Security、GWT 等广泛认可的框架快速开发 Java\
  \ 企业级应用程序。Spring Roo 负责创建启用 Maven 的项目、基于所选技术的企业应用程序架构、基于所选测试框架的单元和/或集成测试等。简而言之，如果你使用\
  \ Spring，那么你应该考虑使用 Spring Roo 来提高生产力。\n\nSpring Roo 1.1 Cookbook 汇集了一系列示例，演示 Spring\
  \ Roo 开发者工具如何简化使用 JPA、GWT、Spring、Flex、Spring Web Flow、Spring Security 等标准技术和/或框架快速开发企业级应用程序。本书向读者介绍了使用\
  \ Spring Roo 工具开发现实世界中的企业级应用程序。本书从基础示例开始，让读者熟悉使用 Spring Roo 工具。随着书籍的深入，读者将在航班预订应用程序的背景下了解\
  \ Spring Roo 支持的更高级功能。以循序渐进的方式，每个示例展示如何执行特定活动、执行命令时 Spring Roo 做了什么，以及它在正在开发的应用程序背景下为什么很重要。\n\
  \n起初，你可以通过一些简单的示例快速开始使用 Spring Roo。然后，你将学习 Spring Roo 如何使用 JPA 简化企业级应用程序持久层的创建。你将了解各种\
  \ Roo 命令，用于创建 JPA 实体、在 JPA 实体之间创建关系、使用 Spring TestContext 框架创建集成测试等。接着，本书向你展示如何使用\
  \ Spring Roo 简化使用 Spring Web MVC、Spring Web Flow 创建企业级应用程序 Web 层，以及如何为控制器对象创建 Selenium\
  \ 测试。\n\n随后，我们将重点放在使用 Spring-BlazeDS、GWT、JSON 等方面。接下来，将演示用于将电子邮件和/或消息传递功能集成到企业级应用程序中的\
  \ Spring Roo 命令。最后，我们将通过一些杂项示例结束，演示如何通过插件扩展 Spring Roo、集成安全性、创建云就绪应用程序、从企业级应用程序中移除\
  \ Spring Roo 等。\n\n## 本书涵盖的内容\n\n第 1 章，Spring Roo 入门，涵盖简单示例，向读者介绍 Spring Roo 工具。你将学习如何使用一些基本功能，这些功能使\
  \ Spring Roo 成为易于使用的生产力工具。\n\n第 2 章，使用 JPA 持久化对象，涵盖设置 JPA 提供程序、创建 JPA 实体以及创建单元测试和集成测试的\
  \ Spring Roo 命令。\n\n第 3 章，Spring Roo 中的高级 JPA 支持，侧重于用于向 JPA 实体添加动态查找器方法、在实体之间创建关系以及使用\
  \ Spring Roo 中的数据库逆向工程支持创建 JPA 实体的 Spring Roo 命令。\n\n第 4 章，使用 Spring Web MVC 进行\
  \ Web 应用程序开发，涵盖 Spring Roo 中的 Spring Web MVC 支持。本章中的示例展示如何从 JPA 实体构建 Spring Web\
  \ MVC 应用程序脚手架、对 Web 应用程序进行国际化以及向其添加不同主题。\n\n第 5 章，使用 GWT、Flex 和 Spring Web Flow\
  \ 进行 Web 应用程序开发，展示了如何使用 Spring Roo 从 JPA 实体构建 GWT 和 Flex 应用程序脚手架。本章还展示了 Spring Roo\
  \ 如何让你快速开始使用 Spring Web Flow 开发应用程序。\n\n第 6 章，电子邮件、消息传递、Spring Security、Solr 和 GAE，涵盖与添加电子邮件支持、使用\
  \ JavaMail API 进行消息传递、使用 Spring Security 集成应用程序安全性、使用 Solr 搜索服务器添加搜索功能以及为 Google\
  \ App Engine (GAE) 开发应用程序相关的众多主题。\n\n第 7 章，开发插件并从项目中移除 Roo，通过一些高级主题结束本书，例如如何创建 Spring\
  \ Roo 插件、安装插件、使用 push-in 重构从项目中移除 Roo、使用 pull-up 重构将 Roo 支持添加到现有项目，以及升级到较新版本的 Spring\
  \ Roo。\n\n## 阅读本书所需内容\n\n- Spring Roo 1.1.3 或 1.1.4 或 1.1.5\n- Eclipse Helios IDE（或更高版本）或\
  \ STS\n- Maven 3.x\n- Java SE 6 或更高版本\n- MySQL 数据库\n- Eclipse IDE 的 Google 插件\n\
  - Solr 服务器\n- GnuPG\n- H2 数据库\n\n## 本书适合人群\n\nSpring Roo 1.1 Cookbook 适合初次接触 Spring\
  \ Roo 工具但具有使用 Spring 框架、AspectJ、JPA、GWT 以及 Spring Roo 支持的技术/框架开发应用程序经验的开发人员。如果你初次接触\
  \ Spring 框架，那么在阅读本 Cookbook 之前，建议参考一本涵盖 Spring 的文本。\n\n## 约定\n\n在本书中，你会发现许多文本样式，用于区分不同类型的信息。以下是这些样式的一些示例及其含义：\n\
