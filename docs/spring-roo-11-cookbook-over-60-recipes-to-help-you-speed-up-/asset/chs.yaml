  \npublic class FlightIntegrationTest {\n\t@Autowired\n\tprivate MyFlightDod myDod;\n\
  \n\t@Test\n\tpublic void testMyCustomDodTest() {\n\tsample.roo.flightapp.domain.Flight\
  \ obj =\n```\n\n\n\n```\nmyDog.getNewTransientFlight(Integer.MAX_VALUE);\n..\nobj.persist();\n\
  obj.flush();\n..\n}\n}\n```\n\n## 另请参阅\n\n有关如何为使用 Spring Roo 的实体创建集成测试的详细信息，请参阅“为持久实体创建集成测试”配方。\n\
  \n## 为持久实体创建模拟测试\n\n在“为持久实体创建集成测试”配方中，我们了解到 Spring Roo 如何帮助创建集成测试。在本配方中，我们将探讨 Spring\
  \ Roo 如何使用 test mock 命令简化实体的模拟测试生成。\n\n### 准备工作\n\n退出 Roo shell，删除 C:\\roo-cookbook\\\
  ch02-recipes 目录的内容。\n\n执行 ch02_jsr303_fields.roo 脚本。它会创建一个 flight-app Roo 项目，并使用\
  \ persistence setup 命令将 Hibernate 设置为持久化提供程序。该脚本还会创建一个 Flight 实体，该实体以 FlightKey\
  \ 作为其复合主键类，并向 Flight 和 FlightKey 类添加字段。如果您使用的数据库不是 MySQL，或您的连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 C:\\roo-cookbook\\ch02-recipes 目录启动 Roo shell。\n\n### 操作步骤\n\n按照以下步骤创建模拟测试：\n\
  \n- 1. 使用 focus 命令将 Roo 的焦点设置到 Flight 实体：\n  roo> focus --class ~.domain.Flight\n\
  \n- 2. 要为 Flight 实体创建模拟测试，请执行以下 test mock 命令：\n  ~.domain.Flight roo> test mock\n\
  \  已创建 SRC_TEST_JAVA\\sample\\roo\\flightapp\\domain\\FlightTest.java\n\n### 工作原理\n\
  \n执行 `test mock` 命令会创建一个 JUnit 测试 `FlightTest.java`，用于对 `Flight` 实体进行模拟测试，如下所示：\n\
  \n```\npackage sample.roo.flightapp.domain;\n\n@RunWith(JUnit4.class)\n@MockStaticEntityMethods\n\
  public class FlightTest {\n\n    @Test\n    public void testMethod() {\n       \
  \ int expectedCount = 13;\n        Flight.countFlights();\n\n        ..AnnotationDrivenStaticEntityMockingControl.\n\
  \            expectReturn(expectedCount);\n\n        ..AnnotationDrivenStaticEntityMockingControl.playback();\n\
  \        org.junit.Assert.assertEquals(expectedCount,\n                Flight.countFlights()\
  \ );\n    }\n}\n```\n\n如果您使用的是 Spring Roo 1.1.3，则需要在 Roo 生成的模拟测试中添加 `@MockStaticEntityMethods`\
  \ 和 `@RunWith(JUnit4.class)` 注释，如所示。\n\n在代码清单中，`@MockStaticEntityMethods` 注释是一种\
  \ Spring 注释，用于支持对实体静态方法（如 count 和 finder 方法）的模拟测试。Spring 定义了一个 `AnnotationDrivenStaticEntityMockingControl`\
  \ 切面，该切面适用于使用 `@MockStaticEntityMethods` 注释的测试类中的方法，并模拟对持久实体静态方法的调用。此外，`AnnotationDrivenStaticEntityMockingControl`\
  \ 切面定义了 `expectReturn` 和 `playback` 方法，以简化编写模拟测试。\n\n由于 `AnnotationDrivenStaticEntityMockingControl`\
  \ 切面适用于任何使用 `@MockStaticEntityMethods` 注释的类，因此可以使用任何测试框架（JUnit 或 TestNG）为实体编写模拟测试。对于在实体中定义的实例方法的测试，您将继续使用\
  \ **EasyMock**、**Mockito** 等常用的模拟测试方法。\n\n## 另请参阅\n\n有关 Spring Roo 对 JPA 实体集成测试自动生成的支持，请参阅“为持久实体创建集成测试”配方。\n\
  \n## 执行持久实体测试\n\n在以前的配方中，我们了解了如何为持久实体创建模拟测试和集成测试。在本配方中，我们将探讨如何使用 Spring Roo 的 perform\
  \ tests 命令执行这些测试。\n\n### 准备工作\n\n退出 Roo shell，删除 C:\\roo-cookbook\\ch02-recipes\
  \ 目录的内容。\n\n执行 ch02_jsr303_fields.roo 脚本。它会创建一个 flight-app Roo 项目，并使用 persistence\
  \ setup 命令将 Hibernate 设置为持久化提供程序。该脚本还会创建一个 Flight 实体，该实体以 FlightKey 作为其复合主键类，并向\
  \ Flight 和 FlightKey 类添加字段。如果您使用的数据库不是 MySQL，或您的连接设置与脚本中指定的不同，请相应地修改脚本。\n\n安装 MySQL\
  \ 5.5.11 数据库——这是必需的，因为我们现在将执行集成测试。在 MySQL 服务器实例中创建名为 \"myFlightAppDB\" 的数据库，并确保\
  \ flight-app Roo 项目的 database.properties 文件中定义的连接属性可用于成功连接到 \"myFlightAppDB\"。\n\
  \n从 C:\\roo-cookbook\\ch02-recipes 目录启动 Roo shell。\n\n### 操作步骤\n\n按照以下步骤创建并执行测试：\n\
  \n- 1. 将 Roo 命令的焦点更改为 Flight 实体：\n  roo> focus --class ~.domain.Flight\n\n- 2. 执行\
  \ test integration 命令为 Flight 实体创建集成测试：\n  ~.domain.Flight> test integration\n\n\
  - 3. 要执行 Roo 项目中定义的测试，请从 Roo 提示符发出 perform tests 命令，如下所示：\n  roo> perform tests\n\
  \n目前，Flight 实体的集成测试将失败，因为：\n\n- 自动生成的“数据按需”类对创建符合 JSR 303 注释的实体实例支持有限。如“为持久实体创建集成测试”配方中所述，您可以在\
  \ FlightDataOnDemand.java 实体中为持久字段编写自定义 setter 方法，以创建符合持久字段上指定的 JSR 303 注释的 Flight\
  \ 实体。\n\n- Flight_Roo_Entity.aj AspectJ ITD 文件中 countFlights 方法触发的查询与 MySQL 5.1.1\
  \ 不兼容。您需要将 countFlights 方法从：\n\n```\npublic static long countFlights() {\n    return\
  \ entityManager().createQuery(\"SELECT COUNT(o)\n    FROM Flight o\", Long.class).getSingleResult();\n\
  }\n```\n\n到：\n\n```\npublic static long countFlights() {\n    return entityManager().createQuery(\"\
  SELECT COUNT(*)\n    FROM Flight o\", Long.class).getSingleResult();\n}\n```\n\n\
  由于 AspectJ ITD 文件由 Spring Roo 管理，您不应更改 Flight_Roo_Entity.aj 文件中的 countFlights 方法。相反，请执行\
  \ push-in 重构，或在 Flight.java 文件中创建一个 countFlights 方法。\n\n在 push-in 重构中，您使用 IDE 将\
  \ AspectJ ITD 文件中定义的声明、方法、属性和构造函数推送到目标 Java 类。有关 push-in 重构的更多信息，请参阅第 7 章中的“使用 push-in\
  \ 重构移除 Roo”配方。\n\n> 在 Flight.java 中编写 countFlights 方法时，请确保 Roo 在后台运行，以便 Roo 可以从\
  \ Flight_Roo_Entity.aj 文件中删除 countFlights 方法。此外，请确保 countFlights 方法的签名与 Flight_Roo_Entity.aj\
  \ 文件中定义的签名相同。\n\n### 工作原理\n\nperform tests 命令由 Roo 的 maven 插件处理，负责执行 Roo 项目中包含的所有测试。如果您想直接使用\
  \ maven 执行测试，请退出 Roo 提示符并使用 maven 的 mvn test 命令。测试执行结果保存在 <project_dir>/target/surefire-reports\
  \ 目录中，其中 project_dir 是您的 Roo 项目目录。\n\n## 更多内容\n\n随本书提供的 ch02_flightapp_testing.zip\
  \ 文件包含了我们在前一章和本章配方中看到的 flight-app Eclipse 项目。您可以将此项目导入 Eclipse IDE，查看我对 flight-app\
