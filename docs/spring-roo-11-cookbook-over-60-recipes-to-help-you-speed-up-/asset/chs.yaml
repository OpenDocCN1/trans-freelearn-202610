  \ id=\"i_flight_list\" messageCode=\"global_menu_list\"\nurl=\"/flights?...\"\n\
  z=\"sxdeS3ThjFWC2xKcFfFd4iiZms4=\" />\n```\n\n- 添加一个 id 属性值为 c_find 的新 <menu:category>\
