  \ --class ~.web.MyListener\n--destinationName myDestination --destinationType QUEUE\n\
  ```\n\n已创建 SRC_MAIN_JAVA\\sample\\roo\\flightapp\\web\\MyListener.java\n\n已更新 SRC_MAIN_RESOURCES\\\
