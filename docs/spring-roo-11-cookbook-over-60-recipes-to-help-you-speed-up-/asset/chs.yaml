  \ --table FLIGHT_TBL\n```\n\n## 为集成测试提供自定义实现\n\n与“数据按需”类一样，你可以在 *IntegrationTest.java\
  \ 类中为集成测试方法提供自定义实现。例如，如果你想使用自定义的 testPersist 方法来修改 Roo 生成的 testPersist 测试方法，请在 FlightIntegrationTest.java\
  \ 文件中创建 testPersist 方法。将 testPersist 方法添加到 *IntegrationTest.java 会导致 Roo 从相应的 *_Roo_IntegrationTest.aj\
  \ 文件中删除 testPersist 方法。同样，你可以自定义 *_Roo_IntegrationTest.aj 文件中定义的任何其他测试方法。\n\n##\
  \ 另请参阅\n\n- 参阅“为测试实体创建新的‘数据按需’”示例，了解如何为实体创建种子数据\n- 参阅“执行持久化实体测试”示例，了解如何使用 Spring\
  \ Roo 执行实体的集成测试和模拟测试\n- 参阅“为持久化实体创建模拟测试”示例，创建实体中定义的模拟静态方法\n\n## 为测试实体创建新的“数据按需”\n\
  \n在前面的示例中，我们了解到 test integration 命令和 entity 命令的 testAutomatically 参数会生成实体的集成测试和种子数据。在编写自己的集成测试的场景中，你可能仍希望使用\
  \ Roo 生成的实体种子数据。因此，你正在编写自定义集成测试类，但使用 Roo 生成的“数据按需”类。这时 Spring Roo 的 dod 命令就派上用场了。\n\
  \n## 准备工作\n\n退出 Roo shell 并删除 C:\\roo-cookbook\\ch02-recipes 目录的内容。\n\n执行 ch02_jsr303_fields.roo\
  \ 脚本。该脚本创建 flight-app Roo 项目，并使用 persistence setup 命令将 Hibernate 设置为持久化提供程序。该脚本还创建一个\
  \ Flight 实体，其中 FlightKey 作为其组合主键类，并为 Flight 和 FlightKey 类添加字段。如果你使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 C:\\roo-cookbook\\ch02-recipes 目录启动 Roo shell。\n\n## 操作步骤...\n\n- 1. 将 Roo 命令的焦点更改为\
  \ Flight 实体：\n  roo> focus --class ~.domain.Flight\n\n- 2. 执行 test integration 命令：\n\
  \  ~.domain.Flight> test integration\n\n- 3. 为 Flight 实体创建新的“数据按需”类，执行以下 dod 命令：\n\
  \  ~.domain.Flight> dod --entity ~.domain.Flight --class MyFlightDod\n\nCreated\
