  \ Z\n- z 属性 171\n\n## 感谢购买 Spring Roo 1.1 Cookbook\n\n## 关于 Packt Publishing\n\n\
  Packt 发音为 'packed'，于 2004 年 4 月出版了其第一本书《用于有效 MySQL 管理的 phpMyAdmin 精通》，此后继续专注于出版针对特定技术和解决方案的高度专业化图书。\n\
  \n我们的图书和出版物分享了您的 IT 专业同行在调整和定制当今系统、应用程序和框架方面的经验。我们的面向解决方案的图书为您提供知识和能力，以定制您正在使用的软件和技术，从而完成工作。Packt\
  \ 图书比您过去见过的 IT 图书更具体、更不笼统。我们独特的商业模式使我们能够为您提供更有针对性的信息，让您了解更多需要知道的内容，而减少不需要的内容。\n\n\
  Packt 是一家现代且独特的出版公司，专注于为开发者、管理员和初学者社区制作高质量、前沿的图书。如需更多信息，请访问我们的网站：www.packtpub.com。\n\
  \n## 关于 Packt 开源\n\n2010 年，Packt 推出了两个新品牌，即 Packt Open Source 和 Packt Enterprise，以继续其专业化焦点。本书是\
  \ Packt Open Source 品牌的一部分，该品牌专注于围绕开源许可证构建的软件出版图书，并面向从高级开发人员到初学者网页设计师的所有人提供信息。开源品牌还运行\
  \ Packt 的开源版税计划，通过该计划，Packt 会为每本关于开源软件出版图书的开源项目支付版税。\n\n## 为 Packt 撰稿\n\n我们欢迎所有有兴趣撰写书籍的人士的咨询。图书提案应发送至\
  \ author@packtpub.com。如果您的书籍构想仍处于早期阶段，并在撰写正式图书提案之前希望先与我们讨论，请联系我们；我们的一位责任编辑将与您联系。\n\
  \n我们不仅寻找已出版的作者；如果您拥有强大的技术技能但没有写作经验，我们经验丰富的编辑可以帮助您发展写作生涯，或者只是为您的专业知识赚取一些额外报酬。\n\n\
