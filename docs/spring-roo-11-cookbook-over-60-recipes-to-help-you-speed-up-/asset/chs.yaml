  \ @Rollback(false) Spring 注释，以便 testPersist 方法创建的数据在执行后不会回滚。如果您想要手动验证 testPersist\
  \ 方法创建的数据，或希望保留数据以供进一步测试，此功能将特别有用。\n\n您可以使用 perform tests 命令执行 flight-app 项目中定义的测试，并检查数据库以查看“数据按需”类和在\
  \ testPersist 方法测试期间创建的种子数据。\n\n## 另请参阅\n\n- 有关 Spring Roo 对 JPA 实体集成测试自动生成的支持，请参阅“为持久实体创建集成测试”配方\n\
  \n- 有关模拟实体中定义的静态方法，请参阅“为持久实体创建模拟测试”配方\n\n\n\n\n\n## 创建与多个数据库交互的应用程序\n\nSpring Roo\
  \ 1.1.3 起，实体和持久化设置命令均支持 persistenceUnit 参数，可让你创建与多个数据库交互的企业级应用程序。在本示例中，我们将创建两个持久化单元：\n\
  \n- flight：flight 持久化单元由单个实体 Flight 组成。它使用 Hibernate 作为 JPA 提供程序，并映射到名为 \"myFlightDB\"\
  \ 的 MySQL 数据库。\n- payment：payment 持久化单元由单个实体 Payment 组成。它使用 Hibernate 作为 JPA 提供程序，并映射到名为\
  \ \"myPaymentDB\" 的 MySQL 数据库。\n\n## 准备工作\n\n退出 Roo shell，并删除 C:\\roo-cookbook\\\
  ch02-recipes 目录的内容。\n\n从 C:\\roo-cookbook\\ch02-recipes 目录启动 Roo shell。\n\n## 操作步骤\n\
  \n以下步骤将演示如何创建与多个数据库交互的应用程序：\n\n- 1. 创建 flight-app Roo 项目：\n  roo> project --topLevelPackage\
  \ sample.roo.flightapp --java 6 --projectName flight-app\n\n- 2. 设置 flight 持久化单元：\n\
  \  roo> persistence setup --provider HIBERNATE --database MYSQL --databaseName myFlightDB\
  \ --persistenceUnit flight\n\n- 3. 创建与 flight 持久化单元关联的 Flight 实体：\n  roo> entity\
  \ --class ~.domain.Flight --table FLIGHT_TBL --persistenceUnit flight\n\n- 4. 为\
  \ Flight 实体添加一些字段：\n  ~.domain.Flight roo> field string --fieldName origin --column\
  \ FLT_ORIGIN --notNull\n  ~.domain.Flight roo> field string --fieldName destination\
  \ --column FLT_DESTINATION --notNull\n\n- 5. 为 `Flight` 实体创建集成测试：\n  `~.domain.Flight\
  \ roo> test integration`\n\n- 6. 设置 `payment` 持久化单元：\n  roo> persistence setup --provider\
  \ HIBERNATE --database MYSQL --databaseName myPaymentDB --persistenceUnit payment\n\
  \n- 7. 创建与 `payment` 持久化单元关联的 `Payment` 实体：\n  roo> entity --class ~.domain.Payment\
  \ --table PAYMENT_TBL --persistenceUnit payment\n\n- 8. 为 `Payment` 实体添加字段：\n  `~.domain.Payment\
  \ roo> field string --fieldName paymentType --column PYMT_TYPE --notNull`\n\n- 9.\
  \ 为 `Payment` 实体创建集成测试：\n  `~.domain.Payment roo> test integration`\n\n- 10. 执行\
  \ `perform eclipse` 命令，将 `flight-app` 项目导入 Eclipse IDE：\n  `~.domain.Payment roo>\
  \ perform eclipse`\n\n- 11. 执行集成测试：\n  roo> perform tests\n\n此时执行集成测试将导致失败。我们将很快了解在使用多个数据库时需要做什么才能使测试正常工作。\n\
  \n## 工作原理\n\n持久化单元的概念不仅在企业级应用与多个数据库交互时有用，而且在你希望在应用程序中对实体进行逻辑分组时也很有用。如果你想为不同的逻辑实体组使用不同的持久化提供程序，使用不同的持久化单元也很有用。\n\
  \n使用 `persistence setup` 命令设置持久化提供程序时，可以通过指定 `persistenceUnit` 参数来指定持久化单元名称。同样，在使用\
  \ `entity` 命令创建实体时，可以使用 `persistenceUnit` 参数来指定实体所属的持久化单元。Spring Roo 利用 `persistence\
  \ setup` 命令的 `persistenceUnit` 参数在 `/META-INF/persistence.xml` 文件中定义不同的持久化单元。以下清单显示了执行\
  \ `persistence setup` 命令后 `flight-app` 项目的 `persistence.xml` 文件：\n\n```\n<persistence\
  \ ...>\n<persistence-unit name=\"flight\"\ntransaction-type=\"RESOURCE_LOCAL\">\n\
  <provider>\norg.hibernate.ejb.HibernatePersistence\n</provider>\n..\n</persistence-unit>\n\
  <persistence-unit name=\"payment\"\ntransaction-type=\"RESOURCE_LOCAL\">\n<provider>\n\
  org.hibernate.ejb.HibernatePersistence\n</provider>\n..\n</persistence-unit>\n</persistence>\n\
  ```\n\n在代码中，`<persistence-unit>` 元素的 name 属性反映了你在 persistence setup 命令中指定的 persistenceUnit\
  \ 参数值。由于我们为 flight 和 payment 持久化单元都指定了 Hibernate 作为 JPA 提供程序，因此 `<provider>` 元素包含\
  \ org.hibernate.ejb.HibernatePersistence 作为 JPA 提供程序。如果你想为持久化单元使用不同的 JPA 提供程序，请使用\
  \ persistence setup 命令的 provider 参数进行指定。\n\n由于我们使用不同的持久化单元，使用 entity 命令创建的实体使用 persistenceUnit\
  \ 属性来标识实体关联的持久化单元。以下代码清单显示，persistenceUnit 参数值在 Flight 类的 @RooEntity 注解中被使用：\n\n\
  ```\n@RooJavaBean\n@RooToString\n@RooEntity(persistenceUnit = \"flight\", table\
  \ = \"FLIGHT_TBL\")\npublic class Flight {...}\n```\n\n在代码中，@RooEntity 的 persistenceUnit\
  \ 属性值为 flight，这会影响 Roo 生成相应 *_Roo_Entity.aj AspectJ ITD 文件的方式。以下代码清单显示了 @RooEntity\
  \ 注解的 persistenceUnit 属性对 Flight_Roo_Entity.aj ITD 文件的影响：\n\n```\nprivileged aspect\
  \ Flight_Roo_Entity {\n@PersistenceContext(unitName = \"flight\")\ntransient EntityManager\
  \ Flight.entityManager;\n...\n@Transactional(\"flight\")\npublic void Flight.persist()\
  \ {...}\n@Transactional(\"flight\")\npublic void Flight.remove() {...}\n...\n}\n\
  ```\n\n在代码中，@PersistenceContext 注解使用 unitName 属性来指定 EntityManager 持久化上下文关联的持久化单元。另外，请注意，@Transactional\
  \ 注解现在使用 flight 限定词来指定管理事务所需的事务管理器。\n\n从 Spring Roo 1.1.3 开始，你需要确保每个持久化单元的事务管理器、实体管理器工厂和数据源\
  \ bean 定义已在 /META-INF/spring/applicationContext.xml 文件中配置，如下所示：\n\n```\n<bean class=\"\
  org.apache.commons.dbcp.BasicDataSource\"\n destroy-method=\"close\" id=\"flightDataSource\"\
  >\n ...\n</bean>\n<bean class=\"org.apache.commons.dbcp.BasicDataSource\"\n destroy-method=\"\
  close\" id=\"paymentDataSource\">\n ...\n</bean>\n\n<bean\n class=\"org.springframework.orm.jpa.JpaTransactionManager\"\
  \n id=\"flightTransactionManager\">\n <qualifier value=\"flight\"/>\n <property\
  \ name=\"entityManagerFactory\"\n ref=\"flightEntityManagerFactory\"/>\n</bean>\n\
  \n<bean\n class=\"org.springframework.orm.jpa.JpaTransactionManager\"\n id=\"paymentTransactionManager\"\
  >\n <qualifier value=\"payment\"/>\n <property name=\"entityManagerFactory\"\n ref=\"\
  paymentEntityManagerFactory\"/>\n</bean>\n\n<tx:annotation-driven mode=\"aspectj\"\
  \n transaction-manager=\"flightTransactionManager\"/>\n<tx:annotation-driven mode=\"\
  aspectj\"\n transaction-manager=\"paymentTransactionManager\"/>\n\n<bean\n    class=\"\
  org.springframework.orm.jpa.LocalContainerEntityManagerFactoryBean\"\n    id=\"\
  flightEntityManagerFactory\">\n    <property name=\"persistenceUnitName\" value=\"\
  flight\"/>\n    <property name=\"dataSource\" ref=\"dataSource\"/>\n</bean>\n<bean\
  \ class=\"org.springframework.orm.jpa.LocalContainerEntityManagerFactoryBean\"\n\
  \    id=\"paymentEntityManagerFactory\">\n    <property name=\"persistenceUnitName\"\
  \ value=\"payment\"/>\n    <property name=\"dataSource\" ref=\"dataSource\"/>\n\
  </bean>\n```\n\n代码显示，为每个持久化单元配置了不同的事务管理器、实体管理器工厂和数据源 bean。事务管理器 bean 定义使用 <qualifier>\
  \ 元素，以便 @Transactional 注解可以使用限定词来引用目标事务管理器。另外，LocalContainerEntityManagerFactoryBean\
  \ 通过 persistenceUnitName 属性传递其关联的持久化单元名称。\n\n为确保集成测试正常工作，你还需要为标注了 @Transactional\
  \ 注解的测试方法指定要使用的事务管理器。要实现这一点，你只需在测试类中指定 @Transactional 注解即可，如 PaymentIntegrationTest\
  \ 类所示：\n\n```\n@RooIntegrationTest(entity = Payment.class)\n@Transactional(\"payment\"\
  )\npublic class PaymentIntegrationTest {\n\n    @Test\n    public void testMarkerMethod()\
  \ {\n    }\n\n}\n```\n\n## 另请参阅\n\n- 请参阅“创建持久化实体”示例，了解如何创建属于单个持久化单元的持久化实体\n\n\n\n\
  \n\n## 打包您的 Roo 项目\n\n如果您仅使用 Roo 来创建企业应用程序的持久化层，则可能希望将 Roo 项目打包为 JAR 文件并使用它。本示例展示了如何打包\
  \ Roo 项目，以及 Roo 如何确保打包的 JAR 文件独立于 Roo 特定的注解和 AspectJ ITDs。\n\n### 准备工作\n\n退出 Roo\
  \ shell，并删除 `C:\\roo-cookbook\\ch02-recipes` 目录的内容。\n\n执行 `ch02_jsr303_fields.roo`\
  \ 脚本。它会创建一个 `flight-app` Roo 项目，并使用持久化设置命令将 Hibernate 设置为持久化提供程序。该脚本还会创建一个 `Flight`\
  \ 实体，该实体将 `FlightKey` 作为其复合主键类，并向 `Flight` 和 `FlightKey` 类添加字段。如果您使用的数据库不是 MySQL，或您的连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 `C:\\roo-cookbook\\ch02-recipes` 目录启动 Roo shell。\n\n### 操作步骤...\n\n要将 Roo 项目打包为\
  \ JAR 文件，请从 Roo shell 执行 `perform package` 命令：\n\n```\nroo> perform package\n```\n\
  \n```\n[INFO] -----------------------------------------------------------\n[INFO]\
  \ Building flight-app 0.1.0.BUILD-SNAPSHOT\n[INFO] -----------------------------------------------------------\n\
  ...\n[INFO] --- aspectj-maven-plugin:1.2:compile (default) @ flight-app ---\n...\n\
  [INFO] --- aspectj-maven-plugin:1.2:test-compile (default) @ flight-app ---\n...\n\
  [INFO] Building jar: ...\\target\\flight-app-0.1.0.BUILD-SNAPSHOT.jar\n[INFO] -----------------------------------------------------------\n\
  [INFO] BUILD SUCCESS\n[INFO] -----------------------------------------------------------\n\
  [INFO]\n```\n\n### 工作原理...\n\nperform package 命令使用 Maven 打包 Roo 项目。或者，您也可以使用 Maven\
  \ 的 mvn package 命令来打包 Roo 项目。需要注意的是，使用 perform package 命令时，Roo 项目中定义的测试不会被执行。\n\n\
  执行 perform package 的输出显示，AspectJ 编译器 Maven 插件用于编译 flight-app 项目的主 Java 类和测试 Java\
  \ 类。AspectJ 编译器 Maven 插件的 compile 目标会将 spring-aspects.jar 文件中定义的 AspectJ ITDs 和方面织入项目的主\
  \ Java 类中。test-compile 目标会将 spring-aspects.jar 文件中定义的 AspectJ ITDs 和方面织入项目的测试类中。\n\
  \nperform package 命令在 target 目录中创建 flight-app 项目的 JAR 文件。\n\n下图展示了 AspectJ 编译器 Maven\
  \ 插件如何通过织入适用于 Flight.java 类的 AspectJ ITDs 来创建 Flight.class 的示例：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_105_0.png)\n\
  \n图示表明，AspectJ 编译器 Maven 插件将 Flight_Roo_Configurable.aj、Flight_Roo_Entity.aj、Flight_Roo_JavaBean.aj\
  \ 和 Flight_Roo_ToString.aj AspectJ ITDs 织入 Flight.java 以创建 Flight.class。\n\n###\
  \ 更多内容...\n\n要验证生成的类文件是否包含相应 AspectJ ITDs 的声明，也可以使用 javap 命令。javap 命令会检查 .class\
  \ 文件，并输出构成类一部分的属性、方法和构造函数。\n\n要使用 javap，您需要先将 PATH 环境变量设置为指向 Java SE 安装目录的 bin 目录，如下所示：\n\
  \n```\nC:\\> set PATH=%PATH%;C:\\Program Files\\Java\\jdk1.6.0_23\\bin\n```\n\n\
  现在，转到包含 Roo 项目的目录（在我们的示例中为 ch02-recipes），并执行 javap 命令以查看编译后的 Flight 类的详细信息，如下所示：\n\
  \n```\nC:\\roo-cookbook\\ch02-recipes> javap -classpath target\\classes sample.roo.flightapp.domain.Flight\n\
  ```\n\n```\npublic class sample.roo.flightapp.domain.Flight ...\n{\ntransient javax.persistence.EntityManager\
  \ entityManager;\n...\npublic void clear();\npublic static long countFlights();\n\
  public static final javax.persistence.EntityManager\nentityManager();\npublic static\
  \ java.util.List findAllFlights();\n...\npublic void flush();\npublic java.lang.String\
  \ getCreatedBy();\npublic java.util.Date getCreatedDate();\npublic java.lang.String\
  \ getDestination();\npublic sample.roo.flightapp.domain.FlightKey getId();\npublic\
  \ java.lang.String getModifiedBy();\npublic java.util.Date getModifiedDate();\n\
  public java.lang.Integer getNumOfSeats();\npublic java.lang.String getOrigin();\n\
  public java.lang.Integer getVersion();\npublic sample.roo.flightapp.domain.Flight\
  \ merge();\npublic void persist();\npublic void remove();\n...\n}\n```\n\n输出显示，AspectJ\
  \ ITDs 中定义的方法现在已成为编译后的 *Flight* 类文件的一部分。\n\n### 另请参阅\n\n- 请参阅 *为持久化实体创建集成测试* 示例，以了解\
  \ Spring Roo 对 JPA 实体集成测试自动生成的支持。\n"
- "# 3 Spring Roo 中的高级 JPA 支持\n\n在本章中，我们将涵盖以下内容：\n\n- 查看候选动态查找器方法\n- 向实体添加动态查找器方法\n\
  - 在实体之间创建多对一（或一对一）关系\n- 在实体之间创建一对多（或多对多）关系\n- 创建映射超类\n- 自定义 Roo 生成的标识符定义\n- 生成数据库元数据\n\
  - 从数据库创建实体\n\n## 简介\n\n在上一章中，我们了解了 Spring Roo 如何简化使用 JPA 进行持久化的企业应用程序的开发。在本章中，我们将继续讨论\
  \ JPA，并探讨允许我们添加动态查找器方法、在实体之间创建关系以及执行数据库反向工程以自动生成 JPA 实体的示例。\n\n## 查看候选动态查找器方法\n\n\
  动态查找器方法是一种无需编写 JPA 查询的查找器方法。它根据实体类的一个或多个持久化字段从数据库中获取实例。当您将动态查找器方法的名称添加到持久化实体时，Roo\
  \ 会自动生成这些方法的实现。由于 Roo 不会为应用程序创建 DAO 层，因此动态查找器方法定义在实体类中。在本示例中，我们将探讨 finder list 命令，该命令会内省持久化实体，并建议可以添加到给定持久化实体的可能动态查找器方法的名称。\n\
  \n### 准备工作\n\n在 C:\\roo-cookbook 目录内创建一个名为 ch03-recipes 的子目录。\n\n执行 ch03_persistent_entities.roo\
  \ 脚本以创建 flight-app Roo 项目。该脚本将 Hibernate 设置为持久化提供程序，并创建一个 Flight 实体，该实体将 FlightKey\
  \ 作为其复合主键类。此外，该脚本还会向 Flight 和 FlightKey 类添加字段。如果您使用的数据库不是 MySQL，或您的连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 C:\\roo-cookbook\\ch03-recipes 目录启动 Roo shell。\n\n### 操作步骤...\n\n要使用 finder\
  \ list 命令查看动态查找器方法，请按照以下步骤操作：\n\n- 1. 使用 focus 命令将后续命令的焦点设置在 Flight 实体上：\n  ```\n\
  \  roo> focus --class ~.domain.Flight\n  ```\n\n- 2. 执行 finder list 命令以查看 Flight\
  \ 实体的候选动态查找器方法列表，如下所示：\n  ```\n  ~.domain.Flight roo> finder list\n  .....\n  findFlightsByCreatedDateBetween(Date\
  \ minCreatedDate, Date maxCreatedDate)\n  findFlightsByCreatedDateGreaterThan(Date\
  \ createdDate)\n  .....\n  findFlightsByDestination(String destination)\n  findFlightsByDestinationEquals(String\
  \ destination)\n  findFlightsByDestinationIsNotNull()\n  findFlightsByDestinationIsNull()\n\
  \  findFlightsByDestinationLike(String destination)\n  findFlightsByDestinationNotEquals(String\
  \ destination)\n  ```\n\n### 工作原理...\n\nfinder list 命令显示实体的候选动态查找器方法名称。默认情况下，finder\
  \ list 命令建议的动态查找器方法仅根据实体的一个持久化字段搜索实例。例如，在 finder list 命令的输出中，您不会找到一个动态查找器方法名称，该方法同时根据\
  \ createdDate 和 modifiedDate 字段查找 Flight 实体实例。如果实体继承自映射超类，则 Roo 也会显示与继承字段对应的动态查找器方法。\n\
  \nfinder list 命令建议的动态查找器方法取决于字段的类型。例如，createdDate 是 java.util.Date 类型，可以参与大于、小于和范围比较；因此，findFlightsByCreatedDateBetween、findFlightsByCreatedDateGreaterThan\
  \ 等显示为候选动态查找器方法，这些方法接受 createdDate 字段作为参数。另一方面，destination 字段是 String 类型，不参与大于、小于和范围比较；因此，Roo\
  \ 不会建议基于 destination 字段的大于、小于和范围比较来查找 Flight 实例的动态查找器方法。\n\n### 更多内容...\n\n现在让我们来看看如何指示\
  \ Roo：\n\n- 提供基于多个持久化字段获取实体的候选动态查找器方法列表\n- 根据筛选条件限制建议的动态查找器方法名称\n\n## 列出多个持久化字段的动态查找器方法\n\
  \n如果您希望 Roo 列出基于多个持久化字段获取实体的查找器方法名称，则应使用 finder list 命令的 depth 参数。depth 参数接受一个数值，该数值决定动态查找器方法用于在数据库中搜索实体的持久化字段数量。例如，如果您希望根据\
  \ origin 和 destination 字段两者来搜索 Flight 实例，则 depth 参数的值必须为 2。depth 参数的默认值为 1，因此，当我们执行\
  \ finder list 命令而未指定 depth 参数时，它列出了仅基于一个持久化字段获取实体的动态查找器方法名称。以下 finder list 命令展示了\
  \ depth 参数对建议的动态查找器方法名称列表的影响：\n\n```\n~.domain.Flight roo> finder list --depth 2\n\
  findFlightsByDestinationAndOrigin(String destination, String origin)\n```\n\n\n\n\
  \n\nfindFlightsByDestinationAndOriginEquals(String destination, String origin)\n\
  .....\n\n正如输出所示，两个持久字段现在构成列出的候选动态查找器方法名称的一部分。同样，如果您希望查找器跨越多个持久字段，请将 n 指定为 depth\
  \ 参数的值。\n\n## 基于过滤条件限制动态查找器方法列表\n\n随着 depth 参数值的增加，Roo 列出的候选动态查找器方法名称数量会因方法参数的可能组合而呈指数级增长。在这种情况下，需要根据过滤条件筛选候选动态查找器方法名称。finder\
  \ list 命令提供一个 filter 参数，它接受一个逗号分隔的字符串列表，这些字符串必须出现在动态查找器方法名称中。不包含 filter 参数指定字符串的动态查找器方法名称将从显示的候选动态查找器方法名称列表中省略。这使您能够轻松定位想要添加到持久实体的动态查找器方法。\n\
  \n> 请注意，作为 filter 参数值指定的逗号分隔字符串列表中不应包含空格。\n\n以下 finder list 命令展示了 filter 参数的用法：\n\
  \n```\n~.domain.Flight roo> finder list --depth 2 --filter destinationlike,originlike\n\
  ```\n\n```\nfindFlightsByDestinationLikeAndOriginLike(...)\nfindFlightsByDestinationLikeOrOriginLike(...)\n\
  findFlightsByOriginLikeAndDestinationLike(...)\nfindFlightsByOriginLikeOrDestinationLike(...)\n\
  ```\n\n输出现在仅显示包含 filter 参数中指定文本的四个方法。同样，您可以向 filter 参数添加更多文本，以缩小 finder list 命令显示的候选动态查找器方法名称列表。\n\
  \n## 另请参阅\n\n- 请参阅下方的“将动态查找器方法添加到实体”教程，了解 Spring Roo 如何简化将动态查找器方法添加到实体。\n\n## 将动态查找器方法添加到实体\n\
  \nfinder list 命令显示 Roo 可以自动生成其实现的候选动态查找器方法名称。在本教程中，我们将学习如何使用 finder add 命令将动态查找器方法添加到持久实体。作为示例，我们将向\
  \ Flight 实体添加 findFlightsByDestinationLikeAndOriginLike 方法。\n\n### 准备工作\n\n请参阅“查看候选动态查找器方法”教程，以创建\
  \ flight-app Roo 项目。\n\n从 C:\\\\roo-cookbook\\\\ch03-recipes 目录启动 Roo shell。\n\n\
  ### 具体操作...\n\n要添加动态查找器方法，请按照给定步骤操作：\n\n- 1. 使用 focus 命令将后续命令的焦点设置为 Flight 实体：\n\
  \  \n  roo> focus --class ~.domain.Flight\n\n- 2. 使用 finder add 命令将 findFlightsByDestinationLikeAndOriginLike\
  \ 动态查找器方法添加到 Flight 实体：\n  \n  roo> finder add findFlightsByDestinationLikeAndOriginLike\n\
  \  \n  Updated SRC_MAIN_JAVA\\\\sample\\\\roo\\\\flightapp\\\\domain\\\\Flight.java\n\
  \  Created SRC_MAIN_JAVA\\\\sample\\\\roo\\\\flightapp\\\\domain\\\\Flight_Roo_Finder.aj\n\
  \n### 工作原理...\n\nfinder add 命令将动态查找器方法实现添加到持久实体。此功能省去了为查找器方法编写 JPA-QL 查询的工作。finder\
  \ add 命令将查找器方法名称添加到 @RooEntity 注解的 finders 属性中（有关详细信息，请参阅第 2 章）。@RooEntity 注解中 finders\
  \ 属性的存在将触发 *_Roo_Finder.aj ITD 文件的创建（如果实体中尚未存在该文件），并在 *_Roo_Finder.aj ITD 文件中自动生成查找器方法实现。\
  \ *_Roo_Finder.aj 将查找器方法实现添加到相应的 JPA 实体类中。\n\n以下图展示了执行 finder add 命令时 Roo 如何将动态查找器方法添加到\
  \ JPA 实体中：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_114_0.png)\n\n给出的图显示，当执行\
  \ `finder add xyz` 命令时，Roo 的 **查找器插件** 将 `xyz` 方法名称添加到 `Flight.java` 文件中 `@RooEntity`\
  \ 注解的 `finders` 属性。由于 Spring Roo 会监视带有 Roo 注解的 Java 文件，Roo 使用查找器插件将 `xyz` 动态查找器方法实现添加到\
  \ `Flight_Roo_Finder.aj` 文件中。如果 `Flight_Roo_Finder.aj` 不存在，查找器插件将创建它。现在，如果您在 `Flight.java`\
  \ 文件中定义了 `xyz` 方法（因为您可能希望自定义 Roo 生成的 `xyz` 方法的实现），查找器插件会将其从 `Flight_Roo_Finder.aj`\
  \ 文件中删除。\n\n执行 `finder add` 命令后，以下代码显示了 `Flight` 实体的修改后的 `@RooEntity` 注解：\n\n```\n\
  @RooEntity(identifierType = FlightKey.class,\ntable = \"FLIGHT_TBL\",\nfinders =\
  \ { \"findFlightsByDestinationLikeAndOriginLike\"})\npublic class Flight { ... }\n\
  ```\n\n以下代码显示了 `Flight_Roo_Finder.aj` 文件中 `findFlightsByDestinationLikeAndOriginLike`\
  \ 查找器方法的自动生成实现：\n\n```\nimport javax.persistence.EntityManager;\nimport javax.persistence.TypedQuery;\n\
  ...\npublic static TypedQuery<Flight>\nFlight.findFlightsByDestinationLikeAndOriginLike(\n\
  String destination, String origin)\n{\nif (destination == null || destination.length()\
  \ == 0)\nthrow new IllegalArgumentException(\"The destination\nargument is required\"\
  );\n...\nif (origin == null || origin.length() == 0)\nthrow new IllegalArgumentException(\"\
  The origin argument\nis required\");\n...\nEntityManager em = Flight.entityManager();\n\
  TypedQuery<Flight> q = em.createQuery(\"SELECT Flight FROM\nFlight AS flight WHERE\
  \ LOWER(flight.destination) LIKE\nLOWER(:destination) AND LOWER(flight.origin) LIKE\n\
  LOWER(:origin)\", Flight.class);\nq.setParameter(\"destination\", destination);\n\
  q.setParameter(\"origin\", origin);\nreturn q;\n}\n```\n\n给出的代码显示以下内容：\n\n- 查找器方法期望\
  \ `origin` 和 `destination` 参数都必须提供给查找器方法，否则会抛出异常。一般来说，Roo 生成的动态查找器方法实现要求传递给方法的参数不是\
  \ `null`。如果参数类型是 `String`，则动态查找器方法实现要求该参数不能是 `null` 或空白，如本代码所示。\n- 查找器方法的 JPA-QL\
  \ 是自动生成的。\n- 查找器方法的返回类型是 `javax.persistence.TypedQuery<Flight>`。您可以从 Web 控制器类调用\
  \ `TypedQuery` 对象的 `getResultList` 方法来执行 `SELECT` 查询并获取结果。\n\n### 更多内容...\n\n现在让我们来看看如何将自定义查找器方法添加到实体、对动态查找器方法进行集成测试，以及使用\
  \ @RooEntity 注解触发动态查找器方法实现的自动生成：\n\n## 添加自定义查找器方法\n\n如果 Roo 提供的动态查找器方法无法满足您的应用程序要求，您可能需要添加自定义查找器方法。在这种情况下，您可以执行\
  \ Roo 生成的动态查找器方法的 push-in 重构，并在相应的持久实体 Java 类中修改其实现（而不是名称或签名）；也可以在持久实体 Java 类中定义该方法（这会导致该方法从\
  \ *_Roo_Finder.aj AspectJ ITD 中被删除）；或者您可以创建自己的 AspectJ ITD，将自定义查找器方法引入持久实体 Java\
  \ 类中。\n\n如果要更改动态查找器方法的实现，可以使用 push-in 重构，也可以在持久实体 Java 类中定义该方法。使用 push-in 重构或在持久实体\
  \ Java 类中定义方法的效果是相同的。在 push-in 重构中，您使用 IDE 将 AspectJ ITD 文件中的声明移动到目标 Java 类，然后对其进行修改。如果您决定在\
  \ Java 类本身中定义该方法，则可能会将 AspectJ ITD 中的方法复制粘贴到 Java 类，并让 Roo 从 AspectJ ITD 中删除该方法声明。\n\
  \n以下图展示了使用 push-in 重构将 AspectJ ITD 中的方法声明移动到目标 Java 类时发生的情况：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_116_0.png)\n\
  \n给出的图显示，当您对 findFlightsByDestinationLikeAndOriginLike 方法执行 push-in 重构时，IDE 会简单地将该方法从\
  \ AspectJ ITD 文件移动到目标 Flight.java 类。因此，如果您需要通过在 Flight.java 类中编写来自定义 findFlightsByDestinationLikeAndOriginLike\
  \ 等方法，那么执行 push-in 重构或简单地将该方法从 AspectJ ITD 文件复制并粘贴到 Flight.java 类中（随后删除方法名前缀的 Flight.）会更加简单。如果您打算将所有\
  \ AspectJ ITD 中的所有声明移动到目标 Java 类中，那么从 AspectJ ITD 复制粘贴到目标 Java 类并不高效。这时 push-in\
  \ 重构就非常有用，我们将在第 7 章“开发插件和从项目中移除 Roo”中看到。\n\n\n\n\n如果要添加自定义查找器方法，且其名称或签名与 Roo 提供的动态查找器方法不同，则可以在持久实体\
  \ Java 类中定义该方法，也可以创建新的 AspectJ ITD 并在其中声明你的方法。这两种方法都可以，具体取决于你编写 AspectJ ITD 的熟悉程度。Roo\
  \ 生成 AspectJ ITD，以便将横切关注点与 Java 类分离。因此，如果你觉得在持久实体 Java 类中编写查找器方法会污染该类，则应该考虑编写 AspectJ\
  \ ITD。需要注意的是，你在项目中创建的自定义 AspectJ ITD 不由 Roo 管理。\n\n以下代码展示了 Flight_MyCustom_Finder.aj\
  \ AspectJ ITD 的示例，它将 searchFlights(SearchCriteria criteria) 查找器方法引入 Flight.java\
  \ 中：\n\n```\nimport javax.persistence.EntityManager;\nimport javax.persistence.TypedQuery;\n\
  \nprivileged aspect Flight_MyCustom_Finder {\n\n    public static TypedQuery<Flight>\
  \ Flight.searchFlight (\n            SearchCriteria criteria) {\n        EntityManager\
  \ em = Flight.entityManager();\n        TypedQuery<Flight> q = em.createQuery(\"\
  SELECT Flight ..\",\n                Flight.class);\n        q.setParameter(\"destination\"\
  , criteria.getDestination());\n        q.setParameter(\"origin\", criteria.getOrigin());\n\
  \        return q;\n    }\n\n}\n```\n\n如给定代码所示，你可以创建自己的 AspectJ ITD 并向 JPA 实体添加自定义查找器方法。由于自定义\
  \ AspectJ ITD 不由 Roo 管理，如果在 Flight.java 类中创建 searchFlight 方法，Roo 不会从 Flight_MyCustom_Finder.aj\
  \ 文件中将其移除。\n\n## 动态查找器方法的集成测试\n\nRoo 不会为自动生成的动态查找器方法创建集成测试。要测试查找器方法，请在持久实体对应的 *IntegrationTest.java\
  \ 文件中编写测试方法。\n\n## 通过 @RooEntity 注释添加动态查找器\n\n@RooEntity 注释接受 finders 属性，该属性包含字符串值数组，用于标识必须为持久实体生成的动态查找器方法名称。finders\
  \ add 命令将查找器方法名称添加到 finders 属性中，从而导致 Roo 生成动态查找器方法。由于将查找器方法名称添加到 finders 属性会触发动态查找器方法实现的生成，因此不使用\
  \ finder add 命令，你可以直接使用 IDE 将查找器方法名称添加到 finders 属性中，这将触发 Roo 生成查找器方法实现。\n\n## 另请参阅\n\
  \n- 请参阅第 2 章（使用 JPA 持久化对象）中“控制持久实体自动生成的方法”配方，了解 @RooEntity 注释支持的更多元素\n- 请参阅“查看候选动态查找器方法”配方，了解如何使用\
  \ finder list 命令显示候选动态查找器方法的名称\n\n## 在实体之间创建多对一（或一对一）关系\n\n在实际应用中，域实体之间存在关系。在本节中，我们将探讨\
  \ Roo 如何简化在 JPA 实体之间创建多对一（或一对一）关系。\n\n以下图示展示了 FLIGHT_TBL 和 FLIGHT_DESC_TBL 表之间的关系，我们将以此作为建模多对一关系的参考：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_118_0.png)\n\n在给定的图中，FLIGHT_TBL 表包含计划航班详细信息，FLIGHT_DESC_TBL\
  \ 表包含航空公司提供的所有航班详细信息。FLIGHT_TBL 表中的每条记录都指向恰好一条 FLIGHT_DESC_TBL 记录。由于一个城市到另一个城市可能有多个航班，因此\
  \ FLIGHT_TBL 和 FLIGHT_DESC_TBL 之间的关系是多对一。FLIGHT_TBL 表通过 FLIGHT_DESC_ID 外键映射到 FLIGHT_DESC_TBL\
  \ 表。预期如果删除 FLIGHT_TBL 记录，则删除仅限于 FLIGHT_TBL。\n\n以下图示展示了与 FLIGHT_TBL 和 FLIGHT_DESC_TBL\
  \ 表对应的 JPA 实体：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_119_0.png)\n\n在给定的图中，flightId\
  \ 和 flightDescId 属性分别表示 Flight 和 FlightDescription JPA 实体的主键。\n\n## 准备工作\n\n退出 Roo\
  \ shell，删除 C:\\roo-cookbook\\ch03-recipes 目录的内容。\n\n从 C:\\roo-cookbook\\ch03-recipes\
  \ 目录启动 Roo shell。\n\n执行 ch03_jpa_setup.roo 脚本，该脚本创建 flight-app Roo 项目，将 Hibernate\
  \ 设置为持久化提供程序，并将 MySQL 配置为应用程序的数据库。如果你使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，则相应地修改脚本。\n\n\
  ## 操作步骤\n\n要创建具有多对一关系的 Flight 和 FlightDescription JPA 实体，请执行以下步骤：\n\n- 1. 创建与 FLIGHT_TBL\
  \ 表对应的 Flight JPA 实体（包括集成测试）：\n  ```\n  roo> entity --class ~.domain.Flight --identifierColumn\
  \ FLIGHT_ID\n  --identifierField flightId --identifierType java.lang.Long\n  --table\
  \ FLIGHT_TBL --testAutomatically\n  ```\n\n- 2. 向 Flight 实体添加属性：\n  ```\n  roo>\
  \ field date --type java.util.Date --fieldName departureDate --column DEPARTURE_DATE\n\
  \  roo> field date --type java.util.Date --fieldName arrivalDate --column ARRIVAL_DATE\n\
  \  ```\n\n- 3. 创建与 FLIGHT_DESC_TBL 表对应的 FlightDescription 实体（包括集成测试）：\n  ```\n \
  \ roo> entity --class ~.domain.FlightDescription\n  --identifierColumn FLIGHT_DESC_ID\
  \ --identifierField flightDescId\n  --identifierType java.lang.Long --table FLIGHT_DESC_TBL\n\
  \  --testAutomatically\n  ```\n\n- 4. 向 FlightDescription 实体添加属性：\n  ```\n  roo>\
  \ field string --fieldName origin --column ORIGIN_CITY --notNull\n  roo> field string\
  \ --fieldName destination --column DESTINATION_CITY --notNull\n  roo> field number\
  \ --type java.lang.Float --fieldName price --column PRICE --notNull\n  ```\n\n-\
  \ 5. 将 Roo 命令的焦点设置到 Flight 实体，并使用 field reference 命令在 Flight 和 FlightDescription\
  \ 实体之间创建多对一关系，如下所示：\n  ```\n  roo> focus --class ~.domain.Flight\n  roo> field reference\
  \ --fieldName flightDescription --type ~.domain.FlightDescription --joinColumnName\
  \ FLIGHT_DESC_ID --notNull\n  ```\n\n## 工作原理\n\n由于我们未为实体使用复合主键，在使用用于创建 Flight 和\
  \ FlightDescription 实体的实体命令时，你会注意到以下几点：\n\n- identifierField：使用了一个可选参数，为实体的标识符字段指定自定义名称。例如，Flight\
  \ 实体的标识符字段名为 flightId，FlightDescription 实体的标识符字段名为 flightDescId。如果未使用 identifierField\
  \ 参数，则默认情况下 Roo 会将 id 分配为实体的标识符字段名。\n\n- identifierColumn：使用了一个可选参数，用于设置标识符字段映射到的表列名称。该参数指示\
  \ Roo 向标识符字段添加 @Column JPA 注释。如果未指定 identifierColumn，默认情况下，映射列的名称是通过拆分驼峰命名并添加下划线作为分隔符来得出的。例如，如果为名为\
  \ myOwnIdField 的标识符字段未指定 identifierColumn 参数，则表列名默认为 my_own_id_field。在本配方的上下文中，identifierColumn\
  \ 不会产生任何影响，因为从标识符字段名得出的表列名与 identifierColumn 参数指定的名称相同。\n\n\n\n\n以下代码片段来自 `Flight.java`\
  \ 文件，展示了在本示例中创建的 `Flight` 实体：\n\n```\n@RooJavaBean\n@RooToString\n@RooEntity(identifierField\
  \ = \"flightId\", identifierColumn = \"FLIGHT_ID\", table = \"FLIGHT_TBL\")\npublic\
  \ class Flight {\n    ...\n}\n```\n\n给定代码显示，`@RooEntity` 注解包含了我们在 entity 命令中为这些参数指定的值的\
  \ `identifierField`、`identifierColumn` 和 `table` 属性。如在 *第 2 章，使用 JPA 持久化对象* 中 *使用\
  \ JPA 创建持久化实体* 示例所述，`@RooEntity` 注解的元素用于生成相应的 `*_Roo_Entity.aj` AspectJ ITD。以下代码展示了在\
  \ `Flight_Roo_Entity.aj` AspectJ ITD 中定义的标识符字段：\n\n```\nprivileged aspect Flight_Roo_Entity\n\
  {\n    .....\n    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n   \
  \ @Column(name = \"FLIGHT_ID\")\n    private Long Flight.flightId;\n    .....\n\
  }\n```\n\n在此代码中，标识符字段带有 `@Column` 注解，因为 `@RooEntity` 注解中存在 `identifierColumn` 参数。标识符字段的名称\
  \ `flightId` 源自 `@RooEntity` 注解中 `identifierField` 参数的值。\n\n现在，我们来看看 `field reference`\
  \ 命令，该命令用于添加引用关系中另一个对象的属性。在下一个示例中，`field reference` 命令为 `Flight` 类添加了对 `FlightDescription`\
  \ 对象的引用。由于 `field reference` 仅定义对相关对象的引用，您可以认为它定义了 *多对一* 关系中的 *多* 端。\n\n`field reference`\
  \ 命令与 `field other`（如 *第 1 章，Spring Roo 入门* 中 *为 Java 类添加属性* 示例所述）命令相似，因为这两个命令都用于定义对自定义\
  \ Java 对象的引用。唯一的区别在于，`field reference` 命令专门用于定义实体之间的 JPA 关系。以下来自 `Flight.java` 的代码展示了执行\
  \ `field reference` 命令后引入的代码：\n\n```\n@NotNull\n@ManyToOne\n@JoinColumn(name = \"\
  FLIGHT_DESC_ID\")\nprivate FlightDescription flightDescription;\n```\n\n从给定代码可以看出，field\
  \ reference 命令已在 Flight 和 FlightDescription 实体之间添加了多对一 JPA 关系。\n\n下表描述了可以传递给 field\
  \ reference 命令的参数：\n\n| 参数 | 描述 |\n|---|---|\n| fieldName (必填) | 引用相关实体的属性名称。在我们的示例中，flightDescription\
  \ 是属性的名称。 |\n| type (必填) | 相关实体的类型。在我们的示例中，FlightDescription 是相关实体的类型。 |\n| joinColumnName\
  \ | 作为相关实体 *外键* 的列。在我们的示例中，FLIGHT_DESC_ID 是 FLIGHT_TBL（由 Flight JPA 实体表示）中的列，它充当指向\
  \ FLIGHT_DESCRIPTION_TBL 表（由 FlightDescription JPA 实体表示）的外键。 |\n| cardinality |\
  \ JPA 实体之间关系的基数。默认情况下，基数为 MANY_TO_ONE。如果要创建一对一关系，则将 cardinality 参数的值指定为 ONE_TO_ONE。\
  \ |\n| fetch | 相关实体的 JPA 获取策略。可能的值为 EAGER 和 LAZY。*获取* 参数的值转换为 @ManyToOne 或 @OneToOne\
  \ 注解中 *获取* 元素的值。 |\n| referencedColumnName | 标识此连接列关联到的相关实体表中的列。此参数的值用作 @JoinColumn\
  \ JPA 注解中 *引用列名* 属性的值。 |\n\n> 尽管 Roo shell 将 MANY_TO_ONE、MANY_TO_MANY、ONE_TO_MANY\
  \ 和 ONE_TO_ONE 显示为 field reference 命令中 cardinality 参数的可能值，但它只接受 MANY_TO_ONE 和 ONE_TO_ONE。这样做的原因是，field\
  \ reference 仅在一对一关系或实体位于多对一关系的多一端时才有意义。\n\n## 更多内容...\n\n### 测试参与关系的 JPA 实体\n\n\
  测试参与关系的实体有时会变得棘手，因为集成测试可能无法检查关系约束。例如，FlightDescriptionIntegrationTest 的 testRemove\
  \ 方法（请参阅 FlightDescriptionIntegrationTest_Roo_IntegrationTest.aj AspectJ ITD）不测试一个或多个\
  \ Flight 实体实例与正在移除的 FlightDescription 实例相关联的场景。\n\n要有效地测试参与关系的实体，您可能需要修改自动生成的测试方法和按需数据类。例如，在我们的示例场景中，FlightDescription\
  \ 的按需数据类（请参阅在 FlightDescriptionDataOnDemand_Roo_DataOnDemand.aj AspectJ ITD 中定义的\
  \ getNewTransientFlightDescription 方法）仅创建 FlightDescription 实例，而不创建任何关联的 Flight\
  \ 实例。因此，testRemove 方法将永远无法测试一个或多个 Flight 实例与正在移除的 FlightDescription 实例相关联的场景。因此，要对\
  \ FlightDescription 实例进行有效测试，您需要执行以下操作：\n\n- 在 FlightDescriptionDataOnDemand.java\
  \ 类中定义 getNewTransientFlightDescription 方法，该方法创建与一个或多个 Flight 实例关联的 FlightDescription\
  \ 对象\n- 在 FlightDescriptionIntegrationTesting 类中定义 testRemove 方法，在尝试移除 FlightDescription\
  \ 实例之前先移除所有相关的 Flight 实例\n\n如果实体不相关，则按需数据类相互独立。但是，如果实体相关，则创建测试数据会变得有些复杂。例如，Flight\
  \ 实体与 FlightDescription 具有多对一关系；这意味着 Flight 实体的按需数据类应在 FLIGHT_TBL 表中创建记录，这些记录对 FLIGHT_DESC_TBL\
  \ 表记录具有外键引用。必须为 FLIGHT_TBL 表中的 Flight 记录分配外键引用，因为 FlightDescription 关系带有 @NotNull\
  \ 注解。\n\n现在问题在于，`Flight` 实体的按需数据类如何发现 `FlightDescription` 实例（这些实例由 `FlightDescriptionDataOnDemand_Roo_DataOnDemand.aj`\
  \ AspectJ ITD 的 `getNewTransientFlightDescription` 方法在 `FLIGHT_DESC_TBL` 表中创建），以便\
  \ `FLIGHT_TBL` 中的 `Flight` 实例（由 `FlightDataOnDemand_Roo_DataOnDemand.aj` AspectJ\
  \ ITD 的 `getNewTransientFlight` 方法创建）可以指定对 `FlightDescription` 实例的外键引用？很简单！可以通过使用\
  \ `FlightDescription` 实体的按需数据类来实现，因为它维护了在 `FLIGHT_DESC_TBL` 表中创建的记录列表。Spring Roo\
  \ 在生成按需数据类时正是如此——它在相关实体的按需数据类之间创建依赖关系以创建测试数据。\n\n以下来自 `FlightDataOnDemand_Roo_DataOnDemand.aj`\
  \ 文件的代码展示了 `Flight` 按需数据类：\n\n```\nprivileged aspect FlightDataOnDemand_Roo_DataOnDemand\n\
  {\n    ...\n\n    @Autowired\n    private FlightDescriptionDataOnDemand flightDescriptionDataOnDemand;\n\
  \n    public Flight getNewTransientFlight(int index)\n    {\n        sample.roo.flightapp.domain.Flight\
  \ obj =\n            new sample.roo.flightapp.domain.Flight();\n\n        obj.setArrivalDate(obj,\
  \ index);\n        obj.setDepartureDate(obj, index);\n        obj.setFlightDescription(obj,\
  \ index);\n        return obj;\n    }\n\n    private void setFlightDescription(Flight\
  \ obj, int index) {\n        sample.roo.flightapp.domain.FlightDescription flightDescription\
  \ = flightDescriptionDataOnDemand.getRandomFlightDescription();\n        obj.setFlightDescription(flightDescription);\n\
  \    }\n\n    ...\n}\n```\n\n\n\n\n\n> 在给定的代码中，`FlightDescriptionDataOnDemand` 对象被自动注入到\
  \ `FlightDataOnDemand` 对象中。由于 `Flight` 实体与 `FlightDescription` 实体具有多对一关系，`Flight`\
  \ 实体的按需数据类使用 `FlightDescription` 的按需数据类来获取现有 `FlightDescription` 实例的引用，并将其设置在 `Flight`\
  \ 实例中。这确保了在多对一关系的集成测试期间创建的测试数据与相关实体之间存在的关系一致。\n\n需要注意的是，`@NotNull` 和 `@ManyToOne(...,\
  \ optional=false)` 具有相同的含义。可以通过使用 `@NotNull`（JSR 303：Bean Validation 注解）或将 `@ManyToOne`\
  \ JPA 注解的 `optional` 元素的值指定为 `false`，来指定实体之间必须存在关系。在这两种情况下，实体的按需数据类都将确保使用相关实体的按需数据类，对集成测试中创建的测试数据强制执行外键约束。\n\
  \n### 多对一关系字段的动态查找器方法\n\n与其他持久字段一样，你可以使用 `finder list` 和 `finder add` 命令来查看和添加与关系字段对应的查找器方法。例如，如果针对\
  \ `Flight` 实体执行 `finder list` 命令，则其中一个查找器是针对 `flightDescription` 关系字段的，如下所示：\n\n\
  ```\n~.domain.Flight roo> finder list\n```\n\n```\n..\n```\n\n```\nfindFlightsByFlightDescription(FlightDescription\
  \ flightDescription)\n```\n\n此外，你可以使用 `finder list` 命令的 `depth` 参数，查看基于实体的关系字段和其他持久字段的动态查找器方法。\n\
  \n### 另请参阅\n\n- 后续的“在实体之间创建一对多（或多对多）关系”示例\n\n## 在实体之间创建一对多（或多对多）关系\n\n在上一个示例中，我们了解了如何使用\
  \ `field reference` 命令在实体之间建立多对一（或一对一）关系。在本示例中，我们将扩展相同的示例，展示如何使用 `field set` 命令创建一对多（或多对多）关系。以下类图显示了\
  \ `FlightDescription` 和 `Flight` 实体之间的一对多关系：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_126_0.png)\n\
  \n在给定的图中，你会注意到我们已将类型为 `Set<Flight>` 的 `flights` 字段添加到 `FlightDescription` 实体，反映了\
  \ `FlightDescription` 和 `Flight` 实体之间的一对多关系。\n\n### 准备工作\n\n退出 Roo shell 并删除 `C:\\\
  roo-cookbook\\ch03-recipes` 目录的内容。\n\n从 `C:\\roo-cookbook\\ch03-recipes` 目录启动 Roo\
  \ shell。\n\n执行 `ch03_relationship_many_to_one.roo` 脚本，该脚本将创建 `flight-app` Roo 项目，设置\
  \ Hibernate 作为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 `Flight` 和 `FlightDescription` JPA\
  \ 实体，并定义 `Flight` 和 `FlightDescription` 实体之间的多对一关系。如果你使用的数据库不是 MySQL 或你的连接设置与脚本中指定的不同，则相应地修改脚本。\n\
  \n### 操作步骤\n\n要在 `FlightDescription` 和 `Flight` 实体之间创建一对多（或多对多）关系，请按照此处给出的步骤操作：\n\
  \n- 1. 将 Roo 命令的焦点设置在 `FlightDescription` 实体上：\n\n```\n.. roo> focus --class ~.domain.FlightDescription\n\
  ```\n\n- 2. 使用 field set 命令在 FlightDescription 和 Flight 实体之间创建一对多关系：\n\n```\n~.domain.FlightDescription\
  \ roo> field set --fieldName flights --type ~.domain.Flight --cardinality ONE_TO_MANY\
  \ --mappedBy flightDescription\n```\n\n### 工作原理\n\nfield set 命令用于在实体内创建一对多 JPA 关系的多方。如果两个实体之间的关系是多对多，则\
  \ field set 命令用于关系中的两个实体。以下表格描述了可以为 field set 命令指定的一些重要参数：\n\n| 参数 | 说明 |\n| :---\
  \ | :--- |\n| fieldName (必填) | 要添加到实体的关系字段的名称。该字段的类型为 `java.util.Set`。在我们的示例中，fieldName\
  \ 参数指定为 `flights`，这会在 `FlightDescription` 实体中添加一个名为 `flights` 的字段。 |\n| type (必填)\
  \ | 标识 fieldName 参数所定义的 Set 中包含的相关实体（即一对多关系中多方）的类型。在我们的示例中，type 值指定为 `~.domain.Flight`，这意味着\
  \ Set（由 fieldName 参数定义）包含类型为 `Flight` 的元素，如下所示：`private Set<Flight> flights = new\
  \ HashSet<Flight>()`； |\n| mappedBy | mappedBy 参数的值指的是关系的所有者。它转换为 JPA `@OneToMany`\
  \ 或 `@ManyToMany` 注解的 mappedBy 元素的值。在我们的示例中，mappedBy 参数的值是 `flightDescription`；因此，field\
  \ set 命令创建的 `flights` 字段带有 `@OneToMany` 注解，其 mappedBy 属性值为 `flightDescription`。\
  \ |\n| cardinality | JPA 实体之间关系的基数。默认情况下，基数为 `MANY_TO_MANY`。由于我们希望在 `FlightDescription`\
  \ 和 `Flight` 实体之间创建一对多关系，因此 cardinality 参数的值指定为 `ONE_TO_MANY`。 |\n| fetch | 相关实体的\
  \ JPA 获取策略。可能的值为 `EAGER` 和 `LAZY`。fetch 参数的值转换为 `@ManyToMany` 或 `@OneToMany` 注解的\
  \ fetch 元素的值。 |\n\n> 尽管 Roo shell 将 `MANY_TO_ONE`、`MANY_TO_MANY`、`ONE_TO_MANY` 和\
  \ `ONE_TO_ONE` 显示为 field set 命令的 cardinality 参数的可能值，但它仅接受 `MANY_TO_MANY` 和 `ONE_TO_MANY`。原因是：field\
  \ set 仅在多对多关系的情况或实体位于一对多关系的一方时才有意义。\n\n在 `FlightDescription` 实体上执行 field set 命令后，会向其添加以下字段：\n\
  \n```\n@OneToMany(cascade = CascadeType.ALL,\n       mappedBy=\"flightDescription\"\
  )\nprivate Set<Flight> flights = new HashSet<Flight>() ;\n```\n\n给定的代码显示，field set\
  \ 命令只是向实体添加一个关系字段。\n\n### 更多内容\n\nfield set 和 field reference 命令不提供指定应用于相关实体的级联效果的选项。命令的行为如下所述：\n\
  \n- 使用 field set 命令创建的带有 `@ManyToMany` 或 `@OneToMany` 注解的 JPA 关系字段，其 cascade 元素的值为\
  \ `CascadeType.ALL`，这意味着 refresh、persist、merge 等实体操作会被传播到相关实体。\n- 使用 field reference\
  \ 命令创建的带有 `@ManyToOne` 和 `@OneToOne` 注解的 JPA 关系字段未指定 cascade 元素，这意味着 refresh、persist、merge\
  \ 等实体操作不会被传播到关联实体。\n\n在需要指定级联效果的场景中，你可以修改 Java 源文件中的相应 JPA 注解。\n\n### 另请参阅\n\n-\
  \ 请参阅“在实体之间创建多对一（或一对一）关系”示例，了解如何使用 field reference 命令来创建多对一（或一对一）关系\n\n## 创建映射超类\n\
  \n在本示例中，我们将了解如何创建继承 *映射超类* 的实体。映射超类的字段存储到继承实体所映射的表中。映射超类本身 *不* 映射到任何表。在本示例中，我们将创建\
  \ *Flight* 实体，它扩展 *AuditFields* 类。*AuditFields* 类代表一个 *映射超类*；*AuditFields* 的字段存储到\
  \ *Flight* 实体所映射的表中。\n\n以下图显示了 *Flight* 实体与 *AuditFields* 映射超类之间的关系：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_129_0.png)\n\
  \n### 准备工作\n\n退出 Roo shell 并删除 `C:\\roo-cookbook\\ch03-recipes` 目录的内容。\n\n从 `C:\\\
  roo-cookbook\\ch03-recipes` 目录启动 Roo shell。\n\n执行 `ch03_jpa_setup.roo` 脚本，该脚本将创建\
  \ *flight-app* Roo 项目，设置 Hibernate 作为持久化提供程序，并将 MySQL 配置为应用程序的数据库。如果你使用的数据库不是 MySQL\
  \ 或你的连接设置与脚本中指定的不同，则相应地修改脚本。\n\n### 操作步骤\n\n要创建继承 *映射超类* 的实体，请按照给定步骤操作：\n\n- 1.\
  \ 使用 `entity` 命令创建 *AuditFields* 类并向其添加字段：\n\n```\n.. roo> entity --class ~.domain.AuditFields\
  \ --mappedSuperclass\n```\n\n\n\n~.domain.AuditFields roo> field date --type java.util.Date\
  \ --fieldName createdDate\n~.domain.AuditFields roo> field date --type java.util.Date\
  \ --fieldName modifiedDate\n~.domain.AuditFields roo> field string --fieldName createdBy\n\
  ~.domain.AuditFields roo> field string --fieldName modifiedBy\n\n- 2. 使用 entity\
  \ 命令创建 Flight 实体并向其添加字段：\n\n```\n.. roo> entity --class ~.domain.Flight --extends\
  \ ~.domain.AuditFields --table FLIGHT_TBL\n~.domain.Flight roo> field date --type\
  \ java.util.Date --fieldName departureDate --column DEPARTURE_DATE\n~.domain.Flight\
  \ roo> field date --type java.util.Date --fieldName arrivalDate --column ARRIVAL_DATE\n\
  ```\n\n## 工作原理...\n\nentity 命令的 mappedSuperclass 参数负责创建映射超类。它是一个标志类型参数；如果存在，表示生成的类必须使用\
  \ @MappedSuperclass JPA 注解进行标注。以下代码显示了由 entity 命令生成的 AuditFields 映射超类的相关注解：\n\n\
  ```java\n@RooJavaBean\n@RooToString\n@RooEntity(mappedSuperclass = true)\npublic\
  \ class AuditFields { ... }\n```\n\n如本代码所示，AuditFields 类使用了 @RooEntity 注解。如前所述，@RooEntity\
  \ 注解会触发 Roo 为 AuditFields 类生成对应的 *_Roo_Entity.aj AspectJ ITD 文件。@RooEntity 注解的 mappedSuperclass\
  \ 属性指示 Roo 在相应的 *_Roo_Entity.aj 中添加一条声明，使用 @MappedSuperclass 注解（而非 @Entity JPA 注解）来标注\
  \ AuditFields 类。\n\n当实体类继承映射超类时，Roo 会生成对应映射超类的 *_Roo_Entity.aj AspectJ ITD 文件，并定义一个标识字段（使用\
  \ @Id JPA 注解标注），以及 persist、merge、refresh 等方法（我们在第 2 章的“创建持久化实体”示例中见过）。在这种情况下，继承实体的\
  \ *_Roo_Entity.aj 文件仅定义该实体的静态计数和查找方法。\n\n以下代码清单显示了 AuditFields_Roo_Entity.aj 文件：\n\
  \n```java\nprivileged aspect AuditFields_Roo_Entity\n{\n    declare @type: AuditFields:\
  \ @MappedSuperclass;\n    @PersistenceContext\n    transient EntityManager AuditFields.entityManager;\n\
  \    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n    @Column(name\
  \ = \"id\")\n    private Long AuditFields.id;\n    @Version\n    @Column(name =\
  \ \"version\")\n    private Integer AuditFields.version;\n    @Transactional\n \
  \   public void AuditFields.persist()\n    {\n        if (this.entityManager ==\
  \ null)\n        this.entityManager = entityManager();\n        this.entityManager.persist(this);\n\
  \    }\n    @Transactional\n    public void AuditFields.remove() {...}\n    public\
  \ static final EntityManager\n    AuditFields.entityManager() {...}\n    ...\n}\n\
  ```\n\n给定代码表明，AuditFields_Roo_Entity.aj ITD 使用 @MappedSuperclass 注解标注 AuditFields\
  \ 类。同时，请注意 ITD 未使用 @Entity 和 @Table 注解标注 AuditFields 类。此代码表明，映射超类的 *_Roo_Entity.aj\
  \ ITD 与实体的相同——包含标识和版本定义、persist、remove 等方法，以及获取 JPA EntityManager 实例的方法。\n\n由于 Flight\
  \ 实体继承自 AuditFields 类，Roo 生成的 Flight_Roo_Entity.aj ITD 不包含标识和版本定义，也不包含用于持久化、刷新和合并\
  \ Flight 实体的持久化方法，如以下代码清单所示：\n\n```java\nprivileged aspect Flight_Roo_Entity\n{\n\
  \    declare @type: Flight: @Entity;\n    declare @type: Flight: @Table(name = \"\
  FLIGHT_TBL\");\n    public static long Flight.countFlights () {...}\n    public\
  \ static List<Flight> Flight.findAllFlights () {...}\n    public static Flight Flight.findFlight(Long\
  \ id) {...}\n    public static List<Flight> Flight.findFlightEntries (\n       \
  \ int firstResult, int maxResults) {...}\n}\n```\n\n给定代码表明，Flight 实体仅包含查找和计数方法，并从\
  \ AuditFields 映射超类继承标识、版本定义以及持久化相关方法。与任何其他 JPA 实体一样，ITD 使用 @Entity 和 @Table 注解标注\
  \ Flight 类。\n\n## 更多内容...\n\n尽管映射超类包含标识定义，但您可以通过使用 @AttributeOverride 或 @AttributeOverrides\
  \ JPA 注解在继承实体中对其进行覆盖。以下代码展示了 Flight 实体如何覆盖 AuditFields 类中的标识定义，以将标识字段映射到 FLIGHT_TBL\
  \ 表的 FLT_ID 列：\n\n```java\n@RooJavaBean\n@RooToString\n@RooEntity(table=\"FLIGHT_TBL\"\
  )\n@AttributeOverride(name=\"id\", column=@Column(name=\"FLT_ID\"))\npublic class\
  \ Flight extends AuditFields {..}\n```\n\n## 创建标注 @Embeddable 的类\n\n在上一示例中，我们了解到\
  \ Flight 实体继承了 AuditFields 映射超类。您本可以将 Flight 实体建模为直接包含 AuditFields 实例，而不是继承它。为此，您需要创建一个使用\
  \ @Embeddable JPA 注解标注的 AuditFields 类，在 Flight 实体中定义对 AuditFields 类的引用，并使用 @Embedded\
  \ JPA 注解标注引用字段。让我们看看如何在 Roo 中完成此操作：\n\n- 1. 使用 entity 命令创建 AuditFields 类并向其添加字段，如下所示：\n\
  \n```\n.. roo> embeddable --class ~.domain.AuditFields\n\n~.domain.AuditFields roo>\
  \ field date --type java.util.Date --fieldName createdDate\n\n~.domain.AuditFields\
  \ roo> field date --type java.util.Date --fieldName modifiedDate\n\n~.domain.AuditFields\
  \ roo> field string --fieldName createdBy\n\n~.domain.AuditFields roo> field string\
  \ --fieldName modifiedBy\n```\n\n- 2. 使用 entity 命令创建 Flight 实体并向其添加字段，如下所示：\n\n\
  ```\n.. roo> entity --class ~.domain.Flight --table FLIGHT_TBL\n~.domain.Flight\
  \ roo> field date --type java.util.Date --fieldName departureDate --column DEPARTURE_DATE\n\
  ~.domain.Flight roo> field date --type java.util.Date --fieldName arrivalDate --column\
  \ ARRIVAL_DATE\n```\n\n- 3. 使用 field embedded 命令，将 AuditFields 定义为 Flight 实体中的嵌入对象，如下所示：\n\
  \n```\n~.domain.Flight roo> field embedded --fieldName auditFields --type ~.domain.AuditFields\n\
  ```\n\n以下代码显示了由 embeddable 命令生成的 AuditFields 类：\n\n```java\n@RooJavaBean\n@RooToString\n\
  @Embeddable\npublic class AuditFields\n{\n@Temporal(TemporalType.TIMESTAMP)\n@DateTimeFormat(style\
  \ = \"S-\")\nprivate Date createdDate;\n@Temporal(TemporalType.TIMESTAMP)\n@DateTimeFormat(style\
  \ = \"S-\")\nprivate Date modifiedDate;\nprivate String createdBy;\nprivate String\
  \ modifiedBy;\n}\n```\n\n给定代码表明，AuditFields 类使用了 JPA @Embeddable 注解。它未使用 @RooEntity\
  \ 注解，这意味着它不包含标识和版本定义，也不包含持久化相关方法。\n\n以下代码显示了 Flight 实体：\n\n```java\n@RooJavaBean\n\
  @RooToString\n@RooEntity(table = \"FLIGHT_TBL\")\npublic class Flight\n{\n...\n\
  @Embedded\nprivate AuditFields auditFields;\n}\n```\n\n此代码表明，Flight 实体包含对 AuditFields\
  \ 类的引用。AuditFields 引用由 field embedded 命令添加，并使用 @Embedded JPA 注解标注。\n\n如果您想覆盖 AuditFields\
  \ 类中定义的字段映射，可以使用 @AttributeOverrides 和 @AttributeOverride JPA 注解。以下代码片段展示了如何在 Flight\
  \ 实体中使用这些注解，将 AuditFields 类的 createdDate 和 modifiedDate 字段映射到 Flight 实体映射表的 C_DATE\
  \ 和 M_DATE 列：\n\n```java\n@Embedded\n@AttributeOverrides({\n    @AttributeOverride(name=\"\
  createdDate\",\n        column=@Column(name=\"C_DATE\")) ,\n    @AttributeOverride(name=\"\
  modifiedDate\",\n        column=@Column(name=\"M_DATE\"))\n})\nprivate AuditFields\
  \ auditFields;\n```\n\n## 另请参阅\n\n- 参阅第 2 章“创建持久化实体”示例，了解如何创建不继承映射超类的持久化实体\n\n##\
  \ 自定义 Roo 生成的标识定义\n\n迄今为止，我们已了解由 Spring Roo 生成 JPA 实体标识符的示例。默认情况下，Roo 创建的实体指定标识生成策略为\
  \ GenerationType.AUTO，这意味着持久化提供程序将为数据库选择合适的策略。您可能希望根据应用程序的要求自定义此标识生成策略。\n\n在本示例中，我们将探讨如何修改\
  \ Roo 生成的标识定义，以使用数据库表生成标识符值。\n\n## 准备工作\n\n退出 Roo shell，删除 C:\\roo-cookbook\\ch03-recipes\
  \ 目录的内容。\n\n从 C:\\roo-cookbook\\ch03-recipes 目录启动 Roo shell。\n\n\n\n\n\n执行 ch03_jpa_setup.roo\
  \ 脚本，该脚本会创建 flight-app Roo 项目，将 Hibernate 设置为持久化提供程序，并将 MySQL 配置为应用程序的数据库。如果您使用的数据库不是\
  \ MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\n现在，创建一个带有 Long 类型标识符字段的新 Flight 实体，如下所示：\n\n\
  ```\nroo> entity --class ~.domain.Flight --identifierColumn FLIGHT_ID\n--identifierField\
  \ flightId --identifierType java.lang.Long --table\nFLIGHT_TBL\n```\n\nFlight_Roo_Entity.aj\
  \ 文件中的以下代码显示了 Spring Roo 为 Flight 实体生成的标识符定义：\n\n```\nprivileged aspect Flight_Roo_Entity\n\
  {\n    ...\n\n    @Id\n    @GeneratedValue(strategy = GenerationType.AUTO)\n   \
  \ @Column(name = \"FLIGHT_ID\")\n    private Long Flight.flightId;\n    public Long\
  \ Flight.getFlightId()\n    {\n        return this.flightId;\n    }\n\n    public\
  \ void Flight.setFlightId(Long id)\n    {\n        this.flightId = id;\n    }\n\n\
  \    ...\n}\n```\n\n现在，假设我们希望使用名为 ID_GENERATOR 的数据库表来生成 Flight 实体的标识符值。这意味着我们需要使用\
  \ @TableGenerator 注解 flightId 字段，并将标识符生成策略更改为 GenerationType.TABLE。\n\n### 如何操作...\n\
  \n您可以通过在实体的 Java 源文件中（而不是在 *_Roo_Entity.aj 文件中）定义同名标识符，来覆盖 Roo 生成的标识符定义。以下代码显示了包含\
  \ flightId 标识符定义的修改后的 Flight.java 文件：\n\n```\n...\npublic class Flight\n{\n    ...\n\
  \    @Id\n    @TableGenerator(name = \"Flight_Gen\", table = \"ID_GENERATOR\",\n\
  \    pkColumnName = \"ID_COLUMN\", valueColumnName = \"ID_VALUE\",\n    pkColumnValue\
  \ = \"FLIGHT_ID_VALUE\", initialValue = 10,\n    allocationSize=100)\n    @GeneratedValue(strategy\
  \ = GenerationType.TABLE,\n    generator = \"Flight_Gen\")\n    private Long flightId;\n\
  \n    public Long getFlightId()\n    {\n    return this.flightId;\n    }\n    public\
  \ void setFlightId(Long flightId)\n    {\n    this.flightId = flightId;\n    }\n\
  \    ...\n    }\n```\n\n### 工作原理...\n\n@TableGenerator JPA 注解指定了用于主键生成的表的详细信息。@GeneratedValue\
  \ JPA 注解指定了用于生成主键值的策略。GenerationType.TABLE 表示 flightId 主键的值是从 @GeneratedValue 注解的\
  \ generator 元素所标识的数据库表中获取的。\n\n当您在实体的 Java 源文件中定义标识符时，Roo 会自动从相应的 *_Roo_Entity.aj\
  \ AspectJ ITD 文件中删除标识符定义。如果您现在检查 Flight_Roo_Entity.aj 文件，会发现 flightId 定义已从中删除。\n\
  \n### 更多内容...\n\nRoo 的 entity 命令对创建不同类型的标识符定义提供了有限的支持。在大多数场景中，您可能会发现有必要通过在实体的 Java\
  \ 源文件中定义实体标识符来自定义 Roo 生成的标识符定义。\n\n### 另请参阅\n\n- 请参阅第 2 章中的“创建持久化实体”配方，以了解有关使用 Spring\
  \ Roo 创建 JPA 实体的更多信息。\n\n## 生成数据库元数据\n\nRoo 支持通过内省现有数据库来创建 JPA 实体。如果您希望 Roo 为现有数据库创建\
  \ JPA 实体，那么您可能想了解 Roo 用作输入以创建与数据库表对应的 JPA 实体的数据库元数据。在本配方中，我们将介绍 database introspect\
  \ 命令，该命令允许我们以 XML 格式查看数据库元数据。在下一个配方“从数据库创建实体”中，我们将了解 Roo 如何使用此元数据来创建 JPA 实体。\n\n\
  以下图显示了我们将使用 database introspect 命令内省的数据库的表和视图：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_137_0.png)\n\
  \n在给定的图中，FLIGHT_TBL、FLIGHT_DESC_TBL 和 CUSTOMER_TBL 表示数据库表，而 FLIGHTS_VIEW 表示数据库视图。FLIGHT_TBL\
  \ 和 FLIGHT_DESC_TBL 表之间的关系是多对一。CUSTOMER_TBL 使用复合主键（由 CUST_ID 和 CUST_DOB 列组成）来唯一标识客户。FLIGHTS_VIEW\
  \ 数据库视图基于 FLIGHT_DESC_ID 列合并 FLIGHT_TBL 和 FLIGHT_DESC_TBL 表的数据。\n\n### 准备工作\n\n\
  退出 Roo shell 并删除 C:\\roo-cookbook\\ch03-recipes 目录的内容。\n\n从 C:\\roo-cookbook\\ch03-recipes\
  \ 目录启动 Roo shell。\n\n执行 ch03_jpa_setup.roo 脚本，该脚本会创建 flight-app Roo 项目，将 Hibernate\
  \ 设置为持久化提供程序，并将 MySQL 配置为应用程序的数据库。如果您使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，请相应地修改脚本。\n\n\
  在 MySQL 数据库上执行 myflightappdb.sql SQL 脚本（随本书附带）。myflightappdb.sql 创建一个名为 myflightappdb\
  \ 的数据库，包含 FLIGHT_TBL、FLIGHT_DESC_TBL 和 CUSTOMER_TBL 表以及 FLIGHT_VIEW 数据库视图，如本配方前面所示。请确保\
  \ Roo 项目的 database.properties 文件包含连接到此新创建的 myflightappdb 数据库的设置。\n\n出于本配方的目的，我们将使用\
  \ database introspect 命令查看在 MySQL 数据库中创建的 myflightappdb 数据库的元数据。现在，您已准备好查看与 Roo\
  \ 项目 database.properties 文件中配置的数据库相关的元数据。\n\n### 如何操作...\n\n要使用 database introspect\
  \ 命令查看数据库元数据，请按以下步骤操作：\n\n- 为即将内省的数据库启用驱动程序下载，请执行 download accept terms of use 命令，如下所示：\n\
  \n```\nroo> download accept terms of use\n```\n\n已找到可能提供此 JDBC 驱动程序的外接程序\n1 个已找到，按排名排序；T\
  \ = 可信开发者；R = Roo 1.1 兼容\n\nID T R DESCRIPTION ----\n01 Y Y 5.1.13.0001 #jdbcDriver\
  \ driverclass:com.mysql.jdbc.Driver.\nThis...\n--------------------------------------------\n\
  [提示] 使用 'addon info id --searchResultId ..' 查看搜索结果的详细信息\n[提示] 使用 'addon install\
  \ id --searchResultId ..' 安装特定的搜索结果，或\n[提示] 使用 'addon install bundle --bundleSymbolicName\
  \ TAB' 安装特定的外接程序版本\n\n- 第一次执行 `database introspect` 命令时，会建议下载在 MySQL 中对 `myflightappdb`\
  \ 数据库执行内省所需的数据库驱动程序。因此，请使用 `addon install` 命令下载建议的驱动程序，如下所示：\n\n```\nroo> addon\
  \ install id --searchResultId 01\nTarget resource(s):\n------------------\nSpring\
  \ Roo - Wrapping - mysql-connector-java (5.1.13.0001)\nDeploying...done.\n\nSuccessfully\
  \ installed add-on: Spring Roo - Wrapping - mysql-connector-java [version: 5.1.13.0001]\n\
  ```\n\n- 重新执行 `database introspect` 命令，如下所示：\n\n```\nroo> database introspect --schema\
  \ no-schema-required --file mydb.xml --enableViews\nDatabase metadata written to\
  \ file C:\\roo-cookbook\\ch03-recipes\\mydb.xml\n```\n\n- 现在，打开生成的 `mydb.xml` 文件以查看数据库元数据。\n\
  \n### 工作原理...\n\n`database introspect` 命令使用 Roo 项目 `database.properties` 文件中定义的连接属性来创建元数据信息。这意味着您不能使用\
  \ `database introspect` 命令同时内省多个数据库。该命令接受以下参数：\n\n- `schema` **(必填)**: 您要内省的数据库架构。如果您希望\
  \ Roo 连接到数据库并提供可用架构列表，则在命令行中输入 `--schema` 参数后直接按 `TAB` 键即可。由于 MySQL 和 Firebird 等某些数据库不支持架构概念，因此在命令行中输入\
  \ `--schema` 参数后按 `TAB` 键会将 `schema` 参数的值替换为 `no-schema-required`。\n\n- `file` **(可选)**:\
  \ 您要保存数据库元数据的文件。如果您未指定此参数，元数据将直接在 Roo 控制台中显示。\n\n- `enableViews` **(可选)**: 一个标志，用于指示是否在生成的元数据中包含数据库视图。默认情况下，生成的元数据不包含数据库视图。\n\
  \n\n\n\n数据库 introspect 命令的输出是一个 XML 文件（假设指定了文件参数），其中包含数据库表的详细信息，包括字段及其类型、主键、外键等。如果指定\
  \ enableViews 参数，生成的元数据还包括数据库视图。\n\n以下 XML 片段显示了数据库元数据在 mydb.xml 文件中的呈现方式：\n\n```xml\n\
  <database name=\"no-schema-required\">\n    <table name=\"customer_tbl\">\n    \
  \    <column name=\"cust_id\" primaryKey=\"true\"\n                required=\"true\"\
  \ scale=\"0\" size=\"10\" type=\"4,INT\"/>\n        ...\n        <unique name=\"\
  PRIMARY\">\n            <unique-column name=\"cust_id\"/>\n            <unique-column\
  \ name=\"cust_dob\"/>\n        </unique>\n    </table>\n    <table name=\"flight_desc_tbl\"\
  >\n        <column name=\"flight_desc_id\" primaryKey=\"true\"\n               \
  \ required=\"true\" scale=\"0\" size=\"19\" type=\"-5,BIGINT\"/>\n        ...\n\
  \        <foreign-key foreignTable=\"flight_tbl\"\n                name=\"FKT7E26BB6F365DD59\"\
  \ onDelete=\"none\"\n                onUpdate=\"none\">\n            <option key=\"\
  exported\" value=\"true\"/>\n            <reference foreign=\"flight_desc_id\"\n\
  \                    local=\"flight_desc_id\"/>\n        </foreign-key>\n      \
  \  <unique name=\"PRIMARY\">\n            <unique-column name=\"flight_desc_id\"\
  />\n        </unique>\n    </table>\n    <table name=\"flight_tbl\">\n        ...\n\
  \    </table>\n    <table name=\"flights_view\">\n        <column name=\"origin_city\"\
  \ primaryKey=\"false\"\n                required=\"true\" scale=\"0\" size=\"255\"\
  \ type=\"12,VARCHAR\"/>\n        ...\n    </table>\n</database>\n```\n\n以下表格描述了给定\
  \ XML 中元素的含义：\n\n| XML 元素 | 描述 |\n| :--- | :--- |\n| `<table>` | 描述数据库表或数据库视图。`name`\
  \ 属性指定 `<table>` 元素所描述的表或视图的名称。 |\n| `<column>` | `<table>` 的子元素 `<column>` 描述数据库表或视图中列的详细信息。`name`\
  \ 属性标识列名。`primaryKey` 属性指示该列是否为表或视图的主键之一。 |\n| `<foreignKey>` | 指定表的导入或导出外键的详细信息。`foreignTable`\
  \ 属性指定包含导入或导出外键的表的名称。`<option>` 子元素指定外键是由表导入还是导出。`<reference>` 子元素指定外键列以及导入或导出外键映射到的本地列。\
  \ |\n| `<unique>` | 描述适用于表或视图的唯一约束。如果 `name` 属性值为 `PRIMARY`，则表示唯一约束描述表的主键。 |\n\n\
  ## 还有更多...\n\nRoo 生成的元数据用于生成 JPA 实体，如我们将在 *从数据库创建实体* 配方中所见。如果找不到 `META-INF/spring/database.properties`\
  \ 文件或 `database.properties` 中定义的连接属性不正确，则使用 `database introspect` 命令时可能会报告错误。以下表格显示了\
  \ `database introspect` 可能报告的错误消息及相应的解决方案：\n\n| 错误消息 | 解决方案 |\n| :--- | :--- |\n\
  | Connection properties must not be null or empty | 表示在 `META-INF/spring` 文件夹中找不到\
  \ `database.properties` 文件 |\n| Unable to get connection from driver | 表示找到了 `database.properties`\
  \ 文件，但它未正确定义连接属性。检查用户名、密码和其他连接属性是否指定正确。 |\n\n> **测试数据库连接**\n> \n> 由于 `database introspect`\
  \ 命令连接到数据库以生成元数据，您也可以在执行 `persistenceXsetup` 命令后使用此命令来验证数据库连接。\n\n- **另请参阅**\n-\
  \ * 参阅《从数据库创建实体》配方，了解数据库元数据如何用于自动生成 JPA 实体\n\n## 从数据库创建实体\n\n在许多应用程序开发场景中，应用程序需要针对现有数据库进行设计，或者应用程序开发在数据库创建后开始。为支持此类场景，Roo\
  \ 提供了 `database reverse engineer` 命令，用于从数据库元数据自动生成 JPA 实体。如我们将在本配方后面看到的，Roo 提供了\
  \ `incremental` 数据库逆向工程，也就是说，每当数据库发生更改时，您都可以执行 `database reverse engineer` 命令，并让\
  \ Roo 根据数据库中的更改更新 JPA 实体定义。\n\n以下图显示了我们将使用 `database reverse engineer` 命令逆向工程的数据库中的表：\n\
  \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_142_0.png)\n\n## 准备工作\n\n参阅“生成数据库元数据”配方，以创建\
  \ Roo 项目，在 MySQL 中创建 myflightappdb 数据库、表和视图，并安装 MySQL 的 JDBC 驱动程序。\n\n## 操作步骤\n\n\
  要从数据库创建实体，请执行如下所示的 `database reverse engineer` 命令：\n\n```\n.. roo> database reverse\
  \ engineer --package ~.domain.entity.autogen\n--schema no-schema-required --enableViews\
  \ --testAutomatically\n\nCreated SRC_MAIN_RESOURCES\\dbre.xml\nUpdated SRC_MAIN_RESOURCES\\\
  META-INF\\persistence.xml\n\nCreated ..\\domain\\entity\\autogen\\FlightDescTbl.java\n\
  ...\nCreated ..\\domain\\entity\\autogen\\CustomerTbl.java\nCreated ..\\domain\\\
  entity\\autogen\\CustomerTblPK_Roo_Identifier.aj\nCreated ..\\domain\\entity\\autogen\\\
  CustomerTblPK.java\n...\nCreated ..\\domain\\entity\\autogen\\FlightTbl.java\nCreated\
  \ ..\\domain\\entity\\autogen\\FlightTbl_Roo_Entity.aj\nCreated ..\\domain\\entity\\\
  autogen\\FlightTbl_Roo_DbManaged.aj\nCreated ..\\domain\\entity\\autogen\\FlightTbl_Roo_Configurable.aj\n\
  Created ..\\domain\\entity\\autogen\\FlightTbl_Roo_ToString.aj\n...\nCreated ..\\\
  domain\\entity\\autogen\\FlightsView.java\nCreated ..\\domain\\entity\\autogen\\\
  FlightsViewPK.java\nCreated ..\\domain\\entity\\autogen\\FlightsViewPK_Roo_Identifier.aj\n\
  ...\n```\n\n从输出中可见，JPA 实体由 Spring Roo 自动生成。\n\n## 工作原理\n\n`database reverse engineer`\
  \ 命令接受以下参数：\n\n- package: 这是一个 _可选_ 参数，指定 Roo 创建 JPA 实体的包。如果未指定此属性，JPA 实体将在 Roo\
  \ 项目的顶级包中创建。\n\n- schema: 这是一个 _强制_ 参数，用于指定数据库架构名称。由于 MySQL 和 Firebird 等一些数据库不支持架构概念，因此在命令行中输入\
  \ `--schema` 后按 `TAB` 键会将 `no-schema-required` 替换为 `schema` 参数的值。\n\n- testAutomatically:\
  \ 这是一个可选参数，指示 Roo 为通过数据库逆向工程命令创建的 JPA 实体创建集成测试。\n\n- enableViews: 这是一个可选参数，指示 Roo\
  \ 在逆向工程数据库表的同时逆向工程数据库视图。如果指定，Roo 会为每个数据库视图创建相应的 JPA 实体。\n\n- includeTables: 这是一个可选参数，指定\
  \ Roo 为其创建 JPA 实体的表。默认情况下，Roo 会为数据库中的所有表创建相应的 JPA 实体。includeTables 参数的值指定用双引号括起来的空格分隔的表列表，如下所示：\n\
  \n  .. roo> database reverse engineer --schema no-schema-required\n  --includeTables\
  \ \"FLIGHT_TBL FLIGHT_DESC_TBL\"\n\n- excludeTables: 这是一个可选参数，指定 Roo 不得为其创建 JPA\
  \ 实体的表。excludeTables 参数的值指定用双引号括起来的空格分隔的表列表，如下所示：\n\n  .. roo> database reverse\
  \ engineer --schema no-schema-required\n  --excludeTables \"FLIGHT_TBL FLIGHT_DESC_TBL\"\
  \n\n现在让我们看看执行数据库逆向工程命令时发生的一些有趣的事情：\n\n- 在 Roo 项目的 SRC_MAIN_RESOURCES 目录中生成 dbre.xml\
  \ 文件。该文件包含 XML 格式的数据库元数据，如“生成数据库元数据”配方中所述。\n\n- 数据库中的每个表和视图都会生成相应的 Java 类。Java 源文件的名称为\
  \ <table-name>.java，其中 table-name 是数据库表的名称（采用驼峰命名法，并删除表名中的下划线）。每个 Java 类都代表与数据库表或视图相对应的\
  \ JPA 实体。\n\n- 更新 META-INF/persistence.xml 文件。Roo 会修改（如果您使用 Hibernate 作为 JPA 提供程序）属性\
  \ hibernate.hbm2ddl.auto 的值，将其从 create 改为 validate，以便在创建 Hibernate SessionFactory\
  \ 时不会修改数据库。这是有道理的，因为应用程序中的 JPA 实体是从数据库创建的，而不是反之。\n\n- 为 Roo 创建的每个 JPA 实体创建一个相应的\
  \ *.Roo_Db_Managed.aj ITD 文件。它定义了从数据库元数据派生的 JPA 实体的字段和关系。由于此 ITD 文件包含字段和关系信息，如果多次逆向工程数据库，则与数据库相关的更改将限制在此\
  \ ITD 文件中，从而使 Roo 应用程序能够实现增量数据库逆向工程。\n\n\n\n- 如果数据库表的主键由多个列组成，Roo 会创建一个复合主键类和一个\
  \ *_Roo_Identifier.aj AspectJ ITD。例如，对于 CUSTOMER_TBL，Roo 会生成 CustomerTblPK.java\
  \ 和 CustomerTblPK_Roo_Identifier.aj AspectJ ITD 文件。\n\n- 如果数据库表或视图未定义主键，Roo 会创建一个由数据库表或视图中的所有字段组成的复合主键类。例如，FLIGHTS_VIEW\
  \ 未定义主键；因此，Roo 会创建 FlightsViewPK.java 复合主键类。\n\n以下代码显示了 FlightDescTbl_Roo_DbManaged.aj\
  \ ITD，它对应 FLIGHT_DESC_TBL 表：\n\n```java\nprivileged aspect FlightDescTbl_Roo_DbManaged\n\
  {\n    @OneToMany(mappedBy = \"flightDescId\")\n    private Set<FlightTbl> FlightDescTbl.flightTbls;\n\
  \    @Column(name = \"destination_city\",\n    columnDefinition = \"VARCHAR\" length\
  \ = 255)\n    @NotNull\n    private String FlightDescTbl.destinationCity;\n    @Column(name\
  \ = \"origin_city\", length = 255)\n    @NotNull\n    private String FlightDescTbl.originCity;\n\
  \    ...\n}\n```\n\n给定的代码显示，*_Roo_DbManaged.aj AspectJ ITD 包含从数据库元数据派生的字段和关系信息。这与我们在先前示例中看到的情况不同，在那些示例中，JPA\
  \ 字段和关系包含在 Java 源文件中，而不在 AspectJ ITD 文件中。另外，请注意 @NotNull JSR 303 注释的存在，它源于相应的数据库列定义为非空。\n\
  \n与其他 AspectJ ITD 一样，*_Roo_DbManaged.aj 的创建由 Roo 注释 @RooDbManaged 管理，如 FlightDescTbl.java\
  \ 类所示：\n\n```java\n@RooJavaBean\n@RooToString\n@RooEntity(table = \"flight_desc_tbl\"\
  )\n@RooDbManaged(automaticallyDelete = true)\npublic class FlightDescTbl {\n}\n\
  ```\n\n在给定的代码中，@RooDbManaged 注释表示 FlightDescTbl 实体由 Roo 的数据库逆向工程过程管理。如本代码所示，FlightDescTbl\
  \ 类为空且仅包含类级别注释。@RooDbManaged 注释控制 *_Roo_DbManaged.aj ITD 的创建。@RooDbManaged 注释的 automaticallyDelete\
  \ 属性指定如果从数据库中删除表，是否应移除该实体。默认值为 true，这意味着如果你删除相应的数据库表然后执行数据库逆向工程命令，JPA 实体将从 Roo 项目中移除。\n\
  \n### 还有更多...\n\n现在让我们看看如何为 Oracle 和 DB2 数据库安装 JDBC 驱动程序，覆盖由数据库逆向工程过程生成的 JPA 字段和关系，执行增量数据库逆向工程，以及\
  \ Roo 如何处理复合主键情况。\n\n### 为 Oracle 和 DB2 安装 JDBC 驱动程序\n\nRoo 的数据库逆向工程过程要求 JDBC 驱动程序作为\
  \ OSGi bundle 可用。Roo 提供了 addon create wrapper 命令，你可以使用它将 JDBC 驱动程序包装在 OSGi 合规的 bundle\
  \ 中，以用于数据库逆向工程过程。Roo 为大多数 JDBC 驱动程序提供了 OSGi 合规的 bundle，可以通过 addon install 命令进行安装。由于\
  \ Oracle 和 DB2 没有开源的 JDBC 驱动程序，要对这些数据库使用 Roo 的数据库逆向工程过程，你首先需要将这些数据库的非 OSGi JDBC\
  \ 驱动程序 JAR 文件转换为 OSGi 合规的 bundle。\n\n在第 7 章中，我们将了解如何使用 addon create wrapper 命令将非\
  \ OSGi JDBC 驱动程序 JAR 或任何其他 Maven artifact 转换为 OSGi 合规的 bundle。\n\n### 修改自动生成的 JPA\
  \ 字段/关系\n\n如果你想修改由数据库逆向工程过程生成的 JPA 字段和关系，请在 JPA 实体类本身中定义它们。你在 JPA 实体类中定义的字段和关系将由\
  \ Roo 从相应的 *_Roo_DbManaged.aj ITD 文件中自动移除。\n\n> 如果你在实体类中定义所有 JPA 字段和关系，Roo 将自动删除相应的\
  \ *_Roo_DbManaged.aj ITD 文件。\n\n### 增量数据库逆向工程\n\n你可以在项目生命周期中使用数据库逆向工程过程。如果对数据库进行了修改，请执行\
  \ `database reverse engineer` 命令，而不使用 `schema` 和 `package` 参数。数据库逆向工程过程会更新 `dbre.xml`\
  \ 文件，从而导致 JPA 实体及其字段和关系的添加、删除和修改。\n\n`dbre.xml` 文件由 Roo 管理，但在修改数据库之前，你可以修改它，以查看对\
  \ Roo 生成的 JPA 实体的更改的影响。需要注意的是，当你重新执行 `database reverse engineer` 命令时，你对 `dbre.xml`\
  \ 文件的自定义更改将被覆盖。\n\n### 具有复合主键的数据库表\n\n如果你的数据库表具有复合主键，则数据库逆向工程过程会负责创建一个主键类，该类通过 *_Roo_Identifier.aj\
  \ ITD 被 JPA @Embeddable 注释标注。然后，主键类通过 *_Roo_Entity.aj ITD 引入 JPA 实体类，并被 JPA @EmbeddedId\
  \ 注释标注。\n\n### 另请参阅\n\n- 参阅“生成数据库元数据”示例，了解如何查看数据库表的元数据信息\n"
- "# 4 使用 Spring Web MVC 进行 Web 应用程序开发\n\n在本章中，我们将介绍：\n\n- 从 JPA 实体自动生成 Spring MVC\
  \ 控制器和 JSPX 视图\n- 打包、部署和使用 Roo 生成的 Spring MVC 应用程序\n- 修改 Roo 生成的视图\n- Spring Roo\
  \ 对 Web 控制器和视图的往返支持\n- 为特定 JPA 实体创建 Spring MVC 控制器\n- 为 JPA 实体手动创建 Spring MVC 控制器\n\
  - 向 Roo 生成的 Web 应用程序添加静态视图\n- 国际化 Roo 生成的 Web 应用程序\n- 添加或修改 Roo 生成的主题\n- 为域对象和控制器添加\
  \ JSON 支持\n- 为 Web 控制器创建和执行 Selenium 测试\n\n## 简介\n\n在第 2 章“使用 JPA 持久化对象”和第 3 章“Spring\
  \ Roo 中的高级 JPA 支持”中，我们探讨了如何使用 Spring Roo 的 JPA 插件快速开发应用程序的领域层。在本章中，我们将了解 Spring\
  \ Roo 如何使用 Spring Web MVC 简化企业应用程序 Web 层的开发。我们还将了解 Spring Roo 如何让你在本地快速测试 Web 应用程序。\n\
  \n> > 即使你想使用的 Web 框架未被 Roo 支持，你也可以使用 Roo 开发企业应用程序的持久层。例如，如果你使用 Wicket 开发 Web 应用程序，仍可以使用\
  \ Roo 生成应用程序的持久层。同样，如果你正在开发 Swing 应用程序，可以使用 Roo 创建持久层。\n\n## 从 JPA 实体自动生成 Spring\
  \ MVC 控制器和 JSPX 视图\n\nSpring Roo 自带 Web MVC 插件，支持从 Roo 管理的 JPA 实体创建 Spring MVC 控制器和\
  \ JSPX 视图。Spring Roo 提供由 Web MVC 插件处理的多个命令，以帮助自动生成 Spring MVC 控制器和 JSPX 视图。默认情况下，Roo\
  \ 生成的控制器支持从数据存储中创建、读取、更新和删除 JPA 实体。\n\nRoo 提供以下命令用于创建控制器：\n\n- `controller all`:\
  \ 用于为应用程序中尚不存在控制器的每个 JPA 实体脚手架一个 Spring Web MVC 控制器。`controller all` 命令不会让你对生成的控制器所支持的应用程序功能进行任何控制。\n\
  - `controller scaffold`: 用于为 JPA 实体脚手架一个 Spring Web MVC 控制器。与 `controller all` 命令不同，`controller\
  \ scaffold` 命令提供可选参数，允许你控制生成的控制器所支持的某些应用程序功能。例如，你可以指定不为控制器生成用于创建、更新和删除 JPA 实体的方法。\n\
  - `controller class`: 用于手动创建控制器。`controller class` 命令生成控制器的骨架，将控制器的实现留给开发人员。\n\n\
  \n\n在本示例中，我们将了解 `controller all` 命令，并详细讨论执行 `controller all` 命令时幕后发生的情况。为特定 JPA\
  \ 实体创建 Spring MVC 控制器示例展示了控制器脚手架命令的用法，以及手动为 JPA 实体创建 Spring MVC 控制器示例展示了如何使用控制器类命令手动实现控制器。\n\
  \n### 准备工作\n\n在 `C:\\roo-cookbook` 目录中创建子目录 `ch04-recipe`。\n\n将 `ch04_web-app.roo`\
  \ 脚本复制到 `ch04-recipe` 目录中。\n\n执行 `ch04_web-app.roo` 脚本，该脚本将创建 `flight-app` Roo 项目，将\
  \ Hibernate 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 Flight 和 FlightDescription JPA 实体，并定义\
  \ Flight 与 FlightDescription 实体之间的多对一关系。如果使用的数据库不是 MySQL，或者连接设置与脚本中指定的不同，则相应地修改脚本。\n\
  \n从 `C:\\roo-cookbook\\ch04-recipe` 目录启动 Roo shell。\n\n### 操作步骤\n\n要使用 `controller\
  \ all` 命令创建视图，请按照给定步骤操作：\n\n- 1. 执行 `controller all` 命令，将 `~.web` 指定为 package 参数的值，如下所示：\n\
  \n```\nroo> controller all --package ~.web\nCreated SRC_MAIN_JAVA\\..\\web\nCreated\
  \ SRC_MAIN_JAVA\\..\\web\\FlightDescriptionController.java\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\spring\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\spring\\webmvc-config.xml\nCreated\
  \ SRC_MAIN_JAVA\\..\\web\\ApplicationConversionServiceFactoryBean.java\nCreated\
  \ SRC_MAIN_JAVA\\..\\web\\FlightDescriptionController_Roo_Controller.aj\nCreated\
  \ SRC_MAIN_JAVA\\..\\web\\\nApplicationConversionServiceFactoryBean_Roo_ConversionService.aj\n\
  Created SRC_MAIN_JAVA\\..\\web\\FlightDescriptionController_Roo_Controller_Finder.aj\n\
  ..\nCreated SRC_MAIN_WEBAPP\\images\nCreated SRC_MAIN_WEBAPP\\styles\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\classes\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\classes\\alt.properties\nCreated\
  \ SRC_MAIN_WEBAPP\\WEB-INF\\classes\\standard.properties\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\layouts\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\layouts\\default.jspx\nCreated\
  \ SRC_MAIN_WEBAPP\\WEB-INF\\layouts\\layouts.xml\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\\
  views\nCreated SRC_MAIN_WEBAPP\\WEB-INF\\views\\flightdescriptions\nCreated SRC_MAIN_WEBAPP\\\
  WEB-INF\\views\\flights\n```\n\ncontroller all 命令的输出显示创建了 JSPX 视图、控制器、图像和样式等目录。出于简洁考虑，给定代码中仅显示了部分输出。\n\
  \n- 2. 在处理 controller all 命令期间，许多依赖项会添加到 flight-app 项目的 pom.xml 文件中，因此请执行 Roo 的\
  \ perform eclipse 命令以更新 Eclipse 项目的 .classpath 文件：\n\n```\nroo> perform eclipse\n\
  ```\n\n- 3. 将 flight-app 项目导入 Eclipse IDE，以查看构成应用程序的文件和目录。\n\n### 工作原理\n\n执行 controller\
  \ all 命令的输出显示，已创建控制器、视图等。为进行总结，下表描述了 flight-app Roo 项目中创建的各个目录：\n\n| 目录 | 说明 |\n\
  |---|---|\n| SRC_MAIN_JAVA 中的 sample\\roo\\flightapp\\web 文件夹 | 包含与应用程序中每个 JPA 实体对应的脚手架控制器（及其\
  \ ITD）。该文件夹根据 controller all 命令的 package 参数值创建。 |\n| SRC_MAIN_WEBAPP\\WEB-INF\\\
  spring | 包含由 Spring 的 DispatcherServlet 加载的 flight-app 应用程序的 Web 应用程序上下文 XML 文件。该\
  \ Web 应用程序上下文 XML 文件的名称为 webmvc-config.xml。 |\n| SRC_MAIN_WEBAPP\\images | 包含 Roo\
  \ 生成的 JSPX 视图使用的图像。 |\n| SRC_MAIN_WEBAPP\\styles | 包含 Roo 生成的 JSPX 视图使用的 CSS 样式表。默认情况下，它包含两个\
  \ CSS 样式表：standard.css 和 alt.css。 |\n| SRC_MAIN_WEBAPP\\WEB-INF\\classes | Roo 创建以下两个属性文件，用于标识构成主题的资源：`standard.properties`\
  \ 和 `alt.properties`。 |\n| SRC_MAIN_WEBAPP\\WEB-INF\\layouts | 包含 tiles 配置 XML 文件\
  \ `layouts.xml`，其中包含 tiles 定义。它还包含布局模板 JSPX 文件 `default.jspx`，该文件由 `layouts.xml`\
  \ 文件中的 tiles 定义用作模板。 |\n| SRC_MAIN_WEBAPP\\WEB-INF\\views | 包含 Roo 生成的 Web 应用程序中非\
  \ JPA 实体特定的 JSPX 视图。例如，它包含一个 `index.jspx` 文件，用于显示 `flight-app` 应用程序的主页，以及一个 `uncaughtException.jspx`\
  \ 文件，当 Web 应用程序中发生意外异常时会渲染该文件。为简化创建 Web 应用程序的自定义主页，该目录还包含一个 `index-template.jspx`\
  \ 文件。该目录还包含一个 tiles 配置 XML 文件 `views.xml`，它扩展了在 `layouts.xml` 文件中定义的 tiles 定义。`views.xml`\
  \ 文件中的 tiles 定义用于显示非 JPA 实体特定的 JSPX 页面，例如主页以及请求处理期间发生意外异常时的页面。应注意，Roo 生成的 Web 应用程序使用\
  \ Apache Tiles 2 框架来简化用户界面开发。 |\n| SRC_MAIN_WEBAPP\\WEB-INF\\views\\flightdescriptions\
  \ 和 SRC_MAIN_WEBAPP\\WEB-INF\\views\\flights | `flightDescriptions` 和 `flights`\
  \ 目录分别包含与 `FlightDescription` 和 `Flight` JPA 实体对应的 JSPX 视图。每个目录还包含一个 tiles 配置 XML\
  \ 文件 `views.xml`，其中包含用于显示 JPA 实体特定 Web 页面的 tiles 定义。默认情况下，Roo 会创建用于对 JPA 实体执行 CRUD\
  \ 操作的 JSPX 视图。 |\n| SRC_MAIN_WEBAPP\\WEB-INF\\tags | 包含 Roo 安装以简化 JSP 开发的标签。这些标签的性质是仅\
  \ XML 的，即它们没有 Java 源代码支持，因此可以轻松修改这些标签的行为。我们将在 Spring Roo 中 Web 控制器和视图的往返支持示例中看到，这些标签的\
  \ `id` 属性如何帮助实现 Roo 生成的 Web 应用程序中的往返支持。 |\n| SRC_MAIN_WEBAPP\\WEB-INF\\i18n | 包含用于支持国际化的\
  \ Web 用户界面资源包。默认情况下，Roo 生成 messages.properties 和 application.properties 文件。messages.properties\
  \ 文件包含适用于 Roo 生成的所有 Web 用户界面的翻译。application.properties 文件包含特定于应用程序的翻译。这就是为什么你只会在\
  \ application.properties 文件中找到包含 Flight 和 Flight Description 等词汇的翻译。修改 Roo 生成的视图和国际化\
  \ Roo 生成的 Web 应用程序示例详细描述了 Roo 如何管理这些属性文件以及它们在国际化 Roo 生成的 Web 应用程序中所起的作用。 |\n\n除了创建目录和文件之外，首次执行\
  \ `controller all` 命令还会将 Roo 项目的性质从普通 Java 项目转换为 Web 项目。项目性质的变化体现在 flight-app 项目的\
  \ `pom.xml` 文件的 `<packaging>` 元素中，如下所示：\n\n```\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\
  \ ..>\n  ..\n  <artifactId>flight-app</artifactId>\n  <packaging>war</packaging>\n\
  \  <version>0.1.0.0.BUILD-SNAPSHOT</version>\n  <name>flight-app</name>\n</project>\n\
  ```\n\n`<packaging>` 元素的值 war 表明该项目是 Web 项目，而不是普通 Java 项目。普通 Java 项目的 `<packaging>`\
  \ 元素值为 `jar`。我们将在 *为 Web 应用程序打包* 示例中了解 `<packaging>` 元素的值如何影响 `perform package`\
  \ Roo 命令的输出。\n\n首次执行 `controller all` 命令还会创建 `web.xml` 文件（即 Web 应用程序部署描述符）。\n\n\
  现在我们将详细了解 `controller all` 命令生成的各种工件。首先，让我们来看看 Roo 生成的 `web.xml` 文件中包含的配置信息。\n\n\
  ## web.xml 中定义的配置信息\n\n`web.xml` 文件配置 DispatcherServlet、根 Web 应用程序上下文、异常页面等。在本节中，我们将了解\
  \ flight-app 项目的 `web.xml` 文件中定义的配置：\n\n\n## contextConfigLocation 初始化参数\n\nThe\
  \ contextConfigLocation context initialization parameter identifies Spring's root\
  \ web application context XML file(s), as shown here:\n\n```\n<context-param>\n\
  <param-name>contextConfigLocation</param-name>\n<param-value>\nclasspath*:META-INF/spring/applicationContext*.xml\n\
  </param-value>\n</context-param>\n```\n\nThe META-INF/spring/applicationContext.xml\
  \ file contains bean definitions that are shared by all servlets and filters defined\
  \ in the flight-app web application. These bean definitions are available to application\
  \ contexts loaded by DispatcherServlet. As we saw in the Creating a Roo project\
  \ recipe of Chapter 1, Getting Started with Spring Roo and in Setting up a JPA provider\
  \ for your project recipe of Chapter 2, Persisting Objects Using JPA, an applicationContext.xml\
  \ file contains bean definitions for configuring data sources, services, transactions,\
  \ and so on, and needs to be shared across the web application.\n\nIf you create\
  \ additional application context XML files, which contain bean definitions that\
  \ you want to share across the web application, then you can add them to the value\
  \ of the contextConfigLocation parameter using commas or space separated values,\
  \ as shown here:\n\n```\n<param-value>\nclasspath*:META-INF/spring/applicationContext*.xml,\n\
  META-INF/spring/mycontext.xml\n</param-value>\n```\n\n## ContextLoaderListener\n\
  \nThe root web application context, identified by the contextConfigLocation context\
  \ initialization parameter, is loaded by the ContextLoaderListener, which implements\
  \ javax.servlet.ServletContextListener, as shown here:\n\n```\n<listener>\n<listener-class>\n\
  org.springframework.web.context.ContextLoaderListener\n</listener-class>\n</listener>\n\
  ```\n\n## DispatcherServlet\n\nThe webmvc-config.xml file created by Roo identifies\
  \ the web application context of the Roo-generated web application. The webmvc-config.xml\
  \ file contains tile definitions, handler (or controller) definitions, handler mappings,\
  \ view and exception resolution strategies, and so on. The DispatcherServlet of\
  \ Spring is responsible for loading the webmvc-config.xml file and dispatching requests\
  \ to appropriate handlers, resolving views, exceptions, and so on. In the web.xml\
  \ of the flight-app, DispatcherServlet is configured to load webmvc-config.xml,\
  \ as shown here:\n\n```\n<servlet>\n    <servlet-name>flight-app</servlet-name>\n\
  \    <servlet-class>\n        org.springframework.web.servlet.DispatcherServlet\n\
  \    </servlet-class>\n    <init-param>\n        <param-name>contextConfigLocation</param-name>\n\
  \        <param-value>\n            /WEB-INF/spring/webmvc-config.xml\n        </param-value>\n\
  \    </init-param>\n    <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\n\
  As shown in the given code, the DispatcherServlet accepts the contextConfigLocation\
  \ initialization parameter that identifies the Spring's web application context\
  \ XML file. The scope of the application context loaded by the DispatcherServlet\
  \ is limited to the requests that are mapped to the DispatcherServlet.\n\nIf you\
  \ want to modularize your application, then consider creating a different web application\
  \ context for each module and configure a DispatcherServlet for each module in the\
  \ web.xml file.\n\n## OpenEntityManagerInViewFilter\n\nAs you might be lazy about\
  \ loading JPA entities in your web application, Roo configures the OpenEntityManagerInViewFilter\
  \ servlet filter in web.xml to bind the JPA EntityManager to the thread in which\
  \ a request is handled, as shown here:\n\n```\n<filter>\n    <filter-name>\n   \
  \     Spring OpenEntityManagerInViewFilter\n    </filter-name>\n    <filter-class>org.springframework.orm.jpa.support.OpenEntityManagerInViewFilter\n\
  \    </filter-class>\n</filter>\n```\n\nThe OpenEntityManagerInViewFilter assumes\
  \ that the EntityManagerFactory for looking up the EntityManager instance is registered\
  \ with the root web application context and has the name entityManagerFactory. If\
  \ you change the id of the LocalContainerEntityManagerFactory bean defined in META-INF/spring/applicationContext.xml\
  \ file, then add a entityManagerFactoryBeanName initialization parameter to the\
  \ OpenEntityManagerInViewFilter definition in web.xml to inform it about the LocalContainerEntityManagerFactory\
  \ bean.\n\n## HiddenHttpMethodFilter\n\nHTTP specification defines four methods:\
  \ GET, POST, PUT, and DELETE, but HTML only supports GET and POST methods. As the\
  \ semantics of different HTTP methods differ, in the REST approach it is recommended\
  \ to use an appropriate HTTP method for sending an HTTP request. For instance, if\
  \ you want to delete Flight instances from the database, then you should use the\
  \ DELETE HTTP method and if you are updating Flight instances, then use a PUT HTTP\
  \ method. The HTTP method with which the HTTP request was made is obtained using\
  \ the getMethod() method of javax.servlet.HttpServletRequest.\n\nSo, to perform\
  \ PUT and DELETE operations in your web application, you can do a normal POST and\
  \ along with it send an additional request parameter with the name _method whose\
  \ value is either PUT or DELETE. Spring provides a HiddenHttpMethodFilter servlet\
  \ filter, which reads the value of the _method parameter, creates an HttpServletRequest\
  \ Wrapper and overrides the getMethod method of HttpServletRequest to return the\
  \ value of the _method parameter—making it possible to perform PUT and DELETE HTTP\
  \ operations in your web application.\n\nSpring Roo automatically configures HiddenHttpMethodFilter\
  \ in the web.xml file generated for the web application, as shown here for the flight-app\
  \ application:\n\n```\n<filter>\n<filter-name>HttpMethodFilter</filter-name>\n<filter-class>org.springframework.web.filter.HiddenHttpMethodFilter\n\
  </filter-class>\n</filter>\n```\n\nThe Spring Web MVC's form tag library provides\
  \ built-in support for dealing with different HTTP methods. For instance, the following\
  \ form tag will result in performing an HTTP POST and send an additional request\
  \ parameter named _method whose value is PUT:\n\n```\n<form:form method=\"put\"\
  >\n<input type=\"submit\" value=\"Delete Flight\"/>\n</form:form>\n```\n\nIn the\
  \ given code, the method attribute of the form tag identifies the value that needs\
  \ to be set for the _method request parameter when the form is submitted.\n\n> As\
  \ Roo-generated JSPX files make heavy use of custom tags installed in the SRC_MAIN_WEBAPP\\\
  WEB-INF\\tags folder, you will mainly find usage of the Spring MVC's form tag library\
  \ in these custom tags.\n\n## Exception pages\n\nBy default, Roo configures exception\
  \ pages for situations when unexpected exceptions occur or a resource is not found\
  \ (HTTP status code 404), as shown here for unexpected exceptions:\n\n```\n<error-page>\n\
  <exception-type>java.lang.Exception</exception-type>\n<location>/uncaughtException</location>\n\
  </error-page>\n```\n\nAs the Roo-generated application uses Apache Tiles 2 framework,\
  \ the `<location>` element is not mapped to the actual HTML or JSPX view that is\
  \ shown in response to the exception. Later in this recipe, we'll see how Spring's\
  \ exception resolvers are used by Roo-generated web applications to resolve exceptions\
  \ to logical views.\n\nNow that we have seen configurations that form part of the\
  \ `web.xml` file generated by Roo for the `flight-app` application, let's now look\
  \ at the web application context XML file: `webmvc-config.xml`, which is loaded\
  \ by `DispatcherServlet`. The web application context, loaded by `DispatcherServlet`,\
  \ is the place where request handlers, exception resolvers, theme and locale change\
  \ interceptors, and so on, are registered.\n\n## Beans and configurations defined\
  \ in webmvc-config.xml\n\nThe `webmvc-config.xml` file contains configurations and\
  \ bean definitions that are loaded by `DispatcherServlet`. Let's now look at the\
  \ `webmvc-config.xml` file in detail:\n\n### Controller auto-detection\n\nIn Roo-generated\
  \ web applications, controllers are auto-detected using the `<component-scan>` element\
  \ of Spring's `context` schema, as shown here:\n\n```\n<context:component-scan base-package=\"\
  sample.roo.flightapp\"\nuse-default-filters=\"false\">\n<context:include-filter\
  \ expression=\"org.springframework.stereotype.Controller\"\ntype=\"annotation\"\
  \ />\n</context:component-scan>\n```\n\nThe `base-package` attribute specifies a\
  \ comma separated list of packages, which are scanned by Spring for classes annotated\
  \ with `@Repository`, `@Component`, `@Controller`, and `@Service` annotations. The\
  \ `use-default-filters` attribute specifies if auto-detection of classes annotated\
  \ with `@Repository`, `@Component`, `@Controller`, and `@Service` are enabled or\
  \ disabled. By default, auto-detection is enabled. The value `false` indicates that\
  \ auto-detection of these annotated classes are disabled. As the web application\
  \ context loaded by `DispatcherServlet` should contain controller or handler components,\
  \ the `<include-filter>` element specifies that only classes annotated with `@Controller`\
  \ annotation are auto-detected by Spring.\n\n\n\n\n如果你在不同的包中手动创建控制器，则将包含这些控制器的包添加到\
  \ base-package 属性的值中。\n\n## 基于注解的开发支持与转换服务\n\nSpring 的 mvc schema 提供一个 `<annotation-driven>`\
  \ 元素，用于为 Spring MVC 应用程序配置基于注解的开发支持，如 flight-app Web 应用程序中所示：\n\n```\n<mvc:annotation-driven\n\
  \   conversion-service=\"applicationConversionService\"/>\n<bean id=\"applicationConversionService\"\
  \ class=\"sample.roo.flightapp.web.ApplicationConversionServiceFactoryBean\"\n />\n\
  ```\n\n这是一个 `<annotation-driven>` 元素，它确保传入请求映射到控制器（使用 `@Controller` 注解标注）以及控制器的特定\
  \ `@RequestMapping` 注解方法。`conversion-service` 属性配置 Spring 的 `ConversionService`，自定义转换器和格式化程序在其中注册。在深入了解\
  \ `<annotation-driven>` 元素配置的其他 Spring 功能详细信息之前，让我们快速看看 Spring 3 中引入的用于类型转换和格式化的\
  \ Converter 和 Formatter SPI。\n\n在您的应用程序中，可以使用 Converter SPI 或 Formatter SPI 来执行类型转换。当您想要从一种\
  \ Java 类型执行通用类型转换到另一种 Java 类型时，Converter SPI 很合适。例如，当您想要将 `java.util.Number` 转换为\
  \ `java.util.Date` 时，可以使用 Converter SPI。Formatter SPI 解决 Web 应用程序典型的转换需求，即在提交 HTML\
  \ 表单时需要将 String 值转换为特定 Java 类型，并在渲染表单以向用户显示时将 Java 类型转换为 String 值。可以认为 Formatter\
  \ SPI 是 Converter SPI 的简化版本，更适合 Web 应用程序环境，其中还需要对 String 值进行本地化。\n\n您可以使用 Spring\
  \ 提供的统一 ConversionService API 来访问转换和格式化功能。ConversionService 由转换器和格式化程序的注册表支持，在使用\
  \ ConversionService 执行类型转换时会应用它们。GenericConversionService 是 ConversionService 的一个具体实现，适用于大多数应用程序。我们将在本示例中稍后看到，flight-app\
  \ 应用程序如何使用 GenericConversionService API 在运行时执行通用类型转换。\n\n如果未指定 conversion-service\
  \ 属性，`<annotation-driven>` 元素会注册一个默认的 FormattingConversionService（它继承 GenericConversionService），用于执行\
  \ `java.lang.Number`、`java.util.Date`、`java.util.Calendar` 和 `java.lang.Long` 之间的转换。另外，如果应用程序的类路径中找到了\
  \ Joda Time (http://joda-time.sourceforge.net/) 库，还会安装完整的日期和时间格式化支持。\n\n> 在 Roo\
  \ 生成的 flight-app 应用程序中，您会在 pom.xml 文件中发现应用程序对 Joda Time 库的依赖；因此，为您的 Roo 生成的 Web\
  \ 应用程序安装了 Joda Time 库的格式化支持。\n\n`<annotation-driven>` 元素使用 `FormattingConversionServiceFactoryBean`\
  \ 作为创建 `FormattingConversionService` 实例的工厂。使用 `FormattingConversionService` 可确保在将数据绑定到控制器模型对象的字段（也称为命令对象）时，会对数字和日期等常见类型应用类型转换和格式化。需要注意的是，正是\
  \ `FormattingConversionService` 为 `@DateTimeFormat`（指 `Flight.java`）和 `@NumberFormat`\
  \ 注解提供支持。\n\n要将自定义转换器和格式化程序连接到 `ConversionService` 实例，`<annotation-driven>` 元素的\
  \ `conversion-service` 属性会设置已配置自定义转换器和格式化程序的 `ConversionService` 实例，如下所示：\n\n```\n\
  <mvc:annotation-driven\n    conversion-service=\"myConversionService\" />\n\n<bean\
  \ id=\"myConversionService\" class=\"org.springframework.format.support.FormattingConversionServiceFactoryBean\"\
  >\n    <property name=\"converters\">\n        <list>\n            <bean class=\"\
  com.flight.myCustomConverter\"/>\n        </list>\n    </property>\n</bean>\n```\n\
  \n给定配置表明，您可以使用 `FormattingConversionServiceFactoryBean` 类的 `converters` 属性设置自定义转换器。如果快速查看\
  \ `FormattingConversionServiceFactoryBean`，您会发现它不支持 `formatters` 属性来配置自定义格式化程序。那么，我们如何注册自定义格式化程序呢？要注册自定义格式化程序，您需要扩展\
  \ `FormattingConversionServiceFactoryBean` 类并覆盖其 `installFormatters` 方法来设置自定义格式化程序。\n\
  \n在我们的 Roo 生成的 flight-app 应用程序中，`conversion-service` 属性引用了 Roo 生成的 `ApplicationConversionServiceFactoryBean`，它扩展了\
  \ Spring 的 `FormattingConversionServiceFactoryBean`。`ApplicationConversionServiceFactoryBean`\
  \ 定义了转换器，用于将 `Flight` 和 `FlightDescription` JPA 实体实例转换为由实体实例属性名称及其值组成的 `String`\
  \ 值。\n\nApplicationConversionServiceFactoryBean.java 文件中的以下代码清单显示了 Roo 生成的 ApplicationConversionServiceFactoryBean\
  \ 类：\n\n```\nimport org.springframework.format.FormatterRegistry;\nimport org.springframework.format.support.FormattingConversionServiceFactoryBean;\n\
  import org.springframework.roo.addon.web.mvc.controller.RooConversionService;\n\n\
  @RooConversionService\npublic class ApplicationConversionServiceFactoryBean extends\
  \ FormattingConversionServiceFactoryBean {\n    @Override\n    protected void installFormatters(FormatterRegistry\
  \ registry) {\n        super.installFormatters(registry);\n    }\n}\n```\n\n在给定代码中，ApplicationConversionServiceFactoryBean\
  \ 表示一个应用程序级的 ConversionService，应用程序转换器和格式化程序在其中注册。您可以在 installFormatters 方法内注册自定义格式化程序和转换器。\n\
  \n@RooConversionService 触发生成 `*_Roo_ConversionService.aj` AspectJ ITD 文件。`*_Roo_ConversionService.aj`\
  \ 为应用程序中的 JPA 实体定义转换器。这些转换器将 JPA 实体实例转换为由实体字段名称及其值组成的 String 表示形式。JPA 实体实例的 String\
  \ 表示形式用于在 Roo 生成的 Web 页面上以字符串形式显示实体实例。以下代码清单显示了 flight-app 应用程序的 ApplicationConversionServiceFactoryBean_Roo_ConversionService.aj\
  \ 文件：\n\n```\nprivileged aspect ApplicationConversionServiceFactoryBean_Roo_ConversionService\
  \ {\n    static class ApplicationConversionServiceFactoryBean.FlightConverter implements\
  \ Converter<Flight, String> {\n        public String convert(Flight flight) {\n\
  \            return new StringBuilder().append(flight.getDepartureDate()).append(\"\
  \ \").append(flight.getArrivalDate()).toString();\n        }\n    }\n\n    static\
  \ class ApplicationConversionServiceFactoryBean.FlightDescriptionConverter implements\
  \ Converter<FlightDescription, java.lang.String> {\n        public String convert(FlightDescription\
  \ flightDescription) {\n            ...\n        }\n    }\n\n    public void installLabelConverters(FormatterRegistry\
  \ registry) {\n        registry.addConverter(getFlightConverter());\n        registry.addConverter(getFlightDescriptionConverter());\n\
  \    }\n\n    public void afterPropertiesSet() {\n        super.afterPropertiesSet();\n\
  \        installLabelConverters(getObject());\n    }\n}\n```\n\n- FlightConverter\
  \ 静态类：它是 Flight 实体的转换器。它实现 Spring 的 Converter 接口并提供其 convert 方法的实现。convert 方法将 Flight\
  \ 实体实例转换为 String。\n- FlightDescriptionConverter 静态类：它是 FlightDescription 实体的转换器。它实现\
  \ Spring 的 Converter 接口并提供其 convert 方法的实现。convert 方法将 FlightDescription 实体实例转换为\
  \ String。\n- installLabelConverters：它使用 Spring 的 FormatterRegistry（用于注册转换器的扩展了 Spring\
  \ 的 ConverterRegistry）为 Flight 和 FlightDescription JPA 实体注册转换器。\n- afterPropertiesSet：这是用于初始化\
  \ ApplicationConversionServiceFactoryBean 的方法。该方法调用 installLabelConverters 为 JPA\
  \ 实体注册转换器。\n\n\n\n默认情况下，`<annotation-driven>` 元素还会在应用程序的类路径中发现 JSR 303 提供程序时配置 JSR\
  \ 303 – Bean 验证。如本教程后面所述，JSR 303 验证用于验证 Spring MVC 控制器的模型对象（也称为命令对象）。\n\n在 Roo 生成的\
  \ flight-app 应用程序中，你会发现应用程序在 pom.xml 文件中对 Hibernate Validator 库的依赖；因此，你可以确定你的应用程序已安装\
  \ JSR 303 支持。\n\n如果你想使用基于 Spring Validation API 的自定义验证器来验证模型对象，而不是使用 JSR 303 验证，那么请使用\
  \ `<annotation-driven>` 元素的 validator 属性进行配置。\n\n## ResourceHttpRequestHandler\n\
  \n由于 Web 应用程序需要提供图片、CSS 和 JS 文件等静态资源，Roo 通过 mvc schema 的 `<resources>` 元素配置 Spring\
  \ 的 ResourceHttpRequestHandler，如下所示：\n\n```\n<mvc:resources location=\"/\",\n  \
  \      classpath:\"/META-INF/web-resources/\"\n        mapping=\"/resources/**\"\
  \ />\n```\n\nlocation 属性指定提供资源的位置。它接受逗号分隔的资源位置值。/ 值指 Web 应用程序根目录，而 classpath:/META-INF/web-resources\
  \ 值表示静态资源也可以从类路径中任何 JAR 文件的 META-INF/web-resources 目录提供。需要注意的是，资源是按照 location 属性中指定的位置顺序进行搜索的。\n\
  \nmapping 属性指定 ResourceHttpRequestHandler 适用的传入资源请求的 URL 映射模式。\n\n## DefaultServletHttpRequestHandler\n\
  \nRoo 将 DispatcherServlet 映射到 /（请参阅 flight-app 应用程序的 web.xml 文件），Servlet 容器的默认 Servlet\
  \ 也映射到该路径。由于 Servlet 容器的默认 Servlet 负责提供静态资源，将 DispatcherServlet 映射到 / 会覆盖默认资源提供行为。为解决将\
  \ DispatcherServlet 映射到 / 所引起的静态资源提供问题，Roo 使用 mvc schema 的 `<default-servlet-handler>`\
  \ 元素配置 Spring 的 DefaultServletHttpRequestHandler，它将资源提供委托给 Servlet 容器的默认 Servlet，如下所示：\n\
  \n```\n<mvc:default-servlet-handler />\n```\n\n## Theme and locale change interceptors\n\
  \n由于大多数 Web 应用程序都需要支持多个 *区域设置* 和 *主题*，Roo 在 Web 应用程序上下文 XML 中配置 Spring 的 `LocaleChangeInterceptor`\
  \ 和 `ThemeChangeInterceptor` bean，以简化更改 Web 应用程序的区域设置和主题，如下所示：\n\n```\n<mvc:interceptors>\n\
  \    <bean class=\"org.springframework.web.servlet.theme.ThemeChangeInterceptor\"\
  />\n    <bean class=\"org.springframework.web.servlet.i18n.LocaleChangeInterceptor\"\
  \n        p:paramName=\"lang\" />\n</mvc:interceptors>\n```\n\n在给定代码中，Spring mvc\
  \ schema 的 `<interceptors>` 元素用于在控制器处理请求之前/之后配置拦截器，用于请求的前/后处理。默认情况下，`ThemeChangeInterceptor`\
  \ 检查名为 `theme` 的请求参数以确定要应用的主题，而 `LocaleChangeInterceptor` 检查名为 `locale` 的请求参数以确定与传入请求关联的当前区域设置。\n\
  \n## ParameterizableViewController\n\n在 Spring MVC 应用程序中，控制器负责处理传入请求并返回 *逻辑* 视图名称和视图数据。`DispatcherServlet`\
  \ 将逻辑视图名称交给配置在 Web 应用程序上下文中 Spring 的 `ViewResolver`，它解析与逻辑视图名称对应的实际视图。然后 `DispatcherServlet`\
  \ 渲染实际视图。那么，这是否意味着即使 Web 应用程序需要显示静态 Web 页面，也需要为其创建 Spring MVC 控制器呢？没错，这就是 Spring\
  \ MVC 的 `ParameterizableViewController` 内置控制器派上用场的地方。`ParameterizableViewController`\
  \ 只需返回一个 *预配置* 视图名称，该名称由 `ViewResolver` 解析并由 `DispatcherServlet` 渲染。这样就省去了创建自定义控制器的麻烦，该控制器除了返回要渲染的视图名称外什么也不做。你可以直接在\
  \ Web 应用程序上下文中配置 `ParameterizableViewController`，也可以使用 Spring mvc schema 的 `<view-controller>`\
  \ 元素来完成此操作。\n\n对于我们的 `flight-app` 应用程序，Roo 对静态视图（例如 `flight-app` 应用程序的主页和各种异常页面）使用了\
  \ `<view-controller>` 元素，如下所示：\n\n```\n<mvc:view-controller path=\"/\" view-name=\"\
  index\" />\n<mvc:view-controller path=\"/uncaughtException\" />\n```\n\n在 `<view-controller>`\
  \ 元素中，`view-name` 属性标识由 `path` 属性标识的 URL 路径映射的视图名称。因此，如果用于访问 `flight-app` 应用程序的\
  \ URL 是 `http://localhost:8080/flight-app/`，则该 URL 对应的视图名称为 `index`。\n\n如果未为 view-controller\
  \ 元素指定 view-name 属性（如用于未捕获异常的 <view-controller> 元素的给定代码所示），则将使用为 DispatcherServlet\
  \ 配置的 RequestToViewNameTranslator 来解析视图名称。RequestToViewNameTranslator 在 Web 应用程序上下文中配置，并由\
  \ DispatcherServlet 用于在处理请求的控制器未返回视图名称时确定视图名称。由于 Roo 在 Web 应用程序上下文中未配置任何 RequestToViewNameTranslator，因此将使用默认实现\
  \ DefaultRequestToViewNameTranslator 来确定视图名称。DefaultRequestToViewNameTranslator\
  \ 只需删除 URI 的前导和尾随斜杠以及任何文件扩展名，然后将结果值用作视图名称。因此，如果我们尝试使用以下 URL 调用对应于未捕获异常视图控制器元素的 ParameterizableViewController：http://localhost:8080/flight-app/uncaughtException，则\
  \ DefaultRequestToViewNameTranslator 将简单地返回 uncaughtException 作为应由 DispatcherServlet\
  \ 渲染的视图名称。\n\n## View resolution\n\nSpring Web MVC 应用程序需要 ViewResolver 来从控制器返回的逻辑视图名称中解析实际视图。创建\
  \ Spring Web MVC 应用程序时，Roo 在 Web 应用程序上下文中配置 Spring 的 UrlBasedViewResolver（ViewResolver\
  \ 接口的一个实现），它返回实际视图。由于 Spring Web MVC 中的每个视图都由实现 View 接口的类表示，UrlBasedViewResolver\
  \ 必须了解它必须生成与逻辑视图名称对应的实际 View 类。以下片段显示了 Roo 为 flight-app 应用程序生成的 UrlBasedViewResolver\
  \ 配置：\n\n```\n<bean class=\"org.springframework.web.servlet.view.UrlBasedViewResolver\"\
  \ id=\"tilesViewResolver\">\n<property name=\"viewClass\"\nvalue=\"org.springframework.web.servlet.view.tiles2.TilesView\"\
  \ />\n</bean>\n```\n\nUrlBasedViewResolver 将视图名称解析为 URL，而无需你显式将每个视图名称映射到 URL。例如，如果视图名称为\
  \ mypage，则 UrlBasedViewResolver 可以使用前缀（使用 prefix 属性）/WEB-INF/jsp 和后缀（使用 suffix 属性）.jsp\
  \ 将前缀和后缀附加到视图名称，以创建指向 Web 应用程序 /WEB-INF/jsp 文件夹中 mypage.jsp 页面的 URL。在这里，视图名称为 mypage，由\
  \ UrlBasedViewResolver 映射到的 URL 是 /WEB-INF/jsp/mypage.jsp。由于 Roo 配置的 UrlBasedViewResolver\
  \ 未使用 suffix 和 prefix 属性，实际视图的 URL 与控制器返回的逻辑视图名称相同。\n\n\n\n如果你想在 Spring MVC 控制器实现中将请求重定向或转发到另一个\
  \ URL，则不需要返回视图名称，而是可以返回带有 `redirect:` 或 `forward:` 前缀的字符串值。如果控制器返回重定向或转发 URL，则 `UrlBasedViewResolver`\
  \ 不执行视图解析。相反，它将请求重定向或转发到控制器返回的 URL。\n\n由于 Roo 使用 Apache Tiles 2 框架来简化 JSP 开发，`UrlBasedViewResolver`\
  \ 的 `viewClass` 属性设置为 `TilesView`。Tiles 支持通过 Spring 的 `TilesConfigurer` 在 Web 应用程序上下文中配置，如我们稍后将看到。TilesView\
  \ 对应的 Tile 定义名称是由 `UrlBasedViewResolver` 解析的 *实际视图 URL*。在 *飞行应用* 的示例中，我们讨论过，`UrlBasedViewResolver`\
  \ 生成的 *实际视图* URL 与视图的逻辑名称相同；因此，Tile 定义的名称也与控制器返回的视图逻辑名称 *相同*。\n\n要全面了解 Roo 生成的 Web\
  \ 应用程序中视图是如何解析的，请考虑以下 `<view-controller>` 元素配置的控制器：\n\n```\n<mvc:view-controller\
  \ path=\"/\" view-name=\"index\" />\n```\n\n如前所述，由给定 `view-controller` 元素配置的 `ParameterizableViewController`\
  \ 将返回视图名称为 `index`。由于未配置 `UrlBasedViewResolver` 的 `suffix` 或 `prefix` 属性，实际视图 URL\
  \ 也为 `index`。现在，TilesView 指向与 `UrlBasedViewResolver` 生成的 *实际视图* URL 值同名的 Tile 定义；因此，Tile\
  \ 定义的名称也是 `index`。总结一下，我们之前看到的配置了的 `ParameterizableViewController` 将显示其 Tile 定义名称为\
  \ `index` 的视图（你可以在 `WEB-INF/views/views.xml` 文件中找到此 Tile 定义名称）。\n\n## Tiles 定义\n\
  \nTiles 定义在 XML 文件中定义，并通过 `TilesConfigurer` 在 Web 应用程序上下文中配置，如下所示：\n\n```\n<bean\
  \ class=\"org.springframework.web.servlet.view.tiles2.TilesConfigurer\" id=\"tilesConfigurer\"\
  >\n<property name=\"definitions\">\n<list>\n<value>/WEB-INF/layouts/layouts.xml</value>\n\
  <value>/WEB-INF/views/**/views.xml</value>\n</list>\n</property>\n</bean>\n```\n\
  \n`TilesConfigurer` 的 `definitions` 属性指定 Tiles 定义 XML 文件。这些文件的路径也可以使用通配符。例如，`/WEB-INF/views/**/views.xml`\
  \ 路径会加载 `/WEB-INF/views/` 目录中所有 `views.xml` 文件的 Tiles 定义。\n\n## 异常处理\n\n在典型的 Web\
  \ 应用程序中，需要优雅地处理控制器抛出的异常。当控制器抛出异常时，DispatcherServlet 会使用 Spring 的 HandlerExceptionResolver\
  \ 来解析异常。Roo 将 SimpleMappingExceptionResolver（HandlerExceptionResolver 的一个实现）配置为飞行应用程序的异常解析器，如下所示：\n\
  \n```\n<bean\n    class=\"org.springframework.web.servlet.handler.\n    SimpleMappingExceptionResolver\"\
  \n    p:defaultErrorView=\"uncaughtException\">\n    <property name=\"exceptionMappings\"\
  >\n        <props>\n            <prop key=\".DataAccessException\">dataAccessFailure</prop>\n\
  \            ...\n        </props>\n    </property>\n</bean>\n```\n\nSimpleMappingExceptionResolver\
  \ 将异常类名映射到错误视图名称。在给定的代码中，此映射通过 exceptionMappings 属性设置。你可以指定异常的完全限定类名，也可以使用子字符串将多个异常类名匹配到一个错误视图。例如，.DataAccessException\
  \ 将映射到 my.custom.DataAccessException 以及 org.springframework.dao.EmptyResultDataAccessException，在这两种情况下，DispatcherServlet\
  \ 都会尝试呈现 dataAccessFailure 视图。SimpleMappingExceptionResolver 的 defaultErrorView\
  \ 属性用于标识当未找到异常映射时应解析到的视图。\n\n## 其他配置\n\nSpring Roo 还在 webmvc-config.xml 中配置了以下类：\n\
  \n- ReloadableResourceBundleMessageSource：Spring 的内置 MessageSource 实现，用于从 WEB-INF/i18n\
  \ 文件夹加载资源包。\n- ResourceBundleThemeSource：Spring 的内置 ThemeSource 实现，用于为 Web 应用程序支持的每个主题加载\
  \ ResourceBundle。在飞行应用程序的上下文中，此配置加载 alt.properties 和 standard.properties 文件。\n-\
  \ CookieThemeResolver：Spring 的内置 ThemeResolver 实现，用于在浏览器中存储 Cookie 以识别用户选择的主题。\n\
  - CookieLocaleResolver：Spring 的内置 LocaleResolver 实现，用于在浏览器中存储 Cookie 以识别用户选择的语言环境。\n\
  - CommonsMultipartResolver：Spring 的内置 MultipartResolver 实现，它使用 Jakarta Commons FileUpload\
  \ 1.2 (http://commons.apache.org/fileupload/) 或更高版本来支持 Web 应用程序中的文件上传。\n\n现在，既然我们知道\
  \ Spring Roo 在我们的飞行应用程序中创建的配置，让我们来看看 Roo 生成的控制器类。\n\n## Roo 生成的控制器\n\nRoo 为每个尚未有对应控制器的\
  \ JPA 实体生成一个控制器。例如，在飞行应用程序中，Roo 分别为 Flight 和 FlightDescription JPA 实体创建了 FlightController\
  \ 和 FlightDescriptionController 控制器。FlightController.java 文件中的以下代码显示了由 Spring Roo\
  \ 生成的 FlightController：\n\n```java\n@RooWebScaffold(path = \"flights\", formBackingObject\
  \ = Flight.class)\n@RequestMapping(\"/flights\")\n@Controller\npublic class FlightController\
  \ {\n}\n```\n\n@Controller 注解表示 FlightController 是一个 Spring MVC 控制器组件。\n\n@RequestMapping\
  \ 类级别注解将传入请求映射到控制器类。控制器映射的 URI 由 @RequestMapping 注解中指定的值确定。例如，FlightController 映射到\
  \ /flights URI。如我们很快将看到，@RequestMapping 注解也可以在方法级别使用，以缩小类级别指定的映射范围。\n\n@RooWebScaffold\
  \ Roo 注解指示 Roo 生成一个包含 Flight JPA 实体（由 formBackingObject 属性标识）CRUD 操作的 ITD，并为对 Flight\
  \ JPA 执行 CRUD 操作创建 JSPX 视图。path 属性标识 /WEB-INF/views/ 中的子目录，FlightController 的视图工件（JSPX\
  \ 视图和 Tiles 定义 XML）将在此子目录中创建。请参阅 \"Creating a Spring MVC controller for a specific\
  \ JPA entity\" 配方，以查看 @RooWebScaffold 注解属性的详细列表。\n\n以下代码显示为 FlightController 创建的\
  \ AspectJ ITD：\n\n```java\nimport javax.validation.Valid;\n\nprivileged aspect FlightController_Roo_Controller\n\
  {\n\n@RequestMapping(method = RequestMethod.POST)\npublic String FlightController.create(@Valid\
  \ Flight flight,\n...)\n```\n\n```java\n{\n    if (bindingResult.hasErrors())\n\
  \    {\n        ...\n        return \"flights/create\";\n    }\n    ...\n    flight.persist();\n\
  \    return \"redirect:/flights/\" + ...;\n}\n...\n```\n\n关于给定代码，需要注意的重要点如下：\n\n\
  - `@RequestMapping` 方法级别注解的 `method` 属性指定，如果控制器接收到 HTTP POST 请求，则会调用 `FlightController`\
  \ 的 `create` 方法。`create` 方法表示将 `Flight` 实体持久化到数据库中的控制器方法。\n- `create` 方法的返回值可以是\
  \ `flight/create` 或 `redirect:/flights/...` 字符串值。如果返回值是 `flight/create`，则飞行应用程序显示映射到\
  \ `flight/create` Tiles 定义名称的网页。如果返回值是 `redirect:/flights/`，则将其解释为重定向 URL（如前所述），`DispatcherServlet`\
  \ 会将请求重定向到该 URL。\n- 你可能注意到，`create` 方法的 `Flight` 参数带有 `@Valid` JSR 303 Bean 验证注解。使用\
  \ `@Valid` 注解会导致在将 `Flight` 实体持久化到数据库之前调用对其的验证。\n\n在 `FlightController_Roo_Controller.aj\
  \ ITD` 中定义的以下 `createForm` 方法，突出了 `@RequestMapping` 注解的另一种用法：\n\n```java\n@RequestMapping(params\
  \ = \"form\", method = RequestMethod.GET)\npublic String FlightController.createForm(Model\
  \ uiModel)\n{\n    ...\n    return \"flights/create\";\n}\n```\n\n`createForm` 方法显示用于在其中输入创建\
  \ `Flight` 实体所需详细信息的 HTML 表单。如果 `FlightController` 处理程序接收到的请求包含名为 `form` 的请求参数（由\
  \ `params` 属性指定），并且请求使用的方法是 HTTP GET（由 `method` 属性指定），则会调用 `createForm` 方法。\n\n\n\
  \n\n以下 `delete` 方法定义在 `FlightController_Roo_Controller.aj` ITD 中，展示了使用 `@RequestMapping`\
  \ 注解的另一种方式：\n\n```\n@RequestMapping(value = \"/{flightId}\",\n            method\
  \ = RequestMethod.DELETE)\npublic String FlightController.delete(\n            @PathVariable(\"\
  flightId\") Long flightId, ..)\n{\n    ..\n}\n```\n\n`delete` 方法从数据库中删除一个 `Flight`\
  \ JPA 实体。方法级 `@RequestMapping` 的 `value` 属性缩小了由类级 `@RequestMapping` 注解指定的映射范围。我们之前看到，`FlightController`\
  \ 的类级 `@RequestMapping` 指定 /flights 为 `FlightController` 映射的 URI。这意味着，`delete` 方法映射到\
  \ /flights/{flightId} URI 模板。现在，{flightId} 是一个变量，其值由提交的请求确定。当 {flightId} 变量的值代入\
  \ URI 模板时，它就变成了一个 URI。那么，{flightId} 变量的值从哪里来？它来自请求 URI。例如，如果请求 URI 是 /flights/1，那么\
  \ {flightId} 变量的值为 1。如你在给定代码中所见，方法参数名为 `flightId` 已使用 `@PathVariable` 注解。注解 `@PathVariable(\"\
  flightId\")` 检索 {flightId} 变量的值并将其绑定到 `Long` 类型的 `flightId` 方法参数。\n\n> @PathVariable\
  \ 不仅将 URI 变量的值绑定到方法参数，还执行类型转换。\n\n如果你查看 `FlightController_Roo_Controller.aj` 或 `FlightDescriptionController_Roo_Controller.aj`\
  \ ITD 的代码，你会发现负责处理 HTTP POST、PUT 和 DELETE 方法的控制器方法返回一个重定向 URL（使用 `redirect:` 前缀指定），也就是说，Spring\
  \ MVC 控制器自动实现 PRG（Post-Redirect-Get）模式。\n\n## 还有更多...\n\n在本示例中，我们看到 Spring Roo 在幕后完成了大量工作，为我们提供了一个功能齐全的\
  \ Spring Web MVC 应用程序。根据你选择的 Web 前端，你还可以使用 Roo 内置的 Flex 和 GWT 支持来创建 Web 应用程序。在下一章中，我们将探讨\
  \ Spring Roo 对使用 Flex、GWT 和 Spring Web Flow 框架创建 Web 应用程序的支持。\n\n## 另请参阅\n\n- 参阅“使用\
  \ Flex 开发应用程序入门”和“从 JPA 实体构建 Flex 应用程序”示例，了解 Spring Roo 如何简化 Flex 应用程序开发。\n- 参阅“从\
  \ JPA 实体构建 GWT 应用程序”示例，了解如何使用 Spring Roo 开发基于 GWT 的应用程序\n- 参阅“使用 Spring Web Flow\
  \ 入门”示例，了解 Spring Roo 如何支持使用 Spring Web Flow 框架开发应用程序的详细信息\n\n## 打包、部署和使用 Roo 生成的\
  \ Spring MVC 应用程序\n\n如果不打包、部署和使用 Spring MVC 应用程序，则开发任务不完整。在本示例中，我们将探讨 Roo 生成的 Spring\
  \ Web MVC 应用程序如何打包、部署和运行。\n\n### 准备工作\n\n删除 C:\\roo-cookbook 目录中 ch04-recipe 子目录的内容。\n\
  \n将 ch04_web-app.roo 脚本复制到 ch04-recipe 目录中。\n\n执行 ch04_web-app.roo 脚本，该脚本创建 flight-app\
  \ Roo 项目，将 Hibernate 设置为持久化提供程序，将 MySQL 配置为应用程序的数据库，创建 Flight 和 FlightDescription\
  \ JPA 实体，并定义 Flight 和 FlightDescription 实体之间的多对一关系。如果你使用的数据库不是 MySQL，或者你的连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 C:\\roo-cookbook\\ch04-recipe 目录启动 Roo shell。\n\n### 操作步骤\n\n要打包、部署和使用 Roo 生成的\
  \ Spring Web MVC 应用程序，请遵循以下步骤：\n\n- 1. 执行 controller all 命令，为 flight-app 项目中的 JPA\
  \ 实体创建控制器和视图，如下所示：\n\n  roo> controller all --package ~.web\n\n- 2. 使用 Roo 的 perform\
  \ package 命令打包 flight-app Web 应用程序：\n\n  roo> perform package\n\n- 3. 执行 perform\
  \ package 命令将在 flight-app 项目的 target 目录中创建名为 flight-app-0.1.0.BUILD-SNAPSHOT.war\
  \ 的 WAR 文件。你现在可以将 WAR 文件部署到你的应用程序服务器。\n\n- 4. 如果你想直接在嵌入式 Tomcat 实例中以动态 Web 应用程序的方式运行\
  \ flight-app 项目，请退出 Roo shell 并执行以下 Maven 命令：\n\n  ..ch04-recipe> mvn tomcat:run\n\
  \n  现在，你可以通过访问以下 URL 来访问 flight-app 应用程序：http://localhost:8080/flight-app\n\n  如果你看到以下网页，则表示你已成功在嵌入式\
  \ Tomcat 实例上部署 flight-app 应用程序：\n\n  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_172_0.png)\n\
  \n- 5. 从菜单中选择“创建新航班描述”选项，并在相应字段中输入 Origin、Destination 和 Price 的值，以创建新的航班描述，如下图所示：\n\
  \n  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_172_1.png)\n\n  单击 Save 按钮保存输入的航班描述。\n\
  \n- 6. 现在，从菜单中选择“创建新航班”选项，并选择出发日期和到达日期，如下图所示：\n\n  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_173_0.png)\n\
  \n  由于出发日期和到达日期字段是日期类型字段，将显示一个弹出式日历以简化这些字段的日期输入。你可能会注意到，航班描述字段是一个下拉字段，显示你已创建的所有航班描述。Roo\
  \ 显示航班描述下拉列表，因为 Flight 和 FlightDescription JPA 实体之间存在多对一关系。\n\n  现在，单击 Save 按钮保存航班详细信息。\n\
  \n- 7. 你可以分别单击“列出所有航班描述”和“列出所有航班”菜单选项来查看新创建的航班描述和航班详细信息。你还可以通过单击“按目的地和原始地查找”菜单选项，根据原始地和目的地搜索航班描述。按目的地和原始地查找选项之所以可用，是因为我们为\
  \ FlightDescription JPA 实体定义了一个查找方法（请参阅 ch04_web_app.roo 脚本）。\n\n- 8. 默认情况下，Roo\
  \ 生成的 flight-app 应用程序中安装了两个主题：standard 和 alt（由 flight-app 项目的 standard.properties\
  \ 和 alt.properties 文件表示）。Flight-app 应用程序的默认主题是 standard。你可以通过选择 alt 主题来更改 Flight-app\
  \ 应用程序的主题，如下图所示：\n\n  ![](img/b8c379a2ed921ead3aa2b01811dc29fa_174_0.png)\n\n- 9.\
  \ 如截图所示，选择 alt 主题会将菜单选项移至右侧，并将页面的主内容移至左侧。如前所述，用户选择的主题保存在浏览器 Cookie 中；因此，如果你关闭浏览器并重新打开，你会发现\
  \ alt 主题已默认应用于 Flight-app 应用程序的网页中。\n\n### 工作原理\n\nperform package 命令运行 Maven 的\
  \ package 命令，从而对项目进行打包。该项目被打包为 WAR 文件，因为 flight-app 项目指定的打包（根据 pom.xml 文件中的 <packaging>\
  \ 元素）为 war。需要注意的是，执行 perform package 命令时，不会执行测试。它执行 Maven 的 package 命令并指定跳过测试，如下所示：\n\
  \n```\n..ch04-recipe>mvn package -Dmaven.test.skip\n```\n\n如前所述，Roo 的 perform 命令可用于执行\
  \ Maven 命令。你可以从 Roo shell 执行 Maven 的 package 命令（并执行测试），如下所示：\n\n```\n.. roo> perform\
  \ command --mavenCommand package\n```\n\n> **不要从 Roo shell 运行嵌入式 Tomcat 实例**\n>\n\
  > 你可以使用 Roo 的 perform 命令在嵌入式 Tomcat 实例中运行 flight-app 项目作为 Web 应用程序，但你不应该这样做，因为这会创建一个不同的进程，你无法使用\
  \ CTRL+C 停止它，而且也无法从 Roo shell 执行 Roo 命令。\n\nflight-app 项目的 pom.xml 文件配置了 Tomcat\
  \ Maven 插件（http://mojo.codehaus.org/tomcat-maven-plugin/index.html），这使得可以在嵌入式 Tomcat\
  \ 实例中将 flight-app 项目作为动态 Web 应用程序运行。以下 XML 片段显示了 Tomcat Maven 插件的配置：\n\n\n\n<plugin>\n\
  <groupId>org.codehaus.mojo</groupId>\n<artifactId>tomcat-maven-plugin</artifactId>\n\
  <version>1.0</version>\n</plugin>\n\n您可以配置插件以影响嵌入式 Tomcat 实例的行为。例如，如果您想要将默认的 8080\
  \ HTTP 端口更改为 8090，则可以在在 Tomcat 实例上运行项目时提供 maven.tomcat.port 系统属性，如下所示：\n\n```\n\
  .ch04-recipe> mvn tomcat:run -Dmaven.tomcat.port=8090\n```\n\n## 更多内容...\n\nRoo\
  \ 还提供了 perform assembly 命令，它执行 Maven Assembly 插件（http://maven.apache.org/plugins/maven-assembly-plugin/，在\
  \ Roo 项目的 pom.xml 文件中配置）的 assembly 目标。您只有在希望将项目作为存档（例如 ZIP、TAR、WAR、JAR 等）分发时才应使用\
  \ perform assembly 命令。此可分发存档包含项目的配置文件、项目文档和运行时依赖项。\n\n## 在嵌入式 Jetty 容器中运行 Roo 项目\n\
  \nRoo 在 pom.xml 文件中配置了 Jetty Maven 插件（http://docs.codehaus.org/display/JETTY/Maven+Jetty+Plugin），以支持在嵌入式\
  \ Jetty 容器中将 Roo 项目作为 Web 应用程序运行。要在嵌入式 Jetty 容器中运行 flight-app 项目，您只需在包含项目 pom.xml\
  \ 文件的目录中执行该插件的 jetty:run 目标即可：\n\n```\n.ch04-recipe> mvn jetty:run\n```\n\n如果您希望将\
  \ Jetty 容器监听 HTTP 请求的默认 8080 HTTP 端口更改为 8090，则可以通过指定 jetty.port 系统属性来配置它，如下所示：\n\
  \n```\n.ch04-recipe> mvn jetty:run -Djetty.port=8090\n```\n\n## 另请参阅\n\n- 有关 Roo\
  \ 生成的 JSPX 视图及如何自定义其布局的详细信息，请参阅“修改 Roo 生成的视图”配方。\n- 要了解如何自定义 Roo 安装的默认主题以及如何将新主题添加到\
  \ Roo 生成的 Web 应用程序，请参阅“添加或修改 Roo 生成的主题”配方。\n- 有关 Spring Roo 提供的国际化支持，请参阅“国际化 Roo\
  \ 生成的 Web 应用程序”配方。\n\n## 修改 Roo 生成的视图\n\n在大多数应用程序场景中，您可能希望修改 Roo 生成的视图的布局，更改不同表单元素的位置，或向视图添加新的表单元素。在本配方中，我们将探讨如何修改\
  \ flight-app 应用程序的主页。\n\n以下屏幕截图显示了 flight-app 应用程序修改后的主页：\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_176_0.png)\n\
  \n以下是我们将对 Roo 生成的 flight-app 应用程序进行的修改，以按给定屏幕截图显示主页：\n\n- 将 Web 应用程序的主页更改为显示名为航班应用程序的应用程序\n\
  - 将 Web 应用程序的主页更改为详细描述航班应用程序，而不是 Roo 的优势。\n- 更改显示在每个 Web 页面顶部的横幅图像\n- 更改菜单分类，以在\
  \ **创建** 类别下显示 **创建新的航班描述** 和 **创建新航班** 选项，在 **查看** 类别下显示 **列出所有航班描述** 和 **列出所有航班**，并在\
  \ **查找** 类别下显示 **按目的地和来源查找**。\n\n### 准备工作\n\n删除 C:\\roo-cookbook 目录中 ch04-recipe\
  \ 子目录的内容。\n\n将 ch04_web_app.roo 脚本复制到 ch04-recipe 目录。\n\n执行 ch04_web-app.roo 脚本，该脚本会创建\
  \ flight-app Roo 项目，将 Hibernate 设置为持久性提供程序，将 MySQL 配置为应用程序的数据库，创建 Flight 和 FlightDescription\
  \ JPA 实体，并定义 Flight 和 FlightDescription 实体之间的多对一关系。如果您使用的数据库不是 MySQL，或者您的连接设置与脚本中指定的不同，请相应地修改脚本。\n\
  \n从 C:\\roo-cookbook\\ch04-recipe 目录启动 Roo shell。\n\n执行 controller all 命令，为 flight-app\
  \ 项目中的 JPA 实体创建相应的控制器和视图，如下所示：\n\n```\n.. roo> controller all --package ~.web\n\
  ```\n\n由于在处理 controller all 命令期间，许多依赖项会添加到 flight-app 项目的 pom.xml 文件中，因此请执行 Roo\
