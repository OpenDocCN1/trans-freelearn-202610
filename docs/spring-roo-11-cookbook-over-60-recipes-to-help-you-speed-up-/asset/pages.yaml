- pgno: 95
  md: "# How it works...\n\nThe execution of the `test mock` command creates a JUnit\
    \ test, `FlightTest.java`, which is responsible for mock testing of the `Flight`\
    \ entity, as shown here:\n\n```\npackage sample.roo.flightapp.domain;\n\n@RunWith(JUnit4.class)\n\
    @MockStaticEntityMethods\npublic class FlightTest {\n\n    @Test\n    public void\
    \ testMethod() {\n        int expectedCount = 13;\n        Flight.countFlights();\n\
    \n        ..AnnotationDrivenStaticEntityMockingControl.\n            expectReturn(expectedCount);\n\
    \n        ..AnnotationDrivenStaticEntityMockingControl.playback();\n        org.junit.Assert.assertEquals(expectedCount,\n\
    \                Flight.countFlights() );\n    }\n}\n```\n\nIf you are using Spring\
    \ Roo 1.1.3, then you'll have to add the `@MockStaticEntityMethods` and `@RunWith(JUnit4.class)`\
    \ annotations in Roo-generated mock tests, as shown.\n\nIn the code listing, the\
    \ `@MockStaticEntityMethods` annotation represents a Spring annotation which supports\
    \ mock testing of static entity methods, like count and finder methods. Spring\
    \ defines an `AnnotationDrivenStaticEntityMockingControl` aspect, which applies\
    \ to methods of a test class annotated with `@MockStaticEntityMethods` and mocks\
    \ calls to the static methods of the persistent entity. Additionally, the `AnnotationDrivenStaticEntityMockingControl`\
    \ aspect defines the `expectReturn` and `playback` methods to simplify writing\
    \ mock tests.\n\nAs the `AnnotationDrivenStaticEntityMockingControl` aspect applies\
    \ to any class annotated with `@MockStaticEntityMethods`, it makes it possible\
    \ to write tests using any testing framework (JUnit or TestNG) for mock testing\
    \ entities. For testing of instance methods defined in the entity, you'll continue\
    \ to use the common approaches for mock testing using **EasyMock**, **Mockito**,\
    \ and so on."
  merge: -1
  img_proc: true
