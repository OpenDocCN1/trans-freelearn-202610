- pgno: 31
  md: "Notice the change in the Roo prompt after the execution of the `project` command.\
    \ The change in prompt indicates that you are now working with a project whose\
    \ top-level package is `sample.roo.flightapp`. If you start the Roo shell from\
    \ a directory, which already contains a Roo project, then the Roo prompt will\
    \ not change.\n\n# How it works...\n\nThe following table describes the purpose\
    \ of each of the arguments passed to the `project` command:\n\n| Argument | Purpose\
    \ |\n| --- | --- |\n| topLevelPackage | This is a Mandatory argument, which identifies\
    \ the base or root package of your project. You will refer to this package frequently\
    \ in your Roo commands using the tilde symbol (~). The value of this argument\
    \ becomes the value of the `<group-id>` element in maven's pom.xml file. |\n|\
    \ java | This is an optional argument, which specifies the version of Java (must\
    \ be 5, 6, or 7) with which the source and compiled classes of the Roo project\
    \ should be compatible with. If unspecified, the Java version is auto-detected\
    \ by Spring Roo. |\n| projectName | This is an optional argument, which specifies\
    \ the name of the project. The value of this argument becomes the value of `<artifact-id>`\
    \ and `<name>` elements in maven's pom.xml file. If unspecified, the last part\
    \ of the package name specified as the value of `topLevelPackage` argument is\
    \ used. For instance, if the `topLevelPackage` argument value is `sample.roo.flightapp`,\
    \ and the `projectName` argument is not specified, the value of `projectName`\
    \ argument is assumed to be `flightapp`. |\n\n> # Use TAB or CTRL + SPACE regularly\
    \ for discovering mandatory and optional attributes, and their pre-defined values\n\
    > \n> As it's hard to remember all the mandatory and optional attributes of different\
    \ Roo commands, it's recommended that you use TAB (if you are using standalone\
    \ Roo) or CTRL + SPACE (if you are using Roo from within Eclipse or STS) to use\
    \ the auto-completion feature of Roo. Roo not only provides auto-completion of\
    \ Roo commands (as we saw in an earlier recipe), but it also displays the mandatory\
    \ arguments of a command when you press TAB or CTRL + SPACE. If you want to know\
    \ about the optional arguments of a command, simply enter -- followed by TAB or\
    \ CTRL + SPACE. To restrict users from entering any arbitrary value, a command\
    \ argument may accept only a particular value from a set of pre-defined values\
    \ for that argument. The pre-defined values are defined by the add-on responsible\
    \ for processing the command. If an argument accepts a value from a set of pre-defined\
    \ values by Roo, it is displayed when you press TAB or CTRL + SPACE."
