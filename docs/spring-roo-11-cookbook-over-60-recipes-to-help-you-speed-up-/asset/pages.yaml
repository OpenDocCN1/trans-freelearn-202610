- pgno: 26
  md: 'The `help` command provides a list of commands that are supported by a particular
    version of Spring Roo, accompanied with a short description of the purpose of
    the command. The commands listed by the `help` command are the only commands that
    you can execute from the Roo shell.


    It is important to note that you may not be able to execute some of the Roo commands
    listed by `help` command, if they are not applicable to your Roo project. For
    instance, if you haven''t set up a JPA persistence provider for your enterprise
    application, the Roo shell doesn''t allow you to execute commands for creating
    JPA entities.


    # Getting ready


    To execute the commands defined in this recipe, first create an empty directory
    from which you will start your Roo shell. For instance, you can create a sub-directory
    named `ch01-recipe` inside the `cookbook-recipe` directory in the `C:` drive.
    Go to the `ch01-recipe` directory and execute `roo.bat` batch file to start the
    Roo shell.


    # How to do it...


    To get help and hints from Roo follow the given steps:


    +   1. To get help from Spring Roo, all you need to do is enter the `help` command
    in your Roo shell. But, we will do it a bit differently in our case. Instead of
    entering the complete command name, enter the letter `h` and press `TAB` (if you
    are using standalone Spring Roo installation) or `CTRL + SPACE` if you are using
    Spring Roo installed in Eclipse IDE or STS. You will get the following output
    from the Roo shell:


    ```

    roo> h

    help hint

    roo> h

    ```


    As shown in the given code, the Roo shell provides the list of matching commands
    that it finds. In this case, it''s `help` and `hint`. Now, enter `he` into the
    Roo shell and press `TAB` or `CTRL + SPACE`. You will notice that now the Roo
    shell automatically completes the command for you to reflect the matching `help`
    command.


    Once you enter the `help` command, you will get the list of commands supported
    by Spring Roo, shown as follows:


    ```

    roo> help

    ......

    * class - Creates a new Java class source file in any project path

    * interface - Creates a new Java interface source file in any project path

    * project - Creates a new project

    ```'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   * quit - Exits the shell

    +   * version - Displays shell version

    +   .....


    As you can see, the `help` command provides a short description about all the
    commands supported by Spring Roo. For instance, it tells you that you can use
    the `quit` command to exit the Roo shell and the `version` command to know the
    version of Spring Roo that you are currently using.


    +   2. Now that you know how `help` command is useful, let''s try out the `hint`
    command, shown as follows:


    ```

    roo> hint

    Welcome to Roo! We hope you enjoy your stay!

    Before you can use many features of Roo, you need to start a new

    project.

    To do this, type ''project'' (without the quotes) and then hit TAB.

    Enter a --topLevelPackage like ''com.mycompany.projectname'' (no

    quotes).

    When you''ve finished completing your --topLevelPackage, press

    ENTER.

    Your new project will then be created in the current working

    directory.

    .....

    ```


    As you can see from the given output, Spring Roo shows the hint on how to go about
    creating a project using the `project` command. We will make use of the `hint`
    command in later recipes to discover how it is useful in creating a fully functional
    project.


    # How it works...


    As mentioned earlier, Spring Roo consists of core services and add-ons. Add-ons
    are meant for generating code based on commands executed by the developer. While
    executing commands like `hint` and `help`, Roo is not generating any code. You
    can say that these commands are processed by the core services and not by any
    Spring Roo add-on.


    # There''s more...


    Spring Roo also provides with the option to pass arguments to Roo commands, which
    is covered in the following section. Also when you execute a command from the
    Roo shell, it is recorded in a Roo script file, which is explained in the `Log
    file for executed Roo commands` section.'
