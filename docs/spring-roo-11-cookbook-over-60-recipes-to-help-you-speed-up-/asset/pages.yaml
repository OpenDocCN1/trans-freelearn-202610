    You can configure the plugin to affect the behavior of the embedded Tomcat instance.
    For instance, if you want to change the default 8080 HTTP port to 8090, then you
    can do so by supplying the maven.tomcat.port system property when running the
    project on the Tomcat instance, as shown here:


    ```

    .ch04-recipe> mvn tomcat:run -Dmaven.tomcat.port=8090

    ```


    # There''s more...


    Roo also provides a perform assembly command, which executes an assembly goal
    of Maven Assembly Plugin (http://maven.apache.org/plugins/maven-assembly-plugin/,
    configured in the pom.xml file of the Roo project). You should use the perform
    assembly command only if you want to distribute your project as an archive, such
    as ZIP, TAR, WAR, JAR, and so on. This distributable archive contains configuration
    files, project documentation, and runtime dependencies of the project.


    # Running Roo project in embedded Jetty container


    The Roo configures the Jetty Maven Plugin (http://docs.codehaus.org/display/JETTY/Maven+Jetty+Plugin)
    in the pom.xml file to support running the Roo project as a web application in
    an embedded Jetty container. To run the flight-app project in an embedded Jetty
    container, all you need to do is to execute the jetty:run goal of the plugin from
    the directory containing your project''s pom.xml file:


    ```

    .ch04-recipe> mvn jetty:run

    ```


    If you want to change the default 8080 HTTP port to 8090 on which the Jetty container
    listens for HTTP requests, then you can configure it by specifying the jetty.port
    system property, as shown here:


    ```

    .ch04-recipe> mvn jetty:run -Djetty.port=8090

    ```


