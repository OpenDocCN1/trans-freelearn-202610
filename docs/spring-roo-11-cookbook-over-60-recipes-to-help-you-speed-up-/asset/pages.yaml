- pgno: 155
  md: '# contextConfigLocation initialization parameter


    The contextConfigLocation context initialization parameter identifies Spring''s
    root web application context XML file(s), as shown here:


    ```

    <context-param>

    <param-name>contextConfigLocation</param-name>

    <param-value>

    classpath*:META-INF/spring/applicationContext*.xml

    </param-value>

    </context-param>

    ```


    The META-INF/spring/applicationContext.xml file contains bean definitions that
    are shared by all servlets and filters defined in the flight-app web application.
    These bean definitions are available to application contexts loaded by DispatcherServlet.
    As we saw in the Creating a Roo project recipe of Chapter 1, Getting Started with
    Spring Roo and in Setting up a JPA provider for your project recipe of Chapter
    2, Persisting Objects Using JPA an applicationContext.xml file contains bean definitions
    for configuring data sources, services, transactions, and so on, and needs to
    be shared across the web application.


    If you create additional application context XML files, which contain bean definitions
    that you want to share across the web application, then you can add them to the
    value of the contextConfigLocation parameter using commas or space separated values,
    as shown here:


    ```

    <param-value>

    classpath*:META-INF/spring/applicationContext*.xml,

    META-INF/spring/mycontext.xml

    </param-value>

    ```


    # ContextLoaderListener


    The root web application context, identified by the contextConfigLocation context
    initialization parameter, is loaded by the ContextLoaderListener, which implements
    javax.servlet.ServletContextListener, as shown here:


    ```

    <listener>

    <listener-class>

    org.springframework.web.context.ContextLoaderListener

    </listener-class>

    </listener>

    ```


    # DispatcherServlet


    The webmvc-config.xml file created by Roo identifies the web application context
    of the Roo-generated web application. The webmvc-config.xml file contains tile
    definitions, handler (or controller) definitions, handler mappings, view and exception
    resolution strategies, and so on. The DispatcherServlet of Spring is responsible
    for loading the webmvc-config.xml file and dispatching requests to appropriate
    handlers, resolving views, exceptions, and so on. In the web.xml of the flight-app,
    DispatcherServlet is configured to load webmvc-config.xml, as shown here:'
  merge: -1
  img_proc: true
- pgno: 156
  md: "```\n<servlet>\n    <servlet-name>flight-app</servlet-name>\n    <servlet-class>\n\
    \        org.springframework.web.servlet.DispatcherServlet\n    </servlet-class>\n\
    \    <init-param>\n        <param-name>contextConfigLocation</param-name>\n  \
    \      <param-value>\n            /WEB-INF/spring/webmvc-config.xml\n        </param-value>\n\
    \    </init-param>\n    <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\
    \nAs shown in the given code, the DispatcherServlet accepts the contextConfigLocation\
    \ initialization parameter that identifies the Spring's web application context\
    \ XML file. The scope of the application context loaded by the DispatcherServlet\
    \ is limited to the requests that are mapped to the DispatcherServlet.\n\nIf you\
    \ want to modularize your application, then consider creating a different web\
    \ application context for each module and configure a DispatcherServlet for each\
    \ module in the web.xml file.\n\n# OpenEntityManagerInViewFilter\n\nAs you might\
    \ be lazy about loading JPA entities in your web application, Roo configures the\
    \ OpenEntityManagerInViewFilter servlet filter in web.xml to bind the JPA EntityManager\
    \ to the thread in which a request is handled, as shown here:\n\n```\n<filter>\n\
    \    <filter-name>\n        Spring OpenEntityManagerInViewFilter\n    </filter-name>\n\
    \    <filter-class>org.springframework.orm.jpa.support.OpenEntityManagerInViewFilter\n\
    \    </filter-class>\n</filter>\n```\n\nThe OpenEntityManagerInViewFilter assumes\
    \ that the EntityManagerFactory for looking up the EntityManager instance is registered\
    \ with the root web application context and has the name entityManagerFactory.\
    \ If you change the id of the LocalContainerEntityManagerFactory bean defined\
    \ in META-INF/spring/applicationContext.xml file, then add a entityManagerFactoryBeanName\
    \ initialization parameter to the OpenEntityManagerInViewFilter definition in\
    \ web.xml to inform it about the LocalContainerEntityManagerFactory bean."
  merge: -1
  img_proc: true
- pgno: 157
  md: '# # HiddenHttpMethodFilter


    HTTP specification defines four methods: GET, POST, PUT, and DELETE, but HTML
    only supports GET and POST methods. As the semantics of different HTTP methods
    differ, in the REST approach it is recommended to use an appropriate HTTP method
    for sending an HTTP request. For instance, if you want to delete Flight instances
    from the database, then you should use the DELETE HTTP method and if you are updating
    Flight instances, then use a PUT HTTP method. The HTTP method with which the HTTP
    request was made is obtained using the getMethod() method of javax.servlet.HttpServletRequest.


    So, to perform PUT and DELETE operations in your web application, you can do a
    normal POST and along with it send an additional request parameter with the name
    _method whose value is either PUT or DELETE. Spring provides a HiddenHttpMethodFilter
    servlet filter, which reads the value of the _method parameter, creates an HttpServletRequest
    Wrapper and overrides the getMethod method of HttpServletRequest to return the
    value of the _method parameter—making it possible to perform PUT and DELETE HTTP
    operations in your web application.


    Spring Roo automatically configures HiddenHttpMethodFilter in the web.xml file
    generated for the web application, as shown here for the flight-app application:


    ```

    <filter>

    <filter-name>HttpMethodFilter</filter-name>

    <filter-class>org.springframework.web.filter.HiddenHttpMethodFilter

    </filter-class>

    </filter>

    ```


    The Spring Web MVC''s form tag library provides built-in support for dealing with
    different HTTP methods. For instance, the following form tag will result in performing
    an HTTP POST and send an additional request parameter named _method whose value
    is PUT:


    ```

    <form:form method="put">

    <input type="submit" value="Delete Flight"/>

    </form:form>

    ```


    In the given code, the method attribute of the form tag identifies the value that
    needs to be set for the _method request parameter when the form is submitted.


    > As Roo-generated JSPX files make heavy use of custom tags installed in the SRC_MAIN_WEBAPP\WEB-INF\tags
    folder, you will mainly find usage of the Spring MVC''s form tag library in these
    custom tags.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Exception pages


    By default, Roo configures exception pages for situations when unexpected exceptions
    occur or a resource is not found (HTTP status code 404), as shown here for unexpected
    exceptions:


    ```

    <error-page>

    <exception-type>java.lang.Exception</exception-type>

    <location>/uncaughtException</location>

    </error-page>

    ```


    As the Roo-generated application uses Apache Tiles 2 framework, the `<location>`
    element is not mapped to the actual HTML or JSPX view that is shown in response
    to the exception. Later in this recipe, we''ll see how Spring''s exception resolvers
    are used by Roo-generated web applications to resolve exceptions to logical views.


    Now, that we have seen configurations that form part of the `web.xml` file generated
    by Roo for the `flight-app` application, let''s now look at the web application
    context XML file: `webmvc-config.xml`, which is loaded by `DispatcherServlet`.
    The web application context, loaded by `DispatcherServlet`, is the place where
    request handlers, exception resolvers, theme and locale change interceptors, and
    so on, are registered.


    # Beans and configurations defined in webmvc-config.xml


    The `webmvc-config.xml` file contains configurations and bean definitions that
    are loaded by `DispatcherServlet`. Let''s now look at the `webmvc-config.xml`
    file in detail:


    # Controller auto-detection


    In Roo-generation web applications, controllers are auto-detected using the `<component-scan>`
    element of Spring''s `context` schema, as shown here:


    ```

    <context:component-scan base-package="sample.roo.flightapp"

    use-default-filters="false">

    <context:include-filter expression="

    "org.springframework.stereotype.Controller"

    type="annotation" />

    </context:component-scan>

    ```


    The `base-package` attribute specifies a comma separated list of packages, which
    are scanned by Spring for classes annotated with `@Repository`, `@Component`,
    `@Controller`, and `@Service` annotations. The `use-default-filters` attribute
    specifies if auto-detection of classes annotated with `@Repository`, `@Component`,
    `@Controller`, and `@Service` are enabled or disabled. By default, auto-detection
    is enabled. The value `false` indicates that auto-detection of these annotated
    classes are disabled. As the web application context loaded by `DispatcherServlet`
    should contain controller or handler components, the `<include-filter>` element
    specifies that only classes annotated with `@Controller` annotation are auto-detected
    by Spring.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "If you manually create controllers in a different package, then add the package\
    \ containing these controllers to the base-package attribute's value.\n\n# Annotation-driven\
    \ development support and conversion service\n\nSpring's mvc schema provides an\
    \ <annotation-driven> element, which configures annotation-driven development\
    \ support for Spring MVC applications, as shown here in the flight-app web application:\n\
    \n```\n<mvc:annotation-driven\n   conversion-service=\"applicationConversionService\"\
    />\n<bean id=\"applicationConversionService\" class=\"sample.roo.flightapp.web.ApplicationConversionServiceFactoryBean\"\
    \n />\n```\n\nIt is an <annotation-driven> element, which ensures that incoming\
    \ requests are mapped to controllers (annotated with @Controller annotation) and\
    \ to a particular @RequestMapping annotated method of the controller. The conversion-service\
    \ attribute configures Spring's ConversionService where custom converters and\
    \ formatters are registered. Before we go into the details of what other Spring\
    \ features are configured by the <annotation-driven> element, let's take a quick\
    \ look at Converter and Formatter SPIs introduced in Spring 3 for type conversion\
    \ and formatting purposes.\n\nIn your application, you can either use a Converter\
    \ SPI or a Formatter SPI to perform type conversions. A Converter SPI is suitable\
    \ when you want to perform general-purpose type conversions from one Java type\
    \ to another Java type. For instance, when you want to convert java.util.Number\
    \ to java.long.Date, you can use a Converter SPI. The Formatter SPI addresses\
    \ the conversion requirements typical of web applications, where you need to convert\
    \ a String value to a particular Java type when an HTML form is submitted and\
    \ to convert a Java type to a String value for displaying it to the user when\
    \ the form is rendered. You can say that the Formatter SPI is a simplified version\
    \ of the Converter SPI, and is more suitable for web application environments\
    \ where localization of String values is also required.\n\nYou can access conversion\
    \ and formatting functionalities using the unified ConversionService API provided\
    \ by Spring. The ConversionService is backed by a registry of converters and formatters,\
    \ which are applied when you perform a type conversion using ConversionService.\
    \ GenericConversionService is a concrete implementation of ConversionService,\
    \ which is appropriate for use in most applications. We will see later in this\
    \ recipe, how the flight-app application makes use of the GenericConversionService\
    \ API to perform a general-purpose type conversion at runtime.\n\nIf the conversion-service\
    \ attribute is not specified, the <annotation-driven> element registers a default\
    \ FormattingConversionService (which extends GenericConversionService) for performing\
    \ conversions to and from java.lang.Number, java.util.Date, java.util.Calendar,\
    \ and java.lang.Long. Also, full support for date and time formatting is installed\
    \ if the Joda Time (http://joda-time.sourceforge.net/) library is found in the\
    \ application's classpath."
  merge: -1
  img_proc: true
- pgno: 160
  md: "> > In a Roo-generated flight-app application, you will find a dependency of\
    \ the application on the Joda Time library in the pom.xml file; therefore, formatting\
    \ support for the Joda Time library is installed for your Roo-generated web application.\n\
    \nThe `<annotation-driven>` element makes use of the `FormattingConversionServiceFactoryBean`\
    \ as a factory for creating a `FormattingConversionService` instance. The use\
    \ of the `FormattingConversionService` ensures that type conversion and formatting\
    \ is applied for common types such as numbers and dates during data binding to\
    \ fields of controller model objects (also referred to as command objects). It\
    \ is important to note that it is the `FormattingConversionService` that provides\
    \ support for the `@DateTimeFormat` (referring to `Flight.java`) and for `@NumberFormat`\
    \ annotations.\n\nTo wire custom converters and formatters into the `ConversionService`\
    \ instance, the `conversion-service` attribute of the `<annotation-driven>` element\
    \ sets the `ConversionService` instance that is configured with custom converters\
    \ and formatters, as shown here:\n\n```\n```xml\n<mvc:annotation-driven\n    conversion-service=\"\
    myConversionService\" />\n\n<bean id=\"myConversionService\" class = \" ..format.FactoryConversionServiceFactoryBean\"\
    \ >\n    <property name=\"converters\">\n        <list>\n            <bean class=\"\
    com.flight.myCustomConverter\"/>\n        </list>\n    </property>\n</bean>\n\
    ```\n```\n\nThe given configuration shows that you can set custom converters using\
    \ the `converters` property of the `FormattingConversionServiceFactoryBean` class.\
    \ If you take a quick look at the `FormattingConversionServiceFactoryBean`, you\
    \ will find that it doesn't support a `formatters` property to allow configuring\
    \ custom formatters. So, how do we register custom formatters? To register custom\
    \ formatters, you will need to extend the `FormattingConversionServiceFactoryBean`\
    \ class and override its `installFormatters` method to set your custom formatters.\n\
    \nIn our Roo-generated flight-app application, the `conversion-service` attribute\
    \ refers to the Roo-generated `ApplicationConversionServiceFactoryBean`, which\
    \ extends Spring's `FormattingConversionServiceFactoryBean`. the `ApplicationConversionServiceFactoryBean`\
    \ defines converters, which convert `Flight` and `FlightDescription` JPA entity\
