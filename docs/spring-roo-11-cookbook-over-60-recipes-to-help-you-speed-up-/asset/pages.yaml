    # How it works...


    Roo-generated web application makes use of the messages.properties and the application.properties
    resource bundles to support internationalization of the web user interface. The
    application.properties file contains labels for menu and form fields that are
    displayed on various web pages of the Roo-generated web application. The labels
    contained in the application.properties file are derived from the name of JPA
    entities and their fields. Also, the name of the web application, as displayed
    on the home page of the application, is contained in the application.properties
    file. The messages.properties contains generic messages which are applicable to
    all Roo-generated web applications and are not specific to a single web application.
    For instance, labels for the Save button and Reset button are specified in the
    messages.properties file. Refer to the Internationalizing Roo-generated web applications
    recipe for details on how you can use these property files to internationalize
    or localize Roo-generated Spring Web MVC applications.


    Not all files generated by Roo are managed by Roo when changes occur in your JPA
    entities. For instance, the application.properties file is modified by Roo only
    when you add new JPA entities to your domain model or add new fields to them.
    Removing a field or a JPA entity will not automatically remove the label properties
    corresponding to the field or the JPA entity from the application.properties file.
    But modifying the name of a field in a JPA entity will result in adding new properties
    to the application.properties file. As Roo never tries to manage existing label
    properties defined in the application.properties file, you can safely change them.
    The messages.properties file contains generic labels; therefore, it is never managed
    by Roo once it is generated.


    The menu.jspx file and the JSPX files contained inside the WEB-INF/views folder
    is managed by Spring Roo. If you add, modify, or delete fields from JPA entities,
    then Roo is responsible for updating the corresponding JSPX views (inside the
    WEB-INF/views) to reflect the change. The menu.jspx file is managed by Roo to
    ensure that when new Spring Web MVC controllers are created or finder methods
    are added to a JPA entity for which a controller already exists, additional menu
    options are added to menu.jspx.


    Let''s now look at how we achieved the modified home page based on the actions
    that we performed on the Roo-generated flight-app project:'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Changing the displayed application name and welcome text


    To change the application name and welcome text, we first need to find the JSPX
    view, which

    shows the home page of the web application and then find the property in the `application`

    .properties file, which is used by the JSPX view to show the application name
    and welcome

    text. Alternatively, you can look at the property keys of the labels that you
    want to change

    in the `application.properties` file, followed by using your IDE to search for
    JSPX files,

    which make use of those property keys.


    Let''s first find the JSPX view that shows the home page of the `flight-app` application.
    In the

    `webmvc-config.xml` file, the following `<view-controller>` element suggests that
    when

    the request is received at the web application root `/`, then the view name is
    `index`:


    ```

    <mvc:view-controller path="/" view-name="index"/>

    ```


    Now, the following `UrlBasedViewResolver` in `webmvc-config.xml` suggests that
    we

    need to find the tile definition named `index` in the tiles definitions XML file
    to find the view:


    ```

    <bean class="org.springframework.web.servlet.view.

    UrlBasedViewResolver" id="tilesViewResolver">

    <property name="viewClass"

    value="org.springframework.web.servlet.view.

    tiles2.TilesView"/>

    </bean>

    ```


    The following `TilesConfigurer` configuration in `webmvc-config.xml` suggests
    where to

    look for tiles definitions XML to find tiles definition named `index`:


    ```

    <bean class="org.springframework.web.servlet.view.tiles2.TilesConfigurer" id="tilesConfigurer">

    <property name="definitions">

    <list>

    <value>/WEB-INF/layouts/layouts.xml</value>

    <value>/WEB-INF/views/**/views.xml</value>

    </list>

    </property>

    </bean>

    ```


    A quick scan of XML configuration files specified by `TilesConfigurer` shows that
    the

    `index` tiles definition is defined in the `SRC_MAIN_WEBAPP/WEB-INF/views/views.xml`

    file, as shown here:


    ```

    <definition name="index" extends="default">

    <put-attribute name="body"

    value="/WEB-INF/views/index.jspx" />

    </definition>

    ```'
  merge: -1
  img_proc: true
- pgno: 181
  md: "As we'll see in the Adding static views to Roo-generated web application recipe,\
    \ the <put-attribute> element refers to the JSPX file responsible for showing\
    \ the main content (which excludes the header, footer, and menu) of the page.\
    \ So, the /WEB-INF/views/index.jspx is the file, which shows the home page of\
    \ the flight-app application.\n\nThe following code shows the contents of the\
    \ index.jspx file:\n\n```\n<div xmlns:spring=\"http://www.springframework.org/tags\"\
    \n xmlns:util=\"urn:jsptagdir:/WEB-INF/tags/util\" .. >\n\n    <spring:message\
    \ var=\"app_name\" code=\"application_name\" .../>\n    <spring:message var=\"\
    title\"\n        code=\"welcome_titlepane\" arguments=\"${app_name}\" .../>\n\n\
    \    <util:panel id=\"title\" title=\"${title}\">\n        <h3>\n            <spring:message\
    \ code=\"welcome_h3\"\n                arguments=\"${app_name}\" />\n        </h3>\n\
    \        <p>\n            <spring:message code=\"welcome_text\" />\n        </p>\n\
    \    </util:panel>\n</div>\n```\n\nThe <message> tag of Spring's tag library retrieves\
    \ messages and labels from the resource bundle, which are Roo-generated application.properties\
    \ and messages.properties files in case of the flight-app application. The code\
    \ attribute identifies the property key whose value needs to be obtained from\
    \ the resource bundle. The var attribute identifies the variable to which the\
    \ returned property value is assigned. The arguments attribute specifies the arguments\
    \ that need to be passed to the <message> tag, which are typically used by the\
    \ <message> tag implementation to fill placeholders specified in the message or\
    \ label retrieved from the resource bundle.\n\nThe <panel> tag is one of the custom\
    \ tags installed by Roo when the controller all command was executed. The <panel>\
    \ tag is used to show a collapsible panel. To see the implementation of the <panel>\
    \ tag, refer to the /WEB-INF/tags/util/panel.tagx file."
  merge: -1
  img_proc: true
- pgno: 182
  md: 'The following table shows the properties file in which the messages and labels,
    as specified by the `<message>` tags in the `index.jspx` file, are located and
    their value:


    | Code | Property value |

    |---|---|

    | application_name | Defined in application.properties.<br>Value: Flight-app.
    |

    | welcome_titlepane | Defined in messages.properties.<br>Value: Welcome to {0}.
    |

    | welcome_h3 | Defined in messages.properties.<br>Value: Welcome to {0}. |

    | welcome_text | Defined in messages.properties.<br>Value: Spring Roo provides
    interactive, lightweight, ... |


    The {0} in the value of the `welcome_titlepane` and the `welcome_h3` represents
    a placeholder, which is filled by the value specified in the arguments attribute
    of the `<message>` element.


    The given table shows that if we change the `application_name` property, then
    it will change the application name as shown on the home page. And if we change
    the `welcome_text` property, then it will change the default welcome text.


    # ## Changing menu options


    The `menu.jspx` file shows the menu options in the Roo web application. The following
    table describes the tags that make up the `menu.jspx` file:


    | Tags | Description |

    |---|---|

    | `<menu>` | The `<menu>` custom tag (defined in `menu.tagx`) defines a menu.
    |

    | `<category>` | The `<category>` tag (defined in `category.tagx`) defines the
    top-level categories in the menu. |

    | `<item>` | The `<item>` tag (defined in `item.tagx`) defines items within the
    menu categories. |'
  merge: -1
  img_proc: true
- pgno: 183
  md: "The following attributes are applicable to all the tags installed by Spring\
    \ Roo (which includes the <menu>, <item>, and <category> tags for menu):\n\n+\
    \   id: The id attribute is used by Roo to check existence of elements in JSX\
    \ files. For Roo-generated views, the value of the id attribute is derived from\
    \ the JPA entity name and field names. For example, the menu item **Create new\
    \ Flight Description**, created by the `<menu:item>` element, has the id attribute\
    \ value `i_flightdescription_new`, and is derived from the name of the `FlightDescription`\
    \ JPA entity. If you remove the `<menu:item>` element with id `i_flightdescription_new`,\
    \ then Roo finds out that the element has been removed and adds it to the JSX\
    \ file _again_.\n+   \n+   In some cases, the value of the id attribute is also\
    \ used by tag implementations to determine the message or label that should be\
    \ used in the implementation of a tag. For example, if the `messageCode` attribute\
    \ is not specified, `i_flightdescription_new` id of the `<menu:item>` element\
    \ is used by the `item.tagx` implementation to find the label associated with\
    \ the menu item.\n\n+   render: The render attribute specifies whether the contents\
    \ of the tag should be rendered or not. By default, the value of the render attribute\
    \ is `true`, that is, the contents of the tag, including enclosing tags, should\
    \ be rendered. Set the value to `false`, if you don't want the contents of the\
    \ tag and its enclosing tags to be rendered.\n\n+   z: The z attribute is used\
    \ internally by Spring Roo to check if the developer has made any modifications\
    \ to the tag. It is this, z attribute that allows Roo to perform round tripping.\
    \ The value of the z attribute represents a hash key for a tag used in the JSX\
    \ file and is calculated based on the tag name, attributes present in the tag,\
    \ and their values. The z attribute is never used in the calculation of the hash\
    \ key. Also, the order in which the attributes are specified in the tag is not\
    \ considered for the hash key calculation.\n\n+   If you make any modification\
    \ to a tag (by adding attributes, modifying attribute values, or deleting any\
    \ attribute), then Roo finds this out because the hash key of the tag now will\
    \ not match with the Roo calculated hash key for the tag. In case of a mismatch,\
    \ Roo simply sets the value of z to `user-managed`.\n\n# Significance of z attribute\
    \ of Roo installed JSP tags\n\nLet's consider the following element in menu.jspx\
    \ to understand the relelance of the z attribute:\n\n```\n<menu:item id=\"i_flightdescription_new\"\
    \nmessageCode=\"global_menu_new\"\nurl=\"/flightdescriptions?form\"\nz=\"DFDc4F2kZR5yns4ZeMk5pr3E84=\"\
    \ />\n```"
  merge: -1
  img_proc: true
- pgno: 184
