- pgno: 146
  md: 'In the given code, the @RooDbManaged annotation indicates that the FlightDescTbl
    entity is managed by the database reverse engineering process of Roo. As shown
    in this code, the FlightDescTbl class is empty and only contains class-level annotations.
    The @RooDbManaged annotation controls the creation of the *_Roo_DbManaged.aj ITD.
    The automaticallyDelete attribute of the @RooDbManaged annotation specifies whether
    the entity should be removed if the table is removed from the database. The default
    value is true, which means that the JPA entity will be removed from the Roo project
    if you delete the corresponding database table followed by executing the database
    reverse engineer command.


    # There''s more...


    Let''s now look at how we can install JDBC drivers for Oracle and DB2 databases,
    override JPA fields and relationships generated by the database reverse engineering
    process, perform incremental database reverse engineering, and how composite primary
    cases are handled by Roo.


    # Installing JDBC drivers for Oracle and DB2


    The database reverse engineering process of Roo requires a JDBC driver to be available
    as an OSGi bundle. Roo provides an addon create wrapper command, which you can
    use to wrap the JDBC driver inside an OSGi compliant bundle for use with the database
    reverse engineering process. Roo provides OSGi compliant bundles for most of the
    JDBC drivers, which can be installed by using the addon install command. As open-source
    JDBC drivers for Oracle and DB2 are not available, to use Roo''s database reverse
    engineering process against these databases, you first need to convert the non-OSGi
    JDBC driver JAR files of these databases into OSGi compliant bundles.


    In Chapter 7, we''ll look at how the addon create wrapper command is used to convert
    a non-OSGi JDBC driver JAR or any other Maven artifact into OSGi compliant bundles.


    # Modifying auto-generated JPA fields/relationships


    If you want to make a modification to the JPA fields and relationships generated
    by the database reverse engineering process, then define them in the JPA entity
    class itself. The field and relationship that you define in the JPA entity class
    will be automatically removed by Roo from the corresponding *_Roo_DbManaged.aj
    ITD file.


    > If you define all the JPA fields and relationships in your entity class, then
    Roo will automatically delete the corresponding *_Roo_DbManaged.aj ITD file.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Incremental database reverse engineering


    You can use the database reverse engineering process throughout the lifecycle
    of your project. If modifications are made to the database, then execute the `database
    reverse engineer` command, without using the `schema` and `package` arguments.
    The database reverse engineering process updates the `dbre.xml` file, which in
    turn results in the addition, deletion, and modification of JPA entities, their
    fields and relationships.


    The `dbre.xml` file is managed by Roo but you can modify it, before modifying
    the database, to see the impact of changes to the Roo-generated JPA entities.
    It should be noted that when you re-execute the `database reverse engineer` command,
    then your custom changes to the `dbre.xml` file will be overwritten.


    # Database table with composite primary key


    If your database table has a composite primary key, then the database reverse
    engineering process takes care of creating a primary key class which gets annotated
    with JPA @Embeddable annotation (via the *_Roo_Identifier.aj ITD). The primary
    key class is then introduced into the JPA entity class (via the *_Roo_Entity.aj
    ITD) and is annotated with the JPA @EmbeddedId annotation.


    # See also


    +   Refer to the Generating database metadata recipe to see how to view metadata
    information of database tables'
  merge: -1
  img_proc: true
