- pgno: 185
  md: 'A couple of interesting things to notice about the `create.jspx` file generated
    by Roo are as follows:


    +   - The `<create>` custom tag (refer to `/WEB-INF/tags/form/create.tagx`) is
    used for creating an HTML form. If you look at the `create.tagx` file, you will
    find that it makes use of Spring''s `form` tag library to create a form. The `render`
    attribute specifies that the form should not be rendered if there are certain
    dependencies that we need to create before creating the `Flight` entity. Soon
    we will see from where the `dependencies` variable is coming from.


    +   - The `<datetime>` custom tag (refer to `/WEB-INF/tags/form/fields/datetime.tagx`)
    is used to create a text field for entering departure the date of the flight.
    The `field` attribute identifies the `Flight` JPA entity''s field for which the
    text field has been created. The text field is associated with a `dijit` (Dojo''s
    UI JavaScript library) date calendar to simplify entering a date into the field.


    +   - The `<select>` custom tag (refer to `/WEB-INF/tags/form/fields/select.tagx`)
    is used to create a drop-down box for selecting the flight description associated
    with the flight that we are about to create. Again, the `field` attribute identifies
    the `Flight` JPA entity''s field for which the drop-down box has been created.
    The `required` attribute specifies whether or not it is mandatory to select a
    flight description for creating a `Flight` entity. As the value of the `required`
    attribute is `true`, you must select a flight description from the drop-down to
    create the `Flight` entity.


    As we can see, Roo intelligently decided that the `<datetime>` tag should be used
    for creating fields corresponding to the `Date` type, such as the `departureDate`
    field of the `Flight` entity. Roo also interpreted the `@ManyToOne` relationship
    between the `Flight` and `FlightDescription` JPA entities and created a drop-down
    box (using the `<select>` tag) for selecting flight descriptions. As the `@ManyToOne`
    relationship between the `Flight` and `FlightDescription` entities is also annotated
    with `@NotNull` (JSR-303 annotation), Roo translates that dependency on the user
    interface side by setting the `required` attribute to `true` for the `<select>`
    tag.


