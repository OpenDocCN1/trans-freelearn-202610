- pgno: 362
  md: 'In the given code, `flightId` represents the primary key of the `Flight` entity.
    The `persist` method of the `Flight` entity makes use of the `createKey` method
    of the `KeyFactory` class to create the primary key. The `createKey(parent, kind,
    name)` method accepts primary key information of the **parent** entity (`FlightDescription`
    is the parent in the case of `Flight` entity), the **kind** (which is similar
    to the concept of tables in relational databases), and the **name** of the key
    that uniquely identifies the entity within the **kind**. In the case of the `Flight`
    entity''s primary key, the `kind` refers to the simple name of the entity class:
    `Flight.class.getSimpleName()` and the `name` of the key is the `flightName` property
    of the `Flight` entity. So, if you re-create a `Flight` entity with `flightName`
    as `FLT-100`, then it will overwrite the existing `Flight (FLT-100)` entity instance.
    GAE datastore doesn''t support a composite primary key, but you can still achieve
    it by concatenating multiple entity field values in creating the `name` of the
    key.


    The `encodedFlightDescriptionId` is the `String` form of the `FlightDescription`
    primary key who is the parent of `Flight` entity instance. The value of `encodedFlightDescriptionId`
    is set when the user selects the `FlightDescription` from the user interface for
    creating the `Flight` instance, as shown here:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_362_0.png)


    The `<option>` element corresponding to the `FlightDescription (NYC-DELHI-1200)`
    entity instance is rendered as shown here:


    ```

    <option value="<string value of Key>">NYC-DELHI for only 1200 USD</option>

    ```


    The `value` attribute specifies the `String` form of the `FlightDescription` primary
    key (which is of type `Key`). So, when the user clicks the **Create** button,
    the `String` value of `Key` is bound to the `encodedFlightDescriptionId` field
    of the `Flight` instance.


    The `flightapp-gae-spring-mvc` project contains the `KeyEditor` property editor
    class that uses `KeyFactory` to perform conversion from `Key` to `String` format
    and vice versa. The property editor has been used instead of a Spring `ConversionService`
    implementation because the `ConversionService` implementation doesn''t currently
