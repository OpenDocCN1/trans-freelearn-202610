    +   6. If you see the output as shown, it means you have successfully installed
    Spring Roo. You will notice that when you execute `roo.bat` or `roo.sh`, the command
    prompt changes to `roo>>`. You are now ready to play with Spring Roo.


    # How it works...


    Spring Roo is built on top of Apache Felix (http://felix.apache.org/site/index.html)
    OSGi container, which promotes modularity and dynamic assembly of applications.
    The bundle directory contains OSGi bundles that form part of Spring Roo release.
    These bundles provide core services required by Roo and add-ons that support code
    generation. When you first start Spring Roo by executing Roo batch file or shell
    script, then these bundles are installed and copied into the cache directory of
    your Spring Roo installation.


    # There''s more...


    Spring Roo comes with certain core services and base add-ons that are part of
    Spring Roo distribution. Core services like the Roo shell, file system monitor,
    bootstrap, and so on, provide the necessary infrastructure for the add-ons to
    perform their intended responsibility. Add-ons are at the heart of Spring Roo
    and they provide the code generation functionality. For instance, the e-mail add-on
    adds e-mail support and the JPA (Java Persistence API) add-on helps with setting
    up a JPA provider, creating JPA entities, their relationships, and so on.


    As Roo add-ons are OSGi compliant, you can additionally create a custom add-on
    or download a third-party add-on and install it as part of your Spring Roo installation
    to extend Roo''s functionality.


    # Using Spring Roo with Eclipse/STS


    As Roo is a command-line driven tool, you may want to integrate it with a feature
    rich IDE like Eclipse or STS to simplify application development. If you are using
    STS, you don''t need to worry about integrating Roo with it because support for
    Roo is built into STS. If you want to integrate Roo with Eclipse, you can install
    STS components in Eclipse, in the same way as you install any other Eclipse plugin.


    If you are using any other IDE or you don''t want to integrate your Eclipse IDE
    with Spring Roo, you can run Spring Roo in the background and use your favorite
    IDE to develop your enterprise application. As you make modifications to your
    enterprise application using your IDE, Spring Roo will work in the background
    to manage the enterprise application.'
  merge: -1
