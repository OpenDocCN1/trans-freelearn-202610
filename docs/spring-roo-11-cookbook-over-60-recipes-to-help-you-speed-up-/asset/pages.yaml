- pgno: 278
  md: 'The name of the AspectJ ITD file corresponding to the @RooFlexScaffold annotation
    has the following naming convention: <JPA-entity-name>Service_Roo_Service.aj,
    where <JPA-entity-name> is the name of the JPA entity specified by the entity
    attribute of the @RooFlexScaffold annotation.


    Invoking Spring-managed remoting destination methods from the Flex client may
    require sending and receiving objects. For instance, the show method of FlightDescriptionService
    returns a FlightDescription object and the create method accepts a FlightDescription
    object. Flex allows exchanging data between the Flex client and remoting destination
    method by auto-converting the ActionScript object to the Java object and vice
    versa. As the Flex client in the flightapp_flex application exchanges flight description
    details with the FlightDescriptionService remoting destination, Roo generates
    ActionScript classes corresponding to the JPA entity managed by FlightDescriptionService.
    The following code shows the Roo-generated FlightDescription.as ActionScript class
    corresponding to the FlightDescription JPA entity:


    ```

    FlightDescription.as

    package sample.roo.flightapp.domain{

    [RemoteClass(alias="sample.roo.flightapp.domain.FlightDescription")]

    public class FlightDescription {

    public var destination:String;

    public var id:Number;

    public var origin:String;

    public var price:Number;

    public var version:Number;

    }

    }

    ```


    This code shows that the FlightDescription.as ActionScript class defines the same
    attributes as the corresponding FlightDescription JPA entity. The [RemoteClass]
    metadata tag specifies the remote Java object to which the ActionScript object
    maps. The alias attribute specifies the fully-qualified class name of the remote
    Java object to which the ActionScript object maps.


    Roo creates ActionScript and MXML files corresponding to each JPA entity so that
    CRUD operations can be performed on JPA entities from the scaffolded Flex user
    interface. The following table describes each of these Roo-generated files (located
    in ROOT\src\main\flex\sample\roo\flightapp\presentation\flightdescription and
    ROOT\src\main\flex\sample\roo\flightapp\presentation\flight directories):'
