    argument of the entity command result in the generation of an integration test
    and seed data for an entity. In situations where you''re creating your own integration
    tests, you may still want to use the Roo-generated seed data for an entity. So,
    you are writing your custom integration test class but using a Roo-generated ''data
    on demand'' class. This is where the dod command of Spring Roo comes into the
    picture.


