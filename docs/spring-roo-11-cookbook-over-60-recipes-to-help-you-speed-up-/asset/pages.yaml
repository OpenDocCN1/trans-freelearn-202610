- pgno: 397
  md: "# MysimpleNameProperty enum type\n\nThe following code shows the MysimpleNameProperty\
    \ enum type, which defines constants for the countryOfOrigin argument value of\
    \ the web mvc install tags command:\n\n```\npublic enum MysimplePropertyName {\n\
    \    AUSTRALIA(\"Australia\"),\n    UNITED_STATES(\"United States\"),\n    GERMANY(\"\
    Germany\"),\n    NOT_SPECIFIED(\"None of your business!\");\n\n    private String\
    \ propertyName;\n\n    private MysimplePropertyName(String propertyName) {\n \
    \       Assert.hasText(propertyName, \"Property name required\");\n        this.propertyName\
    \ = propertyName;\n    }\n\n    ...\n}\n```\n\nIn the code, constant AUSTRALIA\
    \ is associated with value Australia, UNITED_STATES is associated with value United\
    \ States, and so on. We saw earlier that the countryOfOrigin argument is of type\
    \ MysimplePropertyName. We can only pass String type values for an argument from\
    \ the Roo shell, so what we should specify as the value of the countryOfOrigin\
    \ argument, and how it'll get converted to MysimplePropertyName. When you enter\
    \ a partial value for the countryOfOrigin argument and press the Tab key, Roo\
    \ internally refers to MysimplePropertyName to find a matching constant. For instance,\
    \ if you enter au as the value of the countryOfOrigin argument, Roo attempts to\
    \ find the constant that matches au in MysimpleNameProperty and auto-completes\
    \ the value. As the matching is case-insensitive, the value au of the countryOfOrigin\
    \ argument is completed by the Roo shell as AUSTRALIA."
