- pgno: 244
  md: "+   Define one or more methods in the interface to return a top-level object\
    \ that the rest of the application would use. The Ginjector creates the top-level\
    \ object by injecting dependencies of the lower-level objects based on the bindings\
    \ configured by the Ginjector. In the case of the flightapp-gwt application, ScaffoldDesktopApp\
    \ and ScaffoldMobileApp represent top-level objects.\n\n+   Define a GinModule\
    \ or AbstractGinModule (both are part of GIN API) class that defines bindings\
    \ for the dependencies. The ScaffoldModule class in flightapp-gwt defines bindings\
    \ for EventBus, PlaceController, and ApplicationRequestFactory.\n\n+   Annotate\
    \ the method, contructor, or field of your classes where you want Ginjector to\
    \ perform dependency injection with the @Inject annotation (part of Guice API).\
    \ In the case of flightapp-gwt, ApplicationDetailsActivites, ApplicationMasterActivites,\
    \ and so on, make use of the @Inject annotation to let Ginjector inject dependencies.\n\
    \nLet's now look at the code created by Roo corresponding to each of the activities\
    \ described previously.\n\nThe following code shows the DesktopInjector interface:\n\
    \n```\nDesktopInjector.java\npackage sample.roo.flightapp.client.scaffold.ioc;\n\
    ..\nimport sample.roo.flightapp.client.scaffold.ScaffoldDesktopApp;\nimport com.google.gwt.inject.client.GinModules;\n\
    \n@GinModules(value = {ScaffoldModule.class})\npublic interface DesktopInjector\
    \ extends ScaffoldInjector {\n\n    ScaffoldDesktopApp getScaffoldApp();\n}\n\
    ```\n\nDesktopInjector extends the ScaffoldInjector interface (which in turn extends\
    \ GIN's Ginjector interface) and defines a single method—getScaffoldApp, which\
    \ returns the ScaffoldDesktopApp object. So, the responsibility of Ginjector implementation\
    \ generated by the GWT compiler is to return an instance of ScaffoldDesktopApp\
    \ with all its dependencies injected with appropriate implementations."
