- pgno: 393
  md: "# Making Roo commands unavailable\n\nIf certain pre-conditions are not met,\
    \ you may want to make a Roo command unavailable to the Roo shell. For instance,\
    \ if you have not yet created a Roo project using the project command, then Roo\
    \ doesn't allow you to set up a JPA persistence provider using the persistence\
    \ setup command.\n\n+   The @CliAvailabilityIndicator is a method-level Roo annotation\
    \ that lets you specify the pre-conditions that must be met for a Roo command\
    \ to be available to the Roo shell. The following code shows the methods in the\
    \ MysimpleCommands class that define the availability conditions for the say hello\
    \ and web mvc install tags commands:\n\n```\nimport org.springframework.roo.shell.CliAvailabilityIndicator;\n\
    ...\n@Reference private MysimpleOperations operations;\n...\n@CliAvailabilityIndicator(\"\
    say hello\")\npublic boolean isSayHelloAvailable() {\n    return true;\n}\n\n\
    @CliAvailabilityIndicator(\"web mvc install tags\")\npublic boolean isInstallTagsCommandAvailable()\
    \ {\n    return operations.isInstallTagsCommandAvailable();\n}\n```\n\nIn the\
    \ code, @CliAvailabilityIndicator annotated methods define the availability of\
    \ the say hello and web mvc install tags commands. The value specified in the\
    \ @CliAvailabilityIndicator annotation identifies the name of the Roo command\
    \ for which the method is executed to determine the command's availability. For\
    \ instance, the isSayHelloAvailable method defines the availability of the say\
    \ hello command and the isInstallTagsCommandAvailable method defines the availability\
    \ of the web mvc install tags command. The return type of @CliAvailabilityIndicator\
    \ annotated methods is boolean and the method must be a public method which doesn't\
    \ accept any arguments. If the value returned by the @CliAvailabilityIndicator\
    \ annotated method is true, then it means that the corresponding command is available,\
    \ else it is unavailable.\n\nAs the isSayHelloAvailable method always returns\
    \ true, the say hello command is always available to the Roo shell. On the other\
    \ hand, the isInstallTagsCommandAvailable method consults the MysimpleOperations\
    \ implementation to determine the availability of the web mvc install tags command.\n\
    \nLet's now look at the MysimpleOperationsImpl class, which defines the majority\
    \ of the logic executed when the mysimple add-on Roo commands are executed from\
    \ the Roo shell."
  merge: -1
  img_proc: true
- pgno: 394
  md: '# # The MysimpleOperations interface and MysimpleOperationsImpl class


    The MysimpleOperations interface defines three methods as described in the following
    table:


    | Method | Description |

    |---|---|

    | boolean isInstallTagsCommandAvailable() | Checks if the tags sub-directory exists
    in the SRC_MAIN_WEBAPP/WEB-INF directory of your Roo project. Returns true if
    the directory exists. |

    | String getProperty(String) | Accepts a system property as an argument and returns
    its value. |

    | void installTags() | Copies info.tagx and show.tagx tag files from the mysimple
    add-on to your Roo project. |


    The MysimpleOperationsImpl class implements the MysimpleOperations interface.
    The methods defined in the MysimpleCommands class mainly delegate processing of
    logic to the implementation of the MysimpleOperations interface. The following
    code shows the MysimpleOperationsImpl class (methods have not been shown for brevity):


    ```

    import org.springframework.roo.process.manager.FileManager;

    import org.springframework.roo.project.ProjectOperations;


    @Component

    @Service

    public class MysimpleOperationsImpl

    implements MysimpleOperations {

    private static final char SEPARATOR = File.separatorChar;


    @Reference private FileManager fileManager;


    @Reference private ProjectOperations projectOperations;

    ... }

    ```


    The MysimpleOperationsImpl class is annotated with @Component and @Service Apache
    Flex annotations, which means OSGi''s SCR is responsible for managing the lifecycle
    of the MysimpleOperationsImpl component and registering it as a service with the
    OSGi service registry. Like MysimpleCommands, you can access the MysimpleOperationsImpl
    instance from other add-ons using the @Reference Apache Felix annotation.'
  merge: -1
  img_proc: true
- pgno: 395
  md: "Roo provides many built-in services which simplify add-on development. FileManager\
    \ and ProjectOperations types represent services provided by Roo for managing\
    \ files (like creating, reading, updating files, undo capability, and so on) and\
    \ performing actions on the Roo project (like adding dependencies to the pom.xml\
    \ file, updating project type, and so on), respectively. FileManager service and\
    \ ProjectOperations are provided by the Process Manager and FileManager core modules\
    \ of Roo, respectively. It is important to note that add-ons are different from\
    \ core modules in Roo. The core modules provide vital features of the Spring Roo\
    \ tool, like file system monitoring, registering commands with the Roo shell,\
    \ and so on. Roo commands provided by add-ons are executed by Spring Roo users\
    \ for code generation but Roo commands provided by core modules are primarily\
    \ meant for accessing internal features of Spring Roo, like obtaining metadata,\
    \ setting polling speed, and so on.\n\nWe saw earlier that the isInstallTagsCommandAvailable\
    \ method of MysimpleOperations is invoked by the isInstallTagsCommandAvailable\
    \ method of the MysimpleCommands class to check the availability of the web mvc\
    \ install tags command. The following code shows the isInstallTagsCommandAvailable\
    \ method of MysimpleOperationsImpl:\n\n```\npublic boolean isInstallTagsCommandAvailable()\
    \ {\n    return\n        projectOperations.isProjectAvailable() &&\n        fileManager.exists(projectOperations.getProjectMetadata()\n\
    \        .getPathResolver().getIdentifier(Path.SRC_MAIN_WEBAPP,\n        \"WEB-INF\"\
    \ + SEPARATOR + \"tags\"));\n}\n```\n\nIn the code, the isInstallTagsCommandAvailable\
    \ method makes use of ProjectOperation services to check if a Roo project exists.\
    \ The method also makes use of the FileManager service to check if a tags sub-directory\
    \ exists in the SRC_MAIN_WEBAPP/ WEB-INF directory of your Roo project. If a tags\
    \ directory doesn't exist or you haven't yet created a Roo project, then the method\
    \ returns false. This means the web mvc install tags Roo command is not available\
    \ to the Roo shell if you haven't yet created a Roo project which contains a tags\
    \ sub-directory inside the SRC_MAIN_WEBAPP/WEB-INF directory.\n\nWe saw earlier\
    \ that the installTags method of MysimpleCommands invokes the installTags method\
    \ of MysimpleOperations. The following code shows the installTags method as implemented\
    \ by the MysimpleOperationsImpl class:\n\n```\nimport org.springframework.roo.process.manager.MutableFile;\n\
    import org.springframework.roo.project.Path;\nimport org.springframework.roo.project.PathResolver;\n\
    import org.springframework.roo.project.ProjectOperations;\nimport org.springframework.roo.support.util.FileCopyUtils;\n\
    import org.springframework.roo.support.util.TemplateUtils;\n...\npublic void installTags()\
    \ {\n```"
