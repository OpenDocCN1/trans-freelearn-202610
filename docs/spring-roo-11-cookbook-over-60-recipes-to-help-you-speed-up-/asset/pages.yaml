    +   Created SRC_MAIN_WEBAPP\WEB-INF\views\customer\views.xml

    +   ...

    +   Updated ROOT\pom.xml [...; added dependency org.springframework.webflow:spring-webflow:w:2.2.1.RELEASE]


    +   2. Execute the perform eclipse command to update the project''s classpath
    settings:

    +   .. roo> perform eclipse


    +   3. You can now import the flightapp_webflow project into your Eclipse IDE.


    +   4. Exit the Roo shell and execute the tomcat:run goal of the Tomcat Maven
    plugin from the ch05-webflow directory to deploy the flightapp_webflow project
