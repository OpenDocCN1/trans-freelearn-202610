- pgno: 115
  md: '```

    import javax.persistence.EntityManager;

    import javax.persistence.TypedQuery;

    ...

    public static TypedQuery<Flight>

    Flight.findFlightsByDestinationLikeAndOriginLike(

    String destination, String origin)

    {

    if (destination == null || destination.length() == 0)

    throw new IllegalArgumentException("The destination

    argument is required");

    ...

    if (origin == null || origin.length() == 0)

    throw new IllegalArgumentException("The origin argument

    is required");

    ...

    EntityManager em = Flight.entityManager();

    TypedQuery<Flight> q = em.createQuery("SELECT Flight FROM

    Flight AS flight WHERE LOWER(flight.destination) LIKE

    LOWER(:destination) AND LOWER(flight.origin) LIKE

    LOWER(:origin)", Flight.class);

    q.setParameter("destination", destination);

    q.setParameter("origin", origin);

    return q;

    }

    ```


    The given code shows the following:


    +   - The finder method expects that both the `origin` and `destination` arguments
    must be supplied to the finder method or an exception is thrown. In general, the
    dynamic finder method implementation generated by Roo requires that the arguments
    passed to the method are not `null`. If an argument type is `String`, the dynamic
    finder method implementation requires that the argument must not be `null` or
    blank, as shown in this code.

    +   - JPA-QL for the finder method is auto-generated.

    +   - The return type of the finder method is `javax.persistence.TypedQuery<Flight>`.
    You can call the `getResultList` method of the `TypedQuery` object from your web
    controller class to execute the `SELECT` query and obtain the result.


    **There''s more...**


    Let''s now look at how we can add a custom finder method to an entity, perform
    integration testing of dynamic finder methods, and use a @RooEntity annotation
    to trigger auto-generation of a dynamic finder method implementation:'
