  md: '# # Sending e-mails using JavaMail API


    Spring framework provides classes such as JavaMailSenderImpl, SimpleMailMessage,
    and so on, which simplify sending e-mails via JavaMail API. In this recipe, we''ll
    look at Roo commands that help with the configuration of these classes. To verify
    that the emailing feature in our application is working correctly, we''ll send
    an e-mail via Gmail.


    # ## Getting ready


    Create a new directory C:\roo-cookbook\ch06-email in your system. Copy the ch06_web_app.roo
    script to the ch06-email directory. If you are using a different database than
    MySQL or your connection settings are different than what is specified in the
    script, then modify the script accordingly.


    Start the Roo shell from the ch06-email directory and execute the ch06_web_app.roo
    script using the script command. Executing the Roo script will create a flightapp-web
    eclipse project that represents a Spring Web MVC application consisting of Flight
    and FlightDescription JPA entities.


    # ## How to do it...


    To simplify e-mail sending, follow the steps given here:


    +   1. Execute the email sender setup command, by providing username and password
    argument values for the Gmail account through which you want to send e-mails.
    In the following command, replace the <username> and <password> argument values
    with the values that reflect your Gmail account username and password, respectively.
    It is important to note that you don''t need to specify @gmail.com as the value
    of username, as it is derived from the hostServer argument. If you are using a
    different mail server for sending e-mails, then modify the argument values accordingly.

    +   ... roo> email sender setup --hostServer smtp.gmail.com --port 587 --protocol
    SMTP --username <username> --password <password>

    +   Updated SRC_MAIN_RESOURCES\META-INF\spring\applicationContext.xml

    +   Updated ROOT\pom.xml [Added dependencies ... javax.mail:mail:1.4.1, javax.activation:activation:1.1.1]

    +   Created SRC_MAIN_RESOURCES\META-INF\spring\email.properties


    +   2. Execute the email template setup command to specify the sender of the e-mail
    message and the subject of the e-mail (replace <username> with your Gmail account
    username), as shown here:'
