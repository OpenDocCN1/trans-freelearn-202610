- pgno: 289
  md: '# How it works...


    Spring Web Flow allows creating a web application as a set of flows, where each
    flow defines

    a series of states, transitions, and actions. The web flow command, processed
    by the Spring

    Web Flow add-on, creates artifacts that are required to quickly get started with
    developing

    web applications using Spring Web Flow. The flowName is an optional argument that

    specifies the name of the flow which you want to create. If the flowName argument
    is

    not specified, Roo creates a sample flow.


    When the web flow command is executed for the first time, it mostly creates files
    and

    directories that you''ve already seen in Chapter 4, Web Application Development
    with Spring Web

    MVC. In this recipe, we''ll focus on files and directories that Roo creates specifically
    for developing

    applications with Spring Web Flow. It is important to note that the web flow command
    only

    creates a sample flow, which gives you the starting point to create your custom
    flow.


    As the output of the web flow command shows, Roo not only creates the webmvc-config

    .xml file (which is also created when you execute the web mvc install command)
    but

    also creates a webflow-config.xml file. The webflow-config.xml file is the application

    context XML file that defines Spring Web Flow-specific special beans like FlowHandler

    Mapping, FlowHandlerAdapter, and so on. The webmvc-config.xml web application

    context XML defines the beans that we discussed in Chapter 4, Web Application
    Development

    with Spring Web MVC. Additionally, it now imports the bean definitions in webflow-config.

    xml, using the <import> element of Spring''s beans schema, as shown here:


    ```

    <import resource="webflow-config.xml" />

    ```


    The value of flowName argument is used by Roo to create a directory with the same
    name in

    the/WEB-INF/views folder, containing flow-related artifacts. By default, Roo only
    creates an

    example flow to let you get started with creating your own flow. The following
    table describes

    the flow-related artifacts that were created in the /WEB-INF/views/customer directory

    when we executed the web flow --flowName customer command:


    | File name | Description |

    |---|---|

    | flow.xml | XML file that defines the flow states, transitions, and actions |

    | view-state-1.jspx | JSPX file that corresponds to the first view state of the
    Customer flow |

    | view-state-2.jspx | JSPX file that corresponds to the second view state of the
    Customer flow |

    | end-state.jspx | JSPX file that corresponds to the end view state of the Customer
    flow |

    | views.xml | Tiles configuration XML file, which contains tiles definitions for
    showing JSPX pages in the Customer flow |


    Let''s first look at how we define a flow in a flow definition XML file.'
  merge: -1
  img_proc: true
- pgno: 290
  md: "The following listing shows the `flow.xml` file that was created in the `WEB-INF/views/`\
    \ customer folder:\n\n```\nflow.xml\n<flow xmlns=\"http://www.springframework.org/schema/webflow\"\
    \ ..>\n\n<view-state id=\"view-state-1\" view=\"customer/view-state-1\">\n   \
    \ <transition on=\"success\" to=\"view-state-2\"/>\n    <transition on=\"cancel\"\
    \ to=\"end-state\"/>\n</view-state>\n\n<view-state id=\"view-state-2\" view=\"\
    customer/view-state-2\">\n    <transition on=\"cancel\" to=\"end-state\"/>\n</view-state>\n\
    \n<end-state id=\"end-state\" view=\"customer/end-state\"/>\n\n</flow>\n```\n\n\
    As this code shows, every flow definition XML file begins with the `<flow>` root\
    \ element. A `<view-state>` element defines a view state—a state in which a view\
    \ is rendered. The id attribute of the `<view-state>` element uniquely identifies\
    \ the state in the flow definition XML file. As the first state defined in the\
    \ flow definition, XML file is the start state of the flow, view-state-1 represents\
    \ the start state of Customer flow. The view attribute of the `<view-state>` element\
    \ specifies the view that should be rendered to the user. As Roo-generated Spring\
    \ Web Flow application makes use of Apache Tiles 2 framework, the value of the\
    \ view attribute represents a logical name of the view. The actual view corresponding\
    \ to the view attribute value is determined based on the tiles definition contained\
    \ in the `WEB-INF/views/customer/views.xml` file. The `<end-state>` element defines\
    \ the end state of the flow. The View attribute defines the logical name of the\
    \ view that is rendered when the end state of the flow is reached. A flow may\
    \ define multiple end states and in some cases the end state may not render a\
    \ view.\n\nThe `<transition>` element specifies the state to which the flow is\
    \ transitioned when an event occurs. The on attribute specifies the event that\
    \ triggers the transition and the to attribute specifies the state to which the\
    \ flow transitions. For instance, if the Customer flow is in view-state-1 state\
    \ and success event is received, then the flow transitions to view-state-2 state\
    \ and if cancel event is received, then the flow transitions to end-state. As\
    \ you can see, the state transitions result in navigation from one page to another\
    \ page in a Spring Web Flow application.\n\nLet's now look at the beans defined\
    \ in Roo-generated `webflow-config.xml` file for the `flightapp_webflow` project."
  merge: -1
  img_proc: true
- pgno: 291
  md: "# # Spring Web Flow configuration\n\nThe webflow-config.xml defines a HandlerMapping\
    \ that returns a FlowHandler for initiating execution of a flow, as shown here:\n\
    \n```\n```xml\n<bean class=\n\"org.springframework.webflow.mvc.servlet.FlowHandlerMapping\"\
    >\n  <property name=\"order\" value=\"0\" />\n  <property name=\"flowRegistry\"\
    \ ref=\"flowRegistry\" />\n</bean>\n```\n```\n\nThe order property specifies the\
    \ priority assigned to the FlowHandlerMapping with respect to other HandlerMapping\
    \ implementations configured in the web application context. The value can be\
    \ anything from Integer.MIN_VALUE to Integer.MAX_VALUE. The lower the value of\
    \ the order property, the higher the priority of the HandlerMapping implementation.\
    \ So, if a HandlerMapping implementation configured in the web application context\
    \ specifies a value of order property more than 0, then it has a lower priority\
    \ than FlowHandlerMapping. The priority of a HandlerMapping implementation comes\
    \ into play when DispatcherServlet attempts to find a handler for processing the\
    \ request.\n\n> > The HandlerMapping configuration with highest priority (that\
    \ is, lowest order value) is first consulted by DispatcherServlet to find a matching\
    \ handler and HandlerMapping configuration that doesn't specify an order property\
    \ is given the lowest priority.\n\nThe flowRegistry property of FlowHandlerMapping\
    \ specifies a FlowDefinitionRegistry that contains a registry of all the flow\
    \ definitions in the application. The following <flow-registry> element of Spring's\
    \ webflow schema defines a flow registry:\n\n```\n```xml\n<webflow:flow-registry\
    \ id=\"flowRegistry\"\n  flow-builder-services=\"flowBuilderServices\"\n  base-path=\"\
    /WEB-INF/views\">\n  <webflow:flow-location-pattern value=\"/**/flow.xml\" />\n\
    </webflow:flow-registry>\n```\n```\n\nThe base-path attribute specifies the location\
    \ relative to which flow definition XML files are located. The value /WEB-INF/views\
    \ of the base-path attribute means that the flow definition XML files are located\
    \ relative to the /WEB-INF/views folder. The <flow-location-pattern> specifies\
    \ the location pattern for finding the flow definition XML files, relative to\
    \ the base-path. The value /**/flow.xml means that the flow.xml files inside the\
    \ /WEB-INF/views folder or its subfolder represent the flow definition XML files."
  merge: -1
  img_proc: true
- pgno: 292
  md: 'Flows are registered in the flow registry with a unique ID, which is determined
    by the name of the flow definition XML file (if base-path attribute is not specified)
    or by the location of the flow definition XML file relative to the base-path attribute
    value. As the Roo-generated webflow-config.xml file makes use of the base-path
    attribute, the unique ID assigned to the flow is determined by the location of
    the flow definition XML files relative to the base-path attribute value. For instance,
    the Customer flow definition XML file in the flightapp-webflow project is located
    in the /WEB-INF/views/customer folder (relative to base-path) and the base-path
    attribute is /WEB-INF/views. If we subtract the base-path value (/WEB-INF/views)
    from the flow definition XML location (/WEB-INF/views/customer), then it returns
    the unique ID of the flow with which it is registered in the flow registry—which
    is customer for the Customer flow.


    When a request is received (via DispatcherServlet) by the FlowHandlerMapping,
    it checks whether the flow registry contains a flow whose unique ID matches the
    current request path. If a match is found, then it returns a FlowHandler that
    starts execution of the matched flow, else it returns null. When null is returned,
    DispatcherServlet consults the next HandlerMapping in the web application context
    to find the handler for processing the request.


    The flow-builder-services attribute of the <flow-registry> element specifies an
    implementation of FlowBuilderServices, which is used for configuring custom services
    that are required to build flows registered in the flow registry. For instance,
    if you want to configure a custom ConversionService or ViewFactoryCreator, you
    can specify reference to a FlowBuilderServices instance as the value of the flow-builder-services
    attribute value. As Roo-generated Spring Web Flow application makes use of Apache
    Tiles 2 framework, FlowBuilderServices is configured with a ViewFactoryCreator
    that maps a URL to a TilesView (described in detail in Chapter 4, Web Application
    Development with Spring Web MVC), as shown here:


    ```

    <bean id="mvcViewFactoryCreator" class=

    "org.springframework.webflow.mvc.builder.MvcViewFactoryCreator">

    <property name="viewResolvers" ref="tilesViewResolver" />

    </bean>

    ```


    The MvcViewFactoryCreator is an implementation of the ViewFactoryCreator, which
    creates a ViewFactory for rendering Spring Web MVC-based views, like JSPs. The
    viewResolvers property of MvcViewFactoryCreator specifies the view resolution
    strategy. The tilesViewResolver (defined in the webmvc-config.xml file) represents
    a UrlBasedViewResolver that resolves view names corresponding to URLs. As Roo-generated
    Spring Web Flow application makes use of Apache Tiles 2 framework, the UrlBasedViewResolver
    resolves a URL to a TilesView, as shown here:


    ```

    <bean class=

    "org.springframework.web.servlet.view.UrlBasedViewResolver"

    id="tilesViewResolver">

    <property name="viewClass" value=

    "org.springframework.web.servlet.view.tiles2.TilesView"/>

    </bean>

    ```'
  merge: -1
  img_proc: true
- pgno: 293
  md: 'Refer to Chapter 4, Web Application Development with Spring Web MVC for more
    information on UrlBasedViewResolver.


    Let''s now take a step back and see how request is mapped to a flow and how the
    view is resolved corresponding to the view state of the Customer flow. If you
    look at the menu.jspx file, you''ll find that the menu option **Enter Customer
    flow** refers to the /customer URL, as shown here:


    ```

    <menu:item id="i_flows_customer" messageCode="webflow_menu_enter"

    url="/customer" z="."/>

    ```


    So, when you click the **Enter Customer flow** menu option, FlowHandlerMapping

    attempts to find the flow whose unique ID is `customer` (removing the leading
    ''/'' from the

    request path gives the flow ID to look for). As our Customer flow has a `customer`
    unique

    ID, FlowHandlerMapping returns a FlowHandler instance that starts the execution

    of Customer flow. As the first `<view-state>` element in flow.xml of Customer
    flow

    defines the start state of the Customer flow, view corresponding to the first
    `<view-state>`

    element is rendered. The `view` attribute of the first `<view-state>` element
    is `customer/`

    `view-state-1`, which represents a logical view name. As the Roo-generated Spring
    Web

    Flow application makes use of Apache Tiles 2 framework, the Tiles configuration
    XML files

    (including /WEB-INF/views/customer/views.xml Tiles configuration XML file) in
    the

    application are consulted to find the tiles definition corresponding to the logical
    view name

    `customer/view-state-1`. The following listing shows the /WEB-INF/views/customer/

    views.xml file:


    ```

    <tiles-definitions>

    <definition extends="default" name="customer/*">

    <put-attribute name="body"

    value="/WEB-INF/views/customer/{1}.jspx"/>

    </definition>

    </tiles-definitions>

    ```


    The `<definition>` element''s `name` attribute value is `customer/*`, which matches
    the

    logical view name `customer/view-state-1`. So, we now know the tiles definition
    that

    applies to the first `<view-state>` element of the Customer flow. Another interesting
    thing

    to notice is the use of token `{1}` in the value of `<put-attribute>` element.
    The token `{1}`

    refers to the first value that appears in the logical view name after the `customer/`
    string—

    which is `view-state-1` for the first `<view-state>` element of the Customer flow.
    Similarly,

    if the logical view name is `customer/x/y/z`, then value of token `{1}` is x,
    token `{2}` is

    y, and `{3}` is z. This makes the view rendered for the first `<view-state>` element
    of the

    Customer flow as /WEB-INF/views/customer/view-state-1.jspx.'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'Now, coming back to webflow-config.xml, the flows are started by FlowHandler
    and executed by FlowExecutor, and the following FlowHandlerAdapter implementation
    is configured:


    ```

    <bean class=

    "org.springframework.webflow.mvc.servlet.FlowHandlerAdapter">

    <property name="flowExecutor" ref="flowExecutor" />

    </bean>

    <webflow:flow-executor id="flowExecutor" />

    ```


    The <flow-executor> element of Spring''s webflow schema installs a FlowExecutor,
    which is used by the FlowHandler implementation to execute a flow. You can create
    a custom FlowHandler implementation if you like, by extending AbstractFlowHandler
    class.


    # Developing applications using both Spring Web MVC and Spring Web Flow


    You''ll also find that the following beans are configured in the webflow-config.xml
    file:


    ```

    <bean class="org.springframework.web.servlet.mvc.annotation.

    AnnotationMethodHandlerAdapter" />

    <bean class="org.springframework.web.servlet.mvc.

    SimpleControllerHandlerAdapter" />

    ```


    The AnnotationMethodHandlerAdapter is used when you are using @Controller annotated
    controllers in Spring Web MVC and SimpleControllerHandlerAdapter is used when
    you are using controllers that implement Spring Web MVC''s Controller interface.


    You might be wondering why these HandlerAdapter implementations are configured
    when we are using Spring Web Flow and not Spring Web MVC. Well, Spring Web Flow
    is usually used along with Spring Web MVC because not everything in your web application
    may represent a flow. For instance, in a Flight Booking application, Booking may
    represent a process spanning a series of steps but creation of a Flight entity
    may not. This is the reason why execution of the web flow command not only enables
    development using Spring Web Flow but also using Spring Web MVC. If you look at
    webmvc-config.xml file, it defines <annotation-driven> element of Spring''s mvc
    schema, as shown here:


    ```

    <mvc:annotation-driven/>

    ```


    The <annotation-driven> element configures AnnotationMethodHandlerAdapter and
    DefaultAnnotationHandlerMapping beans to support developing Spring Web MVC applications
    using annotated controllers. As webflow-config.xml explicitly defines FlowHandlerAdapter,
    it overrides the AnnotationMethodHandlerAdapter bean configured implicitly by
    <annotation-driven>. This is the reason why the AnnotationMethodHandlerAdapter
    bean is explicitly configured by Roo in the webflow-config.xml file.'
  merge: -1
  img_proc: true
