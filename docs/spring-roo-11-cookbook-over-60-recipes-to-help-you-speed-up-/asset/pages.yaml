    \ mvn install:install-file \n-Dfile=h2-1.3.160.jar -DgroupId=com.h2database -DartifactId=h2\
    \ \n-Dversion=1.3.60 -Dpackaging=jar\n```\n\nHere, it is assumed that H2 database\
    \ driver JAR file is the `h2-1.3.160.jar` file.\n\n+   5. Create the `C:\\roo-cookbook\\\
    ch07-recipes\\wrapper` directory and start the Roo shell from it."
