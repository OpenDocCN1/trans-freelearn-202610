  md: "# Creating applications that interact with multiple databases\n\nAs of Spring\
    \ Roo 1.1.3, both entity and persistence setup commands support the persistenceUnit\
    \ argument which lets you create enterprise applications which interact with multiple\
    \ databases. In this recipe we'll create two persistent units:\n\n+   - flight:\
    \ the flight persistence unit consists of a single entity, Flight. It uses Hibernate\
    \ as a JPA provider and maps to a MySQL database named \"myFlightDB\".\n+   -\
    \ payment: the payment persistence unit consists of a single entity, Payment.\
    \ It uses Hibernate as the JPA provider and maps to a MySQL database named \"\
    myPaymentDB\".\n\n# Getting ready\n\nExit the Roo shell and delete the contents\
    \ of the C: \\roo-cookbook\\ch02-recipes directory.\n\nStart the Roo shell from\
    \ the C: \\roo-cookbook\\ch02-recipes directory.\n\n# How to do it...\n\nThe following\
    \ steps will demonstrate how to create an application that interacts with multiple\
    \ databases:\n\n+   1. Create the flight-app Roo project:\n+   ..roo> project\
    \ --topLevelPackage sample.roo.flightapp --java 6\n+   --projectName flight-app\n\
    +   \n+   2. Set up the flight persistence unit:\n+   ..roo> persistence setup\
    \ --provider HIBERNATE --database MYSQL\n+   --databaseName myFlightDB --persistenceUnit\
    \ flight\n+   \n+   3. Create Flight entity, which is associated with the flight\
    \ persistence unit:\n+   ..roo> entity --class ~.domain.Flight --table FLIGHT_TBL\n\
    +   --persistenceUnit flight\n+   \n+   4. Add some fields to the Flight entity:\n\
    +   ..domain.Flight roo> field string --fieldName origin --column FLT_\n+   ORIGIN\
    \ --notNull\n+   \n+   ..domain.Flight roo> field string --fieldName destination\
    \ --column\n+   FLT_DESTINATION --notNull"
  merge: -1
  img_proc: true
- pgno: 100
  md: "+   5. Create an integration test for the `Flight` entity:\n+   `~.domain.Flight\
    \ roo> test integration`\n+   \n+   6. Set up the `payment` persistence unit:\n\
    +   `.. roo> persistence setup --provider HIBERNATE --database MYSQL`\n+   `--databaseName\
    \ myPaymentDB --persistenceUnit payment`\n+   \n+   7. Create the `Payment` entity,\
    \ which is associated with the `payment` persistence unit:\n+   `.. roo> entity\
    \ --class ~.domain.Payment --table PAYMENT_TBL`\n+   `--persistenceUnit payment`\n\
    +   \n+   8. Add fields to the `Payment` entity:\n+   `~.domain.Payment roo> field\
    \ string --fieldName paymentType`\n+   `--column PYMT_TYPE --notNull`\n+   \n\
    +   9. Create an integration test for the `Payment` entity:\n+   `~.domain.Payment\
    \ roo> test integration`\n+   \n+   10. Execute the `perform eclipse` command\
    \ to import the `flight-app` project into Eclipse IDE:\n+   `~.domain.Payment\
    \ roo> perform eclipse`\n+   \n+   11. Execute the integration tests:\n+   `..\
    \ roo> perform tests`\n\nExecuting the integration tests at this time will result\
    \ in failure. We'll shortly see what we need to do to get the tests working when\
    \ using multiple databases.\n\n# How it works...\n\nThe concept of a persistence\
    \ unit is not only useful when the enterprise application interacts with multiple\
    \ databases but also when you want to logically group entities in your application.\
    \ Using different persistence units can also be useful if you want to use different\
    \ persistence providers for different logical groups of entities.\n\nWhen setting\
    \ up a persistence provider using the `persistence setup` command you can specify\
    \ the persistence unit name by specifying the `persistenceUnit` argument. Also,\
    \ when creating entities using the `entity` command you can use the `persistenceUnit`\
    \ argument to specify the persistence unit to which the entity belongs. Spring\
    \ Roo makes use of the `persistenceUnit` argument of the `persistence setup` command\
    \ to define a different persistence unit in the `/META-INF/persistence.xml` file.\
    \ The following listing shows the `persistence.xml` file of the `flight-app` project\
    \ after the execution of the `persistence setup` commands:\n\n```\n`<persistence\
    \ ...>`\n`<persistence-unit name=\"flight\"`\n```"
