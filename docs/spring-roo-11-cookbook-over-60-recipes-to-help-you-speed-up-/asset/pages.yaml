    \ the classpath settings of the project. This should be followed by refreshing\
    \ your project in the IDE.\n\n# How it works...\n\nThe persistence setup command\
    \ is processed by the JPA add-on of Spring Roo. The following table describes\
    \ the arguments that the persistence setup command accepts:\n\n| Argument | Description\
    \ |\n| :--- | :--- |\n| provider | This is a mandatory argument that specifies\
    \ the JPA provider that you want to use for your enterprise application. This\
    \ argument accepts a pre-defined value, like HIBERNATE, OPENJPA, and so on. |\n\
    | database | This is a mandatory argument that identifies the database product\
    \ used by your enterprise application to persist application data. It accepts\
    \ a pre-defined value, like MYSQL, DB2, and so on. |\n| databaseName | Identifies\
    \ the name of the database which your enterprise application interacts with. This\
    \ argument is useful only if you're not using a JNDI-bound data source in your\
    \ enterprise application. |\n| hostName | Identifies the location of the remote\
    \ database. Defaults to localhost.This argument is useful only if you're not using\
    \ a JNDI-bound data source in your enterprise application. |\n| jndiDataSource\
    \ | Specifies the JNDI-bound data source that is used by the application. |"
