    \ myadvanced add-on registers the following commands with the Roo shell:\n\n+\
    \   - myadvanced setup: performs the initial setup that is required for using\
    \ the add-on. When this command is executed, the myadvanced add-on updates project\
    \ dependencies in the pom.xml file.\n+   - myadvanced add: annotates the Java\
