    in the request, which is used by LocaleChangeInterceptor (configured in the /WEB-INF/spring/webmvc-config.xml)
    for changing the current locale.


    The CookieLocaleResolver configured in the /WEB-INF/spring/webmvc-config.xml stores
    a cookie named locale in the browser, so that users don''t need to change their
    preferred language every time they access the web application.


    # There''s more...


