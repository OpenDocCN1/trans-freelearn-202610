- pgno: 52
  md: "The following figure shows how Spring Roo manages AspectJ ITD files:\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_52_0.png)\n\
    \nThe given figure shows that when you start the Spring Roo shell from a directory,\
    \ it actively monitors the Java classes in the file system that are annotated\
    \ with Roo annotations (for example @RooToString, @RooJavaBean, and so on). When\
    \ any of these Java classes are modified using an IDE or any other editor, Spring\
    \ Roo checks if the AspectJ ITD files (which follow the naming convention *_Roo_*.aj,\
    \ as explained earlier) corresponding to the Java classes are in sync with the\
    \ Java classes. If they are not, it updates the AspectJ ITD files accordingly.\
    \ Spring Roo makes use of add-ons to make modifications to the AspectJ ITD files.\n\
    \n# There's more...\n\nThis recipe showed that if you want Roo to automatically\
    \ generate a `toString` method and getter and setter methods for all the attributes,\
    \ then annotate your class with `@RooToString` and `@RooJavaBean` annotations.\n\
    \n> **What if I add an attribute when Spring Roo is not running?**\n> \n> When\
    \ you start Roo shell, it checks if AspectJ ITDs are in sync with the corresponding\
    \ Java classes. If there are differences, then Roo updates the AspectJ ITD files\
    \ to reflect the current state of the Java class. At this time Roo may even remove\
    \ an ITD file if it finds that it is no longer required. For instance, if you\
    \ remove all the attributes from `Passenger` class, then the corresponding `Passenger_Roo_JavaBean.aj`\
    \ and `Passenger_Roo_ToString.aj` files are automatically removed by Roo."
  merge: -1
  img_proc: true
