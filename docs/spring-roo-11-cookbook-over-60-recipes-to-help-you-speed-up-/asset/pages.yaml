    \ into a JSON document containing an array\n+   - fromJsonArrayToFlights: Converts\
    \ a JSON array document into a collection of Flight objects\n+   - If you want\
    \ to customize the names of the JSON methods generated by @RooJson, you can use\
    \ the following attributes of @RooJson annotation:\n\n+   - fromJsonArrayMethod:\
    \ For customizing the name of the fromJsonArrayTo<_class_name_> method\n+   -\
    \ fromJsonMethod: For customizing the name of the fromJson<_class_name_> method\n\
    +   - toJsonArrayMethod: For customizing the name of the toJsonArray method\n\
    +   - toJsonMethod: For customizing the name of the toJson method\n\nThe <class_name>\
    \ refers to the name of the JPA entity class to which the JSON method applies.\
