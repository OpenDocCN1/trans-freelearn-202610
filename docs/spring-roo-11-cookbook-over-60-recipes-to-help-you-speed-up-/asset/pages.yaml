    \ class:\n\n```\n```java\n@RooJavaBean\n@RooToString\n@RooEntity(table = \"flight_desc_tbl\"\
    )\n@RooDbManaged(automaticallyDelete = true)\npublic class FlightDescTbl {\n}\n\
    ```\n```"
