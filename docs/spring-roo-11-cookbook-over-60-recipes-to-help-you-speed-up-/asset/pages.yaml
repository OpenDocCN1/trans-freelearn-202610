- pgno: 30
  md: '# See also


    +   * The next recipe, Creating a Roo project shows how you can use the `help`
    command to discover the details of the `project` command, which is used for creating
    a Roo project.


    # Creating a Roo project


    This is the first recipe in which you will see Spring Roo doing some real work
    to help you create a Java enterprise application. This recipe shows how to go
    about creating a Roo project using `project` command. The end result of following
    this recipe will be a project, which follows standard Maven directory structure.
    The project created in this recipe can be packaged as a JAR file because it doesn''t
    have a web layer. In *Chapter 4, Web Application Development with Spring Web MVC*
    and *Chapter 5, Web Application Development with GWT, Flex, and Spring Web Flow*
    you will see how to create a web layer of an enterprise application using Spring
    Roo. The project that you will create in this recipe will act as a foundation
    for the rest of the recipes in this chapter.


    # Getting ready


    The first thing that you need to do is to create an empty directory in which you
    are going to create your Roo project. Create a `ch01-recipe` sub-directory in
    the `C:\roo-cookbbok` directory, if you haven''t created it yet. Start the Roo
    shell from the `ch01-recipe` directory by executing the Roo batch file or shell
    script, as shown here:


    ```

    C:\roo-cookbook\ch01-recipe>roo

    ```


    # How to do it...


    To create a Roo project, execute the `project` command from your Roo shell, shown
    as follows:


    ```

    roo>project --topLevelPackage sample.roo.flightapp --java 6 --projectName flight-app

    ```


    ```

    Created C:\roo-cookbook\ch01-recipe\pom.xml

    ......

    Created SRC_MAIN_RESOURCES\META-INF\spring\applicationContext.xml

    Created SRC_MAIN_RESOURCES\log4j.properties

    ```


    ```

    sample.roo.flightapp roo>

    ```'
