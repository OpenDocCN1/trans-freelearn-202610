- pgno: 116
  md: '# # Adding custom finder methods


    You may want to add custom finder methods if the dynamic finder methods offered
    by Roo don''t meet your application''s requirements. In such cases, you can either
    perform push-in refactoring of Roo-generated dynamic finder methods and modify
    their implementation (not their name or signature) in the corresponding persistent
    entity Java class or you can define the method in the persistent entity Java class
    (which will result in removing the method from the *_Roo_Finder.aj AspectJ ITD)
    or you can create your own AspectJ ITD to introduce your custom finder methods
    into the persistent entity Java class.


    If you want to change the implementation of a dynamic finder method, then you
    can either use push-in refactoring or you can define the method in persistent
    entity Java class. The effects of using push-in refactoring or defining the method
    in persistent entity Java class are the same. In push-in refactoring, you use
    the IDE to move a declaration from AspectJ ITD file to the target Java class and
    then modify it. And, in case you decide to define the method in the Java class
    itself, you will probably do a copy-paste from AspectJ ITD to the Java class,
    and let Roo remove the method declaration from AspectJ ITD.


    The following figure shows what happens when you use push-in refactoring to move
    a method declaration from AspectJ ITD to the target Java class:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_116_0.png)


    The given figure shows that when you perform push-in refactoring of the findFlightsByDestinationLikeAndOriginLike
    method, the IDE simply moves the method from the AspectJ ITD file to the target
    Flight.java class. So, if you have to customize a method such as findFlightsByDestinationLikeAndOriginLike
    by writing it in the Flight.java class, it will be much simpler if you perform
    push-in refactoring or simply copy the method from the AspectJ ITD file and paste
    it in the Flight.java class (followed by removing the Flight. that is prefixed
    to the method name). Copy-pasting from AspectJ ITDs to target Java classes isn''t
    efficient if you are planning to move all the declarations in all the AspectJ
    ITDs to target Java classes. This is where push-in refactoring is helpful, as
    we will see in Chapter 7, Developing Add-ons and Removing Roo from Projects.'
  merge: -1
  img_proc: true
- pgno: 117
  md: "If you want to add a custom finder method whose name or signature is different\
    \ from the dynamic finder methods offered by Roo, then you can either define the\
    \ method in the persistent entity Java class or you can create a new AspectJ ITD\
    \ and declare your method in it. Both these approaches are fine, and it depends\
    \ upon how comfortable you are with writing AspectJ ITDs. Roo generates AspectJ\
    \ ITDs so that cross-cutting concerns are separate from the Java classes. So,\
    \ if you feel that writing finder methods in your persistent entity Java class\
    \ pollutes it, you should consider writing AspectJ ITDs. It is important to note\
    \ that the custom AspectJ ITDs that you create in your project are not managed\
    \ by Roo.\n\nThe following code shows an example of the Flight_MyCustom_Finder.aj\
    \ AspectJ ITD, which introduces the searchFlights(SearchCriteria criteria) finder\
    \ method into Flight.java:\n\n```\nimport javax.persistence.EntityManager;\nimport\
    \ javax.persistence.TypedQuery;\n\nprivileged aspect Flight_MyCustom_Finder {\n\
    \n    public static TypedQuery<Flight> Flight.searchFlight (\n            SearchCriteria\
    \ criteria) {\n        EntityManager em = Flight.entityManager();\n        TypedQuery<Flight>\
    \ q = em.createQuery(\"SELECT Flight ..\",\n                Flight.class);\n \
    \       q.setParameter(\"destination\", criteria.getDestination());\n        q.setParameter(\"\
    origin\", criteria.getOrigin());\n        return q;\n    }\n\n}\n```\n\nAs the\
    \ given code shows, you can create your own AspectJ ITD and add custom finder\
    \ methods to JPA entities. As custom AspectJ ITDs are not managed by Roo, if you\
    \ create the searchFlight method in the Flight.java class, Roo will not remove\
    \ it from the Flight_MyCustom_Finder.aj file.\n\n# Integration testing of dynamic\
    \ finder methods\n\nRoo doesn't create integration tests for the auto-generated\
    \ dynamic finder methods. To test finder methods, write the test method in the\
    \ *IntegrationTest.java file corresponding to the persistent entity."
