    +   (2) DSA and Elgamal

    +   (3) DSA (sign only)

    +   (4) RSA (sign only)

    +   Your selection? 1

    +   ...


    Executing the gen-key command asks multiple questions, such as for the e-mail
    ID, real name, kind and length of key, and so on. When asked to select what kind
    of key you want, choose either option 1 (RSA and RSA (default)) or 2 (DSA and
    Elgamal), as the key can be used for both encryption and decryption.

    In the end, you''ll be asked to provide a passphrase to protect your secret PGP
    key.

    Remember the passphrase, as you''ll need to provide it when building your custom
    add-ons.


    +   3. To verify that the key-pair has been successfully created, execute GnuPG''s
    list-secret-keys command:


