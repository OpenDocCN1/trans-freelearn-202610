    In the code, the installTags method copies info.tagx and show.tagx files from
    the SRC_MAIN_RESOURCE/com/roo/addon/mysimple directory of the mysimple add-on
    to the SRC_MAIN_WEBAPP/WEB-INF/tags directory of your Roo project. The createOrReplace
    method is the method, which is used by the installTags method to copy the files.
    The following table describes the classes used by the installTags and createOrReplace
    methods for copying tag files:


    | Class | Description |

    |---|---|

    | PathResolver | Used to locate files and directories in your Roo project. You
    can use the ProjectOperations service to obtain reference to PathResolver. |

    | MutableFile | Represents a file in your Roo project, which you want to create,
    modify, or delete. You can use the FileManager service to obtain reference to
    the MutableFile instance. |

    | FileCopyUtils | Utility class that provides methods for copying resources from
    the add-on to your Roo project. |

    | TemplateUtils | Utility class that is used to resolve template files in the
    add-on project. We''ll discuss templates in detail later in this recipe. |


