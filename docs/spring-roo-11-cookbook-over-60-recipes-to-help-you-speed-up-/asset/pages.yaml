    +   departureDate --column DEPARTURE_DATE

    +   ~ .domain.Flight roo> field date --type java.util.Date --fieldName

    +   arrivalDate --column ARRIVAL_DATE


    +   3. Create the FlightDescription entity (including integration tests) corresponding
    to

    +   the FLIGHT_DESC_TBL table:'
