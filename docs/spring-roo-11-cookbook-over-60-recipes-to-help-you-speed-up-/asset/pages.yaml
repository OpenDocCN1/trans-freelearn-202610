- pgno: 326
  md: 'Let''s now look in detail at how the elements in the given configuration define
    web request security:


    +   <http>: It contains the HTTP security configuration elements. It creates an
    instance of Spring Security''s FilterChainProxy with bean name as springSecurityFilterChain.
    It is important to note that the name of the FilterChainProxy bean is same as
    the name of the DelegatingFilterProxy servlet filter configured in web.xml file.


    The auto-config attribute automatically configures Spring Security beans, which
    provide form-based login, logout, and HTTP BASIC authentication services.


    The use-expression attribute specifies whether the access attributes of the <intercept-url>
    element (discussed later in this recipe) can accept EL expressions.


    +   <form-login>: It configures Spring Security''s UsernamePasswordAuthenticationFilter
    filter bean (a bean that implements the javax.servlet.Filter interface of Servlet
    API) and LoginUrlAuthenticationEntryPoint bean in an application context. The
    UsernamePasswordAuthenticationFilter filter bean is used by FilterChainProxy to
    perform authentication.


    UsernamePasswordAuthenticationFilter uses the username and password in the submitted
    request to attempt authentication against the configured authentication provider(s).
    It is important to note that the names of the request parameters that contain
    the username and password must be j_username and j_password, respectively. If
    you check the Roo-generated login.jspx file for parameters that flightapp-web
    project, you''ll find that the names of the username and password fields are j_username
    and j_password, respectively.


    The LoginUrlAuthenticationEntryPoint bean starts off the form login authentication
    using UsernamePasswordAuthenticationFilter.


    The login-page attribute specifies the URL of the login page. The value of this
    attribute is used by LoginUrlAuthenticationEntryPoint to render the login page.
    The value of the attribute is /login, which means that the <mvc:view-controller
    path="/login" /> configured controller in webmvc-config.xml is responsible for
    rendering the login page.


    The login-processing-url attribute specifies the URL to which the login form is
    submitted. The UsernamePasswordAuthenticationFilter handles a request submitted
    to the URL identified by its filterProcessesUrl property. The value of the login-processing-url
    attribute is used to set the filterProcessesUrl property of UsernamePasswordAuthenticationFilter.
    The value of the login-processing-url attribute is /resources/j_spring_security_check,
    which is the same as the value of the action attribute of the HTML <form> element
    in the Roo-generated login.jspx file of the flightapp-web project.'
  merge: -1
  img_proc: true
- pgno: 327
  md: 'The authentication-failure-url attribute specifies the URL to which the user
    is redirected if login fails. The value of this attribute /login?login_error=t
    means that the <mvc:view-controller path="/login"/> configured controller in webmvc-config.xml
    will render the login page again. The login_error parameter in the URL is used
    by the login.jspx page to show an authentication failure message on the login
    page, as shown here:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_327_0.png)


    +   <logout>: It configures the LogoutFilter filter bean that is responsible for
    processing logout requests. The LogoutFilter handles request submitted to the
    URL identified by its filterProcessesUrl property. The value of logout-url attribute
    is used to set the filterProcessesUrl property of LogoutFilter. In case of Roo-generated
    applicationContext-security.xml, the value of logout-url is /resources/j_spring_security_logout.
    The footer.jspx file (located in /WEB-INF/views directory) contains the Logout
    hyperlink that is displayed if the user is logged in. The Logout hyperlink refers
    to /resources/j_spring_security_logout URL, which means that when the user clicks
    the Logout hyperlink, the request is processed by the LogoutFilter filter bean.


    +   <intercept-url>: It defines the URL pattern and the corresponding access permissions.
    The pattern attribute specifies the URL pattern and the access attribute specifies
    the access permissions. As mentioned earlier, the <http> element''s use-expression
    attribute is set to true; therefore, the access attribute can accept Boolean EL
    expressions. If the value returned by the expression is true, then access to the
    URL pattern, specified by the pattern attribute, is authorized.


    The hasRole, isAuthenticated(), and permitAll are examples of built-in expressions.
    The hasRole (''ROLE_ADMIN'') returns true if the role of the authenticated principal
    is ROLE_ADMIN. The isAuthenticated() returns true if the user is not an anonymous
    user. The permitAll expression always returns true.'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'The `<http>` element registers an implementation Spring Security''s

    `AccessDecisionManager`, which makes access decisions regarding web URL

    access. An incoming web request is matched against the URL patterns specified

    by the `<intercept-url>` elements in the order in which they appear within the

    `<http>` element. If a match is found, it''ll be used by `AccessDecisionManager`

    implementation for making access decisions. As incoming web requests are matched

    against the URL patterns (specified by the `<intercept-url>` elements) in the
    order

    in which they appear within the `<http>` element, more specific URL patterns should

    be declared before the more general URL patterns.


    # # Using Spring Security with Apache Directory Server


    This recipe extends on the previous recipe and shows a fully-functional Flight
    Booking

    application developed using Spring Web MVC that makes use of Spring Security to
    implement web request and *method-level* security. We''ll look at modifications
    or additions that we need to make to configurations and artifacts generated by
    the `security setup` command to create a security-aware Flight Booking application.


    Let''s first take a quick look at the security requirements of the Flight Booking
    application before we delve into the details of how these requirements are met
    using Spring Security.


    # ## Flight Booking application requirements


    The Flight Booking application users are authenticated against Apache Directory
    Server, which

    contains application users, details and their role information. An authenticated
    user of the

    Flight Booking application can either have the role of `ROLE_ADMIN_USER` or `ROLE_APP_USER`.
    Access to application functionality is granted or restricted based on the authenticated
    user''s role.


    Web request security requirement of Flight Booking application restricts unauthorized

    access to menu options. The following screenshot shows the main menu of the Flight

    Booking application:'
  merge: -1
  img_proc: true
- pgno: 329
  md: '![](img/b8c379a2ed921ead3aa2b01811dc29fa_329_0.png)


    The following table defines the access permissions for each menu option (shown
    in the given screenshot) based on role:


    | Menu option | Accessible to role |

    |---|---|

    | Create new FlightDescription | ROLE_ADMIN_USER |

    | List all Flight Descriptions | |

    | Find by Destination And Origin | |

    | Create new Flight | |

    | List all Flights | |

    | Create new Booking | ROLE_APP_USER |

    | List all Bookings | ROLE_ADMIN_USER |


    As the given table shows, an application user with the ROLE_ADMIN_USER role can
    access web pages for Flight, FlightDescription, and Booking JPA entities. An application
    user with the ROLE_APP_USER role can only access web pages corresponding to the
    Booking JPA entity.


    Even though the Create new Booking and List all Bookings links are accessible
    to both ROLE_APP_USER and ROLE_ADMIN_USER roles (as shown in the preceding table),
    the following security requirements (which will eventually translate into method-level
    security requirements) must also be met by the application:


    +   - A user with ROLE_APP_USER role can create a new Booking instance, but can''t
    edit or remove an existing Booking instance

    +   - A user with ROLE_ADMIN_USER role can edit or remove an existing Booking
    instance, but can''t create a new Booking instance'
