    | SRC_MAIN_WEBAPP\WEB-INF\views | Contains non-JPA entity specific JSPX views
    of the Roo-generated web application. For instance, it contains an `index.jspx`
    file, which shows the home page of the `flight-app` application and an `uncaughtException.jspx`
    file, which is rendered when an unexpected exception occurs in the web application.
    To simplify creating a custom home page of the web application, the directory
    also contains an `index-template.jspx` file. The directory also contains a tiles
    configuration XML file, `views.xml`, which extends the tiles definitions defined
    in the `layouts.xml` file. The tiles definitions in the `views.xml` file are meant
    for showing non-JPA entity specific JSPX pages such as the home page and the page
    when unexpected exceptions occur during request processing. You should note that
    a Roo-generated web application makes use of Apache Tiles 2 framework to simplify
    developing user interfaces. |

    | SRC_MAIN_WEBAPP\WEB-INF\views\flightdescriptions and SRC_MAIN_WEBAPP\WEB-INF\views\flights
    | `flightDescriptions` and `flights` directories contain JSPX views corresponding
    to `FlightDescription` and `Flight` JPA entities, respectively. Each directory
    also contains a tiles configuration XML file, `views.xml`, which contains tiles
    definitions for showing JPA entity specific web pages. By default, Roo creates
    JSPX views for performing CRUD operations on a JPA entity. |

    | SRC_MAIN_WEBAPP\WEB-INF\tags | Contains tags that are installed by Roo to simplify
    developing JSPs. The tags are XML-only in nature, that is, they are not backed
    by a Java source code, making it possible to easily modify the behavior of these
    tags. We will see in the round-tripping support in Spring Roo for web controllers
    and the views recipe how the `id` attribute of these tags helps achieve round-tripping
    support in a Roo-generated web application. |'
