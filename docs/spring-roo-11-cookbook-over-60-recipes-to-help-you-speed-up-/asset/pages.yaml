  md: '# Code generation functionality of add-ons


    The following sequence diagram shows how the myadvanced add-on processes the myadvanced
    add --type sample.roo.flightapp.domain.Flight command, where the Flight class
    represents a JPA entity in your Roo project to which you want to add the @RooMyadvanced
    annotation.


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_420_0.png)


    The figure shows that when the myadvanced add command is executed, the add method
    of MyadvancedCommands instance is invoked and the type argument value is passed
    to the add method. You may notice that the add method accepts an argument of JavaType
    type, but we didn''t register a custom converter with the Roo shell for it. This
    is because Roo is responsible for converting the type argument value to JavaType
    type. The JavaType contains the simple and package name information about the
    type argument value. In our case, JavaType argument passed to the add method contains
    simple and package name information about the Flight class that we specified as
    value of the type argument. The add method of MyadvancedCommands invokes the annotateType
    method of the MyadvancedOperationsImpl class and passes the JavaType instance
    containing information about the Flight class. The annotateType method annotates
    the Flight.java file with the @RooMyadvanced annotation.


    Annotating Flight.java with the @RooMyadvanced annotation results in issuing a
    notification to the file monitor service of Roo that the Flight.java file has
    been modified. The following sequence diagram shows how file monitor service of
    Roo notifies change in Flight.java file to MetadataDependencyRegistry:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_420_1.png)'
  merge: -1
  img_proc: true
- pgno: 421
  md: 'The preceding figure shows that the file monitor service notifies PhysicalTypeMetadataProvider
    that the Flight.java file has been modified. As discussed earlier, PhysicalTypeMetadataProvider
    provides metadata for a Java type in the Roo project. PhysicalTypeMetadataProvider
    is notified when Flight.java is modified because PhysicalTypeMetadataProvider
    is a registered listener for file change events. After receiving the file change
    notification, PhysicalTypeMetadataProvider asks MetadataDependencyRegistry instance
    to inform any registered downstream dependencies. We saw earlier that MyadvancedMetadataProvider''s
    activate method registers MID:com.roo.addon.myadvanced.MyadvancedMetadata as the
    downstream dependency of MID:org.springframework.roo.classpath.PhysicalTypeIdentifier.
    The MID:org.springframework.roo.classpath.PhysicalTypeIdentifier represents a
    class-level metadata identification string created by PhysicalTypeMetadataProvider
    and represents a Java type in the Roo project. So, the change in Flight.java results
    in notifying the metadata provider that creates the MID:com.roo.addon.myadvanced.MyadvancedMetadata
    metadata identification string, which is MyadvancedMetadataProvider.


    The following sequence diagram shows how MetadataDependencyRegistry notifies MyadvancedMetadataProvider
    to create MyadvancedMetadata:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_421_0.png)'
  merge: -1
  img_proc: true
- pgno: 422
  md: 'In the preceding figure, MetadataProvider represents an interface that is implemented

    by all the metadata providers in Roo, and MetadataItem represents the metadata
    that is

    created by MetadataProvider implementations. In the case of the myadvanced add-on,

    MyadvancedMetadataProvider implements the MetadataProvider interface and

    MyadvancedMetadata implements the MetadataItem interface.


    The previous sequence diagram shows that MetadataDependencyRegistry

    notifies MetadataService to inform the MetadataProvider (which is

    MyadvancedMetadataProvider in the case of the myadvanced add-on) of the downstream

    dependency.


    > MetadataService is a central service in Roo which knows about

    > all the metadata providers in the system. You don''t need to register

    > your metadata providers with MetadataService because it can

    > automatically detect an OSGi service as a metadata provider if it

    > implements the MetadataProvider interface.


    A MetadataItem (which is MyadvancedMetadata in the case of the myadvanced add-

    on) is created when MetadataProvider (which is MyadvancedMetadataProvider in

    the case of the myadvanced add-on) of the downstream dependency is notified, as
    we''ll see

    shortly. MetadataService makes use of the MetadataIdentificationUtils utility

    class to obtain the MetadataProvider class corresponding to the metadata identification

    string of the downstream dependency. Once the MetadataProvider for the downstream

    dependency is obtained, MetadataService notifies the MetadataProvider.


    The MetadataProvider needs to know the Java type for which the MetadataItem

    is to be created. For instance, in the case of the myadvanced add-on example,

    MyadvancedMetadataProvider needs to know that MyadvancedMetadata needs

    to be created corresponding to the Flight.java class. MetadataProvider converts

    class-level MID (MID:com.roo.addon.myadvanced.MyadvancedMetadata) of

    downstream dependency into instance-level MID (MID:com.roo.addon.myadvanced.

    MyadvancedMetadata #SRC_MAIN_JAVA?sample.roo.flightapp.domain.

    Flight) to identify the Java type for which the MetadataItem is to be created.
    When the

    MetadataItem instance is created, it results in code generation.


