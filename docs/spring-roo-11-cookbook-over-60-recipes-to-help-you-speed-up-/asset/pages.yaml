    # Getting started with Flex application development


    In the previous recipe, we saw how we can scaffold a complete GWT application
    using Roo. In this recipe, we''ll see how Roo simplifies setting up Flex for your
    Roo project. In the next recipe Scaffolding Flex application from JPA entities
    we''ll look at how Roo generates a fully-functional Flex application to perform
    CRUD operations on JPA entities.


    # Getting ready


    At the time of writing this book, Flex addon is not compatible with Spring Roo
    1.1.3 and above; therefore, download Spring Roo 1.1.2.


    At the time of writing this recipe, the Flex addon used is the snapshot version
    dated 15-Aug-2011 from the Flex Spring Roo addon repository (`http://s3browse.springsource.com/browse/maven.springframework.org/snapshot/org/springframework/flex/roo.addon/org.springframework.flex.roo.addon/1.0.0.BUILD-SNAPSHOT/`).
    Download the JAR file named `org.springframework.flex.roo.addon-xx.jar` and copy
    it to Roo''s bundle directory or install it using the `osgi start` (explained
    in Chapter 7, Developing Add-ons and Removing Roo from Projects) command.


    Flex add-on is an example of an installable add-on. For more information on installable
    add-ons, see Chapter 7, Developing Add-ons and Removing Roo from Projects.


    Create a new directory `C:\roo-cookbook\ch05-flex` in your system and start the
    Roo shell from the `ch05-flex` directory. Enter the `help` command and check whether
    you see `flex setup`, `flex removing scaffold`, and `flex remoting all` commands
    in the output. If you see the `flex` commands in the output of the `help` command,
    it means you have successfully installed the Flex addon.'
