- pgno: 403
  md: "The preceding code shows that the Country class must be added to the StaticFieldConverter\
    \ service and must be specified as the type of countryOfOrigin argument in sayHello\
    \ method.\n\n# Multiple command availability using @CliAvailabilityIndicator\n\
    \nIn mysimple add-on, separate @CliAvailabilityIndicator annotated methods are\
    \ used to indicate availability of the say hello and web mvc install tags commands.\
    \ If you want to use a single @CliAvailabilityIndicator annotated method to indicate\
    \ availability of multiple Roo commands offered by the mysimple add-on, then specify\
    \ the command array in the @CliAvailabilityIndicator annotation. For instance,\
    \ you can define the following method in MysimpleCommands to indicate that the\
    \ say hello and web mvc install tags commands are always available to the Roo\
    \ shell:\n\n```\n@CliAvailabilityIndicator({\"say hello\",\n\"web mvc install\
    \ tags\"})\npublic boolean isCommandAvailable() {\n    return true;\n}\n```\n\n\
    In the preceding code the @CliAvailabilityIndicator annotation specifies an array\
    \ of Roo commands (say hello and web mvc install tags) whose availability is checked\
    \ by the isCommandAvailable method.\n\n# Templates in Roo add-ons\n\nTemplates\
    \ in an add-on project are resources that are copied to the Roo project when one\
    \ or more commands of the add-on are executed. For instance, when you execute\
    \ the web mvc install tags command, the info.tagx and show.tagx files are copied\
    \ from add-on to the Roo project. Templates can also be images, XML files, properties\
    \ files, and so on, which the add-on commands copy to the Roo project.\n\nTemplates\
    \ are located inside the SRC_MAIN_RESOURCES directory of an add-on project. For\
    \ instance, in the case of the mysimple add-on, the info.tagx and show.tagx files\
    \ are located in the SRC_MAIN_RESOURCES/com/roo/addon/mysimple directory. Add-ons\
    \ access templates using the TemplateUtils class and then copy it to the Roo project\
    \ using the FileCopyUtils class. TemplateUtils defines the following two static\
    \ methods which are used to access templates in the add-on:\n\n+   - String getTemplatePath(Class<?>\
    \ clazz, String templateFilename):\n+   this method returns the path to the template\
    \ file specified via the templateFilename argument. The clazz argument's package\
    \ information is used to obtain the sub-directory inside the SRC_MAIN_RESOURCES\
    \ directory that contains the template file."
  merge: -1
  img_proc: true
- pgno: 404
  md: 'For instance, if the clazz argument represents a class whose package name is
    com.roo.addon.mysimple and the templateFileName argument value is show.tagx, the
    getTemplatePath method returns the path to the SRC_MAIN_RESOURCES/com/roo/addon/mysimple/show.tagx
    file. You can also specify the relative path to the template file as the value
    of the templateFilename argument. For instance, if you specify the value of templateFilename
    as WEB-INF/myconfig.xml, then the path to the template file becomes SRC_MAIN_RESOURCES/com/roo/addon/mysimple/WEB-INF/myconfig.xml.


    +   InputStream getTemplate(Class<?> clazz, String templateFileName): this method
    returns java.io.InputStream to the template file. In the case of the mysimple
    add-on, the createOrReplaceFile method of the MySimpleOperationsImpl class makes
    use of the TemplateUtils class to obtain InputStream to the info.tagx and show.tagx
    files.


    In some add-ons, a template file may be an XML file which the add-ons need to
    modify before copying it to the Roo project. To modify XML templates, Roo provides
    an XMLUtils class which add-ons can use to modify the content of XML template
    files. Let''s look at a scenario that shows how add-ons can modify the content
    of an XML template file before copying it to the Roo project.


    The following config.xml file shows a Spring application context XML file which
    represents a template XML file of an add-on:


    ```

    beans xmlns="http://www.springframework.org/schema/beans"

    xmlns:context="http://www.springframework.org/schema/context" ...>

    <context:component-scan base-package=""/>

    ...

    </beans>

    ```


    In the config.xml file, the <component-scan> element of Spring''s context namespace
    specifies the packages (via the base-package attribute) that are scanned by Spring.
    The classes in these packages (and their sub-packages) that are annotated with
    the @Component, @Service, and @Repository Spring annotations are auto-registered
    with Spring''s application context. As the add-on copies the config.xml file to
    a Roo project when a Roo command is executed, the add-on doesn''t know in advance
    the value that needs to be specified for the base-package attribute. This is the
    reason why the value of the base-package attribute is empty in the config.xml
    file.


    The following code shows how an add-on can read the config.xml file, modify it,
    and then write the modified config.xml to the Roo project:


    ```

    import org.springframework.roo.metadata.MetadataService;

    import org.springframework.roo.project.PathResolver;

    import org.springframework.roo.project.ProjectMetadata;

    import org.springframework.roo.support.util.XmlUtils;

    import org.w3c.dom.Document;

    ```'
