- pgno: 334
  md: '# # How it works...


    In the Configuring Spring security for your application recipe, we discussed Spring
    Security configuration generated by the `security setup` command. As the `security
    setup` command created configuration was only helpful in getting us started with
    adding security to our application, this recipe extends the configuration created
    by `security setup` command to demonstrate how authentication and authorization
    can be quickly incorporated into Roo-generated web applications. In this section,
    we''ll look at what modifications or additions we made to configurations and artifacts
    generated by `security setup` command to create a security-aware Flight Booking
    application.


    Let''s start with how we set up Apache Directory Server as the authentication
    source for the Flight Booking application.


    # # Setting up embedded Apache Directory Server


    Spring Security namespace provides an `<ldap-server>` element that configures
    the location of an external LDAP server against which authentication is to be
    performed. It can also be used to create an embedded Apache Directory Server instance.
    If the url attribute of the `<ldap-server>` element is specified, then it means
    that an external LDAP server is being used for authentication. And, if the url
    attribute is not specified, then an embedded instance of Apache Directory Server
    is created.


    The `applicationContext-security.xml` file of the `flightapp-web` project configures
    embedded Apache Directory Server instances, as shown here:


    ```

    ```xml

    <ldap-server ldif="classpath:application_users.ldif"

    root="dc=sample,dc=com" />

    ```

    ```


    The ldif attribute specifies the location of the LDIF (LDAP Data Interchange Format)
    file, which contains user information loaded by the embedded LDAP server. You''ll
    find the `application_users.ldif` file in the `WEB-INF/classes` directory of the
    `flightapp-web` project. The root attribute specifies the root of the LDAP directory
    tree.


    The following figure shows the LDAP directory tree defined by the `application_users.ldif`
    file:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_334_0.png)'
  merge: -1
  img_proc: true
- pgno: 335
  md: "The given figure shows that user groups administrator and appuser are defined\
    \ under ou-groups, and application users admin and ashish are defined under ou-users.\
    \ The DN (Distinguished Name) of user ashish is uid=ashish,ou-users,dc=sample,dc=com,\
    \ and DN of user admin is uid=admin,ou-users,dc=sample,dc=com. DN of administrator\
    \ group entry is cn=administrator,ou=groups,dc=sample,dc=com, and DN of appuser\
    \ group entry is cn=appuser,ou=groups,dc=sample,dc=com.\n\nThe uniqueMember attribute(s)\
    \ of an entry defined under ou=groups identifies the application user who belongs\
    \ to that group. For instance, in the cn=administrator entry, the uniqueMember\
    \ attribute value is uid=admin, ou=users, dc=sample, dc=com (DN of user admin),\
    \ which means that the admin user belongs to administrator group. Similarly, ashish\
    \ belongs to appuser group.\n\nThe businessCategory attribute of an entry under\
    \ ou=groups identifies the role of the users belonging to that group. As the given\
    \ figure shows, the role of user admin is admin_user and the role of user ashish\
    \ is app_user.\n\nAs Flight Booking application makes use of the embedded Apache\
    \ Directory Server, the following JAR dependencies have been added to the pom.xml\
    \ file of the flightapp-web project:\n\n+   - apacheds-protocol-shared\n+   -\
    \ apacheds-protocol-ldap\n+   - apacheds-core-entry\n+   - apacheds-core\n+  \
    \ - apacheds-server-jndi\n+   - shared-ldap\n\n> As Spring Security supports version\
    \ 1.5.5 of embedded Apache Directory Server, all the given JAR files belong to\
    \ version 1.5.5.\n\nAs we are using Spring Security's LDAP support, spring-security-ldap\
    \ JAR dependency is also added to the pom.xml file.\n\nLet's now look at configuration,\
    \ which instructs Spring Security to authenticate against the embedded LDAP server.\n\
    \n# Authenticating against the LDAP server\n\nTo authenticate against the embedded\
    \ LDAP server, the following configuration has been added to the applicationContext-security.xml\
    \ file:\n\n```\n<authentication-manager>\n<authentication-provider>\n<ldap-user-service\
    \ group-search-filter=\"uniqueMember={0}\"\n group-search-base=\"ou=groups\"\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 336
  md: '```

    user-search-base="ou-users"

    user-search-filter="uid={0}"

    group-role-attribute="businessCategory" />

    </authentication-provider>

    </authentication-manager>

    ```


    The <ldap-user-service> configures LdapUserDetailsService (an implementation of
    UserDetailsService that we discussed earlier), which loads user details containing
    username, password, and roles from the LDAP server. Authentication is performed
    by comparing the user entered password with the user details loaded by the LdapUserDetailsService
    instance.


    The <ldap-user-service> element accepts the following attributes:


    +   user-search-base: Specifies the part of the directory tree under which search
    for users is performed. The value ou-users means that the search will be performed
    on entries that are defined under DN, which are ou=users, dc=sample, dc=com.


    +   user-search-filter: It specifies the filter criteria used for searching users
    in the directory tree. The value uid={0} means that search is made for the user
    entry where value of uid attribute is equal to username entered by the user in
    the login form. The value {0} is replaced by the username entered by the user
    in the login form.


    +   group-search-base: It specifies the part of the directory tree under which
    search for groups is performed. The value ou-groups means that the search will
    be performed on entries that are defined under DN, which are ou=groups,dc=sample,
    and dc=com.


    +   group-search-filter: It specifies the filter criteria used for searching groups
    in the directory tree. The value uniqueMember={0} means that a search is made
    for group entries, where the value of the uniqueMember attribute is equal to the
    DN of the user.


    If user ashish attempts to log in to the Flight Booking application, then the
    value of the user-search-base and user-search-filter attributes will be used for
    searching the user. This will result in returning the entry whose DN is uid=ashish,ou=users,dc=sample,dc=com.
    Now, the value of the group-search-filter and group-search-base attributes will
    be used to search for the group entry whose uniqueMember attribute value is uid=ashish,ou=users,dc=sample,dc=com.
    This will return the cn=appuser,ou=groups,dc=sample,dc=com entry because it contains
    the uniqueMember attribute with value uid=ashish,ou=users,dc=sample,dc=com.


    +   group-role-attribute: It specifies the attribute of the group entry, which
    is used as the role name. As the value of group-role-attribute is businessCategory,
    if the group entry returned for the authenticating user is cn=administrator,ou=groups,dc=sample,dc=com,
    then the role of the user is admin_user—the value of the businessCategory attribute
    of the entry.'
  merge: -1
  img_proc: true
