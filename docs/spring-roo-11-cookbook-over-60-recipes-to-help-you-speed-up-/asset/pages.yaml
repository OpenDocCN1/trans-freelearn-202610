- pgno: 123
  md: '# There''s more...


    Let''s now look at how Roo supports testing entities that participate in relationships
    with other entities and at how to add a custom dynamic finder method corresponding
    to the many-to-one relationship field.


    # Testing JPA entities that participate in relationships


    Testing entities that participate in relationships can get a bit tricky sometimes
    because integration tests may not be able to check relationship constraints. For
    instance, the testRemove method of FlightDescriptionIntegrationTest (refer to
    the FlightDescriptionIntegrationTest_Roo_IntegrationTest.aj AspectJ ITD) doesn''t
    test for the scenario in which one or more Flight entity instances are associated
    with the FlightDescription instance being removed.


    To effectively test entities that participate in relationships, you may want to
    modify auto-generated test methods and data on demand classes. For instance, in
    our example scenario, the data on demand class of the FlightDescription (refer
    to the getNewTransientFlightDescription method defined in the FlightDescriptionDataOnDemand_Roo_DataOnDemand.aj
    AspectJ ITD) only creates FlightDescription instances, and doesn''t create any
    associated Flight instances. As a result of this, the testRemove method will never
    be able to test a scenario in which one or more Flight instances are associated
    with the FlightDescription instance being removed. So, to perform effective testing
    of the FlightDescription entity, you''ll need to do the following:


    +   - Define the getNewTransientFlightDescription method in the FlightDescriptionDataOnDemand.java
    class, which creates the FlightDescription objects that are associated with one
    or more Flight instances

    +   - Define the testRemove method in the FlightDescriptionIntegrationTesting
    class to first remove all the related Flight entities, before attempting to remove
    the FlightDescription entity


    If entities are not related, data on demand classes are independent of each other.
    But, if the entities are related, then creating test data becomes a bit of a involved
    task. For instance, the Flight entity has a many-to-one relationship with FlightDescription;
    which means that the data on demand class for the Flight entity should create
    records in the FLIGHT_TBL table, which have a foreign key reference to the FLIGHT_DESC_TBL
    table records. It is mandatory to assign a foreign key reference to the Flight
    records in the FLIGHT_TBL table because the FlightDescription relationship is
    annotated with @NotNull.'
  merge: -1
  img_proc: true
