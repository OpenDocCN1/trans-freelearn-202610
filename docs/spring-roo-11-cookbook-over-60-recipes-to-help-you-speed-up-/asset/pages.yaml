- pgno: 76
  md: "# # Adding table column information in persistent entity fields\n\nDelete the\
    \ origin field from the Flight.java file and ensure that Spring Roo is running\
    \ in the background to remove the origin field from AspectJ ITD files.\n\nNow,\
    \ add the origin field to the Flight persistent entity using the field command,\
    \ and specify the name of the table column, FLT_ORIGIN, to which the origin field\
    \ maps, as the value of column argument:\n\n```\n~.domain.Flight roo> field string\
    \ --fieldName origin --column FLT_ORIGIN\n```\n\nThe presence of the column argument\
    \ indicates that the field is annotated with the @Column JPA annotation with the\
    \ value of the column argument representing the value of the name attribute of\
    \ the @Column annotation, as shown here:\n\n```\n@RooJavaBean\n@RooToString\n\
    @RooEntity(table = \"FLIGHT_TBL\")\npublic class Flight {\n\n    @Column(name\
    \ = \"FLT_ORIGIN\")\n    private String origin;\n\n}\n```\n\nThe Roo script ch02_persistent_fields.roo\
    \ that accompanies this book contains commands to create the flight-app project\
    \ consisting of the Flight entity and the FlightKey class. Additionally, the script\
    \ adds database column mapping for all the persistent fields defined in the Flight\
    \ entity and FlightKey class. It is recommended that you exit the Roo shell, remove\
    \ all the files from ch02-recipes directory, and recreate the flight-app Roo project\
    \ by executing the ch02_persistent_fields.roo script.\n\n# ## The class argument\
    \ in roo commands\n\nWe saw in a couple of recipes that the focus command is used\
    \ to switch command reference from one class or interface to another class or\
    \ interface in the Roo project, followed by Roo commands that apply to that class\
    \ or interface. Instead of using the focus command, you can use the class argument\
    \ of the roo command (if supported by the roo command) to explicitly specify the\
    \ class or interface to which the command applies. For instance, we can add a\
    \ flightId field to FlightKey class without using the focus command, as shown\
    \ here:\n\n```\n...roo> field string --class ~.domain.Flight --fieldName origin\
    \ --column FLT_ORIGIN\n```\n\nAs we can see from the field command, we can specify\
    \ a fully-qualified name of the class on which the command applies."
