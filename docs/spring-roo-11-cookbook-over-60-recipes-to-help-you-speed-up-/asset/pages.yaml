- pgno: 437
  md: "# ## See also\n\n+   - Refer to the *Adding Roo to a project using pull-out\
    \ refactoring* recipe to see how you can pull out methods and attributes from\
    \ Java class to an AspectJ ITD file\n\n# # Adding Roo to a project using pull-out\
    \ refactoring\n\nThe pull-out refactoring is the reverse of push-in refactoring.\
    \ In push-out refactoring you extract methods and attributes from the Java source\
    \ file and move it to an AspectJ ITD file. This feature is particularly useful\
    \ in the following situations:\n\n+   - If you had earlier performed push-in refactoring\
    \ on your Roo project, and now you want to develop your project once again using\
    \ Spring Roo\n+   - If you have partially developed a project and now you want\
    \ to use Spring Roo in its development\n+   - In this recipe we'll look at how\
    \ to pull-out the `toString` method from the `Flight.java` file to `Flight_To_String.aj`\
    \ file.\n\n# ## Getting ready\n\nFollow the instructions specified in the *Removing\
    \ Roo with push-in refactoring* recipe to push the `toString` method defined in\
    \ the `Flight_To_String.aj` file to `Flight.java` file.\n\n# ## How to do it...\n\
    \nFollow these steps to move the code from Java source file to an AspectJ ITD\
    \ file:\n\n+   1. Create a `Flight_To_String.aj` file in the `sample.roo.flightapp.domain`\
    \ package, as shown here:\n+      ```\n+      package sample.roo.flightapp.domain;\n\
    +   \n+      public aspect Flight_To_String { }\n+      ```\n+      This an empty\
    \ aspect into which we want to pull-out fields, contructors, methods, and so on,\
    \ from Java source file.\n+   2. Open the `Flight.java` file in Eclipse IDE."
  merge: -1
  img_proc: true
