- pgno: 113
  md: "# # Adding dynamic finder methods to an entity\n\nThe finder list command shows\
    \ the candidate dynamic finder method names whose implementations Roo can automatically\
    \ generate. In this recipe, we will look at how to add dynamic finder methods\
    \ to a persistent entity using the finder add command. As an example, we will\
    \ add the findFlightsByDestinationLikeAndOriginLike method to a Flight entity.\n\
    \n# ## Getting ready\n\nRefer to the Viewing candidate dynamic finder methods\
    \ recipe, to create the flight-app Roo project.\n\nStart the Roo shell from the\
    \ C:\\\\roo-cookbook\\\\ch03-recipes directory.\n\n# ## How to do it...\n\nTo\
    \ add dynamic finder methods, follow the given steps:\n\n+   1. Set the focus\
    \ of subsequent commands on the Flight entity using a focus command:\n+   \n+\
    \   roo> focus --class ~.domain.Flight\n\n+   2. Add the findFlightsByDestinationLikeAndOriginLike\
    \ dynamic finder method to the Flight entity using the finder add command:\n+\
    \   \n+   .. roo> finder add findFlightsByDestinationLikeAndOriginLike\n+   \n\
    +   Updated SRC_MAIN_JAVA\\\\sample\\\\roo\\\\flightapp\\\\domain\\\\Flight.java\n\
    +   Created SRC_MAIN_JAVA\\\\sample\\\\roo\\\\flightapp\\\\domain\\\\Flight_Roo_Finder.aj\n\
    \n# ## How it works...\n\nThe finder add command adds a dynamic finder method\
    \ implementation to a persistent entity. This feature saves the effort of writing\
    \ your own JPA-QL queries for the finder methods. The finder add command adds\
    \ the name of the finder method to the finders attribute of the @RooEntity annotation\
    \ (refer to Chapter 2 for more details). The presence of the finders attribute\
    \ in the @RooEntity annotation triggers the creation of a * _Roo_Finder.aj ITD\
    \ file (if it doesn't already exist for the entity) and auto-generation of the\
    \ finder method implementation in the *_Roo_Finder.aj ITD file. *_Roo_Finder.aj\
    \ adds finder method implementation to the corresponding JPA entity class."
  merge: -1
  img_proc: true
- pgno: 114
  md: 'The following figure shows how Roo adds dynamic finder methods to a JPA entity
    when the finder add command is executed:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_114_0.png)


    The given figure shows that when the `finder add xyz` command is executed, the
    **Finder add-on** of Roo adds the `xyz` method name to the `finders` attribute
    of the `@RooElement` annotation in the `Flight.java` file. As Spring Roo monitors
    Java files that are annotated with Roo''s annotations, Roo uses the Finder add-on
    to add the `xyz` dynamic finder method implementation to the `Flight_Roo_Finder.aj`
    file. If `Flight_Roo_Finder.aj` doesn''t exist, the Finder add-on creates it.
    Now, if you define the `xyz` method in the `Flight.java` file (because you may
    want to customize the implementation of the `xyz` method generated by Roo), the
    Finder add-on removes it from the `Flight_Roo_Finder.aj` file.


    The following code shows the modified `@RooEntity` annotation of the `Flight`
    entity, after the `finder add` command is executed:


    ```

    @RooEntity(identifierType = FlightKey.class,

    table = "FLIGHT_TBL",

    finders = { "findFlightsByDestinationLikeAndOriginLike"})

    public class Flight { ... }

    ```


    The following code shows the auto-generated implementation of the `findFlightsByDestinationLikeAndOriginLike`
    finder method in the `Flight_Roo_Finder.aj` file:'
  merge: -1
