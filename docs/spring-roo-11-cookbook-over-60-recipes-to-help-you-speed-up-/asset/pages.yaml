  md: 'Note that if you are completely removing Roo from your project, then you also
    need to remove dependency on Roo from the pom.xml file of your project and remove
    all the @Roo* annotations (and corresponding import statements) from your project.


    # There''s more...


    Let''s see how you can push all the declarations in a single AspectJ ITD file
    to the target Java source file, and how you can push all the declarations in all
    the AspectJ ITD files in the Roo project to their respective target Java source
    files.


    # Push-in refactoring—single AspectJ ITD file


    To push all the declarations from a single AspectJ ITD file to the target Java
    source file, right-click the AspectJ ITD file from the Project Explorer or right-click
    the element in Outline view that represents the AspectJ ITD type, and select Refactor
    | Push In option.


    The following screenshot shows the dialog box shown when you select Flight_Roo_JavaBean.aj
    ITD file of the flight-app project from Project Explorer and select the Refactor
    | Push In option.


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_436_0.png)


    This screenshot shows that all the declarations in the Flight_Roo_JavaBean.aj
    file now form part of the refactoring process.


    # Push-in refactoring – across the whole project


    To perform push-in refactoring across the whole project, select the project from
    Project Explorer and select the Refactor | Push In option.'
