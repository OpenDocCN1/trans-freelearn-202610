- pgno: 352
  md: "The `<url-pattern>` specifies that any URL that matches the `*.html` pattern\
    \ is secured and would require authentication. In the case of the flightapp-gae-gwt\
    \ application, the home page of the application is index.html, which is secured\
    \ according to the URL pattern specified by the `<url-pattern>` element. As the\
    \ entry into the flightapp-gae-gwt application is restricted, users need to authenticate\
    \ using their Google Accounts credentials before accessing the application. The\
    \ `<role-name>` element specifies * as the value, which means that any authenticated\
    \ user can access the application. If you want your application on GAE to be accessible\
    \ to anonymous users also, then remove the `<security-constraint>` element from\
    \ the web.xml file.\n\nIf you remove the `<security-constraint>` element from\
    \ web.xml of the flightapp-gae-gwt project and upload the application to GAE servers,\
    \ you'll find that an attempt to access the flightapp-gae-gwt application still\
    \ asks for authentication. The reason behind this behavior is that the sample.roo.flightapp.server.gae.GaeAuthFilter\
    \ servlet filter configured in the Roo-generated web.xml file. GaeAuthFilter is\
    \ a Roo-generated servlet filter, which checks if the user is logged in or not.\
    \ If the user is not logged in, then it redirects the user to the Google Accounts\
    \ sign in page. The following code listing from GaeAuthFilter.java shows the GaeAuthFilter\
    \ class:\n\n```\nimport com.google.appengine.api.users.UserService;\nimport com.google.appengine.api.users.UserServiceFactory;\n\
    \npublic class GaeAuthFilter implements Filter {\n...\n\npublic void doFilter(...)\
    \ ... {\n    UserService userService =\n    UserServiceFactory.getUserService();\n\
    \    ...\n\nif (!userService.isUserLoggedIn()) {\n    String requestUrl = request.getHeader(\"\
    requestUrl\");\n    if (requestUrl == null) {\n    requestUrl = request.getRequestURI();\n\
    \    }\n    response.setHeader(\"login\",\n    userService.createLoginURL(requestUrl));\n\
    \    response.sendError(HttpServletResponse.SC_UNAUTHORIZED);\n    return;\n}\n\
    ...\n}\n```"
