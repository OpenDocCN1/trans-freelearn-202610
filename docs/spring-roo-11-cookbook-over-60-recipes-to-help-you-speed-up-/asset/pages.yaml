  md: '# There''s more...


    One of the features that you will **not** find in Spring Roo is to revert the
    execution of a previous command. For instance, if you added a field using the
    `field` command and now you want to rollback the changes it made, then it is not
    possible. If you have mistakenly executed a Roo command, you can remove it from
    the `log.roo` file and re-execute the commands in `log.roo` using the `script`
    command.


    If a Roo command fails for some reason, it is commented out in the `log.roo` file.
    So, you don''t need to worry about removing commands that failed execution from
    your `log.roo` file.


