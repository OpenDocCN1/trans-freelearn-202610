  md: 'Replace the `index.jspx` file in the `/WEB-INF/views/customer/` folder with
    the `index.jspx` file contained in the source code folder of this chapter.


    Exit the Roo shell and use the following maven command to deploy the `flight-app`
    project as a dynamic web application in an embedded Tomcat instance:


    ```

    .ch04-recipe> mvn tomcat:run

    ```


    Now, you can access the `flight-app` application by accessing the following URL:

    `http://localhost:8080/flight-app`


    If you see the following web page, then it means you have successfully deployed
    the `flight-app` application on the embedded Tomcat instance:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_201_0.png)


    In the given screenshot, selecting the **Customer Controller View** menu option
    will take you to the form for creating the `Customer` and `Address` entities.


    # How it works...


    The `controller` class command is used for creating a manual controller. It accepts
    the following arguments:


    +   - `class`: The fully qualified name of the controller class that you want
    to create.


    +   - `preferredMapping`: The request path to which the controller maps. The value
    of the `preferredMapping` argument is used to derive the value of `@RequestMapping`
    class-level annotation of the generated controller. The value of the `preferredMapping`
    is also used to create a sub-folder inside the `/WEB-INF/views/` to contain the
    JSPX views and the tiles definitions XML file corresponding to the generated controller.


    As the output suggests, the following actions are performed by Roo when the `controller`
    class command is executed:


    +   - Creates a skeleton `CustomerController` web controller, leaving the controller
    implementation details to be provided by the developer.'
  merge: -1
  img_proc: true
- pgno: 202
  md: "+   - Creates the `customer` sub-folder inside `/WEB-INF/views/`.\n+   - Creates\
    \ a skeleton `index.jspx` view inside the `/WEB-INF/views/customer` folder, leaving\
    \ view details to be provided by the developer.\n+   - Creates a tiles definitions\
    \ XML file, `views.xml`, inside the `/WEB-INF/views/customer` folder. It contains\
    \ a single tile definition `customer/index`, which corresponds to the `index.jspx`\
    \ view. As we will see shortly, the skeleton `CustomerController` implementation\
    \ makes use of the `customer/index` tile definition to show the `index.jspx` view.\n\
    +   - Adds the `Customer Controller View` label to the `application.properties`\
    \ file, which is used by the `menu.jspx` file to display a menu option for invoking\
    \ the `CustomerController` web controller.\n+   - Adds a menu option labelled\
    \ `Customer Controller View` to the `menu.jspx` file for invoking the `CustomerController`\
    \ web controller.\n\nIt is important to note that no AspectJ ITD file is created\
    \ when the `controller class` command is executed.\n\nThe following code from\
    \ the `CustomerController.java` file shows the `CustomerController` generated\
    \ by the `controller class` command:\n\n```\n@RequestMapping(\"/customer/**\"\
    )\n@Controller\npublic class CustomerController {\n\n    @RequestMapping\n   \
    \ public void get(ModelMap modelMap, ...) { }\n\n    @RequestMapping(method =\
    \ RequestMethod.POST, value = \"{id}\")\n    public void post(@PathVariable Long\
    \ id, ...) { }\n\n    @RequestMapping\n    public String index() {\n        return\
    \ \"customer/index\";\n    }\n}\n```\n\nAs the given code shows, the generated\
    \ controller leaves it up to the developer to write the implementation of the\
    \ controller. The method `index()` is invoked when you click the **Customer Controller\
    \ View** menu option. The `index()` method simply returns `customer/index`, which\
    \ shows the `index.jspx` view.\n\nThe Roo-generated `CustomerController` is hardly\
    \ of any use, so you need to write it’s functionality. The `CustomerController.java`\
    \ file that accompanies the source code of this chapter contains the necessary\
    \ functionality for creating the `Customer` and `Address` entities. Let’s now\
