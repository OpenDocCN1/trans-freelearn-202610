- pgno: 369
  md: "# How it works...\n\nThe integration between Solr search platform and Roo-generated\
    \ domain model is achieved by:\n\n+   - Configuring Solr for Roo project\n+  \
    \ - Defining methods to add domain model data to Solr index\n+   - Defining methods\
    \ for querying Solr search server\n\nLet's now look at how Roo simplifies Solr\
    \ integration.\n\n# Configuring Solr for Roo project\n\nThe solr setup command\
    \ configures Solr for the Roo project. When solr setup command is executed, Roo\
    \ takes the following actions:\n\n+   - Adds dependency of project on SolrJ 1.4.0\
    \ in pom.xml file. SolrJ is used by JPA entities to add entity data to Solr index\
    \ and for querying the Solr search server.\n\n+   - Enables support for @Async\
    \ annotated methods in the project by adding <annotation-driven> element of Spring's\
    \ task namespace in applicationContext.xml file, as shown here:\n+   \n+   <task:annotation-driven\
    \ executor=\"asyncExecutor\"\n+       mode=\"aspectj\" />\n\nThe executor attribute\
    \ refers to an implementation of the java.util.concurrent.Executor interface,\
    \ responsible for executing the @Async annotated method.\n\n+   - Configures Spring's\
    \ ThreadPoolTaskExecutor in applicationContext.xml using <executor> element of\
    \ Spring's task namespace, as shown here:\n+   \n+   <task:executor id=\"asyncExecutor\"\
    \n+       pool-size=\"${executor.poolSize}\" />\n\nSpring's ThreadPoolTaskExecutor\
    \ configures a java.util.concurrent.ThreadPoolExecutor instance (an implementation\
    \ of java.util.concurrent.Executor) with the thread pool size specified by the\
    \ pool-size attribute value. The ${executor.poolSize} placeholder's value comes\
    \ from the solr.properties file.\n\n+   - Configures SolrJ's CommonsHttpSolrServer\
    \ instance (a subclass of SolrJ's SolrServer abstract class) in the applicationContext.xml\
    \ file to allow JPA entities to interact with the Solr search server over HTTP\
    \ protocol:\n+   \n+   <bean class=\"org.apache.solr.client.solrj.impl.CommonsHttpSolrServer\"\
    \ id=\"solrServer\">\n+       <constructor-arg value=\"${solr.serverUrl}\" />\n\
    +   </bean>"
