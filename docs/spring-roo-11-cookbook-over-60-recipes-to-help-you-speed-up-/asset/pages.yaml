- pgno: 35
  md: "# # Importing a Roo project into Eclipse or IntelliJ IDEA IDE\n\nAs explained\
    \ in the Setting up Roo recipe, you can either use STS or Eclipse with STS components\
    \ installed to work with Roo projects. Alternatively, you can create necessary\
    \ project files to import the Roo project into Eclipse or IntelliJ IDEA IDE (for\
    \ working directly with Java sources and configuration files) and run the Spring\
    \ Roo shell separately in standalone mode to execute Roo commands.\n\nIn this\
    \ recipe, we look at how you can import a Roo project into Eclipse or IntelliJ\
    \ IDEA by executing commands provided by Spring Roo.\n\n# ## Getting ready\n\n\
    Start the Roo shell from the `C:\\roo-cookbook\\ch01-recipe` directory, which\
    \ contains the `flight-app` Roo project.\n\n# ## How to do it...\n\nTo import\
    \ the Roo project into Eclipse or IntelliJ IDEA follow the given steps:\n\n+ \
    \  1. To create Eclipse-specific project files, execute the `perform eclipse`\
    \ command from the Roo shell, shown as follows:\n+   `roo> perform eclipse`\n\
    +   \n+   Alternatively, you can use the `perform` command to execute the `eclipse:eclipse`\
    \ Maven goal of the Maven Eclipse plugin, shown as follows:\n+   `roo> perform\
    \ command --mavenCommand eclipse:eclipse`\n+   \n+   2. To create IntelliJ IDEA\
    \ specific project files, use the `perform` command to execute the `idea:idea`\
    \ Maven goal of the Maven IDEA plugin, shown as follows:\n+   `roo> perform command\
    \ --mavenCommand idea:idea`\n\n# ## How it works...\n\nThe `perform eclipse` and\
    \ `perform command` commands are processed by the Maven add-on of Spring Roo.\
    \ The `perform eclipse` command generates Eclipse IDE specific configuration files,\
    \ such as `.project` and `.classpath` files. Behind the scenes, the `perform eclipse`\
    \ command executes the `eclipse:eclipse` goal of the Maven eclipse plugin."
  merge: -1
