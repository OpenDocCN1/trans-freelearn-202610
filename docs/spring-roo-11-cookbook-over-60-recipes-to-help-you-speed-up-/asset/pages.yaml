  md: "```\n~.domain.Flight roo> entity --class ~.domain.FlightDescription\n--identifierColumn\
    \ FLIGHT_DESC_ID --identifierField flightDescId\n--identifierType java.lang.Long\
    \ --table FLIGHT_DESC_TBL\n--testAutomatically\n```\n\n+   4. Add attributes to\
    \ the FlightDescription entity:\n+   ~.domain.FlightDescription roo> field string\
    \ --fieldName origin\n+   --column ORIGIN_CITY --notNull\n+   \n+   ~.domain.FlightDescription\
    \ roo> field string --fieldName\n+   destination --column DESTINATION_CITY --notNull\n\
    +   \n+   ~.domain.FlightDescription roo> field number --type java.lang.\n+  \
    \ Float --fieldName price --column PRICE --notNull\n\n+   5. Set the focus of\
    \ the Roo commands on the Flight entity and use the field\n+   reference command\
    \ to create a many-to-one relationship between the Flight and\n+   FlightDescription\
    \ entities, as shown here:\n+   ~.domain.FlightDescription roo> focus --class\
    \ ~.domain.Flight\n+   \n+   ~.domain.Flight roo> field reference --fieldName\
    \ flightDescription\n+   --type ~.domain.FlightDescription --joinColumnName FLIGHT_DESC_ID\n\
    +   --notNull\n\n# How it works...\n\nAs we are not using composite primary keys\
    \ for the entities, the following things you'll\nnotice about the entity commands\
    \ that we have used for creating Flight and\nFlightDescription entities:\n\n+\
    \   ► identifierField: An optional argument has been used to give a custom name\n\
    +   to the identifier field of the entities. For instance, the name of identifier\
    \ field of the\n+   Flight entity is flightId and that of FlightDescription is\
    \ flightDescId. If\n+   we had not used the identifierField argument, then by\
    \ default Roo would have\n+   assigned id as the name of the entity's identifier\
    \ field.\n\n+   ► identifierColumn: An optional argument has been used to set\
    \ the name of\n+   the table column to which the identifier field maps. This argument\
    \ instructs Roo\n+   to add the @Column JPA annotation to the identifier field.\
    \ If you don't specify the\n+   identifierColumn, by default the name of the mapping\
