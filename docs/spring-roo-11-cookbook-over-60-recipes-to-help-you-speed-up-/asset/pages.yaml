- pgno: 277
  md: "In this code, @RooFlexScaffold annotation instructs Roo to generate a corresponding\
    \ AspectJ ITD file. This AspectJ ITD file introduces methods into the FlightDescriptionService\
    \ class for performing CRUD operations on the FlightDescription entity. The entity\
    \ attribute of @RooFlexScaffold annotation specifies the JPA entity managed by\
    \ the FlightDescriptionService class. The @RemotingDestination annotation of Spring\
    \ indicates that FlightDescriptionService class is exported as a remoting destination.\n\
    \nSpring-managed MessageBroker is responsible for routing messages received from\
    \ the Flex clients to RemotingService, which in turn invokes the method on the\
    \ Spring-managed remoting destination. The @Service annotation indicates that\
    \ FlightDescriptionService represents Spring's service component. The use of the\
    \ @Service annotation ensures that FlightDescriptionService is auto-registered\
    \ with Spring's web application context, using the classpath scanning feature\
    \ of Spring (refer to the <component-scan> element defined in the webmvc-config.xml\
    \ file).\n\nThe following code listing shows the AspectJ ITD file created corresponding\
    \ to the @RooFlexScaffold annotation in the FlightDescriptionService class:\n\n\
    ```\nFlightDescriptionService_Roo_Service.aj\npackage sample.roo.flightapp.flex;\n\
    \nimport java.lang.Long;\nimport java.util.List;\nimport sample.roo.flightapp.domain.FlightDescription;\n\
    \nprivileged aspect FlightDescriptionService_Roo_Service {\n\n    public FlightDescription\n\
    \        FlightDescriptionService.show(Long id) {\n        ...\n        return\
    \ FlightDescription.findFlightDescription(id);\n    }\n\n    public List<FlightDescription>\n\
    \        FlightDescriptionService.list() {\n        return FlightDescription.findAllFlightDescriptions();\n\
    \    }\n\n    ...\n}\n```\n\nThis code shows that FlightDescriptionService_Roo_Service.aj\
    \ introduces CRUD operations for the FlightDescription JPA entity in the FlightDescriptionService\
    \ class. Though not shown in the above code, pagination support is also introduced\
    \ for reading the list of FlightDescription JPA entities."
