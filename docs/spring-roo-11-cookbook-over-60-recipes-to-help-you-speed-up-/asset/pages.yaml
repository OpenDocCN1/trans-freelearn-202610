    # Sending e-mails with JavaMail Session configured in JNDI


    If JavaMail Session is configured in JNDI of your application server, then you''ll
    need to modify the applicationContext.xml file of your Roo project to create the
    JavaMail SenderImpl instance using JavaMail Session configured in JNDI, as shown
    here:


    ```

    <beans ... xmlns:jee="http://www.springframework.org/schema/jee" ...

    xsi:schemaLocation="http://www.springframework.org/schema/jee http://

    www.springframework.org/schema/jee/spring-jee-3.0.xsd">

    ......

    <jee:jndi-lookup id="mailSession" jndi-name="mail/session" />

    <bean class="org.springframework.mail.javamail.JavaMailSenderImpl"

    id="mailSender">

    <property name="session" value="mailSession"/>

    </bean>

    .....

    ```


    The jndi-lookup element of Spring''s jee namespace, shown in the given code,

    is responsible for accessing the JavaMail Session configured in JNDI with name

    "mail/session" (referred to by the jndi-name attribute) and making it available
    in

    a Spring application context with bean id as "mailSession".


