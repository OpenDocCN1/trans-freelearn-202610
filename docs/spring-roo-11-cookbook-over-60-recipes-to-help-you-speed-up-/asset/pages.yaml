- pgno: 238
  md: 'You can now use the **Flights** and **FlightDescriptions** menu options to
    perform CRUD operations on Flight and FlightDescription JPA entities.


    # How it works...


    The gwt setup command is processed by the GWT add-on of Spring Roo.


    You might be wondering, why the Roo-generated GWT user interface doesn''t show
    a link corresponding to the findFlightDescriptionsByDestinationAndOrigin finder
    method in the FlightDescription JPA entity? As of Spring Roo 1.1.5, the GWT add-on
    doesn''t add finder functionality to the scaffolded GWT application.


    The gwt setup command does the heavy lifting of scaffolding GWT Activities, Places,
    Proxies, and Views for performing CRUD operations on JPA entities. Let''s first
    take a look at the Roo-generated GWT module descriptor file, ApplicationScaffold.gwt.xml,
    which describes a GWT module.


    # GWT module descriptor


    Roo creates ApplicationScaffold.gwt.xml in the root package, sample.roo.flightapp,
    of the flightapp-gwt project. It defines module dependencies, source paths, properties,
    deferred binding configurations, and module entry points. Let''s look at some
    of the important elements defined in ApplicationScaffold.gwt.xml.


    By default, the name of the GWT module is derived from the location of the module
    descriptor. As Roo creates the ApplicationScaffold.gwt.xml file in the sample.roo.flightapp
    package, the name of the module is sample.roo.flightapp.ApplicationScaffold. The
    ApplicationScaffold.gwt.xml file renames the module to applicationScaffold using
    the rename-to attribute of the <module> element, as shown here:


    ```

    <module rename-to="applicationScaffold">

    ```


    The GWT compiler generates JavaScript code in the directory identified by the
    module name; therefore, the code for our applicationScaffold module is generated
    in the applicationScaffold sub-directory of the generated WAR file.


    The <inherits> element of the module descriptor specifies modules on which the
    module is dependent upon. For instance, applicationScaffold is dependent on User,
    Logging, Activity, Places, and so on, built-in modules of GWT, as shown here:


    ```

    <inherits name=''com.google.gwt.activity.Activity'' />

    <inherits name=''com.google.gwt.place.Place'' />

    <inherits name="com.google.gwt.user.User"/>

    <inherits name=''com.google.gwt.logging.Logging'' />

    ```'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'The `<source>` element of the module descriptor specifies package, including
    its sub-packages (relative to the classpath location of `ApplicationScaffold.gwt.xml`
    file), which contain Java classes that GWT compiler needs to translate into JavaScript,
    as shown here for `applicationScaffold` module:


    ```

    <source path=''client'' />

    <source path=''shared'' />

    ```


    The given `<source>` element instructs the GWT compiler to translate Java classes
    contained in `sample.roo.flightapp.client` and `sample.roo.flightapp.shared` packages,
    and their sub-packages.


    The `<public>` element of module descriptor specifies packages (and their sub-packages)
    that contain publicly accessible resources, like images and CSS files, as shown
    here:


    ```

    <public path="public" />

    ```


    As with the `<source>` elements, the `<public>` element specifies the location
    of packages relative to the classpath location of the module descriptor file.


    The `ApplicationScaffold.gwt.xml` file configures logging for the module, as shown
    here:


    ```

    <set-property name="gwt.logging.enabled" value="TRUE"/>

    <set-property name="gwt.logging.logLevel" value="INFO"/>

    <set-property name="gwt.logging.consoleHandler"

    value="ENABLED"/>

    <set-property name="gwt.logging.developmentModeHandler"

    value="ENABLED"/>

    <set-property name="gwt.logging.simpleRemoteHandler"

    value="DISABLED"/>

    ...

    ```


    In this code, `gwt.logging.enabled` property enables logging for the `applicationScaffold`
    module, `gwt.logging.logLevel` property sets the logging level to INFO, `gwt.logging.consoleHandler`
    property enables logger output to appear in the IDE console, `gwt.logging.developmentModeHandler`
    property enables logger output to appear in the ''Development Mode'' console of
    the IDE and `gwt.logging.simpleRemoteHandler` property disables remote logging
    of log messages. Later in this recipe, we''ll see that `gwt.logging.simpleRemoteHandler`
    property is set to `ENABLED` to enable logging messages on the server-side.


    Roo-generated GWT applications by default provide support for the mobile Safari
    browser. So, if you are developing a GWT application, it''ll work seamlessly on
    mobile phones that use the mobile Safari browser. If the application is accessed
    using the mobile Safari browser, then the GWT application will create a web UI
    suitable for display in mobile devices. To support both desktop and mobile Safari
    browsers, the `applicationScaffold` module makes use of the deferred binding feature
    of the GWT compiler.'
