- pgno: 203
  md: 'The index() method of the CustomerController sets the Customer JPA entity as
    the form-backing object and adds another model attribute, which identifies whether
    to show the address section of the form or not. The following code from the CustomerController.java
    file shows the index() method:


    ```

    ```java

    @RequestMapping

    public String index(Model model) {

    model.addAttribute("showAddressSection", false);

    Customer customer = new Customer();

    customer.setAddress(new Address());

    model.addAttribute("customer", customer);

    return "customer/index";

    }

    ```

    ```


    The index() method sets the showAddressSection and customer model attributes.
    The showAddressSection attribute is used as a flag by the index.jspx view to decide
    whether to show or hide the address section of the form. The customer model attribute
    represents the Customer JPA entity, which acts as the form-backing object.


    Now, when the Add address button is clicked by the user, the following showAddress
    method of the CustomerController is invoked:


    ```

    ```java

    @RequestMapping(method = RequestMethod.POST,

    params = "user-action=showAddressForm")

    public String showAddress(@Valid Customer customer,

    BindingResult result, Model model, ...) {

    if (result.hasErrors()) {

    model.addAttribute("customer", customer);

    } else {

    model.addAttribute("showAddressSection", true);

    model.addAttribute("customer", customer);

    }

    return "customer/index";

    }

    ```

    ```


    The @RequestMapping annotation in the given code specifies that the showAddress
    method is invoked when the request type is HTTP POST and the value of the user-action
    request parameter is the showAddressForm. If no binding or validation errors occur,
    then the showAddressSection model attribute is set to true.


    If the showAddressSection model attribute value is true, then it means the index.jspx
    view will show the address section of the form to allow users to enter an address
    for the customer. Now, the user can enter address information and click the Save
    button to persist the Customer and the associated Address JPA entity instance.
    The following create method of the CustomerController is invoked when the user
    clicks Save button:'
  merge: -1
  img_proc: true
