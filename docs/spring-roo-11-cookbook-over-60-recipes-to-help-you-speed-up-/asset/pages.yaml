- pgno: 118
  md: '# Adding dynamic finders through @RooEntity annotation


    The @RooEntity annotation accepts a finders attribute, which contains an array
    of string values identifying names of dynamic finder methods that must be generated
    for the persistent entity. The finders add command adds the finder method name
    to the finders attribute, which in turn results in the generation of dynamic finder
    method by Roo. As the addition of finder method name to finders attribute triggers
    generation of dynamic finder method implementation, instead of using the finder
    add command you can directly add the name of the finder method to the finders
    attribute using IDE, which in turn will trigger Roo to generate the finder method
    implementation.


    # See also


    +   - Refer to the Controlling auto-generated methods of persistent entities recipe
    in Chapter 2, Persisting Objects Using JPA to know more about the elements supported
    by the @RooEntity annotation

    +   - Refer to the Viewing candidate dynamic finder methods recipe to see how
    the finder list command is used to show the names of candidate dynamic finder
    methods


    # Creating a many-to-one (or one-to-one) relationship between entities


    In real-world applications, domain entities have relationships between them. In
    this section, we look at how Roo simplifies creating a many-to-one (or one-to-one)
    relationship between JPA entities.


    The following figure shows the relationship between the FLIGHT_TBL and FLIGHT_DESC_TBL
    tables, which we will use as a reference to model our many-to-one relationship:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_118_0.png)


    In the given figure, the FLIGHT_TBL table contains scheduled flight details and
    the FLIGHT_DESC_TBL table contains details of all the flights that an airline
    offers. Each record in the FLIGHT_TBL table refers to exactly one FLIGHT_DESC_TBL
    record. As there can be multiple flights from one city to another, the relationship
    between FLIGHT_TBL and FLIGHT_DESC_TBL is many-to-one. The FLIGHT_TBL table is
    mapped to the FLIGHT_DESC_TBL table by the FLIGHT_DESC_ID foreign key. It is expected
    that if a FLIGHT_TBL record is deleted, then the deletion is limited to the FLIGHT_TBL
    only.'
  merge: -1
  img_proc: true
