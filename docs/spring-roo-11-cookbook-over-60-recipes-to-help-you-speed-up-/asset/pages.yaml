- pgno: 198
  md: '# Manually creating a Spring MVC controller for a JPA entity


    If you want to create a custom controller, then Roo offers a `controller` class
    command that creates the skeleton structure of a controller and a JSPX view to
    let you quickly get started.


    Let''s consider that in our `flight-app` application we have the following entities:


    +   - `Customer`: Represents a customer in the flight booking application

    +   - `Address`: Represents the address of the customer


    For the sake of simplicity, let''s assume that there is a one-to-one bidirectional
    relationship between `Customer` and `Address` entities, the `Customer` being the
    owner of the relationship. The `Customer` entity has only one field: the `customerName`
    and the `Address` entity has two fields: `addressLine1` and `addressLine2`.


    Let''s say the `flight-app` application requires that the `Customer` and the corresponding
    `Address` entities are created from the same form. When the user enters the customer''s
    name and clicks the **Add address** button (as shown in the next screenshot),
    then the form is expanded to show the table for entering address information for
    the customer, and for saving the customer''s details. The following screenshot
    shows the form for entering information:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_198_0.png)


    In the given screenshot, clicking the **Save** button creates a `Customer` and
    also the corresponding `Address` entity instance.


    As we have seen earlier, Roo generates views, which allow creating or updating
    only a single entity at a time. In this scenario, we need to create both `Customer`
    and `Address` entities simultaneously. This not only requires us to create a custom
    view but also a custom controller.


    # Getting ready


    Delete the contents of the `ch04-recipe` sub-directory inside the `C:\roo-cookbook`
    directory.


    Copy the `ch04_manual_controller.roo` script into the `ch04-recipe` directory.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Execute the ch04_manual_controller.roo script which creates the flight-app
    Roo project, sets up Hibernate as the persistence provider, configures MySQL as
    the database for the application, creates Flight, FlightDescription, Customer,
    and Address JPA entities, defines the many-to-one relationship between Flight
    and FlightDescription entities and a one-to-one relationship between the Customer
    and Address entities. If you are using a different database than MySQL or your
    connection settings are different than what is specified in the script, then modify
    the script accordingly.


    Start the Roo shell from the C:\roo-cookbook\ch04-recipe directory.


    # How to do it...


    To see how to use a manually created Spring Web MVC controller for the given application
    requirement, follow the given steps:


    +   1. Execute the `web mvc setup` command to set up the Spring Web MVC artifacts,
    and to convert the Roo project into a web project:

    +   ```

    +   .. roo> web mvc setup

    +   ```


    +   2. Execute the `controller class` command, as shown here:

    +   ```

    +   .. roo> controller class --class ~.web.CustomerController

    +   --preferredMapping /customer

    +   ```

