    # # Scaffolding a Flex application from JPA entities


    In the previous recipe, we saw how to set up a project to use Flex and Spring
    BlazeDS integration. In this recipe, we go a step further and scaffold a complete
    Flex application that interacts with BlazeDS to perform CRUD operations on the
    JPA entities.


    # ## Getting ready


    This recipe is an extension of the previous recipe, Getting started with Flex
    application development; therefore, perform the steps described in the previous
    recipe to set up the flightapp_flex project to use the Flex and Spring BlazeDS
    integration.


    Start the Roo shell from the C:\roo-cookbook\ch05-flex directory—the directory
    in which the flightapp_flex project was created when you went through the Getting
    started with Flex application development recipe.


    # ## How to do it...


    To scaffold a flex application, follow the steps given here:


    +   1. Execute the flex remoting all command, as shown here:


    ```

    .. roo> flex remoting all --package ~.flex

    Created SRC_MAIN_JAVA\sample\roo\flightapp\flex

    Created ..\FlightDescriptionService.java

    Created ..\FlightDescriptionService_Roo_Service.aj

    ..

    Created ROOT\src\main\flex\sample\roo\flightapp\domain

    Created ..\FlightDescription.as

    Updated ROOT\src\main\flex\flightapp_flex_scaffold.mxml

    Updated ROOT\src\main\flex\flightapp_flex_scaffold-config.xml

    Created ROOT\src\main\flex\sample\roo\flightapp\presentation\

    flightdescription

    Created ..\FlightDescriptionEvent.as

    ```'
