    specifies that pages specific to managing Flight JPA entity instances are accessible
    only to users with the ROLE_ADMIN_USER role.


    ```

    <intercept-url pattern="/flightdescriptions/**"

    access="hasRole(''ROLE_ADMIN_USER'')" />

    ```


    +   □ The pattern /flightdescriptions/** refers to all the web pages that are
    specific to managing FlightDescription JPA entity instances. The hasRole(''ROLE_ADMIN_USER'')
