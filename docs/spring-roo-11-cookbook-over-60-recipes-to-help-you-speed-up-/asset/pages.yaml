- pgno: 302
  md: '# How it works...


    JavaMail API provides classes such as Session, Transport, Authenticator, and so
    on, that are used for composing, sending, and reading e-mails. If you want to
    directly use the JavaMail API to send an e-mail message, then you''ll need to
    know how to use different JavaMail API classes and interfaces. Spring framework
    abstracts the inner workings of JavaMail API by providing a set of classes and
    interfaces, which simplifies writing programs that require the functionality of
    sending e-mails. Also, Spring provides an exception hierarchy, which abstracts
    the exceptions thrown during composing, parsing, and sending e-mails or while
    authenticating with the mail server.


    The following figure shows the important classes and interfaces of Spring that
    provide e-mail sending functionality. You can find these classes and interfaces
    in the org.springframework.mail and org.springframework.mail.javamail packages
    of the Spring framework.


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_302_0.png)


    MailSender interface is a generic interface that defines e-mail sending functionality.
    As shown in the given figure, it defines two send methods that accept Spring''s
    SimpleMailMessage and SimpleMailMessage [] objects as arguments.


    The JavaMailSender interface extends the MailSender interface and defines methods
    specific to sending e-mails using JavaMail API. JavaMailSender defines methods
    such as createMimeMessage—for creating a MimeMessage instance (which is part of
    JavaMail API), send—for sending a MimeMessage, and so on. For the complete list
    of methods defined by Spring, refer to the Spring API documentation for the JavaMailSender
    interface. Spring provides a concrete implementation of the JavaMailSender interface
    through the JavaMailSenderImpl class, which you can use in your application to
    send e-mails.'
  merge: -1
  img_proc: true
- pgno: 303
  md: 'It is important to note that the MailSender interface defines send methods
    that accept SimpleMailMessage or SimpleMailMessage[] objects as arguments, and
    the JavaMailSender interface defines send methods that accept MimeMessage or MimeMessage[]
    objects as arguments. SimpleMailMessage is part of Spring framework and is useful
    for creating simple mail messages consisting of from, to, e-mail body, and so
    on. If you want to send more refined messages consisting of attachments, inline
    images, and so on, then you should use MimeMessage to create your mail message.


    Now that we have a basic understanding of different classes and interfaces that
    come into the picture when it comes to sending e-mails, let''s look at various
    Spring Roo commands that we used in the flightapp-web application for setting
    up e-mail support and sending e-mails.


    # Setting up e-mail sending support


    The email sender setup Roo command sets up e-mail sending support in a Roo project
    by configuring JavaMailSenderImpl in Spring''s application context. When the email
    sender setup command is executed, the following actions are performed by Roo:


    +   - The SRC_MAIN_RESOURCES\META-INF\spring\applicationContext.xml file is updated
    to configure JavaMailSenderImpl as a Spring bean

    +   - The SRC_MAIN_RESOURCES\META-INF\spring\email.properties file is created,
    which contains properties for setting up the JavaMailSenderImpl instance. The
    properties defined in the email.properties file come from the arguments specified
    for the email sender setup command.

    +   - The pom.xml file is updated to reflect dependency on JavaMail and Java Activation
    Framework(JAF) JAR files.


    The following listing shows the JavaMailSenderImpl configuration in the applicationContext.xml
    file:


    ```

    <bean class="org.springframework.mail.javamail.JavaMailSenderImpl" id="mailSender">

    <property name="host" value="${email.host}"/>

    <property name="protocol" value="${email.protocol}"/>

    <property name="port" value="${email.port}"/>

    <property name="username" value="${email.username}"/>

    <property name="password" value="${email.password}"/>

    <property name="javaMailProperties">

    <props>

    <prop key="mail.smtp.auth">true</prop>

    <prop key="mail.smtp.starttls.enable">true</prop>

    </props>

    </property>

    </bean>

    ```'
  merge: -1
  img_proc: true
- pgno: 304
  md: "In the given XML, JavaMailSenderImpl is configured with properties such as\n\
    host, protocol, port, and so on. The values of these properties come from the\n\
