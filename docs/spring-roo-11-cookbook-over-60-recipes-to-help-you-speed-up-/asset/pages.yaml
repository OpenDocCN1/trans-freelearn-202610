    \ String FlightService.getOrigin()\n{\n    return this.origin;\n}\n\npublic void\
    \ FlightService.setOrigin\n(String origin)\n{\n    this.origin = origin;\n}\n\
    }\n```\n\nThe given code shows that FlightService_Roo_JavaBean.aj is also a privileged\
