- pgno: 219
  md: 'Roo supports exposing CRUD operations and dynamic finders of JPA entities via
    RESTful interfaces that use JSON documents for exchanging data. As JSON is used
    by Roo-generated RESTful interfaces, you can modify JSPX pages of the Roo-generated
    Spring Web MVC application to use Ajax to interact with these RESTful interfaces.


    Roo provides two commands for adding JSON support to existing classes in the Roo
    project:


    +   - json add: Adds JSON support to the class specified using the class argument

    +   - json all: Adds JSON support to all the classes annotated with the @RooJavaBean
    annotation


    The json add and json all commands add the @RooJson annotation to Java classes.
    the @RooJson annotation results in the creation of a *_Roo_Json.aj AspectJ ITD
    corresponding to the class annotated with the @RooJson annotation. In this recipe,
    we''ll look at the *_Roo_Json.aj AspectJ ITD and at the @RooJson annotation.


    It is important to note that @RooJson annotation allows you to control auto-generation
    of JSON related methods in the corresponding *_Roo_Json.aj ITD file.


    # Getting ready


    Delete the contents of the ch04-recipe sub-directory inside the C:\roo-cookbook
    directory.


    Copy the ch04_web-app.roo script into the ch04-recipe directory.


    Execute the ch04_web-app.roo script that creates the flight-app Roo project, sets
    up Hibernate as the persistence provider, configures MySQL as the database for
    the application, creates the Flight and FlightDescription JPA entities, and defines
    a many-to-one relationship between the Flight and FlightDescription entities.
    If you are using a different database than MySQL or your connection settings are
    different than what is specified in the script, then modify the script accordingly.


    Start the Roo shell from the C:\roo-cookbook\ch04-recipe directory.


    Execute the controller all command to create controllers and JSPX views corresponding
    to JPA entities in the flight-app project, as shown here:


    ```

    .. roo> controller all --package ~.web

    ```


    Execute the perform eclipse command to update the project''s classpath settings,
    as shown here:


    ```

    .. roo> perform eclipse

    ```


    Now, import the flight-app project into your Eclipse IDE.'
  merge: -1
  img_proc: true
- pgno: 220
  md: "# How to do it...\n\nTo add the json support execute the json add command against\
    \ the Flight JPA entity:\n\n```\n~.domain.Flight roo> json add --class ~.domain.Flight\n\
    Updated SRC_MAIN_JAVA\\...\\domain\\Flight.java\nCreated SRC_MAIN_JAVA\\...\\\
    domain\\Flight_Roo_Json.aj\nCreated SRC_MAIN_JAVA\\...\\web\\FlightController_Roo_Controller_Json.aj\n\
    ```\n\nAlternatively, add the @RooJson annotation to the Flight.java class. Adding\
    \ the @RooJson annotation to the Flight entity has the same effect as executing\
    \ the json add command against the Flight entity. Adding the @RooJson annotation\
    \ will result in auto-generation of Flight_Roo_Json.aj and FlightController_Roo_Controller_Json.aj\
    \ AspectJ ITDs.\n\n# How it works...\n\nExecuting the json add command annotates\
    \ the class (specified via class argument) with the @RooJson annotation. If a\
    \ class is annotated with the @RooJson annotation, Roo creates a *_Roo_Json.aj\
    \ AspectJ ITD, which defines methods for converting objects of the class to JSON\
    \ documents and vice versa.\n\nWe saw that when the json addon command was executed\
    \ against the Flight entity, it also resulted in the creation of a FlightController_Roo_Controller_Json.aj\
    \ AspectJ ITD. This ITD is created if the value of the @RooWebScaffold's exposeJson\
    \ attribute in the FlightController.java class is true. If the @RooWebScaffold's\
    \ exposeJson attribute is not specified, the default value is true.\n\nIf the\
    \ value of the exposeJson attribute is true and the JPA entity used as the form-backing\
    \ object by the web controller is annotated with the @RooJson annotation, Roo\
    \ creates a *_Roo_Controller_Json.aj ITD corresponding to the web controller class.\
    \ This ITD defines JSON-based methods to perform CRUD operations and execute dynamic\
    \ finder methods of the JPA entity. For instance, the FlightController_Roo_Controller_Json.aj\
    \ ITD introduces JSON-related methods into the FlightController.java class for\
    \ performing CRUD operations on the Flight entity.\n\nThe following listing shows\
    \ the methods defined in the Flight_Roo_Json.aj ITD file that was created corresponding\
    \ to the @RooJson annotated Flight entity:\n\n```\nimport flexjson.JSONDeserializer;\n\
    import flexjson.JSONSerializer;\n\nprivileged aspect Flight_Roo_Json {\n    public\
    \ String Flight.toJson() {\n        return new JSONSerializer().exclude(\"*.class\"\
    ).\n```"
  merge: -1
  img_proc: true
- pgno: 221
