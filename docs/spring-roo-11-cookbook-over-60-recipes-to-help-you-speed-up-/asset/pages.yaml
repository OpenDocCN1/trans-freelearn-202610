- pgno: 169
  md: "```\n{\n    if (bindingResult.hasErrors())\n    {\n        ...\n        return\
    \ \"flights/create\";\n    }\n    ...\n    flight.persist();\n    return \"redirect:/flights/\"\
    \ + ...;\n}\n...\n```\n\nThe following are the important points to notice about\
    \ the given code:\n\n+   - The `method` attribute of the `@RequestMapping` method-level\
    \ annotation specifies that the `create` method of a `FrontController` is invoked\
    \ if an HTTP POST request is received by the controller. The `create` method represents\
    \ the controller method in which the `Flight` entity is persisted in the database.\n\
    +   - The return value from the `create` method is either a `flight/create` or\
    \ `redirect:/flights/... String` value. If the return value is `flight/create`,\
    \ then the `flight-app` application shows the web page, which maps to the `flight/create`\
    \ tiles definition name. If the return value is `redirect:/flights/`, then it\
    \ is interpreted as a redirect URL (as mentioned earlier), to which the `DispatcherServlet`\
    \ redirects the request.\n+   - You may notice that the `Flight` parameter of\
    \ the `create` method is annotated with a `@Valid JSR 303-bean validation annotation.\
    \ The use of the `@Valid` annotation results in invoking validation of the `Flight`\
    \ entity before it is persisted in the database.\n\nThe following `createForm`\
    \ method, defined in the `FlightController_Roo_Controller .aj ITD`, highlights\
    \ another way in which the `@RequestMapping` annotation is used:\n\n```\n@RequestMapping(params\
    \ = \"form\", method = RequestMethod.GET)\npublic String FlightController.createForm(Model\
    \ uiModel)\n{\n    ...\n    return \"flights/create\";\n}\n```\n\nThe `createForm`\
    \ method shows the HTML form in which the user enters details required for creating\
    \ the `Flight` entity in the database. The `createForm` method is invoked if the\
    \ request received by the `FlightController` handler contains a request parameter\
    \ named `form` (as specified by `params` attribute) and the request method used\
    \ for the request is HTTP GET (as specified by the `method` attribute)."
