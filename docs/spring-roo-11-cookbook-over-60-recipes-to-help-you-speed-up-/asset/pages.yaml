- pgno: 33
  md: "```\n<context:exclude-filter expression=\n    \"org.springframework.stereotype.Controller\"\
    \n    type=\"annotation\"/>\n</context:component-scan>\n</beans>\n```\n\nThe important\
    \ inferences that we can derive from the content of applicationContext.xml are:\n\
    \n+   The definition of the `<property-placeholder>` element of Spring's `context`\
    \ namespace indicates that you must put your properties files that contain configuration\
    \ information for Spring beans, in the META-INF/spring directory so that they\
    \ can be picked up by Spring's application context. In the next chapter, we will\
    \ see how this is used by Roo-generated applications to read database properties\
    \ from an external properties file.\n\n+   The `<spring-configured>` element of\
    \ Spring's `context` namespace specifies that objects that are annotated with\
    \ `@Configurable` annotation are configured using Spring, even if they are created\
    \ outside of the Spring container. The objects created outside the Spring container\
    \ include objects that are created programmatically using the `new` operator or\
    \ by reflection. We will see example usage of `@Configurable` annotation in Chapter\
    \ 2, Persisting Objects Using JPA.\n\n+   The `<component-scan>` element of Spring's\
    \ `context` namespace specifies that Spring components (that is, components annotated\
    \ with `@Service`, `@Repository` and `@Component` Spring annotations) found inside\
    \ the `sample.roo.flightapp` package or its sub-packages are automatically registered\
    \ with Spring's application context. Later in this chapter, we will use this feature\
    \ to create a service class in the flight-app project, which is auto-registered\
    \ with Spring's application context.\n\nThe other important artifact that was\
    \ generated during the project creation is the pom.xml file that is used by maven.\
    \ The following XML code shows how the argument values specified in the project\
    \ command are used in creating the pom.xml file of the flight-app project:\n\n\
    ```\n<project >\n......\n<groupId>sample.roo.flightapp</groupId>\n<artifactId>flight-app</artifactId>\n\
    <packaging>jar</packaging>\n<version>0.1.0.BUILD-SNAPSHOT</version>\n<name>flight-app</name>\n\
    </project>\n```\n\nYou may notice that the value of the `<packaging>` element\
    \ is `jar` and not `war`. The reason for this lies with the fact that we haven't\
    \ yet added a web layer to the flight-app application. We will see in Chapter\
    \ 4, Web Application Development with Spring Web MVC and Chapter 5, Web Application\
    \ Development with GWT, Flex, and Spring Web Flow how we go about creating a web\
    \ application using Spring Roo."
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The pom.xml additionally contains Maven plugins, which are available to Roo
    projects by default. The following table summarizes some of the important Maven
    plugins that are available to our newly created flight-app project:


    | Maven Plugin | Usage |

    |---|---|

    | IDEA plugin | You may use this plugin to convert the flight-app project into
    an IntelliJ IDEA project. |

    | Eclipse plugin | You may use this plugin to convert the flight-app project into
    an Eclipse project. |

    | AspectJ compiler plugin | This plugin weaves AspectJ aspects into your project
    classes. This plugin is used internally by Spring Roo. We will see the AspectJ
    compiler in action in Chapter 2. |

    | Tomcat and Jetty plugins | You can use these plugins during development to run
    Tomcat or Jetty in embedded mode to test your web application. |


    # There''s more...


    You won''t always be starting a project from scratch, and you may find Spring
    Roo compelling enough (which you will, as we go through its various features)
    to use in your existing Spring-based Java projects. In such scenarios, you need
    to do the following:


    +   1. Convert your existing Spring-based project into a standard Maven project
    as created by Spring Roo''s project command.

    +   2. Add the AspectJ compiler plugin to the pom.xml file of your project.

    +   3. Move bean definitions in your existing project to the applicationContext.xml
    file in META-INF/spring directory.

    +   4. Move the properties file used for configuring Spring beans to META-INF/spring/
    directory.


    There are other things you will need to do to convert your existing projects into
    a Roo project, which we will discuss in relevant recipes.


