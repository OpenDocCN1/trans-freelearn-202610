- pgno: 191
  md: 'When the origin and the destination field names are modified, then the following
    modifications are performed by Roo:


    +   In the `FlightDescription_Roo_JavaBean.aj` ITD, the getter and setter methods
    for the `origin` and the `destination` fields are replaced with the getter and
    setter methods for `originCity` and `destinationCity`, respectively.


    +   In the `FlightDescription_Roo_ToString.aj` ITD, the `toString` method is modified
    to include the value of the `destinationCity` and `originCity` fields, instead
    of the `origin` and the `destination` fields.


    +   In the Auto-generating Spring MVC controllers and JSPX views from JPA entities
    recipe we discussed how the Roo-generated `ApplicationConversionServiceFactoryBean`
    is configured by the `<mvc:annotation-driven>` element defined in the web application
    context XML. We saw earlier that the `*_Roo_ConversionService.aj` file of the
    flight-app project introduces static classes into the `ApplicationConversionServiceFactoryBean`
    class that represent converters for the `Flight` and the `FlightDescription` JPA
    entities.


    +   The following code shows the `FlightDescriptionConverter` static class defined
    in `ApplicationConversionServiceFactoryBean_Roo_ConversionService.aj`, which returns
    the converter for the `FlightDescription` entity:


    ```

    import org.springframework.core.convert.converter.Converter;

    privileged aspect ApplicationConversionServiceFactoryBean_Roo_ConversionService
    {

    ...

    static class ApplicationConversionServiceFactoryBean.FlightDescriptionConverter
    implements

    Converter<FlightDescription, java.lang.String> {

    public String convert(FlightDescription

    flightDescription){

    return new StringBuilder().

    append(flightDescription.getOrigin()).

    append("").

    append(flightDescription.getDestination()).

    append(" ").

    append(flightDescription.getPrice()).toString();

    }

    }

    ...

    }

    ```'
