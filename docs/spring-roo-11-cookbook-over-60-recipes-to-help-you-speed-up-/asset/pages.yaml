- pgno: 62
  md: '| Argument | Description |

    | :--- | :--- |

    | username | Identifies the username required for connecting to the data source.This
    argument is useful only if you''re not using a JNDI-bound data source in your
    enterprise application. |

    | password | Identifies the password required for connecting to the data source.This
    argument is useful only if you''re not using a JNDI-bound data source in your
    enterprise application. |

    | applicationId | Identifies the application identifier if you want to deploy
    the application on Google App Engine. We''ll discuss this argument in detail in
    the Deploying a GWT application on GAE recipe in Chapter 6. |

    | persistenceUnit | Specifies the name of the persistence unit to be used in the
    Roo-generated persistence.xml file. You must use this argument if your application
    interacts with multiple databases. |

    | transactionManager | **[Supported since Spring Roo 1.1.5]** Name of the transaction
    manager corresponding to the persistence unit. You must use this argument if your
    application interacts with multiple databases. |


    As the output from the `persistence setup` command suggests, the following files
    in our flight-app Roo project are created or modified:


    +   * `persistence.xml`: this is a newly created file which is used by a JPA provider
    to discover persistence provider information, which is Hibernate in the case of
    the flight-app project.

    +   * `database.properties`: this is a newly created file which contains data
    source information, such as username, password, data source URL, and driver class.

    +   * `applicationContext.xml`: this file was created when we created our Roo
    project. This file is now modified to include data source, transaction manager,
    and JPA EntityManagerFactory definitions. Later in this section, we''ll see these
    definitions in detail.

    +   * `pom.xml`: this file was created when we created our Roo project. It is
    now modified to include project dependencies on MySQL connector, Hibernate, Hibernate
    Validator, and so on. This shows that Roo adds dependencies to your project only
    when you add additional functionality to your enterprise application. For instance,
    if you are not using JPA, then JPA-related dependencies are not added to your
    project unless you execute the `persistence setup` command.'
