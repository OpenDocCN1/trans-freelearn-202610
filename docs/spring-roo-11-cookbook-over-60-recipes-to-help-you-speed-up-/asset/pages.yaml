- pgno: 40
  md: '# How to do it...


    To manage the properties defined in a properties file follow the given steps:


    +   1. The `properties set` command is used to modify properties shown as follows:

    +   roo> properties set --name log4j.properties --path SRC_MAIN_RESOURCES --key
    log4j.appender.R.File --value flightapp.log

    +   ......

    +   roo> properties set --name log4j.properties --path SRC_MAIN_RESOURCES --key
    log4j.rootLogger --value ERROR


    +   2. The `properties remove` command is used to remove properties, shown as
    follows:

    +   roo> properties remove --name log4j.properties --path SRC_MAIN_RESOURCES --key
    log4j.appender.stdout


    +   3. The `properties set` can also be used to add a new property, shown as follows:

    +   roo> properties set --name log4j.properties --path SRC_MAIN_RESOURCES --key
    log4j.logger.sample.roo.flightapp.service --value DEBUG


    # How it works...


    Like the `properties list` command, the `properties set` and `properties remove`
    commands are provided by **Properties file add-on**. The following table describes
    the arguments that both the `properties set` and `properties remove` commands
    accept:


    | Argument | Purpose |

    |---|---|

    | path | It is a mandatory argument that identifies a path to the properties file.
    Refer to the *Viewing properties defined in a properties file* and *Creating a
    Roo project recipes* for details on the values it can accept. |

    | name | It is a mandatory argument that specifies the name of the properties
    file whose property you want to remove |

    | key | It is a mandatory argument that specifies the key of the property that
    you want to remove from the properties file. |


    The `properties set` command accepts all the arguments that the `properties remove`
    command accepts. Additionally, it accepts a mandatory argument, `value`, which
    specifies a value of the property being set by the `properties set` command. If
    a matching property is found in the properties file, the existing property is
    updated with the new value. If no matching property is found, a new property is
    added to the properties file.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# There''s more...


    You can also change the properties file using your favorite IDE. If you are creating
    a new Roo project which acts as a template for creating other projects, using
    properties commands to add, modify, and remove properties from a properties file
    can be valuable.


    If you want to modify logging configuration, you should first consider using the
    `logging` setup command (explained earlier in the *Configuring logging* recipe).
    If you want to modify database properties, you should use database commands (explained
    in the *Managing database configuration properties* recipe in *Chapter 2, Persisting
    Objects Using JPA*).


    # See also


    +   - The Configuring logging recipe explains how to configure logging using Spring
    Roo commands

    +   - The Managing database configuration properties recipe explains how to configure
    database properties using Spring Roo commands


    # Creating a Java class


    You can create Java classes in your Roo project, either by using the IDE of your
    choice or by using the `class` command. If you create a class using Roo, boilerplate
    code (which includes `toString`, and get and setter methods for attributes) is
    generated automatically and managed by Spring Roo, and is kept in a separate AspectJ
    ITD file.


    # Getting ready


    Start the Roo shell from the `C:\roo-cookbook\ch01-recipe` directory, which contains
    the `flight-app` Roo project.


    # How to do it...


    You can create a Java class using the `class` command, as shown here:


    ```

    roo> class --class sample.roo.flightapp.service.FlightService

    --rooAnnotations


    Created SRC_MAIN_JAVA\sample\roo\flightapp\service

    Created SRC_MAIN_JAVA\sample\roo\flightapp\service\FlightService.java

    Created SRC_MAIN_JAVA\sample\roo\flightapp\service\FlightService_Roo_Serializable.aj


    ~.service.FlightService roo>

    ```'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'When the `class` command is executed, notice that the Roo prompt changes to
    refer to the newly created Java class. In the next recipe, titled Adding fields
    to a Java class, we will see how the changed Roo prompt simplifies performing
    commands on the referred class. Also, notice that the service directory is automatically
    created by Spring Roo, if it doesn''t exist.


    > Some command arguments, like `rooAnnotations`, act as a flag for the command
    processor, and you don''t need to specify their value.

    > Simply specifying them as part of the command means that the value of the argument
    is true or yes.


    # How it works...


    The `class` command accepts the arguments listed in the following table:


    | Argument | Purpose |

    | :--- | :--- |

    | class | It is a mandatory argument that identifies the fully-qualified name
    of

    the Java class that you want to create. You can either specify the fully-

    qualified class name using the tilde symbol '' ~ '' or you can use the

    `TAB` (or `CTRL` + `SPACE`) multiple times to let Spring Roo complete the

    package name for you.

    The '' ~ '' symbol refers to the top-level package of the Roo project.

    For instance, in `flight-app` project, it refers to `sample.roo.flightapp` package.

    You can use this symbol to specify the package

    (relative to top-level package) in which you want to create your Java class. |

    | rooAnnotations | It is an optional argument that specifies the common Roo

    annotations, such as @RooJavaBean, @RooToString,

    and @RooSerializable, which are added to the generated Java class.

    If unspecified, these annotations are not added to the generated Java

    class. |

    | path | It is an optional argument that specifies the path to the source directory

    in which the class is created. By default, the path is SRC_MAIN_JAVA. |

    | extends | It is an optional argument that specifies the fully-qualified name
    of

    the class, which the Java class extends. You can use this argument name to

    create a class which extends from a superclass. |

    | abstract | It is an optional argument that indicates whether the class is an

    abstract or concrete class. You can use this argument to create an

    abstract class. |

    | permitReserved

    Words | It is an optional argument that indicates whether Roo should allow

    creating a class whose name is a reserved word. By default, Roo

    doesn''t allow creating Java classes whose name uses reserved words.

    For instance, by default you cannot create a class named New. |'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'As evident from the list of arguments accepted by the `class` command, Spring
    Roo doesn''t provide any argument to let you specify the interface(s) that the
    generated Java class implements. If you want your Java class to implement one
    or more interfaces, you need to manually modify your class definition.


    As the output from `class` command suggests, apart from `FlightService.java`,
    Roo creates a `FlightService_Roo_Serializable.aj` file—an AspectJ ITD that makes
    the `FlightService` class implement `java.io.Serializable` interface.


    The AspectJ ITDs generated by Roo have the following naming convention:


    <java-class-name>_Roo_<add-on-name>.aj


    Where `<java-class-name>` is the name of the Java class to which the AspectJ ITD
    applies.


    <add-on-name> is the name of Spring Roo add-on responsible for managing the AspectJ
    ITD


    The `*_Roo_*.aj` files are managed by Roo and you should not directly modify or
    delete them.


    The following code shows how the `FlightService.java` file generates the `FlightService`
    class using the `class` command:


    ```

    package sample.roo.flightapp.service;


    import org.springframework.roo.addon.javabean.RooJavaBean;

    import org.springframework.roo.addon.tostring.RooToString;

    import org.springframework.roo.addon.serializable.RooSerializable;


    @RooJavaBean

    @RooToString

    @RooSerializable

    public class FlightService { }


    ```


    In the given code, Roo annotations were added to the generated `FlightService`
    class because we specified the `rooAnnotations` argument in the `class` command.


    To simplify debugging, developers commonly override the `toString` method of the
    `java.lang.Object` class to output a string containing the value of all the attributes
    of the class. With Spring Roo, you are relieved of this task because if your class
    is annotated with @RooToString annotation, Spring Roo takes care of creating and
    updating the `toString` method as you add, modify, or remove attributes from your
    Java class.


    When you add an attribute to your `FlightService` class, Roo creates a `FlightService_Roo_ToString.aj`—an
    AspectJ ITD that adds the `toString` method to the `FlightService` class, and
    a `FlightService_Roo_JavaBean.aj`—an AspectJ ITD that adds getters and setters
    methods for the attributes defined in the `FlightService` class. The creation
    of these aspects is triggered by the presence of @RooToString and @RooJavaBean
    annotations in the `FlightService` class.'
  merge: -1
  img_proc: true
- pgno: 44
  md: "To see these two ITD files, add the following attribute to FlightService class:\n\
    \n```\nprivate String origin;\n```\n\nIf your Roo shell is running, as soon as\
    \ you save the FlightService class, Roo will generate a FlightService_Roo_ToString.aj\
    \ file and a FlightService_Roo_JavaBean.aj file in the same package as the FlightService\
    \ class. If you observe the Roo shell, you will find that Roo reports that it\
    \ has created a FlightService_Roo_ToString.aj and FlightService_Roo_JavaBean.aj\
    \ files, as shown here:\n\n```\nCreated SRC_MAIN_JAVA\\\\sample\\\\roo\\\\flightapp\\\
    \\service\\\\\nFlightService_Roo_ToString.aj\n```\n\n```\nCreated SRC_MAIN_JAVA\\\
    \\sample\\\\roo\\\\flightapp\\\\service\\\\\nFlightService_Roo_JavaBean.aj\n```\n\
    \nThe following code shows how FlightService_Roo_ToString.aj AspectJ ITD adds\
    \ the toString method to the FlightService class:\n\n```\npackage sample.roo.flightapp.service;\n\
    \nprivileged aspect FlightService_Roo_ToString\n{\n    public String FlightService.toString()\n\
    \    {\n        StringBuilder sb = new StringBuilder();\n        sb.append(\"\
    Origin: \");\n        sb.append(getOrigin());\n        return sb.toString();\n\
    \    }\n}\n```\n\nThe given code shows that FlightService_Roo_ToString is a privileged\
    \ aspect, that is, it can access even **private** members of other aspects and\
    \ classes. The declaration, public String FlightService.toString(), adds a public\
    \ toString method to the FlightService class that accepts no arguments and returns\
    \ a String. Everything inside the curly-braces is the implementation of the toString\
    \ method. Each declaration in an AspectJ ITD file identifies the target of that\
    \ declaration. In the code, FlightService in the declaration means that the FlightService\
    \ class is the target; therefore, it will add the toString method to the FlightService\
    \ class. In the Adding fields to a Java class recipe, we will see how the toString\
    \ method is automatically updated by Spring Roo when you add more attributes to\
    \ the FlightService class."
  merge: -1
  img_proc: true
- pgno: 45
  md: "The following figure summarizes how the FlightService_Roo_ToString.aj file\
    \ in the previous listing declares adding the toString method to the Flight class:\n\
    \n![](img/b8c379a2ed921ead3aa2b01811dc29fa_45_0.png)\n\n> In Spring Roo, AspectJ\
    \ ITDs are responsible for adding fields, methods, and constructors to Java classes\
    \ and to make them implement interfaces or extend from a superclass. Spring Roo\
    \ is responsible for managing these ITDs and you should not directly modify or\
