- pgno: 379
  md: '# # Developing Add-ons and Removing Roo from Projects


    In this chapter, we will cover:


    +   - Setting up GnuPG for add-on development

    +   - Installing an installable add-on

    +   - Developing a simple add-on

    +   - Developing an advanced add-on

    +   - Converting non-OSGi JDBC drivers into OSGi-compliant bundles

    +   - Removing Roo with push-in refactoring

    +   - Adding Roo to a project using pull-out refactoring

    +   - Upgrading to the latest version of Roo


    # ## Introduction


    In previous chapters, we saw that executing a Roo command kicks-off code generation
    logic in Roo add-ons. You may want to create a custom add-on for functionality
    that is not yet supported by base or installable add-ons. For instance, currently
    there is no Roo add-on that provides support for creating Java portlets using
    the Spring Portlet MVC. So, we can develop a Roo add-on which is responsible for
    scaffolding Spring Portlet MVC controllers and JSPs from JPA entities.'
  merge: -1
