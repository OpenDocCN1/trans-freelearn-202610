- pgno: 287
  md: 'Start the Roo shell from the ch05-webflow directory and execute the ch05_webflow_app.roo
    script using the script command. Executing the ch05_webflow_app.roo script creates
    a flightapp-webflow Eclipse project, sets up Hibernate as persistence provider,
    configures MySQL as the database for the application, and creates Flight, FlightDescription,
    Customer, and Address JPA entities. The Customer entity has a one-to-one relationship
    with the Address entity and Flight has a many-to-one relationship with the FlightDescription
    entity. If you are using a different database than MySQL or your connection settings
    are different than what is specified in the script, then modify the script accordingly.


    # How to do it...


    To set up the Spring Web Flow framework, follow the steps given here:


    +   1. Execute the web flow Roo command to create a Customer flow, as shown here:

