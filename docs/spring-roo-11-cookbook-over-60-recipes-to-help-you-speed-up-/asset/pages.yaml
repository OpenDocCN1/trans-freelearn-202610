    JSR 303 (bean validation) defines a standard approach for annotations-based JavaBeans
    validation. In this recipe we''ll look at how Spring Roo''s field command can
    be used to add JSR 303 validation constraints to persistent fields of entities.


    The following table shows the validation constraints that apply to fields defined
    in the Flight entity and FlightKey class of our flight-app project:


    | Persistent field | Constraint | JSR 303 annotation |

