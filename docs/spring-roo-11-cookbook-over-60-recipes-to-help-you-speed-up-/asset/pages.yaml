- pgno: 339
  md: "# Configuring method-level security\n\nMethod-level security in the Flight\
    \ Booking application is enabled by the `<global-method-security>` element in\
    \ the applicationContext-security.xml file, as shown here:\n\n```\n<global-method-security\
    \ mode=\"aspectj\"\n secured-annotations=\"enabled\"/>\n```\n\nThe mode attribute\
    \ value specifies whether Spring AOP (which proxies the target object) or AspectJ\
    \ (in which Spring's AspectJ security aspect is woven into the class at load-time\
    \ or compile-time) is used for securing methods. As Booking JPA entity is created\
    \ outside the Spring container, to use Spring's @Secured annotation (discussed\
    \ in the next section) to secure methods defined by Booking JPA entity, you need\
    \ to use AspectJ. The value aspectj of the mode attribute instructs Spring to\
    \ weave AnnotationSecurityAspect (available in the Spring Security's spring-security-aspects\
    \ JAR file) into classes that make use of the @Secured annotation. The secured-annotations\
    \ attribute specifies if the use of the @Secured annotations is enabled or disabled\
    \ for the application context. The value enabled means that Spring Security will\
    \ secure all methods that make use @Secured method-level annotation. Spring also\
    \ supports using JSR-250 security annotations, security expressions (like hasRole,\
    \ hasPermission, and so on), and the <protect-pointcut> sub-element of the <global-method-security>\
    \ element to implement method-level security. You can use a combination of different\
    \ approaches to implement method-level security in your application.\n\nAs we\
    \ are using AspectJ mode for implementing method-level security in the Flight\
    \ Booking application, dependency on spring-security-aspects JAR has been added\
    \ to the pom.xml file, and the AspectJ compiler plugin configuration in the pom.xml\
    \ file has been updated to include spring-security-aspects, as shown here:\n\n\
    ```\n<plugin>\n <groupId>org.codehaus.mojo</groupId>\n <artifactId>aspectj-maven-plugin</artifactId>\n\
    \ ...\n <configuration>\n <outxml>true</outxml>\n <aspectLibraries>\n <aspectLibrary>\n\
    \ <groupId>org.springframework</groupId>\n <artifactId>spring-aspects</artifactId>\n\
    \ </aspectLibrary>\n <aspectLibrary>\n <groupId>org.springframework.security</groupId>\n\
    \ <artifactId>spring-security-aspects</artifactId>\n </aspectLibrary>\n </aspectLibraries>\n\
    \ ...\n </configuration>\n </plugin>\n```"
  merge: -1
  img_proc: true
- pgno: 340
  md: "The <aspectLibrary> element specifies the JAR files that contain aspects. The\
    \ spring-aspects JAR contains aspect for weaving @Transactional support and spring-security-aspects\
    \ JAR contains aspect for weaving @Secured support in classes.\n\n> You may also\
    \ notice that Spring Security version 3.1.0 RC1 has been used in the Flight Booking\
    \ application because spring-security schema prior to version 3.1 didn't support\
    \ mode attribute for <global-method-security> element.\n\nNow that we have seen\
    \ how method-level security is configured for the Flight Booking application,\
    \ we are ready to annotate Booking JPA entity methods with the @Secured annotation.\n\
    \n# Adding @Secured annotation to JPA entity methods\n\nSpring Security's @Secured\
    \ annotation can be used at method-level to secure methods from unauthorized access.\
    \ @Secured annotation specifies the user roles that are authorized to invoke the\
    \ method.\n\nAdding Spring Security's @Secured annotation to JPA entity methods\
    \ in Roo-generated applications is a bit of an involved process. Roo defines JPA\
    \ entity methods in the *_Roo_Entity.aj AspectJ ITD file, which is not recommended\
    \ to be modified by application developers. To add the @Secured annotation to\
    \ a JPA entity method, perform push-in refactoring (refer to Chapter 7) to move\
    \ the method to the entity's Java class or simply copy the methods from the AspectJ\
    \ file to entity's Java class. For instance, in the case of the Booking JPA entity,\
    \ the persist method is copied from the Booking_Roo_Entity.aj file to the Booking.java\
    \ file, as shown here:\n\n```\n@RooEntity(identifierColumn = \"BOOKING_ID\")\n\
    public class Booking {\n    @PersistenceContext\n    transient EntityManager entityManager;\n\
    \    ...\n    @Transactional\n    @Secured(\"ROLE_APP_USER\")\n    public void\
    \ persist() {\n        if (this.entityManager == null)\n            this.entityManager\
    \ = entityManager();\n        this.entityManager.persist(this);\n    }\n\n   \
    \ public static final EntityManager entityManager() {\n        EntityManager em\
    \ = new Booking().entityManager;\n        ...\n        return em;\n    }\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 341
  md: 'The given code shows that the `persist` method is copied from `Booking_Roo_Entity.aj`
    to the `Booking.java` file. The `@Secured` annotation is added to the `persist`
    method to make it secure.


    It is important to note that copying a method from AspectJ ITD to a Java file
    *doesn''t* require moving dependent methods and attributes also. For instance,
    moving `persist` method from `Booking_Roo_Entity.aj` to `Booking.java` *doesn''t*
    require moving `entityManager` attribute and `entityManager()` method, as shown
    in the code. It has been done to simplify understanding the code.


    # Deploying a GWT application on GAE


    GAE (Google App Engine) is the cloud computing platform from Google that provides
    the infrastructure for deploying your web applications. In this recipe, we''ll
    look at how Roo simplifies developing an application for GAE. We''ll also see
    how a Roo-scaffolded GWT application is created and deployed on GAE. In the *Deploying
    Spring Web MVC applications on GAE* recipe, we''ll see a Spring Web MVC application
    that can be deployed on GAE.


    # Getting ready


    If you only want to run the GWT application locally using App Engine SDK for Java,
    then you don''t need to sign up with Google App Engine and create an *application
    identifier*. If you want to deploy the application on GAE, follow the steps mentioned
    here to create an application identifier for your application.


    +   1. Sign-up for a free Google App Engine account by going to the following
    URL: `http://appengine.google.com`. Once you are signed in, you''ll see the following
    welcome page:


