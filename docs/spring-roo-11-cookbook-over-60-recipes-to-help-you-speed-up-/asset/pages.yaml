- pgno: 57
  md: '> > Roo script is nothing but a text file containing Roo commands. The commands
    are executed in the order they appear in the text file.


    In this recipe, we look at how we can execute the commands contained in a `ch01.roo`
    text file that accompanies this book. The `ch01.roo` file contains commands, which
    let''s you create a fresh `flight-app` project.


    # ## Getting ready


    If your Roo shell is still open, then exit it and remove all the files from the
    `C:\roo-cookbook\ch01-recipe` directory. Download the `ch01.roo` file from the
    book''s website and copy it to `C:\roo-cookbook\ch01-recipe`. Start the Roo shell
    from the `C:\roo-cookbook\ch01-recipe` directory.


    # ## How to do it...


    To create the application skeleton execute the `script` command, by specifying
    the file containing Roo commands, as shown here:


    ```

    roo>script --file ch01.roo --lineNumbers

    ```


    # ## How it works...


    The `script` command accepts the following arguments:


    | Argument | Purpose |

    |---|---|

    | `file` | It is a mandatory argument, which specifies the name of the file that
    contains Roo commands |

    | `lineNumbers` | It is an optional argument that instructs the Roo shell to print
    the line numbers of the command being executed from the file |'
