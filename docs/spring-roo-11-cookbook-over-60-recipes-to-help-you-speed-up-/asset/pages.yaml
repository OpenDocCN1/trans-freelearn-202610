- pgno: 141
  md: 'The following table describes the significance of the elements in the given
    XML:


    | XML element | Description |

    | :--- | :--- |

    | `<table>` | Describes a database table or a database view. The `name` attribute
    specifies the name of the table or view which the `<table>` element describes.
    |

    | `<column>` | The `<column>`, sub-element of the `<table>` describes the details
    of a column in the database table or view. The `name` attribute identifies the
    column name. The `primaryKey` attribute indicates if the column is one of the
    primary keys of the table or view. |

    | `<foreignKey>` | Specifies the details of an imported or exported foreign key
    of a table. The `foreignTable` attribute specifies the name of the table containing
    the imported or exported foreign key. The `<option>` sub-element specifies whether
    the foreign key is imported or exported by the table. The `<reference>` sub-element
    specifies the foreign key column and the local column to which the imported or
    exported foreign key maps. |

    | `<unique>` | Describes the unique constraint that applies to the table or view.
    If the `name` attribute value is `PRIMARY`, then it means that the unique constraint
    describes the primary key of the table. |


    # There''s more...


    The metadata generated by Roo is used as input for generating JPA entities, as
    we’ll see in the *Creating entities from database* recipe. Errors may be reported
    when you use the `database introspect` command if the `META-INF/spring/database.properties`
    file is not found or the connection properties defined in the `database.properties`
    are incorrect. The following table shows error messages that might be reported
    by the `database introspect` and the corresponding resolution:


    | Error message | Resolution |

    | :--- | :--- |

    | Connection properties must not be null or empty | Indicates that the `database.properties`
    file was not found in the `META-INF/spring` folder |

    | Unable to get connection from driver | Indicates that the `database.properties`
    file was found but it doesn''t correctly define the connection properties. Check
    if the username, password, and other connection properties are correctly specified.
    |'
  merge: -1
  img_proc: true
- pgno: 142
  md: "> **Testing database connection**\n> \n> As the `database introspect` command\
    \ connects to the database to generate metadata, you can also use this command\
    \ to validate the database connection after you've executed the `persistenceXsetup`\
    \ command.\n\n+   **See also**\n+   * Refer to the Creating entities from a database\
    \ recipe to see how the database metadata is used for auto-generating JPA entities\n\
    \n# Creating entities from a database\n\nIn many application development scenarios,\
    \ an application needs to be designed for an existing database or the application\
    \ development starts after the database has been created. To support such scenarios,\
    \ Roo provides the `database reverse engineer` command to auto-generate JPA entities\
    \ from database metadata. As we'll see later in this recipe, Roo provides `incremental`\
    \ database reverse engineering, that is, you can execute the `database reverse\
    \ engineer` command each time the database changes occur and leave it up to Roo\
    \ to update JPA entity definitions based on the changes in the database.\n\nThe\
    \ following figure shows tables of the database that we will reverse engineer\
    \ using the `database reverse engineer` command:\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_142_0.png)\n\
    \n# Getting ready\n\nRefer to the Generating database metadata recipe to create\
    \ the Roo project, to create the myflightappdb database, tables, and views in\
    \ MySQL, and install the JDBC driver for MySQL."
  merge: -1
  img_proc: true
- pgno: 143
  md: '# How to do it...


    To create entities from a database, execute the `database reverse engineer` command
    as shown here:


    ```

    .. roo> database reverse engineer --package ~.domain.entity.autogen

    --schema no-schema-required --enableViews --testAutomatically


    Created SRC_MAIN_RESOURCES\dbre.xml

    Updated SRC_MAIN_RESOURCES\META-INF\persistence.xml


    Created ..\domain\entity\autogen\FlightDescTbl.java

    ...

    Created ..\domain\entity\autogen\CustomerTbl.java

    Created ..\domain\entity\autogen\CustomerTblPK_Roo_Identifier.aj

    Created ..\domain\entity\autogen\CustomerTblPK.java

    ...

    Created ..\domain\entity\autogen\FlightTbl.java

    Created ..\domain\entity\autogen\FlightTbl_Roo_Entity.aj

    Created ..\domain\entity\autogen\FlightTbl_Roo_DbManaged.aj

    Created ..\domain\entity\autogen\FlightTbl_Roo_Configurable.aj

    Created ..\domain\entity\autogen\FlightTbl_Roo_ToString.aj

    ...

    Created ..\domain\entity\autogen\FlightsView.java

    Created ..\domain\entity\autogen\FlightsViewPK.java

    Created ..\domain\entity\autogen\FlightsViewPK_Roo_Identifier.aj

    ...

    ```


    As evident from the output, the JPA entities are auto-generated by Spring Roo.


    # How it works...


    The `database reverse engineer` command accepts the following arguments:


    +   - package: It is an _optional_ argument that specifies the package in which
    JPA entities are created by Roo. If this attribute is not specified, JPA entities
    are created in the top-level package of the Roo project.


    +   - schema: It is a _mandatory_ argument for specifying the database schema
    name. As some of the databases such as MySQL and Firebird don''t support the concept
    of schemas, pressing `TAB` after entering `--schema` on the command line will
    result in substituting `no-schema-required` as the value of the `schema` argument.'
  merge: -1
  img_proc: true
- pgno: 144
  md: "+   testAutomatically: It is an optional argument, which instructs Roo to create\
    \ integration tests for the JPA entities created via the database reverse engineer\
    \ command.\n\n+   enableViews: It is an optional argument, which instructs Roo\
    \ to reverse the engineer database views along with database tables. If specified,\
    \ Roo creates a JPA entity corresponding to each database view.\n\n+   includeTables:\
    \ It is an optional argument, which specifies the tables for which JPA entities\
    \ are created by Roo. By default the JPA entities corresponding to all the tables\
    \ in the database are created by Roo. The value of the includeTables argument\
    \ specifies a space-separated list of tables enclosed within double quotes, as\
    \ shown here:\n+   \n+   .. roo> database reverse engineer --schema no-schema-required\n\
    +   --includeTables \"FLIGHT_TBL FLIGHT_DESC_TBL\"\n\n+   excludeTables: It is\
    \ an optional argument, which specifies the tables for which the JPA entities\
    \ must not be created by Roo. The value of the excludeTables argument specifies\
    \ a space-separated list of tables enclosed within double quotes, as shown here:\n\
    +   \n+   .. roo> database reverse engineer --schema no-schema-required\n+   --excludeTables\
    \ \"FLIGHT_TBL FLIGHT_DESC_TBL\"\n\nLet's now look at some of the interesting\
    \ things that happened when we executed the database reverse engineer command:\n\
    \n+   A dbre.xml file is generated in the SRC_MAIN_RESOURCES directory of the\
    \ Roo project. This file contains database metadata in XML format, as described\
    \ in the Generating database metadata recipe.\n\n+   A Java class is generated\
    \ corresponding to each of the tables and views in the database. The name of the\
    \ Java source file is <table-name>.java, where the table-name is the name of the\
    \ database table in the camel-case with underscores in the table name removed.\
    \ Each Java class represents a JPA entity corresponding to a database table or\
    \ view.\n\n+   The META-INF/persistence.xml file is updated. Roo modifies (in\
    \ case you are using Hibernate as the JPA provider) the value of the property\
    \ hibernate.hbm2ddl.auto from create to validate, so that the database is not\
    \ modified when Hibernate SessionFactory is created. This makes sense because\
    \ JPA entities in the application have been created from the database and not\
    \ otherwise.\n\n+   A * .Roo_Db_Managed.aj ITD file is created corresponding to\
    \ each JPA entity created by Roo. It defines fields and relationships derived\
    \ for the JPA entity from the database metadata. As this ITD file contains fields\
    \ and relationship information, if you reverse engineer the database multiple\
    \ times, the changes corresponding to the database are restricted to this ITD\
    \ file, making incremental database reverse engineering possible in Roo applications."
  merge: -1
  img_proc: true
- pgno: 145
  md: "+   - If the primary key of a database table consists of multiple columns,\
    \ Roo creates a composite primary key class and a * _Roo_Identifier.aj AspectJ\
    \ ITD. For instance, in the case of CUSTOMER_TBL, Roo generates a CustomerTblPK.java\
    \ and CustomerTblPK_Roo_Identifier.aj AspectJ ITD file.\n\n+   - If a database\
    \ table or view doesn't define a primary key, Roo creates a composite primary\
    \ key class consisting of all the fields in the database table or view. For instance,\
    \ the FLIGHTS_VIEW doesn't define a primary key; therefore, Roo creates the FlightsViewPK.java\
