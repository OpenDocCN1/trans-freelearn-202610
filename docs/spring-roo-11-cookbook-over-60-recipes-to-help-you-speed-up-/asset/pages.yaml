    ...

    }

    ```


    The given code shows the showJson method that the ITD adds to the FlightController.java
    class. The showJson method represents one of many JSON related methods defined
    in the ITD. The showJson method returns a Flight object as a JSON document. The
    showJson method returns the JSON representation of the flight entity whose identifier
    is specified via request URI. If the request URL is /flights/10, then the showJson
    method returns the JSON representation of the Flight entity instance whose identifier
    value is 10. the @ResponseBody annotation instructs the Spring Web MVC framework
    to write the response to the HTTP response body. The headers attribute of the
    @RequestMapping annotation specifies the request headers that must be present
    in the web request.


