    sample.roo.flightapp.client.scaffold.Scaffold\"/>\n```\n\nThe above code suggests\
    \ that Scaffold class represents the entry point for the applicationScaffold module.\
    \ Scaffold class implements com.google.gwt.core.client.EntryPoint interface of\
    \ GWT—a mandatory requirement for entry point classes.\n\n# The GWT module's entry\
    \ point\n\nAs mentioned earlier, the Scaffold class of the flightapp-gwt application\
    \ represents an entry point into the applicationScaffold module. The Scaffold\
    \ class implements GWT's EntryPoint interface and implements its onModuleLoad\
    \ method to bootstrap the flightapp-gwt application, as shown here:\n\n```\nScaffold.java\n\
    package sample.roo.flightapp.client.scaffold;\n\nimport com.google.gwt.core.client.EntryPoint;\n\
    import com.google.gwt.core.client.GWT;\n\npublic class Scaffold implements EntryPoint\
    \ {\n    final private InjectorWrapper injectorWrapper =\n    GWT.create(DesktopInjectorWrapper.class);\n\
    \n    public void onModuleLoad() {\n    injectorWrapper.getInjector().getScaffoldApp().run();\n\
    \    }\n}\n```\n\nThe first thing to notice in this code is the use of the create\
    \ method of the com.google.gwt.core.client.GWT class to create the DesktopInjectorWrapper\
    \ instance. As the DesktopInjectorWrapper implementation needs to be replaced\
    \ by MobileInjectorWrapper for the mobile Safari browser, DesktopInjectorWrapper\
    \ is created using the create method of the GWT class."
