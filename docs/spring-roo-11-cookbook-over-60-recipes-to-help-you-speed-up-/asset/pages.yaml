- pgno: 240
  md: "To use the deferred binding feature, the <define-property> element of module\
    \ descriptor is used to define a new property named mobile.user.agent, as shown\
    \ here:\n\n```\n<define-property name=\"mobile.user.agent\"\n        values=\"\
    mobilesafari, none\"/>\n```\n\nThe values attribute specifies a comma-separated\
    \ list of values that the mobile.user.agent property can accept.\n\nTo set the\
    \ mobile.user.agent property value, the module descriptor makes use of the <property-provider>\
    \ element, as shown here:\n\n```\n<property-provider name=\"mobile.user.agent\"\
    >\n    <![CDATA[\n        var ua = navigator.userAgent.toLowerCase ();\n     \
    \   ...\n    ]>\n```\n\nThe CDATA section contains the JavaScript that is used\
    \ to obtain the value of the mobile.user.agent from the user-agent information\
    \ sent by the web browser to the server hosting the GWT application.\n\nNow, the\
    \ most important part: the deferred binding rule is defined using a replacement\
    \ technique in the applicationScaffold module descriptor file, as shown here:\n\
    \n```\n<replace-with\n        class=\"...client.scaffold.ioc.MobileInjectorWrapper\"\
    >\n    <when-type-is\n        class=\"...client.scaffold.ioc.DesktopInjectorWrapper\"\
    />\n    <all>\n        <when-property-is name=\"mobile.user.agent\"\n        \
    \    value=\"mobilesafari\"/>\n    </all>\n</replace-with>\n```\n\nThis configuration\
    \ instructs the GWT compiler to replace the code of DesktopInjectorrpper with\
    \ MobileInjectorWrapper (while generating JavaScript for the applicationScaffold\
    \ module) if the value of mobile.user.agent property is mobilesafari. This is\
    \ possible because both DesktopInjectorWrapper and MobileInjectorWrapper implement\
    \ the same interface, InjectorWrapper. When the GWT compiler executes, it uses\
    \ deferred binding rules (defined in the module descriptor file) to generate separate\
    \ flightapp-gwt application's JavaScript code for mobile Safari and desktop browsers.\
    \ This ensures that the desktop and mobile browsers download JavaScript code meant\
    \ specifically for that browser type. For instance, the mobile Safari browser\
    \ will not download JavaScript code that is specific to the desktop web browser\
    \ and vice versa. The classes that need to create an instance of DesktopInjectorWrapper\
    \ or MobileInjectorWrapper make use of the create static method of the com.google.gwt.core.client.GWT\
    \ class to instruct the GWT compiler to instantiate the DesktopInjectorWrapper\
    \ or MobileInjectorWrapper instance using deferred binding."
  merge: -1
  img_proc: true
- pgno: 241
  md: "> The code generated for mobile Safari browser follows a similar design approach\
    \ as the code for the desktop browser; therefore, in this book we'll limit the\
