    ApplicationEntityTypesProcessor<T> class represents a generic class. The handleFlight
    and handleFlightDescription methods are defined as abstract methods; therefore,
    subclasses need to provide implementation of these methods.


    > You''ll find an abstract handleXXX method defined for each entity proxy in the
    ApplicationEntityTypesProcessor<T> class.


    The result attribute identifies the result to return when the public process method
    of the ApplicationEntityTypesProcessor<T> class is invoked. Note that the return
    type of the result attribute is a generic type—determined by the generic type
    associated with the argument. The public process method accepts the class or object
    of the entity proxy as the argument and internally invokes the private process
    method, which in turn calls the handleFlight or handleFlightDescription method,
    depending upon the entity proxy object or class.


    So, what is the handleXXX method expected to do in the implementation class? It
    simply sets a return value, which is returned when the public process method is
    called. Let''s see this in the context of an example.'
