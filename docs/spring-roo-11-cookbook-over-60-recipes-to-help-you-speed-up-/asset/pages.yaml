- pgno: 163
  md: "By default, the `<annotation-driven>` element also configures JSR 303 – Bean\
    \ Validation if a JSR 303 provider is found in an application's classpath. As\
    \ we will see later in this recipe, JSR 303 validation is used for validating\
    \ model objects (also referred to as command objects) of Spring MVC controllers.\n\
    \nIn the Roo-generated flight-app application, you'll find dependency of the application\
    \ on the Hibernate Validator library in the pom.xml file; therefore, you can be\
    \ sure that JSR 303 support is installed for your application.\n\nIf instead of\
    \ using JSR 303 validation you want to use a custom validator based on Spring's\
    \ Validation API for validating model objects, then configure it using the validator\
    \ property of the `<annotation-driven>` element.\n\n# ResourceHttpRequestHandler\n\
    \nAs web applications need to serve static resources such as images, CSS, and\
    \ JS files, Roo configures Spring's ResourceHttpRequestHandler via the `<resources>`\
    \ element of the mvc schema, as shown here:\n\n```\n<mvc:resources location=\"\
    /\",\n        classpath:\"/META-INF/web-resources/\"\n        mapping=\"/resources/**\"\
    \ />\n```\n\nThe location attribute specifies the locations from which to serve\
    \ resources. It accepts comma-separated values for resource locations. The / value\
    \ refers to the web application root and the classpath:/META-INF/web-resources\
    \ value indicates that static resources can also be served from the META-INF/web-resources\
    \ directory of any JAR file in the classpath. It is important to note that a resource\
    \ is searched in the order of locations specified in the location attribute.\n\
    \nThe mapping attribute specifies the URL mapping pattern of the incoming resource\
    \ request to which the ResourceHttpRequestHandler applies.\n\n# DefaultServletHttpRequestHandler\n\
    \nRoo maps the DispatcherServlet to / (refer to the web.xml file of the flight-app\
    \ application), to which the default servlet of the servlet container is also\
    \ mapped. As the default servlet of a servlet container is responsible for serving\
    \ static resources, mapping DispatcherServlet to / overrides the default resource\
    \ serving behavior. To address the static resource serving issue arising from\
    \ mapping DispatcherServlet to /, Roo makes use of the `<default-servlet-handler>`\
    \ element of the mvc schema to configure Spring's DefaultServletHttpRequestHandler,\
    \ which delegates a resource serving to the servlet container's default servlet,\
    \ as shown here:\n\n```\n<mvc:default-servlet-handler />\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: "# Theme and locale change interceptors\n\nAs most web applications are expected\
    \ to support multiple *locales* and *themes*, Roo configures Spring's `LocaleChangeInterceptor`\
    \ and `ThemeChangeInterceptor` beans in the web application context XML to simplify\
    \ changing locale and the theme of the web application, as shown here:\n\n```\n\
    <mvc:interceptors>\n    <bean class=\"org.springframework.web.servlet.theme.ThemeChangeInterceptor\"\
    />\n    <bean class=\"org.springframework.web.servlet.i18n.LocaleChangeInterceptor\"\
    \n        p:paramName=\"lang\" />\n</mvc:interceptors>\n```\n\nIn the given code,\
    \ the `<interceptors>` element of Spring's mvc schema is used to configure interceptors\
    \ for pre/post-processing requests before/after the request is handled by controllers.\
    \ By default, `ThemeChangeInterceptor` inspects the request parameter named `theme`\
    \ to determine the theme to be applied and `LocaleChangeInterceptor` inspects\
    \ the request parameter named `locale` to determine the current locale associated\
    \ with the incoming request.\n\n# ParameterizableViewController\n\nIn a Spring\
    \ MVC application, controllers are responsible for processing the incoming request\
    \ and returning a *logical* view name and view data. The `DispatcherServlet` hands\
    \ over the logical view name to Spring's `ViewResolver` (configured in the web\
    \ application context), which resolves the actual view corresponding to the logical\
    \ view name. The `DispatcherServlet` then renders the actual view. So, does it\
    \ mean that even if a web application needs to show a static web page, we will\
    \ need to create a Spring MVC controller for it? Well, this is where the `ParameterizableViewController`\
    \ built-in controller of Spring MVC comes into picture. The `ParameterizableViewController`\
    \ simply returns a *pre-configured* view name, which is resolved by the `ViewResolver`\
    \ and rendered by the `DispatcherServlet`. This saves the effort of creating a\
    \ custom controller, which does nothing but return the name of view to be rendered.\
    \ You can either directly configure a `ParameterizableViewController` in your\
    \ web application context or use Spring's mvc schema's `<view-controller>` element\
    \ to do it for you.\n\nIn case of our `flight-app` application, Roo makes use\
    \ of the `<view-controller>` element for static views, such as the home page of\
    \ the `flight-app` application and the various exception pages, as shown here:\n\
    \n```\n<mvc:view-controller path=\"/\" view-name=\"index\" />\n<mvc:view-controller\
    \ path=\"/uncaughtException\" />\n```\n\nIn the `<view-controller>` element the\
    \ `view-name` attribute identifies the name of the view mapped to the URL path\
    \ identified by the `path` attribute. So, if the URL used to access the `flight-app`\
    \ application is `http://localhost:8080/flight-app/`, the view name corresponding\
    \ to this URL is `index`."
  merge: -1
  img_proc: true
- pgno: 165
  md: 'If the view-name attribute is not specified for the view-controller element
    (as in the given code for an uncaught exception related <view-controller> element),
    then the RequestToViewNameTranslator, configured for the DispatcherServlet, is
    used to resolve the name of the view. The RequestToViewNameTranslator is configured
    in the web application context and is used by the DispatcherServlet to determine
    the view name if no view name is returned by the controller handling the request.
    As no RequestToViewNameTranslator is configured in the web application context
    by Roo, the default implementation: the DefaultRequestToViewNameTranslator, is
    used for determining the view name. The DefaultRequestToViewNameTranslator simply
    removes the leading and trailing slashes and any file extension associated with
    the URI, and the resulting value is used as the view name. So, if we attempt to
    invoke the ParameterizableViewController corresponding to the uncaught exception
    view-controller element using the following URL: http://localhost:8080/flight-app/uncaughtException,
    then the DefaultRequestToViewNameTranslator will simply return a uncaughtException
    as the name of the view that should be rendered by the DispatcherServlet.


    # View resolution


    Spring Web MVC applications require a ViewResolver to resolve actual view from
    the logical view name returned by controllers. When creating Spring Web MVC applications,
    Roo configures Spring''s UrlBasedViewResolver (an implementation of the ViewResolver
    interface) in the web application context, which returns the actual view. As every
    view in Spring Web MVC is represented by a class that implements a View interface,
    the UrlBasedViewResolver must be informed about the actual View class that it
    must generate corresponding to the logical view name. The following fragment shows
    the Roo-generated UrlBasedViewResolver configuration for the flight-app application:


    ```

    ```xml

    <bean class="org.springframework.web.servlet.view.

    UrlBasedViewResolver" id="tilesViewResolver">

    <property name="viewClass"

    value="org.springframework.web.servlet.view.tiles2.

    TilesView" />

    </bean>

    ```

    ```


    The UrlBasedViewResolver resolves a view name to a URL, without requiring you
    to explicitly map each view name to a URL. For instance, if the view name is mypage,
    then the UrlBasedViewResolver can be used to attach a prefix (using the prefix
    property) /WEB-INF/jsp and a suffix (using the suffix property) .jsp to the view
    name to create a URL pointing to the mypage.jsp page in the /WEB-INF/jsp folder
    of your web application. Here, view name is mypage and the URL to which it is
    mapped by the UrlBasedViewResolver is /WEB-INF/jsp/mypage.jsp. As the Roo configured
    UrlBasedViewResolver doesn''t make use of the suffix and the prefix properties,
    the URL for the actual view is the same as the name of the logical view returned
    by the controller.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'If you want to redirect or forward a request to another URL in a Spring MVC
    controller implementation, then instead of returning a view name you can return
    a String value with a prefix as `redirect:` or `forward:`. If a controller returns
    a redirect or forward URL, then the `UrlBasedViewResolver` doesn’t perform view
    resolution. Instead, it redirects or forwards requests to the URL returned by
    the controller.


    As Roo uses a Apache Tiles 2 framework to simplify JSP development, the `viewClass`
    property of the `UrlBasedViewResolver` is set to `TilesView`. Tiles support is
    configured in the web application context using Spring’s `TilesConfigurer`, as
    we will see shortly. The name of the tile definition to which TilesView corresponds
    to is the *actual-view URL* resolved by the `UrlBasedViewResolver`. In case of
    the *flight-app*, we discussed that the *actual-view* URL generated by the `UrlBasedViewResolver`
    is the same as the logical name of the view; therefore, the name of the tile definition
    is also the *same* as the logical name of the view returned by the controller.


    To get a complete picture of how views are resolved in Roo-generated web applications,
    consider the controller configured by the following `<view-controller>` element:


    ```

    <mvc:view-controller path="/" view-name="index" />

    ```


    We discussed earlier that the `ParameterizableViewController` configured by the
    given `view-controller` element will return the view name as `index`. As no `suffix`
    or `prefix` properties of the `UrlBasedViewResolver` are configured, the actual
    view URL is also an `index`. Now, TilesView refers to the tile definition, which
    has the same name as the *actual-view* URL value generated by the `UrlBasedViewResolver`;
    therefore, the name of the tile definition is also `index`. To summarize, the
    `ParameterizableViewController` configured we saw earlier will result in showing
    the view whose tile definition name is `index` (you will find this tile definition
    name in the `WEB-INF/views/views.xml` file).


    # Tiles definitions


    Tiles definitions are defined in XML files and configured in the web application
    context using `TilesConfigurer`, as shown here:


    ```

    <bean class="org.springframework.web.servlet.view.tiles2.TilesConfigurer" id="tilesConfigurer">

    <property name="definitions">

    <list>

    <value>/WEB-INF/layouts/layouts.xml</value>

    <value>/WEB-INF/views/**/views.xml</value>

    </list>

    </property>

    </bean>

    ```


    The `definitions` property of the `TilesConfigurer` specifies the tiles definitions
    XML files. The path to these files can also use wildcard characters. For instance,
    the `/WEB-INF/views/**/views.xml` path loads tiles definitions from all `views.xml`
    files, which are inside the `/WEB-INF/views/` directory.'
  merge: -1
  img_proc: true
- pgno: 167
  md: "# # Exception handling\n\nIn a typical web application, it is required to gracefully\
    \ handle exceptions thrown by controllers. When an exception is thrown by a controller,\
    \ the DispatcherServlet makes use of Spring's HandlerExceptionResolver for resolving\
    \ exceptions. Roo configures the SimpleMappingExceptionResolver (an implementation\
    \ of the HandlerExceptionResolver) as the exception resolver for the flight-app\
    \ application, as shown here:\n\n```\n<bean\n    class=\"org.springframework.web.servlet.handler.\n\
    \    SimpleMappingExceptionResolver\"\n    p:defaultErrorView=\"uncaughtException\"\
    >\n    <property name=\"exceptionMappings\">\n        <props>\n            <prop\
    \ key=\".DataAccessException\">dataAccessFailure</prop>\n            ...\n   \
    \     </props>\n    </property>\n</bean>\n```\n\nThe SimpleMappingExceptionResolver\
    \ maps exception class names to error view names. In the given code, this mapping\
    \ is set via the exceptionMappings property. You can either specify the fully-qualified\
    \ class name of the exception or you can use a substring to match multiple exception\
    \ class names to an error view. For instance, the .DataAccessException will map\
    \ to the my.custom.DataAccessException as well as the org.springframework.dao.EmptyResultDataAccessException,\
    \ and in both cases the DispatcherServlet will attempt to render the dataAccessFailure\
    \ view. The defaultError view attribute of the SimpleMappingExceptionResolver\
    \ identifies the view to which an exception is resolved if no exception mapping\
    \ is found.\n\n# ## Miscellaneous configuration\n\nSpring Roo also configures\
    \ the following classes in webmvc-config.xml:\n\n+   * ReloadableResourceBundleMessageSource:\
    \ Spring is a built-in MessageSource implementation, which loads resource bundles\
    \ from WEB-INF/i18n folder.\n+   * ResourceBundleThemeSource: Spring is a built-in\
    \ ThemeSource implementation for loading the ResourceBundle for each theme supported\
    \ by the web application. In the context of the flight-app application, this configuration\
    \ loads the alt.properties and standard.properties files.\n+   * CookieThemeResolver:\
    \ Spring is a built-in ThemeResolver implementation, which stores a cookie in\
    \ the browser for identifying the theme chosen by the user.\n+   * CookieLocaleResolver:\
    \ Spring is a built in LocaleResolver implementation, which stores a cookie in\
    \ the browser for identifying the locale chosen by the user."
  merge: -1
  img_proc: true
- pgno: 168
  md: '+   ▶ CommonsMultipartResolver: Spring is a built-in MultipartResolver implementation,
    which makes use of the Jakarta Commons FileUpload 1.2 (http://commons.apache.org/fileupload/)
    or higher to support uploading files in web applications.


    Now, that we know the configurations created by Spring Roo in our flight-app application;
    let''s look at the controller classes generated by Roo.


    # Roo-generated controllers


    Roo generates a controller for each JPA entity corresponding to which a controller
    doesn''t already exist. For instance, in case the of the flight-app application,
    Roo creates the FlightController and the FlightDescriptionController controllers
    corresponding to the Flight and the FlightDescription JPA entities, respectively.
    The following code from the FlightController.java file shows the FlightController
    generated by Spring Roo:


    ```

    ```java

    @RooWebScaffold(path = "flights", formBackingObject = Flight.class)

    @RequestMapping("/flights")

    @Controller

    public class FlightController {

    }

    ```

    ```


    The @Controller annotation indicates that the FlightController is a Spring MVC
    controller component.


    The @RequestMapping class-level annotation maps incoming requests to controller
    classes. The URI to which the controller map is specified by the value specified
    in the @RequestMapping annotation. For instance, the FlightController maps to
    the /flights URI. As we will see soon, @RequestMapping annotation can also be
    used at a method-level to narrow down the mapping specified at the class-level.


    The @RooWebScaffold Roo annotation instructs Roo to generate an ITD containing
    CRUD operations for the Flight JPA entity (identified by the formBackingObject
    attribute) and creates JSPX views for performing CRUD operations on the Flight
    JPA entity. The path attribute identifies the sub-directory inside the /WEB-INF/views/
    in which view artifacts (JSPX views and tiles definitions XML) are created for
    the FlightController. Refer the Creating a Spring MVC controller for a specific
    JPA entity recipe to see a detailed list of the @RooWebScaffold annotation attributes.


    The following code shows the AspectJ ITD created for FlightController:


    ```

    ```java

    import javax.validation.Valid;


    privileged aspect FlightController_Roo_Controller

    {


    @RequestMapping(method = RequestMethod.POST)

    public String FlightController.create(@Valid Flight flight,

    ...)

    ```

    ```'
