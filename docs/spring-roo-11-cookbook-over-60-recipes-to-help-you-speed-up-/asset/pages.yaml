- pgno: 430
  md: '6. Execute the addon create wrapper command to create a Roo add-on that wraps
    the h2-1.3.160.jar maven artifact:


    ```

    ... roo addon create wrapper --topLevelPackage com.h2.roo.jdbcbc --groupId com.h2database
    --artifactId h2 --version 1.3.60 --vendorName H2 --licenseUrl http://www.h2database.com

    ```


    7. Modify the pom.xml file and add the following <Import-Package> element to the
    configuration of Maven Bundle Plugin:


    ```

    <instructions>

    <Import-Packages>javax.servlet.*;resolution:=optional,

    org.apache.lucene.*;resolution:=optional,

    org.slf4j;resolution:=optional,*

    </Import-Package>

    ...

    </instructions>

    ```


    8. Now, exit the Roo shell and execute the following maven goal to generate the
    OSGi version of the H2 database driver:


    ```

    C:\roo-cookbook\ch07-recipes\wrapper> mvn bundle:bundle

    ```


    This maven goal creates the OSGi-compliant H2 database driver in the target directory
    of the project with name com.h2.roo.jdbcb.h2-1.3.60.0001.jar.


    9. Create the C:\roo-cookbook\ch07-recipes\flight-app directory and start the
    Roo shell from it.


    10. Create a new Roo project inside the flight-app directory:


    ```

    ... roo project --topLevelPackage sample.roo.flightapp --java 6 --projectName
    flight-app

    ```


    11. Set up Hibernate as the persistence provider for the myflightappdb H2 database:


    ```

    ... roo persistence setup --provider HIBERNATE --database H2_IN_MEMORY --databaseName
    myFlightAppDB

    ```


    12. Set ''sa'' as the username to use for connecting with the H2 database:


    ```

    ... roo database properties set --key database.username --value sa

    ```


    13. Now, execute the perform eclipse command to create Eclipse IDE-specific configuration
    files:


    ```

    ... roo perform eclipse

    ```


    14. Import the flight-app project into Eclipse IDE and modify the database.url
    property in the SRC_MAIN_RESOURCES/META-INF/spring/database.properties file to
    point to the myflightappdb H2 database, as shown here:


    ```

    database.password=

    database.url=jdbc:h2:tcp://localhost/~/myflightappdb

    ```'
