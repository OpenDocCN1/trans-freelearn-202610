    \n modelAttribute=\"flight\"\n path=\"/flights\" **render=\"${empty dependencies}\"\
    **\n ...\n```\n\nThe `dependencies` variable is added to the request by the `FlightController`.\
    \ The `FlightController` identifies the dependencies of the `Flight` JPA entity\
    \ based on the relationships in which it participates. As the `Flight` entity\
    \ has a not null many-to-one relationship with the `FlightDescription` entity,\
    \ the `FlightController` adds it as a dependency in the `dependencies` variable,\
    \ as shown here in the contents of the `FlightController_Roo_Controller.aj` file:\n\
    \n```\n@RequestMapping(params = \"form\", method = RequestMethod.GET)\npublic\
    \ String FlightController.createForm(Model model)\n{\n    model.addAttribute(\"\
    flight\", new Flight());\n    addDateTimeFormatPatterns(model);\n    List dependencies\
    \ = new ArrayList();\n    if (FlightDescription.countFlightDescriptions() == 0)\n\
    \    {\n        dependencies.add(new String[]{\"flightDescription\",\n       \
    \     \"flightdescriptions\"});\n    }\n    model.addAttribute(\"dependencies\"\
    , dependencies);\n    return \"flights/create\";\n}\n```\n\nThe `createForm` method\
    \ is responsible for rendering the form for creating the `Flight` entity instances.\
    \ The given code shows that if no `FlightDescription` entity instances are found,\
    \ the `createForm` method adds a `String[]` to the `dependencies` model attribute.\
    \ The `dependencies` attribute contains the dependencies, which are not currently\
    \ available for creating the `Flight` instances. The form for creating `Flight`\
    \ entities is rendered only if the `dependencies` attribute is empty, something\
    \ which we have already seen.\n\nWe saw earlier that we can switch an element\
