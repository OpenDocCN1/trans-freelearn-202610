    # How it works...


    Let''s take a deep dive into how themes are configured and used in Spring MVC
    applications:


    In webmvc-config.xml, ResourceBundleThemeSource is configured by Spring Roo.

    When using the ResourceBundleThemeSource all theme resources (images and CSS)

    are defined in a properties file (a theme source), which resides in the classpath
    root

    (that is, the /WEB-INF/classes directory). So, each properties file in the /WEB-INF/classes

    constitutes a theme definition file. Now, by default Roo creates two properties
    file in /WEB-

    INF/classes directory: standard.properties and alt.properties. We can say that

    we have two themes installed by default in the Roo-generated Spring Web MVC applications.

    So, what does these property files contain? Each properties file contains information
    about

    the CSS and images that form part of the theme. The alt.properties file contains
    the

    following property:


    ```

    styleSheet-resources/styles/alt.css

    ```'
