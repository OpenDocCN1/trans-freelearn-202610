    # Creating a Spring MVC controller for a specific JPA entity


    The controller all command let''s you create controllers for all JPA entities
    for which a corresponding controller doesn''t exist. If you want to control the
    web request path to which the controller is mapped or the operations supported
    by the controller, then you should use the controller scaffold command.


    # Getting ready


    Delete the contents of the ch04-recipe sub-directory inside the C:\\roo-cookbook
    directory.


    Copy the ch04_web-app.roo script into the ch04-recipe directory.


    Execute the ch04_web-app.roo script that creates the flight-app Roo project, sets
    up Hibernate as the persistence provider, configures MySQL as the database for
    the application, creates Flight and the FlightDescription JPA entities, and defines
    a many-to-one relationship between the Flight and FlightDescription entities.
    If you are using a different database than MySQL or your connection settings are
    different than what is specified in the script, then modify the script accordingly.


    Start the Roo shell from the C:\\roo-cookbook\\ch04-recipe directory.'
