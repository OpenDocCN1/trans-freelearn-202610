    # How it works...


    The `flex remoting all` command is processed by the Flex add-on of Spring Roo.


    Flex clients interact with server-side BlazeDS remoting destinations (which are
    Java objects) via BlazeDS RemotingService. As we are using Spring BlazeDS integration,
    remoting destinations are configured as Spring service components, and the RemotingService
    is configured with sensible defaults by the `<message-broker>` element of Spring''s
    `flex` schema (refer SRC_MAIN_WEBAPP\WEB-INF\spring\flex-config.xml file). The
    `package` argument of the `flex remoting all` command specifies the package in
    which the remoting destinations are created.


    > It is important to note that Flex clients interact with messaging destinations
    (which could be a JMS queue or topic) using the MessageService and with remoting
    destinations (Java objects) using the RemotingService.'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'The following table describes the important directories and files that are
    created when the flex remoting all command is executed:


    | Directory / file | Description |

    | :--- | :--- |

    | SRC_MAIN_JAVA\\sample\\roo\\flightapp\\flex | Contains remoting destinations
    created by Roo corresponding to each JPA entity in the flightapp_flex application
    for which a remoting destination doesn''t exist. This directory is created based
    on the package argument value of the flex remoting all command. |

    | ROOT\\src\\main\\flex\\sample\\roo\\flightapp\\domain | Contains Roo-generated
    ActionScript classes that map to JPA entities in the flightapp_flex application.
    |

    | ROOT\\src\\main\\flex\\sample\\roo\\flightapp\\presentation\\flightdescription
    | Contains MXML files and ActionScript classes for performing CRUD operations
    on the FlightDescription JPA entity. The name of the directory is derived from
    the name of the JPA entity. |

    | ROOT\\src\\main\\flex\\sample\\roo\\flightapp\\presentation\\flight | Contains
    MXML files and ActionScript classes for performing CRUD operations on the Flight
    JPA entity. The name of the directory is derived from the name of the JPA entity.
    |


    When the flex remoting all command is executed, it creates a remoting destination
    (which is also Spring''s service component) corresponding to each JPA entity in
    the application for which a remoting destination doesn''t already exist. A remoting
    destination defines methods to perform CRUD operations on the corresponding JPA
    entity. The following code listing shows the remoting destination, FlightDescriptionService
    class, created by Roo corresponding to the FlightDescription JPA entity:


    ```

    FlightDescriptionService.java

    package sample.roo.flightapp.flex;


    import org.springframework.flex.roo.addon.RooFlexScaffold;

    import sample.roo.flightapp.domain.FlightDescription;

    import org.springframework.flex.remoting.RemotingDestination;

    import org.springframework.stereotype.Service;


    @RooFlexScaffold(entity = FlightDescription.class)

    @RemotingDestination

    @Service

    public class FlightDescriptionService {

    }

    ```'
