- pgno: 74
  md: "The following code in Flight_Roo_Entity.aj adds @Table and @Entity JPA annotations\
    \ in the Flight class:\n\n```\ndeclare @type: Flight: @Entity;\ndeclare @type:\
    \ Flight: @Table(name = \"FLIGHT_TBL\");\n```\n\nIn Flight_Roo_Entity.aj, the\
    \ FlightKey field is annotated with the @EmbeddedId annotation because it is the\
    \ composite primary key class of the Flight entity. Roo also creates a version\
    \ field in Flight_Roo_Entity.aj, which maps to the version column of the table\
    \ to which the Flight entity maps. If we create a persistent entity that doesn't\
    \ use a composite primary key, then instead of @EmbeddedId, Spring Roo uses the\
    \ @Id annotation to annotate the primary key.\n\nWhile generating an entity, Spring\
    \ Roo also generates a <entity-name>_Roo_Configurable.aj ITD, which is responsible\
    \ for adding Spring's @Configurable annotation to the entity. Here, <entity-name>\
    \ is the name of the persistent entity.\n\nThe entity instances are typically\
    \ created outside the Spring's application context by the JPA provider or by using\
    \ the new operator. The use of @Configurable annotation is particularly useful\
    \ in entities because it allows injecting beans configured in Spring's application\
    \ context into the entity instance. It is because of the @Configurable annotation\
    \ that Spring is able to inject the EntityManager instance into persistent entities.\n\
    \nThe following code listing shows the FlightKey class of the flight-app application:\n\
    \n```\n@RooToString\n@RooIdentifier\npublic final class FlightKey {\n    private\
    \ String flightId;\n    private Date departureDate;\n}\n```\n\nIn the code, the\
    \ @RooIdentifier annotation of Spring Roo is responsible for adding constructors,\
    \ getter and setter methods for fields, and also provides implementation of the\
    \ hashCode and equals methods of the FlightKey composite primary key class. Spring\
    \ Roo generates a <entity-name>_Roo_Identifier.aj ITD file corresponding to the\
    \ @ RooIdentifier annotation on the composite primary key class. Here, <entity-name>\
    \ is the name of the persistent entity.\n\nThe following code shows the methods\
    \ and attributes defined in the FlightKey_Roo_Identifier.aj ITD file:\n\n```\n\
    privileged aspect FlightKey_Roo_Identifier {\n    declare @type: FlightKey: @Embeddable;\n\
    \n    public FlightKey.new(String flightId, Date departureDate) {} }\n```"
  merge: -1
  img_proc: true
