- pgno: 270
  md: 'This MXML shows the user interface of the flightapp_flex application. The `<Panel>`
    tag creates a Spark Panel component which contains a Spark List component. The
    List component shows the list of entities that can be managed from the user interface.
    The list of entities is defined by the `<ArrayList>` tag. Notice that the value
    of the dataProvider attribute of the `<List>` tag is {entities} and the id attribute
    value of the `<ArrayList>` tag is entities, which means that the list of entities
    displayed by the List component comes from the list defined by the `<ArrayList>`
    tag. Well, the `<ArrayList>` tag doesn''t contain any element; therefore, for
    now, the list is empty.


    > The `<ArrayList>` tag is populated with child elements when we execute flex
    remoting all or flex remoting scaffold commands to scaffold a remoting destination
    corresponding to a JPA entity, as we''ll see in the Scaffoldings Flex application
    from the JPA entities recipe.


    The doubleClick attribute of `<List>` specifies that the `entityList_doubleClickHandler(event)`
    ActionScript method to be invoked when a user double clicks an item in the list.
    In the Scaffoldings remoting destination from the JPA entities recipe, we''ll
    go through the implementation detail of the `entityList_doubleClickHandler(event)`
    method.


    The `<ChannelSet>` tag creates a ChannelSet—a set of channels for communication
    with the BlazeDS server. We saw earlier that Roo defines the amf channel (channel
    type being AMFChannel) as the default application-wide channel in services-config.xml;
    therefore, the Roo-generated `<ChannelSet>` tag creates an AMFChannel using the
    `<AMFChannel>` tag. The url attribute of `<AMFChannel>` specifies the corresponding
    endpoint URL.


    > As the url attribute of the `<AMFChannel>` tag specifies the location of the
    BlazeDS server as localhost, your Roo-generated flightapp_flex application will
    work only if your BlazeDS server is running locally. To avoid hard-coded endpoint
    URLs, it is recommended that you externalize ChannelSet configuration into an
    XML file that is parsed when the Flex application is initialized and later used
    to communicate with the BlazeDS server.


    As mentioned earlier, Roo generates a flightapp_flex_scaffold-config.xml configuration
    file that overrides the default Flex compiler settings. Notice that the naming
    convention followed by the file is: <MXML file name>-config.xml, where <MXML file
    name> is the name of the MXM file corresponding to the configuration file which
    was created. When an MXM file named myApp.mxml is compiled, Flex compiler looks
    for a configuration file named myApp-config.xml in the same location as the MXM
    file, and uses it to override the default compiler options.'
  merge: -1
  img_proc: true
