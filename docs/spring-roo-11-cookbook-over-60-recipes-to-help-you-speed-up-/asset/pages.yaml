    # # Round-tripping support in Spring Roo for web controllers and views


    In Roo-generated applications, you can change JPA entities and let Roo take care
    of making necessary changes to the controllers and views. In this recipe, we look
    at an example scenario, which demonstrates how changes to a JPA entity are propagated
    to corresponding controllers and views.


