- pgno: 237
  md: 'The HTML page that you select on this screen represents a host HTML page that
    is responsible for loading the GWT application. Both ApplicationScaffold.html
    and index.html files are located in the src/main/webapp directory of the flightapp-gwt
    GWT application. index.html is a simple HTML page that simply loads the ApplicationScaffold.html
