- pgno: 409
  md: "Spring Roo treats both simple and advanced add-ons the same way. The distinction\
    \ between simple and advanced add-ons exists so that you can choose an appropriate\
    \ add-on template based on your custom add-on requirement. The add-on template\
    \ created by the `addon create simple` command is useful if you want to create\
    \ a custom add-on meant for adding project dependencies to the `pom.xml` file\
    \ and for adding configuration artifacts to the project. In this recipe we'll\
    \ look at the `addon create advanced` command, which is useful if you want to\
    \ create a custom add-on to generate Java code and AspectJ ITD.\n\n# Getting ready\n\
    \nCreate a new directory `C:\\roo-cookbook\\ch07-advanced-add-on` in your system\
    \ and start the Roo shell from the `ch07-advanced-add-on` directory.\n\n# How\
    \ to do it...\n\nThe following steps will demonstrate how to create an advanced\
    \ add-on:\n\n+   1. Execute the `addon create advanced` command, as shown here,\
    \ to create a `com.roo.addon.myadvanced` add-on project:\n+   \n+   ```\n+   ..roo>\
    \ addon create advanced --topLevelPackage com.roo.addon.myadvanced\n+   ...\n\
    +   Created SRC_MAIN_JAVA\\...\\MyadvancedCommands.java\n+   Created SRC_MAIN_JAVA\\\
    ...\\MyadvancedOperations.java\n+   Created SRC_MAIN_JAVA\\...\\MyadvancedOperationsImpl.java\n\
    +   Created SRC_MAIN_JAVA\\...\\MyadvancedMetadata.java\n+   Created SRC_MAIN_JAVA\\\
    ...\\MyadvancedMetadataProvider.java\n+   Created SRC_MAIN_JAVA\\...\\RooMyadvanced.java\n\
    +   Created SRC_MAIN_RESOURCES\\...\\configuration.xml\n+   ```\n\nThe output\
    \ only shows some of the important files generated by the Roo command that we'll\
    \ discuss them in this recipe.\n\n+   2. Execute the `perform eclipse` command\
    \ to create Eclipse-IDE specific configuration files:\n+   \n+   ```\n+   roo>\
    \ perform eclipse\n+   ```\n+   \n+   Now, import the `com.roo.addon.myadvanced`\
    \ Eclipse project into Eclipse IDE."
  merge: -1
  img_proc: true
- pgno: 410
  md: "# How it works...\n\nThe addon create advanced command creates a Roo add-on\
    \ template which you can use as the starting point to create a custom Roo add-on\
    \ which generates Java classes, interfaces and AspectJ ITDs. The following classes\
    \ and interfaces are generated by the addon create advanced command. The `<last-part-of-top-level-package>`\
    \ refers to the text after the last index of '.' in the value of the topLevelPackage\
    \ argument. In case of our example, the topLevel Package argument value is com.roo.addon.myadvanced,\
    \ which makes value of `<last-part-of-top-level-package>` as 'myadvanced'.\n\n\
    +   - `<last-part-of-top-level-package>Commands.java` class: defines methods that\
    \ are contributed to the Roo shell by the add-on.\n+   - `<last-part-of-top-level-package>Operations.java`\
    \ interface: defines methods that contain the processing logic for commands defined\
    \ in the *Commands.java class.\n+   - `<last-part-of-top-level-package>OperationsImpl.java`\
    \ class: implements the *Operations.java interface.\n+   - `<last-part-of-top-level-package>Metadata.java`\
    \ class: represents the metadata associated with this add-on. In this class you\
    \ write the code for creating Java classes, interfaces, and AspectJ ITDs.\n+ \
    \  - `<last-part-of-top-level-package>MetadataProvider.java` class: creates the\
    \ metadata associated with this add-on.\n+   - `Roo<last-part-of-top-level-package>.java`\
    \ class: represents the Roo annotation (similar to other Roo annotations like\
    \ @RooEntity, @RooJavaBean, @RooSolrSearchable, and so on) which triggers this\
    \ add-on to generate Java classes, interfaces, and AspectJ ITDs.\n\nYou may have\
    \ noticed that a configuration.xml file is also generated in the SRC_MAIN_RESOURCES\\\
    com\\roo\\addon\\myadvanced directory. The configuration.xml file defines dependencies\
    \ that are added by the add-on to the pom.xml file of the Roo project.\n\n# The\
    \ MyadvancedCommands class\n\nThe following code shows the methods of the MyAdvancedCommands\
    \ class that defines Roo commands exposed by the myadvanced add-on:\n\n```\n@Component\n\
    @Service\npublic class MyadvancedCommands implements CommandMarker {\n    @Reference\
    \ private MyadvancedOperations operations;\n\n    @CliAvailabilityIndicator({\
    \ \"myadvanced setup\",\n                                \"myadvanced add\", \"\
    myadvanced all \" })\n```"
  merge: -1
  img_proc: true
- pgno: 411
  md: "```\n```\npublic boolean isCommandAvailable() {\n    return operations.isCommandAvailable();\n\
    }\n```\n```\n\n```\n```\n@CliCommand(value = \"myadvanced add\",\n    help = \"\
