  md: 'The MyadvancedMetadataProvider class extends the AbstractIdMetadataProvider
    abstract class and makes use of the template method design pattern. The methods
    shown in the preceding code are invoked by the concrete methods defined in the
    AbstractIdMetadataProvider class. The following table describes the purpose of
    each of these methods:


    | Method name | Description |

    |---|---|

    | getMetadata | This method is responsible for creating and returning the MetadataItem
    (which is MyadvancedMetadata in the case of the myadvanced add-on). |

    | getIdtUniquenessFilenameSuffix | This method returns the suffix that should
    be used for naming the AspectJ ITD file. As this method returns "Myadvanced",
    the name of the AspectJ ITD created by this add-on is *_Roo_Myadvanced.aj. |

    | getGovernorPhysicalTypeIdentifier | Returns the instance-level MID of the Java
    type that receives the methods defined by the *_Roo_Myadvanced.aj AspectJ ITD
    file. In our example, Flight is the Java type that receives methods defined by
    *_Roo_Myadvanced.aj. |

    | getProvidesType | This method returns a class-level MID that identifies the
    MetadataItem which this MetadataProvider implementation offers. This method delegates
    the responsibility of creating MID to the MetadataItem implementation class. |

    | createLocalIdentifier | Creates a local instance-level MID for the specified
    Java type and path arguments. This method delegates the creation of MID to the
    Metadaltem implementation class. |


    The getMetadata method is responsible for creating the MyadvancedMetadata by passing
    information that MyadvancedMetadata is dependent upon. The following table describes
    the arguments passed to the getMetadata method:'
