- pgno: 406
  md: 'The FileWriterOperationsImpl class is similar to the MysimpleOperationsImpl
    class of the mysimple add-on. It defines the copyApplicationContextXML method
    which is responsible for copying the config.xml file from the add-on to the Roo
    project.


    The MetadataService class represents a service provided by Roo for retrieving
    metadata information for the Roo project, Java types, fields, methods, and so
    on. Metadata is obtained from Roo''s MetadataService using a metadata identification
    string, which has the format: MID:<fully-qualified-class-name>#<instance-identification-key>,
    where <fully-qualified-class-name> is the metadata type and <instance-identification-key>
    is the Java type to which the metadata applies. If the metadata is not associated
    with a Java type, then the metadata string format is: MID:<fully-qualified-class-name>.
    If the metadata identification string has the format MID:<fully-qualified-class-name>#<instance-identification-key>,
    then it is referred to as an instance-level metadata identification string. If
    the metadata identification string has the format MID:<fully-qualified-class-name>,
    then it is referred to as a class-level metadata identification string. In the
    FileWriterOperationsImpl class, ProjectMetadata represents a metadata type which
    holds the Roo project''s details, like project name, top-level package name, dependencies,
    and so on. The getProjectIdentifier() method of ProjectMetadata returns a metadata
    identification string for the Roo project and is then passed to MetadataService
    to retrieve the ProjectMetadata instance.


    The TemplateUtils class is used to obtain java.io.InputStream to the config.xml
    file. The XmlUtils class is then used to parse the config.xml file to build the
    org.w3c.dom.Document instance. The findFirstElementByName method of XmlUtils is
    used to find the first occurrence of the <context:component-scan> element in config.xml.
    The findFirstElementByName method returns an instance of org.w3c.dom.Element.
    The setAttribute method of Element is used to set the value of the base-package
    attribute of the <context:component-scan> element to the top-level package of
    the Roo project. The writeXml method of XmlUtils writes the Document object to
    java.io.OutputStream. The createIndentingTransformer method of XmlUtils creates
    a javax.xml.transform.Transformer instance, which indents entries in the Document
    object by 4 characters. If you want to perform a custom transformation of XML,
    you can create a custom Transformer implementation and pass it to the writeXml
    method of XmlUtils class.


    Let''s say you have a Roo project named flight-app whose top-level package is
    com.sample.flightapp. Now assume that you execute a Roo command which results
    in the execution of the copyApplicationContextXML method of the FileWriterOperationsImpl
    class of the add-on. The copyApplicationContextXML method will read the config.xml
    template file, set the base-package attribute of the <context:component-scan>
    element to com.sample.flightapp and write the modified config.xml to the flight-app
    Roo project.


    Now let''s look at some of the important configurations defined in the pom.xml
    file of the mysimple add-on project.'
  merge: -1
