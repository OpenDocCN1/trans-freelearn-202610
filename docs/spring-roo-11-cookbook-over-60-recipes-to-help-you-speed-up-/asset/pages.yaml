  md: '# # Creating a one-to-many (or many-to-many) relationship between entities


    In the previous recipe, we saw how the many-to-one (or one-to-one) relationship
    is established between entities using the `field reference` command. In this recipe,
    we''ll extend the same example to show how a one-to-many (or many-to-many) relationship
    can be created using the `field set` command. The following class diagram shows
    a one-to-many relationship between the `FlightDescription` and `Flight` entities:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_126_0.png)


    In the given figure, you''ll notice that we have added a `flights` field of type
    `Set<Flight>` to the `FlightDescription` entity, reflecting the one-to-many relationship
    between the `FlightDescription` and the `Flight` entity.


    # ## Getting ready


    Exit the Roo shell and delete the contents of the `C:\roo-cookbook\ch03-recipes`
    directory.


    Start the Roo shell from the `C:\roo-cookbook\ch03-recipes` directory.


    Execute the `ch03_relationship_many_to_one.roo` script, which creates the `flight-app`
    Roo project, sets up Hibernate as a persistence provider, configures MySQL as
    the database for the application, creates the `Flight` and `FlightDescription`
    JPA entities, and defines a many-to-one relationship between the `Flight` and
    `FlightDescription` entities. If you are using a different database than MySQL
    or your connection settings are different than what is specified in the script,
    then modify the script accordingly.


    # ## How to do it...


    To create a one to many (or many to many) relationship between the `FlightDescription`
    and `Flight` entities, follow the steps given here:


    +   1. Set the focus of the Roo commands on the `FlightDescription` entity:


    ```

    .. roo> focus --class ~.domain.FlightDescription

    ```'
  merge: -1
  img_proc: true
- pgno: 127
  md: '+   2. Create a one-to-many relationship between the FlightDescription and
    Flight entities using the field set command:


    ```

    ~.domain.FlightDescription roo> field set --fieldName flights

    --type ~.domain.Flight --cardinality ONE_TO_MANY --mappedBy

    flightDescription

    ```


    # How it works...


    The field set command is used to create the many side of a one-to-many JPA relationship
    within an entity. If the relationship between two entities is many-to-many, then
    the field set command is used for both the entities in the relationship. The following
    table describes some of the important arguments that can be specified for the
    field set command:


    | Argument | Description |

    | :--- | :--- |

    | fieldName (mandatory) | Name of the relationship field that you want to add
    to the entity. The type of the field is java.util.Set. In case of our example,
    the fieldName argument is specified as flights, which results in an additional
    field named flights to the FlightDescription entity. |

    | type (mandatory) | Identifies the type of the related entity (which is on the
    many side of a one-to-many relationship) contained in the Set defined by the fieldName
    argument. In our example, the type value is specified as ~.domain.Flight, which
    means that the Set (defined by the fieldName argument) contains elements of type
    Flight, as shown here: private Set<Flight> flights = new HashSet<Flight>() ; |

    | mappedBy | The value of the mappedBy argument refers to the owner of the relationship.
    It translates into the value of the mappedBy element of the JPA @OneToMany or
    @ManyToMany annotation. In our example, the value of the mappedBy argument is
    flightDescription; therefore, the flights field created by the field set command
    is annotated with a @OneToMany annotation whose mappedBy attribute value is flightDescription.
    |

    | cardinality | Cardinality of the relationship between JPA entities. By default,
    cardinality is MANY_TO_MANY. As we want to create a one-to-many relationship between
    the FlightDescription and Flight entity, the value of the cardinality argument
    is specified as ONE_TO_MANY. |

    | fetch | The JPA fetch strategy for related entity. The possible values are EAGER
    and LAZY. The value of the fetch argument translates into the value of the fetch
    element of the @ManyToMany or @OneToMany annotation. |'
  merge: -1
  img_proc: true
- pgno: 128
  md: "> Even though the Roo shell displays MANY_TO_ONE, MANY_TO_MANY, ONE_TO_MANY,\
    \ and ONE_TO_ONE as possible values of the cardinality argument of the field set\
    \ command, it only accepts MANY_TO_MANY and ONE_TO_MANY. The reason for this--field\
    \ set only makes sense in the case of a many-to-many relationship or when the\
    \ entity is on the one side of a one-to-many relationship.\n\nThe execution of\
    \ the field set command against the FlightDescription entity results in the following\
    \ field added to it:\n\n```\n@OneToMany(cascade = CascadeType.ALL,\n       mappedBy=\"\
    flightDescription\")\nprivate Set<Flight> flights = new HashSet<Flight>() ;\n\
    ```\n\nThe given code shows that the field set command simply adds a relationship\
    \ field to the entity.\n\n# There's more...\n\nfield set and field reference commands\
    \ don't provide the option to specify the cascade effect that applies to the related\
    \ entity. The behavior of the commands is as described here:\n\n+   - @ManyToMany\
    \ or @OneToMany annotated JPA relationship field created using the field set command\
    \ has the value of the cascade element as CascadeType.ALL, which means the entity\
    \ operations such as refresh, persist, merge, and so on, are propagated to a related\
    \ entity.\n+   - @ManyToOne and @OneToOne annotated JPA relationship field created\
    \ using the field reference command don't have the cascade element specified,\
    \ which means entity operations such as refresh, persist, merge, and so on, are\
    \ not propagated to an associated entity.\n\nIn scenarios where you want to specify\
    \ the cascade effect, you can modify the corresponding JPA annotation in your\
    \ Java source file.\n\n# See also\n\n+   - Refer to the Creating a many-to-one\
    \ (or one-to-one) relationship between entities recipe to see how a field reference\
    \ command is used for a creating many-to-one (or one-to-one) relationship"
