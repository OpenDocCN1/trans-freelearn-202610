- pgno: 86
  md: "+   - Declares a list which holds `Flight` entities generated by the 'data\
    \ on demand' class. These `Flight` entity instances represent the seed data generated\
    \ by the 'data on demand' class.\n+   - Defines a `getNewTransientFlight(int index)`\
    \ method for generating a `unique` `Flight` instance based on the value of the\
    \ `index` argument. The `getNewTransientFlight` method creates persistent entity\
    \ instances which comply with the JSR 303 annotations specified for the entity's\
    \ persistent fields. For instance, the `Flight` entity specifies the `@Size(min\
    \ = 3, max = 20)` JSR 303 annotation for the `origin` and `destination` fields\
    \ (refer to the `Flight.java` class); therefore, the `getNewTransientFlight` method\
    \ attempts (that is, it is not guaranteed, as we'll see soon) to ensure that the\
    \ size of the `origin` and `destination` fields comply with the corresponding\
    \ JSR 303 annotation.\n+   - Defines the `getSpecificFlight(int index)` method,\
    \ which returns the `Flight` entity at the specified `index` from the collection\
    \ of seed data maintained by the 'data on demand' class.\n+   - Defines the `getRandomFlight()`\
    \ method, which returns `Flight` entity at a random index (obtained from the `java.security.SecureRandom`\
    \ instance) in the seed data collection maintained by the 'data on demand' class.\n\
    +   - Defines the `modifyFlight(Flight+obj)` method, which is supposed to modify\
    \ the `Flight` entity passed as argument and return the success or failure of\
    \ modification. But it simply returns `false`, that is, it never modifies the\
    \ passed `Flight` instance.\n+   - Defines an `init()` method, which is responsible\
    \ for creating the seed data for integration testing of the `Flight` entity. It\
    \ creates `Flight` entities in the database using the `getNewTransientFlight(int\
    \ index)` method. The number of `Flight` entities created in the database is determined\
    \ by the value of the `quantity` attribute of the `@RooOnDemand` annotation.\n\
    \n> It is important to note that the `init()` method is internally called by methods\
    \ defined in the `*_Roo_DataOnDemand.aj` to ensure that a fresh set of seed data\
    \ is created in the database each time a test method is invoked.\n\n> ### JSR\
    \ 303 annotations and seed data\n> \n> The 'data on demand' classes generated\
    \ by Spring Roo provide limited support for creating entity instances that comply\
    \ with JSR 303 annotations. As of Spring Roo 1.1.3, it only supports `@NotNull`,\
    \ `@Past`, and `@Future` JSR 303 constraints, along with some support for maximum\
    \ and minimum range annotations. If your project uses any other JSR 303 annotation,\
    \ then it is recommended to create your own setter method for entity fields in\
    \ the `*DataOnDemand.java` class."
