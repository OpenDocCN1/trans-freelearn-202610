  md: "# How it works...\n\nIn the `field` command you can use arguments such as `notNull`,\
    \ `nullRequired`,\n`decimalMax`, `decimalMin`, `regexp`, `sizeMax`, and `sizeMin`\
    \ to specify the validation\nconstraints that apply to a field. The use of these\
    \ arguments will result in the generation of\nfields that are annotated with JSR\
    \ 303 annotations, as shown here for `Flight` entity:\n\n```\npublic class Flight\
    \ {\n    @NotNull\n    @DecimalMin(\"100\")\n    @DecimalMax(\"200\")\n    @Column(name=\"\
    NUM_OF_SEATS\")\n    private Integer numOfSeats;\n\n    @NotNull\n    @Column(name\
    \ = \"FLT_ORIGIN\")\n    @Size(min = 3, max = 20)\n    private String origin;\n\
    \n    @NotNull\n    @Column(name = \"FLT_DESTINATION\")\n    @Size(min = 3, max\
    \ = 20)\n    private String destination;\n    .....\n}\n```\n\n# There's more...\n\
    \nUsing JSR 303 constraints is not limited to domain objects; you can use JSR\
    \ 303 constraints\nin any class, irrespective of the tier in which the class is\
    \ used. For instance, you can use JSR\n303 constraints in command or form-backing\
    \ objects of your web tier.\n\n# See also\n\n+   - Refer to the Creating persistent\
    \ entities recipe to see how to create persistent entities\n+   and add fields\
    \ to them"
  merge: -1
