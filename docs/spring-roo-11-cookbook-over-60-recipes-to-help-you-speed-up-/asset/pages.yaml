- pgno: 170
  md: "The following `delete` method, defined in the `FlightController_Roo_Controller.aj`\
    \ ITD, shows yet another way of using the `@RequestMapping` annotation:\n\n```\n\
    @RequestMapping(value = \"/{flightId}\",\n            method = RequestMethod.DELETE)\n\
    public String FlightController.delete(\n            @PathVariable(\"flightId\"\
    ) Long flightId, ..)\n{\n    ..\n}\n```\n\nThe `delete` method deletes a `Flight`\
    \ JPA entity from the database. The `value` attribute of the `method-level @RequestMapping`\
    \ narrows down the mapping specified by the `@RequestMapping` annotation at the\
    \ class-level. We earlier saw that the class-level `@RequestMapping` for the `FlightController`\
    \ specifies /flights as the URI to which the `FlightController` maps. This means,\
    \ the `delete` method maps to the /flights/{flightId} URI-template. Now, the {flightId}\
    \ is a variable whose value is determined from the submitted request. When the\
    \ value of the {flightId} variable is substituted in the URI-template, then it\
    \ becomes a URI. So, where does the value of the {flightId} variable come from?\
    \ It comes from the request URI. For instance, if the request URI is /flights/1,\
    \ then the value of the {flightId} variable is 1. As you will notice in the given\
    \ code, the `@PathVariable` annotation has been used for the method parameter\
    \ named `flightId`. The annotation `@PathVariable(\"flightId\")` retrieves the\
    \ value of the {flightId} variable and binds it to the `Long` type `flightId`\
    \ method parameter.\n\n> The @PathVariable not only binds the value of the URI\
    \ variables to method parameters, but also performs type conversion.\n\nIf you\
    \ look at the code for the `FlightController_Roo_Controller.aj` or the `FlightDescriptionController_Roo_Controller.aj`\
    \ ITD, then you will find that the controller methods responsible for processing\
    \ the HTTP POST, PUT, and DELETE methods return a redirect URL (specified using\
    \ `redirect:` prefix), that is, the Spring MVC controllers automatically implement\
    \ the PRG (Post-Redirect-Get) pattern.\n\n# There's more...\n\nIn this recipe,\
    \ we saw that Spring Roo does a lot of work behind the scenes to give us a fully-functional\
    \ Spring Web MVC application. Depending upon your choice of web frontend, you\
    \ can also use Roo's built-in support for Flex and GWT to create web applications.\
    \ In the next chapter, we will look at Spring Roo's support for creating web applications\
    \ using Flex, GWT, and the Spring Web Flow framework."
  merge: -1
  img_proc: true
- pgno: 171
  md: "# See also\n\n+   - Refer to the Getting started with Flex application development\
    \ and Scaffolding Flex application from JPA entities recipes to see how Spring\
    \ Roo simplifies developing Flex applications.\n+   - Refer to the Scaffolding\
    \ GWT application from JPA entities recipe to see how Spring Roo can be used to\
    \ develop GWT based applications\n+   - Refer to the Getting started with Spring\
    \ Web Flow recipe for details on how Spring Roo supports developing applications\
    \ with the Spring Web Flow framework\n\n# Packaging, deploying, and using a Roo-generated\
    \ Spring MVC application\n\nThe task of developing the Spring MVC application\
    \ is incomplete without packaging, deploying, and using it. In this recipe, we\
    \ will look at how a Roo-generated Spring Web MVC application is packaged, deployed,\
    \ and run.\n\n# Getting ready\n\nDelete the contents of ch04-recipe sub-directory\
    \ inside the C:\\roo-cookbook directory.\n\nCopy the ch04_web-app.roo script into\
    \ the ch04-recipe directory.\n\nThe Execute the ch04_web-app.roo script that creates\
    \ the flight-app Roo project, sets up Hibernate as the persistence provider, configures\
    \ MySQL as the database for the application, creates Flight and FlightDescription\
    \ JPA entities, and defines many-to-one relationships between the Flight and FlightDescription\
    \ entities. If you are using a different database than MySQL or your connection\
    \ settings are different than what is specified in the script, then modify the\
    \ script accordingly.\n\nStart Roo shell from the C:\\roo-cookbook\\ch04-recipe\
    \ directory.\n\n# How to do it...\n\nFor packaging, deploying, and using a Roo-generated\
    \ Spring Web MVC application follow the given steps:\n\n+   1. Execute the controller\
    \ all command to create controllers and views corresponding to JPA entities in\
    \ the flight-app project, as shown here:\n+   \n+   roo> controller all --package\
    \ ~.web"
  merge: -1
  img_proc: true
- pgno: 172
  md: "+   2. Package the flight-app web application using the perform package command\
    \ of Roo:\n+   \n+   roo> perform package\n\n+   3. Executing the perform package\
    \ command will create a WAR file named flight-app-0.1.0.BUILD-SNAPSHOT.war in\
    \ the target directory of your flight-app project. You can now deploy the WAR\
