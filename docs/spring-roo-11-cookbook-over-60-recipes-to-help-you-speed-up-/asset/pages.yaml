    As this code shows, a FlightRequest service stub extends GWT''s RequestContext
    interface. GWT''s @ServiceName annotation specifies the full-qualified name of
    the server-side service class corresponding to the client-side service stub, which
    is the Flight JPA entity in the case of the FlightRequest stub. The above code
    shows that the FlightRequest service stub defines methods that return the following:


    +   - Request<T> - where T represents the actual return type of the corresponding
    method on the server-side class. For instance, countFlights method returns java.lang.Long
    in Flight JPA entity, and so does the countFlights method in FlightRequest stub.
    If a method on the server-side service class returns an entity, then the client-side
    service stub returns the corresponding entity proxy. For instance, findAllFlights
    method in Flight JPA entity returns a java.util.List<Flight>, so the findAllFlights
    method in FlightRequest stub returns java.util.List<FlightProxy>. It is important
    to note that the methods corresponding to static methods of the server-side service
    return Request<T> type in the client-side service stub.


    +   - InstanceRequest<P, T> - where P represents the entity type on which the
    corresponding server-side service method acts and T represents the actual return
    type of the method. For instance, persist method of Flight JPA entity acts on
    Flight entity instance and returns void; therefore, the return type of the corresponding
    method in FlightRequest stub is InstanceRequest<FlightProxy, java.lang.Void>.
    Note that the only stub methods corresponding to instance methods on the server-side
    service return InstanceRequest.


    > It is Roo''s @RooGwtMirroredFrom annotation that keeps the client-side stub
    in-sync with the corresponding JPA entity.


