- pgno: 222
  md: "It is important to note that you can use the `json add` command to add JSON\
    \ support to any class. For instance, if you create a `MyKlass` class and annotate\
    \ it with `@RooJson`, then Roo will auto-generate the given methods where the\
    \ `<class-name>` is `MyKlass`.\n\n**Excluding fields from serializing**\n\nTo\
    \ exclude a field from serializing to JSON format, all you need to do is to annotate\
    \ the field or the corresponding getter method with the `@JSON (include=false)`\
    \ annotation.\n\nIn some JavaScript libraries, such as EXT JS, it is expected\
    \ that the JSON document contains a root node. You can instruct Roo to set the\
    \ root node of the generated JSON document either by using the `rootName` argument\
    \ of the `json add` command or by setting the `rootName` attribute of the `@RooJson`\
    \ annotation. When the `rootName` argument of the `json add` command is used,\
    \ the generated `@RooJson` annotation's `rootName` attribute is set to the value\
    \ of the `rootName` command argument.\n\nThe following code snippet shows the\
    \ `Flight_Roo_Json.aj` ITD when the `rootName` attribute of the `@RooJson` annotation\
    \ on the `Flight.java` file is set to `myRoot`:\n\n```\nimport flexjson.JSONDeserializer;\n\
    import flexjson.JSONSerializer;\n\nprivileged aspect Flight_Roo_Json {\n    public\
    \ String Flight.toJson() {\n        return new JSONSerializer().rootName(\"myRoot\"\
    ).exclude(\"*.class\").serialize(this);\n    }\n    ...\n    public static String\
    \ Flight.toJsonArray(\n        Collection<Flight> collection) {\n        return\
    \ new JSONSerializer().\n        rootName(\"myRoot\").exclude(\"*.class\").\n\
    \        serialize(collection);\n    }\n    ...\n}\n```\n\nThe given code shows\
    \ that if the `rootName` attribute of the `@RooJson` annotation is specified,\
    \ the `toJson` and `toJsonArray` methods of the `*_Roo_Json.aj` ITD set the root\
    \ node of the JSON document to `myRoot` using the `rootName` method of the `JSONSerializer`\
    \ object of Flexjson. The argument passed to the `rootName` method is the value\
    \ set for the `rootName` attribute of the `@RooJson` annotation."
  merge: -1
  img_proc: true
