    The following table specifies some of the goals defined by the Maven GAE plugin:


    | Goal | Description |

    |---|---|

    | gae:run | Runs the project locally on the GAE development web server |

    | gae:deploy | Uploads the application to the GAE server |

    | gae:logs | Retrieves application logs from the GAE server |

    | gae:version | Shows the plugin and GAE SDK versions |


    Let''s now look at the Maven DataNucleus plugin and the role it plays in the GAE
    application.


    # # Maven DataNucleus plugin


    To make a class persistent, DataNucleus expects that the class must implement
    the PersistenceCapable interface of JDO. Why are we talking about JDO now? Well,
    it''s because DataNucleus support for JPA is built on top of JDO. This means that
    even if you have annotated your domain classes with the @Entity JPA annotation,
    DataNucleus can''t persist them. To free developers from implementing the PersistenceCapable
    interface in their domain classes, DataNucleus provides an enhancer, which works
    on the compiled domain classes and implements PersistenceCapable interface via
    bytecode enhancement. The Maven DataNucleus plugin provides a datanucleus:enhance
    goal, which enhances JPA classes annotated with the @Entity annotation. The following
    code shows this:


    ```

    <plugin>

    <groupId>org.datanucleus</groupId>

    <artifactId>maven-datanucleus-plugin</artifactId>

    <version>1.1.4</version>

    <configuration>

    <mappingIncludes>**/*.class</mappingIncludes>

    <enhancerName>ASM</enhancerName>

    <api>JPA</api>

    <mappingExcludes>**/GaeAuthFilter.class</mappingExcludes>

    </configuration>

    <execution>

    <execution>

    <phase>compile</phase>

    <goals>

    ```'
  merge: -1
  img_proc: true
- pgno: 350
  md: "```\n<goal>enhance</goal>\n</goals>\n</execution>\n</executions>\n</plugin>\n\
    ```\n\nIn the plugin configuration, the `<execution>` element specifies that datanucleus:enhance\
    \ goal is executed in the compile build lifecycle phase. So, when Java source\
    \ files are compiled, the Maven DataNucleus plugin enhances the compiled JPA domain\
    \ classes. The `<mappingIncludes>` element specifies the classes that should be\
    \ included for enhancement. The `<mappingExcludes>` specifies the classes that\
    \ should not be considered for enhancement.\n\nThe `<api>` element specifies whether\
    \ the enhancement is for JPA or JDO. As we are using JPA in the flightapp-gae-gwt\
    \ project, the value of the `<api>` element is jpa. The `<enhancerName>` element\
    \ specifies ASM as the value, which basically refers to the ASM framework (`http://asm.ow2.org/`)\
    \ used by DataNucleus for enhancing the bytecode.\n\nLet's now look at the FlightDescription\
    \ entity that was generated by Roo:\n\n# Persistent entities\n\nAs GAE datastore\
    \ is not a relational database, you'll find that some of the concepts that apply\
    \ while using JPA with relational databases will not apply when using JPA with\
    \ GAE datastore.\n\nThe following code shows the FlightDescription JPA entity\
    \ generated by Roo.\n\n```\n@RooJavaBean\n@RooToString\n@RooEntity\npublic class\
    \ FlightDescription {\n\n    @NotNull\n    private String origin;\n\n    @NotNull\n\
    \    private String destination;\n\n    @NotNull\n    private Float price;\n\n\
    }\n```\n\nThe given code shows that we are not using `@Column` and `@Table` JPA\
    \ annotations to identify the table into which the entity instances are saved\
    \ and the table column to which a persistent entity field maps to. As the GAE\
    \ datastore is schema-less, you don't need to specify the table or column information.\
    \ You can still use the JSR 303 annotations, such as `@NotNull` in this code,\
    \ for validating your domain objects."
  merge: -1
  img_proc: true
- pgno: 351
  md: "The following code shows the FlightDescription_Roo_Entity.aj AspectJ ITD file:\n\
    \n```\nprivileged aspect FlightDescription_Roo_Entity {\n\n    declare @type:\
    \ FlightDescription: @Entity;\n\n    @PersistenceContext\n    transient EntityManager\
    \ FlightDescription.entityManager;\n\n    @Id\n    @GeneratedValue(strategy =\
    \ GenerationType.IDENTITY)\n    @Column(name = \"id\")\n    private Long FlightDescription.id;\n\
    \n    @Version\n    @Column(name = \"version\")\n    private Integer FlightDescription.version;\n\
    \n    ...\n}\n```\n\nIt is interesting to note that the primary key generation\
    \ strategy is specified as\nGenerationType.IDENTITY. In GAE, this means that the\
    \ identifier value is not assigned to\nthe FlightDescription entity until the\
    \ associated transaction completes or you explicitly\ncall the flush method of\
    \ EntityManager.\n\nLet's now look at how the flightapp-gae-gwt application ensures\
    \ that only authenticated\nusers can access it.\n\n# Authentication and authorization\
    \ in GAE applications\n\nAs with any other web application, web request security\
    \ constraints for the flightapp-\ngae-gwt application are specified in the web.xml\
    \ file of the application. The following listing\nshows the <security-constraint>\
    \ element of the web.xml file of flightapp-gae-gwt\napplication:\n\n```\n<security-constraint>\n\
    <display-name>...</display-name>\n<web-resource-collection>\n    <web-resource-name>...</web-resource-name>\n\
    \    <url-pattern>*.html</url-pattern>\n</web-resource-collection>\n<auth-constraint>\n\
    \    <role-name>*/<role-name>\n</auth-constraint>\n</security-constraint>\n```"
