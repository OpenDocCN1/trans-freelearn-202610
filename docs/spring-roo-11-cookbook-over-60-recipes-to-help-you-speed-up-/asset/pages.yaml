    \ corresponds to the FlightDescription JPA entity on the server-side) represents\
    \ the payload carried by the FlightDescriptionEvent event type.\n\nAs mentioned\
    \ earlier, in the flightapp_flex application, flightapp_flex_scaffold.mxml file\
