- pgno: 387
  md: 'A simple add-on is meant to add project dependencies in the pom.xml file or
    to add configuration artifacts to the project. For instance, in Chapter 4, Web
    Application Development with Spring Web MVC we saw that Roo installs JSP custom
    tags when scaffolding a Spring Web MVC application. Instead of using Roo-installed
    JSP custom tags, you can create a simple Roo add-on which replaces Roo-installed
    JSP custom tags with the tags that you have tailored based on your application
    requirements.


    An advanced add-on, on the other hand, is required in scenarios in which you want
    to create new Java classes, interfaces, and AspectJ ITD files. For instance, a
    Portlet add-on will scaffold controllers and JSPs from JPA entities.


    In this recipe, we''ll look at the addon create simple command, which creates
    a simple Roo add-on that replaces some of the tags installed by Roo for a Spring
    MVC application with custom tags. We''ll also see how we can use the newly created
    add-on in a Roo project.


    As mentioned in Chapter 1, Getting Started with Spring Roo, Roo is built on top
    of the Apache Felix OSGi container and Roo add-ons represent OSGi bundles. As
    we go through Roo add-on development recipes in this chapter, we''ll touch upon
    some of the OSGi concepts you need to know to understand how add-ons work.


    # ## Getting ready


    Create a new directory C:\\roo-cookbook\\ch07-simple-add-on in your system and
    start the Roo shell from the ch07-simple-add-on directory.


    # ## How to do it...


    The following steps will demonstrate how to develop a simple add-on:


    +   1. Execute the addon create simple command, as shown here, to create a com.roo.addon.mysimple
    add-on project:


    ```

    roo> addon create simple --topLevelPackage com.roo.addon.mysimple

    --description "Mysimple addon" --projectName "Mysimple addon"


    Created ROOT\\pom.xml

    Created ROOT\\readme.txt

    Created ROOT\\legal

    Created ROOT\\legal\\LICENSE.TXT


    Created SRC_MAIN_JAVA\\...\\MysimpleCommands.java

    Created SRC_MAIN_JAVA\\com\\...\\MysimpleOperations.java

    Created SRC_MAIN_JAVA\\...\\MysimpleOperationsImpl.java

    Created SRC_MAIN_JAVA\\...\\MysimplePropertyName.java

    Created ROOT\\src\\main\\assembly\\assembly.xml

    ```'
  merge: -1
  img_proc: true
- pgno: 388
  md: '```

    Created SRC_MAIN_RESOURCES\com\roo\addon\mysimple\info.tagx

    Created SRC_MAIN_RESOURCES\com\roo\addon\mysimple\show.tagx

    ```


    2. Execute the perform eclipse command to create Eclipse IDE-specific configuration
    files:


    ```

    roo> perform eclipse

    ```


    3. Now, import the com.roo.addon.mysimple Eclipse project into the Eclipse IDE.


    # How it works...


    The addon create simple command creates a Roo add-on, which contributes commands
    to the Roo shell and defines operations which are invoked in response to the execution
    of these commands. The package argument specifies the top-level package of the
    add-on and is also used as the name of the add-on project. The following classes
    and interfaces are generated by the addon create simple command, and the <last-part-of-top-level-package>
    refers to the text after the last index of ''.'' in the value of topLevelPackage
    argument. In the case of our example, the topLevelPackage argument value is com.roo.addon.mysimple,
    which makes value of <last-part-of-top-level-package> as mysimple:


    +   * <last-part-of-top-level-package> Commands.java class: defines methods that
    are contributed to the Roo shell by the add-on

    +   * <last-part-of-top-level-package> Operations.java interface: defines methods
    that contains the majority of processing logic corresponding to Roo commands

    +   * <last-part-of-top-level-package> OperationsImpl.java class: implements the
    *Operations.java interface

    +   * <last-part-of-top-level-package> PropertyName.java enum type: defines the
    possible values for an argument passed to a Roo command


    The add-on generated via the addon create simple command gives you the starting
    point for custom add-on development. The generated add-on doesn''t do much, except
    show the classes and interfaces that you''ll typically create in an add-on. You''ll
    need to modify the generated add-on to perform functions specific to your requirements.


    Let''s begin with looking at the Java classes and interfaces (created by addon
    create simple command) which define commands and operations for the com.roo.addon.mysimple
    add-on.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# MysimpleCommands class


    The following code listing shows the MysimpleCommands class, which defines the
    commands that the add-on contributes to the Roo shell:


    ```

    import java.util.logging.Logger;

    import org.apache.felix.scr.annotations.Component;

    import org.apache.felix.scr.annotations.Reference;

    import org.apache.felix.scr.annotations.Service;

    import org.springframework.roo.shell.converters.StaticFieldConverter;


    @Component

    @Service

    public class MysimpleCommands implements CommandMarker {

    private Logger log = Logger.getLogger(getClass().getName());


    @Reference private MysimpleOperations operations;


    @Reference private StaticFieldConverter

    staticFieldConverter;


    protected void activate(ComponentContext context) {

    staticFieldConverter.add(MysimplePropertyName.class);

    }


    protected void deactivate(ComponentContext context) {

    staticFieldConverter.remove(MysimplePropertyName.class);

    }


    ...

    }

    ```


    The following are some of the important points to note about the MysimpleCommands
    class:


    +   MysimpleCommands class defines the Roo commands that the mysimple add-on contributes
    to the Roo shell via @CliCommand annotated methods. We''ll discuss commands contributed
    by a mysimple add-on later in this section. When a Roo command is executed from
    the shell, it results in execution of the corresponding @CliCommand annotated
    method in the MysimpleCommands class.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '+   MsimpleCommands class is annotated with @Component and @Service Apache
    Felix annotations. @Component and @Service annotations have source-level retention
    and are used by Apache Felix Maven SCR Plugin (http://felix.apache.org/site/apache-felix-maven-scr-plugin.html)
    to generate XML configuration required by OSGi''s Service Component Runtime (SCR)-responsible
    for managing the lifecycle of the MsimpleCommands component and registering it
    as a service with OSGi service registry. Annotating MsimpleCommands with @Component
    and @Service annotations ensures that you can access MsimpleCommands object (using
    @Reference Apache Felix annotation) from other Roo add-ons, if required.


    +   MsimpleCommands class implements Roo''s CommandMarker interface. CommandMarker
    is a marker interface, that is, it doesn''t declare any methods. Roo looks for
    components implementing CommandMarker interface to identify components that contribute
    commands to the Roo shell.


    +   @Reference annotation of Apache Felix is like @Autowired annotation of Spring,
    and is used to resolve service dependencies of a component. MsimpleOperations
    and StaticFieldConverter are service dependencies of the MysimpleCommands component.
    MysimpleOperations and StaticFieldConverter services are accessible to MsimpleCommands
    via the @ Reference annotation because the classes implementing MysimpleOperations
    and StaticFieldConverter interfaces are also annotated with @Service and @ Component
    annotations—making them accessible to other Roo add-ons.


    +   MsimpleOperations defines methods that implement the major part of the functionality
    performed by Roo commands contributed by the add-on. These methods are invoked
    by the methods defined in the MsimpleCommands class.


    +   StaticFieldConverter represents a Spring Converter that provides type-safety
    for the argument values that are passed from the Roo shell to the corresponding
    @ CliCommand annotated methods in the MsimpleCommands class.


    +   As Roo add-ons are deployed as OSGi bundles on the underlying Apache Felix
    OSGi container, the activate and deactivate methods represent lifecycle methods
    that are called by the OSGi container to activate and deactivate the Roo add-on,
    respectively. In case of the mysimple add-on, the activate method adds MsimplePropertyName
    enum type to the StaticFieldConverter implementation. In the deactivate method,
    the mysimple add-on removes the MsimplePropertyName enum type from the StaticFieldConverter
    implementation.


    +   Now that we see the big picture about the role played by the MsimpleCommands
    class in mysimple add-on, let''s look at the methods in the MsimpleCommands class
    that register commands with the Roo shell and process these Roo commands when
    they are executed from the Roo shell.'
  merge: -1
  img_proc: true
- pgno: 391
  md: "# Defining Roo commands\n\nThe following code listing shows the methods of\
    \ the MysimpleCommands class that define Roo commands exposed by the mysimple\
    \ add-on:\n\n```\nimport org.springframework.roo.shell.CliCommand;\nimport org.springframework.roo.shell.CliOption;\n\
    ...\n\n@Reference private MysimpleOperations operations;\n\n@CliCommand(value\
    \ = \"say hello\",\n    help = \"Prints welcome message to the Roo shell\")\n\
    public void sayHello(\n    @CliOption(key = \"name\", mandatory = true,\n    \
    \    help = \"State your name\") String name,\n    @CliOption(key = \"countryOfOrigin\"\
    , mandatory = false,\n        help = \"Country of origin\") MysimplePropertyName\
    \ country) {\n    log.info(\"Welcome \" + name + \"!\");\n    ...\n}\n\n@CliCommand(value\
    \ = \"web mvc install tags\",\n    help=\"Replace default Roo MVC tags used for\
    \ scaffolding\")\npublic void installTags() {\n    .installTags();\n}\n```\n\n\
    In the preceding code, we can see that:\n\n+   • The @Reference annotation performs\
    \ autowiring by type and binds the reference to the service that implements the\
    \ MysimpleOperations interface. As MysimpleOperationsImpl implements the MysimpleOperations\
    \ interface, reference to the MysimpleOperationsImpl object is injected into the\
    \ MysimpleCommands instance."
  merge: -1
  img_proc: true
- pgno: 392
  md: '+   @CliCommand is a method-level Roo annotation which identifies methods which
    contribute commands to the Roo shell. The value attribute specifies the name of
    the command that is contributed by the add-on to the Roo shell. For instance,
    the mysimple add-on contributes say hello and web mvc install tags commands to
    the Roo shell. The help attribute specifies the help text that is displayed against
    the command when you execute the help Roo command. When a Roo command is executed
    from the Roo shell, the corresponding @CliCommand annotated method is executed
    by Roo. For instance, if you execute the say hello command from the Roo shell,
    Roo executes the sayHello method of the MysimpleCommands class, which prints a
    welcome message on the Roo shell using Java Logging API. Similarly, if you execute
    the web mvc install tags command, Roo executes the installTags method of the MysimpleCommands
    class. The installTags method invokes the installTags method of the MysimpleOperationsImpl
    class, which copies info.tagx and show.tagx tag files into your Roo project. Later
    in this recipe we''ll look in detail at the installTags method of the MysimpleOperationsImpl
    class.


    +   The @CliOption method-parameter-level Roo annotation specifies the arguments
    that a Roo command accepts. The key attribute specifies the name of the command
    argument, the mandatory attribute specifies if the argument is mandatory or optional,
    and the help attribute specifies the help text associated with the argument. For
    instance, the say hello command accepts two arguments—name and countryOfOrigin.
    The name argument is mandatory and countryOfOrigin is optional.


    The Java type of an argument can be a simple String or it could be a complex type.
    In the case of the say hello command, the name argument is of type String and
    countryOfOrigin is of type MysimplePropertyName. Roo provides converters for common
    Java types, such as String, Date, Enum, Locale, boolean, and so on. You can also
    create your custom converters and register them with Roo as an OSGi service. Roo
    makes use of registered converters to convert the value specified for the argument
    into the Java type expected by the method. In the case of the mysimple add-on,
    Roo converts the value entered for the countryOfOrigin argument of the say hello
    Roo command to the MysimplePropertyName type. We''ll see later in this recipe
    that using MysimplePropertyName (an enum) as the Java type of the countryOfOrigin
    Roo argument provides tab-completion feature for the argument value. We saw earlier
    that the MysimplePropertyName class is added to the StaticFieldConverter instance
    in the activate method. This is to allow StaticFieldConverter to convert the value
    of the countryOfOrigin argument in the say hello Roo command to the MysimplePropertyName
    type.


    Let''s now look at how to make a Roo command unavailable to the Roo shell if certain
    pre-conditions are not met.'
