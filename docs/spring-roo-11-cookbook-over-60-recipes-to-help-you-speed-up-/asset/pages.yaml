- pgno: 71
  md: '# How it works...


    The entity command is used to create a JPA persistent entity. It provides a couple
    of arguments which should be sufficient for most scenarios that you encounter
    while developing the persistence layer of your enterprise application. For instance,
    the mappedSuperclass argument marks the class with the @MapperSuperclass JPA annotation
    (refer to the Creating a mapped superclass recipe in Chapter 3, Advanced JPA Support
    in Spring Roo), the inheritanceType argument adds the @Inheritance JPA annotation
    to let you specify the inheritance strategy followed for persisting classes of
    an inheritance hierarchy, and so on.


    The following table describes arguments that you can pass to the entity command:


    | Argument | Description |

    | :--- | :--- |

    | class | This is a mandatory argument which specifies the fully-qualified name
    of the persistent entity class. You can use the ''~'' symbol while specifying
    the fully-qualified name. |

    | mappedSuperclass | Instructs Roo that the class is a ''mapped superclass''.
    If specified, the generated class is annotated with the @ MappedSuperclass JPA
    annotation. |

    | extends | Identifies the superclass of the entity class. |

    | abstract | Specifies that the generated entity is an abstract entity. |

    | inheritanceType | Specifies the inheritance strategy used for persisting the
    entity. It accepts one of the following values: JOINED, SINGLE_TABLE, and TABLE_PER_CLASS.
    If specified, it adds the @ Inheritance JPA annotation to the entity class. |

    | table | Specifies the name of the table to which the entity is mapped. |

    | identifierField | Specifies the name of the identifier field in the entity.
    By default the name of the identifier field is id. |

    | identifierType | Specifies the Java type of the identifier field. This argument
    can accept values pre-defined by Roo, such as java.lang.Long, java.lang.Double,
    and so on, or it can take a custom Java type.


    If your entity uses a composite primary key, then you''ll use a custom Java type.
    For instance, the Flight entity specifies FlightKey as the identifierType because
    it''s the composite primary key class of the Flight entity. Also note that the
    composite primary key class is auto-generated when you execute the entity command.
    |

    | identifierColumn | Specifies the table column to which the identifier field
    is mapped. If your entity uses a composite primary key, then you must not use
    this argument. |'
  merge: -1
  img_proc: true
- pgno: 72
  md: "| Argument | Description |\n| --- | --- |\n| versionField | Specifies the name\
    \ of the version field in the entity. By default the name of the version field\
    \ is version. |\n| versionColumn | The table column to which the version field\
    \ is mapped. |\n| testAutomatically | Instructs Roo to automatically generate\
    \ integration tests for the entity. In the Creating integration tests for persistent\
    \ entities recipe we'll discuss integration testing of persistent entities in\
    \ detail. |\n| schema, catalog | Arguments for specifying qualifiers for table\
    \ names in the database. These arguments translate into schema and catalog attributes\
    \ of the @Table JPA annotation. |\n| persistenceUnit | Name of the persistence\
    \ unit, defined in the persistence.xml file, with which the persistent entity\
    \ is associated. |\n| transactionManager | [Supported since Spring Roo 1.1.5]\
    \ Name of the transaction manager which is used for the persistent entity. |\n\
    \nYou may have noticed that the field command that we have used for adding fields\
    \ to the Flight JPA entity is the same field command that we had used to add attributes\
    \ to our Java class in the Adding attributes to a Java class recipe in Chapter\
    \ 1, Getting Started with Spring Roo.\n\nThe following code shows the Flight entity\
    \ which was created by the entity command:\n\n```\n@RooJavaBean\n@RooToString\n\
    @RooEntity(identifierType = FlightKey.class, table= \"FLIGHT_TBL\")\npublic class\
    \ Flight {\n    private Integer numOfSeats;\n    private String origin;\n    private\
    \ String destination;\n    ...\n}\n```\n\nIn the Flight.java code, the @RooJavaBean\
    \ and @RooToString annotations are the most commonly used Roo annotations. For\
    \ more information on @RooJavaBean and @RooToString, please refer to the Creating\
    \ a Java class and Adding attributes to a Java class recipes in Chapter 1, Getting\
    \ Started with Spring Roo. The @RooEntity annotation provides details about the\
    \ persistent entity which is the Flight entity in the previous code. The identifierType\
    \ attribute specifies the identifier type of Flight entity, which is FlightKey—the\
    \ composite primary key class of the Flight entity. The table attribute specifies\
    \ the database table to which the Flight JPA entity maps."
  merge: -1
  img_proc: true
- pgno: 73
  md: "> You'll notice that the fields of the entity don't use JPA @Column annotation\
    \ to provide a mapping of the fields to the corresponding FLIGHT_TBL table columns.\
    \ Later in this recipe we'll see how field command can be used to specify table\
    \ column mapping for the fields.\n\nThe @RooEntity annotation introduces a couple\
    \ of persistence related methods and attributes using the ITD file, Flight_Roo_Entity.aj,\
    \ as shown here:\n\n```\nprivileged aspect Flight_Roo_Entity {\n\tdeclare @type:\
    \ Flight: @Entity;\n\n\tdeclare @type: Flight: @Table(name = \"FLIGHT_TBL\");\n\
    \n\t@PersistenceContext\n\ttransient EntityManager Flight.entityManager;\n\n\t\
    @EmbeddedId\n\tprivate FlightKey Flight.id;\n\n\t@Version\n\t@Column(name = \"\
    version\")\n\tprivate Integer Flight.version;\n\n\tpublic FlightKey Flight.getId()\
    \ {\n\t\treturn this.id;\n\t}\n\n\tpublic void Flight.setId(FlightKey id) {\n\t\
    \tthis.id = id;\n\t}\n\n\tpublic Integer Flight.getVersion() {\n\t\treturn this.version;\n\
    \t}\n\n\tpublic void Flight.setVersion(Integer version) {\n\t\tthis.version =\
    \ version;\n\t}\n\n\t...\n}\n```\n\nThe persistence related methods (such as,\
    \ persist, remove, and so on) have been omitted from the previous code listing\
    \ for brevity. Auto-generated persistence related methods are discussed in the\
    \ Controlling auto-generated methods of persistent entities recipe. As you can\
    \ see, Spring Roo generates the necessary code to create a fully-functional JPA\
    \ entity."
