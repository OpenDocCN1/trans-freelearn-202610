  md: 'Flex Addon doesn''t provide any support for controlling the methods that form
    a part of the Spring-managed remoting destinations. For instance, you can''t control
    the methods that are part of the `FlightDescriptionService_Roo_Service.aj` file
    using `@RooFlexScaffold` annotation.


    If you want that a method in the Spring-managed remoting destination is not accessible
    to Flex clients, then all you need to do is to either perform push-in refactoring
    or define the method in the corresponding Java class and add the `@RemotingExclude`
    annotation of Spring to the method.


    Spring Roo makes use of JSR 303 annotations specified in the JPA entity to add
    Flex validators in the MXML files. For instance, if a JPA entity field specifies
    `@NotNull` JSR 303 annotation then Roo adds a Flex `StringValidator` or `NumberValidator`
    that checks that the field on the form is not blank. Note that Flex addon support
    for JSR 303 annotations is limited.


