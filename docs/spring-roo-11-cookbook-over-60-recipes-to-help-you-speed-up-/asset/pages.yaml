    # Creating application artifacts from Roo script


    In some scenarios, you may want to generate complete enterprise application skeleton
    by feeding a set of Roo commands to Spring Roo from a text file. To address such
    scenarios Spring Roo provides the `script` command, which allows you to execute
    commands contained in a text file. The convention is to name the script file containing
    commands with a `.roo` extension.'
