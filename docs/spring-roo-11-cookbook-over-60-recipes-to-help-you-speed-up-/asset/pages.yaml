  md: '# # Creating a mapped superclass


    In this recipe, we''ll look at how to create an entity which inherits a *mapped
    superclass*. The fields of a mapped superclass are stored into the table to which
    the inheriting entity is mapped. The mapped superclass itself is *not* mapped
    to any table. In this recipe, we''ll create the *Flight* entity, which extends
    the *AuditFields* class. The *AuditFields* class represents a *mapped superclass*;
    the fields of *AuditFields* are stored into the table to which the *Flight* entity
    is mapped.


    The following figure shows the relationship between the *Flight* entity and the
    *AuditFields* mapped superclass:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_129_0.png)


    # ## Getting ready


    Exit the Roo shell and delete the contents of the `C:\roo-cookbook\ch03-recipes`
    directory.


    Start the Roo shell from the `C:\roo-cookbook\ch03-recipes` directory.


    Execute the `ch03_jpa_setup.roo` script which creates the *flight-app* Roo project,
    sets up Hibernate as persistence provider, and configures MySQL as the database
    for the application. If you are using a different database than MySQL or your
    connection settings are different than what is specified in the script, then modify
    the script accordingly.


    # ## How to do it...


    To create an entity which inherits a *mapped superclass*, follow the given steps:


    +   1. Create the *AuditFields* class using the `entity` command and add fields
    to it:


    ```

    .. roo> entity --class ~.domain.AuditFields --mappedSuperclass

    ```'
  merge: -1
  img_proc: true
- pgno: 130
  md: '```

    ~.domain.AuditFields roo> field date --type java.util.Date

    ~.domain.AuditFields roo> --fieldName createdDate

    ~.domain.AuditFields roo> field date --type java.util.Date

    ~.domain.AuditFields roo> --fieldName modifiedDate

    ~.domain.AuditFields roo> field string --fieldName createdBy

    ~.domain.AuditFields roo> field string --fieldName modifiedBy

    ```


    +   2. Create the Flight entity using the entity command and add fields to it:


    ```

    .. roo> entity --class ~.domain.Flight --extends ~.domain.AuditFields --table
    FLIGHT_TBL

    ~.domain.Flight roo> field date --type java.util.Date --fieldName departureDate
    --column DEPARTURE_DATE

    ~.domain.Flight roo> field date --type java.util.Date --fieldName arrivalDate
    --column ARRIVAL_DATE

    ```


    # How it works...


    The mappedSuperclass argument of the entity command is responsible for creating
    a mapped superclass. It''s a flag type argument; if present, it indicates that
    the generated class must be annotated with the @MappedSuperclass JPA annotation.
    The following code shows the relevant annotations of the AuditFields mapped superclass,
    as generated by the entity command:


    ```

    @RooJavaBean

    @RooToString

    @RooEntity(mappedSuperclass = true)

    public class AuditFields { ... }

    ```


    As shown in this code, the AuditFields class is annotated with the @RooEntity
    annotation. As we saw earlier, the @RooEntity annotation triggers Roo to generate
    a *_Roo_Entity.aj AspectJ ITD file corresponding to the AuditFields class. The
    mappedSuperclass attribute of the @RooEntity annotation instructs Roo to add a
    declaration in the corresponding *_Roo_Entity.aj that annotates the AuditFields
    class with the @MappedSuperclass annotation (instead of the @Entity JPA annotation).


    When an entity class extends a mapped superclass, the Roo generates a *_Roo_Entity.aj
    AspectJ ITD file corresponding to the mapped superclass and defines an identifier
    field (annotated with @Id JPA annotation), along with methods such as persist,
    merge, refresh, and so on. (that we saw in the Creating persistent entities recipe
    of Chapter 2). In this case, the inheriting entity''s *_Roo_Entity.aj file only
    defines the static count and finder methods for the entity.'
  merge: -1
  img_proc: true
