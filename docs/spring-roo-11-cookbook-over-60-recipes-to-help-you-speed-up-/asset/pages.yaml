    Let''s now look at how web request security is configured for the Flight Booking
    application.


    # Configuring web request security


    The following `<http>` element of `security` namespace shows how web request security
    is configured in the applicationContext-security.xml file of the flightapp-web
    project:


    ```

    ```xml

    <http auto-config="true" use-expressions="true">

    <access-denied-handler error-page="/accessdenied" />

    <form-login ... />

    <logout logout-url="/resources/j_spring_security_logout" />

    <intercept-url pattern="/flights/**"

    access="hasRole(''ROLE_ADMIN_USER'')" />

    <intercept-url pattern="/flightdescriptions/**"

    access="hasRole(''ROLE_ADMIN_USER'')" />

    <intercept-url pattern="/bookings/**"

    access="hasAnyRole(''ROLE_APP_USER'',''ROLE_ADMIN_USER'')" />

    <intercept-url pattern="/accessdenied/**"

    access="hasAnyRole(''ROLE_APP_USER'', ''ROLE_ADMIN_USER'')" />

    </http>

    ```

    ```


    As in the previous recipe, we discussed the `<http>` element of the Roo-generated
    applicationContext-security.xml file; but here we''ll only focus on configuration
    elements specifically added for meeting flightapp-web application''s web security
    requirements. In the given code, the following are the elements that we added
    to configure web request security for the Flight Booking application:


    +   - `<access-denied-handler>`: It configures the error page that is shown to
    the user if access is denied to the requested page. The error-page attribute specifies
    the URL of the error page. The `<mvc:view-controller path="/accessdenied"/>` entry
    in webmvc-config.xml configures ParameterizableViewController, responsible for
    rendering the access denied page—accessdenied.jspx in the `/WEB-INF/views` directory.'
