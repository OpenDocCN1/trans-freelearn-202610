- pgno: 209
  md: "As the output from the `web mvc install view` command suggests, the following\
    \ actions are taken by Spring Roo in response to executing the command:\n\n+ \
    \  - Creates a /static/views directory inside the /WEB-INF/views folder. Roo uses\
    \ the value of the path argument to determine the directory to create.\n\n+  \
    \ - Creates a help.jspx file inside the /WEB-INF/views/static/views directory.\
    \ The value of the viewName argument is used as the name of the JSPX file.\n\n\
    +   - Adds a property with value Help to the application.properties, that is,\
    \ the value of the title argument is used as the value of the newly added property.\
    \ The property is used by menu.jspx to show a **Help** menu option. The **Help**\
    \ menu option allows access to the newly created help.jspx view.\n\n+   - Creates\
    \ a /WEB-INF/views/static/views/views.xml tiles definitions XML file, containing\
    \ a single tiles definition for showing the help.jspx view, as shown here:\n\n\
