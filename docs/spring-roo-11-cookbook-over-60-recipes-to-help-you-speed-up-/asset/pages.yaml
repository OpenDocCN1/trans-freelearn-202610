    \ json) {\n    return new JSONDeserializer<Flight>().use(null,\n    Flight.class).deserialize(json);\n\
    }\npublic static String Flight.toJsonArray(\n    Collection<Flight> collection)\
    \ {\n    ...\n}\npublic static Collection<Flight>\n    Flight.fromJsonArrayToFlights(String\
    \ json) {\n    ...\n}\n}\n```\n\nIn the given code listing, Roo makes use of the\
    \ Flexjson library to incorporate support for serializing and deserializing JSON\
    \ documents. The auto-generated JSON methods that are defined in Flight_Roo_Json.aj\
    \ are:\n\n+   - toJson: Converts the current Flight object into a JSON document\n\
    +   - fromJsonToFlight: Converts the JSON document passed as an argument into\
