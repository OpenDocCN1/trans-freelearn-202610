    # How it works...


    GAE datastore is a non-relational database in which relationships between entities
    are modeled as either owned or unowned. An owned relationship is based on the
    concept of parent-child relationship, where the child entity instances cannot
    exist without a parent. In an unowned relationship, entity instances can exist
    irrespective of their relationship with other entities.'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'An owned relationship can be best visualized as a tree structure in which the
    root of the tree is an entity instance, which is the ultimate parent for all the
    entities. The following figure shows an owned relationship example in which FlightDescription
    is the root entity with Flight entity instances as its child entities, and Booking
    entity instances are the child of the Flight entity.


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_358_0.png)


    In the given figure, FlightDescription (NYC-DELHI-1200) is at the root of the
    tree. The Flight instances (FLT-100, FLT-200, FLT-300, FLT-400) are children of
    the FlightDescription (NYC-DELHI-1200) instance. The Booking (ashish, greg) instances
    are children of the Flight (FLT-400) instance. If such a parent-child relationship
    is defined in the entities stored in the App Engine datastore, then these entities
    are referred to as part of the same entity group. You can think of an entity group
    as a tree with a root entity at the top and this root entity doesn’t have any
    parents. In this figure, FlightDescription (NYC-DELHI-1200) represents the root
    entity. The other important point about owned relationships is that except the
    root entity, all other entities in the entity group cannot be created without
    a parent. For example, Flight entity instance cannot exist without a FlightDescription
    instance and Booking instance cannot exist without a Flight instance.


    In GAE, creating an owned relationship puts a restriction on the type of primary
    key that you can define for the child entity. The reason for this is that the
    child entity instance needs to know its parent in the entity group apart from
    its own entity ID. The type of primary key of the child entity in an owned relationship
    is either com.google.appengine.api.datastore.Key or encoded String form of com.google.appengine.api.datastore.Key.
    GAE provides a KeyFactory class (discussed later in this recipe), which you can
    use to create a Key instance or to convert a Key instance value to String (referred
    to as encoded form of the Key) and vice versa.'
  merge: -1
  img_proc: true
