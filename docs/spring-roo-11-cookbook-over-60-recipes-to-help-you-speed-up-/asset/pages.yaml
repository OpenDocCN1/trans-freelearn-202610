- pgno: 310
  md: '# # Sending and receiving JMS messages


    Spring Roo provides support for developing messaging applications based on JMS
    (Java Message Service) API. As of Spring Roo 1.1.5, the only JMS provider supported
    by Roo is embedded ActiveMQ(http://activemq.apache.org/); it is configured in
    the same JVM as the Java application accessing it.


    In this recipe, we''ll look at how Spring Roo supports sending and receiving JMS
    messages using embedded ActiveMQ.


    # ## Getting ready


    Create a sub-directory ch06-jms inside the C:\roo-cookbook directory.


    Copy the ch06_web_app.roo script into the ch06-jms directory.


    Execute the ch06_web_app.roo script that creates flightapp-web Roo project, sets
    up Hibernate as persistence provider, configures MySQL as the database for the
    application, creates Flight and FlightDescription JPA entities, and defines many-to-one
    relationship between Flight and FlightDescription entities. Also, script makes
    use of controller all command to scaffold a Spring Web MVC application from JPA
    entities. If you are using a different database than MySQL or your connection
    settings are different than what is specified in the script, then modify the script
    accordingly.


    Start the Roo shell from the C:\roo-cookbook\ch06-jms directory.


    In this recipe, we''ll look at how to send the newly created Flight instance''s
    attributes as a JMS message to a queue destination and use an asynchronous message
    listener for reading the JMS message from the queue.


    # ## How to do it...


    To set up flight-app as a JMS messaging application, follow the steps given here:


    +   1. Execute the jms setup command to create a new Spring application context
    XML file for the flightapp-web application, which configures embedded ActiveMQ
    as JMS provider, a JMS destination queue named myDestination, and Spring''s JmsTemplate
    for sending JMS messages, as shown here:


    ```

    .. roo> jms setup --provider ACTIVEMQ_IN_MEMORY --destinationName myDestination
    --destinationType QUEUE

    ```


    Created ..\META-INF\spring\applicationContext-jms.xml ...


    Updated ROOT\pom.xml [Added dependency org.apache.activemq:activemq-core:5.4.2]'
  merge: -1
  img_proc: true
- pgno: 311
  md: '2. Execute the field jms template command to inject Spring''s JmsTemplate into
    FlightController.java. The FlightController makes use of JmsTemplate to send JMS
    messages to embedded ActiveMQ configured in the first step.


    ```

    .. roo> field jms template --class ~.web.FlightController

