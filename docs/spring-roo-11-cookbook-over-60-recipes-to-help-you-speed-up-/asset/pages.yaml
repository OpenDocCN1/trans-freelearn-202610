    \ | The MXML file that shows the form for creating entity instances. In the `flightapp_flex`\
    \ project, `FlightForm.mxml` and `FlightDescriptionForm.mxml` files show the form\
    \ for creating Flight and FlightDescription JPA entity instances, respectively.\
    \ |\n\nThe following code shows the `FlightDescriptionEvent.as` ActionScript class\
