    # How it works...


    Spring Roo provides multiple field commands for adding different types of attributes
    to the Java class. For instance, field string is for adding a String type field,
    field date is for adding a java.util.Date or java.util.Calendar type field, field
    other is for adding a field of custom Java type, and so on.


    > Some of the field commands, like field set and field reference, apply only to
    JPA entities, and are therefore not applicable to every Java class that you create
    in your Roo project. Also, field commands accept certain arguments, which make
    sense only if the target Java class is a JPA entity. We will discuss JPA entity
    specific field commands in Chapter 2.


    The field string, field other, and field number commands accept the name argument,
    which identifies the name of the attribute to be added to the Java class. The
    field other and field number also require the type of the attribute.


