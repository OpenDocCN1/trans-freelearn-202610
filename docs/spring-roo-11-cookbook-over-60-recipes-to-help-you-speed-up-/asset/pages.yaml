- pgno: 47
  md: "# There's more...\n\nIf you want Roo to manage the creation of the `toString`\
    \ method and getter and setter methods for attributes of the class, it is recommended\
    \ that you use the `rooAnnotations` argument in the `class` command.\n\n> Roo\
    \ annotations have source-level retention, which means that your application is\
    \ not dependent on Roo annotations at runtime.\n\n# Moving existing Spring projects\
    \ to use Spring Roo\n\nIf you are moving your existing Spring-based project to\
    \ Roo, you can make out from this recipe that you should do the following:\n\n\
    +   1. Remove the `toString` method and add the `@RooToString` annotation to all\
    \ your existing classes.\n+   2. Remove the implementation of `Serializable` interfaces\
    \ from classes and instead annotate the classes with the `@RooSerializable` annotation.\n\
    +   3. Remove getters and setters methods from your Java classes and instead annotate\
    \ the classes with the `@RooJavaBean` annotation.\n\n> **Registering the service\
    \ class with Spring's application context**\n> \n> Using Spring Roo you can't\
    \ create a service class, which is automatically registered with Spring's application\
    \ context; therefore, if you want your service class to be auto-registered, then\
    \ annotate it with the `@Service` annotation. The service class will be registered\
    \ with Spring's application context as long as it is inside the top-level directory\
    \ (for more information refer to the `<component-scan>` element, described in\
    \ the *Creating a Roo project* recipe).\n\n# @RooToString—customizing the name\
    \ of the toString method\n\nWe saw that using the `@RooToString` annotation creates\
    \ a method named `toString` in the corresponding AspectJ ITD file. You can use\
    \ the `toStringMethod` attribute of the `@RooToString` annotation to specify a\
    \ custom name for the `toString` method, as shown here:\n\n```\n`@RooToString(toStringMethod\
    \ = \"myToString\")\npublic class MyCustomClass { private String myAttr; }`\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 48
  md: "In the given code, the toStringMethod attribute specifies myToString as the\
    \ name of the method to act as the toString method for the MyCustomClass. The\
    \ ITD file corresponding to the @RooToString annotation: MyCustomClass_Roo_ToString.aj\
    \ will now create a method similar to toString but with the name myToString, as\
    \ shown here:\n\n```\nprivileged aspect MyCustomClass_Roo_ToString\n{\n    public\
    \ String MyCustomClass.myToString ()\n    {\n        StringBuilder sb = new StringBuilder();\n\
    \        sb.append(\"MyAttr: \" ).append(getMyAttr());\n        return sb.toString();\n\
    \    }\n}\n```\n\n# @RooToString—excluding properties from the toString method\n\
    \nIn some cases, you may want to restrict properties from being part of the auto-generated\
    \ toString method. The @RooToString annotation provides an excludeFields attribute,\
    \ which lets you specify an array of attributes that should be excluded from the\
    \ auto-generated toString method, as shown here:\n\n```\n@RooToString(excludeFields={\"\
    someAttribute\"})\npublic class MyCustomClass { ... }\n```\n\nIn this code, the\
    \ @RooToString annotation instructs that the toString method of the MyCustomClass\
    \ class must not include the someAttribute property.\n\n# See also\n\n+   - The\
    \ Adding attributes to a Java class recipe explains how you can add attributes\
    \ to a Java class using roo\n+   - The Creating a Java interface recipe explains\
    \ how you can create a Java interface from the Roo shell\n\n# Adding attributes\
    \ to a Java class\n\nYou can add attributes to your Java classes in your Roo project,\
    \ either from your IDE or by using the field commands of Spring Roo. There are\
    \ advantages in adding attributes using Roo as opposed to using an IDE, which\
    \ we will see in this recipe. The following table shows the name and type of attributes\
    \ that we will add to a Passenger class in the package sample. roo.flightapp.domain\
    \ of the flight-app project:"
  merge: -1
  img_proc: true
