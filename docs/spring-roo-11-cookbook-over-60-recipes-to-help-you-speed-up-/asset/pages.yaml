  md: 'The metadata dependencies specified in the activate method should be unregistered
    in the deactivate method of the metadata provider. The metadata dependencies are
    unregistered using the deregisterDependency method of the MetadataDependencyRegistry
    instance, as shown here for MyadvancedMetadataProvider:


    ```

    protected void deactivate(ComponentContext context) {

    metadataDependencyRegistry.

    deregisterDependency(PhysicalTypeIdentifier.

    getMetadataIdentifierType(), getProvidesType()));

    ... }

    ```


    # Registering and unregistering metadata creation trigger


    Metadata dependency registration ensures that downstream dependencies of a metadata
    are notified when changes occur in the upstream dependencies. To specify what
    triggers creation of metadata, metadata provider makes use of the addMetadataTrigger
    method of the AbstractItdMetadataProvider class, as shown here for MyadvancedMetadataProvider:


    ```

    protected void activate(ComponentContext context) {

    metadataDependencyRegistry.

    registerDependency(PhysicalTypeIdentifier.

    getMetadataIdentifierType(), getProvidesType()));

    addMetadataTrigger(

    new JavaType(RooMyadvanced.class.getName()));

    }

    ```


    In the preceding code, the addMetadataTrigger method accepts RooMyadvanced Java
    type. It means that whenever a Java type is annotated with @RooMyadvanced annotation,
    MyadvancedMetadataProvider will create an instance of MyadvancedMetadata.


    The metadata trigger is removed by the metadata provider in the deactivate method,
    as shown here for the MyadvancedMetadataProvider class:


    ```

    protected void deactivate(ComponentContext context) {

    ... removeMetadataTrigger(

    new JavaType(RooMyadvanced.class.getName()));

    }

    ```


    Let''s now look at how Spring Roo works behind the scenes to generate code when
    a Java type is annotated with the @RooMyadvanced annotation.'
  merge: -1
