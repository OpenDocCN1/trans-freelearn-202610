- pgno: 373
  md: 'For instance, the `Flight` class in `flightapp-web` project contains the `flightDescription`
    relationship field of type `FlightDescription`, which is added to `SolrInputDocument`
    with name `flight.flightdescription_t` (refer to the `Flight_Roo_SolrSearch.aj`
    AspectJ ITD file).


    You might be wondering, why Roo doesn''t add JPA entity fields with their exact
    name in the `SolrInputDocument`. Here is a short description of how Solr works:


    `SolrInputDocument` represents a document that you add to Solr search server.
    The document consists of fields and you need to tell Solr search server, which
    of these fields should be **indexed**. It is important to note that if a field
    is *not* indexed, then you can''t search or sort documents based on that field.
    You tell the Solr search server, which fields of a document should be indexed
    by specifying the fields in `schema.xml` file located in `SOLR_HOME\example\solr\conf`
    directory. Solr has the concept of Dynamic Fields, wherein if a field follows
    a standard naming convention, then it is automatically indexed by Solr search
    server. The following XML fragment from the `schema.xml` file defines the dynamic
    fields that will be automatically indexed by Solr:


    ```

    `<dynamicField name="*_s" type="string" indexed="true" stored="true"/>

    <dynamicField name="*_l" type="slong" indexed="true" stored="true"/>

    <dynamicField name="*_t" type="text" indexed="true" stored="true"/>

    <dynamicField name="*_f" type="sfloat" indexed="true" stored="true"/>`

    ```


    The given XML fragment instructs Solr to index any field that matches the pattern
    `*_s`, `*_l`, `*_t`, or `*_f`. So, now you can see the link between Roo generated
    field names and the dynamic fields defined by Solr.


    The indexFlightDescriptions method also adds an `id` field name to the `SolrInputDocument`.
    It is mandatory for any SolrInputDocument to contain a field named id, which *uniquely*
    identifies the document in Solr index. By default, Roo sets the value of id field
    to "flightdescription_" + flightdescription.getId(). We''ll see later in this
    section that this id field value is used for deleting the document from Solr index.


    The indexFlightDescriptions method also adds an extra field, flightdescription_solrsummary_t,
    in SolrInputDocument so that it can be used to search all documents that have
    been indexed by Solr for FlightDescription JPA entity. Similarly, the indexFlightDescriptions
    method of Flight_Roo_SolrSearch.aj AspectJ ITD adds flight_solrsummary_t field
    in SolrInputDocument to allow searching for documents indexed by Solr for the
    Flight JPA entity.'
