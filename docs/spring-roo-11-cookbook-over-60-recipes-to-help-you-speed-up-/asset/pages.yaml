  md: 'Spring Roo doesn''t provide commands to remove or modify an attribute. So,
    if you want to remove or modify an existing attribute of a Java class, you can
    do so using your IDE. Spring Roo will take care of removing or modifying the attribute
    in corresponding AspectJ ITD files.


    # @RooJavaBean—controlling the generation of getter and setter methods


    We saw that using @RooJavaBean annotation introduces getter and setter methods
    for all the fields in a class. In some cases, you may want to control the generation
    of these getter and setter methods. @RooJavaBean allows you to do so using the
    gettersByDefault and settersByDefault attributes. These attributes specify whether
    getter and setter methods should be generated by default or not. The default value
    of these attributes is true, which means the @RooJavaBean annotation will create
    getter and setter methods in the corresponding *_Roo_JavaBean.aj ITD for all the
    fields defined in the class.


    If you specify the value of both gettersByDefault and settersByDefault elements
    as false, then Spring Roo deletes the corresponding AspectJ ITD file.


    # See also


    +   - The Creating a Java interface recipe shows how to create a Java interface
    using Spring Roo

    +   - The Adding fields to persistent entities recipe of Chapter 2, Persisting
    Objects Using JPA shows the additional arguments that are available in field commands


    # Creating a Java interface


    You can use Spring Roo''s interface command or an IDE to create a Java interface.
    In this recipe, we will see how we can create an interface named FlightServiceIntf.


    # Getting ready


    Start the Roo shell from the C:\roo-cookbook\ch01-recipe directory, which contains
    the flight-app Roo project.'
