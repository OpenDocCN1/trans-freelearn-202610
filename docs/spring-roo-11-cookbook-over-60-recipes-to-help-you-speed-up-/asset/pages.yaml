    which you need to publish to a public key server.


    +   4. Now, publish the public key using GnuPG''s send-keys command, as shown
    here:


    ```

    gpg --send-keys --keyserver hkp://pgp.mit.edu <public-key-id>

    ```


    Here, <public-key-id> is the sec key ID that was listed when you executed the
    list-secret-keys command. In my case, <public-key-id> is BFB28A4D.


    # How it works...


    We saw that GnuPG is used to create a key-pair and publish the public PGP key
    to a public key server. As most public key servers share keys, you don''t need
    to send keys to all public key servers.'
