- pgno: 46
  md: "The FlightService_Roo_Serializable.aj AspectJ ITD defines that the FlightService\
    \ class implements the java.io.Serializable interface, as shown here:\n\n```\n\
    package sample.roo.flightapp.service;\n\nimport java.io.Serializable;\n\nprivileged\
    \ aspect FlightService_Roo_Serializable\n{\n    declare parents: FlightService\
    \ implements Serializable;\n\nprivate static final long FlightService.serialVersionUID\n\
    \ = 5059552858884348572L\n\n}\n```\n\nIn the given code, the declare parents:\
    \ FlightService implements Serializable statement declares that the FlightService\
    \ class implements the java.io.Serializable interface. The following figure summarizes\
    \ what this declaration means:\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_46_0.png)\n\
    \nThe statement private static final long FlightService.serialVersionUID = 5059552858884348572L,\
    \ adds a serialVersionUID field (it's the field which you define if your class\
    \ implements the Serializable interface) to the FlightService class that contains\
    \ it."
