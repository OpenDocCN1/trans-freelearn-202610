    # Adding search capability to your domain model with Solr


    Apache Solr is an open-source search platform built on top of the Apache Lucene
    search engine library. Spring Roo’s Solr add-on provides support for integrating
    the Roo-generated domain model with Solr platform. In this recipe, we’ll look
    at how Roo makes use of SolrJ Java client library to add domain model data into
    Solr server for indexing and to search domain model data based on user supplied
    query parameters.


    # Getting ready


    To see Roo’s support for Solr in action, you need to download and run the Solr
    server, as described here:


    +   1. Download the Solr server version 1.4.0 ZIP file from Solr website and unzip
    the bundle into a directory. Let''s call the unzipped directory as SOLR_HOME.

    +   2. Go to the SOLR_HOME\example directory and start Solr server:

    +   C:...\apache-solr-1.4.0\example> java -jar start.jar

    +   3. Open the web browser and verify that Solr server has successfully started
    by going to the following URL: http://localhost:8983/solr/admin/


    Now, create a sub-directory ch06-solr inside C:\roo-cookbook directory, copy ch06_web_app.roo
    script and start Roo shell from C:\roo-cookbook\ch06-solr.


    # How to do it...


    Follow these step to add search capability:


    +   1. Execute the ch06_solr.roo script, as shown here:

    +   roo> script --file ch06_web_app.roo'
