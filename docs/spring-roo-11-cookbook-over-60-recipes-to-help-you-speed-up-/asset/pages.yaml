    The annotateType method accepts a JavaType argument. The JavaType argument represents
    the Java type that you specified as the value of the type argument of the myadvanced
    add command. The annotateType method performs the following actions to annotate
    the JavaType argument with the @ RooMyadvanced annotation:


    +   - Obtains metadata identification string for the JavaType on which the annotation
    needs to be applied. This is achieved by using the findIdentifier method of the
    PhysicalTypeMetadataProvider class of Roo.


    Let''s say that the myadvanced add command is executed as shown here:


    ```

    ... roo> myadvanced add --type sample.roo.flightapp.domain.Flight

