    +   Created SRC_MAIN_WEBAPP\WEB-INF\tags\menu\category.tagx

    +   Created SRC_MAIN_WEBAPP\WEB-INF\views\customer\views.xml


    +   3. As many dependencies were added to the `pom.xml` file of the `flight-app`
    project during processing of the `web mvc setup` command, execute the `perform
    eclipse` command of Roo to update the `.classpath` file of the Eclipse project:

