    In this class diagram, the Ginjector interface is part of GIN API. The ScaffoldInjector
    and DesktopInjector are generated by Roo. The following are the important points
    to notice in the above class diagram:


    +   - ScaffoldInjector extends the Ginjector interface and defines a single method
    getScaffoldApp, which returns an instance of type ScaffoldApp.


    +   - ScaffoldApp is a Roo-generated class that defines the contract for initializing
    the GWT application for both the desktop and mobile browser.


    +   - The DesktopInjector extends ScaffoldInjector and overrides the getScaffoldApp
    method to return ScaffoldDestopApp. This change in return type is perfectly legal
    because ScaffoldDesktopApp is a subclass of the ScaffoldApp class.


    +   - ScaffoldDesktopApp is responsible for creating the web UI, tailored for
    the desktop web browser, and performing all the initialization work before the
    application is put into service. Similarly, ScaffoldMobileApp is responsible for
    creating the web UI for the mobile browser.


    GIN''s Ginjector interface is at the heart of the GIN framework and is responsible
    for performing dependency injection. To use Ginjector, a GWT application must
    do the following:


    +   - Define an interface that extends Ginjector—this is the DesktopInjector interface
    in the case of flightapp-gwt. The GWT compiler is responsible for providing the
    implementation of this interface.'
