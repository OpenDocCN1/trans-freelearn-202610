    +   - Refer to the Creating new ''data on demand'' for testing entities recipe
    to see how you can create seed data for an entity

    +   - Refer to the Executing persistent entities tests recipe to see how integration
    and mock tests of entities are executed using Spring Roo

    +   - Refer to the Creating mock tests for persistent entities recipe to create
    mock static methods defined in entities


