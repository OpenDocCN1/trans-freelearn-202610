    \ Click the **Connect** button to log in to the H2 Console. This will automatically\
    \ create the `myflightappdb` in H2 database.\n\n+   2. After logging in to H2\
    \ Console, you will see the `myflightappdb` details, as shown here:\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_429_0.png)\n\
    \nNow, paste the following SQL statement in the text area shown in the given screenshot\
