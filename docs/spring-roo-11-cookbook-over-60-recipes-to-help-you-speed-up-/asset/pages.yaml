    # ## Dealing with entity proxy-specific processing


    Roo creates an abstract generic class, ApplicationEntityTypesProcessor<T>, for
    dealing with different entity proxies in the scaffolded GWT application. ApplicationEntityTypesProcessor<T>
    is implemented by classes that perform a functionality based on entity proxy type.
    The following code listing shows the ApplicationEntityTypesProcessor<T> class
    of the flightapp-gwt project:


    ```

    ApplicationEntityTypesProcessor.java

    package sample.roo.flightapp.client.managed.request;


    public abstract class ApplicationEntityTypesProcessor<T> {


    private final T defaultValue;


    private T result;


    private static void process(

    ApplicationEntityTypesProcessor<?> processor,

    Class<?> clazz) {

    if (FlightProxy.class.equals(clazz)) {

