- pgno: 67
  md: '# How it works...


    The database properties list command is processed by the JPA add-on. Instead of
    using the database properties list command you can use the properties list command
    (refer to the Viewing properties defined in a properties file recipe of Chapter
    1), which shows the properties contained in a properties file. The end result
    of using either of the commands is the same, the only difference being that you
    need to specify the name and path arguments in the properties list command to
    refer to the database.properties file.


    # There''s more...


    Instead of using Spring Roo, you can also view the database.properties file using
    an IDE like Eclipse or STS. The whole idea of using Spring Roo''s database properties
    list command is to allow developers to look at the database properties without
    switching to the IDE.


    # See also


    +   The next recipe, Managing database configuration properties, shows how you
    can add, remove, and modify properties defined in the database.properties file
    of your Roo project.


    # Managing database configuration properties


    In the previous recipe, we saw how we can view the database configuration properties
    defined in the database.properties file using the database properties list command.
    In this recipe, we''ll look at how we can add, modify, or remove properties from
    the database.properties file using the database properties set and database properties
    remove commands.


    The following table shows the properties that we''ll add, modify, and remove from
    the database.properties file:


    | Property | Action |

    |---|---|

    | database.username | Modified to database.username = root |

    | database.password | Modified to database.password = asarin |

    | database.url = jdbc\:mysql\://localhost\:3306/myFlightAppDB | Removed from database.properties
    |

    | database.modified.url = jdbc\:mysql\://localhost\:3406/myFlightAppDB | Added
    to database.properties |

    | database.initialPoolSize=10 | Added to database.properties |'
