    static/views/help\">\n        <put-attribute name=\"body\"\n            value=\"\
    /WEB-INF/views/static/views/help.jspx\"/>\n    </definition>\n</tiles-definitions>\n\
    ```\n```\n\n+   - Adds a <view-controller> element to the webmvc-config.xml to\
    \ allow access to the help.jspx view without requiring to write a controller,\
