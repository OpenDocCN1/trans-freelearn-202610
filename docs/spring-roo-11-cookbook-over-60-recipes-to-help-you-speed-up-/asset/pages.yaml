- pgno: 252
  md: '# Activities and places


    Roo-generated GWT code consists of many base classes and interfaces that attempt
    to provide a consistent approach to performing CRUD operations on JPA entities.
    In this section, we''ll look at some of the important classes and interfaces and
    concepts which will give you a starting point to understand the Roo-generated
    GWT code.


    The Roo-generated GWT web UI consists of a **Master display region** and a **Detail
    display region**. The **Master display region** shows the list of entities that
    can be managed from the web UI. The widget that shows **Flight** and **FlightDescriptions**
    in a list represents the **Master display region**. The **Detail display region**
    shows activities that can be performed on each of the entities displayed in the
    **Master display region**. The region that shows the list of **Flight** or **FlightDescription**
    entity instances in the system, the form to create a new entity instance, the
    form to edit an entity instance, and so on, represents the **Detail display region**.


    The following figure shows the **Master display region** and **Detail display
    region** in the flightapp-gwt application:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_252_0.png)


    Let''s now look at some of the examples of activities, places and views, in the
    Roo-generated flightapp-gwt application.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Activities are responsible for driving views and handling events generated
    by user interaction in a display region. It is created by implementing GWT''s
    Activity interface or by extending GWT''s AbstractActivity abstract class. The
    following diagram shows some of the activities that were generated by Roo for
    flightapp-gwt application:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_253_0.png)


    This diagram shows that *FlightDescriptionDetailsActivity* and *FlightDetailsActivity*
    inherit from the *AbstractActivity* abstract class, and *FlightDescriptionListActivity*
    and *FlightListActivity* classes implement the *Activity* interface. <entity-name>DetailsActivity
    activities drive views and manage user interactions when an existing entity instance''s
    details are displayed in the **Detail display region**. <entity-name>ListActivity
    activities drive views and manage user interactions when the list of entity instances
    are displayed in the **Detail display region**.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'Places are locations within the display region that can be translated into
    a URL. An Activity is mapped to a place (changeable into a URL), which makes Activities
    accessible via URL. A place is created by extending GWT''s Place abstract class.
    The place implementation class also defines how the place instance can be translated
    into a URL. ProxyPlace and ProxyListPlace classes generated by Roo in flightapp-gwt
    are examples of places in GWT. The following figure shows the attributes defined
    by the ProxyPlace and ProxyListPlace classes:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_254_0.png)


    The ProxyPlace corresponds to a place in the ''detail'' display region and ProxyListPlace
    corresponds to a place in the Master display region. When a ProxyPlace instance
    is created, it knows the EntityProxy for which the place instance is being created
    (identified by proxyClass attribute), the operation to be performed (identified
    by operation attribute) on the EntityProxy, and the unique identifier (identified
    by proxyId attribute of type EntityProxyId) of the EntityProxy. Similarly, when
    ProxyListPlace is created, it knows about the EntityProxy for which the place
    instance is being created (identified by the proxyType attribute).


