    # There''s more...


    In some scenarios, you may have additional properties files in your /WEB-INF/classes
    directory. For instance, you may have a log4j.properties file inside /WEB-INF/classes
    for use by the log4j library. In such scenarios, you may want to keep your theme
    properties files in a different folder than the classpath root. You can do so
    by using the basenamePrefix property of ResourceBundleThemeSource. For instance,
    consider the following configuration of the ResourceBundleThemeSource in webmvc-config.xml
    file:


    ```

    <bean class="org.springframework.ui.context.support.ResourceBundleThemeSource"
    id="themeSource"

    p:basenamePrefix="themes."/>

    ```


    The value themes. of the basenamePrefix attribute effectively says that ResourceBundleThemeSource
    should look for themes inside the /WEB-INF/classes/themes directory.


