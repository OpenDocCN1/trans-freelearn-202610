  md: "The following code listing from the ApplicationConversionServiceFactoryBean.java\
    \ file shows the Roo-generated ApplicationConversionServiceFactoryBean class:\n\
    \n```\nimport org.springframework.format.FormatterRegistry;\nimport org.springframework.format.support.\n\
    FormattingConversionServiceFactoryBean;\nimport org.springframework.roo.addon.web.mvc.controller.\n\
    RooConversionService;\n\n@RooConversionService\npublic class ApplicationConversionServiceFactoryBean\
    \ extends\nFormattingConversionServiceFactoryBean\n{\n    @Override\n    protected\
    \ void installFormatters(FormatterRegistry registry)\n    {\n        super.installFormatters(registry);\n\
    \    }\n}\n```\n\nIn the given code, the ApplicationConversionServiceFactoryBean\
    \ represents an application-wide ConversionService with which application converters\
    \ and formatters are registered. You can register your custom formatters and converters\
    \ inside the installFormatters method.\n\nThe @RooConversionService triggers a\
    \ generation of a * _Roo_ConversionService.aj AspectJ ITD file. The * _Roo_ConversionService.aj\
    \ defines converters for JPA entities in the application. These converters convert\
    \ a JPA entity instance into a String representation consisting of entity field\
    \ names and their values. The String representation of a JPA entity instance is\
    \ used for displaying the entity instance as a String on the Roo-generated web\
    \ pages. The following code listing shows the ApplicationConversionServiceFactoryBean_Roo_ConversionService.aj\
    \ file of the flight-app application:\n\n```\nprivileged aspect ApplicationConversionServiceFactoryBean_Roo_ConversionService\n\
    {\n    static class ApplicationConversionServiceFactoryBean.FlightConverter\n\
    \    implements Converter<Flight, String>\n    {\n        public String convert(Flight\
    \ flight)\n        {\n            return new StringBuilder().\n            append(flight.getDepartureDate()).append(\"\
    \ \").\n            append(flight.getArrivalDate()).toString();\n        }\n \
    \   }\n}\n```"
