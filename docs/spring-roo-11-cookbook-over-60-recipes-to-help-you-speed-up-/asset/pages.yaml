- pgno: 196
  md: '| Element | Description |

    |---|---|

    | exposeJson | Indicates that if the corresponding Roo-managed JPA entity is annotated
    with the @RooJson class-level annotation, then expose controller functionality
    (create, update, show, and delete) using JSON. The default value is true. Refer
    to the Adding JSON support to domain objects and controllers recipe for details
    on how to add JSON support to Roo-managed JPA entities and Spring Web MVC controllers.
    |


    The following table describes methods that form part of the * _Roo_Controller.aj
    ITD, assuming that all controller operations were generated:


    | Method | Description |

    |---|---|

    | createForm | Shows the form for creating the entity. Creates a new instance
    of the form-backing object (which is the Roo-managed JPA entity specified by the
    formBackingObject attribute of the @RooWebScaffold annotation), adds dependencies
    required for persisting the Roo-managed JPA entity (these dependencies include
    entities that participate in the relationship, such as FlightDescription is required
    for persisting a Flight entity), and adds date/time patterns (if required). |

    | create | Persists Roo-managed entity exposed by the controller. Also performs
    JSR 303 (if available) validation on the entity instance. Adds date/time patterns
    (if required). |

    | show | Shows details of a persisted entity instance. Adds date/time patterns
    (if required). |

    | list | Shows the list of persistent entity instances. Adds date/time patterns
    (if required). Also adds support for pagination of data. |

    | updateForm | Shows the form for updating an entity instance. Adds date/time
    patterns (if required). |

    | update | Persists changes to an entity instance. Adds date/time patterns (if
    required). |

    | delete | Deletes an entity instance. |


    > There''s more...


    As shown in this recipe, the controller scaffold command provides options to help
    create a customized controller. Even if you have created controllers using the
    controller all command, you can still customize the controller by setting the
    attributes of the @RooWebScaffold annotation.'
