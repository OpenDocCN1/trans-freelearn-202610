- pgno: 250
  md: "RequestFactory acts as a communication bridge between the entity proxy and\
    \ the corresponding entity on the server-side. RequestFactory manages entity proxies\
    \ and is responsible for copying server-side entity attribute values to corresponding\
    \ entity proxy and vice versa. In your GWT application, you are required to define\
    \ an interface that extends RequestFactory interface and provide methods that\
    \ return client-side stubs for server-side services. Roo creates an ApplicationRequestFactory\
    \ class (we discussed earlier that this was created using GIN), which is shown\
    \ here:\n\n```\npackage sample.roo.flightapp.client.managed.request;\n\nimport\
    \ sample.roo.flightapp.shared.scaffold.ScaffoldRequestFactory;\n\npublic interface\
    \ ApplicationRequestFactory extends\nScaffoldRequestFactory {\n    FlightRequest\
    \ flightRequest();\n    FlightDescriptionRequest flightDescriptionRequest();\n\
    }\n```\n\nThe following class diagram shows the inheritance hierarchy of the ApplicationRequestFactory\
    \ class:\n\n![](img/b8c379a2ed921ead3aa2b01811dc29fa_250_0.png)\n\nThe above figure\
    \ shows that ApplicationRequestFactory extends the Roo-generated ScaffoldRequestFactory\
    \ interface, which in turn extends GWT's RequestFactory interface. The hierarchy\
    \ is created such that if you want to define your custom client-side service stub\
    \ methods, then you can add them to the ScaffoldRequestFactory."
  merge: -1
  img_proc: true
- pgno: 251
  md: "> > ApplicationRequestFactory is managed by Roo; therefore, you should not\
    \ modify it manually to add custom client-side service stub methods. Instead,\
    \ add them to ScaffoldRequestFactory.\n\nThe interaction between entity proxy\
    \ and server-side entity is achieved by configuring GWT's RequestFactoryServlet\
    \ in the web.xml file of the GWT web application.\n\n> > You don't need to configure\
    \ RequestFactoryServlet in the web.xml file of the flightapp-gwt project because\
    \ when you execute the gwt setup command, Roo configures GWT's RequestFactoryServlet\
    \ in the web.xml file.\n\nThe following code shows the configuration of RequestFactoryServlet\
    \ in the web.xml file of the flightapp-gwt application:\n\n```\nweb.xml\n<servlet>\n\
    \  <servlet-name>requestFactory</servlet-name>\n  <servlet-class>\n    com.google.gwt.requestfactory.server.RequestFactoryServlet\n\
    \  </servlet-class>\n</servlet>\n<servlet-mapping>\n  <servlet-name>requestFactory</servlet-name>\n\
    \  <url-pattern>/gwtRequest</url-pattern>\n</servlet-mapping>\n```\n\nThis configuration\
    \ shows that by default Roo maps the RequestFactoryServlet to /gwtRequest URL,\
    \ which you can change. If you change the URL mapping of RequestFactoryServlet,\
    \ then you also need to change how ApplicationRequestFactory is created by ScaffoldModule—the\
    \ Roo-generated GIN module we discussed earlier.\n\nRequestFactory requires that\
    \ the server-side entity must define a no-argument constructor, getId, getVersion,\
    \ and find<Entity> methods. The getVersion should return the version, getId should\
    \ return the unique ID associated with entity instance, and the find<Entity> method\
    \ which accepts entity ID and returns the corresponding entity instance. So, if\
    \ you create entities using the Roo entity command, then make sure that you don't\
    \ set the name of the identifier field or version field to anything other than\
    \ id and version, respectively. When you execute the Roo gwt setup command, and\
    \ Roo finds that the names of ID and version fields is different from id and version,\
    \ then it doesn't scaffold the GWT application.\n\nLet's now look at some of the\
    \ Roo-generated GWT activities and places."
