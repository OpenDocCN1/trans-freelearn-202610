  md: "# Deploying and running mysimple add-on\n\nOnce you have created an add-on,\
    \ you may want to test its functionality, before making the add-on available to\
    \ other developers. In this section, we'll look at how to locally deploy and test\
    \ the mysimple add-on that we created using the `create addon simple` command.\n\
    \nTo use the mysimple add-on, you need to convert it into an OSGi-compliant JAR\
    \ bundle. To do so, execute `mvn clean install` from the directory which contains\
    \ your mysimple add-on project, as shown here:\n\n```\nC:\\roo-cookbook\\ch07-simple-add-on>\
    \ mvn clean install -Dgpg.\npassphrase=<thephrase>\n```\n\nHere, `<thephrase>`\
    \ is the password phrase that you provide for signing add-ons using GnuPG (also\
    \ referred to as GPG). Refer to the *Setting up GnuPG for add-on development*\
    \ recipe for information on how to set up GnuPG and create a password phrase for\
    \ signing add-ons.\n\nExecuting the `mvn clean install` command creates a `com.roo.addon.mysimple-0.1.0.BUILD-SNAPSHOT.jar`\
    \ add-on OSGi bundle in the `target` directory of the mysimple add-on project.\
    \ Now, let's look at how to use the mysimple add-on in a Roo project.\n\n# Using\
    \ the mysimple add-on in a Roo project\n\nThe following steps will demonstrate\
    \ how to use an add-on:\n\n+   1. Create a new directory `C:\\roo-cookbook\\ch07-addon-test`\
    \ in your system and start the Roo shell from this directory.\n+   \n+   2. Execute\
    \ the `ch07_web_app.roo` script to create a `flight-app` Spring Web MVC project.\n\
    +   \n+   3. Execute the `osgi start` command to install and activate the mysimple\
    \ add-on, as shown here:\n+   ```\n+   roo> osgi start --url file:///C:/roo-cookbook/ch07-simple-add-on/target/com.roo.addon.mysimple-0.1.0.BUILD-SNAPSHOT.jar\n\
    +   ```\n+   Here the `url` argument specifies the location of the add-on OSGi\
    \ bundle you want to install and activate.\n+   \n+   The `osgi start` command\
    \ installs the mysimple add-on. This command is also used to download and install\
    \ Roo add-ons that are located on a website by specifying the `http://` or `https://`\
    \ URL to the add-on JAR file as the value of the `url` argument.\n+   \n+   4.\
    \ To verify that the add-on was successfully installed, type `say` at the Roo\
    \ shell and press the `Tab` key. Roo should autocomplete the command to `say hello`,\
    \ as shown here:\n+   `roo> say hello`"
