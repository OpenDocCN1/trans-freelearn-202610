    | Flight -> createdDate | Not null | @NotNull |

    | Flight -> createdBy | Not null | @NotNull |

    | Flight -> numOfSeats | Not null | @NotNull |

    | | Maximum seats 200 | @DecimalMax ("200") |

    | | Minimum seats 100 | @DecimalMin ("100") |

    | Flight -> origin | Not null | @NotNull |

    | | Maximum length of value

    of origin is 20, minimum

    length is 3 | @Size (min=3, max=20) |

    | Flight -> destination | Not null | @NotNull |

    | | Maximum length of value

    of destination is 20,

    minimum length is 3 | @Size (min=3, max=20) |

    | FlightKey -> flightId | Not null | @NotNull |

    | FlightKey ->

    departureDate | Not null | @NotNull |


