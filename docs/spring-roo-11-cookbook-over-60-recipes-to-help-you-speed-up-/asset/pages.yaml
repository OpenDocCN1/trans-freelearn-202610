    # Installing an installable add-on


    An add-on that is not part of the Spring Roo distribution is referred to as an
    installable add-on. So, any add-on that is not a base add-on is an installable
    add-on. In this recipe, we''ll look at how to install an installable add-on and
    the challenges that you''ll face in doing so.


    # Getting ready


    Refer to the Setting up GnuPG for add-on development recipe to set up GnuPG on
    your system.


    Create a new directory C:\\roo-cookbook\\ch07-service in your system and start
    the Roo shell from the ch07-service directory.


    Executing the ch07_jpa_setup.roo script creates a flight-app Roo project, sets
    up Hibernate as a persistence provider, and configures MySQL as the database for
    the application. If you are using a different database than MySQL or your connection
    settings are different from what is specified in the script, then modify the script
    accordingly.


    # How to do it...


    The following steps will demonstrate how to install an installable add-on:


    +   1. Enter the following command in the Roo shell and press Tab:


    ```

    roo> addon install bundle --bundleSymbolicName

    ```


    ```

    Display all 308 possibilities? (y or n

    ```


    Roo asks if it should display the symbolic names of all the available add-ons.
    Press the Y key to instruct Roo to list all the add-ons. You''ll find that in
    the list there are a couple of gvNIX (https://code.google.com/p/gvnix/) Roo add-ons
    that have bundle symbolic names starting with "org.gvnix.". For the purpose of
    this recipe we''ll install the gvNIX Service Management add-on whose bundle symbolic
    name is org.gvnix.service.roo.addon. Using the Service Management add-on you can
    quickly create a service layer of your enterprise application.'
