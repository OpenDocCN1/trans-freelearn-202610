  md: "This sequence diagram shows that when the **Save** button is clicked, it results\
    \ in the invocation of the processSave method defined in FlightDescriptionForm.mxml.\
    \ The processSave method validates the form data entered by the user using the\
    \ mx.validators.Validator. If the data validation succeeds, form data is set in\
    \ the FlightDescription ActionScript object. The processSave method now creates\
    \ a FlightDescriptionEvent event of type FlightDescriptionEvent.CREATE and passes\
    \ the FlightDescription ActionScript object as the payload of the event. Invoking\
    \ the dispatchEvent method results in dispatching the newly created event to listeners.\n\
    \nSo, after receiving the FlightDescriptionEvent.CREATE event, flightDescriptionView_flightDescriptionCreateEventHandler\
    \ is invoked, as explained earlier. The following code shows the flightDescriptionView_flightDescriptionCreateEventHandler\
    \ method, which invokes the FlightDescriptionService's create method to create\
    \ an instance of the FlightDescription JPA entity:\n\n```\nprotected function\n\
    flightDescriptionView_flightDescriptionCreateEventHandler\n(event:FlightDescriptionEvent):void\
    \ {\n    flightDescriptionService.create(event.flightDescription);\n}\n...\n```\n\
    \nThe flightDescriptionService object in the previous code represents a mx.rpc.remoting.RemoteObject,\
    \ which is used by Flex clients to access remoting destinations. RemoteObject\
    \ is defined in FlightDescriptionView.mxml using the <RemoteObject> tag, as shown\
    \ here:\n\n```\n<s:RemoteObject channelSet=\"{remotingChannels}\"\n    destination=\"\
    flightDescriptionService\"\n    fault=\"flightDescriptionService_faultHandler(event)\"\
    \n    id=\"flightDescriptionService\">\n...\n</s:RemoteObject>\n```\n\nIn this\
    \ code, {remotingChannels} identifies the ChannelSet to use for communication\
    \ with server-side Java objects. We saw in the previous recipe that remoting channels\
    \ used by the flightapp_flex application are defined in the flightapp_flex_scaffold.mxml\
    \ file using the <ChannelSet> tag. The destination attribute specifies the remoting\
    \ destination that is accessed via RemoteObject.\n\n# There's more...\n\nThe Flex\
    \ Add-on provides round-tripping support, that is, modifications to JPA entities\
