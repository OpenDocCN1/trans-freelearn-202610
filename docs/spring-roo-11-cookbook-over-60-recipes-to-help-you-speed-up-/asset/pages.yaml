  md: '| Directory | Description |

    | :--- | :--- |

    | SRC_MAIN_WEBAPP\WEB-INF\classes | Roo creates the following two property files,
    which identify the resources that make up a theme: `standard.properties` and `alt.properties`.
    |

    | SRC_MAIN_WEBAPP\WEB-INF\layouts | Contains a tiles configuration XML file, `layouts.xml`,
    which contains tiles definitions. It also contains a layout template JSPX file,
    `default.jspx`, which is used as a template by the tiles definitions in the `layouts.xml`
