    # There''s more...


    If you are designing your entities for App Engine, it is important to note that
    within a transaction you can only operate on entities which belong to the same
    entity group. So, if you have `Student` and `Course` entities, which are in different
    entity groups, then you can''t create or update them in a single transaction.


    As of Spring Roo 1.1.3, you can only create _unowned_ relationship between entities.
    For instance, if you use the `field reference` or `field set` command to add a
    relationship field, then the `*_Roo_JavaBean.aj` AspectJ ITD file corresponding
    to the JPA entity removes the `@OneToMany` or `@OneToOne` or `@ManyToOne` or `@ManyToMany`
    annotation from the corresponding field in the JPA entity Java source file, resulting
    in an _unowned_ relationship. The following code fragment shows how the AspectJ
    ITD file removes the relationship annotation from Java source file:


    ```

    privileged aspect FlightDescription_Roo_JavaBean {


    declare @field: * FlightDescription.flights: -@OneToMany;

    ...

    }

    ```'
