    findMethod="finderFor", findEntriesMethod="")

    ```


    3. You''ll see the following output on the Roo shell:


    ```

    Updated SRC_MAIN_JAVA\\sample\\roo\\flightapp\\domain\\Flight_Roo_Entity.aj

    ```


    # How it works...


    The @RooEntity annotation of Roo is responsible for managing the methods defined
    in the corresponding * _Roo_Entity.aj AspectJ ITD. @RooEntity annotation defines
    attributes which let you specify the prefix to be used for the methods generated
    by Roo and also to control whether a particular method is generated or not. The
    @RooEntity annotation also defines attributes which you can use to specify entity
    identifier and version fields name, type, and table column information.


    In the previous code, the @RooEntity annotation specifies the following information:


    +   - identifierType = FlightKey.class: specifies the Flight entity identifier
    type as FlightKey class. The default value is Long.

    +   - persistMethod = "save":the value ''save'' means that instead of generating
    a persist method, Roo generates a method named save .

    +   - countMethod = "": as the value is "", it means Roo must not generate countFlights
    method.

    +   - findEntriesMethod = "": as the value is "", it means Roo must not generate
    findFlightEntries method.

    +   - findMethod = "finderFor":as the value is finderFor, instead of generating
    findFlight method, Roo will generate method named finderForFlight.'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'The follow table describes all the attributes defined by @RooEntity annotation:


    | @RooEntity attributes | Description |

    | :--- | :--- |

    | countMethod, findAllMethod, findEntriesMethod, findMethod, flushMethod, mergeMethod,
    persistMethod, removeMethod | Attributes for specifying the prefix of the generated
    method. A value of "" means that the method will not be generated by Roo. |

    | identifierColumn, identifierField, identifierType | Attributes for specifying
    JPA entity identifier information, which includes the name of the table column
    to which the identifier field maps, the name of the identifier field in the AspectJ
    ITD file, and the Java type of the identifier field. |

    | versionField, versionType, versionColumn | Attributes for specifying the version
    field information, which includes name of the table column to which the version
    field maps, name of the version field in the AspectJ ITD file, and the Java type
    of the version field. |

    | finders | Attribute that specifies names of the methods for which dynamic finder
    methods are generated by Roo. |

    | mappedSuperclass | Instructs Roo to generate a @MappedSuperclass annotation
    instead of @Entity. We''ll see mapped superclass usage in Chapter 3, Advanced
    JPA Support in Spring Roo. |

    | inheritanceType | Inheritance type to be used for the JPA entity. |

    | persistenceUnit | The name of the persistence unit, defined in persistence.xml,
    with which the entity is associated. |

    | transactionManager | [Supported since Spring Roo 1.1.5] The name of the transaction
    manager associated with the entity. |


    +   > **See also**

    +   > Refer to the Creating persistent entities recipe to see how to create JPA
    entities using Roo


    # Creating integration tests for persistent entities


    Spring Roo provides a test integration command that simplifies the creation of
    integration tests for persistent entities. In this recipe, we''ll look at how
    to create an integration test for an entity.'
