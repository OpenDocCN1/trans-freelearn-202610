  md: '# # Packaging your Roo project


    If you are using Roo only to create the persistence layer of your enterprise application,
    then you may want to package your Roo project as a JAR file and use it. This recipe
    shows how you can package your Roo project and how Roo ensures that your packaged
    JAR file is independent of Roo-specific annotations and AspectJ ITDs.


    # ## Getting ready


    Exit the Roo shell and delete the contents of the `C:\roo-cookbook\ch02-recipes`
    directory.


    Execute the `ch02_jsr303_fields.roo` script. It creates a `flight-app` Roo project
    and sets up Hibernate as persistence provider using the persistence setup command.
    The script also creates a `Flight` entity, which has `FlightKey` as its composite
    primary key class, and adds fields to the `Flight` and `FlightKey` classes. If
    you are using a different database than MySQL or your connection settings are
    different from what is specified in the script, then modify the script accordingly.


    Start the Roo shell from the `C:\roo-cookbook\ch02-recipes` directory.


    # ## How to do it...


    To package your Roo project into a JAR file, execute the `perform package` command
    from the Roo shell:


    ```

    roo> perform package

    ```


    ```

    [INFO] -----------------------------------------------------------

    [INFO] Building flight-app 0.1.0.BUILD-SNAPSHOT

    [INFO] -----------------------------------------------------------

    ...

