    # How it works...


    The `persistence setup` command determines that the target deployment environment
    is Google App Engine if the value of database argument is GOOGLE_APP_ENGINE. If
    the value of the database argument is GOOGLE_APP_ENGINE, then it becomes mandatory
    to specify DATANUCLEUS as the value of the provider argument.


    You might be wondering why''s mandatory to specify the persistence provider as
    DataNucleus and GOOGLE_APP_ENGINE as the database. Well, Google App Engine uses
    a proprietary schema-less object datastore, BigTable, for persisting application
    data. Java applications can access the BigTable datastore using JPA or JDO via
    DataNucleus App Engine plugin (this is not a Maven plugin but a DataNucleus plugin).
    DataNucleus is a separate product that allows access to datastores (which includes
    RDBMS, Excel, XML, LDAP, and so on) using JDO and JPA APIs. Also, the Datannucleus
    App Engine plugin is developed and maintained by Google and is specifically meant
    for use with GAE. So, you can say that by using DataNucleus, developers can use
    JDO or JPA APIs in their applications for accessing or persisting data, irrespective
    of the datastore(s) used by the application. This could be particularly useful
    in case your application makes use of distinct types of data sources.'
  merge: -1
  img_proc: true
- pgno: 346
  md: "In response to persistence setup, Roo performs the following actions:\n\n+\
    \   * Creates the `appengine-web.xml` file in the `WEB-INF` directory\n+   * Adds\
    \ dependency on DataNucleus `App Engine` plugin in `pom.xml`\n+   * Configures\
    \ Maven `GAE` plugin in `pom.xml`\n+   * Configures Maven `DataNucleus` plugin\
    \ in `pom.xml`\n+   * Creates `logging.properties` configuration for Java logging\
    \ API\n+   * Creates the `persistence.xml` file in the `META-INF` directory, which\
    \ provides persistence provider (`DataNucleus` in our case) information\n+   *\
    \ Creates the `applicationContext.xml` file in `META-INF/spring` directory, which\
    \ contains transaction manager and JPA `EntityManagerFactory` definitions\n\n\
    Let's now look at `appengine-web.xml` file and the plugins configured by Roo.\n\
    \n# appengine-web.xml\n\nThe `appengine-web.xml` is a configuration file specific\
    \ to GAE, which specifies application identifier, version of the application,\
    \ static and resource files in the application, system properties, and so on.\
    \ The following listing shows the content of `appengine-web.xml` generated by\
    \ Roo for the `flightapp-gae-gwt` project:\n\n```\n<appengine-web-app xmlns=\"\
    http://appengine.google.com/ns/1.0\">\n    <application>myappid</application>\n\
    \    <version>1</version>\n    <sessions-enabled>true</sessions-enabled>\n   \
    \ <system-properties>\n        <property name=\"java.util.logging.config.file\"\
    \n        value=\"WEB-INF/logging.properties\"/>\n        <property\n        name=\"\
    appengine.orm.disable.duplicate.emf.exception\"\n        value=\"false\"/>\n \
    \   </system-properties>\n</appengine-web-app>\n```\n\n`<appengine-web-app>` is\
    \ the root element of `appengine-web.xml`. `<application>` element specifies the\
    \ application identifier, the value of which comes from the `applicationId` argument\
    \ of `persistence setup` command."
  merge: -1
  img_proc: true
- pgno: 347
  md: '<version> element specifies the version identifier of the application code
    that you are deploying on GAE. The application version identifier is particularly
    useful when you want to test your deployed application on GAE before making it
    the default version, which is accessible to the users. Let''s say, you have version
    1 of Flight Booking application already deployed on GAE. Now, you make some changes
    to your application code in order to fix bugs or add/modify application features.
    To test your modified application on GAE, change the <version> element to a different
    value, let''s say 2, and deploy the application on GAE using gae:deploy goal (more
    on this later) of maven GAE plugin. GAE uses the value of <version> element to
    determine if the existing application code needs to be replaced by the newly deployed
    application code or to create a new version of the application code. As the version
    of newly deployed Flight Booking application code is 2 and the existing application
    code had version 1, GAE creates a new version of the application, which you can
    access by going to the following URL: http://<app-version>.latest.<application-id>.appspot.com.
    Assuming that the application identifier of the Flight Booking application is
    myappid and the version deployed is 2, the URL becomes http://2.latest.myappid.appspot.com.


    The <session-enabled> element enables GAE''s session persistence feature, that
    is, session data is persisted into App Engine''s datastore. So, if you set session
    data in your web application using setAttribute method of HttpSession, then it
    is stored in App Engine''s datastore. As the session objects are persisted, the
    objects that you set in the session must implement the java.io.Serializable interface.


    The <system-properties> element defines the system properties available to the
    application. App Engine supports application logging via Logging API of Java (refer
    to the java.util.logging package). The logging configuration is read from the
    file, which is specified as the value of java.util.logging.config.file system
    property. In the appengine-web.xml file of the flightapp-gae-gwt project, the
    <property> sub-element of the <system-properties> element specifies that the value
    of the java.util.logging.config.file system property is WEB-INF/logging.properties.
    Similarly, appengine.orm.disable.duplicate.emf.exception system property with
    value true instructs App Engine not to raise exceptions when the application attempts
    to create multiple javax.persistence.EntityManagerFactory instances for a persistence
    unit. By default, App Engine expects that only a single instance of EntityManagerFactory
    exists per persistence unit, and an attempt to create a duplicate EntityManagerFactory
    instance results in exception.


    # Maven GAE plugin


    The Maven GAE plugin simplifies developing Java applications for App Engine by
    providing goals, which help with downloading and unzipping App Engine SDK, starting
    and stopping App Engine development server, deploying application to App Engine,
    retrieving application logs from App Engine, and so on.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'The following listing shows Maven GAE plugin specific configuration as defined
    in pom.xml of the flightapp-gae-gwt project:


    ```

    <project ...>

    ...

    <properties>

    ...

    <gae.home>

    ${user.home}/.m2/repository/com/google/appengine/

    appengine-java-sdk/1.4.0/appengine-java-sdk-1.4.0

    </gae.home>

    </properties>

    ...

    <plugin>

    <groupId>net.kindleit</groupId>

    <artifactId>maven-gae-plugin</artifactId>

    <version>0.5.7</version>

    <configuration>

    <unpackVersion>1.4.0</unpackVersion>

    </configuration>

    <executions>

    <execution>

    <phase>validate</phase>

    <goals>

    <goal>unpack</goal>

    </goals>

    </execution>

    </executions>

    </plugin>

    </project>

    ```


    The gae.home property specifies the location of the unpacked version of App Engine
    SDK.


    The sub-element <unpackVersion> of plugin <configuration> specifies the version

    of the plugin to unpack. The <execution> element specifies that the gae:unpack
    goal

    of the Maven GAE plugin is executed in the validate build lifecycle phase. The
    validate

    build lifecycle phase is the one in which Maven validates that the project is
    correct and all the

    required information to make the build is available. The gae:unpack goal unpacks
    the GAE

    SDK to the location specified by the gae.home property.'
