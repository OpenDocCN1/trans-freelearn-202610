- pgno: 234
  md: '# Scaffolding GWT applications from JPA entities


    In this recipe, we''ll look at the `gwt setup` command, which scaffolds GWT artifacts
    from JPA entities.


    # Getting ready


    Create a new directory (`C:\roo-cookbook\ch05-gwt`) in your system. Copy the `ch05_gwt_app.roo`
    script that accompanies this book to the `ch05-gwt` directory. Start the Roo shell
    from the `ch05-gwt` directory and execute the `ch05_gwt_app.roo` script using
    the `script` command. Executing the `ch05_gwt_app.roo` script does the following:


    +   - Creates a `flightapp-gwt` Eclipse project

    +   - Sets up Hibernate as a persistence provider

    +   - Configures MySQL as the database for the application

    +   - Creates `Flight` and `FlightDescription` JPA entities and defines a many-to-one
    relationship between `Flight` and `FlightDescription` entities


    If you are using a different database than MySQL or your connection settings are
    different from what is specified in the script, then modify the script accordingly.


    Install the **Google Plugin for Eclipse IDE** (`http://code.google.com/eclipse/`);
    it simplifies developing GWT applications using Eclipse IDE.


    # How to do it...


    Follow these steps to scaffold GWT applications:


    +   1. Execute `gwt setup` command, as shown here:


    ```

    ..roo>gwt setup

    ....

    Created SRC_MAIN_WEBAPP\WEB-INF\spring

    Created SRC_MAIN_WEBAPP\WEB-INF\spring\webmvc-config.xml

    Created SRC_MAIN_WEBAPP\WEB-INF\web.xml

    Updated ROOT\pom.xml [...]

    Created SRC_MAIN_JAVA\sample\roo\flightapp\client

    Created SRC_MAIN_JAVA\sample\roo\flightapp\ApplicationScaffold.gwt.xml

    Created SRC_MAIN_JAVA\sample\roo\flightapp\client\managed\request

    Created SRC_MAIN_JAVA\sample\roo\flightapp\client\scaffold\request

    ```'
  merge: -1
  img_proc: true
- pgno: 235
  md: '```

    Created SRC_MAIN_WEBAPP\index.html

    Created SRC_MAIN_WEBAPP\ApplicationScaffold.html

    ...

    ```


    Note that only partial output has been shown above for brevity.


    +   2. As of Spring Roo 1.1.3, gwt setup command creates GAE-specific (Google
    App Engine) Java files that you must remove from the generated source. To do so,
