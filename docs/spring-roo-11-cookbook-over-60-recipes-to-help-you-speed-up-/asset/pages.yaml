    Created SRC_MAIN_WEBAPP\images\es.png

    Managed SRC_MAIN_WEBAPP\WEB-INF\views\footer.jspx

    ```


    # How it works...


    The web mvc install language command accepts a single argument: code, which identifies
    the language code for which the support needs to be added to the web application.
    The code argument accepts a pre-defined language code, depending upon the languages
    supported by Spring Roo. Spring Roo contains translations for the standard messages
    and labels for the following language codes: de (German), en (English), es (Espanol),
    it (Italian), nl (Dutch), and sv (Swedish).


    When the web mvc install language command is executed, Roo processes the command
    by taking the following actions:


    +   - Creates the messages_es.properties in /WEB-INF/i18n/ folder

    +   - Copies an image icon (es.png) for the language in the images directory

    +   - Updates /WEB-INF/views/footer.jspx to show the image icon for the language'
