  md: "If you are using a performance testing tool like JMeter to test the performance\
    \ of the JPA layer of your enterprise application, you can modify the FlightIntegrationTest\
    \ JUnit test class and use it as a JUnit Request Sampler (or you can put a wrapper\
    \ around FlightIntegrationTest and use Java Request Sampler) when creating a test\
    \ plan in JMeter. This lets you quickly get started with testing the performance\
    \ of your data access code. Based on the performance test requirements for a persistent\
    \ entity, you can adjust the value of the quantity attribute of the @RooDataOnDemand\
    \ annotation. For instance, if you want to test the performance of the data access\
    \ layer when there are n number of records in the database, then specify the value\
    \ of quantity attribute as n.\n\nThe following listing shows the FlightDataOnDemand_Roo_DataOnDemand.aj\
    \ AspectJ ITD file, which defines methods, attributes, and annotations that are\
    \ weaved into the FlightDataOnDemand.java class at compile-time:\n\n```\nprivileged\
    \ aspect FlightDataOnDemand_Roo_DataOnDemand {\n\n    declare @type: FlightDataOnDemand:\
    \ @Component;\n\n    private Random FlightDataOnDemand.rnd =\n        new java.security.SecureRandom();\n\
    \n    private List<Flight> FlightDataOnDemand.data;\n\n    public Flight FlightDataOnDemand.getNewTransientFlight\
    \ (int\n    index) {...}\n\n    public Flight FlightDataOnDemand.getSpecificFlight\
    \ (int\n    index) {...}\n\n    public Flight FlightDataOnDemand.getRandomFlight\
    \ () {...}\n\n    public boolean FlightDataOnDemand.modifyFlight (Flight obj)\n\
    \    {...}\n\n    public void FlightDataOnDemand.init() {...}\n\n}\n```\n\nThe\
    \ code listing shows that AspectJ ITD does the following:\n\n+   - Adds the @Component\
    \ annotation to the FlightDataOnDemand class, so that it is auto-registered with\
    \ Spring's application context. This enables you to create custom integration\
    \ tests in which you can autowire one or more *DataOnDemand classes.\n+   - Creates\
    \ an instance of the java.security.SecureRandom class, which is used for generating\
    \ a random number."
