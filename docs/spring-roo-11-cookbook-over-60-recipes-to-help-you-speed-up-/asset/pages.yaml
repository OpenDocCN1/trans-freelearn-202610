    # How it works...


    The `class` argument of the `focus` command lets you specify the fully-qualified
    name of the Java type with which you want to work. The ~ symbol is used to indicate
    the top-level package of the Roo project that you specified during creation of
    the Roo project.


    > The use of the ~ symbol simplifies providing the value of any argument that
    expects a fully-qualified name of a Java type in your Roo project.


    # There''s more...


    The use of the `focus` command is mainly to simplify writing commands targeting
    a particular Java type. If you don''t want to use the `focus` command in a situation,
    then you can always use the `class` argument of the command to specify the target
    Java type of the command.


