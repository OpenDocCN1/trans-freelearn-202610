- pgno: 194
  md: "# How to do it...\n\nThe following steps show how to use the `controller scaffold`\
    \ command to create controllers for JPA entities:\n\n+   1. Execute the `controller\
    \ scaffold` command to create `FlightController`, as shown here:\n+   \n+   ..roo>\
    \ controller scaffold --class ~.web.FlightController --entity ~.domain.Flight\
    \ --path /myflightpath --disallowedOperations update,delete\n\n+   2. Execute\
    \ the `perform eclipse` command to update the classpath settings, and import the\
    \ project in your Eclipse IDE.\n\n# How it works...\n\nThe following table describes\
    \ the purpose of each of the arguments passed to the `controller scaffold` command:\n\
    \n| Argument | Description |\n|---|---|\n| class (mandatory) | Fully-qualified\
    \ name of the controller class, which you want to create. |\n| entity (optional)\
    \ | Fully-qualified name of the Roo-managed JPA entity class (a class annotated\
    \ with `@RooEntity` annotation), which is used as a form-backing object by the\
    \ generated controller. The value of this argument translates into the value of\
    \ the `formBackingObject` attribute of the `@RooWebScaffold` annotation. |\n|\
    \ path (optional) | Identifies the sub-directory inside `/WEB-INF/views/`, which\
    \ contains the JSPX views corresponding to the controller. The value of this argument\
    \ translates into the value of the `path` attribute of the `@RooWebScaffold` annotation.\n\
    \nThe value of the `path` argument also translates into the value of the `@RequestMapping`\
    \ class-level annotation in the generated controller. |\n| disallowedOperations\
    \ (optional) | Comma-separated list of operations, which is not supported by the\
    \ generated controller. For instance, if the value is `update, delete`, then the\
    \ generated controller doesn't contain methods to update and delete the JPA entity\
    \ corresponding to which the controller was generated. The only valid values for\
    \ this argument are `update`, `delete`, and `create`. |"
  merge: -1
  img_proc: true
