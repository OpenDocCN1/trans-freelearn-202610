    # See also


    +   Refer to the Developing an advanced add-on recipe to see how to develop an
    add-on, which creates new Java classes, interfaces, and AspectJ ITD files


    # Developing an advanced add-on


    If you want to generate Java code (classes and interfaces) and AspectJ ITDs in
    response to the execution of one or more Roo commands, then you should create
    an advanced Roo add-on.'
