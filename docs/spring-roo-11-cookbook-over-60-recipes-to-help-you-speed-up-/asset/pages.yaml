- pgno: 150
  md: '# Introduction


    In Chapter 2, Persisting Objects Using JPA and Chapter 3, Advanced JPA Support
    in Spring Roo, we looked at how domain layer of an application can be quickly
    developed using a JPA add-on of Spring Roo. In this chapter, we''ll look at how
    Spring Roo simplifies developing the web layer of an enterprise application using
    Spring Web MVC. We''ll also look at how Spring Roo lets you quickly test your
    web application locally.


    > > You can use Roo in developing your enterprise application''s persistence layer
    even if the web framework that you want to use is not supported by Roo. For instance,
    if you are developing a web application using Wicket, you can still use Roo to
    generate the persistence layer of your application. Similarly, if you are developing
    a Swing application, you can use Roo for creating the persistence layer.


    # Auto-generating Spring MVC controllers and JSPX views from JPA entities


    Spring Roo comes with a Web MVC add-on, which supports creating Spring MVC controllers
    and JSPX views from Roo-managed JPA entities. Spring Roo provides multiple commands,
    processed by a Web MVC add-on, to help with the auto-generation of the Spring
    MVC controllers and JSPX views. By default the controllers generated by Roo support
    creating, reading, updating, and deleting JPA entities from the data store.


    The following commands are provided by Roo for creating controllers:


    +   - `controller all`: It is used for scaffolding a Spring Web MVC controller
    for each JPA entity in the application for which a controller doesn''t already
    exist. The `controller all` command doesn''t give you any control over application
    functionality supported by generated controllers.

    +   - `controller scaffold`: It is used for scaffolding a Spring Web MVC controller
    corresponding to a JPA entity. Unlike `controller all` command, the `controller
    scaffold` command provides optional arguments, which allow you to control some
    of the application functionalities supported by the generated controller. For
    instance, you can specify that methods for creating, updating, and deleting the
    JPA entity are not generated for the controller.

    +   - `controller class`: It is used for manually creating a controller. The `controller
    class` command generates the skeleton of a controller, leaving the implementation
    of the controller to the developer.'
  merge: -1
  img_proc: true
