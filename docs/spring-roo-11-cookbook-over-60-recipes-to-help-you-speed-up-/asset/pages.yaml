    # There''s more...


    Now, let''s look at how we can use the JNDI-bound data source in applications
    generated by Spring Roo.


    # JNDI-bound data source


    In most real-world applications, the javax.sql.DataSource object is obtained from
    JNDI and not created from properties defined in a properties file. To access a
    JNDI-bound data source, instead of relying on Spring to create DataSource for
    the application, use the jndiDataSource argument of persistence setup to specify
    the JNDI name of the DataSource, as shown here:


    ```

    persistence setup --provider HIBERNATE --database MYSQL --jndiDataSource jdbc/accountDB

    ```


    If the jndiDataSource argument is specified, then Spring Roo adds the jndi-lookup
    element of Spring''s jee schema to the applicationContext.xml file, as shown here:


    ```

    <beans ... xmlns:jee="http://www.springframework.org/schema/jee" ...

    xsi:schemaLocation="http://www.springframework.org/schema/jee http://

    www.springframework.org/schema/jee/spring-jee-3.0.xsd">

    .....

    <jee:jndi-lookup id="dataSource" jndi-name="jdbc/accountDB" />

    .....

    ```


    The jndi-lookup element, shown above, is responsible for accessing the DataSource
    configured in JNDI with the name jdbc/accountDB (referred to by the jndi-name
    attribute) and making it available in Spring''s application context with bean
    id as dataSource.


    If you compare the preceding applicationContext.xml file with the one shown earlier,
    you can see that the only difference is how the dataSource bean is made available
    to the Spring''s application context.'
