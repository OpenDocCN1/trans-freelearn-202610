- pgno: 192
  md: 'In the given code, the `FlightDescriptionConverter` static class implements
    Spring''s `Converter`. It converts the `FlightDescription` JPA entity into a `String`
    representation. The `String` representation of `FlightDescription` is created
    by simply concatenating the values of each of its fields.


    As we modified the names of the `origin` and the `destination` fields to `originCity`
    and `destinationCity`, Roo modifies the `FlightDescription` Converter class to
    use the modified getter methods for the fields. The changes that occurred due
    to these modifications can be outlined as follows:


    +   The `application.properties` file is modified to add new properties, which
    act as labels, for the `originCity` and the `destinationCity` fields, as shown
    here:


    ```

    label_sample_roo_flightapp_domain_flightdescription_destinationcity=Destination
    City

    label_sample_roo_flightapp_domain_flightdescription_origincity=Origin City

    ```


    As you may have guessed, the property names are derived from the package in which
    the JPA entity resides, that is the JPA entity name and the name of the field.
    It is also important to note that once a property is added to the `application.properties`
    file, it is never removed or modified by Roo. Roo always creates new properties
    in the `application.properties` file. So, if you frequently modify your JPA entity
    fields, it will result in unwanted proliferation of properties in the `application.properties`
    file, which you will need to remove manually.


    +   JSPX views: the `create.jspx`, `update.jspx`, `show.jspx`, and the `list.jspx`
    files in `/WEB-INF/views/flightdescriptions/` are modified to reflect the change
    in name of the fields of the `FlightDescription` JPA entity. It is important to
    note that if a field defined in the JSPX view is not Roo-managed, that is, the
    value of the `z` attribute is ''user-managed'' then Roo will not make any modification
    to the field in response to changes in JPA entities.


    When the `@NotNull` JSR 303 annotation is removed from the `price` field of `FlightDescription`,
    then Roo cascades this change to the `/WEB-INF/views/flightdescriptions/create.jspx`
    and the `/WEB-INF/views/flightdescriptions/update.jspx` views. The only change
    that Roo makes to these views is to remove the `required` attribute from the `<input>`
    custom tag element that shows the `price` field on the web user interface.


    # There''s more...


    The round-tripping support for JSPX views in Roo is quite sophisticated and takes
    care of the following changes in the Roo-managed JPA entity:


    +   Change in name of fields


    +   Change in type of fields


    +   Change in the JSR 303 annotation associated with fields'
