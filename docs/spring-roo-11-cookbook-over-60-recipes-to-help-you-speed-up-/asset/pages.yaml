    # There''s more...


    We saw how we can use Roo-generated JPA entities and write our custom JSPX views
    and web controllers to create a web application. Now, we look at a particular
    limitation with views that are generated by Roo for the @OneToMany relationship:


    # Scaffolding Spring Web MVC application for a one-to-many relationship


    Spring Roo doesn''t scaffold an HTML element for the one side of a one-to-many
    relationship. Let''s look at this in the context of an example:


    In the flight-app application, a Booking entity instance represents a booking
    on a flight by a customer. On a particular flight, many bookings are possible;
    therefore, the relationship between the Flight and Booking entities is one-to-many.
    The ch04_one_to_many.roo script that accompanies this book does the following:


    +   - Creates Flight and Booking entities

    +   - Creates a one-to-many relationship between Flight and Booking entities

    +   - Creates controllers and JSPX views for the entities


    Exit the Roo shell and delete the contents of ch04-recipe. Execute the ch04_one_to_many.roo
    script and run the generated Spring Web MVC application using maven (as described
    in the Packaging, deploying, and using Roo-generated Spring MVC application recipe).'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Now, create a Booking instance using the **Create new Booking** menu option
    of the generated web application, as shown in the following screenshot:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_206_0.png)


    Once you have created a Booking instance, you are ready to create a new Flight
    instance and associate a Flight with the newly created Booking instance. To create
    a new Flight instance, select the **Create new Flight** instance menu option,
    which shows the form for creating Flight instances, as shown in the following
    figure:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_206_1.png)


    As the given screenshot shows, Spring Roo didn''t scaffold an HTML element to
    select multiple Booking instances, to help create a one-to-many relationship between
    Flight and Booking entity instances. So, how do we create the relationship between
    entities in case the relationship is one-to-many? To use the scaffolded Spring
    Web MVC application to manage relationships between Booking and Flight entities,
    specify the @ManyToOne annotated field in the Booking entity (the many side of
    the relationship) to create a many-to-one relationship between the Booking and
    Flight entities. Now, you can create the Flight instances (without specifying
    the related Booking instances), and manage the relationship between the Booking
    and Flight instances from the form for creating the Booking (the many side of
    relationship) instances.


    If you don''t want to add the @ManyToOne annotated field to the Booking entity,
    you can modify the /WEB-INF/flights/create.jspx view (which displays the form
    for creating the Flight instances) to add a field, which shows a multi-select
    list box that displays the Booking instances. The following <field:simple> custom
    tag (installed by Roo) in create.jspx shows the message: **This relationship is
    managed from the Booking side** when you select the menu option to view the form
    for creating the Flight instances:'
