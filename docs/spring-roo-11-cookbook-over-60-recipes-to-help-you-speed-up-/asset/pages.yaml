    \ table by the `getNewTransientFlightDescription` method of the `FlightDescriptionDataOnDemand_Roo_DataOnDemand.aj`\
    \ AspectJ ITD) so that the `Flight` instances (created by the `getNewTransientFlight`\
    \ method of the `FlightDataOnDemand_Roo_DataOnDemand.aj` AspectJ ITD) in the `FLIGHT_TBL`\
    \ can specify the foreign key reference to the `FlightDescription` instances?\
    \ It’s simple! It can be done by using the data on the demand class of the `FlightDescription`\
    \ entity because it maintains the list of records that it created in the `FLIGHT_DESC_TBL`\
    \ table. This is exactly what Spring Roo does while generating data on demand\
    \ classes—it creates dependency between data on demand classes of related entities\
    \ to create test data.\n\nThe following code from the `FlightDataOnDemand_Roo_DataOnDemand.aj`\
