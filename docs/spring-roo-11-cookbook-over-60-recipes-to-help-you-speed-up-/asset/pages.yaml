  md: '# Controlling auto-generated methods of persistent entities


    When a persistent entity is created using Roo, a number of methods are auto-generated
    to simplify usage and testing of the entity. For instance, when the Flight entity
    was created in the Creating persistent entities recipe, the corresponding Flight_Roo_Entity.aj
    AspectJ ITD file was created with methods like persist, remove, merge, flush,
    findFlight, and so on.


    In this recipe we''ll look at how to control the generation of entity methods
    by:


    +   - Specifying the prefix to be used for a method

    +   - Instructing Roo not to generate a particular method


    For the purpose of this recipe, we''ll instruct Roo to do the following for the
    Flight entity:


    +   - Change the name of the persist auto-generated method to save

    +   - Change the name of the findFlight auto-generated method to finderForFlight

    +   - Don''t generate countFlights and findFlightEntries methods


    # Getting ready


    Exit the Roo shell and delete the contents of the C:\roo-cookbook\ch02-recipes
    directory.


    Execute the ch02_jsr303_fields.roo script. It creates a flight-app Roo project
    and sets up Hibernate as the persistence provider using the persistence setup
    command. The script also creates a Flight entity, which has FlightKey as its composite
    primary key class, and adds fields to the Flight and FlightKey classes. If you
    are using a different database than MySQL or your connection settings are different
    from what is specified in the script, then modify the script accordingly.


    Start the Roo shell from the C:\roo-cookbook\ch02-recipes directory.


    # How to do it...


    The following steps will show you how to control auto-generated methods:


    +   1. Open Flight.java file in your favorite IDE.

    +   2. Change the @RooEntity annotation to: @RooEntity(identifierType = FlightKey.class,
    persistMethod="save", countMethod="",'
