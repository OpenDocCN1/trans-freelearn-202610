- pgno: 427
  md: 'The following code shows the getSampleField method of MyadvancedMetadata class:


    ```

    private FieldMetadata getSampleField() {

    int modifier = 0;


    FieldMetadataBuilder fieldBuilder =

    new FieldMetadataBuilder(getId(),

    modifier,

    new ArrayList<AnnotationMetadataBuilder>(),

    new JavaSymbolName("sampleField"),

    JavaType.STRING_OBJECT);


    return fieldBuilder.build();

    }

    ```


    Roo''s FieldMetadataBuilder is used to create a FieldMetadata instance. The following
    are the details of the arguments passed to the FieldMetadataBuilder constructor:


    +   - getId(): identifies the Java type into which the field will be introduced
    by the AspectJ ITD

    +   - modifier: represents the access modifier for the field

    +   - new ArrayList<AnnotationMetadataBuilder>(): contains information about the
    annotations that must be added to the field

    +   - new JavaSymbolName("sampleField"): name of the field

    +   - JavaType.STRING_OBJECT: Java type of the field


    Similarly, the getSampleMethod method of MyadvancedMetadata makes use of Roo''s
    MethodMetadataBuilder to create an instance of MethodMetadata.


