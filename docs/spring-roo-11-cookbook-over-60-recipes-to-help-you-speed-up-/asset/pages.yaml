- pgno: 216
  md: 'The standard.properties file contains the following property:


    ```

    styleSheet-resources/styles/standard.css

    ```


    As you can see, both alt.properties and standard.properties define a styleSheet
    property, which refers to a CSS file. Depending upon the theme you choose in the
    Roo-generated web application, an appropriate style sheet is applied to the web
    application.


    The next question that you may ask is–how the Spring Web MVC application comes
    to know which theme to apply? Well, this is where the following Roo-generated
    CookieThemeResolver configuration comes into play:


    ```

    <bean class="org.springframework.web.servlet.theme.

    CookieThemeResolver"

    id="themeResolver" p:cookieName="theme"

    p:defaultThemeName="standard"/>

    ```


    The cookieName attribute specifies the name of the cookie, which contains the
    theme that applies to the web application. If no cookie is found, then the configuration
    uses the theme identified by the defaultThemeName attribute, which happens to
    be standard; therefore, the theme defined by standard.properties is used by default
    by the Roo-generated Spring Web MVC application.


    Now, we know how themes are defined using property files and how a theme is configured
    for Spring Web MVC application. Let''s now see how theme resources are accessed
    by JSPX views:


    JSPX views access theme resources such as images and CSS defined in property files
    using the <theme> tag of Spring''s tag library, as shown here:


    ```

    <spring:theme code="header_image" var="headerImg" />

    ```


    The code attribute identifies the name of the property, which you want to access
    from the theme properties file. The var attribute of the <theme> tag specifies
    the name of the variable in which the property value is stored. The theme property
    file from which the property is read is dependent upon the current theme that
    applies to the web application. For instance, if the current theme is standard,
    then the header_image property is read from the standard.properties file, if the
    current theme is custom, then header_image property is read from the custom.properties
    file, and so on.


    The ResourceBundleThemeSource supports configuring localized themes also. For
    instance, the standard_es.properties file in /WEB-INF/classes defines theme resources,
    which apply when the language is es and the theme is standard.


    Now, coming to how you add your custom theme name at the bottom of the web page
    of the Roo-generated web application. All you need to do is to modify the theme.tagx
    file, which is responsible for showing all the theme hyperlinks. When you select
    the theme of your choice, the ThemeChangeInterceptor comes into picture, which
    allows for changing the current theme on every request.'
