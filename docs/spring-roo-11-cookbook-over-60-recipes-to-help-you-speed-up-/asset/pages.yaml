    \  - Adds implementation for the equals and hashCode methods of the java.lang.Object\
    \ class\n\nThe @RooIdentifier annotation accepts two attributes—gettersByDefault\
    \ and settersByDefault, which allow you to control the creation of getter and\
    \ setter methods for the fields defined in the FlightKey class. @RooIdentifier\
    \ also accepts a third attribute, dbManaged, which is useful if the JPA entity\
    \ was created by Roo using database reverse engineering. We'll discuss the dbManaged\
    \ attribute in detail in the Creating entities from a database recipe of Chapter\
