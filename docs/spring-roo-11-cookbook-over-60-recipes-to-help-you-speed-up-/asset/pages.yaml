  md: '+   Creates an application context XML file: applicationContext-security.xml
    in SRC_MAIN_RESOURCES/META-INF/spring directory. The applicationContext-security.xml
    file configures authentication and authorization requirements of the application.


    +   Adds Spring Security''s DelegatingFilterProxy servlet filter to the web.xml
    file of the flightapp-web application, as shown here:


    ```

    <filter>

    <filter-name>springSecurityFilterChain</filter-name>

    <filter-class>org.springframework.web.filter.DelegatingFilterProxy</filter-class>

    </filter>


    <filter-mapping>

    <filter-name>springSecurityFilterChain</filter-name>

    <url-pattern>/*</url-pattern>

    </filter-mapping>

    ```


    The DelegatingFilterProxy servlet filter acts as an entry point into Spring Security''s
    web module, which handles web request security. The name of the filter springSecurityFilterChain
    refers to the name of Spring Security''s FlightChainProxy Instance configured
    in the applicationContext-security.xml file. The DelegatingFilterProxy filter
    delegates web request to FlightChainProxy instance for performing web request
    security.


    +   Creates a login JSPX page login.jspx in the SRC_MAIN_WEBAPP\\WEB-INF\\views
    directory.


    +   Adds tiles definition for the login page in the SRC_MAIN_WEBAPP\\WEB-INF\\views\\views.xml
    tiles definitions XML file, as shown here:


    ```

    <definition extends="public" name="login">

    <put-attribute name="body"

    value="/WEB-INF/views/login.jspx"/>

    </definition>

    ```


    +   Configures a ParameterizableViewController (via view-controller element of
    mvc namespace of Spring) in webmvc-config.xml file (located in SRC_MAIN_WEBAPP\\WEB-INF\\spring
    directory) that dispatches request to login.jspx page, as shown here:


