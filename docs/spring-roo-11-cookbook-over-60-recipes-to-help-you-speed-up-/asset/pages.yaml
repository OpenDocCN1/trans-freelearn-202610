- pgno: 242
  md: 'The onModuleLoad method is like Java''s main method, and is responsible for
    initializing the flightapp-gwt application. In the Scaffold class, the onModuleLoad
    method is responsible for creating the application''s web UI, registering event
    handlers with EventBus, and so on. The DesktopInjectorWrapper and MobileInjectorWrapper
    classes represent a wrapper around GIN''s Ginjector implementation.


    # Dependency injection using GIN


    GIN is a dependency injection framework that uses Google Guice framework to support
    dependency injection in GWT applications. In GWT applications, references to objects
    that are needed throughout the application can be created using GIN or a factory.
    The Roo-generated flightapp-gwt GWT application makes use of GIN to create EventBus,
    ApplicationRequestFactory, and PlaceController—objects that are used across the
    flightapp-gwt application. The following table describes the importance of these
    objects in the flightapp-gwt application:


    | Object | Description |

    |---|---|

    | EventBus | The EventBus is used in a GWT application for publishing events and
    registering event handlers. |

    | ApplicationRequestFactory | A Roo-generated interface that extends GWT''s RequestFactory
    interface. The implementation of this interface is generated by the GWT compiler.
    The flightapp-gwt application makes use of RequestFactory to interact with the
    JPA layer. |

    | PlaceController | A GWT Place represents a location in a GWT application. If
    you select the Flights menu option from the UI of the flightapp-gwt application,
    then it represents a place. Now, if you select the FlightDescriptions option from
    the UI, then it represents a different place in the application. GWT''s PlaceController
    is used to navigate from one place to another in the GWT application. |


    Now that we know what objects are used across the flightapp-gwt application, let''s
    look at how GIN creates these objects and how these objects are injected into
    objects that depend on them.'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'To understand how Ginjector is used in flightapp-gwt, let''s look at the following
    class diagram:


