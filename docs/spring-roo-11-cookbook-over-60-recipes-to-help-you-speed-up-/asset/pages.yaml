- pgno: 349
  md: 'Spring Roo 1.1.3 generates pom.xml, which makes project dependent on GAE SDK
    1.4.0 and Maven GAE plugin 0.5.7, as shown in the listing we just saw. At the
    time of writing this book, the current version of GAE SDK is 1.5.1 and that of
    Maven GAE plugin is 0.8.4. To change the version of GAE SDK, modify the gae.home
    property. And, to change the version of Maven GAE plugin, simply modify the value
