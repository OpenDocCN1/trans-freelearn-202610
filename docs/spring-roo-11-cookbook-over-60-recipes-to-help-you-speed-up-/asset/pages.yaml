- pgno: 212
  md: '# # Adding or modifying themes generated by Roo


    A theme is a collection of CSS and image files that define the overall look and
    feel of the web application. Spring Web MVC framework provides built-in support
    for defining and applying themes. In the Auto-generating Spring MVC controllers
    and JSPX views from JPA entities recipes, we touched upon themes support in Roo-generated
    Spring Web MVC applications. In this recipe, we''ll see in detail how to add new
    themes to Roo-generated Spring Web MVC applications and to modify default themes
    installed by Roo.


    In this recipe, we''ll make the following modifications to the Roo-generated `flight-app`
    web application:


    +   - Add a new custom theme

    +   - Modify existing themes to show different background color of menu headings,
    and different header images

    +   - Add a new `standard` theme, which is applied if the language is `es` (that
    is, Espanol)


    # ## Getting ready


    Delete the contents of `ch04-recipe` the sub-directory inside the `C:\roo-cookbook`
    directory.


    Copy the `ch04_web-app.roo` script into the `ch04-recipe` directory.


    Execute the `ch04_web-app.roo` script that creates the `flight-app` Roo project,
    sets up Hibernate as the persistence provider, configures MySQL as the database
    for the application, creates the `Flight` and `FlightDescription` JPA entities
    and defines a many-to-one relationship between the `Flight` and `FlightDescription`
    entities. If you are using a different database than MySQL or your connection
    settings are different than what is specified in the script, then modify the script
    accordingly.


    Start the Roo shell from the `C:\roo-cookbook\ch04-recipe` directory.


    Execute the `controller all` command to create controllers and views corresponding
    to the JPA entities in the `flight-app` project, as shown here:


    ```

    .. roo> controller all --package ~.web

    ```


    Execute the `perform eclipse` command to update the project''s classpath settings,
    as shown here:


    ```

    .. roo> perform eclipse

    ```


    Now, import the `flight-app` project into your Eclipse IDE.'
  merge: -1
  img_proc: true
