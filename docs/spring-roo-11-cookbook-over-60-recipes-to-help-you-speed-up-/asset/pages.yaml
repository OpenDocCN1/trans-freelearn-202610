  md: '# Providing custom implementation for integration tests


    As with the ''data on demand'' class, you can provide a custom implementation
    for an integration test method in your *IntegrationTest.java class. For instance,
    if you want to modify the testPersist Roo-generated test method with a customized
    testPersist method, create a testPersist method in the FlightIntegrationTest.java
    file. Adding the testPersist method to *IntegrationTest.java results in the removal
    of the testPersist method from the corresponding *_Roo_IntegrationTest.aj file
    by Roo. Similarly, you can customize any other test method defined in the *_Roo_IntegrationTest.aj
    file.


