- pgno: 380
  md: 'In this chapter, we''ll look at recipes which show how Roo simplifies installing,
    developing, and publishing add-ons. Also, we''ll take a broad look at the Roo
    architecture and Roo commands which you''ll find useful while developing and testing
    add-ons.


    # Setting up GnuPG for add-on development


    Roo makes use of GnuPG (http://www.gnupg.org/) to sign add-ons. Signing of add-ons
    ensures that Roo users download and install only trusted add-ons. The add-on creator
    module of Roo signs the add-on with his secret PGP key and publishes the public
    PGP key to a public key server. A Roo user needs to tell Roo explicitly that it
    trusts an add-on by adding a public PGP key to Roo''s key store. This allows Roo
    to download and install the add-on. If the public PGP key is not added to Roo''s
    key store, the add-on will not be downloaded and installed.


    In this recipe, we''ll look at how to install GnuPG, create a key-pair (consisting
    of secret and public keys), and publish the public key to a public key server.


    # Getting ready


    If you are using Windows or UNIX, download and install GnuPG from the following
    location: http://www.gnupg.org/download/. If you are using Mac, download and install
    GnuPG for Mac from the following location: http://macgpg.sourceforge.net/.


    Installing GnuPG on Windows will create the following installation directory:
    C:\\Program Files\\GNU\\GnuPG.


    # How to do it...


    The following steps will demonstrate how to set up GnuPG:


    +   1. Open the command prompt and execute the following GnuPG `list-secret-keys`
    command to view secret PGP keys that you may have created earlier:


    ```

    C:\\Users\\Ashish>gpg --list-secret-keys

    gpg: keyring ''C:/Users/Ashish/AppData/Roaming/gnupg\\secring.gpg''

    created

    ```


    The output shows that a `secring.gpg` file is created if it is not found. The
    `secring.gpg` file contains key information.


    +   2. Create a new key-pair consisting of a secret PGP key and public PGP key
    using GnuPG''s `gen-key` command, as shown here:


    ```

    C:\\Users\\Ashish>gpg --gen-key

    ...

    Please select what kind of key you want:

    ```'
  merge: -1
