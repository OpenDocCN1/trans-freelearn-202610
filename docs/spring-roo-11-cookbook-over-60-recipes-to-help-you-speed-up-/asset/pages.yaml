    # There''s more...


    Let''s now look at how to send e-mails asynchronously, how to send more refined
    e-mails consisting of attachments, inline images, and so on, and finally how to
    send e-mails when the JavaMail Session is configured in JNDI.


    # Sending e-mails asynchronously


    E-mail sending that we have discussed so far in this recipe, is synchronous in
    nature. Typically, e-mails are sent asynchronously by applications—something which
    can be achieved in Spring via the @Async annotation. The field email template
    command supports an async argument, that instructs Roo to do the following:


    +   Create the sendMessage method, which is annotated with the @Async Spring annotation


    +   Enable detection of the @Async annotated methods using the <annotation-driven>
    element of Spring''s task namespace, as shown here:

    +   <task:annotation-driven executor="asyncExecutor"

    +   mode="aspectj" />


    The executor attribute refers to an implementation of the java.util.concurrent.Executor
    interface, responsible for executing the @Async annotated method.


    +   Configure Spring''s ThreadPoolTaskExecutor in application context XML using
    the <executor> element of Spring''s task namespace, as shown here:

    +   <task:executor id="asyncExecutor"

    +   pool-size="${executor.poolSize}" />'
