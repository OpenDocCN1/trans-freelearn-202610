    \ IF EXISTS 'customer_tbl';\nCREATE TABLE IF NOT EXISTS 'customer_tbl' (\n 'cust_id'\
    \ int(10) NOT NULL,\n 'cust_dob' date NOT NULL,\n 'cust_name' varchar(50) NOT\
    \ NULL,\n PRIMARY KEY ('cust_id','cust_dob')\n)\n```\n\nExecuting the SQL statement\
    \ will create the `CUSTOMER_TBL` table in the `myflightappdb` database.\n\n+ \
