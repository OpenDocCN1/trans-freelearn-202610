- pgno: 54
  md: '# How to do it...


    Spring Roo provides the interface command to create a Java interface, as shown
    here:


    ```

    roo> interface --class sample.roo.flightapp.service.FlightServiceIntf

    ```


    ```

    Created SRC_MAIN_JAVA\sample\roo\flightapp\service\FlightServiceIntf.java

    ```


    ```

    sample.roo.flightapp.service.FlightServiceIntf roo>

    ```


    # How it works...


    The following table describes the arguments that the interface command accepts:


    | Argument | Purpose |

    | --- | --- |

    | class | It is a mandatory argument, which specifies the fully-qualified name
    of the Java interface. |

    | path | It is an optional argument, which identifies the directory in which to
    create the interface, default being SRC_MAIN_JAVA. |

    | permitReservedWords | It is an optional argument, which instructs Spring Roo
    to allow reserved words in the name of Java interface. |


    # There''s more...


    Using Spring Roo you can add constants or declare methods in your Java interface.
    To add constants or methods, you need to use your IDE. You may have noticed that
    the rooAnnotations argument is not available for the interface command; therefore,
    you can safely assume that Spring Roo doesn''t generate any code corresponding
    to a Java interface when you make modifications to it.


    # See also


    +   - The Creating a Java class recipe shows how to create a Java class using
    Spring Roo


    # Referring to a type from the Roo shell


    In some scenarios, you may want to set the focus of your commands to a particular
    Java type. For instance, you may want the Roo shell to execute field commands
    on a particular Java type, so that you don''t need to specify the class argument
    in your field commands.'
  merge: -1
