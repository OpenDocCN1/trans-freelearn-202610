- pgno: 282
  md: 'The following sequence diagram summarizes the role played by the entity_doubleClickHandler
    method:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_282_0.png)


    It is important to note that the entityList_doubleClickHandler method of the flightapp_flex_scaffold.mxml
    file never directly references either the FlightView or FlightDescriptionView
    ActionScript class. In fact, FlightView and FlightDescriptionView classes are
    not referenced by any other MXML or ActionScript class in the flightapp_flex project.
    The side-effect of this is that the Flex compiler doesn''t include FlightDescriptionView
    and FlightView in the generated SWF file. To instruct Flex compiler to include
    FlightDescriptionView and FlightView ActionScript classes, Roo adds their fully-qualified
    name in the flightapp_flex_scaffold-config.xml file, as shown here:


    ```

    flightapp_flex_scaffold-config.xml

    <flex-config xmlns="http://www.adobe.com/2006/flex-config">

