- pgno: 354
  md: '# Deploying a Spring Web MVC application on GAE


    As of Spring Roo 1.1.5, the Roo-generated Spring Web MVC application doesn''t
    work on GAE. The reason for this is related to mismatch in the JSTL version used
    by GAE and by the Roo-generated Spring MVC application. Also, Roo-generated JPA
    entities support only unowned relationships (refer http://code.google.com/appengine/docs/java/datastore/jdo/relationships.html
    to learn about owned and unowned relationships). In this recipe, we''ll look at
    a Spring 3.0 Web MVC application (which uses JSTL tags that work on GAE) consisting
    of FlightDescription and Flight JPA entities and demonstrates how to create a
    unidirectional owned one-to-many relationship between JPA entities. The FlightDescription
    entity is on the one side of one-to-many relationship.


    If you are using Spring Roo 1.2.x, then the Roo-generated Spring Web MVC application
    can be deployed successfully on GAE.


    # Getting ready


    If you only want to run the Spring Web MVC application locally using App Engine
    SDK for Java, then you don''t need to sign-up with Google App Engine and create
    an application identifier. If you want to deploy the application on GAE, then
    follow the steps described in the previous recipe and ensure that you modify the
    application identifier in WEB-INF/appengine-web.xml file. It is recommended that
    you deploy the application on GAE servers, as we''ll also discuss some of the
    features offered by Admin Console.


    Extract the ch06-gae-spring-mvc.zip file that accompanies this book to the C:\roo-cookbook
    directory. Extracting the ZIP file will create a directory named ch06-gae-spring-mvc,
    which contains the flightapp-gae-spring-mvc Eclipse project. The flightapp-gae-spring-mvc
    project makes use of App Engine SDK version 1.4.2 and Maven GAE Plugin 0.8.2.


    # How to do it...


    To deploy a Spring Web MVC application on GAE follow the steps given here:


    +   1. Open the command prompt and go to c:\roo-cookbook\ch06-gae-spring-mvc directory.
    Execute mvn gae:run command to deploy the flightapp-gae-spring-mvc project on
    App Engine development web server:

    +   C:\roo-cookbook\ch06-gae-spring-mvc> mvn gae:run


    +   2. Once the development web server starts successfully, open web browser and
    go to the following URL: http://localhost:8080. If you see the following page,
    then it means that your flightapp-gae-spring-mvc project is successfully deployed:'
