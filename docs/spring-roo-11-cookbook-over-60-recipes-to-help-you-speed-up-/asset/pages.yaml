- pgno: 197
  md: "Let's now see how you can override the auto-generated methods in the * _Roo_Controller\
    \ .aj file:\n\n# Overriding auto-generated controller methods\n\nIn some scenarios,\
    \ you may want to override the auto-generated methods of the *_Roo_Controller.aj\
    \ file to provide custom implementation. To override a method defined in ITD,\
    \ all you need to do is to define a method with the same or different arguments\
    \ and return types, but with the same name, in your controller Java file.\n\n\
    Let's say that in our flight-app web application we need to address the following\
    \ requirements:\n\n+   - Currently, when a Flight entity instance is updated the\
    \ FlightController shows the updated entity instance in a read-only view. This\
    \ default functionality needs to be changed such that after update, the controller\
    \ shows the list of Flight instances.\n+   - To address this requirement, we need\
    \ to override the default behavior of the update method defined in the FlightController_Roo_Controller.aj\
    \ ITD. To override the default behavior of the update method, all you need to\
    \ do is to define an update method (with the same or different arguments and return\
    \ types) in the FlightController.java file, as shown here:\n+   \n+   @RequestMapping(method\
    \ = RequestMethod.PUT)\n+   public String update(@Valid Flight flight, ..) {\n\
    +   ...\n+   return \"redirect: /myflightpath/list\";\n+   }\n\nIn the given code,\
    \ the update method redirects the user to myflightpath/list (instead of /myflightpath/{flightId})\
    \ after persisting changes to the Flight entity.\n\n> In Spring Roo 1.1.3, if\
    \ you attempt to override a method defined in the *_Roo_Controller.aj file by\
    \ defining it in your *Controller.java file, then Roo complains that the method\
