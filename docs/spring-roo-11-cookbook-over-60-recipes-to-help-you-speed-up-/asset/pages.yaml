- pgno: 200
  md: "+   4. In the Customer.java file, make the association between the Customer\
    \ and Address entities as mandatory by setting the optional attribute value of\
    \ the @OneToOne JPA annotation to false. Also, set the cascade attribute value\
    \ of @OneToOne to CascadeType.ALL. The following listing shows the modified @OneToOne\
    \ annotation in Customer.java:\n\n```\nimport javax.persistence.CascadeType;\n\
    ..\n@RooEntity(table = \"CUSTOMER_TBL\")\npublic class Customer {\n    @NotNull\n\
    \    @Column(name = \"CUST_NAME\")\n    private String customerName;\n    @OneToOne\
    \ (optional= false, cascade=CascadeType.ALL)\n    @JoinColumn(name = \"CUSTOMER_ID\"\
    )\n    private Address address;\n}\n```\n\n+   5. In the Address.java file, make\
    \ the association between the Address and Customer entities as mandatory by setting\
    \ the optional attribute value of the @OneToOne annotation to false. As the Customer\
    \ entity is the owner of the relationship, set the mappedBy attribute value of\
    \ the @OneToOne JPA annotation to address. The following listing shows the modified\
    \ @OneToOne annotation in Address.java:\n\n```\n...\n@RooEntity(table = \"ADDRESS_TBL\"\
    )\npublic class Address {\n    @NotNull\n    @Column(name = \"ADDRESS_LINE1\"\
    )\n    private String addressLine1;\n    ...\n    @OneToOne (optional=false, mappedBy\
    \ = \"address\")\n    private Customer customer;\n}\n```\n\nAs in Spring Roo 1.1.5,\
    \ the field reference command doesn't support any argument, which lets you specify\
    \ the owner of the one-to-one bidirectional relationship; therefore, you need\
    \ to edit your Java source for specifying the mappedBy attribute value of the\
    \ @OneToOne annotation. On the other hand, the field set command does provide\
    \ a mappedBy argument for specifying the relationship owner.\n\n+   6. Replace\
    \ the CustomerController.java file in the sample.roo.flightapp.web package of\
    \ SRC_MAIN_JAVA folder with the one contained in the source code folder of this\
    \ chapter."
