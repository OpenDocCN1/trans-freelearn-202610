    To create the Flight and FlightDescription JPA entities with a many to one relationship,
    follow the steps given here:


    +   1. Create the Flight JPA entity (including integration tests) corresponding
    to the FLIGHT_TBL table:

    +   .. roo> entity --class ~.domain.Flight --identifierColumn FLIGHT_ID

    +   --identifierField flightId --identifierType java.lang.Long

