- pgno: 261
  md: '# Enabling remote logging


    The GWT logging framework emulates Java Logging API, making it possible to log
    messages from the Java code that resides in the sample.roo.client package and
    its sub-packages. As we mentioned earlier, Java classes contained inside the sample.roo.client
    package and its sub-packages are translated into JavaScript by the GWT compiler.
    The remote logging capability in GWT enables client code to send log messages
    to the server-side logging infrastructure. To configure remote logging, set the
    value of the gwt.logging.simpleRemoteHandler property to ENABLED in the ApplicationScaffold.gwt.xml
    file:


    ```

    <set-property name="gwt.logging.simpleRemoteHandler"

    value="ENABLED"/>

    ```


    The above configuration enables remote logging of messages. GWT provides a RemoteLoggingServiceImpl
    servlet, which acts as a handler for logging messages received from the client-side.
    You''ll need to configure RemoteLoggingServiceImpl servlet in your web.xml file,
    as shown here:


    ```

    <servlet>

    <servlet-name>remoteLogger</servlet-name>

    <servlet-class>

    com.google.gwt.logging.server.RemoteLoggingServiceImpl

    </servlet-class>

    </servlet>

    ```


    ```

    <servlet-mapping>

    <servlet-name>remoteLogger</servlet-name>

    <url-pattern>

    /applicationScaffold/remote_logging

    </url-pattern>

    </servlet-mapping>

    ```


    The important point to note is that the RemoteLoggingServiceImpl servlet should
    be mapped to the /<module_name>/remote_logging URL.


    As the method names of the Java class in the client-side are obfuscated when the
    GWT compiler converts them into JavaScript, you need to resymbolize or deobfuscate
    them by setting the following properties in the ApplicationScaffold.gwt.xml file:


    ```

    <set-property name="compiler.emulatedStack" value="true" />

    <set-configuration-property

    name="compiler.emulatedStack.recordLineNumbers"

    value="true" />

    <set-configuration-property

    name="compiler.emulatedStack.recordFileNames"

    value="true" />

    ```'
  merge: -1
  img_proc: true
