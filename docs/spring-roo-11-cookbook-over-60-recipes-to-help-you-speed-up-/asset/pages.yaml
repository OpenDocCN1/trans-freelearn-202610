- pgno: 91
  md: "The figure shows that **Spring Roo Shell** monitors the **FlightDataOnDemand.java**\
    \ class (because it is annotated with Roo's **@RooDataOnDemand** annotation).\
    \ When any change is made to the **FlightDataOnDemand.java** class, Roo triggers\
    \ add-on(s) responsible for managing the AspectJ ITD file(s) corresponding to\
    \ the **FlightDataOnDemand.java** class. In the case of **FlightDataOnDemand**,\
    \ Roo triggers **Dod add-on** (“data on demand”) to update **FlightDataOnDemand_Roo_DataOnDemand.aj**\
    \ AspectJ ITD, so that the AspectJ ITD is in sync with the **FlightDataOnDemand.java**\
    \ class. When you add **setNumOfSeats**, **setOrigin**, and **setDestination**\
    \ methods in the **FlightDataOnDemand.java** class, **Dod add-on** checks if the\
    \ methods already exist there. If they exist, **Dod add-on** removes those methods\
    \ from the **FlightDataOnDemand_Roo_DataOnDemand.aj** AspectJ ITD.\n\nIt is important\
    \ to note that modifying a Java class that is annotated with Roo annotations may\
    \ result in multiple AspectJ ITDs getting affected. For instance, if you remove\
    \ the **modifiedBy** field from the **Flight_Roo_JavaBean.aj**, Roo will update\
    \ the **Flight_Roo_ToString.aj**, and **FlightDataOnDemand_Roo_DataOnDemand.aj**\
    \ AspectJ ITD files to reflect the removal of the **modifiedBy** field.\n\n# Controlling\
    \ integration test methods\n\nWe mentioned earlier that the **@RooIntegrationTest**\
    \ annotation in **\\*IntegrationTest.java** defines attributes which let you control\
    \ the integration test methods that are auto-generated by Roo in the **\\*_Roo_IntegrationTest.aj**\
    \ AspectJ ITD file. The **@RooIntegrationTest** annotation defines the following\
    \ attributes to control the auto-generation of integration test methods: count,\
    \ find, findAll, findAllMaximum, findEntries, flush, merge, persist, and remove.\
    \ If the value of any of these attributes is specified as false, then the corresponding\
    \ test method is removed from the **\\*_Roo_IntegrationTest.aj** AspectJ ITD file.\
    \ For instance, the **testFindAllFlights** method searches for all **Flight**\
    \ instances in the database, which may not be desirable for performance reasons.\
    \ To instruct Spring Roo to remove the auto-generated **testFindAllFlights** method\
    \ from the **FlightIntegrationTest_Roo_IntegrationTest.aj** file, all you need\
    \ to do is to specify the value of the **findAll** attribute value as false in\
    \ the **@RooIntegrationTest** annotation, as shown here:\n\n```\n@RooIntegrationTest(entity\
    \ = Flight.class, findAll=false)\npublic class FlightIntegrationTest {\n    ...\n\
    }\n```\n\n# Generating integration tests at the time of entity creation\n\nIn\
    \ this recipe we saw how to create integration tests using the **test integration**\
    \ command. You can also use the **testAutomatically** argument of the **entity**\
    \ command to instruct Roo to create integration tests at the time of entity creation,\
    \ as shown here:\n\n```\nroo> entity --class ~.domain.Flight --testAutomatically\
    \ --identifierType ~.domain.FlightKey --table FLIGHT_TBL\n```"
