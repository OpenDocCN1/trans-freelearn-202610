- pgno: 268
  md: 'The following <services> element of the services-config.xml file shows the
    application-level default channels configuration:


    ```

    <services>

    <default-channels>

    <channel ref="amf" />

    </default-channels>

    </services>

    ```


    This <default-channels> element specifies that if a Flex component doesn''t specify
    the channel to be used, then use the amf channel for communication.


    Roo also configures server-side logging in services-config.xml using the <logging>
    element, as shown here:


    ```

    <logging>

    <target class="flex.messaging.log.ConsoleTarget"

    level="Warn">

    <properties>

    <prefix>[BlazeDS] </prefix>

    <includeDate>false</includeDate>

    <includeTime>false</includeTime>

    <includeLevel>false</includeLevel>

    <includeCategory>false</includeCategory>

    </properties>

    <filters>

    <pattern>Endpoint.*</pattern>

    <pattern>Service.*</pattern>

    <pattern>Configuration</pattern>

    </filters>

    </target>

    </logging>

    ```


    The logging configuration specifies where the log messages are written, what types
    of messages are written, how they are written, and the log messages generated
    by each category (like Endpoint, Service, and so on) are written. The class attribute
    (of target element) value of flex.messaging.log.ConsoleTarget means that the log
