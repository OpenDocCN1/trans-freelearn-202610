    To invoke server-side services, the GWT application''s client-side code needs
    to have client-side stubs for remote services. The client-side code makes use
    of service stubs to invoke remote services. A service stub is defined by an interface
    that extends GWT''s RequestContext interface and defines methods with a signature
    similar to that of the corresponding remote service methods. We''ll shortly see
    the difference between methods defined in the remote service class and the client-side
    service stub.


    By default, Roo generates rich entities and the resulting application doesn''t
    have a service layer; therefore, in the case of the Roo-generated GWT application
    a service stub defines methods corresponding to the JPA entity class. The following
    code shows the Roo-generated FlightRequest service stub corresponding to the Flight
    JPA entity in flightapp-gwt application:


