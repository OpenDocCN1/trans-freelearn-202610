    entities recipe to know more about configurations defined in the webmvc-config.xml
    file


    # Adding JSON support to domain objects and controllers


    Let''s say that you have developed the persistence layer of your application using
    Roo. Now, you want to expose the CRUD operations and dynamic finder methods defined
    in the Roo-generated JPA entities to the outside world via a RESTful interface.'
