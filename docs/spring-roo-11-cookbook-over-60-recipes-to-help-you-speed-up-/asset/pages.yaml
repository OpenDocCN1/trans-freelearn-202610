    # There''s more...


    Let''s now look at:


    +   - How to compile and run the Roo-generated GWT application in an embedded
    Jetty container

    +   - How to access the mobile version of the Roo-generated flightapp-gwt application

    +   - Round-tripping support in the Roo-generated GWT application

    +   - How to enable remote logging


    # Compiling and running the GWT application in an embedded Jetty container


    In the Development Mode, the GWT application is not compiled into JavaScript.
    You can compile the GWT application into JavaScript and run it using an embedded
    Jetty container by executing `mvn jetty:run-exploded` command, as shown here:


    ```

    C:\roo-cookbook\ch05-gwt> mvn jetty:run-exploded

    ```


    You can now access the `flightapp-gwt` application by entering the following URL:
    `http://localhost:8080/flightapp-gwt/index.html`


    # Accessing the mobile version of the GWT application


    If you have compiled and deployed the `flightapp-gwt` application using the `mvn
    jetty:run-exploded` command, then access the mobile version of the `flightapp-gwt`
    application using the following URL:


    ```

    http://localhost:8080/flightapp-gwt/index.html&m=true

    ```


    If you are running the `flightapp-gwt` application in Development Mode, then use
    the following URL:


    ```

    http://127.0.0.1:8888/ApplicationScaffold.html?gwt.codesvr=127.0.0.1:9997&m=true

    ```'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'In either case, you''ll see the mobile version of the flightapp-gwt application,
    as shown here:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_260_0.png)


    In this screenshot, the **Flights** and **FlightDescriptions** options are clickable,
    and by selecting them you can get started with performing CRUD operations on JPA
    entity instances.


    # Round-tripping support for GWT applications


    If you add, modify, or delete any field from a JPA entity in the Roo-scaffolded
    GWT application, then Roo makes the necessary changes to GWT artifacts accordingly.
    To see Roo''s round-tripping support for the scaffolded GWT application, start
    the Roo shell from the root directory of the flightapp-gwt project and add an
    aircraftModel field to the FlightDescription entity using the field command or
    by editing the FlightDescription.java file directly from your IDE. In response
    to the addition of the aircraftModel attribute, the Roo shell shows the following
    actions taken by Roo:


    ```

    Updated ...FlightDescriptionProxy.java

    Updated ...FlightDescriptionListView_Roo_Gwt.java

    Updated ...FlightDescriptionDetailsView_Roo_Gwt.java

    Updated ...FlightDescriptionDetailsView.ui.xml

    Updated ...FlightDescriptionEditView_Roo_Gwt.java

    Updated ...FlightDescriptionEditView.ui.xml

    ...

    ```


    The output shows that Roo updates the GWT entity proxy, FlightDescriptionProxy,
    and other GWT artifacts to reflect the modification to the FlightDescription JPA
    entity. The other important thing to notice is that most of the modifications
    are limited to *\_Roo_Gwt.java files–files that are managed by Roo. So, if you
    make changes to files that don''t follow the naming convention *\_Roo_Gwt.java,
    then such changes will be preserved by Roo (except in the case that you are modifying
    Java files in the *.client.managed.* package). In the Roo-scaffolded GWT application,
    *\_Roo_Gwt.java files are equivalent to *\_Roo_.aj AspectJ ITD files, that is,
    Roo attempts to minimize the impact on the scaffolded GWT code by only modifying
    *\_Roo_Gwt.java files.'
