    As MXML files are compiled into ActionScript classes, `FlightDescriptionView.mxml`
    and `FlightView.mxml` files are converted to `FileDescriptionView` and `FlightView`
    ActionScript classes, respectively. The `entityList_doubleClickHandler` method
    obtains the selected item value from the list (which is either **FlightDescription**
    or **Flight**) and appends ''View'' string to it—making the concatenated value
    to `FlightDescriptionView` or `FlightView`. The `entityList_doubleClickHandler`
    then creates an instance of `FlightDescriptionView` or `FlightView` and adds it
    to the main user interface.'
