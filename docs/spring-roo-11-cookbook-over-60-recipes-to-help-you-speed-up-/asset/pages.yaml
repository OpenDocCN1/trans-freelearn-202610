  md: "Let's now look in detail at the applicationContext-security.xml file.\n\n#\
    \ Spring Security application context XML file\n\nThe applicationContext-security.xml\
    \ file configures Spring Security beans, which are used for authentication and\
    \ authorization of requests. As we'll see shortly, Roo-generated applicationContext-security.xml\
    \ doesn't do much but gives a good starting point to configure your application-specific\
    \ security.\n\n# AuthenticationManager configuration\n\nAuthentication mechanism\
    \ for the application is configured in applicationContext-security.xml via the\
    \ <authentication-manager> element of Spring's security namespace, as shown here:\n\
    \n```\n```xml\n<authentication-manager alias=\"authenticationManager\">\n<authentication-provider>\n\
    <password-encoder hash=\"sha-256\" />\n<user-service>\n<user name=\"admin\" password=\"\
    ...\" \nauthorities=\"ROLE_ADMIN\" />\n<user name=\"user\" password=\"...\" \n\
    authorities=\"ROLE_USER\" />\n</user-service>\n</authentication-provider>\n</authentication-manager>\n\
    ```\n```\n\nLet's look in detail at each of the elements in the given configuration\
    \ and how they work together to provide authentication services to the application:\n\
    \n+   ▶ <authentication-manager>: It registers an instance of Spring Security's\
    \ AuthenticationManager implementation that is responsible for providing authentication\
    \ services. AuthenticationManager delegate's authentication to the AuthenticationProvider\
    \ is configured using the <authentication-provider> sub-elements."
  merge: -1
  img_proc: true
- pgno: 325
  md: "+   - <authentication-provider>: It registers an instance of Spring Security's\
    \ AuthenticationProvider implementation. Spring Security provides a couple of\
    \ built-in implementations of the AuthenticationProvider interface to simplify\
    \ incorporating different authentication mechanisms in the application. For instance,\
    \ if you are using JA-SIG CAS for authentication, you can use CasAuthenticationProvider\
    \ implementation and if you are using an LDAP server for authentication, you can\
    \ use LdapAuthenticationProvider, and so on. The AuthenticationProvider implementation\
    \ usage is specified using the ref attribute of the <authentication-provider>\
    \ element. If the ref attribute is not specified (as in the case of Roo-generated\
    \ applicationContext-security.xml) DaoAuthenticationProvider implementation is\
    \ registered. DaoAuthenticationProvider makes use of Spring Security's UserDetailsService\
    \ to authenticate users. UserDetailsService loads user details containing username,\
    \ password, and granted authorities based on the username entered by the application\
    \ user. DaoAuthenticationProvider authenticates the user by comparing the password\
    \ entered by the application user with the user details loaded by UserDetailsService.\n\
    +   - <user-service>: It creates an in-memory UserDetailsService instance that\
    \ reads user details from a properties file or from the nested <user> elements.\n\
    +   - <user>: It defines a user of the application. The name and password attributes\
    \ identify the username and password required for authentication.\n+   - <password-encoder>:\
    \ It converts submitted passwords to hashed versions before comparing the submitted\
    \ password with the one retrieved by UserDetailsService. The hash attribute specifies\
    \ the hashing algorithm to use for encoding password.\n\n# Web request security\
    \ configuration\n\nThe following `<http>` element shows how web request security\
    \ is configured in the applicationContext-security.xml file:\n\n```\n<http auto-config=\"\
    true\" use-expressions=\"true\">\n    <form-login\n        login-processing-url=\"\
    /resources/j_spring_security_check\"\n        login-page=\"/login\"\n        authentication-failure-url=\"\
    /login?login_error=t\"/>\n    <logout logout-url=\"/resources/j_spring_security_logout\"\
    />\n    <intercept-url pattern=\"/choices/**\"\n        access=\"hasRole('ROLE_ADMIN')\"\
    />\n    <intercept-url pattern=\"/member/**\"\n        access=\"isAuthenticated()\"\
    \ />\n    <intercept-url pattern=\"/resources/**\"\n        access=\"permitAll\"\
    \ />\n    <intercept-url pattern=\"/**\" access=\"permitAll\" />\n</http>\n```"
