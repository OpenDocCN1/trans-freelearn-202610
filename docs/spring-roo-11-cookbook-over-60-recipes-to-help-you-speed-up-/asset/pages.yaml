  md: 'It is important to note at this point that Spring Security''s LDAP authentication
    mechanism by default prepends ROLE_ to the name of the role returned after authentication.
    So, if the admin user authenticates with the Flight Booking application, then
    instead of admin_user role, it gets the role ROLE_ADMIN_USER. Similarly, user
