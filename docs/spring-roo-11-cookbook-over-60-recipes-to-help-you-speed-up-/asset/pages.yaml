- pgno: 140
  md: "The output of the database introspect command is an XML file (assuming a file\
    \ argument was specified), which contains details of database tables, including\
    \ fields and their type, primary key, foreign key, and so on. If you specify the\
    \ enableViews argument, the generated metadata includes database views also.\n\
    \nThe following XML fragment shows how the database metadata is presented in the\
    \ mydb.xml file:\n\n```\n```xml\n<database name=\"no-schema-required\">\n    <table\
    \ name=\"customer_tbl\">\n        <column name=\"cust_id\" primaryKey=\"true\"\
    \n                required=\"true\" scale=\"0\" size=\"10\" type=\"4 ,INT\"/>\n\
    \        ...\n        <unique name=\"PRIMARY\">\n            <unique-column name=\"\
    cust_id\"/>\n            <unique-column name=\"cust_dob\"/>\n        </unique>\n\
    \    </table>\n    <table name=\"flight_desc_tbl\">\n        <column name=\"flight_desc_id\"\
    \ primaryKey=\"true\"\n                required=\"true\" scale=\"0\" size=\"19\"\
    \ type=\"-5,BIGINT\"/>\n        ...\n        <foreign-key foreignTable=\"flight_tbl\"\
    \n                name=\"FKT7E26BB6F365DD59\" onDelete=\"none\"\n            \
    \    onUpdate=\"none\">\n            <option key=\"exported\" value=\"true\"/>\n\
    \            <reference foreign=\"flight_desc_id\"\n                    local=\"\
    flight_desc_id\"/>\n        </foreign-key>\n        <unique name=\"PRIMARY\">\n\
    \            <unique-column name=\"flight_desc_id\"/>\n        </unique>\n   \
    \ </table>\n    <table name=\"flight_tbl\">\n        ...\n    </table>\n    <table\
    \ name=\"flights_view\">\n        <column name=\"origin_city\" primaryKey=\"false\"\
    \n                required=\"true\" scale=\"0\" size=\"255\" type=\"12,VARCHAR\"\
    />\n        ...\n    </table>\n</database>\n```\n```"
