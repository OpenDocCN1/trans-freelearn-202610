- pgno: 36
  md: 'The perform command is used to execute a Maven command. It accepts a single
    mandatory argument, mavenCommand, which identifies the Maven goal to execute.


    Maven IDEA and Eclipse plugins are configured in the pom.xml file by Spring Roo
    at the project creation time; you don''t need to add them to your Roo project
    to use the commands shown in this recipe.


    # There''s more...


    If you are using any IDE other than STS, then ensure that you install AJDT (AspectJ
    Development Tools), as it gives better development experience when working with
    projects that make use of AspectJ aspects. For instance, when you open a Java
    source file in Eclipse IDE (that has AJDT installed), the Cross Reference tab
    shows the various AspectJ declarations that apply to the selected Java source
    file, and you can select these declarations to open the corresponding AspectJ
    ITD files.


    # See also


    +   - Refer to the Setting up Roo recipe to know how to use STS or Eclipse (with
    STS components) for developing with Spring Roo

    +   - Refer to the Removing Roo-specific details from your project recipe in Chapter
    7, Developing Add-ons and Removing Roo from Projects to see how you can convert
    your Roo project into a normal Java project


    # Configuring logging


    In the Creating a Roo project recipe, you saw that when you create a new project,
    a log4j.properties file is automatically created with default logging configuration.
    In most real projects, you''d like to customize the default logging configuration.
    By default, the log4j.properties file configures root logger at ERROR level and
    logging is not enabled for the project.


    In this recipe, we will look at the logging setup command to modify the logging
    configuration.


    # Getting ready


    Start the Roo shell from the C:\roo-cookbook\ch01-recipe directory, which contains
    the flight-app Roo project.'
