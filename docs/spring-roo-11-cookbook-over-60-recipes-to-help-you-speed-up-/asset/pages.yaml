- pgno: 63
  md: 'The following XML fragment shows the persistence.xml file created by Spring
    Roo:


    ```

    <persistence ...>

    <persistence-unit name="persistenceUnit"

    transaction-type="RESOURCE_LOCAL">

    <provider>org.hibernate.ejb.HibernatePersistence</provider>

    <properties>

    <property name="hibernate.dialect"

    value="org.hibernate.dialect.MySQL5InnoDBDialect"/>

    <property name="hibernate.hbm2ddl.auto" value="create"/>

    ...

    </properties>

    </persistence-unit>

    </persistence>

    ```


    The preceding listing shows that Roo creates a persistence.xml file based on the
    JPA provider and database information that you supplied to the persistence setup
    command. The name attribute of the <persistence-unit> element specifies the persistence
    unit name. If the persistenceUnit argument of persistence setup is not specified,
    then by default, Roo sets the name attribute value to persistenceUnit. The create
    value of the hibernate.hbm2ddl.auto property indicates that every time Hibernate
    SessionFactory is created, the database is re-created. You may want to change
    the value of hibernate.hbm2ddl.auto from create to validate or update or create-drop,
    depending upon how you want Hibernate to manage your database schema based on
    the mappings provided in JPA entities.


    Also, if your enterprise application updates multiple data sources, then you should
    set the value of the transaction-type attribute of the persistence-unit element
    to JTA'' (Java Transaction API), instead of RESOURCE_LOCAL.


    The following code shows the elements that were added to the applicationContext.xml
    file when you executed the persistence setup command:


    ```

    <bean class="org.apache.commons.dbcp.BasicDataSource"

    destroy-method="close" id="dataSource">

    <property name="driverClassName"

    value="${database.driverClassName}"/>

    <property name="url" value="${database.url}"/>

    <property name="username" value="${database.username}"/>

    <property name="password" value="${database.password}"/>

    ...

    </bean>


    <bean

    class="org.springframework.orm.jpa.JpaTransactionManager"

    id="transactionManager">

    ```'
