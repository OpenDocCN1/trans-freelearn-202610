- pgno: 384
  md: '# How it works...


    The list of add-ons comes from the RooBot''s index file. RooBot is a VMWare-hosted
    service that indexes publicly available OBR (OSGi Bundle Repository) files. An
    OBR represents a repository of add-ons and an OBR file is an XML file (typically
    named repository.xml), which contains the information about add-ons and the URLs
    where they are published. Note that an OBR repository need not physically host
    add-ons, and may only provide an OBR file which contains details of add-ons and
    the URL at which they are published. A developer provides an OBR file for the
    Roo add-on that he/she publishes at his/her website. The OBR file is indexed by
    RooBot, and RooBot ensures that the URL used to download an add-on uses the httpgpg://
    (instead of http://) URL for signature verification.


    Every time you start the Roo shell by executing the Roo batch file, the RooBot''s
    index file is downloaded by Spring Roo so that you can search and install add-ons.
    It is important to note that RooBot does not physically host add-ons. When you
    execute addon search or addon list command, Spring Roo refers to RooBot''s index
    file to perform search and listing of available add-ons.


    When you attempt to install a Roo add-on using the addon install bundle or addon
    install id command, the httpgpg:// URL of the add-on in RooBot''s index file is
    used to download and install the add-on. The use of the httpgpg:// URL requires
    Spring Roo to first download the PGP signature file (a .asc file) and URL of the
    add-on, and verify that your Spring Roo installation trusts the PGP key ID used
    to sign the signature file. If your Spring Roo installation doesn''t trust the
    PGP key ID, it will not attempt to download the add-on.


    In our recipe, when we first attempted to download gvNIX Service Management Roo
    add-on, it resulted in an error because the PGP signature file was signed using
    a PGP key ID which the Spring Roo installation didn''t trust. So, we used the
    pgp trust Roo command to add the PGP key ID to Spring Roo''s key store and re-attempted
    to download the gvNIX Service Management Roo add-on. Spring Roo stores trusted
    keys in the .spring_roo_pgp.bpg file in the user''s home directory.


    # There''s more...


    It is important to note that the addon commands (addon info bundle, addon info
    id, addon install bundle, addon install id, addon list, addon search, addon upgrade)
    work only with add-ons registered with the RooBot index file. For instance, you
    cannot search for or install a Roo add-on which is not listed with the RooBot
    index file.'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# Trusting add-ons by default


    If you want to download add-ons without having to add a PGP key ID to Roo''s key
    store, you can do so by executing the pgp automatic trust Roo command, as shown
    here:


    ```

    roo> pgp automatic trust

    ```


    Executing the pgp automatic trust command instructs Roo not to verify that the
    downloaded PGP signature file of the add-on is signed by a trusted PGP key ID.
    It is important to note that enabling the automatic PGP key trusting feature of
    Roo can be unsafe.


    If you want to turn off the automatic PGP key trusting feature, then simply re-execute
    the pgp automatic trust command.


    # Installing add-ons not indexed by RooBot


    There could be scenarios in which a Roo add-on is not registered with RooBot but
    you still want to install and use it. If a Roo add-on is meant for internal use
    within an organization, then you won''t publish it to RooBot or you may want to
    test an add-on thoroughly before registering it with RooBot. In such scenarios,
    you need to add the OBR URL of the add-on repository to your Roo installation
    using the osgi obr url add command, followed by executing the osgi obr start command
    to download and install the add-on.


    Let''s look at an example scenario in which you make use of osgi obr url add and
    osgi obr start commands to download and install Roo add-ons.


    The gvNIX (https://code.google.com/p/gvnix/) Google Code project provides multiple
    Roo add-ons, which deal with Service Management (as discussed earlier), reporting,
    theming, and so on. Even though gvNIX add-ons are published in RooBot, we can
    directly download and install them using osgi obr url add and osgi obr start commands.


    To add OBR URL of repository hosting add-ons, you need to locate the OBR XML file
    that contains a list of add-ons and the URLs where these add-ons are published.
    In the case of the gvNIX Google Code project, the OBR file name is repository.xml
    and is located in the repo directory of the project.


    You can carry out the following steps to add an OBR file URL of the gvNIX project
    to your Roo installation:


    +   View the repository.xml file by going to the gvNIX Google Code project and
    selecting the Source | Browse option. As we need to add the URL of this repository.xml
    file to the Roo installation using the osgi obr url add command, go to the Source
    | Browse option of the gvNIX project on Google Code and open the repository.xml
    file inside repo directory.'
  merge: -1
  img_proc: true
- pgno: 386
