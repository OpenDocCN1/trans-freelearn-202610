    @JoinColumn(name = "FLIGHT_DESC_ID")

    private FlightDescription flightDescription;

    ```


    As we can see from the given code, the field reference command has added a many-to-one
    JPA relationship between the Flight and FlightDescription entities.


    The following table describes the arguments that can be passed to the field reference
    command:


    | Argument | Description |

    |---|---|

    | fieldName (mandatory) | Name of the attribute, which refers to the related entity.
    In our example, flightDescription is the name of the attribute. |

    | type (mandatory) | Type of the related entity. In our example, FlightDescription
    is the type of the related entity. |

    | joinColumnName | The column which acts as the *foreign key* for the related
    entity. In our example, the FLIGHT_DESC_ID is the column in the FLIGHT_TBL (represented
    by the Flight JPA entity), which acts as the foreign key to the FLIGHT_DESCRIPTION_TBL
    table (represented by the FlightDescription JPA entity). |

    | cardinality | Cardinality of the relationship between JPA entities. By default,
    cardinality is MANY_TO_ONE. If you are creating a one-to-one relationship, then
    specify ONE_TO_ONE as the value of the cardinality argument. |

    | fetch | JPA fetch strategy for related entity. The possible values are EAGER
    and LAZY. The value of the *fetch* argument translates into the value of the *fetch*
    element of a @ManyToOne or a @OneToOne annotation. |

    | referencedColumnName | Identifies the column in the table of the related entity
    to which this join column links. The value of this argument is used as a value
    of the *referencedColumnName* attribute of the @JoinColumn JPA annotation. |


    > > Even though the Roo shell displays MANY_TO_ONE, MANY_TO_MANY, ONE_TO_MANY,
    and ONE_TO_ONE as possible values of the cardinality argument of the field reference
    command, it only accepts MANY_TO_ONE and ONE_TO_ONE. The reason for this is that
    field reference only makes sense in case of a one-to-one relationship or when
    the entity is on the many side of a many-to-one relationship.'
