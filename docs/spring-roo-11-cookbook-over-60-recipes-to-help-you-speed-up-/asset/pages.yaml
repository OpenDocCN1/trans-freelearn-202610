    tag to decide whether to render the create `Flight` form or not. One of the things
    that you will notice when you go about creating a `Flight` entity is that it will
    ask you to first create `FlightDescription`, as shown in the following screenshot:


    ![](img/b8c379a2ed921ead3aa2b01811dc29fa_185_0.png)'
