- pgno: 267
  md: '```

    ```xml

    <endpoint

    url="http://{server.name}:{server.port}/

    {context.root}/messagebroker/amf"

    class="flex.messaging.endpoints.AMFEndpoint"/>

    </channel-definition>

    ...

    <channel-definition id="longpolling-amf"

    class="mx.messaging.channels.AMFChannel">

    <endpoint url="http://{server.name}:{server.port}/

    {context.root}/messagebroker/amflongpolling"

    class="flex.messaging.endpoints.AMFEndpoint"/>

    <properties>

    <polling-enabled>true</polling-enabled>

    ...

    </properties>

    </channel-definition>

    ...

    </channels>

    ```

    ```


    This code listing shows channel definitions as created by Roo. A `<channel-definition>`
    element defines a channel. The id attribute is a unique identifier of a channel
    and is used by Flex clients to connect to an endpoint. The class attribute identifies
    the type of the channel. The enclosing `<endpoint>` element defines the endpoint
    corresponding to the channel. The url attribute of the `<endpoint>` element specifies
    the URL of the server and class attribute specifies the endpoint class. Flex components
    make use of channels to communicate with BlazeDS endpoints. For instance, the
    above code listing indicates that AMFChannel is used by Flex to communicate with
    the AMFEndpoint.


    The {server.name} and {server.port} tokens used by the url attribute value are
    replaced at runtime based on the URL of the server from which the SWF file is
    downloaded. The {context.root} token is replaced with a value that is calculated
    at compile-time based on the `<contextRoot>` configuration option defined in the
    pom.xml file for the Flexmojos Maven plugin. Later in this recipe, we''ll look
    at the Flexmojos Maven plugin configuration generated by Roo for the flightapp_flex
    project.


    The incoming requests to DispatcherServlet are routed to the BlazeDS MessageBroker,
    because the `<mapping-pattern>` element value (that is, /messagebroker/*) in flex-config.xml
    maps to the url attribute value (http://.../messagebroker/..) of the `<endpoint>`
    elements in services-config.xml.


    We saw earlier that the longpolling-amf channel is used as the default channel
    by MessageService for transporting messages. The `<polling-enabled>` property
    of the channel is set to true, which means that polling is enabled for the longpolling-amf
    channel.'
