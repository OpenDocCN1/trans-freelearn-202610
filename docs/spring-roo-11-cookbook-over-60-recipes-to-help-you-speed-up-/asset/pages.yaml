  md: 'The following code from the `FlightController.java` file shows the `FlightController`
    created by the `controller scaffold` command:


    ```

    @RooWebScaffold(path = "myflightpath", formBackingObject = Flight.class, update
    = false, delete = false)

    @RequestMapping("/myflightpath")

    @Controller

    public class FlightController {

    }

    ```


    As the given code shows, the value of the path attribute of the @RooWebScaffold
    annotation and the @RequestMapping annotations are derived from the value of the
    path argument of the controller scaffold command. The value of the disallowedOperations
    argument of the controller scaffold command is used in the @RooWebScaffold annotation
    to specify the operations that are not supported by the generated controller.


    The following table describes the elements of the @RooWebScaffold annotation:


    | Element | Description |

    |---|---|

    | path | Specifies the folder inside /WEB-INF/views/, which contains the JSPX
    views created corresponding to the controller. |

    | formBackingObject | Specifies the JPA entity class, which the controller uses
    as the form-backing object. |

    | update | Indicates if the update operation is defined by the * _Roo_ Controller.aj
    AspectJ ITD of the controller. If true, Roo creates the JSPX view for updating
    the corresponding Roo-managed JPA entity. Default value is true. |

    | create | Indicates if the create operation is defined by the * _Roo_ Controller.aj
    AspectJ ITD of the controller. If true, Roo creates the JSPX view for creating
    the corresponding Roo-managed JPA entity. Default value is true. |

    | delete | Indicates if the delete operation is defined by the * _Roo_ Controller.aj
    AspectJ ITD of the controller. If true, the Roo generated JSPX view provides an
    option to delete the corresponding Roo-managed JPA entity. Default value is true.
    |

    | exposeFinders | Exposes finder methods defined in the Roo-managed JPA entity.
    If the finder methods are exposed, a * _Roo_ Controller_Finder.aj ITD is created
    that contains methods for rendering the form for entering search criteria, and
    for searching entity instances and showing search results. Default value is true.
    |'
  merge: -1
