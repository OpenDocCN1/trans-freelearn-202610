    entities recipe, we discussed that the messages.properties contains messages and
    labels that are common to all Roo-generated web applications and the application.properties
    contains application-specific messages and labels.


    As Roo can''t provide translations for application-specific messages and labels,
    the web mvc install language command doesn''t create an application_<language-code>.properties
    file. It is left up to the developer to create an application_<language-code>.properties
    file for specific language codes and provide translations.


