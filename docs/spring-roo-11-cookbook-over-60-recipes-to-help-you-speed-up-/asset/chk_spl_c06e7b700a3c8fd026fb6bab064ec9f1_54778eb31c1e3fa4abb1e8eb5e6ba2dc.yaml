reviews:
- 'no': 12107
  overturn_probability: 0.93
  alternative: 文末索引区块的章内小标题（正文小标题）
  counter_evidence:
  - 格式上该行使用 `##` 二级标记，而非全书最高层级章标题；全书正文中大量相同格式的 `##` 标题均为配方或小节标题（如第11805行“## 将非 OSGi
    JDBC 驱动程序转换为 OSGi 兼容的包”、第11930行“## 工作原理...”、第12022行“## 使用提取重构将 Roo 添加到项目”等），说明
    `##` 表示章内小节而非独立章节。
  - 语义上“索引”仅为文末检索工具，不具有统领后续章节内容的概括性，其后仅是术语与页码的条目列表，缺乏章节正文和子节结构。
  - 上下文中，索引之后仍有“## 感谢购买 Spring Roo 1.1 Cookbook”“## 关于 Packt Publishing”“## 关于 Packt
    开源”等相同层级的书末元数据标题，若将“索引”单独分章，将导致书末出现大量碎片化章节，违背章节划分的连贯性。
  - 该行无章序号（无“第 X 章”或数字编号），也不符合“第 X 部分”模式，仅凭语义不足以将其提升为独立章节。
  keep_split: false
