    There are other topics in cryptography that are presented here due to their relevance
    to blockchain or potential use in future blockchain ecosystems.


    # Homomorphic encryption


    Usually, public key cryptosystems, such as RSA, are multiplicative homomorphic
    or additive homomorphic, such as Paillier cryptosystem, and are called partially
    homomorphic systems. Additive PHEs are suitable for e-voting and banking applications.
    Until recently, there has been no system that supported both operations, but in
    2009, a fully homomorphic system was discovered by Craig Gentry. As these schemes
    allow the processing of encrypted data without the need for decryption, they have
    many different possible applications, especially in scenarios where privacy is
    required to be maintained but data is also required to be processed by potentially
    untrusted parties, for example, cloud computing and online search engines. Recent
    development in homomorphic encryption has been very promising and researchers
    are actively working to make it efficient and more practical. This is of particular
    interest in the blockchain technology, as described later in the book, because
    it can solve the problem of confidentiality and privacy in blockchain.'
