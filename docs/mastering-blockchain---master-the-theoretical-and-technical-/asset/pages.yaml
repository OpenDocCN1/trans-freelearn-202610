- pgno: 290
  md: '# Trading and investment


    Ether is available at various exchanges for buying and selling. The current market
    cap of Ethereum is £680,277,967 at the time of writing this, and an Ether is worth
    £7.89. Recently, the price has been very volatile and has dropped down significantly
    due to recent Ethereum attacks and subsequent forks on the Ethereum network.


    The following chart shows the historical market capitalization details:


    ![](img/62ab880d2302f959d34db648cb0bec5e_290_0.png)


    Ether historical market capitalization (source Etherscan.io)


    Ether can either be purchased on various exchanges, or it can be mined. There
    are online services available, such as `shapeshift.io`, that allow conversion
    from one currency to another.


    Various online exchanges, such as kraken, coinbase, and many more, offer ether
    to be purchased for fiat currency using credit cards or another virtual currency,
    such as bitcoin.


    # The yellow paper


    The Ethereum yellow paper has been written by Dr. Gavin Wood and serves as a formal
    definition of the Ethereum protocol. Anyone can implement an Ethereum client by
    following the protocol specifications defined in the paper. This paper can be
    somewhat difficult to read, especially for the readers who do not have a background
    in algebra or mathematics and are not familiar with mathematical notations.'
  merge: -1
  img_proc: true
