    # Eris


    Eris is not a single blockchain, it is an open modular platform developed by Monax
    for development of blockchain-based ecosystem applications. It offers various
    frameworks, SDKs, and tools that allow accelerated development and deployment
    of blockchain applications. The core idea behind the Eris application platform
    is to enable development and management of ecosystem applications with a blockchain
    backend. It allows integration with multiple blockchains and enables various third
    party systems to interact with various other systems. This platform makes use
    of smart contracts written in solidity language. It can interact with blockchains
    such as Ethereum or bitcoin. The interaction can include connectivity commands,
    start, stop, disconnection, and creation of new blockchains. Complexity related
    to setup and interaction with blockchains have been abstracted away in Eris. All
    commands are standardized for different blockchains, and the same commands can
    be used across the platform regardless of the blockchain type being targeted.'
  merge: -1
  img_proc: true
- pgno: 435
  md: 'An ecosystem application can consist the Eris platform, enabling the API gateway
    to allow legacy applications to connect to key management systems, consensus engines,
    and application engines. The Eris platform provides various toolkits that are
    used to provide various services to the developers. These modules are described
    as follows:


    +   - **Chains**: This allows the creation of and interaction with blockchains.

    +   - **Packages**: This allows the development of smart contracts.

    +   - **Keys**: This is used for key management and signing operations.

    +   - **Files**: This allows working with distributed data management systems.
    It can be used to interact with file systems such as IPFS and data lakes.

    +   - **Services**: This exposes a set of services that allows the management
    and integration of ecosystem applications.


    Several SDKs has also been developed by Eris that allow the development and management
    of ecosystem applications. These SDKs contain smart contracts that have been fully
    tested and address specific needs and requirements of business. For example, a
    finance SDK, insurance SDK, and logistics SDK. There is also a base SDK that serves
    as a basic development kit to manage the lifecycle of an ecosystem application.


    Monax has developed its own permissioned blockchain client called Eris:db. It
    is a **Proof of Stake-based (PoS)** blockchain system that allows integration
    with a number of different blockchain networks. `Eris:db` consist of three components:


    +   - **Consensus**: This is based on the Tendermint consensus mechanism, discussed
    before.

    +   - **Virtual machine**: Eris uses **Ethereum Virtual Machine (EVM)**, as such
    it supports solidity compiled contracts.

    +   - **Permissions layer**: Being a permissioned ledger, Eris provides an access
    control mechanism that can be used to assign specific roles to different entities
    on the network.

    +   - **Interface**: This provides various commandline tools and RPC interfaces
    to enable interaction with the backend blockchain network.


    The key difference between Ethereum blockchain and Eris:db is that Eris:db makes
    use of a Practical Byzantine Fault-Tolerance algorithm, which is implemented as
    a deposit-based Proof of Stake (DPOS system) whereas Ethereum uses **Proof of
    Work (PoW)**. Moreover, `Eris:db` uses the ECDSA ed22519 curve scheme whereas
    Ethereum uses the secp256k1 algorithm. Finally, it is permissioned with an access
    control layer on top whereas Ethereum is a public blockchain.'
  merge: -1
  img_proc: true
- pgno: 436
