  md: '# Downloading and compiling nheqminer


    The following steps can be used to download and compile `nheqminer` on an Ubuntu
    Linux distribution:


    ```

    sudo apt-get install cmake build-essential libboost-all-dev

    git clone https://github.com/nicehash/nheqminer.git

    cd nheqminer/nheqminer

    mkdir build

    cd build

    cmake ..

    make

    ```


    Once all the steps are completed successfully, nheqminer can be run using the
    following command:


    ```

    ./nheqminer -l eu -u <btc address> -t <number of threads>

    ```


    Nheqminer releases are available for Windows at:


    ```

    https://github.com/nicehash/nheqminer/releases.

    ```


    Nheqminer takes several parameters such as location (`-l`), username (`-u`), and
    the number of threads to be used for mining (`-t`).


