- pgno: 79
  md: "# Entity authentication\n\nEntity authentication is the assurance that an entity\
    \ is currently involved and active in a communication session. Traditionally,\
    \ users are issued a username and password, which are used to gain access to the\
    \ platforms they are using. This is called single factor authentication as there\
    \ is only one factor, namely *something you know*, that is, the password and username.\
    \ This type of authentication is not very secure due to various reasons, such\
    \ as password leakage; therefore, additional factors are now commonly used to\
    \ provide better security. The use of additional techniques for user identification\
    \ is known as multifactor authentication or two-factor authentication if only\
    \ two methods are used. If more than two factors are used for authentication,\
    \ that is called multifactor authentication. Various factors are described here:\n\
    \n+   1. The first factor is something you have, such as a hardware token or smart\
    \ card. In this case, a user can use a hardware token in addition to login credentials\
    \ to gain access to a system. This provides protection by requiring two factors\
    \ of authentication. A user who has access to the hardware token and knows the\
    \ log-on credentials will be able to access the system. Both factors should be\
    \ available in order to gain access to the system, thus making this method a two-factor\
    \ authentication mechanism.\n+   \n+   2. The second factor is something you are,\
    \ which uses biometric features in order to identify the user. In this method,\
    \ a user uses fingerprint, retina, iris, or hand geometry to provide an additional\
    \ factor for authentication. This way, it can be ensured that a user was indeed\
    \ present during the authentication mechanism as biometric features are unique\
    \ to an individual. However, careful implementation is required in order to ensure\
    \ a high level of security as some research has suggested that biometric systems\
    \ can be circumvented in certain scenarios.\n\n# Data origin authentication\n\n\
    Also known as message authentication, this is an assurance that the source of\
    \ information is verified. Data origin authentication implies data integrity because\
    \ if a source is corroborated, then data must not have been altered. Various methods,\
    \ such as **Message Authentication Codes (MACs)** and digital signatures are most\
    \ commonly used. These terms will be explained in detail later in the chapter."
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Non-repudiation


    Non-repudiation is the assurance that an entity cannot deny a previous commitment
    or action by providing unforgeable evidence. It is a security service that provides
    unforgeable evidence that a particular action has occurred. This property is very
    necessary in disputable situations whereby an entity has denied actions performed,
    for example, placing an order on an e-commerce system. This service produces cryptographic
    evidence in electronic transactions so that in case of disputes, it can be used
    as a confirmation of an action. Non-repudiation has been an active research area
    for many years. Disputes in electronic transactions are a common issue and there
    is a need to address them in order to increase the confidence level of consumers
    in the service.


    The non-repudiation protocol usually runs in a communication network and is used
    to provide evidence that an action has been taken by an entity (originator or
    recipient) on the network. In this context, there are two communication models
    that can be used to transfer messages from originator A to recipient B:


    +   1. Message is sent directly from originator A to recipient B.

    +   2. Message is sent to a delivery agent from originator A, which then delivers
    the message to recipient B.


    The main requirements of a non-repudiation protocol are fairness, effectiveness,
    and timeliness. In many scenarios, there are multiple participants involved in
    a transaction as opposed to only two parties. For example, in electronic trading
    systems, there can be many entities, such as clearing agents, brokers, and traders
    that can be involved in a single transaction. In this case, two-party non-repudiation
    protocols are not appropriate. To address this problem Multi-party nonrepudiation
    protocols (MPNR) has been developed.


    # Accountability


    Accountability is the assurance that actions affecting security can be traced
    to the responsible party. This is usually provided by logging and audit mechanisms
    in systems where a detailed audit is required due to the nature of the business,
    for example, in electronic trading systems. Detailed logs are vital to trace an
    entity''s actions, for example, when a trade is placed in an audit record with
    the date and time stamp and the entity''s identity is generated and saved in the
    log file. This log file can optionally be encrypted and can be part of the database
    or a standalone ASCII text log file on a system.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Cryptographic primitives


    Cryptographic primitives are the basic building blocks of a security protocol
    or system. In the following section, you are introduced to cryptographic algorithms
    that are essential for the building of secure protocols and systems. A security
    protocol is a set of steps taken in order to achieve required security goals by
    utilizing appropriate security mechanisms.


    Various types of security protocols are in use, such as authentication protocols,
    non-repudiation protocols, and key management protocols.


    A generic cryptography model is shown in the following diagram:


    ![](img/62ab880d2302f959d34db648cb0bec5e_81_0.png)


    A model showing the generic encryption and decryption model


    In the preceding diagram, P, E, C, and D represents Plain text, Encryption, Cipher
    text, and Decryption, respectively. Also, based on the model shown earlier, it
    is worth explaining various concepts such as entity, sender, receiver, adversary,
    key, and a channel.


    +   - **Entity**: It is either a person or a system that sends, receives, or performs
    operations on data

    +   - **Sender**: Sender is an entity that transmits the data

    +   - **Receiver**: Receiver is an entity that takes delivery of the data'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - **Adversary**: This is an entity that tries to circumvent the security
    service

    +   - **Key**: A key is some data that is used to encrypt or decrypt data

    +   - **Channel**: Channel provides a medium of communication between entities


    Cryptography is mainly divided into two categories, namely symmetric and asymmetric
    cryptography.


    # Symmetric cryptography


    Symmetric cryptography refers to a type of cryptography whereby the key that is
    used to encrypt the data is the same for decrypting the data, and thus it is also
    known as a shared key cryptography. The key must be established or agreed on before
    the data exchange between the communicating parties. This is the reason it is
    also called **secret key cryptography**.


    There are two types of symmetric ciphers, stream ciphers and block ciphers. **Data
    Encryption Standard (DES)** and **Advanced Encryption Standard (AES)** are common
    examples of block ciphers, whereas RC4 and A5 are commonly used stream ciphers.


    # Stream ciphers


    These ciphers are encryption algorithms that apply encryption algorithms on a
    bit-by-bit basis to plain text using a key stream. There are two types of stream
    ciphers: synchronous and asynchronous. Synchronous stream ciphers are ones where
    key stream is dependent only on the key, whereas asynchronous stream ciphers have
    a key stream that is also dependent on the encrypted data.


    In stream ciphers, encryption and decryption are basically the same function because
    they are simple modulo 2 additions or XOR operation. The key requirement in stream
    ciphers is the security and randomness of key streams. Various techniques have
    been developed to generate random numbers, and it''s vital that all key generators
    be cryptographically secure:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/62ab880d2302f959d34db648cb0bec5e_83_0.png)


    Operation of a stream cipher


    # Block ciphers


    These are encryption algorithms that break up a text to be encrypted (plain text)
    into blocks of fixed length and apply encryption block by block. Block ciphers
    are usually built using a design strategy known as Fiestel cipher. Recent block
    ciphers, such as AES (Rijndael) have been built using a combination of substitution
    and permutation called **substitution-permutation network (SPN)**.


    Fiestel ciphers are based on the Fiestel network, which is a structure developed
    by *Horst Fiestel*. This structure is based on the idea of combining multiple
    rounds of repeated operations to achieve desirable cryptographic properties knows
    as confusion and diffusion. Fiestel networks operate by dividing data into two
    blocks (left and right) and process these blocks via keyed round functions.


    Confusion makes the relationship between the encrypted text and plaintext complex.
    This is achieved by substitution in practice. For example, ''A'' in plain text
    is replaced by ''X'' in encrypted text. In modern cryptographic algorithms, substitution
    is performed using lookup tables called S-boxes. The diffusion property spreads
    the plain text statistically over the encrypted data, which ensures that even
    if a single bit is changed in the input text, it results in changing at least
    half (on average) of the bits in the cipher text. Confusion is required to make
    finding the encryption key very difficult even if many encrypted and decrypted
    data pairs are created using the same key. In practice, this is achieved by transposition
    or permutation.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'A key advantage of using Fiestel cipher is that encryption and decryption operations
    are almost identical and only require a reversal of the encryption process in
    order to achieve decryption. DES is a prime example of Fiestel-based ciphers:


    ![](img/62ab880d2302f959d34db648cb0bec5e_84_0.png)


    Simplified operation of a block cipher


    Various modes of operation for block ciphers are **Electronic Code Book (ECB)**,
    **Cipher block chaining (CBC)**, **Output Feedback Mode (OFB)**, or **Counter
    mode (CTR)**. These modes are used to specify the way in which an encryption function
    would be applied to the plain text. These modes will be explained later in this
    section, but the first four categories of block cipher encryption modes are introduced
    here.


    # Block encryption mode


    In this mode, plaintext is divided into blocks of fixed length depending on the
    type of cipher used and then the encryption function is applied on each block.


    # Keystream generation modes


    In this mode, the encryption function generates a keystream that is then XORed
    with the plaintext stream in order to achieve encryption.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Message authentication modes


    In this mode, a message authentication code is computed as a result of an encryption
    function. MAC is basically a cryptographic checksum that provides an integrity
    service. The most common method to generate MAC using block ciphers is CBC-MAC,
    where some part of the last block of the chain is used as a MAC.


    # Cryptographic hashes


    Hash functions are basically used to compress a message to a fixed length digest.
    In this mode, block ciphers are used as a compression function to produce a hash
    of plain text.


    The most common block encryption modes are discussed briefly.


    # Electronic code book


    This is a basic mode of operation in which the encrypted data is produced as a
    result of applying the encryption algorithm one by one separately to each block
    of plain text. This is the simplest mode but should not be used in practice as
    it is insecure and can reveal information:


    ![](img/62ab880d2302f959d34db648cb0bec5e_85_0.png)


    Electronic code book mode for block ciphers'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Cipher block chaining


    In this mode, each block of plain text is XORed with the previous encrypted block.
    The CBC mode uses initialization vector IV to encrypt the first block. It is recommended
    that IV be randomly chosen:


    ![](img/62ab880d2302f959d34db648cb0bec5e_86_0.png)


    Cipher block chaining mode


    # Counter mode


    The CTR mode effectively uses a block cipher as a stream cipher. In this case,
    a unique nonce is supplied that is concatenated with the counter value in order
    to produce a **key stream**:


    ![](img/62ab880d2302f959d34db648cb0bec5e_86_1.png)


    Counter mode


    There are other modes, such as **Cipher Feedback mode (CFB)**, **Galois Counter
    mode (GCM)**, and Output Feedback mode, which are also used in various scenarios.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'In the following section, you will be introduced to the design and mechanism
    of a currently dominant block cipher know as AES. First, some history will be
    presented with regard to Data Encryption Standard (DES) that led to the development
    of a new AES standard.


    # Data Encryption Standard (DES)


    DES was introduced by the US **National Institute of Standards and Technology
    (NIST)** as a standard algorithm for encryption and was in main use during 1980s
    and 1990s, but it has been not proven to be very resistant against brute force
    attacks, due to advances in technology and cryptography research. Especially in
    July 1998, **Electronic Frontier Foundation (EFF)** broke DES using a special
    purpose machine. DES uses a key of only 56 bits, which has raised some concerns.
    This problem was addressed with the introduction of **Triple DES (3DES)**, which
    proposed the usage of a 168-bit key using three 56-bit keys and the same number
    of executions of the DES algorithm, thus making brute force attacks almost impossible.
    But other limitations, such as slow performance and 64-bit block size, are not
    desirable.


    # Advanced Encryption Standard (AES)


    In 2001, after an open competition, an encryption algorithm named Rijndael that
    was invented by cryptographers *Joan Daemen* and *Vincent Rijmen* was standardized
    as AES with minor modifications by NIST in 2001. So far, no attack has been found
    against AES that is better than the brute force method. Original Rijndael allows
    different key and block sizes of 128-bit, 192-bit, and 256-bits, but in the AES
    standard, only a 128-bit block size is allowed. However, key sizes of 128-bit,
    192-bit, and 256-bit are allowed.


    # AES steps


    During the AES Algorithm processing, a 4 by 4 array of bytes knows as *state*
    is modified using multiple rounds. Full encryption requires 10 to 14 rounds depending
    on the size of the key. The following table shows the key sizes and the required
    number of rounds:


    | Key size | Number of rounds required |

    |---|---|

    | 128-bit | 10 rounds |

    | 192-bit | 12 rounds |

    | 256-bit | 14 rounds |'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Once the state is initialized with the input to the cipher, four operations
    are performed in four stages in order to encrypt the input. These stages are AddRoundKey,
    SubBytes, ShiftRows, and MixColumns:


    +   1. In the AddRoundKey step, the state array is XORed with a subkey, which
    is derived from the master key.

    +   2. This is the substitution step where a lookup table (S-box) is used to replace
    all bytes of the state array.

    +   3. This step is used to shift each row except the first one in the state array
    to the left in a cyclic and incremental manner.

    +   4. Finally, all bytes are mixed in this step in a linear fashion column-wise.


    The preceding steps describe one round of AES. In the final round (either 10,
    12, or 14 depending on the key size), stage 4 is replaced with Addroundkey to
    ensure that the first three steps cannot be simply inverted back:


    ![](img/62ab880d2302f959d34db648cb0bec5e_88_0.png)


    Various cryptocurrency wallets use AES encryption to encrypt locally stored data.
    Especially in bitcoin wallet, AES 256 in the CBC mode is used.


    # An OpenSSL example of how to encrypt and decrypt using AES


    ```

    ```text

    :~/Crypt$ openssl enc -aes-256-cbc -in message.txt -out message.bin

    enter aes-256-cbc encryption password:

    Verifying - enter aes-256-cbc encryption password:

    :~/Crypt$ ls -ltr

    total 12

    ```

    ```'
  merge: -1
  img_proc: true
