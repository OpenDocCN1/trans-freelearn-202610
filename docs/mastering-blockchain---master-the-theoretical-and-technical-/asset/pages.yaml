- pgno: 214
  md: '# Zcash


    Zcash was launched on 28th of October, 2016. This is the first currency that uses
    a specific type of zero knowledge proofs known as **zero-knowledge Succinct Non-interactive
    Arguments of Knowledge (zk-SNARKs)** to provide complete privacy to the user.
    These proofs are very short and easy to verify; however, setting up the initial
    public parameters is a complex process. The latter include two keys: the proving
    key and verifying key. The process requires sampling some random numbers in order
    to construct the public parameters. The issue is that these random numbers, also
    called *toxic waste*, must be destroyed after the parameter generation in order
    to prevent counterfeiting of Zcash. For this purpose, the Zcash team came up with
    a multi-party computation protocol to generate the required public parameters
    in a collaborative manner from independent locations to ensure that *toxic waste*
    is not created. Due to the fact that these public parameters are required to be
    created by the Zcash team, it means that the participants in the ceremony are
    trusted. This is the reason why the ceremony was very open and conducted by making
    use of a multi-party computation mechanism. This mechanism has a property whereby
    all of the participants in the ceremony will have to be compromised in order to
    compromise the final parameters. When the ceremony is completed all participants
    physically destroy the equipment used for private key generation. This action
    eliminates any trace of the participants'' part of the private key on the equipment.


    zk-SNARKs must satisfy the properties of completeness, soundness, succinctness,
    and non-interactivity. *Completeness* means that there is a definite strategy
    for a prover to satisfy a verifier that an assertion is true. On the other hand,
    *soundness* means that no prover can convince the verifier that a false statement
    is true. *Succinctness* means that the messages passed between the prover and
    verifier are very small in size. Finally, the property non-interactive means that
    the verification of correctness of an assertion can be carried out without any
    interaction or very little interaction. Also, being a zero knowledge proof, the
    property of *zero-knowledge* (discussed in Chapter 3, *Cryptography and Technical
    Foundations*) needs to be met too.


    Zcash developers have introduced the concept of a **Decentralized Anonymous Payments
    scheme (DАP scheme)** that is used in the Zcash network to enable direct and private
    payments. The transactions reveal no information about the origin, destination,
    and amount of the payments. There are two types of addresses available in Zcash,
    z-addr and t-addr. Z addresses are based on zero knowledge proofs and provide
    privacy protection whereas T addresses are similar to those of bitcoin.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'Zcash uses an efficient PoW scheme named **Asymmetric PoW (Equihash)**, which
    is based on the Generalized Birthday Problem. It allows very efficient verification.
    It is a memory-hard and ASIC-resistant function. A novel idea (initial slow mining)
    has been introduced with Zcash, which means that the block reward increases gradually
    over a period of time until it reaches the 20,000th block. This allows for initial
    scaling of the network and experimentation by early miners, and adjustment by
    Zcash developers if required. The slow start did have an impact on price due to
    scarcity as the price of ZEC on its first day of launch reached roughly 25,000
    USD. A slightly modified version of the Digishield difficulty adjustment algorithm
    has been implemented in Zcash. The formula is shown as follows:


    ```

    (next difficulty) = (last difficulty) x SQRT [ (150 seconds) / (last solve time)
    ]

    ```


    A snapshot of various attributes of Zcash (after an initial slow start) is shown
    as follows:


    | Attribute | Value |

    |---|---|

    | Name | Zcash |

    | Launch date | 28/10/16 |

    | Main purpose | Currency |

    | Currency Code | ZEC |

    | Maximum coins | 21 million |

    | Block time | 10 minutes |

    | Consensus facilitation algorithm | Proof of Work (equihash) |

    | Difficulty adjustment algorithm | DigiShield V3 (modified) |

    | Mining hardware | CPU, GPU |

    | Difficulty adjustment period | 1 block |'
  merge: -1
  img_proc: true
