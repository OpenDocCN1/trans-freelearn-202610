    \n```\n$ solc --version\nsolc, the solidity compiler commandline interface\nVersion:\
    \ 0.4.6+commit.2dabdf0.Linux.g++\n```\n\nSolc supports a variety of functions.\
    \ A few examples are shown as follows:\n\n+   - Display contract in a binary format.\n\
