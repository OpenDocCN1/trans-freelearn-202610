    # Integrated Development Environments (IDEs)


    There are various IDEs available for solidity development. Most of the IDEs are
    available online and are presented via web interfaces. Browser solidity is most
    commonly used for smaller contracts and is discussed here.


    # Browser solidity


    Browser solidity is the web-based environment for the development and testing
    of contracts using solidity. It does not run on a live blockchain; in fact, it
    is a simulated environment in which contracts can be deployed, tested, and debugged.
    It is available at https://ethereum.github.io/browser-solidity. An example interface
    is shown as follows:


    ![](img/62ab880d2302f959d34db648cb0bec5e_314_0.png)


    Browser solidity'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'On the left-hand side, there is a code editor with syntax highlighting and
    code formatting, and on the right-hand side, there are a number of tools available
    that can be used to deploy, debug, test, and interact with the contract. Various
    features, such as transaction interaction, options to connect to JavaScript VM,
    configuration of execution environment, debugger, formal verification, and static
    analysis, are available. They can be configured to connect to execution environments
    such as JavaScript VM, injected Web3—where Mist or a similar environment has provided
    the execution environment—or Web3 provider, which allows connection to the locally
    running Ethereum client (for example, geth) via IPC or RPC over HTTP (web3 provider
    endpoint).


    # Remix


    After the Mix IDE was discontinued in August 2016, the Remix project was started.
    Remix is a browser-based IDE that is under heavy development currently and only
    the debugger part of it is available as of now. This debugger is very powerful
    and can be used to perform detailed level tracing and analysis of the EVM byte
