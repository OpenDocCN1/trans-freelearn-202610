  md: "# Solc\n\nThe solidity compiler converts from a high-level solidity language\
    \ into **Ethereum Virtual Machine (EVM)** bytecode so that it can be executed\
    \ on the blockchain by EVM.\n\nThe solidity compiler on a Linux Ubuntu operating\
    \ system can be installed using the following commands:\n\n```\n$ sudo apt-get\
