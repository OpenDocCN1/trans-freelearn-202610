- pgno: 129
  md: '# Signcryption


    Signcryption is a public key cryptography primitive that provides all the functions
    of the digital signature and encryption. It was invented by Yuliang Zheng and
    is now an ISO standard ISO/IEC 29150:2011. Traditionally, signature then encrypt
    or encrypt then sign schemes are used to provide unforgeability, authentication,
    and nonrepudiation, but with Signcryption, all services of digital signatures
    and encryption are provided with cost less than that of sign then encrypt schemes.


    This is **Cost (signature & encryption) << Cost (signature) + Cost (Encryption)**
    in a single logical step.


    # Zero knowledge proofs


    Zero knowledge proofs were introduced by GoldWasser, Micali, and Rackoff. These
    proofs are used to prove the validity of an assertion without revealing any information
    whatsoever about the assertion. There are three properties of ZKPs that are required,
    namely completeness, soundness, and zero-knowledge property.


    Completeness ensures that if a certain assertion is true, then the verifier will
    be convinced of this claim by the prover. The soundness property makes sure that
    if an assertion is false, then no dishonest prover can convince the verifier otherwise.
    Zero-knowledge property, as the name implies, is the key property of zero knowledge
    proofs whereby it is ensured that absolutely nothing is revealed about the assertion
    except whether it is true or false.


    Zero knowledge proofs have sparked a special interest among researchers in the
    blockchain space due to its privacy properties that are very much desirable in
    financial and many other fields, such as law and medicine. A recent example of
    the successful implementation of the zero knowledge proof mechanism is the Zcash
    crypto currency. In Zcash, a specific type of zero knowledge proof, known as **zero-knowledge
    Succinct Non-interactive Argument of Knowledge (ZK-Snark)**, is implemented. This
    will be discussed in detail in Chapter 5, *Alternative Coins.*'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# ## Blind signatures


    Blind signatures were introduced by *David Chaum* in 1982 and are based on public
    key digital signature schemes, such as RSA. The key idea behind blind signatures
    is to get the message signed by the signer without actually revealing the message.
    This is achieved by disguising or blinding the message before signing it, hence
    the name blind signatures. This blind signature can then be verified against the
    original message just like a normal digital signature. Blind signatures were introduced
    as a mechanism to allow the development of digital cash schemes.


    # ## Encoding schemes


    Other than cryptographic primitives, binary to text encoding schemes are also
    used in various scenarios. The most common usage is to convert binary data into
    text so that it can be either processed, saved, or transmitted via a protocol
    that does not support the processing of binary data. For example, sometimes, images
    are stored in the database as base64 encoding, which allows a text field to be
    able to store a string. A commonly used encoding scheme is base64. Another encoding
    named base58 was popularized by its usage in bitcoin.


    Cryptography is a vast field and this section has introduced basic concepts that
    are essential to understand cryptography in general and specifically from the
    blockchain and cryptocurrency point of view. In the next section, you are introduced
    to basic financial markets concepts.


    The upcoming section describes general terminologies about trading, exchanges,
    and trade life cycle. More relevant information will be provided in later chapters
    where specific use cases are discussed.


    # ## Financial markets and trading


    Financial markets exist to facilitate the transfers of savings from savers to
    investors. In an economic system, there are two sectors, namely household and
    business. Financial markets, at their core, act as an intermediary between the
    savers and the investors. Basically, there are three types of markets, namely
    money markets, credit markets, and capital markets. Money markets are short-term
    markets where money is lent to companies or banks to do interbank lending. Foreign
    exchange or FX is another category of money markets where currencies are traded.
    Credit markets consist mostly of retail banks where they borrow money from central
    banks and loan it to companies or households in the form of mortgages or loans.'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'Capital markets facilitate the buying and selling of financial instruments,
    mainly stocks and bonds. Capital markets can be divided into two types, primary
    and secondary markets. Stocks are issued directly by the companies to investors
    in primary markets, whereas in secondary markets, investors resell their securities
    to investors via stock exchanges. Various electronic trading systems are used
    by exchanges to facilitate the trading of financial instruments.


    # ## Trading


    A market is a place where traders come to trade. It can ent asset classes.


    Trading can be defined as an activity in which traders buy or sell various financial
    instruments to generate profit and hedge risk. Investors, borrowers, hedges, asset
    exchangers, and gamblers are a few types of traders. Traders have a short position
    when they owe something, for example, if they have sold a contract and have a
    long position when they buy a contract. There are various ways to transact trades,
    such as through brokers or directly on the exchange or over the counter. Brokers
    are agents who arrange trades for their customers. Brokers act on clients'' behalf
    to deal at a given price or at the best possible price.


    # ## Exchanges


    Exchanges are usually considered to be a very safe, regulated, and reliable place
    for trading. Recently, electronic trading has gained high popularity as compared
    to traditional floor-based trading. Now traders send orders to a central electronic
    order book from where the orders, prices, and related attributes are published
    to all associated systems using communication networks thus, in essence, creating
    a virtual marketplace. Exchange trades can be performed only by members of the
    exchange. In order to trade without these limitations, the counter parties can
    participate in **OTC (Over the Counter)** trading directly.


    # ## Orders and order properties


    Orders are instructions to trade and are the main building blocks of a trading
    system. They have the following general attributes:


    +   1. The instrument name.

    +   2. Quantity.

    +   3. Direction (buy or sell).'
  merge: -1
  img_proc: true
- pgno: 132
  md: '+   4. The type of the order that represents various conditions, for example,
    limit orders and stop orders, an example of which is 1500 Royal Bank of Scotland
    ordinary shares for GBP £15.50.


    Orders are traded on the basis of bid prices and offer prices. Traders show their
    intention to buy or sell by attaching bid and offer prices to their orders. The
    price at which a trader will buy is known as the bid price. The price at which
    a trader is willing to sell is known as the offer price.


    # Order management and routing systems


    Order routing systems routes and deliver orders to various destinations depending
    on the business logic. Customers use them to send orders to their brokers, who
    then send these orders to dealers, clearing houses, and exchanges.


    There are different types of orders; the two most common ones are markets orders
    and limit orders. A market order is an instruction to trade at the best price
    currently available in the market, and these orders get filled immediately at
    spot prices. On the other hand, a limit order is an instruction to trade at the
    best price available but only if it is not lower than the limit price set by the
    trader. This can also be higher depending on the direction of the order, either
    sell or buy. All these orders are managed in an order book, which is a list of
    orders maintained by an exchange, and records the intention of buying or selling
    by the traders.


    A position is a commitment to sell or buy an amount of financial instruments,
    such as securities, currencies, or commodities for a given price. The contracts,
    securities, commodities, and currencies that traders buy or sell are commonly
    known as trading instruments and come under the large umbrella of asset classes.
    The most common classes are real assets, financial assets, derivative contracts,
    and insurance contracts.


    # Components of a trade


    A trade ticket is the combination of all details related to a trade. However,
    there is some variation depending on the type of the instrument and asset class,
    but generally, all instruments have the attributes discussed in the next section.


    ![](img/62ab880d2302f959d34db648cb0bec5e_132_0.png)


    # The underlying instrument


    The underlying instrument is the basis of the trade. It can be a currency, a bond,
    interest rate, commodity, or equities.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# **General attributes**


    This includes general identification information and basic features associated
    with every trade. Common attributes include a unique ID, instrument name, type,
    status, trade date, and time.


    # **Economic**


    These are features related to the value of the trade, for example, buy or sell
    value, ticker, exchange, price, and quantity.


    # **Sales**


    Sales refers to the sales-characteristic-related details, such as the name of
    the sales person, and is just an information field, usually without any impact
    on the trade life cycle.


    # **Counterparty**


    Counterparty is an important component of a trade as it shows the other side of
    the trade and is required to settle the trade successfully. Usual attributes include
    counterparty name, address, payment type, any reference IDs, settlement date,
    and delivery type.


    # **Trade life cycle**


    A general trade life cycle includes various stages from order placement to execution
    and then settlement. This life cycle is described step by step as follows:


    +   - **Pre-execution:** An order is placed at this stage.

    +   - **Execution and booking:** When the order is matched and executed, it converts
    into a trade. At this stage, the contract between counter parties is matured.

    +   - **Confirmation:** This is where both counter parties agree to particulars
    of the trade.

    +   - **Post booking:** This stage is concerned with various scrutiny and verification
    processes to ascertain the correctness of the trade.

    +   - **Settlement:** This is the most vital part during trade and at this stage,
    the trade is final.'
  merge: -1
  img_proc: true
- pgno: 134
  md: '+   - **Overnight (end of day processing):** End of day processes include report
    generation, profit and loss calculations, and various risk calculations.

    +   - In all the mentioned processes, many people and business functions are involved.
    Most commonly, these functions are divided into functions such as front office,
    middle office, and back office.


    In the following section, you are introduced to some concepts that are essential
    in order to understand the strict and necessary rules and regulations that govern
    the financial industry. Some concepts are described here and in later chapters
    when specific use cases are discussed, and these ideas will help you understand
    the scenarios described.


    # Order anticipators


    Order anticipators try to make profit before other traders can carry out trading.
    This is based on the anticipation where a trader knows how trading activities
    of other trades will affect prices. Frontrunners, sentiment-oriented technical
    traders, and squeezers are some examples of order anticipators.


    # Market manipulation


    Market manipulation is strictly illegal in the UK and other countries. Fraudulent
    traders can spread false information in the market, which can result in price
    movements thus making illegal profits. Usually, manipulative market conduct is
    trade-based and it includes generalized and time-specific manipulations. Actions
    that can create an artificial shortage of stock, impression of false activity,
    and price manipulation to gain criminal benefit are included in this category.


    Both of the terms discussed earlier are relevant to financial crime. and there
    is a possibility of developing blockchain-based systems that can thwart market
    abuse. This will be discussed in detail in later chapters, where specific use
    cases will be discussed.'
  merge: -1
