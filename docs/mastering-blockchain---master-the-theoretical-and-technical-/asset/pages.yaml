- pgno: 400
  md: 'For example, in the following screenshot the market client is started up to
    communicate with the transaction validator. Note that keys under `/keys/mkt.wif`
    are created by using the following command:


    ```

    ```bash

    ./bin/sawtooth keygen --key-dir validator/keys mkt

    ```

    ```


    This demonstration is just a basic example derived from Sawtooth lake documentation.
    However, development using Sawtooth lake is quite an involved process and a full
    chapter could be dedicated to that.


    ![](img/62ab880d2302f959d34db648cb0bec5e_400_0.png)


    Sawtooth lake is also under continuous development and therefore it is recommended
    that readers keep an eye on documentation available at `http://intelledger.github.io/`
    in order to keep up with the latest developments.


    # Corda


    Corda is not a blockchain. Traditional blockchain solutions, as discussed before,
    have the concept of transactions that are bundled together in a block and each
    block is linked back cryptographically to its parent block, which provides an
    immutable record of transactions. This is not the case with Corda: Corda has been
    designed entirely from scratch with a new model for providing all blockchain benefits,
    but without a traditional blockchain. It has been developed purely for the financial
    industry to solve issues arising from the fact that each organization manages
    their own ledgers and thus have their own view of *truth*, which leads to contradictions
    and operational risk. Moreover, data is also duplicated at each organization which
    results in an increased cost of managing individual infrastructures and complexity.
    These are the types of problems within the financial industry that Corda aims
    to resolve by building a decentralized database platform.'
  merge: -1
  img_proc: true
- pgno: 401
  md: 'Corda source code is available at https://github.com/corda/corda. It is written
    in a language called Kotlin, which is a statically typed language targeting the
    Java Virtual Machine (JVM).


    # Architecture


    The main components of the Corda platform include state objects, contract code,
    legal prose, transactions, consensus, and flows.


    # State objects


    State objects represent the smallest unit of data that represent a financial agreement.
    They are created or deleted as a result of a transaction execution. They refer
    to contract code and legal prose. Legal prose is optional and provides legal binding
    to the contract. However, contract code is mandatory in order to manage the state
    of the object. It is required in order to provide a state transition mechanism
    for the node according to the business logic defined in the contract code. State
    objects contain a data structure that represent the current state of the object.
    For example, in the following diagram, a state object represents the current state
    of the object. In this case, it is a simple mock agreement between Party A and
    Party B where Party ABC has paid Party XYZ 1,000 GBP. This represents the current
    state of the object; however the referred contract code can change the state via
    transactions. State objects can be thought of as a state machine, which are consumed
    by transactions in order to create updated state objects.


    ![](img/62ab880d2302f959d34db648cb0bec5e_401_0.png)'
  merge: -1
  img_proc: true
- pgno: 402
  md: '# # Transactions


    Transactions are used to perform transitions between different states. For example,
    the state object shown in the preceding diagram is created as a result of a transaction.
    Corda uses a bitcoin-style UTXO based model for its transaction processing. The
    concept of state transition by transactions is same as in bitcoin. Similar to
    bitcoin, transactions can have none, single or multiple inputs, and single or
    multiple outputs. All transactions are digitally signed. Moreover, Corda has no
    concept of mining because it does not use blocks to arrange transactions in a
    blockchain. Instead, notary services are used in order to provide temporal ordering
    of transactions. In Corda, new transaction types can be developed using JVM bytecode,
    which makes it very flexible and powerful.


    # # Consensus


    The consensus model in Corda is quite simple and is based on notary services that
    are discussed in a later section. The general idea is that the transactions are
    evaluated for their uniqueness by the notary service and, if they are unique,
    they are signed as valid. There can be single or multiple clustered notary services
    running on a Corda network. Various consensus algorithms like PBFT or Raft can
    be used by notaries to reach consensus.


    There are two main concepts regarding consensus in Corda: Consensus over state
    validity, and consensus over state uniqueness. The first concept is concerned
    with the validation of the transaction, ensuring that all required signatures
    are available and states are appropriate. The second concept is a means to detect
    double-spend attack and ensures that a transaction has not been already been spent
    and is unique.


    # # Flows


    Flows in Corda are a novel idea that allow the development of decentralized workflows.
    All communication on the Corda network is handled by these flows. These are transaction-building
    protocols that can be used to define any financial flow of any complexity using
    code. Flows run as an asynchronous state machine and they interact with other
    nodes and users. During the execution, they can be suspended or resumed as required.


    # # Components


    The Corda network has multiple components. All these components are described
    in the next section.'
  merge: -1
  img_proc: true
- pgno: 403
  md: '# # Nodes


    Nodes in a Corda network operated under a trust-less model and run by different
    organizations. Nodes run as part of an authenticated peer-to-peer network. Nodes
    communicate directly with each other using the **Advanced Message Queuing Protocol
    (AMQP)**, which is an approved international standard (ISO/IEC 19464) and ensures
    that messages across different nodes are transferred safely and securely. AMQP
    works over **Transport Layer Security (TLS)** in Corda, thus ensuring privacy
    and integrity of data communicated between nodes.


    Nodes also make use of a local relational database for storage. Messages on the
    network are encoded in a compact binary format. They are delivered and managed
    by using the **Apache Artemis message broker (Active MQ)**. A node can serve as
    a network map service, notary, Oracle, or a regular node. The following diagram
    shows a high-level view of two nodes communicating with each other:


    ![](img/62ab880d2302f959d34db648cb0bec5e_403_0.png)


    In the preceding diagram, **Node 1** is communicating with **Node 2** over a TLS
    communication channel using the AMQP protocol, and the nodes have a local relational
    database for storage.


    # # Permissioning service


    A Permissioning service is used to provision TLS certificates for security. In
    order to participate on the network, participants are required to have a signed
    identity issued by a root certificate authority. Identities are required to be
    unique on the network and the Permissioning service is used to sign these identities.
    The naming convention used to recognise participants is based on the X.500 standard.
    This ensures the uniqueness of the name.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# Network map service


    This service is used to provide a network map in the form of a document of all
    nodes on the network. This service publishes IP addresses, identity certificates
    and a list of services offered by nodes. All nodes announce their presence by
    registering to this service when they first start up, and when a connection request
    is received by a node, the presence of the requesting node is checked on the network
    map first. Put another way, this service resolves the identities of the participants
    to physical nodes.


    # Notary service


    In a traditional blockchain, mining is used to ascertain the order of blocks that
    contain transactions. In Corda, notary services are used to provide transaction
    ordering and timestamping services. There can be multiple notaries in a network
    and they are identified by composite public keys. Notaries can use different consensus
    algorithms like BFT or Raft depending on the requirements of the applications.
    Notary services sign the transactions to indicate validity and finality of the
    transaction which is then persisted to the database.


    Notaries can be run in a load-balanced configuration in order to spread the load
    across the nodes for performance reasons; and, in order to reduce latency, the
    nodes are recommended to be run physically closer to the transaction participants.


    # Oracle service


    Oracle services either sign a transaction containing a fact, if it is true, or
    can themselves provide factual data. They allow real world feed into the distributed
    ledgers.


    # Transactions


    Transactions in a Corda network are never transmitted globally, but in a semi-private
    network. They are shared only between a subset of participants who are related
    to the transaction. This is in contrast to traditional blockchain solutions like
    Ethereum and bitcoin, where all transactions are broadcasted to the entire network
    globally. Transactions are digitally signed and either consume state(s) or create
    new state(s).'
  merge: -1
  img_proc: true
- pgno: 405
  md: 'Transactions on a Corda network are composed of the following elements:


    +   - **Input references**: This is a reference to the states the transaction
    is going to consume and use as an input.

    +   - **Output states**: These are new states created by the transaction.

    +   - **Attachments**: This is a list of hashes of attached zip files. Zip files
    can contain code and other relevant documentation related to the transaction.
    Files themselves are not made part of the transaction, instead, they are transferred
    and stored separately.

    +   - **Commands**: A command represents the information about the intended operation
    of the transaction as a parameter to the contract. Each command has a list of
    public keys which represents all parties that are required to sign a transaction.

    +   - **Signatures**: This represents the signature required by the transaction.
    The total number of signatures required is directly proportional to the number
    of public keys for commands.

    +   - **Type**: There are two types of transactions namely, Normal or Notary changing.
    Notary changing transactions are used for reassigning a notary for a state.

    +   - **Timestamp**: This field represents a bracket of time during which the
    transaction has taken place. These are verified and enforced by notary services.
    Also, it is expected that if strict timings are required, which is desirable in
    many financial services scenarios, notaries should be synched with an atomic clock.

    +   - **Summaries**: This is a text description that describes the operations
    of the transaction.


    # Vaults


    Vaults run on a node and are akin to the concept of wallets in bitcoin. As the
    transactions are not globally broadcast, each node will have only that part of
    data in their vaults that is considered relevant to them. Vaults store their data
    in a standard relational database and as such can be queried by using standard
    SQL. Vaults can contain both on ledger and off ledger data, meaning that it can
    also have some part of data that is not on ledger.'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# CorDapp


    The core model of Corda consists of state objects, transactions and transaction
    protocols, which when combined with contract code, APIs, wallet plugins, and user
    interface components results in constructing a Corda distributed application (CorDapp).


    Smart contracts in Corda are written using Kotlin or Java. The code is targeted
    for JVM. JVM has been modified slightly in order to achieve deterministic results
    of execution of JVM bytecode. There are three main components in a Corda smart
    contract as follows:


    +   1. Executable code that defines the validation logic to validate changes to
    the state objects.

    +   2. State objects represent the current state of a contract and either can
    be consumed by a transaction or produced (created) by a transaction.

    +   3. Commands are used to describe the operational and verification data that
    defines how a transaction can be verified.


    # Development environment


    The development environment for Corda can be set up easily using the following
    steps.


    Required software includes the following:


    +   1. JDK 8 which is available at http://www.oracle.com/technetwork/java/javase/downloads/index.html.

    +   2. IntelliJ IDEA community edition which is free and available at https://www.jetbrains.com/idea/download.

    +   3. H2 database platform independent zip, and is available at http://www.h2database.com/html/download.html.

    +   4. Git, available at https://git-scm.com/downloads.

    +   5. Kotlin language, which is available for IntelliJ, and more information
    can be found at https://kotlinlang.org/.

    +   6. Gradle is another component that is used to build Corda.


    Once all these tools are installed, smart contract development can be started.
    CorDapps can be developed by utilizing an example template available at https://github.com/corda/cordapp-template.
    Detailed documentation on how to develop contract code is available at https://docs.corda.net/.'
  merge: -1
  img_proc: true
