- pgno: 143
  md: 'Vanity addresses are generated using a purely brute-force method. An example
    is shown in the following screenshot:


    ![](img/62ab880d2302f959d34db648cb0bec5e_143_0.png)


    # Transactions


    Transactions are at the core of the bitcoin ecosystem. Transactions can be as
    simple as just sending some bitcoins to a bitcoin address, or it can be quite
    complex depending on the requirements. Each transaction is composed of at least
    one input and output. Inputs can be thought of as coins being spent that have
    been created in a previous transaction and outputs as coins being created. If
    a transaction is minting new coins, then there is no input and therefore no signature
    is needed. If a transaction is to sends coins to some other user (a bitcoin address),
    then it needs to be signed by the sender with their private key and a reference
    is also required to the previous transaction in order to show the origin of the
    coins. Coins are, in fact, unspent transaction outputs represented in Satoshis.


    Transactions are not encrypted and are publicly visible in the blockchain. Blocks
    are made up of transactions and these can be viewed using any online blockchain
    explorer.


    # The transaction life cycle


    +   1. A user/sender sends a transaction using wallet software or some other interface.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '+   2. The wallet software signs the transaction using the sender''s private
    key.

    +   3. The transaction is broadcasted to the Bitcoin network using a flooding
    algorithm.

    +   4. Mining nodes include this transaction in the next block to be mined.

    +   5. Mining starts once a miner who solves the Proof of Work problem broadcasts
    the newly mined block to the network. Proof of Work is explained in detail later
    in this chapter.

    +   6. The nodes verify the block and propagate the block further, and confirmation
    starts to generate.

    +   7. Finally, the confirmations start to appear in the receiver''s wallet and
    after approximately six confirmations, the transaction is considered finalized
    and confirmed. However, six is just a recommended number; the transaction can
    be considered final even after the first confirmation. The key idea behind waiting
    for six confirmations is that the probability of double spending is virtually
    eliminated after six confirmations.


    # The transaction structure


    A transaction at a high level contains metadata, inputs, and outputs. Transactions
    are combined to create a block. The transaction structure is shown in the following
    table:


    | Field | Size | Description |

    |---|---|---|

    | Version Number | 4 bytes | Used to specify rules to be used by the miners and
    nodes for transaction processing. |

    | Input counter | 1 bytes – 9 bytes | The number of inputs included in the transaction.
    |

    | list of inputs | variable | Each input is composed of several fields, including
    Previous transaction hash, Previous Txout-index, Txin-script length, Txin-script,
    and optional sequence number. The first transaction in a block is also called
    a coinbase transaction. It specifies one or more transaction inputs. |

    | Out-counter | 1 bytes – 9 bytes | A positive integer representing the number
    of outputs. |

    | list of outputs | variable | Outputs included in the transaction. |

    | lock_time | 4 bytes | This defines the earliest time when a transaction becomes
    valid. It is either a Unix timestamp or a block number. |'
  merge: -1
  img_proc: true
