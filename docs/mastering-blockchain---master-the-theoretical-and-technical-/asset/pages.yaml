- pgno: 300
  md: '# Static nodes


    If there is a need to connect to a specific set of peers, then these nodes can
    be added to a file where the `chaindata` and `keystore` files are saved, for example,
    in the `~/.ethereum/privatenet` directory. The filename should be `static-nodes.json`.
    This can be valuable in a private network. An example of the json file is shown
    as follows:


    ```

    [

    "enode://44352ede5b9e792e437c1c0431c1578ce3676a87e1f588434aff1299d30325c233c8d426fc57a25380481c8a36fb3be2787375e932fb4885885f6452f6efa77f@xxx.xxx.xxx.xxx:TCP_PORT"

    ]

    ```


    Here, xxx is the public IP address and TCP_PORT can be any valid and available
    TCP port on the system. The long hex string is the node ID.


    # Starting up the private network


    The initial command to start the private network is shown as follows:


    ```

    $ geth --datadir ~/.ethereum/privatenet init

    ./privether/privategenesis.json

    ```


    This will produce an output similar to what is shown in the following screenshot:


    ![](img/62ab880d2302f959d34db648cb0bec5e_300_0.png)


    This output indicates that a genesis block has been created successfully. In order
    for geth to start, the following command can be issued:


    ```

    $ geth --datadir .ethereum/privatenet/ --networkid 786

    ```'
  merge: -1
  img_proc: true
