- pgno: 155
  md: 'Because of the distributed nature of bitcoin, network forks can occurs naturally.
    In cases where two nodes simultaneously announce a valid block can result in a
    situation where there are two blockchains with different transactions. This is
    an undesirable situation but can be addressed by the bitcoin network only by accepting
    the longest chain. In this case, the smaller chain will be considered orphaned.
    If an adversary manages to gain 51% control of the network hashrate (computational
    power), then they can impose their own version of transaction history.


    Forks in blockchain can occur with the introduction of changes in the Bitcoin
    protocol. In case of *soft fork*, only previous valid blocks are no longer acceptable,
    thus making soft fork backward compatible. In case of soft fork, only miners are
    required to upgrade to the new client software in order to make use of the new
    protocol rules. Planned upgrades do not necessarily create forks because all users
    should have updated already. A hard fork, on the other hand, invalidates previously
    valid blocks and requires all users to upgrade. New transaction types are sometimes
    added as a soft fork, and any changes such as block structure change or major
    protocol changes results in hard fork.


    The current size of the bitcoin blockchain as on February 4, 2017, stands at approximately
    101 GB. The following figure shows the size increase of blockchain as a function
    of time:


    ![](img/62ab880d2302f959d34db648cb0bec5e_155_0.png)


    Current size of blockchain as of 06/02/2017


    New blocks are added to the blockchain approximately every 10 minutes and network
    difficulty is adjusted dynamically every 2016 blocks in order to maintain a steady
    addition of new blocks to the network.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Network difficulty is calculated using the following equation:


    *Target = Previous target * Time/2016 * 10 minutes*


    Difficulty and target are interchangeable and represent the same thing. Previous
    target represents the old target value, and time is the time spent to generate
    previous 2016 blocks. Network difficulty basically means how hard it is for miners
    to find a new block, that is, how difficult the hashing puzzle is now.


    In the section, mining is discussed, which will explain how a hashing puzzle is
    solved.


    # Mining


    Mining is a resource-intensive process by which new blocks are added to the blockchain.
    Blocks contain transactions that are validated via the mining process by mining
    nodes and are added to the blockchain. This process is resource-intensive in order
    to ensure that the required resources have been spent by miners in order for a
    block to be accepted. New coins are minted by the miners by spending the required
    computing resources. This also secures the system against frauds and double spending
    attacks while adding more virtual currency to the bitcoin ecosystem.


    Roughly one new block is created (mined) every 10 minute. Miners are rewarded
    with new coins if and when they create new blocks and are paid transaction fees
    in return of including transactions in their blocks. New blocks are created at
    an approximate fixed rate. Also, the rate of creation of new bitcoins decreases
    by 50%, every 210,000 blocks, roughly every 4 years. When bitcoin was initially
    introduced, the block reward was 50 bitcoins; then in 2012, this was reduced to
    25 bitcoins. In July 2016, this was further reduced to 12.5 coins (12 coins) and
    the next reduction is estimated to be on July 4, 2020. This will reduce the coin
    reward further down to approximately six coins.


    Approximately 144 blocks, that is, 1,728 bitcoins are generated per day. The number
    of actual coins can vary per day; however, the number of blocks remains at 144
    per day. Bitcoin supply is also limited and in 2140, almost 21 million bitcoins
    will be finally created and no new bitcoins can be created after that. Bitcoin
    miners, however, will still be able to profit from the ecosystem by charging transaction
    fees.'
  merge: -1
  img_proc: true
- pgno: 157
  md: "# Task of miners\n\nOnce a node connects with the bitcoin network, there are\
    \ several tasks that a bitcoin miner performs.\n\n# Synching up with the network\n\
    \nOnce a new node joins the bitcoin network, it downloads the blockchain by requesting\
    \ historical blocks from other nodes. This is mentioned here in the context of\
    \ the bitcoin miner; however, this not necessarily a task only for a miner.\n\n\
    +   - **Transaction validation:** Transactions broadcasted on the network are\
    \ validated by full nodes by verifying and validating signatures and outputs.\n\
    +   \n+   - **Block validation:** Miners and full nodes can start validating blocks\
    \ received by them by evaluating them against certain rules. This includes the\
    \ verification of each transaction in the block along with verification of the\
    \ nonce value.\n+   \n+   - **Create a new block:** Miners propose a new block\
    \ by combining transactions broadcasted on the network after validating them.\n\
    +   \n+   - **Perform Proof of Work:** This task is the core of the mining process\
    \ and this is where miners find a valid block by solving a computational puzzle.\
    \ The block header contains a 32-bit nonce field and miners are required to repeatedly\
    \ vary the nonce until the resultant hash is less than a predetermined target.\n\
    +   \n+   - **Fetch reward:** Once a node solves the hash puzzle, it immediately\
    \ broadcasts the results, and other nodes verify it and accept the block. There\
    \ is a slight chance that the newly minted block will not be accepted by other\
    \ miners due to a clash with another block found at roughly the same time, but\
    \ once accepted, the miner is rewarded with 12.5 bitcoins (as of 2016) and any\
    \ associated transaction fees."
  merge: -1
  img_proc: true
- pgno: 158
  md: '# # Proof of Work


    This is a proof that enough computational resources have been spent in order to
    build a valid block. **Proof of Work (PoW)** is based on the idea that a random
    node is selected every time to create a new block. In this model, nodes compete
    with each other in order to be selected in proportion to their computing capacity.
    The following equation sums up the Proof of Work requirement in bitcoin:


    $$H(N \parallel P\_hash \parallel Tx \parallel Tx \parallel \ldots Tx) < Target$$


    Where N is a nonce, $P\_hash$ is a hash of the previous block, $Tx$ represents
    transactions in the block, and $Target$ is the target network difficulty value.
    This means that the hash of the previously mentioned concatenated fields should
    be less than the target hash value. The only way to find this nonce is the brute
    force method. Once a certain pattern of a certain number of zeroes is met by a
    miner, the block is immediately broadcasted and accepted by other miners.


    # ## The mining algorithm


    The mining algorithm consists of the following steps.


    +   - The previous hash block is retrieved from the bitcoin network.

    +   - Assemble a set of potential transactions broadcasted on the network into
    a block.

    +   - Compute the double hash of the block header with a nonce and the previous
    hash using the SHA256 algorithm.

    +   - If the resultant hash is lower than the current difficulty level (target),
    then stop the process.

    +   - If the resultant hash is greater than the current difficulty level (target),
    then repeat the process by incrementing the nonce. As the hash rate of the bitcoin
    network increased, the total amount of 32-bit nonces was exhausted too quickly.
    In order to address this issue, the *extra nonce* solution was implemented, whereby
    the coinbase transaction is used as a source of extra nonce to provide a larger
    range of nonces to be searched by the miners.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '+   - Mining difficulty increased over time and bitcoins that could be mined
    by single CPU laptop computers now require dedicated mining centers to solve the
    hash puzzle. The current difficulty level can be queried using the bitcoin command
    line interface using the following command:


    ```

    $ bitcoin-cli getdifficulty

    258522748404.5154

    ```


    ![](img/62ab880d2302f959d34db648cb0bec5e_159_0.png)


    Mining difficulty over time


    The value returned by the getdifficulty command.


    # The hashing rate


    The hashing rate basically represents the rate of calculating hashes per second.
    In early days of bitcoin, it used to be quite small as CPUs were used, but with
    dedicated mining pools and ASICs now, this has gone up exponentially in the last
    few years. This has resulted in increased difficulty. The following hash rate
    graph shows the hash rate increase over time and is currently measured in Exa
    hashes. This means that in 1 second, bitcoin network miners are computing more
    than 1 000 000 000 000 000 000 hashes per second.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/62ab880d2302f959d34db648cb0bec5e_160_0.png)


    # Mining systems


    Over time, bitcoin miners have used various methods to mine bitcoins. As the core
    principle behind mining is based on the double SHA256 algorithm, overtime miners
    have developed sophisticated systems to calculate the hash faster and faster.
    The following is a review of the different types of mining methods used in bitcoin
    and how they evolved with time.


    # CPU


    CPU mining was the first type of mining available in the original bitcoin client.
    Users could even use laptop or desktop computers to mine bitcoins. CPU mining
    is no longer profitable and now more advanced mining methods such as ASIC-based
    mining are used.


    # GPU


    Due to the increased difficulty of the bitcoin network and general tendency of
    finding faster methods to mine, miners started to use GPUs or graphics cards available
    in PCs to perform mining. GPUs support faster and parallelized calculations that
    are usually programmed using the OpenCL language. This turned out to be a faster
    option as compared to CPUs. Users also used techniques such as overclocking to
    gain maximum benefit of the GPU power. Also, the possibility of using multiple
    graphics cards increased the popularity of graphics cards'' usage for bitcoin
    mining. GPU mining, however, has some limitations, such as overheating and the
    requirement for specialized motherboards and extra hardware to house multiple
    graphics cards.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# FPGA


    Even GPU mining did not last long, and soon miners found another way to perform
    mining using FPGAs. Field Programmable Gate Array (FPGA) is basically an integrated
    circuit that can be programmed to perform specific operations. FPGAs are usually
    programmed in hardware description languages (HDLs), such as Verilog and VHDL.
    Double SHA256 quickly became an attractive programming task for FPGA programmers
    and several open source projects started too. FPGA offered much better performance
    as compared to GPUs; however, issues such as accessibility, programming difficulty,
    and the requirement for specialized knowledge to program and configure FPGAs resulted
    in a short life of the FPGA era for bitcoin mining. Also, the arrival of ASICs
    resulted in quickly phased out FPGA-based systems for mining. Mining hardware
    such as X6500 miner, Ztex, and Icarus were developed during the time when FPGA
    mining was profitable. Various FPGA manufacturers, such as Xilinx and Altera,
    produce FPGA hardware and development boards that can be used to program mining
    algorithms.


    # ASICs


    Application Specific Integrated Circuit (ASIC) was designed to perform the SHA-256
    operation. These special chips were sold by various manufacturers and offered
    a very high hashing rate. This worked for some time, but due to the quickly increasing
    mining difficulty level, single-unit ASICs are no longer profitable.


    Currently, mining is out of the reach of individuals and now professional mining
    centers using thousands of ASIC units in parallel are offering mining contracts
    to users to perform mining on their behalf. There is no technical limitation,
    that''s why a single user cannot run thousands of ASICs in parallel, but it will
    require dedicated data centers and hardware and cost for a single individual can
    become prohibitive.


    ![](img/62ab880d2302f959d34db648cb0bec5e_161_0.png)


    Four types of mining (CPU, GPU, FPGA, and ASIC)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# Mining pools


    A mining pool forms when group miners work together to mine a block. The Pool
    manager receives the coinbase transaction if the block is successfully mined,
    which is then responsible for distributing the reward to the group of miners who
    invested resources to mine the block. This is profitable as compared to solo mining,
    where only one sole miner is trying to solve the partial hash inversion function
    (hash puzzle) because in mining pools, the reward is paid to each member of the
    pool regardless of whether they (more specifically, their individual node) solved
    the puzzle or not.


    There are various models that a mining pool manager can use to pay to the miners,
    such as the pay-per-share model and the proportional model. In the pay per share
    model, the mining pool manager pays a flat fee to all miners who participated
    in the mining exercise, whereas in the proportional model, the share is calculated
    based on the amount of computing resources spent to solve the hash puzzle.


    Many commercial pools now exist and provide mining service contracts via the cloud
    and easy-to-use web interfaces. The most commonly used ones are AntPool, F2Pool,
    and BW.COM. A comparison of hashing power for all major mining pools is shown
    in the following image:


    ![](img/62ab880d2302f959d34db648cb0bec5e_162_0.png)


    Mining pools and their hashing power (hash rate) as of 06/02/2017, taken from
    https://blockchain.info/pools'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'Mining centralization is a major concern that can occur if a pool manages to
    control more than 51% of the network by generating more than 51% hash rate of
    the bitcoin network. As discussed earlier in the introduction section, 51% attack
    can result in double spending attacks, and it can impact consensus and in fact
    impose another version of transaction history on the bitcoin network.


    This has happened once in the bitcoin history, when GHash.IO, a large mining pool,
    managed to acquire more than 51% of the network capacity. Theoretical solutions,
    such as two-phase Proof of Work, have been proposed in academia to disincentivize
    large mining pools. This scheme introduces a second cryptographic puzzle that
    results in mining pools to reveal their private keys or providing a considerable
    portion of the hashrate of their mining pool, thus reducing the overall hashrate
    of the pool.


    Various types of hardware are commercially available for mining purposes. Currently,
    the most profitable one is ASIC mining, and specialized hardware is available
    from a number of vendors. Solo mining is not much profitable now unless a vast
    amount of money and energy is spent to build your own mining rig or even center.
    With the current difficulty factor (Oct 2016), if a user manages to produce a
    hash rate of 12 TH/s, they can hope to make 0.01366887 BTC (around $8) per day,
    which is very low as compared to the investment required to source the equipment
    that can produce 12 TH. Including running costs such as electricity, this turns
    out to be not very profitable.


    # The bitcoin network


    The bitcoin network is a P2P network where nodes exchange transactions and blocks.
    There are different types of nodes on the network. There are two main types of
    nodes, full nodes and SPV nodes. Full nodes, as the name implies, are implementations
    of bitcoin core clients performing the wallet, miner, full blockchain storage,
    and network routing functions. However, it is not necessary to perform all these
    functions. SPV nodes or lightweight clients perform only wallet and network routing
    functionality. The latest version of Bitcoin protocol is 70014 and was introduced
    with bitcoin core client 0.13.0.


    Some nodes prefer to be full blockchain nodes only and contain complete blockchain
    and perform network routing functions but do not perform mining or store private
    keys (the wallet function). Another type is solo miner nodes that can perform
    mining, store full blockchain, and act as a bitcoin network routing node.'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'There are a few nonstandard but heavily used nodes that are called pool protocol
    servers. These nodes make use of alternative protocols, such as the stratum protocol.
    Some nodes perform only mining functions and are called mining nodes. Nodes that
    only compute hashes use the stratum protocol to submit their solutions to the
    mining pool. It is possible to run an SPV client runs a wallet and network routing
    function without a blockchain.


    Most protocols on the Internet are line-based, which means that each line is delimited
    by a carriage return and newline `\r\n` character. Stratum is also a line-based
    protocol that makes use of plain TCP sockets and human-readable JSON-RPC to operate
    and communicate between nodes.


    Bitcoin network is identified by its different magic values. A list is shown as
    follows:


    | Network | Magic value | Hex |

    |---|---|---|

    | main | 0xD9B4BEF9 | F9 BE B4 D9 |

    | testnet3 | 0x0709110B | 0B 11 09 07 |


    Magic values are used to indicate the message origin network.


    A full node performs four functions: wallet, miner, blockchain, and the network
    routing node.


    When a bitcoin core node starts up, first, it initiates the discovery of all peers.
    This is achieved by querying DNS seeds that are hardcoded into the bitcoin core
    client and are maintained by bitcoin community members. This lookup returns a
    number of DNS A records. The bitcoin protocol works on TCP port 8333 by default
    for the main network and TCP 18333 for testnet.


    ```

    vSeeds.push_back(CDNSSeedData("bitcoin.sipa.be", "seed.bitcoin.sipa.be", true));
    // Pieter Wuille

    vSeeds.push_back(CDNSSeedData("bluematt.me", "dnsseed.bluematt.me")); // Matt
    Corallo

    vSeeds.push_back(CDNSSeedData("dashjr.org", "dnsseed.bitcoin.dashjr.org")); //
    Luke Dashjr

    vSeeds.push_back(CDNSSeedData("bitcoinstats.com", "seed.bitcoinstats.com")); //
    Christian Decker

    vSeeds.push_back(CDNSSeedData("xf2.org", "bitseed.xf2.org")); // Jeff Garzik

    vSeeds.push_back(CDNSSeedData("bitcoin.jonasschnelli.ch", "seed.bitcoin.jonasschnelli.ch",
    true)); // Jonas Schnelli

    ```'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'First, the client sends a protocol message Version that contains various fields,
    such as version, services, timestamp, network address, nonce, and some other fields.
    The remote node responds with its own version message followed by verack message
    exchange between both nodes, indicating that the connection has been established.


    After this, Getaddr and addr messages are exchanged to find the peers that the
    client do not know. Meanwhile, either of the nodes can send a ping message to
    see whether the connection is still live.


    Now the block download can begin. If the node already has all blocks fully synchronized,
    then it listens for new blocks using the Inv protocol message; otherwise, it first
    checks whether it has a response to inv messages and have inventories already.
    If yes, then it requests the blocks using the Getdata protocol message; if not,
    then it requests inventories using the GetBlocks message. This method was used
    until version 0.9.3.


    ![](img/62ab880d2302f959d34db648cb0bec5e_165_0.png)


    Protocol visualization node discovery'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'Initial block download can use blocks first or the headers-first method to
    synchronize blocks depending on the version of the bitcoin core client. The blocks-first
    method is very slow and was discontinued since version 0.10.0.


    Since version 0.10.0, the initial block download method named headers-first was
    introduced. This resulted in major performance improvement and the blockchain
    synchronization that used to take days to complete started taking only a few hours.
    The core idea is that the new node-first asks peers for block headers and validates
    them. Once this is completed, blocks are requested in parallel from all available
    peers as the blueprint of the complete chain is already downloaded in the form
    of the block header chain.


    In this method, when the client starts up, it checks whether the block chain is
    fully synchronized already if the header chain is already synchronized; if not,
    which is the case the first time the client starts up, it requests headers from
    other peers using the getHeaders message. If the block chain is fully synchronized,
    it listens for new blocks via Inv messages, and if it already has a fully synchronized
    header chain, then it requests blocks using Getdata protocol messages. The node
    also checks whether the header chain has more headers than blocks and then it
    requests blocks by issuing the Getdata protocol message.


    ![](img/62ab880d2302f959d34db648cb0bec5e_166_0.png)


    Bitcoin Core Client >= 0.10.0 header and block synchronization. IBD = Initial
    block download and sync node means the node from where the blocks are being requested
    from'
  merge: -1
  img_proc: true
