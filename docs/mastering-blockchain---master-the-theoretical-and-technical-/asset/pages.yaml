    \ how the web3 library can be used to interact with the contracts on the blockchain.\n\
    \n# Development frameworks\n\nThere are various development frameworks now available\
    \ for Ethereum. As seen in the examples discussed earlier, it can be quite time\
    \ consuming to deploy the contract via the usual manual means. This is where truffle\
    \ and similar frameworks such as embark can be used to make the process simpler\
    \ and quicker. The most widely used framework is called truffle. In the next section,\
    \ you will be introduced to the truffle framework.\n\n# Truffle\n\nTruffle is\
    \ a development environment that makes it easier and simpler to test and deploy\
    \ Ethereum contracts. Truffle provides contract compilation and linking along\
    \ with an automated testing framework using Mocha and Chai. It also makes it easier\
    \ to deploy the contracts to any PrivateNet, public, or Test Net Ethereum blockchain.\
    \ Also, asset pipeline is provided, which makes it easier for all JavaScript files\
    \ to be processed, making them ready for use by a browser.\n\n# Installation\n\
    \nBefore installation, it is assumed that the node is available, which can be\
    \ queried as shown here. If the node is not available, then the installation of\
    \ the node is required first in order to install truffle:\n\n```\ndrequinox@drequinox-OP7010:~/testdapp$\
    \ nodejs --version\n```"
