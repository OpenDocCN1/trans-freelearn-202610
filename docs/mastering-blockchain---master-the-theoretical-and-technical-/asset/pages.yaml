- pgno: 93
  md: '# Integer factorization


    These schemes are based on the fact that large integers are very hard to factor.
    RSA is the prime example of this type of algorithm.


    # Discrete logarithm


    This is based on a problem in modular arithmetic that it is easy to calculate
    the result of modulo function but it is computationally infeasible to find the
    exponent of the generator. In other words, it is extremely difficult to find the
    input from the result. This is a one-way function.


    For example, consider the following equation:


    $3^2 \ mod\ 10 = 9$


    Now given 9 finding 2, the exponent of the generator 3 is very hard. This hard
    problem is commonly used in Diffie-Hellman key exchange and digital signature
    algorithms.


    # Elliptic curves


    This is based on the discrete logarithm problem discussed earlier, but in the
    context of elliptic curves. Elliptic curve is an algebraic cubic curve over a
    field, which can be defined by an equation shown here. The curve is non-singular,
    which means that it has no cusps or self-intersections. It has two variables $a$,
    $b$, along with a point of infinity.


    $y^2 = x^3 + ax + b$


    Here, $a$, $b$ are integers that can have various values and are elements of the
    field on which the elliptic curve is defined. Elliptic curves can be defined over
    reals, rational numbers, complex numbers, or finite fields. For cryptographic
    purposes, elliptic curve over prime finite fields is used instead of real numbers.
    Additionally, the prime should be greater than 3. Different curves can be generated
    by varying the value of $a$, $b$.


    Mostly prominently used cryptosystems based on elliptic curves are **Elliptic
    Curve Digital Signatures Algorithm (ECDSA)** and **Elliptic Curve Diffie-Hellman
    (ECDH)** key exchange.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Public and private keys


    In order to understand public key cryptography, the first concept that needs to
    be looked at is the idea of public and private keys.


    A private key, as the names suggests, is basically a randomly generated number
    that is kept secret and held privately by the users. Private key needs to be protected
    and no unauthorized access should be granted to that key; otherwise, the whole
    scheme of public key cryptography will be jeopardized as this is the key that
    is used to decrypt messages. Private keys can be of various lengths depending
    upon the type and class of algorithms used. For example, in RSA, typically, a
    key of 1024-bit or 2048-bits is used. 1024-bit key size is no longer considered
    secure and at least 2048 bit is recommended to be used in practice.


    A public key is the public part of the private-public key pair. A public key is
    available publicly and published by the private key owner. Anyone who would then
    like to send the publisher of the public key an encrypted message can do so by
    encrypting the message using the published public key and sending it to the holder
    of the private key. No one else would be able to decrypt the message because the
    corresponding private key is held securely by the intended recipient. Once the
    public key encrypted message is received, the recipient can decrypt the message
    using the private key. There are a few concerns regarding public keys, such as
    authenticity and identification of the publisher of the public keys.


    # RSA


    A description of RSA is discussed here. RSA was invented in 1977 by Ron Rivest,
    Adi Shamir, and Leonard Adleman, hence the name RSA. This is based on the integer
    factorization problem, where the multiplication of two large prime numbers is
    easy but difficult to factor it back to the two original numbers.


    The crux of the work in the RSA algorithm is during the key generation process.
    An RSA key pair is generated by performing the steps described here.


    Modulus generation:


    +   - Select p and q very large primes

    +   - Multiply p and q , n=p.q to generate modulus n


    Generate co-prime:


    +   - Assume a number called e.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   - It should satisfy certain conditions, that is, it should be greater than
    1 and less than $(p-1)(q-1)$. In other words, $e$ must be such a number that no
    number other than 1 can be divided into $e$ and $(p-1)(q-1)$. This is called co-prime,
    that is, $e$ is the co-prime of $(p-1)(q-1)$.


    Generate public key:


    +   - Modulus generated in step 1 and $e$ generated in step 2 is pair that, together,
    is a public key. This part is the public part that can be shared with anyone;
    however, $p$ and $q$ need to be kept secret.


    Generate private key:


    +   - Private key called $d$ here and is calculated from $p$, $q$ and $e$. Private
    key is basically the inverse of $e$ modulo $(p-1)(q-1)$. In the equation form,
    it is this:


    $ed = 1 \mod (p-1)(q-1)$


    Usually, an extended Euclidean algorithm is used to calculate $d$; this algorithm
    takes $p$, $q$ and $e$ and calculates $d$. The key idea in this scheme is that
    anyone who knows $p$ and $q$ can calculate private key $d$ easily, by applying
    the extended Euclidean algorithm, but someone who doesn''t know the value of $p$
    and $q$ cannot generate $d$. This also implies that $p$ and $q$ should be large
    enough for the modulus $n$ to become very difficult (computationally infeasible)
    to factor.


    # Encryption and decryption using RSA


    RSA uses the following equation to produce cipher text:


    $C = P^e \mod n$


    This means that plain text $P$ is raised to $e$ number of times and then reduced
    to modulo $n$.


    Decryption in RSA is given by the following equation:


    $P = C^d \mod n$


    This means that the receiver who has a public key pair $(n, e)$ can decipher the
    data by raising $C$ to the value of the private key $d$ and reducing to modulo
    $n$.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# Elliptic curve cryptography (ECC)


    ECC is based on the discrete logarithm problem that is based on elliptic curves
    over finite fields (Galois fields). The main benefit of ECC over other types of
    public key algorithms is that it needs a smaller key size while providing the
    same level of security as, for example, RSA. Two notable schemes that originate
    from ECC are Elliptic Curve Diffie-Hellman (ECDH) for key exchange and Elliptic
    Curve Digital Signature Algorithm (ECDSA) for digital signatures. It can also
    be used for encryption but is not usually used for this purpose in practice; instead,
    key exchange and digital signatures are more commonly used. As ECC needs less
    space to operate, it is becoming very popular on embedded platforms or in systems
    where storage resources are limited. As a comparison, the same level of security
    can be achieved in ECC by only using 256-bit operands as compared to 3072-bits
    in RSA.


    # Mathematics behind ECC


    In order to understand ECC, a basic introduction to the underlying mathematics
    is necessary. Elliptic curve is basically a type of polynomial equation known
    as weierstrass equation that generates a curve over a finite field. The most commonly
    used field is where all arithmetic operations are performed modulo a prime p.
    Elliptic curve groups consist of points on the curve over a finite field.


    An elliptic curve can be defined as an equation here:


    y² = x³ + Ax + B mod p


    Here, A and B belong to a finite field Zp or FP (prime finite field) along with
    a special value called point of infinity. Point of infinity ∞ is used to provide
    identity operations for points on the curve.


    Furthermore, a condition also needs to be met that ensures that the equation mentioned
    earlier has no repeated roots. This means that the curve is non-singular.


    The condition is described here in the equation, which is a standard requirement
    that needs to be met. More precisely, this ensures that the curve is nonsingular:


    4a³ + 27b² ≠ 0 mod p


    A real number representation of elliptic curve can be visualized as shown in the
    following graph. This is a graph of equation over real numbers:


    y² = x³ + a x + b'
  merge: -1
