- pgno: 241
  md: '# Balance


    This value represents the number of Weis which is the smallest unit of the currency
    (Ether) in Ethereum held by the address.


    # Storageroot


    This field represents the root node of a Merkle Patricia tree that encodes the
    storage contents of the account.


    # Codehash


    This is an immutable field that contains the hash of the smart contract code that
    is associated with the account. In the case of normal accounts, this field contains
    the Keccak 256-bit hash of an empty string. This code is invoked via a message
    call.


    The world state and its relationship with accounts trie, accounts, and block header
    can be visualized in the following diagram. It shows the account data structure
    in the middle of the diagram, which contains a storage root hash derived from
    the root node of the account storage trie shown on the left. The account data
    structure is then used in the world state trie, which is a mapping between addresses
    and account states. Finally, the root node of the world state trie is hashed using
    the Keccak 256-bit algorithm and made part of the block header data structure,
    which is shown on the right-hand side of the diagram as state root hash.


    ![](img/62ab880d2302f959d34db648cb0bec5e_241_0.png)'
