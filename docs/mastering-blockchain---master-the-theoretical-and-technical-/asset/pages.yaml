  md: '# Point addition


    Point addition is shown in the following diagram. This is a geometric representation
    of point addition on elliptic curves. In this method, a line is drawn through
    the curve that intersects the curve at two points shown below P and Q, which yields
    a third point between the curve and the line. This point is mirrored as P+Q, which
    represent the result of addition as R. This is shown as P+Q in the following diagram:


