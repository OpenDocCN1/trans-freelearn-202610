- pgno: 260
  md: '# The identity function


    The identity function is available at address 4 and is denoted by the ID. It simply
    defines output as input; in other words, whatever input is given to the ID function,
    it will output the same value. Gas requirement is calculated by a simple formula:
    15 + 3 ⌈I_d/32⌉ where I_d is the input data. This means that at a high level,
    the gas requirement is dependent on the size of the input data albeit with some
    calculation performed, as shown in the preceding equation.


    All the previously mentioned precompiled contracts can become native extensions
    and can be included in the EVM opcodes in the future.


    # Accounts


    Accounts are one of the main building blocks of the Ethereum blockchain. The state
    is created or updated as a result of the interaction between accounts. Operations
    performed between and on the accounts represent state transitions. State transition
    is achieved using what''s called the Ethereum state transition function, which
    works as follows:


    +   1. Confirm the transaction validity by checking the syntax, signature validity,
    and nonce.

    +   2. Transaction fee is calculated and the sending address is resolved using
    the signature. Furthermore, sender''s account balance is checked and subtracted
    accordingly and nonce is incremented. An error is returned if the account balance
    is not enough.

    +   3. Provide enough ether (gas price) to cover the cost of the transaction.
    This is charged per byte incrementally according to the size of the transaction.

    +   4. In this step, the actual transfer of value occurs. The flow is from the
    sender''s account to receiver''s account. The account is created automatically
    if the destination account specified in the transaction does not exist yet. Moreover,
    if the destination account is a contract, then the contract code is executed.
    This also depends on the amount of gas available. If enough gas is available,
    then the contract code will be executed fully; otherwise, it will run up to the
    point where it runs out of gas.

    +   5. In cases of transaction failure due to insufficient account balance or
    gas, all state changes are rolled back with the exception of fee payment, which
    is paid to the miners.

    +   6. Finally, the remainder (if any) of the fee is sent back to the sender as
    change and fee is paid to the miners accordingly. At this point, the function
    returns the resulting state.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Types of accounts


    There are two types of accounts in Ethereum:


    +   - Externally owned accounts

    +   - Contract accounts


    The first is **externally owned accounts (EOAs)** and the other is contract accounts.
    EOAs are similar to accounts that are controlled by a private key in bitcoin.
    Contract accounts are the accounts that have code associated with them along with
    the private key. An EOA has ether balance, is able to send transactions, and has
    no associated code, whereas a **Contract Account (CA)** has ether balance, associated
    code, and the ability to get triggered and execute code in response to a transaction
    or a message. It is worth noting that due to the Turing-completeness property
    of the Ethereum blockchain, the code within contract accounts can be of any level
    of complexity. The code is executed by EVM by each mining node on the Ethereum
    network. In addition, contract accounts are able to maintain their own permanent
    state and can call other contracts. It is envisaged that in the serenity release,
    the distinction between externally owned accounts and contract accounts may be
    eliminated.


    # Block


    As discussed earlier, blocks are the main building blocks of a blockchain. Ethereum
    blocks consist of various components, which are described as follows:


    +   - The block header

    +   - The transactions list

    +   - The list of headers of Ommers or Uncles


    The transaction list is simply a list of all transactions included in the block.
    In addition, the list of headers of Uncles is also included in the block. The
    most important and complex part is the block header, which is discussed here.


    # Block header


    Block headers are the most critical and detailed components of an Ethereum block.
    The header contains valuable information, which is described in detail here.'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# Parent hash


    This is the Keccak 256-bit hash of the parent (previous) block''s header.


    # Ommers hash


    This is the Keccak 256-bit hash of the list of Ommers (Uncles) blocks included
    in the block.


    # Beneficiary


    Beneficiary field contains the 160-bit address of the recipient that will receive
    the mining

    reward once the block is successfully mined.


    # State root


    The state root field contains the Keccak 256-bit hash of the root node of the
    state trie. It is

    calculated after all transactions have been processed and finalized.


    # Transactions root


    The transaction root is the Keccak 256-bit hash of the root node of the transaction
    trie.

    Transaction trie represents the list of transactions included in the block.


    # Receipts root


    The receipts root is the keccak 256 bit hash of the root node of the transaction
    receipt trie.

    This trie is composed of receipts of all transactions included in the block. Transaction

    receipts are generated after each transaction is processed and contain useful
    post-

    transaction information. More details on transaction receipts are provided in
    the next

    section.


    # Logs bloom


    The logs bloom is a bloom filter that is composed of the logger address and log
    topics from

    the log entry of each transaction receipt of the included transaction list in
    the block. Logging

    is explained in detail in the next section.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Difficulty


    The difficulty level of the current block.


    # Number


    The total number of all previous blocks; the genesis block is block zero.


    # Gas limit


    The field contains the value that represents the limit set on the gas consumption
    per block.


    # Gas used


    The field contains the total gas consumed by the transactions included in the
    block.


    # Timestamp


    Timestamp is the epoch Unix time of the time of block initialization.


    # Extra data


    Extra data field can be used to store arbitrary data related to the block.


    # Mixhash


    Mixhash field contains a 256-bit hash that once combined with the nonce is used
    to prove

    that adequate computational effort has been spent in order to create this block.


    # Nonce


    Nonce is a 64-bit hash (a number) that is used to prove, in combination with the
    mixhash

    field, that adequate computational effort has been spent in order to create this
    block.'
  merge: -1
  img_proc: true
