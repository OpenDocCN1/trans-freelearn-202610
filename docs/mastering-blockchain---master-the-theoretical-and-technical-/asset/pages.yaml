- pgno: 202
  md: 'Namecoin is used to essentially provide a service to register a key/value pair.
    One major use case of Namecoin is that it can provide a decentralized Transport
    Layer Security (TLS) certificate validation mechanism, driven by blockchain-based
    distributed and decentralized consensus.


    It is based on the same technology introduced with bitcoin, but with its own blockchain
    and wallet software. The source code for the Namecoin core is available at https://github.com/namecoin/namecoin-core.


    In summary, Namecoin provides the following three services:


    +   - Secure storage and transfer of names (keys)

    +   - Attachment of some value to the names by attaching up to 520 bytes of data

    +   - Production of a digital currency (Namecoin)


    Namecoin also for the first time introduced merged mining, which allows a miner
    to mine on more than one chain simultaneously. The idea is simple but very effective:
    miners create a Namecoin block and produce a hash of that block. Then the hash
    is added to a bitcoin block and miners solve that block at equal to or greater
    than the Namecoin block difficulty in order to prove that enough work has been
    contributed towards solving the Namecoin block.


    More precisely the Coinbase transaction is used to include the hash of the transactions
    from Namecoin (or any other altcoin). The mining task is to solve bitcoin blocks
    whose Coinbase scripSig contains a hash pointer to Namecoin (or any other altcoin)
    block. This is shown in the diagram below. If a miner manages to solve a hash
    at the bitcoin blockchain difficulty level, the bitcoin block is built and becomes
    part of the bitcoin network. In this case, the Namecoin hash is ignored by the
    bitcoin blockchain. On the other hand, if a miner solves a block at Namecoin blockchain
    difficulty level a new block is created in the Namecoin blockchain. The core benefit
    of this scheme is that all the computational power spent by the miners contributes
    towards securing both Namecoin and bitcoin:


    ![](img/62ab880d2302f959d34db648cb0bec5e_202_0.png)'
  merge: -1
