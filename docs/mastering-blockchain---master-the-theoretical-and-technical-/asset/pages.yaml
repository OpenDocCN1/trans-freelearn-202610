- pgno: 475
  md: 'On the other hand, recently, an Ethereum mauve paper written by *Vitalik Buterin*
    has been presented at Ethereum Devcon 2 in Shanghai; it describes the vision of
    a scalable Ethereum. The mauve proposal is based on a combination of sharding
    and implementation of Proof of Stake algorithm. Certain goals such as efficiency
    gain via Proof of Stake, maximally fast block time, economic finality, scalability,
    cross-shard communication, and censorship resistance have been identified in the
    paper.


    # Privacy


    Privacy of transactions is a much desired property of blockchains. However, due
    to its very nature, especially in public blockchains, everything is transparent,
    thus inhibiting its usage in various industries where privacy is of paramount
    importance, such as finance, health, and many others. There are different proposals
    made to address the privacy issue and some progress has already been made. Several
    techniques, such as indistinguishability obfuscation, usage of homomorphic encryption,
    zero knowledge proofs, and ring signatures. All these techniques have their merits
    and demerits and are discussed in the following sections.


    # Indistinguishability obfuscation


    This cryptographic technique may serve as a silver bullet to all privacy and confidentiality
    issues in blockchains but the technology is not yet ready for production deployments.
    **Indistinguishability obfuscation (IO)** allows for code obfuscation, which is
    a very ripe research topic in cryptography and, if applied to blockchains, can
    serve as an unbreakable obfuscation mechanism that will turn smart contracts into
    a black box. The key idea behind IO is what''s called by researchers a *multilinear
    jigsaw puzzle*, which basically obfuscates program code by mixing it with random
    elements, and if the program is run as intended, it will produce expected output
    but any other way of executing would render the program look random and garbage.
    This idea was first proposed by *Sahai* and others in their research paper *Candidate
    Indistinguishability Obfuscation and Functional Encryption for All Circuits.*'
  merge: -1
  img_proc: true
- pgno: 476
  md: '# Homomorphic encryption


    This type of encryption allows operations to be performed on encrypted data. Imagine
    a scenario where the data is sent to a cloud server for processing. The server
    processes it and returns the output without knowing anything about the data that
    it has processed. This is also an area ripe for research and fully homomorphic
    encryption that allows all operations on encrypted data is still not fully deployable
    in production; however, major progress in this field has already been made. Once
    implemented on blockchains, it can allow processing on cipher text which will
    allow privacy and confidentiality of transactions inherently. For example, the
    data stored on the blockchain can be encrypted using homomorphic encryption and
    computations can be performed on that data without the need for decryption, thus
    providing privacy service on blockchains. This concept has also been implemented
    in a project named Enigma by MIT''s Media Lab. Enigma is a peer-to-peer network
    which allows multiple parties to perform computations on encrypted data without
    revealing anything about the data.


    # Zero knowledge proofs


    Zero knowledge proofs have recently been implemented in Zcash successfully, as
    seen in previous chapters. More specifically, SNARKs have been implemented in
    order to ensure privacy on the blockchain. The same idea can be implemented in
    Ethereum and other blockchains also. Integrating Zcash on Ethereum is already
    a very active research project being run by the Ethereum R&D team and the Zcash
    Company.


    # State channels


    Privacy using state channels is also possible, simply due to the fact that all
    transactions are run off-chain and the main blockchain does not see the transaction
    at all except the final state output, thus ensuring privacy and confidentiality.


    # Secure multiparty computation


    The concept of secure multiparty computation is not new and is based on the notion
    that data is split into multiple partitions between participating parties under
    a secret sharing mechanism which then does the actual processing on the data without
    the need of the reconstructing data on single machine. The output produced after
    processing is also shared between the parties.'
  merge: -1
  img_proc: true
- pgno: 477
  md: '# Usage of hardware to provide confidentiality


    Trusted computing platforms can be used to provide a mechanism by which confidentiality
    of transaction can be achieved on a blockchain, for example, by using Intel Software
    Guard Extension (SGX), which allows code to be run in a hardware-protected environment
    called an enclave. Once the code runs successfully in the isolated enclave, it
    can produce a proof called a quote that is attestable by Intel''s cloud servers.
    However, it is a concern that trusting Intel will result in some level of centralization
    and is not in line with the true spirit of blockchain technology. Nevertheless,
    this solution has its merits and, in reality, many platforms already use Intel
    chips anyway, therefore trusting Intel may be acceptable in some scenarios.


    If this technology is applied on smart contracts then, once a node has executed
    the smart contract, it can produce the quote as a proof of correct and successful
    execution and other nodes will only have to verify it. This idea can be further
    extended by using any Trusted Execution Environment (TEE) which can provide the
    same functionality as an enclave and is available even on mobile devices with
    Near Field Communication (NFC) and a secure element.


    # Coinjoin


    Coinjoin is a technique which is used to anonymize the bitcoin transactions by
    mixing them interactively. The idea is based on forming a single transaction from
    multiple entities without causing any change in inputs and outputs. It removes
    the direct link between senders and receivers, which means that a single address
    can no longer be associated with transactions, which could lead to identification
    of the users. Coinjoin needs cooperation between multiple parties that are willing
    to create a single transaction by mixing payments. Therefore, it should be noted
    that, if any single participant in the Coinjoin scheme does not keep up with the
    commitment made to cooperate for creating a single transaction by not signing
    the transactions as required, then it can result in a denial of service attack.
    In this protocol, there is no need for a single trusted third party. This concept
    is different from mixing a service which acts as a trusted third party or intermediary
    between the bitcoin users and allows shuffling of transactions. This shuffling
    of transactions results in the prevention of tracing and the linking of payments
    to a particular user.'
  merge: -1
  img_proc: true
- pgno: 478
  md: '# Confidential transactions


    Confidential transactions make use of Pedersen commitments in order to provide
    confidentiality. Commitment schemes allow a user to commit to some value while
    keeping it secret with the capability of revealing it later. Two properties that
    need to be satisfied in order to design a commitment scheme are binding and hiding.
    Binding makes sure that the committer is unable to change the chosen value once
    committed, whereas the hiding property ensures that any adversary is unable to
    find the original value to which the committer made commitment. Pedersen commitments
    also allow addition operations and preserve commutative property on the commitments,
    which makes it specifically useful for providing confidentiality in bitcoin transactions.
    In other words, it supports homomorphic encryption of values. Using commitment
    schemes allows the hiding of payment values in a bitcoin transaction. This concept
    is already implemented in the Elements Project (https://elementsproject.org/).


    # MimbleWimble


    The MimbleWimble scheme was proposed somewhat mysteriously on the bitcoin IRC
    channel and since then has gained a lot of popularity. MimbleWimble extends the
    idea of confidential transactions and Coinjoin, which allows aggregation of transactions
    without requiring any interactivity. However, it does not support the use of bitcoin
    scripting language along with various other features of standard Bitcoin protocol.
    This makes it incompatible with existing Bitcoin protocol. Therefore, it can either
    be implemented as a sidechain to bitcoin or on its own as an alternative cryptocurrency.


    This scheme can address privacy and scalability issues both at once. The blocks
    created using the MimbleWimble technique do not contain transactions as in traditional
    bitcoin blockchains; instead, these blocks are composed of three lists: an input
    list, output list, and something called excesses which are lists of signatures
    and differences between outputs and inputs. The input list is basically references
    to the old outputs, and the output list contains confidential transactions outputs.
    These blocks are verifiable by nodes by using signatures, inputs, and outputs
    to ensure the legitimacy of the block. In contrast to bitcoin, MimbleWimble transaction
    outputs only contain pubkeys, and the difference between old and new outputs is
    signed by all participants involved in the transactions.'
  merge: -1
  img_proc: true
