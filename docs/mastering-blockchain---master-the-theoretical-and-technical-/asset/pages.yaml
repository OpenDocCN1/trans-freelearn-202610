- pgno: 103
  md: 'In the next section, an introduction to the discrete logarithm problem will
    be presented.


    # Discrete logarithm problem


    The discrete logarithm problem in ECC is based on the idea that under certain
    conditions, all points on an elliptic curve form a cyclic group.


    On an elliptic curve, the public key is a random multiple of the generator point,
    whereas the private key is a randomly chosen integer used to generate the multiple.
    In other words, a private key is a randomly chosen integer, whereas the public
    key is a point on the curve.


    The discrete logarithm problem is used to find the private key (an integer) where
    that integer falls within all points on the elliptic curve. An upcoming equation
    shows this precisely.


    Consider an elliptic curve E, with two elements P and T. The discrete logarithmic
    problem is to find the integer d, where 1 <= d <= #E, such that:


    P + P + . . . + P = d P = T


    Here, T is the public key (point on the curve) and d is the private key. In other
    words, public key is a random multiple of generator, whereas the private key is
    the integer that is used to generate the multiple. #E represents the order of
    the elliptic curve, which basically means the number of points that are present
    in the cyclic group of the elliptic curve. A cyclic group is formed by a combination
    of points on the elliptic curve and point at infinity.


    A key pair is linked with specific domain parameters of an elliptic curve. Domain
    parameters include a field size, field representation, two elements from the field
    a and b, two field elements Xg and Yg, order n of point G that is calculated as
    G=(Xg, Yg) and the cofactor h = #E(Fq)/n. A practical example using OpenSSL will
    be described later in this section.'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'There are various parameters that are recommended and standardized to use as
    curves with ECC. You are shown an example of SECP256K1 specifications here. This
    is the specification that has been used in bitcoin:


    The elliptic curve domain parameters over F_p associated with a Koblitz curve
    secp256k1 are specified by the sextuple T = (p, a, b, G, n, h) where the finite
    field F_p is defined by:


    p = FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFE FFFFFC2F

    = 2^256 − 2^32 − 2^9 − 2^8 − 2^7 − 2^6 − 2^4 − 1


    The curve E: y^2 = x^3 + ax + b over F_p is defined by:


    a = 00000000 00000000 00000000 00000000 00000000 00000000 00000000 00000000


    b = 00000000 00000000 00000000 00000000 00000000 00000000 00000000 00000007


    The base point G in compressed form is:


    G = 02 79BE667E F9DCBBAC 55A06295 CE870B07 029BFCDB 2DCE28D9 59F2815B 16F81798


    and in uncompressed form is:


    G = 04 79BE667E F9DCBBAC 55A06295 CE870B07 029BFCDB 2DCE28D9 59F2815B 16F81798
    483ADA77 26A3C465 5DA4FBFC 0E1108A8 FD17B448 A6855419 9C47D08F FB10D4B8


    Finally the order n of G and the cofactor are:


    n = FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFE BAAEDCE6 AF48A03B BFD25E8C D0364141


    h = 01


    Specification of SECP256K1 taken from http://www.secg.org/sec2-v2.pdf


    An explanation of all these values in the sextuple is given here.


    P is the prime p that specifies the size of the finite field.


    a and b are the coefficients of the elliptic curve equation.


    G is the base point that generates the required subgroup, also known as generator.
    Base point can be represented in either compressed or uncompressed form. There
    is no need to store all points on the curve in practical implementations. The
    compressed generator works because points on the curve can be identified by using
    only the x coordinate and the least significant bit of the y coordinate.


    n is the order of the subgroup.


    h is the cofactor of the subgroup.'
