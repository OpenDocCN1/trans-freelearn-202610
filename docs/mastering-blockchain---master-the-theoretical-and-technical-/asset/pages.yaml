- pgno: 119
  md: '# Message Authentication codes (MACs)


    MACs are sometimes called keyed hash functions and can be used to provide message
    integrity and authentication. In others words, they are used to provide data origin
    authentication. These are symmetric cryptographic primitives using a shared key
    between the sender and the receiver. MACs can be constructed using block ciphers
    or hash functions.


    # MACs using block ciphers


    In this approach, block ciphers are used in the Cipher block chaining mode (CBC
    mode) in order to generate a MAC. Any block cipher-for example, AES in the CBC
    mode-can be used. The MAC of the message is in fact the output of the last round
    of the CBC operation. The length of the MAC output is the same as the block length
    of the block cipher used to generate MAC. MACs are verified simply by computing
    the MAC of the message and comparing it with the received MAC. If they are the
    same, then the message integrity is confirmed; otherwise, the message is considered
    altered. It should also be noted that MACs work like digital signatures, but they
    cannot provide the nonrepudiation service due to their symmetric nature.


    # HMACs (hash-based MACs)


    Similar to the hash function, they produce a fixed length output and take an arbitrarily
    long message as the input. In this scheme, the sender signs a message using MAC
    and the receiver verifies it using the shared key. The key is hashed with the
    message using either of the two methods known as secret prefix or the secret suffix
    method. In the first method, the key is concatenated with the message, that is,
    the key comes first and the message comes after, whereas in the latter method,
    the key comes after the message:


    Secret prefix: M = MACk(x) = h(k||x)


    Secret suffix: M=MACk(x) = h(x||k)'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'There are pros and cons of both methods. Some attacks on both schemes have
    been discovered. There are HMAC constructions schemes that use various techniques,
    such as **ipad** and **opad** (inner padding and outer padding) proposed by researchers
    that are considered secure with some assumptions:


    ![](img/62ab880d2302f959d34db648cb0bec5e_120_0.png)


