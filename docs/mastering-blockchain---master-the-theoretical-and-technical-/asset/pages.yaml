    Once the build is completed, the build directory will be created if doesn''t exist
    already and a tree structure similar to the one shown here will be created. This
    is created based on the truffle.js file:


    ```

    build/

    ├── app.css

    ├── app.js

    ├── contracts

    │   ├── ConvertLib.sol.js

    │   ├── MetaCoin.sol.js

    │   └── Migrations.sol.js

    ├── images

    └── index.html

    ```


    Once the build is completed successfully, all frontend files will be ready. This
    can then be viewed in the browser using truffle''s serve command. The serve command
    creates a web server in order to present the HTML content. The command can be
    run as shown here.


    Note that the command is run with the -p flag to specify port TCP 7777. This is
    required as geth, in the example provided previously, is running with the --rpccorsdomain
    ''http://localhost:7777'' option. This means that only the content served over
    TCP 7777 is allowed. By default, serve runs on port 8080, which might be in use
    by some other process on the system as TCP 8080 is a very common port to be used
    for web applications.


    ![](img/62ab880d2302f959d34db648cb0bec5e_361_0.png)


    Once the truffle server is up and running on an appropriate port, the content
    can be browsed using a browser and pointing to URL http://localhost:7777.'
