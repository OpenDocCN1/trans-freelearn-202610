    \n    ],\n    \"app.css\": [\n      \"stylesheets/app.css\"\n    ],\n    \"images/\"\
    : \"images/\"\n  },\n  rpc: {\n    host: \"localhost\",\n    port: 8001\n  }\n\
    };\n```\n```"
