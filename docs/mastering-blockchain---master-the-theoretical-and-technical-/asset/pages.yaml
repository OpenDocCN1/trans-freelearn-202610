    # Deployment on decentralized storage using IPFS


    As discussed in Chapter 1, Blockchain 101, in order to fully benefit from decentralized
    platforms, it is desirable that you decentralize the storage and communication
    layer. Traditionally, the web content is served via centralized servers, but that
    part can also be decentralized using distributed file systems.


    The HTML content shown in the earlier examples can be stored on a distributed
    and decentralized IPFS network in order to achieve enhanced decentralization.


    IPFS is available at https://ipfs.io/.


    # Installing IPFS


    IPFS can be installed by following this process:


    +   1. Download the IPFS package using the following command:

    +   ```

    +   $ curl https://dist.ipfs.io/go-ipfs/v0.4.4/go-ipfs_v0.4.4_linux-amd64.tar.gz
    -O

    +   ```

    +   2. Decompress the gz file:

    +   ```

    +   $ tar xvfz go-ipfs_v0.4.4_linux-amd64.tar.gz

    +   ```

    +   3. Move the ipfs file to an appropriate folder in order to make it available
    in the path:

    +   ```

    +   $ mv go-ipfs/ipfs /usr/local/bin/ipfs

    +   ```'
  merge: -1
  img_proc: true
