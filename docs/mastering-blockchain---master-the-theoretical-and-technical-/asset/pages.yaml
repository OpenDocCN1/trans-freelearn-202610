- pgno: 243
  md: '# To


    As the name suggests, the `to` field is a value that represents the address of
    the recipient of the transaction.


    # Value


    `Value` represents the total number of Wei to be transferred to the recipient;
    in the case of a contract account, this represents the balance that the contract
    will hold.


    # Signature


    Signature is composed of three fields, namely *v*, *r*, and *s*. These values
    represent the digital signature (*R*, *S*) and some information that can be used
    to recover the public key (*V*). Also of the transaction from which the sender
    of the transaction can also be determined. The signature is based on ECDSA scheme
    and makes use of the SECP256k1 curve. The theory of elliptic curve cryptography
    was discussed in `Chapter 3, Cryptography and technical foundations`. In this
    section, ECDSA will be presented in the context of its usage in Ethereum.


    *V* is a single byte value that depicts the size and sign of the elliptic curve
    point and can be either 27 or 28. *V* is used in the ECDSA recovery contract as
    a recovery ID. This value is used to recover (derive) the public key from the
    private key. In secp256k1, the recovery ID is expected to be either 0 or 1. In
    Ethereum, this is offset by 27. More details on the ECDSARECOVER function will
    be provided later in this chapter.


    *R* is derived from a calculated point on the curve. First, a random number is
    picked up, which is multiplied with the generator of the curve to calculate a
    point on the curve. The *x* coordinate part of this point is *R*. *R* is encoded
    as a 32 byte sequence. *R* must be greater than 0 and less than the secp256k1n
    limit (115792089237316195423570985008687907852837564279074904382605163141518161494337).


    *S* is calculated by multiplying *R* with the private key and adding it into the
    hash of the message to be signed and by finally dividing it with the random number
    chosen to calculate *R*. *S* is also a 32 byte sequence. *R* and *S* together
    represent the signature.


    In order to sign a transaction, the `ECDSASIGN` function is used, which takes
    the message to be signed and the private key as an input and produces *V*, a single
    byte value; *R*, a 32 byte value, and *S*, another 32 byte value. The equation
    is as follows:


    ```

    *ECDSASIGN (Message, Private Key) = (V, R, S)*

    ```'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# ## Init


    The `Init` field is used only in transactions that are intended to create contracts.
    This represents a byte array of unlimited length that specifies the EVM code to
    be used in the account initialization process. The code contained in this field
    is executed only once, when the account is created for the first time, and gets
    destroyed immediately after that.


    `Init` also returns another code section called *body*, which persists and runs
    in response to message calls that the contract account may receive. These message
    calls may be sent via a transaction or an internal code execution.


    # ## Data


    If the transaction is a message call, then the `data` field is used instead of
    `init`, which represents the input data of the message call. It is also unlimited
    in size and is organized as a byte array.


    This can be visualized in the following diagram, where a transaction is a tuple
    of the fields mentioned earlier, which is then included in a transaction trie
    (a modified Merkle-Patricia tree) composed of the transactions to be included.
    Finally, the root node of transaction trie is hashed using a Keccak 256-bit algorithm
    and is included in the block header along with a list of transactions in the block.


    Transactions can be found in either transaction pools or blocks. When a mining
    node starts its operation of verifying blocks, it starts with the highest paying
    transactions in the transaction pool and executes them one by one. When the gas
    limit is reached or no more transactions are left to be processed in the transaction
    pool, the mining starts. In this process, the block is repeatedly hashed until
    a valid nonce is found that, once hashed with the block, results in a value less
    than the difficulty target. Once the block is successfully mined, it will be broadcasted
    immediately to the network, claiming success, and will be verified and accepted
    by the network. This process is similar to Bitcoin''s mining process discussed
    in the previous chapter. The only difference is that Ethereum''s Proof of Work
    algorithm is ASIC-resistant, known as *Ethash*, where finding a nonce requires
    large memory.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '![](img/62ab880d2302f959d34db648cb0bec5e_245_0.png)


    Relationship between transaction, transaction trie and block header


    # Contract creation transaction


    There are a few essential parameters that are required when creating an account.
    These parameters are listed as follows:


    +   - Sender

    +   - Original transactor

    +   - Available gas

    +   - Gas price

    +   - Endowment, which is the amount of ether allocated initially

    +   - A byte array of arbitrary length

    +   - Initialization EVM code

    +   - Current depth of the message call/contract-creation stack (current depth
    means the number of items that are already there in the stack)


    Addresses generated as a result of contract creation transaction are 160-bit in
    length. Precisely, as defined in the yellow paper, they are the rightmost 160-bits
    of the Keccak hash of the RLP encoding of the structure containing only the sender
    and the nonce. Initially, the nonce in the account is set to zero. The balance
    of the account is set to the value passed to the contract. Storage is also set
    to empty. Code hash is Keccak 256-bit hash of the empty string.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'The account is initialized when the EVM code (Initialization EVM code) is executed.
    In the case of any exception during code execution, such as not having enough
    gas, the state does not change. If the execution is successful, then the account
    is created after the payment of appropriate gas costs. The current version of
    Ethereum (homestead) specifies that the result of contract transaction is either
    a new contract with its balance, or no new contract is created with no transfer
    of value. This is in contrast to previous versions, where the contract could be
    created regardless of the contract code deployment being successful or not due
    to an out-of-gas exception.


    # Message call transaction


    A message call requires several parameters for execution, which are listed as
    follows:


    +   - Sender

    +   - The transaction originator

    +   - Recipient

    +   - The account whose code is to be executed

    +   - Available gas

    +   - Value

    +   - Gas price

    +   - Arbitrary length byte array

    +   - Input data of the call

    +   - Current depth of the message call/contract creation stack


    Message calls result in state transition. Message calls also produce output data,
    which is not used if transactions are executed. In cases where message calls are
    triggered by VM code, the output produced by the transaction execution is used.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'In the following diagram, the segregation between two types of transaction
    is shown:


    ![](img/62ab880d2302f959d34db648cb0bec5e_247_0.png)


    Types of transactions, required parameters for execution


    # Elements of the Ethereum blockchain


    In the following section, you will be introduced to various components of the
    Ethereum network and the blockchain. First, the basic concept of the EVM is given
    in the next section.


    # Ethereum virtual machine (EVM)


    EVM is a simple stack-based execution machine that runs bytecode instructions
    in order to transform the system state from one state to another. The word size
    of the virtual machine is set to 256-bit. The stack size is limited to 1024 elements
    and is based on the LIFO (Last in First Out) queue. EVM is a Turing-complete machine
    but is limited by the amount of gas that is required to run any instruction. This
    means that infinite loops that can result in denial of service attacks are not
    possible due to gas requirements. EVM also supports exception handling in case
    exceptions occur, such as not having enough gas or invalid instructions, in which
    case the machine would immediately halt and return the error to the executing
    agent.


    EVM is a fully isolated and sandboxed runtime environment. The code that runs
    on the EVM does not have access to any external resources, such as a network or
    filesystem.'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'As discussed earlier, EVM is a stack-based architecture. EVM is big-endian
    by design and it uses 256-bit wide words. This word size allows for Keccak 256-bit
    hash and elliptic curve cryptography computations.


    There are two types of storage available to contracts and EVM. The first one is
    called memory, which is a byte array. When a contract finishes the code execution,
    the memory is cleared. It is akin to the concept of RAM. The other type, called
    storage, is permanently stored on the blockchain. It is a key value store.


    Memory is unlimited but constrained by gas fee requirements. The storage associated
    with the virtual machine is a word addressable word array that is nonvolatile
    and is maintained as part of the system state. Keys and value are 32 bytes in
    size and storage. The program code is stored in a virtual read-only memory (virtual
    ROM) that is accessible using the CODECOPY instruction. The CODECOPY instruction
    is used to copy the program code into the main memory. Initially, all storage
    and memory is set to zero in the EVM.


    The following diagram shows the design of the EVM where the virtual ROM stores
    the program code that is copied into main memory using CODECOPY. The main memory
    is then read by the EVM by referring to the program counter and executes instructions
    step by step. The program counter and EVM stack are updated accordingly with each
    instruction execution.


    ![](img/62ab880d2302f959d34db648cb0bec5e_248_0.png)


    EVM operation'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'EVM optimization is an active area of research and recent research has suggested
    that EVM can be optimized and tuned to a very fine degree in order to achieve
    high performance. Research into the possibility of using **Web assembly (WASM)**
    is underway already. WASM is developed by Google, Mozilla, and Microsoft and is
    now being designed as an open standard by the W3C community group. The aim of
    WASM is to be able to run machine code in the browser that will result in execution
    at native speed. Similarly, the aim of EVM 2.0 is to be able to run the EVM instruction
    set (Opcodes) natively in CPUs, thus making it faster and efficient.


    # Execution environment


    There are some key elements that are required by the execution environment in
    order to execute the code. The key parameters are provided by the execution agent,
    for example, a transaction. These are listed as follows:


    +   1. The address of the account that owns the executing code.

    +   2. The address of the sender of the transaction and the originating address
    of this execution.

    +   3. The gas price in the transaction that initiated the execution.

    +   4. Input data or transaction data depending on the type of executing agent.
    This is a byte array; in the case of a message call, if the execution agent is
    a transaction, then the transaction data is included as input data.

    +   5. The address of the account that initiated the code execution or transaction
    sender. This is the address of the sender in case the code execution is initiated
    by a transaction; otherwise, it''s the address of the account.

    +   6. The value or transaction value. This is the amount in Wei. If the execution
    agent is a transaction, then it is the transaction value.

    +   7. The code to be executed presented as a byte array that the iterator function
    picks up in each execution cycle.

    +   8. The block header of the current block

    +   9. The number of message calls or contract creation transactions currently
    in execution. In other words, this is the number of CALLs or CREATEs currently
    in execution.'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'The execution environment can be visualized as a tuple of nine elements, as
    follows:


    ![](img/62ab880d2302f959d34db648cb0bec5e_250_0.png)


    Execution environment Tuple


    In addition to the previously mentioned nine fields, system state and the remaining
    gas are also provided to the execution environment. The execution results in producing
    the resulting state, gas remaining after the execution, self-destruct or suicide
    set (described later), log series (described later), and any gas refunds.


    # Machine state


    Machine state is also maintained internally by the EVM. Machine state is updated
    after each execution cycle of EVM. An iterator function (detailed in the next
    section) runs in the virtual machine, which outputs the results of a single cycle
    of the state machine. Machine state is a tuple that consist of the following elements:


    +   - Available gas

    +   - The program counter, which is a positive integer up to 256

    +   - Memory contents'
  merge: -1
  img_proc: true
- pgno: 251
  md: '+   - Active number of words in memory

    +   - Contents of the stack


    The EVM is designed to handle exceptions and will halt (stop execution) in case
    any of the following exceptions occur:


    +   - Not having enough gas required for execution

    +   - Invalid instructions

    +   - Insufficient stack items

    +   - Invalid destination of jump op codes

    +   - Invalid stack size (greater than 1024)


    # The iterator function


    The iterator function mentioned earlier performs various important functions that
    are used to set the next state of the machine and eventually the world state.
    These functions include the following:


    +   - It fetches the next instruction from a byte array where the machine code
    is stored in the execution environment.

    +   - It adds/removes (PUSH/POP) items from the stack accordingly.

    +   - Gas is reduced according to the gas cost of the instructions/Opcodes.

    +   - It increments the program counter (PC).


    Machine state can be viewed as a tuple shown in the following diagram:


    ![](img/62ab880d2302f959d34db648cb0bec5e_251_0.png)'
  merge: -1
  img_proc: true
- pgno: 252
  md: "The virtual machine is also able to halt in normal conditions if STOP or SUICIDE\
    \ or RETURN Opcodes are encountered during the execution cycle.\n\nCode written\
    \ in a high-level language such as serpent, LLL, or Solidity is converted into\
    \ the byte code that EVM understands in order for it to be executed by the EVM.\
    \ Solidity is the high-level language that has been developed for Ethereum with\
    \ JavaScript such as syntax to write code for smart contracts. Once the code is\
    \ written, it is compiled into byte code that's understandable by the EVM using\
    \ the Solidity compiler called solc.\n\nLLL (Lisp-like Low-level language) is\
    \ another language that is used to write smart contract code. Serpent is a Python-like\
    \ high-level language that can be used to write smart contracts for Ethereum.\n\
    \nFor example, a simple program in solidity is shown as follows:\n\n```\npragma\
    \ solidity ^0.4.0;\ncontract Test1\n{\n    uint x=2;\n    function addition1(uint\
    \ x) returns (uint y) {\n    y=x+2;\n    }\n}\n```\n\nThis program is converted\
    \ into bytecode, as shown here. Details on how to compile solidity code with examples\
