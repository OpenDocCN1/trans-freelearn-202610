    There are two options to create your own virtual currency: forking existing established
    cryptocurrency source code or writing a new one from scratch. The latter option
    is less popular but the first option is easier and has allowed the creation of
    many virtual currencies over the last few years. Fundamentally, the idea is that
    first a cryptocurrency source code is forked and then appropriate changes are
    made at different strategic locations in the source code to effectively create
    a new currency.


    In the next section, readers are introduced to some altcoin projects. It is not
    possible to cover all alternative currencies in this chapter, but a few selected
    coins are discussed below. Selection is based on longevity, market cap, and innovation.
    Each coin is discussed from different angles such as theoretical foundations,
    trading, and mining.


    # Namecoin


    Namecoin is the first fork of the bitcoin source code. The key idea behind Namecoin
    is not to produce an altcoin but instead to provide improved decentralization,
    censorship resistance, privacy, security, and faster decentralized naming. Decentralized
    naming services are intended to provide a response to inherent limitations such
    as slowness and centralized control in the traditional Domain Name System (DNS)
    protocols used on the Internet. Namecoin is also the first solution to Zooko''s
    triangle, which was briefly discussed in previous chapters.'
