- pgno: 140
  md: '![](img/62ab880d2302f959d34db648cb0bec5e_140_0.png)


    From bitaddress.org private key and bitcoin address in a paper wallet


    # Public keys in bitcoin


    In public key cryptography, public keys are generated from private keys. Bitcoin
    uses ECC based on the SECP256K1 standard. A private key is randomly selected and
    is 256-bit in length. Public keys can be presented in an uncompressed or compressed
    format. Public keys are basically x and y coordinates on an elliptic curve and
    in an uncompressed format and are presented with a prefix of 04 in a hexadecimal
    format. X and Y coordinates are both 32-bit in length. In total, the compressed
    public key is 33 bytes long as compared to 65 bytes in the uncompressed format.
    The compressed version of public keys basically includes only the X part, since
    the Y part can be derived from it. The reason why the compressed version of public
    keys works is that the bitcoin client initially used uncompressed keys, but starting
    from bitcoin core client 0.6, compressed keys are used as the standard.


    Keys are identified by various prefixes, described as follows:


    +   - Uncompressed public keys used 0x04 as the prefix

    +   - Compressed public key starts with 0x03 if the y 32-bit part of the public
    key is odd

    +   - Compressed public key starts with 0x02 if the y 32-bit part of the public
    key is even


    The more detailed mathematical description and the reason why it works is described
    here. If the ECC graph is visualized, it reveals that the y coordinate can be
    either below the x axis or above the x axis and as the curve is symmetric, only
    the location in the prime field is required to be stored.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Private keys in bitcoin


    Private keys are basically 256-bit numbers chosen in the range specified by the
    SECP256K1 ECDSA recommendation. Any randomly chosen 256-bit number from 0x1 to
    0xFFFF FFFF FFFF FFFF FFFF FFFF FFFF FFFE BAAE DCE6 AF48 A03B BFD2 5E8C D036 4140
    is a valid private key.


    Private keys are usually encoded using Wallet Import Format (WIF) in order to
    make them easier to copy and use. WIF can be converted into private key and vice
    versa. The steps are described here.


    Also, Mini Private Key Format is sometimes used to encode the key in under 30
    characters in order to allow storage where physical space is limited, for example,
    etching on physical coins or damage-resistant QR codes. The bitcoin core client
    also allows the encryption of the wallet that contains the private keys.


    # Bitcoin currency units


    Bitcoin currency units are described as follows. The smallest bitcoin denomination
    is the Satoshi.


    | DENOMINATION | ABBREVIATION | FAMILIAR NAME | VALUE IN BTC |

    |---|---|---|---|

    | Satoshi | SAT | Satoshi | 0.00000001 BTC |

    | Microbit | μBTC (uBTC) | Microbitcoin or Bit | 0.000001 BTC |

    | Millibit | mBTC | Millibitcoin | 0.001 BTC |

    | Centibit | cBTC | Centibitcoin | 0.01 BTC |

    | Decibit | dBTC | Decibitcoin | 0.1 BTC |

    | Bitcoin | BTC | Bitcoin | 1 BTC |

    | DecaBit | daBTC | Decabitcoin | 10 BTC |

    | Hectobit | hBTC | Hectobitcoin | 100 BTC |

    | Kilobit | kBTC | Kilobitcoin | 1000 BTC |

    | Megabit | MBTC | Megabitcoin | 1000000 BTC |'
  merge: -1
  img_proc: true
