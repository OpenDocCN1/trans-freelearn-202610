- pgno: 253
  md: '# # Opcodes and their meaning


    There are different opcodes that have been introduced in the EVM. Opcodes are
    divided into multiple categories based on the operation they perform. The list
    of opcodes with their meaning and usage is presented here.


    # ## Arithmetic operations


    All arithmetic in EVM is modulo 2^256. This group of opcodes is used to perform
    basic arithmetic operations. The value of these operations starts from 0x00 up
    to 0x0b.


    | Mnemonic | Value | POP | PUSH | Gas | Description |

    |---|---|---:|---:|---:|---|

    | STOP | 0x00 | 0 | 0 | 0 | Halts execution |

    | ADD | 0x01 | 2 | 1 | 3 | Adds two values |

    | MUL | 0x02 | 2 | 1 | 5 | Multiplies two values |

    | SUB | 0x03 | 2 | 1 | 3 | Subtraction operation |

    | DIV | 0x04 | 2 | 1 | 5 | Integer division operation |

    | SDIV | 0x05 | 2 | 1 | 5 | Signed integer division operation |

    | MOD | 0x06 | 2 | 1 | 5 | Modulo remainder operation |

    | SMOD | 0x07 | 2 | 1 | 5 | Signed modulo remainder operation |

    | ADDMOD | 0x08 | 3 | 1 | 8 | Modulo addition operation |

    | MULMOD | 0x09 | 3 | 1 | 8 | Modulo multiplication operation |

    | EXP | 0x0a | 2 | 1 | 10 | Exponential operation (repeated multiplication of
    the base) |

    | SIGNEXTEND | 0x0b | 2 | 1 | 5 | Extends the length of 2s complement signed integer
    |


    Note that STOP is not an arithmetic operation but is categorized in this list
    of arithmetic operations due to the range of values (0s) it falls in.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Logical operations


    Logical operations include operations that are used to perform comparisons and
    Boolean logic operations. The value of these operations is in the range of 0x10
    to 0x1a.


    | Mnemonic | Value | POP | PUSH | Gas | Description |

    |---|---|---|---|---|---|

    | LT | 0x10 | 2 | 1 | 3 | Less than |

    | GT | 0x11 | 2 | 1 | 3 | Greater than |

    | SLT | 0x12 | 2 | 1 | 3 | Signed less than comparison |

    | SGT | 0x13 | 2 | 1 | 3 | Signed greater than comparison |

    | EQ | 0x14 | 2 | 1 | 3 | Equal comparison |

    | ISZERO | 0x15 | 1 | 1 | 3 | Not operator |

    | AND | 0x16 | 2 | 1 | 3 | Bitwise AND operation |

    | OR | 0x17 | 2 | 1 | 3 | Bitwise OR operation |

    | XOR | 0x18 | 2 | 1 | 3 | Bitwise exclusive OR (XOR) operation |

    | NOT | 0x19 | 1 | 1 | 3 | Bitwise NOT operation |

    | BYTE | 0x1a | 2 | 1 | 3 | Retrieve single byte from word |


    # Cryptographic operations


    There is only one operation in this category named SHA3. It is worth noting that
    this is not the standard SHA3 standardized by NIST but the original Keccak implementation.


    | Mnemonic | Value | POP | PUSH | Gas | Description |

    |---|---|---|---|---|---|

    | SHA3 | 0x20 | 2 | 1 | 30 | Used to calculate Keccak 256-bit hash. |'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# Environmental information


    There are a total of 13 instructions in this category. These opcodes are used
    to provide information related to addresses, runtime environments, and data copy
