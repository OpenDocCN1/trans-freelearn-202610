    P + Q = R


    In this case, two points are added in order to compute the coordinates of the
    third point on the curve:


    P + Q = R


    More precisely, this means that coordinates are added as shown in the following
    equation:


    (x1, y1) + (x2, y2) = (x3, y3)'
