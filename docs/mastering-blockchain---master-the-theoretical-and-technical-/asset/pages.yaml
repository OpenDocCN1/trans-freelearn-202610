- pgno: 330
  md: "In the preceding example, `function` is the keyword used to declare the function.\
    \ `OrderMatcher` is the function name, `uint x` is an optional parameter, `private`\
    \ is the **access modifier/specifier** that controls access to the function from\
    \ external contracts, `constant` is an optional keyword used to specify that this\
    \ function does not change anything in the contract but is used only to retrieve\
    \ values from the contract instead, and `returns (bool returnvalue)` is the optional\
    \ return type of the function.\n\n+   - **How to define a function:** The syntax\
    \ of defining a function is shown as follows:\n\n```\nfunction <name of the function>(<parameters>)\
    \ <visibility\nspecifier> returns (<return data type> <name of the variable>)\n\
    {\n  <function body>\n}\n```\n\n+   - **Function signature:** Functions in solidity\
    \ are identified by its signature, which is the first four bytes of the keccak-256\
    \ hash of its full signature string. This is also visible in browser solidity,\
    \ as shown in the following screenshot. **D99c89cb** is the first four bytes of\
    \ 32 byte keccak-256 hash of the function named **Matcher**.\n\n![](img/62ab880d2302f959d34db648cb0bec5e_330_0.png)\n\
    \nIn this example function, **Matcher** has the signature hash of **d99c89cb**.\
    \ This information is useful in order to build interfaces.\n\n+   - **Input parameters\
    \ of a function:** Input parameters of a function are declared in the form of\
    \ `<data type> <parameter name>`. This example clarifies the concept where `uint\
    \ x` and `uint y` are input parameters of the `checkValues` function:\n\n```\n\
    contract myContract\n{\n  function checkValues(uint x, uint y)\n  {\n  }\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 331
  md: "+   - **Output parameters of a function:** Output parameters of a function\
    \ are declared in the form of `<data type> <parameter name>`. This example shows\
    \ a simple function returning a `uint` value:\n\n```\ncontract myContract\n{\n\
    \    Function getValue() returns (uint z)\n    {\n        z=x+y;\n    }\n}\n```\n\
    \nA function can return multiple values. In the preceding example function `getValue`\
    \ only returns one value, but a function can return up to 14 values of different\
    \ data types. The names of the unused return parameters can be omitted optionally.\n\
    \n+   - **Internal function calls:** Functions within the context of the current\
    \ contract can be called internally in a direct manner. These calls are made to\
    \ call the functions that exist within the same contract. These calls result in\
    \ simple JUMP calls at the EVM byte code level.\n+   \n+   - **External function\
    \ calls:** External function calls are made via message calls from a contract\
    \ to another contract. In this case, all function parameters are copied to the\
    \ memory. If a call to an internal function is made using the `this` keyword,\
    \ it is also considered an external call. The `this` variable is a pointer that\
    \ refers to the current contract. It is explicitly convertible to an address and\
    \ all members for a contract are inherited from the address.\n+   \n+   - **Fall\
    \ back functions:** This is an unnamed function in a contract with no arguments\
    \ and return data. This function executes every time ether is received. It is\
    \ required to be implemented within a contract if the contract is intended to\
    \ receive ether; otherwise, an exception will be thrown and ether will be returned.\
    \ This function also executes if no other function signatures match in the contract.\
    \ If the contract is expected to receive ether, then the fall back function should\
    \ be declared with the `payable` modifier. The `payable` is required; otherwise,\
    \ this function will not be able to receive any ether. This function can be called\
    \ using the `address.call()` method as, for example, in the following:\n\n```\n\
    function ()\n{\n    throw;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 332
  md: 'In this case, if the fallback function is called according to the conditions
    described earlier; it will call throw, which will roll back the state to what
    it was before making the call. It can also be some other construct than throw;
    for example, it can log an event that can be used as an alert to feed back the
    outcome of the call to the calling application.


    +   - **Modifier functions:** These functions are used to change the behavior
    of a function and can be called before other functions. Usually, they are used
    to check some conditions or verification before executing the function. _(underscore)
    is used in the modifier functions that will be replaced with the actual body of
    the function when the modifier is called. Basically, it symbolizes the function
    that needs to be guarded. This concept is similar to guard functions in other
    languages.

    +   - **Constructor function:** This is an optional function that has the same
    name as the contract and is executed once a contract is created. Constructor functions
    cannot be called later on by users, and there is only one constructor allowed
    in a contract. This implies that no overloading functionality is available.

    +   - **Function visibility specifiers (access modifiers):** Functions can be
    defined with four access specifiers as follows:

    +     - **External:** These functions are accessible from other contracts and
    transactions. They cannot be called internally unless the `this` keyword is used.

    +     - **Public:** By default, functions are public. They can be called either
    internally or using messages.

    +     - **Internal:** Internal functions are visible to other derived contracts
    from the parent contract.

    +     - **Private:** Private functions are only visible to the same contract they
    are declared in.

    +   - **Other important keywords/functions throw:** `throw` is used to stop execution.
    As a result, all state changes are reverted. In this case, no gas is returned
    to the transaction originator because all the remaining gas is consumed.'
  merge: -1
  img_proc: true
- pgno: 333
  md: "# Layout of a solidity source code file\n\n# Version pragma\n\nIn order to\
    \ address compatibility issues that may arise from future versions of the solidity\
    \ compiler version, pragma can be used to specify the version of the compatible\
    \ compiler as, for example, in the following:\n\n```\npragma solidity ^0.5.0\n\
    ```\n\nThis will ensure that the source file does not compile with versions smaller\
    \ than 0.5.0 and versions starting from 0.6.0.\n\n# Import\n\nImport in solidity\
    \ allows the importing of symbols from the existing solidity files into the current\
    \ global scope. This is similar to import statements available in JavaScript,\
    \ as for example, in the following:\n\n```\nImport \"module-name\";\n```\n\n#\
    \ Comments\n\nComments can be added in the solidity source code file in a manner\
    \ similar to C-language. Multiple line comments are enclosed in /* and */, whereas\
    \ single line comments start with //.\n\nAn example solidity program is as follows,\
    \ showing the use of pragma, import, and comments:\n\n```\npragma solidity ^0.4.0;\
    \ //specify compiler version\n/*\nThis is a simple value checker contract\nthat\
    \ checks the value provided and returns boolean value\nbased on the condition\
    \ expression evaluation\n*/\nimport \"dev.oraClize.it/api.sol\";\ncontract valueChecker\
    \ {\n    uint price=10;\n    // This is price variable decared and initialized\
    \ with value 10.\n    event valueEvent(bool returnValue);\n    function Matcher\
    \ (uint8 x) returns (bool)\n    {\n        if (x>=price)\n        {\n        \
    \    valueEvent(true);\n            return true;\n        }\n    }\n}\n```\n\n\
    Sample solidity program as shown in browser solidity"
  merge: -1
  img_proc: true
- pgno: 334
  md: 'This completes a brief introduction to the solidity language. The language
    is very rich and under constant improvement. Detailed documentation and coding
    guidelines are available online.


    # # Introducing Web3


    Web3 is a JavaScript library that can be used to communicate with an Ethereum
    node via RPC communication. Web3 works by exposing methods that have been enabled
    over RPC. This allows the development of user interfaces that make use of the
    web3 library in order to interact with the contracts deployed over the blockchain.


    In order to expose the methods via `geth`, the following command can be used:


    ```

    ```bash

    $ geth --datadir .ethereum/privatenet/ --networkid 786 --rpc --rpcapi ''web3,eth,debug''
    --rpcport 8001 --rpcportdomain ''http://localhost:7777''

    ```

    ```


    Note the `--rpcapi` flag that allows the web3, eth and debug methods.


    This is a powerful library and can be explored further by attaching a `geth` instance.
    Later in the section, you will be introduced to the concepts and techniques of
    making use of web3 via JavaScript/HTML frontends.


    The geth instance can be attached using the following command:


    ```

    ```bash

    $ geth attach ipc:.ethereum/privatenet/geth.ipc

    ```

    ```


    Once the geth JavaScript console is running, web3 can be queried, for example:


    ![](img/62ab880d2302f959d34db648cb0bec5e_334_0.png)'
  merge: -1
  img_proc: true
- pgno: 335
  md: "A simple contract can be deployed using geth and interacted with using web3\
    \ via the command-line interface that geth provides (console or attach). The following\
    \ are the steps to achieve that. As an example, the following source code will\
    \ be used:\n\n```\npragma solidity ^0.4.0;\ncontract valueChecker {\n    uint\
    \ price=10;\n    event valueEvent(bool returnValue);\n    function Matcher (uint8\
    \ x) returns (bool)\n    {\n        if (x>=price)\n        {\n            valueEvent(true);\n\
    \            return true;\n        }\n    }\n}\n```\n\nNow open the geth console\
    \ that has been opened previously and follow these steps:\n\n+   1. Declare a\
    \ variable named simplecontractsource and assign the program code to it:\n\n```\n\
    > var simplecontractsource = \"pragma solidity ^0.4.0; contract valueChecker {\
    \ uint price=10;event valueEvent(bool returnValue); function Matcher (uint8 x)\
    \ returns (bool) { if (x>=price) {valueEvent(true); return true; } } }\"\n```\n\
    \nThis will display the following output:\n\n```\nundefined\n```\n\nNote that\
    \ the source code is required to be in a single line, which means that there should\
    \ be no line breaks. This can be achieved in Linux using the following command:\n\
    \n```\n$ tr --delete '\\n' < valuechecker.sol > valuecheckersingleline.sol\n```\n\
    \nIn the preceding example, valuechecker.sol is the file that has the new line\
    \ \\n character, and valuecheckersingleline.sol is the output file produced after\
    \ removing the new line character from the file. The code can then be copied and\
    \ pasted from the file into the geth JavaScript console."
  merge: -1
  img_proc: true
- pgno: 336
  md: "+   2. Now verify that the solidity compiler is available, and if it's not\
    \ available, then refer to the section in the chapter where solidity installation\
    \ is explained:\n\n```\n```text\n> eth.getCompilers()\n[\"Solidity\"]\n```\n```\n\
    \n+   3. Create a variable and assign and compile the code using solidity:\n\n\
