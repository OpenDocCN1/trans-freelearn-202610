- pgno: 374
  md: '# Oracles


    As discussed in Chapter 6, Smart Contracts, Oracles are real-world data feeds
    into smart contracts. There are various services available in order to provide
    Oracles for smart contracts. A rather prominent one is Oraclize, which is available
    at http://www.oraclize.it/. This is especially useful if the smart contract needs,
    for example, live prices from a third-party source or any other real-life data,
    such as weather conditions in a particular city. There are many use cases where
    oracles can provide a trusted data feed to smart contracts in order to enable
    them to make decisions according to real-life events. Oraclize makes it easier
    for smart contracts to access the Internet in order to get the required data.


    In order to utilize Oraclize on Ethereum, a transaction needs to be sent to the
    Oraclize contract along with the appropriate payment and the query. As a result,
    Oraclize will retrieve the results based on the query provided in the request
    transaction and send it back to the contract address. Once the transaction is
    sent back to the contract, the call-back method or fall back function will be
    called.


    At a practical level in solidity, first, the Oraclize library needs to be imported
    and then all methods that have been inherited from it can be used. Currently,
    oraclize is available to be used only on the PrivateNet (Ropsten) and Live Main
    Net Ethereum blockchain.


    Oraclize processing can be visualized as shown in the following diagram:


    ![](img/62ab880d2302f959d34db648cb0bec5e_374_0.png)'
