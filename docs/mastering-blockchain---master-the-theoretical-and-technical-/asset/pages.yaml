- pgno: 207
  md: '# # Litecoin


    Litecoin is a fork of the bitcoin source code released in 2011. It uses Scrypt
    as PoW, originally introduced in the Tenebrix coin. Litecoin allows for faster
    transactions as compared to bitcoin due to its faster block generation time of
    2.5 minutes. Also difficulty readjustment is achieved every 3.5 days roughly due
    to faster block generation time. The total coin supply is 84 million.


    Scrypt is a sequentially memory hard function that is the first alternative to
    the SHA-256-based PoW algorithm. It was originally proposed as a password-based
    key derivation function $PBKDF$. The key idea is that if the function requires
    large number of memory to run then custom hardware such as ASICs will require
    more VLSI area, which would be unfeasible to build. The Scrypt algorithm requires
    a large array of pseudo random bits to be held in memory and a key is derived
    from this in a pseudo random fashion. The algorithm is based on a phenomenon called
    **Time-Memory Tradeoff (TMTO)**. If memory requirements are relaxed then it results
    in increased computational cost. Put another way, TMTO shortens the running time
    of a programme if more memory is given to it. This tradeoff makes it infeasible
    for an attacker to gain more memory because it''s expensive and difficult to implement
    on custom hardware, or if the attacker chooses to not increase memory, then it
    results in the algorithm running slowly due to high processing requirements.


    Scrypt uses the following parameters to generate a derived key (Kd):


    +   - Passphrase: This is a string of characters to hash

    +   - Salt: This is a random string that is provided to Scrypt functions (generally
    all hash functions) in order to provide a defence against brute-force dictionary
    attacks using rainbow tables

    +   - N: This is a memory/CPU cost parameter that must be a power of 2 > 1

    +   - P: The parallelization parameter

    +   - R: The block size parameter

    +   - dkLen: The intended length of the derived key in bytes


    Formally, this function can be written as follows:


    ```

    $Kd = scrypt$ $(P, S, N, P, R, dkLen)$

    ```'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Before applying the core Scrypt function, the algorithm takes P and S as input
    and applies PBKDF2 and SHA-256-based HMAC. Then the output is fed to an algorithm
    called ROMix, which internally uses the Blockmix algorithm utilizing the Salsa20/8
    core stream cipher to fill up the memory which requires large memory to operate,
    thus enforcing the sequentially memory hard property.


    The output from this step of the algorithm is finally fed to the PBKDF2 function
    again in order to produce a derived key. This process is shown in the following
    diagram:


    ![](img/62ab880d2302f959d34db648cb0bec5e_208_0.png)


    Scrypt is used in litecoin mining with specific parameters where N= 1024, R =
    1, P=1, and S= random 80 bytes producing a 256-bit output.


    It appears that, due to the selection of these parameters, the development of
    ASICs for Scrypt for litecoin mining turned out to be not very difficult. In an
    ASIC for litecoin mining, a sequential logic can be developed that takes the data
    and nonce as input and applies the PBKDF2 algorithm with HMAC-SHA256; then the
    resultant bit stream is fed into the SALSA20/8 function which produces a hash
    that again is fed down to the PBKDF2 and HMAC-256 functions to produce a 256-bit
    hash output. As is the case with bitcoin PoW, in Scrypt also if the output hash
    is less that the target hash (already passed as input at the start, stored in
    memory, and checked with every iteration) then the function terminates; otherwise,
    the nonce is incremented and the process is repeated again until a hash is found
    that is lower than the difficulty target:'
  merge: -1
  img_proc: true
