    This chapter is an introduction to blockchain technology, its technical foundations,
    the theory behind it, and various technologies that have been combined together
    in order to build what is known today as blockchain.


    In 2008 a groundbreaking paper Bitcoin: A Peer-to-Peer Electronic Cash System
    was written on the topic of peer-to-peer electronic cash under the pseudonym Satoshi
    Nakamoto and introduced the term chain of blocks. This term over the years has
