- pgno: 26
  md: '# Preface


    This book has one goal: to provide a comprehensive introduction to the theoretical
    and practical aspects of blockchain technology. This book contains all the material
    that is required to fully understand blockchain technology. After reading this
    book, readers will be able to develop a deep understanding of inner workings of
    blockchain technology and will be able to develop blockchain applications. This
    book covers all topics relevant to blockchain technology, including cryptography,
    cryptocurrenices, Bitcoin, Ethereum, and various other platforms and tools used
    for blockchain development.


    It is recommended that readers have a basic understanding of computer science
    and basic programming experience in order to benefit fully from this book. However,
    if that is not the case then still this book can be read easily, as relevant background
    material is provided where necessary.


    # What this book covers


    Chapter 1, *Blockchain 101*, introduces the basic concepts of distributed computing
    on which blockchain technology is based. It also covers history, definitions,
    features, types, and benefits of blockchains along with consensus mechanisms that
    are at the core of blockchain technology.


    Chapter 2, *Decentralization*, covers the concepts of decentralization and its
    relationship with blockchain technology. Various methods and platforms that can
    be used to decentralize a process or system have also been introduced.


    Chapter 3, *Cryptography and Technical Foundations*, introduces the theoretical
    foundations cryptography, which is necessary to fully understand blockchain technology.
    Concepts such as public and private key cryptography, with practical examples,
    are included. Finally, an introduction to financial markets is also included as
    there are many interesting use cases for blockchain technology in the financial
    sector.


    Chapter 4, *Bitcoin*, covers Bitcoin, the first and largest blockchain. It introduces
    technical concepts related to bitcoin cryptocurrency in detail.


    Chapter 5, *Alternative Coins*, introduces alternative cryptocurrencies that were
    introduced after the invention of Bitcoin. It also presents examples of different
    altcoins, their properties, and how they have been developed and implemented.'
  merge: -1
  img_proc: true
