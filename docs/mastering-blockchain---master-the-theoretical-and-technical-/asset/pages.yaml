    # Setting up bitcoin.conf


    bitcoin.conf file is a configuration file that is used by the bitcoin core client
    to save configuration settings. All command line options for the bitcoind client
    with the exception of -conf switch can be set up in the configuration file, and
    when bitcoin-qt or bitcoind will start up, it will take the configuration information
    from that file.


    In Linux systems, this is usually found in $HOME/.bitcoin/, or it can also specified
    in the command line using the -conf=<file> switch to bitcoind core client software.


    # Starting up a node in testnet


