- pgno: 122
  md: '# Digital signatures


    Digital signatures provide a means of associating a message with an entity from
    which the message has been originated. Digital signatures are used to provide
    data origin authentication and nonrepudiation. They are calculated in two steps.
    High-level steps of an RSA digital signature scheme is given as follows:


    +   1. Calculate the hash value of the data packet. This will provide the data
    integrity guarantee as hash can be computed at the receiver''s end again and matched
    with the original hash to check whether the data has been modified in transit.
    Technically, message signing can work without hashing the data first, but is not
    considered secure.


    +   2. The second step signs the hash value with the signer''s private key. As
    only the singer has the private key, the authenticity of the signature and the
    signed data is ensured.


    Digital signatures have some important properties, such as authenticity, unforgeability,
    and nonreusability. Authenticity means that the digital signatures are verifiable
    by a receiving party. The unforgeability property ensures that only the sender
    of the message is able to use the signing functionality using the private key.
    In other words, no one else should be able to produce the signed message that
    has been produced by the legitimate sender. Non reusability means that the digital
    signature cannot be separated from a message and used for another message again.


    The operation of a generic digital signature function is shown in the following
    diagram:


    ![](img/62ab880d2302f959d34db648cb0bec5e_122_0.png)


    Digital signing (left) and verification process (right) (Example of RSA digital
    signatures)'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'If a sender wants to send an authenticated message to a receiver, there are
    two methods that can be used. These two approaches to use digital signatures with
    encryption are introduced here.


    # Sign then encrypt


    In this approach, the sender digitally signs the data using the private key, appends
    the signature to the data, and then encrypts the data and the digital signature
    using the receiver''s public key. This is considered a more secure scheme as compared
    to the encrypt then sign scheme described next.


    # Encrypt then sign


    In this approach, the sender encrypts the data using the receiver''s public key
    and then digitally signs the encrypted data.


    In practice, a digital certificate that contains the digital signature is issued
    by a certificate authority (CA) that associates a public key with an identity.


    Various schemes, such as RSA, Digital Signature Algorithm, and Elliptic Curve
    Digital Signature Algorithm-based digital signature schemes are used in practice.
    RSA is the most commonly used; however, with the traction of elliptic curve cryptography,
    ECDSA-based schemes are also becoming quite popular.


    The ECDSA scheme is described in detail here.


    # Elliptic Curve Digital signature algorithm (ECDSA)


    In order to sign and verify using the ECDSA scheme, the first key pair needs to
    be generated:


    +   1. First, define an elliptic curve E:

    +      1. With modulus P.

    +      2. Coefficients a and b.

    +      3. Generator point A that forms a cyclic group of prime order q.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '+   2. An integer $d$ is chosen randomly so that $0 < d < q$.

    +   3. Calculate public key $B$ so that $B = d A$.


    Public key is the sextuple of the form shown here:


    Kpb = (p,a,b,q,A,B)


    Private key is randomly chosen $d$ in Step 2:


    Kpr = d


    Now the signature can be generated using the private and public key.


    +   1. First, an ephemeral key $Ke$ is chosen, where $0 < Ke < q$. It should be
    ensured that $Ke$ is truly random, and no two signatures have the same key; otherwise,
    the private key can be calculated.

    +   2. Another value $R$ is calculated using $R = Ke A$, that is, by multiplying
    $A$ (the generator point) and the random ephemeral key.

    +   3. Initialize a variable $r$ with the $x$ coordinate value of point $R$. $r
    = xR$.

    +   4. The signature can be calculated as follows:


    S = (h(m) + dr)Kₑ⁻¹ mod q


    Here, $m$ is the message for which the signature is being computed and $h(m)$
    is the hash of the message $m$.


    Signature verification is carried out by following this process.


    +   1. Auxiliary value w is calculated as $w = s^{-1} mod q$.

    +   2. Auxiliary value $u1 = w . h(m) mod q$.

    +   3. Auxiliary value $u2 = w . r mod q$.

    +   4. Calculate Point $P$, $P = u1A + u2B$.

    +   5. Verification is carried out as follows.

    +   6. $r, s$ is accepted as a valid signature if x-coordinate of the point $P$
    calculated in Step 4 has the same value as the signature parameter $r mod q$.


    that is:


    *Xp = r mod q means valid signature*'
  merge: -1
  img_proc: true
