- pgno: 257
  md: '# Push operations


    These operations include PUSH operations that are used to place items on the stack.
    The range of these instructions is from 0x60 to 0x7f. There are 32 PUSH operations
    available in total in the EVM. PUSH operation, which reads from the byte array
    of the program code.


    | Mnemonic | Value | POP | PUSH | Gas | Description |

    |---|---|---|---|---|---|

    | PUSH1 ... PUSH 32 | 0x60 ... 0x7f | 0 | 1 | 3 | Used to place N right-aligned
    big-endian byte item(s) on the the stack. N is a value that ranges from 1 byte
    to 32 bytes (full word) based on the mnemonic used. |


    # Duplication operations


    As the name suggests, duplication operations are used to duplicate stack items.
    The range of values is from 0x80 to 0x8f. There are 16 DUP instructions available
    in the EVM. Items placed on the stack or removed from the stack also change incrementally
    with the mnemonic used; for example, DUP1 removes one item from the stack and
    places two items on the stack, whereas DUP16 removes 16 items from the stack and
    places 17 items.


    | Mnemonic | Value | POP | PUSH | Gas | Description |

    |---|---|---|---|---|---|

    | DUP1 ... DUP16 | 0x80 ... 0x8f | X | Y | 3 | Used to duplicate the nth stack
    item, where N is the number corresponding to the DUP instruction used. X and Y
    are the items removed and placed on the stack, respectively. |


    # Exchange operations


    SWAP operations provide the ability to exchange stack items. There are 16 SWAP
    instructions available and with each instruction, the stack items are removed
    and placed incrementally up to 17 items depending on the type of Opcode used.


    | Mnemonic | Value | POP | PUSH | Gas | Description |

    |---|---|---|---|---|---|

    | SWAP1 ... SWAP16 | 0x90 ... 0x9f | X | Y | 3 | Used to swap the nth stack item,
    where N is the number corresponding to the SWAP instruction used. X and Y are
    the items removed and placed on the stack, respectively. |'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Logging operations


    Logging operations provide opcodes to append log entries on the sub-state tuple''s
    log series field. There are four log operations available in total and they range
    from value 0x0a to 0xa4.


    | Mnemonic | Value | POP | PUSH | Gas | Description |

    |---|---|---|---|---|---|

    | LOG0 ... LOG4 | 0x0a ... 0xa4 | X | Y (0) | 375, 750, 1125, 1500, 1875 | Used
    to append log record with N topics, where N is the number corresponding to the
    LOG Opcode used. For example, LOG0 means a log record with no topics, and LOG4
    means a log record with four topics. X and Y represent the items removed and placed
    on the stack, respectively. X and Y change incrementally, starting from 2, 0 up
    to 6, 0 according to the LOG operation used. |


    # System operations


    System operations are used to perform various system-related operations, such
    as account creation, message calling, and execution control. There are six Opcodes
    available in total in this category.


    | Mnemonic | Value | POP | PUSH | Gas | Description |

    |---|---|---|---|---|---|

    | CREATE | 0xf0 | 3 | 1 | 32000 | Used to create a new account with the associated
    code. |

    | CALL | 0xf1 | 7 | 1 | 40 | Used to initiate a message call into an account.
    |

    | CALLCODE | 0xf2 | 7 | 1 | 40 | Used to initiate a message call into this account
    with an alternative account''s code. |

    | RETURN | 0xf3 | 2 | 0 | 0 | Stops the execution and returns output data. |

    | DELEGATECALL | 0xf4 | 6 | 1 | 40 | The same as CALLCODE but does not change
    the current values of the sender and the value. |

    | SUICIDE | 0xff | 1 | 0 | 0 | Stops (halts) the execution and the account is
    registered for deletion later |


    In this section, all EVM opcodes have been discussed. There are 129 opcodes available
    in the EVM of the homestead release of Ethereum in total.'
  merge: -1
  img_proc: true
