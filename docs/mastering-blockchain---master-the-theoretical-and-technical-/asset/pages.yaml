- pgno: 150
  md: '# What is UTXO?


    Unspent Transaction Output (UTXO) is an unspent transaction output that can be
    spent as an input to a new transaction. Other concepts related to transactions
    in bitcoin are described below.


    # Transaction fee


    Transaction fees are charged by the miners. The fee charged is dependent upon
    the size of the transaction. Transaction fees are calculated by subtracting the
    sum of the inputs and the sum of the outputs. The fees are used as an incentive
    for miners to encourage them to include a user transaction in the block the miners
    are creating. All transactions end up in the memory pool, from where miners pick
    up transactions based on their priority to include them in the proposed block.
    The calculation of priority is introduced later in this chapter; however, from
    a transaction fee point of view, a transaction with a higher fee will be picked
    up sooner by the miners. There are different rules based on which fee is calculated
    for various types of actions, such as sending transactions, inclusion in blocks,
    and relaying by nodes. Fees are not fixed by the Bitcoin protocol and are not
    mandatory; even a transaction with no fee will be processed in due course but
    may take a very long time.


    # Contracts


    As defined in the bitcoin core developer guide, contracts are basically transactions
    that use the bitcoin system to enforce a financial agreement. This is a simple
    definition but has far-reaching consequences as it allows users to design complex
    contracts that can be used in many real-world scenarios. Contracts allow the development
    of a completely decentralized, independent, and reduced risk platform. Various
    contracts, such as escrow, arbitration, and micropayment channels, can be built
    using the bitcoin scripting language. The current implementation of a script is
    very limited, but various types of contracts are still possible to develop. For
    example, the release of funds only if multiple parties sign the transaction or
    perhaps the release of funds only after a certain time has elapsed. Both of these
    scenarios can be realized using multiSig and transaction lock time options.


    # Transaction malleability


    Transaction malleability in bitcoin was introduced due to a bug in the bitcoin
    implementation. Due to this bug, it becomes possible for an adversary to change
    the Transaction ID of a transaction, thus resulting in a scenario where it would
    appear that a certain transaction has not been executed. This can allow scenarios
    where double deposits or withdrawals can occur. In other words, this bug allows
    the changing of the unique ID of a bitcoin transaction before it is confirmed.'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'If the ID is changed before confirmation, it would seem that the transaction
    did not happen at all, which can then allow double deposits or withdrawal attacks.


    # Transaction pools


    Also known as *memory pools*, these pools are basically created in local memory
    by nodes in order to maintain a temporary list of transactions that are not yet
    confirmed in a block.

    Transactions are included in a block after passing verification and based on their
    priority.


    # Transaction verification


    This verification process is performed by bitcoin nodes. The following is described
    in the bitcoin developer guide:


    +   1. Check the syntax and ensure that the syntax of the transaction is correct.

    +   2. Verify that inputs and outputs are not empty.

    +   3. Check whether the size in bytes is less than the maximum block size, which
    is 1 MB currently.

    +   4. The output value must be in the allowed money range (0 to 21 million BTC).

    +   5. All inputs must have a specified previous output, except for coinbase transactions,
    which should not be relayed.

    +   6. Verify that `nLockTime` must not exceed 31-bits. For a transaction to be
    valid, it should not be less than 100 bytes. Also, the number of signature operands
    in a standard signature should be less than or not more than 2.

    +   7. Reject *nonstandard* transactions; for example, `ScriptSig` is allowed
    to only push numbers on the stack. `ScriptPubkey` not passing the `isStandard()`
    checks.

    +   8. A transaction is rejected if there is already a matching transaction in
    the pool or in a block in the main branch.

    +   9. The transaction will be rejected if the referenced output for each input
    exists in any other transaction in the pool.

    +   10. For each input, there must exist a referenced output transaction. This
    is searched in the main branch and the transaction pool to find whether the output
    transaction is missing for any input, and this will be considered an orphan transaction.
    It will be added to the orphan transactions pool if a matching transaction is
    not in the pool already.

    +   11. For each input, if the referenced output transaction is the coinbase,
    it must have at least 100 confirmations; otherwise, the transaction will be rejected.

    +   12. For each input, if the referenced output does not exist or has been spent
    already, the transaction will be rejected.'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   13. Using the referenced output transactions to get input values, verify
    that each input value, as well as the sum, is in the allowed range of 0-21 million
    BTC.

    +   14. Reject the transaction if the sum of input values is less than the sum
    of output values.

    +   15. Reject the transaction if the transaction fee would be too low to get
    into an empty block.


    # Blockchain


    Blockchain is a public ledger of a timestamped, ordered, and immutable list of
    all transactions on the bitcoin network. Each block is identified by a hash in
    the chain and is linked to its previous block by referencing the previous block''s
    hash.


    In the following structure of a block, a block header is described, followed by
    a detailed diagram that provides an insight into the blockchain structure.


    # The structure of a block


    | Bytes | Name | Description |

    |---|---|---|

    | 80 | Block header | This includes fields from the block header described in
    the next section. |

    | variable | Transaction counter | The field contains the total number of transactions
    in the block, including the coinbase transaction. |

    | variable | Transactions | All transactions in the block. |


    # The structure of a block header


    | Bytes | Name | Description |

    |---|---|---|

    | 4 | Version | The block version number that dictates the block validation rules
    to follow. |

    | 32 | previous block header hash | This is a double SHA256 hash of the previous
    block''s header. |

    | 32 | merkle root hash | This is a double SHA256 hash of the merkle tree of all
    transactions included in the block. |'
  merge: -1
  img_proc: true
- pgno: 153
  md: '| 4 | Timestamp | This field contains the approximate creation time of the
    block in the Unix epoch time format. More precisely, this is the time when the
    miner has started hashing the header (the time from the miner''s point of view).
    |

    | 4 | Difficulty target | This is the difficulty target of the block. |

    | 4 | Nonce | This is an arbitrary number that miners change repeatedly in order
    to produce a hash that fulfills the difficulty target threshold. |


    ![](img/62ab880d2302f959d34db648cb0bec5e_153_0.png)


    A visualization of blockchain, block, block header, transaction and script


    As shown in the preceding diagram, blockchain is a chain of blocks where each
    block is linked to its previous block by referencing the previous block header''s
    hash. This linking makes sure that no transaction can be modified unless the block
    that records it and all blocks that follow it are also modified. The first block
    is not linked to any previous block and is known as the genesis block.'
  merge: -1
