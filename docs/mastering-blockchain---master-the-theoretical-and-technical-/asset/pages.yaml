- pgno: 447
  md: 'After genesis block creation, there is a need to add peers to the network.
    This can be achieved by creating a file named static-nodes.json, which contains
    the enode ID of the peer that geth on the Raspberry Pi will connect to for synching.


    ```

    pi@raspberrypi:~/.ethereum $ cat static-nodes.json

    [

    "enode://44352ede5b9e792e437c1c0431c1578ce3676a87e1f588434aff1299d30325c233c8d426fc57a25380481c8a36fb3be2787375e932fb4885885f6452f6efa77f@192.168.0.19:30301"

    ]

    ```


    static nodes configuration


    This information can be obtained from the geth JavaScript console by running the
    following shown command, this command should be run on the peer to which Raspberry
    is going to connect:


    ```

    > Admin.nodeInfo

    ```


    This will show the output similar to the one shown in the following screenshot:


    ```

    > admin.nodeInfo

    {

    enode: "enode://44352ede5b9e792e437c1c0431c1578ce3676a87e1f588434aff1299d30325c233c8d426fc57a25380481c8a36fb3b87375e932fb4885885f6452f6efa77f@[]:30301",

    id: "44352ede5b9e792e437c1c0431c1578ce3676a87e1f588434aff1299d30325c233c8d426fc57a25380481c8a36fb3be2787375e9
    4885885f6452f6efa77f",

    ```


    geth nodeinfo


    After this step, further instructions presented below can be followed in order
    to connect Raspberry Pi to the other node on the private network. In the example,
    the Raspberry Pi will be connected to the network ID 786 created in Chapter 8,
    Ethereum Development. The key is to use the same genesis file created previously
    and different port numbers. Different ports are not a strict requirement however.
    If the two nodes are running under a private network and access from an environment
    external to the network is required then a combination of DMZ/router and port
    forwarding will be used. Therefore it is recommended to use different TCP ports
    to allow port forwarding to work correctly. The identity switch, which hasn’t
    been introduced previously, in the following command allows for an identifying
    name to be specified for the node.'
