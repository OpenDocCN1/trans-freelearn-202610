    # Bitcoin programming and the command-line interface


    Bitcoin programming is a very rich field now. The bitcoin core client exposes
    various JSON RPC commands that can be used to construct raw transactions and perform
    other functions via custom scripts or programs. Also, the command line tool Bitcoin-cli
    is available, which makes use of the JSON-RPC interface and provides a rich toolset
    to work with Bitcoin.


    These APIs are also available via many online service provider in the form of
    bitcoin APIs, and they provide a simple HTTP REST interface. Bitcoin APIs, such
    as `blockchain.info` and bitpay, block.io, and many others, offer a myriad of
    options to develop bitcoin-based solutions.


    Various libraries are available for bitcoin programming. A list is shown as follows,
    and those if you interested can further explore the libraries.


    **Libbitcoin**: Available at https://libbitcoin.dyne.org/ and provides powerful
    command line utilities and clients.

    **Pycoin**: Available at https://github.com/richardkiss/pycoin, is a library for
    Python.

