- pgno: 76
  md: '# Introduction


    Cryptography is the science of making information secure in the presence of adversaries.
    It provides a means of secure communication in the presence of adversaries with
    assumed limitless resources. Ciphers are used to encrypt data so that if intercepted
    by an adversary, the data is meaningless to them without decryption, which requires
    the secret key.


    Cryptography is generally used to provide a confidentiality service. On its own,
    it cannot be considered a complete solution but serve as a crucial building block
    within a larger security system to address a security problem.


    Cryptography provides various security services, such as **Confidentiality, Integrity,
    Authentication**, (Entity Authentication and Data origin authentication) and **non-repudiation**.
    Additionally, accountability is also required in various security systems.


    Before discussing cryptography further, there are some mathematical terms and
    concepts that need to be explained first in order to fully understand the material
    provided later in this chapter. The next section introduces these concepts. It
    should be noted that this section is intended as a basic introduction. An explanation
    with proofs and relevant background for all these terms will require rather involved
    mathematics, which is beyond the scope of this book. More details on these topics
    can be found in any standard number theory, algebra, or cryptography text book.


    # Mathematics


    As the subject of cryptography is based on mathematics, this section will introduce
    some basic concepts that will help you understand the concepts later in the chapter.


    # Set


    A set is a collection of distinct objects, for example, X={1, 2, 3, 4, 5}.


    # Group


    A group is a commutative set with one operation that combines two elements of
    the set. The group operation is closed and associated with an identity element
    defined. Additionally, each element in the set has an inverse. Closure (closed)
    means that if, for example, elements A and B are in the set, then the resultant
    element after performing operation on the elements is also in the set. Associative
    means that the grouping of elements does not affect the result of the operation.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Field


    A field is a set that contains both additive and multiplicative groups. More precisely,
    all elements in the set form an additive and multiplicative group. It satisfies
    specific axioms for addition and multiplication. For all group operations, the
    distributive law is also applied. The law dictates that the same sum or product
    will be produced even if any terms or factors are reordered.


    # A finite field


    A finite field is a field with a finite set of elements. Also known as Galois
    fields, these structures are of particular importance in cryptography as they
    can be used to produce accurate and error-free results of arithmetic operations.
    For example, prime finite fields are used in elliptic curve cryptography to construct
    discrete logarithm problem.


    # Order


    This is the number of elements in a field. It is also known as the cardinality
    of the field.


    # Prime fields


    This is a finite field with a prime number of elements. It has specific rules
    for addition and multiplication, and each nonzero element in the field has an
    inverse. Addition and multiplication operations are performed modulo p.


    # Ring


    If more than one operation can be defined over an abelian group, that group becomes
    a ring. There are also certain properties that need to be satisfied. A ring must
    have closure and associative and distributive properties.


    # A cyclic group


    A cyclic group is a type of group that can be generated by a single element called
    the group generator. In other words, if the group operation is repeatedly applied
    to a particular element in the group, then all elements in the group can be generated.'
  merge: -1
  img_proc: true
