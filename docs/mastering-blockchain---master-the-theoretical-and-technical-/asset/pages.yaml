- pgno: 466
  md: 'In the case of AML, due to the immutable, shared, and transparent nature of
    blockchain, regulators can easily be granted access to a private blockchain where
    they can fetch data for relevant regulatory reporting. This will also result in
    reducing complexity and costs related to the current regulatory reporting paradigm
    where data is fetched from various legacy and disparate systems and aggregated
    and formatted together for reporting purposes.


    Blockchain can provide a single shared view of all financial transactions in the
    system that are cryptographically secure, authentic, and auditable, thus reducing
    the costs and complexity associated with the currently employed regulatory reporting
    methods.


    # Media


    Key issues in the media industry revolve around content distribution, rights management,
    and royalty payments to artists. For example, digital music can be copied many
    times without any restriction and any attempts to apply copy protection have been
    hacked in some way or other. There is no control over the distribution of the
    content that a musician or song writer produces; it can be copied as many times
    as needed without any restriction and consequently has an impact on the royalty
    payments. Also, payments are not always guaranteed and are based on traditional
    airtime figures. All these issues revolving around copy protection and royalty
    payments can be resolved by connecting consumers, artists, and all players in
    the industry, allowing transparency and control over the process.


    Blockchain can provide a network where digital music is cryptographically guaranteed
    to be owned only by the consumers who pay for it. This payment mechanism is controlled
    by a smart contract instead of a centralized media agency or authority. The payments
    will be automatically made based on the logic embedded within the smart contract
    and number of ''downloads''. Moreover, illegal copying of digital music files
    can be stopped altogether because everything is recorded and owned immutably in
    a transparent manner on blockchain. A music file for example can be stored with
    owner information and timestamp which can be traced throughout the blockchain
    network. Furthermore, the consumers who own a legal copy of some content are cryptographically
    tied to the content they have and it cannot be moved to another owner unless permissioned
    by the owner. Copyrights and transfers can be managed easily via blockchain once
    all digital content is immutably recorded on the blockchain. Smart contracts can
    then control the distribution and payment to all concerned parties.'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# Summary


    There are many applications of blockchain technology and as discussed in the chapter
    they can be implemented in various industries to bring about multiple benefits
    to existing solutions. In this chapter, five main industries that can benefit
    from blockchain have been discussed. First IoT was discussed, which is another
    revolutionary technology on its own; and by combining it with the blockchain several
    fundamental limitations can be addressed, which brings about tremendous benefits
    to the IoT industry. More focus has been given to IoT as it is the biggest and
    most ready candidate for adapting blockchain technology. Already, practical use
    cases and platforms have emerged in the form of **Platform as a Service** (PaaS)
    for blockchain-based IoT such as the IBM Watson IoT blockchain. IBM Blue Horizon
    is also now available for experimentation, which is a decentralized blockchain-based
    IoT network. Second, applications in the government sector were discussed whereby
    various government processes such as homeland security, identification cards,
    and benefit disbursements can be made transparent, secure, and more robust. Furthermore,
    issues in the finance sector were discussed with possible solutions that blockchain
    technology can provide. Although the finance sector is exploring the possibilities
    of using blockchain with high energy and enthusiasm, it is still far away from
    production-ready blockchain-based systems. Finally, some aspects of the health
    sector and music industry were also discussed. All these use cases and many more
    in the industry stand on pillars provided by core attributes of blockchain technology
    such as decentralization, transparency, reliability, and security. However, certain
    challenges need to be addressed before blockchain technology can be adapted fully;
    these will be discussed in the next chapter.'
