- pgno: 341
  md: 'Before using the JsonRPC interface over HTTP, geth should be started up with
    appropriate switches, as shown here:


    ```

    ```bash

    --rpcapi web3

    ```

    ```


    This switch will enable the web3 interface over HTTP.


    The Linux command curl can be used for the purpose of communicating over HTTP,
    as shown here in a few examples.


    +   - **Retrieve the list of accounts**: For example, in order to retrieve the
    list of accounts using the `personal_listAccounts` method, the following command
    can be used:


    ```

    ```bash

    $ curl --request POST --data

    ''{"jsonrpc":"2.0","method":"personal_listAccounts","params":[],"id":4}'' localhost:8001

    ```

    ```


    This will return the output, a JSON object with the list of accounts:


    ```

    ```json

    {"jsonrpc":"2.0","id":4,"result":["0x76f11b383dbc3becf8c5d9309219878caa e265c3","0xcce6450413ac80f9ee8bd97ca02b92c065d77abc"]}

    ```

    ```


    In the preceding `curl` command, the `--request` is used to specify the request
    command, POST is the request, and `--data` is used specify the parameters and
    values and, finally, `localhost:8001` is where the HTTP endpoint from geth is
    opened.


