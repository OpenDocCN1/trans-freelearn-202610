  md: 'Alternative Coins


    # ## Hashing algorithms


    This is either SHA256, Scrypt, X11, X13, X15, or any other hashing algorithm that
    is adequate for use as a consensus algorithm.


    # ## Difficulty adjustment algorithms


    Various options are available in this category to provide difficulty retargeting
    mechanisms. The most prominent examples are KGW, DGW, Nite’s Gravity Wave, and
    DigiShield. Also all these algorithms can be tweaked based on requirements to
    produce different results; therefore many variants are possible.


    # ## Inter-block time


    This is the time elapsed between the generation of each block. For bitcoin the
    blocks are generated every 10 minutes, for litecoin it’s 2.5 minutes. Any value
    can be used but an appropriate value is usually between a few minutes; if the
    generation time is too fast it might destabilize the blockchain, if it’s too slow
    it may not attract many users.


    # ## Block rewards


    A block reward is for the miner who solves the mining puzzle and is allowed to
    have a Coinbase transaction that contains the reward. This used to be 50 coins
    in bitcoin initially and now many altcoins set this parameter to a very high number;
    for example in Dogecoin it is 10,000, currently.


    # ## Reward halving rate


    This is another important factor; in bitcoin it is halved every 4 years and now
    is set to 12.5 bitcoins. It’s a variable number that can be set to any time period
    or none at all depending on the requirements.


    # ## Block size and transaction size


    This is another important factor that determines how high or low the transaction
    rate can be on the network. Block sizes in bitcoin are limited to 1 MB but in
    altcoins it can vary depending on the requirements.


    [ 175 ]'
