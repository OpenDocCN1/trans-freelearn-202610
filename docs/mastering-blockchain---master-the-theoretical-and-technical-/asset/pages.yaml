- pgno: 408
  md: '# # Alternative Blockchains


    This chapter is intended to provide an introduction to alternative blockchain
    solutions.

    With the success of bitcoin and subsequent realization of the potential of blockchain
    technology, a Cambrian explosion started that resulted in the development of various
    blockchain protocols, applications, and platforms. Some projects did not gain
    much traction, but many have succeeded in creating a solid place in this space.


    In this chapter, readers will be introduced to alternative blockchains and platforms
    that either are new blockchains on their own or complement other existing blockchains.
    These new platforms are based on the idea of providing SDKs and tools to make
    development and deployment of blockchain solutions easier. The success of Ethereum
    and bitcoin has resulted in various projects that spawned into existence by leveraging
    the underlying technologies and concepts introduced by them. These new projects
    add value by addressing the limitations in the current blockchains or enhancing
    the existing solutions by providing an additional layer of user-friendly tools
    on top of them.


    In the first section of this chapter, an introduction to new blockchain solutions
    will be given, and later sections will cover various platforms and development
    kits that complement existing blockchains. For example, BlockApps STRATO is an
    Ethereum-compliant platform for the development of blockchain applications, and
    Kadena is a new private blockchain with novel ideas such as Scalable BFT. Various
    concepts such as sidechains, drivechains, and pegging have also been introduced
    for the first time with this growth of blockchain technologies. This chapter will
    cover all these technologies and related concepts in detail. Of course, it''s
    not possible to cover all alternative chains (altchains) and platforms, but all
    those platforms have been included in this chapter that are related to blockchains,
    covered in the previous chapters, or are expected to gain traction in the near
    future.'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# Blockchains


    This section will give an introduction to new blockchain solutions. First, a new
    blockchain named Kadena is discussed in the following section.


    # Kadena


    Kadena is a recently-introduced private blockchain that has successfully addressed
    scalability and privacy issues in blockchain systems. A new Turing incomplete
    language called Pact has also been introduced with Kadena that allows the development
    of smart contracts. A key innovation in Kadena is its Scalable BFT consensus algorithm,
    which has the potential to scale to thousands of nodes without performance degradation.
    Scalable BFT is based on the original Raft algorithm and is a successor of Tangaroa
    and Juno. Tangaroa, which is a name given to an implementation of Raft with fault
    tolerance (a BFT Raft), was developed to address the availability and safety issues
    that arose from the behavior of byzantine nodes in the Raft algorithm, and Juno
    was a fork of Tangaroa that was developed by JPMorgan. Consensus algorithms are
    discussed in Chapter 1, Blockchain 101 in more detail. Both of these proposals
    have a fundamental limitation – they cannot scale while maintaining a high level
    of high performance. As such, Juno could not gain much traction. Private blockchains
    have the more desirable property of maintaining high performance as the number
    of nodes increase, but the aforementioned proposals lack this feature. Kadena
    solves this issue with its proprietary Scalable BFT algorithm, which is expected
    to scale up to thousands of nodes without any performance degradation.


    Moreover, confidentiality is another important aspect of Kadena that enables privacy
    of transactions on the blockchain. This is achieved by using a combination of
    key rotation, symmetric on-chain encryption, incremental hashing, and Double Ratchet
    protocol.


    Key rotation is used as a standard mechanism to ensure security of the private
    blockchain. It is used as a best practice to thwart any attacks if the keys have
    been compromised, by periodically changing the encryption keys. There is a native
    support for key rotation in Pact smart contract language.


    Symmetric on chain encryption allows encryption of transaction data on the blockchain.
    These transactions can be automatically decrypted by the participants of a particular
    private transaction. Double Ratchet protocol is used to provide key management
    and encryption functions.'
  merge: -1
  img_proc: true
- pgno: 410
  md: 'Scalable BFT consensus protocol ensures that adequate replication and consensus
    has been achieved before smart contract execution. Consensus is achieved by following
    the process described below:


    +   1. First, a new transaction is signed by the user and broadcasted over the
    blockchain network, which is picked up by a leader node that adds it to its immutable
    log. At this point, an incremental hash is also calculated for the log. Incremental
    hash is a type of hash function that basically allows computation of hash messages
    in the scenario where, if a previous original message which is already hashed
    is slightly changed, then the new hash message is computed from the already existing
    hash. This scheme is quicker and less resource intensive compared to a conventional
    hash function where an altogether new hash message is required to be generated
    even if the original message has only changed very slightly.


    +   2. Once the transaction is written to the log by the leader node, it signs
    the replication and incremental hash and broadcasts it to other nodes.


    +   3. Other nodes, after receiving the transaction, verify the signature of the
    leader node, add the transaction into their own logs, and broadcast their own
    calculated incremental hashes (quorum proofs) to other nodes. Finally, the transaction
    is committed into the ledger permanently after an adequate number of proofs are
    received from other nodes.


    A simplified version of this process is shown in the following diagram, where
    the leader node is recording the new transactions and then replicating them to
    the follower nodes:


    ![](img/62ab880d2302f959d34db648cb0bec5e_410_0.png)


    Consensus mechanism in Kadena'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'Once the consensus is achieved, smart contract execution can start and takes
    a number of steps, as follows:


    +   1. First, the signature of the message is verified.

    +   2. Pact smart contract layer takes over.

    +   3. Pact code is compiled.

    +   4. The transaction is initiated and executes any business logic embedded within
    smart contract. In case of any failures, an immediate rollback is initiated that
    reverts that state back to what it was before the execution started.

    +   5. Finally, the transaction completes and relevant logs are updated.


    Pact has been open sourced by Kadena and is available for download at `http://kadena.io/pact/downloads.html`.
    This can be downloaded as a standalone binary that provides a REPL for Pact language.
    An example is shown below where Pact is run by issuing the command `./pact` in
    Linux console:


    ![](img/62ab880d2302f959d34db648cb0bec5e_411_0.png)


    Pact REPL, showing sample commands and error output


    Smart contract in Pact is generally composed of three sections: keysets, modules,
    and tables. First, **keyset** defines relevant authorization schemes for tables
    and modules. Second, **module** defines which is the smart contract code encompassing
    the business logic in the form of **functions** and **Pacts**. Pacts within modules
    are composed of multiple steps and are executed sequentially.


    Pact can be used in several execution modes. These modes include **contract definition**,
    **transaction execution**, and **querying**. Contract definition mode allows a
    contract to be created on the blockchain via a single transaction message. Transaction
    execution mode entails the execution of modules of smart contract code that represent
    business logic. Querying is concerned with simply probing the contract for data
    and is executed locally on the nodes for performance reasons.'
  merge: -1
  img_proc: true
- pgno: 412
  md: "Pact uses LISP-like syntax and represents in the code exactly what will be\
    \ executed on the blockchain as it is stored on the blockchain in human-readable\
    \ format. This is in contrast to Ethereum’s EVM, which compiles into byte code\
    \ for execution, which makes it difficult to verify what code is in execution\
    \ on the blockchain. Moreover, it is Turing incomplete, supports immutable variables,\
    \ and does not allow null values, which improves overall safety of the transaction\
    \ code execution.\n\nIt is not possible to cover the complete syntax and functions\
    \ of Pact in this chapter, however, a small example is shown below that shows\
    \ the general structure of a smart contract written in Pact. This example shows\
    \ a simple addition module that defines a function named `addition` that takes\
    \ three parameters. When the code is executed it adds all three values and displays\
    \ the result.\n\nThe following example has been developed using the online Pact\
    \ compiler available at `http://kadena.io/try-pact/`:\n\n```\n```lisp\n(begin-tx)\
    \ ;testTransaction ;Begin transaction with optional NAME\n;Set transaction data\
    \ in JSON format or pact types\n(env-data { \"keyset\": { \"keys\": [\"admin\"\
    ], \"pred\": \"keys-any\" } })\n;Define keyset as NAME with KEYSET\n(define-keyset\
    \ admin-keyset (read-keyset \"keyset\"))\n;Set transaction signature KEYS.\n(env-keys\
    \ \"admin\")\n;define module using syntax (module NAME KEYSET [DOCSTRING] DEFS...)\n\
    (module additionModule admin-keyset\n  ;define function that takes three arguments\
    \ x y z\n  (defun addition (x y z) (+ x (+ y z)))\n)\n(commit-tx) ;Commit transaction.\n\
    ;use the function addition\n(use additionModule)\n;run the function addition\n\
    (format \"Result : {}\" (addition 100 200 300))\n```\n```\n\nSample Pact code\n\
    \nWhen the code is run, it produces the output shown as follows:\n\n```\n```\n\
    Begin Tx 1\ntestTransaction\nSetting transaction data\nKeyset defined\nSetting\
    \ transaction keys\nLoaded module \"additionModule\"\nCommit Tx 1\nUsing \"additionModule\"\
    \nResult : 600\n```\n```\n\nOutput of the code"
  merge: -1
  img_proc: true
- pgno: 413
  md: 'As shown in the preceding example, the execution output matches exactly with
