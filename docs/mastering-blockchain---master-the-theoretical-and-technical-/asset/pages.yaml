- pgno: 308
  md: "The example contract source code is shown as follows:\n\n```\npragma solidity\
    \ ^0.4.0;\ncontract SimpleContract2\n{\n    uint x;\n    uint z;\n    function\
    \ addition(uint x) returns (uint y)\n    {\n        z=x+5;\n        y=z;\n   \
    \ }\n    function difference(uint x) returns (uint y)\n    {\n        z=x-5;\n\
    \        y=z;\n    }\n    function division(uint x) returns (uint y)\n    {\n\
    \        z=x/5;\n        y=z;\n    }\n\n    function currValue() constant returns\
    \ (uint)\n    {\n        return z;\n    }\n}\n```\n\nThis code can simply be copied\
    \ into Mist under the contracts section, as shown here. On the left-hand side,\
    \ the source code can be copied; once verified and when no syntax errors are detected,\
