- pgno: 276
  md: 'Once get is up and running and the blockchain is fully downloaded, Ethminer
    can be run in order to start mining. Ethminer is a standalone miner that can also
    be used in the farm mode to contribute to mining pools. It can be downloaded from
    `https://github.com/Genoil/cpp-ethereum/tree/master/releases`:


    ```

    ```bash

    ethminer -G

    ```

    ```


    Running with G switch assumes that the appropriate graphics card is installed
    and configured correctly. If no appropriate graphics cards are found, ethminer
    will return an error, as shown in the following screenshot:


    ![](img/62ab880d2302f959d34db648cb0bec5e_276_0.png)


    *Error in case no appropriate GPUs can be found*


    GPU mining requires an AMD or Nvidia graphics card and an applicable OpenCL SDK.
    For NVidia chipset, it can downloaded from `https://developer.nvidia.com/cuda-downloads`.
    For AMD chipsets, it is available at `http://developer.amd.com/tools-and-sdks/opencl-zone/amd-accelerated-parallel-processing-app-sdk`.


    Once the graphics cards are installed and configured correctly, the process can
    be started by issuing the `ethminer -G` command.


    Ethminer can also be used to run benchmarking, as shown in the following screenshot.
    There are two modes that can be invoked for benchmarking. It can either be CPU
    or GPU. The commands are shown here.


    # CPU benchmarking


    ```

    ```bash

    $ ethminer -M -C

    ```

    ```


    # GPU benchmarking


    ```

    ```bash

    $ ethminer -M -G

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'The following screenshot example is shown for CPU mining benchmarking:


    ```

    drequinox@drequinox-OP7010:~$ ethminer -M -C

    ◇ 22:43:30.560 ethminer #00004000...

    Benchmarking on platform: 8-thread CPU

    Preparing DAG...

    □ 22:43:30.561 miner0 Loading full DAG of seedhash: #00000000...

    Warming up...

    Trial 1... 0

    Trial 2... DAG 22:43:38.310 miner0 Generating DAG file. Progress: 0 %

    0

    Trial 3... 0

    Trial 4... DAG 22:43:45.336 miner0 Generating DAG file. Progress: 1 %

    0

    ```


    CPU benchmarking


    The GPU device to be used can also be specified in the command line:


    ```

    $ ethminer -M -G --opencl-device 1

    ```


    As GPU mining is implemented using OpenCL AMD, chipset-based GPUs tend to work
    faster as compared to NVidia GPUs. Due to the high memory requirements (DAG creation),
    FPGAs and ASICs will not provide any major advantage over GPUs. This is done on
    purpose in order to discourage the development of specialized hardware for mining.


    # Mining rigs


    As difficulty increased over time for mining Ether, mining rigs with multiple
    GPUs were starting to be built by the miners. A mining rig usually contains around
    five GPU cards, and all of them work in parallel for mining, thus improving the
    chances of finding valid nonces for mining.


    Mining rigs can be built with some effort and are also available commercially
    from various vendors. A typical mining rig configuration includes the components
    discussed in the upcoming sections.


    # Motherboard


    A specialized motherboard with multiple PCI-E x1 or x16 slots, for example, BIOSTAR
    Hi-Fi or ASRock H81, is required.'
