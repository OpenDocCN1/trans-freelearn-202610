    # Merkle trees


    The concept of Merkle tree was introduced by *Ralph Merkle*. A visualization of
    Merkle tree is shown here, which makes it easy to understand. Merkle trees allow
    secure and efficient verification of large data sets.


    It is a binary tree in which first, the inputs are placed at the leaves (node
    with no children), and then values of pairs of child nodes are hashed together
    in order to produce a value for the parent node (internal node) until a single
    hash value known as Merkle root is achieved:


    ![](img/62ab880d2302f959d34db648cb0bec5e_120_1.png)


    A Merkle tree'
