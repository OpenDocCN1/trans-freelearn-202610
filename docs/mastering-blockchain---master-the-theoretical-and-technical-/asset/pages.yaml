- pgno: 4
  md: '# About the Author


    **Imran Bashir** has a M.Sc. in Information Security from Royal Holloway, University
    of London, and has a background in software development, solution architecture,
    infrastructure management, and IT service management. He is also a member of **Institute
    of Electrical and Electronics Engineers (IEEE)** and **British Computer Society
    (BCS)**. Imran has sixteen years of experience in the public and financial sectors.
    He worked on large scale IT projects for public sector before moving to financial
    services industry. Since then he has worked in various technical roles for different
    financial companies in Europe’s financial capital, London. He is currently working
    for an investment bank in London as Vice President in the technology department.


    *I would like to thank the talented team at Packt including Ajith Menon, Nilesh
    Sawakhande, Sumeet Sawant, and Tushar Gupta, who provided prompt guidance and
    very valuable feedback throughout this project. I am also extremely thankful to
    the reviewer, Daniel Kraft, who provided constructive and very useful feedback
    that helped tremendously to improve the material in this book.*


    *I thank my wife and children for putting up with my all-night and weekend-long
    writing sessions.*


    *Finally, I would like to thank my parents, whose blessings on me have made everything
    possible for me.*'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the Reviewer


    **Daniel Kraft** studied mathematics and physics, and holds a PhD in applied mathematics
    from the University of Graz in Austria. He has been involved in development with
    cryptocurrencies since 2013, has been the lead developer and chief scientist for
    both Namecoin and Huntercoin since 2014, and has published two research papers
    about cryptocurrency in peer-reviewed journals. He works as a software engineer
    and is a co-founder of Crypto Realities Ltd, a start-up that works on building
    decentralised multi-player game worlds with blockchain technology.'
  merge: -1
  img_proc: true
