- pgno: 452
  md: 'These components are listed as follows:


    +   1. **LED**: The abbreviation of **Light Emitting Diode**, this can be used
    as visual indication for an event.

    +   2. **Resistor**: A 330 ohm component is required which provides resistance
    to passing current based on its rating. It is not necessary to understand the
    theory behind it for this experiment; any standard electronics engineering text
    covers all these topics in detail.

    +   3. **Breadboard**: This provides a means of building an electronic circuit
    without requiring soldering.

    +   4. **T-Shaped cobbler**: This is inserted on the breadboard as shown in the
    figure below and provides a labeled view of all **GPIO (General Purpose I/O)**
    pins for the Raspberry Pi.

    +   5. **Ribbon cable connector**: This is simply used to provide connectivity
    between the Raspberry Pi and the breadboard via GPIO. All these components are
    shown in the following image:


    ![](img/62ab880d2302f959d34db648cb0bec5e_452_0.png)'
  merge: -1
