- pgno: 480
  md: 'Smart contract security is of paramount importance now, and many other initiatives
    have also been taken in order to devise methods that can analyze solidity programs
    and find bugs. A recent and seminal example is Oyente, which is a tool built by
    researchers and has been introduced in their paper *Making Smart Contracts Smarter*.
    Several security bugs in smart contracts have been discovered and analyzed in
    this paper. These include transaction ordering dependence, time stamp dependence,
    mishandled exceptions such as call stack depth limit exploitation, and re-entrance
    vulnerability. The transaction ordering dependency bug basically exploits the
    scenarios where the perceived state of a contract might not be what the state
    of the contract changes to after execution. This weakness is a type of race condition.
    It is also called frontloading and is possible due to the fact that the order
    of transactions within a block can be manipulated. As all transactions first appear
    in the memory pool, the transactions there can be monitored before they are included
    in the block. This allows a transaction to be submitted before another transaction,
    thus leading to controlling the behavior of a smart contract.


    Time stamp dependency bugs are possible in scenarios where the time stamp of the
    block is used as a source of some decision-making within the contract, but time
    stamps can be manipulated by the miners. Call stack depth limit is another bug
    that can be exploited due to the fact that the maximum call stack depth of EVM
    is 1,024 frames. If the stack depth is reached while the contract is executing
    then, in certain scenarios, the send or call instruction can fail, resulting in
    non-payment of funds. The call stack depth bug was addressed in the EIP50 hard
    fork. The re-entrancy bug was exploited in the DAO attack to siphon out millions
    of dollars into a child DAO. The re-entrancy bug basically means that a function
    can be called repeatedly before the previous (first) invocation of the functions
    has completed. This is particularly unsafe in Ether withdrawal functions in solidity
    smart contracts.


    In additional to the above-mentioned bugs, there are several other problems that
    should be kept in mind while writing contracts. These bugs include that fact that
    if sending funds to another contract, handle it carefully because send can fail
    and even if throw is used as a *catch-all* mechanism, it will not work.'
  merge: -1
  img_proc: true
- pgno: 481
  md: 'Other standard software bugs such as integer overflow and underflow are also
    quite significant and any use of integer variables should be carefully implemented
    in solidity. For example, a simple program where uint8 is used to parse through
    elements of an array with more than 255 elements can result in an endless loop.
    This occurs because uint8 is limited to 256 numbers.


    In the following sections, two examples of contract verification will be shown
    using Why3 and Oyente respectively.


    # Why3 formal verification


    Formal verification of solidity code is now available as a feature in the solidity
    browser. First the code is converted into Why3 language that the verifier can
    understand. In the example below, a simple solidity code that defines the variable
    z as maximum limit of uint is shown. When this code runs, it will result in returning
    0, because uint z will overrun and start again from 0. This can also be verified
    using Why3, which is shown below:


    ![](img/62ab880d2302f959d34db648cb0bec5e_481_0.png)


    Solidity online compiler with formal verification


    Once the solidity is compiled and available in the formal verification tab, it
    can be copied into the Why3 online IDE available at http://why3.lri.fr/try/. The
    example below shows that it successfully checks and reports integer overflow errors.
    This tool is under heavy development but is still quite useful. Also, this tool
    or any other similar tool is not a silver bullet. Even formal verification generally
    should not be considered a panacea because specifications in the first place should
    be defined appropriately:'
  merge: -1
  img_proc: true
- pgno: 482
  md: "# Oyente tool\n\nCurrently, Oyente is available as a Docker image for easy\
    \ testing and installation. It is available at https://github.com/ethereum/oyente,\
    \ and can be quickly downloaded and tested. In the example below, a simple contract\
    \ taken from solidity documentation that contains a re-entrancy bug has been tested\
    \ and it is shown that Oyente successfully analyzes the code and finds the bug:\n\
    \n![](img/62ab880d2302f959d34db648cb0bec5e_482_0.png)\n\nWhy3\n\n```\npragma solidity\
    \ ^0.4.0;\ncontract Fund {\n    mapping(address => uint) shares;\n    function\
    \ withdraw() {\n        if (msg.sender.send(shares[msg.sender]))\n           \
    \ shares[msg.sender] = 0;\n    }\n}\n```\n\nContract with re-entrancy bug – source:\
    \ solidity documentation"
  merge: -1
  img_proc: true
- pgno: 483
  md: 'This sample code contains a re-entrancy bug which basically means that if a
    contract is interacting with another contract or transferring ether, it is effectively
    handing over the control to that other contract. This allows the called contract
    to call back into the function of the contract from which it has been called without
    waiting for completion. For example, this bug can allow calling back into the
    withdraw function shown in the preceding example again and again, resulting in
    getting Ethers multiple times. This is possible because the share value is not
    set to 0 until the end of the function, which means that any later invocations
    will be successful, resulting in withdrawing again and again.


    An example is shown of Oyente running to analyze the contract shown below and
    as can be seen in the following output, the analysis has successfully found the
    re-entrancy bug. The bug is proposed to be handled by a combination of the Checks-Effects-Interactions
    pattern described in the solidity documentation:


    ![](img/62ab880d2302f959d34db648cb0bec5e_483_0.png)


    Oyente tool detecting solidity bugs'
  merge: -1
  img_proc: true
- pgno: 484
  md: '# Summary


    In this chapter, readers have been introduced to the security, confidentiality,
    and privacy aspects of blockchain technology. Privacy was discussed, which is
    another major inhibiting factor in adapting public blockchains for various industries.
    Next, smart contract security, which is a very hot topic currently, was discussed.
    It is a deep and extensive subject but a brief introduction on various aspects
    has been given, which should serve as a solid ground for further research in this
    area. For example, formal verification on its own is a vast area for research.
    Furthermore, examples of formal verification have also been provided to give readers
    an idea of what tools are available. It should be noted that the tools mentioned
    above are under heavy development and lack various desirable features. Also, documentation
    is quite scarce; therefore, readers are encouraged to keep an eye on developments,
    especially around formal verification and developments related to the Ethereum
    mauve paper, as it is going to develop rapidly very soon. The field of blockchain
    security and especially smart contract security is so ripe now that a whole book
    can be written on the subject. There are many experts and researchers in academia
    and the commercial sector exploring this area and soon there will be many automated
    tools available for the verification of smart contracts.'
  merge: -1
  img_proc: true
- pgno: 485
  md: '# 13


    # Current Landscape and

    What''s Next


    Blockchain technology will change the way we conduct our day-to-day business.
    It has challenged existing business models and has the promise of great benefits
    in terms of cost saving, and greater efficiency and transparency. This chapter
    will explore the latest developments, emerging trends, issues, and future predictions
    about this technology. Furthermore, some topics related to open research problems
    and improvements will be discussed in detail in the chapter.


    # Emerging trends


    Blockchain technology is under rapid change and intense development due to deep
    interest in it by academics and the commercial sector. As the technology is becoming
    mature, a few trends have started to emerge recently. For example, private blockchains
    have recently gained quite a lot of attention due to their specific use cases
    in finance. Also, enterprise blockchains are another new trend that is aiming
    to develop blockchain solutions that meets enterprise-level efficiency, security,
    and integration requirements. Some of the trends are listed below and discussed.'
  merge: -1
  img_proc: true
- pgno: 486
  md: '# Application-specific blockchains (ASBCs)


    Currently, an inclination toward ASBCs is noticed, whereby a blockchain or distributed
    ledger is specifically developed for only one application in mind and is focused
    on a specific industry, for example, everledger, which is a blockchain that has
    been developed to be used for providing an immutable tracing history and audit
    trail for diamonds and other high-value items. This approach thwarts any fraud
    attempts because everything related to ownership, authenticity, and value of the
    items is verified and recorded on the blockchain. This is very valuable for insurance
    and law enforcement agencies.


    # Enterprise-grade blockchains


    As blockchains in their original form are not ready for use at enterprise level
    due to privacy and scalability issues, a recent trend in developing enterprise-grade
    blockchains has emerged, whereby various companies have started to provide enterprise-grade
    blockchain solutions that are ready to be deployed and integrated at enterprise
    level. Requirements such as testing, documentation, integration, and security
    are all addressed already in this type of solution and can be implemented with
    minimal or no change at the enterprise level. This is in contrast to public blockchains,
    which are unregulated and do not meet specific enterprise-level security requirements.
    This also implies that enterprise-grade blockchains are usually supposed to be
    implemented in private configurations; however, public enterprise-grade blockchain
    implementation is also a possibility. 2016 has been a year when many technology
    start-ups have started to offer enterprise-grade blockchain solutions such as
    bloq, tymlez, chain, and many others. This trend continues to grow and 2017 will
    see more technology initiatives like this.


    # Private blockchains


    With the need for privacy and confidentiality, a major focus is on developing
    private distributed ledgers that can be used within a group of trusted participants.
    As public blockchains, due to their open and comparatively less secure nature,
    are not suitable for industries such as finance, medicine, and law, private blockchains
    hold the promise to address this limitation and bring end users one step closer
    to reaping the benefits of blockchains while meeting all security and privacy
    requirements. Public blockchains are less secure because generally they do not
    provide privacy and confidentiality services. Private blockchains allow the participants
    or a subset of participants to be in full control of the system, thus making it
    desirable for use in finance and other industries where privacy and control are
    required.'
  merge: -1
  img_proc: true
- pgno: 487
  md: 'Ethereum can be used in both private and public modes, whereas there are a
    few projects that have been developed solely as private blockchains, such as Hyperledger
    and Corda.


    # ## Start-ups


    In recent years, many technology start-ups have emerged that are working on blockchain
    projects and are offering solutions specific to this technology. 2016 especially
    has seen a significant increase in the number of start-ups that are offering blockchain
    consultancy and solutions.


    # ## Strong research interest


    Blockchain technology has stimulated intense research interest both in academia
    and the commercial sector. In recent times, the interest has greatly increased
    and now major institutions and researchers around the world are exploring this
    technology. This growth in interest is especially due to the fact that blockchain
    technology can help to make businesses efficient, reduce costs, and make things
    transparent. Academic interest is around addressing hard problems in cryptography,
    consensus mechanisms, performance, and addressing other limitations in blockchains.
    As blockchain technology comes under the wider umbrella of distributed systems,
    many researchers from distributed computing research have focused their research
    on blockchain technology. For example, UCL has a dedicated department, the *UCL
    Research Centre for Blockchain Technologies*, that focuses on blockchain technology
    research. Another example is the ETH Zurich distributed computing group that has
    published seminal research regarding blockchain technology. A recent journal called
    the Ledger Journal has recently published its first issue of research papers.
    It is available at [http://www.ledgerjournal.org/ojs/index.php/ledger](http://www.ledgerjournal.org/ojs/index.php/ledger).
    There are now teams and departments dedicated to blockchain research and development
    in various academic and commercial institutes. Although the above-mentioned initiatives
    are not an exhaustive list by any stretch of imagination, it is still a solid
    indication that this is a subject of extreme interest for researchers, and more
    research and development is expected to be seen in 2017 and beyond. Another organization
    called **The Initiative for CryptoCurrencies and Contracts (IC3)**, is also conducting
    research in smart contract and blockchain technologies. IC3 aims to address performance,
    confidentiality, and safety issues in blockchains and smart contracts and runs
    multiple projects to address these issues. More information about projects running
    in IC3 is available online at [http://www.initc3.org/](http://www.initc3.org/).'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# Standardization


    Blockchain technology is not yet mature enough to be able to readily integrate
    with existing systems. Even, as the current technology stands, two blockchain
    networks cannot easily talk to each other. Standardization will help to improve
    interoperability, adoptability, and integration aspects of blockchain technology.
    Some attempts have been made recently to address this and the most notable out
    of these attempts is the establishment of ISO/TC 307, which is a technical committee
    with the scope of standardizing blockchain and distributed ledger technology.
    The aim of the committee revolves around increasing interoperability and data
    interchange between users, applications, and systems. On the other hand, the recent
    creation of consortia and open source collaborative efforts such as R3 and Hyperledger
    has helped with standardization of this technology by sharing ideas, tools, and
    code with other participants. R3 works with a consortium of more than 80 banks
    that all have similar goals, which in a way results in standardization. Hyperledger,
    on the other hand, has a reference architecture that can be used to build blockchain
    systems and is supported by the Linux foundation and many other participants from
    the industry. Another example is the chain open standard, which is a protocol
    developed for financial networks. The chain OS1 standard is already available,
    which was built in collaboration with major financial institutions around the
    world. This standard allows faster settlement of transactions and immediate peer-to-peer
    transaction routing. It aims to address regulatory, security, and privacy requirements
    in blockchain technologies. OS1 also provides a framework for smart contract development
    and allows the participant to meet AML and KYC requirements easily.


    Smart contract standardization efforts have also started with a seminal paper
    authored by *Lee* and others, which formally defines the smart contract templates
    and presents a vision for future research and necessities in smart contract related
    research and development. This paper is available at `https://arxiv.org/abs/1608.00771v2`.
    Moreover, some discussion on this topic has been carried out in `Chapter 12, Scalability
    and Other Challenges` and `Chapter 6, Smart Contracts`.


    All of the above-mentioned efforts are a clear indication that very soon, standards
    will emerge in the industry that will further make adoption of blockchain technology
    easier and quicker. Standards will also result in exponential growth of the blockchain
    industry because availability of standards will eliminate hurdles such as interoperability.'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# Enhancements


    Various enhancements and suggestions to further develop existing blockchains have
    been made over the last few years. Most of these suggestions have been made in
    response to security vulnerabilities and to address inherent limitations in blockchain
    technology. There are certain limitations in blockchain technology, such as scalability,
    privacy, and interoperability, that are required to be addressed before it can
    become mainstream like any other technology. Recently, there have been tremendous
    efforts made toward addressing scalability issues in blockchain technology, which
    have been discussed in the previous chapter. Also blockchain-specific improvement
    proposals such as **BIPs (bitcoin improvement proposals)** and **EIPs (Ethereum
    improvement proposals)** are being made regularly by developers to address various
    concerns in these systems. Some recent and notable improvement proposals for both
    of these chains will be discussed later in the chapter. Moreover, recent advancements
    such as state channels are examples that blockchain technology is improving rapidly
    and very soon will evolve as a mature and more practical technology.


    # Real-world implementations


    Many proofs of concept have been developed in recent years, especially in 2016,
    using blockchain technology. A few application-specific implementations emerged,
    such as everledger for diamond tracking and filament for **Internet of Things
    (IoT)**, but are still lacking in various areas. Concrete, real-life, end-to-end
    implementations are not available yet, especially in the finance industry. This
    seems not too far now as many proofs of concept have already been developed and
    proved to work; the next stage is to implement these in real-life scenarios. For
    example, recently, a group of seven banks agreed to build a **Digital Trade Chain
    (DTC)** that will simplify the trade finance process.


    # Consortia


    2016 has been seen as a year when consortia and shared open source efforts started.
    This trend is expected to grow and more and more consortia, committees, and open
    source efforts will emerge soon. A prime example is R3, which has developed Corda
    with a consortium of the world''s largest financial organizations.'
  merge: -1
  img_proc: true
- pgno: 490
  md: '# Answers to challenges


    Already, due to intense research effort and interest from the community in blockchain
    technology, answers to various challenges have started to emerge. For example,
    the concept of state channels has been developed as a response to scalability
    and privacy issues on the blockchain. Using state channels, the bitcoin lightning
    network and Ethereum''s Raiden are already almost ready for implementation. Moreover,
    various blockchain solutions emerged, such as Kadena, that directly addressed
    the confidentiality issues in blockchains. Other concepts such as Zcash, Coinjoin,
    and confidential transactions have also been developed and were discussed in previous
    chapters. This trend will also continue to grow in years to come and even if almost
    all fundamental challenges are addressed in blockchain technology, further enhancement
    and optimization will never stop.


    # Convergence


    Convergence of other technologies with blockchains brings about major benefits.
    At their core, blockchains provide resilience, security, and transparency, which,
    when combined with other technologies, results in a very powerful technology that
    complement each other. For example, the IoT can gain major benefits when implemented
    via blockchains, such as integrity, decentralization, and scalability. Artificial
    intelligence (AI) is expected to gain benefits from blockchain technology, and
    in fact, within blockchain technology, AI can be implemented in the form of Autonomous
    Agents (AAs). More examples and the above-mentioned converging technologies will
    be discussed in detail in later sections in the chapter.


    # Education of blockchain technology


    Whilst blockchain technology has spurred a great interest among technologists,
    developers, and scientists throughout almost every industry around the world,
    there is a lack of formal learning resources and educational material. As this
    is a new technology, various courses are now being offered by various reputed
    institutions such as Princeton University that introduce the technology to anyone
    who wants to learn about this technology. For example, Princeton University has
    started a cryptocurrency and digital currencies course that is delivered online
    and is quite popular. Many private organizations are also offering similar online
    and classroom training courses. More efforts like this will be seen in the near
    future due to the popularity and acceptance of blockchain technology.'
  merge: -1
  img_proc: true
- pgno: 491
  md: '# Employment


    There is a recent trend emerging in the job market whereby recruiters are now
    looking for blockchain experts and developers who can program for blockchains.
    This is especially relevant to the financial industry and recently many start-ups
    and large organizations have started to hire blockchain specialists. This trend
    is of course expected to grow as the technology gains more acceptance and maturity.
    There is also concern about the lack of blockchain developers, which surely will
    be addressed as the technology progresses and more and more developers either
    gain experience on a self-learning basis or gain formal training from some training
    providers.


    # Crypto-economics


    New fields of research are emerging with blockchains, most notably, crypto-economics,
    which is the study of protocols governing the decentralized digital economy. With
    the advent of blockchains and cryptocurrencies, research in this area has also
    grown. Crypto-economics has been defined as a combination of mathematics, cryptography,
    economics, and game theory by Vitalik Buterin.


    # Research in cryptography


    Even though cryptography was an area of keen interest and research for many decades
    before bitcoin invention, blockchain technology has resulted in renewed interest
    in this field. With the advent of blockchains and related technologies, there
    is a significant increase in the interest in cryptography also. Especially in
    the area of financial cryptography, new research is being carried out and published
    regularly. Technologies such as zero knowledge proofs, fully homomorphic encryption,
    and functional encryption are being researched for their use in blockchains. In
    the form of Zcash, already zero knowledge proofs have been implemented for the
    first time at a practical level. It can be seen that blockchains and cryptocurrencies
    have helped with the advancement of cryptography and especially financial cryptography.


    # New programming languages


    There is also an increased interest in the development of programming languages
    for developing smart contracts. The efforts are more focused on domain-specific
    languages, for example, solidity for Ethereum and Pact for Kadena. This is just
    a start and many new languages are likely to be developed as the technology advances.'
  merge: -1
  img_proc: true
- pgno: 492
  md: '# Hardware research and development


    When it was realized in 2010 that current methods are not efficient for mining
    bitcoins, miners started shifting toward optimizing mining hardware. These initial
    efforts included usage of **graphical processing units (GPUs)** and then **field-programmable
    gate arrays (FPGAs)** were used after GPUs reached their limit. Very quickly after
    that, **application-specific integrated circuits (ASICs)** emerged, which increased
    the mining power significantly. This trend is expected to grow further as now
    there is more research in further optimizing ASICs by parallelizing and decreasing
    the die size. Moreover, GPU programming initiatives are also expected to grow
    because new cryptocurrencies are emerging quite regularly now and many of them
    make use of Proof of Work algorithms that can benefit from GPU processing capabilities.
    For example, recently Zcash has spurred interest in GPU mining rigs and related
    programming using Nvidia CUDA and OpenCL. The aim is to use multiple GPUs in parallel
    for optimizing mining operations. Also, some research has been in the field of
    using trusted computing hardware such as Intel''s **Software Guard extensions
    (SGX)** to address security issues on blockchains. Also Intel''s SGX has been
    used in a novel consensus algorithm called **Proof of Elapsed Time (PoET)** which
    has been discussed in previous chapters. Another project, *the 21 bitcoin computer*,
    has also been developed, which serves as a platform for developers to learn bitcoin
    technology and easily develop applications for the bitcoin platform.


    The hardware research and development trend is expected to continue and soon many
    more hardware scenarios will be explored.


    # Research in formal methods and security


    With the realization of security issues and vulnerabilities in smart contract
    programming languages, there is now keen interest in the formal verification and
    testing of smart contracts before production deployments. For this, various efforts
    are already underway, including Why3 for Ethereum''s Solidity. Hawk is another
    example that has been developed to allow smart contract confidentiality.'
  merge: -1
  img_proc: true
- pgno: 493
  md: '# Alternatives to blockchains


    As the blockchain technology advanced in recent years, researchers started to
    think about the possibility of creating platforms that can provide guarantees
    and services which a blockchain provides but without the need for a blockchain.
    This has resulted in development of R3’s Corda, which in fact is not really a
    blockchain because it is not based on the concept of blocks containing transactions;
    instead, it is based on the concept of a state object that transverses throughout
    the Corda network according to the requirements and rules of the network participants
    representing the latest state of the network. Other examples include IOTA, which
    is an IoT blockchain which makes use of a Directed Acyclic Graph (DAG) as a distributed
    ledger named Tangle, instead of conventional blockchain with blocks. This ledger
    is claimed to have addressed scalability issues along with high-level security
    which even protects against quantum computing based attacks. It should be noted
    that bitcoin is also somewhat protected against quantum attacks because the quantum
    attack can only work on exposed public keys which are only revealed on the blockchain
    if both send and receive transactions are made. If the public key is not revealed,
    which is the case in unused addresses or the addresses that may have only used
    to receive bitcoins, then quantum safety can be guaranteed. In other words, using
    a different address for each transaction provides protection against quantum attacks.
    Also, in bitcoin, it is quite easy to change to another quantum signature protocol
    if required.


    # Interoperability efforts


    Recent realization of limitations around interoperability of blockchains has resulted
    in development of systems that can work across multiple blockchains. A recent
    example is Qtum, which is a blockchain that is compatible with both Ethereum and
    bitcoin blockchains. It makes use of bitcoin''s UTXO mechanism for transfer of
    value and an Ethereum virtual machine for smart contracts. This means that Ethereum
    projects can be ported onto Qtum without requiring any change.'
  merge: -1
  img_proc: true
- pgno: 494
  md: '# Blockchain as a service


    With the current level of maturity of cloud platforms, many companies have started
    to provide **Blockchain as a Service (BaaS)**. The most prominent examples are
    Microsoft’s Azure, where Ethereum blockchain is provided as a service, and IBM’s
    bluemix platform, that provides IBM BaaS. This trend is only expected to grow
    in the next few years and more companies will emerge that provide BaaS. EgаaS
    (**Electronic Government as a Service**) is another example which is in fact BaaS
    but provides application-specific blockchains for governance functions. The aim
    of this project is to organize and control any activity without document circulation
    and bureaucratic overhead.


    # Efforts to reduce electricity consumption


    It is clearly evident from bitcoin’s blockchain that the Proof of Work mechanism
    is very inefficient. Of course, this computation secures the bitcoin network but
    there is no other benefit of this computation and it wastes a lot of electrical
    energy. In order to reduce this waste, now there is more focus on greener options
    such as Proof of Stake algorithms which do not need enormous resources like bitcoin’s
    Proof of Work algorithm. This trend is expected to grow, especially with Proof
    of Stake planned for Ethereum.


    # Improvement proposals


    Two major blockchain technologies, namely bitcoin and Ethereum, have a formal
    mechanism of proposing improvements in the existing protocols. These are called
    improvement proposals, BIPs and EIPs. Both of these mechanisms have allowed participation
    from developers and technology enthusiasts around the world and have helped bitcoin
    and Ethereum evolve into a more mature and secure technology over time. In the
    sections below, notable improvement proposals for both blockchains are discussed.


    # BIPs


    In this section, some of the latest BIPs will be discussed.'
  merge: -1
  img_proc: true
- pgno: 495
  md: '# BIP 152


    This proposal is an improvement suggestion to introduce compact blocks in the
    bitcoin network in order to save bandwidth. In its current state, bitcoin protocol
    is not bandwidth-efficient and this proposal is aiming to address that issue by
    allowing relaying of compact blocks between nodes. Several changes, such as new
    data structures and messages, are required in order to implement this proposal.
    Currently, this proposal is in draft state. It is available on GitHub at https://github.com/bitcoin/bips/blob/master/bip-0152.mediawiki.


    # BIP 151


    This improvement proposal has been made to introduce peer-to-peer communication
    encryption. This proposal has been made in response to various security issues
    in Bitcoin protocol such as possibility of traffic analysis and manipulation.
    This proposal will help to thwart the attempts to identify users via source IPs
    and transaction contents on the bitcoin network. Several new messages to request
    and enable encryption among participating nodes have been proposed in the BIP.
    It is available at https://github.com/bitcoin/bips/blob/master/bip-0151.mediawiki.


    # BIP 150


    This proposal presents a method for peer authentication. This will allow man-in-the-middle
    attacks to be addressed and will provide a guarantee that the peers are connecting
    to a legitimate node. This is available on GitHub at https://github.com/bitcoin/bips/blob/master/bip-0150.mediawiki.


    # BIP 147


    This proposal has been made to address dummy stack element malleability. Signature
    malleability is a known issue and can be performed by any relay node by simply
    changing the signature associated with a transaction. This is a consensus layer
    level improvement proposal which will need soft fork to implement. BIP 147 is
    documented on GitHub at https://github.com/bitcoin/bips/blob/master/bip-0147.mediawiki.'
  merge: -1
  img_proc: true
- pgno: 496
  md: '# BIP 146


    This improvement is made to address the signature encoding malleability issue.
    This requires a soft fork to be implemented. If implemented, this will resolve
    the signature malleability issue which is related to a fundamental limitation
    in the ECDSA signature encoding mechanism. This limitation is inherent in ECDSA.
    Secondly, due to the fact that if a signature has failed, verification script
    evaluation will still continue and would allow for any value to be set on the
    signature. This BIP is a proposal to resolve this issue. It is documented at https://github.com/bitcoin/bips/blob/master/bip-0146.mediawiki.


    There are many other BIPs made for suggesting improvements in the Bitcoin protocol.
    In this section, only the five latest proposals have been introduced. There are
    almost 90 improvement proposals for bitcoin that have been made in recent years
    and this process continues.


    # EIPs


    Ethereum has its own version of improvement proposals, called EIPs. Several of
    the recent EIPs are discussed as follows.


    # EIP 170


    This improvement proposal has been made to address certain vulnerabilities that
    can arise from excessive usage of gas triggered by large contract code size during
    the preprocessing stage or when the code is read from the disk. The proposal is
    to limit the contract code size to 23,999 bytes. Further discussion regarding
    this proposal has resulted in improving this proposal further and has been accepted.
    This, however, has not been implemented yet.


    # EIP 150


    This improvement proposal was made in response to denial of service attacks on
    the Ethereum blockchain. It has already been implemented as a hard fork since
    block 2463000 of the live Ethereum blockchain. This EIP addressed issues arising
    from transaction spam attacks, for example, repeatedly calling EXTCODESIZE Opcode,
    resulting in slowdown of the validation process of the blockchain. The EIP is
    to increase the gas cost of several of the opcodes to thwart denial of service
    attacks resulting from excessive repeated usage of these opcodes.'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# EIP 161


    This proposal has been made to allow the removal of empty accounts from the Ethereum
    blockchain. This was put in place as response to a denial of service attack on
    the Ethereum blockchain whereby the attacker(s) created a large number of empty
    accounts. This was possible due to the low cost of account creation. This is called
    state trie clearing which will allow removal of empty accounts by making a CALL
    instruction to the accounts.


    # EIP 160


    This suggestion has been made to increase EXP Opcode cost. The core idea behind
    this improvement proposal is to make cost of EXP operation proportional to the
    complexity of the operation. This proposal has helped to thwart denial of service
    attacks that arose from invoking computationally expensive operations.


    # EIP 155


    This improvement proposal is made to eliminate the possibility of replaying a
    transaction from a different chain on the main live Ethereum blockchain. For example,
    if a transaction is made on the Ethereum network then it would be able to be replayed
    on Ethereum classic network; this EIP addresses this issue. Also, any transactions
    that have already been made on the test network should not be able to replay on
    the main live network.


    All of the above-mentioned improvements have resulted in a hard fork and were
    implemented as a response to recent Ethereum denial of service attacks. Improvement
    proposals are a key mechanism to introduce new enhancement and protocol level
    bug fixes to Ethereum blockchain. There are about 11 improvement proposals implemented
    or proposed for Ethereum. All of these are documented on GitHub at https://github.com/ethereum/EIPs/.


    # Other challenges


    Apart from security and privacy, discussed in the previous chapter, there are
    several other hurdles that should be addressed before mainstream adoption of blockchains
    can be realized. These include regulation, government control, immature technology,
    integration with existing systems, and implementation costs.'
  merge: -1
  img_proc: true
- pgno: 498
  md: 'Regulation is considered one of the biggest challenges that need to be addressed.
    The core issue is that blockchains and especially cryptocurrencies are not recognized
    as a legal currency by any government. Even though, in some cases, it has been
    classified as money in the US and Germany, it is still far from being accepted
    as a normal currency. Moreover, blockchains in their current state are not recognized
    as a platform that can be used by financial institutions. No financial regulatory
    body has yet accepted it as a platform that can be authorized to be used. There
    are, however, various initiatives taken by regulatory authorities around the world
    to research and propose regulations. Bitcoin in its current state is fully unregulated,
    even though some attempts have been made by governments to tax the bitcoin. In
    the UK, under the EU VAT directive, bitcoin transactions are exempt from Value
    Added Tax (VAT) but this may change after Brexit. However, Capital Gains Tax (CGT)
    may still be applicable in some scenarios.


    Some regulation attempt is expected very soon from financial regulatory authorities
    generally regarding blockchain technology, especially after the recent announcement
    by the Financial Conduct Authority (FCA) in the UK that it may approve some companies
    that are using blockchain.


    It is a general concern that the blockchain technology is not really ready for
    production deployments. Even though the bitcoin blockchain has evolved into a
    solid blockchain platform and is used in production, it is not suitable for every
    scenario. This is especially true in the case of sensitive environments such as
    finance and health. However, it is likely to change very soon as ample efforts
    discussed previously in the chapter are being made to improve the technology and
    address any technical limitations such as scalability and privacy. Security is
    also another general concern which has been highlighted by many researchers and
    is especially applicable to the finance and health sectors. A recent report by
    the European Union Agency for Network and Information Security (ENISA) has highlighted
    distributed ledger specific concerns that should be addressed. Some concerns highlighted
    in the report include smart contract management, key management, anti-money-laundering,
    and anti-fraud tools. Also, the need for regulation, audit, control, and governance
    has been highlighted in the report.


    Integration with existing legacy systems is also a prime concern. It is not clear
    how blockchains can be integrated with the existing financial systems.


    Hurdles toward adoption are more or less related to regulatory, security, and
    interoperability. Integration with existing systems can be carried out in several
    ways.'
  merge: -1
  img_proc: true
- pgno: 499
  md: '# Dark side


    With the key attributes of censorship resistance and decentralization, blockchain
    technology can help to improve transparency and efficiency in many walks of life
    but this somewhat unregulated nature of this technology means that it can be used
    by criminals for illegal activities too. For example, compare a scenario where
    if some illegal content is published over the Internet it can be immediately shut
    down by approaching the concerned authorities and website service providers but
    this is not possible in blockchains. Once something is there on the blockchain,
    it is almost impossible to revert it back. This means that any unacceptable content,
    once published on the blockchain, cannot be removed. If the blockchain is used
    for distributing immoral content then there is no way for anyone to shut it down.
    This poses a serious challenge and it seems that some regulation and control is
    beneficial in this scenario, but how can a blockchain be regulated? That is another
    important question. It may not be prudent to create the regulatory laws first
    and then see if blockchain technology adapts to that because it might disrupt
    innovation and progress in this technology. It would be more sensible to let the
    blockchain technology grow first, just like the Internet and when it reaches a
    critical mass then governing bodies can call for applying some regulation around
    the implementation and usage of blockchain technology.


    There are various examples where the Dark Web is used in conjunction with bitcoin
    to perform illegal activities. For example, *SilkRoad*, which was used to sell
    illegal drugs over the Internet, used bitcoin for payments and the Dark Web using
    onion URLs which are only visible with *Tor*. Although *SilkRoad* was shut down
    after months of effort by law enforcement agencies, new similar sites started
    to emerge. Now other alternatives are available that offer similar services; as
    such, generally, this type of problem still remains a big concern. Imagine that
    an illegal website is on IPFS and a blockchain; there is no easy way of shutting
    it down. It is clear that absence of control and regulation can encourage criminal
    activity and similar issue like *SilkRoad* will keep arising. Further development
    in totally anonymous transaction capabilities such as Zcash could provide another
    layer of protection for criminals but at the same time may be quite useful in
    various legitimate scenarios. It really depends that who is using the technology;
    anonymity can be good in many scenarios, for example in the health industry where
    patient records should be kept private and anonymous, but may not be appropriate
    if it can also be used by criminals to hide their activities.'
  merge: -1
