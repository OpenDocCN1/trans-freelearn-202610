- pgno: 501
  md: '# Limitations in cryptographic functions


    Cryptography used in the bitcoin blockchain is extremely secure and has stood
    the test of time. In other blockchains, similar security techniques are used and
    are also very secure. However, specific security issues such as the possibility
    of generation and usage of duplicate signature nonces in elliptic curve digital
    signature schemes (leading to private key recovery attack), collisions in Hash
    functions, and possibility of quantum attacks that may break the underlying cryptographic
    algorithms remain an interesting area of research.


    # Consensus Algorithms


    Research in Proof of Stake algorithms or alternatives to Proof of Work is also
    an important area of research. This is especially relevant due to the fact the
    current bitcoin network''s power consumption is expected to reach almost 14 gigawatts
    by 2020. It has also been suggested that instead of performing inefficient or
    single-purpose type of work as is the case with bitcoin''s Proof of Work, the
    network power can be used to solve some mathematical or scientific problems. Also,
    alternatives such as Proof of Stake algorithms have already gained much traction
    and are due to be implemented in major blockchains, for example, Ethereum''s Casper.
    However, so far, Proof of Work remains the best option for securing a public blockchain.


    # Scalability


    Detailed discussion has already been carried out on scalability in the last chapter;
    briefly, it is sufficient to say in this section that while some progress has
    already been made, still there is a need for more research to enable on-chain
    scalability and further improve off-chain solutions such as state channels. Some
    initiatives like block size increase and transaction-only blockchains (without
    blocks) have been proposed to address scalability issues that increase the capacity
    of the blockchain itself instead of using side channels. Examples of *without
    blocks* implementation include IOTA (Tangle). It is a **Directed Acyclic Graph
    (DAG)** which is used to store transactions as compared to traditional blockchain
    solutions where a block is used to store transactions. This makes it inherently
    faster as compared to block-based blockchains such as bitcoin where waiting time
    between block generations is at least approximately 10 minutes.'
  merge: -1
  img_proc: true
- pgno: 502
  md: '# # Code Obfuscation


    As discussed in the last chapter, code obfuscation by using indistinguishability
    obfuscation can be used as a means to provide confidentiality and privacy in the
    blockchain. However, this is still not practical and major research effort is
    required in order to achieve this.


    # # List of notable projects


    Following is a list of notable projects in the blockchain space that are currently
    in progress. In addition to these projects, there is also a myriad of start-ups
    and companies working in the blockchain space and offering blockchain-related
    products.


    # ## Zcash on Ethereum


    A recent project by the Ethereum R&D team is implementation of Zcash on Ethereum.
    This is an interesting project whereby developers are trying to create a privacy
    layer for Ethereum using zk-SNARKs already used in Zcash project. With Zcash implementation
    on Ethereum, the aim is to create a platform that allows applications such as
    voting where privacy is of paramount importance. It will also allow creation of
    anonymous tokens on Ethereum that can be used in number of applications.


    # ## CollCo


    This is a project developed by Deutsche Börse which is based the Hyperledger code
    base and is used for managing commercial bank cash transfers. **Collateralized
    Coin (CollCo)** provides a blockchain-based platform that allows real-time transfer
    of commercial bank money while still relying on traditional capabilities provided
    by Eurex Clearing CCP. This is major project that can be used to address inefficiencies
    in the post trade settlement processes.


    # ## Cello


    As of February 2017, this is the most recent addition to Hyperledger project.
    The aim of this project is to provide on-demand BaaS which will make deployments
    and management of multiple blockchains convenient and easy for users. It is envisioned
    that Cello will support all future and current Hyperledger blockchains, such as
    Fabric and Sawtooth Lake.'
  merge: -1
  img_proc: true
- pgno: 503
  md: '# Qtum


    This project is based on the idea of combining capabilities of bitcoin and Ethereum
    blockchains. Qtum makes use of the bitcoin code base but uses Ethereum''s EVM
    for smart contract execution. Ethereum smart contracts can run using bitcoin''s
    UTXO (unspent transactions) model. It is available at https://qtum.org/.


    # Bitcoin-NG


    This is another proposal for addressing scalability, throughput, and speed issues
    in the bitcoin blockchain. Next Generation (NG) protocol is based on a mechanism
    of leader election which verifies transactions as soon as they occur, as compared
    to Bitcoin''s protocols, where time between blocks and block size are the key
    limitations in relation to scalability.


    # Solidus


    This is a new cryptocurrency which provides solution for selfish mining while
    addressing scaling and performance issues. It also addresses confidentiality issues.
    It is based on permissionless Byzantine consensus. The protocol in its current
    state is comparatively complex and is an open area for research.


    # Hawk


    This is a project that is aiming to address privacy issues of smart contracts
    in blockchains. It is a smart contract system that allows encryption of transactions
    on the blockchain. Hawk is able to generate a secure protocol for interaction
    with blockchains automatically without the need for manually programming the cryptographic
    protocol.


    # Town-Crier


    This is a project that is aiming to provide real-world authentic feed into smart
    contracts. This system is based on Intel''s SGX trusted hardware technology. This
    is a step further in Oracle design whereby smart contracts can request data from
    online sources while preserving confidentiality.'
  merge: -1
  img_proc: true
- pgno: 504
  md: '# SETLCoin


    This is a system built by *Goldman Sachs* and is filed for patent under the *Cryptographic
    currency for Securities settlement* application. As the name suggests, this cryptocurrency
    *coin* can be used for fast and efficient settlement. The technology makes use
    of virtual wallets to exchange assets over the network between peers and allows
    immediate settlement via ownership of SETLCoin.


    # TEEChan


    This is novel idea of using **trusted execution environments (TEEs)** to provide
    a scalable and efficient solution for scaling the bitcoin blockchain. This is
    similar to the concept of payment channels whereby off-chain channels are used
    for faster transfer of transactions. The key attraction in this idea is that it
    is implementable on bitcoin blockchain without the need for any changes in the
    bitcoin network because it''s an off-the-chain solution. There is, however, a
    small caveat that this solution does require trusting Intel for remote attestation
    (verification) as Intel''s SGX CPUs are used to provide TEEs. This is not a desirable
    property in decentralized blockchains; however, it should be noted that the confidentiality
    of transactions is still preserved even if remote attestation is used as remote
    attester (Intel) cannot see the contents of the communication between users. This
    limitation makes it debatable that whether it is a fully decentralized and trustless
    solution or not.


    # Falcon


    Falcon is a project that helps bitcoin to scale by providing a fast relay network
    for broadcasting bitcoin blocks over the network. The core idea revolves around
    a technique to reduce orphan blocks, thus helping with overall scalability of
    the bitcoin network. The technique used for this purpose has been called application-level
    cut-through routing.


    # Bletchley


    This project has been introduced by Microsoft, indicating the commitment by Microsoft
    to blockchain technology. Bletchley allows use of Azure cloud services to build
    blockchains in a user-friendly manner. A major concept introduced by Bletchley
    is called *cryptlets*, which can be thought of as an advanced version of Oracles
    that reside outside the blockchain and can be called by smart contracts using
    secure channels. These can be written in any language and execute within a secure
    container.'
  merge: -1
  img_proc: true
