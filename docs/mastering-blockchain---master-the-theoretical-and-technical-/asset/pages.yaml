- pgno: 186
  md: 'By definition an altcoin is generated in the case of a hard fork. If bitcoin
    has a hard fork then the other, older chain is effectively considered another
    coin. However there is no established rule as to which chain becomes the altcoin.
    This has happened recently with Ethereum, where a hard fork caused a new currency
    ETC (Ethereum classic) to come into existence in addition to the Ethereum (ETH)
    currency. Ethereum classic is the old chain and Ether is the new chain after the
    fork. Such a contentious hard fork is not desirable for a number of reasons. First
    it is against the true spirit of decentralization as the Ethereum foundation,
    a central entity, decided to go ahead with the hardfork even though not everyone
    agreed to the proposition; second it also splits the user community due to disagreement
    over the hard fork. Although a hard fork in theory generates an altcoin, it is
    limited in what it can offer due to the fact that, even if the change results
    in a hard fork, usually there are no drastic changes around the fundamental parameters
    of the coin. They usually remain the same. For this reason, it is desirable to
    either write a new coin from scratch or fork the bitcoin (or another coin''s source
    code) to create a new currency with the desired parameters and features.


    Altcoins must be able to attract new users, trades, and miners otherwise the currency
    will have no value. Currency gains its value, especially in the virtual currency
    space, due to the network effect and its acceptability by the community. If a
    coin fails to attract enough users then soon it will be forgotten. Users can be
    attracted by providing an initial amount of coins and can be achieved by using
    various methods. Methods of providing an initial number of altcoins are discussed
    as follows:


    +   - **Create a new blockchain:** Altcoins can create a new blockchain and allocate
    coins to initial miners but this approach is now unpopular due to many scam schemes
    or *pump and dump* schemes where initial miners made a profit with the launch
    of a new currency and then disappeared.

    +   - **Proof of burn:** Another approach to allocating initial funds to a new
    altcoin is *Proof of burn*, also called a one-way peg or price ceiling. In this
    method users permanently destroy a certain quantity of bitcoins in proportion
    to the quantity of altcoins to be claimed. For example if 10 bitcoins were destroyed
    then altcoins can have a value no greater than the amount of bitcoins destroyed.
    This basically means that bitcoins are being *converted* into altcoins by burning
    them.

    +   - **Proof of Ownership:** Instead of permanently destroying bitcoins, an alternative
    method is to prove that users own a certain number of bitcoins. This proof of
    ownership can be used to claim altcoins by tethering altcoin blocks to bitcoin
    blocks. For example, this can be achieved by merged mining in which effectively
    bitcoin miners can mine altcoin blocks while mining for bitcoin without any extra
    work.'
  merge: -1
  img_proc: true
