    copied into /usr/bin or the appropriate path on Raspbian to make it available
    from anywhere in the operating system. When the download is finished, the next
    step is to create the genesis block.


    The same genesis block needs to be used that was created previously in Chapter
    8, Ethereum Development. The genesis file can be copied from the other node on
