- pgno: 112
  md: 'The preceding example shows the prime number used and values of A and B the
    with generator, order, and cofactor of the SECP256K1 curve domain parameters.


    There is another category of cryptographic primitives that is known as hash functions.
    Hash functions are not used to encrypt; data instead, they produce a fixed length
    digest of text.


    # Cryptographic primitives


    This taxonomy of cryptographic primitives can be visualized as shown here:


    ![](img/62ab880d2302f959d34db648cb0bec5e_112_0.png)


    # Hash functions


    Hash functions are used to create fixed length digests of arbitrarily long input
    strings. Hash functions are keyless and provide the data integrity service. They
    are usually built using iterated and dedicated hash function construction techniques.
    Various families of hash functions are available, such as MD, SHA1, SHA-2, SHA-3,
    RIPEMD, and Whirlpool. Hash functions are commonly used in digital signatures
    and message authentication codes, such as HMACs. They have three security properties,
    namely pre-image resistance, second pre-image resistance, and collision resistance.
    These properties are explained later in the section.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '**Hash functions** are typically used to provide data integrity services. These
    can be used as one-way functions and to construct other cryptographic primitives,
    such as MACs and digital signatures. Some applications used hash functions as
    a means of generating **pseudo random numbers (PRNGs)**. Hash functions do not
    require a key. There are two practical and three security properties of hash functions
    that must be met depending on the level of requirements of integrity.


    # Compression of arbitrary messages into fixed length digest


    This property is concerned with the fact that a hash function must be able to
    take a long input text of any length and output a fixed length compressed message.
    Hash functions produce a compressed output in various bit sizes, usually between
    128-bits and 512-bits.


    # Easy to compute


    Hash functions are efficient and fast one-way functions. The requirement is that
    they be very quick to compute regardless of the message size. The efficiency may
    decrease if the message is too big but the function should still be fast enough
    for practical use.


    In the following section, security properties of hash functions are discussed.


    # Pre-image resistance


    Consider an equation:


    ```

    $$h(x)=y$$

    ```


    Here, *h* is the hash function, *x* is the input, and *y* is the hash. The first
    security property requires that *y* cannot be reverse computed to *x*. *x* is
    considered a *pre-image* of *y*, hence the name pre-image resistance. This is
    also called one-way property.


    # Second pre-image resistance


    This property requires that given *x* and *h(x)*, it is almost impossible to find
    any other message *m*, where *m != x* and hash of *m* = hash of *x*. *h(m) = h(x)*.
    This property is also known as weak collision resistance.'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# ## Collision resistance


    This property requires that two different input messages should not hash to the
    same output. In other words, *h(x) != h(z)*. This property is also known as strong
    collision resistance.


    Hash functions, due to their very nature, will always have some collisions, and
    that is where two different messages hash to the same output, but they should
    be computationally infeasible to find. A concept known as **avalanche effect**
    is desirable in all hash functions. Avalanche effect specifies that a small change,
    even a single character change in the input text, will result in a totally different
    hash output.


    Hash functions are usually designed by following iterated hash functions approach.
    In this method, the input message is compressed in multiple rounds on a block-by-block
    basis to produce the compressed output. A popular type of iterated hash function
    is Merkle-Damgard construction. This construction is based on the idea of dividing
    the input data into equal sizes of blocks and then feeding them through the compression
    functions in an iterative manner. The collision resistance of the property of
    compression functions ensures that the hash output is also collision-resistant.
    Compression functions can be built using block ciphers. In addition to Merkle-Damgard,
    there are various other constructions of compression functions proposed by researchers,
    for example, *Miyaguchi-Preneel* and *Davies-Meyer*.


    There are multiple hash function categories. You will be introduced to these categories
    in the upcoming section.


    # ## Message Digest (MD)


    Message Digest functions were very popular in early 1990s. MD4 and MD5 are members
    of this category. Both MD functions are found to be insecure and not recommended
    for use any more. MD5 is a 128-bit hash function that was commonly used for file
    integrity checks.


    # ## Secure Hash Algorithms (SHAs)


    **SHA-0:** This is a 160-bit function introduced by NIST in 1993.


    **SHA-1:** SHA-1 was introduced later by NIST as a replacement of SHA-0. This
    is also a 160-bit hash function. SHA-1 is used commonly in SSL and TLS implementations.
    It should be noted that SHA-1 is now considered insecure and is being deprecated
    by certificate authorities. Its usage is now discouraged in any new implementations.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '**SHA-2:** This category includes four functions defined by the number of bits
    of the hash: SHA-224, SHA-256, SHA-384 and SHA-512.


    **SHA-3:** This is the latest family of SHA functions. SHA3-224, SHA3-256, SHA3-384
    and SHA3-512 are members of this family. SHA3 is a NIST-standardized version of
    Keccak. Keccak uses a new approach called *sponge construction* instead of the
    commonly used Merkle-Damgard transformation.


    **RIPEMD:** RIPEMD is the acronym for *RACE Integrity Primitives Evaluation Message
    Digest*. It is based on the design ideas used to build MD4. There are multiple
    versions of RIPEMD, including 128-bit, 160-bit, 256-bit, and 320-bit.


    **Whirlpool:** This is based on a modified version of Rijndael cipher known as
    W. It uses the Miyaguchi-Preneel compression function, which is a type of one-way
    function used for the compression of two fixed length inputs into a single fixed
    length output. It is a single block length compression function:


    ![](img/62ab880d2302f959d34db648cb0bec5e_115_0.png)


    Three security properties of hash functions


    Hash functions have many practical applications ranging from simple file integrity
    checks and password storage to be used in cryptographic protocols and algorithms.
    They are used in hash tables, distributed hash tables, bloom filters, virus finger
    printing, peer-to-peer P2P file sharing, and many other applications.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'In blockchain, hash functions play a very vital role. Especially, the proof
    of work function uses SHA-256 twice in order to verify the computational effort
    spent by miners. RIPEMD 160 is used to produce bitcoin addresses. This will be
    discussed in more detail in later chapters.


    # Design of Secure Hash Algorithms (SHA)


    In the following section, you will be introduced to the design of SHA-256 and
    SHA-3. Both of these are used in bitcoin and Ethereum, respectively. Ethereum
    doesn’t use NIST Standard SHA-3 but Keccak, which is the original algorithm presented
    to NIST. NIST, after some modifications such as increase in the number of rounds
    and simpler message padding, standardized Keccak as SHA-3.


    # SHA-256


    SHA-256 has the input message size < 2^64-bits. Block size is 512-bits and has
    a word size of 32-bits. Output is 256-bit digest.


    The compression function processes a 512-bit message block and a 256-bit intermediate
    hash value. There are two main components of this function: compression function
    and a message schedule.


    The algorithm works as follows:


    +   - Pre-processing:

    +     1. Padding of the message, which is used to make the length of a block to
    512-bits if it is smaller than the required block size of 512-bits.

    +     2. Parsing the message into message blocks that ensure that the message
    and its padding is divided into equal blocks of 512-bits.

    +     3. Setting up the initial hash value, which is the eight 32-bit words obtained
    by taking the first 32-bits of the fractional parts of the square roots of the
    first eight prime numbers. These initial values are randomly chosen in order to
    initialize the process and gives a level of confidence that no backdoor exists
    in the algorithm.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '+   - Hash computation:


    +   1. Each message block is processed in a sequence and requires 64 rounds to
    compute the full hash output. Each round uses slightly different constants to
    ensure that no two rounds are the same.

    +   2. First, the message schedule is prepared.

    +   3. Then, eight working variables are initialized.

    +   4. Then, the intermediate hash value is calculated.

    +   5. Finally, the message is processed and the output hash is produced:


    ![](img/62ab880d2302f959d34db648cb0bec5e_117_0.png)


    In the preceding diagram, *a, b, c, d, e, f, g,* and *h* are the registers. **Maj**
    and **Ch** are applied bitwise. Σ₀ and Σ₁ performs bitwise rotation. Round constants
    are **W**_j and **K**_j, which are added *mod* 2^32.


    # Design of SHA3 (Keccak)


    The structure of SHA-3 is very different from the usual SHA-1 and SHA-2. The key
    idea behind SHA-3 is based on un-keyed permutations as opposed to other usual
    hash functions'' constructions that used keyed permutations. Keccak also does
    not make use of the Merkle-Damgard transformation that is commonly used to handle
    arbitrary length input messages in hash functions. A newer approach called sponge
    and squeeze construction is used in Keccak, which is basically a random permutation
    model. Different variants of SHA3 have been standardized, such as SHA3-224, SHA3-256,
    SHA3-384, SHA3-512, SHAKE128, and SHAKE256. SHAKE128 and SHAKE256 are extendable
    output functions that are also standardized by NIST. XOF functions that allow
    the output to be extended to any desired length.'
