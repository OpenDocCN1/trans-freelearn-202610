- pgno: 366
  md: '# Example project: Proof of Idea


    The idea behind this program is to provide a service to notarize a document. This
    can then be used as proof that, at a certain time in the past, the claimant has
    had access to a certain piece of information. This can be very useful for patent
    documents. For example, if someone has come up with an idea, he or she can then
    create a hash of that document and save it on the blockchain. Due to the immutable
    nature of blockchain, it can serve as permanent proof that a certain idea (documents)
    existed at a certain time. There are many ways in which this can be achieved,
    but the key idea is the same and it works on the principle that hash functions
    provide a digest of the text or document and are unique.


    This can be achieved in several ways; the key idea is to create a hash of the
    document or text string and save it on the blockchain. Once the text is hashed
    and saved, further requests to save that same text can be disallowed by comparing
    the hash of the document with the already stored hash.


    For this example, browser solidity, truffle, and TestNet (already running Network
    ID 786, created earlier) will be used. First, the code for the contract will be
    written. This can be done using any appropriate text editor or integrated development
    environment. Browser solidity can also be used as that too provides a simulated
    environment for the test. This example will provide you with the opportunity to
    learn how a contract project can be developed from an idea into a solidity contract
    source code and finally to deployment.


    Let''s look at the code line by line:


    ```

    pragma solidity ^0.4.0;

    ```


    This statement ensures that the minimum compiler version is 0.4.0 and the maximum
    version cannot be greater than 0.4.9. This ensures compatibility between programs:


    ```

    contract PatentIdea {

    ```


    This statement is the start of the contract with name PatentIdea:


    ```

    mapping (bytes32 => bool) private hashes;

    ```


    Next, a mapping is defined, which maps byte32 to Boolean, and this is basically
    a hashmap (dictionary) of bytes32 mapping to the Boolean value:


    ```

    bool alreadyStored;

    ```


    This is a variable declared with the alreadyStored name, which is a Boolean type
    and can have a true or false value. This variable is used to hold the return value
    from the SaveIdeaHash function:


    ```

    event ideahashed(bool);

    ```'
  merge: -1
  img_proc: true
- pgno: 367
  md: "An event is declared as well, which will be used to capture the failure or\
    \ success of the hashing function (SaveIdeaHash). When the event is triggered,\
    \ it will return a true or false Boolean value.\n\nA function named saveHash is\
    \ declared, which takes the hash variable of type bytes32 as parameters and saves\
    \ it in the hash map. This will result in a change of the state of the contract.\
    \ Note that the function accessibility is changed to private as it is only required\
    \ internally in the contract and does not need to be exposed publicly:\n\n```\n\
    function saveHash(bytes32 hash) private\n{\n    hashes[hash] = true;\n}\n```\n\
    \nAnother function, saveIdeaHash, is declared, and it takes the variable idea\
    \ of type string and returns a Boolean (true or false) depending on the outcome\
    \ of the function:\n\n```\nfunction SaveIdeaHash(string idea) returns (bool)\n\
    {\n    var hashedIdea = HashtheIdea(idea);\n    if (alreadyHashed(HashtheIdea(idea)))\n\
    \    {\n        alreadyStored=true;\n        ideahashe d(false);\n        return\
    \ alreadyStored;\n    }\n    saveHash(hashedIdea);\n    ideahashe d(true);\n}\n\
    ```\n\nThis function has a variable declared hashedIdea, which is assigned a value\
    \ after calling the HashtheIdea function described later. Note that this function\
    \ can also return a value if saved, but it is not shown here for simplicity.\n\
    \nThe next function is the alreadyHashed function, which is declared to take the\
    \ variable named hash of type bytes32 and returns a Boolean (either true or false)\
    \ after checking the hash in the hash map. This is again declared as a constant\
    \ and accessibility is set to private:\n\n```\nfunction alreadyHashed(bytes32\
    \ hash) constant private returns(bool)\n{\n    return hashes[hash];\n}\n}\n```"
  merge: -1
  img_proc: true
- pgno: 368
  md: "The next function is isAlreadyHashed, which checks whether the idea is already\
    \ hashed. This takes the input parameter idea of type string, also declared as\
    \ a constant, which means that it cannot change the state of the contract and\
    \ returns either true or false based on the outcome of the execution of the function\
    \ named alreadyHashed. This function then calls the alreadyHashed function described\
    \ earlier to check from the hashes map whether the hash is already stored there.\
    \ This would mean that the same string (idea) has already been hashed and stored\
    \ (patented):\n\n```\nfunction isAlreadyHashed(string idea) constant returns (bool)\n\
    {\n    var hashedIdea = HashtheIdea(idea);\n    return alreadyHashed(hashedIdea);\n\
    }\n```\n\nFinally, the HashtheIdea function is shown here, which takes the idea\
    \ variable of type string and is of constant type, which means that it cannot\
    \ change the state of the contract. It is also declared as private as there is\
    \ no need to expose this function publicly because it is used only internally\
    \ in the contract. This function returns the bytes32 type value:\n\n```\nfunction\
    \ HashtheIdea(string idea) constant private returns (bytes32) {\n    return sha3(idea);\n\
    }\n```\n\nThis function calls solidity's built-in function sha3 and passes a string\
    \ to it in a variable idea. This function returns the sha3 hash of the string.\
    \ The sha3 function is an alias for the keccak256() function available in solidity,\
    \ which computes the Keccak-256 hash of the string passed to it. Note that this\
    \ is not NIST standard SHA-3; instead, it is Keccak-256, which is the original\
    \ proposal to NIST for the SHA-3 standard competition. It was later modified slightly\
    \ and standardized as the SHA-3 standard by NIST. The actual SHA-3 standard hash\
    \ function will return a different hash compared to Keccak-256 (Ethereum's sha3\
    \ function).\n\nThe complete contract source code is shown as follows:\n\n```\n\
    pragma solidity ^0.4.0;\ncontract PatentIdea\n{\n    mapping (bytes32 => bool)\
    \ private hashes;\n    bool alreadyStored;\n    event ideahashe d(bool);\n   \
    \ function saveHash(bytes32 hash) private\n    {\n        hashes[hash] = true;\n\
    \    }\n    function SaveIdeaHash(string idea) returns (bool)\n```"
  merge: -1
  img_proc: true
