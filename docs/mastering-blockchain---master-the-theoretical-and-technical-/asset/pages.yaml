  img_proc: true
- pgno: 350
  md: '```

    v7.2.1

    drequinox@drequinox-OP7010:~/testdapp$ node --version

    v7.2.1

    ```


    The installation of truffle is very simple and can be done using the following
    command via npm:


    ```

    $ sudo npm install -g truffle

    ```


    This will take a while; once it is installed, truffle can be used to display help
    and make sure that it is installed correctly.


    ![](img/62ab880d2302f959d34db648cb0bec5e_350_0.png)


    Alternatively, the repository is available at https://github.com/ConsenSys/truffle,
    which can be cloned locally to install truffle. Git can be used to clone the repository
    using the following command:


    ```

    https://github.com/ConsenSys/truffle.git

    ```


    # Initializing truffle


    Truffle can be initialized by running the following command. First, create a directory
    for the project, for example:


    ```

    mkdir testdapp

    ```


    Then, change to testdapp and run the following command:


    ```

    ~/testdapp$ truffle init

    ```'
