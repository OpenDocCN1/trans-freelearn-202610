- pgno: 312
  md: '![](img/62ab880d2302f959d34db648cb0bec5e_312_0.png)


    In this chapter, the main focus will be on geth, browser solidity, solidity, solc,
    and truffle. Rest of the elements will be discussed briefly.


    # Languages


    Contracts can be programmed in a variety of languages. There are four languages
    that can be used in order to write contracts:


    +   - **Mutan**: This is a Go-style language, which was deprecated in early 2015
    and is no longer used.

    +   - **LLL**: This is a Lisp-like language, hence the name LLL. This is also
    not used anymore.

    +   - **Serpent**: This is a simple and clean Python-like language. It is actively
    used for contract development.

    +   - **Solidity**: This language has now become almost a standard for contract
    writing for Ethereum. This language is the focus of this chapter and is discussed
    in detail in later sections.


    # Compilers


    Compilers are used to convert high-level contract source code into the format
    that the Ethereum execution environment understands. The solidity compiler is
    the most common one in use and is discussed here.'
  merge: -1
  img_proc: true
