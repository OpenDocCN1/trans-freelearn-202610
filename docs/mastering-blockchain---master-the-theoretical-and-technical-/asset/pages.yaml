- pgno: 415
  md: '+   - **Open ledger**: This is a ledger that has not been validated yet and
    no consensus has been reached about its state. Each node has its own open ledger,
    which contains proposed transactions.

    +   - **Unique node list**: This is a list of unique trusted nodes that a validating
    server uses in order to seek votes and subsequent consensus.

    +   - **Proposer**: As the name suggests, this component proposes new transactions
    to be included in the consensus process. It is usually a subset of nodes (UNL
    defined above) that can propose transactions to the validating server.


    # # Transactions


    Transactions are created by network users in order to update the ledger. A transaction
    is expected to be digitally signed and valid in order for it to be considered
    as a candidate in the consensus process. Each transaction costs a small amount
    of XRP, which serves as a protection mechanism against denial of service attacks
    caused by spamming. There are different types of transaction in the Ripple network.
    A single field within the Ripple transaction data structure called `TransactionType`
    is used to represent the type of the transaction. Transactions are executed by
    using a four step process. First, transactions are prepared whereby an unsigned
    transaction is created by following the standards. Second step is signing, where
    the transaction is digitally signed to authorize it. After this, the actual submission
    to the network occurs via the connected server. Finally, the verification is performed
    to ensure that the transaction is validated successfully.


    Roughly, the transactions can be categorized into three types, namely Payments
    related, Order related, and Account and security related. All these types are
    described in the following section.


    # ## Payments related


    There are several fields in this category that result in certain actions. All
    these fields are described as follows:


    +   1. **Payment**: This transaction is most commonly used and allows one user
    to send funds to another.

    +   2. **PaymentChannelClaim**: This is used to claim **Ripples (XRP)** from a
    payment channel. A payment channel is a mechanism that allows recurring and unidirectional
    payments between parties. This can also be used to set the expiration time of
    the payment channel.

    +   3. **PaymentChannelCreate**: This transaction creates a new payment channel
    and adds XRP to it in *drops*. A single drop is equivalent to 0.000001 of an XRP.'
  merge: -1
  img_proc: true
- pgno: 416
  md: '+   4. `PaymentChannelFund`: This transaction is used to add more funds to
    an existing channel. Similar to `PaymentChannelClaim` transaction, this can also
    be used to modify the expiration time of the payment channel.


    # Order related


    This type of transaction includes following two fields:


    +   1. `OfferCreate`: This transaction represents a limit order, which represents
    an intent for exchange of currency. It results in creating an Offer node in the
    consensus ledger if it cannot be completely fulfilled.

    +   2. `OfferCancel`: This is used to remove a previously created offer node from
    the consensus ledger, indicating withdrawal of the order.


    # Account and security related


    This type of transaction include the fields listed as follows. Each field is responsible
    for performing a certain function.


    +   1. `AccountSet`: This transaction is used to modify the attributes of an account
    in the Ripple consensus ledger.

    +   2. `SetRegularKey`: This is used to change or set the transaction signing
    key for an account. An account is identified using a base-58 Ripple address derived
    from the account''s master public key.

    +   3. `SignerListSet`: This can be used to create a set of signers for use in
    multi-signature transactions.

    +   4. `TrustSet`: This is used to create or modify a trust line between accounts.


    A transaction in Ripple is composed of various fields that are common to all transaction
    types. These fields are listed as follows with description:


    +   1. `Account`, address of the initiator of the transaction.

    +   2. `AccountTxnID`, this is an optional field which contains the hash of another
    transaction.

    +   3. `Fee`, Amount of XRP.

    +   4. `Flags`, optional flags for the transaction.

    +   5. `LastLedgerSequence`, highest sequence number of the ledger in which the
    transaction can appear.

    +   6. `Memos`, optional arbitrary information.'
  merge: -1
  img_proc: true
