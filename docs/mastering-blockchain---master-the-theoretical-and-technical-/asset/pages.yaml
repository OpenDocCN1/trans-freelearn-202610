- pgno: 453
  md: "# Circuit\n\nAs shown in the following image, the positive leg (long leg) of\
    \ the LED is connected to pin number 21 of the GPIO and the negative (short leg)\
    \ is connected to the resistor, which is then connected to the **ground (GND)**\
    \ pin of the GPIO. Once the connections are set up the ribbon cable can be used\
    \ to simply connect to the GPIO connector on the Raspberry Pi.\n\n![](img/62ab880d2302f959d34db648cb0bec5e_453_0.png)\n\
    \nOnce the connections are set up correctly and the Raspberry Pi has been updated\
    \ with the appropriate libraries and geth, the next step is to develop a simple\
    \ smart contract that expects a value. If the value provided to it is not what\
    \ it expects it does not trigger an event; otherwise, if the value passed matches\
    \ the correct value, the event triggers which can be read by the client JavaScript\
    \ programme running via Node.js. Of course, the solidity contract can be very\
    \ complex and can also deal with the ether sent to it and if the amount of ether\
    \ is equal to the required amount then the event can trigger; but in this example\
    \ the aim is to demonstrate the usage of smart contracts to trigger events that\
    \ can then be read by JavaScript programmes running on Node.js, which then in\
    \ turn can trigger actions on IoT devices using various libraries.\n\nThe smart\
    \ contract source code is shown as follows:\n\n```\n```solidity\npragma solidity\
    \ ^0.4.0;\ncontract simpleIOT {\n    uint roomRent=10;\n    event roomRented(bool\
    \ returnValue);\n    function getRent (uint8 x) returns (bool)\n    {\n      \
    \  if (x==roomrent)\n        {\n            roomRented(true);\n            return\
    \ true;\n        }\n    }\n}\n```\n```\n\n![](img/62ab880d2302f959d34db648cb0bec5e_453_1.png)"
  merge: -1
  img_proc: true
