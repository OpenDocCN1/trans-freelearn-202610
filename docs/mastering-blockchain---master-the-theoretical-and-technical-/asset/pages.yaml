- pgno: 351
  md: 'Once the command is successful, it will create the directory structure shown
    here. This can be viewed using the `tree` command in Linux:


    ```

    ```text

    drequinox@drequinox-OP7010:~/testdapp$ tree

    .

    ├── app

    │   ├── images

    │   ├── index.html

    │   ├── javascripts

    │   │   └── app.js

    │   └── stylesheets

    │       └── app.css

    ├── contracts

    │   ├── ConvertLib.sol

    │   ├── MetaCoin.sol

    │   └── Migrations.sol

    ├── migrations

    │   ├── 1_initial_migration.js

    │   └── 2_deploy_contracts.js

    ├── test

    │   └── metacoin.js

    └── truffle.js

    7 directories, 10 files

    ```

    ```


    This command creates four main directories, named `app`, `contracts`, `migrations`,
    and `test`. As seen in the preceding example, a total of 7 directories and 10
    files have been created. In the following section, an explanation of all these
    files and directories will be presented.


    +   - **App:** This directory contains all application files including HTML files,
    images, style sheets and JavaScript files. This folder contains further subdirectories,
    images, javascripts, and stylesheets that contain relevant application files.

    +   - **Contracts:** This directory contains solidity contract source code files.
    This is where truffle will look for solidity contract files during migration.

    +   - **Migration:** This directory has all the deployment scripts.

    +   - **Test:** As the name suggests, this directory contains relevant test files
    for applications and contracts.


    Finally, truffle configuration is stored in the `truffle.js` file, which is created
    in the root folder of the project from where `truffle init` was run. When `truffle
    init` is run, it will create a sample project named MetaCoin. As an example, you
    will first be introduced to how to use various commands in truffle in order to
    test and deploy MetaCoin. Later, further examples will be shown on how to use
    truffle for custom projects.'
  merge: -1
  img_proc: true
- pgno: 352
  md: "# Compilation using truffle\n\nBoth libraries and contracts can be compiled\
    \ using truffle. It is expected that the name of the contract file will be the\
    \ same as the contract name within the file. For example, from the sample MetaCoin\
    \ project created earlier, the file named `MetaCoin.sol` under the `contracts`\
    \ directory has the same name as the MetaCoin contract in the file. This applies\
    \ to library files too and it is case-sensitive.\n\n+   - Filename:\n+   \n+ \
    \    `MetaCoin.sol`\n+   - Contract name within the file:\n+   \n+     ```\n+\
    \     contract MetaCoin {\n+         mapping (address => uint) balances;\n+  \
    \   ```\n\nCompilation can be run as shown here:\n\n```\n~/testdapp$ truffle compile\n\
    Compiling ConvertLib.sol...\nCompiling MetaCoin.sol...\nCompiling Migrations.sol...\n\
    Writing artifacts to ./build/contracts\n~/testdapp$\n```\n\nOnce the compilation\
    \ is finished successfully, all objects will be written in to the `build` directory.\
    \ The output directory looks like what is shown here:\n\n```\n~/testdapp$ tree\
    \ build/\nbuild/\n└── contracts\n    ├── ConvertLib.sol.js\n    ├── MetaCoin.sol.js\n\
    \    └── Migrations.sol.js\n1 directory, 3 files\n```\n\nAs shown in the preceding\
    \ example, the `build` directory is created automatically with the `contracts`\
    \ subdirectory, which contains three JavaScript files.\n\n# Migration\n\nThis\
    \ is the process by which truffle deploys contracts to the blockchain. This process\
    \ relies on the files available under the `migrations` directory."
  merge: -1
  img_proc: true
- pgno: 353
  md: "The process works as shown here:\n\n```\n```text\n~/testdapp$ cd migrations/\n\
