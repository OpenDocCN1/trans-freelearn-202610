- pgno: 266
  md: '# # The bloom filter


    A bloom filter is created from the information contained in the set of logs discussed
    earlier. A log entry is reduced to a hash of 256 bytes, which is then embedded
    in the header of the block as the logs bloom. Log entry is composed of the logger''s
    address and log topics and log data. Log topics are encoded as a series of 32
    byte data structures. Log data is made up of a few bytes of data.


    This process can be visualized in the following diagram:


    ![](img/62ab880d2302f959d34db648cb0bec5e_266_0.png)


    # # Transaction validation and execution


    Transactions are executed after verifying the transactions for validity. Initial
    tests are listed as follows:


    +   - A transaction must be well-formed and RLP-encoded without any additional
    trailing bytes

    +   - The digital signature used to sign the transaction is valid

    +   - Transaction nonce must be equal to the sender''s account''s current nonce

    +   - Gas limit must not be less than the gas used by the transaction

    +   - The sender''s account contains enough balance to cover the execution cost'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# The transaction sub state


    A transaction sub-state is created during the execution of the transaction that
    is processed immediately after the execution completes. This transaction sub-state
    is a tuple that is composed of three items.


    # Suicide set


    This element contains the list of accounts that are disposed of after the transaction
    is executed.


    # Log series


    This is an indexed series of checkpoints that allow the monitoring and notification
    of contract calls to the entities external to the Ethereum environment, such as
    application frontends. It works like a trigger mechanism that is executed every
    time a specific function is invoked or a specific event occurs. Logs are created
    in response to events occurring in the smart contract. It can also be used as
    a cheaper form of storage. Events will be covered with practical examples in Chapter
    8, Ethereum development.


    # Refund balance


    This is the total price of gas in the transaction that initiated the execution.
    Refunds are not immediately executed; instead, they are used to partially offset
    the total execution cost.


    The following diagram describes the transaction sub-state tuple:


    ![](img/62ab880d2302f959d34db648cb0bec5e_267_0.png)'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# The block validation mechanism


    An Ethereum block is considered valid if it passes the following checks:


    +   - Consistent with Uncles and transactions. This means that all Ommers (Uncles)
    satisfy the property that they are indeed Uncles and also if the Proof of Work
    for Uncles is valid.

    +   - If the previous block (parent) exists and is valid.

    +   - If the timestamp of the block is valid. This basically means that the current
    block''s timestamp must be higher than the parent block''s timestamp. Also, it
    should be less than 15 minutes into the future. All block times are calculated
    in epoch time (Unix time).


    If any of these checks fails, the block will be rejected.


    # Block finalization


    Block finalization is a process that is run by miners in order to validate the
    contents of the block and apply rewards. It results in four steps being executed.
    These steps are described here in detail.


    # Ommers validation


    Validate Ommers (stale blocks also called Uncles). In the case of mining, determine
    Ommers. The validation process of the headers of stale blocks checks whether the
    header is valid and the relationship of the Uncle with the current block satisfies
    the maximum depth of six blocks. A block can contain a maximum of two Uncles.


    # Transaction validation


    Validate transactions. In the case of mining, determine transactions. The process
    involves checking whether the total gas used in the block is equal to the final
    gas consumption after the final transaction.


    # Reward application


    Apply rewards, which means updating the beneficiary''s account with a reward balance.
    In Ethereum, a reward is also given to miners for stale blocks, which is 1/32
    of the block reward. Uncles that are included in the blocks also receive 7/8 of
    the total block reward. The current block reward is 5 Ether. A block can have
    a maximum of two Uncles.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# State and nonce validation


    Verify the state and nonce. In the case of mining, compute a valid state and nonce.


    # Block difficulty


    Block difficulty is increased if the time between two blocks decreases, whereas
    it increases if the block time between two blocks decreases. This is required
    to maintain a roughly consistent block generation time. The difficulty adjustment
    algorithm in Ethereum''s homestead release is shown as follows:


    ```

    block_diff = parent_diff + parent_diff // 2048 *

    max(1 - (block_timestamp - parent_timestamp) // 10, -99) +

    int(2**((block.number // 100000) - 2))

    ```


    The preceding algorithm means that, if the time difference between the generation
    of the parent block and the current block is less than 10 seconds, the difficulty
    goes up. If the time difference is between 10 to 19 seconds, the difficulty level
    remains the same. Finally, if the time difference is 20 seconds or more, the difficultly
    level decreases. This decrease is proportional to the time difference.


    In addition to timestamp-difference-based difficulty adjustment, there is also
    another part (shown in the last line of the preceding algorithm) that increases
    the difficulty exponentially after every 100,000 blocks. This is the so called
    difficulty time bomb or Ice age introduced in the Ethereum network, which will
    make it very hard to mine on the Ethereum blockchain at some point in the future.
    This will encourage users to switch to Proof of Stake as mining on the POW chain
    will eventually become prohibitively difficult. According to the latest update
    and estimates based on the algorithm, the block generation time will become significantly
    high during the second half of the year 2017 and in 2021, it will become so high
    that it will be virtually impossible to mine on the POW chain. This way, miners
    will have no choice but to switch to the Proof of Stake scheme proposed by Ethereum
    called Casper.


    # Ether


    Ether is minted by miners as a currency reward for the computational effort they
    spend in order to secure the network by verifying and with validation transactions
    and blocks. Ether is used within the Ethereum blockchain to pay for the execution
    of contracts on the EVM. Ether is used to purchase gas as crypto fuel, which is
    required in order to perform computation on the Ethereum blockchain.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'The denomination table is shown as follows:


    | Unit | Wei Value | Weis |

    |---|---|---|

    | Wei | 1 Wei | 1 |

    | Babbage | 1e3 Wei | 1,000 |

    | Lovelace | 1e6 Wei | 1,000,000 |

    | Shannon | 1e9 Wei | 1,000,000,000 |

    | Szabo | 1e12 Wei | 1,000,000,000,000 |

    | Finney | 1e15 Wei | 1,000,000,000,000,000 |

    | Ether | 1e18 Wei | 1,000,000,000,000,000,000 |


    Fees are charged for each computation performed by the EVM on the blockchain.
    A detailed fee schedule is shown in the upcoming section.


    # Gas


    Gas is required to be paid for every operation performed on the ethereum blockchain.
    This is a mechanism that ensures that infinite loops cannot cause the whole blockchain
    to stall due to the Turing-complete nature of the EVM. A transaction fee is charged
    as some amount of Ether and is taken from the account balance of the transaction
    originator. A fee is paid for transactions to be included by miners for mining.
    If this fee is too low, the transaction may never be picked up; the more the fee,
    the higher are the chances that the transactions will be picked up by the miners
    for inclusion in the block. Conversely, if the transaction that has an appropriate
    fee paid is included in the block by miners but has too many complex operations
    to perform, it can result in an out-of-gas exception if the gas cost is not enough.
    In this case, the transaction will fail but will still be made part of the block
    and the transaction originator will not get any refund.


    Transaction cost can be estimated using the following formula:


    *Total cost = gasUsed * gasPrice*'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'Here, *gasUsed* is the total gas that is supposed to be used by the transaction
    during the execution and *gasPrice* is specified by the transaction originator
    as an incentive to the miners to include the transaction in the next block. This
    is specified in Ether. Each EVM opcode has a fee assigned to it. It is an estimate
    because the gas used can be more or less than the value specified by the transaction
    originator originally. For example, if computation takes too long or the behavior
    of the smart contract changes in response to some other factors, then the transaction
    execution may perform more or less operations than originally intended and can
    result in consuming more or fewer gas. If the execution runs out of gas, everything
    is immediately rolled back; otherwise, if the execution is successful and there
    is some remaining gas, then it is returned to the transaction originator.


    Each operation costs some gas; a high level fee schedule of a few operations is
    shown as an example here:


    | Operation Name | Gas Cost |

    |---|---|

    | step | 1 |

    | stop | 0 |

    | suicide | 0 |

    | sha3 | 30 |

    | sload | 20 |

    | txdata | 5 |

    | transaction | 500 |

    | contract creation | 53000 |


    Based on the preceding fee schedule and the formula discussed earlier, an example
    calculation of the SHA3 operation can be calculated as follows:


    +   - SHA3 costs 30 gas

    +   - Current gas price is 25 GWei, which is 0.000000025 Ether

    +   - Multiplying both: 0.000000025 * 30 = 0.00000075 Ether


    In total, 0.00000075 Ether is the total gas that will be charged.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# # Fee schedule


    Gas is charged in three scenarios as a prerequisite to the execution of an operation:


    +   - The computation of an operation

    +   - For contract creation or message call

    +   - Increase in the usage of memory


    A list of instructions and various operations with the gas values has been provided
    previously in the chapter.


    # # Messages


    Messages, as defined in the yellow paper, are the data and value that are passed
    between two accounts. A message is a data packet passed between two accounts.
    This data packet contains data and value (amount of ether). It can either be sent
    via a smart contract (autonomous object) or from an external actor (externally
    owned account) in the form of a transaction that has been digitally signed by
    the sender.


    Contracts can send messages to other contracts. Messages only exist in the execution
    environment and are never stored. Messages are similar to transactions; however,
    the main difference is that they are produced by the contracts, whereas transactions
    are produced by entities external (externally owned accounts) to the Ethereum
    environment.


    A message consists of the components mentioned here:


    +   1. Sender of the message

    +   2. Recipient of the message

    +   3. Amount of Wei to transfer and message to the contract address

    +   4. Optional data field (Input data for the contract)

    +   5. Maximum amount of gas that can be consumed


    Messages are generated when CALL or DELEGATECALL Opcodes are executed by the contracts.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Calls


    A call does not broadcast anything to the blockchain; instead, it is a local call
    to a contract function and runs locally on the node. It is almost like a local
    function call. It does not consume any gas as it is a read-only operation. It
    is akin to a dry run. Calls are executed locally on a node and generally do not
    result in any state change. As defined in the yellow paper, this is the act of
    passing a message from one account to another. If the destination account has
    an associated EVM code, then the virtual machine will start upon the receipt of
    the message to perform the required operations. If the message sender is an autonomous
    object, then the call passes any data returned from the virtual machine operation.


    State is altered by transactions. These are created by external factors and are
    signed and then broadcasted to the Ethereum network.


    # Mining


    Mining is the process by which new currency is added to the blockchain. This is
    an incentive for the miners to validate and verify blocks made up of transactions.
    The mining process helps secure the network by verifying computations.


    At a theoretical level, a miner performs the following functions:


    +   1. Listens for the transactions broadcasted on the Ethereum network and determines
    the transactions to be processed.

    +   2. Determines stale blocks called Uncles or Ommers and includes them in the
    block.

    +   3. Updates the account balance with the reward earned from successfully mining
    the block.

    +   4. Finally, a valid state is computed and block is finalized, which defines
    the result of all state transitions.


    The current method of mining is based on Proof of Work, which is similar to that
    of bitcoin. When a block is deemed valid, it has to satisfy not only the general
    consistency requirements, but it must also contain the Proof of Work for a given
    difficulty.


    The Proof of Work algorithm is due to be replaced with the Proof of Stake algorithm
    with the release of serenity. Considerable research work has been carried out
    in order to build the Proof of Stake algorithm suitable for the Ethereum Network.'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'An Algorithm named Casper has been developed, which will replace the existing
    Proof of Work algorithm in Ethereum. This is a security deposit based on the economic
    protocol where nodes are required to place a security deposit before they can
    produce blocks. Nodes have been named bonded validators in Casper, whereas the
    act of placing the security deposit is named bonding.


    # Ethash


    **Ethash** is the name of the Proof of Work algorithm used in Ethereum. Originally,
    this was proposed as the Dagger-Hashimoto algorithm, but much has changed since
    the first implementation and the PoW algorithm has now evolved into what''s known
    as Ethash now. Similar to bitcoin, the core idea behind mining is to find a nonce
    that once hashed the result in a predetermined difficulty level. Initially, the
    difficulty was low when Ethereum was new and even CPU and single GPU mining was
    profitable to a certain extent, but that is no longer the case. Now either pooled
    mining is profitable, or large GPU mining farms are used for mining purposes.


    Ethash is a memory-hard algorithm, which makes it difficult to be implemented
    on specialized hardware. As in bitcoin, ASICs have been developed, which have
    resulted in mining centralization over the years, but memory-hard Proof of Work
    algorithms are one way of thwarting this threat and Ethereum implements Ethash
    to discourage ASIC development for mining. This algorithm requires choosing subsets
    of a fixed resource called **DAG (Directed Acyclic Graph)** depending on the nonce
    and block headers. DAG is around 2 GB in size and changes every 30000 blocks.
    Mining can only start when DAG is completely generated the first time a mining
    node starts. The time between every 30000 blocks is around 5.2 days and is called
    epoch. This DAG is used as a seed by the Proof of Work algorithm called Ethash.
    According to current specifications, the epoch time is defined as 30,000 blocks.


    The current reward scheme is 5 Ether for successfully finding a valid nonce. In
    addition to receiving 5 Ethers, the successful miner also receives the cost of
    the gas consumed within the block and an additional reward for including stale
    blocks (Uncles) in the block. A maximum of two Uncles are allowed per block and
    are rewarded 7/8 of the normal block reward. In order to achieve a 12 second block
    time, block difficulty is adjusted at every block. The rewards are directly proportional
    to the miner''s hash rate, which basically means how fast a miner can hash.


    Mining can be performed by simply joining the Ethereum network and running an
    appropriate client. The key requirement is that the node should be fully synced
    with the main network before mining can start.'
  merge: -1
  img_proc: true
