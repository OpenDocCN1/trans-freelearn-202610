- pgno: 468
  md: '# # 12

    ## Scalability and Other Challenges


    This chapter aims to provide an introduction to various challenges that need to
    be addressed before blockchains can become mainstream technology. Even though
    various use cases and proof of concept systems have been developed and the technology
    works well for many of the scenarios, there still is a need to address some fundamental
    limitations that are present in blockchains in order to make this technology more
    adaptable.


    At the top of the list of these issues comes scalability and then privacy. Both
    of these are important limitations to address, especially as blockchains are envisioned
    to be used in privacy-demanding industries too. There are specific requirements
    around confidentiality of transactions in finance, law and healthcare, whereas
    scalability is generally a concern where blockchains do not meet the adequate
    performance levels expected by the users. These two issues are becoming inhibiting
    factors toward blockchain technology''s wider acceptance. A review of currently
    proposed and ongoing research in these two specific areas will be presented in
    this chapter. In addition to privacy and security, other challenges include regulation,
    integration, adaptability, and security in general. Although, in bitcoin blockchain
    security is provably bulletproof and has stood the test of time, there still are
    some caveats that may allow security to be compromised to an extent in some subtle
    scenarios. Also, there are some reasonable security concerns in other blockchains,
    such as Ethereum, regarding smart contracts, denial of service attacks, and large
    attack surface. All of these will be discussed in detail in the following sections.'
  merge: -1
  img_proc: true
- pgno: 469
  md: '# Scalability


    This problem has been a focus of intense debate, rigorous research, and media
    attention for the last few years. This is the single most important problem that
    could mean the difference between wider adaptability of blockchains or limited
    private use only by consortiums. As a result of substantial research in this area,
    many solutions have been proposed, which are discussed in the following section.


    From a theoretical perspective, the general approach toward tackling the scalability
    issue generally revolves around protocol-level enhancements. For example, a commonly
    mentioned solution to bitcoin scalability is to increase its block size. Other
    proposals include off-chain solutions that offload certain processing to off-chain
    networks, for example, off-chain state networks. Based on the solutions mentioned
    above, generally, the proposals can be divided into two categories: on-chain solutions
    that are based on the idea of changing fundamental protocols on which the blockchain
    operates, and off-chain solutions that make use of network and processing resources
    off-chain in order to enhance the blockchain.


    Another approach to addressing limitations in blockchains has been recently proposed
    by Miller and others in their position paper On Scaling Decentralized Blockchains.
    In this paper, it is shown that a blockchain can be divided into various abstracted
    layers called planes. Each plane is responsible for performing specific functions.
    These include the network plane, consensus plane, storage plane, view plane, and
    side plane. This abstraction allows bottlenecks and limitations to be addressed
    at each plane individually and in a structured manner. A brief overview of each
    layer is given below with some references to the bitcoin system.


    First the network plane is discussed. A key function of the network plane is transaction
    propagation. It has been identified in the above-mentioned paper that in bitcoin,
    this plane underutilizes the network bandwidth due to the way transaction validation
    is performed by a node before propagation and duplication of transaction propagation,
    first in the transaction broadcast phase, and then after mining in a block. It
    should be noted that this issue was addressed by BIP 152 (Compact Block Relay).


    The second layer is called the consensus plane. This layer is responsible for
    mining and achieving consensus. Bottlenecks in this layer revolve around limitations
    in Proof of Work algorithms whereby increasing consensus speed and bandwidth results
    in compromising security of the network due to an increase in the number of forks.'
  merge: -1
  img_proc: true
- pgno: 470
  md: 'The storage plane is the third layer, which stores the ledger. Issues in this
    layer revolve around the need for each node to keep a copy of the entire ledger,
    which leads to certain inefficiencies, such as increased bandwidth and storage
    requirements. Bitcoin has a method available called pruning, which allows a node
    to operate without the need to download the full blockchain. This functionality
    has resulted in major improvements from a storage point of view.


    Next on the list is the view plane, which proposes an optimization which is based
    on the proposal that bitcoin miners do not need the full blockchain to operate,
    and a view can be constructed out of the complete ledger as a representation of
    the entire state of the system, which is sufficient for miners to function. Implementation
    of views will eliminate the need for mining nodes to store the full blockchain.


    Finally, the side plane has been proposed by the authors of the above-mentioned
    research paper. This plane represents the idea of off-chain transactions whereby
    the concept of payment or transaction channels is used to offload the processing
    of transactions between participants, but is still backed by the main bitcoin
    blockchain.


    The above-mentioned model can be used to describe limitations and improvements
    in current blockchain designs in a structured manner. Also, there are several
    general strategies that have been proposed over the last few years which can address
    the limitations in current blockchain designs such as Ethereum and bitcoin. These
    approaches are also characterized and discussed individually in the following
    section.


    # Block size increase


    This is the most debated proposal for increasing blockchain performance (transaction
    processing throughput). Currently, bitcoin can process only about three to seven
    transactions per second, which is a major inhibiting factor in adapting the bitcoin
    blockchain for processing micro-transactions. Block size in bitcoin is hardcoded
    to be 1 MB, but if block size is increased, it can hold more transactions and
    can result in faster confirmation time. There are several Bitcoin Improvement
    Proposals (BIPs) made in favor of block size increase. These include BIP 100,
    BIP 101, BIP 102, BIP 103, and BIP 109. In Ethereum, the block size is not limited
    by hardcoding; instead, it is controlled by gas limit. In theory, there is no
    limit on the size of a block in Ethereum because it''s dependent on the amount
    of gas, which can increase over time. This is possible because miners are allowed
    to increase the gas limit for subsequent blocks if the limit has been reached
    in the previous block.'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# # Block interval reduction


    Another proposal is to reduce the time between each block generation. The time
    between blocks can be decreased to achieve faster finalization of blocks but may
    result in less security due to the increased number of forks. Ethereum has achieved
    a block time of approximately 14 seconds and, at times, it can increase. This
    is a significant improvement from the bitcoin blockchain, which takes 10 minutes
    to generate a new block. In Ethereum, the issue of high orphaned blocks resulting
    from smaller times between blocks is mitigated by using the **Greedy Heaviest
    Observed Subtree (GHOST)** protocol whereby orphaned blocks (uncles) are also
    included in determining the valid chain. Once Ethereum moves to Proof of Stake,
    this will become irrelevant as no mining will be required and almost immediate
    finality of transactions can be achieved.


    # # Invertible Bloom lookup tables


    This is another approach that has been proposed to reduce the amount of data required
    to be transferred between bitcoin nodes. **Invertible Bloom lookup tables (IBLTs)**
    were originally proposed by *Gavin Andresen*, and the key attraction in this approach
    is that it does not result in a hard fork of bitcoin if implemented. The key idea
    is based on the fact that there is no need to transfer all transactions between
    nodes; instead, only those that are not already available in the transaction pool
    of the synching node are transferred. This allows quicker transaction pool synchronization
    between nodes, thus increasing the overall scalability and speed of the bitcoin
    network.


    # # Sharding


    Sharding is not a new technique and has been used in distributed databases for
    scalability such as MongoDB and MySQL. The key idea behind sharding is to split
    up the tasks into multiple chunks that are then processed by multiple nodes. This
    results in improved throughput and reduced storage requirements. In blockchains,
    a similar scheme is employed whereby the state of the network is partitioned into
    multiple shards. The state usually includes balances, code, nonce, and storage.
    Shards are loosely coupled partitions of a blockchain that run on the same network.
    There are a few challenges related to inter-shard communication and consensus
    on the history of each shard. This is an open area for research.'
  merge: -1
  img_proc: true
- pgno: 472
  md: '# ## State channels


    This is another approach proposed for speeding up the transaction on a blockchain
    network. The basic idea is to use side channels for state updating and processing
    transactions off the main chain; once the state is finalized, it is written back
    to the main chain, thus offloading the time-consuming operations from the main
    blockchain. State channels work by performing the following three steps:


    +   1. First, a part of the blockchain state is locked under a smart contract,
    ensuring the agreement and business logic between participants.

    +   2. Now off-chain transaction processing and interaction is started between
    the participants that update the state only between themselves for now. In this
    step, almost any number of transactions can be performed without requiring the
    blockchain and this is what makes the process fast and a best candidate for solving
    blockchain scalability issues. However, it could be argued that this is not a
    real on-blockchain solution such as, for example, sharding, but the end result
    is a faster, lighter, and robust network which can prove very useful in micropayment
    networks, IoT networks, and many other applications.

    +   3. Once the final state is achieved, the state channel is closed and the final
    state is written back to the main blockchain. At this stage, the locked part of
    the blockchain is also unlocked.


    This technique has been used in the bitcoin lightning network and Ethereum''s
    Raiden.


    # ## Private blockchain


    Private blockchains are inherently fast because no real decentralization is required
    and participants on the network do not need to mine; instead, they can only validate
    transactions. This can be considered as a workaround to the scalability issue
    in public blockchains; however, this is not the solution to the scalability problem.
    Also, it should be noted that private blockchains are only suitable in specific
    areas and setups.


    # ## Proof of Stake


    Instead of using Proof of Work, Proof of Stake algorithm based blockchains are
    fundamentally faster.'
  merge: -1
  img_proc: true
