  The various ideas that helped with the invention of bitcoin and blockchain


  ## Introduction to blockchain


  There are various definitions of blockchain; it depends on how you look at it. If
  you look at it from a business perspective it can be defined in that context, if
  you look at it from a technical perspective one can define it in view of that.


  **Blockchain** at its core is a peer-to-peer distributed ledger that is cryptographically
  secure, append-only, immutable (extremely hard to change), and updateable only via
  consensus or agreement among peers.


  ## Blockchain 101


  Blockchain can be thought of as a layer of a distributed peer-to-peer network running
  on top of the Internet, as can be seen below in the diagram. It is analogous to
  SMTP, HTTP, or FTP running on top of TCP/IP. This is shown in the following diagram:


  ![](img/62ab880d2302f959d34db648cb0bec5e_42_0.png)


  The network view of a blockchain


  From a business point of view a blockchain can be defined as a platform whereby
  peers can exchange values using transactions without the need for a central trusted
  arbitrator. This is a powerful concept and once readers understand it they will
  realize the tsunami potential of blockchain technology. This allows blockchain to
  be a decentralized consensus mechanism where no single authority is in charge of
  the database.


  A block is simply a selection of transactions bundled together in order to organize
  them logically. It is made up of transactions and its size is variable depending
  on the type and design of the blockchain in use. A reference to a previous block
  is also included in the block unless it''s a genesis block. A genesis block is the
  first block in the blockchain that was hardcoded at the time the blockchain was
  started. The structure of a block is also dependent on the type and design of a
  blockchain, but generally there are a few attributes that are essential to the functionality
  of a block, such as the block header, pointers to previous blocks, the time stamp,
  nonce, transaction counter, transactions, and other attributes.


  The structure of a generic blockchain can be visualized with the help of the following
  diagram:


  ![](img/62ab880d2302f959d34db648cb0bec5e_44_0.png)


  ## Generic elements of a blockchain


  In this section, the generic elements of blockchain are presented. More precise
  elements will be discussed in the context of their respective blockchains in later
  chapters, for example, the Ethereum blockchain.


  ## Addresses


  Addresses are unique identifiers that are used in a transaction on the blockchain
  to denote senders and recipients. An address is usually a public key or derived
  from a public key. While addresses can be reused by the same user, addresses themselves
  are unique. In practice, however, a single user may not use the same address again
  and generate a new one for each transaction. This newly generated address will be
  unique. Bitcoin is in fact a pseudonymous system. End users are usually not directly
  identifiable but some research in de-anonymizing bitcoin users have shown that users
  can be identified successfully. As a good practice it is suggested that users generate
  a new address for each transaction in order to avoid linking transactions to the
  common owner, thus avoiding identification.


  ## Transaction


  A transaction is the fundamental unit of a blockchain. A transaction represents
  a transfer of value from one address to another.


  ## Block


  A block is composed of multiple transactions and some other elements such as the
  previous block hash (hash pointer), timestamp, and nonce.


  ## Peer-to-peer network


  As the name implies, this is a network topology whereby all peers can communicate
  with each other and send and receive messages.


  ## Scripting or programming language


  This element performs various operations on a transaction. Transaction scripts are
  predefined sets of commands for nodes to transfer tokens from one address to another
  and perform various other functions. Turing complete programming language is a desirable
  feature of blockchains; however, the security of such languages is a key question
  and an area of important and ongoing research.


  ## Virtual machine


  This is an extension of a transaction script. A virtual machine allows Turing complete
  code to be run on a blockchain (as smart contracts) whereas a transaction script
  can be limited in its operation. Virtual machines are not available on all blockchains;
  however, various blockchains use virtual machines to run programs, for example Ethereum
  Virtual Machine (EVM) and Chain Virtual Machine (CVM).


  ## State machine


  A blockchain can be viewed as a state transition mechanism whereby a state is modified
  from its initial form to the next and eventually to a final form as a result of
  a transaction execution and validation process by nodes.


  ## Nodes


  A node in a blockchain network performs various functions depending on the role
  it takes. A node can propose and validate transactions and perform mining to facilitate
  consensus and secure the blockchain. This is done by following a consensus protocol.
  (Most commonly this is PoW.) Nodes can also perform other functions such as simple
  payment verification (lightweight nodes), validators, and many others functions
  depending on the type of the blockchain used and the role assigned to the node.


  ## Smart contracts


  These programs run on top of the blockchain and encapsulate the business logic to
  be executed when certain conditions are met. The smart contract feature is not available
  in all blockchains but is now becoming a very desirable feature due to the flexibility
  and power it provides to the blockchain applications.


  ## Features of a blockchain


  A blockchain performs various functions. These are described below in detail.


  ## Distributed consensus


  Distributed consensus is the major underpinning of a blockchain. This enables a
  blockchain to present a single version of truth that is agreed upon by all parties
  without the requirement of a central authority.


  ## Transaction verification


  Any transactions posted from nodes on the blockchain are verified based on a predetermined
  set of rules and only valid transactions are selected for inclusion in a block.


  ## Platforms for smart contracts


  A blockchain is a platform where programs can run that execute business logic on
  behalf of the users. As explained earlier, not all blockchains have a mechanism
  to execute smart contracts; however, this is now a very desirable feature.


  ## Transferring value between peers


  Blockchain enables the transfer of value between its users via tokens. Tokens can
  be thought of as a carrier of value.


  ## Generating cryptocurrency


  This is an optional feature depending on the type of blockchain used. A blockchain
  can generate cryptocurrency as an incentive to its miners who validate the transactions
  and spend resources in order to secure the blockchain.


  ## Smart property


  For the first time it is possible to link a digital or physical asset to the blockchain
  in an irrevocable manner, such that it cannot be claimed by anyone else; you are
  in full control of your asset and it cannot be double spent or double owned. Compare
  it with a digital music file, for example, which can be copied many times without
  any control; on a blockchain, however, if you own it no one else can claim it unless
  you decide to transfer it to someone. This feature has far-reaching implications
  especially in Digital Rights Management (DRM) and electronic cash systems where
  double spend detection is a key requirement. The double spend problem was first
  solved in bitcoin.


  ## Provider of security


  Blockchain is based on proven cryptographic technology that ensures the integrity
  and availability of data. Generally, confidentiality is not provided due to the
  requirements of transparency. This has become a main barrier for its adaptability
  by financial institutions and other industries that need privacy and confidentiality
  of transactions. As such it is being researched very actively and there is already
  some good progress made. It could be argued that in many situations confidentiality
  is not really needed and transparency is preferred instead. For example, in bitcoin
  confidentiality is not really required; however, it is desirable in some scenarios.
  Research in this area is very ripe and already major progress has been made towards
  providing confidentiality and privacy on blockchain. A more recent example is Zcash,
  which will be discussed in more detail in later chapters. Other security services
  such as nonrepudiation and authentication are also provided by blockchain as all
  actions are secured by using private keys and digital signatures.






  Immutability


  这是区块链的另一个关键特性：一旦记录添加到区块链上就不可变。理论上存在回滚更改的可能性，但这被认为几乎不可能实现，因为它需要难以承受的计算资源。例如，在比特币这种非常理想的情况下，如果恶意用户想要篡改之前的区块，那么就需要对已经添加到区块链上的所有这些区块重新计算
  PoW。这种难度使得区块链上的记录实际上不可变。


  Uniqueness


  区块链的这一特性确保每笔交易都是唯一的，并且尚未被花费。这在加密货币中尤其相关，其中检测和避免双花是关键要求。


  Smart contracts


  区块链提供了一个运行智能合约的平台。这些是驻留在区块链上的自动化自主程序，将业务逻辑和代码封装起来，以便在满足某些条件时执行所需功能。这确实是区块链的一项革命性特性，因为它允许灵活性、可编程性以及用户根据其特定业务需求需要执行的操作的高度期望的控制。


  Applications of blockchain technology


  区块链技术在各个领域有多重应用，包括但不限于金融、政府、媒体、法律和艺术。关于这些方面的更多内容将在第 9 章 Hyperledger 中进一步阐述，在那里将详细讨论各个行业的实际用例。现在可以说，几乎所有行业都已经认识到区块链的潜力和前景，并且已经或即将踏上利用区块链技术获益的旅程。


  在以下部分中，讨论了创建区块的一般方案。这里呈现此内容是为了让读者对区块是如何生成的以及交易与区块之间的关系有一个大致的了解。


  ## How blockchains accumulate blocks


  - 1. 一个节点通过使用其私钥对交易进行签名来启动交易。

  - 2. 交易通过非常理想的 Gossip 协议传播给对等节点进行泛洪传播，对等节点基于预设标准验证交易。通常，需要一个以上的节点来验证交易。

  - 3. 一旦交易得到验证，它将被包含在一个区块中，该区块随后在网络上传播。此时，交易被视为已确认。

  - 4. 新创建的区块现在成为账本的一部分，并且下一个区块在密码学上链接回此区块。此链接是一个哈希指针。在此阶段，交易获得第二次确认，区块获得第一次确认。

  - 5. 每次创建新区块时，交易都会被重新确认。通常，在比特币网络中需要六次确认才能认为交易最终完成。


  步骤 4 和 5 可以被视为非强制性的，因为交易本身在步骤 3 中就已最终确定；然而，如果需要，区块确认和进一步的交易重新确认将在步骤 4 和 5 中进行。


  ## Tiers of blockchain technology


  在本节中，讨论了区块链技术的各个层级。预计由于区块链技术的快速发展和进步，许多应用将随着时间的推移而演进。其中一些已经实现，而另一些可以根据区块链技术目前的进步速度为未来设想。


  首先，下面讨论的三个层级最初是由 *Melanie Swan* 在她的书 *Blockchain, Blueprint for a New Economy* 中描述的，作为根据每个类别中的应用对区块链进行分类的层级。除此之外，后面还讨论了
  Tier X 或 Generation X。这是作者认为当区块链技术变得足够先进时将会成为现实的东西。


  ## Blockchain 1.0


  这是在比特币发明时引入的，基本上用于加密货币。此外，由于比特币是加密货币的第一个实现，将区块链技术的第一代归类为仅包括加密货币是有意义的。所有山寨币和比特币都属于这一类别。这包括核心应用如支付和应用。


  ## Blockchain 2.0


  第 2.0 代区块链被金融服务使用，并且在这一代引入了合约。这包括各种金融资产，例如衍生品、期权、掉期和债券。超出货币、金融和市场的应用也包含在此层级。


  ## Blockchain 3.0


  第 3 代区块链用于在金融服务行业之外实现应用，并用于政府、健康、媒体、艺术和司法等更通用的行业。


  ## Generation X (Blockchain X)


  这是区块链奇点的愿景，有一天我们将拥有一个公共区块链服务，任何人都可以像使用 Google 搜索引擎一样使用它。它将在社会的各个领域提供服务。这是一个公共开放的分布式账本，具有通用目的的理性代理
  Machina Economicus 在区块链上运行，代表人类做出决策并与其他智能自主代理交互，并由代码而不是法律或纸质合同来监管。这将在第 13 章 Current
  Landscape and What’s Next 中详细阐述。


  ## Types of blockchain


  根据区块链在过去几年中的演变方式，可以将其分为多种类型，具有不同但有时部分重叠的属性。


  ## Public blockchains


  顾名思义，这些区块链对公众开放，任何人都可以作为节点参与决策过程。用户参与可能获得奖励也可能不获得奖励。这些账本不属于任何人，并且对任何人公开参与。许可-less
  账本的所有用户都在其本地节点上维护账本的副本，并使用分布式共识机制以便就账本的最终状态达成一致。这些区块链也被称为许可-less 账本。


  ## Private blockchains


  私有区块链顾名思义是私有的，仅对决定在它们之间共享账本的联盟或个人或组织群体开放。


  ## Semi-private blockchains


  这里区块链的一部分是私有的，一部分是公共的。私有部分由一组个人控制，而公共部分对任何人开放参与。


  ## Sidechains


  更准确地称为 pegged sidechains，这是一个概念，即硬币可以从一个区块链移动到另一个区块链并移回。常见用途包括创建新的山寨币，其中硬币被 *burnt*
  作为充足权益的证明。存在两种类型的侧链。上面提供的 *burning* 硬币的示例适用于单向 pegged 侧链。第二种类型称为双向 pegged 侧链，允许硬币从主链移动到侧链，并在需要时移回主链。


  ## Permissioned ledger


  许可账本是一种区块链，其中网络参与者是已知且已受信任的。许可账本不需要使用分布式共识机制，而是可以使用 *agreement protocol* 来维护关于区块链上记录状态的共享真相。许可区块链也不需要是私有的，因为它可以是公共区块链但具有受监管的访问控制。


  ## Distributed ledger


  顾名思义，此账本在参与者之间分布，并在多个站点或组织中传播。此类型可以是私有或公共。关键思想是，与许多其他区块链不同，记录是连续存储的而不是按区块排序。此概念在
  Ripple 中使用。


  ## Shared ledger


  这是用于描述由公众或联盟共享的任何应用程序或数据库的通用术语。


  ## Fully private and proprietary blockchains


  这些区块链也许没有主流应用，因为它们偏离了区块链技术去中心化的核心思想。尽管如此，在组织内部的特定私有环境中，可能需要共享数据并提供数据真实性的某种保证。在这种情况下，这些区块链可能是有用的。例如，用于在各个政府部门之间协作和共享数据。


  ## Tokenized blockchains


  这些区块链是标准区块链，通过挖矿或通过初始分配作为共识过程的结果生成加密货币。






  ## 无代币区块链


  这些可能并不是真正的区块链，因为它们缺乏价值转移的基本单位，但在不需要在节点之间转移价值、仅需要在各种已信任方之间共享某些数据的情况下仍然很有价值。


  在下一节中，将从区块链的角度讨论共识的概念。共识是区块链的核心，并通过一种称为挖矿的可选过程实现了控制的去中心化。共识算法的选择也受所使用区块链类型的制约。并非所有共识机制都适用于所有类型的区块链。例如，在公有无许可区块链中，使用
  PoW 而不是基于权威证明的某些基本协议是有意义的。因此，对于区块链项目来说，适当选择共识算法至关重要。


  ## 区块链中的共识


  共识基本上是一个分布式计算概念，已被用于区块链中，以便为区块链网络上的所有节点就单一的真实版本达成一致。本章前面分布式系统部分已讨论过这一概念。


  大致而言，存在以下两类共识机制：


  - 1. 基于证明、基于领导者或中本聪共识，其中选举出领导者并提出最终值

  - 2. 基于拜占庭容错，这是一种更传统的基于投票轮次的方法


  目前在区块链背景下可用或正在研究的共识算法将在后面介绍。这不是一个详尽的列表，但已尝试呈现所有重要的算法。


  ### 工作量证明


  这种共识机制依赖于在提出值供网络接受之前证明已花费足够计算资源的证明。这用于比特币和其他加密货币。目前，这是唯一一种在抗 Sybil 攻击方面证明出奇成功的算法。


  ### 权益证明


  该算法基于节点或用户在系统中拥有足够的权益这一思想；例如用户已在系统中投入足够多，以至于任何恶意尝试的代价都会超过对系统发动攻击的好处。这一思想最初由 Peercoin
  提出，并将在以太坊区块链中使用。权益证明（PoS）中的另一个重要概念是币龄，它源自未花费的币的数量和时间。在此模型中，提出和签名下一个区块的机会随着币龄的增加而增加。


  ### 委托权益证明


  委托权益证明（DPOS）是对标准 PoS 的改进，其中每个在系统中拥有权益的节点可以通过投票将交易验证委托给其他节点。这用于 bitshares 区块链。


  ### 经过时间证明


  由英特尔引入，它使用可信执行环境（TEE）通过保证的等待时间在领导者选举过程中提供随机性和安全性。它需要英特尔 SGX（软件防护扩展）处理器以提供安全保证并使其安全。该概念在第
  9 章 Hyperledger 中有更详细的讨论，涉及英特尔 Sawtooth Lake 区块链项目。


  ### 基于押金的共识


  希望参与网络的节点必须在提出区块之前缴纳一笔安全押金。


  ### 重要性证明


  这一思想很重要且与权益证明不同。重要性证明不仅依赖于用户在系统中的权益多少，还会监控用户代币的使用和流动以建立信任和重要性水平。这用于 Nemcoin。


  ### 联邦共识或联邦拜占庭共识


  用于恒星共识协议中，该协议中的节点保留一组公开受信任的对等节点，并仅传播由大多数受信任节点验证的交易。


  ### 基于声誉的机制


  顾名思义，领导者是根据其在网络上长期建立的声誉而选举产生的。这可以基于其他成员的投票。


  ### 实用拜占庭容错


  实用拜占庭容错（PBFT）实现了状态机复制，可提供对拜占庭节点的容错。包括但不限于 PBFT、PAXOS、RAFT 和联邦拜占庭协议（FBA）在内的各种其他协议也在许多不同的分布式系统和区块链实现中被使用或被提议使用。


  ### CAP 定理与区块链


  奇怪的是，似乎 CAP 定理在区块链中被违反了，尤其是在最成功的实现：比特币中，但事实并非如此。在区块链中，一致性被牺牲以换取可用性和分区容错。在此场景中，区块链上的
  一致性（C） 并不能同时与 分区容错（P） 和 可用性（A） 一起实现，但会随着时间的推移实现。这称为最终一致性，其中一致性是通过多节点随时间的验证而实现的。为此目的，挖矿概念在比特币中被引入；这是一个使用称为
  PoW 的共识算法来促进达成共识的过程。从更高层面来看，挖矿可以定义为用于向区块链添加更多区块的过程。


  ## 区块链的优势与局限性


  业界正在讨论区块链技术的众多优势，区块链领域的思想领袖也在全球范围内提出这些优势。以下是列出并讨论的前 10 大优势。


  ### 去中心化


  这是区块链的核心概念和优势。无需可信第三方或中介来验证交易；相反，使用共识机制来就交易的合法性达成一致。


  ### 透明度与信任


  由于区块链是共享的，每个人都可以看到区块链上的内容，这使得系统透明，从而建立信任。这在资金或福利的发放等场景中更为相关，在这些场景中个人自由裁量应受到限制。


  ### 不可变性


  一旦数据写入区块链，就极难将其改回。它并非真正不可变，但由于更改数据极其困难且几乎不可能，这被视为维护不可变交易账本的优势。


  ### 高可用性


  由于系统基于数千个节点的点对点网络，并且数据在每个节点上复制和更新，因此系统具有高度可用性。即使节点离开网络或变得无法访问，网络整体仍继续工作，从而使其高度可用。


  ### 高安全性


  区块链上的所有交易都经过加密保护并提供完整性。


  ### 简化当前范式


  当前许多行业如金融或医疗的模式相当混乱，其中多个实体维护自己的数据库，并且由于系统性质各异，数据共享变得非常困难。但由于区块链可以作为利益相关方之间的单一共享账本，这可以通过减少每个实体维护的独立系统管理的复杂性来简化该模型。


  ### 交易更快


  在金融行业，尤其是在交易后结算功能中，区块链可以通过允许更快的交易结算发挥至关重要的作用，因为它不需要冗长的验证、核对和清算过程，因为在金融机构之间的共享账本上已经存在一个商定的数据版本。


  ### 节省成本


  由于区块链模型中不需要第三方或清算所，这可以大幅消除支付给清算所或可信第三方的费用形式的开销成本。


  ### 区块链技术的挑战与局限性


  与其他技术一样，需要解决挑战才能使系统更稳健、有用且易于访问。区块链技术也不例外；事实上，学术界和工业界正在付出大量努力来克服区块链技术带来的挑战。以下是一些最敏感挑战的选集：


  - 可扩展性

  - 适应性

  - 监管

  - 相对不成熟的技术

  - 隐私


  所有这些以及更多内容将在第 13 章《当前格局与未来展望》中与可能的解决方案一起详细讨论。






  本章是有意保持通用且技术性较低的。一旦在第 3 章《密码学与技术基础》中详细解释了密码学，就会在适当的深度和细节上讨论具体的区块链解决方案。


  ## 摘要


  本章以高层次向读者介绍了区块链技术。首先讨论了一些关于分布式系统的基本思想，然后介绍了区块链的历史。讨论了电子现金和 Hashcash 等概念。此外，还从不同角度提出了区块链的各种定义。区块链技术的一些应用也被简要讨论。接下来在章节中，介绍了不同类型的区块链。最后，这项新技术的优势和局限性也被介绍。


  有些主题是有意仅轻微介绍的，因为它们将在后面的章节中深入讨论。例如，挑战和局限性仅在本章中提及，但没有提供细节，因为本书后面有整整一章专门讨论此问题。在下一章中，读者将被介绍去中心化的概念，去中心化是区块链概念及其众多应用的核心。

  '
- '# 2 去中心化


  去中心化并不是一个新概念；它长期以来一直用于战略、管理和管理。去中心化的基本思想是将控制和权威分配给边缘，而不是由一个中央权威完全控制组织。这为组织带来了多项好处，例如提高效率、更快决策、更好的激励以及减轻高层管理的负担。


  在本章中，去中心化的概念将在区块链的背景下进行讨论；两者的目标相似，即没有单一的中央权威控制。去中心化的方法和去中心化的途径以及一些示例也将被介绍。此外，还将详细讨论区块链生态系统的去中心化、去中心化应用以及去中心化平台。许多令人兴奋的应用和想法源于去中心化的区块链技术，将在本章中介绍。


  ## 使用区块链实现去中心化


  去中心化是区块链技术提供的核心优势和服务。区块链按设计是提供一个无需任何中介并且可以通过共识机制选出许多不同领导者来运行的平台的完美载体。这种模式允许任何人竞争成为决策权威。这种竞争由共识机制管理，最常用的方法称为工作量证明（PoW）。


  去中心化根据要求和情况以不同的程度应用，从半去中心化到完全去中心化。从区块链的角度来看，去中心化可以被视为一种机制，它提供了一种重新设计现有应用和范式或构建新应用的方式，以便将完全控制权交给用户。


  **信息与通信技术（ICT）** 传统上基于集中式范式，其中数据库或应用服务器受中央权威（如系统管理员）的控制。随着比特币和区块链技术的出现，这一模式发生了变化，现在任何人都可以启动一个去中心化系统（并且在没有单点故障或单一可信权威的情况下运行它）的技术已经可用。它可以根据去中心化应用中使用的治理类型和模型而自主运行或需要一定的人为干预。


  即将出现的图表显示了目前存在的不同类型的系统，即集中式、分布式和去中心化。这一概念首次于 1964 年在 *Paul Baran 关于分布式通信网络* 的论文中发表，背景是通信网络。


  集中式系统是传统的（客户端-服务器）IT 系统，其中存在一个单一权威控制系统并完全负责系统上的所有操作。中央系统的所有用户都依赖于单一的服务来源。像 eBay、Google、Amazon、Apple
  的 App Store 以及大多数其他提供商这样的在线服务提供商都使用这种常见的服务交付模式。另一方面，在分布式系统中，数据和计算分布在网络中的多个节点上。有时，该术语与并行计算混淆。虽然定义上有重叠，但这两个系统的主要区别在于，在并行系统中，所有节点同时执行计算以实现结果，而在分布式系统中，计算可能不会并行进行，数据仅在多个节点上复制，用户将其视为单一的连贯系统。这两种模型都以不同的方式使用，以实现容错和速度。在此模型中，仍然存在一个中央权威控制所有节点并管理处理。这意味着系统本质上仍然是集中的。


  ![](img/62ab880d2302f959d34db648cb0bec5e_61_0.png)

  *不同类型的网络/系统*


  去中心化系统与分布式系统之间的关键区别在于，在分布式系统中仍然存在管理整个系统的中央权威，而在去中心化系统中则不存在此类权威。去中心化系统是一种网络，其中节点不依赖于单一的主节点；相反，控制分布在许多节点之间。例如，这类似于一个模型，其中组织的每个部门都有自己的数据库服务器，由他们负责管理，从而将权力从中央服务器夺走并分配给管理各自数据库的子部门。


  去中心化范式中的一项真正创新，开启了这一去中心化应用新时代的是去中心化共识，它与比特币一起引入。这使得用户能够通过共识算法在无需中央可信第三方、中介或服务提供商的情况下就某事达成一致。


  ## 去中心化的方法


  有两种方法可以实现去中心化。这些方法将在以下各节中详细讨论。


  ### 去中介化


  这可以通过一个例子来解释。想象你想把钱寄给另一个国家的朋友。你去银行，银行会按费用将你的钱汇到你选择的国家的银行。在这种情况下，银行保留一个中央数据库进行更新，确认你已汇出资金。有了区块链技术，就有可能直接将这笔钱发送给你的朋友，而无需银行。你只需要区块链上朋友的地址。这样，中介不再需要，去中心化是通过去中介化实现的。然而，由于金融部门有严格的监管和合规要求，去中介化在金融部门实现去中心化的实用性值得商榷。尽管如此，这种模式不仅可用于金融，还可用于许多其他不同行业。


  ### 通过竞争


  在此方法中，一组服务提供商相互竞争，以便被系统选为提供服务的提供商。这种范式并不能实现完全去中心化，但可以在一定程度上确保中介或服务提供商不会垄断服务。在区块链技术的背景下，可以设想一个系统，其中智能合约可以根据声誉、之前的评分、评论和服务质量从大量提供商中选择外部数据提供商。这不会导致完全去中心化，但它允许智能合约基于上述标准做出自由选择。这样，就在服务提供商之间培育了竞争环境，他们相互竞争以成为首选的数据提供商。


  在下面的图表中，显示了不同程度的去中心化。左侧是传统的集中式系统控制的方法；右侧实现了完全去中介化；中间显示了竞争性的中介或服务提供商。中间，中介或服务提供商是基于声誉或投票选择的，从而实现了部分去中心化。





  ![](img/62ab880d2302f959d34db648cb0bec5e_63_0.png)


  去中心化程度


  尽管去中心化有许多好处——包括但不限于透明度、效率、成本节约、可信赖生态系统的建立，以及在某些情况下的隐私性和匿名性——但也需要彻底审视其中的一些挑战，例如安全要求、软件漏洞和人为错误。例如，在比特币或以太坊等去中心化系统中，安全性通常由私钥提供，那么如何确保与这些私钥相关联的智能资产不会因为人为失误导致私钥丢失，或者因为智能合约代码中的漏洞导致去中心化应用程序易受攻击而变得毫无用处？在我们踏上利用区块链和去中心化应用程序实现万物去中心化的旅程之前，重要的是要明白，并非所有事物都需要（或能够）被去中心化。


  ## 去中心化的路径


  尽管在比特币或区块链出现之前，就已经存在一些可以被归类为具有一定程度去中心化的系统，例如 BitTorrent 或 Gnutella 文件共享网络，但随着区块链技术的出现，为了实现去中心化，人们正在利用这项新技术采取许多举措。通常，比特币区块链是许多人的首选，因为它已被证明是最具韧性和安全性的区块链，市值接近
  120 亿美元。另一种方法则是使用其他区块链，例如以太坊，目前它是许多开发者构建去中心化应用程序的首选工具。


  ## 如何实现去中心化


  *Arvind Narayanan* 等人提出了一个框架，可用于在区块链技术的背景下评估各类事物的去中心化需求。该框架基本提出了四个问题，一旦回答了这些问题，就能清晰地了解如何对系统进行去中心化。这些问题列举如下：


  - 1. 去中心化的对象是什么？

  - 2. 需要何种程度的去中心化？

  - 3. 使用哪种区块链？

  - 4. 使用何种安全机制？


  第一个问题简单询问的是要对哪个系统进行去中心化。这可以是任何系统，例如身份系统或交易系统。第二个问题可以通过参考前文讨论的去中心化程度标尺，通过指明所需的去中心化级别来回答。它可以是完全的去中介化，也可以是部分去中介化。第三个问题非常直接，开发者可以选择哪种区块链适合特定的应用程序。它可能是比特币区块链、以太坊区块链，或者任何其他被认为适合特定应用程序的区块链。最后，还需要回答一个关于安全机制的关键问题，即如何保证去中心化系统的安全性。例如，可以是原子性（Atomicity），即交易要么完整执行，要么完全不执行。换句话说，就是要么全做，要么不做。这确保了系统的完整性。其他机制还可以包括声誉机制，允许在系统中存在不同级别的信任。


  ### 示例


  在本节中，提供了一个上述框架应用实例。


  在第一个示例中，选定了一个货币转账系统，该系统要求实现去中心化。在这种情况下，可以通过回答前面提到的四个问题来评估去中心化需求。答案如下所示：


  - 1. **答案 1：** 货币转账系统。

  - 2. **答案 2：** 去中介化。

  - 3. **答案 3：** 比特币。

  - 4. **答案 4：** 原子性。


  通过回答这四个问题，可以展示支付系统如何实现去中心化。基于上述答案，可以指出，货币转账系统可以通过移除中介来实现去中心化，并将在比特币区块链上实现，其安全保障通过原子性提供。


  同样，该框架可以用于任何需要评估去中心化的其他系统。通过回答这四个简单的问题，采取何种方法来实现系统的去中心化就变得非常清晰。


  ## 区块链与完全生态系统去中心化


  为了实现完全去中心化，区块链周围的环境也必须去中心化。区块链本身是一个运行在传统系统之上的分布式账本。这些要素包括存储、通信和计算。还有其他因素，例如身份和财富，传统上基于中心化范式，为了构建一个完全去中心化的生态系统，也有必要对这些方面进行去中心化。


  ## 存储


  数据可以直接存储在区块链中，这样确实实现了去中心化，但这种方法的一个主要缺点是，区块链在设计上不适合存储大量数据。它可以存储简单的交易和一些任意数据，但显然不适合存储图像或大数据块，就像传统数据库系统中的情况那样。更好的替代方案是使用**分布式哈希表（DHTs）**。DHT
  最初用于点对点文件共享软件，如 BitTorrent、Napster、Kazaa 和 Gnutella。CAN、Chord、Pastry 和 Tapestry
  项目使 DHT 研究变得流行。BitTorrent 被证明是最具可扩展性和速度的网络，但问题在于没有激励用户永久保留文件。用户通常不会永久保存文件，如果拥有某人所需数据的节点离开了网络，除了让所需节点重新加入网络以使文件再次可用之外，没有办法检索到数据。这里有两个主要要求：高可用性和链路稳定性，这意味着数据在需要时应可用，并且网络链路也应始终可访问。*Juan
  Benet* 开发的**星际文件系统（IPFS）**具备这两种属性，其愿景是通过替换 HTTP 协议来提供一个去中心化的万维网。IPFS 使用 Kademlia
  DHT 和默克尔**DAG（有向无环图）**分别提供存储和搜索功能。


  ## 去中心化


  激励机制基于一种名为 Filecoin 的协议，该协议使用 BitSwap 机制向存储数据的节点支付激励。BitSwap 机制允许节点在一对一关系中维护一个发送字节或接收字节的简单账本。此外，IPFS
  中还使用了基于 Git 的版本控制机制，以提供数据结构化并对数据的版本进行控制。


  还有其他替代方案，如以太坊蜂群（Ethereum swarm）、stori 和 maidsafe。以太坊拥有自己的去中心化和分布式生态系统，使用 Swarm 进行存储，使用
  Whisper 协议进行通信。Maidsafe 旨在提供一个去中心化的万维网。书中稍后会更详细地讨论所有这些项目。


  BigChainDB 是另一个存储层去中心化项目，旨在提供可扩展、快速且线性可扩展的去中心化数据库，而非传统的文件系统。BigChainDB 补充了以太坊和 IPFS
  等去中心化处理平台和文件系统。


  ## 通信


  人们普遍认为互联网（区块链中的通信层）是去中心化的。这在某种程度上是正确的，因为互联网最初的愿景就是开发一个去中心化系统。电子邮件和在线存储等服务现在都基于服务提供者掌控、用户信任其在需要时提供访问服务的范式。这种模式基于对中央权威（服务提供者）的信任，用户无法控制自己的数据；甚至密码也是存储在受信任的第三方系统中。有必要以这样的方式将控制权交给个人用户，即保证对其数据的访问权，且这种访问权不依赖于单一的第三方。互联网（通信层）的访问基于充当互联网用户中央枢纽的互联网服务提供商（ISPs）。如果由于政治或其他原因
  ISP 停止服务，那么在该模式下将无法进行任何通信。一个替代方案是使用网格网络。尽管与互联网相比，网格网络在功能上有限，但它们仍然提供去中心化的替代方案，节点可以在没有
  ISP 等中央枢纽的情况下直接相互通信。


  ![](img/62ab880d2302f959d34db648cb0bec5e_66_0.png)


  Meshnet 的一个例子是 Firechat ([http://www.opengarden.com/firechat.html](http://www.opengarden.com/firechat.html))，它允许
  iPhone 用户在无需互联网的情况下，以点对点的方式直接相互通信。






  ## 去中心化


  现在想象一个网络，让用户能够掌控自己的通信；没有任何人可以出于政治或审查原因将其关闭。这可能是区块链生态系统中去中心化通信网络的下一步。必须指出，这种模式可能仅在互联网受到政府审查和控制的司法管辖区才需要。


  如前所述，互联网最初的设想是构建一个去中心化网络；然而，多年来，随着 Google、Amazon 和 eBay 等大规模服务提供商的出现，控制权正逐渐向大型玩家转移。例如，电子邮件在核心上是一个去中心化系统；任何人只需付出最小的努力即可运行电子邮件服务器并开始收发电子邮件，但已经有更好的替代方案提供给终端用户的托管服务，因此自然倾向于选择中心化服务，因为它更方便且免费。然而，免费服务是以宝贵的个人数据为代价提供的，而许多用户并不了解这一事实。这是一个例子，说明互联网如何走向中心化。区块链再次将去中心化的愿景带给了世界，现在正在
  concerted efforts 努力利用这项技术并获得其所能提供的益处。


  ## 计算


  计算或处理的去中心化是通过以太坊等区块链技术实现的，其中嵌入业务逻辑的智能合约可以在网络上运行。其他区块链技术也提供类似的处理层平台，业务逻辑可以在网络上以去中心化的方式运行。


  下图显示了去中心化生态系统概览，其中在底层，互联网或 Meshnets 提供去中心化通信层，然后存储层使用 IPFS 和 BigChainDB 等技术来实现去中心化，最后，你可以看到区块链，它充当去中心化处理层。区块链在有限程度上也可以提供存储层，但这会严重阻碍系统的速度和容量；因此，其他解决方案如
  IPFS 和 BigChainDB 更适合以去中心化的方式存储大量数据。在顶部，显示了身份和财富层。互联网上的身份是一个非常大的话题，诸如 bitAuth 和
  OpenID 等系统已提供不同程度去中心化和安全假设的身份验证和识别服务。


  区块链能够为各种问题提供解决方案。一个与身份相关的概念称为 *Zooko’s Triangle*，要求网络协议中的命名系统对人类来说是安全、去中心化且有意义的。据推测，一个系统同时只能具备其中两个属性，但随着区块链的出现，以
  Namecoin 的形式，这一问题得到了解决。然而，这并不是万灵药，并带来了自身挑战，例如依赖用户安全存储和维护私钥。这引发了关于去中心化适用性的其他一般性问题。也许去中心化并不适用于每个场景。声誉良好的中心化系统在许多情况下往往工作得更好。


  ![](img/62ab880d2302f959d34db648cb0bec5e_68_0.png)


  目前正在进行许多项目，正在开发更广泛的分布式区块链系统的解决方案。


  随着去中心化范式的出现，不同的术语和流行词现在出现在媒体和学术文献中。随着区块链技术的出现，现在可以构建传统物理组织的软件版本。在去中心化的背景下，值得讨论的
  upcoming concepts。


