  ,\n        \"reqSigs\": 1,\n        \"type\": \"pubkeyhash\",\n        \"addresses\"\
  : [\n          \"mgEKnxV3qbYtDKEKTvo1VpgJ63Au619q2\"\n        ]\n      }\n    }\n\
  \  ]\n}\n```\n\n示例解码交易，显示了前面描述的各个字段\n\n## 脚本语言\n\n比特币使用一种简单的基于栈的语言称为 *script* 来描述比特币如何被花费和转移。它不是图灵完备的，并且没有循环，以避免比特币网络上长时间运行/挂起脚本的不良影响。这种脚本语言基于类似\
  \ Forth 的语法，使用逆波兰表示法，其中每个操作数都跟随其操作符。它使用 **后进先出 (LIFO)** 栈从左到右进行求值。\n\n脚本使用各种操作码或指令来定义其操作。操作码也称为单词、命令或函数。比特币节点的早期版本有一些由于设计缺陷而不再使用的操作码。\n\
  \n脚本操作码的各种类别为常量、流程控制、栈、按位逻辑、拼接、算术、密码学和锁定时间。\n\n交易脚本通过组合 `ScriptSig` 和 `ScriptPubKey`\
  \ 进行求值。`ScriptSig` 是解锁脚本，而 `ScriptPubKey` 是锁定脚本。这就是交易如何被花费的评估方式；首先解锁，然后花费。`ScriptSig`\
  \ 由希望解锁交易的<|message|> 用户提供。`ScriptPubkey` 是交易输出的一部分，并指定为了花费输出需要满足的条件。换句话说，输出由 `ScriptPubKey`（锁定脚本）锁定，其中包含条件，满足后将解锁输出，然后可以赎回币。\n\
  \n## 常用操作码\n\n所有操作码都声明在比特币参考客户端源代码中的 script.h 文件中。可以从以下链接访问 https://github.com/bitcoin/bitcoin/blob/master/src/script/script.h\
  \ ，在以下注释下：\n\n```\n/** Script opcodes */\n```\n\nScriptPubKey 和 ScriptSig 参数被连接在一起并执行。本节稍后将跟随一个示例，其中对此进行了更详细的解释。\n\
  \n- **Pay to Script Hash (P2SH)**：P2SH 用于将交易发送到脚本哈希（即以 3 开头的地址），并在 BIP16 中标准化。除了传递脚本外，赎回脚本也会被评估并且必须有效。模板如下所示：\n\
  \  \n- **MultiSig (Pay to MultiSig)**：M of n 多重签名交易脚本是一种复杂的脚本类型，其中可以构造一个需要多个签名才能有效以便赎回交易的脚本。可以使用此脚本构建各种复杂交易，例如托管和存款。模板如下所示：\n\
  \  \n- **Pay to Pubkey**：此脚本是一种非常简单的脚本，通常用于 coinbase 交易。它现在已过时，并在比特币的旧版本中使用。在这种情况下，公钥存储在脚本中，并且解锁脚本需要使用私钥对交易进行签名。\n\
  \  \n- **Null data/OP_RETURN**：此脚本用于以费用为代价在区块链上存储任意数据。消息限制为 40 字节。此脚本的输出不可赎回，因为\
  \ OP_RETURN 在任何情况下都会使验证失败。在这种情况下不需要 ScriptSig。\n\n```\nScriptPubKey: OP_HASH160\
  \ <redeemScriptHash> OP_EQUAL\n```\n\n```\nScriptSig: [<sig>...<sign>] <redeemScript>\n\
  ```\n\n```\nScriptPubKey: <m> <pubKey> [<pubKey>...] <n> OP_CHECKMULTISIG\n```\n\
  \n```\nScriptSig: 0 [<sig>...<sign>]\n```\n\n原始多重签名已过时，多重签名通常是前面提到的 P2SH 赎回脚本的一部分。\n\
  \n模板如下所示：\n\n```\n<PubKey> OP_CHECKSIG\n```\n\n模板非常简单，如下所示：\n\n```\nOP_RETURN <data>\n\
  ```\n\n\n\n\nP2PKH 脚本执行过程如下所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_149_0.png)\n\
  \nP2PKH 脚本执行\n\n所有交易在通过比特币网络传输之前，最终都会被编码为十六进制格式。下面是一个示例交易，以十六进制显示，该交易是使用 bitcoin-cli\
  \ 在比特币测试网上通过以下命令检索得到的：\n\n```\ndrequinox@drequinox-OP7010:~$ bitcoin-cli --testnet\
  \ getrawtransaction \"08af7960ca9255c67686296fb65452ed3f96f18831c9a3d8ea552e4ccee5c4af\"\
  \n0100000001b008bb28e3fde10a2161a9ae9029ebcfe6156e57b63e04f76048a9a06032553e0\n\
  10000006b483045022100cfb31edabc62c82b41d12f651d2e3e013ee1a7ee2bb4526f3dda64\n0e6d8d224502207d8d1d8e41350b9cdf36f389f942ab68c12f113fe99014f5d6df661040787\n\
  7d2011037b82d0078993f6943e7fff6e82e82da600f34edc8bca136331a9901c8bb60b0dfe\nfffffff028085b50d000000001976a91407e764a4a61343068fa8d4940a7997e6e758ac6ef88a\n\
  c95bddc1c000000001976a914dad770cccb1026ebf87acacfe35f2d6f2d336faa88ac33cb0e00\n\
  ```\n\n## Coinbase 交易\n\nCoinbase 交易（或称生成交易）总是由矿工创建，并且是区块中的第一笔交易。它用于创造新的货币。它包含一个特殊字段，也称为\
  \ coinbase，该字段作为 Coinbase 交易的输入。这笔交易还允许最多 100 字节的任意数据，这些数据可用于存储任意内容。在创世区块中，该字段包含了取自《泰晤士报》的最著名评论：\n\
  \n> “泰晤士报 2009年1月3日 财政大臣濒临对银行进行第二轮救助”\n\n这一信息证明了创世区块的开采时间不早于 2009 年 1 月 3 日。\n\n\
  ## 什么是 UTXO？\n\n未花费交易输出（Unspent Transaction Output，UTXO）是一种未花费的交易输出，可以作为新交易的输入来使用。与比特币交易相关的其他概念如下所述。\n\
  \n## 交易手续费\n\n交易手续费由矿工收取。手续费的多少取决于交易的大小。交易手续费的计算方式是用输入总额减去输出总额。手续费作为对矿工的激励，鼓励他们将用户的交易纳入其正在创建的区块中。所有交易最终都会进入内存池，矿工根据优先级从中挑选交易，并将其包含在拟议的区块中。优先级的计算方法将在本章后面介绍；然而，从交易手续费的角度来看，手续费较高的交易会被矿工更早地处理。根据不同的行为类型（例如发送交易、纳入区块以及节点中继），计算手续费的规则也有所不同。手续费不是由比特币协议固定下来的，也不是强制性的；即使是没有手续费的交易，最终也会被处理，但可能需要非常长的时间。\n\
  \n## 合约\n\n正如比特币核心开发者指南中所定义的那样，合约本质上是使用比特币系统来强制执行金融协议的交易。这是一个简单的定义，但其影响深远，因为它允许用户设计可用于许多真实场景的复杂合约。合约使得开发完全去中心化、独立且风险降低的平台成为可能。使用比特币脚本语言可以构建各种合约，例如托管、仲裁和微支付通道。当前脚本的实现非常有限，但仍然可以开发各种类型的合约。例如，只有在多方签署交易时才释放资金，或者只有在经过一定时间后才释放资金。这两种场景都可以通过多重签名（multiSig）和交易锁定时间选项来实现。\n\
  \n## 交易可延展性\n\n比特币中的交易可延展性是由比特币实现中的一个漏洞引起的。由于这个漏洞，攻击者有可能更改交易的交易 ID，从而导致某个交易看起来似乎尚未执行的场景。这可能会引发双重存款或双重提现的情况。换句话说，这个漏洞允许在比特币交易被确认之前更改其唯一\
  \ ID。\n\n如果在确认之前更改了 ID，那么这笔交易看起来就像完全没有发生过一样，这可能会引发双重存款或提现攻击。\n\n## 交易池\n\n这些池也称作*内存池*，基本上是由节点在本地内存中创建的，用于维护尚未在区块中得到确认的交易的临时列表。\n\
  交易在通过验证后，会根据其优先级被包含到区块中。\n\n## 交易验证\n\n此验证过程由比特币节点执行。比特币开发者指南中描述了以下内容：\n\n- 1. 检查语法并确保交易语法正确。\n\
  - 2. 验证输入和输出不为空。\n- 3. 检查字节大小是否小于最大区块大小，目前为 1 MB。\n- 4. 输出值必须在允许的货币范围内（0 到 2100\
  \ 万 BTC）。\n- 5. 所有输入都必须有指定的前序输出，但 coinbase 交易除外，该类交易不应被中继。\n- 6. 验证 `nLockTime`\
  \ 不得超过 31 位。交易若要有效，其字节数不应少于 100 字节。此外，标准签名中的签名操作数应小于或等于 2 个。\n- 7. 拒绝*非标准*交易；例如，`ScriptSig`\
  \ 只允许向堆栈推送数字，`ScriptPubkey` 未通过 `isStandard()` 检查。\n- 8. 如果池中或主分支的区块中已经存在匹配的交易，则拒绝该交易。\n\
  - 9. 如果每个输入所引用的输出已经存在于池中的任何其他交易中，则该交易将被拒绝。\n- 10. 对于每个输入，必须存在一个被引用的输出交易。系统会在主分支和交易池中进行搜索，以确定是否有任何输入缺少输出交易；如果缺少，则该交易将被视为孤立交易。如果池中还没有与之匹配的交易，它将添加到孤立交易池中。\n\
  - 11. 对于每个输入，如果被引用的输出交易是 coinbase 交易，则它必须至少获得 100 次确认；否则，该交易将被拒绝。\n- 12. 对于每个输入，如果被引用的输出不存在或已被花费，则该交易将被拒绝。\n\
  - 13. 使用被引用的输出交易来获取输入值，验证每个输入值以及总和是否在允许的 0 到 2100 万 BTC 范围内。\n- 14. 如果输入值之和小于输出值之和，则拒绝该交易。\n\
  - 15. 如果交易手续费过低，无法进入空区块，则拒绝该交易。\n\n## 区块链\n\n区块链是一个公开的账本，它记录了比特币网络上所有交易的带时间戳、有序且不可变的列表。每个区块在链中通过哈希来标识，并通过引用前一个区块的哈希连接到前一个区块。\n\
  \n在下面的区块结构中，首先描述了区块头，然后是一个详细图示，帮助深入了解区块链结构。\n\n## 区块的结构\n\n| 字节 | 名称 | 描述 |\n|---|---|---|\n\
  | 80 | 区块头 | 包含下一节所述的区块头中的字段。 |\n| 可变 | 交易计数器 | 该字段包含区块中的交易总数，包括 coinbase 交易。 |\n\
  | 可变 | 交易 | 区块中的所有交易。 |\n\n## 区块头的结构\n\n| 字节 | 名称 | 描述 |\n|---|---|---|\n| 4 | 版本\
  \ | 区块版本号，决定应遵循的区块验证规则。 |\n| 32 | 前一个区块头哈希 | 这是前一个区块头的双重 SHA256 哈希。 |\n| 32 | 默克尔根哈希\
  \ | 这是区块中所有交易的默克尔树的双重 SHA256 哈希。 |\n\n\n\n\n\n| 4 | 时间戳 | 该字段包含区块的大致创建时间，采用 Unix\
  \ 纪元时间格式。更精确地说，这是矿工开始对区块头进行哈希运算的时间（从矿工的角度来看）。 |\n| 4 | 难度目标 | 这是区块的难度目标。 |\n| 4\
  \ | 随机数 | 这是一个任意数字，矿工会反复更改它以产生满足难度目标阈值的哈希值。 |\n\n![](img/62ab880d2302f959d34db648cb0bec5e_153_0.png)\n\
  \n区块链、区块、区块头、交易和脚本的可视化\n\n如前图所示，区块链是由区块组成的链，每个区块通过引用前一个区块头的哈希值链接到其前一个区块。这种链接确保除非修改了记录该交易的区块以及其后的所有区块，否则无法修改任何交易。第一个区块不链接到任何前一个区块，被称为创世区块。\n\
  \n由于比特币的分布式特性，网络分叉可能自然发生。在两个节点同时宣布一个有效区块的情况下，可能出现两个具有不同交易的区块链的情况。这是不希望出现的情况，但比特币网络只能通过接受最长的链来解决。在这种情况下，较小的链将被视为孤块。如果对手能够控制网络算力（计算能力）的\
  \ 51%，那么他们就可以强加自己的交易历史版本。\n\n引入比特币协议的更改也可能导致区块链分叉。在 *软分叉* 的情况下，只有以前有效的区块不再可接受，从而使软分叉向后兼容。在软分叉的情况下，只有矿工需要升级到新的客户端软件才能使用新的协议规则。计划中的升级不一定会创建分叉，因为所有用户都应该已经更新。另一方面，硬分叉使以前有效的区块无效，并要求所有用户升级。新的交易类型有时会作为软分叉添加，任何诸如区块结构更改或主要协议更改之类的更改都会导致硬分叉。\n\
  \n截至 2017 年 2 月 4 日，比特币区块链的当前大小约为 101 GB。下图显示了区块链大小随时间变化的增加情况：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_155_0.png)\n\
  \n截至 06/02/2017 的区块链当前大小\n\n新区块大约每 10 分钟添加到区块链一次，并且网络难度每 2016 个区块动态调整一次，以保持新区块稳定地添加到网络中。\n\
  \n网络难度使用以下公式计算：\n\n*Target = Previous target * Time/2016 * 10 minutes*\n\n难度和目标可以互换，表示相同的意思。Previous\
  \ target 代表旧的目标值，time 是生成前 2016 个区块所花费的时间。网络难度基本上是指矿工找到新区块有多难，即哈希难题现在有多难。\n\n在下一节中讨论了挖矿，这将解释哈希难题是如何被解决的。\n\
  \n## Mining\n\n挖矿是一种资源密集型过程，通过该过程将新区块添加到区块链中。区块包含通过挖矿过程由挖矿节点验证并添加到区块链中的交易。该过程是资源密集型的，以确保矿工在区块被接受之前已花费了所需的资源。矿工通过花费所需的计算资源来铸造新币。这也在增加更多虚拟货币到比特币生态系统的同时保护系统免受欺诈和双重支付攻击。\n\
  \n大约每 10 分钟就会创建一个新区块（挖出）。如果矿工创建了新区块，他们将被奖励新币，并因将交易包含在其区块中而获得交易费。新区块以大致固定的速率创建。此外，新比特币的创建速率每\
  \ 210,000 个区块减少 50%，大约每 4 年一次。当比特币最初推出时，区块奖励为 50 个比特币；然后在 2012 年，这减少到 25 个比特币。2016\
  \ 年 7 月，这进一步减少到 12.5 个币，下一次减少预计在 2020 年 7 月 4 日。这将使币奖励进一步降至大约六个币。\n\n大约每天产生 144\
  \ 个区块，即 1,728 个比特币。实际币数每天可能有所不同；然而，区块数量仍保持每天 144 个。比特币供应也是有限的，到 2140 年，几乎 2100 万个比特币将被最终创建，此后无法再创建新的比特币。然而，比特币矿工仍然可以通过收取交易费从生态系统中获利。\n\
  \n## Task of miners\n\n一旦节点连接到比特币网络，比特币矿工就会执行以下几个任务。\n\n### Synching up with the\
  \ network\n\n一旦新节点加入比特币网络，它就会通过向其他节点请求历史区块来下载区块链。这里在比特币矿工的上下文中提到这一点；然而，这不一定只是矿工的任务。\n\
  \n- **Transaction validation:** 在网络上广播的交易由全节点通过验证和验证签名和输出来验证。\n- **Block validation:**\
  \ 矿工和全节点可以通过根据某些规则对其进行评估来开始验证他们收到的区块。这包括验证区块中的每个交易以及验证随机数值。\n- **Create a new block:**\
  \ 矿工通过在验证后将网络上广播的交易组合起来来提出新区块。\n- **Perform Proof of Work:** 这项任务是挖矿过程的核心，在此矿工通过解决计算难题找到有效区块。区块头包含一个\
  \ 32 位随机数字字段，矿工需要反复更改随机数，直到生成的哈希值小于预定的目标。\n- **Fetch reward:** 一旦节点解决了哈希难题，它会立即广播结果，其他节点会验证并接受该区块。有一个很小的几率新铸造的区块由于与几乎同时找到的另一个区块冲突而不会被其他矿工接受，但一旦被接受，矿工就会获得\
  \ 12.5 个比特币的奖励（截至 2016 年）以及任何相关的交易费。\n\n## Proof of Work\n\n这是证明已花费足够的计算资源来构建有效区块的证明。**Proof\
  \ of Work (PoW)** 基于这样一个想法，即每次随机选择一个节点来创建新区块。在此模型中，节点相互竞争以按其计算能力比例被选中。以下公式总结了比特币中的工作量证明要求：\n\
  \n$$H(N \\parallel P\\_hash \\parallel Tx \\parallel Tx \\parallel \\ldots Tx) <\
  \ Target$$\n\n其中 N 是随机数，$P\\_hash$ 是前一个区块的哈希值，$Tx$ 表示区块中的交易，$Target$ 是目标网络难度值。这意味着前面提到的连接字段的哈希值应小于目标哈希值。找到该随机数的唯一方法是暴力方法。一旦矿工满足了某种零的模式，区块就会立即广播并被其他矿工接受。\n\
  \n### The mining algorithm\n\n挖矿算法包括以下步骤。\n\n- 从比特币网络检索前一个区块哈希。\n- 将网络上广播的潜在交易集组装成一个区块。\n\
  - 使用 SHA256 算法计算区块头与随机数和前一个哈希的双重哈希。\n- 如果生成的哈希值低于当前难度级别（目标），则停止该过程。\n- 如果生成的哈希值高于当前难度级别（目标），则通过递增随机数重复该过程。随着比特币网络的哈希率增加，32\
  \ 位随机数的总量耗尽得太快。为了解决这个问题，实施了 *extra nonce* 解决方案，其中 coinbase 交易被用作额外随机数的来源，为矿工提供更大的随机数搜索范围。\n\
  \n\n\n\n\n- 随着时间的推移，挖矿难度不断增加，而过去可以用单台 CPU 笔记本电脑挖出的比特币，现在需要专门的矿场来解决哈希难题。当前难度等级可通过比特币命令行界面使用以下命令查询：\n\
  \n```\n$ bitcoin-cli getdifficulty\n258522748404.5154\n```\n\n![](img/62ab880d2302f959d34db648cb0bec5e_159_0.png)\n\
  \n随时间变化的挖矿难度\n\ngetdifficulty 命令返回的值。\n\n## 哈希率\n\n哈希率基本上代表每秒计算哈希的速度。在比特币早期，使用 CPU\
  \ 时哈希率相当小，但随着专用矿池和 ASIC 的出现，近几年哈希率呈指数级增长。这导致了难度的增加。以下哈希率图表显示了哈希率随时间的增长，目前以艾哈希为单位进行衡量。这意味着在\
  \ 1 秒内，比特币网络矿工计算的哈希数超过 1 000 000 000 000 000 000 个/秒。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_160_0.png)\n\
  \n## 挖矿系统\n\n随着时间的推移，比特币矿工使用过各种方法来挖矿。由于挖矿的核心原理基于双重 SHA256 算法，随着时间的推移，矿工开发出越来越快的哈希计算系统。以下是比特币所使用的不同挖矿类型的回顾，以及它们如何随时间演变。\n\
  \n### CPU\n\nCPU 挖矿是原始比特币客户端中可用的第一种挖矿类型。用户甚至可以用笔记本电脑或台式电脑来挖比特币。CPU 挖矿已不再盈利，现在使用更先进的挖矿方法，如基于\
  \ ASIC 的挖矿。\n\n### GPU\n\n由于比特币网络难度增加以及人们普遍倾向于寻找更快的挖矿方法，矿工开始使用 PC 中可用的 GPU 或显卡进行挖矿。GPU\
  \ 支持更快且并行化的计算，通常使用 OpenCL 语言编程。这比 CPU 来说是一种更快的选择。用户还使用超频等技术来最大化 GPU 性能。此外，使用多张显卡的可能性也增加了显卡用于比特币挖矿的普及度。然而，GPU\
  \ 挖矿存在一些限制，例如过热以及需要专用主板和额外硬件来容纳多张显卡。\n\n### FPGA\n\n即使 GPU 挖矿也没有持续太久，很快矿工就找到了另一种使用\
  \ FPGA 进行挖矿的方法。现场可编程门阵列（FPGA）基本上是一种可编程的集成电路，用于执行特定操作。FPGA 通常使用硬件描述语言（HDL）编程，例如 Verilog\
  \ 和 VHDL。双重 SHA256 迅速成为 FPGA 程序员的热门编程任务，并出现了多个开源项目。FPGA 相比 GPU 提供了更好的性能；然而，可访问性、编程难度以及需要专业知识来编程和配置\
  \ FPGA 等问题导致 FPGA 在比特币挖矿中的时代很短暂。此外，ASIC 的到来导致基于 FPGA 的挖矿系统迅速被淘汰。X6500 矿机、Ztex 和\
  \ Icarus 等挖矿硬件是在 FPGA 挖矿盈利期间开发的。Xilinx 和 Altera 等各种 FPGA 制造商生产可用于编程挖矿算法的 FPGA 硬件和开发板。\n\
  \n### ASIC\n\n专用集成电路（ASIC）旨在执行 SHA-256 操作。这些专用芯片由各种制造商销售，并提供非常高的哈希率。这在一段时间内有效，但由于挖矿难度水平快速增加，单台\
  \ ASIC 已不再盈利。\n\n目前，挖矿已超出个人能力范围，现在使用数千台 ASIC 并行运行的专业矿场向用户提供挖矿合约，代为进行挖矿。没有技术限制，因此单个用户无法并行运行数千台\
  \ ASIC，但这需要专用数据中心和硬件，对于个人而言成本可能变得难以承受。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_161_0.png)\n\
  \n四种挖矿类型（CPU、GPU、FPGA 和 ASIC）\n\n## 挖矿池\n\n当一组矿工共同合作挖出一个区块时，就形成了挖矿池。如果区块成功挖出，矿池管理器会收到\
  \ coinbase 交易，然后负责将奖励分配给为挖出该区块投入资源的矿工群体。这与单人挖矿相比更有利可图，在单人挖矿中只有一个矿工试图解决部分哈希反演函数（哈希难题），因为在挖矿池中，无论他们（更具体地说，他们的单个节点）是否解决了难题，奖励都会支付给矿池的每个成员。\n\
  \n矿池管理器可以采用多种模式向矿工付款，例如按份额付费模式和按比例模式。在按份额付费模式中，矿池管理器向参与挖矿的所有矿工支付固定费用，而在按比例模式中，份额是根据为解决哈希难题所花费的计算资源量计算的。\n\
  \n现在存在许多商业矿池，并通过云和易于使用的网页界面提供挖矿服务合约。最常用的有 AntPool、F2Pool 和 BW.COM。以下图片显示了所有主要挖矿池的算力比较：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_162_0.png)\n\n截至 2017 年 06 月 02 日的挖矿池及其算力（哈希率），取自\
  \ https://blockchain.info/pools\n\n挖矿中心化是一个主要问题，如果一个矿池控制了超过 51% 的网络，即产生超过比特币网络 51%\
  \ 的算力，就会发生这种情况。如介绍部分所述讨论的，51% 攻击可能导致双花攻击，并可能影响共识，事实上可在比特币网络上强加另一个版本的交易历史。\n\n这在比特币历史上发生过一次，当时大型矿池\
  \ GHash.IO 管理获取了超过 51% 的网络容量。学术界提出了理论解决方案，例如两阶段工作量证明，以遏制大型矿池。该方案引入了第二个密码难题，导致矿池披露其私钥或提供其矿池相当一部分的算力，从而降低矿池的整体算力。\n\
  \n各种类型的硬件可商用于挖矿目的。目前最盈利的是 ASIC 挖矿，多个供应商提供专用硬件。除非花费大量资金和能源建立自己的矿机甚至矿场，否则单人挖矿现在并不太盈利。以当前难度系数（2016\
  \ 年 10 月）为例，如果用户管理产生 12 TH/s 的算力，他们每天可望赚取 0.01366887 BTC（约 8 美元），这与产生 12 TH 所需的设备投资相比非常低。包括电费等运行成本，这并不太盈利。\n\
  \n## 比特币网络\n\n比特币网络是一个点对点网络，节点在其中交换交易和区块。网络上有不同类型的节点。主要分为两种节点：全节点和 SPV 节点。全节点顾名思义，是比特币核心客户端的实现，执行钱包、矿工、完整区块链存储和网络路由功能。然而，并非必须执行所有这些功能。SPV\
  \ 节点或轻量级客户端仅执行钱包和网络路由功能。比特币协议的最新版本是 70014，并随比特币核心客户端 0.13.0 引入。\n\n一些节点更喜欢仅作为完整区块链节点存在，包含完整的区块链并执行网络路由功能，但不执行挖矿或存储私钥（钱包功能）。另一种类型是单人矿工节点，可执行挖矿、存储完整区块链并充当比特币网络路由节点。\n\
  \n\n\n\n\n有一些非标准但使用广泛的节点被称为矿池协议服务器。这些节点使用替代协议，例如 Stratum 协议。一些节点仅执行挖矿功能，被称为矿工节点。仅计算哈希的节点使用\
  \ Stratum 协议将解决方案提交给矿池。可以运行一个 SPV 客户端，该客户端运行钱包和网络路由功能而无需区块链。\n\n互联网上大多数协议都是基于行的，这意味着每一行都以回车和换行符\
  \ `\\r\\n` 字符分隔。Stratum 也是一个基于行的协议，它使用纯 TCP 套接字和人类可读的 JSON-RPC 来操作并在节点之间通信。\n\n\
  比特币网络由其不同的魔数标识。列表如下所示：\n\n| Network | Magic value | Hex |\n|---|---|---|\n| main\
  \ | 0xD9B4BEF9 | F9 BE B4 D9 |\n| testnet3 | 0x0709110B | 0B 11 09 07 |\n\n魔数用于指示消息来源网络。\n\
  \n一个全节点执行四个功能：钱包、矿工、区块链和网络路由节点。\n\n当比特币核心节点启动时，首先，它会启动所有对等节点的发现。这是通过查询硬编码在比特币核心客户端中的\
  \ DNS 种子来实现的，并由比特币社区成员维护。此查找返回一些 DNS A 记录。比特币协议默认在主网络上使用 TCP 端口 8333，在 testnet 上使用\
  \ TCP 18333。\n\n```\nvSeeds.push_back(CDNSSeedData(\"bitcoin.sipa.be\", \"seed.bitcoin.sipa.be\"\
  , true)); // Pieter Wuille\nvSeeds.push_back(CDNSSeedData(\"bluematt.me\", \"dnsseed.bluematt.me\"\
  )); // Matt Corallo\nvSeeds.push_back(CDNSSeedData(\"dashjr.org\", \"dnsseed.bitcoin.dashjr.org\"\
  )); // Luke Dashjr\nvSeeds.push_back(CDNSSeedData(\"bitcoinstats.com\", \"seed.bitcoinstats.com\"\
  )); // Christian Decker\nvSeeds.push_back(CDNSSeedData(\"xf2.org\", \"bitseed.xf2.org\"\
  )); // Jeff Garzik\nvSeeds.push_back(CDNSSeedData(\"bitcoin.jonasschnelli.ch\",\
  \ \"seed.bitcoin.jonasschnelli.ch\", true)); // Jonas Schnelli\n```\n\n首先，客户端发送一个协议消息\
  \ Version，其中包含各种字段，例如版本、服务、时间戳、网络地址、nonce 和一些其他字段。远程节点用自己的 version 消息进行响应，然后双方节点之间进行\
  \ verack 消息交换，表明连接已建立。\n\n之后，Getaddr 和 addr 消息被交换以找到客户端不知道的对等节点。与此同时，任一节点都可以发送 ping\
  \ 消息来查看连接是否仍然存活。\n\n现在可以开始区块下载。如果节点已经完全同步了所有区块，那么它使用 Inv 协议消息监听新区块；否则，它首先检查是否对 inv\
  \ 消息有响应并且已有库存。如果是，则使用 Getdata 协议消息请求区块；如果不是，则使用 GetBlocks 消息请求库存。此方法一直使用到 0.9.3\
  \ 版本。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_165_0.png)\n\n协议可视化节点发现\n\n初始区块下载可以根据比特币核心客户端的版本使用\
  \ blocks first 或 headers-first 方法来同步区块。blocks-first 方法非常慢，并且自 0.10.0 版本以来已被停用。\n\
  \n自 0.10.0 版本以来，引入了名为 headers-first 的初始区块下载方法。这带来了重大的性能改进，区块链同步曾经需要几天才能完成，现在只需要几个小时。核心思想是新节点首先向对等节点请求区块头并验证它们。一旦完成，区块将并行从所有可用对等节点请求，因为完整的链蓝图已以区块头链的形式下载。\n\
  \n在此方法中，当客户端启动时，它会检查区块链是否已完全同步；如果标头链已同步；如果不是，即客户端首次启动时，它使用 getHeaders 消息从其他对等节点请求标头。如果区块链已完全同步，它会通过\
  \ Inv 消息监听新区块，如果它已经拥有完全同步的标头链，则使用 Getdata 协议消息请求区块。节点还会检查标头链是否比区块拥有更多标头，然后通过发出 Getdata\
  \ 协议消息请求区块。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_166_0.png)\n\nBitcoin Core\
  \ Client >= 0.10.0 header and block synchronization. IBD = Initial block download\
  \ and sync node means the node from where the blocks are being requested from\n\n\
  Getblockchaininfo 和 getpeerinfo RPC 已更新为包含新的功能以适应此更改。RPC getchaintips 用于列出区块链的所有已知分支。这也包括仅标头的区块。Getblockchaininfo\
  \ 用于提供有关区块链当前状态的信息。Getpeerinfo 用于列出对等节点之间共同拥有的区块数和标头数。\n\nWireshark 还可以用于可视化对等节点之间的消息交换，并且可以作为学习比特币协议的宝贵工具。这里显示了一个示例。这是一个基本示例，显示了\
  \ version、verack、getaddr、ping、addr 和 inv 消息。\n\n在详细信息中，可以看到诸如数据包类型、命令名称和协议消息结果等有价值的信息。\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_167_0.png)\n\nWireshark 中的一个示例区块消息\n\n\
  这里显示了一个协议图，展示了两个对等节点之间的数据流。这可以帮助你理解节点启动时使用什么类型的消息。\n\n在以下示例中，使用比特币解码器来分析流量并识别比特币协议命令。\n\
  \n可以看出 version、getaddr 和 getdata 等消息的交换，以及描述消息名称的相应注释。此练习对于学习比特币非常有用，建议在比特币测试网上进行实验，在那里可以发送各种消息和交易到网络，然后由\
  \ Wireshark 分析。\n\n| Time | 192.168.0.13 136.243.139.96 | Comment |\n|---|---|---|\n\
