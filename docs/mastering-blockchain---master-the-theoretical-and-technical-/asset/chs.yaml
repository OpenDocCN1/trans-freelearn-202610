- "## Cryptography and Technical Foundations\n\n在本章中，您将了解密码学的概念、理论和实践方面。更侧重于在区块链技术背景下特别相关的方面。此外，还将讨论金融市场中的概念，以便为后续章节所涵盖的材料提供基础。\n\
  \n您还将被介绍密码算法的实际实现，以便您可以实际体验密码功能。为此，使用了 **OpenSSL** 命令行。\n\n在开始理论基础之前，以下部分讨论了 OpenSSL\
  \ 的安装，以便您在阅读理论材料时可以进行一些实践工作。\n\n在 Ubuntu Linux 发行版上，OpenSSL 通常已经可用；但是，可以使用以下命令进行安装：\n\
  \n```\n```bash\n$ sudo apt-get install openssl\n```\n```\n\n在接下来的部分中，首先将讨论理论基础，然后介绍相关的实践实验。\n\
  \n## Introduction\n\n密码学是在存在对手的情况下使信息安全化的科学。它提供了一种在存在对手的情况下进行安全通信的手段，对手被假设拥有无限资源。密码用于加密数据，以便如果被对手截获，在没有解密的情况下，对手对数据毫无意义，而解密需要密钥。\n\
  \n密码学通常用于提供保密服务。单独来看，它不能被视为完整解决方案，但作为更大安全系统中的关键构建块，用于解决安全问题。\n\n密码学提供各种安全服务，例如 **Confidentiality,\
  \ Integrity, Authentication**，（实体身份验证和数据来源身份验证）以及 **non-repudiation**。此外，在各种安全系统中也需要问责制。\n\
  \n在进一步讨论密码学之前，有一些数学术语和概念需要先解释，以便充分理解本章后面提供的材料。下一节介绍了这些概念。应注意，本节旨在作为基础介绍。对所有这些术语的解释、证明和相关背景需要相当复杂的数学，这超出了本书的范围。有关这些主题的更多细节可以在任何标准的数论、代数或密码学教科书中找到。\n\
  \n## Mathematics\n\n由于密码学学科基于数学，本节将介绍一些基本概念，帮助您理解本章后面的概念。\n\n### Set\n\n集合是一组不同对象的集合，例如，X={1,\
  \ 2, 3, 4, 5}。\n\n### Group\n\n群是一个具有一种运算的交换集合，该运算结合集合的两个元素。群运算是封闭的，并且与单位元相关联。此外，集合中的每个元素都有逆元。封闭意味着例如，如果元素\
  \ A 和 B 在集合中，则对元素执行运算后得到的 resultant 元素也在集合中。结合律意味着元素的分组不会影响运算的结果。\n\n### Field\n\
  \n域是一个同时包含加法群和乘法群的集合。更准确地说，集合中的所有元素形成一个加法群和一个乘法群。它满足加法和乘法的特定公理。对于所有群运算，也适用分配律。该定律规定，即使任意项或因子被重新排序，也会产生相同的和或积。\n\
  \n### A finite field\n\n有限域是一个具有有限元素集合的域。也称为伽罗瓦域，这些结构在密码学中特别重要，因为它们可用于产生算术运算准确且无错误的结果。例如，素数有限域用于椭圆曲线密码学来构造离散对数问题。\n\
  \n### Order\n\n这是域中元素的数量。它也被称为域的基数。\n\n### Prime fields\n\n这是一个具有素数个元素的有限域。它对加法和乘法有特定的规则，并且域中每个非零元素都有逆元。加法和乘法运算按模\
  \ p 执行。\n\n### Ring\n\n如果可以在阿贝尔群上定义多个运算，则该群就成为环。还有某些需要满足的属性。环必须具有封闭性、结合性和分配性。\n\n\
  ### A cyclic group\n\n循环群是一种可以由单个元素生成的群，该元素称为群生成元。换句话说，如果对群中特定元素重复应用群运算，则可以生成群中的所有元素。\n\
  \n### Entity authentication\n\n实体身份验证是对实体当前参与并活跃于通信会话的保证。传统上，用户会获得用户名和密码，用于访问他们使用的平台。这称为单因素身份验证，因为只有一个因素，即\
  \ *你所知道的东西*，即密码和用户名。这种身份验证方式由于各种原因并不非常安全，例如密码泄露；因此，现在通常使用额外的因素来提供更好的安全性。对用户识别使用额外技术称为多因素身份验证，如果仅使用两种方法则称为双因素身份验证。如果用于身份验证的因素多于两个，则称为多因素身份验证。各种因素在此描述：\n\
  \n- 1. 第一个因素是你所拥有的东西，例如硬件令牌或智能卡。在这种情况下，用户可以使用硬件令牌来获得对系统的访问权限，此外还需要登录凭据。这通过要求两个身份验证因素来提供保护。拥有硬件令牌并知道登录凭据的用户将能够访问系统。两个因素都必须可用才能获得对系统的访问权限，因此这种方法是一种双因素身份验证机制。\n\
  - 2. 第二个因素是你所是的，它使用生物特征来识别用户。在此方法中，用户使用指纹、视网膜、虹膜或手部几何形状来提供额外的身份验证因素。这样可以确保用户确实在身份验证机制期间在场，因为生物特征对个人是唯一的。然而，需要谨慎实施以确保高水平的安全性，因为一些研究表明生物识别系统在某些情况下可以被规避。\n\
  \n### Data origin authentication\n\n也称为消息认证，这是对信息来源得到验证的保证。数据来源身份验证意味着数据完整性，因为如果来源得到证实，则数据不得被更改。各种方法，例如\
  \ **Message Authentication Codes (MACs)** 和数字签名是最常用的。这些术语将在本章后面详细解释。\n\n\n\n\n\n\
  ## 不可否认性\n\n不可否认性是这样一种保证：通过提供不可伪造的证据，实体无法否认先前的承诺或行为。它是一种安全服务，提供特定行为已经发生的不可伪造证据。在实体否认已执行行为的争议场景中，此特性非常必要，例如在电子商务系统上下单。该服务在电子交易中生成加密证据，以便在发生争议时用作对某项行为的确认。不可否认性多年来一直是一个活跃的研究领域。电子交易中的争议是一个常见问题，需要加以解决，以提高消费者对该服务的信任度。\n\
  \n不可否认协议通常运行在通信网络中，用于提供证据，证明网络上的某个实体（发起方或接收方）已采取某项行动。在此背景下，有两种通信模型可用于将消息从发起方 A 传输到接收方\
  \ B：\n\n- 消息直接从发起方 A 发送给接收方 B。\n- 消息由发起方 A 发送给投递代理，然后由投递代理将消息传递给接收方 B。\n\n不可否认协议的主要要求是公平性、有效性和及时性。在许多场景中，一笔交易会涉及多个参与者，而不仅仅是两方。例如，在电子交易系统中，单笔交易可能涉及清算代理、经纪人和交易者等多个实体。在这种情况下，两方不可否认协议并不适用。为了解决这个问题，人们开发了多方不可否认协议（MPNR）。\n\
  \n## 问责制\n\n问责制是这样一种保证：影响安全的行为可以追溯到责任方。这通常通过系统中的日志和审计机制来提供；由于业务性质需要详细审计的系统（例如电子交易系统）尤其如此。详细日志对于追溯实体的行为至关重要。例如，当一笔交易被提交时，会生成包含日期时间戳和实体身份的审计记录，并保存到日志文件中。该日志文件可以选择加密，可以是数据库的一部分，也可以是系统上独立的\
  \ ASCII 文本日志文件。\n\n## 密码学原语\n\n密码学原语是安全协议或系统的基本构建块。在接下来的部分中，你将了解对构建安全协议和系统至关重要的密码算法。安全协议是为了通过利用适当的安全机制来实现所需安全目标而采取的一组步骤。\n\
  \n当前使用的安全协议有多种类型，如身份验证协议、不可否认协议和密钥管理协议。\n\n下图中展示了一个通用密码学模型：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_81_0.png)\n\
  \n展示通用加密和解密模型的示意图\n\n在上述图中，P、E、C 和 D 分别代表明文、加密、密文和解密。此外，基于前面所示的模型，有必要解释各种概念，如实体、发送者、接收者、对手、密钥和信道。\n\
  \n- **实体**：发送、接收或对数据执行操作的个人或系统\n- **发送者**：发送数据的实体\n- **接收者**：接收数据的实体\n- **对手**：试图规避安全服务的实体\n\
  - **密钥**：用于加密或解密数据的数据\n- **信道**：为实体之间提供通信媒介\n\n密码学主要分为两类，即对称密码学和非对称密码学。\n\n## 对称密码学\n\
  \n对称密码学是指一种密码学类型，其中用于加密数据的密钥与用于解密数据的密钥相同，因此它也被称为共享密钥密码学。通信双方在数据交换之前必须建立或商定密钥。这也是它被称为**秘密密钥密码学**的原因。\n\
  \n对称密码有两种类型：流密码和分组密码。**数据加密标准（DES）**和**高级加密标准（AES）**是分组密码的常见示例，而 RC4 和 A5 是常用的流密码。\n\
  \n## 流密码\n\n流密码是使用密钥流逐位对明文应用加密算法的加密算法。流密码有两种类型：同步流密码和异步流密码。同步流密码的密钥流仅依赖于密钥，而异步流密码的密钥流还依赖于已加密的数据。\n\
  \n在流密码中，加密和解密基本上是相同的函数，因为它们只是简单的模 2 加法或异或运算。流密码的关键要求是密钥流的安全性和随机性。人们已经开发出多种生成随机数的技术，而且所有密钥生成器都必须具备密码学安全性，这一点至关重要：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_83_0.png)\n\n流密码的工作原理\n\n## 分组密码\n\n\
  分组密码是加密算法，将要加密的文本（明文）分成固定长度的块，并逐块应用加密。分组密码通常采用称为费斯特尔密码的设计策略来构建。现代分组密码（如 AES（Rijndael））是使用称为**替换-置换网络（SPN）**的替换和置换组合构建的。\n\
  \n费斯特尔密码基于费斯特尔网络，这是一种由*霍斯特·费斯特尔*开发的结构。该结构基于将多轮重复操作组合起来以实现称为混淆和扩散的理想密码学特性的思想。费斯特尔网络将数据分成左右两个数据块，并通过带密钥的轮函数处理这些数据块。\n\
  \n混淆使加密文本与明文之间的关系变得复杂。这在实际中通过替换来实现。例如，明文中的“A”在加密文本中被替换为“X”。在现代密码算法中，替换使用称为 S 盒的查找表来执行。扩散特性将明文在统计上扩散到加密数据上，这确保即使输入文本中的单个位被更改，也会导致密文中至少（平均）一半的位发生变化。即使使用同一密钥生成了许多加密和解密数据对，也需要混淆来使查找加密密钥变得非常困难。在实际中，这通过换位或置换来实现。\n\
  \n使用费斯特尔密码的一个关键优点是，加密和解密操作几乎相同，只需要反转加密过程即可实现解密。DES 就是基于费斯特尔结构的密码的一个典型示例：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_84_0.png)\n\
  \n分组密码的简化工作原理\n\n分组密码的各种工作模式包括**电子密码本（ECB）**、**密码分组链接（CBC）**、**输出反馈模式（OFB）**和**计数器模式（CTR）**。这些模式用于指定加密函数应用于明文的方式。这些模式将在本节后面解释，但这里先介绍前四种分组密码加密模式。\n\
  \n### 分组加密模式\n\n在此模式下，明文根据所用密码的类型分为固定长度的块，然后对每个块应用加密函数。\n\n### 密钥流生成模式\n\n在此模式下，加密函数生成密钥流，然后将密钥流与明文流进行异或运算以实现加密。\n\
  \n\n\n\n## 消息认证模式\n\n在这种模式下，消息认证码由加密函数计算得出。MAC 本质上是一种提供完整性服务的密码校验和。使用分组密码生成 MAC\
  \ 的最常见方法是 CBC-MAC，其中链中最后一个块的某一部分被用作 MAC。\n\n## 密码哈希\n\n哈希函数主要用于将消息压缩为固定长度的摘要。在这种模式下，分组密码被用作压缩函数，以生成明文的哈希。\n\
  \n下面简要讨论最常见的分组加密模式。\n\n## 电子密码本\n\n这是一种基本的工作模式，其加密数据是通过对每个明文块分别逐一应用加密算法而产生的。这是最简单的模式，但由于不安全且可能泄露信息，实际中不应使用：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_85_0.png)\n\n分组密码的电子密码本模式\n\n## 密码分组链接\n\
  \n在这种模式下，每个明文块与前一个加密块进行异或运算。CBC 模式使用初始化向量（IV）来加密第一个块。建议随机选择 IV：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_86_0.png)\n\
  \n密码分组链接模式\n\n## 计数器模式\n\nCTR 模式实际上将分组密码用作流密码。在这种情况下，会提供一个唯一的 nonce，并将其与计数器值拼接起来以生成**密钥流**：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_86_1.png)\n\n计数器模式\n\n还有其他模式，例如**密码反馈模式（CFB）**、**伽罗瓦计数器模式（GCM）**和输出反馈模式，它们也用于各种场景。\n\
  \n在下一节中，将介绍当前占主导地位的分组密码 AES 的设计和机制。首先，将介绍一些关于数据加密标准（DES）的历史，正是这段历史促成了新 AES 标准的制定。\n\
  \n## 数据加密标准（DES）\n\nDES 由美国**国家标准与技术研究院（NIST）**作为标准加密算法引入，并在 1980 年代和 1990 年代得到主要使用。但由于技术和密码学研究的发展，它并未被证明能够很好地抵抗暴力攻击。特别是在\
  \ 1998 年 7 月，**电子前沿基金会（EFF）**使用一台专用机器破解了 DES。DES 仅使用 56 位密钥，这引发了一些担忧。这一问题随着**三重\
  \ DES（3DES）**的引入而得到解决，3DES 使用三个 56 位密钥并执行相同次数的 DES 算法，从而使用 168 位密钥，使暴力攻击几乎不可能。但其他限制，如性能缓慢和\
  \ 64 位块大小，并不理想。\n\n## 高级加密标准（AES）\n\n2001 年，经过公开竞赛，密码学家 *Joan Daemen* 和 *Vincent\
  \ Rijmen* 发明的加密算法 Rijndael 被 NIST 稍作修改后标准化为 AES。到目前为止，还没有发现比暴力破解方法更好的针对 AES 的攻击。最初的\
  \ Rijndael 允许 128 位、192 位和 256 位的不同密钥和块大小，但在 AES 标准中，只允许 128 位的块大小。不过，128 位、192\
  \ 位和 256 位的密钥大小都是允许的。\n\n### AES 步骤\n\n在 AES 算法处理过程中，一个称为*状态*的 4×4 字节数组会经过多轮修改。完整的加密需要\
  \ 10 到 14 轮，具体取决于密钥大小。下表显示了密钥大小和所需轮数：\n\n| 密钥长度 | 所需轮数 |\n|---|---|\n| 128 位 | 10\
  \ 轮 |\n| 192 位 | 12 轮 |\n| 256 位 | 14 轮 |\n\n一旦用密码的输入初始化状态数组，就会分四个阶段执行四种操作来加密输入。这些阶段分别是轮密钥加（AddRoundKey）、字节代换（SubBytes）、行移位（ShiftRows）和列混合（MixColumns）：\n\
  \n1. 在轮密钥加步骤中，状态数组与一个子密钥进行异或运算，该子密钥由主密钥派生而来。\n2. 这是字节代换步骤，使用查找表（S-box）替换状态数组中的所有字节。\n\
  3. 此步骤用于将状态数组中除第一行以外的每一行以循环且递增的方式向左移位。\n4. 最后，此步骤以线性方式按列混合所有字节。\n\n上述步骤描述了 AES 的一轮。在最后一轮（根据密钥大小可能是\
  \ 10、12 或 14 轮）中，第 4 阶段被替换为轮密钥加，以确保前三个步骤无法被简单地逆向还原：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_88_0.png)\n\
  \n各种加密货币钱包使用 AES 加密来加密本地存储的数据。尤其是比特币钱包，使用 CBC 模式的 AES-256。\n\n### 使用 AES 加密和解密的\
  \ OpenSSL 示例\n\n```text\n:~/Crypt$ openssl enc -aes-256-cbc -in message.txt -out\
  \ message.bin\nenter aes-256-cbc encryption password:\nVerifying - enter aes-256-cbc\
  \ encryption password:\n:~/Crypt$ ls -ltr\ntotal 12\n```\n\n## 非对称密码学\n\n非对称密码学是指一种加密类型，其中用于加密数据的密钥与用于解密数据的密钥不同。它也称为公钥密码学，分别使用公钥和私钥来加密和解密数据。目前使用了多种非对称密码方案，例如\
  \ RSA、DSA 和 ElGamal。\n\n公钥密码学的概览如下图所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_91_0.png)\n\
  \n使用公钥/私钥进行加解密\n\n该图说明了发送方如何使用接收方的公钥加密数据，然后通过网络将数据传输给接收方。数据到达接收方后，可以使用接收方的私钥进行解密。这样，私钥保留在接收方一侧，不需要为了执行加密和解密而共享密钥，而对称加密则必须共享密钥。\n\
  \n### 整数分解\n\n这些方案基于大整数很难分解这一事实。RSA 是这类算法的典型例子。\n\n### 离散对数\n\n这基于模运算中的一个问题：计算模函数的结果很容易，但在计算上无法找到生成元的指数。换句话说，从结果中找到输入极其困难。这是一个单向函数。\n\
  \n例如，考虑以下等式：\n\n$3^2 \\bmod 10 = 9$\n\n现在，给定 9，要找到生成元 3 的指数 2 是非常困难的。这个困难问题常用于 Diffie-Hellman\
  \ 密钥交换和数字签名算法。\n\n### 椭圆曲线\n\n这是基于前面讨论过的离散对数问题，但在椭圆曲线的背景下。椭圆曲线是定义在域上的代数三次曲线，可以用此处所示的方程定义。该曲线是非奇异的，这意味着它没有尖点或自交点。它有两个变量\
  \ $a$ 和 $b$，还有一个无穷远点。\n\n$y^2 = x^3 + ax + b$\n\n这里，$a$ 和 $b$ 是可以取不同值的整数，并且是椭圆曲线所定义域中的元素。椭圆曲线可以在实数、有理数、复数或有限域上定义。出于密码学目的，使用素数有限域上的椭圆曲线，而不是实数域。此外，素数应大于\
  \ 3。通过改变 $a$ 和 $b$ 的值，可以生成不同的曲线。\n\n最常用的基于椭圆曲线的密码系统是**椭圆曲线数字签名算法（ECDSA）**和**椭圆曲线\
  \ Diffie-Hellman（ECDH）**密钥交换。\n\n\n\n\n## 公钥和私钥\n\n为了理解公钥密码学，首先需要了解的概念是公钥和私钥的想法。\n\
  \n私钥顾名思义，基本上是一个随机生成的数字，由用户私下保密保存。私钥需要得到保护，不得授予未经授权的访问；否则，整个公钥密码体系将被危及，因为这是用于解密消息的密钥。私钥的长度取决于所使用的算法类型和类别而有所不同。例如，在\
  \ RSA 中，通常使用 1024 位或 2048 位的密钥。1024 位密钥大小不再被认为安全，实践中建议至少使用 2048 位。\n\n公钥是私钥-公钥对的公开部分。公钥是公开可用的，并由私钥所有者发布。任何想要向公钥发布者发送加密消息的人都可以加密消息并发送给私钥持有者。没有人能够解密该消息，因为对应的私钥由预期接收者安全保存。一旦收到公钥加密的消息，接收者就可以使用私钥解密消息。关于公钥存在一些问题，例如公钥发布者的真实性和身份识别。\n\
  \n## RSA\n\n这里讨论了 RSA 的描述。RSA 由 Ron Rivest、Adi Shamir 和 Leonard Adleman 于 1977 年发明，因此得名\
  \ RSA。这基于整数分解问题，其中两个大素数的乘法很容易，但将其分解回两个原始数字却很困难。\n\nRSA 算法工作的核心在于密钥生成过程。RSA 密钥对是通过执行以下步骤生成的。\n\
  \n模数生成：\n\n- 选择 p 和 q 非常大的素数\n- 将 p 和 q 相乘，n = p·q 以生成模数 n\n\n生成互质数：\n\n- 假设一个称为\
  \ e 的数字。\n- 它应满足某些条件，即它应大于 1 且小于 $(p-1)(q-1)$。换句话说，$e$ 必须是这样一个数字，使得除 1 之外的任何数字都不能同时整除\
  \ $e$ 和 $(p-1)(q-1)$。这称为互质，即 $e$ 是 $(p-1)(q-1)$ 的互质数。\n\n生成公钥：\n\n- 第 1 步生成的模数和第\
  \ 2 步生成的 $e$ 是一对，共同构成公钥。这部分是公开部分，可以与任何人共享；然而，$p$ 和 $q$ 需要保密。\n\n生成私钥：\n\n- 这里称为私钥\
  \ $d$，由 $p$、$q$ 和 $e$ 计算得出。私钥基本上是 $e$ 模 $(p-1)(q-1)$ 的逆。在方程形式中，它是这样的：\n\n$ed = 1\
  \ \\mod (p-1)(q-1)$\n\n通常，使用扩展欧几里得算法来计算 $d$；该算法取 $p$、$q$ 和 $e$ 并计算 $d$。该方案的关键思想是，任何知道\
  \ $p$ 和 $q$ 的人都可以轻松计算私钥 $d$，通过应用扩展欧几里得算法，但不知道 $p$ 和 $q$ 值的人无法生成 $d$。这也意味着 $p$ 和\
  \ $q$ 应该足够大，使得模数 $n$ 变得非常难以分解。\n\n## 使用 RSA 进行加密和解密\n\nRSA 使用以下方程生成密文：\n\n$C = P^e\
  \ \\mod n$\n\n这意味着明文 $P$ 被提升到 $e$ 次幂，然后约简为模 $n$。\n\nRSA 中的解密由以下方程给出：\n\n$P = C^d\
  \ \\mod n$\n\n这意味着接收者拥有公钥对 $(n, e)$ 可以通过将 $C$ 提升到私钥 $d$ 的值并约简为模 $n$ 来解密数据。\n\n##\
  \ 椭圆曲线密码学 (ECC)\n\nECC 基于基于有限域（伽罗瓦域）上椭圆曲线的离散对数问题。ECC 相对于其他类型的公钥算法的主要好处是它需要更小的密钥大小，同时提供与例如\
  \ RSA 相同的保护级别。源自 ECC 的两个著名方案是用于密钥交换的椭圆曲线 Diffie-Hellman (ECDH) 和用于数字签名的椭圆曲线数字签名算法\
  \ (ECDSA)。它也可以用于加密，但在实践中通常不用于此目的；相反，密钥交换和数字签名更常用。由于 ECC 需要更少的空间来运行，它在嵌入式平台或存储资源有限的系统上变得非常流行。作为比较，ECC\
  \ 仅使用 256 位操作数即可实现与 RSA 中 3072 位相同的保护级别。\n\n## ECC 背后的数学\n\n为了理解 ECC，需要对底层数学进行基本介绍。椭圆曲线基本上是一种已知为魏尔斯特拉斯方程的多项式方程，它在有限域上生成一条曲线。最常用的域是所有算术运算都模素数\
  \ p 执行的域。椭圆曲线群由有限域上曲线上的点组成。\n\n椭圆曲线可以定义为这里的方程：\n\ny² = x³ + Ax + B mod p\n\n这里，A\
  \ 和 B 属于有限域 Zp 或 FP（素有限域），以及一个称为无穷远点的特殊值。无穷远点 ∞ 用于为曲线上的点提供恒等运算。\n\n此外，还需要满足一个条件，以确保前面提到的方程没有重复根。这意味着曲线是非奇异的。\n\
  \n该条件在方程中描述，这是需要满足的标准要求。更准确地说，这确保曲线是非奇异的：\n\n4a³ + 27b² ≠ 0 mod p\n\n椭圆曲线的实数表示可以可视化如下图所示。这是实数上的方程图：\n\
  \ny² = x³ + a x + b\n\n椭圆曲线密码学中实际使用的曲线是在有限素域上，但在 R 上显示时更容易可视化运算：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_97_0.png)\n\
  \n为了基于椭圆曲线构造离散对数问题，需要一个足够大的循环群。首先，群元素被识别为满足前面方程的一组点。之后，需要在这些点上定义群运算。\n\n椭圆曲线上的群运算是点加法和点倍加。点加法是将两个不同点相加的过程，点倍加意味着将同一个点加到自身。以下两幅图可以可视化这两个运算。\n\
  \n## 点加法\n\n点加法如下图所示。这是椭圆曲线上点加法的几何表示。在此方法中，通过曲线画一条线，该线与曲线相交于下面所示的两个点 P 和 Q，从而产生曲线与线之间的第三个点。该点被镜像为\
  \ P+Q，表示加法结果为 R。这在下图中显示为 P+Q：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_98_0.png)\n\
  \n用符号 + 表示的群运算产生以下方程：\n\nP + Q = R\n\n在这种情况下，两个点相加以计算曲线上第三点的坐标：\n\nP + Q = R\n\n\
  更准确地说，这意味着坐标按以下方程相加：\n\n(x1, y1) + (x2, y2) = (x3, y3)\n\n点加法的方程如下：\n\n```\nx₃ =\
  \ s² - x₁ - x₂ mod p\ny₃ = s(x₁ - x₃) - y₁ mod p\n```\n\n这里，结果是：\n\n```\nS = ((y₂\
  \ - y₁)/(x₂ - x₁)) mod p\n```\n\n前述方程中的 S 表示穿过 $P$ 和 $Q$ 的线。\n\n这里显示的点加法示例是使用 Certicom\
  \ 的在线计算器生成的。此示例显示了在有限域 $F_{23}$ 上方程的加法和解。这与前面显示的示例形成对比，后者是在实数上进行的，仅显示曲线但没有方程的解：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_99_0.png)\n\n\n\n\n在示例中，左侧的图显示了满足此处所示方程的点：\n\
  \n$$y^2 = x^3 + 7x + 11$$\n\n在有限域 $F_{23}$ 上，前面所示的方程有 27 个解。选择将 $P$ 和 $Q$ 相加，得到点\
  \ $R$。右侧展示了计算过程，用于计算第三个点 $R$。请注意，在这里，$l$ 用于表示经过 $P$ 和 $Q$ 的直线。\n\n为了举例说明图中的点如何满足该方程，选取一个点\
  \ $(x, y)$，其中 $x = 3$，$y = 6$。\n\n将这些值代入方程，可以看出方程确实得到满足。如下所示：\n\n$$y^2 \\mod 23\
  \ = x^3 + 7x + 11 \\mod 23$$\n\n$$6^2 \\mod 23 = 3^3 + 7(3) + 11 \\mod 23$$\n\n\
  $$36 \\mod 23 = 59 \\mod 23$$\n\n$$13 = 13$$\n\n下一节将介绍点的倍乘的概念，这是可以在椭圆曲线上执行的另一种运算。\n\
  \n## 点的倍乘\n\n![](img/62ab880d2302f959d34db648cb0bec5e_101_0.png)\n\n表示实数域上点的倍乘的图\n\
  \n对于点的倍乘，方程变为如下形式：\n\n$$x_3 = s^2 - 2x_1 \\mod p$$\n\n$$y_3 = s(x_1 - x_3) - y_1\
  \ \\mod p$$\n\n$$s = \\frac{y_2 - y_1}{x_2 - x_1} \\mod p$$\n\n这里，s 是经过 P 的切线的斜率。它是上图中顶部的直线。在前面的示例中，为了简单起见，曲线是在实数域上绘制的，没有展示方程的解。\n\
  \n这里展示了一个示例，它显示了有限域 $F_{23}$ 上椭圆曲线的解和点的倍乘。左侧的图显示了满足以下方程的点：\n\n$$y^2 = x^3 + 7x +\
  \ 11$$\n\n![](img/62ab880d2302f959d34db648cb0bec5e_102_0.png)\n\n使用 Certicom 的在线计算器工具进行点的倍乘的示例\n\
  \n如上所示，右侧展示了将 $P$ 与自身相加（点的倍乘）后求出 $R$ 的计算过程。这里没有 Q，因为使用同一个点 $P$ 进行倍乘。请注意，在计算中，$l$\
  \ 用于表示经过 $P$ 的切线。\n\n下一节将介绍离散对数问题。\n\n## 离散对数问题\n\nECC 中的离散对数问题基于这样一个思想：在特定条件下，椭圆曲线上的所有点构成一个循环群。\n\
  \n在椭圆曲线上，公钥是生成元的随机倍数，而私钥是用于生成该倍数的随机选择的整数。换句话说，私钥是一个随机选择的整数，而公钥是曲线上的一个点。\n\n离散对数问题用于找到私钥（一个整数），该整数位于椭圆曲线上所有点的范围之内。后面的一个方程将精确地说明这一点。\n\
  \n考虑一个椭圆曲线 E，其中有两个元素 P 和 T。离散对数问题是要找到整数 d，其中 $1 \\le d \\le \\#E$，使得：\n\n$$P + P\
  \ + \\dots + P = dP = T$$\n\n这里，T 是公钥（曲线上的点），d 是私钥。换句话说，公钥是生成元的随机倍数，而私钥是用于生成该倍数的整数。#E\
  \ 表示椭圆曲线的阶，基本上是指椭圆曲线循环群中存在的点的数量。循环群由椭圆曲线上的点与无穷远点的组合构成。\n\n密钥对与椭圆曲线的特定域参数相关联。域参数包括域大小、域表示、域中的两个元素\
  \ a 和 b、两个域元素 $X_g$ 和 $Y_g$、点 G 的阶 n（计算方式为 $G=(X_g, Y_g)$）以及余因子 $h = \\#E(F_q)/n$。本节稍后将介绍一个使用\
  \ OpenSSL 的实际示例。\n\n有多种被推荐并标准化用于 ECC 的曲线参数。这里向你展示一个 SECP256K1 规范的示例。这是比特币中使用的规范：\n\
  \n与 Koblitz 曲线 secp256k1 相关的 $F_p$ 上的椭圆曲线域参数由六元组 T = (p, a, b, G, n, h) 指定，其中有限域\
  \ $F_p$ 定义为：\n\n```\np = FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFE\
  \ FFFFFC2F\n  = 2^256 − 2^32 − 2^9 − 2^8 − 2^7 − 2^6 − 2^4 − 1\n```\n\n$F_p$ 上的曲线\
  \ $E: y^2 = x^3 + ax + b$ 定义为：\n\n```\na = 00000000 00000000 00000000 00000000 00000000\
  \ 00000000 00000000 00000000\nb = 00000000 00000000 00000000 00000000 00000000 00000000\
  \ 00000000 00000007\n```\n\n压缩形式的基点 G 为：\n\n```\nG = 02 79BE667E F9DCBBAC 55A06295\
  \ CE870B07 029BFCDB 2DCE28D9 59F2815B 16F81798\n```\n\n非压缩形式为：\n\n```\nG = 04 79BE667E\
  \ F9DCBBAC 55A06295 CE870B07 029BFCDB 2DCE28D9 59F2815B 16F81798 483ADA77 26A3C465\
  \ 5DA4FBFC 0E1108A8 FD17B448 A6855419 9C47D08F FB10D4B8\n```\n\n最后，G 的阶 n 和余因子为：\n\
  \n```\nn = FFFFFFFF FFFFFFFF FFFFFFFF FFFFFFFE BAAEDCE6 AF48A03B BFD25E8C D0364141\n\
  h = 01\n```\n\nSECP256K1 规范取自 http://www.secg.org/sec2-v2.pdf\n\n这里将解释六元组中所有这些值的含义。\n\
  \nP 是用于指定有限域大小的素数 p。\n\na 和 b 是椭圆曲线方程的系数。\n\nG 是生成所需子群的基点，也称为生成元。基点可以用压缩或非压缩形式表示。在实际实现中，不需要存储曲线上的所有点。压缩生成元之所以有效，是因为曲线上的点可以仅通过\
  \ x 坐标和 y 坐标的最低有效位来识别。\n\nn 是子群的阶。\n\nh 是子群的余因子。\n\n在下一节中，将展示一个使用 OpenSSL 的示例，以帮助你理解\
  \ RSA 的实际应用。\n\n在下一节中，将展示如何使用 OpenSSL 生成 RSA 公钥和私钥对。\n\n## 如何生成公钥和私钥对\n\n首先，展示如何使用\
  \ OpenSSL 生成 RSA 私钥。\n\n### 私钥\n\n```\n~/Crypt$ openssl genpkey -algorithm RSA -out\
  \ privatekey.pem -pkeyopt rsa_keygen_bits:1024\n........................................++++++\n\
  ........................................++++++\n```\n\n执行该命令后，会生成一个名为 privatekey.pem\
  \ 的文件，其中包含生成的私钥。如下所示：\n\n```\n~/Crypt$ cat privatekey.pem\n-----BEGIN PRIVATE KEY-----\n\
  MIICfgIBADANBgkqhkiG9w0BAQEFAASCAwggJcAgEAAoGBAKJOFBzPy2vOd6em\nBk/UGrzDy7TvgDYnYxBfiEJId/r+ByMt/F14k2fDTOVwxXaXTxiQgD+BKuiey/69\n\
  9itnrqW/xy/pocDMvobj8QCngEntOdNoVSaN+t0f9nRM3iVM94mz3/C/v4vXvoac\nPyPkr/0jhIVOwoCurXGTghgqIbHRAgMBAAECgYEAlB3s/N41Jh011TkOSYunWtzT\n\
  6isnNkR7g1wRY9h+rGxxx4kP5b1DyE5vxBL6xgBle8JVQMzm5sKJrUPFZzzT5\nNNNWugCxairxcF1mPzJAP3aqc5SjKpTv4qgqYevwgW1A0R3xKQz8ZKU+bT0Z2hXV\n\
  D1oHxu75mDY3xCwqSAECQODUYV04wNSEjEy9tYJ0zaryDACvd/VG2/U/6qiQGajB\neSpSqeEESigbusKku+wVtRYgWWEomL/X58t+K01eMZZAKeAw6PUR9YLebsm/Sji\n\
  IOShV4AKuFdi7t7DYWE5Ulbluqp/i28zN/ytt4BXXIs/KcFykQGeAC6LDHZyyc\nntDIOQJAVqrE1/wYvV5jkqcXbYLGv5YA+KYDOb9Y/ZRM5UETVKCVXNanF5CjfW1h\n\
  MMhfNxyGvwy2YVK0Nu8oY3xYPi+5QQJAUGcmOre4w6Cs12JUJ5p+zG0s+rG/URhw\nB7djTXm7p6b6wR1EWYAZDM9MArenj8uXAA1AGCcIsmiDqHfU71gzOQJAe9mOdNGW\n\
  7qRppgmOE5nuEbxkDSQI7OqHYbOLuwfCjHzJBrSgqyi6pj9/9CbXJrZPgNDwdLEb\nGgpDKtZs9gLv3A==\n\
  -----END PRIVATE KEY-----\n```\n\n### 生成公钥\n\n由于私钥与公钥在数学上是关联的，因此可以从私钥生成或推导出公钥。以上面的私钥为例，可以按如下方式生成公钥：\n\
  \n```\n:~/Crypt$ openssl rsa -pubout -in privatekey.pem -out publickey.pem\nwriting\
  \ RSA key\n```\n\n可以使用文件阅读器或任何文本查看器查看公钥，如下所示：\n\n```\n:~/Crypt$ cat publickey.pem\n\
  -----BEGIN PUBLIC KEY-----\nMIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQCiThQcz8trznenpgZP1Bq8w8u0\n\
  74A2J2MQX4hCSHf6/hMjFxdeJNnw0zlcMV2108YkIA/gSronsv+vfYrZ66lv8cv\n6aHAzL6G4/EAp4BJ7TnTaFUmfjrdH/Z0TN41TPeJs9/wv7+L176GnD8j5K/9I4SF\n\
  dMKArq1xk4IYKiGxOQIDAQAB\n-----END PUBLIC KEY-----\n```\n\n为了查看各个组件的更多详细信息，例如模数、过程中使用的素数、指数以及所生成私钥的系数，可以使用以下命令（由于输出过大，此处未显示完整输出）：\n\
  \n```\n:~/Crypt$ openssl rsa -text -in privatekey.pem\nPrivate-Key: (1024 bit)\n\
  modulus:\n    00:a2:4e:14:1c:cf:cb:6b:ce:77:a7:a6:06:4f:d4:\n    1a:bc:c3:cb:b4:ef:80:36:27:63:10:5f:88:42:48:\n\
  \    77:fa:fe:13:23:2d:fc:5d:78:93:67:c3:4c:e5:70:\n    c5:76:97:4f:18:90:80:3f:81:2a:e8:9e:cb:fe:bd:\n\
  \    f6:2b:67:ae:a5:bf:c7:2f:e9:a1:c0:cc:be:86:e3:\n    f1:00:a7:80:49:ed:39:d3:68:55:26:8d:fa:dd:1f:\n\
  \    f6:74:4c:de:25:4c:7f:89:b3:df:f0:bf:bf:8b:d7:\n    be:86:9c:3f:23:e4:af:fd:23:84:85:74:c2:80:ae:\n\
  \    ad:71:93:82:18:2a:21:b1:d1\npublicExponent: 65537 (0x10001)\nprivateExponent:\n\
  \    00:94:1d:ec:fc:de:25:26:1d:25:d5:39:0e:49:8b:\n    a7:5a:dc:d3:ea:2b:27:36:44:7b:83:55:ab:63:d1:\n\
  \    fe:ac:6f:71:c7:89:0f:e5:bd:43:c8:4d:d2:bf:10:\n    4b:24:0e:b1:80:19:5e:f0:95:50:33:39:b7:b0:a2:\n\
  \    6b:24:f1:59:cf:34:f9:34:d3:67:ba:00:b1:6a:2a:\n    f1:70:5d:66:3f:32:40:3f:76:aa:a5:c4:a3:c4:aa:\n\
  \    53:bf:8a:a0:a9:87:af:c2:05:b5:03:44:77:c4:a4:\n    19:cc:12:94:f9:b4:ce:da:15:d5:0f:5a:07:c6:ee:\n\
  \    f9:98:36:37:c4:2c:2a:48:01\n```\n\n\n\n\n\n```\nprime1:\n00:d4:61:5d:38:c0:d4:84:8c:4c:bd:b5:82:74:cd:\n\
  aa:f2:0c:07:2f:77:f5:46:db:f5:3f:ea:a8:90:19:\na8:c1:79:2a:52:aa:81:04:4a:28:1b:ba:c2:a4:bb:\n\
  ec:15:b5:16:20:59:61:28:98:bf:d7:e7:cb:7e:2b:\n4d:5e:30:c6:59\n```\n\n```\nprime2:\n\
  00:c3:a3:d4:47:d6:0b:79:bb:26:fd:28:e2:88:e4:\na1:57:80:0a:b8:57:62:ee:de:c3:61:61:39:52:56:\n\
  f5:ba:a3:ff:8b:6f:33:37:fc:ad:b7:80:57:28:8b:\n3f:29:c1:72:91:01:9e:00:2e:8b:0c:76:72:c9:cc:\n\
  9c:9e:d0:c8:39\n```\n\n同样地，可以使用以下命令探索公钥。公钥和私钥都是 base64 编码的：\n\n```\n~/Crypt$ openssl\
  \ pkey -in publickey.pem -pubin -text\n-----BEGIN PUBLIC KEY-----\nMIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC\
  \ iThQcz8trzn enpgZP1Bq8w8u0\n74A2J2MQX4hCSH f6/hMjLfxdeJNnw0zlcMV2108YkIA/gSronsv+vfYzZ66lv8cv\n\
  6aHAzL6G4/EAp4BJ7TnTaFUmjfrdH/Z0TN41TPeJs9/wv7+L176GnD8j5K/9I4SF\ndMKArq1xk4IYkiGx0QIDAQAB\n\
  -----END PUBLIC KEY-----\nPublic-Key: (1024 bit)\nModulus:\n00:a2:4e:14:1c:cf:cb:6b:ce:77:a7:a6:06:4f:d4:\n\
  1a:bc:c3:cb:b4:ef:80:36:27:63:10:5f:88:42:48:\n77:fa:fe:13:23:2d:fc:5d:78:93:67:c3:4c:e5:70:\n\
  c5:76:97:4f:18:90:80:3f:81:2a:e8:9e:cb:fe:bd:\nf6:2b:67:ae:a5:bf:c7:2f:e9:a1:c0:cc:be:86:e3:\n\
  f1:00:a7:80:49:ed:39:d3:68:55:26:8d:fa:dd:1f:\nf6:74:4c:de:25:4c:f7:89:b3:df:f0:bf:bf:8b:d7:\n\
  be:86:9c:3f:23:e4:af:fd:23:84:85:74:c2:80:ae:\nad:71:93:82:18:2a:21:b1:d1\nExponent:\
  \ 65537 (0x10001)\n```\n\n现在公钥可以公开共享，任何想要向我们发送消息的人都可以使用公钥加密消息并发送给我们。然后我们可以使用相应的私钥解密文件。\n\
  \n## 使用 OpenSSL 进行 RSA 加密和解密\n\n首先在本节中，将给出一个示例，演示如何使用 RSA 执行加密。\n\n## 使用 OpenSSL\
  \ 的 ECC\n\nOpenSSL 提供了丰富的函数库来执行椭圆曲线密码学。以下部分展示了如何在 OpenSSL 中实际使用 ECC 函数。\n\n## ECC\
  \ 私钥和公钥对\n\n在本示例中，首先给出一个示例，演示如何使用 OpenSSL 库中可用的 ECC 函数创建私钥。\n\n## 私钥\n\nECC 基于各种标准定义的域参数。我们可以使用以下命令查看\
  \ OpenSSL 中所有可用标准定义和推荐的曲线列表：\n\n```\nCrypt$ openssl ecparam -list_curves\nsecp112r1\
  \ : SECG/WTLS curve over a 112 bit prime field\nsecp112r2 : SECG curve over a 112\
  \ bit prime field\nsecp128r1 : SECG curve over a 128 bit prime field\nsecp128r2\
  \ : SECG curve over a 128 bit prime field\nsecp160k1 : SECG curve over a 160 bit\
  \ prime field\nsecp160r1 : SECG curve over a 160 bit prime field\nsecp160r2 : SECG/WTLS\
  \ curve over a 160 bit prime field\nsecp192k1 : SECG curve over a 192 bit prime\
  \ field\nsecp224k1 : SECG curve over a 224 bit prime field\nsecp224r1 : NIST/SECG\
  \ curve over a 224 bit prime field\nsecp256k1 : SECG curve over a 256 bit prime\
  \ field\nsecp384r1 : NIST/SECG curve over a 384 bit prime field\nsecp521r1 : NIST/SECG\
  \ curve over a 521 bit prime field\nprime192v1: NIST/X9.62/SECG curve over a 192\
  \ bit prime field\n.\n.\n.\nbrainpoolP384r1: RFC 5639 curve over a 384 bit prime\
  \ field\nbrainpoolP384t1: RFC 5639 curve over a 384 bit prime field\nbrainpoolP512r1:\
  \ RFC 5639 curve over a 512 bit prime field\nbrainpoolP512t1: RFC 5639 curve over\
  \ a 512 bit prime field\n```\n\n由于输出很长，因此未显示完整输出，并在中间截断。在下面的示例中，使用 SECP256k1 来演示\
  \ ECC 的使用。\n\n## 私钥生成\n\n```\n~/Crypt$ openssl ecparam -name secp256k1 -genkey -noout\
  \ -out ec-privatekey.pem\n~/Crypt$ cat ec-privatekey.pem\n-----BEGIN EC PRIVATE\
  \ KEY-----\nMHQCAQEEIJHUIm9NZA gfpUrSxUk/iINq1ghM/ewn/RLNreuR52h/oAcGBSuBBA AKoUQDQgAE0G33mCZ4PKbg5EtwQjk6ucv9Qc9DTr8JdcGXYGxHdzr0Jt1NInaYE0GGChFMT5pK+wf\
  \ vSLkY15ul0oczW Kjng==\n-----END EC PRIVATE KEY-----\n```\n\n文件 ec-privatekey.pem\
  \ 现在包含基于 SECP256K1 曲线生成的 EC 私钥。\n\n要从私钥生成公钥，请执行以下命令：\n\n```\n~/Crypt$ openssl ec\
  \ -in ec-privatekey.pem -pubout -out ec-pubkey.pem\nread EC key\nwriting EC key\n\
  ```\n\n读取文件会产生以下输出，显示生成的公钥：\n\n```\n~/Crypt$ cat ec-pubkey.pem\n-----BEGIN PUBLIC\
  \ KEY-----\nMFYwEAYHKoZIzj0CAQYFK4EEAAoDQgAE0G33mCZ4PKbg5EtwQjk6ucv9Qc9DTr8JdcGXYGxHdzr0Jt1NInaYE0GGChFMT5pK+wf\
  \ vSLkY15ul0oczWKjng==\n-----END PUBLIC KEY-----\n```\n\n现在 ec-pubkey.pem 文件包含从\
  \ ec-privatekey.pem 派生的公钥。\n\n可以使用以下命令进一步探索私钥：\n\n```\n~/Crypt$ openssl ec -in ec-privatekey.pem\
  \ -text -noout\nread EC key\nPrivate-Key: (256 bit)\npriv:\n00:91:d4:22:6f:4d:64:08:1f:a5:4a:d2:c5:49:3f:\n\
  88:83:6a:d6:08:4c:fd:ec:27:fd:12:cd:ad:eb:91:\ne7:68:7f\npub:\n04:d0:6d:f7:98:26:78:3c:a6:e0:e4:4b:70:42:39:\n\
  3a:b9:cb:fd:41:cf:43:4e:bf:09:75:c1:97:60:6c:\n47:77:3a:f4:26:dd:4d:22:76:98:13:41:86:0a:11:\n\
  4c:4f:9a:4a:fb:07:ef:48:b9:18:97:9b:a5:d2:87:\n```\n\n同样，可以使用以下命令进一步探索公钥：\n\n```\n\
  drequinox@drequinox-OP7010:~/Crypt$ openssl ec -in ec-pubkey.pem -pubin -text -noout\n\
  read EC key\nPrivate-Key: (256 bit)\npub:\n    04:d0:6d:f7:98:26:78:3c:a6:e0:e4:4b:70:42:39:\n\
  \    3a:b9:cb:fd:41:cf:43:4e:bf:09:75:c1:97:60:6c:\n    47:77:3a:f4:26:dd:4d:22:76:98:13:41:86:0a:11:\n\
  \    4c:4f:9a:4f:fb:07:ef:48:b9:18:97:9b:a5:d2:87:\n    33:c1:62:a3:9e\nASN1 OID:\
  \ secp256k1\ndrequinox@drequinox-OP7010:~/Crypt$\n```\n\n也可以生成一个包含所需参数的文件——在本例中为\
  \ SECP256K1——然后进一步探索以了解底层参数：\n\n```\n~/Crypt$ openssl ecparam -name secp256k1 -out\
  \ secp256k1.pem\ndrequinox@drequinox-OP7010:~/Crypt$ cat secp256k1.pem\n-----BEGIN\
  \ EC PARAMETERS-----\nBgUrgQQACg==\n-----END EC PARAMETERS-----\n```\n\n该文件现在包含所有\
  \ SECP256K1 参数，可以使用以下命令进行分析：\n\n```\ndrequinox@drequinox-OP7010:~/Crypt$ openssl\
  \ ecparam -in secp256k1.pem -text -param_enc explicit -noout\nField Type: prime-field\n\
  Prime:\n    00:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:\n    ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:fe:ff:\n\
  \    ff:fc:2f\nA:    0\nB:    7 (0x7)\nGenerator (uncompressed):\n    04:79:be:66:7e:f9:dc:bb:ac:55:a0:62:95:ce:87:\n\
  \    0b:07:02:9b:8f:cd:2c:e2:28:09:59:f2:81:5b:16:\n    f8:17:98:48:3a:da:77:26:a3:c4:65:5d:a4:fb:fc:\n\
  \    0e:11:08:a8:fd:17:b4:48:a6:85:54:19:9c:47:d0:\n    8f:fb:10:d4:b8\nOrder:\n\
  \    00:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:ff:\n    ff:fe:ba:ae:dc:e6:af:48:a0:3b:bf:d2:5e:8c:d0:\n\
  ```\n\n前面的示例显示了所使用的素数以及 SECP256K1 曲线域参数的 A 和 B 值，以及生成元、阶和共因子。\n\n还有另一类密码学原语称为哈希函数。哈希函数不是用来加密数据的；相反，它们产生文本的固定长度摘要。\n\
  \n## 密码学原语\n\n这种密码学原语的分类可以可视化如下所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_112_0.png)\n\
  \n## 哈希函数\n\n哈希函数用于创建任意长输入字符串的固定长度摘要。哈希函数是无密钥的，并提供数据完整性服务。它们通常使用迭代和专用哈希函数构造技术构建。各种哈希函数族可用，例如\
  \ MD、SHA1、SHA-2、SHA-3、RIPEMD 和 Whirlpool。哈希函数通常用于数字签名和消息认证码，例如 HMAC。它们具有三个安全属性，即预像抗性、第二预像抗性和抗碰撞性。这些属性将在本节后面解释。\n\
  \n**哈希函数**通常用于提供数据完整性服务。它们可以用作单向函数，并用于构造其他密码学原语，例如 MAC 和数字签名。某些应用使用哈希函数作为生成**伪随机数生成器（PRNGs）**的手段。哈希函数不需要密钥。哈希函数必须满足两个实际属性和三个安全属性，具体取决于完整性要求的级别。\n\
  \n## 将任意消息压缩为固定长度摘要\n\n该属性关注于哈希函数必须能够接受任意长度的长输入文本并输出固定长度压缩消息的事实。哈希函数在各种位大小上产生压缩输出，通常在\
  \ 128 位到 512 位之间。\n\n## 易于计算\n\n哈希函数是高效且快速的单向函数。要求是无论消息大小如何，它们都非常快速地计算。效率可能会在消息过大时下降，但该函数仍应足够快以供实际使用。\n\
  \n在下一节中，将讨论哈希函数的安全属性。\n\n## 预像抗性\n\n考虑一个方程：\n\n```\n$$h(x)=y$$\n```\n\n这里，*h* 是哈希函数，*x*\
  \ 是输入，*y* 是哈希。第一个安全属性要求 *y* 不能反向计算为 *x*。*x* 被认为是 *y* 的*预像*，因此得名预像抗性。这也称为单向属性。\n\n\
  ## 第二预像抗性\n\n该属性要求给定 *x* 和 *h(x)*，几乎不可能找到任何其他消息 *m*，其中 *m != x* 且 *m* 的哈希 = *x*\
  \ 的哈希。*h(m) = h(x)*。该属性也称为弱抗碰撞性。\n\n\n\n\n\n## 抗碰撞性\n\n该性质要求两个不同的输入消息不应哈希到相同的输出。换句话说，*h(x)\
  \ != h(z)*。这一性质也称为强抗碰撞性。\n\n哈希函数由于其本质，总会存在一些碰撞，即两个不同的消息哈希到相同的输出，但要在计算上不可行才能找到它们。所有哈希函数都期望具备一种称为**雪崩效应**的概念。雪崩效应指的是，输入文本中的微小变化，哪怕只是一个字符的改变，也会导致完全不同的哈希输出。\n\
  \n哈希函数通常采用迭代哈希函数的方法来设计。在这种方法中，输入消息以逐块的方式经过多轮压缩，以产生压缩后的输出。一种流行的迭代哈希函数类型是 Merkle-Damgard\
  \ 结构。这种结构基于将输入数据划分为等大小的块，然后以迭代方式将它们送入压缩函数的思想。压缩函数的抗碰撞性保证了哈希输出也具有抗碰撞性。压缩函数可以使用分组密码来构建。除了\
  \ Merkle-Damgard 之外，研究人员还提出了多种其他压缩函数结构，例如 *Miyaguchi-Preneel* 和 *Davies-Meyer*。\n\
  \n哈希函数有多个类别。在接下来的章节中，你将了解这些类别。\n\n## 消息摘要（MD）\n\n消息摘要函数在 20 世纪 90 年代初非常流行。MD4 和\
  \ MD5 属于这一类别。这两种 MD 函数均被发现不安全，不再推荐使用。MD5 是一种 128 位哈希函数，曾常用于文件完整性检查。\n\n## 安全哈希算法（SHA）\n\
  \n**SHA-0：** 这是 NIST 于 1993 年推出的一种 160 位函数。\n\n**SHA-1：** SHA-1 后来由 NIST 推出，作为 SHA-0\
  \ 的替代品。这也是一种 160 位哈希函数。SHA-1 常用于 SSL 和 TLS 实现中。需要注意的是，SHA-1 现在被认为是不安全的，并且正被证书颁发机构弃用。在任何新的实现中都不再鼓励使用它。\n\
  \n**SHA-2：** 该类别包括四种由哈希位数定义的函数：SHA-224、SHA-256、SHA-384 和 SHA-512。\n\n**SHA-3：**\
  \ 这是最新的 SHA 函数系列。SHA3-224、SHA3-256、SHA3-384 和 SHA3-512 是该系列的成员。SHA3 是 Keccak 的 NIST\
  \ 标准化版本。Keccak 使用了一种称为*海绵结构*的新方法，而不是常用的 Merkle-Damgard 变换。\n\n**RIPEMD：** RIPEMD\
  \ 是 *RACE 完整性原语评估消息摘要*的缩写。它基于用于构建 MD4 的设计思想。RIPEMD 有多个版本，包括 128 位、160 位、256 位和 320\
  \ 位。\n\n**Whirlpool：** 它基于 Rijndael 密码的修改版本，称为 W。它使用 Miyaguchi-Preneel 压缩函数，这是一种单向函数，用于将两个固定长度的输入压缩为单个固定长度的输出。它是一个单块长度压缩函数：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_115_0.png)\n\n哈希函数的三个安全属性\n\n哈希函数有许多实际应用，从简单的文件完整性检查和密码存储，到用于加密协议和算法中。它们用于哈希表、分布式哈希表、布隆过滤器、病毒指纹识别、点对点\
  \ P2P 文件共享以及许多其他应用。\n\n在区块链中，哈希函数扮演着非常重要的角色。特别是，工作量证明函数使用 SHA-256 两次来验证矿工花费的计算工作量。RIPEMD\
  \ 160 用于生成比特币地址。这将在后面的章节中更详细地讨论。\n\n## 安全哈希算法（SHA）的设计\n\n在以下部分中，你将了解 SHA-256 和 SHA-3\
  \ 的设计。这两者分别用于比特币和以太坊。以太坊不使用 NIST 标准的 SHA-3，而是使用 Keccak，这是提交给 NIST 的原始算法。NIST 在经过一些修改（例如增加轮数和更简单的消息填充）后，将\
  \ Keccak 标准化为 SHA-3。\n\n## SHA-256\n\nSHA-256 的输入消息大小 < 2^64 位。块大小为 512 位，字大小为 32\
  \ 位。输出为 256 位摘要。\n\n压缩函数处理一个 512 位的消息块和一个 256 位的中间哈希值。该函数有两个主要组成部分：压缩函数和消息调度。\n\n\
  该算法的工作原理如下：\n\n- 预处理：\n  1. 消息填充，用于在消息块小于所需的 512 位块大小时，将其长度补足为 512 位。\n  2. 将消息解析为消息块，确保消息及其填充被划分为等大的\
  \ 512 位块。\n  3. 设置初始哈希值，即取前八个素数平方根的小数部分的前 32 位而得到的八个 32 位字。这些初始值是随机选择的，以初始化该过程，并使人相信算法中不存在后门。\n\
  \n- 哈希计算：\n\n  1. 每个消息块按顺序处理，需要 64 轮才能计算出完整的哈希输出。每一轮使用略有不同的常量，以确保没有两轮是相同的。\n  2.\
  \ 首先，准备消息调度。\n  3. 然后，初始化八个工作变量。\n  4. 接着，计算中间哈希值。\n  5. 最后，处理消息并产生输出哈希：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_117_0.png)\n\
  \n在上图中，*a、b、c、d、e、f、g* 和 *h* 是寄存器。**Maj** 和 **Ch** 按位应用。Σ₀ 和 Σ₁ 执行按位旋转。轮常量为 **W**_j\
  \ 和 **K**_j，它们以 *mod* 2^32 的方式相加。\n\n## SHA3（Keccak）的设计\n\nSHA-3 的结构与通常的 SHA-1 和\
  \ SHA-2 非常不同。SHA-3 背后的关键思想基于无密钥排列，而其他常见的哈希函数构造则使用有密钥排列。Keccak 也不使用哈希函数中通常用于处理任意长度输入消息的\
  \ Merkle-Damgard 变换。Keccak 使用了一种称为海绵和挤压结构的新方法，这基本上是一种随机排列模型。SHA3 的不同变体已被标准化，例如 SHA3-224、SHA3-256、SHA3-384、SHA3-512、SHAKE128\
  \ 和 SHAKE256。SHAKE128 和 SHAKE256 是可扩展输出函数，也由 NIST 标准化。XOF 函数允许将输出扩展到任意所需长度。\n\n\
  下图显示了作为 SHA3 或 Keccak 基础的海绵和挤压模型。类比海绵，首先，数据在应用填充后被吸收到海绵中，然后通过 XOR 将其转换为排列状态的一个子集，然后输出被挤压出海绵函数，该函数表示变换后的状态。速率是海绵函数的输入块大小，而容量决定了通用安全级别：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_118_0.png)\n\nSHA3 中的 SHA-3 吸收和挤压函数\n\
  \n## 哈希函数的 OpenSSL 示例\n\n以下命令将使用 SHA256 算法生成 Hello 消息的 256 位哈希：\n\n```\n:/Crypt$\
  \ echo -n 'Hello' | openssl dgst -sha256\n(stdin)= 185f8db32271fe25f561a6fc938b2e264306ec304eda518007d1764826381969\n\
  ```\n\n请注意，即使文本中有一个微小的变化，例如将 H 的大小写改变，也会导致输出哈希发生巨大变化。这就是前面讨论的雪崩效应：\n\n```\n:/Crypt$\
  \ echo -n 'hello' | openssl dgst -sha256\n(stdin)= 2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824\n\
  ```\n\n请注意，两个输出完全不同：\n\n```\nHello:\n18:5f:8d:b3:22:71:fe:25:f5:61:a6:fc:93:8b:2e:26:43:06:ec:30:4e:da:51:80:07:\n\
  d1:76:48:26:38:19:69\nhello:\n2c:f2:4d:ba:5f:b0:a3:0e:26:e8:3b:2a:c5:b9:e2:9e:1b:16:1e:5c:1f:a7:42:5e:73:\n\
  04:33:62:93:8b:98:24\n```\n\n\n\n\n\n## 消息认证码（MAC）\n\n消息认证码有时也被称为带密钥的哈希函数，可用于提供消息完整性和认证。换句话说，它们用于提供数据源认证。这些是对称密码原语，使用发送方和接收方之间的共享密钥。MAC\
  \ 可以通过分组密码或哈希函数来构造。\n\n## 使用分组密码的 MAC\n\n在这种方法中，分组密码以密码分组链接模式（CBC 模式）使用，以生成 MAC。任何分组密码（例如\
  \ CBC 模式下的 AES）都可以使用。消息的 MAC 实际上是 CBC 操作最后一轮的输出。MAC 输出的长度与用于生成 MAC 的分组密码的分组长度相同。MAC\
  \ 的验证只需计算消息的 MAC 并将其与接收到的 MAC 进行比较即可。如果相同，则确认消息完整性；否则，认为消息已被更改。还应注意，MAC 的工作方式类似于数字签名，但由于其对称性，它们无法提供不可否认服务。\n\
  \n## HMAC（基于哈希的 MAC）\n\n与哈希函数类似，它们产生固定长度的输出，并接受任意长度的消息作为输入。在这种方案中，发送方使用 MAC 对消息进行签名，接收方使用共享密钥进行验证。密钥与消息一起进行哈希处理，使用两种方法之一，称为秘密前缀或秘密后缀方法。在第一种方法中，密钥与消息连接在一起，即密钥在前，消息在后；而在后一种方法中，密钥在消息之后：\n\
  \n秘密前缀：M = MACk(x) = h(k||x)\n\n秘密后缀：M = MACk(x) = h(x||k)\n\n两种方法各有利弊。针对这两种方案已经发现了一些攻击。有一些\
  \ HMAC 构造方案使用各种技术，例如研究人员提出的 **ipad** 和 **opad**（内填充和外填充），这些方案在某种假设下被认为是安全的：\n\n\
  ![](img/62ab880d2302f959d34db648cb0bec5e_120_0.png)\n\nMAC 函数的操作\n\n## Merkle 树\n\
  \nMerkle 树的概念由*拉尔夫·默克尔*引入。此处展示了 Merkle 树的可视化图示，便于理解。Merkle 树允许对大型数据集进行安全高效的验证。\n\
  \n它是一种二叉树，首先将输入放置在叶节点（没有子节点的节点）上，然后将成对子节点的值一起进行哈希处理，以为父节点（内部节点）生成一个值，直到获得称为 Merkle\
  \ 根的单一哈希值：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_120_1.png)\n\nMerkle 树\n\n\
  ## 数字签名\n\n数字签名提供了一种将消息与其来源实体关联起来的手段。数字签名用于提供数据源认证和不可否认性。它们的计算分两步进行。RSA 数字签名方案的高级步骤如下：\n\
  \n- 1. 计算数据分组的哈希值。这将提供数据完整性保证，因为可以在接收端再次计算哈希，并与原始哈希进行匹配，以检查数据在传输过程中是否被修改。从技术上讲，消息签名可以在不先对数据进行哈希处理的情况下进行，但这被认为是不安全的。\n\
  - 2. 第二步使用签名者的私钥对哈希值进行签名。由于只有签名者拥有私钥，因此可以保证签名和已签名数据的真实性。\n\n数字签名具有一些重要属性，例如真实性、不可伪造性和不可重用性。真实性意味着数字签名可以由接收方验证。不可伪造性属性确保只有消息的发送者才能使用私钥执行签名功能。换句话说，任何其他人都不能生成由合法发送者生成的签名消息。不可重用性意味着数字签名不能与消息分离，并再次用于另一条消息。\n\
  \n通用数字签名函数的操作如下图所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_122_0.png)\n\n数字签名（左侧）和验证过程（右侧）（RSA\
  \ 数字签名示例）\n\n如果发送方想要向接收方发送经过认证的消息，可以使用两种方法。这里介绍这两种将数字签名与加密结合使用的方法。\n\n## 先签名后加密\n\
  \n在这种方法中，发送方使用私钥对数据进行数字签名，将签名附加到数据上，然后使用接收方的公钥对数据和数字签名进行加密。与接下来描述的“先加密后签名”方案相比，这被认为是一种更安全的方案。\n\
  \n## 先加密后签名\n\n在这种方法中，发送方使用接收方的公钥对数据进行加密，然后对加密后的数据进行数字签名。\n\n在实践中，包含数字签名的数字证书由证书颁发机构（CA）颁发，该机构将公钥与身份相关联。\n\
  \n实践中使用各种方案，例如基于 RSA、数字签名算法和椭圆曲线数字签名算法的数字签名方案。RSA 是最常用的；然而，随着椭圆曲线密码学的兴起，基于 ECDSA\
  \ 的方案也变得相当流行。\n\n此处详细描述了 ECDSA 方案。\n\n## 椭圆曲线数字签名算法（ECDSA）\n\n为了使用 ECDSA 方案进行签名和验证，首先需要生成密钥对：\n\
  \n- 1. 首先，定义一条椭圆曲线 E：\n  - 1. 使用模数 P。\n  - 2. 系数 a 和 b。\n  - 3. 生成元 A，形成一个素数阶为 q\
  \ 的循环群。\n- 2. 随机选择一个整数 $d$，使得 $0 < d < q$。\n- 3. 计算公钥 $B$，使得 $B = d A$。\n\n公钥是如下形式的六元组：\n\
  \nKpb = (p,a,b,q,A,B)\n\n私钥是第 2 步中随机选择的 $d$：\n\nKpr = d\n\n现在可以使用私钥和公钥生成签名。\n\n\
  - 1. 首先，选择一个临时密钥 $Ke$，其中 $0 < Ke < q$。应确保 $Ke$ 是真正随机的，并且没有两个签名使用相同的密钥；否则，私钥可以被计算出来。\n\
  - 2. 使用 $R = Ke A$ 计算另一个值 $R$，即将 $A$（生成元）与随机临时密钥相乘。\n- 3. 用点 $R$ 的 $x$ 坐标值初始化变量\
  \ $r$。$r = xR$。\n- 4. 签名可以按如下方式计算：\n\nS = (h(m) + dr)Kₑ⁻¹ mod q\n\n此处，$m$ 是正在为其计算签名的消息，$h(m)$\
  \ 是消息 $m$ 的哈希值。\n\n签名验证通过以下过程进行。\n\n- 1. 辅助值 w 计算为 $w = s^{-1} mod q$。\n- 2. 辅助值\
  \ $u1 = w . h(m) mod q$。\n- 3. 辅助值 $u2 = w . r mod q$。\n- 4. 计算点 $P$，$P = u1A +\
  \ u2B$。\n- 5. 按如下方式执行验证。\n- 6. 如果第 4 步中计算的点 $P$ 的 x 坐标与签名参数 $r mod q$ 具有相同的值，则 $r,\
  \ s$ 被接受为有效签名。\n\n即：\n\n*Xp = r mod q 表示有效签名*\n\n*Xp != r mod q 表示无效签名*\n\n这里展示了各种实际示例，说明如何使用\
  \ OpenSSL 生成、使用和验证 RSA 数字签名。\n\n## 如何生成数字签名\n\n第一步是生成消息文件的哈希值：\n\n```\n:~/Crypt$\
  \ openssl dgst -sha256 message.txt\nSHA256(message.txt)=\neb96d1f89812bf4967d9fb4ead128c3b787272b7be21dd2529278db1128d559c\n\
  ```\n\n哈希生成和签名可以在一个步骤中完成，如下所示。注意，`privatekey.pem` 是在前面提供的步骤中生成的：\n\n```\n:~/Crypt$\
  \ openssl dgst -sha256 -sign privatekey.pem -out signature.bin message.txt\n```\n\
  \n现在让我们显示包含相关文件的目录：\n\n```\n:~/Crypt$ ls -ltr\ntotal 36\n-rw-rw-r-- 1 drequinox\
  \ drequinox 14 Sep 21 05:54 message.txt\n-rw-rw-r-- 1 drequinox drequinox 32 Sep\
  \ 21 05:57 message.bin\n-rw-rw-r-- 1 drequinox drequinox 45 Sep 21 06:00 message.b64\n\
  -rw-rw-r-- 1 drequinox drequinox 32 Sep 21 06:16 message.ptx\n-rw-rw-r-- 1 drequinox\
  \ drequinox 916 Sep 21 06:28 privatekey.pem\n-rw-rw-r-- 1 drequinox drequinox 272\
  \ Sep 21 06:30 publickey.pem\n-rw-rw-r-- 1 drequinox drequinox 128 Sep 21 06:43\
  \ message.rsa\n-rw-rw-r-- 1 drequinox drequinox 14 Sep 21 06:49 message.dec\n-rw-rw-r--\
  \ 1 drequinox drequinox 128 Sep 21 07:05 signature.bin\n:~/Crypt$ cat signature.bin\n\
  V_... [二进制输出已编辑] ...\n$ x... $:~/Crypt$\n```\n\n\n\n\n现在假设需要对一个名为 testsign.txt 的文件进行签名和验证。可以通过以下方式实现：\n\
  \n- 创建一个测试文件：\n\n```\n~/Crypt$ echo testing > testsign.txt\n~/Crypt$ cat testsign.txt\n\
  testing\n```\n\n- 运行以下命令，使用私钥为 testsign.txt 文件生成签名：\n\n```\n~/Crypt$ openssl dgst\
  \ -ecdsa-with-SHA1 -sign eccprivatekey.pem testsign.txt > ecsign.bin\n```\n\n- 最后，可以运行如下所示的验证命令：\n\
  \n```\n~/Crypt$ openssl dgst -ecdsa-with-SHA1 -verify eccpublickey.pem -signature\
  \ ecsign.bin testsign.txt\nVerified OK\n```\n\n也可以使用先前生成的私钥生成证书：\n\n```\n~/Crypt$\
  \ openssl req -new -key eccprivatekey.pem -x509 -nodes -days 365 -out ecccertificate.pem\n\
  You are about to be asked to enter information that will be incorporated into your\
  \ certificate request.\nWhat you are about to enter is what is called a Distinguished\
  \ Name or a DN.\nThere are quite a few fields but you can leave some blank\nFor\
  \ some fields there will be a default value,\nIf you enter '.', the field will be\
  \ left blank.\n-----\nCountry Name (2 letter code) [AU]:GB\nState or Province Name\
  \ (full name) [Some-State]:Cambridge\nLocality Name (eg, city) []:Cambridge\nOrganization\
  \ Name (eg, company) [Internet Widgits Pty Ltd]:Dr.Equinox!\nOrganizational Unit\
  \ Name (eg, section) []:NA\nCommon Name (e.g. server FQDN or YOUR name) []:drequinox\n\
  Email Address []:drequinox@drequinox.com\n```\n\n可以使用以下命令查看证书：\n\n```\n~/Crypt$\
  \ openssl x509 -in ecccertificate.pem -text -noout\n```\n\n![](img/62ab880d2302f959d34db648cb0bec5e_128_0.png)\n\
  \n使用 SHA-256 的 ECDSA 算法的 X.509 证书\n\n此处还介绍了一些其他密码学主题，因为它们与区块链相关，或可能在未来的区块链生态系统中得到应用。\n\
  \n## 同态加密\n\n通常，诸如 RSA 之类的公钥密码系统具有乘法同态性，而诸如 Paillier 之类的密码系统具有加法同态性，它们被称为部分同态系统（PHE）。加法\
  \ PHE 适用于电子投票和银行应用。直到最近，还没有同时支持这两种运算的系统，但在 2009 年，Craig Gentry 发现了一个全同态系统。由于这些方案允许在无需解密的情况下处理加密数据，因此它们有许多不同的可能应用，尤其是在需要维护隐私但数据又可能需要由潜在不可信方处理的场景中，例如云计算和在线搜索引擎。同态加密的最新发展非常有前景，研究人员正在积极努力使其更高效、更实用。这对区块链技术尤其重要，正如本书后面所述，因为它可以解决区块链中的机密性和隐私问题。\n\
  \n## 签密\n\n签密是一种公钥密码学原语，提供数字签名和加密的所有功能。它由 Yuliang Zheng 发明，现已成为 ISO 标准 ISO/IEC 29150:2011。传统上，使用先签名后加密或先加密后签名的方案来提供不可伪造性、身份验证和不可否认性，但使用签密，数字签名和加密的所有服务都能以低于先签名后加密方案的成本提供。\n\
  \n这即是**成本（签名与加密）<< 成本（签名）+ 成本（加密）**，在一个逻辑步骤中实现。\n\n## 零知识证明\n\n零知识证明由 Goldwasser、Micali\
  \ 和 Rackoff 提出。这些证明用于在不泄露关于断言任何信息的情况下证明断言的有效性。ZKP 需要三个性质，即完备性、可靠性和零知识性。\n\n完备性确保如果某个断言为真，那么诚实的证明者能够使验证者相信这一论断。可靠性确保如果断言为假，那么任何不诚实的证明者都无法说服验证者相信相反情况。零知识性，顾名思义，是零知识证明的关键性质，它确保除了断言的真假之外，绝对不泄露任何关于断言的信息。\n\
  \n零知识证明因其隐私特性引起了区块链领域研究人员的特别关注，这些特性在金融以及法律、医学等许多其他领域都备受青睐。零知识证明机制成功实施的一个近期例子是 Zcash\
  \ 加密货币。在 Zcash 中，实现了一种特定类型的零知识证明，称为**零知识简洁非交互式知识论证（ZK-Snark）**。这将在第 5 章*替代币*中详细讨论。\n\
  \n## 盲签名\n\n盲签名由 *David Chaum* 于 1982 年提出，基于 RSA 等公钥数字签名方案。盲签名背后的关键思想是让签名者对消息进行签名，而无需实际透露消息内容。这是通过在签名之前对消息进行伪装或盲化来实现的，因此得名盲签名。然后，这个盲签名可以像普通数字签名一样对照原始消息进行验证。盲签名最初是作为一种允许开发数字现金方案的机制而引入的。\n\
  \n## 编码方案\n\n除了密码学原语之外，二进制到文本的编码方案也在各种场景中使用。最常见的用途是将二进制数据转换为文本，以便可以通过不支持二进制数据处理的协议进行处理、保存或传输。例如，有时图像以\
  \ base64 编码存储在数据库中，这使得文本字段能够存储字符串。一种常用的编码方案是 base64。另一种名为 base58 的编码因其在比特币中的使用而流行起来。\n\
  \n密码学是一个广阔的领域，本节介绍了理解密码学所必需的基本概念，尤其是从区块链和加密货币的角度来看。下一节将介绍基本的金融市场概念。\n\n接下来的部分将介绍有关交易、交易所和交易生命周期的一般术语。更多相关信息将在后续章节中结合具体用例进行讨论。\n\
  \n## 金融市场与交易\n\n金融市场存在的目的是促进储蓄从储蓄者向投资者的转移。在经济体系中，有两个部门，即家庭和企业。金融市场在核心上充当储蓄者和投资者之间的中介。基本上有三种类型的市场，即货币市场、信贷市场和资本市场。货币市场是短期市场，资金被借给公司或银行进行银行间拆借。外汇（FX）是货币市场的另一个类别，其中进行货币交易。信贷市场主要由零售银行组成，它们从中央银行借入资金，并以抵押贷款或贷款的形式借给公司或家庭。\n\
  \n资本市场促进金融工具的买卖，主要是股票和债券。资本市场可分为两种类型：一级市场和二级市场。在一级市场中，公司直接向投资者发行股票；而在二级市场中，投资者通过证券交易所将证券转售给其他投资者。交易所使用各种电子交易系统来促进金融工具的交易。\n\
  \n## 交易\n\n市场是交易者进行交易的场所。它可以涵盖各种资产类别。\n\n交易可以定义为交易者买卖各种金融工具以产生利润和对冲风险的活动。投资者、借款人、套期保值者、资产交易者和投机者是几种类型的交易者。当交易者负有某项义务时（例如卖出了一份合约），他们持有空头头寸；而当他们买入合约时，则持有多头头寸。有多种交易方式，例如通过经纪商、直接在交易所或场外进行交易。经纪商是为客户安排交易的代理人。经纪商代表客户以给定价格或尽可能最优的价格进行交易。\n\
  \n## 交易所\n\n交易所通常被认为是交易非常安全、规范且可靠的地方。近年来，与传统的场内交易相比，电子交易获得了很高的普及度。现在，交易者将订单发送到中央电子订单簿，订单、价格和相关属性通过通信网络发布到所有相关系统，从而实质上创建了一个虚拟市场。交易所交易只能由交易所会员执行。为了在没有这些限制的情况下进行交易，交易对手方可以直接参与**OTC（场外交易）**。\n\
  \n## 订单与订单属性\n\n订单是交易指令，是交易系统的主要构建模块。它们具有以下一般属性：\n\n- 工具名称。\n- 数量。\n- 方向（买入或卖出）。\n\
  \n\n\n\n+   4. 表示各种条件的订单类型，例如限价单和止损单，其示例为 1500 股苏格兰皇家银行普通股，价格为 GBP £15.50。\n\n订单是基于买入价和卖出价进行交易的。交易员通过在其订单上附加买入价和卖出价来表明其买入或卖出的意向。交易员愿意买入的价格称为买入价。交易员愿意卖出的价格称为卖出价。\n\
  \n## 订单管理和路由系统\n\n订单路由系统根据业务逻辑将订单路由并交付到各个目的地。客户使用它们向其经纪人发送订单，经纪人随后将这些订单发送给交易商、清算所和交易所。\n\
  \n订单有不同类型；其中最常见的两种是市价单和限价单。市价单是指按市场上当前可获得的最佳价格进行交易的指令，这些订单会立即按现价成交。另一方面，限价单是指按可获得的最佳价格进行交易的指令，但前提是该价格不得低于交易员设定的限价。这也可以更高，具体取决于订单的方向，即卖出或买入。所有这些订单都由订单簿管理，订单簿是由交易所维护的订单列表，记录了交易员的买卖意向。\n\
  \n头寸是对以给定价格买卖一定数量金融工具的承诺，例如证券、货币或商品。交易员买卖的合约、证券、商品和货币通常被称为交易工具，属于资产类别的广泛范畴之下。最常见的类别是实物资产、金融资产、衍生品合约和保险合约。\n\
  \n## 交易的组成部分\n\n交易单是与交易相关的所有细节的组合。然而，根据工具类型和资产类别的不同会有所变化，但通常所有工具都具有下一节中讨论的属性。\n\n\
  ![](img/62ab880d2302f959d34db648cb0bec5e_132_0.png)\n\n## 基础工具\n\n基础工具是交易的基础。它可以是货币、债券、利率、商品或股票。\n\
  \n## 一般属性\n\n这包括与每笔交易相关的一般识别信息和基本特征。常见属性包括唯一 ID、工具名称、类型、状态、交易日期和时间。\n\n## 经济\n\n\
  这些是与交易价值相关的特征，例如，买入或卖出价值、代码、交易所、价格和数量。\n\n## 销售\n\n销售是指与销售特征相关的详细信息，例如销售人员的姓名，这只是一个信息字段，通常不会对交易生命周期产生任何影响。\n\
  \n## 交易对手\n\n交易对手是交易的重要组成部分，因为它显示了交易的另一方，并且需要成功结算交易。通常的属性包括交易对手名称、地址、付款类型、任何参考 ID、结算日期和交付类型。\n\
  \n## 交易生命周期\n\n一般交易生命周期包括从下单到执行再到结算的各个阶段。这一生命周期按步骤描述如下：\n\n- **预执行：** 在此阶段下达订单。\n\
  - **执行和簿记：** 当订单匹配并执行时，它会转换为交易。在此阶段，交易对手之间的合同已成熟。\n- **确认：** 这是双方交易对手同意交易具体细节的地方。\n\
  - **簿记后：** 此阶段涉及各种审查和验证流程，以确定交易的正确性。\n- **结算：** 这是交易中最重要的部分，在此阶段，交易最终确定。\n- **隔夜（每日结束处理）：**\
  \ 每日结束处理包括报告生成、盈亏计算和各种风险计算。\n\n在所有提及的流程中，涉及许多人员和业务职能。最常见的是，这些职能分为前台、中台和后台等职能。\n\n\
  在以下部分，您将了解一些概念，这些概念对于理解规范金融行业的严格和必要规则和法规至关重要。一些概念在此处描述，并在后续章节中在讨论特定用例时进行描述，这些思想将帮助您理解所描述的场景。\n\
  \n## 订单预判者\n\n订单预判者试图在其他交易员进行交易之前获利。这基于预判，即交易员知道其他交易的交易活动将如何影响价格。抢先交易者、情绪导向的技术交易员和挤压者是订单预判者的一些例子。\n\
  \n## 市场操纵\n\n市场操纵在英国和其他国家是严格非法的。欺诈性交易员可以在市场上散布虚假信息，这可能导致价格波动，从而获得非法利润。通常，操纵性市场行为是基于交易的，并且包括概括性和特定时间的操纵。能够造成股票人为短缺、虚假活动印象以及价格操纵以获取犯罪利益的行为都包含在此类别中。\n\
  \n前面讨论的两个术语都与金融犯罪相关，并且有可能开发基于区块链的系统来遏制市场滥用。这将在后续章节中详细讨论，其中将讨论具体的用例。\n\n## 摘要\n\n\
  本章旨在介绍密码学和金融市场的概念，以便为你提供背景信息，使你能够理解后续章节提供的材料。首先，你被介绍到密码学的基础知识，然后介绍了对称和非对称密码等各种方案。使用\
  \ OpenSSL 命令行的实际示例被展示，以便你能够尝试各种命令并亲身体验各种密码学功能。此外，在本章开始时提供了一些数学背景，并在必要时特别是在椭圆曲线密码学中。\
  \ 本章中介绍的所有密码学概念都与区块链技术相关，并且已在各种区块链、加密货币和相关生态系统中实现或被提议实现。此外，你还获得了金融行业的快速介绍，因为它为本书后面将讨论的与分布式账本技术相关的各种示例设定了场景。由于密码学和金融是庞大的主题，本章所涵盖的材料旨在具有入门性质（有一些例外），并且具体主题将在下一章中在相关和需要时进行更详细的扩展。\n"
- "# 4 Bitcoin\n\n### Bitcoin\n\n比特币是区块链技术的第一个应用。在本章中，读者将详细介绍比特币技术。\n\n比特币通过引入第一个完全去中心化的数字货币而引发了一场革命，并且已被证明是极其安全和稳定的。这也激发了学术界和工业界研究的极大兴趣，并引入了许多新的研究领域。自\
  \ 2008 年推出以来，比特币获得了极大的普及，目前是世界上最成功的数字货币，投入了数十亿美元。它建立在密码学、数字现金和分布式计算领域数十年的研究之上。在以下部分中，简要介绍了历史，以便提供理解比特币发明背后的基础所需的背景。\n\
  \n数字货币一直是几十年来许多人的积极研究领域。创建数字现金的早期提案可以追溯到 20 世纪 80 年代初。1982 年，*David Chaum* 提出了一种使用盲签名构建不可追踪数字货币的方案。在该方案中，银行会通过对用户向其提供的盲且随机的序列号进行签名来发行数字货币。用户随后可以将由银行签名的数字令牌用作货币。该方案的局限性在于银行必须跟踪所有已使用的序列号。这是一个按设计为中心化系统，需要用户信任。后来在\
  \ 1990 年，*David Chaum* 提出了一个名为 e-cash 的改进版本，它不仅使用了盲签名，还使用了某些私人身份数据来制作消息然后发送给银行。该方案允许检测双重支付但不能阻止它。如果同一令牌在两个不同地点使用，则双重花费者的身份将被揭示。e-cash\
  \ 只能代表固定金额的货币。*Adam Back* 于 1997 年提出的 hashcash 最初是为了遏制电子邮件垃圾邮件。hashcash 背后的想法是解决一个易于验证但相对难以计算的计算难题。\n\
  \n\n\n\n其初衷是，对于单个用户和单封电子邮件来说，额外的计算开销微不足道，但会抑制发送大量垃圾邮件的行为，因为运行垃圾邮件推广活动所需的时间和资源将大幅增加。\n\
  \nB-money 由戴伟（Wei Dai）于 1998 年提出，其中引入了使用工作量证明来创建货币的概念。该系统的一个主要弱点是，拥有更高计算能力的攻击者可以生成未经请求的货币，而无需让网络调整到适当的难度级别。该系统缺乏关于节点间共识机制的细节，同时也未解决诸如女巫攻击（Sybil\
  \ attacks）等安全问题。与此同时，Nick Szabo 提出了 BitGold 概念，它同样基于工作量证明机制，除了网络难度级别可调整这一点外，否则与\
  \ B-money 面临相同的问题。Tomas Sander 和 Amnon Ta-Shma 在 1999 年引入了一种电子现金方案，该方案首次使用默克尔树（Merkle\
  \ trees）来表示硬币，并使用零知识证明来证明对硬币的所有权。在该方案中，需要一个中央银行来记录所有已使用的序列号。尽管该方案允许用户完全匿名，但需要付出计算成本。可复用工作量证明（RPOW，Reusable\
  \ Proof of Work）由 Hal Finney 于 2004 年引入，并使用 Adam Back 的 hashcash 方案作为创建货币所花费计算资源的工作量证明。这同样也是一个集中式系统，它维护一个中心数据库以跟踪所有已使用的工作量证明代币。这是一个在线系统，利用可信计算平台（TPM\
  \ 硬件）实现的远程证明功能。\n\n上述所有方案都经过精心设计，但在某一方面或另一方面都存在弱点。特别是，所有这些方案都依赖于一个需要用户信任的中心服务器。\n\
  \n## 比特币\n\n2008 年，中本聪（Satoshi Nakamoto）撰写了关于比特币的论文：《比特币：一种点对点的电子现金系统》。该论文引入的第一个关键想法是，一种纯点对点的电子现金系统，不需要中介银行即可在对等节点之间进行付款转账。\n\
  \n比特币建立在数十年的密码学研究基础上，如默克尔树、哈希函数、公钥密码学和数字签名等方面的研究。此外，BitGold、b-money、hashcash 和加密时间戳等想法也为比特币的发明奠定了基础。比特币巧妙地将所有这些技术结合在一起，创造了世界上第一个去中心化货币。比特币解决的关键问题是对拜占庭将军问题（Byzantine\
  \ Generals problem）的优雅解决方案，以及双花问题（double-spend problem）的实用解决方案。\n\n自 2011 年以来，比特币的价值显著上涨，如下方图表所示：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_138_0.png)\n\n2012 年以来的比特币价格和交易量（对数尺度）\n\
  \n比特币的监管是一个有争议的话题，尽管它是自由主义者的梦想，但执法机构和政府正在提出各种监管措施来控制它，例如纽约州金融服务部颁发的 BitLicense。这是一种颁发给从事虚拟货币相关业务活动的企业的许可证。\n\
  \n比特币的增长也得益于所谓的网络效应。也称为需求侧规模经济，它基本上意味着使用网络的用户越多，其价值就越高。随着时间的推移，比特币网络的增长呈指数级增加。尽管比特币价格波动较大，但在过去几年中已显著上涨。目前（在撰写本文时），比特币价格为\
  \ 815 英镑。\n\n## 比特币定义\n\n比特币可以通过多种方式定义；它是一种协议、一种数字货币和一个平台。它是点对点网络、协议和软件的组合，促进了名为比特币的数字货币的创建和使用。请注意，大写的\
  \ Bitcoin 用于指代比特币协议，而小写的 bitcoin 用于指代比特币这种货币。这个点对点网络中的节点使用比特币协议彼此通信。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_140_0.png)\n\
  \n来自 bitaddress.org：纸质钱包中的私钥和比特币地址\n\n## 比特币中的公钥\n\n在公钥密码学中，公钥是从私钥生成的。比特币使用基于 SECP256K1\
  \ 标准的 ECC（椭圆曲线密码学）。私钥是随机选择的，长度为 256 位。公钥可以以非压缩或压缩格式呈现。公钥基本上是在椭圆曲线上的 x 和 y 坐标，在非压缩格式中，以十六进制格式的前缀\
  \ 04 呈现。X 和 Y 坐标长度均为 32 字节。总共，压缩公钥长度为 33 字节，而非压缩格式为 65 字节。公钥的压缩版本基本上只包含 X 部分，因为\
  \ Y 部分可以从中推导出来。压缩版公钥有效的原因是，比特币客户端最初使用的是非压缩密钥，但从比特币核心客户端 0.6 版本开始，压缩密钥被用作标准。\n\n\
  密钥由各种前缀标识，描述如下：\n\n- 非压缩公钥使用 0x04 作为前缀\n- 如果公钥的 y 坐标为奇数，则压缩公钥以 0x03 开头\n- 如果公钥的\
  \ y 坐标为偶数，则压缩公钥以 0x02 开头\n\n更详细的数学描述及其工作原理在此处说明。如果将 ECC 图表可视化，会发现 y 坐标可以在 x 轴下方或上方，并且由于曲线是对称的，因此只需存储素域中的位置即可。\n\
  \n## 比特币中的私钥\n\n私钥基本上是在 SECP256K1 ECDSA 建议指定的范围内选择的 256 位数字。从 0x1 到 0xFFFF FFFF\
  \ FFFF FFFF FFFF FFFF FFFF FFFE BAAE DCE6 AF48 A03B BFD2 5E8C D036 4140 之间随机选择的任何\
  \ 256 位数字都是有效的私钥。\n\n私钥通常使用钱包导入格式（WIF）进行编码，以便更轻松地复制和使用。WIF 可以转换为私钥，反之亦然。步骤在此处说明。\n\
  \n此外，有时还使用迷你私钥格式（Mini Private Key Format）将密钥编码为少于 30 个字符，以便在物理空间受限的情况下存储，例如在实体硬币上蚀刻或抗损坏的二维码上。比特币核心客户端还允许对包含私钥的钱包进行加密。\n\
  \n## 比特币货币单位\n\n比特币货币单位描述如下。最小的比特币单位是聪（Satoshi）。\n\n| 面额 | 缩写 | 常见名称 | BTC 值 |\n\
  |---|---|---|---|\n| Satoshi | SAT | Satoshi | 0.00000001 BTC |\n| Microbit | μBTC\
  \ (uBTC) | Microbitcoin 或 Bit | 0.000001 BTC |\n| Millibit | mBTC | Millibitcoin\
  \ | 0.001 BTC |\n| Centibit | cBTC | Centibitcoin | 0.01 BTC |\n| Decibit | dBTC\
  \ | Decibitcoin | 0.1 BTC |\n| Bitcoin | BTC | Bitcoin | 1 BTC |\n| DecaBit | daBTC\
  \ | Decabitcoin | 10 BTC |\n| Hectobit | hBTC | Hectobitcoin | 100 BTC |\n| Kilobit\
  \ | kBTC | Kilobitcoin | 1000 BTC |\n| Megabit | MBTC | Megabitcoin | 1000000 BTC\
  \ |\n\n## Base58Check 编码\n\n这种编码用于限制不同字符之间的混淆，例如 0、O、I 和 l，因为它们在不同字体中可能看起来相同。该编码基本上将二进制字节数组转换为人可读的字符串。该字符串利用\
  \ 58 个字母数字符号的集合组成。更多解释和逻辑可以在比特币源代码中的 base58.h 源文件中找到。\n\n```\n6 /**\n7 * Why base-58\
  \ instead of standard base-64 encoding?\n8 * - Don't want 0OIl characters that look\
  \ the same in some fonts and\n9 *     could be used to create visually identical\
  \ looking data.\n10 * - A string with non-alphanumeric characters is not as easily\
  \ accepted as input.\n11 * - E-mail usually won't line-break if there's no punctuation\
  \ to break at.\n12 * - Double-clicking selects the whole string as one word if it's\
  \ all alphanumeric.\n13 */\n14 #ifndef BITCOIN_BASE58_H\n```\n\n来自比特币源代码的解释\n\n\
  比特币地址使用 Base58Check 编码进行编码。\n\n## 花哨地址\n\n由于比特币地址基于 Base58 编码，因此可以生成包含人可读信息的地址。示例如下：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_142_0.png)\n\n编码在二维码中的公共地址\n\n\n\n\n\
  虚荣地址是使用纯粹的暴力方法生成的。以下截图中显示了一个示例：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_143_0.png)\n\
  \n## 交易\n\n交易是比特币生态系统的核心。交易可以简单到只是将一些比特币发送到比特币地址，也可以根据需求变得相当复杂。每笔交易至少由一个输入和一个输出组成。输入可以被视为在之前的交易中创建并正在被花费的币，而输出则是正在被创建的币。如果交易在铸造新币，则没有输入，因此不需要签名。如果交易是要将币发送给其他用户（比特币地址），则需要由发送方使用其私钥签名，并且还需要引用之前的交易以显示币的来源。币实际上是以聪为单位表示的未花费交易输出。\n\
  \n交易未加密，并且在区块链上公开可见。区块由交易组成，这些交易可以使用任何在线区块链浏览器查看。\n\n## 交易生命周期\n\n- 1. 用户/发送方使用钱包软件或其他界面发送交易。\n\
  - 2. 钱包软件使用发送方的私钥对交易进行签名。\n- 3. 交易通过洪泛算法广播到比特币网络。\n- 4. 挖矿节点将此交易包含在下一个待挖区块中。\n-\
  \ 5. 一旦某个矿工解决了工作量证明问题并将新挖出的区块广播到网络，挖矿就开始了。工作量证明将在本章后面详细解释。\n- 6. 节点验证区块并进一步传播区块，确认开始生成。\n\
  - 7. 最后，确认开始出现在接收方的钱包中，大约经过六次确认后，交易被认为已最终确认并完成。然而，六只是推荐的数字；交易在第一次确认后也可以被认为最终。等待六次确认背后的关键思想是，经过六次确认后双花概率几乎被消除。\n\
  \n## 交易结构\n\n从高层次来看，交易包含元数据、输入和输出。交易组合起来形成区块。交易结构如以下表格所示：\n\n| 字段 | 大小 | 描述 |\n\
  |---|---|---|\n| 版本号 | 4 bytes | 用于指定矿工和节点在交易处理时使用的规则。 |\n| 输入计数器 | 1 bytes – 9\
  \ bytes | 交易中包含的输入数量。 |\n| 输入列表 | variable | 每个输入由多个字段组成，包括前一笔交易哈希、前一笔Txout索引、Txin脚本长度、Txin脚本和可选的序列号。区块中的第一笔交易也称为\
  \ coinbase 交易。它指定一个或多个交易输入。 |\n| 输出计数器 | 1 bytes – 9 bytes | 表示输出数量的正整数。 |\n| 输出列表\
  \ | variable | 交易中包含的输出。 |\n| lock_time | 4 bytes | 这定义了交易变得有效的最早时间。它是 Unix 时间戳或区块编号。\
  \ |\n\n- **MetaData**：交易此部分包含一些值，例如交易大小、输入和输出数量、交易的哈希以及一个 `lock_time` 字段。每笔交易都有一个指定版本号的前缀。\n\
  - **Inputs**：通常，每个输入花费之前的输出。每个输出在被输入消耗之前被视为 **未花费交易输出 (UTXO)**。\n- **Outputs**：输出只有两个字段，它们包含发送比特币的指令。第一个字段包含聪的数量，而第二个字段是锁定脚本，其中包含为了花费输出所需满足的条件。有关使用锁定和解锁脚本花费交易和产生输出的更多信息将在本节后面讨论。\n\
  - **Verification**：验证使用比特币的脚本语言执行。\n\n示例交易如下所示：\n\n```\n{\n  \"txid\": \"08af7960ca9255c67686296fb65452ed3f96f18831c9a3d8ea552e4ccee5c4af\"\
  ,\n  \"hash\": \"08af7960ca9255c67686296fb65452ed3f96f18831c9a3d8ea552e4ccee5c4af\"\
