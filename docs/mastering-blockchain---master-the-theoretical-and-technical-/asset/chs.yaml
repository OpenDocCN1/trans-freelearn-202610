  \ *final* 版本，而是一个漫长持续改进之旅中的一个重要里程碑。预计还会有进一步的发布，但尚未命名。*web 3.0* 的愿景已经提出，并在社区中进行讨论。Web\
  \ 3.0 是一个概念，基本上提出了一个语义化和智能化的网络，作为现有 web 2.0 技术的演进。这是一个生态系统的愿景，其中人们、应用程序、数据和网络都相互连接，并且能够以智能的方式相互交互。随着区块链技术的出现，去中心化网络的想法也随之出现，这实际上是互联网最初的愿景。核心思想是，在\
  \ web 3.0 中，互联网上的所有主要服务，如 DNS、搜索引擎和身份验证都将被去中心化。这就是以太坊被设想为能够帮助实现这一愿景的平台的地方。\n\n##\
  \ 以太坊栈\n\n以太坊栈由各种组件组成。在核心，有运行在 P2P 以太坊网络上的以太坊区块链。其次，有以太坊客户端（通常是 geth），它运行在节点上并连接到点对点以太坊网络，从那里下载区块链并在本地存储。它提供各种功能，例如挖矿和账户管理。区块链的本地副本会定期与网络同步。另一个组件是\
  \ `web3.js` 库，它允许通过 **Remote Procedure Call (RPC)** 接口与 geth 进行交互。\n\n在前面的示例中，从\
  \ **Address 4718bf7a** 向 **Address 741f7a2** 发起了一笔 2 个 Ether 的转账。初始状态代表交易执行前的状态，而最终状态则是形态变化后的状态。这将在本章后面更详细地讨论，但此示例的目的是介绍以太坊中状态转换的核心思想。\n\
  \n## 货币（ETH 和 ETC）\n\n作为对矿工的激励，以太坊还奖励其原生货币称为 Ether，缩写为 ETH。在 DAO 攻击（稍后描述）之后，为缓解问题而提出了硬分叉；因此，现在有两个以太坊区块链：一个称为\
  \ Ethereum classic，其货币由 ETC 表示，而硬分叉版本是 ETH，它继续发展并进行积极开发。ETC 也有其自己的追随者，有一个专门的社区在进一步开发\
  \ ETC，它是以太坊未分叉的原始版本。本章主要关注 ETH，它是目前最活跃和官方的以太坊区块链。\n\n## 分叉\n\n随着 homestead 的最新发布，由于重大的协议升级，导致了硬分叉。协议在区块号\
  \ 1,150,000 处升级，导致从第一个以太坊版本 Frontier 迁移到第二个以太坊版本 homestead。\n\n一次最近的非故意分叉发生在 2016\
  \ 年 11 月 24 日 14:12:07 UTC，由于 geth 客户端的日志记录机制中的一个错误。网络分叉发生在区块号 2,686,351。该错误导致 geth\
  \ 在空的 out-of-gas 异常情况下无法撤销空账户删除。在 parity（另一个流行的以太坊客户端）中这不是一个问题。这意味着从区块号 2686351\
  \ 开始，以太坊区块链分裂为两个，一个运行 parity 客户端，另一个运行 geth。该问题在 geth 版本 1.5.3 发布后得到解决。\n\n## Gas\n\
  \n以太坊中的另一个关键概念是 gas。以太坊区块链上的所有交易都需要支付其执行的计算成本。该成本由一种称为 *gas* 或 *crypto fuel* 的东西来支付，这是以太坊引入的一个新概念。这种作为\
  \ *execution fee* 的 gas 由交易发起者预先支付。*fuel* 会随着每次操作而消耗。每个操作都有一个预定义的相关 gas 数量。每笔交易指定其愿意为其执行消耗的\
  \ gas 数量。如果在执行完成前 *out of gas*，则交易执行到该点为止所做的任何操作都会被回滚。如果交易成功执行，则任何剩余的 gas 会退还给交易发起者。\n\
  \n这个概念不应与矿工费混淆，矿工费是用于向矿工支付 *gas* 作为费用的不同概念。本章后面将提供有关 gas 和操作相关的概念和计算的更多信息。\n\n##\
  \ 共识机制\n\n以太坊中的共识机制基于 *Zohar* 和 *Sompolinsky* 于 2013 年 12 月首次提出的 GHOST 协议。有兴趣的人可以探索\
  \ http://eprint.iacr.org/2013/881.pdf 上的详细原始论文。\n\n以太坊使用该协议的简化版本，其中花费最多计算工作量来构建的链被确定为确定性版本。另一种看待方式是找到最长的链，因为最长的链必须是通过消耗足够的挖矿工作量构建的。**Greedy\
  \ Heaviest Observed Subtree (GHOST)** 最初被引入作为一种机制，以缓解由于快速的区块生成时间而导致陈旧或孤块的问题。在 GHOST\
  \ 中，陈旧区块被添加到计算中以确定最长和最重的区块链。在以太坊中，陈旧区块被称为 Uncles 或 Ommers。\n\n## Balance\n\n该值代表地址持有的以太坊货币（Ether）最小单位\
  \ Weis 的数量。\n\n## Storageroot\n\n该字段代表编码账户存储内容的 Merkle Patricia 树的根节点。\n\n## Codehash\n\
  \n这是一个不可变字段，包含与账户关联的智能合约代码的哈希。在普通账户的情况下，该字段包含空字符串的 Keccak 256 位哈希。该代码通过消息调用被调用。\n\
