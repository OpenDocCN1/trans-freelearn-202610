  \ 以及平台的非常丰富的文档可在 https://ripple.com/ 获取。\n\n## Stellar\n\nStellar 是一个基于区块链技术并采用名为\
  \ **Federated Byzantine Agreement (FBA)** 的新型共识模型的支付网络。FBA 通过创建受信任方的法定人数来工作。**Stellar\
  \ Consensus Protocol (SCP)** 是 FBA 的一种实现。\n\nStellar 白皮书中确定的关键问题是当前金融基础设施的成本和复杂性。这一限制要求建立一个全球金融网络，在不损害金融交易完整性和安全性的前提下解决这些问题。这一需求导致了\
  \ **Stellar Consensus Protocol (SCP)** 的发明，它是一种可证明安全的共识机制。\n\n它具有四个主要特性：*decentralized\
  \ control*，允许任何人在没有中央方的情况下参与；*low latency*，满足快速交易处理这一迫切需求；*flexible trust*，允许用户为特定目的选择他们信任的各方；最后是\
  \ *asymptotic security*，利用数字签名和哈希函数为网络提供所需的安全级别。\n\nStellar 网络允许通过其原生数字货币即 Lumens，缩写为\
  \ XLM 来转移和表示资产的价值。当交易在网络上广播时，Lumens 会被消耗，这也起到遏制 **Denial of Service (DOS)** 攻击的作用。\n\
  \n在其核心，Stellar 网络维护一个分布式账本，记录每笔交易并在每个 Stellar 服务器上复制。共识是通过在服务器之间验证交易并用更新更新账本来实现的。Stellar\
  \ 账本也可以充当分布式交易所订单簿，允许用户存储其买卖货币的报价。\n\n构成 Stellar 网络的各种工具、SDK 和软件。核心软件可在 https://github.com/stellar/stellar-core\
  \ 获取。\n\n## Rootstock\n\n在详细讨论 Rootstock 之前，重要的是定义并介绍一些对 Rootstock 设计至关重要的概念。这些概念包括侧链、驱动链和双向锚定。侧链的概念最初由\
  \ Blockstream 开发。\n\n双向锚定是一种机制，通过该机制，价值（币）可以在一条区块链与另一条区块链之间以及反向转移。链之间并没有真正的币转移。这一想法围绕着将相同数量和价值的币锁定在比特币区块链（主链）中，并在次级链中解锁等量代币的概念展开。\n\
  \n牢记这一定义，侧链可以定义如下所述。\n\n### Sidechain\n\n这是一个与主区块链并行运行的区块链，允许在它们之间转移价值。这意味着一个区块链的代币可以在侧链中使用，反之亦然。这也称为锚定侧链，因为它支持双向锚定资产。\n\
  \n## Drivechain\n\n这是一个相对较新的概念，其中解锁锁定在主链中的比特币的控制权交给矿工，矿工可以投票决定何时解锁。这与侧链形成对比，在侧链中，共识是通过简单的支付验证机制来验证，以便将币转移回主链。\n\
  \nRootstock 是一个智能合约平台，具有与比特币区块链的双向锚定。核心思想是提高比特币系统的可扩展性和性能，并使其能够使用智能合约。Rootstock\
  \ 运行一个名为 Rootstock Virtual Machine (RVM) 的图灵完备确定性虚拟机。它也与以太坊虚拟机兼容，允许用 solidity 编译的合约在\
  \ Rootstock 上运行。智能合约也可以在比特币区块链经过时间考验的安全性下运行。Rootstock 区块链通过与比特币合并挖矿来工作。这使得 RSK 区块链能够达到与比特币相同的\
  \ fiy 安全级别。这对于防止双花和实现结算最终性尤其正确。它允许可扩展性，每秒多达 100 笔交易。\n\nRSK 最近发布了一个名为 Turmeric 的测试网络。它可在\
  \ http://www.rsk.co/ 获取。\n\n## Quorum\n\n这是一个通过增强现有以太坊区块链而构建的区块链解决方案。Quorum 中引入了几个增强功能，例如交易隐私和新的共识机制。Quorum\
  \ 引入了一种名为 QuorumChain 的新共识模型，该模型基于多数投票和基于时间机制。另一个名为 Constellation 的功能也被引入，这是一个通用机制，用于提交信息并允许对等方之间进行加密通信。此外，节点级别的许可由智能合约管理。它还提供比公共以太坊区块链更高的性能水平。\n\
  \n多个组件构成了 Quorum 区块链生态系统。这些在以下部分列出。\n\n## Transaction manager\n\n此组件使能够访问加密的交易数据。它还管理本地存储并与网络上的其他\
  \ Transaction managers 进行通信。\n\n\n\n\n\n## Crypto Enclave\n\n顾名思义，该组件负责提供加密服务以确保交易隐私。它还负责执行密钥管理功能。\n\
  \n## QuorumChain\n\n这是 Quorum 中的关键创新。它是一种拜占庭容错共识机制，允许通过区块链网络上的交易进行投票的验证和流通。在此方案中，使用智能合约来管理共识过程，并且可以授予节点投票权以投票决定应接受哪个新区块。一旦选民收到适当数量的投票，该区块即被视为有效。节点可以有两种角色，即\
  \ Voter 或 Maker。Voter 节点允许投票，而 Maker 节点则是创建新区块的节点。节点可以拥有任一权限、无权限或仅一种权限。\n\n## Network\
  \ manager\n\n该组件为许可网络提供访问控制层。\n\nQuorum 网络中的节点可以承担多种角色，例如允许创建新区块的 Maker 节点。交易隐私通过密码学以及某些交易仅供相关参与者查看的概念来实现。这一想法类似于上一章中讨论的\
  \ Corda 的私有交易概念。由于它允许区块链上同时存在公共和私有交易，因此状态数据库已被划分为两个数据库，分别代表私有和公共交易。因此，有两棵独立的 Patricia-Merkle\
  \ 树代表网络的私有和公共状态。私有合约状态哈希用于在交易各方之间的私有交易中提供共识证据。\n\nQuorum 网络中的交易由各种元素组成，例如接收方、用于识别交易发起者的发送方数字签名、可选的以太币金额、允许查看交易的参与者可选列表，以及在私有交易情况下包含哈希的字段。\n\
  \n交易在到达目的地之前会经过多个步骤。这些步骤详细描述如下：\n\n- 1. 用户应用程序（DAPPs）通过区块链网络公开的 API 将交易发送到 Quorum\
  \ 节点。这也包含接收方地址和交易数据。\n- 2. API 然后加密负载并应用任何其他必要的加密算法以确保交易的隐私，并将其发送到 Transaction manager。此步骤同时计算加密负载的哈希值。\n\
  - 3. 收到交易后，Transaction manager 验证交易发送方的签名并存储消息。\n- 4. 先前加密负载的哈希值被发送到 Quorum 节点。\n\
  - 5. 一旦 Quorum 节点开始验证包含私有交易的区块，它就会从 Transaction manager 请求更多相关数据。\n- 6. 一旦 Transaction\
  \ manager 收到此请求，它就会将加密负载和相关的对称密钥发送给请求方 Quorum 节点。\n- 7. 一旦 Quorum 节点拥有所有数据，它就会解密负载并将其发送到\
  \ EVM 执行。这就是 Quorum 如何在区块链上使用对称加密实现隐私，同时能够使用原生以太坊协议和 EVM 分别进行消息传输和执行。\n- 8. 类似的概念，但有几个方面差异很大，已在\
  \ Hydrachain 的形式下提出，该方案基于以太坊区块链并允许创建许可的分布式账本。\n\nQuorum 可在 https://github.com/jpmorganchase/quorum\
  \ 下载。\n\n## Tezos\n\nTezos 是一种通用自修改加密账本，这意味着它不仅允许对区块链状态进行去中心化共识，还允许对协议和节点随时间如何演进达成共识。Tezos\
  \ 的开发旨在解决比特币协议中的局限性，例如硬分叉引起的问题、成本、由于工作量证明导致的算力集中化、有限的脚本能力以及安全问题。它是用一种纯函数式语言 OCaml\
  \ 开发的。\n\nTezos 分布式账本的架构分为三个层：网络层、共识层和交易层。这种分解允许协议以去中心化的方式演进。为此，Tezos 中实现了一个通用网络外壳，负责维护区块链，该区块链由共识层和交易层的组合表示。该外壳在网络和协议之间提供接口层。还引入了种子协议的概念，该概念用作允许网络上的利益相关者批准对协议的任何更改的机制。与传统区块链从创世区块开始不同，Tezos\
  \ 区块链从种子协议开始。\n\n该种子协议负责定义区块链中修正的程序，甚至是修正协议本身。Tezos 中的奖励机制基于 **Proof of Stake (PoS)**\
  \ 算法，因此不需要挖矿。\n\nTezos 中已开发出合约脚本语言用于编写智能合约，这是一种基于栈的图灵完备语言。Tezos 中的智能合约是形式可验证的，这允许代码在数学上被证明其正确性。\n\
  \nTezos 代码可在 https://github.com/tezos/tezos 获取。\n\n## Storj\n\n现有的基于云的存储模型都是集中式解决方案，其安全性可能并不如用户所期望的那样。需要一种安全、高可用性、更重要的是去中心化的云存储系统。Storj\
  \ 旨在提供基于区块链的、去中心化和分布式的存储。它是由社区共享的云，而不是由中央组织共享。它允许节点作为自主代理之间执行存储合约。这些代理（节点）执行各种功能，例如数据传输、验证和执行数据完整性检查。核心概念基于\
  \ **Distributed Hash Tables (DHT)** - Kademlia，然而该协议在 Storj 中通过添加新的消息类型和功能得到了增强。它还实现了一种点对点\
  \ **publish/subscribe (pub/sub)** 机制，称为 Quasar，可确保消息成功到达对存储合约感兴趣的节点。这是通过一种基于布隆过滤器的存储合约参数选择机制实现的，称为\
  \ **topics**。\n\nStorj 以加密格式将文件存储在网络各处。在文件存储到网络之前，它会使用 AES-256-CTR 对称加密进行加密，然后以分片的方式分布式存储在网络上。将文件拆分为片段的过程称为\
  \ **sharding**，从而提高了网络的可用性、安全性和性能以及隐私性。此外，如果节点失败，分片仍然可用，因为默认情况下单个分片存储在网络上的三个不同位置。\n\
  \n它维护一条区块链，作为共享账本并实现标准安全功能，例如公共/私有密钥密码学和哈希函数，类似于任何其他区块链。由于系统基于节点之间的硬盘共享，任何人都可以贡献其驱动器上的额外空间并用\
  \ Storj 自有的加密货币 **Storjcoinx (SJCX)** 获得报酬。SJCX 被开发为 *counterparty* 资产并利用比特币区块链进行交易。\n\
  \nStorj 代码可在 https://github.com/Storj/ 获取。\n\n## Maidsafe\n\n这也是一个类似于 Storj 的分布式存储系统。用户因其对网络的存储空间贡献而获得\
  \ Safecoin 奖励。这种支付机制由 *proof of resource* 治理，确保用户承诺给网络的磁盘空间可用，如果不可用，则 Safecoin 的支付会相应减少。文件在传输到网络进行存储之前会被加密并分割成小部分。Maidsafe\
  \ 中还引入了 **opportunistic caching** 的概念，这是一种在物理上更接近访问请求来源处创建频繁访问数据的副本的机制，从而提高了网络性能。SAFE\
  \ 网络的另一个新颖特性是它会自动删除网络上的任何重复数据，从而减少存储需求。此外，还引入了 **churning** 的概念，这基本上意味着数据在网络中不断移动，以便数据无法被恶意对手针对。它还在网络中保留数据的多个副本，以提供冗余，以防节点离线或失败。\n\
  \n## BigChainDB\n\n这是一个可扩展的区块链数据库。它本身并不是严格意义上的区块链，而是通过提供去中心化数据库来补充区块链技术。其核心是一个分布式数据库，但增加了区块链的属性，例如去中心化、不可变性和数字资产处理。它还允许使用\
  \ NoSQL 查询数据库。其目的是在去中心化生态系统中提供数据库，其中不仅处理是去中心化的（区块链）或文件系统是去中心化的（例如 IPFS），数据库也是去中心化的。这使得整个去中心化应用程序生态系统都实现了去中心化。这可在\
  \ https://www.bigchaindb.com/ 获取。\n\n## Multichain\n\nMultichain 已被开发为私有区块链的开发和部署平台。它基于比特币代码并解决了安全、可扩展性和隐私问题。它是一个高度可配置的区块链平台，允许用户设置不同的区块链参数。它通过细粒度的\
  \ Permissioning 层支持控制和隐私。Multichain 的安装非常快速，安装文件的链接可在 http://www.multichain.com/download-install/\
  \ 获取。\n\n\n\n\n## Tendermint\n\nTendermint 是一种软件，可为应用程序提供拜占庭容错共识机制和状态机复制功能。其主要目标是构建一个通用、安全且高性能的复制状态机。\n\
  \nTendermint 包含两个组件，下文将分别介绍。\n\n### Tendermint 核心\n\n这是一个共识引擎，能够确保网络中每个节点上交易的安全复制。\n\
  \n### Tendermint 套接字协议（TMSP）\n\n这是一个应用程序接口协议，允许与任何编程语言进行交互以处理交易。\n\nTendermint 允许将应用程序进程与共识进程解耦，从而让任何应用程序都能受益于该共识机制。\n\
  \nTendermint 共识算法是一种基于轮次的机制，验证节点在每一轮中提议新区块。为防止在区块链同一高度上选择两个不同区块进行提交的情况，使用了锁定机制。每个验证节点都维护着一个完整的本地复制账本，其中包含含有交易的区块。每个区块包含一个区块头，区块头由前一个区块的哈希、区块提议的时间戳、当前区块高度以及区块内所有交易的\
  \ Merkle 根哈希组成。\n\nTendermint 最近被用于 **Cosmos**。Cosmos 是一个区块链网络，允许运行在 BFT 共识算法上的不同链之间实现互操作。该网络上的区块链被称为区域（zone）。Cosmos\
  \ 中的第一个区域称为 Cosmos hub，它实际上是一个公有区块链，负责为其他区块链提供连接服务。为此，hub 使用了 **跨区块链通信协议（IBC）**。IBC\
  \ 协议支持两种交易类型，分别称为 *IBCBlockCommitTx* 和 *IBCPacketTx*。前者用于向任何一方提供区块链中最新区块哈希的证明，后者用于提供数据源认证。从一条区块链向另一条区块链发布数据包时，需要先在目标链上发布一个证明。接收方（目标）链检查该证明，以验证发送方链确实发布了该数据包。此外，它还有一种自己的原生货币，称为\
  \ Atom。这种方案允许多个区块链连接到 hub，从而解决了可扩展性和互操作性问题。\n\n## 使用 BlockApps 进行应用开发与部署\n\n第一步是使用以下命令初始化\
  \ BlockApps 应用：\n\n```bash\n$ bloc init\n```\n\n它会询问几个参数：应用名称、您的姓名、电子邮件、API URL（apiUrl）和区块链配置文件。如下面的截图所示。\n\
  \n命令运行并成功完成后，它会创建一个包含模板和示例的应用目录。在本例中，将创建一个名为 `testApp` 的目录，其中包含相关子目录和示例合约。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_427_0.png)\n\
  \n下一步是安装 `testApp`，可通过运行以下命令来完成：\n\n```bash\n$ sudo npm install\n```\n\n## 其他区块链\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_428_0.png)\n\n为了对交易进行签名，需要生成一个新密钥。可以使用以下命令生成密钥：\n\
  \n```\n$ bloc genkey\n```\n\n生成后，需输入密码以保护该密钥。输入密码后，将创建密钥并生成一个 JSON 文件。请注意，JSON 文件名就是该账户在区块链上的实际地址。此外，它还会显示一条“transaction\
  \ mined”消息，分别表示密钥和交易（账户创建）已成功部署。\n\n整个过程如下面的截图所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_428_1.png)\n\
  \n现在，可以使用 curl 查询新账户。只需在 URL 中将地址作为参数传递，结果就会以 JSON 格式返回。\n\n```\ndrequinox@drequinox-OP7010:~/testApp$\
  \ curl http://strato-dev4.blockapps.net/eth/v1.2/account?address=b16fe63de8fcf9d7f1d787cba37a02309104316\n\
  [{\"contractRoot\":\"56e81f171bcc55a6ff8345e692c0f86e5b48e01b996cadc001622fb5e363b421\"\
  ,\"kind\":\"AddressStateRef\",\"balance\":\"1000000000000000000\",\"address\":\"\
  b16fe63de8fcf9d7f1d787cba37a02309104316\",\"latestBlockNum\":79860,\"code\":\"\"\
  ,\"nonce\":0}]drequinox@drequinox-OP7010:~/testApp$\n```\n\n![](img/62ab880d2302f959d34db648cb0bec5e_429_0.png)\n\
  \n或者，也可以通过任意 Web 浏览器执行查询，如下面的截图所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_429_1.png)\n\
  \n下一步将描述把新合约上传到测试链的过程。请注意，所有合约都放在 `testApp` 目录下的 `./app/contracts` 目录中。作为示例，我们选择\
  \ `Greeter.sol` 合约部署到网络。BlockApps 提供了一种简单的方法来实现此部署。\n\n所有合约都需要放在 contracts 目录下，编译命令才能找到它们并进行编译。\n\
  \n```\ndrequinox@drequinox-OP7010:~/testApp/app/contracts$ pwd\n/home/drequinox/testApp/app/contracts\n\
  drequinox@drequinox-OP7010:~/testApp/app/contracts$ ll\ntotal 40\ndrwxrwxr-x 2 drequinox\
