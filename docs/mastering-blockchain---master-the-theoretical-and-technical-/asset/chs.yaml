  ## 智能预言机


  智能预言机的概念也已在Codius中提出并实现。智能预言机本质上与预言机类似，但增加了合约代码执行的能力。Codius提出的智能预言机使用Google Native
  Client运行，这是一个用于运行不受信任的x86本地代码的沙盒环境。Codius可在 https://www.codius.org/ 获取。


  ## 在区块链上部署智能合约


  智能合约可以部署在区块链上，也可以不部署在区块链上，但由于区块链提供的分布式共识机制，将其部署在区块链上是合理的。以太坊就是一个原生支持智能合约开发和部署的区块链示例。以太坊区块链上的智能合约通常是更大应用的一部分，例如**去中心化自治组织（DAO）**。


  相比之下，在比特币区块链中，比特币交易中的`lock_time`字段可以被视为一个基础版本智能合约的使能器。`lock_time`字段使交易可以被锁定，直到指定时间或经过一定数量的区块后才解锁，从而强制执行一个基础合约：只有满足特定条件（经过的时间或区块数量）后，交易才能被解锁。然而，这在本质上非常有限，应仅被视为一个基础智能合约的示例。除了上述示例之外，比特币脚本语言虽然有限，但可以用来构建基础智能合约。一种可能性是向一个比特币地址提供资金，任何展示出哈希碰撞攻击的人都可以花费这笔资金。这个想法最早在Bitcointalk论坛上提出，更多信息可以在
  https://bitcointalk.org/index.php?topic=293382.0 找到。这也可以被视为智能合约的一种基础形式。


  ## The DAO


  The DAO是众筹金额最高的项目之一，始于2016年4月。它本质上是一组为提供投资平台而编写的智能合约。由于代码中的一个缺陷，该项目在2016年6月遭到黑客攻击，价值相当于5000万美元的资金被从DAO中转出到另一个账户。这导致以太坊进行了硬分叉以从攻击中恢复。需要注意的是，对*代码即法律*或不可停止的智能合约这一概念应持一定的怀疑态度，因为这些概念的实现还不够成熟，不足以获得完全且毋庸置疑的信任。最近的事件证明了这一点：以太坊基金会通过引入硬分叉，能够停止并改变*The
  DAO*的执行。尽管这次硬分叉是出于正当原因，但它违背了去中心化的真正精神以及*代码即法律*的理念。另一方面，对这次硬分叉的抵制，以及一些决定在原始链上继续挖矿的矿工，导致了以太坊经典（Ethereum
  Classic）的诞生。这就是原始的、未分叉的以太坊区块链，在那里*代码仍然是法律*。


  ## 智能合约


  这次攻击凸显了智能合约的危险性，以及开发一种正式智能合约语言的绝对必要性。这次攻击还凸显了彻底测试的重要性。最近，在以太坊的智能合约开发语言中发现了各种漏洞。因此，制定一个标准框架来解决所有这些问题至关重要。如前所述，一些工作已经开始，但为了应对智能合约语言中的局限性，这个领域还有更多研究空间。


  ## 总结


  本章首先介绍了智能合约的历史，然后详细讨论了智能合约的定义。由于对智能合约的标准定义尚未达成一致，我们尝试引入一个涵盖智能合约核心要点的定义。本章还介绍了李嘉图合约，并解释了李嘉图合约与智能合约之间的区别，强调李嘉图合约关注合约的定义，而智能合约则面向合约的实际执行。本章讨论了智能合约模板的概念，学术界和工业界目前正在就该主题进行高质量的积极研究。本章还讨论了一些关于创建高级领域特定语言以创建智能合约或智能合约模板的想法。在本章后续章节中，引入了预言机的概念，随后简要讨论了DAO以及DAO和智能合约中的安全问题。

