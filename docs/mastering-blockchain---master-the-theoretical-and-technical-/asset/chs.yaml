  \n## 引言\n\n以太坊由*维塔利克·布特林*（Vitalik Buterin）于2013年11月提出构想。其核心提议是开发一种图灵完备的语言，允许为区块链和去中心化应用开发任意程序（智能合约）。这与比特币形成鲜明对比，比特币的脚本语言非常有限，仅允许基本和必要的操作。\n\
  \n## 以太坊客户端与版本\n\n各种以太坊客户端已使用不同的语言开发，目前最流行的是 go-Ethereum 和 parity。go-Ethereum 使用\
