  \nGreeter 合约的编译\n\n\n\n\n\n## 其他区块链\n\n最后，可以使用以下命令上传合约。该命令期望按照合约代码中定义的参数来传递。在示例中，它期望一个文本字符串，如下面的示例截图所示：\n\
  \n```\n```bash\n$ bloc upload Greeter \"Hello bloc\"\n```\n```\n\n![](img/62ab880d2302f959d34db648cb0bec5e_432_0.png)\n\
  \n上传 Greeter 合约\n\n请注意，如果传递的参数不正确或缺失，将会出现类似于以下截图的错误：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_432_1.png)\n\
  \n参数错误或缺失时的错误\n\n部署成功后，可以验证以太币已经从现有合约转移到新合约。请注意，余额已经下降。如下图所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_432_2.png)\n\
  \n通过 Web 浏览器安装后的已部署合约\n\n部署合约后，可以使用 Web 浏览器或任何 CLI 工具（如 cURL）查询它。需要将 URL http://strato-dev4.blockapps.net/eth/v1.2/account?address=05ee3af04e903f413402d5438b9de3827b1f4e70\
  \ 传递给 Web 浏览器。如下面的截图所示。请注意，二进制格式的代码也可在输出中获得。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_433_0.png)\n\
  \n此外，BlockApps 提供了一个运行本地 HTTP 服务器的功能，可以使用以下命令启动：\n\n```\n$ bloc start\n```\n\n这将启动\
  \ Web 浏览器，并监听 TCP 端口 8000。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_433_1.png)\n\
  \nWeb 服务器启动后，可以通过本地网页查看和查询已编译的合约，如下面的截图所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_434_0.png)\n\
  \n通过浏览器可用的已编译合约\n\n如前面的示例所示，使用 BlockApps 可以更轻松地构建、部署和管理合约。BlockApps 旨在为区块链应用程序提供工具和核心基础设施，而不仅仅是区块链本身。\n\
  \n## Eris\n\nEris 不是一个单一的区块链，而是一个由 Monax 开发的开源模块化平台，用于开发基于区块链的生态系统应用程序。它提供了各种框架、SDK\
  \ 和工具，可加速区块链应用程序的开发和部署。Eris 应用平台背后的核心思想是支持区块链后端生态系统应用程序的开发和管理。它允许与多个区块链集成，并使各种第三方系统能够与其他系统交互。该平台使用\
  \ Solidity 语言编写的智能合约。它可以与以太坊或比特币等区块链交互。交互可以包括连接命令、启动、停止、断开连接以及创建新的区块链。与区块链的设置和交互相关的复杂性已在\
  \ Eris 中被抽象化。所有命令都针对不同的区块链进行了标准化，无论目标区块链类型如何，都可在整个平台上使用相同的命令。\n\n生态系统应用程序可以包含 Eris\
  \ 平台，使 API 网关能够允许遗留应用程序连接到密钥管理系统、共识引擎和应用引擎。Eris 平台提供了各种工具包，用于向开发人员提供各种服务。这些模块描述如下：\n\
  \n- **链（Chains）**：这允许创建区块链并与之交互。\n- **包（Packages）**：这允许开发智能合约。\n- **密钥（Keys）**：这用于密钥管理和签名操作。\n\
  - **文件（Files）**：这允许处理分布式数据管理系统。它可用于与 IPFS 和数据湖等文件系统交互。\n- **服务（Services）**：这提供了一组服务，允许管理和集成生态系统应用程序。\n\
  \nEris 还开发了多个 SDK，用于开发和管理生态系统应用程序。这些 SDK 包含经过全面测试的智能合约，可满足业务的特定需求和要求。例如，金融 SDK、保险\
  \ SDK 和物流 SDK。还有一个基础 SDK，作为管理生态系统应用程序生命周期的基础开发套件。\n\nMonax 开发了自己的许可制区块链客户端，称为 Eris:db。它是一个**基于权益证明（PoS）**的区块链系统，允许与多种不同的区块链网络集成。`Eris:db`\
  \ 包含三个组件：\n\n- **共识**：这基于前面讨论过的 Tendermint 共识机制。\n- **虚拟机**：Eris 使用**以太坊虚拟机（EVM）**，因此它支持用\
  \ Solidity 编译的合约。\n- **权限层**：作为许可制账本，Eris 提供了一种访问控制机制，可用于为网络上的不同实体分配特定角色。\n- **接口**：这提供了各种命令行工具和\
  \ RPC 接口，以实现与后端区块链网络的交互。\n\n以太坊区块链与 Eris:db 之间的关键区别在于，Eris:db 使用实用拜占庭容错算法，该算法以基于存款的权益证明（DPOS\
  \ 系统）实施，而以太坊使用**工作量证明（PoW）**。此外，`Eris:db` 使用 ECDSA ed22519 曲线方案，而以太坊使用 secp256k1\
  \ 算法。最后，Eris:db 是带访问控制层的许可链，而以太坊是一个公有区块链。\n\nEris 是一个功能丰富的应用平台，提供大量工具包和服务来开发基于区块链的应用程序。可在\
  \ https://monax.io/ 获取。\n\n## 总结\n\n本章首先介绍了其他区块链，并分为两个主要部分，分别讨论区块链和平台。区块链技术是一个非常活跃的领域，因此现有解决方案的变化相当迅速，几乎每天都会出现新的相关技术或工具。本章讨论了一系列经过精心挑选的平台和区块链。还讨论了几种补充前几章内容的解决方案，例如支持以太坊开发的\
  \ BlockApps。还讨论了新的区块链，如 Kadena，各种新协议，如 Ripple，以及侧链和驱动链等概念。本章涵盖的材料旨在为读者感兴趣的领域进行更深入的研究奠定坚实基础。如前所述，区块链是一个发展非常迅速的领域，还有许多其他区块链提案项目，例如\
  \ Tauchain、Hydrachain、Elements、Credits 等，本章并未讨论。鼓励读者关注该领域的发展，以便跟上这一快速增长的领域的最新进展。\n"
- "# 11 区块链——货币之外\n\n## 区块链——货币之外\n\n数字货币是区块链技术的首个应用，可以说当时并未意识到其真正的潜力。随着比特币的发明，区块链的概念首次被引入，但直到\
  \ 2013 年，随着区块链 2.0 的出现，人们才意识到区块链在众多不同行业中的真正价值和可能应用。此后，区块链技术在不同行业中的许多用例被提出，包括但不限于金融、物联网、数字版权管理、政府和法律。本章选取了四个主要行业进行讨论，即物联网（IoT）、政府、健康、金融。读者将了解所有这些领域，并看到各种相关的用例。\n\
  \n## 物联网\n\n物联网（简称 IoT）近年来因其改变业务应用和日常生活的潜力而受到广泛关注。物联网可以定义为由计算智能物理对象组成的网络，这些对象能够连接到互联网，感知现实世界的事件或环境，对这些事件做出反应，收集相关数据，并通过互联网进行通信。这个简单的定义具有深远的影响，并催生了令人兴奋的概念，如可穿戴设备、智能家居、智能电网、智能互联汽车和智慧城市，这些都基于物联网设备的基本概念。在剖析了上述物联网的定义后，物联网设备执行的四个功能凸显出来：感知、反应、收集和通信。所有这些功能都是通过使用物联网设备上的各种组件来执行的。\n\
  \n\n\n\n\nSensing is performed by sensors. Reacting or controlling is performed\
  \ by actuators, collection is a function of various sensors, and communication is\
  \ performed by chips that provide network connectivity. One thing to note is that\
  \ all these components are accessible and controllable via the Internet in the IoT.\
  \ An IoT device on its own is perhaps useful to some extent but if it is part of\
  \ a larger IoT ecosystem it is more valuable.\n\nA typical IoT can consist of many\
  \ physical objects connecting with each other and to a centralized cloud server.\
  \ This is shown in the diagram below:\n\n![](img/62ab880d2302f959d34db648cb0bec5e_438_0.png)\n\
  \nA typical IoT network: source-IBM\n\nElements of IoT are spread across multiple\
  \ layers and various reference architectures exist that can be used to develop IoT\
  \ systems. Generally, a five layer model can be used to describe IoT, which contains\
  \ a physical object layer, device layer, network layer, services layer, and application\
  \ layer. Each layer or level is responsible for various functions and includes various\
  \ components. These are described in detail below.\n\n## Physical object layer\n\
  \nThese include any physical real-world objects includes people, animals, cars,\
  \ trees, fridges, trains, factories, homes, and in fact anything that is required\
  \ to be monitored and controlled can be connected to the IoT.\n\n## Device layer\n\
  \nThis layer contains things that make up the IoT such as sensors, transducers,\
  \ actuators, smart phones, smart devices, and Radio Frequency Identification tags\
  \ (RFIDs). There can be many categories of sensors such as body sensors, home sensors,\
  \ and environmental sensors based on the type of work they perform. This is the\
  \ core of an IoT ecosystem where various sensors are used to sense real-world environments.\
  \ This includes sensors that can monitor temperature, humidity, liquid flow, chemicals,\
  \ air, pressure, and much more. Usually, an Analog to Digital Converter (ADC) is\
  \ required on a device in order to turn the real-world analog signal into a digital\
  \ signal that a microprocessor can understand.\n\nActuators in this layer provide\
  \ the means to enable control of external environments, for example, starting a\
  \ motor or opening a door. These components also require digital to analog converters\
  \ in order to convert a digital signal into analogue. This is especially relevant\
  \ when control of a mechanical component is required by the IoT device.\n\n## Network\
  \ layer\n\nThis layer is composed of various network devices that are used to provide\
  \ Internet connectivity between devices and to the cloud or servers that are part\
  \ of the IoT ecosystem. These devices can include gateways, routers, hubs, and switches.\
  \ This layer can include two types of communication. First is the horizontal means\
  \ of communication, which includes radio, Bluetooth, WiFi, Ethernet, LAN, ZigBee,\
  \ and PAN and can be used to provide a communication between IoT devices. Second,\
  \ we have communicating to the next layer, which is usually through the Internet\
  \ and provides communication between machines and people or other upper layers.\
  \ The first layer can optionally be included in the device layer as it physically\
  \ is residing on the device layer where devices can communicate with each other\
  \ at the same layer.\n\n## Management layer\n\nThis layer provides the management\
  \ layer for the IoT ecosystem. This includes platforms that enable processing of\
  \ data gathered from the IoT devices and turn that into meaningful insights. Also,\
  \ device management, security management, and data flow management are included\
  \ in this layer. It also manages communication between the device and application\
  \ layers.\n\n## Application layer\n\nThis layer includes applications running on\
  \ top of the IoT network. This can include a number of applications depending on\
  \ the requirements such as transportation, healthcare, financial, insurance, or\
  \ supply chain management. This of course is not an exhaustive list by any stretch\
  \ of the imagination; there is a myriad of IoT applications that can fall into this\
  \ layer:\n\n![](img/62ab880d2302f959d34db648cb0bec5e_440_0.png)\n\nWith the availability\
  \ of cheap sensors, hardware, and bandwidth, IoT has gained popularity in recent\
  \ years and currently has applications in many different areas including healthcare,\
  \ insurance, supply chain management, home automation, industrial automation, and\
  \ infrastructure management. Moreover, advancements in technology such as the availability\
  \ of IPv6, smaller and powerful processors, and better Internet access have also\
  \ played a vital role in the popularity of IoT. The benefits of IoT range from cost\
  \ saving to enabling businesses to make vital decisions and thus improve performance\
  \ based on the data provided by the IoT devices. Raw data from millions of things\
  \ (IoT devices) is analyzed and provides meaningful insights that help in making\
  \ timely and effective business decisions.\n\nThe above mentioned five-layer IoT\
  \ model can be adapted to a blockchain-based model by adding a blockchain layer\
  \ on top of the network layer. This layer will run smart contracts, and provide\
  \ security, privacy, integrity, autonomy, scalability, and decentralization services\
  \ to the IoT ecosystem. The management layer in this case can consist of only software\
  \ related to analytics and processing, and security and control can be moved to\
  \ the blockchain layer. This can be visualized in the following diagram:\n\n| Application\
  \ Layer |\n| Transportation, financial, insurance and many others |\n| Management\
  \ Layer |\n| Data processing, analytics |\n| Blockchain Layer |\n| Security, P2P\
  \ (M2M) autonomous transactions, decentralization, smart contracts |\n| Network\
  \ Layer |\n| LAN, WAN, PAN, Routers |\n| Device Layer |\n| Sensors , Actuators,\
  \ smart devices |\n| Physical Objects |\n| People, cars, homes etc. etc. |\n\nBlockchain-based\
  \ IoT model\n\nIn this model, other layers would perhaps remain the same but an\
  \ additional blockchain layer will be introduced as a middleware between all participants\
  \ of the IoT network.\n\nIt can also be visualized as a peer-to-peer IoT network\
  \ after abstracting away all the layers mentioned above. This is shown in the following\
  \ diagram where all devices are communicating and negotiating with each other without\
  \ a central command and control entity:\n\n![](img/62ab880d2302f959d34db648cb0bec5e_443_0.png)\n\
  \nBlockchain-based direct communication model, source-IBM\n\nIt can also result\
  \ in cost saving which is due to easier device management by using a blockchain\
  \ based decentralised approach. The IoT network can be optimized for performance\
  \ by using blockchain. In this case there will be no need to store IoT data centrally\
  \ for millions of devices because storage and processing requirements can be distributed\
  \ to all IoT devices on the blockchain. This can result in completely removing the\
  \ need for large data centres for processing and storing the IoT data.\n\nBlockchain-based\
  \ IoT can also thwart denial of service attacks where hackers can target a centralized\
  \ server or data centre more easily but with blockchain's distributed and decentralized\
  \ nature, such attacks are no longer possible. Additionally, if as estimated there\
  \ will be billions of devices connected to the Internet in the near future, it will\
  \ become almost impossible to manage security and updates of all those devices from\
  \ traditional centrally-owned servers. Blockchain can provide a solution to this\
  \ problem by allowing devices to communicate with each other directly in a secure\
  \ manner and even request firmware and security updates from each other. On a blockchain\
  \ network these communications can be recorded immutably and securely which will\
  \ provide auditability, integrity, and transparency to the system. This is not possible\
  \ with traditional P2P systems.\n\nIn summary, there are clear benefits that can\
  \ be reaped with the convergence of IoT and blockchain and a lot of research and\
  \ work in academia and industry are already in progress. There are various projects\
  \ already proposed providing blockchain-based IoT solutions. For example, IBM Blue\
  \ Horizon and IBM Bluemix are IoT platforms supporting blockchain IoT platforms.\
  \ Various start-ups such as Filament have already proposed novel ideas on how to\
  \ build a decentralised network that enables devices on IoT to transact with each\
  \ other directly and autonomously driven by smart contracts.\n\nIn the following\
  \ section, a practical example is provided on how to build a simple IoT device and\
  \ connect it to the Ethereum blockchain. This IoT device is connected to the Ethereum\
  \ blockchain and is used to open a door (in this case the door lock is represented\
  \ by an LED) when the appropriate amount of funds are sent by a user on the blockchain.\
  \ This is a simple example and requires a more rigorously-tested version in order\
  \ to implement it in production but it demonstrates how an IoT device can be connected,\
  \ controlled, and responded to in response to certain events on an Ethereum blockchain.\n\
  \n## IoT blockchain experiment\n\nThis example makes use of a Raspberry device which\
  \ is a Single Board Computer (SBC). Raspberry Pi is a single-board computer developed\
  \ as a low cost computer to promote computer education but has also gained much\
  \ more popularity as a tool of choice for building IoT platforms. A Raspberry Pi\
  \ 3 model B is shown in the following figure:\n\n![](img/62ab880d2302f959d34db648cb0bec5e_444_0.png)\n\
  \n\n\n\n在以下章节中，将讨论一个示例，其中 Raspberry Pi 将作为物联网设备连接到以太坊区块链，并在收到智能合约调用时执行相应操作。\n\n\
  首先，需要对 Raspberry Pi 进行设置。这可以通过使用 NOOBS 完成，它提供了一种安装 Raspbian 或其他操作系统的简便方法。可以从链接 https://www.raspberrypi.org/downloads/noobs/\
  \ 下载并安装。或者，也可以仅从链接 https://www.raspberrypi.org/downloads/raspbian/ 安装 Raspbian。另一种选择是使用\
  \ https://github.com/debian-pi/raspbian-ua-netinst 上提供的工具，它也可以用来安装一个最小的无图形界面的 Raspbian\
  \ 操作系统。出于本示例的目的，我们使用 NOOBS 安装 Raspbian，因此后续练习均假设 Raspbian 已安装在 Raspberry Pi 的 SD\
  \ 存储卡上。\n\nRaspbian 操作系统安装完成后，下一步是为 Raspberry Pi 的 ARM 平台下载合适的 geth 二进制文件。可以在 Raspberry\
  \ Pi 的 Raspbian 操作系统中的终端窗口运行以下命令来确认平台。命令输出会显示操作系统正在运行的架构。在本例中是 armv7l，因此将下载与 ARM\
  \ 兼容的 geth 二进制文件。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_445_0.png)\n\nRaspberry\
  \ Pi 的架构\n\n以下步骤将进行详细说明：\n\n- 1. 下载 geth：请注意，下面的示例中下载的是一个特定版本，但也可以从 https://geth.ethereum.org/downloads/\
  \ 下载其他可用版本。\n  \n      wget https://gethstore.blob.core.windows.net/builds/geth-linux-arm7-1.5.6-2a609af5.tar.gz\n\
  \  \n- 2. 解压并提取到指定目录，执行下面的 tar 命令后，会自动创建一个名为 geth-linux-arm7-1.5.6-2a609af5 的目录：\n\
  \  \n      tar -zxvf geth-linux-arm7-1.5.6-2a609af5.tar\n\n这将创建一个名为 geth-linux-arm7-1.5.6-2a609af5\
  \ 的目录，并将 geth 二进制文件及相关文件解压到该目录中。可以将 geth 二进制文件复制到 /usr/bin 或 Raspbian 上的适当路径，以便在操作系统的任何位置都能访问它。下载完成后，下一步是创建创世区块。\n\
  \n需要使用之前在第8章“以太坊开发”中创建的同一个创世区块。可以从网络中的其他节点复制创世文件。如下面的截图所示。或者，也可以生成一个全新的创世区块。这一点已在第8章“以太坊开发”中详细讨论过。\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_446_0.png)\n\n创世文件\n\n将 genesis.json\
  \ 文件复制到 Raspberry Pi 后，可以运行以下命令来生成创世区块。必须使用之前生成的完全相同的创世区块，这一点非常重要，否则节点实际上将在不同的网络上运行：\n\
  \n```\n$ ./geth init genesis.json\n```\n\n这将显示与下面截图类似的输出：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_446_1.png)\n\
  \n初始化创世文件\n\n创建创世区块后，需要向网络中添加对等节点。这可以通过创建一个名为 static-nodes.json 的文件来实现，该文件包含 Raspberry\
  \ Pi 上的 geth 将要连接以进行同步的对等节点的 enode ID。\n\n```\npi@raspberrypi:~/.ethereum $ cat\
  \ static-nodes.json\n[\n\"enode://44352ede5b9e792e437c1c0431c1578ce3676a87e1f588434aff1299d30325c233c8d426fc57a25380481c8a36fb3be2787375e932fb4885885f6452f6efa77f@192.168.0.19:30301\"\
  \n]\n```\n\n静态节点配置\n\n此信息可以从 geth JavaScript 控制台中通过运行以下所示命令获取，此命令应在 Raspberry Pi\
  \ 将要连接的对等节点上运行：\n\n```\n> Admin.nodeInfo\n```\n\n这将显示与下面截图类似的输出：\n\n```\n> admin.nodeInfo\n\
  {\nenode: \"enode://44352ede5b9e792e437c1c0431c1578ce3676a87e1f588434aff1299d30325c233c8d426fc57a25380481c8a36fb3b87375e932fb4885885f6452f6efa77f@[]:30301\"\
  ,\nid: \"44352ede5b9e792e437c1c0431c1578ce3676a87e1f588434aff1299d30325c233c8d426fc57a25380481c8a36fb3be2787375e9\
  \ 4885885f6452f6efa77f\",\n```\n\ngeth 节点信息\n\n完成此步骤后，可以按照下面给出的进一步说明，将 Raspberry\
  \ Pi 连接到私有网络上的其他节点。在示例中，Raspberry Pi 将连接到在第8章“以太坊开发”中创建的网络 ID 786。关键是使用之前创建的相同创世文件以及不同的端口号。不过，不同端口并非严格必需。如果两个节点在私有网络中运行，并且需要从网络外部环境进行访问，那么将使用\
  \ DMZ/路由器和端口转发的组合。因此，建议使用不同的 TCP 端口，以便端口转发能够正常工作。下面的命令中的身份切换参数（之前尚未介绍过）可以为节点指定一个标识名称。\n\
  \n## 第一个节点设置\n\n首先，需要使用以下命令在第一个节点上启动 `geth`：\n\n```bash\n$ geth --datadir .ethereum/privatenet/\
  \ --networkid 786 --maxpeers 5 --rpc --rpcapi web3,eth,debug,personal,net --rpcport\
  \ 9001 --rpccorsdomain \"*\" --port 30301 --identity \"drequinox\"\n```\n\n![](img/62ab880d2302f959d34db648cb0bec5e_448_0.png)\n\
  \n`geth` 启动后，应保持其运行，并从 Raspberry Pi 节点启动另一个 `geth` 实例。\n\n## Raspberry Pi 节点设置\n\
  \n在 Raspberry Pi 上，需要运行以下命令来启动 `geth` 并使其与其他节点（本例中仅一个节点）同步。命令如下：\n\n```bash\n$ ./geth\
  \ --networkid 786 --maxpeers 5 --rpc --rpcapi web3,eth,debug,personal,net --rpccorsdomain\
  \ \"*\" --port 30302 --identity \"raspberry\"\n```\n\n这应该会产生与下面截图类似的输出。当输出中包含显示\
  \ **区块同步已启动** 的行时，表示该节点已成功连接到其对等节点。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_449_0.png)\n\
  \nRaspberry Pi 上的 geth。\n\n可以通过在两个节点的 geth 控制台中运行命令来进一步验证这一点，如下面的截图所示。在 Raspberry\
  \ Pi 上只需运行以下命令即可附加到 geth：\n\n```\n$ geth attach\n```\n\n![](img/62ab880d2302f959d34db648cb0bec5e_449_1.png)\n\
  \n在 Raspberry Pi 上运行 geth 控制台 admin peers 命令\n\n类似地，可以在第一个节点上运行以下命令来附加到 geth：\n\n\
  ```\n$ geth attach ipc:.ethereum/privatenet/geth.ipc\n```\n\n一旦控制台可用，就可以运行 admin.peers\
  \ 来显示其他已连接节点的详细信息，如下面的截图所示：\n\n```\n> admin.peers\n[\n  {\n    caps: [\"eth/62\"\
  , \"eth/63\"],\n    id: \"98a36ecaff011803d634da45752abd2510f20a62f23427afc3f2b0017bc134833dd5ba400bb195ac6ed59c3b01ca2a3f1460a8a52097a1bbb\
  \ f967fc84274\",\n    name: \"Geth/raspberry/v1.5.6-stable-2a609af5/linux/go1.7.4\"\
  ,\n    network: {\n      localAddress: \"192.168.0.19:30301\",\n      remoteAddress:\
  \ \"192.168.0.21:56512\"\n    },\n    protocols: {\n      eth: {\n        difficulty:\
  \ 11700366137,\n        head: \"0x1188f5b8a4900a1d771d333141ea9480d78400bb8e561494ab436519ae64e1e34\"\
  ,\n        version: 63\n      }\n    }\n  }\n]\n```\n\n在另一个对等节点上运行 geth 控制台 admin\
  \ peers 命令\n\n两个节点都启动并运行后，可以安装进一步的前提条件来准备实验。需要安装 Node.js 和相关 JavaScript 库。下面列出了所需的库和依赖项。首先需要在\
  \ Raspberry Pi 的 Raspbian 操作系统上更新 Node.js 和 npm。为此，可以按照以下步骤操作：\n\n- 1. 使用以下命令在 Raspberry\
  \ Pi 上安装最新版 Node.js：\n\n```\n$ curl -sL https://deb.nodesource.com/setup_7.x | sudo\
  \ -E bash -\n```\n\n这应该会显示类似下面的输出。输出内容很大，因此下面的截图仅显示输出的顶部部分：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_450_0.png)\n\
  \nNode.js 安装\n\n- 2. 通过 apt-get 运行更新：\n\n```\n$ sudo apt-get install nodejs\n```\n\
  \n\n\nVerification can be performed by running the following command to ensure that\
  \ the correct version of Node.js and npm are installed, as shown in the following\
  \ screenshot below:\n\n![](img/62ab880d2302f959d34db648cb0bec5e_451_0.png)\n\nnpm\
  \ and node installation verification\n\nIt should be noted that these version are\
  \ not a necessity; any latest version of npm and node will work. The examples in\
  \ this chapter makes use of npm 4.0.5 and node v7.4.0.\n\n- 3. Install Ethereum\
  \ web3 npm, which is required to enable JavaScript code to access the blockchain:\n\
  \n```\n```text\npi@raspberrypi:~/testled $ npm install web3\ntestled@1.0.0 /home/pi/testled\n\
  └── web3@0.18.0\n    └── bignumber.js@2.0.7 (git+https://github.com/debris/bignumber.js.git#94d7146671b9719e00a09c29b01a691bc85048c2)\n\
  \nnpm WARN testled@1.0.0 No repository field.\npi@raspberrypi:~/testled $\n```\n\
  ```\n\nnpm install web3\n\n- 4. Similarly, `npm install onoff` can be installed,\
  \ which is required in order to communicate with the Raspberry Pi and control GPIO:\n\
  \n```\n```text\npi@raspberrypi:~/testled $ npm install onoff --save\ntestled@1.0.0\
  \ /home/pi/testled\n└── onoff@1.1.1\n\nnpm WARN testled@1.0.0 No repository field.\n\
  pi@raspberrypi:~/testled $\n```\n```\n\nonoff installation\n\nWhen all prerequisites\
  \ are installed, hardware setup can be performed. For this purpose a simple circuit\
  \ is built using a breadboard and a few electronic components.\n\nThese components\
  \ are listed as follows:\n\n- 1. **LED**: The abbreviation of **Light Emitting Diode**,\
  \ this can be used as visual indication for an event.\n- 2. **Resistor**: A 330\
  \ ohm component is required which provides resistance to passing current based on\
  \ its rating. It is not necessary to understand the theory behind it for this experiment;\
  \ any standard electronics engineering text covers all these topics in detail.\n\
  - 3. **Breadboard**: This provides a means of building an electronic circuit without\
  \ requiring soldering.\n- 4. **T-Shaped cobbler**: This is inserted on the breadboard\
  \ as shown in the figure below and provides a labeled view of all **GPIO (General\
  \ Purpose I/O)** pins for the Raspberry Pi.\n- 5. **Ribbon cable connector**: This\
  \ is simply used to provide connectivity between the Raspberry Pi and the breadboard\
  \ via GPIO. All these components are shown in the following image:\n\n![](img/62ab880d2302f959d34db648cb0bec5e_452_0.png)\n\
  \n## Circuit\n\nAs shown in the following image, the positive leg (long leg) of\
  \ the LED is connected to pin number 21 of the GPIO and the negative (short leg)\
  \ is connected to the resistor, which is then connected to the **ground (GND)**\
  \ pin of the GPIO. Once the connections are set up the ribbon cable can be used\
  \ to simply connect to the GPIO connector on the Raspberry Pi.\n\n![](img/62ab880d2302f959d34db648cb0bec5e_453_0.png)\n\
  \nOnce the connections are set up correctly and the Raspberry Pi has been updated\
  \ with the appropriate libraries and geth, the next step is to develop a simple\
  \ smart contract that expects a value. If the value provided to it is not what it\
  \ expects it does not trigger an event; otherwise, if the value passed matches the\
  \ correct value, the event triggers which can be read by the client JavaScript programme\
  \ running via Node.js. Of course, the solidity contract can be very complex and\
  \ can also deal with the ether sent to it and if the amount of ether is equal to\
  \ the required amount then the event can trigger; but in this example the aim is\
  \ to demonstrate the usage of smart contracts to trigger events that can then be\
  \ read by JavaScript programmes running on Node.js, which then in turn can trigger\
  \ actions on IoT devices using various libraries.\n\nThe smart contract source code\
  \ is shown as follows:\n\n```\n```solidity\npragma solidity ^0.4.0;\ncontract simpleIOT\
  \ {\n    uint roomRent=10;\n    event roomRented(bool returnValue);\n    function\
  \ getRent (uint8 x) returns (bool)\n    {\n        if (x==roomrent)\n        {\n\
  \            roomRented(true);\n            return true;\n        }\n    }\n}\n\
  ```\n```\n\n![](img/62ab880d2302f959d34db648cb0bec5e_453_1.png)\n\nThe solidity\
  \ online compiler can be used to run and test this contract. The Application Binary\
  \ Interface (ABI) required for interacting with the contract is also available in\
  \ the Interface field as shown in the following screenshot:\n\n![](img/62ab880d2302f959d34db648cb0bec5e_454_0.png)\n\
  \nSolidity online compiler\n\nThere are two methods by which Raspberry node can\
  \ connect to the private blockchain via the web3 interface. The first is where the\
  \ raspberry device is running its own geth and maintains its own ledger but with\
  \ resource-constrained devices it is not possible to run a full geth node, or even\
  \ a light node in a few circumstances. In that case, the web3 provider can be initialized\
  \ to connect to the appropriate RPC channel. This will be shown later in the client\
  \ JavaScript Node.js programme. A comparison of both of these approaches is shown\
  \ in the following diagram:\n\n![](img/62ab880d2302f959d34db648cb0bec5e_455_0.png)\n\
  \nApplication architecture of room rent IoT application (IoT device with local ledger)\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_455_1.png)\n\nApplication architecture\
  \ of room rent IoT application (IoT device without local ledger)\n\nThere are obvious\
  \ security concerns which arise from exposing RPC interfaces publicly, therefore\
  \ it is recommended that this option is used only on private networks and if required\
  \ to be used on public networks appropriate security measures are put in place,\
  \ such as allowing only the known IP addresses to connect to the geth RPC interface.\
  \ This can be achieved by a combination of disabling peer discovery mechanisms and\
  \ HTTP-RPC server listening interfaces. More information about this can be found\
  \ in geth help. The traditional network security measures such as firewalls, Transport\
  \ Layer Security (TLS) and certificates can also be used, but have not been discussed\
  \ in this example.\n\nAfter the contract is mined, `roomRented` will be triggered,\
  \ which will turn the LED on. In this example it is a simple LED but it can be any\
  \ physical device such as a room lock that can be controlled via an actuator. If\
  \ all works well, the LED will be turned on as a result of the smart contract function\
  \ invocation as shown in the following image:\n\n![](img/62ab880d2302f959d34db648cb0bec5e_458_0.png)\n\
  \nRaspberry Pi with LED control\n\nAs demonstrated in the preceding example, a private\
  \ network of IoT devices can be built that runs a geth client on each of the nodes\
  \ and can listen for events from smart contracts and trigger an action accordingly.\
  \ The example shown is simple on purpose but demonstrates the underlying principles\
  \ of an Ethereum network that can be built using IoT devices along with smart contract-driven\
  \ control of the physical devices.\n\nIn the next section, other applications of\
  \ the blockchain technology in government, finance, and health will be discussed.\n\
  \n## Government\n\nThere are various applications of blockchain being researched\
  \ currently that can support government functions and take the current model of\
  \ e-government to the next level. First, in this section some background for e-government\
  \ will be provided and then a few use cases such as e-voting, homeland security\
  \ (border control), and electronic IDs (citizen ID cards) will be discussed.\n\n\
  E-government or electronic government is a paradigm where information and communication\
  \ technology is used to deliver public services to citizens. The concept is not\
  \ new and has been implemented in various countries around the world but with blockchain\
  \ a new avenue of exploration has opened up. Many governments are researching the\
  \ possibility of using blockchain technology for managing and delivering public\
  \ services. Transparency, auditability, and integrity are attributes of blockchain\
  \ that can go a long way in effectively managing various government functions.\n\
  \n### Border control\n\nAutomated border control systems have been in use for decades\
  \ now in order to thwart illegal entry into countries and prevent terrorism and\
  \ human trafficking.\n\nMachine-readable travel documents and specifically biometric\
  \ passports have paved the way for automated border control; however current systems\
  \ are limited to a certain extent and blockchain technology can provide solutions.\
  \ A **Machine-readable Travel Document (MRTD)** standard is defined in document\
  \ ICAO 9303 by the **International Civil Aviation Organization (ICAO)** and has\
  \ been implemented by many countries around the world.\n\nEach passport contains\
  \ various security and identity attributes that can be used to identify the owner\
  \ of the passport and also circumvent attempts at tampering with the passports.\
  \ These include biometric features such as retina scan, finger prints, facial recognition,\
  \ and standard ICAO specified features including **Machine Readable Zone (MRZ)**\
  \ and other text attributes that are visible on the first page of the passport.\n\
  \nOne key issue with current border control systems is centralization whereby the\
  \ systems are controlled by a single entity and the fact that data is not readily\
  \ shared between law enforcement agencies. This makes it difficult to track suspected\
  \ individuals. Another issue is related to the immediate implementation of blacklisting\
  \ of a travel document, for example, when there is an immediate need to track and\
  \ control suspected travel documents. Currently, there is no mechanism available\
  \ to immediately blacklist or revoke a suspected passport.\n\n\n\n\n\n## 区块链——货币之外的应用\n\
  \n区块链可以通过在智能合约中维护一个黑名单来解决这一问题，该黑名单可根据需要更新，任何变更都会立即对所有机构和边境检查点可见，从而能够对可疑旅行证件的流动实施即时管控。或许有人会争辩说，传统的机制（如PKI和P2P网络）也可以用于此目的，但它们无法提供区块链所能带来的好处。借助区块链，整个系统可以简化，无需复杂的网络和PKI设置，这也会降低成本。此外，基于区块链的系统将提供密码学上保证的不可篡改性，这有助于审计并抑制任何欺诈行为。\n\
  \n由于可扩展性问题，目前所有旅行证件的完整数据库或许无法存储在区块链上，但可以使用诸如BigChainDB、IPFS或Swarm之类的后端分布式数据库来存储。在这种情况下，可以将旅行文档的哈希与个人的生物识别ID一起存储在简单的智能合约中，然后使用文档的哈希来引用分布式文件系统（如IPFS）上可用的详细数据。这样，当某个旅行证件在网络中的任何位置被列入黑名单时，该信息将立即可用，并在整个分布式账本上获得其真实性和完整性的密码学保证。这一功能还可以为反恐活动提供有效支持，从而在政府的国土安全职能中发挥至关重要的作用。\n\
  \n一个用Solidity编写的简单合约可以定义一个数组，用于存储身份和相关的生物识别记录。该数组可用于存储护照的识别信息。身份可以是护照或旅行证件的**机器可读区（MRZ）**的哈希与RFID芯片中的生物识别记录拼接后的哈希。一个简单的布尔字段可用于标识被列入黑名单的护照。一旦初步检查通过，进一步详细的生物识别验证可由传统系统执行，最终当就护照持有者的入境做出决定时，该决定可以被回传至区块链，从而使网络上的所有参与者能够立即共享该决定的结果。\n\
  \n构建基于区块链的边境控制系统的高级方法可如下图所示。在该场景中，护照被呈递给RFID和页面扫描仪进行扫描，扫描仪读取数据页并提取机器可读信息以及存储在RFID芯片中的生物识别数据的哈希。在此阶段，还会拍摄护照持有者的实时照片和视网膜扫描。然后该信息被传递到区块链，在区块链上，智能合约负责验证旅行证件的合法性，首先检查其自身的黑名单护照列表，然后向后端IPFS数据库请求更多数据以进行比较。请注意，照片或视网膜扫描等生物识别数据不会存储在区块链上，只有后端（IPFS或BigChainDB）中这些数据的引用会存储在区块链中。\n\
  \n如果所呈递护照的数据与IPFS中以文件形式存有或在BigChainDB中的数据匹配，并且也通过了智能合约的逻辑检查，那么边境闸门就可以打开。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_461_0.png)\n\
  \n使用区块链的自动边境管控\n\n验证完成后，该信息会在整个区块链中传播，并立即为边境管控区块链上的所有参与者所用。这些参与者可以是由各国国土安全部门组成的全球联盟。\n\
  \n## 投票\n\n任何政府的投票都是一项关键职能，它使公民能够参与民主选举过程。尽管投票随着时间的推移已经演变得更加成熟和安全，但为了实现理想的成熟度，仍有一些限制需要解决。通常，当前投票系统的限制围绕欺诈、操作流程中的弱点，尤其是透明度问题。多年来，人们构建了安全的投票机制，使用专门的投票机来保证安全性和隐私性，但这些机器仍然存在可被利用的漏洞，从而破坏其安全机制。这可能对整个投票过程产生严重影响，并导致公众对政府的不信任。\n\
  \n基于区块链的投票系统可以通过在该过程中引入端到端的安全性和透明度来解决这些问题。安全性通过使用公钥密码学以投票的完整性和真实性的形式提供，这在区块链中属于标准配置。此外，区块链保证的不可篡改性确保了一旦投票就不能再次投票。这可以通过生物识别特征与维护已投票名单的智能合约相结合来实现。例如，智能合约可以维护一个已投票列表，其中包含生物识别ID（例如指纹），并利用该列表检测和防止重复投票。其次，零知识证明也可以用于区块链，以保护投票者在区块链上的隐私。\n\
  \n## 公民身份识别（身份证）\n\n目前，世界各地的许多国家都会签发电子身份证或国民身份证。这些证件是安全的，并具有许多安全特性，可阻止复制或篡改的企图。然而，随着区块链技术的出现，这一过程可以做出多项改进。\n\
  \n数字身份不仅限于政府签发的身份证，它也是一个适用于在线社交网络和论坛的概念。可以针对不同目的使用多种身份。基于区块链的在线数字身份允许对个人信息共享进行控制。用户可以查看谁使用了他们的数据、用于什么目的，并可以控制对其的访问。这在当前集中控制的基础设施中是不可能的。关键好处在于，由政府签发的单一身份可以通过政府区块链轻松透明地用于多种服务。在这种情况下，区块链充当一个平台，政府在其中提供养老金、税收或福利等各种服务，而单一ID被用于访问所有这些服务。在此场景下，区块链为数字ID发起的每一项变更和交易提供了不可篡改的记录，从而确保了系统的完整性和透明度。同时，公民可以在区块链上对出生证明、婚姻、契约和许多其他文件进行公证，并将其与数字ID绑定，作为存在性证明。\n\
  \n目前，各国已有一些运行良好的身份方案成功实施，也有人认为也许身份管理系统中并不真正需要区块链。尽管区块链具有隐私以及对身份信息使用的控制等若干好处，但由于当前区块链技术尚不成熟，也许它还没有准备好用于现实世界的身份系统。然而，各国政府正在进行研究，以探索将区块链用于身份管理。\n\
  \n此外，诸如“被遗忘权”之类的法律可能很难纳入区块链，因为区块链具有不可篡改的特性。\n\n## 其他应用\n\n区块链技术可应用于其他政府职能以改善成本和效率，这些职能包括税收征收、福利管理和发放、土地所有权记录管理、人生事件登记（婚姻、出生）、机动车登记和许可证。这并非详尽列表，随着时间推移，政府的许多职能和流程都可以适应基于区块链的模式。区块链的主要优势，如不可篡改性、透明性和去中心化，有助于改进大多数传统政府系统。\n\
  \n## 医疗健康\n\n医疗健康行业已被确定为另一个可以通过采用区块链技术而受益的主要行业。区块链提供了一个传统P2P网络无法提供的不可篡改、可审计、透明的系统。此外，与传统复杂的PKI网络相比，区块链提供了一种成本效益更高、更简单的基础设施。在医疗保健领域，互操作性缺乏、流程过于复杂、透明度不够、可审计性不足以及控制不力等问题，可能会引发隐私泄露、数据泄露、高成本和欺诈等重大问题。另一个棘手的问题是假药问题，尤其是在发展中国家，这是一个主要的关切点。\n\
  \n随着区块链在医疗领域的可适应性，可以实现诸多好处，包括节省成本、增强信任、更快处理理赔、高可用性、因操作流程复杂性导致的运营错误得以消除，以及阻止假药的流通。\n\
  \n从另一个角度来看，提供数字货币作为挖矿激励的区块链可以用来提供计算能力，以解决有助于找到某些疾病疗法的科学问题。例如FoldingCoin，它通过共享计算机处理能力来解决需要特别大量计算的科学问题，从而用FLDC代币奖励其矿工。FoldingCoin的网址是http://foldingcoin.net/。另一个类似项目叫做CureCoin，可在https://www.curecoin.net/获取。这些项目在实现其目标方面能取得多大成功还有待观察，但这个想法非常令人期待。\n\
  \n\n\n\n\n## 金融\n\n区块链在金融行业有许多应用。当前区块链在金融领域是最热门的话题，主要银行和金融机构都在研究如何适应区块链技术，尤其由于其具有高度期望的成本节约潜力。\n\
  \n## 保险\n\n在保险行业，区块链技术可以帮助阻止欺诈性索赔，加快索赔处理速度，并实现透明度。想象一下所有保险公司之间共享的一本账本，可以为处理公司间索赔提供快速高效的机制。此外，随着物联网与区块链的融合，可以想象一个智能设备生态系统，其中所有这些设备都能够通过区块链上的智能合约协商和管理自己的保险单。\n\
  \n区块链可以降低处理索赔所需的总体成本和工作量。索赔可以通过智能合约以及保险单持有人的相关身份自动验证并支付。例如，一个智能合约在预言机和可能的物联网的帮助下可以确保当事故发生时，它可以记录相关的遥测数据，并基于此信息释放付款。它也可以在智能合约评估付款条件后得出不应释放付款时扣留付款。例如，在车辆未由授权维修店维修或在指定区域外使用等场景下。智能合约可以评估许多条件来处理索赔，而这些规则的选择取决于保险公司，但总体思路是智能合约结合物联网和预言机可以自动化整个车辆保险行业。\n\
  \nSeveral start-ups such as Dynamis have proposed smart contract-based peer-to-peer\
  \ insurance platforms that run on Ethereum blockchain. This is initially proposed\
  \ to be used for unemployment insurance and does not require underwriters in the\
  \ model. It is available at http://dynamisapp.com/.\n\n## 交易后结算\n\n这是区块链技术最受追捧的应用。目前，许多金融机构正在探索使用区块链技术简化、自动化并加快昂贵且耗时的交易后结算流程的可能性。\n\
  \n在反洗钱方面，由于区块链不可变、共享和透明的特性，监管机构可以轻松获得对私有区块链的访问权限，在那里他们可以获取相关监管报告的数据。这也将减少与当前监管报告范式相关的复杂性和成本，在该范式中，数据从各种遗留和分散的系统中获取并汇总和格式化以用于报告目的。\n\
  \n区块链可以提供对系统中所有金融交易的单一共享视图，这些交易在密码学上是安全、真实且可审计的，从而降低与当前采用的监管报告方法相关的成本和复杂性。\n\n##\
  \ 媒体\n\n媒体行业的关键问题围绕内容分发、权利管理和向艺术家支付版税。例如，数字音乐可以被多次复制而没有任何限制，任何试图应用复制保护的尝试都以某种方式被破解。对音乐家或词曲作者制作的内容的分发没有任何控制；它可以被复制任意多次而没有任何限制，从而影响版税支付。此外，付款并不总是得到保证，并且基于传统的播出时间数据。所有这些围绕复制保护和版税支付的问题都可以通过连接消费者、艺术家和行业中的所有参与者来实现解决，从而实现过程的透明度和控制。\n\
  \n区块链可以提供一个网络，其中数字音乐在密码学上保证仅由付费的消费者拥有。这种付款机制由智能合约控制，而不是中央媒体机构或权威机构。付款将根据嵌入在智能合约中的逻辑和'下载'次数自动进行。此外，数字音乐文件的非法复制可以完全停止，因为一切都以不可变和透明的方式记录在区块链上。例如，音乐文件可以存储所有者信息和时间戳，可以在整个区块链网络中追踪。此外，拥有某项内容合法副本的消费者在密码学上与他们拥有的内容绑定，除非得到所有者许可，否则不能转移给另一所有者。一旦所有数字内容不可变地记录在区块链上，版权和转让就可以通过区块链轻松管理。智能合约随后可以控制向所有相关方的分发和付款。\n\
  \n## 总结\n\n区块链技术有许多应用，如本章所述，它们可以在各个行业中实施，为现有解决方案带来多重益处。在本章中，讨论了五个可以从区块链中受益的主要行业。首先讨论了物联网，这本身就是一项革命性技术；通过将其与区块链结合，可以解决几个根本性限制，这为物联网行业带来了巨大的好处。物联网获得了更多关注，因为它是适应区块链技术最大且最成熟的候选者。已经出现了实用的用例和平台，例如用于区块链物联网的**平台即服务**（PaaS），如\
  \ IBM Watson IoT 区块链。IBM Blue Horizon 也现已可用于实验，这是一个去中心化的基于区块链的物联网网络。其次，讨论了政府部门的应用，其中各种政府流程，如国土安全、身份证件和福利发放可以变得透明、安全且更稳健。此外，还讨论了金融部门的问题以及区块链技术可以提供的可能解决方案。尽管金融部门以高度的热情和精力探索使用区块链的可能性，但距离生产就绪的基于区块链的系统仍相去甚远。最后，还讨论了一些医疗保健部门和音乐行业的方面。所有这些用例以及行业中更多用例都建立在区块链技术的核心属性所提供的支柱之上，例如去中心化、透明度、可靠性和安全性。然而，在区块链技术能够完全被采用之前，需要解决某些挑战；这些将在下一章中讨论。\n"
- "# 12 可扩展性和其他挑战\n### 可扩展性和其他挑战\n\n本章旨在介绍在区块链成为主流技术之前需要解决的各种挑战。即使已经开发了各种用例和概念验证系统，并且该技术在许多场景中运行良好，仍然需要解决区块链中存在的一些根本性限制，以使该技术更具适应性。\n\
  \n在这些问题中名列前茅的是可扩展性和隐私。两者都是需要解决的重要限制，尤其是当区块链被设想用于对隐私要求很高的行业时。金融、法律和医疗保健领域对交易保密性有特定要求，而可扩展性通常是区块链无法达到用户期望的足够性能水平时所关心的问题。这两个问题正成为阻碍区块链技术更广泛接受的因素。本章将介绍目前在这两个特定领域提出的和正在进行的研究综述。除了隐私和安全之外，其他挑战还包括监管、集成、适应性和安全性。一般而言。虽然比特币区块链的安全性已被证明是坚不可摧的，并且经受住了时间的考验，但在某些微妙场景中仍可能存在一些漏洞，从而在一定程度上损害安全性。此外，其他区块链，如以太坊，关于智能合约、拒绝服务攻击和大攻击面也存在一些合理的安全问题。所有这些将在以下各节中详细讨论。\n\
  \n\n\n\n\n## 可扩展性\n\n这个问题在过去几年里一直是激烈辩论、严格研究和媒体关注的焦点。这是可能决定区块链更广泛适应性还是仅限于联盟链的私有使用的最重要问题。由于该领域的大量研究，已经提出了许多解决方案，这些将在下一节中讨论。\n\
  \n从理论角度来看，解决可扩展性问题的总体方法通常围绕协议层面的增强。例如，针对比特币可扩展性常被提及的解决方案是增加其区块大小。其他提案包括链下解决方案，将某些处理卸载到链下网络，例如链下状态网络。基于上述解决方案，一般来说，提案可以分为两类：基于改变区块链运行的基本协议的链上解决方案，以及利用链下网络和处理资源来增强区块链的链下解决方案。\n\
  \n最近，Miller 等人在其立场论文《On Scaling Decentralized Blockchains》中提出了另一种解决区块链限制的方法。在该论文中表明，区块链可以被划分为称为平面的各种抽象层。每个平面负责执行特定功能。这些包括网络平面、共识平面、存储平面、视图平面和侧平面。这种抽象允许以结构化的方式在每个平面单独解决瓶颈和限制。下面结合对比特币系统的一些参考，给出了每个层的简要概述。\n\
  \n首先讨论网络平面。网络平面的关键功能是交易传播。在上述论文中已确定，在比特币中，由于节点在传播之前执行交易验证的方式以及交易传播的重复，第一次在交易广播阶段，然后在挖矿后在区块中，该平面低估了网络带宽。应注意，该问题已由\
  \ BIP 152（Compact Block Relay）解决。\n\n第二层称为共识平面。该层负责挖矿和达成共识。该层中的瓶颈围绕工作量证明算法的限制，即增加共识速度和带宽会导致网络安全性受损，因为分叉数量增加。\n\
  \n存储平面是第三层，用于存储账本。该层中的问题围绕每个节点都需要保留整个账本的完整副本，这导致某些效率低下，例如带宽和存储需求增加。比特币提供了一种称为修剪的方法，允许节点在无需下载完整区块链的情况下运行。从存储角度来看，该功能带来了重大改进。\n\
  \n接下来是视图平面，其提出了一种基于比特币矿工不需要完整区块链来运行的优化，并且可以从完整账本中构建视图，作为系统整体状态的表示，这足以使矿工发挥功能。视图的实现将消除挖矿节点存储完整区块链的需求。\n\
  \n最后，侧平面由上述研究论文的作者提出。该平面代表了链下交易的想法，其中使用支付或交易通道的概念来卸载参与者之间的交易处理，但仍由主比特币区块链支持。\n\n\
  上述模型可以用结构化的方式描述当前区块链设计中的限制和改进。此外，在过去几年中提出了几种通用策略，可以解决当前区块链设计（如以太坊和比特币）中的限制。这些方法也在以下部分中分别表征和讨论。\n\
  \n### 区块大小增加\n\n这是提高区块链性能（交易处理吞吐量）最受争议的提案。目前，比特币每秒只能处理大约三到七笔交易，这是在将比特币区块链用于处理微交易时的主要制约因素。比特币中的区块大小被硬编码为\
  \ 1 MB，但如果区块大小增加，它可以容纳更多交易并可导致更快的确认时间。有多个比特币改进提案（BIPs）支持增加区块大小。这些包括 BIP 100、BIP\
  \ 101、BIP 102、BIP 103 和 BIP 109。在以太坊中，区块大小不受硬编码限制；相反，它由 gas 限制控制。从理论上讲，以太坊中区块的大小没有限制，因为它取决于\
  \ gas 数量，而 gas 数量可以随着时间的推移而增加。这是因为矿工被允许在前一个区块达到限制时为后续区块增加 gas 限制。\n\n### 区块间隔减少\n\
  \n另一个提案是减少每个区块生成之间的时间。区块之间的时间可以减少以实现更快的区块最终化，但可能由于分叉数量增加而导致安全性降低。以太坊已实现大约 14 秒的区块时间，有时还会增加。这与比特币区块链相比是一个显著的改进，后者生成新区块需要\
  \ 10 分钟。在以太坊中，由区块间隔变小导致的高孤块问题通过使用 **Greedy Heaviest Observed Subtree (GHOST)** 协议得以缓解，其中孤块（叔块）也被纳入确定有效链的考虑。一旦以太坊转向权益证明，这将变得无关紧要，因为无需挖矿即可实现交易的几乎即时最终性。\n\
  \n### 可逆布隆查找表\n\n这是另一种旨在减少比特币节点之间传输数据量的提议方法。**Invertible Bloom lookup tables (IBLTs)**\
  \ 最初由 *Gavin Andresen* 提出，该方法的主要吸引力在于如果实施不会导致比特币硬分叉。关键思想基于这样一个事实：无需在节点之间传输所有交易；相反，只传输同步节点交易池中尚未可用的交易。这允许节点之间更快地同步交易池，从而提高比特币网络的整体可扩展性和速度。\n\
  \n### 分片\n\n分片并不是一种新技术，已在 MongoDB 和 MySQL 等分布式数据库中用于可扩展性。分片背后的关键思想是将任务拆分为多个块，然后由多个节点处理。这导致吞吐量提高和存储需求减少。在区块链中，采用了类似的方案，其中网络状态被划分为多个分片。状态通常包括余额、代码、nonce\
  \ 和存储。分片是运行在同一网络上的区块链的松耦合分区。跨分片通信和对每个分片历史的共识存在一些挑战。这是研究的开放领域。\n\n### 状态通道\n\n这是为加速区块链网络上的交易而提出的另一种方法。基本思想是使用侧通道进行状态更新和在主链之外处理交易；一旦状态最终确定，就将其写回主链，从而将耗时的操作从主区块链中卸载。状态通道通过执行以下三个步骤来工作：\n\
  \n- 1. 首先，区块链状态的一部分在智能合约下被锁定，确保参与者之间的协议和业务逻辑。\n- 2. 现在在参与者之间开始链下交易处理和交互，目前仅在他们之间更新状态。在此步骤中，可以执行几乎任意数量的交易而无需区块链，这使得该过程快速且成为解决区块链可扩展性问题的最佳候选。然而，可以认为这不是真正的链上解决方案，例如分片，但最终结果是一个更快、更轻且更强大的网络，这在微支付网络、物联网网络和许多其他应用中可能非常有用。\n\
  - 3. 一旦达到最终状态，状态通道将被关闭并将最终状态写回主区块链。在此阶段，被锁定的区块链部分也将被解锁。\n\n该技术已在比特币闪电网络和以太坊的 Raiden\
  \ 中使用。\n\n### 私有区块链\n\n私有区块链本质上是快速的，因为不需要真正的去中心化，网络上的参与者无需挖矿；相反，他们只能验证交易。这可以被视为对公有区块链可扩展性问题的变通方法；然而，这并不是解决可扩展性问题的方案。此外，还应注意私有区块链仅适用于特定领域和设置。\n\
  \n### 权益证明\n\n与其使用工作量证明，基于权益证明算法的区块链从根本上来说更快。\n\n\n\n\n\n另一方面，最近，由 *Vitalik Buterin*\
  \ 撰写的以太坊紫色论文已在上海的 Ethereum Devcon 2 上发表；它描述了可扩展以太坊的愿景。紫色提案基于分片和权益证明算法实现的结合。论文中已确定了一些目标，例如通过权益证明实现效率提升、最大化快速出块时间、经济最终性、可扩展性、跨分片通信以及抗审查性。\n\
  \n## Privacy\n\n交易的隐私是区块链非常期望的属性。然而，由于其本质，特别是在公共区块链中，一切都是透明的，从而阻碍了其在隐私至关重要的各个行业中的使用，例如金融、健康等。针对隐私问题提出了不同的方案，并且已经取得了一些进展。几种技术，例如不可区分混淆、同态加密的使用、零知识证明和环签名。所有这些技术都有其优缺点，并在以下章节中进行讨论。\n\
  \n## Indistinguishability obfuscation\n\n这种密码技术可能成为区块链所有隐私和保密问题的银弹，但该技术尚未准备好用于生产部署。**不可区分混淆\
  \ (IO)** 允许代码混淆，这在密码学中是一个非常成熟的研究课题，如果应用于区块链，可以作为一种不可破解的混淆机制，将智能合约变成黑盒。IO 背后的关键思想是研究人员所称的\
  \ *多线性拼图*，它基本上通过将程序代码与随机元素混合来混淆程序代码，如果程序按预期运行，它将产生预期输出，但任何其他执行方式都会使程序看起来随机且无意义。这个想法最初由\
  \ *Sahai* 等人在他们的研究论文 *Candidate Indistinguishability Obfuscation and Functional\
  \ Encryption for All Circuits* 中提出。\n\n## Homomorphic encryption\n\n这种加密允许对加密数据执行操作。想象一个场景，其中数据被发送到云服务器进行处理。服务器对其进行处理并返回输出，而完全不知道其处理过的数据。这也是一个\
  \ ripe 的研究领域，允许对加密数据执行所有操作的完全同态加密仍未完全可在生产中部署；然而，该领域已取得重大进展。一旦在区块链上实现，它可以允许对密文进行处理，从而从根本上实现交易的隐私和保密。例如，存储在区块链上的数据可以使用同态加密进行加密，并且可以在无需解密的情况下对该数据执行计算，从而为区块链提供隐私服务。该概念也已在麻省理工学院媒体实验室的一个名为\
  \ Enigma 的项目中实现。Enigma 是一个点对点网络，允许多个参与方对加密数据执行计算，而无需透露有关数据的任何信息。\n\n## Zero knowledge\
  \ proofs\n\n零知识证明最近已在 Zcash 中成功实现，如前几章所述。更具体地说，已实现了 SNARKs 以确保区块链上的隐私。相同的想法也可以在以太坊和其他区块链中实现。将\
  \ Zcash 集成到以太坊上已经是 Ethereum R&D 团队和 Zcash 公司正在进行的非常活跃的研究项目。\n\n## State channels\n\
  \n使用状态通道也可以实现隐私，原因很简单，因为所有交易都在链下运行，主要区块链根本看不到交易，除了最终状态输出，从而确保隐私和保密。\n\n## Secure\
  \ multiparty computation\n\n安全多方计算的概念并不新鲜，其基于这样一种概念：数据在参与方之间根据秘密共享机制分割成多个分区，然后在数据上进行实际处理，而无需在单台机器上重构数据。处理后产生的输出也将在各方之间共享。\n\
  \n## Usage of hardware to provide confidentiality\n\n可信计算平台可用于提供一种机制，通过该机制可在区块链上实现交易的保密性，例如使用\
  \ Intel Software Guard Extension (SGX)，它允许代码在称为飞地的硬件保护环境中运行。一旦代码在隔离的飞地中成功运行，它可以生成一个称为引用的证明，该证明可由\
  \ Intel 的云服务器进行证明。然而，人们担心信任 Intel 会导致一定程度的中心化，这与区块链技术的真正精神不一致。尽管如此，该解决方案也有其优点，实际上，许多平台已经使用\
  \ Intel 芯片，因此在某些场景下信任 Intel 可能是可以接受的。\n\n如果将该技术应用于智能合约，那么一旦节点执行了智能合约，它就可以生成引用作为正确且成功执行的证明，其他节点只需验证它即可。这一想法可以通过使用任何可信执行环境\
  \ (TEE) 进一步扩展，该环境可以提供与飞地相同的功能，并且即使在具有近场通信 (NFC) 和安全元件的移动设备上也可用。\n\n## Coinjoin\n\
  \nCoinjoin 是一种用于通过交互式混合来匿名化比特币交易的技术。其思想是基于从多个实体形成单个交易，而不会导致输入和输出发生变化。它消除了发送方和接收方之间的直接联系，这意味着单个地址不再能与交易相关联，这可能导致用户被识别。Coinjoin\
  \ 需要多个愿意通过混合支付创建单个交易的参与方之间的合作。因此，应该注意的是，如果 Coinjoin 方案中的任何单个参与方未能履行合作创建单个交易的承诺，例如未按要求签署交易，则可能导致拒绝服务攻击。在此协议中，无需单一可信第三方。此概念不同于充当比特币用户之间可信第三方或中介的混合服务，允许交易洗牌。这种交易洗牌可防止追踪和将付款与特定用户关联。\n\
  \n## Confidential transactions\n\n机密交易使用 Pedersen 承诺来提供保密性。承诺方案允许用户对某个值进行承诺，同时保持其秘密，并能够在以后揭示它。为了设计承诺方案，需要满足的两个属性是绑定性和隐藏性。绑定性确保提交者在承诺后无法更改所选值，而隐藏性确保任何对手都无法找到提交者所承诺的原始值。Pedersen\
  \ 承诺还允许加法运算并在承诺上保持交换性，这使其特别适用于为比特币交易提供保密性。换句话说，它支持值的同态加密。使用承诺方案允许隐藏比特币交易中的付款价值。该概念已在\
  \ Elements Project (https://elementsproject.org/) 中实现。\n\n## MimbleWimble\n\nMimbleWimble\
  \ 方案在某种程度上神秘地在比特币 IRC 频道上提出，此后获得了很大的人气。MimbleWimble 扩展了机密交易和 Coinjoin 的思想，允许在无需交互的情况下聚合交易。然而，它不支持使用比特币脚本语言以及标准比特币协议的各种其他功能。这使其与现有比特币协议不兼容。因此，它可以作为比特币的侧链实现，也可以作为替代加密货币独立实现。\n\
  \n该方案可以同时解决隐私和可扩展性问题。使用 MimbleWimble 技术创建的区块不包含传统比特币区块链中的交易；相反，这些区块由三个列表组成：输入列表、输出列表和称为超额的列表，这些是签名和输出与输入之间的差异的列表。输入列表基本上是对旧输出的引用，输出列表包含机密交易输出。节点可以通过使用签名、输入和输出来验证这些区块以确保区块的合法性。与比特币不同，MimbleWimble\
  \ 交易输出仅包含公钥，并且旧输出与新输出之间的差异由参与交易的所有参与方签名。\n\n\n\n\n\n智能合约安全现在至关重要，许多其他举措也被采取以设计能够分析\
  \ Solidity 程序并查找漏洞的方法。一个最近的、开创性的例子是 Oyente，它是由研究人员构建的工具，并在其论文 *Making Smart Contracts\
  \ Smarter* 中介绍。该论文中发现并分析了智能合约中的若干安全漏洞。这些包括交易排序依赖、时间戳依赖、异常处理不当例如调用栈深度限制利用，以及重入漏洞。交易排序依赖漏洞基本上利用了合约感知状态可能并非执行后合约状态所改变到的状态的场景。这种弱点是一种竞态条件。它也被称为抢先交易，并且由于区块内交易的顺序可以被操纵而成为可能。因为所有交易首先出现在内存池中，内存池中的交易可以在被包含进区块前被监控。这允许在另一笔交易之前提交一笔交易，从而导致控制智能合约的行为。\n\
  \n时间戳依赖漏洞在区块时间戳被用作合约内某种决策制定的来源时是可能的，但时间戳可以被矿工操纵。调用栈深度限制是另一个可以被利用的漏洞，这是由于 EVM 的最大调用栈深度为\
  \ 1,024 帧。如果在合约执行期间达到栈深度，则在某些场景下，send 或 call 指令可能会失败，导致资金未支付。调用栈深度漏洞已在 EIP-150 硬分叉中得到解决。重入漏洞在\
  \ DAO 攻击中被利用，将数百万美元转移到子 DAO 中。重入漏洞基本上意味着一个函数可以在前一次调用尚未完成之前被重复调用。这在 Solidity 智能合约中的以太币提款函数中尤其不安全。\n\
  \n除了上述提到的漏洞外，在编写合约时还应牢记若干其他问题。这些漏洞包括如果向另一个合约发送资金，请谨慎处理，因为 send 可能失败，即使使用 throw 作为\
  \ *catch-all* 机制，也不会起作用。\n\n其他标准软件漏洞，如整数溢出和下溢，也相当重要，任何对整数变量的使用都应在 Solidity 中谨慎实现。例如，一个简单的程序使用\
  \ uint8 来遍历包含超过 255 个元素的数组的元素可能会导致无限循环。这是因为 uint8 仅限于 256 个数字。\n\n在以下章节中，将分别使用 Why3\
  \ 和 Oyente 展示两个合约验证的示例。\n\n## Why3 形式化验证\n\nSolidity 代码的形式化验证现在已作为 Solidity 浏览器的功能提供。首先，代码被转换为验证器可理解的\
  \ Why3 语言。下面示例中展示了一个简单的 Solidity 代码，定义变量 z 为 uint 的最大限制。当此代码运行时，它将返回 0，因为 uint z\
  \ 会溢出并重新从 0 开始。这也可以使用 Why3 进行验证，如下所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_481_0.png)\n\
  \n带形式化验证的 Solidity 在线编译器\n\n一旦 Solidity 代码被编译并在形式化验证标签中可用，它可以被复制到 Why3 在线 IDE，地址为\
  \ http://why3.lri.fr/try/。下面的示例显示它成功检查并报告了整数溢出错误。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_482_0.png)\n\
  \nWhy3\n\n该工具正在积极开发中，但仍然相当有用。此外，该工具或任何其他类似工具都不是灵丹妙药。即使形式化验证通常也不应被视为万灵药，因为首先规范本身应被适当定义。\n\
  \n## Oyente 工具\n\n目前，Oyente 可作为 Docker 镜像提供，便于测试和安装。它可在 https://github.com/ethereum/oyente\
  \ 获取，可快速下载并测试。下面示例中，从 Solidity 文档中取的一个包含重入漏洞的简单合约已被测试，并且显示 Oyente 成功分析代码并找到漏洞：\n\
  \n```solidity\npragma solidity ^0.4.0;\ncontract Fund {\n    mapping(address =>\
  \ uint) shares;\n    function withdraw() {\n        if (msg.sender.send(shares[msg.sender]))\n\
  \            shares[msg.sender] = 0;\n    }\n}\n```\n\n带重入漏洞的合约 – 来源：Solidity 文档\n\
  \n此示例代码包含一个重入漏洞，这基本上意味着如果一个合约与另一个合约交互或转移以太币，它实际上是将控制权交给了另一个合约。这允许被调用的合约在未等待完成的情况下回调调用它的合约的函数。例如，此漏洞可允许再次又再次地回调前面示例中显示的\
  \ withdraw 函数，导致多次获得以太币。这是因为 share 值要到函数结束时才设为 0，这意味着任何后续调用都将成功，导致反复提款。\n\n下面展示了\
  \ Oyente 运行以分析所示合约的示例，如以下输出所示，分析已成功找到重入漏洞。建议通过 Solidity 文档中描述的 Checks-Effects-Interactions\
  \ 模式的组合来处理该漏洞：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_483_0.png)\n\nOyente\
  \ 工具检测 Solidity 漏洞\n\n## 总结\n\n在本章中，读者已了解区块链技术的<|message|> 安全、保密性和隐私方面。隐私也被讨论，这是将公共区块链应用于各个行业的另一个主要制约因素。接下来讨论了智能合约安全，这是当前非常热门的话题。这是一个深奥且广泛的主题，但已给出各个方面的简要介绍，这应为在此领域进一步研究提供坚实基础。例如，形式化验证本身就是一个庞大的研究领域。此外，还提供了形式化验证的示例，以让读者了解有哪些工具可用。应注意，上述工具仍在积极开发中，缺乏各种期望的功能。此外，文档相当稀少；因此，建议读者关注发展，特别是围绕形式化验证以及与\
  \ Ethereum Mauve 论文相关的开发，因为它很快将迅速发展。区块链安全领域，尤其是智能合约安全，现在如此成熟，以至于可以就此主题撰写一整本书。学术界和商业部门有许多专家和研究人员正在探索这一领域，很快将会有许多用于验证智能合约的自动化工具可用。\n"
- '# 13 当前格局与未来展望


  区块链技术将改变我们日常业务的开展方式。它挑战了现有的商业模式，并在成本节约、更高效率和透明度方面具有巨大潜力。本章将探讨该技术的最新发展、 emerging
  趋势、问题和未来预测。此外，本章还将详细讨论与开放研究问题和改进相关的一些主题。


  ### 新兴趋势


  区块链技术由于学术界和商业部门对其的浓厚兴趣而正在快速变化和激烈发展。随着技术的成熟，最近出现了一些趋势。例如，由于其在金融中的特定用例，私有区块链最近获得了相当多的关注。此外，企业区块链是另一个新趋势，旨在开发满足企业级效率、安全性和集成要求的区块链解决方案。一些趋势如下列出并讨论。






  ## 应用特定区块链（ASBCs）


  目前，注意到了一种倾向于 ASBCs 的趋势，即区块链或分布式账本是专门为单一应用而开发，并专注于特定行业，例如 Everledger，这是一个为提供钻石和其他高价值物品的不变追溯历史和审计轨迹而开发的区块链。这种方法挫败了任何欺诈企图，因为与物品的所有权、真实性和价值相关的一切都经过验证并记录在区块链上。这对保险和执法机构非常有价值。


  ## 企业级区块链


  由于区块链在其原始形式下因隐私和可扩展性问题而尚未准备好在企业级别使用，因此出现了开发企业级区块链的最新趋势，各家公司开始提供可部署并在企业级别集成的企业级区块链解决方案。测试、文档、集成和安全等要求在这种类型的解决方案中都已得到解决，并且可以在企业级别以最少或无需更改的方式实施。这与公共区块链形成对比，公共区块链不受监管且不符合特定的企业级安全要求。这也意味着企业级区块链通常应以私有配置实施；然而，公共企业级区块链实施也是可能的。2016
  年是许多技术初创公司开始提供企业级区块链解决方案的一年，例如 bloq、tymez、Chain 等，还有许多其他公司。这一趋势继续增长，2017 年将看到更多类似的技术举措。


  ## 私有区块链


  随着对隐私和保密性的需求，重点主要放在开发可用于受信任参与者群体内的私有分布式账本上。由于公共区块链因其开放且相对安全性较差的特性而不适用于金融、医疗和法律等行业，私有区块链有望解决这一限制，并使终端用户更接近于在满足所有安全和隐私要求的同时获得区块链的好处。公共区块链安全性较低，因为通常它们不提供隐私和保密服务。私有区块链允许参与者或参与者子集完全控制系统，因此使其在金融和其他需要隐私和控制的行业中使用变得理想。Ethereum
  可在私有和公共模式下使用，而有一些项目是专门作为私有区块链开发的，例如 Hyperledger 和 Corda。


  ## 初创公司


  近年来，许多技术初创公司涌现出来，致力于区块链项目并提供针对该技术的特定解决方案。尤其是 2016 年，提供区块链咨询和解决方案的初创公司数量显著增加。


  ## 强烈的科研兴趣


  区块链技术在学术界和商业领域都激发了强烈的科研兴趣。最近，兴趣大大增加，现在世界各地的许多主要机构和研究人员都在探索这项技术。兴趣增长尤其归因于区块链技术可以帮助企业提高效率、降低成本并提高透明度。学术兴趣集中在解决密码学、共识机制、性能以及区块链中的其他限制等难题上。由于区块链技术属于分布式系统的更广泛范畴，许多来自分布式计算研究的研究人员已将研究重点放在区块链技术上。例如，UCL
  设有专门的部门 *UCL Research Centre for Blockchain Technologies*，专注于区块链技术研究。另一个例子是 ETH
  Zurich 分布式计算小组，该小组已发表了关于区块链技术的开创性研究。最近的期刊 Ledger Journal 已出版了其首期研究论文集。它可在 [http://www.ledgerjournal.org/ojs/index.php/ledger](http://www.ledgerjournal.org/ojs/index.php/ledger)
  获取。现在，在各种学术和商业机构中都有专门从事区块链研究和开发的团队和部门。尽管上述举措绝不是详尽无遗的，但它仍然是一个明确的迹象，表明这是研究人员极感兴趣的课题，预计在
  2017 年及以后将看到更多研究和开发。另一个名为 **The Initiative for CryptoCurrencies and Contracts (IC3)**
  的组织也在进行智能合约和区块链技术的研究。IC3 旨在解决区块链和智能合约中的性能、保密性和安全性问题，并运行多个项目来解决这些问题。有关 IC3 中运行项目的更多信息可在
  [http://www.initc3.org/](http://www.initc3.org/) 在线获取。


  ## 标准化


  区块链技术尚未成熟到可以轻松与现有系统集成的程度。即使以当前技术而言，两个区块链网络也无法轻松互通。标准化将有助于改善区块链技术的互操作性、可采用性和集成方面。最近已对此做出了一些尝试，其中最值得注意的是
  ISO/TC 307 的成立，这是一个技术委员会，其范围是标准化区块链和分布式账本技术。该委员会的目标围绕提高用户、应用程序和系统之间互操作性和数据交换。另一方面，R3
  和 Hyperledger 等联盟和开源协作努力的最近创建通过与其他参与者分享想法、工具和代码，有助于该技术的标准化。R3 与 80 多家银行组成的联盟合作，这些银行的目标相似，这在某种程度上导致了标准化。另一方面，Hyperledger
  拥有可用于构建区块链系统的参考架构，并得到 Linux 基金会和许多其他行业参与者的支持。另一个例子是 Chain Open Standard，这是一种为金融网络开发的协议。Chain
  OS1 标准现已可用，该标准是在与世界各地主要金融机构合作下构建的。该标准允许更快地结算交易和即时点对点交易路由。它旨在解决区块链技术中的监管、安全和隐私要求。OS1
  还提供智能合约开发的框架，并允许参与者轻松满足 AML 和 KYC 要求。


  智能合约标准化工作也已开始，*Lee* 等人撰写的开创性论文正式定义了智能合约模板，并提出了未来研究和智能合约相关研究与开发需求的愿景。该论文可在 `https://arxiv.org/abs/1608.00771v2`
  获取。此外，关于该主题的讨论已在 `Chapter 12, Scalability and Other Challenges` 和 `Chapter 6, Smart
  Contracts` 中进行。


  所有上述努力都清楚表明，很快行业中将出现标准，这将进一步使区块链技术的采用变得更容易、更快。标准还将导致区块链行业呈指数级增长，因为标准的可用性将消除诸如互操作性等障碍。


  ## 增强


  在过去几年中，对进一步开发现有区块链的各种增强和建议已被提出。其中大多数建议是在响应安全漏洞并解决区块链技术固有局限性的情况下提出的。区块链技术存在某些限制，例如可扩展性、隐私和互操作性，在其成为像其他技术一样主流之前，这些限制需要得到解决。最近，已对解决区块链技术中的可扩展性问题做出了巨大努力，这些问题已在上一章中讨论。此外，区块链特定改进提案，例如
  **BIPs (bitcoin improvement proposals)** 和 **EIPs (Ethereum improvement proposals)**
  正由开发人员定期提出，以解决这些系统中的各种问题。本章稍后将讨论这两个链的一些最近和值得注意的改进提案。此外，诸如状态通道等最新进展是区块链技术正在迅速改进的例子，很快将发展成为成熟且更实用的技术。


  ## 实际应用


  近年来，尤其是 2016 年，使用区块链技术开发了许多概念验证。出现了一些应用特定实现，例如 Everledger 用于钻石追踪和 Filament 用于 **Internet
  of Things (IoT)**，但在各个方面仍存在不足。具体的、真实的、端到端实现尚未出现，尤其是在金融行业。随着许多概念验证已经开发并证明可行，这似乎为时不远；下一步是在现实场景中实施这些概念。例如，最近，一组七家银行同意建立
  **Digital Trade Chain (DTC)**，以简化贸易融资流程。


  ## 联盟


  2016 年被视为联盟和共享开源努力开始的一年。预计这一趋势将增长，未来不久将出现更多联盟、委员会和开源努力。R3 是主要例子，它与世界最大金融组织的联盟共同开发了
  Corda。






  ## 对挑战的回答


  由于社区对区块链技术进行了深入的研究和浓厚兴趣，针对各种挑战的答案已经开始出现。例如，状态通道的概念就是针对区块链上的可扩展性和隐私问题而发展起来的。利用状态通道，比特币闪电网络和以太坊的雷电网络几乎已准备好实施。此外，还出现了各种区块链解决方案，例如
  Kadena，它直接解决了区块链中的保密性问题。其他概念如 Zcash、CoinJoin 和保密交易也已开发出来，并在前几章中进行了讨论。这一趋势在未来几年也将继续增长，即使区块链技术几乎解决了所有根本性挑战，进一步的增强和优化也永无止境。


  ## 融合


  其他技术与区块链的融合带来了巨大的好处。区块链的核心是提供韧性、安全性和透明度，当与其它技术结合时，会形成一种非常强大的互补技术。例如，物联网在通过区块链实现时可以获得巨大的好处，如完整性、去中心化和可扩展性。人工智能被期望从区块链技术中获益，事实上，在区块链技术中，人工智能可以以自主代理的形式实现。更多示例和上述提到的融合技术将在本章后面的部分详细讨论。


  ## 区块链技术的教育


  虽然区块链技术在全球几乎每个行业的技术人员、开发者和科学家中都引起了极大的兴趣，但正式的学习资源和教育材料却严重缺乏。由于这是一项新技术，各大知名机构例如普林斯顿大学现在都开设了各种课程，向任何想了解这项技术的人介绍该技术。例如，普林斯顿大学已开设了一门关于加密货币和数字货币的在线课程，该课程非常受欢迎。许多私营组织也在提供类似的在线和课堂教学课程。随着区块链技术的普及和接受度提高，未来不久将看到更多这样的努力。


  ## 就业


  在就业市场上出现了一个新的趋势，即招聘人员现在正在寻找区块链专家和开发者，他们能够为区块链编程。这对于金融行业尤其相关，最近许多初创公司和大型组织开始聘用区块链专家。随着技术的进一步接受和成熟，这一趋势当然有望增长。人们也担心区块链开发人员短缺，随着技术的进步，越来越多的开发人员要么通过自学获得经验，要么从一些培训提供商处获得正式培训，这一问题肯定会得到解决。


  ## 密码经济学


  随着区块链的出现，新的研究领域正在涌现，其中最引人注目的是密码经济学，即研究管理去中心化数字经济的协议。随着区块链和加密货币的出现，这一领域的研究也随之增长。密码经济学已被
  Vitalik Buterin 定义为数学、密码学、经济学和博弈论的结合。


  ## 密码学研究


  即使在比特币发明之前几十年，密码学一直是人们极感兴趣和研究的领域，区块链技术也导致了该领域兴趣的重新燃起。随着区块链及相关技术的出现，对密码学的兴趣也显著增加。特别是在金融密码学领域，新的研究正在进行并定期发表。零知识证明、全同态加密和功能加密等技术正在被研究其在区块链中的应用。以
  Zcash 的形式，零知识证明已首次在实践层面得到实现。可以看出，区块链和加密货币有助于密码学的发展，尤其是金融密码学的发展。


  ## 新编程语言


  人们对开发用于智能合约开发的编程语言的兴趣也在增加。工作重点更多地集中在领域特定语言上，例如以太坊的 Solidity 和 Kadena 的 Pact。这只是个开始，随着技术的进步，很可能会开发出更多新语言。


  ## 硬件研究与开发


  当人们在 2010 年意识到当前的方法对于挖矿比特币效率不高时，矿工开始转向优化挖矿硬件。这些最初的努力包括使用 **图形处理器单元**，随后在 GPU 达到极限后使用了
  **现场可编程门阵列**。很快之后，**专用集成电路** 出现了，显著提高了挖矿能力。随着现在对通过并行化和减小芯片尺寸来进一步优化 ASIC 的研究越来越多，这一趋势有望进一步增长。此外，GPU
  编程计划也预计会增长，因为现在新的加密货币相当规律地出现，其中许多使用可以从 GPU 处理能力中受益的工作量证明算法。例如，最近 Zcash 激发了对 GPU
  挖矿设备以及使用 Nvidia CUDA 和 OpenCL 进行相关编程的兴趣。目标是并行使用多个 GPU 来优化挖矿操作。此外，一些研究也在使用可信计算硬件的领域，例如英特尔的
  **软件防护扩展** 来解决区块链上的安全问题。英特尔的 SGX 也被用于一种名为 **经过时间证明** 的新颖共识算法，该算法已在前几章中讨论过。另一个项目
  *21 Bitcoin Computer* 也已开发出来，它作为一个平台，供开发者学习比特币技术并轻松为比特币平台开发应用程序。


  硬件研究与开发的趋势预计将继续下去，很快将探索出更多硬件场景。


  ## 形式化方法与安全研究


  随着人们意识到智能合约编程语言中的安全问题和漏洞，现在对在生产部署前对智能合约进行形式化验证和测试的兴趣非常浓厚。为此，已经开展了各种努力，包括 Why3 用于以太坊的
  Solidity。Hawk 是另一个例子，它被开发出来以允许智能合约保密。


  ## 区块链的替代方案


  随着区块链技术在近年来的发展，研究人员开始思考创建能够提供区块链提供的保证和服务但无需区块链的平台的可能性。这导致了 R3 的 Corda 的开发，它实际上并不是真正的区块链，因为它不基于包含交易的块的概念；相反，它基于状态对象的概念，该对象根据网络参与者的要求和规则在
  Corda 网络中传递，代表网络的最新状态。其他例子包括 IOTA，它是一种物联网区块链，使用有向无环图作为名为 Tangle 的分布式账本，而不是传统的带块的区块链。据称该账本解决了可扩展性问题，同时具有高水平的安全性，甚至可抵御基于量子计算的攻击。应注意的是，比特币在某种程度上也对量子攻击具有一定的防护，因为量子攻击只能作用于暴露的公钥，而这些公钥只有在区块链上同时进行发送和接收交易时才会暴露。如果公钥未被揭示，即在未使用的地址或仅用于接收比特币的地址中，则可以保证量子安全性。换句话说，为每次交易使用不同的地址可以提供对量子攻击的保护。此外，在比特币中，如果需要，改变为另一种量子签名协议是相当容易的。


  ## 互操作性努力


  最近人们意识到区块链之间互操作性的局限性，导致了能够跨多个区块链工作的系统的开发。最近的一个例子是 Qtum，它是一种与以太坊和比特币区块链都兼容的区块链。它使用比特币的
  UTXO 机制进行价值转移，并使用以太坊虚拟机进行智能合约。这意味着以太坊项目可以在无需任何更改的情况下移植到 Qtum 上。






  ## 作为服务的区块链


  随着云平台成熟度的不断提高，许多公司开始提供 **区块链即服务 (BaaS)**。最突出的例子是微软的 Azure，在其中以太坊区块链作为服务提供，以及 IBM
  的 Bluemix 平台，提供 IBM BaaS。预计这一趋势在未来几年只会增长，将会有更多公司提供 BaaS。EgaaS（**电子政务即服务**）是另一个例子，它实际上是
  BaaS，但为治理功能提供应用特定的区块链。该项目的目标是在没有文件流转和官僚开销的情况下组织和控制任何活动。


  ## 减少电力消耗的努力


  从比特币的区块链中可以清楚地看出，工作量证明机制是非常低效的。当然，这种计算可以保护比特币网络，但这种计算没有其他益处，并且浪费了大量电能。为了减少这种浪费，现在更注重绿色选项，例如权益证明算法，它们不需要像比特币工作量证明算法那样庞大的资源。预计这一趋势将会增长，尤其是以太坊计划采用权益证明。

  '
- '## 改进提案


  两种主要的区块链技术，即比特币和以太坊，都具有在现有协议中提出改进的正式机制。这些被称为改进提案，BIPs 和 EIPs。这两种机制都允许来自世界各地的开发人员和技术爱好者参与，并帮助比特币和以太坊随着时间的推移发展成为更成熟、更安全的技术。在下面的章节中，将讨论两个区块链的著名改进提案。


  ## BIPs


  在本节中，将讨论一些最新的 BIPs。


  ### BIP 152


  该提案是对比特币网络引入紧凑区块的改进建议，以节省带宽。在当前状态下，比特币协议在带宽效率方面并不理想，该提案旨在通过允许节点之间中继紧凑区块来解决该问题。为了实施该提案，需要进行多项更改，例如新的数据结构和消息。目前，该提案处于草案状态。它可在
  GitHub 上获取，网址为 https://github.com/bitcoin/bips/blob/master/bip-0152.mediawiki。


  ### BIP 151


  该改进提案旨在引入点对点通信加密。该提案是在针对比特币协议的各种安全问题做出的，例如流量分析和操纵的可能性。该提案将有助于挫败通过源 IP 和比特币网络上的交易内容识别用户的企图。BIP
  中提出了多个新消息以在参与节点之间请求和启用加密。它可在 https://github.com/bitcoin/bips/blob/master/bip-0151.mediawiki
  获取。


  ### BIP 150


  该提案提出了一种对等身份验证方法。这将允许解决中间人攻击，并提供保证，即对等方正在连接到合法节点。它可在 GitHub 上获取，网址为 https://github.com/bitcoin/bips/blob/master/bip-0150.mediawiki。


  ### BIP 147


  该提案旨在解决虚拟栈元素可塑性问题。签名可塑性是一个已知问题，可以由任何中继节点通过简单地更改与交易关联的签名来执行。这是一个共识层级的改进提案，需要软分叉才能实施。BIP
  147 在 GitHub 上有文档记录，网址为 https://github.com/bitcoin/bips/blob/master/bip-0147.mediawiki。


  ### BIP 146


  该改进旨在解决签名编码可塑性问题。这需要软分叉才能实施。如果实施，这将解决与 ECDSA 签名编码机制中的根本限制相关的签名可塑性问题。这种限制是 ECDSA
  的固有特性。其次，由于如果签名验证失败，验证脚本评估仍将继续并允许对签名设置任何值。本 BIP 是为了解决此问题而提出的提案。它记录在 https://github.com/bitcoin/bips/blob/master/bip-0146.mediawiki。


  还有许多其他 BIPs 用于建议比特币协议的改进。在本节中，仅介绍了最新的五个提案。近年来，已针对比特币提出了近 90 项改进提案，这一过程仍在继续。


  ## EIPs


  以太坊有自己的改进提案版本，称为 EIPs。以下是一些最近的 EIPs 的讨论。


  ### EIP 170


  该改进提案旨在解决在预处理阶段或从磁盘读取代码时由于合约代码过大而导致燃气使用过度而可能出现的一定漏洞。建议将合约代码大小限制为 23,999 字节。关于该提案的进一步讨论导致了对该提案的进一步改进，并已被接受。然而，这尚未实施。


  ### EIP 150


  该改进提案是在针对以太坊区块链的拒绝服务攻击做出的回应。它已作为硬分叉实施，自以太坊主网区块 2463000 起生效。该 EIP 解决了因交易垃圾邮件攻击而产生的问题，例如，反复调用
  EXTCODESIZE 操作码，导致区块链验证过程变慢。该 EIP 是为了增加若干操作码的燃气成本，以阻止因这些操作码过度重复使用而导致的拒绝服务攻击。


  ### EIP 161


  该提案旨在允许从以太坊区块链中删除空账户。这是在针对以太坊区块链的拒绝服务攻击的回应中制定的，攻击者创建了大量空账户。这是因为账户创建成本低。这称为状态 trie
  清理，它将允许通过向账户发出 CALL 指令来删除空账户。


  ### EIP 160


  该建议旨在提高 EXP 操作码成本。该改进提案的核心思想是使 EXP 操作的成本与操作的复杂性成比例。该提案有助于阻止因调用计算密集型操作而产生的拒绝服务攻击。


  ### EIP 155


  该改进提案旨在消除在主以太坊区块链上重放来自不同链的交易的可能性。例如，如果在以太坊网络上进行交易，则可以在以太坊经典网络上重放；该 EIP 解决了此问题。此外，任何已在测试网络上进行过的交易都不应能够在主网络上重放。


  上述所有改进都导致了硬分叉，并作为对最近以太坊拒绝服务攻击的回应而实施。改进提案是向以太坊区块链引入新增强功能和协议级错误修复的关键机制。已实施或提出的以太坊改进提案约有
  11 项。所有这些都记录在 GitHub 上，网址为 https://github.com/ethereum/EIPs/。

  '
- '## 其他挑战


  除了上一章讨论的安全性和隐私之外，在区块链能够实现主流采用之前，还需要解决几个其他障碍。这些包括监管、政府控制、不成熟的技术、与现有系统的集成以及实施成本。


  监管被认为是需要解决的最大挑战之一。核心问题是区块链，尤其是加密货币，未被任何政府承认为法定货币。即使在某些情况下，它在美国和德国被归类为货币，但它仍然远未被接受为正常货币。此外，区块链在当前状态下未被承认为可被金融机构使用的平台。没有任何金融监管机构将其接受为可被授权使用的平台。然而，世界各地的监管机构已采取各种举措来研究和提出监管。比特币在当前状态下完全不受监管，尽管政府已做出一些征税尝试。在英国，根据欧盟增值税指令，比特币交易免征增值税，但脱欧后这种情况可能会改变。然而，在某些情况下，资本利得税仍可能适用。


  预计金融监管机构很快将对区块链技术，尤其是英国金融行为监管局最近宣布可能批准一些使用区块链的公司之后，提出一些监管尝试。


  普遍担忧的是，区块链技术尚未真正准备好用于生产部署。尽管比特币区块链已发展成为一个坚实的区块链平台并在生产中使用，但它并不适用于每个场景。这在金融和医疗等敏感环境中尤其如此。然而，随着之前章节中讨论的大量努力正在进行以改进技术并解决任何技术限制，例如可扩展性和隐私，预计这种情况很快就会改变。安全也是另一个普遍担忧，已被许多研究人员强调，尤其适用于金融和医疗行业。欧洲联盟网络和信息安全局最近的一份报告强调了应解决的分布式账本特定问题。报告中强调的一些问题包括智能合约管理、密钥管理、反洗钱和反欺诈工具。报告中还强调了对监管、审计、控制和治理的需求。


  与现有遗留系统的集成也是主要问题。目前尚不清楚区块链如何与现有金融系统集成。


  采用的障碍或多或少与监管、安全和互操作性相关。可以通过多种方式与现有系统集成。






  ## 黑暗面


  区块链技术具有抗审查和去中心化等关键属性，可以帮助在生活的许多方面提高透明度和效率，但这种技术某种程度上不受监管的特性意味着它也可以被罪犯用于非法活动。例如，比较这样一种场景：如果某些非法内容在互联网上发布，可以通过联系相关当局和网站服务提供商立即将其关闭，但在区块链中这是不可能的。一旦某些内容存在于区块链上，就几乎不可能将其撤回。这意味着任何不可接受的内容，一旦发布到区块链上，就无法被移除。如果区块链被用于分发不道德的内容，那么就没有任何人可以将其关闭。这带来了一个严重挑战，似乎在这种情况下某种监管和控制是有益的，但如何监管区块链呢？这又是另一个重要问题。先制定监管法律然后再看看区块链技术是否适应可能并不明智，因为这可能会破坏该技术的创新和进步。更明智的做法是让区块链技术先发展起来，就像互联网一样，当它达到临界规模时，管理机构可以呼吁对区块链技术的实施和使用进行一些监管。


  存在各种例子，暗网与比特币结合用于进行非法活动。例如，*Silk Road*，它曾被用于在互联网上销售非法毒品，使用比特币进行支付，并使用暗网的洋葱 URL，这些
  URL 只有使用 *Tor* 才能看到。尽管 *Silk Road* 在执法机构数月的努力后被关闭，但新的类似网站开始出现。现在有其他替代方案提供类似服务；因此，通常来说，这种类型的问题仍然是一个很大的担忧。想象一下，如果一个非法网站在
  IPFS 和区块链上，就没有简单的方法将其关闭。很明显，缺乏控制和监管会鼓励犯罪活动，类似 *Silk Road* 的问题将不断出现。像 Zcash 这样的完全匿名交易能力的进一步发展可以为罪犯提供另一层保护，但同时在各种合法场景中也可能非常有用。这真的取决于谁在使用该技术；匿名性在许多场景中可能是好的，例如在医疗行业，患者记录应保持私密和匿名，但在可能被罪犯用来隐藏其活动时可能就不合适了。


  ## 密码学功能的局限性


  比特币区块链中使用的密码学极其安全，并且经受住了时间的考验。在其他区块链中，使用了类似的安全技术，也非常安全。然而，特定的安全问题，例如在椭圆曲线数字签名方案中生成和使用重复签名随机数（导致私钥恢复攻击）的可能性、哈希函数中的碰撞，以及可能破坏底层密码学算法的量子攻击的可能性，仍然是一个有趣的研究领域。


  ## 共识算法


  对权益证明算法或工作量证明的替代方案的研究也是一个重要的研究领域。这尤其相关，因为目前比特币网络的电力消耗预计到 2020 年将达到近 14 吉瓦。也有人建议，与其像比特币的工作量证明那样执行低效或单一用途的工作，网络电力可以用来解决一些数学或科学问题。此外，像权益证明算法这样的替代方案已经获得了很大的关注，并将在主要区块链中实施，例如以太坊的
  Casper。然而，到目前为止，工作量证明仍然是保护公共区块链的最佳选择。


  ## 可扩展性


  关于可扩展性的详细讨论已在上一章中进行过；简而言之，在本节中足以说，虽然已经取得了一些进展，但仍需要更多研究以实现链上可扩展性并进一步改进状态通道等链下解决方案。一些倡议如区块大小增加和仅交易区块链（无区块）已被提出，以通过增加区块链本身的容量而不是使用侧通道来解决可扩展性问题。*无区块*实现的例子包括
  IOTA（Tangle），它是一种用于存储交易的**有向无环图（DAG）**，与传统的区块链解决方案相比，后者使用区块来存储交易。这使其本质上比基于区块的区块链（如比特币）更快，后者区块生成之间的等待时间至少约为
  10 分钟。


  ## 代码混淆


  如上一章所述，使用不可区分混淆的代码混淆可以作为在区块链中提供保密性和隐私性的手段。然而，这仍然不实用，需要大量的研究工作才能实现。

  '
- '## 值得注意的项目列表


  以下是区块链领域目前正在进行的知名项目列表。除了这些项目之外，还有大量初创公司和公司在区块链领域工作并提供区块链相关产品。


  ### Zcash on Ethereum


  以太坊研发团队最近的一个项目是在以太坊上实现 Zcash。这是一个有趣的项目，开发人员正试图使用 Zcash 项目中已有的 zk-SNARKs 为以太坊创建隐私层。通过在以太坊上实现
  Zcash，目标是创建一个平台，允许创建投票等隐私至关重要的应用程序。它还将允许在以太坊上创建匿名代币，可用于多种应用。


  ### CollCo


  这是由 Deutsche Börse 开发的项目，基于 Hyperledger 代码库，用于管理商业银行现金转账。**抵押币（Collateralized Coin，CollCo）**提供了一个基于区块链的平台，允许实时转账商业银行资金，同时仍依赖于
  Eurex Clearing CCP 提供的传统功能。这是一个可用于解决交割后结算流程低效问题的重要项目。


  ### Cello


  截至 2017 年 2 月，这是 Hyperledger 项目中最新的补充。该项目的目标是提供按需 BaaS，这将使部署和管理多个区块链对用户来说方便且简单。预计
  Cello 将支持所有未来和当前的 Hyperledger 区块链，例如 Fabric 和 Sawtooth Lake。


  ### Qtum


  该项目基于将比特币和以太坊区块链功能结合起来的想法。Qtum 使用比特币代码库，但使用以太坊的 EVM 进行智能合约执行。以太坊智能合约可以使用比特币的 UTXO（未花费交易输出）模型运行。它可在
  https://qtum.org/ 获取。


  ### Bitcoin-NG


  这是解决比特币区块链可扩展性、吞吐量和速度问题的另一个提案。下一代（NG）协议基于领导者选举机制，该机制在交易发生时立即验证交易，而与比特币协议相比，后者区块之间的时间和区块大小是与可扩展性相关的关键限制。


  ### Solidus


  这是一种新的加密货币，它提供了解决自私挖矿的方案，同时解决扩展和性能问题。它还解决了保密性问题。它基于无许可拜占庭共识。其当前状态的协议相对复杂，是一个开放的研究领域。


  ### Hawk


  这是一个旨在解决区块链中智能合约隐私问题的项目。它是一个智能合约系统，允许对区块链上的交易进行加密。Hawk 能够自动生成与区块链交互的安全协议，而无需手动编程密码学协议。


  ### Town-Crier


  这是一个旨在为智能合约提供真实世界可信数据馈送的项目。该系统基于英特尔 SGX 可信硬件技术。这是预言机设计的进一步发展，智能合约可以在保护机密性的同时从在线来源请求数据。






  ## SETLCoin


  这是一个由 *Goldman Sachs* 构建的系统，并已在 *Cryptographic currency for Securities settlement*
  申请下申请专利。顾名思义，这种加密货币 *coin* 可用于快速高效的结算。该技术利用虚拟钱包在网络上的点对点之间交换资产，并允许通过拥有 SETLCoin 实现即时结算。


  ## TEEChan


  这是一种利用 **trusted execution environments (TEEs)** 提供可扩展且高效的比特币区块链扩容解决方案的新颖想法。这与支付通道的概念类似，其中链下通道用于更快地转移交易。该想法的关键吸引力在于，它可以在比特币区块链上实现，而无需对比特币网络进行任何更改，因为它是一种链外解决方案。然而，这里有一个小小的[content]


  ## SETLCoin


  这是一个由 *Goldman Sachs* 构建的系统，并已在 *Cryptographic currency for Securities settlement*
  申请下申请专利。顾名思义，这种加密货币 *coin* 可用于快速高效的结算。该技术利用虚拟钱包在网络上的点对点之间交换资产，并允许通过拥有 SETLCoin 实现即时结算。


  ## TEEChan


  这是一种利用 **trusted execution environments (TEEs)** 提供可扩展且高效的比特币区块链扩容解决方案的新颖想法。这与支付通道的概念类似，其中链下通道用于更快地转移交易。该想法的关键吸引力在于，它可以在比特币区块链上实现，而无需对比特币网络进行任何更改，因为它是一种链外解决方案。然而，这里有一个小小的缺点，即该解决方案确实需要信任
  Intel 进行远程证明，因为 Intel 的 SGX CPU 用于提供 TEEs。这在去中心化区块链中不是一个理想的属性；不过，需要注意的是，即使使用远程证明，交易的保密性仍然得到保留，因为远程证明者
  Intel 无法看到用户之间通信的内容。这一限制使得它是否是一个完全去中心化和无信任的解决方案存在争议。


  ## Falcon


  Falcon 是一个项目，通过提供快速中继网络来广播比特币区块，从而帮助比特币扩容。其核心思想围绕一种减少孤块的技术，从而有助于比特币网络整体的可扩展性。为此目的使用的技术被称为应用级穿透路由。


  ## Bletchley


  该项目由 Microsoft 推出，表明了 Microsoft 对区块链技术的承诺。Bletchley 允许使用 Azure 云服务以用户友好的方式构建区块链。Bletchley
  引入的一个主要概念称为 *cryptlets*，可以将其视为一种高级版本的 Oracles，驻留在区块链之外，可以通过安全通道由智能合约调用。它们可以用任何语言编写，并在安全容器内执行。


  ## Solidity extension for Microsoft Visual studio


  此扩展为去中心化应用提供 Intellisense、自动完成功能和模板，并在熟悉的 Visual Studio IDE 中运行，使开发人员更容易熟悉以太坊开发。


  ## MetaMask


  这是一个 DAPP 浏览器，从 DAPP 浏览的角度来看类似于 Mist，但允许用户在浏览器内运行以太坊去中心化应用，而无需运行完整的以太坊节点。这可从 https://metamask.io/
  获取，可作为 Chrome 插件安装。


  ## Stratis


  这是一个区块链开发平台，允许创建定制的私有区块链，并与主 Stratis 区块链 Stratis chain 协同工作以确保安全。它允许轻松部署比特币、以太坊和
  Lisk 等主要区块链。此外，它还允许使用 C# .Net 技术进行开发。它还可通过 Microsoft Azure 作为 BaaS 使用。可在 https://stratisplatform.com/
  获取。


  ## Embark


  这是一个用于以太坊的开发框架，允许与前几章中讨论的 truffle 类似的功能。它允许智能合约的自动部署，更轻松地与 JavaScript 集成，尤其是更轻松地与
  IPFS 集成。这是一个功能非常丰富的框架，还有更多功能可用。可通过 npm 安装。该框架可在 GitHub 上获取：https://github.com/iurimatias/embark-framework。


  ## DAPPLE


  这是在以太坊上用于更轻松开发和部署智能合约的另一个框架，通过处理更复杂的任务来实现。它可用于包管理、合约构建和部署脚本编写。它也可通过 npm 获取。也可在 GitHub
  上获取：https://github.com/nexusdev/dapple。


  ## Meteor


  这是一个用于单页应用的全栈开发框架。可用于以太坊 DAPP 开发。Meteor 中提供了一个开发环境，它允许更轻松、可管理的复杂 DAPP 开发。可在 `https://www.meteor.com/`
  获取，以太坊特定 DAPP 构建信息可在 `https://github.com/ethereum/wiki/wiki/Dapp-using-Meteor` 获取。


  ## uPort


  该平台建立在以太坊之上，提供去中心化身份管理系统。这使用户能够完全控制其身份和个人信息。这基于声誉系统的理念，使用户能够相互证明并建立信任。可在 `https://www.uport.me/`
  获取。


  ## INFURA


  该项目旨在提供企业级的以太坊和 IPFS 节点。INFURA 由以太坊节点、IPFS 节点和一个名为 Ferryman 的服务层组成，该服务层提供路由和负载均衡服务。

  '
- '## Convergence with other industries


  区块链与物联网的融合已在上一章中进行了详细讨论。简而言之，可以说由于区块链的真实性、完整性、隐私性和共享性，物联网网络将从区块链技术中获益匪浅。这可以以运行在区块链上的物联网网络的形式实现，并利用去中心化网状网络进行通信，以便实时促进
  **machine-to-machine (M2M)** 通信。所有这些作为 M2M 通信结果生成的数据都可以在机器学习过程中使用，以增强人工智能 DAO 或简单
  AA 的功能。AA 可以作为 **Distributed Artificial Intelligence (DAI)** 环境中的 *agents* 充当代理，该环境由区块链提供，并可随着时间的推移使用机器学习过程进行学习。


  AI 是计算机科学的一个领域，致力于构建能够根据其观察到的场景和环境做出合理决策的智能代理。机器学习在 AI 中发挥着至关重要的作用，利用原始数据作为学习资源。AI
  系统的一个关键要求是提供可用于机器学习和模型构建的真实数据的可用性。来自物联网设备、智能手机和其他数据采集手段的数据爆炸使得 AI 和机器学习变得越来越强大。然而，需要数据的真实性。一旦消费者、生产商和其他实体都在区块链上，这些实体之间交互产生的数据就可以作为机器学习引擎的输入，并保证其真实性。这就是
  AI 与区块链融合的地方。可以认为如果物联网设备被黑客攻击，它可以向区块链发送畸形数据。该问题得以缓解，因为物联网设备是区块链的一部分 作为节点，并像区块链网络中的普通节点一样应用了所有安全属性。这些属性包括良好行为的激励、拒绝畸形交易、以及区块链协议的一部分的交易严格验证和各种其他检查。因此，即使物联网设备以某种方式被黑客攻击，它也会被区块链网络视为拜占庭节点，并且不会对网络造成任何不利影响。


  此外，结合智能 Oracles、智能合约和 AA 的可能性将催生 **Artificially Intelligent Decentralized Autonomous
  Organizations (AIDAOs)**，它们可以代表人类运行整个组织。这也是 AI 的另一个方面，未来可能会成为常态。然而，要实现这一愿景，还需要更多的研究。


  此外，区块链技术与其他领域如 3D 打印、虚拟现实、增强现实和游戏行业的融合也正在被设想。例如，在多人在线游戏中，区块链的去中心化方法允许更大的透明度，并可确保没有任何中央机构通过操纵游戏规则获得不公平的优势。所有这些主题目前都是活跃的研究领域，预计在不久的将来这些领域将有更多兴趣和开发。

  '
- '## Future


  预计 2017 年将是区块链技术在现实世界生产环境中实施并从前几年的概念验证和理论阶段迈出的一年。本节中做出了一些谨慎的预测，这些预测基于相关领域当前的进展和进展速度。所有这些预测都可能在
  2020 年至 2050 年之间实现：




  - 物联网将在多个区块链上运行，并将催生 M2M 经济。


  - 医疗记录将在由医疗服务提供者联盟运营的多个私有区块链之间安全共享，同时保护患者的隐私。也可能是一个由所有服务提供商共享的单一私有区块链。


  - 选举将通过去中心化的网络应用程序进行，后端为区块链，以透明和安全的方式进行。


  - 金融机构将运行许多私有区块链，以在参与者之间共享数据并用于内部流程。


  - 金融机构将使用半私有区块链来提供反洗钱和了解客户功能的身份信息，并将在世界各地许多或所有金融机构之间共享。


  - 与移民和边境管制相关的活动将被记录在区块链上，护照管制将通过世界各地所有入境口岸和边境机构共享的区块链进行。


  - 密码学和分布式系统的研究将达到新的高度，大学和教育机构将提供关于加密经济学、加密货币和区块链的专门课程。


  - 人工智能 DAO（Machina Economicus）将在区块链上占据主导地位，代表人类做出理性决策。


  - 公众可用的受监管区块链将由公民在日常活动中日常使用。


  - BaaS 将作为标准提供给任何希望在其业务或日常交易中使用区块链的人。事实上，可以设想，就像互联网一样，区块链将无缝集成到我们的日常生活中，人们在使用它们时几乎不会了解太多底层技术和基础设施。


  - 区块链将通常用于提供 DRM（数字版权管理）服务，用于艺术和媒体，并可用于向消费者交付内容，实现消费者与生产者之间的直接沟通。这将消除任何中央机构管理有价值商品的许可和权利管理的需要。


  - 现有的加密货币如比特币将继续升值，随着状态通道和可扩展性工作的可用性，这一趋势预计只会增长。


  - 加密货币投资将大幅增加，并将出现新的加密经济社会。


  - 比特币价值将达到每枚数万美元。


  - 数字身份将常规地在区块链上管理，不同的政府职能如投票、税收和资金发放将通过区块链启用平台进行。

  - 金融机构和清算所将在 2017 年底或 2018 年初开始为其客户引入基于区块链的解决方案。

  '
- '## Summary


  区块链将改变世界。革命已经开始，预计只会以指数级规模增长。本章探讨了各种项目和区块链技术的当前状态。首先，讨论了一些随着技术进一步发展而预计会持续的趋势。世界各地许多研究人员和组织对区块链技术有浓厚的研究兴趣，本章也介绍了某些研究主题。此外，与物联网和人工智能等其他领域的融合也进行了讨论。最后，对区块链技术的增长做出了一些预测。其中大多数预测可能在未来十年左右实现，而有些可能需要更长时间。区块链技术有潜力改变世界，一些积极的迹象已经在成功的概念验证实施以及越来越多爱好者和开发者对该技术的兴趣中显现。很快，区块链将与我们的生活交织在一起，就像互联网现在一样。本章只是对区块链的巨大和惊人潜力进行了适度的概述，未来不久该技术预计将实现指数级增长。

  '
