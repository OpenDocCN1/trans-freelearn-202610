  \ co... | Bitcoin: [unknown command] |\n| 818.298733000 | ping | Bitcoin: ping |\n\
  \n总共有 27 种协议消息，但随着协议的发展，它们可能会随着时间推移而增加。最常用的协议消息及其解释如下所示：\n\n- **Version:** 这是节点发送到网络的第一条消息，广告其版本和区块计数。远程节点然后用相同的信息进行回复，然后建立连接。\n\
  - **Verack:** 这是 version 消息的响应，接受连接请求。\n- **Inv:** 这用于节点广告其对区块和交易的了解。\n\n\n\n\n\n\
  这些过滤器主要由简单的支付验证 SPV 客户端使用，以请求它们感兴趣的交易和默克尔块。默克尔块是区块的轻量级版本，其中包括区块头、一些哈希值、一个 1 位标志的列表以及交易计数。这些信息随后可用于构建默克尔树。这是通过创建仅匹配\
  \ SPV 客户端已请求的交易和区块的过滤器来实现的。在版本消息交换完毕且节点之间建立连接后，节点可以根据其需求设置过滤器。这些概率过滤器提供的隐私或精度程度各不相同，具体取决于它们设置的准确或宽松程度。严格的布隆过滤器只会过滤节点已请求的交易，但代价是可能向能够根据\
  \ IP 地址将交易与之关联的对手方泄露用户地址，从而损害隐私。另一方面，宽松设置的过滤器可能会导致检索到更多无关交易，但会提供更多隐私。此外，对于 SPV 客户端，布隆过滤器使它们能够使用低带宽，而无需下载所有交易以进行验证。\n\
  \n- BIP 37 提出了比特币中布隆过滤器的实现，并向比特币协议引入了三个新消息。\n- Filterload：用于在连接上设置布隆过滤器。\n- Filteradd：这会向当前过滤器添加新的数据元素。\n\
  - FilterClear：这会删除当前加载的过滤器。\n\n更多细节可在 BIP37 规范中找到。\n\n## Wallets\n\n钱包软件用于存储私钥或公钥和比特币地址。它执行各种功能，例如接收和发送比特币。如今，软件通常提供两种功能：比特币客户端和钱包。在磁盘上，比特币核心客户端钱包以\
  \ Berkeley DB 文件的形式存储：\n\n```\n:~/.bitcoin$ file wallet.dat\nwallet.dat: Berkeley\
  \ DB (Btree, version 9, native byte-order)\n```\n\n私钥可以通过不同方式生成，并被不同类型的钱包使用。钱包不存储任何硬币，也没有钱包为用户存储余额或硬币的概念。事实上，在比特币网络中，硬币并不存在；相反，只有交易信息存储在区块链上（更准确地说，UTXO，未花费输出），然后用于计算比特币数量。\n\
  \n### Wallet types\n\n在比特币中，有不同类型的钱包可用于存储私钥。作为软件程序，它们还为用户提供在比特币网络上管理和执行交易的一些功能。\n\
  \n#### Non-deterministic wallets\n\n这些钱包包含随机生成的私钥，也称为 *Just a Bunch of Keys* 钱包。比特币核心客户端在首次启动时会生成一些密钥，并在需要时生成密钥。管理大量密钥非常困难，并且容易出错的过程可能导致硬币被盗和丢失。此外，需要定期备份密钥并适当保护它们以防止被盗或丢失。\n\
  \n#### Deterministic wallets\n\n在此类钱包中，密钥是通过哈希函数从种子值派生的。该种子数字是随机生成的，通常由人类可读的 *助记码*\
  \ 词表示。助记码词在 BIP39 中定义。此短语可用于恢复所有密钥，并使私钥管理相对容易。\n\n#### Hierarchical deterministic\
  \ wallets\n\nHD 钱包在 BIP32 和 BIP44 中定义，将密钥存储在从种子派生的树结构中。种子生成父密钥（主密钥），该密钥用于生成子密钥，随后生成孙密钥。HD\
  \ 钱包中的密钥生成不会直接生成密钥；相反，它会产生一些信息（私钥生成信息），可用于生成一系列私钥。如果已知主私钥，则 HD 钱包中私钥的完整层次结构很容易恢复。正因为此特性，HD\
  \ 钱包非常易于维护且高度便携。\n\n#### Brain wallets\n\n主私钥也可以从记忆的密码的哈希值派生。关键思想是，此密码短语用于派生私钥，如果在\
  \ HD 钱包中使用，则可从单个记忆密码派生出完整的 HD 钱包。这被称为脑钱包。此方法容易受到密码猜测和暴力攻击，但诸如 *密钥拉伸* 之类的技术可用于减缓攻击者的进展。\n\
  \n#### Paper wallets\n\n顾名思义，这是一种纸质钱包，其所需密钥材料打印在上面。它需要物理安全存储。纸钱包可以从各种服务提供商在线生成，例如\
  \ https://bitcoinpaperwallet.com/ 或 https://www.bitaddress.org/。\n\n#### Hardware\
  \ wallets\n\n另一种方法是使用防篡改设备存储密钥。此防篡改设备可以是定制构建的，或者随着 NFC 启用手机的出现，也可以是 NFC 手机中的安全元件（SE）。Trezor\
  \ 和 Ledger 钱包（各种类型）是最常用的比特币硬件钱包。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_172_0.png)\n\
  \nTrezor Wallet\n\n#### Online wallets\n\n在线钱包顾名思义完全在线存储，通常作为云服务提供。它们为用户提供 Web 界面来管理钱包并执行各种功能，例如进行和接收付款。它们易于使用，但意味着用户信任在线钱包服务提供商。\n\
  \n#### Mobile wallets\n\n移动钱包顾名思义安装在移动设备上。它们可以提供各种付款方式，最值得注意的是能够使用智能手机摄像头快速扫描二维码并付款。移动钱包可用于\
  \ Android 平台和 iOS，例如 breadwallet、copay 和 Jaxx。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_173_0.png)\n\
  \nJaxx Mobile wallet\n\n## Bitcoin payments\n\n比特币可以通过各种技术接受为付款。在许多司法管辖区，比特币不被承认为法定货币，但它正越来越多地被许多在线商家和电子商务网站接受为付款方式。买家可以通过多种方式向接受比特币的商家付款。例如，在在线商店中，可以使用比特币商家解决方案，而在传统实体店中，可以使用销售点终端和其他专用硬件。客户只需扫描包含卖方付款\
  \ URI 的二维码，即可使用移动设备付款。比特币 URI 允许用户只需点击链接或扫描二维码即可付款。URI（统一资源标识符）基本上是表示交易信息的字符串。它在\
  \ BIP21 中定义。二维码可以显示在销售点终端附近。几乎所有比特币钱包都支持此功能。\n\n商家可以使用以下截图来宣传他们可以接受比特币作为付款。\n\n\
  ![](img/62ab880d2302f959d34db648cb0bec5e_174_0.png)\n\nbitcoin accepted here logo\n\
  \n各种付款解决方案，例如 xbtterminal 和 34 bytes bitcoin POS 终端在商业上均有提供。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_174_1.png)\n\
  \n34 bytes POS solution.\n\n比特币支付处理器由许多在线服务提供商提供，允许与电子商务网站集成。简单的互联网搜索可以揭示许多选项。\n\
  \n已提出并最终确定了各种 BIPs，以引入和标准化比特币支付。最值得注意的是，BIP 70（安全支付协议）描述了商家与客户之间安全通信的协议。该协议使用 X.509\
  \ 证书进行身份验证，并在 HTTP 和 HTTPS 上运行。该协议中有三条消息：PaymentRequest、Payment 和 PaymentACK。该提案的关键特性是对中间人攻击的防御和安全的付款证明。中间人攻击可能导致攻击者坐在商家和买家之间，买家似乎在与商家交谈，但实际上，*中间人*\
  \ 正在与买家交互而不是商家。这可能导致操纵商家的比特币地址以欺骗买家。\n\n还有其他几个 BIPs，例如 BIP71 和 BIP72，也被提出以标准化支付消息封装和\
  \ URI 方案以支持 BIP70。\n\n比特币闪电网络，即可扩展的链下即时支付解决方案，于 2016 年初推出，允许链下支付。该网络使用在区块链之外运行的支付通道。这允许比特币具有更大的速度和可扩展性。本文可在\
  \ https://lightning.network/ 获取，有兴趣的读者应阅读本文以了解该发明的理论和原理。\n\n## Bitcoin investment\
  \ and buying and selling bitcoins\n\n有许多在线交易所，用户可以在其中买卖比特币。这现在是互联网上的大生意，它提供比特币交易、差价合约、差价投注、保证金交易以及各种其他选择。交易者可以买入比特币或通过开设多头或空头头寸来交易，以在比特币价格上涨或下跌时获利。还有其他功能，例如将比特币兑换为其他虚拟货币也是可能的，许多在线比特币交易所提供此功能。还提供高级市场数据、交易策略、图表和支持交易者的相关数据。CEX.IO\
  \ 的示例在此显示。其他交易所提供类似类型的服务。\n\n\n\n\n\n以下截图显示了交易所的订单簿，其中列出了所有买单和卖单：\n\nExample of\
  \ bitcoin exchange cex.io\n\nExample of bitcoin order book at exchange cex.io\n\n\
  ## Bitcoin installation\n\n比特币核心客户端可以从 https://bitcoin.org/en/download 安装。此版本适用于不同的架构和平台，从\
  \ x86 windows 到 ARM Linux，如以下图像所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_177_0.png)\n\
  \n## Setting up a bitcoin node\n\n以下是 Ubuntu 上比特币核心安装的示例运行；对于其他平台，您可以从 www.bitcoin.org\
  \ 获取详细信息。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_178_0.png)\n\nStep 2:\n\n\
  ```\ndrequinox@drequinox-OP7010:~$ sudo apt-get update\n```\n\n根据所需客户端，用户可以使用以下任一命令，或同时发出两个命令：\n\
  \n```\nsudo apt-get install bitcoind\nsudo apt-get install bitcoin-qt\ndrequinox@drequinox-OP7010:~$\
  \ sudo apt-get install bitcoin-qt bitcoind\nReading package lists... Done\nBuilding\
  \ dependency tree\nReading state information... Done\n......\n```\n\n## Setting\
  \ up the source code\n\n如果用户希望参与比特币代码或出于学习目的，可以下载并编译比特币源代码。可以使用 Git 下载比特币源代码：\n\n\
  ```\n$ sudo apt-get install git\n$ mkdir bcsource\n$ cd bcsource\ndrequinox@drequinox-OP7010:~/bcsource\
  \ $ git clone https://github.com/bitcoin/bitcoin.git\nCloning into 'bitcoin'...\n\
  remote: Counting objects: 78960, done.\n```\n\n```\nremote: Compressing objects:\
  \ 100% (3/3), done.\nremote: Total 78960 (delta 0), reused 0 (delta 0), pack-reused\
  \ 78957\nReceiving objects: 100% (78960/78960), 72.53 MiB | 1.85 MiB/s, done.\n\
  Resolving deltas: 100% (57908/57908), done.\nChecking connectivity... done.\ndrequinox@drequinox-OP7010:~/bcsource$\n\
  ```\n\n更改目录到 bitcoin：\n\n```\ndrequinox@drequinox-OP7010:~/bcsource$ cd bitcoin\n\
  ```\n\n完成上述步骤后，可以编译代码：\n\n```\ndrequinox@drequinox-OP7010:~/bcsource/bitcoin$ ./autogen.sh\n\
  drequinox@drequinox-OP7010:~/bcsource/bitcoin$ ./configure.sh\ndrequinox@drequinox-OP7010:~/bcsource/bitcoin$\
  \ make\ndrequinox@drequinox-OP7010:~/bcsource/bitcoin$ sudo make install\n```\n\n\
  ## Setting up bitcoin.conf\n\nbitcoin.conf 文件是比特币核心客户端用来保存配置设置的配置文件。bitcoind 客户端的所有命令行选项，除了\
  \ -conf 开关之外，都可以在配置文件中设置，并且当 bitcoin-qt 或 bitcoind 启动时，它将从该文件获取配置信息。\n\n在 Linux\
  \ 系统中，这通常位于 $HOME/.bitcoin/，也可以使用 -conf=<file> 开关在命令行中指定给 bitcoind 核心客户端软件。\n\n\
  ## Starting up a node in testnet\n\n如果您想测试比特币网络并运行实验，可以将比特币节点启动在 testnet 模式下。与实时网络相比，这是一个更快的网络，并且对挖矿和交易有更宽松的规则。\n\
  \n比特币测试网络有各种水龙头服务可用。一个例子是 Bitcoin TestNet sandbox，用户可以在其中请求将比特币支付到他们的测试网比特币地址。可以通过\
  \ https://testnet.manu.backend.hamburg/ 访问。这对于在测试网上进行交易实验非常有用。\n\n启动测试网的命令行如下：\n\
  \n```\nbitcoind --testnet -daemon\nbitcoin-cli --testnet <command>\nbitcoin-qt --testnet\n\
  ```\n\n## Starting up a node in regtest\n\nregtest 模式（回归测试模式）可用于为测试目的创建本地区块链。\n\n\
  可以使用以下命令启动 reg test 模式下的节点：\n\n```\nbitcoind -regtest -daemon\nBitcoin server starting\n\
  ```\n\n可以使用以下命令生成区块：\n\n```\nbitcoin-cli -regtest generate 200\n```\n\n相关日志消息可以在\
  \ Linux 系统下 .bitcoin/regtest 目录的 debug.log 中查看。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_180_0.png)\n\
  \n生成区块后，余额可以按如下方式查看：\n\n```\ndrequinox@drequinox-OP7010:~/.bitcoin/regtest$ bitcoin-cli\
  \ -regtest\ngetbalance\n8750.00000000\n```\n\n可以使用以下命令停止节点：\n\n```\ndrequinox@drequinox-OP7010:~/.bitcoin$\
  \ bitcoin-cli -regtest stop\nBitcoin server stopping\n```\n\n## Starting up a node\
  \ in live mainnet\n\nBitcoind 是可以作为守护进程运行的核心客户端软件，并提供 JSON RPC 接口。\n\nBitcoin-cli\
  \ 是用于与守护进程交互的功能丰富的命令行工具；守护进程然后与区块链交互并执行各种功能。Bitcoin-cli 仅调用 JSON-RPC 函数本身不对区块链执行任何操作。\n\
  \nBitcoin-qt 是比特币核心客户端 GUI。当钱包软件首次启动时，它会验证磁盘上的区块，然后启动并显示以下 GUI：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_181_0.png)\n\
  \nBitcoin Core QT 客户端，安装后立即显示，区块链未同步\n\n验证过程并非特定于 Bitcoin-qt 客户端；bitcoind 客户端也会执行此操作。\n\
  \n## Experimenting with bitcoin-cli\n\nBitcoin-cli 是随比特币核心客户端提供的命令行界面，可以使用比特币核心客户端提供的\
  \ RPC 接口执行各种功能。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_182_0.png)\n\nbitcoin-cli\
  \ getinfo 的示例运行；可以使用相同格式调用其他命令\n\n可以通过以下命令显示所有命令的列表：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_182_1.png)\n\
  \nTestnet bitcoin-cli，这只是输出的前几行，实际输出包含许多命令\n\n- **HTTP REST**: 从比特币核心客户端 0.10.0\
  \ 开始，HTTP REST 接口也可用。默认情况下，它在与 JSON-RPC 相同的 TCP 端口 8332 上运行。\n\n## Bitcoin programming\
  \ and the command-line interface\n\n比特币编程现在是一个非常丰富的领域。比特币核心客户端公开了各种 JSON RPC 命令，可用于构建原始交易并通过自定义脚本或程序执行其他功能。此外，还有命令行工具\
  \ Bitcoin-cli 可用，它使用 JSON-RPC 接口并提供丰富的工具集来处理比特币。\n\n这些 API 也可通过许多在线服务提供商以比特币 API\
  \ 的形式获得，并提供简单的 HTTP REST 接口。比特币 API，例如 `blockchain.info` 和 bitpay, block.io 以及许多其他，提供多种开发基于比特币解决方案的选项。\n\
  \n有各种比特币编程库可用。以下列出了一个列表，如果您感兴趣可以进一步探索这些库。\n\n**Libbitcoin**: 可在 https://libbitcoin.dyne.org/\
  \ 获取，并提供强大的命令行实用程序和客户端。\n**Pycoin**: 可在 https://github.com/richardkiss/pycoin 获取，是\
  \ Python 的库。\n**Bitcoinj**: 该库可在 https://bitcoinj.github.io/ 获取，并用 Java 实现。\n\n\
  有许多在线比特币 API 可用；最常用的 API 如下所示：\n\n```\nhttps://bitcore.io/\n```\n\n```\nhttps://bitcoinjs.org/\n\
  ```\n\n```\nhttps://blockchain.info/api\n```\n\n所有 API 或多或少提供相同类型的功能，选择哪个 API 最好变得很困难。\n\
  \n## Bitcoin improvement proposals (BIPs)\n\n这些文档用于向比特币社区提出或告知改进建议、设计问题或有关比特币生态系统某些方面的信息。比特币改进提案有三种类型，缩写为\
  \ BIPs：\n\n- **Standard BIP**: 用于描述对比特币系统有重大影响的重大更改，例如区块大小更改、网络协议更改或交易验证更改。\n- **Process\
  \ BIP**: 标准 BIP 和流程 BIP 的主要区别在于标准 BIP 涵盖协议更改，而流程 BIP 通常涉及提出对比特币核心协议之外的流程的更改。这些只有在比特币用户之间达成共识后才会实施。\n\
  - **Informational BIP**: 这些通常只是用于建议或记录有关比特币生态系统的某些信息，例如设计问题。\n\n## Summary\n\n本章介绍了比特币及相关概念。它从比特币的一些历史和基本定义开始。介绍了密钥和地址以及公钥和私钥等概念。还讨论了比特币网络中交易的工作方式（以及相关概念，如脚本、操作码和交易类型）。此外，还介绍了支撑比特币网络的区块链。以及相关概念，如挖矿、工作量证明、挖矿系统和钱包。最后，还提供了有关设置比特币客户端、比特币-cli\
  \ 的使用以及不同比特币网络介绍的一些实用信息。在下一章中，将介绍替代货币及相关概念。\n\n\n\n\n按定义，硬分叉发生时就会产生山寨币。如果比特币发生硬分叉，那么另一条、更旧的链实际上被视为另一种币。然而，并没有明确的规则来确定哪条链会成为山寨币。最近以太坊就发生了这种情况，硬分叉导致除了以太坊（ETH）货币之外，还出现了新的货币\
  \ ETC（以太坊经典）。以太坊经典是旧链，分叉后以太是新链。这种有争议的硬分叉因多种原因是不受欢迎的。首先，它违背了去中心化的真正精神，因为以太坊基金会这一中心化实体决定推进硬分叉，即使并非所有人都同意该提案；其次，它也因对硬分叉的分歧而分裂用户社区。虽然硬分叉在理论上会产生山寨币，但它在能提供的内容上是有限的，因为即使变更导致硬分叉，通常也不会对币的根本参数产生剧烈变化。它们通常保持不变。因此，最好是完全从零开始编写新币，或分叉比特币（或其他币的源代码）来创建具有所需参数和功能的新货币。\n\
  \n山寨币必须能够吸引新用户、交易者和矿工，否则该货币将一文不值。货币的价值，尤其是在虚拟货币领域，由于网络效应及其被社区接受程度而获得。如果一种币未能吸引足够的用户，很快就会被遗忘。可以通过提供初始数量的币来吸引用户，这可以通过各种方法实现。提供初始数量山寨币的方法如下所述：\n\
  \n- **创建新的区块链：** 山寨币可以创建新的区块链并向初始矿工分配币，但这种方法现在不受欢迎，因为存在许多诈骗计划或 *pump and dump* 计划，其中初始矿工在新货币推出时获利然后消失。\n\
  - **Proof of burn：** 分配新山寨币初始资金的另一种方法是 *Proof of burn*，也称为单向挂钩或价格上限。在此方法中，用户永久销毁一定数量的比特币，其比例与可申领的山寨币数量相对应。例如，如果销毁了\
  \ 10 个比特币，则山寨币的价值不会大于被销毁的比特币数量。这基本上意味着比特币通过销毁被 *converted* 成山寨币。\n- **Proof of Ownership：**\
  \ 而不是永久销毁比特币，另一种方法是证明用户拥有一定数量的比特币。这种所有权证明可用于申领山寨币，通过将山寨币区块锚定到比特币区块。例如，这可以通过合并挖矿实现，在这种情况下，比特币矿工在挖比特币的同时可以挖山寨币区块而无需额外工作。\n\
  - **Pegged sidechains**：顾名思义，侧链是与比特币网络分离的区块链，但比特币可以转移到它们上。山寨币也可以转移回比特币网络。这个概念称为双向挂钩。\n\
  \n投资和交易这些替代币也是一项大生意，尽管没有比特币那么大，但足以吸引新投资者和交易者并为市场提供流动性。综合山寨币市值如下图所示，图表来自 http://coinmarketcap.com。\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_187_0.png)\n\n这表明在撰写时，综合山寨币市值超过 20 亿美元\n\
  \n## Alternatives to Proof of Work\n\n**Proof of Work (PoW)** 方案在加密货币的背景下首次在比特币中使用，并作为一种机制来提供保证，即矿工已完成所需的工作量以找到区块。作为回报，这为区块链提供了去中心化、安全性和稳定性。此外，这也是比特币提供去中心化分布式共识的主要手段。PoW\
  \ 方案需要具有一种非常理想的属性，称为 *progress freeness*，这基本上意味着消耗计算资源的奖励应该是随机的并且与矿工的贡献成比例。在这种情况下，即使是计算能力相对较少的矿工也有赢得区块奖励的机会。术语\
  \ *progress freeness* 由 *Arvind Narayanan et.al* 在书籍 *Bitcoin and Cryptocurrency\
  \ Technologies* 中引入。挖矿计算谜题的其他要求包括可调节难度和快速验证。可调节难度确保区块链的挖矿难度目标会根据算力增加和用户数量而进行调节。快速验证是一种属性，意味着挖矿计算谜题应易于且快速验证。PoW\
  \ 方案的另一个方面，尤其是比特币中使用的方法（Double SHA-256），是自 ASIC 引入以来，权力正向能够负担大规模 ASIC 矿场的矿工或矿池转移，这挑战了比特币去中心化核心哲学的核心。\n\
  \n已经提出了一些替代方案，例如抗 ASIC 谜题，其设计方式使得为解决此谜题构建 ASIC 不可行，并且相对于通用硬件不会带来显著性能提升。用于此目的的常见技术是应用一类称为\
  \ *memory hard* 的计算难题。这一方法的核心思想是，由于谜题求解需要大量内存，因此在基于 ASIC 的系统上实现是不切实际的。这种技术最初在莱特币和\
  \ Tenebrix 中使用，其中 Scrypt 哈希函数被用作抗 ASIC 的 PoW 方案。尽管该方案最初被宣传为抗 ASIC，但最近 Scrypt ASIC\
  \ 现在已可用，推翻了莱特币的原始声明。\n\n另一种抗 ASIC 的方法是需要计算多个哈希函数以提供 PoW。这也称为链式哈希方案。其背后的理由是，在 ASIC\
  \ 上设计多个哈希函数是不可行的。最常见的例子是 Dash 中实现的 X11 内存困难函数。X11 由 11 个 SHA3 竞赛算法组成，其中一个算法将计算出的哈希输出到下一个算法，直到所有\
  \ 11 个算法按顺序使用。这些算法包括 blake、bmw、groestl、jh、keccak、skein、luffa、cubehash、shavite、simd\
  \ 和 echo。\n\n这种方法最初确实提供了对 ASIC 开发的抵抗，但现在 ASIC 矿机已可商业获得并支持 X11 及类似方案的挖矿。最近的例子是 ASIC\
  \ Baikal Miner，它支持 X11、X13、X14 和 X15 挖矿。其他例子包括 iBeLink DM384M X11 矿机和 Pinidea X11\
  \ ASIC 矿机。\n\n也许另一种方法可以是设计 *self-mutating puzzles*，这些谜题会智能或随机地随时间改变 PoW 方案或其要求。这将使其几乎不可能在\
  \ ASIC 中实现，因为它需要为每个函数设计多个 ASIC，而且随机变化的方案在 ASIC 中几乎不可能处理。目前尚不清楚这在实践中如何实现。\n\nPoW\
  \ 有各种缺点，其中最大的就是能源消耗。据估计，到 2020 年，比特币矿工消耗的总电量将相当于丹麦的用电量。这非常巨大，而且所有这些电力在某种程度上都被浪费了；事实上，除了挖矿之外，没有任何有用的目的。环保主义者对这种情况提出了真正的担忧。\n\
  \n有人提出 PoW 谜题可以设计成服务于两个目的。首先，其主要目的是共识机制，其次是执行一些有用的科学计算。这样，这些方案不仅可用于挖矿，还可以帮助潜在地解决其他科学问题。这种有用的工作证明最近已由\
  \ Primecoin 付诸实践，其中要求是找到特殊的素数链，称为 Cunningham 链和 bi-twin 链。由于素数分布的研究在物理等科学学科中具有特殊意义，通过挖矿\
  \ Primecoin，矿工不仅获得区块奖励，还有助于找到特殊的素数。\n\n### Proof of Storage\n\n也称为不可检索证明，这是一种另一种有用的工作证明类型，需要存储大量数据。由微软研究院引入，该方案提供了分布式存档数据存储的有用好处。矿工需要存储大量数据中伪随机选择的子集以进行挖矿。\n\
  \n\n\n\n\n## Proof of Stake\n\n这种证明也被称为虚拟挖矿。这是一种另一种类型的挖矿难题，被提出作为传统 PoW 方案的替代方案。它首次在\
  \ PeerCoin 中于 2012 年 8 月提出。在该方案中，其理念是用户需要证明自己拥有一定数量的货币（币），从而证明他们对该币拥有权益。权益的最简单形式是让那些\
  \ demonstrably 拥有更多数字资产的用户挖矿相对更容易。该方案的好处是双重的；首先，与购买高端 ASIC 设备相比，获取大量数字资产相对困难，其次它可以节省计算资源。已经提出了各种形式的权益，并在下面简要讨论。\n\
  \n## Proof of coinage\n\n币的年龄是指币自上次使用或持有以来的时间。这与通常的权益证明形式不同，在通常形式中，拥有 altcoin 最高权益的用户挖矿更容易。在基于币龄的方法中，币的年龄（coinage）在每次挖出区块时重置。矿工因在一段时间内持有而非花费币而获得奖励。该机制已在\
  \ Peercoin 中以创造性的方式与 PoW 结合实现。挖矿难题（PoW）的难度与币龄成反比，这意味着如果矿工使用币权益交易消耗部分币龄，则 PoW 要求会得到缓解。\n\
  \n## Proof of deposit\n\n该方案的核心思想是矿工新铸造的区块在一段时间内不可花费。更准确地说，币在挖矿操作期间会被锁定一定数量的区块。该方案通过允许矿工以冻结一定数量的币一段时间为代价进行挖矿来运作。这是一种权益证明类型。\n\
  \n## Proof of burn\n\n作为计算能力的替代支出，证明销毁实际上销毁一定数量的比特币以获得等值的山寨币。这通常在启动新币项目时使用，作为提供公平初始分配的一种手段。这可以被视为一种替代挖矿方案，其中新币的价值来自于之前销毁了一定数量的币这一事实。\n\
  \n## Proof of activity\n\n该方案是 PoW 和权益证明的混合体。在该方案中，区块最初是通过使用 PoW 产生的，但随后每个区块随机指定三个权益持有者，要求他们对其进行数字签名。后续区块的有效性取决于先前随机选择的区块是否成功签名。\n\
  \n然而，存在一个已知问题，即无利害关系问题，在该问题下创建区块链分叉将变得微不足道。这是因为在 PoW 中需要适当的计算资源进行挖矿，而在权益证明中没有此类要求；因此，攻击者可以使用同一枚币在多个链上尝试挖矿。\n\
  \n## Non-outsourceable puzzles\n\n该难题背后的关键动机是开发出抵御矿池发展的能力。如前所述，矿池根据参与者消耗的计算能力按比例向所有参与者提供奖励。然而，在该模型中，矿池运营商是中央权威，所有奖励都归其所有，并且可以强制执行某些规则。此外，在该模型中，所有矿工之所以相互信任，是因为他们为了共同目标而共同努力，希望矿池经理获得奖励。不可外包难题是一种允许矿工为自己申领奖励的方案；因此，由于匿名矿工之间固有的不信任，矿池的形成变得不太可能。\n\
  \n## Difficulty adjustment and retargeting algorithms\n\n随着比特币和山寨币的出现，另一个引入的概念是难度重定目标算法。在比特币中，难度目标是通过以下等式简单计算的；然而，其他币要么开发了自己的算法，要么实现了比特币难度算法的修改版本：\n\
  \n*T = Time previous * time actual / 2016 * 10 min*\n\n比特币中难度调节的理念是，2016 个区块的生成应大约需要\
  \ 2 周（区块间隔时间应约为 10 分钟）。如果挖出 2016 个区块花费的时间超过 2 周，则难度会降低；如果花费的时间少于两周，则难度会增加。当 ASIC\
  \ 被引入时，由于区块生成率很高，难度呈指数级增长，这就是 PoW 算法未具备抗 ASIC 能力的一个缺点。这导致了挖矿能力的集中化。这也带来另一个问题；如果现在启动一个新币，使用与比特币相同的基于\
  \ SHA256 的工作量证明，那么恶意用户只需简单使用 ASIC 矿机即可控制整个网络。如果对新山寨币的兴趣较少，而有人决定通过消耗足够高的计算资源来接管网络，则该攻击将更具可行性。如果其他拥有类似计算能力的矿工也加入山寨币网络，则该攻击可能不可行，因为矿工将相互竞争。此外，多矿池构成了更大的威胁，其中一组矿工可以自动切换到正在盈利的货币。这种现象被称为\
  \ **pool hopping**，会不利地影响区块链，进而影响山寨币的增长。矿池跳跃会不利地影响网络，因为矿池跳跃者仅在难度较低且可以快速获得奖励时加入网络；一旦难度上升（或被重新调整），他们就会\
  \ *hop off*，然后在难度再次调整回落后再次回来。例如，如果一个多矿池消耗其资源快速挖矿新币，难度会迅速增加；当多矿池离开货币网络时；它变得几乎无法使用，因为现在难度已增加到\
  \ solo 矿工不再盈利且无法维持的水平。解决此问题的唯一办法是发起硬分叉，这通常对社区是不受欢迎的。\n\n有一些算法已经出现以解决此问题，并在后面讨论。所有这些算法都基于根据算力变化重新调整各种参数的理念；这些参数包括先前区块的数量、先前区块的难度、调整比率，以及难度可以向上或向下重新调整的倍数。在以下部分，读者将被介绍到在各种山寨币中使用的和提出的几种难度算法。\n\
  \n## Kimoto Gravity Well\n\n该算法用于在各种山寨币中调节难度。这最初是在 Megacoin 中引入，用于自适应地每区块调整网络难度。该算法的逻辑如下所示：\n\
  \n```\nKGW = 1 + (0.7084 * pow((double(PastBlocksMass)/double(144)), -1.228))\n\
  ```\n\n## MIDAS\n\n**Multi Interval Difficulty Adjustment System (MIDAS)** 是一种算法，其复杂程度相对高于之前讨论的算法。该方法对算力变化的突然变化做出更快速的响应。该算法还可防止时间扭曲攻击。\n\
  \n许多货币的出现是为了解决比特币中的各种限制而做出的尝试。以下是比特币限制的简要讨论。\n\n## Bitcoin limitations\n\n比特币中的各种限制也激发了人们对山寨币的兴趣，山寨币专门开发用于解决比特币中的限制。最突出且被广泛讨论的限制是比特币缺乏匿名性。该限制将在下面详细讨论。\n\
  \n## Privacy and anonymity\n\n由于区块链是所有交易公开的账本且公开可用，因此分析它变得微不足道。结合流量分析，交易可以追溯到其源\
  \ IP 地址，从而可能揭示交易的发起者。这是一个很大的隐私问题。即使在比特币中，生成每个交易的新地址是推荐且常见的实践，从而允许一定程度的不可关联性，这也不够，并且已经开发并成功使用了各种技术来追踪交易在网络中的流动并将其追溯到其发起者。研究人员已使用诸如交易图、地址图和实体图等各种分析区块链的方法来将用户与交易关联起来，从而引发隐私问题。上述分析技术可以通过使用关于交易和将其链接到实际用户的公开可用信息而得到进一步丰富。有开源区块解析器可用于从区块链数据库中提取交易信息、余额和脚本。解析器可在\
  \ https://github.com/mikispag/rusty-blockparser 获取，用 Rust 编写，提供高级区块链分析功能。该工作的早期版本称为\
  \ BitIodine，但已不再积极开发。\n\n已经提出了各种提案来解决比特币中的隐私问题。这些提案分为三类：混合协议、第三方混合网络和固有匿名性。以下是每个类别的简要讨论。\n\
  \n\n\n\n\n## 混合协议\n\n这些方案用于为比特币交易提供匿名性。在此模型中，使用了混合服务提供商（中介或共享钱包）。用户将硬币发送到此共享钱包作为存款，共享钱包随后可以将其他用户的存款（价值相同）的其他硬币发送到目的地。用户也可以通过此中介接收他人发送的硬币。这样，输出与输入之间的链接就不再存在，交易图分析将无法揭示发送者和接收者之间的真实关系。\n\
  \nCoinJoin 是混合协议的一个例子，其中两个交易合并形成单个交易，同时保持输入和输出不变。CoinJoin 背后的核心思想是构建一个由所有参与者共同签署的共享交易。此技术提高了参与交易的所有参与者的隐私性：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_196_0.png)\n\nCoinjoin 交易，三位用户将其交易合并为单个更大的\
  \ CoinJoin 交易\n\n## 第三方混合协议\n\n有各种第三方混合服务可用，但如果服务是中心化的，则会带来追踪发送者和接收者之间映射的威胁，因为混合服务知道所有输入和输出。除此之外，完全中心化的矿工甚至会带来服务管理员窃取硬币的风险。\n\
  \n有各种服务，其复杂程度各不相同，例如 CoinShuffle、Coinmux 以及 Dash（币）中的 dark send，它们都基于 CoinJoin（混合）交易的理念。CoinShuffle\
  \ 是传统混合服务的去中心化替代方案，因为它不需要可信的第三方。\n\n然而，基于 CoinJoin 的方案存在一些弱点，最突出的是用户可能发起拒绝服务攻击，这些用户最初承诺签署交易，但现在不提供其签名，从而延迟或完全停止联合交易。\n\
  \n## 内置匿名性\n\n此类别包括支持隐私的硬币，并且内置于货币的设计中。最流行的是 Zcash，后续章节将详细介绍。其他例子包括 Monero，它使用环签名来提供匿名服务。\n\
  \n下一节介绍已实施或提议的各种增强功能，以扩展比特币协议。\n\n## 基于比特币的扩展协议\n\n为了增强和扩展比特币协议并将其用于除虚拟货币之外的各种其他用途，已经提出了并在比特币之上实现了多个协议。\n\
  \n## 有色币\n\n有色币是一组用于在比特币区块链上表示数字资产的方法。给比特币“上色”在口语中指的是用代表数字资产的某些元数据对其进行更新。该币仍然可以作为比特币工作和运行，但额外携带代表某些资产的元数据。此机制允许发行和跟踪特定比特币。元数据可以使用比特币的\
  \ `OP_RETURN` 操作码记录，或可选地记录在多重签名地址中。此元数据也可以根据需要进行加密以解决任何隐私问题。有色币可用于表示多种资产，包括但不限于商品、证书、股份、债券和投票。还应注意的是，为了使用有色币，需要一个能够解释有色币的钱包，而普通的比特币钱包将无法工作。有色币钱包可以使用\
  \ https://www.coinprism.com/ 提供的服务在线设置。使用此服务，可以通过有色币创建和发行任何类型的数字资产。\n\n从技术上讲，这基本上是一个以太坊合约，能够像比特币简易支付验证轻客户端使用布隆过滤器那样存储和验证比特币区块头。SPV\
  \ 客户端已在上一章中详细讨论过。该想法可以用以下图表可视化：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_199_0.png)\n\
  \nCounterparty 可在 `http://counterparty.io/` 获取。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_199_1.png)\n\
  \n## 山寨币的开发\n\n从编码角度来看，山寨币项目可以通过简单地分叉比特币或其他币的源代码而非常容易地启动，但这可能还不够。当启动一个新币项目时，需要考虑几件事以确保成功启动和币的持久性。通常，代码库是用\
  \ C++ 编写的，就像比特币一样，但几乎任何语言都可用于开发币项目，例如 Golang 或 Rust。\n\n编写代码或分叉现有币的代码是微不足道的部分，挑战性的问题是如何启动一种新货币，以便吸引新投资者和用户。一般来说，启动一个新币项目会采取以下步骤。\n\
  \n从技术角度来看，在分叉另一币的代码的情况下，例如比特币，有各种参数可以更改以有效地创建新币。这些参数需要被 *调整* 或引入以创建新币。这些参数可以包括但不限于以下内容。\n\
  \n## 共识算法\n\n有共识算法可供选择：比特币使用的 **Proof of Work (PoW)** 或 Peercoin 中使用的 **Proof of\
  \ Stake (PoS)**。\n\n替代币\n\n### 哈希算法\n\n这可以是 SHA256、Scrypt、X11、X13、X15 或任何其他适合用作共识算法的哈希算法。\n\
  \n### 难度调整算法\n\n此类中有各种选项可提供难度重定目标机制。最突出的例子是 KGW、DGW、Nite’s Gravity Wave 和 DigiShield。而且所有这些算法都可以根据需求进行调整以产生不同的结果；因此可能存在许多变体。\n\
  \n### 区块间隔\n\n这是每个区块生成之间经过的时间。对于比特币，区块每 10 分钟生成一次，对于莱特币则是 2.5 分钟。可以使用任何值，但通常适当的值在几分钟之间；如果生成时间太快，可能会破坏区块链的稳定性，如果太慢，可能不会吸引许多用户。\n\
  \n### 区块奖励\n\n区块奖励是为解决挖矿难题的矿工提供的，允许其拥有包含奖励的 Coinbase 交易。这在比特币最初时为 50 个币，现在许多山寨币将此参数设置为非常高的数字；例如在\
  \ Dogecoin 中目前为 10,000。\n\n### 奖励减半率\n\n这是另一个重要因素；在比特币中每 4 年减半一次，现在设为 12.5 个比特币。这是一个可变数字，可以根据需求设置为任何时间段或根本不设置。\n\
  \n### 区块大小和交易大小\n\n这是另一个重要因素，决定网络上的交易速率可以有多高或多低。比特币中的区块大小限制为 1 MB，但在山寨币中可以根据需求而变化。\n\
  \n[ 175 ]\n\n### 利率\n\n此属性仅适用于 PoS 系统，其中币的所有者可以按网络定义的利率赚取利息，以换取在网络上作为 PoS 持有以保护网络的币数量。\n\
  \n### 币龄\n\n此参数定义币必须保持未花费多长时间才能成为有资格被视为可质押的。\n\n### 币的总供应量\n\n此数字设定可以永远生成的币的总限制。例如，比特币的限制为\
  \ 2100 万，而 Dogecoin 则不受限制。此限制由上述讨论的区块奖励和减半计划确定。\n\n创建自己的虚拟货币有两个选项：分叉现有成熟加密货币源代码或从头开始编写新代码。后者不太流行，但前者更容易，并且在过去几年中允许创建许多虚拟货币。从根本上说，想法是首先分叉加密货币源代码，然后在源代码的不同战略位置进行适当的更改，从而有效地创建一种新货币。\n\
  \n在下一节中，读者将介绍一些山寨币项目。本章不可能涵盖所有替代货币，但下面讨论了几个精选币。选择基于寿命、市值和创新。每个币都从理论基础、交易和挖矿等不同角度进行讨论。\n\
  \n## Namecoin\n\nNamecoin 是比特币源代码的第一个分叉。Namecoin 背后的关键思想不是生产一种山寨币，而是提供改进的去中心化、抗审查、隐私、安全和更快的去中心化命名。去中心化命名服务旨在应对传统互联网上使用的传统域名系统（DNS）协议固有的局限性，例如缓慢和中心化控制。Namecoin\
  \ 也是 Zooko 三角形的第一个解决方案，该三角形已在前几章中简要讨论过。\n\n\n\n\n\n## 替代币\n\nNamecoin 本质上用于提供注册键/值对的服务。Namecoin\
  \ 的一个主要用例是提供去中心化的传输层安全（TLS）证书验证机制，该机制由基于区块链的分布式去中心化共识驱动。\n\n它基于与比特币相同的技术，但拥有自己的区块链和钱包软件。Namecoin\
  \ 核心的源代码可在 https://github.com/namecoin/namecoin-core 获取。\n\n总而言之，Namecoin 提供以下三种服务：\n\
  \n- 安全存储和传输名称（键）\n- 通过附加最多 520 字节的数据，为名称附加一些值\n- 产出一种数字货币（Namecoin）\n\nNamecoin\
  \ 还首次引入了合并挖矿，允许矿工同时在多条链上挖矿。其思路简单但非常有效：矿工创建一个 Namecoin 区块，并生成该区块的哈希。然后该哈希被添加到比特币区块中，矿工以等于或大于\
  \ Namecoin 区块难度的难度求解该区块，以证明已为求解 Namecoin 区块贡献了足够的工作量。\n\n更准确地说，Coinbase 交易用于包含来自\
  \ Namecoin（或任何其他替代币）交易的哈希。挖矿任务是求解比特币区块，这些区块的 Coinbase scriptSig 包含指向 Namecoin（或任何其他替代币）区块的哈希指针。如下图所示。如果矿工成功在比特币区块链难度级别下求解出一个哈希，那么比特币区块就会被构建并成为比特币网络的一部分。在这种情况下，Namecoin\
  \ 哈希会被比特币区块链忽略。另一方面，如果矿工在 Namecoin 区块链难度级别下求解出一个区块，那么 Namecoin 区块链中就会创建一个新区块。该方案的核心优势在于，矿工花费的所有算力都有助于保障\
  \ Namecoin 和比特币两者的安全：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_202_0.png)\n\n\
  ### 交易 Namecoin\n\n根据 `https://coinmarketcap.com/` 的数据，Namecoin 当前的市值为 2,736,537\
  \ 英镑，并且可以在 `https://cryptonit.net/` 等各个交易所买卖。通过简单的在线搜索即可找到其他各种交易所。\n\n### 获取 Namecoin\n\
  \n尽管 Namecoin 可以独立挖矿，但通常通过上述合并挖矿技术作为比特币挖矿的一部分来挖掘。这样，Namecoin 可以作为比特币挖矿的副产品被挖出。从下面的难度图可以明显看出，单独挖矿不再有利可图；因此建议采用合并挖矿、使用矿池，甚至使用加密货币交易所购买\
  \ Namecoin。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_203_0.png)\n\nNamecoin 难度见：https://bitinfocharts.com/comparison/difficulty-nmc.html\n\
  \n各种矿池（例如 `https://slushpool.com`）也提供合并挖矿选项。这允许矿工主要挖比特币，但也能因此获得 Namecoin。\n\n另一种可以快速获取\
  \ Namecoin 的方法是将你现有的币兑换为 Namecoin，例如，如果你已经拥有一些比特币或其他可以用于兑换 Namecoin 的加密货币。在线服务 `https://shapeshift.io/`\
  \ 可提供此服务。该服务通过简单易用的界面允许从一种加密货币兑换为另一种加密货币。\n\n例如，支付 BTC 以接收 NMC 的过程如下所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_204_0.png)\n\
  \n一旦点击 **开始交易**，交易即开始，并指示用户将比特币发送到特定的比特币地址。当用户发送所需金额后，兑换过程开始，如下所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_204_1.png)\n\
  \n当过程完成时，可以在 Namecoin 钱包中查看交易：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_205_0.png)\n\
  \n确认交易可能需要一些时间；在此之前，无法使用 Namecoin 来管理名称。一旦钱包中有了 Namecoin，就可以使用 **管理名称** 选项来生成 Namecoin\
  \ 记录。\n\n### 生成 Namecoin 记录\n\nNamecoin 记录采用键/值对的形式。名称是小写的字符串，形式为 `d/example.name`，而值是区分大小写、UTF-8\
  \ 编码的 JSON 对象，最大为 520 字节。名称应符合 RFC1035（`https://tools.ietf.org/html/rfc1035`）。一般的\
  \ Namecoin 名称可以是长度不超过 255 字节的任意二进制字符串，并带有 1024 比特的相关标识信息。Namecoin 链上的记录仅在约 200 天或\
  \ 36,000 个区块内有效，之后需要续期。Namecoin 还引入了 .bit 顶级域名，可以使用 Namecoin 注册，并可借助专门支持 Namecoin\
  \ 的解析器进行浏览。如下截图所示，Namecoin 钱包软件可用于注册 `.bit` 域名。\n\n输入名称后，按下提交按钮，它会要求提供 DNS、IP 或身份等配置信息：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_206_0.png)\n\n如下截图所示，masteringblockchain\
  \ 将在 Namecoin 区块链上注册为 masteringblockchain.bit：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_206_1.png)\n\
  \n### Litecoin\n\nLitecoin（莱特币）是 2011 年发布的比特币源代码的一个分叉。它使用 Scrypt 作为工作量证明（PoW），该算法最初在\
  \ Tenebrix 币中引入。与比特币相比，Litecoin 允许更快的交易，因为它的出块时间更短，为 2.5 分钟。同样，由于更快的出块时间，大约每 3.5\
  \ 天实现一次难度调整。总币供应量为 8400 万。\n\nScrypt 是一种顺序内存困难函数，是首个替代基于 SHA-256 的工作量证明（PoW）算法的方案。它最初被提议作为一种基于密码的密钥派生函数（PBKDF）。其关键思想是：如果函数需要大量内存来运行，那么\
  \ ASIC 等定制硬件将需要更大的 VLSI 面积，这将是不可行的。Scrypt 算法需要在内存中保存一大组伪随机比特，并从中以伪随机方式派生出一个密钥。该算法基于一种称为\
  \ **时间-内存权衡（TMTO）** 的现象。如果放宽内存要求，则会导致计算成本增加。换句话说，如果为程序分配更多内存，TMTO 会缩短其运行时间。这种权衡使得攻击者难以获取更多内存，因为在定制硬件上实现既昂贵又困难；或者，如果攻击者选择不增加内存，那么由于处理要求高，算法运行速度会变慢。\n\
  \nScrypt 使用以下参数生成派生密钥（Kd）：\n\n- 口令：这是要哈希的字符串\n- 盐值：这是提供给 Scrypt 函数（通常所有哈希函数）的随机字符串，用于抵御使用彩虹表的暴力字典攻击\n\
  - N：这是一个内存/CPU 成本参数，必须是大于 1 的 2 的幂\n- P：并行化参数\n- R：块大小参数\n- dkLen：派生密钥的预期长度（以字节为单位）\n\
  \n形式上，这个函数可以写成：\n\n```\nKd = scrypt(P, S, N, P, R, dkLen)\n```\n\n在应用核心的 Scrypt\
  \ 函数之前，算法将 P 和 S 作为输入，并应用 PBKDF2 和基于 SHA-256 的 HMAC。然后将输出馈送到一个名为 ROMix 的算法，该算法内部使用\
  \ BlockMix 算法，利用 Salsa20/8 核心流密码来填充内存，这需要大量内存才能运行，从而强制实现顺序内存困难特性。\n\n该算法此步骤的输出最终再次馈送到\
  \ PBKDF2 函数，以生成派生密钥。这个过程如下图所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_208_0.png)\n\
  \nScrypt 在 Litecoin 挖矿中使用特定参数，其中 N = 1024，R = 1，P = 1，S = 随机 80 字节，产生 256 比特输出。\n\
  \n似乎由于这些参数的选择，用于 Litecoin 挖矿的 Scrypt ASIC 的开发变得并不是很困难。在用于 Litecoin 挖矿的 ASIC 中，可以开发一种顺序逻辑，将数据和一个\
  \ nonce 作为输入，应用带有 HMAC-SHA256 的 PBKDF2 算法；然后将生成的比特流馈送到 Salsa20/8 函数，该函数产生一个哈希，该哈希再次馈送到\
  \ PBKDF2 和 HMAC-SHA256 函数，以产生 256 比特的哈希输出。与比特币 PoW 的情况一样，在 Scrypt 中，如果输出哈希小于目标哈希（在开始时已作为输入传递，存储在内存中，并在每次迭代时检查），则函数终止；否则，nonce\
  \ 递增，并重复该过程，直到找到低于难度目标的哈希。\n\n\n\n\n\n![](img/62ab880d2302f959d34db648cb0bec5e_209_0.png)\n\
  \n- **交易莱特币：** 与其他币种一样，莱特币的交易可轻松在各种在线交易所进行。莱特币目前的市值约为 £161,239,005。莱特币当前价格为 £3.25/LTC。\n\
  - **挖矿：** 莱特币挖矿可以单独进行或加入矿池。目前，可用于挖矿莱特币的 Scrypt ASIC 已上市。\n\n在 CPU 上挖莱特币已不再盈利，就像许多其他数字货币一样。市面上有在线云挖矿服务提供商和\
  \ ASIC 矿机可用于挖矿莱特币。莱特币挖矿始于 CPU，随后发展到 GPU 挖矿机，最终发展到现在需要使用专门的 ASIC 矿机，例如可从 EhsMiner\
  \ 购买的 Asic Scrypt Miner Wolf，才有可能挖到一些币。一般来说，即使使用 ASIC，加入矿池挖矿也比单独挖矿更划算，因为矿池采用按比例奖励机制，单独挖矿的盈利性不如矿池。这些矿机能够为\
  \ Scrypt 算法提供 2 Gh/s 的哈希率。\n\n## 替代币种\n\n- **软件源代码和钱包：** 莱特币的源代码可在 https://github.com/litecoin-project/litecoin\
  \ 获取。莱特币钱包可从 https://litecoin.org/ 下载使用，其使用方式与比特币核心客户端软件类似。\n\n## Primecoin\n\n\
  Primecoin 是市场上首个引入有用 PoW 的数字货币，而非比特币基于 SHA256 的 PoW。Primecoin 使用寻找质数作为 PoW。并非所有类型的质数都符合作为\
  \ PoW 被选中的要求。三种类型的质数（即第一类 Cunningham 链、第二类 Cunningham 链和双胞胎链）符合可用于加密货币的 PoW 算法的要求。Primecoin\
  \ 区块链中难度会通过持续难度评估方案动态调整。基于质数的 PoW 的高效验证也非常重要，因为如果验证缓慢，则 PoW 不适用。因此选择质数链作为 PoW，因为随着链长度增加寻找质数链变得困难，而验证仍足够快速以保证作为高效\
  \ PoW 算法使用。同样重要的是，一旦 PoW 在一个区块上得到验证，就不能在另一个区块上重复使用。在 Primecoin 中，这通过 *Proof of Work\
  \ certificates* 与子区块中父区块头部的哈希结合来实现。PoW 证书是通过将质数链链接到区块头哈希产生的。它还要求区块头的来源可被区块头哈希整除。如果可以，则进行除法，商用作\
  \ PoW 证书。可调整难度 PoW 算法的另一个特性是通过每区块调整难度来实现，而非像比特币那样每 2,016 个区块调整一次。这是一种 *smoother*\
  \ 的方法，与比特币相比更平滑，并在算力突然增加时允许重新调整。此外，产生的币总数由社区驱动，Primecoin 可产生的币数没有具体限制。\n\n## 交易\
  \ Primecoin\n\nPrimecoin 可在主要虚拟货币交易交易所进行交易。截至撰写时，Primecoin 目前的市值约为 £828,002。市值不大，但由于\
  \ Primecoin 基于新颖的理念并且背后有忠实的社区支持，因此仍保持一定的市场份额。\n\n![](img/62ab880d2302f959d34db648cb0bec5e_211_0.png)\n\
  \n## 挖矿指南\n\n第一步是下载钱包。Primecoin 在钱包内支持原生挖矿，就像原始比特币客户端一样，但也可以通过各种在线挖矿服务提供商在云端进行挖矿。\n\
  \n以下是简要的 Windows 指南：\n\n1. 第一步是从以下地址下载 Primecoin 钱包：\n   <http://primecoin.io/index.php.>\n\
  \n2. 钱包安装并与网络同步后，可按照下一步开始挖矿。可通过点击 **Help** 菜单并选择 **Debug** 窗口菜单项在 Primecoin 钱包中打开调试窗口。还可通过在控制台窗口中输入\
  \ `help` 调出额外帮助：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_212_0.png)\n\n3. 前述命令成功执行后，挖矿将以单人模式启动。这可能盈利性不高，但矿工可使用在线可用的矿池：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_213_0.png)\n\nPrimecoin 钱包软件，与网络同步\n\n\
  Primecoin 源代码可在 https://github.com/primecoin/primecoin 获取。尽管这是一个新颖的概念，且 Primecoin\
  \ 引入的 PoW 具有科学意义，但似乎没有活跃的开发在进一步发展 Primecoin。读者可通过阅读 Sunny King（笔名）撰写的 Primecoin\
  \ 白皮书进一步探索 Primecoin，地址为：http://primecoin.io/bin/primecoin-paper.pdf。\n\n## Zcash\n\
  \nZcash 于 2016 年 10 月 28 日推出。这是首个使用特定类型的零知识证明，即 **零知识简洁非交互式知识论证 (zk-SNARKs)** 来为用户提供完全隐私的货币。这些证明非常简短且易于验证；然而，设置初始公共参数是一个复杂的过程。后者包括两个密钥：证明密钥和验证密钥。该过程需要采样一些随机数来构建公共参数。问题在于，这些随机数也称为\
  \ *toxic waste*，必须在参数生成后销毁，以防止 Zcash 被伪造。为此，Zcash 团队提出了一种多方计算协议，以协作方式从独立位置生成所需的公共参数，以确保不会产生\
  \ *toxic waste*。由于这些公共参数需要由 Zcash 团队创建，这意味着仪式参与者是可信的。这就是仪式非常开放并使用多方计算机制进行的原因。该机制具有这样一个特性：只有在所有仪式参与者都被攻破的情况下，最终参数才会被攻破。仪式完成后，所有参与者会物理销毁用于私钥生成的设备。此操作消除了设备上参与者私钥部分的任何痕迹。\n\
  \nzk-SNARKs 必须满足完备性、可靠性、简洁性和非交互性等属性。*Completeness* 意味着证明者有一个明确的策略来说服验证者断言为真。另一方面，*soundness*\
  \ 意味着没有任何证明者能说服验证者虚假陈述为真。*Succinctness* 意味着证明者和验证者之间传递的消息在大小上非常小。最后，非交互性属性意味着断言的正确性验证可以在没有交互或很少交互的情况下进行。此外，作为零知识证明，还需要满足\
  \ *zero-knowledge* 属性（见第 3 章，《密码学与技术基础》）。\n\nZcash 开发者引入了 **去中心化匿名支付方案 (DAP scheme)**\
  \ 的概念，该方案在 Zcash 网络中使用以实现直接且私密的支付。交易不会透露支付的来源、目的地和金额等信息。Zcash 中有两种地址类型，z-addr 和\
  \ t-addr。Z 地址基于零知识证明并提供隐私保护，而 T 地址与比特币类似。\n\n\n\n\n\nZcash 使用一种名为 **Asymmetric PoW\
  \ (Equihash)** 的高效 PoW 方案，它基于广义生日问题。它允许非常高效的验证。它是一种内存硬且抗 ASIC 的函数。Zcash 中引入了一个新颖的想法（初始慢速挖矿），这意味着区块奖励会在一段时间内逐渐增加，直到达到第\
  \ 20,000 个区块。这允许网络的初始扩展以及早期矿工的实验，并且如果需要，Zcash 开发者可以进行调整。慢启动由于稀缺性对价格产生了影响，ZEC 在首次发布当天的价格达到约\
  \ 25,000 美元。Zcash 中已实现了一个略微修改版本的 Digishield 难度调整算法。公式如下所示：\n\n```\n(next difficulty)\
  \ = (last difficulty) x SQRT [ (150 seconds) / (last solve time) ]\n```\n\nZcash\
  \ 的各种属性快照（初始慢启动后）如下所示：\n\n| Attribute | Value |\n|---|---|\n| Name | Zcash |\n|\
  \ Launch date | 28/10/16 |\n| Main purpose | Currency |\n| Currency Code | ZEC |\n\
  | Maximum coins | 21 million |\n| Block time | 10 minutes |\n| Consensus facilitation\
  \ algorithm | Proof of Work (equihash) |\n| Difficulty adjustment algorithm | DigiShield\
  \ V3 (modified) |\n| Mining hardware | CPU, GPU |\n| Difficulty adjustment period\
  \ | 1 block |\n\n2. 接下来，运行命令克隆 Zcash，如以下屏幕截图所示：\n\n```\n$ git clone https://github.com/zcash/zcash.git\n\
  ```\n\n此命令将 Zcash git 仓库克隆到本地。输出显示在以下屏幕截图中：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_217_0.png)\n\
  \n3. 下一步是通过以下屏幕截图中的命令下载证明和验证密钥：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_218_0.png)\n\
  \n4. 一旦此命令运行，它将下载大约 911 MB 的密钥到 ~/.zcash-params/ 目录。目录包含证明和验证密钥的文件：\n\n```\ndrequinox@drequinox-OP7010:~/.zcash-params$\
  \ pwd\n/home/drequinox/.zcash-params\ndrequinox@drequinox-OP7010:~/.zcash-params$\
  \ ls -ltr\n-rw-rw-r-- 1 drequinox drequinox      1449 Oct 24 16:46 sprout-verifying.key\n\
  -rw-rw-r-- 1 drequinox drequinox 910173851 Oct 24 16:46 sprout-proving.key\n```\n\
  \n5. 一旦前面的命令成功完成，源代码可以使用以下命令构建：\n\n```\n./zcash/build.sh -j$(nproc)\n```\n\n这将产生非常长的输出；如果一切顺利，它将生成一个\
  \ zcashd 二进制文件。请注意，此命令以 nproc 作为参数，这基本上是一个查找系统中的核心或处理器数量并显示该数字的命令。如果您没有该命令，则将 nproc\
  \ 替换为系统中的处理器数量。\n\n构建完成后，下一步是配置 Zcash。这是通过在 ~/.zcash/ 目录中创建名为 zcash.conf 的配置文件实现的。\n\
  \n示例配置文件如下所示：\n\n```\naddnode=mainnet.z.cash\nrpcuser=drequinox\nrpcpassword=xxxxxxoJNo4o5c+F6E+J4P2C1D5iz1zIKPZJhTzdW5A=\n\
  gen=1\ngenproclimit=8\nequihashsolver=tromp\n```\n\n前面的配置启用了各种功能。第一行添加主网节点并启用主网连接。rpcuser\
  \ 和 rpcpassword 是 RPC 接口的用户名和密码。gen = 1 用于启用挖矿。genproclimit 是可用于挖矿的处理器数量。最后一行启用更快的挖矿求解器；如果您想使用标准\
  \ CPU 挖矿，则不需要此项。\n\n现在可以使用以下命令启动 Zcash：\n\n```\n./zcashd --daemon\n```\n\n启动后，这将允许通过\
  \ Zcash-cli 命令行界面与 RPC 接口进行交互。这几乎与比特币命令行界面相同。一旦 Zcash 守护进程运行起来，可以运行各种命令来查询 Zcash\
  \ 的不同属性。交易可以通过 CLI 或通过区块链浏览器在本地查看。Zcash 的区块链浏览器可在以下位置获得：https://explorer.zcha.in/。\n\
  \n## Address generation\n\n可以使用以下命令生成新的 Z 地址：\n\n```\n$:~/zcash/src$ ./zcash-cli\
  \ z_getnewaddress\nzcPDBKuuwHJ4gqT5Q59zAMXDHhFoi hyTC1aLE5Kz4GwgUXfCBWG6SDr45SFLUsZhpc\
  \ dvHt7nFmC3iQcn37rKBcVRa93DYrA\n```\n\n使用 `getinfo` 参数运行 Zcash-cli 命令会产生以下屏幕截图中显示的输出。它显示了区块、难度和余额等有价值的信息：\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_220_0.png)\n\n可以使用以下命令生成新的 T 地址：\n\n\
  ```\ndrequinox@drequinox-OP7010:~/zcash/src$ ./zcash-cli getnewaddress\nt1XRCGMAw36yPVCcxDUIrxvZcsAAuGdsS8Nny\n\
  ```\n\n## GPU mining\n\n除了 CPU 挖矿外，还提供 GPU 挖矿选项。目前尚无官方 GPU 矿机；然而开源开发者已制作了各种概念验证和可用的矿机。Zcash\
  \ 公司举办了一场公开竞赛，以鼓励开发者构建并提交 CPU 和 GPU 矿机。截至撰写本文时，尚未宣布获奖作品。读者可以通过访问网站 `https://zcashminers.org/`\
  \ 获取更多信息。\n\n还有另一种挖矿方式：使用来自各种在线云挖矿服务提供商的云挖矿合约。云挖矿服务提供商代表客户进行挖矿。除了云挖矿合约外，矿工还可以使用自己的设备通过使用\
  \ stratum 或其他协议的矿池进行挖矿。一个关键示例是 nice hash 的 Zcash 矿池。使用此矿池，矿工可以出售其算力。构建和使用 Zcash\
  \ 矿池上的 CPU 矿机的示例如下所示。\n\n## Downloading and compiling nheqminer\n\n以下步骤可用于在 Ubuntu\
  \ Linux 发行版上下载和编译 `nheqminer`：\n\n```\nsudo apt-get install cmake build-essential\
  \ libboost-all-dev\ngit clone https://github.com/nicehash/nheqminer.git\ncd nheqminer/nheqminer\n\
  mkdir build\ncd build\ncmake ..\nmake\n```\n\n一旦所有步骤成功完成，nheqminer 可以使用以下命令运行：\n\
  \n```\n./nheqminer -l eu -u <btc address> -t <number of threads>\n```\n\nNheqminer\
  \ 的 Windows 版本可在以下位置获得：\n\n```\nhttps://github.com/nicehash/nheqminer/releases.\n\
  ```\n\nNheqminer 接受多个参数，例如位置（`-l`）、用户名（`-u`）和用于挖矿的线程数（`-t`）。\n\nWindows 矿机运行 Zcash\
  \ 的示例如下所示：\n\n![](img/62ab880d2302f959d34db648cb0bec5e_221_0.png)\n\n使用 BTC 地址接收出售算力的付款\n\
  \n![](img/62ab880d2302f959d34db648cb0bec5e_222_0.png)\n\n使用 Zcash T 地址接收出售算力的付款\n\
  \n这完成了对 Zcash 的介绍；读者可以在线探索更多关于 Zcash 的信息，因为它目前非常不稳定，情况可能会迅速变化。一件事是肯定的；Zcash 的零知识证明是一项重大创新，它为需要固有隐私的未来应用铺平了道路，例如银行、医学或法律。\n\
  \n## Summary\n\n在本章中，读者已了解整体加密货币格局。详细讨论了一些山寨币，尤其是 Zcash 和 Namecoin。加密货币是研究的非常活跃的领域，尤其是在可扩展性、隐私和安全方面。一些研究也已开展，以发明新的难度重定目标算法，以遏制加密货币中心化的威胁。可以在隐私和尤其是可扩展性方面进行进一步研究。读者现在应该能够理解山寨币的概念及其背后的各种动机。还讨论了一些实践方面，例如挖矿和启动新的货币项目，希望这能为读者提供坚实的基础，并使他们能够进一步探索这些领域。山寨币是一个引人入胜的研究领域，为去中心化的未来开启了许多可能性。\n\
  \n\n\n\n"
- '# 6 智能合约


  本章对智能合约进行了介绍。这并不是一个新概念，但随着区块链的出现，这一概念的兴趣得以复兴，并且目前已成为区块链领域的一个活跃研究方向。由于智能合约可以通过降低交易成本和简化复杂合同为金融服务行业带来成本节约效益，各大金融机构和学术机构正在进行严格的研究，以便尽快将智能合约的实施形式化并使其易于实用。


  ### 历史


  智能合约最早由 Nick Szabo 在 1990 年代末提出理论化，但在真正认识到其真正潜力和益处之前几乎过去了 20 年。Szabo 对智能合约的描述如下：


  > “智能合约是一种计算机化交易协议，用于执行合同条款。其总体目标是满足常见的合同条件（如付款条款、留置权、保密性，甚至执行），最大限度地减少恶意和偶然的例外情况，并最大限度地减少对可信中介的需求。相关的经济目标包括降低欺诈损失、仲裁和执行成本以及其他交易成本。”


  这一智能合约的想法在 2009 年的比特币中以有限的方式得以实现，其中比特币交易可用于在点对点网络上在用户之间转移价值，在该网络中用户不一定相互信任，并且不需要可信中介。


  ### 定义


  关于智能合约的标准定义尚无共识。定义智能合约是什么至关重要，以下是作者尝试提供智能合约的概括性定义。


  智能合约是一种安全且不可停止的计算机程序，代表一种可自动执行和可强制执行的协议。


  进一步剖析这一定义可知，智能合约实际上是一种用计算机或目标机器可理解的语言编写的计算机程序。此外，它以业务逻辑的形式涵盖了各方之间的协议。另一个关键思想是，当满足某些条件时，智能合约会自动执行。它们是可强制执行的，这意味着所有合同条款都将按定义和预期执行，即使在存在对手方的情况下也是如此。强制执行是一个更广泛的术语，它涵盖了以法律形式进行的传统执行，以及实施某些措施和控制以使能够在无需任何调解的情况下执行合同条款。应注意，真正的智能合约不应依赖传统的执行方法。相反，它们应遵循代码即法律的原则，这意味着无需仲裁员或第三方来控制或影响智能合约的执行。智能合约是自我执行的，而非法律可执行。这可能被视为自由主义者的梦想，但这是完全可能的，并且符合智能合约的真正精神。


  此外，它们是安全且不可停止的，这意味着这些计算机程序需要以容错且在合理时间内可执行的方式设计。这些程序应能够在外部因素不利的情况下执行并保持健康的内部状态。例如，想象一个普通的计算机程序，其编码了一些逻辑并根据其中编码的指令执行，但如果其运行环境或其依赖的外部因素偏离正常或预期状态，程序可能会任意反应或简单地中止。智能合约必须对这种类型的问题具有免疫力。


  智能合约本质上需要具有确定性。这种属性将允许智能合约由网络上的任何节点运行并达到相同的结果。如果结果在节点之间即使略有不同，则无法达成共识，整个区块链上的分布式共识范式可能会失败。此外，还希望合同语言本身是确定性的，从而确保智能合约的完整性和稳定性。我所指的确定性是指语言中没有使用非确定性函数，这些函数可能在不同节点上产生不同的结果。例如，各种编程语言中各种函数计算的各种浮点运算可能在不同的运行时环境中产生不同的结果。另一个例子是
  JavaScript 中的某些数学函数，它们可能对不同浏览器的相同输入产生不同的结果，从而导致各种错误。这在智能合约中是极其不希望的，因为如果节点之间结果不一致，则永远无法达成共识。确定性特性可确保智能合约对特定输入始终产生相同的输出。换句话说，程序一旦编译就产生坚实准确的业务逻辑，完全符合高级代码中编程的要求。


  总之，智能合约具有以下四个属性：


  - 自动可执行

  - 可强制执行

  - 语义健全

  - 安全且不可停止。


  前两个属性是最低要求，而后两个属性在某些场景下可能不需要或无法实现，可以放宽。例如，衍生品合约可能不需要语义健全和不可停止，但至少应在基本层面上自动可执行和可强制执行。另一方面，地契需要语义健全和完整，因此要将其作为智能合约实现，语言必须为计算机和人类所理解。Ian
  Grigg 通过其发明的 Ricardian 合同解决了这一解释问题，我们将在下一节更详细地探讨它。


  ### Ricardian 合同


  Ricardian 合同最初由 Ian Grigg 在 1990 年代末的《Financial Cryptography in 7 Layers》论文中提出。这些合同最初用于名为
  Ricardo 的债券交易和支付系统。其关键思想是编写一份文件，该文件可被法院和计算机软件同时理解和接受。Ricardian 合同解决了通过互联网发行价值的挑战。它识别发行人并在文件中记录合同的所有条款和条款，以便使其作为具有法律约束力的合同被接受。


  根据 Ian Grigg 在 http://iang.org/papers/ricardian_contract.html 的原始定义，Ricardian 合同是一份具有以下若干属性的文件：


  - 由发行人向持有人提供的合同

  - 由持有人持有的有价值权利，并由发行人管理

  - 易于人类阅读（如纸质合同）

  - 可被程序读取（可解析，如数据库）

  - 经过数字签名

  - 携带密钥和服务器信息

  - 与唯一且安全的标识符相关联


  在实践中，合同通过生成一份包含合同条款的法律散文和所需机器可读标签的单一文档来实现。该文档由发行人使用其私钥进行数字签名。然后使用消息摘要函数对该文档进行哈希处理，以生成可用于标识该文档的哈希值。然后该哈希值在合同履行过程中进一步被各方使用和签名，以便将每次交易与标识符哈希链接起来，从而作为意图的证据。这在下图中表示，通常称为蝴蝶结模型。


  下图显示了左侧的法律世界，文档由此产生。然后对其进行哈希处理，生成的消息摘要在会计世界中用作标识符。会计世界基本上可以代表企业中用于执行各种业务操作的任何或多个会计、交易和信息系统。其背后的思路是，通过对文档进行哈希处理而生成的消息摘要首先用于所谓的创世交易，或第一次交易，然后在合同运营执行的整个过程中作为标识符用于每次交易。






  这样，就在原始书面合同与 *会计世界* 中的每笔交易之间建立了一个安全链接。


  ![](img/62ab880d2302f959d34db648cb0bec5e_228_0.png)


  Ricardian 合同，蝴蝶结图


  Ricardian 合同与智能合约的不同之处在于，智能合约不包含任何合同文件，纯粹专注于合同的执行。另一方面，Ricardian 合同更关注语义丰富性和一份包含合同法律散文的文档的生成。合同的语义可以分为两种类型：操作语义和指称语义。第一种类型定义了合同的实际执行、正确性和安全性，而后者关注的是完整合同在现实世界中的含义。一些研究人员区分了智能合约代码和智能法律合同，其中智能合约只关注合同的执行，而第二种类型涵盖了法律协议的指称语义和操作语义。基于语义差异对智能合约进行分类似乎是有意义的，但最好将智能合约视为一个独立实体，它能够在其内部编码法律散文和代码（业务逻辑）。


  在比特币中，可以观察到一种非常简单的智能合约实现，它完全以合同的执行为导向，而 Ricardian 合同则更侧重于生成人类可理解的文档，其中某些部分可由计算机程序理解。这可以被视为法律语义与操作性能（语义与性能）之间的区别，如下图所示。这最初是由
  *Ian Grigg* 在其论文 *On the intersection of Ricardian and smart contracts* 中提出的。


  ![](img/62ab880d2302f959d34db648cb0bec5e_229_0.png)


  解释性能与语义是正交问题的图表，由 Ian Grigg 描述；略有修改以在两个轴上显示不同类型合同的示例


  智能合约被设计为同时包含这两个要素（性能和语义），从而构成智能合约的理想模型。


  Ricardian 合同可以表示为三个对象的元组，即 *Prose, parameters and code*。Prose 代表用常规语言书写的法律合同；code
  代表程序，即法律散文的计算机可理解表示；parameters 将法律合同的适当部分与等效代码连接起来。


  Ricardian 合同已在许多系统中实现，例如 CommonAccord、OpenBazaar、OpenAssets 和 Askemos。


  ## 智能合约模板


  智能合约可以为任何需要行业的实现，但目前大多数用例都与金融行业相关。针对金融行业的智能合约领域的最新工作提出了智能合约模板的想法。想法是构建标准模板，为金融工具的法律协议提供支持框架。这由
  Clack 等人在其论文 Smart Contract Templates: Foundations, design landscape and research
  directions 中提出。该论文还提出应构建特定领域的语言以支持智能合约模板的设计和实现。一种名为 CLACK 的语言，即增强合同知识的通用语言，已被提出，并且研究已开始开发该语言。该语言旨在非常丰富，并提供从支持法律散文到能够在多个平台上执行和加密功能的各种功能。


  金融行业的合同并不是一个新概念，各种特定领域的语言 DSL 已在金融行业中使用，以为特定领域提供特定语言。例如，存在支持保险产品开发的 DSL、表示能源衍生品的
  DSL，或用于构建交易策略的 DSL。列表还在继续，金融特定领域语言的综合列表可以在 http://www.dslfin.org/resources.html
  找到。


  了解特定领域语言的概念很重要。这些语言是为特定应用或感兴趣领域开发的，具有有限的表现力。特定领域语言（DSL）与通用编程语言（GPL）不同：DSL 具有一组小而足以满足其预期使用领域的优化功能，并且与
  GPL 不同，通常不用于构建通用大型应用程序程序。基于 DSL 的设计理念，可以设想可以专门开发此类语言来编写智能合约。一些工作已经完成，Solidity 就是这样一种语言，它与以太坊区块链一起引入用于编写智能合约。Serpent
  是与以太坊一起引入的另一种语言，尽管它不如 Solidity 使用广泛。


  智能合约编程的特定领域语言这一想法可以进一步扩展到图形特定领域语言，即智能合约建模平台，其中领域专家（非程序员）可以使用图形用户界面和画布来定义和绘制金融合同的语义和性能。一旦流程被绘制并完成，它可以先在同一系统内进行仿真以进行测试，然后部署到目标平台，该平台可以是区块链。这也不是一个新概念，类似的方法在
  Tibco streambase 产品中使用，该产品是基于 Java 的系统，用于构建事件驱动的高频交易系统。


  建议还应开展研究，以开发高级 DSL，这些 DSL 可用于在用户友好的图形用户界面中编程智能合约，从而允许非程序员设计智能合约。


  ## 预言机


  预言机是智能合约生态系统的重要组成部分。智能合约的局限性在于它们无法访问可能需要控制业务逻辑执行的外部数据；例如，合同需要用于释放股息支付的证券股价。预言机可用于向智能合约提供外部数据。Oracle
  是一个从外部来源向智能合约传递数据的接口。根据行业和要求，Oracle 可以提供不同类型的数据，从天气报告、现实世界新闻和公司行为到来自物联网（IoT）设备的数据。Oracle
  是使用安全通道将数据传输到智能合约的可信实体。


  Oracle 还能够对数据进行数字签名，证明数据的来源是真实的。智能合约可以订阅 Oracle，智能合约可以拉取数据，也可以由 Oracle 将数据推送到智能合约。还必须确保
  Oracle 无法操纵其提供的数据，并且必须能够提供真实数据。即使 Oracle 是可信的，在某些情况下数据仍可能因操纵而不正确。因此，有必要使 Oracle
  无法更改数据。这种验证可以通过使用本章后面讨论的各种公证方案来实现。在这种方法中，已经可以看到一个可能在某些情况下不理想的问题，那就是信任问题。如何信任第三方提供的数据的质量和真实性？这在金融世界尤其如此，市场数据必须准确可靠。对于智能合约设计者来说，接受由大型知名可信第三方提供的预言机数据可能是可以接受的，但中心化问题仍然存在。这类
  Oracle 可以称为标准或简单 Oracle。


  另一种 Oracle，本质上是由于去中心化要求而出现的，可以称为去中心化 Oracle。这类 Oracle 可以基于某种分布式机制构建。也可以设想 Oracle
  本身可以从由分布式共识驱动的另一个区块链获取数据，从而确保数据的真实性。例如，一个机构运行自己的私有区块链，可以通过 Oracle 发布其数据馈送，然后可被其他区块链消费。





  研究人员还提出了另一种硬件预言机的概念，它需要来自物理设备的真实世界数据。例如，这可以用于遥测和物联网。然而，这种方法需要一种机制来确保硬件设备无法被篡改。这可以通过使用防篡改设备来实现。


  现在已有平台可以支持智能合约通过预言机获取外部数据。预言机向区块链写入数据的方式取决于所使用的区块链类型。例如，在比特币区块链中，预言机可以通过OP_RETURN操作码将数据写入特定交易，智能合约可以监控该交易并读取数据。各种在线服务（例如
  http://www.oraclize.it/ 和 https://www.realitykeys.com/ ）均可提供预言机服务。此外，https://smartcontract.com/
  还提供了另一项服务，该服务提供外部数据以及通过智能合约进行支付的能力。所有这些服务的目的是让智能合约能够获取其执行和决策所需的数据。为了证明预言机从外部来源检索到的数据的真实性，可以使用像TLSnotary这样的机制，它会产生数据源与预言机之间通信的证明。这确保了反馈给智能合约的数据确实是从该来源检索到的。关于TLSnotary的更多详情可以在这里找到：https://tlsnotary.org/。


