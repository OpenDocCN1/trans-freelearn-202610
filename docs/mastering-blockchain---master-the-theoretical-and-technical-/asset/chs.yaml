  ## Summary


  本章介绍了去中心化的概念，这是区块链技术提供的核心服务。虽然去中心化的概念并非新事物，但在区块链世界中它获得了新的重要意义。因此，基于去中心化架构的各种应用最近已被引入。本章首先介绍了去中心化的思想。接下来，从区块链的角度讨论了去中心化。此外，还介绍了区块链生态系统中去中心化的不同层级相关的思想。随着区块链技术和从区块链角度看的去中心化的出现，出现了一些新的概念和术语，例如
  DAOs、DAPPs 等。本章也对所有这些术语进行了介绍。最后，讨论了具有一些示例的去中心化应用。在下一章中，将介绍理解区块链生态系统所必需的基本概念。主要将介绍密码学，它为区块链技术提供了至关重要的基础。

