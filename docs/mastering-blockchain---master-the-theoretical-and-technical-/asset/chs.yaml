  \ 用于在账户之间创建或修改信任线。\n\nRipple 中的交易由适用于所有交易类型的各种通用字段组成。这些字段如下列出并附带说明：\n\n-   1. `Account`,\
  \ 交易发起人的地址。\n-   2. `AccountTxnID`, 这是一个可选字段，包含另一笔交易的哈希。\n-   3. `Fee`, XRP 数量。\n\
