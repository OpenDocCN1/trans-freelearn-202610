  \ 5 章 | 266 |  |  |\n\n## 你可能喜欢的其他书籍\n\n## 索引\n\n## 前言\n\n*Embracing Microservices\
  \ Design* 面向希望遵循正确的原则、实践和模式设计和构建微服务应用，同时避免可能导致糟糕实现的谬误和反模式的架构师和开发者。微服务的采用因其敏捷性、可维护性、技术多样性、可扩展性、创新性、更快的上市时间和更高的可靠性等各种好处而不断增长。然而，它也带来了许多挑战，例如组织文化的变革、学习曲线、理解和建模业务领域、架构和运营复杂性、可观测性以及端到端测试。\n\
  \n本书分为三个部分。第一部分侧重于微服务介绍并探讨设计和架构陷阱，然后提出避免这些陷阱的替代方法。第二部分侧重于数据设计陷阱、通信挑战及预防措施，以及横切关注点。最后一部分侧重于部署陷阱和在设置部署策略时的最佳实践、测试的需求、挑战，以及在从单体架构向微服务架构转型时如何评估潜在应用。\n\
  \n### 本书适合谁\n\n本书面向参与微服务及相关架构设计的架构师和开发者。假定具备微服务的熟练程度以充分利用本书。\n\n### 本书涵盖内容\n\n*第\
  \ 1 章，Setting Up Your Mindset for Microservices Endeavor*，教你了解在启动微服务之旅时不同个人的角色、构建团队的重要性，以及投资学习以根据既定章程执行微服务采用策略。\
  \ 本章还讨论了在采用 12-Factor App 方法论时构建可扩展、可维护和可移植应用的指南。\n\n\n\n\n\n- *第 2 章，失败于理解 DDD\
  \ 的作用,* 教你理解领域驱动设计对于构建具有边界上下文的内聚服务的重要性。本章将重新审视微服务相对于领域驱动设计的特点和属性，以及它与构建微服务的关系。你还将了解团队建设、治理以及利益相关者意识的重要性。\n\
  \n- *第 3 章，微服务架构陷阱,* 教你关于构建微服务时遇到的各种架构陷阱。它通过将微服务与各种架构实践联系起来，涵盖了微服务的复杂性和优势，以及如何通过使用不同的模式来改进它们。此外，它还讨论了理解各种框架和技术的优缺点的重要性。最后，它强调了抽象通用微服务任务的好处以及单体前端的缺点。\n\
  \n- *第 4 章，保持棕地应用再平台化的简易性,* 教你再平台化棕地应用的技术，随后介绍可使用的一些模式。从单体到微服务架构的过渡并非一帆风顺的过程，需要考虑许多因素，例如可用性、可靠性和可扩展性，这些也将在本章后面讨论。最后，它讨论了重复使用单体应用组件而不是重写它们以利用可能提供更好替代方案的新兴技术的一些缺点。\n\
  \n- *第 5 章，数据设计陷阱,* 教你将单体应用的数据库分解为一组微服务的重要性，其中每个微服务管理自己的数据库。在许多场景中，对微服务中的数据进行规范化可能是一种反模式，本章讨论了应避免这样做的理由。本章涵盖了将数据从单体数据库中分离出来的策略，并检查了不知道如何处理事务的陷阱。你还将了解如何使用\
  \ Saga 在分布式架构中进行原子事务。最后，本章涵盖了不知道如何进行报告的陷阱，通过实现一个负责为业务分析构建复杂报告的 API。\n\n- *第 6 章，通信陷阱及预防,*\
  \ 教你关于微服务架构的各种通信风格、其挑战和潜在解决方案。你还将了解实现微服务之间弹性进程间通信的不同技术。此外，它讨论了事件驱动架构的挑战以及如何使用不同方法解决这些挑战。最后，你将了解服务网格以及它们与\
  \ Dapr 的比较。\n\n- *第 7 章，横切关注点,* 教你关于微服务底盘模式的重要性及其用例。本章首先讨论每个基于微服务的应用的常见需求，以及在处理这些关注点时出现的陷阱。\n\
  \n- *第 8 章，部署陷阱,* 教你关于各种部署陷阱，从拥有不同的部署技术必要性开始。本章讨论了使用正确且最新的工具和技术以避免失败的重要性。在那之后，你将了解\
  \ DevOps 实践以及在实施时需要考虑的因素，例如功能管理、敏捷实践、回滚策略、审批和门控。最后，本章涵盖了各种部署模式，例如部署印章、部署环和地理分布式部署，以及它们可以应用的地方。\n\
  \n- *第 9 章，跳过测试,* 教你测试对于微服务的开发和部署的重要性。跳过测试不是一个好的做法，可能导致失败。然而，这可以通过将测试左移到开发生命周期的早期来避免。本章涵盖了一些与左移测试相关的策略以及支持这种方法的测试类型。\n\
  \n- *第 10 章，评估微服务架构,* 教你评估微服务架构时需要考虑的一些关键因素。在开发或再平台化应用时给予这些因素高度优先级，将有助于你识别需要改进的领域。\n\
  \n## 下载彩色图片\n\n我们还提供了一份 PDF 文件，其中包含本书中使用的屏幕截图和图表的彩色图像。你可以在此处下载：`https://static.packt-cdn.com/downloads/9781801818834_ColorImages.pdf`。\n\
  \n## 使用的约定\n\n本书中使用了多种文本约定。\n\n- `Code in text`: 表示文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
