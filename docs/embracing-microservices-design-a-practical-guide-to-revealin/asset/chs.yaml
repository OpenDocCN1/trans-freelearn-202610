  \ and perform the necessary action to generate the invoice. Once the invoice is\
  \ generated, the system will generate an `invoice_generated` event, which can be\
  \ processed by the notification system to send notifications.\"\n- **Bold**: 表示新术语、重要单词或你在屏幕上看到的单词。例如，菜单或对话框中的单词以**粗体**显示。以下是一个示例：\"\
  **Trusted Host** is the system or platform used to host the microservices.\"\n-\
