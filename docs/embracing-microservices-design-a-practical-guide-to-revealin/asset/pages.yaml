- pgno: 213
  md: '# # Embedding protocol translation inside microservices


    Usually, the microservices'' core APIs are independent, fine-grained services,
    and exchange data over HTTP. For example, when integrating a microservices application
    with an existing SAP system, you may need to use the TCP protocol to send data.
    To meet a specific requirement, you can create components or services that allow
    other services to communicate with them using the HTTP protocol and connect to
    them internally using a TCP protocol. The solution to this pitfall is to delegate
    the protocol translation responsibility to the API gateway.


    # ## Delegating protocol translation to API gateway


    Building the protocol translation inside the microservice itself is an anti-pattern.
    You should delegate this responsibility to either an API gateway, or build a common
    service to perform this translation which makes the service generic, and then
    the same translator can be used by other services as well.


    Protocol translation allows developers to concentrate on programming instead of
    how to access the microservices. Rather than writing code to execute protocol
    translations, developers can focus on designing microservices to cover specific
    business scenarios and delegate this responsibility to the API gateway. For example,
    making REST calls from the **Single-Page Application (SPA)** is far easier and
    more lightweight than the **SOAP** protocol, which only works with XML messages.
    Clients can consume services over REST APIs, and the gateway can take responsibility
    for all the translation needed and consume the target service over the SOAP protocol.


    The following figure depicts the use case of doing protocol translation at the
    API gateway level:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_213_0.png)


    Figure 7.4 – Protocol translation at the API gateway'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'The API gateway helps developers to offload the protocol translation, and it
    can become a common entity that holds all kinds of translation components that
    help translate protocols. All requests from clients first go through the API gateway
    and then route to the appropriate microservice.


    The API gateway is often used to handle requests by invoking multiple microservices
    and aggregating the results. It allows you to translate between web protocols
    such as HTTP and **WebSocket** and web-unfriendly protocols that are used internally.


    # Message transformation coupling with microservices


    REST services are one of the primary architecture styles used today when building
    services or APIs. However, there could be scenarios where you are decomposing
    a monolith into the microservices application, and you want to integrate with
    some legacy services to complete a specific functionality, for example, transforming
    messages into different formats so they can be accepted by the target service.
    The solution to this pitfall is to either delegate this responsibility to the
    API gateway to transform the messages or build a separate service.


    # Building a separate service or using the API gateway to provide message transformation


    Keeping messaging transformation within the microservice itself is an anti-practice.
    The drawback of embedding this in the microservice is it reduces reusability and
    violates the SRP. The recommended way is to offload the message transformation
    to the API gateway level. If any of the services want to transform a message,
    they can communicate to the API gateway to perform that work.


    Let''s elaborate with an example, where the frontend application is making a call
    to the microservice over an API gateway. The microservice performs some work and
    then communicates to the third-party service that only accepts SOAP messages over
    the HTTP protocol. The API gateway is required to accept messages in JSON format
    over a REST standard and then transform it into the SOAP envelope:'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_215_0.png)


    Figure 7.5 – Message transformation and protocol translation and API gateway level


    Azure API Management provides an out-of-the-box feature to expose your SOAP-based
    services to RESTful endpoints. When adding the API, you can select the **WSDL**
    definition template to configure SOAP-based APIs, as shown in the following figure:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_215_1.png)


    Figure 7.6 – Message transformation and protocol translation at API gateway level'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'More importantly, Azure API Management is one of the most popular services
    in Azure when it comes to implementing microservices chassis patterns. It helps
    embed various policies at the gateway level to protect and control your backend
    services.


    > Note

    > To learn more about Azure API Management, refer to https://docs.microsoft.com/en-us/azure/api-management.


    # Directly exposing microservices to consumers


    Microservices-based applications are split into a number of fine-grained services
    where each service is hosted in its own container and listens on a different IP
    address or port. The client application connects to certain services to do some
    work, but exposing the service''s IP address directly to client applications or
    other consumers is a bad practice. If the IP address of a service changes due
    to scaling, failures, or upgrades, the client code needs to be updated, which
    can cause a delay and could have a negative impact on the business.


    The following figure depicts the approach of client applications accessing services
    directly:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_216_0.png)


    Figure 7.7 – Microservices exposed directly to consumers'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'The drawbacks of exposing services directly to consumers are as follows:


    +   - Consumer application needs to track all the services'' endpoints. With any
    change in endpoints, consumer application needs to be updated.

    +   - It establishes coupling between a service and a consumer application.

    +   - All the RESTful methods are exposed to consumers regardless of whether that
    is needed or not.

    +   - Each service needs to handle the authentication and authorization of requests.

    +   - Services with public endpoints are a possible attack surface that must be
    minimized.


    With all of these disadvantages, implementing a *gatekeeper* pattern is a preferred
    solution to resolving this problem.


    # Using the gatekeeper pattern


    Gatekeeper patterns protect services by providing a dedicated host instance that
    acts as a broker between consumers and services. The gatekeeper helps to validate
    and sanitize the request and routes the request to the backend services. It can
    be used in the following additional scenarios:


    +   - When security is your utmost concern, and you need to protect your backend
    services by enforcing restrictions and policies

    +   - To validate all the incoming requests before routing them to the backend
    services

    +   - To expose only those APIs that need to be exposed'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'The following figure depicts the use case of the gatekeeper pattern that acts
    as a piece of security middleware between frontend and backend applications to
    protect them:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_218_0.png)


    Figure 7.8 – Using the gatekeeper pattern


    The preceding figure shows the use of the gatekeeper pattern that validates and
    sanitizes requests before sending them out to the backend services. Gatekeeper
    patterns can be implemented by adding the API gateway as a proxy to backend services.
    The **Trusted Host** is the system or platform used to host the microservices.
    Kubernetes could be an example of a **Trusted Host** in microservices architecture.


    A few considerations to understand regarding gatekeeper patterns are as follows:


    +   - Gatekeepers should not hold any tokens or access key information.

    +   - Gatekeepers should not contain any logic to perform operations related to
    services or data.

    +   - Gatekeepers should be designed as a single point of failure and there should
    not be any room to access the services directly.

    +   - You should consider implementing monitoring and logging at the gateway level.

    +   - Always use secure connections when communicating to or from frontend or
    backend services and the gatekeeper. Use secure connections such as HTTPS, SSL,
    and TLS.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'The gatekeeper pattern is one of the most common patterns used when building
    enterprise-grade applications. In Azure, **API Gateway**, **Azure Front Door**,
    and **Azure API Management** can be used to implement a gatekeeper pattern.


    # Keeping configuration inside microservices


    Every business application needs to connect with various systems to perform business
    operations. To communicate with systems that could be databases, message brokers,
    services, or other platforms, you need to provide a key or a connection string
    to access them. Keeping all of these configuration values in the microservice
    itself is an easy option, but it introduces tight coupling when you want to connect
    to other environments. The solution to this pitfall is to externalize your configuration
    values, so instead of changing the values at the application level, when deploying
    to that environment, you can switch these values from the external system to the
    target respective environment.


    # Externalizing configuration


    Externalizing configuration is the practice of decoupling the configuration values
    from the application. One approach is to set the configuration values as parameterized
    values when running the application and then building the logic inside the application
    to read those values at runtime. On the other hand, you can create a data store
    that holds all of the property values, and the application can read them at runtime
    depending on the context in which it is functioning. The application does not
    need to be recompiled with this approach, and the values can be conveniently maintained.


    When using DevOps for automating build and release cycles, configuration values
    can be defined in the pool of variables collection, also known as *variables groups*
    in the context of Azure DevOps. The values can easily be changed and used with
    respect to the environment you are targeting.


    # Using Azure Key Vault


    **Azure Key Vault** is a cloud-based service for storing secrets. You can keep
    all the configuration values or properties inside Azure Key Vault and use it as
    an external configuration storage provider. All the keys/values stored in this
    resource are highly secured and it enforces the TLS protocol to protect them between
    clients and Azure Key Vault.'
  merge: -1
  img_proc: true
- pgno: 220
  md: "You can store all your application's secrets at one central location that is\
    \ closely regulated and secured, and you can access them safely by using their\
    \ special URIs. Furthermore, proper authentication and authorization are required\
    \ for any access. Authentication can be accomplished in a variety of ways, including\
    \ **Azure Active Directory** authentication, **Role-Based Access Control (RBAC)**,\
    \ or through a Key Vault access policy.\n\n> **Note**\n> \n> To learn more about\
    \ Azure Key Vault, refer to `https://docs.microsoft.com/en-us/azure/key-vault/general/basic-concepts`.\n\
    \nSome of the best practices when using Azure Key Vault are as follows:\n\n+ \
    \  - Create access policies for Azure Key Vault.\n+   - Enable least privilege\
    \ access to Azure Key Vault.\n+   - Turn on firewall.\n+   - Enable VNET service\
    \ endpoints if the other cloud resources are accessible over VNET.\n+   - Enable\
    \ soft delete to protect your keys from accidental deletion.\n+   - Set up automation\
    \ to automatically respond when your secrets rotate.\n+   - Store all security\
    \ certificates in your vault.\n+   - Ensure that the deleted key vaults are recoverable\
    \ by enabling the built-in protection features of Azure Key Vault.\n+   - Enable\
    \ monitoring and set up some metrics to monitor the vault's availability, saturation,\
    \ latency, and error codes.\n+   - Set up alerts to send out notifications when\
    \ any of the metric conditions suffice."
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Undiscoverable microservices


    In a microservices architecture, services are hosted separately on a different
    IP and port. Unlike a monolithic application, where you can add a direct reference
    to the module or component you want to use, with microservices you need to make
    an HTTP/REST call to invoke the operation of the target service. Since the system
    with microservices is divided into sets of various services, you need to build
    some mechanism to make your services discoverable.


    Services are either consumed by the client or frontend applications or by other
    services to perform service-to-service invocation. To do so, implementing service
    discovery patterns at both client and server levels is important. To clarify our
    understanding, in the next section, we will discuss the client-side service discovery
    and server-side discovery patterns, with examples.


    # Implementing client-side service discovery patterns


    Microservices usually run inside a containerized environment, where multiple instances
    of a single service can run in parallel and each instance is assigned a unique
    IP address or port. The problem is – how does the client know if the IP changes
    or is dynamically assigned?


    The solution to this is by implementing the *service registry* pattern. A service
    registry registers all the services running across the cluster and lets clients
    request the service endpoint by providing the service name or key. A service registry
    can be considered a database of services, their instances, and other information,
    such as IP addresses and ports. The client application searches the service registry
    to obtain the list of available running instances and selects the one that best
    serves the load balancing criteria. The `heartbeat` function is used by the service
    registry to check the availability of services.


    The client must be able to access the service registry and you must write some
    code to connect to the service registry. After getting the details of the active
    instances, the client must decide to use the correct endpoint to connect to that
    microservice directly. This kind of client is also known as a *registry-aware
    client.*'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'The following diagram depicts the use case of a service registry in a microservices
    architecture:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_222_0.png)


    Figure 7.9 – Client-side service discovery pattern


    In the previous figure, the frontend application is a registry-aware client application
    that communicates to the service registry over HTTP and gets the list of running
    instances details to access them directly. On the other hand, microservices should
    be capable of self-registering to the service registry when they start and unregistering
    when they shut down. Moreover, any third-party registration service can also be
    used to register/unregister services to the service registry.


    # Implementing server-side service discovery patterns


    With a server-side discovery pattern, the client can make a request to the load
    balancer that acts as a front door to the backend services and route the traffic
    based on the load balancing algorithm. In this scenario, there is no service registry
    where the client can request the available endpoints. Instead, it contains a load
    balancer endpoint that can be used to make a request.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'In the AKS world, the concept of a Service type object with a load balancer
    configuration is the example used for server-side discovery patterns. The Service
    type object exposes the external IP address that can be consumed by any client
    application and internally it maps the request to the respective pods where the
    actual containers are running.


    The following figure depicts the architecture with a server-side discovery pattern:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_223_0.png)


    Figure 7.10 – Server-side service discovery pattern'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'The preceding diagram depicts the implementation of a server-side discovery
    pattern inside an AKS cluster. It shows the microservices containers running inside
    pods, where each pod has a unique IP address assigned within the Kubernetes cluster.
    Since the pod''s IP address is not exposed to the outside world, the K8s (Kubernetes)
    service''s object is created for each set of pods to help load balance the requests
    and establishes the mapping between services and pods. The configuration, and
    any other desired and current state information, is stored in the ETCD database,
    which is the service registry in K8s to store information in a key/value format.


    The frontend application can directly consume the services over a public IP address
    without writing a code to get the list of running instances and then building
    a logic to consume the available endpoint, as we saw in the client-side discovery
    pattern. With this approach, the client applications are not aware of the service
    registry as it is maintained on the server-side. Moreover, you can also handle
    third-party clients easily, and less maintenance is required. Apart from exposing
    services such as load balancers, there are a variety of other methods, such as
    NGINX, which can be used as a server-side discovery load balancer. This can take
    all requests from the client application and route them to the K8s service object,
    configured as Cluster IP, which then further directs traffic to the corresponding
    pods where microservices containers are running. Service meshes usually solve
    the service discovery problem for service-to-service invocation and API gateway-to-service
    calls.


    # Not maintaining a service template or framework


    Many software companies maintain a practice to build in-house frameworks that
    can be reused to reduce development efforts. With a microservices architecture,
    the application is decomposed into several services, and each service is built
    by a separate team or set of developers. The service is aligned with the business
    capabilities, and assigning responsibility for building components to address
    cross-cutting concerns for each microservice''s team is an anti-practice, and
    not considered a viable solution. Each team needs to spend some time, which may
    be days or weeks, to build those components that can be used to perform logging,
    event messaging, connectivity with databases, and other cross-cutting concerns.
    An alternative solution to this pitfall is building a template or a framework
    that can be reused by all the services to reduce this effort.'
  merge: -1
  img_proc: true
