- pgno: 275
  md: '+   - Is the service built using the supported microservices chassis pattern?

    +   - What is the percentage of microservices that map to business domains?


    # Infrastructure readiness


    Infrastructure readiness is a very important factor to consider when moving toward
    a microservices architecture. If infrastructure is not properly built or if the
    right tools are not used, it will impact the performance, availability, and scalability
    of the application. There could be scenarios where an application is built with
    all recommended techniques and practices but without having a correct infrastructure,
    giving a bad performance.


    The following factors must be considered when evaluating infrastructure readiness
    in a microservices architecture:


    +   - Does the deployment infrastructure ensure the scalability of the services?

    +   - Does the deployment infrastructure support provisioning through scripts
    that can be automated using DevOps CI/CD?

    +   - Does the deployment infrastructure offer a proper SLA for availability?

    +   - Is there a disaster recovery (DR) plan and drill schedules for the whole
    infrastructure in place?

    +   - Is the data replicated synchronously/asynchronously to different regions
    to ensure data availability for the DR environment?

    +   - Is there a proper data backup plan in place?

    +   - Are deployment options documented?

    +   - Does the deployment infrastructure monitor and ensure the desired number
    of services are running?

    +   - Does the deployment infrastructure support self-healing of services?

    +   - Do you have Open Systems Interconnection (OSI) Layer 7 (L7) load-balancing
    capabilities?

    +   - Do you have a web application firewall (WAF) layer in place?

    +   - Do you have throttling policies implemented?'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Release cycles


    A microservices architecture embraces rapid development and helps to shorten the
    release cycles for applications or services. The following aspects are important
    to discuss when evaluating this factor:


    +   - What is the frequency of building or releasing applications?

    +   - Are you following any practice of releasing the application versions—that
    is, monthly, quarterly, half-yearly, or yearly?

    +   - How frequently does a deployment cause an outage?

    +   - How long does it take to recover from an outage?

    +   - Are the new service versions following semantic versioning?

    +   - Are the versions released first to staging and then production?

    +   - Are the **application programming interfaces (APIs)** following proper version
    guidelines?

    +   - What makes an API version change?

    +   - Have you implemented versioning?

    +   - What is your approach to handling **HyperText Transfer Protocol (HTTP)**
    API versioning?

    +     - **Uniform Resource Identifier (URI)** path versioning

    +     - Query parameter versioning

    +     - Content-type versioning

    +     - Custom header versioning

    +   - Are you performing **Google remote procedure call (gRPC)** versioning?

    +   - Have you implemented event versioning?'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# Communication protocol across services


    Microservices are independent fine-grained services that communicate with each
    other across process boundaries, hosted across the network, to address different
    business use cases. Choosing the right communication protocol is a very important
    factor to ensure reliable communication. The following aspects should be considered
    when assessing this factor:


    +   - Are you following an API-first approach?

    +   - Do you have deep chaining of services over synchronous communication protocols?

    +   - Do you have asynchronous communication anywhere in the system?

    +   - Which message broker technology are you using?

    +   - What is the throughput of messages received or processed by the services?

    +   - Do you have direct client-to-microservice communication?

    +   - Do you need to persist messages?

    +   - Are you using a materialized view pattern to address the chatty behavior
    of microservices?

    +   - Have you implemented a retry pattern, a circuit breaker, exponential back-off,
    and jittering?

    +   - Have you defined domain events to facilitate communication between microservices?


    # Exposing services to clients


    An API gateway is one of the core components when developing a microservices architecture.
    Exposing microservices directly to clients is not a good practice due to many
    factors. You should evaluate the following:


    +   - Are the services directly consumed by the frontend application?

    +   - Is there a gateway that acts as a facade for all backend services?

    +   - Does the gateway provide quota limits, mocking responses and filtering Internet
    Protocol (IP), and other policies?

    +   - Are you using multiple API gateways to address the needs of different clients?'
  merge: -1
  img_proc: true
