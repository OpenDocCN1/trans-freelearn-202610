- pgno: 205
  md: '# 7


    # Cross-Cutting Concerns


    Traditionally, when we start building applications, we develop components known
    as *facades* to perform different operations, such as logging, health checks,
    tracing, and authorization. In microservices architecture, building these components
    for each service requires proper time and effort. Microservices are self-contained
    services that generally require less time to build because they are limited to
    a single business capability. Building the modules for cross-cutting concerns
    for each service would certainly take a much longer time than building that service
    itself. As a consequence, it affects agility and requires adequate effort to develop.
    Since each service has its own components, modifying one component due to an organizational
    plan would entail updating each service individually, which would be challenging
    as well.


    It is a good idea to build common modules or reuse existing platforms that allow
    easy and fast integration with different microservices. Microservices should only
    include modules or artifacts specific to the business capability, and all cross-cutting
    concerns should be outsourced to solve the problem. For example, instead of building
    a separate logging mechanism for each microservice, it is preferable to use a
    centralized monitoring system such as **Azure Application Insights**, which provides
    an **SDK** and easy integration with whatever platform the microservice is based
    on. Furthermore, an Azure App Insights resource can be integrated with all microservices
    and provides unified access to all the logs from a single pane of glass. However,
    when you are keeping one resource for the whole system, it becomes harder to restrict
    access due to privacy or legal needs. In such a scenario, you can segregate log
    resources based on services or domains.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'In this chapter, we will discuss the pitfalls related to cross-cutting concerns,
    and also learn patterns such as microservices chassis, gatekeeper, and service
    discovery. Throughout the chapter, we will cover the following topics:


    +   - Microservices chassis patterns

    +   - Cross-cutting pitfalls


    # Microservices chassis patterns


    In the non-technical term, we can think of a chassis as the base frame of a car.
    It provides the core layer, or skeleton, on which the car is built. In the context
    of microservices, we can think of it as a base framework that provides basic cross-cutting
    concerns such as logging, security, exception handling, tracing and distribution,
    and more. The following figure depicts the representation of the microservices
    chassis framework:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_206_0.png)


    Figure 7.1 – Microservices chassis framework'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'Microservices architecture for large enterprises has numerous services communicating
    with each other, and agility is a very important factor. When the requirement
    comes, you usually estimate it based on the business use case instead of thinking
    about how to implement security, develop a logging framework, or perform exception
    handling, and so on. Providing a base framework that can be utilized by the service
    to handle these concerns not only reduces the number of efforts required to build
    that service but also allows you to reuse those building blocks that are part
    of the chassis framework.


    The microservices chassis pattern states that all of these concerns should be
    offloaded to either a distinct service that is shared by all other services or
    a component. Dapr is a good example of a service that provides a set of building
    blocks to enable logging, service-to-service communication, inter-process communication,
    pub/sub, and a few others. It also requires very little configuration and allows
    quick implementation by using the HTTP or GRPC endpoints, or through Dapr SDK.
    To learn more about Dapr, refer to Chapter 3, Microservices Architecture Pitfalls.


    # Microservices application needs


    There are various scenarios and use cases built on microservices. Microservices
    are not only dependent on the business capability or Create, Read, Update, and
    Delete (CRUD) operations performed in the database, but can also be built to respond
    to events that arrive at the message queue, integrate with other systems, be exposed
    as a webhook to send some notification, or perform some heavy operational task,
    such as image processing. For each service, you may need to build several components
    that are not completely tied to the actual service use case and would delay the
    service delivery. Some of the factors that should be catered for separately from
    the microservice but not limited to are as follows:


    +   - Security and token validation

    +   - Retry and circuit breakers

    +   - Idempotency

    +   - Protocol conversion

    +   - Message transformation

    +   - Logging

    +   - Metrics collection

    +   - Distributed tracing'
  merge: -1
  img_proc: true
- pgno: 208
  md: "Building all these concerns in the microservice itself is an anti-practice\
    \ and increases the development time of the service, therefore reducing agility.\
    \ In the next section, we will discuss some of the pitfalls when catering to these\
    \ concerns and the recommended practices for dealing with them.\n\n# Cross-cutting\
    \ pitfalls\n\nThis section will cover some of the pitfalls related to various\
    \ cross-cutting concerns when building microservices, followed by an alternative\
    \ approach for each.\n\n# Embedding security handling inside microservices\n\n\
    Protecting services and allowing secure access to services are some of the primary\
    \ needs when building services. Embedding the security process for validating\
    \ an incoming token from a request object into the microservices will be a time-consuming\
    \ task. Security and token validation can be eradicated from the microservices\
    \ code, keeping the microservices code clean and tied to its use case. However,\
    \ if the service does not validate the incoming token, make sure the service is\
    \ not exposed directly to the consumer without having a front door such as an\
    \ API gateway. If the service is exposed, it will be vulnerable to attacks and\
    \ may fail. The solution to this pitfall is by offloading the security to the\
    \ API gateway.\n\n# Enable throttling to protect microservices\n\nThrottling is\
    \ a mechanism to limit the number of requests allowed for a component. In a microservices\
    \ architecture, it is considered to be an important factor when it comes to protecting\
    \ your services. If you don't have a mechanism to configure the maximum number\
    \ of requests your service can serve, it may lead to a **Distributed Denial of\
    \ Service (DDoS)** attack. Throttling allows you to specify limits, configurations,\
    \ and policies, which enables services to meet their expected **Service Level\
    \ Agreements (SLAs)**.\n\n> **Note**\n> \n> The SLA is a commitment between a\
    \ service provider and a customer that identifies both the services required and\
    \ the desired level of service."
  merge: -1
