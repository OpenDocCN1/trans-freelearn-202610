    To help understand microservices, I think we need to examine the science behind
    microservices and complexity theory. So, let''s explore complex adaptive systems,
    as this is how microservices can be viewed. Let''s explore the concept and see
    if you agree.


    # Microservices are based on science


    As we examine the definition of complex adaptive systems, we can see some similarities
    with many of the concepts of microservices, and even DDD. I challenge you to explore
    this topic of complex adaptive systems deeper as I believe this knowledge is the
    foundation of microservices, in my humble opinion.


    A complex adaptive system is a dynamic network of system interactions, but the
    behavior of the whole system may not be predictable according to the behavior
    of the individual components or nodes. It is adaptive as the individual and collective
    behavior mutates and self-organizes, depending on the change event or collection
    of events.


    Those systems have relationships with adjacent systems and can interact with each
    other and may fulfill some need for one another, which may be something that they
    cannot produce on their own. Understanding those relationships is as important
    as understanding an individual entity or node itself.


    Some systems have no knowledge of other adjacent systems. In other cases, an adjacent
    system may have knowledge of another and interact directly, while others interact
    indirectly, but still depending on an adjacent system to meet some need it has.'
