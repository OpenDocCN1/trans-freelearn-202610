- pgno: 269
  md: '# 10


    # Evaluating Microservices Architecture


    Many organizations today are building or replatforming applications into a microservices
    architecture. When decomposing any application into a microservices architecture,
    we need to understand which factors are important when making decisions and to
    analyze if that application is the right candidate for a microservices architecture.


    In this chapter, we will summarize the important factors that will help you to
    build knowledge and understanding of the assessment of a microservices architecture.
    These factors are equally important when you are building a new application or
    transforming an existing application into a microservices architecture. You can
    start your discussion with the customer and refer to these factors to drive your
    discussion and make a decision.


    Here are the factors we will discuss in this chapter:


    +   - Identifying the core priorities of a business

    +   - Managing architectural decisions

    +   - Team structure

    +   - Choosing the right methodology'
  merge: -1
  img_proc: true
- pgno: 270
  md: '+   - Decomposition strategy

    +   - Evaluating the **development-operations (DevOps)** capability

    +   - Understanding which part of the business is going to change more rapidly

    +   - Infrastructure readiness

    +   - Release cycles

    +   - Communication protocol across services

    +   - Exposing services to clients

    +   - Distributed transaction handling

    +   - Service deployment

    +   - Capabilities of the hosting platform

    +   - Deployment strategy

    +   - Monitoring services

    +   - Assigning a correlation token to each service request

    +   - Defining a microservices chassis framework

    +   - Shift-left approach for testing and security


    In this chapter, we will discuss some key aspects to think about when analyzing
    a microservices architecture. Let’s get started!


    # Identifying the core priorities of a business


    To start the evaluation of a microservices architecture, you need to understand
    the priorities of the business to make sure that the architecture is fit for its
    purpose. The areas you should discuss with the organization while assessing the
    microservices architecture are listed here:


    +   - Reliability

    +   - Innovation

    +   - Efficiency'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'To understand the priority of these areas, you can ask the team about how much
    importance they want to give to this area on a scale of 0 to 10. Moreover, you
    should also document the expected **service-level agreements (SLAs)** associated
    with different components of the application to ensure that it meets organization
    commitments. These priorities and commitments serve as an anchor to guide our
    assessment.


    # Managing architectural decisions


    A microservices architecture thrives when you allow teams to have autonomy. This
    doesn''t mean that teams can do anything, but it gives them the freedom to make
    decisions under an umbrella of formally agreed principles. This is called shared
    governance, which states the consensus across the teams on how they want to address
    the broader architecture strategy for microservices.


    The following aspects are important when evaluating this factor:


    +   - Do you have shared governance in place?

    +   - Are you maintaining an architecture journal along with your microservice
    to track decisions?

    +   - Are your architecture journal documents all your architectural decisions?

    +   - Is your architecture journal easily accessible by your team?

    +   - Do you have a framework in place for evaluating tools, technologies, and
    frameworks?


    # Team structure


    Having the right team structure is very important for microservices to avoid unnecessary
    communication across teams. A microservices architecture promotes the formation
    of small, focused, and cross-functional teams to deliver business capabilities.
    This requires a shift in mindset, led by team restructuring.


    The following aspects are important when evaluating this factor:


    +   - Are the teams segregated based on subdomains, where one subdomain is owned
    by only one team?

    +   - Are these teams cross-functional in that they have sufficient capacity to
    build and operate a microservice?

    +   - How often do your team members spend time on ad hoc tasks related to development
    or operations?'
  merge: -1
  img_proc: true
