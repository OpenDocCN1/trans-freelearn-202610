- pgno: 55
  md: 'Something I have noticed in my studies of microservices that has always puzzled
    me when some folks describe microservices in articles and blogs, as well as in
    some books about microservices, is that you see very little mention of how much
    DDD plays a role or influences the creation of microservices and how it really
    serves, in my humble opinion, as a blueprint or the basis of microservices; it
    was around before microservices and has kind of gotten the cold shoulder as far
    as I am concerned.


    The DDD and microservice concepts were introduced around the same time and share
    many of the same characteristics, such as single responsibility, a single code
    base, separated databases for each service, team alignment, and boundaries.


    Eric Evans'' book *Domain-Driven Design* came out in the 2003-2004 time frame,
    and soon after microservices in 2005, Peter Rodgers introduced the term *Micro-Web-Services*
    during a presentation at the *Web Services Edge* conference. As you study these
    concepts, you''ll see many similarities that these two concepts share.


    Let''s now explore the similarities between microservices'' characteristics and
    DDD and how they align. First up, we will look at autonomous microservices and
    DDD''s bounded contexts. We will also look at other microservices and DDD characteristics
    and compare them.


    # Autonomous


    Microservices are small single-responsibility applications that are loosely coupled
    with one another. A single team of developers can build, test, deploy, and maintain
    a single small microservice. Each microservice owns a separate code base that
    a small team of developers can manage. This concept is described in *Domain-Driven
    Design* when the book addresses characteristics of a bounded context, which has
    its own code base and is aligned with a single team of developers.


    # Independently deployable


    Microservices can be deployed independently. This frees up a team to update a
    microservice without rebuilding and redeploying the entire application. DDD supports
    this concept as well, as each domain and supporting domains generally all have
    their own code base and adhere to the SOLID design''s **single-responsibility
    principle (SRP)**. So, when something in one service changes, we should not have
    to deploy other services at the same time due to that change in another microservice.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# ## Data ownership


    Microservices are responsible for persisting the state of their data, and they
    are also responsible for communicating with other services so that the other service
    can update the state of its data. This is a change from the traditional single
    database model, where a separate data layer handles the saving of data. DDD uses
    aggregates as a concept of transactional boundaries to help use design or data
    concurrency and consistency. Aggregates should enforce business invariants.


    # ## Communication


    Microservices communicate with each other by using an interface over **HyperText
    Transfer Protocol (HTTP)**, using things such as **Google remote procedure call
    (gRPC)** or **REpresentational State Transfer application programming interfaces
    (RESTful APIs)**, or via a messaging service. The internal implementation details
    of each service are encapsulated or hidden from other services. DDD not only addresses
    service-to-service communication but also communication between teams. It gives
    clear guidance on how teams interact and integrate with each other. DDD provides
    strategies for successful communication patterns to assist in building effective
    microservices that serve the greater good or achieve a common goal of the system.
    As for service-to-service communication and translation between services, we use
    a concept from DDD called an open host, which is responsible for the translation
    of one model to another, like an adapter pattern. In reality, an open host is
    nothing more than a RESTful web API. As opposed to a RESTful API and making direct
    services to services calls, I would highly recommend avoiding direct synchronous
    calls when possible and implement asynchronous messaging services or queues to
    decouple services from each other. There are use cases where you may need to make
    direct calls from one microservice to another microservice, but this should be
    avoided if possible. These direct calls can become an anti-pattern if you rely
    too heavily on direct service-to-service synchronous calls. This can lead to tightly
    coupled microservices with direct service-to-service interdependencies, sometimes
    referred to as distributed monoliths.


    # ## Technology-agnostic


    Microservices don''t need to be built using the same technology stack, libraries,
    or frameworks. You are free to write your services in any language that you like.
    DDD isn''t concerned with what technology or language you use. In Eric Evans''
    book, he used **object-oriented programming (OOP)**, and since then, we have witnessed
    successful implementation using different program paradigms (such as functional
    programming) that have delivered valuable solutions using the DDD concept.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# # Gateway pattern service discovery


    An API gateway is the entry point for clients. Instead of calling services directly,
    clients make calls to the gateway, which intelligently routes the call to the
    appropriate backing services.


    Advantages of using an API gateway include the following:


    +   - It decouples the client from backing services. This allows services to be
    versioned and refactored without needing to update other services or clients.

    +   - Services can use messaging protocols such as the **Advanced Messaging Queuing
    Protocol (AMQP)** for queues or **publish-subscribe (pub-sub)** scenarios.

    +   - An API gateway such as NGINX that operates on **Layer 7 (L7)** can perform
    other cross-cutting concerns such as authentication caching, logging, **Secure
    Sockets Layer (SSL)** termination, and load balancing.


    Many of the benefits of microservices are the same in DDD. Let''s examine a few
    of them to compare the similarities.


    # # Benefits and challenges of microservices as compared to DDD


    There are various benefits offered by microservices in comparison to DDD. Let''s
    have a look at them, as follows:


    +   - **Highly agile:** Due to the fact that microservices are deployed independently,
    this makes managing fixing bugs and adding features much easier. You make changes
    to a microservice without redeploying the entire application, or if something
    goes wrong, we can roll back an update to a previous version during a deployment.
    In monolithic applications'' deployments, if a bug is discovered during deployment,
    it can block the entire release, requiring the rolling back of the release. This
    can cause a delay in the deployment of new features. This trait of microservices
    being independently deployable is shared with DDD rules around how a bounded context
    is deployed, and they have their own code base. So, you can clearly see that by
    understanding DDD, you understand how microservices should be built and deployed.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '+   - **Small teams**: Small teams that are focused on one or multiple microservices.

    +   A microservice should be aligned with a small team that can build, test, and
    deploy the microservice. A smaller team size promotes greater agility. Large teams
    tend to be less productive and harder to manage because communication is slowed
    down, management overhead goes up, and agility diminishes. These same principles
    apply to a domain-driven bounded context as small teams are aligned to a bounded
    context. As we examine more about microservices, we start to see the one-to-one
    mapping of the same principles between microservices and DDD. In most cases, teams
    don’t just manage and control one microservice or bounded context but are responsible
    for and have ownership of multiple microservices, which share a common agenda
    or business feature.

    +   - **Small code base**: In a monolithic application, it is very common over
    time for code-base dependencies to become a tangled web or a big ball of mud.
    Adding a new feature or making changes becomes risky and requires changing code
    in a lot of different places throughout the code. We should not share a code base
    or data store; a microservices architecture minimizes dependencies, and that makes
    it easier to add new features. DDD calls for each bounded context to have its
    own code base and be aligned to a single team.

    +   - **Mix of technologies**: Development teams can pick whichever technology
    or programing language best fits their service or their skill set, using a mix
    of technology stacks as appropriate. This concept is shared with DDD, as each
    bounded context can use whichever technology or programming language you want.

    +   - **Data isolation**: It is much easier to manage schema updates because only
    a single microservice is affected by any changes. In a monolithic application,
    updates or changes to the scheme can become very risky and challenging because
    different parts of the application may all use the same data or scheme, making
    any alterations to the schema risky. DDD shares this trait, as well as each bounded
    context, has its own data, and it is responsible for it.

    +   - **Complexity**: A microservices application is complex when compared with
    an equivalent monolithic application. Each service has a single responsibility,
    but the entire system as a whole is much more complex when implementing a solution
    with microservices. We need to use DDD to help gain deep domain knowledge to distill
    this complexity down into a model that we can use to build our microservices.

    +   - **Skill set**: DDD and microservices require a higher level of skills, so
    you should carefully evaluate whether the team has the skill, experience, and
    motivation to be successful.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'We have considered some of the benefits and challenges we face with microservices,
    and even discussed how some of those challenges and benefits revolve around teams
    (things such as the code base and skill sets), but let''s really hammer home the
    importance of team alignment, or a lack thereof.


    # Lack of team alignment


    A general rule of microservices is that one team must be aligned or made responsible
    for a microservice. Ideally, this will be one team per service, but this is not
    always possible due to limited resources. However, a team can have responsibilities
    for multiple services, which is common. One team may be responsible for multiple
    services, but a service should never have multiple teams working on it. One team
    must have responsibility for the analysis, development, and deployment of a service.


    As with most rules, there are exceptions, and there are some rare cases where
    this may not be possible and where we may need two teams to share responsibility
    for a service, and teams will have to work together and share responsibility for
    a service due to organizational or other constraints. DDD calls this a shared
    kernel, and this requires a high level of communication between the teams sharing
    the service. We will explore shared kernels in depth later on in the DDD section
    of this chapter.


    However, having one team per service keeps teams less dependent on each other
    and allows them to develop and deploy services at their own pace without relying
    on other teams. We also avoid other teams having merge conflicts and integration
    issues. Aligning a single team to a code base relieves many of the issues around
    testing, development, and deployment.


    Now we have examined the benefits and challenges and how teams are aligned to
    autonomous services, we also need to look at how microservices must work together
    to form the system as a whole.


    # Lack of governance


    Governance of standards is an important part of any organization. DDD provides
    a framework for governance—for example, prescribing OOP and clean architecture
    drawing on good SOLID design principles such as single responsibility to dependency
    inversion of control (IoC) are just a few we could name. Governance is all about
    standards, rules, and guidelines around code quality and architecture. Having
    solid standards is important but they should not be so constraining that they
    inhibit innovation, instead having clear standards that will help avoid issues
    that occur when there are no clear standards.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Governance can be something simple, such as naming conventions, to something
    complex, such as architecture patterns or limits on resources. So, while we implement
    coding standards, they should be aligned across the organization and on individual
    teams to allow flexibility but they should also provide clear communication on
    what is acceptable and what is not. This can be simple, such as how you name things,
    to which architecture should be used for a particular context, and context is
    important when it comes to governance. A rule for one team will not work for another.
    So, rules and guidelines should be aligned with the context and scope; for example,
    one microservice may have different governance than another service. That being
