- pgno: 226
  md: 'Azure Application Insights is one of the prevalent services in Azure that allows
    easy integration and extended monitoring capabilities. Either utilizing the ready-made
    framework or a service that allows a quick adoption and implementation of logging
    into your services is what addresses the attributes of the microservices chassis
    pattern.


    # Logs, metrics, and traces


    For monitoring microservices logs, metrics and traces are the core elements. Each
    plays an important role when it comes to application monitoring. Let''s explore
    each of them:


    +   - **Logs:** Every application is required to log information that can be used
    to watch how an application behaves or to troubleshoot errors. Logs should be
    captured with severity levels that allow developers or administrators to easily
    filter and take appropriate action when needed. With logs, you can keep as much
    information as possible and assign some parameters, such as a unique number or
    date-time information.

    +   - **Metrics:** Metrics include aggregated results, and usually contain a name,
    timestamp, and a field to represent a metric value. Metrics are used to gauge
    the health of the application and whether it is running or stopped, but, in order
    to get detailed information, you need to access logs.

    +   - **Traces:** Traces contain information about specific application operations.
    Traces provide complete visibility of the health of an application. Traces provide
    less information on the infrastructure or the environment where your application
    is running, and for that, you need to check the metrics.


    # Implementing centralized monitoring


    When implementing monitoring for a microservices-based application, it is better
    to implement it as a centralized monitoring mechanism. Keeping the monitoring
    separate from each service increases agility in finding the issues, and also gives
    each team the autonomy to use whatever technology they can for monitoring purposes.
    Therefore, centralized monitoring reduces the need for understanding different
    monitoring technologies implemented by different services, and also helps to filter
    out the information swiftly to solve a problem.


    Centralized monitoring helps teams to log everything in one central place and
    it also helps to identify the issues quickly and easily. Consider a scenario where
    a customer wanted to purchase an item through a shopping cart system. When a customer
    checkouts the items in the cart, it first proceeds to the payment gateway through
    the payment service, which also saves the payment information. Once the payment
    is processed, the order is generated, and the notification will be sent.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Now, in this scenario, there are four services involved, namely Cart Service,
    Payment Service, Order Service, and Notification Service. If you notice that a
    single transaction is spanning over four services, and if any of the transactions
    fail, you need to look up the logs to investigate or identify the issue. If the
    logs are maintained separately, this would be very difficult and time-consuming.
    However, with centralized logging, the user can easily query the monitoring platform
    to find the issue and get a complete understanding of when the request was raised
    and where it failed.


    Azure Application Insights is one of the most widely used resources in the industry
    for monitoring applications. It sends telemetry from the application to the portal
    that can be analyzed to determine the performance and usage of the application.
    The Azure Application Insights telemetry model is standardized, making it easy
    to implement monitoring that is platform and language-agnostic. The following
    figure depicts the scenario of a shopping cart system that is using Azure Application
    Insights as a centralized monitoring platform:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_227_0.png)


    Figure 7.11 – Azure Application Insights for centralized monitoring'
  merge: -1
