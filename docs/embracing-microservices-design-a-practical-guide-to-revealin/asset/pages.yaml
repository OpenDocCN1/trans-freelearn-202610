- pgno: 160
  md: '# # The solution


    CQRS helps us solve the problem that we face with one model by separating reads
    and writes into two different models using commands to update the data and queries
    to read data. This separation gives us a far cleaner way of retrieving data so
    that we can optimize our queries for better performance and keep business logic
    out of our queries.


    The command should be tasked based on business logic and invariants rather than
    being data-centric. Additionally, the command should flow one-way, which is also
    known as unidirectional, as demonstrated in *Figure 5.6*. The command never returns
    anything to the caller, which facilitates this one-way flow. Commands can be placed
    in a queue and processed asynchronously rather than synchronously. Queries never
    modify the database; they return a DTO and do not concern themselves with domain
    knowledge. The models can be isolated, as depicted in *Figure 5.6*, where you
    can view a model for writes and a model for reads in the database and the direction
    of the flow for each responsibility:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_160_0.png)


    Figure 5.6 – Commands and queries have separate models


    As we have gathered, in *Figure 5.7*, the one-way unidirectional approach is where
    we have a one-way request for the mutation of the data:'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_161_0.png)


    Figure 5.7 – Commands flow in one direction and mutate data


    This makes commands much cleaner, and we can focus on business logic. Besides,
    we can place commands in some messaging frameworks such as Azure Service Bus,
    Kafka, or RabbitMQ and handle those commands asynchronously.


    # Challenges when implementing the CQRS pattern in our microservices


    One of the challenges we face when implementing a pattern such as CQRS is **complexity**;
    for instance, when we implement event sourcing. Although the basic concept of
    CQRS is simple, it can lead to a more complex design; for example, the two-database
    approach and, as mentioned before, event sourcing, which has a very steep learning
    curve.


    **Messaging**, although not necessarily a part of CQRS, is common to use. Messaging
    frameworks support commands and publish and update events such as with domain
    events. Messaging can add additional complexity, as we now need to deal with message
    failure and duplication. Alternatively, in some cases, we also need to ensure
    messages are processed in a particular order.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '**Eventual consistency** refers to when we separate the read and write database.
    In this scenario, we now have the additional complexity of keeping our models
    in the correct state and ensuring that our read data does not become stale. We
    have to ensure that any changes to the write model are reflected in the read model.
    We have now explored CQRS and demonstrated how this pattern can either clean up
    or design data to help separate the responsibilities of reading and writing data.
    Additionally, we have examined how we can leave commands to mutate or update our
    data. Now, we need to understand transactions and the importance of maintaining
    the critical state of our data, and the role of transactions within this process.


    # The pitfalls of not knowing how to handle transactions


    One pitfall that teams face is not knowing how to handle transactions that are
    distributed across multiple microservices. We will explore how we can frame transactions
    within a microservice and how to handle them when they involve multiple microservices.
    We will start with a concept that we explored in *Chapter 3, Microservices Architecture
    Pitfalls*, where we discussed domain-driven design and the concept of aggregation.


    Aggregates are transactional boundaries. They form boundaries around transactions
    that enforce business rules and business invariants. These are then grouped by
    relevant entities that are part of the aggregate and its transactional boundary.
    These transactions are a single unit of work and can be made up of multiple operations
    that live in the space of that isolated transaction and produce a domain event
    that represents a state change to the aggregate and its internal entities. A command
    is an operation that performs the state change and causes the event to occur or
    be triggered. These events can notify the next step, or the system at large, of
    the success or failure of that transaction. If successful, they can trigger another
    command to be executed, and that command can trigger an event. This process will
    continue until all transactions are completed or rolled back, depending on the
    successful or failed completion of the transaction.


    Transactions have defining characteristics, and they must be **atomic, consistent,
    isolated, and durable (ACID)**. Let''s examine these characteristics as they pertain
    to microservices:


    +   - **Atomicity**: This is a unified set of operations that must be successful
    or unsuccessful.

    +   - **Consistency**: This means that the state is changed from one valid state
    to another valid state.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '+   - **Isolation:** This helps to guarantee that transactions are concurrently
    executed in order and that they produce the same state changes those previous
    transactions produced.

    +   - **Durability:** This ensures that the state changes are committed and executed
    regardless of a system failure or transient error.


    While having a single database for each microservice is desirable, it also presents
    some challenges with the transaction when we need to keep the entire system in
    a valid state. For instance, in a monolithic world, this is a much easier task.
    Because the data is distributed, this presents the challenge of how to ensure
    the consistency of the entire system. This can be achieved by providing a mechanism
    for orchestration and managing these transactions across boundaries. Saga is an
    appropriate pattern to help orchestrate and manage this transaction and conduct
    any compensating transactions if a rollback is required.


    # Not choosing the right consistency and concurrency


    As we have gathered, it is important to choose the right consistency and concurrency
    approach when handling distributed transactions.


    A distributed transaction saga pattern can be used to manage distributed transactions
    across services or boundaries and maintain consistency across these boundaries.
    A saga is made up of an ordered sequence of transactions, whether they are updates,
    deletes, or inserts. If one of these transactions fails, the saga is responsible
    for rolling back any of the changes made. This process is referred to as a compensating
    transaction, which nullifies any previous transactions to return the system to
    the correct state.


    *Figure 5.9 shows a high-level view of a saga and its encapsulated responsibilities:*


    ![](img/e6276d4d880001c04e81cb4db4898f1c_163_0.png)


    Figure 5.8 – A high-level saga'
  merge: -1
  img_proc: true
