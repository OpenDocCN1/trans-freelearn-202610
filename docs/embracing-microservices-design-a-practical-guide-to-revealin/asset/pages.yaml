- pgno: 32
  md: '# Time to market


    The microservice architecture is pluggable, so it supports being able to replace
    microservices and their components. This helps teams focus on building new microservices
    to add or replace business capabilities. Teams no longer wait for changes from
    different teams to be incorporated before releasing new business capabilities.
    Most of the cross-cutting concerns are handled separately, which helps teams in
    achieving faster time to market. These cross-cutting concerns will be covered
    in detail in *Chapter 7, Cross-Cutting Concerns.*


    # Technology diversity


    The microservice architecture allows teams to select the right tools and technologies
    to build microservices rather than locking themselves in with decisions they''ve
    made in the past. Technology diversity also helps teams with experimentation and
    innovation.


    # Increased reliability


    The microservice architecture is distributed in nature, where individual microservices
    can be deployed multiple times across the infrastructure to build redundancy.
    There are two important characteristics of the microservice architecture that
    contribute to the increased reliability of the overall system:


    +   - Isolating failures by running each microservice in its own boundaries

    +   - Tolerating failures by designing microservices to gracefully address the
    failures of other microservices


    So far, we''ve learned about the benefits of microservices. However, implementing
    microservices does bring a few challenges that need to be considered. We will
    look at these in the next section.


    # Challenges of microservices


    In this section, we will discuss the different challenges you may face as you
    embark on your microservices journey.


    # Organizational culture


    One of the major hurdles in moving to microservices is the organizational culture,
    where teams were initially built around technical capabilities rather than delivering
    business capabilities. This requires an evolving organization, restructuring teams,
    and changing legacy practices.'
  merge: -1
  img_proc: true
