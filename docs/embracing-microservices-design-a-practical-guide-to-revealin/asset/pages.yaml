- pgno: 4
  md: "# # Foreword\n\nIn the last 5 years, the microservice architecture design approach\
    \ has established itself in the software engineering industry as the primary way\
    \ to build modern, scalable, resilient services. This has been driven by the wave\
    \ of cloud adoption and a major shift toward “cloud-native” service development,\
    \ often built with microservice architectures (both stateless and stateful) that\
    \ run on the cloud and the edge and embracing the diversity of programming languages\
    \ and frameworks.\n\nIt’s not that other architectures’ design approaches, such\
    \ as client/server, are bad; they just address a different need focusing on medium-\
    \ to large-scale organizations for their scale and resilience. In the far more\
    \ competitive services world that has emerged, where delivering new features on\
    \ a regular basis is expected, and a continuous integration and delivery approach\
    \ is required, the microservices architecture has become the de facto standard\
    \ for building them. However, a microservice architecture alone was not enough\
    \ to drive this adoption without suitable distributed systems hosting platforms\
    \ to run these services on that provided the horizontal scaling, automated rollouts,\
    \ load balancing, and self-healing, such as Kubernetes, Docker Swarm, and Azure\
    \ Service Fabric. These infrastructure platforms and the newer serverless container\
    \ platforms have been instrumental in the rise of the microservice architecture\
    \ approach.\n\nThis book takes you along the journey of understanding, using,\
    \ and applying microservice design principles and patterns, consolidated into\
    \ a comprehensive set of guidance and supported by the authors’ real-world experiences.\
    \ Chapters such as *Chapter 10, Evaluating a Microservice Architecture*, enable\
    \ you to see the bigger picture of your goals, with the other chapters diving\
    \ into the best approach and pitfalls to watch out for. Although microservices\
    \ may seem daunting at first, with the need for service discovery, observability,\
    \ security, and separated state deployed across machines in a distributed manner,\
    \ there are tools, frameworks, and runtimes that have emerged to greatly simplify\
    \ the burden on developers. These include many of the Cloud Native Computing Foundation\
    \ (cncf.io) technologies, and the Distributed Application Runtime (dapr.io), covered\
    \ in *Chapter 3, Microservices Architecture Pitfalls*, which greatly ease the\
    \ burden for developers, by codifying best practices into APIs for use from any\
    \ language.\n\nI am confident that you will find this book invaluable in your\
    \ microservices design journey and use it frequently to design applications for\
    \ the modern services era of computing.\n\nMark Fussell  \nMicrosoft Partner Program\
    \ Manager  \nFounder of the **Distributed Application Runtime (Dapr)** and Azure\
    \ Service Fabric"
  merge: -1
  img_proc: true
