- pgno: 202
  md: '# Summary


    In this chapter, we learned about various communication styles that can be adapted
    to facilitate communication in a microservices architecture, their challenges,
    and potential solutions. We discussed the fundamentals of system communication
    and how different architecture styles use them for communication. Further, we
    analyzed the drawbacks of direct client-to-microservices communication and how
    we can address them by introducing an API gateway that acts as a reverse proxy.
    We also explored how using a single API gateway for large applications can create
    ambiguities and how we can address these complexities using different approaches.


    Later, we discussed availability and responsiveness as two important concepts
    and how different techniques can be used to enable resilient inter-process communication
    between microservices. Additionally, we looked at how a long chain of synchronous
    calls can lead to a retry storm that can make the overall system unavailable along
    with multiple approaches that can ensure availability and performance at different
    levels. We also discussed event-driven architecture and its challenges and how
    we can address them using different approaches. We also discussed the role of
    versioning in different aspects of microservices. Finally, we explored the evolution
    of a service mesh and how it compares to Dapr.


    With this knowledge, you can start your journey of selecting the right communication
    mechanisms to enable client-to-service and service-to-service communication using
    the approaches presented in this chapter. In the next chapter, we will discuss
    the pitfalls related to cross-cutting concerns and how they can be addressed using
    different solutions.


    # Questions


    +   1. What''s the difference between synchronous communication and asynchronous
    communication?

    +   2. What are the disadvantages of direct client-to-microservice communication?

    +   3. What is a retry storm?

    +   4. What are the different approaches to HTTP/REST API versioning?

    +   5. What is a service mesh?'
