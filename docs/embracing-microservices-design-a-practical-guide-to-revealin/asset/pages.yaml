- pgno: 210
  md: "# Not considering resiliency when building microservices\n\nDevelopers who\
    \ are building APIs for enterprise-grade applications may understand the need\
    \ for retry and circuit-breaker patterns. We have discussed these patterns in\
    \ detail in *Chapter 4, Keeping Replatforming of Brownfield Applications Trivial*.\
    \ The solution to this pitfall is by using retry and circuit breaker patterns.\n\
    \n# Using retry and circuit-breaker patterns\n\nRetry and circuit-breaker patterns\
    \ must be applied to create a robust mechanism, allowing the failing service to\
    \ respond by having several retries or opening the circuit for a short time if\
    \ the response failure frequency is high.\n\nAzure API Management provides an\
    \ out-of-the-box option to configure the retry policy. However, to use a retry\
    \ pattern in conjunction with the circuit-breaker pattern, a separate service\
    \ can be created to handle these concerns.\n\nWhen the request comes to the API\
    \ gateway, it will be routed first to the retry service and then to the backend\
    \ service. If the backend service is failing, the retry service makes multiple\
    \ attempts to get the response or open the circuit for a limited timeframe.\n\n\
    As a side note, there are various sidecars that provide a feature of retry pattern.\
    \ Some of the names are envoy, istio and dapr.\n\n# Not considering idempotency\
    \ when building microservices\n\nIn microservices, the system is decomposed into\
    \ several services, listening over HTTP endpoints. Today, **RESTful** services\
    \ are an industry standard for building APIs. Since RESTful services rely on the\
    \ underlying HTTP protocol, they use various HTTP verbs for different operations.\
    \ For example, the HTTP GET method is used to retrieve the data, the HTTP POST\
    \ method is used to write, HTTP PUT for update, and HTTP DELETE for deletion.\
    \ Since the HTTP POST method writes data on a server, it is not safe. If the same\
    \ operation is executed twice, multiple entries will be created on the server.\
    \ To protect services from these issues, idempotency is an important factor to\
    \ consider.\n\n> **Note**\n> \n> Binary protocols such as **gRPC** and **thrift**\
    \ are fast overtaking REST as the preferred way to build new services."
  merge: -1
  img_proc: true
