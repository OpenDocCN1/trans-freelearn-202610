- pgno: 81
  md: '# Open host


    An open host, as shown in the following diagram, sits in the service layer on
    the edge and provides translation for multiple endpoints of an external bounding
    context to protect the internal model from being corrupted. An open host helps
    when we have many services that need translating and maintenance becomes complex.
    We can implement an open host with endpoints for each translation:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_81_0.png)


    Figure 2.9 – An open host sits on the edge of a service


    Microservices expose RESTful APIs to implement an open host, as demonstrated in
    *Figure 2.9*. These APIs have endpoints that provide access to internals and translations
    from one model to another.


    # Aggregates


    In DDD, an aggregate can be a confusing concept. One way of looking at it is to
    think of an aggregate representing a domain concept such as an invoice or an order.
    Aggregates are a transactional boundary and enforce business invariants by grouping
    entities related to business rules and invariants together in one transaction.


    For example, if an order is shipped before payment is received, then we have broken
    the invariant or business rule as it makes sense that payment must be received
    before orders are shipped. In the previous example, we have placed payment in
    the wrong order and the application is now in a corrupted state as the business
    invariant is broken.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Transactional boundary


    Guaranteeing the consistency of changes to objects across complex business associations
    can be challenging, to say the least, as we need to enforce business invariants.
    If our aggregates include common objects such as an address that other aggregates
    can reference and have different business rules around, these common objects can
    create contention, leading to locking issues, as aggregates can try to update
    the same object at the same time. These locking issues negatively impact performance
    or even lead to crashes of an application. By balanced grouping of our objects
    based on avoiding high contention and tightening of strict invariants, we can
    avoid issues with locks and give common objects their own aggregate transaction
    boundary, which will make a common object responsible for updating itself and
    its internal objects, as demonstrated in the following diagram:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_82_0.png)


    Figure 2.10 – Changes are made through the root


    To turn a conceptual aggregate into implementation, we need to follow some important
    rules for all transactions.


    Each aggregate has a root entity that has a global identity, and it also has internal
    objects that have an internal identity and can only be traversed through the root.
    No external entity can have a direct reference to an internal member of an aggregate.


    All changes to the state of an aggregate and its members are done through the
    root. If external aggregates need an internal object from another aggregate, they
    can request a copy from the root of that aggregate. Internal members of an aggregate
    can have a reference to an external aggregate root using a global identity.


    Only the root aggregate can be obtained by directly querying the database. All
    other objects must be found by the traversal of the association of the root aggregate.


    If a delete operation is executed, it must at once remove everything within the
    aggregate boundary. When the state or change of an object within the aggregate
    boundary is committed, all invariants of the whole aggregate must be satisfied.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Transactions that change state are hard enough to manage, but when we try to
    update state and satisfy some request-response design, this can make life much
    harder than necessary. Let''s discuss this by discussing how data flows by direction.


    # Bidirectional communication between services creates complexity.


    Bidirectional communication by using a request-response model can tightly couple
    services and increase complexity, as demonstrated in the following screenshot:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_83_0.png)


    Figure 2.11 – Bidirectional communication


    This can often occur when teams align aggregates to **user interface (UI)** concerns,
    which is a common mistake. Aggregates should align with the business rules and
    domain invariants, as we have discussed previously, so avoid the trap of looking
    at the world through the eyes of the UI. To simplify this, move to a one-way direction
    and separate the responsibilities of command and query or request and response.
    There are situations where this is unavoidable—in the case of a request to return
    a response, the response may be needed to proceed, as in the case where a UI layer
    needs the catalog of all available items in order for a customer to select an
    item to purchase. In the case of placing an order, this will turn into a command
    and should be a one-way command to create an order with the selected items, persist
    the order, and raise an event to signify that an order was created so that other
    services can execute their role in the workflow.'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'Unidirectional design is a better choice, as we first need to ensure we have
    enforced our business invariants and that domain objects are in the correct state.
    This can be achieved by employing the **Command and Query Responsibility Segregation
    (CQRS)** principle. Commands are a one-way concept, as illustrated in the following
    diagram:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_84_0.png)


    Figure 2.12 – Command query separation


    Then, group your aggregates based on the following:


    +   - Business invariants

    +   - Language

    +   - Association and logic grouping supporting the business rules'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'As shown in the following diagram, we group aggregates and their internal entities
    based on their transactional boundaries, which enforces the business invariant
    or business rules:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_85_0.png)


    Figure 2.13 – Transaction boundaries grouped by association


    # Aligned teams


    As we have learned some important guidelines around building microservices, one
    important aspect to consider is the people who make up the team that will build
    microservices. Some important things to consider are listed here:


    +   - Skill set

    +   - Motivation

    +   - Resources

    +   - Culture'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'As we have learned, microservices and DDD both state that teams are aligned
    to a service or a bounded context, which can represent a microservice or a collection
    of microservices within their respective boundary. Those teams are responsible
    for developing, testing, integrating, and deploying those microservices in an
    agile and autonomous way. This means they do not depend on other teams to deploy
    their service, as they own a separate code base that can be independently pushed
    and deployed to production. We need highly motivated people to build complex microservices,
    as the challenges can be considerable and have a steep learning curve. We need
    to have the time and resources required to build complex services and that also
    means people, who are the most valuable resource of all. We will want to put our
    most talented and skilled people on the teams that need to build complex services.
    We cannot understate the importance of an entire organization embracing a team
    model-building approach and buying in and supporting this kind of approach. The
    culture of an organization must evolve to realize the importance of the entire
    team of business domain experts combined with the deployment team, working closely
    together during the entire development life cycle.


    # Iterative process


    Short feedback loops will allow for the experimentation and exploration of a domain
    by deeply involving business domain experts in our agile ceremonies and constantly
    keeping the domain model in line with the code model. We must leverage UL to remove
    ambiguity by working closely with business experts. We can evolve our microservices
    to meet great business goals by gaining deep domain knowledge through our shared
    language.


    Continuous evolution of a model occurs as we knowledge crunch and gain deeper
    domain knowledge. This allows an application to improve and emerge from the knowledge
    we have obtained. We do this by using an agile process that employs short feedback
    loops, as opposed to heavy upfront analysis and design, as in a waterfall approach.


    We start with a **minimum viable product (MVP)** and iterate on the model. As
    we gain domain knowledge, the evolution of the model into a well-designed service
    is realized. Design is still a part of the process—it is just done in smaller
    chunks and in more effective agile ways.'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'By understanding DDD''s role in building microservices, we are better equipped
    to build the correct microservices and commit the correct amount of effort and
    resources in building the services. We now understand that not all microservices
    are equal and that they have different levels of complexity. We also now understand
    that microservices and the teams that build them need to integrate and communicate
    with each other, and DDD gives us the tools to help small teams build, test, and
    deploy microservices. We have learned the importance of boundaries and how DDD
    bounded contexts and aggregates help identity those boundaries. In my opinion,
    an anti-pattern of microservices is not understanding DDD, not only its tactical
    patterns but also its analytical model-driven strategic patterns and the power
    of UL.


    # Summary


    We started the chapter with an overview of what microservices are and how they
    pertain to DDD for you to understand their relationship. We also looked at the
    benefits and challenges of microservices as compared to DDD.


    Later, we learned how DDD relates to the characteristics of microservices and
    that teams need to be aligned to a service, ideally a one-to-one team alignment
    to a microservice. Each service should have its own code base managed by one team.
    We learned that we need to take a holistic view of our microservices architecture.
    We also discussed the Cynefin framework to determine the type of problem we are
    trying to solve, in order to understand the amount of effort and resources required
    to build our microservices.


    We talked about how each boundary is based on a logical grouping of aggregates
    that are transaction boundaries and enforce invariants of the domain. We learned
    that we may not get this right first time and, as our knowledge of the domain
    deepens, the boundaries can ebb and flow over time. Lastly, we learned about how
    microservices communicate and integrate with each other, and also about how teams
    communicate and integrate.


    With this, you are now aware of the importance of understanding DDD to build cohesive
    services with bounded contexts, as well as the importance of team building, governance,
    and awareness of stakeholders.'
  merge: -1
  img_proc: true
