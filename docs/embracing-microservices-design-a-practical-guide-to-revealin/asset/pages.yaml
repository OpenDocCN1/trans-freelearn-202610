- pgno: 48
  md: '# ## Port binding


    Traditionally, web applications are deployed inside web servers such as IIS, Tomcat,
    and httpd to expose functionality to end users. A twelve-factor web app is a self-contained
    application that doesn''t rely on running instances of a web server. The app should
    include web server libraries as dependencies that are packaged as build artifacts
    for deployment. The twelve-factor web app exposes HTTP as a service binding on
    a port for consumption. The port should be provided by the environment to the
    application. This is true for any server that hosts applications and any protocol
    that supports port binding. Port binding enables different apps to collaborate
    by referring to each other with URLs.


    # ## Concurrency


    The loosely coupled, self-contained, and share-nothing characteristics of the
    twelve-factor app methodology allow it to scale horizontally. Horizontal scaling
    enables adding more servers and spawning more processes with less effort to achieve
    scalability at ease. The microservice architecture promotes building small single-purpose
    and diversified services, which provides the flexibility required to scale these
    services to achieve better density and scalability. There are various managed
    services available on Azure that provide you with a better capability for configuring
    auto-scaling based on various metrics. The following diagram demonstrates the
    scalability patterns of different microservices:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_48_0.png)


    Figure 1.8 – Scalability of different microservices'
  merge: -1
  img_proc: true
- pgno: 49
  md: "At a given instance, a different number of microservice instances are running\
    \ to meet the user's need. The orchestration platform is responsible for scaling\
    \ these microservices to support different consumption patterns, which helps with\
    \ running microservices in an optimized environment.\n\n# Disposability\n\nThe\
    \ twelve-factor app methodology should have a quick startup, a graceful shutdown,\
    \ and be resilient to failure. Having a quick startup time helps with spawning\
    \ new processes quickly to address spikes in demand. It also helps with moving\
    \ processes across hosts and replacing failed processes with new ones. A graceful\
    \ shutdown should be implemented with SIGTERM to allow a process to stop listening\
    \ to new requests and release any resources before exit. In the case of long-running\
    \ processes, it's important to make sure that operations are idempotent and can\
    \ be placed back on the queue for processing. Failures are bound to happen; what's\
    \ important is how you react to those failures. Both graceful shutdowns and quick\
    \ startups are important aspects of achieving resilience.\n\n# Dev/prod parity\n\
    \n> \"But it works on my machine.\"\n> \n> — Every developer\n\nThe twelve-factor\
    \ app methodology advocates having parity between development, production, and\
    \ any environment in-between. Dev/prod parity aligns with the shift-left strategy,\
    \ where issues are identified at an earlier stage to allow more time to resolve\
    \ them with the least impact. It also helps with debugging and reproducing issues\
    \ in the development and staging environments. A common practice is to use different\
    \ database versions in development and production environments; this is a violation.\
    \ In a containerized environment, make sure that you are using the same container\
    \ image across environments to maintain parity. It's important to have the capability\
    \ to recreate the production environment with the least amount of effort to achieve\
    \ parity, reproducibility, and disposability. DevOps practices are crucial for\
    \ achieving dev/prod parity, where the dev and ops teams work together to release\
    \ features with continuous deployment. They use the same set of tools in all environments\
    \ to observe their behavior to find issues."
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Logs


    The twelve-factor app methodology treats logs as event streams. It never concerns
    itself with how these events are routed, processed, or stored. In a traditional
    monolithic application, logging libraries are used to allow applications to produce
    log files. Cloud-native development differs from traditional development, where
    the application is built as a microservice. A single request may be processed
    by multiple microservices before it can produce a meaningful result. Monitoring
    and tracking the collaboration is important to provide observability of the overall
    system. The distributed nature of the system makes logging a daunting task that
    should be handled in a unified manner to support consistency and scalability.
    The twelve-factor app (microservice) doesn’t contain a logging library as its
    dependency; instead, it uses a logging agent as a separate process to stream logs.
    For example, these events can be sent to Azure Event Hub for long-term archival
    and automation, or Application Insights for monitoring or raising alerts.


    # Admin processes


    Design admin/management processes with the same rigor that you use to develop
    and run any other application. It should run in the same environment alongside
    other processes while following the same practices discussed earlier as part of
    the twelve-factor app methodology. Admin processes should be maintained inside
    the code base, with the config released to environments using the build, release,
    and run practice. Database migration, running ad hoc scripts, and purging data
    are all examples of admin processes.


    The twelve-factor app is one of the most widely adopted methodologies for building
    cloud-native applications, and it aims to help architects and developers follow
    the procedures that are aligned with best practices and standards, especially
    while building microservices. In the next section, we will explore a few additional
    factors that are essential for building cloud-native applications.


    # Additional factors for modern cloud-native apps


    In Beyond the Twelve-Factor App, Kevin Hoffman discussed three additional factors
    that are important for building cloud-native applications in the modern era. Let’s
    take a look.


    # API first


    In the API first approach, applications are designed with the intent to be consistent
    and reusable. The API description language helps in providing a contract that
    dictates the behavior of an API. For example, Swagger provides the tooling for
    developing APIs with the OpenAPI specification.'
  merge: -1
