- pgno: 23
  md: '# Setting Up Your

    Mindset for

    a Microservices

    Endeavor


    Microservices is an architectural style that structures an application into multiple
    services that encapsulate business capabilities. These microservices are usually
    much smaller, both in terms of scope and functionality, compared to traditional
    services. They have logical and physical separation, and they communicate with
    each other via messages over a network to form an application.


    Adopting the microservice architecture is a journey that requires a mindset that
    can embrace changes in culture, processes, and practices. In essence, organizations
    need to go through several changes to increase agility and adaptability to achieve
    their goals and deliver business value.'
  merge: -1
  img_proc: true
