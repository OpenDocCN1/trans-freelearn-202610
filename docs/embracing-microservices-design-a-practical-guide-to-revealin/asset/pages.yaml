- pgno: 165
  md: 'The benefits of choreography are as follows:


    +   - It is excellent for simple workflows that only require a few services and
    do not need complex coordination rules or logic.

    +   - It doesn''t require supporting services for implementation or maintenance.

    +   - It doesn''t have a single point of failure as the services are required
    to perform rollbacks and complete the transactions based on the messages they
    receive.


    The challenges with choreography are as follows:


    +   - When additional steps are required, the workflow can become muddled and
    confusing.

    +   - Cyclic dependency can crop up between services due to the fact that they
    consume each other''s commands.

    +   - The testing of integration can become difficult due to the need for all
    services to be running in order to properly test.


    # The orchestration implementation of a saga


    Orchestration employs a centralized control model that tells the services what
    transaction to execute based on a specific event. Orchestrators are durable as
    they store each request step''s input and output, and then determine the state
    of each task and whether it was successful or not. Then, it handles any failures,
    retries, and recovery operations. The orchestrator manager is responsible for
    compensating transactions and ensuring a successful rollback is conducted if required.
    Complex coordination logic is maintained in one place and services are decoupled,
    as the only communication is through the process manager. The process manager
    is the orchestrator and acts like a state machine—maintaining and updating state
    on services in the workflow throughout the lifetime of the transaction.'
  merge: -1
  img_proc: true
