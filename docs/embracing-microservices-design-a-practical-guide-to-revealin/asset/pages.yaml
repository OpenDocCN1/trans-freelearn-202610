- pgno: 167
  md: '# Knowing how to perform reporting


    Reporting is important to the business; to be able to analyze and monitor business
    outcomes, we must have a good reporting strategy. In most cases, reporting with
    monolithic applications and databases is a straightforward process. All we do
    is write stored procedures with complex joins and aggregates on the data to create
    views of the data. This is not possible in a distributed world; we do not have
    access to joins as the data is physically separated. So, how do we carry out these
    complex joins in a distributed microservice architecture? Well, the answer to
    that question is that we carry out the joins on the application layer in memory,
    not on the data layer. These joins are conducted in a reporting service using
    an API composition pattern.


    # The API composition pattern


    A composition pattern calls each of the respective query services of each microservice
    that queries the database. Then, the API Composer service executes the joins on
    the data in memory from the disturbed services, combining all of the data inside
    the appropriate view for reporting purposes. CQRS makes this easier, as we have
    already created a query service that is responsible for querying a materialized
    view of the data in that service''s read model or read database. Then, the API
    Composition services call our query stack within the CQRS service and combine
    all of the data from the distributed services, as demonstrated in Figure 5.11.
    The major disadvantage of this approach is that when you are dealing with large
    datasets, performance can take a hit. Some of this can be alleviated by creating
    a reporting database to persist the results of the queries in the reporting database
    and then conduct joins there:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_167_0.png)


    Figure 5.11 – An API Composer pattern'
  merge: -1
  img_proc: true
- pgno: 168
  md: 'The preceding diagram illustrates the API Composer implementation, where an
    API Composer sends queries to the owning microservice of the data that is needed.
    Then, it combines the data received from those queries together in memory to provide
    that data to a ViewModel or for a report.


    # Summary


    We have explored some important pitfalls that can hinder your microservice''s
    data development. These include the pitfall of keeping a single shared database,
    where we learned that we should separate the data from a monolithic database and
    place it in each microservice on a separate database. The responsibility for the
    copying of the data will be on the owning microservice. We discussed some strategies
    to break the data out of a monolithic database via a code-first approach. This
    is done by developing a model in code first and writing a unit test to prove our
    assertions. Then, we move the data out of the legacy monolithic database. We also
    discussed the database-first strategy, which can be more complex and present a
    higher risk.


    Additionally, we examined the pitfall of normalizing read models. Here, we learned
    that we don''t always have to normalize the read model as we do in document databases.
    Document databases provide high-performance querying partly due to the embedding
    of children objects inside the parent object. This allows us to back the data
    we need with a key-value lookup without the need for complex joins such as in
    a relational database. These objects are made up of JSON documents that are stored
    directly inside the document database.


    We examined the pitfall of not knowing how to handle transactions. We learned
    that we need to understand the boundaries around our transactions using the concept
    of aggregates. This is achieved by identifying the entities that make up a transaction
    that supports business rules and invariants. We learned about the autonomy of
    a transaction. We examined how to execute atomic transactions across a distributed
    architecture using our next pitfall, which discusses sagas. We explored the pitfall
    of not choosing the correct consistency and concurrency in the context of microservice
    architecture. Its distributed nature can create havoc with our data concurrency
    and consistency. The data involved in a transaction can span across the entire
    application that the microservices make up. We discussed how we can use a managing
    mechanism such as a saga to execute those distributed transactions and ensure
    all services involved in the transaction are completed successfully and that the
    data of each service is in the correct state. If the transaction fails, then the
    saga will execute compensating operations to roll the data back to the previous
    state.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Finally, we explored the pitfall of not knowing how to perform reporting by
    implementing an API that is responsible for building complex reports for business
    analysis. This API is called a Composer API, and it combines the data from separate
    services into a report model and joins the data together in memory.


    Now, we can move on to consider our data design and examine some tools in which
    to address the challenges we will face on our journey to a microservice architecture.


    In the next chapter, we will discuss communication pitfalls and prevention. In
    particular, we will explore communication between microservices across process
    boundaries.


    # Questions


    +   1. Transactions must be atomic. Is this true or false?

    +   2. Polyglot persistence uses one data store to service your data needs. Is
    this true or false?

    +   3. What are the different types of CQRS?'
