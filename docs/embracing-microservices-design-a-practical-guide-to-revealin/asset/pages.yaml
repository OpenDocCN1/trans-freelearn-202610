- pgno: 192
  md: 'Versioning is an important concept that helps us to identify compatibility
    issues between different components of the system. Avoiding service versioning
    is a common pitfall that should be addressed early in the development life cycle.
    In the next section, we will explore semantic versioning and how it works with
    microservices.


    # Semantic versioning


    A popular approach to address the challenge of service versioning is through semantic
    versioning. With semantic versioning, you specify a version of a service as Major.Minor.Patch.
    Here, the major number is incremented when you make an incompatible API change,
    while the minor number is incremented when you add functionality that is backward
    compatible. Additionally, the patch number is incremented for bug fixes and small
    fixes. In an SOA or microservices world, incompatible changes should be avoided
    because of the sheer cost of such a rollout. Teams should avoid such changes even
    if it means writing extra code. The following diagram depicts the life cycle of
    a software component and how different versions are created:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_192_0.png)


    Figure 6.10 – Semantic versioning'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'In the preceding diagram, a package has been released multiple times with major,
    minor, and patch updates. Initially, the v1.0 version is released along with two
    patches (v1.0.1 and v1.0.2). Then, a minor update is released with v1.1. Both
    the patch update and the minor update are non-breaking changes, thus no changes
    are required for clients. After a while, a major update has been made to the package,
    resulting in the release of a new major version, that is, v2.0.


    In the next diagram, we will discuss how semantic versioning works with microservices.
    Microservices are meant to be independently deployable, and it is necessary to
    allow multiple versions of a microservice with different contracts to run simultaneously.
    If we don''t use semantic versioning, we will get into a trap of lock-step deployment.
    The following diagram shows how different microservices will continue to operate
    without any disruption, even when breaking changes are deployed:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_193_0.png)


    Figure 6.11 – Semantic versioning with microservices'
  merge: -1
  img_proc: true
- pgno: 194
  md: "In the preceding diagram, we have introduced semantic versioning to address\
    \ the challenges of lock-step deployment and how different versions of a microservice\
    \ can run simultaneously without affecting its clients. Hence, clients can update\
    \ themselves without causing any disruption or change in deployment cadence. The\
    \ following is a detailed explanation of the process:\n\n+   1. A new version\
    \ (v2.1) of Microservice C is deployed with minor changes, which doesn't require\
    \ any client updates. In this case, both microservice A and Microservice B will\
    \ continue to work without requiring any changes.\n+   \n+   2. A breaking change\
    \ is introduced in Microservice C, changing its version from v2.1 to v3. In this\
    \ case, we will have a new version of Microservice C running side by side to allow\
    \ Microservice A and Microservice B to revise their communication channel with\
    \ Microservice C.\n+   \n+   3. Microservice B has updated its version to adapt\
    \ to the new version of Microservice C, while Microservice A continues to work\
    \ with the older version of Microservice C. Both Microservice A and Microservice\
    \ B can continue to work and service their clients without any disruption.\n+\
    \   \n+   4. After some time, Microservice A has also updated its version to v3,\
    \ and now we can delete the older version of Microservice C.\n\nAs a good practice,\
    \ try to avoid breaking changes. For example, avoid removing attributes from service\
    \ interfaces. Adding a new attribute is a non-breaking change. That said, the\
    \ service will need to add the necessary logic to add default values for the new\
    \ attributes if not provided by the older versions of the API.\n\n# HTTP/REST\
    \ API versioning approaches\n\nFundamentally, there are two major reasons why\
    \ we need to update the version of our API:\n\n+   - Format versioning is defined\
    \ as a way of manipulating the same underlying resource with different versions\
    \ of the API.\n+   \n+   - Entity versioning is introduced when the underlying\
    \ resource structure is changed.\n\nThere are different ways in which to version\
    \ your REST APIs. We will explore them in the following subsections."
  merge: -1
  img_proc: true
- pgno: 195
  md: '# URI path versioning


    With URI path versioning, you can specify the version of an API as part of the
    URI. However, it violates the principle that one URI should only refer to one
    resource. When URI path versioning is used with the static binding of a resource,
    it breaks client integration after every new version release. In the following
    snippet, the version (v2) is specified as part of the URI:


    ```

    ```text

    http://api.hrdept.com/v2/employee

    ```

    ```


    # Query parameter versioning


    With query parameter versioning, a query parameter is used to specify the version
    of the API. Now, every URI represents one resource, and the selection of the right
    version of the resource can be handled by a single resource handler. In the following
    snippet, the version (v=1.5) is specified as a query parameter:


    ```

    ```text

    http://api.netflix.com/catalog/titles/series/123?v=1.5

    ```

    ```


    # Content-type versioning


    The content negotiation versioning technique emphasizes to clients the need to
    specify the correct version of the API using a custom media type via the Accept
    header. With this approach, you maintain the same resource URI that''s capable
    of handling multiple versions. The response to this request should contain the
    version information in a content-type header field. The following snippet depicts
    the Accept header of an HTTP request that can be used to specify the resource
    version:


    ```

    ```text

    Accept: application/vnd.github.1.param+json

    ```

    ```


    # Custom header versioning


    You can use this approach to define a new custom header as part of the request
    to associate resource versioning. With this approach, you will keep the same URI
    across different API versions, limiting client code changes between the API versions.
    The following snippet depicts the custom header of an HTTP request that can be
    used to specify the resource version:


    ```

    ```text

    x-eCommerceApp-version: 2021-01-01

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 196
  md: "> **Note**\n> \n> To learn more about API versioning, please refer to the following\
    \ link:\n> \n> `https://github.com/Microsoft/api-guidelines/blob/master/Guidelines.md?WT.mc_id=-blog-scottha#12-versioning`\n\
    \n# gRPC service versioning\n\nThe gRPC protocol supports service versioning for\
    \ both breaking and non-breaking changes. With breaking changes, you should continue\
    \ to run different versions of your gRPC service side by side unless all of the\
    \ clients have been migrated to a newer version of your gRPC service. The gRPC\
    \ package allows you to specify the optional specifier that can be used for versioning,\
    \ as described in the following table:\n\n| Service Address | Package Name | \
    \ | Service Name |\n|---|---|---|---|\n| ecommerce.v1.notification | ecommerce\
    \ | v1 | Notification |\n| ecommerce.v2.notification | ecommerce | v2 | Notification\
    \ |\n\nTable 6.1 – gRPC versioning\n\nThe service address is composed of the package\
    \ name and the service name. The service address allows multiple versions of the\
    \ gRPC service, which can be hosted side by side to support multiple clients.\n\
    \n# Event versioning\n\nIn an event-driven architecture, events are considered\
    \ the core part of the system and are responsible for the communication between\
    \ different parts of the distributed system. These systems produce, store, and\
    \ consume events as part of their core structure. Just like any other system,\
    \ event-driven systems also continue to evolve in how they communicate with other\
    \ parts of the system by providing a variety of information using an event structure.\
    \ This requires us to think carefully about publishing events that can be processed\
    \ by a variety of consumers without making any changes to the consumer or, at\
    \ the very least, provide enough time for consumers to update the implementations\
    \ to adhere to the new event structure."
  merge: -1
  img_proc: true
- pgno: 197
  md: 'As a rule of thumb, a new version of the event should be convertible from the
    old version; otherwise, it''s a new event. It''s a good practice to specify the
    event version as part of the event structure. This is because it gives you the
    flexibility to publish multiple versions of an event to allow different consumers
    to process it. Another approach is to go with no event versioning and keep the
    events backward compatible by ensuring that you don''t delete or change fields
    in the event structure. New fields are treated as nullable values so that the
    old version of the events can be replayed later. The following diagram depicts
    how event versioning works in an event-driven architecture:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_197_0.png)


    Figure 6.12 – Event versioning in an event-driven architecture


    In the preceding diagram, the publisher is producing multiple versions of an event
    to allow multiple consumers to react to those events. Ideally, these consumers
    should be idempotent to avoid the side effects of processing multiple versions
    of the same event. The event broker acts as a relay between the publisher and
    the consumer and provides capabilities of filtering events based on event data.
    The event broker helps decouple publishers and consumers. The idea is to allow
    different parts of the system to evolve independently, where events aid in enabling
    communication, where each consumer processes relevant events.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'In the event sourcing system, the system should be able to recreate the application
    state using events created during the life cycle of the event source system. This
    implies that the system should process both old and new events to recreate the
    application state. The following diagram depicts multiple versions of the different
    events in the event store. Later, we will discuss the challenges associated with
    this approach and how you can address them:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_198_0.png)


    Figure 6.13 – Multiple versions of events in the event store


    In the preceding diagram, the event source system has multiple versions of the
    same event in the event store, which are used for projections, and downstream
    systems for consumption. The challenge with multiple versions is that the system
    needs to select the right version while recreating the state, which makes the
    overall system complicated and error-prone. The two approaches, how event source
    system process events, are **strong schema** and **weak schema**. A strong schema
    is based on a type system, where the system can only deserialize events to types
    that exactly match their schema. Any new events require building support for serialization,
    which results in redeployment.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'On the other hand, weak schemas are more adaptive and can be described in JSON
    or XML format. Weak schemas use mapping techniques to map JSON or XML data to
    event objects; this is as long as we don’t change the field names and their semantic
    meaning. A weak schema helps us to keep the latest version of the event, as old
    events are now convertible to the latest event. A weak schema is the recommended
    approach for handling event source systems. Other approaches include versioning
    the event store by replacing the old events with the new events while keeping
    backups of the old event store for auditing.


    With a good understanding of the different versioning techniques that can be applied
    in a microservices architecture, you can make sure that the system will continue
    to operate without any disruption even when breaking changes are deployed. In
    the next section, we will explore the role of service meshes in simplifying and
    scaling inter-process communication between microservices.


    # Service meshes


    A service mesh provides an abstraction layer on top of microservices to facilitate
    inter-process communication. The idea behind a service mesh is to decouple communication
    concerns from the implementation of microservices and handle them in a consistent
    manner across the microservices architecture. The following diagram depicts a
    simple service mesh architecture for microservices:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_199_0.png)


    Figure 6.14 – A service mesh'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'The service mesh is a configurable communication infrastructure layer that
    guarantees the reliable delivery of requests across a complex topology of services.
    This enables teams to focus on business capabilities and leave the communication
    concerns to the service mesh. The service mesh is composed of two components:
    the control plane the and data plane. The data plane is implemented as a sidecar
    proxy that''s responsible for intercepting data packets across the network and
    performing various functions before forwarding. The data plane also performs routing,
    health checks, load balancing, observability, authentication/authorization, and
    service discovery. On the other hand, the control plane provides management and
    monitoring concerns. It acts as a controller that connects sidecar proxies to
    form a distributed system.


    In a service mesh architecture, the microservices are unaware of the distributed
    system, as they only talk to their local sidecar proxy for communication with
    other microservices. The service mesh technology is maturing as more and more
    organizations are adopting it. With the adoption of the service mesh, there are
    a few pitfalls that you should be aware of:


    +   - The management of service meshes should be part of shared governance, where
    the enablement team should work with value stream teams to ensure that they understand
    the benefits and challenges rather than implementing different communication concerns
    that can be handled holistically by the service mesh.

    +   - Like any other technology, a service mesh is not a silver bullet, and it
    requires a steep learning curve. The deployment and operational cost of a service
    mesh are high. Earlier in the book, we compared different service meshes based
    on their capabilities in. Please refer to *Chapter 3, Microservices Architecture
    Pitfalls*.


    The service mesh is a good candidate if you are having trouble scaling inter-process
    communication between microservices. It manages the communication between microservices
    that helps teams to focus on business capabilities. Usually, a service mesh is
    owned by the platform team. In the next section, we will compare Dapr and service
    meshes to help you make the right choice while building a microservice architecture.


    # Dapr versus service meshes


    Both Dapr and the service mesh offer overlapping capabilities, raising the question
    of how Dapr compares to a service mesh and when one should be used over the other.
    While both Dapr and service meshes have the same goal of reducing complexity,
    their intended audiences are somewhat different. Dapr focuses on improving the
    developer experience by abstracting your microservices and offering a collection
    of building blocks to meet common microservices needs, whereas a service mesh
    helps application operators by providing a network service mesh that addresses
    networking concerns. Let''s take a closer look at the similarities and differences
    between the two, as listed in the following table:'
  merge: -1
  img_proc: true
