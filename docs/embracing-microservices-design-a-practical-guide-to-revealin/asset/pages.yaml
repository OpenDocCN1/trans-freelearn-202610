  md: '# Two databases


    The two-database approach uses two databases – one for reads and another for writes.
    This approach employs eventual consistency and introduces some additional complexity
    because we now need to keep both the read and write stores in the correct states.
    With this approach, the read performance is increased as we can also use a document
    database for a materialized view that is optimized for reads. We can keep our
    command stack clean and efficient and help concurrency with a relational database
    for writes to enforce transactions. It is common for an application to be more
    read-heavy, so by separating the reads and optimizing our read stack for queries,
    we can increase performance in the Presentation layer. Figure 5.2 illustrates
    the two-database approach and how it uses a stored procedure to update a read
    after every update. Another approach to keep the read data store in the correct
    state is by inserting a service insert or update to update the read store. While
    this also introduces complexity, in some cases, it is a good option:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_155_0.png)


    Figure 5.2 – A two-database CQRS


    The preceding diagram illustrates the two-database CQRS implementation. We can
    see that we have a read database and a write database. The data flows through
    the command stack and down to the write database. Then, it flows through the read
    database, moving on to the Data Access layer. Finally, the data flows out through
    the Queries service layer and back to the user.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Event sourcing


    Event sourcing is the third CQRS approach. It is the most complex of all the CQRS
    types in which we store events as entities using an event ID. We can replay events
    to get to the current state and to view the audit trail or history of the event
    entity. We modify the event entity when there is a state change and events become
    the source of truth. Just as in the two-database approach, we need to update the
    read database; this will be a materialized view of the last event and the current
    state of that event to optimize reads. Events can be replayed, but this operation
    is expensive. Therefore, we need a materialized view for reads. Event sourcing
    is very complex and should only be considered when the need for auditing the history
    of events, such as in healthcare or government compliance, dictates this need.
    We can conduct a point-in-time reconstruction of the state and view why it changed,
    how it changed, and for debugging purposes. This ability to be able to replay
    events can help meet the audit and compliance requirements of regulated industries
    and should only be considered when the use case requires such a feature due to
    the complexity and cost involved in event sourcing. Simply put, if you don''t
    need it, then don''t use event sourcing.


    The following diagram illustrates the event sourcing CQRS implementation:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_156_0.png)


    Figure 5.3 – Event store and read database'
