- pgno: 150
  md: '# Embracing polyglot persistence


    So, should we choose a NoSQL document database or a SQL relational database? Let''s
    answer this question and more in this section. We will explore different persistence
    models and compare and contrast them to see how they pertain to polyglot persistence.


    There has been much discussion around data persistence and whether SQL relational
    databases or NoSQL document databases are the way to go when it comes to persisting
    data and its state. As we continue our journey in the realm of data design, we
    are introduced to the emerging concept of polyglot persistence. Here, we can use
    several paradigms, from NoSQL to SQL relational stores, when dealing with data
    persistence and storage for our microservices.


    Polyglot persistence is the approach of storing data in the best data store available
    to meet the needs of the application or use case. For instance, this could be
    a data lake of big data for the storage and retrieval of large raw data, a document
    database such as MongoDB (CosmosDB) for the faster reading and writing of JSON
    documents, or a tried-and-true relational database such as SQL Server. In some
    cases, you might even use all three and will require a custom design as there
    is no one tool that you can use to handle persistence across NoSQL or relational
    databases as far as I am aware.


    In recent history, document databases have become particularly popular in the
    application development world. The reason for this is the common practice of passing
    data back and forth through RESTful web APIs and persisting data in the raw format
    of JSON documents without the need to map to database columns. This has led to
    numerous discussions and debates on the importance of choosing one or the other
    when it comes to relational databases or document databases. Both document databases
    (NoSQL) and SQL databases (relational) have their strengths and weaknesses. Indeed,
    in some cases, you will find that you need both a NoSQL store and a SQL store,
    and this can be achieved via a repository pattern. We can now provide different
    implementations of our data stores, either relational-based or document-based
    solutions, by abstracting away the details of how the data is persisted through
    interfaces, such as in a repository pattern. Polyglot persistence uses the concept
    of the best database model for the job at hand.


    It is important to understand that not all data needs are equal. Some require
    a different approach and careful consideration. Polyglot challenges question what
    our data needs are, whether the old model works for our use case, and whether
    we should consider a different approach.


    Modeling data to meet whatever paradigm we find ourselves in is paramount to good
    design, so we will explore different approaches such as a relational data store
    and a NoSQL document data store. Note that they are very different when it comes
    to modeling our data and each requires a different mindset.'
  merge: -1
  img_proc: true
