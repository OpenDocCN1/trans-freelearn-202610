    also requiring logic and mapping from a ViewModel back to a UI within the response.
    This can result in slower page loads, as the application must complete the update
    and return the response in the same request or transaction. To make matters worse,
    business logic can start to spill over into other layers. Additionally, business
    logic shouldn’t be concerned with data access concerns or even be aware of it.
    Business logic should only be concerned with business rules, policies, and invariants
    rather than with the logistical concerns of data access.


    Figure 5.5 depicts a bidirectional request and response schema where we request
