- pgno: 64
  md: 'The following diagram illustrates different autonomous systems; some have relationships
    that are bi-directional and some have a one-way relationship or dependency:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_64_0.png)


    Figure 2.1 – Complex adaptive systems'' relationships


    In this section, we explored complex adaptive systems. We can think of microservices
    as being very similar in nature to a complex adaptive system. We now need to determine
    whether the microservice we are creating is complex or not, as this will help
