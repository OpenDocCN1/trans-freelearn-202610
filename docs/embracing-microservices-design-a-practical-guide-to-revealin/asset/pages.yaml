- pgno: 30
  md: "+   - **Enabling team:** The role of the enabling team is to provide support\
    \ and guidance to stream-aligned teams in adopting tools, technologies, and practices\
    \ that can help them perform better. Enabling teams are formed to identify areas\
    \ of improvement and promote the learning mindset by keeping the wider organization\
    \ aware of new technologies and best practices. Depending on their purpose, enabling\
    \ teams can be short-lived or long-lived in an organization. However, their engagement\
    \ with stream-aligned teams is only for a short period. Once the required capability\
    \ is achieved, the enabling teams move to support other teams.\n+   \n+   - **Complicated\
    \ subsystem team:** The complicated subsystem teams are formed to address the\
    \ requirements of complex subsystems, which can add significant cognitive load\
    \ to stream-aligned teams and affect their ability to stay focused on the business\
    \ domain. They are responsible for developing and operationalizing these systems\
    \ to ensure their service availability when it comes to consuming other value\
    \ streams.\n+   \n+   - **Platform team:** The platform team is responsible for\
    \ providing infrastructure support to enable stream-aligned teams to deliver a\
    \ continuous stream of value. They ensure that the capabilities offered by the\
    \ platform are compelling and provide a good developer and operator experience\
    \ for consuming and diagnosing these platform services. These services should\
    \ be accessible via APIs, thus enabling self-service and automation. The platform\
    \ team is aligned to the product life cycle and guarantees that the stream-aligned\
    \ teams are getting the right support on time to perform their duties. These services\
    \ are usually bigger and supported by larger teams.\n\nWhen you adopt a microservice\
    \ with DevOps, individuals are responsible for handling both the development and\
    \ operations of a microservice. These microservices are built with the guidance\
    \ provided by product managers and product owners. In the real world, teams start\
    \ small until they grow big and add complexity, before being subdivided into multiple\
    \ teams to ensure autonomy and independence. For example, your application may\
    \ need to build multiple channels to interact with its customers and want to work\
    \ with teams with capabilities around iOS and Android, or they may have to add\
    \ a notification functionality that needs a separate team altogether. In these\
    \ teams, individuals have a shared responsibility, where design decisions are\
    \ usually led by senior engineers and discussed with the team before implementation.\n\
    \nNow, let's learn about the advantages that microservices bring."
  merge: -1
