- pgno: 112
  md: 'Many enterprises are realizing the importance of hybrid environments for hosting
    their workloads across a variety of environments. This can help them address scalability,
    regulatory, and compliance concerns for their customers. In the cloud-native world,
    enterprises are continuously exploring ways of managing hybrid cloud estate easily
    and consistently. *Azure Arc for Kubernetes* enables any CNCF certified Kubernetes
    cluster to be managed using a single pane of glass. Now, organizations can deploy
    their cloud-native workloads on their choice of cloud provider and manage their
    workloads with ease using Azure Arc.


    The cloud-native approach also emphasizes adopting modern application design principles
    for building containerized microservices with asynchronous messaging and modern
    communication protocols (gRPC and Thrift). Another important aspect of the cloud-native
    approach is to enable observability across different microservices that are deployed
    across a cluster of nodes. Monitoring platforms help you centralize logs and telemetry
    for monitoring and alerts. Automating code and infrastructure is a big part of
    the cloud-native approach when it comes to building an immutable infrastructure
    that can be deployed across environments with consistency. Continuous integration,
    continuous delivery, and **Infrastructure as Code (IaC)** are the widely adopted
    practices in the cloud-native world.


    # Embracing micro platforms


    The *micro platform* can be seen as a small microservices platform that is much
    easier to create, manage, and dispose of compared to the microservice platform.
    Micro platforms are considered as smaller landscapes that only target a set of
    services that are part of one application. Many organizations have adopted the
    practice of managing multiple microservices platforms, where each application
    has its own micro platform instead of having one large platform where all the
    services are provisioned. One of the advantages of a micro platform is that it
    can protect services from cascading failures.


    These platforms are created using IaC practices so that they remain identical
    and reproducible. In some cases, you can deploy these platforms on your local
    machine. The micro platform helps in increasing the autonomy of teams by empowering
    them to manage the platform, along with microservices, and move faster as they
    no longer have to rely on other teams to provision their microservices. The micro
    platform helps organizations be more resilient compared to a single microservices
    platform, where they have the flexibility to provision multiple micro platforms
    in hybrid environments or even across different cloud providers to achieve better
    resilience. The following diagram shows a comparison between the microservice
    platform and micro platforms:'
  merge: -1
  img_proc: true
