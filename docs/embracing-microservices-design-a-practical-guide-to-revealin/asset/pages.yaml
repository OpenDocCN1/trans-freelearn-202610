- pgno: 148
  md: '# The pitfalls of keeping a single shared database


    The number one mistake that teams make when deciding to go with microservices
    is trying to share a single database and scheme with multiple microservices. So,
    why is this such a bad idea even though it certainly seems easier? Well, let''s
    start with the definition of microservices.


    The definition of a microservice states that each microservice should have its
    own database or data store for which it is responsible for maintaining the state
    of its data. Therefore, it makes sense that we adhere to this principle of a single
    database when creating our microservices. It is also reasonable to conclude that
    when we break up a monolithic application into microservices, we must break apart
    the large monolithic legacy database into smaller, separate data stores of one
    per microservice. This breaking up of mature legacy databases is no easy task
    and should not be taken lightly. An activity such as breaking up a mature database
    into smaller databases requires much planning and preparation. We need to ensure
    that we have a deep understanding of the monolithic database and its relational
    data. Additionally, we need to procure the knowledge of the data that supports
    the service we are creating and separate that model from the legacy database into
    our new microservices database.


    It is paramount that we break up the large monolithic database into smaller data
    stores for each microservice in order to loosely couple the separate services
    away from each other. If we fail to do this, our microservices will become tightly
    coupled. This means you will have simply created a large, distributed monolith
    that is hard to maintain and manage. Additionally, it means that we will have
    created more complexity for ourselves by separating the microservices and two
    separate code bases that are still being tied to a monolithic database. We''ve
    just made our world far more difficult to manage when it comes to microservices
    and have defeated the whole purpose behind them. With our microservices tightly
    coupled by the monolithic database, we will start to experience deadlocks and
    high contention situations in our database where multiple microservices serving
    many requests try to update a single record in the database.


    You can take two different approaches in which to split the database and its data.
    One is to start with the database first, and the other is to start with the code
    first. The latter helps us to break the database up into smaller databases that
    align with the domain or business feature we are trying to create the service
    for. The code-first approach, I believe, is the safest, as we move the model from
    the old legacy database to the new service by building the code model first. By
    doing so, we can build our service in isolation with supporting unit tests to
    first prove our design.'
