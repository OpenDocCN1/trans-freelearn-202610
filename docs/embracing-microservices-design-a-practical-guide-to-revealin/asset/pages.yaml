- pgno: 241
  md: '# # Using outdated tools and technologies


    Technologies degrade over time, and new technologies that are more robust, versatile,
    and risk-free are introduced. Using outdated tools and technologies increases
    risks to your business. Always use technology that supports better containerization
    and deployment options, as recommended for microservice-based architectures. When
    selecting a specific version, go with the most recent, or N-1. When it comes to
    deploying microservices, one of the most important requirements is DevOps. Select
    a tool that includes options for automating development and deployment processes.
    Some of the tools that can help you execute CI/CD are Azure DevOps and GitHub.


    # # Failing to obtain cooperation from all teams


    DevOps embraces collaboration between developers and the operations teams. Traditionally,
    when applications are deployed, the developers create a build or a package from
    their machine or a build server, and then they hand it over to the operations
    team to deploy it on the production server. The operations team follows the deployment
    manual and deploys the application. You might have seen how an application fails
    when even a single step is missed. When a part of the deployment (or even sometimes
    with applications) isn''t tested properly, errors or bugs may occur.


    In a microservices architecture, we are not talking about one or two applications.
    We can have more than 50 services that have been independently deployed and are
    running on different servers. Note that manual deployment is not an option here.
    DevOps can help establish collaboration between teams and provide visibility to
    both teams about how the application is built and deployed. Both building and
    deployment can be automated by creating pipelines that define the list of tasks
    needed to be executed to build, test, and deploy. Setting up the pipeline''s initial
    structure may take some time but once that is set up, teams won''t face issues
    concerning builds and deployments. Moreover, Azure DevOps provides various other
    options for controlling deployment by adding pre-approvers, post-approvers, quality
    gates, and so on.


    Infrastructure setup is one of the core principles of the **Cloud-Native Computing
    Foundation (CNCF)** and plays a vital role in the microservices architecture as
    well. Companies that are coming from the experience of monolithic applications
    or legacy systems may not realize the importance of the right infrastructure for
    the right implementation. Adopting similar services may not be a good fit for
    a microservice-based application.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'For instance, microservices embrace containerization. This is important if
    you wish to remove deployment risks and run applications or services isolated
    in their own environments. Moreover, it also answers the problem of something
    running fine in development and failing in production. If companies are targeting
    Microsoft Azure for their cloud platform, they can use Azure Service Fabric or
    Azure Kubernetes Service to run and orchestrate their containers. However, if
    moving to the cloud has some restrictions due to company policies, you can set
    up Service Fabric locally on your on-premises servers or set up Kubernetes and
    manage it from Azure Arc for Kubernetes.


    # Not considering Infrastructure as Code (IaC) for environment setup


    Setting up the environment is an essential activity to be carried out to deploy
    any application. Many companies have strategies for creating multiple environments,
    such as staging, canary, and production to help deploy their workloads for testing
    and going live. **Infrastructure as Code (IaC)** provides a platform for creating
    the script for your infrastructure and deploying it to as many environments as
    necessary. Imagine that you manually set up an infrastructure that takes 5 days
    to complete for a single environment, while replicating it for other UATs, staging,
    and performing a canary deployment needs an additional 15 days. Moreover, if any
    part of the environment crashes, resetting would take the same time again. With
    IaC, since the whole configuration is written in the form of a script, you can
    deploy in minutes and easily replicate to multiple environments.


    **Azure Resource Manager (ARM)**, from Microsoft, and Terraform, from the open
    source community, are two of the most popular tools available today that allow
    teams to build IaC in a declarative manner. Additionally, they allow you to integrate
    with Azure DevOps to kickstart deployment on demand, when it''s scheduled, or
    on a successful build. Both ARM and Terraform use JSON format to define the configuration,
    and many tools can be used to run those scripts, such as VS Code, Visual Studio,
    PowerShell, the Azure console, the Azure CLI, and more.


    Some of the properties of these tools are as follows:


    +   - **Template-driven:** All the configuration is defined in a JSON-based template.

    +   - **Declarative:** Uses a declarative model instead of an imperative model.

    +   - **Idempotent:** Resources are not provisioned again when redeploying the
    template again and again if they have already been provisioned.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '+   - **Multi-service**: A single template can be used to deploy multiple services
    at once.

    +   - **Extensible**: You can extend the template by adding more resource providers
    and resources.


    For ARM templates, Microsoft has recently built a language known as Bicep. Bicep
    is a **domain-specific language (DSL)** that uses declarative syntax to deploy
    resources on Azure. The syntax is more concise compared to standard ARM syntax
    and adheres to type safety, which makes it less complex and simplified.


    > **Note**

    > To learn more about and to get started with Bicep, check out the following link:

    > https://docs.microsoft.com/en-us/azure/azure-resource-manager/bicep/overview


    # Not knowing the core principles of DevOps


    DevOps allows the development and operations teams to collaborate, but many companies
    don’t use this ability completely. DevOps helps app innovation by shortening the
    cycle time and providing results faster. You may utilize DevOps to automate the
    process between development and operations, allowing you to release software faster
    to market while also learning, monitoring, and measuring the application in production.
    DevOps also supports agile approaches that provide value to consumers by allowing
    teams to plan, execute, and monitor their work continuously. It also allows you
    to optimize IT resources and increases developer agility.


    Azure DevOps facilitates all the stages of the software development life cycle.
    When the project starts, the backlog can be maintained using various work item
    segregation tools such as portfolio backlogs and product backlogs. You can create
    epics, features, user stories, tasks, and bugs to document the task that needs
    to be performed. It also provides many options including (but not limited to)
    team capacity, Spring planning, task assignments, and so on. Repos is a popular
    feature in Azure DevOps that allows users to keep their source code using either
    Git or **Team Foundation Version Control (TFVC)**. The build and release process
    can be automated with pipelines, while test plans can be used for testing and
    artifacts can be used to retain local feeds such as NPM, NuGet, and Maven packages.'
  merge: -1
  img_proc: true
