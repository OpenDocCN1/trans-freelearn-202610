- pgno: 37
  md: '# # Reviewing leadership responsibilities


    In this section, we will understand the responsibilities associated with different
    roles in an organization looking to adopt the culture of continuous delivery of
    value.


    # ## What business/technology leaders must know


    Any organization''s business leaders must define and communicate the vision of
    the organization and focus on the necessary grassroot transformation. They must
    identify growth opportunities, market trends, competition, and address potential
    risks to create an environment that fuels innovation by bringing new business
    models to life. Innovation that''s driven by a feedback loop creates a culture
    where new ideas are heard, designed, iterated, and refined. They should focus
    on value creation through active learning, gaining insights, and experimentation.
    As business values change over time, this demands a change in business priorities,
    which should be clearly defined and communicated across the organization so they
    can be used as the guiding principle to make future decisions.


    Technology leaders are responsible for articulating the technology strategy and
    driving technology initiatives across the organization. They are also responsible
    for building capabilities by investing in people, processes, products, services,
    platforms, and acquiring business acumen to deliver a competitive edge in a cost-effective
    manner for customer delight. Technology leaders play an important role in leading
    the evolution of business systems, understanding the challenges, and building
    capabilities to continuously innovate. They should also look outside their organization
    and find opportunities for collaboration with teams to ideate and innovate. Furthermore,
    they ensure service quality by implementing process improvement models with the
    help of widely adopted frameworks to help deliver high-quality services, addressing
    a vast majority of customers. CMMI, GEIT, and ITIL are a few of the frameworks
    that can help in adopting practices around service delivery, development, governance,
    and operation. The adoption of these frameworks and their practices varies widely
    in the industry. Smaller organizations can start small and focus on a few of the
    relevant practices, while the enterprises that may want to achieve a certain level
    of maturity can explore the entire model.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# # What architects must know


    The role of an architect is to understand the need for changing business drivers
    and technology and their impact on software architecture. They work closely with
    the business stakeholders to identify new requirements and formulate plans to
    accommodate those changes to drive business value. As change is the only constant,
    an architect should embrace the architectural modularity of software systems to
    be evolved in isolation. They need to align architecture decisions (trade-offs)
    with the business priorities and understand their impact on business systems.
    The architect should demonstrate leadership, mentorship, and coaching across teams
    to facilitate change. They have the responsibility of enabling software teams
    by providing the necessary learning opportunities to acquire the necessary skills
    to deliver effectively. These learning opportunities are not only limited to technology
    training and certifications, but special emphasis should be placed on understanding
    business systems, business domains, and change management. When it comes to agile
    teams, the role of an architect is usually played by the senior engineers or the
    development managers.


    In practice, it''s essential to understand both the business domain and data.
    These architects should collaborate with business users to understand the business
    outcomes and emphasize domain-driven design. They should also analyze how different
    parts of the application are consuming different datasets, to remodel them as
    microservices. Understanding the usage patterns of the data allows us to either
    build or choose the right services that support business needs.


    # # The role of the product manager, product owner, and scrum master


    Product managers are responsible for crafting the vision of a product by understanding
    customer needs, business objectives, and the market. They sit at the intersection
    of business, technology, and user experience, while the product owners work closely
    with the stakeholders to curate detailed business requirements for the product
    or feature. They are responsible for translating the product manager''s vision
    into actionable items to help cross-functional teams build the right product.
    The scrum master is the coach that acts as a mediator between the development
    team and product owner to ensure that the development team is working in alignment
    with the product backlog. They foster an environment of high performance and continuous
    improvement across the team.


    So far, we have learned about the role of leadership in shaping the culture to
    adopt change. Next, we will discuss the importance of setting priorities before
    starting the microservices journey. Leadership should keep revisiting these priorities
    to ensure their alignment with business objectives.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Defining core priorities for a business


    Since the microservice architecture is gaining momentum, more and more organizations
    have started thinking about adopting a new way of building applications. These
    organizations are setting themselves up for a journey. Startups are challenged
    with limited resources and deciding what to build in-house and what to outsource.
    Large organizations are looking to adopt new ways to deliver value faster to their
    end customers. They are building new applications and also looking to transform
    their legacy applications into microservices to gain the benefits of being more
    nimble and agile. As they progress through their journey, they will need to make
    decisions and deal with lots of trade-offs.


    To start, it’s important to outline the charter based on your business priorities.
    If the focus is on building new features and increasing team velocity, then innovation
    should be prioritized over reliability and efficiency. The following diagram depicts
    different dimensions that need to be prioritized based on business priorities:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_39_0.png)


    Figure 1.2 – Different dimensions of business priorities


    If providing a reliable service to your customer is your primary goal, then reliability
    should be prioritized over innovation and efficiency. If efficiency is more important,
    then you must focus on making the right changes to become an efficient organization.
    By doing so, innovation and reliability may need to be addressed later in the
    value chain. For example, being more efficient enables experimentation at a low
    cost, which allows teams to try out new things more often.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Technology leaders need to make sure that their team is ready, and they must
    be aware of cultural change, new ways of communication, learning new tools and
    technologies, autonomy in making decisions about their service domains, and be
    open for collaboration to ensure governance. Technology leaders should bring clarity
    by defining and communicating the right architecture to the teams.


    As an architect, you need to make sure that you are capturing all the decisions
    that are mutually agreed upon, their benefits, and their trade-offs. You are also
    responsible for documenting and communicating the implications of these decisions.
    Documenting these decisions will help you look back and find reasons for making
    those decisions. This will allow you to make more informed decisions in the future.
    Identifying good candidates for microservices and modeling them around business
    capabilities is crucial. You should start with services that are not critical
    to the business and evolve your architecture incrementally.


    Building a new application or transforming a legacy application into microservices
    is a crucial decision for an organization. It''s highly unlikely that you should
    lay out a detailed plan for such initiatives, but the new services should be designed
    in a way that they should cater to the current and emerging business requirements.
    However, understanding the current system can help in identifying areas that can
    deliver the most impact. Another important aspect is observing the usage patterns
    of different parts of the application to understand how clients and different
    parts of the application are interacting with each other. For many organizations,
    modernizing legacy applications and adding new features to address customer needs
    are competing priorities. There are mainly three approaches that are adopted as
    teams start converting those applications into microservices:


    +   - Replacing existing functionality with new microservices that are being built
    using new tools and frameworks to avoid any technical debt. This requires a huge
    investment upfront to fully understand the legacy system. It''s usually recommended
    for small legacy systems or a module in a large legacy application that offers
    limited functionality.

    +   - Extracting an existing functionality that exists in different modules as
    microservices. This approach is recommended for legacy applications that are well
    maintained and structured throughout their life cycle.

    +   - As an application continues to grow, it''s highly unlikely that the initial
    design principles are followed during its lifespan. In such cases, a balanced
    approach should be adopted to allow teams to refactor old applications. This helps
    them clearly define module boundaries, which can later serve as a means of extracting
    code from microservices.'
  merge: -1
  img_proc: true
