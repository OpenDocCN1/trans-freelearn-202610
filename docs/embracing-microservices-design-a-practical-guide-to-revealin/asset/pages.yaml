- pgno: 34
  md: '# ## Observability


    Managing, monitoring, and controlling microservices at scale is a difficult problem.
    You need to have good observability in place to understand the interaction and
    behavior of different parts of the system. You need to collect metrics, logs,
    call stacks, raise alerts, and implement distributed tracing to help you reason
    about the system.


    # ## End-to-end testing


    End-to-end testing the microservices is more challenging as it requires reliable
    and effective communication to bring all the teams on board. End-to-end testing
    can also hamper your release frequency. Setting up a test environment is difficult
    and requires coordination across teams.


    # ## Double mortgage period


    If you are migrating from a monolithic application to a microservice, then you
    need to live in a hybrid world for a while to support both the legacy and the
    new application. This is not easy and requires careful planning when it comes
    to fixing bugs and adding new features, thus affecting agility and productivity.


    # ## Platform investment


    Organizations need to invest in platform teams that are responsible for building
    platform services and addressing cross-cutting concerns. These cross-cutting concerns
    will be covered in detail in *Chapter 7, Cross-Cutting Concerns*. These teams
    also build tools and frameworks to help other teams get the job done.


    The previous sections have given us a good overview of microservices, along with
    their design principles, advantages, and challenges. We''ll now have a look at
    the various architecture components of microservices and their interaction when
    it comes to building scalable and robust applications.


    # ## Microservice architecture components


    Microservices are a loosely coupled set of services that cooperate to achieve
    a common goal. Besides microservices, there are other components that play a vital
    role in a microservice architecture. The set of components that help establish
    the foundation of microservices are shown in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_35_0.png)


    The preceding diagram demonstrates the interaction of different microservice architecture
    components. These microservices are hosted on an orchestration platform, responsible
    for ensuring self-healing and the high availability of microservices. These microservices
    then communicate with each other using orchestration or choreography patterns.
    In orchestration, a microservice is responsible for invoking other microservice
    interfaces while in choreography, messages are exchanged using an event bus. A
