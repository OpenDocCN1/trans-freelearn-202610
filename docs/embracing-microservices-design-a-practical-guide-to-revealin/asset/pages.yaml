- pgno: 273
  md: 'For example, in the student management system, we can have modules as student
    management, course management, attendance management, document management, and
    employee management. We can start replatforming the application from attendance
    management since it seems to have fewer dependencies on other modules, whereby
    students can come and mark their attendance. From the frontend, when the student
    marks the attendance, instead of calling the monolithic application''s module,
    a code will be written to call the new attendance management service. A second
    pick could be a document management service that students can use to upload their
    documents. For this, we may need to write an anti-corruption layer if there is
    a scenario to update the student''s main record when a document is uploaded. You
    can learn more about the decomposition strategies in *Chapter 4, Keeping the Replatforming
    of Brownfield Applications Trivial*.


    The data decomposition and migration could be challenging with respect to data
    synchronization, multi-writes to both monolithic and microservice interfaces,
    data ownership, schema decomposition, joins, the volume of data, and data integrity.
    Various approaches can be adopted, such as keeping a shared database between microservices,
    decoupling the database to a set of services based on business capability or domain,
    or segregating the databases so that they are completely isolated to the service
    itself. Keeping the database per service is the most preferred option. However,
    it is not easily possible in many cases, and in such scenarios, you can implement
    patterns such as a Database View pattern and a Database Wrapping Service pattern.


    Moreover, there are various database technologies in existence today that help
    you to choose the right technology fitting the requirement. For example, in a
    shopping cart service, DocumentDB might be the right database technology for keeping
    cart information because you don''t need a relational database and you can keep
    the cart information as a document indexed by a user **identifier (ID)**.


    # Evaluating the DevOps capability


    Assessing the DevOps capability is very important when evaluating a microservices
    architecture. Microservices are meant to bring rapid development and change adoption
    in an organization and DevOps is one of the core practices that should be in place
    to achieve this. The following points should be considered when evaluating DevOps
    capability for a microservices architecture:


    +   - Does the organization understand the fundamentals of DevOps?

    +   - Are DevOps practices implemented?

    +     - Are agile practices implemented?'
  merge: -1
  img_proc: true
