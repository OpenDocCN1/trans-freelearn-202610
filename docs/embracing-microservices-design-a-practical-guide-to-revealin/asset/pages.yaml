  md: 'At a first glance, this appears to be a fine example of a separation of concern;
    it is and works well in many cases. However, while this might work in simple applications,
    as the complexity of the application grows, mixing methods that mutate the state
    along with the responsibility of returning a ViewModel adds even more complexity
    and breaks the single-responsibility principle. As you can see, as the request
    comes from a client, the flow of data traverses each layer. Therefore, each layer
