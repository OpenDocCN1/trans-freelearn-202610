- pgno: 114
  md: 'In the second scenario, we have two micro platforms hosting a different set
    of microservices, which is more resilient to cascading failures. Failure of one
    microservice can only affect the resources on one micro platform, which helps
    with the overall resiliency of the application. The microservices in cluster X
    will continue to operate, though you may experience some microservices that are
    available with limited functionality.


    Understanding containerization, orchestrators, micro platforms, and other cloud-native
    approaches for building microservices is key for setting the foundation for success
    in a microservices journey. The frontend of a microservice is as important as
    its backend, and it''s critical to explore how cross-functional teams can address
    the concerns around frontend development in a microservice architecture. Now,
    let''s discuss the challenges of the micro frontend and some potential solutions.


    # Neutralizing the benefits of microservices by adopting a frontend monolithic
    architecture


    In the microservices world, the focus has been on converting large monolithic
    backends into self-contained microservices, managed by separate teams to gain
    agility. These days, many microservices use feature-rich browser implementations
    to expose business functionalities to their end users. Mostly, there is a separate
    team that''s responsible for building application user interfaces by consuming
    APIs exposed by microservices. Over time, these frontends grow in complexity,
    resulting in a frontend monolithic UI. Hence, the benefits of microservices are
    somehow constrained due to the architectural style that''s followed at the start.
    To overcome this challenge, you should introduce a *plug-and-play architecture*,
    where each team can build their own frontends. Figure 3.1 depicts a monolithic
    frontend that interacts with multiple microservices. To incorporate multiple microservices,
    frontend teams need to work with multiple backend microservice teams, which increases
    the communication overhead for managing different parts of the UI that are affecting
    its agility and productivity. The real challenge is to design an architecture
    that supports decoupling, scalability, and independent deployment.


    The micro frontend addresses the drawbacks of a monolithic frontend, which allows
    teams to reduce communication overhead, increase autonomy, and help organizations
    scale. We''ll learn about micro frontends in the next section.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# Micro frontends


    Using a micro frontend is an architectural style that focuses on scaling the development
    of frontends by bringing complete autonomy to a business domain. This enables
    teams to deliver independent UIs that can be combined to build a product. In essence,
    each team is responsible for delivering their UI components, pages, or JS files.
    The main application is built as a container of UI components, where each component
    can be developed using different technologies. The following diagram is a representation
    of a micro frontend architecture:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_115_0.png)


    Figure 3.13– Microservice platform with micro frontends for the web


    In the preceding diagram, each team is responsible for developing UI components
    that belong to their subdomain. Pages are composed using different components
    produced by different teams, where the components can communicate with each other
    using predefined interfaces, and routing is managed either on the client side
    or the server side. Single-SPA and web components are the frameworks that can
    facilitate the development and composition of multiple UI components into a single
    product. Also, the adoption of micro frontends enables cross-functional teams
    to own the complete business domain, where the microservices, API gateways, and
    micro frontends are owned by one team.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Summary


