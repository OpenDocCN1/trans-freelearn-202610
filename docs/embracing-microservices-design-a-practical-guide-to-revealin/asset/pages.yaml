- pgno: 54
  md: 'In this chapter, we will re-examine the characteristics and properties of microservices
    and then see what role **domain-driven design (DDD)** has in relation to building
    microservices. We will examine the following topics on our journey:


    +   - What are microservices and how do they align with DDD?

    +   - Benefits and challenges of microservices as compared to DDD

    +   - Lack of team alignment

