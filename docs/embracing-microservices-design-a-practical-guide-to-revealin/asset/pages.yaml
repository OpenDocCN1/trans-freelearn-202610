- pgno: 253
  md: '# 9

    Skipping Testing


    Why do development teams skip testing? What reason could you have to not test
    your software? Well, testing is a boring topic for many and something that some
    folks would rather put off to the last minute. You will hear people say things
    such as "I just don''t have time." Some people blame the business for not wanting
    to spend the man-hours on testing software, so they never get around to it, or
    testing gets kicked down the road to the night of deployment. I believe if the
    business really understood the cost of bugs and the risk of deploying software
    with bugs, then it would conclude that time must be made for testing software
    early and often. If you ever want to get the business to listen, then you must
    place a dollar value on whatever you are trying to get them to understand, be
    it unit testing, software testing, or adopting agile processes. Businesses are
    primarily motivated by making and saving money and a solid software testing strategy
    can help them with both.


    A significant question that comes to mind is: Who will educate businesses on the
    importance of software tests? Will it be the development team or the architect?
    The answer to the question is the development team and the architect should work
    together to communicate the importance of testing and educate the business. The
    architect should include the testing plan in their architectural documentation
    and during planning discussions with the business.'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'The business is motivated by money, either saving money or making money, so
    we must include cost analysis data to prove that, in the long term, costs will
    be significantly reduced due to a solid testing strategy. We must demonstrate
    to the business that testing is an investment and not just an expense in terms
    of time and resources. These savings should be shared with the business leadership
    to help garner support for management. So, once we have educated the business
    on the value of testing software, it will see that skipping is not really an option
    at all.


    So, skipping testing is not a good choice and will be disastrous. As a system
    gets distributed to microservices, testing becomes even more vital to success,
    as microservices need to integrate with each other and teams need to have a high
    level of confidence that the added features or functionality will not break their
    code base or the code base of other dependent services. By testing early, we can
    avoid disasters, address defects, save the business money, and get to market faster.


    Now that we understand the importance of testing and want to avoid the anti-pattern
    of not testing our software, we will examine a good strategy for testing software,
    known as **shift-left testing**, and the patterns that support the shift-left
    approach. We''ll be covering the following topics in this chapter:


    +   - Unit testing

    +   - End-to-end testing

    +   - Integration testing

    +   - Load testing


    # The shift-left testing strategy


    Testing earlier and often is the idea behind shift-left testing. By moving testing
    to earlier in the development life cycle, we will prevent errors from being found
    later in the process or, worse yet, after deployment into production. Shift-left
    testing moves testing into the development and build phase, which allows the team
    to detect defects and bugs early on. This allows the team to address and fix these
    issues faster and before they can do any real damage.


    The shift-left testing approach to software testing greatly enhances the deployment
    and release process, allowing for faster releases that can occur daily, weekly,
    or even hourly in some cases.


    The lack of testing or not implementing testing properly can lead to defects and
    bugs being deployed into production, which leads to expensive bug fixes and delays
    in the releasing of new features.'
  merge: -1
  img_proc: true
- pgno: 255
  md: "Let's look at some best practices and strategies in the following sections\
    \ that will assist the team in implementing a shift-left testing approach, which\
    \ will lead the deployment team to greater confidence in the code base and allow\
    \ the business to get to market before the competition with new features. Shift-left\
    \ testing is win-win all the way around.\n\nLet's understand some important properties\
    \ of shift-left testing:\n\n+   - **Planning:** Develop a testing plan that covers\
    \ the entire development life cycle and make the plan clear for the entire development\
    \ team to understand their role in supporting the process. Set realistic expectations\
    \ and goals built to mature incrementally.\n+   \n+   - **Testing integrated into\
    \ the culture:** Testing must become part of the culture enforcement from the\
    \ top down. Analysis and product owners should follow best practices around creating\
    \ user stories with good acceptance criteria. Include testers in requirements\
    \ meetings and in the entire software development life cycle. Embrace test-driven\
    \ design or behavior-driven design.\n+   \n+   - **Standards:** For quality control\
    \ for code, test user stories. User stories should be complete with good acceptance\
    \ criteria. Code should be reviewed by testers, senior developers, and peers.\
    \ Implement good SOLID principles of design. Write code that is testable and easy\
    \ to change. Last but not least, have standards for tools, frameworks, and third-party\
    \ libraries.\n+   \n+   - **Automation:** This is important for testing and should\
    \ be implemented early in the development life cycle. There should be automation\
    \ of testing during the build phase and also during the deployment phase. Use\
    \ approval gates when necessary when moving from development and testing environments\
    \ to production. Have employee development pipelines that use the task to automate\
    \ testing. Testing tools and frameworks should be consistently employed throughout\
    \ development teams. Run tests using frameworks such as xUnit, NUnit, and JUnit.\n\
    +   \n+   - **Agile team structure:** Scrum teams should include testers and teach\
    \ testers coding skills and start blurring the lines between tester and coders.\
    \ Sprints should be short, with testers heavily involved in the deployment life\
    \ cycle.\n+   \n+   - **Testers:** Testers should be involved in agile ceremonies\
    \ such as sprint planning and story refinement. Testers need to learn how to code\
    \ and, at a minimum, learn to read code; having testers that are comfortable with\
    \ code is a huge plus. Have developers test and write automation or configure\
    \ automation with the tester heavily involved in the process."
  merge: -1
  img_proc: true
- pgno: 256
  md: '# The testing pyramid


    When considering our overall testing strategy, we can create a pyramid to show
    the level of importance and the amount of effort that should go into each type
    of testing when it comes to load testing, end-to-end testing, integration testing,
    and unit testing. Unit testing takes the lion''s share of our testing strategy,
    as demonstrated in the following diagram:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_256_0.png)


    Figure 9.1 — Level of importance of different test types


    Unit testing is definitely a shift-left best practice as it starts with the code
    and the code is about as left as you can get, as it all starts with writing testable,
    changeable code that meets the acceptance criteria of the business.


    # Unit testing


    Unit testing helps us meet the shift-left approach by moving the testing to the
    development phase and helps meet the automation portion as well. Developers need
    to embrace the use of unit testing by using methods such as **test-driven development
    (TDD)**, which prescribes writing the test first based on good acceptance criteria.
    The TDD process has a life cycle of writing a test that fails, then writing the
    code that makes the test pass, and finally, refactoring the test and the code.'
  merge: -1
  img_proc: true
- pgno: 257
  md: "# # The unit testing life cycle\n\nThe unit testing life cycle is made up of\
    \ three steps; the following figure demonstrates the process:\n\n![](img/e6276d4d880001c04e81cb4db4898f1c_257_0.png)\n\
    \nFigure 9.2 – Unit testing life cycle\n\nWhen deploying distributed systems,\
    \ having a high level of confidence in your code base is vital and also lets you\
    \ worry less about introducing bugs that can have a rippling effect across microservices.\
    \ Unit tests can prove to you that the code is working the way you expect it to\
    \ and help ensure the correctness of the expected output.\n\n# ## Types of unit\
    \ testing\n\nThere are different types of unit testing. Some are for testing the\
    \ state of the **system under test (SUT)** and some are for testing interactions\
    \ between dependencies or whether an interaction was invoked:\n\n+   - **Solitary\
    \ unit test:** Tests a unit in isolation, mocking dependencies. Testing domain\
    \ services, business logic, and invariants are solitary tests.\n+   \n+     Testing\
    \ controllers of RESTful APIs is a solitary test. Inbound and outbound messaging\
    \ should be tested within the solitary test.\n+   \n+   - **Sociable unit test:**\
    \ Tests a unit and its interactions with dependencies. Testing the persistence\
    \ layer is sociable test.\n\nTesting collections of value objects is a social\
    \ test. Testing saga and transaction boundaries is a sociable test."
  merge: -1
  img_proc: true
- pgno: 258
  md: '# ## Scope of units


    Business logic in microservices is implemented by using the persistence of entities
    and value objects, and using sagas to manage those transactions. These services
    are domain services that are made up of classes. The best practice is to test
    these classes and their internal methods, which represent their behavior. This
    is accomplished by creating a test class for each class or SUT and writing a test
    for each method or function that tests the SUT behavior as expected.


    Using a solitary unit test in which an employee mocks the unit''s or SUT''s dependencies,
    such as messaging and repositories, will greatly help with test setup and maintenance.
    A use test case is a set of test input, execution conditions, and expected results
    developed for a particular objective, such as to exercise a particular program
    path or to verify compliance with a specific requirement.


    Testing should verify the behavior of the SUT or basically the software element
    or unit being tested.


    A unit or SUT can be as small as the testing of methods in a single class or as
    large as the entire application; it could also involve a collection of classes.
    It really is up to the team to decide what they define as a unit, but best practices
    are to keep them as small as possible, focused on a single responsibility. There
    are some cases where a unit can cross domain boundaries, so careful consideration
    must be given to deciding the scope of your unit definition.


    # ## Strategy


    Make unit testing the largest portion of your testing strategy, with the majority
    of your testing focused on the code and the individual units.


    Use TDD, which is important to microservices. By committing to TDD, we will ensure
    that code is tested as that''s the first thing to do after the code is written.
    It makes sense to write the test first as we need to prove that the code meets
    the specification of the business and the criteria of the use case. Therefore,
    having solid acceptance criteria in user stories or requirements documentation
    allows for the quality control team members to conduct their test and the developers
    to write code that meets the requirements.


    # ## Tools


    There are many tools and frameworks to help with unit testing, some for mocking
    dependencies and some for creating anonymous test data, such as AutoFixture. These
    tools help you with writing unit tests and with the maintenance of those unit
    tests as well.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# Frameworks and test maintenance


    Automation is an important part of the shift-left approach and testing frameworks
    such as xUnit, NUnit, or JUnit can automate the running of our unit test and can
    be an important part of our CI/CD pipelines. Testing frameworks can make test
    maintenance less painful.


    The maintenance of unit tests can be a big job and can be costly in terms of time
    and effort, so I suggest you employ supporting frameworks such as AutoFixture,
    AutoMock, Mock, and Fluent Assertion.


    # End-to-end testing


    Before we deploy our microservices into production, we need to have a high level
    of confidence that it will not cause an issue with other services or infrastructure.
    Although end-to-end testing has value, careful consideration must be given when
    employing this type of testing as it is difficult to do and costly in terms of
    time and resources.


    We need to be confident that the microservice is behaving as expected. We need
    to write a test that verifies that the service in question is interacting with
    infrastructure services and other application and domain services. To successfully
    test all of these interactions, we need all the services and databases involved
    to be up and running in an appropriate environment.


    End-to-end tests are slow and brittle and can be costly in terms of time and maintenance.
    End-to-end testing should be minimized and represents the smaller portion of our
    testing pyramid, as shown in Figure 9.1.


    The best strategy for end-to-end testing is that it is the smaller portion of
    our testing. The best practice is to write a journey test that is related to the
    journey a user takes through the system. For example, we write a test that involves
    all the operations involved in the user interaction, such as creating an order,
    updating an order, and canceling an order.


    Microservices are often made up of RESTful API services and are owned by different
    teams. We need to ensure that teams are not breaking other teams'' functionality,
    usually by breaking a contract of an interface, and the services have reliable
    and stable APIs. We need to make sure that teams do not change their APIs in a
    way that breaks the API gateway or other dependent services.


    A way to verify that all the services can interact is to have all involved services
    running, and invoke an API or trigger an event that communicates with other services.'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'When we need to ensure that services are working as expected in microservices,
    we need to test that each service interacts correctly. We need to do all the following
    to effectively conduct end-to-end testing:


    +   - All services that the app interacts with need to be running

    +   - Test UI input and correct behavior

    +   - Test UI input and correct output

    +   - The database needs to be running with data seeded


    # The two types of end-to-end testing


    There are two types of end-to-end testing: vertical, and horizontal. Let''s learn
    a bit more about it in this section.


    **Vertical end-to-end testing** is the process of testing the layers of subsystems,
    for example, testing the backend and data layers, working your way up to the upper
    layers such as UI.


    The advantages to a vertical approach are high test coverage and faster test execution.
    The test is more focused and provides a layer of safety to critical system functionality.


    The focus with vertical testing on the architecture is an area where you can take
    advantage of **test-driven deployment (TDD)** or **behavior-driven deployment
    (BDD)**. As with all testing, ensure you include stakeholders such as testers,
    business experts, developers, and product owners in developing your end-to-end
    testing to determine what is important to test and how it should be tested. This
    is important due to the fact that we are focused on business rules, logic, and
    invariants. Next, we will talk about testing the user journey through the application
    and how horizontal end-to-end testing helps in facilitating that approach.


    **Horizontal end-to-end testing**, on the other hand, is the process of testing
    a workflow or transactions that flow through multiple microservices that are involved
    in the workflow from beginning to end and checks to make sure each microservice
    correctly behaves as expected. This can include external endpoints or microservices
    out of our control, but we need to test the output of that external resource as
    well. External resources add another layer of complexity to end-to-end testing
    and require special planning and consideration.


    There are some advantages to horizontal testing, for example, the test is focused
    on the user''s journey or perspective. Another advantage of this type of testing
    is being able to discover issues with the user experience or bugs, helping to
    identify these types of issues prior to release to production. Horizontal testing
    validates and ensures that business invariants are not broken, and that business
    logic is covered and tested.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'Horizontal tests run across multiple microservices so all those microservices
    need to be up and running at the time the test executes. This is what makes this
    type of testing complex and why end-to-end testing should be a smaller portion
    of your overall testing strategy.


    Horizontal testing can include external endpoints or microservices out of our
    control, which leads us to our next topic on types of environments.


    # White box and black box environments


    In the white box type, testing users can see what is going on, have a UI to interact
    with and perform actions, and can see whether results have met their expected
    outcomes.


    During white box testing, there are some actions that are not visible to the user,
    such as calls to backend services that will return the results the user expects.
    These invisible services are called black box environments.


    These backend services are called a black box environment because the actions
    are said to be performed in the dark, out of the view of the tester or user.


    The best practice for horizontal testing is to write a journey test that is related
    to the journey a user takes through the system instead of writing a test for each
    operation.


    # Journey testing


    So, for journey testing, write one test that includes the operations involved.
    For example, if it''s an ordering system, test creating an order, canceling an
    order, and updating an order, which represents the journey a user takes.


    An end-to-end test is an acceptance test and should be treated as such. Best practice
    is to use Gherkin and some type of framework such as Cucumber or SpecFlow to run
    your acceptance test.


    # Tools


    Docker Compose can provide a way to get all the services up and running.


    Tools and frameworks can make end-to-end testing easier to manage. Use SpecFlow,
    Cucumber, or Cascade to automate these tests.


    SpecFlow and Cucumber are behavior-driven design frameworks that work with existing
    testing frameworks such as xUnit, NUnit, and JUnit. They run a test that is based
    on the Gherkin language.'
  merge: -1
  img_proc: true
- pgno: 262
  md: 'Gherkin is a human-friendly language and uses a set of special keywords as
    follows:


    +   - GIVEN is the context or state the system under test is currently in for
    this scenario.

    +   - WHEN is the action taken by a user.

    +   - THEN is the expected outcome of the action.


    These keywords give structure and meaning to an executable specification. They
    are steps that form a scenario and are translated into step definition that is
    expression and combined with a test method. Consider the following example of
    Cucumber framework step definition:


    +   - Scenario: Products selected

    +   - Given: I have 3 products


    Considering the given information, the step definition with an expression and
    a supporting Java method is as follows:


    ```

    @Given("I have {int} products")

    public void i_have_products(int int1) { }

    ```


    With this, we conclude our discussion of end-to-end testing. Another type of testing
    that is similar but more focused on a smaller scope than end-to-end testing is
    integration testing. It is deployed for testing the interaction between two separate
    microservices.


    # Integration testing


    A microservice needs to interact with other microservices, so testing these interactions
    is vital but presents some challenges. With integration testing, the primary challenge
    is that we need to test-run the instances of all the involved services (for instance,
    when testing a Web API that interacts with a database). This creates the need
    for complex setup and maintenance of these tests. In the next section, we will
    explore strategies to address these challenges.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Strategy


    Testing interactions between microservices is vital. Integration testing of microservices
    presents some challenges. We will explore some strategies you can employ. We need
    to test things such as gateways and the consumption of RESTful API endpoints and
    domain event messaging being properly consumed and whether the data and the state
    produced by these services are properly persisted into a database. Unlike end-to-end
    testing, we do not need all the services to be running; we just focus on a smaller
    set of interactions, such as the interaction between a repository class and an
    order class, testing to make sure the test order was persisted properly.


    Microservices often need to persist data in a database-like aggregates such as
    an order, in a document, or in a relational database of some type.


    We also have a service that employs patterns such as CQRS that need to read and
    write data many times, tested by using in-memory objects.


    Docker can be used to containerize the database, which can provide the integration
    database for testing. While you can use this and mocking methods to test integration,
    they can be difficult to manage and maintain. This brings us to the best practice
    of using the concept of contracts for testing the integration of microservices.
    Let''s look at contracts and how they can help us test microservice integration.


    # Contract testing


    A **contract** is a concrete example of an interaction between two services. The
    way we build these contracts depends on the type of interaction involved. Contract
    testing has two types of contracts: consumer and provider, or producer.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'The following figure illustrates the contract testing steps and the interactions
    between the consumer and the provider:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_264_0.png)


    Figure 9.3 – Contract testing


    Contacts are for both consumers and providers, which ensures that they are in
    agreement on the API level. Each contract''s interactions with consumers or providers
    are tested in different ways:


    +   - Consumer tests use the contracts to configure stubs (returns value) that
    simulate the provider, enabling you to write integration tests for a consumer
    that does not require a running provider.

    +   - Provider tests use contracts to test the SUT, using mocks for SUT dependencies.

    +   - Contract testing provides a mechanism for mocking and stubbing or integrations.
    We can use Pact.io to provide the capability of testing integrations between services
    and repositories. Contract tests can provide a test for HTTP requests or messaging
    approaches and are called pacts:

    +     1. **HTTP pact:** An expected request is what the consumer is expected to
    request. This in turn has a minimum expected response, which is the parts of the
    response the consumer wants the provider to return.'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'ii. **Messaging pact:** Contracts support modern distributed systems that use
    messaging frameworks such as RabbitMQ, Kafka, or Azure Service Bus. These types
    of interactions are called "message pacts." This is achieved by abstracting the
    frameworks out and just focusing on the message being passed between.


    # Tools


    Contract testing is the best practice for microservices integration testing and
    you can use frameworks such as **Pact.io** or **pactflow.io** to create a contract
    file that is a concrete JSON document that provides the specification of the provider
    and the consumer.


    Pact is good for designing and testing integrations where teams in your organization
    control the development of the consumers and the providers, and also where the
    consumer''s team will drive the provider''s team requirements or features. So,
    in short, Pact is best for white box integrations where the teams have a good
    understanding of the system under test.


    I encourage teams to explore contract testing for integration. To really explore
    contract testing, go to Pact.io for more information on Pact.io and Pactflow.io.


    We have explored integration testing and some best practices around it. Now we
    need to ensure that our application can meet the demands of our users and provide
    a good user experience.


    # Load testing


    Load testing can help identify issues with horizontal and vertical scaling bottlenecks
    and issues with threading or connection pools, to name a few. It can inform us
    on how we need to scale our applications or help identify any blocking calls for
    async operations. Load testing can verify latency as requests and responses flow
    through the system network.


    Microservices may have a dependency on other services or resources and these services
    can have varying degrees of performance. Some may be fast and sometimes some services
    can have an issue and run slower than expected. We need to know how the system
    will react to these varying degrees of performance and how it will impact the
    service we are testing.


    The microservice environment is dynamic and constantly changing. We need to test
    our services to see whether they can handle this dynamic nature of microservices,
    and how all of this will handle the load of active users in a production environment.'
  merge: -1
  img_proc: true
