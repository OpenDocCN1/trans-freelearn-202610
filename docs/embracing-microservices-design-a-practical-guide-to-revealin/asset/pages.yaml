- pgno: 245
  md: '# Feature management


    Microservice applications usually follow agile methodologies because they support
    agile development and quickly releasing to the market. With the agile methodology,
    the life cycle of releasing a newer version of the application spans over 2 to
    3 weeks. In such cases, there could be conditions where the application feature
    hasn''t been completed yet and cannot be shown to the end users. For example,
    you could have built an e-commerce system but the payment part hasn''t been completed
    yet, where the frontend is working but the backend service isn''t.


    In this scenario, you don''t want to show the frontend option as well and you
    need to hide this from the web application to avoid users from accessing it. Commenting
    code and disabling the frontend would require you to uncomment when the feature
    is completed, which requires deploying the frontend application again. Feature
    management should be done in such a way that it allows developers to turn the
    features on and off externally from the application, and then enable and disable
    them when they want. LaunchDarkly can be used to accomplish this.


    # Agile practices


    As we discussed earlier, microservice applications embrace agility and follow
    agile methodologies. Knowing about agile practices is an important factor to consider
    when making teams more productive as it helps them create better quality products
    and satisfy customers consistently. When all the people involved in the project,
    such as stakeholders, developers, testers, project managers, and leads, have a
    shared understanding of the goals, they are more likely to get the desired results.


    Agile teams plan continuously throughout the project, which helps them create
    applications closer to the customer''s expectations. To elaborate more about agile,
    let''s discuss some principles that are based on the agile manifesto:


    +   - Customer satisfaction is of utmost priority when building software.

    +   - Embrace change requirements, even late in the development cycle. Agile procedures
    take advantage of such changes to help customers gain a competitive advantage.

    +   - Deliver functioning software regularly, anywhere from a few weeks to a few
    months, with a preference for a shorter timeframe.

    +   - Throughout the project, business people and developers must collaborate
    regularly.

    +   - Build initiatives around people who are passionate about what they''re doing.
    Give them the space and support they require and trust them to do the task at
    hand.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '+   - Face-to-face communication is the most efficient and effective way of
    delivering information to and within a development team.

    +   - Working software is the most important indicator of progress.

    +   - Sustainable development is aided by agile procedures. Sponsors, developers,
    and consumers should all be able to keep up with the pace forever.

    +   - A constant focus on technical excellence and smart design improves agility.

    +   - Simplicity – the technique of minimizing the amount of work that isn''t
    done – is critical.

    +   - Self-organizing teams produce the finest architectures, requirements, and
    designs.

    +   - The team considers how to become more successful at regular intervals, then
    adjusts and modifies their behavior in response.


    Agile practices embrace microservices development by providing a methodology that
    minimizes the risk and overhead of large-scale developments by breaking them into
    smaller work increments and frequent iterations. It supports the prototyping approach
    by providing a solid collaboration channel for end users.


    # Rollback strategy


    Microservices can be deployed independently, without the need to interfere with
    other services. It is feasible that one team creating the service will deploy
    it bi-monthly, while the other team will deliver it bi-weekly. When a new service
    version is delivered, the service should be self-contained enough that there are
    no breaking changes.


    To understand this concept, let''s suppose that we have two services called Microservice
    A and Microservice B. Microservice A calls Microservice B to perform some operation.
    After 2 weeks, a new version of Microservice B is deployed that modifies the signature
    of the web method Microservice A is consuming and breaks the service.


    As a solution, versioning should be considered to avoid breaking changes. If a
    new version of Microservice B is deployed, there should be a way Microservice
    A can consume the old version and upgrade it at its own pace. Now, let''s suppose
    Microservice A is using the latest version of Microservice B, which is v2, and
    this version contains some issues – in this case, you cannot roll back easily
    since it breaks the operation Microservice A is performing. The rollback strategy
    should be defined in such a way that the calling service should not fail if the
    target service version is rolled back. A good practice is to always test your
    application and set up various deployment environments to test it before releasing
    it to production.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# Using gates and approvals in Azure DevOps


    Every deployment undergoes a set of approvals, especially for production apps.
    Approvals could be pre-deployment or post-deployment and initiate the deployment
    when it is approved. Azure DevOps provides an easy way to set up pre- and post-deployment
    approvals and send notifications to the respective participants; once approved,
    that stage of the deployment is triggered. On the other hand, gates are used to
    monitor the application. Once the application has been deployed, gates can be
    used to see how the application is performing and determine whether that release
    can be promoted to multiple environments or should be stopped.


    There are various scenarios where gates can be used:


    +   - To check the work items to see whether any incident or issue has been reported.

    +   - To seek approval from external systems such as Slack or Teams.

    +   - To check the pass rate and other metrics to validate the quality of the
    release.

    +   - To ensure security scans such as code signing, anti-virus checking, and
    policy checking.

    +   - To check the telemetry and health status of the application. This can be
    integrated with Azure Application Insights.

    +   - To wait for change management approval from an external system such as ServiceNow.

    +   - To validate the infrastructure against compliance rules after deployment.


    Every business aspires to deploy microservices at an enterprise scale to achieve
    high availability and scalability. The deployment stamps pattern, which we will
    explore in the next section, is one of the most important patterns that''s used
    to handle these concerns.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Deployment stamps pattern


    The deployment stamps pattern involves deploying multiple copies of the application
    or service to multiple regions. This is used to achieve high availability and
    scalability for your applications. If you deploy the application to a single region,
    you might encounter certain limitations:


    +   - Targeting a single region would impact the business in case of a disaster
    or if that region goes down for even a few minutes.

    +   - The application is being operated at a global scale, and many customers
    who are not close to the region where the application has been deployed may face
    latency issues.

    +   - Segregating the data based on customer location.

    +   - Deploying updates in a controlled manner, such as rolling out region by
    region.

    +   - Deploying updates based on customer preference and releasing new versions
    to customers who can handle the update frequency.


    As a solution, consider deploying the service to multiple locations, where each
    can operate and update independently. Each application may scale out within a
    single region and also offer high availability when deploying it to multiple locations.
    With stamps, the data is usually sharded, which allows you to keep data independently
    from other data. Each stamp could be targeting a different version and separate
    data with a schema or model. You can imagine this as an order service that''s
    been deployed to three different locations, where the orders database is kept
    separate from each location and may have a different database schema or application
    version. The following diagram depicts this pattern in detail:'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_249_0.png)


    The deployment stamps pattern allows you to implement deployment rings, which
    we will discuss in the next section.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Deployment rings


    When the user base is large, deployment rings help you deploy or roll out applications
    in phases. The first phase targets a small set of users and then increases progressively
    as the rollout happens. Releasing a major version to a large user base is risky
    compared to releasing it to a limited set of users and then rolling back when
    confidence has been built. The deployment rings can be set as follows:


    +   - **Canaries**: Users who voluntarily test the features as soon as they are
    released

    +   - **Early adopters**: Users who can take risks in using the preview features.

    +   - **Users**: Users who use the features once they have been tested by canaries
    and early adopters.


    Using stages in the Azure DevOps release pipeline helps you implement deployment
    rings. The release, once built, is deployed to canaries, and then to early adopters,
    and then to users. The following diagram depicts deployment rings in conjunction
    with Azure DevOps:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_250_0.png)


    Figure 8.9 – Ring deployments pattern


    Here, you can see Ring 1, Ring 2, and Ring 3. Ring 1 deploys the application for
    canaries to test and use, Ring 2 deploys the application for early adopters to
    use, and Ring 3 sends the program to production for everyone to use.'
  merge: -1
  img_proc: true
