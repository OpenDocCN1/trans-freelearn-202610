- pgno: 233
  md: '# # Deployment Pitfalls


    Establishing deployments for microservice-based systems requires careful thought
    and attitude. Not only are microservice-based systems broken into separate services,
    but they often use various technologies. Unlike monolithic applications, where
    deployment can be completed in a single step, this paradigm entails implementing
    a proper strategy. When setting up this strategy, it is essential to learn about
    the different deployment pitfalls that could hinder the process and how to avoid
    them throughout the journey.


    In this chapter, we will cover the following deployment pitfalls, along with the
    recommended practices that should be considered when setting up your deployment
    strategy:


    +   - Failing to establish a deployment strategy

    +   - Using outdated tools and technologies

    +   - Failing to obtain cooperation from all teams

    +   - Choosing your infrastructure before knowing the architecture

    +   - Not considering **Infrastructure as Code (IaC)** for environment setup

    +   - Not knowing the core principles of DevOps

    +   - Deployment stamps'
  merge: -1
  img_proc: true
- pgno: 234
  md: '+   - Deployment rings

    +   - Geode pattern


    By the end of the chapter, you will have learned about the deployment pitfalls
    and how to address them by defining an appropriate deployment strategy and automating
    deployments using CI/CD.


    # Failing to establish a deployment strategy


    With a deployment strategy, you deploy or update versions of your application
    in the respective deployment environments. Microservice-based applications provide
    better agility and speed than traditional applications. Developers can make changes
    quickly, and with minimal testing, a new version can be released. However, any
    code change that hasn''t been tested properly and has code quality issues will
    be open to failures and may affect the overall business. To mitigate these issues,
    developers should define a deployment strategy to check the quality of the application
    before deployment and must ensure that it is ready to be deployed. Let''s look
    at some of the deployment strategies that you can choose for your organization.


    # Rolling deployment


    The rolling deployment strategy updates all the running instances of the application
    with new instances. This is one of the easiest deployment strategies and is where
    you deploy to all the nodes where the application is running incrementally. When
    you use Kubernetes to orchestrate your containers, Kubernetes is responsible for
    updating all the containers running within Pods to the most recent version. However,
    if the new version runs into issues and fails, all the instances will fail because
    the same version will be used everywhere.


    # Canary deployment strategy


    In the canary deployment strategy, the application becomes accessible to the users
    in phases. That is, after deploying a new application version, not all traffic
    is directed to the new version; instead, a portion of traffic is directed to the
    new version, and then it gradually increases. This method is less prone to risks,
    and you have more control.'
  merge: -1
  img_proc: true
