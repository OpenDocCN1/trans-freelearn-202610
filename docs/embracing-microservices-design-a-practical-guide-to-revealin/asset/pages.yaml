    # The whole is greater than the sum of its parts


    To build microservices, we first need to understand a holistic view of our microservices
    and use a heuristic approach. We need to understand how they are integrated with
    each other, how they interact with each other, and the relationship between services.


    We need to understand what kind of data each microservice requires to perform
    its responsibility and what the microservice''s output needs to be so that it
    can meet the needs of services or endpoints that depend on the data it provides.
    It is when we lack an understanding of the bigger picture that things start to
    fall apart or bugs are introduced. We need to understand what role a microservice
    plays in the bigger picture.


    We need to understand whether a microservice serves complex business needs or
    if it is providing something more straightforward and less complex, such as meeting
    some infrastructure needs. For example, microservices can implement some complex
    business logic or provide simple generic infrastructure concerns such as repositories,
    messaging, catalog lookup, and cleanup jobs. Understanding the role our service
    plays as it pertains to the big picture will set us up for success.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'When microservices are based on complex business features, they require more
    careful consideration and analysis. In cases where microservices are responsible
    for simple tasks such as persisting data or sending and receiving messages, these
    types of services require less analysis and can be implemented using best practices.
    This difference in the responsibility needs to be analyzed and understood so that
    all the services can work together to meet the needs of the business feature or
    serve a business domain.


    Microservices combine services together to create a system as a whole but are
    made up of autonomous independent services. Let''s explore their autonomy.


    # Autonomy


    Microservices are autonomous, as a bounded context is in DDD. They are only concerned
    with their own agenda. Some characteristics to consider are outlined here:


    +   - They may not be aware of other services or even know that other services
    exist.

    +   - Microservices can be deployed separately without depending on other services.

    +   - Microservices can change the way they want to and evolve according to their
    needs.

    +   - They are only aware of their responsibilities and behavior and as far as
    they are concerned, that is all they need to do.

    +   - They know what data they need, and they know what data they need to produce.

    +   - They are not concerned with the responsibilities of other services, at least
    from their view of the world.


    But the truth is, microservices are dependent on the data they receive, and the
    provided data must meet a service''s data needs so that the service can carry
    out its task and produce an output that is required to. In some cases, this data
    can be a complex aggregate, or it may be a simple object with a few properties
    such as an **identifier (ID)** to look up or hold a reference to an external aggregate.


    If that incoming data is invalid, the service needs to reject it and not allow
    that incoming invalid data to corrupt its own internal data. If the data that
    the services are receiving is invalid, then the microservice will not be able
    to carry out its responsibilities. Therefore, microservices can have a direct
    or indirect dependency on another service and the data that dependency produces
    for them. This is common in the laws of interfaces, where interfaces define and
    enforce contracts, and contracts must be adhered to and honored in order for things
    to work.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Understanding these relationships between service and data needs is vital to
    the success of microservices as a whole. Although microservices are autonomous,
    they still need to interact with other services. They must present a contract
    or interface, and to honor contracts with other services, they must adapt and
    react to other services'' output.


    # What comes first – the data or the events?


    It could be argued that the data comes first, as we must understand the data first,
    and then we can figure out the behavior or operations that need to be executed
    on that data itself and which event needs to be raised on successful completion.
    We need to know what data we need so that the next event can occur. Do we need
