- pgno: 171
  md: '# 6

    Communication

    Pitfalls and

    Prevention


    Microservice architectures are implementations of distributed systems, where microservices
    are designed to be fine-grained, loosely coupled, and autonomous in order to deliver
    a business capability. These microservices communicate with each other across
    process boundaries, which are hosted across the network, to address different
    business use cases. The network communication is unreliable; hence, microservices
    should incorporate the necessary logic to enable effective communication across
    service boundaries to build resilience. The challenges of designing a distributed
    system are well known. They are described by Peter Deutch as assumptions developers
    make while they transition from a single-process application to a distributed
    system. These assumptions are defined as fallacies of distributed computing. The
    fallacies are as follows:


    +   - The network is reliable.

    +   - Latency is zero.

    +   - Bandwidth is infinite.

    +   - The network is secure.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   - The topology doesn''t change.

    +   - There is one administrator.

    +   - The transport cost is zero.

    +   - The network is homogeneous.


    In this chapter, we will discuss the different aspects of communication that enable
    information sharing between different components of microservices architecture
    to deliver business value. We will also discuss the challenges of different communication
    approaches and how we can address them using solutions. In this chapter, we will
    be covering the following topics:


    +   - The fundamentals of microservices communication

    +   - Different architectures and their communication styles

    +   - Direct client-to-microservice communication

    +   - The overly complicated API gateway

    +   - Request timeout

    +   - Long chains of synchronous calls – the retry storm

    +   - The dark side of event-driven microservices

    +   - Avoiding service versioning

    +   - Service meshes

    +   - Dapr versus service meshes


    By the end of this chapter, you will understand the varying ways in which microservices
    communicate with each other, their challenges, and how to address them using different
    approaches. In addition, you will learn about the importance of versioning and
    its role in the creation and evolution of microservices.


    # The fundamentals of microservices communication


    Before we start our discussion of the different communication challenges, first,
    we will explore the fundamentals of communication in a microservices architecture.
    In the next few subsections, we will briefly discuss the core concepts of communication,
    as they form the basis of a microservices architecture.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Synchronous versus asynchronous communication


    To enable communication between clients and services, we will explore the fundamental
    differences between various alternatives to help us choose the right communication
    type for our microservices. In **synchronous communication**, the client sends
    a request and waits for a response from the service. Synchronous communication
    can either be blocking or non-blocking, but the client can only continue further
    processing once a response has been received from the service. This pattern is
    also known as the synchronous **request/response pattern**. In service-to-service
    communication, request/response patterns can either be synchronous or asynchronous.
    In async API calls, the call is made, but the calling service is free to do other
    processing while the other service is working on a response. This pattern is useful
    in improving the throughput of the service.


    In **asynchronous communication**, the client sends a message to the message broker,
    which acts as a middleware between client and service. Once the message has been
    published to the message broker, the client will continue processing without waiting
    for a response. The service can subscribe for specific messages to the message
    broker and place responses back in the message broker after processing. Both client
    and service are unaware of each other and can continue to evolve without any dependency.


    In most cases, a microservices application uses both synchronous and asynchronous
    communication to address different use cases. However, if possible, asynchronous
    communication is the preferred approach, as it offers loose coupling and independence
    between microservices via messages. In the following section, let''s explore messages
    and their types.


    # Messages and message types


    A message is defined as data that is sent between the client and its receiver,
    which serves as a means of communication by exchanging information. There are
    different types of messages that are categorized based on their intent. These
    message types are described as follows:


    +   - A **command** is defined as a message sent by the client with an expectation
    that the receiver performs an action.

    +   - A **query** is defined as a message sent by the client with the intent of
    expecting a response from its receiver. The response could be a success or a failure.
    If no response is received, the client can decide to retry the request.

    +   - An **event** is defined as a message that indicates an event that happened
    in the past in the system without any expectation from the receiver. The receivers
    of the event can ignore or perform necessary actions based on the information
    provided in the event.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Asynchronous message-based communication


    In event-driven communication, services communicate with each other via events.
    Any state change of a microservice is presented in the form of an event that allows
    interested parties to subscribe to these events and perform necessary actions.
    This pattern is known as **publish/subscribe**, where a service can publish messages
    to a message broker and one or more consumers can subscribe to process those messages.
    Synchronous messaging can be converted into asynchronous messaging by introducing
    a queue that guarantees that each message is processed by one and only one consumer.
    This approach helps to decouple services, allowing them to change and scale independently.


    Having understood the fundamentals of microservices communication, let''s move
    on to discuss different application architectures and their preferred ways of
    communication.


    # Different architectures and their communication styles


    In this section, we will understand the difference between intra-process and inter-process
    communication. In addition, we will learn about the similarities and differences
    between different architectural styles with respect to communication and how they
    use the two communication mechanisms for information sharing.


    **Intra-process communication** is a mechanism that enables a process to share
    data between two threads using in-process memory, while inter-process communication
    is a mechanism that shares data between two isolated processes, either using messages
    or a **remote procedure call (RPC)**. Both communication styles are well supported,
    though it''s important to understand how different architectures drive the dominance
    of one communication style over other in an application. For example, the distributed
    system promotes the idea of inter-process communication over intra-process communication.
    However, any communication between components inside the service should be intra-process.
    Let''s explore this, in more detail, with the help of the following diagram:'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_175_0.png)


    Figure 6.1 – The monolithic, SOA, and microservices architectures


    In a **monolithic architecture**, the application is built as a single unit and
    hosted as a single process on a server. The monolithic application is composed
    of different components that are interconnected and interdependent in nature.
    Both synchronous communication and asynchronous communication are used in monolithic
    applications, but mostly, you''ll find that the communication between application
    components is synchronous, while the communication with the user interface and
    external systems is preferred to be modeled as asynchronous.


    The **service-oriented architecture (SOA)** is a company-wide approach that is
    used for building and integrating new and legacy systems using communication protocols.
    The communication between these services is performed using an **enterprise service
    bus** (ESB), which is responsible for message validation, routing, and transformation.
    In SOA, more emphasis is placed on integration and less emphasis is placed on
    the modeling of these services.


    Microservices are an implementation of the distributed system, which promotes
    the idea of inter-service communication (that is, inter-process communication)
    between microservices. Simply put, inter-service communication can be categorized
    as synchronous and asynchronous communication. The synchronous communication can
    be achieved with lightweight generic protocols such as REST or gRPC, while asynchronous
    communication is supported via queues and message brokers. It''s recommended that
    you use domain-specific protocols to handle inter-service communication, for example,
    the **Real-Time Streaming Protocol (RTSP)** for video streaming. In Figure 6.1,
    microservice A and microservice B communicate via messages using the queue, while
    microservice D and microservice C communicate via an RPC.'
  merge: -1
  img_proc: true
