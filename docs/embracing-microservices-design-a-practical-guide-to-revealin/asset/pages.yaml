- pgno: 117
  md: '# # Keeping the Replatforming Brownfield Applications Trivial


    The microservices architecture has been adopted at a rapid pace in industry recently.
    Many organizations have been adopting a microservices architecture because of
    its advantages and exploiting it by designing new applications (greenfield applications)
    or turning existing monolithic applications (brownfield applications) into microservices
    architectures. Replatforming monolithic architectures requires that you have a
    detailed comprehension of microservices. You will shift your attitude regarding
    how to use these practices to help with your journey.


    In this chapter, we will not only cover the pitfalls of replatforming brownfield
    applications but also learn how to decompose a monolithic application into a microservices
    architecture, the importance of having availability, reliability, and scalability
    in your applications, and how to build self-contained services.'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'The following topics will be covered in this chapter:


    +   - Not knowing the fundamentals when replatforming brownfield applications

    +   - Overlooking availability, reliability, and scalability when designing the
    microservices architecture

    +   - Sharing dependencies using older techniques


    This chapter aims to help you understand the process of moving from a monolithic
    application to a microservices architecture, as well as the pitfalls to be aware
    of and avoid along the way. In addition, we will also illustrate several key trends
    to consider when designing a microservices architecture.


    # Not knowing the fundamentals when replatforming brownfield applications


    When it comes to translating a monolithic application into a microservices architecture,
    ignorance is not bliss. Not all microservice projects start as greenfield applications,
    where the architects and developers have a wide set of options to design the architecture
    and build the system without refactoring or replatforming the whole monolith.
    Monolithic architectures have been common in the industry, but there are still
    certain drawbacks if the same techniques are adopted when building a microservices
    architecture.


    In the following sections, we will discuss the significance of the microservice
    architecture, the factors to consider, and the decoupling approach. Let''s get
    started!


    # Why we should go for a microservice architecture


    Let''s look at some of the things we should consider when transforming monolithic
    applications into a microservice architecture.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Easy to develop and test but you must restrain developers from adopting new
    technologies


    Monolithic applications are easy to develop and test because they are likely based
    on a set of related or well-tested technology stacks, and they have a shallower
    learning curve in terms of technology adoption. Since the projects are directly
    referenced, there is no network latency and they run as a single process. Usually,
    monolithic applications have a single database that contains all the database
    objects, such as tables, stored procedures, and the functions that are used to
    perform **Create, Read, Update, and Delete (CRUD)** operations. This is one of
    the benefits of having everything in one place, and it''s good for rapid development
    for smaller companies. However, as the company grows, monoliths slow the pace
    of innovation and development as developers end up investing much more time in
    trying to understand and handle scenarios, such as where members of other teams
    are tinkering with data that they own, more operational work because of a huge
    blast radius from minor issues, and so on. Another drawback is that it limits
    developers in bringing in new technologies when building new features; they must
    stick to the same technology the application is based upon. As the application
    grows, it becomes more monolithic, maintenance becomes difficult, and adaptability
    decreases. In the long run, it not only discourages developers from using emerging
    technologies but also becomes difficult to update, modify, release, or deploy.


    # The n-tier architecture provides SoC but has tight coupling


    The n-tier architecture is one of the most widely adopted architectures that separates
    concerns between layers. Its tight coupling, on the other hand, makes it more
    difficult to release faster to the market and requires rigorous regression testing
    before release. Changes in one place may have a cascading impact on other components,
    and altering entails a large amount of risk.


    A monolithic application is usually based on the n-tier architecture, where the
    presentation layer contains the frontend components such as pages, the view model,
    CSS, and JavaScript files. The presentation layer communicates with the service
    layer or sometimes directly with the business layer by adding a direct reference
    to the business layer. The business layer contains the core application logic
    and communicates with the data access layer to perform database operations.'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'The following diagram shows the difference between the monolithic architecture
    and a microservice-based architecture. The monolithic architecture shows two kinds
    of n-tier architectures, where the left-hand side shows a direct reference to
    the business layer inside a presentation layer, which enables direct dependencies
    between layers. On the other hand, the right-hand side of the monolithic architecture
    shows loose coupling by having a service layer exposing APIs to allow the presentation
    layer to communicate with the service layer over HTTP/HTTPS, HTTP/2, or gRPC protocols:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_120_0.png)


    Figure 4.1 – Comparing the monolithic and microservices architectures


    In a microservices architecture, the system is decomposed into a set of various
    fine-grained services, where each service is a RESTful API exposing an endpoint
    over HTTP. The presentation layer contains various frontend components and communicates
    with the backend services over standard protocols, as mentioned previously.


    # Simple deployment but expensive scaling


    Monolithic applications are simple to deploy since the application is packaged
    into a single assembly or artifact that can be deployed. Unlike microservices,
    where the application is decomposed into several services, manual deployment is
    not an option. The following diagram shows the difference between the monolith
    architecture and the microservices architecture for deployment:'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_121_0.png)


    Figure 4.2 – Comparing the monolithic and microservices architectures regarding
    scalability and deployment


    The preceding diagram shows a comparison between deploying monolithic and microservice-based
    applications. With monolithic applications, the deployment involves a risk since
    it has to be deployed as a whole, and if the application is large, changing something
    in one place may have a huge risk if it is not tested properly.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'On the microservice side, manual deployment is not recommended as there are
    many services, and the manual deployment needs more effort and time. To overcome
    this challenge, DevOps **continuous integration (CI)** and **continuous deployment
    (CD)** practices can be used to automate builds and releases. However, deploying
    any service has a minimal risk since the application is segregated into various
    services, and if any deployment fails, it only affects a certain part of the application
    and can easily be rolled back to the last good known version. Moreover, if a manual
    patch is necessary, you should use the CD pipeline, just like you would any regular
    production deployment, to not cause any further regressions. Furthermore, containerization
    enables bundling applications and their dependencies together to facilitate containerized
    microservices across environments and to enable scaling with low risk and faster
    scaling. It is difficult to containerize monolith applications due to the application''s
    size, nature, complexity, persistence mechanisms, and host environment dependencies.
    In some cases, the application needs to be refactored to be containerized, which
    may require significant efforts compared to rebuilding the application. Moreover,
    scaling the monolithic application running on a VM requires a capacity similar
    to that of a VM to scale out, and it also requires more resources regarding individual
    microservices, resulting in this being cost-prohibitive. However, with microservices,
    we can not only use the container infrastructure but also scale out individual
    services independently, without this having an impact on the overall system and
    the overall business functionality. Another huge drawback of monoliths is that
    it''s super hard to understand the CPU and memory profile, as well as optimize
    the workload, since so many modules are running at the same time. With microservices,
    that problem vanishes.


    Having understood the motives behind replatforming, let''s move on and discuss
    the factors we must keep in mind when performing replatforming.


    # Factors to consider when replatforming monolithic to a microservices architecture


    The process of replatforming a monolithic application is not straightforward.
    To understand this, let''s look at some of the aspects we should consider when
    transitioning from a monolithic architecture to a microservices architecture.


    # Knowledge of business domains


    Understanding the application''s business domain is the core factor to consider
    when replatforming. Architects and developers should spend proper time not only
    understanding the application''s underlying architecture and design, but also
    on how the data can be decomposed based on business domains. Sometimes, the UI
    screens are useful for understanding the service boundaries.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Focusing only on technology when decomposing microservices and working in an
    isolated way without involving the business stakeholder, who knows the business
    and can guide the development team to decompose them based on business capabilities
    and the domain, is not a good practice. Giving less value to this space would
    eventually affect the design of the overall architecture and make it fail to achieve
    agility. If the service is not decomposed properly, it creates dependencies, so
    changing a particular function requires multiple services to be updated and becomes
    a kind of distributed monolith. You must be aware of the change in infrastructure.


    Microservice-based applications are decomposed into several services. Each service
    runs independently, without having an effect on the other service. This is what
    brings agility and reduces the risk of changes. However, compared to monoliths,
    they are simple to host and manage. With microservices, we need to upgrade the
    infrastructure to support deploying each service into its own separate space.
    We can leverage a container infrastructure that provides isolation and easy scaling
    for each service, where each service can run inside its own container and share
    the same host operating system kernel and system resources. You can also orchestrate
    the containers using managed Azure Kubernetes Services to leverage high availability,
    auto-scaling, and increased reliability.


    Another factor to think about is network latency, which can have a direct effect
    on an application''s efficiency if the system or the underlying infrastructure
    isn''t up to par. Each service has its own database, which is hosted in the cloud
    or on-premises, and certain transactions can span over multiple services, with
    some patterns and technologies being used to create dependable services and utilize
    asynchronous communication throughout services. Before beginning this transition,
    it is vital to raise awareness about the infrastructure improvements that are
    needed.


    # Choosing the right technology and embracing the learning curve


    With microservices, one of the benefits is the adoption of technology. You can
    use any technology to build any service, unlike monolithic applications, where
    you have to rely on the underlying technology, regardless of if it is deprecated
    or obsolete. However, choosing the right technology is important.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'When choosing a technology, make sure it supports some libraries to build the
    service and handle cross-cutting concerns such as implementing logging and instrumentation,
    data connectors to connect with databases or other storage accounts, and so on.


    Performing analysis before picking a technology saves you the time you would have
    spent on reworking and the effort you have put in to learn that technology. Based
    on all these considerations, always check to see if there is enough community
    involvement and a forum where you can report issues. For instance, in many cases,
    open source software companies or individuals maintain their own GitHub sites
    where the community can contribute, check active discussions, open issues, and
    report new issues as well. For closed source software, make sure they have a support
    site where the issues can be reported.


    With a microservices architecture, you have the freedom to experiment with emerging
    technologies and build your services around them. This way, you can not only match
    your technical competence with current market trends and use the desired technology
    to develop that service, but if there are some technology-specific limitations,
    the risk will be lower since it only impacts the business capability offered by
    that microservice.


    # Go cloud native


    Cloud services are the foundation of cloud-native applications. Cloud-native services
    provide a better SLA in terms of availability, reliability, and scalability, which
    is not easy to do with an on-premises architecture and requires huge investment
    in the infrastructure.


    With microservices applications, there are numerous services, and scalability
    and availability are the most important concerns. Any service that fails to respond
    would have an impact on the business.


    There are few elements of cloud-native applications to consider, as follows:


    +   - Application design should be microservices

    +   - APIs provide access to standardized methods

    +   - Services should utilize container infrastructure

    +   - Manual deployment should be avoided and use CI and CD practices

    +   - DevOps practices should be adopted to adhere to agile development

    +   - Centralized logging and instrumentation should be maintained

    +   - Embrace shift-left testing and start testing as early as possible


    Failing to follow any of these measures would make administrating, maintaining,
    and modifying microservices difficult.'
  merge: -1
  img_proc: true
- pgno: 125
  md: "# Understanding the difference between rearchitecting and refactoring\n\nWhen\
    \ it comes to replatforming applications, rearchitecting and refactoring are two\
    \ sides of the same coin. The focus of rearchitecting is on the high-level architecture,\
    \ which includes, but is not limited to, how services interact with one another,\
    \ what communication protocols are used, and what hosting platform or deployment\
    \ strategy can be adopted. The following are some of the activities that should\
    \ be considered when rearchitecting any application:\n\n+   - Redesigning the\
    \ architecture to develop microservices\n+   - Focusing on capturing the business\
    \ value\n+   - Replacing the existing architecture components, frameworks, technologies,\
    \ or platforms to transform into the microservices architecture\n+   - Leveraging\
    \ modern application computing concepts\n+   - Embracing cloud-native application\
    \ practices\n+   - Validating the solution architecture design using a tool such\
    \ as Microsoft Threat Modeling\n\n> **Note**\n> \n> To learn more about the Microsoft\
    \ Threat Modeling tool, refer to the following link: `https://www.microsoft.com/en-us/securityengineering/sdl/threatmodeling`.\n\
    \nRefactoring, on the other hand, is primarily concerned with how to enhance the\
    \ design of the current code. Its goal is to evaluate what design patterns are\
    \ used, how the code is structured, and how it may be improved. In the context\
    \ of a microservices architecture, when refactoring a brownfield application,\
    \ some of the activities that are usually carried out are as follows:\n\n+   -\
    \ Code refactoring to align with business domains\n+   - Using OOP principles\
    \ where applicable\n+   - Using SOLID principles where applicable\n+   - Using\
    \ design patterns where applicable"
  merge: -1
  img_proc: true
- pgno: 126
  md: '+   - Code optimization by removing dead code

    +   - Analyzing Big O notation and optimizing code where applicable


    > **Note**

    > To learn more about SOLID principles, refer to the following link: https://docs.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/microservice-application-layer-web-api-design.


    Both rearchitecting and refactoring assist in transforming a brownfield application
    into a microservice-based architecture, where rearchitecting focuses on the application’s
    design and solution architecture, while refactoring assists with implementing
    that architecture through code modifications and other related techniques.


    # Understanding the difference between core microservices and API microservices


    Microservices that are consumed by other microservices are known as core microservices,
    whereas API microservices are consumed by the frontend. The core microservices
    are based on a reactive pattern, which is an approach that’s used to build a system
    based on the message-driven architecture and supports resiliency, reliability,
    and elasticity. The architects and developers should have knowledge about reactive
    systems and build core services using them. The following diagram depicts the
    core and API microservices interacting over the Event Bus:'
  merge: -1
  img_proc: true
- pgno: 127
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_127_0.png)


    Figure 4.3 – Asynchronous communication between core microservices and API microservices
    using an Event Bus


    In Azure, various services can be used to build message-driven systems. Some of
    the names include, but are not limited to, Service Bus and Event Hubs. They both
    offer a publish/subscribe model where the service can publish messages to a queue,
    and subscribers can listen to that queue to read the message.


    # Avoid chatty services


    Chatty services contain a long chain of operations and they rely on several services
    to complete one single transaction. Chatty services not only reduce the agility
    in adopting change but also heavily rely on the underlying network, database queries,
    disk reads, and various other factors. Since HTTP communication is stateless,
    if any service is inaccessible or takes a long time to respond, timeout exceptions
    may occur. If your services are heavily dependent on each other and communicate
    synchronously, it becomes a distributed monolithic architecture, and you undergo
    the same pain when a target service is down. Thus, all the services that are used
    within the transaction have to be operational at the same time a transaction occurs.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'To overcome this challenge, the approach is to decompose services while following
    **domain-driven design (DDD)** and build services based on business domains. There
    are scenarios where interaction with other services is still required, which can
    be solved by implementing a message-driven architecture. There are patterns such
    as Saga that help you avoid synchronous communication between services and use
    a message broker to support asynchronous communication. However, this does not
    mean that synchronous communication is an anti-pattern; it depends on the usage
    and business scenario. For example, data services, notification services, or workflow
    services are some examples where synchronous communication could be the right
    choice.


    Versioning also plays an important role when building REST-based services. You
    should always version a service when the service contract is changed. When versioning,
    make sure that all changes are both backward and forward compatible. Once all
    the callers have moved to the new version, we can potentially remove some of the
    backward compatibility code. This avoids breaking other services that are dependent
    on that service and gives the developers a chance to update it at their own pace.
    Furthermore, this also allows you to slowly deploy the new service and enable
    easy rollback in case of any issues during one box/canary testing.


    # Development, delivery, and operations readiness


    Building a microservices architecture is not simple and requires good knowledge
    of the technologies and patterns to address challenges. Complexities can emerge
    in development, delivery, and operations.


    Development complexity arises when developers are asked to use different patterns
    to address challenges. For example, implementing distributed design and service
    interaction patterns such as Saga or CQRS requires having a practical understanding
    and knowledge about how to use them and their approaches. Since these patterns
    are not normally used with monolithic architectures, developers are usually not
    familiar with them. Furthermore, since any service can be built on any technology
    that is best suited to the underlying business scenario, it may require a learning
    curve and adequate preparation to develop the service.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'On the database side, since each service can keep its data in its own database,
    you can easily build a polyglot persistent architecture and use the technology
    that best suits that business functionality. However, it might take some effort
    to build the database model. Therefore, to build one service, a developer should
    know not only the design patterns but also when to use which technology. Considering
    an e-commerce system, we can choose Azure Table Storage to store cart information
    instead of using some relational database. However, for order management, SQL
    Server or any NoSQL databases can be used as well.


    Delivery complexity arises when there are multiple services based on different
    technologies, and each service requires a different set of tasks to build and
    deploy applications. Container infrastructure solves this problem to some extent
    since you can containerize services once and deploy them to any environment using
    DevOps CI/CD practices. Microsoft Azure DevOps provides end-to-end application
    life cycle management capabilities and offers lots of connectors to build CI/CD
    pipelines for any technology or platform and deploy to any environment.


    > **Note**

    > You can set up a free account for Azure DevOps Services at https://dev.azure.com.


    Operational complexity comes when you deploy your services to production or staging
    environments. Services should be resilient and scalable, and choosing the right
    platform is very important. If your services are running inside containers, you
    can use managed **Azure Kubernetes Services (AKS)** to set up a desired state
    for containers, and also set various metrics to auto-scale your AKS cluster or
    pods when it suffices for that metric condition. For monitoring, tools such as
    Azure Application Insights, Grafana, Prometheus, and Jaeger help with monitoring
    your services and spinning up alerts to send notifications. Organizations should
    have a shared governance practice in place where they can spend resources to provide
    company-wide standardization solutions for things such as building, deploying,
    orchestrating, and monitoring microservices.


    Now that you have a thorough understanding of the factors to remember when refactoring
    monolithic applications into a microservices architecture, let''s look at the
    decoupling approach.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# The decoupling approach


    The decoupling approach is a process that can be followed when moving from a monolithic
    application to a microservices architecture, and it undergoes various phases.
    The first and most important phase is to understand the overall business architecture
    of an application and to identify the domains. Following DDD practices, you can
    categorize business domains into core, supporting, and generic domains, and start
    with the simplest service, which can easily be extracted and have less impact
    on the overall system. On the other hand, if you already have a new requirement,
    you can simply build that new requirement as a separate service and integrate
    it with the existing system. Services that are classified as generic domains are
    simpler to decouple than ones that are part of the core domain. For example, the
    authentication service can be categorized as a generic domain since it is not
    the main business of the application, even though it supports the application
    by providing user authentication and authorization. Such kinds of services are
    easy to decouple and the transition is smooth. Going forward, once all the generic
    services have been decoupled, the next phase you can start is building the supporting
    domain and then the core domain. The following diagram shows how to decompose
    the authentication module from a monolithic application to a new microservice:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_130_0.png)


    Figure 4.4 – Decomposing an authentication service that is the least dependent
    on a monolith application'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'When decoupling services, keep the dependencies as minimal as possible. For
    example, if the decomposition is done for a particular business domain, take the
    tables and recreate them in a separate database. You can not only alter the database
    schema but also use any other persistence technology to keep its domain-specific
    information. If some transactions span multiple services, start decomposing the
    service that has minimal dependency on other services.


    Since the monolith to microservices transition is not a one-step process, to keep
    the actual application up and running, you need to replicate the data to let the
    system work. This is needed until all the services are decomposed as separate
    services.


    The following diagram shows the purchase workflow of a standard e-commerce system.
    Once the user hits the checkout service, the user is taken to a payment gateway
    to pay, the order is generated, and an email notification is sent:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_131_0.png)


    Figure 4.5 – Series of operations that occur when the checkout operation is used
    in an e-commerce system


    Considering the previous example, the first service to transition is a notification
    service that has no dependency on other services. However, order generation is
    dependent on this service because when the order is generated, the notification
    needs to be sent out.'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'When decomposing services, some services may need to have a call go back to
    the existing monolithic application to keep the functionality running. This is
    because if there are other modules of the monolith using the same functionality
    somewhere in the database or at the application level, we need to build an anti-corruption
    layer just to synchronize the data and keep the functionality of that monolith
    working. When building the anti-corruption layer, you can build a new API for
    the monolith that communicates with the monolith application, and the new microservice
    communicates with that monolith API instead of having references or code to communicate
    to the existing monolithic directly. This practice helps isolate the monolithic
    concepts. The following diagram shows the approach of decomposing the invoice
    generation service and using an anti-corruption layer to keep it functional:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_132_0.png)


    Figure 4.6 – Adding an anti-corruption layer when decomposing the service'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'Decoupling can be done by vertically splitting the n-tier architecture based
    on the business domains, decomposing each service one at a time, and then creating
    a new service for each vertical layer that contains domain-specific models. You
    must create a separate database and use the right persistence technology to keep
    its domain-specific information. Once the service has been built, you must modify
    the frontend so that it consumes the new service''s endpoint. Until all the services
    are decomposed, you can replicate the data to keep the monolith working and implement
    an anti-corruption layer, also known as a **glue code pattern**. The frontend
    makes a call to the new service, where the new service makes a call to the new
    monolith API to keep the monolithic database updated. While decomposing, you can
    adopt different techniques and patterns to implement distributed transactions,
    synchronous and asynchronous communications, and so on. Once all the services
    have been decomposed, the monolithic database can be archived, and each service
    will have its own persistence store where it can store its domain-specific information.
    The following diagram depicts a few of the modules of an e-commerce application,
    as well as the steps to decompose it from a monolithic application to a microservices
    architecture:


    # Steps of converting Monolith Application to Microservices


    ![](img/e6276d4d880001c04e81cb4db4898f1c_133_0.png)


    Figure 4.7 – The step-by-step process of decomposing a sample monolith application
    into a microservices architecture'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'When decoupling services, you can either reuse some part of the existing monolithic
    application code in your microservices or rewrite it completely. If the application
    is tightly coupled with other modules, it cannot be easily decoupled and it is
    a better trade-off to rewrite it. Every application has its own complexities,
    and this can be determined based on the efforts needed to decouple them. Also,
    with monolith applications, it''s not necessary for the service you are trying
    to decompose to be extracted and mapped to the monolith business module.


    When decomposing the monolithic application, you must decouple the services that
    are simpler to decompose and have fewer dependencies. In the preceding diagram,
    we begin by decomposing the notification service, which is less dependent on other
    services and can easily be unplugged. Decoupling the most basic service first
    minimizes the chance of delivery teams failing to correctly operate the microservice
    and understanding how the decomposition will work. Once the notification service
    has been decomposed, the authentication service can be decomposed, then invoice
    generation, and so on. Until all the services have been decomposed, you need to
    implement the glue code pattern, as discussed previously, to replicate the data
    to the monolithic database to keep the system functional. Once all the services
    have been decomposed, the glue code pattern can be removed.


    When decomposing, it is critical to understand certain patterns that can be used
    to build reliable services. In the following section, we''ll go over the significance
    of availability, reliability, and scalability.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# Overlooking availability, reliability, and scalability when designing a microservices
    architecture


    As microservices architecture is distributed in nature and involves lots of services
    communicating over a network, reliability and availability, along with scalability,
    become important factors. Developers sometimes overlook the benefits of these
    factors and don''t think outside the box to build an architecture that supports
    these concerns. In a microservices architecture, services have dependencies on
    other services and along with asynchronous communication, there is also synchronous
    communication, which requires the other service to be responsive at the time you''re
    performing some operation or serving an end user request. If the service is not
    available, it affects the transaction. Moreover, when a service is experiencing
    a lot of traffic, it needs to be scaled out and if the underlying infrastructure
    does not support quick scaling, this will impact the operation and create inconsistencies
    across databases. As a side note, you should build systems in a way that they
    should be capable of handling any minor inconsistencies on their own. For example,
    if an end user request has to write to two services, a cheaper way than using
    a transaction is to write to them one by one and handle inconsistencies on the
    read path; that way, you don''t need to bother with transactions as rolling back
    is very tricky in such scenarios.


    Let''s take a closer look at why availability, reliability, and scalability are
    major determinants to consider.


    # Availability


    Availability is the percentage of time a service is operational and handles requests.
    We need to keep things available to that agree by creating achievable targets
    that have been pre-agreed or committed to our customers. The availability of a
    service depends on how frequently the service fails, and how quickly it recovers
    after a failure. As a general rule, availability can be calculated using the following
    formula:


    Availability in percentage = (Total elapsed time – Total downtime) / Total elapsed
    time * 100'
  merge: -1
  img_proc: true
- pgno: 136
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Various patterns can be used to build reliable services. Some of the most common
    ones are the retry pattern and the circuit breaker pattern.


    # The retry pattern


    The retry pattern is used to enable resiliency in an application by making multiple
    attempts to connect to a faulty service that is failing due to transient errors.
    Retries with exponential backoff should be reattempted until the retry counter
    reaches its maximum limit. However, super-fast retries end up causing retry storms
    and cascading failures.


    In a microservices architecture, this pattern is very common; each service is
    hosted as a separate service and transient and communication errors are common.
    All the calls are made to the service over a network, and if there is a loss in
    network connectivity, it creates service timeouts and operation failures. These
    transient faults are usually self-correcting, and if the process is repeated after
    a while, it might be successful.


    If the service is not responding and the consumer application receives an error,
    it can handle it using the following strategies:


    +   - **Retry:** If the error is transient, make the call immediately to the service
    to get a success response. However, a bad implementation of such a retry can bring
    the whole service and many others down. For example, if you configure for retrying
    on, say, failure A 5 times, and the upstream service is having an issue, it will
    suddenly have 5 times the load and will have an even harder time recovering.


    +   - **Retry with delay:** This will have some delay before making the next call
    to the failing service. The retry will happen based on the retry limit you have
    set.


    +   - **Cancel:** If the error is not transient, it may cancel the operation since
    the operation might not be successful, even it is repeated, and there is no reason
    to keep the consumer waiting. In this case, it is good to fail fast and let the
    consumer know why the service has failed.


    The following diagram depicts a scenario where the retry pattern can be used:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_137_0.png)


    Figure 4.8 – Using the retry pattern between an application and a service'
  merge: -1
  img_proc: true
- pgno: 138
  md: 'In the preceding diagram, an application is making a call to the service that
    is failing. The application implements a retry pattern to retry up to three times
    if the service fails.


    # The circuit breaker pattern


    Sometimes, the errors are not transient and not related to any network connectivity
    or communication. This means that the fault is not temporary and requires effort
    to remediate. These faults could be related to service maintenance, redeployments,
    bugs in the application, or just a sudden spike in traffic because of end user
    behavior. Sending every request to undergo the retry approach is not a good practice.
    If the service is failing due to other reasons, it is elemental to fail fast and
    return a fallback response. This is where the circuit breaker pattern can be used.


    Just like the retry pattern, the circuit breaker pattern can be implemented as
    part of the microservice''s implementation. This pattern can also be implemented
    by frameworks, service meshes, or API gateways. It works in three states, as follows:


    +   - **Closed:** It is like an electronic circuit – if the circuit is closed,
    the request will reach the target service. The initial state is a closed state,
    where all the requests are sent to the target service.

    +   - **Open:** When a service fails to respond, the circuit becomes open for
    a limited time. In this state, none of the requests will reach the target service
    and fail fast. You can also return a fallback response to a consumer with a friendly
    message such as *"We are doing some maintenance, please try again after a while."*

    +   - **Half-open:** The circuit becomes half open once the waiting time has elapsed
    in the open state. The first request will be allowed to be sent to a target service.
    If the service successfully responds, the circuit is closed; otherwise, it will
    open again for a limited time, as configured.


    The following diagram depicts the circuit breaker pattern:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_138_0.png)


    Figure 4.9 – Using the circuit breaker pattern between an application and a service'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'In the preceding diagram, when the first request was made, the circuit was
    closed. When the service responded with an HTTP 500 error, it opened the circuit
    for a specific amount of time. When the circuit was open, none of the requests
    were sent to a target service. Once the time had elapsed, the circuit became half
    open and allowed the first request to be sent out. Finally, when the service responded
    with an HTTP 200 status code, the circuit was closed once more.


    You can also use the circuit breaker pattern in conjunction with the retry pattern
    so that when the circuit is closed and the request fails, it will not open the
    circuit until the retry counter reaches its maximum retry limit. The following
    diagram shows using the retry pattern in conjunction with the circuit breaker
    pattern:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_139_0.png)


    Figure 4.10 – Using the retry pattern in conjunction with the circuit breaker
    pattern


    Various libraries allow you to easily implement the retry and circuit breaker
    patterns. The following table shows the most common ones that are used for .NET
    and Java applications:


    | Library | Platform | More Information |

    |---|---|---|

    | Polly | .NET applications | https://github.com/App-vNext/Polly |

    | Netflix Hystrix | Java applications | https://github.com/Netflix/Hystrix |


    Let us next see how important scalability is when designing a microservice.'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Scalability


    One of the key advantages of microservices is that they enable businesses to scale
    out services separately. Companies transitioning from a monolithic architecture
    to a microservices architecture have an idea of how to update their systems, but
    they may struggle with what is usable or how it will benefit them if they implement
    it. A monolithic application running within a VM, for example, is not a better
    trade-off than microservices running within containers. The infrastructure team,
    who are well-versed in VMware or Hyper-V, may need to build skills in areas such
    as containers, Kubernetes, and others, whereas developers may need to build skills
    in terms of adopting different design patterns, container knowledge, and so on.


    Cloud-native applications usually leverage the benefits of managed services in
    the cloud that offer good SLA and easy management. For example, if you plan to
    host your container inside an AKS instance, you can easily set up auto-scaling
    for your cluster or pods. Moreover, if you plan to host your app as an App Service
    that also provides auto-scaling, there are various other services that provide
    similar capabilities.


    Apart from infrastructure, the service should be built in a way that supports
    scalability. There are many scenarios in which the application will fail when
    you scale out. For example, if you are building stateful services and keeping
    the cache within the container itself, they would fail when you scale out. Since
    the other container does not have access to that cache, the same state cannot
    be used, even if it creates its own local cache. To address this concern, you
    can, for example, use a distributed cache such as Azure Redis Cache or build services
    on Azure Service Fabric, which provide a complete framework of building stateful
    services. Another example is when you want to keep data such as logs or application-specific
    data private to the container. Scaling out the container will make the data distributive,
    resulting in inconsistencies and making maintenance harder.


    Microservices are independent and self-contained. We''ll look at why sharing dependencies
    is one of the drawbacks and how to build self-contained services in the next section.


    # Sharing dependencies using older techniques


    In the n-tier architecture, each layer has a direct reference to the other layer,
    which makes it tightly coupled and dependent. With microservices, this is one
    of the anti-patterns. There are cases where one service needs to call another
    service to complete a transaction. In this case, the service is dependent on the
    other service. To overcome this challenge, you can build self-contained services.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# Building self-contained services


    Self-contained services help you collaborate with other services using patterns
    such as Saga and CQRS. Instead of making direct HTTP calls, the source service
    communicates with the other service over a message broker. The source service
    publishes a message, and the other service reads the message and responds. One
    approach is to keep two queues for requests and responses. That way, both services
    can communicate asynchronously over this channel.


    The following diagram shows the collaboration between services over an asynchronous
    communication channel:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_141_0.png)


    Figure 4.11 – Implementing request and response queues to establish asynchronous
    communication between services


    If **Service A** wanted to get some data from **Service B**, it must publish the
    message to the request queue. Since **Service B** is subscribed to that queue,
    it will read the message, process it, and then write the response in the response
    queue. **Service A** needs to subscribe to the response queue so that when the
    response is published, it is received by **Service A**. Each service maintains
    two separate sessions to publish and consume messages from request and response
    queues. This approach helps reduce I/O resources and allows services to function
    in non-blocking mode, as well as serve a much larger set of requests in comparison
    to synchronous HTTP communication. Implementing this technique for all cross-service
    communication may not be the best option and should be considered based on the
    business scenario. For example, due to asynchronous communication, it may participate
    in multiple communications without assuring you that the sequence of responses
    is preserved in the order of the incoming requests. To overcome this challenge,
    you can add a unique identifier, also known as a correlation token, to each message,
    which can be used to correlate with the original message.'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'Another technique is to implement **Command Query Responsibility Segregation
    (CQRS)**, where **Service A** can keep a local copy of the data from **Service
    B** by catching it. This synchronization between two services could be done using
    an event-driven approach. If any change occur in the **Service B** database, it
    will publish a message to synchronize the **Service A** database. In this case,
    **Service A** can read the local database copy instead of making a call to **Service
    B**. To learn more about Saga and the CQRS pattern, please refer to *Chapter 5,
    Data Design Pitfalls*.


    # Reinventing is not an anti-pattern in microservices


    Reusing and sharing the dependencies in monolith applications is a good practice.
    Many technological companies who develop software maintain their own frameworks
    to reduce their development efforts and reuse any functionality when needed. However,
    when transforming an application from a monolith into a microservice, reusing
    the existing component to build a new service is not only difficult but also restricts
    you from adopting new technologies and frameworks.


    In microservices, reinventing the wheel is healthy. Companies cannot benefit from
    the technological advances of new technologies if they don''t reinvent. Using
    the existing components of the framework with a monolith will restrain them from
    adopting newer technologies, which will reduce their ability to be agile and technology-agnostic.


    Shifting from a monolithic application to a microservice model often allows technical
    teams to innovate at their own speed and scale according to their needs. Teams
    can experiment with innovative technologies to develop new services. The risk
    factor is reduced compared to a monolithic system because if one part fails, it
    does not impact the whole system.


    Understanding such pitfalls is vital when developing or migrating to a microservices
    architecture. Taking all of these considerations into account will help you seamlessly
    transition from a monolithic application to a microservices architecture.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Summary


    In this chapter, we learned about the importance of replatforming monolith applications
    into microservice architectures and how to decompose them. Transitioning from
    a monolithic architecture into a microservices architecture is not simple, and
    there are many factors and pitfalls to consider. Availability, reliability, and
    scalability are important factors when decomposing an application, and failing
    to give them importance is one such pitfall. Hence, we went through some concepts
    around availability and scalability, and we learned about the patterns that are
    used to build resilient microservices. Last but not least, we addressed the disadvantages
    of using the same components of monolithic applications and not reinventing the
    wheel to take advantage of emerging technologies that provide better alternatives.


    With this knowledge, you can begin your journey of decomposing the current legacy
    applications into microservice architectures and reap the benefits of all the
    factors we''ve addressed in this chapter. The next chapter will focus on the pitfalls
    to avoid when building a microservice data architecture. You''ll learn about common
    anti-patterns to avoid when constructing a data architecture and how different
    approaches can be used to ensure data continuity and help construct autonomous,
    flexible, and robust microservices.


    # Questions


    +   1. Why should you migrate from a monolithic application to a microservices
    architecture?

    +   2. What are the factors to consider when replatforming a monolithic application
    to a microservices architecture?

    +   3. Why are availability, scalability, and reliability important and how can
    you implement them?


    # Further reading


    For more information regarding what was covered in this chapter, take a look at
    the following resources:


    +   - *Practical Microservices*, by Umesh Ram Sharma'
  merge: -1
