- pgno: 237
  md: '# Blue/green deployment strategy


    The blue/green deployment strategy necessitates running two production environments
    concurrently. Here, one is considered a stable environment, known as blue, while
    the other is considered a staging area for deploying new versions, known as green.
    You can easily deploy new versions to the green deployment and then roll them
    out to the blue environment once they are stable. Rolling out a new version can
    be achieved either by deploying new versions or by switching the traffic to the
    new environment.


    The following diagram depicts a blue/green deployment strategy:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_237_0.png)


    Figure 8.3 – Blue/green deployment strategy


    Blue/green deployment is simple to set up and poses less risk as it provides a
    dedicated environment for testing new versions. Testing is simple and rolling
    back does not affect the business. Only when the service is stable is it moved
    to the blue environment.


    On the other hand, creating an environment that''s similar to blue (production)
    is complicated, and testing may not cover all the aspects that the system does
    in a live environment. To implement an environment that''s similar to the blue
    one, you need to double the resources, though this means that additional costs
    will be incurred.'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# Traffic shadowing deployment strategy


    With the traffic shadowing approach, all the requests that come to the blue environment
    are routed to the green deployment as well. Unlike the blue/green deployment strategy,
    a specific percentage of traffic isn''t routed; instead, all the traffic is mirrored
    across both environments. This allows us to monitor all the scenarios and how
    they operate in the new version. There are a few considerations to be made to
    ensure that if the green environment performs some work, it will not affect the
    production data. It is recommended to ensure that all the endpoints, database
    connections, and other configuration values are referring to the green environment
    and not touching the production environment.


    Service meshes help you invoke services that are hosted as part of the green environment.
    Here, you can use tools such as Istio and Envoy. These tools help you shadow the
    traffic automatically and provide some additional information, mentioning whether
    this request is shadowed or not. Envoy adds -shadow as the suffix to the hostname.
    So, for example, if the hostname is `orderservice:5000`, the shadow host becomes
    `orderservice-shadow:5000`. The following diagram depicts a traffic shadowing
    deployment strategy:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_238_0.png)


    Figure 8.4 – Traffic shadowing


    Here, the load balancer is using Envoy to route traffic to both environments at
    the same time. All the requests that go to the blue environment go to the green
    environment as well, and the new version can be tested side by side.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Deploying Pods in Kubernetes


    Kubernetes is one of the pioneer platforms for orchestrating your containers and
    works best for production workloads. In Kubernetes, you can deploy and provision
    various kinds of resources. The deployment resource in Kubernetes holds pod-related
    information, as well as the replica set, which determines the number of containers
    that need to be provisioned.


    These resources can be provisioned either from the K8s portal or by using the
    `kubectl` command. The `kubectl` command interacts with the K8s API server, which
    schedules the task of provisioning that resource. When the deployment is executed,
    the Pods get provisioned in the K8s cluster, as per the desired state defined
    in the deployment. When you redeploy the deployment and change the configuration
    so that it refers to the new image version, K8s performs several checks on the
    Pods, such as *liveness checks* and *readiness checks*, to name a few. The liveness
    check determines whether the Pod should be automatically restarted if your application
    is deadlocked. On the other hand, the readiness check determines whether your
    application is ready to serve.


    The following diagram shows how to deploy `order-service` to three Pods inside
    the K8s cluster:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_239_0.png)


    Figure 8.5 – Traffic shadowing


    Now, if you want to deploy v2 of `order-service`, you can provision a new deployment
    object. In this case, it will create the first Pod (the fourth Pod in the cluster)
    for version 2.0 and then perform the liveness and readiness checks. If both checks
    are successful, one Pod will be deleted and a new Pod for version 2.0 will be
    created. This cycle goes on until all the Pods, as per the replica set, get provisioned
    and the old ones are deleted. A delay may occur between Pod creation since these
    checks may take some time to ensure there will be no downtime.'
  merge: -1
  img_proc: true
