- pgno: 44
  md: '# Dependencies


    In the Twelve-Factor App, the dependencies should be isolated and explicitly declared
    via a dependency declaration manifest. The application should not depend on the
    host to have any of its dependencies. The application and all its dependencies
    are carried together for every deployment. For example, a common way of declaring
    Node.js application dependencies is package.json, for Java applications, it''s
    pom.xml, and for .NET Core, it''s .csproj. For containerized environments, you
    can bundle the application with its dependencies using Docker for deployment across
    environments. The following diagram depicts how application dependencies are managed
    outside the application''s repository and included later as part of container
    packaging:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_44_0.png)


    Figure 1.4 – Application dependency isolation and its inclusion via a Docker file


    Containers help in deploying applications to different environments without the
    need to worry about installing application dependencies. **npm** is a package
    manager that''s responsible for managing packages that are local dependencies
    for a project. These packages are then included as part of container packaging
    to build container images.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Config


    A single code base allows you to deploy your application consistently across different
    environments. Any application configuration that changes between environments
    and is saved as constants in the code base should be managed with environment
    variables. This approach provides the flexibility to scale an application with
    different configurations as they grow. Connection strings, API keys, tokens, external
    service URLs, hostnames, IP addresses, and ports are good candidates for configs.
    Defining config files or managing configs using grouping (development, staging,
    or production) is error-prone and should be avoided. You should also avoid hard-coding
    configuration values as constants in your code base. For example, if you are deploying
    your application in Azure App Service, you can specify configuration values in
    the Azure App Service instance rather than inside the application''s configuration
    file. The following diagram demonstrates deploying a container image to different
    environments with different configs:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_45_0.png)


    Figure 1.5 – Application deployed to different environments with different configs


    A container image represents the template of a microservice and is compromised
    of application code, binaries, and dependencies. The container image is then deployed
    to the production and staging environments, along with their configurations, to
    make sure that the same application is running across all environments.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Backing service


    A backing service is a service dependency that an application consumes over a
    network for its normal operation. These services should be treated as attachable
    resources. Local services and remote third-party services should be treated the
    same. Examples include datastores (such as Azure SQL or Cosmos DB), messaging
    (Azure Service Bus or Kafka), and caching systems (Azure Redis Cache). These services
    can be swapped by changing the URL or locator/credential in the config, without
    the need to make any changes to the application''s code base. The following diagram
    illustrates how different backing services can be associated with a microservice:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_46_0.png)


    Figure 1.6 – How an application can access and replace backing services by changing
    access URLs


    This diagram depicts a running instance of a microservice hosted inside a container.
    The microservice is consuming different services that are externalized using parameters.
    Externalizing backing services helps microservices easily replace backing services.


    # Build, release, and run


    The deployment process for each application should be executed in three discrete
    stages (build, release, and run), as follows:


    +   - The **build** stage compiles a particular version of the code base and its
    assets, and then fetches vendor dependencies to produce build artifacts.

    +   - The **release** stage combines the build artifacts with the config to produce
    a release for an environment.

    +   - The **run** stage runs the release in an executing environment by provisioning
    processes, containers, or services.'
  merge: -1
  img_proc: true
