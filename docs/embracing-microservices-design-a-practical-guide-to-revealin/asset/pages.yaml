- pgno: 76
  md: '# Not a silver bullet


    Even though we will not use DDD to solve all our problems, such as in the case
    of developing in simple and complicated contexts, as we explored in the Cynefin
    framework, we will discuss simple and complicated contexts during knowledge-crunching
    brainstorm sessions to identify what is complex and what is not. Then, we can
    focus most of our analysis efforts and experimentation on complex domains. You
    will want to put your best people and direct more resources and efforts toward
    these complex domains, or what is called a core domain in DDD.


    Core domains make our business unique, set us apart from our competition, and
    give us an edge. Core domains are the domains we will focus much of our efforts
    on, as opposed to complicated and simple contexts, which are supporting domains
    or subdomains in DDD. Subdomains deal with infrastructure concerns or simple data
    persistence operations. These subdomains are still important, as we need to understand
    their role in a holistic view of our problem space or business domain.


    It is vital that we have a holistic view of our problem space and understand what
    core domains and supporting domains are. This will inform us of which services
    we need to create. Armed with this understanding, we can go about building the
    type of service we need, whether it is a supporting type of microservice of a
    subdomain or a core domain microservice with a high level of complexity. The microservices
    we build need to support the domain model.


    DDD is not really one thing, but rather, it is a collection of best practices
    much like DevOps, which has been described as a collection of people, processes,
    and tools. DDD was designed by Eric Evans with the agile process and concepts
    of **continuous integration/continuous delivery (CI/CD)** in mind and employs
    well-known strategic and tactical patterns from the likes of Martin Fowler and
    Robert Martin. It is based on best practices of **separation of concerns (SoC)**,
    clean architecture, and SOLID principles, and includes Martin Fowler''s domain
    module, to name but a few. This collection of lessons learned and best practices
    that DDD follows will help us to solve complex business problems and distill our
    business model down into abstractions that employ model-driven design.


    Model-driven design is a concept in itself but, as mentioned previously, DDD is
    made up of best practices, and model-driven design is employed as part of DDD.
    Model-driven design provides us with a way of translating our business logic model
    into a software model that we will use to build an application—or in our case,
    our microservices. By understanding the role that DDD plays, we can build microservices
    that meet the unique needs of our business domain.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Next, we will look at how we slice up business domains into boundaries. This
    can be done on a whiteboard and is meant to be informal to facilitate a conversation.
    Don''t worry about perfection at this point—this is more about discovery.


    # Boundaries are important


    Boundaries are not new to OOP, as with the concept of encapsulation, which we
    use to hide our internal implementation details and only expose them through a
    well-defined interface. As we move to microservices architectures, we will soon
    realize the need to have a deeper understanding of those boundaries and how we
    integrate within the boundaries themselves and with external boundaries. The boundaries
    represent a different business concept or support a similar concept but operate
    off a different model with different concerns or responsibilities within the application''s
    own overall boundary, as shown in the following diagram:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_77_0.png)


    Figure 2.5 – Slicing up the boundaries of an application


    As we have discussed before, we build our domain model based on the abstraction
    of business reality, and from that abstraction, we understand the boundaries of
    our domains—not just on what''s inside those boundaries, but we also need to understand
    the edges of the boundaries as well as the relationships between those boundaries
    of our domains. We use the UL we developed by knowledge crunching with the domain
    experts and the development team to define those contextual boundaries. This leads
    us to the concept of bounded contexts. This is where we begin the process of aligning
    our domain logical model to a tactical implementation of the model in code, which
    will translate into a microservice or a collection of microservices.'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'A bounded context aligns with the domains we have identified and will form
    our microservices and establish our boundaries around them.


    # Bounded contexts


    As we build microservices, we align them to a bounded context, and those bounded
    contexts align with a particular domain model. The bounded context makes up the
    components of the domain model, from the database scheme to behaviors and domain
    objects. Each bounded context has its own UL, its own model, and sub-models.


    As we can see once again, a bounded context aligns with microservices, as each
    bounded context can be one microservice or a collection of microservices.


    Once we define our bounded context, we need to better understand how they are
    related, and we can do this with a very loose sketch known as a context map, as
    demonstrated in *Figure 2.6*.


    # Context maps


    To understand the relationships between our bounded context and how they fit together
    in the bigger picture, we create a context map. This map is a great communication
    tool for development teams as it helps facilitate a conversation about technical,
    tactical, and integration issues. A context map helps us to visualize the lay
    of the land, understand communication between contexts, and understand how the
    teams aligned to a different bounded context communicate with each other as well,
    as shown in the following diagram:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_78_0.png)


    Figure 2.6 – Bounded context in a context map'
  merge: -1
  img_proc: true
