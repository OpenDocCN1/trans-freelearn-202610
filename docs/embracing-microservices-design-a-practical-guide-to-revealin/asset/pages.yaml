- pgno: 89
  md: '# # Microservices

    ## Architecture Pitfalls


    These days, many organizations are looking to bring agility as part of their product
    supply chain and optimize every aspect of their delivery process by incorporating
    customer feedback. Most of these organizations are already on a journey to adopt
    the new ways of building applications. DevOps, cloud-native, containers, and microservices
    are the front-runners in helping these organizations to differentiate themselves
    from their competitors.


    **Microservices** is an evolutionary architecture where lessons learned from prior
    architectures are addressed to avoid potential pitfalls. It is important to understand
    these pitfalls to avoid making the same mistakes while building a microservice
    architecture and making things even worse. Microservices have many advantages,
    but careful planning and design is required to reap their long-lasting benefits.


    In this chapter, we will evaluate different architecture patterns in the light
    of microservices design principles to learn how different choices can affect the
    microservice architecture. To support this explanation, we will use an example
    of an e-commerce application and apply different architecture patterns to understand
    their impact.


    The following topics will be covered in this chapter:


    +   - Layered architecture and its challenges

    +   - Over-architecting microservices'
  merge: -1
  img_proc: true
- pgno: 90
  md: '+   - Overusing frameworks and technologies

    +   - Not abstracting common microservice tasks

    +   - Lack of knowledge about the microservices platform

    +   - Neutralizing the benefits of microservices by adopting a frontend monolithic
    architecture


    By the end of this chapter, you will be able to understand the motivation behind
    different architecture styles adopted in microservices, their pitfalls, and their
    potential solutions. In addition, we will discuss how over-architecting microservices
    and trying out a variety of tools, technologies, and frameworks can lead to an
    increase in the complexity and manageability of microservices.


    # Layered architecture and its challenges


    The **layered architecture** is a software architecture approach where applications
    are organized as a set of components in multiple layers. Each layer contains multiple
    components addressing a specific area of concern, where each layer can only communicate
    with its associated underlying layer. This way of communication helps in avoiding
    cyclic dependencies in a layered architecture. The layered architecture does not
    specify the number of layers, but it''s common to observe four layers (the **presentation
    layer**, **business logic layer**, **data access layer**, and the **database layer**)
    in most applications. The layered architecture helps organizations create different
    teams aligned with different technical capabilities while they build applications.


    However, the ability to make changes in a layered architecture is a constraint
    due to the tight coupling between different layers. As applications grow, making
    changes becomes more time-consuming due to a lack of understanding of different
    domains inside the application. Any change needs to be thoroughly analyzed by
    different teams for its impact before implementation, which increases communication
    between teams. The deployment frequency of these applications is usually time-consuming
    and requires building, testing, and releasing the complete application. If different
    teams are working on different feature branches, then these branches should be
    merged into the master branch. Deployment in a production environment is usually
    planned and scheduled in off-hours, which results in application downtime. Compared
    to DevOps, the deployment cadence of layered applications is usually every quarter.


    Microservices give teams the freedom to choose the right architectural style for
    their implementation, whether it''s a layer, tier, or something else. Let''s take
    a closer look at the microservice architecture in terms of layering schemes.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# Microservice architecture


    The layered architecture is not a bad practice; it allows teams to structure code
    in different layers to help them understand services. Adopting a layered architecture
    to implement a microservice could be the right choice as your microservice starts
    getting heavier. However, in the light of microservice design principles, every
    team has complete autonomy to choose the right technology for building each microservice.
    The following diagram is a schematic representation of the microservice architecture
    for an e-commerce website:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_91_0.png)


    Figure 3.1 – Microservices with different layering schemes'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'The preceding diagram demonstrates a microservice architecture with different
    microservices, each with its own layering scheme. Let''s discuss each microservice
    here:


    +   - The **cart microservice** is responsible for managing customer carts while
    shopping. The service is developed using Node.js and Redis cache using the *service*
    layer. The service layer contains business logic and data access logic to persist
    data in the Redis cache.

    +   - The **product microservice** is responsible for managing products. The service
    is developed using PHP and PostgreSQL using multiple layers (service, business,
    and data access).

    +   - The **image compression microservice** is responsible for compressing product
    images for display. It has only one layer that encapsulates all the logic that''s
    necessary for processing images.

    +   - The **order microservice** is responsible for managing customer orders.
    The service is developed using .NET Core and Azure SQL using multiple layers (service
    and data access).

    +   - The **payment gateway microservice** is responsible for managing payments.
    The service is developed using Java and Azure Cosmos DB. The microservice has
    only one layer that encapsulates all the logic necessary for processing payments
    and persistence.


    In theory, the microservice architecture brings more flexibility and autonomy
    to microservices by allowing you to choose a variety of technologies. However,
    it comes with a caveat, where each technology has its own pitfalls and operational
    characteristics. An organization may miss out on building internal expertise and
    a knowledge base due to the proliferation of these technologies, and the ramp-up
    time gets longer when engineers switch teams. Also, it becomes quite difficult
    to create and have shared library components as various languages are being used
    in the organization. In practice, organizations prefer to consolidate on fewer
    technologies. Next, we will explore how designing individual microservices can
    affect the maintainability, deployability, and scalability of microservices.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Over-architecting microservices


    **Over architecture** or **over-architecting** is a subjective term and has a
    lot of room for debate but in my opinion, it''s the time and effort you put into
    solving architecture problems you don''t have or can foresee, which results in
    an architecture that''s hard to read and follow. As an architect, you should always
    be striving to make the overall architecture more understandable and maintainable
    to support future enhancements. Architecting microservices can be overwhelming
    enough to influence teams to look for similarities across the system and apply
    generic solutions rather than focusing on use cases. For example, if too much
    time is spent on over-architecting the application earlier in the project, this
    may result in precious time being lost, which causes delays when it comes to starting
    coding activities. A lot of the time, application design evolves as teams become
    more knowledgeable about the use cases. In the next few sections, we will cover
    the common pitfalls when it comes to over-architecting microservices.


    # Entity microservices


    **Entity microservices** is an architectural pattern where microservices are designed
    to be fine-grained and modeled around a single entity. In most cases, these microservices
    contain simple **Create, Read, Update, and Delete (CRUD)** methods. An example
    of such an entity microservice is demonstrated in the form of a cart microservice:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_93_0.png)


    Figure 3.2 – Entity microservice'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'In the preceding diagram, the cart microservice has been designed as an entity
    microservice that only exposes CRUD methods. The presentation layer is built using
    **React.js**, which can invoke methods that are available in the cart microservice.
    The drawback of using an entity microservice is its limited functionality to address
    a variety of business use cases. In this scenario, the consumers of the entity
    microservice need to implement additional capabilities to address business use
    cases related to the cart microservice. Another way to address this challenge
    is to build aggregate microservices that incorporate business capabilities. This
    requires coordination between different entity microservices to address a variety
    of business use cases, as shown in the following diagram:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_94_0.png)


    In the preceding diagram, the cart aggregator microservice has been introduced
    to incorporate additional business capabilities. Let''s take a look at this in
    more detail:


    +   - **Add Items** is a business capability that allows customers to add multiple
    items to the cart. You can enhance this functionality by checking the inventory
    before placing these items in the cart.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   - **Clean Cart** is a business capability that''s exposed to the end user
    to clear the shopping basket rather than individually remove items from the cart.

    +   - **Calculate Cart Value** is a business capability that helps customers view
    the total value of the shopping basket. The cart microservice invokes the methods
    that are available in the product pricing microservice to fetch product pricing.
    This microservice can then be enhanced by adding features such as **CalculateShippingCost**.


    The following diagram depicts a microservice architecture that involves entity
    microservices and aggregator microservices:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_95_0.png)


    Figure 3.4 – The entity microservice and aggregator microservice in action'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'The preceding diagram demonstrates the interaction between multiple entity
    microservices and aggregator microservices in an application. As entity microservices
    only offer limited functionality, most of the features are implemented in aggregator
    microservices, which results in creating dependencies between multiple microservices.
    It also introduces semantic coupling, where a change in one microservice introduces
    changes in other microservices, which then adds communication overhead that impacts
    the microservice''s overall agility.


    # The aggregator microservice


    In a microservice architecture, there are different ways that a client can communicate
    with different microservices. In a smaller project, you can get away with directly
    invoking microservices, specifically when you have a server-side client app such
    as ASP.NET. However, dealing with clients such as desktop apps and mobile apps
    is more difficult as each client may have its own limitations and requirements.
    Maintaining multiple connections with these microservices is another challenge
    that you need to be aware of as you start adding more microservices.


    As the application becomes more complex, it''s not uncommon to see microservices
    breaking the rules of the bounded context and adding extra functionality that
    doesn''t belong to the microservice. Handling cross-cutting concerns such as data
    transformation, authentication, authorization, and protocol translation should
    not be part of a business microservice; rather, it should be delegated to a separate
    microservice. We will call this an API gateway microservice. This microservice
    is responsible for managing client connections and load distribution across different
    microservices, along with handling some cross-cutting concerns. This approach
    helps us reduce the number of invocations from the client to address parts of
    the chatty behavior of the architecture. The following diagram depicts the direct
    interaction between the API gateway microservice and other microservices in the
    system:'
  merge: -1
  img_proc: true
- pgno: 97
  md: "![](img/e6276d4d880001c04e81cb4db4898f1c_97_0.png)\n\nIn the preceding diagram,\
    \ the API gateway microservice invokes different microservices before adding items\
    \ to the shopping cart. The sequence of calls is as follows:\n\n+   1. The API\
    \ gateway microservice invokes the **product microservice** to fetch the product\
    \ information specified by the customer while browsing the website.\n+   \n+ \
    \  2. The API gateway microservice invokes the **product pricing microservice**\
    \ to fetch pricing information about the products that have been specified. If\
    \ you are selling products in different countries, then the API gateway microservice\
    \ may have to perform currency conversion as well.\n+   \n+   3. The API gateway\
    \ microservice invokes the **promotion microservice** to fetch all the applicable\
    \ promotions for customers and apply discounts before compiling the final pricing.\n\
    +   \n+   4. Once all the necessary information has been gathered from different\
    \ microservices, the API gateway microservice will add items, along with their\
    \ prices and promotions, to the shopping cart."
  merge: -1
  img_proc: true
- pgno: 98
  md: 'In one way, the API gateway microservice has enabled business microservices
    to focus on their intended purpose rather than making synchronous calls to other
    microservices, but it has also increased the responsibility and complexity of
    the API gateway microservice. This raises two important questions:


    +   - Can we simplify the API gateway microservice and decouple it from backend
    microservices?


    The aggregator microservice pattern can help you build microservices that are
    responsible for orchestrating communication between different microservices. The
    aggregator microservice acts as a single point of contact that''s responsible
    for calling different microservices and gathering data to perform a business task,
    while the API gateway microservice is dedicated to addressing cross-cutting concerns.
    The following diagram shows the interaction between different microservices, including
    the aggregator microservice and the API gateway microservice:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_98_0.png)


    Figure 3.6 – The role of the API gateway and aggregator microservice'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'In the preceding diagram, the API gateway microservice is acting as a gateway
    for the backend microservices, allowing different clients to connect and consume
    microservice functionality. The client is unaware of any of the microservices,
    or the architecture being used to build these microservices. The API gateway microservice
    is also responsible for addressing cross-cutting concerns. The aggregator microservice
    can act as a façade for the API gateway microservice. The aggregator microservice
    invokes the necessary microservices to fetch the relevant information before populating
    the shopping cart.


    Building an API gateway microservice is not recommended. Instead, you should use
    an API gateway as a service that can handle scalability and availability concerns
    for you. Azure API Management is a managed service that can help you publish your
    APIs to different clients for consumption. Also, it is recommended that you have
    multiple API gateways exposing limited business capabilities or addressing a particular
    client type (web, mobile, or tablet). Multiple API gateways will be covered in
    detail in *Chapter 6, Communication Pitfalls and Prevention.*


    +   - **Can we address the chatty nature of the architecture?**


    The materialized view pattern helps you keep a local copy (read model) of the
    data of other microservices that''s necessary for the primary microservice to
    be more self-sufficient. This pattern helps in eliminating calls to other microservices
    to increase the response time and reliability of microservices. Adopting this
    pattern will result in duplicating data across microservices, though duplicating
    data in cloud-native applications is not considered an anti-pattern. Make sure
    that only one microservice owns the data; the other microservices can have read
    models of the data. The read models are synced between microservices. Read models
    are usually synced using asynchronous messaging patterns using publish/subscribe
    patterns. The read models are designed to offer better performance using additional
    indexes, aggregates, and data storage formats to reduce the processing time. The
    materialized view needs to be published for the first time to make sure that the
    necessary data is available for the primary service to function. One important
    aspect that needs to be considered while building a materialized view is the cost
    of keeping multiple copies of data and the business impact if the data in a materialized
    view is stale.'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'The following diagram demonstrates the interaction between the cart microservice
    and the inventory microservice when using the materialized view pattern:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_100_0.png)


    Figure 3.7 – Materialized view pattern


    In the preceding diagram, the cart microservice keeps a read model of the inventory
    microservice, where it uses the pub/sub model to receive updates from the inventory
    microservice. Once the items have been added to the shopping cart, the cart microservice
    notifies the inventory microservice to reduce its count, which informs all its
    subscribers. You can see that other microservices are still accessed via the same
    communication pattern, which is due to the dynamic nature of these microservices
    (sub-domains). For example, pricing and promotions are more dynamic, and changes
    to pricing or promotions may have business implications. In such cases, it''s
    a good idea to prefer fresh data over materialized views. You should implement
    eventual consistency to sync the read model, and also consider implementing a
    compensating transaction pattern to address any data consistency failures. Let''s
    have a look at another use case, where materialized views are more useful:'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_101_0.png)


    Figure 3.8 – Materialized view of the search microservice


    In the preceding diagram, the search service is using a read model to store data
    from different services to become self-sufficient while serving its users. Also,
    it''s important to understand that presenting stale data in search results may
    not have the same implications as the cart microservice.


    # Nanoservices


    **Nanoservices** is an architecture pattern where services are designed to be
    more fine-grained compared to microservices. These services are responsible for
    doing strictly one task. Nanoservices are built as LEGO® blocks that can be used
    alongside other nanoservices to deliver functionality.


    Nanoservices have the following characteristics:


    +   - Small and fine-grained

    +   - Independently deployable

    +   - Testable

    +   - Reusable'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'The following diagram illustrates how a microservice can be decomposed into
    various nanoservices:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_102_0.png)


    Figure 3.9 – Nanoservices


    In the preceding diagram, a microservice is being decomposed into multiple nanoservices
    to achieve finer granularity, where nanoservice A can communicate with the other
    nanoservices in the ecosystem. This communication pattern is not limited as any
    of these nanoservices can invoke other nanoservices in different ways to enable
    parallel processing, pipelines, workflows, and events. Each nanoservice can be
    built, tested, and deployed independently. In nanoservices, a nanoservice can
    be reused by other nanoservices to perform a function.


    A nanoservice is too fine-grained compared to a microservice. A nanoservice has
    a single responsibility, but it doesn''t follow the principles of domain-driven
    design and bounded context. A business capability is usually scattered across
    different nanoservices, which encapsulates fragmented business logic that results
    in communication overhead between nanoservices. This affects the ability of one
    nanoservice to deliver any meaningful functionality. It also affects engineering
    velocity and increases maintenance overhead.


    Teams should focus on building microservices by isolating business capabilities
    rather than greedily approaching every service to become a microservice, resulting
    in a huge number of nanoservices. Understanding *domain-driven design* is the
    key to building services with a bounded context to deliver a business capability.'
  merge: -1
  img_proc: true
- pgno: 103
  md: '> **Note**

    > Nanoservices have their space in the software world and in my opinion, they
    have yet to see their prime. Serverless technology is playing an important role
    in making nanoservices mainstream and driving their adoption. These days, more
    and more architectures are being designed to include microservices and nanoservices.


    When designing microservices, it’s important to understand the business domains
    that offer business capabilities. Services that are too fine-grained that offer
    limited functionality often introduce dependencies that neutralize the benefits
    of microservices and give birth to distributed monolithic architectures. In the
    next section, we will explore how overusing frameworks and technologies can create
    maintainability issues for teams, as well as how this can be addressed with a
    carefully thought-out strategy and a shared governance model.


    # Overusing frameworks and technologies


    Adopting microservices comes in different flavors, where on one hand, teams are
    learning and incorporating new tools, technologies, and frameworks. On the other
    hand, teams are building custom tools to facilitate their development and operations.
    Having many options is good, but not having a shared governance model that can
    help evaluate tools, technologies, and frameworks is a perfect recipe for failure.
    This can affect the overall agility of teams, since there is every possibility
    of shifting their focus from delivering business value to investing time in infrastructure
    and tooling.


    Microservices provide teams with autonomy, where teams can choose the right technologies
    for their architecture to help them increase engineering velocity. Learning and
    evaluating different operating environments, programming languages, orchestration
    platforms, event platforms, and security are important aspects of microservices
    tooling. These tools, technologies, and frameworks have various capabilities that
    help organizations build a microservice architecture. As microservices is an architecture
    style, it doesn’t provide any specific guidance on tooling that may result in
    inconsistent development practices and adding more complexity to the system. For
    example, the **circuit breaker pattern** is a common pattern that can be implemented
    as part of the microservice’s code base, third-party library (Polly or Netflix
    Hystrix), or service mesh (Linkerd or Istio).'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'It’s a good practice to have a consistent way of applying these patterns across
    the code base, which will help reduce code and increase the maintainability of
    the application. One of the widely used patterns for evaluating tools, technologies,
    and frameworks is the capability/feature matrix. As an example, we have provided
    an evaluation of different service mesh technologies by using the capability/feature
    matrix here. The concept of a service mesh will be discussed in Chapter 6, Communication
    Pitfalls and Prevention:


    | Features | Istio | Linkerd | Consul | Traefik Mesh |

    |---|---|---|---|---|

    | Architecture |  |  |  |  |

    | Platform | K8s & VMs | Kubernetes | K8s & VMs | Kubernetes |

    | Ingress Controller | Istio Ingress or Istio Gateway | Any | Envoy and Ambassador
    | Any |

    | High Availability | Yes | Yes | Yes | Yes |

    | Secure Communication |  |  |  |  |

    | mTLS | Yes | Yes | Yes |  |

    | Certificate Management | Yes | Yes | Yes |  |

    | Authentication and Authorization | Yes | Yes | Yes |  |

    | mTLS | Yes | Yes | Yes |  |

    | Communication Protocols |  |  |  |  |

    | TCP | Yes | Yes | Yes |  |

    | HTTP/1.x | Yes | Yes | Yes |  |

    | HTTP/2 | Yes | Yes | Yes |  |

    | gRPC | Yes | Yes | Yes |  |

    | Traffic Management |  |  |  |  |

    | Blue/Green Deployments | Yes | Yes | Yes |  |

    | Circuit Breaking | Yes | Yes | Yes |  |

    | Fault Injection | Yes | Yes | Yes |  |

    | Rate Limiting | Yes | Yes | Yes |  |

    | Observability |  |  |  |  |

    | Monitoring | Yes (Prometheus) | Yes (Prometheus) | Yes (Prometheus) |  |

    | Distributed Tracing | Yes | Some | Yes |  |

    | Other Features |  |  |  |  |

    | Ops Complexity | High | Low | Medium |  |

    | Deployment | Install via Helm and Operator | Helm | Helm |  |

    | Multi-cluster | Yes | No | Yes |  |

    | Testing | Yes | Limited | No |  |


    Table 3.1 – Comparison of service meshes'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'In the preceding table, we have illustrated different factors that can help
    you evaluate different service meshes. This will help you choose the one that''s
    the most appropriate for your project. You should also consider including technology
    support and community adoption as parameters for evaluation. You can apply a similar
    technique to evaluate other technologies – for example, evaluating different log
    management solutions, different NoSQL databases, or caching technologies.


    Microservices is an evolutionary architecture, which means that the architecture
    should evolve as new requirements arise. To begin, teams should concentrate on
    the fundamentals of microservices to define and decompose them. It is preferable
    to begin with the tool and technologies that are required and then adopt new technologies
    as the need arises, after careful consideration. In the next section, we will
    explore how avoiding abstracting common microservices tasks can affect a team''s
    ability to reduce complexities and adopt change.


    # Not abstracting common microservice tasks


    **Abstracting microservices** is a practice used in the implementation of microservice
    architecture. Mostly, the abstraction layer sits on the API gateway layer, which
    provides various cross-cutting concerns for abstracting common tasks. However,
    there are various tools available in the market that allow abstraction without
    adding abstraction to the API gateway layer and help with performing common tasks.


    Not abstracting microservices seems to be an anti-pattern since it requires learning
    effort at the team level, plus it introduces challenges concerning the limitations
    of the underlying technology and the platform you are targeting. For example,
    let''s say you are building a service in the Go language, and the message broker
    doesn''t support the SDK to communicate with that service. In this case, if we
    can create an abstraction layer that communicates with the message broker, the
    service will help the team consume it, instead of reinventing the wheel. If the
    microservice architecture consists of polyglot technologies, you can imagine the
    effort that would be required.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'Microservices development is challenging as there are limited tools and programming
    model runtimes for building distributed applications. These programming model
    runtimes have limited language support and tightly controlled feature sets that
    target specific infrastructure platforms with limited portability across clouds
    and the edge. Dapr addresses all these concerns by abstracting the backend services
    to make developing microservices easy. The following are a few of the benefits
    offered by Dapr:


    +   - Dapr provides the common patterns for building distributed applications
    as building blocks that can be reused across the microservice application. These
    building blocks help in externalizing dependencies and allow developers to focus
    on business domains by incorporating business capabilities to deliver value to
    their customers.

    +   - Dapr helps in building cloud-agnostic microservices using any language.
    This helps simplify the process of developing microservices by keeping applications
    portable.

    +   - Dapr is an open source and cross-platform framework that''s highly extensible
    and works with any programming language using HTTP and gRPC APIs.

    +   - Dapr also provides a language-specific SDK to make development easy in different
    languages, rather than just relying on HTTP and gRPC APIs.

    +   - Dapr performs service discovery on behalf of microservices to allow them
    to call each other without specifying their location. Dapr also performs protocol
    translation between services and automatically enables communication using mTLS.


    Dapr is one of the frameworks that supports abstracting your microservices and
    offers a set of building blocks to accommodate common microservices needs. We''ll
    explore this in detail in the next section.


    # Dapr – LEGO® for microservices


    **Dapr** is an open source distributed application runtime that addresses the
    complexities of distributed systems. It also allows you to dedicate your time
    to focus on business logic, thus increasing developer productivity. Dapr is a
    portable and event-driven runtime that facilitates different aspects of building
    microservice-based applications on the cloud and the edge.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'The Dapr runtime can be operated in self-hosted mode or Kubernetes mode. In
    Kubernetes mode, Dapr injects a sidecar into the pod to enable the sidecar to
    make service calls on behalf of the application. This makes the application logic
    simple and lightweight, where Dapr takes care of the overhead associated with
    the distributed application architecture. Applications are written in different
    languages, which means they can use the available SDKs to consume the Dapr runtime
    via HTTP or gRPC APIs. Dapr offers its capabilities in the form of building blocks,
    each addressing a set of common challenges related to distributed systems, as
    illustrated in the following Dapr architecture:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_107_0.png)


    Figure 3.10 – Dapr architecture


    Each building block provides a specification (API) which can have multiple implementations,
    implemented as Dapr components. This helps you choose the right implementation
    that''s tailored to your application. We will discuss each building block in more
    detail in the following sections.


    # Service-to-service invocation


    In a microservice architecture, different microservices communicate with each
    other to complete a business task. Service-to-service invocation helps in addressing
    the common communication challenges regarding service discovery, distributed tracing,
    error handling, and retries.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# State management


    Microservices are designed to tolerate failures. These microservices have internal
    states that need to be preserved beyond the lifetime of individual microservice
    instances to make these microservices fault-tolerant. Dapr provides the state
    management building block to allow you to use any key/value store to manage the
    microservice''s state.


    # Publish and subscribe


    The publish/subscribe pattern enables decoupled interaction between microservices,
    where interested microservices subscribe to individual topics and listen for messages
    that have been published by different microservices. Dapr provides the publish/subscribe
    building block to enable the publish/subscribe pattern of communication.


    # Resource bindings


    Bindings provide a way of extending Dapr functionality by enabling external systems
    to communicate with Dapr-enabled applications. There are two different types of
    bindings:


    +   - **Input bindings** are triggers that enable Dapr microservices to react
    to external events.

    +   - **Output bindings** allow us to invoke external systems using Dapr.


    # Actors


    The Dapr actor runtime is an implementation of the virtual actor pattern. It''s
    considered an isolated, single unit of compute. These actors receive requests
    that are executed individually in a single thread. Once the execution is complete,
    the actor can be garbage-collected based on the configuration.


    # Observability


    Dapr provides an observability building block to help you observe the behavior
    of Dapr-enabled microservices using metrics, logs, and traces. Dapr also supports
    distributed tracing by correlating traces across service boundaries to give you
    complete visibility of service interactions.


    # Secrets


    Dapr''s secrets building block provides a consistent set of APIs for integrating
    a variety of secret stores, including HasiCorp Vault, Azure Key Vault, and Kubernetes
    secrets, with your microservices. Dapr-enabled microservices can call these APIs
    to retrieve secrets.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '> Note

    > You can learn more about Dapr at https://dapr.io/.


    Dapr can be hosted in multiple environments, including self-hosted environments
    for local development or to deploy to a group of VMs, Kubernetes, and edge environments,
    such as Azure IoT Edge. In the following section, we''ll go over the significance
    of being knowledgeable about microservices platforms.


    # Lack of knowledge about the microservice platform


    A microservice platform is a fully managed platform that orchestrates a cluster
    of machines to deploy microservices. Kubernetes is one such platform for hosting
    microservices that can help you achieve better scalability, availability, and
    resilience for your applications. Managing and securing microservices platforms
    at scale requires significant investment in skills and tooling. Organizations
    have formed dedicated teams to manage multiple clusters in their production environment.


    In the next subsections, we will learn how the adoption of containers, cloud-native
    applications, and micro platforms can accelerate the development and operations
    of microservices.


    # Embracing containers


    *Containerization* is the process of packaging applications with their dependencies
    (binaries, libraries, and configuration files), excluding the operating system,
    which makes them very light and portable. The package is known as a container
    image and is stored in the container image registry. A container image can be
    deployed across multiple environments (private cloud, public cloud, local machine,
    and multi-cloud) consistently while retaining its functionality to run multiple
    container instances to serve its users. Each container instance runs in its isolated
    user space to make sure that the failure of one container does not affect other
    containers in the ecosystem.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '*Virtualization* has certainly helped organizations with the agility to allow
    them to create multiple environments and make use of unused capacity available
    on the hypervisor host. However, hosting applications on virtual machines is still
    a lengthy process that includes installing guest operating systems, libraries,
    and applications. It is a recommended practice to dedicate hosts for individual
    applications to avoid any dependency hell. The following diagram shows a comparison
    between hosting applications on virtual machines and containers:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_110_0.png)


    Figure 3.11 – Virtual machines versus containers


    Compared to virtual machines, containers are very small in size and share the
    same OS kernel. Multiple containers can be hosted on a single virtual machine
    to increase their density. In most cases, containers are disposable, where new
    changes can easily be rolled out by replacing old containers with new containers,
    without this affecting the underlying operating system. There is one exception,
    however, and that is when these containers run stateful services such as databases
    or persistent storage. With the widespread use of containers across businesses,
    legacy apps that were originally developed as stateful applications are being
    refactored to operate as containers. Converting such legacy apps into stateless
    containers will need a significant upfront investment. Due to these factors, container
    vendors consider stateful containers as an important aspect of the container platform.'
  merge: -1
  img_proc: true
