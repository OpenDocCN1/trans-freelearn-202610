- pgno: 65
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_65_0.png)


    Figure 2.2 – Simple, complex, or complicated problem


    I would like to introduce you to a framework that helps in deciding whether we
    are dealing with a simple, complicated, or complex problem. The framework that
    will help on this path is the Cynefin framework developed by the scholar David
    J. Snowden. Let''s explore this scientific-based approach.


    In the next diagram, we see Snowden''s five decision-making domains:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_65_1.png)


    Figure 2.3 – The Cynefin framework helps determine what approach we need to take
    to solve problems


    We will explore each area on the map and see how this may help us in deciding
    on what type of microservice we need to create and what type of problem the microservice
    is addressing.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The Cynefin framework contains five decision-making contexts or "domains":
    simple, complicated, complex, chaotic, and a center of disorder.


    By understanding these five domains, we can access how we should approach the
    creation of our microservices and determine their complexity and which domain
    they fall into according to the Cynefin framework definition of a problem domain.


    Let''s examine each of the five domains in greater detail to fully understand
    how this relates to building microservices.


    # Obvious contexts – "the domain of best practice"


    An obvious context is known as a best-practice domain.


    # Approach


    In this context, the problem is well understood and the solution is clear. We
    need to Sense – Categorize – Respond, as follows:


    +   - Sense the situation

    +   - Categorize or organize

    +   - Apply an appropriate well-known solution


    An obvious context is made up of well-known solutions or processes and does not
    require an expert to determine the correct course of action.


    # Risk


    The danger with best practices is that teams can try to apply best practices due
    to previous success when this is not appropriate. Avoid a one-shoe-fits-all mentality
    when deciding on a solution. Teams can make assumptions that a previous approach
    will work again. Doing this can lead a team into the chaotic domain, which is
    illustrated in Figure 2.3 with the cliff or wave symbol at the bottom between
    the chaotic and obvious domain borders. To avoid this danger, teams should be
    willing to try new ideas and listen to suggestions from domain experts and stakeholders.


    # Snowden''s complicated contexts – "the domain of experts"


    A complicated context is in the domain of good practice.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Approach


    In this context, a problem can have several possible solutions and requires an
    expert to determine the best course of action. The team understands the questions
    that need to be answered and who to ask to get answers.


    We need to Sense – Analyze – Respond, as follows:


    +   - Sense the situation

    +   - Analyze the situation and ask the right questions

    +   - Apply an appropriate well-known solution based on experts'' recommendations


    # Risk


    Teams become too dependent on experts in complicated situations while dismissing
    creative solutions from the **subject-matter experts (SMEs)** inside an organization.
    To overcome this, assemble a team of people with experience of a wide variety
    of levels of seniority, and members of management at all levels in the organization.


    # Snowden''s complex contexts – "the domain of emergence"


    A complex context is in the domain of emergent solutions.


    # Approach


    In this context, the problem solution is unknown, and even the questions we need
    to ask are unknown. A complex domain requires development, analysis, and experimentation.
    Execute and evaluate to gather knowledge by observing the results of repetitive
    experimentation and collaboration with domain experts and stakeholders. The goal
    of a complex domain is to move the problem into a complicated domain.


    We need to Probe – Sense – Respond, as follows:


    +   - Probe the problem space

    +   - Sense a solution through experimentation and observation

    +   - Apply an appropriate solution based on knowledge gained through analysis—an
    experimentation solution is only obvious once it is discovered'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Risk


    Ensure that the team includes SMEs and business domain experts during the entire
    process. Accept that failure may be a part of the learning process, and this can
    be mitigated by using agile development processes with short feedback loops. We
    start with very little understanding and build our domain knowledge over time
    until we have obtained rich domain knowledge and can move the solution into a
    complicated context.


    Communication is the key to success. Assemble a wide-ranging group of people,
    from domain experts to developers, to design creative solutions to solve complex
    problems. Use brainstorming processes such as event storming to gain a deep understanding
    of the problem by encouraging business experts and deployment team members to
    have a conversation, and challenge assumptions to eliminate ambiguity.


    # A thin line between complicated and complex


    Complicated and complex situations look very similar in some ways, and it can
    be challenging to tell which one of them you''re experiencing. One good determining
    factor can be that if you need to make a decision based on incomplete data, then
    chances are that you''re more likely to be in a complex situation. Complex situations
    are where DDD shines and where we need to probe the business domain and sense
    a solution by knowledge crunching and experimenting in an iterated agile way with
    business domain experts. The following diagram illustrates where DDD fits into
    the Cynefin framework:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_68_0.png)


    Figure 2.4 – The Cynefin framework where DDD is used to solve a complex problem'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Let''s move on to the next context of chaos and discuss what should we do in
    the midst of chaos, which is take full control.


    # Snowden''s chaotic context – "the domain of novel solutions"


    A chaotic context is in the domain of novel solutions.


    # Approach


    A domain of chaos is where a problem or situation is out of control and the first
    order of business is to stabilize the situation or to contain the issue at hand.
    Many times, this requires a quick fix, which may not be the best solution, but
    as long as it stabilizes the issue, it is good enough for the time being.


    We need to Act – Sense – Respond, as follows:


    +   - Act to implement a quick stabilizing solution

    +   - Sense: assess the situation and determine the next steps

    +   - Respond: take action to move the problem to a complex context


    # Risk


    In order for a chaotic solution to be successful, we must conduct a risk assessment
    to determine risks and prioritize them. During a crisis, it is important to obtain
    accurate information by way of effective communication. This information will
    help you move a problem into a complex domain. Again, as previously mentioned,
    lack of knowledge can land you in a chaotic domain, so knowledge should be a priority.


    Many times, we find ourselves in a disordered space when we start out, as shown
    in Figure 2.4, as disorder is the starting position.


    # Snowden''s disorder contexts – "the space in the middle"


    A disorder context is a space in the middle of the starting point.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Approach


    A domain of disorder is when you don''t know where you are, so you are in disorder.


    We need to Assess – Sense – Move, as follows:


    +   - Assess the information you have

    +   - Sense what you know and what you don''t know, then gather enough information

    +   - Move to the correct context based on the information you gathered to develop
    a solution


    # Risk


    In analysis paralysis, you can get caught up in an endless loop of analysis when
    you need to seek experts to help with the assessment phase.


    # Our path is clear


    Once we have determined whether the problem is simple (obvious), complicated,
    or complex, we are better informed on which approach we should take to solve the
    problem associated with that business domain or business feature we are trying
    to address or solve.


    If the problem is simple (obvious), we can use best practices—for example, catalog
    lookup. If it is a common business problem, we can buy something off the shelf
    or use a well-defined framework. The point here is that we don''t have to write
    custom code; we can employ some pre-existing tool or process to handle that context
    and its data and behavior.


    If the problem is complicated, we can employ an expert to help implement good
    practice and suggest which tools or frameworks we need, or a combination of them,
    to handle the needs of that microservice''s responsibilities.


    If we determine we are dealing with a complex problem space, we can use DDD "probe
    sense respond" and discover emergent behavior that evolves from a greater understanding
    of the problem domain. This can be achieved by using event storming and a DDD
    model-driven approach, both of which we will explore next. Let''s start with event
    storming.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Event storming


    Event storming is a workshop-based methodology that is very effective at helping
    you to quickly gain an understanding of business workflows and obtain a deeper
    knowledge of the business domain in order to deploy software that meets the needs
    of the business. Compared to other methods, it is extremely lightweight and interactive,
    intentionally requires no computers to be conducted, and focuses on the language
    of the business. The result is expressed in colored sticky notes: orange for events,
    blue for commands, yellow for aggregates, light purple for policy, hot pink for
    issues, green for a read model (view of the data needed by a user to make a decision),
    and light pink for external dependencies, all of which are placed on a wide wall
    from left to right along a timeline. The business process is "stormed out" as
    a series of domain events that are denoted as orange sticky notes with business
    and development team members present working together, which is referred to as
    team model building. This requires a facilitator.


    Event storming was invented by Alberto Brandolini and is based on DDD. Event storming
    is a fast way to build a logical model, domain model, workflows, enterprise integration,
    and enterprise solution requirements. The idea of event storming is to bring together
    the software development team and domain experts to brainstorm and to learn from
    each other. To make this learning process more efficient, event storming is meant
    to be fun. It encourages everyone to participate and there are no bad ideas. Everything
    posted on the timeline will be challenged and refined as the process moves through
    its steps. The people invited to the event storm are vital to its success. The
    team consists of five members from the development team, such as developers, testers,
    architects, and product owners, and five people from the business from various
    levels of the organization—from analysts and managers to team members, and even
    to senior leadership, who have different points of view and deep domain knowledge.
    The name was chosen to show that the focus should be on domain events and the
    method works similarly to brainstorming or agile modeling''s model storming.


    # DDD


    DDD was introduced by Eric Evans in his blue book *Domain-Driven Design: Tackling
    Complexity in the Heart of Software*.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Eric Evans describes three key concepts that will help us on our journey of
    understanding the needs of our business and build microservices that will meet
    the needs of the business. These three concepts distill our domain down into a
    model that we can implement and tactical patterns to make the implementation of
    our microservices successful. Those concepts are listed as follows:


    +   - A lack of awareness of stakeholder needs

    +   - A knowledge-crunching domain model

    +   - **Ubiquitous language** (UL)

    +   - Binding the model to the implementation


    We will talk about each of these concepts in detail in the next sections.


    # A lack of awareness of stakeholder needs


    The main purpose of developing software is to meet some stakeholders'' needs.
    What if I told you that stakeholders are not just the folks asking for software
    to be developed? In truth, stakeholders encompass everyone involved in the process,
    including the development team and the business users. Each stakeholder has different
    needs—the business stakeholders'' needs are different from that of the development
    team, and all the stakeholders'' needs must be met. The business people need an
    application to meet the business needs or to provide a new feature. The development
    team needs are around developing the software, and although the needs of each
    stakeholder are different, they need to be addressed in order to successfully
    develop microservices. Communication is key to meeting all the stakeholders''
    needs, and DDD helps us meet all their needs by providing a process or framework
    for understanding these. The strength of DDD is to understand the problem space
    that analysis and communication need to occur first. DDD helps tie all these needs
    together with the business stakeholders'' needs, and these are met by developing
    the domain model. The developers'' needs are provided by the code model, which
    is derived from the domain model. The domain model is developed using UL and knowledge
    crunching, and then, we bring it all together with an implementation of the code
    model. We can now examine how DDD addresses stakeholders'' needs and provides
    an awareness that we need to be successful. We will start with knowledge crunching.'
  merge: -1
  img_proc: true
- pgno: 73
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 74
  md: 'Domain experts, SMEs, and the people you will need to knowledge crunch with
    in a business may have a limited understanding of tech jargon and will act as
    though they do know even if they don’t to avoid looking naïve, and nothing could
    be further from the truth. Believe me—domain experts are very intelligent, and
    it is their knowledge that you need, not the other way around. In fact, they have
    a very complex language of their own, and it is we, the developers, who need to
    quickly learn and understand their language. We must adapt to speak to and understand
    the business experts, which will become our shared language with the business
    and will form the UL. Not only are we required to learn the business language,
    but we also need to implement it in our design by naming our development artifacts
    such as services, objects, and modules in the language of the business.


    Using UL is very important as a project grows and more development teams get involved
    in building and owning separate domains and developing the microservices for those
    domains. This growth can create an even bigger need for a shared language, as
    teams will need to communicate with each other and the business, and we all need
    to be speaking the same business language. Developers will still have the language
    they speak to each other, but the names of classes, services, methods, and functions
    should always reflect business behavior and properties and have a business name.
    We observe translation being an option, but that leaves room for mistranslations.
    These translations can happen between business experts and developers, or they
    can happen between development teams. Translations present a risk as something
    could always be lost in translation—something we have all heard before.


    Domain experts have little knowledge of technical jargon as it pertains to software
    development; on the other hand, domain experts use the jargon of their field,
    which can come in various flavors. Developers, as compared to domain experts,
    may understand and discuss a system in descriptive technical terms, programming
    jargon, and functional terms, not having any meaning in the business domain experts''
    language. Developers may also develop abstractions of a model that support their
    design but these are devoid of any meaning to the domain experts, which creates
    confusion and hinders communication.


    Developers who are working on different parts of the problem work out their own
    design concepts and ways of describing the domain, thus it is common for communication
    to break down or ambiguities to arise. Across this linguistic divide, the domain
    experts vaguely describe what they want in the application. While developers struggle
    to understand a domain that''s new to them, an incomplete understanding shows
    up as bugs or—worse—completely failing to meet the business need. A few members
    of the team can manage to become bilingual, but they become bottlenecks of information
    flow, and their translations are inexact in many cases.'
  merge: -1
  img_proc: true
