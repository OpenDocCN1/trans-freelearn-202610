- pgno: 149
  md: 'We can achieve this by initially breaking out the code from the legacy application
    and designing the models that support the business features. Then, we can use
    a proxy to direct traffic to the new service as we test and learn about the data
    that is required for the service. Finally, we can compare and contrast this data
    and its model against the legacy database. By taking a code-first approach, we
    can decide how to proceed when separating the schema and its columns and properties
    from the legacy data store. Additionally, we can have greater confidence in using
    the unit test to ensure our assertions are correct. Earlier, we discussed the
    importance of a microservice having its own separate data store and being responsible
    for keeping that data in the correct state. But what if that data''s needs would
    be better served if it was from a different persistent store that meets the needs
    of the data itself?


    What if we need to improve retrieval performance whether it be in big data or
    within certain CQRS patterns, which we will discuss shortly? Some implementations
    of CQRS have a database of read operations for queries and another separate database
    of write operations in which to store data. The stored data is then replicated
    into the read database, called a materialized view for the read operations. The
    materialized view model has been optimized for reads and queries.


    Relational databases were designed to optimize the storage of data in rows, mainly
    for transactional applications. A columnar database is optimized for the faster
    retrieval of columns of data and is widely used for analytical applications. Column-oriented
    storage for database tables is essential in analytic query performance because
    it considerably reduces the overall disk I/O requirements and reduces the amount
    of data we need to load from the disk.


    What if we need a columnar database for high-performance aggregation or a document
    database for a materialized read view of our data? This helps in faster reads
    or a relational database to better facilitate durable transactions.


    When we find our data sources and repositories coming from many different places
    along with different paradigms such as big data, relational databases, or document
    databases, then we need to explore polyglot persistence and what it brings to
    the table. We will do this next.'
