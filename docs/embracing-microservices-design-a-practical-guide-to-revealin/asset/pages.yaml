- pgno: 182
  md: '# # Request timeout


    In a microservices architecture, services are hosted as separate processes to
    communicate with each other over a network via RPCs. These microservices exchange
    messages using different protocols in order to consume interfaces exposed by these
    services. In synchronous communication, the consumer needs to establish a connection
    with a service to consume its capabilities. The ability to connect to a service
    to invoke its capabilities is defined as the **availability** of the service,
    while the time a service takes to respond to its consumer is known as its **responsiveness**.


    Both availability and responsiveness are important aspects that need to be addressed
    by the consumer to enable resilient inter-process communication between services.
    The consumer of the service can choose to wait indefinitely or specify a timeout
    to wait for the response before it decides the next action. Although specifying
    a timeout seems like a good choice, it could result in a timeout anti-pattern.
    The following diagram depicts an inter-process communication between two microservices:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_182_0.png)


    Figure 6.6 – Inter-process communication between two microservices


    In the preceding diagram, Microservice A is trying to consume the capabilities
    that are available in Microservice B. Microservice A has implemented retry logic
    to re-communicate with the target service in the case of a failure. Additionally,
    it has implemented the timeout functionality to ensure service responsiveness.
    The timeout will inform Microservice A about the unavailability of Microservice
    B in the event of a failure. The series of events between the two microservices
    are explained as follows:


    +   1. Microservice A tries to invoke a functionality that is available in Microservice
    B. However, Microservice A is not able to connect to Microservice B. In this case,
    Microservice B is considered unavailable for Microservice A. Microservice A can
    respond back to the client with an error message stating the unavailability or
    it can retry. There are multiple ways in which to handle this failure. To avoid
    synchronous calls, one can opt for a materialized view pattern or a publish/subscribe
    pattern, as we will discuss later in the chapter.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '+   2. Microservice A will keep on trying to invoke Microservice B due to the
    *Retry Logic* implemented as part of Microservice A. If no response is received
    in the allotted time, this results in a timeout. In this case, Microservice B
    is considered unresponsive. If the timeout is not specified, Microservice A will
    continue to wait for Microservice B, resulting in a waste of resources.


    +   3. In an ideal situation, Microservice A invokes the functionality that is
    available in Microservice B and receives a response in the allotted time.


    At a first glance, setting up a timeout value seems to be the obvious choice,
    but finding the right timeout value that addresses the challenges of high volume,
    network latency, service unavailability, or overcommitted resources is difficult.
    For example, you could request to withdraw $5,000 of cash from an ATM. The last
    thing you want to happen is to get credited from the account and not receive any
    cash from the ATM due to a service timeout. The service timeout could happen due
    to network latency or a service load. You can try again, but you will find out
    that the account has already been credited. One approach to address this problem
    is to set a high value of timeout to allow these services to respond in times
    of high volume and load. A common way to address this problem is to set the timeout
    value to double the response time during peak hours, as specified in the following:


    *Average Response Time = 1500 ms*


    *Response Time at Peak Time = 4500 ms*


    *Timeout Value = 4500 ms x 2 = 9000 ms = 9 s*


    You might have wondered why this is an anti-pattern. Now every service must wait
    for 9 s to let its consumer know about the failure of a request. During this time,
    the client can either close the window or hit the submit button multiple times.
    This is not a good experience and should be addressed with a better strategy.


    > **Note**

    > For a long chain of synchronous calls, it''s not a good idea to implement a
    retry pattern because the consumer will experience a delay if the retry pattern
    is triggered. We will discuss long chains of synchronous calls in more detail
    in the *Long chains of synchronous calls – the retry storm section.*'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Retry patterns


    A retry pattern is implemented to address failures related to service unavailability.
    It''s important to understand different types of failures and only apply a retry
    policy to transient failures. With a retry pattern, you can retry failed requests
    based on the retry counter. After every failed request, you increase the retry
    counter and increase the wait time along with adding some jitter before making
    another call. Once the retry counter has been reached, you can gracefully handle
    the failure and let the client know about the unavailability of the service. It''s
    recommended that you increase the wait time between retry requests to allow the
    service to become available to handle new requests. The intent behind the retry
    pattern is to provide more execution opportunities to an operation that''s likely
    to succeed. The retry pattern is explained in more detail in Chapter 4, Keeping
    the Replatforming of Brownfield Applications Trivial.


    # Circuit breaker patterns


    Sometimes, a service becomes unavailable for a longer period. In such cases, you
    don''t want to continue retrying the requests as this can result in exhausting
    your system resources and potentially affecting other services, which will induce
    cascading failures. Instead, you want to notify your clients relatively early
    about the unavailability of a service. Circuit breaker patterns help you to address
    such failures by only allowing requests that are likely to succeed. The idea behind
    the circuit breaker pattern is that it allows a service to recover automatically
    by limiting the request load. Once the service becomes available, you can increase
    the load to serve more requests. You can learn more about circuit breaker patterns
    in Chapter 4, Keeping the Replatforming of Brownfield Applications Trivial.


    It''s important to understand the behavior of microservices in different circumstances
    while they communicate over a network. This understanding will help us to increase
    the availability and responsiveness of the system. In the next section, we will
    explore the retry storm and how we can address the challenges it presents using
    different approaches.


    # Long chains of synchronous calls – the retry storm


    When multiple microservices call each other repeatedly in a long chain, there
    is a possibility that a microservice might take more time to respond than expected,
    which can result in timeouts. These timeouts will initiate additional retry requests
    with an expectation that the operation might succeed and the flood of these retries
    will eventually make the system unusable. This scenario is known as a retry storm,
    as depicted in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_185_0.png)


    Figure 6.7 – A long chain of synchronous calls


    In the preceding diagram, the checkout operation is performed by calling a series
    of microservices. Each microservice call has its own ETA with a sufficient buffer
    to address any adverse conditions. Though due to some reason, the invoice microservice
    is experiencing load and the ETA for the service is no longer the same. The other
    services are unaware of this change and are expecting the same ETA from the invoice
    microservice.


    Notice how, after 1 second, the shipping microservice has raised a retry request
    for the invoice microservice and will continue to do so if the response is not
    received in the due time frame. Similarly, the payment microservice will raise
    a retry request after 2 seconds for the shipping microservice, which, in turn,
    raises a request for the invoice microservice. Finally, after 3 seconds, the cart
    microservice will raise a retry request due to its unmet ETA to the payment microservice,
    which invokes the shipping microservice and, finally, calls the invoice microservice.


    Due to these timeouts, we are raising additional requests without informing other
    services that its caller is no longer waiting for the earlier response, and they
    should discard processing those requests. Hence, valuable processing capacity
    is wasted. Additionally, if you are hosting all your microservices on the same
    infrastructure, then there is a possibility of cascading failures resulting in
    the overall system being unavailable.


    A distributed transaction (Saga) is an example of calling an ordered sequence
    of microservices to perform a series of tasks. In the event of failure, retries
    are performed to ensure consistency across service boundaries. If retries are
    not successful, the orchestrator needs to perform rollbacks to undo already performed
    tasks to ensure consistency. The concept is discussed, in detail, in Chapter 5,
    Data Design Pitfalls. There are multiple approaches to how you can handle a retry
    storm. We will discuss these approaches in the subsequent subsections.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Scalable infrastructure


    You can make your infrastructure instantaneously scalable to address peak loads
    by monitoring different aspects of your application. Instantaneously scalable
    means that the start-up time of your service is short. This will help us to address
    issues related to service being overwhelmed by the number of requests. The only
    exception is if the condition is due to external factors, for example, delays
    caused due to reading files from a third-party system over a network. In such
    scenarios, you should look for other alternatives, as we will explain next.


    # Load balancing, throttling, and request classifications


    Load balancing is an approach that is used to distribute incoming requests across
    a fleet of service instances that are deployed across different servers. These
    ensure that no server is overburdened while each receives its fair share of requests.
    Once the server is overloaded, the backend service should reject the requests
    to inform clients of the right error code or serve a degraded response. Additionally,
    make sure that you have classified your requests based on their criticality and
    prioritize them accordingly for execution. In this case, invoice generation is
    not a critical operation for shipping and can be delayed until the service is
    restored to full capacity. You can perform rate-limiting at different levels,
    including the individual microservice, load balancer, or API gateway level.


    # Exponential backoff, jittering, and circuit breakers


    Use the exponential backoff strategy for retry requests. The exponential backoff
    strategy promotes the idea of exponentially increasing the time between two retry
    requests. This helps the service to recover by allowing already in-process requests
    to complete their execution without being overwhelmed by the new ones. Further,
    you can introduce randomness as part of the backoff strategy to spread out request
    spikes; this is called jittering. Additionally, you need to ensure that you are
    not performing endless retries by implementing a circuit breaker and allow the
    service to recover. Make sure that you have a consistent way of performing retries
    across your services and avoid retries at different levels, for example, use a
    service mesh or SDK. You can learn more about evaluating the capabilities of different
    service meshes in Chapter 3, Microservices Architecture Pitfalls.


    # Only allowing the immediate layer to retry


    In this scenario, the shipping microservice is a critical service and only the
    payment microservice is allowed to perform retries to the shipping microservice.
    If the shipping microservice has already reached the allowed number of retry attempts,
    then it should inform the cart microservice that the request can’t be served at
    this time and should be tried later. Therefore, every parent service is informed
    of the service state. Additionally,'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'it''s a good idea to inform the parent/client about the expected time interval
    in which the service will be available again. In such situations, observing the
    health of the system is critical; it can help you reject requests early in the
    life cycle, which provides a better client experience and helps to ensure service
    recovery in a timely manner by reducing load.


    You should now have a solid understanding of the drawbacks of the retry storm,
    its impact on the overall system, and its potential solutions. We will now discuss
    event-driven architecture, its pitfalls, and the approaches to overcome them.


    # The dark side of event-driven microservices


    Microservices is a set of loosely coupled microservices implementing bounded context
    that identifies module boundaries and how they interact with each other. The concept
    of bounded context is discussed, in detail, in Chapter 2, Failing to Understand
    the Role of DDD. Microservices can be designed as event-driven architecture, where
    microservices communicate with each other by sharing state changes. The following
    diagram depicts an event-driven architecture:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_187_0.png)


    Figure 6.8 – Event-driven microservices'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'In the preceding diagram, events are produced by producer microservices as
    an event stream, which is later consumed by multiple consumer microservices. Event
    streams are served by the event broker (or event bus), which decouples producers
    from consumers. One of the challenges of event-driven architecture is its difficulty
    in figuring out how different microservices are communicating with each other
    via events. One way to address this challenge is to monitor these systems and
    to track the flow of events and how different systems are reacting to them. In
    the next section, we will discuss various pitfalls of design events and how they
    can be addressed using domain events. Let''s move ahead and explore them in more
    detail.


    # Event design pitfalls


    An event is a core concept that enables communication between event-driven microservices.
    Events promote decoupling by allowing systems to be flexible, resilient, and scalable.
    All these promises of event-driven architecture depend on how well the events
    are designed. The following is a list of the different pitfalls that you might
    face while designing events:


    +   - **Event dependency:** An event that can be affected by past or future events
    is considered to be a dependent event. In an event-driven architecture, events
    should be atomic, self-contained, and independent. The consumer should be able
    to process an event without waiting for other events. Independent events allow
    different consumers to process the same event differently without relying on the
    publisher or the publisher making assumptions or intentions about its processing.

    +   - **Entities as events:** Another common anti-pattern is to use database entities
    as events. These entities are part of the internal implementation of the services
    and might not convey the right intent in the business context.

    +   - **Generic events:** Avoid using generic events, as this will require consumers
    to analyze a message before deciding whether they want to process it or discard
    it, which wastes precious CPU cycles.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '+   - **CQRS, event sourcing, and events: Command and Query Responsibility
    Segregation (CQRS)** and event sourcing are used together; here, the command and
    event sourcing provide the write model, while the event store projection and query
    provide the read model for the system. In such architecture, you''ll observe that
    teams disguise commands as events. Commands are usually for a single consumer,
    while an event is intended for any consumer that''s interested in the event. Another
    observation you can make is around exposing event store events as a method of
    communication between different business domains. The downside of this approach
    is that any changes to an event store are now tied to other business domains,
    which makes it harder to evolve. Both CQRS and event sourcing were discussed,
    in detail, in *Chapter 5, Data Design Pitfalls.*


    # Domain events


    In the context of **domain-driven design (DDD)**, domain events are classified
    as business events. They are considered first-class citizens in DDD, and form
    the ubiquitous language that''s used by stream-aligned teams to understand the
    business domain. The concept of ubiquitous language was discussed, in detail,
    in *Chapter 2, Failing to Understand the Role of DDD*. Domain events are specific
    and contain the necessary information that serves as a contract between the business
    domains to facilitate communication; for example, the `payment_recieved` event,
    which belongs to the payment domain, is generated once a payment has been made
    by the customer. The invoice generation can subscribe to `payment_recieved` and
    perform the necessary action to generate an invoice. Once an invoice has been
    generated, the system will generate an `invoice_generated` event, which can be
    processed by the notification system to send notifications.


    An event is a critical part of the event-driven architecture. This is because
    it acts as a data carrier and a contract between microservices. These events should
    be domain-driven and represent business events. Both events and API interfaces
    are ways in which to enable communication. As systems evolve, these interfaces
    go through several changes, resulting in the release of multiple versions of the
    service. In the next section, we''ll explore the role of versioning in the microservices
    architecture.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Avoiding service versioning


    In Chapter 1, Setting Up Your Mindset for Microservices Endeavor, we talked about
    the API-first approach as part of the additional factors of building cloud-native
    applications in addition to the Twelve-Factor App methodology. The API-first approach
    emphasizes defining a service contract that dictates the behavior of a service.
    The service API is a contract between a service and its consumers. The service
    might undergo many changes during its life cycle, which might require changes
    to its API. A service could have multiple consumers, and it''s crucial to ensure
    backward compatibility during several API changes to allow different consumers
    to continue their operations without making any changes.


    The API changes can be broadly categorized as breaking and non-breaking. Breaking
    changes require clients to update to a newer version of the API, while non-breaking
    changes don''t affect clients and allow them to continue working with the older
    version of the API. Any removal or change in the interface, including the message
    format, method signature, or response type, is considered a breaking change. The
    addition of new interfaces, including message formats and message types, are considered
    to be non-breaking changes.


    In the light of the Twelve-Factor App methodology, it is essential to have a single
    code base for your microservice. This strategy works well with non-breaking changes.
    However, breaking changes introduce a new challenge where you might have to keep
    different instances of services running to support different consumers. For example,
    let''s imagine you are decomposing a monolithic e-commerce application into microservices,
    where these microservices call each other to address different business use cases.
    A better approach would be to ensure that every change is both backward and forward
    compatible, which can help in a number of ways, such as allowing rollbacks. In
    the following diagram, we will discuss the effect of deploying new versions of
    these services with breaking changes:'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Independent deployment


    # Breaking changes


    # Deploying new client versions


    # Lock-step deployment


    # Figure 6.9 – Application versioning


    In the preceding diagram, we have three microservices, where Microservice A and
    Microservice B communicate with Microservice C to get the work done. We can say
    that both Microservice A and Microservice B are dependent on Microservice C and
    any breaking change of Microservice C can affect both microservices. The deployment
    of different microservices and their impact at different stages are discussed
    as follows:


    +   1. We start with the independent deployment of microservices. All the microservices
    are running version v1. This allows us to deploy new versions of Microservice
    A and Microservice B independently, but can we do the same for Microservice C?

    +   2. We have a new version of Microservice C; we call it v2. The newer version
    of the microservice has updated the interface; hence, it''s a breaking change
    that affects how Microservice A and Microservice B can invoke the capabilities
    of Microservice C.

    +   3. Now, both Microservice A and Microservice B have implemented the changes
    introduced by Microservice C and have deployed their version, v2.

    +   4. The team has realized that Microservice C can''t be deployed independently;
    rather, they also need to deploy dependent services. This is what we call lock-step
    deployment.


    ![](img/e6276d4d880001c04e81cb4db4898f1c_191_0.png)


    ![](img/e6276d4d880001c04e81cb4db4898f1c_191_1.png)


    ![](img/e6276d4d880001c04e81cb4db4898f1c_191_2.png)


    ![](img/e6276d4d880001c04e81cb4db4898f1c_191_3.png)'
  merge: -1
