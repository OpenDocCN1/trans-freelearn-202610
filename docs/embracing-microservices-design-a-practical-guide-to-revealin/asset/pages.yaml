  md: "# Normalizing read models\n\nIn SQL relational databases, normalization makes\
    \ perfect sense and should be implemented by creating a table for each entity.\
    \ Additionally, we can have separate tables for all of the children's objects\
    \ and use foreign key identity to map the relationship between those entities.\n\
    \nIn a document database, this can be a detriment to performance and bad design,\
    \ but there are some cases when we need to normalize document database models.\
    \ The best practice is to embed everything within the parent entity; however,\
    \ in the case where the embedded objects can grow without bounds, this can create\
    \ an issue with document size. Therefore, in this scenario, we need to model our\
    \ data with a reference just as we do in a relational world using identities.\n\
    \nAnother example of the correct time to normalize a document model is when dealing\
    \ with subordinate objects that change frequently. For example, we have a parent\
    \ document called the customer, the customer has a list of stocks, and the stock\
    \ prices are updated every 5 minutes. In our document model, we want to move stocks\
    \ out of the parent, in this case, the customer, and into a separate document\
    \ object called stocks, which is a collection of customer stocks. This is so that\
    \ we don't have to update the parent (that is, the customer) every time we need\
    \ to update an embedded object (that is, a stock) that has changed, such as a\
    \ stock price. So, we will want to move the stock object into a separate document\
    \ object and reference it with its ID. Then, we can update the stock itself and\
    \ not the parent object that owns the stock object. For instance, we can view\
    \ an example of the documents for a customer in which we track their stocks and\
