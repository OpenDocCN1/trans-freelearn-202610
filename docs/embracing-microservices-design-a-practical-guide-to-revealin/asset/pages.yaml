- pgno: 177
  md: 'In the preceding diagram, the mobile application communicates directly with
    e-commerce microservices by directly invoking individual microservices. The user
    journey starts by browsing the product listing, selecting products, applying for
    promotions, and, finally, performing a checkout. As part of the communication,
    the client needs to perform multiple round-trips to each microservice, which results
    in additional latency and affects the user experience. To address these challenges,
    it''s recommended that you consolidate user requests using an API gateway pattern.
    Let''s explore that in more detail next.


    # The API gateway pattern


    The API gateway pattern introduces a reverse proxy between the client and the
    microservices. It acts as a single point of entry for all client requests. API
    gateways are an implementation of API gateway patterns, provided by different
    vendors that are responsible for redirecting client requests to microservices
    for further processing. It also decouples client apps from internal microservices
    to enable service evolution and refactoring for internal microservices without
    causing any breaking changes to client apps. It''s a good idea to keep the API
    gateway close to the microservice to reduce latency. The API gateway is a single
    point of failure, and it should be protected with high availability. You can use
    Azure API Management to expose APIs, protect your clients against interface changes,
    enforce security by adding various policies, and much more. You can learn more
    about the API gateway in Chapter 7, Cross-Cutting Concerns.


    So, you should now have a basic understanding of how to address the challenges
    of direct client-to-microservices communication using an API gateway. Next, we
    will explore how choosing a single API gateway can result in creating ambiguities
    and the overall maintenance of the API gateway.


    # The overly complicated API gateway


    A single API gateway might be ideal for a small microservices application, but
    it can turn out to be overly ambiguous if you are dealing with many microservice
    with various consumers. The following is a list of challenges that are often discussed
    while exposing APIs using API gateways:


    +   - Each consumer has different information requirements from an API.

    +   - Each consumer has different latency requirements.

    +   - Protocols are supported by each client.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'Also, API gateways are implemented as a mechanism to orchestrate backend microservices.
    The practice, well known as API gateway, is aggregator microservice. This concept
    is explained, in detail, in *Chapter 3, Microservices Architecture Pitfalls*.
    In the following diagram, a single API gateway is implemented to address the various
    requirements from different consumers:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_178_0.png)


    Figure 6.3 – A single monolithic API gateway


    The API gateway also acts as an aggregator microservice, which brings the orchestration
    logic to the API gateway and, therefore, making it more complex and difficult
    to maintain. These API gateways can be a potential bottleneck and a source of
    single points of failure for the overall system. However, multiple API gateways
    can help to address the needs of different clients. Further, aggregator microservices
    can be used to orchestrate different microservices or materialized view patterns,
    which can help to reduce the communication between microservices. Let''s explore
    them, in detail, next.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Multiple gateways – backends for the frontends


    To keep an API gateway implementation simple, you can have multiple API gateways
    based on different types of consumers. Sometimes, it makes sense to have separate
    API gateways for altogether separate purposes; for example, one for external clients,
    one for internal service calls, and one for partners to consume APIs, where each
    API gateway contains a different set of policies and subscription model. It also
    enables developers to provide optimal APIs for each consumer by addressing their
    data and latency requirements, reducing round-trips, and improving user experience.
    Another benefit of this approach is that it segregates APIs based on their security
    and risk profiles. Furthermore, it helps you to address the challenge of a single
    API gateway becoming the bottleneck and a single point of failure for the system.
    Many cloud providers offer API gateways as a service to help cloud-native developers
    use these services to publish their APIs without needing to reinvent the wheel.
    Authentication, authorization, service discovery, rate limiting, throttling, load
    balancing, logging, tracing, correlation, IP whitelisting, and response caching
    are just some of the features supported by API gateways. The following diagram
    depicts multiple API gateways, each acting as a backend for the frontend:


    ![](img/e6276d4d880001c04e81cb4db4898f1c_179_0.png)'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'In the preceding diagram, three different API gateways have been implemented
    to increase the performance, availability, scalability, security, and maintainability
    of the overall application. Each API gateway has implemented consumer-specific
    policies to enable communication between microservices and their consumers through
    the API gateway. As shown in *Figure 6.4*, the partner API gateway is not available
    due to deployment failure, but this does not affect other API gateways, and other
    channels will continue to function without any disruption. This helps us to reduce
    the blast radius and reduce the number of affected consumers.


    We can further simplify the communication between the API gateways and backend
    microservices by introducing an aggregator microservice. The aggregator microservice
    is responsible for orchestrating communication between backend microservices and
    API gateway. This concept is explained, in more detail, in *Chapter 3, Microservices
    Architecture Pitfalls*.


    # Materialized view patterns


    The aggregator microservice has played an instrumental role in reducing the communication
    between the API gateway and backend microservice, but it has only helped us to
    shift the problem from the API gateway to the aggregator microservice. The materialized
    view pattern helps you keep a local copy (that is, a read-only model) of the data
    of other microservices, which is necessary for the primary microservice to function
    independently. This pattern eliminates calls to other microservices to increase
    the response time and reliability of microservices. The following diagram shows
    one attempt to make the overall microservices architecture more resilient by introducing
    multiple API gateways and materialized view patterns:'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/e6276d4d880001c04e81cb4db4898f1c_181_0.png)


    # Figure 6.5 – Multiple API gateways with materialized view patterns


    In the preceding diagram, we have multiple API gateways addressing high availability,
    scalability, and fault tolerance within the API gateway layer. The search microservice
    has a read-only model of the relevant data from multiple microservices, which
    is necessary to perform its operations. It''s recommended that you asynchronously
    update the read-only model using queue or pub/sub patterns. For write operations,
    you can opt for either synchronous or asynchronous communication; though, asynchronous
    communication is preferred. The concept is explained, in more detail, in Chapter
    3, Microservices Architecture Pitfalls.


    Now that you have a good understanding of how to prevent your API gateway from
    getting overly complicated, let''s move on to discuss the factors to bear in mind
    when enabling service-to-service communication.'
  merge: -1
