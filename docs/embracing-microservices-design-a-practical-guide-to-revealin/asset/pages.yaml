- pgno: 279
  md: 'However, when you are building a similar service using the same technology,
    you can sometimes reuse the code or framework to reduce your development efforts.
    For that reason, in some cases, reusing the existing code seems to be a good practice.
    Here are some important aspects to consider when evaluating this factor:


    +   - Are you maintaining a service template or utilizing a framework to kick
    start new service development?

    +   - Do you have a single code base for microservices?

    +   - Are you isolating dependencies?

    +   - Are you externalizing configuration?

    +   - Is sensitive configuration securely stored?

    +   - Are you containerizing your services?

    +   - Have you used a cache where appropriate?

    +   - Do you know your data consistency requirements?


    # Capabilities of the hosting platform


    One of the main benefits of building a microservices architecture is to embrace
    the easy scalability of services. Containerizing a monolithic application is a
    challenging task. However, if the application is decomposed into fine-grained
    services, these can be easily containerized and scaled out based on the need.
    Discussing the capabilities of the hosting platform for a microservices architecture
    is an important factor. Here are some aspects that you can discuss to evaluate
    this factor:


    +   - Which hosting platform are you using to deploy your services?

    +   - Is the hosting platform scalable?

    +   - Does the hosting platform support auto-scaling?

    +   - How much time is needed to scale the hosting platform?

    +   - Is there any proper SLA provided by the vendor for the hosting platform?

    +   - Is there any DR site for the hosting platform?'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# # Deployment strategy


    A deployment strategy is a method for distributing or upgrading versions of your
    program on various deployment environments. Traditional applications lack the
    agility and speed of microservices-based solutions. Developers may make changes
    fast, and a new version can be issued with minimal testing. The following aspects
    should be considered when evaluating a deployment strategy:


    +   - Have you documented a deployment strategy for deploying your services?

    +   - Are you using outdated tools and technologies for deploying or hosting your
    services?

    +   - Is there any collaboration needed with other teams when you deploy services?

    +   - Are you setting up the infrastructure using IaC?

    +   - Have you leveraged DevOps capabilities to automate deployments?

    +   - Do you have a practice of propagating the same build to multiple environments?


    # # Monitoring services


    Monitoring is an important factor for any microservices-based application. Since
    the application is split into a set of various services running independently,
    troubleshooting errors becomes a daunting task. If you are following proper semantic
    logging for monitoring your services, your teams can easily monitor and investigate
    errors and respond quickly. Here are some aspects to be considered when evaluating
    this factor:


    +   - Do you have a practice of monitoring applications once they are deployed?

    +   - Is there a proper logging mechanism in place?

    +   - Is there distributed tracing infrastructure in place?

    +   - Is there a practice of recording exceptions?

    +   - Are defined health checks implemented for each service?

    +   - Are you following semantic logging?

    +   - Have you implemented key metrics, thresholds, and indicators?'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# # Assigning a correlation token to each service request


    A microservices architecture is distributed in nature and many services interact
    with each other to complete a business use case. A correlation token is a unique
    string (preferably, a **globally unique ID, or GUID**) that is assigned to each
    request for troubleshooting purposes.


    For example, if there is a long-chain operation where many services are involved,
    passing the correlation token to the service helps to investigate the issue easily
    if any of the services fail during that transaction. Usually, each service has
    its own database and keeps the correlation token within the database record as
    well.


    These two things are worth mentioning:


    +   - Have a correlation ID that correlates the end-user request to requests made
    to various microservices so that we can quickly locate logs in each of the services
    that were involved in an end-user request.

    +   - The cost to store and make logs searchable can be large and, for that, some
    companies end up sampling or storing the logs for a shorter period—both approaches
    have their pros and cons. If sampling is used, care should be taken to ensure
    that all microservices involved in an end-user request keep logs of the same end-user
    request or we won’t be able to track a failed request.


    The following points should be considered when discussing correlation tokens:


    +   - When is the correlation token assigned?

    +   - Who is responsible for assigning the correlation token?

    +   - Do you save correlation tokens in the service''s database?

    +   - What is the format of the correlation token?


    # ## Defining a microservices chassis framework


    A microservices chassis framework is a foundational framework for fundamental
    cross-cutting issues such as logging, security, exception handling, tracing and
    distribution, and so on. The following aspects are important to consider when
    evaluating this factor:


    +   - Do you have a microservices chassis framework in place?

    +   - Are your services secured and do you handle security constraints inside
    each service?'
  merge: -1
  img_proc: true
- pgno: 282
  md: '+   - Are you using any resiliency patterns for microservices?

    +   - Have you implemented idempotency for your services?

    +   - Are you using any protocol translation as part of your microservice implementation?

    +   - Are you doing any message transformation inside a microservice?

    +   - Have you implemented client-side or server-side discovery patterns?


    # Shift-left approach for testing and security


    A shift-left approach should be adopted early in the development life cycle of
    microservices applications. In a shift-left approach, you bring different activities
    (security, testing) into the development cycle earlier on to improve the quality
    of the application.


    For example, if you are building a new application, you should test the security
    of the application in the design phase, by using tools such as Microsoft Threat
    Modeling. Moving forward, during development, the code should be security scanned
    using **static application security testing (SAST)**, and furthermore, when the
    application is deployed, it should be tested using **dynamic application security
    testing (DAST)** tools.


    The following aspects are important to consider when evaluating this factor:


    +   - Do you follow a practice of implementing unit tests?

    +   - Do you follow a practice of evaluating your architecture at the design phase?

    +   - Do you have any tools to measure code quality?

    +   - Do you have automated tools to test your applications?

    +   - Have you implemented **development, security, and operations (DevSecOps)**?

    +   - Are you using any testing frameworks?

    +   - Have you used WAF at the frontend?

    +   - Are you embracing shift-left testing?

    +   - Do you follow a practice of writing unit tests?

    +   - Do you have a practice of doing integration testing?

    +   - Do you have a practice of doing **end-to-end (E2E)** application testing?

    +   - Do you have a practice of doing load testing?

    +   - Do you follow the practice of doing automated testing?'
  merge: -1
  img_proc: true
- pgno: 283
  md: '+   - Do you follow the practice of doing penetration testing?

    +   - Do you follow the practice of doing chaos engineering?

    +   - Are tests automated and carried out periodically or on-demand?

    +   - Do critical test environments have 1:1 parity with the production environment?


    # Summary


    In this chapter, we learned about various factors that are important for assessing
    a microservices architecture. Giving these factors importance while you are building
    or replatforming an application helps you highlight areas where improvement is
    needed. Moreover, you can discuss those improvements with teams to increase the
    maturity state of their architecture.


    In this book, we learned about various anti-patterns and architectural pitfalls
    to avoid when creating a microservices architecture. We hope that you now have
    a better grasp of these pitfalls and will consider them when developing new applications
    or replatforming existing applications to a microservices architecture.'
  merge: -1
  img_proc: true
