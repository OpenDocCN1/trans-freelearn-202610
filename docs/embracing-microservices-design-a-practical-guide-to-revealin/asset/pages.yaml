    By the end of this chapter, you will have learned about the importance of understanding
    DDD to build cohesive services with bounded contexts. You will also learn about
    the importance of team building, governance, and awareness of stakeholders.


    # What are microservices and how do they align with DDD?


    The more we describe microservices, the more it sounds as though we are talking
    about DDD. So, let''s take another look at the definition of microservices and
    see the relationship between what is called microservices and DDD. We will explore
    the guidelines around DDD and how these guidelines help us in building a microservices
    architecture that meets the needs of a business.


    If you are building microservices, you need to understand what they are, and just
    to make sure that we are all on the same sheet of music, let''s examine the characteristics
    of microservices. Let''s explore what they are, and we will then see how DDD will
    guide us on our journey in building effective microservices that meet the needs
    of a business. We will examine the pros and cons of microservices and see how
    DDD helps us achieve some of these pros and address some of the cons as well.'
  merge: -1
