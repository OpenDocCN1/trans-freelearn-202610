- pgno: 267
  md: 'Testing microservices is vital to successfully develop and deploy microservices.
    Testing should start early in the development life cycle and should start with
    the code and continue through each phase from the build to the release phase.


    # Summary


    So, to wrap things up, we saw how important testing is to develop and deploy microservices
    and how this can help avoid deploying microservices that have bugs that could
    cause costly issues in production or, even worse, complete failure. Skipping testing
    is not a good option and can lead to unnecessary failure of your microservices
    so shift your testing to the left, start testing early, and often through all
    phases of the software development life cycle. We have explored some of the shift-left
    testing strategy and the types of testing that support this approach.


    Unit testing the code is where it all starts and should represent the majority
    of your testing. We explored end-to-end testing and its complexity and how we
    should use the user journey through the app to guide this approach. Integration
    testing helps test interactions between services and ensures the correct behavior
    is evoked. Similarly, we learned about performance testing and load testing and
    understood their importance to make sure the application can handle increased
    demand and provide a good user experience. Testing is a must for successful microservice
    implementation and should be shifted to the left in the development lifecycle.
    Skipping testing will only lead to failures, in my opinion.


    In the next chapter, we will discuss the factors to consider when developing microservices
    to serve as a checklist to help you on your journey with microservices.


    # Questions


    +   1. What is the key to effective unit testing?

    +   2. What important considerations must be made before conducting end-to-end
    testing?

    +   3. What is the key to testing integrations between microservices?

    +   4. What is the best load testing strategy?

    +   5. Why is testing important to microservices in particular?'
  merge: -1
