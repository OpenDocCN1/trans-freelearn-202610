  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_424_0.png)


    Figure 12.2 – Engine Scalability Settings elements


    +   3. The buttons along the top of this menu, ranging from Low to Epic, serve
    as presets of the settings based on the broad level of performance versus quality
    that you want to target at runtime. Clicking on the Low button will set all the
    quality settings to the minimum, giving you the best possible performance, in
    exchange for the least visually attractive settings. Epic is the opposite end
    of the spectrum, raising all the engine quality settings to their maximum, at
    the expense of significant performance, depending on the assets you have chosen
    to use.


    +   4. The Cinematic button will set all the quality settings to cinematic quality,
    which is used for rendering cinematics. This setting is not intended for use during
    gameplay or at runtime.


    +   5. The Auto button will detect the hardware of the machine you are currently
    running the Editor on and adjust the graphics settings to a level that strikes
    a good balance between performance and a graphical quality that is suitable for
    your machine. If you are intending to target hardware that is roughly equivalent
    to the machine you are developing on, using the Auto setting can be a simple way
    to establish the graphics settings for your build.


    +   6. If you wish to tweak the settings individually, you can use this brief
    description of their functions to help you:'
