- pgno: 481
  md: '# # Chapter 14: Math and Trace Nodes


    The representation of a 3D world is based on mathematical concepts. If you do
    not understand these concepts, then it will be more difficult to understand certain
    operations performed in a 3D game. This chapter explains some math concepts that
    are needed for 3D games. We will learn about the difference between world and
    relative transforms and how to use them when working with components. We will
    learn how to use vectors to represent the position, direction, velocity, and distance.
    The concept of traces is explained and various types of traces are presented.
    This chapter also shows how to use traces to test collisions in a game.


    These are the topics covered in this chapter:


    +   - World and relative transforms

    +   - Points and vectors

    +   - Introduction to traces and trace functions


    By the end of the chapter, you will know how to use vectors and traces to make
    the player interact with other actors in the level.


    # ## World and relative transforms


    The `Actor` class has a **Transform** structure. This structure has three variables,
    which are used to represent **Location**, **Rotation**, and **Scale**. The **Transform**
    structure of an actor that is on the Level can be modified by using the **Details**
    panel.'
  merge: -1
  img_proc: true
- pgno: 482
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_482_0.png)


    # Figure 14.1 – Modifying the transform in the Details panel


    In the Level Editor, you can use the transformation widget that appears when you
    select an actor. There are buttons to select the type of transformation the widget
    will apply to an actor, as we can see in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_482_1.png)'
  merge: -1
  img_proc: true
- pgno: 483
  md: '# Figure 14.2 – Using the widget to modify the transform


    The 3D space is represented by three axes: x, y, and z. These axes are represented
    by colors: red is the x axis, green is the y axis, and blue is the z axis.


    The **Location** variable of the **Transform** structure has a set of values for
    X, Y, and Z, which determines the position on each axis. These values are also
    known as the world location of the actor. The following screenshot shows some
    actions that we can use to get and set an actor''s location:


    +   - **GetActorLocation**: Returns the current location of the actor

    +   - **SetActorLocation**: Sets **New Location** for the actor

    +   - **AddActorWorldOffset**: Uses the **Delta Location** input parameter to
    modify the current location of the actor.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_483_0.png)


    # Figure 14.3 – Getting and setting the actor location


    The **Rotation** variable of the **Transform** structure has a set of values for
    X, Y, and Z in degrees, which determines the rotation on each axis. The following
    screenshot shows the following rotation nodes:


    +   - **GetActorRotation**: Returns the current rotation of the actor

    +   - **SetActorRotation**: Sets **New Rotation** for the actor

    +   - **AddActorWorldRotation**: Adds the **Delta Rotation** input parameter to
    the current rotation of the actor.'
  merge: -1
  img_proc: true
- pgno: 484
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_484_0.png)


    Figure 14.4 – Getting and setting the actor rotation


    The Scale variable of the Transform structure has a set of values for X, Y, and
    Z, which determines the scale on each axis. The following screenshot shows the
    nodes that are used to get and set an actor''s scale:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_484_1.png)


    Figure 14.5 – Getting and setting the actor scale


    When a Blueprint has Actor components, the transforms of those components are
    known as relative transforms because they are relative to the component''s parent.
    The following screenshot shows an example of components. DefaultSceneRoot is a
    small white sphere that is hidden in the game and used to store the actor''s position
    in the world. It can be replaced with another scene component.


    Below it, in the component''s hierarchy shown in the screenshot, there is a Static
    Mesh component named Table, and below the Table component in the hierarchy, there
    is another Static Mesh component named Statue. The transform of Table is relative
    to the DefaultSceneRoot transform, and the transform of the Statue component is
    relative to the Table transform. So, if'
  merge: -1
  img_proc: true
- pgno: 485
  md: 'you move the **Table** component in the Viewport, then the **Statue** component
    will move too, but if you change the relative transform of the **Statue** component
    instead, then the **Table** component will remain where it is.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_485_0.png)


    Figure 14.6 – Component''s hierarchy


    There are nodes to get and set a component''s relative location. You can also
    get a component''s world location, as you can see in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 486
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_486_0.png)


    Figure 14.7 – Getting and setting the component''s relative location


    The **Location** and **Scale** variables are represented by **Vector** structures,

    which is our next topic.


    # Points and vectors


    There is a structure in Unreal Engine named **Vector**, which has three

    variables of the float type: **X**, **Y**, and **Z**. Same as the concept of a
    vector in

    mathematics, this **Vector** can be used to represent a point (location) in 3D

    space or velocity (speed in a specified direction).


    Let''s first look at an example of using **Vector** as a point in 3D space. The

    following screenshot has two actors. One actor represents a character and

    the other represents a couch.'
  merge: -1
  img_proc: true
- pgno: 487
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_487_0.png)


    Figure 14.8 – Two actors on the level


    The following screenshot shows the character''s location. The Location variable
    of the Transform structure is of the Vector type (X, Y, and Z), and one Unreal
    unit equals 1.0 cm by default.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_487_1.png)


    Figure 14.9 – The character''s location


    We can represent the character''s location simply as (50.0, 0.0, 20.0). The couch''s
    location is (450.0, 0.0, 20.0), which can be seen in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 488
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_488_0.png)


    Figure 14.10 – The couch''s location


    Now, let''s see how to use a vector to represent movement. We are going to instruct
    our character on how to get to the couch. They need to know the direction and
    distance in which they must move. The following screenshot shows that we are instructing
    the character to move **400 cm** on the x axis:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_488_1.png)


    Figure 14.11 – Moving 400 cm on the x axis


    Both the direction and distance are represented by a single vector, using X, Y,
    and Z values. In the previous screenshot, the value of the vector that describes
    the movement is (400, 0, 0).


    If we take the character location vector and add it to the vector that represents
    this movement, then the result is the couch location vector. To add two vectors,
    add each of their elements:'
  merge: -1
  img_proc: true
- pgno: 489
  md: '```

    couch_location = character_location + vector_movement

    couch_location = (50, 0, 20) + (400, 0, 0)couch_location =

    (50 + 400, 0 + 0, 20 + 0)couch_location = (450, 0, 20)

    ```


    If we have a start point and a destination point, and we want to find out the
    movement vector, then we just need to get the destination point and subtract the
    start point.


    For example, if we want to know the vector that leads from the start point of
    (25, 40, 55) to the destination point of (75, 95, 130), then we need to solve
    this expression:


    ```

    vector_movement = destination_point - start_point

    vector_movement = (75, 95, 130) - (25, 40,

    55)vector_movement = (75 - 25, 95 - 40, 130 -

    55)vector_movement = (50, 55, 75)

    ```


    Now, let''s see how we can represent a vector.


    # # Representation of a vector


    A vector is a directed line segment and can be represented by an arrow.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_489_0.png)


    Figure 14.12 – Arrow representing a vector


    Point A is the initial point of the vector and point B is the terminal point.
    The initial point of all world locations is always (0, 0, 0), whereas the initial
    point of all relative locations is always the terminal point of the parent of
    the component.'
  merge: -1
  img_proc: true
- pgno: 490
  md: 'A vector has a magnitude (or length) and a direction. Two vectors are equivalent
    if they have the same magnitude and direction.


    # Vector operations


    Several mathematical operations can be done with vectors. Understanding these
    operations is fundamental to manipulating objects in 3D space:


    Vector addition: The sum of two vectors is determined by adding each of their
    elements. The following example shows the sum of vectors (3, 5, 0) and (5, 2,
    0):


    ```

    v1 = (3, 5, 0)v2 = (5, 2, 0)v1 + v2 = (3 + 5, 5 + 2, 0 +

    0)v1 + v2 = (8, 7, 0)

    ```


    The following is a graphical representation of the previous example of vector
    addition. To simplify the graph, we are only drawing the x and y axes. The initial
    point of v1 is the world origin (x=0, y=0, z=0). The terminal point of v1 is (x=3,
    y=5, z=0). The initial point of v2 is the terminal point of v1 and the terminal
    point of v2 is the result of the sum (x=8, y=7, z=0).'
  merge: -1
  img_proc: true
- pgno: 491
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_491_0.png)


    # Figure 14.13 – Adding vectors


    For example, if v1 is the character''s world location and v2 is the relative location
    of the character''s weapon, then v1 + v2 will be the weapon''s world location.


    The following screenshot shows the vector addition node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_491_1.png)


    # Figure 14.14 – Node to add vectors


    +   Vector subtraction: The subtraction of one vector from another is determined
    by subtracting each of its elements. This is an example of vector subtraction
    using the vectors (6, 8, 0) and (1, 4, 0):


    ```

    v1 = (6, 8, 0) v2 = (1, 4, 0) v1 - v2 = (6 - 1, 8 - 4, 0 -

    0) v1 - v2 = (5, 4, 0)

    ```'
  merge: -1
  img_proc: true
- pgno: 492
  md: 'The following is a graphical representation of the previous example of vector
    subtraction. Since this is subtraction, the v2 vector is represented by its opposite
    vector:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_492_0.png)


    # Figure 14.15 – Subtracting vectors


    For example, if v1 is the character weapon''s world location and v2 is the relative
    location of the character''s weapon, then v1 - v2 will be the character''s world
    location.


    The vector subtraction node is shown in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_492_1.png)


    # Figure 14.16 – Node to subtract vectors'
  merge: -1
  img_proc: true
- pgno: 493
  md: '+   Length of a vector: The length (or magnitude) of a vector is the distance
    between its initial and terminal points. If you have two world locations, the
    length of the difference between the two will be the distance between those world
    locations. The length of a vector is calculated using the Blueprint node shown
    in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_493_0.png)


    Figure 14.17 – VectorLength node


    +   Normalizing vectors: We use vector normalization to find a unit vector. The
    unit vector has a length equal to one. It is often used when direction needs to
    be indicated. There is a node named Normalize that receives a vector as input
    and returns the normalized vector:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_493_1.png)


    Figure 14.18 – Normalize vector node


    +   Scalar vector multiplication: An integer or float number is also known as
    a scalar value. The multiplication of a vector by a scalar value is done by multiplying
    each of its elements by the scalar value. This operation changes the length of
    the vector, but the direction remains the same unless the scalar is negative,
    in which case the vector will point in the opposite direction following multiplication.'
  merge: -1
  img_proc: true
- pgno: 494
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_494_0.png)


    # Figure 14.19 – Multiplying a vector by a float


    # Note


    The multiply node is a wildcard node. This means that when you connect a vector
    variable to the node, it will be converted into a **Vector x Vector** node. You
    need to right-click on the second input pin, hover over **Convert Pin...**, and
    select **Float**.


    > ● **Dot product**: The dot product is a projection of one vector onto another
    vector. The dot product of two normalized vectors is equal to the cosine of the
    angle formed between the vectors and can range from -1.0 to 1.0 :


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_494_1.png)


    # Figure 14.20 – Dot product node


    The dot product can be used to verify the relationship between two vectors, such
    as whether they are perpendicular or parallel. The following diagram shows some
    examples of a dot product between two vectors, **A** and **B**:'
  merge: -1
  img_proc: true
- pgno: 495
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_495_0.png)


    Actor vectors: There are functions that return the forward, right, and up vectors
    of an actor. The returned vectors are normalized (length = 1). The following screenshot
    shows these functions, which are often used to direct movement:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_495_1.png)


    To find the opposite vector, just multiply the vector by -1. By doing this, you
    can find the backward, left, and down vectors of an actor. The following screenshot
