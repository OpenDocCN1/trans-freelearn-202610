    We covered the containers available in Blueprints, which are arrays, sets, and
    maps, and learned when we should use each of them. The use of containers avoids
    the need to create several single variables to store information. In the next
    section, we will see other data structures that help to organize data within a
    game or application.


    # ## Exploring other data structures


    There are data structures that are not created within a Blueprint class. They
    are independent auxiliary assets that can be used in a Blueprint. With these data
    structure assets, you are able to add your own data types to a project and can
    learn how to use tools that help you deal with a large volume of data in your
    project.


    Let''s learn how to create and use enumerations, structures, and data tables.


    # ## Enumerations


    An **enumeration**, also known as an **enum**, is a data type that contains a
    fixed set of named constants and can be used to define the type of a variable.
    The value of a variable whose type is an enumeration is restricted to the set
    of constants defined in the enumeration.


    Follow these steps to create an enumeration:'
  merge: -1
