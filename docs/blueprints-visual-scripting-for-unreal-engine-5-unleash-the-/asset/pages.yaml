- pgno: 100
  md: '# # Chapter 4: Understanding Blueprint Communication


    This chapter presents **Blueprint Communication**, which allows one Blueprint
    to access information from, and call the functions and events of, another Blueprint.
    In this chapter, we will explain **Direct Blueprint Communication** and show you
    how to reference Actors on a Level Blueprint. The concept of casting is explained
    in depth because it is an essential part of Blueprint Communication. We are also
    going to learn about **Event Dispatchers**, which enable communication between
    Blueprint classes and the Level Blueprint, as well as how to bind Events.


    For each of these topics, we will do step-by-step examples to facilitate our understanding
    of the concepts and practice the creation of Blueprint scripts.


    The following topics will be covered in this chapter:


    +   - Direct Blueprint Communication

    +   - Casting in Blueprints

    +   - Level Blueprint Communication

    +   - Event Dispatchers

    +   - Binding Events


    # ## Direct Blueprint Communication


    Direct Blueprint Communication is a simple method of communication between Blueprints/Actors.
    It is used by creating an object reference variable that stores a reference to
    another Actor/Blueprint. Then, we can call Actions using this object reference
    variable as the **Target** input parameter of these Actions.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'As an example, let''s create a Blueprint called BP_LightSwitch. The BP_LightSwitch
    Blueprint has an object reference variable of the Point Light type that references
    a Point Light placed in the Level. When the player overlaps the BP_LightSwitch
    Blueprint on the Level, it toggles the visibility of the Point Light.


    To create the Blueprint, follow these steps:


    +   1. Open any existing project that you created that contains starter content
    or create one if you want.


    +   2. Click on the Content Drawer button to open Content Browser, then click
    the Add button and select Blueprint Class.


    +   3. On the next screen, choose Actor as the parent class.


    +   4. Name the Blueprint BP_LightSwitch and double-click it to open the Blueprint
    Editor.


    +   5. Click the Add button in the Components panel and choose the Static Mesh
    Component. In the Details panel, choose the SM_CornerFrame Static Mesh, as shown
    in the following screenshot. This Static Mesh is a simple visual representation
    of our light switch. Also, change Collision Presets to OverlapAllDynamic so that
    Static Mesh will not block the player''s movement:'
  merge: -1
