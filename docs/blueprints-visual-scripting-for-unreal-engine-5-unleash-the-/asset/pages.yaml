- pgno: 638
  md: '# # Chapter 19: Procedural Generation


    In this chapter, we will look at several ways to generate level content automatically.
    You can use the Construction Script of a Blueprint to script procedural generation
    and use the Spline tool to define a path that will be used as a reference to position
    the instances. Also, you can create an Editor Utility Blueprint to manipulate
    Assets and Actors in edit mode.


    In this chapter, we will cover the following topics:


    +   - Procedural generation with the Construction Script

    +   - Creating Blueprint Splines

    +   - Editor Utility Blueprints


    By the end of this chapter, you will know how to generate Level contents using
    the Construction Script and how to create a Blueprint Spline to place Actors on
    a predefined path. You will also be able to create Blueprint functions that run
    in the Editor.


    # # Procedural generation with the Construction Script


    Procedural generation is a method of creating level content using scripts instead
    of manually. It can be used to avoid repetitive tasks in level editing. Our main
    tool to make procedural generation in Blueprints is the Construction Script.


    We saw how to use the Construction Script in <u>Chapter 3, Object-Oriented Programming
    and the Gameplay Framework</u>, to allow a Level Designer to change the Static
    Mesh of a Blueprint in the Level Editor.'
  merge: -1
  img_proc: true
- pgno: 639
  md: 'A useful component for procedural generation is the **Instanced Static Mesh**
    component. This component is optimized to render multiple copies of the same mesh
    in the level.


    # Note


    There is also the **Hierarchical Instanced Static Mesh** component, which is similar
    to **Instanced Static Mesh** but is useful when the mesh has a **Level of Detail
    (LOD)**.


    We set the Static Mesh in the component and use the **Add Instance** function
    to add an instance on the level using **Instance Transform**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_639_0.png)


    Figure 19.1 – The Add Instance function


    We will create a Blueprint named `BP_ProceduralMeshes` to see the procedural generation
    in action. This Blueprint will add rows of static mesh instances on the level.
    The Level Designer will be able to specify the Static Mesh used, the number of
    rows, and how many instances per row.


    We will use a **Blank** project because we will be able to see the result in the
    Level Editor of the Blueprints of this chapter.


    Follow these steps to create the Procedural Generation Blueprint:


    +   1. Create a **Blank** project with the starter content:'
  merge: -1
  img_proc: true
