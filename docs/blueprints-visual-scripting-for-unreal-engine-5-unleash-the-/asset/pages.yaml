    Hover over **Volumes** to display a submenu and click on **Nav Mesh Bounds Volume**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_305_0.png)


    Figure 9.14 – Adding a NavMesh to the level


    +   2. Now, we need to move and scale up the **Nav Mesh Bounds Volume** object
    until the entire walkable space of our level is contained within it. In the **Details**
    panel, set **Location** to X = -316, Y = 2116, and Z = 460 and **Scale** to X
    = 20, Y = 44, and Z = 7:'
  merge: -1
  img_proc: true
- pgno: 306
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_306_0.png)


    Figure 9.15 – Modifying the NavMesh transform


