- pgno: 179
  md: '# Chapter 6: Enhancing Player Abilities


    In this chapter, we will expand on the core shooting interaction that we created
    in Chapter 5, Object Interaction with Blueprints, by making modifications to the
    player character Blueprint. The player character Blueprint that comes with the
    First Person template initially looks complex, especially when compared to the
    relatively simple Cylinder target Blueprint that we have already created from
    scratch. We will be looking into this Blueprint and breaking it down to see how
    each of its sections contributes to the player''s experience and allows them to
    control their character and shoot a gun.


    It would be quick and easy to just use an existing asset that works, without spending
    time learning how it accomplishes its functionality. However, we want to ensure
    that we can repair problems as they arise, as well as extend the functionality
    of the player controls to fit our needs better. For this reason, it is always
    advisable to take some time to investigate and learn about any external assets
    you might bring into a project that you are building.


    By the end of this chapter, we want to succeed in modifying the player character,
    so that we can add the ability to sprint, zoom the view, and destroy the objects
    we shoot with enjoyable explosions and sound effects. Along the way to achieving
    these goals, we will be covering the following topics:


    +   - Player inputs and controls

    +   - Field of View (FOV)

    +   - Timelines and branching logic

    +   - Adding sounds and particle effects to an object interaction'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Adding the running functionality


    We''ll begin our exploration of the `FirstPersonCharacter` Blueprint by adding
    simple functionality that will give our players more tactical options for moving
    around in the Level. Now, the player is limited to moving at a single speed. We
    will adjust the Blueprint to increase the movement speed of the **Character Movement**
    Component when the player presses the _Left Shift_ key, but first let''s learn
    about the Actions that are present in the **Event Graph** of `FirstPersonCharacter`.


    # Breaking down the character movement


    Let''s begin by opening the `FirstPersonCharacter` Blueprint. In **Content Browser**,
    access the `Content | FirstPersonBP | Blueprints` folder and double-click on the
    `FirstPersonCharacter` Blueprint. You will open the **Event Graph** and see a
    large series of Blueprint nodes. You can look around the **Event Graph** by right-clicking
    on the graph and dragging it. The first group of nodes we will look at is bounded
    by the **Event Graph** comment labeled **Stick input**, as shown here:'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_181_0.png)


    # Figure 6.1 – Stick input Events


    The red Event nodes are triggered at every frame and pass the **Axis Values**
    of **TurnRate** and **LookUpRate** from a controller input. These values are usually
    mapped to the left/right and up/down axis triggers of an analog stick. Note that
    there are only two axis triggers. Detecting a look down or a turn left Event is
    covered by these very nodes and is represented as a negative number in the **Axis
    Value** that is passed.


    Then, the values from the two axis triggers are each multiplied by a variable,
    representing the base rate at which the player is intended to be able to turn
    around or look up or down. The values are also multiplied by the world delta seconds
    to normalize against varying frame rates, despite the triggers being called every
    frame. The value resulting from multiplying all the three inputs is then passed
    to the **Add Controller Pitch Input** and **Add Controller Yaw Input** functions.
    These are the functions that add'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'translations between the controller input and the effect on the player camera.


    Below the **Stick input** group of Blueprint nodes, there is another comment block,
    called **Mouse input**, and it looks quite like the **Stick input** group:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_182_0.png)


    # Figure 6.2 – Mouse input Events


    Mouse input converts input from mouse movements (as opposed to controller axis
    sticks) into data, and then passes those values directly to the corresponding
    camera yaw and pitch input functions, without needing the same kind of calculations
    that are necessary for analog input.


    Now, let''s look at the group of nodes that manage player movement, as shown in
    this screenshot:'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_183_0.png)


    # Figure 6.3 – Movement input Events


    The **Select** nodes test whether the player is using a **virtual reality head-mounted
    display (VR HMD)**. If a VR HMD is enabled, then the vectors used are from **FirstPerson
    Camera**; if it isn''t, then the vectors used are from the Actor root Component.


    Functionally, the other nodes are set up similarly to the **Stick input** and
    **Mouse input** groups. The axis value is taken from the forward and right movement
    axis inputs on a controller or keyboard. Again, these nodes represent backward
    and left movements as well, in the form of negative values for the **Axis Value**
    outputs. The significant difference in movement translation is that we require
    the direction that the Actor is going to be moved in, so that the degree of movement
    can be applied in the correct direction. The direction is pulled from the **Get
    Actor Vector** nodes (both'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'forward and right) and attached to the **World Direction** input of the **Add
    Movement Input** nodes.


    The last movement-related group of nodes to look at is the node group contained
    within the comment block labeled **Jump**. This group is simply made up of a trigger
    node that detects the pressing and releasing of the key mapped to jumping and
    applies the *Jump* function from when the button is pressed until it is released.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_184_0.png)


    Figure 6.4 – Jump input Event


    We saw the **Actions** of the *FirstPersonCharacter* that control the character
    movement. We will learn now how to map a keypress to an Action.


    # Customizing control inputs


    We have seen how the **First Person** template has mapped certain player input
    Actions, such as moving forward or jumping, to Blueprint nodes in order to produce
    the behavior for the Actions. To create new kinds of'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'behavior, we will have to map new physical control inputs to additional player
    Actions. To do that, follow these steps:


    +   1. To change the input settings for your game, click on the Settings button
    on the far right of the toolbar, and select the Project Settings option:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_185_0.png)


    Figure 6.5 – Accessing the Project Settings


    +   2. On the left side of the window that appears, look for the Engine category
    and select the Input option.


    +   3. Inside the Engine category, in the Input Settings menu, you will see two
    sections under the Bindings category called Action Mappings and Axis Mappings.
    Click on the > symbol on the left of each section to show the existing mappings.


    **Action Mappings** are keypress and mouse click Events that trigger player Actions.
    Axis Mappings map player movements and Events that have a range, such as the W
    key and S key both affecting the Move Forward Action, but on different ends of
    the range. Both our Sprint and Zoom functions are simple Actions that are either
    active or inactive, so we will add them as Action Mappings:'
  merge: -1
