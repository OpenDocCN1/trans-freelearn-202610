- pgno: 565
  md: '# # Chapter 17: Animation Blueprints


    Part 4 presented data structures, flow control, math nodes, Blueprints tips, and
    an introduction to virtual reality development.


    In Part 5, we will look at Animation Blueprints, Blueprint libraries and components,
    procedural generation, and the Product Configurator template.


    This chapter presents the main elements of the Unreal Engine animation system,
    such as Skeleton, Skeletal Mesh, Animation Sequences, and Blend Spaces. It shows
    how to script an Animation Blueprint using EventGraph and AnimGraph. It also explains
    how State Machines are used in an animation and how to create new states for an
    animation.


    These are the topics covered in this chapter:


    +   - Animation overview

    +   - Creating Animation Blueprints

    +   - Exploring State Machines

    +   - Importing the Animation Starter Pack

    +   - Adding Animation States


    By the end of the chapter, you will know how to use Animation Blueprints and how
    to add Animation States.


    # ## Animation overview


    The animation system in Unreal Engine is very flexible and powerful. It consists
    of numerous tools and editors that work together. In this chapter, we will look
    at the main concepts of animation in Unreal Engine with a focus on Animation Blueprints.'
  merge: -1
  img_proc: true
- pgno: 566
  md: 'We will start with a project using the Third Person template to see animation
    concepts and explore the Animation Editor.


    Follow these steps to create the project:


    +   1. Create a project using the **Third Person** template with starter content:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_566_0.png)


    Figure 17.1 – Creating a project using the Third Person template


    +   2. Press the **Play** button to try the default gameplay that is built into
    the Third Person template. You can move the player Character using the *WASD*
    keys and look around by moving the mouse. Press the *spacebar* to make the Character
    jump.


    Now that we have an example project, let''s explore the Animation Editor.


    # # Animation Editor


    There are five Animation Tools for working with Skeleton animation. These tools
    can be accessed by opening an associated asset. There are five buttons at the
    top right of each of the Animation Tools, as shown in the following screenshot,
    which are used to switch between the different tools:'
  merge: -1
  img_proc: true
- pgno: 567
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_567_0.png)


    Figure 17.2 – Using the buttons to switch between the Animation Tools


    The Animation Tools accessed by the buttons are from left to right:


    +   - Skeleton Editor: Used to manage Skeleton bones

    +   - Skeletal Mesh Editor: Used to modify the Skeletal Mesh that is linked to
    the Skeleton and represents the Character visually

    +   - Animation Editor: Allows the creation and modification of animation assets

    +   - Animation Blueprint Editor: Allows the creation of scripts and State Machines
    to control the animations that the Character must use according to its current
    state

    +   - Physics Asset Editor: Used to create physics bodies that will be used in
    simulations


    Let''s see the relationship between Skeleton and Skeletal Mesh.


    # Skeleton and Skeletal Mesh


    A Skeletal Mesh is linked to a Skeleton. A Skeleton is a hierarchy of interconnected
    bones used to animate the polygon vertices of a Skeletal Mesh.


    In Unreal Engine, Skeleton is a separate asset from Skeletal Mesh. As the animation
    is done in Skeleton, the animation can be shared by several other Skeletal Meshes
    that use the same Skeleton.


    Let''s visualize the Skeleton used by the Third Person template. Access the Content
    > Mannequin > Character > Mesh folder and double-click on the UE4_Mannequin_Skeleton
    asset to open the Skeleton Editor, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 568
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_568_0.png)


    # Figure 17.3 – The Skeleton Editor


    The left-side panel has the Skeleton Tree with the hierarchy of bones that are
    part of this Skeleton. You can select a bone and adjust its position and rotation
    relative to the Skeleton.


    # Animation Sequence


    An Animation Sequence asset contains keyframes that specify bone transformations
    at specific times. It is used to play a single animation on a Skeletal Mesh.'
  merge: -1
  img_proc: true
- pgno: 569
  md: 'The Animation Sequences available to a Skeleton can be viewed in the Asset
    Browser of the Animation Editor. The following screenshot shows the Animation
    Sequences of the Third Person template:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_569_0.png)


    Figure 17.4 – The Animation Sequences


    Double-click on an Animation Sequence to play it in the Viewport. The ThirdPersonRun
    Animation Sequence is playing in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 570
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_570_0.png)


    Figure 17.5 – Previewing the ThirdPersonRun Animation Sequence


    The **Asset Browser** of the Animation Editor lists other types of animation assets
    besides Animation Sequences. For example, in _Figure 17.4_, the **ThirdPerson_IdleRun_2D**
    asset has a different-colored icon because it is a **Blend Space**, which we will
    see in the next section.


    # # Blend Space


    Blend Space is an asset type that allows the blending of animations based on one
    or two parameter values. To facilitate understanding, let''s analyze the **ThirdPerson_IdleRun_2D**
    asset, which is a Blend Space based on one parameter.'
  merge: -1
  img_proc: true
- pgno: 571
  md: 'Double-click on the **ThirdPerson_IdleRun_2D** asset in the **Asset Browser**
    to open it in the Viewport. This Blend Space has a parameter named **Speed** and
    uses three Animation Sequences, which are **ThirdPersonIdle**, **ThirdPersonWalk**,
    and **ThirdPersonRun**. Hold the _Shift_ key to move the preview value of the
    **Speed** parameter, which is represented by the green plus icon:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_571_0.png)


    Figure 17.6 – Blending the walking and running Animation Sequences


    The **ThirdPerson_IdleRun_2D** Blend Space mapped the following **Speed** values
    for each Animation Sequence:'
  merge: -1
  img_proc: true
- pgno: 572
  md: '+   - ThirdPersonIdle: 0.0

    +   - ThirdPersonWalk: 93.75

    +   - ThirdPersonRun: 375.0


    In the example of *Figure 17.6*, the value used for **Speed** is approximately
    234.3, then the resulting animation is using 50% of **ThirdPersonWalk** and 50%
    of **ThirdPersonRun**.


    Animation in Unreal Engine is an extensive topic that requires the study of specific
    documentation aimed at animators. The purpose of this animation overview section
    was to introduce the main animation concepts so that you can work with **Animation
    Blueprints**, which we will introduce in the following section.


    # # Creating Animation Blueprints


    An Animation Blueprint is a specialized Blueprint with tools geared toward Character
    animation scripting. The Animation Blueprint Editor is like the Blueprint Editor,
    but it has some specific panels for animation.


    Follow these steps to create an Animation Blueprint:


    +   1. Click the **ADD** button in the **Content Browser**, and in the **Animation**
    submenu, select **Animation Blueprint**, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 573
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_573_0.png)


    # Figure 17.7 – Creating an Animation Blueprint


    2. In the next window, you need to select the target Skeleton. The animation assets
    and the Animation Blueprint are linked to a specific Skeleton. Optionally, you
    can select a different parent class instead of the default class. For this example,
    do not select a parent class and select UE4_Mannquin_Skeleton, which is in the
    /Game/Mannquin/Character/ path:'
  merge: -1
  img_proc: true
- pgno: 574
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_574_0.png)


    # Figure 17.8 – Selecting the target Skeleton


    +   3. Give a name to the Animation Blueprint created in the **Content Browser**
    and double-click it to open the Animation Blueprint Editor.


    The Animation Blueprint Editor has two types of graphs that work together to create
    the animation. The **EventGraph** is the same as the one from the Blueprint Editor,
    but with some specific nodes for animation. In the **AnimGraph**, we can create
    State Machines and use nodes to play Animation Sequences and Blend Spaces.'
  merge: -1
  img_proc: true
- pgno: 575
  md: 'Let''s start by analyzing the EventGraph.


    # EventGraph


    We use the EventGraph of an Animation Blueprint to get data from the Pawn/Character
    that is using the Animation Blueprint instance and update the variables of the
    Animation Blueprint. The EventGraph has two nodes already added to the graph:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_575_0.png)


    Figure 17.9 – Animation Blueprint Editor EventGraph


    These are descriptions of the nodes:


    +   - Event Blueprint Update Animation: This event is executed at every frame,
    allowing for the updating of variables used by the animation. The Delta Time X
    parameter is the amount of time elapsed since the last frame.'
  merge: -1
  img_proc: true
- pgno: 576
  md: 'Try Get Pawn Owner: This function tries to get the reference of the Pawn or
    Character that is using the Animation Blueprint instance. We need this function
    so we can get Character data to use in the animation.


    If you need to do some initialization on the animation, you can use **Event Blueprint
    Initialize Animation**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_576_0.png)


    Figure 17.10 – Event used to initialize animation


    As an example of using the **EventGraph**, let''s create the `Speed` variable
    and update its value using data from the Pawn/Character that is using the Animation
    Blueprint instance.


    These are the steps to create the example:


    +   1. In the **My Blueprint** panel of the Animation Blueprint Editor, create
    a variable named `Speed` and set **Variable Type** to **Float**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_576_1.png)


    Figure 17.11 – Creating the Speed variable


    +   2. In the **EventGraph**, we will add the nodes shown in the following screenshot.
    If the **Pawn Owner** reference is valid, then we get the velocity vector of the
    Pawn and calculate its length to find the scalar value of **Speed**:'
  merge: -1
  img_proc: true
- pgno: 577
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_577_0.png)


    # Figure 17.12 – Updating the Speed variable


    +   3. Drag a wire from the white output pin of **Event Blueprint Update Animation**
    and add an **Is Valid** macro node. Connect the **Input Object** pin to the **Return
    Value** pin of the **Try Get Pawn Owner** node.


    +   4. Drag a wire from the **Is Valid** output pin and add a **SET Speed** node.


    +   5. Drag a wire from the **Return Value** pin of the **Try Get Pawn Owner**
    node and add a **Get Velocity** node.


    +   6. Drag a wire from the **Return Value** pin of the **Get Velocity** node
    and add a **VectorLength** node.


    +   7. Connect the **Return Value** pin of the **VectorLength** node to the **Speed**
    input pin.


    +   8. Compile and save the Animation Blueprint.


    Now that the **Speed** variable is updated, we can use it in the **AnimGraph**.


    # AnimGraph


    In the **AnimGraph**, we use nodes to play Animation Sequences and Blend Spaces.
    We can also create State Machines to organize the animation into states.


    The **AnimGraph** can only access variables from the Animation Blueprint, so we
    use the **EventGraph** to get the updated values from the Pawn.'
  merge: -1
  img_proc: true
- pgno: 578
  md: 'The final node of an Animation Graph is the **Output Pose** node, which will
    receive the resulting pose of each frame to apply to the Skeletal Mesh:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_578_0.png)


    Figure 17.13 – AnimGraph with the Output Pose


    There is an **Asset Browser** available in the bottom right of the Animation Blueprint
    Editor:'
  merge: -1
  img_proc: true
- pgno: 579
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_579_0.png)


    # Figure 17.14 – Asset Browser in the Animation Blueprint Editor


    You can drag an animation asset from the **Asset Browser** and drop it in the
    **AnimGraph** to create the equivalent node. In the example shown in the following
    screenshot, the **ThirdPersonRun** Animation Sequence was dropped in the **AnimGraph**
    to create the **Play ThirdPersonRun** node. You need to connect the white character
    icon of the **Play ThirdPersonRun** node to the white character icon of the **Output
    Pose** node and compile the Animation Blueprint to preview the animation in the
    Viewport:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_579_1.png)


    # Figure 17.15 – Playing the ThirdPersonRun animation in the Animation Blueprint
    Editor'
  merge: -1
  img_proc: true
- pgno: 580
  md: 'To create a **Blendspace Player** node, just drag a Blend Space asset, such
    as **ThirdPerson_IdleRun_2D**, and drop it in the **AnimGraph**. In the following
    screenshot, the value of the **Speed** variable is being used as the parameter
    of the Blend Space:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_580_0.png)


    Figure 17.16 – Playing a Blend Space in the Animation Blueprint Editor


    After compiling the Animation Blueprint, you can modify the value of the **Speed**
    variable in the **Anim Preview Editor**, located at the bottom right of the Animation
    Blueprint Editor:'
  merge: -1
  img_proc: true
- pgno: 581
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_581_0.png)


    Figure 17.17 – Anim Preview Editor


    Assign different values to the **Speed** variable between 0 and 375 and see the
    resulting animation in the Viewport.


    We saw how to connect the animation nodes directly to the **Output Pose** node,
    but the **AnimGraph** was created with a State Machine in mind. We will discuss
    State Machines in the following section.


    # Exploring State Machines


    A State Machine in the **AnimGraph** allows you to organize the animation into
    a series of states. To exemplify this, we will create a State Machine with two
    states: idle and moving.


    We need to define **Transition Rules** to control the transition from one state
    to another.'
  merge: -1
  img_proc: true
- pgno: 582
  md: 'Follow these steps to create the State Machine:


    +   1. Remove the other animation nodes and leave only the **Output Pose** node
    in the **AnimGraph**.


    +   2. Right-click on the AnimGraph, search for `state machine`, and select Add
    New State Machine...:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_582_0.png)


    Figure 17.18 – Adding a State Machine


    +   3. Rename the State Machine to `Char States`. You can rename it in the **Details**
    panel. Connect the white icon of the State Machine to the white icon of the **Output
    Pose** node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_582_1.png)


    Figure 17.19 – Connecting the State Machine to the Output Pose node


    +   4. Double-click on the **Char States** node to edit the State Machine. Then,
    right-click on the graph and select **Add State**... Rename the'
  merge: -1
  img_proc: true
- pgno: 583
  md: 'state to `Idle` and drag a wire from the **Entry** to **Idle** state node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_583_0.png)


    Figure 17.20 – Adding states


    +   5. Add another state and rename it to `Moving`. Drag a wire from the outer
    border of the **Idle** state node and connect it to the outer border of the **Moving**
    state node. Drag another wire from the **Moving** state node to the **Idle** state
    node. The arrow indicates that a transition is possible between the states:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_583_1.png)


    Figure 17.21 – The states and their transitions


    +   6. Double-click on the **Idle** state node to edit the state. Drag the **ThirdPersonIdle**
    Animation Sequence from the **Asset Browser** and drop it in the **AnimGraph**.
    Connect the white icons of the **Play ThirdPersonIdle** and **Output Animation
    Pose** nodes:'
  merge: -1
  img_proc: true
- pgno: 584
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_584_0.png)


    # Figure 17.22 – The Idle state


    +   7. You can alternate between the AnimGraph state screens by clicking the name
    of the screen in the path located at the top of the graph. This path is known
    as a breadcrumb. Click Char States in the breadcrumb and double-click on the Moving
    state.


    +   8. Drag the ThirdPerson_IdleRun_2D Blend Space from the Asset Browser and
    drop it in the AnimGraph. Drag a wire from the Speed input pin and add a Get Speed
    node. Connect the white icons of the ThirdPerson_IdleRun_2D and Output Animation
    Pose nodes:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_584_1.png)


    # Figure 17.23 – The Moving state


    +   9. Our next step is to specify the Transition Rules. Return to the Char States
    graph. The Transition Rules icons are created together with the transition arrows:'
  merge: -1
  img_proc: true
- pgno: 585
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_585_0.png)


    # Figure 17.24 – The Transition Rules icons


    +   10. Double-click on the Idle to Moving transition rule, which is the one at
    the top. The transition happens when the Result node receives the True value.
    In our example, if Speed is greater than 5.0, then the animation will change from
    the Idle to the Moving state. Add these nodes to the graph:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_585_1.png)


    # Figure 17.25 – Idle to Moving rule


    +   11. Return to the Char States graph and double-click on the Moving to Idle
    transition rule. Add the nodes to check whether Speed is less than 5.0. If it
    is True, then the animation will change from the Moving to the Idle state:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_585_2.png)'
  merge: -1
  img_proc: true
- pgno: 586
  md: 'Figure 17.26 – Moving to Idle rule


    +   12. Compile the Animation Blueprint and return to the Char States graph. You
    can modify the value of the Speed variable in Anim Preview Editor to see the transition
    between the states.


    +   13. Save and close the Animation Blueprint Editor.


    After this introduction to State Machines, we can now work with a more complex
    State Machine.


    # Importing the Animation Starter Pack


    In the next sections, we will use the Animation Starter Pack because it has more
    animations available.


    Follow these steps to import the Animation Starter Pack:


    +   1. Access the Epic Games Launcher and go to Unreal Engine | Library | Vault.
    Search for Animation Starter Pack and click the Add To Project button:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_586_0.png)


    Figure 17.27 – Adding the Animation Starter Pack to a project


    Note


    If you don''t have the Animation Starter Pack installed, follow the instructions
    in Chapter 9, Building Smart Enemies with Artificial Intelligence, to install
    it.'
  merge: -1
