    +   When you press the 2 key, a test is done using the **Is Valid** Macro to check
    whether the `BPFire` variable is referencing a valid instance. This check is necessary
    to avoid calling a function using a null reference. If the value of `BPFire` is
    **None**, then it is not valid. If it is valid, then it calls the **DestroyActor**
