- pgno: 196
  md: 'These steps complete our implementation to animate a zoomed view. Now, let''s
    make some adjustments to the FirstPersonProjectile Blueprint.


    # Increasing the projectile''s speed


    Now that we have given the player character a new gameplay option to navigate
    the world, our focus will be back on the shooting mechanics. Right now, the shots
    fired from the gun on the controller are spheres that slowly arc through the air.
    We want to better approximate the fast-moving bullets that we are used to from
    traditional shooters.


    To change the properties of Projectile, we need to open the Blueprint called FirstPersonProjectile,
    which is in the Content|FirstPersonBP|Blueprints folder. Once opened, look at
    the Components panel and click on Projectile. This is a projectile movement Component
    that has been added in the FirstPersonProjectile Blueprint to define how the sphere
    will travel once it is created in the world:


    +   1. In the Details panel, you will see that Projectile has a lot of variables
    that describe its movement. We are interested in only a few of these at this time:'
  merge: -1
  img_proc: true
- pgno: 197
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_197_0.png)


    # Figure 6.16 – Projectile variables


    First, find the **Initial Speed** and **Max Speed** fields, which are currently
    set to 3000. **Initial Speed** determines how fast the projectile travels when
    it is first created at the tip of our gun, and **Max Speed** determines how fast
    it can go if an additional force is applied to it after creation. If we had a
    rocket, we might wish to apply acceleration to the rocket after it is launched
    to signify the thruster engaging. However, since we are representing a bullet
    coming from a gun, it makes more sense to make its initial speed the fastest that
    the bullet will ever travel at. Adjust both **Initial Speed** and **Max Speed**
    to twice their original value: 6000.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Let''s change the **Projectile Gravity Scale** from `1.0` to `0.1`. That way,
    the bullet appears very light and thus not affected by gravity much.


    Additionally, you might have noticed that the current projectile bounces off walls
    and objects as if it were a rubber ball. However, we want to mimic a harder and
    more forcefully impacting projectile. To remove the bouncing, look for the **Projectile
    Bounces** section in the **Details** panel and uncheck the box next to **Should
    Bounce**. The other values dictate the way in which the projectile bounces only
    if **Should Bounce** is checked, so there is no need to adjust them.


    One last change to make in **Event Graph** is to connect the **False** pin of
    the **Branch** node to the **DestroyActor** function so that the projectile is
    always `Destroyed` when it collides with anything:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_198_0.png)


    # Figure 6.17 – Projectile Event Graph


    Now, compile, save, and click on **Play**. You will find that shooting the gun
    results in a much further-reaching projectile and that the projectile does not
    bounce off the walls anymore.


    We modified the projectile''s speed and unchecked the bouncing property to make
    the projectile behaves like a bullet. The next Blueprint we will modify is the
    `BP_CylinderTarget` to simulate an explosion when it is destroyed.'
  merge: -1
