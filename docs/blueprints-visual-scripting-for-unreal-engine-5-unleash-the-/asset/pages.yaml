- pgno: 199
  md: '# Adding sound and particle effects


    Now that we have the player moving and shooting to our liking, let''s turn our
    attention to the enemy targets. Shooting one of the target Cylinders currently
    results in it changing its color to red. However, there is nothing that the player
    can currently do to destroy a target outright.


    We can add more dynamics to our enemy interaction by producing Blueprint logic
    that destroys the target if it is shot more than once, while also increasing the
    reward for the player by producing a satisfying sound and visual effect once the
    target is destroyed.


    # Changing target states with branches


    Since we want to generate effects that will be triggered by changes in the state
    applied to our target Cylinder, we must ensure that this logic is contained within
    our BP_CylinderTarget Blueprint, which is in the Content | FirstPersonBP | Blueprints
    folder. Open the Blueprint and look at the node group connected to Event Hit.
    Right now, when our projectile hits the Cylinder object, these nodes tell it to
    swap to a red material. To add the ability to change how the Cylinder behaves
    when it is shot more than once, we will need to add a check to our Blueprints
    to see if the Cylinder has already been hit, and then trigger a different result
    depending on its state.


    We will use a Branch node to help us handle this scenario:'
  merge: -1
  img_proc: true
- pgno: 200
  md: "![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_200_0.png)\n\nFigure 6.18 – Using\
    \ the Branch node to check if the Cylinder has already been hit\nbeen hit\n\n\
    The Branch node takes a Boolean variable as an input. Since Boolean values can\
    \ only be either True or False, the Branch node can produce only two outcomes.\
    \ These two outcomes can be executed by linking additional nodes to the two output\
    \ execution pins, representing the True path and the False path.\n\nThe first\
    \ step of creating Branch is to determine what will be represented by your Boolean,\
    \ and what will cause the conditional value to change from False to True. In our\
    \ case, we want to create a Primed variable to show that the target has been hit\
    \ and that it could be destroyed with a second hit. Let's go ahead and create\
    \ a Primed Boolean variable:\n\n+   1. In the My Blueprint panel, click on the\
    \ + button of the Variables category to add a new variable. Set Variable Type\
    \ to Boolean and give the name Primed to the new variable.\n+   \n+   2. Compile\
    \ and save the Blueprint. Because we do not want our targets to be in a Primed\
    \ state before they have been hit for the first time, we will leave the default\
    \ value of our variable as False (represented by an unchecked box).\n+   \n+ \
    \  3. Now that you have a Primed Boolean variable, drag it from the My Blueprint\
    \ panel to Event Graph, and select the Get option that"
  merge: -1
  img_proc: true
- pgno: 201
  md: 'appears in the submenu when you drop the variable on Event Graph..


    +   4. Click and drag a wire from the output pin of the new **Primed** node to
    empty grid space on **Event Graph**. Search for and add the **Branch** node.


    +   5. Finally, we can add **Branch** to our **Event Hit** Blueprint group. Break
    the connection between the **Cast To FirstPersonProjectile** and **Set Material**
    nodes by holding down the _Alt_ key and clicking on one of the execution pins.


    +   6. Drag the **Set Material** node out of the way for a moment, and then connect
    the output execution pin of the **Cast To** node to the input execution pin of
    the **Branch** node. This Blueprint will now call the **Branch** evaluation every
    time the target Cylinder is hit by a projectile.


    Now that we have our **Branch** node set up, we need to provide the target Cylinder
    with instructions on what to do in each state. Namely, what should happen when
    it is first hit (the **Primed** variable is **False**) and what should happen
    when it is hit a second time (the **Primed** variable is **True**).


    Let''s handle when the target is hit for the first time. In this case, we must
    change **Material** to **TargetRed**. Additionally, we will also have to set our
    **Primed** Boolean variable to **True**. This way, when the target is hit again,
    the **Branch** node will route the behavior to the **True** execution pin. The
    **False** execution sequence of nodes will look like this:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_201_0.png)'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Figure 6.19 – Changing to a red material when hit for the first time


    +   7. Drag the **Set Material** node you moved aside before to the right of the
    **Branch** node, and then connect the **False** output execution pin of the **Branch**
    node to the **Set Material** node''s input execution pin.


    +   8. Now, drag the **Primed** variable from the **My Blueprint** panel to **Event
    Graph**, and select the SET option. Connect this node to the **Set Material**
    node''s output execution pin and click on the checkbox next to **Primed** within
    the SET node. This will ensure that the next time **Target** is hit, **Branch**
    evaluates to **True**.


    We defined the actions of the **False** path of the **Branch** node. The next
    step is to define the sequence of actions that will be triggered from the **True**
    path of the **Branch** node.


    # Triggering sound effects, explosions, and destruction


    There are three things we wanted to accomplish when destroying a target. These
    were hearing an explosion, seeing an explosion, and removing the target object
    from the game world. We''ll start with the often undervalued, but always critical,
    element of satisfying game experiences: sound.


    The most basic interaction we can design with sound is to play a .wav sound file
    at a location in the game world once, and this will work perfectly for our purpose.
    Drag a wire from the **True** execution node of the **Branch** node to empty grid
    space, and search for the **Play Sound at Location** node:'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_203_0.png)


    # Figure 6.20 – Playing an explosion sound


    **Play Sound at Location** is a simple node that takes a **Sound** file input
    and a **Location** input, and then—as you might have guessed—plays the sound at
    that location. There are several sound files included in the **Starter Content**
    we brought into this project, and you can see the list of these by clicking on
    the drop-down menu underneath the **Sound** input. Find and select **Explosion01**
    to set an explosion **Sound** effect.


    Now that we have set **Sound**, we need to determine where the sound will play.
    We can use a process like the one we used to set the FOV by taking the Static
    Mesh Component of the Cylinder target, extracting its location value, and then
    linking that location vector directly to our **Sound** node. However, the **Event
    Hit** trigger will make this process easier on us.


    One of the many output pins on the **Event Hit** node is called **Hit Location**.
    This pin contains the location in the space where the two objects evaluated by
    **Event Hit** collide with one another. The location of our projectile hitting
    the target is a perfectly reasonable place to generate the explosion effect, so
    go ahead and drag a wire from **Hit Location** on the **Event Hit** node to the
    **Location** input pin on **Play Sound at Location**.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_204_0.png)


    # Figure 6.21 – Using the Hit Location


    Compile, save, and play to test the Blueprint. Shooting one of the moving targets
    once will cause it to turn red. Every hit after that should produce an explosion
    sound effect.


    Now that we have set up the sound of our explosion, let''s add the visual effect
    and destroy the Cylinder, following these steps:


    +   1. Drag a wire from the output execution node of Play Sound at Location to
    empty grid space. Search for and select the Spawn Emitter at Location node.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_204_1.png)'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Figure 6.22 – Spawning particle effects


    # Important Note


    An emitter is an object that will produce particle effects in a particular location.
    Particle effects are collections of small objects that combine to create the visual
    effect of objects that are fluid, gaseous, or otherwise intangible, such as waterfall
    impacts, explosions, or light beams.


    The **Spawn Emitter at Location** node looks similar to the **Sound** node we
    are attaching it to, but with more input parameters and the **Auto Destroy** toggle.


    +   2. In the drop-down menu beneath **Emitter Template**, find and select the
    **P_Explosion** effect. This is another asset that came packed with the Starter
    Content we pulled into our project and will produce a satisfying-looking explosion
    wherever its emitter is attached.


    +   3. Since we want the explosion to be generated in the same location as the
    sound of the explosion, we will click and drag the same **Hit Location** pin of
    the **Event Hit** node over into the **Location** pin of **Spawn Emitter at Location**.


    The explosion is a 3D effect that looks the same from all angles, so we can leave
    the **Rotation** input alone. The toggle for **Auto Destroy** determines whether
    the emitter can be triggered more than once. We will destroy the Actor that contains
    this emitter once this particle effect is created, so we can leave the toggle
    box checked.


    +   4. Finally, we want to remove the target Cylinder from the game world after
    the sound and visual explosion effects are played. Drag the output execution pin
    from the **Spawn Emitter at Location** node and drop it into empty grid space.
    Search for and add the **DestroyActor** node. This node takes only a single **Target**
    input with a default value of **self**, which is a reference to the current instance.


    +   5. Extend the comment box around the entire **Event Hit** sequence of nodes
    and update the text to describe what the new sequence accomplishes. I chose `When
    hit, turn red and set to primed.`'
