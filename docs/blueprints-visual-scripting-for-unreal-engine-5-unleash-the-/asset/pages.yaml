    +   \n+   8. Drag a wire from the **Return Value** pin of **Get Blackboard** and\
    \ add a **Set Value as Object** node.\n+   \n+   9. Drag a wire from the **Key\
    \ Name** pin of the **Set Value as Object** node and add a **GET Player Key Name**\
