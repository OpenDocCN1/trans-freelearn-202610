- pgno: 605
  md: '# # Chapter 18: Creating Blueprint Libraries and Components


    In this chapter, you will learn how to create Blueprint Macro and Function libraries
    with common functionalities that can be used throughout a project. It will explain
    in more detail the concept of components. We will also learn how to create Actor
    Components with encapsulated behavior and Scene Components with location-based
    behaviors.


    These are the topics covered in this chapter:


    +   - Blueprint Macro and Function libraries

    +   - Creating Actor Components

    +   - Creating Scene Components


    By the end of this chapter, you will have created a Blueprint Function Library
    to simulate dice rolls, an Actor Component to manage experience points and leveling
    up, and a Scene Component that rotates around the Actor.


    # # Blueprint Macro and Function libraries


    Sometimes, in a project, you identify a macro or function that can be used in
    several Blueprints. The Unreal Editor allows you to create a Blueprint Macro Library
    to gather the macros that you want to share between all Blueprints. In the same
    way, you can create a Blueprint Function Library to share utility functions between
    all Blueprints.


    The menu options to create Blueprint Function Library and Blueprint Macro Library
    are in the Blueprints submenu that appears when creating'
  merge: -1
  img_proc: true
- pgno: 606
  md: 'an asset:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_606_0.png)


    Figure 18.1 – The menu options to create Blueprint Macro and Function Libraries


    When creating a Blueprint Macro Library, you need to choose a Parent class. The
    macros of the library will have access to variables and functions of the Parent
    class selected, but the Macro Library can only be used by subclasses of the chosen
    Parent class. Selecting the Actor class will be the best option in most cases.


    Let''s create a Blueprint Function Library to see in practice how we can share
    functions between all Blueprints.


    # A Blueprint Function Library example


    We will create a Blueprint Function Library for a dice roll named BP_DiceLibrary
    with three functions – RollOneDie, RollTwoDie, and RollThreeDie. All functions
    have the same input parameter named NumberOfFaces and return the result of each
    dice and the sum.'
  merge: -1
  img_proc: true
