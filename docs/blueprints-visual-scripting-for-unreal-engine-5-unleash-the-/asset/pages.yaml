- pgno: 293
  md: '# Chapter 9: Building Smart Enemies with Artificial Intelligence


    In this chapter, we''ll add another challenge to our gameplay by making enemies
    that pose a threat to our player. To do so, we''ll leave behind our target cylinders
    in favor of enemies that have AI behavior. We want to set up enemies that have
    the potential to pose a threat to the player and can analyze the world around
    them to make decisions. To accomplish this, we are going to learn about Unreal
    Engine''s built-in tools for handling AI behavior and how those tools interact
    with our Blueprint scripting. In the process, we will cover these topics:


    +   - Setting up the enemy actor to navigate

    +   - Creating navigation behavior

    +   - Making the AI chase the player


    By the end of the chapter, we will be able to create a Behavior Tree that handles
    enemy navigation in the level and make them chase the player when they are in
    their line of sight.


    # Setting up the enemy actor to navigate


    Until now, our targets have been represented by basic cylinder geometry. This
    worked well for prototyping a non-responsive target that is only present as an
    aiming challenge for the player. However, an enemy that will move around and present
    a threat to the player will need a recognizable appearance that will at least
    indicate its direction of travel to the player. Fortunately for us, Epic has created
    a freely available asset package for Unreal Engine that we can use to add a humanoid
    model to our game – one that is suitable for our new enemy type.'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'In the following sections, we will learn how to import an asset package from
    the Marketplace, expand the play area, use a navigation mesh, and create the AI
    assets used by the enemies.


    # Importing from the Marketplace


    First, we''ll step out of the Unreal Engine Editor and focus on the Epic Games
    Launcher.


    Follow these steps to import a free asset package from the Marketplace:


    +   1. Open Epic Games Launcher and click on the Unreal Engine section on the
    left side of the window.


    +   2. Click on the **Marketplace** tab at the top and search for `animation starter
    pack`.


    +   3. Click on the **Add to Cart** button of **Animation Starter Pack**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_294_0.png)


    Figure 9.1 – The Unreal Engine Marketplace


    +   4. Click on the **Shopping Cart** icon located at the top right.


    +   5. Click on the **Check Out** button in the **Shopping Cart** panel.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '+   6. When the panel closes, click on the image of **Animation Starter Pack**
    to open the asset page.


    +   7. Click on the **Add to project** button and select the project you have
    been using to build your game. A folder called `AnimStarterPack` will be added
    to the `Content` folder of your project.


    **Animation Starter Pack** has the assets that we need to represent the enemy.
    Now, we need more space in the play area for the player and the enemies.


    # Expanding the play area


    To provide an interesting environment for our intelligent enemies to chase the
    player, we need to make some changes to the default first-person example map layout.
    The existing layout, while being serviceable for shooting targets, is too cramped
    for a player to be able to avoid an enemy that is chasing them.


    To quickly add a little bit of variety to the gameplay, we will expand the play
    area to be twice as wide as it was earlier. We will also create an elevated area
    that is accessible by ramps to both the player and the enemies. The following
    screenshot shows the new level layout:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_295_0.png)'
  merge: -1
  img_proc: true
