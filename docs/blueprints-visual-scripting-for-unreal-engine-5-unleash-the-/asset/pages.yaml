- pgno: 438
  md: '# # Chapter 13: Data Structures and Flow Control


    In Part 3, we learned how to create a basic AI game using Behavior Trees, how
    to add game states, and how to package a game for distribution.


    Part 4 will teach you about advanced Blueprint concepts that will help when developing
    complex games. We will learn about data structures, flow control, math nodes,
    and Blueprint tips, and gain an understanding of virtual reality development.


    This chapter will explain what data structures are and how they can be used to
    organize data in Blueprints. We will learn about the concept of containers and
    how to use arrays, sets, and maps to group multiple elements, as well as other
    ways to organize data using enumerations, structures, and data tables. In this
    chapter, we will also see how to control a Blueprint''s flow of execution by using
    various types of flow control nodes.


    We will cover the following topics in this chapter:


    +   - Exploring different types of containers

    +   - Exploring other data structures

    +   - Flow control nodes


    By the end of the chapter, you will know about various data structures and flow
    control nodes that will increase your ability to solve problems in Blueprints.


    # ## Exploring different types of containers'
  merge: -1
  img_proc: true
- pgno: 439
  md: 'A container is a type of data structure whose instances can store collections
    of values or instances. The values in a container must be of the same type.

    An element of a container can be retrieved later by using a label that the element
    is associated with.


    The containers available in Blueprints are arrays, sets, and maps. To turn a

    variable into a container, click the icon next to **Variable Type** and choose

    one of the containers that appear, as shown in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_439_0.png)


    Figure 13.1 – Creating a container


    We will start by learning about the most used container type – an array.


    # Array


    An **array** is a container type that stores one or more values of a specific

    data type. Thus, a single variable can be used to store multiple values

    instead of using separate variables for each value.


    Arrays provide indexed access to their elements, so the label used to

    retrieve an element is the element''s sequential index in the container. Every

    element keeps its place in the array unless an element is inserted in the

    middle of it.


    These are the steps to create an array:'
  merge: -1
  img_proc: true
- pgno: 440
  md: '1. In the **My Blueprint** panel, create a variable and define its type.

    2. Click the icon next to the **Variable Type** drop-down menu and select the
    icon of an array, as shown in this screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_440_0.png)


    # Figure 13.2 – Creating an array of integers


    3. Compile the Blueprint to be able to add the default values of the array. In
    the **DEFAULT VALUE** panel of the variable, click the + icon to add elements
    to the array.


    The following screenshot shows an example of an **Integer** array named **Ammo
    Slot** with four elements used to store the amount of ammunition the player has.
    Each element of the array stores the amount of ammunition of a type of weapon:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_440_1.png)


    # Figure 13.3 – Adding the default values of an array


    # Note'
  merge: -1
  img_proc: true
- pgno: 441
  md: 'Arrays always start from index 0. So, in the previous example with four elements,
    the index of the first element is 0, and the index of the last element is 3.


    To get a value from an array, use the **Get (a copy)** node. This node has two
    input parameters, which are a reference to an array and the index of the element,
    as shown in the following screenshot. The **Get (a copy)** node creates a temporary
    copy of the value stored in the array; therefore, any changes to the value retrieved
    will not affect the value stored in the array:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_441_0.png)


    Figure 13.4 – Getting a value from an array


    To modify an element of an array, use the **Set Array Elem** node. The example
    in the following screenshot sets the **Item** value to `10` of the element with
    **Index** set to `2`:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_441_1.png)


    Figure 13.5 – Setting a value in an array element'
  merge: -1
  img_proc: true
- pgno: 442
  md: 'Two nodes can be used to add elements to an array. The **ADD** node adds an
    element to the end of the array. The **INSERT** node adds an element at the index
    passed as an input parameter, and all the elements that used to be in this index
    onward will move to the next indexes. For example, if we insert an element at
    index 2, then the previous element that was at index 2 will be moved to index
    3. The element that was at index 3 will be moved to index 4, and so on. The length
    of the array dynamically increases when using these nodes. Both nodes receive
    a reference as parameters to an array and a reference to the element that will
    be added to the array:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_442_0.png)


    Figure 13.6 – Adding elements to an array


    You can get the number of elements in an array by using the **LENGTH** node. Since
    the index of an array starts at zero, then the index of the last element will
    be **LENGTH** – 1. Alternatively, you can use the **LAST INDEX** node, which returns
    the index of the last element of the array. The following screenshot shows these
    two nodes:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_442_1.png)


    Figure 13.7 – Getting the length and last index of an array


    # Note'
  merge: -1
  img_proc: true
- pgno: 443
  md: 'Be careful not to access an index in an array greater than the last index.
    It may give unexpected results and, in turn, cause crashes that may be difficult
    to track down later.


    You can use the **Random Array Item** node to get a random element of the array.
    The **IS EMPTY** or **IS NOT EMPTY** nodes are used to check whether the array
    has elements:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_443_0.png)


    Figure 13.8 – Nodes to get a random array element and to check whether the array
    has elements


    The **Make Array** node is used to create an array from variables in the EventGraph.
    Click on **Add pin +** to add input pins. The example in the screenshot is from
    a Level Blueprint. There are four instances of **PointLight** in the level, and
    the **Make Array** node is used to create **Point Lights Array**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_443_1.png)'
  merge: -1
  img_proc: true
- pgno: 444
  md: "# Figure 13.9 – Using the Make Array node\n\nLet's create an example to examine\
