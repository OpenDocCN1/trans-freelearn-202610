  img_proc: true
- pgno: 56
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_56_0.png)


    Figure 2.17 – Macro example


    To add the macro to **Event Graph**, drag the name of the macro from the **My
    Blueprint** panel and drop it in **Event Graph**, or look for it in **Context
    Menu**. When the macro is executed, the actions that are in it will be executed.
    The following screenshot shows the `SetupNewWave` macro being called in **Event
    BeginPlay** with a value of `1` in the **Wave Number** input parameter.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_56_1.png)


    Figure 2.18 – Calling a macro


    # Creating functions


    One of the advantages of functions is that a function created in one Blueprint
