  md: 'There is another form of communication between Blueprints and Level Blueprint
    called Event Dispatchers.


    # # Event Dispatchers


    An Event Dispatcher allows a Blueprint to inform other Blueprints when an Event
    happens. The Level Blueprint and other Blueprint classes can listen to this Event,
    and they may have different Actions that run when the Event is triggered.


    We create Event Dispatchers in the My Blueprint panel. As an example, let''s create
    a Blueprint named BP_Platform. When an Actor overlaps the BP_Platform Blueprint,
    it calls an Event Dispatcher called PlatformPressed. The Level Blueprint is listening
    for the PlatformPressed Event and spawns an explosion when this Event is triggered:


    +   1. Create or use an existing project based on the Third Person template with
    the starter content.

    +   2. Create a Blueprint and use Actor as the parent class. Name it BP_Platform
    and open it in the Blueprint Editor.

    +   3. Click the Add button in the Components panel and choose the Static Mesh
    Component. In the Details panel, choose the Shape_Cylinder Static Mesh and change
    the Z value of the Scale attribute to 0.1. Also, change Collision Presets to OverlapAllDynamic,
    as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 126
  md: '0.1


    Shape_Cylinder


    OverlapAllDynamic'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Figure 4.27 – Setting up the Static Mesh


    4. Compile the Blueprint. In the **My Blueprint** panel, create an **Event Dispatcher**
    and name it `PlatformPressed`. An Event Dispatcher can have input parameters.
    Let''s create one to send a reference of the `BP_Platform` instance that was overlapped.
    In the **Details** panel, create a new parameter in the **Inputs** category, name
    it `BP_Platform`, and set it as a `BP Platform` type object reference, as shown
    in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_127_0.png)


    # Figure 4.28 – Creating an input parameter


    5. Right-click **Event Graph** and add **Event ActorBeginOverlap**. Drag the `PlatformPressed`
    Event Dispatcher and drop it in **Event Graph**. Choose **Call** in the submenu.
    Right-click **Event Graph**, search for `self`, and select the **Get a reference
    to self** action. The **Self Action** returns a reference of the current instance.
    Connect the Actions, as shown in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_127_1.png)


    # Figure 4.29 – Calling the Platform Pressed Event Dispatcher'
