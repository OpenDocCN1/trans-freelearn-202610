- pgno: 527
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_527_0.png)


    # Figure 15.24 – Tooltip and Category properties


    You can describe the purpose of the variable in the **Tooltip** property. The
    tooltip is shown when the mouse cursor is over the variable, as shown in the following
    screenshot. If the variable is set to **Instance Editable**, then it should have
    a tooltip so that the purpose of the variable is clear to the designer who is
    using an instance of the Blueprint in the Level.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_527_1.png)


    # Figure 15.25 – The tooltip appears when hovering over a variable


    The **Category** property is used to group related variables. You can create categories
    or select an existing category in the drop-down menu. Variables are separated
    by categories in the **My Blueprint** tab, which you can open and close when you
    need it. This separation makes it easier to understand'
  merge: -1
  img_proc: true
- pgno: 528
  md: 'the variables of a Blueprint. The following screenshot shows a category named
    **Round State**, which has three variables:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_528_0.png)


    Figure 15.26 – Variables are grouped by categories


    If you need to create variables that hold temporary values to help with more complex
    logic, then consider creating a function. A function allows the creation of local
    variables, which are only visible within the function. When you are editing a
    function, there is one more category for local variables in the **My Blueprint**
    panel, as shown in the following screenshot. Just a note; the values of local
    variables are discarded at the end of the function execution.'
  merge: -1
  img_proc: true
- pgno: 529
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_529_0.png)


    Figure 15.27 – Creating a local variable


    This section covers some best practices to deal with Blueprint responsibilities
    and complexities. We will now see how to use some interesting miscellaneous Blueprint
    nodes.


    # Using miscellaneous Blueprint nodes


    In this section, we will learn about some Blueprint nodes that can be very useful
    in certain situations.


    These are the nodes covered in this section:


    +   - Select

    +   - Teleport

    +   - Format Text'
  merge: -1
  img_proc: true
- pgno: 530
  md: '+   - Math Expression

    +   - Set View Target with Blend

    +   - AttachActorToComponent

    +   - Enable Input and Disable Input

    +   - The Set Input Mode nodes


    # Select


    The **Select** node is very flexible. It can work with several types of variables
    for the index and the values of options. The node returns a value associated with
    the option that corresponds to the index that is passed as input. The following
    screenshot shows the **Select** node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_530_0.png)


    Figure 15.28 – The Select node


    To add more input option pins, click on **Add pin +**. You can set a pin type
    of **Option 0**, **Option 1**, or **Index** by dragging a variable reference or
    wire onto the pins. **Option 0** and **Option 1** can be of any type, but the
    **Index** type must be **Integer**, **Enum**, **Boolean**, or **Byte**.


    The following screenshot shows the **Select** node in use:'
  merge: -1
  img_proc: true
- pgno: 531
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_531_0.png)


    Figure 15.29 – Example of a Select node


    There is an enumeration named **Difficult Level** that has the values of **Easy**,
    **Normal**, and **Hard**. The **Spawn Boss** custom event will spawn a different
    class of the **Boss Blueprint**, depending on the value of the **Difficult Level**
    enumeration variable. The option type in this example is `Actor Class Reference`.


    # Teleport


    The **Teleport** node moves an actor to the specified location. The advantage
    of using **Teleport** rather than setting the actor''s location is that if there
    is an obstacle at the location, then the actor is moved to a nearby place where
    there will be no collision.


    The following screenshot shows an example of using the **Teleport** node:'
  merge: -1
  img_proc: true
- pgno: 532
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_532_0.png)


    # Figure 15.30 – Example of a Teleport node


    There is a **BP Teleport Platform** Blueprint that has a reference to **Next Teleport
    Platform**. When the player overlaps **BP Teleport Platform**, they are teleported
    to **Next Teleport Platform**.


    # Format Text


    The **Format Text** node builds text based on a template text and parameters specified
    in the **Format** input parameter. To add new parameters in **Text**, use the
    `{}` delimiters with the name of the new parameter inside the delimiters. An input
    parameter is created for each `{}` delimiter found in the **Format** parameter.


    The following screenshot shows the **Format Text** node being used to print the
    result of a round, along with the template text `{Name} wins the round with {Score}
    points:`'
  merge: -1
  img_proc: true
- pgno: 533
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_533_0.png)


    Figure 15.31 – Example of a Format Text node


    An example output is `Serena wins the round with 17 points.`


    # Math Expression


    The **Math Expression** node is a collapsed graph created by the editor and is
    based on the expression typed in the name of the node. An input parameter pin
    is created for each variable name found in the expression. The **Return Value**
    output parameter is the result of the expression.


    The following screenshot shows an example of using the **Math Expression** node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_533_1.png)


    Figure 15.32 – Example of a Math Expression node


    There is a function named **Calculate Money Reward**, which uses a **Math Expression**
    node. The expression of the node is `(PlayerLuck/5) * (EnemyHP/30)`.'
  merge: -1
  img_proc: true
- pgno: 534
  md: '# Set View Target with Blend


    The Set View Target with Blend node is a function from the **Player Controller**
    class. It is used for switching the game view between different cameras. The **New
    View Target** input parameter is the actor to set as a view target, usually a
    camera.


    The following screenshot shows an example of using the Set View Target with Blend
    node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_534_0.png)


    Figure 15.33 – Example of a Set View Target with Blend node


    There is an event of the Level Blueprint that is triggered when the player enters
    the treasure room. The **Set View Target with Blend** function is used to change
    the game view to the camera that is in the treasure room.


    # AttachActorToComponent


    The **AttachActorToComponent** node attaches an actor to the component referenced
    in the **Parent** input parameter. The transformations of the **Parent** component
    affect the actor attached. Optionally, **Socket Name** can be used to identify
    the place where the actor will be attached.'
  merge: -1
  img_proc: true
- pgno: 535
  md: 'The following screenshot shows an example of using the AttachActorToComponent
    node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_535_0.png)


    Figure 15.34 – Example of an AttachActorToComponent node


    The Equip Shield custom event uses the AttachActorToComponent node to equip a
    Shield Actor component on a Skeletal Mesh component. The Skeletal Mesh component
    has a socket named LeftArmSocket, which is used to position the shield on the
    arm.


    # Enable Input and Disable Input


    The Enable Input and Disable Input nodes are functions used to define whether
    an actor should respond to inputs events such as from a keyboard,'
  merge: -1
  img_proc: true
- pgno: 536
  md: 'mouse, or gamepad. The nodes need a reference to the **Player Controller**
    class in use.


    A common use of these nodes is to allow an actor to only receive input events
    when the player is near the actor, as shown in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_536_0.png)


    Figure 15.35 – Example of Enable Input and Disable Input nodes


    The **Enable Input** node is called when the player begins to overlap the Blueprint.
    When the player finishes overlapping the Blueprint, the **Disable Input** node
    is called.


    # The Set Input Mode nodes


    There are three **Set Input Mode** nodes that are used to define whether the priority
    in handling user input events is with the UI or with the player input. These are
    the nodes:


    +   - **Set Input Mode Game Only**: Only **Player Controller** receives input
    events.

    +   - **Set Input Mode UI Only**: Only the UI receives input events.'
  merge: -1
  img_proc: true
- pgno: 537
  md: 'Set Input Mode Game and UI: The UI has priority in handling an input event,
    but if the UI does not handle it, then Player Controller receives the input event.
    For example, when the player overlaps a Blueprint representing a shop, a UI is
    displayed with options for the player to choose to use the mouse, but the player
    can still use the arrow keys to move away from the shop.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_537_0.png)


    Figure 15.36 – The Set Input Mode nodes


    I recommend you get used to these miscellaneous Blueprint nodes. When working
    on a project, you will have to deal with some problems that can easily be solved
    with some specific Blueprint nodes.


    # Summary


    In this chapter, we saw how to use editor shortcuts to create variables in various
    ways and how to organize Blueprint nodes using alignment tools. We also learned
    about some shortcut keys that are used to create specific Blueprint nodes.'
  merge: -1
  img_proc: true
