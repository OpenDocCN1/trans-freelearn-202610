- pgno: 525
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_525_0.png)


    # Figure 15.21 – Bookmarks window


    If you double-click on an item in the **Bookmarks** window, then the **EventGraph**
    will be positioned in the associated location. You can create bookmarks to reference
    a location of the **EventGraph** by clicking on the icon located in the top left
    of the **EventGraph** and giving a name to the bookmark, as shown in the following
    screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_525_1.png)


    # Figure 15.22 – Creating a bookmark


    In the **My Blueprint** panel, you can see a list of the events being used in
    the **EventGraph**, as can be seen in the following screenshot. Double-click on'
