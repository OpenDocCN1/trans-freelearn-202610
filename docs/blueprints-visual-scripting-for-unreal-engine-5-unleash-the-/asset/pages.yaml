- pgno: 479
  md: '# # Summary


    In this chapter, we learned how to use data structures to organize data in Blueprints.
    We learned how to store various elements in an array and how to retrieve any of
    those elements. We learned how to use other types of containers, such as sets
    and maps, to store data.


    After that, we learned how to create and use enumerations, structures, and data
    tables, and we saw examples of how they can be related. It was presented to us
    as several flow control nodes, such as Switch, Gate, and For Each Loop.


    This chapter showed various Blueprint features that will help us to organize data
    so that it can be used effectively. The flow control nodes can simplify the EventGraph
    because, for each situation, there may be a more suitable node.


    In the next chapter, we will learn about world and local coordinates, vector operations,
    and the use of traces to test collisions.


    # ## Quiz


