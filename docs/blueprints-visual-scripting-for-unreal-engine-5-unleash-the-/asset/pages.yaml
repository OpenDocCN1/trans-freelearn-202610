- pgno: 247
  md: '# # Chapter 8: Creating Constraints and Gameplay Objectives


    In this chapter, we''ll define a ruleset for our game, which will guide the player
    through the gameplay experience. We want to give the player the ability to start
    the game and immediately identify what they must do to win the game. In its most
    basic form, a game could be defined by the win condition and the steps the player
    can take to reach that win condition. Ideally, we want to ensure that each step
    the player takes toward that goal is fun.


    We''ll begin by applying some constraints to the player to increase the level
    of difficulty. A game without a challenge quickly becomes boring, and we want
    to ensure that every mechanic in our game provides the player with an interesting
    choice or challenge. We''ll then set up a goal for the player to achieve, along
    with the necessary adjustments to our enemy targets to make that goal challenging
    to reach.


    In this process, we''ll work to accomplish the following:


    +   - Reducing stamina while the player is sprinting and regenerating it when
    the player is not sprinting

    +   - Preventing the player''s gun from firing if they run out of ammo

    +   - Creating ammo pickups that allow the player to regain ammo

    +   - Defining a win condition based on the number of targets eliminated

    +   - Creating a menu that allows the player to replay or quit the game upon winning


    By the end of the chapter, we will have a game with constraints and goals that
    make the gameplay more interesting. We will learn how to create collectible objects
    and how to create a menu system.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Constraining player actions


    One important consideration to make when adding enhanced capabilities for the
    player is the impact that they have on both the challenge and feel of the game
    experience. Recall that we added the ability for the player to sprint in Chapter
    6, Enhancing Player Abilities, by holding down the Shift key. As it currently
    stands, holding down the Shift key while moving provides a significant increase
    in the speed at which the player can move. Without constraints applied to this
    ability, such as an enforced waiting period between uses, there would be nothing
    discouraging the player from always holding down the Shift key as they move.


    This goes against the goal we set out to accomplish by adding a sprint functionality,
    which was to provide more options to the player. If an option is so attractive
    that the player feels compelled to always utilize it, then it doesn''t increase
    the number of interesting choices available to the player. From the player''s
    perspective, the result would be the same if we just increased the base speed
    of the player to the sprint speed.


    We can rectify this, and other issues currently faced by our game prototype, by
    adding constraints that limit a player''s abilities, to increase decision making.


    # Draining and regenerating stamina


    To add a constraint to the sprinting ability of the player, we''ll need to return
    to the player character Blueprint where we originally defined the ability. We
    need to create some variables that will keep track of whether the player is sprinting,
    how much stamina sprinting should cost, and the stamina recharge rate. We are
    going to create a custom event to drain the player''s stamina at a consistent
    rate while they are sprinting and to recharge the stamina when they are not sprinting.
    Also, we will create other variables and macros to organize the script.


    These are the variables that we will create:'
  merge: -1
  img_proc: true
