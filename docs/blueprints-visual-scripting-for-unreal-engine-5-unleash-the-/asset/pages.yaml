- pgno: 389
  md: '# Chapter 11: Game States and Applying the Finishing Touches


    In this chapter, we will take the final steps to evolve our game into a complete
    and fun experience that challenges the player. First, we will introduce player
    death, which is activated when the player''s health is fully drained. Then, we
    will introduce a round system that will elevate the challenge for the player by
    requiring increasingly numerous enemies to be defeated as they progress through
    the rounds. Finally, we will introduce a saving and loading system so that the
    player can leave the game and later return to the round that they were last playing.
    In this chapter, we will cover the following topics:


    +   - Showing different menus based on player conditions

    +   - Creating scaling difficulty with gameplay modifiers

    +   - Supporting the game state being saved and reloaded later

    +   - Branching level initialization based on the saved data

    +   - Creating transition screens that display gameplay data


    By the end of the chapter, we will have an arcade-style first-person shooter that
    a player can continually return to for an increasingly difficult challenge.


    # Making danger real with player death


    In Chapter 10, Upgrading the AI Enemies, we made significant progress toward a
    balanced game in which enemies threaten the player but the player can use skill
    to overcome that challenge. One element remains glaringly missing. If the player
    runs out of health, then they should not be able to continue progressing through
    the game. So, we will take what we''ve learned'
  merge: -1
  img_proc: true
- pgno: 390
  md: 'about from the win screen we created in _Chapter 8, Creating Constraints and
    Gameplay Objectives_, and apply it to a lose screen. This screen will enable the
    player to restart the level with full ammo and a freshly filled health bar, but
    will also negate any progress they had made toward reaching their target goal.


    # # Setting up a lose screen


    The lose screen will be presented when the player runs out of health. We will
    present them with options to restart the last round or quit the game. You may
    remember the win screen we created; we presented similar options there. Rather
    than remaking the UI screen from scratch, we can save some time by using our **WinMenu**
    asset as a template.


