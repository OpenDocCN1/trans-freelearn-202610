- pgno: 431
  md: '# Packaging the game into a build


    Creating a distributable form of your game for one of these platforms involves
    a process called **packaging**. Packaging takes all the code and assets of the
    game and sets them up in the proper format to be able to perform on the selected
    platform. We will be following the path to making a Windows or macOS release of
    your game.


    Note


    It is important to note that Unreal Engine 5 can only create Windows builds from
    a copy of the engine running on a Windows system, and OS X builds from copies
    installed on a macOS running OS X. Thus, the platforms that you can target with
    your game will be partially limited by the machine you are developing the game
    on. If you are developing on a Windows PC and wish to create an OS X build of
    the game, you can install Unreal Engine 5 on a macOS and copy your project files
    to this new machine. From there, you will be able to generate an OS X build, with
    no further changes required.


    These are the steps to package your game to be played on a particular platform:


    +   1. Click the **Platforms** button in the toolbar, hover over the desired platform,
    and then click on **Package Project**, as follows:'
  merge: -1
  img_proc: true
- pgno: 432
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_432_0.png)


    # Figure 12.7 – Packaging the project for Windows


    2. Once you click on a platform, you will be prompted to select a location on
    your computer to store the build you make. After selecting a location, you will
    see a popup that tells you that the engine is packaging the project. If something
    goes wrong in the packaging process, you will be shown the details of the error
    in the output log window that pops up. Packaging a project can take a bit of time,
    depending on how complex and large the project is, but if you don''t encounter
    any errors, then you will eventually see a message saying that the packaging is
    complete. Congratulations – you have created a packaged copy of your game!'
  merge: -1
  img_proc: true
- pgno: 433
  md: '3. Navigate to the folder where you chose to store your build. On macOS, open
    the folder called MacNoEditor and double-click on the application to launch it.
    For Windows, open the WindowsNoEditor folder and double-click on the executable
    to run the game. Take a moment to go through the game you created in its final
    form and reflect on just how far you have come. You now have a functional game
    that other people can play and enjoy. Making even simple games is no easy feat,
    so you should feel proud of your accomplishment!


    We packaged the project using the default settings, but there are a lot of options
    that you can modify in the packaging.


    # Build configurations and packaging settings


    In this section, we will see some of the settings available for build and packaging.


    The Platforms submenu has the Packaging Settings option, which displays the Project
    - Packaging page with configuration options that can be modified.'
  merge: -1
  img_proc: true
- pgno: 434
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_434_0.png)


    Figure 12.8 – Project - Packaging page


    The **PACKAGING** category contains a lot of technical options that can be used
    to optimize the packaging. The **Build Configuration** option defines how the
    build will be done. In Blueprint-only projects, you have two options: **Development**
    and **Shipping**. Development builds contain information that is used in debugging
    to help you find errors. Shipping builds are cleaner as they do not have debug
    information and should be used to create the final version of the game that will
    be distributed.


    The **Staging Directory** property is used to define the folder where the packaged
    build will be stored. The **For Distribution** option is required when submitting
    a game to the App Store or Google Play Store.


    You can now close the **Project - Packaging** page.


    When you want to move the project to another computer or to pass the project to
    someone else, you can use the **Zip Project** option available in the'
  merge: -1
  img_proc: true
- pgno: 435
  md: 'File menu of the Level Editor. The Zip Project option copies and compresses
    the essential project files.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_435_0.png)


    Figure 12.9 – Zip Project


    There are many packaging options and some of them are platform-specific. Take
    the time to study the various packaging options for your game''s target platform.


    # Summary


    In this chapter, we discussed creating playable builds of the game we created
    across multiple platforms. We learned how to optimize the graphics settings and
    discussed how to set up the game to be played by others. Finally, we saw how to
    change the build configurations and packaging settings.


    With what you''ve learned in this chapter, you will be able to better present
    your project and distribute it on different platforms so that others can enjoy
    it.


    This chapter concludes Part 3 and ends our implementation of the playable shooter
    game. Part 4 will cover advanced Blueprints concepts. In the next chapter, we
    will learn about data structures and flow control.'
  merge: -1
  img_proc: true
