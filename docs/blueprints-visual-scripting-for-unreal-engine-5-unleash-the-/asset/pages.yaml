- pgno: 195
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_195_0.png)


    Figure 6.15 – Using the timeline to modify the FOV


    +   9. You will notice that the Timeline_0 node now has a new output pin called
    Field Of View. Connect this pin to the In Field Of View input pin of the Set Field
    of View node. Now, connect the Update output execution pin from the Timeline_0
    node to the Set Field of View node.


    This sets up the functions so that every time the FOV value is updated, it passes
    the new value to the Set Field Of View function. Because of our timeline setup,
    many values between 90 and 45 will be passed to set, enabling a gradual transition
    between the two extremes over 0.3 seconds.


    +   10. Finally, we want the zooming to end when the right mouse button is released.
    To do this, drag the Released pin from the InputAction Zoom node to the Reverse
    pin of the Timeline node.


    This will cause the timeline animation to play in reverse order when the right
    mouse button is released, ensuring that we have a smooth transition back to our
    normal camera view. Also, remember to apply a comment to the node group so that
    you remember what this functionality does if you revisit it later.


    +   11. Now, compile, save, and play to test the transition in and out of your
    zoom view by holding down the right mouse button.'
