    # # Animating a zoomed view


    A core element of modern first-person shooters is a variable **field of view (FOV)**
    in the form of a player''s ability to look down the scope of a gun to get a closer
    view of a target. This is a significant contributor to the feeling of accuracy
    and control that modern shooters provide. Let''s add a simple form of this functionality
    to our prototype. To do that, follow these steps:


    +   1. In an empty section of the grid next to your **Mouse input** nodes, right-click,
    search for `zoom`, and add a **Zoom** Event node.


    +   2. We want to modify the FOV value that is contained within the **First Person
    Camera Component**, so go to the **Components** panel and drag **First Person
    Camera** out onto **Event Graph**.


    +   3. Drag the output pin of **First Person Camera** node into empty grid space,
    search for the **Set Field Of View** node, and place it. Lowering the FOV gives
    the effect of zooming into a narrower area in the center of the screen. Since
    the `Default` FOV value is set to `90`, for our zoom, let''s set the FOV in the
    set node to `45`, like this:'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_191_0.png)


    Figure 6.11 – Changing the Field of View


    +   4. Click and drag the output execution pin from the **InputAction Zoom** node
    to the input execution pin of the **Set Field Of View** node.


    Complile, save, and click on **Play**.


    You will notice that when you are playing the game and press the right mouse button,
    the FOV will snap to a narrow, zoomed-in view. Any instance where the main camera
    snaps from one position to another can be jarring for a player, so we will have
    to modify this behavior further. Also, the FOV does not reverse when the key is
    released. We will solve both problems using a timeline.


    # Using a timeline to smooth transitions


    To change the FOV smoothly, we will need to create an animation that shows a gradual
    change in the Actor over time. To do so, return to the **Event Graph** instance
    of the `FirstPersonCharacter` Blueprint and follow these steps:


    +   1. Press **Alt** and click on the **Pressed** output execution pin of the
    **InputAction Zoom** node to break the connection.


    +   2. Drag a new wire out from **Pressed** to empty grid space. Search for and
    select **Add Timeline** to add a timeline node:'
  merge: -1
  img_proc: true
- pgno: 192
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_192_0.png)


    Figure 6.12 – Timeline node


    # Important Note


    There are different ways of accomplishing animations in Unreal Engine 5. Timelines
    are perfect for simple value changes, such as the rotation of a door. For more
    complex, character-based, or cinematic animations, you would want to look into
    **Sequencer**, which is the engine''s built-in animation system. **Sequencer**
    and complex animations are out of the scope of this book, but there are many dedicated
    learning resources available for using **Sequencer**. I recommend starting with
    the Unreal documentation, which is available at [https://docs.unrealengine.com/en-us/Engine/Sequencer](https://docs.unrealengine.com/en-us/Engine/Sequencer).


    +   3. A timeline will allow us to change a value (such as the FOV on a camera)
    over a designated amount of time. To change the value within the timeline, double-click
    on the **Timeline_0** node.


    This will open up the **Timeline Editor**. You will see four buttons in the top-left
    corner of the **Editor**. Each of these will add a different kind of value'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'that can be changed over the course of the timeline. Because FOV is represented
    by a numerical value, we will want to click on the button with the f label (Add
    Float Track). Doing so will add a track to the timeline and prompt you to name
    this track.


    4. Let''s label this as Field of View. We will now have to edit the values over
    different time intervals, as shown here:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_193_0.png)


    Figure 6.13 – Timeline Editor


    5. To accomplish this, hold down Shift and click on a point that is close to the
    0.0 point on the graph. You will see the Time and Value fields appear in the top-left
    part of the graph as shown in Figure 6.14.


    These allow precision tuning of our timeline. Ensure that the time is set to exactly
    0.0 and set the value to 90, our default FOV. If the point disappears from the
    view, you can use the two small buttons in the top-left of the graph'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'to zoom into the graph so that the point becomes visible. These buttons are
    inside the red rectangle in Figure 6.14.


    +   6. We want the zoom animation to be quick, so at the top of the Timeline Editor,
    find the field next to Length and change to value to 0.3 to limit the range of
    the animation to 0.3 seconds.


    +   7. Now, press Shift and click at the end of the light gray area on the right
    of the graph. Adjust the fields to 0.3 for Time and 45 for Value:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_194_0.png)


    Figure 6.14 – Time and value of the second point


    Notice how the line that represents the value gradually slopes down from 90 degrees
    to 45 degrees. This means that when this animation is called, the player''s FOV
    will smoothly transition from being zoomed out to being zoomed in, rather than
    a jarring switch between the two values. This is the advantage of using timelines
    over changing the values directly with a set value Blueprint.


    +   8. Now, return to Event Graph. We want to connect our timeline to our set
