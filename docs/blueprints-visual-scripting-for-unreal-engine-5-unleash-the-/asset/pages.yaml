  md: '# Detecting a hit


    To create a hit detection mechanism, follow these steps:


    +   1. To create our hit detection event, right-click in an empty space of the
    EventGraph and type `hit` in the search box. The **Event Hit** node is what we
    are looking for, so select it when it appears in the search results. **Event Hit**
    is triggered every time another Actor hits the Actor controlled by this Blueprint:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_154_0.png)


    Figure 5.16 – Adding Event Hit


    Now that we have the **Event Hit** node, we need to find an Action that will enable
    us to change the Material of an Actor.


    +   2. Click and drag a wire from the white execution pin of the **Event Hit**
    node to an empty space to open the context menu. Type `set material` in the search
    box. The node we want to select is called **Set Material (StaticMeshComponent)**:'
  merge: -1
  img_proc: true
- pgno: 155
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_155_0.png)


    # Figure 5.17 – Adding the Set Material node (StaticMeshComponent)


    # Important Information


    If you cannot find the node you are searching for in the **Context Sensitive**
    search, try unchecking **Context Sensitive** to find it from the complete list
    of node options. Even if the node is not found in the **Context Sensitive** search,
    there is still a possibility that the node can be used in conjunction with the
    node you are attempting to attach it to.


    We''ve added the **Set Material** node, but now we need to adjust its input parameters.


    # Swapping a Material


    Once you have placed the **Set Material** node, note that it is already connected
    via its input execution pin to the **Event Hit** node''s output execution pin.
    This Blueprint now fires the **Set Material** Action whenever the Blueprint''s
    Actor hits another Actor. However, we haven''t yet set up the Material that will
    be used when the **Set Material** Action is called. Without setting the Material,
    the Action will fire but won''t produce any observable effect on the Cylinder
    target:'
  merge: -1
  img_proc: true
