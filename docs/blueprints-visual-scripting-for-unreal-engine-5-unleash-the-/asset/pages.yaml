- pgno: 363
  md: '# # Creating variables and a macro to update the blackboard


    We will create variables and a macro in the BP_EnemyController blueprint to update
    the keys of the BB_EnemyBlackboard related to sound.


    These are the steps:


    +   1. In the content browser, access the Content|FirstPersonBP|Enemy folder and
    double-click on the BP_EnemyController blueprint.


    +   2. In the **Variables** category of the **My Blueprint** panel, click the
    + button to add a variable. In the **Details** panel, name the variable `HearingDistance`
    and change **Variable Type** to **Float**. Compile the blueprint and set **DEFAULT
