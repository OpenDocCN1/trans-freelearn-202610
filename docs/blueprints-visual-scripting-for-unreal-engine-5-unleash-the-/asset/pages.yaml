  md: 'The following diagram shows the hierarchy of **Common Classes**. In Unreal
    Engine, there is a parent class called **Object**. Classes inherit the characteristics
    of the class above it, which is their parent class. Based on the inheritance concept
    of OOP, we can state that an instance of the **Character** class is of type **Character**,
    type **Pawn**, and type **Actor**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_88_0.png)


    Figure 3.24 – Hierarchy of Common Classes


    By analyzing this hierarchy, we can see that the **Actor Component** and **Scene
    Component** classes are not Actors. These classes are used to create Components
    that can be added to Actors. Two examples of Components are `Static Mesh Component`
    and `Rotating Movement Component`, which we used in previous examples. We will
    cover the creation of Components in _Chapter 18, Creating Blueprint Libraries
    and Components_.


    Let''s take a closer look at some of the **Common Classes**.


    # # Pawn


    **Pawn** is a child class of **Actor**. A **Pawn** is an **Actor** that can be
    possessed by a **Controller** in the game. The **Controller** class represents
    a player or an **artificial intelligence** (AI). Conceptually, an instance of
    the **Pawn** class is the physical body of the game character, whereas an instance
    of the'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'Controller class possessing it is a kind of brain of the character, allowing
    it to move in the Level and perform other actions.


    Create a Blueprint based on the Pawn class and click the Class Defaults button
    to display it on the Details panel. The parameters that are inherited from the
    Pawn class are shown in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_89_0.png)


    Figure 3.25 – Pawn Class defaults


    Some parameters show that the Pawn class can use the rotation values of the Controller
    class that is possessing it. Others parameters indicate how the Pawn class must
    be possessed by the Controller class.'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'The two main child classes of **Pawn** are **Character** and **WheeledVehicle**.


    # # Character


    The **Character** class is a child class of the **Pawn** class; therefore, an
    instance of the **Character** class can also be possessed by an instance of a
    **Controller** class. This class was created to represent characters that can
    walk, run, jump, swim, and fly.


    A Blueprint based on the **Character** class would inherit the following character-specific
    Components:


    +   * **CapsuleComponent**: This is used for collision testing.

    +   * **ArrowComponent**: This indicates the current direction of the character.

    +   * **Mesh**: This Component is a Skeletal Mesh that visually represents the
    character. The animation of the **Mesh** Component is controlled by an animation
    Blueprint.

    +   * **CharacterMovement**: This Component is used to define various types of
    character movements, such as walking, running, jumping, swimming, and flying.


    These Components are shown in the following screenshot:'
