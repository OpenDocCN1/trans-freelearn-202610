- pgno: 667
  md: '# # Chapter 20: Creating a Product Configurator Using the Variant Manager


    This chapter explains how to create a Product Configurator, which is a type of
    application used in industry to attract consumers to a specific product. You will
    learn how to use the Variant Manager panel and Variant Sets to define a Product
    Configurator. The Product Configurator template is an excellent resource for studying
    various Blueprint concepts in practice. We will analyze the BP_Configurator Blueprint
    that dynamically creates the user interface using UMG Widget Blueprints with the
    Variant Sets.


    These are the topics covered in this chapter:


    +   - The Product Configurator template

    +   - The Variant Manager panel and Variant Sets

    +   - The BP_Configurator Blueprint

    +   - UMG Widget Blueprints


    By the end of the chapter, you will know how to create a Product Configurator
    using the Product Configurator template, the Variant Manager panel, and Variant
    Sets. You will know how the BP_Configurator Blueprint and the UMG Widget Blueprints
    work to be able to adapt them to your applications.


    # # The Product Configurator template


    The main idea behind the Product Configurator application is to let users switch
    between different options for a product and visualize them in real-'
  merge: -1
  img_proc: true
- pgno: 668
  md: 'time 3D experiences. This type of application is becoming common in the industry.


    Unreal Engine has a Product Configurator template that can be used as a starting
    point to make your own Product Configurator. Follow these steps to use the Product
    Configurator template:


    +   1. In the New Project panel, select the AUTOMOTIVE PRODUCT DESIGN & MANUFACTURING
    category, and then select the Product Configurator template:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_668_0.png)


    Figure 20.1 – Selecting the Product Configurator template


    +   2. Choose a folder and a name for the project, and then click on the **Create**
    button.


    +   3. After the Unreal Editor loads the project, click the **Play** button to
    run the template. The next screenshot shows the main interface of the guitar example
    that comes with the Product Configurator template:'
  merge: -1
  img_proc: true
- pgno: 669
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_669_0.png)


    Figure 20.2 – The guitar example of the Product Configurator template


    4. The two buttons on the right allow you to change the camera and environment
    lighting. When you click on a button, other buttons are displayed to choose the
    current option of the group. Click the Camera button and select another camera:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_669_1.png)


    Figure 20.3 – Selecting another camera'
  merge: -1
  img_proc: true
- pgno: 670
  md: '5. The buttons at the bottom allow you to change various parts of the guitar.
    Try each one to see the potential of a Product Configurator:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_670_0.png)


    Figure 20.4 – Selecting the body color


    Now that we have seen how to use the Product Configurator template, we can analyze
    the tools used in a Product Configurator.


    # The Variant Manager panel and Variant Sets


    The main tool behind a Product Configurator is the **Variant Manager**. We use
    the Variant Manager panel to edit the **Level Variant Sets** Asset, which allows
    us to modify the properties of Actors in the level. Each configuration of a part
    of the product is a **Variant**, and we can group Variants into **Variant Sets**.


    In the Product Configurator template, each button that appears on the screen when
    you start the application represents a Variant Set. When you click on one of these
    Variant Set buttons, other buttons are displayed that represent the **Variants**
    that belong to the current Variant Set.'
  merge: -1
  img_proc: true
- pgno: 671
