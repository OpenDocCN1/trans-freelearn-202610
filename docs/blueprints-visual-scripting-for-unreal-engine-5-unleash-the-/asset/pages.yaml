    We saw how the Level Blueprint can listen to an Event Dispatcher, but we can also
    make a Blueprint listen to an Event Dispatcher of another Blueprint by binding
    events.


    # Binding Events


    There is a **Bind Event** node that binds one Event to another Event or to an
    Event Dispatcher, which can be in another Blueprint. When an Event is called,
    all the other Events that are bound to it are also called.'
