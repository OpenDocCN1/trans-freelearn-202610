    # # Interpreting and storing the noise Event data


    The **PawnSensing** component we added to `BP_EnemyController` gives us the foundation
    to build both visual and auditory sensing in our enemy AI. We will use the **On
    Hear Noise** event that activates any time the **PawnSensing** component detects
    a special type of sound broadcast by a pawn noise emitter.


    We will have to set up the blueprint so that the enemies only detect noises that
    are made a short distance away; otherwise, it would feel unfair for the player
    to shoot their gun from the opposite corner of the map and let every enemy instantly
    know their location.


    Follow these steps to create the **On Hear Noise** event:'
  merge: -1
  img_proc: true
- pgno: 366
  md: '1. In the **Components** panel, select the **PawnSensing** component. In the
