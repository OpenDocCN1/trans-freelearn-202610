- pgno: 347
  md: '3. Drag another wire from the **Attack Player** sequence node and add a **BTTTask_ClearBBValue**
    task node. In the **Details** panel, change **Key** to **PlayerCharacter** and
    change **Node Name** to `Reset Player seen`:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_347_0.png)


    # Figure 9.55 – Clearing the PlayerCharacter value in the Blackboard


    4. Save the Behavior Tree and close the Behavior Tree Editor. Press the **Play**
    button in the Level Editor to test the enemy behavior.


    As you navigate the player character in front of the patrolling enemy, the enemy
    will stop its patrol and chase the player. When the enemy reaches the player,
