    # Summary


    In this chapter, we enhanced the player experience by adding a HUD that tracks
    the player''s interaction with the environment. In doing so, we developed another
    conduit through which we can communicate information to the player of our game.
    We now have the skeletal structure of a first-person shooter, including guns that
    shoot, targets that explode, and a UI that exposes the state of the world to the
    player. We have already come a long way from the initial test scene, which featured
    minimal player interaction.


    In the next chapter, we will begin transitioning from building the foundation
    of our game structure to constructing the design of our game. The core of any
    game is made up of the rules that the player must follow to create a fun experience.
    While the game, in its current form, features some basic rules that define how
    the targets react to being shot, the overall experience lacks a goal for the player
    to achieve. We will rectify this by establishing a `win` condition for the player,
    as well as providing additional constraints that make the experience holistic
    and consistent.


