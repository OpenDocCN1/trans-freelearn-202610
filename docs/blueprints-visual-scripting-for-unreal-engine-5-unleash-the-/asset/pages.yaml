    node and add a **GET Current Patrol Point** node.

    +   8. Connect the white execution pins of the **Inputs**, **Set Value as Object**,
    and **Outputs** nodes. Compile the Blueprint.


    Next, we need to check when a `BP_EnemyCharacter` instance overlaps with a patrol
    point to update the **CurrentPatrolPoint** key of `BB_EnemyBlackboard`.


    # # Overlapping a patrol point


    We will use **Event ActorBeginOverlap** to verify when an instance of `BP_EnemyCharacter`
    reaches one of its two patrol points, and then we swap the patrol point that the
    instance is moving toward. Every time we update the **CurrentPatrolPoint** variable,
    we need to call the **UpdatePatrolPointBB** macro.


    In **Event BeginPlay**, we will set an initial patrol point to **CurrentPatrolPoint**
    and call the **UpdatePatrolPointBB** macro.


    Follow these steps to create the events:


    +   1. In the EventGraph of `BP_EnemyCharacter`, drag a wire from the white execution
    pin of **Event BeginPlay** and add a **SET Current Patrol Point** node.

    +   2. Drag a wire from the input pin of **SET Current Patrol Point** and add
    a **GET Patrol Point 1** node.'
  merge: -1
  img_proc: true
- pgno: 324
  md: '+   3. Drag a wire from the white output pin of the SET Current Patrol Point
    node and add the UpdatePatrolPointBB macro node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_324_0.png)


    Figure 9.33 – Setting an initial patrol point


    +   4. Now, let''s create the Event ActorBeginOverlap event, which swaps the patrol
    points. The event first checks whether the enemy overlaps with Patrol Point 1.
    If it is true, then the event sets Patrol Point 2 as Current Patrol Point. If
    it is false, then the event checks whether the enemy overlaps with Patrol Point
    2. In this case, the event sets Patrol Point 1 as Current Patrol Point:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_324_1.png)


    Figure 9.34 – Swapping the patrol points


    +   5. The nodes of steps 5–8 are to check whether the enemy overlaps with Patrol
    Point 1. Drag a wire from the white execution pin of the Event ActorBeginOverlap
    node and add a Branch node.


    +   6. Drag a wire from the Condition input pin of the Branch node and add an
    Equal node.'
  merge: -1
  img_proc: true
- pgno: 325
  md: '+   7. Drag a wire from the top input pin of the **Equal** node and add a **GET
    Patrol Point 1** node.


    +   8. Connect the bottom input pin of the **Equal** node to the **Other Actor**
    output pin of the **Event ActorBeginOverlap** node.


    +   9. The nodes of _steps 9–11_ set **Patrol Point 2** as **Current Patrol Point**.
    Drag a wire from the **True** output pin of the **Branch** node and add a **SET
    Current Patrol Point** node.


    +   10. Drag a wire from the input pin of the **SET Current Patrol Point** node
    and add a **GET Patrol Point 2** node.


    +   11. Drag a wire from the white output pin of the **SET Current Patrol Point**
    node and add the **UpdatePatrolPointBB** macro node.


    +   12. The nodes of _steps 12–15_ are to check whether the enemy overlaps with
    **Patrol Point 2**. Drag a wire from the **False** output pin of the **Branch**
    node and add another **Branch** node.


    +   13. Drag a wire from the **Condition** input pin of the second **Branch**
    node and add an **Equal** node.


    +   14. Connect the top input pin of the **Equal** node to the **Other Actor**
    output pin of the **Event ActorBeginOverlap** node.


    +   15. Drag a wire from the bottom input pin of the **Equal** node and add a
    **GET Patrol Point 2** node.


    +   16. The nodes of _steps 16–18_ set **Patrol Point 1** as **Current Patrol
    Point**. Drag a wire from the **True** output pin of the second **Branch** node
    and add a **SET Current Patrol Point** node.


    +   17. Drag a wire from the input pin of the new **SET Current Patrol Point**
    node and add a **GET Patrol Point 1** node.


    +   18. Connect the white output pin of the **SET Current Patrol Point** node
    to the input pin of the **UpdatePatrolPointBB** node.


    +   19. Compile and save the Blueprint.


    These are the actions needed in the `BP_EnemyCharacter` Blueprint to handle the
    patrol points. The next step is to modify the `BP_EnemyController` Blueprint to
