- pgno: 139
  md: '# # Chapter 5: Object Interaction with Blueprints


    When setting out to develop a game, one of the first steps toward exploring your
    idea is to build a prototype. Fortunately, Unreal Engine 5 and Blueprints make
    it easier than ever to quickly get the essential gameplay functionality working
    so that you can start testing your ideas sooner. We will begin by prototyping
    simple gameplay mechanics using some default assets and a couple of Blueprints.


    In this chapter, we will cover the following topics:


    +   - Creating a new project and a Level

    +   - Placing objects in a Level

    +   - Changing an object''s Material through Blueprints

    +   - Moving objects in the world with Blueprints


    By the end of this chapter, we will have learned how to create a Blueprint target
    that changes its Material when it is hit and moves back and forth between two
    points regularly. Each instance of the Blueprint target in the Level can be set
    to different speeds, directions, and times to change direction.


    # # Creating the project and the first Level


    In this section, we will start by creating a project using one of the Unreal Engine
    templates. We will then explore the template to see what gameplay elements it
    provides.'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Our game will be a first-person shooter. So, let''s create a project using
    the **First Person** template, which is in the **Games** category:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_140_0.png)


    Figure 5.1 – Choosing the First Person template


    Below the game templates, you can see a folder path field used to designate where
    you would like to store your project. You can use the default folder or choose
    one you prefer. The next screenshot shows the project defaults you should use
    in this project. These **PROJECT DEFAULTS** options were explained in _Chapter
    1_, _Exploring the Blueprint Editor_. There is also a **Project Name** field to
    input the name by which your project will be known. I named the project `UE5BpBook`,
    as shown in this screenshot:'
  merge: -1
  img_proc: true
- pgno: 141
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_141_0.png)


    Figure 5.2 – The project defaults used in our game


    Now that we have a template selected and the project settings set up the way we
    like, we can create the project. To do so, follow these steps:


    +   1. Click on the blue Create button. After the engine is done with initializing
    the assets and setting up your project, the Unreal Editor will open the Level
    Editor.


    +   2. Press the Play button to try the default gameplay that is built into the
    First Person template. You must click on the viewport for the game to start reacting
    to input.


    You can move the player character using the W, A, S, and D keys and look around
    by moving the mouse. You can fire projectiles using the left mouse button. The
    projectile will affect some physics objects in the Level. Try'
  merge: -1
  img_proc: true
- pgno: 142
  md: 'shooting at the white boxes scattered around the Level and observe them moving.


    +   3. In Play mode, the **Play** button will be replaced with a **Pause** button,
    a **Stop** button, and an **Eject** button. You can press _Shift + F1_ to access
    the mouse cursor and click the **Pause** button to temporarily halt the play session,
    which can be useful when you want to explore the properties of an interaction
    or Actor that you have just encountered during gameplay.


    Clicking the **Stop** button ends the play session and takes you back to editing
    mode. Clicking the **Eject** button detaches the camera from the player, allowing
    you to move freely through the Level. Go ahead and try playing the game before
    we continue.


    # Adding objects to our Level


    Now, we want to start adding our own objects to the Level. Our goal is to create
    a simple target Actor that changes color when shot with the included gun and projectile.
    We can create a simple Actor by following these steps:


    +   1. In the Level Editor, click the **Create** button located on the toolbar.
    Hover over **Shapes** to display a submenu and drag **Cylinder** and drop it somewhere
    in the Level to create an instance:'
  merge: -1
  img_proc: true
- pgno: 143
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_143_0.png)


    # Figure 5.3 – Adding a Cylinder shape to the Level


    This creates a new **Cylinder** Actor and places it in our Level. You can reposition
    the Cylinder as you wish by dragging and dropping it. You should see the Actor
    in the Viewport as well as in the **World Outliner** panel, where it is named
    **Cylinder** by default:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_143_1.png)'
