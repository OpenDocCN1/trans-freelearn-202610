- pgno: 338
  md: "5. The **On See Pawn** event triggers when the enemy sees an instance of the\
    \ **Pawn** class (or its child class, **Character**) along its line of sight.\
    \ We need to check whether the instance seen is the player (the **FirstPersonCharacter**\
    \ class). If it is the player, then we store the instance reference in the Blackboard:\n\
    \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_338_0.png)\n\nFigure 9.46 – Storing\
    \ the PlayerCharacter reference in the Blackboard\n\n+   6. Drag a wire from the\
    \ **Pawn** output pin of the **On See Pawn** event and add a **Cast To FirstPersonCharacter**\
