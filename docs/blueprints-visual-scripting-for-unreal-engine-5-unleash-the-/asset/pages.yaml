- pgno: 177
  md: 'In this chapter, we created a project and an initial Level using a first-person
    shooter template. We then set up a target object that reacts to the player''s
    gunfire by changing its appearance. Finally, we set up a Blueprint that allows
    us to rapidly create moving targets. The skills we have learned about here will
    serve as a strong foundation for building more complex interactive behavior in
    later chapters, or even entire games of your own making.


    You may wish to spend some additional time modifying your prototype to include
    a more appealing layout or feature faster moving targets. As we continue building
    our game experience, remember that you always can linger on a section and experiment
    with your own functionality or customization. One of the greatest benefits of
    a Blueprint''s visual scripting is the speed at which you can test new ideas,
    and each additional skill that you learn will unlock exponentially more possibilities
    for game experiences that you can explore and prototype.


    In the next chapter, we will be looking more closely at the player controller
    that comes with the **First Person** template. We will extend the existing Blueprint
    that governs player movement and shoot with a gun that is tweaked to our liking,
    producing more interesting visual impacts and sound effects.


    # Quiz


    +   1. It is not possible to change the Material of a mesh using Blueprint script.


    +   a. True


