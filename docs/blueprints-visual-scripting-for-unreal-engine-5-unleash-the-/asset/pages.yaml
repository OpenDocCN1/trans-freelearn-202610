  md: 'In the next section, we will learn how to spawn instances along a path.


    # # Creating Blueprint Splines


    A Spline is a special mathematical function used to define curves. A Blueprint
    Spline component can be used to define a path to move Actors in the level. We
    can also get locations along the path to place instances. We can edit the spline
    in the Level Editor by adding, translating, and rotating spline points.


    The next screenshot shows three common functions of the Spline component:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_648_0.png)


    Figure 19.16 – Some functions of the Spline component'
  merge: -1
  img_proc: true
- pgno: 649
  md: "# Here is a description of the functions:\n\n+   - Get Spline Length: This\
    \ function returns a Float value with the length of the Spline.\n+   - Get Location\
    \ at Distance Along Spline: This function receives Distance as an input parameter\
    \ and returns the location found in the Spline. Coordinate Space can be Local\
    \ (relative) or World.\n+   - Get Rotation at Distance Along Spline: The same\
    \ idea as the previous function, but it returns the rotation.\n\nWe will create\
    \ a Blueprint named BP_SplinePlacement that adds Static Mesh instances along the\
    \ spline. The Level Designer can edit the spline in the Level Editor and specify\
    \ the space between the instances.\n\n# These are the steps to create the Blueprint:\n\
    \n+   1. Click the Add button in Content Browser and choose the Blueprint Class\
    \ option. On the next screen, choose Actor as the parent class. Name the Blueprint\
    \ BP_SplinePlacement and double-click it to open the Blueprint Editor.\n+   \n\
    +   2. In the My Blueprint panel, create a variable named StaticMeshVar. Click\
    \ on Variable Type and search for static mesh. Hover over Static Mesh and select\
    \ Object Reference. Click the eye icon to make the variable instance editable.\n\
    +   \n+   3. Compile the Blueprint. In the Static Mesh Var default value, select\
    \ the SM_FieldArrow Static Mesh:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_649_0.png)\n\
    \nFigure 19.17 – Selecting the default Static Mesh used in the generation"
  merge: -1
  img_proc: true
