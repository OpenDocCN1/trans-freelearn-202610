  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_330_0.png)


    Figure 9.38 – Adding a Sequence node


    +   5. In the **Details** panel, change **Node Name** to `Move to Patrol`.


    +   6. Drag a wire down from the **Move to Patrol** node and add a **Move To**
    node. This type of node is a **task node**, has a purple color, and will always
