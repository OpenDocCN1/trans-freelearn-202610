    Figure 10.16 – The On Hear Noise actions


    3. Drag a wire from the white pin of the **On Hear Noise (PawnSensing)** node
    and add a **Branch** node. The next steps will create an expression that uses
    the **VectorLength** function to calculate'
  merge: -1
