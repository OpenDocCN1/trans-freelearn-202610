  md: '+   15. Drag a wire from the white output pin of Apply Damage and add a Finish
    Execute node. Check the Success parameter of the Finish Execute node.


    +   16. Compile, save, and close the Blueprint Editor.


    Now, we need to add our attack task to the attack sequence in BT_EnemyBehavior.


    # Using the attack task in the Behavior Tree


    The attack of the enemy is a melee attack, so the enemy will only perform the
