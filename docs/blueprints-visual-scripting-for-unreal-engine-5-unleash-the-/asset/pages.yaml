- pgno: 93
  md: 'The **Controller** class has two main child classes: **PlayerController** and
    **AIController**. The **PlayerController** class is used by human players, while
    the **AIController** class uses AI to control the **Pawn**.


    Instances of **Pawn** and **Character** classes can only receive input events
    if an instance of **PlayerController** is possessing them. Input Events can be
    placed in the Event Graph of either the **PlayerController** or the **Pawn**.
    The advantage of putting the input Events in **PlayerController** is that these
    Events become independent of the **Pawn**, making it easier to change a **Pawn**
    class that is being possessed by the **Controller** class. Whichever way you choose,
    keep it consistent in your project.


    The following screenshot shows how to change a **Pawn** possessed by **PlayerController**
    in-game and shows the use of the **Possess** function. In this example, there
    are two characters in the Level that can be controlled by the player by pressing
    the **1** or **2** keys. Only the **Character** instance currently being possessed
    receives the **PlayerController** commands:'
