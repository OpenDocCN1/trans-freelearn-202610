- pgno: 78
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_78_0.png)


    # Figure 3.13 – The Spawn Actor from Class function in Context Menu


    This function receives the class of the Actor and the Transformation that will
    be applied as input parameters. The Transformation defines the location, rotation,
    and scale that will be used by the new Actor. Another input parameter, called
    Collision Handling Override, defines how to handle the collision at the time of
    creation. A reference to the new instance is available in the Return Value output
    parameter and can be stored in a variable.


    To remove an Actor instance from the Level, use the DestroyActor function. The
    Target input parameter indicates which instance will be removed. The following
    screenshot shows an example of using the Spawn Actor from Class and DestroyActor
    functions.'
  merge: -1
