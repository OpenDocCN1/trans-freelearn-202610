  md: '# # Part 2: Developing a Game


    In this part, you will start to build a first-person shooter from scratch with
    the help of step-by-step tutorials. Blueprints will be used to develop the gameplay
    mechanics and user interface.


    This part comprises the following chapters:


    +   - Chapter 5, Object Interaction with Blueprints

    +   - Chapter 6, Enhancing Player Abilities

    +   - Chapter 7, Creating Screen UI Elements

    +   - Chapter 8, Creating Constraints and Gameplay Objectives'
