    # Flow control nodes


    There are some nodes that control the flow of the execution of a Blueprint.

    These nodes determine the execution path based on conditions. We''ve

    already seen the **Branch** node, which is a commonly used flow control

    node. Let''s learn about the other main types of flow control nodes.


    # Switch nodes'
  merge: -1
  img_proc: true
- pgno: 471
  md: 'A **switch node** determines the flow of execution based on the value of an
    input variable. There are different types of switch nodes. The next screenshot
    shows an example of the **Switch on Int** node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_471_0.png)


    Figure 13.51 – An example of the Switch on Int node


    The **Selection** input parameter receives an integer value that determines the
    output pin that will be executed. If the input value has no pin, then the **Default**
    pin will execute. You can change the start index in the **Details** panel of **Switch
    on Int**. The output pins are added by using the **Add pin +** option.


    Another type of switch is the **Switch on String** node, which is shown in the
    following screenshot. The output values must be added in the **Details** panel
    of the **Switch on String** node, under **Pin Options | Pin Names**:'
  merge: -1
  img_proc: true
- pgno: 472
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_472_0.png)


    Figure 13.52 – An example of the Switch on String node


    There is also **Switch on Enum**, which uses the values of an enumeration as the
    available output pins.


    # Flip Flop


    Every time a **Flip Flop** node is executed, it toggles between two output pins
    – **A** and **B**. There is a Boolean output parameter named **Is A**. If the
    **Is A** parameter is `True`, then it indicates that pin **A** is running. If
    it is `False`, then pin **B** is running.


    Note


    The **Flip Flop** node does not work properly inside a function because **Flip
    Flop** has an internal variable that is deleted when the function ends. So, every
    time, the **A** pin will be executed inside a function.


    The following screenshot shows an example of the **Flip Flop** node:'
  merge: -1
  img_proc: true
- pgno: 473
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_473_0.png)


    Figure 13.53 – An example of the Flip Flop node


    If the player is using dual wield pistols, then when they fire, only one of the
    pistols fires. In the next shot, the other pistol fires. **Fire Left Pistol**
    and **Fire Right Pistol** are custom macros, used here to simplify this example.


    # # Sequence


    When a **Sequence** node is triggered, it executes all the Actions connected to
    the output pins in order. Thus, it executes all the Actions of a pin, then all
    the Actions of the next pin, and so on. It is useful to organize groups of Actions.


    The next screenshot shows the **Sequence** node in use. The **Print String** functions
    are used to show the order of execution:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_473_1.png)


    Figure 13.54 – An example of the Sequence node


    The **Add pin +** option adds output pins. To remove a pin, right-click on the
    pin and choose the **Remove execution pin** option.'
  merge: -1
  img_proc: true
- pgno: 474
  md: '# For Each Loop


    A **For Each Loop** node receives an array as an input parameter and performs
    the Actions of the **Loop Body** output pin for each element of the array. The
    current **Array Element** and **Array Index** are available as output pins. The
    **Completed** output pin is executed when **For Each Loop** finishes its execution.


    In the next screenshot, the **For Each Loop** node is used to iterate through
    an array of **Point Light** references that contain the lamps of a room:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_474_0.png)


    Figure 13.55 – An example of the For Each Loop node


    The lamps are turned on by using the **Set Visibility** function of **Point Light
    Component**, which is inside the **Point Light** array element.


    # Do Once


    The **Do Once** node executes the output pin only once. If it is triggered again,
    then its output pin will not be performed. The **Reset** input pin needs to be
    triggered to allow the **Do Once** node to run the output pin again.


    The following screenshot shows an example of how it is used:'
  merge: -1
  img_proc: true
- pgno: 475
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_475_0.png)


    Figure 13.56 – An example of the Do Once node


    When the player presses **Space Bar**, the **Do Once** node is triggered, and
    a charged weapon is used. After that, a timer is created to execute **Full charge
    Custom Event**, which resets the **Do Once** node after `30.0` seconds. If the
    player presses **Space Bar** again before 30 seconds have elapsed, then the **Do
    Once** node will not execute its output pin.


    # Do N


    The **Do N** node allows you to specify how many times the output pin can execute.
    After the number of executions has completed, the Actions of the output pin will
    only be executed again if the **Reset** pin is triggered.


    The following screenshot shows an example of how the **Do N** node is used:'
  merge: -1
  img_proc: true
- pgno: 476
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_476_0.png)


    Figure 13.57 – An example of a Do N node


    The player can press **Space Bar** to fire a special weapon. After the third shot,
    they need to press the *R* key to reset the **Do N** node to be able to fire three
    more times.


    # Gate


    The **Gate** node has an internal state; it can be opened or closed. If it is
    open, then the output pin will execute when the **Gate** node is triggered. If
    it is closed, then the output pin will not execute.


    These are the input pins of the **Gate** node:


    +   • **Enter**: An execution pin that receives the flow of execution

    +   • **Open**: An execution pin that sets the state of **Gate** to open

    +   • **Close**: An execution pin that sets the state of **Gate** to closed

    +   • **Toggle**: An execution pin that toggles the state of the **Gate** node

    +   • **Start Closed**: A Boolean variable that determines whether the **Gate**
    node should start in the closed state'
  merge: -1
  img_proc: true
