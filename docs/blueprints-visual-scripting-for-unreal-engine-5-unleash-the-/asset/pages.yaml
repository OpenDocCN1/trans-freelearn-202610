- pgno: 511
  md: '# Chapter 15: Blueprints Tips


    This chapter contains several tips on how to improve the quality of Blueprints.
    We will learn how to use various editor shortcuts that speed up our work. We will
    also learn about some Blueprint best practices that will help you to decide what
    type of implementation should be done and where. Finally, we''ll learn about more
    useful miscellaneous Blueprint nodes.


    These are the topics covered in this chapter:


    +   - Blueprint Editor shortcuts

    +   - Blueprint best practices

    +   - Using miscellaneous Blueprint nodes


    By the end of the chapter, you will be familiar with shortcuts, best practices,
    and Blueprint nodes that will help you when developing more complex games.


    # Blueprint Editor shortcuts


    In the Blueprint Editor, we are going to work with variables a lot, so let''s
    start with the shortcuts related to variables.


    When you drag a variable from the **My Blueprint** panel and drop it in **EventGraph**,
    a submenu appears for you to choose either the **GET** or **SET** nodes. However,
    there are shortcuts to create **GET** and **SET** nodes. If you hold the *Ctrl*
    key and drag a variable to the graph, then the editor will create a **GET** node.
    To create a **SET** node, hold the *Alt* key and drag a variable to the graph.
    The following screenshot shows the **GET** and **SET** nodes:'
  merge: -1
  img_proc: true
- pgno: 512
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_512_0.png)


    # Figure 15.1 – Shortcuts to create GET and SET nodes


    There is another way to create **GET** and **SET** nodes. If you drag a variable
    and drop it on a compatible pin of another node, then the editor will create a
    **GET** or **SET** node depending on the parameter type.


    The following screenshot shows an example of the **Score** variable being dropped
    on an input parameter pin. If the pin is compatible, then the editor will show
    a tooltip with a check icon and a label such as **Make B = Score**. This expression
    means that the **B** pin of the node will get the value of the **Score** variable.
    So, the editor will create a **GET Score** node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_512_1.png)


    # Figure 15.2 – Dragging a variable and dropping it on an input pin to create
    a GET node


    If you drop the **Score** variable on an output parameter pin, as shown in the
    following screenshot, then the editor will show the **Make Score = ReturnValue**
    label, and it will create a **SET Score** node using the **ReturnValue** label
    of the other node as the input parameter:'
  merge: -1
  img_proc: true
- pgno: 513
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_513_0.png)


    Figure 15.3 – Dragging a variable and dropping it on an output pin to create a
    SET node


    The Blueprint Editor has an automatic type conversion system. To use it, drag
    a wire from the pin of one variable type and drop it on a pin of another variable
    type. The following screenshot shows that a tooltip appears to confirm that the
    conversion is possible:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_513_1.png)


    Figure 15.4 – Creating a converter node


    Another useful feature of the Blueprint Editor is that it is possible to change
    an existing node for another node that uses the same variable type without breaking
    the connections.


    There is an example of this in the following screenshot. Player Health and PlayerStamina
    are float variables. If you drag the PlayerStamina variable'
  merge: -1
  img_proc: true
- pgno: 514
  md: 'and drop it on the SET Player Health node, then the node will change to a SET
    PlayerStamina node and keep all the connections.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_514_0.png)


    Figure 15.5 – Changing a node and keeping all connections


    There is a shortcut to create variables based on the type of an input or output
    pin of a node. To do this, right-click on a data pin and select the Promote to
    Variable option, as shown in the following screenshot. This option creates a variable
    and connects it to the pin.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_514_1.png)'
  merge: -1
  img_proc: true
- pgno: 515
  md: 'Figure 15.6 – Promoting the return value to a variable


    If you need to break all the connections of a pin, hold the *Alt* key and click
    on the pin. You can move all the connections of a pin to another compatible pin
    by holding the *Ctrl* key, dragging the connections, and dropping them on another
    pin. This is very useful because you don''t need to redo the connections one by
    one. In the following screenshot, all the connections of the **As First Person
    Character** pin will be moved to the **As BP Player Character**.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_515_0.png)


    Figure 15.7 – Dragging all connections to another pin


    The Blueprint Editor offers several options for node alignment. To use them, select
    some Blueprint nodes and right-click on one of them to open a menu. **Alignment**
