  md: "![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_242_0.png)\n\nFigure 7.35 – Decreasing\
    \ Player Current Ammo\n\n+   3. Find the final node in the chain, **Play Sound\
    \ at Location**. Drag a wire from the output execution pin of this node to empty\
    \ grid space and add a **SET Player Current Ammo** node.\n+   \n+   4. Drag a\
    \ wire from the **Player Current Ammo** input pin to empty space and create a\
    \ **Subtract** node.\n+   \n+   5. Drag a wire from the top input pin of the **Subtract**\
