- pgno: 323
  md: '+   4. Right-click on the graph and add a **Get Blackboard** node. This is
    a utility function that searches for the Blackboard being used by the AI controller.

    +   5. Drag a wire from the **Return Value** pin of **Get Blackboard** and add
