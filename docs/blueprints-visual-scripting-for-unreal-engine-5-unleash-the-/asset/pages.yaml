- pgno: 63
  md: '| | Macros | Functions | Events |

    |---|---|---|---|

    | Input parameters | Yes | Yes | Yes |

    | Output parameters | Yes | Yes | No |

    | Multiple execution paths (input/output) | Yes | No | No |

    | Callable by another Blueprint | No | Yes | Yes |

    | Latent actions (for example, delay) | Yes | No | Yes |

    | Timeline nodes | No | No | Yes |


    # Summary


    In this chapter, we learned how to store values in the variables of a Blueprint
    and how to use actions to define the response of a Blueprint to an event. After
    that, we saw how to create expressions with operators and organize our script
    with macros and functions. These are the key elements needed to define how a Blueprint
    should act within a game.


    In the next chapter, we’ll learn about the Gameplay Framework, which is a group
    of classes with common functionality used in game development.


