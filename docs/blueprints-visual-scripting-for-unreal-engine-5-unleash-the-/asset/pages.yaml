    # ## Figure 6.6 – Creating Action Mappings


    +   4. Click on the + sign next to Action Mappings twice to add two new Action
    Mappings.

    +   5. Name the first Action Sprint and select the Left Shift key from the drop-down
    menu to map that key to your Sprint Event. Name the second Action Zoom and map
    it to Right Mouse Button.


    The changes are saved when you close the window.


    # ## Adding a Sprint ability


    Now that we have a basic understanding of how the movement input nodes take the
    controller input and apply it to our in-game character, we''ll extend that functionality
    with a Sprint ability. We''ll set up a new series of nodes within the FirstPersonCharacter
    Blueprint. They will look like this:'
  merge: -1
  img_proc: true
