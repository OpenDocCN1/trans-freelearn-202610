    In this section, we learned how to create a variable that refers to an instance
    of another Blueprint. But sometimes we need to access attributes of the subclass
    of the instance being referenced. In this case, we need to cast the reference.


    # Casting in Blueprints


    There is a node named Cast To that tries to convert reference variable types to
    new specified types. To understand casting, it is necessary to remember'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'the concept of inheritance between classes, which we covered in *Chapter 3,
    Actors and the Gameplay Framework*.


    The following diagram represents a Blueprint called `BP_GameModeWithScore`. **Game
    Mode Base** is the parent class of this Blueprint. Based on the inheritance concept,
    we can use a variable of the **Game Mode Base** object reference type to reference
    an instance of `BP_GameModeWithScore`. However, this variable is unable to access
    the variables and functions of a *subclass* like those defined in the `BP_GameModeWithScore`
    Blueprint, because a **Game Mode Base** reference only knows the variables and
    functions that are defined in the **Game Mode Base** class:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_110_0.png)


    Figure 4.11 – BP_GameModeWithScore inherits from Game Mode Base


    Therefore, if we have a **Game Mode Base** object reference, we can try to cast
    this reference using the `Cast To BP_GameModeWithScore` function. If the instance
    is of the `BP_GameModeWithScore` type, then **Cast To** will succeed and return
    a `BP_GameModeWithScore` object reference that we can use to access the variables
    and functions of `BP_GameModeWithScore`.'
  merge: -1
  img_proc: true
