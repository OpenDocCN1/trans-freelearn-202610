    Mesh node. Drag a wire from the Get Static Mesh Var node and connect it to the
    New Mesh parameter.


    +   6. Drag a wire from the white output pin of Set Static Mesh and add a For
    Loop node. Type 1 in the First Index parameter. Drag a wire from the Last Index
    parameter and add a Get Number Of Rows node.


    +   7. Add the Get Space Between Rows node. Drag a wire from the Index output
    node and add a Multiply node. Drag a wire from Get Space Between Rows and connect
    it to the bottom pin of the Multiply node. The pin will be converted from integer
    to float.


    +   8. Drag a wire from the Loop Body output pin and add a Set Instance Location
    X node. Connect the output pin of the Multiply node to the input pin of Instance
    Location X.


