- pgno: 42
  md: '# Figure 2.3 – Attributes of a variable


    These attributes can be individually described as follows:


    +   - **Variable Name**: This is the identifier of the variable.

    +   - **Variable Type**: This specifies the type of values that can be stored
    in this variable.

    +   - **Instance Editable**: When this box is checked, each copy of this Blueprint
    placed in the level can store a different value in this variable. Otherwise, the
    same initial value is shared by all copies, called **instances**.

    +   - **Blueprint Read Only**: If checked, the variable cannot be changed by Blueprint
    nodes.

    +   - **Tooltip**: This contains information shown when the cursor hovers over
    the variable.

    +   - **Expose on Spawn**: If checked, the variable can be set when spawning the
    Blueprint.

    +   - **Private**: If checked, child Blueprints cannot modify it.

    +   - **Expose to Cinematics**: If checked, this variable will be exposed to Sequencer.

    +   - **Category**: This can be used to organize all variables in the Blueprint.

    +   - **Slider Range**: This sets the minimum and maximum values that will be
    used by a **User Interface (UI)** slider to modify this variable.

    +   - **Value Range**: This sets the minimum and maximum values allowed for this
    variable.

    +   - **Replication and Replication Condition**: They are used in networked games.

    +   - **DEFAULT VALUE**: This contains the initial value of the variable. The
    Blueprint must be compiled before you can set the default value.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'Variables are used to represent the current state of a Blueprint, but the behavior
    is defined by events and actions, which will be discussed in the following section.


    # Defining the behavior of a Blueprint with events and actions


    Most of the time, we will use Blueprints to create new Actors. In Unreal Engine,
    Actors are game objects that can be added to a level.


    Unreal Engine informs the state of a game for an Actor using events. We define
    how an Actor responds to an event by using actions. Both events and actions are
    represented by nodes in the **Event Graph** panel.


    # Events


    To add events to a Blueprint, use the **Event Graph** panel. Right-click the **Event
    Graph** panel to open **Context Menu**, which has a list of available events and
    actions. If you need more space in the **Event Graph** panel, you can right-click
    and drag to move it to an empty area of **Event Graph**. **Context Menu** has
    a **Search** bar that can be used to filter the list of nodes. There is also the
    **Context Sensitive** checkbox that filters the possible actions based on the
    node selected. The following screenshot shows **Context Menu** and some of the
    events available:'
  merge: -1
  img_proc: true
- pgno: 44
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_44_0.png)


    # Figure 2.4 – Events in Context Menu


    You can add several events in the **Event Graph** panel, but you can add each
    event only once. In addition to the events provided by Unreal Engine, you can
    create your own events by clicking on **Add Custom Event**.... The next'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'screenshot shows a **Custom Event** node and its **Details** panel where you
    can rename the custom event and add input parameters. We will learn about parameters
    later in this chapter, in the *Creating macros* topic:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_45_0.png)


    # Figure 2.5 – Creating a custom event


    These are some of the events that are available:


    +   - **Collision Events**: These are executed when two Actors collide or overlap.

    +   - **Input events**: These are triggered by input devices, such as the keyboard,
    mouse, touch screen, and gamepads.

    +   - **Event BeginPlay**: This is executed either when the game is started for
    Actors already present on the Level Editor, or immediately after the Actor is
    spawned if that happens during runtime.

    +   - **Event End Play**: This is executed when the Actor is about to be removed
    during runtime.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '● **Event Tick**: This is called every frame of the game. For example, if a
    game runs at 60 frames per second, this event will be called 60 times in a second.


    We will now learn how to create actions that connect to events.


    # Actions


    When an event is triggered, we use actions to define how a Blueprint will react
    to this event. You can use actions to get or set values in the Blueprint variables
    or call functions that modify the state of a Blueprint.


    The following screenshot shows the **Event BeginPlay** event of a Blueprint. In
    this example, the Blueprint has a string variable named **Bot Name**:


    +   1. The SET action assigns the **Archon** value to the **Bot Name** variable.


    +   2. The next action, **Print String**, displays the value that is received
    on the **In String** pin on the screen. These values that are passed to the functions
    are known as parameters.


    +   3. The **In String** pin is connected to a GET node of the **Bot Name** variable
    that returns the value of the **Bot Name** variable and passes it to the **Print
    String** function:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_46_0.png)


    Figure 2.6 – Event BeginPlay with some actions


    +   4. To add the GET and SET Actions of a variable to Event Graph, simply drag
    the variable from the **My Blueprint** panel and drop it in **Event Graph** to
    show the GET and SET options.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'Other functions such as **Print String** are added from **Context Menu** that
    appears when you right-click on the **Event Graph** panel. The **GET** and **SET**
    actions can also be searched in **Context Menu**.


    The white lines that connect the actions are also known as the execution path.


    # # The execution path


    The white pins of nodes are called **execution pins**. The other colored pins
    are the **data pins**. The execution of the nodes of a Blueprint starts with a
    red event node, and then follows the white wire from left to right until it reaches
    the last node.


    There are some nodes that control the flow of execution of the Blueprint. These
    nodes determine the execution path based on conditions. For example, the **Branch**
    node has two output execution pins named **True** and **False**. The execution
    pin that will be triggered depends on the Boolean value of the **Condition** input
    parameter. The following screenshot shows an example of the **Branch** node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_47_0.png)


    Figure 2.7 – Branch node with two execution paths


    In this example, when **Event BeginPlay** fires, the **Branch** node evaluates
    the value of the **Has Shield** Boolean variable. If the value is **True**, then
    the **True** pin will be executed and will set the value to `100.0` in the **Shield
    Value** variable. If it is **False**, the value `0.0` will be set in the **Shield
    Value** variable.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'We saw how to modify the value of a variable using an action. The next step
    is to learn how to create expressions with variables.


    # # Creating expressions with operators


    Operators are used to create expressions using variables and values. These operators
    are found in **Context Menu** within the **Utilities | Operators** category.


    The main types of operators are arithmetic, relational, and logical.


    # ## Arithmetic operators


    The arithmetic operators (+, -, x, and /) can be used to create mathematical expressions
    in Blueprints. The following screenshot shows the equivalent nodes in Blueprints.
    These operators receive two input values on the left and give the operation result
    on the right. The arithmetic operators can have more than two input parameters;
    just click on the **Add pin** button on the node to add another input parameter.
    The input values can be obtained from a data wire or entered directly in the node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_48_0.png)'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Figure 2.8 – Arithmetic operation nodes


    # Note


    The * symbol is the multiplication operator in programming languages. Blueprints
    also recognize * as the multiplication operator but use the letter X as the label
    of the multiplication node. You need to use the * symbol or write the word multiply
    when searching for multiplication nodes in the **Context Menu**.


    The following screenshot shows a simple arithmetic expression. The numbers on
    the screenshot show the order of completion of the nodes. The execution starts
    with **Event BeginPlay**. The **SET** node assigns a new value to the **Magic
    Points** variable, but this value must be obtained using the data wire that is
    connected to the output of a multiplication node, which will need to get the value
    of the **Willpower** variable using another data wire to multiply by `20.0`:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_49_0.png)


    # Figure 2.9 – Multiply operation


    # Relational operators


    Relational operators perform a comparison between two values and return a Boolean
    value (**True** or **False**) as a result of the comparison. The following'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'screenshot shows the relational operators in Blueprints:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_50_0.png)


    Figure 2.10 – Relational operation nodes


    The following screenshot shows an example with a relational operator,

    assuming these actions are performed when a game object receives damage.

    A **Branch** node is used to test whether the **Health** variable value is less

    than or equal to `0.0`. If it returns **True**, then this game object will be

    destroyed. If it returns **False**, nothing will happen since there are no actions

    connected to the **False** branch of execution.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_50_1.png)


    Figure 2.11 – Testing a condition with a relational operator


    # Logical operators'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Logical operators perform an operation between Boolean values and return a
    Boolean value (True or False) as a result of the operation. The following screenshot
    shows the logical operators in Blueprints:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_51_0.png)


    Figure 2.12 – Logical operation nodes


    These are the descriptions of these operators:


    +   - OR: Returns a value of True if any of the input values are True.

    +   - AND: Returns a value of True if and only if all input values are True.

    +   - NOT: Receives only one input value, and the result will be the opposite
    value.

    +   - NOR: This is a combination of NOT and OR operators. It returns a value of
    True if both inputs are False, otherwise, the return value is False.

    +   - NAND: This is a combination of NOT and AND operators. It returns a value
    of False if both inputs are True, otherwise, the return value is True.

    +   - XOR: This operator is called exclusive OR. It returns a value of True if
    the two inputs are different (one is True and the other is False). If the two
    inputs are the same, the return value is False.


    The following screenshot shows an example of using the AND operator. The Print
    String node will only be executed if the Health value is greater'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'than 70.0 and Shield Value is greater than 50.0:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_52_0.png)


    # Figure 2.13 – Testing a condition with an AND operator


    We already know how to use actions and operators; the next step is learning how
    to organize them in macros and functions.


    # Organizing the script with macros and functions


    When we are creating Blueprint scripts, sometimes, a group of actions is used
    in more than one place in Blueprint. These actions can be converted into macros
    or functions, simplifying the initial script because this group of actions will
    be replaced by only one node. Also, if you need to change something in this group
    of actions, this change will only be implemented in the macro or function rather
    than having to search every location where this group of actions was used. This
    is a good programming practice to use as it simplifies code and debugging.


    # Creating macros


    To create macros, use the My Blueprint panel and click the + button in the MACROS
    category. The following screenshot shows the My Blueprint panel with a macro named
    SetupNewWave:'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_53_0.png)


    Figure 2.14 – Creating a macro


    When a macro is created, a new tab is opened in the same place as the Event Graph.
    This tab looks like the Event Graph but contains only the nodes relevant to the
    macro. You will add the macro actions in this tab. You can close the Macro tab,
    and to open it again, double-click the macro name on the My Blueprint panel. You
    can click the Event Graph tab to return to Event Graph:'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_54_0.png)


    Figure 2.15 – The macro tab


    The attributes of a macro are displayed in the **Details** panel. In this panel,
    you can define input and output parameters. Input parameters are values passed
    to macros/functions. Output parameters are values returned from macros/functions.
    The following screenshot shows the **Details** panel of the `SetupNewWave` macro
    with two input parameters and one output parameter. In macros, the white execution
    pins are defined as input/output parameters of type **Exec**, so you can add as
    many as you like. In the following example, we create an input execution pin named
    **In** and an output execution pin named **Out**:'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_55_0.png)


    # Figure 2.16 – Attributes of a macro


    The following screenshot shows the contents of the `SetupNewWave` macro. The idea
    of this macro is to set some variables for the next wave of enemies in a game.
    It receives the current **Wave Number** as an input parameter, stores this value
    in the **Current Wave** variable, and determines the number of enemies by multiplying
    the current **Wave Number** by 5:'
