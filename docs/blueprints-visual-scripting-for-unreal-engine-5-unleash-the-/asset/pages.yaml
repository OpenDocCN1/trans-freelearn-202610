    # # Adding substance to our Material


    We can optionally add some polish to our Material by taking advantage of some
    of the other input pins on the Material definition node. 3D objects look unrealistic
    with flat single-color Materials applied, but we can add additional reflectiveness
    and depth by setting a value for the Materials'' **Metallic** and **Roughness**
    inputs. To do so, follow these steps:


    +   1. Right-click in an empty grid space and type `scalarpa` into the search
    box. The node we are looking for is called **ScalarParameter**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_150_1.png)'
