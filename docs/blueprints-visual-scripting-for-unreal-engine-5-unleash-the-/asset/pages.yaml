- pgno: 144
  md: '# Figure 5.4 – World Outliner showing the added Cylinder


    2. In the **Details** panel, change the name of the **Cylinder** instance to `CylinderTarget`,
    as shown here:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_144_0.png)


    # Figure 5.5 – The Details panel of the Cylinder shape


    We''ve added an Actor to the Level that will be used as a target; we''re now going
    to learn how to create a Material to apply to the Actor.


    # Exploring Materials


    Earlier, we set ourselves the goal of changing the color of the Cylinder when
    it is hit by a projectile. To do so, we need to change the Actor''s **Material**.
    A Material is an asset that can be added to an Actor''s mesh to create its look.
    You can think of a Material as a coat of paint applied on top of an Actor''s mesh
    or shape. Since an Actor''s Material determines its color, one method for changing
    the color of an Actor is to replace its Material with one of a different color.
    To do this, let''s first create a Material of our own. It will make an Actor appear
    red.


    # Creating Materials


    Follow these steps to create a Material:'
  merge: -1
  img_proc: true
