- pgno: 421
  md: '# # Chapter 12: Building and Publishing


    One of the best ways to grow as a game developer is to share your work with others
    so that you can get feedback on how to evolve your designs and content. An early
    priority should be to create shareable builds of your game so that other people
    can play it for themselves. Fortunately, Unreal Engine 5 makes it extremely simple
    to create builds of your game for multiple platforms. In this chapter, we will
    look at how to optimize the settings of our game and the process of building for
    your target desktop platform. In the process, we will cover the following topics:


    +   - Optimizing your graphics settings

    +   - Setting up our game to be played by others

    +   - Packaging the game into a build


    By the end of the chapter, you will have a packaged version of our game that you
    can share and install on other machines.


    # ## Optimizing your graphics settings


    Prior to creating a build, or a version of our game that has been optimized to
    play on a particular platform, you should change the graphics settings of our
    game to ensure that they are suited to your target machines. The graphics settings
    in Unreal Engine 5 are identified as **Engine Scalability Settings**. This settings
    interface is composed of several graphics settings, each of which determines the
    final visual quality of one element of the game. With any game, there is a trade-off
    between high-quality effects and visuals, and the performance of that game in
    terms of frame rate.


    Games that struggle with low frame rates feel bad from a gameplay perspective,
    even if the mechanics are otherwise solid. As such, it is'
  merge: -1
  img_proc: true
- pgno: 422
  md: 'important to balance the desire to make your game look as good as it can with
    the need to understand what the performance impact will be on the machines that
    your players will be running the game on.


    Because of the varying hardware performance of PCs and macOS computers, many games
    targeting those platforms use custom menu settings to allow the player to tweak
    the graphics settings of the game themselves. However, the game we have created
    only uses very simple assets and a relatively constrained level size, so we are
    simply going to define some workable defaults before generating a build to distribute.


    Follow these steps to modify **Engine Scalability Settings**:


    +   1. Click the **Settings** button located on the right-hand side of the Level
    Editor toolbar.'
  merge: -1
  img_proc: true
