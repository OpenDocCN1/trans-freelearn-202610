- pgno: 446
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_446_0.png)


    Figure 13.12 – SpawnClass can be specified in an instance on the level


    In **Event BeginPlay**, we will use a **Branch** node to validate the **Spawn
    Class** and **Target Points** variables. Any variable storing a reference should
    be validated before use to avoid runtime errors. If the variables are valid, then
    we spawn an Actor using the class stored in the **Spawn Class** variable and the
