- pgno: 234
  md: '# Figure 7.24 – The events of FirstPersonCharacter


    +   3. Delete the previous nodes that were connected to Event BeginPlay because
    they deal with the case of playing the game in VR, and we will not use VR in this
    example game.


    # Important Information


    In most cases, Event BeginPlay will call the subsequent Actions as soon as the
    game is started. If the Blueprint instance isn''t present when the game starts,
    then instead, it will trigger as soon as the instance is spawned. Since the `FirstPersonCharacter`
    player instance is present as soon as the game begins, attaching the displaying
    logic to this event will create the HUD immediately.


    +   4. Drag a wire from the output execution pin of Event BeginPlay and add a
    Create Widget node. Within the node, you will see a drop-down menu labeled Class.
    This is our opportunity to use the Widget Blueprint we created. Recall that we
    named our Widget Blueprint HUD. If you click the drop-down menu, then you will
    see the HUD option. Select it to have the player Character Blueprint generate
    the UI elements you created. The following screenshot shows the Create HUD Widget
    node associated with our HUD Widget Blueprint:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_234_0.png)


    # Figure 7.25 – Creating an instance based on the HUD Widget Blueprint'
  merge: -1
  img_proc: true
- pgno: 235
  md: '+   5. Although we now have a Widget generated when the game starts, there
    is a final step required to get the Widget containing our UI elements to appear
    on the screen. Drag the **Return Value** output pin into empty grid space and
    add an **Add to Viewport** node.


    +   6. Create a comment around the three nodes. Label the comment `Draw HUD on
    Screen`. The nodes should appear as follows:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_235_0.png)


    Figure 7.26 – The Add to Viewport node shows the Widget Blueprint on screen


    +   7. Now, compile, save, and click on **Play** to test the game.


    We''ve learned how to create text elements and progress bars in the UMG Editor.
    We''ve also learned how to use containers, such as horizontal and vertical boxes,
    to organize UI elements on screen.


    When playing the game, you should see the two meters representing the player''s
    health and stamina, as well as numerical counters for ammo and eliminated targets.
    But as you shoot from your gun, you may notice one very important problem – none
    of the UI values change! We will address this missing component in the next section.


    # Connecting UI values to player variables'
  merge: -1
