- pgno: 348
  md: '# # Summary


    In this chapter, we began the process of changing our simple moving targets into
    fleshed-out game enemies that can challenge the player. In the process, you learned
    the basics of how AIControllers, Behavior Trees, and Blackboards can be leveraged
    together to create an enemy with the ability to sense the world around it and
    make decisions based on that information.


    As we continue the process of developing our AI to pose a serious challenge to
    the player, you can use the skills you have learned to consider other kinds of
    behaviors you might be able to give an enemy. Continued exploration of AI mechanics
    will see you continually coming back to the core loop of sensing, decision-making,
    and acting that we began implementing here.


    In the next chapter, we will extend our AI behavior to create an enemy that can
    truly challenge the player. We will add the ability for the enemy to listen for
    the player and investigate a sound, as well as giving the enemy an attack ability
    to damage the player when they get too close. To balance the game around this
    new threat, we will also give the player the ability to fight back against the
    enemies.


    # # Quiz


    +   1. The Run Behavior Tree function belongs to which class?

    +   a. Actor

    +   b. Pawn

    +   c. AIController

    +   d. PlayerController


    +   2. A Blackboard is a specialized type of Blueprint that can have events and
    actions.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '+   a. True

    +   b. False


    +   3. The Behavior Tree graph can have control flow nodes and Task nodes.

    +   a. True

    +   b. False


    +   4. Which control flow node succeeds and stops running as soon as one child
    successfully runs?

    +   a. Selector

    +   b. Sequence


    +   5. Which element can we add to a node to provide conditions that must be met
    to run it?

    +   a. Task

    +   b. Decorator

    +   c. Service'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# # Chapter 10: Upgrading the AI Enemies


    In this chapter, we will add more functionality to our AI enemies to introduce
    the potential for a player to fail and to create greater gameplay diversity. At
    this point, we are going to begin settling on the kind of challenge we want to
    offer the player. We are going to create zombie-like enemies that will relentlessly
    pursue the player, creating an action-focused experience, where the player must
    try to survive against hordes of enemies. We will start by giving more capability
    to the AI, including the ability to deal damage and use wandering patterns to
    increase the difficulty of player survival. We will then turn our attention to
    the player, giving them the ability to fight back against these dangerous enemies.
    Finally, we will complete the balance of our increased difficulty by creating
    a system to gradually spawn new enemies in the game world.


    In this process, we will cover the following objectives:


    +   - Introducing an enemy melee attack that will damage the player''s health

    +   - Giving the AI the ability to hear the player''s footsteps and shots

    +   - Having the enemy investigate the last known location of the player based
    on sound

    +   - Allowing the player to destroy enemies with their gun

    +   - Spawning new enemies in the world

    +   - Setting AI enemies to wander the level randomly


    By the end of the chapter, we will have an enemy spawner that will be spawning
    AI enemies that attack the player, can hear the player''s footsteps and shots,
    and wander the level randomly.


    # ## Creating an enemy attack'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'If the enemies we create are going to pose a genuine obstacle to the player
    achieving the goals we create for them, then we will first need to give the enemies
    the ability to damage the player. In *Chapter 9, Building Smart Enemies with Artificial
    Intelligence*, we set up the basic structure of an enemy attack pattern. It is
    triggered when the player enters the enemy''s line of sight. We are now going
    to introduce a damage element to this attack, ensuring that there is some consequence
    of the enemy reaching the melee range of the player.


    # # Making an attack task


    We will create an attack task named `BTTask_DoAttack` that does damage, and we
    will extend the **Attack Player** sequence we created in the enemy Behavior Tree.
    The task will have two variables – one to store the target of the damage and one
    to store the amount of damage to be applied.


    Follow these steps to create the attack task:


    +   1. In the content browser, access the `Content/FirstPersonBP/Enemy` folder
    and double-click on the `BT_EnemyBehavior` asset to open the Behavior Tree Editor.


    +   2. Click the **New Task** button on the Toolbar and select the **BTTask_BlueprintBase**
    option from the drop-down menu that appears. The task is created in the same folder
    as the Behavior Tree – `Content/ FirstPersonBP/Enemy`.


    +   3. In the content browser, rename the newly created `BTTask_ BlueprintBase_New`
    asset to `BTTask_DoAttack`. Double-click on `BTTask_DoAttack` to return to the
    Blueprint Editor.


    +   4. The **Details** panel shows the class defaults. Change the Node Name field
    to `DoAttack`.


    +   5. In the **My Blueprint** panel, click the + button of the **Variables**
    category. In the **Details** panel, name the variable `TargetActorKey`, change
    its type to **BlackboardKeySelector**, and check the **Instance Editable** attribute:'
  merge: -1
  img_proc: true
- pgno: 352
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_352_0.png)


    Figure 10.1 – Creating the TargetActorKey variable


    +   6. Create another variable in My Blueprint panel. In the Details panel, name
    the variable `Damage`, change Variable Type to Float, and check the Instance Editable
    attribute. Compile the blueprint and set DEFAULT VALUE to `0.25`, which means
    an attack will take 25% of the player''s health:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_352_1.png)


    Figure 10.2 – The Damage variable has a default value of 0.25'
  merge: -1
  img_proc: true
- pgno: 353
  md: '+   7. Hover the mouse on the **Functions** category of the **My Blueprint**
    panel, click the **Override** dropdown, and select **Receive Execute** to add
    the event.


    +   8. In **Event Receive Execute**, we will ensure **Target Actor** is valid
    and then apply damage to it. The event gets the **Target Actor** reference from
    the blackboard and checks whether it is valid before calling the **Apply Damage**
    function:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_353_0.png)


    # Figure 10.3 – The Event Receive Execute actions


    +   9. The nodes of _steps 9–12_ are to get the **Target Actor** reference from
    the blackboard and check whether it is valid. Drag a wire from the white pin of
    **Event Receive Execute** and add an **Is Valid** macro node.


    +   10. Drag the **Target Actor Key** variable from the **My Blueprint** panel,
    drop in **EventGraph**, and select **Get Target Actor Key**.


    +   11. Drag a wire from the **Target Actor Key** node and add **Get Blackboard
    Value as Actor**.


    +   12. Drag a wire from **Return Value** of **Get Blackboard Value as Actor**
    and connect to the **Input Object** pin of the **Is Valid** node.


    +   13. The nodes of _steps 13–15_ are to call the **Apply Damage** function using
    the **Target Actor** reference. Drag another wire from **Return Value** of **Get
    Blackboard Value as Actor** and add an **Apply Damage** node. Connect the **Is
    Valid** output pin to the white input pin of the **Apply Damage** node.


    +   14. Drag a wire from the **Base Damage** input pin of **Apply Damage** and
    add a **Get Damage** node.'
  merge: -1
  img_proc: true
