  img_proc: true
- pgno: 151
  md: '# Figure 5.12 – Adding a ScalarParameter node


    +   2. Once you have a **ScalarParameter** node, select it and go to the **Details**
    panel. **ScalarParameter** takes a single float value. Set **Default Value** to
    `0.1`, as we want any additional effects on our Material to be subtle.


    +   3. Change **Parameter Name** to **Metallic**, then click and drag the output
    pin from our **Metallic** node to the **Metallic** input pin of the Material definition
    node.


    +   4. Let''s make an additional connection to the **Roughness** parameter, so
    right-click on the **Metallic** node we just created and select **Duplicate**.
    This generates a copy of that node without the wire connection.


    +   5. Select this duplicate **Metallic** node and then change the **Parameter
    Name** field in the **Details** panel to **Roughness**. Let''s keep the same default
    value of `0.1` for this node.


    +   6. Click and drag the output pin from the **Roughness** node to the **Roughness**
    input pin of the Material definition node.


    The result of our Material should look like this:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_151_0.png)'
