- pgno: 516
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_516_0.png)


    # Figure 15.8 – The Alignment options


    Most of the Alignment options are self-explanatory, but let''s look at an example:
    Straighten Connection(s). The following screenshot shows three nodes selected:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_516_1.png)


