- pgno: 65
  md: '# Chapter 3: Object-Oriented Programming and the Gameplay Framework


    Blueprints are based on the principles of **object-oriented programming** (**OOP**).
    One of the goals of OOP is to bring programming concepts closer to the real world.


    The Unreal Engine Gameplay Framework encompasses all the core systems required
    for a video game, such as game rules, player input and controls, cameras, and
    user interfaces.


    In this chapter, we will learn about the following topics:


    +   - Getting familiar with OOP concepts

    +   - Managing Actors

    +   - Exploring the Gameplay Framework classes


    # Getting familiar with OOP


    Let''s learn about some elementary concepts of OOP, such as classes, instances,
    and inheritance. These concepts will help you learn about various elements of
    Blueprints Visual Scripting.


    # Classes


    In OOP, a class is a template for creating objects and providing the initial values
    for state (variables or attributes) and implementations of behavior (events or
    functions).'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Many real-world objects can be thought of in the same way, even if they are
    unique. As a very simple example, we can think of a person class. In this class,
    we can have attributes such as name and height, and actions such as move and eat.
    Using the person class, we can create several objects of this class. Each object
    represents a person with different values for their name and height attributes.


    When we create a Blueprint, we are creating a new class that can be used to create
    objects in the levels of a game. As the following screenshot shows, the option
    that appears when creating a new Blueprint asset is **Blueprint Class**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_66_0.png)


    Figure 3.1 – Creating a Blueprint Class


    **Encapsulation** is another important concept. It allows us to hide the complexity
    of a class when it is viewed from the point of view of another class. The variables
    and functions of a Blueprint class can be **private**, which means that they can
    only be accessed and modified in the Blueprint Class where they were created.
    The **public** variables and functions are those that can be accessed by other
    Blueprint Classes.


    # Instances


    An object created from a class is also known as an **instance** of that class.
    Each time you drag a Blueprint Class from **Content Browser** and drop it into
    the Level, you create a new instance of this Blueprint Class.


    All instances are created with the same default values for their variables as
    were defined in the Blueprint Class. However, if a variable is marked as **Instance
    Editable**, the variable''s value can be changed in the Level for'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'each of the instances without affecting the values held by the other instances.


    For example, imagine that a Blueprint was created to represent a character type
    in a game. The following screenshot shows that three instances of this Blueprint
    Class were added to the Level:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_67_0.png)


    Figure 3.2 – Instances of a Blueprint Class


    # Inheritance


    In OOP, classes can inherit variables and functions from other classes. When we
    are creating a Blueprint, the first thing we must do is choose the parent class
    of this Blueprint. A Blueprint Class can only have one parent class but can have
    several child classes. The parent class is also known as the superclass, while
    the child class is known as the subclass.'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'As an example of using inheritance, imagine that we are creating several Blueprints
    that represent different types of weapons in a game. We can create a base Blueprint
    Class called `Weapon` with everything that is common to all weapons in the game.
    Then, we can create the Blueprints that represent each of the weapons using the
    `Weapon` class as the parent class. The following diagram shows the hierarchy
    between these classes:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_68_0.png)


    Figure 3.3 – Class hierarchy


    One advantage of inheritance is that we can create a function in the parent class
    and override it in the child classes with different implementations. For example,
    there can be a function named `Fire` in the `Weapon` parent class. The child classes
    inherit the `Fire` function, so the `Shock Rifle` class overrides the `Fire` function
    with a version that fires an energy beam, and the `Rocket Launcher` class overrides
    the `Fire` function to launch rockets. At runtime, if we have a reference to the
    `Weapon` class and call the `Fire` function, the instance class will be identified
    to run its version of the `Fire` function.


    Inheritance is also used to define the class type of a class since it accumulates
    all the types of its parent class. For example, we can say that an instance of
    the `Shock Rifle` class is of the `Shock Rifle` type and of the `Weapon` type.
    Because of this, if we have a function with a `Weapon` input parameter, it can
    receive instances of the `Weapon` class or any instances of its child classes.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'These elementary concepts of OOP will help us understand the Gameplay Framework.
    Unreal Engine has some essential classes that are used in the development of games.
    These classes are parts of the Gameplay Framework. The main class of the Gameplay
    Framework is **Actor**.


    # # Managing Actors


    The Actor class contains all the functionality an object needs to exist in a Level.
    Therefore, the Actor class is the parent class for all objects that can be placed
    or spawned in a Level. In other words, any object that can be placed or spawned
    in a Level is a subclass of the Actor class. Most of the Blueprints that we''ll
    create will be based on the Actor class itself or its child classes. Therefore,
    the features we will look at in this section will be useful for these Blueprints.


    # # Referencing Actors


    Variable types such as integer, float, and Boolean are known as primitive types
    because they only store simple values of the specified type. When working with
    objects or Actors, we use a type of variable known as an **object reference**.
    References in Blueprints allow different objects to talk to each other. We will
    explore this communication in greater detail in _Chapter 4, Understanding Blueprint
    Communication_.


    For example, the following diagram represents instances of two Blueprint Classes
    in memory. The instance of the `BP_Barrel` Blueprint Class has an integer variable
    named `Hit Counter`, with a current value of `2`. The other variable, named `BP_Fire`,
    is an object reference, which is referencing an instance of **Blueprint Effect
    Fire**. We can access the public variables and functions of another Blueprint
    using an object reference variable:'
  merge: -1
  img_proc: true
