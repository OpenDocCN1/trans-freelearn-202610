    # ## Summary


    In this chapter, we learned about some of the principles of OOP that aid our understanding
    of how Blueprints work. We learned how the Actor class is the parent class that''s
    used for objects that can be placed or spawned into a Level.


    We also saw that the Gameplay Framework contains classes that are used to represent
    certain game elements and learned how to create Blueprints based on some of the
    **Common Classes**.


    Our next step is to learn how our Blueprints can communicate with each other,
    which we will cover in the next chapter.


