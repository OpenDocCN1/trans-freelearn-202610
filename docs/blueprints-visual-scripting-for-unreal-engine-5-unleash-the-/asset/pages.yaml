    \   4. On the next screen, choose **Actor** as the parent class. Name the Blueprint\
    \ *BP_RandomSpawner* and double-click it to open the *Blueprint Editor*.\n+  \
    \ \n+   5. In the **My Blueprint** panel, create a new variable named *TargetPoints*.\
    \ In the **Details** panel, click the **Variable Type** drop-down menu and search\
    \ for *target point*. Hover over **Target Point** to display a submenu and then\
    \ choose **Object Reference**. Click the icon to the right of **Variable Type**\
    \ and select the **Array** icon. Check"
