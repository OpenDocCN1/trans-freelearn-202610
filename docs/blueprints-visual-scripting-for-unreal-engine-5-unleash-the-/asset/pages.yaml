    # ## Summary


    In this chapter, we have enhanced the play experience by adding constraints to
    the player''s abilities and established a goal for the player to achieve. In the
    process, you have learned how to use timers to repeat actions, how to create collectible
    objects in the game world, and how to create a menu system.


    This chapter concludes *Part 2*. The elements that make up the foundation of a
    video game experience are present in the game that we''ve built. If you desire,
    make a copy of the project, increase the target goal, and spend some'
  merge: -1
  img_proc: true
