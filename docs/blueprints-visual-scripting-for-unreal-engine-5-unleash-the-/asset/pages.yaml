- pgno: 152
  md: 'Figure 5.13 – The result of the M_TargetRed Material


    We have now made a shiny red Material that ensures our targets stand out when
    they are hit. Click on the **Save** button at the top-left corner of the Editor
    to save the asset. Close the Material Editor to return to the Level Editor.


    We have learned how to use the Material Editor to create a simple Material using
    the **Base Color**, **Metallic**, and **Roughness** input pins. In the next section,
    we will see how to change the Material of an Actor during runtime.


    # Creating the target Blueprint


    We now have a Cylinder in the world, as well as the Material we want to apply
    to the Cylinder when it is shot. The final piece of the interaction is the game
    logic that evaluates that the Cylinder has been hit, and then changes the Material
    on the Cylinder to our new red Material. To create this behavior, we must convert
