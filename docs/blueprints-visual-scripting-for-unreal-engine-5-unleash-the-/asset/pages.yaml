- pgno: 676
  md: 'the appearance of the Product Configurator. These variables are instance-editable,
    so you can modify them in the instance that is in the level.


    Now, let''s look at the functions:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_676_0.png)


    Figure 20.11 – The BP_Configurator functions


    This is what each function does:


    +   * **initConfigVarSets**: It gets the Variant Sets of the Level Variant Sets
    Actor and stores them in the `ObjectVariantSets` array, the `EnviroVarSet` variable,
    and the `CameraVarSet` variable.

    +   * **resetAllVariants**: Calls the **resetVariant** function for `EnviroVarSet`,
    `CameraVarSet`, and each element of the `ObjectVariantSets` array.

    +   * **resetVariant**: Resets a Variant Set by activating the first element of
    the Variant Set.

    +   * **callVariantActorAction**: Calls the `Variant Switched On` function for
    all Actors and components used by the current Variant that implements the `BPI_RuntimeAction`
    interface. This allows Actors to run script when the Variant is activated.'
  merge: -1
  img_proc: true
- pgno: 677
  md: '+   - callVariantActorInit: Calls the Variant Initialize function for all Actors
    and components used by the current Variant that implements the BPI_RuntimeAction
    interface.

    +   - activateVariant: Activates a Variant of a given Variant Set.

    +   - initCamera: Initializes the camera.


    **Event BeginPlay** has a **Sequence** node with three outputs. The first output
    wire connects to the nodes that store the **BP_Configurator** reference in **BP_ConfigGameMode**
