- pgno: 37
  md: '# Chapter 2: Programming with Blueprints


    This chapter presents the basic programming concepts used in Blueprints. Programming
    is essentially a way of writing instructions that will be understood and executed
    by a computer. Most programming languages are text-based, but Blueprint presents
    a different form of visual programming by using a node-based interface.


    Some programming languages are known as scripting languages when they exist in
    a special environment or when they have a well-defined purpose. For example, Blueprints
    is the visual scripting language of Unreal Engine.


    In this chapter, we will cover the following topics:


    +   - Storing values in variables

    +   - Defining the behavior of a Blueprint with events and actions

    +   - Creating expressions with operators

    +   - Organizing the script with macros and functions


    # Storing values in variables


    A variable is a programming concept. It consists of an identifier that points
    to a memory location where a value can be stored. For example, a character in
    a game may have variables to store the value of its health, its speed, and the
    quantity of ammunition.


    A Blueprint can have many variables of various types. The variables of a Blueprint
    are listed on the My Blueprint panel. Clicking the + button in the VARIABLES category
    creates a variable:'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_38_0.png)


    Figure 2.1 – Creating a variable


    The type of a variable defines the content that a variable can store.

    Blueprint is a strongly typed language. This means that you must define the

    variable type when creating the variable, and this type cannot be modified

    during program execution.


    When you create a variable, its attributes are displayed in the Details panel.

    The first attribute of a variable is its name, and the second attribute is its

    type. The various types are as follows:'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_39_0.png)


    # Figure 2.2 – Variable types'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Each type is represented by a color. These are the types of variables:


    +   - **Boolean**: Can only hold values of true or false.

    +   - **Byte**: This is an 8-bit number. It can store integer values between 0
    and 255.

    +   - **Integer**: This is a 32-bit number. It can store integer values between
    −2,147,483,648 and 2,147,483,647.

    +   - **Integer64**: This is a 64-bit number. It can store integer values between
    −9,223,372,036,854,775,808 and 9,223,372,036,854,775,807.

    +   - **Float**: This is a 32-bit floating-point number. It can store number values
    with fractional parts and has a precision of seven decimal digits.

    +   - **Double**: This is a 64-bit floating-point number. It can store number
    values with fractional parts and has a precision of 16 decimal digits.

    +   - **Name**: Piece of text used as an object identifier.

    +   - **String**: Can store a group of alphanumeric characters.

    +   - **Text**: This type is used for text that will be localized, meaning it
    allows for easier implementation of translation into different languages.

    +   - **Vector**: Contains the X, Y, and Z float values, which represent a 3D
    vector.

    +   - **Rotator**: Contains the X (Roll), Y (Pitch), and Z (Yaw) float values,
    which represent a rotation in 3D space.

    +   - **Transform**: Can store location, rotation, and scale.


    There are also other types of variables related to **Structure**, **Interface**,
    **Object Types**, and **Enum**. We will learn about these types in the upcoming
    chapters.


    The following screenshot shows the **Details** panel with the attributes that
    can be modified in **VARIABLE**:'
  merge: -1
  img_proc: true
