- pgno: 425
  md: '+   - **Resolution Scale**: This setting causes the engine to render the game
    in a lower resolution than the resolution that your player will be targeting and
    uses software to upscale the game to the targeted resolution. This improves the
    performance of the game, at the cost of perceived fuzziness at lower-resolution
    scales.


    +   - **View Distance**: This determines the distance from the location of the
    camera where objects will be rendered. Objects beyond this distance will not be
    rendered. Shorter view distances increase performance but can cause objects to
    pop into view suddenly as they cross the view distance boundary.


    +   - **Anti-Aliasing**: This setting softens the jagged edges of 3D objects in
    the world, which can dramatically improve the look of your game. At the higher
    settings, you will see fewer jagged edges, but this will decrease performance.


    +   - **Post Processing**: This setting changes the baseline quality settings
    of several filters that get applied to the screen after the scene is created,
    such as motion blur and light bloom effects.


    +   - **Shadows**: This changes the base quality of several bundled settings that
    combine to determine the look of shadows in the game. Highly detailed shadows
    often have a dramatic impact on performance.


    +   - **Textures**: This setting will affect the process by which the textures
    used in your game are managed by the engine. If you have many large textures in
    your game, reducing this setting can help avoid running out of graphics memory
    and thus increases performance.


    +   - **Effects**: This setting changes the baseline quality settings of several
    special effects applied to the game, such as material reflections and translucency
    effects.


    +   - **Foliage**: This setting will affect the quality of foliage used in the
    game.


    +   - **Shading**: This setting will affect the quality of the materials.'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'Ultimately, the best way of optimizing the performance of your game is to regularly
    test it on the machines you intend for people to play it on. If you notice sluggish
    performance, take note of where you see it occur. If the performance of your game
    is always low, you might need to reduce some of the postprocessing or anti-aliasing
    effects. If performance is low only in certain areas of your level, you might
    need to look at reducing the object density in that area or reducing the quality
    of a particular game model.


    Now that we know how to adjust the graphics settings, let''s customize some project
    settings before the build.


    # Setting up our game to be played by others


    Unreal Engine 5 offers a wide variety of platforms that you can choose from to
    build your game, and this list will continue to expand as newer versions of the
    engine are released and new technologies emerge. You can deploy your game on Windows,
    macOS, iOS, Android, and Linux. The engine supports the creation of content for
    various virtual reality platforms, such as Oculus Quest. There is also support
    for 8th and 9th generation consoles, but you need to be a registered console developer
    with the appropriate development kit.


    Each platform has its own unique requirements and best practices associated with
    it for game development. Mobile games have higher optimization requirements to
    get games to perform well.


    We can customize some of the settings that will determine how our project appears
    on the target machine.


    Follow these steps to customize the project settings:


    +   1. Click on the Settings button in the Level Editor toolbar, and then click
    on Project Settings..., as shown here:'
  merge: -1
  img_proc: true
