    # Updating the health meter


    The health meter bar is linked to the **Player Health** variable of the `FirstPersonCharacter`
    blueprint. We will use **Event AnyDamage** to decrease the value of the **Player
    Health** variable.


    These are the steps to create **Event AnyDamage**:


    +   1. In the content browser, access the `Content/FirstPersonBP/Blueprints` folder
    and double-click on the `FirstPersonCharacter` blueprint.


    +   2. Right-click on the empty space of **Event Graph** and add the **Event AnyDamage**
    node. We will add these nodes to the Event:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_356_0.png)


    Figure 10.6 – The Event AnyDamage actions


    +   3. Drag a wire from the white output pin of the **Event AnyDamage** node and
    add a **SET Player Health** node.'
  merge: -1
  img_proc: true
- pgno: 357
  md: '4. Drag a wire from the input pin of SET Player Health and add a MAX (float)
    node. We use this node to ensure that Player Health will never be less than 0.0.

    5. Drag a wire from the top input pin of the Max (float) node and create a Subtract
    node.

    6. Drag a wire from the top input pin of the Subtract node and add a GET Player
    Health node.

    7. Drag a wire from the bottom input pin of the Subtract node and connect to the
    Damage output pin of Event AnyDamage.

    8. Compile, save the blueprint, and press the Play button to test.


    Note that the player''s health meter depletes when an enemy gets within range
    of the player and attacks.


    Now that our enemy is attacking the player, we want to give more options on how
    the enemy can detect the player.


    # Making enemies hear and investigate sounds


    Enemies that can only pursue players who walk directly in front of them can easily
    be avoided. To address this, we will take advantage of the PawnSensing component
    to have the enemy detect nearby sounds that the player makes. If the player makes
    a sound within the detection range of an enemy, then the enemy will walk to the
    location of that sound to investigate. If they catch the player in their sight,
    they will try to attack; otherwise, they will wait at the location of the sound
    for a moment before returning to their patrol.


    # Adding hearing to the Behavior Tree


    We will add a sequence of tasks that occur when the enemy hears a sound. We want
    the enemy to continue attacking the player once they see them, so'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'investigating a sound has a lower priority on the Behavior Tree.


    To have the enemy investigate the point where it heard a sound, we will need to
    create two keys within the blackboard. The `HasHeardSound` key is of the Boolean
    type and will be used to store whether a sound has been heard. The `LocationOfSound`
    key is of the `Vector` type and will be used to store the location that the sound
    came from – hence, the location that the enemy AI should investigate.


    Follow these steps to create the blackboard keys and add the **Investigate Sound**
    sequence node to the Behavior Tree:


    +   1. In the content browser, access the `Content/FirstPersonBP/Enemy` folder
    and double-click on the `BT_EnemyBehavior` asset to open the Behavior Tree Editor.


    +   2. Click the **Blackboard** tab:


