- pgno: 157
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_157_0.png)


    Figure 5.19 – The cylinder turns red if something hits it


    In the next section, we will look at how to improve the `BP_CylinderTarget` Blueprint.


    # # Improving the Blueprint


    When we run the game, we see that the Cylinder target changes colors upon being
    hit by a projectile fired from the player''s gun. This is the beginning of a framework
    of gameplay that can be used to get enemies to respond to the player''s Actions.
    However, you might also have noticed that the target Cylinder changes color, even
    when the player runs into it directly. Remember that we wanted the Cylinder target
    to turn red only when hit by a'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'player projectile and not due to any other object colliding with it.

    Unforeseen results such as these are common whenever scripting is

    involved, and the best way to avoid them is to check your work by playing

    the game as often as possible when you are constructing it.


    To fix our Blueprint so that the Cylinder target only changes color in

    response to a player projectile, return to the **BP_CylinderTarget** tab and

    look at the **Event Hit** node again.


    The remaining output pins on the **Event Hit** node are variables that store

    data about the event that can be passed to other nodes. The color of the pins

    represents the type of data variable they pass. Blue pins pass objects, such

    as Actors, whereas red pins contain a Boolean (`true` or `false`) variable.


    The blue output pin, labeled **Other**, contains a reference to the other Actor

    that hit the Cylinder target. This is useful for us to ensure that the Cylinder

    target changes color only when hit by a projectile fired from the player,

    rather than changing color because of any other Actors that might bump

    into it.


    Let''s do a change to ensure that we are only triggering the Cylinder target in

    response to a player projectile hit. Drag the **Event Hit** node to the left to

    make room for another node, and then click and drag a wire from the **Other**

    output pin to an empty space. In the context menu, type `projectile`. You

    should see some results that look like the following screenshot. The node

    we are looking for is called **Cast To FirstPersonProjectile**:'
  merge: -1
  img_proc: true
- pgno: 159
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_159_0.png)


    # Figure 5.20 – Adding the Cast To node


    FirstPersonProjectile is a Blueprint included in Unreal Engine 5’s **First Person**
    template, which controls the behavior of the projectiles that are fired from your
    gun. The `Cast` node is used to ensure that the Action attached to the execution
    pin of this node occurs only if the Actor hitting the Cylinder target is an instance
    of `FirstPersonProjectile`.


    When the node appears, you should already see a blue wire between the **Other**
    output pin of the **Event Hit** node and the **Object** pin of the casting node.
    Connect the white execution pin of **Event Hit** to the execution pin of the **Cast
    To FirstPersonProjectile** node, and connect the output execution pin of the **Cast
    To FirstPersonProjectile** node to the execution pin of the **Set Material** node:'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_160_0.png)


    # Figure 5.21 – The Event Hit Actions


    Now, compile, save, and click on the **Play** button to test the game again.

    This time, you should notice that the Cylinder target retains its default color

    when you walk up and touch it, but if you move away and shoot it, it turns

    red.


    We learned how to use the **Cast To FirstPersonProjectile** node to ensure

    that some Actions will only be performed if the instance interacting with

    the Blueprint is of a specific class. In the next section, we will make our

    Cylinder target move in the Level.


    # Adding movement


    Now that we have a target that responds to the player shooting, we can add

    some sort of challenge to start making our project feel like a game. A

    simple way to do this is to add some movement to our target. To accomplish

    this, we first must declare that our target Actor is an object that is intended

    to move, and then we need to set up logic within the Blueprint that manages

    how it moves. Our goal is to make the target Cylinder move back and forth

    across our Level.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# # Changing the Actor''s Mobility and Collision settings


    To allow our target to move, we first must change its Mobility setting to Moveable.
    This allows an Actor to be manipulated while playing the game. To do this, follow
    these steps:


    # ## Important Information


    By default, basic Actors that are placed in the world are set to Static. Static
    means that an object cannot move or be manipulated during gameplay. Static objects
    are significantly less resource-intensive to render, and this should be our default
    choice for non-interactive objects so that we can maximize frame rates.


    +   1. Open BP_CylinderTarget again. On the Components panel, select Static Mesh
    Component. On the Details panel, switch the Mobility toggle, located underneath
    the TRANSFORM properties, from Static to Movable:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_161_0.png)


    Figure 5.22 – Changing Mobility to Movable'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'Because we want to target this object with our gun, we also need to ensure
    that the target is capable of being collided with so that our bullets don''t pass
    through it.


    2. In the Details panel, find the category called COLLISION and look for Collision
    Presets in the drop-down menu. There are many other options in this drop-down,
    and by choosing the Custom option, you can even set the object''s Collision interaction
    with different object types individually. For our purpose, we just need to ensure
    that this drop-down menu is set to BlockAllDynamic:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_162_0.png)


    Figure 5.23 – The collision presets must be BlockAllDynamic


    # # Breaking down our goal


    Now that we have made our target moveable, we are ready to set up Actions that
    tell the Cylinder how to move. To move the Cylinder, we need four pieces of data:


    +   • Where is the Cylinder currently located?'
  merge: -1
  img_proc: true
- pgno: 163
  md: '+   - What direction it is supposed to move in?

    +   - How fast it should move?

    +   - When should it switch between directions?


    We will get the current location by using a function that returns the coordinates
    of the Cylinder in the world. The speed, direction, and time to change direction
    are the values we are providing to the Blueprint, but some calculations are necessary
    to turn those values into information that the Blueprint can use to move the object.


    Follow these steps:


    +   1. In the **My Blueprint** panel, create a variable named `speed`. This variable
    will hold a number that represents the speed of movement of `BP_CylinderTarget`.
    In the **Details** panel, change **Variable Type** to **Float** and check the
    **Instance Editable** attribute:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_163_0.png)


    Figure 5.24 – The Speed variable


    +   2. Compile the Blueprint to be able to set the default value. Set **DEFAULT
    VALUE** to 200.0:'
  merge: -1
  img_proc: true
- pgno: 164
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_164_0.png)


    Figure 5.25 – The default value of the Speed variable


    +   3. In the **My Blueprint** panel, create another **Float** variable named
    `TimeToChange`. Check the **Instance Editable** attribute. Compile the Blueprint
    and set **DEFAULT VALUE** to `5.0`. This means the Cylinder will change direction
    after 5 seconds:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_164_1.png)


    Figure 5.26 – The TimeToChange variable'
  merge: -1
  img_proc: true
- pgno: 165
  md: '4. In the My Blueprint panel, create another variable named Direction. In the
    Details panel, change Variable Type to Vector and check the Instance Editable
    attribute:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_165_0.png)


    # Figure 5.27 – The Direction variable of the Vector type


    5. A vector contains the X, Y, and Z float values. Compile the Blueprint and set
    DEFAULT VALUE to 1.0 for the Y axis. This means it will follow the Y axis in the
    positive direction:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_165_1.png)'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Readying direction for calculations


    Now, let''s explore the steps necessary to get the information we need to provide
    a movement instruction. It might look intimidating at first, but we will break
    down each section and see how each node fits into the larger goal.


    The first calculation we need to perform is to take our vector value for direction
    and normalize it. Normalizing is a common procedure in vector math that ensures
    that the vector is converted to a length of 1 unit, which makes it compatible
    with the rest of our calculations. Fortunately, there is a Blueprint node that
    takes care of this for us:


    +   1. Drag the `Direction` variable from the **My Blueprint** panel and drop
    it into the EventGraph. Choose the **Get Direction** option to create a node.


    +   2. Drag from the output pin of the **Direction** node and drop in the graph
    to open the context menu. Search for `normalize` and select the **Normalize**
    node underneath the category labeled **vector**. This connects our **Direction**
    variable to a node that automatically does the normalizing calculation for us:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_166_0.png)'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Figure 5.29 – Normalizing a vector


    # Important Information


    It is good practice to leave comments on the sets of Blueprints as you create
    them. Comments can help describe what a particular set of Blueprints is intended
    to accomplish, which can be helpful if you are returning to a Blueprint after
    some time and need to make sense of your prior work. To leave a comment on a Blueprint,
    click and drag a selection box around the nodes you want to create a comment around
    so that you can select them. Then, right-click on one of the selected nodes and
    select the bottom option, **Create Comment from Selection**.


    # Getting relative speed using delta time


    **Delta time** is the time difference between the previous frame that was drawn
    and the current frame. Delta time is used because the time taken between the frames
    of the gameplay can differ. By multiplying our speed value by delta time, we can
    ensure that the speed at which our object moves is the same, regardless of the
    game''s frame rate:


    +   1. Drag the **Speed** variable from the **My Blueprint** panel and drop it
    into the EventGraph. Choose the **Get Speed** option to create a node.

    +   2. Right-click in an empty space of the EventGraph to open the context menu
    and search for `delta`. Select the **Get World Delta Seconds** option.

    +   3. Drag from the output pin of the **Speed** node and drop it into an empty
    space. Type an asterisk (*) in the search field (Shift + 8 on most computers)
    and select the **Multiply** node:'
  merge: -1
  img_proc: true
- pgno: 168
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_168_0.png)


    Figure 5.30 – Adding the Multiply node


    +   4. Drag from the output pin of the **Get World Delta Seconds** node and drop
    in the other input pin of the **Multiply** node to multiply the two values, like
    this:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_168_1.png)


    Figure 5.31 – Multiplying speed with delta seconds


    # Updating location'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Now that we have a normalized vector direction and a speed value relative to
    time, we need to multiply these two values and add them to the current location:


    +   1. Drag from the output pin of the **Normalize** node and drop it into an
    empty space. Type an asterisk (*) in the search field and select the **Multiply**
    node.


    +   2. The previous step created a **Vector x Vector** node, but we need to multiply
    the vector with a float. So, right-click on the second input pin, hover over **Convert
    Pin...**, and select **Float**:'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_170_0.png)


    # Figure 5.32 – Converting a multiply input pin


    +   3. Connect the output pin of the Float x Float node to the Float input pin
    that we converted, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_171_0.png)


    # Figure 5.33 – Multiplying a vector with a float


    4. We will use **Event Tick** to update the location of the Cylinder. Right-click
    in an empty space of the EventGraph to open the context menu and search for `tick`.
    Select the **Event Tick** option.


    5. To move the Actor, we will use the **AddActorWorldOffset** node. This node
    has an input parameter named **Delta Location**, which is a vector representing
    the change of location of the Actor. Right-click to open the context menu, search,
    and add the **AddActorWorldOffset** node. Connect **Event Tick** to the **AddActorWorldOffset**
    node:'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_172_0.png)


    Figure 5.34 – Using Event Tick to update location


    +   6. Connect the output pin of the Vector x Float node to the Delta Location
    input pin. Completed, Event Tick looks like this:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_172_1.png)


    Figure 5.35 – All Actions of Event Tick


    In this section, we learned how to use a normalized vector, delta time, and speed
    to move our Cylinder target. Compile the Blueprint, save, and play the game now.
    Note that the Cylinder target moves according to the defined speed and direction
    as soon as the game begins. However, since we don’t have any instructions that
    cause the target to stop moving, it will proceed in'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'the same direction for as long as the game runs, even moving through objects
    and out of the Level we created. To avoid this problem, in the next section, we
    will make the Cylinder target change its direction periodically.


    # # Changing direction


    In this section, we will implement the logic to change the target''s direction
    periodically. This will result in a target that moves back and forth between two
    points regularly, much like a shooting gallery target:


    +   1. Right-click in an empty space of the EventGraph to open the context menu
    and search for `custom event`. Select the **Add Custom Event** option. Rename
    the event `ChangeDirection`:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_173_0.png)


    Figure 5.36 – Creating a custom event


    +   2. We are going to invert the **Direction** vector by multiplying it by -1:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_173_1.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'Figure 5.37 – Invert the direction of a vector by multiplying it by -1


    +   3. Drag the **Direction** variable from the **My Blueprint** panel and drop
    it into the EventGraph. Choose the **Get Direction** option to create a node.


    +   4. Drag from the output pin of the **Direction** node and drop it into an
    empty space. Type an asterisk (*) in the search field and select the **Multiply**
    node.


    +   5. The previous step created a **Vector x Vector** node, but we need to multiply
    the vector with a float. So, right-click on the second input pin, hover over **Convert
    Pin...**, and select **Float**. Insert `-1` in the **Float** parameter.


    +   6. Drag the `Direction` variable from the **My Blueprint** panel and drop
    it into the EventGraph. Now, choose the **Set Direction** option to create a node.
    Connect the **Set Direction** node to the output pin of the **Multiply** node
    and the **ChangeDirection** event. This completes the **ChangeDirection** event.


    +   7. We will use a **timer** to run the **ChangeDirection** event periodically.
    Right-click in an empty space of the EventGraph to open the context menu and search
    for `timer_event`. Select the **Set Timer by Event** option. Check the **Looping**
    parameter:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_174_0.png)'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Figure 5.38 – Adding the Set Timer by Event node


    +   8. Right-click to open the context menu and add Event BeginPlay.

