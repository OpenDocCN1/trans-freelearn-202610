- pgno: 327
  md: "# # Teaching our AI to walk with the Behavior Tree\n\nBehavior Tree is a tool\
    \ used to model the behavior of characters. It has control flow nodes and task\
    \ nodes.\n\nThe two primary control flow nodes you will utilize are **Selector**\
    \ and **Sequence**. A **Selector** node runs each of the nodes connected underneath\
    \ it – called its **children** – from left to right, but it succeeds and stops\
    \ running as soon as one child successfully runs. Thus, if a **Selector** node\
    \ has three children, then the only way the third child node will run is if the\
    \ first two children failed to execute because the conditions attached to them\
    \ were `false`. A **Sequence** node is just the opposite. It also runs all the\
    \ children in a sequence from left to right, but the **Sequence** node only succeeds\
    \ if all the children succeed. The first child to fail causes the whole sequence\
    \ to fail, ending the execution and aborting the sequence.\n\nFollow these steps\
    \ to create our first Behavior Tree:\n\n+   1. In the content browser, double-click\
    \ the `BT_EnemyBehavior` asset to open the Behavior Tree Editor.\n+   \n+   2.\
    \ In the **Details** panel, click the **BEHAVIORTREE** category and select **BB_EnemyBlackboard**\
    \ as **Blackboard Asset**. The **KEYS** dropdown of **BB_EnemyBlackboard** will\
    \ appear in the **Blackboard** panel at the bottom:"
  merge: -1
  img_proc: true
- pgno: 328
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_328_0.png)


    # Figure 9.36 – Selecting the Blackboard asset used by the Behavior Tree


    +   3. Look at the **Behavior** Tree graph. The top level of the logic tree will
    always be the **ROOT** node, which simply serves to indicate where the logic flow
    will start. The darker line at the bottom of the Behavior Tree nodes is the connection
    point between nodes:'
  merge: -1
  img_proc: true
- pgno: 329
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_329_0.png)


    Figure 9.37 – The logic flow starts in the ROOT node


