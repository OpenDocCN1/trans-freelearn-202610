- pgno: 687
  md: '# # Epilogue


    I can''t believe we have reached the end of the book. This was an extensive project,
    and I consider this book as my definitive work on Blueprints. It''s been a long
    journey since I started programming games in the C language in 1993, when I was
    14 years old. My first games were in text mode, and they looked like the game
    ZZT by Tim Sweeney, founder of Epic Games.


    In 1999, I started the first game development company in the state of Pará, northern
    Brazil. The company name was RH Games. In 2001, I developed the MRDX, which is
    a framework for 2D game programming using the C/C++ languages. In 2002, I presented
    the MRDX at the first Brazilian Games Workshop. In 2003, I founded a local group
    called Beljogos, with the goal of encouraging the development of games in northern
    Brazil.


    In 2011, I started a blog named Romero UnrealScript, with the goal of teaching
    game programming with UnrealScript. Because of this blog, in June 2013, Epic Games
    invited me to be part of the Unreal Engine 4 closed beta program so I could have
    early access to Unreal Engine 4. I started the blog Romero Blueprints in March
    2014, when Unreal Engine 4 was launched.


    In August 2015, Epic Games awarded me an Unreal Engine Educational Dev Grant for
    the work that I had done in the Romero Blueprints blog to help people learn Unreal
    Engine 4 scripting. In 2016, I wrote the Blueprints Compendium for Epic Games,
    which was distributed to the public at the **Game Developer Conference (GDC)**.
    In June 2017, I finished writing the third volume of the Blueprints Compendium.


    In 2018, Epic Games hired me to write the official Blueprint Instructor Guide.
    In 2019, I wrote the book Blueprints Visual Scripting for Unreal Engine – Second
    Edition, published by Packt. In 2020, my project to teach C++ programming in Unreal
    Engine was selected for the Epic MegaGrants program. In August 2020, Epic Games
    invited me to a live stream named Teaching & Learning Blueprints with Marcos Romero,
    which is available on Unreal Engine''s YouTube channel.'
  merge: -1
  img_proc: true
