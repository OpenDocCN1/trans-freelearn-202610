  md: '# # Level Blueprint Communication


    Unreal Engine has a special type of Blueprint called **Level Blueprint**. Each
    Level of the game has a default Level Blueprint. They are useful for creating
    Events and Actions that only happen at the current level. To access the Level
    Blueprint, click the **Blueprints** button at the toolbar of the Level Editor
    and choose the **Open Level Blueprint** option, as shown in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_119_0.png)


    Figure 4.20 – Opening Level Blueprint


    In the Level Blueprint, we can easily create references to Actors that are on
    the Level. To see this in practice, let''s create an example where **Box Trigger**
    is added to the Level. When an Actor overlaps the trigger, **Blueprint_Effect_Sparks**
    is activated, producing the effect of a spark:'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   1. Create or use an existing project based on the Third Person template
