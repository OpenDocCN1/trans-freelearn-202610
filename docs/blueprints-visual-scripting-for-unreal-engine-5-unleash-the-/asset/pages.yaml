    To be able to change the Variants during runtime, the `VariantSet` asset was dropped
    in the level to create `Level Variant Sets Actor`.


    The Product Configurator template is very flexible. You just need to learn to
    use the Variant Manager panel and import your Static Meshes to create your own
    Product Configurator.


    In the next section, we will analyze the `BP_Configurator` Blueprint. You do not
    need to know how it works to use the Product Configurator, but it is a great opportunity
    to see advanced Blueprint techniques in practice.


    # The BP_Configurator Blueprint


    The Product Configurator template has a Blueprint named `BP_Configurator` that
    uses the data of a Level Variant Set to create an interface using UMG Widget Blueprints.
    This is a very interesting Blueprint to study because we will see several Blueprint
    concepts being used together.


    There is an instance of `BP_Configurator` on the level that you can select in
    the **Outliner** panel. In the **Details** panel, under the **Default** category,
    there are two instance-editable variables. The `LVSActor` variable is a reference
    to the **Level Variant Sets Actor**, and `Camera Actor` is a reference to the
    camera used to visualize the Product:'
