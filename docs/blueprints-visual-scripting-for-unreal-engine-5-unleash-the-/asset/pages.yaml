- pgno: 394
  md: '# # Creating round-based scaling with saved games


    We now have a game that supports a full play experience. However, the gameplay
    experience is limited by the number of enemies we have set as our target goal.
    This results in the game feeling shallow. To address this, we can adopt techniques
    used by arcade games, which increase the difficulty of the game as the player
    progresses through a series of rounds. This is a way to add depth and fun to your
    game using the existing assets, without requiring you to spend hours creating
    custom content.


    The rounds we create will serve as the score of the player. The higher the round
    they reach, the more the player is thought to have achieved. To ensure that the
    maximum round the player reaches is limited only by their skill, rather than the
    amount of time for which they play the game in a single sitting, we will implement
    a save system so that the player can pick up from where they left off if they
    leave the game and come back to it later.


    # # Storing game information using the SaveGame class


    The first step we need to perform to create a save system is to create a Blueprint
    child of the `SaveGame` class that will store the game data that we want to save.
    We want to track which round the player was on before they quit the game. We do
    not need to store any data on how many enemies the player has killed because it
    would make more sense to the player for each game session to start at the beginning
    of a round.


    Follow these steps to create a child of the `SaveGame` class:


    +   1. In the **Content Browser**, access the Content|FirstPersonBP|Blueprints
    folder. Click the **Add** button and select **Blueprint Class**.'
  merge: -1
  img_proc: true
- pgno: 395
  md: '2. On the next screen, search for and select SaveGame as the parent class:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_395_0.png)


    Figure 11.5 – Selecting SaveGame as the parent class


    3. Name the Blueprint BP_SaveInfo and double-click it to open the Blueprint Editor.


    4. In the Variables category of the My Blueprint panel, click on the + button
    to add a variable. In the Details panel, name it Round, and change Variable Type
    to Integer. Compile the Blueprint, and then set Default Value to 1:'
  merge: -1
  img_proc: true
