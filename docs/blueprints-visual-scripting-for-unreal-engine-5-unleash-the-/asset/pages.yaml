- pgno: 292
  md: '# # Part 3: Enhancing the Game


    In this part, you will learn the basic **Artificial Intelligence (AI)** techniques
    required to create a smart enemy using Behavior Trees and Navigation Meshes. Additionally,
    new features will be added to the game in order to make it more interesting. We
    will also demonstrate how to build and publish a game.


    This part includes the following chapters:


    +   - Chapter 9, Building Smart Enemies with Artificial Intelligence

    +   - Chapter 10, Upgrading the AI Enemies

