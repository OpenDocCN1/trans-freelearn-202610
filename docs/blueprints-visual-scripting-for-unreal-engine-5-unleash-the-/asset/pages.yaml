    # # Game Instance


    **Game Instance** is not one of **Common Classes**, but it is important to know
    about the existence of this class. The **Game Instance** class and its data persist
    between Levels because an instance of the **Game Instance** class is created at
    the beginning of the game and is only removed when the game is closed.


    All Actors and other objects in a Level are destroyed and respawned each time
    a Level is loaded. So, the **Game Instance** class is an option to use if you
    need to preserve some variable values in the Level transition.'
  merge: -1
  img_proc: true
