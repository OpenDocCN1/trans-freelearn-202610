    +   5. Drag a wire from the Condition input pin of the Branch node and add a Less
    node.


    +   6. Drag a wire from the bottom input pin of the Less node and add a GET Hearing
    distance node.


    +   7. Right-click on the empty space of Event Graph and add a Get Controlled
    Pawn node to get the enemy instance that is being controlled by this BP_EnemyController.


    +   8. Drag a wire from the Return Value pin of the Get Controlled Pawn node and
