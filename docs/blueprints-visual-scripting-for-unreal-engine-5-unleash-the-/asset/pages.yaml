- pgno: 496
  md: 'Vectors are widely used in game programming; they can be used to indicate directions
    and to represent speed, acceleration, and a force acting on an object.


    In the next section, we will see another important concept used to interact with
    a 3D world, which is traces.


    # Introduction to traces and trace functions


    Traces are used to test whether there are collisions along a defined line segment.
    A trace can be done by channel or object type and can return the single or multiple
    objects that have been hit.


    The trace channels available are Visibility and Camera. The object type can be
    WorldStatic, WorldDynamic, Pawn, PhysicsBody, Vehicle, Destructible, or Projectile.
    You can create more channels and object types in Project Settings | Engine | Collision.


    Actors and components need to define how they react to each trace channel and
    object type. The response can be Ignore, Overlap, or Block.


    The following screenshot shows the collision responses of a Static Mesh actor.
    There are collision presets that can be selected, such as BlockAll, OverlapAllDynamic,
    and Pawn. Alternatively, you can choose Custom... for Collision Presets and define
    the Collision Responses properties individually. The object type is set via the
    Object Type property dropdown, while the Visibility and Camera channels are defined
    in the Trace Responses section of the Collision Responses table.'
  merge: -1
  img_proc: true
- pgno: 497
  md: '| Collision Presets | Custom... | ↻ |

    | :--- | :--- | :--- |

    | Collision Enabled | Query Only (No Physics Collision) | ↻ |

    | Object Type | WorldDynamic | |

    | | Ignore | Overlap | Block |

    | Collision Responses | | [ ] | [x] | [ ] |

    | Trace Responses | | | | |

    | Visibility | | [ ] | [x] | [ ] | ↻ |

    | Camera | | [ ] | [x] | [ ] | ↻ |

    | Object Responses | | | | |

    | WorldStatic | | [ ] | [x] | [ ] | ↻ |

    | WorldDynamic | | [ ] | [x] | [ ] | ↻ |

    | Pawn | | [ ] | [x] | [ ] | ↻ |

    | PhysicsBody | | [ ] | [x] | [ ] | ↻ |

    | Vehicle | | [ ] | [x] | [ ] | ↻ |

    | Destructible | | [ ] | [x] | [ ] | ↻ |


    Figure 14.24 – Collision Responses table


    When a trace function collides with something, it returns one or more **Hit Result**
    structures. The **Break Hit Result** node can be used to access the **Hit Result**
    variables, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 498
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_498_0.png)


    Figure 14.25 – Hit result structure variables


    These are some of the variables of the **Hit Result** structure:


    +   - **Blocking Hit**: A Boolean value that indicates whether the trace hit something

    +   - **Location**: The location of the hit'
  merge: -1
  img_proc: true
- pgno: 499
  md: '+   * Impact Normal: The normal vector that is perpendicular to the surface
    that was hit

    +   * Hit Actor: The reference to the actor hit by the trace


    In the next sections, we will see the trace functions available in Blueprint.


    # Traces for objects


    The LineTraceForObjects function tests for collisions along a defined line and
    returns a Hit Result structure with data for the first actor hit that matches
    one of the Object Types values specified in the input parameter.


    The MultiLineTraceForObjects function has the same input parameters as the LineTraceForObjects
    function. The difference between the functions is that the MultiLineTraceForObjects
    function returns an array of Hit Result structures describing all actors hit by
    the trace, rather than a single result, making it more expensive to perform. The
    following screenshot shows the two TraceForObjects functions:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_499_0.png)


    Figure 14.26 – TraceForObjects functions'
  merge: -1
  img_proc: true
- pgno: 500
  md: 'These are the input parameters of the two TraceForObjects functions:


    +   - **Start**: The location vector that defines the start of the line to be
    used for the collision test.

    +   - **End**: The location vector that defines the end of the collision test
    line.

    +   - **Object Types**: An array that contains object types that will be searched
    with the trace. The trace will ignore all objects of any other types.

    +   - **Trace Complex**: A Boolean value. If it is True, then the trace will test
    against the actual Mesh. If it is False, then the trace will test against simplified
    collision shapes.

    +   - **Actors to Ignore**: An array with actors that should be ignored in the
    collision tests.

    +   - **Draw Debug Type**: This allows the drawing of a 3D line that represents
    the trace.

    +   - **Ignore Self**: A Boolean value that indicates whether the Blueprint instance
    that is calling the function should be ignored in the collision test.


    There are other line trace functions that use Trace Channel instead of Object
    Types, as we will see in the next section.


    # # Traces by channel


    The LineTraceByChannel function tests for collisions along a defined line using
    Trace Channel, which can be set to Visibility or Camera, and returns a Hit Result
    structure with data for the first actor hit in the collision test. There is also
    the MultiLineTraceByChannel function, which returns an array of Hit Result structures
    describing all actors hit by the trace.'
  merge: -1
  img_proc: true
- pgno: 501
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_501_0.png)


    Figure 14.27 – TraceByChannel functions


    The input parameters of these functions are as follows:


    +   • **Start**: The location vector that defines the start of the line to be
    used for the collision test.

    +   • **End**: The location vector that defines the end of the collision test
    line.

    +   • **Trace Channel**: A channel used for the collision test. It can be **Visibility**
    or **Camera**. The trace will search for objects that overlap or block the trace
    channel selected.

    +   • **Trace Complex**: A Boolean value. If it is **True**, then the trace will
    test against the actual Mesh. If it is **False**, then the trace will test against
    simplified collision shapes.

    +   • **Actors to Ignore**: An array with actors that should be ignored in the
    collision tests.

    +   • **Draw Debug Type**: This allows the drawing of a 3D line that represents
    the trace.

    +   • **Ignore Self**: A Boolean value that indicates whether the Blueprint instance
    that is calling the function should be ignored in the collision'
  merge: -1
  img_proc: true
- pgno: 502
  md: 'A line trace is not the only type of trace function. You can also use shapes
    to do traces.


    # Shape traces


    There are trace functions for the sphere, capsule, and box shapes, but these functions
    are more expensive to perform than line traces.


    The following screenshot shows the SphereTraceForObjects, CapsuleTraceForObjects,
    and BoxTraceForObjects functions:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_502_0.png)


    Figure 14.28 – Shape trace functions


    For all these shapes, there are functions to trace by channel and object type.
    There are also functions that return a single hit or multiple hits.


    # Debug lines


    The trace functions have an option to draw debug lines that help when testing
    traces. Click on the small arrow at the bottom of the trace functions'
  merge: -1
  img_proc: true
- pgno: 503
  md: 'to display the Trace Color, Trace Hit Color, and Draw Time parameters, as shown
    in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_503_0.png)


    Figure 14.29 – Debug line options


    The Draw Debug Type parameter can be set to one of the following values:


    +   - **None**: Don''t draw the line.

    +   - **For One Frame**: The line only appears for one frame.

    +   - **For Duration**: The line stays for the time specified in the **Draw Time**
    parameter.

    +   - **Persistent**: The line does not disappear.


    Debug lines are useful to find the problem when the traces are not acting as expected.


    # # Example of vectors and trace nodes


    Let''s do an example to see the use of vectors and trace nodes. We will modify
    the `Player` Character to use a line trace to find and toggle the light of another
    Blueprint:'
  merge: -1
  img_proc: true
- pgno: 504
