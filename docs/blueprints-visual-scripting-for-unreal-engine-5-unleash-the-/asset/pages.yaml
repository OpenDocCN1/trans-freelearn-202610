    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_526_0.png)


    Figure 15.23 – List of events in the EventGraph


    A complex Blueprint can have many variables. There are two variable properties,
    named Tooltip and Category, which help you identify and organize variables. These
    properties are found in the Details panel of a variable, as shown in the following
    screenshot:'
  merge: -1
