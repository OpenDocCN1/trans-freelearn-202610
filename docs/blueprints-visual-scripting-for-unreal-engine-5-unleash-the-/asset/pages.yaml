    # Adding conditions to the Behavior Tree


    We will need another Sequence node that will connect to tasks to get the enemy
    to chase the player and a Selector node that will run one of the two Sequence
    nodes. We need to ensure that the new Tasks only run when the enemy sees the player.
    To do this, we''ll add a Decorator. A Decorator attaches to the top of a node
    and provides conditions that must be met before the Tasks can be performed.


    The following screenshot shows the updated version of our Behavior Tree after
    the changes in this section. The Tasks of the Attack Player sequence will be added
    in the next section:'
