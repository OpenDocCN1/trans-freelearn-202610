    Figure 20.5 – The Level Variant Sets of the template


    +   2. The Variant Sets and the Variants are listed on the left. In the next screenshot,
    we can see that **Body Shape** is a Variant Set with three Variants: **Strat Type**,
    **I Type**, and **V Type**. Click on **I Type** to see its properties:'
