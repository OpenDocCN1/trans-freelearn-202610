    # ## Summary


    In this chapter, we started on the path of creating a challenging but balanced
    game experience by enhancing the capabilities of our AI-driven enemies. We gave
    our enemies zombie-like behavior by allowing them to wander aimlessly around the
    level until noticing the player by sight or sound. We also gave them the ability
    to charge forward when they notice the player and launch a melee attack, lowering
    the player''s health. Then, we gave the player the chance to fight back by attacking
    the enemy, eventually destroying them once the enemy''s health is depleted. Finally,
    we gave new'
  merge: -1
