- pgno: 307
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_307_0.png)


    Figure 9.16 – Press the P key to toggle the NavMesh visibility on and off


    With our play area and NavMesh now set up, we can return our focus to creating
    the enemy and its AI.


    # Creating the AI assets


    We need to create assets of four types that will work together to manage the behavior
    of our enemy:


    +   • Character: A blueprint class that represents the enemy character in the
    level.

    +   • AI Controller: A blueprint class that serves as a connection between the
    character and the Behavior Tree. It routes the information and actions that are
    generated within the Behavior Tree to the character, which will enact those actions.

    +   • Behavior Tree: A Behavior Tree is the source of the decision-making logic
    that will instruct our enemy on what conditions should cause it to'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'perform which actions.


    +   - **Blackboard**: A Blackboard is a container for all the data used in the
    decision-making that is shared between the AI controller and the Behavior Tree.


    These are the steps to create the four assets:


    +   1. In the content browser, access the `/Content/FirstPersonBP/` folder. Right-click
    in the empty space next to the list of folders and select the **New Folder** option.
    Name the new folder `Enemy`.


    +   2. Open the `Enemy` folder you created, and then right-click in the empty
    folder space and select **Blueprint Class**.


    +   3. Open the **ALL CLASSES** group at the bottom of the popup and type `ASP_`
    into the search bar. Select the `Ue4ASP_Character` class to create a new character
    Blueprint. This is the base character class from **Animation Starter Pack** that
    we added to the project at the beginning of the chapter:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_308_0.png)


    # Figure 9.17 – Selecting the parent class of the EnemyCharacter Blueprint


    +   4. Rename the Blueprint `BP_EnemyCharacter`.'
  merge: -1
  img_proc: true
- pgno: 309
