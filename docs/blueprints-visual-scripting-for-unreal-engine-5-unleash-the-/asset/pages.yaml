- pgno: 540
  md: '# Chapter 16: Introduction to VR Development


    This chapter explains several **Virtual Reality (VR)** concepts and explores the
    VR template. As VR headsets are becoming more affordable, the number of users
    is increasing fast. Therefore, the demand for VR games and business applications
    is rising as well. We will focus on the Blueprints of the VR template. This will
    be another opportunity to see Blueprint nodes being used in practice. You will
    be able to use some Blueprint concepts from this chapter in several other types
    of projects, so this is a useful chapter even if you do not have a VR headset.


    In this chapter, we will analyze the functionality of the **VRPawn** Blueprint
    of the VR template. We will explain how to create objects that can be grabbed
    by the player using motion controllers, and we will learn about the Blueprint
    functions used to implement teleportation and how to use interfaces for Blueprint
    Communication. We will also see how the menu works in the VR template.


    These are the topics we will cover in this chapter:


    +   - Exploring the VR template

    +   - The **VRPawn** Blueprint

    +   - Teleportation

    +   - Object grabbing

    +   - Blueprint Communication using interfaces

    +   - Interacting with the menu


    By the end of the chapter, you will understand how the VR template works and will
    know how to create interfaces to allow different Blueprints to share data with
    each other.'
  merge: -1
  img_proc: true
- pgno: 541
  md: '# Exploring the VR template


    The Unreal Engine Editor has a Blueprint VR template that makes it easy to start
    experimenting with VR development. The VR template uses the OpenXR framework,
    which is an open standard for VR and augmented reality development. Because of
    OpenXR, the VR template works on multiple devices without any platform-specific
    modification.


    The VR template is in the GAMES category. The following screenshot shows the creation
    of a project using the VR template:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_541_0.png)


    Figure 16.1 – Selecting the VR template


    The next screenshot shows the VR template map with a ball, weapons, and cubes
    that can be grabbed by the user:'
  merge: -1
  img_proc: true
- pgno: 542
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_542_0.png)


    Figure 16.2 – The VR template map


    If there is a VR display device installed on your computer and set up for development,
    then you can launch the Level in VR by clicking on the dropdown of the **Play**
    button and selecting **VR Preview**. If you don''t have a VR display device, you
    can launch the Level by using the **New Editor Window** option of the **Play**
    button and pressing the *Tab* key to toggle Spectator Mode. You will be able to
    move around the Level using the *W, A, S,* and *D* keys and the mouse.


    In VR Mode, you can teleport to different locations in the Level by pressing up
    on the right motion controller''s thumbstick to mark a location and releasing
    the thumbstick to execute the teleport. Some objects in the Level can be grabbed.
    To grab an object, bring the motion controller closer to the object and hold the
    grip button. To drop the object, release the grip button.


    The Blueprints used in the template are in the **Content > VRTemplate > Blueprints**
    folder. Let''s learn about how they work to make it easier to adapt them to our
    projects. Also, this will be an excellent opportunity to see practical examples
    of Blueprints.


    # The VRPawn Blueprint'
  merge: -1
  img_proc: true
- pgno: 543
  md: 'The **VRPawn** Blueprint represents the user in the Level. This Blueprint contains
    the logic for input events from the motion controllers, which are the physical
    devices that the user holds to interact in VR.


    The following screenshot shows the **Components** panel of the **VRPawn** Blueprint:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_543_0.png)


    Figure 16.3 – The VRPawn components


    **MotionControllerRight** and **MotionControllerLeft** are *Motion Controller*
    components that track motion controller devices. When you move the motion controller
    device, the data of this movement is sent to the *Motion Controller* component.


    The **Camera** component is the user view. There is a *Static Mesh* component
    named **HMD** to visually represent the head-mounted display in the Level. When
    using the spectator camera, we can see a representation of the user because of
    the **HMD** and *Motion Controller* components:'
  merge: -1
  img_proc: true
- pgno: 544
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_544_0.png)


    Figure 16.4 – A user representation in the VR template


    Another component in VRPawn is TeleportTraceNiagaraSystem, which is a Niagara
    particle system component used to represent the teleport trace.


    Then, we have another pair of Motion Controller components. The VR template uses
    these extra components as a simple way to get the aim locations. By default, the
    Motion Controller component uses the grip location, but you can change Motion
    Source in the Details panel. The next screenshot shows the properties of MotionControllerRightAim.
    The Display Device Model property is unchecked so that this Motion Controller
    component is not displayed in the Level:'
  merge: -1
  img_proc: true
- pgno: 545
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_545_0.png)


    # Figure 16.5 – The properties of MotionControllerRightAim


    The last component left to mention is the Widget Interaction component. It works
    like a laser pointer and is used to interact with the Widget menu, which is activated
    by pressing the Menu button on the motion controller:'
  merge: -1
  img_proc: true
- pgno: 546
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_546_0.png)


    Figure 16.6 – Interacting with the Widget menu


    In the EventGraph of **VRPawn**, there are several input events from motion controllers,
    which we will see in detail in the _Teleportation_ and _Object grabbing_ sections.


    # # Teleportation


    In this section, we’ll see the event and functions used in teleportation.


    To start the teleport, press up on the right motion controller’s thumbstick to
    mark a location. When you release the thumbstick, you will teleport to the marked
    location. The teleport destination is represented by the **VRTeleportVisualizer**
    Blueprint:'
  merge: -1
  img_proc: true
- pgno: 547
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_547_0.png)


    Figure 16.7 – The VRTeleportVisualizer Blueprint


    The input event used for teleportation is **InputAxis MovementAxisRight_Y**. The
    first nodes of the event check whether **Axis Value** is positive, which means
    the thumbstick was pressed up, and check whether **Axis Value** is greater than
    the deadzone, which is a minimum **Axis Value** to start the teleport:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_547_1.png)


    Figure 16.8 – The first nodes of InputAxis MovementAxisRight_Y


    The next screenshot shows the nodes connected to the **True** output of the **Branch**
    node of *Figure 16.8*. The **Do Once** node is used to ensure that the **Start
    Teleport Trace** function will not run again while the teleport trace is active.
    The **Teleport Trace** function keeps updating the destination while the user
    presses up on the thumbstick:'
  merge: -1
  img_proc: true
- pgno: 548
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_548_0.png)


    Figure 16.9 – Activating the teleport trace


    The following screenshot shows the nodes connected to the **False** output of
    the **Branch** node of *Figure 16.8*, which means that the user is not pressing
    up on the right motion controller''s thumbstick. If the teleport trace was active,
    then the event ends the teleport trace and tries to teleport to the destination.
    The **Try Teleport** node connects to the **Reset** pin of the **Do Once** node:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_548_1.png)


    Figure 16.10 – Ending the teleport trace and teleporting


    Let''s analyze the **Start Teleport Trace**, **TeleportTrace**, **End Teleport
    Trace**, and **Try Teleport** functions used in teleportation.


    The **Start Teleport Trace** function sets `True` in the **Teleport Trace Active**
    Boolean variable, sets visibility as `True` in the **Teleport Trace Niagara System**
    component, and spawns an instance of **VRTeleportVisualizer**:'
  merge: -1
  img_proc: true
- pgno: 549
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_549_0.png)


    # Figure 16.11 – The Start Teleport Trace function


    The TeleportTrace function uses a function named Predict Projectile Path By Object
    Type to calculate Projected Teleport Location and Teleport Trace Path Positions.
    The following screenshot shows the last nodes of the TeleportTrace function, which
    update the TeleportVisualizer location and set the vector array used by the Niagara
    particle system component for teleport trace visual effects:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_549_1.png)


    # Figure 16.12 – The last nodes of the Teleport Trace function


    The End Teleport Trace function is the opposite of the Start Teleport Trace function.
    It sets the Teleport Trace Active Boolean variable as False, destroys the Teleport
    Visualizer instance, and hides the Teleport Trace Niagara System component:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_549_2.png)'
  merge: -1
  img_proc: true
- pgno: 550
  md: '# Figure 16.13 – The End Teleport Trace function


    The End Teleport Trace function uses a **Validated Get** node. When you have an
    **Object Reference Get** node, you can right-click it and select **Convert to
    Validated Get**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_550_0.png)


    # Figure 16.14 – Converting a Get node to a Validated Get node


    The original node is converted to a **GET** node with execution pins that can
    be used to check whether the object reference is valid:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_550_1.png)


    # Figure 16.15 – A GET node with branching execution pins


    The Try Teleport function checks whether **Valid Teleport Location** is **True**
    and then uses the **Teleport** function to teleport the user to the destination
    location:'
  merge: -1
  img_proc: true
- pgno: 551
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_551_0.png)


    Figure 16.16 – The Try Teleport function


    There is another type of movement in the VR template named **Snap Turn**. In this
    movement, you can rotate your virtual character by pressing left or right on the
    left motion controller’s thumbstick. The input event used for Snap Turn is **InputAxis
    MovementAxisLeft_X**.


    We saw the events and functions used for teleportation. In the next section, we
    will see how object grabbing works in the VR template.


    # # Object grabbing


    The object grabbing system is based on a **GrabComponent** Blueprint that was
    created for the VR template, which can be found in the `Content > VRTemplate >
    Blueprints` folder.


    **GrabComponent** is a child class of **SceneComponent**. For more information
    about Blueprint components, see _Chapter 18, Creating Blueprint Libraries and
    Components_.


    To make any Actor of the Level grabbable, add **GrabComponent** to the Actor and
    set **Mobility** to **Movable**:'
  merge: -1
  img_proc: true
- pgno: 552
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_552_0.png)


    Figure 16.17 – Making an Actor grabbable


    There is an enumeration named **Grab Type** that defines how the object attaches
    to the motion controller. For more information about enumeration, see _Chapter
    13, Data Structures and Flow Control_.


    You can set **Grab Type** in the **Details** panel of **GrabComponent**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_552_1.png)'
  merge: -1
  img_proc: true
- pgno: 553
  md: '# Figure 16.18 – Grab Type enumeration


    These are the grab types available:


    +   - **None**: Use this option when you want to disable grabbing without removing
    the `Grab` component of an Actor.

    +   - **Free**: The object attaches to the motion controller while maintaining
    its relative location and orientation to it. This type is best used for objects
    that don’t need to be held in a certain way to be used, such as the cubes in the
    VR template.

    +   - **Snap**: When picked up, the object snaps to a specific predefined location
    and rotation relative to the motion controller that grabbed it. This grab type
    is usually used for objects with a clear grip location, such as the weapons in
    the VR template.

    +   - **Custom**: This option allows the developers to create their own grab type.
    The `Grab` component has the `bIsHeld` Boolean variable and the `OnGrabbed` and
    `OnDropped` event dispatchers, which can be used to create custom logic.


    The events of **VRPawn** that deal with grabbing are **InputAction GrabLeft**
    and **InputAction GrabRight**, which are triggered by the grip button of the motion
    controllers. To grab an Actor on the Level, bring the motion controller closer
    to the Actor and hold the grip button. To drop the Actor, release the grip button.


    Let''s analyze the **InputAction GrabLeft** event. The following screenshot shows
    the first nodes of the event:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_553_0.png)'
  merge: -1
  img_proc: true
- pgno: 554
  md: '# Figure 16.19 – The first nodes of InputAction GrabLeft


    The **Get Grab Component Near Motion Controller** function uses a sphere trace
    to search for a nearby Actor. If an Actor is found, it checks whether it has **GrabComponent**.
    If it does, a reference to **GrabComponent** is returned.


    For more information about traces, see *Chapter 14, Math and Trace Nodes*.


    If no Actor was found or if the Actor found had no component of **GrabComponent**
    type, the **Nearest Component** output pin would return an invalid component (since
    there wasn’t any). Hence, the **Is Valid** node checks for the validity of the
    output. If the output is valid, the **Try Grab** function of **GrabComponent**
    is executed. This function disables the Actor physics if enabled and attaches
    the Actor to the motion controller. The **GrabComponent** reference is stored
    in the **Held Component Left** variable:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_554_0.png)


    # Figure 16.20 – Executing the Try Grab function of GrabComponent


    If the object grabbed was being held by the other hand, then the other hand needs
    to release the object. This is done by clearing the reference in the **Held Component**
    variable of the other hand:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_554_1.png)'
  merge: -1
  img_proc: true
- pgno: 555
  md: '# Figure 16.21 – Clearing the Held Component Right variable


    The next screenshot shows the nodes connected to the Release pin of the InputAction
    GrabLeft event. The Try Release function detaches the Actor from the motion controller.
    After that, the Held Component Left variable is cleared:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_555_0.png)


    # Figure 16.22 – Nodes executed when the user drops the Actor


    The user can interact with some grabbed Actors, such as the pistols, through Blueprint
    Interfaces.


    # Blueprint Communication using interfaces


    A Blueprint Interface is a special type of Blueprint that only contains function
    names and parameters. It is used to allow communication between different types
    of Blueprints.


    To create a Blueprint Interface, follow these steps:


    +   1. Click the Add button in the content browser, and in the Blueprints submenu,
    select Blueprint Interface:'
  merge: -1
  img_proc: true
- pgno: 556
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_556_0.png)


    Figure 16.23 – Creating a Blueprint Interface


    +   2. The VR template has a Blueprint Interface named VRInteraction BPI in the
    Content > VRTemplate > Blueprints folder. Double-click it to open the Blueprint
    Interface Editor. The following screenshot shows the functions of the VRInteraction
    BPI interface:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_556_1.png)'
  merge: -1
  img_proc: true
- pgno: 557
  md: '# Figure 16.24 – The VRInteractionBPI interface functions


    3. Open the **Pistol Blueprint** to see an example of an interface implementation.
    Click the **Class Settings** button of the Blueprint Editor. In the **Details**
    panel, go to the **Interfaces** category to see that the **VRInteraction BPI**
    interface was added to the **Pistol Blueprint**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_557_0.png)


    # Figure 16.25 – Adding an interface


    The **Pistol Blueprint** implemented the **Trigger Pressed** function of the **VRInteraction
    BPI** interface. Since the **Trigger Pressed** function does not have output parameters,
    it is implemented as an event:'
  merge: -1
  img_proc: true
- pgno: 558
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_558_0.png)


    Figure 16.26: Implementing a function of the interface


    +   4. In this event, the Pistol Blueprint spawns an instance of the Projectile
    Blueprint. The Trigger Pressed function is called by the VRPawn Blueprint in the
    InputAction TriggerLeft and InputAction TriggerRight events:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_558_1.png)


    Figure 16.27 – The VRPawn Blueprint calls the Trigger Pressed function of the
    interface


    The VRPawn Blueprint gets the Actor owner of GrabComponent and calls the Trigger
    Pressed function using the Actor owner reference. If the Actor has an implemented
    VRInteraction BPI interface, then Trigger Pressed is executed. Nothing happens
    if the Actor did not implement the VRInteraction BPI interface.


    In the next section, we will see how the user interacts with the menu in the virtual
    world.'
  merge: -1
  img_proc: true
- pgno: 559
  md: '# Interacting with the menu


    The VR template has a menu system that is activated by pressing the **Menu** button
    on the motion controller. The menu system is implemented by the **Menu Blueprint**
    and the **WidgetMenu Blueprint**. Both Blueprints are in the `Content > VRTemplate
    > Blueprints` folder.


    The events of VRPawn that deal with the menu are **InputAction MenuToggleLeft**
    and **InputAction MenuToggleRight**, which are triggered by the **Menu** button
    of the motion controllers. The **Menu** button is used to show and hide the menu.


    The next screenshot shows the **InputAction MenuToggleRight** event that executes
    the **Toggle Menu** function of VRPawn:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_559_0.png)


    Figure 16.28 – The InputAction MenuToggleRight event


    The **Toggle Menu** function checks whether the menu is active. In this case,
    it calls the **Close Menu** function of the **Menu Blueprint**. If the menu is
    not active, it spawns an instance of the **Menu Blueprint**:'
  merge: -1
  img_proc: true
- pgno: 560
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_560_0.png)


    # Figure 16.29 – The Toggle Menu function


    The **Menu Blueprint** is responsible for showing **WidgetMenu** attached to the
    motion controller and defining the interaction between them.


    Double-click **WidgetMenu** to open the UMG Editor:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_560_1.png)


    # Figure 16.30 – The WidgetMenu in the UMG editor


    In the **Graph** tab of the UMG Editor, we can see the **On Clicked** events of
    the buttons. The **On Clicked (RestartButton)** event uses the **Open Level**
    function to reload the Level:'
  merge: -1
  img_proc: true
- pgno: 561
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_561_0.png)


    Figure 16.31 – The On Clicked (RestartButton) event


    The ExitButton button has the Real Life label. The On Clicked (ExitButton) event
    uses the Quit Game function to exit the application:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_561_1.png)


    Figure 16.32 – The On Clicked (ExitButton) event


    If you want to add command buttons to the menu, you only need to modify the **WidgetMenu**
    Blueprints. For more information about UMG, see _Chapter 7, Creating Screen UI
    Elements_.


    We have analyzed the main elements used in the VR template, so it will now be
    easier to understand more complex parts of the VR template.


    # Summary'
  merge: -1
  img_proc: true
