- pgno: 209
  md: '# Chapter 7: Creating Screen UI Elements


    At the core of any gaming experience is the method game designers use to communicate
    the goals and rules of the game to the player. One method of doing this, which
    is common across all forms of games, is using a **Graphical User Interface (GUI)**
    to display and broadcast important information to the player. In this chapter,
    we will set up a GUI that will track the player''s health and stamina, and we
    will set up counters that display the targets eliminated and the ammo of the player.
    You will learn how to set up a basic **User Interface (UI)** using Unreal''s GUI
    Editor and how to use Blueprints to tie that interface to gameplay values. We
    will create UI elements using the **Unreal Motion Graphics (UMG) UI Designer**.


    In the process, we will cover the following topics:


    +   - Creating simple UI meters with the UMG

    +   - Connecting UI values to player variables

    +   - Tracking the ammo and eliminated targets


    By the end of the chapter, you will know how to use the UMG Editor to create progress
    bars that display the status of health and stamina and also know how to display
    the number of targets eliminated and the ammo of the player.


    # Creating simple UI meters with UMG


    In this section, we will learn how to use the UMG Editor to create the UI elements
    that we will use in our game and how to position them on the'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'screen.


    The UMG Editor is a visual UI authoring tool. We can use the UMG Editor to create
    menus and a **Heads-Up Display (HUD)**. A HUD is a transparent display that provides
    information without requiring the user to look away from the main view. It was
    initially developed for military aviation. The acronym HUD has become common in
    games because the information is displayed on the game screen. We want to show
    meters on the HUD with the amounts of health and stamina the player currently
    possesses. These meters that appear on the HUD are known as **UI meters**.


    The health and stamina UI meters will look like this:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_210_0.png)


    Figure 7.1 – The Health and stamina UI meters


    The number of targets eliminated and the ammo of the player will be displayed
    using text:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_210_1.png)


    Figure 7.2 – Targets eliminated and ammo counters


    To create a HUD that will display the UI meters for health and stamina, we will
    first need to create variables within the player character that can track these
    values. We will also create the variables that will count the targets eliminated
    and the ammo of the player.


    Follow these steps to create the variables:'
  merge: -1
  img_proc: true
