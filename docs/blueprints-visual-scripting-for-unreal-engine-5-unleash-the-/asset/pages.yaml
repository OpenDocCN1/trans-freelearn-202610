- pgno: 13
  md: '# # Chapter 1: Exploring the Blueprint Editor


    Welcome to the amazing world of game development with Unreal Engine 5. In this
    book, we will learn how to develop games in Unreal Engine using the Blueprints
    Visual Scripting language, which was created by Epic Games for Unreal Engine.


    The first step that is needed before we can learn about Blueprints is to prepare
    our development environment. Unreal Engine is free to download. We will learn
    how to install Unreal Engine 5 and create a new project. After that, we will learn
    about some of the basic concepts of Blueprints and explore each panel of the Blueprint
    Editor.


    In this chapter, we will cover the following topics:


    +   - Installing Unreal Engine

    +   - Creating new projects and using templates

    +   - Blueprints Visual Scripting

    +   - The Blueprint Class Editor interface

    +   - Adding Components to a Blueprint


    # # Installing Unreal Engine


    To use Unreal Engine, you must first install the Epic Games Launcher:


    +   1. Access the website at https://www.unrealengine.com.

    +   2. Register and download the Epic Games Launcher.

    +   3. Install and start the launcher.

    +   4. Click the Unreal Engine tab on the left-hand side.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '5. Click on the **Library** tab that appears at the top of the screen.


    6. Click the + button next to **ENGINE VERSIONS** to add a version of Unreal Engine
    to the launcher. You can use the newest version available.


    7. Click the **Install** button. The launcher will start downloading the files
    needed for installation and may take a long time to complete.


    8. Click the **Launch** button to start an already installed version. It is possible
    to have multiple versions of Unreal Engine installed on the same machine – you
    simply set one of them as the current version. The **Launch** button at the top
    right of the launcher will start the current version.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_14_0.png)


    Figure 1.1 – Launching Unreal Engine


    The Blueprint Visual Scripting system is already a well established and stable
    technology. This book uses version 5.0.0, but the examples created in this book
    should work without problems in later versions.


    # # Creating new projects and using templates


    After starting up Unreal Engine Editor, the **Unreal Project Browser** will appear.
    The **Recent Projects** box on the top left is used to open existing projects
    and the other boxes on the left are categories of templates used to'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'create a new project. The following screenshot shows the templates of the Games
    category.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_15_0.png)


    Figure 1.2 – Templates under the Games category


    Templates are basic containers with some key files and a level that provide a
    basic starting point for different types of projects. They are useful for rapid
    prototyping or to learn the basic mechanics of a specific type of project. The
    use of templates is optional. All templates can be simply recreated in the blank
    template. The following are descriptions of each template in the Games category:


    +   • **First Person**: For games with a first-person perspective. This template
    features a player character represented by a pair of arms equipped with a gun
    that fires a simple sphere projectile. The character can be moved around the level
    using a keyboard, controller, or virtual joystick on a touch device.


    +   • **Handheld AR**: For augmented reality applications for Android and iOS
    devices. This template features runtime logic for toggling AR mode'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'on and off, along with some example code for hit detection and light estimation
    handling.


    +   **Third Person:** Contains a playable character with a camera that follows
    it. The camera is positioned behind and slightly above the character. The character
    has walking, running, and jumping animations and can be moved around the level
    using a keyboard, controller, or virtual joystick on a touch device.


    +   **Top Down:** Contains a character controlled by a mouse with a camera at
    a great distance above it. The player''s character is controlled using a mouse
    or touchscreen to click on the required destination and uses the navigation system
    to avoid obstacles when moving to destinations. This top-down view is often used
    in action role-playing games.


    +   **Virtual Reality:** Contains the essential features for virtual reality games.
    This template features teleport locomotion, grabbable objects, interactive objects,
    and a VR spectator camera. The template has a level where the player can move
    around and contains objects that can be grabbed and interacted with.


    +   **Vehicle:** Contains a regular vehicle and a complex vehicle with suspension.
    The level of this template contains a simple track and obstacles.


    At the bottom right of the **Unreal Project Browser**, there are the **Project
    Defaults** with project configuration options available for the selected template.
    In the examples of this book, we will use the values selected on the screenshot.
    These options can be modified later in the project, and they are as follows:


    +   **Blueprint/C++:** There are templates made with **Blueprint** or the C++
    programming language. In this book, we will only use **Blueprint** templates.
    A project in Unreal Engine 5 can be developed using **Blueprint**, C++, or a combination
    of both. You can add C++ code to **Blueprint** projects and **Blueprint** to C++
    projects.


    +   **Target Platform:** Desktop or Mobile. Use **Desktop** if you are developing
    your project for use on computers or game consoles. Choose'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'Mobile if your project will be viewed on a mobile device. In this book, we
    will use the Desktop option.


    +   • Quality Preset: Scalable or Maximum. These options affect the project''s
    performance. The Scalable option disables some complex features, and the Maximum
    option enables all the features available in the target platform. In this book,
    we will use the Scalable option.


    +   • Starter Content: If this checkbox is marked, the project will include Starter
    Content. Starter Content is a content pack with simple meshes, materials, and
    particle effects. The examples in this book assume that Starter Content is being
    used.


    +   • Raytracing: If this checkbox is marked, the project will use real-time raytracing,
    which is a performance-intensive feature. The examples in this book will not use
    raytracing.


    Select the Third Person template, choose a location folder, and fill in the Name
    field for the project. Select the Project Defaults mentioned in the previous list
    and then click the Create button. After the project loads, the Unreal Engine Level
    Editor will be displayed, as shown in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_17_0.png)'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Figure 1.3 – The Unreal Engine Level Editor


    These are the key panels of the Level Editor:


    1. **Toolbar**: Located at the top of the Level Editor. It contains buttons with
    commonly used operations. The toolbar buttons are separated into four groups.
    The first group from the left provides quick access to features such as saving
    your work and adding various objects and code to the project. The second group
    of buttons are used to change the editing mode of the Level Editor. The third
    group lets you play the current level and provides various platform-specific options.
    The final **Settings** button all the way on the right provides easy access to
    project settings.


    2. **Viewport**: Located at the center of the Level Editor. It shows the Level
    that is being created. You can use the **Viewport** panel to move around the Level
    and add objects on the Level. When holding down the right mouse button, move the
    mouse to rotate the camera and use the WASD keys to move around.


    3. **Content Browser**: This can be accessed by clicking on the **Content Drawer**
    button located at the bottom-left corner of the Level Editor. It is used to manage
    the assets of the project. An asset is a piece of content in an Unreal Engine
    project. For example, **Materials**, **Static Meshes**, and **Blueprints** are
    all assets. If you drag an asset from the **Content Browser** and drop it into
    the Level, the Editor creates a copy of the asset to place in the Level.


    4. **Outliner**: Located to the right of the Level Editor. It lists the objects
    that are in the Level.


    5. **Details**: Located to the right of the Level Editor, below **Outliner**.
    It shows the editable properties of an object that is selected in the **Viewport**.


    Now that we have an overview of the Unreal Engine Level Editor, let''s focus on
    the Blueprints Visual Scripting.


    # Blueprints Visual Scripting'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'The first question you should be asking is: what is a Blueprint?


    The word Blueprint has more than one meaning in Unreal Engine. First, it is the
    name of a visual scripting language created by Epic Games for Unreal Engine. Second,
    it can refer to a new type of game object created using the Blueprint language.


    There are two main types of Blueprints: Level Blueprint and Blueprint Class. Each
    Level of the game has its own Level Blueprint and it is not possible to create
    a separate Level Blueprint. On the other hand, Blueprint Class is used to create
    interactive objects for the game and can be reused in any Level.


    # Opening the Level Blueprint Editor


    To open the Level Blueprint Editor, click on the Blueprints button located in
    the leftmost group of buttons in the toolbar of the Unreal Editor. Then, select
    the Open Level Blueprint option from the dropdown, as shown in the following screenshot:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_19_0.png)


    Figure 1.4 – Opening a Level Blueprint'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'The Editor will open the **Level Blueprint** of the current Level. The **Level
    Blueprint Editor** is simpler than the **Blueprint Class Editor** because it has
    only the **My Blueprint** panel, the **Details** panel, and the **Event Graph**
    Editor. The following screenshot shows the **Level Blueprint Editor**:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_20_0.png)


    Figure 1.5 – The Level Blueprint Editor


    For now, we will not do anything with the **Level Blueprint**. We opened it to
    get our first glance at the interface. Close the **Level Blueprint Editor** to
    return to the **Level Editor** window. Now, we will create a **Blueprint Class**
    to open the **Blueprint Class Editor** and see all the panels available.


    # # Creating a Blueprint Class


    There are three ways to create a Blueprint Class:


    +   1. Click the same **Blueprints** button in the toolbar that we used to open
    the **Level Blueprint**. Then, click the **New Empty Blueprint Class** button
    in the dropdown.


    +   2. Click the **Content Drawer** button to open the **Content Browser**, then
    click the **Add** button and select **Blueprint Class** under the'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Create Basic Asset category.


    3. Right-click anywhere on an empty space in the Content Browser and select Blueprint
    Class from the menu that appears.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_21_0.png)


    Figure 1.6 – Creating a Blueprint Class'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'On the next window, you must choose the parent class of the new Blueprint.
    For now, think of the parent class as the Blueprint type. The window shows the
    most **Common** classes, but if you need to choose another parent class, then
    just expand the **All Classes** option. When you choose the parent class, this
    window will close, and a new Blueprint asset will appear in the **Content Browser**
    to be renamed. You can click the **Cancel** button because we are just familiarizing
    ourselves with the process.


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_22_0.png)


    Figure 1.7 – Blueprint Parent Class


    Now that we''ve learned how to open the current Level Blueprint and how to create
    a Blueprint Class, we will explore the panels of the Blueprint Class Editor. You
    can open the Blueprint Class Editor by right-clicking on a Blueprint asset in
    the **Content Browser** and selecting **Edit**, or by double-clicking on a Blueprint
    asset.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# The Blueprint Class Editor interface


    The Blueprint Class Editor contains several panels. Each panel is used to edit
    one aspect of a Blueprint. The Blueprint Class Editor is usually simply called
    the Blueprint Editor. The main panels of the Blueprint Editor are listed as follows:


    +   1. Toolbar

    +   2. Components

    +   3. My Blueprint

    +   4. Details

    +   5. Viewport

    +   6. Event Graph


    These panels can be found in the next screenshot. We will use the BP_ThirdPersonCharacter
    Blueprint of the Third Person template as an example. It is located in the ThirdPerson/Blueprints
    folder. Double-click the BP_ThirdPersonCharacter Blueprint to open the Blueprint
    Class Editor.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_24_0.png)


    Figure 1.8 – Blueprint Editor panels


    # The Toolbar panel


    The Toolbar panel is located at the top of the Blueprint Class Editor and contains
    some essential buttons for editing Blueprints:


    ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_24_1.png)


    Figure 1.9 – Toolbar panel


    The buttons are described as follows:


    +   - **Compile**: Converts the Blueprint script into a lower-level format that
    can be executed. That means a Blueprint must be compiled before running the game
    or the changes made will not be reflected. Click this button to compile the current
    Blueprint. A green check icon will appear if there is no error.

    +   - **Save**: Saves all changes made to the current Blueprint.

    +   - **Browse**: Shows the current **Blueprint Class** in the **Content Browser**.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '+   * **Find**: Searches within a Blueprint.

    +   * **Hide Unrelated**: When active, it hides the nodes unrelated to the selected
    nodes.

    +   * **Class Settings**: Allows editing of the settings for the class in the
    Details panel. The **Class Settings** options contain properties such as **Description**,
    **Category**, and **Parent Class**.

    +   * **Class Defaults**: Allows editing of the **Class Defaults** in the **Details**
    panel. **Class Defaults** are the initial values of the Blueprint variables.

    +   * **Simulation**: Allows the execution of the Blueprint inside the Blueprint
    Editor.

    +   * **Play**: Allows you to play the current Level.

    +   * **Debug Object**: This dropdown allows the selection of an object to debug.
    If none is selected, it will debug any object created with the current Blueprint
    Class.


    # The Components panel


    The **Components** panel shows all the Components that are part of the current
    Blueprint.'
