  md: 'To create AI behavior that allows our enemies to traverse the level, we need
    to create a map of the environment that the AI will know how to read and navigate
    with. This map is created with an asset known as a **NavMesh**, which is an abbreviation
    for **Navigation Mesh**.


    Follow these steps to create a NavMesh for our play area:


