    In this section, we saw how UMG Widget Blueprints can be used together to create
    a dynamic and configurable interface.


    # ## Summary


    In this chapter, we explained what a Product Configurator is, and we showed how
    to use the Product Configurator template. We learned how to use the Variant Manager
    panel to create Variants and Variant Sets.


    We also learned how the **BP_Configurator** Blueprint stores all the information
    of the Level Variant Sets Actor needed to create a dynamic interface. We had an
    overview of the **BP_Configurator** functions and saw how to activate a Variant
    in a Blueprint.'
