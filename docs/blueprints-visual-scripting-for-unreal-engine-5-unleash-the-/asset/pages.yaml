    This is what each variable does:


    +   • **ObjectVariantSets**: An array of **STRUCT Var Set** that stores all Variant
    Sets of the product

    +   • **EnviroVarSet**: A Variable of the **STRUCT Var Set** type that stores
    the Variant Set of environment lighting

    +   • **CameraVarSet**: A Variable of the **STRUCT Var Set** type that stores
    the camera Variant Set

    +   • **LVSActor**: A reference to **Level Variant Sets Actor**

    +   • **CameraActor**: A reference to the camera used to visualize the product

    +   • **GUI**: A reference to the main UMG Widget BlueprintNoteThere are several
    variables in the **UI Options** category that can be used to modify'
