- pgno: 368
  md: '# # Adding noise to the player''s actions


    The **Pawn Sensing** component of **EnemyController** is only able to detect noise
    if it is created from **Pawn Noise Emitter**. The existing sound effect that we
    play when the player fires their gun will not trigger the enemy''s **Pawn Sensing**
    component. It is important to know that the nodes that produce noise for pawn
    sensing have no direct relationship with the sound a player hears. The noise exists
    only in terms of producing an event that the AI can hear and respond to.


    The **Pawn Noise Emitter** component must be added to an actor for the noises
    it broadcasts to be detected by a pawn sensor. We will change two player abilities,
    namely sprinting and shooting, to produce detectable noise by utilizing this component.


    These are the steps to use **Pawn Noise Emitter**:


    +   1. In the content browser, access the Content > FirstPersonBP > Blueprints
    folder and double-click on the FirstPersonCharacter Blueprint.


    +   2. In the **Components** panel, click the **Add** button and search for `pawn`.
    Select the **Pawn Noise Emitter** component:'
  merge: -1
  img_proc: true
- pgno: 369
