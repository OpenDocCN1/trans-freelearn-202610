    Now, while playing, you should be able to press the *Enter* key you set up to
    bring up the pause menu. Clicking on the **Resume** button should close the pause
    menu and return you to the game. If you progress several rounds through the game
    and then press the **Reset All** button from the pause menu, then you should automatically
    reload the level, with your progress reset to the first round of the game. If
    this is what you see, then congratulations! You have accomplished a significant
    achievement in creating a save system that is able to store, load, and reset progress
    across multiple rounds of gameplay.


    # Summary


    In this chapter, we have made significant strides toward making our game a complete
    experience that can be played and enjoyed by other people. You learned how to
    show different screens based on whether the player has won or lost. You also learned
    how to implement a save system that allows the player to return to their earlier
    game sessions with their progress intact. Then, we implemented a round system
    that modifies the gameplay goal each time the player progresses to a new round.
    Finally, we implemented additional menu systems that give the player information
    about which round they are on and give them the opportunity to pause the gameplay
    and even reset their own save file.


    In the next chapter, we will explore making builds of the game we created so that
    we can share the experience with others.


