    \ BP_RandomSpawner\n\nIn this example, we'll create a Blueprint called `BP_RandomSpawner`,\
    \ which will have an array of **Target Points**. The elements of the Target Points\
    \ array can be set in the Level Editor. When the level starts, the `BP_RandomSpawner`\
    \ Blueprint will randomly select one element of Target Points and spawn an instance\
    \ of a specified `Actor` class in the same location of the Target Point selected.\n\
    \nThese are the steps to create this example:\n\n+   1. Create a project based\
    \ on the *Third Person* template with the starter content.\n+   \n+   2. In the\
    \ Content Browser, access the *Content* folder. Right-click in the empty space\
