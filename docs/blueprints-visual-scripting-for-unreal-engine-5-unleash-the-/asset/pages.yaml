- pgno: 314
  md: '# # Creating navigation behavior


    The first goal for our enemy will be to get it to navigate between points that
    we create on the map. To accomplish this, we''ll need to create points on the
    map that the enemy will navigate to, and then we need to set up the behavior that
    will cause the enemy to move to each of the points in a cycle.


    # # Setting up patrol points


    Let''s start by creating the path we want the AI to patrol. We will use a **Sphere
    Trigger** to represent a patrol point, since it generates overlap events and is
    hidden in the game. We need at least two patrol points on the level, since each
    instance of `BP_EnemyCharacter` can navigate between two patrol points.


    Follow these steps to create the patrol points:


    +   1. In the Level Editor, click the **Create** button located on the toolbar,
    and then click on **Sphere Trigger**. Place the Sphere Trigger anywhere on the
    floor:'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_315_0.png)


    Figure 9.24 – Creating a Sphere Trigger


    +   2. In the **Details** panel, rename the Sphere Trigger `PatrolPoint1`.


    +   3. Create another Sphere Trigger and name it `PatrolPoint2`. Place it far
    away from the first patrol point so that movement between the two'
  merge: -1
  img_proc: true
- pgno: 316
  md: 'points is noticeable.


    With our patrol points established, we can move on to building the intelligence
    of our enemy.


    # # Creating the Blackboard keys


    A Blackboard stores information using keys and values.

    BB_EnemyBlackboard will have two keys, one for storing the current patrol point
    and another to store a reference to the player character. This information will
    be referenced by the Behavior Tree.


    These are the steps to create the keys:


    +   1. Open `BB_EnemyBlackboard` from the content browser.

