  本部分将介绍几种对解决特定问题非常有用的工具。我们将学习如何编写动画蓝图，以及如何创建蓝图宏/函数库和组件。我们还将研究过程生成，并了解如何使用变体管理器创建产品配置器。


  本部分包含以下章节：


  - 第 17 章，动画蓝图

