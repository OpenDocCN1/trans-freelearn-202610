  \ 我们将把 **目标追踪器** 水平框放置在屏幕顶部中央。在 **详细信息** 面板中，单击 **锚点** 下拉菜单并选择第二个选项。将 **位置 X** 设置为\
  \ `-100.0`，**位置 Y** 设置为 `50.0`。检查 **根据内容调整大小** 属性，因此我们不需要更改 **尺寸 X** 和 **尺寸 Y**\
