  \n图 2.25 – 开始游戏时事件\n\n13. 编译并保存蓝图。在关卡编辑器中，将 **函数示例蓝图** 拖放到关卡中。\n\n14. 开始关卡，查看屏幕上打印的功率值。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_62_1.png)\n\n图 2.26 – CalculatePower\
  \ 函数的结果\n\n### 宏与函数与事件\n\n有时，不清楚何时应创建宏、函数或自定义事件，因为它们具有多个共同特征。下表显示了它们之间的比较，以帮助您为自己的需求选择最合适的选项：\n\
  \n| | 宏 | 函数 | 事件 |\n|---|---|---|---|\n| 输入参数 | 是 | 是 | 是 |\n| 输出参数 | 是 | 是 | 否\
  \ |\n| 多个执行路径（输入/输出） | 是 | 否 | 否 |\n| 可由另一个蓝图调用 | 否 | 是 | 是 |\n| 延迟动作（例如，延迟） | 是\
  \ | 否 | 是 |\n| 时间轴节点 | 否 | 否 | 是 |\n\n### 摘要\n\n在本章中，我们学习了如何在蓝图的变量中存储值，以及如何使用动作来定义蓝图对事件的响应。之后，我们了解了如何使用运算符创建表达式，并使用宏和函数来组织脚本。这些是定义蓝图在游戏中应如何表现所需的关键元素。\n\
  \n在下一章中，我们将了解游戏性框架，这是一组用于游戏开发的具有通用功能的类。\n\n### 测验\n\n- 1. 哪种类型的变量只能保存 true 或 false\
  \ 值？\n  - a. 双精度浮点数\n  - b. 文本\n  - c. 布尔值\n  - d. 字节\n\n- 2. 以下哪个事件不是碰撞事件？\n  -\
  \ a. Hit\n  - b. Tick\n  - c. ActorBeginOverlap\n  - d. ActorEndOverlap\n\n- 3.\
  \ 分支节点可用于创建不同的执行路径。\n  - a. 正确\n  - b. 错误\n\n- 4. 以下哪个逻辑运算符仅在所有输入值均为 `true` 时才返回\
  \ `true`？\n  - a. NOT\n  - b. OR\n  - c. AND\n\n- 5. 以下哪项不能被另一个蓝图调用？\n  - a. 宏\n\
  \  - b. 函数\n  - c. 自定义事件\n"
- "## 第 3 章：面向对象编程与游戏性框架\n\n蓝图基于 **面向对象编程** (**OOP**) 的原则。OOP 的目标之一是将编程概念更贴近现实世界。\n\
  \n虚幻引擎游戏性框架涵盖了视频游戏所需的所有核心系统，例如游戏规则、玩家输入和控制、摄像机以及用户界面。\n\n在本章中，我们将学习以下主题：\n\n- 熟悉\
  \ OOP 概念\n- 管理 Actor\n- 探索游戏性框架类\n\n### 熟悉 OOP\n\n让我们了解 OOP 的一些基本概念，例如类、实例和继承。这些概念将帮助您了解蓝图可视化脚本的各种元素。\n\
  \n### 类\n\n在 OOP 中，类是创建对象的模板，用于提供状态（变量或属性）的初始值以及行为（事件或函数）的实现。\n\n即使是独一无二的现实世界对象，也可以以相同的方式来思考。举个非常简单的例子，我们可以考虑一个人类类。在这个类中，我们可以拥有姓名和身高等属性，以及移动和进食等动作。使用人类类，我们可以创建该类的多个对象。每个对象代表一个具有不同姓名和身高属性值的人。\n\
  \n当我们创建一个蓝图时，我们正在创建一个新类，该类可用于在游戏关卡中创建对象。如下图所示，创建新蓝图资源时出现的选项是 **蓝图类**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_66_0.png)\n\
  \n图 3.1 – 创建蓝图类\n\n**封装** 是另一个重要概念。它允许我们从另一个类的角度查看类时隐藏其复杂性。蓝图类的变量和函数可以是 **私有** 的，这意味着它们只能在创建它们的蓝图类中访问和修改。\
  \ **公共** 变量和函数是指可以由其他蓝图类访问的那些。\n\n### 实例\n\n从类创建的对象也称为该类的 **实例**。每次您从 **内容浏览器**\
  \ 拖动蓝图类并将其放入关卡时，您就会创建该蓝图类的一个新实例。\n\n所有实例都使用与蓝图类中定义的相同的默认值创建其变量。但是，如果将变量标记为 **实例可编辑**，则可以在关卡中更改每个实例的变量值，而不会影响其他实例持有的值。\n\
  \n例如，假设创建了一个蓝图来表示游戏中的一种角色类型。下图显示将该蓝图类的三个实例添加到了关卡中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_67_0.png)\n\
  \n图 3.2 – 蓝图类的实例\n\n### 继承\n\n在 OOP 中，类可以从其他类继承变量和函数。在创建蓝图时，我们必须做的第一件事是选择该蓝图的父类。蓝图类只能有一个父类，但可以有多个子类。父类也称为超类，而子类称为子类。\n\
  \n作为使用继承的示例，假设我们正在创建表示游戏中不同类型武器的几个蓝图。我们可以创建一个名为 `Weapon` 的基础蓝图类，其中包含游戏中所有武器共有的内容。然后，我们可以使用\
  \ `Weapon` 类作为父类来创建表示每种武器的蓝图。下图显示了这些类之间的层次结构：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_68_0.png)\n\
  \n图 3.3 – 类层次结构\n\n继承的一个优点是，我们可以在父类中创建一个函数，并在子类中以不同的实现对其进行覆盖。例如，`Weapon` 父类中可以有一个名为\
  \ `Fire` 的函数。子类继承 `Fire` 函数，因此 `Shock Rifle` 类使用发射能量束的版本覆盖 `Fire` 函数，而 `Rocket Launcher`\
  \ 类使用发射火箭的版本覆盖 `Fire` 函数。在运行时，如果我们有对 `Weapon` 类的引用并调用 `Fire` 函数，将识别实例类以运行其 `Fire`\
  \ 函数的版本。\n\n继承还用于定义类的类型，因为它会累积其父类的所有类型。例如，我们可以说 `Shock Rifle` 类的实例既是 `Shock Rifle`\
  \ 类型，也是 `Weapon` 类型。因此，如果我们有一个带有 `Weapon` 输入参数的函数，它可以接收 `Weapon` 类的实例或其任何子类的实例。\n\
  \n这些 OOP 的基本概念将帮助我们理解游戏性框架。虚幻引擎有一些用于游戏开发的基本类。这些类是游戏性框架的一部分。游戏性框架的主类是 **Actor**。\n\
  \n### 管理 Actor\n\nActor 类包含对象在关卡中存在所需的所有功能。因此，Actor 类是所有可在关卡中放置或生成的对象的父类。换句话说，任何可在关卡中放置或生成的对象都是\
  \ Actor 类的子类。我们将创建的大多数蓝图都将基于 Actor 类本身或其子类。因此，本节中我们将探讨的功能对这些蓝图很有用。\n\n### 引用 Actor\n\
  \ninteger、float 和 Boolean 等变量类型称为原始类型，因为它们只存储指定类型的简单值。在使用对象或 Actor 时，我们使用一种称为 **对象引用**\
  \ 的变量。蓝图中的引用允许不同的对象相互通信。我们将在 _第 4 章，了解蓝图通信_ 中更详细地探讨这种通信。\n\n例如，下图表示内存中两个蓝图类的实例。`BP_Barrel`\
  \ 蓝图类的实例具有一个名为 `Hit Counter` 的整数变量，当前值为 `2`。另一个变量名为 `BP_Fire`，是一个对象引用，引用了 **蓝图效果\
  \ 火** 的实例。我们可以使用对象引用变量访问另一个蓝图的公共变量和函数：\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_70_0.png)\n\
  \n图 3.4 – 对象引用\n\n在蓝图中，我们可以创建引用其他对象/角色的变量。让我们创建一个分步功能示例，以查看此概念在实际中的应用：\n\n- 1. 基于带有入门内容的第一人称模板创建项目。\n\
  - 2. 单击 **内容抽屉** 按钮打开 **内容浏览器**，然后单击 **添加** 按钮并选择 **蓝图类**。\n- 3. 在下一屏幕中，选择 **角色**\
  \ 作为父类。\n- 4. 将蓝图命名为 `BP_Barrel` 并双击它以打开蓝图编辑器。\n- 5. 在 **组件** 面板中单击 **添加** 按钮并选择\
  \ **静态网格** 组件。在 **详情** 面板中，选择 Shape_Cylinder 静态网格：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_71_0.png)\n\
  \n图 3.5 – 设置静态网格\n\n- 6. 在 **我的蓝图** 面板中，创建一个名为 BP_Fire 的变量。在 **详情** 面板中，单击 Variable\
  \ Type 参数的下拉菜单。Object Types 类别列出了虚幻引擎中可用的类以及我们在项目中创建的蓝图类。搜索 fire，然后将鼠标悬停在 Blueprint\
  \ Effect Fire 上以显示子菜单，然后选择 **对象引用**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_72_0.png)\n\
  \n图 3.6 – 创建对象引用\n\n- 7. **对象引用** 变量的默认值是 **空**（也称为 null），这意味着该变量未引用任何实例。我们可以在关卡编辑器中将实例分配给此变量。为此，请检查变量的\
  \ **实例可编辑** 属性，以便在关卡编辑器中访问它。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_72_1.png)\n\
  \n图 3.7 – 使放置在关卡中的实例中的变量可编辑\n\n- 8. 将 `BP_Fire` 变量从 **我的蓝图** 面板拖动并放入 **事件图**。选择\
  \ **获取 BP_Fire** 选项以创建节点。从 **BP_Fire** 节点的蓝色引脚拖动并放置在图表中以打开 **上下文菜单**。搜索 `hidden`\
  \ 并选择 **在游戏中设置隐藏 (P_Fire)** 函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_73_0.png)\n\
  \n图 3.8 – 在上下文菜单中搜索函数\n\n- 9. 右键单击 **事件图** 并添加 **事件命中**。将 **事件命中** 节点连接到 **在游戏中设置隐藏\
  \ (P_Fire)** 节点。 **新隐藏** 参数必须取消选中。这些操作将在 `BP_Barrel` 蓝图的实例被击中时，取消隐藏由 `BP_Fire` 引用的实例的粒子系统组件：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_74_0.png)\n\n图 3.9 – 事件命中的操作\n\n- 10.\
  \ 编译蓝图并返回到关卡编辑器。将 BP_Barrel 蓝图从内容浏览器拖动并放入关卡。\n- 11. 在内容浏览器中，转到 内容 | 入门内容 | 蓝图 文件夹，拖动\
  \ Blueprint_Effect_Fire，并将其放置在添加到关卡中的 BP_Barrel 蓝图之上：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_75_0.png)\n\
  \n图 3.10 – BP_Barrel 和 Blueprint_Effect_Fire\n\n- 12. 在 `Blueprint_Effect_Fire`\
  \ 实例的 **详情** 面板中，选择 **P_Fire** 组件，搜索 `hidden`，并检查 **游戏中隐藏** 属性：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_76_0.png)\n\
  \n图 3.11 – 隐藏 Blueprint_Effect_Fire 的粒子系统\n\n- 13. 在 `BP_Barrel` 实例的 **详情** 面板中，单击\
  \ `BP_Fire` 变量的下拉菜单，以列出关卡中为 `Blueprint_Effect_Fire` 实例的角色。选择我们放置在 `BP_Barrel` 上方的实例，以将其实例分配给\
  \ `BP_Fire` 变量。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_77_0.png)\n\n图 3.12\
  \ – 在关卡编辑器中分配实例\n\n- 14. 单击关卡编辑器的播放按钮以测试关卡。朝我们在关卡中放置的 BP_Barrel 实例方向看。Blueprint_Effect_Fire\
  \ 实例是隐藏的。使用左键射击 BP_Barrel 实例。当 BP_Barrel 实例被击中时，Blueprint_Effect_Fire 实例将出现。\n\n\
  ### 生成和销毁角色\n\n有一个名为 **通过类生成角色** 的函数，用于创建角色实例。要将此函数添加到事件图，请右键单击事件图面板以打开上下文菜单，在搜索框中写入\
  \ spawn 以筛选结果，然后单击函数名。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_78_0.png)\n\n\
  图 3.13 – 上下文菜单中的 **通过类生成角色** 函数\n\n此函数接收角色的类和 **转换** 作为输入参数。 **转换** 定义了新角色将使用的位置、旋转和缩放。另一个名为\
  \ **碰撞处理覆盖** 的输入参数定义了创建时如何处理碰撞。新实例的引用可在 **返回值** 输出参数中使用，并可以存储在变量中。\n\n要从关卡中移除角色实例，请使用\
  \ **销毁角色** 函数。 **目标** 输入参数指示将移除哪个实例。以下屏幕截图显示了使用 **通过类生成角色** 和 **销毁角色** 函数的示例。\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_79_0.png)\n\n图 3.14 – 创建和销毁实例\n\n- 要添加\
  \ _1_ 键输入事件，请右键单击事件图，并在搜索框中键入 _1_。 _1_ 键输入事件可在 **输入 > 键盘事件** 中找到。\n- 按下 _1_ 键将使用包含此脚本的蓝图实例的相同\
  \ **转换** 创建 **蓝图效果火** 的实例。例如，如果将前面的代码添加到 `ThirdPersonCharacter`（位于第三人称模板中的 `Content\
  \ | ThirdPersonBP | Blueprints`）的事件图中，那么一旦游戏启动，键盘上按下 _1_ 将在玩家角色的当前位置创建火焰效果。\n- 新\
  \ **蓝图效果火** 实例的引用存储在 `BPFire` 变量中。如果没有变量来存储实例，则可以轻松地将 **生成角色** 函数的返回值提升为变量，这会自动为其分配正确的变量类型。为此，请从\
  \ **返回值** 引脚拖动并放置在事件图上以打开 **上下文菜单**，然后选择 **提升为变量**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_80_0.png)\n\
  \n图 3.15 – 将返回值提升为变量\n\n- 当您按下 2 键时，将使用 **是否有效** 宏检查 `BPFire` 变量是否引用有效实例。此检查是必要的，以避免使用空引用调用函数。如果\
  \ `BPFire` 的值为 **空**，则无效。如果有效，则它将调用 **销毁角色** 函数，该函数接收 `BPFire` 变量作为 **目标** 输入参数，并销毁先前创建的\
  \ **蓝图效果火** 实例。\n- 请注意，按下 2 键仅删除最后创建的 **蓝图效果火** 实例。如果在删除前创建多个火焰实例，其他实例将保留在关卡中，因为在创建\
  \ **蓝图效果火** 实例时 `BPFire` 变量会被覆盖。\n\n### 构造脚本\n\n蓝图编辑器中的一个面板称为 **构造脚本**，如以下屏幕截图所示。\
  \ **构造脚本** 是所有 Actor 蓝图在蓝图首次添加到关卡时、在关卡编辑器中更改其属性时，或在运行时生成此蓝图的实例时执行的特殊函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_81_0.png)\n\
  \n图 3.16 – 构造脚本面板\n\n**构造脚本** 非常有助于创建灵活的蓝图，允许关卡设计师在关卡编辑器中配置这些蓝图实例的一些功能。\n\n作为示例，让我们创建一个带有\
  \ **实例可编辑静态网格** 的蓝图，以便我们可以为关卡上蓝图的每个实例选择不同的静态网格：\n\n- 1. 创建或使用带有入门内容的现有项目。\n- 2.\
  \ 在 **内容浏览器** 中单击 **添加** 按钮，并选择 **蓝图类** 选项。\n- 3. 在下一屏幕中，选择 **角色** 作为父类。\n- 4. 将蓝图命名为\
  \ `BPConstruction` 并双击它以打开蓝图编辑器。\n- 5. 在 **组件** 面板中单击 **添加** 按钮并选择 **静态网格** 组件。将组件重命名为\
  \ `StaticMeshComp`，如以下屏幕截图所示：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_82_0.png)\n\
  \n图 3.17 – 添加静态网格体组件\n\n- 6. 在 **My Blueprint** 面板中，创建一个名为 **SM_Mesh** 的新变量。在 **Details**\
  \ 面板中，单击 **Variable Type** 下拉菜单并搜索 `Static Mesh`。将鼠标悬停在 **Static Mesh** 上以显示子菜单，然后选择\
  \ **Object Reference**。选中 **Instance Editable** 属性，如下图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_83_0.png)\n\
  \n图 3.18 – SM_Mesh 变量的详细信息\n\n### 重要说明\n\n**Object Reference** 变量也可以引用在运行时创建的实例。\n\
  \n- 7. 按下工具栏上的 **Compile** 按钮。在 **Details** 面板底部为 **SM_Mesh** 变量定义一个初始静态网格体。单击 **Default**\
  \ 值属性的下拉菜单，然后选择 **SM_TableRound** 静态网格体。\n\n- 8. 单击 **Construction Script** 面板。将\
  \ `StaticMeshComp` 组件从 **Components** 面板拖动并放入 **Construction Script** 图表中以创建节点。\n\
  \n- 9. 单击 StaticMeshComp 节点的蓝色引脚，然后在图表中拖放以打开上下文菜单。搜索 set static mesh 并选择同名函数，如下图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_84_0.png)\n\n图 3.19 – 在上下文菜单中选择函数\n\n\
  - 10. 将 SM_Mesh 变量从 My Blueprint 面板拖动，放入 Construction Script 图表中，并在出现的菜单中选择 Get\
  \ SM_Mesh 选项。将 SM_Mesh 节点引脚连接到 Set Static Mesh 函数的 New Mesh 引脚。Construction Script\
  \ 应类似于下图所示。当 Construction Script 执行 Set Static Mesh 函数时，它将从 SM_Mesh 变量获取静态网格体并将其设置到\
  \ Static Mesh Comp 组件上：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_84_1.png)\n\n\
  图 3.20 – Construction Script 操作\n\n- 11. 编译蓝图。在关卡编辑器中，将 BPConstruction 从内容浏览器拖动并放入关卡以创建实例。再次拖放\
  \ BPConstruction 以创建另一个实例。在关卡中选择一个实例，并在关卡编辑器的 Details 面板中，检查 SM_Mesh 变量是否可见且可编辑，如下图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_85_0.png)\n\n图 3.21 – BPConstruction\
  \ 实例详细信息\n\n- 12. 单击 **SM_Mesh** 变量的下拉菜单并选择另一个静态网格体，例如 **SM_Couch**。Construction\
  \ Script 将立即执行并更改所选实例的静态网格体。下图显示了 `BPConstruction` 类的两个实例。截图左侧的实例使用默认静态网格体，但右侧实例的静态网格体已修改为\
  \ **SM_Couch**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_86_0.png)\n\n图 3.22\
  \ – BPConstruction 的两个实例\n\n`Actor` 类是 Gameplay Framework 的主类，但还有其他用途的类我们需要了解。\n\
  \n### 探索其他 Gameplay Framework 类\n\n创建新蓝图时的第一步之一是选择将用作模板的父类。下图显示了用于选择父类的面板。按钮上显示的类称为\
  \ **Common Classes**，是 Gameplay Framework 的一部分。要使用另一个类作为父类，请展开 **All Classes** 类别并搜索所需的类：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_87_0.png)\n\n图 3.23 – 选择父类\n\n下图显示了 **Common\
  \ Classes** 的层次结构。在 Unreal Engine 中，有一个名为 **Object** 的父类。类继承其上方类（即其父类）的特征。基于 OOP\
  \ 的继承概念，我们可以说 **Character** 类的实例是 **Character** 类型、**Pawn** 类型和 **Actor** 类型：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_88_0.png)\n\n图 3.24 – Common Classes 层次结构\n\
  \n通过分析此层次结构，我们可以看出 **Actor Component** 和 **Scene Component** 类不是 Actor。这些类用于创建可以添加到\
  \ Actor 的组件。组件的两个示例是 `Static Mesh Component` 和 `Rotating Movement Component`，我们在之前的示例中使用过它们。我们将在\
  \ _第 18 章，创建蓝图库和组件_ 中介绍组件的创建。\n\n让我们更仔细地查看一些 **Common Classes**。\n\n### Pawn\n\n\
  **Pawn** 是 **Actor** 的子类。**Pawn** 是可以被游戏中 **Controller** 拥有的 **Actor**。 **Controller**\
  \ 类表示玩家或 **人工智能** (AI)。概念上，**Pawn** 类的实例是游戏角色的物理身体，而拥有它的 Controller 类实例是一种大脑，允许角色在关卡中移动并执行其他操作。\n\
  \n基于 Pawn 类创建蓝图并单击 Class Defaults 按钮以在 Details 面板中显示它。从 Pawn 类继承的参数在下图中显示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_89_0.png)\n\
  \n图 3.25 – Pawn 类默认值\n\n某些参数显示 Pawn 类可以使用拥有它的 Controller 类的旋转值。其他参数指示 Pawn 类必须如何被\
  \ Controller 类拥有。\n\n**Pawn** 的两个主要子类是 **Character** 和 **WheeledVehicle**。\n\n###\
  \ Character\n\n**Character** 类是 **Pawn** 类的子类；因此，**Character** 类的实例也可以被 **Controller**\
  \ 类的实例拥有。此类旨在表示可以行走、奔跑、跳跃、游泳和飞行的角色。\n\n基于 **Character** 类的蓝图将继承以下特定于角色的组件：\n\n \
  \ - * **CapsuleComponent**：用于碰撞测试。\n  - * **ArrowComponent**：指示角色的当前方向。\n  - * **Mesh**：此组件是骨骼网格体，以可视方式表示角色。**Mesh**\
  \ 组件的动画由动画蓝图控制。\n  - * **CharacterMovement**：此组件用于定义各种类型的角色移动，例如行走、奔跑、跳跃、游泳和飞行。\n\
  \n这些组件在下图中显示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_91_0.png)\n\n图 3.26 –\
  \ Character 类组件\n\n**CharacterMovement** 组件处理移动以及多人游戏中的复制和预测。它包含许多定义角色各种移动类型的参数：\n\
  \n| 设置 | 值 |\n| :--- | :--- |\n| Gravity Scale | 1.0 |\n| Max Acceleration | 2048.0\
  \ |\n| Braking Friction Factor | 2.0 |\n| Braking Friction | 0.0 |\n| Crouched Half\
  \ Height | 40.0 |\n| Use Separate Braking Friction | [ ] |\n| Mass | 100.0 |\n|\
  \ Default Land Movement Mode | Walking |\n| Default Water Movement Mode | Swimming\
  \ |\n\n图 3.27 – Character Movement 变量\n\n### PlayerController\n\n**Controller**\
  \ 类有两个主要子类：**PlayerController** 和 **AIController**。 **PlayerController** 类由人类玩家使用，而\
  \ **AIController** 类使用 AI 来控制 **Pawn**。\n\n**Pawn** 和 **Character** 类的实例只有在被 **PlayerController**\
  \ 实例拥有时才能接收输入事件。输入事件可以放在 **PlayerController** 或 **Pawn** 的事件图表中。将输入事件放在 **PlayerController**\
  \ 中的优势在于这些事件独立于 **Pawn**，使得更改由 **Controller** 类拥有的 **Pawn** 类更加容易。无论您选择哪种方式，请在项目中保持一致。\n\
  \n下图显示了如何在游戏中更改由 **PlayerController** 拥有的 **Pawn**，并展示了 **Possess** 函数的使用。在此示例中，关卡中有两个角色，玩家可以通过按\
  \ **1** 或 **2** 键来控制它们。只有当前被拥有的 **Character** 实例接收 **PlayerController** 命令：\n\n\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_94_0.png)\n\n图 3.28 – 控制一个 Pawn\n\n###\
  \ 游戏模式基类\n\n**游戏模式基类**是创建**游戏模式**的父类。**游戏模式**类用于定义游戏规则，并指定用于创建**Pawn**、**玩家控制器**、**游戏状态基类**、**HUD**及其他类的默认类。要在**游戏模式**中更改这些类，请单击**类默认值**按钮以在**详情**面板上显示它们，如以下屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_95_0.png)\n\n图 3.29 – 游戏模式类默认值\n\n要在关卡编辑器中指定项目的默认游戏模式类，请单击**编辑\
  \ | 项目设置**.... 然后，在项目类别中，选择地图与模式选项。在默认游戏模式属性的下拉菜单中选择游戏模式，如以下屏幕截图所示。在选定的游戏模式类别中，您可以替换默认游戏模式使用的一些类：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_96_0.png)\n\n图 3.30 – 指定项目的游戏模式\n\n每个关卡可以有不同的**游戏模式**。关卡的**游戏模式**会替换项目的**默认游戏模式**。要指定关卡的**游戏模式**，请单击关卡编辑器中的**设置**按钮并选择**世界设置**选项。在**游戏模式覆盖**属性的下拉菜单中选择**游戏模式**，如以下屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_97_0.png)\n\n图 3.31 – 指定关卡的游戏模式\n\n###\
  \ 游戏实例\n\n**游戏实例**不是**常用类**之一，但了解此类的存在很重要。**游戏实例**类及其数据在关卡之间保持不变，因为**游戏实例**类的实例在游戏开始时创建，仅在关闭游戏时移除。\n\
  \n关卡中所有Actor和其他对象在每次加载关卡时都会被销毁并重新生成。因此，如果需要在关卡切换时保留某些变量值，**游戏实例**类是一个可选方案。\n\n要为游戏分配**游戏实例**类，请在关卡编辑器中通过**编辑\
  \ | 项目设置 | 地图与模式**修改项目设置，如以下屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_98_0.png)\n\
  \n图 3.32 – 指定游戏实例类\n\n### 摘要\n\n在本章中，我们学习了有助于理解蓝图工作原理的一些面向对象编程原则。我们了解到Actor类是用于可放置或生成到关卡中的对象的父类。\n\
  \n我们还了解到游戏框架包含用于表示某些游戏元素的类，并学习了如何基于某些**常用类**创建蓝图。\n\n我们的下一步是学习我们的蓝图如何相互通信，这将在下一章中介绍。\n\
  \n### 测验\n\n- 1. 用于创建Actor实例的函数名称是什么？\n- a. 创建 Actor\n- b. 从类生成 Actor\n- c. 生成 Actor\
  \ 实例\n\n- 2. 构造脚本在关卡开始运行时执行。\n- a. 正确\n- b. 错误\n\n- 3. 角色类是Actor类的子类。\n- a. 正确\n\
  - b. 错误\n\n- 4. Pawn类的实例代表大脑，Controller类的实例代表物理身体。\n- a. 正确\n- b. 错误\n\n- 5. 下列哪个类应用于定义游戏规则？\n\
  - a. 游戏实例\n- b. 游戏会话\n- c. 游戏模式\n- d. 游戏状态\n"
- "## 第 4 章：理解蓝图通信\n\n本章介绍**蓝图通信**，它允许一个蓝图访问另一个蓝图的信息，并调用另一个蓝图的函数和事件。在本章中，我们将解释**直接蓝图通信**并向您展示如何在关卡蓝图上引用Actor。强制转换的概念将被深入解释，因为它是蓝图通信的重要组成部分。我们还将学习**事件分派器**，它能够实现蓝图类与关卡蓝图之间的通信，以及如何绑定事件。\n\
  \n对于每个主题，我们将进行逐步示例，以帮助理解概念并练习创建蓝图脚本。\n\n本章将涵盖以下主题：\n\n- 直接蓝图通信\n- 蓝图中的强制转换\n- 关卡蓝图通信\n\
  - 事件分派器\n- 绑定事件\n\n### 直接蓝图通信\n\n直接蓝图通信是蓝图/Actor之间的一种简单通信方法。其用法是创建一个对象引用变量，用于存储对另一个Actor/蓝图的引用。然后，我们可以使用该对象引用变量作为这些操作的**目标**输入参数来调用操作。\n\
  \n例如，让我们创建一个名为BP_LightSwitch的蓝图。BP_LightSwitch蓝图具有一个点光源类型的对象引用变量，用于引用关卡中放置的点光源。当玩家在关卡中与BP_LightSwitch蓝图重叠时，它将切换点光源的可见性。\n\
  \n要创建蓝图，请执行以下步骤：\n\n- 1. 打开您创建的任何包含入门内容的现有项目，或根据需要创建一个新项目。\n- 2. 单击内容抽屉按钮打开内容浏览器，然后单击添加按钮并选择蓝图类。\n\
  - 3. 在下一屏幕中，选择Actor作为父类。\n- 4. 将蓝图命名为BP_LightSwitch，然后双击它打开蓝图编辑器。\n- 5. 在组件面板中单击添加按钮并选择静态网格体组件。在详情面板中，选择SM_CornerFrame静态网格体，如以下屏幕截图所示。此静态网格体是我们灯开关的简单可视化表示。此外，将碰撞预设更改为OverlapAllDynamic，以便静态网格体不会阻挡玩家的移动：\n\
  \n| 区段 | 属性 | 值 |\n|------|------|-----|\n| 变量 | | |\n| 变换 | | |\n| 插座 | | |\n|\
  \ 静态网格体 | 静态网格体 | SM_CornerFrame |\n| 材质 | | |\n| 组件 tick | | |\n| 物理 | | |\n| 碰撞\
  \ | 模拟生成命中事件 | |\n| 碰撞 | 物理材质覆盖 | 无 |\n| 碰撞 | 生成重叠事件 | |\n| 碰撞 | 角色可跨越 | 是 |\n|\
  \ 碰撞 | 碰撞预设 | OverlapAllDynamic |\n\n图 4.1 – 选择静态网格体\n\n- 6. 在**我的蓝图**面板中，创建名为`Light`的新变量：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_103_0.png)\n\n图 4.2 – 创建变量\n\n- 7. 在**详情**面板中，单击**变量类型**下拉菜单并搜索`Point\
  \ Light`。将鼠标悬停在**点光源**上以显示子菜单，然后选择**对象引用**。检查**实例可编辑**属性，如以下屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_104_0.png)\n\
  \n图 4.3 – 创建点光源类型的变量\n\n- 8. 将`Light`变量从**我的蓝图**面板拖动到**事件图**中。\n- 9. 选择**获取 Light**选项以创建节点。从**Light**节点的蓝色引脚拖动并放置在图表上以打开**上下文菜单**。确保已勾选**上下文敏感**，以显示可用于**点光源**对象引用的**操作**。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_105_0.png)\n\n图 4.4 – 上下文菜单\n\n- 10.\
  \ 搜索`toggle`并选择名为**切换可见性 (点光源组件)**的函数，如以下屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_105_1.png)\n\
  \n图 4.5 – 添加切换可见性函数\n\n- 11. 右键单击**事件图**并添加**事件 ActorBeginOverlap**。从`Light`节点的蓝色引脚拖动并放置在图表上以打开**上下文菜单**，并添加**是否有效**宏，即带有白色问号的那个。此宏用于测试`Light`\n\
  \n\n\n变量正在引用一个实例。连接节点，如以下屏幕截图所示。编译此蓝图：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_106_0.png)\n\
  \n### 图 4.6 – Event ActorBeginOverlap 的操作\n\n### 重要提示\n\n在使用对象引用变量执行函数之前，请务必先使用\
  \ Is Valid 宏。该变量可能因多种原因而无效。使用无效变量执行函数会在运行时导致错误。\n\n- 12. 在关卡编辑器中，单击工具栏上的 **创建**\
  \ 按钮。将鼠标悬停在 **灯光** 上以显示子菜单，并拖动 **点光源** 并将其放置在关卡中的某个位置以创建实例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_106_1.png)\n\
  \n### 图 4.7 – 创建点光源\n\n13. 在 **详情** 面板中，单击 **点光源** 实例的名称，并将名称更改为 `Lamp`。将 **移动性**\
  \ 属性设置为 **可移动**，以便能够在运行时更改光照属性。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_107_0.png)\n\
  \n### 图 4.8 – 点光源实例的详情面板\n\n14. 将 `BP_LightSwitch` 蓝图类从 **内容浏览器** 拖放到关卡中靠近我们添加到关卡的\
  \ **点光源** 实例的位置。下一张屏幕截图显示了 `BP_LightSwitch` 的 **详情** 面板。`Light` 变量出现在 **详情** 面板中是因为我们勾选了\
  \ **实例可编辑** 属性。单击 `Light` 变量的下拉菜单，以显示关卡中所有 **点光源** 实例，并选择我们在前一步中重命名为 `Lamp` 的 **点光源**\
  \ 实例。本质上，这是直接蓝图通信。`BP_LightSwitch` 对另一个 Actor/蓝图具有对象引用，并可以调用其 **操作**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_108_0.png)\n\
  \n### 图 4.9 – 引用关卡中的实例\n\n15. 单击 **播放** 按钮以查看 `BP_LightSwitch` 蓝图的实际运行效果。每次您的角色与\
  \ `BP_LightSwitch` 实例重叠时，它都会切换所选 **点光源** 的可见性。以下屏幕截图显示了使用 **第三人称** 模板的示例。**点光源**\
  \ 变量位于墙上，`BP_LightSwitch` 蓝图位于地板上：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_109_0.png)\n\
  \n### 图 4.10 – 触摸 BP_LightSwitch 以打开灯光\n\n在本节中，我们学习了如何创建引用另一个蓝图实例的变量。但有时我们需要访问被引用实例的子类属性。在这种情况下，我们需要对引用进行类型转换。\n\
  \n### 蓝图中的类型转换\n\n存在一个名为 Cast To 的节点，它尝试将引用变量类型转换为新指定的类型。要理解类型转换，有必要回忆类之间的继承概念，我们在\
  \ *第 3 章，Actor 和游戏框架* 中介绍过。\n\n以下图表示一个名为 `BP_GameModeWithScore` 的蓝图。**游戏模式基类** 是此蓝图的父类。根据继承概念，我们可以使用\
  \ **游戏模式基类** 对象引用类型的变量来引用 `BP_GameModeWithScore` 的实例。但是，此变量无法访问 *子类*（例如 `BP_GameModeWithScore`\
  \ 蓝图中定义的子类）的变量和函数，因为 **游戏模式基类** 引用只知道 **游戏模式基类** 类中定义的变量和函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_110_0.png)\n\
  \n### 图 4.11 – BP_GameModeWithScore 继承自游戏模式基类\n\n因此，如果我们有一个 **游戏模式基类** 对象引用，可以尝试使用\
  \ `Cast To BP_GameModeWithScore` 函数对该引用进行类型转换。如果该实例是 `BP_GameModeWithScore` 类型，则\
  \ **类型转换** 将成功并返回一个 `BP_GameModeWithScore` 对象引用，我们可以使用该引用来访问 `BP_GameModeWithScore`\
  \ 的变量和函数。\n\n**类型转换** 节点的另一个用途是安全地测试对象引用是否为所需类型，这个逐步示例将说明这两种用例：\n\n- 1. 创建或使用基于第三人称模板且包含入门内容的现有项目。\n\
  - 2. 在 **内容浏览器** 中单击 **添加** 按钮，并选择 **蓝图类** 选项。\n- 3. 在下一屏幕上，选择 **游戏模式基类** 作为父类。\n\
  - 4. 将蓝图命名为 `BP_GameModeWithScore`，并双击它以打开蓝图编辑器。\n- 5. 在 **我的蓝图** 面板中，创建名为 `GameScore`\
  \ 的整数类型变量，并创建名为 `AddGameScore` 的函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_112_0.png)\n\
  \n### 图 4.12 – 创建变量和函数\n\n6. 在 `AddGameScore` 函数的 **详情** 面板中，添加名为 `Score` 的整数类型\
  \ **输入参数**。该函数用于向 `GameScore` 变量添加分数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_113_0.png)\n\
  \n### 图 4.13 – 添加输入参数\n\n- 7. 在函数图表中，添加以下屏幕截图中显示的 **操作**。要添加 **游戏分数** 变量的 **获取**\
  \ 和 **设置** 节点，只需拖动变量，将其放置到图表中，然后选择 **获取** 或 **设置**。 **打印字符串** 函数用于在屏幕上显示 **游戏分数**\
  \ 变量的当前值：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_113_1.png)\n\n### 图 4.14 –\
  \ Add Game Score 函数的操作\n\n### 重要提示\n\n位于 **设置** 和 **打印字符串** 之间的节点是一个转换器。要创建它，只需将\
  \ **设置** 的输出参数连接到 **打印字符串** 的 **输入字符串** 输入参数。由于参数类型不同，转换器会自动创建。\n\n- 8. 编译并保存 `BP_GameModeWithScore`\
  \ 蓝图。下一步是设置关卡以使用 `BP_GameModeWithScore` 作为 **游戏模式**。\n\n- 9. 在关卡编辑器中，单击工具栏右侧的 **设置**\
  \ 按钮，并选择 **世界设置**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_114_0.png)\n\n###\
  \ 图 4.15 – 访问世界设置\n\n- 10. 在 **游戏模式覆盖** 属性中，单击下拉菜单并选择 `BP_GameModeWithScore`，如以下屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_115_0.png)\n\n### 图 4.16 – 更改关卡使用的游戏模式\n\
  \n- 11. 创建一个蓝图并使用 Actor 作为父类。将其命名为 BP_Collectable，并在蓝图编辑器中打开它。\n\n- 12. 单击组件面板中的\
  \ **添加** 按钮并选择 **静态网格组件**。在 **详情面板** 中，选择 SM_Statue 静态网格，在 **材质** 中，转到 Element 0\
  \ 并选择 M_Metal_Gold。此外，将碰撞预设更改为 OverlapAllDynamic，如以下屏幕截图所示：\n\n| 属性组 | 具体设置 |\n\
  |--------|----------|\n| 静态网格 | 静态网格: SM_Statue |\n| 材质 | Element 0: M_Metal_Gold<br>Element\
  \ 1: M_Statue |\n| 组件勾选 | — |\n| 物理 | — |\n| 碰撞 | 模拟生成命中事件<br>物理材质覆盖: 无<br>生成重叠事件<br>角色可跨越:\
  \ 是<br>碰撞预设: OverlapAllDynamic |\n\n### 图 4.17 – 设置静态网格\n\n- 13. 右键单击 **事件图表** 并添加\
  \ **事件 ActorBeginOverlap**。 **其他 Actor** 是与 `BP_Collectable` 蓝图重叠的实例。从 **其他 Actor**\
  \ 的蓝色引脚拖动并将其放置到图表中以打开 **上下文菜单**。\n\n- 14. 选择 **类型转换为 ThirdPersonCharacter** 操作，如以下屏幕截图所示。\
  \ **ThirdPersonCharacter** 是表示第三人称模板中玩家的蓝图。我们正在使用 **类型转换** 操作来测试 **其他 Actor** 引用的实例是否为玩家：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_117_0.png)\n\n### 图 4.18 – 对其他 Actor\
  \ 引用进行类型转换\n\n- 15. 右键单击 **事件图表** 并添加 **获取游戏模式** 函数。从 **返回值** 的蓝色引脚拖动并将其放置到图表中以打开\
  \ **上下文菜单**。选择 **类型转换为 BP_GameModeWithScore** 操作。\n\n- 16. 从 **作为 BP 游戏模式与分数** 的蓝色引脚拖动，将其放置到图表中，并在\
  \ **上下文菜单** 中选择 **添加游戏分数** 操作。在 **分数** 输入参数中输入 `50`。\n\n- 17. 右键单击 **事件图表** 并添加\
  \ **销毁 Actor** 函数。连接节点的白色引脚。 **事件 ActorBeginOverlap** 的内容显示在以下屏幕截图中：\n\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_118_0.png)\n\
  \n图 4.19 – ActorBeginOverlap 事件的操作\n\n### 重要提示\n\n**获取游戏模式** 函数返回当前关卡所使用的 **游戏模式**\
  \ 的引用。但返回值的类型是 **游戏模式基类**。使用此类型的变量时，我们无法访问 **添加游戏得分** 函数。因此，有必要使用 **转换为 BP_GameModeWithScore**。\n\
  \n- 18. 编译 `BP_Collectable`。在关卡编辑器中，将 `BP_Collectable` 的一些实例拖放到关卡中。单击 **播放** 按钮来测试关卡。使用你的角色收集雕像，并在屏幕上查看当前得分。\n\
  \n### 重要提示\n\n前一张截图中出现的两个白色连接引脚称为 **重路由节点**。可以从 **上下文菜单** 中添加它们，用于帮助组织蓝图。\n\n此实际示例展示了使用\
  \ **转换为** 节点的两种常见方法。一种方法是测试实例是否为特定类型。另一种方法是访问子类的变量和函数。现在我们知道如何使用 **转换为**，让我们学习如何在关卡蓝图中添加角色的引用和事件。\n\
  \n### 关卡蓝图通信\n\n虚幻引擎有一种特殊的蓝图，称为 **关卡蓝图**。游戏中的每个关卡都有一个默认的关卡蓝图。它们用于创建仅在当前关卡中发生的事件和动作。要访问关卡蓝图，请单击关卡编辑器工具栏上的\
  \ **蓝图** 按钮，并选择 **打开关卡蓝图** 选项，如下图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_119_0.png)\n\
  \n图 4.20 – 打开关卡蓝图\n\n在关卡蓝图中，我们可以轻松创建关卡中角色的引用。为了实际演示，让我们创建一个示例，将 **Box Trigger**\
  \ 添加到关卡中。当角色与触发器重叠时，**Blueprint_Effect_Sparks** 被激活，产生火花效果：\n\n- 1. 创建或使用基于第三人模板且带有入门内容的现有项目。\n\
  \n- 2. 在关卡编辑器中，单击工具栏上位于 **创建** 按钮。在 **基本** 类别中，有一个 **Box Trigger**，如下图所示。将 **Box\
  \ Trigger** 拖到关卡中的某个位置并放下：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_120_0.png)\n\
  \n图 4.21 – 创建 Box Trigger\n\n- 3. 调整 **Box Trigger** 的大小，并将其放置在关卡中玩家必须经过的位置。下图显示了一个示例。**Box\
  \ Trigger** 在游戏中是隐藏的：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_121_0.png)\n\n\
  图 4.22 – 调整大小并放置 Box Trigger\n\n- 4. 确认 **Box Trigger** 已被选中，通过单击关卡编辑器工具栏上的 **Blueprints**\
  \ 按钮并选择 **Open Level Blueprint** 来打开关卡蓝图。\n\n- 5. 右键单击 **Event Graph** 并添加位于 **Add\
  \ Event for Trigger Box 1** 类别中、标记为 **Add OnActorBeginOverlap** 的事件，如下图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_122_0.png)\n\
  \n图 4.23 – 为触发框添加事件\n\n- 6. 返回关卡编辑器。在内容浏览器中，转到 Content | StarterContent | Blueprints\
  \ 并打开 Blueprint_Effect_Sparks。\n\n- 7. On the Components tab, select the Sparks\
  \ Component and in the Details tab, search for the auto activate attribute and uncheck\
  \ it, as shown in the following screenshot. We did this so that the Sparks starts\
  \ inactive so we can activate it at runtime. Compile Blueprint_Effect_Sparks：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_123_0.png)\n\n图 4.24 – 禁用火花组件的自动激活\n\n\
  - 8. 在关卡编辑器中，将 **Blueprint_Effect_Sparks** 从 **Content Browser** 拖放到关卡中靠近 **Box\
  \ Trigger** 的位置以创建实例。\n\n- 9. Confirm that **Blueprint_Effect_Sparks** is selected\
  \ and open the Level Blueprint. Right-click on **Event Graph** and select **Create\
  \ a Reference to Blueprint_Effect_Sparks**，如下图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_124_0.png)\n\
  \n图 4.25 – 创建蓝图效果火花的引用\n\n- 10. Drag from the **Blueprint_Effect_Sparks** blue pin\
  \ of the node and drop it in the graph to open **Context Menu**。搜索 `activate` 并选择\
  \ **Activate (Sparks)**。Connect the white pin of the **OnActorBeginOverlap (TriggerBox)**\
  \ event to the white pin of the **Activate** function，如下图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_124_1.png)\n\
  \n图 4.26 – 重叠触发框时激活火花\n\n- 11. Compile the Level Blueprint and click the **Play**\
  \ button of the Level Editor to test the Level. Move your character to the location\
  \ of the **Box Trigger** to activate the sparks.\n\n在本示例中，我们了解了如何在关卡蓝图中添加角色的引用和事件。这就是\
  \ **关卡蓝图通信** 的精髓。\n\n蓝图和关卡蓝图之间还存在另一种通信形式，称为事件分派器。\n\n### 事件分派器\n\n**事件分派器** 允许一个\
  \ **蓝图** 在 **事件** 发生时通知其他蓝图。**关卡蓝图** 和其他蓝图类可以监听此 **事件**，并且在 **事件** 触发时可能有不同的 **动作**\
  \ 运行。\n\n我们在 **My Blueprint** 面板中创建事件分派器。作为示例，让我们创建一个名为 BP_Platform 的蓝图。当角色与 BP_Platform\
  \ 蓝图重叠时，它会调用一个名为 PlatformPressed 的事件分派器。关卡蓝图正在监听 PlatformPressed 事件，并在触发该事件时生成一个爆炸：\n\
  \n- 1. 创建或使用基于第三人模板且带有入门内容的现有项目。\n- 2. 创建一个蓝图并使用角色作为父类。将其命名为 BP_Platform 并在蓝图编辑器中打开它。\n\
  - 3. Click the Add button in the Components panel and choose the Static Mesh Component.\
  \ In the Details panel, choose the Shape_Cylinder Static Mesh and change the Z value\
  \ of the Scale attribute to 0.1. Also, change Collision Presets to OverlapAllDynamic,\
  \ as shown in the following screenshot：\n\n| 属性 | 值 |\n|----------|-------|\n| 缩放\
  \ Z | 0.1 |\n| 静态网格 | Shape_Cylinder |\n| 碰撞预设 | OverlapAllDynamic |\n\n图 4.27 –\
  \ 设置静态网格\n\n- 4. Compile the Blueprint. In the **My Blueprint** panel, create an\
  \ **Event Dispatcher** and name it `PlatformPressed`。An Event Dispatcher can have\
  \ input parameters. Let's create one to send a reference of the `BP_Platform` instance\
  \ that was overlapped. In the **Details** panel, create a new parameter in the **Inputs**\
  \ category, name it `BP_Platform`，并将其设置为 `BP Platform` 类型的对象引用，如下图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_127_0.png)\n\
  \n图 4.28 – 创建输入参数\n\n- 5. Right-click **Event Graph** and add **Event ActorBeginOverlap**。Drag\
  \ the `PlatformPressed` Event Dispatcher and drop it in **Event Graph**。Choose **Call**\
  \ in the submenu。Right-click **Event Graph**，search for `self`，and select the **Get\
  \ a reference to self** action。The **Self Action** returns a reference of the current\
  \ instance。Connect the **Actions**，如下图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_127_1.png)\n\
  \n图 4.29 – 调用 Platform Pressed 事件分派器\n\n- 6. Compile the Blueprint。In the Level\
  \ Editor，drag BP_Platform from Content Browser and drop it in the Level to create\
  \ an instance。\n\n- 7. Make sure the BP_Platform instance is selected and click\
  \ the **Blueprint** button at the toolbar of the Level Editor and choose Open Level\
  \ Blueprint。Right-click Event Graph and select Add Platform Pressed，如下图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_128_0.png)\n\
  \n图 4.30 – 在关卡蓝图中添加 Platform Pressed\n\n- 8. Right-click Event Graph，search for\
  \ spawn actor，and select Spawn Actor from Class。Click the drop-down menu in the\
  \ Class parameter and select Blueprint Effect Explosion。Drag from the blue pin of\
  \ the PlatformPressed (BP_Platform) Event，drop it in the graph to open Context Menu，and\
  \ choose the GetActorTransform Action。Connect the nodes，如下图所示：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_129_0.png)\n\
  \n图 4.31 – 生成蓝图效果爆炸的实例\n\n- 9. 编译关卡蓝图，并单击关卡编辑器的 **Play** 按钮来测试关卡。将角色移动到 `BP_Platform`\
  \ 所在位置。当角色与其重叠时，关卡蓝图会在同一位置生成一个爆炸：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_130_0.png)\n\
  \n图 4.32 – 触碰 BP_Platform 以生成爆炸\n\n我们了解到关卡蓝图可以监听事件分发器，但也可以通过绑定事件，让一个蓝图监听另一个蓝图的事件分发器。\n\
  \n### 绑定事件\n\n有一个 **Bind Event** 节点，可将一个事件绑定到另一个事件或事件分发器上，后者可能位于另一个蓝图中。当调用某个事件时，所有绑定到它的其他事件也会被调用。\n\
  \n例如，让我们创建 **Blueprint_Effect_Sparks** 的子蓝图类。这个新蓝图将一个事件绑定到我们在上一个示例中创建的 `BP_Platform`\
  \ 蓝图的 `PlatformPressed` 事件分发器上：\n\n- 1. 打开事件分发器示例中使用的项目。\n- 2. 创建一个蓝图，展开 **所有类**\
  \ 菜单，搜索 **Blueprint_Effect_Sparks**（将其用作父类），将其命名为 `BP_Platform_Sparks`，并在蓝图编辑器中打开它。\n\
  - 3. 在 **组件** 选项卡上，选择 **火花** 组件，在 **详情** 选项卡中搜索 `auto activate` 属性，如果已勾选则取消勾选。由于我们之前已在\
  \ **Blueprint_Effect_Sparks** 中更改此项，因此它应当已经是未勾选状态。\n- 4. 在 **我的蓝图** 面板中，创建名为 `BP_Platform`\
  \ 的 `BP_Platform` 类型对象引用变量。在 **详情** 面板中勾选 **实例可编辑** 属性：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_131_0.png)\n\
  \n图 4.33 – 创建 BP_Platform 类型的变量\n\n- 5. 右键单击 **事件图表** 并添加 **开始播放时**。将 `BP_Platform`\
  \ 变量从 **我的蓝图** 面板拖放到 **事件图表** 中。选择 **获取** 选项以创建节点。\n- 6. 从 **BP 平台** 节点的蓝色引脚拖线并放置到图表中以打开\
  \ **上下文菜单**。添加 **是否有效** 宏以测试 `BP_Platform` 变量是否引用了一个实例。将 **开始播放时** 的白色引脚连接到 **是否有效**\
  \ 宏的 **Exec** 引脚。\n- 7. 再次从 **BP 平台** 节点的蓝色引脚拖线并添加 **绑定事件到 PlatformPressed** 操作。将\
  \ **是否有效** 引脚连接到 **绑定事件** 节点的白色引脚：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_132_0.png)\n\
  \n图 4.34 – 绑定事件到 Platform Pressed 的操作\n\n- 8. 从 **绑定事件** 节点的红色引脚拖线，将其放置到图表中，并选择\
  \ **添加自定义事件**。\n- 9. 将 **火花** 组件从 **组件** 面板拖到图表中。从 **火花** 节点的蓝色引脚拖线，将其放置到图表中，并选择\
  \ **激活**。\n- 10. 如下图所示连接节点，并编译 `BP_Platform_Sparks`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_133_0.png)\n\
  \n图 4.35 – 绑定到 Platform Pressed 的自定义事件\n\n- 11. 在关卡中已有的 BP_Platform 实例附近添加一个 BP_Platform_Sparks\
  \ 实例。在关卡编辑器的 **详情** 面板中，单击 BP_Platform 变量的下拉菜单并选择一个实例。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_134_0.png)\n\
  \n图 4.36 – 引用关卡中的实例\n\n- 12. 单击关卡编辑器的 **Play** 按钮来测试关卡。将角色移动到 `BP_Platform` 的位置。当角色与其重叠时，`PlatformPressed`\
  \ 事件分发器会被触发，`BP_Platform_Sparks` 的自定义事件会被执行，从而激活火花：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_135_0.png)\n\
  \n图 4.37 – 触碰 BP_Platform 以激活火花\n\n### 总结\n\n本章非常实用。我们为每种蓝图通信类型创建了分步示例。我们了解到如何使用直接蓝图通信让一个蓝图引用另一个蓝图，以及如何在关卡蓝图中引用角色。我们学习了如何使用类型转换来访问子类的变量和函数，以及如何测试实例引用是否属于某个特定类。\n\
  \n我们了解到如何使用事件分发器在事件发生时通知我们，以及如何在关卡蓝图中响应此事件分发器。我们还了解到可以将另一个蓝图的事件绑定到事件分发器上。\n\n本章结束了第\
  \ 1 部分。我们现在已经掌握了在虚幻引擎 5 中开始编写游戏和应用程序脚本所需的蓝图基础知识。\n\n在第 2 部分，我们将从零开始通过分步教程构建一款第一人称射击游戏。在下一章中，我们将创建项目，向关卡添加对象，操作对象的材质，并添加移动。\n\
  \n### 测验\n\n- 1. 可以使用对象引用变量调用另一个蓝图的函数。\n  - a. 正确\n  - b. 错误\n\n- 2. 类型转换节点用于将对象引用转换为任何其他蓝图类的引用。\n\
  \  - a. 正确\n  - b. 错误\n\n- 3. 在关卡蓝图中，可以创建指向关卡中角色的引用。\n  - a. 正确\n  - b. 错误\n\n-\
  \ 4. 关卡蓝图无法监听蓝图类的事件分发器。\n  - a. 正确\n  - b. 错误\n\n- 5. 可以使用绑定事件节点将一个蓝图的事件绑定到另一个蓝图的事件分发器上。\n\
  \  - a. 正确\n  - b. 错误\n"
- '# 第 2 部分：开发游戏


  在本部分中，您将在分步教程的帮助下从零开始构建一款第一人称射击游戏。蓝图将用于开发游戏机制和用户界面。


  本部分包含以下章节：


  - 第 5 章，使用蓝图进行对象交互

  - 第 6 章，增强玩家能力

  - 第 7 章，创建屏幕 UI 元素

  - 第 8 章，创建约束和游戏目标

  '
- "## 第 5 章：使用蓝图进行对象交互\n\n在着手开发游戏时，探索您的想法的首要步骤之一是构建原型。幸运的是，虚幻引擎 5 和蓝图使快速让核心游戏功能运行起来比以往任何时候都更容易，因此您可以更早地开始测试您的想法。我们将首先使用一些默认资源和几个蓝图来原型化简单的游戏机制。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 创建新项目和关卡\n- 在关卡中放置对象\n- 通过蓝图更改对象的材质\n- 使用蓝图在世界中移动对象\n\n本章结束时，我们将学习如何创建一个蓝图目标，当它被击中时会更改其材质，并在两点之间定期来回移动。关卡中蓝图目标的每个实例都可以设置不同的速度、方向和改变方向的时间。\n\
  \n### 创建项目和第一个关卡\n\n在本节中，我们将首先使用虚幻引擎的一个模板创建项目。然后我们将探索该模板，查看它提供哪些游戏元素。\n\n我们的游戏将是一款第一人称射击游戏。因此，让我们使用\
  \ **第一人称** 模板创建项目，该模板位于 **游戏** 类别中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_140_0.png)\n\
  \n图 5.1 – 选择第一人称模板\n\n在游戏模板下方，您可以看到一个文件夹路径字段，用于指定要存储项目的位置。您可以使用默认文件夹或选择您偏好的文件夹。下一张截图显示了本项目中应使用的项目默认设置。这些\
  \ **项目默认设置** 选项在 _第 1 章：探索蓝图编辑器_ 中已有说明。还有一个 **项目名称** 字段，用于输入项目将使用的名称。我将项目命名为 `UE5BpBook`，如本截图所示：\n\
  \n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_141_0.png)\n\n图 5.2 – 我们游戏中使用的项目默认设置\n\
  \n现在我们已选择模板并按喜好配置项目设置，即可创建项目。具体步骤如下：\n\n- 1. 单击蓝色的 **创建** 按钮。引擎完成资源初始化并设置好项目后，**虚幻编辑器**将打开**关卡编辑器**。\n\
  \n- 2. 按 **开始** 按钮，尝试第一人称模板内置的默认游戏玩法。必须单击视口，游戏才能开始响应输入。\n\n可使用 W、A、S、D 键移动玩家角色，并通过移动鼠标环顾四周。可使用左键发射炮弹。炮弹会影响关卡中的一些物理对象。尝试向关卡中散落的白色方框射击，并观察它们移动。\n\
  \n- 3. 在 **开始** 模式下，**开始** 按钮将被 **暂停** 按钮、**停止** 按钮和 **弹出** 按钮替换。可按 _Shift + F1_\
  \ 调出鼠标光标并单击 **暂停** 按钮以暂时停止游戏会话，当你想要探索在游戏过程中刚刚遇到的交互或 **参与者** 的属性时，这很有用。\n\n单击 **停止**\
  \ 按钮将结束游戏会话并返回编辑模式。单击 **弹出** 按钮将相机与玩家分离，允许你在关卡中自由移动。在继续之前，请先试着玩一下游戏。\n\n### 向关卡中添加对象\n\
  \n现在，我们要开始向关卡中添加自己的对象。目标是创建一个简单的目标 **参与者**，当使用随附的枪支和炮弹射击它时，它会改变颜色。可按以下步骤创建一个简单的\
  \ **参与者**：\n\n- 1. 在 **关卡编辑器** 中，单击工具栏上的 **创建** 按钮。将鼠标悬停在 **形状** 上以显示子菜单，并将 **圆柱体**\
  \ 拖动到关卡中的某个位置并释放，以创建实例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_143_0.png)\n\
  \n图 5.3 – 向关卡中添加圆柱体形状\n\n此操作将创建一个新的 **圆柱体** 参与者并将其放置在我们的关卡中。你可以通过拖放随意重新定位圆柱体。你应该在视口以及\
  \ **世界大纲** 面板中看到该参与者，默认情况下它被命名为 **圆柱体**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_143_1.png)\n\
  \n图 5.4 – 世界大纲显示添加的圆柱体\n\n- 2. 在 **详细信息** 面板中，将 **圆柱体** 实例的名称更改为 `CylinderTarget`，如下所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_144_0.png)\n\n图 5.5 – 圆柱体形状的详细信息面板\n\n\
  我们已向关卡中添加一个将用作目标的参与者；现在我们将学习如何创建要应用到参与者的 **材质**。\n\n### 探索材质\n\n此前，我们设定了在圆柱体被炮弹击中时更改其颜色的目标。为此，需要更改参与者的\
  \ **材质**。材质是一种可添加到参与者网格以创建其外观的资源。你可以将材质视为涂在参与者网格或形状上的油漆层。由于参与者的材质决定其颜色，更改参与者颜色的一种方法是将其材质替换为不同颜色的材质。为此，我们先自行创建一个材质，它会使参与者呈现红色。\n\
  \n### 创建材质\n\n按以下步骤创建材质：\n\n- 1. 单击 **内容浏览器** 按钮打开内容浏览器，然后单击 `FirstPersonBP` 文件夹以访问它。单击\
  \ **添加** 按钮，选择 **新建文件夹**，并将其命名为 `Materials`。此步骤非必须，但保持项目文件层级整洁是良好做法。\n\n- 2. 导航到新建文件夹，在内容浏览器的空白处右键单击，选择\
  \ **材质** 以创建材质资源。将其命名为 `M_TargetRed`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_145_0.png)\n\
  \n图 5.6 – 创建材质资源\n\n### 材质属性与节点\n\n现在，让我们打开 **材质编辑器** 并学习如何使用修改材质的节点。\n\n以下是定义简单材质外观的步骤：\n\
  \n- 1. 双击 `M_TargetRed` 以打开用于编辑材质的新编辑器窗口，如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_146_0.png)\n\
  \n图 5.7 – 材质编辑器\n\n你现在正在查看材质编辑器，它与蓝图共享许多功能和惯例。屏幕中央称为图表，我们在此放置定义材质逻辑的所有节点。图表中央带有材质名称的节点称为材质的结果节点。如上一个屏幕截图所示，该节点有一系列输入引脚，其他材质节点可以附加到这些引脚上以定义材质的属性。\n\
  \n- 2. 为材质赋予颜色，需要创建一个节点，将颜色信息提供给该节点上标记为 **基础颜色** 的输入。为此，在节点附近的空白处右键单击。将出现一个带有搜索框和长长的可展开选项列表的弹出窗口：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_147_0.png)\n\n图 5.8 – 材质节点菜单\n\n此操作显示所有可添加到该材质的材质节点选项。搜索框具有上下文感知功能，因此如果你开始输入有效节点名称的前几个字母，你会看到搜索字段下方的列表缩小，只包含名称中带有这些字母的节点。我们要找的节点称为\
  \ **矢量参数**，因此在搜索框中输入该名称，并单击 **矢量参数** 结果将该节点添加到图表中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_148_0.png)\n\
  \n图 5.9 – 添加矢量参数节点\n\n- 3. 将添加的节点重命名为 `Color`。材质编辑器中的矢量参数允许我们定义颜色，然后可以将其附加到高大的材质定义节点上的\
  \ **基础颜色** 输入。\n\n- 4. 首先需要为节点提供颜色选择。双击节点中间的黑色方块以打开 **颜色选择器**。我们希望目标被击中时呈现明亮的红色，因此可将颜色轮中的中心点拖动到红色区域，或手动填写\
  \ RGB 或十六进制值。选定要使用的红色色调后，单击 **确定**。你会注意到矢量参数节点中的黑色方框现已变为红色：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_149_0.png)\n\
  \n图 5.10 – 颜色选择器面板\n\n最后一步是将我们的颜色矢量参数节点链接到基础材质节点。与蓝图类似，可以通过从一个节点的输出引脚单击并拖动到另一个节点来连接两个节点。输入引脚位于节点左侧，而输出引脚始终位于右侧。对于我们的材质，需要从\
  \ **颜色** 节点的顶部输出引脚单击并拖动一根线到材质节点的 **基础颜色** 输入引脚，如下一个屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_150_0.png)\n\
  \n图 5.11 – 设置材质的基础颜色\n\n可使用 **基础颜色** 输入引脚定义简单材质。接下来我们将看到如何使用材质节点的其他输入引脚。\n\n###\
  \ 为材质添加质感\n\n可选择利用材质定义节点上的其他一些输入引脚为材质添加一些精修效果。应用平面单色材质时，3D 对象看起来不真实，但通过设置材质的 **金属度**\
  \ 和 **粗糙度** 输入值，可以增加额外的反射率和深度。具体步骤如下：\n\n- 1. 在空白网格区域右键单击，并在搜索框中键入 `scalarpa`。我们要找的节点称为\
  \ **标量参数**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_150_1.png)\n\n\n\n\n图 5.12\
  \ – 添加标量参数节点\n\n- 2. 拥有 **标量参数** 节点后，选中它并转到 **详情** 面板。**标量参数** 接受单个浮点值。将 **默认值**\
  \ 设置为 `0.1`，因为我们希望对 Material 的任何附加效果都要微妙。\n\n- 3. 将 **参数名称** 更改为 **金属度**，然后将 **金属度**\
  \ 节点的输出引脚拖动到 Material 定义节点的 **金属度** 输入引脚上。\n\n- 4. 让我们为 **粗糙度** 参数添加一个额外连接，因此右键单击刚创建的\
  \ **金属度** 节点并选择 **复制**。这会生成该节点的副本，但不带线连接。\n\n- 5. 选中这个副本 **金属度** 节点，然后将 **详情** 面板中的\
  \ **参数名称** 字段更改为 **粗糙度**。为该节点保持相同的默认值 `0.1`。\n\n- 6. 单击并拖动 **粗糙度** 节点的输出引脚到 Material\
  \ 定义节点的 **粗糙度** 输入引脚。\n\n我们的 Material 效果应如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_151_0.png)\n\
  \n图 5.13 – M_TargetRed Material 的结果\n\n我们现在已制作出一个闪亮的红色 Material，确保我们的目标在被击中时显眼突出。单击编辑器左上角的\
  \ **保存** 按钮以保存资产。关闭 Material Editor 以返回 Level Editor。\n\n我们已学习如何使用 Material Editor\
  \ 通过 **基础颜色**、**金属度** 和 **粗糙度** 输入引脚创建简单 Material。在下一部分，我们将了解如何在运行时更改角色的 Material。\n\
  \n### 创建目标 Blueprint\n\n我们现在在世界中有一个圆柱体，以及希望在圆柱体被击中时应用到圆柱体上的 Material。交互的最后部分是游戏逻辑，它会评估圆柱体是否被击中，然后将圆柱体上的\
  \ Material 更改为我们的新红色 Material。要创建此行为，我们必须将圆柱体转换为 Blueprint。为此，请执行以下步骤：\n\n- 1. 确保在\
  \ **关卡** 中选中了 `CylinderTarget` 对象。在 **详情** 面板中，单击 **添加** 按钮右侧的图标：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_152_0.png)\n\
  \n图 5.14 – 从 **关卡** 中的角色创建 Blueprint\n\n- 2. 随后将出现标题为 **根据选择创建 Blueprint** 的窗口。将\
  \ Blueprint 重命名为 `BP_CylinderTarget`。在 **路径** 字段中，选择 `/Game/FirstPersonBP/Blueprints`\
  \ 文件夹。在创建方法中，使用 **新子类** 选项。**静态网格 Actor** 父类已被选中，因为它是 **圆柱体** 角色的父类。单击 **选择** 按钮以创建\
  \ Blueprint：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_153_0.png)\n\n图 5.15 –\
  \ 从 **关卡** 中的角色创建 Blueprint\n\nBlueprint Editor 将在 **视图** 选项卡中打开 `BP_CylinderTarget`。您可以看到，该\
  \ Blueprint 已经有一个分配了圆柱体网格的静态网格组件。\n\n我们将在 *第 6 章：增强玩家能力* 中探讨组件的使用；目前，我们希望创建一个能响应击中的简单\
  \ Blueprint。为此，请单击 **事件图表** 选项卡。\n\n### 检测命中\n\n要创建命中检测机制，请执行以下步骤：\n\n- 1. 要创建命中检测事件，请在事件图表的空白处右键单击，并在搜索框中输入\
  \ `hit`。我们要找的是 **事件命中** 节点，因此当它出现在搜索结果中时请选中它。**事件命中** 每当另一个角色撞击此 Blueprint 控制的角色时都会触发：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_154_0.png)\n\n图 5.16 – 添加 **事件命中**\n\n\
  现在我们有了 **事件命中** 节点，需要找到一个操作，以便我们可以更改角色的 Material。\n\n- 2. 从 **事件命中** 节点的白色执行引脚拖动一根线到空白处以打开上下文菜单。在搜索框中输入\
  \ `set material`。我们要选择的节点称为 **设置材质 (StaticMeshComponent)**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_155_0.png)\n\
  \n图 5.17 – 添加 **设置材质** 节点 (StaticMeshComponent)\n\n### 重要信息\n\n如果在 **上下文敏感** 搜索中找不到要查找的节点，请尝试取消选中\
  \ **上下文敏感**，以便从完整的节点选项列表中查找。即使在 **上下文敏感** 搜索中找不到该节点，仍有可能该节点可与您尝试附加的节点配合使用。\n\n我们已添加\
  \ **设置材质** 节点，但现在需要调整其输入参数。\n\n### 更换 Material\n\n放置 **设置材质** 节点后，请注意它已通过其输入执行引脚连接到\
  \ **事件命中** 节点的输出执行引脚。现在，每当该 Blueprint 的角色撞击另一个角色时，此 Blueprint 就会触发 **设置材质** 操作。但是，我们尚未设置在调用\
  \ **设置材质** 操作时将使用的 Material。如果不设置 Material，该操作会触发，但不会对圆柱体目标产生任何可观察的效果：\n\n- 1. 要设置将使用的材质，请单击设置材质节点内材质下方标记为“选择资产”的下拉字段。在出现的资产查找器窗口中，在搜索框中输入\
  \ `red` 以查找我们之前创建的 M_TargetRed 材质。单击该资产会将其附加到设置材质节点内的材质字段：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_156_0.png)\n\
  \n图 5.18 – 选择 M_TargetRed 材质\n\n- 2. 我们现在已使用此 Blueprint 完成了将目标圆柱体变红所需的所有操作。编译并保存\
  \ Blueprint。\n\n现在我们已设置好基本的游戏交互，明智的做法是测试游戏，以确保一切都按我们想要的方式进行。您可以单击 Blueprint Editor\
  \ 的播放按钮来测试游戏。尝试射击并撞击您创建的 `BP_CylinderTarget` 角色：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_157_0.png)\n\
  \n图 5.19 – 如果有东西撞击它，圆柱体会变红\n\n在下一部分，我们将探讨如何改进 `BP_CylinderTarget` Blueprint。\n\n\
  ### 改进 Blueprint\n\n运行游戏时，我们看到当玩家枪支发射的弹丸击中圆柱体目标时，它会改变颜色。这是一种可用于让敌人响应玩家操作的游戏框架的开端。但是，您可能也注意到，当玩家直接撞击圆柱体目标时，它也会改变颜色。请记住，我们希望圆柱体目标仅在被玩家弹丸击中时变红，而不因任何其他物体与其碰撞而变红。在涉及脚本编写时，这类意外结果很常见，而避免这些结果的最佳方法是在构建过程中尽可能经常通过游玩来检查您的工作。\n\
  \n要修复我们的 Blueprint，使圆柱体目标仅在响应玩家弹丸时改变颜色，请返回 **BP_CylinderTarget** 选项卡并再次查看 **事件命中**\
  \ 节点。\n\n**事件命中** 节点上的其余输出引脚是存储事件数据的变量，这些数据可传递给其他节点。引脚的颜色表示它们传递的数据变量类型。蓝色引脚传递对象（例如角色），而红色引脚包含布尔值（`true`\
  \ 或 `false`）变量。\n\n标记为 **其他** 的蓝色输出引脚包含对撞击圆柱体目标的另一个角色的引用。这对我们很有用，可以确保圆柱体目标仅在被玩家发射的弹丸击中时改变颜色，而不是因为任何可能撞上它的其他角色而改变颜色。\n\
  \n让我们做一个更改，以确保我们仅在响应玩家弹丸击中时触发圆柱体目标。将 **事件命中** 节点向左拖动以给另一个节点腾出空间，然后从 **其他** 输出引脚单击并拖动一根线到空白处。在上下文菜单中，输入\
  \ `projectile`。您应该能看到类似于以下屏幕截图的一些结果。我们要找的节点称为 **转换为 FirstPersonProjectile**：\n\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_159_0.png)\n\n图 5.20 – 添加 Cast To 节点\n\
  \nFirstPersonProjectile 是包含在 Unreal Engine 5 **第一人称** 模板中的 Blueprint，用于控制从枪支发射的弹丸的行为。`Cast`\
  \ 节点用于确保，仅当击中圆柱体目标的 Actor 是 `FirstPersonProjectile` 的实例时，附加到该节点执行引脚上的 Action 才会发生。\n\
  \n节点出现后，您应该已经能看到 **事件 Hit** 节点的 **Other** 输出引脚与转换节点的 **Object** 引脚之间有一条蓝色连线。将 **事件\
  \ Hit** 的白色执行引脚连接到 **转换为 FirstPersonProjectile** 节点的执行引脚，并将 **转换为 FirstPersonProjectile**\
  \ 节点的输出执行引脚连接到 **设置材质** 节点的执行引脚：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_160_0.png)\n\
  \n图 5.21 – 事件 Hit 操作\n\n现在，编译、保存，然后单击 **播放** 按钮再次测试游戏。\n这次，当您走上前去触摸圆柱体目标时，应该会注意到它保留默认颜色；\n\
  但如果您退后开枪射击它，它会变成红色。\n\n我们学习了如何使用 **转换为 FirstPersonProjectile** 节点，以确保只有当与 Blueprint\
  \ 交互的实例属于特定类时，才会执行某些 Action。在下一节中，我们将使圆柱体目标在关卡中移动。\n\n### 添加移动\n\n现在我们有了一个对玩家射击做出反应的目标，可以添加某种挑战，让我们的项目开始像一款游戏。实现此目的的简单方法是为目标添加一些移动。为此，我们首先必须声明目标\
  \ Actor 是一个旨在移动的对象，然后需要在 Blueprint 中设置逻辑来管理其移动方式。我们的目标是让圆柱体目标在关卡中来回移动。\n\n### 更改\
  \ Actor 的移动性和碰撞设置\n\n为了让目标移动，我们首先必须将其移动性设置更改为 **可移动**。这样在游戏过程中就可以操纵 Actor。执行以下步骤：\n\
  \n### 重要信息\n\n默认情况下，放置在世界中的基础 Actor 设置为 **静态**。**静态**意味着对象在游戏过程中无法移动或被操纵。**静态**对象的渲染资源消耗显著较低，对于非交互对象，这应是我们的默认选择，以便最大化帧率。\n\
  \n1. 再次打开 BP_CylinderTarget。在 **组件** 面板中，选择 Static Mesh 组件。在 **详细信息** 面板中，将位于 **变换**\
  \ 属性下方的 **移动性** 切换开关从 **静态** 切换为 **可移动**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_161_0.png)\n\
  \n图 5.22 – 将移动性更改为 **可移动**\n\n因为我们想用枪瞄准此对象，还需要确保目标可被碰撞，以便子弹不会穿过它。\n\n2. 在 **详细信息**\
  \ 面板中，找到名为 **碰撞** 的类别，并在下拉菜单中查找 **碰撞预设**。此下拉菜单中有许多其他选项，选择 **自定义** 选项后，您甚至可以分别设置对象与不同对象类型的碰撞交互。出于我们的目的，只需确保此下拉菜单设置为\
  \ BlockAllDynamic：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_162_0.png)\n\n图 5.23\
  \ – 碰撞预设必须为 BlockAllDynamic\n\n### 分解目标\n\n现在我们已使目标可移动，可以设置告诉圆柱体如何移动的 Action 了。要移动圆柱体，我们需要四个数据：\n\
  \n- 圆柱体当前位于何处？\n- 它应该朝哪个方向移动？\n- 移动速度应为多少？\n- 何时在方向之间切换？\n\n我们将使用一个函数来获取当前位置，该函数返回圆柱体在世界中的坐标。速度、方向和更改方向的时间是我们提供给\
  \ Blueprint 的值，但需要一些计算才能将这些值转换为 Blueprint 可用于移动对象的信息。\n\n执行以下步骤：\n\n1. 在 **我的蓝图**\
  \ 面板中，创建名为 `speed` 的变量。此变量将保存一个数字，表示 `BP_CylinderTarget` 的移动速度。在 **详细信息** 面板中，将\
  \ **变量类型** 更改为 **浮点数** 并勾选 **可实例编辑** 属性：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_163_0.png)\n\
  \n图 5.24 – `Speed` 变量\n\n2. 编译 Blueprint 以便设置默认值。将 **默认值** 设置为 200.0：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_164_0.png)\n\
  \n图 5.25 – `Speed` 变量的默认值\n\n3. 在 **我的蓝图** 面板中，创建另一个 **浮点数** 变量并命名为 `TimeToChange`。勾选\
  \ **可实例编辑** 属性。编译 Blueprint 并将 **默认值** 设置为 `5.0`。这意味着圆柱体将在 5 秒后更改方向：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_164_1.png)\n\
  \n图 5.26 – `TimeToChange` 变量\n\n4. 在 **我的蓝图** 面板中，创建另一个名为 Direction 的变量。在 **详细信息**\
  \ 面板中，将 **变量类型** 更改为 **向量** 并勾选 **可实例编辑** 属性：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_165_0.png)\n\
  \n图 5.27 – **向量** 类型的 Direction 变量\n\n5. 向量包含 X、Y 和 Z 浮点数值。编译 Blueprint 并将 Y 轴的\
  \ **默认值** 设置为 1.0。这意味着它将沿 Y 轴正方向移动：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_165_1.png)\n\
  \n### 为计算做好方向准备\n\n现在，让我们探索获取所需信息以提供移动指令所需的步骤。乍看之下可能令人生畏，但我们将逐一分析每个部分，并了解每个节点如何融入更大的目标。\n\
  \n我们需要执行的第一个计算是获取方向的向量值并将其归一化。归一化是向量数学中的常见过程，可确保向量转换为长度为 1 个单位的向量，从而使其与其余计算兼容。幸运的是，有一个\
  \ Blueprint 节点可以为我们处理此问题：\n\n1. 将 `Direction` 变量从 **我的蓝图** 面板拖动并放置到 EventGraph 中。选择\
  \ **获取方向** 选项以创建节点。\n\n2. 从 **Direction** 节点的输出引脚拖动并放置到图表中以打开上下文菜单。搜索 `normalize`\
  \ 并选择 **向量** 类别下方的 **归一化** 节点。这会将我们的 **Direction** 变量连接到一个节点，该节点会自动为我们执行归一化计算：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_166_0.png)\n\n图 5.29 – 归一化向量\n\n### 重要信息\n\
  \n在创建 Blueprint 时，为其添加注释是一种良好的做法。注释可以帮助描述某组 Blueprint 旨在完成的任务，如果您一段时间后返回某个 Blueprint\
  \ 并需要理解之前的工作，这将非常有用。要为 Blueprint 添加注释，请单击并拖动选择框围绕您希望添加注释的节点以选中它们。然后，在选定的节点上单击右键，并选择底部选项\
  \ **根据选择创建注释**。\n\n### 使用 delta time 获取相对速度\n\n**增量时间** 是上一帧绘制时间与当前帧之间的时间差。使用 **增量时间**\
  \ 是因为游戏帧之间所花的时间可能不同。通过将速度值乘以 **增量时间**，我们可以确保对象移动的速度相同，无论游戏帧率如何：\n\n1. 将 **速度** 变量从\
  \ **我的蓝图** 面板拖动并放置到 EventGraph 中。选择 **获取速度** 选项以创建节点。\n2. 在 EventGraph 的空白处单击右键以打开上下文菜单并搜索\
  \ `delta`。选择 **获取世界增量秒** 选项。\n3. 从 **速度** 节点的输出引脚拖动并放置到空白处。在搜索字段中输入星号（*）（大多数计算机上为\
  \ Shift + 8），然后选择 **乘法** 节点：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_168_0.png)\n\
  \n图 5.30 – 添加 Multiply 节点\n\n- 4. 从 **Get World Delta Seconds** 节点的输出引脚拖动，并放置到 **Multiply**\
  \ 节点的另一个输入引脚上，以相乘这两个值，如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_168_1.png)\n\
  \n图 5.31 – 将速度与增量秒数相乘\n\n### 更新位置\n\n现在我们有了归一化的向量方向和相对于时间的速度值，需要将这两个值相乘并添加到当前位置：\n\
  \n- 1. 从 **Normalize** 节点的输出引脚拖动并放置到空白区域。在搜索字段中输入星号 (*) 并选择 **Multiply** 节点。\n\n\
  - 2. 上一步创建了一个 **Vector x Vector** 节点，但我们需要将向量与浮点数相乘。因此，右键单击第二个输入引脚，悬停在 **Convert\
  \ Pin...** 上，并选择 **Float**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_170_0.png)\n\
  \n图 5.32 – 转换乘法输入引脚\n\n- 3. 将 Float x Float 节点的输出引脚连接到我们转换的 Float 输入引脚，如下屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_171_0.png)\n\n图 5.33 – 将向量与浮点数相乘\n\n\
  - 4. 我们将使用 **Event Tick** 来更新圆柱体的位置。在 EventGraph 的空白区域右键单击以打开上下文菜单并搜索 `tick`。选择\
  \ **Event Tick** 选项。\n\n- 5. 要移动 Actor，我们将使用 **AddActorWorldOffset** 节点。该节点有一个名为\
  \ **Delta Location** 的输入参数，它是一个表示 Actor 位置变化的向量。右键单击以打开上下文菜单，搜索并添加 **AddActorWorldOffset**\
  \ 节点。将 **Event Tick** 连接到 **AddActorWorldOffset** 节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_172_0.png)\n\
  \n图 5.34 – 使用 Event Tick 更新位置\n\n- 6. 将 Vector x Float 节点的输出引脚连接到 Delta Location\
  \ 输入引脚。已完成，Event Tick 如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_172_1.png)\n\
  \n图 5.35 – Event Tick 的所有操作\n\n在本节中，我们学习了如何使用归一化向量、增量时间和速度来移动我们的圆柱体目标。现在编译蓝图，保存，并运行游戏。请注意，圆柱体目标会在游戏开始时立即根据定义的速度和方向移动。但是，由于我们没有任何导致目标停止移动的指令，它将在游戏运行期间始终沿同一方向前进，甚至会穿过对象并移出我们创建的关卡。为避免此问题，在下一节中，我们将使圆柱体目标定期更改其方向。\n\
  \n### 更改方向\n\n在本节中，我们将实现定期更改目标方向的逻辑。这将导致目标在两点之间定期来回移动，很像射击场目标：\n\n- 1. 在 EventGraph\
  \ 的空白区域右键单击以打开上下文菜单并搜索 `custom event`。选择 **Add Custom Event** 选项。将事件重命名为 `ChangeDirection`：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_173_0.png)\n\n图 5.36 – 创建自定义事件\n\n- 2.\
  \ 我们将通过将 **Direction** 向量乘以 -1 来反转它：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_173_1.png)\n\
  \n图 5.37 – 通过将向量乘以 -1 来反转向量的方向\n\n- 3. 从 **My Blueprint** 面板拖动 **Direction** 变量并将其放置到\
  \ EventGraph 中。选择 **Get Direction** 选项以创建节点。\n\n- 4. 从 **Direction** 节点的输出引脚拖动并放置到空白区域。在搜索字段中输入星号\
  \ (*) 并选择 **Multiply** 节点。\n\n- 5. 上一步创建了一个 **Vector x Vector** 节点，但我们需要将向量与浮点数相乘。因此，右键单击第二个输入引脚，悬停在\
  \ **Convert Pin...** 上，并选择 **Float**。在 **Float** 参数中插入 `-1`。\n\n- 6. 从 **My Blueprint**\
  \ 面板拖动 `Direction` 变量并将其放置到 EventGraph 中。现在，选择 **Set Direction** 选项以创建节点。将 **Set\
  \ Direction** 节点连接到 **Multiply** 节点的输出引脚和 **ChangeDirection** 事件。这完成了 **ChangeDirection**\
  \ 事件。\n\n- 7. 我们将使用 **timer** 定期运行 **ChangeDirection** 事件。在 EventGraph 的空白区域右键单击以打开上下文菜单并搜索\
  \ `timer_event`。选择 **Set Timer by Event** 选项。检查 **Looping** 参数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_174_0.png)\n\
  \n图 5.38 – 添加 Set Timer by Event 节点\n\n- 8. 右键单击以打开上下文菜单并添加 Event BeginPlay。从 My\
  \ Blueprint 面板拖动 TimeToChange 变量并选择 **Get TimeToChange** 选项。如下屏幕截图所示连接节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_175_0.png)\n\
  \n图 5.39 – 计时器将定期运行 ChangeDirection 事件\n\n- 9. 编译并保存蓝图。\n\n### 测试移动目标\n\n现在我们已更新蓝图，可以测试以确保\
  \ BP_CylinderTarget 实例按预期移动。首先，必须将 BP_CylinderTarget 实例放置在允许其沿 y 轴移动而不会碰到其他对象的位置。我使用的坐标是\
  \ x 轴上 220，y 轴上 -600，z 轴上 220。\n\n请注意，这些值仅相对于 **First Person** 模板关卡的默认布局有效。如果您已调整关卡，则可以调整关卡中圆柱体的位置，或更改实例可编辑变量的值，例如速度、更改时间或方向，如下屏幕截图所示，并测试直到找到合适的巡逻点。单击\
  \ **Play**。如果蓝图正常工作，则将看到圆柱体以恒定速度在两点之间来回移动：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_176_0.png)\n\
  \n图 5.40 – 这些变量可在实例中编辑\n\n您可以添加其他 `BP_CylinderTarget` 实例并尝试其他方向，例如沿 *x* 轴或上下（即 *z*\
  \ 轴）。\n\n### 摘要\n\n在本章中，我们使用第一人称射击模板创建了一个项目和初始关卡。然后，我们设置了一个目标对象，它会通过改变外观来响应玩家的枪击。最后，我们设置了一个蓝图，使我们能够快速创建移动目标。在此学到的技能将为构建后续章节中更复杂的交互行为，甚至您自己制作的整个游戏，奠定坚实基础。\n\
  \n您可能希望花些额外时间修改原型，以包含更具吸引力的布局或具有更快移动目标的功能。在继续构建游戏体验时，请记住，您始终可以停留在某个部分并尝试自己的功能或自定义。蓝图可视化脚本最大的好处之一是测试新想法的速度，而您学到的每一项额外技能都将为您可以探索和原型化的游戏体验解锁指数级更多可能性。\n\
  \n在下一章中，我们将更深入地了解随 **First Person** 模板提供的玩家控制器。我们将扩展管理玩家移动和射击的现有蓝图，使用一款根据我们喜好调整的枪支，产生更有趣的视觉效果和音效。\n\
  \n### 测验\n\n- 1. 不能使用蓝图脚本更改网格的材质。\n  - a. 正确\n  - b. 错误\n\n- 2. 您可以使用关卡中的 Actor\
  \ 创建蓝图类。\n  - a. 正确\n  - b. 错误\n\n- 3. Normalize 函数的结果向量是长度等于 1 的向量。\n  - a. 正确\n\
  \  - b. 错误\n\n- 4. 计时器等待执行事件的时间称为增量时间。\n  - a. 正确\n  - b. 错误\n\n- 5. Event Tick\
  \ 在每一帧执行。\n  - a. 正确\n  - b. 错误\n\n\n\n\n"
- '## 第 6 章：增强玩家能力


  在本章中，我们将通过对玩家角色 Blueprint 进行修改，来扩展在第 5 章“使用 Blueprints 进行对象交互”中创建的核心射击交互。First Person
  模板附带的玩家角色 Blueprint 起初看起来很复杂，尤其是与我们从头开始创建的相对简单的 Cylinder 目标 Blueprint 相比。我们将深入研究这个
  Blueprint 并将其拆解，以了解其各个部分如何为玩家体验做出贡献，并使他们能够控制角色并射击枪支。


  直接使用现成可用的资产固然快速简便，无需花时间去了解其实现功能的方式。然而，我们希望确保能够在问题出现时及时修复，同时更好地扩展玩家控制功能以满足我们的需求。因此，在将任何外部资产引入正在构建的项目之前，花些时间去调查和了解它们总是明智的。


  在本章结束时，我们希望成功修改玩家角色，以便添加冲刺、缩放视图的能力，并能够配合令人愉快的爆炸和音效摧毁我们射击的物体。在实现这些目标的过程中，我们将涵盖以下主题：


  - 玩家输入和控制

  - 视野（FOV）

  - 时间轴和分支逻辑

  - 向对象交互添加音效和粒子效果


  ### 添加跑步功能


  我们将通过添加简单功能来开始探索 `FirstPersonCharacter` Blueprint，这将为玩家在关卡中移动提供更多战术选择。目前，玩家仅能以单一速度移动。我们将调整
  Blueprint，当玩家按下 _左 Shift_ 键时增加 **角色移动** 组件的移动速度，但首先，让我们了解 `FirstPersonCharacter`
  的 **事件图** 中存在哪些 **动作**。


  ### 拆解角色移动


  首先，打开 `FirstPersonCharacter` Blueprint。在 **内容浏览器** 中，访问 `Content | FirstPersonBP
  | Blueprints` 文件夹并双击 `FirstPersonCharacter` Blueprint。您将打开 **事件图** 并看到一大系列 Blueprint
  节点。您可以通过右键点击图表并拖动来浏览 **事件图**。我们将要查看的第一组节点由 **事件图** 中标记为 **摇杆输入** 的注释框限定，如下所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_181_0.png)


  ### 图 6.1 – 摇杆输入 事件


  红色 Event 节点会在每一帧触发，并传递来自控制器输入的 **转向速率** 和 **观察速率** 的 **轴值**。这些值通常映射到模拟摇杆的左/右和上/下轴触发器。请注意，只有两个轴触发器。检测向下看或向左转的
  Event 由这些节点本身覆盖，并在传递的 **轴值** 中表示为负数。


  接着，来自两个轴触发器的值分别乘以一个变量，该变量表示玩家预期能够转身或向上/向下观察的基础速率。这些值还会乘以世界增量秒数，以针对不同帧率进行归一化，尽管触发器每帧都会被调用。将所有三个输入相乘所得的值随后传递给
  **添加控制器俯仰输入** 和 **添加控制器偏航输入** 函数。这些函数用于在控制器输入与玩家相机效果之间添加转换。


  在 **摇杆输入** Blueprint 节点组下方，还有一个名为 **鼠标输入** 的注释块，它看起来与 **摇杆输入** 组非常相似：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_182_0.png)


  ### 图 6.2 – 鼠标输入 事件


  鼠标输入将鼠标移动（与控制器轴摇杆不同）的输入转换为数据，然后将这些值直接传递给相应的相机偏航和俯仰输入函数，而无需进行类似于模拟输入所需的计算。


  现在，让我们来看看管理玩家移动的节点组，如该屏幕截图所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_183_0.png)


  ### 图 6.3 – 移动输入 事件


  **选择** 节点用于测试玩家是否正在使用 **虚拟现实头戴式显示器（VR HMD）**。如果启用了 VR HMD，则使用的矢量来自 **第一人称相机**；否则，使用的矢量来自
  Actor 根组件。


  从功能上讲，其他节点的设置与 **摇杆输入** 和 **鼠标输入** 组类似。轴值来自控制器或键盘上的前进和右侧移动轴输入。同样，这些节点也表示向后和向左的移动，形式为
  **轴值** 输出中的负值。移动转换中显著的区别在于，我们需要知道 Actor 将要移动的方向，以便将移动幅度应用到正确方向。方向从 **获取 Actor 矢量**
  节点（前进和右侧）获取，并连接到 **添加移动输入** 节点的 **世界方向** 输入。


  最后要查看的与移动相关的节点组是包含在标记为 **跳跃** 的注释块中的节点组。该组仅由一个触发节点组成，用于检测映射到跳跃的按键的按下和释放，并在按钮按下到释放期间应用
  *跳跃* 函数。


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_184_0.png)


  ### 图 6.4 – 跳跃输入 事件


  我们查看了控制角色移动的 *第一人称角色* 的 **动作**。现在我们将学习如何将按键映射到 **动作**。


  ### 自定义控制输入


  我们已了解 **第一人称** 模板如何将某些玩家输入 **动作**（例如前进或跳跃）映射到 Blueprint 节点，以产生 **动作** 的行为。要创建新的行为类型，我们需要将新的物理控制输入映射到其他玩家
  **动作**。为此，请执行以下步骤：


  - 1. 要更改游戏的输入设置，请单击工具栏最右侧的 设置 按钮，并选择 项目设置 选项：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_185_0.png)


  ### 图 6.5 – 访问 项目设置


  - 2. 在出现的窗口左侧，查找 Engine 类别并选择 Input 选项。


  - 3. 在 Engine 类别中，在 Input Settings 菜单下，您会看到 Bindings 类别下的两个部分，称为 **动作映射** 和 轴映射。单击每个部分左侧的
  > 符号以显示现有映射。


  **动作映射** 是触发玩家 **动作** 的按键和鼠标单击 Event。轴映射 映射玩家移动以及具有范围的 Event，例如 W 键和 S 键都会影响 向前移动
  **动作**，但处于范围的两端。我们的 冲刺 和 缩放 函数都是简单的 **动作**，要么处于活动状态，要么处于非活动状态，因此我们将它们添加为 **动作映射**：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_186_0.png)


  ### 图 6.6 – 创建 动作映射


  - 4. 在 **动作映射** 旁边单击两次 + 号以添加两个新的 **动作映射**。


  - 5. 为第一个 **动作** 命名为 冲刺，并从下拉菜单中选择 Left Shift 键，将该键映射到您的 冲刺 Event。为第二个 **动作** 命名为
  缩放，并将其映射到右鼠标按钮。


  关闭窗口时，更改将被保存。


  ### 添加冲刺能力


  现在我们已基本了解移动输入节点如何获取控制器输入并将其应用于游戏内角色，我们将通过添加冲刺能力来扩展该功能。我们将在 FirstPersonCharacter
  Blueprint 中设置一组新的节点。它们将如下所示：




  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_187_0.png)


  图 6.7 – 实现冲刺能力


  首先，我们需要添加用于激活我们 **Sprint** 动作的 事件。回顾一下，我们之前已将 **Sprint** 动作映射到 *Left Shift* 键。要添加
  事件，请执行以下步骤：


  - 1. 右键单击其他移动函数左侧的空白网格区域，搜索 `sprint`。选择 **Sprint** 事件以放置节点。


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_187_1.png)


  图 6.8 – 添加输入动作 Sprint 事件


  - 2. 查看 Blueprint 编辑器的 **组件** 面板，并选择 **Character Movement (CharMoveComp) (Inherited)**。**详细信息**
  面板将更改为显示与移动相关的一长串变量，如下一张屏幕截图所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_188_0.png)


  图 6.9 – 角色移动变量


  在此变量列表中，您可以在 **行走** 类别中找到 **最大步行速度**。这是决定玩家可移动最大速度的值，应是我们 **冲刺** 函数的目标。但是，将 **详细信息**
  面板中的值从默认的 600 更改，将无论是否按下 **Left Shift** 键都始终修改玩家的移动速度。相反，我们希望将此值从 **角色移动** 组件中提取出来，放入我们蓝图的
  **事件图** 中。


  - 3. 为此，单击 **组件** 面板中的 **角色移动** 组件，并将其拖放到 **事件图** 上，靠近我们的 **输入动作 Sprint** 事件。这将生成一个
  **角色移动** 节点，如本屏幕截图所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_189_0.png)


  图 6.10 – 角色移动节点


  - 4. 从 **角色移动** 节点的输出引脚单击并拖动到空白网格区域，然后输入 `walk speed`。选择 **设置最大步行速度** 选项。它将 **角色移动**
  节点连接到新节点，以设置最大步行速度值。


  - 5. 将 **输入动作 Sprint** 触发器的 **按下** 输出执行引脚连接到 **设置最大步行速度** 节点的输入执行引脚，以便您可以按下 **Left
  Shift** 键来修改最大移动速度。


  - 6. 最后，将节点中的 **最大步行速度** 值从 `0.0` 更改为 `2200`，相对于默认值 `600` 提供良好的速度提升。


  我们还需要确保在释放 *Shift* 键后玩家再次减速。


  - 7. 为此，再次从 **角色移动** 节点拖动输出引脚，然后搜索并选择另一个 **设置最大步行速度** 节点将其放置在 **事件图** 上。这次，将 **输入动作
  Sprint** 节点的 **释放** 输出执行引脚连接到新节点的输入执行引脚。然后，将 **最大步行速度** 值从 `0.0` 更改为默认值 `600`。为了保持良好的注释实践，单击并绘制选择框围绕所有四个节点，右键单击其中一个选中的节点，然后选择
  **从选择创建注释**，然后将节点组标记为 `Sprint`。


  - 8. 现在编译、保存并按 **开始游戏** 来测试你的工作。如果你按下 *Left Shift* 键，应该会注意到速度明显提升。


  我们学习了如何将按键映射到动作并修改角色的最大速度以模拟冲刺能力。我们的下一步是给玩家添加一种能力，使其能够获得目标的更近视图。


  ### 制作缩放视图动画


  现代第一人称射击游戏的核心元素之一是可变 **视角 (FOV)**，它允许玩家透过枪口瞄准镜以获得目标的更近视图。这对现代射击游戏提供的准确性和控制感起着重大贡献。让我们在原型中添加这种简单的功能。为此，请执行以下步骤：


  - 1. 在网格旁边靠近 **鼠标输入** 节点的空白区域，右键单击，搜索 `zoom`，然后添加 **缩放** 事件节点。


  - 2. 我们想要修改包含在 **第一人称相机组件** 中的 FOV 值，因此请转到 **组件** 面板，并将 **第一人称相机** 拖放到 **事件图** 上。


  - 3. 将 **第一人称相机** 节点的输出引脚拖动到空白网格区域，搜索 **设置视角** 节点并放置。降低 FOV 会产生将屏幕中心区域缩小到更窄范围的效果。由于
  `Default` FOV 值设置为 `90`，对于我们的缩放，让我们在设置节点中将 FOV 设置为 `45`，如下所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_191_0.png)


  图 6.11 – 更改视角


  - 4. 单击并拖动 **输入动作 缩放** 节点的输出执行引脚到 **设置视角** 节点的输入执行引脚。


  编译、保存，然后单击 **开始游戏**。


  当您玩游戏并按下鼠标右键时，您会注意到 FOV 会立即变为窄、放大的视图。主相机从一个位置瞬间切换到另一个位置的任何情况对玩家来说都可能令人不安，因此我们需要进一步修改此行为。此外，FOV
  在按键释放后不会恢复。我们将使用时间轴解决这两个问题。


  ### 使用时间轴平滑过渡


  要平滑地更改 FOV，我们需要创建显示随时间逐渐变化的 Actor 的动画。为此，请返回 `FirstPersonCharacter` 蓝图的 **事件图**
  实例，并执行以下步骤：


  - 1. 按下 **Alt** 并单击 **输入动作 缩放** 节点的 **按下** 输出执行引脚以断开连接。


  - 2. 从 **按下** 向空白网格区域拖动一根新线。搜索并选择 **添加时间轴** 以添加时间轴节点：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_192_0.png)


  图 6.12 – 时间轴节点


  ### 重要说明


  在虚幻引擎 5 中，制作动画有多种不同的方法。时间轴非常适合简单的值更改，例如门的旋转。对于更复杂的、基于角色的或电影动画，您可能需要查看 **Sequencer**，这是引擎的内置动画系统。**Sequencer**
  和复杂动画超出了本书的范围，但有许多专门的学习资源可用于使用 **Sequencer**。我建议从虚幻文档开始，该文档可在 [虚幻引擎 Sequencer 文档](https://docs.unrealengine.com/en-us/Engine/Sequencer)。


  - 3. 时间轴将允许我们更改一个值（例如相机上的 FOV）在指定的时间段内。要更改时间轴内的值，请双击 **Timeline_0** 节点。


  这将打开 **时间轴编辑器**。您将在 **编辑器** 左上角看到四个按钮。每个按钮都会添加一种不同的可随时间更改的值。由于 FOV 由数值表示，我们将单击带有
  f 标签的按钮（添加浮点轨道）。这样会将轨道添加到时间轴，并提示您为此轨道命名。


  - 4. 让我们将其标记为 视角。我们现在必须编辑不同时间间隔上的值，如下所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_193_0.png)


  图 6.13 – 时间轴编辑器


  - 5. 为此，按住 Shift 并单击图表上接近 0.0 点的位置。您将看到如图 6.14 所示，时间和值 字段出现在图表左上角。


  这些功能允许对时间轴进行精确调整。确保时间设置为确切的 0.0，并将值设置为 90，即我们的默认 FOV。如果点从视图中消失，您可以使用图表左上角的两个小按钮来放大图表，以便点变得可见。这些按钮位于图
  6.14 的红色矩形内。


  - 6. 我们希望缩放动画很快，因此在时间轴编辑器顶部，找到 长度 旁边的字段并将值更改为 0.3，以将动画范围限制为 0.3 秒。


  - 7. 现在，按住 Shift 并单击图表右侧浅灰色区域的末端。将时间字段调整为 0.3，值字段调整为 45：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_194_0.png)


  图 6.14 – 第二个点的时间和值


  注意表示值的线如何从 90 度逐渐下降到 45 度。这意味着调用此动画时，玩家的 FOV 将从缩出平滑过渡到缩进，而不是在这两个值之间生硬切换。这是使用时间轴而非直接用设置值蓝图更改值的优势。


  - 8. 现在，返回 事件图。我们希望将我们的时间轴连接到设置 FOV 操作，就像本屏幕截图所示：




  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_195_0.png)


  图 6.15 – 使用时间轴修改 FOV


  - 9. 你会注意到 Timeline_0 节点现在有一个名为 Field Of View 的新输出引脚。将此引脚连接到 Set Field of View 节点的
  In Field Of View 输入引脚。现在，将 Timeline_0 节点的 Update 输出执行引脚连接到 Set Field of View 节点。


  这会设置好相关功能，使得每当 FOV 值更新时，就会将新值传递给 Set Field Of View 功能。由于我们的时间轴设置，90 到 45 之间的许多值都会传递给
  set，从而在 0.3 秒内在两个极端之间实现平滑过渡。


  - 10. 最后，我们希望在释放右键时结束缩放。为此，请将 InputAction Zoom 节点的 Released 引脚拖动到 Timeline 节点的 Reverse
  引脚。


  这将导致在释放右键时时间轴动画以反向顺序播放，从而确保平滑地过回正常的相机视图。另外，请记得为节点组添加注释，以便日后重访时记得此功能的作用。


  - 11. 现在，编译、保存，然后单击 **开始游戏**，通过按住右键来测试缩放视图的进入和退出过渡。


  这些步骤完成了我们用于制作缩放视图动画的实现。现在，让我们对 FirstPersonProjectile 蓝图进行一些调整。


  ### 提高射弹速度


  既然我们已为玩家角色提供了一个在世界中导航的新游戏选项，我们的注意力将重新回到射击机制上。目前，控制器上的枪发射的子弹是缓慢在空中划过弧线的球体。我们希望更好地模拟我们从传统射击游戏中习惯看到的快速移动的子弹。


  要更改 Projectile 的属性，我们需要打开名为 FirstPersonProjectile 的蓝图，它位于 Content/FirstPersonBP/Blueprints
  文件夹中。打开后，查看 组件 面板并单击 Projectile。这是 FirstPersonProjectile 蓝图中添加的一种弹道移动组件，用于定义球体在世界中创建后的运动方式：


  - 1. 在 详情 面板中，你会看到 Projectile 拥有大量描述其运动的变量。目前我们只关注其中少数几个：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_197_0.png)


  图 6.16 – 弹道体变量


  首先，找到 **初始速度** 和 **最大速度** 字段，当前两者均设置为 3000。**初始速度** 决定弹道体在枪口首次创建时移动的速度，**最大速度**
  决定在施加额外力后它能达到的最大速度。如果我们有一枚火箭，可能希望在其发射后施加加速度以表示助推器启动。但由于我们要表现的是从枪口发出的子弹，因此将其初始速度设定为子弹将达到的最快速度更合理。将
  **初始速度** 和 **最大速度** 都调整为原始值的两倍：6000。


  让我们将 **弹道体重力比例** 从 `1.0` 更改为 `0.1`。这样一来，子弹看起来非常轻，因此几乎不受重力影响。


  此外，你可能已经注意到，当前的弹道体撞击墙壁和物体后会像皮球一样反弹。不过，我们希望模拟一种更坚硬、撞击力度更强的弹道体。要去除反弹效果，请在 **详情** 面板中查找
  **弹道体反弹** 部分，并取消勾选 **是否反弹** 旁边的复选框。其他数值仅决定在 **是否反弹** 被勾选时弹道体反弹的方式，因此无需调整它们。


  在 **事件图** 中要做的最后一项更改是，将 **分支** 节点的 **False** 引脚连接到 **销毁角色** 函数，这样弹道体在与任何东西碰撞时都会始终被
  `Destroyed`：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_198_0.png)


  图 6.17 – 弹道体事件图


  现在，编译、保存，然后单击 **开始游戏**。你会发现开枪后射出的弹道体射程更远，且不再会弹离墙壁。


  我们修改了弹道体的速度并取消了反弹属性，使弹道体表现得像子弹一样。接下来我们要修改的蓝图是 `BP_CylinderTarget`，以在其被销毁时模拟爆炸效果。


  ### 添加音效与粒子效果


  既然玩家的移动和射击已经按我们的意愿运行，现在让我们把注意力转向敌人目标。目前，射击某个目标圆柱体只会使其颜色变为红色。然而，玩家目前无法直接摧毁目标。


  我们可以通过创建蓝图逻辑来增加敌人交互的动态效果：当目标被射击超过一次时将其销毁，并在目标被销毁时产生令人满意的声音和视觉效果，从而增加玩家的奖励。


  ### 使用分支更改目标状态


  由于我们希望根据应用于目标圆柱体的状态变化来生成触发的效果，因此必须确保此逻辑包含在我们的 BP_CylinderTarget 蓝图中，该蓝图位于 Content/FirstPersonBP/Blueprints
  文件夹。打开蓝图并查看连接到 Event Hit 的节点组。目前，当我们的弹道体击中圆柱体对象时，这些节点会指示其切换到红色材质。为了在圆柱体被多次射击时改变其行为，我们需要在蓝图中添加一个检查，以查看圆柱体是否已经被击中，然后根据其状态触发不同的结果。


  我们将使用分支节点来帮助处理此场景：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_200_0.png)


  图 6.18 – 使用分支节点检查圆柱体是否已被击中


  分支节点接受一个布尔变量作为输入。由于布尔值只能为 True 或 False，分支节点只能产生两种结果。通过将其他节点链接到两个输出执行引脚，可以执行这两种结果，分别代表
  True 路径和 False 路径。


  创建分支的第一步是确定你的布尔值将代表什么，以及什么会导致条件值从 False 变为 True。在本例中，我们想要创建一个 预备 变量，以显示目标已经被击中，并且可以通过第二次射击将其摧毁。让我们继续创建一个
  预备 布尔变量：


  - 1. 在 My Blueprint 面板中，单击 Variables 类别旁的 + 按钮以添加新变量。将 Variable Type 设置为 Boolean，并为新变量命名为
  预备。


  - 2. 编译并保存蓝图。由于我们不希望目标在首次被击中之前处于 预备 状态，因此我们将变量的默认值保留为 False（由未勾选的复选框表示）。


  - 3. 现在你已经有了一个 预备 布尔变量，请将其从 My Blueprint 面板拖动到 Event Graph，并在将变量放置到 Event Graph
  上时，从出现的子菜单中选择 Get 选项。


  - 4. 单击并拖动一根从新建 **预备** 节点输出引脚到 **事件图** 空白网格区域的线。搜索并添加 **分支** 节点。


  - 5. 最后，我们可以将 **分支** 添加到我们的 **击中事件** 蓝图组中。按住 _Alt_ 键并单击其中一个执行引脚，以断开 **转换为第一人称弹道体**
  和 **设置材质** 节点之间的连接。


  - 6. 暂时将 **设置材质** 节点移开，然后将 **转换为** 节点的输出执行引脚连接到 **分支** 节点的输入执行引脚。现在，每当目标圆柱体被弹道体击中时，此蓝图都会调用
  **分支** 计算。


  既然我们已经设置好 **分支** 节点，就需要向目标圆柱体提供每种状态下应执行的操作指令。也就是说，首次被击中时（**预备** 变量为 **False**）应发生什么，以及第二次被击中时（**预备**
  变量为 **True**）应发生什么。


  让我们先处理目标首次被击中的情况。在这种情况下，我们必须将 **材质** 更改为 **目标红色**。此外，我们还必须将 **预备** 布尔变量设置为 **True**。这样一来，当目标再次被击中时，**分支**
  节点就会将行为路由到 **True** 执行引脚。**False** 执行序列中的节点将如下所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_201_0.png)






  ### 图 6.19 – 首次命中时切换为红色材质


  - 7. 将先前移开的 **设置材质** 节点拖到 **分支** 节点的右侧，然后将 **分支** 节点的 **False** 输出执行引脚连接到 **设置材质**
  节点的输入执行引脚。


  - 8. 现在，将 **我的蓝图** 面板中的 **预备** 变量拖到 **事件图表**，并选择 SET 选项。将此节点连接到 **设置材质** 节点的输出执行引脚，并单击
  SET 节点中 **预备** 旁边的复选框。这样可确保下次 **目标** 被命中时，**分支** 求值为 **True**。


  我们定义了 **分支** 节点 **False** 路径的操作。下一步是定义将从 **分支** 节点的 **True** 路径触发的操作序列。


  ### 触发音效、爆炸和销毁


  销毁目标时我们希望完成三件事：听到爆炸声、看到爆炸，以及从游戏世界中移除目标对象。我们将从令人满意的游戏体验中常被低估但始终至关重要的元素——声音——开始。


  我们可以用声音设计的最基本交互是在游戏世界中的某个位置一次性播放一个 .wav 声音文件，这完全符合我们的目的。将一根线从 **分支** 节点的 **True**
  执行节点拖到空白网格区域，并搜索 **在位置处播放声音** 节点：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_203_0.png)


  ### 图 6.20 – 播放爆炸声音


  **在位置处播放声音** 是一个简单节点，它接受 **声音** 文件输入和 **位置** 输入，然后——如你所料——在该位置播放声音。我们引入该项目的 **入门内容**
  中包含多个声音文件，可以通过单击 **声音** 输入下方的下拉菜单查看这些文件列表。查找并选择 **Explosion01** 以设置爆炸 **声音** 效果。


  现在我们已设置 **声音**，需要确定声音在哪里播放。我们可以使用类似设置 FOV 的过程：获取圆柱体目标的静态网格组件，提取其位置值，然后将该位置向量直接链接到我们的
  **声音** 节点。但是，**事件命中** 触发器会使此过程更加容易。


  **事件命中** 节点的许多输出引脚中有一个名为 **命中位置**。该引脚包含由 **事件命中** 评估的两个对象在空间中相互碰撞的位置。我们的弹丸击中目标的位置是生成爆炸效果的一个完全合理的位置，因此请从
  **事件命中** 节点的 **命中位置** 拖一根线到 **在位置处播放声音** 上的 **位置** 输入引脚。


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_204_0.png)


  ### 图 6.21 – 使用命中位置


  编译、保存并运行以测试蓝图。射中一个移动目标一次会使其变红。此后的每次命中都应产生爆炸音效。


  现在我们已设置爆炸音效，让我们按照以下步骤添加视觉效果并销毁圆柱体：


  - 1. 从 **在位置处播放声音** 的输出执行节点拖一根线到空白网格区域。搜索并选择 **在位置处生成发射器** 节点。


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_204_1.png)


  ### 图 6.22 – 生成粒子效果


  ### 重要说明


  发射器是一个在特定位置产生粒子效果的对象。粒子效果是一组小对象的集合，它们结合起来创建流体、气体或其他无形物体（如瀑布冲击、爆炸或光束）的视觉效果。


  **在位置处生成发射器** 节点看起来与我们正在附加的 **声音** 节点类似，但具有更多输入参数和 **自动销毁** 切换开关。


  - 2. 在 **发射器模板** 下方的下拉菜单中，查找并选择 **P_Explosion** 效果。这是随我们拉入项目的 **入门内容** 一起提供的另一项资产，无论其发射器附加在哪里，都会产生令人满意的爆炸效果。


  - 3. 由于我们希望爆炸在爆炸声音的同一位置生成，我们将单击并拖动 **事件命中** 节点的相同 **命中位置** 引脚到 **在位置处生成发射器** 的 **位置**
  引脚上。


  爆炸是一种 3D 效果，从所有角度看都一样，因此我们可以保持 **旋转** 输入不变。**自动销毁** 切换开关决定发射器是否可以触发多次。一旦创建此粒子效果，我们将销毁包含此发射器的
  Actor，因此可以保持复选框已选中。


  - 4. 最后，在播放声音和视觉爆炸效果后，我们希望从游戏世界中移除目标圆柱体。将 **在位置处生成发射器** 节点的输出执行引脚拖到空白网格区域。搜索并添加
  **DestroyActor** 节点。此节点只接受单个 **Target** 输入，默认值为 **self**，即对当前实例的引用。


  - 5. 扩展围绕整个 **事件命中** 节点序列的注释框，并更新文本以描述新序列的功能。我选择了 `When hit, turn red and set to
  primed.` 如果已预备，则销毁自身。此节点链的结果应如下截图所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_206_0.png)


  ### 图 6.23 – 事件命中操作


  在蓝图节点周围留下有用注释后，编译、保存并点击 Play 以测试新交互。当玩家的枪射击圆柱体两次时，你应该能看到并听到它们爆炸。


  我们了解了如何根据代表圆柱体当前状态的 **预备** 变量使用 **分支** 节点来决定执行流程。我们还学习了如何使用蓝图节点播放声音和生成粒子效果。


  ### 总结


  我们现在已经开始着手让游戏对玩家来说更具满足感。我们添加了音效和视觉效果、具有现代射击游戏大部分预期功能的玩家角色，以及会对玩家交互做出反应的目标。前几章所涵盖的技能已结合起来，开始创建越来越复杂和有趣的行为。


  在本章中，我们创建了一些自定义玩家控件，以允许冲刺和使用枪支瞄准。在此过程中，我们探索了移动控制器如何将玩家输入的信息转化为游戏体验。我们还利用时间轴为创建简单动画打开了大门。随后，通过向敌方目标附加爆炸效果和声音，并增加它们必须被两个弹丸击中的要求，为玩家与环境的交互添加了更多反馈。


  在下一章中，我们将探索向游戏添加 UI，以向玩家提供其相对于世界状态的反馈。


  ### 测验


  - 1. 动作和轴映射由 **事件图表** 中的红色 **事件** 节点表示。

  - a. 正确

  - b. 错误


  - 2. 设置视野是 **角色移动组件** 的一个函数。

  - a. 正确

  - b. 错误


  - 3. 时间轴节点可用于创建简单动画。

  - a. 正确

  - b. 错误


  - 4. 可以使用 **在位置处生成发射器** 函数在运行时添加粒子效果。

  - a. 正确

  - b. 错误


  - 5. 名为 Play Sound 的函数在给定位置播放声音。

  - a. 正确

  - b. 错误

