  \ **详细信息** 面板中。在此面板中，你可以定义输入和输出参数。输入参数是传递给宏/函数的值。输出参数是从宏/函数返回的值。以下截图显示了带有两个输入参数和一个输出参数的\
  \ `SetupNewWave` 宏的 **详细信息** 面板。在宏中，白色执行引脚被定义为类型 **执行** 的输入/输出参数，因此你可以添加任意数量的引脚。在以下示例中，我们创建名为\
  \ **输入** 的输入执行引脚和名为 **输出** 的输出执行引脚：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_55_0.png)\n\
  \n图 2.16 – 宏属性\n\n以下截图显示了 `SetupNewWave` 宏的内容。这个宏的目的是为游戏中的下一波敌人设置一些变量。它将当前 **波数**\
  \ 作为输入参数，将此值存储在 **当前波** 变量中，并通过将当前 **波数** 乘以 5 来确定敌人数量：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_56_0.png)\n\
  \n图 2.17 – 宏示例\n\n要将宏添加到 **事件图表**，请从 **我的蓝图** 面板拖动宏名称并将其放入 **事件图表**，或在 **上下文菜单**\
  \ 中查找它。当宏执行时，其中的操作将被执行。以下截图显示 `SetupNewWave` 宏在 **开始游戏时** 中被调用，其中 **波数** 输入参数的值为\
  \ `1`。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_56_1.png)\n\n图 2.18 – 调用宏\n\n\
  ### 创建函数\n\n函数的一个优点是，在一个蓝图中创建的函数可以从另一个蓝图中调用。要创建函数，请使用 **我的蓝图** 面板，并在 **函数** 类别中单击\
  \ + 按钮。以下截图显示了带有名为 `CalculateWaveBonus` 函数的 **我的蓝图** 面板：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_57_0.png)\n\
  \n图 2.19 – 创建函数\n\n与宏类似，函数的属性显示在 **详细信息** 面板中，可以在其中定义输入和输出参数。以下截图显示了 `CalculateWaveBonus`\
  \ 函数的 **详细信息** 面板，包含两个输入参数和一个输出参数：\n\n| 组 | 属性 | 值 |\n| :--- | :--- | :--- |\n|\
  \ 图表 | 描述 | |\n| 图表 | 类别 | 默认 |\n| 图表 | 关键字 | |\n| 图表 | 紧凑节点标题 | |\n| 图表 | 访问说明符\
  \ | 公开 |\n| 图表 | 纯 | [ ] |\n| 图表 | 在编辑器中调用 | [ ] |\n| 输入 | WaveNumber | 整数 |\n|\
  \ 输入 | TimeLeft | 整数 |\n| 输出 | BonusPoints | 整数 |\n\n图 2.20 – 函数属性\n\n创建函数时，我们可以定义它是否为\
