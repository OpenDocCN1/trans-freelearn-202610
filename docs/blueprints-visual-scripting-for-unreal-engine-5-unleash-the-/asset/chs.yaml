  \ **Anchors** 下拉菜单，并选择屏幕中心带有锚点的选项。\n\n- 7. 将 Position X 设置为 `-180.0`，Position Y\
  \ 设置为 `-250.0`，Size X 设置为 `360.0`，Size Y 设置为 `100.0`。\n\n- 8. 将 **Text** 对象从 **Palette**\
  \ 面板拖放到 **Hierarchy** 面板中的 **Btn resume** 元素上。在 **Details** 面板中，将名称设置为 `Txt resume`，将\
  \ **Content** 类别下的 **Text** 字段更改为 `Resume`，并将字体 **Size** 设置为 `48`。\n\n- 9. 现在，让我们将\
  \ **Restart** 按钮转换为 **Reset All** 按钮。将 **Btn restart** 按钮名称更改为 `Btn reset`，将 `Txt\
  \ restart` 更改为 `Txt reset`，然后将 **Text** 字段更改为 `Reset All`。\n\n- 10. 编译并保存。\n\n我们已经添加了\
  \ **PauseMenu** 的视觉元素；现在让我们来处理功能部分。\n\n### 恢复游戏\n\n要恢复游戏，需要将 **PauseMenu** 从视口中移除，隐藏鼠标光标，并取消暂停游戏。\n\
  \n添加功能的步骤如下：\n\n- 1. 单击 **Btn resume** 元素，向下滚动到 **Details** 面板底部，单击 **On Clicked**\
  \ 事件旁边的 + 按钮。\n\n- 2. 在 **Graph** 视图中，将这些节点添加到 **On Clicked (Btn resume)** 事件：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_414_0.png)\n\nFigure 11.24 – 恢复按钮操作\n\
  \n- 3. 从 **On Clicked (Btn resume)** 节点拖出一条线，添加 **Remove from Parent** 节点。\n\n-\
  \ 4. 在 Event Graph 上右键单击，添加 **Get Player Controller** 节点。\n\n- 5. 从 **Get Player\
  \ Controller** 的 Return Value 拖出一条线，添加 **SET Show Mouse Cursor** 节点。将 **Remove from\
  \ Parent** 的白色输出引脚连接到 **SET Show Mouse Cursor** 的白色输入引脚。保持 **Show Mouse Cursor**\
  \ 参数未勾选。\n\n- 6. 从 **SET Show Mouse Cursor** 的白色输出引脚拖出一条线，添加 **Set Game Paused**\
  \ 节点。保持 **Paused** 参数未勾选。\n\n这些是 **Resume** 按钮的操作。现在，让我们添加 **Reset All** 按钮的操作。\n\
  \n### 重置存档文件\n\n**Reset All** 按钮会在存档存在时将其删除，然后重新加载游戏关卡。我们将创建一个包含删除存档操作的宏。\n\n按照以下步骤创建宏：\n\
  \n- 1. 在 **My Blueprint** 面板中，单击 **Macros** 类别中的 + 按钮创建宏。将宏的名称更改为 `DeleteFile`。在宏的\
  \ **Details** 面板中，创建一个名为 `In` 的 **Exec** 类型输入参数和一个名为 `Out` 的 **Exec** 类型输出参数。\n\n\
  - 2. 在为 **DeleteFile** 宏创建的选项卡上，添加以下截图中显示的节点。我们获取 **FirstPersonCharacter** 实例的引用以检索\
  \ **Save Slot Name** 变量的值。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_415_0.png)\n\
  \nFigure 11.25 – DeleteFile 宏操作\n\n- 3. 添加 **Get Player Character** 节点，使用 **Cast\
  \ To FirstPersonCharacter** 节点进行转换，然后从 **As First Person Character** 引脚拖出线添加 **Get\
  \ Save Slot Name** 节点。\n\n- 4. 从 **Cast To FirstPersonCharacter** 的白色输出引脚拖出线，添加\
  \ **Does Save Game Exist** 节点。将 **Slot Name** 引脚连接到 **Get Save Slot Name** 节点。\n\
  \n- 5. 从 **Does Save Game Exist** 拖出线，添加 **Branch** 节点。将 **Return Value** 引脚连接到\
  \ **Condition** 引脚。\n\n- 6. 从 **Branch** 节点的 **True** 输出拖出线，添加 **Delete Game in\
  \ Slot** 节点。将 **Slot Name** 引脚连接到 **Get Save Slot Name** 节点。将白色输出引脚连接到 **Outputs**\
  \ 节点的 **Out** 引脚。\n\n- 7. 将 **Cast To FirstPersonCharacter** 的 **Cast Failed** 引脚和\
  \ **Branch** 节点的 **False** 引脚连接到 **Outputs** 节点的 **Out** 引脚。\n\n- 8. 在 **Event Graph**\
  \ 中，在 **On Clicked (Btn reset)** 事件后添加 **Delete File** 宏节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_416_0.png)\n\
  \nFigure 11.26 – 修改 On Clicked (Btn reset) 事件\n\n- 9. 编译并保存 **PauseMenu**。\n\n我们创建了\
  \ **PauseMenu** 屏幕。现在需要一种方法让玩家调出 **PauseMenu**。\n\n### 触发暂停菜单\n\n我们将使用 **Enter**\
  \ 键暂停游戏并打开 **PauseMenu**。我们需要在 **Project Settings...** 中添加一个名为 **Pause** 的动作映射，并为\
  \ **Pause** 动作映射创建的 **InputAction** 事件添加操作。\n\n按照以下步骤触发 **PauseMenu**：\n\n- 1. 要更改游戏的输入设置，请单击工具栏最右侧的\
  \ **Settings** 按钮，并选择 **Project Settings...** 选项：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_417_0.png)\n\
  \nFigure 11.27 – 访问 Project Settings\n\n- 2. 在出现的窗口左侧，查找 **Engine** 类别并选择 **Input**\
  \ 选项。单击 **Action Mappings** 旁边的 + 号。将新操作命名为 **Pause**，并从下拉菜单中选择 **Enter** 键，将该键映射到\
  \ **Pause** 事件：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_418_0.png)\n\nFigure\
  \ 11.28 – 创建动作映射\n\n- 3. 在内容浏览器中，访问 Content > FirstPersonBP > Blueprints 文件夹并双击\
  \ FirstPersonCharacter 蓝图。\n\n- 4. 在 Event Graph 上右键单击，搜索 input_action_pause，添加\
  \ Pause Event 节点。复制 LostGame 自定义事件中的所有节点，并将它们粘贴到 InputAction Pause 节点附近：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_418_1.png)\n\
  \nFigure 11.29 – InputAction Pause 事件操作\n\n- 5. 将 **InputAction Pause** 节点的 **Pressed**\
  \ 引脚连接到 **Set Game Paused** 节点的白色输入引脚。\n\n- 6. 将 **Create Widget** 节点的 **Class**\
  \ 参数更改为 **Pause Menu**。\n\n- 7. 编译、保存，然后单击 **Play** 进行测试。\n\n现在，在游戏过程中，你应该能够按下设置的\
  \ *Enter* 键来调出暂停菜单。单击 **Resume** 按钮应该关闭暂停菜单并返回游戏。如果你在游戏中推进几轮，然后从暂停菜单中按下 **Reset\
  \ All** 按钮，则应该自动重新加载关卡，进度重置为游戏的第一轮。如果你看到的情况是这样，那么恭喜！你已经在创建一个能够在多轮游戏中存储、加载和重置进度的存档系统方面取得了重大成就。\n\
  \n### 摘要\n\n在本章中，我们在将游戏打造为一种他人可以游玩和享受的完整体验方面取得了显著进展。你学习了如何根据玩家是否获胜或失败来显示不同屏幕。你还学习了如何实现存档系统，允许玩家在保留进度的情况下返回之前的游戏会话。然后，我们实现了一个回合系统，每当玩家推进到新回合时，该系统都会修改游戏目标。最后，我们实现了额外的菜单系统，这些系统会向玩家提供他们所处的回合信息，并让他们有机会暂停游戏甚至重置自己的存档文件。\n\
  \n在下一章中，我们将探讨如何为我们创建的游戏制作构建版本，以便与他人分享体验。\n\n### 测验\n\n- 1. **Create Widget** 节点创建参数中所选小部件类的实例。\n\
  \  - a. 正确\n  - b. 错误\n\n- 2. 用于存储将要保存的数据的类名是什么？\n  - a. `SaveData`\n  - b. `SaveInfo`\n\
  \  - c. `SaveGame`\n\n- 3. **Save Game to Slot** 函数接收一个结构作为输入参数，其中包含将要保存的数据。\n \
  \ - a. 正确\n  - b. 错误\n\n- 4. **Load Game from Slot** 函数返回 `SaveGame` 类的一个实例。我们需要使用\
  \ **Cast To** 节点来访问已保存的变量。\n  - a. 正确\n  - b. 错误\n\n- 5. 名为 **Shoot** 的 **Action\
  \ Mapping** 会触发名为 **InputAction Shoot** 的事件。\n  - a. 正确\n  - b. 错误\n\n\n\n\n"
- '## 第 12 章：构建与发布


  作为游戏开发者成长的最佳方式之一，就是与他人分享你的作品，以便获得关于如何改进设计和内容的反馈。早期的优先事项之一应该是创建可共享的游戏构建版本，以便其他人可以自行游玩。幸运的是，虚幻引擎
  5 使得为多个平台创建游戏构建版本变得极其简单。在本章中，我们将学习如何优化游戏设置以及针对目标桌面平台进行构建的过程。在此过程中，我们将涵盖以下主题：


  - 优化图形设置

  - 设置游戏以供他人游玩

  - 将游戏打包为构建版本


  到本章结束时，你将拥有一个打包好的游戏版本，可以分享并在其他机器上安装。


  ### 优化图形设置


  在创建构建版本（即针对特定平台进行了优化的游戏版本）之前，你应该更改游戏的图形设置，以确保它们适合你的目标机器。虚幻引擎 5 中的图形设置标识为 **引擎可缩放设置**。此设置界面由多个图形设置组成，每个设置决定游戏中某个元素的最终视觉质量。对于任何游戏，高质量效果和视觉效果与游戏性能（以帧率衡量）之间存在权衡。


  帧率较低的游戏从游戏性角度来看感觉很糟糕，即使机制本身很稳固。因此，重要的是要平衡让游戏尽可能美观的愿望，与理解游戏对玩家运行游戏的机器会产生什么性能影响的需求之间的关系。


  由于 PC 和 macOS 计算机的硬件性能各不相同，许多针对这些平台的游戏使用自定义菜单设置，允许玩家自行调整游戏的图形设置。然而，我们创建的游戏仅使用非常简单的资产和相对受限的关卡大小，因此我们只需在生成分发构建版本之前定义一些可行的默认值即可。


  按照以下步骤修改 **引擎可缩放设置**：


  - 单击位于关卡编辑器工具栏右侧的 **设置** 按钮。


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_423_0.png)


  图 12.1 – 访问引擎可缩放设置


  - 将鼠标悬停在 **引擎可缩放设置** 上，以查看 **质量** 设置的弹出显示，如下面的屏幕截图所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_424_0.png)


  图 12.2 – 引擎可缩放设置元素


  - 此菜单顶部的按钮，从 低 到 史诗级，充当设置的预设，基于你在运行时希望针对的性能与质量的广泛级别。单击 低 按钮会将所有质量设置设置为最小，以换取最不具视觉吸引力的设置，来为你提供尽可能好的性能。史诗级是谱系的另一端，将所有引擎质量设置提升到最大，具体性能损耗取决于你选择使用的资产。


  - 电影级按钮会将所有质量设置设置为电影级质量，用于渲染过场动画。此设置不打算在游戏过程中或运行时使用。


  - 自动按钮会检测你当前运行编辑器的机器的硬件，并将图形设置调整到在性能与适合你机器的图形质量之间取得良好平衡的水平。如果你打算针对与开发机器性能大致相当的硬件，使用自动设置可以作为为构建版本建立图形设置的一种简单方法。


  - 如果你希望单独调整设置，可以使用以下对其功能的简要描述来获得帮助：


  - **分辨率缩放**：此设置会导致引擎以低于玩家目标分辨率的分辨率渲染游戏，并使用软件将游戏放大到目标分辨率。这可以提高游戏性能，但代价是在较低分辨率缩放时会出现感知模糊。


  - **视距**：这决定了从摄像机位置开始对象将被渲染的距离。此距离之外的对象将不会被渲染。较短的视距可以提高性能，但可能导致对象在越过视距边界时突然弹入视野。


  - **抗锯齿**：此设置可软化世界中 3D 对象的锯齿状边缘，这可以显著改善游戏的外观。在较高设置下，你会看到更少的锯齿边缘，但这会降低性能。


  - **后期处理**：此设置更改在场景创建后应用到屏幕上的多个滤镜的基线质量设置，例如运动模糊和光晕效果。


  - **阴影**：这更改了多个捆绑设置的基础质量，这些设置共同决定游戏中阴影的外观。高度详细的阴影通常会对性能产生显著影响。


  - **纹理**：此设置将影响引擎管理游戏中使用的纹理的过程。如果游戏中有许多大纹理，降低此设置可以帮助避免显存耗尽，从而提高性能。


  - **效果**：此设置更改应用到游戏中的多个特效（例如材质反射和半透明效果）的基线质量设置。


  - **植被**：此设置将影响游戏中使用的植被质量。


  - **着色**：此设置将影响材质的质量。


  最终，优化游戏性能的最佳方法是定期在打算让人们游玩的机器上测试游戏。如果你注意到性能迟缓，请记录发生位置。如果游戏性能始终较低，你可能需要减少一些后期处理或抗锯齿效果。如果性能仅在关卡的某些区域较低，你可能需要查看降低该区域的对象密度或降低特定游戏模型的质量。


  既然我们知道如何调整图形设置，那么在构建之前先自定义一些项目设置。


  ### 设置游戏以供他人游玩


  虚幻引擎 5 提供了广泛的平台供你选择来构建游戏，并且随着引擎新版本的发布和新技术的出现，此列表将继续扩展。你可以在 Windows、macOS、iOS、Android
  和 Linux 上部署游戏。该引擎支持为各种虚拟现实平台创建内容，例如 Oculus Quest。还支持第 8 代和第 9 代游戏主机，但你需要成为拥有适当开发套件的注册主机开发者。


  每个平台都有与其相关的独特要求和游戏开发最佳实践。移动游戏具有更高的优化要求，以使游戏运行良好。


  我们可以自定义一些设置，这些设置将决定我们的项目在目标机器上的显示方式。


