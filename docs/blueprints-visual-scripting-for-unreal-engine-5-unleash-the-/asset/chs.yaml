- "## 第 7 章：创建屏幕 UI 元素\n\n任何游戏体验的核心在于游戏设计师用来向玩家传达游戏目标和规则的方法。这种方法在各种形式的游戏中都很常见，即使用\
  \ **图形用户界面 (GUI)** 向玩家显示和广播重要信息。在本章中，我们将设置一个 GUI 来跟踪玩家的生命值和耐力，并设置计数器来显示消除的目标数量和玩家的弹药量。你将学习如何使用\
  \ Unreal 的 GUI 编辑器设置基本 **用户界面 (UI)**，并使用蓝图将该界面与游戏值绑定。我们将使用 **虚幻运动图形 (UMG) UI 设计器**\
  \ 创建 UI 元素。\n\n在此过程中，我们将涵盖以下主题：\n\n- 使用 UMG 创建简单的 UI 计量表\n- 将 UI 值连接到玩家变量\n- 跟踪弹药和消除的目标\n\
  \n本章结束时，你将知道如何使用 UMG 编辑器创建显示生命值和耐力状态的进度条，并知道如何显示消除的目标数量和玩家的弹药量。\n\n### 使用 UMG 创建简单\
  \ UI 计量表\n\n在本节中，我们将学习如何使用 UMG 编辑器创建游戏中将使用的 UI 元素，以及如何将它们定位在\n\n\n\n屏幕。\n\nUMG Editor\
  \ 是一个可视化 UI 制作工具。我们可以使用 UMG Editor 创建菜单和 **抬头显示器 (HUD)**。HUD 是一种透明显示器，可在不要求用户移开主视图的情况下提供信息。它最初是为军事航空开发的。HUD\
  \ 这个缩写在游戏中很常见，因为信息显示在游戏屏幕上。我们希望在 HUD 上显示表，显示玩家当前拥有的健康值和耐力值。这些出现在 HUD 上的表被称为 **UI\
  \ 表**。\n\n健康值和耐力值 UI 表将如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_210_0.png)\n\
  \n图 7.1 – 健康和耐力 UI 表\n\n消灭的目标数量和玩家的弹药将使用文本显示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_210_1.png)\n\
  \n图 7.2 – 消灭的目标和弹药计数器\n\n要创建一个用于显示健康值和耐力值 UI 表的 HUD，我们首先需要在玩家角色中创建可以跟踪这些值的变量。我们还将创建用于计算消灭的目标数量和玩家弹药的变量。\n\
  \n按照以下步骤创建变量：\n\n- 1. 在 Content Browser 中，访问 `/Content/FirstPersonBP/Blueprints`\
  \ 文件夹并双击 `FirstPersonCharacter` Blueprint。\n- 2. 在 Blueprint Editor 中找到 **我的 Blueprint**\
  \ 面板的 **变量** 类别。单击 + 号添加变量，将其命名为 `PlayerHealth`，并将 **变量类型** 更改为 **浮点数**。\n- 3. 再次执行相同步骤，创建第二个\
  \ **浮点数** 变量，命名为 `PlayerStamina`。\n- 4. 接下来，创建第三个变量，但这次，将 **变量类型** 选择为 **整数**，并将其命名为\
  \ `PlayerCurrentAmmo`。\n- 5. 最后，创建第二个 **整数** 变量并将其命名为 `TargetsEliminated`。变量列表应如下所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_211_0.png)\n\n图 7.3 – FirstPersonCharacter\
  \ 变量\n\n6. 编译 `FirstPersonCharacter` Blueprint。选择 **PlayerCurrentAmmo** 变量，并在 **详细信息**\
  \ 面板中，将 DEFAULT VALUE 设置为 30：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_212_0.png)\n\
  \n图 7.4 – 设置变量的默认值\n\n7. 将 **PlayerHealth** 和 **PlayerStamina** 的 DEFAULT VALUE\
  \ 设置为 `1.0`。此值用于 UI 表，用于显示介于 `0.0` 和 `1.0` 之间的填充程度。编译时 **TargetsEliminated** 的 DEFAULT\
  \ VALUE 自动设置为 `0.0`，这是适当的值，因此无需调整。\n\n8. 编译、保存并关闭 Blueprint Editor。\n\n现在，我们将学习如何绘制代表\
  \ UI 表的形状。\n\n### 使用 Widget Blueprint 绘制形状\n\nUMG Editor 使用一种称为 **小部件蓝图** 的特殊 Blueprint\
  \ 类型。由于 **第一人称** 模板默认没有 UI 元素，我们应该创建一个新文件夹来存储我们的 GUI 工作。按照以下步骤创建文件夹和 Widget Blueprint：\n\
  \n- 1. 在 Content Browser 中，访问 `/Content/FirstPersonBP/` 文件夹。在文件夹列表旁边的空白处右键单击，选择\
  \ 新建文件夹 选项。将文件夹命名为 `UI`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_213_0.png)\n\
  \n图 7.5 – 创建 UI 文件夹\n\n- 2. 打开刚创建的 UI 文件夹，然后在空白文件夹空间中右键单击。转到 用户界面 | Widget Blueprint，并将生成的\
  \ Blueprint 命名为 `HUD`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_214_0.png)\n\n\
  图 7.6 – 创建 Widget Blueprint\n\n- 3. 双击此 Blueprint 以打开 UMG Editor。我们将使用此工具来定义 UI\
  \ 在屏幕上的显示方式。\n- 4. 在 UMG Editor 中，找到名为 **调色板** 的面板。在其中，打开名为 **面板** 的类别。您将看到一系列可用于组织\
  \ UI 信息的容器：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_215_0.png)\n\n图 7.7 – UMG\
  \ Editor 面板小部件\n\n- 5. 将 **水平盒** 从 **调色板** 面板拖放到 **层级结构** 面板，释放在 **画布面板** 对象之上。单击\
  \ **画布面板** 下的 **水平盒** 将其选中。在编辑器右侧的 **详细信息** 面板中，将 **水平盒** 的名称更改为 `Player Stats`：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_216_0.png)\n\n图 7.8 – 更改水平盒的名称\n\n- 6.\
  \ 您现在应该在 **层级结构** 面板中看到嵌套在 **画布面板** 对象下方的 **Player Stats** 水平盒。我们的目标是使用垂直盒、文本和进度条的组合创建两个带标签的\
  \ **Player Stats** 条。设置将如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_217_0.png)\n\
  \n图 7.9 – Player Stats 层级结构\n\n- 7. 两个垂直盒将包含健康值和耐力值的文本和进度条。再次查看 **调色板** 面板中的 **面板**\
  \ 类别，然后将 **垂直盒** 对象拖放到 **层级结构** 中的 **Player Stats** 水平盒上，并将其名称更改为 `Player Stats\
  \ Texts`。再执行一次，使两个垂直盒对齐在 **Player Stats** 下方。将第二个 **垂直盒** 对象的名称更改为 `Player Stats\
  \ Bars`。\n- 8. 现在，在 **调色板** 面板的 **常用** 类别下查找创建 UI 所需的文本框和进度条。将两个 **文本** 对象拖放到 **Player\
  \ Stats Texts**，将两个 **进度条** 对象拖放到 **Player Stats Bars**，如 *图 7.9* 所示。我们已拥有将在 HUD\
  \ 中显示 **Player Stats** 的 UI 元素。下一步是调整它们在屏幕上的外观和位置。\n\n### 自定义表的外观\n\n现在，我们需要调整 UI\
  \ 元素并在屏幕上组织它们。**图形** 视图中的大型矩形轮廓表示玩家将看到的屏幕边界，称为 **画布**。这是位于 **层级结构** 最顶层的 **画布面板**\
  \ 对象。定位在画布左上角的元素将显示在游戏内屏幕的左上角：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_218_0.png)\n\
  \n图 7.10 – 画布面板\n\n这些是设置健康值和耐力值 UI 元素的下一步：\n\n- 1. 从 **层级结构** 选择 **Player Stats**，并查看中央图形面板。您将看到一些大小控件，允许使用鼠标操纵所选对象的大小。我们将在\
  \ **详细信息** 面板中设置 **Player Stats** 水平盒的位置和大小。将位置 X 设置为 50.0，位置 Y 设置为 30.0，大小 X 设置为\
  \ 500.0，大小 Y 设置为 80.0：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_219_0.png)\n\n\
  图 7.11 – Player Stats 的大小和位置\n\n- 2. 在 **层级结构** 面板中，选择 **Player Stats Bars** 下方的第一个进度条。在\
  \ **详细信息** 面板中，将名称更改为 `Health Bar`。然后，在 **插槽** 类别下的 **大小** 切换中，单击 **填充** 按钮以调整条的垂直高度：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_220_0.png)\n\n图 7.12 – 将健康条大小设置为 Fill\n\
  \n- 3. 在 **外观** 类别下查找 **填充颜色** 和 **不透明度**，单击彩色矩形以打开 **颜色选择器**，然后选择任何红色：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_221_0.png)\n\
  \n图 7.13 – 设置健康条的颜色\n\n- 4. 现在，让我们为玩家的耐力重复相同的步骤。在 *层级结构* 面板中，单击第二个进度条。在 *详细信息* 面板中，将名称更改为\
  \ `Stamina Bar` 并单击 **填充** 按钮。在 **填充颜色和不透明度** 中，选择任何绿色。\n- 5. 在 *层级结构* 面板中，单击 **Player\
  \ Stats Bars** 垂直盒，并在 *详细信息* 面板中单击 **填充** 按钮以缩放两个条的水平大小。\n- 6. 我们的表现在看起来如我们所愿，因此现在让我们调整文本标签。在\
  \ *层级结构* 面板中，单击 **Player Stats Text** 下方的第一个文本对象。在 **详细信息** 面板中，将名称更改为 `Health label`。\n\
  - 7. 单击 **水平对齐方式** 旁边的 **右对齐** 按钮，将文本定位在条上。将 **内容** 类别下的 **文本** 字段更改为 `Health`。如果您希望更改字体大小或样式，可以从\
  \ **外观** 类别下的 **字体** 下拉菜单和字段中进行调整：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_222_0.png)\n\
  \n### 图 7.14 – 设置健康条的颜色\n\n- 8. 为耐力标签重复相同的步骤。在 **层级** 面板中，单击第二个文本对象。\n\n- 9. 在 **详细信息**\
  \ 面板中，将名称更改为 `Stamina label`，并单击 **水平对齐** 旁边的 **右对齐** 按钮。将此项的 **文本** 字段更改为 `Stamina`，如有需要，调整字体大小和样式。\n\
  \n需要进行的最后一点调整是将 UI 计量条锚定到屏幕的一侧。由于屏幕尺寸和比例可能不同，我们希望确保 UI 元素在屏幕上保持相同的相对位置。**锚点** 用于定义小部件在画布上的所需位置，无论屏幕尺寸如何。\n\
  \n- 10. 为我们的计量条建立锚点，选择 **玩家统计** 顶级对象，并在 **详细信息** 面板中，单击 **锚点** 下拉菜单。选择出现的第一个选项，该选项显示屏幕左上角的灰色矩形：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_224_0.png)\n\n### 图 7.15 – 设置玩家统计的锚点\n\
  \n这将把我们的计量条锚定在左上角，确保无论分辨率或比例如何，它们始终出现在该角落。\n\n目前，您可以通过更改 **进度** 类别中的 **百分比** 属性来尝试进度条。**百分比**\
  \ 值的范围是 `0.0`（空）到 `1.0`（满）：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_225_0.png)\n\
  \n### 图 7.16 – 百分比确定进度条的填充位置\n\n以下截图显示 **百分比** 设置为 1.0 的进度条：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_225_1.png)\n\
  \n### 图 7.17 – 进度条的最终外观\n\n这就完成了健康和耐力 UI 元素的自定义。下一步是创建一些 UI 文本元素来显示弹药和消灭目标的计数器。\n\
  \n### 创建弹药和消灭目标的计数器\n\n弹药和消灭目标的计数器显示将以类似于我们玩家统计表格的方式工作，区别在于我们希望通过文本而非连续表格来表示其值。新\
  \ UI 元素的层次结构如下：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_226_0.png)\n\n### 图\
  \ 7.18 – 武器统计和目标追踪器层次结构\n\n**玩家统计** 已最小化，因此我们可以专注于 **武器统计** 和 **目标追踪器** 元素。\n\n\
  按照以下步骤创建这些 UI 元素：\n\n- 1. 选择并拖动 **水平框** 从 **调色板** 面板拖到 **层级** 面板，将其释放到 **画布面板**\
