  ### Packaging the game into a build


  ### 将游戏打包为构建版本


  Creating a distributable form of your game for one of these platforms involves a
  process called **packaging**. Packaging takes all the code and assets of the game
  and sets them up in the proper format to be able to perform on the selected platform.
  We will be following the path to making a Windows or macOS release of your game.


  为这些平台之一创建游戏的可分发形式涉及一个称为 **打包** 的过程。打包将获取游戏的所有代码和资源，并将其设置为适当的格式，以便在所选平台上运行。我们将遵循制作游戏的
  Windows 或 macOS 发行版的路径。


  Note


  注意


  It is important to note that Unreal Engine 5 can only create Windows builds from
  a copy of the engine running on a Windows system, and OS X builds from copies installed
  on a macOS running OS X. Thus, the platforms that you can target with your game
  will be partially limited by the machine you are developing the game on. If you
  are developing on a Windows PC and wish to create an OS X build of the game, you
  can install Unreal Engine 5 on a macOS and copy your project files to this new machine.
  From there, you will be able to generate an OS X build, with no further changes
  required.


  需要注意的是，Unreal Engine 5 只能在运行 Windows 系统的引擎副本上创建 Windows 构建版本，以及在运行 OS X 的 macOS
  上安装的副本中创建 OS X 构建版本。因此，你可以用游戏来定位的平台将部分受限于你开发游戏的机器。如果你在 Windows PC 上开发并希望创建游戏的 OS
  X 构建版本，可以在 macOS 上安装 Unreal Engine 5，并将项目文件复制到这台新机器。之后，你将能够生成 OS X 构建版本，无需进一步更改。


  These are the steps to package your game to be played on a particular platform:


  以下是将游戏打包以在特定平台上运行的步骤：


  - 1. Click the **Platforms** button in the toolbar, hover over the desired platform,
  and then click on **Package Project**, as follows:


  - 1. 单击工具栏中的 **平台** 按钮，将鼠标悬停在所需平台上，然后单击 **打包项目**，如下所示：


  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_432_0.png)


  ### Figure 12.7 – Packaging the project for Windows


  ### 图 12.7 – 为 Windows 打包项目


  - 2. Once you click on a platform, you will be prompted to select a location on
  your computer to store the build you make. After selecting a location, you will
  see a popup that tells you that the engine is packaging the project. If something
  goes wrong in the packaging process, you will be shown the details of the error
  in the output log window that pops up. Packaging a project can take a bit of time,
  depending on how complex and large the project is, but if you don''t encounter any
  errors, then you will eventually see a message saying that the packaging is complete.
  Congratulations – you have created a packaged copy of your game!


  - 2. 单击平台后，系统将提示你在计算机上选择一个位置来存储你制作的构建版本。选择位置后，你将看到一个弹出窗口，告知引擎正在打包项目。如果打包过程中出现问题，将在弹出的输出日志窗口中显示错误详细信息。打包项目可能需要一些时间，具体取决于项目的复杂性和大小，但如果你没有遇到任何错误，最终将看到一条消息，说明打包已完成。恭喜
  – 你已创建游戏的打包副本！


  - 3. Navigate to the folder where you chose to store your build. On macOS, open
  the folder called MacNoEditor and double-click on the application to launch it.
  For Windows, open the WindowsNoEditor folder and double-click on the executable
  to run the game. Take a moment to go through the game you created in its final form
  and reflect on just how far you have come. You now have a functional game that other
  people can play and enjoy. Making even simple games is no easy feat, so you should
  feel proud of your accomplishment!


  - 3. 导航到你选择存储构建版本的文件夹。在 macOS 上，打开名为 MacNoEditor 的文件夹并双击应用程序以启动它。在 Windows 上，打开
  WindowsNoEditor 文件夹并双击可执行文件以运行游戏。花点时间体验一下你创建的游戏的最终形式，回顾一下你已经走了多远。你现在拥有一个其他人可以玩和享受的功能性游戏。即使制作简单的游戏也不容易，所以你应该为自己的成就感到自豪！


  We packaged the project using the default settings, but there are a lot of options
  that you can modify in the packaging.


  我们使用默认设置打包了项目，但在打包中有许多选项可以修改。


