- "## 第 18 章：创建蓝图库和组件\n\n在本章中，您将学习如何创建具有通用功能的蓝图宏和函数库，这些功能可在整个项目中使用。本章将更详细地介绍组件的概念。我们还将学习如何创建具有封装行为的\
  \ Actor 组件和具有基于位置行为的 Scene 组件。\n\n本章涵盖的主题：\n\n- 蓝图宏和函数库\n- 创建 Actor 组件\n- 创建 Scene\
  \ 组件\n\n在本章结束时，您将创建一个用于模拟掷骰子的蓝图函数库、一个用于管理经验点数和升级的 Actor 组件，以及一个围绕 Actor 旋转的 Scene\
  \ 组件。\n\n### 蓝图宏和函数库\n\n有时，在项目中，您会发现某个宏或函数可以在多个蓝图中使用。虚幻编辑器允许您创建蓝图宏库来收集您希望在所有蓝图之间共享的宏。同样，您可以创建蓝图函数库来在所有蓝图之间共享实用函数。\n\
  \n创建蓝图函数库和蓝图宏库的菜单选项位于创建时出现的蓝图子菜单中。\n\n\n\n\n\n一个资产：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_606_0.png)\n\
  \n图 18.1 – 创建蓝图宏和函数库的菜单选项\n\n创建蓝图宏库时，需要选择一个父类。该库中的宏将可以访问所选父类的变量和函数，但宏库只能由所选父类的子类使用。在大多数情况下，选择\
  \ Actor 类将是最佳选项。\n\n让我们创建一个蓝图函数库，以实际了解如何在所有蓝图之间共享函数。\n\n### 蓝图函数库示例\n\n我们将创建一个名为\
  \ BP_DiceLibrary 的蓝图函数库，用于骰子掷骰，包含三个函数 – RollOneDie、RollTwoDice 和 RollThreeDie。所有函数都具有名为\
  \ NumberOfFaces 的相同输入参数，并返回每个骰子的结果及其总和。\n\n此蓝图函数库可用于创建数字桌游或基于掷骰子的 **RPG（角色扮演游戏）**。\n\
  \n按照以下步骤创建蓝图函数库：\n\n- 1. 基于 **第三人称** 模板和启动内容创建项目。\n- 2. 在内容浏览器中，访问 `Content` 文件夹。在文件夹列表旁边的空白处右键单击，并选择\
  \ **新建文件夹** 选项。将文件夹命名为 `Chapter18`。我们将使用此文件夹存储本章的资产。\n- 3. 打开刚才创建的 **Chapter18**\
  \ 文件夹，然后单击内容浏览器中的 **添加** 按钮，将鼠标悬停在 **蓝图** 上方，并选择 **蓝图函数库** 选项：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_607_0.png)\n\
  \n图 18.2 – 创建蓝图函数库\n\n- 4. 将蓝图命名为 `BP_DiceLibrary`，并双击它打开蓝图编辑器。\n- 5. 蓝图编辑器将打开一个默认函数。将函数重命名为\
  \ `RollOneDie`。\n- 6. 在 **详情** 面板中，添加一个名为 `NumberOfFaces` 的 **整数** 类型输入参数。单击 > 符号以展开选项，并将\
  \ **默认值** 设置为 6：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_608_0.png)\n\n图 18.3\
  \ – 创建输入参数并设置默认值\n\n- 7. 在 **详情** 面板中，添加一个名为 `Result` 的 **整数** 类型输出参数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_608_1.png)\n\
  \n图 18.4 – 创建输出参数\n\n- 8. 在事件图中，添加以下屏幕截图中的节点。这些节点用于检查 **骰子面数** 是否大于 1。验证输入参数是良好的做法，可避免出现难以查找的意外错误：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_609_0.png)\n\n图 18.5 – 检查骰子面数是否大于 1\n\
  \n### 注意\n\n可以通过将面数设置为 2 来模拟抛硬币。\n\n- 9. 在事件图中右键单击并添加一个范围内随机整数节点。该节点返回大于或等于 Min\
  \ 且小于或等于 Max 的随机整数值。在 Min 输入参数中输入 1：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_609_1.png)\n\
  \n图 18.6 – 使用范围内随机整数节点\n\n- 10. 从骰子面数参数拖出一条线并连接到 Max 输入引脚。将返回值输出引脚连接到结果引脚。将分支节点的\
  \ 真 引脚连接到返回节点的空白引脚。\n\n- 11. 让我们创建蓝图函数库的第二个函数。在 **我的蓝图** 面板中，单击 **函数** 右侧的 + 图标：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_610_0.png)\n\n图 18.7 – 创建另一个函数\n\n- 12.\
  \ 将函数命名为 `RollTwoDice`。创建一个名为 `NumberOfFaces` 的 **整数** 类型输入参数。单击 > 符号以展开选项，并将 **默认值**\
  \ 设置为 6。\n\n- 13. 创建名为 `Sum`、`Die1` 和 `Die2` 的输出参数，全部为 **整数** 类型：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_610_1.png)\n\
  \n图 18.8 – 创建输出参数\n\n- 14. 在事件图中，我们将对 **RollOneDie** 函数执行相同的验证，以检查 **骰子面数** 是否大于\
  \ 1。添加图 18.5 中的节点。您也可以访问 **RollOneDie** 函数，选择并复制验证节点，然后粘贴到 **RollTwoDice** 函数中。\n\
  \n- 15. 向事件图中添加两个 **范围内随机整数** 节点。在两个节点的 **Min** 输入参数中输入 `1`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_611_0.png)\n\
  \n图 18.9 – 生成两个随机整数\n\n- 16. 从 **骰子面数** 参数拖出线并连接到两个节点的 **Max** 输入引脚。\n\n- 17. 将第一个\
  \ **范围内随机整数** 节点的 **返回值** 输出引脚连接到 **Die1** 引脚。将第二个 **范围内随机整数** 节点的 **返回值** 输出引脚连接到\
  \ **Die2** 引脚。\n\n- 18. 在事件图中右键单击并创建一个 **添加** 节点。将第一个 **范围内随机整数** 节点的 **返回值** 输出引脚连接到\
  \ **添加** 节点的顶部输入引脚。将第二个 **范围内随机整数** 节点的 **返回值** 输出引脚连接到 **添加** 节点的底部输入引脚。\n\n- 19.\
  \ 将 **添加** 节点的输出引脚连接到 **返回节点** 的 **总和** 引脚。将 **分支** 节点的 **真** 引脚连接到 **返回节点** 的空白引脚。\n\
  \n- 20. 编译并保存蓝图。\n\n按照这些步骤，我们已完成库中第二个函数的创建。在下一节中，我们将创建第三个函数，其做法与第二个函数不同，以展示另一种示例。然后，我们将测试我们的蓝图函数库。\n\
  \n### 创建第三个函数并进行测试\n\n在第三个函数中，我们将使用局部变量来存储临时值。局部变量仅在定义它们的函数内可见。局部变量的值将在函数执行结束时丢弃。\n\
  \n另一个需要注意的重要点是，我们将仅使用一个范围内随机整数节点来生成三个骰子的值。\n\n以下是创建第三个函数并进行测试的步骤：\n\n- 1. 在我的蓝图\
  \ 面板中，单击 函数 右侧的 + 图标。将函数命名为 RollThreeDice：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_612_0.png)\n\
  \n图 18.10 – 创建库的第三个函数\n\n- 2. 创建一个名为 NumberOfFaces 的整数 类型输入参数。单击 > 符号以展开选项，并将 默认值\
  \ 设置为 6。\n\n- 3. 创建名为 Sum、Die1、Die2 和 Die3 的输出参数，全部为整数类型：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_613_0.png)\n\
  \n图 18.11 – 创建输出参数\n\n- 4. 我的蓝图 面板显示正在编辑的函数的局部变量。单击 局部变量 右侧的 + 图标，以创建 Die1Var、Die2Var\
  \ 和 Die3Var 的 整数 类型局部变量。局部变量的名称必须与函数的输入参数和输出参数的名称不同：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_613_1.png)\n\
  \n图 18.12 – 创建局部变量\n\n- 5. 在事件图中，我们将对 RollOneDie 函数执行相同的验证，以检查 骰子面数 是否大于 1。添加图 18.5\
  \ 中的节点。\n\n- 6. 向事件图中添加一个范围内随机整数节点。在 Min 输入参数中输入 1。添加 SET Die1Var、SET Die2Var 和\
  \ SET Die3Var 节点，并按照以下屏幕截图所示将它们连接起来：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_614_0.png)\n\
  \n图 18.13 – 生成三个随机整数\n\n### 注意\n\n执行每个 SET 节点时，范围内随机整数节点都会再次执行以生成一个新随机数。\n\n- 7.\
  \ 将 SET Die3Var 节点的空白输出引脚连接到返回节点的空白引脚。添加 GET Die1Var、GET Die2Var、GET Die3Var 和 添加\
  \ 节点。单击 添加引脚 + 以添加 添加 节点的第三个引脚。按照以下屏幕截图所示将节点连接起来：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_614_1.png)\n\
  \n\n\nFigure 18.14 – 返回局部变量的值\n\n- 8. 编译并保存蓝图。关闭蓝图编辑器。\n\n- 9. 我们将使用关卡蓝图来测试我们的 **BP_DiceLibrary**\
  \ 函数库。单击工具栏上的 **Blueprints** 按钮并选择 **Open Level Blueprint**:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_615_0.png)\n\
  \nFigure 18.15 – 打开关卡蓝图\n\n- 10. 在靠近 **Event BeginPlay** 节点的 EventGraph 上单击右键。搜索\
  \ `roll`。我们的蓝图库函数将在 **BP Dice Library** 类别中提供:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_616_0.png)\n\
  \nFigure 18.16 – BP Dice Library 函数可用于项目中的所有蓝图\n\n- 11. 选择 **Roll Three Dice** 函数，并将\
  \ **Event BeginPlay** 的白色引脚连接到 **Roll Three Dice** 节点的白色输入引脚。在 EventGraph 上单击右键并添加\
  \ **Format Text** 和 **Print Text** 节点:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_616_1.png)\n\
  \nFigure 18.17 – 测试 Roll Three Dice 函数\n\n- 12. 在 **Format Text** 节点的 **Format**\
  \ 参数中添加以下表达式:\n\n```\nSum: {Sum} / Die1: {Die1} / Die2: {Die2} / Die3: {Die3}\n\
  ```\n\n- 13. { } 之间的名称将转换为 **Format Text** 节点的输入参数。有关此节点的更多信息，请参见 _第15章，蓝图技巧_。\n\
  \n- 14. 将 **Roll Three Dice** 节点的输出白色引脚连接到 **Print Text** 的输入白色引脚。将 **Roll Three\
  \ Dice** 的其他输出引脚连接到 **Format Text** 的等效输入引脚。\n\n- 15. 将 **Format Text** 的 **Result**\
  \ 引脚连接到 **Print Text** 的 **In Text** 引脚。单击 **Print Text** 节点底部的小箭头以展开可选参数。将 **Duration**\
  \ 设置为 10.0 秒。\n\n- 16. 编译、保存并关闭关卡蓝图编辑器。\n\n- 17. 单击关卡编辑器的 **Play** 按钮。掷三个骰子的结果将在屏幕上打印：\n\
  \n```\nSum: 8 / Die1: 4 / Die2: 1 / Die3: 3\n```\n\nFigure 18.18 – 掷三个骰子的结果\n\n\
  `BP_DiceLibrary` 的函数可用于任何蓝图。同样的理念也适用于蓝图宏库，但我们不是创建函数，而是创建宏。有关宏和函数之间差异的更多信息，请参见 [第2章，使用蓝图进行编程]。\n\
  \n在下一节中，我们将看到通过创建 Actor 组件来共享常见功能的另一种方法。\n\n### 创建 Actor 组件\n\n创建 Actor 蓝图时，我们通常会添加带有封装功能的组件，这些组件即开即用，例如\
  \ **Projectile Movement**、**Static Mesh** 和 **Collision** 组件。我们也可以使用蓝图创建自己的 Actor\
  \ 组件。\n\n创建蓝图时，在 **Pick Parent Class** 面板中，有两个 **COMMON** 类可用于创建组件，即 **Actor Component**\
  \ 和 **Scene Component**:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_618_0.png)\n\
  \nFigure 18.19 – 创建 Actor 组件和 Scene 组件\n\nScene Component 是 Actor Component 的子类，具有\
  \ Transform 结构（位置、旋转和缩放）。由于有 Transform，Scene Component 可以附加到另一个 Scene Component。我们将在下一节中探讨\
  \ Scene Component。\n\n在 EventGraph 中脚本化组件时，可以使用 **Get Owner** 节点获取正在使用该组件的 Actor\
  \ 的引用:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_618_1.png)\n\nFigure 18.20 –\
  \ 获取正在使用该组件的 Actor 的引用\n\n我们将创建一个名为 `BP_ExpLevelComp` 的 Actor 组件，它具有一个整数数组，用于存储升级所需的每个级别的经验点数。该组件将具有一个名为\
  \ `IncreaseExperience` 的函数，用于增加经验点数并检查 Actor 是否应该升级。\n\n如果要为 Actor 添加升级管理器，只需将 `BP_ExpLevelComp`\
  \ 组件添加到 Actor，调整升级所需经验点数的数组，并使用组件的函数即可。\n\n以下是创建我们 Actor 组件的步骤：\n\n- 1. 在内容浏览器中单击\
  \ **Add** 按钮，然后选择 **Blueprint Class** 选项。\n\n- 2. 在下一屏幕中，选择 **Actor Component**\
  \ 作为父类。将蓝图命名为 `BP_ExpLevelComp` 并双击它打开蓝图编辑器。请注意，**Components** 选项卡未显示，因为我们不能在组件内添加组件。\n\
  \n- 3. 在 **My Blueprint** 面板中，创建 **Integer** 类型的 **CurrentLevel** 和 **CurrentXP**\
  \ 变量:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_619_0.png)\n\nFigure 18.21 – 创建组件的变量\n\
  \n### 注意\n\n缩略语 **XP** 表示 **经验点数**。\n\n- 4. 创建另一个名为 `ExpLevel` 的 **Integer** 类型变量。在\
  \ **Details** 面板中，单击 **Variable Type** 右侧的图标并选择 **Array**:\n\n| 变量名称 | ExpLevel\
  \ |\n| 变量类型 | Integer |\n| 实例可编辑 | |\n\nFigure 18.22 – 创建一个数组以存储每个级别所需的经验点数\n\n\
  - 5. 编译蓝图。在 Default Value 中，向 ExpLevel 数组添加 10 个元素。在 BP_ExpLevelComp 中，CurrentLevel\
  \ 变量将用作 ExpLevel 数组的索引。为每个元素键入以下屏幕截图中的值:\n\n| 索引 | 值 |\n|---|---|\n| [ 0 ] | 0 |\n\
  | [ 1 ] | 100 |\n| [ 2 ] | 200 |\n| [ 3 ] | 400 |\n| [ 4 ] | 800 |\n| [ 5 ] | 1200\
  \ |\n| [ 6 ] | 1600 |\n| [ 7 ] | 2000 |\n| [ 8 ] | 2500 |\n| [ 9 ] | 3000 |\n\n\
  Figure 18.23 – 每个级别所需的经验点数\n\n- 6. 我们将创建一个名为 **IncreaseExperience** 的函数来增加经验并升级。但首先，我们将创建两个宏来简化函数图表。\n\
  \n- 7. 在 **My Blueprint** 面板中，创建一个名为 `CanLevelUp` 的宏:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_621_0.png)\n\
  \nFigure 18.24 – 创建 CanLevelUp 宏\n\n- 8. 在 **Details** 面板中，创建宏的输入和输出参数:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_621_1.png)\n\
  \nFigure 18.25 – 创建 CanLevelUp 宏的输入和输出参数\n\n- 9. 将以下屏幕截图中的节点添加到 **CanLevelUp** 宏。此宏通过将\
  \ **Current Level** 变量与 **Exp Level** 数组的 **LAST INDEX** 进行比较，来检查 Actor 是否处于最大级别:\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_622_0.png)\n\nFigure 18.26 – CanLevelUp\
  \ 宏的节点\n\n- 10. 在 **My Blueprint** 面板中，创建另一个名为 **XpReachesNewLevel** 的宏。在 **Details**\
  \ 面板中，创建与 *Figure 18.25* 中显示的 **CanLevelUp** 宏相同的输入和输出参数。\n\n- 11. 将以下屏幕截图中的节点添加到\
  \ **XpReachesNewLevel** 宏。我们需要使用 **Exp Level** 数组的 **Get (a copy)** 节点，因为我们只需要读取数组中存储的值。此宏检查\
  \ **Current XP** 是否等于或大于 **Exp Level** 数组中下一个索引存储的经验点数:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_622_1.png)\n\
  \nFigure 18.27 – XpReachesNewLevel 宏的节点\n\n- 12. 编译蓝图。在 **My Blueprint** 面板中，创建一个名为\
  \ `IncreaseExperience` 的函数:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_623_0.png)\n\
  \nFigure 18.28 – 创建 IncreaseExperience 函数\n\n- 13. 在 **Details** 面板中，创建函数的输入和输出参数:\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_623_1.png)\n\nFigure 18.29 – 创建输入和输出参数\n\
  \n- 14. 在 **My Blueprint** 面板中，创建一个名为 `LevelUpVar` 的 **Boolean** 类型局部变量。此局部变量将存储函数返回的值，指示\
  \ **Actor** 是否已升级。Boolean 变量的默认值为 `False`:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_623_2.png)\n\
  \nFigure 18.30 – 创建局部变量\n\n- 15. 下一个屏幕截图显示了 **Increase Experience** 函数的第一部分。该函数正在使用我们创建的两个宏。添加屏幕截图中的节点，并将\
  \ **Can Level Up** 的 **No** 输出引脚连接到 **Return Node** 的白色输入引脚:\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_624_0.png)\n\
  \n图 18.31 – IncreaseExperience 函数的第一部分\n\n- 16. 下一个截图显示 IncreaseExperience 函数的第二部分。如果\
  \ Xp Reaches New Level 宏的 Yes 引脚被执行，则我们将 Current Level 变量加 1，并将 Level Up Var 变量设置为\
  \ True。添加截图中的节点并编译蓝图：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_624_1.png)\n\n\
  图 18.32 – IncreaseExperience 函数的第二部分\n\n- 17. 编译蓝图并关闭蓝图编辑器。\n\n我们已完成 BP_ExpLevelComp\
  \ 组件。要测试它，需要将该组件添加到角色。\n\n### 测试角色组件\n\n我们将 BP_ExpLevelComp 组件添加到 ThirdPersonCharacter，并使用定时器每秒增加经验值。每次\
  \ ThirdPersonCharacter 升级时，会在屏幕上打印一条消息。\n\n按照以下步骤测试 `BP_ExpLevelComp` 组件：\n\n- 1.\
  \ 打开位于 `Content > ThirdPersonBP > Blueprints` 文件夹中的 `ThirdPersonCharacter` 蓝图。\n\
  \n- 2. 在 **组件** 面板中，单击 **添加** 按钮并搜索 `level`。选择 **BP 经验等级组件**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_625_0.png)\n\
  \n图 18.33 – 添加 BP 经验等级组件\n\n- 3. 在 **详情** 面板中，可以修改 **经验等级** 数组的默认值或添加更多数组元素：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_626_0.png)\n\n图 18.34 – 经验等级数组可编辑\n\n-\
  \ 4. 在事件图表中，添加 **开始游戏** 节点和 **通过事件设置定时器** 节点。我们将使用定时器每秒调用一次事件，以增加经验值。将 Time 参数设置为\
  \ 1.0 并勾选 Looping 参数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_627_0.png)\n\n\
  图 18.35 – 创建每秒运行一次事件的定时器\n\n- 5. 从 **通过事件设置定时器** 节点的 Event 引脚拖出一条线，并在上下文菜单中选择 **添加自定义事件**。将自定义事件重命名为\
  \ GainXP。此事件将运行 BP 经验等级组件的 **增加经验值** 函数，并将 100 作为输入参数传递。这些是我们要添加到 GainXP 事件的节点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_627_1.png)\n\n图 18.36 – GainXP 自定义事件的节点\n\
  \n- 6. 从组件面板中拖动 BP 经验等级组件并将其放置到事件图表中以创建 **获取** 节点。\n\n- 7. 从 **获取 BP 经验等级组件** 节点拖出一条线并添加\
  \ **增加经验值** 函数节点。在 Experience Points 参数中输入 100。\n\n- 8. 添加一个 **分支** 节点以检查角色是否升级。向事件图表添加\
  \ **打印字符串** 和 **追加** 节点，并按照 *图 18.36* 所示连接它们。当连接不同类型的引脚时，转换节点会自动创建。\n\n- 9. 在 **追加**\
  \ 节点的 **A** 引脚中，输入 `Leveled up`（末尾带一个空格）。此节点将使用 **A** 和 **B** 引脚的值创建一个 `String`。\n\
  \n- 10. 编译蓝图并单击关卡编辑器的 **开始游戏** 按钮。每次 `ThirdPersonCharacter` 升级时，屏幕上都会打印一条消息：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_628_0.png)\n\n图 18.37 – 角色升级时在屏幕上打印消息\n\
  \n如果需要在屏幕上显示角色的经验值和等级，可以使用 BP 经验等级组件的 **获取当前经验值** 和 **获取当前等级** 节点获取这些值：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_628_1.png)\n\
  \n图 18.38 – 获取当前经验值和当前等级变量\n\n我们已学习如何创建角色组件。下一步是创建场景组件以将其他组件附加到它。\n\n### 创建场景组件\n\
  \n我们将创建一个名为 BP_CircularMovComp 的场景组件，它将围绕角色旋转。然后，我们将静态网格组件附加到 BP_CircularMovComp\
  \ 组件以模拟旋转护盾。\n\n按照以下步骤创建场景组件：\n\n- 1. 访问本章第一个示例中创建的 Chapter18 文件夹。\n\n- 2. 在内容浏览器中单击\
  \ **添加** 按钮，然后选择 **蓝图类** 选项。\n\n- 3. 在下一屏幕中，选择 **场景组件** 作为父类。将蓝图命名为 BP_CircularMovComp\
  \ 并双击它以打开蓝图编辑器。\n\n- 4. 在 **我的蓝图** 面板中，创建 Float 类型的 RotationPerSecond 和 DeltaAngle\
  \ 变量：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_629_0.png)\n\n图 18.39 – 创建组件的变量\n\
  \n- 5. 编译蓝图并选择 RotationPerSecond 变量。在 **详情** 面板中，将 **默认值** 设置为 180.0。该值为角度单位，因此该组件将在\
  \ 2 秒内围绕角色完成一次旋转：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_629_1.png)\n\n图 18.40\
  \ – 设置每秒旋转度数变量的默认值\n\n- 6. 我们将使用 **每帧更新** 为组件创建平滑移动。**每帧更新** 每帧执行一次。它具有 Delta Seconds\
  \ 参数，用于存储自上次执行 **每帧更新** 以来的时间。我们将用 Delta Seconds 乘以每秒旋转度数来计算 DeltaAngle，即当前帧将旋转的角度值。在事件图表中添加截图中的节点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_630_0.png)\n\n图 18.41 – 计算 Delta Angle\
  \ 的值\n\n- 7. 下一个截图显示我们将添加到 **每帧更新** 的其他节点。这些节点用于计算并设置场景组件的新相对位置，以及修改局部旋转，使场景组件始终指向旋转中心。需要右键单击\
  \ AddLocalRotation 的 Delta Rotation 参数，并选择 **拆分结构体引脚** 以访问 Delta Rotation Z (Yaw)\
  \ 引脚：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_630_1.png)\n\n图 18.42 – **每帧更新**\
  \ 的其他节点\n\n- 8. 编译蓝图。这就是 `BP_CircularMovComp` 的全部功能。下一步是将此组件添加到角色，然后向其附加一个静态网格组件。\n\
  \n- 9. 打开位于 `Content > ThirdPersonBP > Blueprints` 文件夹中的 `ThirdPersonCharacter`\
  \ 蓝图。\n\n- 10. 在 **组件** 面板中，选择 **胶囊体组件** 以确保我们的场景组件将附加到根组件。单击 **添加** 按钮并搜索 `circular`。选择\
  \ **BP_CircularMovComp**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_631_0.png)\n\
  \n图 18.43 – 添加 BP_CircularMovComp\n\n- 11. 在 **组件** 面板中，选择已添加的 **BP_CircularMovComp**\
  \ 并单击 **添加** 按钮。选择 **静态网格** 组件将其附加到 **BP_CircularMovComp**。应用于 **BP_CircularMovComp**\
  \ 的移动和旋转将影响 **静态网格**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_632_0.png)\n\n\
  图 18.44 – 将静态网格组件附加到我们的场景组件\n\n- 12. 现在，我们需要配置组件。访问 **视口** 选项卡以便查看下一个更改的结果。在 **组件**\
  \ 面板中选择 **BP_CircularMovComp**。在 **详情** 面板中，将 **位置** 的 *x*（红色）值设置为 70.0。可以在 **默认**\
  \ 类别中修改 **每秒旋转度数** 的值：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_633_0.png)\n\n\
  图 18.45 – 设置 BP_CircularMovComp 的相对位置\n\n- 13. 在组件面板中选择静态网格组件。在 **详情** 面板中，将静态网格设置为\
  \ Shape_Cube，材质设置为 M_Tech_Hex_Tile_Pulse。可以在 **视口** 选项卡中查看组件。将 **位置** 的 *z*（蓝色）值设置为\
  \ -80.0，缩放设置为 x = 0.1、y = 1.0、z = 1.5：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_634_0.png)\n\
  \n图 18.46 – 设置静态网格组件\n\n- 14. 编译蓝图并单击关卡编辑器的 **开始游戏** 按钮。**BP_CircularMovComp** 将使护盾围绕角色旋转：\n\
  \n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_635_0.png)\n\n图 18.47 – 角色带有一个旋转盾牌\n\
  \n场景组件用作其他组件的参考位置。你可以通过将场景组件相互附加来创建层次结构。角色需要有一个被指定为 **根** 组件的场景组件。角色的变换由根组件获得。\n\
  \n### 总结\n\n在本章中，我们学习了如何创建可在整个项目中使用的蓝图宏库和函数库。我们创建了一个蓝图函数库来模拟掷骰子。\n\n本章解释了角色组件和场景组件之间的区别。我们学习了如何创建角色组件来管理经验值和升级。\n\
  \n我们还创建了一个围绕角色旋转的场景组件，并向其附加了一个静态网格组件来模拟旋转盾牌。\n\n在下一章中，我们将学习如何使用蓝图的构造脚本来编写程序化生成脚本。我们还将学习如何使用样条工具以及如何创建编辑器实用蓝图。\n\
  \n### 测验\n\n- 1. 蓝图宏库中的宏可以访问父类的变量和函数。\n  - a. 正确\n  - b. 错误\n\n- 2. 蓝图函数库可以包含函数和宏。\n\
  \  - a. 正确\n  - b. 错误\n\n- 3. 角色组件是场景组件的子类。\n  - a. 正确\n  - b. 错误\n\n- 4. 在角色组件中，你可以使用\
  \ **获取所有者** 节点来获取使用该组件的角色的引用。\n  - a. 正确\n  - b. 错误\n\n- 5. 场景组件可以直接放置在关卡中。\n  -\
  \ a. 正确\n  - b. 错误\n"
- "## 第 19 章：程序化生成\n\n在本章中，我们将探讨几种自动生成关卡内容的方法。你可以使用蓝图的构造脚本来编写程序化生成，并使用样条工具定义一条路径，该路径将作为定位实例的参考。此外，你还可以创建编辑器实用蓝图来在编辑模式下操作资产和角色。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 使用构造脚本进行程序化生成\n- 创建蓝图样条\n- 编辑器实用蓝图\n\n本章结束时，你将知道如何使用构造脚本生成关卡内容，以及如何创建蓝图样条在预定义路径上放置角色。你还将能够创建在编辑器中运行的蓝图函数。\n\
  \n### 使用构造脚本进行程序化生成\n\n程序化生成是一种使用脚本而不是手动操作来创建关卡内容的方法。它可以用于避免关卡编辑中的重复性工作。我们在蓝图中用于程序化生成的主要工具是构造脚本。\n\
  \n我们在第3章“面向对象编程与游戏性框架”中了解了如何使用构造脚本，以允许关卡设计器在关卡编辑器中更改蓝图的静态网格。\n\n一个用于程序化生成的有用组件是\
  \ **实例化静态网格** 组件。该组件经过优化，可在关卡中渲染多个相同网格的副本。\n\n### 注意\n\n还有 **分层实例化静态网格** 组件，它与 **实例化静态网格**\
  \ 类似，但在网格具有 **细节层次 (LOD)** 时很有用。\n\n我们在组件中设置静态网格，并使用 **添加实例** 函数使用 **实例变换** 在关卡上添加实例：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_639_0.png)\n\n图 19.1 – 添加实例函数\n\n我们将创建一个名为\
  \ `BP_ProceduralMeshes` 的蓝图来查看程序化生成的实际效果。该蓝图将在关卡上添加静态网格实例行。关卡设计器将能够指定使用的静态网格、行数以及每行的实例数量。\n\
  \n我们将使用 **空白** 项目，因为我们将能够在本章蓝图的关卡编辑器中看到结果。\n\n按照以下步骤创建程序化生成蓝图：\n\n- 1. 创建带有入门内容的\
  \ **空白** 项目：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_640_0.png)\n\n图 19.2 –\
  \ 创建空白项目\n\n- 2. 在内容浏览器中，访问 `Content` 文件夹。在文件夹列表旁边的空白处右键单击并选择 **新建文件夹** 选项。将文件夹命名为\
  \ `Chapter19`。我们将使用此文件夹存储本章的资产。\n\n- 3. 打开你刚创建的 **Chapter19** 文件夹，然后单击内容浏览器中的 **添加**\
  \ 按钮，并选择 **蓝图类** 选项。\n\n- 4. 在下一屏幕中，选择 **角色** 作为父类。将蓝图命名为 `BP_ProceduralMeshes`\
  \ 并双击它以打开蓝图编辑器。\n\n- 5. 在 **我的蓝图** 面板中，创建一个名为 `StaticMeshVar` 的变量。单击 **变量类型** 并搜索\
  \ `static mesh`。将鼠标悬停在 **静态网格** 上并选择 **对象引用**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_640_1.png)\n\
  \n图 19.3 – 创建引用静态网格的变量\n\n- 6. 在 **详情** 面板中，检查 **实例可编辑** 属性，以便我们可以在关卡编辑器中更改实例使用的静态网格：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_641_0.png)\n\n图 19.4 – StaticMeshVar\
  \ 变量\n\n- 7. 编译蓝图。在 **静态网格变量** 的默认值中，选择 SM_Chair 静态网格：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_641_1.png)\n\
  \n图 19.5 – 选择生成中使用的默认静态网格\n\n- 8. 在 **我的蓝图** 面板中，创建以下屏幕截图中显示的变量。它们都必须设置为 **实例可编辑**。你可以单击眼睛图标使变量可实例编辑：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_641_2.png)\n\n图 19.6 – 生成脚本中使用的变量\n\n\
  - 9. 编译蓝图，并为变量设置以下默认值：\n  - InstancesPerRow: 1\n  - NumberOfRows: 1\n  - SpaceBetweenInstances:\
  \ 100.0\n  - SpaceBetweenRows: 150.0\n\n- 10. 在组件面板中，单击 + 添加按钮并搜索 instance。选择实例化静态网格：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_642_0.png)\n\n图 19.7 – 添加实例化静态网格组件\n\n\
  我们有这个蓝图所需的变量和组件。现在，让我们来处理脚本。\n\n#### 创建向关卡添加实例的脚本\n\n此蓝图的脚本将全部在构造脚本中完成。按照以下步骤创建程序化生成脚本：\n\
  \n- 1. 单击构造脚本选项卡：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_643_0.png)\n\n图 19.8\
  \ – 访问构造脚本\n\n- 2. 在 **我的蓝图** 面板中，创建一个名为 *实例位置 X* 的 **浮点** 类型局部变量：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_643_1.png)\n\
  \n图 19.9 – 创建局部变量\n\n- 3. 下一张屏幕截图显示了我们将添加到 **构造脚本** 的节点的第一部分。我们获取 **静态网格变量** 变量中存储的\
  \ **静态网格**，并将其设置为由 **实例化静态网格** 组件使用。**For 循环** 将根据 **行数** 重复。我们通过将 **For 循环** 的当前\
  \ **索引** 乘以 **行间距** 来计算每行的 **实例位置 X**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_643_2.png)\n\
  \n图 19.10 – 构造脚本的第一部分\n\n- 4. 在构造脚本节点附近添加获取实例化静态网格和获取静态网格变量节点。\n\n- 5. 从获取实例化静态网格节点拖出一条线并添加设置静态网格节点。从获取静态网格变量节点拖出一条线并将其连接到新网格参数。\n\
  \n- 6. 从设置静态网格节点的白色输出引脚拖出一条线并添加一个 For 循环节点。在第一个索引参数中输入 1。从最后一个索引参数拖出一条线并添加一个获取行数节点。\n\
  \n- 7. 添加一个获取行间距节点。从索引输出节点拖出一条线并添加一个乘法节点。从获取行间距拖出一条线并将其连接到乘法节点的底部引脚。该引脚将从整数转换为浮点数。\n\
  \n- 8. 从循环体输出引脚拖出一条线并添加一个设置实例位置 X 节点。将乘法节点的输出引脚连接到实例位置 X 的输入引脚。\n\n- 9. 下一张屏幕截图显示了我们将添加到构造脚本的节点的第二部分。第二个\
  \ For 循环节点将根据每行实例数重复。添加实例节点将在关卡上添加一个静态网格实例。当前行中所有实例的相对位置 X 将相同。相对位置 Y 是通过将第二个 For\
  \ 循环节点的当前索引乘以实例间距来计算的：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_644_0.png)\n\n\
  图 19.11 – 构造脚本的第二部分\n\n\n\n\n\n- 10. 从 Set Instance Location X 的白色输出引脚拖出一条线，并添加\
  \ For Loop 节点。在 First Index 参数中输入 1。从 Last Index 参数拖出一条线，并添加 Get Instances Per Row\
  \ 节点。\n\n- 11. 添加 Get Space Between Instances 节点。从 Index 输出节点拖出一条线，并添加 Multiply\
  \ 节点。从 Get Space Between Instances 拖出一条线，并将其连接到 Multiply 节点的底部引脚。该引脚将从整数转换为浮点数。\n\
  \n- 12. 添加 Get Instanced Static Mesh 节点。从其输出引脚拖出一条线，并添加 Add Instance 节点。将 Loop Body\
  \ 输出引脚连接到 Add Instance 节点的白色输入引脚。\n\n- 13. 右键单击 Instance Transform 参数并选择 Split Struct\
  \ Pin。右键单击 Instance Transform Location 参数并再次选择 Split Struct Pin。\n\n- 14. 从 Instance\
  \ Transform Location X 拖出一条线，并添加 Get Instance Location X 节点。\n\n- 15. 将 Multiply\
  \ 节点的输出引脚连接到 Instance Transform Location Y 的输入引脚。\n\n- 16. 编译蓝图并关闭蓝图编辑器。从内容浏览器中拖动\
  \ **BP_ProceduralMeshes** 并将其放置在关卡中。\n\n- 17. 在关卡编辑器的 **详情** 面板中，将每行实例数设置为 10，将行数设置为\
  \ 10：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_646_0.png)\n\n图 19.12 – 在关卡上设置\
  \ BP_ProceduralMeshes 属性\n\n- 18. 程序化生成的结果可以在下一个截图中看到：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_646_1.png)\n\
  \n图 19.13 – 生成 10 行 10 列的椅子\n\n- 19. 我们可以使用同一个 **BP_ProceduralMeshes** 实例生成种植园。在关卡编辑器的\
  \ **详情** 面板中，将 **静态网格变量** 更改为 `SM_Bush`，并将 **实例间距** 设置为 `300.0`，将 **行间距** 设置为 `300.0`：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_647_0.png)\n\n图 19.14 – 修改关卡上的 BP_ProceduralMeshes\
  \ 属性\n\n- 20. 这是使用新参数的程序化生成结果：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_647_1.png)\n\
  \n图 19.15 – 生成种植园\n\n可以看出，参数的微小变化会产生非常不同的结果。这个示例只是可用程序化生成功能的冰山一角。\n\n在下一节中，我们将学习如何沿路径生成实例。\n\
  \n### 创建蓝图样条\n\n样条是一种用于定义曲线的特殊数学函数。蓝图样条组件可用于定义路径以在关卡中移动 Actor。我们还可以获取路径沿线的位置来放置实例。我们可以通过添加、平移和旋转样条点，在关卡编辑器中编辑样条。\n\
  \n下一个截图显示了样条组件的三个常用函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_648_0.png)\n\n\
  图 19.16 – 样条组件的一些函数\n\n### 函数描述如下：\n\n- Get Spline Length：此函数返回一个浮点数值，表示样条的长度。\n\
  - Get Location at Distance Along Spline：此函数将距离作为输入参数，并返回样条中找到的位置。坐标空间可以是本地（相对）或世界。\n\
  - Get Rotation at Distance Along Spline：与前一个函数的思路相同，但它返回旋转。\n\n我们将创建一个名为 BP_SplinePlacement\
  \ 的蓝图，用于沿样条添加静态网格实例。关卡设计师可以在关卡编辑器中编辑样条，并指定实例之间的间距。\n\n### 创建蓝图的步骤如下：\n\n- 1. 在内容浏览器中单击添加按钮，并选择蓝图类选项。在下一个屏幕上，选择\
  \ Actor 作为父类。为蓝图命名 BP_SplinePlacement 并双击它以打开蓝图编辑器。\n- 2. 在 **我的蓝图** 面板中，创建一个名为\
  \ StaticMeshVar 的变量。单击变量类型并搜索静态网格。将鼠标悬停在静态网格上并选择对象引用。单击眼图标以使变量可实例编辑。\n- 3. 编译蓝图。在静态网格变量的\
  \ **默认值** 中，选择 SM_FieldArrow 静态网格：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_649_0.png)\n\
  \n图 19.17 – 选择生成中使用的默认静态网格\n\n### 注意\n\n如果 `SM_FieldArrow` 静态网格未出现，请单击内容浏览器的设置图标，并选择\
  \ **显示引擎内容**。\n\n- 4. 在 **我的蓝图** 面板中，创建一个名为 `SpaceBetweenInstances` 的 **浮点数** 类型变量。单击眼图标，将该变量设置为\
  \ **实例可编辑**。\n\n- 5. 编译蓝图，并将 `SpaceBetweenInstances` 的 **默认值** 设置为 `100.0`。\n\n\
  - 6. 在 **组件** 面板中，单击 + **添加** 按钮并搜索 `spline`。选择 **样条** 组件：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_650_0.png)\n\
  \n图 19.18 – 添加样条组件\n\n- 7. 在 **组件** 面板中选择 DefaultSceneRoot 并添加一个 InstancedStaticMesh\
  \ 组件：\n\n图 19.19 – BP_SplinePlacement 使用的组件\n\n- 8. 我们将创建一个宏来简化构建脚本图表。在 **我的蓝图**\
  \ 面板中，创建一个名为 `CalculateNumberOfInstances` 的宏：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_651_0.png)\n\
  \n图 19.20 – 创建宏\n\n- 9. 在 **详情** 面板中，创建一个名为 `Number Of Instances` 的 **输出** 参数，类型为\
  \ **整数**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_651_1.png)\n\n图 19.21 – 创建输出参数\n\
  \n- 10. 在 `CalculateNumberOfInstances` 宏中添加以下截图所示的节点。该宏获取样条长度，并将其除以 **实例间距** 以查找沿样条将创建的实例数量。**向下取整**\
  \ 节点用于将除法结果向下取整：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_651_2.png)\n\n图 19.22\
  \ – CalculateNumberOfInstances 宏的节点\n\n### 注意\n\n如果除法的分母为零，将生成除以零的运行时错误。蓝图中有一个名为\
  \ Safe Divide 的节点，如果分母为零，它将返回零，但不会生成错误。\n\n- 11. 单击构建脚本选项卡。下一个截图显示了要添加到构建脚本的第一部分节点。我们获取存储在静态网格变量中的静态网格，并将其设置为实例化静态网格组件将使用的静态网格。For\
  \ Loop 将根据实例数量重复。我们通过将 For Loop 的当前索引乘以实例间距来计算沿样条的距离：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_652_0.png)\n\
  \n图 19.23 – 构建脚本的第一部分\n\n- 12. 以下截图显示了要添加到构建脚本的第二部分节点。Add Instance 节点将使用从样条接收到的位置和旋转在关卡中添加静态网格实例。请注意，坐标空间必须为本地，并且需要右键单击\
  \ Instance Transform 参数并选择 Split Struct Pin：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_653_0.png)\n\
  \n图 19.24 – 构建脚本的第二部分\n\n- 13. 编译蓝图并关闭蓝图编辑器。从内容浏览器中拖动 **BP_SplinePlacement** 并将其放置在关卡中。\n\
  - 14. 样条在关卡编辑器中由白色点表示的样条点组成。您可以选择一个样条点对其进行平移和旋转。要添加样条点，请右键单击样条并选择 **在此处添加样条点**：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_653_1.png)\n\n图 19.25 – 添加样条点\n\n- 15.\
  \ 您可以通过添加、平移和旋转样条点来创建路径。静态网格实例将沿样条添加：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_654_0.png)\n\
  \n图 19.26 – 静态网格实例沿样条排列\n\n关卡设计师将能够灵活地围绕关卡内容定义样条路径。\n\n样条还可用于变形静态网格，如下一节所示。\n\n\
  ### 样条网格组件\n\n还有一个名为 **样条网格** 的组件使用样条。此组件用于沿双点样条变形静态网格。我们可以在关卡编辑器中编辑样条点，或使用蓝图函数设置它们。\n\
  \n**设置起点和终点** 函数可用于构建脚本中以定义样条网格：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_655_0.png)\n\
  \n图 19.27 – 用于定义样条网格的函数\n\n下一张截图显示了由样条线变形的静态网格示例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_656_0.png)\n\
  \n图 19.28 – 由样条线变形的静态网格\n\n我们可以修改上一节的示例，添加 Spline Mesh 组件而不是静态网格实例，以在关卡中创建弯曲管道。不幸的是，计算样条线实例的切线将需要超出本书范围的数学概念。\n\
  \n在下一节中，我们将学习扩展虚幻编辑器的一些方法。\n\n## 编辑器实用蓝图\n\n**编辑器实用蓝图**是一种仅在虚幻编辑器中执行的蓝图类型。你可以使用它们来操作内容浏览器中的资源和关卡中的行动者。\n\
  \n还有 **编辑器实用小部件**，这是一种 UMG 小部件，我们可以使用它为虚幻编辑器创建具有新功能的面板。\n\n我们可以通过在资源创建菜单中访问 **编辑器实用工具**\
  \ 子菜单来创建 **编辑器实用蓝图** 和 **编辑器实用小部件**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_657_0.png)\n\
  \n图 19.29 – 创建编辑器实用蓝图的菜单选项\n\n右键单击编辑器实用蓝图的事件图，并查看 **编辑器脚本** 类别，以了解可用于编写编辑器脚本的功能：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_658_0.png)\n\n图 19.30 – 编辑器脚本类别及其子类别\n\
  \n在编辑器实用蓝图中创建的函数将在 **脚本操作** 子菜单中出现，当你右键单击关卡中的资源或行动者时。要创建将操作内容浏览器中资源的函数，需要选择 **资源操作实用工具**\
  \ 作为父类。要操作关卡中的行动者，请使用 **行动者操作实用工具** 作为父类。\n\n## 创建行动者操作实用工具\n\n我们将创建一个名为 `BPU_ActorAction`\
  \ 的编辑器实用蓝图，并使用 **行动者操作实用工具** 作为父类。这个蓝图将有一个名为 `AlignOnXAxis` 的函数，它将获取所选第一个行动者的位置\
  \ X，并将相同的值设置到其他所选行动者中。\n\n创建蓝图的步骤如下：\n\n- 1. 在内容浏览器中单击 **添加** 按钮，将鼠标悬停在 **编辑器实用工具**\
  \ 上方，并选择 **编辑器实用蓝图** 选项：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_659_0.png)\n\
  \n图 19.31 – 创建编辑器实用蓝图\n\n图 19.32 – 选择父类\n\n- 3. 将蓝图命名为 `BPU_ActorAction` 并双击它以打开蓝图编辑器。\n\
  \n- 4. 在 **我的蓝图** 面板中，创建一个名为 `AlignOnXAxis` 的函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_660_0.png)\n\
  \n图 19.33 – 创建将在编辑器中调用的函数\n\n- 5. 在 **我的蓝图** 面板的 **局部变量** 类别中，创建一个名为 `LocationX`\
  \ 的 **浮点数** 类型局部变量。此变量将存储所选第一个行动者的 **位置 X**，以便设置到其他所选行动者中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_660_1.png)\n\
  \n图 19.34 – 创建局部变量\n\n- 6. 添加以下截图中显示的节点，该截图显示了 **沿 X 轴对齐** 函数的第一部分。**获取选择集** 节点返回关卡编辑器中所选行动者的数组。我们获取数组中的第一个行动者（索引\
  \ 0）并存储其 **位置 X**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_660_2.png)\n\n图 19.35\
  \ – 沿 X 轴对齐函数的第一部分\n\n- 7. 添加沿 X 轴对齐函数第二部分的节点。For Each 循环遍历由 获取选择集 返回的数组。对于每个行动者，我们更新位置\
  \ X。我们需要右键单击位置参数并使用拆分结构体引脚来查看 X、Y 和 Z 引脚：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_661_0.png)\n\
  \n图 19.36 – 沿 X 轴对齐函数的第二部分\n\n- 8. 编译蓝图并关闭蓝图编辑器。在关卡中拖放三次 SM_TableRound 资源，该资源位于\
  \ 内容 > StarterContent > 道具 文件夹中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_662_0.png)\n\
  \n图 19.37 – 添加三个 SM_TableRound 实例\n\n- 9. 按住 *Ctrl* 键并单击 **SM_TableRound** 实例将其添加到选择中。在选择三个实例后，右键单击其中一个，将鼠标悬停在\
  \ **脚本行动者操作** 上方，并选择 **沿 X 轴对齐** 函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_663_0.png)\n\
  \n图 19.38 – 在编辑器中运行实用函数\n\n- 10. 函数执行后，所有所选实例将具有相同的位置 X：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_664_0.png)\n\
  \n图 19.39 – 所有具有相同位置 X 的实例\n\n通过使用编辑器实用蓝图和编辑器实用小部件，我们可以用新功能扩展虚幻编辑器，这些功能可以加速具有特定特性的项目开发。\n\
  \n## 摘要\n\n本章展示了如何使用构造脚本进行过程生成。我们创建了一个蓝图，用于在关卡中添加静态网格实例行。静态网格、行数以及每行的实例数量都可以在关卡中更改。\n\
  \n我们还学习了如何创建蓝图样条线以沿路径生成实例，并了解到有一个样条网格组件可用于变形静态网格。\n\n我们还研究了编辑器实用蓝图，它用于创建在编辑器中运行并可在编辑模式下操作资源和行动者的函数。我们创建了一个具有对齐所选行动者功能的编辑器实用蓝图。\n\
  \n下一章将解释什么是产品配置器。我们将学习如何使用变体管理器面板和关卡变体集来定义产品配置器。\n\n## 测验\n\n- 1. 编写过程生成脚本的最佳位置是\
  \ **事件开始**。\n- a. 正确\n- b. 错误\n\n- 2. 我们只能在蓝图编辑器的视口中编辑样条线。\n- a. 正确\n- b. 错误\n\n\
  - 3. 我们可以使用 **样条网格** 组件来变形静态网格。\n- a. 正确\n- b. 错误\n\n- 4. 编辑器实用蓝图的函数只能操作内容浏览器中的资源。\n\
  - a. 正确\n- b. 错误\n\n- 5. 我们可以使用编辑器实用小部件为虚幻编辑器创建面板。\n- a. 正确\n- b. 错误\n"
- "## 第 20 章：使用变体管理器创建产品配置器\n\n本章解释了如何创建产品配置器，这是一种工业中用于吸引消费者关注特定产品的应用程序类型。你将学习如何使用变体管理器面板和变体集来定义产品配置器。产品配置器模板是研究各种蓝图概念的绝佳资源。我们将分析\
  \ BP_Configurator 蓝图，该蓝图使用带有变体集的 UMG 小部件蓝图动态创建用户界面。\n\n本章涵盖的主题包括：\n\n- 产品配置器模板\n\
  - 变体管理器面板和变体集\n- BP_Configurator 蓝图\n- UMG 小部件蓝图\n\n本章结束时，你将知道如何使用产品配置器模板、变体管理器面板和变体集来创建产品配置器。你将了解\
  \ BP_Configurator 蓝图和 UMG 小部件蓝图的工作原理，以便能够将它们调整为适合你的应用程序。\n\n### 产品配置器模板\n\n产品配置器应用程序背后的主要思想是让用户在不同产品选项之间切换并实时可视化它们-\n\
  \n\n\n实时3D体验。这类应用在行业中越来越常见。\n\n虚幻引擈拥有一个产品配置器模板，可用作制作您自己产品配置器的起点。请按照以下步骤使用产品配置器模板：\n\
  \n- 1. 在新建项目面板中，选择 AUTOMOTIVE PRODUCT DESIGN & MANUFACTURING 类别，然后选择产品配置器模板：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_668_0.png)\n\n图 20.1 – 选择产品配置器模板\n\n- 2.\
  \ 为项目选择文件夹和名称，然后单击 **Create** 按钮。\n\n- 3. 虚幻编辑器加载项目后，单击 **Play** 按钮运行模板。下一张截图显示了随产品配置器模板附带的吉他示例的主界面：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_669_0.png)\n\n图 20.2 – 产品配置器模板的吉他示例\n\
  \n- 4. 右侧的两个按钮允许您更改相机和环境照明。单击按钮时，会显示其他按钮以选择组的当前选项。单击相机按钮并选择另一个相机：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_669_1.png)\n\
  \n图 20.3 – 选择另一个相机\n\n- 5. 底部的按钮允许您更改吉他的各个部分。尝试每个按钮，以查看产品配置器的潜力：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_670_0.png)\n\
  \n图 20.4 – 选择车身颜色\n\n现在我们已经了解了如何使用产品配置器模板，可以分析产品配置器中使用的工具了。\n\n### 变体管理器面板和变体集\n\
  \n产品配置器背后的主要工具是 **变体管理器**。我们使用变体管理器面板来编辑 **Level Variant Sets** 资产，这允许我们修改关卡中 Actor\
  \ 的属性。产品每个部件的每种配置都是一个 **变体**，我们可以将变体分组为 **变体集**。\n\n在产品配置器模板中，启动应用程序时出现在屏幕上的每个按钮都代表一个变体集。单击这些变体集按钮之一时，会显示其他按钮，这些按钮代表属于当前变体集的\
  \ **变体**。\n\n以下是使用变体管理器面板的步骤：\n\n- 1. 双击位于 `Content > ProductAssets` 文件夹中的 `VariantSet`\
  \ 资产，以打开变体管理器面板：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_671_0.png)\n\n图 20.5\
  \ – 模板的关卡变体集\n\n- 2. 变体集和变体在左侧列出。在下一张截图中，我们可以看到 **Body Shape** 是一个带有三个变体的变体集：**Strat\
  \ Type**、**I Type** 和 **V Type**。单击 **I Type** 以查看其属性：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_672_0.png)\n\
  \n图 20.6 – 变体管理器面板\n\n- 3. 对于每个变体，我们可以添加关卡中将由变体修改的 Actor。在上一张截图中，**Body** 是一个 `StaticMeshActor`，其静态网格由变体修改。\n\
  \n- 4. 使用 **+Variant Set** 按钮添加变体集，并使用变体集名称右侧的 + 按钮添加变体集中的变体。\n\n- 5. 双击变体以激活它。更改会立即应用到关卡中。\n\
  \n- 6. 表示吉他部件的静态网格 Actor 在关卡中由名为 **GuitarRoot** 的 Actor 分组，因此您可以将它们一起移动。以下截图来自关卡编辑器中的\
  \ **大纲视图** 面板：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_673_0.png)\n\n图 20.7\
  \ – 吉他的静态网格 Actor\n\n为了能够在运行时更改变体，`VariantSet` 资产被放置到关卡中以创建 `Level Variant Sets\
  \ Actor`。\n\n产品配置器模板非常灵活。您只需学习使用变体管理器面板并导入您的静态网格，即可创建自己的产品配置器。\n\n在下一节中，我们将分析 `BP_Configurator`\
  \ 蓝图。您不需要知道它的工作原理即可使用产品配置器，但这是观察高级蓝图技术实际应用的绝佳机会。\n\n### BP_Configurator 蓝图\n\n产品配置器模板有一个名为\
  \ `BP_Configurator` 的蓝图，它使用关卡变体集的数据通过 UMG 部件蓝图创建界面。这是一个非常值得研究的蓝图，因为我们将看到多个蓝图概念一起使用。\n\
  \n关卡中有一个 `BP_Configurator` 实例，您可以在 **大纲视图** 面板中选择它。在 **详细信息** 面板中，在 **默认** 类别下，有两个可编辑实例的变量。`LVSActor`\
  \ 变量是对 **关卡变体集 Actor** 的引用，而 `Camera Actor` 是用于可视化产品的相机的引用：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_674_0.png)\n\
  \n图 20.8 – BP_Configurator 可编辑实例变量\n\n在打开 BP_Configurator 蓝图之前，让我们先看看位于 `Content\
  \ > ProductConfig > Blueprints` 文件夹中的 **STRUCT_VarSet**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_674_1.png)\n\
  \n图 20.9 – STRUCT_VarSet 变量\n\n该结构体有两个变量。**VariantSet** 是对 **变体集** 的引用，而 **currentIndex**\
  \ 是一个整数变量，用于存储所选变体在变体集中的索引。\n\n打开位于 `Content > ProductConfig > Blueprints` 文件夹中的\
  \ `BP_Configurator` 蓝图。让我们先从查看 **我的蓝图** 面板中的变量开始：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_675_0.png)\n\
  \n图 20.10 – BP_Configurator 变量\n\n每个变量的作用如下：\n\n- **ObjectVariantSets**：存储产品所有变体集的\
  \ **STRUCT_VarSet** 数组\n- **EnviroVarSet**：**STRUCT_VarSet** 类型的变量，用于存储环境照明的变体集\n\
  - **CameraVarSet**：**STRUCT_VarSet** 类型的变量，用于存储相机变体集\n- **LVSActor**：对 **关卡变体集 Actor**\
  \ 的引用\n- **CameraActor**：对用于可视化产品的相机的引用\n- **GUI**：对主 UMG 部件蓝图的引用。请注意，**UI 选项**\
  \ 类别中有几个变量可用于修改产品配置器的外观。这些变量可编辑实例，因此您可以修改关卡中所在实例的这些变量。\n\n现在，让我们看看函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_676_0.png)\n\
  \n图 20.11 – BP_Configurator 函数\n\n每个函数的作用如下：\n\n- **initConfigVarSets**：它获取关卡变体集\
  \ Actor 的变体集，并将它们存储在 `ObjectVariantSets` 数组、`EnviroVarSet` 变量和 `CameraVarSet` 变量中。\n\
  - **resetAllVariants**：为 `EnviroVarSet`、`CameraVarSet` 和 `ObjectVariantSets` 数组的每个元素调用\
  \ **resetVariant** 函数。\n- **resetVariant**：通过激活变体集中的第一个元素来重置变体集。\n- **callVariantActorAction**：为当前变体使用的所有实现\
  \ `BPI_RuntimeAction` 接口的 Actor 和组件调用 `Variant Switched On` 函数。这样，当变体激活时，Actor 就可以运行脚本。\n\
  - **callVariantActorInit**：为当前变体使用的所有实现 BPI_RuntimeAction 接口的 Actor 和组件调用变体初始化函数。\n\
  - **activateVariant**：激活给定变体集中的一个变体。\n- **initCamera**：初始化相机。\n\n**Event BeginPlay**\
  \ 具有一个带有三个输出的 **Sequence** 节点。第一个输出线连接到将 **BP_Configurator** 引用存储在 **BP_ConfigGameMode**\
  \ 中的节点，以便其他蓝图可以通过访问游戏模式来获取 **BP_Configurator** 引用：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_677_0.png)\n\
  \n图 20.12 – 将 BP_Configurator 引用存储在游戏模式中\n\n第二个输出线连接到初始化函数，这些函数存储变体集、初始化相机，并将所有变体集重置为第一个（默认）变体：\n\
  \n\n\n### 图 20.13 – 初始化函数\n\nOn the second output wire, there are also nodes that\
  \ create an instance of the WBP Main GUI widget and store the reference in the GUI\
  \ variable. The widget is added to the Viewport, and the input mode is set to Game\
  \ and UI:\n\n在第二个输出线上，还有节点用于创建 WBP Main GUI 小部件的实例，并将引用存储在 GUI 变量中。该小部件会添加到 Viewport，并且输入模式设置为\
  \ Game and UI：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_678_0.png)\n\n### 图 20.14\
  \ – 配置用户界面\n\nThe third output wire connects to nodes that perform the GUI event\
  \ bindings. This is where the magic happens. We will see in the next section that\
  \ the WBP Main GUI Widget Blueprint has an event dispatcher named Variant Selected.\
  \ The nodes on the next screenshot bind a Custom Event named GUIVariantSelected\
  \ to the Variant Selected event dispatcher:\n\n第三个输出线连接到执行 GUI 事件绑定的节点。这就是奇迹发生的地方。我们将在下一节中看到，WBP\
  \ Main GUI Widget Blueprint 具有一个名为 Variant Selected 的事件分派器。下一张截图中的节点将名为 GUIVariantSelected\
  \ 的自定义事件绑定到 Variant Selected 事件分派器：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_679_0.png)\n\
  \n图 20.15 – GUI 事件绑定\n\nWhen the user clicks on a button to activate a Variant,\
  \ **WBP Main GUI** calls the **Variant Selected** event dispatcher. The **GUIVariantSelected**\
  \ Custom Event will execute because it is bound to the **Variant Selected** event\
  \ dispatcher.\n\n当用户单击按钮以激活 Variant 时，**WBP Main GUI** 会调用 **Variant Selected**\
  \ 事件分派器。**GUIVariantSelected** 自定义事件将会执行，因为它已绑定到 **Variant Selected** 事件分派器。\n\n\
  For more information about event dispatchers and bindings, see *Chapter 4, Understanding\
  \ Blueprint Communication*.\n\n有关事件分派器和绑定的更多信息，请参见 *第 4 章，了解蓝图通信*。\n\nThe **GUIVariantSelected**\
  \ Custom Event calls the **Activate Variant** function, using the selected **Variant\
  \ Set** and **Variant Index** parameters. The **Switch On** function of the Variant\
  \ is used to activate the Variant:\n\n**GUIVariantSelected** 自定义事件调用 **Activate\
  \ Variant** 函数，使用选定的 **Variant Set** 和 **Variant Index** 参数。Variant 的 **Switch On**\
  \ 函数用于激活 Variant：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_680_0.png)\n\n图 20.16\
  \ – Activate Variant 函数\n\nThe dynamic interface is created by some UMG Widget Blueprints\
  \ that work together and use the variables from **BP_Configurator**.\n\n动态界面由一些协同工作的\
  \ UMG 小部件蓝图创建，并使用来自 **BP_Configurator** 的变量。\n\n### UMG 小部件蓝图\n\nThere are five\
  \ UMG Widget Blueprints used in the Product Configurator interface. For more information\
  \ about UMG, see <u>Chapter 7, Creating Screen UI Elements</u>.\n\n产品配置器界面中使用了五个\
  \ UMG 小部件蓝图。有关 UMG 的更多信息，请参见 <u>第 7 章，创建屏幕 UI 元素</u>。\n\nThese are the UMG Widget\
  \ Blueprints:\n\n以下是这些 UMG 小部件蓝图：\n\n- **WBP_MainGUI**: The main Widget Blueprint\
  \ that contains the other widgets.\n- **WBP_MainSelector**: This is the Widget responsible\
  \ for reading the Level Variant Sets and creating the corresponding buttons.\n-\
  \ **WBP_VariantRibbonSelector**: This Widget is used to show the Variant options\
  \ of the selected Variant Set.\n- **WBP_PopupSelector**: This Widget is similar\
  \ to **WBP_VariantRibbonSelector**, but it is used for camera and environment lighting.\n\
  - **WBP_Button**: This Widget represents the button used to select a Variant or\
  \ a Variant Set.\n\n- **WBP_MainGUI**: 包含其他小部件的主 Widget Blueprint。\n- **WBP_MainSelector**:\
  \ 此 Widget 负责读取 Level Variant Sets 并创建相应的按钮。\n- **WBP_VariantRibbonSelector**: 此\
  \ Widget 用于显示所选 Variant Set 的 Variant 选项。\n- **WBP_PopupSelector**: 此 Widget 与 **WBP_VariantRibbonSelector**\
  \ 类似，但用于相机和环境光照。\n- **WBP_Button**: 此 Widget 表示用于选择 Variant 或 Variant Set 的按钮。\n\
  \nThe next screenshot shows the relationship between some of the Widgets:\n\n下一张截图显示了一些\
  \ Widget 之间的关系：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_681_0.png)\n\n图 20.17\
  \ – Widget 之间的关系\n\nThe Widget Blueprints are located in the `Content > ProductConfig\
  \ > UMG` folder. Let's start by looking at **WBP_MainGUI**. The following screenshot\
  \ is from its **Hierarchy** panel:\n\nWidget Blueprint 位于 `Content > ProductConfig\
  \ > UMG` 文件夹中。让我们先查看 **WBP_MainGUI**。以下截图来自其 **Hierarchy** 面板：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_681_1.png)\n\
  \n图 20.18 – WBP_MainGUI Hierarchy 面板\n\n**WBP_MainGUI** uses two **WBP_Button**\
  \ Widgets and two **WBP_PopupSelector** Widgets to manage the camera and environment\
  \ lighting options. **MainPartVarSelector** is a **WBP_MainSelector** Widget that\
  \ manages the Variants of the product.\n\n**WBP_MainGUI** 使用两个 **WBP_Button** 小部件和两个\
  \ **WBP_PopupSelector** 小部件来管理相机和环境光照选项。**MainPartVarSelector** 是一个管理产品 Variants\
  \ 的 **WBP_MainSelector** 小部件。\n\nThe buttons of the Variant Sets and each Variant\
  \ are created in **Event Construct** of the **WBP_MainSelector** Widget. The **Populate\
  \ Options** function creates the buttons using the thumbnails from the Level Variant\
  \ Sets:\n\nVariant Set 和每个 Variant 的按钮在 **WBP_MainSelector** 小部件的 **Event Construct**\
  \ 中创建。**Populate Options** 函数使用 Level Variant Sets 的缩略图创建按钮：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_682_0.png)\n\
  \n图 20.19 – WBP_MainSelector 的 Event Construct\n\nAll five Widget Blueprints have\
  \ event dispatchers. The first event dispatcher is triggered when the user clicks\
  \ on **WBP_Button**:\n\n所有五个 Widget Blueprint 都有事件分派器。当用户单击 **WBP_Button** 时，将触发第一个事件分派器：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_682_1.png)\n\n图 20.20 – WBP_Button 的\
  \ On Clicked 事件\n\n**WBP_VariantRibbonSelector** binds an event to the **Button\
  \ Clicked** event dispatcher of **WBP_Button**. The new event triggers the **Ribbon\
  \ Option Selected** event dispatcher:\n\n**WBP_VariantRibbonSelector** 将一个事件绑定到\
  \ **WBP_Button** 的 **Button Clicked** 事件分派器。新事件将触发 **Ribbon Option Selected** 事件分派器：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_683_0.png)\n\n图 20.21 – WBP_VariantRibbonSelector\
  \ 将事件绑定到 Button Clicked\n\n**WBP_MainSelector** has the **PartSelectedEvent** Custom\
  \ Event to trigger the **Part Selected** event dispatcher:\n\n**WBP_MainSelector**\
  \ 具有 **PartSelectedEvent** 自定义事件，用于触发 **Part Selected** 事件分派器：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_683_1.png)\n\
  \n图 20.22 – WBP_VariantRibbonSelector 将事件绑定到 Button Clicked\n\nThe binding of **PartSelectedEvent**\
  \ to the **Ribbon Option Selected** event dispatcher is done in the **Create Event\
  \ Bindings** function using the **Create Event node:**\n\n将 **PartSelectedEvent**\
  \ 绑定到 **Ribbon Option Selected** 事件分派器的操作在 **Create Event Bindings** 函数中使用 **Create\
  \ Event 节点** 完成：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_684_0.png)\n\n图 20.23\
  \ – 使用 Create Event 节点绑定事件\n\nTo use the **Create Event** node, drag a wire from\
  \ the **Event** input pin of a **Bind Event** node and select **Create Event**:\n\
  \n要使用 **Create Event** 节点，请从 **Bind Event** 节点的 **Event** 输入引脚拖出一根线，并选择 **Create\
  \ Event**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_684_1.png)\n\n图 20.24 – 使用\
  \ Create Event 节点绑定事件\n\nIn the **Create Event** node, you will be able to select\
  \ an event that has the same type of input parameters as the event dispatcher.\n\
  \n在 **Create Event** 节点中，您可以选择一个与事件分派器具有相同输入参数类型的事件。\n\nThe last event dispatcher\
  \ is from **WBP_MainGUI**, which binds a Custom Event to the **Part Selected** event\
  \ dispatcher of **WBP_MainSelector**:\n\n最后一个事件分派器来自 **WBP_MainGUI**，它将一个自定义事件绑定到\
  \ **WBP_MainSelector** 的 **Part Selected** 事件分派器：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_685_0.png)\n\
  \n图 20.25 – WBP_MainGUI 将事件绑定到 Part Selected\n\nThe **Variant Selected** event dispatcher\
  \ is the one that is bound in the **BP_Configurator** Blueprint.\n\n**Variant Selected**\
  \ 事件分派器是在 **BP_Configurator** Blueprint 中绑定的那个。\n\nIn this section, we saw how UMG\
  \ Widget Blueprints can be used together to create a dynamic and configurable interface.\n\
  \n在本节中，我们了解了如何将 UMG 小部件蓝图协同使用，以创建动态且可配置的界面。\n\n### 摘要\n\nIn this chapter, we explained\
  \ what a Product Configurator is, and we showed how to use the Product Configurator\
  \ template. We learned how to use the Variant Manager panel to create Variants and\
  \ Variant Sets.\n\n在本章中，我们解释了什么是产品配置器，并展示了如何使用产品配置器模板。我们学习了如何使用 Variant Manager\
  \ 面板来创建 Variants 和 Variant Sets。\n\nWe also learned how the **BP_Configurator**\
  \ Blueprint stores all the information of the Level Variant Sets Actor needed to\
  \ create a dynamic interface. We had an overview of the **BP_Configurator** functions\
  \ and saw how to activate a Variant in a Blueprint.\n\n我们还了解了 **BP_Configurator**\
  \ Blueprint 如何存储创建动态界面所需的 Level Variant Sets Actor 的所有信息。我们概览了 **BP_Configurator**\
  \ 函数，并了解了如何在 Blueprint 中激活 Variant。\n\nThen, we saw how the **WBP_MainGUI** Widget\
  \ uses the other UMG Widget Blueprints to create a user interface and saw how several\
  \ event dispatchers were used to make the **BP_Configurator** act when a button\
  \ was clicked.\n\n接着，我们了解了 **WBP_MainGUI** 小部件如何使用其他 UMG 小部件蓝图来创建用户界面，以及如何使用多个事件分派器，使\
  \ **BP_Configurator** 在单击按钮时做出反应。\n\n# 尾声\n\nI can't believe we have reached the\
