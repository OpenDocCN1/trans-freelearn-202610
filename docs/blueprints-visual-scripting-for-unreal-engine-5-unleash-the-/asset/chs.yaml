  \ 或 **是否不为空** 节点用于检查数组是否有元素：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_443_0.png)\n\
  \n图 13.8 – 获取随机数组元素和检查数组是否有元素的节点\n\n**创建数组** 节点用于从事件图中的变量创建数组。单击 **添加引脚 +** 以添加输入引脚。截图中的示例来自关卡\
  \ Blueprint。关卡中有四个 **点光灯** 实例，**创建数组** 节点用于创建 **点光灯数组**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_443_1.png)\n\
  \n图 13.9 – 使用创建数组节点\n\n让我们创建一个示例来检查存储对象引用的数组的用法。\n\n### 数组示例 – 创建 BP_RandomSpawner\n\
  \n在此示例中，我们将创建名为 `BP_RandomSpawner` 的 Blueprint，它将具有一个 **目标点** 数组。目标点数组的元素可以在关卡编辑器中设置。当关卡开始时，`BP_RandomSpawner`\
  \ Blueprint 将随机选择目标点的一个元素，并在所选目标点的同一位置生成指定 `角色` 类的实例。\n\n创建此示例的步骤如下：\n\n- 1. 基于带有入门内容的\
  \ *第三人称* 模板创建项目。\n- 2. 在内容浏览器中，访问 *内容* 文件夹。在文件夹列表旁边的空白处右键单击并选择 **新建文件夹** 选项。将文件夹命名为\
  \ *BookUE5*。我们将使用此文件夹存储本章的资产。\n- 3. 打开刚刚创建的 *BookUE5* 文件夹，然后单击内容浏览器中的 **添加** 按钮，并选择\
  \ **蓝图类** 选项。\n- 4. 在下一屏幕上，选择 **角色** 作为父类。将 Blueprint 命名为 *BP_RandomSpawner* 并双击它以打开\
  \ *蓝图编辑器*。\n- 5. 在 **我的蓝图** 面板中，创建一个名为 *TargetPoints* 的新变量。在 **详情** 面板中，单击 **变量类型**\
  \ 下拉菜单并搜索 *target point*。将鼠标悬停在 **目标点** 上以显示子菜单，然后选择 **对象引用**。单击 **变量类型** 右侧的图标并选择\
  \ **数组** 图标。检查 **实例可编辑** 属性，如以下截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_445_0.png)\n\
  \n图 13.10 – 创建目标点数组\n\n- 6. 创建另一个变量并将其命名为 `SpawnClass`。单击 **变量类型** 下拉菜单并搜索 `actor`。将鼠标悬停在\
  \ **角色** 上以显示子菜单，然后选择 **类引用**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_445_1.png)\n\
  \n图 13.11 – 创建引用角色类的变量\n\n- 7. 单击 **变量类型** 右侧的图标并选择单个变量图标。检查 **实例可编辑** 属性。我们将在生成角色时使用\
  \ **SpawnClass** 变量中指定的类：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_446_0.png)\n\
  \n图 13.12 – SpawnClass 可在关卡实例中指定\n\n在 **开始游戏事件** 中，我们将使用 **分支** 节点来验证 **生成类** 和\
  \ **目标点** 变量。任何存储引用的变量都应在使用前验证，以避免运行时错误。如果变量有效，那么我们将使用 **生成类** 变量中存储的类以及数组中随机选择的目标点的变换来生成角色：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_446_1.png)\n\n图 13.13 – 开始游戏事件操作\n\n\
  - 8. *步骤 8–13* 中的节点用于验证 **生成类** 和 **目标点** 变量。将 **生成类** 变量从 **我的蓝图** 面板拖出，放置在事件图中靠近\
  \ **开始游戏事件** 的位置，然后选择 **获取生成类**。\n- 9. 从 **生成类** 节点拖出一条线并添加一个 **是否为有效类** 节点。\n-\
  \ 10. 从 **是否为有效类** 的 **返回值** 引脚拖出一条线并添加一个 **与** 节点。我们使用 **与** 节点是因为只有当两个变量都有效时才会生成角色。\n\
  \n\n\n\n- 11. 将 **目标点数组** 变量从 **我的蓝图** 面板拖入 **事件图** 中靠近 **生成类** 节点的位置，并选择 **获取目标点**。\n\
  \n- 12. 从 **目标点** 节点拖出一根线并添加一个 **非空** 节点。将 **非空** 节点的输出引脚连接到 **与** 节点的底部输入引脚。我们需要检查数组是否包含元素。\n\
  \n- 13. 从 **与** 节点的输出引脚拖出一根线并添加一个 **分支** 节点。将 **开始游戏时** 的白色引脚连接到 **分支** 节点的白色输入引脚。\n\
  \n- 14. *步骤 14–18* 中的节点用于使用 **生成类** 中存储的类生成演员。从 **分支** 节点的 **真** 输出引脚拖出一根线，然后从 **类**\
  \ 节点添加一个 **生成角色** 节点。\n\n- 15. 从 **生成角色** 节点的 **类** 输入引脚拖出一根线并添加一个 **获取生成类** 节点。\n\
  \n- 16. 从 **目标点** 节点拖出一根线并添加一个 **随机数组项** 节点。\n\n- 17. 从 **随机数组项** 节点的顶部输出引脚拖出一根线并添加一个\
  \ **获取角色变换** 节点。\n\n- 18. 将 **获取角色变换** 的 **返回值** 引脚连接到 **生成角色** 节点的 **生成变换** 输入引脚。\n\
  \n- 19. 编译并保存蓝图。\n\n现在，我们需要准备关卡以便能够测试 **BP_随机生成器**。\n\n### 测试 **BP_随机生成器**\n\n我们将在关卡中添加一些\
  \ **目标点** 实例。**BP_随机生成器** 实例将使用其中一个目标点的变换：\n\n- 1. 在关卡编辑器中，我们将使用 **放置角色面板** 轻松找到\
  \ **目标点** 类。单击工具栏上的 **创建** 按钮打开子菜单，然后单击 **放置角色面板**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_448_0.png)\n\
  \nFigure 13.14 – 访问 **放置角色面板**\n\n- 2. 在 **放置角色** 面板中搜索 `target`，如下图所示。拖动 **目标点**\
  \ 并将实例放置在关卡的不同位置：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_449_0.png)\n\nFigure\
  \ 13.15 – 查找 **目标点** 类\n\n- 3. 从内容浏览器拖动 **BP_随机生成器** 并将其放置在关卡上。**目标点** 和 **生成类**\
  \ 变量出现在实例的详细信息面板中，因为我们勾选了 **可编辑实例** 属性。单击 + 图标向数组添加元素。展开每个元素的下拉菜单，并选择关卡中其中一个 **目标点**\
  \ 实例。在 **生成类** 中，选择 **蓝图_效果_烟雾**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_449_1.png)\n\
  \nFigure 13.16 – 设置 **BP_随机生成器** 实例的变量\n\n- 4. 单击关卡编辑器的 **播放** 按钮。**BP_随机生成器** 将在其中一个\
  \ **目标点** 实例处生成一个 **蓝图_效果_烟雾** 实例。退出并再次运行，即可看到 **蓝图_效果_烟雾** 在不同位置生成：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_450_0.png)\n\
  \nFigure 13.17 – 在关卡中生成的 **蓝图_效果_烟雾** 实例\n\n数组在游戏开发中被广泛使用。现在，让我们看看其他类型的容器。\n\n###\
  \ 集合\n\n集合是另一种容器类型。它是一组唯一元素的无序列表。查找集合中的元素是基于元素本身的值。没有索引。集合中的元素必须是相同类型，且不允许重复元素。\n\
  \n按照以下步骤创建集合：\n\n- 1. 在 **我的蓝图** 面板中，创建一个变量并定义其类型。\n\n- 2. 单击 **变量类型** 下拉菜单旁边的图标并选择集合图标，如本截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_451_0.png)\n\nFigure 13.18 – 创建字符串集合\n\
  \n- 3. 编译蓝图以便可以向集合添加默认值。在变量的 **默认值** 面板中，单击 + 图标向集合添加元素。\n\n- 4. 以下截图显示一个包含四个元素的字符串集合示例：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_451_1.png)\n\nFigure 13.19 – 向集合添加默认值\n\
  \n下一个截图显示了集合容器的一些节点。以下是每个节点的简要说明：\n\n- - **添加**: 向集合添加一个元素。\n- - **添加项**: 从数组向集合添加元素。数组必须与集合的类型相同。\n\
  - - **包含**: 如果集合包含该元素，则返回 `true`。\n- - **长度**: 返回集合中的元素数量：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_452_0.png)\n\
  \nFigure 13.20 – 集合容器的节点\n\n集合没有 **获取** 元素节点，因此如果您需要遍历集合中的元素，可以将集合中的元素复制到数组中。下一个截图显示了\
  \ **转换为数组** 节点和其他用于移除元素的节点：\n\n- - **转换为数组**: 将集合的元素复制到数组。请注意，复制大型对象的整个数组可能是一项非常昂贵的操作。\n\
  - - **清除**: 移除集合的所有元素。\n- - **移除**: 移除集合的一个元素，如果移除了元素则返回 `true`，如果未找到该元素则返回 `False`。\n\
  - - **移除项**: 从集合中移除数组中指定的元素：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_452_1.png)\n\
  \nFigure 13.21 – 移除项并将集合转换为数组的节点\n\n某些节点执行两个集合之间的操作并返回一个不同的集合。这些节点在下一个截图中显示：\n\n\
  - - **并集**: 生成的集合包含两个集合的所有元素。\n  由于结果是一个集合，所有重复项都将被移除。\n- - **差集**: 生成的集合包含第一个集合中不在第二个集合中的元素。\n\
  - - **交集**: 生成的集合仅包含同时存在于两个集合中的元素：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_453_0.png)\n\
  \nFigure 13.22 – 两个集合的操作\n\n使用 **创建集合** 节点从 **事件图** 中的变量创建集合。单击 **添加引脚 +** 添加输入引脚：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_453_1.png)\n\nFigure 13.23 – 创建集合节点\n\
  \n以下截图显示了集合使用的一个简单示例。有一个名为 **唯一名称** 的集合，用于记录赢得一轮的玩家姓名。在此示例中，我们想知道至少赢过一轮的玩家；我们不需要知道玩家赢了多少轮：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_454_0.png)\n\nFigure 13.24 – 集合容器用法示例\n\
  \n集合容器的使用频率不如数组。现在，让我们来看看蓝图中可用的最后一种容器 – 映射。\n\n### 映射\n\n**映射** 容器使用键值对来定义每个元素。键类型可以与值类型不同。映射是无序的，并且通过键值进行搜索，因此不允许重复的键。但是，允许重复的值。\n\
  \n创建映射的步骤如下：\n\n- 1. 创建一个变量，并在 **变量类型** 中选择将用作键类型的类型。\n\n- 2. 单击 **变量类型** 下拉菜单旁边的图标，并选择映射图标，如下图所示。\n\
  \n- 3. 之后，您需要在弹出的第二个下拉菜单中选择值类型。下图中的示例使用 **字符串** 作为键类型和 **浮点数** 作为值类型：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_455_0.png)\n\
  \nFigure 13.25 – 创建映射容器\n\n- 4. 与蓝图中的任何其他新变量一样，在添加映射的默认值之前，有必要先编译蓝图。在变量的 **默认值**\
  \ 面板中，单击 + 图标向映射添加元素。\n\n- 5. 以下截图显示了一个包含四个元素的映射示例。每个元素都有一个字符串键和一个浮点数值：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_455_1.png)\n\
  \nFigure 13.26 – 向映射添加默认值\n\n以下截图显示了一些映射节点，用于添加元素、移除元素以及移除映射的所有元素：\n\n> - **添加**:\
  \ 向映射添加一个键值对。如果键已存在于映射中，则与该键关联的值将被覆盖。\n\n\n\n\n- **移除**: 从映射中移除一个键值对。如果移除了键值对，则返回\
  \ `True`。如果未找到该键，则该节点返回 `False`。\n- **清除**: 移除映射中的所有元素：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_456_0.png)\n\
  \n图 13.27 – 用于添加和移除元素的映射节点\n\n用于获取映射长度、检查键是否存在以及获取映射中与键关联的值的以下节点：\n\n- **长度**: 返回映射中的元素数量。\n\
  - **包含**: 接收一个键作为输入参数，如果映射包含使用该键的元素，则返回 `True`。\n- **查找**: 查找节点类似于包含节点，但它还返回搜索中使用的键所关联的值：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_456_1.png)\n\n图 13.28 – 用于获取长度和搜索键的映射节点\n\
  \n用于将映射的键和值复制到数组的以下节点：\n\n- **键**: 将映射的所有键复制到一个数组中。\n- **值**: 将映射的所有值复制到一个数组中：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_457_0.png)\n\n图 13.29 – 用于将键和值复制到数组的映射节点\n\
  \n使用 Make Map 节点在事件图中从变量创建映射。单击 添加引脚 + 以添加输入引脚：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_457_1.png)\n\
  \n图 13.30 – Make Map 节点\n\n以下屏幕截图显示了映射的示例用法。价格表是一个映射，它使用产品名称作为键，使用产品的价格作为值。有一个名为\
  \ Calculate Total Price 的函数，它接收产品名称和数量作为输入参数，数量统计正在购买的产品。在价格表映射中搜索产品名称以获取产品的价格。产品的价格乘以数量以找到总价：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_458_0.png)\n\n图 13.31 – 使用映射获取产品的价格\n\
  \n我们介绍了蓝图中可用的容器，即数组、集合和映射，并了解了何时应该使用每种容器。使用容器避免了创建多个单个变量来存储信息的需要。在下一节中，我们将看到其他有助于在游戏或应用程序中组织数据的数据结构。\n\
  \n### 探索其他数据结构\n\n有一些数据结构不是在蓝图类中创建的。它们是可以在蓝图中使用的独立辅助资产。使用这些数据结构资产，您可以将自己的数据类型添加到项目中，并可以学习如何使用帮助您处理项目中大量数据的工具。\n\
  \n让我们学习如何创建和使用枚举、结构体和数据表。\n\n### 枚举\n\n一个 **枚举**，也称为 **枚举**，是一种包含固定命名常量集合的数据类型，可用于定义变量的类型。类型为枚举的变量的值被限制在枚举中定义的常量集合内。\n\
  \n按照以下步骤创建枚举：\n\n1. 在内容浏览器中单击 **添加** 按钮，并在 **蓝图** 子菜单中选择 **枚举**，如下面的屏幕截图所示：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_459_0.png)\n\n图 13.32 – 创建枚举\n\n2. 存在一种命名约定，即枚举名称以大写\
  \ E 开头。为创建的枚举命名为 `EWeaponCategory` 并双击它以编辑其值。\n\n3. 在枚举编辑器中，单击 **新建** 按钮向此枚举添加一个命名常量。添加下面屏幕截图中显示的五个命名常量。您可以为枚举和每个常量添加描述：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_460_0.png)\n\n图 13.33 – 添加枚举的元素\n\n4.\
  \ 要使用枚举数据类型，在蓝图编辑器中创建一个变量，展开 **变量类型** 下拉菜单，并搜索枚举的名称，如下面的屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_460_1.png)\n\
  \n图 13.34 – 使用枚举数据类型\n\n以下屏幕截图显示，使用枚举类型定义的变量被限制在枚举的常量中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_461_0.png)\n\
  \n图 13.35 – 设置枚举变量的值\n\n对于每种枚举类型，都有一个 **基于枚举的开关** 节点，用于根据枚举值更改执行流程，如下面的屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_461_1.png)\n\n图 13.36 – 在枚举上使用基于枚举的开关节点\n\
  \n这就是我们需要知道的关于枚举的全部内容。我们将要查看的下一个数据资产是结构体。\n\n### 结构体\n\n一个 **结构体**，也称为 **结构**，是一种复合数据类型，可以将不同类型的变量分组为单一类型。结构体的一个元素可以是复杂类型，例如另一个结构体、数组、集合、映射或对象引用。\n\
  \n创建结构体的步骤如下：\n\n1. 在内容浏览器中单击 **添加** 按钮，并在 **蓝图** 子菜单中选择 **结构体**，如下面的屏幕截图所示：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_462_0.png)\n\n图 13.37 – 创建结构体\n\n2. 将创建的结构体重命名为\
  \ *武器类型* 并双击它以定义其变量。\n\n3. 在 **结构体** 编辑器中，单击 **新建变量** 按钮向结构体添加变量。每个变量可以是不同的类型，您可以单击容器图标将变量转换为容器，例如数组、集合或映射。\n\
  \n4. 添加以下屏幕截图中显示的变量。请注意，**类别** 变量是以前创建的 **EWeaponCategory** 枚举类型：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_463_0.png)\n\
  \n图 13.38 – 武器类型结构体的变量\n\n5. 要使用 **结构体** 数据类型，在蓝图编辑器中创建一个变量，单击 **变量类型** 下拉菜单，并搜索结构体的名称，如下面的屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_463_1.png)\n\n图 13.39 – 使用结构体数据类型\n\n\
  6. 编译蓝图以便您可以编辑 **默认值**。以下屏幕截图显示了填充了武器示例值的结构体：\n\n| 属性 | 值 |\n| :--- | :--- |\n|\
  \ 名称 | AK-47 |\n| 类别 | 突击步枪 |\n| 伤害 | 50 |\n| 射速 | 0.6 |\n| 射程 | 0.5 |\n| 精度 | 0.8\
  \ |\n\n图 13.40 – 向结构体类型变量添加默认值\n\n### 注意\n\n前面屏幕截图中的浮点变量使用表示百分比的相对值——例如，0.5 表示 50%，1.0\
  \ 表示 100%。\n\n对于每种结构体类型，都有 **制作** 和 **解析** 节点可在蓝图中使用。**制作** 节点接收单独的元素作为输入并创建一个结构体。**解析**\
  \ 节点接收一个结构体作为输入并分离其元素。下一个屏幕截图显示了 **武器类型** 结构体的 **制作** 和 **解析** 节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_465_0.png)\n\
  \n图 13.41 – 制作结构体并获取其元素的节点\n\n结构体在蓝图中非常有用，可用于将多个变量组合成一种新类型。我们将要查看的最后一个数据结构是数据表。\n\
  \n### 数据表\n\n一个 **数据表** 是基于结构体的值表。它可以用于表示电子表格文档。这对于数据驱动的游戏玩法很有用，在这种玩法中，游戏数据需要不断修改和平衡。在这些情况下，数据可以在电子表格编辑器中修改，然后导入到游戏中。\n\
  \n按照以下步骤创建数据表：\n\n1. 在内容浏览器中单击 **添加** 按钮，并在 **杂项** 子菜单中选择 **数据表**，如下面的屏幕截图所示：\n\n\
  \n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_466_0.png)\n\n图 13.42 – 创建数据表\n\n-\
  \ 2. 选择 **数据表** 后，虚幻编辑器会要求您选择一个表示表格数据类型的结构。选择 **武器类型** 结构：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_466_1.png)\n\
  \n图 13.43 – 选择数据表使用的结构\n\n- 3. 将创建的数据表重命名为 `WeaponTable`，双击它以打开数据表编辑器。\n\n- 4. 单击\
  \ **添加** 按钮向表格中添加一行。每一行都有一个用于标识该行的行名，且行名必须唯一。要更改行名，需要右键单击一行并选择 **重命名**。在以下屏幕截图的示例中，行名是一个简单的索引。向数据表添加一些行，如以下屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_467_0.png)\n\n图 13.44 – 编辑数据表\n\n数据表也可以从纯文本\
  \ **逗号分隔值 (CSV)** 文件导入。以下屏幕截图显示了一个 CSV 文件的示例。电子表格编辑器可以将电子表格导出为 CSV 格式：\n\n| | 名称\
  \ | 类别 | 伤害 | 射速 | 射程 | 精度 |\n|---|---|---|---|---|---|---|\n| 1 | Desert Eagle\
  \ | 手枪 | 30 | 0.200000 | 0.300000 | 0.600000 |\n| 2 | M1887 | 霰弹枪 | 60 | 0.300000\
  \ | 0.100000 | 0.500000 |\n| 3 | Uzi | 冲锋枪 | 40 | 0.500000 | 0.400000 | 0.700000\
  \ |\n| 4 | AK-47 | 突击步枪 | 50 | 0.600000 | 0.500000 | 0.800000 |\n| 5 | Dragunov\
  \ SVD | 狙击步枪 | 70 | 0.300000 | 1.000000 | 0.900000 |\n\n图 13.45 – CSV 格式中的 WeaponTable\n\
  \n- 5. 要导入 CSV 文件，请在内容浏览器中单击 **导入** 按钮并选择 CSV 文件。将出现一个对话框，要求您在 **选择数据表行类型** 字段中选择一个结构，如以下屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_468_0.png)\n\n图 13.46 – 从 CSV 文件导入数据表\n\
  \n- 6. 要在蓝图中使用数据表，请在蓝图编辑器中创建一个变量，并选择 **数据表 > 对象引用** 作为 **变量类型**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_469_0.png)\n\
  \n图 13.47 – 创建数据表引用\n\n- 7. 编译蓝图，并在 **默认值** 中选择一个数据表，如以下屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_469_1.png)\n\
  \n图 13.48 – 设置默认数据表\n\n以下屏幕截图显示了一些从数据表获取数据的操作：\n\n- **获取数据表行**：返回包含特定行数据的结构\n- **获取数据表行名称**：将数据表的所有行名称复制到数组中\n\
  - **将数据表列作为字符串**：将列的所有值复制到字符串数组中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_470_0.png)\n\
  \n图 13.49 – 从数据表获取内容\n\n以下屏幕截图显示了如何使用数据表的示例。\n**选择武器** 是一个函数，它接收 **武器 ID** 作为输入参数，并在\
  \ **武器表** 中搜索行名等于 **武器 ID** 的武器。如果找到该武器，则将武器数据复制到 **当前武器** 变量中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_470_1.png)\n\
  \n图 13.50 – 从数据表的一行获取数据\n\n我们了解了一些可以创建的数据结构资产，用于在项目中组织数据。现在，我们将学习更多有助于组织脚本的蓝图节点。\n\
  \n### 流程控制节点\n\n有一些节点用于控制蓝图执行的流程。这些节点根据条件确定执行路径。我们已经见过 **分支** 节点，它是一种常用的流程控制节点。让我们了解其他主要类型的流程控制节点。\n\
  \n### 开关节点\n\n**开关节点** 根据输入变量的值确定执行流程。有不同类型的开关节点。以下屏幕截图显示了 **整数开关** 节点的示例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_471_0.png)\n\
  \n图 13.51 – 整数开关节点示例\n\n**选择** 输入参数接收一个整数值，用于确定将执行的输出引脚。如果输入值没有对应的引脚，则将执行 **默认**\
  \ 引脚。您可以在 **整数开关** 的 **详情** 面板中更改起始索引。输出引脚通过使用 **添加引脚 +** 选项添加。\n\n另一种开关是 **字符串开关**\
  \ 节点，如以下屏幕截图所示。输出值必须在 **字符串开关** 节点的 **详情** 面板的 **引脚选项 | 引脚名称** 下添加：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_472_0.png)\n\
  \n图 13.52 – 字符串开关节点示例\n\n还有 **枚举开关**，它使用枚举的值作为可用的输出引脚。\n\n### 翻转翻转\n\n每次执行 **翻转翻转**\
  \ 节点时，它会在两个输出引脚 **A** 和 **B** 之间切换。有一个名为 **是 A** 的布尔输出参数。如果 **是 A** 参数为 `True`，则表示引脚\
  \ **A** 正在运行。如果为 `False`，则引脚 **B** 正在运行。\n\n注意\n\n**翻转翻转** 节点在函数内部无法正常工作，因为 **翻转翻转**\
  \ 有一个内部变量，该变量在函数结束时会被删除。因此，在函数内部每次都会执行 **A** 引脚。\n\n以下屏幕截图显示了 **翻转翻转** 节点的示例：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_473_0.png)\n\n图 13.53 – 翻转翻转节点示例\n\n如果玩家使用双持手枪，则开火时只有一把手枪射击。下一枪时，另一把手枪射击。**开火左手枪**\
  \ 和 **开火右手枪** 是在此处用于简化示例的自定义宏。\n\n### 序列\n\n当 **序列** 节点被触发时，它会按顺序执行连接到输出引脚的所有操作。因此，它先执行一个引脚的所有操作，再执行下一个引脚的所有操作，依此类推。它很有助于组织操作组。\n\
  \n以下屏幕截图显示了 **序列** 节点的用法。**打印字符串** 函数用于显示执行顺序：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_473_1.png)\n\
  \n图 13.54 – 序列节点示例\n\n**添加引脚 +** 选项添加输出引脚。要删除引脚，请右键单击引脚并选择 **删除执行引脚** 选项。\n\n###\
  \ 逐个遍历循环\n\n**逐个遍历循环** 节点接收一个数组作为输入参数，并为数组中的每个元素执行 **循环体** 输出引脚的操作。当前的 **数组元素**\
  \ 和 **数组索引** 可作为输出引脚使用。当 **逐个遍历循环** 完成执行时，将执行 **完成** 输出引脚。\n\n在以下屏幕截图中，**逐个遍历循环**\
  \ 节点用于遍历包含房间灯具的 **点光源** 引用数组：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_474_0.png)\n\
  \n图 13.55 – 逐个遍历循环节点示例\n\n通过使用 **点光源组件** 的 **设置可见性** 函数打开灯具，该函数位于 **点光源** 数组元素内部。\n\
  \n### 执行一次\n\n**执行一次** 节点只执行一次输出引脚。如果再次触发，则其输出引脚将不再执行。**重置** 输入引脚需要被触发，以允许 **执行一次**\
  \ 节点再次运行输出引脚。\n\n以下屏幕截图显示了其用法示例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_475_0.png)\n\
  \n图 13.56 – 执行一次节点示例\n\n当玩家按下 **空格键** 时，**执行一次** 节点会被触发，并使用一把蓄力武器。之后，会创建一个计时器来执行\
  \ **充满自定义事件**，该事件会在 `30.0` 秒后重置 **执行一次** 节点。如果在 30 秒内玩家再次按下 **空格键**，则 **执行一次** 节点将不执行其输出引脚。\n\
  \n### 执行 N 次\n\n**执行 N 次** 节点允许您指定输出引脚可以执行多少次。在执行次数完成后，输出引脚的操作只有在 **重置** 引脚被触发时才会再次执行。\n\
  \n以下屏幕截图显示了 **执行 N 次** 节点的用法示例：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_476_0.png)\n\
  \n图 13.57 – Do N 节点示例\n\n玩家可以按下 **空格键** 来发射特殊武器。第三次射击后，他们需要按下 *R* 键来重置 **Do N**\
  \ 节点，以便能够再次发射三次。\n\n### 门控\n\n**门控** 节点具有内部状态；它可以打开或关闭。如果它处于打开状态，那么当 **门控** 节点被触发时，输出引脚将执行。如果它处于关闭状态，那么输出引脚将不会执行。\n\
  \n以下是 **门控** 节点的输入引脚：\n\n- **入口**: 接收执行流的执行引脚\n- **打开**: 将 **门控** 状态设置为打开的执行引脚\n\
  - **关闭**: 将 **门控** 状态设置为关闭的执行引脚\n- **切换**: 切换 **门控** 节点状态的执行引脚\n- **起始关闭**: 一个布尔变量，用于确定\
  \ **门控** 节点是否应以关闭状态开始\n\n下一张截图中的示例是一个蓝图，它会对与其重叠的角色施加伤害：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_477_0.png)\n\
  \n图 13.58 – **门控** 节点示例\n\n当角色重叠时，门控节点保持打开状态，并且每帧都会对角色施加伤害。如果角色停止重叠，则门控节点将关闭，伤害将不再施加。\n\
  \n### 多门控\n\n当多门控节点被触发时，将执行其中一个输出引脚。多门控节点可以有多个输出引脚。要添加另一个输出引脚，请使用“添加引脚 +”选项。\n\n\
  以下是多门控节点的输入引脚：\n\n- **重置**: 用于重置多门控节点并允许重新执行输出引脚的执行引脚。\n- **是否随机**: 一个布尔变量。如果值为\
  \ True，则输出引脚的执行顺序是随机的。\n- **循环**: 这是一个布尔变量，指示多门控节点在最后一个输出引脚执行后的行为。如果值为 True，则多门控节点将继续执行输出引脚。如果为\
  \ False，则多门控节点将停止执行输出引脚。\n- **起始索引**: 一个整数值，指示要执行的第一个输出引脚。\n\n以下截图显示了多门控节点的示例：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_478_0.png)\n\n图 13.59 – 多门控节点示例\n\n当按下\
  \ Tab 键时，将使用多门控节点在每次执行时设置不同的静态网格体。已选中“循环”参数，因此多门控将在最后一个输出引脚执行后，从第一个输出引脚继续执行。\n\n\
  以下是蓝图中可用的流程控制节点。了解它们的存在很有好处，因为我们可以找到可以使用其中任何一个轻松解决的问题。\n\n### 摘要\n\n在本章中，我们学习了如何在蓝图中使用数据结构来组织数据。我们学习了如何在数组中存储各种元素以及如何检索其中的任何元素。我们学习了如何使用其他类型的容器（如集合和映射）来存储数据。\n\
  \n随后，我们学习了如何创建和使用枚举、结构体和数据表，并查看了它们之间关联的示例。还向我们介绍了几个流程控制节点，例如 Switch、Gate 和 For Each\
  \ Loop。\n\n本章展示了各种蓝图功能，可帮助我们有效地组织数据。流程控制节点可以简化事件图，因为在每种情况下，可能都有一个更合适的节点。\n\n在下一章中，我们将学习世界坐标和本地坐标、向量运算，以及使用追踪来测试碰撞。\n\
  \n### 测验\n\n- 1. 数组不允许重复元素。\n- a. 正确\n- b. 错误\n\n- 2. 对于每种枚举类型，蓝图中都有一个可用的 Switch\
  \ On 节点。\n- a. 正确\n- b. 错误\n\n- 3. 结构体中的所有变量必须是相同的类型。\n- a. 正确\n- b. 错误\n\n- 4.\
  \ 数据表使用结构体来定义表的数据类型。\n- a. 正确\n- b. 错误\n\n- 5. 哪个节点不是流程控制节点？\n- a. For Each Loop\n\
  - b. 从类生成角色\n- c. Do Once\n- d. Gate\n"
- "## 第 14 章：数学和追踪节点\n\n3D 世界的表示基于数学概念。如果不理解这些概念，那么理解 3D 游戏中执行的某些操作会更加困难。本章解释了 3D\
  \ 游戏所需的一些数学概念。我们将学习世界变换和相对变换之间的区别，以及在使用组件时如何使用它们。我们将学习如何使用向量来表示位置、方向、速度和距离。解释了追踪的概念，并介绍了各种类型的追踪。本章还展示了如何在游戏中使用追踪来测试碰撞。\n\
  \n本章涵盖的主题如下：\n\n- 世界变换和相对变换\n- 点和向量\n- 追踪和追踪函数简介\n\n本章结束时，您将知道如何使用向量和追踪，使玩家能够与关卡中的其他角色进行交互。\n\
  \n### 世界变换和相对变换\n\n`Actor` 类具有一个 **变换** 结构。该结构有三个变量，用于表示 **位置**、**旋转** 和 **缩放**。可使用\
  \ **详细信息** 面板修改关卡中角色的 **变换** 结构。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_482_0.png)\n\
  \n图 14.1 – 在 **详细信息** 面板中修改变换\n\n在关卡编辑器中，您可以使用选择角色时出现的变换小部件。有按钮可用于选择小部件将应用于角色的变换类型，如下一张截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_482_1.png)\n\n图 14.2 – 使用小部件修改变换\n\n\
  3D 空间由三个轴表示：x、y 和 z。这些轴由颜色表示：红色是 x 轴，绿色是 y 轴，蓝色是 z 轴。\n\n**变换** 结构的 **位置** 变量具有一组\
  \ X、Y 和 Z 值，用于确定每个轴上的位置。这些值也称为角色的世界位置。以下截图显示了我们可用于获取和设置角色位置的一些操作：\n\n- **GetActorLocation**:\
  \ 返回角色的当前位置\n- **SetActorLocation**: 为角色设置 **新位置**\n- **AddActorWorldOffset**: 使用\
  \ **增量位置** 输入参数来修改角色的当前位置。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_483_0.png)\n\
  \n图 14.3 – 获取和设置角色位置\n\n**变换** 结构的 **旋转** 变量具有一组以度为单位的 X、Y 和 Z 值，用于确定每个轴上的旋转。以下截图显示了以下旋转节点：\n\
  \n- **GetActorRotation**: 返回角色的当前旋转\n- **SetActorRotation**: 为角色设置 **新旋转**\n- **AddActorWorldRotation**:\
  \ 将 **增量旋转** 输入参数添加到角色的当前旋转。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_484_0.png)\n\
  \n图 14.4 – 获取和设置角色旋转\n\nTransform 结构的 Scale 变量具有一组 X、Y 和 Z 值，用于确定每个轴上的缩放。以下截图显示了用于获取和设置角色缩放的节点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_484_1.png)\n\n图 14.5 – 获取和设置角色缩放\n\n\
  当蓝图具有角色组件时，这些组件的变换称为相对变换，因为它们相对于组件的父级。以下截图显示了组件的示例。DefaultSceneRoot 是一个隐藏在游戏中的小白色球体，用于存储角色在世界中的位置。它可以替换为另一个场景组件。\n\
  \n在截图显示的组件层级结构中，其下方有一个名为 Table 的静态网格体组件，而在层级结构中 Table 组件下方，还有另一个名为 Statue 的静态网格体组件。Table\
  \ 的变换相对于 DefaultSceneRoot 的变换，Statue 组件的变换相对于 Table 的变换。因此，如果\n\n\n你在视口中移动 **表格**\
  \ 组件时，**雕像** 组件也会移动，但如果你改为更改 **雕像** 组件的相对变换，那么 **表格** 组件将保持原位。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_485_0.png)\n\
  \n图 14.6 – 组件的层级\n\n存在用于获取和设置组件相对位置的节点。你也可以获取组件的世界位置，如下面的截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_486_0.png)\n\
  \n图 14.7 – 获取和设置组件的相对位置\n\n**位置** 和 **缩放** 变量由 **向量** 结构体表示，这是我们下一个主题。\n\n### 点和向量\n\
  \nUnreal Engine 中存在一个名为 **向量** 的结构体，它包含三个浮点类型的变量：**X**、**Y** 和 **Z**。与数学中的向量概念相同，这个\
  \ **向量** 可用于表示 3D 空间中的点（位置）或速度（指定方向上的速度）。\n\n让我们先看一个将 **向量** 用作 3D 空间中点的示例。下面的截图中有两个角色。一个代表角色，另一个代表沙发。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_487_0.png)\n\n图 14.8 – 关卡中的两个角色\n\n下面的截图显示了角色的位置。Transform\
  \ 结构体的 Location 变量为向量类型（X、Y 和 Z），默认情况下，一个 Unreal 单位等于 1.0 厘米。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_487_1.png)\n\
  \n图 14.9 – 角色的位置\n\n我们可以简单地将角色的位置表示为 (50.0, 0.0, 20.0)。沙发的位置是 (450.0, 0.0, 20.0)，如下面的截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_488_0.png)\n\n图 14.10 – 沙发的位置\n\n现在，让我们看看如何使用向量来表示移动。我们将指示我们的角色如何到达沙发。他们需要知道必须移动的方向和距离。下面的截图显示，我们正在指示角色沿\
  \ x 轴移动 **400 厘米**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_488_1.png)\n\n图\
  \ 14.11 – 沿 x 轴移动 400 厘米\n\n方向和距离都由单个向量表示，使用 X、Y 和 Z 值。在前面的截图中，描述移动的向量的值为 (400,\
  \ 0, 0)。\n\n如果我们获取角色位置向量并将其与表示此移动的向量相加，那么结果就是沙发位置向量。要添加两个向量，请将它们的每个元素相加：\n\n```\n\
  couch_location = character_location + vector_movement\ncouch_location = (50, 0,\
  \ 20) + (400, 0, 0)\ncouch_location = (50 + 400, 0 + 0, 20 + 0)\ncouch_location\
  \ = (450, 0, 20)\n```\n\n如果我们有一个起点和一个终点，并想找出移动向量，那么只需获取终点并减去起点。\n\n例如，如果我们想知道从起点\
  \ (25, 40, 55) 到终点 (75, 95, 130) 的向量，那么我们需要求解这个表达式：\n\n```\nvector_movement = destination_point\
  \ - start_point\nvector_movement = (75, 95, 130) - (25, 40, 55)\nvector_movement\
  \ = (75 - 25, 95 - 40, 130 - 55)\nvector_movement = (50, 55, 75)\n```\n\n现在，让我们看看如何表示一个向量。\n\
  \n### 向量的表示\n\n向量是一条有方向的线段，可以用箭头表示。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_489_0.png)\n\
  \n图 14.12 – 表示向量的箭头\n\n点 A 是向量的起点，点 B 是向量的终点。所有世界位置的起点始终是 (0, 0, 0)，而所有相对位置的起点始终是组件父级的终点。\n\
  \n向量具有大小（或长度）和方向。如果两个向量具有相同的大小和方向，则它们是等价的。\n\n### 向量运算\n\n可以对向量执行多种数学运算。理解这些运算是操作\
  \ 3D 空间中对象的基础：\n\n向量加法：两个向量的和由每个元素相加确定。下面的示例显示了向量 (3, 5, 0) 和 (5, 2, 0) 的和：\n\n\
  ```\nv1 = (3, 5, 0)\nv2 = (5, 2, 0)\nv1 + v2 = (3 + 5, 5 + 2, 0 + 0)\nv1 + v2 =\
  \ (8, 7, 0)\n```\n\n下面是前面向量加法示例的图形表示。为了简化图形，我们只绘制 x 轴和 y 轴。v1 的起点是世界原点 (x=0, y=0,\
  \ z=0)。v1 的终点是 (x=3, y=5, z=0)。v2 的起点是 v1 的终点，v2 的终点是和的结果 (x=8, y=7, z=0)。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_491_0.png)\n\
  \n图 14.13 – 相加向量\n\n例如，如果 v1 是角色的世界位置，而 v2 是角色武器的相对位置，那么 v1 + v2 将是武器的世界位置。\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_491_1.png)\n\n图 14.14 – 添加向量的节点\n\n- 向量减法：用一个向量减去另一个向量，由每个元素相减确定。下面是使用向量\
  \ (6, 8, 0) 和 (1, 4, 0) 的向量减法示例：\n\n```\nv1 = (6, 8, 0)\nv2 = (1, 4, 0)\nv1 - v2\
  \ = (6 - 1, 8 - 4, 0 - 0)\nv1 - v2 = (5, 4, 0)\n```\n\n下面是前面向量减法示例的图形表示。由于这是减法，v2\
  \ 向量由其相反向量表示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_492_0.png)\n\n图 14.15\
  \ – 相减向量\n\n例如，如果 v1 是角色武器的世界位置，而 v2 是角色武器的相对位置，那么 v1 - v2 将是角色的世界位置。\n\n向量减法节点如下面的截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_492_1.png)\n\n图 14.16 – 相减向量的节点\n\n-\
  \ 向量长度：向量的长度（或大小）是其起点和终点之间的距离。如果你有两个世界位置，两者之差的长度将是这些世界位置之间的距离。向量的长度使用下面的截图中显示的 Blueprint\
  \ 节点计算：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_493_0.png)\n\n图 14.17 – 向量长度节点\n\
  \n- 向量归一化：我们使用向量归一化来查找单位向量。单位向量的长度等于 1。通常在需要指示方向时使用。有一个名为 Normalize 的节点，它接收向量作为输入并返回归一化的向量：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_493_1.png)\n\n图 14.18 – 归一化向量节点\n\n-\
  \ 标量向量乘法：整数或浮点数也称为标量值。将向量乘以标量值，是将向量的每个元素乘以该标量值。此操作会更改向量的长度，但方向保持不变，除非标量为负数，在这种情况下，向量在乘法后将指向相反的方向。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_494_0.png)\n\n图 14.19 – 将向量乘以浮点数\n\n\
  ### 注意\n\n乘法节点是一个通用节点。这意味着当你将向量变量连接到该节点时，它将被转换为 **向量 x 向量** 节点。你需要右键单击第二个输入引脚，悬停在\
  \ **转换引脚...** 上方，并选择 **浮点**。\n\n- **点积**：点积是一个向量在另一个向量上的投影。两个归一化向量的点积等于向量之间形成的角度的余弦值，范围可从\
  \ -1.0 到 1.0：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_494_1.png)\n\n图 14.20\
  \ – 点积节点\n\n点积可用于验证两个向量之间的关系，例如它们是否垂直或平行。下图显示了两个向量 **A** 和 **B** 之间点积的一些示例：\n\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_495_0.png)\n\n演员向量：有些函数可以返回演员的前向、右向和上向向量。返回的向量已归一化（长度\
  \ = 1）。以下截图展示了这些函数，这些函数常用于指示移动：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_495_1.png)\n\
  \n要查找相反向量，只需将向量乘以 -1。这样，你可以找到演员的后向、左向和下向向量。以下截图展示了如何查找后向向量：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_495_2.png)\n\
  \n向量在游戏编程中广泛使用；它们可以用于指示方向，并表示速度、加速度以及作用于物体上的力。\n\n在下一节中，我们将看到另一个用于与 3D 世界交互的重要概念，即描线。\n\
  \n### 描线和描线函数简介\n\n描线用于测试沿定义线段是否存在碰撞。描线可以按通道或对象类型执行，并可返回被击中的单个或多个对象。\n\n可用的描线通道为\
  \ Visibility 和 Camera。对象类型可以是 WorldStatic、WorldDynamic、Pawn、PhysicsBody、Vehicle、Destructible\
  \ 或 Projectile。你可以在 项目设置 | 引擎 | 碰撞 中创建更多通道和对象类型。\n\n演员和组件需要定义它们对每个描线通道和对象类型的响应方式。响应可以是\
  \ Ignore、Overlap 或 Block。\n\n以下截图显示了静态网格演员的碰撞响应。可以选择的碰撞预设包括 BlockAll、OverlapAllDynamic\
  \ 和 Pawn。或者，你可以为碰撞预设选择 Custom...，并单独定义碰撞响应属性。对象类型通过 对象类型 属性下拉菜单设置，而 Visibility 和\
  \ Camera 通道则在碰撞响应表的 描线响应 部分中定义。\n\n| 碰撞预设 | 自定义... | ↻ |\n| :--- | :--- | :--- |\n\
  | 碰撞启用 | 仅查询（无物理碰撞） | ↻ |\n| 对象类型 | WorldDynamic | |\n| | 忽略 | 重叠 | 阻挡 |\n| 碰撞响应\
  \ | | [ ] | [x] | [ ] |\n| 描线响应 | | | | |\n| Visibility | | [ ] | [x] | [ ] | ↻\
  \ |\n| Camera | | [ ] | [x] | [ ] | ↻ |\n| 对象响应 | | | | |\n| WorldStatic | | [ ]\
  \ | [x] | [ ] | ↻ |\n| WorldDynamic | | [ ] | [x] | [ ] | ↻ |\n| Pawn | | [ ] |\
  \ [x] | [ ] | ↻ |\n| PhysicsBody | | [ ] | [x] | [ ] | ↻ |\n| Vehicle | | [ ] |\
  \ [x] | [ ] | ↻ |\n| Destructible | | [ ] | [x] | [ ] | ↻ |\n\n图 14.24 – 碰撞响应表\n\
  \n当描线函数与某物碰撞时，它将返回一个或多个**击中结果**结构。**击中结果拆分**节点可用于访问**击中结果**变量，如以下截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_498_0.png)\n\
  \n图 14.25 – 击中结果结构变量\n\n以下是**击中结果**结构的一些变量：\n\n- **阻塞击中**：一个布尔值，指示描线是否击中了某物\n- **位置**：击中的位置\n\
  - **撞击法线**：与击中表面垂直的法向量\n- **击中演员**：被描线击中的演员的引用\n\n在接下来的章节中，我们将看到 Blueprint 中可用的描线函数。\n\
  \n### 对象描线\n\nLineTraceForObjects 函数沿定义线测试碰撞，并返回一个击中结果结构，其中包含输入参数中指定的对象类型值所匹配的第一个被击中演员的数据。\n\
  \nMultiLineTraceForObjects 函数与 LineTraceForObjects 函数具有相同的输入参数。两个函数之间的区别在于，MultiLineTraceForObjects\
  \ 函数返回一个击中结果结构数组，描述描线击中的所有演员，而不是单个结果，因此执行开销更大。以下截图显示了两个 TraceForObjects 函数：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_499_0.png)\n\n图 14.26 – TraceForObjects\
  \ 函数\n\n以下是两个 TraceForObjects 函数的输入参数：\n\n- **起点**：定义用于碰撞测试的线段起点的位置向量。\n- **终点**：定义碰撞测试线段终点的位置向量。\n\
  - **对象类型**：包含描线将搜索的对象类型的数组。描线将忽略任何其他类型的所有对象。\n- **描线复杂度**：一个布尔值。如果为 True，则描线将针对实际网格进行测试。如果为\
  \ False，则描线将针对简化的碰撞形状进行测试。\n- **忽略的演员**：包含在碰撞测试中应忽略的演员的数组。\n- **绘制调试类型**：这允许绘制表示描线的\
  \ 3D 线条。\n- **忽略自身**：一个布尔值，指示调用该函数的 Blueprint 实例是否应在碰撞测试中被忽略。\n\n还有其他使用描线通道而非对象类型的线性描线函数，我们将在下一节中介绍。\n\
  \n### 按通道描线\n\nLineTraceByChannel 函数使用描线通道沿定义线测试碰撞，该通道可以设置为 Visibility 或 Camera，并返回包含碰撞测试中第一个被击中演员数据的击中结果结构。还有\
  \ MultiLineTraceByChannel 函数，它返回一个击中结果结构数组，描述描线击中的所有演员。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_501_0.png)\n\
  \n图 14.27 – TraceByChannel 函数\n\n这些函数的输入参数如下：\n\n- **起点**：定义用于碰撞测试的线段起点的位置向量。\n\
  - **终点**：定义碰撞测试线段终点的位置向量。\n- **描线通道**：用于碰撞测试的通道。可以是 **Visibility** 或 **Camera**。描线将搜索与所选描线通道重叠或阻挡的对象。\n\
  - **描线复杂度**：一个布尔值。如果为 **True**，则描线将针对实际网格进行测试。如果为 **False**，则描线将针对简化的碰撞形状进行测试。\n\
  - **忽略的演员**：包含在碰撞测试中应忽略的演员的数组。\n- **绘制调试类型**：这允许绘制表示描线的 3D 线条。\n- **忽略自身**：一个布尔值，指示调用该函数的\
  \ Blueprint 实例是否应在碰撞测试中被忽略。\n\n线性描线不是唯一的描线函数类型。你也可以使用形状来执行描线。\n\n### 形状描线\n\n存在用于球体、胶囊体和盒体形状的描线函数，但这些函数的执行开销比线性描线更大。\n\
  \n以下截图显示了 SphereTraceForObjects、CapsuleTraceForObjects 和 BoxTraceForObjects 函数：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_502_0.png)\n\n图 14.28 – 形状描线函数\n\n对于所有这些形状，都有按通道和对象类型进行描线的函数。还有返回单个击中或多个击中的函数。\n\
  \n### 调试线条\n\n描线函数具有绘制调试线条的选项，以便在测试描线时提供帮助。单击描线函数底部的小箭头，以显示 描线颜色、描线击中颜色 和 绘制时间 参数，如以下截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_503_0.png)\n\n图 14.29 – 调试线条选项\n\n绘制调试类型\
  \ 参数可以设置为以下值之一：\n\n- **无**：不绘制线条。\n- **仅一帧**：线条仅出现一帧。\n- **持续时间**：线条将保留 **绘制时间**\
  \ 参数中指定的时间。\n- **持久**：线条不会消失。\n\n当描线行为不符合预期时，调试线条非常有助于查找问题。\n\n### 向量和描线节点示例\n\n\
  让我们举一个示例来了解向量和描线节点的用法。我们将修改 `Player` 角色，以使用线性描线来查找并切换另一个 Blueprint 的灯光：\n\n\n\n\
  - 1. 使用 **第一人称** 模板和入门内容创建新项目。\n\n- 2. 打开 `FirstPersonCharacter` 蓝图，它位于 `Content/FirstPersonBP/Blueprints`\
  \ 文件夹中。\n\n- 3. 在 **我的蓝图** 面板中，创建一个宏并将其命名为 `Trace Locations`。在 **详情** 面板中，添加两个 **向量**\
  \ 类型的输出参数。将参数命名为 `Start Location` 和 `End Location`，如以下屏幕截图所示。我们不需要输入参数。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_504_0.png)\n\
  \n图 14.30 – 宏输出参数\n\n- 4. 在 `Trace Locations` 宏的图表中，添加以下屏幕截图中所示的节点。该宏计算将由 **直线追踪**\
  \ 使用的 **起点** 和 **终点** 位置。由于这是第一人称游戏，我们使用摄像机作为 **起始位置**，而 **结束位置** 在 **摄像机** 前方 `300\
  \ cm` 处。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_505_0.png)\n\n图 14.31 – Trace\
  \ Locations 宏的节点\n\n- 5. 单击事件图表选项卡，右键单击事件图表，并为 Enter 键添加输入事件。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_505_1.png)\n\
  \n图 14.32 – 添加 Enter 键盘事件\n\n- 6. 添加 LineTraceByChannel 节点，并将 Trace Locations 宏添加到事件图表。将\
  \ Enter 事件的 Pressed 引脚连接到 LineTraceByChannel 的白色引脚。将宏的输出连接到直线追踪的 Start 和 End 输入，如以下屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_506_0.png)\n\n图 14.33 – 使用 LineTraceByChannel\
  \ 节点\n\n- 7. 将以下屏幕截图中所示的节点连接到 LineTraceByChannel 节点的输出。这些节点测试 Hit Actor 是否为 Blueprint_WallSconce\
  \ 类型。如果是，则切换 Blueprint_WallSconce 的灯光。编译蓝图以应用更改。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_507_0.png)\n\
  \n图 14.34 – 测试 Hit Actor 是否为 Blueprint_WallSconce 类型\n\n- 8. 将 `Blueprint_WallSconce`（位于\
  \ `Content\\StarterContent\\Blueprints` 文件夹中）的实例添加到关卡，然后播放关卡。\n\n- 9. 将您的角色移动到 `Blueprint_WallSconce`\
  \ 实例附近，查看它，并按 `Enter` 键切换灯光。以下屏幕截图显示了玩家角色和 `Blueprint_WallSconce`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_508_0.png)\n\
  \n图 14.35 – 与 Blueprint_WallSconce 交互\n\n本示例展示了向量和追踪节点的实际用途。理解这些概念很重要，因为它们将有助于解决3D游戏开发中的许多问题。\n\
  \n### 摘要\n\n本章介绍了一些数学概念，并展示了如何使用世界变换和相对变换。我们了解到几个蓝图节点用于修改变换的元素，例如位置、旋转和缩放。\n\n本章表明，向量结构可用于表示3D空间中的点或数学向量。我们学习了如何使用蓝图节点进行多种向量运算。\n\
  \n最后，我们了解了如何使用追踪节点测试碰撞。有多种追踪节点，它们基于碰撞响应类型、使用的形状以及追踪节点是返回单个命中还是多个命中。\n\n在下一章中，我们将学习几个处理蓝图复杂性和提高蓝图质量的技巧。\n\
  \n### 测验\n\n- 1. 在虚幻引擎中，**变换**是包含 **位置**、**旋转** 和 **缩放** 变量的结构。\n  - a. 正确\n  -\
  \ b. 错误\n\n- 2. **变换**结构的 **位置** 和 **缩放** 变量为 **向量** 类型。\n  - a. 正确\n  - b. 错误\n\
  \n- 3. 归一化向量可以是任意长度。\n  - a. 正确\n  - b. 错误\n\n- 4. **可见性** 和 **摄像机** 是对象类型的示例。\n\
  \  - a. 正确\n  - b. 错误\n\n- 5. **MultiLineTraceByChannel** 函数返回 **命中结果** 结构的数组。\n\
  \  - a. 正确\n  - b. 错误\n"
- "## 第 15 章：Blueprints 技巧\n\n本章包含几个提高蓝图质量的技巧。我们将学习如何使用各种加速工作的编辑器快捷方式。我们还将了解一些蓝图最佳实践，这些实践将帮助您决定应该执行何种类型的实现以及在哪里执行。最后，我们将学习更多有用的杂项蓝图节点。\n\
  \n本章涵盖的主题如下：\n\n- Blueprint Editor 快捷方式\n- 蓝图最佳实践\n- 使用杂项蓝图节点\n\n本章结束时，您将熟悉快捷方式、最佳实践和蓝图节点，这些将在您开发更复杂的游戏时提供帮助。\n\
  \n### Blueprint Editor 快捷方式\n\n在蓝图编辑器中，我们将大量使用变量，因此让我们从与变量相关的快捷方式开始。\n\n当您从 **我的蓝图**\
  \ 面板拖动变量并将其放置在 **事件图表** 中时，会出现一个子菜单供您选择 **获取** 或 **设置** 节点。但是，有创建 **获取** 和 **设置**\
  \ 节点的快捷方式。如果按住 *Ctrl* 键并将变量拖动到图表中，则编辑器将创建 **获取** 节点。要创建 **设置** 节点，请按住 *Alt* 键并将变量拖动到图表中。以下屏幕截图显示了\
  \ **获取** 和 **设置** 节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_512_0.png)\n\n\
  图 15.1 – 创建 GET 和 SET 节点的快捷方式\n\n创建 **获取** 和 **设置** 节点还有另一种方法。如果将变量拖动并放置在另一个节点的兼容引脚上，则编辑器将根据参数类型创建\
  \ **获取** 或 **设置** 节点。\n\n以下屏幕截图显示了将 **得分** 变量放置在输入参数引脚上的示例。如果引脚兼容，则编辑器将显示带有勾选图标和类似\
  \ **设置 B = 得分** 标签的提示。此表达式意味着节点的 **B** 引脚将获取 **得分** 变量的值。因此，编辑器将创建 **获取 得分** 节点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_512_1.png)\n\n图 15.2 – 将变量拖动并放置在输入引脚上以创建\
  \ GET 节点\n\n如果将 **得分** 变量放置在输出参数引脚上，如以下屏幕截图所示，则编辑器将显示 **设置 得分 = 返回值** 标签，并将使用其他节点的\
  \ **返回值** 标签作为输入参数来创建 **设置 得分** 节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_513_0.png)\n\
  \n图 15.3 – 将变量拖动并放置在输出引脚上以创建 SET 节点\n\n蓝图编辑器具有自动类型转换系统。要使用它，请从一个变量类型的引脚拖动一根导线并将其放置在另一个变量类型的引脚上。以下屏幕截图显示会出现提示以确认转换是可能的：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_513_1.png)\n\n图 15.4 – 创建转换器节点\n\n蓝图编辑器的另一个有用功能是，可以将现有节点更改为使用相同变量类型的另一个节点，而不会断开连接。\n\
  \n以下屏幕截图中有此示例。Player Health 和 PlayerStamina 是浮点变量。如果将 PlayerStamina 变量拖动并放置在 SET\
  \ Player Health 节点上，则该节点将更改为 SET PlayerStamina 节点并保留所有连接。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_514_0.png)\n\
  \n图 15.5 – 更改节点并保留所有连接\n\n有一个基于节点输入或输出引脚类型创建变量的快捷方式。要执行此操作，请右键单击数据引脚并选择提升为变量选项，如以下屏幕截图所示。此选项创建一个变量并将其连接到引脚。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_514_1.png)\n\n\n\n图 15.6 – 将返回值提升为变量\n\
  \n如果你需要断开引脚的所有连接，请按住 *Alt* 键并单击该引脚。你可以通过按住 *Ctrl* 键、拖动连接并将其放置在另一个兼容引脚上，将引脚的所有连接移动到另一个兼容引脚。这非常有用，因为你不需要逐一重新创建连接。在以下截图中，**第一人称角色**\
  \ 引脚的所有连接都将移动到 **BP 玩家角色**。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_515_0.png)\n\
  \n图 15.7 – 将所有连接拖动到另一个引脚\n\n蓝图编辑器提供多个节点对齐选项。要使用它们，请选择一些蓝图节点并右键单击其中一个以打开菜单。**对齐**\
  \ 是此菜单上的选项之一。以下截图显示了可用的 **对齐** 选项：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_516_0.png)\n\
  \n图 15.8 – 对齐选项\n\n大多数 **对齐** 选项都不言自明，但让我们看一个示例：Straighten Connection(s)。以下截图显示了三个选定的节点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_516_1.png)\n\n图 15.9 – 这些节点将被对齐\n\n应用\
  \ Straighten Connection(s) 后，节点将被对齐，如以下截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_517_0.png)\n\
  \n图 15.10 – 应用 Straighten Connection(s) 后的节点\n\n在蓝图中创建某些常见节点有快捷键。如果要创建 **分支** 节点，请按住\
  \ *B* 键并在图表上左键单击。要创建 **序列** 节点，请按住 *S* 键并在图表上左键单击，如以下截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_517_1.png)\n\
  \n图 15.11 – 分支和序列节点的快捷键\n\n其他快捷键是 *F + 左键单击*，用于创建 **For Each 循环** 节点，以及 *D + 左键单击*，用于创建\
  \ **延迟** 节点。这些可以在以下截图中看到：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_518_0.png)\n\
  \n图 15.12 – For Each 循环和延迟节点的快捷键\n\n要在某些节点周围创建注释框，请先选择节点，然后右键单击所选节点之一，并从 **选择**\
  \ 中选择 **创建注释** 选项，或者直接按 C 键。以下截图显示了一个标记为 **更多快捷键** 的注释框。在注释框内，有更多用于创建流控制节点的快捷键示例。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_518_1.png)\n\n图 15.13 – 某些流控制节点的快捷键\n\
  \n当你习惯了一些快捷键后，你将看到它们如何加快你的工作。现在，让我们看看有助于构建更好蓝图的提示。\n\n### 蓝图最佳实践\n\n在项目中，你将处理多个蓝图类，其中一些蓝图类会很复杂，包含许多节点。本节中的提示将帮助你分析项目并执行一些实践，这些实践将使你的蓝图类更易于管理。我将这些提示分为两类：蓝图职责和蓝图复杂性。\n\
  \n### 蓝图职责\n\n创建蓝图时，需要决定其职责是什么。这指的是它会做什么和不会做什么。你需要让蓝图尽可能独立。蓝图必须负责其内部状态。\n\n为了说明蓝图职责的概念，让我们使用一个为教学目的创建的简单示例。在游戏中，玩家由\
  \ **第一人称角色** 蓝图表示。如果玩家与敌人蓝图发生碰撞，则玩家将死亡，并生成爆炸效果。以下截图显示了在敌人蓝图中实现的事件命中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_519_0.png)\n\
  \n图 15.14 – 敌人蓝图的事件命中\n\n之后，你将创建另一个也可以杀死玩家的蓝图。因此，你复制 **命中事件** 和上一张截图中的节点，并将其粘贴到新蓝图中。然后，你创建另一种类型的敌人蓝图，并再次复制粘贴\
  \ **命中事件**。但你决定更改玩家死亡的方式。玩家不再爆炸；相反，将执行死亡动画。然而，要在游戏中做出此更改，你需要查找所有可以杀死玩家的蓝图并修改它们全部的脚本。这是一个问题，因为你可能会遗漏其中一个蓝图，脚本可能会频繁更改。\n\
  \n有一种方法可以避免此类问题。定义玩家死亡方式的脚本必须在玩家蓝图中实现，在这个示例中，即 **第一人称角色** 蓝图。关键在于玩家蓝图负责玩家死亡的方式。让我们重新做我们的示例，但现在，我们将在\
  \ **第一人称角色** 蓝图中创建一个名为 **死亡** 的自定义事件，如此截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_520_0.png)\n\
  \n图 15.15 – 在第一人称角色蓝图中创建死亡事件\n\n这样，如果玩家死亡方式发生更改，则只需在 **第一人称角色** 蓝图的 **死亡** 事件中进行更改。\n\
  \n发生碰撞时，其他可以杀死玩家的蓝图只需触发 **第一人称角色** 蓝图的 **死亡** 事件。以下截图显示了 **敌人** 蓝图的 **命中事件** 的新版本：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_521_0.png)\n\n图 15.16 – 敌人蓝图命中事件的新版本\n\
  \n因此，你可以使用事件和函数来定义蓝图如何与其他蓝图通信。如果需要在蓝图之间发送数据，则可以通过输入或输出参数发送。\n\n与蓝图职责相关的另一个主题是关卡蓝图。每个关卡都有一个关卡蓝图，因此如果你将游戏规则逻辑放在关卡蓝图中，那么当你添加另一个关卡时，你需要将所有蓝图节点复制粘贴到新关卡的关卡蓝图中。如果游戏规则逻辑发生更改，你需要修改所有关卡蓝图，这可能会变成维护噩梦。\n\
  \n关卡蓝图应仅用于特定于一个关卡的逻辑和情况。典型示例是在关卡上放置一个隐藏触发器。当玩家与其重叠时，在另一个房间生成一个敌人。\n\n实现游戏规则逻辑的更好位置是\
  \ GameMode 蓝图类。其他参与者的逻辑应在蓝图类中实现，而不是实现在关卡蓝图中，因为蓝图类的实例可以添加到任何关卡，因此你不需要将蓝图节点复制粘贴到另一个关卡中即可使用相同的功能。\n\
  \n### 管理蓝图复杂性\n\n蓝图 **事件图** 可能会变得非常复杂和令人生畏。当你打开由他人制作的这种蓝图时，你可能会想，*发生了什么？*\n\n一些实践和蓝图工具将帮助你管理蓝图的复杂性并保持其可读性。\n\
  \n最重要的概念，可以帮助你处理复杂蓝图，是 **抽象**。抽象通过隐藏低级细节来处理复杂性，使开发者可以专注于高抽象级别的问题，而无需担心脚本其他部分的不必要细节。\n\
  \n在 **事件图** 中，应用抽象的简单方法是：选择一组节点并将其转换为折叠图、函数或宏。要转换节点，请右键单击所选节点。在出现的子菜单中，在 **组织**\
  \ 类别下，你将看到以下截图中显示的选项：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_522_0.png)\n\n\
  图 15.17 – 折叠选项\n\n让我们看一个示例。以下截图显示了连接到 **输入动作** 暂停事件的一些节点。这些节点负责显示暂停菜单：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_523_0.png)\n\
  \n图 15.18 – 用于显示暂停菜单的节点\n\n如果我们选中了节点，右键单击其中一个选中的节点并使用折叠节点选项，则编辑器将创建折叠图，它由单个节点表示。您可以为这个节点赋予有意义的名称。以下屏幕截图显示名为显示暂停菜单的节点，它代表折叠图。如果您想查看或编辑折叠图的节点，请双击折叠节点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_523_1.png)\n\n图 15.19 – 节点已转换为折叠图\n\n\
  仅在节点组不会在其他地方使用时才使用折叠节点。如果同一组节点在事件图表的其他位置使用，则您可以使用折叠为宏。如果您认为一组节点可以从另一个蓝图调用，则使用折叠为函数。\n\
  \n现在，让我们想象一下，您正在打开一个非常复杂的蓝图。但您看到的不是巨大的节点图，而是带有有意义名称的折叠图、宏和函数。至少您将了解蓝图的功能。复杂性依然存在，但它们被隐藏了，您可以在需要时查看特定部分的底层详细信息。\n\
  \n另一个可以提高复杂 **事件图表** 可读性的实用工具是注释框。注释框有助于识别逻辑块。当您缩小 **事件图表** 时，其标签仍然可见，您甚至可以更改注释框的颜色。以下屏幕截图显示了带有三个注释框的缩小后的\
  \ **事件图表**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_524_0.png)\n\n图 15.20 –\
  \ 缩小 **事件图表** 时注释仍然可见\n\n您可以在 **书签** 窗口中查看图表的注释框列表，该窗口可以通过顶部菜单依次选择 **窗口** | **书签**\
  \ 访问。以下屏幕截图显示了 **书签** 窗口：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_525_0.png)\n\
  \n图 15.21 – 书签窗口\n\n如果您在 **书签** 窗口中双击某个项目，则 **事件图表** 将定位到关联位置。您可以通过单击 **事件图表** 左上角的图标并为书签命名来创建书签以引用\
  \ **事件图表** 的位置，如以下屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_525_1.png)\n\
  \n图 15.22 – 创建书签\n\n在 **我的蓝图** 面板中，您可以看到 **事件图表** 中使用的事件列表，如以下屏幕截图所示。双击事件名称可将事件图表移动到事件的位置：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_526_0.png)\n\n图 15.23 – 事件图表中的事件列表\n\n\
  复杂的蓝图可能有许多变量。有两个名为提示和类别的变量属性，可帮助您识别和组织变量。这些属性位于变量的详细信息面板中，如以下屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_527_0.png)\n\
  \n图 15.24 – 提示和类别属性\n\n您可以在 **提示** 属性中描述变量的用途。当鼠标光标悬停在变量上时，将显示提示，如以下屏幕截图所示。如果变量设置为\
  \ **实例可编辑**，则它应该有一个提示，以便使用蓝图实例在关卡中工作的设计师清楚变量的用途。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_527_1.png)\n\
  \n图 15.25 – 悬停在变量上时将出现提示\n\n**类别** 属性用于对相关变量进行分组。您可以创建类别或在下拉菜单中选择现有类别。变量在 **我的蓝图**\
  \ 选项卡中按类别分隔，您可以根据需要打开和关闭该选项卡。这种分隔使理解蓝图的变量变得更加容易。以下屏幕截图显示了名为 **回合状态** 的类别，它包含三个变量：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_528_0.png)\n\n图 15.26 – 变量按类别分组\n\n如果您需要创建保存临时值以帮助处理更复杂逻辑的变量，请考虑创建函数。函数允许创建局部变量，这些变量仅在函数内可见。在编辑函数时，**我的蓝图**\
  \ 面板中会有一个用于局部变量的其他类别，如以下屏幕截图所示。只是提示；函数执行结束时，局部变量的值将被丢弃。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_529_0.png)\n\
  \n图 15.27 – 创建局部变量\n\n本节介绍一些处理蓝图责任和复杂性的最佳实践。我们现在将了解如何使用一些有趣的杂项蓝图节点。\n\n### 使用杂项蓝图节点\n\
  \n在本节中，我们将了解某些在特定情况下非常有用的蓝图节点。\n\n本节将介绍以下节点：\n\n- 选择\n- 传送\n- 格式文本\n- 数学表达式\n- 带混合效果设置视图目标\n\
  - 将 Actor 附加到组件\n- 启用输入和禁用输入\n- 设置输入模式节点\n\n### 选择\n\n**选择** 节点非常灵活。它可以使用多种类型的变量作为索引和选项的值。该节点返回与传递作为输入的索引对应的选项相关联的值。以下屏幕截图显示了\
  \ **选择** 节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_530_0.png)\n\n图 15.28 –\
  \ **选择** 节点\n\n要添加更多输入选项引脚，请单击 **添加引脚 +**。您可以通过将变量引用或线拖动到引脚上，将引脚类型设置为 **选项 0**、\
  \ **选项 1** 或 **索引**。 **选项 0** 和 **选项 1** 可以是任何类型，但 **索引** 类型必须是 **整数**、 **枚举**、\
  \ **布尔值** 或 **字节**。\n\n以下屏幕截图显示了 **选择** 节点的使用示例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_531_0.png)\n\
  \n图 15.29 – **选择** 节点示例\n\n有一个名为 **难度等级** 的枚举，其值为 **简单**、 **普通** 和 **困难**。 **生成\
  \ Boss** 自定义事件将根据 **难度等级** 枚举变量的值生成不同类的 **Boss 蓝图**。此示例中的选项类型是 `Actor Class Reference`。\n\
  \n### 传送\n\n**传送** 节点将参与者移动到指定位置。与设置参与者位置相比，使用 **传送** 的优势在于，如果位置处有障碍物，则参与者将移动到附近无碰撞的位置。\n\
  \n以下屏幕截图显示了使用 **传送** 节点的示例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_532_0.png)\n\
  \n图 15.30 – **传送** 节点示例\n\n有一个名为 **BP 传送平台** 的蓝图，它引用了 **下一个传送平台**。当玩家与 **BP 传送平台**\
  \ 重叠时，他们将被传送到 **下一个传送平台**。\n\n### 格式文本\n\n**格式文本** 节点基于模板文本和在 **格式** 输入参数中指定的参数构建文本。要在\
  \ **文本** 中添加新参数，请使用与参数名一起的 `{}` 分隔符。 **格式** 参数中找到的每个 `{}` 分隔符都会创建一个输入参数。\n\n以下屏幕截图显示了正在使用\
  \ **格式文本** 节点打印回合结果，并使用模板文本 `{Name} wins the round with {Score} points:`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_533_0.png)\n\
  \n图 15.31 – **格式文本** 节点示例\n\n示例输出为 `Serena wins the round with 17 points.`\n\n###\
  \ 数学表达式\n\n**数学表达式** 节点是编辑器创建的折叠图，基于在节点名称中键入的表达式。表达式中找到的每个变量名都会创建一个输入参数引脚。 **返回值**\
  \ 输出参数是表达式的结果。\n\n以下屏幕截图显示了使用 **数学表达式** 节点的示例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_533_1.png)\n\
  \n图 15.32 – **数学表达式** 节点示例\n\n有一个名为 **计算金钱奖励** 的函数，它使用 **数学表达式** 节点。该节点的表达式为 `(PlayerLuck/5)\
  \ * (EnemyHP/30)`。\n\n\n\n\n\n### 设置带混合的视图目标\n\n设置带混合的视图目标节点是 **玩家控制器** 类的一个函数。它用于在不同摄像机之间切换游戏视图。**新视图目标**\
  \ 输入参数是要设置为视图目标的角色，通常是一个摄像机。\n\n下面的屏幕截图显示了使用设置带混合的视图目标节点的示例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_534_0.png)\n\
  \n图 15.33 – 带有混合的设置视图目标节点示例\n\n当玩家进入宝藏房间时，Level Blueprint 中有一个事件会被触发。**设置带混合的视图目标**\
  \ 函数用于将游戏视图更改为宝藏房间中的摄像机。\n\n### 附加角色到组件\n\n**附加角色到组件** 节点将一个角色附加到 **父组件** 输入参数引用的组件上。**父组件**\
  \ 的变换会影响附加的角色。可选地，**套接字名称** 可用于标识角色将被附加的位置。\n\n下面的屏幕截图显示了使用附加角色到组件节点的示例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_535_0.png)\n\
  \n图 15.34 – 附加角色到组件节点示例\n\n装备盾牌自定义事件使用附加角色到组件节点在骨骼网格体组件上装备一个盾牌角色组件。骨骼网格体组件有一个名为\
  \ LeftArmSocket 的套接字，用于将盾牌定位在手臂上。\n\n### 启用输入和禁用输入\n\n启用输入和禁用输入节点是用于定义角色是否应响应输入事件（例如来自键盘、鼠标或游戏手柄的输入事件）的函数。这些节点需要引用正在使用的\
  \ **玩家控制器** 类。\n\n这些节点的常见用途是允许角色仅在玩家靠近角色时接收输入事件，如下面的屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_536_0.png)\n\
  \n图 15.35 – 启用输入和禁用输入节点示例\n\n当玩家开始与 Blueprint 重叠时，会调用 **启用输入** 节点。当玩家结束与 Blueprint\
  \ 重叠时，会调用 **禁用输入** 节点。\n\n### 设置输入模式节点\n\n有三个 **设置输入模式** 节点，用于定义处理用户输入事件的优先级是在 UI\
  \ 还是在玩家输入上。这些节点如下：\n\n- **仅设置输入模式为游戏**：只有 **玩家控制器** 接收输入事件。\n- **仅设置输入模式为 UI**：只有\
  \ UI 接收输入事件。\n- **设置输入模式为游戏和 UI**：UI 在处理输入事件方面具有优先权，但如果 UI 未处理，则 Player Controller\
  \ 接收输入事件。例如，当玩家与代表商店的 Blueprint 重叠时，会显示一个带有选项的 UI，供玩家选择使用鼠标，但玩家仍然可以使用箭头键远离商店。\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_537_0.png)\n\n图 15.36 – 设置输入模式节点\n\n我建议你熟悉这些杂项\
  \ Blueprint 节点。在处理项目时，你将不得不处理一些可以使用特定 Blueprint 轻松解决的问题。\n\n### 摘要\n\n在本章中，我们了解了如何使用编辑器快捷方式以各种方式创建变量，以及如何使用对齐工具组织\
  \ Blueprint 节点。我们还学习了用于创建特定 Blueprint 节点的一些快捷键。\n\n接着，我们研究了一些 Blueprint 最佳实践，以定义\
  \ Blueprint 职责并管理 Blueprint 的复杂性。\n\n最后，我们了解了一些更有用的 Blueprint 节点。所有这些技巧都将帮助你改进脚本并构建高质量的项目。\n\
  \n在下一章中，我们将探索 Unreal Engine 编辑器中可用的虚拟现实模板。\n\n### 测验\n\n- 1. 要创建一个 GET 节点，按住 Alt\
  \ 键并将变量拖动到图表上。\n  - a. 正确\n  - b. 错误\n- 2. Blueprint 必须对其内部状态负责，并尽可能独立。\n  - a.\
  \ 正确\n  - b. 错误\n- 3. 你可以选择一组节点并将它们转换为折叠图表、函数或宏。\n  - a. 正确\n  - b. 错误\n- 4. Select\
  \ 节点的 Index 参数可以是任何类型。\n  - a. 正确\n  - b. 错误\n- 5. Math Expression 节点会为表达式中找到的每个变量名创建一个输入参数引脚。\n\
  \  - a. 正确\n  - b. 错误\n"
- "## 第 16 章：VR 开发简介\n\n本章解释了几个 **虚拟现实（VR）** 概念并探索了 VR 模板。随着 VR 头显变得更加实惠，用户数量正在快速增加。因此，对\
  \ VR 游戏和商业应用的需求也在上升。我们将重点关注 VR 模板的 Blueprints。这将是另一个观察 Blueprint 节点在实践中使用的机会。你将能够使用本章中的一些\
  \ Blueprint 概念来开发多种其他类型的项目，因此即使你没有 VR 头显，本章也很有用。\n\n在本章中，我们将分析 VR 模板的 **VRPawn**\
  \ Blueprint 的功能。我们将解释如何使用运动控制器创建玩家可以抓取的对象，并了解用于实现瞬移的 Blueprint 函数以及如何使用接口进行 Blueprint\
  \ 通信。我们还将看到 VR 模板中的菜单是如何工作的。\n\n本章将涵盖以下主题：\n\n- 探索 VR 模板\n- **VRPawn** Blueprint\n\
  - 瞬移\n- 对象抓取\n- 使用接口进行 Blueprint 通信\n- 与菜单交互\n\n到本章结束时，你将了解 VR 模板的工作原理，并知道如何创建接口以允许不同的\
  \ Blueprint 相互共享数据。\n\n### 探索 VR 模板\n\nUnreal Engine 编辑器有一个 Blueprint VR 模板，使开始尝试\
  \ VR 开发变得容易。VR 模板使用 OpenXR 框架，这是 VR 和增强现实开发的开放标准。得益于 OpenXR，VR 模板可在多个设备上运行，无需任何特定平台的修改。\n\
  \nVR 模板位于 GAMES 类别中。下面的屏幕截图显示了使用 VR 模板创建项目：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_541_0.png)\n\
  \n图 16.1 – 选择 VR 模板\n\n下一个屏幕截图显示了 VR 模板地图，其中包含球体、武器和用户可以抓取的立方体：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_542_0.png)\n\
  \n图 16.2 – VR 模板地图\n\n如果你的计算机上安装了 VR 显示设备并设置为开发模式，则可以通过单击 **播放** 按钮的下拉菜单并选择 **VR\
  \ 预览** 以 VR 模式启动关卡。如果你没有 VR 显示设备，可以使用 **播放** 按钮的 **新建编辑器窗口** 选项启动关卡，并按 *Tab* 键切换旁观者模式。你将能够使用\
  \ *W、A、S* 和 *D* 键以及鼠标在关卡中移动。\n\n在 VR 模式下，你可以通过按下右侧运动控制器的摇杆向上来标记位置并释放摇杆以执行瞬移，从而在关卡的不同位置之间瞬移。关卡中的某些对象可以被抓取。要抓取一个对象，请将运动控制器靠近对象并按住抓握按钮。要释放对象，请松开抓握按钮。\n\
  \n模板中使用的 Blueprint 位于 **Content > VRTemplate > Blueprints** 文件夹中。让我们了解它们的工作原理，以便更轻松地将它们适应到我们的项目中。此外，这将是一个观察\
  \ Blueprint 实际示例的绝佳机会。\n\n### VRPawn Blueprint\n\n**VRPawn** Blueprint 代表关卡中的用户。该\
  \ Blueprint 包含来自运动控制器的输入事件的逻辑，运动控制器是用户手持以在 VR 中进行交互的物理设备。\n\n下面的屏幕截图显示了 **VRPawn**\
  \ Blueprint 的 **组件** 面板：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_543_0.png)\n\
  \n图 16.3 – VRPawn 组件\n\n**MotionControllerRight** 和 **MotionControllerLeft** 是 *运动控制器*\
  \ 组件，用于跟踪运动控制器设备。当你移动运动控制器设备时，运动数据会发送到 *运动控制器* 组件。\n\n**Camera** 组件是用户视图。有一个名为 **HMD**\
  \ 的 *静态网格体* 组件，用于在关卡中直观表示头戴式显示器。当使用旁观者摄像机时，我们可以看到用户的表示，这是因为 **HMD** 和 *运动控制器* 组件：\n\
  \n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_544_0.png)\n\n图 16.4 – VR 模板中的用户表示\n\
  \nVRPawn 中的另一个组件是 TeleportTraceNiagaraSystem，它是一个用于表示瞬移痕迹的 Niagara 粒子系统组件。\n\n然后，我们还有一对运动控制器组件。VR\
  \ 模板使用这些额外组件作为获取瞄准位置的简单方式。默认情况下，运动控制器组件使用握把位置，但您可以在详细信息面板中更改运动源。下一张截图显示了 MotionControllerRightAim\
  \ 的属性。显示设备模型属性未被勾选，因此此运动控制器组件不会在关卡中显示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_545_0.png)\n\
  \n图 16.5 – MotionControllerRightAim 的属性\n\n最后要提及的组件是小部件交互组件。它的工作方式类似于激光指针，用于与小部件菜单交互，该菜单通过按下运动控制器上的菜单按钮激活：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_546_0.png)\n\n图 16.6 – 与小部件菜单交互\n\n在\
  \ **VRPawn** 的 EventGraph 中，有来自运动控制器的多个输入事件，我们将在 _瞬移_ 和 _对象抓取_ 节中详细介绍。\n\n### 瞬移\n\
  \n在本节中，我们将了解用于瞬移的事件和函数。\n\n要开始瞬移，请向上按下右侧运动控制器的摇杆以标记一个位置。当您释放摇杆时，将瞬移到标记的位置。瞬移目标由\
  \ **VRTeleportVisualizer** 蓝图表示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_547_0.png)\n\
  \n图 16.7 – VRTeleportVisualizer 蓝图\n\n用于瞬移的输入事件是 **InputAxis MovementAxisRight_Y**。该事件的第一个节点检查\
  \ **Axis Value** 是否为正，这意味着摇杆已向上按下，并检查 **Axis Value** 是否大于死区，即启动瞬移所需的最小 **Axis Value**：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_547_1.png)\n\n图 16.8 – InputAxis MovementAxisRight_Y\
  \ 的第一个节点\n\n下一张截图显示了连接到 *图 16.8* 中 **Branch** 节点的 **True** 输出的节点。**Do Once** 节点用于确保在瞬移痕迹激活期间，**Start\
  \ Teleport Trace** 函数不会再次运行。**Teleport Trace** 函数会在用户向上按住摇杆时不断更新目标：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_548_0.png)\n\
  \n图 16.9 – 激活瞬移痕迹\n\n下面的截图显示了连接到 *图 16.8* 中 **Branch** 节点的 **False** 输出的节点，这意味着用户没有向上按下右侧运动控制器的摇杆。如果瞬移痕迹处于活动状态，则该事件会结束瞬移痕迹并尝试瞬移到目标。**Try\
  \ Teleport** 节点连接到 **Do Once** 节点的 **Reset** 引脚：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_548_1.png)\n\
  \n图 16.10 – 结束瞬移痕迹并瞬移\n\n让我们分析用于瞬移的 **Start Teleport Trace**、**TeleportTrace**、**End\
  \ Teleport Trace** 和 **Try Teleport** 函数。\n\n**Start Teleport Trace** 函数在 **Teleport\
  \ Trace Active** 布尔变量中设置 `True`，在 **Teleport Trace Niagara System** 组件中将可见性设置为 `True`，并生成\
  \ **VRTeleportVisualizer** 的一个实例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_549_0.png)\n\
  \n图 16.11 – Start Teleport Trace 函数\n\nTeleportTrace 函数使用名为 Predict Projectile Path\
  \ By Object Type 的函数来计算投射瞬移位置和瞬移痕迹路径位置。下面的截图显示了 TeleportTrace 函数的最后几个节点，这些节点会更新\
  \ TeleportVisualizer 位置，并设置 Niagara 粒子系统组件用于瞬移痕迹视觉效果的向量数组：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_549_1.png)\n\
  \n图 16.12 – Teleport Trace 函数的最后节点\n\nEnd Teleport Trace 函数与 Start Teleport Trace\
  \ 函数相反。它将 Teleport Trace Active 布尔变量设置为 False，销毁瞬移可视化器实例，并隐藏瞬移痕迹 Niagara 系统组件：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_549_2.png)\n\n图 16.13 – End Teleport\
  \ Trace 函数\n\nEnd Teleport Trace 函数使用一个 **Validated Get** 节点。当您拥有一个 **Object Reference\
  \ Get** 节点时，可以右键单击它并选择 **Convert to Validated Get**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_550_0.png)\n\
  \n图 16.14 – 将 Get 节点转换为 Validated Get 节点\n\n原始节点被转换为一个带有执行引脚的 **GET** 节点，可用于检查对象引用是否有效：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_550_1.png)\n\n图 16.15 – 带有分支执行引脚的 GET\
  \ 节点\n\nTry Teleport 函数检查 **Valid Teleport Location** 是否为 **True**，然后使用 **Teleport**\
  \ 函数将用户瞬移到目标位置：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_551_0.png)\n\n图 16.16\
  \ – Try Teleport 函数\n\nVR 模板中还有另一种名为 **Snap Turn** 的运动类型。在这种运动中，您可以通过按下左侧运动控制器摇杆的左或右来旋转虚拟角色。Snap\
  \ Turn 使用的输入事件是 **InputAxis MovementAxisLeft_X**。\n\n我们了解了用于瞬移的事件和函数。在下一节中，我们将了解\
  \ VR 模板中对象抓取的工作原理。\n\n### 对象抓取\n\n对象抓取系统基于为 VR 模板创建的 **GrabComponent** 蓝图，该蓝图位于\
  \ `Content > VRTemplate > Blueprints` 文件夹中。\n\n**GrabComponent** 是 **SceneComponent**\
  \ 的子类。有关蓝图组件的更多信息，请参见 _第 18 章，创建蓝图库和组件_。\n\n要使关卡中的任何 Actor 都可抓取，请将 **GrabComponent**\
  \ 添加到 Actor 并将 **Mobility** 设置为 **Movable**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_552_0.png)\n\
  \n图 16.17 – 使 Actor 可抓取\n\n有一个名为 **Grab Type** 的枚举，用于定义对象如何附加到运动控制器。有关枚举的更多信息，请参见\
  \ _第 13 章，数据结构和流程控制_。\n\n您可以在 **GrabComponent** 的 **详细信息** 面板中设置 **Grab Type**：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_552_1.png)\n\n图 16.18 – Grab Type 枚举\n\
  \n可用的抓取类型如下：\n\n- **None**：当您希望禁用抓取但又不移除 Actor 的 `Grab` 组件时，请使用此选项。\n- **Free**：对象附加到运动控制器，同时保持与其相对的位置和方向。此类型最适合无需以特定方式握持即可使用的对象，例如\
  \ VR 模板中的立方体。\n- **Snap**：拾取时，对象会附加到抓取它的运动控制器相对于的特定预定义位置和旋转。此抓取类型通常用于具有明确握把位置的对象，例如\
  \ VR 模板中的武器。\n- **Custom**：此选项允许开发者创建自己的抓取类型。`Grab` 组件具有 `bIsHeld` 布尔变量以及 `OnGrabbed`\
  \ 和 `OnDropped` 事件调度器，可用于创建自定义逻辑。\n\n**VRPawn** 中处理抓取的事件是 **InputAction GrabLeft**\
  \ 和 **InputAction GrabRight**，它们由运动控制器的握把按钮触发。要抓取关卡中的 Actor，请将运动控制器靠近 Actor 并按住握把按钮。要释放\
  \ Actor，请松开握把按钮。\n\n让我们分析 **InputAction GrabLeft** 事件。下面的截图显示了该事件的第一个节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_553_0.png)\n\
  \n\n\n\n\n### 图 16.19 – InputAction GrabLeft 的第一个节点\n\n**获取靠近运动控制器的抓取组件** 函数使用球形追踪来搜索附近的\
  \ Actor。如果找到 Actor，它会检查是否具有 **抓取组件**。如果有，则返回 **抓取组件** 的引用。\n\n有关追踪的更多信息，请参见 *第 14\
  \ 章，数学和追踪节点*。\n\n如果未找到 Actor，或找到的 Actor 没有 **抓取组件** 类型的组件，则 **最近组件** 输出引脚将返回一个无效组件（因为没有任何组件）。因此，**是否有效**\
  \ 节点会检查输出的有效性。如果输出有效，则执行 **抓取组件** 的 **尝试抓取** 函数。如果启用了物理，此函数会禁用 Actor 的物理，并将 Actor\
  \ 附加到运动控制器。**抓取组件** 引用存储在 **左手持有组件** 变量中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_554_0.png)\n\
  \n### 图 16.20 – 执行抓取组件的尝试抓取函数\n\n如果被抓取的对象正被另一只手持有，则另一只手需要释放该对象。这是通过清除另一只手的 **持有组件**\
  \ 变量中的引用来完成的：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_554_1.png)\n\n### 图 16.21\
  \ – 清除右手持有组件变量\n\n下一个截图显示了连接到 InputAction GrabLeft 事件的 Release 引脚的节点。**尝试释放** 函数将\
  \ Actor 从运动控制器上分离。之后，左手持有组件变量会被清除：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_555_0.png)\n\
  \n### 图 16.22 – 用户放下 Actor 时执行的节点\n\n用户可以通过蓝图接口与一些被抓取的 Actor（例如手枪）进行交互。\n\n### 使用接口进行蓝图通信\n\
  \n蓝图接口是一种特殊类型的蓝图，仅包含函数名称和参数。它用于允许不同类型的蓝图之间进行通信。\n\n要创建蓝图接口，请执行以下步骤：\n\n- 1. 在内容浏览器中单击添加按钮，并在蓝图子菜单中选择蓝图接口：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_556_0.png)\n\n### 图 16.23 – 创建蓝图接口\n\n\
  - 2. VR 模板在 Content > VRTemplate > Blueprints 文件夹中有一个名为 VRInteraction BPI 的蓝图接口。双击它以打开蓝图接口编辑器。以下截图显示了\
  \ VRInteraction BPI 接口的函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_556_1.png)\n\
  \n### 图 16.24 – VRInteractionBPI 接口函数\n\n- 3. 打开 **手枪蓝图** 以查看接口实现示例。单击蓝图编辑器的 **类设置**\
  \ 按钮。在 **详细信息** 面板中，转到 **接口** 类别，即可看到 **VRInteraction BPI** 接口已添加到 **手枪蓝图** 中：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_557_0.png)\n\n### 图 16.25 – 添加接口\n\n\
  **手枪蓝图** 实现了 **VRInteraction BPI** 接口的 **扳机按下** 函数。由于 **扳机按下** 函数没有输出参数，因此它作为事件实现：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_558_0.png)\n\n### 图 16.26 – 实现接口的函数\n\
  \n- 4. 在此事件中，手枪蓝图生成一个弹道蓝图的实例。**扳机按下** 函数由 VRPawn 蓝图在 InputAction TriggerLeft 和 InputAction\
  \ TriggerRight 事件中调用：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_558_1.png)\n\n\
  ### 图 16.27 – VRPawn 蓝图调用接口的扳机按下函数\n\nVRPawn 蓝图获取 GrabComponent 的 Actor 所有者，并使用\
  \ Actor 所有者引用调用扳机按下函数。如果 Actor 具有已实现的 VRInteraction BPI 接口，则执行扳机按下。如果 Actor 未实现\
  \ VRInteraction BPI 接口，则不执行任何操作。\n\n在下一节中，我们将了解用户如何与虚拟世界中的菜单进行交互。\n\n### 与菜单交互\n\
  \nVR 模板具有一个菜单系统，可通过按下运动控制器上的 **菜单** 按钮激活。菜单系统由 **菜单蓝图** 和 **小部件菜单蓝图** 实现。这两个蓝图都在\
  \ `Content > VRTemplate > Blueprints` 文件夹中。\n\nVRPawn 处理菜单的事件是 **输入动作菜单切换左** 和 **输入动作菜单切换右**，由运动控制器的\
  \ **菜单** 按钮触发。**菜单** 按钮用于显示和隐藏菜单。\n\n下一个截图显示了执行 VRPawn 的 **切换菜单** 函数的 **输入动作菜单切换右**\
  \ 事件：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_559_0.png)\n\n### 图 16.28 – 输入动作菜单切换右事件\n\
  \n**切换菜单** 函数检查菜单是否处于活动状态。如果是，则调用 **菜单蓝图** 的 **关闭菜单** 函数。如果菜单未处于活动状态，则生成 **菜单蓝图**\
  \ 的一个实例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_560_0.png)\n\n### 图 16.29 –\
  \ 切换菜单函数\n\n**菜单蓝图** 负责显示附加到运动控制器上的 **小部件菜单** 并定义它们之间的交互。\n\n双击 **小部件菜单** 打开 UMG\
  \ 编辑器：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_560_1.png)\n\n### 图 16.30 – UMG\
  \ 编辑器中的小部件菜单\n\n在 UMG 编辑器的 **图表** 选项卡中，我们可以看到按钮的 **点击** 事件。**点击（重启按钮）** 事件使用 **打开关卡**\
  \ 函数来重新加载关卡：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_561_0.png)\n\n### 图 16.31\
  \ – 点击（重启按钮）事件\n\nExitButton 按钮具有现实生活标签。**点击（退出按钮）** 事件使用 **退出游戏** 函数退出应用程序：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_561_1.png)\n\n### 图 16.32 – 点击（退出按钮）事件\n\
  \n如果要向菜单添加命令按钮，只需修改 **小部件菜单** 蓝图。有关 UMG 的更多信息，请参见 _第 7 章，创建屏幕 UI 元素_。\n\n我们已经分析了\
  \ VR 模板中使用的主要元素，因此现在更容易理解 VR 模板中更复杂的部分。\n\n### 摘要\n\n在本章中，我们探索了 VR 模板，它是开始尝试 VR\
  \ 开发的一种简单方式。我们了解到 VR 模板的主要功能在 **VRPawn** 蓝图中。\n\n我们分析了用于实现传送的蓝图函数，并了解了 **抓取组件**\
  \ 如何用于制作可抓取对象。\n\n我们学习了 **蓝图接口** 的概念，并了解了它们如何用于允许用户使用 **手枪** 蓝图射击。我们还了解了如何修改 VR\
  \ 模板使用的 UMG 菜单。\n\n本章总结了 _第 4 部分，高级蓝图_，介绍了高级蓝图概念。_第 5 部分，额外工具_ 将介绍 Unreal Engine\
  \ 中可用的一些额外工具。在下一章中，我们将学习关于动画蓝图的内容。\n\n### 测验\n\n- 1. VR 模板不使用 OpenXR 框架。\n  - a.\
  \ 正确\n  - b. 错误\n\n- 2. **VRPawn** 蓝图具有 *运动控制器* 组件来跟踪运动控制器设备。\n  - a. 正确\n  - b.\
  \ 错误\n\n- 3. 您可以右键单击 **对象引用获取** 节点，并将其转换为带有可用于检查引用是否有效的执行引脚的 **验证获取** 节点。\n  - a.\
  \ 正确\n  - b. 错误\n\n- 4. 要创建可抓取 Actor，您需要创建 **抓取组件** 蓝图的子蓝图类。\n  - a. 正确\n  - b.\
  \ 错误\n\n- 5. 当接口函数没有输出参数时，它作为事件实现。\n  - a. 正确\n  - b. 错误\n"
