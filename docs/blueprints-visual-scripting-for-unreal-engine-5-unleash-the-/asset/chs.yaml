  The **PACKAGING** category contains a lot of technical options that can be used
  to optimize the packaging. The **Build Configuration** option defines how the build
  will be done. In Blueprint-only projects, you have two options: **Development**
  and **Shipping**. Development builds contain information that is used in debugging
  to help you find errors. Shipping builds are cleaner as they do not have debug information
  and should be used to create the final version of the game that will be distributed.


  **打包** 类别包含许多可用于优化打包的技术选项。**构建配置** 选项定义构建的执行方式。在仅使用蓝图的项目中，你有两个选项：**开发** 和 **发布**。开发构建包含用于调试的信息，以帮助你查找错误。发布构建更干净，因为它们不包含调试信息，并应用于创建将要分发的游戏最终版本。


