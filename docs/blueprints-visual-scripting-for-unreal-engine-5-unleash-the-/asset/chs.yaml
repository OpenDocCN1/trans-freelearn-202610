  \n### 数组\n\n一个 **数组** 是一种容器类型，用于存储一种特定数据类型的一个或多个值。因此，可以使用单个变量来存储多个值，而不是为每个值使用单独的变量。\n\
  \n数组提供对其元素的索引访问，因此用于检索元素的标签是该元素在容器中的顺序索引。除非在数组中间插入元素，否则每个元素都会保持其在数组中的位置。\n\n创建数组的步骤如下：\n\
