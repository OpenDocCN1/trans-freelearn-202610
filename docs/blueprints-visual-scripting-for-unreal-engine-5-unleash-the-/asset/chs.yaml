- '# 第 1 部分：蓝图基础


  本部分将探讨蓝图的基本构建块。您将牢固理解蓝图的工作原理，并能够开始创建自己的游戏。


  本部分包含以下章节：


  - 第 1 章，探索蓝图编辑器

  - 第 2 章，使用蓝图进行编程

  - 第 3 章，面向对象编程和游戏框架

  - 第 4 章，理解蓝图通信

  '
- "## 第 1 章：探索蓝图编辑器\n\n欢迎来到使用虚幻引擎 5 进行游戏开发的精彩世界。在本书中，我们将学习如何使用由 Epic Games 为虚幻引擎创建的蓝图可视化脚本语言在虚幻引擎中开发游戏。\n\
  \n在学习蓝图之前，需要采取的第一步是准备开发环境。虚幻引擎可免费下载。我们将学习如何安装虚幻引擎 5 并创建新项目。之后，我们将学习一些蓝图的基本概念并探索蓝图编辑器的每个面板。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 安装虚幻引擎\n- 创建新项目和使用模板\n- 蓝图可视化脚本\n- 蓝图类编辑器界面\n- 向蓝图添加组件\n\n\
  ### 安装虚幻引擎\n\n要使用虚幻引擎，您必须首先安装 Epic Games 启动器：\n\n1. 访问 https://www.unrealengine.com\
  \ 网站。\n2. 注册并下载 Epic Games 启动器。\n3. 安装并启动启动器。\n4. 单击左侧边栏的虚幻引擎选项卡。\n5. 单击屏幕顶部出现的\
  \ **库** 选项卡。\n6. 单击 **引擎版本** 旁边的 + 按钮，向启动器添加一个虚幻引擎版本。您可以使用最新可用版本。\n7. 单击 **安装**\
  \ 按钮。启动器将开始下载安装所需的文件，可能需要很长时间才能完成。\n8. 单击 **启动** 按钮以启动已安装的版本。可以在同一台计算机上安装多个虚幻引擎版本——只需将其中一个设置为当前版本即可。启动器右上角的\
  \ **启动** 按钮将启动当前版本。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_14_0.png)\n\n图 1.1\
  \ – 启动虚幻引擎\n\n蓝图可视化脚本系统已经是一项成熟且稳定的技术。本书使用 5.0.0 版本，但本书中创建的示例应该在以后的版本中也能正常工作。\n\n\
  ### 创建新项目和使用模板\n\n启动虚幻引擎编辑器后，将出现 **虚幻项目浏览器**。左上角的 **最近项目** 框用于打开现有项目，左侧的其他框是用于创建新项目的模板类别。以下屏幕截图显示了游戏类别的模板。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_15_0.png)\n\n图 1.2 – 游戏类别下的模板\n\n模板是带有一些关键文件和关卡的基本容器，为不同类型的项目提供基本起点。它们对于快速原型设计或学习特定类型项目的基本机制很有用。使用模板是可选的。所有模板都可以在空白模板中简单重新创建。以下是游戏类别中每个模板的描述：\n\
  \n- **第一人称**：适用于第一人称视角的游戏。此模板包含一个玩家角色，由一双配备枪支的手臂表示，该枪支发射简单的球形弹丸。角色可以使用键盘、控制器或触摸设备上的虚拟摇杆在关卡中移动。\n\
  \n- **手持 AR**：适用于 Android 和 iOS 设备的增强现实应用程序。此模板包含用于切换 AR 模式的运行时逻辑\n\n\n\n开启和关闭，并附带一些用于命中检测和光照估算处理的示例代码。\n\
  \n- **第三人称：** 包含一个可操作的角色，并附带一个跟随角色的摄像机。摄像机位于角色后方并略高于角色。该角色具有行走、奔跑和跳跃动画，可以使用键盘、控制器或触摸设备上的虚拟摇杆在关卡中移动。\n\
  \n- **俯视图：** 包含一个由鼠标控制的角色，其上方远处设有摄像机。玩家角色使用鼠标或触摸屏点击所需目的地进行控制，并在移动到目的地时使用导航系统避开障碍物。这种俯视视图常用于动作角色扮演游戏。\n\
  \n- **虚拟现实：** 包含虚拟现实游戏的基本功能。此模板具有传送移动、可抓取对象、交互对象和 VR 旁观摄像机。该模板包含一个玩家可以在其中移动的关卡，并包含可抓取和交互的对象。\n\
  \n- **车辆：** 包含普通车辆和带悬挂系统的复杂车辆。此模板的关卡包含简单的赛道和障碍物。\n\n在 **Unreal 项目浏览器** 的右下角，有适用于所选模板的\
  \ **项目默认设置**，其中包含项目配置选项。在本书的示例中，我们将使用屏幕截图中选定的值。这些选项稍后可以在项目中修改，如下所示：\n\n- **蓝图/C++：**\
  \ 有使用 **蓝图** 或 C++ 编程语言制作的模板。在本书中，我们将只使用 **蓝图** 模板。Unreal Engine 5 中的项目可以使用 **蓝图**、C++\
  \ 或两者的组合进行开发。您可以将 C++ 代码添加到 **蓝图** 项目，并将 **蓝图** 添加到 C++ 项目。\n\n- **目标平台：** 桌面版或移动版。如果您正在为计算机或游戏主机开发项目，请使用\
  \ **桌面版**。如果您的项目将在移动设备上查看，请选择移动版。在本书中，我们将使用桌面版选项。\n\n- 质量预设：可缩放或最大。这些选项会影响项目的性能。可缩放选项会禁用某些复杂功能，而最大选项将启用目标平台上的所有可用功能。在本书中，我们将使用可缩放选项。\n\
  \n- 初始内容：如果选中此复选框，项目将包含初始内容。初始内容是一个包含简单网格、材质和粒子效果的内容包。本书的示例假设正在使用初始内容。\n\n- 光线追踪：如果选中此复选框，项目将使用实时光线追踪，这是一个性能开销大的功能。本书的示例将不使用光线追踪。\n\
  \n选择第三人称模板，选择一个位置文件夹，并填写项目的名称字段。选择前面列表中提到的项目默认设置，然后单击创建按钮。项目加载后，将显示 Unreal 引擎关卡编辑器，如下图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_17_0.png)\n\n### 图 1.3 – Unreal 引擎关卡编辑器\n\
  \n以下是关卡编辑器的主要面板：\n\n- 1. **工具栏**：位于关卡编辑器的顶部。它包含常用操作的按钮。工具栏按钮分为四组。从左边开始的第一组提供快速访问保存工作和向项目添加各种对象和代码等功能。第二组按钮用于更改关卡编辑器的编辑模式。第三组可让您运行当前关卡，并提供各种特定于平台的选项。最右侧的最后一个\
  \ **设置** 按钮可轻松访问项目设置。\n\n- 2. **视口**：位于关卡编辑器的中心。它显示正在创建的关卡。您可以使用 **视口** 面板在关卡中移动并向关卡添加对象。按住鼠标右键的同时，移动鼠标以旋转摄像机，并使用\
  \ WASD 键进行移动。\n\n- 3. **内容浏览器**：可以通过单击位于关卡编辑器左下角的 **内容抽屉** 按钮来访问。它用于管理项目的资产。资产是\
  \ Unreal Engine 项目中的一段内容。例如，**材质**、**静态网格** 和 **蓝图** 都是资产。如果您将资产从 **内容浏览器** 拖放到关卡中，编辑器将创建资产的副本并将其放置在关卡中。\n\
  \n- 4. **大纲视图**：位于关卡编辑器的右侧。它列出关卡中的对象。\n\n- 5. **详细信息**：位于关卡编辑器的右侧，在 **大纲视图** 下方。它显示在\
  \ **视口** 中选定对象的可编辑属性。\n\n现在我们已经了解了 Unreal 引擎关卡编辑器的概览，让我们专注于蓝图可视化脚本。\n\n### 蓝图可视化脚本\n\
  \n您首先应该问的问题是：什么是蓝图？\n\n在 Unreal Engine 中，蓝图一词有多种含义。首先，它是 Epic Games 为 Unreal Engine\
  \ 创建的可视化脚本语言的名称。其次，它可以指使用蓝图语言创建的一种新类型的游戏对象。\n\n蓝图主要有两种类型：关卡蓝图和蓝图类。游戏中的每个关卡都有自己的关卡蓝图，且无法创建单独的关卡蓝图。另一方面，蓝图类用于为游戏创建交互对象，并可以在任何关卡中重复使用。\n\
  \n### 打开关卡蓝图编辑器\n\n要打开关卡蓝图编辑器，请单击 Unreal 编辑器工具栏中最左侧按钮组中的蓝图按钮。然后，从下拉菜单中选择打开关卡蓝图选项，如下图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_19_0.png)\n\n图 1.4 – 打开关卡蓝图\n\n编辑器将打开当前关卡的\
  \ **关卡蓝图** 。**关卡蓝图编辑器** 比 **蓝图类编辑器** 更简单，因为它只有 **我的蓝图** 面板、**详细信息** 面板和 **事件图表**\
  \ 编辑器。下图显示了 **关卡蓝图编辑器**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_20_0.png)\n\
  \n图 1.5 – 关卡蓝图编辑器\n\n目前，我们不会对 **关卡蓝图** 做任何操作。我们打开它是为了初步了解界面。关闭 **关卡蓝图编辑器** 以返回 **关卡编辑器**\
  \ 窗口。现在，我们将创建一个 **蓝图类** 以打开 **蓝图类编辑器** 并查看所有可用面板。\n\n### 创建蓝图类\n\n创建蓝图类有三种方法：\n\n\
  - 1. 单击工具栏中与打开 **关卡蓝图** 时使用的相同的 **蓝图** 按钮。然后，在下拉菜单中单击 **新建空蓝图类** 按钮。\n\n- 2. 单击\
  \ **内容抽屉** 按钮打开 **内容浏览器**，然后单击 **添加** 按钮并在创建基本资产类别下选择 **蓝图类**。\n\n- 3. 在内容浏览器的空白区域右键单击，并从出现的菜单中选择蓝图类。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_21_0.png)\n\n图 1.6 – 创建蓝图类\n\n在下一个窗口中，您必须为新蓝图选择父类。暂时可以将父类视为蓝图类型。该窗口显示最常见的\
  \ **常用** 类，但如果您需要选择其他父类，只需展开 **全部类** 选项即可。选择父类后，该窗口将关闭，并且新的蓝图资产将出现在 **内容浏览器** 中以供重命名。您可以单击\
  \ **取消** 按钮，因为我们只是熟悉此过程。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_22_0.png)\n\
  \n图 1.7 – 蓝图父类\n\n现在我们已经学习了如何打开当前关卡蓝图以及如何创建蓝图类，我们将探索蓝图类编辑器的面板。您可以通过在 **内容浏览器** 中右键单击蓝图资产并选择\
  \ **编辑**，或双击蓝图资产来打开蓝图类编辑器。\n\n\n\n\n\n### 蓝图类编辑器界面\n\n蓝图类编辑器包含多个面板。每个面板用于编辑蓝图的一个方面。蓝图类编辑器通常简称为蓝图编辑器。蓝图编辑器的主面板列表如下：\n\
  \n- 工具栏\n- 组件\n- 我的蓝图\n- 详情\n- 视口\n- 事件图表\n\n这些面板可以在下一张截图中找到。我们将以第三人称模板中的 BP_ThirdPersonCharacter\
  \ 蓝图为例。它位于 ThirdPerson/Blueprints 文件夹中。双击 BP_ThirdPersonCharacter 蓝图以打开蓝图类编辑器。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_24_0.png)\n\n图 1.8 – 蓝图编辑器面板\n\n### 工具栏面板\n\
  \n工具栏面板位于蓝图类编辑器的顶部，包含一些用于编辑蓝图的必要按钮：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_24_1.png)\n\
  \n图 1.9 – 工具栏面板\n\n按钮说明如下：\n\n- **编译**：将蓝图脚本转换为可执行的较低级别格式。这意味着蓝图必须在运行游戏之前编译，否则所做的更改不会生效。单击此按钮以编译当前蓝图。如果没有错误，将出现一个绿色的对勾图标。\n\
  - **保存**：保存对当前蓝图所做的所有更改。\n- **浏览**：在 **内容浏览器** 中显示当前的 **蓝图类**。\n- **查找**：在蓝图中搜索。\n\
  - **隐藏无关项**：启用时，隐藏与所选节点无关的节点。\n- **类设置**：允许在 **详情** 面板中编辑类的设置。**类设置** 选项包含 **描述**、**类别**\
  \ 和 **父类** 等属性。\n- **类默认值**：允许在 **详情** 面板中编辑 **类默认值** 。**类默认值** 是蓝图变量的初始值。\n- **模拟**：允许在蓝图编辑器内执行蓝图。\n\
  - **游玩**：允许你游玩当前关卡。\n- **调试对象**：此下拉菜单允许选择要调试的对象。如果未选择任何对象，它将调试使用当前蓝图类创建的任何对象。\n\n\
  ### 组件面板\n\n**组件** 面板显示当前蓝图中包含的所有组件。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_26_0.png)\n\
  \n图 1.10 – 组件面板\n\n组件是可以添加到蓝图的即用型对象。为此，请单击组件面板上的添加按钮。蓝图可以仅通过使用组件即可创建各种功能。\n\n选定组件的属性可以在\
  \ **详情** 面板中编辑，并且某些组件的可视化表示可以在 **视口** 面板中查看。\n\n静态网格体、灯光、声音、盒体碰撞、粒子系统和相机是组件面板中找到的组件示例。\n\
  \n### 我的蓝图面板\n\n我的蓝图是一个面板，我们可以在其中为蓝图创建变量、宏、函数和图表：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_27_0.png)\n\
  \n图 1.11 – 我的蓝图面板\n\n可以通过单击面板顶部的 **添加** 按钮，或每个类别旁边的 + 按钮来添加新元素。\n\n选定元素的属性可以在 **详情**\
  \ 面板中编辑。\n\n### 详情面板\n\n**详情** 面板允许你编辑蓝图中选定元素的属性。选定元素可以是 **组件**、**变量**、**宏** 或 **函数**\
  \ 元素。**详情** 面板中显示的属性按类别组织。\n\n下一张截图显示了 **胶囊体组件** 的属性。面板顶部有一个 **搜索** 框，可用于筛选属性。\n\
  \n### 详情\n\n### 变量\n\n- **变量名称**：CapsuleComponent\n- **提示**：\n- **类别**：角色\n- **继承时可编辑**：[x]\n\
  \n### 变换\n\n### 插座\n\n- **父插座**：\n\n### 形状\n\n- **胶囊体半高度**：96.0\n- **胶囊体半径**：42.0\n\
  \n### 导航\n\n- **区域类**：NavArea_Oil\n- **动态障碍物**：[x]\n- **填充下方碰撞**：[ ]\n\n### 组件刻帧\n\
  \n- **启用刻帧时启动**：[x]\n\n图 1.12 – 详情面板\n\n### 视口面板\n\n**视口** 面板显示蓝图及其组件的可视化表示。**视口**\
  \ 面板具有与关卡编辑器类似的控件，可用于操作组件的位置、旋转和缩放。\n\n下面的截图显示了 **视口** 面板。有一个 **骨骼网格体** 组件表示玩家，一个\
  \ **摄像机** 组件定义玩家的视图，以及一个 **胶囊体** 组件用于碰撞检测。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_29_0.png)\n\
  \n图 1.13 – 视口面板\n\n### 事件图表面板\n\n我们将在 **事件图表** 面板中编程蓝图的行为。**事件图表** 包含 **事件** 和 **动作**\
  \ ，它们由节点表示并通过电线连接。\n\n事件由红色节点表示，并由游戏玩法事件触发。蓝图可以具有多个动作，这些动作将在响应事件时执行。下一张截图显示了两个事件：**输入轴\
  \ 转向速率** 和 **输入轴 视角上抬速率**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_30_0.png)\n\
  \n图 1.14 – 事件图表面板\n\n你可以通过右键单击并拖动事件图表来移动，以查看其他事件。\n\n其他节点是表示函数、运算符和变量的动作。我们将在第 2\
  \ 章“使用蓝图进行编程”中了解这些元素。\n\n在概述了蓝图编辑器面板后，我们现在可以创建第一个蓝图了。关闭蓝图类编辑器并返回关卡编辑器。\n\n### 向蓝图添加组件\n\
  \n现在，让我们创建第一个蓝图。它将是一个非常简单的蓝图，仅包含组件。目前，我们不会使用事件或动作：\n\n- 单击内容抽屉按钮打开内容浏览器，然后单击添加按钮并选择蓝图类。\n\
  - 在下一个屏幕上，选择 Actor 作为父类。\n- 将刚刚创建的蓝图重命名为 BP_RotatingChair。\n- 蓝图名称中不能有空格，并且有将蓝图名称以\
  \ BP_ 开头的惯例。\n- 双击此蓝图以打开蓝图编辑器。\n- 在组件面板上，单击添加按钮并选择静态网格体，如下面的截图所示。此静态网格体将以可视化形式表示此蓝图。\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_32_0.png)\n\n图 1.15 – 添加静态网格体组件\n\n-\
  \ 在 **详情** 面板中，有一个名为 **静态网格体** 的属性，带有下拉输入。单击下拉菜单并选择名为 **SM_Chair** 的 **静态网格体** 属性。此\
  \ **静态网格体** 是入门内容的一部分。下面的截图显示了选定的 SM_Chair：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_33_0.png)\n\
  \n图 1.16 – 选择静态网格体资产\n\n- 让我们添加另一个组件。单击 **组件** 面板的 **添加** 按钮，并在 **搜索** 框中输入 `rotating\
  \ movement`。\n- 单击 **旋转运动** 组件以添加它。默认情况下，此组件将围绕 z 轴旋转蓝图，因此我们不需要更改其属性。\n- 单击 **编译**\
  \ 按钮并保存蓝图。\n- 在关卡编辑器中，将 **BP_RotatingChair** 蓝图从 **内容浏览器** 拖动到关卡中的某个位置。\n- 按下关卡编辑器的\
  \ **游玩** 按钮以查看旋转椅子。你可以使用 *WASD* 键移动角色，并使用鼠标旋转摄像机。你可以按下 *Esc* 键退出正在游玩的关卡。下面的截图显示了示例的运行情况：\n\
  \n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_34_0.png)\n\n**图 1.17 – 旋转椅**\n\n\
  ### 摘要\n\n在本章中，我们学习了如何安装虚幻引擎，并使用可用模板创建新项目。我们了解到，蓝图有两种主要类型：关卡蓝图和蓝图类。\n\n然后，我们探索了蓝图编辑器中包含的不同类型的面板。熟悉这些面板将有助于使用蓝图进行开发。最后，我们还仅使用组件创建了一个简单的蓝图。\n\
  \n在下一章中，我们将学习如何使用事件和操作来编程蓝图的行为。\n\n### 测验\n\n- 1. 您的计算机上可以安装多个版本的虚幻引擎。\n  - a. 正确\n\
  \  - b. 错误\n\n- 2. 关卡蓝图编辑器的面板比蓝图类编辑器多。\n  - a. 正确\n  - b. 错误\n\n- 3. 哪种类型的蓝图适合创建可以在任何关卡中重复使用的对象？\n\
  \  - a. 关卡蓝图\n  - b. 蓝图类\n\n- 4. 蓝图编辑器中的哪个面板可以添加事件和操作？\n  - a. 组件面板\n  - b. 事件图表面板\n\
  \  - c. 我的蓝图面板\n  - d. 详情面板\n\n- 5. 蓝图编辑器中的哪个面板显示当前蓝图的变量和函数？\n  - a. 详情面板\n  - b.\
  \ 组件面板\n  - c. 我的蓝图面板\n  - d. 事件图表面板\n"
- "## 第 2 章：使用蓝图进行编程\n\n本章介绍了蓝图中使用的基本编程概念。编程本质上是编写计算机能够理解和执行的指令的一种方式。大多数编程语言都是基于文本的，但蓝图通过使用基于节点的界面，提供了一种不同的可视化编程形式。\n\
  \n当某些编程语言存在于特殊环境中或具有明确定义的目的时，它们被称为脚本语言。例如，蓝图是虚幻引擎的可视脚本语言。\n\n在本章中，我们将涵盖以下主题：\n\n\
  - 在变量中存储值\n- 使用事件和操作定义蓝图的行为\n- 使用运算符创建表达式\n- 使用宏和函数组织脚本\n\n### 在变量中存储值\n\n变量是一种编程概念。它由指向可存储值的内存位置的标识符组成。例如，游戏中的角色可能拥有用于存储其生命值、速度和弹药数量的变量。\n\
  \n一个蓝图可以拥有多种类型的多个变量。蓝图的变量列在我的蓝图面板中。单击变量类别中的 + 按钮可创建变量：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_38_0.png)\n\
  \n**图 2.1 – 创建变量**\n\n变量的类型定义了变量可以存储的内容。\n蓝图是一种强类型语言。这意味着您必须在创建变量时定义变量类型，并且该类型在程序执行期间无法修改。\n\
  \n当您创建变量时，其属性会显示在详情面板中。\n变量的第一个属性是其名称，第二个属性是其类型。各种类型如下：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_39_0.png)\n\
  \n**图 2.2 – 变量类型**\n\n每种类型都用一种颜色表示。以下是变量类型：\n\n- **布尔型**：只能保存 true 或 false 值。\n\
  - **字节型**：这是一个 8 位数字。它可以存储 0 到 255 之间的整数值。\n- **整型**：这是一个 32 位数字。它可以存储 −2,147,483,648\
  \ 到 2,147,483,647 之间的整数值。\n- **整型 64**：这是一个 64 位数字。它可以存储 −9,223,372,036,854,775,808\
  \ 到 9,223,372,036,854,775,807 之间的整数值。\n- **浮点型**：这是一个 32 位浮点数。它可以存储带有小数部分的数值，精度为七位小数。\n\
  - **双精度型**：这是一个 64 位浮点数。它可以存储带有小数部分的数值，精度为 16 位小数。\n- **名称型**：用作对象标识符的文本片段。\n- **字符串型**：可以存储一组字母数字字符。\n\
  - **文本型**：此类型用于将进行本地化的文本，这意味着它允许更轻松地实现翻译成不同语言。\n- **向量**：包含 X、Y 和 Z 浮点值，代表 3D 向量。\n\
  - **旋转器**：包含 X（滚转）、Y（俯仰）和 Z（偏航）浮点值，代表 3D 空间中的旋转。\n- **变换**：可以存储位置、旋转和缩放。\n\n还有与\
  \ **结构**、**接口**、**对象类型** 和 **枚举** 相关的其他变量类型。我们将在即将到来的章节中了解这些类型。\n\n以下屏幕截图显示了 **详情**\
  \ 面板，其中包含可在 **变量** 中修改的属性：\n\n### 详情\n\n搜索详情\n\n### 变量\n\n| 属性 | 值 |\n|---|---|\n\
  | 变量名 | PlayerHealth |\n| 变量类型 | Float |\n| 实例可编辑 | |\n| 蓝图只读 | |\n| 提示 | |\n| 生成时公开\
  \ | |\n| 私有 | |\n| 公开至序列 | |\n| 类别 | Default |\n| 滑块范围 | -- |\n| 数值范围 | -- |\n|\
  \ 复制 | None |\n| 复制条件 | None |\n\n### 默认值\n\n**图 2.3 – 变量属性**\n\n这些属性可以单独描述如下：\n\
  \n- **变量名**：这是变量的标识符。\n- **变量类型**：这指定了可以存储在此变量中的值的类型。\n- **实例可编辑**：选中此框后，放置在关卡中的此蓝图的每个副本都可以在此变量中存储不同的值。否则，相同的初始值由所有副本共享，称为\
  \ **实例**。\n- **蓝图只读**：如果选中，则变量不能由蓝图节点更改。\n- **提示**：这包含在光标悬停在变量上方时显示的信息。\n- **生成时公开**：如果选中，则在生成蓝图时可以设置该变量。\n\
  - **私有**：如果选中，子蓝图无法修改它。\n- **公开至序列**：如果选中，则该变量将公开至 Sequencer。\n- **类别**：这可以用于组织蓝图中的所有变量。\n\
  - **滑块范围**：这设置了将由 **用户界面 (UI)** 滑块用于修改此变量的最小值和最大值。\n- **数值范围**：这设置了此变量允许的最小值和最大值。\n\
  - **复制和复制条件**：它们用于网络游戏。\n- **默认值**：这包含变量的初始值。在您设置默认值之前，必须编译蓝图。\n\n变量用于表示蓝图的当前状态，但行为由事件和操作定义，将在下一节中讨论。\n\
  \n### 使用事件和操作定义蓝图的行为\n\n大多数情况下，我们将使用蓝图创建新角色。在虚幻引擎中，角色是可以添加到关卡的游戏对象。\n\n虚幻引擎使用事件来告知角色的游戏状态。我们通过使用操作来定义角色对事件的响应。事件和操作都由\
  \ **事件图表** 面板中的节点表示。\n\n### 事件\n\n要向蓝图添加事件，请使用 **事件图表** 面板。右键单击 **事件图表** 面板以打开 **上下文菜单**，其中列出了可用的事件和操作。如果您需要在\
  \ **事件图表** 面板中获得更多空间，可以右键单击并拖动将其移动到 **事件图表** 的空区域。**上下文菜单** 有一个 **搜索** 栏，可用于筛选节点列表。还有一个\
  \ **上下文敏感** 复选框，它根据选定的节点筛选可能的操作。以下屏幕截图显示了 **上下文菜单** 和一些可用的事件：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_44_0.png)\n\
  \n图 2.4 – 上下文菜单中的事件\n\n您可以在 **事件图表** 面板中添加多个事件，但每个事件只能添加一次。除了虚幻引擎提供的事件外，您可以通过单击\
  \ **添加自定义事件**... 来创建自己的事件。下一张截图显示了一个 **自定义事件** 节点及其 **详细信息** 面板，您可以在其中重命名自定义事件并添加输入参数。我们将在本章后面的\
  \ *创建宏* 主题中了解参数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_45_0.png)\n\n图 2.5\
  \ – 创建自定义事件\n\n以下是一些可用的事件：\n\n- **碰撞事件**：当两个 Actor 碰撞或重叠时执行。\n- **输入事件**：由输入设备触发，例如键盘、鼠标、触摸屏和游戏手柄。\n\
  - **事件 BeginPlay**：对于关卡编辑器中已存在的 Actor，在游戏开始时执行；如果在运行时生成 Actor，则在 Actor 生成后立即执行。\n\
  - **事件 End Play**：在运行时即将移除 Actor 时执行。\n- **事件 Tick**：每帧游戏时调用。例如，如果游戏以每秒 60 帧运行，则该事件每秒将被调用\
  \ 60 次。\n\n我们将学习如何创建连接到事件的操作。\n\n### 操作\n\n触发事件时，我们使用操作来定义蓝图将如何响应该事件。您可以使用操作来获取或设置蓝图变量中的值，或调用修改蓝图状态的函数。\n\
  \n以下截图显示了蓝图的 **事件 BeginPlay** 事件。在此示例中，蓝图有一个名为 **机器人名称** 的字符串变量：\n\n- 1. **设置**\
  \ 操作将 **Archon** 值分配给 **机器人名称** 变量。\n- 2. 下一个操作 **打印字符串** 将在屏幕上显示接收到的 **输入字符串**\
  \ 引脚上的值。这些传递给函数的值称为参数。\n- 3. **输入字符串** 引脚连接到 **机器人名称** 变量的 **获取** 节点，该节点返回 **机器人名称**\
  \ 变量的值并将其传递给 **打印字符串** 函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_46_0.png)\n\
  \n图 2.6 – 带有一些操作的 **事件 BeginPlay**\n\n- 4. 要将变量的 **获取** 和 **设置** 操作添加到事件图表，只需将变量从\
  \ **我的蓝图** 面板拖动到 **事件图表** 以显示 **获取** 和 **设置** 选项。\n\n其他函数（如 **打印字符串**）从右键单击 **事件图表**\
  \ 面板时出现的 **上下文菜单** 中添加。**获取** 和 **设置** 操作也可以在 **上下文菜单** 中搜索。\n\n连接操作的白线也称为执行路径。\n\
  \n### 执行路径\n\n节点的白色引脚称为 **执行引脚**。其他彩色引脚称为 **数据引脚**。蓝图中节点的执行从红色事件节点开始，然后沿着从左到右的白线进行，直到到达最后一个节点。\n\
  \n有些节点控制蓝图的执行流程。这些节点根据条件确定执行路径。例如，**分支** 节点有两个名为 **真** 和 **假** 的输出执行引脚。将被触发的执行引脚取决于\
  \ **条件** 输入参数的布尔值。以下截图显示了 **分支** 节点的示例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_47_0.png)\n\
  \n图 2.7 – 具有两个执行路径的 **分支** 节点\n\n在此示例中，当 **事件 BeginPlay** 触发时，**分支** 节点将评估 **是否有护盾**\
  \ 布尔变量的值。如果值为 **真**，则将执行 **真** 引脚，并将值 `100.0` 设置在 **护盾值** 变量中。如果为 **假**，则将值 `0.0`\
  \ 设置在 **护盾值** 变量中。\n\n我们了解了如何使用操作修改变量的值。下一步是学习如何使用变量创建表达式。\n\n### 使用运算符创建表达式\n\n\
  运算符用于使用变量和值创建表达式。这些运算符位于 **实用程序 | 运算符** 类别的 **上下文菜单** 中。\n\n运算符的主要类型为算术运算符、关系运算符和逻辑运算符。\n\
  \n### 算术运算符\n\n算术运算符 (+, -, x, 和 /) 可用于在蓝图中创建数学表达式。以下截图显示了蓝图中的等效节点。这些运算符在左侧接收两个输入值，并在右侧给出操作结果。算术运算符可以有多个输入参数；只需单击节点上的\
  \ **添加引脚** 按钮即可添加另一个输入参数。输入值可以从数据线获取，或直接在节点中输入：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_48_0.png)\n\
  \n图 2.8 – 算术运算节点\n\n### 注意\n\n* 符号是编程语言中的乘法运算符。蓝图也将 * 识别为乘法运算符，但使用字母 X 作为乘法节点的标签。在\
  \ **上下文菜单** 中搜索乘法节点时，需要使用 * 符号或写入单词 multiply。\n\n以下截图显示了一个简单的算术表达式。截图上的数字显示了节点完成的顺序。执行从\
  \ **事件 BeginPlay** 开始。**设置** 节点为 **魔法值** 变量分配新值，但该值必须使用连接到乘法节点输出的数据线获取，而乘法节点需要使用另一条数据线获取\
  \ **意志力** 变量的值并乘以 `20.0`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_49_0.png)\n\
  \n图 2.9 – 乘法操作\n\n### 关系运算符\n\n关系运算符对两个值进行比较，并返回布尔值（**真** 或 **假**）作为比较结果。以下截图显示了蓝图中的关系运算符：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_50_0.png)\n\n图 2.10 – 关系运算节点\n\n以下截图显示了一个使用关系运算符的示例，假设当游戏对象受到伤害时执行这些操作。将使用\
  \ **分支** 节点来测试 **生命值** 变量的值是否小于或等于 `0.0`。如果返回 **真**，则将销毁此游戏对象。如果返回 **假**，则不会发生任何事情，因为\
  \ **假** 执行分支上没有连接任何操作。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_50_1.png)\n\n\
  图 2.11 – 使用关系运算符测试条件\n\n### 逻辑运算符\n\n逻辑运算符对布尔值执行操作，并返回布尔值（True 或 False）作为操作结果。以下截图显示了蓝图中的逻辑运算符：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_51_0.png)\n\n图 2.12 – 逻辑运算节点\n\n以下是这些运算符的描述：\n\
  \n- 或：如果任何输入值为 True，则返回 True。\n- 与：仅当所有输入值均为 True 时，才返回 True。\n- 非：仅接收一个输入值，结果将为相反的值。\n\
  - 或非：这是非和或运算符的组合。如果两个输入均为 False，则返回 True，否则返回值为 False。\n- 与非：这是非和与运算符的组合。如果两个输入均为\
  \ True，则返回 False，否则返回值为 True。\n- 异或：此运算符称为异或或“独占或”。如果两个输入不同（一个为 True，另一个为 False），则返回\
  \ True。如果两个输入相同，则返回值为 False。\n\n以下截图显示了使用 与 运算符的示例。打印字符串 节点仅在 生命值 大于\n\n\n大于 70.0\
  \ 且护盾值大于 50.0：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_52_0.png)\n\n图 2.13 –\
  \ 使用 AND 运算符测试条件\n\n我们已经知道如何使用操作和运算符；下一步是学习如何将它们组织在宏和函数中。\n\n### 使用宏和函数组织脚本\n\n\
  在创建 Blueprint 脚本时，有时一组操作会在 Blueprint 中的多个位置使用。这些操作可以转换为宏或函数，简化初始脚本，因为这组操作将被仅一个节点取代。另外，如果需要更改此组操作中的某项，该更改只会在宏或函数中实现，而不必在每个使用过这组操作的位置进行搜索。这是一种良好的编程实践，因为它简化了代码和调试。\n\
  \n### 创建宏\n\n要创建宏，请使用 My Blueprint 面板，并在 MACROS 类别中单击 + 按钮。以下截图显示了带有名为 SetupNewWave\
  \ 的宏的 My Blueprint 面板：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_53_0.png)\n\n\
