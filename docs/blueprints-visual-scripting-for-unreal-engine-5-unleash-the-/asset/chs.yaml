  \n### 图 7.21 – 目标追踪器使用根据内容调整大小属性\n\n- 8. 将一个 **文本** 对象拖到 **目标追踪器** 上。在 **详细信息**\
  \ 面板中，将名称更改为 `Targets label`。将 **内容** 类别下的 **文本** 字段更改为 `Targets Eliminated:`（包括冒号）。\n\
  \n- 9. 我们将增加目标追踪器的文本对象使用的字体大小，以便在屏幕上突出显示。在 **外观** 类别中，将字体大小更改为 32：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_231_0.png)\n\
  \n### 图 7.22 – 更改字体大小\n\n- 10. 将另一个文本对象拖到目标追踪器上。在 **详细信息** 面板中，将名称更改为 `target_count`。将\
  \ **内容** 类别下的 **文本** 字段更改为 `0` 并将字体大小设置为 32。目标追踪器将如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_232_0.png)\n\
  \n### 图 7.23 – 顶部中央锚定的目标追踪器\n\n- 11. 编译、保存并关闭 HUD 部件蓝图。\n\n当 UI 元素按我们想要的方式排列后，我们现在需要确保游戏实际上知道如何显示\
  \ HUD。为此，我们需要重新查看角色蓝图。\n\n### 显示 HUD\n\n要在游戏中显示 HUD，请按照以下步骤操作：\n\n- 1. 在内容浏览器中，访问\
  \ /Content/FirstPersonBP/Blueprints 文件夹并双击 FirstPersonCharacter 蓝图。\n\n- 2. 我们将修改\
  \ **事件开始游戏**。在事件图表中查找事件有一种简单的方法。查找 **我的蓝图** 面板中的 **图表** 类别，然后双击 **事件开始游戏**。编辑器将移动到事件图表中\
  \ **事件开始游戏** 已放置的位置：\n\n### 我的蓝图\n\n### 图表\n\n### 事件图表\n\n- 输入动作 Jump\n- 输入轴 Turn\n\
  - 输入轴 LookUp\n- 输入轴 MoveForward\n- 输入轴 MoveRight\n- 输入触摸\n- 输入动作 Fire\n- 输入轴 TurnRate\n\
  - 输入轴 LookUpRate\n- **事件开始游戏**\n- 输入动作 ResetVR\n- 输入动作 Sprint\n- 输入动作 Zoom\n\n###\
  \ 图 7.24 – FirstPersonCharacter 的事件\n\n- 3. 删除之前连接到 **事件开始游戏** 的节点，因为它们处理在 VR 中游玩游戏的情况，而我们不会在此示例游戏中使用\
  \ VR。\n\n### 重要信息\n\n在大多数情况下，一旦游戏开始，**事件开始游戏** 就会调用随后的操作。如果在游戏开始时蓝图实例不存在，则它将在实例生成时触发。由于\
  \ `FirstPersonCharacter` 玩家实例在游戏开始时即存在，因此将显示逻辑附加到此事件会立即创建 HUD。\n\n- 4. 从 **事件开始游戏**\
  \ 的输出执行引脚拖出一条线，并添加一个 Create Widget 节点。在节点中，您会看到一个标记为 Class 的下拉菜单。这是我们使用已创建的部件蓝图的机会。请回顾，我们将部件蓝图命名为\
  \ HUD。如果单击下拉菜单，您将看到 HUD 选项。选择它，以便玩家角色蓝图生成您创建的 UI 元素。以下截图显示与我们的 HUD 部件蓝图关联的 Create\
  \ HUD Widget 节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_234_0.png)\n\n### 图\
  \ 7.25 – 基于 HUD 部件蓝图创建实例\n\n\n\n\n\n- 5. 虽然游戏启动时我们现在已经有一个生成的 Widget，但要使包含我们 UI 元素的\
  \ Widget 出现在屏幕上，仍需要完成最后一步。将 **返回值** 输出引脚拖入空白网格区域并添加一个 **添加到视口** 节点。\n\n- 6. 在三个节点周围创建一个注释。将注释标记为\
  \ `Draw HUD on Screen`。节点应显示如下：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_235_0.png)\n\
  \n图 7.26 – 添加到视口节点在屏幕上显示 Widget Blueprint\n\n- 7. 现在，编译、保存，然后单击 **开始游戏** 以测试游戏。\n\
  \n我们已学习如何在 UMG 编辑器中创建文本元素和进度条。我们还学习了如何使用容器（例如水平和垂直框）来组织屏幕上的 UI 元素。\n\n玩游戏时，您应该能看到两个表示玩家生命值和耐力的计量表，以及弹药和已消灭目标的数值计数器。但是，当您从枪支射击时，可能会注意到一个非常重要的问题——UI\
  \ 数值没有任何变化！我们将在下一节中解决这个缺失的组件。\n\n### 将 UI 数值连接到玩家变量\n\n为了让 UI 元素能够从玩家变量中获取数据，我们需要重新打开\
  \ HUD Widget Blueprint。为了使 UI 随玩家数据更新，我们将创建一个 **绑定**。绑定使我们能够将 Blueprint 的变量或函数关联到\
  \ Widget。每当变量或函数更新时，该更改会自动反映在 Widget 中。\n\n因此，无需在玩家受到伤害时每次都手动更新玩家的生命值数据和我们的 Widget（以便生命值表显示发生变化），我们可以将计量表绑定到\
  \ `PlayerHealth` 玩家变量。这样，只需更新一个值即可。\n\n### 为生命值和耐力创建绑定\n\n要创建 `PlayerHealth` 和 `PlayerStamina`\
  \ 变量与进度条 UI 的绑定，请执行以下步骤：\n\n- 1. 在内容浏览器中，访问 `/Content/FirstPersonBP/UI` 文件夹并双击 **HUD**\
  \ Widget Blueprint。\n\n- 2. 在 **HUD** UMG 编辑器中，找到 **层级** 面板，然后单击嵌套在 **玩家属性条** 对象下方的\
  \ **生命值条** 对象。\n\n- 3. 在选中 **生命值条** 后，在 **详细信息** 面板的 **进度** 类别中找到 **百分比** 字段。单击\
  \ **百分比** 旁边的 **绑定** 按钮并选择 **创建绑定**，如下屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_236_0.png)\n\
  \n图 7.27 – 为生命值条创建绑定\n\n- 4. UMG 编辑器将从 **设计器** 视图切换到 **图表** 视图。已创建一个新函数，允许我们在计量表和\
  \ `PlayerHealth` 变量之间编写连接。在图表中任何空白处右键单击并添加 **获取玩家角色** 节点。\n\n- 5. 从新节点的 **返回值**\
  \ 输出引脚拖动一根线到空白处，并添加 **转换为第一人称角色** 节点。\n\n- 6. 断开 **获取生命值条百分比 0** 和 **返回节点** 节点之间的执行引脚连接，改为将\
  \ **获取生命值条百分比 0** 连接到我们的转换节点，如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_237_0.png)\n\
  \n图 7.28 – 获取 FirstPersonCharacter 实例的引用\n\n- 7. 接下来，从 **作为第一人称角色** 输出引脚拖动一根线到空白网格区域，并添加\
  \ **获取玩家生命值** 节点。最后，将 **转换为第一人称角色** 节点的执行引脚连接到 **返回节点**，如下屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_237_1.png)\n\
  \n图 7.29 – 玩家生命值变量的值将用作生命值条的百分比\n\n- 8. 将 **玩家生命值** 连接到 **生命值条** UI 所需的步骤就这些。我们需要对玩家的耐力执行相同的操作。单击屏幕右上角标记为\
  \ **设计器** 的按钮以返回到 **画布** 视图：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_238_0.png)\n\
  \n图 7.30 – 更改 UMG 编辑器模式的按钮\n\n- 9. 在 **层级** 面板中选择 **耐力条**。按照之前为 **生命值条** 概述的步骤，创建一个将\
  \ **玩家耐力** 变量连接到计量表的绑定：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_238_1.png)\n\
  \n图 7.31 – 玩家耐力变量的值将用作耐力条的百分比\n\n- 10. 编译并保存您的工作。\n\n下一步是将弹药和目标计数器的绑定连接起来。\n\n###\
  \ 为弹药和已消灭目标计数器创建文本绑定\n\n弹药和已消灭目标计数器将由 HUD 上的文本表示。按照以下步骤绑定计数器：\n\n- 1. 单击 **设计器**\
  \ 按钮再次返回到画布界面。这一次，我们要在 **层级** 中选择 **武器属性** 下方的 **剩余弹药** 文本对象。\n\n- 2. 在 **详细信息**\
  \ 面板中，找到 **文本** 字段旁边的 **绑定** 按钮并创建一个新绑定，如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_239_0.png)\n\
  \n图 7.32 – 为剩余弹药创建绑定\n\n- 3. 我们将对该绑定遵循与生命值和耐力相同的模式。在出现的 **获取剩余弹药文本 0** 图表视图中，创建\
  \ **获取玩家角色** 节点，使用 **转换为第一人称角色** 节点进行转换，然后从 **作为第一人称角色** 引脚拖动以添加 **获取玩家当前弹药** 节点。\n\
  \n- 4. 最后，将转换节点和 **玩家当前弹药** 节点都附加到 **返回节点**。您会注意到，当将 **玩家当前弹药** 输出引脚附加到 **返回值**\
  \ 输入引脚时，会自动创建并链接一个新的 **ToText（整数）** 节点。\n\n这是因为虚幻引擎知道，要在屏幕上以文本形式显示数值，首先需要将数字转换为\
  \ Widget 知道如何显示的文本格式。转换节点已自动连接，因此无需进行进一步修改。以下屏幕截图显示了绑定中使用的节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_240_0.png)\n\
  \n图 7.33 – 玩家当前弹药变量的值将用作剩余弹药的文本\n\n- 5. 要创建的最后一个绑定是用于目标计数。返回到设计器视图，在层级中选择目标跟踪器下的目标计数对象。单击详细信息面板中文本字段旁边的绑定按钮。按照前面的步骤，创建获取玩家角色、将其转换为转换为第一人称角色节点，并将已消灭目标变量连接到转换节点和返回节点的蓝图节点。与弹药计数一样，会自动为您生成并连接一个用于转换的\
  \ ToText (integer) 节点。结果应如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_240_1.png)\n\
  \n图 7.34 – 已消灭目标变量的值将用作目标计数的文本\n\n我们现在已成功将所有 UI 元素绑定到玩家变量。现在是编译并保存工作的好时机。由于我们的绑定，UI\
  \ 现在将执行响应游戏中发生的事件的任务。但是，我们仍需创建将触发我们已连接变量更改的事件。在下一节中，我们将根据玩家在游戏中执行的操作来修改玩家变量。\n\n\
  ## 跟踪弹药和已消灭目标\n\n为了使 UI 能够响应玩家与环境的交互，我们需要修改玩家和目标蓝图。让我们先从弹药计数器开始，当玩家从枪支开火时使其减少。\n\
  \n### 减少弹药计数器\n\n我们需要修改玩家开火逻辑，以便在玩家开枪时减少弹药计数器。请执行以下步骤：\n\n- 1. 在内容浏览器中，访问 /Content/FirstPersonBP/Blueprints\
  \ 文件夹并双击 FirstPersonCharacter 蓝图。\n\n- 2. 在生成投射物注释块中查找包含的蓝图节点的大系列。我们希望确保跟踪玩家当前弹药数的计数器在玩家每次开火时减少一。为此所需的蓝图脚本如下：\n\
  \n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_242_0.png)\n\nFigure 7.35 – Decreasing\
  \ Player Current Ammo\n\n- 3. Find the final node in the chain, **Play Sound at\
  \ Location**. Drag a wire from the output execution pin of this node to empty grid\
  \ space and add a **SET Player Current Ammo** node.\n- 4. Drag a wire from the **Player\
  \ Current Ammo** input pin to empty space and create a **Subtract** node.\n- 5.\
  \ Drag a wire from the top input pin of the **Subtract** node and add a **GET Player\
  \ Current Ammo** node.\n- 6. In the bottom field of the **Subtract** node, enter\
  \ a value of `1`. This sequence translates to the following: _after playing the\
  \ firing sound, set the player's current ammo count to the existing ammo count minus\
  \ one._\n- 7. Compile, save, and press **Play** to see your ammo counter decrease\
  \ every time you fire a shot from your gun. Note that we are not preventing the\
  \ player from shooting when they are out of ammo, and the ammo counter will continue\
  \ to register negative numbers. We will fix it in _Chapter 8, Creating Constraints\
  \ and Gameplay Objectives_.\n\n### Important Note\n\nThe **SET Player Current Ammo**\
  \ node and the subtract node of the previous screenshot can be replaced by the **Decrement\
  \ Int** node, which subtracts `1` from the input variable and sets a new value in\
  \ it. There is also the **Increment Int** node, which adds `1` to the input variable.\n\
  \n### Increasing the targets eliminated counter\n\nNow, we want to increase our\
  \ targets eliminated counter by `1` every time a target Cylinder is destroyed. These\
  \ are the steps:\n\n- 1. In the Content Browser, access the `/Content/FirstPersonBP/Blueprints`\
  \ folder and double-click on the `BP_CylinderTarget` Blueprint.\n- 2. We will add\
  \ our new nodes close to the end of **Event Hit**, after all the nodes except **DestroyActor**.\
  \ There must not be other nodes after a **DestroyActor** node whose **Target** is\
  \ **self** because this node removes the current instance from the Level.\n- 3.\
  \ Break the link between the **Spawn Emitter at Location** and **DestroyActor**\
  \ nodes, and then move **DestroyActor** to the right to make room for the new Blueprint\
  \ nodes.\n- 4. The goal is to create a series of nodes that will access the **Targets\
  \ Eliminated** variable from the player character and increase it by one, before\
  \ going on to destroy the Actor. The result will look like this:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_243_0.png)\n\
  \nFigure 7.36 — Increasing Targets Eliminated\n\n- 5. Right-click on any empty graph\
  \ space and add a **Get Player Character** node.\n- 6. Drag a wire from the **Return\
  \ Value** output pin of the **Get Player Character** node and add the **Cast To\
  \ FirstPersonCharacter** node.\n- 7. Drag a wire from the **As First Person Character**\
  \ pin and add a **GET Targets Eliminated** node.\n- 8. Drag a wire from the output\
  \ of **Targets Eliminated** and add the **Increment Int** node, which will add 1\
  \ to the **Targets Eliminated** variable.\n- 9. Finally, connect the execution pins\
  \ of the **Cast To FirstPersonCharacter**, **Increment Int**, and **DestroyActor**\
  \ nodes, ensuring that **DestroyActor** is the final node in the chain.\n- 10. Compile,\
  \ save, and play the game to see the **Targets Eliminated** counter on the screen\
  \ increase every time you destroy a Cylinder target:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_244_0.png)\n\
  \nFigure 7.37 – Destroying the Cylinder target to increase the Targets Eliminated\
  \ counter\n\nNow, the ammo and targets eliminated counters are being modified by\
  \ events that occur within our game, and the updated values are displayed immediately\
  \ in the HUD. The script to modify the health and stamina meters will be implemented\
  \ in the next chapters.\n\n### Summary\n\nIn this chapter, we enhanced the player\
  \ experience by adding a HUD that tracks the player's interaction with the environment.\
  \ In doing so, we developed another conduit through which we can communicate information\
  \ to the player of our game. We now have the skeletal structure of a first-person\
  \ shooter, including guns that shoot, targets that explode, and a UI that exposes\
  \ the state of the world to the player. We have already come a long way from the\
  \ initial test scene, which featured minimal player interaction.\n\nIn the next\
  \ chapter, we will begin transitioning from building the foundation of our game\
  \ structure to constructing the design of our game. The core of any game is made\
  \ up of the rules that the player must follow to create a fun experience. While\
  \ the game, in its current form, features some basic rules that define how the targets\
  \ react to being shot, the overall experience lacks a goal for the player to achieve.\
  \ We will rectify this by establishing a `win` condition for the player, as well\
  \ as providing additional constraints that make the experience holistic and consistent.\n\
  \n### Quiz\n\n- 1. What is the name of the specialized type of Blueprint used to\
  \ create a UI?\n  - a. UMG Blueprint\n  - b. Widget Blueprint\n\n- 2. The `Percent`\
  \ property determines the fill position of a progress bar.\n  - a. True\n  - b.\
  \ False\n\n- 3. The X and Y values of an element's position in a canvas are always\
  \ relative to the top-left corner of the screen.\n  - a. True\n  - b. False\n\n\
  - 4. We can bind a property of a Widget to a function to retrieve the updated value\
  \ of a variable.\n  - a. True\n  - b. False\n\n- 5. To create an instance of a Widget\
  \ Blueprint and show it on the screen, you need to use the `Create Widget` and `Add\
  \ to Viewport` nodes.\n  - a. True\n  - b. False\n"
- "## Chapter 8: Creating Constraints and Gameplay Objectives\n\nIn this chapter,\
  \ we'll define a ruleset for our game, which will guide the player through the gameplay\
  \ experience. We want to give the player the ability to start the game and immediately\
  \ identify what they must do to win the game. In its most basic form, a game could\
  \ be defined by the win condition and the steps the player can take to reach that\
  \ win condition. Ideally, we want to ensure that each step the player takes toward\
  \ that goal is fun.\n\nWe'll begin by applying some constraints to the player to\
  \ increase the level of difficulty. A game without a challenge quickly becomes boring,\
  \ and we want to ensure that every mechanic in our game provides the player with\
  \ an interesting choice or challenge. We'll then set up a goal for the player to\
  \ achieve, along with the necessary adjustments to our enemy targets to make that\
  \ goal challenging to reach.\n\nIn this process, we'll work to accomplish the following:\n\
  \n- Reducing stamina while the player is sprinting and regenerating it when the\
  \ player is not sprinting\n- Preventing the player's gun from firing if they run\
  \ out of ammo\n- Creating ammo pickups that allow the player to regain ammo\n- Defining\
  \ a win condition based on the number of targets eliminated\n- Creating a menu that\
  \ allows the player to replay or quit the game upon winning\n\nBy the end of the\
  \ chapter, we will have a game with constraints and goals that make the gameplay\
  \ more interesting. We will learn how to create collectible objects and how to create\
  \ a menu system.\n\n### Constraining player actions\n\nOne important consideration\
  \ to make when adding enhanced capabilities for the player is the impact that they\
  \ have on both the challenge and feel of the game experience. Recall that we added\
  \ the ability for the player to sprint in Chapter 6, Enhancing Player Abilities,\
  \ by holding down the Shift key. As it currently stands, holding down the Shift\
  \ key while moving provides a significant increase in the speed at which the player\
  \ can move. Without constraints applied to this ability, such as an enforced waiting\
  \ period between uses, there would be nothing discouraging the player from always\
  \ holding down the Shift key as they move.\n\nThis goes against the goal we set\
  \ out to accomplish by adding a sprint functionality, which was to provide more\
  \ options to the player. If an option is so attractive that the player feels compelled\
  \ to always utilize it, then it doesn't increase the number of interesting choices\
  \ available to the player. From the player's perspective, the result would be the\
  \ same if we just increased the base speed of the player to the sprint speed.\n\n\
  We can rectify this, and other issues currently faced by our game prototype, by\
  \ adding constraints that limit a player's abilities, to increase decision making.\n\
  \n### Draining and regenerating stamina\n\nTo add a constraint to the sprinting\
  \ ability of the player, we'll need to return to the player character Blueprint\
  \ where we originally defined the ability. We need to create some variables that\
  \ will keep track of whether the player is sprinting, how much stamina sprinting\
  \ should cost, and the stamina recharge rate. We are going to create a custom event\
  \ to drain the player's stamina at a consistent rate while they are sprinting and\
  \ to recharge the stamina when they are not sprinting. Also, we will create other\
  \ variables and macros to organize the script.\n\nThese are the variables that we\
  \ will create:\n\n\n\n| 变量 | 类型 |\n|---|---|\n| IsSprinting | 布尔型 |\n| StaminaManagerName\
  \ | 字符串 |\n| SprintCost | 浮点型 |\n| StaminaRechargeRate | 浮点型 |\n| StaminaDrainAndRechargeTime\
  \ | 浮点型 |\n| SprintSpeed | 浮点型 |\n| WalkSpeed | 浮点型 |\n\n图 8.1 – 用于耐力系统的变量\n\n我们将创建以下宏来组织耐力系统：\n\
  \n- 宏\n- StartSprinting\n- StopSprinting\n- ManageStaminaDrain\n- ManageStaminaRecharge\n\
  \n图 8.2 – 用于耐力系统的宏\n\n### 创建变量\n\n按照以下步骤创建新耐力系统所需的变量：\n\n- 1. 在 **内容浏览器** 中，访问 `/Content/FirstPersonBP/Blueprints`\
  \ 文件夹并双击 `FirstPersonCharacter` 蓝图。\n\n- 2. 在 **我的蓝图** 面板的 **变量** 类别中，单击 + 按钮添加变量。在\
  \ **详情** 面板中，将变量命名为 `IsSprinting`，并将 **变量类型** 更改为 **布尔值**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_250_0.png)\n\
  \n图 8.3 – IsSprinting 布尔变量\n\n- 3. 在我的蓝图面板中创建另一个变量。在详情面板中，将变量命名为 StaminaManagerName，并将变量类型更改为字符串。编译蓝图，并将默认值设置为\
  \ ManageStamina。此变量存储耐力自定义事件的名称，我们将在启动和停止计时器时使用它。创建此变量是为了避免因手动输入名称时可能出现的拼写错误而导致的错误：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_251_0.png)\n\n图 8.4 – StaminaManagerName\
  \ 字符串变量\n\n- 4. 现在我们开始创建 **浮点型** 变量。在 **我的蓝图** 面板的 **变量** 类别中，单击 + 按钮添加变量。在 **详情**\
  \ 面板中，将变量命名为 `SprintCost`，并将 **变量类型** 更改为 **浮点型**。编译蓝图，并将 **默认值** 设置为 `0.05`：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_252_0.png)\n\n图 8.5 – SprintCost 浮点型变量\n\
  \n- 5. 再次执行相同步骤，创建第二个名为 StaminaRechargeRate 的浮点型变量。编译蓝图，并将默认值设置为 0.01。\n- 6. 创建另一个名为\
  \ StaminaDrainAndRechargeTime 的浮点型变量。编译蓝图，并将默认值设置为 0.2。\n- 7. 创建另一个名为 SprintSpeed\
  \ 的浮点型变量。编译蓝图，并将默认值设置为 2200。\n- 8. 创建另一个名为 WalkSpeed 的浮点型变量。编译蓝图，并将默认值设置为 600。我们创建\
  \ SprintSpeed 和 WalkSpeed 变量，以便可以在一个位置修改速度值，而无需在脚本中查找使用这些值的各个位置。\n\n### 创建 StopSprinting\
  \ 宏\n\n现在，让我们创建第一个宏。我们将从最简单的宏开始：`StopSprinting`。\n\n创建宏的步骤如下：\n\n- 1. 在 **我的蓝图**\
  \ 面板的 **宏** 类别中，单击 + 按钮创建宏。将宏的名称更改为 `StopSprinting`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_253_0.png)\n\
  \n图 8.6 – 创建宏\n\n- 2. 默认情况下，宏没有执行引脚。我们需要将其作为参数添加。使用宏的 **详情** 面板创建一个名为 `In` 的 **Exec**\
  \ 类型输入参数，以及一个名为 `Out` 的 **Exec** 类型输出参数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_254_0.png)\n\
  \n图 8.7 – 在宏中添加执行引脚\n\n- 3. 在为 **StopSprinting** 宏创建的选项卡上，添加以下截图中显示的节点。它只需将 **Is\
  \ Sprinting** 设置为 `false`，并将 **Max Walk Speed** 恢复为 **Walk Speed** 变量中存储的值：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_254_1.png)\n\n图 8.8 – StopSprinting 宏\n\
  \n- 4. 从 **Inputs** 节点的 **In** 引脚拖出一条线，并添加 **SET Is Sprinting** 节点。保持 **Is Sprinting**\
  \ 输入参数未勾选。\n\n- 5. 在 **组件** 面板中单击 **Character Movement** 组件，并将其拖动到 **事件图表** 上：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_255_0.png)\n\n图 8.9 – 将 Character Movement\
  \ 组件拖动到事件图表\n\n- 6. 从 **Character Movement** 节点的输出引脚拖出一条线，并添加 **SET Max Walk Speed**\
  \ 节点。\n\n- 7. 从 **SET Max Walk Speed** 的输入引脚拖出一条线，并添加 **GET Walk Speed** 节点。\n\n\
  - 8. 连接 **SET Is Sprinting**、**SET Max Walk Speed** 和 **Outputs** 节点的白色执行引脚。编译蓝图。\n\
  \n### 创建 StartSprinting 宏\n\n`StartSprinting` 宏包含设置冲刺所需的操作。\n\n按照以下步骤创建宏：\n\n- 1.\
  \ 在 **我的蓝图** 面板的 **宏** 类别中，单击 + 按钮。将宏的名称更改为 `StartSprinting`。\n\n- 2. 在宏的 **详情**\
  \ 面板中，创建一个名为 `In` 的 **Exec** 类型输入参数，以及一个名为 `Out` 的 **Exec** 类型输出参数，如图 8.7 所示。\n\n\
  - 3. 在为 **StartSprinting** 宏创建的选项卡上，添加以下截图中显示的节点。**StartSprinting** 宏的前半部分几乎与 **StopSprinting**\
  \ 相同，只是数值适当不同。**Branch** 节点检查我们是否已经有 **Stamina Manager** 计时器在运行。如果有，宏执行完毕，我们可以退出。如果计时器尚不存在，我们将设置它：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_256_0.png)\n\n图 8.10 – StartSprinting\
  \ 宏\n\n- 4. 从 **Inputs** 节点的 **In** 引脚拖出一条线，并添加 **SET Is Sprinting** 节点。勾选 **Is\
  \ Sprinting** 输入参数。\n\n- 5. 在 **组件** 面板中单击 **Character Movement** 组件，并将其拖动到 **事件图表**\
  \ 上。\n\n- 6. 从 **Character Movement** 节点的输出引脚拖出一条线，并添加 **SET Max Walk Speed** 节点。\n\
  \n- 7. 从 **SET Max Walk Speed** 节点的输入引脚拖出一条线，并添加 **GET Sprint Speed** 节点。\n\n- 8.\
  \ 连接 **SET Is Sprinting** 和 **SET Max Walk Speed** 节点的白色执行引脚。\n\n- 9. 从 **SET Max\
  \ Walk Speed** 节点的白色输出引脚拖出一条线，并添加 **Branch** 节点。\n\n- 10. 从 **Branch** 节点的 **True**\
  \ 输出引脚拖出一条线，并将其连接到 **Outputs** 节点的 **Out** 引脚。\n\n- 11. 从 **Branch** 节点的 Condition\
  \ 输入引脚拖出一条线，并添加 **Does Timer Exist by Function Name** 节点。\n\n- 12. 从 **Does Timer\
  \ Exist by Function Name** 节点的 Function Name 引脚拖出一条线，并添加 **GET Stamina Manager Name**\
  \ 节点。\n\n- 13. 从 **Branch** 节点的 **False** 输出引脚拖出一条线，并添加 **Set Timer by Function\
  \ Name** 节点。将 **Set Timer by Function Name** 节点的白色输出引脚连接到 **Outputs** 节点的 **Out**\
  \ 引脚。\n\n- 14. 从 **GET Stamina Manager Name** 拖出一条线，并将其连接到 **Set Timer by Function\
  \ Name** 节点的 Function Name 引脚。\n\n- 15. 从 **Set Timer by Function Name** 节点的 Time\
  \ 引脚拖出一条线，并添加 **GET Stamina Drain and Recharge Time** 节点。\n\n- 16. 勾选 **Set Timer\
  \ by Function Name** 节点的 Looping 输入参数。由于 Stamina Drain and Recharge Time 变量的值为 0.2，此计时器将每秒调用五次该函数/事件。编译蓝图。\n\
  \n### 创建 ManageStaminaDrain 宏\n\nManageStaminaDrain 宏会消耗玩家耐力，并检查停止冲刺的条件。\n\n创建宏的步骤如下：\n\
  \n- 1. 在我的蓝图面板的宏类别中，单击 + 按钮创建另一个宏。将宏的名称更改为 ManageStaminaDrain。\n\n- 2. 在宏的详情面板中，创建一个名为\
  \ In 的 Exec 类型输入参数，以及一个名为 Out 的 Exec 类型输出参数，如图 8.7 所示。\n\n- 3. 在为 ManageStaminaDrain\
  \ 宏创建的选项卡上，添加以下截图中显示的节点。有两个条件用于\n\n\n\nthe player to keep sprinting and draining\
  \ stamina: the player needs to be moving and **Player Stamina** must be greater\
  \ than zero.\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_258_0.png)\n\nFigure 8.11\
  \ – The ManageStaminaDrain macro\n\n- 4. Drag a wire from the **In** pin of the\
  \ **Inputs** node and add a **Branch** node.\n- 5. Drag a wire from the **Condition**\
  \ input pin of the **Branch** node and add an **AND** Boolean node.\n- 6. Drag a\
  \ wire from the top input pin of the **AND** node and add a **Greater** node.\n\
  - 7. Right-click on the empty space of **Event Graph** and add a **Get Velocity**\
  \ node.\n- 8. Drag a wire from the **Return Value** pin of the **Get Velocity**\
  \ node and add a **VectorLengthSquared** node. If the return value of the **VectorLengthSquared**\
  \ node is greater than zero, then the player is moving. As in our case, we only\
  \ want to know if the velocity is greater than zero, we use **VectorLengthSquared**\
  \ instead of **VectorLength** to avoid a square root.\n\n- 9. Drag a wire from the\
  \ Return Value pin of the VectorLengthSquared node and connect it to the top input\
  \ pin of the Greater node.\n- 10. Drag a wire from the bottom input pin of the AND\
  \ node and add a Greater node.\n- 11. Drag a wire from the top input pin of the\
  \ Greater node and add a Get Player Stamina node.\n- 12. Drag a wire from the True\
  \ output pin of the Branch node and add a Set Player Stamina node. Connect the white\
  \ output pin of the Set Player Stamina node to the Out pin of the Outputs node.\n\
  - 13. Drag a wire from the input pin of Set Player Stamina and add a Max (float)\
  \ node. This node returns the highest value of the input parameters. We use this\
  \ node to ensure that Player Stamina will never be less than 0.0.\n- 14. Drag a\
  \ wire from the top input pin of the Max (float) node and create a Subtract node.\n\
  - 15. Drag a wire from the top input pin of the Subtract node and add a Get Player\
  \ Stamina node.\n- 16. Drag a wire from the bottom input pin of the Subtract node\
  \ and add a Get Sprint Cost node.\n- 17. Drag a wire from the False output pin of\
  \ the Branch node and add the Stop Sprinting macro node. Connect the white output\
  \ pin of the Stop Sprinting node to the Out pin of the Outputs node.\n\n### Creating\
  \ the ManageStaminaRecharge macro\n\nThe ManageStaminaRecharge macro recharges Player\
  \ Stamina until it is full.\n\nFollow these steps to create the macro:\n\n- 1. In\
  \ the **My Blueprint** panel, click the + button in the **MACROS** category to create\
  \ another macro. Change the name of the macro to `ManageStaminaRecharge`.\n- 2.\
  \ In the **Details** panel of the macro, create an input parameter named `In` of\
  \ the **Exec** type and an output parameter named `Out` of the **Exec** type as\
  \ shown in *Figure 8.7*.\n- 3. On the tab created for the **ManageStaminaRecharge**\
  \ macro, add the nodes seen in the following screenshot. If **Player Stamina** is\
  \ full (nearly equal to `1.0`), we clear the timer for **Stamina Manager**. If **Player\
  \ Stamina** isn't full, we increment it.\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_260_0.png)\n\
  \nFigure 8.12 – The ManageStaminaRecharge macro\n\n- 4. Drag a wire from the **In**\
  \ pin of the **Inputs** node and add a **Branch** node.\n- 5. Drag a wire from the\
  \ **Condition** input pin of the **Branch** node and add a **Nearly Equal (float)**\
  \ node. Enter the value `1.0` in the **B** input parameter of the **Nearly Equal\
  \ (float)** node. We are using the **Nearly Equal (float)** node because it has\
  \ an **Error Tolerance** property that is needed to compare values with floating-point\
  \ precision.\n- 6. Drag a wire from the **A** input parameter of the **Nearly Equal\
  \ (float)** node and add a Get Player Stamina node.\n- 7. Drag a wire from the True\
  \ output pin of the Branch node and add a Clear Timer by Function Name node.\n-\
  \ 8. Drag a wire from the Function Name parameter of Clear Timer by Function Name\
  \ and add a Get Stamina Manager Name node.\n- 9. Connect the white output pin of\
  \ Clear Timer by Function Name to the Out pin of the Outputs node.\n- 10. Drag a\
  \ wire from the False output pin of the Branch node and add a Set Player Stamina\
  \ node. Connect the white output pin of Set Player Stamina to the Out pin of the\
  \ Outputs node.\n- 11. Drag a wire from the input pin of Set Player Stamina and\
  \ add a Min (float) node. Enter the value 1.0 in the second input parameter of the\
  \ Min (float) node. This node returns the lowest value of the input parameters.\
  \ We use this node to ensure that Player Stamina will never be greater than 1.0.\n\
  - 12. Drag a wire from the top input pin of the Min (float) node and create an Add\
  \ node.\n- 13. Drag a wire from the top input pin of the Add node and add a Get\
  \ Player Stamina node.\n- 14. Drag a wire from the bottom input pin of the Add node\
  \ and add a Get Stamina Recharge Rate node.\n\n### Updating the InputAction Sprint\
  \ event\n\nWe need to modify the InputAction Sprint event to use the new stamina\
  \ system.\n\nFollow these steps:\n\n- 1. Look in the GRAPHS category of the My Blueprint\
  \ panel and double-click on InputAction Sprint. The editor will move to the position\
  \ in Event Graph where InputAction Sprint is already placed:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_262_0.png)\n\
  \nFigure 8.13 – Finding the InputAction Sprint event\n\n- 2. Delete the previous\
  \ nodes that were connected to **InputAction Sprint**. We will add the nodes seen\
  \ in the following screenshot. When the *Shift* key is pressed, the game checks\
  \ whether there is enough stamina to begin sprinting, that is, whether the current\
  \ **PlayerStamina** amount is greater than or equal to **SprintCost**. If the player\
  \ has enough stamina to start sprinting, the **Start Sprinting** macro is called.\
  \ When the *Shift* key is released, the **Stop Sprinting** macro is called.\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_263_0.png)\n\nFigure 8.14 – The new version\
  \ of the InputAction Sprint event\n\n- 3. Drag a wire from the **Pressed** output\
  \ pin of the **InputAction Sprint** node and add a **Branch** node.\n- 4. Drag a\
  \ wire from the **Condition** input pin of the **Branch** node and add an **OR**\
  \ Boolean node.\n- 5. Drag a wire from the top input pin of the **OR** node and\
  \ add a **Greater** node. We cannot use the **Greater Equal** node because we need\
  \ to use the **Nearly Equal (float)** node to verify that the two **Float** variables\
  \ are equal.\n- 6. Drag a wire from the top input pin of the **Greater** node and\
  \ add a Get Player Stamina node.\n- 7. Drag a wire from the bottom input pin of\
  \ the **Greater** node and add a Get Sprint Cost node.\n- 8. Drag a wire from the\
  \ bottom input pin of the **OR** node and add a **Nearly Equal (float)** node.\n\
  - 1. Drag a wire from the A input pin of the Nearly Equal (float) node and add a\
  \ Get Player Stamina node.\n- 2. Drag a wire from the B input pin of the Nearly\
  \ Equal (float) node and add a Get Sprint Cost node.\n- 3. Drag a wire from the\
  \ True output pin of the Branch node and add the Start Sprinting macro node.\n-\
  \ 4. Drag a wire from the Released output pin of the InputAction Sprint node and\
  \ add the Stop Sprinting macro node.\n- 5. Change the label of the comment box to\
  \ Inputs to start and stop sprinting.\n\n### Creating the ManageStamina custom event\n\
  \nWe will now create the custom ManageStamina event, which checks whether the player\
  \ is sprinting and calls the appropriate macro to drain or recharge the stamina.\n\
  \nThese are the steps to create the custom event:\n\n- 1. Right-click on the empty\
  \ space of Event Graph. Search for custom event and select Add Custom Event... Rename\
  \ the custom event to ManageStamina.\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_264_0.png)\n\
  \nFigure 8.15 – Adding a custom event\n\n- 2. Add the nodes shown in the following\
  \ screenshot. This checks whether the player is sprinting and calls the appropriate\
  \ macro:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_265_0.png)\n\nFigure 8.16 –\
  \ The ManageStamina custom event\n\nCompile, save, and test the game. As you sprint\
  \ around the level, you should see your stamina meter running out if you're holding\
  \ the left Shift key, and the stamina recharging when it's not held down and the\
  \ player is walking or at rest.\n\nWe've completed the actions needed to manage\
  \ stamina and sprinting, and our next step is to implement a constraint related\
  \ to the player's ammunition.\n\n### Preventing firing actions when out of ammo\n\
  \nFor the next constraint that we'll place on the player's abilities, we need to\
  \ restrict the player from firing their gun when they reach an ammo count of 0.\
  \ We will add a Branch node right after the InputAction Fire event:\n\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_266_0.png)\n\
  \n图 8.17 – 测试玩家是否有弹药\n\n要执行此操作，请执行以下步骤：\n\n- 1. 在 **我的蓝图** 面板的 **图表** 类别中，双击 **输入动作\
  \ 开火** 事件，移动到 **事件图** 中已放置 **输入动作 开火** 的位置。\n- 2. 从 **输入动作 开火** 的 **按下** 引脚拖动并释放到空白处以打开\
  \ **上下文菜单**。添加一个 **分支** 节点。**分支** 节点将自动连接到 **输入动作 开火** 和链中的下一个节点。\n- 3. 从 **分支**\
  \ 节点的 **条件** 输入引脚拖出一根线到空白处并添加 **大于** 节点。\n- 4. 从 **大于** 节点的顶部输入引脚拖出一根线并添加 **获取玩家当前弹药**\
  \ 节点。将 **大于** 节点的底部输入字段保留为默认值 0。\n\n现在，编译、保存并测试您的游戏。您应该发现，当弹药计数器达到 0 时，枪不再发射。\n\n\
  我们已完成玩家限制，现在需要一个新蓝图为玩家提供弹药。\n\n### 创建可收集对象\n\n限制玩家在弹药耗尽时开枪，迫使玩家考虑其在游戏中尝试射击的准确性。然而，如果没有获取更多弹药的方式，限制弹药将过于苛刻。我们不希望弹药像体力值一样自然充能。相反，我们将创建一个可收集的弹药拾取物，以允许玩家通过探索和穿越关卡来恢复弹药。\n\
  \n要创建 BP_AmmoPickup 蓝图，请执行以下步骤：\n\n- 1. 在内容浏览器中，访问 /Content/FirstPersonBP/Blueprints\
  \ 文件夹。单击添加按钮并选择蓝图类。\n- 2. 在下一个屏幕上，选择 **角色** 作为父类。\n- 3. 将蓝图命名为 BP_AmmoPickup 并双击它以打开蓝图编辑器。\n\
  - 4. 在组件面板中单击添加按钮并选择静态网格组件。在详细信息面板中，选择 Shape_Pipe 静态网格，并在材质中，转到元素 0 并选择 M_Door。将比例属性的\
  \ X、Y 和 Z 值更改为 0.5，如以下屏幕截图所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_268_0.png)\n\
  \n图 8.18 – 设置静态网格\n\n- 5. 将 **静态网格** 的碰撞预设更改为 **重叠全部动态**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_269_0.png)\n\
  \n图 8.19 – 设置碰撞预设\n\n### 重要说明\n\n在制作游戏原型时，利用现成的资源而不是花时间从头创建每个资源通常是非常有用的。这使您能够将时间和精力集中在确定哪些机制能带来最佳游戏体验上，而不是花时间创建可能在机制从设计中移除后被丢弃的美术资源。\n\
  \n- 6. 我们将创建 `AmmoPickupCount` 变量来存储玩家收集弹药拾取物时将获得的弹药量。在 **我的蓝图** 面板的 **变量** 类别中，单击\
  \ + 按钮添加变量。在 **详细信息** 面板中，将其命名为 `AmmoPickupCount`，将 **变量类型** 更改为 **整数**，并检查 **实例可编辑**\
  \ 属性：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_270_0.png)\n\n图 8.20 – AmmoPickupCount\
  \ 变量\n\n- 7. 编译蓝图，然后将 AmmoPickupCount 默认值设置为 15。\n- 8. 我们将使用 BP_AmmoPickup 的事件 ActorBeginOverlap\
  \ 来检查是否是玩家（第一人称角色）正在重叠 BP_AmmoPickup 的实例，并增加玩家当前弹药值。我们将使用以下节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_270_1.png)\n\
  \n图 8.21 – 增加玩家弹药\n\n- 9. 在事件图的空白处右键单击并添加事件 ActorBeginOverlap。\n- 10. 从 **事件 ActorBeginOverlap**\
  \ 节点的 **其他角色** 输出引脚拖出一根线并添加 **转换为第一人称角色** 节点。\n- 11. 从 **作为第一人称角色** 引脚拖出一根线并添加 **设置玩家当前弹药**\
  \ 节点。\n- 12. 从 **作为第一人称角色** 引脚拖出另一根线并添加 **获取玩家当前弹药** 节点。\n- 13. 从 **获取玩家当前弹药** 输出引脚拖出一根线到空白处并创建\
  \ **添加** 节点。\n- 14. 从 **添加** 节点的底部输入引脚拖出一根线并添加 **获取弹药拾取数量** 节点。\n- 15. 将 **添加**\
  \ 节点的输出引脚连接到 **设置玩家当前弹药** 节点的输入引脚。\n- 16. 以前的步骤完成了 *图 8.21* 中显示的节点。接下来，当可收集物被拾取时，让我们播放声音并销毁实例，如以下屏幕截图所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_271_0.png)\n\n图 8.22 – 播放声音并销毁实例\n\n\
  - 17. 从 **设置玩家当前弹药** 节点的白色输出引脚拖出一根线到空白处并添加 **在位置播放声音** 节点。\n- 18. 对于我们的原型，我们将使用来自\
  \ **引擎内容** 的声音波形。单击 **声音** 下拉菜单，然后单击齿轮图标以访问 **视图** 选项。检查 **显示引擎内容** 选项，并从列表中选择 **编译成功**\
  \ 声音波形：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_272_0.png)\n\n图 8.23 – 在资产列表中显示引擎内容\n\
  \n- 19. 从 **位置** 输入引脚拖出一根线到空白处并添加 **获取 Actor 位置** 节点。\n- 20. 从 **在位置播放声音** 节点的白色输出引脚拖出一根线到空白处并添加\
  \ **销毁 Actor** 节点，以确保每个可收集物只能被拾取一次。\n- 21. 编译并保存 **BP_AmmoPickup** 蓝图。\n- 22. 现在，返回关卡编辑器，将\
  \ **BP_AmmoPickup** 蓝图从 **内容浏览器** 拖到关卡中以创建实例。在关卡周围的不同位置添加更多实例，以在区域中散布弹药拾取物。保存关卡并单击\
  \ **播放** 以测试游戏。您应该发现，每次踩到弹药拾取物时，弹药计数器都会增加。\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_273_0.png)\n\
  \n图 8.24 – 收集弹药拾取物以增加弹药计数器\n\n我们已了解如何为拾取物创建蓝图，以便在收集时修改玩家状态。我们需要执行的最后几个步骤之一是创建玩家获胜的条件。我们将在下一部分中介绍此内容。\n\
  \n### 设置游戏玩法胜利条件\n\n我们将修改 **抬头显示** 蓝图和玩家角色蓝图，以考虑玩家必须努力达到的目标目标。我们将在抬头显示中将目标目标显示在目标计数旁边，以便玩家可以轻松查看需要摧毁多少个目标才能达到目标。\n\
  \n我们还将创建另一个表示胜利菜单屏幕的小部件蓝图，当玩家达到目标时将向其显示该屏幕。最后，我们将实现检查玩家是否获胜并显示胜利菜单屏幕所需的逻辑。\n\n###\
  \ 在抬头显示中显示目标目标\n\n首先，我们需要在 **第一人称角色** 蓝图中创建一个变量，以确定我们要求玩家摧毁多少个目标才能赢得游戏。然后，我们需要在\
  \ **抬头显示** 蓝图中向玩家显示此信息。\n\n按照以下步骤显示目标目标：\n\n- 1. 在内容浏览器中，访问 /Content/FirstPersonBP/Blueprints\
  \ 文件夹并双击 **第一人称角色** 蓝图。\n- 2. 在 **我的蓝图** 面板的 **变量** 类别中，单击 + 号添加变量，将其命名为 **目标目标**，并将\
  \ **变量类型** 更改为 **整数**。\n- 3. 编译 **第一人称角色** 蓝图，暂时将 **默认值** 设置为 2：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_274_0.png)\n\
  \n\n\n\n\n\n### 图 8.25 – TargetGoal 整数变量\n\n- 4. 编译、保存并关闭蓝图编辑器。\n\n- 5. 在内容浏览器中，访问\
  \ /Content/FirstPersonBP/UI 文件夹，然后双击 HUD 蓝图以打开 UMG 编辑器。我们将按照以下截图所示，向 Goal Tracker\
  \ 添加两个文本对象：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_275_0.png)\n\n### 图 8.26\
  \ – 带有新元素的 HUD Goal Tracker\n\n- 6. 在设计器视图中，从调色板面板拖动一个文本对象到层级面板中的 Goal Tracker 对象。\n\
  \n- 7. 在详情面板中，将名称更改为 Slash。将 Content 类别下的 Text 字段更改为 /（包括斜杠前后的空格），并将字体大小设置为 32。\n\
  \n- 8. 将另一个文本对象拖动到 Goal Tracker 上。在详情面板中，将名称更改为 Target goal。将 Content 类别下的 Text\
  \ 字段更改为 0，并将字体大小设置为 32。新的 Goal Tracker 将如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_276_0.png)\n\
  \n### 图 8.27 – Goal Tracker 显示目标计数和目标目标\n\n- 9. 现在我们需要将 HUD 的 `Target goal` 绑定到\
  \ **FirstPersonCharacter** 蓝图的 `TargetGoal` 变量。在 **详情** 面板中，找到 **Text** 字段旁边的 **Bind**\
  \ 按钮并创建新绑定，如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_276_1.png)\n\n### 图\
  \ 8.28 – 为 Target goal 创建绑定\n\n- 10. 我们将遵循与在 _第 7 章，创建屏幕 UI 元素_ 中创建的其他 HUD 绑定相同的模式来处理此绑定。添加一个\
  \ **获取玩家角色** 节点，使用 **转换为 FirstPersonCharacter** 节点进行转换，然后从 **作为第一人称角色** 引脚拖动以添加\
  \ **获取目标目标** 节点。最后，将 **转换为** 节点和 **目标目标** 节点都附加到 **返回节点**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_276_2.png)\n\
  \n### 图 8.29 – Target Goal 变量的值将显示在 HUD 上\n\n- 11. 编译、保存并运行游戏。\n\n您应该会看到，随着目标被销毁，目标计数会递增。目标计数右侧显示的\
  \ Target Goal 不会改变。现在，我们需要确保当玩家达到目标目标时获得反馈。\n\n### 创建胜利菜单屏幕\n\n为了在玩家赢得游戏时提供反馈，我们将创建一个\
  \ **WinMenu** 屏幕，该屏幕将在销毁所需数量的目标时出现。要创建此 **WinMenu**，我们需要另一个蓝图小部件，就像我们为 HUD 创建的那个一样：\n\
  \n- 1. 在 **内容浏览器** 中，访问 `/Content/FirstPersonBP/UI` 文件夹，然后在空文件夹空间上右键单击。转到 **用户界面\
  \ | 小部件蓝图** 并将生成的蓝图命名为 `WinMenu`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_277_0.png)\n\
  \n### 图 8.30 – 创建小部件蓝图\n\n- 2. 双击此蓝图以打开 UMG 编辑器。我们将为这个菜单屏幕设置三个元素。第一个将是一个简单的 `text`\
  \ 对象，它会向玩家广播 `You Win!`。其他两个元素将是按钮，允许玩家重新启动游戏或退出游戏：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_278_0.png)\n\
  \n### 图 8.31 – WinMenu 小部件蓝图的元素\n\n- 3. 将 **调色板** 面板中的文本对象拖动到 **层级** 面板中的 **CanvasPanel**\
  \ 对象上。在 **详情** 面板中，将名称更改为 `Win msg`，单击 **锚点** 下拉菜单，并选择屏幕中心带有锚点的选项：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_279_0.png)\n\
  \n### 图 8.32 – 此对象的锚点位于屏幕中心\n\n- 4. 将位置 X 设置为 -190.0，位置 Y 设置为 -250.0。检查“根据内容调整大小”属性，因此我们无需调整尺寸\
  \ X 和 尺寸 Y 的值：\n\n| 属性 | 值 |\n| :--- | :--- |\n| SLOT (画布面板槽位) | |\n| 锚点 | 锚点 v\
  \ |\n| 位置 X | -190.0 |\n| 位置 Y | -250.0 |\n| 尺寸 X | 100.0 |\n| 尺寸 Y | 30.0 |\n|\
  \ 对齐方式 | 0.0 0.0 |\n| 根据内容调整大小 | [x] |\n| ZOrder | 0 |\n\n### 图 8.33 – 对象的位置相对于其锚点\n\
  \n- 5. 将 CONTENT 类别下的 Text 字段更改为你赢了！。在 APPEARANCE 类别中，将字体大小设置为 72，并在 颜色和不透明度 中，单击彩色矩形以打开颜色选择器并选择任意绿色：\n\
  \n| 类别 | 设置 |\n| :--- | :--- |\n| CONTENT | |\n| 文本 | 你赢了！ |\n| APPEARANCE | |\n\
  | 颜色和不透明度 | [绿色方块] |\n| 字体 | |\n| 字体系列 | Roboto |\n| 字型 | 粗体 |\n| 尺寸 | 72 |\n\n\
  ### 图 8.34 – 设置文本、颜色和字体大小\n\n- 6. 从调色板面板拖动一个按钮对象到层级面板中的 CanvasPanel 对象上。在详情面板中，将名称更改为\
  \ Btn restart，单击锚点下拉菜单，并选择屏幕中心带有锚点的选项。\n\n- 7. 将位置 X 设置为 -180.0，位置 Y 设置为 -50.0，尺寸\
  \ X 设置为 360.0，尺寸 Y 设置为 100.0：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_281_0.png)\n\
  \n### 图 8.35 – 设置按钮的位置和尺寸\n\n- 8. 从调色板面板拖动一个文本对象到层级面板中的 Btn restart 对象上。在详情面板中，将名称设置为\
  \ Txt restart，将 Content 类别下的 Text 字段更改为 重新开始，并将字体大小设置为 48。\n\n- 9. 从调色板面板拖动另一个按钮对象到层级面板中的\
  \ CanvasPanel 对象上。在详情面板中，将名称更改为 Btn quit，单击锚点下拉菜单，并选择屏幕中心带有锚点的选项。\n\n- 10. 将位置 X\
  \ 设置为 -180.0，位置 Y 设置为 150.0，尺寸 X 设置为 360.0，尺寸 Y 设置为 100.0。\n\n- 11. 从调色板面板拖动一个文本对象到层级面板中的\
  \ Btn quit 对象上。在详情面板中，将名称设置为 Txt quit，将 Content 类别下的 Text 字段更改为 退出，并将字体大小设置为 48。\n\
  \nWinMenu 小部件蓝图在 UMG 编辑器中应如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_282_0.png)\n\
  \n### 图 8.36 – WinMenu 元素\n\n- 12. 现在，我们需要添加在按下重新开始按钮时执行的操作。单击 Btn restart 对象，向下滚动到详情面板底部，然后单击\
  \ On Clicked 事件旁边的 + 按钮。这将添加一个在单击按钮时触发的事件：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_283_0.png)\n\
  \n### 图 8.37 – 添加按钮事件\n\n- 13. 将进入 图表 视图，其中将出现 On Clicked (Btn restart) 节点。从 On\
  \ Clicked (Btn restart) 节点的输出引脚拖动到 图表 上，并添加一个 Open Level (by Object Reference) 节点。在\
  \ Level 参数中，选择我们正在使用的关卡，即 FirstPersonExampleMap。当玩家单击按钮时，该节点将重新加载关卡，重置关卡的所有方面，包括目标、弹药收藏品和玩家。\n\
  \n- 14. 从 Open Level (by Object Reference) 节点的输出引脚拖动到 图表 上，并添加一个 Remove from Parent\
  \ 节点。此节点将从视图中移除 WinMenu 小部件。我们希望在关卡重置后菜单消失：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_283_1.png)\n\
  \n### 图 8.38 – 重新开始按钮的操作\n\n- 15. 我们将为 **退出** 按钮执行类似步骤。返回到 **设计器** 视图并单击 **Btn quit**\
  \ 对象，向下滚动到 **详情** 面板底部，然后单击 **On Clicked** 事件旁边的 + 按钮以添加事件。\n\n- 16. 将进入 **图表**\
  \ 视图，其中将出现 **On Clicked (Btn quit)** 节点。从 **On Clicked (Btn quit)** 节点的输出引脚拖动到 **图表**\
  \ 上，并添加一个 **Quit Game** 节点，以便玩家可以通过单击 **退出** 按钮关闭游戏：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_284_0.png)\n\
  \n### 图 8.39 – 退出按钮的操作\n\n- 17. 编译、保存并关闭 UMG 编辑器。\n\n现在我们已经创建了 **WinMenu**，需要告诉游戏何时向玩家显示它。\n\
  \n### 显示 WinMenu\n\n与我们对 **HUD** 小部件蓝图所做的一样，我们将从 **FirstPersonCharacter** 蓝图内部显示\
  \ **WinMenu**。我们将创建一个名为 **结束游戏** 的自定义事件，该事件将在游戏结束时调用。\n\n按照以下步骤操作：\n\n\n\n1. 在 **内容浏览器**\
  \ 中，访问 `/Content/FirstPersonBP/Blueprints` 文件夹并双击 `FirstPersonCharacter` 蓝图。\n\n\
  2. 右键单击 **事件图表** 并添加自定义事件。将其重命名为 `End Game`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_285_0.png)\n\
  \n图 8.40 – 添加自定义事件\n\n3. 从 **结束游戏** 的输出执行引脚拖出一根线，添加 **设置游戏暂停** 节点，并选中 **暂停** 复选框。当玩家在\
  \ **胜利菜单** 中选择选项时，此节点将暂停游戏：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_285_1.png)\n\
  \n图 8.41 – 暂停游戏\n\n4. 右键单击 **事件图表** 并添加 **获取玩家控制器** 节点。从 **返回值** 输出引脚拖出一根线并添加 **设置显示鼠标光标**\
  \ 节点。选中 **显示鼠标光标** 旁边的复选框，并将此节点附加到 **设置游戏暂停** 的输出执行引脚。这样，游戏暂停后玩家就可以重新控制鼠标光标了：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_286_0.png)\n\n图 8.42 – 显示鼠标光标\n\n5. 从 **设置显示鼠标光标**\
  \ 节点的输出执行引脚拖出一根线并添加创建小部件节点。在类参数中，选择胜利菜单。\n\n6. 从创建小部件节点的返回值输出引脚拖出一根线并添加添加到视口节点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_286_1.png)\n\n图 8.43 – 创建并显示胜利菜单\n\n\
  7. 在结束游戏事件的节点周围创建注释。将注释标记为 End Game: Shows Win Menu。编译并保存蓝图。\n\n最后一步是确定将触发结束游戏自定义事件的条件。\n\
  \n### 触发胜利\n\n我们希望当玩家销毁足够数量的圆柱体目标以达到目标数量时，结束游戏 事件发生。我们将在 **第一人称角色** 蓝图中创建一个名为 **检查目标**\
  \ 的自定义事件，每当销毁一个目标时，BP_CylinderTarget 都会调用该事件。\n\n我们将创建的 **检查目标** 自定义事件的操作如下：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_287_0.png)\n\n图 8.44 – 检查是否已达成目标\n\n为此，请执行以下步骤：\n\
  \n- 1. 右键单击 **第一人称角色** 蓝图的事件图表并添加自定义事件。将其重命名为 `CheckGoal`。\n- 2. 从 **检查目标** 节点的白色输出引脚拖出一根线到空网格区域并添加\
  \ **分支** 节点。\n- 3. 从 **分支** 节点的 **条件** 输入引脚拖出一根线到空白区域并添加 **大于等于** 节点。\n- 4. 从 **大于等于**\
  \ 节点的顶部输入引脚拖出一根线并添加 **获取已消除目标数** 节点。\n- 5. 从 **大于等于** 节点的底部输入引脚拖出一根线并添加 **获取目标数量**\
  \ 节点。\n- 6. 从 **分支** 节点的 **真** 输出引脚拖出一根线并添加 **延迟** 节点。在 **持续时间** 参数中输入 `1.0`。此节点用于在显示\
  \ **胜利菜单** 前等待 1 秒。\n- 7. 从 **延迟** 节点的 **完成** 输出引脚拖出一根线并添加 **结束游戏** 节点。此节点将调用我们创建的\
  \ **结束游戏** 自定义事件以显示 **胜利菜单**。\n- 8. 编译、保存并关闭蓝图编辑器。\n\n现在，我们将修改 **BP_CylinderTarget**，以便在每次销毁目标时调用\
  \ **检查目标** 事件：\n\n- 1. 在 **内容浏览器** 中，访问 `/Content/FirstPersonBP/Blueprints` 文件夹并双击\
  \ **BP_CylinderTarget** 蓝图。\n- 2. 将 **事件图表** 移至 **事件命中** 操作的末尾。将 **销毁角色** 节点向右拖动，为另一个节点腾出空间。\n\
  - 3. 从 **强制转换** 节点的 **作为第一人称角色** 输出引脚拖出一根线并添加 **检查目标** 节点。将 `++` 节点的白色输出引脚连接到 **检查目标**\
  \ 节点的白色输入引脚，并将 **检查目标** 节点的输出引脚连接到 **销毁角色** 节点的白色输入引脚：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_288_0.png)\n\
  \n图 8.45 – 调用检查目标事件\n\n- 4. 编译、保存并运行游戏。如果所有蓝图都设置正确，那么当你销毁第二个目标时，应该会看到游戏暂停且 **胜利菜单**\
  \ 出现。单击 **重启** 按钮将重新加载关卡，单击 **退出** 将关闭会话：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_289_0.png)\n\
  \n图 8.46 – 在游戏中显示胜利菜单\n\n我们为玩家创建了一个目标数量，并创建了一个 **胜利菜单** 小部件蓝图，当玩家达成目标时会显示该小部件。**胜利菜单**\
  \ 在玩家完成游戏时提供反馈和一些可供选择的选项。\n\n### 总结\n\n在本章中，我们通过对玩家能力添加限制并为玩家设定目标，增强了游戏体验。在此过程中，你学习了如何使用计时器重复操作、如何在游戏世界中创建可收集物体，以及如何创建菜单系统。\n\
  \n本章结束了 *第 2 部分*。构成视频游戏体验基础的元素已存在于我们构建的游戏中。如果你愿意，可以复制项目，增加目标数量，并花些时间自定义关卡布局，以创建独一无二的、适当具有挑战性的游戏体验。\n\
  \n在 *第 3 部分* 中，我们将开始探讨蓝图脚本和游戏开发的更高级主题：**人工智能（AI）**。我们还将为游戏添加新功能，并了解如何构建和发布游戏。\n\n\
  在下一章中，我们将用可以在点之间巡逻并在关卡中追踪玩家的智能敌人取代我们的圆柱体目标。\n\n### 测验\n\n- 1. 应该避免使用宏，因为它们会使脚本变得混乱。\n\
  \  \n  - a. 正确\n  - b. 错误\n\n- 2. 可以使用计时器作为事件刻度的替代方案，因为可以为操作设置较低的重复率。\n  \n  - a.\
  \ 正确\n  - b. 错误\n\n- 3. 在我们的示例游戏中，可以为关卡中 BP_AmmoPickup 的每个实例定义不同数量的弹药，因为 AmmoPickupCount\
  \ 变量被设置为 **实例可编辑**。\n  \n  - a. 正确\n  - b. 错误\n\n- 4. 同一时间只能向视口添加一个小部件蓝图。\n  \n\
  \  - a. 正确\n  - b. 错误\n\n- 5. 小部件蓝图可以带有在单击时触发事件的按钮。\n  \n  - a. 正确\n  - b. 错误\n"
- '# 第 3 部分：增强游戏


  在本部分中，你将学习使用行为树和导航网格创建智能敌人所需的基本 **人工智能（AI）** 技术。此外，还将向游戏添加新功能，使其更加有趣。我们还将演示如何构建和发布游戏。


  本部分包括以下章节：


  - 第 9 章，使用人工智能构建智能敌人

  - 第 10 章，升级 AI 敌人

  - 第 11 章，游戏状态和最后润色

  - 第 12 章，构建和发布

  '
- "## 第 9 章：使用人工智能构建智能敌人\n\n在本章中，我们将通过制作对玩家构成威胁的敌人，为我们的游戏玩法增加另一个挑战。为此，我们将放弃圆柱体目标，改用具有\
  \ AI 行为的敌人。我们希望设置具有潜在威胁、能够分析周围世界以做出决策的敌人。为了实现这一目标，我们将学习虚拟引擎内置的处理 AI 行为的工具，以及这些工具如何与我们的蓝图脚本交互。在此过程中，我们将涵盖以下主题：\n\
  \n- 设置敌方角色以进行导航\n- 创建导航行为\n- 让 AI 追逐玩家\n\n本章结束时，我们将能够创建一个处理关卡中敌人导航的行为树，并在敌人处于视线范围内时让它们追逐玩家。\n\
  \n### 设置敌方角色以进行导航\n\n到目前为止，我们的目标一直由基本圆柱体几何体表示。这非常适合制作非响应式目标，仅作为玩家的瞄准挑战。但是，一个会四处移动并对玩家构成威胁的敌人需要可识别的外观，至少要向玩家指示其移动方向。幸运的是，Epic\
  \ 为虚拟引擎创建了一个免费可用的资产包，我们可以使用它将人形模型添加到我们的游戏中——这非常适合我们的新敌人类型。\n\n\n\n\n在以下部分中，我们将学习如何从\
  \ Marketplace 导入资产包、扩展游玩区域、使用导航网格，以及创建敌人使用的 AI 资产。\n\n### 从 Marketplace 导入\n\n首先，我们将走出\
  \ Unreal Engine 编辑器，专注于 Epic Games 启动器。\n\n按照以下步骤从 Marketplace 导入免费资产包：\n\n- 1.\
  \ 打开 Epic Games 启动器，然后单击窗口左侧的 Unreal Engine 部分。\n- 2. 单击顶部的 **市场** 选项卡，并搜索 `animation\
  \ starter pack`。\n- 3. 单击 **动画入门包** 的 **添加到购物车** 按钮：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_294_0.png)\n\
  \n图 9.1 – Unreal Engine 市场\n\n- 4. 单击位于右上角的 **购物车** 图标。\n- 5. 在 **购物车** 面板中单击 **结账**\
  \ 按钮。\n- 6. 面板关闭后，单击 **动画入门包** 的图片以打开资产页面。\n- 7. 单击 **添加到项目** 按钮，然后选择你一直用来构建游戏的项目。名为\
  \ `AnimStarterPack` 的文件夹将添加到项目的 `Content` 文件夹中。\n\n**动画入门包** 包含我们用来表示敌人所需的资产。现在，我们需要为玩家和敌人提供更大的游玩区域。\n\
  \n### 扩展游玩区域\n\n为我们的智能敌人追逐玩家提供有趣的环境，我们需要对默认第一人称示例地图布局进行一些更改。现有布局虽然适合射击目标，但对玩家来说太拥挤，无法躲避追赶他们的敌人。\n\
  \n为快速为游戏增添一些多样性，我们将把游玩区域扩大至早先的两倍宽度。我们还将创建一个可通过斜坡供玩家和敌人进入的高台区域。以下截图显示了新的关卡布局：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_295_0.png)\n\n图 9.2 – 新的关卡布局\n\n按照以下步骤修改关卡布局：\n\
  \n- 1. 在 Unreal 编辑器中打开项目。\n- 2. 移除 **第一人称模板** 标签。同时，从关卡中移除所有 **BP_圆柱体目标** 实例。你可以通过单击视口中的实例或在世界大纲中查找它们来进行选择。\n\
  - 3. 单击 **地板** 将其选中。按住 **Alt** 键，单击并拖动 Y 轴箭头以复制 **地板**。沿 Y 轴移动 **地板** 副本，直到游玩区域宽度变为原来的两倍：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_296_0.png)\n\n图 9.3 – 按住 Alt 键并单击拖动以复制\
  \ 地板 网格\n\n- 4. 我们需要缩放 **光照重要性体积** 和 **后处理体积** 以覆盖新的游玩区域。这些体积用于光照和效果：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_297_0.png)\n\
  \n图 9.4 – 这些体积必须覆盖游玩区域\n\n- 5. 在 **世界大纲** 面板中，单击 **光照重要性体积**。然后，在 **详情** 面板中，单击\
  \ **缩放** 属性的 **锁定** 图标将其解锁，并将 **缩放** 的 *Y 轴*（绿色）值设置为 `2.0`。\n- 6. 接下来，在关卡编辑器中，沿\
  \ *Y 轴* 移动 **光照重要性体积**，直到其覆盖游玩区域：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_298_0.png)\n\
  \n图 9.5 – 增加 光照重要性体积 的 Y 轴缩放\n\n- 7. 在世界大纲面板中，单击 PostProcessVolume，然后在详情面板中，将 Scale\
  \ 的 Y 轴（绿色）值设置为 44.0。完成后，转到关卡编辑器，沿 Y 轴移动 PostProcessVolume，直到其覆盖游玩区域：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_299_0.png)\n\
  \n图 9.6 – 增加 PostProcessVolume 的 Y 轴缩放\n\n- 8. 在关卡编辑器中，单击位于游玩区域中央的名为 **Wall3** 的墙体。在\
  \ **详情** 面板中，将 **位置** 的 Y 轴（绿色）值设置为 5945.0。\n- 9. 接下来，单击名为 **Wall1** 的墙体。按住 *Alt*\
  \ 键并单击拖动 Y 箭头以复制墙体。在 **详情** 面板中，将 **位置** 的 Y 轴（绿色）值设置为 4000.0。\n- 10. 然后，单击名为 **Wall2**\
  \ 的墙体。按住 *Alt* 键并单击拖动 Y 箭头以复制墙体。在 **详情** 面板中，将 **位置** 的 Y 轴（绿色）值设置为 4000.0。以下截图显示了当前的游玩区域外观：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_300_0.png)\n\n图 9.7 – 现在游玩区域宽度已加倍\n\n\
  - 11. 单击名为 **BigWall2** 的墙体部分。按住 *Alt* 键并单击拖动 *Y* 箭头以复制墙体。在 **详情** 面板中，将 **位置**\
  \ 的 *Y 轴（绿色）* 值设置为 `5295.0`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_300_1.png)\n\
  \n图 9.8 – 复制 BigWall2 并向右移动\n\n- 12. 我们将变换 **BigWall2** 以在游玩区域中央创建一个更大的墙体。单击 **BigWall2**\
  \ 将其选中。在 **详情** 面板中，将 **位置** 设置为 \\(X = -280\\)、\\(Y = 2000\\) 和 \\(Z = 322\\)，将\
  \ **缩放** 设置为 \\(X = 30\\)、\\(Y = 4\\) 和 \\(Z = 3\\)：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_301_0.png)\n\
  \n图 9.9 – 修改 BigWall2 的变换\n\n- 13. 现在，我们将添加一个斜坡以进入高台区域。在内容浏览器中，访问 `Content/StarterContent/Shapes`\
  \ 文件夹。拖动 `Shape_Wedge_B` 资产并将其放入关卡。在 **详情** 面板中，将 **位置** 设置为 \\(X = -1630\\)、\\\
  (Y = 2500\\) 和 \\(Z = 170\\)，**旋转** 设置为 \\(X = 0\\)、\\(Y = 0\\) 和 \\(Z = 90\\)，**缩放**\
  \ 设置为 \\(X = 6\\)、\\(Y = 3\\) 和 \\(Z = 3\\)：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_302_0.png)\n\
  \n图 9.10 – 使用 *Shape_Wedge_B* 创建斜坡\n\n- 14. 在 **材质** 下，将 **元素 0** 从 *Shape_Wedge_B*\
  \ 更改为灰色 **CubeMaterial** 材质：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_303_0.png)\n\
  \n图 9.11 – 更改 Shape_Wedge_B 材质\n\n- 15. 我们将创建另一个斜坡以进入高台区域。单击关卡中的 Shape_Wedge_B 实例。按住\
  \ Alt 键并单击拖动 X 箭头以复制斜坡。在详情面板中，将 Location 设置为 X= 1070、Y= 1500 和 Z= 170，Rotation 设置为\
  \ X= 0、Y= 0 和 Z= -90：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_303_1.png)\n\n\
  图 9.12 – 更改第二个斜坡的位置和旋转\n\n我们的高台区域应该如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_304_0.png)\n\
  \n图 9.13 – 高台区域可通过斜坡进入\n\n- 16. 抓取关卡一侧的一些白色箱子，并将其分布到另一侧。\n- 17. 在关卡中添加更多 BP_AmmoPickup\
  \ 实例。\n\n我们已创建一个在玩家与敌人之间提供更多动作空间的关卡布局。现在，我们将创建敌人在关卡中移动所需的 NavMesh。\n\n### 使用 NavMesh\
  \ 资产使关卡可通行\n\n为了创建允许敌人穿越关卡的 AI 行为，我们需要创建一个 AI 能够读取并用于导航的环境地图。这种地图是使用称为 **NavMesh**\
  \ 的资产创建的，它是 **导航网格** 的缩写。\n\n按照以下步骤为我们的游玩区域创建 NavMesh：\n\n- 1. 在关卡编辑器中，单击工具栏上的 **创建**\
  \ 按钮。将鼠标悬停在 **体积** 上以显示子菜单，然后单击 **导航网格体积**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_305_0.png)\n\
  \n图 9.14 – 向关卡添加 NavMesh\n\n- 2. 现在，我们需要移动并缩放 **导航网格体积** 对象，直到关卡的整个可行走空间都包含在其中。在\
  \ **详情** 面板中，将 **位置** 设置为 X = -316、Y = 2116 和 Z = 460，将 **缩放** 设置为 X = 20、Y = 44\
  \ 和 Z = 7：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_306_0.png)\n\n图 9.15 – 修改\
  \ NavMesh 的变换\n\n- 3. 按键盘上的 P 键，查看 NavMesh 是否放置正确。如果是，你会在楼层上方看到一个绿色网格，如以下截图所示：\n\
  \n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_307_0.png)\n\n图 9.16 – 按 P 键切换 NavMesh\
  \ 可见性\n\n既然游戏区域和 NavMesh 已经设置好，我们可以将注意力重新放回创建敌人及其 AI 上。\n\n### 创建 AI 资产\n\n我们需要创建四种类型的资产，它们将共同协作来管理敌人的行为：\n\
  \n- 角色：表示关卡中敌人角色的蓝图类。\n- AI 控制器：作为角色和行为树之间连接的蓝图类。它将行为树中生成的信息和操作路由到角色，角色将执行这些操作。\n\
  - 行为树：行为树是决策逻辑的来源，它将指导我们的敌人在什么条件下执行哪些操作。\n- **黑板**：黑板是 AI 控制器和行为树之间共享的所有决策所用数据的容器。\n\
  \n以下是创建这四个资产的步骤：\n\n1. 在内容浏览器中，访问 `/Content/FirstPersonBP/` 文件夹。在文件夹列表旁边的空白处右键单击，并选择\
  \ **新建文件夹** 选项。将新文件夹命名为 `Enemy`。\n\n2. 打开您创建的 `Enemy` 文件夹，然后在空文件夹空间中右键单击并选择 **蓝图类**。\n\
  \n3. 在弹出窗口底部打开 **所有类** 组，并在搜索栏中输入 `ASP_`。选择 `Ue4ASP_Character` 类以创建新的角色蓝图。这是我们在章节开始时添加到项目中的\
  \ **动画入门包** 的基础角色类：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_308_0.png)\n\n图\
  \ 9.17 – 选择 EnemyCharacter 蓝图的父类\n\n4. 将蓝图重命名为 `BP_EnemyCharacter`。\n\n5. 现在，我们将创建\
  \ **AIController** 子类。在 `Enemy` 文件夹的空白处右键单击并选择 **蓝图类**。\n\n6. 在弹出窗口底部打开 **所有类**\
  \ 组，并在搜索栏中输入 `AIController`。选择 **AIController** 类，并将生成的蓝图命名为 `BP_EnemyController`。\n\
  \n7. 要创建 **行为树** 资产，在 `Enemy` 文件夹的空白处右键单击，将鼠标悬停在 **人工智能** 上以显示子菜单，并选择 **行为树**：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_309_0.png)\n\n图 9.18 – 人工智能资产\n\n8. 将\
  \ **行为树** 资产重命名为 `BT_EnemyBehavior`。\n\n9. 最后，要创建 **黑板** 资产，在 `Enemy` 文件夹的空白处右键单击，将鼠标悬停在\
  \ **人工智能** 上以显示子菜单，并选择 **黑板**。将其命名为 `BB_EnemyBlackboard`。\n\n10. 以下屏幕截图显示了 `Enemy`\
  \ 文件夹的资产：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_310_0.png)\n\n图 9.19 – Enemy\
  \ 文件夹的资产\n\n这些是我们将用于实现敌人角色 AI 的资产。接下来，我们需要对 `BP_EnemyCharacter` 蓝图进行一些修改。\n\n###\
  \ 设置 BP_EnemyCharacter 蓝图\n\n由于我们将 `BP_EnemyCharacter` 创建为 `Ue4ASP_Character` 的子类，它继承了我们为导入的动画包创建的角色的所需网格、纹理和动画信息。我们希望保留其中一些信息，例如网格和动画。但是，我们需要确保\
  \ `BP_EnemyCharacter` 知道如何由正确的 AI 控制器控制。我们还将更改 `BP_EnemyCharacter` 的材质，并隐藏游戏中显示的胶囊体组件。\n\
  \n### 注意\n\n当您打开没有任何脚本的蓝图时，将显示一个简单的编辑器，仅用于编辑默认值。您需要单击顶部的 **打开完整蓝图编辑器** 链接才能查看通常的布局。\n\
  \n按照以下步骤进行调整：\n\n1. 打开 `BP_EnemyCharacter` 蓝图。\n\n2. 单击工具栏上的 **类默认值** 按钮：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_311_0.png)\n\
  \n图 9.20 – 访问类默认值\n\n3. 在 **详细信息** 面板中，找到 **PAWN** 类别。该类别的最后一个元素是 **AI 控制器类** 的下拉列表。将此下拉列表的选择更改为我们的新\
  \ **BP_EnemyController** 类：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_312_0.png)\n\
  \n图 9.21 – 设置 AI 控制器类\n\n4. 在 **组件** 面板中，单击 **网格 (CharacterMesh0)** (**已继承**)。然后，在\
  \ **详细信息** 面板中，找到 **材质** 类别，并将 **元素 0** 更改为我们创建的 **M_TargetRed** 材质：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_313_0.png)\n\
  \n图 9.22 – 更改网格材质\n\n5. 在 **组件** 面板中，单击 **胶囊体组件 (CollisionCylinder)** (**已继承**)。在\
  \ **详细信息** 面板中，将 **碰撞预设** 更改为 **BlockAllDynamic**，并在 **渲染** 类别中，检查 **游戏中隐藏** 属性：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_313_1.png)\n\n图 9.23 – 隐藏胶囊体组件\n\n6.\
  \ 编译蓝图并将 `BP_EnemyCharacter` 蓝图拖放到关卡中，以在我们的游戏区域中创建敌人的实例。\n\n在本节中，我们学习了如何从市场导入资产。我们扩展了关卡，并使用\
  \ NavMesh 使其可遍历。我们创建了 AI 资产，现在准备实现敌人的导航行为。\n\n### 创建导航行为\n\n我们敌人的第一个目标是让它在地图上我们创建的点之间导航。为了实现这一点，我们需要在地图上创建敌人将要导航到的点，然后我们需要设置行为，使敌人循环移动到每个点。\n\
  \n### 设置巡逻点\n\n让我们先创建 AI 要巡逻的路径。我们将使用 **球体触发器** 来表示巡逻点，因为它会生成重叠事件并且在游戏中隐藏。关卡上至少需要两个巡逻点，因为\
  \ `BP_EnemyCharacter` 的每个实例都可以在两个巡逻点之间导航。\n\n按照以下步骤创建巡逻点：\n\n1. 在关卡编辑器中，单击工具栏上的\
  \ **创建** 按钮，然后单击 **球体触发器**。将球体触发器放置在地板上的任何位置：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_315_0.png)\n\
  \n图 9.24 – 创建球体触发器\n\n2. 在 **详细信息** 面板中，将球体触发器重命名为 `PatrolPoint1`。\n\n3. 创建另一个球体触发器并将其命名为\
  \ `PatrolPoint2`。将其放置在距离第一个巡逻点较远的位置，以便两点之间的移动明显。\n\n已建立巡逻点后，我们可以继续构建敌人的智能。\n\n###\
  \ 创建黑板键\n\n黑板使用键和值来存储信息。\n`BB_EnemyBlackboard` 将有两个键，一个用于存储当前巡逻点，另一个用于存储对玩家角色的引用。此信息将由行为树引用。\n\
  \n以下是创建键的步骤：\n\n1. 从内容浏览器中打开 `BB_EnemyBlackboard`。\n\n2. 单击 **新建键**，并将 **键类型** 选择为\
  \ **对象**。\n\n3. 将此新键命名为 `CurrentPatrolPoint`。\n\n4. 单击 **键类型** 旁边的展开箭头，并使用下拉列表将\
  \ **基类** 更改为 **演员**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_316_0.png)\n\n\
  图 9.25 – 创建 CurrentPatrolPoint 键\n\n5. 现在，让我们为玩家角色创建键。单击 **新建键**，并将 **键类型** 选择为\
  \ **对象**。\n\n6. 将此新键命名为 `PlayerCharacter`。单击 **键类型** 旁边的展开箭头，并将 **基类** 更改为 **角色**：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_317_0.png)\n\n图 9.26 – 创建 PlayerCharacter\
  \ 键\n\n现在，我们需要将 **黑板** 中 **CurrentPatrolPoint** 键的值设置为关卡中的实际巡逻点。我们可以从 `BP_EnemyCharacter`\
  \ 蓝图中执行此操作。\n\n### 在 BP_EnemyCharacter 中创建变量\n\n我们将在 `BP_EnemyCharacter` 中创建变量，以存储巡逻点和黑板的键名。\n\
  \n\n\n\n\n按照以下步骤创建变量：\n\n- 1. 打开 `BP_EnemyCharacter` 蓝图。\n- 2. 在 **我的蓝图** 面板的 **变量**\
  \ 类别中，单击 + 按钮添加变量，并将其命名为 `PatrolPoint1`。\n- 3. 在 **详细信息** 面板中，单击 **变量类型** 下拉菜单并搜索\
  \ `Actor`。将鼠标悬停在 **演员** 上以显示子菜单，然后选择 **对象引用**。检查 **实例可编辑** 属性：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_318_0.png)\n\
  \n图 9.27 – 创建引用演员实例的变量\n\n- 4. 按照相同步骤创建第二个名为 `PatrolPoint2` 的 **演员** 变量。\n- 5. 创建另一个名为\
  \ `CurrentPatrolPoint` 的 **演员** 变量。这次，保持 **实例可编辑** 属性未选中。\n- 6. 这些是我们创建的变量。睁开的眼睛图标表示该变量是\
  \ **实例可编辑** 的，因此 **PatrolPoint1** 和 **PatrolPoint2** 变量的引用将在关卡编辑器中设置：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_319_0.png)\n\
  \n图 9.28 – 巡逻点变量\n\n- 7. 在 **我的蓝图** 面板中创建另一个变量。在 **详细信息** 面板中，将变量命名为 `PatrolPointKeyName`，并将\
  \ **变量类型** 更改为 **名称**。编译蓝图并将 **默认值** 设置为 `CurrentPatrolPoint`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_320_0.png)\n\
  \n图 9.29 – 此变量存储黑板键名称\n\n现在，我们可以使用这些变量更新 BB_EnemyBlackboard 上的值。\n\n### 更新当前巡逻点键\n\
  \n我们将创建一个宏来更新 BB_EnemyBlackboard 的 CurrentPatrolPoint 键，因为它将在多个位置使用。\n\n以下是创建宏的步骤：\n\
  \n- 1. 在 **我的蓝图** 面板中，单击 **宏** 类别中的 + 按钮以创建宏。将宏的名称更改为 UpdatePatrolPointBB：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_321_0.png)\n\
  \n图 9.30 – 创建宏\n\n- 2. 在宏的 **详细信息** 面板中，创建名为 `In` 的输入参数和名为 `Out` 的输出参数，两者的类型均为 **执行**：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_322_0.png)\n\n图 9.31 – 在宏中添加执行引脚\n\n\
  - 3. 在为 **UpdatePatrolPointBB** 宏创建的选项卡上，添加以下屏幕截图中所示的节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_322_1.png)\n\
  \n图 9.32 – UpdatePatrolPointBB 宏\n\n- 4. 在图表上右键单击并添加 **获取黑板** 节点。这是一个实用函数，用于查找 AI\
  \ 控制器正在使用的黑板。\n- 5. 从 **获取黑板** 节点的 **返回值** 引脚拖出一根线，并添加 **设置为对象** 节点。\n- 6. 从 **设置为对象**\
  \ 节点的 **键名称** 引脚拖出一根线，并添加 **获取巡逻点键名称** 节点。\n- 7. 从 **设置为对象** 节点的 **对象值** 引脚拖出一根线，并添加\
  \ **获取当前巡逻点** 节点。\n- 8. 连接 **输入**、**设置为对象** 和 **输出** 节点的白色执行引脚。编译蓝图。\n\n接下来，我们需要检查\
  \ `BP_EnemyCharacter` 实例何时与巡逻点重叠，以更新 `BB_EnemyBlackboard` 的 **CurrentPatrolPoint**\
  \ 键。\n\n### 与巡逻点重叠\n\n我们将使用 **Event ActorBeginOverlap** 来验证 `BP_EnemyCharacter`\
  \ 实例何时到达其两个巡逻点中的一个，然后交换实例正在移动到的巡逻点。每次更新 **CurrentPatrolPoint** 变量时，都需要调用 **UpdatePatrolPointBB**\
  \ 宏。\n\n在 **开始游戏时** 中，我们将把初始巡逻点设置为 **CurrentPatrolPoint** 并调用 **UpdatePatrolPointBB**\
  \ 宏。\n\n按照以下步骤创建事件：\n\n- 1. 在 `BP_EnemyCharacter` 的 **事件图** 中，从 **开始游戏时** 的白色执行引脚拖出一根线，并添加\
  \ **设置当前巡逻点** 节点。\n- 2. 从 **设置当前巡逻点** 节点的输入引脚拖出一根线，并添加 **获取巡逻点 1** 节点。\n- 3. 从 **设置当前巡逻点**\
  \ 节点的白色输出引脚拖出一根线，并添加 UpdatePatrolPointBB 宏节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_324_0.png)\n\
  \n图 9.33 – 设置初始巡逻点\n\n- 4. 现在，让我们创建 Event ActorBeginOverlap 事件，该事件用于交换巡逻点。该事件首先检查敌人是否与巡逻点\
  \ 1 重叠。如果为真，则该事件将巡逻点 2 设置为当前巡逻点。如果为假，则该事件检查敌人是否与巡逻点 2 重叠。在这种情况下，该事件将巡逻点 1 设置为当前巡逻点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_324_1.png)\n\n图 9.34 – 交换巡逻点\n\n- 5.\
  \ 步骤 5–8 的节点用于检查敌人是否与巡逻点 1 重叠。从 Event ActorBeginOverlap 节点的白色执行引脚拖出一根线，并添加 **分支**\
  \ 节点。\n- 6. 从 **分支** 节点的 **条件** 输入引脚拖出一根线，并添加 **相等** 节点。\n- 7. 从 **相等** 节点的顶部输入引脚拖出一根线，并添加\
  \ **获取巡逻点 1** 节点。\n- 8. 将 **相等** 节点的底部输入引脚连接到 Event ActorBeginOverlap 节点的 **其他演员**\
  \ 输出引脚。\n- 9. 步骤 9–11 的节点将 **巡逻点 2** 设置为 **当前巡逻点**。从 **分支** 节点的 **真** 输出引脚拖出一根线，并添加\
  \ **设置当前巡逻点** 节点。\n- 10. 从 **设置当前巡逻点** 节点的输入引脚拖出一根线，并添加 **获取巡逻点 2** 节点。\n- 11. 从\
  \ **设置当前巡逻点** 节点的白色输出引脚拖出一根线，并添加 **UpdatePatrolPointBB** 宏节点。\n- 12. 步骤 12–15 的节点用于检查敌人是否与\
  \ **巡逻点 2** 重叠。从 **分支** 节点的 **假** 输出引脚拖出一根线，并添加另一个 **分支** 节点。\n- 13. 从第二个 **分支**\
  \ 节点的 **条件** 输入引脚拖出一根线，并添加 **相等** 节点。\n- 14. 将 **相等** 节点的顶部输入引脚连接到 Event ActorBeginOverlap\
  \ 节点的 **其他演员** 输出引脚。\n- 15. 从 **相等** 节点的底部输入引脚拖出一根线，并添加 **获取巡逻点 2** 节点。\n- 16. 步骤\
  \ 16–18 的节点将 **巡逻点 1** 设置为 **当前巡逻点**。从第二个 **分支** 节点的 **真** 输出引脚拖出一根线，并添加 **设置当前巡逻点**\
  \ 节点。\n- 17. 从新的 **设置当前巡逻点** 节点的输入引脚拖出一根线，并添加 **获取巡逻点 1** 节点。\n- 18. 将 **设置当前巡逻点**\
  \ 节点的白色输出引脚连接到 **UpdatePatrolPointBB** 节点的输入引脚。\n- 19. 编译并保存蓝图。\n\n这些是在 `BP_EnemyCharacter`\
  \ 蓝图中处理巡逻点所需的操作。下一步是修改 `BP_EnemyController` 蓝图以运行行为树。\n\n### 在 AI 控制器中运行行为树\n\n\
  AIController 类具有一个名为 Run Behavior Tree 的函数。它将行为树资产作为参数接收。我们使用 AIController 作为父类创建了\
  \ BP_EnemyController 蓝图，以运行我们的 BT_EnemyBehavior 行为树。\n\n以下是运行行为树的步骤：\n\n- 1. 打开\
  \ BP_EnemyController 蓝图。\n- 2. 在事件图中，从 **开始游戏时** 的白色执行引脚拖出一根线，并添加 **运行行为树** 节点。\n\
  - 3. 将 BTAsset 输入参数设置为 BT_EnemyBehavior：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_326_0.png)\n\
  \n图 9.35 – 运行行为树\n\n- 4. 编译并保存蓝图。\n\n我们已完成蓝图中导航巡逻点所需的操作。现在可以进入 AI 的核心——行为树。\n\n\
  ### 使用行为树教 AI 行走\n\n行为树是用于模拟角色行为的工具。它具有控制流节点和任务节点。\n\n你将使用的两个主要控制流节点是 **选择器** 和\
  \ **序列** 宏节点。**选择器** 节点会从左到右运行其下连接的每个节点（称为其 **子节点**），但一旦某个子节点成功运行，它就会成功并停止运行。因此，如果\
  \ **选择器** 节点有三个子节点，那么第三个子节点运行的唯一方式是前两个子节点因附加条件为 `false` 而未能执行。**序列** 节点正好相反。它也会从左到右依次运行所有子节点，但\
  \ **序列** 节点只有在所有子节点都成功时才会成功。第一个失败的子节点会导致整个序列失败，结束执行并中止序列。\n\n按照以下步骤创建我们的第一个行为树：\n\
  \n- 1. 在内容浏览器中，双击 `BT_EnemyBehavior` 资产以打开行为树编辑器。\n- 2. 在 **详细信息** 面板中，单击 **行为树**\
  \ 类别并选择 **BB_EnemyBlackboard** 作为 **黑板资产**。 **BB_EnemyBlackboard** 的 **键** 下拉菜单将出现在底部的\
  \ **黑板** 面板中：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_328_0.png)\n\n图 9.36\
  \ – 选择行为树使用的黑板资产\n\n- 3. 查看 **行为** 树图。逻辑树的顶层始终是 **根节点**，它仅用于指示逻辑流的起始位置。行为树节点底部较深的线是节点之间的连接点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_329_0.png)\n\n图 9.37 – 逻辑流从根节点开始\n\n\
  - 4. 从 **根节点** 底部的深色区域点击并拖动一根线，将其放置到空白图表区域以打开选择菜单弹出窗口。选择 **序列** 选项：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_330_0.png)\n\
  \n图 9.38 – 添加序列节点\n\n- 5. 在 **详情** 面板中，将 **节点名称** 更改为 `Move to Patrol`。\n\n- 6.\
  \ 从 **移动到巡逻** 节点向下拖动一根线并添加一个 **移动到** 节点。这种节点是 **任务节点**，具有紫色，并且始终是行为树中最底部的节点。因此，你会注意到任务节点底部没有用于附加其他节点的连接点：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_331_0.png)\n\n图 9.39 – 移动到节点是任务节点\n\n\
  - 7. 在 **移动到** 任务节点的 **详情** 面板中，将 **黑板键** 更改为 **CurrentPatrolPoint**。此黑板键决定了角色将被移动到的位置：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_331_1.png)\n\n图 9.40 – 此黑板键决定了目的地\n\n\
  - 8. 从 **移动到巡逻** 序列节点向下拖动一根线并添加一个 **等待** 节点。\n\n- 9. 在 **等待** 节点的 **详情** 面板中，将 **等待时间**\
  \ 设置为 `3.0` 以在巡逻之间添加 3 秒的暂停。将 **随机偏差** 设置为 `1.0` 以添加 1 秒的变化。这将导致暂停时间在 2 到 4 秒之间随机：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_332_0.png)\n\n图 9.41 – 调整等待时间\n\n- 10.\
  \ 保存行为树。运行游戏时，行为树将执行 **移动到** 任务节点，直到敌人到达目的地。发生这种情况时，将执行 **等待** 任务节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_333_0.png)\n\
  \n图 9.42 – 我们的第一个行为树\n\n### 注意\n\n注意节点右上角带有数字的小灰色圆圈。这些圆圈指示节点的执行顺序，顺序根据从左到右、从上到下的位置排列。第一个被评估的节点将标记为\
  \ 0 徽章。\n\n现在，我们已准备好一切来测试敌人巡逻。\n\n### 在 BP_EnemyCharacter 实例中选择巡逻点\n\n我们在 `BP_EnemyCharacter`\
  \ 中将 **PatrolPoint1** 和 **PatrolPoint2** 变量创建为 **实例可编辑**，以便在关卡编辑器中设置它们。\n\n选择巡逻点的步骤如下：\n\
  \n- 1. 在关卡编辑器中，选择我们放置在关卡上的 `BP_EnemyCharacter` 实例。\n\n- 2. 在 **详情** 面板中，向下导航到 **默认**\
  \ 类别，并将 **巡逻点 1** 设置为 **PatrolPoint1** 实例，将 **巡逻点 2** 设置为 **PatrolPoint2** 实例：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_335_0.png)\n\n图 9.43 – 选择巡逻点\n\n- 3.\
  \ 保存关卡并单击播放按钮进行测试。\n\n你应该会看到红色敌人角色开始导航到两个巡逻点中的第一个。当它到达第一个点时，将短暂暂停，然后开始走向第二个巡逻点。在游戏运行期间，这种往复模式将持续进行。\n\
  \n现在我们已建立巡逻行为，将赋予敌人看到玩家并追踪他们的能力。\n\n### 让 AI 追逐玩家\n\n有一个名为 Pawn 感知的组件，可用于为敌人添加视觉和听觉。我们将使用此组件并扩展我们的行为树，使敌人对玩家构成一定威胁。\n\
  \n### 使用 Pawn 感知赋予敌人视觉\n\n为了授予敌人检测玩家的能力，我们需要将 Pawn 感知组件添加到 BP_EnemyController，并在敌人看到玩家时将\
  \ PlayerCharacter 引用存储在 BB_EnemyBlackboard 中。\n\n使用 Pawn 感知组件的步骤如下：\n\n- 1. 打开 `BP_EnemyController`\
  \ 蓝图。\n\n- 2. 在 **我的蓝图** 面板中创建一个变量。在 **详情** 面板中，将变量命名为 `PlayerKeyName`，并将 **变量类型**\
  \ 更改为 **名称**。编译蓝图并将 **默认值** 设置为 `PlayerCharacter`。\n\n- 3. 在 **组件** 面板中，单击 **添加**\
  \ 按钮并搜索 `pawn`。选择 **Pawn 感知** 组件：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_337_0.png)\n\
  \n图 9.44 – 添加 Pawn 感知组件\n\n- 4. 在 Pawn 感知组件的详情面板中，查看 **事件** 类别并单击 **看到 Pawn** 事件的绿色按钮，将其添加到事件图中：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_337_1.png)\n\n图 9.45 – 添加看到 Pawn 事件\n\
  \n- 5. **看到 Pawn** 事件在敌人沿视线看到 **Pawn** 类（或其子类 **角色**）的实例时触发。我们需要检查所看到的实例是否是玩家（**第一人称角色**\
  \ 类）。如果是玩家，则将实例引用存储在黑板中：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_338_0.png)\n\
  \n图 9.46 – 将第一人称角色引用存储在黑板中\n\n- 6. 从 **看到 Pawn** 事件的 **Pawn** 输出引脚拖动一根线并添加一个 **转换为第一人称角色**\
  \ 节点。\n\n- 7. 在图表上右键单击并添加一个 **获取黑板** 节点。\n\n- 8. 从 **获取黑板** 的 **返回值** 引脚拖动一根线并添加一个\
  \ **设置值为对象** 节点。\n\n- 9. 从 **设置值为对象** 的 **键名称** 引脚拖动一根线并添加一个 **获取玩家键名称** 节点。\n\n\
  - 10. 从 **设置值为对象** 的 **对象值** 引脚拖动一根线并连接到 **作为第一人称角色** 输出引脚。\n\n- 11. 连接 **转换为第一人称角色**\
  \ 和 **设置值为对象** 节点的白色执行引脚。编译蓝图。\n\n这些是使敌人能够看到玩家所需在 `BP_EnemyController` 蓝图中进行的更改。现在，让我们来处理我们的行为树。\n\
  \n### 创建行为树任务\n\n我们可以创建新元素以在行为树中使用，例如 **任务**、**装饰器** 和 **服务**。这些元素是专门的蓝图类型。我们将创建一个简单的任务来清除黑板键。\n\
  \n创建任务的步骤如下：\n\n- 1. 在内容浏览器中，双击 `BT_EnemyBehavior` 资产以打开行为树编辑器。\n\n- 2. 单击工具栏上的\
  \ **新建任务** 按钮：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_339_0.png)\n\n图 9.47\
  \ – 创建行为树任务\n\n- 3. 如果项目中没有任务，蓝图编辑器将打开一个新蓝图，并使用 **BTTask_BlueprintBase** 作为父类。如果已有任务，则需要在出现的下拉菜单中选择\
  \ **BTTask_BlueprintBase** 类。\n\n- 4. **详情** 面板显示类默认值。将 **节点名称** 字段更改为 `Clear BB\
  \ Value`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_340_0.png)\n\n图 9.48 – 设置节点名称\n\
  \n- 5. 在 **我的蓝图** 面板的 **变量** 类别中，单击 + 按钮添加一个变量。在 **详情** 面板中，将变量命名为 **键**，将其类型更改为\
  \ **黑板键选择器**，并检查 **实例可编辑** 属性：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_340_1.png)\n\
  \n图 9.49 – 创建键变量\n\n- 6. 我们将使用 **接收执行** 事件，该事件在任务在行为树中被激活时调用。我们将使用 **我的蓝图** 面板添加该事件以查看其他可用事件。将鼠标悬停在\
  \ **我的蓝图** 面板的 **函数** 类别上，单击 **覆盖** 下拉菜单，并选择 **接收执行**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_341_0.png)\n\
  \n图 9.50 – 添加接收执行事件\n\n- 7. 我们将使用 **键** 变量清除黑板值，并使用 **完成执行** 函数来完成任务：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_341_1.png)\n\
  \n图 9.51 – 接收执行事件的操作\n\n- 8. 从 **接收执行** 的白色输出引脚拖动一根线并添加一个 **清除黑板值** 节点。\n\n\n\n\n\
  \n- 9. 从 Clear Blackboard Value 的 Key 输入引脚拖动一根线并添加一个 Get Key 节点。\n\n- 10. 从 Clear\
  \ Blackboard Value 的白色输出引脚拖动一根线并添加一个 Finish Execute 节点。检查 Finish Execute 节点的 Success\
  \ 参数。\n\n- 11. 编译、保存并关闭蓝图编辑器。在内容浏览器中，将 BTTask 重命名为 BTTask_ClearBBValue。\n\n我们将使用新的任务在敌人攻击后清除\
  \ PlayerCharacter 引用，以给玩家一个逃跑的机会。\n\n### 为行为树添加条件\n\n我们还需要一个 Sequence 节点，用于连接任务以让敌人追击玩家，以及一个\
  \ Selector 节点，用于运行两个 Sequence 节点中的一个。我们需要确保新任务仅在敌人看到玩家时才运行。为此，我们将添加一个 Decorator。Decorator\
  \ 附加在节点顶部，并在执行任务之前提供必须满足的条件。\n\n以下屏幕截图显示了本节更改后的行为树更新版本。Attack Player 序列的任务将在下一节中添加：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_343_0.png)\n\n图 9.52 – Attack Player\
  \ 序列节点带有一个 Decorator\n\n按照以下步骤修改行为树：\n\n- 1. 在内容浏览器中，双击 `BT_EnemyBehavior` 资产以打开行为树编辑器。\n\
  \n- 2. 右键单击 **ROOT** 节点的中间，并选择 **Break Node Link(s).**\n\n- 3. 从 **ROOT** 节点底部的深色区域拖动一根线，并将其释放到空白图表区域以打开选择菜单弹出窗口。选择\
  \ **Selector** 选项。\n\n- 4. 从 **Selector** 节点向下拖动一根线，并将其连接到 **Move To Patrol** 节点。\n\
  \n- 5. 从 **Selector** 节点再向下拖动一根线并添加一个 **Sequence** 节点。此新节点必须位于 **Move To Patrol**\
  \ 节点的左侧，因为它优先于巡逻行为。\n\n- 6. 在 **Details** 面板中，将 **Node Name** 更改为 *Attack Player*。\n\
  \n- 7. 现在，我们将使用 Decorator 来验证敌人是否看到玩家。右键单击 *Attack Player* 节点，将鼠标悬停在 **Add Decorator**\
  \ 上以展开菜单，并选择 **Blackboard** 以添加 Decorator。\n\n- 8. 单击 Decorator，并在 **Details** 面板中，将\
  \ **Observer aborts** 设置为 **Lower Priority**，**Blackboard Key** 设置为 **PlayerCharacter**，**Node\
  \ Name** 设置为 **Can see Player?**:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_345_0.png)\n\
  \n图 9.53 – Decorator 设置\n\n- 9. 保存行为树。Decorator 仅在 `PlayerCharacter` 键具有引用时才允许节点运行。它还将中止\
  \ Move to Patrol 序列以执行 Attack Player 序列。\n\n让敌人追击玩家所缺少的唯一部分是 Attack Player 序列的任务节点。\n\
  \n### 创建追击行为\n\n为了让敌人追击玩家，我们将使用 **Move To Task** 节点，并将 **PlayerCharacter** 引用作为目标。我们将使用\
  \ **Wait** 节点在攻击之间创建暂停，并使用我们的 **BTTask_ClearBBValue** 任务来清除 **PlayerCharacter**\
  \ 引用：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_346_0.png)\n\n图 9.54 – Attack\
  \ Player 序列的任务节点\n\n在下一章中，我们将让敌人对玩家造成伤害。\n\n按照以下步骤添加任务节点：\n\n- 1. 从 **Attack Player**\
  \ 序列节点拖动一根线并添加一个 **Move To** 任务节点。在 **Details** 面板中，将 **Blackboard Key** 更改为 **PlayerCharacter**。\n\
  \n- 2. 从 **Attack Player** 序列节点拖动一根线并添加一个 **Wait** 任务节点。在 **Details** 面板中，将 **Wait\
  \ Time** 设置为 2.0 秒。\n\n- 3. 从 **Attack Player** 序列节点再拖动一根线并添加一个 **BTTask_ClearBBValue**\
  \ 任务节点。在 **Details** 面板中，将 **Key** 更改为 **PlayerCharacter** 并将 **Node Name** 更改为\
  \ `Reset Player seen`:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_347_0.png)\n\n\
  图 9.55 – 在黑板中清除 PlayerCharacter 值\n\n- 4. 保存行为树并关闭行为树编辑器。在关卡编辑器中按 **Play** 按钮来测试敌人行为。\n\
  \n当你在巡逻敌人面前导航玩家角色时，敌人将停止巡逻并追击玩家。当敌人到达玩家处时，它将停留 2 秒，然后返回其巡逻路径。如果它与玩家重新建立视线，则它将中断巡逻并再次开始追击玩家。\n\
  \n### 总结\n\n在本章中，我们开始将简单的移动目标转变为能够挑战玩家的完整游戏敌人的过程。在此过程中，你学习了如何将 AIControllers、行为树和黑板结合使用的基础知识，以创建能够感知周围世界并基于该信息做出决策的敌人。\n\
  \n在我们继续开发 AI 以对玩家构成严峻挑战的过程中，你可以运用所学技能来考虑可以赋予敌人的其他行为类型。对 AI 机制的持续探索将使你不断回到我们在此开始实现的感知、决策和行动核心循环。\n\
  \n在下一章中，我们将扩展 AI 行为来创建一个能够真正挑战玩家的敌人。我们将添加敌人倾听玩家并调查声音的能力，以及在玩家靠近时对玩家造成伤害的攻击能力。为了围绕这一新威胁平衡游戏，我们还将赋予玩家反击敌人的能力。\n\
  \n### 测验\n\n- 1. 运行行为树函数属于哪个类？\n  - a. Actor\n  - b. Pawn\n  - c. AIController\n\
  \  - d. PlayerController\n\n- 2. 黑板是一种可以包含事件和操作的特殊蓝图类型。\n  - a. 正确\n  - b. 错误\n\n\
  - 3. 行为树图可以包含控制流节点和任务节点。\n  - a. 正确\n  - b. 错误\n\n- 4. 哪个控制流节点会在一个子节点成功运行后立即成功并停止运行？\n\
  \  - a. Selector\n  - b. Sequence\n\n- 5. 我们可以向节点添加哪个元素来提供运行它所必须满足的条件？\n  - a. Task\n\
  \  - b. Decorator\n  - c. Service\n"
- "## 第 10 章：升级 AI 敌人\n\n在本章中，我们将为 AI 敌人添加更多功能，以引入玩家可能失败的潜力并创造更大的游戏性多样性。此时，我们将开始确定想要提供给玩家的挑战类型。我们将创建类似僵尸的敌人，它们将不懈地追击玩家，创造一个以动作为重点的体验，玩家必须试图在大量敌人中生存。我们将首先赋予\
  \ AI 更多能力，包括造成伤害和使用漫游模式来增加玩家生存难度。然后，我们将关注玩家，赋予他们反击这些危险敌人的能力。最后，我们将通过在游戏世界中逐渐生成新敌人的系统来完成难度增加的平衡。\n\
  \n在此过程中，我们将涵盖以下目标：\n\n- 引入会伤害玩家生命值的敌人近战攻击\n- 赋予 AI 听到玩家脚步声和枪声的能力\n- 让敌人根据声音调查玩家最后已知位置\n\
  - 允许玩家使用枪械摧毁敌人\n- 在世界中生成新敌人\n- 设置 AI 敌人在关卡中随机漫游\n\n到本章结束时，我们将拥有一个敌人生成器，它将生成会攻击玩家、能够听到玩家脚步声和枪声并在关卡中随机漫游的\
  \ AI 敌人。\n\n### 创建敌人攻击\n\n如果我们创建的敌人将成为玩家实现我们为其设定目标的真正障碍，那么我们首先需要赋予敌人对玩家造成伤害的能力。在\
  \ *第 9 章：使用人工智能构建智能敌人* 中，我们设置了敌人攻击模式的基本结构。当玩家进入敌人的视线时会触发该模式。我们现在将为该攻击引入一个伤害元素，以确保敌人进入玩家近战距离后会有后果。\n\
  \n### 创建攻击任务\n\n我们将创建一个名为 `BTTask_DoAttack` 的攻击任务来造成伤害，并扩展我们在敌人行为树中创建的 **Attack\
  \ Player** 序列。该任务将包含两个变量——一个用于存储伤害目标，另一个用于存储要应用的伤害数值。\n\n按照以下步骤创建攻击任务：\n\n- 1. 在内容浏览器中，访问\
  \ `Content/FirstPersonBP/Enemy` 文件夹并双击 `BT_EnemyBehavior` 资产以打开行为树编辑器。\n\n- 2. 单击工具栏上的\
  \ **New Task** 按钮，并从出现的下拉菜单中选择 **BTTask_BlueprintBase** 选项。该任务将与行为树在同一文件夹中创建 – `Content/FirstPersonBP/Enemy`。\n\
  \n- 3. 在内容浏览器中，将新创建的 `BTTask_BlueprintBase_New` 资产重命名为 `BTTask_DoAttack`。双击 `BTTask_DoAttack`\
  \ 以返回蓝图编辑器。\n\n- 4. **Details** 面板显示类默认值。将 Node Name 字段更改为 `DoAttack`。\n\n- 5. 在\
  \ **My Blueprint** 面板中，单击 **Variables** 类别的 + 按钮。在 **Details** 面板中，将变量命名为 `TargetActorKey`，将其类型更改为\
  \ **BlackboardKeySelector**，并选中 **Instance Editable** 属性：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_352_0.png)\n\
  \n图 10.1 – 创建 TargetActorKey 变量\n\n- 6. 在我的蓝图面板中创建另一个变量。在详情面板中，将变量命名为 `Damage`，将变量类型更改为\
  \ Float，并勾选实例可编辑属性。编译蓝图并将默认值设置为 `0.25`，这意味着攻击将扣除玩家 25% 的生命值：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_352_1.png)\n\
  \n图 10.2 – Damage 变量的默认值为 0.25\n\n- 7. 将鼠标悬停在我的蓝图面板的 **函数** 类别上，单击 **覆盖** 下拉列表，并选择\
  \ **接收执行** 以添加事件。\n\n- 8. 在 **接收执行** 事件中，我们将确保 **目标角色** 有效，然后对其造成伤害。该事件将从黑板中获取 **目标角色**\
  \ 引用，并在调用 **应用伤害** 函数之前检查其是否有效：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_353_0.png)\n\
  \n图 10.3 – 接收执行事件的操作\n\n- 9. 步骤 9–12 的节点用于从黑板获取 **目标角色** 引用并检查其是否有效。从 **接收执行** 事件的白色引脚拖出一根线，并添加一个\
  \ **是否有效** 宏节点。\n\n- 10. 将 **目标角色键** 变量从 **我的蓝图** 面板拖入 **事件图** 中，并选择 **获取目标角色键**。\n\
  \n- 11. 从 **目标角色键** 节点拖出一根线，并添加 **从黑板获取演员值** 节点。\n\n- 12. 从 **从黑板获取演员值** 节点的 **返回值**\
  \ 拖出一根线，并连接到 **是否有效** 节点的 **输入对象** 引脚。\n\n- 13. 步骤 13–15 的节点用于使用 **目标角色** 引用调用 **应用伤害**\
  \ 函数。从 **从黑板获取演员值** 节点的 **返回值** 再拖出一根线，并添加一个 **应用伤害** 节点。将 **是否有效** 输出引脚连接到 **应用伤害**\
  \ 节点的白色输入引脚。\n\n- 14. 从 **应用伤害** 节点的 **基础伤害** 输入引脚拖出一根线，并添加一个 **获取伤害** 节点。\n\n-\
  \ 15. 从 **应用伤害** 节点的白色输出引脚拖出一根线，并添加一个 **完成执行** 节点。检查 **完成执行** 节点的 **成功** 参数。\n\n\
  - 16. 编译、保存并关闭蓝图编辑器。\n\n现在，我们需要将攻击任务添加到 BT_EnemyBehavior 中的攻击序列中。\n\n### 在行为树中使用攻击任务\n\
  \n敌人的攻击是近战攻击，因此敌人只有在到达玩家后才会执行攻击。\n\n按照以下步骤使用 DoAttack 任务：\n\n- 1. 在行为树编辑器中，从攻击玩家序列节点向下拖出一根线，在移动到和等待任务节点之间添加一个\
  \ BTTask_DoAttack 任务节点。\n\n- 2. 在详情面板中，将目标角色键选择更改为 PlayerCharacter。将节点名称更改为伤害玩家，以描述我们如何使用\
  \ BTTask_DoAttack：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_355_0.png)\n\n图 10.4\
  \ – BTTask_DoAttack 属性\n\n- 3. 保存行为树。攻击玩家序列应如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_355_1.png)\n\
  \n图 10.5 – 带有 BTTask_DoAttack 节点的攻击玩家序列\n\n**攻击玩家** 序列已完成。现在，我们需要更新 `FirstPersonCharacter`\
  \ 蓝图，以便在造成伤害时降低生命值显示。\n\n### 更新生命值显示\n\n生命值显示条链接到 `FirstPersonCharacter` 蓝图的 **玩家生命值**\
  \ 变量。我们将使用 **任何伤害事件** 来降低 **玩家生命值** 变量的值。\n\n创建 **任何伤害事件** 的步骤如下：\n\n- 1. 在内容浏览器中，打开\
  \ `Content/FirstPersonBP/Blueprints` 文件夹，然后双击 `FirstPersonCharacter` 蓝图。\n\n- 2.\
  \ 在 **事件图** 的空白处右键单击，并添加 **任何伤害事件** 节点。我们将向该事件添加以下节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_356_0.png)\n\
  \n图 10.6 – 任何伤害事件的操作\n\n- 3. 从 **任何伤害事件** 节点的白色输出引脚拖出一根线，并添加一个 **设置玩家生命值** 节点。\n\
  \n- 4. 从设置玩家生命值节点的输入引脚拖出一根线，并添加一个 MAX (float) 节点。我们使用此节点来确保玩家生命值永远不会小于 0.0。\n\n\
  - 5. 从 Max (float) 节点的顶部输入引脚拖出一根线，并创建一个减法节点。\n\n- 6. 从减法节点的顶部输入引脚拖出一根线，并添加一个获取玩家生命值节点。\n\
  \n- 7. 从减法节点的底部输入引脚拖出一根线，并连接到任何伤害事件节点的伤害输出引脚。\n\n- 8. 编译并保存蓝图，然后点击播放按钮进行测试。\n\n\
  请注意，当敌人进入玩家攻击范围并攻击时，玩家的生命值显示会减少。\n\n既然我们的敌人正在攻击玩家，我们希望提供更多敌人可以发现玩家的选项。\n\n### 让敌人听到并调查声音\n\
  \n只能追击直接在其前方行走的玩家的敌人很容易被避开。为解决此问题，我们将利用 PawnSensing 组件让敌人检测玩家发出的附近声音。如果玩家在敌人的检测范围内发出声音，则敌人将走到该声音的位置进行调查。如果他们在视野中看到玩家，则会尝试攻击；否则，他们会在声音位置等待片刻，然后返回巡逻路线。\n\
  \n### 向行为树添加听觉\n\n我们将添加一系列在敌人听到声音时执行的任务。我们希望敌人一旦看到玩家就继续攻击，因此在行为树中调查声音的优先级较低。\n\n\
  为了让敌人调查它听到声音的位置，我们需要在黑板中创建两个键。`HasHeardSound` 键是布尔类型，用于存储是否听到了声音。`LocationOfSound`\
  \ 键是 `Vector` 类型，用于存储声音来源的位置——即敌人 AI 应该调查的位置。\n\n按照以下步骤创建黑板键并将 **调查声音** 序列节点添加到行为树中：\n\
  \n- 1. 在内容浏览器中，打开 `Content/FirstPersonBP/Enemy` 文件夹，然后双击 `BT_EnemyBehavior` 资产以打开行为树编辑器。\n\
  \n- 2. 单击 **黑板** 选项卡：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_358_0.png)\n\n\
  图 10.7 – 将行为树编辑器切换到黑板模式\n\n- 3. 单击 **新建键** 按钮，并选择 **Bool** 作为键类型。将此新键命名为 `HasHeardSound`：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_359_0.png)\n\n图 10.8 – HasHeardSound\
  \ 布尔键\n\n- 4. 再次单击新建键按钮，并选择 Vector 作为键类型。将此新键命名为 LocationOfSound：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_359_1.png)\n\
  \n图 10.9 – LocationOfSound 矢量键\n\n- 5. 保存黑板并单击行为树选项卡。\n\n- 6. 将攻击玩家序列及其所有任务节点在行为树中进一步向左移动，在攻击玩家和移动到巡逻之间留出空间。我们将在此处添加听觉序列。\n\
  \n- 7. 从 **选择器** 节点向下拖出一根线，并添加一个 **序列** 节点。将此节点重命名为 `Investigate Sound`。\n\n- 8.\
  \ 在 **调查声音** 节点上右键单击，将鼠标悬停在 **添加装饰器** 上以展开菜单，并选择 **黑板** 以添加装饰器。\n\n- 9. 单击该装饰器，并在\
  \ **详情** 面板中，将 **中止观察** 设置为 **较低优先级**，将 **黑板键** 设置为 **是否听到声音**，将 **节点名称** 设置为 **听到了声音？**：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_360_0.png)\n\n图 10.10 – 装饰器设置\n\n以下屏幕截图显示了带有装饰器的\
  \ **调查声音** 序列节点。请注意，行为树中节点的优先级是从左到右：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_361_0.png)\n\
  \n图 10.11 – 调查声音序列节点\n\n我们已创建黑板键、序列节点和装饰器。下一步是创建 **调查声音** 序列的任务节点。\n\n### 设置调查任务\n\
  \n**调查声音** 序列将类似于 **攻击玩家** 序列。如果敌人正在巡逻并听到声音，他们将移动到声音的位置：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_362_0.png)\n\
  \n图 10.12 – Investigate Sound 序列的任务节点\n\n按照以下步骤添加任务节点：\n\n- 1. 从 Investigate Sound\
  \ 序列节点拖出一条线并添加一个 Move To 任务节点。在 **详情** 面板中，将 Blackboard Key 更改为 LocationOfSound。\n\
  - 2. 从 Investigate Sound 序列节点拖出一条线并添加一个 Wait 任务节点。在 **详情** 面板中，将 Wait Time 设置为 3.0\
  \ 秒。\n- 3. 从 Investigate Sound 序列节点拖出另一条线并添加一个 BTTask_ClearBBValue 任务节点。在 **详情**\
  \ 面板中，将 Key 更改为 HasHeardSound 并将 Node Name 更改为 Reset Heard Sound。\n- 4. 保存行为树并关闭行为树编辑器。\n\
  \n现在，我们需要返回到 BP_EnemyController 蓝图并添加一些操作，以指示我们的 AI 如何响应游戏中的声音。\n\n### 创建变量和宏以更新黑板\n\
  \n我们将在 BP_EnemyController 蓝图中创建变量和宏，以更新与声音相关的 BB_EnemyBlackboard 键。\n\n这些是步骤：\n\n\
  - 1. 在内容浏览器中，访问 Content|FirstPersonBP|Enemy 文件夹并双击 BP_EnemyController 蓝图。\n- 2.\
  \ 在 **我的蓝图** 面板的 **变量** 类别中，单击 + 按钮添加一个变量。在 **详情** 面板中，将变量命名为 `HearingDistance`\
  \ 并将 **变量类型** 更改为 **浮点数**。编译蓝图并将 **默认值** 设置为 `1600.0`。\n- 3. 在 **我的蓝图** 面板中创建另一个变量。在\
  \ **详情** 面板中，将变量命名为 `HasHeardSoundKey` 并将 **变量类型** 更改为 **名称**。编译蓝图并将 **默认值** 设置为\
  \ `HasHeardSound`。\n- 4. 创建另一个名为 `LocationOfSoundKey` 的 **名称** 变量。编译蓝图并将 **默认值**\
  \ 设置为 `LocationOfSound`。\n- 5. 在 **我的蓝图** 面板中，单击 **宏** 类别中的 + 按钮创建一个宏。将宏的名称更改为 `UpdateSoundBB`。\n\
  - 6. 在宏的 **详情** 面板中，创建一个名为 `In` 的 **执行** 类型输入参数，一个名为 `Location` 的 **向量** 类型输入参数，以及一个名为\
  \ `Out` 的 **执行** 类型输出参数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_364_0.png)\n\
  \n图 10.13 – 创建宏参数\n\n- 7. 以下屏幕截图显示了我们将在以下步骤中为 **UpdateSoundBB** 宏创建的节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_364_1.png)\n\
  \n图 10.14 – UpdateSoundBB 宏\n\n- 8. *步骤 8–11* 的节点用于使用 **声音位置键** 节点将声音位置存储在黑板中。在\
  \ **UpdateSoundBB** 宏的选项卡上，右键单击图形并添加一个 **获取黑板** 函数节点。\n- 9. 从 **获取黑板** 的 **返回值**\
  \ 引脚拖出一条线并添加一个 **设置为向量** 节点。\n- 10. 从 **设置为向量** 节点的 **键名** 引脚拖出一条线并添加一个 **获取声音位置键**\
  \ 节点。\n- 11. 将 **输入** 节点的 **位置** 引脚连接到 **设置为向量** 的 **向量值** 引脚，并连接 **输入** 和 **设置为向量**\
  \ 节点的白色执行引脚。\n- 12. *步骤 12–14* 的节点用于在黑板的 **已听到声音键** 中设置 **真** 值。从 **获取黑板** 的 **返回值**\
  \ 引脚拖出另一条线并添加一个 **设置为布尔值** 节点。选中 **布尔值** 参数。\n- 13. 从 **设置为布尔值** 节点的 **键名** 引脚拖出一条线并添加一个\
  \ **获取已听到声音键** 节点。\n- 14. 连接 **设置为向量**、**设置为布尔值** 和 **输出** 节点的白色执行引脚。关闭 **UpdateSoundBB**\
  \ 宏选项卡并编译蓝图。\n\n创建 **UpdateSoundBB** 宏后，我们将使用 **PawnSensing** 组件的另一个事件来检测声音。\n\n\
  ### 解释和存储噪声事件数据\n\n我们添加到 `BP_EnemyController` 的 **PawnSensing** 组件为构建敌 AI 的视觉和听觉感知奠定了基础。我们将使用\
  \ **On Hear Noise** 事件，每当 **PawnSensing** 组件检测到由 Pawn 噪声发射器广播的特殊类型声音时，该事件都会激活。\n\
  \n我们必须设置蓝图，使敌人仅检测短距离内发出的噪音；否则，玩家从地图另一端开枪却让每个敌人立即知道其位置，会感觉不公平。\n\n按照以下步骤创建 **On Hear\
  \ Noise** 事件：\n\n- 1. 在 **组件** 面板中，选择 **PawnSensing** 组件。在 **详情** 面板中，查看 **事件**\
  \ 类别并单击 **On Hear Noise** 事件的绿色按钮将其添加到 **事件图表**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_366_0.png)\n\
  \n图 10.15 – 添加 On Hear Noise 事件\n\n- 2. 在 **On Hear Noise** 中，如果声音位置与敌人之间的距离小于 **HearingDistance**\
  \ 的值，我们将调用 **更新声音黑板** 宏：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_366_1.png)\n\
  \n图 10.16 – On Hear Noise 操作\n\n- 3. 从 **On Hear Noise (PawnSensing)** 节点的白色引脚拖出一条线并添加一个\
  \ **分支** 节点。接下来的步骤将创建一个使用 **VectorLength** 函数来计算声音位置与敌人位置之间距离的表达式。如果该表达式的结果小于 Hearing\
  \ Distance 的值，则 **分支** 节点的 True 输出引脚将被执行。\n- 4. 从 **分支** 节点的 True 引脚拖出一条线并添加 Update\
  \ Sound BB 宏节点。将 On Hear Noise (PawnSensing) 节点的 Location 引脚连接到 Update Sound BB\
  \ 宏的 Location 引脚。\n- 5. 从 **分支** 节点的 Condition 输入引脚拖出一条线并添加一个 **小于** 节点。\n- 6. 从\
  \ **小于** 节点的底部输入引脚拖出一条线并添加一个 **获取听觉距离** 节点。\n- 7. 在 **事件图表** 的空白处右键单击并添加一个 **获取受控\
  \ Pawn** 节点，以获取由该 BP_EnemyController 控制的敌人实例。\n- 8. 从 **获取受控 Pawn** 节点的 **返回值**\
  \ 引脚拖出一条线并添加一个 **获取 Actor 位置** 节点以获取敌人位置。\n- 9. 从 On Hear Noise (PawnSensing) 节点的\
  \ Location 引脚拖出一条线并添加一个 **减法** 节点。\n- 10. 将 **减法** 节点的底部输入引脚连接到 **获取 Actor 位置**\
  \ 节点的 **返回值** 引脚。\n- 11. 从 **减法** 节点的输出引脚拖出一条线并添加一个 **向量长度** 节点。\n- 12. 将 **向量长度**\
  \ 节点的 **返回值** 连接到 **小于** 节点的顶部输入引脚。**向量长度** 节点的 **返回值** 是声音位置与敌人位置之间的距离。\n- 13.\
  \ 编译并保存蓝图。\n\n现在我们已修改敌 AI 以能够检测广播到侦听器的声音，我们需要在 FirstPersonCharacter 蓝图中创建节点以触发听觉响应，并将它们附加到玩家操作。\n\
  \n### 为玩家操作添加噪音\n\n**EnemyController** 的 **Pawn 感知** 组件仅能检测由 **Pawn 噪声发射器** 创建的噪音。当玩家开枪时播放的现有音效不会触发敌人的\
  \ **Pawn 感知** 组件。需要知道的是，为 Pawn 感知产生噪音的节点与玩家听到的声音没有直接关系。噪音仅在产生 AI 可以听到并响应的事件方面存在。\n\
  \n**Pawn 噪声发射器** 组件必须添加到 Actor 中，其广播的噪音才能被 Pawn 传感器检测到。我们将更改两个玩家能力，即 sprinting 和\
  \ shooting，以利用此组件产生可检测的噪音。\n\n使用 **Pawn 噪声发射器** 的步骤如下：\n\n- 1. 在内容浏览器中，访问 Content\
  \ > FirstPersonBP > Blueprints 文件夹并双击 FirstPersonCharacter 蓝图。\n- 2. 在 **组件** 面板中，单击\
  \ **添加** 按钮并搜索 `pawn`。选择 **Pawn 噪声发射器** 组件：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_369_0.png)\n\
  \n图 10.17 – 添加 Pawn Noise Emitter 组件\n\n- 3. 我们将从为冲刺添加噪音开始。在我的蓝图面板中，双击 ManageStaminaDrain\
  \ 宏以打开宏选项卡。我们将在 SET Player Stamina 节点之后添加 Make Noise 节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_369_1.png)\n\
  \n图 10.18 – 修改 ManageStaminaDrain 宏以发出噪音\n\n- 4. 将 Outputs 节点向右拖动，为另一个函数节点腾出空间。\n\
  \n- 5. 从 SET Player Stamina 节点的白色输出引脚拖出一条线，搜索 make noise，并添加 Make Noise (PawnNoiseEmitter)\
  \ 函数：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_370_0.png)\n\n图 10.19 – 添加 PawnNoiseEmitter\
  \ 组件的 Make Noise 函数\n\n- 6. 将 Make Noise 节点的 Loudness 输入更改为 1.0。\n\n- 7. 从 Make\
  \ Noise 节点的 Noise Location 输入拖出一条线，并添加 GetActorLocation 节点。\n\n- 8. 我们将添加 Make Noise\
  \ 节点的下一个位置是在 InputAction Fire 事件中，在减少弹药之后。你可以在我的蓝图面板的 Graphs 类别中找到 InputAction Fire\
  \ 事件：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_371_0.png)\n\n图 10.20 – 修改 InputAction\
  \ Fire 事件以发出噪音\n\n- 9. 从 SET Player Current Ammo 节点的白色输出引脚拖出一条线，搜索 `make noise`，并添加\
  \ Make Noise (PawnNoiseEmitter) 函数。\n- 10. 将 Make Noise 节点的 Loudness 输入更改为 `1.0`。\n\
  - 11. 从 Make Noise 节点的 Noise Location 输入拖出一条线，并添加 GetActorLocation 节点。\n- 12. 编译，保存，然后单击\
  \ Play 来测试游戏。\n\n当你位于敌人身后，或否则处于其视线之外时，冲刺或开枪射击应会导致敌人靠近你发出噪音时所处的位置。如果它们在调查过程中与你建立了视线，那么它们将开始直接朝你移动。\n\
  \n既然视觉和听觉都可能被发现，你可能会发现很难避免被敌人发现。我们现在将注意力转向游戏平衡的另一面，为玩家提供对抗敌人的手段。\n\n### 使敌人可被摧毁\n\
  \n还记得在早期章节中，我们创建了敌人目标，玩家可以用一个弹丸击中几次将其摧毁。我们想给玩家类似的能力来减轻新敌人带来的威胁。为此，我们将在 BP_EnemyCharacter\
  \ 中添加蓝图节点来处理受伤和摧毁。玩家需要击中敌人角色三次才能将其摧毁。\n\n按照以下步骤处理被击中的情况：\n\n- 1. 在内容浏览器中，访问 Content\
  \ > FirstPersonBP > Enemy 文件夹，然后双击 BP_EnemyCharacter 蓝图。\n\n- 2. 在我的蓝图面板的变量类别中，单击\
  \ + 按钮添加一个变量，并将变量命名为 EnemyHealth。\n\n- 3. 在详情面板中，将变量类型设置为整数。编译蓝图并将默认值设置为 3：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_372_0.png)\n\n图 10.21 – EnemyHealth 初始值为\
  \ 3 点\n\n- 4. 在事件图表的空白处右键单击，添加 **事件命中** 节点。以下截图显示了 **事件命中** 动作的第一部分：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_373_0.png)\n\
  \n图 10.22 – 事件命中动作的第一部分\n\n- 5. 从 **事件命中** 节点的 **其他** 输出引脚拖出一条线，添加 **转换为 FirstPersonProjectile**\
  \ 节点。连接 **事件命中** 和 **转换为 FirstPersonProjectile** 的白色引脚。\n\n- 6. 从 **转换为 FirstPersonProjectile**\
  \ 节点的白色输出引脚拖出一条线，添加 **分支** 节点。\n\n- 7. 从 **分支** 节点的 **条件** 引脚拖出一条线，添加 **大于** 节点。\n\
  \n- 8. 从 **大于** 节点的顶部输入引脚拖出一条线，添加 **获取敌人健康** 节点。在 **大于** 节点的底部输入中设置值 `1`。\n\n- 9.\
  \ 从 **分支** 节点的 **真** 输出引脚拖出一条线，添加 **递减整数** 节点。\n\n- 10. 从 **递减整数** 节点的输入引脚拖出一条线，添加\
  \ **获取敌人健康** 节点。\n\n- 11. 从 **分支** 节点的 **假** 输出引脚拖出一条线，添加 **从类生成角色** 节点。在 **类**\
  \ 参数中，选择 Blueprint_Effect_Explosion 类，它是入门内容中的一个蓝图。\n\n- 12. 从 **生成变换** 参数拖出一条线，添加\
  \ **GetActorTransform** 节点。\n\n- 13. 事件命中动作的第二部分节点与 `BP_CylinderTarget` 蓝图中使用的相同：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_374_0.png)\n\n图 10.23 – 事件命中动作的第二部分\n\
  \n- 14. 打开位于 `Content > FirstPersonBP > Blueprints` 文件夹中的 `BP_CylinderTarget` 蓝图。\n\
  \n- 15. 选择并复制 *图 10.23* 中显示的节点，然后将节点粘贴到 `BP_EnemyCharacter` 蓝图中。\n\n- 16. 将 **生成角色**\
  \ 节点的白色输出引脚连接到 **转换为 FirstPersonCharacter** 节点的白色输入。\n\n- 17. 编译，保存，然后按 **开始游戏**\
  \ 进行测试。\n\n从现在开始，当玩家击中敌人三次时，敌人将爆炸并被摧毁，方式与圆柱体目标的行为类似。\n\n既然我们可以摧毁敌人了，就需要再次通过生成更多敌人来为玩家增加难度。\n\
  \n### 在游戏过程中生成更多敌人\n\n我们将定期在关卡中生成新敌人，这样如果玩家摧毁了最初的几个敌人，游戏可以继续；如果他们击败敌人太慢，难度将逐渐增加。\n\
  \n### 创建 BP_EnemySpawner 蓝图\n\n我们将创建一个蓝图，在关卡的随机位置生成敌人。生成之间的时间由名为 `SpawnTime` 的变量决定。还有一个名为\
  \ `MaxEnemies` 的变量限制敌人的生成。\n\n按照以下步骤创建蓝图：\n\n- 1. 在内容浏览器中，访问 `Content > FirstPersonBP\
  \ > Enemy` 文件夹。单击 **添加** 按钮并选择 **蓝图类** 选项。\n\n- 2. 在下一个屏幕上，选择 **角色** 作为父类。将蓝图命名为\
  \ `BP_EnemySpawner`，然后双击它打开蓝图编辑器。\n\n- 3. 在 **我的蓝图** 面板的 **变量** 类别中，单击 **+** 按钮添加一个变量，并将其命名为\
  \ `SpawnTime`。在 **详情** 面板中，将 **变量类型** 更改为 **浮点数**，并检查 **实例可编辑** 属性。编译蓝图并将 **默认值**\
  \ 设置为 `10.0`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_376_0.png)\n\n图 10.24\
  \ – 创建 SpawnTime 浮点数变量\n\n- 4. 在我的蓝图面板中创建另一个变量，并将其命名为 MaxEnemies。在详情面板中，将变量类型更改为整数，并检查实例可编辑属性。编译蓝图并将默认值设置为\
  \ 5：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_377_0.png)\n\n图 10.25 – 创建 MaxEnemies\
  \ 整数变量\n\n- 5. 在 **我的蓝图** 面板中，单击 **宏** 类别中的 + 按钮创建一个宏。将宏的名称更改为 `SpawnEnemy`。\n\n\
  - 6. 在宏的 **详情** 面板中，创建名为 `In` 的输入参数和名为 `Out` 的输出参数，两者均为 **执行** 类型：\n\n- 7. 在为 **SpawnEnemy**\
  \ 宏创建的选项卡中，添加这些节点以在关卡的随机位置生成 **BP_EnemyCharacter** 实例：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_377_1.png)\n\
  \n图 10.26 – SpawnEnemy 宏\n\n- 8. 在图表上右键单击并添加 **从类生成 AI** 节点。连接 **输入**、**从类生成 AI**\
  \ 和 **输出** 节点的白色执行引脚。\n\n- 9. 在 **兵种类** 参数中，选择 **BP_EnemyCharacter**。在 **行为树** 参数中，选择\
  \ **BT_EnemyBehavior**。\n\n- 10. 从 **位置** 参数拖出一条线，添加 **GetRandomPointInNavigableRadius**\
  \ 节点。将 **半径** 设置为 `10000.0`。此节点基于导航网格返回一个随机位置。\n\n- 11. 从 **原点** 参数拖出一条线，添加 **GetActorLocation**\
  \ 节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_378_0.png)\n\n图 10.27 – 设置生成敌人的定时器\n\
  \n- 12. 在 **BP_EnemySpawner** 的事件图表中，从 **游戏开始** 的白色执行引脚拖出一条线，添加 **按事件设置定时器** 节点。\n\
  \n- 13. 检查 **循环** 参数。从 **时间** 参数拖出一条线，添加 **获取生成时间** 节点。\n\n\n\n\n\n- 14. 从 Event\
  \ 参数拖出一根线并添加自定义事件。将其命名为 TryToSpawnEnemy。\n- 15. 从 TryToSpawnEnemy 的白色引脚拖出一根线并添加\
  \ Get All Actors Of Class 节点。在 Actor Class 参数中，选择 BP_EnemyCharacter。\n- 16. 从 Get\
  \ All Actors Of Class 的白色输出引脚拖出一根线并添加 Branch 节点。\n- 17. 从 Branch 节点的 True 引脚拖出一根线并添加\
  \ Spawn Enemy 宏节点。\n- 18. 从 Get All Actors Of Class 的 Out Actors 引脚拖出一根线并添加 Length\
  \ 节点。Length 节点的返回值将是关卡中敌人的数量。\n- 19. 从 Length 节点的输出引脚拖出一根线并添加 Less 节点。将 Less 节点的输出引脚连接到\
  \ Branch 节点的 Condition 参数。\n- 20. 从 Less 节点的底部引脚拖出一根线并添加 Get Max Enemies 节点。\n-\
  \ 21. 编译、保存并关闭蓝图编辑器。从内容浏览器中拖动 BP_EnemySpawner 并将其放置在关卡中的任意位置以创建实例。单击 Play 按钮测试敌人生成。\n\
  \n运行游戏时，您会定期看到新敌人出现。不过请注意，生成后的敌人不会移动，除非它们听到或看到玩家。这是因为它们在创建时没有设定要追踪的巡逻点。我们不是为生成的敌人添加巡逻点，而是要为敌人的导航行为增加随机性。\n\
  \n### 创建敌人漫游行为\n\n在 `Chapter 9`，`Building Smart Enemies with Artificial Intelligence`\
  \ 中，我们将敌人的默认行为设定为在两点之间进行巡逻移动。虽然这作为听觉和视觉组件的测试平台效果不错，并且适合潜行类游戏，但我们将通过用随机漫游取代此行为来提升游戏体验的挑战性和动作感。这将使躲避敌人变得困难得多，并鼓励更直接的对抗。为此，我们将返回到\
  \ `BT_EnemyBehavior` 行为树。\n\n### 使用自定义任务识别漫游点\n\n我们需要在 `BB_EnemyBlackboard` 中创建一个键，用于存储敌人下一个漫游目的地的位置。与\
  \ `PatrolPoint` 键不同，我们的目的地不会由游戏内的角色表示，而是由向量坐标表示。然后，我们将创建一个任务来确定敌人应该在关卡的哪个位置漫游。\n\
  \n创建键和任务的步骤如下：\n\n- 1. 在内容浏览器中，双击 `BT_EnemyBehavior` 资产以打开行为树编辑器。\n- 2. 单击 **Blackboard**\
  \ 选项卡以编辑 `BB_EnemyBlackboard`。\n- 3. 单击 **New Key** 按钮，并选择 **Vector** 作为键类型。将此新键命名为\
  \ `WanderPoint`:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_381_0.png)\n\n图 10.28\
  \ – 在黑板中创建 WanderPoint 键\n\n- 4. 保存黑板并单击 **Behavior Tree** 选项卡以返回行为树。\n- 5. 单击工具栏上的\
  \ **New Task** 按钮，并在出现的下拉菜单中选择 **BTTask_BlueprintBase** 选项。\n- 6. 在内容浏览器中，将新创建的\
  \ **BTTask_BlueprintBase_New** 资产重命名为 **BTTask_FindWanderPoint**。双击 **BTTask_FindWanderPoint**\
  \ 以返回蓝图编辑器。\n- 7. **Details** 面板显示类默认值。将 **Node Name** 字段更改为 `FindWanderPoint`。\n\
  - 8. 在 **My Blueprint** 面板中，单击 **Variables** 类别的 + 按钮。在 **Details** 面板中，将变量命名为 `WanderKey`，将其类型更改为\
  \ **Blackboard KeySelector**，并选中 **Instance Editable** 属性:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_382_0.png)\n\
  \n图 10.29 – 创建 WanderKey 变量\n\n- 9. 将鼠标悬停在 **My Blueprint** 面板的 **Functions** 类别上，单击\
  \ **Override** 下拉菜单，并选择 **Receive Execute** 以添加事件。\n- 10. 在 **Event Receive Execute**\
  \ 中，我们将获取关卡的随机位置并将其存储在黑板中:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_382_1.png)\n\
  \n图 10.30 – Event Receive Execute 动作\n\n- 11. 从 **Event Receive Execute** 的白色引脚拖出一根线并添加\
  \ **Set Blackboard Value as Vector** 节点。\n- 12. 从 **Set Blackboard Value as Vector**\
  \ 的白色输出引脚拖出一根线并添加 **Finish Execute** 节点。选中 Finish Execute 节点的 **Success** 参数。\n\
  - 13. 从 Set Blackboard Value as Vector 的 Key 参数拖出一根线并添加 Get Wander Key 节点。\n- 14.\
  \ 从 Set Blackboard Value as Vector 的 Value 参数拖出一根线并添加 GetRandomPointInNavigableRadius\
  \ 节点。将 Radius 设置为 10000.0。\n- 15. 从 Origin 参数拖出一根线并添加 Make Vector 节点。\n- 16. 编译并保存蓝图。\n\
  \n现在我们有了自定义任务，可以修改 `BT_EnemyBehavior` 来让敌人找到并移动到 `WanderPoint`。\n\n### 将漫游添加到行为树中\n\
  \n我们将把 Move To Patrol 序列转换为 Wander 序列。行为树中的新 Wander 序列由以下节点表示:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_383_0.png)\n\
  \n图 10.31 – 新的 Wander 序列\n\n修改行为树的步骤如下：\n\n- 1. 在内容浏览器中，双击 BT_EnemyBehavior 资产以打开行为树编辑器。\n\
  - 2. 选择 **Move To Patrol** 序列节点。在 **Details** 面板中，将 **Node Name** 更改为 `Wander`。\n\
  - 3. 选择 Move To 任务节点，并将 **Blackboard Key** 更改为 `WanderPoint`。\n- 4. 从 **Wander**\
  \ 序列节点向其他节点左侧拖出一根线并添加 BTTask_FindWanderPoint 节点。\n- 5. 在 **Details** 面板中，将 **Wander\
  \ Key** 设置为 `WanderPoint`。同时，将 **Node Name** 更改为 `Get Next Wander Point`。\n- 6.\
  \ 保存并关闭行为树编辑器。\n\n这是我们在行为树中需要更改的所有内容，以包含敌人漫游行为。我们需要在两个蓝图中进行一些调整。\n\n### 最后调整和测试\n\
  \n我们将删除 BP_EnemyCharacter 中用于设置 `Patrol Point` 的 **Event BeginPlay**。我们不再需要它，因为我们使用的是随机\
  \ `WanderPoint`。\n\n我们需要做的另一项更改是修改 `FirstPersonCharacter` 的 **Target Goal** 值，使其更高，以便游戏可以持续更长时间。我们将此值设置为\
  \ `20`，因此玩家必须消灭 20 个敌人才能获胜。\n\n调整蓝图的步骤如下：\n\n- 1. 打开 BP_EnemyCharacter 蓝图。\n- 2.\
  \ 在事件图中，删除 **Event BeginPlay** 及其连接的所有节点。\n- 3. 编译、保存并关闭蓝图编辑器。\n- 4. 打开 `FirstPersonCharacter`\
  \ 蓝图。\n- 5. 在 **My Blueprint** 面板中，选择 **TargetGoal** 变量。在 **Details** 面板中，将 **DEFAULT\
  \ VALUE** 更改为 `20`:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_385_0.png)\n\n图\
  \ 10.32 – 更改 TargetGoal 的默认值\n\n- 6. 编译、保存并关闭蓝图编辑器。\n- 7. 要测试敌人的漫游行为，最好使用菜单中的 **Simulate**\
  \ 选项，该选项可以通过单击 **Play** 按钮旁边的三个点来访问:\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_386_0.png)\n\
  \n图 10.33 – 使用 Simulate 在关卡中自由移动\n\n按住右键并使用 W、A、S、D 键和鼠标在关卡中自由移动。您将看到敌人生成并移动到关卡中的随机位置。\n\
  \n我们创建了一个自定义任务来查找随机漫游点，并修改了行为树以使用此新任务。现在，由 `BP_EnemySpawner` 生成的敌人知道如何在关卡中移动。\n\n\
  ### 摘要\n\n本章中，我们通过增强 AI 驱动敌人的能力，开始着手创造既具挑战性又平衡的游戏体验。我们赋予敌人类似僵尸的行为，让它们在关卡中无目的地漫游，直到通过视觉或听觉注意到玩家。我们还赋予它们在发现玩家时向前冲锋并发动近战攻击的能力，从而降低玩家的生命值。接着，我们给予玩家通过攻击敌人来反击的机会，最终在敌人生命值耗尽时将其消灭。最后，我们给予新\n\
  \n\n\n### 测验\n\n- 1. 行为树任务中使用的事件名称是什么？\n  - a. Tick\n  - b. Event Receive Execute\n\
  \  - c. Event Begin Play\n\n- 2. 用于为 AI 添加视觉和听觉的组件名称是什么？\n  - a. Pawn Sensing\n\
  \  - b. AI Sensing\n  - c. AI Perception\n\n- 3. 黑板可以具有 Vector 类型的键。\n  - a. 正确\n\
  \  - b. 错误\n\n- 4. Set Timer by Event 节点具有 Function Name 参数。\n  - a. 正确\n  - b.\
  \ 错误\n\n- 5. GetRandomPointInNavigableRadius 节点根据导航网格返回随机位置。\n  - a. 正确\n  - b.\
  \ 错误\n"
- "## 第 11 章：游戏状态与最终润色\n\n在本章中，我们将迈出最后一步，将我们的游戏发展成一个完整且充满乐趣、能够给玩家带来挑战的体验。首先，我们将引入玩家死亡，当玩家的生命值完全耗尽时将触发该机制。然后，我们将引入回合系统，要求玩家在推进回合的过程中击败越来越多的敌人，从而提升挑战难度。最后，我们将引入保存和加载系统，以便玩家可以离开游戏，稍后返回他们上次游玩的回合。在本章中，我们将涵盖以下主题：\n\
  \n- 根据玩家条件显示不同的菜单\n- 使用游戏修饰符创建渐进式难度\n- 支持游戏状态的保存与稍后重新加载\n- 根据保存的数据进行分支关卡初始化\n- 创建显示游戏数据的过渡屏幕\n\
  \n到本章结束时，我们将拥有一款街机风格的第一人称射击游戏，玩家可以不断回归，迎接越来越困难的挑战。\n\n### 让危险变得真实：玩家死亡\n\n在第 10\
  \ 章「升级 AI 敌人」中，我们朝着平衡的游戏取得了重大进展，在该游戏中敌人威胁玩家，但玩家可以运用技巧克服这一挑战。仍有一个元素显著缺失。如果玩家生命值耗尽，则不应能继续游戏。因此，我们将运用在\
  \ _第 8 章：创建约束和游戏目标_ 中创建的胜利画面的知识，将其应用于失败画面。此画面将允许玩家以满弹药和全新填充的生命条重新开始关卡，但也会抵消他们为达成目标所取得的任何进度。\n\
  \n### 设置失败画面\n\n当玩家生命值耗尽时，将显示失败画面。我们将向他们提供重新开始上一回合或退出游戏的选项。你可能记得我们创建的胜利画面；我们在那里提供了类似的选项。与其从头重新制作\
  \ UI 画面，不如使用我们的 **WinMenu** 资产作为模板来节省一些时间。\n\nFollow these steps to create **LoseMenu**:\n\
  \n- 1. 在 **内容浏览器** 中，访问 `Content|FirstPersonBP|UI` 文件夹。右键单击 **WinMenu** 并选择 **复制**\
  \ 选项。\n- 2. 将此新蓝图小部件命名为 `LoseMenu`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_391_0.png)\n\
  \n图 11.1 – 复制并重命名 WinMenu\n\n- 3. 双击 **LoseMenu** 资产以打开 UMG 编辑器。选择显示 **你赢了！** 的文本对象。在\
  \ **详情** 面板中，将文本元素重命名为 `Lose msg`，将 **内容** 下的 **文本** 字段更改为 `You Lose!`，并将 **颜色和不透明度**\
  \ 更改为深红色：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_391_1.png)\n\n图 11.2 – 设置\
  \ LoseMenu 的消息\n\n- 4. 编译并保存。目前，**重启** 和 **退出** 两个按钮在外观和功能上可以与 `WinMenu` 中的对应项保持相同。\n\
  \n现在我们需要修改 `FirstPersonCharacter` 蓝图以显示失败画面。\n\n### 显示失败画面\n\n我们将创建一个名为 **LostGame**\
  \ 的自定义事件，当玩家生命值耗尽时将调用该事件。\n\n创建自定义事件的步骤如下：\n\n- 1. 在 **内容浏览器** 中，访问 `Content > FirstPersonBP\
  \ > Blueprints` 文件夹并双击 `FirstPersonCharacter` 蓝图。\n- 2. 右键单击 **事件图表** 并添加 **自定义事件**。将其重命名为\
  \ `LostGame`。我们将在 **LostGame** 事件中添加以下节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_392_0.png)\n\
  \n图 11.3 – LostGame 操作\n\n- 3. 从 **LostGame** 的输出执行引脚拖出一条线，添加 **设置游戏暂停** 节点，并选中\
  \ **暂停** 复选框。\n- 4. 右键单击 **事件图表** 并添加 **获取玩家控制器** 节点。从 **返回值** 输出引脚拖出一条线并添加 **设置显示鼠标光标**\
  \ 节点。选中 **显示鼠标光标** 旁边的复选框，并将此节点附加到 **设置游戏暂停** 的输出执行引脚。\n- 5. 从 **设置显示鼠标光标** 节点的输出执行引脚拖出一条线，添加\
  \ **创建小部件** 节点。在 **类** 参数中，选择 **LoseMenu**。\n- 6. 将 **创建小部件** 节点的 **返回值** 输出引脚拖出一条线，添加\
  \ **添加到视图端** 节点。\n- 7. 我们将修改 **事件任何伤害**，如果 **玩家生命值** 与 `0 0` **近似相等**，则调用 **LostGame**\
  \ 事件：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_393_0.png)\n\n图 11.4 – 修改事件任何伤害\n\
  \n- 8. 从 **设置玩家生命值** 节点的白色输出引脚拖出一条线，添加 **分支** 节点。\n- 9. 从 **设置玩家生命值** 节点的输出引脚拖出一条线，添加\
  \ **近似相等（浮点）** 节点。将 **返回值** 引脚连接到 **分支** 节点的 **条件** 输入引脚。\n- 10. 从 **分支** 节点的 **真**\
  \ 输出引脚拖出一条线，添加 **LostGame** 节点。\n- 11. 编译、保存，然后单击 **开始游戏** 来测试你的工作。如果你站在敌人旁边足够长的时间，使其将你的生命值耗尽至零，那么你应该会看到我们创建的\
  \ **LoseMenu**。\n\n现在，玩家需要更加小心地对待敌人以免输掉游戏。使游戏更有趣的下一步是创建基于回合的体验。\n\n### 使用保存游戏创建基于回合的动态难度\n\
  \n我们现在有一个支持完整游玩体验的游戏。然而，游戏体验受到我们设定为目标的敌人数量的限制。这导致游戏显得浅薄。为解决此问题，我们可以采用街机游戏使用的技术，即随着玩家通过一系列回合来增加游戏难度。这是使用现有资产为游戏增加深度和乐趣的一种方式，而无需花费数小时创建自定义内容。\n\
  \n我们创建的回合将作为玩家的得分。他们达到的回合越高，玩家被认为成就越大。为确保玩家达到的最大回合仅受其技能限制，而不受他们在一次游玩中投入时间的限制，我们将实现一个保存系统，以便玩家在离开游戏并稍后返回时可以从上次中断的地方继续。\n\
  \n### 使用 SaveGame 类存储游戏信息\n\n创建保存系统的第一步是创建 `SaveGame` 类的蓝图子类，用于存储我们想要保存的游戏数据。我们想要跟踪玩家退出游戏前所处的回合。我们无需存储玩家击败了多少敌人的数据，因为让每个游戏会话从回合开始处开始对玩家来说更有意义。\n\
  \n按照以下步骤创建 `SaveGame` 类的子类：\n\n- 1. 在 **内容浏览器** 中，访问 Content|FirstPersonBP|Blueprints\
  \ 文件夹。单击 **添加** 按钮并选择 **蓝图类**。\n\n\n\n\n\n- 2. 在下一屏幕中，搜索并选择 SaveGame 作为父类：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_395_0.png)\n\
  \n图 11.5 – 将 SaveGame 设为父类\n\n- 3. 将蓝图命名为 BP_SaveInfo，并双击它以打开蓝图编辑器。\n\n- 4. 在 **“我的蓝图”**\
  \ 面板的 **变量** 类别中，单击 + 按钮以添加变量。在 **“详情”** 面板中，将其命名为 Round，并将 **变量类型** 更改为 **整数**。编译蓝图，然后将\
  \ **默认值** 设置为 1：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_396_0.png)\n\n图 11.6\
  \ – 创建 Round 整数变量\n\n- 5. 编译、保存并关闭蓝图编辑器。\n\n在 BP_SaveInfo 蓝图中我们只需完成这些操作。下一步是学习如何使用\
  \ BP_SaveInfo 蓝图来保存和加载数据。\n\n### 保存游戏信息\n\n现在我们有了一个保存数据的容器，需要确保数据存储在玩家的机器上，并且在玩家返回游戏时能够检索。与其他游戏设置一样，我们将把此过程添加到\
  \ FirstPersonCharacter 蓝图中。我们将创建一些变量和一个宏来保存游戏信息。\n\n按照以下步骤创建变量和宏：\n\n- 1. 在内容浏览器中，打开\
  \ Content|FirstPersonBP|Blueprints 文件夹，并双击 FirstPersonCharacter 蓝图。\n\n- 2. 在 **“我的蓝图”**\
  \ 面板的 **变量** 类别中，单击 + 按钮以添加变量。在 **“详情”** 面板中，将其命名为 `CurrentRound`，并将 **变量类型** 更改为\
  \ **整数**。编译蓝图，然后将 **默认值** 设置为 `1`。\n\n- 3. 在 **“我的蓝图”** 面板中创建一个变量，并将变量命名为 `SaveInfoRef`。\n\
  \n- 4. 在 **“详情”** 面板中，单击 **变量类型** 下拉菜单并搜索 `BP_SaveInfo`。将鼠标悬停在 `BP_SaveInfo` 上以显示子菜单，然后选择\
  \ **对象引用**：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_397_0.png)\n\n图 11.7 – SaveInfoRef\
  \ 变量引用 BP_SaveInfo 的一个实例\n\n- 5. 在 **“我的蓝图”** 面板中创建另一个变量。在 **“详情”** 面板中，将变量命名为 `saveSlotName`\
  \ 并将 **变量类型** 更改为 **字符串**。编译蓝图并将 **默认值** 设置为 `SaveGameFile`。该变量存储文件名：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_398_0.png)\n\
  \n图 11.8 – saveSlotName 存储文件名\n\n- 6. 在 **“我的蓝图”** 面板的 **宏** 类别中单击 + 按钮以创建宏。将宏命名为\
  \ SaveRound。在宏的 **详情** 面板中，创建一个名为 In 的输入参数（类型为 Exec）和一个名为 Out 的输出参数（类型为 Exec）。\n\
  \n- 7. 在为宏 SaveRound 创建的选项卡中，添加以下屏幕截图中显示的节点。我们检查 SaveInfoRef 是否有效。如果无效，则创建 BP_SaveInfo\
  \ 的一个实例并将其存储在 SaveInfoRef 中。我们更新 SaveInfoRef 的 Round 变量，然后保存 SaveInfoRef 的内容：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_398_1.png)\n\n图 11.9 – SaveRound 宏\n\n\
  - 8. 从 **输入** 节点的 **In** 引脚拖动一根连线，并添加一个 **是否有效** 宏节点。\n\n- 9. 从 **输入对象** 参数拖动一根连线，并添加一个\
  \ **获取 SaveInfoRef 引用** 节点。\n\n- 10. 在 **事件图表** 上右键单击并添加另一个 **获取 SaveInfoRef 引用**\
  \ 节点。从 **获取 SaveInfoRef 引用** 节点拖动一根连线，并添加一个 **设置 Round** 节点。\n\n- 11. 将 **是否有效**\
  \ 输出引脚连接到 **设置 Round** 节点的白色输入引脚。从 **Round** 输入引脚拖动一根连线，并添加一个 **获取当前 Round** 节点。\n\
  \n- 12. 从 **设置 Round** 节点的白色输出引脚拖动一根连线，并添加一个 **保存游戏到插槽** 节点。将 **保存游戏到插槽** 的白色输出引脚连接到\
  \ **输出** 节点的 **Out** 引脚。\n\n- 13. 将 **游戏保存对象** 引脚连接到 **获取 SaveInfoRef 引用** 节点。从\
  \ **插槽名称** 引脚拖动一根连线，并添加一个 **获取保存插槽名称** 节点。\n\n- 14. 从 **无效** 输出引脚拖动一根连线，并添加一个 **创建游戏保存对象**\
  \ 节点。在 **游戏保存类** 中，选择 **BP_SaveInfo**。\n\n- 15. 从 **创建游戏保存对象** 节点的 **返回值** 引脚拖动一根连线，并添加一个\
  \ **设置 SaveInfoRef 引用** 节点。将 **设置 SaveInfoRef 引用** 节点的白色输出引脚连接到 **设置 Round** 节点的白色输入引脚。\n\
  \n- 16. 编译并保存蓝图。\n\n我们的下一步是创建宏，以加载使用 **SaveRound** 宏保存的内容。\n\n### 加载游戏信息\n\n我们将创建一个名为\
  \ **LoadRound** 的宏，用于检索保存的 **Round** 并将其存储在 **CurrentRound** 变量中。\n\n创建宏的步骤如下：\n\
  \n- 1. 在 FirstPersonCharacter 蓝图的 **我的蓝图** 面板的 **宏** 类别中单击 + 按钮以创建宏。将宏命名为 LoadRound。在宏的\
  \ **详情** 面板中，创建一个名为 In 的输入参数（类型为 Exec）和一个名为 Out 的输出参数（类型为 Exec）。\n\n- 2. 在为宏 LoadRound\
  \ 创建的选项卡中，添加以下节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_400_0.png)\n\n图 11.10\
  \ – LoadRound 宏\n\n- 3. 从 **输入** 节点的 In 引脚拖动一根连线，并添加一个 **游戏保存是否存在** 节点。从 **插槽名称**\
  \ 引脚拖动一根连线，并添加一个 **获取保存插槽名称** 节点。\n\n- 4. 从 **返回值** 引脚拖动一根连线，并添加一个 **分支** 节点。将 **游戏保存是否存在**\
  \ 的白色输出引脚连接到 **分支** 节点的白色输入引脚。\n\n- 5. 将 **分支** 节点的 False 引脚连接到 **输出** 节点的 Out 引脚。你可以双击连线来添加一个中继节点，并修改连线的形状和位置。\n\
  \n- 6. 从 **分支** 节点的 True 引脚拖动一根连线，并添加一个 **从插槽加载游戏** 节点。从 **插槽名称** 引脚拖动一根连线，并添加一个\
  \ **获取保存插槽名称** 节点。\n\n- 7. 从 **从插槽加载游戏** 节点的 **返回值** 引脚拖动一根连线，并添加一个 **转换为 BP_SaveInfo**\
  \ 节点。将 **从插槽加载游戏** 的白色输出引脚连接到 **转换为 BP_SaveInfo** 节点的白色输入引脚。\n\n- 8. 将 **转换为 BP_SaveInfo**\
  \ 节点的 **转换失败** 引脚连接到 **输出** 节点的 **Out** 引脚。如果需要，添加一个中继节点。\n\n- 9. 从 **转换为 BP_SaveInfo**\
  \ 的 **作为 BP Save Info** 拖动一根连线，并添加一个 **设置 SaveInfoRef 引用** 节点。连接 **转换为 BP_SaveInfo**\
  \ 和 **设置 SaveInfoRef 引用** 的白色引脚。\n\n- 10. 从 **设置 SaveInfoRef 引用** 的蓝色输出引脚拖动一根连线，并添加一个\
  \ **获取 Round** 节点。\n\n- 11. 从 **Round** 引脚拖动一根连线，并添加一个 **设置当前 Round** 节点。我们正在获取已保存的\
  \ **Round** 变量的值，并将其存储在 `FirstPersonCharacter` 蓝图的 **当前 Round** 变量中。\n\n- 12. 连接\
  \ **设置 SaveInfoRef 引用**、**设置当前 Round** 和 **输出** 节点的白色引脚。\n\n- 13. 编译并保存蓝图。\n\n使用\
  \ **SaveRound** 和 **LoadRound** 宏，我们可以让玩家从停止的回合继续游戏。为了增加挑战性，让我们根据回合设置 **目标值**。\n\
  \n### 提高目标值\n\n我们将利用保存文件中存储的数据，随着玩家进度的推进来改变游戏玩法。我们将通过创建一个 **RoundScaleMultiplier**\
  \ 变量来实现这一点，该变量将 **当前 Round** 乘以某个系数以找到新的 **目标值**。\n\n按照以下步骤提高 **目标值**：\n\n- 1. 在\
  \ **“我的蓝图”** 面板的 **变量** 类别中，单击 + 按钮以添加变量。在 **“详情”** 面板中，将其命名为 RoundScaleMultiplier，然后将变量类型更改为整数。编译蓝图，然后将默认值设置为\
  \ 2：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_402_0.png)\n\n图 11.11 – RoundScaleMultiplier\
  \ 变量\n\n- 2. 在 **“我的蓝图”** 面板的 **宏** 类别中单击 + 按钮以创建宏。将宏命名为 SetRoundTargetGoal。在宏的\
  \ **详情** 面板中，创建一个名为 In 的输入参数（类型为 Exec）和一个名为 Out 的输出参数（类型为 Exec）。\n\n- 3. 在为宏 SetRoundTargetGoal\
  \ 创建的选项卡中，添加以下节点：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_403_0.png)\n\n\
  图 11.12 – SetRoundTargetGoal 宏\n\n- 4. 从 Inputs 节点的 In 引脚拖出一根线并添加 SET Target Goal\
  \ 节点。将 SET Target Goal 的白色输出引脚连接到 Outputs 节点的 Out 引脚。\n- 5. 从 Target Goal 引脚拖出一根线并添加\
  \ Multiply 节点。\n- 6. 从 Multiply 节点的顶部输入引脚拖出一根线并添加 Get Current Round 节点。\n- 7. 从\
  \ Multiply 节点的底部输入引脚拖出一根线并添加 Get Round Scale Multiplier 节点。\n- 8. 编译，保存蓝图，然后返回到\
  \ Event Graph 选项卡。\n- 9. 在 My Blueprint 面板的 Graphs 类别中访问 Event BeginPlay 事件，并添加\
  \ Load Round 和 Set Round Target Goal 宏节点：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_403_1.png)\n\
  \n图 11.13 – 修改 Event BeginPlay\n\n当一轮开始时，我们使用 Load Round 宏来加载保存的文件（如果存在）。然后我们使用\
  \ Set Round Target Goal 宏来设置 TargetGoal。\n\n当玩家到达 TargetGoal 时，我们需要显示过渡屏幕。\n\n###\
  \ 在回合之间显示过渡屏幕\n\n目前，当玩家击败足够多的敌人以满足 TargetGoal 显示的要求时，会显示 WinMenu。它会祝贺玩家，并为他们提供重新开始游戏或退出应用程序的机会。现在，既然我们正在采用基于回合的游戏玩法，我们将把这个\
  \ WinMenu 屏幕改造为过渡屏幕，它将把玩家带入下一轮游戏。\n\n按照以下步骤创建过渡屏幕：\n\n- 1. 在内容浏览器中，访问 /Content/FirstPersonBP/UI\
  \ 文件夹，并将 WinMenu Widget Blueprint 重命名为 RoundTransition，以便更准确地反映其新用途。\n\n- 2. 双击\
  \ RoundTransition Widget Blueprint 打开 UMG 编辑器。新的 RoundTransition 屏幕将包含以下元素：\n\n\
  ![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_405_0.png)\n\n图 11.14 – RoundTransition\
  \ 层级面板\n\n- 3. 在 **层级** 面板中，删除 **你赢了！** 文本元素，并删除 **Btn quit** 按钮，因为在回合转换期间我们不需要显示退出选项。\n\
  \n- 4. 单击 **图表** 选项卡。在 **事件图表** 中，删除 **On Clicked (Btn quit)** 事件。单击 **设计器** 选项卡以返回\
  \ UMG 编辑器。\n\n- 5. 选择 **Txt restart** 元素并将其重命名为 `Txt begin`。在 **详情** 面板中，将文本从 `Restart`\
  \ 更改为 `Begin Round`。将 **Btn restart** 重命名为 `Btn begin`。重新加载关卡的功能将保持不变。\n\n- 6. 从\
  \ **调色板** 面板拖动一个 **水平盒** 到 **层级** 面板中 **Btn restart** 按钮上方。\n\n- 7. 在 **详情** 面板中，单击\
  \ **锚点** 下拉菜单并选择顶部居中选项。将 **Position X** 设置为 `-300.0`，并将 **Position Y** 设置为 `200.0`。勾选\
  \ **适应内容** 属性，因此我们不需要更改 **Size X** 和 **Size Y** 的值。此水平盒的大小将根据其子元素的大小自动调整：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_406_0.png)\n\
  \n图 11.15 – 水平盒属性\n\n- 8. 将一个文本对象拖到水平盒上。在详情面板中，将 内容 类别下的 文本 字段更改为 Round。在 外观 类别中，将字体大小更改为\
  \ 120。\n\n- 9. 将另一个文本对象拖到水平盒上。在详情面板中，将 填充左侧 设置为 20.0，并将 内容 类别下的 文本 字段更改为 99 作为参考。在\
  \ 外观 类别中，将字体大小更改为 120。RoundTransition 布局应如下所示：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_407_0.png)\n\
  \n图 11.16 – RoundTransition 屏幕元素\n\n- 10. 在 **详情** 面板中，找到 **文本** 字段旁的 **绑定** 按钮并创建一个新绑定，如下所示：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_407_1.png)\n\n图 11.17 – 为回合创建绑定\n\n-\
  \ 11. 在出现的 **Get Text 0** 图表视图中，添加一个 **获取玩家角色** 节点，使用 **转换为 FirstPersonCharacter**\
  \ 节点进行转换，然后从 **作为 First Person Character** 引脚拖出线来添加一个 **获取当前回合** 节点。\n\n- 12. 将转换节点和\
  \ **当前回合** 节点连接到 **返回节点**。编辑器将创建一个 **转文本 (整数)** 节点，将数字转换为文本格式：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_408_0.png)\n\
  \n图 11.18 – 我们将在屏幕上显示当前回合变量的值\n\n- 13. 编译，保存，并关闭 UMG 编辑器。\n\n要完成基于回合的系统，我们只需要修改\
  \ **结束游戏事件**。\n\n### 当当前回合获胜时过渡到新回合\n\n在 `FirstPersonCharacter` 蓝图中对 **结束游戏** 事件的修改将很简单，因为将显示\
  \ **RoundTransition** 屏幕，因为它是 **WinMenu** 的修改版本。\n\n当玩家赢得一回合时，我们将增加 **当前回合** 变量并保存。\n\
  \n按照以下步骤修改 **结束游戏** 事件：\n\n- 1. 在 **内容浏览器** 中，访问 `Content > FirstPersonBP > Blueprints`\
  \ 文件夹并双击 `FirstPersonCharacter` 蓝图。\n\n- 2. 在 **事件图表** 中，选择 **结束游戏** 事件。在 **详情**\
  \ 面板中，将事件名称更改为 `End Round`。\n\n- 3. 将注释框标签更改为 `End Round: Shows Transition Menu`：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_409_0.png)\n\n图 11.19 – 结束回合事件的新节点\n\n\
  - 4. 断开 **End Round** 和 **Set Game Paused** 节点之间的连线。将 **End Round** 节点向左移动，为更多节点腾出空间。\n\
  \n- 5. 在 **事件图表** 上右键单击并添加 **获取当前回合** 节点。\n\n- 6. 从 **获取当前回合** 节点的输出引脚拖出一根线并添加 **整数增量**\
  \ 节点。连接 **整数增量** 和 **End Round** 节点的白色引脚。\n\n- 7. 从 **整数增量** 的输出白色引脚拖出一根线并添加 **保存回合**\
  \ 宏节点。\n\n- 8. 将 **保存回合** 的 **输出** 引脚连接到 **Set Game Paused** 节点的白色输入引脚。\n\n- 9.\
  \ 编译，保存，并单击 **播放** 按钮进行测试。\n\n加载游戏时，您应该会注意到游戏顶部的目标计数器上显示的敌人数量较少。击败目标指示的敌人数量，您应该会看到回合转换屏幕出现，显示\
  \ **回合 2**。当您按下 **开始回合** 按钮时，您将重新加载关卡，生命值和弹药会恢复，但目标敌人数量会更高。如果您退出游戏，然后再次单击 **播放**\
  \ 按钮，您会发现游戏加载的是您上次所在的回合。\n\n既然我们可以追踪玩家的进度，就应该为他们提供重置存档文件的选项，以便他们想从头开始游戏时使用。\n\n\
  ### 暂停游戏并重置存档文件\n\n我们将创建 **PauseMenu**，它将为玩家提供恢复游戏、将游戏重置到第一回合或退出应用程序的选项。\n\n###\
  \ 创建暂停菜单\n\n**PauseMenu** 类似于我们的 **LoseMenu**。因此，我们将使用它作为模板。以下屏幕截图显示了我们希望在 **PauseMenu**\
  \ 中包含的元素：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_411_0.png)\n\n图 11.20 – 暂停菜单元素\n\
  \n### 按照以下步骤创建 PauseMenu：\n\n- 1. 在 **内容浏览器** 中，访问 `Content > FirstPersonBP > UI`\
  \ 文件夹。右键单击 **LoseMenu** 并选择 **复制** 选项。\n\n- 2. 将这个新蓝图小部件命名为 **PauseMenu**。\n\n-\
  \ 3. 选择显示 **你输了！** 的文本，并在 **详情** 面板中将 **文本** 字段更改为 `Paused`，并将 **颜色和不透明度** 更改为蓝色：\n\
  \n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_412_0.png)\n\n图 11.21 – 设置 PauseMenu\
  \ 的消息\n\n- 4. 我们将把 **暂停** 文本再向上移动，为另一个按钮腾出空间。在 **插槽** 类别中，将 **Position X** 设置为 `-170.0`，并将\
  \ **Position Y** 设置为 `-450.0`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_412_1.png)\n\
  \n图 11.22 – 设置暂停文本的位置\n\n- 5. 我们将添加一个按钮作为 **继续** 选项，并将 **重新开始** 按钮更改为 **全部重置** 选项。**PauseMenu**\
  \ 的 **层级** 将如下所示：\n\n\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_413_0.png)\n\n\
  Figure 11.23 – PauseMenu 层级结构\n\n- 6. 将 **Button** 元素从 **Palette** 面板拖放到 **Hierarchy**\
