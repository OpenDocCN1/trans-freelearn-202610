  \ **详细信息** 面板中，单击 **锚点** 下拉菜单并选择第三个选项。将 **位置 X** 设置为 `-200.0`，**位置 Y** 设置为 `30.0`，**尺寸\
  \ X** 设置为 `160.0`，**尺寸 Y** 设置为 `40.0`：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_228_0.png)\n\
  \n### 图 7.19 – 武器统计的尺寸和位置\n\n- 3. 将一个文本对象拖到 Weapon Stats 上。在 **详细信息** 面板中，将名称更改为\
  \ `Ammo_label`。将 **内容** 类别下的 **文本** 字段更改为 `Ammo:`（包括冒号）。\n\n- 4. 将另一个 **文本** 对象拖到\
  \ **武器统计** 上。在 **详细信息** 面板中，将名称更改为 `Ammo left`。该元素的值将随弹药使用而变化，但我们可以给它一个默认值以在 UMG\
  \ 编辑器中进行可视化。由于我们已将玩家蓝图中弹药变量的默认值设置为 `30`，请继续将 **Ammo left** 的 **文本** 值也更改为 `30`。\n\
  \n- 5. 在 **层级** 面板中选择 **武器统计**。看起来像花朵的图标是 **锚点徽章**，它表示所选元素在画布面板上的锚点位置：\n\n![](img/e1fd47ad71d32bbc4bf189d4cf9ed94d_229_0.png)\n\
  \n### 图 7.20 – 武器统计的锚点徽章\n\n- 6. 我们将重复这些步骤用于目标追踪器。选择并拖动 **水平框** 从 **调色板** 面板拖到 **层级**\
