  2. 网络安全框架成功案例 — 芝加哥大学生物科学部：https://www.nist.gov/system/files/documents/2020/07/23/University%20of%20Chicago%20Success%20Story%20062920%20508.pdf

  '
- "# NIST 网络安全框架基础\n\n在上一章中，我们了解了什么是网络安全框架及其部分差异。我们知道网络安全框架有助于使我们和我们的组织与最佳实践保持一致。框架为复杂的架构和术语提供了分类法和通用语言。\n\
  \n我们简要介绍了 NIST `Cybersecurity Framework` (`CSF`)。NIST `CSF` 是一个强大、敏捷的框架，可在任何组织中实施。正如我们在上一章所见，有多个组织采用了其他框架，结果几个月或几年后才发现，所选框架并不满足其需求。\n\
  \n在本章中，我们将深入探讨该框架。我们将研究框架的 `Core`、`Tiers` 和 `Profiles`。我们将讨论这些各自的含义，以便您对所讨论的主题有一个总体了解。在后续章节中，我们将进一步深入\
  \ `Core`，并考察其六大功能中的每一个 — `Govern`、`Identify`、`Protect`、`Detect`、`Respond` 和 `Recover`。\n\
  \n本章将涵盖以下主题：\n\n*   NIST 框架\n*   `Tiers`\n*   `Profiles`\n\n让我们开始吧！\n\n## NIST 框架\n\
  \n该框架由三个独立模块组成 — `Core`、`Tiers` 和 `Profiles`。`Core` 由六个功能组成，用于降低组织中的网络安全风险：\n\n\
  *   `Govern`\n*   `Identify`\n*   `Protect`\n*   `Detect`\n*   `Respond`\n*   `Recover`\n\
  \n每个控制措施都有编号，以便我们轻松了解控制措施如何相互对齐。例如，物理设备清单将是 `ID.AM-01`，软件清单将是 `ID.AM-02`，依此类推：\n\
  \n`Function.Category-subcategory`\n\n`ID.AM-01`\n\n我们将在后续章节中进一步讨论各个控制措施；现在，让我们直接深入了解这六个功能各自的含义。\n\
  \n### Govern\n\n`Govern` 旨在在整个网络安全项目中建立治理。这就是为什么 `Govern` 功能位于所有其他功能的中心。它用于设定风险管理策略、政策和标准，确保这些文档编写良好且沟通有效。在企业风险管理方面，`Govern`\
  \ 尤为重要。\n\n此功能还要求您开始与组织中的每个人讨论风险和风险管理。风险承受能力必须从高层的执行领导团队开始，逐级向下传递给中层管理人员，再到您的分析师。还应有一个反馈回路，允许风险缓解工作自下而上地传递。这有助于更好地了解已建立的任何风险承受能力是否仍按预期发挥作用。\n\
  \n### Identify\n\n`Identify` 功能旨在帮助定位系统、软件和外部服务，例如 `Software-as-a-Service` (`SaaS`)。这包括贵公司采购软硬件的渠道以及第三方服务的使用情况。`Identify`\
  \ 功能还涉及风险识别和管理，并有助于制定政策、标准和程序。这些类别用于协助突出显示整个组织中的风险。\n\n互联网安全中心提供的 `Critical Controls`\
  \ 的前两个控制系列也将硬件和软件的可见性列在首位。组织必须掌握所有资产的清单，无论是本地部署还是云端，以便充分保护它们。一旦识别出来，我们就可以扫描漏洞并应用安全补丁，以保障\
  \ IT 资源安全。\n\n组织必须记录环境中不应存在的内容，原因如下：\n\n*   有助于识别连接到网络的流氓设备\n*   确保流氓设备的归属权\n* \
  \  降低环境中的网络风险\n\n`Identify` 功能还要求制定策略，规定如何识别和记录您的 `SaaS` 应用程序，原因相同。\n\n### Protect\n\
  \n正如您可能猜到的，`Protect` 功能旨在保护身份、数据、系统基线化、维护、审计和日志记录。根据 NIST 的说法，`Protect` 功能还旨在限制或遏制网络安全事件。\n\
  \n在 BeyondTrust 于 2023 年进行的一项研究中，组织面临的主要基于身份的攻击如下 [1]：\n\n*   网络钓鱼 (62%)\n*   特权/特权身份管理不善\
  \ (37%)\n*   第三方或供应链攻击 (37%)\n*   内部攻击 (22%)\n*   中间人攻击 (18%)\n\n用户及其数字身份是网络安全中最薄弱的环节，这并不令人意外。`Protect`\
  \ 功能详细介绍了如何通过实施强大的身份和访问管理系统，以及安全意识最终用户培训来保护用户。\n\n此功能还确保数据安全。这是通过加密实现的，包括传输中加密和静态加密。静态加密意味着笔记本电脑、台式机、服务器、数据库等的硬盘应当加密。\n\
  \n这可以通过利用各操作系统内置的加密工具轻松实现。Microsoft 开发了 `BitLocker`，Apple 拥有 `FileVault`，而 Linux\
  \ 则有 `Linux Unified Key Setup` (`LUKS`)。操作系统厂商使用的每种加密方案都有其优缺点。请密切关注如何存储每个已加密设备的备份密钥。如果不存储密钥，您可能会失去对驱动器上存储信息的所有访问权限。\n\
  \n### Detect\n\n`Detect` 功能关注您和您的团队开发的流程，以突出显示威胁、漏洞和病毒，并监控用户行为。此功能还涉及创建系统和网络的基线以确定异常。\n\
  \n我们从异常和事件入手。这就是基线发挥作用发现异常活动的地方。为此，需要建立监控。通常使用 `Simple Network Monitoring Protocol`\
  \ (`SNMP`) 执行此操作。`SNMP` 允许您的团队在给定间隔（通常每分钟）轮询使用统计数据，并将这些统计数据存储在某种平面文件或数据库中以供历史回顾。系统还可能允许您跟踪恶意流量并将其显示在图表上。\n\
  \n监控中的另一个关键步骤是日志聚合。这涉及收集环境中所有系统的日志，包括防火墙、IT 系统、网络设备和数据库。这将允许您监控系统和服务，以检测整个环境中的恶意活动。\n\
  \n最后，我们需要记录检测流程并建立角色和职责。这是必要的一步，用于确定如果发生事件，谁负责检测和修复。\n\n### Respond\n\n我们如何响应事件？谁负责什么？事件如何沟通？这将需要制定事件响应和沟通计划。并非所有事件都需要沟通；但是，您需要制定计划，明确与谁沟通以及何时沟通。\n\
  \n\n\n事件分析也是 `Respond` 函数的一部分。这需要了解现存的威胁类型，特别是那些在实际环境中执行的威胁。有大量的威胁情报列表可供选择。有些需要付费，有些通常可免费使用。**网络安全和基础设施安全局**（**CISA**）会生成一份在实际环境中被积极利用的已知漏洞利用列表，称为**已知被利用漏洞**（**KEV**）。这是一项免费服务，会发送电子邮件通知并在其网站上发布已知漏洞利用列表。\n\
  \n文档记录是该功能成功的关键。你不仅需要记录应对事件的政策和标准；还需要记录事件发生期间的一切。这涉及记录事件响应过程，以便下次能更快地响应，这通过事后复盘来执行。\n\
  \n# 恢复\n\n`Recover` 函数中只有两个类别——`Incident Recover Plan Execution` 和 `Incident Recovery\
  \ Communication`。虽然 `respond` 函数也包含一个通信类别，但该控制项处理的是与外部利益相关者的沟通。\n\n当事件发生时，你必须遵循响应计划中规定的步骤。如果你或你的团队没有遵循这些步骤，为什么？计划是否不适合该事件？是否缺少步骤？所有这些都会在事后复盘中讨论，以改进计划本身。\n\
  \n事后复盘或经验教训总结活动被用作持续改进过程的一部分。事件发生后，团队会聚在一起举行此类会议之一。这是事件响应的最后一步。事后复盘允许**安全事件响应团队**（**SIRT**）相互表扬工作出色。然而，这也是发泄对事件中出错之处不满的时刻。\n\
  \n事后复盘是一个“*什么发生在拉斯维加斯，就留在拉斯维加斯！*”的场景（这句著名口号用于许多拉斯维加斯的广告中）。发泄不满同样重要，因为这是团队从错误中吸取教训的唯一途径。\n\
  \n后续章节将更多地讨论功能及其控制族。理解功能、类别和子类别如何分组为控制族非常重要。框架中确实存在一些控制重复——例如，`communication` 在功能中被引用了两次。必须理解每个控制项在两个功能中的区别。\n\
  \n下一节将介绍如何将层级应用于这些控制项，以便你有办法衡量你的网络安全计划。\n\n# 层级\n\n在推出新计划时，我们必须首先了解其当前所处的位置（当前状态）以及打算达到的位置（未来状态）。虽然框架概况用于确定当前和未来状态，但我们首先需要评估当前状态。本章后面将重点介绍如何执行这些类型的评估。我们首先必须了解如何根据框架对我们的计划进行排名。\n\
  \n审计公司倾向于利用**能力成熟度模型集成**（**CMMI**）按成熟度等级对 NIST CSF 进行排名。这改变了框架评估和降低风险的初衷。框架层级与 CMMI\
  \ 之间存在一些相似之处。大多数相似之处体现在文档记录和正式组织政策上。然而，这并非框架的初衷。\n\n事实上，框架明确声明不打算将其作为成熟度模型进行评估。这并不是说成熟度不应成为评估的一部分；它应该是。事实上，你会看到框架层级与\
  \ CMMI 之间的相似之处。然而，我们将尽可能忠实于框架的初衷，因为其初衷是降低整体网络风险。\n\n评估当前环境及其与框架层级的契合度涉及大量标准。框架评分值在层级\
  \ 1（`partial`）和层级 4（`adaptive`）之间。这将有助于直观地显示缺少哪些控制项，并突出显示需要改进的地方。\n\n要评估你的计划以达到下一层级，必须满足某些要求。这些标准在以下子类别中提及。\n\
  \n## 层级的应用\n\n让我们看看这四个不同的层级以及它们如何降低风险：\n\n*   **层级 1** - `partial`（部分）：\n    * \
  \  **网络安全风险治理**：风险策略以及目标和威胁的优先级排序充其量只是临时性的。\n    *   **网络安全风险管理**：组织没有建立必要的流程，而是逐个案例地处理风险。组织也缺乏对其在供应链中角色的理解，以及第三方如何影响它。组织也没有用于共享网络风险相关信息的标准化方法。\n\
  \n*   **层级 2** – `risk-informed`（风险知情）：\n    *   **网络安全风险治理**：风险管理经管理层批准；但可能未覆盖整个组织。网络项目的优先级排序直接与组织、政策、标准或业务需求相关。\n\
  \    *   **网络安全风险管理**：对网络风险有部门级的视角，但这是局部的，而非全组织范围的。威胁信息在内部共享但不一致。组织也意识到与第三方相关的网络安全风险，但工作流程不一致。\n\
  \n*   **层级 3** – `repeatable`（可重复）：\n    *   **网络安全风险治理**：风险管理经管理层批准，但不一定针对整个组织。网络需求的优先级排序直接由外部风险情报和业务需求决定。\n\
  \    *   **网络安全风险管理**：组织层面理解网络风险；但没有全组织范围的政策来规定如何应对。网络风险信息按不定期共享，组织知晓其合作的第三方；但缺乏一致的交互方法。\n\
  \n*   **层级 4** – `adaptive`（自适应）：\n    *   **网络安全风险治理**：存在全组织范围的方法来管理网络风险。应对网络风险的政策与程序之间的关系得到一致实施。网络风险管理融入了组织文化。\n\
  \    *   **网络安全风险管理**：组织在当前威胁形势下实施其网络风险计划。这允许采用自适应方法来管理网络风险。经验教训总结活动持续执行，以确保计划是最新的，且团队能适应新威胁。\n\
  \n正如我们所见，框架层级与 CMMI 模型之间存在相似之处。然而，虽然有相似之处，也有大量差异——以网络安全风险管理场景为例。这些涉及组织如何与其上游和下游供应商开展业务。了解和理解组织在行业生态系统中扮演的更大角色同样关键。这有助于增强业务运营的韧性。\n\
  \n层级将在你执行评估时进行自我评分中发挥重要作用。此评估用于了解你当前的安全态势，并制定未来状态或战略路线图。该路线图用于规划将降低组织网络风险的未来项目。概况是了解风险当前状态以及你打算如何降低风险的一种方式。\n\
  \n接下来，我们将探讨如何构建概况，并了解它们如何降低风险。\n\n\n\n\n# 持续改进\n\n持续改进对于任何网络安全计划都是必不可少的。正如您从层级概览中所见，要在层级结构中改进或进阶，您还必须改进组织流程。为此，我们将回顾\
  \ `Deming cycle`（戴明循环）。\n\n在 20 世纪 50 年代，一位名为威廉·戴明的质量控制工程师创立了 `Plan, Do, Check,\
  \ and Act`（计划、执行、检查、处理）的概念，即 `PDCA`。尽管 `PDCA` 最初用于改进业务流程，但我们也可以用这一理念来改进我们的网络安全计划。在\
  \ `图 2.1` 中，您可以看到处于持续循环中的 `戴明循环`。该循环允许您为即将到来的项目做计划，经历实施阶段，然后收集关于哪些有效、哪些无效的信息。一旦收集到这些信息，我们便再次进入规划阶段：\n\
  \n![图 2.1 – 戴明循环](img/B21915_02_1.jpg)\n\n图 2.1 – 戴明循环\n\n`戴明循环` 的阶段包含以下内容：\n\n\
  1.  **计划**：这是新项目的规划阶段。我们召集正确的利益相关者共同设计旨在降低网络风险的解决方案。我们评估并发现当前状态与未来状态之间的差距（稍后详述），并规划我们如何降低网络风险。在此阶段，您可能还需要开始采购软硬件，或安排可信第三方协助实施。\n\
  \n    您还应记录测试计划，以便您和团队了解项目的范围内外。这也可用作项目章程，以实施或修改系统资源。\n\n2.  **执行**：在此阶段，您开展实际工作。这是您开始实施新系统和流程或修改现有系统的地方。我们审查测试计划，以确保既定控制措施已按要求安装和配置。\n\
  \n3.  **检查**：我们现在必须检查已实施的改进或缓解措施是否按预期工作。团队开始测试新控制措施，以确保期望状态符合预期。我们测试 `Key Performance\
  \ Indicators`（`KPIs`，关键绩效指标），以确保产生的指标完全在运营和服务级别协议范围内。\n\n    虽然检查阶段在给定周期内执行，但应持续检查安全控制措施，以确保其满足特定指标。您应持续检查控制措施，确保其正常运行，且在预期完成时间内顺利结束。\n\
  \n4.  **处理**：在处理阶段，您收集所有指标并确定后续步骤。如果实施的缓解措施按预期工作，太棒了！继续下一个问题，再次运行该循环。如果没有，则我们需要了解实施了什么、如何实施的，并重新评估我们的网络风险状况。\n\
  \n    这可能意味着缓解措施将风险降低了 75%，但您的目标是降低 85%，从而产生 10% 的差距。您现在回顾实施了什么、什么未按预期工作，制定新的缓解计划，循环再次开始。\n\
  \n`PDCA` 可用于改进计划的许多方面——从评估新 IT 系统和网络安全控制措施到制定政策、标准和程序。此方法可在计划的任何地方使用。\n\n# 概况\n\n\
  我们需要一种方法来评估组织的整体风险状况。要成功做到这一点，我们必须了解网络安全计划的当前状态，并确定我们打算将计划引向何方。这有时很简单，特别是当您目前就在该组织工作时。然而，如果您是新入职员工，您将需要先自行执行评估或委托他人执行评估。\n\
  \n风险评估提供多项益处。首先，它有助于您与新同事建立关系。进入新组织时，建立关系应是首要目标。这使您能够熟悉高管领导团队、IT 团队和事件响应团队。这也是您通过交谈更好地了解公司\
  \ IT 和安全历史的时候。\n\n其次，执行评估将为您提供当前已实施控制措施的背景情况。这些交谈将深入了解技术栈、实施方式以及针对 IT 资源所采取的缓解控制措施。评估还可以回答风险如何计算以及整体风险偏好是什么等问题。\n\
  \n## 执行评估\n\n执行评估有多种方式。我们可以自己做，称为第一方评估；也可以委托他人做，称为第三方评估。两者各有优劣。\n\n### 第三方评估\n\n\
  我们从第三方评估开始。第三方评估机构是受雇代表您执行风险评估的公司。这有时是最容易的选择；然而，这是成本最高的选项。针对 CSF 的影响评估有时可能花费数万甚至数十万美元。这完全取决于组织的范围和规模。\n\
  \n如果您从未执行过评估，这可能是最佳选择。在执行第三方评估时，您将与一支 `governance, risk, and compliance`（`GRC`，治理、风险与合规）分析师团队合作。这些分析师将审查您的所有文档，如政策、标准、程序、网络和应用流程图，并收集证据以支持您的流程。\n\
  \n除了收集证据外，您、您的团队和高管领导还将被问及一系列关于人员、流程和技术的问题。这些问题结合提供的证据，用于更好地了解您安全计划的成熟度。这些问题将围绕已实施的控制措施，以及它们如何与业务需求和框架本身保持一致。\n\
  \n第三方评估机构将在评估结束时提供报告。该报告将根据您的当前状况提供评分。在许多情况下，评估公司还将提供一份删减版报告，可发送给您的第三方，使他们也能更好地了解组织的安全状况。\n\
  \n第三方还提供无偏见的评估。在执行第一方评估时，倾向于给自己实施的控制措施打分比实际应得的分数高。我们都难免犯此错误。然而，如果您评估自己的组织，请记住从评分中去除这些偏见。\n\
  \n如果您渴望学习新技能，或过去执行过评估，您可能想自行执行评估。这称为第一方评估。\n\n### 第一方评估\n\n第一方评估成本最低，且可能有趣、令人兴奋，如果您从未执行过，可能还有些令人生畏。执行第一方评估有许多好处。例如，您可以控制时间、问题或评估过程的任何其他方面。\n\
  \n然而，您应了解关键成功标准。例如，一个关键方面是倾听。当您处于提问评估问题的位置时，要留意环境和周围的人。特别注意旁谈和肢体语言。这有时会带来有助于您评估的额外信息。\n\
  \n\n\n\n该过程可能会有所不同，具体取决于您是新员工还是在公司工作了一段时间。例如，如果您是长期员工，则可能无需先执行评估即可自行评分。如果您是组织的新成员，我会建议先执行评估，然后再进行自评并创建当前状态概况。\n\
  \n要执行评估，我建议遵循以下步骤。\n\n## 委托函\n\n首先，您需要一份委托函。这授予您执行评估的权限。信函应说明委托意图以及收集信息所需的任何扫描，并应请求执行评估职责的许可。\n\
  \n有时扫描可能不会按您预期的方式执行。这可能会影响系统性能或导致系统无法运行。委托函也是您的*免责金牌*，意味着一位高管成员允许您执行扫描和评估。\n\n##\
  \ 项目启动\n\n一旦您获得了由高管团队成员签署的委托函，就可以开始评估并着手收集证据。这包括策略、标准、程序、网络图和其他供审查的内部文档。收集这些信息将帮助您了解业务，还将提供对所用技术的洞察，以便您将对话引导至特定的安全和\
  \ IT 相关系统。\n\n这也是开始扫描的时候。有许多付费和开源工具可用于扫描。互联网安全中心（`CIS`）有多个基准可用于加固系统。运行 `CIS` 扫描有助于确定\
  \ IT 资源的配置设置。扫描完成后，工具将生成一份通过/失败报告，您可以用它来确定环境的正确设置。\n\n如果您精通技术，可以使用多种开源工具。例如，您可以从域名系统（`DNS`）获取大量信息。通过\
  \ `DNS`，您可以发现他们的电子邮件提供商是谁、他们的 `DNS` 记录位于何处，以及基于 IP 地址的 IT 资源地理位置。许多 SaaS 提供商要求客户在其\
  \ `DNS` 中放置一条 `TXT` 记录。这也可以提供对组织可能正在使用的其他服务的洞察。\n\n`DNSEnum` 是另一个开源工具，可用于发现特定域的\
  \ `DNS` 条目。然后您可以确定公司正在使用的各种 IT 资源。例如，您可以通过捕捉 `vpn.example.com` 等线索来确定公司使用的防火墙类型。\n\
  \n网络映射器（`NMAP`）是一种可用于发现网络上 IT 资源的工具。`NMAP` 允许您跨网络执行 `ICMP` 或 `PING` 扫描以发现活动主机。您还可以用它来发现服务器上运行的开放端口和服务。\n\
  \n`NMAP` 还将尝试检测 IT 资源上的设备类型和操作系统。例如，扫描 Microsoft Windows 2019 服务器时，您将收到以下消息：\n\n\
  ```\nService Info: OS: Windows; CPE: cpe:/o:microsoft:windows\n```\n\n反之，如果您扫描 Linux\
  \ 系统，将看到以下内容：\n\n```\nOS CPE: cpe:/o:linux:linux_kernel:2.6.32\n```\n\n不过，您也可能遇到此消息：\n\
  \n```\nToo many fingerprints match this host to give specific OS details\n```\n\n\
  当无法确定操作系统或其版本时，会出现此消息。\n\n这些扫描并不总能获得正确的操作系统版本。例如，Linux 系统扫描认为系统运行的是 2.6.32 内核，而实际上系统运行的是\
  \ 6.1.0。虽然不一定准确，但它确实能确定总体操作系统类型。\n\n我理解这些技术可用于善意或恶意目的。然而，我相信当它们用于善意时，这些工具能为您正在评估的环境提供宝贵的洞察。\n\
  \n现在我们已经审查了策略文档，研究了网络图，并运行了扫描，是时候进行问卷调查了。\n\n## 执行评估\n\n现在，是时候执行评估的问卷部分了。许多第一方和第三方问卷都是通过面谈或虚拟会议进行的。不过，您也可以发送问卷让对方填写。这种方式参与度较低，可能无法获得您想要的结果。\n\
  \n在进行面谈评估时，在询问组织如何满足控制目标时要给予人性化关怀。我通常会写出问题，并以对接收方讲得通的方式提问。例如，`PR.DS-01` 指出：“*静态数据的机密性、完整性和可用性受到保护。*”\
  \ 这是什么意思？防范什么？\n\n这是一个非常开放式的问题！重述它以使其讲得通，例如：“*您如何保护数据？数据是否加密？您是否绘制了数据流图并知道敏感数据驻留在何处？*”\
  \ 这些只是与该控制相关的几个问题。您可能会问自己：“*我怎么知道该控制涉及所有这些问题？*” 如果您需要澄清，最好的查阅地点是该控制的信息参考资料。\n\n\
  `PR.DS-01` 引用了 `CIS` 控制 13 和 14。控制 13 涉及数据保护，而控制 14 涉及如何控制数据访问。`CIS` 中的每个控制族也都有子控制。不过，如果您对来自\
  \ `CSF` 的控制有任何疑问，请查看参考文档以获取更多清晰度。\n\n## 完成评估\n\n一旦评估的问卷部分完成且您收集了所有证据，就可以进行评分了。在汇总分数时，请记住将答案和证据与我们之前讨论的层级对齐。在评估答案时，请考虑风险概况、组织如何计划降低网络风险，以及业务如何就该控制与其上游和下游提供商互动。\n\
  \n这些分数有助于了解您的整体网络风险以及将精力集中在何处。例如，请查看 `表 2.1`：\n\n| 功能 | 类别 | 子类别 | 分数 |\n| --- |\
  \ --- | --- | --- |\n| 响应 | `RS.AN` | `RS.AN-03` | 25 |\n|  |  | `RS.AN-06` | 50\
  \ |\n|  |  | `RS.AN-07` | 25 |\n|  |  | `RS.AN-08` | 75 |\n| 平均子类别分数 |  |  | 43.75\
  \ |\n\n表 2.1 – `NIST CSF` 分析类别\n\n`RS.AN` 类别的平均分为 43.75。这使您的总体层级处于第 2 级。您应该以什么分数为目标？嗯，这取决于您的组织以及您愿意接受的风险水平。在我看来，最佳平衡点是第\
  \ 3 级。这意味着组织拥有经管理层批准或全组织范围内实施的策略、标准和程序，业务了解其在更大生态系统中的角色，且已具备弹性。\n\n## 结束面谈\n\n结束面谈是评估过程的最后一步，用于报告发现。发现是指在\
  \ IT 资源、策略文档或图表中发现的缺失或不充分的控制。作为首席评估员，您有责任创建报告并向组织内的关键利益相关者汇报。\n\n\n\n报告应详细记录调查结果、收集的证据以及员工对问题的回答。调查结果可以是缺失的控制措施，或不符合预期或标准的控制措施。例如，在评估过程中，您可能确定六个\
  \ IT 资源中有四个安装了防病毒软件，而另一个资源虽然安装了但未接收更新。这些调查结果随后会被纳入**行动计划与里程碑**（或项目计划）中以进行整改。\n\n\
  调查结果不仅针对 IT 资源上设置的配置项；它们也可能来自书面文档。策略文档难以编写，编写优秀的策略更难。策略文档的编写应使新分析师或工程师能够阅读文档并确切知道该做什么以及如何做。您还需要建立\
  \ IT 策略文档生命周期，以审查和批准 IT 策略文档。\n\n策略文档中的调查结果不像查找 IT 资源问题那样容易。阅读并理解文档意图并找出漏洞需要技巧。也许您在程序中遗漏了关键步骤，或者存在一项要求使用传统协议的加密标准。这些应被视为可报告的调查结果，并在离场面谈过程中重点强调。\n\
  \n随着离场面谈流程的结束，我们现在可以创建当前状态概要和未来状态概要。当前状态是您网络安全计划目前所处的阶段，而未来状态是您预见组织在不远的将来所要达到的阶段。\n\
  \n## 当前状态\n\n当前状态概要基于组织在特定时刻与 CSF 的契合度。这种契合度考虑了 IT 资源配置、策略文档和实践。这是您整体计划的当前快照。当前状态还描绘了组织的整体网络风险态势。相关工作已通过您在离场面谈过程中的汇报完成。现在，是时候制定您的战略路线图了。\n\
  \n## 未来状态\n\n我们在评估阶段投入了所有艰苦努力，并向高管领导团队报告了调查结果；现在，是时候制定我们的未来状态了。未来状态概要描绘了您计划在未来两到五年内将网络安全计划推向何方。这是您将组织网络风险降低到可接受水平的策略。\n\
  \n现在是制定项目计划或**行动计划与里程碑**（**POA&M**）的时候了。这是您打算制定的用于整改报告中调查结果的计划。您需要与领导团队坐下来，更好地了解他们的目标以及他们认为有风险的事项。这是您评估环境并决定什么是“易解决的问题”（低垂的果实），迅速消除它们，同时为重大项目制定更大规模\
  \ POA&M 的时机。\n\n## 总结\n\nNIST CSF 包含丰富的信息，可用于建立您的网络安全和风险管理计划。框架核心由六大功能、其类别和子类别控制措施组成，用于降低组织中的网络风险。该框架将协助您和您的团队提升态势并使计划成熟。\n\
  \n虽然许多人根据成熟度模型对 NIST CSF 进行评分，但它应根据风险进行评估。这是 CSF 的真实意图，也适用于其他框架。风险进一步在三个单独类别中进行评估——风险管理流程、综合风险管理和外部参与。在根据框架层级评估组织时，请记住我们是针对风险及其在更大生态系统中的地位进行评估。\n\
  \n弹性是否内置于设计中？策略文档是否与业务目标保持一致？文档是来自组织层面，还是局限于部门内部？这些都是评估期间应提出的问题。\n\n在评估这些问题时，请确保它们符合框架层级的要求——从几乎不存在任何措施的第\
  \ 1 层，到一切均可适应并针对效率进行优化的第 4 层。请记住，第 3 层才是您计划真正的“最佳平衡点”。虽然第 4 层可能是效率的巅峰，但有时由于其成本无法实现。成本不仅可能由货币价值定义，还可能涉及人力资源。\n\
  \n概要用于了解您目前在计划中的位置，以及您在未来三到五年内努力争取达到的位置。当前状态概要描绘了特定时间点网络安全计划的状态。未来状态概要是您关于计划发展方向的策略。随着您继续推进策略，请记住制定\
  \ POA&M 以规划您的项目。\n\n在接下来的章节中，我们将回顾这六大功能，以及如何利用它们来调整您的网络安全计划。\n\n## 参考资料\n\n1.  [`www.beyondtrust.com/blog/entry/the-state-of-identity-security-identity-based-threats-breaches-security-best-practices`](https://www.beyondtrust.com/blog/entry/the-state-of-identity-security-identity-based-threats-breaches-security-best-practices)\n"
- '# 第 2 部分：NIST 网络安全框架功能


  该框架由六个不同的功能组成，所有功能均旨在降低组织内的网络风险。在所有功能的中心是*治理*，它指导框架内的所有其他功能。本部分将引导您识别资产、检测威胁并从事件中恢复。


  本部分包含以下章节：


  *   *第 3 章*，*治理*

  *   *第 4 章*，*识别*

  *   *第 5 章*，*防护*

  *   *第 6 章*，*检测*

  *   *第 7 章*，*响应*

  *   *第 8 章*，*恢复*

  '
- '## 3


  ### 治理


  在上一章中，我们了解了 NIST **网络安全框架**（**CSF**）\[*1*\] 及其三大组成部分：**核心**、**层级**和**概要**。我们了解到核心由六个不同的功能组成：**治理**、**识别**、**防护**、**检测**、**响应**和**恢复**。每个功能涉及不同的控制目标，用于降低网络风险。


  我们对每个子类别应用层级（或评分），以更好地了解我们的风险态势。层级范围从 1 到 4，每一级从对风险的很少评估递增到持续评估和改进。我们还学习了如何将**戴明循环**应用于我们的流程，以便它们能从较低层级提升到较高层级。


  最后，我们创建了概要，以了解安全计划目前的位置，以及我们计划在未来 3 到 5 年内将其带向何方。请记住，我们不应采取*形式主义打勾*的方法对待网络安全。这是一个计划，不应只是打个勾就翻篇。它需要专门的人员、流程和技术，以确保计划在降低网络风险的同时保护组织。


  本章将涵盖**治理功能**。治理是 CSF 2.0 的新功能类别，位于框架中几乎所有其他功能的核心位置。从根本上说，治理旨在将网络安全计划与业务目标保持一致。这包括理解和推广业务使命声明、如何确定风险并建立风险管理阈值，以及大量关于角色和职责的文档记录。


  在本章中，我们将涵盖以下主题：


  *   组织背景

  *   风险管理策略

  *   角色、职责和权限

  *   策略

  *   监督

  *   **网络安全供应链风险管理**（**C-SCRM**）




  # 那么，让我们更仔细地看看最新的功能：治理！


  # 技术要求


  随着我们在本书中逐步深入这六大功能，每一章都将围绕框架中的控制措施和子控制措施进行构建。子控制措施将包含子控制的标识符及其目标。每个目标均直接引用自框架，以避免本书与框架之间产生混淆。有关框架的更多信息，请查看本章末尾的
  `References` 部分。


  # 组织背景 (GV.OC)


  组织背景旨在使您和您的网络安全计划与业务目标保持一致。该计划是符合还是偏离核心业务目标？风险如何被识别并传达给关键利益相关者？也许您的业务还要求您遵循其他框架或法规要求。这将如何影响您的计划？


  ## GV.OC-01


  `组织使命被理解并为网络安全风险管理提供依据。`


  您的组织极有可能有使命和愿景声明，但您知道它们是什么吗？使命和愿景声明旨在帮助推动公司的宗旨。它们也旨在面向公众，以便客户甚至股东能够了解公司追求的目标。


  使命声明是一段简短的陈述，阐述公司开展业务的原因以及如何定义其目标和价值观。这些声明不必很长；事实上，世界上一些最大的组织的使命声明仅有一两句话。让我们看几个例子：


  *   `To empower every person and organization on the planet to achieve more.` –
  Microsoft.

  *   `To bring the best user experience to customers through innovative hardware,
  software, and services.` – Apple.

  *   `To be the Earth’s most customer-centric company.` – Amazon.


  正如您所见，这些声明每个都只有一句话，简洁明了。愿景声明也不例外。让我们看看这同三家公司的愿景声明。


  *   `To help people and businesses throughout the world realize their full potential.`
  – Microsoft.

  *   `To make the best products on Earth and to leave the world better than we found
  it.` – Apple.

  *   `To become Earth’s best employer and Earth’s safest place to work.` – Amazon.


  愿景声明旨在为实现某个目标而努力。该目标可以是短期或长期的，也可以仅限于公司的存续期限。无论如何，它旨在陈述公司未来打算实现的目标。


  您的网络安全计划与这些声明一致吗？您能否将计划与上述声明保持一致？网络安全计划拥有自己的使命和愿景声明也并不罕见——许多计划都有。关键在于理解总体业务目标，并调整您的计划，使其不阻碍业务实现这些目标。


  ## GV.OC-02


  `内部和外部利益相关者被理解，且其关于网络安全风险管理的需求和期望被理解并予以考虑。`


  许多组织和安全部门喜欢举着“不！”的牌子。这意味着无论您作为组织做什么，都注定会从安全部门听到“不！”的声音。“我们必须防止孩子们拿着剪刀奔跑！”这阻碍了业务履行其满足客户或其他利益相关者需求的职责。


  任何计划，无论是否与网络相关，都必须获得高层的支持；否则，计划将无处可去。是时候了解您的利益相关者是谁，并理解他们了，不仅在专业上，也在个人层面。这是您需要与所有利益相关者建立关系的时候。


  在利益相关者会议期间提问，以便了解他们是谁以及什么驱动他们。他们是否理解网络相关概念并知道他们的风险承受能力？如果不了解，就进行这些对话，以便您知道他们在云、人工智能、多因素认证以及政策和标准等相关问题上的立场。


  在进行这些对话时，也要在个人层面上了解他们。这将有助于让您和小组中的其他人都感到舒适，以便他们在向您提出问题时感到自在。您还应该与员工进行一对一的交谈；这些不仅仅是给高管的。所有这些都是为了推动关于风险和风险偏好的对话。


  您还需要与外部利益相关者建立关系。这些包括执法部门、供应商，甚至网络安全社区内的同行。这些关系旨在危机时刻为您提供帮助。有许多 `Information Sharing
  and Analysis Centers` (`ISACs`) 您可能可以加入。非营利组织以及州和地方政府可以成为 `Multi-State ISAC` 的一部分。汽车制造商拥有
  `Auto ISAC`，甚至还有一个金融组织可以加入的 `financial services ISAC`。


  `ISACs` 是一项极好的资源，因为它们与成员共享急需的威胁情报。这些威胁情报非常有用，特别是对于特定行业的组织，有助于在应对影响这些组织的威胁和漏洞时推广网络安全最佳实践。


  ## GV.OC-03


  `关于网络安全的法律、法规和合同要求——包括隐私和公民自由义务——被理解并得到管理。`


  因此，您已决定利用 `NIST CSF` 作为您的基准框架。您的组织在 CSF 之上可能还有其他法律和法规合规要求。例如，`human resources` (`HR`)
  可能必须遵守 `Health Insurance Portability and Accountability Act` (`HIPAA`)，财务部门可能必须遵守
  `Payment Card Industry Data Security Standard` (`PCI DSS`)，或者组织整体甚至可能必须遵守国际法规要求，如
  `General Data Protection Regulation` (`GDPR`)。


  在 `GV.OC-02` 中，我们讨论了与关键利益相关者建立关系——这就是原因。关键利益相关者或 `executive leadership team` (`ELT`)
  应了解这些合规要求类型以及组织开展业务的地点。如果 `ELT` 中有人提到某部门为业务交易接受信用卡，您应立即想到 `PCI`。如果您的环境中有健康记录，则必须遵循
  `HIPAA` 中的隐私和数据安全保护规定。但您如何知道在哪里应用控制措施？


  例如，`PCI DSS 4.0` 规定密码必须至少 12 个字符，但您的公司标准是 10 个；您该选哪个？对于这些场景，您必须选择最严格的控制措施。在此例中，您必须对所有处理、存储或传输信用卡信息的系统应用
  12 字符的密码。您可能还有对系统或 IT 资源进行远程管理时要求多因素认证的规定。这也将影响您对这些系统的认证方式。


  在许多情况下，如果您不遵守这些要求，将面临罚款。在某些情况下，因疏忽可能会被撤销执行此类操作的能力。试着向您的 `ELT` 解释为什么您无法再进行信用卡交易，因为您未能通过上一次
  `PCI` 评估。


  您应该了解您的组织可能有哪些类型的法规要求，以及它们如何整体应用于网络和 IT。这不仅会让您在工作中更出色，还将使组织能够继续与客户开展业务。


  ## GV.OC-04




  *外部相关方所依赖或期望的组织关键目标、能力和服务已被理解并传达。*


  正如我们将在 `Identify`（识别）功能中看到的那样，清点 IT 资源是网络安全的关键部分。首先，我们必须识别环境中拥有的资产，然后为这些资产应用关键性标签。这些
  `Identify` 功能控制将直接影响您实现此目标的方式。


  我们需要识别资产、应用关键性标签，并确保我们也在计算失去该资产的风险。例如，假设您有一台向客户销售产品和服务的 Web 服务器。如果该系统因某种原因宕机，将如何影响您的公司和外部客户？


  亚马逊作为全球最大的零售商之一，在 2013 年经历了一次中断，据估计每分钟损失 66,240 美元，持续期间总计近 200 万美元 \[*2*\]。贵公司会经历这样的中断吗？我们大多数人会说不会，因为这会立即让我们倒闭。


  此控制旨在突出您提供的系统和服务的关键性。医院也是如此，勒索软件攻击可能导致急诊室和手术室瘫痪，使客户无法获得关键护理。中断将如何影响您和您的客户？


  您可以通过了解 IT 资源的 `confidentiality, integrity, and availability`（机密性、完整性和可用性）（`CIA`）来定性计算其关键性。通过向
  `CIA` 三要素应用低、中、高水印，可以帮助您了解系统的关键程度。


  例如，如果您决定为可用性应用高水印，您将需要考虑 `high availability`（`HA` 高可用性）以构建资源冗余。如果因为处理健康记录，数据的机密性和完整性为中等，则将实施更多控制以确保信息保留在企业网络和员工的范围内。


  NIST 还有另一类文档，称为 `Federal Information Processing Standards`（`FIPS` 联邦信息处理标准）。在这些文档中，您将找到一份名为
  `FIPS 199` 的文件，其中详细介绍了如何计算 `CIA`，以及可应用于 `CIA` 三要素的各个水印的定义 \[*3*\]。


  # GV.OC-05


  *组织所依赖的成果、能力和服务已被理解并传达。*


  清点内部资源只是您识别所拥有资源的总体需求的一部分。清点外部资源也至关重要。这包括清点所使用的软件和硬件。按层级结构对这些资产进行分类，以便了解它们对组织的重要性。


  此外，还要考虑外部第三方使用的 `cloud service providers`（`CSPs` 云服务提供商）。许多提供商在其网站上发布其认证情况，宣传资产上实施的安全控制。请务必每年审查这些文件，以确保提供商维持的安全级别在组织的风险承受范围内。


  从使命和愿景声明到了解成功运行项目所需的各种合规要求，它们在评估网络风险时所需的细节各不相同。我们将要考虑的下一个控制系列讨论了如何在组织中实施风险管理策略。


  # 风险管理策略 (GV.RM)


  虽然风险识别可能不从组织高层开始，但关于它的讨论应该从高层开始。ELT（高级领导团队）必须就组织如何管理和消除与业务运营相关的风险进行这些讨论。这包括管理组织内部和外部的资产。这也引起了对企业风险管理需求的关注，将在本节后面讨论。


  ## GV.RM-01


  *风险管理目标已确立并获得组织相关方同意。*


  在 *第 2 章* 中，我们讨论了为当前和未来状态目标构建概况。这些计划应至少每年更新一次，以预测用于最小化网络风险的总体战略。评估当前和未来状态可以更好地为您更新整体网络战略做准备，并使您朝着预期目标前进。


  这并不意味着应将风险从该目标中移除。请与高级领导或 ELT 进行讨论，以确保您未来 6 到 12 个月打算开展的网络安全举措与需要实现的总体业务目标保持一致。


  您还需要使这些目标可衡量，这意味着您必须拥有良好的指标来支持您的工作。您能衡量正在修复的漏洞数量吗？您的网络安全意识和培训与行业标准相比如何？如果没有可衡量的目标，您如何能衡量实施这些计划所取得的成功？


  ## GV.RM-02


  *风险偏好和风险容忍度声明已确立、传达并维护。*


  我们将在本书后面讨论如何制定政策管理计划；但重要的是要注意，风险容忍度必须以书面形式编写并与相关方沟通。就像层级以及我们将如何根据这些层级评估风险一样，风险容忍度应以大致相同的方式进行评估。


  如果不围绕风险容忍度进行这些讨论，并将假设或已知情况记录在纸面上，您的员工可能不知道如何处理风险。关于 ELT 希望如何处理风险的假设，应立即向下传达至整个组织，以便他们在风险出现时也知道如何处理。


  此外，要建立关于风险如何被识别和解决的指标。风险是否已完全修复，还是留下了残余风险？您如何处理残余风险，以及如何记录它以供未来评估？每个资产或 IT 资源都应有一个随附的风险登记册。该风险登记册用于记录环境中识别出的风险，并制定项目计划以说明您打算如何修复这些风险。


  最后，在记录已识别的风险及您打算如何修复它们的同时，围绕此建立指标。这将帮助您构建您如何应对全组织风险的故事。您还可以详细说明在尝试消除或降低风险时什么有效、什么无效。并非所有风险都能被消除，将所有风险完全降至零是不可能的。然而，降低风险的计划很重要，您讲给别人听的故事将决定项目的成败。


  ## GV.RM-03


  *网络风险管理活动和成果已纳入企业风险管理流程。*


  如果您的组织还没有降低风险的方法，您将需要建立一个。在评估 IT 资源上的风险时，您可以针对每个资源、范围环境或整个 IT 基础设施建立一个风险登记册。关键在于，您如何识别风险并向组织的其他部门推广这种风险识别？


  至少，风险登记册应执行以下操作：


  *   描述资产

  *   识别风险

  *   说明风险被利用的可能性

  *   说明谁负责修复风险

  *   说明成本 – `CapEx`/`OpEx`

  *   说明计划修复时间表

  *   说明修复责任归属




  我强烈建议为每个范围界定的环境保留一份风险登记册。这样做可以最大限度地减少您在查看资源时必须搜索的风险数量。我还强烈建议建立一份企业级风险登记册，它不仅涵盖针对范围界定区域识别出的风险，还展示组织中识别出的所有风险。


  创建企业级风险登记册将汇集每个范围界定环境的所有已识别风险。排名最高的风险应位于环境中所有 IT 资源的企业级风险登记册的顶部。这将帮助您识别与所有事物相关的风险，而不仅仅是您关注的那几个资产。


  也要纳入其他部门的风险。在制定风险登记册时，合规风险和声誉风险常被忽视。正如我们在后续章节将看到的，声誉风险往往难以补救，因为您正试图在发生违规或其他事故后将自己宣传为一个安全的组织。


  ## `GV.RM-04`


  > *建立并沟通了描述适当风险应对选项的战略方向。*


  一旦识别出风险，您必须采取行动应对。我们之前讨论过实施政策和标准以规定如何处理风险的必要性。然而，如果我们不打算执行任何进一步的缓解措施来消除风险，该如何接受甚至转移风险呢？


  组织应有接受组织所面临风险的方式。应建立一个审批流程，允许 ELT（高管领导团队）成员审查并选择接受、缓解、转移或完全规避风险。如果风险得到缓解，那就很好——工作几乎完成了。如果存在剩余风险，或
  ELT 决定直接接受的风险，必须有审批流程。


  这可以通过收集签名或使用 ELT 成员的某种批准盖章来实现，声明该风险对组织几乎不构成威胁或不构成威胁。如果风险不可避免怎么办？许多组织还会购买网络保险，将该风险转移给第三方。您应与保险提供商进行这些讨论——通常，他们的风险容忍度低于您的组织。请记住，如果/当您的组织发生事故时，保险公司也要承担责任。他们和您的组织一样，是为了赚钱，而不是赔钱。


  ## `GV.RM-05`


  > *组织内部建立了针对网络安全风险的沟通渠道，包括来自供应商和其他第三方的风险。*


  在讨论组织内的网络风险时，沟通渠道应保持畅通。虽然识别网络风险以及我们如何沟通该风险始于高层，但它必须向下贯穿整个组织。您的企业架构团队、工程师和分析师是实施控制并确保风险从环境中移除的人员。


  必须有一个从工程师和分析师反馈回高层的闭环，以便 ELT 了解任何不足之处。也许某个特定的补救措施无法完成，因为您缺少某种控制，或者您拥有的控制因功能缺失而无法解决问题。这必须被沟通和讨论，以确保所有相关方朝着共同目标努力。


  您的计划是否也包含如何沟通和应对可能发生在组织不同区域或部门的事件？例如，您告诉员工进入大楼时不要尾随他人。然而，这要求您制定开放沟通政策，以便有人发现此情况时能够上报。在该计划中，您应明确联系谁以及何时联系，以便员工知道该怎么做。例如，当发生孤立事件时，让员工联系其直属主管或经理；如果多次发生，则上报给您的
  CISO（首席信息安全官）。


  这也要求您的第三方供应商和供货商做同样的事情。请确保您拥有关于供应商出现问题时如何应对的联系信息。通常，在与另一提供商合作时，他们会要求您在事件响应呼叫树中包含他们的联系信息，以便您知道出现问题时联系谁。


  ## `GV.RM-06`


  > *建立并沟通了一种用于计算、记录、分类和优先排序网络安全风险的标准化方法。*


  风险通常使用以下公式计算：


  `Risk = Likelihood * Impact`


  这些风险评分也应包含在前面讨论的风险登记册中。这种风险计算将有助于识别最重要的风险，并为补救工作确定优先级。


  您如何根据这些数字及其对组织的整体风险来确定优先级？这往往比单纯使用计算更难理解。然而，您不应仅根据计算出的风险数字来确定优先级，还应考虑谁可能访问该资源。例如，假设您在一个内部资产上有多个高风险，该资产位于两个不同的防火墙之后，只有
  10 个人可以访问它。您在一个面向公众的资产上也有一个高风险和几个中等风险。您应该先修复哪一个？


  这个问题经常被提出，但许多人忽视了它的重要性。我曾让一位经理向一组初级分析师解释过这个问题。多年前，在互联网出现之前，人们必须开车去银行，要么进大厅，要么使用汽车通道办理业务。虽然存在银行被抢劫的风险，但风险很小，因为抢劫者必须亲自到银行才能实施抢劫。


  现在，有了互联网，您不必亲自到场——您可以身处世界任何地方，尝试从银行取走资金。由于任何拥有互联网连接的人现在都可以成为客户，或者更糟，做一些坏事，风险概况大大扩展了。


  这里的风险是，数十亿人可能会暴露面向公众网站上的弱点。虽然位于两个防火墙后的内部网站上可能存在 `CVSS 10.0` 漏洞，但它不如位于公共服务器上、可被 300
  亿台设备访问的 `CVSS 7.0` 漏洞风险大。


  ## `GV.RM-07`


  > *战略机遇（即正向风险）被识别并纳入组织网络安全风险讨论中。*


  我们中的许多人从消极角度考虑网络风险。例如，假设发现了一个新漏洞，您有两个系统易受其影响。这是负向风险。然而，也存在正向风险，它们以风险降低措施或获取对策以纠正已识别风险的机会形式出现。


  您应对负向和正向风险进行分析。这将有助于与员工和 ELT 就您如何最大限度地减少环境中的负向风险进行交流。正向风险可以通过降低与资产相关的风险来实现，这可以与整体业务目标保持一致。


  您已识别出，由于缺乏漏洞识别系统，您无法将漏洞最小化。这应该促使您获取一个应用程序来执行这些扫描。获取缓解控制是一项正向举措。您现在已经找到了收集漏洞信息的方法，并制定了如何将环境中的这些漏洞最小化的策略。一个正向成果是，您在短短几周内修复了，比如说，10
  个漏洞。





  # 风险管理概述


  NIST 接着将正向风险描述为**实现、分享、强化和接受**，而负向风险应对则包括**缓解、接受、规避和转移**。正向风险是指在环境中执行风险降低的优势或机会。正向风险连同负向风险，也应录入**风险登记册**以便跟踪。


  定期重新评估你的**网络风险态势**非常重要。这样做是为了确保你走在正确的轨道上。这应包括你如何评估**风险容忍度**，以及谁负责接受风险。


  接下来，我们将了解 `C-SCRM`。这很重要，原因你将在下一节看到。


  # `C-SCRM` (GV.SC)


  如果你关注网络安全新闻，就会注意到供应链管理中存在大量网络风险。第三方软件和服务是组织的易攻击目标，因为深入调查供应商网络风险的做法仍不普遍。然而，`SolarWinds`
  开发的软件，以及许多开源工具（如 `PyTorch`）都容易受到此类攻击，我们应持续关注此项工作。


  作为网络安全专业人员，你有责任确保你无法控制或不控制的 IT 资源至少经过**审查**。此审查过程将凸显供应商的网络安全态势及 `BCP`/`DR 策略`，并帮助你更好地了解你所使用的软件是如何开发的。


  ## GV.SC-01


  > *`C-SCRM` 计划及其战略、目标、政策和流程已建立，并获组织相关方认同。*


  如果计划已存在，现在是评估你如何评估第三方供应商的时候了。此评估将揭示计划的现状，以及如何为未来与这些第三方及其他意向合作伙伴的合作对其进行调整。


  该战略应包含你如何审查第三方，以确保其满足或超越你的网络安全态势期望。如果你决定与供应商签订合同，应制定计划以了解其网络安全态势。无论你是想采用 `SIG Lite`
  或 `COBIT` 等问卷，还是采用与你的网络安全框架紧密对齐的问卷（如 `NIST CSF` 或 `ISO 27001`），你都需要为审查过程选择一种。


  许多组织会前往供应商托管软件的设施实地考察，以便更好地了解其态势。这是最好但也最昂贵的途径，因为这可能意味着派遣一名或多名员工前往供应商现场进行评估。


  制定政策和标准可确保组织中的其他人在了解网络安全态势方面跟随你的步伐。你最不希望看到的情况是 IT 部门正在执行审查流程，而财务部门却在未询问安全态势的情况下直接接受了供应商的条款和条件。


  许多云服务供应商（如 Microsoft 和 Amazon）会在其网站上发布其网络安全认证证书（如 `ISO 27001`）。这是为了让有意与供应商签约的一方能更好地了解其态势。这可以减轻评估的需求，因为文档已可供审阅。大型云服务供应商不像小型供应商那样会填写问卷，也永远不会填写，所以在选择合作对象时要慎重。


  还应成立第三方风险管理委员会。该委员会的职责是审查供应商带来的企业风险。组建委员会时，应包含全组织各部门人员，而不仅限于 IT 部门。该委员会将审查所有新加入组织的供应商，以及当前正在合作的供应商。


  ## GV.SC-02


  > *供应商、客户和合作伙伴的网络安全角色和职责已确立、沟通，并在内部和外部进行协调。*


  角色和职责详细规定了在特定计划中谁负责什么。在此例中，我们应与所有参与 `C-SCRM` 计划的人员共同创建一份 `RACI` 图表。


  在 `GV.SC-01` 中，我们简要提到了创建负责第三方风险管理的风险管理委员会。该委员会应设主席或负责管理计划的人员，以及负责计划所有其他方面的人员。该委员会还应有来自
  `ELT` 的发起人，以确保委员会获得有效履职所需的支持和监督。


  此 `RACI` 图表可规定主席对风险管理计划的所有方面负最终责任，而其他部门可能负责审查直接与其相关的问卷。每个部门应负责审查问卷并接受咨询，以确保问题的答案在风险阈值之内，而委员会外的人员在审查过程完成后只需被告知即可。


  此外，确保这些流程有文档记录，以便其他人在引入新供应商时知道该做什么。如前所述，如果某部门自行引入新供应商却不询问其如何保护你的组织免遭信息盗窃或丢失，这对任何人都没有好处。


  最后，应建立一套机制，允许其他部门选择组织已审查过的可合作的第三方。无论这汇总到企业风险仪表盘中，还是形成一份简单的可选供应商清单，组织内部人员都应有途径选择供应商，并有标准说明为何可选择该供应商。


  例如，你可能已审查一家金融公司并与其合作。选择这家金融公司是为了向其提供全体员工用于退休目的的敏感银行信息。然而，该金融公司现请求在你的网络中放置一台服务器用于批量文件传输。虽然你可能仅针对传输敏感数据审查了这家金融公司，但允许他们在你的网络中放置文件服务器并由其管理，这构成了一项新风险。


  这将需要另一条工作流，因为你现在有了一个可远程管理你环境中系统的供应商。其他供应商亦然——如果你或另一部门决定采购不同的产品和服务，这将需要对他们的安全态势进行又一次评估。


  ## GV.SC-03


  > *`C-SCRM` 融入网络安全和企业风险管理、风险评估及改进流程中。*


  正如我们之前创建企业风险管理计划和风险登记册时所做的那样，我们必须对供应商做同样的事。在审查过程中，必然会有未按我们期望回答的问题，或我们担心控制措施缺失的情况。如果你决定仍要与该供应商开展业务交易，相关网络风险应录入风险登记册。


  一旦识别出这些风险，应着手处理，以便由你的组织和供应商共同完成整改。这是双方公司的**共同责任**，因为双方都有共同利益，确保交付的产品和服务尽可能安全。






  当事情不按计划进行时，也应有一条升级路径。在审查过程中，确保询问有关灾难恢复和业务连续性的问题。贵组织使用的产品和服务可能会变得对贵组织至关重要。您需要确保供应商遵守其
  `service-level agreements` (`SLAs`) 并及时提供您所要求的服务。


  例如，假设您已审查并选定另一家金融机构为您的员工发放工资。您是否询问了正确的问题，以确定他们在需要时能否履行职责？如果他们的系统遭受恶意软件攻击，因系统瘫痪而无法支付员工工资，该怎么办？贵组织或您是否有应对漏发工资的备选计划？


  确保在制定网络安全战略时，其中包含第三方风险管理。他们是贵组织的延伸，当事情不按计划进行时应承担责任。如果供应商不符合贵组织政策的合规要求，请跟进以确保其符合贵组织的网络风险承受能力。


  ## GV.SC-04


  已知供应商并按关键性确定优先级。


  在识别第三方供应商时，确保它们关联了关键性标签。这是为了确保在危机发生时，您知道哪些供应商对贵组织最重要。这并非说所有供应商都很重要——只是有些比其他的更重要。


  例如，为员工发放工资的金融机构具有高度关键性，而提供笔和铅笔的办公用品公司则相对较低。两者都有其重要性，只是其中一个更为关键。


  ## GV.SC-05


  建立、优先处理并将应对供应链网络安全风险的要求纳入与供应商及其他相关第三方的合同及其他类型协议中。


  应建立一套机制，以便在第三方不符合贵组织政策和标准时追究其责任。通常，这是通过条款和条件或主协议合同来实现的。在这些文件中，应明确规定：例如，如果您决定签署一份为期
  3 年的服务协议，供应商在该期间内必须维持一定的合规水平。这意味着他们不能仅在第一天表现优异，然后在合同剩余期限内松懈下来。


  值得注意的是，这不仅包括公司本身，还包括其员工。询问他们是否对员工进行背景调查。并非所有项目都要求这一点，但许多项目都有此要求。检查他们如何监控员工，以防止敏感信息被盗或遭受内部威胁。


  如果涉及软件开发，要求供应商提供 `software bill of materials` (`SBOM`)。该 `SBOM` 应详细列明所使用的软件类型、编程语言、他们如何审查软件的缺陷和漏洞等。您甚至可以要求供应商提供证据，证明他们正在扫描系统漏洞以及如何计划修复这些漏洞。如果软件随时发生变更，`SBOM`
  应更新以反映变更，并发送给您和贵组织。


  不要因为软件是由供应商开发的就产生一种安逸感，认为它没有缺陷或漏洞。通常，软件会外包给另一家公司进行开发。确保您正在扫描软件并及时修复这些漏洞。这可能意味着必须回过头去找供应商，以确定在贵组织或供应商环境中运行未修补软件的风险等级。


  合同还应包含一条款，规定如果贵组织认定供应商已不合规，或未按其 `SLAs` 履行义务，则贵组织可终止合同。贵组织的信息至关重要，不应由第三方决定您如何保护环境。请记住，发生事件时，署名的是贵组织，而非供应商。


  ## GV.SC-06


  在建立正式的供应商或其他第三方关系之前，执行规划和尽职调查以降低风险。


  如前所述，我们提到了 SIG Lite，这是由 `Shared Assessments` 编制的一份问卷。该问卷提出一系列问题，旨在推广或突出供应商的网络安全状况，并更好地了解其不足之处。COBIT
  是另一个可用于询问供应商网络风险管理计划的框架。有数百份预定义的问卷可供使用，您也可以自行编制。关键在于您要审查供应商的网络安全计划，并查看其与贵组织的契合度。


  这些问卷不一定是一次性的——它们可以每年发送一次，以确保供应商维持其安全态势。如果第三方利用 CSP 托管其平台，也应评估该 CSP。这些被称为 Nth 级供应商。因为您选择的供应商也有其合作的供应商，所以它们常被称为第四方。


  ## GV.SC-07


  在整个关系期间，理解、记录、优先处理、评估、应对并监控供应商、其产品和服务以及其他第三方带来的风险。


  一切尘埃落定，收集完问卷和证据后，便是审查材料的时候了。此次审查应将提供的答案和证据与贵组织的政策和标准进行对齐。如果在审查过程中由于某些原因发现供应商有大量改进机会，可能需要讨论今后如何与该供应商合作。或者如果风险过高，可以完全取消合同。


  如果决定继续合作，但网络安全态势薄弱，您可能希望在合同中写入年度审查流程。该审查流程应考虑供应商在其环境中修复薄弱控制措施的情况。如果认定供应商在修复发现的问题上没有进展，则可能是取消合同时机。


  您和供应商管理委员会还需考虑：如果该服务发生中断——或者更糟，因控制措施薄弱而不得不取消合同——会发生什么？在没有该服务的情况下，贵组织将如何运作？能否在没有该服务的情况下生存一小时、一天或一周？在审查供应商重要性及使用其工具时，这些都是需要考虑的问题。


  ## GV.SC-08


  将相关供应商和其他第三方纳入事件规划、响应和恢复活动中。


  我们已经稍微涉及过这一点，但您将如何向供应商通报问题？供应商将如何向贵组织通报问题？这两个问题是本目标的前提。事件发生时沟通至关重要，争分夺秒。


  贵组织的事件响应和恢复计划应包含这些信息，以便在问题出现时进行沟通。建立供应商关键性矩阵在中断期间也至关重要。您必须了解供应商的关键性及其向贵组织提供的内容。反过来，您也必须了解贵组织为客户生产的产品和服务。






  # 供应链风险管理 (GV.SC)


  ## 供应商中断沟通与响应


  如果供应商因其 CSP（云服务提供商）出现问题而遭遇中断，该如何通知贵组织？遇到此类问题时如何响应？能否在中断期间故障转移至另一系统？贵组织与第三方供应商必须执行哪些程序才能使服务恢复运行？


  所有这些都应记录在双方同意的运行手册中。如果没有运行手册，至少要有供应商的联系邮箱或电话号码，以便在发生中断或网络相关事件时能联系到他们。如果供应商负责维护服务且服务中断，他们是否制定了危机沟通计划以与利益相关者进行讨论？


  您还可以将第三方供应商纳入桌面推演演练。如果您有维护网络安全运营的托管安全服务提供商，请与他们一起进行桌面推演，以了解双方在事件发生时将如何反应。您需要演练并建立肌肉记忆，明确在事件发生时该做什么以及如何做。


  ## GV.SC-09


  *供应链安全实践融入网络安全和企业风险管理计划，并在整个技术产品和服务生命周期中监控其绩效。*


  供应商管理委员会应与 ELT（高管领导团队）保持直接沟通渠道，或至少与其委员会发起人保持联系。这将使您能够向领导团队传达第三方供应商带来的各种程度的网络风险。此报告还应包括他们如何维护贵组织使用的软件和/或硬件。


  确保第三方定期对其设备和软件执行维护。这将需要审查贵组织和供应商的政策文件，以确定它们是否符合您的预期。任何差异都应录入风险登记册，如果风险足以引起组织关注，则提升至企业风险登记册。


  ## GV.SC-10


  *C-SCRM 计划包含合作伙伴关系或服务协议结束后发生的活动的规定。*


  您应建立流程，在前员工准备离职时收回其持有的硬件和软件。当供应商合同到期且不打算续签时，也应制定类似的政策和标准。


  这应包括从贵组织系统中移除软件，以及移除可能已部署在环境中的任何硬件。如果签订合同时制定了实施计划，在从环境中移除其组件时，您应能按相反顺序执行该文档。


  供应商锁定也是一个问题。许多第三方使用自己的专有格式存储信息。这会使您将数据从一个提供商迁移到另一个提供商变得极其困难。确保合同规定：如果您打算在别处使用这些数据，数据必须能以可读格式传输。


  最后，确保为供应商使用而创建的任何用户账户也从系统中移除。这将防止他们日后登录您的系统，或因环境中存在陈旧用户账户而在基础设施中留下巨大漏洞。


  C-SCRM 对您的网络安全计划至关重要。在与第三方合作时，请记住他们是您网络安全计划的延伸。他们可能持有敏感信息，或控制您部分或全部基础设施。像对待员工一样对待他们。下一节将讨论您、您的员工、ELT
  和第三方供应商之间的角色和职责。


  # 角色、职责与权限 (GV.RR)


  这一控制族侧重于将网络安全融入员工的角色和职责中。从员工入职之初、在岗职责，到员工决定离开组织，网络安全贯穿于员工所做的一切。所有这些都需要记录在案并经管理层批准，因为管理层也必须在计划如何演变和适应新威胁方面发挥积极作用。


  ## GV.RR-01


  *组织领导层对网络安全风险负责并承担问责，培育风险意识强、合乎道德且持续改进的文化。*


  首先，应编写网络安全章程，以确保理解计划的职责。该章程不仅应包含计划和部门的职责，还应包含构成计划的人员的角色。这些角色应由 ELT 确定、理解并批准。


  应制定 RACI 矩阵（责任分配矩阵），以更好地理解组成部门人员的角色和职责。它还应涵盖风险管理委员会的成员。该委员会应对计划和风险管理决策提供监督，以决定如何处理已识别风险。成员可以由同级、ELT
  或组织内其他同事组成。如果需要借助组织外部力量，您也可能希望引入外部法律顾问。


  RACI 矩阵和网络安全章程随后应由 ELT 和风险委员会成员审查并批准。风险委员会负责与组织相关的所有内部和外部风险。他们将决定如何处理风险，但最重要的是，他们将获得
  ELT 的支持，以确保风险得到妥善处理。


  ## GV.RR-02


  *与网络安全风险管理相关的角色、职责和权限已建立、沟通、理解并强制执行。*


  该控制目标与 *GV.RR-01* 类似，即所有内容均记录在案并经管理层批准。网络安全章程和 RACI 矩阵将在确保风险管理经风险管理委员会审查和批准方面发挥重要作用。


  除了这些文件，还需要编写政策和标准。这些政策将用于强制使用委员会，并指导委员会外部人员在引入新供应商时遵循程序。这些政策在您开始在组织中植入网络安全文化时，也将直接影响人员管理。


  您还应确保收集部门的有意义信息或指标，以便展示所取得的进展。随着计划成熟并为部门希望部署到组织的项目或交付物争取额外资金，这一点将变得很重要。


  ## GV.RR-03


  *根据网络安全风险战略、角色、职责和政策分配足够的资源。*


  您制定的用于衡量网络安全计划的指标只是您需要报告内容的一部分。人员绩效和资源分配指标也令人关注。您需要确保拥有足够的资源，以应对作为网络安全计划负责人所面临的挑战。


  您还应确保人员具备执行其所需工作的正确技能。您希望人员接受环境中使用的产品和服务的培训。同样，所有这些都应通过政策和标准提供支持。





  项目规划也可以成为信息来源。这将暴露资源限制（如果有的话），并帮助你意识到项目中的薄弱环节在哪里。牢记这些指标，当你去找 ELT 申请额外资源以维护项目时，将有所帮助。


  ## GV.RR-04


  *网络安全包含在人力资源实践中。*


  我们简要提及了这一点，但你会希望将网络安全实践融入你的 HR 流程中。你需要确保网络安全培训嵌入其入职流程，IT 资源或系统权限得到适当应用，并且 HR 正在为新员工进行背景调查。


  与你的 HR 团队合作，确保网络安全包含在入职流程中。员工刚入职时要对其进行高强度培训（非字面意思）。建立一个健壮的钓鱼测试项目，以强化网络安全培训的必要性，并收集指标以确保项目按预期运行。


  此外，培训你的 HR 人员了解妥善办理员工离职的重要性。你可能希望让 HR 提供 `non-disclosure agreements` (`NDAs`)，以免他们泄露员工正在从事的工作或向新公司提供敏感材料。你可能还希望确保接收员工设备的人确实收到了设备，并且你收回了所有设备。此外，你需要确保员工将所有文件归还给公司。这是为了防止信息泄露，并让网络安全部门能更好地控制所创建的信息。


  描绘角色和职责对你的项目很重要。了解在事件发生期间甚至日常运营期间谁将做什么，有助于你在试图确定谁负责时提供帮助。所有这些都需要记录在案并由政策提供支持，我们将在下一节讨论这一点。


  # 策略 (GV.PO)


  第 10 章将专门讨论策略生命周期管理，但本节将让你一窥该章的内容。你将希望围绕策略创建、批准和文档年度审查建立一个全新的项目。这不是一种 *一劳永逸* 类型的项目——它需要专门的资源来确保项目适当运行。


  ## GV.PO-01


  *基于组织背景、网络安全战略和优先级建立管理网络安全风险的策略，并对其进行沟通和强制执行。*


  如前所述，你将希望围绕策略生命周期管理建立一个全新的项目。该项目将确保策略文档得到制定、经管理层批准，并每年审查一次，以确保文档保持最新。


  你还需要确保策略文档一经委员会批准，就由组织人员审查并签署确认。这将为这样一种情况提供约束力：当员工声称他们不知道现有的策略时。


  还应为文档审查过程创建一个项目委员会。该委员会将负责在政策文档由 ELT 成员或委员会发起人签署批准之前对其进行审查和批准。


  ## GV.PO-02


  *管理网络安全风险的策略经过审查、更新、沟通和强制执行，以反映需求、威胁、技术和组织使命的变化。*


  策略管理的审查过程与创建策略同样重要。策略管理不仅应包含创建策略，还应包含审查策略并在必要时提供策略更新。


  例如，2014 年，多个组织受到 `Heartbleed` \[*4*\] 的影响，该漏洞影响了旧版本的 SSL 和 TLS。也许你有一个加密标准，规定可以使用
  SSL 3.0 版本和 TLS 1.0 及 1.1 版本。然而，一旦 Heartbleed 漏洞被披露，这些版本就被认为是不安全的。


  如果你的标准没有更新，那就意味着在你的环境中仍然可以接受使用旧版本的 SSL 和 TLS。如果没有对策略文档进行充分的审查和控制，这些仍然可能是配置 Web 服务器加密的标准方式。


  确保定期更新你的策略文档。许多法规合规要求规定，你至少每年应审查这些文档一次，如果不更早的话。这是为了确保文档保持最新，并且更新的协议在环境中得到标准化。


  这只是健壮的策略生命周期管理项目所包含内容的冰山一角。我们将在后续章节中更详细地讨论这一点，但重要的是要意识到，你所做的一切也都应该记录在案，并每年或每半年审查一次。这些文档将影响治理的处理方式，我们将在下一节讨论这一点。


  # 监督 (GV.OV)


  治理监督涉及审查整体网络安全和治理项目。在这里，我们将审查 `key performance indicators` (`KPIs`) 或用于衡量项目进度并确保其按预期达成目标的关键指标。这些指标随后用于通知和更新项目，以确保其有效运行。


  ## GV.OV-01


  *审查网络安全风险管理战略成果，以通知并调整战略和方向。*


  在整个章节中，我们讨论了收集指标以衡量项目运行情况的必要性。正是在这个控制系列中，我们审查这些指标以确保项目按预期运行。指标还将证明对额外资源的需求（如果需要），并显示项目薄弱的地方。


  在项目可能薄弱的地方，我们将寻找提高效率的方法来改进该部分。我们可以引入更多资源，或可能引入自动化来改进流程。然而，如果没有指标或 KPI，我们可能不知道效率或缺陷所在。我们需要掌握结果，以了解项目运行得如何。


  ## GV.OV-02


  *审查并调整网络安全风险管理战略，以确保覆盖组织要求和风险。*


  这可能是进行评估的时候了，无论是由你自己还是通过第三方进行。这将帮助你了解缺陷所在以及需要改进的地方。在需要改进的地方，重新调整你的网络安全战略，以确保其满足组织目标和要求。


  这还将要求你和你的团队进行事后复盘或经验教训总结。这在每次事件结束时执行，以便你发现不足之处以及如何克服它们。这将使你能够通过审查哪些不起作用以及哪里有改进机会来改善整体网络安全战略。


  也许你没有为特定流程编写正确的文档。也许你需要制定一个程序来处理特定的网络相关事件。这些场景会在事后复盘过程中进行审查，以确保你能高效地纠正情况。


  ## GV.OV-03


  *组织网络安全风险管理绩效经过衡量和审查，以进行任何必要的调整。*


  监督系列中的这最后一个控制将所有这些整合在一起。再次提取并审查 KPI 或指标，以了解项目运行得如何。确保对缺陷进行审查并按优先级排序以进行改进。收集这些指标并与高级领导分享，以确保项目与业务目标保持一致。





  运行桌面推演或利用事后复盘（为什么不两者都做？）来发现项目的不足之处，并使其朝着改进的方向对齐。构建策略文档并对其进行审查，以确保它们也与业务目标保持一致。请记住，如果没有监督并能够支持
  `ELT`，该项目将不会朝着正确的方向发展，至少不会朝着你所期望的方向发展。


  ## 摘要


  `Govern`（治理）功能包含大量内容。首先，我们了解到必须确保我们的网络安全项目向 `ELT` 传达正确的信息，并将我们的项目与这些举措保持一致。我们必须确保审查公司的使命和愿景声明，以及其业务目标，以便了解这些目标是什么。一旦理解了这些，我们就可以将我们的项目与这些目标对齐。


  我们还了解到，我们需要围绕项目的运行情况建立 `KPI` 或指标。这将突出显示哪些方面行之有效，哪些领域需要改进。将这些与 `ELT` 或委员会的执行发起人分享，以便他们了解项目运行得如何。


  创建带有关联 `RACI` 图表的章程很重要，这样人们才能了解对他们的期望。这些章程随后被用来指导需要开发的各种项目，以支持您的整体网络安全项目。网络安全只是组织变革的催化剂。这种变革将带来更多需要开发的项目，以维持整体网络安全项目。


  策略和风险管理是为维持组织内网络安全而将创建的众多项目中的两个。这种变革将影响公司内的多个部门。从 `HR` 到财务，您将需要与这些部门及其他许多部门密切合作，以确保项目顺利高效地运行。


  这些变化还将影响您与第三方供应商的合作方式。项目需要确保采购的产品和服务在其既定的 `SLA` 范围内按预期运行。在评估供应商的安全状况时，需要进行额外的审查。向这些供应商发送问卷，并要求他们提供证据，证明他们遵循了既定的指南。当他们未达到您的期望时，让他们承担责任。


  最后，更新与第三方供应商的合同条款，让他们知道对他们的期望。这些条款将确保如果他们确实不再遵守您的政策和标准，您有权选择与供应商合作使其恢复合规，或者完全终止合同。请记住，发生事件时，报纸上出现的不会是他们的名字；您公司的名字也会在其中。


  在下一章中，我们将讨论 `Identify`（识别）功能，以及在您的环境中记录所有内容的必要性。这包括记录已知和未知设备，并将它们放入配置管理数据库中。


