  # 框架结构\n\n创建策略时必须有结构化的格式；否则，您如何知道在找什么？结构不必难以实施，我们也不是在实施杜威十进制分类法。但是，应该有条不紊。\n\n\n\
  \n\n\n# 策略、标准和程序文档结构\n\n## 文档框架\n\n当我们审视策略、标准和程序应如何布局的整体结构时，了解文档中应包含的内容也很重要。策略应是阐述任务意图（即*为什么*）的高层级文档。标准是阐述*是什么*的中低层级文档。程序应说明*如何*配置某事项。如果我们的目标是高层级的，那么编写文档的意义何在？第三方评估机构或您的战略合作伙伴可能希望查看您的策略内容。其意图是能够在无需签署**保密协议\
