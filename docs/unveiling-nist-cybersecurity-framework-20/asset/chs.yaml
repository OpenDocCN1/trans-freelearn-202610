  \ 的情况下与第二方和第三方共享。\n\n标准支撑策略，因为它们说明了*如何*执行某事。例如，您可能有一个加密标准，规定了必要的加密要求。在此例中，我们决定仅允许使用\
  \ **传输层安全性 (TLS)** 1.2 版或更高版本。这是因为低于该版本的协议存在问题。您可能还想说明应使用哪种类型的哈希算法，例如使用 SHA256 而非\
  \ MD5。\n\n重要的是要注意，虽然策略应是高层级的，但标准和程序不是。因此，在向组织外部任何人提供此类信息之前，您应要求签署 NDA。在许多情况下，标准和程序陈述了低层级的配置和事件响应措施，如果落入坏人之手，将对组织造成损害。多方之间通常会有可签署的共同\
  \ NDA；但在推进之前，请咨询您的法律顾问。\n\n标准至关重要，因为它们规定了*需要配置什么*、与谁开展业务，或如何响应事件。标准也可用于团队或任务的结构。您可能已制定事件响应计划，规定如何构建团队。在标准中，您可以放置事件响应团队呼叫树或显示职责的\
  \ RACI 图表。\n\n程序说明*如何*做某事，并支撑标准。在前面的示例中，我们讨论了加密。我们指出低于 TLS 1.2 的任何版本均不可用于生产环境。这固然很好，但如何配置它？这就是程序发挥作用的地方。程序支撑标准，说明既然我们已确定\
  \ TLS 1.2 可接受，那么这就是我们配置系统以防止低于该版本的任何内容在生产系统上运行的方法。\n\n## 控制族与编号\n\n将与策略、标准和程序相关联的每个数字视为一个控制族。控制族\
  \ 101 可以说明如何保障软件开发安全，而控制族 102 可能侧重于网络安全。103 可处理人力资源职能，依此类推。关键在于将控制族适当拆分，以便您能轻松找到所需的确切内容。\n\
  \n每个控制族随后由最初在策略中陈述的标准列表提供支撑。同样，策略可能声明您打算加密硬盘驱动器，而标准则讨论加密这些硬盘驱动器时应使用的适当加密算法。例如，您将\
  \ 100.00 作为加密控制族，声明打算对任何和所有内容进行加密。100.01 规定要使用的适当加密算法。100.02 规定 TLS 连接的适当密码套件，而\
  \ 100.03 规定适当的数据库加密技术。100.03.01 说明如何在您的系统中实施数据库加密技术。每家数据库公司的做法都不同。例如，Oracle 数据库可能使用\
  \ **透明数据库加密 (TDE)**，而 Microsoft SQL Server 可能使用不同的技术。这些将被拆分为两个单独的程序以便适当配置。\n\n##\
  \ 策略框架布局\n\n布局可能如下所示：\n\n| **策略编号** | **策略名称** | **标准编号** | **标准名称** | **程序编号**\
  \ | **程序名称** |\n| --- | --- | --- | --- | --- | --- |\n| 100.00 | 加密 | | | | |\n\
  | | | 100.01 | 加密算法 | | |\n| | | 100.02 | TLS 加密 | | |\n| | | | | 100.02.01 | Apache\
  \ |\n| | | | | 100.02.02 | Microsoft IIS |\n| | | 100.03 | 远程连接 | | |\n| | | | |\
  \ 100.03.01 | SSH |\n| | | | | 100.03.02 | RDP |\n\n表 10.1 – 策略框架布局\n\n此结构仅为示例；但也可填充其他多个主题，如可接受使用或应用安全。所有文档应遵循相同结构。这样，您就能准确找到所需内容。\n\
  \n# 策略\n\n组织往往往往会将策略与标准或程序合并。当您试图提供正确信息时（尤其是在审计期间），这可能会带来麻烦。策略是提供实施控制或控制族意图的总体文档。策略是用于建立治理的高层级文档，旨在实施行政、技术和物理控制，以降低组织风险。\n\
  \n策略不应深入细节说明员工或某项技术应使用的配置或流程。这是标准和程序的工作。策略是高层级的，意味着您编写文档的方式不应泄露过多信息。\n\n如前所述，策略陈述执行特定任务的意图。例如，如果您打算在大楼的每个出入口安装智能卡读卡器，这应在策略中说明。但这并不意味着您要说明使用标准化技术进行读卡器访问。也不应详述其配置方式或所用的加密级别。\n\
  \n您通常在策略中看到的其他主题是词汇和职责。您可以在策略中说明团队成员负责系统维护；但我们不详述维护的类型。例如，策略可以说明服务器团队负责所有 IT 系统和服务的补丁管理，而网络团队负责网络设备的维护。\n\
  \n我们不说明何时打补丁。这会泄露过多信息。如果对手知道您在微软“补丁周二”后的周末打补丁，这意味着对手在补丁发布后有一周时间利用已知漏洞攻击您的基础设施。在未签署\
  \ NDA 的情况下提供此级别的详细信息，将使您面临额外的不必要风险。\n\n# 标准\n\n\n\n\n\n# 标准\n\n标准是我们许多人都熟悉的文档。它们是中低层级文档，阐述配置、设置和预期结果的*内容*。它们用于从组织层面描述什么是可接受的，什么是不可接受的。标准还用于支持政策的意图，并提供足够的细节，以便某人编写执行该任务的程序。\n\
  \n标准文档不详细说明如何实施某事；那是程序的工作。标准是一份文档，陈述针对特定工作职能或配置设置何种方法是可接受的。在前一个示例中，我们讨论了加密的适当配置设置。对于我们的\
  \ `100.02` 加密标准，我们可以陈述如下：\n\n*   禁用 `TLS 1.1` 及更低版本\n*   必须使用 `FIPS 140-2` 加密标准\n\
  *   当密钥被签发或因过期而重新签发时，必须新生成密钥\n*   非对称加密算法：\n    *   `RSA` 必须使用 2,048 – 4,096 位强度\n\
  \    *   `ECDSA` 必须使用 256 – 521 位强度\n*   所有遗留协议必须在投入生产前禁用\n*   无线网络必须使用 `WPA2-PSK`\
  \ 或 `WPA2-Enterprise`\n\n正如你所见，此类标准会陈述 IT 资源上项目的适当配置。标准当然可以更详细地说明不可接受的加密算法示例或使用遗留协议的危险。\n\
  \n创建具有此详细程度的文档时必须小心，因为它可能提供比公开发布预期更多的细节。这就是为什么你应该建立 `NDA` 以防止敏感信息泄露。你可以为 Web 服务做例外以允许使用较弱的协议，但同样，请将此信息尽可能保密。\n\
  \n标准在程序如何开发方面也将发挥关键作用。下一节将详述。\n\n# 程序\n\n编写程序是一门艺术。为什么？程序的编写必须让初级分析师在没有先验知识的情况下也能理解如何配置一项技术。很多时候编写程序时，会遗漏配置\
  \ IT 资源所需的关键信息。这会让被要求配置某物或修复问题的员工感到沮丧。\n\n如果你或资深员工去度假了，你的团队会知道如何解决问题吗？编写程序的要点是写得足够详细，以至于不留任何疑问。程序应讨论每一个步骤，直到做什么和怎么做完全明确无歧义。\n\
  \n我过去在社区大学教 Linux 课程，以为一切都计划妥当了。我们允许学生借出外部硬盘在学期中使用。这些硬盘用于安装一个版本的 Ubuntu Linux，以便学生熟悉软件并完成作业。然而有一个问题：如果学生以前从未执行过安装，他们如何将\
  \ Ubuntu 装到硬盘上？\n\n我写了一个作业，演示将操作系统安装到外部硬盘的过程。然而还有个问题——启动后安装到哪个硬盘上？对我的来说这是理所当然的：不要选台式机的内部硬盘。有些学生懂了，而有些意外地将\
  \ Ubuntu 安装到了错误的驱动器上。\n\n虽然这对学生是学习曲线，对我也是个教训。我遗漏了一个关键步骤，即说明安装操作系统的正确驱动器。这不仅让学生不高兴，因为他们得重来一遍；也让\
  \ IT 部门不高兴，因为他们得在下一节课前重新镜像电脑！\n\n你投入程序的详细程度非常重要。如果需要重启，写在文档里。如果有需要配置的注册表设置，也写进文档。即使你知道安装软件要点\
  \ 10 次 `Next` 按钮，也要写上。不留任何侥幸。否则会发生什么呢？要么你在度假时接到电话说系统挂了得你去修，要么有人配置错误却直到太晚才发现。\n\n\
  标准中规定的配置内容会延续到程序中。程序引导你完成标准中定义的系统或设置的安装。程序旨在支持标准。例如，政策 `100.00` 陈述了你加密一切的意图。标准 `100.01`\
  \ 旨在定义要使用的适当加密算法，而 `100.02` 讨论适当的 TLS 配置。现在我们进入程序部分。`100.02.01 Apache` 旨在引导你如何为\
  \ `TLS 1.2/1.3` 配置 Apache 服务器，而 `100.02.02` 讨论如何在 Microsoft Server IIS 上注册相同的 TLS\
  \ 协议。\n\n标准 `100.03` 讨论连接远程计算机时使用的适当协议，而相关程序讨论如何配置 `secure shell` (`SSH`) (`100.03.01`)\
  \ 和 `remote desktop protocol` (`RDP`) (`100.03.02`)。这通过直接定位到你要找的信息源，简化了文档的分解。\n\n\
  # 政策文档格式\n\n文档的对齐、编号和内容应使每份生成的政策文档都具有熟悉的格式。这些文档至少应包含以下内容：\n\n*   **目的**：生成该文档的目的是什么？旨在确立什么？\n\
  *   **所有者**：将政策文档与所有者关联时，确保不绑定特定人名。文档应引用该人的职位或部门。这是为了在人员流动或部门变更时使文档经久适用。\n*   **范围**：该文档旨在涵盖的总体范围是什么？是仅包含内部员工还是外部第三方？也许两者都有？是否也包含本地部署或基于\
  \ SaaS 的应用程序？\n*   **政策声明**：政策声明应清晰、简练、切中要害。这里陈述特定控制的意图（针对政策）、什么或何处应被实施或配置（针对标准），或实施控制的过程（针对程序）。\n\
  *   **信息参考**：此部分非强制，但应视为政策文档的一部分。*信息参考*部分应显示政策文档与给定框架的对齐情况。例如，如果你将政策文档与 `NIST CSF`\
  \ 对齐，应说明与哪些控制或控制族对齐。如果你编写涵盖事件响应的政策文档，文档中应有参考说明该文档与哪些控制对齐。如果你决定也包含 `NIST CSF` 之外的其他框架，也应将它们包括在内。\n\
  \n如前所述，政策、标准和程序的结构很重要。政策旨在高层级，允许任何人查看而不提供过多细节。这就是为什么单独列出标准和程序很重要，以便在没有 `NDA` 的情况下不提供高风险信息。\n\
  \n# 政策控制族\n\n\n\n\n\n# 创建您的策略框架\n\n创建您的策略框架可能会让人望而生畏。*表 10.1* 仅展示了策略文档应考虑内容的一小部分，更不用说框架在起步时应包含详尽的控制清单，因为您最初可能只有少数几个控制措施。\n\
  \n在开始创建自己的框架时，有几个清单可以为您提供帮助。开放策略框架是一个旨在协助决策者的开源项目。它列出了几个控制家族，您可以用它们来启动自己的框架。这些包括以下内容：\n\
  \n## 控制家族\n\n### 信息安全\n\n信息安全控制家族旨在实现数据保护和合理使用。标准文档可包括合理使用策略、加密、数据销毁和**信息生命周期管理\
  \ (ILM)**。信息安全控制家族旨在控制和保护组织的敏感信息。\n\n### 资产管理\n\n互联网安全中心将资产管理列为最重要的控制措施，这是有原因的。*您无法保护您看不见的东西！*\
  \ 组织应对资产管理建立完善的控制，包括识别在 IT 资源上运行的软件和服务。如果您不知道资产或软件的存在，您会有计划去修补或缓解任何风险吗？\n\n### 人力资源\n\
  \n该控制家族旨在说明在员工任职期间如何处理其访问权限和公司拥有的财物。当新员工入职时，经理必须完成一系列步骤，以确保新员工拥有履行工作职能所需的一切。这可能包括领取新电脑、公司配备的手机或外设。\n\
  \n当员工调岗时，您需要制定标准，说明如何处理这些财物或对 IT 资源的访问权限。您要确保不会因允许员工保留对先前 IT 资源的访问权限（而其新工作并不需要这些权限）而将“权限蔓延”引入环境中。\n\
  \n我们还需要制定标准，规定员工离职时该怎么做。如果员工被解雇或自愿离职，该怎么办？所有这些都在必须编写的离职标准中进行了规划。这些标准也可以与人力资源部门协调编写，以确保两个部门对标准中所述内容保持一致。\n\
  \n### 物理安全\n\n本节可讨论大量物理安全控制，例如**闭路电视 (CCTV)**、物理屏障、人员闸、门禁卡访问系统等。这些控制应拥有自己的控制家族以便跟踪。多个框架在其文档中也提到了物理安全。这些控制应体现在为您的组织编写的策略文档中。\n\
  \n### 访问控制\n\n最小权限和职责分离、密码标准、**多因素认证 (MFA)** 的使用以及身份验证都属于访问控制范畴。访问控制不仅仅是控制用户在特定设备上的访问级别。虽然最小权限和职责分离很重要，但还应制定其他一些标准。\n\
  \n我们应该着手制定环境中允许的 MFA 类型标准。例如，多家 MFA 厂商提供不同级别的访问方式，如推送通知、U2F、**一次性密码 (OTP)**，甚至固定电话回呼和短信。每种方式都有不同级别的认证风险。某些\
  \ MFA 机制涉及额外风险，例如在担心 SIM 卡交换攻击时使用短信，或在使用移动应用时出现的推送疲劳。\n\n### 事件管理\n\n事件管理可包括 NIST\
  \ CSF 核心中的“恢复”和“响应”功能。控制措施应包括建立安全事件响应团队、事件发生时的呼叫树、如何进行调查、记录事件以及记录经验教训。\n\n这也是您将\
  \ IR（事件响应）运行手册与控制措施对齐的地方。例如，如果您有克服账户接管的响应计划，还应有运行手册来协助流程并可视化响应过程。\n\n### 业务连续性/灾难恢复\n\
  \n我们已讨论如何响应给定事件以及如何从中恢复。用于指导如何执行这些操作的策略、标准和程序应归属于此控制家族。该家族应包含的标准包括备份与测试、业务连续性规划与测试、向热站点或冷站点切换，以及恢复与文档记录。\n\
  \n### 安全意识与培训\n\n您可能认为安全意识和培训是同义词；然而，它们并非如此。根据 NIST 的定义，安全*意识*是通过观察进行的，而*培训*则更侧重于安全主题。这是全年持续进行的工作，而不仅仅是为安全意识月单独设立的一个项目。\n\
  \n安全意识可以通过横幅展示或电视上播放的视频来实现。这些旨在供路过的员工观看。安全培训也旨在突出网络安全；然而，它是通过更深入和结构化的方式进行的。安全培训侧重于工作角色或职能，而不仅仅是被查看的高层级横幅。例如，安全意识会强调在处理钓鱼邮件时需要额外审查，而培训可能是配置安全邮件网关的邮件管理员所必需的。\n\
  \n### 安全网络配置\n\n该控制家族旨在突出安全网络配置的必要性。这应包括站点到站点 VPN 连接、客户端到站点 VPN，以及强化防火墙或其他安全设备（如\
  \ IDS/IPS）。这也强调了 VPN 设置所需的配置。例如，许多组织已从基于客户端的分隧道 VPN 连接迁移至全隧道。如果您允许一种但禁止另一种，这也应写入标准中。\n\
  \n安全网络配置还应包括防火墙配置。您是否在规则库中采用“默认拒绝、例外允许”策略？防火墙是否应要求 MFA 进行身份验证？哪些协议绝不允许通过防火墙？所有这些都应进行讨论。\n\
  \n### 安全配置与管理\n\n所有 IT 资源和软件都应依据标准进行加固。有多个标准强调了系统加固的必要性；然而，最知名的标准是互联网安全中心基准文档。加固意味着您要移除或更改系统上的所有默认设置和凭据。从系统中移除任何不需要或未使用的服务，并确保已执行适当的安全配置。\n\
  \n### 风险管理\n\n我们在全书中已多次讨论风险。现在我们必须将所学到的一切应用到策略和标准中。NIST 有多份文件涵盖组织风险：NIST SP 800-30、800-37\
  \ 和 800-39。国际标准化组织也制定了 ISO 27005，该标准同样介绍了应对风险的战略方法。\n\n\n\n\n"
- '# 第 10 章：策略框架


  ## 应用安全


  **应用安全**：随着技术的进步，软件变得越来越重要。我们听过诸如 *Web 浏览器是新的桌面* 或 Web 3.0 之类的短语。得益于 **应用程序编程接口**
  (**API**)，应用程序正在与万物集成，API 允许你直接与应用程序通信，而在在线货币兑换中，应用程序是背后的驱动力。


  然而，如果你以前从未处理过 **应用安全**，这会导致意想不到的风险。你应该维护正在开发的各类应用程序的指标、API 端点的数量，或漏洞测试的覆盖范围。你还应该部署静态应用程序安全测试或动态应用程序安全测试
  (**SAST** 或 **DAST**)，以扫描错误配置或漏洞。制定稳健的代码审查标准也应成为策略文档的一部分，以确保代码审查得以执行。


  如果你决定在控制族中需要更细粒度的控制，请参考 **NIST SP 800-53**，这是开发策略文档框架的另一种绝佳方式。**NIST SP 800-53 Rev.
  5** 拥有 20 个独立的控制族，提供了更深入的信息。这些控制族如下：


  ## NIST SP 800-53 控制族


  | ID | 族 | ID | 族 |

  | --- | --- | --- | --- |

  | AC | 访问控制 | PE | 物理与环境保护 |

  | AT | 意识与培训 | PL | 规划 |

  | AU | 审计与问责 | PM | 项目管理 |

  | CA | 评估、授权与监控 | PS | 人员安全 |

  | CM | 配置管理 | PT | PII 处理与透明度 |

  | CP | 应急规划 | RA | 风险评估 |

  | IA | 标识与认证 | SA | 系统与服务采购 |

  | IR | 事件响应 | SC | 系统与通信保护 |

  | MA | 维护 | SI | 系统与信息完整性 |

  | MP | 媒介保护 | SR | 供应链风险管理 |


  表 10.2 – NIST SP 800-53 控制族


  正如你所见，**开放策略框架** 共有 12 个控制族，而 **NIST SP 800-53 Rev. 5** 有 20 个。这并非意味着其中一个优于另一个。每个组织都需要一个起点；这只是取决于你目前所处的阶段，以及你的策略开发战略目标是什么。


  ## 总结


  在本章中，我们讨论了几个重要主题。首先建立此框架将推动组织的策略、标准和程序。在首次创建框架时，确保其也与业务目标和最佳实践保持一致。这并不意味着你第一次就必须完全做对；然而，如果最初考虑不周，日后可能意味着额外的返工。策略和标准旨在为你和团队每天的辛勤工作提供支撑。策略文档也是通过审计所必需的，因为它们陈述了你拥有该技术的意图，以及你打算如何配置和使用它。


  策略是高层级文档，旨在供公众阅读，无需签署 NDA（保密协议）。这是策略与其他文档的重要区别。标准和程序属于中低层级文档，说明控制是*如何*实施的以及*为什么*。这些文档也可能陈述安全控制的例外情况，这能让对手更好地了解环境是如何配置的。


  最后，选择一个框架来对齐你的策略，而不是从零开始。这可以减轻试图想出策略文档初始结构的压力。使用开放策略框架或 NIST 的其他特别出版物来对齐。


  在下一章中，我们将讨论如何评估你的组织。这很重要，以便你建立网络安全计划的当前状态和未来状态。


  ## 参考资料


  1.  开放策略框架：<https://theopenpolicyframework.com>

  2.  NIST 特别出版物 800-53 Rev. 5：<https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-53r5.pdf>

  '
- '# 第 11 章：评估


  策略、标准和程序是网络安全计划不可或缺的一部分。这些策略文档用于奠定你打算如何运行网络安全计划的基础。从信息安全到资产管理和软件开发，策略被用来记录你如何为组织运行特定计划。


  **策略** 旨在作为高层级文档，用于描述你实施安全控制的意图。这些文档的编写方式应使你能自由分发它们，或将其发布在公共站点上，而无需担心泄露过多信息。其意图是能够在组织与客户或第三方供应商之间无需
  NDA 的情况下分发文档。


  **标准** 是用于描述意图的 *内容* 的文档。例如，加密标准应包含要使用的适当加密算法和位强度。该文档也旨在阻止使用遗留协议，因为它们可能容易受到某些弱点的攻击而导致攻击。


  **程序** 是实施某事的 *方法*。它是一套分步说明，用于如何适当配置特定技术。把这份文档写好很重要，因为你可能有从未配置过硬件或软件的初级分析师，他们需要协助来完成配置。其意图是以这样的方式编写文档，使分析师无需他人太多帮助即可完成配置。


  这些文档应拆分为不同的控制族并分离开来，以便你可以自由分发策略，而标准和程序则需要 NDA。审计员还将要求你创建文档，以支持关于 IT 资源配置的声明。这就是为什么为计划的各个方面编写策略文档极其重要的原因。


  在最后一章中，我们将讨论对计划执行评估。此评估旨在帮助你了解网络安全计划目前的状况；这称为 **当前状态**。这是计划所提供的一切在某一时间点的快照。然后我们将制定战略路线图或未来状态。这是我们希望将计划带向的方向。在本章中，我们将讨论以下主题：


  *   执行评估

  *   捕获当前状态

  *   创建未来路线图


  内容很多，让我们开始吧！


  ## 执行评估


  评估有三种不同的执行方式；它们是第一方、第二方和第三方评估。它们各自的执行方式截然不同，但最终都能达到相同的结果。这些评估旨在发现计划中的缺陷。这些缺陷随后可转化为目标或项目，以改善网络安全态势。


  ### 第一方评估


  **第一方评估** 可以是一种有趣且令人兴奋的方式来了解你的环境。第一方评估由你、你的团队或组织内部的内部审计部门执行。此类评估可以突出你做得正确的许多方面，但也有助于发现计划中的差距。






  ## 第一方评估


  执行第一方评估的一个缺点是，它可能不如第三方评估那样被广泛接受。这是因为第一方评估是由您或您的组织执行的。这往往会导致评分偏高，或安全控制措施被忽视。您也可能因为这是您的项目而给自己打分比别人更优。也很难判断回答问题时是否存在偏见。这就是为什么客户和供应商通常接受第三方评估，而不是第一方评估。


  执行第一方评估时，请务必排除偏见。偏见可能会在您对某个特定控制措施给自己和项目打分过高时悄然产生。请务必在回答问题或对特定控制措施自我评分时采取无偏见的方法，因为这可能会提供一种虚假的安全感。


  同时也要熟悉您打算用于评估的网络安全框架。这在询问关于框架中使用的控制目标的问题时会有所帮助。您需要以一种让桌面上（会议上）的每个人都能理解的方式提问。这是为了让每个人更容易理解所提问题的目的。


  如果您打算使用 NIST CSF 作为评估框架，请熟悉其控制措施及您打算如何使用它们。想出多种询问框架本身问题的方式。请记住，您通常希望提出的问题不一定是开放式的，但也不仅仅是简单的*是*或*否*。


  如果您是组织的新成员，我强烈建议您无论如何都要进行一次第一方评估。这是了解您共事的人员，以及了解正在使用的技术栈和安全栈的好方法。如果不这样做，如果您不知道起点在哪里，怎么知道未来状态会是什么样子？


  请记住，框架包括技术、物理和管理控制。您需要将每天所做的一切记录下来；这包括策略、标准和程序。在培训新员工和向审计员提供答案时，您将需要这些信息。给自己个方便，不要忽视或轻视这一步。


  解决贵部门本地的策略、标准和程序是提高分数的绝佳第一步。从第 2 层级进阶到第 3 层级将要求这些策略文档现在覆盖整个组织。这将需要开发一个计划，以维持继续执行策略所需的成熟度水平。


  ## 第二方评估


  **第二方评估**由您的客户或供应商执行。第二方评估旨在帮助您了解目前与您及您的组织有业务往来的组织的安全状况。他们也有既得利益，确保您的组织正在保护敏感信息。例如，您可能有客户将敏感信息存储在您的组织中，他们希望确保您的网络安全计划尽最大能力保护他们的信息。


  为了更好地了解您的网络安全文化，他们通常会发送一份问卷供您填写。这份问卷可能包含涉及数据治理、策略和程序、数据保护以及网络安全最佳实践的多个主题。您可能也会收到基于这些问题的发现，您必须对此作出回应。例如，可能会要求您更改事件响应策略，或在发生影响其信息的事件时包含对客户的通知。


  您可能还打算审计您合作的供应商，以确保他们满足所需的 SLA。这些通常包括您是否满足要求，例如可追溯性、正常运行时间或环境有多整洁。如果未满足 SLA，这往往会导致合同纠纷。审查您的合同，以确保您满足他们的要求。


  我知道有几家大型组织会派员工飞往现场进行评估。这不仅是为了确保他们写在纸上的内容是正确的，也是为了亲眼看到已实施的控制措施。这要么有助于支持他们的网络安全主张，要么暴露他们的缺陷。


  ## 第三方评估


  **第三方评估**由外部方执行。这通常由审计公司或托管安全服务提供商执行。虽然第三方评估是首选方法，但它也是成本最高的。这通常需要一个由不同专业人员组成的团队聚在一起为您执行评估。


  这通常是执行评估的首选方法，因为它完全消除了您在评估完成后评分中的偏见。也正是因为这个原因，它是最广泛被接受的方法。客户和供应商可能因为这种偏见而不接受第一方评估。


  第三方评估公司可能有也可能没有合适的员工来根据您给定的框架执行审查。与供应商合作，确定您是否甚至可以根据打算使用的框架执行评估。虽然四大审计公司可能能够根据 NIST
  CSF 执行评估，但较小的公司可能因缺乏专业知识而无法做到。请确保您与能够按照您的要求执行评估的正确供应商合作。


  第三方评估人员通常会提供一份关于框架合规性的报告，或者至少提供一份包含其评分和发现的幻灯片。其他框架（如 ISO 27001）在满足所有要求后，将为您提供认证。这可用于与供应商和客户共享。但是，在向任何人提供此类信息之前，您应该先签署保密协议
  (NDA)。


  某些法规要求可能会要求您进行第三方评估。这时您需要与合规公司合作，代表您执行评估。例子包括 PCI DSS、FedRAMP、GDPR 和 CMMC 的某些级别。


  第三方评估人员会要求提供若干项目，包括策略、标准、程序、架构图和系统配置。审计员可能还想评估您的日志并分析您的防火墙规则，以确保它们符合您的标准。


  他们可能想在您的网络中运行扫描；这也将包括您的系统和服务。这些将涉及扫描配置、漏洞，以及基线是否存在任何偏移。这将确保您在整个环境中维护标准化配置。


  最后，适当界定评估范围。如果评估范围仅限 IT，请将其控制在 IT 范围内。如果是为了 PCI，请确保其保持在持卡人数据环境内。还要确保范围环境与网络其余部分之间有防火墙。这将帮助您保持在范围内，并降低成本，因为他们不评估整个环境。


  现在，如果您决定自己执行评估，有几件事您必须考虑。这些包括以下内容：


  *   委托函

  *   项目启动

  *   执行评估

  *   执行差距分析

  *   收尾


  ## 执行自我评估





  # 自我评估指南


  在执行自我评估（或第一方评估）时，必须准备好以下几项内容。这些不仅是为了让他人知晓你正在进行评估，更能起到“免责保护”的作用。下面我们来看看第一方评估包含哪些内容。


  ## 约定函


  你需要获得 CEO 或授权人员的批准，才能开展评估。**约定函**旨在授权你按自己的判断执行评估。你可能需要对 IT 系统和服务执行特定类型的安全检查或扫描，这可能会导致系统宕机。所有这些都必须在约定函中明确说明。


  **约定函**应具体陈述你的评估意图和预期产出。如果你计划使用基于技术的扫描器来确定系统和服务的配置，通过问答会话进行评估，且需要**主题专家**（`SMEs`）参与，则所有这些都必须在函件中详述。


  约定函还应包含进度安排。该安排旨在指导你打算做什么以及何时做。例如，你可能打算在周初访谈所有 `SMEs`，而在周末执行扫描。或者，你可能想回顾之前的评估结果，并查看架构图、当前批准的策略和程序。所有这些都应在约定函中列出。


  ## 项目启动


  **项目启动**是评估过程的开始。此时你开始通过询问 `SMEs` 他们如何根据框架执行工作职能来启动问卷。你需要将他们的回答记录在文档中以供后续审查。


  同样，`SMEs` 对框架的熟悉程度不如你，因此要确保以受众能理解的方式提问。这可能意味着你需要扩展问题，包含示例或场景以帮助 `SME` 充分回答。但不要引导
  `SME` 按特定方式回答，否则会导致答案偏颇。


  ## 执行评估


  此阶段是实际执行评估的过程。你向 `SMEs` 提问并对 IT 资源执行扫描。请继续将约定函作为流程的指南或大纲。该文档详细记录了你与高管领导团队达成的共识。


  避免单一回答型问题，例如“`Are backups performed?`”。虽然这可能是问题的核心，但不允许 `SME` 扩展回答。应提出更多开放式问题，例如“`How
  are backups performed?`”。这不仅允许不止是是/否的回答，还能让 `SME` 讨论备份流程的方法论。


  倾听现场人员和 `SME` 的发言，因为他们可能提供额外信息；同时密切关注非语言线索。这有助于回答问题或澄清特定流程，也能凸显某功能需要额外支持才能正常运行的地方。


  这也是运行扫描的时机。扫描旨在提供 IT 资源配置情况的信息。你可以使用漏洞扫描器等工具，或使用互联网安全中心 `CIS-CAT` 扫描服务。还有其他免费扫描器可用，如
  `DISA STIGs`。这些工具旨在检查系统或服务的配置，并提供对威胁形势的洞察。


  你还可以执行其他类型的扫描，如**开源情报**（`OSINT`），或检查 DNS 配置。这两类扫描都能提供组织使用服务类型的宝贵信息，还能凸显不应被互联网访问的敏感文件或信息。发现此类信息有助于定位数据泄露或服务器配置错误。


  如果尚未进行，此时还应审查漏洞扫描报告、渗透测试结果、架构图，以及策略、标准和程序。此类评估不仅关注系统配置或备份执行情况，旨在审查评估范围内环境的所有文档。


  ## 执行差距分析


  评估结束时，你应已获得所有问题的答案并审查完所有文档。现在收尾评估并执行**差距分析**。**差距分析**用于确定环境现状及需改进之处。


  这是流程中的关键步骤，因为它会凸显你的不足，以便你制定项目计划解决未完成事项。这也被视为你的当前状态（稍后详述）。你需要按严重程度对发现结果进行排序，并开始制定解决这些发现的行动计划。


  ## 收尾


  **收尾**或退出面谈是向高管领导团队讨论发现并汇报的环节。退出面谈用于强调组织的成就和做得正确的地方，以及讨论后续步骤。


  你也可以将发现分为多个类别。例如，若计划基于 `NIST CSF` 进行评估，可按功能或类别细分评分。此评分有助于识别需协助的特定领域。评分示例如下：


  | **持续监控 (DE.CM)** |

  | --- |

  | **子类别** | **评分** |

  | `DE.CM-01` | 25 |

  | `DE.CM-02` | 75 |

  | `DE.CM-03` | 50 |

  | `DE.CM-06` | 50 |

  | `DE.CM-09` | 25 |

  | **平均分** | 45 |


  表 11.1 – DE.CM 平均分


  现在我们有了当前状态的初步评分，可以看到与 `NIST CSF` 层级的对齐情况。记住，层级基于风险评分而非成熟度指数。若想查看类别与层级结构的对齐，可为每个层级分配评分等级。例如：


  | **层级** | **评分** |

  | --- | --- |

  | `Tier 1` | 25 |

  | `Tier 2` | 50 |

  | `Tier 3` | 75 |

  | `Tier 4` | 100 |


  表 11.2 – 框架层级评分结构


  如我们所见，DE.CM 评分落在 `Tier 1`（风险知情）范围内。这可能意味着你有不少经管理层批准但未在全组织推行的策略。此评分模型将帮助你确定在整体 `NIST
  CSF` 中应重点关注的领域。


  披露结果时，务必按重要性排序。制定项目计划，说明如何通过启动各类项目来缩补差距、缓解发现。同时询问业务方最重视什么。可能存在先解决特定发现的业务理由。


  对所有类别执行此操作并生成评分。这将提供框架的总体评级。该评分将在我们捕获当前状态并着眼制定战略时变得重要。


  # 捕获当前状态




  现在我们已经完成了评估，是时候确定我们的当前状态了。您的当前状态是评估生成的总体得分以及在审查任何文档时发现的任何缺陷的综合结果。


  如*表 11.1*所示，我们应该拥有我们评估所依据的所有类别和子类别的得分。这些得分不仅包括技术控制，还包括管理控制。技术控制是我们想到控制时最可能想到的东西。这些是防火墙、路由器、服务器以及我们能想到的任何其他物理设备。


  管理控制是我们往往不会想到的。这些是需要编写的策略，用以支持我们为技术控制所做的工作。除了我们试图实施的 IT 资源或流程的其他文档外，我们还需要包含架构图。


  所有这些信息都可以在电子表格或数据库中进行跟踪。这是为了确保您适当地跟踪信息。此外，请确保您的跟踪机制也包含您的未来状态。


  务必在制定当前状态时与您的高管领导团队合作。利用这段时间更好地了解他们从评估中获得的目标和目的是什么。这将因多种原因派上用场，但主要是为了让您在评估调查结果的结果时知道优先处理什么。


  根据贵组织愿意承担的风险等级对结果进行排序。您可能会显示在检测功能上排名很好，但在响应和恢复方面似乎严重不足。如果您的组织需要将精力重新集中在事件响应上，现在就是改变方向的时候。这些是您需要与高层领导进行的对话。


  # 创建您的未来路线图


  现在我们已经完成了当前状态的分析，并根据*表 11.2*中找到的评分模型给自己打分，我们现在应该开始确定我们的未来状态。未来状态是我们计划在未来三到五年内达到的状态。我们不仅需要采用基于风险的方法来制定策略，还需要确保我们提出的目标是可实现的。


  首先，您需要考虑如何以最少的精力减少最大量的风险。这不是因为您懒惰；而是因为您试图以最少的资源减少尽可能多的风险。这可能包括引入新的密码标准、编写新策略或开发架构图。


  长期项目，例如引入`multifactor authentication (MFA)`、将所有应用程序与`single sign-on (SSO)`集成或引入新的日志记录标准，仍然可以规划，但它们需要时间来实施。与您的各个团队合作，确保为这些项目分配资源。这些项目也将有助于降低贵公司的组织风险量。


  我们还需要再次考虑与高管领导团队和董事会的对话。这些群体中的每一个都将为您需要实现的目标和截止时间定下基调。如果您的任务是完善事件响应和检测流程，那么在与框架的响应和恢复功能对齐时，这将成为您未来战略的一部分。


  ## SMART 目标


  为战术和战略项目制定目标。这将有助于为计划分配资源和截止日期。有几种不同的方法可以做到这一点。**SMART 目标**通常用于此目的：


  *   **具体**：这是您试图实现的确切目标。无论是实施新的防火墙规则，还是安装 Linux Web 服务器，这就是您正在为之努力的事情。

  *   **可衡量**：您如何确定项目的成功或失败？这涉及建立指标或数字，以更好地了解您实现目标的进度。

  *   **可达成**：您的目标能实现吗？您能在规定的时间内实现您的具体目标吗？

  *   **相关性**：目标是否与您的业务目标一致？这需要高管领导团队的意见。没有他们的支持，您的项目或计划可能无法推进。

  *   **时限性**：目标或目的需要有截止日期。没有这个，当您没有截止日期要满足时，很难衡量进度。


  SMART 目标可以如下所示：


  *   **具体**：制定实施事件响应计划的方法

  *   **可衡量**：在评分模型中获得至少 3.0 分

  *   **可达成**：每六个月设定接触点以重新评估我们的分数以确定进度

  *   **相关性**：高管领导团队对勒索软件事件的发生表示了更大的关注

  *   **时限性**：在未来 18 个月内使恢复和响应功能获得 3.0 分


  ## 未来状态评分模型


  就像我们在*表 11.1*中给自己打分一样，我们现在应该拥有其余类别的得分。这构成了我们的当前状态。我们现在需要评估我们自己和我们的资源，并将我们的目标与我们创建的
  SMART 目标对齐。这将使我们能够制定未来状态得分。这个未来状态就是我们的战略路线图将包含的内容。


  如果您刚开始，可能没有基础，需要从头建立。在这样做时，重要的是要记住，您不仅需要引入新的技术控制，还需要完善管理控制。这将包含大量新技术和文档。


  **表 11.3 – 事件管理得分**


  | 子类别 | 当前状态 | 未来状态 |

  | --- | --- | --- |

  | `RS.MA-01` | 25 | 50 |

  | `RS.MA-02` | 50 | 75 |

  | `RS.MA-03` | 50 | 75 |

  | `RS.MA-04` | 25 | 75 |

  | `RS.MA-05` | 25 | 50 |

  | **平均得分** | 35 | 65 |


  对框架中找到的其余功能执行此操作，以提供您旨在达到的分数。同样，在创建未来状态得分时，也要与您的高管团队合作。他们可能希望您更多地与他们的业务目标和高管团队想要采取的方向保持一致。


  关注最新趋势，并了解威胁和风险。过去几年来，人们越来越关注供应链风险管理和社会工程学。虽然您可能想专注于从检测和响应中获得的网络安全的激动人心的方面，但您可能想专注于身份管理。


  如果您尚未这样做，有几个项目应该启动。这包括创建企业风险管理仪表板。您可以拆分出本地风险管理仪表板，这可能是特定于项目的。当您开始识别与环境相关的风险时，请跟踪这些风险并制定`Plan
  of Action and Milestones (POA&M)`以补救缺陷。


  随着您继续构建那些本地化风险仪表板，将较高或有风险的项目上浮到企业仪表板。该仪表板将监督应每月审查的风险。当您关闭这些风险时，将它们标记为已关闭；切勿删除它们。




  这将使您能够提供用于关闭已识别风险的流程和项目的历史视图。您需要保留此信息以备审计之需。拥有良好的风险识别流程也将有助于提高透明度。请记住，您无法实现零风险——这是不可能的。但是，您必须处理那些对保护您的组织有意义的风险。


  另一个值得推行的好策略是**身份和访问管理**（**IAM**）。推广单点登录的使用，并在所有地方强制实施 MFA。您需要制定良好的政策和程序，让所有人在安全方面达成共识。一旦发现某人的账户被盗用，请立即采取行动。


  同时，以扎实的密码管理理解作为 IAM 策略的后盾。与 IAM 应用程序的供应商合作，强制实施以下措施：


  *   减少或消除常用密码的数量

  *   不允许在密码中使用用户名

  *   教育用户了解使用宠物或孩子名字作为密码的危险


  推广使用通行密钥来向 IT 资源进行身份验证。通行密钥是向给定 IT 资源进行身份验证的新方式。通行密钥的开发旨在通过 `FIDO2` 协议提供一种更安全的系统访问方式。它本质上创建了一个用于身份验证的公钥/私钥对。


  使用通行密钥代替密码的最大优势在于，每个通行密钥对于特定资源都是唯一的。这防止了跨多个账户重复使用密码。它还能防止账户被接管，因为同样，通行密钥的公钥必须向身份验证服务注册。如果您被骗进入一个仿冒的钓鱼页面并被要求输入凭据，您无法提供，因为您注册的是通行密钥而非密码。


  # 总结


  在本最后一章中，我们讨论了如何进行评估，以及制定当前和未来状态的路线图。这些路线图用于了解您的当前环境，并制定未来三到五年安全计划发展的战略规划。


  关于如何进行评估，各有利弊。如果您决定自行进行评估，这称为第一方评估。这是了解您环境的成本最低（尽管有趣）的方法。


  请注意首先需要创建的文档。您需要有一份委托函，声明您被允许执行评估。这应详细说明您进行评估的意图以及您打算如何开展。如果您决定执行配置扫描，请确保这一点也在函件中说明。


  评估完成后，根据本书前面讨论的分级风险模型为自己评分。这将让您了解当前的安全状况。您应收集评估中出现的所有缺陷，因为我们将把它们转化为未来的项目。


  这些项目将构成您的未来状态，即您想要达到的目标。在计算当前状态时，也要计算未来状态的评分。这将显示您的目标所在。同时制定 `SMART` 目标，以确保您保持在正轨上且目标切实可行。


  可能有些项目不需要过多资源，却能大幅降低组织面临的风险。与您的高管团队和董事会合作，就他们认为应纳入整改清单的项目提供指导。确保您的战略未来目标与业务目标保持一致。


  最后，感谢大家购买并阅读本书。希望本书内容能为您遵循 `NIST Cybersecurity Framework` 的旅程提供深刻见解和帮助。如果您是网络安全新手，或发现自己正领导一支网络安全专业团队，您可能想获取我的第一本书
  *高管网络安全计划手册*。这本书面向新任网络安全负责人或 CISO，他们从未有机会从零开始建立计划。


  如果您有任何问题，请随时联系：


