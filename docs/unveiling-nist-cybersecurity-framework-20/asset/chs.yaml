  \n治理用于设定公司的方向及其运营方式。它为您的员工和公司建立了一种运作的职能方式。治理绝非易事。员工往往陷入常规，不寻求改变。治理可能会阻碍员工执行工作职能，也可能引导整个组织朝着共同目标前进。\n\
