- "# 第 8 章：恢复\n\n我们在 *第 7 章* 中介绍了如何响应事件。这包括收集日志文件、创建对事件进行分类和响应的政策和程序、创建危机沟通计划，以及制定\
  \ ICA 和 PCA。为了总结所有这些，我们需要创建事件的文档或摘要以及发生的情况。此时间线将包含多种类型的信息，并且必须受到保护。\n\n首先，我们需要分析进入\
  \ SIEM 的日志文件，以确定该事件是否应被视为不利事件。我们必须在 SIEM 中开发规则，以捕捉环境中不利事件的特征或签名。一旦触发签名，我们需要确定事件的阈值或严重性。\n\
  \n如果事件被确定为事故，我们需要启动事件响应计划。该计划将调动事件响应团队开始对事故进行分级。这将需要制定 ICA 和 PCA。ICA 用作临时解决方案，可以包含遏制和根除事故的临时解决方案。\n\
  \nICA 可用作遏制事故的临时解决方案。这可以包括临时防火墙规则或服务停用。PCA 提供防止未来事故发生的永久性解决方案。PCA 可能是实施解决方案或更改流程的长期项目。\n\
  \n现在我们将研究 NIST CSF 的最后一个功能，**恢复**。为此，我们将深入探讨从事故中恢复所需的内容。这将包括执行恢复流程、恢复备份，以及验证环境是否恢复到已知的工作状态。我们还需要向内部和外部利益相关者传达我们的活动。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 事件恢复计划执行\n\n\n\n\n\n# 事件恢复沟通\n\n让我们来看看这个最后的功能！\n\n## 事件恢复计划执行\
  \ (RC.RP)\n\n在该控制系列中，我们将讨论从事件中恢复时该做什么。这包括执行您的恢复计划，使系统恢复到已知的运行状态。这将要求您遵循恢复计划、恢复备份，并为您的\
  \ IT 资源建立现有或新的基线。\n\n### RC.RP-01\n\n*一旦从事件响应流程启动，即执行事件响应计划的恢复部分。*\n\n现在我们已经实施了\
  \ ICA 和 PCA，是时候开始事件响应计划的实际恢复过程了。这将涉及利用我们的恢复计划，在新建立的基线上让系统重新启动并运行。我们可能还需要让内部和外部利益相关者参与进来以完成此工作。\n\
  \n作为您事件响应计划的一部分，应该有一种方式指示您的 IT 团队开始着手重建环境。应该有关于如何重建系统或 IT 资源并使其恢复到已知运行状态的分步说明。这应包括如何重建服务器或网络设备的程序、从哪里获取必要的软件以及如何安装它。\n\
  \n我们之前制作的网络和应用流程图将派上用场，帮助我们描绘系统如何工作及其相互依赖关系。我们将需要按照这些规格重建我们的环境。除了重建环境外，我们还需要将新系统和流程的实施作为\
  \ PCA 的一部分进行规划。\n\n我们的 PCA 可能要求我们拆解旧架构并从头开始，或因使用新应用程序而增强架构。也许我们引入一项新控制，例如实施漏洞管理或新防火墙。这些新系统将需要安装和配置，我们还需要确保它们按预期工作。\n\
  \n如果需要引入新流程，这也是实施的时机。这可能包括需要在设备上配置的额外防火墙规则，或重新审视我们如何针对漏洞修补系统。新流程可能包括更频繁地修补，或根据漏洞的严重性建立何时修补特定漏洞的\
  \ SLA。在将新系统实施到环境中时，了解所有这些都很重要。\n\n### RC.RP-02\n\n*选择、确定范围、确定优先级并执行恢复行动。*\n\n当我们开始补救时，必须确定将恢复工作重点放在何处。我们应该回顾我们的\
  \ ICA 和 PCA，确定应首先实施什么，以及什么可以暂缓。这可能是由于资源限制或其他问题阻碍了我们实施恢复工作所需的措施。\n\n对恢复所需内容进行调查，并开始制定项目计划，明确实施什么以及何时实施。该项目计划应包括什么最重要、需要尽快恢复，以及什么可以稍后完成。计划应包括可以立即完成的事项，以及需要时间采购并投入生产的事项。\n\
  \n与您的高管领导团队 (ELT) 合作，了解对他们而言什么实施最重要。例如，ELT 和业务部门可能希望您在实施新防火墙之前先实施多因素认证。这些补救工作都基于业务当时愿意接受的风险程度。\n\
  \n也可能同时有多个项目在进行。您可能在致力于流程改进的同时部署新防火墙。根据项目对业务的重要性规划项目实施顺序。这还要求您拥有适当数量的资源。\n\n资源有多种不同类型，但通常归结为财务或人员限制。您的恢复工作将取决于这两者。您可能因预算限制而无法实施新控制系统，直到有更多资金可用时才能推进。\n\
  \n这也可能取决于员工拥有的专业知识水平，因为这可能要求您外包新系统和服务的安装。这也可能要求员工接受正在实施的新系统培训。这两者都将需要项目的额外资金。您甚至可以让受信任的第三方实施新解决方案，同时培训您的员工。\n\
  \n### RC.RP-03\n\n*在用于恢复之前，验证备份和其他恢复资产的完整性。*\n\n我们已经讨论了定期执行备份的重要性。现在是时候测试我们是否有能力将备份恢复到\
  \ IT 资源了。除了知道我们能否恢复备份外，我们还必须确保备份中的文件完好无损、未损坏。通过此过程，我们将不得不依赖我们的加密方法来确定是否能成功将系统恢复到正常状态。\n\
  \n执行备份有几种不同的方法。其中一种更流行的方法是“祖父-父-子”法。该方法的目的是定期执行备份，同时最大限度地减少备份的数据量，从而减少存储空间。\n\n\
  “祖父-父-子”备份法如下操作。我们在周日执行全量备份，在一周内执行增量备份。增量备份仅获取给定文件的更改；这是为了减少使用的总磁盘空间。下周日到来时，我们再次执行全量备份，并丢弃本周执行的增量备份。月末时，我们再做一次全量备份并保留该备份以供下个月使用。增量备份称为“子”，每周备份称为“父”，每月备份称为“祖父”备份。\n\
  \n每个备份的文件都应进行哈希处理，以确保在恢复时，我们可以验证正在恢复的文件或镜像与哈希值匹配。不仅每个文件应进行哈希处理，整个备份本身也应有一个哈希值。没有哈希值，我们无法验证正在恢复的备份是否与备份中的内容完全一致。\n\
  \n大多数情况下，攻击者会想访问您的备份，并用某种勒索软件加密它们，意图让您的公司支付赎金以恢复对备份文件的访问。有几种备份解决方案会将您的文件备份到不可变存储格式中。\n\
  \n不可变存储是指文件写入一次且永远无法被覆盖。这种方法有几个好处。首先，一旦文件写入，就无法在备份存储中被修改。这意味着勒索软件无法加密存储磁盘上的文件，从而保持备份文件的完整性。\n\
  \n我们还应强调定期测试备份的必要性。通过测试备份，您可以最大限度地减少定位和恢复备份所需的时间，因为这会变得得心应手。您还应测试能否将镜像恢复到文件系统，并确保该过程未损坏数据。这些额外步骤是为了确保您的备份流程顺利运行。\n\
  \n### RC.RP-04\n\n*考虑关键任务职能和网络安全风险管理，以建立事件后的运营常态。*\n\n\n\n\n我们应将所有系统纳入 CMDB（配置管理数据库），它不仅记录系统配置项，还标明系统的关键性。当我们开始恢复工作时，这些信息将派上用场，因为我们需要知道优先恢复哪些系统。为更好地了解系统的关键性，我们还应与业务部门沟通，以更清楚地理解他们眼中什么是关键的。\n\
  \n在将系统恢复到正常状态时，我们再次确保系统符合事件发生前建立的基线。如果是新系统或系统重新配置，我们需要与系统负责人合作，为 IT 资源建立新的基线。所有这些都是为了确保系统回到已知状态。\n\
  \n查看系统图以了解两个或多个系统之间存在哪些相互依赖关系。您可能有一个数据库集群，多台服务器连接到它。您可能在网络设备上配置了故障转移，或出于管理目的设有专用的带外网络。这些都应在图表中体现。\n\
  \n您可能还部署了监控系统来检查系统性能并确定配置漂移。我们也必须配置这些系统，以协助我们判断系统是否正常运行以及配置是否得当。\n\n这还要求您与系统负责人合作，确保系统按预期恢复运行。这可能要求系统在投入生产前经过一系列检查。您不希望在未先检查新系统或现有系统是否按预期工作的情况下就将其投入使用。\n\
  \n## RC.RP-05\n\n*验证已恢复资产的完整性，恢复系统和服务，并确认正常运行状态。*\n\n这是我们在将系统移回生产环境前执行最终测试的阶段。我们需要验证我们的\
  \ ICA 和 PCA 已实施或正在实施过程中，并且事件已从我们的环境中彻底根除。\n\n如果我们不验证事件或事故已被遏制并从环境中根除，我们就面临再次感染的风险。在判断事件是否已完全清除时，我们必须尽到应有的勤勉。这要求我们了解事件的根本原因。\n\
  \n我们可能需要重演事件的步骤，查看时间线以及事件期间创建的任何文档，以了解根本原因。在理解根本原因时，您和您的团队可能需要进行极其技术性的分析，或请第三方供应商协助对\
  \ IT 资源执行取证分析。\n\n在将系统移回生产环境前，修复感染原因也是一项要求。如果攻击者利用了漏洞，请追踪该漏洞并确保没有其他系统易受该问题影响。如果有人利用了服务器上的开放端口，请重新评估该端口或服务是否需要对公共互联网开放。\n\
  \n我们还需要验证恢复工作是否成功。这包括确保系统得到适当恢复，并验证信息未损坏。备份系统有自动化手段检查恢复信息的有效性，但您也可能想自行手动验证。创建系统快照并尝试在隔离环境中恢复它们，以测试备份和恢复流程。\n\
  \n## RC.RP-06\n\n*应用确定事件恢复结束的标准，并完成事件相关文档。*\n\n您的策略和程序应帮助您确定事件何时平息以及何时可以结案。一旦发生这种情况，您便可决定结束恢复阶段，开始**事后复盘**（**AAR**）。这是事件响应和恢复过程的最后一步。\n\
  \n事后复盘或 AAR 应是您事件响应计划流程中的必经步骤。该 AAR 流程旨在帮助您、您的团队和业务部门在事件响应和恢复方面变得更高效。AAR 将记录哪些做得好、哪些做得不好，以及改进流程的整体步骤。\n\
  \nAAR 将有助于简化改进事件响应的流程。我们可以提出诸如*我们本可以做些什么来更好地改进流程？*或*采取的补救措施是否得当？*等问题。我们可以利用答案来审查内部流程并加以调整，以便下次做得更好。\n\
  \n运行 AAR 的过程应在每次事件发生后进行。这将再次帮助我们更好地响应事件。它还能带来其他益处，例如提高我们响应和恢复工作的成熟度。\n\n在我们成功完成恢复任务并结束\
  \ AAR 后，即可成功结案。事件报告应存放在安全的位置。我们还想对报告实施职责分离，因为报告将包含敏感信息，一旦落入坏人之手，可能会使组织陷入危险。\n\n\
  # 事件恢复沟通 (RC.CO)\n\n在本节中，我们将探讨如何向内部和外部利益相关者传达我们的恢复情况。我们需要制定计划，明确传达什么内容以及传达给谁。我们还必须遵守监管要求，并确保遵循这些指南，以免违规。\n\
  \n## RC.CO-03\n\n*向指定的内部和外部利益相关者传达恢复活动和恢复运营能力的进展。*\n\n为满足此控制目标，我们需要审查与受信任第三方签订的合同及合规要求。这要求我们在传达恢复活动时利用**危机沟通计划**（**CCP**），同时强调我们怀着对公司和客户最好的意图。\n\
  \n首先，我们需要一种安全共享此信息的方式。虽然我们的第一反应可能是*加密它！*，但我们需要采取基于风险的方法。我们向 ELT（高管领导团队）披露的信息可能与向客户共享的信息不同。公开披露过多信息可能会损害您的业务和受信任的第三方供应商。\n\
  \n然而，在披露高度敏感信息时，是的，应进行加密。除了加密外，在决定披露信息的受众时，还应采取最小权限原则。同样，您向内部团队成员或高管团队披露的信息可能与公开发布的信息不同。利用\
  \ CCP 周围的策略和程序，确保正确的信息传递给正确的人群。\n\n由 [first.org](http://first.org) 创建的**交通灯协议**（**TLP**）有助于制定沟通标准。TLP\
  \ 如下：\n\n*   **TLP: RED** – 仅限个人；不允许进一步披露\n\n*   **TLP: AMBER** – 可在组织内部及与客户之间按“需知”原则共享信息\n\
  \n    *   **TLP: AMBER+STRICT** – 同 TLP: AMBER，但信息仅在组织内部共享\n\n*   **TLP: GREEN**\
  \ – 可在其社区或组织内共享信息\n\n*   **TLP: CLEAR** – 信息被视为公开\n\n\n\n您需要确保尽可能及时地更新 ELT（高管领导团队）的信息，以便他们在需要时能做出必要的决策。如果出现阻碍，他们将是协助消除阻碍的人。您需要确保项目状态也得到有效沟通。\n\
  \n审查供应商与客户之间的合同。极有可能其中包含您必须遵守的沟通要求。请务必审查这些要求，并将其记录在电子表格或数据库中，以便跟踪其违规通知和恢复沟通指南。\n\
  \n# `RC.CO-04`\n\n*使用批准的方法和消息传递共享事件恢复的公开更新。*\n\n您需要建立违规通知流程以满足此控制要求。该流程需要详细说明从响应到事件恢复的所有内容。还需要详细说明组织打算如何防止未来发生类似事件。\n\
  \n在讨论“响应”功能时，我们提到了尽可能收集更多信息的必要性——不仅包括事件本身的信息，还包括元数据。收集这种级别的信息不仅是为了重现事件，也是为了找到根本原因。这将有助于在未来识别类似事件，并缩短响应时间。\n\
  \n在响应和恢复阶段收集的信息将有助于确定事件的根本原因。在确定根本原因时，请确保您拥有所有必要的信息，并在开始调查时记录涉及事件的相关人员。在调查期间，评估收集到的信息并向相关人员提问，以确定事件发生的位置。\n\
  \n事件的根本原因可能源于几种不同的场景。这些可能包括 IT 资源中的漏洞或弱点、配置错误或社会工程学攻击。一旦确定了根本原因，就要着手制定可能的解决方案，以防止事件再次发生，或至少将其影响降至最低。\n\
  \n一旦确定了根本原因并采取了缓解措施，我们就需要将此情况告知利益相关者。这可能包括 ELT、同事、客户和第三方——这应在您的 CCP（危机沟通计划）中列出。除此之外，请确保您遵守针对客户和法规合规要求的违规通知要求。\n\
  \n# 总结\n\n在本章中，我们讨论了从事件中恢复所需采取的步骤。这包括信息收集、沟通和根本原因分析。我们应该制定政策和程序，以确定沟通什么内容以及何时沟通。我们还需要了解受众以及所沟通的信息。\n\
  \n我们需要收集有关从事件中恢复所采取步骤的信息。正如我们在讨论“响应”功能时为汇编时间线而收集信息所做的那样，我们在收集恢复信息时也需要采取类似的步骤。尽可能详细。我们希望拥有通过文档在需要时重现事件的能力。\n\
  \n我们需要一份 CCP 来说明我们沟通的内容和对象。不同的受众将需要不同类型的沟通和信息披露。例如，您可能遭遇了向您提供服务的第三方供应商被攻破的情况。您可能会向\
  \ ELT 披露第三方是谁，但可能不想向公众披露该信息。这是为了保护该第三方免受后续攻击。\n\n您还应努力获取有关事件的尽可能多的信息，以帮助您确定根本原因。在处理未来可能性质相似的事件时，这将派上用场。例如，一名员工遭遇了账户接管。在确定根本原因时，发现该事件源于社会工程学攻击。现在您可以专注于提升安全邮件和用户意识方面的安全参数。\n\
  \n最后，审查您围绕通知的合同和法规要求。您很有可能有外部要求，规定必须在多少天内沟通发生了事件。请务必审查这些要求，以免未能满足合规性。\n\n就这些了；这是\
  \ NIST CSF 功能的最后一部分。在接下来的几章中，我们将讨论如何应对网络安全风险、政策和标准，以及如何执行评估。\n"
- '# 第 3 部分：应用框架


  在*第 3 部分*中，我们将学习如何通过制定政策、标准和程序以及降低风险来应用这六大功能。为了更好地了解我们的环境，我们还需要执行评估。该评估旨在确定我们当前环境的状况以及未来的目标状态。


  本部分包含以下章节：


  *   *第 9 章**：如何应对网络风险*

  *   *第 10 章**：政策、标准和程序*

  *   *第 11 章**：评估*

  '
- '## 第 9 章：如何应对网络风险


  现在我们已经涵盖了所有 CSF 功能，让我们专注于如何应对网络风险。NIST CSF 提供了与最佳实践保持一致所需的指导。它通过文档编制、SLA（服务级别协议）制定、职责矩阵和沟通来实现这一点。所有这些都被视为管理控制的一部分。


  CSF 提供的管理控制旨在降低组织的网络风险。它们不涉及风险管理的职责归属，即究竟由谁对其负最终责任。我们已经讨论了风险，评估了管理控制，并实施了政策。这些都是为了降低风险；然而，*谁*来负责这一点仍然不太明确。


  您可能会说**首席信息安全官**（**CISO**）负责所有网络风险。这对吗？责任是否落在 CISO 的上级身上，可能是**首席信息官**（**CIO**）或**首席财务官**（**CFO**）？谁拥有最终决策权？在许多情况下，CISO
  只是就网络风险向高管领导团队和**董事会**（**BoD**）提供建议。这将使他们对整体风险承担接受责任，但我们如何达到这一步？


  在本章中，我们将介绍 NIST **风险管理框架**（**RMF**）。它包含一份来自 FIPS 的文件以及几份 NIST **特别出版物**（**SPs**），例如以下内容：


  *   **FIPS 199** – 联邦信息和信息系统安全分类标准

  *   **SP 800-37** – 信息系统和组织的风险管理框架

  *   **SP 800-39** – 管理信息安全风险


  虽然还有许多其他 SP 涉及风险，但本章我们将深入探讨其中三份。这些文件旨在为您的整体风险管理计划建立组织架构。


  这是一个计划，就像网络安全是一个计划一样。它不能是一次性的工作，也不能是“设置后就不管”的过程。它需要维护和投入，才能接近其应有的有效性。在本章中，我们将涵盖以下三个主要主题：


  *   探索 IT 风险

  *   NIST RMF

  *   如何将风险管理应用于 IT 资源


  现在我们知道将要深入什么内容了，让我们开始吧！


  ### 探索 IT 风险




  我们每天都会经历各种类型的风险。你今早醒来了，干得好！做早餐，等等——牛奶变质了吗？喝咖啡——希望它不至于烫伤你。然后你拿起钥匙跳进车里，在上午 8 点前刚好赶到打卡上班。你是怎么到的？你超速了吗？有人强行插队吗？我不妨猜猜，你本可以坐公交或乘火车。等等，你仍然可能遭遇事故。


  你看，你今早仅仅是起床就冒了风险。你可能喝了变质牛奶，抿了滚烫的咖啡，或者为准时上班而超速。这些风险全是第二天性，你可能根本不曾在意。它们看似寻常；简直让你麻木了，几乎忘了万物皆可危险。


  面对网络风险，我们有时也会采取同样的态度。针对基于 IT 的系统，危险多得让你恨不得把系统裹在混凝土里扔进大海中央，还要拔掉所有网线！然而，采取这种态度可能意味着你得另谋高就，因为没人能开展工作。


  网络风险有时让人感觉主观，的确如此。一家公司对网络风险的看法不同于另一家。它们可能是同一城镇、从事相同职能、市值相同的两家独立公司，却对网络风险持有截然不同的看法。分散的
  IT 团队让情况更糟——他们在同一公司工作，却对风险有完全不同的认知。为何如此？经验？公司愿在风险缩减上投入多少资金？组织能否提供足够人手完成所有必要工作？


  让我们从如何评估风险入手。你会花 100 美元保护 50 美元的资产吗？不会。反过来，你会花 50 美元保护 100 美元的资产吗？有可能。资产有若干考量因素，如使用年限或可升级性。虽仅举例，但它们揭示了我们对资产及其上驻留信息的价值判断。资产价值可能仅
  100 美元，并不代表资产上的信息价值不远超此数。既然我们知道应对风险的方式截然不同，不妨深入一探？


  应对风险主要有四种方式，旨在风险识别后执行相应任务：


  *   **缓解**：这是我们针对风险采取行动的地方。可能只是应用软件补丁或为网络采购新防火墙，也可能是退役遗留系统。

  *   **转移**：我们将风险转嫁给另一方。风险转移通常指购买网络保险。转移也可能意味着将网络安全托管给第三方，如 AWS 或 Microsoft Azure。

  *   **规避**：规避风险指因风险过高而取消项目。你环境中有遗留系统；你不缓解风险，而是决定将其移出生产环境。这也可能意味着因项目风险过高而不予承接。

  *   **接受**：这通常是应对风险的最后手段，因为它可能让你面临重大问题。接受风险意味着你不打算实施任何缓解措施，不打算向保险公司转移风险，也无法规避。此时，你只能最终接受风险。这可能导致系统被攻陷，务必谨慎行事。


  以上是应对风险的四种主要方式，但它们未说明风险源头或责任归属。下一节我们将讨论网络风险的三个层级。


  # NIST RMF


  NIST RMF 采用简明方法评估全组织的网络风险。金字塔顶端是第 1 层，主要由董事会和**高管领导团队 (ELTs)** 组成。他们负责定义风险及其阈值。第
  2 层将定义落实为策略、标准和流程，由企业架构团队推行，确定组织使用的标准。最后，第 3 层是 IT 系统所在层级：


  ![图 9.1 – NIST SP 800-37 RMF](img/B21915_09_1.jpg`)


  图 9.1 – NIST SP 800-37 RMF


  ## 第 1 层


  组织风险首先由董事会和 ELTs 定义。他们声明风险水平或风险容忍度。我前文说网络风险具有主观性，指的就是此。没有标准规定必须在一天内修补漏洞，也没有法规强制要求像车险那样购买网络保险。


  主观性体现在：他们基于经验和对公司最佳利益的判断，告知公司该做什么、不该做什么。作为网络安全专业人员，你须确保执行（或不执行）某任务的风险成本由公司承担。公司可能称安全邮件网关不在今年预算内。虽你表达过担忧，但最终决定权在他们。现在你必须用现有工具确保邮件防护。


  ## 第 2 层


  在涵盖 NIST CSF 功能的章节中，我们讨论了文档。第 2 层是文档的创建与执行层。第 1 层定义组织风险。现在我们可将定义落笔成文。下一章将讨论如何创建**策略、标准和流程
  (PSP)** 框架，本章简述其含义。


  策略是显示意图的声明文档。这些文档为高层级，你可随意分享给亲友，无须担心泄露核心机密。例如，策略文档可规定“所有硬盘必须加密”；很好！但策略文档不应规定加密如何实施、使用何种算法、密钥存放何处。这些属于标准和流程范畴。


  **企业架构 (EA)** 团队负责制定标准。EA 接收第 1 层需求并在环境中落地。除实施标准外，还负责编写标准文档。例如，董事会和 ELT 要求加强防范来自互联网的攻击。现有防火墙仅阻断
  `source/\\destination/port/and protocol`，虽曾适用，但组织需要更强防护。为阻止新型攻击入网，EA 决定部署 IDS/IPS
  能力。


  组织已部署一套防火墙并标准化于某厂商。现在实施 IDS/IPS 配置需评估现有设备能否利用该功能。若不能，则需寻找新硬件。你过去可能标准化使用 Cisco，新防火墙可能仍是
  Cisco，也可能是其他品牌。关键在于：一旦选定防火墙，EA 的职责是确保新品牌在全组织统一使用。





  在一组防火墙上进行培训并成为 SME（主题专家）的成本可能很高。成为多家防火墙制造商的 SME 可能会进一步大幅增加这一成本。这就是标准如此重要的原因。我见过分散的
  IT 团队孤岛化严重，导致部署成本增加了两倍多。例如，我曾与一个组织交谈，他们有一组用于数据的交换机、另一组用于语音的交换机，还有一组用于无线的交换机。所有这些交换机均由不同的制造商提供，采用不同的技术。你能想象如果将所有内容都包含在一个产品中，将节省多少成本吗？


  # 第 3 层


  第 3 层要求在 IT 资源层面进行风险审查。这将包括负责 IT 系统工程和维持运行的人员。与第 3 层相关的风险通常涉及评估和监控环境的网络风险。例如，SOC
  分析师可能负责审查给定系统中的漏洞，并评估如何修复它们。他们可能还负责确保在预定间隔内执行漏洞扫描，以确保提供足够的保护。


  第 3 层还负责获取 EA（企业架构师）提供的需求文档，并确保其得到适当的实施和配置。如果 EA 规定 IDS/IPS 应配置以下特征码并将 IPS 置于阻断模式，则工程团队有责任确保其得到适当实施。第
  3 层还执行以下功能：


  *   **准备**：准备在组织和系统层面执行 RMF

  *   **分类**：确保您已对系统和信息进行分类

  *   **选择**：用于保护环境的初始控制集

  *   **实施**：实施控制措施

  *   **评估**：确保控制措施按预期工作

  *   **授权**：授权官员已在项目上签字，以便项目可以继续进行

  *   **监控**：监控已实施的控制措施，确保其按预期工作


  `图 9.1` 中所示分层的重要性在于，虽然需求从第 1 层向下传递到后续各层，但它也有能力从第 3 层向上流动到第 2 层，最后到达组织层。重要的是要注意，既然需求向下流动，问题就必须向上流动。为什么？如果你持续向下推送，如何知道这些需求是否按预期工作？流程中必须建立一个持续的循环。


  # 风险管理框架


  我们在第 3 层职责的讨论中简要讨论了框架步骤。现在让我们将这些步骤付诸实践。在评估 IT 系统或环境并确保其已实施足够的控制措施时，将使用以下步骤。


  ## 准备


  这是我们收集项目需求的地方。该系统仅用于我们的网站，还是会有信用卡数据流经它？它会存储 ePHI（受保护的电子健康信息）或知识产权吗？所有这些问题都应在您着手搭建系统之前经过深思熟虑。如果您没有为公司（和监管）需求做好适当规划，从长远来看，这将花费您更多的成本。


  ## 分类


  一旦我们准备好所有需求，我们需要对系统进行分类。为此，我们将使用 **机密性、完整性和可用性 (CIA)** 三要素。CIA 缩写代表以下内容：


  *   **机密性**：保护信息不被未经授权的人员访问

  *   **完整性**：确保信息未以任何方式被篡改

  *   **可用性**：为负责文档的人员维持正常运行时间


  我们现在将使用 FIPS 199 来确定 CIA 三要素的水位阈值。水位包括低、中、高风险分类，并由以下标准确定。


  ### 低


  低水位涉及 CIA 三要素对组织几乎没有或没有影响。系统或货币价值的损失对组织的利润影响很小。网络威胁属于侦察性质，不对网络的整体稳定性构成威胁。


  示例包括：


  *   高可用集群中一台服务器的丢失

  *   Ping 扫描

  *   一个人收到垃圾邮件


  ### 中


  中等水位指示可能对组织及其整体功能产生重大影响。CIA 的中等损失可能导致重大货币价值损失、高影响系统的丢失或知识产权被盗。中等影响可能严重影响系统以正常水平运行的能力，并导致其长期处于降级状态运行。


  示例包括：


  *   影响多个系统的病毒爆发

  *   第 1 层系统长时间宕机

  *   导致账户接管的钓鱼邮件

  *   资金转移


  ### 高


  高水位保留给那些被认为对业务造成灾难性后果的事件。灾难性事件可能是整个数据中心宕机，或发生勒索软件事件。这也可能意味着因故障导致人员伤亡。由于工作职责的性质，与医院和执法部门相关的计算机系统将包含高水位。


  示例包括：


  *   勒索软件攻击

  *   针对医疗机构的攻击

  *   可能导致重大发现的资金损失


  ### 计算安全分类


  现在我们已经定义了分类水位，让我们将其投入使用。计算资产网络风险的方法有很多。我们行业中的许多人习惯使用以下计算：


  ```

  风险 == 威胁 * 可能性 * 影响

  ```


  这在网络安全教科书中被广泛用作提供与 IT 资源相关的风险定量计算的一种方法。这被用来评估风险并定义哪些系统对风险计算影响最大。NIST FIPS 199 提供的安全分类用于使用定性手段评估风险。


  在上一节中，我们只展示了低、中、高风险水位。值得注意的是，您也可以将 **不适用 (N/A)** 作为水位。您看，IT 资源不能将 N/A 作为水位。为什么？它们必须维持一定级别的机密性、完整性和可用性。另一方面，数据由于其公开性质，可以具有
  N/A 水位。例如，如果您有一个面向公众的网站，包含——您猜对了——公开信息，它会被认为是低吗？并非如此。低意味着数据本身仍有一定程度的审查。如果是公开的，我们真的在乎吗？如果呈现公开信息的
  Web 服务器被攻破，我们会在乎数据吗？不，因为它是公开的。然而，我们确实在乎的是服务器被攻破，并可能呈现误导性信息，损害我们维持可信度的能力。


  安全分类公式如下：


  ```

  SC 数据/IT 资源 == {(机密性, 影响), (完整性, 影响), (可用性, 影响)}

  ```


  我们如何分解这一点？等号左边的输出是等号右边计算的结果。例如，我们有一个呈现公开可用信息的公共 Web 服务器。IT 资源的计算如下：


  ```

  SC Web 服务器 == {(机密性, 低), (完整性, 低), (可用性, 中)}

  Web 服务器 == 中

  ```





  ## 分类


  既然我们已经定义了构成每个影响的值，我们该如何进行计算？这很简单！我们采用应用的最高水位线，并将其作为我们的安全分类。在这种情况下，Web 服务器的安全分类将被视为中等。


  我们也可以对驻留在 IT 资源上的信息执行此操作。下一个示例针对公开可用的信息：


  - `SC public data == {(confidentiality, N/A), (integrity, low), (availability, low)}`

  - `Public data == low`


  ## 选择


  既然我们已经对数据及其所在的 IT 资源进行了分类，我们必须选择控制措施来保护系统。通常，这是为了将安全分类与另一个网络安全框架——NIST SP 800-53
  保持一致。NIST SP 800-53 是一个大规模的网络安全框架，主要由联邦和州政府使用。该控制框架由数千个控制措施组成，涵盖 20 个控制族。虽然我们专注于
  NIST CSF，但重要的是要知道 CSF 并不是他们开发的唯一框架。如果你想了解 CSF 和 SP 800-53 如何对齐，只需查看 CSF 中的信息参考即可。大多数控制措施都源自
  SP 800-53。


  你也可以在保护 IT 资源时选择自己的控制措施。也许你有通用控制，例如 **Active Directory 域服务** (**AD DS**) 或通用的 **端点检测和响应**
  (**EDR**) 平台。通用控制为你的部分甚至所有 IT 基础设施提供安全保障。重要的是要知道，你实施的通用控制也必须满足合规要求。


  ## 实施


  既然我们已经准备好环境、对基础设施进行了分类并选择了安全控制措施，现在是实施控制措施的时候了。实施控制措施可以采取多种形式。它可能仅涉及实施控制措施以缓解网络风险，也可能意味着实施一个将风险转移给第三方的工作流。实施不仅仅是配置控制措施；我们还需要评估与该特定控制措施实施相关的风险。


  实施并不意味着你必须手动将每个控制措施部署到给定系统上。你也可以通过自动化手段来实现。以 Microsoft Windows 为主的环境极有可能使用 Active
  Directory 的 **组策略对象** (**GPO**) 将安全配置推送到整个环境。基于 Linux/UNIX 的环境可能会使用 Ansible 等自动化工具下发配置。关键是你必须实施上一阶段选定的控制措施。


  ## 评估


  我们现在验证环境是否已按预期设置。这种验证对于确保已正确实施适当的安全控制措施至关重要。还需要有一种方法来检查必要的配置是否已完成，以及它们是否保持原状。这意味着如果你检测到偏移，则必须有办法纠正它。


  RMF 的 *评估* 阶段用于验证配置是否按企业架构 (EA) 的规定实施。EA 将收集所有必要的策略和标准，包括任何合规要求。在进行配置时，重要的是这些内容要在
  **系统开发生命周期** (**SDLC**) 的设计阶段得到覆盖。


  收集配置偏移信息可能很棘手，这就是我建议使用自动化配置服务的原因。Puppet 是一种可以检测此类偏移信息并自动纠正的服务。Terraform 和 **基础设施即代码**
  (**IaC**) 等其他服务也可以检测某些类型的偏移，并在必要时进行纠正。


  我们还应该评估系统环境中已实施的通用控制。通用控制是指在整个环境中通用的控制，例如杀毒软件 (AV) 或 **身份与访问管理** (**IAM**)。这些控制最初可能是在很少或根本没有考虑控制机制的情况下设置的。你必须评估这些控制，以确保它们也满足或超过了公司的策略和程序，以及任何合规要求。


  ## 授权


  所有这些中的另一个关键环节是授权新系统或服务的运行。这份 **运行授权** (**ATO**) 是系统投入生产环境前的最后一个必要步骤。它旨在让授权官员（通常是业务人员）审查并批准系统上线生产。**系统安全计划**
  (**SSP**) 是授权官员签署安全控制措施所需的文件。


  SSP 是一份动态文档，详细记录了与新系统相关的安全控制措施、范围和风险。该文档描述了环境中的所有内容，并提供信息，以便授权官员做出周密的决定，判断系统是否可以投入生产。


  SSP 中的细节对服务的成功至关重要。SSP 不仅需要记录已实施的安全控制措施，还需要记录与服务相关的任何风险。然后授权官员可以决定该服务及其相关风险是否可接受，或者是否需要转移或完全规避风险。


  一旦做出系统投入生产的决定，授权官员就会在风险文件上签字，这标志着可以运行新系统。SSP 应包含授权官员的签名，声明业务方已接受与该服务相关的风险。


  ## 监控


  最后，我们监控服务以确保其成功。我们可以通过多种不同的方式监控系统。例如，我们需要监控与服务相关的通用控制。这包括确保病毒定义相应更新，或审查用户访问权限。我们需要监控配置偏移，以确保拥有标准化的环境。监控还应包括
  SNMP，以确定系统和环境的整体健康状况。


  最重要的是，我们需要监控服务的整体健康状况和安全性。虽然资源紧张时自动化手段很有帮助，但你也应该定期执行手动扫描，以确保自动化手段配置得当。自动化很棒，应纳入环境中。然而，它也应受到监控。自动化偶尔会失败，在你审计自动化流程之前，你可能会有一种虚假的安全感。


  # 如何将风险管理应用于 IT 资源


  SDLC 与 RMF 有相似之处。在讨论 SDLC 和 RMF 时，一个话题是识别与 IT 资源相关的网络风险。在识别风险时，必须将其记录在文档中，并提交给授权官员。


  SSP 的一个关键组成部分是风险登记册。风险登记册是记录所有已识别风险的地方，然后将其纳入项目计划以进行补救。当我们评估 IT 资源时，我们会识别与环境相关的风险。然后我们评估如何解决这些风险，无论是接受、规避、缓解还是转移它们。如果我们决定缓解或转移风险，则必须创建
  **行动计划与里程碑** (**POA&M**) 来记录补救进度。


  POA&M 是用于跟踪补救工作的项目计划。POA&M 应包含以下内容：


  - 风险 ID

  - 风险描述

  - 完成补救所需时间

  - 涉及的资源，如人员、时间和成本

  - 补救任务的优先级





  *   识别出向人员发出风险警报的系统

  *   谁负责补救任务

  *   不修复漏洞的风险

  *   开始和结束日期


  另一个讨论话题是，当 IT 资源达到其生命周期终点时，我们该如何处理它。


  生命周期终点资源，以及你如何处理相关风险，将非常重要。很多时候，我们只是备份所有信息，然后处理掉硬件。在决定如何处理已备份的信息时，需要仔细考量。例如，如果我们在未先擦除驱动器的情况下处理硬件，而驱动器上存在敏感信息，这可能被视为重大违规。为什么？答案很简单：从一台机器中取出硬盘并将其挂载到另一台机器上是轻而易举的。


  我们必须确保安全地处置信息。这包括使用驱动器级别的加密，或您备份可用的任何机制。在备份完成后安全擦除驱动器也是必需的。您需要确保存储在驱动器上的所有信息都已被尽最大能力清除。


  我们之前提到过，SSP 是一份详细记录 IT 资源和环境的活文档。SSP 应反映 IT 资源是如何从网络中退役的。该文档应说明信息是如何从一个系统备份到另一个系统的、如何受到保护、存储在何处，以及万一以后需要时如何检索。一旦系统完成备份并最后一次关闭，便应归档信息，并将系统的
  SSP 存档以备史参。


  我们也绝不从 SSP 或风险登记册中删除信息。同样，为了历史记录，SSP 应反映您和您的团队为保护资源所付出的所有努力。当风险被识别并修复后，应将其从列表中标记为已完成，但绝不删除。了解并理解风险是如何被识别的，以及采取了哪些行动将每个风险从环境中移除，这很重要。


  # 框定风险


  在识别网络风险时，为 SSP 框定风险也是必需的。框定风险与环境中包含和不包含的内容密切相关。例如，当我们对三层应用程序进行评估时，我们会包含表示层、逻辑层和数据层。这三个（或更多）系统可以是单个独立系统，也可以集群在一起。该应用程序可能需要防火墙或
  `Web Application Firewall` (`WAF`) 来处理所有传入连接。


  理解如何框定环境非常重要，以确保 SSP 正确识别所有系统及其组件。图 9.2 将有助于阐明这一点：


  ![Figure 9.2 – Framing risk](img/B21915_09_2.jpg)


  图 9.2 – 框定风险


  图 9.2 展示了一个典型的小型企业环境；左侧是员工及其桌面，右侧是服务器环境。它还展示了基于云的服务的使用，例如 SharePoint。本地环境受防火墙保护，并提供电子邮件、FTP、文件和打印等服务。中间部分展示了一个用于信用卡交易的三层环境。


  当我们为信用卡环境创建 SSP 时，我们将要求文档涵盖 Web 服务器、逻辑层和数据库。这不包括 FTP、电子邮件、文件和打印。然而，我们也需要为那些环境编写
  SSP。SSP 将讨论这些系统的安全控制、其配置，以及它们如何协同工作以向我们的员工和客户提供服务。


  文件和打印的 SSP 应包含可能驻留在服务器本身上的敏感信息类型。它应包含谁有权访问文件和打印服务器，以及用于强制执行安全策略的通用控制。SSP 还应讨论如何对其进行审计和记录日志，以确保符合公司政策和标准以及法规要求。它还需要展示人员如何获得对文件和打印服务器的访问权限。外部员工是只能在内部访问它，还是也可以通过
  VPN 连接访问？一旦获得此信息，我们就可以进一步加强其安全性，因为我们已经识别出了所涉及的风险。这只是第 10 章将涵盖信息的一个抢先预览。


  # 摘要


  在本章中，我们了解到识别和修复风险只是应对网络风险总体方法的单一组成部分。在决定是接受、规避、减轻还是转移网络风险时，我们需要让整个公司参与进来。风险评估和处理源自高层，并向下贯穿整个组织。


  我们还了解到，网络风险评估必须首先由 ELT 和 BoD 确立。他们必须声明其风险承受水平是什么。一旦定义了这些，EA 将制定政策和程序，确保新的或现有的 IT
  资源以反映组织所需可接受安全态势的方式进行架构设计。


  我们了解到，确保存在反馈回路非常重要，以防特定控制未按预期实施。这可能是一次性的配置错误，也可能本质上更具灾难性。这会导致环境中存在未实现的网络风险，可能会带来虚假的安全感。如果控制措施不足，必须尽快向
  EA 和 ELT 标记，以便组织能够了解情况并做相应规划。


  正如我们所见，开发 SSP（即一份用于展示环境如何设置的活文档）也很重要。SSP 必须包含有关环境的所有配置信息、相关风险，以及 IT 计划如何修复这些风险。一旦文档定稿，系统准备投入生产，它就需要授权官员的正式签署，由其提供
  ATO。


  在下一章中，我们将讨论对政策、标准和程序的需求。这些文件对于满足多项不同要求是必要的，包括教育员工什么是技术的适当使用、什么不是，以及审计要求。

