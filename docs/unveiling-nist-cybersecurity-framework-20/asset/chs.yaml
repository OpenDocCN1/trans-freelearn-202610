  要在网络安全之旅中取得进展，您需要根据一组最佳实践来调整您的计划。框架由来自不同技术背景的行业领袖开发。NIST 网络安全框架也不例外。它是由美国联邦政府的专家创建的。在本节中，我们将讨论其开发原因以及将您的计划与之对齐的必要性。


