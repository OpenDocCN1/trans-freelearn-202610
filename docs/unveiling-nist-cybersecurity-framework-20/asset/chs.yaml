- '# 第 1 章：网络安全框架简介


  在本书中，我们将深入探讨由 **美国国家标准与技术研究院** (**NIST**) 开发的一个名为 **网络安全框架** (**CSF**) 的框架。该框架最初的开发目的是更好地保护关键基础设施企业免受威胁，识别和处理
  **信息技术** (**IT**) 风险，并为您的 IT 和网络安全计划构建弹性。


  在本章中，我们将探讨以下主题：


  *   什么是框架？

  *   为什么选择 NIST CSF？

  *   NIST CSF 背后的历史

  *   将 CSF 与其他框架进行比较

  *   NIST CSF 成功案例


  ## 什么是框架？


  启动网络安全计划的方法有很多，但该从何入手？这对许多 IT 专业人员来说可能令人望而生畏，因为网络安全有其自己的语言。开发框架是为了协助组织完成这项工作。框架用于根据最佳实践调整计划。它也可以是一组必须实施的要求，以执行特定功能。


  框架不一定会告诉您如何实施特定控制，而只是规定您应该建立该控制。例如，框架可能规定您应实施 **多因素认证** (**MFA**)，但可能不会说明如何或在何处实施。框架可能规定您确保配置了适当的审核和日志记录，但不会说明如何操作或应保留日志多长时间。


  框架是一份用于帮助组织实施最佳实践的文档。您或安全负责人可能决定不打算实施某项控制或一族控制。这完全没问题；但是，您必须决定您和组织愿意接受的风险等级，即因不实施特定控制或控制族而产生的风险。更多关于网络安全风险的内容请参见
  *第 9 章*。


  **国际标准化组织** (**ISO**) 等组织制定了框架，以使组织与网络安全最佳实践保持一致。ISO *27001*/*27002* 是许多国际组织用于与网络安全最佳实践保持一致的标准。各国政府也制定了网络安全标准，以保护自己免受意图造成危害的对手的侵害。


  NIST 是美国联邦政府的一个机构。该机构受命制定多项标准和框架，包括用于网络安全的框架。澳大利亚有 **澳大利亚信号局澳大利亚网络安全中心** (**ASD''s
  ACSC**)。加拿大有网络安全中心。这些政府机构各自开发了自己的网络安全框架。还有许多符合监管要求的框架。虽然它们也符合最佳实践，但这些是您必须使用的强制性框架。例如，医疗行业必须遵守
  **健康保险流通与责任法案** (**HIPAA**)。如果您出于支付目的接受信用卡，则 **支付卡行业数据安全标准** (**PCI DSS**) 适用于您。如果您不需要满足监管要求，则没有绝对正确或错误的框架选择。但是，您必须首先了解您的业务目标，然后再选择框架。





  在审查您想为组织选择哪个框架或哪些框架时，您必须了解业务目标。这意味着，即使您选择了特定的框架来实施，企业也很可能有强制要求。这些组织需要在现有基础上实施额外的控制措施。


  例如，您的组织决定要实施 ISO *27001*，因为它是一家国际公司。这是为您的组织选定的基准标准。该组织还决定要处理、存储和传输信用卡号码，因为它既在线下也在线上销售产品。这还要求组织遵守
  PCI DSS）——又一个框架。该组织还在**欧洲联盟**（**EU**）开展业务，这带来了**通用数据保护条例**（**GDPR**）的要求。GDPR 规定了组织如何处理、存储和传输高度敏感的**个人身份****信息**（**PII**）。


  也许您的组织与美国联邦政府合作。根据**国防联邦采购条例补充**（**DFARS**）*252.204-7012*，有一些必须遵循的要求，这些要求载于**特别出版物**（**SP**）*800-171*
  框架中。它可能还要求，作为政府项目一部分使用的任何**软件即服务**（**SaaS**）应用程序必须托管在高度受监管的环境中，例如**联邦风险和授权管理****计划**（**FedRAMP**）。


  您现在可能正对自己说：“*这固然很好，但 NIST 如何融入* *这幅图景中呢？*”


  为什么不直接深入了解呢？


  # 为什么选择 NIST CSF？


  NIST CSF 是一个极佳的起步网络安全框架。它旨在帮助被视为关键基础设施的组织实施网络安全控制。此外，它免费使用。好吧，它不一定是免费的——我的意思是，如果您是美国公民，那么您的税款支付了它的开发费用。


  虽然它最初是为关键基础设施企业编写的，但 NIST CSF 2.0 旨在让中小型甚至大型组织也能轻松采用和使用。该框架的编写方式使其在实施时可定制。正如您稍后在本章中将看到的，采用其他框架的组织迁移到
  CSF，是因为那些框架难以实施。


  如前所述，CSF 是一个易于理解、易于维护、易于评分并展示您的网络安全计划成熟度进展的框架。如果和当您决定采用另一个框架（如 NIST 的 SP *800-53*、*互联网安全中心关键安全控制*（**CIS
  Controls**）、**信息及相关技术控制目标**（**COBIT**）和 **ISO 27001**）时，它也能为您和您的组织的成功奠定基础。


  NIST CSF 2.0 分为六大核心功能：


  *   治理

  *   识别

  *   保护

  *   检测

  *   响应

  *   恢复


  这六大功能在*第 2 章*中有更详细的解释，它们进一步细分为类别和子类别。这些功能代表了一组用于保护组织或构建计划弹性的控制措施的通用主题或家族。例如，识别功能包含以下类别：


  *   资产管理

  *   风险评估

  *   改进


  这些类别中的每一个都进一步细分为应实施的控制措施。


  ## NIST CSF 背后的历史


  2000 年代和 2010 年代对 IT 和网络安全来说是一团糟。虽然实施网络安全计划的想法离人们的想法还很远，但这个概念开始萌芽。在 2000 年代，我们遇到了
  SQL Slammer、Code Red、Blaster 和 Conficker 等病毒，仅举几例。这些计算机病毒在许多组织、政府和高等教育机构中肆虐。进入 2010
  年代后，我们遇到了 Stuxnet 和 Flame。然而，在 2013 年，我们开始看到勒索软件随 CryptoLocker 扎根。


  由于企业遭受恶意载荷攻击，且许多企业不知道该怎么做或如何保护自己，奥巴马政府介入了。2013 年 2 月，总统签署了第 *13636* 号行政命令，名为“*改善关键基础设施网络安全*”，指示
  NIST 制定新的网络安全框架。2014 年，我们看到了 CSF 的第一版。


  CSF 的早期版本专门面向拥有和运营关键基础设施的实体。尽管该框架过去是且现在仍是自愿的，但这些行业是美国认为对其运营至关重要的：


  *   农业

  *   教育

  *   水务

  *   公共卫生

  *   交通运输

  *   电力

  *   安全服务

  *   电信

  *   银行和金融


  这些只是根据关键基础设施保护计划被认为至关重要的组织类型中的一小部分。


  4 年后发布了 1.1 版，带来了若干改进。一些改进包括以下内容：


  *   澄清控制措施和术语

  *   新增了执行风险自我评估的章节

  *   细化了身份认证、凭证管理和访问管理方面的要求


  2.0 版于 2024 年发布。新版保留了最初的五大功能——识别、保护、检测、响应和恢复。然而，在 2.0 版中，引入了一个新功能——治理。治理旨在在整个组织中建立治理机制，治理引入了**企业风险管理**（**ERM**），并强调网络安全供应链风险管理。


  ## 将 CSF 与其他框架进行比较


  如前所述，有多种不同的网络安全框架可供选择。NIST CSF 中的每个类别和子类别也与其他框架相对应。每个子类别都有一个信息参考与之关联。这为什么很重要？


  也许您收到了关于您和您的组织如何实施其安全控制的询问。该询问基于 ISO 或 SP *800-53*，但等一下——您正在使用 CSF；这些如何对得上呢？


  有一个矩阵列出了每个控制措施及其与其他框架的对应关系。这是为了协助回答关于 CSF 与其他框架对比的问题。如果您决定采用不同的框架，它也旨在为您提供帮助。关键在于，如果您从
  CSF 开始，然后决定跳到另一个框架，之前的努力并未白费。我绝不是说您应该从 CSF 开始，然后自然过渡到另一个框架。您可以为整个组织或大部分组织使用 NIST
  CSF，也可以在组织中部分实施该框架。


  业务目标确实会变化，随之变化的还有您实施的网络安全控制。让我们看看 NIST CSF 中引用的其他框架。


  ### CIS


  CIS Controls 经历了多个迭代版本。它们最初由 SANS 研究所开发；但现在由 CIS 维护。CIS 维护该列表多年，根据行业领袖的反馈不断调整控制家族。该列表按重要性从高到低排序。在版本
  8 中，CIS 开发了**实施组**（**IGs**），根据组织拥有的资源定义要实施的控制措施。


  CIS 还将 CIS Controls 从 20 项精简至 18 项。这些类别包括以下内容：


  1.  企业资产清单与控制

  2.  软件资产清单与控制

  3.  数据保护

  4.  企业资产和软件的安全配置

  5.  账户管理

  6.  访问控制管理





  ## CIS Controls


  7. 持续漏洞管理

  8. 审计日志管理

  9. 电子邮件和 Web 浏览器防护

  10. 恶意软件防御

  11. 数据恢复

  12. 网络基础设施管理

  13. 网络监控和防御

  14. 安全意识和技能培训

  15. 服务提供商管理

  16. 应用软件安全

  17. 事件响应管理

  18. 渗透测试


  该框架按重要性从高到低列出了控制措施。这意味着组织应审查其当前流程，以发现和记录环境中的 IT 资源。坦白说，如果组织在实施其他控制措施*之前*进行渗透测试，就是在浪费时间、金钱和精力。在启动网络安全计划的阶段进行渗透测试，只会提供你已知的信息。


  ## COBIT


  COBIT 5 基于五项不同的治理和管理控制：


  1. 满足利益相关者需求

  2. 覆盖企业端到端

  3. 应用单一、集成的框架

  4. 实现整体方法

  5. 区分治理与管理


  COBIT 是一套用于 IT 的企业治理和管理框架。该框架指导你如何实施计划并执行这些计划。随后，你审查进度，根据结果评估成功标准，制定补救项目计划，并重新开始该过程。这是启动新项目或持续改进
  IT 的有效方式。


  ## ISO/IEC 27001


  由 ISO 制定，ISO/IEC *27001* 是一项国际标准，用于建立基线和保护 IT 资产以及评估风险。*27001* 框架的基础是通过采用和应用**机密性、完整性和可用性**（**CIA**）三要素，确保安全控制到位。


  除了 CIA 三要素外，它还规定了使用**信息安全管理体系**（**ISMS**）。ISMS 用于记录环境中实施的安全控制。CIA 三要素定义如下：


  - **机密性** – 限制对被视为敏感的 IT 资源或信息的访问

  - **完整性** – 确保信息未被预期当事人以外的任何人篡改

  - **可用性** – 根据组织或服务级别协议的要求，信息或 IT 资源可用


  组织和个人也可以获得 ISO *27001* 认证。组织利用认证向客户证明他们已建立专门的网络安全计划。个人也可以获得认证，这将允许他们为自己的公司或其他组织执行认证评估。


  ## NIST SP 800-53


  目前使用更广泛的网络安全框架之一是 NIST 的 SP *800-53*。该框架包含 20 个隐私和安全控制家族，估计有 1,000 个单独的控制措施。根据**联邦信息安全管理法案**（**FISMA**），美国联邦政府必须在所有联邦
  IT 资源中实施这些控制。


  控制家族如*表 1.1*所示：


  | ID | 家族 | ID | 家族 |

  | --- | --- | --- | --- |

  | AC | 访问控制 | PE | 物理和环境保护 |

  | AT | 意识和培训 | PL | 规划 |

  | AU | 审计和问责 | PM | 项目管理 |

  | CA | 评估、授权和监控 | PS | 人员控制 |

  | CM | 配置管理 | PT | 个人可识别信息和透明度 |

  | CP | 应急计划 | RA | 风险评估 |

  | IA | 标识和认证 | SA | 系统和服务采购 |

  | IR | 事件响应 | SC | 系统和通信保护 |

  | MA | 维护 | SI | 系统和信息完整性 |

  | MP | 媒介保护 | SR | 供应链风险管理 |


  表 1.1 – NIST 800-53 控制家族


  这些绝非网络安全框架的详尽列表，仅是 CSF *参考资料* 部分中的框架。还有几个框架与前文讨论的框架同等重要。建议审查其他框架，看它们是否符合您的业务需求和目标。


  # NIST CSF 成功案例


  组织可以自由使用和实施 NIST CSF，以最适合其需求。该框架的优势在于其在实施必要网络安全控制方面的灵活性。许多组织通过使用它实现了降低整体网络风险的目标，但不要只听我说。以下是其他实施了
  CSF 的组织的成功案例。


  ## 科罗拉多河下游管理局


  作为德克萨斯州居民的服务者，**科罗拉多河下游管理局**（**LCRA**）肩负重任。LCRA 确保来自河流的水可供该州数百万居民安全使用。该河务局被视为关键基础设施，必须确保其
  IT 和**运营技术**（**OT**）安全。


  LCRA 最初采用 NIST 的 SP *800-53* 来实施网络安全控制。由于其庞大的规模，这导致框架推广出现严重问题。LCRA 需要一个敏捷且可定制的框架，因为其去中心化和组织规模。LCRA
  最终放弃了 SP *800-53*，转而采用 CSF。这使他们能够在整个组织应用通用框架。 \[*1*\]


  ## 生物科学部 – 芝加哥大学


  成立于 1890 年，**芝加哥大学**（**UoC**）已为学生服务超过一个世纪。**生物科学部**（**BSD**）是 UoC 内较大的学院之一，拥有 23
  个系和 5,000 名教职员工。该学院需要使用多个框架来保持合规，包括 HIPAA 和 FedRAMP。由于其去中心化，学院难以在所有部门维持统一的安全态势。


  BSD 汇集了框架**主题专家**（**SMEs**）协助框架推广。该组织开发了一个四阶段流程，使他们能够有效地实现评估和降低网络风险的目标。他们的四阶段方法包括：


  1. 开发当前状态概况

  2. 执行网络安全评估

  3. 创建未来状态概况

  4. 执行路线图


  团队创建了一个 0-4 的评分系统，以建立两个概况之间的成功度量标准。随后，BSD 为员工创建了培训研讨会，以更好地理解如何使用该框架。 \[*2*》


  虽然这两个成功案例描述了他们如何在组织内推广 NIST CSF，但你将如何实现相同的目标？从哪里开始，如何达成？以下章节将回答这些问题及更多内容。


  # 总结


  在本章中，我们回顾了什么是框架以及它为什么重要。框架的开发是为了帮助组织填补构建网络安全计划的空白。NIST CSF 是一个可以轻松应用于您组织的框架。


  随着网络攻击在 2000 年代初蔓延，我们需要迅速提升安全态势。网络安全框架的创建就是为了协助组织做到这一点。许多人可能认为 IT 和网络安全是相同的，但它们并非如此。正如我们所了解到的，网络安全有其自己的语言和实施解决方案的方式。


  正如我们在成功案例中所见，几个组织从其他框架转向使用 CSF，因为其灵活性允许跨多个业务职能实现敏捷性。





  在下一章中，我们将深入探讨 `CSF`，并回顾框架的 `Core`、`Tiers` 和 `Profiles`。然后我们将研究如何评估和降低风险。敬请期待！


