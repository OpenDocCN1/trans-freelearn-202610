- '# 4. Identify（识别）


  在上一章中，我们了解了 `Govern`（治理）功能及其在整个组织中评估和沟通风险的重要性。我们还强调了拥有企业风险登记册、网络安全供应链风险管理和监督的重要性。收集网络安全项目周围的指标不仅能突出您需要资源的地方，还能宣传那些积极的风险。


  从环境中识别和移除风险对项目的成功至关重要。一旦识别出风险，您就需要一个地方来跟踪它。风险登记册可用于跟踪组织中的网络风险。我建议为每个范围界定的环境设置一个风险登记册。这使得登记册易于管理，同时能快速找到风险。一旦您开发了单独的风险登记册，生成一个企业风险登记册或风险管理仪表板。该仪表板将提供一种方式来突出显示环境中发现的关键风险，并允许您和您的团队有效地修复这些风险。


  在本章中，我们将讨论 `Identify`（识别）功能。`Identify` 功能之所以独特，是因为它要求您跟踪组织中的所有软硬件资产。除了识别资产外，您还必须准确记录环境中的所有内容，执行风险评估，并改进这些流程。您无法保护您看不见的东西。如果您不保持对已知和未知设备的准确统计，您如何知道环境中有什么和没有什么？


  在本章中，我们将涵盖以下内容：


  *   资产管理

  *   风险评估

  *   改进


  让我们直接开始吧！


  ## 资产管理 (ID.AM)


  重申我之前提到的，您无法保护您看不见的东西。为了有效保护您的组织，您必须掌握环境中的内容。这要求您了解连接到网络的各种硬件和软件类型，以及更重要的是，您如何保护这些资产。


  其中一些也将为后续章节的成功奠定基础。当我们开始奠定资产管理的基础时，我们也将对这些资产进行分类和优先级排序。这将有助于事件响应或灾难恢复场景，因为您将知道什么对组织最重要。


  ### ID.AM-01


  > “*组织维护其管理的硬件清单。*”


  这有时说起来容易做起来难。我们必须全面审视环境，了解什么连接到了它。我们通常只考虑硬件或软件，但编程硬件的固件呢？这也应该被纳入清单，以确保它也像环境的其他部分一样得到更新。我们还需要清点网络中未知的设备。例如，网络安全专业人员对插入网络的非法接入点大惊小怪，这是有充分理由的。我们不希望不安全的接入点被插入网络，允许任何拥有
  Wi-Fi 网卡的人都能连接。这也需要被跟踪和清点。


  捕获此信息的最佳方法是使用 `configuration management database`（配置管理数据库，`CMDB`）。`CMDB` 用于捕获跟踪环境内硬件所需的所有信息。在
  `CMDB` 中，您将需要捕获 IP 地址、主机名、MAC 地址、位置以及负责维护设备的人员。您还必须捕获硬盘空间大小或安装了多少内存。您应该捕获 CPU 的制造商、型号、速度和系统架构。对于网络设备，您可能想知道电路编号或设备的管理
  IP。


  您还将需要捕获所有笔记本电脑和台式机。这些与安装在组织中的服务器同样重要。如果笔记本电脑丢失或被盗，这将派上用场。这样，您就可以知道设备的配置以及硬盘是否已加密。





  捕获流氓设备也很重要。您需要随时了解网络上连接了什么。如果不捕获流氓设备，您将不知道它们的位置、IP 地址，也不知道设备试图提供什么类型的服务。这听起来可能违反直觉；然而，在试图追踪设备所有者是谁时，捕获这些信息将提供有价值的线索。


  这需要持续执行，以确保您拥有最准确和最新的信息。如果您没有能力持续监控环境，至少每 6 个月执行一次审计。设备不应频繁变更，并且您需要确保每当环境发生变化时，`CMDB`
  都能保持最新。


  ## ID.AM-02


  > “组织管理的软件、服务和系统清单得到维护。”


  正如我们在 `ID.AM-01` 中所见，我们必须盘点组织维护的软件和服务。您的 `CMDB` 应为正在使用的各类软件预留占位符。盘点时，请务必包含软件制造商、版本及软件的各个组件。


  在获取所用软件时，确保有随附的 **软件物料清单** (`SBOM`)。这将告诉您软件本身使用的组件。也许它是一个运行在 `Apache Tomcat` 上的基于
  `Java` 的 Web 应用程序。也可能是一个运行 `PHP` 和 `JavaScript` 的 `WordPress` 应用程序。如果不获取这些信息，您如何知晓？


  正如我们将在 `Identify` 的风险评估部分看到的，您还必须扫描环境中的漏洞。在尝试适当修复这些漏洞时，您需要了解正在使用的各类软件开发包，以便更新它们。


  这不仅适用于软件开发栈，也适用于服务。在设置 `Linux` 服务器以处理 `DNS` 或 `DHCP` 时，必须确保该信息也被记录在 `CMDB` 中。这将有助于精准定位因漏洞可能引发的任何潜在问题。例如，`BIND
  DNS` 的早期版本易受漏洞影响。您需要确保 `BIND` 的版本号也在 `CMDB` 中，以便追溯。


  与前一个控制措施一样，您必须持续监控环境中的新增或变更。可利用 **简单网络管理协议** (`SNMP`) 实现此目的。`SNMP` 是一种用于监控系统组件的监控协议，它还能告诉您安装的软件、磁盘剩余空间、使用的
  `IP` 地址等信息。`SNMP` 是一个相当古老的协议；然而，它可以捕获信息并将其放入某个平面文件或数据库中。结合 `CMDB` 使用 `SNMP`，以确保其持续更新。


  ## ID.AM-03


  > “组织授权网络通信以及内部和外部网络数据流的表述得到维护。”


  创建网络流程图也是获取网络所需信息的重要组成部分。网络图应显示系统、网络设备、 `IDS`/`IPS`、防火墙以及用于捕获网络威胁信息的其他传感器。这不仅能为您的团队提供关于网络架构的宝贵信息，在威胁行为者试图访问网络时，这些信息也将派上用场。


  网络流程图描绘了网络的构建方式。它们还显示了系统安装的位置及所在网络部分。也许您有多个防火墙“区域”来保护系统和服务。这些区域也应描绘出来，以显示系统的部署位置。网络图应显示位置和所用传感器的类型，以准确展示您在何处收集敏感网络安全信息。


  您的图表还应显示网络外部系统的入站和出站网络流。例如，您可能使用 **云服务提供商** (`CSP`) 运行服务器，或利用 **软件即服务** (`SaaS`)
  提供商存储 **个人身份信息** (`PII`)。网络流程图还应显示信息如何从您的网络流向他们的网络。*图 4.1* 描绘了一个简单的网络流程图：


  ![图 4.1 – 网络流程图](img/B21915_04_1.jpg`)


  图 4.1 – 网络流程图


  用户连接到位于 `AWS` 中的 Web 服务器。该 Web 服务器连接到一个数据库，该数据库正备份到 `S3` 存储桶。图表可能比这更复杂，但它们应显示一个用户或组件到另一个用户或组件的通信是如何处理的。


  我们知道 **传输控制协议** (`TCP`) 在其通信流中是双向的。然而，重要的是要注意，在创建网络流程图时，箭头指向通信发起的方向。这也是一个重要的区别，因为您想知道通信在何处发起，以便正确应用防火墙规则。


  ## ID.AM-04


  > “供应商提供的服务清单得到维护。”


  环境的规模和范围将决定 `CMDB` 的大小。它可能包含数十、数百或数千个环境中使用的系统和服务。如前所述，它可以包含 `IP` 地址、`MAC` 地址、系统所有者、操作系统版本等。此外，您还应收集网络和应用流程图，并将它们放入
  `CMDB`。`CMDB` 还可用于记录供应商或第三方供应商提供的服务。


  制作数据流程图时，请考虑供应商提供的所有各种系统组件和服务。他们是否提供 **目录即服务** (`DaaS`)，甚至基于 `SaaS` 的多因素认证？如果这些系统和组件由第三方供应商托管，您也应在
  `CMDB` 中记录此信息。在您的 `CMDB` 中，您可能还需要一个菜单，区分哪些组件托管在内部，哪些在组织外部。这将揭示您可能未曾考虑的额外风险。例如，如果您将敏感数据标记为关键，意图是绝不让它离开您的大楼，但随后却发现它存储在云存储中，这就是一个重大风险。


  您还需要记录环境中安装的任何 `SaaS` 组件。多个 `SaaS` 提供商将需要本地系统和服务，以安全地捕获信息并发送到他们的云。这也需要在 `CMDB` 中建立清单，并创建它们如何双向通信的网络流程图。


  ## ID.AM-05


  > “资产根据分类、关键性、资源和对任务的影响进行优先级排序。”


  盘点 IT 资源是 `CMDB` 的一个重要组成部分。获取捕获信息所需的所有正确参数，然后将正确信息放入这些参数中，可能是一项庞大的工程。许多人在创建 `CMDB`
  时的一个事后想法是按重要性对系统进行排序。这至关重要，尤其是在事件发生期间考虑 IT 资源重要性时。





  ## IT 资源分层结构


  为您的 IT 资源使用分层结构，以便在发生灾难时知道哪些资源应优先恢复。您的网络中可能有数百甚至数千台服务器，如果不确定优先级，您如何知道它们的重要性？在对系统或系统组进行分层时，要了解它们在环境中的定位。这可能需要与**高管领导团队
  (ELT)** 和业务部门进行沟通，以更好地了解对他们而言什么最重要。


  也许您的薪资或人力资源系统需要 7×24 小时运行，以确保员工按时拿到工资或能处理直接存款变更。也许您有一家为您的业务提供关键任务服务的供应商，您必须确保他们的服务持续运行。当灾难发生时，您需要知道它们对组织的重要程度。分层结构可能如下所示：


  *   **第 1 级 – 关键任务系统**：这些系统是业务运作所必需的。第 1 级系统中断将严重影响业务运作。

  *   **第 2 级 – 次要关键任务系统**：这些系统是第 1 级系统的依赖项，或其组件为业务提供关键服务。

  *   **第 3 级 – 不提供关键任务服务的系统或系统组件**：这可能包括停机数小时甚至数天也不会影响业务的系统。


  ### ID.AM-07


  > “*维护指定数据类型的数据清单及其相应的元数据。*”


  在 CMDB 中需要记录的其他属性包括可能存储、处理或从一个系统传输到另一个系统的敏感数据类型。这包括可能存储在 SaaS 提供商系统或您的 CSP 中的信息。没有这些信息，您将无法确定存储在
  IT 资源中的信息的关键性。


  您的 CMDB 还应记录敏感数据类型。这些包括以下内容：


  *   PII（个人身份信息）

  *   数据隐私法，如**加州消费者隐私法案 (CCPA)** 或**通用数据保护条例 (GDPR)**

  *   信用卡信息

  *   健康信息

  *   政府监管信息，如受控非密信息


  这可以是一个描述类型的复选框，也可以是一个您可以输入此信息的文本字段。您可能还需要一个系统或服务来检测并自动确定环境中各种敏感数据类型。从零开始构建是一回事；而面对成千上万个具有不同数据类型、需要您逐一筛选的文件则是另一回事。我建议获取一项服务来帮助自动确定文件的数据类型。这将减轻文件数据类型标记的管理负担。


  在您的 CMDB 中，您还应确定谁是该信息和元数据的数据管理性。此人将负责准确确定文件服务器上存储的数据类型。他们还将成为了解信息关键性及其用途的联系人。


  您还需要了解敏感信息的流向。这种信息流可以用图表描绘，以便于理解数据驻留在何处以及流向何处。在发生事件时，这将有助于确定 PII 所在位置，以及哪些组件可能接触过该敏感信息。


  ### ID.AM-08


  > “*系统、硬件、软件、服务和数据在其整个生命周期内均得到管理。*”


  绝大多数（如果不是全部）系统、服务和数据都应附带生命周期。建立此生命周期是为了帮助确定其关键性以及是否正在使用中。这可以通过制定政策、标准和程序来协助生命周期管理计划。


  企业通常都有生命周期管理政策，规定笔记本电脑或服务器只能使用预定年限（大多数为 3-5 年）。一旦达到此时间范围，该 IT 资源将被退役，并提供新的资源。这是为了跟上软件、固件和硬件组件的更新，因为旧组件可能不再受支持。


  软件也是如此。并非所有软件都会无限期维护；它也有生命周期。Microsoft、Apple 甚至 Linux 发行版每隔几年就会发布新的操作系统，并停止维护旧版本。如果您不保持最新状态，可能会错过安全补丁或软件包。维护软硬件生命周期对网络安全计划的成功至关重要。


  毋庸置疑，信息也有生命周期。您的组织应制定数据或信息生命周期管理政策，以确保在数据不再需要时将其销毁。这将有助于防止数据泄露，因为旧的或过时的信息通常比更新的信用卡或
  PII 信息受到的监管较少。


  这种生命周期管理还包括在不再需要时成功删除信息。当不再需要时，应从硬盘驱动器和拇指驱动器等硬件组件中安全擦除信息。这也将有助于防止数据泄露或敏感信息意外丢失。您应制定政策，规定如何擦除组件或安全删除文件。NIST
  编制了一份指导如何安全删除信息的文件。该文件称为 *NIST SP 800-88 – 媒体清理指南* [1]。


  CMDB 将成为您 IT 计划的核心枢纽。它应具备在一个集中位置跟踪所有内容的能力。CMDB 不仅可用于跟踪系统和服务，还可用于事件响应程序。在下一节中，我们将讨论对环境执行风险评估的必要性。


  # 风险评估 (ID.RA)


  风险评估有助于识别组织内部的风险。风险标识符可以包括漏洞、威胁，以及了解这些标识符带来的影响。我们还必须将识别出的系统风险与我们的风险登记册关联起来，以便进行跟踪和修复。


  ## ID.RA-01


  > “*识别、验证并记录资产中的漏洞。*”


  您将需要一个工具来帮助识别与 IT 资源相关的漏洞和风险。该工具应经过外部第三方公司的验证，以确保您接收到关于风险的准确且最新的信息。有多种漏洞扫描器可供选择。一些需要付费或订阅，而另一些则是您可以使用的免费开源工具。


  选择一款能突出显示与 IT 资源相关风险的漏洞扫描器。并非所有扫描器都是平等创建的。例如，PCI 要求您在扫描漏洞时使用**经批准的扫描供应商 (ASV)**。许多扫描器提供在系统上安装代理的功能，而其他扫描器可能只是扫描您的环境以查找漏洞。您选择的服务类型将决定突出显示风险的准确程度。


  如果您选择使用扫描器（不带代理的），请确保将扫描软件配置为执行已认证扫描。与仅扫描系统或服务外部的扫描引擎相比，已认证扫描能提供更准确的结果。您还需要制定政策和程序，以适当的方式修复这些风险。






  # 风险评估概述


  漏洞扫描器只是成功风险管理计划的一个组成部分。收集威胁情报对于了解整体风险也是必不可少的。例如，**网络安全和基础设施安全局**（**CISA**）维护着一份**已知被利用漏洞**（**KEV**）清单。该清单免费提供给订阅者，并会在发现新威胁时通知接收者。有了这些情报，您可以基于风险做出决策，确定哪些补丁或漏洞应优先修复。


  您还可以举行事后复盘或经验总结活动，以帮助确定当前流程是否有效，或需要在何处进行改进。事后复盘在事件发生后进行；这可能是一次安全事件，也可以在项目完成后进行。确保将政策和程序作为复盘过程的一部分，以确保它们也得到更新，从而保证一切顺利运行。


  ## ID.RA-02


  > “从信息共享论坛和来源接收网络威胁情报。”


  如前所述，CISA KEV 目录是获取威胁情报信息的绝佳资源。这些信息丰富了您当前的风险和漏洞管理计划，但它并非获取此类信息的唯一资源。


  虽然有许多付费的威胁情报服务可供选择，但也有免费的服务可供订阅。包括美国在内的多个国家都有**计算机应急响应小组**（**CERT**）提供威胁情报。US-CERT
  设有邮件列表，订阅后可接收漏洞信息。您和您的组织可以加入**信息共享与分析中心**（**ISAC**），或与政府机构（如 FBI **国内安全联盟委员会**（**DSAC**））合作，以接收和提供敏感的网络相关信息。


  拥有漏洞或威胁情报信息还能提供宝贵的情报，可将其导入**安全信息和事件管理**（**SIEM**）或 CMDB。这将有助于识别哪些系统风险最高，以及什么应尽快修复。例如，您认定某系统面向外部、处理信用卡信息，且存在多个必须修复的漏洞。这些信息可从
  CMDB 中提取，以帮助确定系统的关键性及其可更新的时间。


  威胁情报还可能提供对手试图访问您系统的**战术、技术和程序**（**TTP**）。MITRE 开发了 ATT&CK 框架 \[2\]，其中包含 14 个不同类别，涵盖攻击发生的方式以及您可以实施以缓解攻击的控制类型。点击网站上的任意攻击向量，即可阅读关于攻击内容和意图的完整描述。它还将提供缓解和检测该攻击的示例。


  ## ID.RA-03


  > “识别并记录对组织的内部和外部威胁。”


  现在您已订阅了一两个威胁情报源，可以开始识别环境中的威胁。一旦识别出威胁，您必须采取行动。如果它影响您的组织，您必须将其记录在数据库或电子表格中，并确定如何处置该风险。这也可以录入风险登记册以备记录。


  记录漏洞及其处置方式也可以作为您用于报告的指标。基于影响或不影响您组织的威胁和漏洞的指标，在确定工作量时会很有帮助。例如，Log4j 初次披露时似乎引爆了整个互联网。您需要漏洞管理扫描引擎来确定您的组织是否易受
  Log4j 漏洞攻击。如果您受影响，风险登记册中的条目应显示漏洞类型和受影响的 IT 资源。此时，您可以制定项目计划来解决它。


  如果您不受影响，您也需要记录这一事实，以表明您正在履行尽职调查。审计师或第三方评估机构（包括您的客户和供应商）将想知道特定漏洞是否被引入您的环境，以及您对该问题的响应是什么。如果您表明对此不采取任何行动，这可能会向客户传递他们可能想去别处的信号。


  ## ID.RA-04


  > “识别并记录威胁利用漏洞的潜在影响和可能性。”


  在评估 IT 资源的关键性时，请确保您了解系统的关键性。这可以是前面讨论的分层结构的一部分，或其他类型的识别因素。请确保将其记录在集中式平台（如您的 CMDB）中。


  与内部和外部利益相关者合作，了解威胁影响组织的可能性和后果。了解如果受到特定威胁影响，该风险将如何影响某个系统或一组系统。这还将帮助您了解在哪些方面可能需要额外资源，以确保关键系统已打补丁且漏洞已修复。


  您还应开展桌面推演，以识别针对 IT 资源威胁的响应差距。这将有助于在真正发生事件时建立响应的肌肉记忆。所有这些旨在改进您对已识别威胁或风险的响应。


  桌面推演是一种基于场景的演练，您可以向一组团队成员（通常是您的**事件响应**（**IR**）团队）提出一系列问题，以观察他们对特定场景的反应。例如，您可以开展一次桌面推演，场景是您的组织遭受勒索软件攻击，或因商业电子邮件欺诈而遭遇账户接管。这些通常每季度进行一次，用于建立团队的肌肉记忆。这也是观察他们反应并围绕平均检测时间和平均响应时间建立指标的时机。


  ## ID.RA-05


  > “利用威胁、漏洞、可能性和影响来了解固有风险，并为风险响应优先级排序提供依据。”


  随着您了解威胁及风险影响系统的可能性，您可以进一步对 IT 资源执行风险评估。风险评估旨在突显从 IT 资源继承的风险。一旦识别出这些风险，您就可以制定修复项目计划。


  对特定 IT 资源执行有针对性的安全评估，以更好地了解您的风险。有针对性的风险评估可以是一组问题，用于了解特定系统或设备上实施的安全控制。例如，有针对性的风险评估可以突显是否安装了防病毒应用程序，或是否正在使用多因素认证。它有助于确定防火墙是否保护环境以及访问这些系统的规则。这些控制应记录在有针对性的风险评估文档或**系统安全计划**（**SSP**）中。





  在 SSP 中，您还应记录设备上实施的所有网络安全控制措施。这将帮助您确定缺少哪些控制措施以及在哪些方面需要改进。例如，在您的 SSP 中，您将记录给定 IT
  资源的所有安全配置。如果系统缺少反恶意软件，例如，那将是一项风险，应作为 SSP 的一部分记录在风险登记册中。然后，您将能够确定对缺乏控制措施的应对措施，以便在需要时规划额外资源，以降低与该资产相关的风险程度。


  ## ID.RA-06


  > *选择、确定优先级、规划、跟踪和沟通风险应对措施。*


  在*治理*职能中，我们了解到与我们的网络安全计划相关的风险有积极和消极之分。在应对消极风险时，您必须选择如何处理给定 IT 资源已识别的风险。消极风险应对措施包括以下内容：


  *   **接受** – 您接受该风险，并决定不采取任何措施来缓解它

  *   **缓解** – 您解决该风险

  *   **转移** – 这涉及将风险转移给第三方，通常是网络保险提供商

  *   **规避** – 这通常是指因风险过高、缓解成本过大或由于其他业务要求而放弃项目


  接受风险时，您计划不对已识别的风险采取任何行动。这意味着您接受与该 IT 资源相关的任何风险。缓解风险是指将风险降低到可接受的水平，包括实施缺失的控制措施或重新配置控制措施，以确保其达到或超过风险降低要求。风险转移是允许您将风险转移给第三方供应商的事件。大多数情况下，这包括使用网络保险提供商，或将服务的托管转移给
  SaaS 提供商或 CSP。最后，规避风险意味着您不打算在环境中实施该产品或资源，无论其部署位置如何。风险实在太高。


  无论您的意图如何，您还应拥有一个项目计划或**行动计划和里程碑**（**POA&M**），以执行特定的风险应对措施。POA&M 旨在帮助您和组织处理风险及您预期的应对措施。您可以将这些风险放入风险登记册，与利益相关者讨论，以确保风险得到妥善处理。


  ## ID.RA-07


  > *管理变更和例外情况，评估风险影响，记录并跟踪。*


  如果不存在变更管理流程，此控制目标将要求您创建一个新的变更管理流程。变更管理涉及识别环境中所需的变更，确定变更失败时如何回滚，并将这些变更传达给利益相关者。


  您需要记录对给定系统所做的变更。此文档可以采用变更日志或其他格式，以便您跟踪对给定系统所做的变更。此变更日志也有助于他人了解 IT 资源是如何配置的以及做了哪些变更。


  变更请求应包括进行或不进行变更的风险、进行变更的要求、其流程、回滚方案以及负责变更的人员。变更请求还应包含审批流程，以允许他人审查请求的变更，并确保所做的变更是适当的。


  ## ID.RA-08


  > *建立接收、分析和响应漏洞披露的流程。*


  我们已经讨论过 ISAC（信息共享与分析中心）及其重要性。通常，ISAC 只有在接收到的信息质量好时才有效。ISAC 不仅要向其成员发送关键风险信息，成员也必须与
  ISAC 共享敏感的网络风险信息。


  确保向您的利益相关者、托管服务提供商、ISAC 或您合作的其他机构提供关键的网络风险信息。这将有助于确保每个人都拥有做出良好风险处理决策所需的最有价值、最新的网络风险信息。


  如果您向客户提供第三方服务，请向他们提供有关您和您的组织可能遇到的任何问题的信息，以便与您合作的各方保持透明。这将改善您和您的组织，并加强您与客户之间的关系。


  ## ID.RA-09


  > *在获取和使用前评估硬件和软件的真实性和完整性。*


  您可以通过几种不同的方式来查看所用软件和硬件的真实性和完整性。软件开发人员使用加密签名来确保安装在设备上的软件是合法的。没有此签名，任何软件都将无法加载，从而防止有人将恶意软件安装到设备上。


  数字签名是一种方法；另一种方法是对软件运行哈希函数。运行哈希函数时，您会获得一个唯一的字符值，用于确定软件的完整性。如果哈希值不同，则意味着软件已被更改，不是制造商开发的有效软件。我们也可以对常规文本文件执行此操作。例如，包含
  `This is a hashed file` 的文件将产生如下哈希值：


  `2c0e7d464573504149e86e8be26a1118b077c7dbee562086900df1943061bae7`


  如果我们将文件内容更改为 `This is a hashed file!`，新结果将如下所示：


  `10b481d359a851de7efb58b1cc4f0b237014e37be60936ae22da52ac10eb7388`


  哈希值的内容完全不同。哈希函数可以针对文件、编译后的软件、多媒体或系统上的任何内容运行。


  对不提供上述两种功能之一的软件开发人员要保持极度谨慎。如果没有检查软件有效性的机制，可能会导致供应链问题，即软件在开发人员不知情的情况下被篡改。这也可能意味着恶意软件在无人知晓的情况下被植入应用程序。


  ## ID.RA-10


  > *在获取前评估关键供应商。*


  正如我们评估风险并为 IT 资源应用关键性层级一样，我们应该对供应商应用同样的审查。根据供应商服务的关键性，这可能会促使您也想对供应商进行风险评估。


  第三方供应商是您网络和员工队伍的延伸。他们在提供急需服务的同时掌握着您的敏感数据。因此，您应该对这些供应商进行评估，以确保其安全模型在保护数据方面符合您或您企业的期望。我们之前在*第
  3 章*中讨论过使用 SIG Lite 或 COBIT 来执行这些评估。这是您评估其安全控制措施中一个急需的步骤。


  # 改进 (ID.IM)


  我们投入了大量精力来识别 IT 资源并围绕它们执行风险评估。这项工作必须纳入一个计划中，持续努力并不断改进，以确保我们不会忽视识别和分类资源。这下一组控制措施旨在确保持续改进发生，以更好地简化我们的流程。


  ## ID.IM-01


  > *从评估中识别改进。*




  虽然我们详细讨论了如何对供应商和第三方执行网络安全评估，但我们也应该对自己进行评估。这些评估将凸显我们的不足，并制定改进项目计划。切勿畏惧评估，因为它们旨在帮助您改进。正如*第
  2 章*所述，使用戴明循环来识别改进领域，然后执行这些计划。


  评估完成后，找出项目中的差距，制定 POA&M（行动计划与里程碑）以进行改进，并付诸实施。我建议至少每 2 年执行一次这些评估。但我不会建议超过这个周期。如果您有时间且负担得起，至少每年做一次。此外，应建立自动化手段来识别需要改进的地方。审核您的
  AV（防病毒）、漏洞管理、用户访问和数据分类。自动化程度越高，您就能越好地识别差距并改进项目。


  ## ID.AM-02


  > *改进事项通过安全测试和演练来识别，包括与供应商和相关第三方协同开展的测试和演练。*


  我们尚未涉及框架的*响应*和*恢复*部分；不过，我们开始介绍如何为事件响应活动做好面向未来的准备。为此，我们可以利用桌面推演、渗透测试和其他模拟演练。虽然我们在内部执行这些活动，但也应询问第三方利益相关者，看他们是否愿意参与。


  许多组织将部分或全部安全工程和运营外包。这样做有几个原因；资源限制和招聘合适的人员通常是最大的两个原因。因为他们是您团队的延伸，您必须将他们纳入事件响应和恢复计划中。


  如何纳入他们？每年与提供商进行一次桌面推演，以便双方都了解响应应有的样子。攻击模拟不仅是了解内部员工技能组合的好方法，还能凸显**托管安全服务提供商 (MSP)**
  可能存在的任何不足。


  渗透测试也是识别事件响应计划差距的好方法。一个有趣的方法来了解人们是否懂得如何响应事件，就是不告诉他们正在进行渗透测试。这将帮助您衡量人们是否在关注并从演练中学习。


  围绕 `mean-time-to-detect`（平均检测时间）和 `mean-time-to-respond`（平均响应时间）建立指标，针对特定事件。了解您环境中有多少漏洞，以及计划何时修复。了解从事件中恢复并使系统重新上线需要多长时间。这些指标将有助于开发响应事件的新颖创新方法。


  ## ID.AM-03


  > *改进事项通过执行运营流程、程序和活动来识别。*


  事后复盘或经验教训活动是了解先前事件及响应程序是否有效的好方法。在每次事件或项目结束时进行这些活动，以更好地了解事件如何发生、为什么发生，以及您和您的团队如何响应。正如我们与第三方供应商进行桌面推演一样，我们也应该与值得信赖的第三方供应商开展经验教训活动。


  最后，使用指标来确定如何改进 `mean-time-to-detect` 和 `mean-time-to-respond`。也许您需要改进事件响应计划、改变沟通方式，或实现更多响应自动化；指标将帮助凸显您的不足，并指引您改进流程。


  ## ID.AM-04


  > *建立、沟通、维护并改进事件响应计划和其他影响运营的网络安全计划。*


  我们将在后续章节中更多地讨论这一点；不过，您必须制定一份 IR 计划。事件发生时，该计划对您的响应至关重要。您的 IR 计划应详尽全面，不仅包括事件或威胁的识别，还包括如何应对威胁，以及在发现威胁时如何联系团队中的每个人。此外，我们需要通过经验教训活动持续改进响应计划。


  在成熟度和风险缓解方面，我们需要争取达到第 3 层级或第 4 层级。我们要确保对事件的响应迅速，且最终对员工来说轻松容易。这需要大量准备工作才能让您的 IR 团队达到这一水平；但这很重要。


  建立识别威胁和风险的政策和标准，以及如何应对它们。您的 CMDB 现在是您环境中已知和未知资产识别与跟踪的数据库。您还可以将漏洞信息导入 SIEM 系统，以关联传入的威胁以及您想如何响应它们。


  确保纳入经验教训活动，并定期更新您的政策和标准。这将为未来的事件做好准备，并最终缩短您的检测和响应时间。


  # 概要


  如果您还没有 CMDB，构建 CMDB 将成为满足该控制族控制目标的焦点。CMDB 应记录资源的所有标识信息；这包括系统的 IP 和 MAC 地址、品牌、型号、负责人等。CMDB
  中的信息还应包括资源的重要性，以及它是本地部署、非本地部署还是第三方托管的 SaaS 产品。


  您还应包含这些系统上存在的软件和固件。两者都应定期更新，以确保系统没有漏洞和缺陷。您还应在 CMDB 中包含流氓设备。这不仅会凸显正确识别流氓资产的必要性，还将帮助您了解网络连接了什么。CMDB
  还应保存网络流程图，这在事件发生时将派上用场。网络图应描绘环境中有什么、它们与什么通信，甚至敏感信息从一点流向另一点的流向。在事件发生期间，您可以利用这些图表来帮助理解放置在系统上的安全控制以及与资产相关的风险类型。


  最后，您应跟踪 `mean-time-to-detect`（平均检测时间）和 `mean-time-to-recover`（平均恢复时间）的指标。此外，跟踪环境中的漏洞数量以及哪些漏洞计划修复。在尝试识别网络中的风险时，了解和理解这些非常重要。


  在下一章中，我们将探讨*保护*功能。该功能旨在保护您的数据免受可能想要访问它的人的侵害。我们将讨论如何利用加密来保护数据，并检测数据是否以任何方式被篡改。


  # 参考资料


  1. *NIST SP 800-88*：[`csrc.nist.gov/pubs/sp/800/88/r1/final`](https://csrc.nist.gov/pubs/sp/800/88/r1/final)

  2. *MITRE ATT&CK 框架*：[`attack.mitre.org/`](https://attack.mitre.org/)

  '
- '# 5. 保护





  我们在第 4 章中详细了解了识别功能。通过了解什么连接到了您的网络、什么没有连接，以及硬件、软件、已知设备和未知设备，您可以建立自己的信息数据库。该数据库称为配置管理数据库（`CMDB`），可与您网络安全产品组合中的其他服务配对使用。这包括利用漏洞管理系统丰富信息，或将其与灾难恢复和事件响应计划结合使用。关于漏洞数量、从发现到修复的时间范围以及对组织的风险等指标至关重要。这种协作方法可增强您对事件的响应能力。在本章中，我们将介绍保护功能。我们将探讨几种不同的控制措施，例如如何开展安全意识培训、如何保护敏感信息，以及如何增强
  IT 资源的韧性。我们将继续利用之前建立的相同系统（如您的 `CMDB`）来构建先前的控制系列。


  本章将涵盖以下控制措施：


  *   身份管理、认证和访问控制

  *   意识与培训

  *   数据安全

  *   平台安全

  *   技术基础设施韧性


  # 身份管理、认证和访问控制（`PR.AA`）


  在该控制系列中，我们将介绍身份如何创建和管理，以及如何证明身份与使用该身份的人相匹配。身份不一定非要绑定到个人；它们也可以是基于系统的身份。我们必须确保每个身份都是唯一的，并且每个身份仅分配给一个实体。


  ## `PR.AA-01`


  组织管理授权用户、服务和硬件的身份和凭据。


  管理用户凭据有多种方式。大多数组织使用提供身份存储的系统。身份存储包含用户名、密码、组和其他安全相关信息。然后，该身份存储通过 `LDAP` 与其他下游系统以标准方式通信。


  凭据有几种不同类型。有与用户或员工绑定的基本凭据，通常仅包含密码或 PIN 码。还有共享凭据，用于“破玻璃”应急流程。这些通常是用于登录系统并执行某些提权任务的管理员账户。


  工单通常伴随凭据请求。这是为了给在受监管行业（如 CMMC、PCI 和 HIPAA）工作的人员提供书面记录。IT 部门会处理由不同部门（如人力资源部）发起的请求，以入职新用户或从身份存储中移除旧用户。


  每个身份都应是唯一的，因为不应有两个人拥有相同的用户名。如果不止一个人拥有同一个账户，就会产生冲突。也就是说，服务账户也应是唯一的，并为退役目的进行跟踪。如果您继续在多个系统中使用相同的服务账户，您将开始对该账户产生全方位的依赖。如果没有适当的跟踪，一旦发生问题（例如需要更改密码），您将不知道在哪里更改服务的密码。这可能导致严重的安全隐患。


  如果您在使用的凭据之上部署了证书，则员工离职时需要吊销这些证书。在许多情况下，加密证书可用作密码的替代品，或与密码结合使用。基于证书的认证通常与员工入职时提供的工牌绑定。


  保护用户凭据至关重要，因为这些身份能够登录系统。如果凭据丢失或被盗，攻击者可能在您不知情的情况下登录您的系统。这些攻击往往导致系统沦陷或勒索软件事件。


  ## `PR.AA-02`


  根据交互上下文，对身份进行验证并将其绑定到凭据。


  有很多方法可以证明身份。您可以要求提供证明或验证某人就是他们声称的那个人，方法是要求出示驾照、社保卡、水电费账单或护照。您也可以通过验证某人的政府带照片身份证来亲自证明其身份。这些都是证明某人身份的不同方法，但您如何知道哪种方法合适？


  在授予某人访问您系统的权限之前，您应始终验证其身份，无论是要求他们到办公室进行物理身份验证，还是使用识别卡。这是确保您环境安全的必要步骤。验证通过后，IT 部门即可为新员工提供用于登录
  IT 资源的凭据。


  ## `PR.AA-03`


  对用户、服务和硬件进行认证。


  现在我们的员工有了凭据，我们必须将他们认证到给定的系统或服务。有几种不同的方法可以实现这一点。我们可以根据其任务相关的风险，要求对给定设备仅进行单因素认证或多因素认证（`MFA`）。我们还必须阻止与他人共享凭据，因为这违背了拥有唯一凭据的初衷。


  我们通常认为认证就是向 IT 资源提供用户名和密码。这是最简单的认证方法，仅要求用户提供他们知道的东西。但随着计算机多年的发展，破解密码的技术也随之进步。


  用户也会因记忆不同密码而感到疲劳。这是由于他们有权访问多个系统和服务，因此对多个应用程序使用相同的密码。针对 LinkedIn 和 Facebook 等第三方服务的威胁导致其客户密码泄露，通常是未加密的。这导致了密码喷射攻击，即使用这些泄露中发现的相同密码针对其他基于
  SaaS 的应用程序。


  这促使许多在线服务采用 `MFA`。除了用户知道的某样东西外，他们还必须拥有某样实物或验证某项特征，通常是指纹或视网膜扫描。传统 `MFA` 系统使用一种物理设备，该设备具有轮换的一次性密码（`OTP`）或
  PIN 码供您输入。现代系统使用推送通知到您持有的手机。兼容 `FIDO` 的物理设备（如 `YubiKey`）也是一种可用的 `MFA` 类型。`FIDO`
  是一种较新的认证标准，旨在消除密码。它使用公钥/私钥认证，其中 `SP` 保存您的公钥，而您保存私钥。


  `MFA` 允许更高级别地证明被认证者的身份。如果有人获得了密码并尝试认证，由于需要第二因素，他们仍然无法成功。


  然而，`MFA` 也并非没有问题。`推送疲劳` 是指攻击者反复向服务进行认证，淹没 `MFA` 提供商，连续发送多个推送通知，希望用户按下“确定”按钮。`SIM
  卡交换` 也是一种威胁，攻击者试图将受害者的电话号码关联到他们持有的号码上。尽管存在这些风险，但仍然重要的是在任何可能的地方使用 `MFA` 来降低弱密码的风险。


  ## `PR.AA-04`


  身份断言受到保护、传输和验证。






  # 访问控制 (PR.AA)


  ## SAML 2.0 和身份提供者


  身份验证应防止会话劫持、密码喷射和 MFA 推送疲劳，并确保通信加密。这些只是选择单点登录提供商时需要考虑的几项保障措施。已制定了一些标准来协助解决此问题，其中之一是**安全断言标记语言
  (SAML) 2.0**。SAML 2.0 通过**身份提供者 (IdP)** 提供身份验证。IdP 用于对用户进行一次性身份验证，然后向 SP 提供令牌断言。


  IdP 和 SP 之间的通信受到保护，免受攻击，并且您可以强制实施 MFA。使用 SAML 提供商的另一个好处是，您可以要求用户重新进行身份验证，从而在发生账户接管事件时终止所有活动会话。


  ## PR.AA-05


  *访问权限、授权和授权在策略中定义、管理、执行和审查，并融入最小权限和职责分离原则。*


  当我们向员工授予凭证时，我们为他们提供对特定资源的访问权限。随着时间的推移，这些凭证可能会获得所谓的**权限蔓延**，即调往不同部门或晋升的员工保留了对其不再需要的系统的访问权限。通常，当这种情况发生时，员工使用的凭证会保留其旧权限，同时获得新权限。我们必须考虑将凭证限制为员工完成日常工作所需的权限。


  我们还可以考虑**基于属性的访问控制 (ABAC)**，它考虑的因素远不止用户名和密码或 MFA 的使用。ABAC 可以考虑用户或所用凭证的位置、一天中的时间、他们试图访问的内容以及他们的访问意图，无论是读取还是写入文档。


  我们应安排时间让员工审查访问权限。这将有助于减少特定用户拥有的权利数量，进一步保障网络安全。用户访问审查应至少每年进行一次，或在提出更改用户账户权限的新请求时进行。


  ## PR.AA-06


  *对资产的物理访问得到管理、监控和执行，与风险相称。*


  我们不仅需要保护 IT 资源的逻辑方面，还需要保护物理方面。数据中心安全应始终考虑保护资产的新方法，因为许多逻辑安全配置可能被绕过。管理员账户可通过插入服务器的物理
  CD 进行重置，网络设备可通过将注册表设置为特定值来绕过，或通过按住按钮 10 秒来重置设备。


  许多数据中心不仅会物理上保护环境，还会实施多项政策和标准，规定人员如何在设施内被陪同。例如，员工可能想进入数据中心维修故障设备。我们应检查他们是否被允许进入数据中心。通常会执行额外的背景调查，以检查试图进入设施的人员是否可信。我们甚至可以决定员工是否可以独自进入设施，或者是否必须由数据中心官员陪同。


  我们还必须确立员工进入设施的理由。这通常通过工单完成，因中断而请求访问设施。即使他们已被授予设施访问权限，也不意味着他们可以随时进出数据中心。必须有正当理由。


  无论员工能否进入设施，我们仍需验证其身份。这意味着要求员工出示工牌，在签到表上签名并说明访问原因，以及出示授予其进入设施权限的工单号及其访问原因。


  这对客人和供应商同样适用。许多客人或供应商若无人陪同，不应被允许进入数据中心。如果他们不为您的公司工作，您可能不希望任何人在无人陪同的情况下访问数据中心。


  设施应部署多项防护措施，包括安全摄像头、保安和报警系统。这是为了监控环境，并在出现问题时提供可追溯性。进入服务器室时，我们还可以设置人员闸，要求在进入前进行最后一次授权。在高安全环境中，我们可以使用锁定的机柜，仅提供特定机柜的钥匙。设备上也可使用
  RFID 标签，如果服务器被移出设施，则触发警报。


  有必要在物理和虚拟层面验证一个人是否为其所声称的人员。这是为了确保正确的个人执行预定职责。安全意识和培训也是教育用户在面对威胁或已识别风险时应采取的适当步骤的关键一步。让我们了解如何做。


  # 意识与培训 (PR.AT)


  贵公司的员工是网络安全方面的眼睛和耳朵。他们是您的第一道防线。员工往往会在您之前发现针对您设施的新威胁。安全意识和培训不仅面向网络安全专业人员，而是面向公司的每个人。


  ## PR.AT-01


  *为人员提供意识和培训，使其具备知识和技能，能够在考虑安全风险的前提下执行通用任务。*


  **安全意识**与**安全培训**是有区别的。**安全意识**旨在在设施内提供通用的网络安全意识。这可能意味着在整个组织张贴传单或海报，宣传网络安全主题。这主要面向
  IT 部门以外的人员。


  另一方面，**安全培训**则更有针对性，或专注于提供特定领域深入知识的网络安全主题。例如，我们可能了解网络钓鱼诈骗或二维码被恶意利用的危险。一个重点安全培训主题将是培训我们的防火墙管理员使用我们刚刚部署的新防火墙。


  网络安全意识活动应定期开展。最佳频率是至少每月一次；时间再长，研究表明人们面对风险时会失去对该做什么的关注 [*1*]。研究表明，每年仅开展一次安全意识项目，与完全不做任何事情一样无效。这就是为什么定期开展这些项目是有益的。


  通过网络钓鱼演练跟进您的意识项目，以强化在与电子邮件交互时保持谨慎的必要性。随着网络钓鱼攻击的增加，您需要确保员工接受过培训，知道在收件箱中遇到网络钓鱼邮件时该怎么做。


  如前所述，重点培训也是必要的，但这通常针对 IT 相关员工。培训每年至少为您的 IT 和网络安全员工开展一次。也许您需要派他们去上一堂关于使用防火墙的课程，或提供关于新安装的**入侵检测系统/入侵防御系统
  (IDS/IPS)** 设备的培训。重点培训也比意识培训昂贵。根据所请求的培训类型，成本可能高达数千美元。这对特定员工是可以接受的，但不适用于全体员工。





  您还可以考虑为员工举办关于网络安全主题的演示。这是一种有趣且具有成本效益的方式，无需购买安全意识培训计划即可对员工进行安全相关主题的培训。请务必紧跟新趋势以及攻击者试图获取网络访问权限的新手段。虽然这可能节省资金，但使用供应商提供的培训仍然可能有益。


  ## PR.AT-02


  *专业岗位人员将获得意识教育和培训，以便他们具备相关知识和技能，在考虑安全风险的前提下执行相关任务。*


  在创建网络安全意识计划时，您应注意组织内的几个专业岗位。为高管领导团队、财务、人力资源、法务或组织中的其他部门制定课程非常重要，因为他们在 IT 和网络安全方面面临相似但不同的挑战。


  虽然通用的网络安全意识计划将满足培训员工的需求，但也必须了解这些领域对业务有不同的关注点。财务部门可能关注银行或电汇转账，而人力资源成员可能关注医疗记录或直接存款转账。针对这些部门的专业领域进行有针对性的关注，在专注于安全意识计划时可能会有所帮助。


  这些重点培训领域不必每月进行。重要的是要记住，这将是在您现有的意识计划之外进行的。您可以有几个月的通用意识培训，并零星地对这些部门的风险领域进行更有针对性的审视。


  网络安全意识还应包括受信任的第三方、供应商或其他有权访问您网络的人员。请记住，这些人员被视为员工增补或您的 IT 或其他部门员工的延伸。他们应被要求接受与其他员工一样的必要培训。第三方供应商还应被要求审查并签署公司政策和标准，以便他们了解在使用公司设备和设施时什么是可接受的，什么是不可接受的。


  在涵盖了意识教育和培训的需求后，我们现在需要了解如何保护数据。


  # 数据安全 (PR.DS)


  保护静态数据、传输中数据和使用中数据并非易事。但值得庆幸的是，有内置工具可让我们保护数据在所有阶段的安全。


  ## PR.DS-01


  *静态数据的机密性、完整性和可用性得到保护。*


  加密是该控制系列的核心。为确保我们充分保护信息，我们必须首先加密数据所在的驱动器。这很重要，原因有很多，但最大的原因是确保如果设备丢失或被盗，无法从硬盘驱动器中检索数据。


  从未加密的硬盘驱动器获取信息易如反掌。您可以在任何当地的 IT 或电脑商店购买设备，通过 USB 将驱动器连接到另一台计算机并读取其中的信息。如果硬盘驱动器已加密，则不会出现这种情况。要解密驱动器，您需要密钥。


  确保您环境中的每个驱动器都使用全盘加密进行加密。Microsoft 使用名为 `BitLocker` 的程序；对于 Apple 设备，有 `FileVault`；对于
  Linux，有 `LUKS`。这些程序将为您管理设备加密，以便您可以使用硬盘驱动器上的信息，完成后再次加密您的文件。始终使用可用的最新加密算法。这是为了防止有人对设备执行侧信道攻击，在没有密码的情况下获取访问权限。


  此外，确保您正在加密可移动媒体，如外部硬盘驱动器或拇指驱动器。这些设备的加密与内部硬盘驱动器同样重要。如果这些设备包含敏感数据，如 `知识产权` (`IP`)
  或 `个人身份信息` (`PII`) 数据，其丢失也将对您的数据安全产生重大影响。根据丢失数据的严重程度，您可能需要发布声明。


  ## PR.DS-02


  *传输中数据的机密性、完整性和可用性得到保护。*


  保护 `传输中数据`（两个或多个系统之间传输的信息）与保护 `静态数据`（存储在本地硬盘驱动器或拇指驱动器上的数据）同样重要，原因有很多。正如将外部驱动器挂载到计算机并读取其内容易如反掌一样，`Wireshark`
  等应用程序也使读取未加密的传输中数据变得易如反掌。


  `Wireshark` 能够从网络线路上读取数据包并确定正在使用的协议。我们可以重建访问过的网页，甚至重放视频或声音，所有这些都来自该应用程序。加密传输中的数据可防止这种情况发生。


  必须编写政策和标准，以反映保护敏感数据的需求。这应包括要使用的正确加密算法和位强度。还应包括严格禁止的加密方式。这些政策文件随后用于强制执行风险数据的保护。


  不仅传输中的数据应加密，我们还需要验证消息或文档在传输过程中未被篡改。实现这一点的唯一方法是通过哈希。如前所述，哈希是描述特定时间文件的加密值。如果文件曾被修改，该哈希值会发生变化，反映出文档不再与原始文档相同。


  数字签名也可用于确定文件本身的真实性。数字签名是与软件或其他文件关联的加密文件，表明它是由供应商或您组织中的某人创建的。它需要使用私钥来创建签名，该私钥受保护在受保护的保管库或
  `硬件安全模块` (`HSM`) 中。


  您还应建立机制，限制敏感数据离开设施。您应在环境中标记或标记敏感数据以识别数据类型。然后，在文件被适当标记后，对这些文件应用限制，以防止它们通过电子邮件或其他文件传输协议（如
  `SSH 文件传输协议` (`SFTP`)）跨互联网发送。这不要与 `文件传输协议安全` (`FTPS`) 混淆。


  还应制定政策，限制在开发或测试环境中使用敏感信息。这些环境通常没有与生产系统相同的安全控制。由于宽松的网络安全控制，这使敏感信息面临风险。测试/开发环境应使用经过清理的信息，以防止数据意外泄露。


  ## PR.DS-10


  *使用中数据的机密性、完整性和可用性得到保护。*


  硬盘驱动器加密使用对称算法来保护静态数据。这种对称算法使用单个密码来加密和解密驱动器上的信息。访问文件时，驱动器将解密文件以便应用程序使用，完成后将重新加密文件回驱动器。这在我们的安全中留下了一个漏洞，因为文件在使用时不受保护。





  # PR.DS-11


  *创建、保护、维护并测试数据备份。*


  我们必须尽快保护数据，尤其是在数据不再需要时。现代操作系统会在数据不再需要时尽快将其从内存中移除。这是为了在丢弃数据前保护数据免遭篡改。请查看设备的系统和硬件规格，包括正在使用的硬盘加密应用程序，以防范内存攻击。


  这不仅要求笔记本电脑和台式机尽快将此类信息从内存中移除，也适用于网络设备，尤其是执行 `Transport Layer Security` (`TLS`) 卸载的设备。`TLS
  卸载` 通常用于负载均衡设备，因为连接必须被解密，以便设备决定将流量转发至何处。我们也可以利用 `TLS 卸载` 进行数据或信息发现，以确定离开我们网络的文件类型。


  无论应用何种场景，加密都会被分解以确定如何处理流量。如果攻击者获得了对负载均衡设备的访问权限，这将令人担忧，因为他们将能够搜刮内存，不仅获取敏感信息，还可能获取该期间使用的任何解密密钥。执行这些事务时务必格外小心，以防敏感信息落入错误之手。


  在确定特定 IT 资源的安全控制措施时，请确保也对该资源进行备份以满足业务期望。这是为了确保驻留在该系统上的数据得到相应备份。并非所有备份策略都相同；不同系统对执行和测试备份有不同的要求。


  在讨论备份策略时，您需要了解业务需求。某些一级系统可能需要按分钟备份以保存数据库事务日志，而二级或三级系统可能只需每天备份一次。这完全取决于业务部门制定的要求。


  测试备份与备份本身同等重要。您可能每天都在备份系统，这很棒，但如果备份失败了怎么办？您一开始真的有备份吗？定期测试备份。许多组织每季度测试备份，而其他组织可能每年测试一次。这完全取决于您愿意承担的风险等级。如果您的数据库备份策略是每五分钟执行一次，那么这表明这些备份很重要，测试频率应高于可能一个月只用一次的三级系统。这并非意味着三级系统不重要，而是说它不如数据库重要。


  许多备份策略包括同时使用增量备份和全量备份。增量备份更快且占用存储空间更少，最终意味着成本更低。全量备份顾名思义，是对整个系统、文件夹或文件的完整备份。恢复耗时较短；然而，成本高昂且占用最多存储空间。请与业务部门讨论以确定其期望，并制定最合理的策略。


  备份中充满敏感信息（无论是 PII、PCI、HIPAA、IP 还是其他被视为敏感的数据）本不足为奇。正如我们保护驻留在硬盘上的数据一样，备份也应加密，以防止数据意外丢失或被盗。加密备份应贴标签并以安全方式存储。组织还会执行多次备份，或复制单个备份副本并分发到多个地理位置分散的数据中心。这是为了确保备份冗余，以便在某设施发生物理故障时，能从其他地方获取备份副本。


  为了保护数据免受窃取者访问，我们必须对绝大多数甚至所有操作利用加密。加密带来诸多益处，补丁和配置管理亦是如此，我们将在下一节详细了解。


  # 平台安全 (PR.PS)


  正如我们识别硬件和软件一样，我们也必须维护它们。需要打补丁以解决软件漏洞和错误。一旦硬件和软件达到生命周期结束，应将其从环境中移除。在着眼于遗留软件和系统的移除时，我们也需要审视软件开发生命周期，以确保其得到适当维护。


  ## PR.PS-01


  *建立并应用配置管理实践。*


  当我们首次接收 IT 资源或安装软件时，通常会附带系统默认设置。虽然系统默认值在设置新设备时提供了便利，但不更改这些默认值会引入不必要的风险。在将系统默认设置投入生产环境前，我们必须更改它们。


  我们都见过并用过系统默认值。在认证提示符下是否曾输入过 `admin` 和 `password`？登录网络设备时是否曾用 `cisco` 作为用户名和密码？这些都是系统默认值的例子。它们易于使用、猜测且可在互联网上找到。这可能导致未经授权的用户和攻击者在您不知情的情况下登录您的网络。


  在将设备投入生产前，应更改这些及其他系统默认值。有可用工具可帮助识别应更改的系统默认值。*互联网安全中心* 为多种不同 IT 资源（如操作系统、网络设备、防火墙和数据库）制定了强化基准。


  您还应监控环境以检测与强化基线的任何偏差。这是为了确保未发生配置漂移，且资源保持在风险容忍度范围内。此外，保留所有更改的日志。这将需要创建 `变更咨询委员会`
  (`CAB`)。


  该咨询委员会将负责批准或拒绝对系统所做的任何更改。`CAB` 将出于历史目的跟踪对系统所做的所有更改，并确保在适当时间进行更改。通常，系统更改在无人知晓的情况下进行，可能导致混乱。


  ## PR.PS-02


  *根据风险维护、替换和移除软件。*


  如前所述，所有软件都遵循一个生命周期。此生命周期将包含多个阶段；然而，软件可以且总有一个结束日期。您的环境中是否仍在运行 Windows 2003？此软件需及时升级以安装错误修复和修复漏洞。所有这些都应与您愿意承担的风险程度相称。


  制定补丁管理生命周期策略，纳入补丁应用的时间。补丁管理生命周期策略还应包括正常维护之外的软件漏洞修补。这包括应立即修补的高危或严重漏洞。您的补丁管理也可能规定禁止修补的日期和时间。这通常是必要的，以确保财务系统在发薪日等时段在线。


  建立机制限制用户在其机器上能做和不能做的事。这可以包括移除管理权限。这可以减轻笔记本电脑或台式机上发生的配置漂移量，因为用户没有安装自己软件的能力。





  # 保护技术 (PR.PS)


  还有一些功能用于限制软件在机器上能做什么和不能做什么。当您只希望特定应用程序在系统上运行时，就会出现这种情况，这通常被称为应用程序的 `allow-listing`（允许列表）。实现这一点的最佳方法是降低用户的权限，并仅安装用户执行工作所需的必要应用程序。


  ## PR.PS-03


  *硬件的维护、更换和移除应与风险相称。*


  硬件与软件一样，都有使用寿命，通常为 3–5 年。更换周期的长短可能因制造商而异；但请注意，硬件不会永远耐用，即使我们希望它能。硬件组件会损坏，系统可能会显得变慢，或者您可能无法再升级设备上的固件。


  当硬件最终达到其使用寿命终点时，您必须安全地处置它。这并不意味着将其扔进垃圾桶并购买新设备；它必须得到妥善处置。许多硬件制造商都制定了关于如何安全处置设备的指南。相关文档介绍了如何从系统中移除硬盘并将其擦除，以便无法再从中检索任何信息。


  最好的方法是与专门从事硬件处置或回收的第三方供应商合作。这些企业将接收您的旧设备并妥善处置，同时安全地清除硬盘上的任何信息。通常，该企业会提供一份证书，证明所有设备均已处置且硬盘上不再残留信息。这很重要，因为它为最后持有设备的人员及执行的操作创建了书面记录或保管链。


  同样，请确保您已建立扫描机制以监控环境中的系统。这可以通过 `Simple Network Management Protocol` (`SNMP`) 或其他类型的监控协议来监控。您的
  `CMDB` 还应包含设备是什么、采购日期、到期日期以及最新安装的固件版本等记录。这将帮助您制定采购新设备的继任计划，或将工作负载迁移到云 `SP`。


  ## PR.PS-04


  *生成日志记录并使其可用于持续监控。*


  一般来说，如果设备连接到您的网络，它就应该记录日志。许多系统默认记录日志，例如操作系统，而其他系统则需要您激活日志记录功能。


  您必须制定计划，确定如何记录日志以及日志应存储在何处。通常，系统上线时没有关于日志发送去向的计划。这可能意味着某些系统在本地记录日志，而其他系统将日志发送到 `SIEM`
  系统。您还可能遇到不同系统具有不同日志保留期限的情况。有些可能保留一个月，有些更长，有些可能完全停止了日志记录。您需要进行评估以确定当前的日志记录状态。


  您还需要确定要保留日志多长时间。多项法规要求规定，在将日志卸载到异地存储设施之前，必须保留一定的时间。一个通用的经验法则是：磁盘上至少保留 90 天的日志，热存储（可随时检索）中保留
  180 天的日志，异地保留长达一年的日志。


  这也应在您的保留策略中注明。如果确定需要日志来确定事件的结果，而组织没有日志，就会陷入麻烦。如果您在没有策略的情况下删除日志，可能会被视为篡改证据。


  在日志解决方案中，还有其他一些要求您需要关注。例如，用户应被要求登录系统才能查看日志。除此之外，您还应要求 `MFA`。管理员不应有权从系统中删除日志；只有日志系统本身应具备根据既定策略删除日志的能力。用于存储日志的存储介质必须加密。最后，必须有完整性检查，以确保存储的日志条目未被篡改。这通常通过创建事件的哈希值来执行。


  日志本身有多种不同的格式；但是，您应关注某些特征。日志应包含事件发生的时间戳。每条日志都应有序列号，以便您追踪事件。这也是为了确保日志文件本身没有丢失条目。如果是基于网络的设备，它应同时包含源
  IP 和目标 IP，以及可能的端口号。用户账户也应伴随事件，以便追溯到特定用户。


  ## PR.PS-05


  *防止未经授权的软件安装和执行。*


  我们之前提到过这一点；然而，在用户在设备上的权限方面，我们必须采取最小权限方法。在许多情况下，以本地管理员身份登录是不必要的，并可能导致系统不稳定。软件应经过数字签名和验证，以确保所安装应用程序的真实性。


  还有其他方法可以保护软件安装。可以设置 `Mobile device management` (`MDM`)（移动设备管理）来提供公司或企业应用商店，仅允许从中安装获批的应用程序。`MDM`
  软件还允许您控制软件版本。例如，当您拥有仅能在特定版本的 `Java` 上运行的应用程序时，这会有所帮助。


  ## PR.PS-06


  *安全软件开发实践被集成，且其性能在整个软件开发生命周期中受到监控。*


  如果您的组织为内部资源或外部客户开发软件，它应该有一个相关的生命周期。在开发过程中有许多方法可以保护您的代码，并管理代码在不再使用时如何处置。让我们来看看。


  您应该在整个生命周期中对代码进行数字签名，以防止对手篡改。许多基于 `SaaS` 的 `Git` 提供商允许您使用 `GNU Privacy Guard` (`GPG`)
  对提交和标签进行数字签名。这对于进一步确定是谁向存储库提交了代码非常重要。当您对提交进行签名时，您还将收到一个 `Verified` 标签，进一步表明该提交是由经过验证的人员提交的。


  在向代码存储库进行身份验证时，您应该使用 `Secure Shell` (`SSH`) 密钥以及 `MFA`。这两种身份验证方法也将有助于确定对存储库进行身份验证的用户。然后，您可以使用
  `SSH` 密钥在本地计算机和存储库之间传输代码。


  一旦不再需要代码，就应将其丢弃。您可能需要在丢弃前保留代码数年。这将要求您将其存储在异地的加密卷中以妥善保管。您还需要确保代码不再对开发人员可用。这将有助于确保代码一旦退役，就无法再被使用。


  # 技术基础设施韧性 (PR.IP)


  我们将探讨对网络进行分段以促进资源更好隔离的方法，同时确定确保高可用性的方法。这将包括物理组件，如电源和环境温度。


  ## PR.IP-01


  *网络和环境受到保护，免受未经授权的逻辑访问和使用。*




  # 网络分段


  扁平网络易于设置、易于维护，也易于被攻破。为什么？因为你没有过滤两个或多个端点之间的任何流量。一旦 IT 资源被攻破，攻击者便可利用该设备跳转到网络内的其他系统。


  包括 PCI 在内的多个监管合规机构已强制要求组织将其 PCI 持卡人数据环境与网络的其余部分隔离开来。如果没有适当的分段，整个基于服务器的网络（而不仅仅是存放
  PCI 数据的系统）都将受制于 PCI 要求。


  最佳实践涉及对整个网络进行分段。如果你有服务器网络、用户网络和无线网络，这些都应由防火墙隔开，限制对其他网络的访问。组织还应设有访客网络，该网络将与环境的其余部分完全隔离。


  物联网、运营技术，甚至移动设备也应拥有各自的网络。关键在于 VLAN 的接口应驻留在防火墙或路由器上，这将允许对从一个资源流向下一个资源的流量进行有状态包检测。


  在你的局域网内创建好各种网络后，请确保创建了适当的防火墙规则或**访问控制列表**（**ACL**），以限制对其他网络的访问。这也包括出站规则。你的 Active
  Directory 控制器需要互联网访问权限吗？大概率不需要。如果是这种情况，则防火墙规则应阻止所有出站流量。


  ## PR.IP-02


  *组织的技术资产受到保护，免受环境威胁。*


  在开设并运营自己的数据中心，或选择一个数据中心来放置资源之前，你需要进行广泛的调研。数据中心遍布全球；然而，你必须确保已采取充分的防护措施。


  例如，组织可能将其 IT 资源放置在国家或全球易受飓风、干旱、洪水甚至山火影响的地区。这些威胁都会影响数据中心本身的运营。如果你将资源放置在一个位于飓风多发区的数据中心，你就得担心电网瘫痪或可能发生的洪水。沙漠听起来可能是建数据中心的好地方；然而，你得担心过热、制冷不足，以及为节约能源而可能发生的轮流停电。数据中心也有不同的等级，你也应予以关注。


  在选择数据中心时要关注冗余性。它应拥有多个**互联网服务提供商**（**ISP**）、发电机，以及冗余的**供暖、通风和空调**（**HVAC**）。有些数据中心可能跨州建设，可接入两个或更多电网。在为你的资源和信息选择合适的位置时，应考虑所有这些因素。


  ## PR.IP-03


  *已实施机制，以在正常和不利情况下满足弹性要求。*


  在评估系统安全性时，你还需要考虑**机密性、完整性和可用性**（**CIA**）三要素。**CIA 三要素**的一部分是可用性，以及它如何影响特定的 IT 资源。在安全审查期间，询问有关需求和可用性的业务相关问题。这是为了确保系统按预期正常运行。


  有些设备不需要 24x7 全天候运行，这完全没问题。然而，许多业务相关系统确实需要这一点，例如充当店面的 Web 服务器或需要持续运行的数据库。确保环境中内置了冗余，以满足业务需求。


  系统可能需要负载均衡，或在主资源离线时具备切换到备用资源的能力。网络设备和服务器将具备容纳多个电源的能力，并允许你将这些电源连接到不同的**配电单元**（**PDU**）。你也可能拥有冗余网络接口卡，并让它们在交换机堆栈中的多个交换机间进行负载均衡。或者，你可能只是在地下室某处让一台服务器运行在单个
  PDU 上。这完全取决于权衡风险，以及当系统离线时你选择采取什么行动。


  ## PR.IP-04


  *充足的资源容量以确保可用性得以维持。*


  你需要建立资源监控以满足此控制目标。这可以通过使用 SNMP 或其他监控相关协议来实现。你需要确保满足当前和未来需求的业务期望。例如，考虑一家在线零售商，其冗余集群中有两套系统，大多数时间都能应付，除非出现流量激增。这可能发生在假期前后，零售商可能不得不考虑扩充分配的资源数量。


  你也可以监控网络容量，以确保有足够的带宽满足需求。大型组织通常至少有一个（如果不多）具有备份要求的数据中心。如果你要跨 WAN 复制这些备份，请确保有足够的带宽容量以便复制能适当进行。设置
  SNMP 监控网络接口流量将有助于应对这些情况。你可能还需要因资源不足或新需求而为系统增加更多 CPU 或内存。


  也要围绕未来容量建立指标或计划。如果你已设置 SNMP 进行监控，请查看历史图表以确定是否需要额外资源。此外，查看过去的容量规划，以确定你是否在正轨上，或者是否需要增加更多资源——例如，利用负载均衡器将计算事务的负载分散到多台服务器上。这将确保系统不会因容量不足而过载并失效。


  # 总结


  本章涵盖了大量内容，何不回顾一下？我们最初介绍了身份：它是什么、如何分配唯一身份以及如何保护它们。每个用户都应拥有唯一标识符和密码，以保护在线服务账户。我们进一步引入了
  MFA，它在提供增强验证或证明身份属于特定用户的同时，进一步保护身份免受攻破。我们还讨论了保护磁盘上、传输中和使用中的数据。这些技术利用某种形式的加密，无论是利用全盘加密还是用于在途数据传输的
  TLS。我们还讨论了保护驻留在内存中的信息的必要性，以防攻击者在文件打开或使用时访问它。


  备份也被讨论了，以及其被保护和加密的必要性。备份包含来自每个 IT 资源的所有信息，因此在考虑传输和存储时应格外小心。看看你能做些什么来保护备份，确保它们被加密并存储在安全的位置。备份本身也应定期检查，以确保你能成功恢复它们。


  接着，我们探讨了硬件和软件的维护。这需要一个 CAB。该委员会负责管理和监督环境中发生的所有变更。每个 IT 资源上的变更都应被跟踪，以确保配置漂移不发生，或者一旦发生，也能被跟踪并纳入系统。在监控配置漂移时，你要确保它不会在
  IT 人员不知情的情况下发生。





  我们还希望确保受保护的设备在需要时可用。可利用负载均衡器等机制以及 SNMP 等监控协议，以确保系统运行正常，并能监控资源问题。


  在下一章中，我们将了解 `Detect`（检测）功能。该功能旨在帮助我们确定可能遇到的各种检测类型、如何处理它们，以及将它们发送到 SIEM 系统或日志收集器的重要性。


  ## 参考资料


  1.  [`www.knowbe4.com/press/security-awareness-training-reduces-phishing-susceptibility-by-75`](https://www.knowbe4.com/press/security-awareness-training-reduces-phishing-susceptibility-by-75)

  '
- '# 第 6 章：检测


  在 第 5 章 中，我们了解了 `Protect`（防护）功能。在该章中，我们发现了证明身份的方法。这不仅包括当面验证这些身份，还包括确保认证方法与组织愿意承担的风险级别相称。虽然用户名和密码组合过去足以用于认证目的，但现在已不再足够。


  我们还讨论了保护数据的方法。这包括存储在磁盘上的数据、传输中的数据或系统使用的数据。为了充分保护数据，我们必须考虑使用加密来防范**中间人**攻击或内存刮取等攻击。


  最后，我们涉及了为系统构建弹性需求。IT 与业务部门之间应有服务级别协议，以确保满足业务需求。如果系统宕机，且对业务至关重要，需要多久才能恢复运行？是否应在所用服务或应用程序中构建冗余？


  `Detect`（检测）功能以威胁、漏洞、妥指标和异常的可见性为中心。我们将讨论如何检测它们、可用于执行此检测的方法，以及您的网络中应具备哪些条件来监控此类威胁。


  在本章中，我们将涵盖以下主题：


  *   持续监控

  *   不利事件分析


  让我们开始吧！


  ## 持续监控 (`DE.CM`)


  应能监控环境中的所有 IT 资源。这不仅包括监控资源和配置漂移的需求，还包括监控资源的安全性和完整性的需求。这可包括监控系统异常、文件完整性检查和日志文件监控。


  此监控应是全方位的，意味着我们监控的不仅仅是网络。我们在监控系统、服务器、设备及运行在设备上的软件。我们可以查看用户行为、数据丢失防护和第三方供应商。


  ### `DE.CM-01`


  *监控网络和网络服务以发现潜在的不利事件。*


  您的环境中很可能设置了无线网络，但它受保护吗？当用户尝试向网络进行认证时，您是否使用了某种类型的认证？您是否在检测非法接入点以保护网络免受未经授权的访问？这不仅限于无线网络；我们还必须监控本地和广域网。


  组织严重依赖互联网开展业务并使用共享服务。您可能拥有集中式或分布式数据中心，从远程位置消费服务。例如，您的总部和分支机构可能有不止一家 **Internet Service
  Provider**（**ISP**，互联网服务提供商）。为了有效高效地利用多家 ISP，您还需要多个防火墙和网络交换设备。所有这些都使用专用协议来维持高可用性。此外，通信通道应受隔离的
  VLAN 和加密保护。


  您应保护网络免受可连接到您网络的非法无线接入点的侵害。这些非法接入点可能包含弱密码或加密，或者可能完全开放且无任何保护。这会在您的网络中留下一个漏洞。监控非法接入点，一旦检测到，立即将其关闭。


  **802.1x** 等协议允许在获得网络访问权限前进行认证。如果未通过正确的凭据，网络设备将被拒绝访问网络。此协议也可用于无线认证。通过利用 **802.1x**
  认证，您可以使用 Active Directory 或类似身份存储中使用的用户名和密码。


  监控针对这些及其他协议的攻击，因为这可能是 IT 资源已被攻破的指标。在整个网络中部署 IDS/IPS 传感器，以确保能够捕捉到恶意流量。网络嗅探器和 NetFlow
  只是您可以低成本甚至零成本捕捉此类流量的几种方式。


  ### `DE.CM-02`


  *监控物理环境以发现潜在的不利事件。*


  我们之前讨论了允许进入数据中心前应做的事。这包括背景调查、前台签到签名以及说明到访目的的工单。所有这些都应定期审查。


  您可能拥有刷卡系统，允许员工进入大楼内的特定楼层或门禁区域。这些读卡器存储人员身份信息，以及进出大楼的时间戳。这些系统的日志可发送到您的 **Security
  Information and Event Management**（**SIEM**，安全信息和事件管理）系统进行分析，并结合最终用户分析来建立用户行为模式。这有助于更好地理解任何异常情况。


  监控还有助于针对自然事件发出警报。例如，如果降雨量大且易受洪水影响，您可以在楼宇周围放置传感器以检测积水。也可放置传感器监控服务器室温度，因为服务器通常不耐高温。


  ### `DE.CM-03`


  *监控人员活动和技术使用以发现潜在的不利事件。*


  最终用户行为分析工具在高安全环境中确实有其用途。您可能希望监控社交媒体网站上的活动，以监控互联网上发布的内容。这也是检测员工是否浏览招聘网站的绝佳工具。这可能意味着您的知识产权或其他敏感信息会随该员工离职而流失。


  监控您的网络和 VPN 日志，查看员工所在位置。我听说过组织受到对手从其他国家登录其 VPN 的影响。正是当组织开始对日志运行查询时，他们检测到来自已知恶意行为者的成功登录。这在
  IT 和网络安全团队中引起了警觉，促使他们对事态做出反应。


  ### `DE.CM-06`


  *监控外部服务提供商的活动和服务以发现潜在的不利事件。*


  虽然有多种付费服务提供此类信息，但您也可以在内部采取一些措施。我们要监控外部第三方的违规和漏洞，减少攻击面，并审查第三方服务的日志。


  如果供应商访问您的环境，您必须审查并批准连接到网络的外来设备。这些外来设备不在您的 IT 或网络安全控制之下。既然这些设备在您的环境中，您就必须确保它们尽可能安全。






  # 第三方评估服务


  多家第三方评估服务将监控您的外部供应商，并根据其安全状况报告指标。这些服务基于其外部足迹的信号和配置提供等级或评分。这些报告旨在突出其安全状况，并在您的供应商之一遭遇入侵或存在多个关键漏洞时提供警报。


  利用这些扫描服务的结果，通过与第三方供应商合作来提升您的安全状况。您的组织可能不是唯一拥有处理您数据能力的实体。业务方也可能与第三方合作来存储、处理或传输您的信息。在审查数据访问权限时，这是一项共同的责任，所有相关方都应有既得利益来保护您的信息。


  ## DE.CM-09


  *监控计算硬件和软件、运行时环境及其数据，以发现潜在的不利事件。*


  此控制要求我们监控整个环境。我们需要从电子邮件提供商（通常也是我们的办公套件）拉取日志。我们还需要查看 Web、操作系统，甚至硬件日志。这还要求我们审查攻击面并将其最小化。


  跨网络执行扫描以确定连接了什么设备。您可以使用 `NMAP` 等工具来执行此操作。获取此信息并将其与您的 `CMDB` 进行对比，以确定网络中已知和未知的内容。`NMAP`
  还将执行初始软件扫描，以帮助确定设备上运行的服务类型。


  监控硬件是否有被篡改的迹象。在确定某人是否破坏了设备的物理硬件时，这将提供有价值的信息。寻找磨损迹象、密封是否被破坏或其他篡改迹象。一些防篡改系统在物理硬件受损时也会发出警报。


  您还需要监控环境中网络高吞吐量的迹象。这通常会导致解决错误配置或识别数据渗出的迹象。如果您有在一天中的特定时间或一周中的特定日期运行的作业，请寻找非高峰使用时间的异常。如果您在非高峰时段看到使用量激增，这可能意味着有人或某事未按预期工作，也可能是更糟糕的情况。


  # 不利事件分析 (DE.AE)


  现在我们正在从第三方供应商那里拉取信号信息并收集日志文件，我们需要分析它们。这将需要一个人或一个团队不仅监控传入的日志文件，还要调整工具以理解所摄入的日志文件。


  如果您拥有大型分布式数据中心，这可能还要求部署日志收集器的架构能够确保您永远不会丢失日志文件。这是为了在发生网络故障时保护您的环境。如果您的网络失去与日志收集器所在位置的连接，您也可能丢失那些日志。让我们来看看这个控制系列。


  ## DE.AE-02


  *分析潜在不利事件，以更好地了解相关活动。*


  您必须确保设备将日志发送到集中式日志收集器或 `SIEM`。`SIEM` 用于收集日志并对其执行分析。但是，您可能需要专门的人员或团队来管理它。大多数 `SIEM`
  并不预置规则；您可能需要开发自己的规则。多家组织已将其日志记录需求外包给 `托管安全服务提供商` (`MSP`) 来为他们管理 `SIEM`。这是因为组织并不总是拥有培训和维护运行它们的分析师的资源。


  `SIEM` 就像计算机一样，只能发挥其上运行程序的水平。在这种情况下，是需要开发签名以捕捉特定模式。这可能是对被攻击者接管的账户进行的多次失败身份验证尝试。如果您决定在内部部署
  `SIEM` 而不是选择外部 `SIEM`，培训员工如何维护和“喂养” `SIEM` 非常重要。如果没有运行它的必要技能，它可能无法为您提供所需的信息。


  定期对日志记录工具执行手动审查。这是为了确保针对日志运行查询的系统仍在提供所需信息。持续运行 `PDCA` 循环以发现问题并改进 `SIEM`。如果您不调整和创建新规则以捕捉威胁，您可能会错过关于环境的关键信息。


  ## DE.AE-03


  *从多个来源关联信息。*


  `SIEM` 只能发挥发送给它的信息的作用。这是什么意思？这意味着您应该从所有 IT 资源和基于云的应用程序发送日志。这可能要求您在网络和云服务提供商中设置多个分布式日志收集器。


  您可能还希望出于备份目的将日志传输到多个目的地。`SIEM` 通常仅存储 30 到 90 天的日志。合规要求可能规定您保留一年份的日志。您不能仅仅因为 `SIEM`
  空间用完就丢弃它们。在购买 `SIEM` 或托管服务之前审查业务需求，并确保您满足业务需求。


  ## DE.AE-04


  *确定不利事件的预估影响和范围。*


  创建政策和程序，规定如何确定不利事件的影响。我们必须理解从日志记录和警报工具检测到的事件的影响，因为这将指导我们如何响应事件。在我们了解事件将如何影响我们之前，我们必须讨论业务风险以及如何应对它。


  在决定如何响应时，关于业务风险的讨论是必须的。如果没有这种理解，您将不知道如何有效响应给定事件。例如，如果您要求多因素认证，但必须为某个任务禁用它才能工作，您将如何响应事件？您能阻止事件再次发生吗？您能响应该事件吗？这些是应做出的业务决策。


  一旦理解了业务风险，我们就可以将其纳入政策和程序。这些文档随后分发到整个组织，以便对如何处理接收到的事件有共同的理解。


  ## DE.AE-06


  *向授权员工和工具提供不利事件信息。*


  现在我们已经讨论了业务风险，并编写了政策和程序，我们可以调整工具并自动化响应。当生成警报并发送进行评估时，安全运营人员应知情。生成警报时，您也可以让它自动打开工单以进行跟踪。


  根据组织规模，您可能有一名或多名分析师在运营环境中工作。考虑到 `SIEM` 可能产生大量警报，重要的是要适当调整 `SIEM`，使其不仅仅是分析师必须筛选的一堆噪音。您将需要可操作的警报，员工必须处理这些警报并决定下一步做什么。


  许多 `ITSM` 工具允许您自动打开工单；利用这一点。如果您的 `SIEM` 检测到异常，请使用 `SIEM` 通过 `API` 发送警报或通知以代表您打开工单。您也可以设置通知，在发生不利事件时通过
  `SMS` 通知您。




  '
- '# 第 7 章：响应


  ## 第 6 章总结：检测


  您的 SOC 员工还应与事件响应团队保持密切联系。这是为了确保在必要时事件能够升级。同样，请依赖您的事件响应策略和程序来实现这一点。在对事件发出警报时，应建立特定的阈值。


  ### DE.AE-07：网络威胁情报集成


  *网络威胁情报和其他上下文信息被集成到分析中。*


  我们已经多次涉及这一点。然而，从 ISAC、CISA 或其他第三方威胁情报接收到的信息正是该控制措施所需的。请看看如何将这些信息导入 SIEM 或其他分析工具，以便您能清楚地了解整体风险状况。


  获取能为您提供清晰风险状况图景的工具。这些工具可配置为将所有已识别的风险汇集到一个中心位置。例如，寻找能够导入 CMDB 中收集的信息、漏洞信息，以及从 CISA
  KEV 或 EPSS 收集的攻击信息的工具。这将有助于识别您的风险以及如何应对修复工作。


  ### DE.AE-08：事件声明标准


  *当不利事件满足定义的事件标准时，即宣布发生事件。*


  我们需要依赖我们的策略和程序来满足这一要求。确保文档根据接收到的事件阈值定义了相应的响应。您无法为每一个单独的事件定义响应。但是，您可以将响应泛化为少数几类事件。然后您可以为最常发生的事件制定响应。


  一旦确认发生事件，您的安全分析师将需要与事件响应团队合作，在您的网络中遏制并根除该事件。这很可能是 IR 团队和分析师共同朝着一个解决方案努力的组合。


  您可能还想记录每次事件的信息，无论它是真实事件还是误报。这将有助于改进您的策略和程序以及事件响应计划。每次事件发生后，进行**经验教训总结**或**事后复盘**审查，以实现持续改进。


  ## 响应功能概述


  在*第 6 章*中，我们了解了*检测*功能。检测功能关乎我们如何检测环境中的不利事件。我们首先开始讨论跨网络的检测。这些包括对网络协议的检测，例如用于路由的 BGP
  或用于设备故障切换的 VRRP。我们还讨论了为什么加密这些协议很重要，以及跨带外网络隔离通信的可能性。


  在上一章中，我们还讨论了日志记录和制定规则以检测不利事件的必要性。这包括将所有日志推送到 SIEM 工具进行分析的必要性。然而，分析的效果仅取决于用于检测这些事件的规则。


  一旦我们配置所有 IT 资源将日志发送到日志工具并分析结果，我们就必须采取行动。需要创建阈值以确定所检测事件的严重程度。我们还需要制定策略和程序，规定我们打算如何响应该事件。应建立**服务级别协议**（**SLA**），以确保我们的响应时间符合业务需求。


  在本章中，我们将讨论响应功能及其对**事件响应**（**IR**）的重要性。一旦完成检测并确定其严重程度，我们就必须以某种方式进行响应。这就是该功能重要性的所在。并非所有事件都会升级为安全事件。然而，如果不首先建立标准来做出这一判断，您如何知道呢？


  我们也需要继续完善我们的策略和程序。当我们开始引入日志文件源并编写分析规则时，我们需要不断评估威胁。所有这些都必须记录在案，以便 IR 团队知晓并理解如何应对威胁。


  在本章中，我们将涵盖以下主题：


  *   事件管理 (RS.MA)

  *   事件分析 (RS.AN)

  *   事件响应报告与沟通 (RS.CO)

  *   事件缓解 (RS.MI)


  让我们深入了解事件管理。


  ## 事件管理 (RS.MA)


  在该控制系列中，我们需要制定一个 IR 计划。该计划将涵盖如何响应事件的几个方面。我们需要编写策略和程序，规定如何发现事件、确定威胁等级并做出相应响应。


  ### RS.MA-01：事件响应计划执行


  *一旦宣布发生事件，事件响应计划将与相关第三方协同执行。*


  在前几章中，我们讨论了发生事件时与供应商和受信任的第三方合作的必要性。如果您已将安全服务外包给**托管服务提供商**（**MSP**），则应与他们合作制定 IR
  剧本。当宣布发生事件时，将执行此剧本。


  剧本是处理特定情况的分步程序。例如，如果您遇到账户接管场景，则应采取措施以最大限度地降低相关风险。许多剧本是使用 Microsoft Visio 或同类工具创建的，用于流程开发。它是写在纸上的程序的可视化表示。


  您还需要与供应商和受信任的第三方举行桌面推演。这将建立在情况出现时做出反应所需的肌肉记忆。在事件发生时，分秒必争，您不想浪费时间。这种肌肉记忆将有助于减少响应事件所需的时间。


  创建角色和职责矩阵，以帮助确定谁负责什么。首先，您需要一名负责人：当事件发生时，有权负责处理事件的人。负责人将协调响应以遏制攻击。您应让各个团队的成员参与进来，例如网络专家、服务器管理员、服务台人员，甚至
  IT 部门以外的人员。





  依赖您已制定的政策和程序，以帮助确定事件的阈值及其对业务的影响。这些文件应详细说明防止事件扩散所需采取的措施。接下来，您将需要致力于从环境中根除恶意活动。政策和程序还应详细说明什么被视为事件，什么不被视为事件。并非所有事件都会演变成事故。然而，所有事故最初都是事件。


  ## `RS.MA-02`


  *事件报告会被分诊和验证。*


  FIPS 199 详细规定了对事件进行分类的标准，并为其分配严重性级别。这些级别按低、中、高排序，具体说明如下：


  - **低**：因机密性、完整性或可用性丧失，对组织造成有限的不利影响

  - **中**：因机密性、完整性或可用性丧失，对组织造成严重的不利影响

  - **高**：因机密性、完整性或可用性丧失，对组织造成严重或灾难性的不利影响


  在确定如何响应事件时，这些标准将派上用场。如果事件级别为低，您将知道应以多快的速度响应（甚至是否需要响应）；而如果是高级别事件，您则知道必须立即响应。


  您还需要生成并审查报告，以确定哪些事件演变成了事故。这些报告还应说明哪些情况不应被报告为事故。这不仅能在您响应事故时节省您和团队的宝贵时间，而且在报告的事故被证明并非事故时也能节省时间，从而实现快速止损。


  一旦事件得到验证，应尽快着手遏制事件。当遏制工作完成（至少尽了最大努力）后，开始着手根除不利事件。


  此处 `[*1*]` 可找到一份优秀的事件报告撰写示例。


  ## `RS.MA-03`


  *事件会被分类和确定优先级。*


  虽然我们在 `RS.MA-02` 中对不利事件进行了分类，但低、中、高三个类别还不够。每个不利事件都应归入其特定的类别或攻击类型。例如，我们可以将它们归类为以下类别之一：


  - 商业电子邮件诈骗

  - 账户接管

  - 勒索软件

  - 入侵


  随着我们制定了 SLA、创建了影响阈值并了解了事件范围，随后便可确定响应的优先级。您可能会将 Active Directory 服务器作为重点保护对象，因为它们在您的
  IT 资源中至关重要。随后，您可能会根据攻击类型决定优先保护数据库或 SCCM 环境。这些信息应包含在您的 CMDB 或类似工具中。


  在响应事件时，有时也有必要退一步观察攻击者的行为。通过这样做，您可以收集大量关于对手如何实施攻击的情报。这些信息随后可转化为剧本，用于未来的攻击修复。但切记时间不宜过长，因为最终攻击者会得逞。


  ## `RS.MA-04`


  *根据需要对事件进行升级或提级。*


  通过此控制措施，您必须监控在任何给定时间可能正在经历的事件或多个事件的状态。如果事件失控且您需要协助，则需将面临的问题向组织内部或外部的其他人员升级。


  如果是内部升级，您可能需要召集更多员工协助排查特定问题或帮助遏制疫情扩散。这可能包括网络或服务器方面的 IT 人员，他们的专业知识将至关重要。如果是外部升级，您将需要受信任的第三方提供帮助，例如托管安全服务提供商、ISAC
  或执法部门。例如，您的防火墙可能由 MSP 托管，您需要迅速联系他们以阻断进入网络的威胁。在这些机构有联系人在需要协助时将大有裨益。


  利用事后复盘来更好地了解流程是否按预期运行。事后复盘旨在突出响应计划中的缺陷。要考量响应是如何发生的，以及它是否适合当时的情况。


  ## `RS.MA-05`


  *应用启动事件恢复的标准。*


  一旦事件被遏制且威胁被根除，寻找可能的关键领域以开始恢复工作。这就是您需要为组织内的各类事件创建运行手册的地方。这些运行手册应按多个类别进行分类，就像我们在 `RS.MA-03`
  中所做的那样。


  商业电子邮件诈骗或账户接管的运行手册将与勒索软件的运行手册不同。每个运行手册还应讨论事件的遏制和根除阶段。拥有这些信息将有助于在清理事件的同时，尽量减少事件造成的停机时间。


  并非所有事件都相同，因此不应一概而论。商业电子邮件诈骗可能会中断某位员工或整个公司的服务，也可能不会。然而，勒索软件攻击有可能导致网络长时间瘫痪。此类攻击会造成服务中断，您和您的团队必须致力于将中断程度降至最低。（有关如何创建
  IR 剧本的更多信息，请参阅 *References* 部分的 `[*2*]`。）


  # 事件分析 (`RS.AN`)


  在此控制系列中，我们将讨论事件发生期间和之后您需要采取的行动或步骤。这将包括记录事件期间采取的所有步骤、执行事后复盘，以及为生成的事件报告保留保管链。


  ## `RS.AN-03`


  *执行分析以确定事件期间发生了什么以及事件的根本原因。*


  在此控制措施中，我们试图确定导致事件的步骤。这将要求我们创建事件本身的时间线，从事件被认定为事故之时起，到 IR 团队采取措施遏制并从环境中根除事故为止。创建此时间线也将帮助我们确定事故的根本原因。


  在制定时间线时，要考虑将事件认定为事故的决策过程。曾做出过启动 IR 团队并开始制定事故响应的决定。也要将这些记录在时间线中。从为遏制事故而做出的决定到进行的对话，一切都应记录在案。


  此外，还要记录关于环境中各种系统和服务所做的决定。例如，如果对手利用了某个漏洞，该漏洞是否在环境中被发现？CISA KEV 中是否有与您的环境相关的漏洞利用？如果有，是做出了缓解还是接受该漏洞的决定？


  此时间线不在已制定的政策和程序范围内。然而，关于创建时间线的讨论应是这些文件的一部分。维护此事件时间线至关重要，它有助于还原 IR 团队的作为及所做的决定。


  ## `RS.AN-06`


  *调查期间执行的操作会被记录，且记录的完整性和来源得到保留。*





  # 事件分析 (RS.AN)


  我们还希望保持时间线的完整性，以确保其未以任何方式被篡改。当我们开始讨论文档的保管链并防止文档完成后被篡改时，这将变得至关重要。您需要确保时间线尽可能准确，以防其被提交给执法部门。


  为确保文档的完整性，我们还可以对文档本身使用哈希算法。正如我们之前讨论的，哈希值是文档的数字指纹，当文档以任何方式被篡改时，该指纹就会发生变化。这将保护文档的完整性。但是，它无法涵盖文档的真实性。为此，您需要利用数字签名。数字签名将同时证明文档的真实性和完整性，因为对时间线进行签名的人必须持有私有加密密钥。


  用于生成数字签名的私钥必须不惜一切代价加以保护。如果您失去了对私钥的控制，任何人都可能冒充您，并在您不知情的情况下对文档进行数字签名。然后，数字签名将通过您的公钥进行验证。公钥可以与任何人共享，并且需要共享以验证签名是否有效。


  ## RS.AN-07


  *收集事件数据和元数据，并保持其完整性和来源。*


  元数据的定义是关于数据的数据。元数据包括构成事件的所有内容，包括时间戳、IP 地址、源、目的地以及触发事件人员的身份。这些信息也应被捕获并放入时间线，以便更好地理解构成事件的特征。这些信息对于保管链要求将大有裨益。


  确保所有生成的日志都发送到集中式日志记录解决方案，例如日志关联引擎或 SIEM。您希望所有日志都汇聚到一个集中式系统中，以便全面了解发生的事件。将这些元数据作为整体日志的一部分，将为不利事件及其发生方式提供额外的洞察。最终，我们将想要了解事件的根因；这将有助于理解发生了什么。


  ## RS.AN-08


  *估算并验证事件的严重程度。*


  事件严重程度的确定应成为您策略和程序文档的一部分。我们可以利用 FIPS 199 及其如何适用于 IT 资源的机密性、完整性和可用性，来计算事件对组织的影响。这种分类在确定事件严重程度以及您和您的团队应如何响应时非常有帮助。例如，您可能有一个数据库宕机，仅影响公司内一定数量的用户。另一方面，您可能遇到影响组织内所有用户的系统级中断。哪一个优先级更高？


  在提交 IR 报告时，请确保出于历史记录目的记录了这一点。报告不仅应包含描述、涉及人员和时间线，还应包含事件造成的影响程度。在前面的数据库示例中，如果数据库中断仅影响
  5% 的员工，则影响可能较低；而如果数据库中断影响整个公司，则属于高影响。更多信息请见此处：\[*3*\]。


  我们还需要最终确定事件的来源或根因，以及它如何影响公司。获取这些信息并创建新的或修改现有的运行手册，以缩短响应未来事件所需的时间。这很重要，因为它将有助于减少响应未来事件所需的时间。


  # 事件响应报告与沟通 (RS.CO)


  该控制系列主要关注事件发生时如何传播消息。您不仅需要通知内部利益相关者，还需要通知外部利益相关者，甚至可能需要通知监管机构。各州和联邦政府都有违规通知法律，要求您在确定是否发生违规后的特定日期或特定时间限内通知受影响者。该期限可能是在确定发生违规后的一天到一个月内。


  ## RS.CO-02


  *通知内部和外部利益相关者有关事件。*


  您的策略和程序应规定是否以及何时通知他人数据泄露或已影响公司的其他不利事件。事件发生后，应有阈值规定与谁沟通以及何时沟通。还需要确定该事件是否影响了他人，并被视为机密信息泄露。


  例如，PCI 12.10 要求您制定完善的 IR 计划并已对其进行测试。要求还规定您必须建立数据备份流程和业务连续性计划。根据您的收单机构，他们可能还有额外的步骤或要求，例如您有多少时间通知他们发生违规。


  另一个例子是，**证券交易委员会** (**SEC**) 推出了新规则，要求上市公司在发生重大违规后四天内发送通知。这意味着，如果您的公司确定敏感信息泄露被视为重大，您有四天时间从认定其重大之日起发送通知。


  您可能需要与高管领导团队、法务部门和外部律师合作，协助确定数据泄露。此外，利用执法部门和 **互联网犯罪投诉中心** (**IC3.gov**) 向 FBI 报告贵组织发生的违规或其他不利事件。


  ## RS.CO-03


  *与指定的内部和外部利益相关者共享信息。*


  对于此控制项，您需要依赖您的策略和程序，以及您可能与第三方签订的任何合同或法律文件。这些文件每份都应包含 SLA，规定如何以及何时将此信息传达给所有利益相关者。您还需要制定危机沟通计划，规定如何与这些不同群体对话。


  审查您与第三方供应商签订的任何合同。合同极有可能包含关于如何与供应商沟通以及何时沟通的条款。如前所述，多项监管要求规定您必须在特定时间框架内通知它们，才算作*合规*。如果通知超出该时间框架，您可能面临巨额罚款。供应商和客户的合同中可能有类似条款。请务必让法务部门审查它们，以确保您和您的组织遵守商定的
  SLA。


  您的沟通部门（或类似部门）还应制定 **危机沟通计划** (**CCP**)。当发生严重事件时，将使用此沟通计划。策略和程序文档中应建立阈值，规定何时激活或使用该计划。根据您沟通的受众不同，您可能有多个
  CCP。与沟通部门合作，确保创建这些文档。


  # 事件缓解 (RS.MI)


  在该控制系列中，我们将讨论如何从环境中缓解、遏制和根除不利事件。我们可能需要与环境中的第三方或受信任供应商合作，执行技术以了解我们的攻击面以及事件最初是如何发生的。


  ## RS.MI-01


  *遏制事件。*






  # 遏制与根除


  我们需要遏制事件，防止其在网络中蔓延。这可能包括使用防火墙、关闭网段之间的端口以及应用补丁。如果我们知道利用了哪个漏洞，就可以查看漏洞管理系统，报告其他系统是否受影响。一旦确定，我们就可以继续进行补丁修复或实施补偿控制。我们还可以确定是否可以在没有所提供服务的情况下运行，并关闭该系统。


  我们还需要寻求第三方供应商的协助。通过联系您的 MSP（托管服务提供商）、执法部门和 ISAC（信息共享与分析中心），您可以获得他们的帮助，了解这些服务是否有其他客户受到类似问题的影响。您还可以与取证公司合作，帮助了解问题的根本原因。所有这些信息对于遏制事件都至关重要。


  ## RS.MI-02：事件已根除


  现在事件已被遏制，我们需要将其从环境中清除。再次查看您的漏洞管理系统，确定是否有类似漏洞影响其他系统。这可以很好地指示攻击下一步可能去向。您还应制定临时纠正措施和永久纠正措施计划。


  **临时纠正措施（ICA）** 计划可在响应的遏制阶段开始制定，也可在开始根除时制定。短期内，ICA 旨在记录遏制和根除不利事件时执行的操作。这可以是临时修复，例如实施额外的防火墙规则或关闭某项服务。ICA
  还可能包括修补漏洞，以进一步防止感染发生或蔓延。


  **永久纠正措施（PCA）** 则更为复杂，通常在事件发生后实施。PCA 可能要求您为新工具争取资金或实施新流程。这些可能是无法在短期内实施的长期项目。PCA
  旨在成为解决差距或发现问题的永久性方案。


  继续让您的 MSP、执法部门、ISAC 以及您可能使用的任何其他第三方资源参与进来。他们将帮助指导您完成恢复运行所需的流程。集思广益，效果更佳。这将使您受益，同时帮助社区内的其他人了解发生了什么。


  事件或事故平息后，开始检查 ICA 阶段实施的措施，并移除任何临时缓解措施。这旨在使您恢复到已知的良好环境，并符合先前建立的基线。然而，这也是调整基线的时候，如果新的监控服务是作为
  PCA 的一部分实施的。


  # 总结


  在本章中，我们讨论了多个与如何响应不利事件相关的主题。我们涵盖了大量关于捕获何种信息、如何捕获以及何时捕获的内容。我们不仅需要捕获有关事件的所有信息，还必须通过使用不同类型的加密来保护这些信息。


  我们了解到，捕获所有必要信息以便在需要时能够重演步骤非常重要。这包括涉及事件的人员、地点以及该期间发生的事情。我们还了解到，我们需要捕获事件的元数据。这包括时间戳、IP
  地址、用户名和持续时间。我们还需要要求日志中的事件具有关联的序列号。这样，我们就知道日志没有丢失。


  正如本章所学，我们也必须保护事件日志。这需要使用加密。我们可以使用哈希算法来确保文档的完整性，或使用数字签名来验证真实性。在许多情况下，SIEM 会为每个传入事件创建一个哈希值，进一步证明记录事件的完整性。


  我们讨论了为与内部和外部利益相关者讨论问题而创建各种危机沟通计划的重要性。我们可能还有责任向供应商、客户和监管机构报告事件。例如，HIPAA 规定必须在 60
  天内通知受影响者。您将需要一个计划来说明如何沟通和应对这些问题。


  最后，我们讨论了 ICA 和 PCA。ICA 是为遏制和根除事件而实施的临时或过渡性缓解措施。ICA 可能是临时防火墙规则或系统和服务的关闭。这些只是临时的，事件平息后可能需要移除。


  PCA 是实施的永久性解决方案。PCA 可能是基于项目的，需要数月才能实施。这些也可以是新创建的政策和程序。正如本章所学，可能需要时间来充分规划缓解事件并防止其再次发生所需的所有
  PCA。


  在下一章中，我们将讨论 *恢复* 功能。该功能旨在提供关于如何从事件中恢复的指导。这可以包括备份恢复，并确保我们的系统恢复正常运行。


