- 'no': 2999
  overturn_probability: 0.6
  alternative: 其他
  counter_evidence:
  - 该行前方密集出现8个「###」级控制族标题（第2955行「### 物理安全」至第2991行「### 风险管理」），根据目录（第4687行）这些属于第10章「策略控制族」内容，但章标题「#
    第 10 章」却出现在这些子节之后，结构呈现「子节在前、章标题在后」的倒置状态，疑为排版错误或误插入的重复标题。
  - 全书其他章节（如第11章第3043行）均采用「# 第 X 章」在章节开头，且前文有明确的上一章结束标记（总结、参考资料），而第2999行上一行仍为「###
    风险管理」子节，缺乏章节过渡的上下文衔接特征。
  keep_split: false
- 'no': 3043
  overturn_probability: 0.35
  alternative: 正文小标题
  counter_evidence:
  - 本章内部后续仍出现多个「#」级标题（第3132行「# 自我评估指南」、第3205行「# 捕获当前状态」、第3221行「# 创建您的未来路线图」、第3290行「#
    总结」），说明「#」在本书中非专属章标题，亦用于章内大节标题，故「# 第 11 章」可能仅为章内一级标题而非分章边界。
  - 第11章内容极长（跨至第3311行），且包含多个「##」级节（如「## 执行评估」「## 第一方评估」等），若第3043行为分章点，则后续同级「#」标题将破坏层级一致性，导致章内出现多个H1。
  keep_split: false
- 'no': 3312
  overturn_probability: 0.3
  alternative: 页眉页脚
  counter_evidence:
  - 索引区内部第4168行再次出现「# 索引」，疑为每页重复的页眉/运行标题被误提取为正文行，第3312行可能为索引首页的运行标题而非实质分章标记。
  - 后续紧跟「## A」「## B」等字母分组标题，呈现连续排版特征，而非新章开篇的「概述段落→子节」结构；电子书索引常无实体章节分页结构，规则「文末索引划分为一章」在电子版无固定页码场景下适用性存疑。
  keep_split: false
