- pgno: 257
  md: "They should be replaced by the following line:\n\n```\n$app = Application::init($appConfig)->run();\n\
    ```\n\nThe next step is to add a new method in the Module class of the Inventory\
    \ module. It is the onBootstrap method. This method is called when an EVENT_BOOTSTRAP\
    \ event is triggered. It is a logical choice because an EVENT_ROUTE event is the\
    \ next in the sequence:\n\n```\n/**\n * @param \\\\Laminas\\\\Mvc\\\\MvcEvent\
    \ $e The MvcEvent\n instance\n * @return void\n */\npublic function onBootstrap($e)\n\
    {\n    $application = $e->getApplication();\n    $application->getEventManager()->attach\n\
    \    (MvcEvent::EVENT_ROUTE,\n    [InventoryAuthenticationListener::class,'verifyIdentity']));\n\
    }\n```\n\nObserve that the onBootstrap method receives a MvcEvent object. This\
    \ object has access to the Application instance – the same instance that was created\
    \ in index.php. The second line of the onBootstrap method does exactly the same\
    \ operation that was removed from index.php. This way, the transference of responsibilities\
    \ is done. The Inventory module is responsible for its own authentication process.\
    \ It does not depend on another component to ensure authentication.\n\nWe have\
    \ changed the authentication implementation but not its behavior. You can now\
    \ run the tests again to check whether everything is working. Unfortunately, when\
    \ you run the tests, some failures are presented by PHPUnit. You will see several\
    \ error messages like this:\n\n> Failed asserting controller name \"discount\"\
    , actual controller name is \"index\"\n\nIn fact, you will notice that all error\
    \ messages have the same pattern – the matched controller name is IndexController.\
    \ Why?\n\nThe reason is that now InventoryAuthenticationListener is attached before\
    \ the tests run. The tests don't use index.php. So, when the attachment was done\
    \ by index.php, there was no authentication checking because index.php was not\
    \ called by the PHPUnit test case. Now, as the listener attachment is done by\
    \ the Inventory module, authentication checking is done for each request."
