  img_proc: true
- pgno: 68
  md: '# **Manifesto for Agile Software Development**


    In 2001, 17 software developers published a manifesto that exposed their ideas
    about better ways to develop software. This “Agile Manifesto” presents four main
    values and twelve principles to guide developers in the management of software
    construction. The ideas of the Manifesto are the combination of several approaches
    applied by the authors. These approaches seek to improve the quality of the development
    software process and the quality of the software as a product, recognizing that
    change is the only constant. This manifesto is available at https://agilemanifesto.org.


    In the next section, we will practice one of the approaches of Agile development,
    creating a test class before creating the class that will be tested.


