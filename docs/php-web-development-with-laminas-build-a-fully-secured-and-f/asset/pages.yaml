- pgno: 13
  md: '# # Preface


    Laminas is a framework for building PHP applications. There are several frameworks
    for any programming language, and this is no different for PHP. So, why would
    you choose Laminas? Well, Erich Gamma, a renowned computer scientist and the principal
    designer of widely used tools such as JUnit and Eclipse, states that a framework
    is at the highest level of reuse for an object-oriented system. For this, the
    framework needs to be under the control of the developer. A framework shouldn’t
    be heavyweight, seeking to do much for the developer or doing it in a way that
    the developer doesn’t want. In addition, frameworks should always allow the developer
    to change how they do things – they must be flexible. A framework should not be
    pretentious and force the developer to use all of its components as if they were
    the definitive implementation for a given problem. A framework should be humble
    enough to recognize that the developer is the one who has the best solution for
    a specific problem and allow them to integrate their solution into the framework’s
    generic components. Laminas is a framework that meets Erich Gamma’s expectations.
    Born in 2005 as Zend Framework, Laminas has gradually achieved maturity in its
    architecture, providing a collection of loosely coupled and configurable components
    for building object-oriented PHP applications.


    The Laminas framework enables PHP web developers to create powerful web applications
    with an evolutionary architecture. Developers would want to learn Laminas to build
    web applications based on the reuse of loosely coupled components. Developers
    working with PHP will be able to put their knowledge to work with this practical
    guide to Laminas. This book provides a hands-on approach to implementation and
    associated methodologies that will have you up and running and being productive
    in no time. Complete with step-by-step explanations of essential concepts, practical
    examples, and self-assessment questions, you will be able to quickly create PHP
    programs reusing Laminas components.


    You’ll learn how to create the basic structure of a PHP web application divided
    into layers, understand the MVC components of Laminas, and understand how you
    can take advantage of the Eclipse platform when developing with Laminas. You’ll
    then build an e-commerce application based on the requirements of a fictional
    business and learn how to implement these requirements with Laminas components.
    By the end of this book, you will be able to build an MVC application in the PHP
    language using Laminas.


    # ## Who this book is for


    This book is aimed at PHP developers with basic knowledge of PHP fundamentals.
    It is for those developers starting their journey through web development with
    PHP, and wanting to learn how to work with the best tools and practices.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# What this book covers


    Chapter 1, Introducing Laminas for PHP Applications, presents the evolution of
    the architecture of Zend Framework up until it changed to Laminas, and discusses
    the lessons learned.


    Chapter 2, Setting Up the Environment for Our E-Commerce Application, sees us
    set up the development environment for the example application that we will be
    building throughout this book.


    Chapter 3, Using Laminas as a Library with Test-Driven Development, explains,
    using a simple example based on a reduced use case, how it is possible to use
    only one Laminas component in an existing PHP application.


    Chapter 4, From Object-Relational Mapping to MVC Containers, covers the handling
    of databases with object-relational mapping, abstracting SQL statements, and the
    inversion of control for object-oriented PHP applications with the Laminas framework
    as a container.


    Chapter 5, Creating the Virtual Store Project, presents the requirements of the
    e-commerce project we plan to build.


    Chapter 6, Models and Object-Relational Mappers with Behavior-Driven Development,
    is where we use `laminas-db` for mapping the entity-relationship model to an object
    model. We also learn how to create models using the behavior-driven development
    approach.


    Chapter 7, Request Control and Data View, shows how to use the Laminas implementations
    for the controller and view layers in an MVC application.


    Chapter 8, Creating Forms and Implementing Filters and Validators, introduces
    some Laminas components for handling data input.


    Chapter 9, Event-Driven Authentication, covers one of the essential topics for
    developing secure applications: authentication.


    Chapter 10, Event-Driven Authorization, covers another one of the essential topics
    for developing secure applications: authorization.


    Chapter 11, Implementing a Product Basket, describes the implementation of a product
    basket, an essential component of a virtual store.


    Chapter 12, Reviewing and Improving Our App, is dedicated to reviewing and improving
    the sample e-commerce application.


    Chapter 13, Tips and Tricks, provides some tips and tricks that will help you
    as a developer to solve some problems that can eventually appear when constructing
    a web application.


    Chapter 14, Last Considerations, delivers the conclusion of the book, outlining
    the possibilities that lie ahead with other components not used in our sample
    applications.'
  merge: -1
  img_proc: true
