    Observe that we have replaced the content of the HTML form element with a sequence
    of calls for methods prefixed with form. We need to understand the following from
    the previous source code:


    +   - The `$this->form` attribute is the `DiscountForm` instance sent by the `DiscountController`
    instance.


    +   - The `$this->form` method (with parentheses at the end) is a view helper
    that renders HTML forms defined with Laminas\Form\Form.


    +   - The `$this->formLabel` method renders only the label of a form element.


    +   - Each element type has an appropriate render helper class. For example, the
    operator field is an HTML SELECT element, so we use `$this->formSelect` to render
    it.


    +   - The `get` method of `Laminas\Form\Form` returns a `Laminas\Form\Element`
    object. The argument method is the value passed into the object constructor.


    To use the view helper classes, we need to have `Laminas\Form` as a declared module
    in the `modules.config.php` file. If there is no element with the "`Laminas\Form`"
    value in the array, which is returned by `modules.config.php`, you will receive
    a message such as **A plugin by the name ‘form’ was not found in the plugin manager
    `Laminas\View\HelperPluginManager`**, when trying to render the form.


    Adding `Laminas\Form` as a module is a concise way to enable form rendering. There
    is a more verbose way to do it. We will go through it here because it will help
    you to understand what happens behind the scenes, that is, what `laminas-mvc`
    does for you.'
