- pgno: 346
  md: "Currently, note that we have a method to get one product; however, we don’t\
    \ have a method to get a list of products. No problem. We can add a method for\
    \ this to the `ProductAPIController` class. The `AbstractRestfulController` superclass\
    \ distinguishes between an HTTP `GET` request for one element and for a list by\
    \ the key argument. If the HTTP `GET` request has no key argument, the `AbstractRestfulController`\
    \ superclass executes the `getList` method. Then, we implement this method, which\
    \ will look like this:\n\n```\n/**\n * @OA\\Get(\n *     path=\"/inventoryapi/productapi\"\
    ,\n *     @OA\\Response(response=\"200\", description=\"get list of products\"\
    ),\n *     @OA\\MediaType(mediaType=\"application/json\")\n * )\n*/\npublic function\
    \ getList()\n{\n    $resultSet = $this->productTable->getAll();\n    $products\
    \ = [];\n    foreach($resultSet as $result){\n        $products[] = $result->toArray();\n\
    \    }\n    return new JsonModel(['products' => $products]);\n}\n```\n\nNow, we\
    \ only need to write the annotation code blocks for each public controller method\
    \ and run the `fsd` command, and we will have a complete API documentation page\
    \ (Figure 12.8), which additionally allows us to test the requests for the whatsstore\
    \ application."
  merge: -1
  img_proc: true
