- pgno: 102
  md: "7. The getByField method, however, can be implemented by the AbstractTable\
    \ class because it is generic:\n\n```\npublic function getByField(string $field,\
    \ $value) :\nAbstractModel\n{\n\t$where = [\n\t\t$field => $value\n\t];\n\t$rowSet\
    \ = $this->tableGateway->select($where);\n\tif ($rowSet->count() == 0) {\n\t\t\
    $modelName = $this->modelName;\n\t\treturn new $modelName();\n\t}\n\treturn $rowSet->current();\n\
    }\n```\n\nThe getByField class allows searching for any field. As you have noticed,\
    \ if no record is found, the method returns an instance of a class defined by\
    \ the $this->modelName attribute. In the SchoolClassTable class, this attribute\
    \ is declared as follows:\n\n```\nprotected string $modelName = 'School\\\\SchoolClass';\n\
    ```\n\nThis attribute allows each child class of AbstractTable to inform its model\
    \ class and ensures that the method will return an instance of AbstractModel.\n\
    \nWait! What is AbstractModel? It's a generalization for our models. It implements\
    \ two generic methods, one for data input, exchangeArray, and the other for data\
    \ output, toArray.\n\nThis is the model:\n\n# AbstractModel.php\n\n```\n<?php\n\
    declare(strict_types = 1);\nnamespace School;\n\nabstract class AbstractModel\n\
    {\n\n\tpublic function exchangeArray($data)\n\t{\n```"
