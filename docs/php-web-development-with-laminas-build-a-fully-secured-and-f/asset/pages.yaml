- pgno: 224
  md: "The laminas-inputfilter component combines laminas-filter and laminas-validator.\
    \ You can use laminas-filter and laminas-validator separately in PHP programs,\
    \ but the use of laminas-inputfilter is more convenient for MVC web applications.\n\
    \nWe have an HTML form to insert/update discounts. But this is one of the ways\
    \ to make requests for handling discounts. We have an API, so another application\
    \ can make requests to whatstore. Our application is oriented to service, so it\
    \ is open to multiple clients. This is useful, but there is an issue with the\
    \ data handling. If a user fills in an HTML form, JavaScript code can filter form\
    \ data before sending the request. When a request is made without an HTML page,\
    \ there is no JavaScript to filter the data. Then, the server must ensure a valid\
    \ format for input data.\n\nOf course, the valid format for application data depends\
    \ on application requirements. We are assuming here that we are reading requirement\
    \ documents for implementing the code for handling data.\n\nThe place to define\
    \ the filtering rules for the data of a model is the model class. So, we will\
    \ add a getInputFilter method to the Discount class, according to the following\
    \ source code:\n\n```\n```php\npublic function getInputFilter(): InputFilter\n\
    {\n    $inputFilter = new InputFilter();\n    $input = new Input('code');\n  \
    \  $filterChain = new FilterChain();\n    $filterChain->attach(new ToInt());\n\
    \    $input->setFilterChain($filterChain);\n    $inputFilter->add($input);\n \
    \   $input = new Input('name');\n    $filterChain = new FilterChain();\n    $filterChain->attach(new\
    \ StringToUpper())\n        ->attach(new Alnum(true));\n    $input->setFilterChain($filterChain);\n\
    \    $inputFilter->add($input);\n    $input = new Input('operator');\n    $filterChain\
    \ = new FilterChain();\n    $filterChain->attach(new AllowList(['list' =>\n  \
    \      ['-', '*', '/']]));\n    $input->setFilterChain($filterChain);\n    $inputFilter->add($input);\n\
    \    $input = new Input('factor');\n    $filterChain = new FilterChain();\n  \
    \  $filterChain->attach(new ToFloat());\n```\n```"
  merge: -1
  img_proc: true
- pgno: 225
  md: "```\n```php\n$input->setFilterChain($filterChain);\n$inputFilter->add($input);\n\
    return $inputFilter;\n}\n```\n```\n\nThe InputFilter class is a collection of\
    \ Input instances. The Input class allows you to chain filters and validators\
    \ for an input attribute. For each Discount class attribute, we have created an\
    \ instance of Input.\n\nTo connect filters to an input attribute, we use the FilterChain\
    \ class. FilterChain connects a group of filters and allows you to apply all these\
    \ filters to a value. In sequence, these filters are attached to FilterChain.\n\
    \nYou can find a reference about Laminas standard filter classes at https://docs.laminas.dev/laminas-filter/standard-filters.\
    \ For the Discount class, we have used the following filter classes:\n\n+   -\
    \ The ToInt class was used to ensure that discount code is integer.\n+   - The\
    \ StringToUpper class was used to ensure capital letters for the discount name.\
    \ In addition, Alnum ensures that only alphanumeric values are allowed. In fact,\
    \ the argument true in the Alnum constructor allows whitespaces too.\n+   - The\
    \ AllowList class was used to restrict the possible values of the operator to\
    \ three possibilities.\n+   - The ToFloat class was used to ensure that factor\
    \ is a float.\n\n> **Important note: Filter classes**\n> \n> There are more available\
    \ filters other than standard filters. You can find a complete list of available\
    \ Laminas filters at https://docs.laminas.dev/laminas-filter. In addition, you\
    \ can create your own filter classes by implementing Laminas\\Filter\\FilterInterface.\
    \ We will learn how to create customized filters in Chapter 13, Tips and Tricks.\n\
    \nSince we have defined a method for generating an instance of InputFilter, we\
    \ will use this instance for transforming the attribute values of the Discount\
    \ model. It is done with the Discount->toArray method, like so:\n\n```\n```php\n\
    public function toArray()\n{\n    $inputFilter = $this->getInputFilter();\n  \
    \  $inputFilter->setData(get_object_vars($this));\n    return $inputFilter->getValues();\n\
    }\n```\n```"
