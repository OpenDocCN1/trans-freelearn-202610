  md: "# Decoupling the generic behavior of authentication\n\nWe know that the Inventory\
    \ and Store modules have authentication, but they authenticate against different\
    \ sources. However, it is possible to isolate what is common for both modules\
    \ into a generic management identity class.\n\nWe will extract the generic code\
    \ from Inventory\\\\Model\\\\IdentityManager to Generic\\\\Model\\\\IdentityManager,\
    \ in our reuse module, Generic. Let us talk only the things that will be different\
    \ in new classes.\n\nFirst, the generic IdentityManager class will have three\
    \ protected attributes. This class doesn't have an attribute for the resource\
    \ table gateway because it is a particular case for the Inventory module:\n\n\
    ```\nprotected ?AdapterInterface $adapter;\nprotected ?array $encryptionMethod;\n\
    protected ?AuthenticationService $auth;\n\npublic function __construct(AdapterInterface\
    \ $adapter,\n    array $encryptionMethod)\n{\n    $this->adapter = $adapter;\n\
    \    $this->encryptionMethod = $encryptionMethod;\n    $this->auth = new AuthenticationService();\n\
    }\n```\n\nSecond, the IdentityManager->login method calls a doCustomTasks method\
    \ if the authentication result is valid. The doCustomTasks method is declared\
    \ (it is not abstract), but it is void. Generic\\\\Model\\\\IdentityManager is\
    \ not an abstract class, so it can be instantiated directly if it is implemented\
    \ is enough. This feature aims to avoid unnecessary inheritance.\n\nAfter creating\
    \ Generic\\\\Model\\\\IdentityManager, we modify Inventory\\\\Model\\\\IdentityManager\
    \ to inherit from the first class. So, the new Inventory\\\\Model\\\\IdentityManager\
    \ is reduced to four methods. The first method is the setter for the resource\
    \ table gateway:\n\n```\nprivate ?ResourceTable $resourceTable;\n\npublic function\
    \ setResourceTable(ResourceTable\n    $resourceTable)\n{\n    $this->resourceTable\
    \ = $resourceTable;\n}\n```"
