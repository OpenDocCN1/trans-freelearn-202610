  md: "![](img/e6cf5550804ccae9d1859270da8688f5_238_0.png)\n\nFigure 9.2 – Error page\
    \ for controller not found\n\nWhy are we receiving this error? Because there is\
    \ no alias for `IndexController` class in the Inventory module. If you observe\
    \ the part of the test that checks the controller name, you can see the following\
    \ comment about the alias:\n\n```\n$this->assertControllerName('index');\n// as\
    \ specified in router's controller name alias\n```\n\nLet us solve this issue.\
    \ In the `module.config.php` file, add a line that associates the index alias\
    \ with `IndexController` class like so:\n\n```\n'controllers' => [\n    'aliases'\
    \ => [\n        'index' => Controller\\\\IndexController::class,\n    ],\n]\n\
    ```\n\nThis change will reduce the failures to only one, related to the `loginAction`\
