    in a company over time. An employee can do tasks of a fellow employee who is on
    vacation. An employee may also take the place of their boss when the boss is on
    vacation. At different times, employees have different permissions according to
    the tasks they need to do. So, we mustn’t strongly couple employees and permissions
    because permissions are more connected to roles.


    In fact, imagine you have already implemented CRUD for roles, as we did in *Chapter
    7, Request Control and Data View*, with the products. Also, imagine that you have
    implemented this CRUD using laminas-form, laminas-filter, and laminas-validation,
    as we did in *Chapter 8, Creating Forms and Implementing Filters and Validators*,
    for product discounts. It is not difficult to imagine because the source code
