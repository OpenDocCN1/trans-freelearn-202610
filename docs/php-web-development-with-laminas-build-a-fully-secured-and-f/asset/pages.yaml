- pgno: 331
  md: "need to rewrite it. I have an additional suggestion: try to write code blocks\
    \ that fit in the window of your text editor. If you need to scroll to see the\
    \ full code of a function or method, this subroutine is a strong candidate to\
    \ be shortened.\n\n> **Source Code, Grass, and Rabbits**\n> \n> There is something\
    \ common among source code, grass, and rabbits: they can multiply very fast. But\
    \ it is easier to lose control over source code than over grass or rabbits.\n\n\
    Let us take an example of duplicated code reduction using the output of phpcpd.\
    \ If you observe the implementation of the getInputFilter method in Figure 12.1,\
    \ there are repeated steps for each input: input creation, filter addition, and\
    \ validator additions. We can create an extension of the Laminas\\\\InputFilter\\\
    \\InputFilter class with a method that encapsulates these steps. So, let us create\
    \ the InputFilter class in the Generic module, within the Generic\\\\Model namespace\
    \ like so:\n\n# InputFilter.php\n\n```\n```php\n<?php\ndeclare(strict_types=1);\n\
    \nnamespace Generic\\\\Model;\n\nuse Laminas\\\\InputFilter\\\\InputFilter as\
    \ LaminasInputFilter;\nuse Laminas\\\\InputFilter\\\\Input;\nuse Laminas\\\\Filter\\\
    \\FilterChain;\nuse Laminas\\\\Validator\\\\ValidatorChain;\n\nclass InputFilter\
    \ extends LaminasInputFilter\n{\n    public function addInput(string $name, array\
    \ $filters = [],\n    array $validators = []): self\n    {\n        $input = new\
    \ Input($name);\n        $filterChain = new FilterChain();\n        foreach($filters\
    \ as $filter) {\n            $filterChain->attach($filter);\n        }\n\n   \
    \     $input->setFilterChain($filterChain);\n```\n```"
