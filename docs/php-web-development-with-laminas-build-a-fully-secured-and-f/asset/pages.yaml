    \n```\npublic function editAction()\n{\n    $key = $this->params('key');\n   \
    \ $discount = $this->discountTable->getByField\n    ('code',$key);\n    $form\
    \ = new DiscountForm();\n    $form->bind($discount);\n    return new ViewModel([\n\
