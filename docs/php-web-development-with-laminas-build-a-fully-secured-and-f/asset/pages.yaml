- pgno: 304
  md: "As you can see, we deleted the dependent record before because there is no\
    \ inventory without the product.\n\nLet us come back to the page titled **Inventory\
    \ Management** (Figure 11.3). When the user clicks on the **save** button on the\
    \ form, a request is processed by the **update** method of the **InventoryAPIController**\
    \ class. This method calls a specific method of the **InventoryTable** class,\
    \ according to the selected operation. The source code of **InventoryAPIController->update**\
    \ looks like this:\n\n```\npublic function update($id, $data)\n{\n    $inventory\
    \ = $this->inventoryTable->\n        getByField('code', $id);\n    $operation\
    \ = $data['operation'];\n    $methods = [\n        'add' => 'addItems',\n    \
    \    'remove' => 'subtractItems',\n        'reserve' => 'reserveItems',\n    \
    \    'maximum' => 'setMaximum',\n        'minimum' => 'setMinimum'\n    ];\n \
    \   $method = ($methods[$operation] ?? 'invalid');\n    if ($method == 'invalid')\
    \ {\n        $updated = false;\n    } else {\n        $updated = $this->inventoryTable->$method\n\
    \            ($id, $data['amount']);\n    }\n    $updated = (bool) $updated;\n\
    \    return new JsonModel(['updated' => $updated]);\n}\n```\n\n**Variable functions**\n\
    Instead of using a switch structure, the InventoryAPIController->update method\
    \ uses the variable function feature of PHP. A variable function is a function\
    \ (or method) defined by a variable. In the update method, we use the $method\
    \ variable to call a method from the InventoryTable instance. The method to be\
    \ called will be defined at runtime. Variable functions are very useful to write\
    \ cleaner code."
