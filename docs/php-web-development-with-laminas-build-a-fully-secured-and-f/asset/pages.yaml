  md: "```\n$rbac = new Rbac();\n$rbac->addRole($role);\n\n$container = new Container();\n\
    $container->rbac = $rbac;\n}\n```\n\nThe loadAuthorizationData method does the\
    \ following:\n\n+   • Creates an instance of the Laminas\\\\Permissions\\\\Rbac\\\
    \\Role class and uses the employee nickname as the role name. Pay attention! An\
    \ employee can have several roles, but to check authorization, we will work with\
    \ a virtual role that will unify all the real roles associated with the employee.\n\
    +   \n+   • Recovers the record of the authenticated employee with the getResultRowObject\
    \ method of the Laminas\\\\Authentication\\\\Adapter\\\\DbTable\\\\AbstractAdapter\
    \ class.\n+   \n+   • Uses the ID of an authenticated employee to recover the\
    \ resources associated with the roles of the employee through the ResourceTable->getResourcesFromAnEmployee\
    \ method, whose source code is as follows:\n\n```\npublic function getResourcesFromAnEmployee\n\
    ($employeeID) : ResultSet\n{\n    $subSelect = new Select('employee_roles');\n\
    \    $subSelect->columns(['code_role'])\n    ->where(['ID_employee' => $employeeID]);\n\
    \n    $where = new Where();\n    $where->in('resources_role.code_role',\n    $subSelect);\n\
    \n    $select = new Select($this->tableGateway\n    ->getTable());\n    $select->columns(['name'\
    \ => new Expression\n    ('DISTINCT name'),'method'])\n    ->join('resources_role',\
