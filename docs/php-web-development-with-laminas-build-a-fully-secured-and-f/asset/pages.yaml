- pgno: 352
  md: '# Summary


    In this chapter, we started by discussing some agile development concepts, which
    are very important for software maintenance. After these concepts, we learned
    how to easily detect duplicated code in PHP programs using the free and open source
    phpcpd tool. After detecting blocks of duplicated code to filter and validate
    in model classes, we showed how to unify these blocks in an extension of the Laminas\InputFilter\InputFilter
    class.


    Next, we learned how to create a product search box. For this, we had to modify
    the ProductTable class to execute SQL SELECT queries with the LIKE operator.


    Then, we learned how to generate API documentation using the free and open source
    swagger-docs tool. When we demonstrated how to use the OpenAPI Specification to
    generate rich HTML pages with REST endpoints, we also learned how to implement
    REST requests to list collections.


    Finally, we learned how to isolate identity management to avoid security issues
    when we have more than one authentication control.


    In the next chapter, we will introduce some tips and tricks that help devselopers
    to solve some problems that can eventually appear in the construction of an object-oriented
    PHP web application.'
  merge: -1
  img_proc: true
- pgno: 353
  md: '# Tips and Tricks


    This chapter provides some tips and tricks that will help you as a developer to
    solve some problems that may eventually appear in the construction of a web application.


    We will first start by learning what the required methods for creating mapped
    models, that is, classes that are connected to database tables, are.


    After that, we will learn how to customize filters and validators to implement
    specific business rules in the model layer.


    Then, we will understand the Laminas view layer better, learning how to produce
    JSON responses, manage file uploads, and change the application layout.


    Finally, we will be mastering the Laminas controller layer, by learning how to
    detect AJAX requests, how to exchange messages between the controller and view
    layers, and what the different ways of ending a controller action are.


    By the end of this chapter, you will be able to meet eventual demands on web applications
    using the Laminas framework.


    In this chapter, we''ll be covering the following topics:


    +   - Creating mapped models

    +   - Customizing filters and validators

    +   - Understanding the Laminas view layer

    +   - Mastering the controller layer'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# # Technical requirements


    All the code related to this chapter can be found at two repositories:


    +   - https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter13/tipsandtricks

    +   - https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter13/whatstore


    The first URL contains a Laminas application named `tipsandtricks`. All of the
    code samples in this chapter can be found in `tipsandtricks`. You can run this
    application with PHP as a web server, as we did in _Chapter 2, Setting Up the
    Environment for Our E-Commerce Application_, with the `myfirstlaminas` application.


    The second URL is for our e-commerce application, `whatstore`, with a little modification
    related to the use of filters. This will be explained in the _Creating a customized
    filter_ section.


    # # Creating mapped models


    This is a useful tip for avoiding headaches when you are creating models mapped
    to tables with `laminas-db`. These models need to implement two methods, that
    is, `exchangeArray` and `getArrayCopy`:


    ```

    public function exchangeArray($data)

    ```


    The `exchangeArray` method is used by the `Laminas\Db\ResultSet` class to populate
    a model with data from a table record.


    ```

    public function getArrayCopy()

    ```


    The `getArrayCopy` method is used by the `Laminas\Db\ResultSet` class to get data
    from a model. It is also used by `Laminas\Form\Form` to bind model attribute values
    to form field values.


    In fact, the `Laminas\Db\ResultSet` class also accepts a `toArray` method, replacing
    the `getArrayCopy` method. I suggest implementing the `toArray` method in models
    to extract the data to be persisted with the `TableGateway` class. Sometimes,
    the model data to be sent to a form object is different from the model data to
    be sent to a data mapper. You can show, in an HTML form, data that won''t be saved
    in a database table, because an HTML form can show data from two joined tables
    and one of these tables is read-only, not written.


    This was a short tip. It was a good start. In the next section, still talking
    about the model layer, we will learn how to customize filters and validators.
    It won''t be as short, but it will be more exciting.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Customizing filters and validators


    In this section, we will learn how to customize filters and validators and what
    the required methods for mapped models are.


    On the home page of the tipsandtricks application, you will see a frame, similar
    to that in Figure 13.1, on the left-hand side, with samples of filter and validator
    customization for the model layer:


    ![](img/e6cf5550804ccae9d1859270da8688f5_355_0.png)


    Figure 13.1 – Access to customized filter and validator samples


    We will learn how the buttons of this frame work and understand how filters and
    validators are created with the Laminas framework.


    In Chapter 8, Creating Forms and Implementing Filters and Validators, we learned
    how to use some filters and validators available in the laminas-filter and laminas-validator
    components. However, we are not limited to the implemented Laminas filters and
    validators. Both of these components have interfaces that allow us to implement
    customized filters and validators.


    Let us test the customized filter first.'
  merge: -1
