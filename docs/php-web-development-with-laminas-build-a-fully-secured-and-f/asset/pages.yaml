  md: "```\n] );\n}\n```\n\nObserve that we have created an instance of `DiscountForm`\
    \ and we have invoked the `DiscountForm->bind` method. This method is inherited\
    \ from `Laminas\\Form\\Form`. The `bind` method assigns the attribute values of\
    \ a model object to the related fields of forms. We talk to `DiscountForm` to\
