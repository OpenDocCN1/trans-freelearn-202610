  md: "```\n>> <snippet_undefined><snippet_keyword>default</snippet_keyword> suite\
    \ has undefined steps. Please choose the context to generate snippets:</snippet_undefined>\n\
    \n[0] None\n[1] FeatureContext\n>\n```\n\nThe preceding output says that there\
    \ is an undefined scenario. Why? Because there is no context class with code that\
    \ implements the scenario. In the end, Behat waits for you to select a target\
    \ to code snippets for the scenario. You can select None, and nothing will be\
    \ done, or you can select the default context class, FeatureContext. For now,\
    \ choose None because we will create a specific class for our scenario.\n\nNow,\
    \ copy the FeatureContext.php file from the features/bootstrap folder to the ProductAdditionContext.php\
    \ file in the same folder. Change the name of the class inside the file to ProductAdditionContext.\
    \ Is this procedure enough for Behat to show this new class as a target option?\
    \ No, because the default behavior of Behat is to search only for the FeatureContext\
    \ class. If you don't believe me, try to run Behat now. You will see that ProductAdditionContext\
    \ will be ignored.\n\nTo change the behavior of Behat, we must create a configuration\
    \ file. Create a file named behat.yml in the features folder with the following\
    \ content:\n\n# behat.yml\n\n```\ndefault:\n  autoload:\n    '' : '%paths.base%/bootstrap'\n\
    \  suites:\n    default:\n      paths:\n        - '%paths.base%'\n      contexts:\n\
    \        - ProductAdditionContext\n```\n\nBehat supports multiple configuration\
    \ profiles. We will use only the default profile. The autoload key defines where\
    \ Behat will find the context classes. The suites key allows the definition of\
    \ multiple sets of context classes suites. In this case, we only have a default\
    \ set of context suites. The paths key defines where the user story files will\
    \ be searched."
