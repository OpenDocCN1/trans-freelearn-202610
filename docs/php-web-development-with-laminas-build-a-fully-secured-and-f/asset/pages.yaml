    # # Developing our use case with TDD


    From now on, we are going to start TDD. This is an approach popularized by Kent
    Beck, who is one of the signatories of the *Manifesto for Agile Software Development*.
    Beck states that TDD is a way of programming without fear. When you write tests
    before you create the code that they test, you are writing requirements as code.
    A test that can be run anytime tells us whether code meets the requirements anytime.
    It is not enough to create a code that works. We need to maintain the code in
    working order after each change. Tests tell us whether a change has stopped the
    code from working.'
