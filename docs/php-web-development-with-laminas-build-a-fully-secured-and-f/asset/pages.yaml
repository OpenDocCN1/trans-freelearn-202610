- pgno: 375
  md: '# # Last Considerations


    This chapter marks the conclusion of the book, showing the possibilities going
    forward with other components not used in sample applications.


    In this chapter, we will get a general view of Laminas components that were not
    used in get sample applications in earlier chapters of the book. We will learn
    about a component for creating distributed and decentralized applications, as
    well as learning about a component for creating APIs. Lastly, we will learn where
    we can get help with Laminas components and how to become a part of the Laminas
    community and improve the Laminas framework.


    In this chapter, we will cover the following topics:


    +   - Other Laminas components

    +   - Microservice-oriented development

    +   - Building APIs

    +   - Resources of community


    # ## Other Laminas components


    In this section, we will get an overview of some Laminas components that were
    not used in the projects of this book. You can read the documentation about all
    the Laminas components at `https://docs.laminas.dev/components.`


    # ## Cache


    Let''s use travel as an analogy. We spend time and money traveling. Since time
    is money, we spend a lot of money traveling. In addition, the farther we go, the
    more money we spend. In other words, the cheapest place to go is where you are
    already. Staying in the same place is the cheapest type of travel. This is the
    idea of the cache: to keep data in the nearest place possible to reduce the time
    and cost of transport. The `laminas-cache` component allows us to cache data using
    several storage'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'adapters, which enable your application to save and read data from filesystem,
    Memcached, Redis, or MongoDB databases, among others.


    # CLI


    Although we have used Laminas to develop web applications, the framework is not
    limited to this purpose. In fact, the PHP manual says that PHP can do anything.
    With Laminas, we can do anything, but with more control.


    > **What can PHP do?**

    > You can find a description of the possible uses of PHP at https://www.php.net/manual/en/intro-whatcando.php.


    Believe it or not, you can create command-line PHP programs with Laminas. To do
    this, you should use the laminas-cli component.


    # Crypt


    In our whatstore project, we said that it is important to encrypt passwords. But
    you shouldn’t use the algorithms that were used in the examples in this book.
    It is recommended to use strong cryptography and password hashing to protect and
    authenticate sensitive data. The laminas-crypt component offers an easy and secure
    way to implement cryptography in PHP applications. This component was developed
    by several great applied cryptography specialists, such as Enrico Zimuel, a core
    member of the PHP Framework Interoperability Group.


    # CSRF


    There is actually no component called laminas-crsf. However, there are two classes
    that handle CSRF. CRSF stands for cross-site request forgery, an attack where
    someone tries to send malicious data through falsified forms. The laminas-form
    component provides Element\\Csrf to add a hash element to a form with timeout
    configuration. To validate the hash element value, you can use the Laminas\\Validator\\Csrf
    class.


    # DOM


    DOM stands for document object model. This is a web standard, documented at https://www.w3.org/DOM/DOMTR.
    According to this standard, the HTML tags can be handled as an object hierarchy.
    In addition, it is possible to search for and select objects using the XPath language
    and a CSS selector. The laminas-dom component enables you to find elements in
    XML and HTML documents using these two approaches. It is very useful to automate
    the reading of documents in these formats in order to import data or search for
    data on websites through the implementation of web crawlers.'
  merge: -1
  img_proc: true
- pgno: 377
  md: '**XPath and CSS selectors**

    The root documentation for the XPath language is available at https://www.w3.org/TR/1999/REC-xpath-19991116.
    The root documentation for CSS selectors is available at https://www.w3.org/TR/2018/REC-selectors-3-20181106.


    **The laminas-dom development state**

    The `laminas-dom` component is considered feature-complete and is now in **security-only**
    maintenance mode, following a decision by the **Laminas Technical Steering Committee**.
    It does not mean that the package has been abandoned, but it means that only security
    updates will be incorporated. However, this committee suggests symfony/dom-crawler
    as an alternative component with active development (that is, feature-incomplete).


    **What to do with abandoned packages**

    Although `laminas-dom` has not been abandoned, it is useful to know what to do
    if a component is no longer under development. If the maintainers of a component
    are worried about their users, you can find information about alternative components
    on the GitHub home page of the component or on its Packagist page.


    # Escaper


    According to the **Open Web Application Security Project (OWASP)**, injection
    was one of the top 10 web application security risks in 2021. One of the forms
    of injection is **Cross-Site Scripting (CSS)**. To prevent this type of injection
    attack in your PHP application, you can use the `laminas-escaper` component. This
    component neutralizes injected code with bad intentions for output data, no matter
    whether the code is written in HTML, CSS, or JavaScript.


    **Top 10 OWASP**

    OWASP is a foundation that aims to improve software security. You can find a complete
    rundown of security risks, example attack scenarios, and how to prevent them at
    https://owasp.org/www-project-top-ten.


    # Feed


    If you need to consume RSS or Atom feeds, you can use the `laminas-feed` component.
    This component enables you to handle feed responses as object collections.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '> **RSS reference**

    > You can find documentation about RSS at https://validator.w3.org/feed/docs/rss2.html.


    # ## Hydrator


    In an object-oriented application, there are some frequent operations, such as
    the following:


    +   - Hydrating objects (populating them with a dataset)

    +   - Extracting data from objects


    The `laminas-hydrator` component provides hydrating and extracting functionalities.
    This component requires the following from the classes to be hydrated and extracted:
    they must implement the `exchangeArray` and `getArrayCopy` methods, the same required
    methods for mapped models, as we saw in *Chapter 13, Tips and Tricks*.


    # ## JSON-RPC server


    JSON is the de facto standard for REST APIs. But these aren''t my words; they''re
    the words of Balaji Varanasi and Sudha Belida in their book, *Spring REST*, from
    *Apress*, published in 2015. They are right. Nobody will expose API data in a
    format other than JSON today, except if a constraint requires it.


    The `laminas-json-server` component enables you to expose PHP classes as services.
    Using PHP DocBlocks, the `laminas-json-server` component allows remote procedure
    calls to PHP functions and methods.


    > **JSON-RPC reference**

    > You can find the JSON-RPC specification at https://www.jsonrpc.org/specification.


    # ## LDAP


    The **Lightweight Directory Access Protocol** (**LDAP**) is an open standard protocol
    for managing directory services. There is an open source implementation of LDAP
    named OpenLDAP available in several Linux distributions. Many companies sell LDAP
    services as RHDS by Red Hat or Azure Active Directory by Microsoft. You can find
    LDAP implementations in most cloud providers.


    It is useful to have a component that makes it easy to manage LDAP operations
    in PHP applications. This is exactly what `laminas-ldap` does.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# LDAP references


    You can find more information about LDAP, including its history, at `https://ldap.com`.
    On the other hand, you can find information about OpenLDAP and its implementation
    at `https://www.openldap.org`.


    # Log


    You should remember that we have used the `error_log` function several times to
    save messages to the web server log. In most cases, we have used this function
    to save messages about exceptions. However, there was a time when we used the
    `error_log` function to save information about a successful authentication. It
    doesn''t seem very appropriate to use a function with the word `error` in its
    name to save information messages, do you agree?


    To manage log messages with appropriate identification and store the messages
    in a variety of backends, you can use the `laminas-log` component. This component
    conforms to the PSR-3 specification, available at `https://www.php-fig.org/psr/psr-3`.


    There are other Laminas components too, but the ones that have been presented
    in this section are of general interest.


    In the next section, we will talk about a component that is very useful for distributed
    architectures.


    # Microservice-oriented development


    There is a special component, or better, a set of Laminas components, that can
    be considered a microframework or a framework for microservices. We are talking
    about **Mezzio**.


    Mezzio was designed to implement the concept of middleware according to the PHP-FIG.
    In the PSR-15 specification, middleware “is an individual component participating,
    often together with other middleware components, in the processing of an incoming
    request and the creation of a resulting response” (`https://www.php-fig.org/psr/psr-15`).
    With Mezzio, you can easily create middleware pipelines to process HTTP requests.


    Mezzio is very suitable for building reduced applications. This microframework
    basically uses four components for creating middleware: a router, a dependency
    injection container, a templating engine, and an error handler. By using minimal
    resources, Mezzio helps developers to create microservices in PHP.


    You can find specific documentation about Mezzio at `https://docs.mezzio.dev`.


    In the next section, we will talk about building APIs using Laminas components.
    In fact, we have already built APIs with Laminas components. The good news is
    that now we will reveal that there is a tool to make this easier.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# Building APIs


    The Laminas community provides a tool for building PHP APIs: **API Tools**. API
    Tools is implemented with Laminas components, but it does not require the developer
    to use Laminas as the framework. This means that you can use API Tools to generate
    APIs for PHP applications written with any library or framework.

    You can find documentation about API Tools at `https://api-tools.getlaminas.org`.


    In the next section, we will present some useful Laminas resources provided by
    the community.


    # Community resources


    In addition to the Laminas documentation, there are two other sources for learning
    about Laminas and asking questions:


    +   * **Laminas forums**: You don''t need to have an account at `https://discourse.laminas.dev`
    to read the posts on official Laminas forums. However, you need to create an account
    to post questions.


    +   * **Laminas GitHub repositories**: The open source code of Laminas components
    is also documentation. You can find the repositories of each Laminas component
    at `https://github.com/laminas`. This web page has essential guidelines for getting
    support, contributing to the project, and reporting security issues.


    In addition, you can find some examples of Laminas component extensions here:
    `https://github.com/fgsl/framework`.


    # Summary


    In this chapter, we had a brief look at some Laminas components that were not
    used in the example application in this book. We learned about some components
    related to general purposes, such as the cache and logs.


    We also learned that there is a specific component for creating distributed and
    decentralized applications, the Mezzio microframework. In addition, we have learned
    that the Laminas community provides API Tools for creating PHP APIs.


    Finally, we learned about where to get help with Laminas and how to become a part
    of the Laminas community and improve the framework.


    A real framework focuses on general issues. But you should take advantage of the
    extensibility and the open source features of Laminas to implement solutions for
    specific issues.


    In conclusion, it is good to remember one of the principles of the Agile Manifesto:
    "Simplicity – the art of maximizing the amount of work not done – is essential."
    Use Laminas and simplify your work.


    Create. Only what exists can be improved.'
  merge: -1
  img_proc: true
