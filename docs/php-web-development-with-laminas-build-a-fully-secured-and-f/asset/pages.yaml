  md: "# Creating a class to define an HTML form\n\nFollow these steps to create a\
    \ class defining an HTML form:\n\n+   1. First, in the module/Inventory/src folder,\
    \ create a folder named Form.\n+   2. Next, inside the Form folder, create a DiscountForm.php\
    \ file. This file must contain a DiscountForm class:\n\n# DiscountForm.php\n\n\
    ```\n<?php\nnamespace Inventory\\Form;\nuse Laminas\\Form\\Form;\nuse Laminas\\\
    Form\\Element\\Text;\nuse Laminas\\Form\\Element\\Select;\nuse Laminas\\Form\\\
    Element\\Number;\nuse Laminas\\Form\\Element\\Hidden;\nclass DiscountForm extends\
    \ Form {\n    public function __construct($name = 'discount') {\n        parent::__construct($name);\n\
    \        $text = new Text('name');\n        $text->setLabel('Name:');\n      \
    \  $text->setAttribute('autofocus', 'autofocus');\n        $this->add($text);\n\
    \        $select = new Select('operator');\n        $select->setLabel('Operator:');\n\
    \        $options = [\n            '-=' => '-=',\n            '*=' => '*=',\n\
    \            '/=' => '/=,\n        ];\n        $select->setValueOptions($options);\n\
    \        $this->add($select);\n        $number = new Number('factor');\n     \
    \   $number->setLabel('Factor:');\n        $this->add($number);\n        $hidden\
    \ = new Hidden('code');\n```"
  merge: -1
