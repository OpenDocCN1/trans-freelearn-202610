- pgno: 326
  md: 'As we know, a factory class needs to be defined in the `module.config.php`
    file of the module. Then, we add the following item to the `service_manager=>factories`
    key:


    ```

    IdentityManager::class => Model\\IdentityManagerFactory::class

    ```


    You may ask, “Why don’t you just use `IdentityManager` as the key?” The answer
    is that there is already an `IdentityManager` key for the Inventory module. So,
    here we have found a problem with using factory keys based on short aliases: name
    collision. Until now, we didn’t have this problem, but in case it arises, it is
    a good practice to use Full Qualified Class Names (FQCN) as keys to avoid name
    collision. In PHP, an FQCN is provided by the `class` static property of the class.


    Now, we can really end this chapter.


    # Summary


    In this chapter, we learned how to implement inventory management, using the acquired
    knowledge from the previous chapter about registration creation. In sequence,
    we learned how to refactor the customer home page with `Placeholder` and `PartialLoop`
    view helpers. We changed the home page route of the whatstore application for
    the `Store` module because the default user must be the customer.


    Then, we learned how to implement a product basket, using `Laminas\\Session\\Container`
    to store the products in the session. Finally, we learned how to make a purchase
    order for an authenticated customer.


    Finally, we saw how to decouple the generic behavior of authentication for each
    module so that it implements only specific behavior.


    In the next chapter, we will review implemented features, and we will refactor
    code when it is appropriate. We will also create a product search box, generate
    API documentation, and encapsulate identity management.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# Reviewing and Improving Our App


    This chapter is dedicated to reviewing and improving our whatstore application.
    In the last chapter, we delivered the requirements of the first version of the
    application. However, no software version lasts forever. New software is always
    under construction. Software that is not constantly changing is probably dead
    software.


    As we believe that concisous about software maintenance is so important, we will
    start this chapter by talking about fundamental agile development principles.
    An agile approach recognizes that software requirements can change during the
    execution of a project.


    As software developers, we need to ensure that any changes to our code can be
    made as easily as possible. For this, our code needs to be as simple as possible.
    Because of this, in this chapter, we will talk about the concept of clean code
    and show how to eliminate duplicated code, which can make our code very complicated.


    In this chapter, we will also make a little change in the whatstore application,
    as an example of adding desirable features that were discovered only at the time
    of delivery of a version. It is not a problem because we can always release a
    new version. The question is how fast we can do it. It is because of this we are
    using a framework and several tools and techniques.


    Software can be very powerful, but if nobody knows how to use it, it is useless,
    or at best, it is software made only for its creators. Software needs documentation,
    and a part of this is API documentation. In this chapter, we will learn how to
    generate API documentation using OpenAPI Specification.


    Finally, we will show that software needs continuous deep analysis because although
    it may be working, we can create unexpected behaviors for it if we don’t undertake
    exhaustive tests. For every software, always expect the unexpected. In this chapter,
    we will show an example of unexpected behavior in the identity management of our
    application, something that is not perceivable when you only implement ordinary
    use cases.'
  merge: -1
  img_proc: true
- pgno: 328
  md: "In short, in this chapter, we’ll be covering the following topics:\n\n+   -\
    \ Learning agile development principles\n+   - Eliminating duplicated code\n+\
    \   - Removing unnecessary configurations\n+   - Creating a product search box\n\
    +   - Generating API documentation\n+   - Isolating identity management for each\
    \ module\n\n# Technical requirements\n\nAll the code related to this chapter can\
    \ be found at https://github.com/PacktPublishing/\nPHP-Web-Development-with-Laminas/tree/main/chapter12/whatstore.\n\
    \n# Principles of agile development\n\nThis chapter consists of an exercise for\
    \ an agile development process with test-driven development\n(TDD). One of the\
    \ principles of the Agile Manifesto says that we should pay continuous attention\
    \ to\ntechnical excellence and practice good design because this enhances agility.\
    \ You can read more about\nthe Agile Manifesto at https://agilemanifesto.org.\n\
    \nThe third task of the TDD cycle is refactoring. In the book Test Driven Development\
    \ by Example by\nKent Beck, his definition of refactoring is to “eliminate all\
    \ of the duplication created in merely getting\nthe test to work.” Thus, refactoring\
    \ seems only to be a simple cleaning task, but Martin Fowler warns\nthat refactoring\
    \ is fundamental to ensure code is easy to maintain. He says:\n\n> A poorly designed\
    \ system is hard to change – because it is difficult to figure out\n> what to\
    \ change and how these changes will interact with the existing code to get the\n\
    > behavior I want.\n> \n> Martin Fowler, Refactoring: Improving the Design of\
    \ Existing Code\n\nAnother principle of the Agile Manifesto says that working\
    \ software is the primary measure of progress.\nEssentially, this is what your\
    \ customer wants – something that works. However, there is another\nmanifesto\
    \ too, the Manifesto for Software Craftsmanship, which says that we should value\
    \ not only\nworking software but also well-crafted software. You can read more\
    \ about the Manifesto for Software\nCraftsmanship at https://manifesto.softwarecraftsmanship.org.\n\
    \nFrom Chapter 6, Models and Object-Relational Mappers with Behavior-Driven Development,\
    \ to Chapter 11,\nImplementing a Product Basket, we implemented the use cases\
    \ described in Chapter 5, Creating the\nVirtual Store Project. We now have a functional\
    \ web application, using several Laminas components.\nIn this chapter, we will\
    \ review and improve the implementation of our e-commerce application to\ngenerate\
    \ cleaner code that is easier to maintain."
  merge: -1
  img_proc: true
- pgno: 329
  md: "Remember this: you can only improve something that already exists. Code that\
    \ works can be improved. Code that works also usually needs to be changed to allow\
    \ new features or fix bugs. After making the required changes, code usually needs\
    \ to be reviewed to avoid maintenance troubles in the future. Software improvement\
    \ is an endless process. While it is useful, it is a product in a continuous improvement\
    \ process.\n\n# Eliminating duplicated code\n\nA computer program is a set of\
    \ instructions. The wonderful thing about computers is that we don’t need to repeat\
    \ an instruction for them if this instruction is already stored. We only need\
    \ to say where the instruction is, like pointing somebody who is reading a handbook\
    \ to a specific page. In fact, if you give the handbook to somebody, they don’t\
    \ need to ask you what is written in it anymore.\n\nWhen we create software, we\
    \ create several handbooks. These handbooks can be procedures, functions, classes,\
    \ or traits. All of these code structures are reusable units of code. We have\
    \ several options to avoid duplicated lines of code, by centralizing them in one\
    \ of these structures.\n\nDuplicated lines of code can generate more work because\
    \ you will have to modify more than one line, possibly in more than one file,\
    \ to implement a new feature or fix a bug. For this reason, we have to avoid duplicated\
    \ lines of code.\n\nThere is a useful tool to detect duplicated lines in PHP programs\
    \ – **PHP Copy/Paste Detector (PHPCPD)**. You can download the latest version\
    \ of PHPCPD from `https://phar.phpunit.de/phpcpd.phar`. The downloaded file is\
    \ `phpcpd.phar`. Rename this file `phpcpd` and permit it to execute. Move `phpcpd`\
    \ to a directory of the system path (which is visible everywhere).\n\nThe `phpcpd`\
    \ program compares PHP code from a folder and shows the pairs of duplicated code\
    \ blocks. Let us run `phpcpd`. However, before we do this, we need to delete the\
    \ `vendor` subdirectory inside the `whatstore` directory. Why? It is because we\
    \ have to analyze only our code and not the dependencies code.\n\nSo, let's run\
    \ the following command:\n\n```\n$ phpcpd whatstore/\n```\n\nThe output will look\
    \ like this:\n\n```\nphpcpd 6.0.3 by Sebastian Bergmann.\n\nFound 1 clones with\
    \ 21 duplicated lines in 2 files:\n\n - /opt/lamp/htdocs/whatstore/module/Inventory/src/Model/\n\
    Discount.php:31-52 (21 lines)\n```"
  merge: -1
  img_proc: true
