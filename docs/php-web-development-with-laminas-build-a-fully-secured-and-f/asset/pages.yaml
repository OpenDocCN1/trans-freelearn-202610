- pgno: 145
  md: 'Let’s understand the patterns used for the productaddition.feature file. The
    file begins with the word Feature. A feature is another name for a user story
    or use case. The three lines that follow have initial words that must be present
    for every feature description:


    +   • In order...: The goal of the user story

    +   • As a/an...: The role played by the story actor

    +   • I need...: The condition for the actor to reach the goal


    These initial words define a pattern for describing a feature. Optionally, you
    can add a Rules section to describe the business rules related to the feature.
    This first part of the .feature file is only descriptive and works like any other
    document of requirements. The second part, on the other hand, serves to generate
    source code.


    A scenario describes a flow using an example. So, we have real values instead
    of variables. You can create several blocks, starting with the word Scenario,
    according to the possible flows. A Scenario block has phrases that start with
    the following words:


    +   • Given...: The condition for the flow to start

    +   • When...: The action that starts the flow

    +   • Then...: The result of the flow

    +   • And (optional)...: An additional result of the flow


    All these four keywords are part of a language projected to give structure and
    meaning to executable specifications – Gherkin. Gherkin is part of the common
    language analyzer of Cucumber, a BDD tool for Java. You can learn more about Gherkin
    at this URL: https://cucumber.io/docs/gherkin/reference.


    The phrases of a scenario are used to create methods of a context class. A context
    class allows you to map a user story to an automated test. Let’s see how it works.


    # # Mapping a user story to an automated test


    As you have seen, we wrote a scenario where an employee inserts a product called
    "Troop Power Battery" that costs $2,814. As the type of discount was not specified,
    we assume that the discount is null. Okay, but how does this scenario become an
    automated test? You will discover this by selecting the whatstore project in the
    Project Explorer view and clicking on the Behat run item in the Run | External
    Tools menu. The output on the Console tab will have the content of the productaddition.feature
    file added with the following lines:


    ```

    1 scenario (1 undefined)

    4 steps (4 undefined)

    0m0.01s (8.89Mb)

    ```'
