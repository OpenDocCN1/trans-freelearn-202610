  md: "Here, we have two pairs of files that generate two web pages: the login page\
    \ (index.phtml) and the registration page (register.phtml).\n\nAfter registering,\
    \ the customer can log in. The authentication for the customer is very similar\
    \ to what we did for the employee in the Inventory module. One significant difference\
    \ is that we store a Customer object in a session. In the CustomerController->loginAction\
    \ method, we recover the Customer object using the authentication adapter:\n\n\
    ```\nCustomer :: setCustomer($this->adapter->getResultRowObject(null, 'password'));\n\
    \n```\n\nThe AbstractAdapter->getResultRowObject method has two mutually exclusive\
    \ arguments. The first argument defines which fields from the table you want to\
    \ recover. The second argument defines which fields from the table you want to\
    \ omit from recovery.\n\nThe Customer :: setCustomer static method stores the\
    \ Customer instance in the session:\n\n```\npublic static function setCustomer(object\
    \ $customer): void\n{\n    $container = new Container();\n    $container->customer\
    \ = $customer;\n}\n\n```\n\nWhy do we need to store the Customer object in the\
    \ session? Don’t we get the identity data with AuthenticationService? Yes, AuthenticationService\
    \ stores the identity used for authentication, which is, for the customer, the\
    \ email address. But AuthenticationService does not automatically store the other\
    \ data. If we want to show the customer’s name on any page, we have to store it\
    \ explicitly.\n\nAfter login, the customer is redirected to the page to close\
    \ the purchase order, as we can see in Figure 11.8:"
