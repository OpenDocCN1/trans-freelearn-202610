- pgno: 108
  md: "We will have a StudentTable class that extends AbstractTable. But unlike SchoolClassTable,\
    \ the StudentTable class overrides the getByField and getAll methods. This is\
    \ because the default query of TableGateway, made with the select method, reads\
    \ only from a table, ignoring relationships. To add an INNER JOIN clause to SQL\
    \ SELECT executed by TableGateway, we need to use an instance of the Select class:\n\
    \n```\npublic function getAll() : iterable\n{\n    $select = new Select($this->tableGateway->getTable());\n\
    \    $select->join('classes', 'classes.code = '\n        students.class_code',\
    \ [\n        'class_name' => 'name'\n    ]);\n    $rowSet = $this->tableGateway->selectWith($select);\n\
    \    return $rowSet;\n}\n```\n\nThe Select class has a join method, which allows\
    \ setting an INNER JOIN clause. The third parameter of the join method allows\
    \ us to select the columns of the table and specify an alias as a key of the array.\
    \ To use the query with INNER JOIN, we inject the Select object into the selectWith\
    \ method of TableGateway. The selectWith method returns a ResultSet object, like\
    \ the select method.\n\nThe Student class also has differences when we compare\
    \ it with the SchoolClass class. The Student class overrides the exchangeArray\
    \ and toArray methods, inherited from AbstractModel.\n\nThe exchangeArray method\
    \ is overridden because it needs to instantiate the SchoolClass class. One student\
    \ depends on a school class. This is a constraint of our use case. We cannot have\
    \ students without a school class to associate them with. As we can see in the\
    \ implementation of Student->exchangeArray, the Student class has a $this->schoolClass\
    \ attribute:\n\n```\npublic function exchangeArray($data)\n{\n    $this->id =\
    \ ((int) $data['ID'] ?? 0);\n    $this->name = ($data['name'] ?? '');\n    $this->schoolClass\
    \ = new SchoolClass();\n    $this->schoolClass->code = ((int) $data['class_code']\n\
    \        ?? 0);\n    $this->schoolClass->name = ($data['class_name'] ?? '');\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "The `class_name` field is the alias for the field name of the `classes` table.\
    \ We have defined this alias in `INNER JOIN` made through the `Select` class.\n\
    \nAlthough we handle the data in memory as objects, we need to convert the data\
    \ into arrays to persist them in the table. So, in the `Student->toArray` method,\
    \ we replace the object with the primary key value:\n\n```\npublic function toArray()\n\
    {\n    $attributes = get_object_vars($this);\n    $attributes['class_code'] =\
    \ $attributes['schoolClass']\n        ->code;\n    unset($attributes['schoolClass']);\n\
    \    return $attributes;\n}\n```\n\nTo insert a new student, we need to associate\
    \ it with a school class. This requires a list of school classes in the edition\
    \ form for students. In the next part of the code, we can see the part of the\
    \ `edit.php` file of `view/student` that creates this list:\n\n```\n<select name=\"\
    class_code\">\n<?php\n$schoolClasses = SchoolClassTable::getInstance()->getAll();\n\
    foreach($schoolClasses as $schoolClass) :\n?>\n<option value=\"<?=$schoolClass->code?>\"\
    \n    <?=($schoolClass->code == $Student->schoolClass->code ?\n    'selected=\"\
    selected\"' : '')?>>\n    <?=$schoolClass->name?></option>\n<?php\nendforeach;\n\
    ?>\n</select>\n```\n\nThese are the main differences between school classes and\
    \ student registrations. The `school2` project is fully available at `https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter04/school2`.\
    \ There is a `StudentTest` test case for student registration and a report of\
    \ the code coverage. Try the complete application and compare the code of both\
    \ registrations. In Eclipse, you can compare two files by selecting them and pressing\
    \ the right mouse button, following which you select **Compare with/Each Other**."
  merge: -1
  img_proc: true
- pgno: 110
  md: "Now you know how to abstract a database connection and how to create ORM using\
    \ `laminas-db`.\n\nIn the next section, we will make a new implementation of the\
    \ school classes and student registrations, but this time we will use the `laminas-mvc`\
    \ component as a container for our application.\n\n# Using Laminas as a container\n\
    \nWhen you use Laminas as a library, your code calls the Laminas components. It’s\
    \ what we did with the `school11` and `school12` projects. Now, we will use Laminas\
    \ as a framework and this framework will call your code. Previously, Laminas was\
    \ contained in our applications. Now, we will create an application that will\
    \ be contained in the framework. In fact, we will rewrite our code according to\
    \ the MVC structure of Laminas.\n\nAs this is a preparation for a more complex\
    \ and complete application, we will show only the implementation for the listing\
    \ of the school classes, but do not worry, because the complete code is available\
    \ at the end of the section. But try to implement the code along with the explanation\
    \ before copying it from the repository, so you can compare your expectations\
    \ with the provided code.\n\nLike we did before, we need to prepare for the implementation\
    \ by creating a new project. Let us create it!\n\n# Creating the school3 project\n\
    \nTo create the `school3` project, follow these steps:\n\n+   1. Create the project.\n\
    +   \n+   Do you remember that we have configured an item in the Eclipse toolbar\
    \ that creates Laminas projects? We did it in the previous chapter. Well, you\
    \ can use it to create the `school3` project.\n+   \n+   Open the project using\
    \ the `File | New | PHP Project` menu option.\n\n+   2. Add PHPUnit to the `school3`\
    \ project as a development dependency.\n\n+   3. Don’t forget to save the `composer.json`\
    \ file and click on the **Update dependencies** button.\n\n> **Allow plugins**\n\
    > \n> When you are installing a component after creating the project from the\
    \ skeleton, you might be asked **Do you trust ‘laminas/laminas-component-installer’\
    \ to execute code and wish to enable it now?** and **Do you trust ‘laminas/laminas-skeleton-installer’\
    \ to execute code and wish to enable it now?**. These messages are related to\
    \ Composer plugins. You can answer y."
  merge: -1
  img_proc: true
- pgno: 111
  md: "+   4. After installing PHPUnit, select the `school3` project with the right\
    \ mouse button and access the Run As | PHPUnit Test item. You will see the following\
    \ message on the Console tab:\n\n```\nFatal error: Uncaught Error: Class \"Laminas\\\
    \\Test\\\\PHPUnit\\\\Controller\\\\AbstractHttpControllerTestCase\" not found\n\
    in /opt/lampp/htdocs/school3/module/Application/test/\nController/IndexControllerTest.php:11\n\
    ```\n\nThis error occurs because the Laminas skeleton project depends on the `laminas-test`\
    \ component, an extension for PHPUnit that allows us to test the Laminas controllers.\
    \ As you have installed PHPUnit in the `composer.json` editor, search for the\
    \ `laminas/laminas-test` package and install it. We learned how to install a Composer\
    \ package in *Chapter 3, Using Laminas as a Library with Test-Driven Development*.\n\
    \n+   5. Now you can run the test successfully. But what test is running? The\
    \ `IndexControllerTest` class in the `module/Application/test/Controller` folder.\n\
    \n> **Errors when testing Laminas MVC in PHP 7**\n> \n> Maybe you remember that\
    \ in *Chapter 2, Setting Up the Environment for Our E-Commerce Application*, we\
    \ showed PHP requirements for `laminas-mvc`. The `composer.json` file allows PHP\
    \ 7. However, if you run `IndexControllerTest` under PHP 7, there will be an error\
    \ for the `testIndexActionViewModelTemplateRenderedWithinLayout` test method.\
    \ In fact, the error occurs because the `$this->assertQuery` method depends on\
    \ union types, available only from PHP 8. You can replace `$this->assertQuery`\
    \ with other assertion methods and keep using `laminas-test` under PHP 7, but\
    \ it is better to upgrade PHP to version 8. But if you are required to use PHP\
    \ 7 for some reason, then remove the `testIndexActionViewModelTemplateRenderedWithinLayout`\
    \ method.\n\nNow that we have run the test, we will create a new module.\n\n#\
    \ # Creating the School module\n\nThe Laminas MVC application is organized as\
    \ a group of modules. A module in Laminas is the biggest unit of reuse. A module\
    \ is self-contained. It has its own configuration and its own MVC implementation.\
    \ To implement our school class registration with `laminas-mvc`, we will create\
    \ another module, named `School`. The Laminas modules are located in the `modules`\
    \ folder. There is a default module named `Application`. The `Application` module\
    \ contains the sample home page that you viewed in the previous chapter.\n\nWe\
    \ will use the `Application` module as the model for a new module:\n\n+   1. Copy\
    \ the `Application` folder in the `modules` folder as `School` in the same `modules`\
    \ folder."
  merge: -1
  img_proc: true
- pgno: 112
  md: "The namespace of a module in Laminas is the name of the module. So, the namespace\
    \ of the Application module is Application and, therefore, the namespace of the\
    \ School module must be School. We will change the namespace of each file as we\
    \ rebuild our implementation. Let's start with the minimal code for the module.\n\
    \n+   2. Register the module in the modules.config.php file.\n\nThe modules.config.php\
    \ file is in the config folder in the project root. This file contains the list\
    \ of enabled modules as a PHP array. Modules outside of this list are ignored,\
    \ as if they don't exist. This makes it easy to disable a module by removing it\
    \ from modules.config.php. You can see that Application is the last item. It is\
    \ not random. The last module is what imposes the layout. The layout is the arrangement\
    \ of visual elements. For a web application, the layout is defined with Cascade\
    \ Style Sheets (CSS). Our new module, School, does not have a layout, so it can't\
    \ be the last.\n\n+   3. Add School as an item before Application.\n\nA module\
    \ listed in modules.config.php will be searched for. But the modules will only\
    \ be found if they have autoloading configurations. You should remember that we\
    \ have configured autoloading via Eclipse for the school1 project. You can use\
    \ the same feature to configure composer.json of school3.\n\n+   4. Select the\
    \ Autoload tab in the Composer code editor. You will see that there is already\
    \ a PSR-4 configuration for the Application module. You must add a new autoloading\
    \ configuration with these parameters:\n\n+   * **Namespace:** `School\\\\\n+\
    \   * **Paths:** `module/School/src/`\n\nWe have to add a PSR-4 autoloading configuration\
    \ for test classes too.\n\n+   5. Select the Autoload-dev tab. Add a configuration\
    \ with these parameters:\n\n+   * **Namespace:** `SchoolTest\\\\\n+   * **Paths:**\
    \ `module/School/test/`\n\n+   6. Save the composer.json file and click on the\
    \ **Update dependencies (including require-dev)** button.\n\n> **Editing composer.json\
    \ directly**\n> \n> Every change we are making with specific forms can also be\
    \ made directly. You can click on the **composer.json** tab at the bottom of the\
    \ composer.json view. The editor will open the file as a text file. You can see\
    \ the changes made by other tabs and you can also make changes directly."
  merge: -1
  img_proc: true
- pgno: 113
  md: "Now the `School` module can be found. But it will not work yet. We must ensure\
    \ that each file inside the `School` module has the right namespace.\n\n# Ensuring\
    \ the module has the right namespace\n\nThe process of ensuring the module has\
    \ the right namespace involves certain steps. Let us start as follows:\n\n+  \
    \ 1. Create a test class. As we copied the `Application` module as a `School`\
    \ module, we have an `IndexControllerTest .php` file inside the `module/School/test/Controller`\
    \ folder. Delete this file and create a new file named `SchoolClassControllerTest\
    \ .php` in the same folder.\n\nThis new file must contain a `SchoolClassControllerTest`\
    \ class that extends `AbstractHttpControllerTestCase`, which is part of the `laminas-test`\
    \ component. It provides assertion methods to test the control layer of `laminas-mvc`.\
    \ This is something that we lacked in our previous projects. You should remember\
    \ that we tested the model classes, but the requests depended on our interaction\
    \ with the web browser. Now we can cover this part without using a web browser\
    \ or making HTTP requests manually.\n\nThe namespace of the `SchoolClassControllerTest`\
    \ class is `SchoolTest`, as we have configured in `composer.json`.\n\n+   2. Implement\
    \ a `setUp` method to load the application configuration:\n\n```\n```php\npublic\
    \ function setUp() : void\n{\n    $this->setApplicationConfig(\n        include\
    \ __DIR__ . '/../../../../config/\n        application.config.php'\n    );\n\n\
    \    parent::setUp();\n}\n```\n```\n\nThis `setUp` method creates an object that\
    \ acts as a container for the application. We will learn about it in detail in\
    \ the next chapter. For now, assume that you will have access to all resources\
    \ of the application that you need for testing."
  merge: -1
  img_proc: true
- pgno: 114
  md: "# # Implementing the test methods\n\nNow, we can start implementing the test\
    \ methods using the following steps:\n\n+   1. Create a method to test the school\
    \ classes listing, testListing:\n\n```\npublic function testListing() : void\n\
    {\n    $this->dispatch('/schoolclass', 'GET');\n    $this->assertResponseStatusCode(200);\n\
    \    $this->assertCommonRules();\n}\n```\n\nThe testListing method emulates an\
    \ HTTP request for endpoint/schoolclass and expects an HTTP response with the\
    \ status 200.\n\nRight, but what about the call for the $this->assertCommonRules\
    \ method? Well, we have advanced here. The fact is that the test methods of SchoolClassControllerTest\
    \ have common assertions because they make requests to the same controller class.\n\
    \n+   2. Instead of repeating the same lines, we encapsulate them into a private\
    \ method:\n\n```\nprivate function assertCommonRules() : void\n{\n    $this->assertModuleName('school');\n\
    \    $this->assertControllerName('schoolclass');\n    // as specified in router's\
    \ controller name alias\n    $this->assertControllerClass\n    ('SchoolClassController');\n\
    \    $this->assertMatchedRouteName('schoolclass');\n}\n```\n\nThe assertCommonRules\
    \ method has the following assertions:\n\n+   * $this->assertModuleName: Checks\
    \ the module - the argument value is converted following the CamelCase practice.\
    \ What does this mean? The value school will be converted to School, with the\
    \ first letter being in uppercase, which is the real module name.\n\n+   * $this->assertControllerName:\
    \ Checks the alias for the controller name – this will be seen ahead.\n\n+   *\
    \ $this->assertControllerClass: Checks the name of the controller class (without\
    \ the namespace).\n\n+   * $this->assertMatchedRouteName: Checks whether the pattern\
    \ of the URL request matched a configured route."
  merge: -1
  img_proc: true
- pgno: 115
  md: "+   3. The Laminas application skeleton, which we have used since _Chapter\
    \ 2, Setting Up the Environment for Our E-Commerce Application_, provides a template\
    \ file for PHPUnit, `phpunit.xml.dist`. Copy it to `phpunit.xml`. You can see\
    \ that the test suite is configured for running only the tests of the Application\
    \ module:\n\n```\n<testsuite name=\"Laminas MVC Skeleton Test Suite\">\n    <directory>./module/Application/test</directory>\n\
    </testsuite>\n```\n\n+   4. Change the preceding code snippet to run the tests\
    \ for any module:\n\n```\n<testsuite name=\"Laminas MVC Skeleton Test Suite\"\
    >\n    <directory>./module/*/test</directory>\n</testsuite>\n```\n\nGreat! We\
    \ can take the first step of TDD, the red step, when we have a test that fails.\n\
    \n# Running the tests\n\nFollow these steps to run the tests:\n\n+   1. Select\
    \ the `school3` project and click on the **Run As | PHPUnit Unit Test** item.\n\
    \nOf course, the test will fail because `SchoolClassController` doesn't exist.\n\
    \n+   2. Create `SchoolClassController` to manage the generation of the school\
    \ classes listing. The file of this class must be created in the module/`SchoolClass`/`src/Controller`\
    \ folder. In fact, all the classes of a module in Laminas stay in the `src` folder\
    \ and all the controller classes stay in the `src/Controller` folder. This class\
    \ needs two methods: a constructor in which we inject the Table Data Gateway and\
    \ a method for invoking the table data gateway:\n\n# SchoolClassController.php\n\
    \n```\n<?php\ndeclare(strict_types = 1);\nnamespace School\\Controller;\n\nuse\
    \ School\\Model\\SchoolClassTable;\nuse Laminas\\Mvc\\Controller\\AbstractActionController;\n\
    use Laminas\\View\\Model\\ViewModel;\n\nclass SchoolClassController extends\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "```\nAbstractActionController\n{\n    private ?SchoolClassTable $schoolClassTable\
    \ = null;\n\n    public function __construct(SchoolClassTable\n        $schoolClassTable)\n\
    \    {\n        $this->schoolClassTable = $schoolClassTable;\n    }\n\n    public\
    \ function indexAction()\n    {\n        $schoolClasses = $this->schoolClassTable->\n\
    \            getAll();\n        return new ViewModel([\n            'schoolClasses'\
    \ => $schoolClasses\n        ]);\n    }\n}\n```\n\nAs we can see, the constructor\
    \ method receives an instance of `SchoolClassTable` and assigns it to the `$this->schoolClassTable`\
    \ attribute. The `indexAction` method uses this attribute to get the list of school\
    \ classes and deliver it to the view layer through the `ViewModel` class.\n\n\
    If you don't need PHP 7 compatibility, you can locate the following:\n\n```\n\
    private ?SchoolClassTable $schoolClassTable = null;\n\npublic function __construct(SchoolClassTable\n\
    \    $schoolClassTable)\n{\n    $this->schoolClassTable = $schoolClassTable;\n\
    }\n```\n\nReplace it with this:\n\n```\npublic function __construct(private SchoolClassTable\n\
    \    $schoolClassTable)\n```"
  merge: -1
  img_proc: true
- pgno: 117
  md: "```\n{\n}\n```\n\nThis is possible from PHP 8.\n\n+   3. Create a Model folder.\
    \ Change the namespaces in the target to School\\\\Model.\n\nRight, but where\
    \ does the SchoolClassTable class come from? We already created it!\n\n+   4.\
    \ Copy all the files from the src folder of the school2 project to the modules/School/src/Model\
    \ folder.\n\nNow, most of the code for the model layer is ready. However, we need\
    \ to change some lines. Let's return to the controller class to understand this.\n\
    \nAs you saw in the last source code, the SchoolClassController class receives\
    \ an instance of SchoolClassTable. But who injects this instance? Not you, because\
    \ the controllers in an MVC Laminas application are not directly instantiated.\
    \ You need to use a factory class.\n\n+   5. Create a factory class named SchoolClassControllerFactory\
    \ in the src/Controller folder of the School module:\n\n# # SchoolClassControllerFactory.php\n\
    \n```\n```php\n<?php\nnamespace School\\\\Controller;\n\nuse Interop\\\\Container\\\
    \\ContainerInterface;\nuse Laminas\\\\ServiceManager\\\\Factory\\\\FactoryInterface;\n\
    \nclass SchoolClassControllerFactory implements\n    FactoryInterface\n{\n   \
    \ public function __invoke(ContainerInterface\n    $container, $requestedName,\
    \ ?array $options = null)\n    {\n        $schoolClassTable = $container->get\n\
    \            ('SchoolClassTable');\n\n        return new SchoolClassController\n\
    \            ($schoolClassTable);\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 118
  md: "The SchoolClassControllerFactory class uses a dependency injection container\
    \ to recover the instance of SchoolClassTable. In fact, the get method of the\
    \ $container object uses a key to locate the factory for SchoolClassTable. This\
    \ key takes us to a class named SchoolClassTableFactory.\n\n6. Create a SchoolClassTableFactory\
    \ class using the following source code:\n\n# # SchoolClassTableFactory.php\n\n\
    ```\n<?php\ndeclare(strict_types = 1);\nnamespace School\\Model;\n\nuse Laminas\\\
    Db\\TableGateway\\TableGateway;\nuse Laminas\\Db\\TableGateway\\TableGatewayInterface;\n\
    use Laminas\\Db\\ResultSet\\ResultSet;\nuse Laminas\\ServiceManager\\Factory\\\
    FactoryInterface;\nuse Interop\\Container\\ContainerInterface;\n\nclass SchoolClassTableFactory\
    \ implements FactoryInterface\n{\n    public function __invoke(ContainerInterface\n\
    \    $container, $requestedName, ?array $options = null)\n    {\n        $adapter\
    \ = $container->get('DbAdapter');\n        $resultSetPrototype = new ResultSet();\n\
    \        $resultSetPrototype->setArrayObjectPrototype(new\n        SchoolClass());\n\
    \        $tableGateway = new TableGateway('classes',\n        $adapter, null,\
    \ $resultSetPrototype);\n        return new SchoolClassTable($tableGateway);\n\
    \    }\n}\n```\n\nYou might say: “I already saw this somewhere else...” You are\
    \ right. This code is the content of the static getInstance method of SchoolClassTable.\
    \ Thus, SchoolClassTable doesn't need this method anymore because the responsibility\
    \ to create instances was given to the factory class."
  merge: -1
  img_proc: true
- pgno: 119
  md: "+   7. Remove the getInstance method of SchoolClassTable and change the constructor\
    \ of this class to public. This means that you will need to locate the following\
    \ line:\n\n```\nprivate function __construct (TableGatewayInterface\n$tableGateway)\n\
    ```\n\nReplace it with this line:\n\n```\npublic function __construct (TableGatewayInterface\n\
    $tableGateway)\n```\n\nThe controller factory class depends on a specific configuration\
    \ to find the data table gateway factory class.\n\nThe key used by the get method\
    \ of the $container object is an alias. This alias must be defined in a configuration\
    \ file. As we are using SchoolClassTable in the School module, we will define\
    \ this configuration in the module.config.php file of the School module. This\
    \ file is in the config folder of the module, which makes sense.\n\n+   8. Change\
    \ the namespace of module.config.php to School. This file is in fact a PHP array\
    \ with the module configuration. You will find a key named controllers, as follows:\n\
    \n```\n'controllers' => [\n    'factories' => [\n        Controller\\IndexController::class\
    \ =>\n            InvokableFactory::class,\n    ],\n],\n```\n\nThis code snippet\
    \ shows that the IndexController class is associated with the InvokableFactory\
    \ class. InvokableFactory is a controller factory provided by laminas-mvc. This\
    \ basic factory creates an instance of the associated class without dependency\
    \ injection. We don't use IndexController.\n\n+   9. Remove the IndexController.php\
    \ file from the src/Controller folder. The previous code snippet must be changed,\
    \ as follows:\n\n```\n'controllers' => [\n    'aliases' => [\n        'schoolclass'\
    \ => Controller\\\n            SchoolClassController::class\n    ],\n    'factories'\
    \ => [\n        Controller\\SchoolClassController::class =>\n```"
  merge: -1
  img_proc: true
- pgno: 120
  md: "```\nController\\SchoolClassControllerFactory::class\n],\n],\n```\n\nYes, besides\
    \ changing the association in factories, we have also added key aliases associating\
    \ the \"schoolclass\" string with SchoolClassController. What does the association\
    \ do? It helps in decoupling the route from the real controller names.\n\n+  \
    \ 10. Change the routes key, inside the router key. Delete the current value of\
    \ router and replace it with the following:\n\n```\n'routes' => [\n    'schoolclass'\
    \ => [\n        'type' => Segment::class,\n        'options' => [\n          \
    \  'route' => '/schoolclass[/:action'\n            [/:code]]',\n            'defaults'\
    \ => [\n                'controller' => 'schoolclass',\n                'action'\
    \ => 'index',\n            ],\n        ],\n    ],\n],\n],\n],\n```\n\nA route\
    \ is an association between a URL pattern and a controller class. There are several\
    \ route types available in the laminas-router component. In this case, we are\
    \ using a Segment route that allows parameters. In the '/schoolclass[/:action[/:code]]'\
    \ pattern, the part between brackets is optional and the word after the colon\
    \ is a param. The defaults key defines assumed values for omitted params. See\
    \ that we defined default values for controller and action. The value of the controller\
    \ key is the alias for SchoolClassController.\n\nYou may have forgotten, but the\
    \ value of an alias is the value passed in the $this->assertControllerName method\
    \ of SchoolClassControllerTest. In fact, you can use the alias or the complete\
    \ name of the class.\n\nCan we run the test case successfully now? Well, the test\
    \ will still fail because we need to configure the alias for SchoolClassTable."
  merge: -1
  img_proc: true
- pgno: 121
  md: "11. Configure the alias by adding the service_manager key to the array of module.config.php.\
    \ This key is at the first level of the following array:\n\n```\n'service_manager'\
    \ => [\n    'factories' => [\n        'SchoolClassTable' => Model \\\n       \
    \     SchoolClassTableFactory::class\n    ]\n],\n```\n\nThe dependency injection\
    \ container will use the keys defined inside factories to call the factories declared\
    \ as values.\n\nNow can we run the test? No.\n\n12. Change the namespace of the\
    \ Module class in the School/src folder to School. The Module class loads the\
    \ module.config.php file, so if it is not found, the module configuration is ignored.\n\
    \nAfter this change, we can run the test, right? No, because we need to configure\
    \ the database connection. Keep calm and configure. We will keep using the school\
    \ database, the same database used for the school11 and school12 projects.\n\n\
    13. Install laminas-db. Fortunately, you know how to do it. But this time, as\
    \ you are installing laminas-db inside a project with laminas-mvc, you will see\
    \ on the Console tab the following prompt:\n\n```\nPlease select which config\
    \ file you wish to inject\n'Laminas\\Db' into:\n[0] Do not inject\n[1] config/modules.config.php\n\
    [2] config/development.config.php.dist\nMake your selection (default is 1)\n```\n\
    \nThis allows you to inject (or not) laminas-db as a module for the application.\
    \ As we have mentioned before, a module in Laminas is the biggest unit of reuse.\
    \ You can inject a component only for development (option 2). But we will inject\
    \ laminas-db as a component for production, so choose option 1.\n\n14. Composer\
    \ will next ask the following:\n\n```\nRemember this option for other packages\
    \ of the same type?\n(Y/n)\n```"
  merge: -1
  img_proc: true
- pgno: 122
  md: "Answer Y, so you avoid the previous prompt for the next Laminas components\
    \ to be installed.\nRemember that laminas-db needs connection parameters. According\
    \ to Laminas' best\npractices, we must separate the global configuration (valid\
    \ for any environment) from the local\nconfiguration (valid for a specific environment).\n\
    \n+   15. Place the global configuration in the global.php file in the config/autoload\
    \ folder\n+   in the project root. The content for the school project must be\
    \ as follows:\n\n# global.php\n\n```\n<?php\n\nuse Laminas\\Db\\Adapter\\AdapterServiceFactory;\n\
    return [\n    'db' => [\n        'driver' => 'Pdo_Mysql',\n        'database'\
    \ => 'school'\n    ],\n    'service_manager' => [\n        'factories' => [\n\
    \            'DbAdapter' => AdapterServiceFactory::class\n        ]\n    ]\n];\n\
    ```\n\nThe difference between the database configuration and previous projects\
    \ is the use of\nAdapterServiceFactory, nicknamed DbAdapter. This class uses the\
    \ data of the\ndb key to create an instance of our old friend: the Adapter class.\
    \ Right, but what about the\nother parameters? Well, the other parameters can\
    \ be different depending on the environment.\nSo, we must put them into the local.php\
    \ file. While global.php is the same for all the\nenvironments, there is a different\
    \ local.php for each environment. Because of this, the\nlocal.php file must not\
    \ be part of the control version. The skeleton brings a template named\nlocal.php.dist."
  merge: -1
  img_proc: true
- pgno: 123
  md: "16. Copy `local.php.dist` from the `config/autoload` folder to `local.php`\
    \ in the same folder and fill it with this code:\n\n# local.php\n\n```\n<?php\n\
    return [\n    'db' => [\n        'hostname' => 'localhost',\n        'username'\
    \ => 'root',\n        'password' => ''\n    ]\n];\n```\n\nWe have all the necessary\
    \ data. You must be excited to see whether the test runs successfully now.\n\n\
    17. Run the test:\n\n```\n1) SchoolTest\\\\Controller\\\\SchoolClassControllerTest::testListing\n\
    Failed asserting response code \"200\", actual status code is \"500\"\n\nExceptions\
    \ raised:\nException 'Laminas\\\\View\\\\Exception\\\\RuntimeException' with message\
    \ 'Laminas\\\\View\\\\Renderer\\\\PhpRenderer::render: Unable to render template\
    \ \"school/school-class/index\"; resolver could not resolve to a file' in /opt/lampp/htdocs/school3/vendor/laminas/laminas-view/src/Renderer/PhpRenderer.php:492\n\
    ```\n\nWhen you run, you receive the preceding error message. This message occurs\
    \ because there is no view for the controller action.\n\nObserve that the error\
    \ message says clearly that the application expects a `school/school-class/index`\
