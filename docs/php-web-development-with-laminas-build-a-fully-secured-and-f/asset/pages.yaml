- pgno: 104
  md: "The save method delegates the hard work to the insert and update methods of\
    \ TableGateway. The logic is the same as in the former SchoolClass class of the\
    \ school1 project: the choice between an insert and an update depends on the value\
    \ of the primary key generated by the table. Observe that the name of the primary\
    \ key field is given by the $this->keyName attribute. This attribute must be declared\
    \ by the AbstractTable class, as follows:\n\n```\nprotected string $keyName;\n\
    ```\n\n+   9. The SchoolClassTest test case won't run yet because we have to implement\
    \ the delete method in the AbstractTable class:\n\n```\npublic function delete($value)\
    \ : bool\n{\n    try {\n        $this->tableGateway->delete([\n            $this->keyName\
    \ => $value\n        ]);\n    } catch (\\Exception $e) {\n        error_log($e->getMessage());\n\
    \        return false;\n    }\n    return true;\n}\n```\n\nNow will the SchoolClassTest\
    \ test case run successfully? Not yet.\n\n+   10. You have to create the SchoolClass\
