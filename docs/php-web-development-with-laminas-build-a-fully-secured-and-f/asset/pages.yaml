    # # Isolating identity management for each module


    In Chapter 9, Event-Driven Authentication, we learned how to implement an authentication
    control for employees in the Inventory module. In Chapter 11, Implementing a Product
    Basket, we learned how to implement an authentication control for customers in
    the Store module. So, the whatstore application has two authentication controls,
    both of them using the laminas-authenticate component.


    The authentication control is based on events. Specifically, it is based on the
    Laminas EVENT_ROUTE event. The identity check is done through listener classes,
    specifically InventoryAuthenticationListener in the Inventory module and StoreAuthenticationListener
    in the Store module. Both of these two classes check identity with the same lines
    of code:


    ```

    ```php

    $authenticationService = new AuthenticationService();

    if (!$authenticationService->hasIdentity()) {

    ```

    ```


    In fact, InventoryAuthenticationListener does not have these lines so instead
    calls the IdentityManager->hasIdentity method, which does have them. However,
    ultimately, both of the listener classes use the same lines of code to check the
    authentication state.'
