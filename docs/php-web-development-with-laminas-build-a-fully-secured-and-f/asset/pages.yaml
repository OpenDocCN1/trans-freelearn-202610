    It''s ready. You can now run the tests successfully. Congratulations! You have
    now implemented authentication in the Inventory module! You may have thought it
    was more difficult, but now you can see that it is not complicated.


    Well, we could stop here, but there is an appropriate change to make in the index.php
    file before ending the discussion about authentication. In the next section, we
    will learn how to transfer the responsibility for listening to the EVENT_ROUTE
    event from index.php to the Inventory module.


    # # Delegating the authentication listener to a module


    In the previous section, you learned that it is possible to call other methods
    from the Application instance besides the run method. Before inverting the application
    control from your code to Laminas, it is possible to modify the behavior through
    the Application class.


    However, the index.php file, where Application is instantiated, is not the appropriate
    place to modify every application behavior. In an object-oriented application,
    we need to delegate each action to an appropriately class. When we attach an event
    listener in index.php, we are delegating the responsibility to manage events to
    this file. The question is whether index.php should be responsible for this.


    Think about it – who is responsible for ensuring that the Inventory module has
    authentication control? Maybe this question could be not the best. Let us ask
    another – is authentication control always required for the Inventory module?
    Yes! Access will always be restricted. So, it seems appropriate that the Inventory
    module takes care of all its own authentication control. If this module is reused
    in another project, listening for authentication control will already be embedded.


    Right, how can we transfer the responsibility to attach the event listener for
    authentication from index.php to the Inventory module? The first step is rolling
    back the change in index.php. This means that the following lines should be replaced:


    ```

    $app = Application::init($appConfig);

    $app->getEventManager()->attach(MvcEvent::EVENT_ROUTE,

    [InventoryAuthenticationListener::class, ''verifyIdentity'']);

    $app->run();

    ```'
