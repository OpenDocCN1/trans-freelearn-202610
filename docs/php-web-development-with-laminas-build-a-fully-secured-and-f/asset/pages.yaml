- pgno: 55
  md: '# Using Laminas as a Library with Test-Driven Development


    The next two chapters will prepare you to use Laminas. The preparation consists
    of three stages to allow you to gradually adapt to writing code in Laminas. In
    this chapter, we will go through the first stage, which we will explain using
    a simple example based on a reduced use case, showing it is possible to only use
    one Laminas component in an existing PHP application. We will initially use the
    `laminas-db` component to abstract a database connection. In the next chapter,
    we will go through the other two stages.


    You could hypothetically jump from the previous chapter to *Chapter 5, Creating
    the Virtual Store Project*, but it would be as though someone gave you a lightsaber
    without any training and told you to face Darth Vader in your first mission. Instead,
    let us keep calm and prepare ourselves properly for battle.


    In this chapter, we''ll be covering the following topics:


    +   - Understanding the software requirements

    +   - Developing our use case with TDD

    +   - Generating code coverage reports


    # Technical requirements


    To implement the example in this chapter, the following items are required:


    +   - XAMPP 8 or higher

    +   - Eclipse for PHP Developers 2021-12 or higher

    +   - The school database created in the previous chapter


    The installation or creation of all of these items is explained in *Chapter 2,
    Setting Up the Environment for Our E-Commerce Application*.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'The example in this chapter was originally developed on a computer with 7.6
    GB RAM, 1.0 TB disk space, and a CPU with 4 cores of 2.50 GHz.


    The code generated for this chapter is fully available at https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter03.


    # Understanding the requirements for developing our software


    We need the right requirements for developing the software – if we have the wrong
    requirements, we will produce the wrong software. It does not matter if we have
    a fantastic framework, a spectacular IDE, or an amazing continuous integration
    environment. If we have good tools, but the wrong requirements, we will only deliver
    the wrong software faster.


    > Very important note

    > A framework won''t fix errors in your requirements.


    Without further ado, let''s get to our requirements. Imagine you are working on
    a system for school administration. More precisely, you have been charged with
    developing the subsystems for managing classes and students. As you will notice,
    there are several details in common between these groups of school elements. We
    are highlighting the similarities because this is convenient as we work with code
    reuse.


    Imagine that a careful requirement determination was conducted and you have received
    the following use case for implementing the registration of classes first.


    # Use case – managing school classes


    The common preconditions for the flows of this use case are the existence of a
    database named school, which has a table named classes, and a valid connection
    between the application and the database. The common exception is an SQL error.
    Here is the list of flows we will need for our use case:


    +   - Listing flow (basic)

    +     - Description: A user requests a list of classes

    +   - Inserting flow (alternative)

    +     - Description: A user inserts a new class

    +     - Postcondition: To find a record in the table with the input data

    +   - Updating flow (alternative)

    +     - Description: A user updates an existing class'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   • Postcondition: To find the changes in the record


    +   • Deleting flow (alternative)


    +   • Description: A user deletes an existing class


    +   • Postcondition: Not to find the record anymore


    Now that you know about the flows we will need for our use case, let us start
    implementing a structure for this use case.


    # Implementing a structure for the use case


    Now that we have our requirements, let’s create a PHP project named school1 using
    the following steps:


    +   1. In Eclipse, access File | New | PHP Project.


    +   2. In the New PHP Project window (see Figure 3.1), type school1 and click
    Finish:


    ![](img/e6cf5550804ccae9d1859270da8688f5_57_0.png)


    Figure 3.1 – Creating the school1 project'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'After that, you will see a node named school1 in the Project Explorer view,
    as we can see in Figure 3.2:


    ![](img/e6cf5550804ccae9d1859270da8688f5_58_0.png)


    Figure 3.2 – The school1 project in the Project Explorer view


    Did you think that something was wrong because the PHP version displayed on the
    right-hand side of the subnode, PHP Language Library, is lower than the installed
    version? It seems strange because you have configured the PHP interpreter before.
    However, if you access the Window | Preferences menu and select the PHP | Installed
    PHPs item, you will see the right version of PHP, as shown in Figure 3.3:


    ![](img/e6cf5550804ccae9d1859270da8688f5_58_1.png)


    Figure 3.3 – The configured PHP interpreter in Eclipse


    Well, there is nothing wrong. The version that appears in the Project Explorer
    view is the version of the syntax and token validation for PHP. This means the
    Eclipse code editor for PHP will validate the elements defined until that version.
    If you are upset because you want to use the latest features immediately, I ask
    you to be calm. You can use the latest features without any problems because only
    what the interpreter understands matters. For example, PHP 8 has named arguments
    for functions but PHP 7 does not. If you use named arguments in a PHP file, the
    Eclipse code editor PHP (prepared for PHP 7.4) will highlight the named argument
    as an error. However, if you are using a PHP 8 interpreter, the code will run
    successfully. In other words, ignore error messages about features exclusive to
    PHP 8. They are false alerts that will disappear in the next release of Eclipse.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'More important than the warning about static code is to have tests for running
    code. Yes, we will create tests. For a while, we will write tests after writing
    some implementation – something not so good. Why is this not good? If you implement
    something before creating a test for it, you may neglect the tests. But if you
    create the test first, you ensure that something checks whether your code works.
    It is for this reason that we will create the tests before the complete implementation,
    in the next section, according to the guidelines of test-driven development (TDD).


    Please see the architecture draft constructed using a Unified Modeling Language
    (UML) component diagram here (in Figure 3.4) for the use case of registering the
    classes. This is the only use case we will implement in the school1 project:


    ![](img/e6cf5550804ccae9d1859270da8688f5_59_0.png)


    Figure 3.4 - A UML component diagram for the files of the school1project


    As you can see in Figure 3.4, we planned the registration of the school classes
    as a set of seven PHP files. The purposes of these files are as follows:


    +   - `index.php`: Refers to the homepage, the starting point for the actions

    +   - `list.php`: Shows the list of classes with hyperlinks for `insert`, `update`,
    and `delete` classes

    +   - `edit.php`: Shows a form to insert or update a class

    +   - `form.php`: Defines the form for `edit.php`

    +   - `save.php`: Inserts or updates a class into a database

    +   - `delete.php`: Removes a class from a database'
  merge: -1
  img_proc: true
