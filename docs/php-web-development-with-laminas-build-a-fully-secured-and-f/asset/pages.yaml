  md: "The second difference is the following line:\n\n```\n$this->auth->getStorage()->write($this->adapter->getResultRowObject(null,'password'));\n\
    ```\n\nThis instruction writes the user object (without the password) to the authentication\
    \ session. It is necessary because we intend to later revalidate the permission\
    \ data, so we need to store the user's primary key and not only the credential.\
    \ This change will require some adjustments where identity is used, but only a\
    \ few.\n\nSimilar to the previous method, the IdentityManager class will have\
    \ a logout method, which will encapsulate most of the code from IndexController->logoutAction:\n\
    \n```\npublic function logout() : void\n{\n    $this->auth->clearIdentity();\n\
    \    $session = new SessionManager();\n    try {\n        $session->destroy();\n\
    \    } catch (\\Exception $e) {\n        error_log($e->getMessage());\n    }\n\
    }\n```\n\nThe IdentityManager class will encapsulate the IndexController->loadAuthorizationData\
    \ method too. You can see a little difference in the recovery of the employee's\
    \ primary key employeee:\n\n```\npublic function loadAuthorizationData() : void\n\
    {\n    $role = new Role($this->auth->getIdentity()->name);\n    $row = $this->auth->getStorage()->read();\n\
    \    $resources = $this->resourceTable->\n        getResourcesFromAnEmployee($row->ID);\n\
    \    foreach($resources as $resource) {\n        $role->addPermission($resource->name\
    \ . ':' .\n            $resource->method);\n    }\n    $rbac = new Rbac();\n}\n\
    ```"
