  md: "We have made the following changes in the `loginAction` method:\n\n+   * We\
    \ have passed in the `$nickname` variable to the `setIdentity` method of the `$adapter`\
    \ attribute.\n+   * We have passed in the `$password` variable to the `setCredential`\
    \ method of the `$this->adapter` attribute.\n+   * We have instantiated the `Laminas\\\
    Authentication\\AuthenticationService` class.\n+   * We have passed in the `$this->adapter`\
    \ attribute to the `setAdapter` method of the `Laminas\\Authentication\\AuthenticationService`\
    \ instance.\n+   * We have invoked the `authenticate` method from the `Laminas\\\
    Authentication\\AuthenticationService` instance, and we have assigned the returned\
    \ value to the `$result` variable.\n+   * We have checked whether the `isValid`\
    \ method of the `$result` object is true. If it is true, we send a message to\
    \ the log and change the state of `$logged` to true.\n+   * If `$result` is false,\
    \ we send each generated error message to the log.\n\nWait! Where does `$this->adapter`\
    \ attribute come from? Good question. We need to declare this attribute like so:\n\
    \n```\nprivate ?AdapterInterface $adapter;\n```\n\nThis `$adapter` attribute is\
    \ `Laminas\\Authentication\\Adapter\\AdapterInterface`.\n\n**Important note –\
    \ namespaces**\n\nWe already have used `AdapterInterface` for database, but it\
    \ was from another namespace. Remember that there can be several classes with\
    \ the same name for different namespaces. **Adapter** is a design pattern, and\
    \ it can be applied to several classes. So, we have more than an Adapter class\
    \ available in Laminas.\n\nOkay, we need to assign the `$adapter` attribute to\
    \ an instance that implements `Laminas\\Authentication\\Adapter\\AdapterInterface`.\
    \ We will do this in the constructor method:\n\n```\npublic function __construct(AdapterInterface\
    \ $adapter)\n{\n    $this->adapter = $adapter;\n}\n```"
