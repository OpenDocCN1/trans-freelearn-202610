- pgno: 241
  md: "Everything could be right if we instantiated the controllers directly, but\
    \ we don't instantiate controllers in Laminas. Laminas instantiates controllers\
    \ for us through factories, which we talked about in *Chapter 1, Introducing Laminas\
    \ for PHP Applications*. It is like the famous phrase of failed Hollywood auditions:\
    \ *don't call us, we'll call you*. Therefore, we must create a factory class named\
    \ `IndexControllerFactory` with this source code:\n\n```\n<?php\nnamespace Inventory\\\
    Controller;\n\nuse Laminas\\ServiceManager\\Factory\\FactoryInterface;\nuse Interop\\\
    Container\\ContainerInterface;\nuse Laminas\\Authentication\\Adapter\\DbTable\\\
    \\\nCredentialTreatmentAdapter;\n\nclass IndexControllerFactory implements FactoryInterface\n\
    {\n    public function __invoke(ContainerInterface $container,\n    $requestedName,\
    \ array $options = null)\n    {\n    $employeeTable = $container->get('EmployeeTable');\n\
    \    $adapter = new CredentialTreatmentAdapter\n    ($container->get('DbAdapter'));\n\
    \    $adapter->setTableName('employees');\n    $adapter->setIdentityColumn('nickname');\n\
    \    $adapter->setCredentialColumn('password');\n\n    return new IndexController($adapter);\n\
    \    }\n}\n```\n\nThis factory class instantiates the `CredentialTreatmentAdapter`\
    \ class. The `CredentialTreatmentAdapter` class allows us to authenticate users\
    \ with a database table. It requires an injection of a database adapter, since\
    \ it is necessary to access a table. Once the table name, identity column (user\
    \ name), and credential column (user password) are configured, the `IndexControllerFactory`\
    \ class injects a `CredentialTreatmentAdapter` instance into the `IndexController`\
    \ instance."
  merge: -1
  img_proc: true
