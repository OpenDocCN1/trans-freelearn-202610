  md: "![](img/e6cf5550804ccae9d1859270da8688f5_367_0.png)\n\n# Figure 13.10 – Alternative\
    \ layout\n\nAs you can observe, the header color and content are different, as\
    \ well as the body background color. This layout change is made by the `IndexController->changeLayoutAction`\
    \ method, which calls the `setTemplate` method of the layout controller plugin:\n\
    \n```\n```php\npublic function changeLayoutAction()\n{\n    $this->layout()->setTemplate('/layout/otherlayout');\n\
    \    return new ViewModel();\n}\n```\n```\n\nThe `setTemplate` method changes\
    \ the layout only for the current action. If you click on the home page link and\
    \ navigate to other pages, you will see that the default layout is still used.\n\
    \nThe `setTemplate` method searches for the layout file from the `view` folder.\
    \ The file extension is `.phtml`, but you don't need to put the extension when\
    \ calling the method.\n\nYou can also disable the layout for a controller action.\
    \ We saw how to do this in _Chapter 12, Reviewing and Improving Our App_, when\
    \ we created the API page. The layout is disabled from the `ViewModel` class,\
    \ with the `setTerminal` method receiving `true`, as follows:\n\n```\n```php\n\
    $view = new ViewModel();\n$view->setTerminal(true);\n```\n```\n\nSo, you have\
    \ complete control over the application layout.\n\nIn the next section, we will\
    \ learn some useful things about Laminas for the controller layer."
