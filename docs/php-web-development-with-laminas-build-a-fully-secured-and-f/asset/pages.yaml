- pgno: 226
  md: 'This change is enough to ensure the application of filters. You can now insert
    or update a discount, and you will see that the name will be listed with capital
    letters, as you can see in Figure 8.2:


    ![](img/e6cf5550804ccae9d1859270da8688f5_226_0.png)


    Figure 8.2: Effect of the StringToUpper filter


    In the next section, we will learn how to validate input values using laminas-validator.


    # Validating input data


    Filters transform data, but they are not enough to ensure that data is appropriate
    for our system. Filters just perform an action. To know whether data has appropriate
    values, we need a component that answers the question does the data comply with
    the business rule?


    Laminas has a component for this: laminas-validator. As we’ve already said, laminas-validator
    is a dependency of laminas-inputfilter. Because of this, you don’t need to install
    laminas-validator if you already have installed laminas-inputfilter.


    We said that validation depends on business rules. Imagine your client told you
    when they were asked about the requirements that discount names must have a minimum
    of three characters. We have a filter to change alphabetic characters to capital
    letters and another filter to remove characters that are not alphabetic or numeric
    or whitespaces. However, these filters do not ensure that the final name has at
    least three characters.


    We need to create a validation rule for the name field. Let us modify the part
    of the Discount->getInputFilter method that handles the name field:


    ```

    $input = new Input(''name'') ;

    $filterChain = new FilterChain() ;

    $filterChain->attach(new StringToUpper())

    ->attach(new Alnum(true)) ;

    $input->setFilterChain($filterChain) ;

    ```'
