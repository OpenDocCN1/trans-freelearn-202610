    \ to this frame in the following subsection.\n\n# Detecting AJAX requests\n\n\
    The Asynchronous request and Synchronous request buttons make HTTP requests to\
    \ the same controller action, the IndexController->ajaxAction method:\n\n```\n\
    public function ajaxAction()\n{\n    if ($this->getRequest()->isXmlHttpRequest())\
    \ {\n        return new JsonModel();\n    }\n    return new ViewModel();\n}\n\
    ```"
