    > > **Important note: Validator classes**

    > >

    > > There are more available validators than standard validators. You can find
    a complete list of available Lamina validators at https://docs.laminas.dev/laminas-validator.

    > > In addition, you can create your own filter classes, extending Laminas\\Validator\\AbstractValidator.
    We will learn how to create customized filters in *Chapter 13, Tips and Tricks*.


    So, we have now finished this chapter, after modifying the generation of the HTML
    form and adding filters and a validator for our discount registration.


    # ## Summary


    In this chapter, we have learned about some Lamina components related to data
    input. First, we learned how to define HTML forms programmatically using laminas-form
    and how to render such forms in .phtml files. We defined an HTML form for discount
    registration, taking the example of laminas-form.


    Next, we learned how to filter values from requests with laminas-filter. We applied
    filters to discount fields, restricting, for example, the discount names to being
    alphanumeric with whitespaces.


    Finally, we learned how to validate values from requests with laminas-validator.
    We applied a validator to the name field, avoiding saving names shorter than three
    characters.


    Filtering and validating are aspects related to application security. A lack of
    control over data input can allow unwanted and sometimes dangerous content. Imagine
    a part of an input that is used as a parameter of a command invoked by an application.
    If anything at all is allowed, you don''t know what might be executed by your
    application.


    In the next chapter, we will talk about other aspects of security, that is, authentication
    and authorization.'
