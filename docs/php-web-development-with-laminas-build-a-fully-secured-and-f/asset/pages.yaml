    generalization of the model layer.


    # Creating a generic model and a generic mapper


    We have actually already created a generic model (the `AbstractModel` class) and
    a generic mapper (the `AbstractTable` class). We have used these generalizations
    in this chapter, respectively, as the superclass of `Product` and the superclass
    of `ProductTable`. Really, it seems that the generic model and generic mapper
    are ready now. But these generalizations are not in the appropriate place. If
    you look, the `AbstractModel` and `AbstractTable` classes are in the `Inventory`
    module. The problem is that the `Inventory` module is not the only module to have
    models. We also have the `Store` module. We will use the generic model and mapper
    in both of the modules. For this, we will extract the generic model and mapper
    to a `Generic` module. Follow these steps:


    +   1. Copy the `Application` module to `Generic`. This means copying the `Application`
    folder to the `Generic` folder.

    +   2. Remove the `config`, `test`, and `view` folders from the `Generic` module.

    +   3. Remove the `IndexController.php` file from the `module/Generic/src/Controller`
    folder. This file was copied from the `Application` module, but it is not necessary
    for the `Generic` module.

    +   4. Change the namespace of the `Module` class in the `src` folder to `Generic`
    and remove the `getConfig` method from this class.


    The `Generic` module will work as a library for the other modules. We will put
    any abstract class or interface shared by more than one module of our application
    into the `Generic` module.


