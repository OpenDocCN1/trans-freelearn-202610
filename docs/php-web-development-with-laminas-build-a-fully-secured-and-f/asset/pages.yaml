- pgno: 234
  md: 'The first part of the layout file to be modified is the title definition. We
    define the title directly with the TITLE tag, but Lamina has a view helper for
    this. You must modify the call for `$this->headTitle` for it to look like this:


    ```

    <?= $this->headTitle(''Whatstore'')->setSeparator('' - '')->

    setAutoEscape(false) ?>

    ```


    You may ask, “Why do I need to use a method only to write text that won’t change?”
    In fact, when you use the $this->headTitle method for generating the TITLE tag
    instead of writing it directly, you allow the view scripts to easily modify the
    title.


    Another part to be modified is the A tag, with a class attribute equal to navbar-brand.
    This is the tag that shows the Laminas logo and the MVC Skeleton text. The new
    content for this tag is the following:


    ```

    <a class="navbar-brand" href="<?= $this->url(''home'') ?>">

    Whatstore

    </a>

    ```


    The last part of the layout file to be modified is the FOOTER tag. The new content
    for this tag is the following:


    ```

    <footer>

    <p>

    &copy; <?= date(''Y'') ?>

    Powered by Sheat Software

    </p>

    </footer>

    ```


