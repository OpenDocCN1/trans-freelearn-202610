- pgno: 107
  md: "The edit.php file submits the data to save.php, like its counterpart in the\
    \ school1 project. The save.php file makes the persistence with two classes, SchoolClass\
    \ and SchoolClassTable. The first class has the data and the second class has\
    \ the operations.\n\nThe save.php file will look like this:\n\n# save.php\n\n\
    ```\n<?php\nuse School\\\\SchoolClass;\nuse School\\\\SchoolClassTable;\nrequire\
    \ realpath(__DIR__ . '/../../../vendor' .\n    '/autoload.php');\n$code = (int)\
    \ ($_POST['code'] ?? 0);\n$name = ($_POST['name'] ?? '');\n$model = new SchoolClass($code,$name);\n\
    $schoolClassTable = SchoolClassTable::getInstance();\n$schoolClassTable->save($model);\n\
    header('Location: /view/schoolclass/index.php');\n```\n\nObjects must help us\
    \ as developers. They are tools, not commandments. When it is helpful to use an\
    \ object, use it. But if there is no reason to use an object, avoid it. Following\
    \ this guideline, we don’t need to create an object to remove a school class record.\n\
    \nIt is enough to pass the code, as we can see in the delete.php file:\n\n# delete.php\n\
    \n```\n<?php\nuse School\\\\SchoolClassTable;\nrequire realpath(__DIR__ . '/../../../vendor'\
    \ .\n    '/autoload.php');\n$code = ($_GET['code'] ?? null);\n$schoolClassTable\
    \ = SchoolClassTable::getInstance();\n$schoolClassTable->delete($code);\nheader('Location:\
    \ /view/schoolclass/index.php');\n```\n\nNow, you can manage school classes through\
    \ the web interface of school12. But we promised that this project would also\
    \ implement student registration. The implementation of both registrations (school\
    \ classes and students) is similar, so we will only show the parts that are different."
