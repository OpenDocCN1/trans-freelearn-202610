- pgno: 231
  md: '# # Event-Driven Authentication


    This chapter covers one of the essential topics for developing secure applications
    – authentication. Authentication is an identity check. An example of authentication
    in the physical world is the request for an identity document to get into a building.


    In this chapter, you will learn how to implement this checking process with event-oriented
    programming. We will first create tests for login and logout actions, and then
    we will create these actions. After that, we will implement user authentication
    for the Inventory module. For this, we will create an employee registration. Finally,
    we will implement a user identity check based on events.


    In this chapter, we’ll be covering the following topics:


    +   * Creating login and logout actions for the Inventory module

    +   * Implementing user authentication for the Inventory module

    +   * Creating employee registration

    +   * Verifying the identity of users based on events


    At the end of this chapter, you will be able to control who can access restricted
    areas of a web application.


    Let us first start creating a login page in the Inventory module and the related
    controller action.


    # ## Technical requirements


    All the code related to this chapter can be found at https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter09/whatstore.'
  merge: -1
  img_proc: true
- pgno: 232
  md: "# Creating login and logout actions for the Inventory module\n\nContinuing\
    \ our test-driven development (TDD) approach, in this section, we will first create\
    \ tests for login and logout actions, and then we will create form and controller\
    \ classes and view scripts to be tested.\n\n# Creating tests for login and logout\
    \ actions\n\nAs we have learned, when we create tests, we are writing requirements\
    \ as source code. Tests say what we are expecting classes to do. Now, we will\
    \ add two test methods in the IndexControllerTest class of the Inventory module\
    \ – one method for testing the login action and another method for testing the\
    \ logout action. The source code of the login test method looks like this:\n\n\
    ```\n```php\npublic function testLoginActionCanBeAccessed() : void\n{\n    $_POST\
    \ = [\n        'nickname' => 'John Jonz',\n        'password' => 'hronmeer'\n\
    \    ];\n    $this->dispatch('/inventory/index/login', 'POST',\n        $_POST);\n\
    \    $this->assertResponseStatusCode(302);\n    $this->assertModuleName('inventory');\n\
    \    $this->assertControllerName('index');\n    // as specified in router's controller\
    \ name alias\n    $this->assertControllerClass('IndexController');\n    $this->assertMatchedRouteName('inventory');\n\
    }\n```\n```\n\nThe source code of the logout test method looks like this:\n\n\
    ```\n```php\npublic function testLogoutActionCanBeAccessed() : void\n{\n    $this->dispatch('/inventory/index/logout',\
    \ 'GET');\n    $this->assertResponseStatusCode(200);\n    $this->assertModuleName('inventory');\n\
    \    $this->assertControllerName('index');\n```\n```"
