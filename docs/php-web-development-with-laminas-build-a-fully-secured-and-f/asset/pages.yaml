    \ into the authentication process encapsulated by IdentityManager->login. The\
    \ first difference is the use of an injected method to encrypt the credential.\
    \ This change makes this class more flexible because there is no coupling with\
    \ the Employee class. It is easier to modify the encryption method without writing\
