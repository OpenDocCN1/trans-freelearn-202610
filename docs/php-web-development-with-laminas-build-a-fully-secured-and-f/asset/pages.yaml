    # # Creating a product search box


    The current whatstore home page lists all registered products, but the customer
    who visits this page would be searching for a specific product. Hence, it is necessary
    to have a search engine on the page. We could implement this feature because we
    can see that it is a good feature, but in fact, we will implement it because it
    is a requirement of our customer. It is the second requirement mentioned in Chapter
    5, Creating the Virtual Store Project – the home page of the customer area must
    allow them to search for products by name, completely or partially.


    Let us insert an HTML form in an index.phtml file in the module/Store/view/store/index
    folder. The HTML form will be inside the HTML table that will show the links for
    the product basket and login, as we can see in the following snippet:


    ```

    <h1>Our products</h1>

    <table style="width: 100%">

    <tbody>

    <tr>

    <td><a href="<?=$this->url(''store'', [''controller'' =>

    ''productbasket'']) ?>">Product Basket</a></td>

    <td>

    <form method="post" action="<?=$this->url(''store'') ?>">

    <input type="text" name="name"/>

    <input type="submit" value="search"/>

    </form>

    </td>

    <td><a href="<?=$this->url(''store'', [''controller'' =>

    ''customer'', ''action'' => $link[''action'']]) ?>"

    <?=$link[''label''] ?></a></td>

    </tr>

    </tbody>

    </table>

    ```'
