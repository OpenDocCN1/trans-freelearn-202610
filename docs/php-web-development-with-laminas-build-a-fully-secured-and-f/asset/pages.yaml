- pgno: 103
  md: "```\n$attributes = get_object_vars($this);\nforeach ($attributes as $attribute\
    \ => $value) {\n    $this->$attribute = (is_int($this->$attribute) ?\n       \
    \ (int) $data[$attribute] : $data[$attribute]);\n}\n\npublic function toArray()\n\
    {\n    return get_object_vars($this);\n}\n}\n```\n\nThe exchangeArray method receives\
    \ a data array and puts the values in the respective attributes. The toArray method,\
    \ on the other hand, returns an array with the values of the attributes.\n\nWill\
    \ the test run successfully now? Of course not!\n\n+   8. We have to implement\
    \ the save method in the AbstractTable class:\n\n```\npublic function save(AbstractModel\
    \ $model): bool\n{\n    $set = $model->toArray();\n    $keyName = $this->keyName;\n\
    \    try {\n        if (empty($model->$keyName)) {\n            unset($set[$keyName]);\n\
    \            $this->tableGateway->insert($set);\n        } else {\n          \
    \  $this->tableGateway->update($set, [\n                $keyName => $set[$keyName]\n\
    \            ]);\n        }\n    } catch (\\Exception $e) {\n        error_log($e->getMessage());\n\
    \        return false;\n    }\n    return true;\n}\n```"
