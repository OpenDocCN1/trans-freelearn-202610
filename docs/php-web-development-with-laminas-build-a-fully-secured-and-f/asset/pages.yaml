- pgno: 4
  md: '# # Foreword


    _PHP Web Development with Laminas_ by Flávio Gomes da Silva Lisboa is a very good
    book if you are interested in web development with PHP. The author shows how to
    implement, using a step-by-step approach, a complete e-commerce application with
    the Laminas open source project (formerly Zend Framework). I really liked the
    approach of the author, introducing not only the usage of the framework but also
    many best practices such as test-driven development, behavior-driven development,
    principles of Agile development, and more. This is definitely a book to have if
    you want to build professional web applications in PHP.


    > _Enrico Zimuel, principal software engineer at Elastic Core Committee, member
    of the PHP Framework Interop Group, formerly Zend Framework core developer_'
  merge: -1
  img_proc: true
