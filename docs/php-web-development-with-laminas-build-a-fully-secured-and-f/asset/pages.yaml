- pgno: 95
  md: '# Table Data Gateway


    Martin Fowler, in his book *Patterns of Enterprise Application Architecture*,
    Addison-Wesley, defines Table Data Gateway as “an object that acts as a Gateway
    to a database table.” This object is intended to handle several rows from a table.
    Gateway is also the name of a design pattern. Martin Fowler, in the same book,
    defines a Gateway as “an object that encapsulates access to an external system
    or resource.” Databases are external systems for web applications, so it makes
    sense that some object-relational patterns extend the gateway pattern. You can
    search for one single record with a Table Data Gateway, but this object always
    returns a record set (in this case, a set with one only element).


    # Row Data Gateway


    Martin Fowler, in his book *Patterns of Enterprise Application Architecture*,
    Addison-Wesley, defines Row Data Gateway as “an object that acts as a Gateway
    to a single record in a data source.” While Table Data Gateway focuses on a record
    set, Row Data Gateway focuses on a single record.


    We will create a `school12` project in this chapter, which will implement ORM
    with `laminas-db`. This `school12` project has a difference, related to the separation
    of responsibilities, from the `school11` project. In `school11`, the same class
    (`SchoolClass`) stores the business data and deals with communication with the
    database. Now, we will have a class to store the data in memory that doesn’t know
    the data source and another class to read and write to the database. This approach
    avoids coupling the business rules with the data storage model. We can separate
    responsibilities in the following way:


    +   1. Make a copy of the `school11` project in the `htdocs` folder and name it
    `school12` in the same `htdocs` folder. Remember that we agreed in *Chapter 2,
    Setting Up the Environment for Our E-Commerce Application*, that the `htdocs`
    folder would be our workspace throughout the book. You can do this by selecting
    the `school11` project with the right mouse button and clicking on **Copy**, or
    simply pressing `Ctrl + C`. Then, press `Ctrl + V` and you will see a dialog box,
    as in Figure 4.1:


    ![](img/e6cf5550804ccae9d1859270da8688f5_95_0.png)


    Figure 4.1 – Dialog box for copying a project'
  merge: -1
  img_proc: true
- pgno: 96
  md: '+   2. Make sure the **Project name** field is filled with `school12`; then,
    click on **Copy**.


    +   3. Select the `school11` project with the right mouse button and click on
    the **Close Project** item.


    We are closing our first project because we don''t need it anymore and if it stays
    open, we may accidentally change a file in that project thinking it belongs to
    the `school12` project. From now on, we will work on the `school12` project.


    # # Use case – managing students


    In this second project (`school12`), we will implement one more use case, *managing
    students*. This use case is very similar to *managing school classes*. Both have
    four flows, related to create, recover, update, and delete actions. The difference
    is that the `student` model is dependent on the `school class` model. So, a precondition
    for the flows of the *managing students* use case is that the `classes` table
    must have at least one record.


    # # Implementing the use case


    By now, you know how to create folders. So, let us implement a use case by following
    these steps:


    +   1. Create a new folder named `view` in the root of the project.


    +   2. Inside this folder, create two more folders: `schoolclass` and `student`.


    The `view` folder is an explicit division for files related to the user interface.
    This organization will help us to identify what belongs to the presentation layer.


    +   3. Next, select the following files:


    +   • `delete.php`

    +   • `edit.php`

    +   • `index.php`

    +   • `list.php`

    +   • `save.php`


    +   4. Copy these files to the `view/schoolclass` and `view/student` folders.


    +   5. Now, you can remove all of them from the project root, except for the `index.php`
    file. The `index.php` file is the starting point of the application and will act
    as a coordinator for the other files. The `index.php` file is akin to the front
    door of a house. You need to get into the house to access the rooms. In a similar
    way, a user will have to use `index.php` before they access the other PHP files.'
