- pgno: 94
  md: '# # Using ORM


    You have learned how to connect to a relational database with `laminas-db` using
    its implementation of the **Adapter** design pattern. However, although we created
    a structure that allows switching between different SQL database vendors through
    configuration, we kept writing SQL statements. When we write SQL statements directly
    inside the code of an application, we have to choose a specific SQL dialect. Although
    there is a SQL standard, the fact is that there are some differences, such as
    the use of quotations and the names of functions.


    For example, in MySQL, a query on the `resources` table of the `whatstore` database
    would have this form:


    ```

    SELECT `code`, `name`, `method` FROM `resources`

    ```


    On the other hand, the same query in PostgreSQL would look like this:


    ```

    SELECT "code","name","method" FROM "public"."resources"

    ```


    As we can see, the quotation character is different for each one of these vendors.
    If you use the `SELECT` query of one of them in the other, an error will occur.
    Imagine changing several files of an application because you are migrating from
    one vendor to another.


    You might say that some string replacement based on a regular expression could
    solve this fast. However, in addition to the quotation issue, there are differences
    between database functions. For example, MySQL aggregates values of fields from
    several table records, like this:


    ```

    SELECT GROUP_CONCAT(`name`) as `names` FROM `resources`

    ```


    But PostgreSQL uses another function for the same result:


    ```

    SELECT string_agg("name",'','') AS "names" FROM "public"."resources"

    ```


    So, database migration can be a hard task if the application directly writes the
    SQL statements.


    ORM avoids the rewriting of code if you need to migrate from one database vendor
    to another. This facility is possible thanks to SQL statement encapsulation.


    To get started with ORM, we will learn how to deal with tables as objects. The
    `laminas-db` component implements the **Table Data Gateway** and **Row Data Gateway**
    design patterns, which allow access to a table or a record set as an object and
    allow access to a single record as an object, respectively. In this chapter, we
    will use the Table Data Gateway pattern.'
  merge: -1
