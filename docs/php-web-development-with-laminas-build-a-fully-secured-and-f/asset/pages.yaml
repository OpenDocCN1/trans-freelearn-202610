- pgno: 334
  md: "# Removing unnecessary configuration\n\nIn the previous section, we have learned\
    \ how to find and remove clones of source code. A clone is an exact copy of the\
    \ original, like the Jango Fett clones in Star Wars. A clone is not a twin brother\
    \ that is similar but not really identical, like Arnold Schwarzenegger and Danny\
    \ DeVito in the movie Twins. So, phpcpd maybe won't find similar pieces of source\
    \ code because there is some little difference between them. In our case, there\
    \ are some similar pieces of source code regarding the view and layout.\n\nAs\
    \ we decided in Chapter 5, Creating the Virtual Store Project, in the Preparing\
    \ the modules for our project section, the Application module will define the\
    \ application layout. We also said that the last module in the modules.config.php\
    \ array was the module that defines the application layout. But why and how?\n\
    \nYou have observed that there are several configuration files in a Laminas MVC\
    \ application. There are files in the root config folder and there is a configuration\
    \ file for each module. When the application is initialized, all these files are\
    \ merged in a single configuration array or, better, in a single data map. Each\
    \ map key is unique, so if the same map key is in different configuration files,\
    \ one of the values is lost in the merge. The last merged file overrides the previous\
    \ one, so the last module in the modules list overrides the layout configuration\
    \ of the others.\n\nBut there is no need for overriding values if the same configuration\
    \ keys are not necessary for every module. This is the case with most of the subkeys\
    \ of the view_manager key in the module.config.php file. Only the application\
    \ module needs all the subkeys because it defines layout and error templates.\n\
    \nSo, the view_manager key in the module.config.php file of the Application module\
    \ must look like this:\n\n```\n'view_manager' => [\n    'display_not_found_reason'\
    \ => true,\n    'display_exceptions'       => true,\n    'doctype'           \
    \       => 'HTML5',\n    'not_found_template'       => 'error/404',\n    'exception_template'\
    \       => 'error/index',\n    'template_map' => [\n        'layout/layout'  \
    \         => __DIR__ .\n        './../view/layout/layout.phtml',\n        'error/404'\
    \               => __DIR__ .\n        './../view/error/404.phtml',\n        'error/index'\
    \             => __DIR__ .\n        './../view/error/index.phtml',\n    ],\n],\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 335
  md: "```\n'template_path_stack' => [\n\t__DIR__ . '/../view',\n],\n```\n\nObserve\
    \ that we have removed the application/index item from template_map. This is because\
    \ this item also is not necessary. In fact, we don't need a page for the Application/\
    \ IndexController->indexAction method. We can remove the view/application/ index\
    \ folder and refactor the mentioned method with a redirection:\n\n```\npublic\
    \ function indexAction()\n{\n    return $this->redirect()->toRoute('home');\n\
    }\n```\n\nSo, if somebody types the /application path, this person will be redirected\
    \ to the home page, which is the Store module home page.\n\nWell, let us discard\
    \ the unnecessary view configuration for the other modules, Inventory and Store\
    \ (Generic has no view). For the Inventory module, the view_manager key must look\
    \ like this:\n\n```\n'view_manager' => [\n    'template_path_stack' => [\n   \
    \     __DIR__ . '/../view',\n    ],\n    'strategies' => [\n        'ViewJsonStrategy',\n\
    \    ],\n],\n```\n\nAs we learned when we built our API, the ViewJsonStrategy\
    \ value in strategies enables controllers to respond with JSON.\n\nFor the Store\
    \ module, the view_manager key must look like this:\n\n```\n'view_manager' =>\
    \ [\n    'template_path_stack' => [\n        __DIR__ . '/../view',\n    ],\n],\n\
    ```\n\nThe template_path_stack subkey is required because each module has its\
    \ own view folder."
  merge: -1
  img_proc: true
- pgno: 336
  md: 'So, we have removed unnecessary code lines that are not detected by phpcpd
    because they were not perfect clones. The application keeps working as before,
