    \ a parameter, as we can see in the following source code:\n\n```\npublic function\
    \ getByFields(array $fields): Abstract Model\n{\n\t$where = [];\n\tforeach($fields\
    \ as $field => $value) {\n\t\t$where[$field] = $value;\n\t}\n\t$rowSet = $this->getAll($where);\n\
    \tif ($rowSet->count() == 0) {\n\t\t$modelName = $this->modelName;\n\t\treturn\
    \ new $modelName();\n\t}\n\treturn $rowSet->current();\n}\n```\n\nNow, you are\
    \ able to associate resources with a role and so allow a role to have access to\
