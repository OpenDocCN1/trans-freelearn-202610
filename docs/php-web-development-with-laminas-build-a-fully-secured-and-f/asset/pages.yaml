- pgno: 297
  md: '# # Implementing a Product Basket


    This chapter covers the implementation of a product basket, an essential component
    of a virtual store. In _Chapter 9, Event-Driven Authentication_, we learned about
    the `laminas-session` component and how it can be used to manage sessions and
    persist data between HTTP requests. In this chapter, we will use `laminas-session`
    to implement a product basket.


    We will first start by learning how to implement inventory management. Next, we
    will understand how to refactor the customer home page with view helpers. After
    this, we will implement a product basket. Lastly, we will learn how to make a
    purchase order for an authenticated customer.


    At the end of this chapter, you will be able to select products from a listing
    page, add these products to a basket, remove products from this basket, and make
    a purchase order. This purchase process includes customer registration, which
    is very similar to the employee registration we implemented in _Chapter 9, Event-Driven
    Authentication_.


    In this chapter, we''ll be covering the following topics:


    +   - Managing the product inventory

    +   - Refactoring the customer home page

    +   - Controlling the product basket

    +   - Controlling the customers

    +   - Decoupling the generic behavior of authentication


    # ## Technical requirements


    All the code related to this chapter can be found at `https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter11/whatstore`.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Managing the product inventory


    To sell products in our e-commerce system, we need to have them in our inventory.
    It is because of this that we need to be able to manage the inventory and the
    adding and removal of amounts of products.


    In fact, imagine you already have implemented a RU for inventory. You may be asking,
    “RU? What is this?” Oh, sorry, RU stands for **Recover and Update**. “But wouldn’t
    it be CRUD?” No, because inventory depends on products. When a product is created,
    we must create an inventory record for this product. When a product is removed,
    the related inventory record must be removed too. Thus, CRUD does not make sense
    when it comes to inventory, and we only need to implement recovery and updates
    for an inventory. Right, now that you understand it, let us explain the implementation
    of inventory management.


    We won’t repeat the details about registration that we covered in previous chapters.
    The implementation of inventory management is available in the source code folder
    of this chapter, mentioned in the *Technical requirements* section. Therefore,
    we will focus here only on the differences related to inventory management. The
    exclusive data for inventory management is based on the inventory table.


    So, let us assume that there are the following classes in the `module/Inventory/src/Model`
    folder:


    +   * Inventory

    +   * InventoryTable

    +   * InventoryTableFactory


    It is important to remember that the factories of each table gateway class must
    be configured by the `service_manager` key in the `modules.config.php` file.


    **Important note – automated tests**

    You will find test classes for every controller class built in this chapter in
    the GitHub repository mentioned in the *Technical requirements* section. However,
    from now on, we won’t discuss these test classes to avoid unnecessary repetitions.
    By now, you must be aware that tests are necessary and that it is important that
    you make them in your development process. From now on, we will assume that when
    we are creating a new controller class, the respective test class was created
    beforehand.


    We are also assuming that there are the following classes in the `module/Inventory/src/Controller`
    folder:


    +   * InventoryAPIController

    +   * InventoryAPIControllerFactory

    +   * InventoryController

    +   * InventoryControllerFactory'
  merge: -1
  img_proc: true
