  img_proc: true
- pgno: 227
  md: "```\n```php\n$validatorChain = new ValidatorChain();\n$validatorChain->attach(new\
    \ StringLength\n    (['min' => 3]));\n$input->setValidatorChain($validatorChain);\n\
    $inputFilter->add($input);\n```\n```\n\nObserve that we have created an instance\
    \ of `ValidatorChain`. `ValidatorChain` connects a group of validators and allows\
    \ you to apply all these validators to a value. In sequence, these validators\
    \ are attached to `ValidatorChain`.\n\nYou can find the reference about Laminas\
    \ standard filter classes at https://docs.laminas.dev/laminas-validator/standard-validators.\
    \ For the `Discount` class, we have used the `StringLength` validator. This validator\
    \ ensures that a text has a minimum and/or maximum length.\n\nWe will add validation\
    \ in the inserting and updating methods of `DiscountAPIController`. `DiscountAPIController->create`\
    \ must look like this:\n\n```\n```php\npublic function create($data)\n{\n    $discount\
    \ = new Discount();\n    $inputFilter = $discount->getInputFilter();\n    $inputFilter->setData($data);\n\
    \    if (!$inputFilter->isValid()) {\n        return new JsonModel(['inserted'\
    \ => 'invalid']\n            );\n    }\n\n    $discount->exchangeArray($data);\n\
    \    $inserted = $this->discountTable->save($discount);\n    return new JsonModel(['inserted'\
    \ => $inserted]);\n}\n```\n```\n\nObserve that we applied the validation rule\
    \ for the discount name before trying to save the data. The database could have\
    \ business rules too, but validation in the application avoids database errors\
    \ and unnecessary communication between the application and the database. We get\
    \ the `InputFilter` instance with the `Discount->getInputFilter` method, which\
    \ makes sense. The `InputFilter->setData` method assigns the values to be validated\
    \ and the `InputFilter->isValid` method answers if all values are valid according\
    \ to the validator chain."
