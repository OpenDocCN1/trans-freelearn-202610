    \ Bergmann.\n\nNo clones found.\n\nTime: 00:00.563, Memory: 4.00 MB\n```\n\nAs\
    \ you can see, the refactoring has eliminated the duplicated code from the whatstore\
    \ project. The phpcpd tool is really useful to help us find duplicated code with\
    \ TDD.\n\n> **PHP Mess Detector**\n> \n> There is another interesting CLI tool\
    \ for PHP named the **PHP Mess Detector (PHPMD)**. This tool looks for several\
    \ potential problems within PHP source code, such as possible bugs, suboptimal\
    \ code, overcomplicated expressions, and unused parameters, methods, and properties.\
    \ It is recommended that you use PHPMD combined with your IDE. You can download\
    \ PHPMD at https://phpmd.org.\n\nIn the next section, we will do some more refactoring,\
    \ this time to remove unnecessary configurations."
