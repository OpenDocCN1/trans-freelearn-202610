- pgno: 156
  md: "As you can see, the ProductTable class extends the AbstractTable class. The\
    \ save method is implemented by AbstractTable, so we only need to inform which\
    \ model class (the $modelName attribute) will be handled in the subclass.\n\n\
    Does it mean a product can be inserted now? In fact, if you execute Behat run,\
    \ you will see the following error message:\n\n> Unable to resolve service \"\
    ProductTable\" to a factory; are you certain you provided it during configuration?\n\
    \nWhy does this happen? It is because we need to define a factory for ProductTable.\
    \ The ServiceManager class does not create direct instances with the new operator.\
    \ ServiceManager searches for a factory from an alias. We are using the name of\
    \ the table mappers as an alias, so the factory alias for the ProductTable class\
    \ is ProductTable. But how is a real factory class? Well, a factory for a data\
    \ mapper stays in the same Model folder of the model class handled by mapper.\
    \ So, we have to create the following class in the Model folder of the Inventory\
    \ module:\n\n# ProductTableFactory.php\n\n```\n<?php\ndeclare(strict_types = 1);\n\
    namespace Inventory\\Model;\n\nuse Interop\\Container\\ContainerInterface;\nuse\
    \ Laminas\\Db\\ResultSet\\ResultSet;\nuse Laminas\\Db\\TableGateway\\TableGateway;\n\
    use Laminas\\ServiceManager\\Factory\\FactoryInterface;\n\nclass ProductTableFactory\
    \ implements FactoryInterface\n{\n    public function __invoke(ContainerInterface\
    \ $container,\n        $requestedName, ?array $options = null)\n    {\n      \
    \  $adapter = $container->get('DbAdapter');\n        $resultSetPrototype = new\
    \ ResultSet();\n        $resultSetPrototype->setArrayObjectPrototype\n       \
    \     (new Product());\n        $tableGateway = new TableGateway('products',\n\
    \            $adapter, null, $resultSetPrototype);\n```"
