    Because of this, we will add a `getArrayCopy` method to the `AbstractModel` class.\
    \ This class was created in _Chapter 4, From Object-Relational Mapping to MVC\
    \ Containers_, and it belongs to the Generic module. The implementation of the\
    \ `getArrayCopy` method is simple:\n\n```\npublic function getArrayCopy()\n{\n\
