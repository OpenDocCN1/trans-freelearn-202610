    Note that the tests verify that what was working continues to work. Kent Beck,
    in his book Test-Driven Development: By Example, says that TDD eliminates the
    fear involved in development. Aided by tests, we can change our code and know
    immediately whether something is broken. With BDD, we keep this advantage of TDD
    and have files (. feature) that we can discuss directly with our customers.


    You can make improvements securely with the aid of tests. For example, you must
    have noticed that the constructor is the same for the Product and Discount models
    and probably will be the same for the other models. Then, we can centralize this
    constructor in the AbstractModel class. Cut the method constructor from the Product
    class and paste it into AbstractModel. Then, delete the constructor of the Discount
    class. You can execute Behat run and check that everything continues to work.'
