- pgno: 222
  md: "The verbose way to enable form rendering is by registering aliases and factories\
    \ for each one of the form helpers in the module.config.php file. This register\
    \ is made by the key view_helpers, at the first level of the configuration array,\
    \ as we can see in this source code:\n\n```\n'view_helpers' => [\n    'aliases'\
    \ => [\n        'form' => Form::class,\n        'formText' => FormText::class,\n\
    \        'formSelect' => FormSelect::class,\n        'formNumber' => FormNumber::class,\n\
    \        'formHidden' => FormHidden::class,\n        'formLabel' => FormLabel::class\n\
    \    ],\n    'factories' => [\n        Form::class => InvokableFactory::class,\n\
    \        FormText::class => InvokableFactory::class,\n        FormSelect::class\
    \ => InvokableFactory::class,\n        FormNumber::class => InvokableFactory::class,\n\
    \        FormHidden::class => InvokableFactory::class,\n        FormLabel::class\
    \ => InvokableFactory::class\n    ]\n]\n```\n\nIn the aliases subkey, we defined\
    \ the names in which we invoked view helper classes. In the factories subkey,\
    \ we defined how the view helper instances are created. Observe that this approach\
    \ allows us to make customizations. This is often a feature of Laminas components.\n\
    \nYou will have noticed that it is better to add Laminas\\Form as a module. This\
    \ is what we will do in our project.\n\n> **Important note: Form view plugins**\n\
    > \n> If you haven't declared Laminas\\Form as a module and you haven't registered\
    \ a form view plugin in module.config.php, you will receive a message such as\
    \ **A plugin by the name ‘form’ was not found in the plugin manager Laminas\\\
    View\\HelperPluginManager** when trying to render a form.\n\nWe also need to install\
    \ the laminas-i18n component before trying to render the form. This component\
    \ allows you to translate text from translation files according to the application\
    \ configuration. Install laminas-i18n as you have done with laminas-form."
