    \n> **Note: Closures for treating field names and values**\n> \n> In the SchoolClassTest->testInsertingList\
    \ method, we use the $qi and $fp closures for quoting the field name and formatting\
    \ the value respectively. So, if we change our database from MySQL to PostgreSQL,\
    \ for instance, it won't be necessary to change the code into a class but only\
