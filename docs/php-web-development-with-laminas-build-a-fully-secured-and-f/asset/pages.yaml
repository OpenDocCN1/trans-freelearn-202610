    \ Inventory and Store modules will be covered. In fact, we can’t test effectively\
    \ abstract classes or interfaces because they don’t have implementations – at\
    \ least not all the implementations.\n\nSave the `composer.json` file and execute\
    \ the **Composer autoload files regeneration** external tool. This item is available\
    \ on the toolbar, as Figure 6.2 shows:\n\n![](img/e6cf5550804ccae9d1859270da8688f5_162_0.png)\n\
    \nFigure 6.2 – The Composer autoload files regeneration external tool\n\nThis\
    \ external tool, **Composer autoload files regeneration**, was created in *Chapter\
    \ 5, Creating the Virtual Store Project*. You can see that we have configured\
    \ several external tools in previous chapters. Make a note that we created **Composer\
    \ autoload files regeneration** because we need to recreate the composer autoload\
    \ files to reflect the content of `composer.json`. Is it enough for the Generic\
    \ module to be found? No. Although Laminas can find the classes in the Generic\
    \ namespace, the `ModuleManager` class will search only for the modules listed\
