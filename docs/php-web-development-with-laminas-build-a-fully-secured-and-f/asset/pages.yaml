    # ## Summary


    In this chapter, we have installed a generic PHP environment, with a web server,
    PHP interpreter, and RDBMS. This environment is based on XAMPP, a package of free
    software and OSS for development with PHP, available for the most used operating
    systems.


    We have learned two different ways to install and use Lamina: as isolated components
    to be used by PHP applications with any type of structure, whether MVC or not;
    and as a container for an MVC application, delegating the control of the application
    to the framework.


    We also installed a free and open source IDE: Eclipse for PDT. We have shown how
    to integrate programs with the **command-line interface (CLI)** into the Eclipse
    toolbar, configuring an item to create a Lamina project within Eclipse.'
