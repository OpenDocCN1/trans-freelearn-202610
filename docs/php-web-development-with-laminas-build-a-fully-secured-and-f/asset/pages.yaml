  md: "# Generating a form for discounts with laminas-form\n\nIn this chapter, we\
    \ will use three new Laminas components. The first is `laminas-form`, used to\
    \ define HTML forms. In the same way you added and installed the `laminas-db`\
    \ component using Composer, do the same for the `laminas-form` component:\n\n\
    +   1. Open the `composer.json` file in Eclipse.\n+   2. Through the **Dependencies**\
    \ tab, search for the `laminas/laminas-form` package and add it.\n+   3. Save\
    \ the file and click on the **Update dependencies** button.\n\nIf you have any\
    \ doubts about how to install Composer dependencies with Eclipse, read the *Creating\
    \ our first automated test* section of Chapter 3, *Using Laminas as a Library\
    \ with Test-Driven Development*.\n\n> **Important note: Component injection into\
    \ configuration**\n> \n> When you install a Laminas component in an MVC Laminas\
    \ project with Composer, you will be asked about the injection of a component\
    \ into configuration. When Composer asks this, you must select the option to inject\
    \ into the `config/modules.config.php` file. We use this file because all Laminas\
    \ components of our project must be available in the production environment. You\
    \ can set Composer to remember this option when it asks about it.\n\nSince the\
    \ previous chapter, you are probably eager to create more APIs and web interfaces\
    \ for other registrations of the *Inventory* module. But it was worth waiting\
