- pgno: 288
  md: "```\n$rbac->addRole($role);\n\n$container = new Container();\nif (isset($container->rbac))\
    \ {\n    unset($container->rbac);\n}\n\n$container->rbac = $rbac;\n}\n```\n\n\
    As you'll remember, this method was private in the `IndexController` class, but\
    \ in `IdentityManager`, it is public. This change is to protect against a kind\
    \ of attack that can be carried out by unhappy employees.\n\nImagine the following\
    \ scenario: on a cold day in winter, Mr. Heythere finds that one of his managers,\
    \ Mr. Barnaby, has not been performing as required. Mr. Heythere informs Mr. Barnaby\
    \ of what is expected of him, but Mr. Barnaby answers that he would prefer not\
    \ to do so. So, Mr. Heythere decides to fire Mr. Barnaby and find a better manager\
    \ (probably someone who reads books by Packt Publishing!). The issue is that Mr.\
    \ Barnaby knows that he still has access to the system after being fired because\
    \ he is so familiar with it.\n\nThe terror sequence is as follows: Mr. Heythere\
    \ fires Mr. Barnaby. Due to the session configuration, Mr. Barnaby is still logged\
    \ in to the Whatstore system with his manager permissions. Even if another manager\
    \ changes his permissions, this will only affect his next access attempt. Now,\
    \ Mr. Barnaby is very mad, because he and Mr. Heythere obviously did not agree\
    \ on the terms of his dismissal, and Mr. Barnaby wants Mr. Heythere to pay. Since\
    \ Mr. Barnaby can still access the system with his previous privilege level, he\
    \ does so and damages some records.\n\nHow can we avoid this terror story? One\
    \ possibility is updating the user permissions while they are logged in. So, we\
    \ have changed the visibility of the `loadAuthorizationData` method, to use it\
    \ beyond the login process.\n\nTo finish the `IdentityManager` implementation,\
    \ we will add three methods:\n\n```\npublic function getIdentity(): string\n{\n\
    \    return $this->auth->getIdentity()->name;\n}\npublic function hasIdentity():\
    \ bool\n{\n    return $this->auth->hasIdentity();\n}\npublic function getRbac():\
    \ Rbac\n```"
  merge: -1
  img_proc: true
- pgno: 289
  md: "```\n{\n    $this->loadAuthorizationData();\n    $container = new Container();\n\
    \    return $container->rbac;\n}\n```\n\nThe getIdentity and hasIdentity methods\
    \ are wrappers for homonymous methods of the AuthenticationService class. The\
    \ getRbac method provides an Rbac instance with current permissions.\n\nGreat.\
    \ Our IdentityManager class is ready. But as it has dependencies, we need a factory\
    \ for it. So, create the IdentityManagerFactory class in the Model folder of the\
    \ Inventory module:\n\n```\nclass IdentityManagerFactory implements FactoryInterface\n\
    {\n    public function __invoke(ContainerInterface $container,\n        $requestedName,\
    \ ?array $options = null)\n    {\n        $employeeTable = $container->get('EmployeeTable');\n\
    \        $adapter = new CredentialTreatmentAdapter\n            ($container->get('DbAdapter'));\n\
    \        $adapter->setTableName('employees');\n        $adapter->setIdentityColumn('nickname');\n\
    \        $adapter->setCredentialColumn('password');\n\n        $resourceTable\
    \ = $container->get('ResourceTable');\n\n        $encryptionMethod = array(new\
    \ Employee(),\n            'encrypt');\n\n        return new IdentityManager($adapter,\
    \ $resourceTable\n            , $encryptionMethod);\n    }\n}\n```\n\nAfter creating\
    \ several factories for models, you know that it is necessary to add an entry\
    \ for this factory to the module.config.php file, in the service_manager->factories\
    \ key:\n\n```\n'IdentityManager' => Model\\\\IdentityManagerFactory::class\n```"
  merge: -1
