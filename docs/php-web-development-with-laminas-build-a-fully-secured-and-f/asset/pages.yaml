- pgno: 356
  md: "# Creating a customized filter\n\nClick on the Customized filter button (shown\
    \ in Figure 13.1) and you will be taken to the following page:\n\n![](img/e6cf5550804ccae9d1859270da8688f5_356_0.png)\n\
    \nFigure 13.2 – Form to test the customized filter\n\nThe form shown in Figure\
    \ 13.2 serves to apply a filter that reverses the typed expression. As an example,\
    \ you can type open sesame in the text box and then click on the How does Zatanna\
    \ say this? button. In addition to finding out that Zatanna has some pronunciation\
    \ problems, you will see the page reload with the following content:\n\n![](img/e6cf5550804ccae9d1859270da8688f5_356_1.png)\n\
