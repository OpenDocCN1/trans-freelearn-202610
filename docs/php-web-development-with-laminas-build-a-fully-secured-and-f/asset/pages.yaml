- pgno: 247
  md: "This comparison requires some changes in Employee class. You should remember\
    \ that the Employee class has a private encrypt method. We will modify this method\
    \ to public and static, like so:\n\n```\npublic static function encrypt(String\
    \ $text)\n{\n    $text = strrev(hash('sha256', $text));\n    $subtext = substr($text,1,rand(0,strlen($text)-1));\n\
    \    $text = substr($subtext . $text, 0, strlen($text));\n    return hash('md5',\
    \ $text);\n}\n```\n\nAs the encrypt method is used by the exchangeArray method\
    \ of the same class, we also have to modify this last one, changing the $this\
    \ keyword to self:\n\n```\npublic function exchangeArray($data)\n{\n    $this->ID\
    \ = ($data['ID'] ?? 0);\n    $this->name = ($data['name'] ?? '');\n    $this->nickname\
    \ = ($data['nickname'] ?? '');\n    $this->password = (isset($data['password'])\
    \ ?\n        self::encrypt($data['password']) : '');\n}\n```\n\nWell, now we can\
    \ use the encrypt method in the IndexController->loginAction method. Next, we\
    \ have to replace the following line:\n\n```\n$this->adapter->setCredential($password);\n\
    ```\n\nIt needs to be replaced with this:\n\n```\n$this->adapter->setCredential(Employee::encrypt($password));\n\
    ```\n\nTry to log in again. Again, you are disappointed; you see the **Invalid\
    \ data** message again. What is wrong? Well, if you look at the Employee::encrypt\
    \ method carefully, you will notice that it generates different hashes for the\
    \ same password because there is a random component. Random components are very\
    \ good to suggest passwords to users, but they are not appropriate for comparisons\
    \ when the encrypted data needs to be the same. Thus, when you try to log in,\
    \ the generated hash is different from the database stored hash."
  merge: -1
  img_proc: true
