- pgno: 129
  md: '# # Creating the Virtual Store Project


    This chapter presents the requirements of the e-commerce project we plan to build,
    its use cases, its class diagrams, and the creation of the general structure of
    the application. We will start a more complex application that can serve as a
    reference for creating PHP enterprise web applications.


    By the end of this chapter, you will be able to create the structure for a complex
    software project using the Laminas framework as a container and service provider.


    In this chapter, we''ll be covering the following topics:


    +   - Understanding the project requirements for the sample web application

    +   - Identifying use cases and actors

    +   - Understanding the class diagram for *whatstore* (our fictional department
    store)

    +   - Creating the project instance


    # ## Technical requirements


    The environment for the virtual store project has been prepared in *Chapter 2,
    Setting Up the Environment for Our E-Commerce Application*. The hardware reference
    configuration has been presented in *Chapter 3, Using Laminas as a Library with
    Test-Driven Development*. The code generated for this chapter is available in
    full at `https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter05`.'
  merge: -1
  img_proc: true
- pgno: 130
  md: "# # Understanding the project requirements for the sample web application\n\
    \nWe will imagine a fictional backstory for our project. You are a software company\
    \ owner. Your company is called *Sheet Software*. One day, your company is hired\
    \ to create an e-commerce website for a department store called *Whatstore*. You\
    \ may think that the name of the department store rather sounds like a question,\
    \ but in fact, the name is an acronym for *We Have All Things Store*. This company\
    \ really sells many products. Unfortunately, the contract doesn't include suggesting\
    \ a better name for the client company. So, we can instead focus on the software\
    \ construction.\n\nAfter some meetings with Mr. Heythere, CEO of Whatstore, some\
    \ requirements were defined for the virtual store:\n\n+   1. The virtual store\
    \ system must have two distinct zones: one for the customers (sales area) and\
    \ another for the employees (management area). The first area must allow customers\
    \ to put products into a basket and pay for them. The second area must allow employees\
    \ to register products, make the inventory, change prices, and give discounts.\n\
    +   \n+   2. The home page of the customer area must allow the searching of products\
    \ by name, completely or partially.\n+   \n+   3. The product pages must show\
    \ the names of products, their prices, and the number in stock. For each product,\
    \ there must be a button to add the item to the basket.\n+   \n+   4. There must\
    \ be an always-visible link for the basket that allows the customer to see all\
    \ the selected products, change the amount of each one, remove products, or close\
    \ the order.\n+   \n+   5. The customers should be able to register themselves\
    \ at any point in the process. It should not be necessary for them to register\
    \ themselves while selecting products, but while checking out, the customer should\
    \ automatically be registered.\n+   \n+   6. When the order is closed, the requested\
    \ number of products must be reserved in the inventory. When the products are\
    \ prepared for delivery, the number must be subtracted from the inventory.\n+\
    \   \n+   7. The system must have access control for the management area that\
    \ allows them to define who can do what.\n\nThese are the functional requirements\
    \ that provide a general view of the requested system. In the next section, we\
    \ will refine these requirements for use cases. As we have experienced in the\
    \ previous chapter, a use case can help us develop, not only because it provides\
    \ the flows but also because we can produce a test case from a use case. A test\
    \ case, in turn, helps us to maintain the stability of the software."
  merge: -1
  img_proc: true
- pgno: 131
  md: '# Identifying use cases and actors


    In the previous chapter, we made a simplified use case specification (managing
    school classes). In this chapter, we will present here only the use case diagrams.
    For our purposes, the diagrams and the subsequent comments will be enough.


    There are two main actors for the Whatstore virtual store: the customer and the
    employee. First, we will present the use case diagram for the employee actor.
    Before the customer buys something from the store, the store needs to have products.
    Figure 5.1 shows the use cases related to the maintenance of the product inventory:


    ![](img/e6cf5550804ccae9d1859270da8688f5_131_0.png)


    Figure 5.1 – Use cases for the employee actor


    As we can see, our e-commerce system will have a product registration. Well, you
    already have the experience of creating registrations after the examples in the
    previous chapter. But the product inventory has some operations beyond Create,
    Read, Update, and Delete (CRUD). The amount of a certain product that the store
    has is stored in a different table of the product registration, as we saw in Chapter
    2, Setting Up the Environment for Our E-Commerce Application. The amount of each
    product available can be changed through specific operations related to the acquisition
    or sale of items.


    You may find it strange that Figure 5.1 presents some use cases that would only
    be operation flows according to the approach that we have used in Chapter 3, Using
    Laminas as a Library with Test-Driven Development. You must remember that the
    CRUD operations in the school system were part of the same use case. This was
    convenient for our preparation because we needed to have a more simplified view
    of the project. So, it was better to group the flows in just one use case. From
    now, we will deal with more details, so it is better to divide the operations
    to create smaller and more readable tests.


    Since we have available products for sale, the customer can interact with the
    system. As we can see in Figure 5.2, there are three main flows for the customer:
    registration, product selection, and order closure:'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/e6cf5550804ccae9d1859270da8688f5_132_0.png)


    # Figure 5.2 – Use cases for the customer actor


    Customers can register themselves. But what about employees? Who adds an employee
    to the system? We can see that there should be an actor who creates the employees:
    a manager. A manager can also be an employee, but one who plays a management role.
    Figure 5.3 shows the use cases associated with the manager actor:


    ![](img/e6cf5550804ccae9d1859270da8688f5_132_1.png)


    # Figure 5.3 – Use cases for the manager actor'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'So, we have identified three actors for our system: customer, employee, and
    manager. The actors of use cases can help us identify classes, although this doesn’t
    mean that every actor will be turned into a class.


    In Chapter 2, Setting Up the Environment for Our E-Commerce Application, we have
    presented the model-entity relationship (MER) for our application. In fact, this
    artifact is part of the general requirements definition. The entities also help
    us to identify classes. We have worked, in the last chapter, with object-relational
    mapping, and we have seen that there is a similarity between classes and tables.


    From the combination of use cases and MER, next, we will present the class diagram,
    which will be used for the implementation of the models for the application.


    # Understanding the class diagram for Whatstore


    Figure 5.4 shows the class diagram for the Whatstore system. You can observe that
    there are two sets of classes: a set of independent classes, Role and Employee,
    and another set of classes that has dependencies. The coupling among classes of
    the use cases related to the customer should be clear, considering that most of
    the requirements mention the customer searching, selecting, or ordering products.


    ![](img/e6cf5550804ccae9d1859270da8688f5_133_0.png)


    Figure 5.4 – Class diagram


    Where did the Role class come from? Previously, we said that the manager is a
    role played by an employee. The role of a manager allows an employee to insert,
    update, and delete other employees'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'from the system. This role can be associated with more than one employee if
    the CEO wishes it. The current managers can lose their role at any time. We could
    define a `Manager` class for dealing with this specific scenario of privileges.
    This requires further thought.


    What if a new role was requested for the system? For example, a role that can
    insert employees, but can’t update them or remove them. Should we create a new
    class? We try to avoid unnecessary changes in a software system. Each change usually
    adds more complexity, and this tends to make it more difficult, over time, to
    add new features and find the cause of bugs.


    We have to allow changes in a software system in a way that don’t require changes
    in the source code. The architecture must be flexible to allow adjustments via
    configuration. We have to search for structures that allow behavior changes that
    occur due to the inserting of new data or from the association between elements
    of the system. If we have a generic structure for roles, we can create a new role
    at any time. The behavior of the employees can be changed by the association between
    employees and roles.


    The software will change. Let’s focus on the changes that add value to the system
    (and to our budget). Think about the future and try to create generic structures
    that can be easily adapted to specific cases. This desirable feature of flexibility
    is the reason for the decoupling between the `Role` and `Employee` classes.


    Of course, we are trying to simplify an e-commerce system with our fictional story
    of Whatstore. We will try to cover as many of the main features as possible and
    will take every opportunity to comment on architectural aspects that can be useful
    for any complex web application project.


    For the moment, we have the necessary inputs. In the next section, we will start
    the implementation with the main architectural structures based on the Laminas
    framework.


    # # Creating the project instance


    How wonderful is it to start on a new project after having worked on something
    else previously? You are more confident now. You have a prepared environment with
    suitable tools. Let’s practice what we have learned in the previous chapters.
    Using the **Create Laminas Project** external tool configuration in Eclipse, create
    a project named **whatstore**. Remember that, after creating, you need to open
    the project, using the **File | New | PHP Project** menu. In fact, Eclipse won’t
    create a new PHP project, but it will open an existing project in the filesystem.


    After creating the project, you can start the application using the embedded PHP
    web server (considering that you are running inside the **whatstore** directory)
    as follows:


    ```

    php -S localhost:8000 -t public

    ```


    If you open the `localhost:8000` address in the browser, you will see the welcome
    page of Laminas, as you have done previously in Chapter 2, Setting Up the Environment
    for Our E-Commerce Application. But why do we use the `-t` argument with the `public`
    value? We will understand this in the next section.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # Understanding the structure of a Laminas project


    Let''s understand the structure of a Laminas project from the directories of a
    new project:


    +   - bin: This folder is used for storing scripts for automation

    +   - config: This folder stores the application configuration

    +   - data: This folder is used for storing data that doesn''t need to be shared,
    such as cache files

    +   - module: This is the heart of the application, the folder that contains the
    modules, which we talk more about in this section

    +   - public: This is the public part of the application, the only folder that
    can be accessible to the users

    +   - vendor: This is the default folder for dependencies managed by Composer


    So, we start the application by pointing to the public folder because public is
    the web root for the users. It''s the only point of access for the users, avoiding
    the unnecessary exposition of the main part of the application. This separation
    between public and the rest makes the application akin to a castle surrounded
    by a deep moat (which can have crocodiles or worse). The public folder is like
    the drawbridge of this castle. You must walk over the bridge to enter the castle.
    So, in the configuration of the filesystem for the web server, you can deny access
    to any folder except public.


    We have said that the module folder is the heart of the application. This is true.
    Try to remove this folder and see what happens. Well, the module folder can have
    one or more modules, which are in a subfolder with a name according to a CamelCase
    pattern. Let''s see the content of the default Application module to understand
    the general structure of a module:


    +   - config: This folder stores the module configuration

    +   - src: This folder stores the classes that implement the use cases

    +   - test: This folder stores the test cases

    +   - view: This folder stores template files for the HTML pages


    This structure is well suited to an MVC implementation. The elements of the model
    and controller layers are in the src folder. The elements of the view layer are
    in the view folder. This is the proposed and default structure for a Laminas module.
    It is possible to change everything in this structure, but there is no need to,
    in general. Laminas has its patterns, but it is configurable.


    The real configuration for runtime is the combination of the application configuration
    with the modules'' configuration. The application configuration deals with shared
    resources, such as database connections used by several modules. A module configuration,
    at first, must deal only with the resources contained by the module. However,
    a module can use resources from another module, although it is not recommended
    to make high couplings.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'Laminas'' MVC implementation has a ModuleManager class that orchestrates the
    modules as the only application. ModuleManager is responsible for merging several
    modules'' configurations into a single configuration. Figure 5.5 shows a simplified
    scheme of the configuration reading of a module, a process that occurs inside
    a loop:


    ![](img/e6cf5550804ccae9d1859270da8688f5_136_0.png)


    Figure 5.5 – Configuration reading by a listener


    In fact, there are more classes and interfaces involved in this process, but we
    will see more about that in Chapter 7, Request Control and Data View. For this
    moment, it is enough to know the main elements.


    Each module has a Module class inside the src folder. ModuleManager searches for
    the modules listed in the modules.config file (in the application configuration).
    A ConfigListener class is notified when ModuleManager loads a module. ConfigListener
    tries to call a getConfig method from the Module class. The getConfig method,
    if it exists, must return a configuration array. The module configuration contains,
    as we have seen in the previous chapter, the routes for the module, the controllers
    that can be instantiated, the source for the view templates, and the factories
    for any object that needs to be created with dependency injection.


    In the next section, we will prepare the modules for our project.


    # ## Preparing the modules for our project


    We will have three modules for the Whatsstore application. We will keep the Application
    module and we will create two more: Inventory and Store. We will use the Application
    module as the source for the other modules. Copy the Application directory inside
    the module folder and paste it two times, one as Inventory and the other as Store.'
  merge: -1
  img_proc: true
- pgno: 137
  md: "You can observe that the mere existence of the `Inventory` and `Store` folders\
    \ in the folder module doesn't affect the application, by loading the welcome\
    \ page at `localhost:8000`. `ModuleManager` will ignore these folders until their\
    \ names are in the `modules.config.php` file in the `config` folder. Add the names\
    \ of the new modules in this file as follows:\n\n# module.config.php\n\n```\n\
    return [\n    'Laminas\\\\Router',\n    'Laminas\\\\Validator',\n    'Store',\n\
    \    'Inventory',\n    'Application',\n];\n```\n\nThe `Application` module must\
    \ stay at the end of this list because it will define the layout of the web pages.\
    \ We will talk about this in *Chapter 7, Request Control and Data View*.\n\nAfter\
    \ adding the new modules to the configuration, we will see this error message\
    \ in the web server log:\n\n```\nPHP Fatal error: Uncaught Laminas\\\\ModuleManager\\\
    \\Exception\\\\RuntimeException: Module (Store) could not be initialized.\n```\n\
    \nWhat is the problem? `ModuleManager` doesn't find the modules. But how? They\
    \ are in the `modules` folder! Wait, calm down! We already covered this in *Chapter\
    \ 4, From Object-Relational Mapping to MVC Containers*. If you need a refresher,\
    \ then reread the *Using Laminas as a container* section.\n\nWe have said that\
    \ Laminas is configurable. It doesn't force you to follow a rigid structure. You\
    \ have the flexibility to adjust the project structure. So, you can put a module\
    \ in a different place and there is a reason for this. This is possible because\
    \ the loading of classes is delegated to Composer. We define the autoloading rules\
    \ in the `composer.json` file. You need to change the `autoload` and `autoload-dev`\
    \ keys as follows:\n\n```\n\"autoload\" : {\n    \"psr-4\" : {\n        \"Application\\\
    \\\" : \"module/Application/src/\",\n        \"Inventory\\\\\" : \"module/Inventory/src/\"\
    ,\n        \"Store\\\\\" : \"module/Store/src/\"\n    },\n},\n\"autoload-dev\"\
    \ : {\n```"
  merge: -1
  img_proc: true
- pgno: 138
  md: "```\n\"psr-4\" : {\n    \"ApplicationTest\\\\\" : \"module/Application/test/\"\
    ,\n    \"InventoryTest\\\\\" : \"module/Inventory/test/\",\n    \"StoreTest\\\\\
    \" : \"module/Store/test/\"\n}\n},\n```\n\nAfter finishing the autoloading configuration,\
    \ don't forget to save the `composer.json` file and click on the **Update dependencies\
    \ (including require-dev)** button in the Composer editor in Eclipse. This action\
    \ will regenerate the autoload files.\n\nBut when you watch the output in the\
    \ **Console** tab, you will see that this action also searches for updates, which\
    \ makes sense. How can we regenerate the `autoload` files without a search for\
    \ updates? We can create an external tool configuration, as we did in the *Integrating\
    \ Laminas and Eclipse* section in *Chapter 2, Setting Up the Environment for Our\
    \ E-Commerce Application*, for Laminas project creation. You can create a configuration\
    \ like this:\n\n+   * **Name**: Composer autoload files regeneration\n+   * **Location**:\
    \ Here, you must type the complete path to the Composer executable\n+   * **Working\
    \ Directory**: `${project_loc}`\n+   * **Arguments**: dumpautoload\n\nSo, when\
    \ you need to regenerate the `autoload` files, you run this configuration by the\
    \ Eclipse toolbar.\n\nHowever, even regenerating the `autoload` files, the modules\
    \ are not loaded yet. Why? We have seen this before. Didn't we copy the Application\
    \ module? Then, all the namespaces of the Inventory and Store modules are Application\
