- pgno: 77
  md: "The array inside this file contains the database connection parameters defined\
    \ in the documentation for laminas-db: https://docs.laminas.dev/laminas-db/adapter/#creating-an-adapter-using-configuration.\
    \ The config.php file reduces the code changes related to the database. You can\
    \ change the database server and even the database driver without needing to change\
    \ the source code of other files. The array defined in config.php will be used\
    \ by the Adapter class of Laminas. With this class, we can establish a connection\
    \ to the database and execute SQL statements. This class implements the Adapter\
    \ design pattern, cataloged by the Gang of Four (Erich Gamma, Richard Helm, Ralph\
    \ Johnson, and John Vlissides) in the classic book Design Patterns: Elements of\
    \ Reusable Object-Oriented Software. This pattern is useful to allow easy changes\
    \ between components with different interfaces, such as databases with different\
    \ drivers. So, we will write the content of the SchoolClass::getAll method:\n\n\
    # SchoolClass::getAll\n\n```\npublic static function getAll() : iterable\n{\n\
    \    $config = require (realpath(__DIR__ . '/../config') .\n        'config.php');\n\
    \    $adapter = new Adapter($config['db']);\n    $statement = $adapter->query('SELECT\
    \ * from classes');\n    $resultSet = $statement->execute();\n    return $resultSet;\n\
    }\n```\n\nThe SchoolClass::getAll method reads the array from the config.php file\
    \ and injects the db key into an instance of the Adapter class. With this instance,\
    \ we prepare a SQL SELECT statement and execute it.\n\n> **Note: Automatic code\
    \ completion**\n> \n> As you type a class name in the Eclipse code editor, a list\
    \ of available classes becomes visible. So, if you choose a class from the autocomplete\
    \ list, Eclipse automatically adds the line of the namespace. But if you don't\
    \ do that, check whether the namespace is present at the top of the file. For\
    \ example, the namespace for the Laminas Database Adapter is Laminas\\\\Db\\\\\
    Adapter\\\\Adapter."
  merge: -1
  img_proc: true
