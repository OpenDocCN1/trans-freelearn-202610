- pgno: 154
  md: "# # Adding a product to the products table\n\nWe will change the constructor\
    \ of the ProductAdditionContext class to instantiate a **Table Data Gateway**\
    \ implementation, as follows:\n\n```\n```php\npublic function __construct()\n\
    {\n    $this->product = new Product();\n    $this->productTable = $this->getApplication()\
    \ ->\n        getServiceManager()->get('ProductTable');\n}\n```\n```\n\nAs we\
    \ can see, we are setting an `$this->productTable` attribute. Therefore, this\
    \ attribute must be declared at the beginning of the class:\n\n```\n```php\nprivate\
    \ ?ProductTable $productTable = null;\n```\n```\n\nThe `$this->productTable` attribute\
    \ receives an object from the get method of the Laminas\\ ServiceManager\\ServiceManager\
    \ class. We recover the instance of ServiceManager from an instance of Laminas\\\
    Mvc\\Application. This last instance is created by a private `getApplication`\
    \ method that we must implement in the following way:\n\n```\n```php\nprivate\
    \ function getApplication()\n{\n    $appConfig = require __DIR__ . '/../../../config/\n\
    \    application.config.php';\n    if (file_exists(__DIR__ . '/../../../config/\n\
    \    development.config.php')) {\n        $appConfig = ArrayUtils::merge($appConfig,\n\
    \        require __DIR__ . '/../../../config/\n        development.config.php');\n\
    \    }\n\n    return Application::init($appConfig);\n}\n```\n```\n\nThe Application\
    \ instance is created by the `init` method of this class, from the application\
    \ configuration."
  merge: -1
  img_proc: true
