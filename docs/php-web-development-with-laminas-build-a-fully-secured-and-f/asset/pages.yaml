- pgno: 98
  md: "Now that we have implemented the use case, let us run our first test.\n\n#\
    \ Running the SchoolClassTest->testListing test\n\nWe will create a test to check\
    \ whether a list of school classes is generated successfully. This test will be\
    \ implemented by the SchoolClassTest->testListing method:\n\n+   1. The SchoolClassTest->testListing\
    \ method looks as follows:\n\n```\npublic function testListing()\n{\n    $rows\
    \ = SchoolClassTable::getInstance()->getAll();\n    $this->assertIsIterable($rows);\n\
    }\n```\n\nOf course, this test will fail because the SchoolClassTable class doesn't\
    \ exist yet. This class is an implementation of the Table Data Gateway pattern\
    \ using laminas-db. The SchoolClassTable instance is not created directly with\
    \ a new operator, but it is provided by an implementation of the **Singleton**\
    \ pattern, which limits the number of instances for a class. This pattern is very\
    \ useful when you know that only one instance of a class is necessary for a specific\
    \ context, and you don't want a developer to create another instance accidentally\
    \ after implementing a new feature or fixing a bug. The Singleton pattern needs\
    \ a private constructor, a static attribute for the single instance, and a static\
    \ method for creating and recovering this instance. The SchoolClassTable class\
    \ must stay in the src folder.\n\n**Note**\nFrom now on, we won't talk about things\
    \ we already know, such as creating classes with Eclipse.\n\n+   2. Create the\
    \ SchoolClassTable class in the src folder, always with the School namespace.\
    \ This class needs to have an instance for the data table gateway of school classes.\
    \ Hence, we will implement an $instance attribute for SchoolClassTable like this:\n\
    \n```\nprivate static ?SchoolClassTable $instance = null;\n```\n\nThe question\
    \ mark before the type of the $instance attribute allows us to initialize it with\
    \ null. We postpone object creation until it is required.\n\n+   3. The constructor\
    \ of SchoolClassTable looks as follows:\n\n```\nprivate function __construct(TableGatewayInterface\n\
    \    $tableGateway)\n{\n```"
  merge: -1
  img_proc: true
- pgno: 99
  md: "```\n$this->tableGateway = $tableGateway;\n}\n```\n\nObserve that we are injecting\
    \ an instance of TableGatewayInterface into a $this->tableGateway attribute. TableGatewayInterface\
    \ is an interface for Table Data Gateway implementations. It is good practice\
    \ to use interfaces instead of classes in dependency injection contexts because\
    \ it makes it easy to replace the implementations. We will use here the Laminas\
    \ implementation for Table Data Gateway, but the interface allows you to change\
    \ the implementation to another without changing the SchoolClassTable class. The\
    \ changes are inevitable; however, we can reduce the number of changes and the\
    \ need for rewriting code.\n\n+   4. Finally, to complete the **Singleton** pattern,\
    \ we will have a SchoolClassTable :: getInstance method:\n\n```\npublic static\
    \ function getInstance() :\nSchoolClassTable\n{\n if (null == self:::$instance)\
    \ {\n $adapter = self::getAdapter();\n $resultSetPrototype = new ResultSet();\n\
    \ $resultSetPrototype->setArrayObjectPrototype\n (new SchoolClass());\n $tableGateway\
    \ = new TableGateway('classes',\n $adapter, null, $resultSetPrototype);\n self:::$instance\
    \ = new\n SchoolClassTable($tableGateway);\n }\n return self:::$instance;\n}\n\
    ```\n\nThe TableGateway class of laminas-db requires the injection of an AdapterInterface\
    \ instance. This instance is provided by the SchoolClassTable::getAdapter method\
    \ that we have brought from the former SchoolClass class of the school11 project.\n\
    \nKnow that although we are using a database adapter implementation of laminas-db,\
    \ you can replace it with anything that implements AdapterInterface. This is an\
    \ essential feature of Laminas: you can replace most components with others that\
    \ are compatible or write your own component. You have the convenient option of\
    \ delegating a task to a ready component, but you also have the power to take\
    \ control absolutely, by implementing customized code. Of course, you can always\
    \ write your own code in open source software, but in reality, it is sometimes\
    \ difficult to connect your components to existing ones."
  merge: -1
  img_proc: true
- pgno: 100
  md: "You may be curious about the fourth parameter of the TableGateway constructor:\n\
    \n```\n$tableGateway = new TableGateway('classes', $adapter, null, $resultSetPrototype);\n\
    ```\n\nThe first parameter is the table name. The second parameter is the database\
    \ adapter object. The third parameter, which is optional, allows us to inject\
    \ an object that extends the table gateway features. The fourth parameter is also\
    \ optional, but if provided allows us to encapsulate the elements of a result\
    \ set into instances of a model class. Usually, the return of a SQL SELECT statement\
    \ executed by TableGateway will be a collection of ArrayObject, a PHP native class.\
    \ But the ResultSet class, through the setArrayObjectPrototype method, allows\
    \ us to define the type of result collection. In this case, we defined that queries\
    \ made by SchoolClassTable will return a collection of SchoolClass instances.\n\
    \nRight, by this point, we have solved the absence of SchoolClassTable. But the\
    \ SchoolClassTest->testListing test keeps failing. This failure occurs because\
    \ the test expects that the SchoolClassTable instance has a getAll method. At\
    \ this moment, we will avoid duplicate work. As both the use cases have similarities,\
    \ do you agree that they share common code? The getAll method is an example. The\
    \ StudentTable class, which we will have to implement for the managing students\
    \ use case, also needs a getAll method.\n\nWhen one or more classes have duplicated\
    \ code, it's time to create a parent class that encapsulates the common code.\n\
    \n+   5. So, we will create an AbstractTable class in the src folder. This class\
    \ must implement the getAll method like this:\n\n```\npublic function getAll()\
    \ : iterable\n{\n    return $this->tableGateway->select(null);\n}\n```\n\nThis\
    \ method is the object-oriented dream: only one line of code. The method comprises\
    \ total outsourcing. What does this mean? The getAll method does not do anything\
    \ directly. The getAll method has to call another method. Instead of writing SQL\
    \ SELECT by ourselves, we let the TableGateway instance write it through its select\
    \ method. We don't need to write the SQL SELECT statement or worry about quotation\
    \ marks.\n\nAbstractTable will keep the common code for Table Data Gateway implementations\
    \ of our project; AbstractTable has also declared the attribute for the TableGateway\
    \ instance:\n\n```\nprotected TableGatewayInterface $tableGateway;\n```\n\nIt's\
    \ a protected attribute because it must be visible only to the children of AbstractTable,\
    \ which will deal with it."
  merge: -1
  img_proc: true
- pgno: 101
  md: "We have established that `SchoolClassTable` must extend `AbstractTable` and\
    \ that database adapter creation is a common feature for both Table Data Gateway\
    \ implementations, so the static `getAdapter` method must be in the `AbstractTable`\
    \ class.\n\nNow, the `SchoolClassTest->testListing` method will run successfully.\
    \ But the other test methods will fail. Of course, we need to refactor them too.\n\
    \n+   6. Let's refactor the `SchoolClassTest->testInserting` method. This test\
    \ method covers inserting, selecting, and deleting actions. We insert a record,\
    \ recover it, and delete it:\n\n```\npublic function testInserting()\n{\n    $schoolClassTable\
    \ = SchoolClassTable::\n        getInstance();\n\n    $schoolClass = new SchoolClass(0,\
    \ '1st year');\n    $schoolClassTable->save($schoolClass);\n\n    $schoolClass\
    \ = SchoolClassTable::getInstance()\n        ->getByField('name', '1st year');\n\
    \    $this->assertEquals('1st year',\n        $schoolClass->name);\n    $code\
    \ = $schoolClass->code;\n    $schoolClass = SchoolClassTable::\n        getInstance()->getByField('code',\
    \ $code);\n    $this->assertEquals('1st year',\n        $schoolClass->name);\n\
    \    $schoolClassTable->delete($schoolClass->code);\n    $schoolClass = SchoolClassTable::\n\
    \        getInstance()->getByField('code', $code);\n    $this->assertEmpty($schoolClass->name);\n\
    }\n```\n\nIf you try to run the `SchoolClassTest` test case now, it will fail\
    \ because the `SchoolClassTable` class doesn’t have the `getByField` method. This\
    \ method will replace the `getByCode` and `getByName` methods of the former `SchoolClass`\
    \ class of the `school1` project."
