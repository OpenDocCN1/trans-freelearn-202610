- pgno: 348
  md: "Looking at this code, we can see that the `AuthenticationService->hasIdentity`\
    \ method returns a Boolean value. Maybe you didn't need to worry about this before,\
    \ but think about it now – how does `AuthenticationService` know whether there\
    \ is an authenticated identity?\n\nHere, we have an example of one of the advantages\
    \ of free and open source software – we can see how things work. If we find the\
    \ source code of the `AuthenticationService->hasIdentity` method, we will see\
    \ the following lines:\n\n```\npublic function hasIdentity()\n{\n    return !\
    \ $this->getStorage()->isEmpty();\n}\n```\n\nNote that `AuthenticationService`\
    \ answers that there is an authenticated identity if its storage is not empty.\
    \ However, the storage content is not tested. This is not a problem if there is\
    \ only one authentication control, but it can cause unexpected behavior for systems\
    \ with more than one authentication control, such as whatstore.\n\nWhat is this\
    \ unexpected behavior? Imagine that a customer is authenticated in the Store module.\
    \ This customer, Mr. Bad Guy, specifically, is someone with bad intentions. He\
    \ tries to call some endpoints to discover some interesting URLs until he discovers\
    \ that there is an `/inventory` route. The expected behavior is that the `/inventory`\
    \ route shows a login page. However, Mr. Bad Guy, who has been authenticated in\
    \ the `Store` module, goes directly to the menu page of the `Inventory` module.\
    \ It does not mean that Mr. Bad Guy will get to access the `Inventory` registrations,\
    \ because there are authorization controls too, but this direct access to the\
    \ menu page is clearly a security failure.\n\nWhat is the cause of the problem?\
    \ It's the use of the `AuthenticationService->hasIdentity` method for two authentication\
    \ controls in the same application. The `laminas-authentication` documentation\
    \ presents samples for only one authentication control. This suggests that the\
    \ `AuthenticationService->hasIdentity` method is usually used for only one authentication\
    \ control. In fact, you can use the `laminas-authentication` component for as\
    \ many authentication controls as you want. It is only necessary to isolate each\
    \ authentication context. This means avoiding the direct use of the `AuthenticationService->hasIdentity`\
    \ method to check whether authentication was done successfully. We will do this\
    \ next.\n\n# Modifying the class for identity management\n\nWe have already created\
    \ a generic identity management class (`IdentityManager`, in the `Generic` module)\
    \ and extended it for each module. Now, we will modify this class to manage identities\
    \ based on a context – more specifically, the namespace of the identity manager\
    \ class, which will be different for each module. Let us modify the `Generic\\\
    Model\\IdentityManager` class in three steps."
  merge: -1
  img_proc: true
- pgno: 349
  md: "First, let us add a getNamespace method to the class:\n\n```\nprotected function\
    \ getNamespace() : string\n{\n    $fqcn = explode('\\\\',static::class);\n   \
    \ return $fqcn[0];\n}\n```\n\nThis method will return the namespace of the called\
    \ class. This means that it is not exactly a Generic namespace. If the method\
    \ is called by a subclass, the considered namespace will be the namespace of the\
    \ subclass. For example, if the getNamespace method is called by Inventory\\\\\
    Model\\\\IdentityManager, it will return Inventory.\n\nThe second step is modifying\
    \ the Generic\\\\Model\\\\IdentityManager->__construct method:\n\n```\npublic\
    \ function __construct(AdapterInterface $adapter,\narray $encryptionMethod)\n\
    {\n    $this->adapter = $adapter;\n    $this->encryptionMethod = $encryptionMethod;\n\
    \    $this->auth = new AuthenticationService();\n    $storage = new Session($this->getNamespace());\n\
    \    $this->auth->setStorage($storage);\n}\n```\n\nNote that we have added two\
    \ new lines to the constructor method. We instantiate the Laminas\\\\Authentication\\\
    \\Storage\\\\Session class, defining as a namespace the value of the namespace\
    \ returned by the getNamespace method. So, we will have a namespace inside the\
    \ session, avoiding possible session key overriding for different IdentityManager\
    \ instances.\n\nThe third step is modifying the Generic\\\\Model\\\\IdentityManager->hasIdentity\
    \ method:\n\n```\npublic function hasIdentity() : bool\n{\n    if ($this->auth->hasIdentity())\
    \ {\n        $storage = $this->auth->getStorage();\n        error_log('namespace:\
    \ ' . $storage->\n        >getNamespace());\n        return ($storage->getNamespace()\
    \ == $this->\n        >getNamespace());\n    }\n}\n```"
  merge: -1
  img_proc: true
