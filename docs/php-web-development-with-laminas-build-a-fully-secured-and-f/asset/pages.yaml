    # # BDD with Behat


    In Chapter 3, Using Laminas as a Library with Test-Driven Development, we experienced
    the TDD approach. TDD is a very important skill to ensure the stability of software.
    When you practice TDD, you know that all the software continues to work after
    you change a part of it. Beyond this, the test classes document the business rules,
    and thus, TDD helps you to maintain useful documentation. A test class with running
    tests tells you that the rules contained in the tests are enforced by classes
    or subroutines of the software.


    Test cases written in the xUnit pattern could be more readable for non-programmers
    than the direct implementation of the software, but you are still using a programming
    language to express business rules. How wonderful would it be if we could write
    tests in a more human language? BDD provides this. It is an approach that extends
    TDD, using an abstraction layer over the automated tests, written by and for programmers.
    It allows the writing of more understandable stories for those who know a business
    but don''t know, or even need to know, the technology they are using to develop
    their applications.


    **The xUnit pattern**

    Kent Beck and Erich Gamma created JUnit, a test framework for Java. The JUnit
    architecture was used as a base for creating test frameworks for other languages
    such as PHP. There is a family of test frameworks that follow the same pattern
    for the implementation of unit tests, test cases, and test suites. Kent Beck and
    other authors such as Gerard Meszaros call this family xUnit, where the letter
    x is a variable placeholder in a programming language. The common structure of
    xUnit frameworks is well described by Gerard Meszaros in his book xUnit Test Patterns:
    Refactoring Test Code (Addison-Wesley).


    We will use BDD to implement the model layer for the Whatstore project. We need
    to install a BDD tool for PHP. There is a BDD implementation for PHP called Behat.


    Using the Composer editor of Eclipse, add a development dependency for the behat/behat
    package. Remember that you already did something like this in Chapter 3, Using
    Laminas as a Library with Test-Driven Development, when you installed PHPUnit.
    After adding the package, save the file, and click on the Update dependencies
    (including require-dev) button to download Behat.


    Based on what we have learned in Chapter 2, Setting Up the Environment for Our
    E-Commerce Application, we will create some external tool configurations for the
    most common invocations of the Behat executable. Using the Run | External Tools
    | External Tools Configurations menu, create the following three configurations:


    +   - **Behat initialization:**

    +     Name: Behat init'
