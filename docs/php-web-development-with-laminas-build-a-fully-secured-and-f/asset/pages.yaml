- pgno: 369
  md: 'The `Request->isXmlHttpRequest` method returns `true` if the request was made
    with XMLHttpRequest. This object makes asynchronous requests. As XMLHttpRequest
    is handled by JavaScript on the client side, and XML was used a lot to exchange
    data between the client and server sides, the use of XMLHttpRequest received a
    special name: **Asynchronous JavaScript and XML** (AJAX). Although XML use is
    increasingly rare nowadays because of the lightness of JSON, the acronym AJAX
    remains in use.


    XMLHttpRequest specification

    XMLHttpRequest is an open web standard documented at https://xhr.spec.whatwg.org.


    If you click on the **Asynchronous request** button, you will see an alert window,
    as shown in Figure 13.12. It shows that the page has not been reloaded:


    ![](img/e6cf5550804ccae9d1859270da8688f5_369_0.png)


    Figure 13.12 – Response to asynchronous requests


    If you click on the **Synchronous request** button, you will be taken to the following
    page:


    ![](img/e6cf5550804ccae9d1859270da8688f5_369_1.png)


    Figure 13.13 – Response to synchronous requests


    You can see that the page has been reloaded. Observe that the same controller
    action can handle synchronous and asynchronous requests, generating different
    responses as per the situation.


    In the next subsection, we will see a way to exchange messages between a controller
    and a view script without using the ViewModel class.'
  merge: -1
  img_proc: true
- pgno: 370
  md: "# # Exchanging messages between the controller and view layers\n\nIf you click\
    \ on the Flash messenger button, you will be taken to the following page:\n\n\
    ![](img/e6cf5550804ccae9d1859270da8688f5_370_0.png)\n\nFigure 13.14 – Message\
    \ stored by the FlashMessenger plugin\n\nThe Flash messenger button calls the\
    \ IndexController->flashMessengerAction method like so:\n\n```\npublic function\
    \ flashMessengerAction()\n{\n    $this->flashMessenger()->addMessage('You called\n\
    \        this action at ' . date('H:i:s'));\n    $messages = $this->flashMessenger()->getMessages();\n\
    \    return new ViewModel(['messages' => $messages]);\n}\n```\n\nThe FlashMessenger\
    \ class used in the controller stores messages in the session container. The messages\
    \ are stored in a message stack, which can be accessed by the getMessages method.\
    \ In short, the FlashMessenger class is a message manager. The normal way to send\
    \ the messages stored in an instance of FlashMessenger to the view script would\
    \ be to inject the output of the getMessages method in the ViewModel constructor,\
    \ as we can see in the previous code snippet. But as we can see in the following\
    \ code snippet, this is not necessary:\n\n# ## flash-messenger.phtml\n\n```\n\
    <h1>Messages</h1>\n<?=$this->flashMessenger()->render() ?>\n```"
  merge: -1
  img_proc: true
- pgno: 371
  md: "Observe that the view script related to the `flashMessengerAction` method does\
    \ not use the `$messages` variable injected in `ViewModel`. Instead of this, the\
    \ view script uses a view helper of `FlashMessenger`, which has a `render` method.\
    \ The `render` method avoids iterating over a message array, outputting the content\
    \ as simple text.\n\n`FlashMessenger` is a controller plugin, and it is not a\
    \ part of `laminas-mvc`. You have to install it via Composer separately.\n\nThere\
    \ are two ways to use a not-embedded controller plugin. The easiest is to add\
    \ the plugin as a module in the `modules.config.php` file. You must add the **Fully\
    \ Qualified Class Name (FQCN):**\n\n```\n`'Laminas\\\\Mvc\\\\Plugin\\\\FlashMessenger'`\n\
    ```\n\nThe alternative and more verbose way is to configure the plugin in the\
    \ `module.config.php` file of the module where it will be used. You need to create\
    \ a `controller_plugins` key, with `factories` and `aliases` subkeys. The following\
    \ code snippet shows how the `FlashMessenger` plugin could be configured in the\
    \ `tripsandtricks` application:\n\n```\n```php\n'controller_plugins' => [\n  \
    \  'factories' => [\n        FlashMessenger::class => InvokableFactory::class\n\
    \    ],\n    'aliases' => [\n        'flashMessenger' => FlashMessenger::class\n\
    \    ]\n],\n```\n```\n\nWhile the `factories` key defines how to create the `FlashMessenger`\
    \ instance, the `aliases` key defines the name that you will use to call the plugin\
    \ in the controller actions.\n\n![](img/e6cf5550804ccae9d1859270da8688f5_371_0.png)"
  merge: -1
  img_proc: true
- pgno: 372
  md: "This is the configuration for the controller plugin. To use the FlashMessenger\
    \ view helper, if you didn't configure the component as a module, you need to\
    \ add a view_helpers key to the modules.config.php file, as follows:\n\n```\n\
    'view_helpers' => [\n    'invokables' => [\n        'flashMessenger' => \\\\Laminas\\\
    \\Mvc\\\\Plugin\\\\\n    FlashMessenger\\\\View\\\\Helper\\\\FlashMessenger::class\n\
    \    ]\n]\n```\n\nThe controller plugin configuration should be new to you, but\
    \ the view helper configuration is not. In fact, you already coded this configuration\
    \ in Chapter 8, Creating Forms and Implementing Filters and Validators, to enable\
    \ form view helpers.\n\nNext, we will see the different ways to end controller\
    \ actions.\n\n# Finishing controller actions\n\nIn most cases, a controller action\
    \ can terminate when one of the following objects is returned:\n\n+   * A ViewModel\
    \ instance, if it is a response for a synchronous request, which expects an HTML\
    \ page.\n\n+   * A JSONModel instance, if it is a response for an asynchronous\
    \ request, which expects JSON data.\n\n+   * A call to the `$this->redirect()\
    \ ->toRoute()` method. This method expects two arguments; the first is the name\
    \ of the route and the second is an array with route parameters. This method causes\
    \ an HTTP redirecting request (HTTP status 302).\n\nThere are other Laminas\\\
    View\\Model classes: ConsoleModel, for generating output for terminals, and FeedModel,\
    \ for generating output for RSS consumers. You can also extend Laminas\\View\\\
    Model ModelInterface and create specific outputs.\n\n# Summary\n\nIn this chapter,\
    \ we learned some useful tips and tricks relating to Laminas in the three layers\
    \ of an MVC application.\n\nWe first learned how to customize filters and validators\
    \ for model layers using the Laminas interfaces. We learned about the required\
    \ methods for using mapped models or models integrated with forms."
  merge: -1
  img_proc: true
