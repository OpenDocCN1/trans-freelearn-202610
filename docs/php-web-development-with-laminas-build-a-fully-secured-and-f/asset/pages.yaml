- pgno: 332
  md: "```\n$validatorChain = new ValidatorChain();\nforeach($validators as $validator)\
    \ {\n    $validatorChain->attach($validator);\n}\n$input->setValidatorChain($validatorChain);\n\
    $this->add($input);\nreturn $this;\n}\n}\n```\n\nThe addInput method receives\
    \ the input name, a filter set, and a validator set as arguments. The addInput\
    \ method returns a reference for the InputFilter instance. So, we can call more\
    \ than one method from the InputFilter instance in one only instruction – for\
    \ example, to add two fields in one only instruction:\n\n```\n$inputFilter = new\
    \ InputFilter();\n$inputFilter->addInput(\"code\") ->addInput(\"name\");\n```\n\
    \nYou don't need to repeat the variable name of the InputFilter instance to call\
    \ another method, or to call the same method several times. It is an advantage\
    \ to return $this for methods that wouldn't return anything.\n\nNext, we will\
    \ replace Laminas\\\\InputFilter\\\\InputFilter with Generic\\\\Model\\\\InputFilter\
    \ in the Discount and Product classes. This replacement will reduce the getInputFilter\
    \ implementations in some lines. For example, the getInputFilter method of the\
    \ Discount class will look like this:\n\n```\npublic function getInputFilter()\
    \ : InputFilter\n{\n    $inputFilter = new InputFilter();\n\n    $inputFilter->addInput('code',\
    \ [new ToInt()])\n    ->addInput('name',\n    [\n        new StringToUpper(),\n\
    \        new Alnum(true)\n    ],\n    [new StringLength(['min' => 3])]\n    )\n\
    }\n```"
