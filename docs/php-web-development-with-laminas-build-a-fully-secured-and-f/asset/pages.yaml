- pgno: 280
  md: "```\nreturn $this->tableGateway->selectWith\n    ($select);\n}\n```\n\nNotice\
    \ that the ResourceTable->getResourcesFromAnEmployee method uses an instance of\
    \ the Laminas\\Db\\Sql\\Where class to define a filter with the SQL IN clause.\
    \ Note also that this method uses the Laminas\\Db\\Sql\\Expression class to add\
    \ the DISTINCT keyword to the name field of the resources table. The use of DISTINCT\
    \ is to avoid repeated resources when an employee has more than one role and two\
    \ or more roles have permission to access the same resources.\n\n+   Creates an\
    \ instance of the Laminas\\Permissions\\Rbac\\Rbac class and associates the role\
    \ object with this instance.\n\n+   Creates an instance of the Laminas\\Session\\\
    Container class and stores the Rbac instance in the session.\n\nSo, we store the\
    \ permissions of the authenticated employee in the session and can check them\
    \ at any time. As we are storing the access data in the session when the user\
    \ logs into the system, we need to remove this data when the user logs out of\
    \ the system. We will use this in the IndexController->logoutAction method:\n\n\
    ```\npublic function logoutAction()\n{\n    $auth = new AuthenticationService();\n\
    \    $auth->clearIdentity();\n    $session = new SessionManager();\n    try {\n\
    \        $session->destroy();\n    } catch (\\Exception $e) {\n        error_log($e->getMessage());\n\
    \    }\n\n    return $this->redirect()->toRoute('inventory');\n}\n```\n\nIn the\
    \ preceding code block, we used the Laminas\\Session\\SessionManager class to\
    \ destroy the session. Notice that we did this inside a try/catch structure. Why?\
    \ Because this method can be run by tests, which don't create sessions."
