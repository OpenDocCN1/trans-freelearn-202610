    Form\\Form class.\n+   • The superclass constructor receives the value for the\
    \ name attribute of the HTML form as an argument.\n+   • Inside the inheritor\
    \ Laminas\\Form\\Form class constructor, we define the form elements.\n+   • Each\
    \ HTML form element has a class with an appropriate name. For example, for HTML\
    \ INPUT elements with type equal to “text,” there is the Laminas\\Form\\Element\\\
    Text class.\n+   • The Laminas\\Form\\Element class family groups HTML form elements.\n\
    +   • The Laminas\\Form\\Element constructor receives a value as the first argument,\
    \ which will be used both for the id attribute and the name attribute.\n+   •\
    \ Both the Laminas\\Form\\Form and Laminas\\Form\\Element class constructors have\
    \ a second argument, but it is optional.\n+   • The setLabel method allows you\
    \ to define a label for an HTML form element.\n+   • The setAttribute method allows\
    \ you to define the value of any HTML element attribute. For example, we have\
    \ defined a value for the autofocus attribute of the name input field.\n+   •\
    \ Laminas\\Form\\Element instances need to be associated to the Laminas\\Form\\\
    Form instance by the Laminas\\Form\\Form->add method.\n\nRight, but how do we\
    \ use the DiscountForm class? Well, we need to create a DiscountForm instance\
