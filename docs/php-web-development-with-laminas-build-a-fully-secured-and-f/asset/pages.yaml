  md: '# Generating API documentation


    It is no use having thousands of features if nobody knows about them. Developers
    need documentation.

    A developer will probably forget what they did last week, and imagine a new developer
    entering during

    the middle of a project. This is an important point.


    Another important point is the consumption of our application API by other clients.
    We talked about

    this in Chapter 7, Request Control and Data View. The creators and maintainers
    of clients will need

    good documentation to know how to consume the whatstore services.


    In this section, we will create API documentation based on the OpenAPI Specification,
    or Swagger

    Specification. There is an awesome component for generating Swagger documentation
    from PHP

    annotations – swagger-php. But swagger-php requires that you write some PHP code
    to generate

    Swagger documentation. We will use another component, swagger-docs, that extends
    swagger-php

    and requires only the annotations in the classes to be documented.


    > Swagger

    > You can read more about Swagger at https://swagger.io/resources/open-api


    We will install swagger-docs using Composer, like this:


    ```

    composer require fgsl/swagger-docs

    ```


    You also can use the Eclipse Composer interface, as we learned in Chapter 3, Using
    Laminas as a

    Library with Test-Driven Development.


    We need to add an @OA\Info annotation in one single file to define a title and
    a version for API

    documentation. We will include this annotation in a new controller class in the
    Application

    module – APIController. The annotation block will be immediately before the class
    declaration,

    as we can see in the following complete source code:


    # APIController.php


    ```

    <?php

    declare(strict_types=1)

    namespace Application\Controller;

    use Laminas\Mvc\Controller\AbstractActionController;

    use Laminas\View\Model\ViewModel;

    /**

    * @OA\Info(title="Whatstore API", version="0.1")

    ```'
