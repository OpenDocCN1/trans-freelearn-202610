    # Creating the ProductAPIController class


    Create a ProductAPIController.php file in the src/Controller folder of the Inventory
    module. Let us see, part by part, the source code for the ProductAPIController.php
    file. This file begins with the following content:


    ```

    <?php

    namespace Inventory\Controller;

    use Laminas\Mvc\Controller\AbstractRestfulController;

    use Laminas\View\Model\JsonModel;

    use Inventory\Model\Product;

    use Inventory\Model\ProductTable;

    ```


    In the first part of the ProductAPIController class, we use four dependencies.
    The ProductAPIController class extends AbstractRestfulController. This superclass
    is designed to map the HTTP methods to specific methods:


