  md: "```\npublic function __construct()\n{\n    $this->product = new Product();\n\
    }\n\n/**\n * @Given there is a product called :arg1, which costs\n * $:arg2\n\
    \ */\npublic function thereIsAProductCalledWhichCosts\n($arg1, $arg2)\n{\n   \
    \ $data = [\n        'name' => $arg1,\n        'price' => $arg2\n    ];\n\n  \
    \  $this->product->exchangeArray($data);\n}\n```\n\nObserve that we pass $arg1\
    \ (product name) and $arg2 (product price) as arguments to the exchangeArray method\
    \ of the Product class. Of course, if you try to run **Behat run** now, a failure\
    \ will occur because the Product class doesn’t exist yet. We are in the first\
    \ step of TDD – a test that fails. Remember that BDD is an extension of TDD, and\
    \ then we keep the TDD steps in BDD. If the test fails, we are in debt. We need\
    \ to write the code for the test run successfully. Let’s create the Product model.\n\
    \n> Note – Behat arguments in definitions\n> \n> The values identified as arguments\
    \ in the feature files are mapped to context classes with the aid of the @Given,\
    \ @When, and @Then annotations. These annotations inform whether the following\
    \ method has or does not have an argument. If you change the value of an argument\
    \ in a definition, you don’t need to change the implementation. For example, if\
    \ the product price is changed in the productaddition.feature file, you don’t\
    \ need to change anything in the ProductAdditionContext class. This avoids the\
    \ need to make changes in classes if only a value from a rule has changed.\n\n\
    The Product class will stay inside the Inventory module. Create a Model folder\
    \ in the src folder of this module to contain the model classes. The source code\
