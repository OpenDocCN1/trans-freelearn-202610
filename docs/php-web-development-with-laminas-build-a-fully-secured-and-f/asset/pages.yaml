- pgno: 293
  md: '# # Summary


    In this chapter, we have learned how to implement roles and resources registration,
    in a similar way to what we did in previous chapters. We talked about the concepts
    of roles and resources related to our project. We also learned how to associate
    resources with roles and how to associate roles with Inventory module users (employees).
    After presenting these registrations, we learned how to implement access control
    with the laminas-permissions component and how to verify user permissions with
    the aid of laminas-eventmanager. Finally, we saw how to decouple login and logout
    logic from the controller layer, creating an identity management class. We also
    saw how to prevent attacks by unhappy fired employees.


    In the next chapter, we will learn how to implement a product basket, which will
    allow the Store module user (customer) to select products and make a purchase.


    # ## Further reading


    If you want to learn more about authorization approaches, here are some good articles
    to read:


    +   * ACL approach: article by Ravi S. Sandhu and Pierangela Samarati at https://www.profsandhu.com/cs5323_s18/SS-1994.pdf

    +   * RBAC approach: article by Ravi S. Sandhu, Edward J. Coyne, Hal L. Feinstein,
    and Charles E. Youman at https://csrc.nist.gov/CSRC/media/Projects/Role-Based-Access-Control/documents/sandhu96.pdf'
