- pgno: 290
  md: "Since IdentityManager has assumed responsibilities from IndexController, we\
    \ need to refactor this controller class. Let us start with the IndexController\
    \ constructor:\n\n```\n```php\nprivate ?IdentityManager $identityManager;\n\n\
    public function __construct(IdentityManager\n        $identityManager)\n{\n  \
    \  $this->identityManager = $identityManager;\n}\n```\n```\n\nAs you can see,\
    \ instead of receiving two dependencies, now IndexController receives only the\
    \ IdentityManager instance.\n\nThe IndexController->loginAction method will be\
    \ more concise with the delegation of authentication for IdentityManager:\n\n\
    ```\n```php\npublic function loginAction()\n{\n    $nickname = $this->request->getPost('nickname');\n\
    \    $password = $this->request->getPost('password');\n\n    $logged = $this->identityManager->login($nickname,\n\
    \        $password);\n\n    return new JsonModel([\n        'logged' => $logged\n\
    \    ]);\n}\n```\n```\n\nSimilarly, the IndexController->logoutAction method will\
    \ have fewer lines of code:\n\n```\n```php\npublic function logoutAction()\n{\n\
    \    $this->identityManager->logout();\n\n    return $this->redirect()->toRoute('inventory');\n\
    }\n```\n```\n\nYou should think of a controller class as a manager. A manager\
    \ doesn’t do everything. They delegate tasks. A controller class should delegate\
    \ responsibilities to model or view classes."
  merge: -1
