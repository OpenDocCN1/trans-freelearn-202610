- pgno: 337
  md: "The preceding snippet will render a search box, as we can see in Figure 12.2:\n\
    \n![](img/e6cf5550804ccae9d1859270da8688f5_337_0.png)\n\nFigure 12.2: The search\
    \ box on the whatstore home page\n\nThe search form will make an HTTP POST request\
    \ to the IndexController default action of the Store module. Then, we need to\
    \ modify the default action, the indexAction method, with the following implementation:\n\
    \n```\npublic function indexAction()\n{\n    $name = $this->getRequest()->getPost('name');\n\
    \    $where = null;\n    if (!empty($name)) {\n        $where = new Where();\n\
    \        $name = strtoupper($name);\n        $where->like('products.name', \"\
    %$name%\");\n    }\n    $products = $this->productTable->getAll($where);\n   \
    \ $form = new ProductForm();\n    return new ViewModel([\n        'form' => $form,\n\
    \        'products' => $products\n    ]);\n}\n```\n\nYou can see that in the IndexController->indexAction\
    \ method, we have added a check for data provided by an HTTP POST request. If\
    \ the name field is sent, the data table gateway for products (the ProductTable\
    \ class) receives a Where object, configured with a SQL LIKE operator. Laminas’"
  merge: -1
  img_proc: true
- pgno: 338
  md: "Where class encapsulates all SQL SELECT operators to filter queries. We have\
    \ used the strtoupper function because product names are stored in uppercase.\n\
    \nOf course, for the ProductTable->getAll method to be able to run a SQL SELECT\
    \ statement, we have to modify the method because the current implementation expects\
    \ only equality filters. To support the use of LIKE and any other SQL SELECT operator,\
    \ the ProductTable->getAll method must be changed to the following snippet:\n\n\
    ```\npublic function getAll($where = null): iterable {\n    $select = new Select($this->\n\
    \        tableGateway->getTable());\n    $select->join('discounts', 'products.code_discount\n\
    \        =discounts.code', ['name_discount' => 'name']);\n    if (!is_null($where))\
    \ {\n        if (is_array($where)) {\n            $parsedWhere = [];\n       \
    \     foreach($where as $index => $value) {\n                $parsedWhere['products.'\
    \ . $index] =\n                $value;\n            }\n            $select->where($parsedWhere);\n\
    \        } else {\n            $select->where($where);\n        }\n    }\n   \
    \ return $this->tableGateway->selectWith($select);\n}\n```\n\nRemember that the\
    \ ProductTable->getAll method already supports several equality filters joined\
    \ by an AND operator. Now, this method can use any SQL SELECT operator through\
    \ a Laminas Where class.\n\nWith these surgical modifications in three files,\
    \ the customer is able to search for products by name on the home page.\n\nIn\
    \ the next section, we will learn how to generate API documentation."
