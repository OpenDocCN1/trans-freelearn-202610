    \ if you accept establishing a strong coupling with Laminas oriented-object mapping,\
    \ there is the option to inherit the TableGateway or AbstractTableGateway classes.\
    \ To inherit can be more convenient, but, as we have said, using classes through\
    \ dependency injection provides more flexibility. To use is better than to be,\
    \ when you consider that changes in software are a certainty.\n\nAs we did with\
