    # ## Testing the login page


    According to the example, we access http://localhost:8000/inventory and fill the
    login form with the data of the inserted employee.


    You might get frustrated when, after clicking on the **login** button, a message
    saying **Invalid data!** appears. “But what is wrong?” you might think. You must
    have typed the employee nickname and password correctly, right? I believe you.
    In fact, there is a little detail related to the password – it is encrypted when
    the employee is inserted. So, we have to compare the encrypted password provided
    by the employee with the encrypted password stored in the *employees* table.'
