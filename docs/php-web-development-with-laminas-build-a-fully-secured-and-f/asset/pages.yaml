  md: 'a feature file for the use case product deletion. In fact, you can organize
    the features for grouping use cases and, therefore, avoid repetitions.


    With this, we have concluded what you need to know about model creation for Lamias
    projects aided by Behat.


    # Summary


    In this chapter, we have provided an introduction to BDD with Behat. We have learned
    that BDD allows us to build on the useful skills of TDD and also gives us a way
    to write user stories that generate part of our test code.


    With the aid of Behat as a BDD tool for PHP, we learned how to create models and
    table mappers from user stories. In fact, we saw that the combination of Behat
    and Lamias is very powerful for the construction of the model layer.


    We also learned to create a `Generic` module with abstract classes to serve other
    modules and reuse generic classes created in *Chapter 4, From Object-Relational
    Mapping to MVC Containers*. The same `Generic` module was used to store an abstraction
    for context classes, the implementations of the behavior test. Here, we learned
    that it is useful to have abstractions to reuse, avoiding the unnecessary work
    and complexity generated by replication. As this act of abstraction occurs for
    every code unit, abstract classes can grow to facilitate more code reuse during
    each evolution stage of a software project. Then, each new feature applied to
    more than one class is a warning to reduce code lines using abstractions.


    In the next chapter, we will create the control and view layers of our application,
    which will use the models and table mappers created in this chapter.'
