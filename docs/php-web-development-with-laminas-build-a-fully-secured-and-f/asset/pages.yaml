  md: "In this section, we have learned how to create a folder for our tests and how\
    \ to create a test class extending the PHPUnit TestCase. Specifically, we have\
    \ created the SchoolClassTest test class. You may have forgotten but we did all\
    \ that for creating the tests for the SchoolClass business class. In the next\
    \ section, we will effectively start to practice TDD.\n\n> **What is a business\
    \ class?**\n> A class directly related to the customer business can be called\
    \ a business class. This kind of class has business rules. The software can have\
    \ many other classes that interact with business classes. Business classes in\
    \ the MVC pattern are known as models.\n\n# Creating a test method in the SchoolClass\
    \ class\n\nRemember, we call the business class SchoolClass in the list.php file\
    \ to get a collection of school classes. So, let us create a test to check this.\
    \ Wait a moment, create a test? But didn't we create the SchoolClass class? Exactly!\
    \ In TDD, we start with a test that fails, so we don't need to create SchoolClass\
    \ before writing the test. We only need the class interface, which we have from\
    \ the class diagram in Figure 3.5.\n\nRight, we know that the Schoolclass ::getAll\
    \ method must return an iterable value. So, let's write a test for it using the\
    \ following steps:\n\n+   1. Create a method named testListing in the SchoolClass\
    \ class.\n+   2. Attribute the output of the Schoolclass ::getAll method to a\
    \ variable named $rows.\n+   3. Pass this $rows variable as an argument to the\
    \ $this->assertIsIterable method.\n\nThe SchoolClass test class will look similar\
    \ to the following code:\n\n# SchoolClassTest.php\n\n```\n<?php\nnamespace SchoolTest;\n\
    use PHPUnit\\Framework\\TestCase;\nuse School\\SchoolClass;\nclass SchoolClassTest\
    \ extends TestCase\n{\n    public function testListing()\n    {\n        $rows\
    \ = SchoolClass::getAll();\n        $this->assertIsIterable($rows);\n    }\n}\n\
    ```"
