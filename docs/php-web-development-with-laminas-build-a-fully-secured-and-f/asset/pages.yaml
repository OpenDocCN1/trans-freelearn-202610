    Now, maybe you’re asking, “But how will the testLoginActionCanBeAccessed method
    ensure that a user can log in if this user does not exist?” At first, it does
    not ensure this. If you look closely, the testLoginActionCanBeAccessed method
    checks whether the HTTP response has the 302 code – in other words, the loginAction
    method – redirected to the other URL. If the user exists, they will be redirected
    to the menu page. The test will fail at this moment, as often happens with tests
    in TDD. But now, after having tests that fail, we can build our new actions.


    # Creating login and logout actions


    If you access `http://localhost:8000/inventory` now, you will see the splash page
    of Laminas because the Inventory homepage was copied from the Application module:


    ![](img/e6cf5550804ccae9d1859270da8688f5_233_0.png)


    Figure 9.1 – The homepage of the Inventory module


    We will modify this page. First of all, we will modify the page layout. According
    to what we said in Chapter 4, From Object-Relational Mapping to MVC Containers,
    page layout is defined by the Application module. We will change some parts of
    the layout.phtml file in the module/Application/view/layout folder.'
