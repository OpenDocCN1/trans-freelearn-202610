    \\Context;\n\nuse Behat\\\\Behat\\\\Context\\\\Context;\nuse Laminas\\\\Stdlib\\\
    \\ArrayUtils;\nuse Laminas\\\\Mvc\\\\Application;\n\nabstract class AbstractContext\
    \ implements Context\n{\n    protected function getApplication()\n    {\n    \
    \    $appConfig = require __DIR__ . '../../../../../config/application.config.php';\n\
    \        if (file_exists(__DIR__ . '../../../../../config/development.config.php'))\
    \ {\n            $appConfig = ArrayUtils::merge($appConfig,\n            require\
    \ __DIR__ . '../../../../../config/development.config.php');\n        }\n\n  \
    \      return Application::init($appConfig);\n    }\n}\n```\n\nOf course, we had\
    \ to change the lines that have file paths because the relative level is different.\
    \ Before, we had three levels to return to root path; now, we have four levels.\n\
    \nFrom now on, the ProductAdditionContext and ProductUpdatingContext classes must\
    \ extend AbstractContext instead of implementing the Context interface. Make this\
    \ change on the declaration of these classes, according to this example for ProductAdditionContext:\n\
