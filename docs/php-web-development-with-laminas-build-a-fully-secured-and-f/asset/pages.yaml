- pgno: 251
  md: "```\n```php\nuse Laminas\\Http\\PhpEnvironment\\Request;\n\nclass InventoryAuthenticationListener\n\
    {\n    public static function verifyIdentity(MvcEvent $event)\n    {\n       \
    \ $routeName = $event->getRouteMatch() ->\n        getMatchedRouteName();\n  \
    \      if (! $routeName == 'inventory') {\n            return;\n        }\n\n\
    \        $authenticationService = new AuthenticationService\n        ();\n   \
    \     if (! $authenticationService->hasIdentity()) {\n            $params = $event->getRouteMatch()\
    \ ->getParams();\n            $controller = $params['controller'];\n         \
    \   $action = $params['action'];\n            if ($controller == 'index' && ($action\
    \ ==\n            'index' || $action == 'login')) {\n                return;\n\
    \            }\n\n            $event->getRouteMatch() ->setParam('controller',\n\
    \            'index');\n            $event->getRouteMatch() ->setParam('action',\n\
    \            'index');\n        }\n    }\n}\n```\n```\n\nLet us see what InventoryAuthenticationListener::verifyIdentity\
    \ does:\n\n+   • The verifyIdentity method receives a MvcEvent object. The MvcEvent\
    \ class is a specialization of the Laminas\\EventManager\\Event class for Laminas\
    \ MVC implementation. It means that MvcEvent class has the generic implementation\
    \ of the Event class for any kind of event and specific implementation for MVC\
    \ events. An MvcEvent object has access to the Application instance and every\
    \ object configured in the modules.config.php file."
  merge: -1
  img_proc: true
- pgno: 252
  md: '+   - We use the `getRouteMatch` method of `MvcEvent` to recover a `RouteMatch`
    object. This object stores data about the matched route. The `RouteMatch->getMatchedRouteName`
    method returns the name of the route that matches the requested URL.

    +   - We use the route name to know whether the requested module is `Inventory`.
    As `InventoryAuthenticationListener` is only for the `Inventory` module, we abort
    the `verifyIdentity` method if the request is from another module.

    +   - If the requested module is `Inventory`, we instantiate the `AuthenticationService`
    class and invoke the `hasIdentity` method. This method returns `true` only if
    a user has been authenticated.

    +   - If a user has not been authenticated, we recover the controller and action
    name from the matched route through the `getParams` method of the `RouteMatch`
    instance.

    +   - The employee – that is, the inventory user – can access the `IndexController->indexAction`
    and `IndexController->loginAction` methods without authentication, and then these
    two methods are ignored by the authentication listener class.

    +   - For any other controller and action of the `Inventory` module, if the user
    is not authenticated, we redirect them to the login page.


    Note that we are intercepting the application request before a controller is instantiated.
    We don’t need to make an HTTP request to redirect the user to the login page.
    The target change is made along the same HTTP request.


    However, who will invoke `InventoryAuthenticationListener`? A listener class is
    invoked by an event. We associate listeners and events with the `Laminas\EventManager\EventManager`
    class. The `Laminas\Mvc\Application` object, created in the `index.php` file,
    has an instance of `Laminas\EventManager\EventManager`. We will use this instance
    to add `InventoryAuthenticationListener` as a listener for the `EVENT_ROUTE` event.
    The `EVENT_ROUTE` event is dispatched after the route is matched, so we have all
    the necessary data about the desired resources of the user and the initial target
    of the request.


    The last line of the `index.php` file in the `public` folder is this:


    ```

    Application::init($appConfig)->run();

    ```


    Let us modify this preceding line, dividing the method invocations with these
    two steps:


    ```

    $app = Application::init($appConfig);

    $app->run();

    ```


    We are doing the same thing in these lines that we did in the preceding line but
    in different lines. The instance of `Laminas\Mvc\Application` is stored now in
    the `$app` variable. Let us introduce a new line between them:'
  merge: -1
  img_proc: true
- pgno: 253
  md: "```\n```php\n$app = Application::init($appConfig);\n$app->getEventManager()\
    \ ->attach(MvcEvent::EVENT_ROUTE,\n[InventoryAuthenticationListener::class, 'verifyIdentity']);\n\
    $app->run();\n```\n```\n\nWhat are we doing here? The attach method of EventManager\
    \ associates a listener to an event. In other words, when the specified events\
    \ are dispatched, the listener is notified. A listener can be a static method,\
    \ an object method, or a function. For static methods, we need to pass an array\
    \ with two elements – the class name and the method name. For the object method,\
    \ we need to pass the instance as the first element of the array. For a function,\
    \ only the function name is needed as the second argument of the attach method.\n\
    \n> **Remember, remember the namespaces!**\n> \n> Remember that InventoryAuthenticationListener\
    \ is defined for the Inventory\\\\Listener namespace, so your index.php file must\
    \ have use Inventory\\\\Listener\\\\InventoryAuthenticationListener; at the top.\
    \ The lack of namespaces is a common source of errors.\n\nLet us modify the menu\
    \ view to show the user identity. Change the content of the MenuController->indexAction\
    \ method of the Inventory module with the following content:\n\n```\n```php\n\
    public function indexAction()\n{\n    $auth = new AuthenticationService();\n \
    \   return new ViewModel(['user' => $auth->\n    getIdentity()]);\n}\n```\n```\n\
    \nThe getIdentity method of the AuthenticationService class returns a matched\
    \ identity in the authentication. In sequence, change the content of the index.phtml\
    \ file in the module/Inventory/view/inventory/menu folder with the following content:\n\
    \n```\n```html\n<h1>Inventory Module</h1>\n\n<p>Hi, <?=$this->user?></p>\n<a href=\"\
    <?=$this->url('inventory',['action' =>\n'logout'])?>\">Logout</a>\n```\n```"
  merge: -1
  img_proc: true
