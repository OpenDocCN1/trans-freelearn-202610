reviews:
- 'no': 9458
  overturn_probability: 0.1
  alternative: 正文小标题 / 章内二级标题
  counter_evidence:
  - 该行采用 Markdown 二级标题（##）格式，若全书以一级标题（#）划分“部分（Part）”，则“##”仅为章内节标题，不应独立成章；
  - 紧邻上文是“### 总结”（三级标题），标题层级从“###”跃升至“##”可能是排版转换导致的层级混淆，而非真实的章起点；
  - “技巧和窍门”作为散装技巧集合，更适合作为前一章总结之后的附录式小节，缺乏统领全章的系统性内容。
  keep_split: true
- 'no': 10011
  overturn_probability: 0.15
  alternative: 结语 / 书末总结性小标题
  counter_evidence:
  - “最后考虑”语义偏向书后的总结性碎言或后记，而非包含独立知识体系的完整章节；
  - 该标题后正文较为零散，主要列举未使用的 Laminas 组件，缺乏章节应有的完整结构与详实内容；
  - 前文“在下一章中……本书即将结束”可视为修辞性收束，该行实际可能是上一章的末节或书末附录标题。
  keep_split: true
- 'no': 10154
  overturn_probability: 0.05
  alternative: 文末索引 / 附录列表
  counter_evidence:
  - “Index”属于书末回检工具，不具备正文章节属性，独立成章会产生仅含索引条目而无实质正文的空章；
  - 其后全为索引项列表（如“- 30 秒规则 312”），不符合章标题后应跟概述段落与子节的上下文特征；
  - 该索引可并入“最后考虑”章作为书末附录，无需单独分章。
  keep_split: true
