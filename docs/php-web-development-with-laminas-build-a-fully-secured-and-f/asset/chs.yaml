- '# 第 1 部分：技术背景


  在本书的这一部分中，您将获得必要的知识，以便为面向对象的 PHP Web 应用程序准备一个免费开源的开发环境，并了解使用 Laminas 所需的基本概念。


  本部分包含以下章节：


  - 第 1 章，介绍用于 PHP 应用程序的 Laminas

  - 第 2 章，为我们的电子商务应用程序设置环境

  - 第 3 章，将 Laminas 作为库与测试驱动开发结合使用

  - 第 4 章，从对象关系映射到 MVC 容器

