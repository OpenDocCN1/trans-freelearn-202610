  \n进行这些更改后，您可以再次执行 Behat 运行。由于我们只是将类从一个位置移动到另一个位置，结果应与在 Checking whether the product\
  \ was inserted 部分中看到的相同：\n\n```\n1 scenario (1 passed)\n4 steps (4 passed)\n0m0.35s\
  \ (13.63Mb)\n```\n\n请注意，测试验证原本有效的功能仍然有效。Kent Beck 在其著作《通过示例进行测试驱动开发》中表示，TDD 消除了开发过程中的恐惧。在测试的辅助下，我们可以更改代码并立即知道是否有东西损坏。通过\
  \ BDD，我们保留了 TDD 的这一优势，并拥有可以与客户直接讨论的 .feature 文件。\n\n在测试的辅助下，您可以安全地进行改进。例如，您一定已经注意到\
  \ Product 和 Discount 模型的构造函数相同，其他模型的构造函数也可能相同。那么，我们可以将此构造函数集中在 AbstractModel 类中。将\
  \ Product 类中的构造函数方法剪切并粘贴到 AbstractModel 中。然后，删除 Discount 类的构造函数。您可以执行 Behat 运行并检查一切是否仍然正常。\n\
  \n现在，我们为模型和表格映射器提供了适当的泛化。如我们所见，Laminas 模块不需要具有配置或视图文件夹。模块可以只包含其所需的内容。\n\n当然，我们只实现了一个用例，只创建了两个模型类，Product\
  \ 和 Discount，但只有 Product 完全由测试覆盖。我们需要创建其他模型。但在这样做之前，我们必须准备 Behat 以选择场景。这就是我们将在下一部分中做的事情。\n\
  \n### 使用 Behat 创建其他模型\n\n让我们为产品更新用例创建另一个功能文件。在 features 文件夹中，创建带有以下内容的 productupdating.feature\
  \ 文件：\n\n```\nproductupdating.feature\n\nFeature: Product updating\nIn order to\
  \ keep products up-to-date in the stock\nAs an employee\nI need to be able to change\
