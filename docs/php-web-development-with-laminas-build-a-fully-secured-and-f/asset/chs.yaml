  \ 命名空间关联到 `tests` 文件夹。这意味着使用 `SchoolTest` 命名空间声明的类和接口将在 `tests` 文件夹中搜索。\n\n- 7.\
  \ 为了使这些关联正常工作，需要重新生成自动加载文件。\n\n- 8. 按 `CTRL` + `S` 保存更改，并单击 **安装依赖项** 按钮。\n\n- 9.\
  \ 不会安装任何依赖项，但由于自动加载配置发生了更改，Composer 将重新生成自动加载文件。\n\n现在，我们可以在 `SchoolClass` 中使用 `laminas-db`，而无需使用\
  \ PHP 命令来导入 Laminas 类，例如 `include` 或 `require`。\n\n在下一节中，我们将实现包含数据库连接数据的配置文件。\n\n\
  ### 创建 config.php 文件并重新运行 SchoolClassTest 测试用例\n\n嗯，根据我们的组件图，`SchoolClass` 依赖于一个名为\
  \ `config.php` 的文件。我们将在名为 `config` 的文件夹中创建此文件。在 `school1` 项目的根目录下创建此 `config` 文件夹。然后，在\
  \ `config` 文件夹中，创建一个 `config.php` 文件。此文件的内容如下：\n\n### config.php\n\n```php\n<?php\n\
  return [\n    'db' => [\n        'driver' => 'Pdo_Mysql',\n        'database' =>\
  \ 'school',\n        'username' => 'root',\n        'password' => '',\n        'hostname'\
  \ => '127.0.0.1'\n    ]\n];\n```\n\n此文件中的数组包含 laminas-db 文档中定义的数据库连接参数：https://docs.laminas.dev/laminas-db/adapter/#creating-an-adapter-using-configuration。config.php\
  \ 文件减少了与数据库相关的代码更改。您可以更改数据库服务器甚至数据库驱动程序，而无需更改其他文件的源代码。config.php 中定义的数组将由 Laminas\
  \ 的 Adapter 类使用。使用此类，我们可以建立到数据库的连接并执行 SQL 语句。此类实现了由四人帮（Erich Gamma、Richard Helm、Ralph\
  \ Johnson 和 John Vlissides）在经典著作《设计模式：可复用面向对象软件的基础》中编目的适配器设计模式。该模式有助于在具有不同接口的组件之间轻松切换，例如使用不同驱动程序的数据库。因此，我们将编写\
  \ SchoolClass::getAll 方法的内容：\n\n### SchoolClass::getAll\n\n```php\npublic static\
  \ function getAll() : iterable\n{\n    $config = require (realpath(__DIR__ . '/../config')\
  \ .\n        'config.php');\n    $adapter = new Adapter($config['db']);\n    $statement\
  \ = $adapter->query('SELECT * from classes');\n    $resultSet = $statement->execute();\n\
  \    return $resultSet;\n}\n```\n\nSchoolClass::getAll 方法从 config.php 文件读取数组，并将\
  \ db 键注入 Adapter 类的实例中。使用此实例，我们准备一条 SQL SELECT 语句并执行它。\n\n> **注意：自动代码补全**\n>\n>\
  \ 在 Eclipse 代码编辑器中输入类名时，可用类列表将变得可见。因此，如果从自动补全列表中选择一个类，Eclipse 将自动添加命名空间行。但如果您不这样做，请检查命名空间是否存在于文件顶部。例如，Laminas\
  \ 数据库适配器的命名空间是 Laminas\\\\Db\\\\Adapter\\\\Adapter。\n\n现在，我们可以再次运行 `SchoolClassTest`\
  \ 测试用例。您将在 **PHPUnit** 选项卡下（参见 _图 3.22_）看到 `SchoolClass::getAll` 方法的代码已通过测试：\n\n\
  ![](img/e6cf5550804ccae9d1859270da8688f5_78_0.png)\n\n图 3.22 – 显示 testListing 的\
  \ PHPUnit 选项卡\n\n### 创建新的 testInserting 测试方法\n\n我们已创建自动化测试，但它不是单元测试。由于我们正在连接真实数据库，`SchoolClassTest->testListing`\
  \ 方法是一个集成测试：它不仅测试 `SchoolClass` 的接口，还测试与数据库的连接。\n\n现在可以通过浏览器请求 `index.php` 页面来测试用户界面吗？嗯，虽然我们有从数据库读取数据的代码，但\
  \ `classes` 表中没有记录。因此，列表中没有学校班级。在测试列表页面之前，最好先实现插入逻辑。\n\n我们将按照以下代码片段，向 `SchoolClassTest`\
  \ 添加一个名为 `testInserting` 的新测试方法：\n\n```php\npublic function testInserting()\n{\n\
  \    $schoolClass = new SchoolClass(0, '1st year');\n    $schoolClass->save();\n\
  \    $config = require (realpath(__DIR__ . './../config').\n        '/config.php');\n\
  \    $adapter = new Adapter($config['db']);\n    $qi = function ($name) use ($adapter)\
  \ {\n        return $adapter->platform->quoteIdentifier($name);\n    };\n    $fp\
  \ = function ($name) use ($adapter) {\n        return $adapter->driver->formatParameterName($name);\n\
  \    };\n    $statement = $adapter->query('SELECT name from classes where ' . $qi('name')\
  \ . ' = ' . $fp('name'));\n    $resultsSet = $statement->execute(['name' => '1st\
  \ year']);\n    $this->assertCount(1, $resultsSet);\n    $statement = $adapter->query('DELETE\
  \ from classes where ' . $qi('name') . ' = ' . $fp('name'));\n    $resultsSet =\
  \ $statement->execute(['name' => '1st year']);\n}\n```\n\nSchoolClassTest->testInserting\
  \ 方法检查 SchoolClass->save 是否为 classes 表生成一条新记录。该测试方法会删除记录以重置数据状态。当然，此测试方法假设 classes\
  \ 表的 name 字段禁止重复值。因此，必须只有一个名为 '1st year' 的记录。作为 TDD 第一步的一部分，如果您现在运行此测试，它将失败。原因很明显：SchoolClass->save\
  \ 方法不存在。让我们来实现它！\n\n> **注意：用于处理字段名和值的闭包**\n>\n> 在 SchoolClassTest->testInserting\
  \ 方法中，我们使用 $qi 和 $fp 闭包分别对字段名进行引用和对值进行格式化。因此，例如，如果我们将数据库从 MySQL 更改为 PostgreSQL，则无需更改类中的代码，只需更改\
  \ config.php 文件中的连接参数即可。此外，适当格式化值可以避免 SQL 注入攻击。\n\n根据我们的类图，SchoolClass->save 方法返回一个布尔值。如果方法成功插入，则返回\
  \ true；否则返回 false。此方法的代码如下：\n\n```php\npublic function save() : bool\n{\n\t$adapter\
  \ = self::getAdapter();\n\n\t$fp = function ($name) use ($adapter) {\n\t\treturn\
  \ $adapter->driver->formatParameterName($name);\n\t};\n\n\t$statement = $adapter->query('INSERT\
  \ INTO\n\t\tclasses(name) VALUES ('. $fp('name') . ')');\n\n\ttry {\n\t\t$statement->execute(['name'\
  \ => $this->name]);\n\t} catch (\\Exception $e) {\n\t\terror_log($e->getMessage());\n\
  \t\treturn false;\n\t}\n\n\treturn true;\n}\n```\n\n要插入新记录，我们需要连接到数据库。因此，我们将数据库适配器创建代码提取到单独的\
  \ SchoolClassTest::getAdapter 静态方法中：\n\n```php\nprivate static function getAdapter():\
  \ AdapterInterface\n{\n    $config = require (realpath(__DIR__ . '/../config') .\n\
  \        '/config.php');\n\n    $adapter = new Adapter($config['db']);\n\n    return\
  \ $adapter;\n}\n```\n\n这样，我们就可以避免为每个需要连接数据库的方法重复此代码。当然，我们必须重构 SchoolClassTest::getAll\
  \ 方法以使用 SchoolClassTest::getAdapter：\n\n```php\npublic static function getAll():\
  \ iterable\n{\n    $adapter = self::getAdapter();\n\n    $statement = $adapter->query('SELECT\
  \ * from classes');\n    $resultSet = $statement->execute();\n\n    return $resultSet;\n\
  }\n```\n\n回到 SchoolClassTest->save 方法，您应该注意，它使用 $this->name 属性执行 SQL INSERT。因此，必须定义该属性并赋值。实际上，我们需要向类中添加两个属性，分别对应\
  \ classes 表中的每个相关字段：\n\n```php\npublic int $code = 0;\npublic string $name = '';\n\
  ```\n\n\n\n\n\n> **为什么在类中使用公共属性？**\n>\n> 创建类时，有一种规范规定必须创建私有属性和公共方法。因此，如果你需要读取或写入某个属性，就需要为此创建一个方法。如果你有二十个属性，且需要读写全部属性，就需要创建四十个方法。问题在于：这真的有必要吗？如果你在读取前或写入后不对数据属性进行转换，就只是在浪费时间，使用一个方法去做你本可以直接完成的事情。\n\
  \n创建 SchoolClass 类的实例时，必须填充 $code 和 $name 属性。因此，我们需要声明构造方法：\n\n```php\npublic function\
  \ __construct(int $code = 0, string $name = '')\n{\n    $this->code = $code;\n \
  \   $this->name = $name;\n}\n```\n\n现在，你可以成功运行测试用例。我们可以列出并插入学校班级。\n\n### 创建编辑表单\
  \ edit.php\n\n是时候在 edit.php 文件中创建编辑表单了。为什么？因为我们需要一个用户界面来添加学校班级。通过“文件 | 新建 | PHP\
  \ 文件”将以下代码输入到项目根目录。以下源代码即为 edit.php 的内容：\n\n## edit.php\n\n```html\n<!DOCTYPE html>\n\
  <html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Classes Registration</title>\n\
  </head>\n<body>\n<h1>Classes Registration</h1>\n<form action=\"save.php\" method=\"\
  post\">\nName: <input type=\"text\" name=\"name\" autofocus=\"autofocus\">\n<br/>\n\
  <input type=\"hidden\" name=\"code\"><br/>\n<input type=\"submit\" value=\"save\"\
  >\n</form>\n<p>\n <a href=\"index.php\">Homepage</a>\n</p>\n</body>\n</html>\n```\n\
  \n此网页将生成如图 3.23 所示的页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_82_0.png)\n\n\
  图 3.23 – 从 edit.php 文件渲染的表单\n\n如你所料，此 Web 表单无法成功请求，因为 save.php 文件不存在。那么，让我们来创建它：\n\
  \n### save.php\n\n```php\n<?php\nuse School\\SchoolClass;\nrequire 'vendor/autoload.php';\n\
  $name = ($_POST['name'] ?? null);\n$schoolClass = new SchoolClass(0, $name);\n$schoolClass->save();\n\
  header('Location: index.php');\n```\n\nsave.php 的内容非常简单（在我们创建插入测试之后）。该文件从通过 HTTP\
  \ POST 发送的 HTML 表单中获取字段 name 的值，并将其传递给 SchoolClass 实例，以将数据持久化到 classes 表中。接下来，该文件通过\
  \ header PHP 函数发送状态码为 302 的 HTTP 请求，将页面重定向到 index.php。\n\n好了，你现在可以使用 edit.php 中的表单插入一个学校班级。列表将为空。别担心！这是因为我们需要导入\
  \ Composer 的 autoload.php 文件。只需在 list.php 的 use 语句之后添加以下行即可：\n\n```php\nrequire\
  \ 'vendor/autoload.php';\n```\n\n添加该行后，你可以刷新 index.php 页面，将看到如下页面：\n\n### 班级注册\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_83_0.png)\n\n图 3.24 – 学校班级列表\n\n太棒了！我们可以通过\
  \ Web 界面插入并列出学校班级。现在，我们将实现更新操作。当然，我们将从测试开始。\n\n### 创建 SchoolClassTest->testUpdating\
  \ 测试方法\n\n以下源代码展示了 SchoolClassTest->testUpdating 测试方法：\n\n```php\npublic function\
  \ testUpdating()\n{\n    $schoolClass = new SchoolClass(0, '1st year');\n    $schoolClass->save();\n\
  \    $schoolClass = SchoolClass::getByName('1st year');\n    $schoolClass->name\
  \ = '2nd year';\n    $schoolClass->save();\n    $schoolClass = SchoolClass::getByName('2nd\
  \ year');\n    $this->assertEquals('2nd year', $schoolClass->name);\n    $schoolClass->delete();\n\
  \    $schoolClass = SchoolClass::getByName('2nd year');\n    $this->assertEmpty($schoolClass->name);\n\
  }\n```\n\n此测试尝试插入一个新的学校班级，然后修改该班级的名称。作为 TDD 第一步的一部分，如果你现在运行此测试，它将失败。没错，这是预期的。如果此时测试通过，那确实有大问题了！\n\
  \n你应该注意到，我们此次使用 SchoolClass->delete 方法将学校班级从表中删除。该方法在类图中已有规划，使用它比重复多行代码更好。\n\n接下来，让我们成功运行测试。你应该已经注意到，SchoolClassTest->testUpdating\
  \ 方法调用了 SchoolClass::getByName 方法。该方法不存在，因此我们需要创建它。让我们在类构造方法之后创建此方法：\n\n```php\n\
  public static function getByName($name = null): SchoolClass\n{\n    $adapter = self::getAdapter();\n\
  \    $qi = function ($name) use ($adapter) {\n        return $adapter->platform->quoteIdentifier($name);\n\
  \    };\n    $fp = function ($name) use ($adapter) {\n        return $adapter->driver->formatParameterName($name);\n\
  \    };\n    $statement = $adapter->query('SELECT * from classes\n        WHERE\
  \ ' . $qi('name') . ' = ' . $fp('name'));\n    $resultSet = $statement->execute([':name'\
  \ => $name]);\n    if ($resultSet->count() == 0) {\n        return new SchoolClass();\n\
  \    }\n    $row = $resultSet->current();\n    return new SchoolClass((int)$row['code'],\
  \ $row['name']);\n}\n```\n\nSchoolClass::getByName 方法与 SchoolClass::getAll 方法相似，至少在语句创建之前是这样。SQL\
  \ SELECT 按名称过滤，如果未找到记录，将返回一个空的 SchoolClass 实例。仅此就足以成功运行测试吗？嗯，你可以运行测试来发现答案——不行！\n\
  \n当我们实现 SchoolClass->save 方法时，该方法只准备插入记录，而非更新记录。因此，即使你更改了 SchoolClass 类对象的名称，在调用\
  \ SchoolClass->save 方法时，它也会尝试插入记录，因为那里只有插入代码。因此，我们必须修改此方法，使其也能执行更新操作。该方法将如下所示：\n\
  \n```php\npublic function save() : bool\n{\n    $adapter = self::getAdapter();\n\
  \    $fp = function ($name) use ($adapter) {\n        return $adapter->driver->formatParameterName($name);\n\
  \    };\n    if (empty($this->code)) {\n        $statement = $adapter->query('INSERT\
  \ INTO\n            classes(name) VALUES ( ' . $fp('name') . ' )');\n        $params\
  \ = ['name' => $this->name];\n    } else {\n        $statement = $adapter->query('UPDATE\
  \ classes SET\n            name= ' . $fp('name') . ' WHERE code=' .\n          \
  \  $fp('code'));\n        $params = [\n            'code' => $this->code,\n    \
  \        'name' => $this->name\n        ];\n    }\n\n    try {\n        $statement->execute($params);\n\
  \    } catch (\\Exception $e) {\n        error_log($e->getMessage());\n        return\
  \ false;\n    }\n\n    return true;\n}\n```\n\n学校班级的代码由表自动生成，因此我们不期望进行插入。如果代码有值，我们假设这是一个更新操作。测试现在能通过吗？不行，因为\
  \ SchoolClass->delete 方法尚不存在。别浪费时间——创建它：\n\n```php\npublic function delete(): bool\n\
  {\n    $adapter = self::getAdapter();\n    $fp = function ($name) use ($adapter)\
  \ {\n        return $adapter->driver->formatParameterName($name);\n    };\n    $statement\
  \ = $adapter->query('DELETE FROM classes WHERE\n        code=' . $fp('code'));\n\
  \    try {\n        $statement->execute([\n            'code' => $this->code\n \
  \       ]);\n    } catch (\\Exception $e) {\n        error_log($e->getMessage());\n\
  \        return false;\n    }\n    return true;\n}\n```\n\n现在，你可以成功运行测试了。终于，我们从红色状态进入了绿色状态。SchoolClass\
  \ 的当前实现允许我们修改 edit.php 和 save.php 文件，以便通过 Web 界面更改学校班级。\n\n### 修改 edit.php\n\n让我们从\
  \ edit.php 开始：\n\n## edit.php\n\n```php\n<?php\nuse School\\SchoolClass;\nrequire\
  \ 'vendor/autoload.php';\n$code = ($_GET['code'] ?? null);\n$schoolClass = SchoolClass::getByCode($code);\n\
  ?>\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Classes Registration</title>\n\
  </head>\n<body>\n<h1>Classes Registration</h1>\n<form action=\"save.php\" method=\"\
  post\">\nName: <input type=\"text\" name=\"name\"\n```\n\n\n\n\n\n\n```html\nautofocus=\"\
  autofocus\"\nvalue=\"<?=$schoolClass->name?>\"><br/>\n<input type=\"hidden\" name=\"\
  code\" value=\"<?=\n    $schoolClass->code?>\"><br/>\n<input type=\"submit\" value=\"\
  save\">\n</form>\n<p>\n<a href=\"index.php\">Homepage</a>\n</p>\n</body>\n</html>\n\
  ```\n\n这个文件的前一版本与当前版本有什么区别？答案是 PHP 块代码，包括 autoload.php 文件的导入、通过 HTTP GET 发送的参数 code\
  \ 的读取，以及从代码中恢复 SchoolClass 实例。等一下！这个 SchoolClass->getByCode 方法是从哪里来的？你很聪明！它还不存在！我们必须实现它！开始吧：\n\
  \n```php\npublic static function getByCode($code = null): SchoolClass\n{\n    $adapter\
  \ = self::getAdapter();\n    $qi = function ($name) use ($adapter) {\n        return\
  \ $adapter->platform->quoteIdentifier($name);\n    };\n    $fp = function ($name)\
  \ use ($adapter) {\n        return $adapter->driver->formatParameterName($name);\n\
  \    };\n    $statement = $adapter->query('SELECT * from classes\n        WHERE\
  \ ' . $qi('code') . '=' . $fp('code'));\n    $resultSet = $statement->execute(['code'\
  \ => $code]);\n    if ($resultSet->count() == 0){\n        return new SchoolClass();\n\
  \    }\n    $row = $resultSet->current();\n    return new SchoolClass((int)$row['code'],$row['name']);\n\
  }\n```\n\n是的，SchoolClass->getByCode 方法与 SchoolClass->getByName 方法非常相似。如果你注意到了这一点，那就好。不用担心，我们稍后会消除重复。但现在我们需要专注于通过\
  \ Web 界面更新学校班级。由于带有编辑表单的页面已更改，让我们更改 save.php 文件，它负责持久化。\n\n### 修改 save.php\n\n此文件将按以下方式编写：\n\
