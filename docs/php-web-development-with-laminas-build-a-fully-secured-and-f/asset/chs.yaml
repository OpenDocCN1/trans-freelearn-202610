  Operator: <select name=\"operator\">\n<option value=\"\" <?= ($discount->operator\
  \ == '-' ?\n'selected' : '') ?> ></option>\n<option value=\"*\" <?= ($discount->operator\
  \ == '*' ?\n'selected' : '') ?>>*</option>\n<option value=\"/\" <?= ($discount->operator\
  \ == '/' ?\n'selected' : '') ?> /></option>\n</select><br/>\nFactor: <input type=\"\
