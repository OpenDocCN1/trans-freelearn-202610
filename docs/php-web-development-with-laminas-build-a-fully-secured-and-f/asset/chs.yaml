  - index.phtml\n\n这里，我们有两对文件，生成两个网页：插入/更新页面和列表页面。.phtml 文件包含 HTML 和 PHP 代码的组合，而 .js\
  \ 文件仅包含 JavaScript 代码。\n\n> 重要提示：.phtml 内容\n>\n> 虽然可以在 .phtml 文件中使用 PHP 代码，但减少这种用途是良好的做法。模型类负责业务规则处理，因此视图脚本文件仅应显示由控制器从模型发送的值。\n\
  \n好的，假设折扣注册已正常工作，产品注册也是如此。生成用于插入/更新的 HTML 表单的 edit.phtml 文件内容如下：\n\n### edit.phtml\n\
