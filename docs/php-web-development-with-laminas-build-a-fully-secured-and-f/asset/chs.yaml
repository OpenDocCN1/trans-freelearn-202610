  \ 呢？我们的业务类需要查找 Laminas 数据库组件的类。你说得对。我们需要配置类的自动加载，以便每个类都能加载另一个类。\n\n### 配置类的自动加载\n\
  \n让我们使用以下步骤配置类的自动加载：\n\n- 1. 在 **Composer** 视图中，单击 **Autoload** 选项卡。你将看到类似于 *图 3.19*\
