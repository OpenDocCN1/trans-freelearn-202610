  \ AbstractModel\n{\n    $where = [];\n    foreach($fields as $field => $value) {\n\
  \        $where[$field] = $value;\n    }\n    $rowSet = $this->getAll($where);\n\
  \    if ($rowSet->count() == 0) {\n        $modelName = $this->modelName;\n    \
  \    return new $modelName();\n    }\n    return $rowSet->current();\n}\n```\n\n\
