  \ type=\"hidden\" name=\"code\" value=\"<?= $this->discount->code ?>\">\n</form>\n\
  <button id=\"save\">save</button>\n<p>\n<span id=\"api\" url=\"<?= $this->url\n\
  ('inventoryapi', ['controller' => 'discountapi'])\n?>\"></span>\n<span id=\"target\"\
  \ url=\"<?= $this->url ('inventory',\n['controller' => 'discount']) ?>\"></span>\n\
  <a href=\"<?= $this->url ('inventory', ['controller' =>\n'discount']) ?>\">Go back</a>\n\
  </p>\n```\n\nedit.phtml 文件的源代码与 layout.phtml 文件（来自 Application 模块）组合生成了图 8.1 所示的网页。请注意，edit.phtml\
  \ 的内容是一个简单的 HTML 表单，其元素值由 PHP 代码动态定义。\n\n### Laminas MVC 骨架主页\n\n### 折扣插入\n\n名称：\n\
  运算符：-\n因子：0\n保存\n返回\n\n© 2022 Laminas 项目，LF Projects, LLC 的一个系列\n\n图 8.1：插入折扣的表单\n\
  \n我们将更改生成此 HTML 表单的方式。当然，你可能会争辩：“我们为什么要直接用 HTML 定义表单？有可生成丰富 Web 界面的 JavaScript 库。我们可以使用它们！”没错，你可以为用户界面使用任何\
  \ JavaScript 库或框架。Laminas 不强制要求你直接使用 HTML 来创建表单或使用 JavaScript 组件。你可以自由为前端应用程序选择所需的工具。请记住，我们的控制器层中有\
  \ API。\n\n但是，如果你希望直接控制 Web 用户界面，了解如何从应用程序后台以编程方式生成 HTML 表单是件好事。此外，你始终会有一个默认的 Web\
  \ 界面来操作系统。更重要的是，Laminas 用于生成表单的组件不仅用于生成用户界面，还用于数据验证。我们将很快看到这一点。\n\n我们将把折扣表单的生成委托给\
  \ `laminas-form`。为此，我们需要创建一个类来定义表单。\n\n### 定义 HTML 表单的类\n\n按照以下步骤创建定义 HTML 表单的类：\n\
  \n- 首先，在 module/Inventory/src 文件夹中，创建一个名为 Form 的文件夹。\n- 接下来，在 Form 文件夹内，创建一个 DiscountForm.php\
  \ 文件。该文件必须包含 DiscountForm 类：\n\n### DiscountForm.php\n\n```php\n<?php\nnamespace\
  \ Inventory\\Form;\nuse Laminas\\Form\\Form;\nuse Laminas\\Form\\Element\\Text;\n\
  use Laminas\\Form\\Element\\Select;\nuse Laminas\\Form\\Element\\Number;\nuse Laminas\\\
  Form\\Element\\Hidden;\nclass DiscountForm extends Form {\n    public function __construct($name\
  \ = 'discount') {\n        parent::__construct($name);\n        $text = new Text('name');\n\
  \        $text->setLabel('Name:');\n        $text->setAttribute('autofocus', 'autofocus');\n\
  \        $this->add($text);\n        $select = new Select('operator');\n       \
  \ $select->setLabel('Operator:');\n        $options = [\n            '-=' => '-=',\n\
  \            '*=' => '*=',\n            '/=' => '/=',\n        ];\n        $select->setValueOptions($options);\n\
  \        $this->add($select);\n        $number = new Number('factor');\n       \
  \ $number->setLabel('Factor:');\n        $this->add($number);\n        $hidden =\
  \ new Hidden('code');\n        $this->add($hidden);\n    }\n}\n```\n\n从 DiscountForm\
  \ 类可以观察到以下几点：\n\n- DiscountForm 类继承自 Laminas\\Form\\Form 类的实现。\n- 父类构造函数接收 HTML\
  \ 表单的 name 属性值作为参数。\n- 在继承的 Laminas\\Form\\Form 类构造函数内部，我们定义表单元素。\n- 每个 HTML 表单元素都有一个名称合适的类。例如，对于\
  \ type 等于“text”的 HTML INPUT 元素，存在 Laminas\\Form\\Element\\Text 类。\n- Laminas\\Form\\\
  Element 类系列对 HTML 表单元素进行分组。\n- Laminas\\Form\\Element 构造函数将第一个参数作为值，该值将同时用于 id 属性和\
  \ name 属性。\n- Laminas\\Form\\Form 和 Laminas\\Form\\Element 类构造函数都有第二个参数，但它是可选的。\n\
  - setLabel 方法允许为 HTML 表单元素定义标签。\n- setAttribute 方法允许定义任何 HTML 元素属性的值。例如，我们为 name\
  \ 输入字段的 autofocus 属性定义了一个值。\n- Laminas\\Form\\Element 实例需要通过 Laminas\\Form\\Form->add\
  \ 方法与 Laminas\\Form\\Form 实例关联。\n\n好吧，但我们如何使用 DiscountForm 类呢？嗯，我们需要在 Web 界面控制器中创建\
  \ DiscountForm 实例，并将其传递给相应的视图脚本。因此，我们将把 DiscountController->editAction 方法更改为以下内容：\n\
  \n```php\npublic function editAction()\n{\n    $key = $this->params('key');\n  \
  \  $discount = $this->discountTable->getByField\n    ('code',$key);\n    $form =\
  \ new DiscountForm();\n    $form->bind($discount);\n    return new ViewModel([\n\
  \        'discount' => $discount,\n        'form' => $form\n    ] );\n}\n```\n\n\
  请注意，我们已创建 `DiscountForm` 的实例并调用了 `DiscountForm->bind` 方法。该方法继承自 `Laminas\\Form\\\
  Form`。`bind` 方法将模型对象的属性值分配给表单的相关字段。我们与 `DiscountForm` 通信以获取 `Discount` 模型实例的属性值，并使用它们来填充\
  \ HTML 表单元素。\n\n但是 `bind` 方法如何从模型对象中提取值呢？嗯，`bind` 方法会调用模型的 `getArrayCopy` 方法。等等！`Discount`\
  \ 类没有这个方法。我们需要实现它！事实上，为所有模型实现 `getArrayCopy` 方法更好，这样它们都可以与 `Laminas\\Form\\Form`\
  \ 一起工作。\n\n出于此原因，我们将向 `AbstractModel` 类添加一个 `getArrayCopy` 方法。该类在 _第 4 章，从对象关系映射到\
  \ MVC 容器_ 中创建，属于 Generic 模块。`getArrayCopy` 方法的实现很简单：\n\n```php\npublic function\
  \ getArrayCopy()\n{\n    return get_object_vars($this);\n}\n```\n\n好。现在我们可以修改折扣的\
  \ `edit.phtml` 文件了。新实现如下：\n\n### edit.phtml\n\n```php\n<?php\n$this->headScript()->appendScript(file_get_contents\n\
  \    (__DIR__ . '/edit.js'));\n?>\n<h1>Discount <?= (empty($this->discount->code)\
  \ ? 'insert' : 'update') ?></h1>\n<?php\n$form = $this->form;\necho $this->form()->openTag($form);\n\
  echo $this->formLabel($form->get('name'));\necho $this->formText($form->get('name'))\
  \ . '<br/>';\necho $this->formLabel($form->get('operator'));\necho $this->formSelect($form->get('operator'))\
  \ . '<br/>';\necho $this->formLabel($form->get('factor'));\n```\n\n\n\n\n```\necho\
  \ $this->formNumber($form->get('factor')) . '<br/>'; echo $this->formHidden($form->get('code'));\
  \ echo $this->form()->closeTag(); ?> <button id=\"save\">save</button> <p> <span\
  \ id=\"api\" url=\"<?=$this->url('inventoryapi', ['controller' => 'discountapi'])\
  \ ?>\"></span> <span id=\"target\" url=\"<?=$this->url('inventory', ['controller'\
  \ => 'discount']) ?>\"></span> <a href=\"<?=$this->url('inventory', ['controller'\
  \ => 'discount']) ?>\">Go back</a> </p>\n```\n\n请注意，我们已将 HTML 表单元素的内容替换为一系列带有 form\
  \ 前缀的方法调用。我们需要从之前的源代码中了解以下内容：\n\n- `$this->form` 属性是由 `DiscountController` 实例发送的\
  \ `DiscountForm` 实例。\n- `$this->form` 方法（末尾带括号）是一个视图助手，用于呈现使用 Laminas\\Form\\Form\
  \ 定义的 HTML 表单。\n- `$this->formLabel` 方法仅呈现表单元素的标签。\n- 每种元素类型都有相应的呈现助手类。例如，operator\
  \ 字段是 HTML SELECT 元素，因此我们使用 `$this->formSelect` 来呈现它。\n- `Laminas\\Form\\Form` 的\
  \ `get` 方法返回一个 `Laminas\\Form\\Element` 对象。参数是传递给对象构造函数的值。\n\n要使用视图助手类，需要在 `modules.config.php`\
  \ 文件中将 `Laminas\\Form` 声明为模块。如果由 `modules.config.php` 返回的数组中没有值为 \"`Laminas\\Form`\"\
  \ 的元素，则在尝试呈现表单时，您会收到诸如 **在插件管理器 `Laminas\\View\\HelperPluginManager` 中未找到名为 ‘form’\
  \ 的插件** 之类的消息。\n\n将 `Laminas\\Form` 作为模块添加是启用表单呈现的简洁方式。还有一种更冗长的方法。我们将在这里逐一介绍，因为这将帮助您了解幕后发生了什么，即\
  \ `laminas-mvc` 为您所做的工作。\n\n启用表单呈现的冗长方式是在 module.config.php 文件中为每个表单助手注册别名和工厂。此注册由配置数组第一级的键\
  \ view_helpers 完成，如以下源代码所示：\n\n```php\n'view_helpers' => [\n    'aliases' => [\n\
  \        'form' => Form::class,\n        'formText' => FormText::class,\n      \
  \  'formSelect' => FormSelect::class,\n        'formNumber' => FormNumber::class,\n\
  \        'formHidden' => FormHidden::class,\n        'formLabel' => FormLabel::class\n\
  \    ],\n    'factories' => [\n        Form::class => InvokableFactory::class,\n\
  \        FormText::class => InvokableFactory::class,\n        FormSelect::class\
  \ => InvokableFactory::class,\n        FormNumber::class => InvokableFactory::class,\n\
  \        FormHidden::class => InvokableFactory::class,\n        FormLabel::class\
  \ => InvokableFactory::class\n    ]\n]\n```\n\n在 aliases 子键中，我们定义了调用视图助手类所使用的名称。在\
  \ factories 子键中，我们定义了创建视图助手实例的方式。请注意，这种方法允许我们进行自定义。这通常是 Laminas 组件的一个特性。\n\n您可能已经注意到，将\
  \ Laminas\\Form 作为模块添加更好。这正是我们将在项目中做的事情。\n\n> **重要说明：表单视图插件**\n>\n> 如果您未将 Laminas\\\
  Form 声明为模块，也未在 module.config.php 中注册表单视图插件，则在尝试呈现表单时，您会收到诸如 **在插件管理器 `Laminas\\\
  View\\HelperPluginManager` 中未找到名为 ‘form’ 的插件** 之类的消息。\n\n在尝试呈现表单之前，我们还需要安装 laminas-i18n\
  \ 组件。该组件允许您根据应用程序配置从翻译文件中翻译文本。安装 laminas-i18n 的方式与安装 laminas-form 相同。\n\n### i18n\n\
  \ni18n 是 internationalization 的缩写。简而言之，它是对多种语言的支持。I18n 软件组件有助于将内容从一种语言翻译成另一种语言。\n\
  \n### 重要说明：表单与翻译器之间的依赖关系\n\n如果您未安装 `laminas-i18n` 组件并尝试呈现由 `laminas-form` 定义的表单，您将收到消息\
  \ Class 'Laminas\\\\I18n\\\\View\\\\Helper\\\\AbstractTranslatorHelper' not found。好吧，根据此消息，表单需要一个翻译器。这一要求可能看起来很奇怪，因为它假设任何表单都必须被翻译。考虑到\
  \ Laminas 组件架构等强耦合架构，表单组件与翻译器组件之间的关系应该是可选的。但是 `laminas-form` 与 `laminas-i18n` 之间强耦合的原因是，表单组件可以集成到过滤器和验证组件中，而其中一些组件依赖于\
  \ `laminas-i18n`。\n\n### laminas-mvc-form\n\n如果您使用 `laminas-mvc` 且不想分别安装 `laminas-form`\
  \ 和 `laminas-i18n`，可以安装 `laminas-mvc-form` 元包。\n\n目前，我们已通过呈现 `laminas-form` 成功用\
  \ HTML 替换了折扣表单的直接定义。折扣表单的呈现未发生变化，因此我们没有新界面。另一方面，我们现在可以在控制器层将模型与表单连接起来。\n\n因此，我们已完成使用\
  \ `laminas-form` 生成添加和更新折扣表单的工作。为此，我们执行了以下操作：\n\n- 为折扣创建了 CRUD 实现，包含 API 和 Web 界面\n\
  - 创建了一个类来定义折扣的 HTML 表单\n\n在下一节中，我们将学习如何使用 `laminas-filter` 过滤输入值。\n\n### 过滤输入数据\n\
  \n在本章中，您已使用 Composer 添加并安装了 `laminas-form` 组件，请对 `laminas-inputfilter` 组件执行相同操作：\n\
  \n- 1. 在 Eclipse 中打开 `composer.json` 文件。\n- 2. 通过 **依赖项** 选项卡，搜索 `laminas/laminas-inputfilter`\
  \ 包并将其添加。\n- 3. 不要忘记保存文件并单击 **更新依赖项** 按钮。\n\nlaminas-inputfilter 组件结合了 laminas-filter\
  \ 和 laminas-validator。您可以在 PHP 程序中分别使用 laminas-filter 和 laminas-validator，但对于 MVC\
  \ Web 应用程序，使用 laminas-inputfilter 更加方便。\n\n我们有一个用于插入/更新折扣的 HTML 表单。但这是处理折扣请求的方式之一。我们有一个\
  \ API，因此另一个应用程序可以向 whatstore 发出请求。我们的应用程序面向服务，因此对多个客户端开放。这很有用，但数据处理方面存在一个问题。如果用户填写\
  \ HTML 表单，JavaScript 代码可以在发送请求之前过滤表单数据。当在没有 HTML 页面的情况下发出请求时，没有 JavaScript 来过滤数据。因此，服务器必须确保输入数据的格式有效。\n\
  \n当然，应用程序数据的有效格式取决于应用程序要求。这里我们假设正在阅读需求文档，以实现处理数据的代码。\n\n定义模型数据过滤规则的地方是模型类。因此，我们将根据以下源代码向\
  \ Discount 类添加 getInputFilter 方法：\n\n```php\npublic function getInputFilter(): InputFilter\n\
  {\n    $inputFilter = new InputFilter();\n    $input = new Input('code');\n    $filterChain\
  \ = new FilterChain();\n    $filterChain->attach(new ToInt());\n    $input->setFilterChain($filterChain);\n\
  \    $inputFilter->add($input);\n    $input = new Input('name');\n    $filterChain\
  \ = new FilterChain();\n    $filterChain->attach(new StringToUpper())\n        ->attach(new\
  \ Alnum(true));\n    $input->setFilterChain($filterChain);\n    $inputFilter->add($input);\n\
  \    $input = new Input('operator');\n    $filterChain = new FilterChain();\n  \
  \  $filterChain->attach(new AllowList(['list' =>\n        ['-', '*', '/']]));\n\
  \    $input->setFilterChain($filterChain);\n    $inputFilter->add($input);\n   \
  \ $input = new Input('factor');\n    $filterChain = new FilterChain();\n    $filterChain->attach(new\
  \ ToFloat());\n}\n```\n\n\n\n\n\n```php\n$input->setFilterChain($filterChain);\n\
  $inputFilter->add($input);\nreturn $inputFilter;\n}\n```\n\nInputFilter 类是 Input\
  \ 实例的集合。Input 类允许你为输入属性链式调用过滤器和验证器。对于 Discount 类的每个属性，我们都创建了一个 Input 实例。\n\n要将过滤器连接到输入属性，我们使用\
  \ FilterChain 类。FilterChain 连接一组过滤器，并允许你将所有这些过滤器应用到一个值上。按顺序，这些过滤器被附加到 FilterChain。\n\
  \n你可以在 https://docs.laminas.dev/laminas-filter/standard-filters 找到关于 Laminas 标准过滤器类的参考。对于\
  \ Discount 类，我们使用了以下过滤器类：\n\n- ToInt 类用于确保折扣代码是整数。\n- StringToUpper 类用于确保折扣名称为大写字母。此外，Alnum\
  \ 确保只允许字母数字值。事实上，Alnum 构造函数中的参数 true 也允许空格。\n- AllowList 类用于将运算符的可能值限制为三种可能性。\n\
  - ToFloat 类用于确保 factor 是浮点数。\n\n> **重要说明：过滤器类**\n>\n> 除了标准过滤器之外，还有更多可用的过滤器。你可以在\
  \ https://docs.laminas.dev/laminas-filter 找到可用 Laminas 过滤器的完整列表。此外，你可以通过实现 Laminas\\\
  Filter\\FilterInterface 来创建自己的过滤器类。我们将在第 13 章「技巧与窍门」中学习如何创建自定义过滤器。\n\n既然我们已经定义了生成\
  \ InputFilter 实例的方法，我们将使用该实例来转换 Discount 模型的属性值。这是通过 Discount->toArray 方法完成的，如下所示：\n\
  \n```php\npublic function toArray()\n{\n    $inputFilter = $this->getInputFilter();\n\
  \    $inputFilter->setData(get_object_vars($this));\n    return $inputFilter->getValues();\n\
  }\n```\n\n这一更改足以确保应用过滤器。现在你可以插入或更新折扣，你会看到名称将以大写字母列出，如图 8.2 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_226_0.png)\n\
  \n图 8.2: StringToUpper 过滤器的效果\n\n在下一节中，我们将学习如何使用 laminas-validator 验证输入值。\n\n###\
  \ 验证输入数据\n\n过滤器转换数据，但这不足以确保数据适合我们的系统。过滤器只是执行一个操作。要了解数据是否具有适当的值，我们需要一个能够回答数据是否符合业务规则的问题的组件。\n\
  \nLaminas 为此提供了一个组件：laminas-validator。正如我们之前所说，laminas-validator 是 laminas-inputfilter\
  \ 的依赖项。因此，如果你已经安装了 laminas-inputfilter，就不需要安装 laminas-validator。\n\n我们说过，验证取决于业务规则。想象一下，你的客户在被询问需求时告诉你，折扣名称必须至少有三个字符。我们有一个过滤器将字母字符更改为大写字母，以及另一个过滤器删除非字母、非数字或非空格的字符。但是，这些过滤器不能确保最终名称至少有三个字符。\n\
  \n我们需要为名称字段创建一个验证规则。让我们修改 Discount->getInputFilter 方法中处理名称字段的部分：\n\n```php\n$input\
  \ = new Input('name');\n$filterChain = new FilterChain();\n$filterChain->attach(new\
  \ StringToUpper())\n    ->attach(new Alnum(true));\n$input->setFilterChain($filterChain);\n\
  ```\n\n```php\n$validatorChain = new ValidatorChain();\n$validatorChain->attach(new\
  \ StringLength(\n    ['min' => 3]\n));\n$input->setValidatorChain($validatorChain);\n\
  $inputFilter->add($input);\n```\n\n请注意，我们创建了一个 `ValidatorChain` 实例。`ValidatorChain`\
  \ 连接一组验证器，并允许你将所有这些验证器应用到一个值上。按顺序，这些验证器被附加到 `ValidatorChain`。\n\n你可以在 https://docs.laminas.dev/laminas-validator/standard-validators\
  \ 找到关于 Laminas 标准验证器类的参考。对于 `Discount` 类，我们使用了 `StringLength` 验证器。此验证器确保文本具有最小和/或最大长度。\n\
  \n我们将在 `DiscountAPIController` 的插入和更新方法中添加验证。`DiscountAPIController->create` 必须如下所示：\n\
  \n```php\npublic function create($data)\n{\n    $discount = new Discount();\n  \
  \  $inputFilter = $discount->getInputFilter();\n    $inputFilter->setData($data);\n\
  \    if (!$inputFilter->isValid()) {\n        return new JsonModel(['inserted' =>\
  \ 'invalid']);\n    }\n\n    $discount->exchangeArray($data);\n    $inserted = $this->discountTable->save($discount);\n\
  \    return new JsonModel(['inserted' => $inserted]);\n}\n```\n\n请注意，我们在尝试保存数据之前应用了折扣名称的验证规则。数据库也可能有业务规则，但应用程序中的验证可以避免数据库错误以及应用程序与数据库之间不必要的通信。我们使用\
  \ `Discount->getInputFilter` 方法获取 `InputFilter` 实例，这很合理。`InputFilter->setData` 方法分配要验证的值，而\
  \ `InputFilter->isValid` 方法根据验证器链回答所有值是否有效。\n\n我们还将修改 DiscountAPIController->update：\n\
  \n```php\npublic function update($id, $data)\n{\n    $discount = $this->discountTable->getByField\n\
  \        ('code', $id);\n    $inputFilter = $discount->getInputFilter();\n    $inputFilter->setData($data);\n\
  \    if (!$inputFilter->isValid()) {\n        return new JsonModel(['inserted' =>\
  \ 'invalid']);\n    }\n\n    $discount->exchangeArray($data);\n    $updated = $this->discountTable->save($discount);\n\
  \    return new JsonModel(['updated' => $updated]);\n}\n```\n\n你可以观察到，如果数据无效，操作方法将返回一个值为字符串\
  \ invalid 的 inserted 键。我们将使用此值向用户显示适当的消息并避免不必要的重定向。在以下代码片段中，我们展示了折扣的 edit.js 文件的内容。首先，我们将声明一个\
  \ save 函数。该函数从变量声明开始，这些变量接收来自页面 edit.phtml 的值：\n\n```javascript\nvar save = function()\
  \ {\n    var api = $(\"#api\").attr(\"url\");\n    var target = $(\"#target\").attr(\"\
  url\");\n    var formData = $(\"#discount\").serialize();\n    var code = parseInt($(\"\
  input[name='code']\").val());\n}\n```\n\ncode 变量的值指示操作是插入还是更新。对于插入，我们通过 HTTP POST\
  \ 请求发送表单数据：\n\n```javascript\nif (code == 0) {\n    $.post(api, formData, function(data)\
  \ {\n        if (data.inserted == 'invalid') {\n            alert('Invalid data!');\n\
  \            return;\n        }\n        alert(\"discount has been inserted\");\n\
  \        window.location.href = target;\n    }).fail(function() {\n        alert('error');\n\
  \    });\n}\n```\n\n对于更新，我们通过 HTTP PUT 请求发送表单数据：\n\n```javascript\n} else {\n  \
  \  api = $(\"#api\").attr(\"url\") + '/' + $(this).\n        attr('code');\n   \
  \ $.ajax({url: api, type: 'PUT', data: formData}).\n    done(function(data) {\n\
  \        if (data.inserted == 'invalid') {\n            alert('Invalid data!');\n\
  \            return;\n        }\n        alert(\"discount has been updated\");\n\
  \        window.location.href = target;\n    }).fail(function() {\n        alert('error');\n\
  \    });\n}\n```\n\n最后，save 函数与按钮点击事件相关联：\n\n```javascript\n$(document).ready(function()\
  \ {\n    $(\"#save\").click(save);\n});\n```\n\n此修改侧重于测试异步请求内容。如果返回时，inserted 键的值为\
  \ invalid，将显示一条消息，说明数据无效。因此，如果你尝试添加一个名称短于三个字符的折扣，你将看到类似图 8.3 的消息：\n\n\n\n![](img/e6cf5550804ccae9d1859270da8688f5_230_0.png)\n\
  \n图 8.3: 插入或更新操作中无效数据的消息\n\n> **重要说明：Validator 类**\n>\n> 可用的验证器比标准验证器更多。您可以在 https://docs.laminas.dev/laminas-validator\
  \ 中找到可用 Laminas 验证器的完整列表。\n> 此外，您可以创建自己的过滤器类，扩展 Laminas\\Validator\\AbstractValidator。我们将在\
  \ *第 13 章，技巧与窍门* 中学习如何创建自定义过滤器。\n\n因此，在修改 HTML 表单的生成并为我们的折扣注册添加过滤器和验证器后，我们现在已经完成了本章。\n\
  \n### 摘要\n\n在本章中，我们学习了一些与数据输入相关的 Laminas 组件。首先，我们学习了如何使用 laminas-form 以编程方式定义 HTML\
  \ 表单，以及如何在 .phtml 文件中渲染此类表单。我们以 laminas-form 为例，定义了一个用于折扣注册的 HTML 表单。\n\n接着，我们学习了如何使用\
  \ laminas-filter 从请求中过滤值。我们将过滤器应用于折扣字段，例如，将折扣名称限制为包含空格的字母数字字符。\n\n最后，我们学习了如何使用 laminas-validator\
  \ 验证请求中的值。我们将验证器应用于名称字段，避免保存短于三个字符的名称。\n\n过滤和验证是与应用程序安全相关的方面。对数据输入缺乏控制可能会允许不需要且有时危险的内容。想象一下，输入的一部分被用作应用程序调用的命令的参数。如果允许任何内容，您将不知道您的应用程序可能会执行什么。\n\
  \n在下一章中，我们将讨论安全的其他方面，即身份验证和授权。\n"
- "## 事件驱动身份验证\n\n本章涵盖了开发安全应用程序的基本主题之一——身份验证。身份验证是身份检查。物理世界中身份验证的一个例子是进入建筑物时要求出示身份证明文件。\n\
  \n在本章中，您将学习如何使用事件导向编程实现此检查过程。我们将首先为登录和注销操作创建测试，然后创建这些操作。之后，我们将为 Inventory 模块实现用户身份验证。为此，我们将创建员工注册。最后，我们将基于事件实现用户身份检查。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 为 Inventory 模块创建登录和注销操作\n- 为 Inventory 模块实现用户身份验证\n- 创建员工注册\n\
  - 基于事件验证用户身份\n\n在本章结束时，您将能够控制谁可以访问 Web 应用程序的受限区域。\n\n让我们首先在 Inventory 模块中创建登录页面及其相关的控制器操作。\n\
  \n### 技术要求\n\n与本章相关的所有代码都可以在 https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter09/whatstore\
  \ 中找到。\n\n### 为 Inventory 模块创建登录和注销操作\n\n延续我们的测试驱动开发（TDD）方法，在本节中，我们将首先为登录和注销操作创建测试，然后创建要测试的表单和控制器类以及视图脚本。\n\
  \n### 为登录和注销操作创建测试\n\n如我们所学，创建测试时，我们正在将要求写成源代码。测试说明了我们期望类执行什么操作。现在，我们将在 Inventory\
  \ 模块的 IndexControllerTest 类中添加两个测试方法——一个用于测试登录操作的方法，另一个用于测试注销操作的方法。登录测试方法的源代码如下：\n\
  \n```php\npublic function testLoginActionCanBeAccessed() : void\n{\n    $_POST =\
  \ [\n        'nickname' => 'John Jonz',\n        'password' => 'hronmeer'\n    ];\n\
  \    $this->dispatch('/inventory/index/login', 'POST',\n        $_POST);\n    $this->assertResponseStatusCode(302);\n\
  \    $this->assertModuleName('inventory');\n    $this->assertControllerName('index');\n\
  \    // as specified in router's controller name alias\n    $this->assertControllerClass('IndexController');\n\
  \    $this->assertMatchedRouteName('inventory');\n}\n```\n\n注销测试方法的源代码如下：\n\n```php\n\
  public function testLogoutActionCanBeAccessed() : void\n{\n    $this->dispatch('/inventory/index/logout',\
  \ 'GET');\n    $this->assertResponseStatusCode(200);\n    $this->assertModuleName('inventory');\n\
  \    $this->assertControllerName('index');\n    // as specified in router's controller\
  \ name alias\n    $this->assertControllerClass('IndexController');\n    $this->assertMatchedRouteName('inventory');\n\
  }\n```\n\n现在，您可能会问：“但是 testLoginActionCanBeAccessed 方法如何确保用户能够登录，如果该用户不存在的话？”起初，它不能确保这一点。如果仔细观察，testLoginActionCanBeAccessed\
  \ 方法检查 HTTP 响应是否具有 302 代码——换句话说，loginAction 方法——是否已重定向到其他 URL。如果用户存在，他们将被重定向到菜单页面。测试此时会失败，这在\
  \ TDD 的测试中经常发生。但是现在，在有了失败的测试后，我们可以构建我们的新操作。\n\n### 创建登录和注销操作\n\n如果您现在访问 `http://localhost:8000/inventory`，您将看到\
  \ Laminas 的欢迎页，因为 Inventory 主页是从 Application 模块复制的：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_233_0.png)\n\
  \n图 9.1 – Inventory 模块的主页\n\n我们将修改此页面。首先，我们将修改页面布局。如我们在第 4 章“从对象关系映射到 MVC 容器”中所述，页面布局由\
  \ Application 模块定义。我们将更改 module/Application/view/layout 文件夹中 layout.phtml 文件的某些部分。\n\
  \n要修改的布局文件的第一部分是标题定义。我们直接使用 TITLE 标签定义标题，但 Laminas 为此提供了一个视图助手。您必须修改 `$this->headTitle`\
  \ 的调用，使其如下所示：\n\n```php\n<?= $this->headTitle('Whatstore')->setSeparator(' - ')->\n\
  setAutoEscape(false) ?>\n```\n\n您可能会问：“为什么我需要使用一个方法只为编写不会更改的文本？”事实上，当您使用 $this->headTitle\
  \ 方法生成 TITLE 标签而不是直接编写它时，您允许视图脚本轻松修改标题。\n\n要修改的另一部分是 class 属性等于 navbar-brand 的 A\
  \ 标签。这是显示 Laminas 标志和 MVC 骨架文本的标签。此标签的新内容如下：\n\n```html\n<a class=\"navbar-brand\"\
  \ href=\"<?= $this->url('home') ?>\">\nWhatstore\n</a>\n```\n\n要修改的布局文件的最后部分是 FOOTER\
  \ 标签。此标签的新内容如下：\n\n```html\n<footer>\n<p>\n&copy; <?= date('Y') ?>\nPowered by Sheat\
  \ Software\n</p>\n</footer>\n```\n\n简而言之，我们已修改了可见的页眉和页脚以及标题栏上的文本。\n\n现在，我们将创建一个类来定义登录表单。在\
  \ module/Inventory/src/Form 文件夹中，创建一个名为 LoginForm.php 的文件，并添加以下代码：\n\n### LoginForm.php\n\
  \n```php\n<?php\nnamespace Inventory\\Form;\n\nuse Laminas\\Form\\Form;\nuse Laminas\\\
  Form\\Element\\Text;\nuse Laminas\\Form\\Element\\Password;\n\nclass LoginForm extends\
  \ Form {\n    public function __construct($name = 'user') {\n        parent::__construct($name);\n\
  \        $text = new Text('nickname');\n        $text->setLabel('NickName: ');\n\
  \        $text->setAttribute('autofocus', 'autofocus');\n        $this->add($text);\n\
  \        $password = new Password('password');\n        $password->setLabel('Password:\
  \ ');\n        $this->add($password);\n    }\n}\n```\n\n如您所见，LoginForm 类是 Laminas\\\
  Form\\Form 的扩展，并使用我们在第 8 章“创建表单并实现过滤器和验证器”中已用过的元素类。我们将在 Inventory 模块的 IndexController\
  \ 类中使用 LoginForm。请按如下方式修改 IndexController->indexAction 方法：\n\n```php\npublic function\
  \ indexAction()\n{\n    $form = new LoginForm();\n    return new ViewModel([\n \
  \       'form' => $form\n    ]);\n}\n```\n\n$form 对象被传递到视图层，并将由 modules/Inventory/view/inventory/index\
  \ 中的 index.phtml 文件处理。index.phtml 的内容如下：\n\n### index.phtml\n\n```php\n<?php\n/**\n\
  \ * @var Laminas\\View\\Renderer\\PhpRenderer $this\n */\n$this->headScript()->appendScript(file_get_contents\n\
  \    (__DIR__ . '/index.js'));\n\n```\n\n\n?>\n<h1>Inventory Module</h1>\n<?php\n\
  $form = $this->form;\necho $this->form() ->openTag($form);\necho $this->formLabel($form->get('nickname'));\n\
  echo $this->formText($form->get('nickname')) . '<br />';\necho $this->formLabel($form->get('password'));\n\
  echo $this->formPassword($form->get('password'));\necho $this->form() ->closeTag();\n\
  ?>\n<button id=\"login\">login</button>\n<p>\n<span id=\"api\" url=\"<?=$this->url('inventory',\n\
  ['controller' => 'index', 'action' =>'login'])?>\">\n</span>\n<span id=\"target\"\
  \ url=\"<?=$this->url('inventory',\n['controller' => 'menu'])?>\"></span>\n<a href=\"\
  <?=$this->url('inventory')?>\">Go back</a>\n</p>\n\n请注意，index.phtml 导入了 index.js\
  \ 文件。index.js 文件负责向登录 API 提交 HTTP 请求。让我们来看看 index.js 的源代码：\n\n```\nvar login = function()\
  \ {\n\tvar api = $(\"#api\").attr(\"url\");\n\tvar target = $(\"#target\").attr(\"\
  url\");\n\tvar formData = $(\"#user\").serialize();\n\t$.post(api, formData, function(data)\
  \ {\n\t\tif (!data.logged) {\n\t\t\talert('Invalid data!');\n\t\t\treturn;\n\t\t\
  }\n\n\t\talert(\"user has been logged successfully\");\n\t\twindow.location.href\
  \ = target;\n\t}).fail(function() {\n\t\talert('error');\n\t});\n};\n\n$(document).ready(function()\
  \ {\n  $(\"#login\").click(login);\n});\n```\n\n可以看出，index.js 将 login 函数与按钮点击事件关联起来。login\
  \ 函数使用登录表单中的数据发送 HTTP POST 请求。\n\n此时，测试仍然失败，因为 IndexController 类中不存在 loginAction\
  \ 和 logoutAction 方法。因此，让我们创建它们：\n\n```\npublic function loginAction()\n{\n  $nickname\
  \ = $this->request->getPost('nickname');\n  $password = $this->request->getPost('password');\n\
  \n  $logged = false;\n\n  return new JsonModel([\n    'logged' => $logged\n  ]);\n\
  }\n\npublic function logoutAction()\n{\n  return $this->redirect()->toRoute('inventory');\n\
  }\n```\n\n此时，loginAction 方法尚未完成。因此，测试再次失败。对于 IndexController 类中的每个新方法，您都会收到 HTTP\
  \ 404 错误。例如，对于 loginAction 方法的测试，PHPUnit 的输出必须如下：\n\n> 断言响应代码为 \"302\" 失败，实际状态代码为\n\
  > \"404\"\n\n如果在浏览器中请求 http://localhost:8000/inventory/index/login，您将看到如图 9.2 所示的页面：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_238_0.png)\n\n图 9.2 – 未找到控制器的错误页面\n\n\
  为什么会收到这个错误？因为在 Inventory 模块中没有 `IndexController` 类的别名。如果您观察检查控制器名称的测试部分，可以看到关于别名的以下注释：\n\
  \n```\n$this->assertControllerName('index');\n// as specified in router's controller\
  \ name alias\n```\n\n让我们解决这个问题。在 `module.config.php` 文件中，添加一行将 index 别名与 `IndexController`\
  \ 类关联，如下所示：\n\n```\n'controllers' => [\n    'aliases' => [\n        'index' => Controller\\\
  IndexController::class,\n    ],\n]\n```\n\n此更改将使失败仅剩一个，与 `IndexController` 类的 `loginAction`\
  \ 方法相关。在下一节中，我们将实现用户身份验证来解决此失败。\n\n### 为 Inventory 模块实现用户身份验证\n\n为了对用户进行身份验证，我们将使用\
  \ `laminas-authentication` 组件。以与使用 laminas-db 组件相同的方式添加和安装 `laminas-authentication`\
  \ 组件，使用 Composer。在 Eclipse 中打开 composer.json 文件，通过 Dependencies 选项卡，搜索 laminas/laminas-authentication\
  \ 包并添加它。不要忘记保存文件并单击 Update dependencies 按钮。如果您对如何在 Eclipse 中安装 Composer 依赖项有任何疑问，请阅读第\
  \ 3 章《将 Laminas 作为库与测试驱动开发相结合》中的“创建我们的第一个自动化测试”部分。\n\n安装 laminas-authentication\
  \ 后，我们可以使用此组件修改 IndexController->loginAction 方法。该方法将如下所示：\n\n```\npublic function\
  \ loginAction()\n{\n    $nickname = $this->request->getPost('nickname');\n    $password\
  \ = $this->request->getPost('password');\n    $this->adapter->setIdentity($nickname);\n\
  \    $this->adapter->setCredential($password);\n\n    $logged = false;\n\n    $auth\
  \ = new AuthenticationService();\n    $auth->setAdapter($this->adapter);\n\n   \
  \ $result = $auth->authenticate();\n\n    if ($result->isValid()) {\n        error_log('user\
  \ '. $result->getIdentity() . ' is logged');\n        $logged = true;\n    } else\
  \ {\n        foreach ($result->getMessages() as $message) {\n            error_log($message);\n\
  \        }\n    }\n\n    return new JsonModel([\n        'logged' => $logged\n \
  \   ]);\n}\n```\n\n我们对 `loginAction` 方法做了以下更改：\n\n- 我们将 `$nickname` 变量传递给了 `$adapter`\
  \ 属性的 `setIdentity` 方法。\n- 我们将 `$password` 变量传递给了 `$this->adapter` 属性的 `setCredential`\
  \ 方法。\n- 我们实例化了 `Laminas\\Authentication\\AuthenticationService` 类。\n- 我们将 `$this->adapter`\
  \ 属性传递给了 `Laminas\\Authentication\\AuthenticationService` 实例的 `setAdapter` 方法。\n\
  - 我们调用了 `Laminas\\Authentication\\AuthenticationService` 实例的 `authenticate` 方法，并将返回值赋给了\
  \ `$result` 变量。\n- 我们检查了 `$result` 对象的 `isValid` 方法是否为 true。如果为 true，我们将消息发送到日志，并将\
  \ `$logged` 的状态更改为 true。\n- 如果 `$result` 为 false，我们将每个生成的错误消息发送到日志。\n\n等等！`$this->adapter`\
  \ 属性从哪里来？好问题。我们需要这样声明这个属性：\n\n```\nprivate ?AdapterInterface $adapter;\n```\n\n\
  这个 `$adapter` 属性是 `Laminas\\Authentication\\Adapter\\AdapterInterface`。\n\n### 重要说明\
  \ – 命名空间\n\n我们之前已经为数据库使用过 `AdapterInterface`，但它来自另一个命名空间。请记住，不同命名空间中可以有多个同名类。**适配器**\
  \ 是一种设计模式，可以应用于多个类。因此，Laminas 中可用的不止一个 Adapter 类。\n\n好的，我们需要将 `$adapter` 属性分配给实现\
  \ `Laminas\\Authentication\\Adapter\\AdapterInterface` 的实例。我们将在构造方法中完成此操作：\n\n```\n\
  public function __construct(AdapterInterface $adapter)\n{\n    $this->adapter =\
  \ $adapter;\n}\n```\n\n如果我们直接实例化控制器，一切都可能没问题，但在 Laminas 中我们不会直接实例化控制器。Laminas 通过工厂为我们实例化控制器，我们在\
  \ *第 1 章，介绍 PHP 应用程序的 Laminas* 中讨论过这一点。这就像好莱坞试镜失败的著名说法：*不要给我们打电话，我们会给你打电话*。因此，我们必须创建一个名为\
  \ `IndexControllerFactory` 的工厂类，其源代码如下：\n\n```\n<?php\nnamespace Inventory\\Controller;\n\
  \nuse Laminas\\ServiceManager\\Factory\\FactoryInterface;\nuse Interop\\Container\\\
  ContainerInterface;\nuse Laminas\\Authentication\\Adapter\\DbTable\\CredentialTreatmentAdapter;\n\
  \nclass IndexControllerFactory implements FactoryInterface\n{\n    public function\
  \ __invoke(ContainerInterface $container,\n    $requestedName, array $options =\
  \ null)\n    {\n    $employeeTable = $container->get('EmployeeTable');\n    $adapter\
  \ = new CredentialTreatmentAdapter\n    ($container->get('DbAdapter'));\n    $adapter->setTableName('employees');\n\
  \    $adapter->setIdentityColumn('nickname');\n    $adapter->setCredentialColumn('password');\n\
  \n    return new IndexController($adapter);\n    }\n}\n```\n\n这个工厂类实例化 `CredentialTreatmentAdapter`\
  \ 类。`CredentialTreatmentAdapter` 类允许我们使用数据库表对用户进行身份验证。它需要注入数据库适配器，因为需要访问表。一旦配置了表名、身份列（用户名）和凭据列（用户密码），`IndexControllerFactory`\
  \ 类就会将 `CredentialTreatmentAdapter` 实例注入到 `IndexController` 实例中。\n\n\n\n\n好吧，现在可以进行身份验证了吗？让我们试一下。访问\
  \ http://localhost:8000/inventory，你将看到如图 9.3 所示的页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_242_0.png)\n\
  \n图 9.3 – 库存模块的登录页面\n\n尝试用随机值填写字段并单击登录按钮。结果将是一个带有错误消息的窗口，如图 9.4 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_242_1.png)\n\
  \n图 9.4 – 登录尝试后的错误消息\n\n那么，问题出在哪里？如果你通过浏览器调试器检查 HTTP 响应，将看到以下错误消息：Class \"Laminas\\\
  \\Session\\\\Container\" not found。如果你运行测试，也会看到这条消息：\n\n```\n1) InventoryTest\\\
  Controller\\\nIndexControllerTest::testLoginActionCanBeAccessed\nFailed asserting\
  \ response code \"302\", actual status code is\n\"500\"\n\nExceptions raised:\n\
  Exception 'Error' with message 'Class \"Laminas\\\\Session\\\nContainer\" not found'\
  \ in /opt/lampp/htdocs/whatstore/vendor/\nlaminas/laminas-authentication/src/Storage/Session.php:62\n\
  ```\n\n此错误发生在 laminas-authentication 的一个类中。但是，等等！如果 laminas-authentication 需要这个\
  \ Container 类，为什么 Composer 没有安装它？这是因为 Laminas 组件试图在它们之间保持弱耦合。你不需要使用 Container 来存储身份验证数据。你可以在\
  \ AuthenticationService 构造函数中使用另一个类。可以将另一个存储类注入到 AuthenticationService 构造函数中。但是，由于我们不使用自定义存储类，laminas-authentication\
  \ 需要一个，并默认要求在另一个组件 – laminas-session 中提供实现。\n\n没问题。我们在下一章也将使用 laminas-session。添加并安装\
  \ laminas-session 组件，方法与本章使用 Composer 安装 laminas-authentication 组件类似。在 Eclipse 中打开\
  \ composer.json 文件，通过“依赖项”选项卡搜索 laminas/laminas-session 包并添加它。不要忘记保存文件并单击“更新依赖项”按钮。你是不是又忘记保存文件了，对吧？别担心，我们会重复必要的次数。\n\
  \n安装 laminas-session 后，你可以通过 Web 界面再次尝试登录。结果将是一个显示“Invalid data!”消息的窗口，如图 9.5 所示：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_243_0.png)\n\n图 9.5 – 登录尝试后的警告消息\n\n\
  当然，此刻，无论你输入什么昵称和密码都是无效数据，因为没有注册的员工。为此，我们需要创建员工注册页面。这就是我们将在下一节中要做的事情。\n\n### 创建员工注册\n\
  \n也许我们在上一节中做出了错误的承诺。事实上，想象你已经为员工实现了 CRUD 操作，类似于我们在第 7 章“请求控制和数据视图”中为产品所做的。还想象我们使用\
  \ laminas-form、laminas-filter 和 laminas-validation 实现了这个 CRUD 操作，类似于我们在第 8 章“创建表单并实现过滤器和验证器”中为产品折扣所做的。这并不难想象，因为其源代码实际上可在“技术要求”部分提到的仓库中找到。由于我们使用模式，CRUD\
  \ 实现的结构是相同的。因此，我们假设 module/Inventory/src/Controller 文件夹中有以下类：\n\n- EmployeeAPIController\n\
  - EmployeeAPIControllerFactory\n- EmployeeController\n- EmployeeControllerFactory\n\
  \n请注意，我们有两对类 – 一个 API 控制器及其工厂，以及一个 Web 界面控制器及其工厂。这与我们用于产品控制器层实现的结构完全相同。这些控制器类由 module/Inventory/test/Controller\
  \ 文件夹中的以下类进行测试：\n\n- EmployeeAPIControllerTest\n- EmployeeControllerTest\n\n我们还为折扣实现了一个视图层，这与我们为产品制作的非常相似。因此，我们假设\
  \ module/Inventory/view/inventory/employee 文件夹中有以下视图脚本：\n\n- edit.js\n- edit.phtml\n\
  - index.js\n- index.phtml\n\n在这里，我们有两对文件，生成两个网页 – 插入/更新页面和列表页面。.phtml 文件包含 HTML\
  \ 和 PHP 代码的组合，而 .js 文件专用于 JavaScript 代码。\n\n好，现在我们可以注册员工了。我们可以插入一个员工并检查他们是否可以登录和登出。我们将遵循以下步骤执行：\n\
  \n- 1. 首先，访问 http://localhost:8000/inventory/employee。此 URL 将带你到达如图 9.6 所示的页面：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_245_0.png)\n\n图 9.6 – 员工列表页面\n\n- 2.\
  \ 单击“添加员工”选项。此操作将带你到达如图 9.7 所示的页面。在此示例中，我们正在添加一名名为 Steven Grant 的员工，其昵称为 Mark Spektor，密码为“moonknight”。\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_245_1.png)\n\n图 9.7 – 员工插入表单\n\n- 3.\
  \ 单击**保存**按钮后，你将看到一条确认插入的消息，如我们在*图 9.8*中看到的：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_246_0.png)\n\
  \n*图 9.8 – 员工插入的确认消息*\n\n最后，你将在列表页面看到插入的员工。请注意，过滤器已将字母转换为大写，如*图 9.9*所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_246_1.png)\n\
  \n*图 9.9 – 包含插入员工的员工列表页面*\n\n太棒了！现在我们有一个用于身份验证的用户了。让我们在下一节中使用此用户来测试我们的登录页面。\n\n\
  ### 测试登录页面\n\n根据示例，我们访问 http://localhost:8000/inventory 并使用插入员工的数据填写登录表单。\n\n当你单击**登录**按钮后出现一条显示**“无效数据！”**的消息时，你可能会感到沮丧。“但哪里出了问题？”你可能会想。你一定正确输入了员工昵称和密码，对吧？我相信你。事实上，与密码有一个小细节\
  \ – 它在插入员工时会被加密。因此，我们必须将员工提供的加密密码与存储在 *employees* 表中的加密密码进行比较。\n\n此比较需要对 Employee\
  \ 类进行一些更改。你应该记得 Employee 类有一个私有 encrypt 方法。我们将把此方法修改为 public 和 static，如下所示：\n\n\
  ```\npublic static function encrypt(String $text)\n{\n    $text = strrev(hash('sha256',\
  \ $text));\n    $subtext = substr($text,1,rand(0,strlen($text)-1));\n    $text =\
  \ substr($subtext . $text, 0, strlen($text));\n    return hash('md5', $text);\n\
  }\n```\n\n由于 encrypt 方法被同一类的 exchangeArray 方法使用，我们还必须修改后者，将 $this 关键字更改为 self：\n\
  \n```\npublic function exchangeArray($data)\n{\n    $this->ID = ($data['ID'] ??\
  \ 0);\n    $this->name = ($data['name'] ?? '');\n    $this->nickname = ($data['nickname']\
  \ ?? '');\n    $this->password = (isset($data['password']) ?\n        self::encrypt($data['password'])\
  \ : '');\n}\n```\n\n好了，现在我们可以在 IndexController->loginAction 方法中使用 encrypt 方法。接下来，我们必须替换以下行：\n\
  \n```\n$this->adapter->setCredential($password);\n```\n\n它需要替换为：\n\n```\n$this->adapter->setCredential(Employee::encrypt($password));\n\
  ```\n\n再次尝试登录。再次，你感到失望；你又看到了**无效数据**消息。哪里出了问题？嗯，如果你仔细查看 Employee::encrypt 方法，你会注意到它为相同的密码生成不同的哈希值，因为存在一个随机组件。随机组件非常适合向用户推荐密码，但当加密数据需要相同时，它们不适合用于比较。因此，当你尝试登录时，生成的哈希值与数据库中存储的哈希值不同。\n\
  \n\n\n\n\n由于这个原因，我们必须修改 Employee::encrypt 方法，使其对于相同的输入生成相同的输出。让我们用以下内容修改 Employee::encrypt\
  \ 方法：\n\n```\npublic static function encrypt(String $text)\n{\n    $text = strrev(hash('sha256',\
  \ $text));\n    return hash('md5', $text);\n}\n```\n\n要重新生成密码哈希，您需要编辑 http://localhost:8000/inventory/employee\
  \ 上的员工 Steven Grant。现在，输入相同的密码 moonknight。依次，返回 http://localhost:8000/inventory\
  \ 的登录页面，填写登录表单，然后单击登录按钮。这次，结果将是图 9.10 所示的消息：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_248_0.png)\n\
  \n### 图 9.10 – 员工登录成功的消息\n\n单击确定按钮后，您将看到一个错误页面，如图 9.11 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_248_1.png)\n\
  \n### 图 9.11 – 登录后显示的错误页面\n\n这是预料之中的，因为我们没有创建 MenuController 类和 index 操作的视图文件。为了解决这个问题，我们需要按照以下步骤操作：\n\
  \n- 1. 在 module/Inventory/src/Controller 文件夹中创建 MenuController 类：\n\n### MenuController.php\n\
  \n```php\n<?php\nnamespace Inventory\\Controller;\nuse Laminas\\Mvc\\Controller\\\
  AbstractActionController;\nuse Laminas\\View\\Model\\ViewModel;\nclass MenuController\
  \ extends AbstractActionController\n{\n    public function indexAction()\n    {\n\
  \        return new ViewModel();\n    }\n}\n```\n\n- 2. 将以下条目添加到 modules.config.php\
  \ 文件的 controllers => aliases 键中：\n\n```\n'menu' => Controller\\MenuController::class\n\
  ```\n\n- 3. 将以下条目添加到 modules.config.php 文件的 controllers => factories 键中：\n\n```\n\
  Controller\\MenuController::class => InvokableFactory::class\n```\n\n- 4. 将 router\
  \ => routes => inventory => options => defaults => controller 键的值更改为 index，如下所示：\n\
  \n```\n'controller' => 'index'\n```\n\n- 5. 在 module/Inventory/view/inventory/menu\
  \ 文件夹中创建 index.phtml 文件（您需要创建 menu 文件夹）：\n\n```\n<h1>Inventory Module</h1>\n\n<a\
  \ href=\"<?= $this->url('inventory', ['action' =>\n            'logout']) ?>\">Logout</a>\n\
  ```\n\n- 6. 这些更改后，重新加载 `http://localhost:8000/inventory/menu` 页面，您将看到 **图 9.12**\
  \ 所示的页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_250_0.png)\n\n### 图 9.12 –\
  \ 库存模块的菜单页面\n\n现在，如果您单击 **注销** 选项，将返回登录表单页面。太棒了！看起来它正在工作。但是，如果您现在尝试访问 **库存** 模块的任何其他页面，例如\
  \ `http://localhost:8000/inventory/menu`，您会发现访问任何页面都不需要身份验证。那么，登录页面就没有用了。这是因为我们尚未验证用户身份。但请放心！我们将在下一节中完成此操作。\n\
  \n### 基于事件验证用户身份\n\n为了验证用户身份并知道用户是否已登录，我们将使用一个 `listener` 类。正如我们在 *第 7 章，请求控制和数据视图*\
  \ 中所见，Laminas 使用事件驱动编程来处理请求生命周期的步骤。有一些定义的事件，我们可以创建侦听器，以便在这些事件触发时执行操作。\n\n由于此验证不需要存储数据，我们将使用一个\
  \ `static` 方法（类方法）。因此，我们不需要实例化类。我们将在 `modules/Inventory/src` 中创建一个名为 `Listener`\
  \ 的新文件夹。在这个新文件夹中，我们将创建一个名为 `InventoryAuthenticationListener` 的类。该类将具有一个名为 `verifyIdentity`\
  \ 的方法，如以下源代码所示依次：\n\n### InventoryAuthenticationListener.php\n\n```php\n<?php\n\
  namespace Inventory\\Listener;\n\nuse Laminas\\Mvc\\MvcEvent;\n\nuse Laminas\\Authentication\\\
  AuthenticationService;\n\nuse Laminas\\Http\\PhpEnvironment\\Request;\n\nclass InventoryAuthenticationListener\n\
  {\n    public static function verifyIdentity(MvcEvent $event)\n    {\n        $routeName\
  \ = $event->getRouteMatch()->getMatchedRouteName();\n        if (! $routeName ==\
  \ 'inventory') {\n            return;\n        }\n\n        $authenticationService\
  \ = new AuthenticationService();\n        if (! $authenticationService->hasIdentity())\
  \ {\n            $params = $event->getRouteMatch()->getParams();\n            $controller\
  \ = $params['controller'];\n            $action = $params['action'];\n         \
  \   if ($controller == 'index' && ($action == 'index' || $action == 'login')) {\n\
  \                return;\n            }\n\n            $event->getRouteMatch()->setParam('controller',\
  \ 'index');\n            $event->getRouteMatch()->setParam('action', 'index');\n\
  \        }\n    }\n}\n```\n\n- verifyIdentity 方法接收一个 MvcEvent 对象。MvcEvent 类是 Laminas\\\
  EventManager\\Event 类的专用化，用于 Laminas MVC 实现。这意味着 MvcEvent 类具有适用于任何类型事件的 Event 类的通用实现以及针对\
  \ MVC 事件的特定实现。MvcEvent 对象可以访问 Application 实例以及 modules.config.php 文件中配置的每个对象。\n\n\
  - 我们使用 `MvcEvent` 的 `getRouteMatch` 方法来检索一个 `RouteMatch` 对象。该对象存储关于匹配路由的数据。`RouteMatch->getMatchedRouteName`\
  \ 方法返回与请求的 URL 匹配的路由名称。\n\n- 我们使用路由名称来确定请求的模块是否为 `Inventory`。由于 `InventoryAuthenticationListener`\
  \ 仅用于 `Inventory` 模块，如果请求来自另一个模块，我们将中止 `verifyIdentity` 方法。\n\n- 如果请求的模块是 `Inventory`，我们将实例化\
  \ `AuthenticationService` 类并调用 `hasIdentity` 方法。只有在用户已通过身份验证时，此方法才返回 `true`。\n\n\
  - 如果用户未通过身份验证，我们将通过 `RouteMatch` 实例的 `getParams` 方法从匹配的路由中检索控制器和操作名称。\n\n- 员工（即库存用户）可以无需身份验证即可访问\
  \ `IndexController->indexAction` 和 `IndexController->loginAction` 方法，然后这两个方法将被身份验证侦听器类忽略。\n\
  \n- 对于 `Inventory` 模块的任何其他控制器和操作，如果用户未通过身份验证，我们将将其重定向到登录页面。\n\n请注意，我们在实例化控制器之前拦截应用程序请求。我们不需要发出\
  \ HTTP 请求来将用户重定向到登录页面。目标更改是在同一 HTTP 请求中完成的。\n\n但是，谁会调用 `InventoryAuthenticationListener`？侦听器类由事件调用。我们使用\
  \ `Laminas\\EventManager\\EventManager` 类来关联侦听器和事件。在 `index.php` 文件中创建的 `Laminas\\\
  Mvc\\Application` 对象具有一个 `Laminas\\EventManager\\EventManager` 实例。我们将使用此实例将 `InventoryAuthenticationListener`\
  \ 添加为 `EVENT_ROUTE` 事件的侦听器。`EVENT_ROUTE` 事件在路由匹配后分发，因此我们拥有关于用户所需资源和请求初始目标的所有必要数据。\n\
  \n`public` 文件夹中 `index.php` 文件的最后一行是：\n\n```\nApplication::init($appConfig)->run();\n\
  ```\n\n让我们修改此前一行，将方法调用分为以下两步：\n\n```\n$app = Application::init($appConfig);\n$app->run();\n\
  ```\n\n我们在这些行中所做的与前一行中所做的相同，但放在不同的行中。`Laminas\\Mvc\\Application` 的实例现在存储在 `$app`\
  \ 变量中。让我们在它们之间引入一行新代码：\n\n```php\n$app = Application::init($appConfig);\n$app->getEventManager()->attach(MvcEvent::EVENT_ROUTE,\n\
  \    [InventoryAuthenticationListener::class, 'verifyIdentity']);\n$app->run();\n\
  ```\n\n我们在这里做什么？EventManager 的 attach 方法将侦听器关联到一个事件。换句话说，当指定的事件被分发时，侦听器会收到通知。侦听器可以是静态方法、对象方法或函数。对于静态方法，我们需要传递一个包含两个元素的数组——类名和方法名。对于对象方法，我们需要将实例作为数组的第一个元素传递。对于函数，只需将函数名作为\
  \ attach 方法的第二个参数。\n\n> **记住，记住命名空间！**\n>\n> 请记住，InventoryAuthenticationListener\
  \ 是为 `Inventory\\Listener` 命名空间定义的，因此您的 index.php 文件顶部必须有 `use Inventory\\Listener\\\
  InventoryAuthenticationListener;`。缺少命名空间是错误的常见来源。\n\n让我们修改菜单视图以显示用户身份。使用以下内容更改库存模块的\
  \ MenuController->indexAction 方法的内容：\n\n```php\npublic function indexAction()\n\
  {\n    $auth = new AuthenticationService();\n    return new ViewModel(['user' =>\
  \ $auth->getIdentity()]);\n}\n```\n\nAuthenticationService 类的 getIdentity 方法返回身份验证中的匹配身份。依次，使用以下内容更改\
  \ module/Inventory/view/inventory/menu 文件夹中 index.phtml 文件的内容：\n\n```html\n<h1>Inventory\
  \ Module</h1>\n\n<p>Hi, <?=$this->user?></p>\n<a href=\"<?=$this->url('inventory',\
  \ ['action' => 'logout'])?>\">Logout</a>\n```\n\n\n\n现在，您可以再次登录。这一次，您将在菜单页面上看到用户的姓名，如图\
  \ 9.13 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_254_0.png)\n\n图 9.13 – 带有用户身份的菜单页面\n\
  \n点击 **注销** 选项，并尝试访问任何 `Inventory` 模块页面，例如位于 `http://localhost:8000/inventory/employee`\
  \ 的员工注册页面或位于 `http://localhost:8000/inventory/product` 的产品注册页面。您将看到自己始终会被重定向到登录页面。这是因为您未经过身份验证。现在，访问\
  \ `Inventory` 模块仅限员工。\n\n身份验证似乎已成功实现。但是，随后运行一些测试时，您会看到如下错误：\n\n```\n1) InventoryTest\\\
  Controller\\IndexControllerTest::testIndexActionCanBeAccessed\nFailed asserting\
  \ controller name \"inventory\\\\controller\\\\indexcontroller\", actual controller\
  \ name is \"index\"\n\n/opt/lampp/htdocs/whatstore/vendor/laminas/laminas-test/src/PHPUnit/Controller/AbstractControllerTestCase.php:611\n\
  /opt/lampp/htdocs/whatstore/module/Inventory/test/Controller/IndexControllerTest.php:34\n\
  \n2) InventoryTest\\Controller\\IndexControllerTest::testLoginActionCanBeAccessed\n\
  Failed asserting response code \"302\", actual status code is \"200\"\n\n/opt/lampp/htdocs/whatstore/vendor/laminas/laminas-test/src/PHPUnit/Controller/AbstractControllerTestCase.php:434\n\
  /opt/lampp/htdocs/whatstore/module/Inventory/test/Controller/IndexControllerTest.php:46\n\
  \n3) InventoryTest\\Controller\\IndexControllerTest::testLogoutActionCanBeAccessed\n\
  Failed asserting response code \"200\", actual status code is \"302\"\n\n/opt/lampp/htdocs/whatstore/vendor/laminas/laminas-test/src/PHPUnit/Controller/AbstractControllerTestCase.php:434\n\
  /opt/lampp/htdocs/whatstore/module/Inventory/test/Controller/IndexControllerTest.php:56\n\
  ```\n\n让我们逐一修复这些问题：\n\nIndexControllerTest::testIndexActionCanBeAccessed 方法中的错误是因为我们在\
  \ module.config.php 中更改了 inventory 路由的默认控制器值。\n\n必须在 IndexControllerTest::testIndexActionCanBeAccessed\
  \ 中替换以下行：\n\n```\n$this->assertControllerName(IndexController::class);\n```\n\n\
  将其替换为以下内容：\n\n```\n$this->assertControllerName('index');\n```\n\n实际上，修复此错误的指示已在调用\
  \ assertControllerName 方法后出现的路由器控制器名称别名注释中说明。我们已将此行和此注释复制到第 7 章“请求控制和数据视图”的“使用控制器和视图页面实现\
  \ CRUD”部分中。\n\nInventoryTest\\Controller\\IndexControllerTest::testLoginActionCanBeAccessed\
  \ 方法中的错误是因为 IndexController->loginAction 返回 HTTP 200 状态码。是 JavaScript 将我们重定向到菜单页面，但我们在此不测试\
  \ JavaScript。\n\n将 assertResponseStatusCode 参数改为 200，如以下代码行所示：\n\n```\n$this->assertResponseStatusCode(200);\n\
  ```\n\n- InventoryTest\\Controller\\IndexControllerTest::testLogoutActionCanBeAccessed\
  \ 方法中的错误是因为 IndexController->logoutAction 将我们重定向到登录页面，返回 HTTP 302 状态码。\n\n为解决此问题，将\
  \ assertResponseStatusCode 参数改为 302，如以下代码行所示：\n\n```\n$this->assertResponseStatusCode(302);\n\
  ```\n\n准备就绪。您现在可以成功运行测试了。恭喜！您现在已在 Inventory 模块中实现身份验证！您可能认为这更困难，但现在您可以看到它并不复杂。\n\
  \n好吧，我们可以在此停止，但在结束身份验证讨论之前，需要对 index.php 文件做一处适当的更改。在下一节中，我们将学习如何将侦听 EVENT_ROUTE\
  \ 事件的责任从 index.php 转移到 Inventory 模块。\n\n### 将身份验证侦听器委托给模块\n\n在上一节中，您了解到除了 run 方法之外，还可以从\
  \ Application 实例调用其他方法。在将应用程序控制从您的代码反向转移到 Laminas 之前，可以通过 Application 类修改行为。\n\n\
  但是，实例化 Application 的 index.php 文件不是修改每个应用程序行为的合适位置。在面向对象的应用程序中，我们需要将每个操作委托给适当的类。当我们在\
  \ index.php 中附加事件侦听器时，我们正在将管理事件的责任委托给此文件。问题是 index.php 是否应该对此负责。\n\n思考一下——谁负责确保\
  \ Inventory 模块具有身份验证控制？也许这个问题并非最佳。让我们再问一个——Inventory 模块是否始终需要身份验证控制？是的！访问将始终受到限制。因此，让\
  \ Inventory 模块负责其自身的所有身份验证控制似乎很合适。如果此模块在其他项目中重用，身份验证控制侦听将已经嵌入其中。\n\n没错，我们如何将附加身份验证事件侦听器的责任从\
  \ index.php 转移到 Inventory 模块？第一步是在 index.php 中回滚更改。这意味着应替换以下行：\n\n```\n$app = Application::init($appConfig);\n\
  $app->getEventManager()->attach(MvcEvent::EVENT_ROUTE,\n[InventoryAuthenticationListener::class,\
  \ 'verifyIdentity']);\n$app->run();\n```\n\n应将其替换为以下行：\n\n```\n$app = Application::init($appConfig)->run();\n\
  ```\n\n下一步是在 Inventory 模块的 Module 类中添加一个新方法。即 onBootstrap 方法。当触发 EVENT_BOOTSTRAP\
  \ 事件时会调用此方法。这是一个合理的选择，因为 EVENT_ROUTE 事件是序列中的下一个：\n\n```\n/**\n * @param \\Laminas\\\
  Mvc\\MvcEvent $e The MvcEvent instance\n * @return void\n */\npublic function onBootstrap($e)\n\
  {\n    $application = $e->getApplication();\n    $application->getEventManager()->attach(MvcEvent::EVENT_ROUTE,\n\
  \    [InventoryAuthenticationListener::class, 'verifyIdentity']);\n}\n```\n\n请注意，onBootstrap\
  \ 方法接收一个 MvcEvent 对象。该对象可以访问 Application 实例——即在 index.php 中创建的同一实例。onBootstrap 方法的第二行执行的正是从\
  \ index.php 移除的相同操作。这样一来，职责转移就完成了。Inventory 模块负责其自身的身份验证过程。它不依赖另一个组件来确保身份验证。\n\n\
  我们更改了身份验证实现，但未更改其行为。您现在可以再次运行测试以检查一切是否正常。不幸的是，运行测试时，PHPUnit 会显示一些失败。您会看到如下几条错误消息：\n\
  \n> Failed asserting controller name \"discount\", actual controller name is \"\
  index\"\n\n事实上，您会注意到所有错误消息都有相同的模式——匹配的控制器名称是 IndexController。为什么？\n\n原因是现在在测试运行之前会附加\
  \ InventoryAuthenticationListener。测试不使用 index.php。因此，当由 index.php 执行附加时，没有进行身份验证检查，因为\
  \ PHPUnit 测试用例未调用 index.php。现在，由于由 Inventory 模块执行侦听器附加，因此每个请求都会执行身份验证检查。\n\n这是否意味着我们需要提前进行身份验证才能测试？其实不然。我们想测试的是单元，而不是完整流程。目前，为测试上下文禁用身份验证检查就足够了。这可以通过向\
  \ Inventory 模块的 Module::onBootstrap 方法添加条件指令来实现。我们验证是否定义了 PHPUNIT_COMPOSER_INSTALL\
  \ 常量。此常量由 PHPUnit 定义，作为 Composer 依赖项安装，在我们的情况中也是如此。\n\n```\npublic function onBootstrap($e)\n\
  {\n    if (defined('PHPUNIT_COMPOSER_INSTALL')) return;\n    $application = $e->getApplication();\n\
  \    $application->getEventManager()->attach(MvcEvent::EVENT_ROUTE,\n    [InventoryAuthenticationListener::class,\
  \ 'verifyIdentity']);\n}\n```\n\n最后，您可以成功运行测试了！\n\n### 摘要\n\n在本章中，我们学习了如何使用面向事件的编程来实现用户身份验证检查流程。\n\
  \n首先，我们为 Inventory 模块创建了由 IndexController 类处理的登录页面。接着，我们安装了 laminas-authenticator\
  \ 组件并使用它来对 Inventory 模块的用户（即员工）进行身份验证。然后，我们学习了如何通过回忆在第 7 章“请求控制和数据视图”和第 8 章“创建表单并实现过滤器和验证器”中所学的内容来实现员工注册页面。最后，我们学习了如何使用\
  \ laminas-eventmanager 验证经过身份验证的用户。\n\n在下一章中，我们将学习如何使用事件驱动编程为用户实现授权。\n\n\n\n\n"
- "## 事件驱动授权\n\n本章介绍了开发安全应用程序时的一个重要主题：授权。\n\n授权是检查已识别人员允许执行的操作。物理世界中授权的一个例子是：一个人进入大楼后，可以访问哪些楼层和房间的控制。这可以由人员、钥匙或卡片来执行，甚至只有经过授权的楼层才能打开的电梯也是如此。简而言之，授权是某人可以对一组资源执行的操作的限制。\n\
  \n在本章中，你将学习如何使用面向事件的编程来实现授权控制。首先，我们将为角色和资源创建注册，这是基于角色的访问控制（RBAC）方法的主要概念。我们将资源与角色、角色与用户关联起来，以便按顺序为库存模块中的员工实现授权控制。最后，我们将创建一个监听器来验证每个请求的用户权限。\n\
  \n在本章中，我们将介绍以下主题：\n\n- 创建角色注册\n- 创建资源注册\n- 将资源与角色关联\n- 将角色与用户关联\n- 实现访问控制\n- 验证用户权限\n\
  - 修改测试引导程序\n- 创建身份管理器\n\n在本章结束时，你将能够控制应用程序中每个用户可以处理哪些资源。\n\n让我们先从创建角色和资源的注册开始。\n\
  \n### 技术要求\n\n本章相关的所有代码可以在 https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter10/whatstore\
  \ 找到。\n\n**重要提示：可能会出现会话崩溃**\n\n在本章中，我们将更改应用程序在会话中存储的数据结构。如果你没有从 *第 9 章，事件驱动身份验证*\
  \ 的应用程序中登出，然后尝试登录本章的应用程序，你会惊讶地发现会话错误。如果发生这种情况，在继续之前请清除会话。如果你不想通过浏览器清除会话，可以使用 https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/util\
  \ 中提供的脚本。\n\n### 创建角色注册\n\n员工是库存模块的用户。员工随时间在公司中担任不同的角色。员工可以完成休假同事的工作。员工在老板休假时也可能代替老板。在不同时间，员工根据需要完成的任务拥有不同的权限。因此，我们不应将员工和权限强耦合，因为权限与角色更相关。\n\
  \n事实上，假设你已经像在 *第 7 章，请求控制和数据视图* 中针对产品所做的那样，为角色实现了 CRUD。同样，假设你像在 *第 8 章，创建表单并实现过滤器和验证器*\
  \ 中针对产品折扣所做的那样，使用 laminas-form、laminas-filter 和 laminas-validation 实现了此 CRUD。这并不难想象，因为源代码实际上可在\
  \ *技术要求* 节中提到的仓库中找到。由于我们使用模式，CRUD 实现的结构是相同的。是的，我们产生了既视感。\n\n因此，我们假设 module/Inventory/src/Model\
  \ 文件夹中有以下类：\n\n- Role\n- RoleTable\n- RoleTableFactory\n\n重要的是要记住，每个表网关类的工厂必须通过\
  \ modules.config.php 文件中的 service_manager 键进行配置。\n\n我们还假设 module/Inventory/src/Controller\
  \ 文件夹中有以下类：\n\n- RoleAPIController\n- RoleAPIControllerFactory\n- RoleController\n\
  - RoleControllerFactory\n\n你可以观察到，我们有两组类：一个 API 控制器及其工厂，以及一个 Web 界面控制器及其工厂。这与我们用于产品控制器层实现的结构完全相同。这些控制器类由\
  \ module/Inventory/test/Controller 文件夹中的以下类进行测试：\n\n- RoleAPIControllerTest\n- RoleControllerTest\n\
  \n重要的是要记住，每个控制器类的别名和工厂必须通过 modules.config.php 文件中的 controllers 键进行配置。\n\n我们还为角色提供了一个视图层实现，它与我们对产品的实现非常相似。因此，我们假设\
  \ module/Inventory/view/inventory/employee 文件夹中有以下视图脚本：\n\n- edit.js\n- edit.phtml\n\
  - index.js\n- index.phtml\n\n这里，我们有两组文件生成两个网页：插入/更新页面和列表页面。.phtml 文件包含 HTML 和 PHP\
  \ 代码的组合，而 .js 文件仅包含 JavaScript 代码。\n\n好了，我们现在有了角色注册。这个注册比员工注册简单，因为只有两个属性：代码和名称。在下一节中，我们将创建资源注册。\n\
  \n### 创建资源注册\n\n当我们处理权限时，我们谈论的是某人可以对某物执行某个操作。在我们正在使用的模型中，执行操作的是角色。角色操作影响的对象是资源。\n\
  \n角色可能更容易理解，因为你可以迅速在用户和角色之间建立联系。当我们谈论用户和角色时，你可以想象真实的人。\n\n但是资源是什么？似乎我们在谈论经济学……不，对于访问控制系统，资源是角色可以处理的任何东西。资源可以是对象、URL、可视组件等。这取决于系统。或者更确切地说，取决于系统需求。资源是系统需求的一部分。必须有一个系统来确定谁可以做什么。这是业务的一部分。因此，系统的客户需要说明他们在访问控制方面的期望。\n\
  \n你还记得 Whatstore 的首席执行官 Mr. Heythere 吗？是的，有人雇佣了 Sheat Software 来构建一个很棒的电子商务网站。好吧，Sheat\
  \ Software 的架构师 Mr. Worried 与 Mr. Heythere 谈论了员工权限。Mr. Heythere 对如何控制访问没有明确的想法，并向\
  \ Mr. Worried 请教建议。Mr. Worried 使用中世纪城堡比喻向 Mr. Heythere 解释了一下 Laminas 的结构。Mr. Heythere\
  \ 喜欢控制器和操作的概念。他觉得它们很有趣。Mr. Heythere 决定，Whatstore 系统的资源每个都可以是库存模块的控制器和操作的组合。\n\n\
  想象一下，在定义资源定义后，你像在上一节为角色所做的那样，为资源实现 CRUD。你应该理解注册的 MVC 实现。因此，我们不会重复。让我们专注于如何填充资源表。\n\
  \n### 填充资源表\n\n事实上，要授予权限，我们至少需要一个注册用户（员工），该用户与一个角色关联并注册了资源。我们可以使用脚本准备数据库并填充一些必要记录来提供这些条件。我们将在\
  \ whatstore 项目的 bin 文件夹中创建一个名为 loaddatabase.php 的脚本。如我们在 *第 5 章，创建虚拟商店项目* 中所见，bin\
  \ 文件夹存储自动化脚本。\n\nload_database.php 脚本文件以依赖项声明开始：\n\n```\n<?php\nuse Laminas\\Db\\\
  Adapter\\Adapter;\nuse Laminas\\Stdlib\\ArrayUtils;\nuse Inventory\\Model\\Employee;\n\
  use Laminas\\Db\\Adapter\\AdapterInterface;\n\nrequire __DIR__ . '/../vendor/autoload.php';\n\
  ```\n\n在前面的代码块中，我们使用 laminas-db 的 Adapter 类和 AdapterInterface 接口来创建一个抽象数据库连接的对象。ArrayUtils\
  \ 类用于正确合并配置数组。由于密码加密，我们需要显式引用 Employee 类。为了找到所有这些类和接口，我们必须导入 Composer 自动加载文件 (autoload.php)。接下来，我们将声明一个函数\
  \ (getConfig) 来获取应用程序配置，如下所示：\n\n```\nfunction getConfig() : array\n{\n```\n\n\n\
  \n```php\n$config = require __DIR__ . '../config/autoload/global.php';\n\nif (file_exists(__DIR__\
  \ . '../config/autoload/local.php')) {\n    $override = require __DIR__ . '../config/autoload/local.php';\n\
  \    $config = ArrayUtils::merge($config, $override);\n}\n\nreturn $config;\n}\n\
  ```\n\n此getConfig函数与public文件夹中index.php文件使用的代码行相同。该函数部分模拟了应用程序初始化。接下来，我们将声明另一个函数（recreateDatabase）来删除数据库并用一些基本数据重新创建它：\n\
  \n```php\nfunction recreateDatabase(AdapterInterface $adapter) : void\n{\n    echo\
  \ \"Dropping database...\\n\";\n    $adapter->query('DROP DATABASE IF EXISTS whatstore',\
  \ Adapter::QUERY_MODE_EXECUTE);\n    $sqlscript = file_get_contents(__DIR__ . '/whatstore.sql');\n\
  \    echo \"Creating database and tables...\\n\";\n    $adapter->query($sqlscript,\
  \ Adapter::QUERY_MODE_EXECUTE);\n    echo \"Whatstore database has been created.\\\
  n\";\n}\n```\n\nrecreateDatabase函数使用AdapterInterface实现来删除数据库并按顺序使用SQL脚本（可在GitHub仓库中找到）重新创建它。接下来，我们声明一个函数（addUserAndRole）来在employee表中创建和记录，并在roles表中创建另一个：\n\
  \n```php\nfunction addUserAndRole($adapter) : void\n{\n    $password = Employee::encrypt('moonknight');\n\
  \    $sqlscript = <<<SQL\n    INSERT INTO `employees`(`ID`, `name`, `nickname`,\
  \ `password`) VALUES (NULL,'STEVEN GRANT','MARK SPEKTOR','$password');\nSQL;\n \
  \   $adapter->query($sqlscript, Adapter::QUERY_MODE_EXECUTE);\n    $sqlscript =\
  \ <<<SQL\n    INSERT INTO `roles`(`code`, `name`) VALUES (NULL,'ADMIN');\nSQL;\n\
  \    $adapter->query($sqlscript, Adapter::QUERY_MODE_EXECUTE);\n    $sqlscript =\
  \ <<<SQL\n    INSERT INTO `employee_roles`(`code`, `code_role`, `ID_employee`) VALUES\
  \ (NULL,(SELECT code FROM `roles` WHERE name = 'ADMIN'),(SELECT ID FROM `employees`\
  \ WHERE name = 'STEVEN GRANT'));\nSQL;\n    $adapter->query($sqlscript, Adapter::QUERY_MODE_EXECUTE);\n\
  \    echo \"A user and a role were created.\\n\";\n}\n```\n\naddUserAndRole函数使用AdapterInterface实现来插入一个员工，插入一个角色，然后在此员工和该角色之间在employee_roles表中建立关联。接下来，我们将声明一个函数（addResource）来提取关于Inventory控制器及其方法的数据以注册资源：\n\
  \n```php\nfunction addResources($adapter): void\n{\n    $dir = scandir(realpath(__DIR__\
  \ . './../module/Inventory/src/Controller'));\n\n    $controllers = [];\n\n    foreach\
  \ ($dir as $file) {\n        if (strpos($file, 'Controller.php') != false) {\n \
  \           $controllers[] = 'Inventory\\\\Controller\\\\' . str_replace('.php',\
  \ '', $file);\n        }\n    }\n\n    $resources = getResources($controllers);\n\
  \n    $sqlscript = <<<SQL\n    INSERT INTO `resources`(`code`, `name`, `method`)\
  \ VALUES\n    $resources;\nSQL;\n\n    $adapter->query($sqlscript, Adapter::QUERY_MODE_EXECUTE);\n\
  \n    echo \"Resources were created.\\n\";\n}\n```\n\naddResources函数有什么作用？让我们来了解一下：\n\
  \n- 首先，该函数扫描控制器目录，并创建一个包含所有Inventory控制器完全限定名称的列表。\n- 然后，该函数调用getResources函数来获取资源列表。\n\
  \ngetResources函数接收一个数组，即Inventory控制器列表。该函数的代码如下：\n\n```php\nfunction getResources(array\
  \ $controllers): string\n{\n    $actionMethods = ['getMethodFromAction', 'notFoundAction'];\n\
  \    $httpMethods = ['create', 'update', 'get', 'delete'];\n    $restMethods = [\n\
  \        'create' => 'POST',\n        'update' => 'PUT',\n        'get' => 'GET',\n\
  \        'delete' => 'DELETE'\n    ];\n\n    $resources = '';\n\n    foreach ($controllers\
  \ as $controller) {\n        $methods = get_class_methods($controller);\n      \
  \  foreach ($methods as $method) {\n            $alias = str_replace('Inventory\\\
  \\Controller\\\\', '', $controller);\n            $alias = strtolower(str_replace('Controller',\
  \ '', $alias));\n            if (strpos($method, 'Action') != false && !in_array($method,\
  \ $actionMethods)) {\n                $method = str_replace('Action', '', $method);\n\
  \                $resources .= \"(NULL,'$alias.$method', 'GET'),\";\n          \
  \      $resources .= \"(NULL,'$alias.$method', 'POST'),\";\n            }\n    \
  \        if (in_array($method, $httpMethods)) {\n                $resources .= \"\
  (NULL,'$alias.{$method}', '{$restMethods[$method]}'),\";\n            }\n      \
  \  }\n    }\n}\n```\n\n请注意，getResources函数生成一个列表，其中包含控制器别名和方法名称的连接。选定的方法是那些带有Action后缀的方法（除了从超类继承的一些方法外），或者具有与REST架构相关的特定名称的方法。\n\
  \n资源列表被连接到一个SQL INSERT语句中，该语句随后被执行。在addResources函数结束时，resources表被填充了Inventory资源，这些资源的访问必须受到控制。\n\
  \ngrantPermissionsToRole函数使用AdapterInterface实现来授予admin角色访问所有由addResources函数注册的资源的权限。在以下代码块中，我们可以看到grantPermissionsToRole函数的源代码：\n\
  \n```php\nfunction grantPermissionsToRole(AdapterInterface $adapter): void\n{\n\
  \    $statement = $adapter->query('SELECT code FROM `resources`');\n    $results\
  \ = $statement->execute();\n\n    foreach ($results as $row) {\n        $sqlscript\
  \ = <<<SQL\n        INSERT INTO `resources_role`(`code`, `code_role`, `code_resource`)\
  \ VALUES (NULL, (SELECT code FROM `roles` WHERE name = 'ADMIN'),{$row['code']});\n\
  SQL;\n\n        $adapter->query($sqlscript, Adapter::QUERY_MODE_EXECUTE);\n    }\n\
  \n    echo \"Permissions were granted.\\n\";\n}\n```\n\n这些函数由以下脚本编排：\n\n```php\n\
  // main program\n\n$config = getConfig();\n$db = $config['db'];\nunset($db['database']);\
  \ // remove database key because it causes error in connection when database does\
  \ not exist\n$adapter = new Adapter($db);\n\ntry {\n    recreateDatabase($adapter);\n\
  \    $db = $config['db'];\n    $adapter = new Adapter($db);\n    addUserAndRole($adapter);\n\
  \    addResources($adapter);\n    grantPermissionsToRole($adapter);\n} catch (Exception\
  \ $e) {\n    echo 'Fail to recreate the database.' . $e->getMessage() . \"\\n\"\
  ;\n}\n```\n\n我们为什么要创建这个脚本？因为我们需要有一个可以进行身份验证和授权的用户。现在，如果没有有效用户或没有权限的用户，我们如何在`Inventory`模块中导航？你可以在`bin`目录中运行以下脚本：\n\
  \n```\nphp load_database.php\n```\n\n执行结束时，你将拥有一个用户（员工）、一个角色、资源以及用户访问所有这些资源的权限。现在，你可以在本章后面启用授权控制后浏览`Inventory`模块。但在这样做之前，我们需要实现注册来将角色与资源关联，并将用户与角色关联。`load_database.php`脚本文件仅为一个用户Steven\
  \ Grant完成了这些注册和关联，因此他是我们的超级用户或管理员用户。但是，管理员需要一个界面来将角色与用户关联，并授予用户权限。让我们看看如何按顺序在下一节中实现角色与资源之间的关联。\n\
  \n### 将资源与角色关联\n\n我们不会重复已经完成的注册细节。角色资源的实现代码可在*技术要求*部分提到的本章源代码文件夹中找到。在这里，我们将仅关注与资源和角色关联相关的差异。角色资源的注册基于`resources_role`表。\n\
  \n我们有一个`RoleResourceController`类来处理两个页面：一个用于列出和删除资源与角色的对（`index.phtml`），另一个用于插入资源与角色的对（`edit.phtml`）。为了执行这些操作，`RoleResourceController`构造函数需要接收三个表网关类，如下面的代码片段所示：\n\
  \n```php\npublic function __construct(RoleResourceTable $roleResourceTable, ResourceTable\
  \ $resourceTable, RoleTable $roleTable)\n{\n    $this->roleResourceTable = $roleResourceTable;\n\
  \    $this->resourceTable = $resourceTable;\n    $this->roleTable = $roleTable;\n\
  }\n```\n\nRoleResourceController类的indexAction方法与之前的控制器类似。该方法提供一个带有角色对资源权限的HTML页面，如图10.1所示。此页面是对http://localhost:8000/inventory/roleresource请求的输出：\n\
  \n\n\n### 角色和资源\n\n授予权限\n\n| 代码 | 角色 | 资源 |\n|---|---|---|\n| 8 | ADMIN | discount.edit\
  \ |\n| 7 | ADMIN | discount.edit |\n| 6 | ADMIN | discount.index |\n| 5 | ADMIN\
  \ | discount.index |\n| 1 | ADMIN | discountapi.create |\n| 4 | ADMIN | discountapi.delete\
  \ |\n| 2 | ADMIN | discountapi.get |\n| 3 | ADMIN | discountapi.update |\n| 16 |\
  \ ADMIN | employee.edit |\n| 15 | ADMIN | employee.edit |\n| 13 | ADMIN | employee.index\
  \ |\n| 14 | ADMIN | employee.index |\n| 9 | ADMIN | employeeapi.create |\n| 12 |\
  \ ADMIN | employeeapi.delete |\n\n图 10.1: 角色及其资源\n\n图 10.1 所示页面允许您为角色移除权限。如您所见，列表按角色名称排序，而非按权限代码排序。该列表由\
  \ RoleResourceTable->getAll 方法生成。该方法构建并执行一条 SQL SELECT 语句，用于连接 resources_role、resources\
  \ 和 roles 表。getAll 方法已在后文列出。事实上，您在第 7 章“请求控制和数据视图”的“测试 Web 界面与 API 之间的交互”一节中，已经见过与\
  \ Select 类一起使用 INNER JOIN 子句的示例。以下源代码中的新增内容是使用 order 方法，它会生成 SQL 的 ORDER BY 子句：\n\
  \n```php\npublic function getAll($where = null) : iterable\n{\n    $select = new\
  \ Select($this->tableGateway->\n        getTable());\n    $select->join('resources','resources_role.code_resource=resources.code',\
  \ ['resource' => 'name'])\n->join('roles', 'resources_role.code_role=roles.code',\
  \ ['role' => 'name'])\n->order(['roles.name', 'resources.name']);\nif (!is_null($where))\
  \ {\n    $select->where($where);\n}\nreturn $this->tableGateway->selectWith($select);\n\
  }\n```\n\n您可以看到，图 10.1 所示页面有一个“授予权限”超链接。该超链接会调用 RoleResourceController->editAction\
  \ 方法。该方法使用两个表网关对象来填充两个不同的下拉列表，如以下源代码所示：\n\n```php\npublic function editAction()\n\
  {\n    $form = new RoleResourceForm();\n    $resources = [];\n    $rows = $this->resourceTable->getAll();\n\
  \    foreach($rows as $row) {\n        $resources[$row->code] = $row->name;\n  \
  \  }\n\n    $roles = [];\n    $rows = $this->roleTable->getAll();\n    foreach($rows\
  \ as $row) {\n        $roles[$row->code] = $row->name;\n    }\n\n    $form->get('code_resource')->setValueOptions\n\
  \        ($resources);\n    $form->get('code_role')->setValueOptions($roles);\n\
