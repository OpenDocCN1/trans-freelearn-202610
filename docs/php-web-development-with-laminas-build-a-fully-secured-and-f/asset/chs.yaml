- '# Laminas PHP Web开发：使用 Laminas 框架构建完全安全且功能完善的 PHP 电子商务应用程序






  '
- "## 前言\n\n_使用 Laminas 进行 PHP Web 开发_ 作者 Flávio Gomes da Silva Lisboa 是一本非常好的书，如果你对使用\
  \ PHP 进行 Web 开发感兴趣的话。作者展示了如何使用分步方法，通过 Laminas 开源项目（前身为 Zend Framework）实现一个完整的电子商务应用程序。我非常喜欢作者的方法，不仅介绍了框架的用法，还介绍了许多最佳实践，如测试驱动开发、行为驱动开发、敏捷开发原则等。如果你想使用\
  \ PHP 构建专业的 Web 应用程序，这绝对是一本值得拥有的书。\n\n> _Enrico Zimuel，Elastic 首席软件工程师，PHP Framework\
  \ Interop Group 成员，曾任 Zend Framework 核心开发人员_\n\n## 贡献者\n\n## 关于作者\n\n**Flávio Gomes\
  \ da Silva Lisboa** 是 SERPRO 的一名开发分析师，参与了巴西政府的多个项目，是软件开发课程的讲师，软件开发学科的教师，以及巴西 PHP\
  \ 社区的成员。他还曾是餐厅和工业厨房桌面应用程序的程序员，以及巴西银行国际董事会的系统分析师。他有时会写科幻浪漫小说，如 *唯一者：孤独与和谐* 和 *Pandino，皇帝*。你可以在\
  \ `https://fgsl.eti.br` 上阅读更多关于他和他的冒险的信息。\n\n我想感谢那些一直陪伴在我身边并支持我的人，尤其是我的妻子 Maria\
  \ 和女儿 Koriander。她们是我想要进步的原因。这段文字之所以可读，要归功于 Divya Selvaraj 和 Rakhi Patel 出色的工作。我也要感谢\
  \ Er Galvão 和 Matt Fletcher 进行了准确的技术审查。我不能忘记 Eduardo Bona 和 Anderson Burnes，当我教授\
  \ Zend Framework（现为 Laminas）给几个 IT 学院学生班级时，他们是课程协调员。有必要也感谢 Marcos Melo、Walter Zapalowski、Guilherme\
  \ Funchal 和 Antonio Tiboni，他们是 SERPRO 的同事，帮助我参与了一个使用 Zend Framework 的国际项目。最后，我需要提到与\
  \ Anderson de Paula 长期合作培训 PHP 开发者的岁月。当然，如果没有 Packt Publishing 团队的出色支持，这本书就不可能完成，他们给了我难以置信的写作体验。非常感谢\
  \ Kushal Dave、Mark D'Souza、Sonam Pandey 以及 Packt Publishing 参与本书制作的每一位成员。\n\n##\
  \ 关于审阅者\n\nMatt Fletcher 是一位经验丰富的软件工程师，超过 20 年来一直在设计和开发 PHP Web 应用程序。他目前是 SilverDoor\
  \ Apartments 的开发经理，SilverDoor Apartments 是全球服务式公寓领先的预订代理。他领导一个国际开发团队，使用 Laminas\
  \ 框架和 API Tools 交付一系列企业工具。他的工作包括审查拉取请求、规划系统架构以及交付高质量项目。\n\n## 前言\n\nLaminas 是一个用于构建\
  \ PHP 应用程序的框架。任何编程语言都有多种框架，PHP 也不例外。那么，为什么要选择 Laminas 呢？ Erich Gamma 是一位著名的计算机科学家，也是\
  \ JUnit 和 Eclipse 等广泛使用工具的主要设计者，他表示，框架是面向对象系统中最高层级的复用。为此，框架需要受开发者的控制。框架不应该太臃肿，试图为开发者做太多事情，或者以开发者不希望的方式来做。此外，框架应始终允许开发者改变他们做事的方式——它们必须灵活。框架不应该自命不凡，强迫开发者使用其所有组件，仿佛它们就是特定问题的最终实现。框架应该足够谦逊，认识到开发者才是针对特定问题拥有最佳解决方案的人，并允许他们将自己的解决方案集成到框架的通用组件中。Laminas\
  \ 是一个符合 Erich Gamma 期望的框架。Laminas 诞生于 2005 年，最初名为 Zend Framework，其架构逐渐成熟，为构建面向对象的\
  \ PHP 应用程序提供了一组松耦合且可配置的组件。\n\nLaminas 框架使 PHP Web 开发者能够使用演进式架构创建功能强大的 Web 应用程序。开发者希望学习\
  \ Laminas，以便基于松耦合组件的复用来构建 Web 应用程序。使用 PHP 的开发者将能够通过这本 Laminas 实用指南将其知识付诸实践。本书提供了一种实践导向的实现方法和相关方法论，能让你快速上手并高效工作。本书包含对核心概念的逐步解释、实用示例和自我评估问题，你将能够快速创建复用\
  \ Laminas 组件的 PHP 程序。\n\n你将学习如何创建分层的 PHP Web 应用程序的基本结构，理解 Laminas 的 MVC 组件，并了解如何在使用\
  \ Laminas 开发时利用 Eclipse 平台。随后，你将根据一家虚构企业的需求构建一个电子商务应用程序，并学习如何使用 Laminas 组件实现这些需求。读完本书后，你将能够使用\
  \ Laminas 在 PHP 语言中构建 MVC 应用程序。\n\n### 本书适用人群\n\n本书面向具备 PHP 基础知识的 PHP 开发者。适用于那些刚开始使用\
  \ PHP 进行 Web 开发之旅，并希望学习如何使用最佳工具和实践的开发者。\n\n### 本书内容概览\n\n第 1 章，为 PHP 应用程序引入 Laminas，阐述了\
  \ Zend Framework 从演进到更名为 Laminas 的架构发展过程，并讨论了吸取的教训。\n\n第 2 章，为我们的电子商务应用程序搭建环境，将搭建本书中将要构建的示例应用程序的开发环境。\n\
  \n第 3 章，将 Laminas 作为库与测试驱动开发一起使用，通过一个基于简化用例的简单示例，解释如何在现有 PHP 应用程序中仅使用一个 Laminas\
  \ 组件。\n\n第 4 章，从对象关系映射到 MVC 容器，涵盖了使用对象关系映射处理数据库、抽象 SQL 语句，以及将 Laminas 框架作为容器用于面向对象\
  \ PHP 应用程序的控制反转。\n\n第 5 章，创建虚拟商店项目，介绍我们计划构建的电子商务项目的需求。\n\n第 6 章，使用行为驱动开发的模型和对象关系映射器，是我们使用\
  \ `laminas-db` 将实体关系模型映射到对象模型的章节。我们还将学习如何使用行为驱动开发方法创建模型。\n\n第 7 章，请求控制和数据视图，展示了如何在\
  \ MVC 应用程序中使用 Laminas 的控制器层和视图层实现。\n\n第 8 章，创建表单并实现过滤器和验证器，介绍了一些用于处理数据输入的 Laminas\
  \ 组件。\n\n第 9 章，事件驱动身份验证，涵盖了开发安全应用程序的基本主题之一：身份验证。\n\n第 10 章，事件驱动授权，涵盖了开发安全应用程序的另一个基本主题：授权。\n\
  \n第 11 章，实现产品购物篮，描述了产品购物篮的实现，这是虚拟商店的一个基本组件。\n\n第 12 章，审查并改进我们的应用程序，专门用于审查和改进示例电子商务应用程序。\n\
  \n第 13 章，技巧和窍门，提供了一些技巧和窍门，可帮助你作为开发者解决在构建 Web 应用程序时可能出现的一些问题。\n\n第 14 章，最后的思考，总结全书，勾勒出我们未在示例应用程序中使用的其他组件所带来的未来可能性。\n\
