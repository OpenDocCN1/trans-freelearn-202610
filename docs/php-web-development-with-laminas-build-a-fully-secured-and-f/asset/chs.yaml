  \n\n\n\n可以看到，我们有两对类：API 控制器及其工厂，以及 Web 界面控制器及其工厂。这与我们用于产品控制器层实现的结构完全相同。这些控制器类由 module/Inventory/test/Controller\
  \ 文件夹中的以下类进行测试：\n\n- DiscountAPIControllerTest\n- DiscountControllerTest\n\n我们还为折扣实现了一个视图层，它与我们为产品制作的非常相似。因此，我们假设以下视图脚本位于\
