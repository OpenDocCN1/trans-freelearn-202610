  \ 会等待你为该场景选择生成代码片段的目标。你可以选择 None，这样什么都不会发生，或者选择默认的上下文类 FeatureContext。现在，请选择 None，因为我们将为我们的场景创建一个特定的类。\n\
  \n现在，将 features/bootstrap 文件夹中的 FeatureContext.php 文件复制到同一文件夹中的 ProductAdditionContext.php\
  \ 文件。将文件内的类名更改为 ProductAdditionContext。这个过程足以让 Behat 将此新类显示为目标选项吗？不，因为 Behat 的默认行为是仅搜索\
  \ FeatureContext 类。如果你不相信我，现在就尝试运行 Behat。你会发现 ProductAdditionContext 会被忽略。\n\n要更改\
  \ Behat 的行为，我们必须创建一个配置文件。在 features 文件夹中创建一个名为 behat.yml 的文件，内容如下：\n\n### behat.yml\n\
  \n```\ndefault:\n  autoload:\n    '' : '%paths.base%/bootstrap'\n  suites:\n   \
  \ default:\n      paths:\n        - '%paths.base%'\n      contexts:\n        - ProductAdditionContext\n\
  ```\n\nBehat 支持多个配置配置文件。我们将仅使用默认配置文件。autoload 键定义 Behat 查找上下文类的位置。suites 键允许定义多个上下文类套件集。在此情况下，我们只有一个默认的上下文套件集。paths\
  \ 键定义将搜索用户故事文件的位置。\n\n我们需要更改 **Behat 运行** 外部工具，具体是 **参数** 字段。将当前内容替换为以下代码：\n\n```\n\
  --config ${project_loc}/features/behat.yml\n```\n\n现在，你可以运行 Behat 外部工具，输出将如下所示：\n\
