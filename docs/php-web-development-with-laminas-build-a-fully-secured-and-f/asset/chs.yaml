  \ 包并添加它。\n- 3. 保存文件并单击 **更新依赖项** 按钮。\n\n如果您对如何在 Eclipse 中安装 Composer 依赖项有任何疑问，请阅读第\
  \ 3 章，*使用 Laminas 作为库进行测试驱动开发*中的*创建我们的第一个自动化测试*部分。\n\n> **重要提示：将组件注入配置**\n>\n> 使用\
  \ Composer 在 MVC Laminas 项目中安装 Laminas 组件时，系统会询问您关于将组件注入配置的问题。当 Composer 询问此问题时，您必须选择将注入到\
