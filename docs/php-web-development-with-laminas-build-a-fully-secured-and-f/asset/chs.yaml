  \n### 实现访问控制\n\nLaminas 有两个用于授权的组件：laminas-permissions-acl 和 laminas-permissions-rbac。第一个组件实现访问控制列表（ACL）方法，第二个组件实现\
  \ RBAC 方法。\n\n我们将使用 laminas-permissions-rbac 组件在 whatstore 项目中实现授权控制。我们的系统在数据模型中强调角色，RBAC\
  \ 似乎很方便。就像我们之前使用 Composer 添加和安装 laminas-db 组件一样，我们将对 laminas-permissions-rbac 组件执行相同操作。在\
  \ Eclipse 中打开 composer.json 文件，从“依赖项”选项卡中搜索 laminas/laminas-permissions-rbac 包并添加它。不要忘记保存文件并单击“更新依赖项”按钮。如果您不确定如何在\
  \ Eclipse 中安装 Composer 依赖项，请阅读第 3 章《将 Laminas 作为库使用并结合测试驱动开发》中的“创建我们的第一个自动化测试”部分。\n\
  \n安装 laminas-permissions-rbac 后，我们可以使用该组件修改 IndexController->loginAction 方法。该方法将如下所示：\n\
  \n```\npublic function loginAction()\n{\n    $nickname = $this->request->getPost('nickname');\n\
  \    $password = $this->request->getPost('password');\n    $this->adapter->setIdentity($nickname);\n\
  \    $this->adapter->setCredential(\n        Employee::encrypt($password)\n    );\n\
  \n    $logged = false;\n\n    $auth = new AuthenticationService();\n    $auth->setAdapter($this->adapter);\n\
  \n    $result = $auth->authenticate();\n\n    if ($result->isValid()) {\n      \
  \  error_log('user ' . $result->getIdentity() . ' is logged');\n        $this->loadAuthorizationData($result->getIdentity());\n\
  \        $logged = true;\n    } else {\n        foreach ($result->getMessages()\
  \ as $message) {\n            error_log($message);\n        }\n    }\n\n    return\
  \ new JsonModel([\n        'logged' => $logged\n    ]);\n}\n```\n\n此处所示的实现与前一章的唯一区别在于，我们在成功身份验证后调用\
  \ loadAuthorizationData 方法。该方法的源代码如下：\n\n```\nprivate function loadAuthorizationData(string\
  \ $identity): void\n{\n    $role = new Role($identity);\n\n    $row = $this->adapter->getResultRowObject();\n\
  \    $resources = $this->resourceTable->getResourcesFromAnEmployee($row->ID);\n\
  \    foreach ($resources as $resource) {\n        $role->addPermission($resource->name\
  \ . ':' .\n        $resource->method);\n    }\n\n    $rbac = new Rbac();\n    $rbac->addRole($role);\n\
  \n    $container = new Container();\n    $container->rbac = $rbac;\n}\n```\n\nloadAuthorizationData\
  \ 方法执行以下操作：\n\n- 创建 Laminas\\Permissions\\Rbac\\Role 类的实例，并将员工昵称用作角色名称。注意！员工可以有多个角色，但为了检查授权，我们将使用一个虚拟角色来统一与员工关联的所有实际角色。\n\
  \n- 使用 Laminas\\Authentication\\Adapter\\DbTable\\AbstractAdapter 类的 getResultRowObject\
  \ 方法检索经过身份验证的员工记录。\n\n- 使用经过身份验证的员工的 ID，通过 ResourceTable->getResourcesFromAnEmployee\
  \ 方法检索与员工角色关联的资源，其源代码如下：\n\n```\npublic function getResourcesFromAnEmployee($employeeID):\
  \ ResultSet\n{\n    $subSelect = new Select('employee_roles');\n    $subSelect->columns(['code_role'])\n\
  \        ->where(['ID_employee' => $employeeID]);\n\n    $where = new Where();\n\
  \    $where->in('resources_role.code_role', $subSelect);\n\n    $select = new Select($this->tableGateway->getTable());\n\
  \    $select->columns(['name' => new Expression('DISTINCT name'), 'method'])\n \
  \       ->join('resources_role', 'resources.code = resources_role.code_resource',\
  \ [])\n        ->where($where);\n    return $this->tableGateway->selectWith($select);\n\
  }\n```\n\n请注意，ResourceTable->getResourcesFromAnEmployee 方法使用 Laminas\\Db\\Sql\\\
  Where 类的实例来定义带有 SQL IN 子句的过滤器。还请注意，该方法使用 Laminas\\Db\\Sql\\Expression 类向资源表的 name\
  \ 字段添加 DISTINCT 关键字。使用 DISTINCT 是为了避免当员工拥有多个角色且两个或多个角色有权访问相同资源时出现重复资源。\n\n- 创建 Laminas\\\
  Permissions\\Rbac\\Rbac 类的实例，并将角色对象与该实例关联。\n\n- 创建 Laminas\\Session\\Container 类的实例，并将\
  \ Rbac 实例存储在会话中。\n\n因此，我们将经过身份验证的员工的权限存储在会话中，并可以随时检查。由于我们在用户登录系统时将访问数据存储在会话中，因此需要在用户退出系统时删除这些数据。我们将在\
  \ IndexController->logoutAction 方法中使用此功能：\n\n```\npublic function logoutAction()\n\
  {\n    $auth = new AuthenticationService();\n    $auth->clearIdentity();\n    $session\
  \ = new SessionManager();\n    try {\n        $session->destroy();\n    } catch\
  \ (\\Exception $e) {\n        error_log($e->getMessage());\n    }\n\n    return\
  \ $this->redirect()->toRoute('inventory');\n}\n```\n\n在前面的代码块中，我们使用了 Laminas\\Session\\\
  SessionManager 类来销毁会话。请注意，我们在 try/catch 结构中执行了此操作。为什么呢？因为该方法可能由测试运行，而测试不会创建会话。\n\
  \n那现在怎么办？将来会检查权限吗？暂时不会。我们需要创建一个监听器类，并将其与 EVENT_ROUTE 事件关联，就像我们在第 9 章《事件驱动的身份验证》中为身份验证所做的那样。开始吧！\n\
  \n### 验证用户权限\n\n要开始，在 module/Inventory/src/Listener 文件夹内，我们将创建一个名为 InventoryAuthorizationListener\
  \ 的类。该类将有一个名为 verifyPermission 的方法，如以下代码块所示：\n\n```\npublic static function verifyPermission(MvcEvent\
  \ $event)\n{\n    $routeName = $event->getRouteMatch()->getMatchedRouteName();\n\
  \    if (!$routeName == 'inventory') {\n        return;\n    }\n    $authenticationService\
  \ = new AuthenticationService();\n    if ($authenticationService->hasIdentity())\
  \ {\n        $params = $event->getRouteMatch()->getParams();\n        $controller\
  \ = $params['controller'];\n        $action = $params['action'];\n        if ($controller\
  \ == 'menu' || $action == 'logout') {\n            return;\n        }\n    }\n \
  \   $method = $event->getRequest()->getMethod();\n    $permission = $controller\
  \ . '.' . $action . ':' . $method;\n    $container = new Container();\n    $rbac\
  \ = $container->rbac;\n    $role = $authenticationService->getIdentity();\n    if\
  \ (!$rbac->isGranted($role, $permission)) {\n```\n\n\n\n\n\n让我们看看 InventoryAuthenticationListener::verifyIdentity\
  \ 是如何工作的：\n\n- verifyPermission 方法接收一个 MvcEvent 对象。我们在第 9 章“事件驱动身份验证”中讨论过这个类。\n\
  - 我们使用了 MvcEvent 的 getRouteMatch 方法来检索 RouteMatch 对象。我们也在第 9 章“事件驱动身份验证”中讨论过这个类。\n\
  - 我们使用路由名称来判断请求的模块是否为 Inventory，这与我们为身份验证监听器所做的操作相同。\n- 如果请求的模块是 Inventory，我们会实例化\
  \ AuthenticationService 类并调用 hasIdentity 方法。您已经从第 9 章“事件驱动身份验证”了解此方法。\n- 如果用户已通过身份验证，我们会通过\
  \ RouteMatch 实例的 getParams 方法从匹配的路由中检索控制器和操作名称。\n- 如果员工（即库存用户）可以在未经授权的情况下访问 IndexController->menuAction\
  \ 和 IndexController->logoutAction 方法，则我们不为这些方法执行任何操作。\n- 对于 Inventory 模块中的任何其他控制器和操作，如果员工角色无权访问资源，我们会将用户重定向到\
  \ IndexController 的无权限页面。创建该页面的 no-permission.phtml 文件必须如下所示：\n\n### no-permission.phtml\n\
  \n```\n<h1>Inventory Module</h1>\n\n<p>Hi, <?=$this->user?>. You don't have permission\
  \ to\n   requested resource.</p>\n```\n\n<a href=\"<?= $this->url('inventory', ['controller'\
  \ =>\n'menu']) ?>\">Menu</a>\n\n要将 InventoryAuthorizationListener 类启用为监听器，我们必须修改\
  \ Inventory 模块的 Module.php 文件。为此，我们需要修改 Module->onBootstrap 方法，其内容如下：\n\n```\npublic\
  \ function onBootstrap($e)\n{\n    if (defined('PHPUNIT_COMPOSER_INSTALL')) return;\n\
  \    $application = $e->getApplication();\n    $application->getEventManager()->attach(MvcEvent::\n\
  \        EVENT_ROUTE, [InventoryAuthenticationListener ::\n        class,'verifyIdentity']);\n\
  \    $application->getEventManager()->attach(MvcEvent ::\n        EVENT_ROUTE, [InventoryAuthorizationListener\
  \ ::\n        class,'verifyPermission']);\n}\n```\n\n做出这些更改后，您将尝试删除用户（员工）的权限，并发现会被重定向到无权限页面。重要的是要理解，权限更改只有在用户注销并重新登录后才会生效，因为会话中的数据未发生变化。\n\
  \n哇，我们几乎完成了。授权流程已实现。在下一节中，我们将对测试进行调整。\n\n### 修改测试引导文件\n\n测试始终需要从相同的状态运行。但在开发过程中，我们可以多次更改测试所使用的数据。我们已创建一个脚本来加载启用身份验证和授权的系统所需的数据。现在，我们将创建一个脚本来准备运行测试的环境。该脚本将保留在\
  \ bin 文件夹中，并命名为 testbootstrap.php。该脚本将包含以下代码：\n\n### testbootstrap.php\n\n```\n\
  <?php\nuse Laminas\\Db\\Adapter\\Adapter;\nuse Laminas\\Stdlib\\ArrayUtils;\n\n\
  require __DIR__ . '../vendor/autoload.php';\n\n$config = require __DIR__ . '../config/autoload/global.php';\n\
  \nif (file_exists(__DIR__ . '../config/autoload/\nlocal.php')) {\n    $override\
  \ = require __DIR__ . '../config/autoload/\nlocal.php';\n    $config = ArrayUtils::merge($config,\
  \ $override);\n}\n\n$db = $config['db'];\nunset($db['database']); // remove database\
  \ key because it\ncauses error in connection when database does not exist\n$adapter\
  \ = new Adapter($db);\n\ntry {\n    echo \"Dropping database...\\n\";\n    $adapter->query('DROP\
  \ DATABASE IF EXISTS whatstore',\n        Adapter::QUERY_MODE_EXECUTE);\n    $sqlscript\
  \ = file_get_contents(__DIR__ .\n    '/whatstore.sql');\n    echo \"Creating database\
  \ and tables...\\n\";\n    $adapter->query($sqlscript, Adapter::\n        QUERY_MODE_EXECUTE);\n\
  \    echo \"The whatstore database has been created.\\n\";\n} catch (Exception $e)\
  \ {\n    echo 'Fail to recreate the database.' . $e->\n        getMessage() . \"\
  \\n\";\n}\n```\n\n该脚本会删除数据库，并使用 `bin` 文件夹中提供的 `whatstore.sql` SQL 脚本重新创建数据库。因此，测试将在空表上运行，并在运行后保持表为空。请记住，我们始终会删除添加到测试中的记录。\n\
  \n要将 `testbootstrap.php` 与我们的 PHPUnit 测试一起使用，请更改 `phpunit.xml` 文件中的 `phpunit` 标签并添加\
  \ `bootstrap` 属性，其内容如下：\n\n```\n<phpunit bootstrap=\"bin/testbootstrap.php\" colors=\"\
  true\">\n```\n\n从现在起，当您运行 `vendor/bin/phpunit` 命令时，`testbootstrap.php` 脚本将在测试之前执行。最后，我们在项目中引入了“时间旅行”，因为现在我们可以随时回到过去来测试我们的应用程序。\n\
  \n我们现在在 `Inventory` 模块中拥有了正常工作的身份验证和授权功能。但是，在这里实现这些安全功能并不十分合适，因为这将一项业务责任留在了控制器（`Inventory`\
  \ 模块的 `IndexController`）中。我们需要将此责任移至模型。我们将在下一节中完成此操作。\n\n### 创建身份管理器\n\n在本节中，我们将重构身份验证和授权的实现，以将这些责任从控制器层解耦。\n\
  \n第一步是在 `Inventory` 模块的 `Model` 文件夹中创建一个名为 `IdentityManager` 的模型类。该类将拥有四个私有属性：\n\
  \n```\n```php\nclass IdentityManager\n{\n    private ?AdapterInterface $adapter;\n\
  \    private ?ResourceTable $resourceTable;\n    private ?array $encryptionMethod;\n\
  \    private ?AuthenticationService $auth;\n}\n```\n```\n\n让我们了解前面的代码：\n\n- `$adapter`\
  \ 是身份验证适配器类的实例。\n- `$resourceTable` 是 `ResourceTable` 类的实例，授权过程需要它。\n- `$encryptionMethod`\
  \ 是应用于用户凭据的方法。\n- `$auth` 是 `AuthenticationService` 实例，身份验证过程需要它。此类的每个实例都提供相同的数据，因为身份存储在用户会话中。\n\
  \n最后一个属性可以在内部赋值。另一方面，前三个属性的值需要被注入：\n\n```\n```php\npublic function __construct(AdapterInterface\
  \ $adapter,\n    ResourceTable $resourceTable, array $encryptionMethod)\n{\n   \
  \ $this->adapter = $adapter;\n    $this->resourceTable = $resourceTable;\n    $this->encryptionMethod\
  \ = $encryptionMethod;\n    $this->auth = new AuthenticationService ();\n}\n```\n\
  ```\n\n`IdentityManager` 类将拥有一个 login 方法，它将封装 `IndexController->loginAction` 方法中的大部分代码：\n\
  \n```\npublic function login(string $identity, string\n$credential): bool\n{\n \
  \   $this->adapter->setIdentity($identity);\n    $credential = call_user_func($this->\n\
  \    encryptionMethod, $credential);\n    $this->adapter->setCredential($credential);\n\
  \    $this->auth->setAdapter($this->adapter);\n    $result = $this->auth->authenticate\
  \ ();\n    if ($result->isValid()) {\n        error_log('user ' . $result->getIdentity()\
  \ . '\n        is logged');\n        $this->auth->getStorage ()->write($this->\n\
  \        adapter->getResultRowObject(null,'password'));\n        $this->loadAuthorizationData\
  \ ();\n        return true;\n    } else {\n        foreach ($result->getMessages()\
  \ as $message) {\n            error_log($message);\n        }\n    }\n    return\
  \ false;\n}\n```\n\n请注意，IdentityManager->login 封装的身份验证过程中引入了一些差异。第一个差异是使用注入的方法来加密凭据。此更改使该类更加灵活，因为它与\
  \ Employee 类没有耦合。无需在 IdentityManager 类中编写代码即可更改加密方法。\n\n\n\n\n第二个不同之处是以下行：\n\n```\n\
  $this->auth->getStorage()->write($this->adapter->getResultRowObject(null,'password'));\n\
  ```\n\n这条指令将用户对象（不含密码）写入身份验证会话。这样做是必要的，因为我们打算稍后重新验证权限数据，因此需要存储用户的主键，而不仅仅是凭据。此更改将在使用身份的地方需要一些调整，但仅限少数几处。\n\
  \n与前一种方法类似，IdentityManager 类将拥有一个 logout 方法，该方法将封装 IndexController->logoutAction\
  \ 中的大部分代码：\n\n```\npublic function logout() : void\n{\n    $this->auth->clearIdentity();\n\
  \    $session = new SessionManager();\n    try {\n        $session->destroy();\n\
  \    } catch (\\Exception $e) {\n        error_log($e->getMessage());\n    }\n}\n\
  ```\n\nIdentityManager 类还将封装 IndexController->loadAuthorizationData 方法。在恢复员工的主键\
  \ employee 时，你可以看到一点细微差别：\n\n```\npublic function loadAuthorizationData() : void\n\
  {\n    $role = new Role($this->auth->getIdentity()->name);\n    $row = $this->auth->getStorage()->read();\n\
  \    $resources = $this->resourceTable->\n        getResourcesFromAnEmployee($row->ID);\n\
  \    foreach($resources as $resource) {\n        $role->addPermission($resource->name\
  \ . ':' .\n            $resource->method);\n    }\n    $rbac = new Rbac();\n   \
  \ $rbac->addRole($role);\n\n    $container = new Container();\n    if (isset($container->rbac))\
  \ {\n        unset($container->rbac);\n    }\n\n    $container->rbac = $rbac;\n\
  }\n```\n\n如你所记得，此方法在 `IndexController` 类中是私有的，但在 `IdentityManager` 中是公共的。此更改是为了防范不满员工可能发起的一种攻击。\n\
  \n设想如下场景：在寒冷的冬日，Mr. Heythere 发现他手下的一位经理 Mr. Barnaby 的表现未达标。Mr. Heythere 告知 Mr. Barnaby\
  \ 对他的期望，但 Mr. Barnaby 回答他宁可不这么做。因此，Mr. Heythere 决定解雇 Mr. Barnaby 并寻找一位更好的经理（很可能是某个读\
  \ Packt Publishing 出版书籍的人！）。问题是，Mr. Barnaby 知道自己在被解雇后仍然可以访问系统，因为他对系统非常熟悉。\n\n恐怖事件的经过如下：Mr.\
  \ Heythere 解雇了 Mr. Barnaby。由于会话配置，Mr. Barnaby 仍然使用其经理权限登录在 Whatstore 系统中。即使另一位经理更改了他的权限，也只会影响他下一次的访问尝试。现在，Mr.\
  \ Barnaby 非常愤怒，因为他和 Mr. Heythere 显然未能就解雇条款达成一致，且 Mr. Barnaby 想让 Mr. Heythere 付出代价。由于\
  \ Mr. Barnaby 仍能以其先前的权限级别访问系统，他就这样做了，并损坏了一些记录。\n\n我们如何避免这个恐怖故事？一种可能性是在用户登录期间更新其权限。因此，我们更改了\
  \ `loadAuthorizationData` 方法的可见性，以便在登录流程之外使用它。\n\n为完成 `IdentityManager` 的实现，我们将添加三个方法：\n\
  \n```\npublic function getIdentity(): string\n{\n    return $this->auth->getIdentity()->name;\n\
  }\npublic function hasIdentity(): bool\n{\n    return $this->auth->hasIdentity();\n\
  }\npublic function getRbac(): Rbac\n{\n    $this->loadAuthorizationData();\n   \
  \ $container = new Container();\n    return $container->rbac;\n}\n```\n\ngetIdentity\
  \ 和 hasIdentity 方法是 AuthenticationService 类中同名方法的包装器。getRbac 方法提供带有当前权限的 Rbac 实例。\n\
  \n太棒了。我们的 IdentityManager 类已准备就绪。但由于它有依赖项，我们需要为其创建一个工厂。因此，在 Inventory 模块的 Model\
  \ 文件夹中创建 IdentityManagerFactory 类：\n\n```\nclass IdentityManagerFactory implements\
  \ FactoryInterface\n{\n    public function __invoke(ContainerInterface $container,\n\
  \        $requestedName, ?array $options = null)\n    {\n        $employeeTable\
  \ = $container->get('EmployeeTable');\n        $adapter = new CredentialTreatmentAdapter\n\
  \            ($container->get('DbAdapter'));\n        $adapter->setTableName('employees');\n\
  \        $adapter->setIdentityColumn('nickname');\n        $adapter->setCredentialColumn('password');\n\
  \n        $resourceTable = $container->get('ResourceTable');\n\n        $encryptionMethod\
  \ = array(new Employee(),\n            'encrypt');\n\n        return new IdentityManager($adapter,\
  \ $resourceTable\n            , $encryptionMethod);\n    }\n}\n```\n\n在为模型创建了多个工厂之后，你知道有必要将此工厂的条目添加到\
  \ module.config.php 文件的 service_manager->factories 键中：\n\n```\n'IdentityManager'\
  \ => Model\\\\IdentityManagerFactory::class\n```\n\n由于 IdentityManager 已承担 IndexController\
  \ 的部分职责，我们需要重构该控制器类。让我们从 IndexController 的构造函数开始：\n\n```\nprivate ?IdentityManager\
  \ $identityManager;\n\npublic function __construct(IdentityManager\n        $identityManager)\n\
  {\n    $this->identityManager = $identityManager;\n}\n```\n\n如你所见，它不再接收两个依赖项，现在\
  \ IndexController 仅接收 IdentityManager 实例。\n\n通过将身份验证委派给 IdentityManager，IndexController->loginAction\
  \ 方法将更加简洁：\n\n```\npublic function loginAction()\n{\n    $nickname = $this->request->getPost('nickname');\n\
  \    $password = $this->request->getPost('password');\n\n    $logged = $this->identityManager->login($nickname,\n\
  \        $password);\n\n    return new JsonModel([\n        'logged' => $logged\n\
  \    ]);\n}\n```\n\n同样，IndexController->logoutAction 方法的代码行数将更少：\n\n```\npublic\
  \ function logoutAction()\n{\n    $this->identityManager->logout();\n\n    return\
  \ $this->redirect()->toRoute('inventory');\n}\n```\n\n你应该将控制器类视为经理。经理不会事事亲力亲为，而是委派任务。控制器类应将责任委派给模型或视图类。\n\
  \n当然，由于 `IndexController` 的构造函数已更改，我们必须调整 `IndexControllerFactory` 类以注入 `IdentityManager`\
  \ 实例：\n\n```\nclass IndexControllerFactory implements FactoryInterface\n{\n    public\
  \ function __invoke(ContainerInterface $container,\n        $requestedName, array\
  \ $options = null)\n    {\n        $identityManager = $container->get\n        \
  \    ('IdentityManager');\n        return new IndexController($identityManager);\n\
  \    }\n}\n```\n\n我们还需要在 `MenuController` 类的 `indexAction` 和 `noPermissionAction`\
  \ 方法中进行调整。这些方法的最后一条指令必须如下所示：\n\n```\nreturn new ViewModel(['user' => $auth->getIdentity()->name]);\n\
  ```\n\n之所以需要此操作，是因为现在 `getIdentity` 方法不返回字符串值，而是返回一个对象。\n\n最后，我们需要修改 `InventoryAuthorizationListener::verifyPermission`\
  \ 方法中的几行代码。我们必须添加一个 `IdentityManager` 实例来处理身份验证和授权数据：\n\n```\npublic static function\
  \ verifyPermission\n    (MvcEvent $event)\n{\n    $routeName = $event->getRouteMatch()\
  \ ->\n        getMatchedRouteName();\n    if (!$routeName == 'inventory') {\n  \
  \      return;\n    }\n\n    $identityManager = $event->getApplication()\n     \
  \   ->getServiceManager()->get('IdentityManager');\n    if ($identityManager->hasIdentity())\
  \ {\n        $params = $event->getRouteMatch()->getParams();\n        $controller\
  \ = $params['controller'];\n        $action = $params['action'];\n\n        if ($controller\
  \ == 'menu' || $action ==\n            'logout') {\n            return;\n      \
  \  }\n\n        $method = $event->getRequest()->getMethod();\n        $permission\
  \ = $controller . '.' . $action . ':' .\n            $method;\n\n        $rbac =\
  \ $identityManager->getRbac();\n\n        $role = $identityManager->getIdentity();\n\
  \        if (!$rbac->isGranted($role, $permission)) {\n            $event->getRouteMatch()->setParam\n\
  \            ('controller', 'menu');\n            $event->getRouteMatch()->setParam('action',\n\
  \            'no-permission');\n            error_log(\"$role has not permission\
  \ to\n            $permission\");\n        }\n    }\n}\n```\n\n这样一来，Mr. Barnaby\
  \ 或其他被解雇的员工将无法对系统造成损害（因为经理在解雇之前已更改了他们的权限）。\n\n至此，我们终于完成了本章的内容。\n\n\n\n### 总结\n\n\
  在本章中，我们学习了如何以与之前章节相似的方式实现角色和资源注册。我们讨论了与项目相关的角色和资源概念。我们还学习了如何将资源与角色关联，以及如何将角色与 Inventory\
  \ 模块用户（员工）关联。在介绍了这些注册之后，我们学习了如何使用 laminas-permissions 组件实现访问控制，以及如何借助 laminas-eventmanager\
  \ 验证用户权限。最后，我们了解了如何将登录和退出逻辑从控制器层解耦，创建一个身份管理类。我们还了解了如何防止不满的被解雇员工发起的攻击。\n\n在下一章中，我们将学习如何实现产品购物篮，这将允许\
  \ Store 模块用户（客户）选择产品并进行购买。\n\n### 延伸阅读\n\n如果您想了解更多关于授权方法的信息，以下是一些值得阅读的好文章：\n\n-\
  \ ACL 方法：Ravi S. Sandhu 和 Pierangela Samarati 撰写的文章，网址为 https://www.profsandhu.com/cs5323_s18/SS-1994.pdf\n\
  - RBAC 方法：Ravi S. Sandhu、Edward J. Coyne、Hal L. Feinstein 和 Charles E. Youman 撰写的文章，网址为\
  \ https://csrc.nist.gov/CSRC/media/Projects/Role-Based-Access-Control/documents/sandhu96.pdf\n"
