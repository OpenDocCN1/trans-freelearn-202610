  \ 变量检索所选对象（文件或文件夹）的值。从现在开始，我们将选择功能文件来执行 **Behat 生成代码片段**，而不是选择项目名称。\n\n但是，这个新的外部工具仅显示代码。将代码插入上下文类的项目是下一个项目。\n\
  \n- 5. 将 **Behat 追加代码片段** 外部工具的 **参数** 字段更改为以下内容：\n\n```\n--config ${project_loc}/features/behat.yml\
  \ ${selected_resource_name}\n```\n\n现在，我们准备好查看为特定场景生成的代码，并将此代码插入到同一场景中。\n\n现在选择\
  \ `productupdating.feature` 文件并执行 **Behat 生成代码片段**。这次，将仅显示由 `productupdating.feature`\
  \ 描述的功能。现在，您可以选择选项 2，它将引用 `ProductUpdatingContext`，**控制台** 选项卡将显示以下片段：\n\n```php\n\
  /**\n * @Given I have a product called :arg1, which costs\n * $:arg2\n */\npublic\
