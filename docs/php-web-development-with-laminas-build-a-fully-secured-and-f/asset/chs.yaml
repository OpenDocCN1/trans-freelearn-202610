- "## 介绍用于 PHP 应用程序的 Laminas\n\n2019 年 4 月，Linux 基金会宣布启动一个新项目：Laminas。这实际上是一个自 2006\
  \ 年起就存在的项目的新名称，即 Zend Framework。从那时起，安装量已达 4 亿次的 PHP 框架有了一个供应商中立的家。但 Zend Technologies\
  \ 多年来并未放弃其同名产品。Zend 继续提供企业支持，其中包括关键任务支持、企业适配器扩展、长期支持以及来自 PHP 专家的按需指导。\n\n本章介绍了 Zend\
  \ Framework 架构直到更名为 Laminas 的演进过程，并讨论了吸取的教训。在本章中，您将了解框架团队在其演进过程中为何做出某些决定而不是其他决定。这些主题是开发者使用框架的动机，而\
  \ Laminas 被介绍为 PHP 开发者的一个选择。\n\n在本章中，我们将讨论以下主题：\n\n- 我们为什么需要 Web 框架？\n- 从 Zend Framework\
  \ 到 Laminas\n- Laminas 社区的技术和社会基础设施\n\n### 我们为什么需要 Web 框架？\n\n有人可能会问，为什么我需要框架？这样的人也可能会问，为什么我需要使用类？毕竟，PHP\
  \ 很简单，不需要类。只需几行代码，您就可以生成一个带有数据库处理数据的页面。PHP 创建者 Rasmus Lerdorf 在演讲中始终声称，PHP 速度快，工作时既不需要类也不需要框架。2014\
  \ 年，Mariano Iglesias 在 PHP Conference Brazil 上发表演讲，捍卫无框架的未来。嗯，Rasmus 和 Mariano 都是对的，这取决于我们讨论的软件复杂性。我们无法将只有几个统计数据的个人页面与企业系统相比。当我们谈论面向对象编程（OOP）和框架时，我们主要谈论的是复杂性控制。\n\
  \nMartin Fowler 表示，大多数人对 **架构** 一词认同的含义之一是一组难以更改的决策。对于软件项目，这些决策涉及软件的期望特征。当您思考软件的期望特征时，重要的是要记住，交付第一个稳定版本只是软件生命周期中的一个里程碑。\n\
  \n### 持续集成和持续交付\n\n您一定听过 **持续集成** 和 **持续交付** 这两个术语。这些方法之所以存在，是因为变化是持续的。软件可能因多种原因而更改：可能需要新功能，因为客户要求或竞争对手已经拥有它们，必须修复错误，计算机平台在发展，受众在增长，立法在变化。因此，客户、竞争对手、环境和政府将迫使软件发生变化。对于未来我们可能有许多疑虑，但可以肯定的是，变化一定会发生。\n\
  \n> 注释\n>\n> Jean-Marcel Belmont 将持续集成定义如下：\n>\n> “[...] 一项源代码在主干上同时合并和测试的软件工程任务。[...]\
  \ 持续集成是持续的，因为开发人员在开发软件的同时可以持续集成软件组件。” 您可以在 Jean-Marcel Belmont, Packt Publishing\
  \ 的《Hands-On Continuous Integration and Delivery》中了解更多信息。\n>\n> Jez Humble 和 David\
  \ Farley 在其书籍《Continuous Delivery》(Addison-Wesley) 中，将此术语定义为尽可能频繁地发布软件新功能，以降低交付所带来的风险。\n\
  \n软件是一个不断成长的有机体。Frederick Brooks 在他的著作 *人月神话* (Addison-Wesley) 中指出，软件存在四个复杂度级别：\n\
  \n- 一个 **程序**，其算法只能存储在一个人脑中；换句话说，只有一个人能理解它。这是一个任务非常有限的特定程序。\n  - 此类软件满足特定需求，可以在简短的对话中解释，尽管只有创建者才能运行和维护它。\n\
  - 一个 **编程产品**：任何人在极少文档的情况下即可运行和维护的程序，并且人类可读。\n- 一个 **编程系统**：一组程序，其中一个程序与其他程序结合以执行更复杂的任务。\n\
  \n\n\n\n\n- **编程系统产品**：比单个程序复杂和昂贵九倍，其逻辑能装进单个程序员的脑袋里。\n\n这种软件需要一个庞大的团队来维护。它无法装进一个人的脑袋。不容易解释它是如何工作或如何组织的。但根据\
  \ Brooks 的说法，这是大多数软件开发工作的目标。\n\n> **注意**\n> 《人月神话》是软件工程领域的经典著作。尽管它是在敏捷软件开发兴起之前写成的，但其对软件开发复杂性和任务并行化困难的分析至今仍然适用。\n\
  \n处于持续变化中的复杂软件需要长期保持一些特性。我们说的是经久耐用的软件，而不是用一周就扔掉的软件。有些软件是短暂的，因此你不必过分担心其结构。自动代码生成工具非常适合生成很快就会被丢弃的代码。但需要演进的软件需要深入理解软件的工作原理。事实上，经久耐用的软件需要一些关键特性：最小复杂度、松耦合、可扩展性和可重用性。这些可取特性中的每一个都与一个关键特性相关联：易于维护。\n\
  \n说复杂系统必须具有最小复杂度似乎有悖。实际上，当我们说编程系统产品复杂时，我们指的是一个拥有许多部分且规模庞大的系统。最小复杂度指的是这些部分的内部组织及其连接方式。并不指望开发团队的每个成员随时都了解整个系统的一切，但理想情况下，团队中的任何成员都能轻松理解系统的一部分，以便在必要时进行更改。\n\
  \nErich Gamma 在接受 Bill Venners 采访时表示，当前的软件环境过于复杂，如果不复用现有代码就无法创建应用程序。Gamma 假设 OOP\
  \ 是开发的标准范式，因为它提供了复用所必需的可扩展性。Gamma 指出，OOP 中有三种复用级别：类复用、模式复用和框架。他强调，框架是最高级别的复用，因为它们识别了解决问题的关键抽象，并提供包含多名开发者的知识和经验的实现。\n\
  \n> **注意**\n> 你可以在 https://www.artima.com/articles/erich-gamma-on-flexibility-and-reuse\
  \ 阅读与 Erich Gamma 的完整访谈。\n\n## 框架的有用性\n\n当你使用框架开发软件时，你不仅像使用类库那样复用类。类库就像软件开发中的外包。你使用类库是因为你想专注于特定的业务问题，而不是别人已经解决的通用问题。但你会调用类库中的类。框架遵循好莱坞法则：不要打电话给我们，我们会给你打电话。框架类会调用你的类。它负责软件的通用行为，并允许你定义自定义行为。当你使用框架时，就像你的软件是一个特许加盟商。你的软件共享其他软件拥有的相同基础设施。当特许人解决一个问题或改进业务的某个功能时，它会为所有加盟商解决。当框架为一个问题提供解决方案时，它会为使用它的所有应用程序解决一个通用问题。正如地下城主所说，一个人的命运是所有人共享的。\n\
  \n我们使用框架是为了让软件易于维护。因此，框架必须帮助我们创建最小复杂度的代码，并使用松耦合组件复用现有代码。一旦框架实现了设计模式和架构模式，它就为通用问题提供了解决方案，因此在其演进过程中，它专注于改进通用解决方案。Erich\
  \ Gamma 表示，框架在高级别提供默认功能。对软件默认问题的关注使该框架能够控制应用程序，就像经理或顾问一样。\n\n当我们看到像 Mariano Iglesias\
  \ 这样优秀的软件开发者反对框架时，他实际上是在反对别的东西：框架病（frameworkitis）。正如 Bill Venners 在与 Erich Gamma\
  \ 的对话中所说，这个术语意味着“想把一切都变成框架的疾病”。Erich Gamma 说，一些名为框架的软件实际上想为开发者做太多的事情。问题是，当它们尝试这样做时，以并非所有开发者都想要的方式去做——甚至更糟的是，以开发者无法更改的方式去做。\n\
  \n一个真正的框架必须说：“不用担心，我控制你的应用程序，并会为你处理通用问题。”而患有框架病的框架则会说：“不用担心，我生成代码并以最佳方式为你做一切，你不需要更改我的实现——事实上，你无法更改。”嗯，这种行为与不断变化的场景背道而驰。框架病让开发者从爱变成恨。起初，他们爱上一个似乎能为他们做一切的工具，然后又恨上那个他们被绑定且无法更改的工具。幸运的是，Laminas\
  \ 并非如此。\n\n## 从 Zend Framework 到 Laminas\n\n在电影《X战警》（2000）的开场中，查尔斯·泽维尔教授说，突变是我们进化的关键。他补充说，正是通过突变，我们才从单细胞生物进化成为地球上的主导物种。软件就像一个有机体。它需要演进才能生存。有时它需要进行大量改变，看起来就像突变。改变的必要性要求软件允许被更改。难以更改的软件是灭绝的候选者。\n\
  \n软件的演进可能表现为用另一个组件替换一个组件。替换可能是为了维护或改进可扩展性、性能或安全性所必需的。但是，如果更换软件的一个组件很难或几乎不可能，改进就必须以困难的方式进行，通常是通过重写现有代码。\n\
  \n模式有助于组件替换，因为组件共享相同的模式。如果公司里每个开发团队都为组件使用不同的模式来创建软件，那么共享组件就会很困难，从而禁止复用，而复用是经久耐用软件的可取特性。\n\
  \n## 我与 Zend Framework 的初次相遇\n\n2005 年，我加入了一家拥有多个软件开发部门的大型 IT 公司。该公司开发政府软件，并拥有数千个使用各种编程语言的项目。问题是，每个团队都为其项目使用不同的标准，因此组件复用几乎不存在。此外，过去由初始编码量低的工具所做的决策历史，在长远来看导致了技术锁定。多个团队使用了框架，但每个团队都为同一种语言使用了不同的框架。因此，共享组件的困难依然存在。\n\
  \n2007 年，我正在为一个正在勘探新技术的部门工作，我的团队必须选择一个框架来标准化公司的 PHP 应用程序开发。巧合的是，那年在圣保罗市举办了一场关于 PHP\
  \ 框架的研讨会。我们参加了此次活动，并聆听了三场演讲，每场都关于一个框架：CakePHP、Symfony 和 Zend。我之前已经从第一届 PHP 巴西大会了解了\
  \ CakePHP，我公司的几位同事已经在使用 Symfony。然而，Zend Framework 对我来说是一个全新的事物。这不应该令人惊讶，因为 Zend\
  \ Framework 的第一个稳定版本就是那年发布的。但它自 2005 年起就一直在开发中。\n\n观众对 CakePHP 和 Symfony 演讲的反应类似。当演讲者在终端执行生成代码的命令时，观众说：“_哇！_”但在\
  \ Zend 的演讲中，当他们看到没有代码生成器时，他们感到沮丧。演讲者听取了抱怨并回答说，虽然 Zend 没有代码生成工具，但它非常灵活，不会过于强加。幸运的是，一位听众指出，该框架架构似乎关注维护应用程序，而不仅仅是创建它。\n\
  \n离开活动现场时，我听到几个人说他们会使用 CakePHP 或 Symfony，强调代码生成工具。这些人可能没有深入的软件开发经验，或者更确切地说，没有维护现有软件的经验。还有其他工具可以帮助代码生成，例如集成开发环境。框架是可复用的，是复用代码的工具，而不是新代码创建工具。\n\
  \n\n\n\n\n其中一位演讲者正在销售一本关于五个框架分析的书籍，其中包括当时活动上介绍的三个框架。我买下了它，阅读了它，并对这些框架进行了测试，用每个框架实现了相同的应用。在分析的五个框架中，具有最小复杂度、松耦合、可扩展性和可重用性等最佳特性的是\
  \ Zend Framework。它高度可配置，并且不会阻止使用其他框架的组件。当时，**PHP 框架互操作性组**（**PHP-FIG**）尚不存在，但我们需要提供互操作性的工具。\n\
  \n## PHP 框架互操作性组\n\n2009 年，在 PHP Conference Brazil 上，一些 PHP 演讲者做了一场名为 _PHP 框架_ 的讲座。这是对“框架之争”的一种戏弄性引用。每位演讲者都捍卫自己最喜欢的框架并攻击其他框架。也许并非真正存在框架之争，但事实是，一旦你采用了某个框架，就很难使用其他框架的组件，因为每个框架都遵循自己的模式。这种情况在同一年，即\
  \ 2009 年开始改变，当时一群 PHP 专家在美国芝加哥会面，为 PHP 社区建立组件规范。这个组最初被称为 PHP 标准组。第一个规范是关于自动加载标准——这有助于\
  \ Composer 的出现。2011 年，该组将名称更改为 **PHP 框架互操作性组**（**PHP-FIG**）。此后，出色的 PHP 项目的成员们会面讨论并编写名为\
  \ **PHP 标准推荐**（**PSRs**）的规范。多个框架和其他 PHP 应用程序已采用了 PHP-FIG 的规范。\n\n## Zend Framework\
  \ – PHP 应用程序的参考架构\n\nZend Framework 使我们能够为 PHP 应用程序创建参考架构，帮助应用程序演进。应用程序可以使用内部组件（位于其结构内且仅为其服务的组件），也可以使用可重用组件（由多个应用程序共享的组件）。一个组件可以执行超出参考架构模式实现职责的任务，甚至可以替换某一层的实现（但使用相同的接口）。\n\
  \n要解决特定问题，软件架构师首先必须寻找现有的可解决该问题的组件。如果存在但不满足所有要求，应分析扩展它的可能性。只有作为最后手段，才应创建新组件。在这种情况下，组件作为内部组件诞生，以满足特定应用程序的需求。但组件架构必须被视为通用架构，以便以后可以发布和改进，使其成为可重用组件。Zend\
  \ Framework 有一个关注这些问题的结构。\n\nZend Framework 的首个稳定版本是在 PHP 5.3 之前发布的，因此 ZF1 没有使用命名空间。当时尚未有\
  \ Composer，所以 ZF1 有自己的自动加载实现。但正如我提到的，Zend Framework 结构中存在的一个方面是能够进行更改的可能性。事实上，不稳定版本已经带来了如下可配置代码：\n\
  \n```\nZend_Controller_Front::run('/path/to/controllers' );\n```\n\nZend Framework\
  \ 不会确定控制器类的目录，而是让开发者自行选择。曾经有一个建议的项目结构，今天有一个 **模型-视图-控制器**（MVC）应用程序骨架可供开始构建应用程序，但更改项目元素地址的可能性仍然存在。\n\
  \nZend Framework 的另一个有趣特性是认识到 PHP 应用程序已经存在，你需要演进现有应用。新项目并不总是有需求，但生产环境中运行的应用需要维护。因此，Zend\
  \ Framework 从一开始就允许使用与 MVC 实现解耦的组件。能够使用 Zend Framework 组件重构应用程序，意味着可以将非核心业务任务外包出去，而无需更改所有内容。变更是必要的，但如果能够缓慢、逐步且安全地进行，会更好。\n\
  \nZend Framework 逐步演进，与 PHP 编程语言和其他软件开发技术的演进保持同步，同时融入设计模式和编程范式。2008 年，Zend Framework\
  \ 1.5 版本采用了带有 `Zend_Layout` 组件的 **两步视图** 模式，并提供了一个创建动态表单的组件 `Zend_Form`。同年，1.6 版本通过\
  \ `Zend_Test` 组件扩展了 PHPUnit。2009 年，Zend Framework 获得了代码生成工具 `Zend_Tool` 和反转控制组件\
  \ `Zend_Application`。Eclipse 和 Netbeans 等 IDE 很快就提供了与 `Zend_Tool` 的集成。\n\n即使在第一个主要版本中，Zend\
  \ Framework 也开始（甚至可选地）提供创建模块的可能性。在 Zend Framework 术语中，模块是可以重用的自包含单元。模块架构非常适合必须划分为多个子系统的复杂系统。在微服务的世界里，模块允许你创建一个最初是单体应用，但可以逐渐转换为分布式系统的应用程序。\n\
  \n你可能会问，_我们为什么不直接使用微服务来创建应用程序呢？_ 答案是另一个问题：_这真的有必要吗？_ 今天，我们拥有云环境提供的弹性资源，但这并不是分配我们暂时不需要的资源的理由。我们不需要提前做出改变，但要为改变做好准备。蛋糕有足够的烘烤时间。\n\
  \n在 2.0 版本中，Zend Framework 演进了模块架构，并提升了组件的一致性和性能。代码被重构为使用命名空间，并引入了两个新组件：`EventManager`（MVC\
  \ 实现使用的事件驱动编程多种策略的组合）和 `ServiceManager`（依赖注入容器）。自 2.0 版本以来，组件之间的解耦程度显著提高。\n\n2.5\
  \ 版本为 Zend Framework 带来了激进的变化。每个组件都有了自己的版本控制仓库，并拥有独立的生命周期。此外，类的自动加载和组件安装现在由 Composer\
  \ 处理。在 2.4 版本之前，Zend Framework 是一个 _全部下载但只使用所需内容_ 的框架。从 2.5 版本开始，它变成了 _下载并仅使用所需内容_\
  \ 的框架。\n\nZend Framework 3.0 版本将 PHP 的最低依赖版本更新至 7 版本，充分利用了语言中实现的改进。此外，Zend Framework\
  \ 3.0 带来了一个专门用于创建中间件的微框架 **Expressive**。这个微框架严格遵循 PHP-FIG 的 PSRs，并且与所使用的组件完全独立。\n\
  \nZend Framework 就这样结束了。是的，它结束了，因为正如我们在章节开头所说，它现在叫做 Laminas。_Lamina_ 意为 _刀片_。之所以取这个名字，是因为该框架允许创建分层应用程序，但层要薄，也就是说，具有最小必要层大小。正如\
  \ X 教授所说，演进是缓慢的。但有时演进会跨越式前进。从 Zend Framework 到 Laminas 的变更要求对所有类名进行重构。此外，社区的技术和社交基础设施也在改变。但这次跃进是好的，因为一个拥有多年经验的框架现在更加开放了。你将在这里学习它！\n\
  \n## Zend Framework 与 Laminas 的区别\n\n在社区生态系统方面，Zend Framework 与 Laminas 存在一些差异。Zend\
  \ Framework 作为一个开源项目，接受代码贡献。Laminas 同样可以接收捐赠，因为它隶属于一个非营利组织。Zend Framework 有论坛和 Slack\
  \ 频道供社区进行讨论和贡献。此外，Laminas 每月举行面向公众的会议，并记录 **技术指导委员会**（TSC，一个由具备技术知识并管理项目的成员组成的团体）的投票。换句话说，Laminas\
  \ 比 Zend Framework 更开放社区参与，也更加透明。这很好！你可以 - _如果你愿意_ - 积极参与到一个帮助你创建面向对象 Web 应用程序（内置多种设计模式）的产品开发中来。\n\
  \nSteve McConnell 指出，编程语言的选择是软件项目的关键构建决策。PHP 社区则表示，PHP 特别适合 Web 开发。但编程语言只是你在创建和维护\
  \ Web 应用程序项目时需要考虑的众多方面之一。这就是我们要讨论 Laminas 的原因。\n\n## Laminas 社区的技术和社交基础设施\n\n我们将讨论\
  \ Laminas 的许多功能，但当然不会涵盖一切。Laminas 的主要参考来源是官方文档，可在 `https://docs.laminas.dev` 上查阅。\n\
  \n\n\n\n\n![](img/e6cf5550804ccae9d1859270da8688f5_29_0.png)\n\n图 1.1 – Laminas\
  \ 文档主页\n\n文档主页上的 **组件** 和 **MVC** 选项与本书内容直接相关。不过，Laminas 还包含微框架 **Mezzio**（原名 Expressive）和\
  \ **API 工具**，后者是一个基于 Laminas 组件构建的 API 生成器。\n\n所有组件的源代码可在 `https://github.com/laminas`\
  \ 处供下载和贡献。你会发现有超过 100 个包含成熟组件的仓库。在此页面上，你可以打开 issue 来修复错误或请求新功能——请记住，对于功能，你获得的响应程度将取决于社区的兴趣。如果你有改进现有组件甚至创建新组件的想法，请提交实现代码，而不仅仅是规范说明。为自由开源项目做贡献是了解软件开发的绝佳方式，也能帮助你在同行中建立知名度，他们随后可能成为你的顾问。为\
  \ Laminas 做贡献的指南可在 `https://github.com/laminas/.github/blob/main/CONTRIBUTING.md`\
  \ 处找到。\n\nRoger Pressman 将软件定义为计算机程序及其相关文档的组合。人也是软件文档的一部分，因为他们通常持有尚未转化为显性知识的隐性知识。当文档不足时，我们可能需要寻求他人的帮助，录音对话也可以成为文档。你可以在官方讨论论坛中与参与或关注\
  \ Laminas 的人交流，该论坛可在 `https://discourse.laminas.dev` 访问。\n\n你可以通过向 `security@getlaminas.org`\
  \ 发送消息来报告潜在安全漏洞。如需了解 Laminas 的安全策略，请阅读 `https://getlaminas.org/security`。\n\n你可以通过打开\
  \ issue 并在论坛上发帖提问来获得社区支持；你甚至可以通过扩展组件自己解决问题。但如果你需要 *按需咨询支持* 或 *长期支持*，可以考虑 Zend Technologies\
  \ 的企业支持。如需了解该服务的更多信息，请阅读 `https://www.zend.com/products/laminas-enterprise-support`。\n\
  \n在对 Laminas 进行此概述后，下一章我们将准备使用该框架进行开发的环境。\n\n### 摘要\n\n软件就像一个生命体：它诞生、成长，终有一天会消亡。当然，我们不希望自己的软件过早消亡。为此，我们需要赋予软件一些特性，使其能够长期生存。本章我们讨论了有助于创建可重用且易于维护软件的框架。\n\
  \n我们介绍了 Laminas 的历史，它是一个用于构建 PHP Web 应用程序的免费开源框架。我们展示了它的演进过程，以及它作为可演进应用程序框架的设计方案。\n\
  \n在下一章，我们将准备使用 Laminas 开发 PHP Web 应用程序的环境。\n"
- "## 为我们的电子商务应用程序设置环境\n\n要建造一栋房子，我们需要各种工具和材料。工具越先进，盖房子就越容易；材料越好，房子越耐用。软件亦是如此。合适的工具可以帮助提高生产力，合适的组件可以使软件更容易维护。在本章中，我们将为本书中将要构建的示例应用程序设置开发环境：一个允许客户注册和购买商品的虚拟商店。所选工具均为面向世界上最常用操作系统的免费开源软件（OSS）。\n\
  \n本章将涵盖以下主题：\n\n- 安装通用 PHP：超文本预处理器（PHP）环境，包括 Web 服务器、PHP 解释器和关系数据库管理系统（RDBMS）\n\
  - 安装和使用 Laminas 的两种不同方式\n- 安装集成开发环境（IDE）——Eclipse 平台\n- 将 Laminas 相关命令集成到 Eclipse\
  \ 工具栏\n- 本书练习中将使用的数据模型\n\n具体来说，本章将包含以下部分：\n\n- 安装 Laminas\n- 配置 IDE——适用于 PHP 开发者的\
  \ Eclipse\n- 集成 Laminas 和 Eclipse\n- 管理 MySQL\n\n### 技术要求\n\n本书使用 Laminas MVC 3.3.4，该版本至少需要\
  \ PHP 7.4。然而，PHP 7.4 的支持已于 2022 年结束，因此建议至少使用 PHP 8.0，并鼓励使用 PHP 8.1。你可以在 https://www.php.net/supported-versions.php\
  \ 上查看 PHP 支持的截止日期。\n\n要创建和运行本书中的代码，你至少需要一个 PHP 解释器、一个 Web 服务器和一个 MySQL/MariaDB 实例（如果你调整数据库脚本，也可以使用\
  \ PHP 支持的任何数据库）。每种软件都有多种安装方式，且有些软件包将它们集成在一起。XAMPP 是一个捆绑 Apache HTTP Server、PHP 和\
  \ MySQL/MariaDB 的软件包。你可以从 https://www.apachefriends.org/download.html 下载适用于 Windows、Linux\
  \ 或 macOS 的 XAMPP。由于它可用于世界上大多数操作系统，我们将其作为默认的 PHP 环境。此外，XAMPP 提供了一个控制面板，可让你轻松启动/停止\
  \ Apache 和 MySQL。在下面的截图中，我们展示了 Linux 上的 XAMPP 控制面板示例：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_32_0.png)\n\
  \n图 2.1 – XAMPP 控制面板窗口\n\nApache Friends（XAMPP 的托管项目）的主页有一个简短且不错的视频，介绍了安装过程：https://www.apachefriends.org/index.html。\n\
  \nXAMPP 还附带一个 **phpMyAdmin** 实例用于管理 MySQL 数据库。一旦你通过 XAMPP 控制面板启动了 Apache 和 MySQL，就可以在\
  \ `https://localhost/phpmyadmin` 访问 phpMyAdmin。\n\n我们有时会使用命令行。为了避免在终端中使用 PHP 解释器的完整路径，你必须将包含\
  \ PHP 解释器的目录添加到 PATH 环境变量中。PHP 位于以下路径：\n\n- c:\\xampp\\php（适用于 Windows）\n- /opt/lampp（适用于\
  \ Linux）\n- /Applications/XAMPP/bin（适用于 OS X）\n\n安装好 PHP 环境后，你必须安装 **Composer**，它是\
  \ PHP 的依赖管理器。你可以从 `https://getcomposer.org/download` 下载它。将 `composer.phar` 文件放在与\
  \ PHP 解释器相同的目录中。对于 Linux 和 OS X 用户，只需将文件重命名为 `composer` 并授予其运行权限。对于 Windows 用户，请按照\
  \ `https://getcomposer.org/doc/00-intro.md#installation-windows` 中的说明操作。\n\n从现在起，我们的工作区将是\
  \ XAMPP 安装目录下的 `htdocs` 文件夹。我们将在该文件夹中创建所有示例。请记住：在本书中，当我提到 **工作区** 时，指的就是 `htdocs`。确保\
  \ `htdocs` 文件夹具有读写权限，以便你可以使用自己的用户在其中运行命令，并使用 IDE 打开文件。\n\n> **注意**\n> 如果你已经安装了 Web\
  \ 服务器、PHP、Composer 和 MySQL，可以使用它们，但本书假设使用 XAMPP，因此关于目录结构和程序的引用均与 XAMPP 相关。\n\n###\
  \ 安装 Laminas\n\n你可以通过以下任一方式安装 Laminas：\n\n- 为现有 PHP 应用程序（或没有 MVC 的小型应用程序）安装 Laminas\
  \ 的独立组件\n- 为基于 MVC 架构的新应用程序安装骨架应用程序\n\n### 通过 Laminas 的独立组件安装 Laminas\n\n让我们以安装对象关系映射（ORM）和数据库抽象组件\
  \ laminas-db 为例。在 htdocs 文件夹中，运行以下命令：\n\n```\ncomposer require laminas/laminas-db\n\
  ```\n\n此命令将创建一个名为 vendor 的文件夹并下载 laminas-db 组件及其依赖项。要加载组件的类，你需要导入 vendor/autoload.php\
  \ 文件。暂时，你只需检查 Composer 是否正常工作。稍后我们将使用独立组件构建基本示例，所以不必担心。成功下载后，你可以删除 laminas-db。如仅需删除该组件，请运行以下命令：\n\
  \n```\ncomposer remove laminas/laminas-db\n```\n\n此命令将删除 vendor 文件夹中的 laminas-db\
  \ 组件，但会保留 vendor 文件夹。htdocs 根目录下的该文件夹（vendor）不会被使用，因此你可以将其删除。我们将为项目创建一个特定的文件夹。\n\
  \n### 通过 MVC 骨架应用程序安装 Laminas\n\n要使用 Laminas 启动 MVC Web 项目，你有三种选择，如下所示：\n\n- 1.\
  \ 通过 https://github.com/laminas/laminas-mvc-skeleton Git 仓库克隆骨架。\n\n克隆后，你需要删除版本控制。可以通过进入\
  \ laminas-mvc-skeleton 文件夹并删除其中的 .git 文件夹来完成。.git 文件夹是 Git 仓库结构的一部分。它不会显示在 GitHub\
  \ 页面上，但在克隆仓库时会被创建。之后，你可以将 laminas-mvc-skeleton 文件夹重命名为你的项目名称。\n\n- 2. 通过以下链接下载骨架：https://github.com/laminas/laminas-mvc-skeleton/archive/refs/heads/1.3.x.zip。\n\
  \n解压缩文件并将文件夹重命名为 laminas-mvc-skeleton。\n\n- 3. 使用 Composer 安装骨架。\n\n我们将使用第三种方法。为此，请运行以下命令：\n\
  \n```\ncomposer create-project -sdev laminas/laminas-mvc-skeleton\nmyfirstlaminas\n\
  ```\n\n\n\n\n\n此命令的输出将以以下消息开头：\n\n```\nCreating a \"laminas/laminas-mvc-skeleton\"\
  \ project at \"./myfirstlaminas\"\n```\n\n从存储库下载文件后，项目创建者将向您询问以下内容：\n\n```\nDo you\
  \ want a minimal install (no optional packages)? Y/n\n```\n\n现在，您必须回答 Y，因为这只是下一个练习的预览。\n\
  \n之后，您将有一个名为 myfirstlaminas 的文件夹。我们将启动一个网页服务器，将 public 子文件夹作为 Web 根目录。为此，请运行以下命令：\n\
  \n```\nphp -S localhost:8000 -t myfirstlaminas/public/\n```\n\n当然，如果您在 Windows 上运行，目录分隔符是\
  \ \\\\。\n\n您可能会收到以下错误消息：\n\n```\nFailed to listen on localhost:8000 (reason: Address\
  \ already in use)\n```\n\n如果是这种情况，那是因为端口 8000 被另一个进程占用。没问题——您可以使用 8008 或其他可用端口。\n\
  \n假设您已成功在端口 8000 上启动网页服务器，如果输入地址 http://localhost:8000，您将能够看到以下屏幕截图中显示的主页：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_35_0.png)\n\
  \n图 2.2 – MVC 骨架应用程序的主页\n\n尝试请求一个不存在的页面，例如 `http://localhost:8000/otherpage`。在这种情况下，您将看到类似于此处所示的页面：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_36_0.png)\n\n图 2.3 – 页面未找到错误页面\n\n这些页面表明\
  \ Laminas MVC 组件已成功安装。对于我们的练习，PHP 的内置 Web 服务器已经足够，因为我们处于开发环境中。\n\n但如果您想使用生产 Web\
  \ 服务器，则有关 Apache 和 nginx 针对 Laminas 的配置的客观参考如下：\n\n- `https://docs.laminas.dev/tutorials/getting-started/skeleton-application/#using-the-apache-web-server`\n\
  - `https://docs.bitnami.com/installer/infrastructure/nginx/get-started/use-laminas`\n\
  \n现在我们可以说，我们用 Laminas 制作了一个“Hello World”应用程序。框架的代码已安装并正在产生可见结果。我们有盖房子的砖块，但只用双手搬运砖块可能会很困难。有时，使用手推车不错。其他时候，使用卡车可能更好。让我们使用卡车来搬运许多软件砖块：一个\
  \ IDE。\n\n### 配置 IDE – 适用于 PHP 开发人员的 Eclipse\n\nLaminas 不依赖于任何 IDE 即可工作。事实上，您可以使用\
  \ Vi 或 Visual Studio Code (VS Code) 进行 PHP 编程；就最终结果而言，没有区别。但是，编程活动可能非常复杂且充满细节，在查找错误原因时很容易迷失。具体来说，使用\
  \ PHP 交付一些结果非常容易，但随着单个程序增长并成为复杂应用程序，也很容易失去控制。我们需要帮助控制软件系统复杂性的工具，并让我们专注于实现客户为之付费的用例或用户故事。\n\
  \n在本书中，我们建议将 Eclipse 平台用作 Laminas 的 IDE。Eclipse 具有可插拔的特性——您可以根据需要添加和删除工具。许多公司和社区为\
  \ Eclipse 提供插件，该平台有一个市场，您可以在其中找到数百个将 Eclipse 与其他系统集成的组件。您可以根据自己的实际情况调整 Eclipse，而不是为了某个工具调整工作流程。\n\
  \n为方便起见，已经有许多针对特定用途的 Eclipse 发行版。其中，有一个用于 PHP：Eclipse PHP 开发工具 (PDT)。您可以从 https://www.eclipse.org/pdt/#download\
  \ 下载它。Eclipse 需要 Java 开发工具包 (JDK)。如果您还没有安装 JDK，请先安装，然后下载 PDT。安装本质上是文件解压缩。最终，您会在\
  \ eclipse 文件夹中得到一个名为 eclipse.exe (Windows) 或仅 eclipse (Linux/OS X) 的可执行文件。运行此文件时，Eclipse\
  \ 将打开一个询问工作区的窗口。您必须输入 XAMPP 的 htdocs 文件夹路径，如以下屏幕截图所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_37_0.png)\n\
  \n图 2.4 – Eclipse 工作区设置\n\n定义工作区后，Eclipse 将打开带有 Welcome 内部窗口的主窗口，如以下屏幕截图所示。您可以关闭此窗口，因为我们不需要它：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_38_0.png)\n\n图 2.5 – Eclipse PDT 的 Welcome\
  \ 视图\n\n不必担心丢失 **Welcome** 窗口中的链接，因为其中的所有链接在 Eclipse 菜单中都可用。关闭 **Welcome** 窗口后，您将看到一组内部窗口，如以下屏幕截图所示：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_38_1.png)\n\n图 2.6 – Eclipse PDT 的 Welcome\
  \ 视图（续）\n\n左侧，您可以看到 **项目资源管理器** 窗口，其中以树结构列出了 PHP 项目。右侧，您可以看到一个名为 **大纲** 的窗口，可以在其中查看中央窗口中打开文件的结构；这是不同文本编辑器的容器。底部，您可以看到\
  \ **问题** 窗口，其中显示与打开文件相关的错误消息和警告。这些窗口以及与我们练习无关的其他窗口组成了 *PHP 透视*。\n\n> **视图和透视**\n\
  > \n> Eclipse 界面中有两个核心概念：视图和透视。一个内部窗口称为 *视图*，而一组视图称为 *透视*。您可以通过单击 **窗口 | 显示视图**\
  \ 打开任何视图。同样，您可以通过 **窗口 | 透视 | 打开透视** 打开一个透视。\n\n当然，Eclipse 还有更多功能。请放心，我们将在需要时讨论每个与\
  \ Laminas 开发相关的功能。接下来，我们将学习如何将任何程序与 Eclipse 集成，以及为什么这对于使用 Laminas 很有用。\n\n### 集成\
  \ Laminas 和 Eclipse\n\n在集成用于创建 Laminas 项目的命令后，我们需要在 Eclipse 中配置 PHP 环境。\n\n您可以按照以下步骤操作：\n\
  \n- 1. 转到 **窗口 | 首选项 | PHP**。\n- 2. 首先要定义的项目是 PHP 可执行文件。\n- 3. 选择左侧的 **已安装的 PHPs**\
  \ 项目，如以下屏幕截图所示，然后单击右侧的 **添加...**：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_40_0.png)\n\
  \n图 2.7 – PHP 环境首选项\n\n- 4. 将打开一个窗口，如以下屏幕截图所示。您必须配置多个 PHP 可执行文件，因此每个文件都必须有不同的名称。在这里，我们将使用仅一个名为\
  \ PHP 的可执行文件：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_41_0.png)\n\n图 2.8 – PHP\
  \ 可执行文件配置\n\n- 5. 填写 PHP 可执行文件和 php.ini 文件的路径。\n- 6. 选择 SAPI 类型值，然后单击完成。\n\n现在，我们将在\
  \ Eclipse 中配置调用 Composer 的 create-project 命令。您可以通过单击 运行 | 外部工具 | 外部工具配置... 来完成此操作，以达到以下屏幕：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_42_0.png)\n\n图 2.9 – Composer create-project\
  \ 的配置\n\n接下来，双击 *图 2.9* 所示屏幕左侧的 **程序** 以创建新的程序配置。在右侧，您将看到一个 **主** 选项卡，您将以如下方式填写它：\n\
  \n- **名称**: 创建 Laminas 项目\n- **位置**: 这里，您必须键入 Composer 可执行文件的完整路径\n- **工作目录**: ${workspace_loc}\n\
  - **参数**: create-project -sdev laminas/laminas-mvc-skeleton ${string_prompt:Project\
  \ name}\n\n${...} 等表达式是 Eclipse 变量。${workspace_loc} 变量包含当前 Eclipse 工作区的完整路径。${string_prompt}\
  \ 变量则包含用户在对话框中输入的文本。当 Eclipse 运行程序时，将打开此对话框。您可以编写要在此对话框中显示的消息，方法是在 string_prompt\
  \ 术语后加上冒号并附加文本。因此，要显示“项目名称”消息，请编写 ${string_prompt:Project name}。还有其他变量，您可以通过单击“变量”按钮查看所有变量。\n\
  \n主选项卡显示程序的工作部分，但为了使程序出现在 Eclipse 工具栏中，我们必须在 常用 选项卡下选择一个选项，如以下屏幕截图所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_43_0.png)\n\
  \n图 2.10 – 将程序启用为菜单项\n\n如图 2.10 所示，常用 选项卡有一个名为“在收藏夹菜单中显示”的框。您必须选中框内的 外部工具 选项，以便程序在菜单中可见。之后，您可以单击\
  \ 应用 以保存配置。\n\n然后，您可以单击工具栏中的 外部工具 按钮。该按钮的图标是一个带有红色工具箱的绿色播放符号。如以下屏幕截图所示，该按钮将打开一个包含我们的“创建\
  \ Laminas 项目”程序的列表：\n\n\n\n\n![](img/e6cf5550804ccae9d1859270da8688f5_44_0.png)\n\
  \n图 2.11 – 菜单中的“创建 Laminas 项目”命令\n\n单击**创建 Laminas 项目**将打开一个对话框，如以下屏幕截图所示。将`mysecondlaminas`作为项目名称，然后单击“确定”：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_44_1.png)\n\n图 2.12 – “创建 Laminas 项目”命令的对话框\n\
  \n名为**控制台**的视图将在底部打开，并显示您在终端中运行该命令时会看到的相同输出。当`<terminated>`出现在**控制台**视图的顶部时，即表示完成，如以下屏幕截图所示：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_44_2.png)\n\n图 2.13 – 控制台视图\n\n要打开新项目，您必须访问以下屏幕截图中显示的“文件\
  \ | 新建 | PHP 项目”菜单。将**项目名称**字段填写为`mysecondlaminas`，然后单击**完成**：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_45_0.png)\n\
  \n图 2.14 – 新 PHP 项目屏幕\n\n`mysecondlaminas`项目现在将在**项目资源管理器**视图中打开。如果您单击项目名称，它将显示其内容，如以下屏幕截图所示：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_46_0.png)\n\n图 2.15 – mysecondlaminas\
  \ 项目\n\n该项目不是由 Eclipse 创建的，而是因为它已存在而与 Eclipse 关联。现在，Eclipse 将 mysecondlaminas 文件夹识别为\
  \ PHP 项目，并启用与该编程语言相关的所有功能。\n\n现在您知道如何在 Eclipse 中创建 Laminas 项目了，您可以删除 mysecondlaminas\
  \ 项目。为此，您必须右键单击项目名称并选择**删除**。这将打开以下对话框：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_47_0.png)\n\
  \n图 2.16 – 删除资源对话框\n\n现在冷静点。等等。如果您单击“确定”，将取消该项目作为 Eclipse 项目的关联。它将继续存在于文件系统中。要真正删除项目并删除所有文件，您必须选中**删除磁盘上的项目内容（此操作无法撤销）**选项。是的，这是一条令人生畏的消息，但您可以选中它并删除`mysecondlaminas`项目，因为我们不再需要它了。是的，这次您可以单击“确定”——无需担心。\n\
  \n如果我们需要在 Eclipse 与其他程序之间进行更多集成，我们将适当地进行这些集成。目前，只需知道您能够将程序集成到 Eclipse 工具栏中即可。此外，您可能也迫不及待地想要做点什么——我是说，一些可以运行的代码。保持冷静——在开始编码之前，我们需要为练习定义数据模型。我们开始吧！\n\
  \n### 管理 MySQL\n\n如前所述，XAMPP 自带一个用于管理 MySQL 数据库的 phpMyAdmin 实例，可通过 `https://localhost/phpmyadmin`\
  \ 访问。在 XAMPP 中，默认情况下 MySQL 超级用户 `root` 没有密码。因此，当您第一次访问 phpMyAdmin 时，将进入 phpMyAdmin\
  \ 主页，如以下屏幕截图所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_48_0.png)\n\n图 2.17\
  \ – phpMyAdmin 主页\n\n此页面包含两个框架：左侧显示数据库树，右侧显示环境概览。\n\n如您所见，已经存在一些系统数据库，例如 information_schema\
  \ 和 performance_schema。还有一个名为**新建**的节点。单击**新建**，您将在右侧看到以下屏幕截图所示的框架：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_48_1.png)\n\
  \n图 2.18 – phpMyAdmin 主页（续）\n\n您可以使用此框架创建将在我们的练习中使用的数据库。只需填写数据库名称的输入文本，然后单击**创建**。我们需要创建两个数据库：`school`\
  \ 和 `whatstore`。创建它们。您将能够在左侧看到它们。不用担心表，因为我们将使用脚本来创建它们。这些脚本可在 https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/databases\
  \ 获取。\n\n`school` 数据库将用于_启动引擎_。它只有两个表：`classes` 和 `students`。它是一个学校系统的精简版，但存在一对多关系。带有字段和数据类型的表结构可以在以下屏幕截图中看到：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_49_0.png)\n\n图 2.19 – school 数据库的数据模型\n\
  \n`whatstore` 数据库将用于我们的挑战性练习——电子商务应用程序。它有 12 个表，分为 2 组。\n\n一组是业务核心，由以下表组成：\n\n-\
  \ customers\n- discounts\n- inventory\n- order_items\n- products\n- purchase_orders\n\
  - transactions\n\n另一组是管理模块，由以下表组成：\n\n- employees\n- employee_roles\n- resources\n\
  - resources_role\n- roles\n\n带有字段和数据类型的表结构可以在以下屏幕截图中看到：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_50_0.png)\n\
  \n图 2.20 – whatstore 数据库的数据模型\n\n`school` 数据库的脚本是 `school.sql` 文件，`whatstore` 数据库的脚本是\
  \ `whatstore.sql`。您可以从 GitHub 仓库下载它们。\n\n几段前我告诉过您什么是**统一资源定位符 (URL)**——还记得吗？要从这些脚本创建表，我们可以使用\
  \ phpMyAdmin 的导入页面。首先，在左侧选择一个数据库，单击其名称。例如，让我们选择 `school` 数据库。选择该数据库后，单击右侧框架中的**导入**选项卡。然后，您将看到类似于以下屏幕截图所示的页面。要导入脚本，请单击**浏览**按钮并在文件系统中查找文件。对于\
  \ `school` 数据库，脚本是 `school.sql`，对吧？\n\n![](img/e6cf5550804ccae9d1859270da8688f5_51_0.png)\n\
  \n图 2.21 – phpMyAdmin 导入页面\n\n选择脚本文件后，您必须单击右侧页面底部的**执行**，如以下屏幕截图所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_51_1.png)\n\
  \n图 2.22 – 导入页面底部的“执行”按钮\n\n等待脚本处理完成，您将看到以下页面，其中包含导入结果：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_52_0.png)\n\
  \n图 2.23 – 结构化查询语言 (SQL) 架构导入过程结束\n\n在左侧，我们将看到新的表节点。对于 `school` 数据库，我们将看到 `classes`\
  \ 和 `students` 节点。现在，对 `whatstore` 数据库执行相同的过程。\n\n我们终于完成了开发环境的配置。我们拥有练习所需的一切。希望您已成功遵循环境指南，以避免在下一章中出现不愉快的惊喜。正如本杰明·富兰克林所说：“未准备即是准备失败。”\n\
  \n### 摘要\n\n在本章中，我们安装了一个通用的 PHP 环境，包含 Web 服务器、PHP 解释器和关系型数据库管理系统。该环境基于 XAMPP，这是一个用于\
  \ PHP 开发的免费软件和开源软件包，适用于最常用的操作系统。\n\n我们学习了安装和使用 Laminas 的两种不同方式：作为 PHP 应用程序（无论其结构是\
  \ MVC 还是非 MVC）使用的隔离组件；以及作为 MVC 应用程序的容器，将应用程序的控制权委托给框架。\n\n我们还安装了一个免费开源 IDE：Eclipse\
  \ for PDT。我们演示了如何将带有**命令行界面 (CLI)** 的程序集成到 Eclipse 工具栏中，配置一个在 Eclipse 内创建 Laminas\
  \ 项目的条目。\n\n最后，在 phpMyAdmin（嵌入到 XAMPP 中）的帮助下，我们创建了本书练习所需的数据库——school 和 whatstore。\n\
  \n在下一章中，我们将通过一些使用 school 数据库的练习来学习使用 Laminas 编程的基础知识。\n\n\n\n"
- "## 将 Laminas 用作带测试驱动开发的库\n\n接下来的两章将为你使用 Laminas 做好准备。准备工作分为三个阶段，以便让你逐渐适应在 Laminas\
  \ 中编写代码。在本章中，我们将经历第一阶段，我们将基于一个精简的用例通过一个简单示例来加以说明，展示在现有 PHP 应用程序中只使用一个 Laminas 组件是可行的。我们将首先使用\
  \ `laminas-db` 组件来抽象数据库连接。在下一章中，我们将介绍其他两个阶段。\n\n你可以假设性地从上一章跳转到 *第 5 章，创建虚拟商店项目*，但这就像有人把一把光剑交给你没有任何训练，并告诉你在首次任务中面对达斯·维德。相反，让我们保持冷静，好好为战斗做准备。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 了解软件需求\n- 使用 TDD 开发我们的用例\n- 生成代码覆盖率报告\n\n### 技术要求\n\n要在本章中实现示例，需要以下项目：\n\
  \n- XAMPP 8 或更高版本\n- Eclipse for PHP Developers 2021-12 或更高版本\n- 上一章中创建的 school\
  \ 数据库\n\n所有这些项目的安装或创建在 *第 2 章，为我们的电子商务应用程序设置环境* 中进行了说明。\n\n本章示例最初是在一台配备 7.6 GB 内存、1.0\
  \ TB 磁盘空间和带有 4 个 2.50 GHz 内核的 CPU 的计算机上开发的。\n\n本章生成的代码完全可在 https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter03\
  \ 上获得。\n\n### 了解开发软件的需求\n\n我们需要正确的需求来开发软件——如果我们的需求错了，我们将生产出错误的软件。无论我们拥有多么出色的框架、多么惊艳的\
  \ IDE 或多么优秀的持续集成环境，都无关紧要。如果我们有好的工具，但需求错了，我们只会更快地交付错误的软件。\n\n> 非常重要的注意事项\n> 框架无法修复你需求中的错误。\n\
  \n废话不多说，让我们来看看我们的需求。想象你正在开发一个学校管理系统。更准确地说，你被委托开发管理班级和学生的子系统。如你所见，这些学校元素组之间有若干共同细节。我们强调相似之处，因为这在进行代码复用时很方便。\n\
  \n假设已进行了仔细的需求确定，你收到了以下用例，用于首先实现班级注册。\n\n### 用例 – 管理学校班级\n\n本用例各流程的共同前提条件是存在一个名为\
  \ school 的数据库，其中有一个名为 classes 的表，以及应用程序与数据库之间的有效连接。共同异常是 SQL 错误。以下是我们需要的用例流程列表：\n\
  \n- 列表流程（基本）\n  - 描述：用户请求班级列表\n- 插入流程（备选）\n  - 描述：用户插入一个新班级\n  - 后置条件：在表中找到带有输入数据的记录\n\
  - 更新流程（备选）\n  - 描述：用户更新一个现有班级\n  - 后置条件：在记录中找到更改\n- 删除流程（备选）\n  - 描述：用户删除一个现有班级\n\
  \  - 后置条件：不再找到该记录\n\n既然你已经了解了我们用例所需的流程，让我们开始为这个用例实现一个结构。\n\n### 为用例实现一个结构\n\n既然我们已有需求，让我们使用以下步骤创建一个名为\
  \ school1 的 PHP 项目：\n\n1. 在 Eclipse 中，访问 File | New | PHP Project。\n2. 在“新建 PHP\
  \ 项目”窗口中（见图 3.1），键入 school1 并单击 Finish：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_57_0.png)\n\
  \n图 3.1 – 创建 school1 项目\n\n之后，你将在“项目资源管理器”视图中看到一个名为 school1 的节点，如图 3.2 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_58_0.png)\n\
  \n图 3.2 – “项目资源管理器”视图中的 school1 项目\n\n你是否认为有问题，因为子节点右侧显示的 PHP 版本（PHP 语言库）低于已安装的版本？这似乎很奇怪，因为你之前已配置了\
  \ PHP 解释器。但是，如果你访问 Window | Preferences 菜单并选择 PHP | Installed PHPs 项目，你将看到正确的 PHP\
  \ 版本，如图 3.3 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_58_1.png)\n\n图 3.3 –\
  \ Eclipse 中配置的 PHP 解释器\n\n好吧，没什么问题。在“项目资源管理器”视图中显示的版本是 PHP 的语法和标记验证版本。这意味着 Eclipse\
  \ 的 PHP 代码编辑器将验证直到该版本所定义的元素。如果你因为想立即使用最新功能而感到不安，我请你保持冷静。你可以毫无问题地使用最新功能，因为只有解释器理解的内容才重要。例如，PHP\
  \ 8 为函数提供了命名参数，而 PHP 7 没有。如果你在 PHP 文件中使用命名参数，Eclipse 的 PHP 代码编辑器（针对 PHP 7.4 准备）会将命名参数高亮显示为错误。但是，如果你使用的是\
  \ PHP 8 解释器，代码将成功运行。换句话说，忽略关于 PHP 8 专属功能的错误消息。它们是错误警报，将在下一个 Eclipse 版本中消失。\n\n比静态代码警告更重要的是为运行代码编写测试。是的，我们将创建测试。在一段时间内，我们将在编写一些实现之后再编写测试——这并不是很好。为什么这不好？如果你在为某事编写测试之前就实现了它，你可能会忽略测试。但如果你先创建测试，你就确保有东西来检查你的代码是否正常工作。正是出于这个原因，我们将在下一节中，根据测试驱动开发（TDD）的准则，在完整实现之前创建测试。\n\
  \n请参阅此处（图 3.4）使用统一建模语言（UML）组件图构建的架构草稿，用于班级注册用例。这是我们将在 school1 项目中实现的唯一用例：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_59_0.png)\n\
  \n图 3.4 – school1 项目文件的 UML 组件图\n\n如图 3.4 所示，我们将学校班级的注册规划为一组七个 PHP 文件。这些文件的用途如下：\n\
  \n- `index.php`: 指向主页，是操作的起点\n- `list.php`: 显示带有 `insert`、`update` 和 `delete` 类超链接的班级列表\n\
  - `edit.php`: 显示用于插入或更新班级的表单\n- `form.php`: 为 `edit.php` 定义表单\n- `save.php`: 将类插入或更新到数据库中\n\
  - `delete.php`: 从数据库中删除一个类\n- `SchoolClass.php`: 一个学校班级模型，封装了对 classes 表的处理\n- `config.php`:\
  \ 包含用于数据库连接的配置数据\n\n名为 SchoolClass 的类的属性和方法在图 3.5 的类图中展示：\n\n| SchoolClass |\n|---|\n\
  | + code : int |\n| + name : string |\n| + getAll() |\n| + save() : bool |\n| +\
  \ delete() : bool |\n| + __construct(code : int = 0, name : string = \"\") |\n\n\
  图 3.5 – SchoolClass 的 UML 类图\n\nSchoolClass 类具有与 classes 表字段相等的属性。这个类还具有以下方法：\n\n\
  - getAll: 返回列表流程的数据\n- save: 执行插入和更新流程\n- delete: 执行删除流程\n- __construct: 使用特定记录的数据初始化一个实例\n\
  \n> 注意：Laminas 不要求完全面向对象的项目\n>\n> 你在 PHP 中不必使用面向对象编程（OOP）。你可以自由只使用结构化编程、只使用 OOP，或者结合两种范式。Laminas\
  \ 并不将你束缚于 OOP，尽管它是在 OOP 下实现的。它不强加你的软件项目的整体结构，因此你可以根据实际需求使用类。\n\n好吧，由于我们只有最小的项目文档，让我们使用以下步骤实现我们的学校班级注册：\n\
  \n1. 在 Eclipse 中，选择 school1 项目，访问 File | New | PHP File 菜单，并在文件名字段中键入 index.php。\n\
  2. PHP 文件编辑器将在 Eclipse 窗口中间打开一个视图，其中有一行以 `<?php` 开头。\n3. 删除此文件中的所有内容。\n4. 然后，按 CTRL\
  \ + 空格键。你将看到模板列表，如图 3.6 所示：\n\n\n\n```\n### New CSS File - new css file\n<!> html\n\
  ### New HTML File (4.01 frameset) - html 4.01 frameset\n### New HTML File (4.01\
  \ strict) - html 4.01 strict\n### New HTML File (4.01 transitional) - html 4.01\
  \ transitional\n### New HTML File (5) - html 5\n### New XHTML File (1.0 frameset)\
  \ - xhtml 1.0 frameset\n### New XHTML File (1.0 strict) - xhtml 1.0 strict\nPress\
  \ 'Ctrl+Space' to show Template Proposals\n```\n\n图 3.6 – 为 HTML 文档使用模板\n\n- 5.\
  \ 此功能允许我们填充带有重复内容的 Web 文件，这些内容是您总是需要编写的，例如文档的开始和结束标记。\n\n- 6. 选择 New HTML File (5)\
  \ - html 5 项。Eclipse 将使用 HTML 5 基本结构填充文件。我们将根据以下源代码添加特定内容：\n\n### index.php\n\n\
  ```\n<!DOCTYPE html>\n<html>\n  <head>\n    <meta charset=\"UTF-8\">\n    <title>Classes\
  \ Registration</title>\n  </head>\n  <body>\n    <h1>Classes Registration</h1>\n\
  \    <p>\n      <a href=\"edit.php\">Add a new class</a>\n    </p>\n    <table>\n\
  \      <thead>\n        <tr>\n          <th>code</th>\n          <th>name</th>\n\
  \        </tr>\n      </thead>\n      <tbody>\n<?php\nrequire 'list.php';\n?>\n\
  \      </tbody>\n    </table>\n  </body>\n</html>\n```\n\n- 7. 如在组件图中所示（参见图 3.4），index.php\
  \ 文件依赖于 list.php 文件。第一个文件保留静态内容，而第二个文件生成动态内容。由于我们已创建第一个文件，现在将创建第二个文件。\n\n- 8. 选择\
  \ school11 项目，访问 文件 | 新建 | PHP 文件 菜单，并在文件名字段中输入 list.php。将以下代码输入文件：\n\n### list.php\n\
  \n```\n<?php\nuse School\\\\SchoolClass;\nforeach(SchoolClass::getAll() as $row)\
  \ :\n?>\n<tr>\n<td><a href=\"edit.php?code=<?=$row['code'] ?>\"><?=$row['code']\
  \ ?></a></td>\n<td><?=$row['name'] ?></td>\n<td><a href=\"delete.php?code=<?=$row['code']\
  \ ?>\">Remove</a></td>\n</tr>\n<?php\nendforeach;\n```\n\n- 9. list.php 文件包含一个重复循环，用于遍历由\
  \ SchoolClass 类提供的集合以列出学校类。我们使用 foreach 结构的替代语法，该语法使用 endforeach 而不是花括号。当 PHP 代码嵌套在\
  \ HTML 代码中时，这种替代语法很有用，因为它更清晰。我们现在只有几行代码，但随着代码行数增多，理解 PHP 代码块的众多不同开始和结束可能会变得混乱。\n\
  \n- 10. 代码编辑器中必定会出现警告，因为我们尚未创建类 `SchoolClass`。如图 3.7 所示，代码编辑器左右两侧都显示了警告。在左侧，编辑器显示一个红色方块内带有白色\
  \ X 的灯泡图标。在右侧，编辑器显示红色矩形：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_63_0.png)\n\
  \n图 3.7 – 两侧的错误警告\n\n- 11. 左侧的图标允许我们尝试修复错误。单击其中任何一个时，Eclipse 将显示修复建议。右侧的矩形会突出显示行中的错误。\n\
  \n这结束了管理学校类用例的基本结构。接下来，我们将在实现更多业务代码之前创建测试。\n\n### 创建我们的第一个自动化测试\n\n让我们现在创建第一个自动化测试，以检查\
  \ `SchoolClass::getAll` 静态方法是否返回我们预期的内容。但是……我们预期什么？一组数组，每个数组都带有 `code` 和 `name`\
  \ 键。\n\n在创建第一个测试用例之前，让我们将 **PHPUnit** 安装到我们的项目中。我们将使用 **Composer** 来完成此操作；不过，这次我们将在\
  \ Eclipse 内部使用 Composer。\n\n要安装 PHPUnit，请执行以下步骤：\n\n- 1. 右键单击 `school11` 项目并访问 **配置\
  \ | 添加 Composer 支持** 菜单，如图 3.8 所示。\n\n![](img/e6cf5550804ccae9d1859270da8688f5_63_1.png)\n\
  \n图 3.8 – 添加 Composer 支持\n\n- 2. 一个名为 `composer.json` 的文件将在项目根目录中创建。Eclipse 将打开一个用于编辑\
  \ `composer.json` 文件的视图：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_64_0.png)\n\
  \n图 3.9 – Composer 视图\n\n- 3. Composer 视图底部有几个选项卡。其中一个是 **依赖项**。此选项卡填充与项目依赖项相关的\
  \ `composer.json` 部分。\n\n- 4. 单击 **依赖项** 选项卡，视图将显示两个用于包含依赖项的部分：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_65_0.png)\n\
  \n图 3.10 – Composer 视图的依赖项选项卡\n\n- 5. 我们将添加一个开发依赖项 PHPUnit，这是一个用于 PHP 应用程序的测试框架。\n\
  - 6. 单击屏幕底部的 **要求（开发）** 部分，该部分将在视图中展开。\n- 7. 在右侧，有一个名为 **Packagist 搜索** 的搜索框。我们可以在此处安装存储库\
  \ (https://packagist.org) 中可用的任何依赖项。\n- 8. 在其中键入 `phpunit`，插件将列出所有名称匹配 `phpunit`\
  \ 的可用包。搜索使用部分匹配，而非精确匹配（参见 **图 3.11**）：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_65_1.png)\n\
  \n图 3.11 – 搜索要安装的包\n\n- 9. 选择 **phpunit/phpunit** 项并单击 **添加依赖项** 按钮。最新可用版本的 PHPUnit\
  \ 包将插入到左侧的列表中。\n\n- 10. 单击 **composer.json** 选项卡以查看 Eclipse Composer 插件生成的代码：\n\n\
  ### composer.json\n\n```\n{\n\t\"name\" : \"school1/school1\",\n\t\"require-dev\"\
  \ : {\n\t\t\"phpunit/phpunit\" : \"~9.5\"\n\t}\n}\n```\n\n- 11. 别忘了按下 **CTRL + S**\
  \ 保存更改。Composer 插件会生成代码但不会自动保存。\n\n- 12. 在 Composer 视图顶部右侧，有一些按钮。最左侧的第一个按钮是 **安装依赖项**：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_66_0.png)\n\n图 3.12 – 使用 Composer 安装依赖项\n\
  \n- 13. 单击 **安装依赖项** 按钮，Eclipse 将运行 `composer install` 命令。\n\n- 14. 您将看到 Composer\
  \ 将创建一个名为 `vendor` 的文件夹和两个文件 `composer.lock` 和 `composer.phar`：\n\n- vendor\n- composer.json\n\
  - composer.lock\n- composer.phar\n\n图 3.13 – Composer 文件和文件夹\n\n- 15. composer.lock\
  \ 文件是已安装依赖项的状态文件。composer.phar 文件是 Composer 的可执行文件，下载后用于与 Eclipse 中配置的 PHP 一起运行。\n\
  - 16. 由于已创建 composer.lock 文件，您必须使用 **更新依赖项** 按钮来更新通过 Composer 安装的组件：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_67_0.png)\n\
  \n图 3.14 – 更新依赖项按钮\n\n太棒了！最终，我们已将 PHPUnit 实例安装到我们的项目中。\n\n> **提示**\n> 建议您关闭并重新打开项目，以确保自动补全选项会考虑已安装的依赖项。\n\
  \n因此，我们已经了解如何从用例创建 PHP 项目结构，以及如何在 Eclipse 中安装测试框架的依赖项。在下一节中，我们将在测试的帮助下进一步开发我们的用例。\n\
  \n### 使用 TDD 开发我们的用例\n\n从现在开始，我们将开始使用 TDD。这是一种由 Kent Beck 推广的方法，他是 *敏捷软件开发宣言* 的签署者之一。Beck\
  \ 表示，TDD 是一种无惧编程的方式。当你在创建被测试的代码之前编写测试时，你实际上是在将需求编写为代码。一个随时可运行的测试会告诉我们代码是否随时满足需求。仅仅创建能正常工作的代码是不够的。我们需要在每次更改后保持代码的可运行状态。测试会告诉我们更改是否导致代码停止工作。\n\
  \n### 敏捷软件开发宣言\n\n2001 年，17 名软件开发人员发表了一份宣言，阐述了他们关于更好软件开发方式的想法。这个“敏捷宣言”提出了四个主要价值观和十二条原则，以指导开发人员管理软件构建。宣言的理念是作者采用的几种方法的结合。这些方法旨在改善软件开发过程的质量和软件作为产品的质量，并承认变化是唯一的常数。该宣言可在\
  \ https://agilemanifesto.org 上查阅。\n\n在下一节中，我们将实践敏捷开发的一种方法，即在创建将被测试的类之前先创建测试类。\n\n\
  ### 创建我们的 SchoolClassTest 测试类\n\n让我们现在通过执行以下步骤来创建我们的第一个测试：\n\n- 1. 在 Eclipse 中，选择\
  \ `school1` 项目并访问 文件 | 新建 | 文件夹 菜单。\n- 2. 创建一个名为 `test` 的文件夹：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_68_0.png)\n\
  \n图 3.15 – 创建测试文件夹\n\n\n\n\n3. 使用 File | New | Class 菜单选择测试文件夹并创建一个类。Eclipse 将打开一个如图\
  \ 3.16 所示的窗口：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_69_0.png)\n\n图 3.16 –\
  \ 创建 PHP 类\n\n4. 按以下方式修改 New PHP Class 窗口中的字段：\n- 类名：设置为 SchoolClassTest\n- 绑定命名空间和位置：取消选中\n\
  - 命名空间：设置为 SchoolTest\n\n5. 单击 Superclass 字段右侧的 Browse 按钮。Eclipse 将打开一个窗口，如图 3.17\
  \ 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_70_0.png)\n\n图 3.17 – 选择父类\n\n\
  - 6. 在顶部的文本框中输入 TestCase，**TestCase** 类将显示在列表中。\n- 7. 选择 **TestCase** 并单击 OK。\n\
  - 8. 在下一个窗口 **New PHP Class** 中，单击 **Finish** 按钮。代码编辑器将打开并显示以下代码：\n\n### SchoolClassTest.php\n\
