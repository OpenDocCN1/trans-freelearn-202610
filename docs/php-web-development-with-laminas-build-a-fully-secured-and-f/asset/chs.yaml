- "## 从对象关系映射到 MVC 容器\n\n本章继续为使用 Laminas 做准备。在这里，我们将介绍最后两个阶段：\n\n- 使用对象关系映射（ORM）处理数据库，抽象\
  \ SQL 语句\n- 使用 Laminas 框架作为容器实现面向对象 PHP 应用程序的控制反转\n\n首先，我们将解释在 laminas-db 的帮助下实现的\
  \ ORM 基础。然后，我们将通过构建 MVC 应用程序向您介绍 Laminas 的基础知识。这些基础对于创建电子商务应用程序非常重要，学习它们将非常宝贵。您可以跳转到第\
  \ 5 章，创建虚拟商店项目，但您可能会感觉自己正试图用滑翔机攻击死星。保持冷静，准备好战斗。\n\n在本章中，我们将涵盖以下主题：\n\n- 使用 ORM\n\
  - 用例 – 管理学生\n- 将 Laminas 用作容器\n\n### 技术要求\n\n与本章相关的所有代码均可在 https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter04\
  \ 处找到。\n\n### 使用 ORM\n\n您已学习如何使用 `laminas-db` 及其实现的 **适配器** 设计模式连接到关系数据库。但是，尽管我们创建了一个允许通过配置在不同\
  \ SQL 数据库供应商之间切换的结构，但我们仍在编写 SQL 语句。当直接在应用程序代码中编写 SQL 语句时，我们必须选择特定的 SQL 方言。虽然存在 SQL\
  \ 标准，但事实是，存在一些差异，例如引号的使用和函数名称。\n\n例如，在 MySQL 中，对 `whatstore` 数据库的 `resources` 表的查询将采用以下形式：\n\
  \n```\nSELECT `code`, `name`, `method` FROM `resources`\n```\n\n另一方面，PostgreSQL\
  \ 中的同一查询将如下所示：\n\n```\nSELECT \"code\",\"name\",\"method\" FROM \"public\".\"resources\"\
  \n```\n\n由此可见，这些供应商各自的引号字符不同。如果在另一个供应商中使用其中一个的 `SELECT` 查询，将发生错误。想象一下，因为要从一个供应商迁移到另一个供应商而更改应用程序的多个文件。\n\
  \n您可能会说，基于正则表达式的字符串替换可以快速解决这个问题。但是，除了引号问题之外，数据库函数之间还存在差异。例如，MySQL 会汇总多个表记录中字段的值，如下所示：\n\
  \n```\nSELECT GROUP_CONCAT(`name`) as `names` FROM `resources`\n```\n\n但是 PostgreSQL\
  \ 使用另一个函数来获得相同的结果：\n\n```\nSELECT string_agg(\"name\",',') AS \"names\" FROM \"\
  public\".\"resources\"\n```\n\n因此，如果应用程序直接编写 SQL 语句，数据库迁移可能是一项艰巨的任务。\n\nORM 避免了在需要从一个数据库供应商迁移到另一个供应商时重写代码。这种便利之处得益于\
  \ SQL 语句封装。\n\n要开始使用 ORM，我们将学习如何将表视为对象。`laminas-db` 组件实现了 **表数据网关** 和 **行数据网关**\
  \ 设计模式，分别允许将表或记录集视为对象，并允许将单个记录视为对象。在本章中，我们将使用表数据网关模式。\n\n### 表数据网关\n\n马丁·福勒在其著作《企业应用架构模式》（Addison-Wesley\
  \ 出版）中将表数据网关定义为“充当数据库表网关的对象”。该对象旨在处理表中的多行。网关也是一种设计模式的名称。马丁·福勒在同一本书中将网关定义为“封装对外部系统或资源访问的对象”。数据库对于\
  \ Web 应用程序来说是外部系统，因此一些对象关系模式扩展网关模式是合情合理的。您可以使用表数据网关搜索单个记录，但该对象始终返回一个记录集（在本例中，是只包含一个元素的集合）。\n\
  \n### 行数据网关\n\n马丁·福勒在其著作《企业应用架构模式》（Addison-Wesley 出版）中将行数据网关定义为“充当数据源中单个记录网关的对象”。虽然表数据网关关注记录集，但行数据网关关注单个记录。\n\
  \n在本章中，我们将创建一个 `school12` 项目，该项目将使用 `laminas-db` 实现 ORM。这个 `school12` 项目与 `school11`\
  \ 项目的不同之处在于职责分离。在 `school11` 中，同一个类（`SchoolClass`）存储业务数据并处理与数据库的通信。现在，我们将有一个在内存中存储数据但不知道数据源的类，以及另一个用于读写数据库的类。这种方法避免了将业务规则与数据存储模型耦合。我们可以按以下方式分离职责：\n\
  \n1. 在 `htdocs` 文件夹中复制 `school11` 项目，并在同一个 `htdocs` 文件夹中将其命名为 `school12`。请记住，我们在《第\
  \ 2 章，为我们的电子商务应用程序设置环境》中约定，`htdocs` 文件夹将是本书中的工作空间。您可以通过右键单击 `school11` 项目并点击 **复制**，或直接按\
  \ `Ctrl + C` 来执行此操作。然后，按 `Ctrl + V`，您将看到一个对话框，如图 4.1 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_95_0.png)\n\
  \n图 4.1 – 复制项目的对话框\n\n2. 确保 **项目名称** 字段填写为 `school12`；然后，单击 **复制**。\n\n3. 右键单击 `school11`\
  \ 项目并单击 **关闭项目** 项。\n\n我们正在关闭第一个项目，因为我们不再需要它，如果它保持打开状态，我们可能会不小心更改该项目中的文件，以为它属于 `school12`\
  \ 项目。从现在起，我们将在 `school12` 项目上工作。\n\n### 用例 – 管理学生\n\n在这个第二个项目（`school12`）中，我们将实现另一个用例，*管理学生*。这个用例与*管理学校班级*非常相似。两者都有四个流程，与创建、恢复、更新和删除操作相关。不同之处在于\
  \ `student` 模型依赖于 `school class` 模型。因此，*管理学生*用例流程的前提条件是 `classes` 表必须至少有一条记录。\n\n\
  ### 实现用例\n\n到目前为止，您已经知道如何创建文件夹。因此，让我们按照以下步骤实现一个用例：\n\n1. 在项目根目录下创建一个名为 `view` 的新文件夹。\n\
  \n2. 在此文件夹内，创建两个更多文件夹：`schoolclass` 和 `student`。\n\n`view` 文件夹是与用户界面相关的文件的明确划分。这种组织将帮助我们识别哪些属于表现层。\n\
  \n3. 接下来，选择以下文件：\n\n- `delete.php`\n- `edit.php`\n- `index.php`\n- `list.php`\n\
  - `save.php`\n\n4. 将这些文件复制到 `view/schoolclass` 和 `view/student` 文件夹中。\n\n5. 现在，您可以从项目根目录中删除所有这些文件，但\
  \ `index.php` 文件除外。`index.php` 文件是应用程序的入口点，并将充当其他文件的协调器。`index.php` 文件类似于房子的前门。您需要进入房子才能访问房间。同样，用户在访问其他\
  \ PHP 文件之前必须使用 `index.php`。\n\n6. 将此 index.php 文件的内容替换为以下源代码：\n\n### index.php\n\
  \n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>School\
  \ Management</title>\n</head>\n<body>\n<h1>School Management</h1>\n<ul>\n<li><a\
  \ href=\"view/schoolclass\">School classes\n </a></li>\n<li><a href=\"view/student\"\
  >Students</a></li>\n</ul>\n</body>\n</html>\n```\n\n正如您所见，主页是一个带有两个注册链接的静态页面。此时，index.php\
  \ 文件纯粹用于展示。现在，我们将重构其他展示文件。让我们从我们在 school1 项目中实现的用例开始，即管理学校班级。\n\n我们需要更改 view/schoolclass\
  \ 和 view/student 文件夹内文件中导入 autoload.php 文件的路径。由于这些文件夹内的文件之前位于应用程序根目录，因此路径现在不正确。从现在起，view/schoolclass\
  \ 和 view/student 文件夹内所有导入 autoload.php 的文件必须在开头包含以下一行：\n\n```\nrequire realpath(\
  \ __DIR__ . '/../../../vendor' ) . '/autoload.php';\n```\n\n如果不做此更改，您不会对与该路径相关的错误感到惊讶。提供了完整的源代码，但编写代码而不是复制粘贴是一种良好的实践。当您输入时，可能会犯错并需要检查您输入的代码以避免错误。此过程有助于消化内容。了解自己在做什么非常重要；否则，您将只是一个“代码操作员”。\n\
  \n这些初步步骤让我们了解了新项目结构的大致轮廓。我们有两个注册，一个用于学校班级，另一个用于学生。让我们先从重构从 school1 项目继承的学校班级代码开始。请记住，测试类保持在同一位置。\n\
  \n\n\n\n\n### 运行 SchoolClassTest->testListing 测试\n\n现在我们已经实现了用例，让我们运行第一个测试。\n\n\
  我们将创建一个测试，以检查学校班级列表是否成功生成。此测试将由 SchoolClassTest->testListing 方法实现：\n\n- 1. SchoolClassTest->testListing\
  \ 方法如下所示：\n\n```\npublic function testListing()\n{\n    $rows = SchoolClassTable::getInstance()->getAll();\n\
  \    $this->assertIsIterable($rows);\n}\n```\n\n当然，这个测试会失败，因为 SchoolClassTable 类尚不存在。这个类是使用\
  \ laminas-db 实现的表数据网关模式。SchoolClassTable 实例不是直接通过 new 运算符创建的，而是由 **单例模式** 的实现提供，该模式限制了类的实例数量。当你知道特定上下文中只需要一个类的实例，并且不希望开发人员在实现新功能或修复\
  \ bug 后意外创建另一个实例时，这种模式非常有用。**单例模式** 需要一个私有构造函数、一个用于单一实例的静态属性，以及一个用于创建和恢复此实例的静态方法。SchoolClassTable\
  \ 类必须保留在 src 文件夹中。\n\n### 注意\n从现在起，我们不会再讨论已经知道的事情，例如使用 Eclipse 创建类。\n\n- 2. 在 src\
  \ 文件夹中创建 SchoolClassTable 类，始终使用 School 命名空间。此类需要一个学校班级数据表网关的实例。因此，我们将为 SchoolClassTable\
  \ 实现一个 $instance 属性，如下所示：\n\n```\nprivate static ?SchoolClassTable $instance = null;\n\
  ```\n\n$instance 属性类型前的问号允许我们将其初始化为 null。我们会推迟对象创建，直到需要它时才创建。\n\n- 3. SchoolClassTable\
  \ 的构造函数如下所示：\n\n```\nprivate function __construct(TableGatewayInterface\n    $tableGateway)\n\
  {\n    $this->tableGateway = $tableGateway;\n}\n```\n\n请注意，我们正在将 TableGatewayInterface\
  \ 的实例注入到 $this->tableGateway 属性中。TableGatewayInterface 是表数据网关实现的接口。在依赖注入上下文中，使用接口而不是类是良好的做法，因为这使得替换实现变得容易。我们将在这里使用\
  \ Laminas 的表数据网关实现，但接口允许你在不更改 SchoolClassTable 类的情况下将实现更改为其他实现。变化是不可避免的；但是，我们可以减少更改的数量和重写代码的需求。\n\
  \n- 4. 最后，为了完成 **单例模式**，我们将有一个 SchoolClassTable::getInstance 方法：\n\n```\npublic\
  \ static function getInstance() :\nSchoolClassTable\n{\n    if (null == self::$instance)\
  \ {\n        $adapter = self::getAdapter();\n        $resultSetPrototype = new ResultSet();\n\
  \        $resultSetPrototype->setArrayObjectPrototype\n        (new SchoolClass());\n\
  \        $tableGateway = new TableGateway('classes',\n        $adapter, null, $resultSetPrototype);\n\
  \        self::$instance = new\n        SchoolClassTable($tableGateway);\n    }\n\
  \    return self::$instance;\n}\n```\n\nlaminas-db 的 TableGateway 类需要注入 AdapterInterface\
  \ 实例。此实例由我们从 school11 项目的旧 SchoolClass 类中带来的 SchoolClassTable::getAdapter 方法提供。\n\
  \n请注意，虽然我们使用的是 laminas-db 的数据库适配器实现，但你可以将其替换为任何实现 AdapterInterface 的东西。这是 Laminas\
  \ 的一个基本特性：你可以用兼容的其他组件替换大多数组件，或者编写自己的组件。你有将任务委托给现成组件的便捷选项，但你也有通过实现自定义代码来完全控制的权力。当然，你可以在开源软件中始终编写自己的代码，但在现实中，将你的组件连接到现有组件有时是困难的。\n\
  \n你可能对 TableGateway 构造函数的第四个参数感到好奇：\n\n```\n$tableGateway = new TableGateway('classes',\
  \ $adapter, null, $resultSetPrototype);\n```\n\n第一个参数是表名。第二个参数是数据库适配器对象。第三个参数是可选的，允许我们注入扩展表网关功能的对象。第四个参数也是可选的，但如果提供，允许我们将结果集的元素封装为模型类的实例。通常，由\
  \ TableGateway 执行的 SQL SELECT 语句的返回值将是 ArrayObject（PHP 原生类）的集合。但 ResultSet 类通过 setArrayObjectPrototype\
  \ 方法，允许我们定义结果集的类型。在此示例中，我们定义了由 SchoolClassTable 进行的查询将返回 SchoolClass 实例的集合。\n\n\
  没错，到此为止，我们已经解决了 SchoolClassTable 缺失的问题。但是 SchoolClassTest->testListing 测试仍然失败。此故障发生是因为测试期望\
  \ SchoolClassTable 实例具有 getAll 方法。此时，我们将避免重复工作。既然两个用例有相似之处，你是否同意它们共享公共代码？getAll\
  \ 方法就是一个示例。StudentTable 类（我们需要为管理学生用例实现）也需要 getAll 方法。\n\n当一个或多个类有重复代码时，是时候创建一个封装公共代码的父类了。\n\
  \n- 5. 因此，我们将在 src 文件夹中创建一个 AbstractTable 类。此类必须按如下方式实现 getAll 方法：\n\n```\npublic\
  \ function getAll() : iterable\n{\n    return $this->tableGateway->select(null);\n\
  }\n```\n\n这是面向对象的梦想：只有一行代码。该方法包含完全的外包。这是什么意思？getAll 方法本身不做任何事情。getAll 方法必须调用另一个方法。我们不亲自编写\
  \ SQL SELECT 语句，而是让 TableGateway 实例通过其 select 方法来编写它。我们不需要编写 SQL SELECT 语句或担心引号。\n\
  \nAbstractTable 将保留我们项目中表数据网关实现的公共代码；AbstractTable 还声明了 TableGateway 实例的属性：\n\n\
  ```\nprotected TableGatewayInterface $tableGateway;\n```\n\n这是一个受保护的属性，因为它只对 AbstractTable\
  \ 的子类可见，子类将处理它。\n\n我们已经确定 `SchoolClassTable` 必须扩展 `AbstractTable`，并且数据库适配器创建是两个表数据网关实现的公共功能，因此静态\
  \ `getAdapter` 方法必须位于 `AbstractTable` 类中。\n\n现在，`SchoolClassTest->testListing` 方法将成功运行。但是，其他测试方法将失败。当然，我们也需要重构它们。\n\
  \n- 6. 让我们重构 `SchoolClassTest->testInserting` 方法。此测试方法涵盖插入、选择和删除操作。我们插入一条记录，检索它，然后删除它：\n\
  \n```\npublic function testInserting()\n{\n    $schoolClassTable = SchoolClassTable::\n\
  \        getInstance();\n\n    $schoolClass = new SchoolClass(0, '1st year');\n\
  \    $schoolClassTable->save($schoolClass);\n\n    $schoolClass = SchoolClassTable::getInstance()\n\
  \        ->getByField('name', '1st year');\n    $this->assertEquals('1st year',\n\
  \        $schoolClass->name);\n    $code = $schoolClass->code;\n    $schoolClass\
  \ = SchoolClassTable::\n        getInstance()->getByField('code', $code);\n    $this->assertEquals('1st\
  \ year',\n        $schoolClass->name);\n    $schoolClassTable->delete($schoolClass->code);\n\
  \    $schoolClass = SchoolClassTable::\n        getInstance()->getByField('code',\
  \ $code);\n    $this->assertEmpty($schoolClass->name);\n}\n```\n\n如果你现在尝试运行 `SchoolClassTest`\
  \ 测试用例，它将失败，因为 `SchoolClassTable` 类没有 `getByField` 方法。此方法将替换 `school1` 项目中旧 `SchoolClass`\
  \ 类的 `getByCode` 和 `getByName` 方法。\n\n\n\n\n\n\n- 7. 不过，getByField 方法可以由 AbstractTable\
  \ 类实现，因为它是通用的：\n\n```php\npublic function getByField(string $field, $value) : AbstractModel\n\
  {\n\t$where = [\n\t\t$field => $value\n\t];\n\t$rowSet = $this->tableGateway->select($where);\n\
  \tif ($rowSet->count() == 0) {\n\t\t$modelName = $this->modelName;\n\t\treturn new\
  \ $modelName();\n\t}\n\treturn $rowSet->current();\n}\n```\n\ngetByField 方法允许搜索任何字段。如您所见，如果未找到记录，该方法将返回由\
  \ $this->modelName 属性定义的类的一个实例。在 SchoolClassTable 类中，此属性声明如下：\n\n```php\nprotected\
  \ string $modelName = 'School\\\\SchoolClass';\n```\n\n此属性允许 AbstractTable 的每个子类告知其模型类，并确保该方法将返回一个\
  \ AbstractModel 的实例。\n\n等一下！AbstractModel 是什么？它是我们模型的泛化。它实现了两个通用方法，一个用于数据输入 exchangeArray，另一个用于数据输出\
  \ toArray。\n\n### AbstractModel.php\n\n```php\n<?php\ndeclare(strict_types = 1);\n\
  namespace School;\n\nabstract class AbstractModel\n{\n\n\tpublic function exchangeArray($data)\n\
  \t{\n\t\t$attributes = get_object_vars($this);\n\t\tforeach ($attributes as $attribute\
  \ => $value) {\n\t\t\t$this->$attribute = (is_int($this->$attribute) ?\n\t\t\t\t\
  (int) $data[$attribute] : $data[$attribute]);\n\t\t}\n\t}\n\n\tpublic function toArray()\n\
  \t{\n\t\treturn get_object_vars($this);\n\t}\n}\n```\n\nexchangeArray 方法接收一个数据数组并将值放入相应的属性中。而\
  \ toArray 方法则返回一个包含属性值的数组。\n\n现在测试能成功运行吗？当然不能！\n\n- 8. 我们必须在 AbstractTable 类中实现\
  \ save 方法：\n\n```php\npublic function save(AbstractModel $model): bool\n{\n    $set\
  \ = $model->toArray();\n    $keyName = $this->keyName;\n    try {\n        if (empty($model->$keyName))\
  \ {\n            unset($set[$keyName]);\n            $this->tableGateway->insert($set);\n\
  \        } else {\n            $this->tableGateway->update($set, [\n           \
  \     $keyName => $set[$keyName]\n            ]);\n        }\n    } catch (\\Exception\
  \ $e) {\n        error_log($e->getMessage());\n        return false;\n    }\n  \
  \  return true;\n}\n```\n\nsave 方法将艰苦的工作委托给 TableGateway 的 insert 和 update 方法。逻辑与\
  \ school1 项目中原先的 SchoolClass 类相同：在插入和更新之间的选择取决于表生成的主键的值。请注意，主键字段的名称由 $this->keyName\
  \ 属性给出。该属性必须由 AbstractTable 类声明，如下所示：\n\n```php\nprotected string $keyName;\n```\n\
  \n- 9. SchoolClassTest 测试用例暂时无法运行，因为我们必须在 AbstractTable 类中实现 delete 方法：\n\n```php\n\
  public function delete($value) : bool\n{\n    try {\n        $this->tableGateway->delete([\n\
  \            $this->keyName => $value\n        ]);\n    } catch (\\Exception $e)\
  \ {\n        error_log($e->getMessage());\n        return false;\n    }\n    return\
  \ true;\n}\n```\n\n现在 SchoolClassTest 测试用例能成功运行吗？还不能。\n\n- 10. 您必须先创建 SchoolClass\
  \ 类，如下所示：\n\n### SchoolClass.php\n\n```php\n<?php\ndeclare(strict_types = 1);\n\
  namespace School;\nclass SchoolClass extends AbstractModel\n{\n    public int $code\
  \ = 0;\n    public string $name = '';\n\n    public function __construct(int $code\
  \ = 0, string $name = '')\n    {\n        $this->code = $code;\n        $this->name\
  \ = $name;\n    }\n}\n```\n\n最后，我们可以成功运行 SchoolClassTest 了。现在，我们必须调整存储在 view/schoolclass\
  \ 文件夹中的用户界面文件。为什么需要进行此调整？原因有两个。第一是现在我们将使用 SchoolClassTable::getInstance 返回的对象的 getAll\
  \ 方法。第二是返回集合的元素不是数组，而是对象。\n\n### 调整 CRUD 文件\n\n让我们从列出学校班级的文件开始：\n\n### list.php\n\
  \n```php\n<?php\nuse School\\SchoolClassTable;\n\nrequire realpath(__DIR__ . '/../../../vendor')\
  \ . '/autoload.php';\n\n$baseUrl = '/view/schoolclass/';\n\nforeach(SchoolClassTable::getInstance()->getAll()\
  \ as $row):\n?>\n<tr>\n    <td><a href=\"<?=$baseUrl?>edit.php?code=<?=$row->code?>\"\
  ><?=$row->code?></a></td>\n    <td><?=$row->name?></td>\n    <td><a href=\"<?=$baseUrl?>delete.php?code=<?=$row->code?>\"\
  >Remove</a></td>\n</tr>\n<?php\nendforeach;\n```\n\n请注意，$row 变量是一个对象。如果您记得，在 school1\
  \ 项目的等效文件中，$row 变量是一个数组。现在，表类的记录被映射为 SchoolClass 类的对象。\n\n带有编辑表单的文件也必须进行调整，以使用 SchoolClassTable\
  \ 和对象属性，而不是数组元素：\n\n### edit.php\n\n```php\n<?php\nuse School\\SchoolClassTable;\n\
  require realpath(__DIR__ . '/../../../vendor') . '/autoload.php';\n\n$code = $_GET['code']\
  \ ?? null;\n$schoolClass = SchoolClassTable::getInstance()->getByField('code', $code);\n\
  ?>\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<title>Classes Registration</title>\n\
  </head>\n<body>\n<h1>Classes Registration</h1>\n<form action=\"save.php\" method=\"\
  post\">\nName: <input type=\"text\" name=\"name\" autofocus=\"autofocus\" value=\"\
  <?=$schoolClass->name?>\"><br/>\n<input type=\"hidden\" name=\"code\" value=\"<?=$schoolClass->code?>\"\
  ><br/>\n<input type=\"submit\" value=\"save\">\n</form>\n<p>\n<a href=\"index.php\"\
  >Go back</a>\n</p>\n</body>\n</html>\n```\n\nedit.php 文件将数据提交到 save.php，就像 school1\
  \ 项目中的对应文件一样。save.php 文件使用两个类 SchoolClass 和 SchoolClassTable 进行持久化。第一个类包含数据，第二个类包含操作。\n\
  \nsave.php 文件将如下所示：\n\n### save.php\n\n```php\n<?php\nuse School\\\\SchoolClass;\n\
  use School\\\\SchoolClassTable;\nrequire realpath(__DIR__ . '/../../../vendor' .\n\
  \    '/autoload.php');\n$code = (int) ($_POST['code'] ?? 0);\n$name = ($_POST['name']\
  \ ?? '');\n$model = new SchoolClass($code,$name);\n$schoolClassTable = SchoolClassTable::getInstance();\n\
  $schoolClassTable->save($model);\nheader('Location: /view/schoolclass/index.php');\n\
  ```\n\n对象应该帮助我们作为开发者。它们是工具，而不是戒律。当使用对象有帮助时，就使用它。但如果没有理由使用对象，则避免使用。遵循此准则，我们不需要创建对象来删除学校班级记录。\n\
  \n只需传递代码，如 delete.php 文件所示：\n\n### delete.php\n\n```php\n<?php\nuse School\\\\SchoolClassTable;\n\
  require realpath(__DIR__ . '/../../../vendor' .\n    '/autoload.php');\n$code =\
  \ ($_GET['code'] ?? null);\n$schoolClassTable = SchoolClassTable::getInstance();\n\
  $schoolClassTable->delete($code);\nheader('Location: /view/schoolclass/index.php');\n\
  ```\n\n现在，您可以通过 school12 的 Web 界面管理学校班级。但我们承诺这个项目还将实现学生注册。两种注册（学校班级和学生）的实现相似，因此我们只会展示不同的部分。\n\
  \n我们将有一个扩展 AbstractTable 的 StudentTable 类。但与 SchoolClassTable 不同，StudentTable 类重写了\
  \ getByField 和 getAll 方法。这是因为 TableGateway 的默认查询（使用 select 方法制作）只读取一个表，忽略关系。要向 TableGateway\
  \ 执行的 SQL SELECT 添加 INNER JOIN 子句，我们需要使用 Select 类的一个实例：\n\n```php\npublic function\
  \ getAll() : iterable\n{\n    $select = new Select($this->tableGateway->getTable());\n\
  \    $select->join('classes', 'classes.code = students.class_code', [\n        'class_name'\
  \ => 'name'\n    ]);\n    $rowSet = $this->tableGateway->selectWith($select);\n\
  \    return $rowSet;\n}\n```\n\nSelect 类有一个 join 方法，允许设置 INNER JOIN 子句。join 方法的第三个参数允许我们选择表的列并指定数组键的别名。要使用带有\
  \ INNER JOIN 的查询，我们将 Select 对象注入到 TableGateway 的 selectWith 方法中。selectWith 方法返回一个\
  \ ResultSet 对象，就像 select 方法一样。\n\n当我们将 Student 类与 SchoolClass 类进行比较时，Student 类也存在差异。Student\
  \ 类重写了从 AbstractModel 继承的 exchangeArray 和 toArray 方法。\n\n重写 exchangeArray 方法是因为它需要实例化\
  \ SchoolClass 类。一个学生依赖于一个学校班级。这是我们用例的一个约束。我们不能没有学校班级来关联学生。如在 Student->exchangeArray\
  \ 的实现中所见，Student 类有一个 $this->schoolClass 属性：\n\n```php\npublic function exchangeArray($data)\n\
  {\n    $this->id = ((int) $data['ID'] ?? 0);\n    $this->name = ($data['name'] ??\
  \ '');\n    $this->schoolClass = new SchoolClass();\n    $this->schoolClass->code\
  \ = ((int) $data['class_code']\n        ?? 0);\n    $this->schoolClass->name = ($data['class_name']\
  \ ?? '');\n}\n```\n\n\n\n\n`class_name` 字段是 `classes` 表中字段名的别名。我们已在通过 `Select` 类创建的\
  \ `INNER JOIN` 中定义了该别名。\n\n虽然我们在内存中将数据作为对象处理，但需要将数据转换为数组以将其持久化到表中。因此，在 `Student->toArray`\
  \ 方法中，我们将对象替换为主键值：\n\n```\npublic function toArray()\n{\n    $attributes = get_object_vars($this);\n\
  \    $attributes['class_code'] = $attributes['schoolClass']\n        ->code;\n \
  \   unset($attributes['schoolClass']);\n    return $attributes;\n}\n```\n\n要插入新学生，我们需要将其与学校班级关联。这需要在学生的编辑表单中提供学校班级列表。在下面的代码部分，我们可以看到\
  \ `view/student` 的 `edit.php` 文件中创建此列表的部分：\n\n```\n<select name=\"class_code\">\n\
  <?php\n$schoolClasses = SchoolClassTable::getInstance()->getAll();\nforeach($schoolClasses\
  \ as $schoolClass) :\n?>\n<option value=\"<?=$schoolClass->code?>\"\n    <?=($schoolClass->code\
  \ == $Student->schoolClass->code ?\n    'selected=\"selected\"' : '')?>>\n    <?=$schoolClass->name?></option>\n\
  <?php\nendforeach;\n?>\n</select>\n```\n\n这些是学校班级与学生注册之间的主要区别。`school2` 项目完整可用于\
  \ `https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter04/school2`。针对学生注册有一个\
  \ `StudentTest` 测试用例和一个代码覆盖率报告。尝试完整的应用程序并比较两个注册的代码。在 Eclipse 中，您可以通过选择两个文件并单击鼠标右键，然后选择\
  \ **与其他项比较/互相比较** 来比较两个文件。\n\n现在您知道了如何抽象数据库连接以及如何使用 `laminas-db` 创建 ORM。\n\n在下一节中，我们将重新实现学校班级和学生注册，但这次我们将使用\
  \ `laminas-mvc` 组件作为应用程序的容器。\n\n## 将 Laminas 用作容器\n\n当您将 Laminas 用作库时，您的代码会调用 Laminas\
  \ 组件。这就是我们在 `school1` 和 `school2` 项目中所做的。现在，我们将使用 Laminas 作为框架，该框架将调用您的代码。以前，Laminas\
  \ 包含在我们的应用程序中。现在，我们将创建一个将包含在框架中的应用程序。实际上，我们将根据 Laminas 的 MVC 结构重写我们的代码。\n\n由于这是为更复杂和完整的应用程序做准备，我们将仅展示学校班级列表的实现，但请不要担心，因为完整代码可在本节末尾获取。但请尝试在从存储库复制代码之前，先根据说明自行实现代码，以便您可以将自己的预期与提供的代码进行比较。\n\
  \n与之前一样，我们需要通过创建新项目来为实现做准备。让我们来创建吧！\n\n### 创建 school3 项目\n\n要创建 `school3` 项目，请执行以下步骤：\n\
  \n- 1. 创建项目。\n\n  您还记得我们在 Eclipse 工具栏中配置了一个创建 Laminas 项目的选项吗？我们在上一章中完成了此操作。好吧，您可以使用它来创建\
  \ `school3` 项目。\n\n  使用 `File | New | PHP Project` 菜单选项打开项目。\n\n- 2. 将 PHPUnit 作为开发依赖项添加到\
  \ `school3` 项目。\n\n- 3. 不要忘记保存 `composer.json` 文件并单击 **更新依赖项** 按钮。\n\n> **允许插件**\n\
  > \n> 在从骨架创建项目后安装组件时，您可能会被问及 **您是否信任 ‘laminas/laminas-component-installer’ 执行代码并希望立即启用它？**\
  \ 以及 **您是否信任 ‘laminas/laminas-skeleton-installer’ 执行代码并希望立即启用它？**。这些消息与 Composer\
  \ 插件有关。您可以回答 y。\n\n- 4. 安装 PHPUnit 后，右键选择 `school3` 项目并访问 Run As | PHPUnit Test\
  \ 项。您将在 Console 选项卡上看到以下消息：\n\n```\nFatal error: Uncaught Error: Class \"Laminas\\\
  \\Test\\\\PHPUnit\\\\Controller\\\\AbstractHttpControllerTestCase\" not found\n\
  in /opt/lampp/htdocs/school3/module/Application/test/\nController/IndexControllerTest.php:11\n\
  ```\n\n此错误发生是因为 Laminas 骨架项目依赖于 `laminas-test` 组件，这是一个用于 PHPUnit 的扩展，允许我们测试 Laminas\
  \ 控制器。由于您已在 `composer.json` 编辑器中安装了 PHPUnit，请搜索 `laminas/laminas-test` 包并安装它。我们在\
  \ *第 3 章，使用 Laminas 作为库进行测试驱动开发* 中学习了如何安装 Composer 包。\n\n- 5. 现在您可以成功运行测试了。但运行的是哪个测试呢？是\
  \ `module/Application/test/Controller` 文件夹中的 `IndexControllerTest` 类。\n\n> **在 PHP\
  \ 7 中测试 Laminas MVC 时出错**\n> \n> 您可能记得，在 *第 2 章，为我们的电子商务应用程序设置环境* 中，我们展示了 `laminas-mvc`\
  \ 的 PHP 要求。`composer.json` 文件允许 PHP 7。但是，如果在 PHP 7 下运行 `IndexControllerTest`，则 `testIndexActionViewModelTemplateRenderedWithinLayout`\
  \ 测试方法会出现错误。事实上，错误是因为 `$this->assertQuery` 方法依赖于仅从 PHP 8 开始可用的联合类型。您可以将 `$this->assertQuery`\
  \ 替换为其他断言方法，并在 PHP 7 下继续使用 `laminas-test`，但最好将 PHP 升级到 8 版本。但是，如果出于某些原因必须使用 PHP\
  \ 7，则删除 `testIndexActionViewModelTemplateRenderedWithinLayout` 方法。\n\n既然我们已运行测试，现在将创建一个新模块。\n\
  \n### 创建 School 模块\n\nLaminas MVC 应用程序被组织为一组模块。Laminas 中的模块是最大的复用单元。模块是自包含的。它有自己的配置和自己的\
  \ MVC 实现。要使用 `laminas-mvc` 实现我们的学校班级注册，我们将创建另一个名为 `School` 的模块。Laminas 模块位于 `modules`\
  \ 文件夹中。有一个名为 `Application` 的默认模块。`Application` 模块包含您在上一章中查看的示例主页。\n\n我们将使用 `Application`\
  \ 模块作为新模块的模型：\n\n- 1. 将 `modules` 文件夹中的 `Application` 文件夹复制到同一 `modules` 文件夹中的 `School`。\n\
  \nLaminas 中模块的命名空间就是模块的名称。因此，Application 模块的命名空间是 Application，那么 School 模块的命名空间必须是\
  \ School。在重建实现时，我们将更改每个文件的命名空间。让我们从模块的最小代码开始。\n\n- 2. 在 modules.config.php 文件中注册模块。\n\
  \nmodules.config.php 文件位于项目根目录的 config 文件夹中。此文件包含以 PHP 数组形式列出的启用模块列表。列表之外的模块会被忽略，就好像它们不存在一样。这使得通过从\
  \ modules.config.php 中删除模块来禁用模块变得容易。您可以看到 Application 是最后一项。这不是随机的。最后一个模块是决定布局的模块。布局是视觉元素的排列。对于\
  \ Web 应用程序，布局是使用层叠样式表 (CSS) 定义的。我们的新模块 School 没有布局，因此不能是最后一个。\n\n- 3. 将 School 作为\
  \ Application 之前的一项添加。\n\nmodules.config.php 中列出的模块会被查找。但是，只有当模块具有自动加载配置时，才会找到它们。您应该记得我们已为\
  \ school1 项目通过 Eclipse 配置了自动加载。您可以使用相同的功能来配置 school3 的 composer.json。\n\n- 4. 在\
  \ Composer 代码编辑器中选择 Autoload 选项卡。您将看到 Application 模块已有一个 PSR-4 配置。您必须添加一个带有以下参数的新自动加载配置：\n\
  \n  - * **Namespace:** `School\\\\`\n  - * **Paths:** `module/School/src/`\n\n我们还必须为测试类添加一个\
  \ PSR-4 自动加载配置。\n\n- 5. 选择 Autoload-dev 选项卡。添加一个带有以下参数的配置：\n\n  - * **Namespace:**\
  \ `SchoolTest\\\\`\n  - * **Paths:** `module/School/test/`\n\n- 6. 保存 composer.json\
  \ 文件并单击 **更新依赖项（包括 require-dev）** 按钮。\n\n> **直接编辑 composer.json**\n> \n> 我们使用特定表单所做的每项更改也可以直接进行。您可以单击\
  \ composer.json 视图底部的 **composer.json** 选项卡。编辑器将文件作为文本文件打开。您可以看到其他选项卡所做的更改，也可以直接进行更改。\n\
  \n\n\n\n\n现在可以找到 `School` 模块了。但它还无法正常工作。我们必须确保 `School` 模块内的每个文件都有正确的命名空间。\n\n###\
  \ 确保模块具有正确的命名空间\n\n确保模块具有正确命名空间的过程涉及某些步骤。让我们按以下步骤开始：\n\n- 1. 创建一个测试类。由于我们将 `Application`\
  \ 模块复制为 `School` 模块，因此在 `module/School/test/Controller` 文件夹中有一个 `IndexControllerTest.php`\
  \ 文件。删除此文件，并在同一文件夹中创建一个名为 `SchoolClassControllerTest.php` 的新文件。\n\n此新文件必须包含一个扩展\
  \ `AbstractHttpControllerTestCase` 的 `SchoolClassControllerTest` 类，后者是 `laminas-test`\
  \ 组件的一部分。它提供了用于测试 `laminas-mvc` 控制层的断言方法。这是我们以前项目中缺少的东西。你应该记得，我们测试过模型类，但请求取决于我们与网页浏览器的交互。现在我们可以在不使用网页浏览器或手动发送\
  \ HTTP 请求的情况下覆盖这部分内容。\n\n`SchoolClassControllerTest` 类的命名空间是 `SchoolTest`，正如我们在\
  \ `composer.json` 中配置的那样。\n\n- 2. 实现 `setUp` 方法以加载应用程序配置：\n\n```php\npublic function\
  \ setUp() : void\n{\n    $this->setApplicationConfig(\n        include __DIR__ .\
  \ '/../../../../config/application.config.php'\n    );\n\n    parent::setUp();\n\
  }\n```\n\n此 `setUp` 方法创建一个作为应用程序容器的对象。我们将在下一章详细了解它。目前，假设你可以访问测试所需的所有应用程序资源。\n\n\
  ### 实现测试方法\n\n现在，我们可以按照以下步骤开始实现测试方法：\n\n- 1. 创建一个方法来测试学校类列表，testListing：\n\n```php\n\
  public function testListing() : void\n{\n    $this->dispatch('/schoolclass', 'GET');\n\
  \    $this->assertResponseStatusCode(200);\n    $this->assertCommonRules();\n}\n\
  ```\n\ntestListing 方法模拟对端点 `/schoolclass` 的 HTTP 请求，并期望得到状态码为 200 的 HTTP 响应。\n\n\
  没错，但是 `$this->assertCommonRules` 方法的调用怎么办？嗯，我们已经在这里推进了。事实是，SchoolClassControllerTest\
  \ 的测试方法有共同的断言，因为它们向同一个控制器类发送请求。\n\n- 2. 与其重复相同的行，不如将它们封装到一个私有方法中：\n\n```php\nprivate\
  \ function assertCommonRules() : void\n{\n    $this->assertModuleName('school');\n\
  \    $this->assertControllerName('schoolclass');\n    // as specified in router's\
  \ controller name alias\n    $this->assertControllerClass('SchoolClassController');\n\
  \    $this->assertMatchedRouteName('schoolclass');\n}\n```\n\nassertCommonRules\
  \ 方法具有以下断言：\n\n- `$this->assertModuleName`: 检查模块 - 参数值将按照 CamelCase 规范进行转换。这是什么意思？值\
  \ school 将转换为 School，首字母大写，即实际的模块名。\n- `$this->assertControllerName`: 检查控制器名称的别名——这将在后面看到。\n\
  - `$this->assertControllerClass`: 检查控制器类的名称（不含命名空间）。\n- `$this->assertMatchedRouteName`:\
  \ 检查 URL 请求的模式是否匹配已配置的路由。\n\n- 3. 自第 2 章“为我们的电子商务应用程序设置环境”以来我们一直使用的 Laminas 应用程序骨架，为\
  \ PHPUnit 提供了一个模板文件 `phpunit.xml.dist`。将其复制为 `phpunit.xml`。你可以看到，测试套件配置为仅运行 Application\
  \ 模块的测试：\n\n```xml\n<testsuite name=\"Laminas MVC Skeleton Test Suite\">\n    <directory>./module/Application/test</directory>\n\
  </testsuite>\n```\n\n- 4. 修改前面的代码片段以运行任何模块的测试：\n\n```xml\n<testsuite name=\"Laminas\
  \ MVC Skeleton Test Suite\">\n    <directory>./module/*/test</directory>\n</testsuite>\n\
  ```\n\n太棒了！当我们有一个失败的测试时，就可以迈出 TDD 的第一步，即红色步骤。\n\n### 运行测试\n\n按照以下步骤运行测试：\n\n- 1.\
  \ 选择 `school3` 项目，然后单击 **运行方式 | PHPUnit 单元测试** 选项。\n\n当然，测试会失败，因为 `SchoolClassController`\
  \ 不存在。\n\n- 2. 创建 `SchoolClassController` 来管理学校类列表的生成。此类的文件必须创建在 module/SchoolClass/src/Controller\
  \ 文件夹中。事实上，Laminas 中模块的所有类都位于 `src` 文件夹，所有控制器类都位于 `src/Controller` 文件夹。此类需要两个方法：一个用于注入表数据网关的构造函数，以及一个用于调用表数据网关的方法：\n\
  \n### SchoolClassController.php\n\n```php\n<?php\ndeclare(strict_types = 1);\nnamespace\
  \ School\\Controller;\n\nuse School\\Model\\SchoolClassTable;\nuse Laminas\\Mvc\\\
  Controller\\AbstractActionController;\nuse Laminas\\View\\Model\\ViewModel;\n\n\
  class SchoolClassController extends AbstractActionController\n{\n    private ?SchoolClassTable\
  \ $schoolClassTable = null;\n\n    public function __construct(SchoolClassTable\
  \ $schoolClassTable)\n    {\n        $this->schoolClassTable = $schoolClassTable;\n\
  \    }\n\n    public function indexAction()\n    {\n        $schoolClasses = $this->schoolClassTable->getAll();\n\
  \        return new ViewModel([\n            'schoolClasses' => $schoolClasses\n\
  \        ]);\n    }\n}\n```\n\n正如我们所见，构造函数接收一个 `SchoolClassTable` 实例并将其赋值给 `$this->schoolClassTable`\
  \ 属性。`indexAction` 方法使用该属性获取学校类列表，并通过 `ViewModel` 类将其传递到视图层。\n\n如果你不需要 PHP 7 兼容性，可以找到以下内容：\n\
  \n```php\nprivate ?SchoolClassTable $schoolClassTable = null;\n\npublic function\
  \ __construct(SchoolClassTable $schoolClassTable)\n{\n    $this->schoolClassTable\
  \ = $schoolClassTable;\n}\n```\n\n将其替换为：\n\n```php\npublic function __construct(private\
  \ SchoolClassTable $schoolClassTable)\n{\n}\n```\n\n这是从 PHP 8 开始可能的。\n\n- 3. 创建一个\
  \ Model 文件夹。将目标中的命名空间更改为 School\\Model。\n\n没错，但 SchoolClassTable 类从哪里来？我们已经创建过它了！\n\
  \n- 4. 将 school2 项目 src 文件夹中的所有文件复制到 module/School/src/Model 文件夹。\n\n现在，模型层的大部分代码已经准备就绪。但是，我们需要更改一些行。让我们回到控制器类来理解这一点。\n\
  \n正如你在上一段源代码中看到的，SchoolClassController 类接收一个 SchoolClassTable 实例。但谁来注入这个实例？不是你，因为\
  \ MVC Laminas 应用程序中的控制器不是直接实例化的。你需要使用一个工厂类。\n\n- 5. 在 School 模块的 src/Controller\
  \ 文件夹中创建一个名为 SchoolClassControllerFactory 的工厂类：\n\n### SchoolClassControllerFactory.php\n\
  \n```php\n<?php\nnamespace School\\Controller;\n\nuse Interop\\Container\\ContainerInterface;\n\
  use Laminas\\ServiceManager\\Factory\\FactoryInterface;\n\nclass SchoolClassControllerFactory\
  \ implements FactoryInterface\n{\n    public function __invoke(ContainerInterface\
  \ $container, $requestedName, ?array $options = null)\n    {\n        $schoolClassTable\
  \ = $container->get('SchoolClassTable');\n\n        return new SchoolClassController($schoolClassTable);\n\
  \    }\n}\n```\n\nSchoolClassControllerFactory 类使用依赖注入容器来检索 SchoolClassTable 的实例。事实上，$container\
  \ 对象的 get 方法使用一个键来定位 SchoolClassTable 的工厂。这个键将我们引导到一个名为 SchoolClassTableFactory\
  \ 的类。\n\n- 6. 使用以下源代码创建一个 SchoolClassTableFactory 类：\n\n### SchoolClassTableFactory.php\n\
  \n```php\n<?php\ndeclare(strict_types = 1);\nnamespace School\\Model;\n\nuse Laminas\\\
  Db\\TableGateway\\TableGateway;\nuse Laminas\\Db\\TableGateway\\TableGatewayInterface;\n\
  use Laminas\\Db\\ResultSet\\ResultSet;\nuse Laminas\\ServiceManager\\Factory\\FactoryInterface;\n\
  use Interop\\Container\\ContainerInterface;\n\nclass SchoolClassTableFactory implements\
  \ FactoryInterface\n{\n    public function __invoke(ContainerInterface $container,\
  \ $requestedName, ?array $options = null)\n    {\n        $adapter = $container->get('DbAdapter');\n\
  \        $resultSetPrototype = new ResultSet();\n        $resultSetPrototype->setArrayObjectPrototype(new\
  \ SchoolClass());\n        $tableGateway = new TableGateway('classes', $adapter,\
  \ null, $resultSetPrototype);\n        return new SchoolClassTable($tableGateway);\n\
  \    }\n}\n```\n\n你可能会说：“我在哪里见过这个……”你说得对。这段代码是 SchoolClassTable 的静态 getInstance\
  \ 方法的内容。因此，SchoolClassTable 不再需要这个方法，因为创建实例的责任已交给工厂类。\n\n\n\n\n\n- 7. 删除 SchoolClassTable\
  \ 的 getInstance 方法，并将该类的构造函数改为 public。这意味着你需要找到以下行：\n\n```\nprivate function __construct\
  \ (TableGatewayInterface\n$tableGateway)\n```\n\n将其替换为以下行：\n\n```\npublic function\
  \ __construct (TableGatewayInterface\n$tableGateway)\n```\n\n控制器工厂类依赖于特定配置来查找数据表网关工厂类。\n\
  \n$container 对象的 get 方法使用的键是一个别名。此别名必须在配置文件中定义。由于我们在 School 模块中使用 SchoolClassTable，我们将在\
  \ School 模块的 module.config.php 文件中定义此配置。此文件位于模块的 config 文件夹中，这很合理。\n\n- 8. 将 module.config.php\
  \ 的命名空间改为 School。此文件实际上是带有模块配置的 PHP 数组。你将找到一个名为 controllers 的键，如下所示：\n\n```\n'controllers'\
  \ => [\n    'factories' => [\n        Controller\\IndexController::class =>\n  \
  \          InvokableFactory::class,\n    ],\n],\n```\n\n此代码片段显示 IndexController\
  \ 类与 InvokableFactory 类相关联。InvokableFactory 是 laminas-mvc 提供的控制器工厂。此基本工厂在不进行依赖注入的情况下创建关联类的实例。我们不使用\
  \ IndexController。\n\n- 9. 从 src/Controller 文件夹中删除 IndexController.php 文件。必须按如下更改上述代码片段：\n\
  \n```\n'controllers' => [\n    'aliases' => [\n        'schoolclass' => Controller\\\
  \n            SchoolClassController::class\n    ],\n    'factories' => [\n     \
  \   Controller\\SchoolClassController::class =>\nController\\SchoolClassControllerFactory::class\n\
  ],\n],\n```\n\n是的，除了更改 factories 中的关联外，我们还添加了将 \"schoolclass\" 字符串与 SchoolClassController\
  \ 关联的键别名。此关联起什么作用？它有助于将路由与实际控制器名称解耦。\n\n- 10. 更改 router 键内部的 routes 键。删除 router\
  \ 的当前值，并将其替换为以下内容：\n\n```\n'routes' => [\n    'schoolclass' => [\n        'type'\
  \ => Segment::class,\n        'options' => [\n            'route' => '/schoolclass[/:action'\n\
  \            [/:code]]',\n            'defaults' => [\n                'controller'\
  \ => 'schoolclass',\n                'action' => 'index',\n            ],\n    \
  \    ],\n    ],\n],\n],\n```\n\n路由是 URL 模式与控制器类之间的关联。laminas-router 组件中有几种可用的路由类型。在此示例中，我们使用允许参数的\
  \ Segment 路由。在 '/schoolclass[/:action[/:code]]' 模式中，括号之间的部分是可选的，冒号后面的单词是参数。defaults\
  \ 键定义省略参数的假设值。请注意，我们为 controller 和 action 定义了默认值。controller 键的值是 SchoolClassController\
  \ 的别名。\n\n你可能忘了，但别名的值是传递给 SchoolClassControllerTest 的 $this->assertControllerName\
  \ 方法的值。事实上，你可以使用别名或类的完整名称。\n\n现在可以成功运行测试用例了吗？嗯，测试仍然会失败，因为我们需要配置 SchoolClassTable\
  \ 的别名。\n\n- 11. 通过向 module.config.php 的数组中添加 service_manager 键来配置别名。此键位于以下数组的第一级：\n\
  \n```\n'service_manager' => [\n    'factories' => [\n        'SchoolClassTable'\
  \ => Model \\\n            SchoolClassTableFactory::class\n    ]\n],\n```\n\n依赖注入容器将使用\
  \ factories 内部定义的键来调用声明为值的工厂。\n\n现在可以运行测试了吗？不行。\n\n- 12. 将 School/src 文件夹中 Module\
  \ 类的命名空间改为 School。Module 类加载 module.config.php 文件，因此如果找不到，模块配置将被忽略。\n\n做出此更改后，我们可以运行测试了，对吗？不，因为我们需要配置数据库连接。保持冷静并进行配置。我们将继续使用\
  \ school 数据库，即 school11 和 school12 项目使用的同一数据库。\n\n- 13. 安装 laminas-db。幸运的是，你知道如何操作。但这次，由于你在带有\
  \ laminas-mvc 的项目中安装 laminas-db，你将在 Console 选项卡中看到以下提示：\n\n```\nPlease select which\
  \ config file you wish to inject\n'Laminas\\Db' into:\n[0] Do not inject\n[1] config/modules.config.php\n\
  [2] config/development.config.php.dist\nMake your selection (default is 1)\n```\n\
  \n这允许你（选择性地）将 laminas-db 注入到应用程序中作为模块。如前所述，Laminas 中的模块是最大的复用单元。你可以仅为开发环境注入组件（选项\
  \ 2）。但我们将 laminas-db 注入为生产环境的组件，因此请选择选项 1。\n\n- 14. Composer 接下来会询问以下内容：\n\n```\n\
  Remember this option for other packages of the same type?\n(Y/n)\n```\n\n回答 Y，以便避免在接下来安装的\
  \ Laminas 组件中再次出现上述提示。请记住，laminas-db 需要连接参数。根据 Laminas 的最佳实践，我们必须将全局配置（适用于任何环境）与本地配置（适用于特定环境）分开。\n\
  \n- 15. 将全局配置放在项目根目录下 config/autoload 文件夹中的 global.php 文件中。school 项目的内容必须如下：\n\n\
  ### global.php\n\n```\n<?php\n\nuse Laminas\\Db\\Adapter\\AdapterServiceFactory;\n\
  return [\n    'db' => [\n        'driver' => 'Pdo_Mysql',\n        'database' =>\
  \ 'school'\n    ],\n    'service_manager' => [\n        'factories' => [\n     \
  \       'DbAdapter' => AdapterServiceFactory::class\n        ]\n    ]\n];\n```\n\
  \n与之前项目的数据库配置不同之处在于使用了 AdapterServiceFactory，其昵称为 DbAdapter。此类使用 db 键的数据来创建我们老朋友\
  \ Adapter 类的一个实例。对吧，但其他参数呢？嗯，其他参数可能因环境而异。因此，我们必须将它们放入 local.php 文件。虽然 global.php\
  \ 对所有环境都相同，但每个环境都有不同的 local.php。因此，local.php 文件不得成为版本控制的一部分。骨架附带一个名为 local.php.dist\
  \ 的模板。\n\n- 16. 从 `config/autoload` 文件夹复制 `local.php.dist` 到同一文件夹中的 `local.php`，并用以下代码填充：\n\
  \n### local.php\n\n```\n<?php\nreturn [\n    'db' => [\n        'hostname' => 'localhost',\n\
  \        'username' => 'root',\n        'password' => ''\n    ]\n];\n```\n\n我们已拥有所有必要数据。你一定很想知道测试现在是否能成功运行。\n\
  \n- 17. 运行测试：\n\n```\n1) SchoolTest\\\\Controller\\\\SchoolClassControllerTest::testListing\n\
  Failed asserting response code \"200\", actual status code is \"500\"\n\nExceptions\
  \ raised:\nException 'Laminas\\\\View\\\\Exception\\\\RuntimeException' with message\
  \ 'Laminas\\\\View\\\\Renderer\\\\PhpRenderer::render: Unable to render template\
  \ \"school/school-class/index\"; resolver could not resolve to a file' in /opt/lampp/htdocs/school3/vendor/laminas/laminas-view/src/Renderer/PhpRenderer.php:492\n\
  ```\n\n运行时，你会收到上述错误消息。此消息出现的原因是控制器操作没有对应的视图。\n\n请注意，错误消息明确指出应用程序期望 `school/school-class/index`\
  \ 模板。Laminas 控制器层和视图层之间存在一种约定。从路由接收 HTTP 请求的控制器方法带有 `Action` 后缀。当 `Action` 方法结束并返回\
  \ `ViewModel` 对象时，框架会查找与方法名相同但不带 `Action` 后缀的文件。因此，`indexAction` 方法对应名为 `index`\
  \ 的文件。视图文件的默认扩展名是 `.phtml`。\n\n\n\n\n\n- 18. 在 School 模块的 view/school/school-class\
  \ 文件夹中创建 index.phtml 文件。\n\nview 文件夹有一个 application 子文件夹，它是从 Application 模块复制的文件夹副本。\n\
  \n- 19. 删除这个子文件夹，因为它对 School 模块没有用。\n\n- 20. 在 view 文件夹内创建 school 文件夹，并在 school\
  \ 文件夹内创建 school-class 文件夹。\n\nview 下的第一级文件夹与控制器类相关。第二级与控制器操作相关。view 文件夹内文件夹和文件的名称必须使用小写。当类或方法的名称由多个名称组成时，相关文件夹和文件名必须用连字符分隔。\n\
  \n- 21. 在 school-class 文件夹内创建 index.phtml 文件，如下所示：\n\n### index.phtml\n\n```\n<h1>Classes\
  \ Registration</h1>\n<p>\n <a href=\"<?=$this->url ('schoolclass',\n ['action' =>\
  \ 'edit']) ?>\">Add a new class</a>\n</p>\n<table>\n <thead>\n <tr>\n <th>code</th>\n\
  \ <th>name</th>\n </tr>\n </thead>\n <tbody>\n <?php\n foreach($this->schoolClasses\
  \ as $row):\n ?>\n <tr>\n <td><a href=\"<?=$this->url\n ('schoolclass',['action'\
  \ => 'edit', 'code'\n => $row->id]) ?>\"><?=$row->code?></a></td>\n <td><?=$row->name?></td>\n\
  \ <td><a href=\"<?=$this->url('schoolclass',\n ['action' => 'delete', 'code' =>\
  \ $row->code]) ?>\">Remove</a></td>\n </tr>\n <?php\n endforeach;\n ?>\n </tbody>\n\
  \ </table>\n <p><a href=\"<?=$this->url('home') ?>\">Homepage</a></p>\n```\n\n$this->schoolClasses\
  \ 属性是由 SchoolClassController 的 indexAction 方法通过 ViewModel 类定义的。这个文件的真正区别在于使用了 $this->url\
  \ 方法。该方法从某些 module.config.php 文件中声明的路由创建 URL。\n\n- 22. 最后，您可以成功运行测试！\n\n等等，我们难道不需要在\
  \ Web 界面中导航吗？好吧，您可以通过此处实现的列表部分导航，或者通过下载完整项目来导航。\n\n- 23. 启动 Web 服务器。就像我们使用“hello\
  \ world”项目所做的那样，您可以使用 PHP 的内置 Web 服务器。在 school3 文件夹内，运行以下命令：\n\n```\nphp -S localhost:8000\
  \ -t public\n```\n\n现在您可以在 localhost:8000 访问 school3 应用程序。\n\n如果这里的某些细节看起来像魔法，请不要担心；每个细节将从下一章开始解释。第\
  \ 3 章“使用 Laminas 作为带测试驱动开发的库”和第 4 章“从对象关系映射到 MVC 容器”的主要目的是避免从纯 PHP 经验突然跃迁到 Laminas\
  \ 开发方式。您可以在 Laminas 文档中找到快速入门指南，但它就像一个改进的“hello world”，没有数据库处理。\n\n因此，您已完成本节，拥有一个小型\
  \ MVC Laminas 应用程序，其中框架调用您的代码，而不是您的代码调用框架组件。\n\nschool3 项目完全可用于 https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter04/school3。您可以安装、导航和处理学校班级和学生。在此准备之后，您已准备好开展我们精彩的电子商务项目。您很快将深入理解\
  \ Laminas MVC 实现的每一层。\n\n### 摘要\n\n在本章中，我们学习了如何使用 `laminas-db` 实现 ORM。\n\n有用于 PHP\
  \ 的 ORM 生成工具，例如 **Doctrine**，它可以从数据库架构为您创建类。但是，代码生成工具有时会产生不必要的代码，并从开发人员手中夺取 ORM\
  \ 的控制权。使用 `laminas-db`，开发人员对 ORM 拥有完全控制权，并可以避免代码生成工具有时产生的冗余代码。\n\n我们逐步演进代码库，直到能够使用\
  \ `laminas-mvc` 来包含我们的代码。我们还牢记最佳实践，在创建被测试代码之前先创建测试。这种 TDD 经验将为我们迎接下一挑战做好准备。\n\n\
  在下一章中，我们将提高 Web 应用程序开发的复杂度。我们将开始实现一个电子商务项目，以探索 Laminas 组件提供的许多功能。\n"
- '# 第 2 部分：创建电子商务应用程序


  在本部分中，您将获得使用安全开发最佳实践构建电子商务 Web 应用程序所需的知识。到本部分结束时，您将拥有一个使用 Laminas 主要组件的完整可运行 Web
  应用程序。


  本部分包含以下章节：


  - 第 5 章，创建虚拟商店项目

  - 第 6 章，使用行为驱动开发的模型和对象关系映射器

  - 第 7 章，请求控制和数据视图

  - 第 8 章，创建表单并实现过滤器和验证器

  - 第 9 章，事件驱动身份验证

  - 第 10 章，事件驱动授权

  '
- "## 创建虚拟商店项目\n\n本章介绍我们计划构建的电子商务项目的需求、用例、类图以及应用程序的总体结构创建。我们将启动一个更复杂的应用程序，它可以作为创建\
  \ PHP 企业 Web 应用程序的参考。\n\n到本章结束时，您将能够使用 Laminas 框架作为容器和服务提供商来创建复杂软件项目的结构。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 了解示例 Web 应用程序的项目需求\n- 识别用例和角色\n- 了解 *whatstore*（我们的虚构百货商店）的类图\n- 创建项目实例\n\n\
  ### 技术要求\n\n虚拟商店项目的环境已在 *第 2 章，为我们的电子商务应用程序设置环境* 中准备好。硬件参考配置已在 *第 3 章，使用 Laminas\
  \ 作为带测试驱动开发的库* 中介绍。本章生成的代码可在 `https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter05`\
  \ 中完整查看。\n\n### 了解示例 Web 应用程序的项目需求\n\n我们将为项目构思一个虚构的背景故事。您是一家软件公司的所有者。您的公司名为 *Sheet\
  \ Software*。有一天，您的公司受雇为一家名为 *Whatstore* 的百货商店创建电子商务网站。您可能会认为这家百货商店的名称听起来更像一个问题，但实际上，这个名称是\
  \ *We Have All Things Store* 的缩写。这家公司确实销售许多产品。不幸的是，合同不包括为客户公司建议更好的名称。因此，我们可以专注于软件构建。\n\
  \n在与 Whatstore 首席执行官 Mr. Heythere 的几次会议后，为虚拟商店定义了一些需求：\n\n- 1. 虚拟商店系统必须有两个不同的区域：一个面向客户（销售区），另一个面向员工（管理区）。第一个区域必须允许客户将商品放入购物篮并支付。第二个区域必须允许员工注册产品、进行库存管理、更改价格并提供折扣。\n\
  \n- 2. 客户区域的主页必须允许按名称（完全或部分）搜索商品。\n\n- 3. 商品页面必须显示商品名称、价格和库存数量。每个商品都必须有一个按钮将商品添加到购物篮。\n\
  \n- 4. 必须有一个始终可见的购物篮链接，允许客户查看所有选定的商品，更改每个商品的数量，移除商品或关闭订单。\n\n- 5. 客户应该能够在流程中的任何时间点自行注册。他们在选择商品时不需要注册，但在结账时，客户应该自动注册。\n\
  \n- 6. 订单关闭时，必须在库存中预留请求的商品数量。当商品准备交付时，该数量必须从库存中扣除。\n\n- 7. 系统必须对管理区域实施访问控制，允许他们定义谁可以做什么。\n\
  \n这些功能需求提供了所请求系统的总体概览。在下一节中，我们将为用例完善这些需求。正如我们在上一章中所经历的那样，用例可以帮助我们开发，不仅因为它提供流程，还因为我们可以从用例生成测试用例。测试用例反过来有助于我们维护软件的稳定性。\n\
  \n\n\n\n\n### 识别用例和参与者\n\n在上一章中，我们制定了简化的用例规范（管理学校班级）。在本章中，我们将仅在此处展示用例图。就我们的目的而言，图表及随后的评论已足够。\n\
  \nWhatstore 虚拟商店有两个主要参与者：客户和员工。首先，我们将展示员工参与者的用例图。在客户从商店购买东西之前，商店需要有产品。图 5.1 显示了与产品库存维护相关的用例：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_131_0.png)\n\n图 5.1 – 员工参与者的用例\n\n如我们所见，我们的电子商务系统将具有产品注册功能。嗯，你已经在上一章的示例中获得了创建注册的经验。但是，产品库存除了创建、读取、更新和删除（CRUD）操作之外，还有一些操作。商店持有的某种产品的数量存储在产品注册的不同表中，正如我们在第\
  \ 2 章「为我们的电子商务应用程序设置环境」中所见。每种可用产品的数量可以通过与商品获取或销售相关的特定操作来更改。\n\n你可能会发现，图 5.1 展示了一些根据我们在第\
  \ 3 章「将 Laminas 作为库与测试驱动开发相结合」中采用的方法，仅属于操作流程的用例。你必须记住，学校系统中的 CRUD 操作属于同一个用例。这对我们的准备很方便，因为我们需要对项目有一个更简化的视图。因此，将流程分组在一个用例中更好。从现在开始，我们将处理更多细节，因此最好将操作划分开来，以创建更小且更易读的测试。\n\
  \n既然我们有可供出售的产品，客户就可以与系统交互。如我们在图 5.2 中所见，客户有三个主要流程：注册、产品选择和订单结算：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_132_0.png)\n\
  \n图 5.2 – 客户参与者的用例\n\n客户可以自行注册。但是员工呢？谁将员工添加到系统中？我们可以看到，应该有一个创建员工的参与者：经理。经理也可以是员工，但承担管理角色的员工。图\
  \ 5.3 显示了与经理参与者相关的用例：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_132_1.png)\n\n\
  图 5.3 – 经理参与者的用例\n\n因此，我们为系统识别了三个参与者：客户、员工和经理。用例的参与者可以帮助我们识别类，尽管这并不意味着每个参与者都会转化为类。\n\
  \n在第 2 章「为我们的电子商务应用程序设置环境」中，我们展示了应用程序的模型-实体关系（MER）。实际上，此工件是通用需求定义的一部分。实体也有助于我们识别类。我们在上一章中使用了对象关系映射，并看到类和表之间存在相似性。\n\
  \n接下来，从用例和 MER 的结合中，我们将展示类图，该图将用于应用程序模型的实现。\n\n### 理解 Whatstore 的类图\n\n图 5.4 显示了\
  \ Whatstore 系统的类图。你可以观察到，有两组类：一组独立的类，Role 和 Employee，以及另一组具有依赖关系的类。与客户相关的用例中的类之间的耦合应该是清楚的，考虑到大多数需求都提到客户搜索、选择或订购产品。\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_133_0.png)\n\n图 5.4 – 类图\n\nRole 类从何而来？此前，我们说过经理是员工扮演的角色。经理角色允许员工从系统中插入、更新和删除其他员工。如果首席执行官希望，此角色可以与多个员工关联。当前经理随时可能失去其角色。我们可以定义一个\
  \ `Manager` 类来处理这种特定的特权场景。这需要进一步思考。\n\n如果系统请求了一个新角色怎么办？例如，一个可以插入员工，但不能更新或删除员工的角色。我们应该创建一个新类吗？我们尽量避免软件系统中不必要的更改。每次更改通常会增加更多复杂性，并且倾向于随着时间的推移，使添加新功能和查找\
  \ bug 原因变得更加困难。\n\n我们必须以一种不需要更改源代码的方式允许对软件系统进行更改。架构必须足够灵活，以允许通过配置进行调整。我们必须寻找允许由于插入新数据或系统元素之间的关联而发生行为变化的结构。如果我们有一个通用的角色结构，我们可以随时创建新角色。员工的行为可以通过员工与角色之间的关联来更改。\n\
  \n软件将会改变。让我们专注于为系统（和我们的预算）增加价值的变化。考虑未来，并尝试创建可以轻松适应特定情况的通用结构。这种理想的灵活性特性是 `Role` 和\
  \ `Employee` 类之间解耦的原因。\n\n当然，我们正试图通过 Whatstore 的虚构故事来简化一个电子商务系统。我们将尽可能涵盖许多主要功能，并将利用每一个机会来评论对任何复杂\
  \ Web 应用程序项目都有用的架构方面。\n\n目前，我们已具备所需的输入。在下一节中，我们将基于 Laminas 框架开始使用主要架构结构实现。\n\n###\
  \ 创建项目实例\n\n在先前处理过其他事情之后开始一个新项目，是多么美妙啊？现在你更有信心了。你拥有一个配备合适工具的准备环境。让我们练习一下之前章节中学到的内容。在\
  \ Eclipse 中使用 **创建 Laminas 项目** 外部工具配置，创建名为 **whatstore** 的项目。请记住，创建后，你需要使用 **文件\
  \ | 新建 | PHP 项目** 菜单打开项目。实际上，Eclipse 不会创建新的 PHP 项目，但它会打开文件系统中现有的项目。\n\n创建项目后，你可以使用嵌入式\
  \ PHP Web 服务器启动应用程序（假设你正在 **whatstore** 目录内运行），方法如下：\n\n```\nphp -S localhost:8000\
  \ -t public\n```\n\n如果你在浏览器中打开 `localhost:8000` 地址，你将看到 Laminas 的欢迎页面，就像你在第 2 章「为我们的电子商务应用程序设置环境」中所做的那样。但是，为什么我们将\
  \ `-t` 参数与 `public` 值一起使用呢？我们将在下一节中了解这一点。\n\n### 理解 Laminas 项目的结构\n\n让我们从新项目的目录中了解\
  \ Laminas 项目的结构：\n\n- bin：此文件夹用于存储自动化脚本\n- config：此文件夹存储应用程序配置\n- data：此文件夹用于存储不需要共享的数据，例如缓存文件\n\
  - module：这是应用程序的核心，包含模块的文件夹，我们将在本节中详细讨论\n- public：这是应用程序的公共部分，唯一可被用户访问的文件夹\n- vendor：这是\
  \ Composer 管理的依赖项的默认文件夹\n\n因此，我们通过指向 public 文件夹来启动应用程序，因为 public 是用户的 Web 根目录。它是用户的唯一访问点，避免了不必要地暴露应用程序的主要部分。public\
  \ 与其余部分之间的这种分离使应用程序类似于被深壕环绕的城堡（里面可能有鳄鱼或更糟的东西）。public 文件夹就像这座城堡的吊桥。你必须走过桥才能进入城堡。因此，在\
  \ Web 服务器的文件系统配置中，你可以拒绝访问除了 public 以外的任何文件夹。\n\n我们说过 module 文件夹是应用程序的核心。这确实如此。试着删除这个文件夹看看会发生什么。嗯，module\
  \ 文件夹可以有一个或多个模块，它们位于符合 CamelCase 模式命名的子文件夹中。让我们查看默认 Application 模块的内容，以了解模块的一般结构：\n\
  \n- config：此文件夹存储模块配置\n- src：此文件夹存储实现用例的类\n- test：此文件夹存储测试用例\n- view：此文件夹存储 HTML\
  \ 页面的模板文件\n\n这种结构非常适合 MVC 实现。模型和控制器层的元素在 src 文件夹中。视图层的元素在 view 文件夹中。这是 Laminas 模块的提议和默认结构。可以更改此结构中的一切，但通常没有必要。Laminas\
  \ 有其模式，但它是可配置的。\n\n运行时的真实配置是应用程序配置与模块配置的组合。应用程序配置处理共享资源，例如多个模块使用的数据库连接。模块配置起初只能处理模块包含的资源。但是，模块可以使用另一个模块的资源，尽管不建议建立高度耦合。\n\
  \n\n\n\nLaminas 的 MVC 实现具有一个 ModuleManager 类，它将各个模块编排为唯一的应用程序。ModuleManager 负责将多个模块的配置合并为单个配置。图\
  \ 5.5 显示了模块配置读取的简化方案，该过程在循环内进行：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_136_0.png)\n\
  \n图 5.5 – 监听器的配置读取\n\n事实上，此过程涉及更多的类和接口，但我们将在第 7 章，请求控制与数据视图中进一步了解。目前，了解主要元素就足够了。\n\
  \n每个模块在 src 文件夹内都有一个 Module 类。ModuleManager 在应用程序配置的 modules.config 文件中列出的模块进行查找。当\
  \ ModuleManager 加载模块时，会通知 ConfigListener 类。ConfigListener 尝试从 Module 类调用 getConfig\
  \ 方法。如果存在 getConfig 方法，则必须返回配置数组。模块配置包含（如我们在上一章中所见）模块的路由、可实例化的控制器、视图模板的源以及任何需要通过依赖注入创建的对象的工厂。\n\
  \n在下一节中，我们将为项目准备模块。\n\n### 为我们的项目准备模块\n\nWhatsstore 应用程序将有三个模块。我们将保留 Application\
  \ 模块，并再创建两个：Inventory 和 Store。我们将使用 Application 模块作为其他模块的源。在模块文件夹中复制 Application\
  \ 目录并粘贴两次，一次作为 Inventory，另一次作为 Store。\n\n你可以观察到，仅仅在 module 文件夹中存在 `Inventory` 和\
  \ `Store` 文件夹不会影响应用程序，通过加载 `localhost:8000` 上的欢迎页面即可验证。`ModuleManager` 会忽略这些文件夹，直到它们的名称出现在\
  \ `config` 文件夹的 `modules.config.php` 文件中。按以下方式在此文件中添加新模块的名称：\n\n### module.config.php\n\
  \n```\nreturn [\n    'Laminas\\\\Router',\n    'Laminas\\\\Validator',\n    'Store',\n\
  \    'Inventory',\n    'Application',\n];\n```\n\n`Application` 模块必须保留在此列表的末尾，因为它将定义网页的布局。我们将在\
  \ *第 7 章，请求控制与数据视图* 中讨论此问题。\n\n将新模块添加到配置后，我们将在 Web 服务器日志中看到此错误消息：\n\n```\nPHP Fatal\
  \ error: Uncaught Laminas\\\\ModuleManager\\\\Exception\\\\RuntimeException: Module\
  \ (Store) could not be initialized.\n```\n\n问题是什么？`ModuleManager` 找不到这些模块。但是怎么可能呢？它们在\
  \ `modules` 文件夹中！等等，别着急！我们在 *第 4 章，从对象关系映射到 MVC 控制器* 中已经讲过这一点。如果你需要复习，请重新阅读 *将 Laminas\
  \ 用作容器* 一节。\n\n我们已经说过，Laminas 是可配置的。它不强制你遵循僵化的结构。你有灵活性来调整项目结构。因此，你可以将模块放在不同的位置，这也是有道理的。之所以可能，是因为类的加载委托给了\
  \ Composer。我们在 `composer.json` 文件中定义自动加载规则。你需要按如下方式更改 `autoload` 和 `autoload-dev`\
  \ 键：\n\n```\n\"autoload\" : {\n    \"psr-4\" : {\n        \"Application\\\\\" :\
  \ \"module/Application/src/\",\n        \"Inventory\\\\\" : \"module/Inventory/src/\"\
  ,\n        \"Store\\\\\" : \"module/Store/src/\"\n    },\n},\n\"autoload-dev\" :\
  \ {\n    \"psr-4\" : {\n        \"ApplicationTest\\\\\" : \"module/Application/test/\"\
  ,\n        \"InventoryTest\\\\\" : \"module/Inventory/test/\",\n        \"StoreTest\\\
  \\\" : \"module/Store/test/\"\n    }\n},\n```\n\n完成自动加载配置后，不要忘记保存 `composer.json`\
  \ 文件，并在 Eclipse 的 Composer 编辑器中点击 **更新依赖项（包括 require-dev）** 按钮。此操作将重新生成自动加载文件。\n\
  \n但是，当你在 **控制台** 选项卡中查看输出时，你会发现此操作还会搜索更新，这很合理。如何在不搜索更新的情况下重新生成 `autoload` 文件？我们可以创建一个外部工具配置，如同我们在第\
  \ 2 章，为我们的电子商务应用程序设置环境的 *集成 Laminas 和 Eclipse* 一节中为 Laminas 项目创建所做的那样。你可以创建如下配置：\n\
  \n- **名称**：Composer 自动加载文件重新生成\n- **位置**：在此处，必须键入 Composer 可执行文件的完整路径\n- **工作目录**：`${project_loc}`\n\
  - **参数**：dumpautoload\n\n因此，当你需要重新生成 `autoload` 文件时，可以通过 Eclipse 工具栏运行此配置。\n\n但是，即使重新生成了\
  \ `autoload` 文件，模块仍未加载。为什么呢？我们之前见过这种情况。难道我们没有复制 Application 模块吗？那么，Inventory 和 Store\
  \ 模块的所有命名空间也都是 Application。因此，你需要编辑这些模块中的所有类和配置文件，并将命名空间更改为 `composer.json` 文件中定义的命名空间。例如，对于\
  \ Inventory 模块，`modules.config.php` 文件和 `src` 文件夹中的类必须具有 `Inventory` 命名空间。而 `test`\
  \ 文件夹中的类则必须具有 `InventoryTest` 命名空间。\n\n你可以检查，修复命名空间后，你可以成功加载 `Whatstore` 应用程序的 Laminas\
  \ 骨架欢迎页面。看来模块方面一切正常。你可以将 PHPUnit 和 `laminas-test` 作为开发依赖项安装以运行测试，结果将为正，但这将是一个假阳性，因为我们没有创建包含所有测试用例的\
  \ `phpunit.xml` 文件。将 `phpunit.xml.dist` 模板复制为 `phpunit.xml`。找到以下行：\n\n```\n<directory>./module/Application/test</directory>\n\
  ```\n\n并将其更改为以下行：\n\n```\n<directory>./module/*/test/</directory>\n```\n\n这可能会让人感觉似曾相识，因为你在第\
  \ 4 章，从对象关系映射到 MVC 控制器中已经这样做过了（至少我希望你如此）。现在，如果你再次运行 phpunit，你会看到两个新模块出现错误。这些错误与测试调用的路由有关。但目前，我们不会修复测试类。我们将在第\
  \ 7 章，请求控制与数据视图中进行修复。\n\n由于新模块的路由尚未配置，新控制器未被实例化，因此控制器未尝试渲染模板视图。但是，有必要再次讨论视图文件夹的结构，为下一步的实现准备我们的模块。\n\
  \nLaminas 模块的视图文件夹必须是一个与模块同名的文件夹，但仅使用小写字母。视图文件夹下的文件夹和文件名称均为小写字母。然后，将 Inventory 和\
  \ Store 模块视图文件夹下的 application 文件夹分别更改为 inventory 和 store。还要移除这些模块视图文件夹下的 layout\
  \ 文件夹。只有一个模块需要拥有 layout 文件夹，而 Application 模块已经有一个。新模块的外观应如图 5.6 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_139_0.png)\n\
  \n图 5.6 – 模块文件夹的结构\n\n这足以使用自定义模块启动一个新的 Laminas 项目。在下一章中，我们将实现应用程序的模型层，使用本章中预计的类。\n\
  \n### 总结\n\n在本章中，我们介绍了我们的主要示例 Web 应用程序的要求：一个为虚构公司 Whatstore 提供服务的电子商务系统。我们努力理解其请求系统的业务规则和要求。我们使用了一些用例图来高级展示应用程序的主流程。此外，我们介绍了将作为模型层实现输入的预计类。\n\
  \n我们还回顾了在第 2 章，为我们的电子商务应用程序设置环境和第 4 章，从对象关系映射到 MVC 控制器中完成的一些步骤，用于通过 Composer（由 Eclipse\
  \ 中介）创建项目，并使用 Application 模块作为模板创建新模块。\n\n在本章中，你学习了如何使用 Laminas 框架启动一个复杂的软件项目。我们可以将复杂性理解为与系统中的事物数量以及了解和管理每个事物的难度相关的概念。根据笛卡尔原理，要解决复杂问题，我们需要将其分解为更小的部分。在此，我们为软件项目定义了模块结构，将主要问题分为两部分（两个模块）。在后续章节中，我们将学习模块内部的划分，这将帮助我们一次专注于一个小问题。\n\
  \n当代软件是复杂的，有必要拥有应对复杂性的方法和工具。Laminas 框架的模块结构结合 MVC 模式，帮助 PHP Web 开发人员管理分布式系统世界中的复杂应用程序。\n\
  \n在下一章中，我们将回顾我们已经学习的关于 `laminas-db` 组件的内容，并深入研究 ORM 实现。当我们需要为映射器类创建通用实现时，我们将处理代码复用问题。\n\
  \n\n\n"
- "## 使用行为驱动开发的模型和对象关系映射器\n\n在本章中，我们将使用 `laminas-db` 将实体-关系模型映射为对象模型。我们不仅要使用 Laminas\
  \ 实现映射器，还要创建一个扩展 Laminas 类的最强大可复用映射器。最后，我们将展示模型和映射器是如何连接的。在创建类的过程中，我们将采用 **行为驱动开发**（BDD）的方法，在源代码中保留用户可读的需求。\n\
  \n本章结束时，你将学会如何使用 BDD 方法创建模型和对象关系映射器类。你将知道如何以组织良好的方式将系统需求映射到代码中。希望你读完本章后，会像卢克·天行者炸毁死星后那样感到满足！\n\
  \n本章将介绍以下主题：\n\n- 使用 Behat 的 BDD\n- 从用户故事创建模型\n- 从用户故事创建映射器\n- 创建通用模型和通用映射器\n- 使用\
  \ Behat 创建其他模型\n\n### 技术要求\n\n本章所有为 **Behat** 实现的用户故事均可在 https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter06/whatstore/features\
  \ 上找到。在同一仓库中，你可以在 Inventory 和 Store 模块的 Model 文件夹中找到模型类。\n\n### 使用 Behat 的 BDD\n\
  \n在第 3 章《将 Laminas 用作库并进行测试驱动开发》中，我们体验了 TDD 方法。TDD 是确保软件稳定性的一项非常重要的技能。当你进行 TDD 练习时，你知道在修改软件某部分后，所有软件仍能正常工作。除此之外，测试类记录了业务规则，因此\
  \ TDD 有助于你维护有用的文档。一个运行测试的测试类告诉你，测试中包含的规则已由软件的类或子例程强制执行。\n\n用 xUnit 模式编写的测试用例可能比直接实现软件更易于非程序员阅读，但你仍在使用编程语言表达业务规则。如果能用更接近人类语言的语言编写测试，那该多好？BDD\
  \ 正好提供了这一点。它是对 TDD 的扩展方法，在自动化测试之上使用抽象层，由程序员编写并面向程序员。它允许编写更易于理解的故事，供那些了解业务但不了解（甚至无需了解）其用于开发应用程序的技术的人阅读。\n\
  \n**xUnit 模式**\nKent Beck 和 Erich Gamma 创建了 JUnit，这是一个用于 Java 的测试框架。JUnit 架构被用作为\
  \ PHP 等其他语言创建测试框架的基础。有一系列测试框架遵循相同的模式来实现单元测试、测试用例和测试套件。Kent Beck 和其他作者（如 Gerard Meszaros）将这一系列称为\
  \ xUnit，其中字母 x 是编程语言中的变量占位符。Gerard Meszaros 在他的著作《xUnit 测试模式：重构测试代码》（Addison-Wesley）中很好地描述了\
  \ xUnit 框架的通用结构。\n\n我们将使用 BDD 为 Whatstore 项目实现模型层。我们需要为 PHP 安装一个 BDD 工具。PHP 有一个名为\
  \ Behat 的 BDD 实现。\n\n使用 Eclipse 的 Composer 编辑器，为 behat/behat 包添加开发依赖。请记住，在安装 PHPUnit\
  \ 时，你在第 3 章《将 Laminas 用作库并进行测试驱动开发》中已经做过类似的操作。添加包后，保存文件，然后单击“更新依赖项（包括 require-dev）”按钮以下载\
  \ Behat。\n\n基于在第 2 章《为我们的电子商务应用程序设置环境》中学到的内容，我们将为 Behat 可执行文件的最常用调用创建一些外部工具配置。使用“运行\
  \ | 外部工具 | 外部工具配置”菜单，创建以下三个配置：\n\n- **Behat 初始化：**\n  - Name: Behat init\n  - Location:\
  \ ${project_loc}/vendor/bin/behat\n  - Working Directory: ${project_loc}\n  - Arguments:\
  \ --init\n\n- 运行行为测试：\n  - Name: Behat run\n  - Location: ${project_loc}/vendor/bin/behat\n\
  \  - Working Directory: ${project_loc}\n  - Arguments: 留空\n\n- 追加代码片段：\n  - Name:\
  \ Behat append snippets\n  - Location: ${project_loc}/vendor/bin/behat\n  - Working\
  \ Directory: ${project_loc}\n  - Arguments: --append-snippets\n\n请不要忘记，像在第 2 章《为我们的电子商务应用程序设置环境》中所做的那样，在“常用”选项卡上为每个配置勾选“外部工具”项。\n\
  \n现在我们已经避免了后续步骤中不必要的命令输入，可以为 Whatstore 项目初始化 Behat 了。在“项目资源管理器”视图中选择项目名称，然后单击工具栏外部工具列表中的“Behat\
  \ init”项，或在“运行 | 外部工具”菜单中选择。“控制台”选项卡上的输出将如下所示：\n\n```\n+d features - place your\
  \ *.feature files here\n+d features/bootstrap - place your context classes here\n\
  +f features/bootstrap/FeatureContext.php - place your definitions, transformations\
  \ and hooks here\n```\n\n> 变量引用空选择：${project_loc}\n> \n> 如果在运行任何外部工具后出现“变量引用空选择：${project_loc}”消息，是因为你在“项目资源管理器”视图中未选择项目名称。选择\
  \ Whatstore 项目名称并再次运行。\n\n按 F5 或单击项目的“刷新”项，即可在“项目资源管理器”视图中查看新的 features 文件夹。带有 .feature\
  \ 扩展名的文件包含用户故事，其语言比编程语言更接近人类语言。我们可以说它看起来像是普通人的语言。bootstrap 文件夹将包含与 .feature 文件定义的故事相关的代码类。不用担心——我们会解释如何创建故事。\n\
  \n在 **“项目资源管理器”** 视图中选择项目名称，然后单击工具栏外部工具列表中的 **“Behat run”** 项，或在 **“运行/外部工具”** 菜单中选择。**“控制台”**\
  \ 选项卡上的输出将如下：\n\n```\nNo scenarios\nNo steps\n0m0.00s (8.67Mb)\n```\n\n因为 features\
  \ 文件夹中没有带 .feature 扩展名的文件，所以没有场景。让我们创建第一个场景，以了解 BDD 中的场景是什么。\n\n### 创建我们的第一个场景\n\
  \n在上一章中，我们介绍了几个用例。其中一些与员工对产品的管理有关。让我们从用例 *产品添加* 开始。事实上，用例是一种表达软件系统所需功能的用户故事。因此，从用例\
  \ *产品添加* 中，我们将编写一个名为 productaddition.feature 的文件来描述此功能。通过“文件 | 新建 | 文件”菜单创建此文件。其内容如下：\n\
  \n### productaddition.feature\n\n```\nFeature: Product addition\n    In order to\
  \ have products in the stock\n    As an employee\n    I need to be able to add a\
  \ product to the product\n    registration\n\n    Rules:\n    - The code of product\
  \ is generated automatically\n    - Product name has a maximum of 80 characters\n\
  \    - A product must have a discount, and the default\n      discount is the null\
  \ discount\n\n    Scenario: Inserting a product in the registration\n    Given there\
  \ is a product called \"Troop Power Battery\",\n    which costs $2814\n    When\
  \ I add this product to the registration\n    Then I should have a product called\
  \ \"Troop Power\n    Battery\" in the table products\n    And the overall product\
  \ price should be $2814\n```\n\n让我们了解 productaddition.feature 文件中使用的模式。文件以单词 Feature\
  \ 开头。Feature 是用户故事或用例的另一种名称。随后的三行具有每个功能描述中必须存在的初始词：\n\n- In order...：用户故事的目标\n-\
  \ As a/an...：故事参与者扮演的角色\n- I need...：参与者实现目标的条件\n\n这些初始词定义了描述功能的模式。可选地，你可以添加 Rules\
  \ 部分来描述与功能相关的业务规则。.feature 文件的第一部分仅供描述，并像任何其他需求文档一样工作。另一方面，第二部分用于生成源代码。\n\n场景使用示例来描述一个流程。因此，我们有实际值而不是变量。你可以根据可能的流程创建多个块，以单词\
  \ Scenario 开头。Scenario 块包含以下词语开头的短语：\n\n- Given...：流程开始的条件\n- When...：启动流程的操作\n\
  - Then...：流程的结果\n- And（可选）：...：流程的附加结果\n\n这四个关键字都是用于为可执行规范赋予结构和意义的语言的一部分——Gherkin。Gherkin\
  \ 是 Java BDD 工具 Cucumber 的通用语言分析器的一部分。你可以在 https://cucumber.io/docs/gherkin/reference\
  \ 了解更多关于 Gherkin 的信息。\n\n场景的短语用于创建上下文类的方法。上下文类允许你将用户故事映射到自动化测试。让我们看看它是如何工作的。\n\n\
  ### 将用户故事映射到自动化测试\n\n如你所见，我们编写了一个场景，其中员工插入一个名为 \"Troop Power Battery\"、价格为 2,814\
  \ 美元的产品。由于未指定折扣类型，我们假设折扣为零。好吧，但这个场景如何变成自动化测试？你可以通过在“项目资源管理器”视图中选择 whatstore 项目，并单击“运行\
  \ | 外部工具”菜单中的“Behat run”项来发现这一点。“控制台”选项卡上的输出将添加 productaddition.feature 文件的内容以及以下行：\n\
  \n```\n1 scenario (1 undefined)\n4 steps (4 undefined)\n0m0.01s (8.89Mb)\n```\n\n\
