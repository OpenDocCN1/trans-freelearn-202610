- "## 实现产品购物篮\n\n本章介绍了产品购物篮的实现，它是虚拟商店的一个基本组件。在 *第 9 章，事件驱动的身份验证* 中，我们了解了 `laminas-session`\
  \ 组件以及它如何用于管理会话并在 HTTP 请求之间持久化数据。在本章中，我们将使用 `laminas-session` 来实现产品购物篮。\n\n我们将首先学习如何实现库存管理。接下来，我们将了解如何使用视图助手重构客户主页。之后，我们将实现产品购物篮。最后，我们将学习如何为已验证的客户创建采购订单。\n\
  \n在本章结束时，您将能够从列表页面选择产品，将这些产品添加到购物篮中，从购物篮中删除产品，并创建采购订单。此采购流程包括客户注册，这与我们在 *第 9 章，事件驱动的身份验证*\
  \ 中实现的员工注册非常相似。\n\n在本章中，我们将涵盖以下主题：\n\n- 管理产品库存\n- 重构客户主页\n- 控制产品购物篮\n- 控制客户\n- 解耦身份验证的通用行为\n\
  \n### 技术要求\n\n本章中所有相关代码均可在 `https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter11/whatstore`\
  \ 找到。\n\n### 管理产品库存\n\n要在我们的电子商务系统中销售产品，我们需要在库存中拥有这些产品。正因为如此，我们需要能够管理库存以及产品数量的添加和移除。\n\
  \n事实上，想象您已经为库存实现了 RU。您可能会问，“RU？这是什么？”哦，抱歉，RU 代表 **恢复与更新**。“那不是 CRUD 吗？”不，因为库存取决于产品。当创建产品时，我们必须为此产品创建一个库存记录。当删除产品时，相关的库存记录也必须删除。因此，在涉及库存时，CRUD\
  \ 没有意义，我们只需要为库存实现恢复和更新。好了，既然您已经理解了，让我们来解释库存管理的实现。\n\n我们不会重复之前章节中介绍的注册详细信息。库存管理的实现可在本章的源代码文件夹中找到，如\
  \ *技术要求* 部分所述。因此，我们在这里将只关注与库存管理相关的差异。库存管理的专用数据基于库存表。\n\n所以，让我们假设 `module/Inventory/src/Model`\
  \ 文件夹中有以下类：\n\n- Inventory\n- InventoryTable\n- InventoryTableFactory\n\n重要的是要记住，每个表网关类的工厂必须通过\
  \ `modules.config.php` 文件中的 `service_manager` 键进行配置。\n\n**重要说明 – 自动化测试**\n您将在 *技术要求*\
  \ 部分提到的 GitHub 仓库中找到本章中每个控制器类的测试类。然而，从现在开始，我们不会讨论这些测试类以避免不必要的重复。到现在为止，您应该意识到测试是必要的，并且在开发过程中进行测试很重要。从现在开始，我们将假设在创建新控制器类时，相应的测试类事先已创建。\n\
  \n我们还假设 `module/Inventory/src/Controller` 文件夹中有以下类：\n\n- InventoryAPIController\n\
  - InventoryAPIControllerFactory\n- InventoryController\n- InventoryControllerFactory\n\
  \n请注意，我们有两对类：一个 API 控制器及其工厂，以及一个 Web 界面控制器及其工厂。这与我们在第 7 章“请求控制和数据视图”中用于产品控制器层实现的结构完全相同。这些控制器类由\
  \ module/Inventory/test/Controller 文件夹中的以下类进行测试：\n\n- `InventoryAPIControllerTest`\n\
  - `InventoryControllerTest`\n\n重要的是要记住，每个控制器类的别名和工厂必须通过 modules.config.php 文件中的\
  \ controllers 键进行配置。\n\n我们还有一个用于角色的视图层实现，它与我们为产品所做的非常相似。因此，让我们假设以下视图脚本位于 module/Inventory/view/inventory/inventory\
  \ 文件夹中：\n\n- `edit.js`\n- `edit.phtml`\n- `index.js`\n- `index.phtml`\n\n这里，我们有两对文件，生成两个网页：更新页面和列表页面。.phtml\
  \ 文件包含 HTML 和 PHP 代码的组合，而 .js 文件专门包含 JavaScript 代码。\n\n我们还有一个 `src/Form` 文件夹中的 `InventoryForm`\
  \ 类，用于呈现库存管理表单。\n\n我们需要从库存模块菜单访问库存管理。然后，我们必须向由 `MenuController` 类管理的 `index.phtml`\
  \ 的无序列表中添加一行。以下行位于员工注册链接和角色注册链接之间：\n\n```\n<li><a href=\"<?=$this->url('inventory',\
  \ [\n    'controller' => 'inventory'\n]) ?>\">Inventory Management</a></li>\n```\n\
  \n此行将由浏览器呈现为图 11.1 所示的页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_300_0.png)\n\
  \n图 11.1：带有库存管理链接的库存模块菜单页面\n\n当您单击“库存管理”链接时，将被带到以下页面：\n\n| 代码 | 名称 | 数量 | 最大值 |\
  \ 最小值 | 预留 |\n|---|---|---|---|---|---|\n| 1 | ENCHANTED HAMMER | 2 | 2 | 1 | 0\
  \ |\n| 2 | POWER RING | 7200 | 7200 | 1 | 0 |\n| 3 | UTILITY BELT | 1000 | 5000\
  \ | 1 | 0 |\n| 4 | VIBRANIUM SHIELD | 1 | 1 | 1 | 0 |\n| 5 | LASSO OF TRUTH | 3\
  \ | 3000 | 1 | 0 |\n| 6 | FLUX CAPACITOR | 3 | 9999 | 1 | 0 |\n| 7 | TOWEL | 42\
  \ | 1001 | 1 | 0 |\n| 8 | LIGHT SABER | 500 | 10000 | 1 | 0 |\n| 9 | GLAIVE | 1\
  \ | 1 | 1 | 0 |\n\n图 11.2：产品库存列表\n\n\n\n\n标题为 **产品库存** 的页面显示产品库存列表。在此示例中，我们有九种产品。例如，我们可以看到，有\
  \ **2** 个附魔锤，且此数量介于最大值（**2**）和最小值（**1**）之间。没有预留单位。如果你在最小值列中点击 **1**，将被带到以下页面：\n\n\
  ![](img/e6cf5550804ccae9d1859270da8688f5_301_0.png)\n\n图 11.3：产品的库存管理页面\n\n标题为 **库存管理**\
  \ 的页面显示一个表单，允许对所选产品的库存执行一些操作。在此页面，你可以添加或移除产品单位，可以设置最大或最小数量，还可以预留数量。当你点击 **保存** 按钮时，所选操作将被应用。\n\
  \n然而，这些库存记录从何而来？**产品库存** 页面上没有添加库存的链接。你忘记我们在本节开头告诉过你的内容了吗？产品的库存在产品创建时被创建。同样，当产品被删除时，产品的库存也会被删除。然后，这些库存记录出现在注册附魔锤和力量戒指时。为此，我们不得不实现\
  \ `ProductTable->save` 方法，覆盖从 `AbstractTable` 类（来自 `Generic` 模块）继承的方法。因此，`ProductTable->save`\
  \ 方法如下所示：\n\n```php\npublic function save(AbstractModel $model): bool\n{\n    $set\
  \ = $model->toArray();\n    $keyName = $this->keyName;\n    try {\n        if (empty($model->$keyName))\
  \ {\n            unset($set[$keyName]);\n            $this->tableGateway->insert($set);\n\
  \            $lastCode = $this->tableGateway->getLastInsertValue();\n          \
  \  $inventory = new Inventory();\n            $inventory->exchangeArray(['code_product'\
  \ => $lastCode]);\n            $this->inventoryTable->save($inventory);\n      \
  \  } else {\n            $this->tableGateway->update($set, [\n                $keyName\
  \ => $set[$keyName]\n            ]);\n        }\n    } catch (\\Exception $e) {\n\
  \        error_log($e->getMessage());\n        return false;\n    }\n    return\
  \ true;\n}\n```\n\n请注意，在将产品包含到产品表后，我们使用 getLastInsertValue 方法来恢复生成的产品代码。然后，我们使用此产品代码向库存表插入一条记录。因此，对于每个插入的产品，都会创建一个库存。\n\
  \n如你所见，我们使用一个 InventoryTable 实例将数据持久化到库存表。为此，我们不得不为库存表网关添加一个属性，并修改 ProductTable\
  \ 构造方法以接收一个 InventoryTable 实例：\n\n```php\nprivate ?InventoryTable $inventoryTable;\n\
  public function __construct(TableGatewayInterface $tableGateway, InventoryTable\
  \ $inventoryTable)\n{\n    $this->tableGateway = $tableGateway;\n    $this->inventoryTable\
  \ = $inventoryTable;\n}\n```\n\n接下来，我们展示 ProductTableFactory 的 __invoke 方法，该方法也需要修改以便注入一个\
  \ InventoryTable 实例：\n\n```php\npublic function __invoke(ContainerInterface $container,\
  \ $requestedName, ?array $options = null)\n{\n    $adapter = $container->get('DbAdapter');\n\
  \    $resultSetPrototype = new ResultSet();\n    $resultSetPrototype->setArrayObjectPrototype(new\
  \ Product());\n    $tableGateway = new TableGateway('products', $adapter, null,\
  \ $resultSetPrototype);\n    $inventoryTable = $container->get('InventoryTable');\n\
  \    $productTable = new ProductTable($tableGateway, $inventoryTable);\n    return\
  \ $productTable;\n}\n```\n\n如前所述，当我们从注册中移除产品时，需要删除相关的库存记录。因此，ProductTable->delete\
  \ 方法必须如下所示：\n\n```php\npublic function delete($value): bool\n{\n    try {\n    \
  \    $this->inventoryTable->delete([\n            'code_product' => $value\n   \
  \     ]);\n        $this->tableGateway->delete([\n            $this->keyName =>\
  \ $value\n        ]);\n    } catch (\\Exception $e) {\n        error_log($e->getMessage());\n\
  \        return false;\n    }\n    return true;\n}\n```\n\n如你所见，我们先删除了依赖记录，因为没有产品就没有库存。\n\
  \n让我们回到标题为 **库存管理** 的页面（图 11.3）。当用户点击表单上的 **保存** 按钮时，请求由 **库存 API 控制器** 的 **更新**\
  \ 方法处理。此方法根据所选操作调用 **库存表** 类的特定方法。**库存 API 控制器->update** 的源代码如下所示：\n\n```php\npublic\
  \ function update($id, $data)\n{\n    $inventory = $this->inventoryTable->getByField('code',\
  \ $id);\n    $operation = $data['operation'];\n    $methods = [\n        'add' =>\
  \ 'addItems',\n        'remove' => 'subtractItems',\n        'reserve' => 'reserveItems',\n\
  \        'maximum' => 'setMaximum',\n        'minimum' => 'setMinimum'\n    ];\n\
  \    $method = ($methods[$operation] ?? 'invalid');\n    if ($method == 'invalid')\
  \ {\n        $updated = false;\n    } else {\n        $updated = $this->inventoryTable->$method($id,\
  \ $data['amount']);\n    }\n    $updated = (bool) $updated;\n    return new JsonModel(['updated'\
  \ => $updated]);\n}\n```\n\n### 变量函数\n\n与使用 switch 结构不同，InventoryAPIController->update\
  \ 方法使用了 PHP 的变量函数特性。变量函数是由变量定义的函数（或方法）。在 update 方法中，我们使用 $method 变量来调用 InventoryTable\
  \ 实例的一个方法。将被调用的方法将在运行时定义。变量函数对于编写更整洁的代码非常有用。\n\n这些是库存管理的具体实现。然后，库存管理即可使用。在下一节中，我们将重构客户主页并更改应用程序的默认路由。\n\
  \n### 重构客户主页\n\n在本节中，我们将为 Store 模块创建主页，该模块是 whatstore 的客户模块。为此，我们将修改路由配置、Store 模块的\
  \ IndexController 类以及视图脚本文件。\n\nwhatstore 应用程序的通用主页将是 Store 模块主页。因此，我们将把主路由从 Application\
  \ 模块转移到 Store 模块。为此，我们必须复制 Application 模块的 module.config.php 文件的以下部分：\n\n```php\n\
  'home' => [\n    'type' => Literal::class,\n    'options' => [\n        'route'\
  \ => '/',\n        'defaults' => [\n            'controller' => Controller\\IndexController::class,\n\
  \            'action' => 'index',\n        ],\n    ],\n],\n```\n\n此部分必须粘贴到 Store\
  \ 模块的 module.config.php 文件中。因此，Store 模块的索引页成为客户主页。此新主页将向客户展示商店产品。一个应用程序只能有一个路由名称，因此你需要删除\
  \ Application 模块的 module.config.php 文件中的主路由块代码。\n\n为了展示产品，IndexController 类必须拥有产品的表网关。此表网关已就绪；它是\
  \ ProductTable 类。我们只需要将 ProductTable 实例注入到 IndexController 实例中。你应该回忆如何做到这一点，因为我们在第\
  \ 7 章“请求控制和数据视图”中做过类似的事情。让我们专注于 IndexController 的实现。接下来，我们可以看到此类的内容（除了命名空间声明）：\n\
  \n```php\nclass IndexController extends AbstractActionController\n{\n    private\
  \ ProductTable $productTable;\n\n    public function __construct(ProductTable $productTable)\n\
  \    {\n        $this->productTable = $productTable;\n    }\n\n    public function\
  \ indexAction()\n    {\n        $products = $this->productTable->getAll();\n   \
  \     $form = new ProductForm();\n        return new ViewModel([\n            'form'\
  \ => $form,\n            'products' => $products\n        ]);\n    }\n}\n```\n\n\
  IndexController 构造方法接收 ProductTable 类的一个实例。ProductTable 实例由 IndexControllerFactory\
  \ 类注入。正如我们在创建多个控制器后所知，此工厂类在 module.config.php 文件中定义。\n\nIndexController->indexAction\
  \ 方法从产品表中检索一组产品，并从 ProductForm 类创建一个对象。产品集和表单对象通过 ViewModel 类传递到视图层。如你现在所知，这意味着这两个对象（$form\
  \ 和 $products）可以由 index.phtml 文件处理。让我们逐步查看并理解此视图文件的内容：\n\n- 1. 首先，我们为 AuthenticationService\
  \ 声明命名空间：\n  ```php\n  <?php\n  use Laminas\\Authentication\\AuthenticationService;\n\
  \  ```\n  这是必要的，因为我们将控制客户身份验证，并根据客户状态启用相应的链接。\n\n- 2. 我们添加一个文档块，为 $this 关键字声明类型：\n\
  \  ```\n  /**\n   * @var Laminas\\View\\Renderer\\PhpRenderer $this\n   */\n  ```\n\
  \  这对 IDE 有好处，因为 IDE 无法在类之外推断 $this 是什么。在运行时，index.phtml 文件将在一个类内部处理，$this 对 PHP\
  \ 解释器来说将有意义。\n\n\n\n\n\n- 我们导入一个 JavaScript 文件，用于处理由 index.phtml 和 layout.phtml\
  \ 生成的 HTML 页面的客户端事件：\n\n```\n$this->headScript()->appendScript\n(file_get_contents(__DIR__\
  \ . '/index.js'));\n\n```\n\n- 在此视图文件中，我们使用一个名为 PartialLoop 的帮助器类。该类替换了 foreach\
  \ 结构，并允许我们为重复的部分视图使用模板文件。PartialLoop 实例通过 $this->partialLoop 方法获取。PartialLoop 直接接收对象集合，但有时，我们需要使用额外变量。在控制器视图脚本和帮助器视图脚本之间共享变量的一种方法是将它们存储在\
  \ Placeholder 帮助器中。在此示例中，我们需要为每个产品存储一个表单，并存储一个索引以控制每行展示的产品数量：\n\n```\n$this->placeholder('products')->form\
  \ = $this->form;\n$this->placeholder('products')->index = 1;\n\n```\n\n- 当我们使用 foreach\
  \ 结构时，会定义一个变量来接收每次迭代中集合的一个元素。PartialLoop 允许我们通过 setObjectKey 方法定义此元素变量：\n\n```\n\
  $this->partialLoop()->setObjectKey('product');\n\n```\n\n- 我们使用 AuthenticationService\
  \ 实例来检查当前客户是否已通过身份验证。如果客户已通过身份验证，将显示 **注销** 链接；否则，将显示 **登录** 链接：\n\n```\n$authenticationService\
  \ = new AuthenticationService();\n$link = ['action' => 'index', 'label' => 'Login'];\n\
  if ($authenticationService->hasIdentity()) {\n    $link = ['action' => 'logout',\
  \ 'label' =>\n        'Logout'];\n}\n?>\n<h1>Our products</h1>\n<table style=\"\
  width: 100%\">\n<tbody>\n<tr>\n<td><a href=\"<?=$this->url('store', ['controller'\
  \ => 'customer','action' => $link['action']] ?>\"><?= $link['label'] ?></a></td>\n\
  </tr>\n</tbody>\n</table>\n```\n\n- 最后，我们使用 PartialLoop 生成产品集的视图，并定义隐藏标签以存储用于供 JavaScript\
  \ 函数使用的 URL：\n\n```\n<?=$this->partialLoop('products',$this->products) ?> <span\
  \ id=\"api\" url=\"<?=$this->url('storeapi', ['controller' => 'productbasketapi'])\
  \ ?>\"></span> <span id=\"target\" url=\"<?=$this->url('store', ['controller' =>\
  \ 'productbasket']) ?>\"></span>\n```\n\n请注意，PartialLoop 帮助器接收两个参数。第二个参数是由 ProductTable\
  \ 检索并由 IndexController 发送的产品集。那么第一个参数是什么？第一个参数是视图模板文件的名称。与 PartialLoop 相关的模板必须位于视图文件夹的根目录下。因此，我们需要在\
  \ module/Store/view 文件夹中创建 products.phtml 文件。让我们逐部分查看 products.phtml 的源代码：\n\n-\
  \ 该文件以一个决策结构开头，用于控制 class 属性等于 \"row\" 的 div 的打开。这确保每行有三个产品。我们为 if 结构使用替代语法，因为当\
  \ HTML 代码与 PHP 代码交错时，此语法更清晰：\n\n```\n<?php $index = $this->placeholder('products')->index;\
  \ if ((($index - 1) % 3) == 0): ?> <div class=\"row\"> <?php endif; ?>\n```\n\n\
  - 每个产品以 HTML 格式呈现，位于配置为三列行中一列的 div 标签内。每个产品请求的数量默认设置为 1：\n\n```\n<div class=\"col-md-3\"\
  > <p> <?php\n$form = $this->placeholder('products')->form;\n$form->setAttribute('id',\
  \ 'product' . $this->product->code);\n$form->bind($this->product);\n$form->get('amount')->setValue(1);\n\
  echo $this->form()->openTag($form);\necho $this->formText($form->get('name')) .\n\
  \    '<br />';\necho $this->formLabel($form->get('price'));\necho $this->formText($form->get('price'))\
  \ .\n    '<br />';\necho $this->formLabel($form->get('amount'));\necho $this->formNumber($form->get('amount'))\
  \ .\n    '<br />';\necho $this->formHidden($form->get('code'));\necho $this->form()->closeTag();\n\
  ?>\n</p>\n<button class=\"buy\" id=\"<?=$this->product->code?>\">\nBuy</button>\n\
  </div>\n```\n\n- 最后，我们检查 div 标签内是否有三个产品以关闭它。对于每个产品，我们递增 $index 变量：\n\n```\n<?php\n\
  \    $index = $this->placeholder('products')->index;\n    if ($index % 3 == 0):\n\
  ?>\n</div>\n<?php\n    endif;\n    $this->placeholder('products')->index = ++$index;\n\
  ?>\n```\n\n现在，当您在浏览器中请求 `localhost:8000` 时，生成的页面将如 *图 11.4* 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_310_0.png)\n\
  \n图 11.4: 带有可用产品的客户主页\n\n如您所见，客户主页上的每个产品都有一个 **购买** 按钮。当客户点击此按钮时，产品必须添加到产品购物篮中。此操作由位于\
  \ *view/store/index* 文件夹中的 *index.js* 文件控制：\n\n### index.js\n\n```\nvar addToBasket\
  \ = function() {\n    var api = $(\"#api\").attr(\"url\") + '/' + $(this).\n   \
  \     attr('id');\n    var formData = $(\"#product\" + $(this).attr('id')\n    \
  \    ).serialize();\n$.post(api, formData).done(function(data) {\n    var target\
  \ = $(\"#target\").attr(\"url\");\n    document.location = target;\n}).fail(function()\
  \ {\n    alert('error to insert product into basket');\n});\n});\n\n$(document).ready(function()\
  \ {\n    $(\"button[class='buy']\").click(addToBasket);\n});\n```\n\n购买按钮的点击事件触发\
  \ addToBasket 函数，该函数向 ProductBasketAPIController 类发送 HTTP POST 请求。\n\n在下一节中，我们将实现此类及其他与产品购物篮相关的类。\n\
  \n### 控制产品购物篮\n\n在本节中，我们将实现为客户提供产品购物篮控制的代码。\n\n当客户点击客户主页上某个产品的购买按钮时，请求由 ProductBasketAPIController->create\
  \ 方法处理：\n\n```\npublic function create($data)\n{\n    $inserted = $this->productBasket->create($data);\n\
  \    return new JsonModel(['inserted' => $inserted]);\n}\n```\n\n如您所见，ProductBasketAPIController->create\
  \ 方法调用 ProductBasket->create 方法。\n\nProductBasket->create 方法（其源代码如下所示）在第一次执行时将产品数据添加到容器对象中，之后每次执行时都会递增该产品的请求数量：\n\
  \n```\npublic function create(array $data): bool\n{\n    $inserted = false;\n  \
  \  if (isset($this->container->productBasket[$data['code']])) {\n        $this->container->productBasket[$data['code']]['amount']\
  \ += $data['amount'];\n        $inserted = true;\n    } else {\n        $this->container->productBasket[$data['code']]\
  \ = $data;\n        $inserted = true;\n    }\n\n    return $inserted;\n}\n```\n\n\
  容器对象存储一个数组。该数组在 ProductBasket 类构造函数中初始化：\n\n```\npublic function __construct(Container\
  \ $container)\n{\n    $this->container = $container;\n    if (!isset($this->container->productBasket))\
  \ {\n        $this->container->productBasket = [];\n    }\n}\n```\n\n容器对象是 Laminas\\\
  Session\\Container 的实例。我们在第 9 章“事件驱动身份验证”中已使用过此类，用于在会话中存储员工身份。更准确地说，身份存储在 Laminas\\\
  Authentication\\Storage\\Session 对象中，该对象在会话管理器写入关闭的会话时，在内部使用 Laminas\\Session\\\
  Container 对象进行存储和持久化。开发者无需做任何额外操作来存储此数据，只需调用 authenticate 方法即可。\n\n将产品添加到产品购物篮后，index.js\
  \ 会将客户重定向到 localhost:8000/store/productbasket 端点。该地址将呈现如下所示的页面：\n\n### 产品购物篮\n\n\
  | 代码 | 名称 | 价格 | 数量 | 操作 |\n|---|---|---|---|---|\n| 1 | 附魔之锤 | 9 | 1 | + - 移除 |\n\
  | 合计 | | | 9 | |\n\n继续购买\n\n图 11.5: 产品购物篮的内容\n\n产品购物篮页面由 `view/store/product-basket/index.phtml`\
  \ 文件生成。该文件接收 `ProductBasket->getProducts` 方法的输出，该方法由 `ProductBasketController->indexAction`\
  \ 方法调用。您可以单击 **操作** 列中的 + 或 - 按钮来增减产品数量。要从购物篮中移除产品，请单击 **移除** 按钮。\n\n当您单击 + 或 -\
  \ 按钮时，`ProductBasketAPIController->update` 方法会调用 `ProductBasket->update` 方法，其源代码如下：\n\
  \n```\npublic function update(int $id, array $data): bool\n{\n    $updated = false;\n\
  \    if (!isset($this->container->productBasket[$id])) {\n        return $updated;\n\
  \    }\n\n    $operation = ($data['operation'] ?? 'invalid');\n    if ($operation\
  \ == 'add') {\n        $this->container->productBasket[$id]\n            ['amount']++;\n\
  \        $updated = true;\n    }\n\n    if ($operation == 'sub' && ($this->container->\n\
  ```\n\n\n\n```\nproductBasket[$id]['amount'] > 1)) {\n    $this->container->productBasket[$id]\n\
  \        ['amount']--;\n        $updated = true;\n    }\n    return $updated;\n\
  }\n```\n\nProductBasket->update 方法根据所选操作递增或递减数量。此方法确保最小数量为 1。\n\n当您单击移除按钮时，ProductBasketAPIController->delete\
  \ 方法会调用 ProductBasket->delete 方法，其源代码如下：\n\n```\npublic function delete(int $id):\
  \ bool\n{\n    if (!isset($this->container->productBasket[$id])) {\n        return\
  \ false;\n    }\n    unset($this->container->productBasket[$id]);\n    return true;\n\
  }\n```\n\n将所有想要的产品添加到购物篮后，您可以通过单击关闭订单链接来完成购买。单击此链接后，您应该会看到类似这样的页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_314_0.png)\n\
  \n图 11.6: 客户登录页面\n\n如您所见，图 11.6 显示了客户登录表单。之所以会出现这种情况，是因为客户需要经过身份验证才能完成购买。在下一节中，我们将讨论客户的注册和身份验证。\n\
  \n### 控制客户\n\n如前一节所述，客户需要经过身份验证才能完成购买。当然，起初客户还没有账户。正因如此，登录页面上有一个注册链接。如果您单击此链接，将看到类似这样的页面：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_315_0.png)\n\n图 11.7: 客户注册页面\n\n我们不再重复之前关于注册的细节。我们假设\
  \ module/Store/src/Model 文件夹中有以下类：\n\n- Customer\n- CustomerTable\n- CustomerTableFactory\n\
  \n切勿忘记，必须通过 modules.config.php 文件中的 service_manager 键配置每个表网关类的工厂。\n\n我们还假设 module/Store/src/Controller\
  \ 文件夹中有以下类：\n\n- CustomerAPIController\n- CustomerAPIControllerFactory\n- CustomerController\n\
  - CustomerControllerFactory\n\n与之前的注册相比，客户注册存在差异。API 仅允许创建客户。无法更新或删除客户。当然，这是为了避免客户删除另一客户或修改另一客户的个人数据。客户控制器类由\
  \ module/Store/test/Controller 文件夹中的以下类进行测试：\n\n- CustomerAPIControllerTest\n- CustomerControllerTest\n\
  \n切勿忘记，必须通过 modules.config.php 文件中的 controllers 键配置每个控制器类的别名和工厂。\n\n### 控制器是否始终需要别名？\n\
  \n不需要，如果控制器不是路由路径的一部分，则不需要控制器别名。但是，由于在我们的示例应用程序中将控制器别名作为参数接收，我们需要定义这些别名。\n\n要控制客户身份验证，我们使用\
  \ StoreAuthenticationListener 类，它与 InventoryAuthenticationListener 类非常相似。让我们来看看\
  \ StoreAuthenticationListener::verifyIdentity 方法：\n\n```\npublic static function\
  \ verifyIdentity(MvcEvent $event)\n{\n    $routeName = $event->getRouteMatch() ->\n\
  \    getMatchedRouteName();\n    if ($routeName !== 'store') {\n    return;\n  \
  \  }\n    $params = $event->getRouteMatch()->getParams();\n    $controller = $params['controller'];\n\
  \    if ($controller !== 'order') {\n    return;\n    }\n    $authenticationService\
  \ = new AuthenticationService();\n    if (!$authenticationService->hasIdentity())\
  \ {\n    $action = $params['action'];\n    if ($controller == 'index' && ($action\
  \ ==\n        'index' || $action == 'login')) {\n        return;\n    }\n}\n$event->getRouteMatch()->setParam\n\
  \    ('controller', 'customer');\n$event->getRouteMatch()->setParam('action',\n\
  \    'index');\n}\n}\n```\n\n请注意，此 StoreAuthenticationListener 类仅控制 Store 模块的请求，正如\
  \ InventoryAuthenticationListener 类仅控制 Inventory 模块的请求一样。当然，为了让 StoreAuthenticationListener\
  \ 类监听路由事件，我们需要将其附加到 Store 模块的 Module.php 文件中的 ServiceManager，就像我们在 Inventory 模块中所做的那样。我们需要向\
  \ Module 类添加 onBootstrap 方法，如下一个代码片段所示：\n\n```\npublic function onBootstrap($e)\n\
  {\n    if (defined('PHPUNIT_COMPOSER_INSTALL')) return;\n    $application = $e->getApplication();\n\
  \    $application->getEventManager()->attach\n    (MvcEvent::EVENT_ROUTE,[StoreAuthenticationListener\n\
  \    ::class,'verifyIdentity']);\n}\n```\n\n我们还为客户实现了一个视图层，这与我们为产品和其他模型所做的非常相似。因此，我们假设\
  \ module/Store/view/store/customer 文件夹中有以下视图脚本：\n\n- index.js\n- index.phtml\n-\
  \ register.js\n- register.phtml\n\n在此，我们有两组文件生成两个网页：登录页面 (index.phtml) 和注册页面 (register.phtml)。\n\
  \n注册后，客户可以登录。客户的身份验证与我们在 Inventory 模块中为员工所做的非常相似。一个显著的区别是，我们将 Customer 对象存储在会话中。在\
  \ CustomerController->loginAction 方法中，我们使用身份验证适配器恢复 Customer 对象：\n\n```\nCustomer::setCustomer($this->adapter->getResultRowObject(null,\
  \ 'password'));\n```\n\nAbstractAdapter->getResultRowObject 方法有两个互斥参数。第一个参数定义您要从表中恢复哪些字段。第二个参数定义您希望从恢复中省略表中的哪些字段。\n\
  \nCustomer::setCustomer 静态方法将 Customer 实例存储在会话中：\n\n```\npublic static function\
  \ setCustomer(object $customer): void\n{\n    $container = new Container();\n  \
  \  $container->customer = $customer;\n}\n```\n\n为什么我们需要将 Customer 对象存储在会话中？我们不就可以通过\
  \ AuthenticationService 获取身份数据吗？是的，AuthenticationService 存储用于身份验证的身份，对于客户来说，即电子邮件地址。但是，AuthenticationService\
  \ 不会自动存储其他数据。如果我们想在任何页面上显示客户的姓名，就必须显式存储它。\n\n登录后，客户将被重定向到关闭采购订单的页面，如图 11.8 所示：\n\
  \nWhatstore 主页\n\n看起来是个不错的购买，老兄！\n\n### 关闭采购订单\n\n| 代码 | 名称 | 价格 | 数量 |\n| --- |\
  \ --- | --- | --- |\n| 1 | ENCHANTED HAMMER | 9 | 1 |\n| 合计 | | | 9 |\n\n派发采购订单\n\
  \n继续购买\n\n© 2022 由 Sheet Software 提供支持\n\n图 11.8: 关闭采购订单页面\n\n您可以看到顶部的消息中有客户的姓名。该值从会话中通过\
  \ `Customer::getCustomer` 恢复。在下一节中，我们将了解关闭采购订单页面背后的代码。\n\n### 订单关闭\n\n在上一节中，我们看到客户被重定向到\
  \ `localhost:8000/store/order` 端点。要结束购买，客户必须单击 **派发采购订单** 按钮。此操作会触发 `index.js` 文件中包含的\
  \ `closeOrder` 函数：\n\n### index.js\n\n```\nvar closeOrder = function() {\n    var\
  \ api = $(\"#api\" ).attr(\"url\") + '/0';\n    var target = $(\"#target\" ).attr(\"\
  url\");\n    $.post(api).done(function(data) {\n        if (!data.inserted)\n  \
  \      {\n            alert('purchase order has been not inserted!!');\n       \
  \     return;\n        }\n    });\n    alert('Thank you for buying in Whatstore!\n\
  \    Come back always!')\n    document.location = target;\n}).fail(function() {\n\
  \    alert('error to close the purchase order');\n});\n});\n$(document).ready(function()\
  \ {\n    $(\"#close\").click(closeOrder);\n});\n```\n\ncloseOrder 函数向 localhost:8000/store/orderapi\
  \ 端点发送 HTTP POST 请求。这意味着执行 OrderAPIController->create 方法。让我们逐部分查看此方法的源代码：\n\n- 1.\
  \ 首先，我们恢复客户的身份证件号码 (IDN) 并定义采购订单的初始状态：\n\n```\npublic function create($data)\n{\n\
  \    $idn = Customer::getCustomer()->IDN;\n\n    $set = [\n        'status' => PurchaseOrder::CREATED,\n\
  \        'IDN' => $idn\n    ];\n};\n```\n\n- 2. 然后，我们向 purchase_orders 表插入一条记录。插入后，我们恢复\
  \ code 字段的生成值：\n\n```\n$inserted = false;\ntry {\n    $purchaseOrder = new PurchaseOrder();\n\
  \    $purchaseOrder->exchangeArray($set);\n    $this->purchaseOrderTable->save\n\
  \    ($purchaseOrder);\n    $code = $this->purchaseOrderTable->\n    getLastCreatedCode();\n\
  ```\n\n\n\n\n- 3. 依次遍历产品购物篮，为客户选择的每个产品在 order_items 表中插入一条记录：\n\n```php\n$products\
  \ = $this->productBasket->getProducts();\n\nforeach ($products as $product) {\n\
  \    $set = [\n        'code_order' => $code,\n        'code_product' => $product['code'],\n\
  \        'price' => $product['price'],\n        'amount' => $product['amount']\n\
  \    ];\n    $orderItem = new OrderItem();\n    $orderItem->exchangeArray($set);\n\
  \    $this->orderItemTable->save($orderItem);\n}\n\n$this->productBasket->clear();\n\
  $inserted = true;\n} catch (\\Exception $e) {\n    error_log($e->getMessage());\n\
  }\n\nreturn new JsonModel(['inserted' => $inserted]);\n}\n```\n\n由此可见，在插入采购订单及其条目后，OrderAPIController->create\
  \ 方法会清空产品购物篮。在此方法结束时，响应会发送到 index.js 文件的 closeOrder 函数。如果一切正常，客户将看到以下消息：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_322_0.png)\n\
  \n### 图 11.9：成功购买的消息\n\n单击“OK”按钮后，客户将被重定向到产品购物篮页面，该页面现在是空的，因为产品购物篮已被清空。\n\n但是，等等！支付怎么办？产品交付的监控呢？是的，是的，这些是电子商务系统真实且必要的功能，但我们不会在这本书中实现这些功能。请记住，我们的重点是\
  \ Laminas 组件的功能。whatstore 项目是我们学习 Laminas 的工具。目前，我们有足够的实现来理解迄今为止使用的组件。\n\n> **PHP\
  \ 应用程序的支付组件**\n> 您可以在仓库中找到 PHP 支付组件，例如 Packagist (https://packagist.org)，以及支付集成商的代码仓库，例如\
  \ PayPal (https://github.com/paypal)。\n\n正如本章开头所提议的，我们已实现产品购物篮，包括从其中更新和删除产品，并读取它以创建采购订单。最后，我们将向您展示如何通过解耦模块之间的通用行为来改进\
  \ Inventory 和 Store 模块的身份管理。\n\n### 解耦身份验证的通用行为\n\n我们知道 Inventory 和 Store 模块都有身份验证，但它们针对不同的来源进行身份验证。然而，可以将两个模块共有的内容隔离到一个通用的身份管理类中。\n\
  \n我们将把通用代码从 `Inventory\\Model\\IdentityManager` 提取到复用模块 Generic 中的 `Generic\\Model\\\
  IdentityManager`。让我们只讨论新类中会有所不同的内容。\n\n首先，通用 IdentityManager 类将具有三个受保护属性。该类没有资源表网关属性，因为这是\
  \ Inventory 模块的特例：\n\n```php\nprotected ?AdapterInterface $adapter;\nprotected ?array\
  \ $encryptionMethod;\nprotected ?AuthenticationService $auth;\n\npublic function\
  \ __construct(AdapterInterface $adapter,\n    array $encryptionMethod)\n{\n    $this->adapter\
  \ = $adapter;\n    $this->encryptionMethod = $encryptionMethod;\n    $this->auth\
  \ = new AuthenticationService();\n}\n```\n\n其次，如果身份验证结果有效，IdentityManager->login\
  \ 方法会调用 doCustomTasks 方法。doCustomTasks 方法已声明（不是抽象方法），但为空。`Generic\\Model\\IdentityManager`\
  \ 不是抽象类，因此可以直接实例化；仅需实现即可。此功能旨在避免不必要的继承。\n\n创建 `Generic\\Model\\IdentityManager`\
  \ 后，我们修改 `Inventory\\Model\\IdentityManager` 以继承自第一个类。因此，新的 `Inventory\\Model\\\
  IdentityManager` 精简为四个方法。第一个方法是资源表网关的设置器：\n\n```php\nprivate ?ResourceTable $resourceTable;\n\
  \npublic function setResourceTable(ResourceTable\n    $resourceTable)\n{\n    $this->resourceTable\
  \ = $resourceTable;\n}\n```\n\n第二个方法是重写 `doCustomTasks` 方法，以将不带密码的 `Employee` 实例写入会话并加载访问控制数据：\n\
  \n```php\nprotected function doCustomTasks(): void\n{\n    $this->auth->getStorage()->write($this->adapter->getResultRowObject(null,\
  \ 'password'));\n    $this->loadAuthorizationData();\n}\n```\n\n其他两个方法 `loadAuthorizationData`\
  \ 和 `getRbac` 保持相同的实现，因此无需展示。但是，`Inventory\\Model\\IdentityManagerFactory` 的 `__invoke`\
  \ 方法需要修改，因为现在依赖注入分两个阶段进行：先通过 `IdentityManager` 构造函数，再通过 `setResourceTable` 方法：\n\
  \n```php\npublic function __invoke(ContainerInterface $container,\n    $requestedName,\
  \ ?array $options = null)\n{\n    $adapter = new CredentialTreatmentAdapter($container->get('DbAdapter'));\n\
  \    $adapter->setTableName('employees');\n    $adapter->setIdentityColumn('nickname');\n\
  \    $adapter->setCredentialColumn('password');\n\n    $resourceTable = $container->get('ResourceTable');\n\
  \n    $encryptionMethod = array(new Employee(),\n        'encrypt');\n\n    $identityManager\
  \ = new IdentityManager($adapter,\n        $encryptionMethod);\n    $identityManager->setResourceTable($resourceTable);\n\
  \    return $identityManager;\n}\n```\n\n在为 Inventory 模块扩展 `Generic\\Model\\IdentityManager`\
  \ 之后，我们对 Store 模块也做同样的操作。`Store\\Model\\IdentityManager` 比 Inventory 模块中的对应类更简单。只有一个方法，doCustomTasks：\n\
  \n```php\n<?php\nnamespace Store\\Model;\n\nuse Generic\\Model\\IdentityManager\
  \ as\n    GenericIdentityManager;\n\nclass IdentityManager extends GenericIdentityManager\n\
  {\n    protected function doCustomTasks(): void\n    {\n        Customer::setCustomer($this->adapter->getResultRowObject(null,\
  \ 'password'));\n    }\n}\n```\n\n当然，由于此类有依赖项，因此需要一个工厂类。IdentityManagerFactory->__invoke\
  \ 方法应包含以下内容：\n\n```php\npublic function __invoke(ContainerInterface $container,\n\
  \    $requestedName, ?array $options = null)\n{\n    $adapter = new CredentialTreatmentAdapter($container->get('DbAdapter'));\n\
  \    $adapter->setTableName('customers');\n    $adapter->setIdentityColumn('email');\n\
  \    $adapter->setCredentialColumn('password');\n\n    $encryptionMethod = array(new\
  \ Customer(),\n        'encrypt');\n\n    return new IdentityManager($adapter,\n\
  \        $encryptionMethod);\n}\n```\n\n众所周知，工厂类需要在模块的 `module.config.php` 文件中定义。然后，我们将以下项添加到\
  \ `service_manager.factories` 键中：\n\n```php\nIdentityManager::class => Model\\IdentityManagerFactory::class\n\
  ```\n\n您可能会问：“为什么不直接使用 `IdentityManager` 作为键呢？”答案是 Inventory 模块已经有一个 `IdentityManager`\
  \ 键。因此，我们在这里发现了使用基于短别名的工厂键的问题：名称冲突。直到现在，我们还没有遇到这个问题，但如果出现这种情况，使用完全限定类名（FQCN）作为键以避免名称冲突是一种良好的做法。在\
  \ PHP 中，FQCN 由类的 `class` 静态属性提供。\n\n现在，我们可以真正结束本章了。\n\n### 摘要\n\n在本章中，我们学习了如何实现库存管理，利用了上一章关于注册创建所获得的知识。接着，我们学习了如何使用\
  \ `Placeholder` 和 `PartialLoop` 视图助手重构客户主页。我们更改了 whatstore 应用程序针对 `Store` 模块的主页路由，因为默认用户必须是客户。\n\
  \n然后，我们学习了如何实现产品购物篮，使用 `Laminas\\Session\\Container` 将产品存储在会话中。最后，我们学习了如何为经过身份验证的客户创建采购订单。\n\
  \n最后，我们了解了如何为每个模块解耦身份验证的通用行为，以便它仅实现特定行为。\n\n在下一章中，我们将回顾已实现的功能，并在适当时重构代码。我们还将创建产品搜索框，生成\
  \ API 文档，并封装身份管理。\n\n\n\n"
- "## 审查和改进我们的应用\n\n本章致力于审查和改进我们的 whatstore 应用程序。在上一章中，我们交付了应用程序第一版的需求。然而，没有哪个软件版本能永久存在。新软件始终在构建中。不断变化的软件很可能是死软件。\n\
  \n由于我们认为软件维护意识非常重要，本章将先讨论敏捷开发的基本原则。敏捷方法认识到软件需求在项目执行过程中可能会发生变化。\n\n作为软件开发人员，我们需要确保对代码的任何更改都能尽可能轻松地进行。为此，我们的代码需要尽可能简单。正因如此，在本章中，我们将讨论干净代码的概念，并展示如何消除重复代码，重复代码会使我们的代码变得非常复杂。\n\
  \n在本章中，我们还将对 whatstore 应用程序进行一些小更改，作为在交付版本时才发现的所需功能添加示例。这不是问题，因为我们始终可以发布新版本。问题是我们能多快完成。正因如此，我们正在使用一个框架以及多种工具和技术。\n\
  \n软件可以非常强大，但如果没有人知道如何使用它，它就毫无用处，或者最多也只是为其创建者制作的软件。软件需要文档，其中一部分是 API 文档。在本章中，我们将学习如何使用\
  \ OpenAPI 规范生成 API 文档。\n\n最后，我们将展示软件需要持续的深入分析，因为虽然它可能正在工作，但如果不进行详尽测试，我们可能会为它创建意外行为。对于每个软件，始终预料到意外。在本章中，我们将展示应用程序身份管理中意外行为的示例，在仅实现普通用例时无法察觉。\n\
  \n简而言之，本章将涵盖以下主题：\n\n- 学习敏捷开发原则\n- 消除重复代码\n- 删除不必要的配置\n- 创建产品搜索框\n- 生成 API 文档\n\
  - 为每个模块隔离身份管理\n\n### 技术要求\n\n本章相关代码可在 https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter12/whatstore\
  \ 找到。\n\n### 敏捷开发原则\n\n本章包含一个敏捷开发过程的练习，采用测试驱动开发 (TDD)。敏捷宣言的原则之一指出，我们应持续关注技术卓越并践行良好设计，因为这能提高敏捷性。您可以在\
  \ https://agilemanifesto.org 上了解更多关于敏捷宣言的信息。\n\nTDD 循环的第三个任务是重构。在肯特·贝克所著的 *通过示例的测试驱动开发*\
  \ 中，他将重构定义为“消除仅为了让测试通过而创建的所有重复”。因此，重构似乎只是一个简单的清理任务，但马丁·福勒警告说，重构是确保代码易于维护的基础。他说：\n\
  \n> 设计不良的系统难以更改——因为很难弄清楚\n> 要更改什么，以及这些更改将如何与现有代码交互以获得我\n> 想要的行为。\n>\n> 马丁·福勒，《重构：改善既有代码的设计》\n\
  \n敏捷宣言的另一条原则是，可工作的软件是衡量进度的主要标准。本质上，这就是您的客户想要的——一个可工作的东西。但是，还有另一个宣言，即软件工艺宣言，它指出我们不仅应重视可工作的软件，也应重视精心打造的软件。您可以在\
  \ https://manifesto.softwarecraftsmanship.org 上了解更多关于软件工艺宣言的信息。\n\n从第 6 章“使用行为驱动开发的模型和对象关系映射器”到第\
  \ 11 章“实现产品购物篮”，我们实现了第 5 章“创建虚拟商店项目”中描述的用例。现在我们有一个功能齐全的 Web 应用程序，使用了多个 Laminas 组件。在本章中，我们将审查和改进我们的电子商务应用程序的实现，以生成更干净、更易于维护的代码。\n\
  \n请记住这一点：你只能改进已经存在的东西。可工作的代码可以改进。可工作的代码也通常需要更改以允许新功能或修复错误。在进行所需更改后，代码通常需要审查，以避免未来的维护问题。软件改进是一个无止境的过程。虽然它有用，但它是一个持续改进过程中的产品。\n\
  \n### 消除重复代码\n\n计算机程序是一组指令。计算机的奇妙之处在于，如果指令已经存储，我们不需要为它们重复该指令。我们只需要说明指令在哪里，就像指引阅读手册的人查看特定页面一样。事实上，如果你把手册给某人，他们就不需要再问你里面写了什么。\n\
  \n当我们创建软件时，我们会创建多个手册。这些手册可以是过程、函数、类或特征。所有这些代码结构都是可重用的代码单元。我们有多种方法来避免重复的代码行，方法是将它们集中在这些结构之一中。\n\
  \n重复的代码行会产生更多工作，因为您将不得不修改多行代码，可能在多个文件中，以实现新功能或修复错误。因此，我们必须避免重复的代码行。\n\n有一个有用的工具可以检测\
  \ PHP 程序中的重复行 – **PHP 复制/粘贴检测器 (PHPCPD)**。您可以从 `https://phar.phpunit.de/phpcpd.phar`\
  \ 下载最新版本的 PHPCPD。下载的文件是 `phpcpd.phar`。将此文件重命名为 `phpcpd` 并允许其执行。将 `phpcpd` 移动到系统路径的一个目录中（可见于各处）。\n\
  \n`phpcpd` 程序会比较文件夹中的 PHP 代码并显示重复代码块的成对情况。让我们运行 `phpcpd`。但是，在这样做之前，我们需要删除 `whatstore`\
  \ 目录内的 `vendor` 子目录。为什么？是因为我们只分析自己的代码，而不是依赖项代码。\n\n因此，让我们运行以下命令：\n\n```\n$ phpcpd\
  \ whatstore/\n```\n\n输出将如下所示：\n\n```\nphpcpd 6.0.3 by Sebastian Bergmann.\n\nFound\
  \ 1 clones with 21 duplicated lines in 2 files:\n\n - /opt/lamp/htdocs/whatstore/module/Inventory/src/Model/\n\
  Discount.php:31-52 (21 lines)\n/opt/lamp/htdocs/whatstore/module/Inventory/src/Model/Product.php:33-54\n\
  \n0.33% duplicated lines out of 6422 total lines of code.\nAverage size of duplication\
  \ is 21 lines, largest clone has 21 lines\n\nTime: 00:00.021, Memory: 4.00 MB\n\
  ```\n\n正如您所见，我们的 whatstore 项目中有一些重复的 PHP 行。既然您已检测到包含重复行的文件，可以使用 Eclipse 之类的 IDE\
  \ 来检查是否真的需要重构源代码。您可以在 Eclipse 中选择两个文件，右键单击其中一个，然后选择 **与其他文件比较** 选项，Eclipse 将打开一个类似这样的窗口：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_330_0.png)\n\n图 12.1：Eclipse 中的文件比较\n\
  \n根据 phpcpd 输出，我们已比较了 `Discount.php` 和 `Product.php` 文件。如我们所见，`getInputFilter` 方法中存在一些重复代码块。这些代码块与将输入字段及其过滤器和验证器添加到\
  \ `InputFilter` 实例有关。\n\n现在是重构这些代码块并将其转化为干净代码的时候了。罗伯特·C·马丁在其书籍 *干净代码* 中指出，**干净代码**就是可读代码。您可能会问，如何知道代码是否可读？嗯，斯科特·安布勒在其书籍\
  \ *对象入门* 中建议遵循 **30 秒规则**：如果其他人在 30 秒内无法理解您的代码，那么你\n\n\n\n需要重写它。我有一个额外的建议：尝试编写能够适应文本编辑器窗口的代码块。如果您需要滚动才能看到函数或方法的完整代码，那么这个子例程非常适合精简。\n\
  \n> **源代码、草和兔子**\n> \n> 源代码、草和兔子之间有一个共同点：它们都能非常快速地繁殖。但是，失去对源代码的控制比失去对草或兔子的控制更容易。\n\
  \n让我们以 phpcpd 的输出为例，来看看如何减少重复代码。如果你观察图 12.1 中 getInputFilter 方法的实现，每个输入都有重复的步骤：输入创建、过滤器添加和验证器添加。我们可以创建\
  \ Laminas\\InputFilter\\InputFilter 类的一个扩展，其中包含封装这些步骤的方法。那么，让我们在 Generic 模块中创建 InputFilter\
  \ 类，位于 Generic\\Model 命名空间下，如下所示：\n\n### InputFilter.php\n\n```php\n<?php\ndeclare(strict_types=1);\n\
  \nnamespace Generic\\Model;\n\nuse Laminas\\InputFilter\\InputFilter as LaminasInputFilter;\n\
  use Laminas\\InputFilter\\Input;\nuse Laminas\\Filter\\FilterChain;\nuse Laminas\\\
  Validator\\ValidatorChain;\n\nclass InputFilter extends LaminasInputFilter\n{\n\
  \    public function addInput(string $name, array $filters = [],\n    array $validators\
  \ = []): self\n    {\n        $input = new Input($name);\n        $filterChain =\
  \ new FilterChain();\n        foreach($filters as $filter) {\n            $filterChain->attach($filter);\n\
  \        }\n\n        $input->setFilterChain($filterChain);\n        $validatorChain\
  \ = new ValidatorChain();\n        foreach($validators as $validator) {\n      \
  \      $validatorChain->attach($validator);\n        }\n        $input->setValidatorChain($validatorChain);\n\
  \        $this->add($input);\n        return $this;\n    }\n}\n```\n\naddInput 方法接收输入名称、过滤器集和验证器集作为参数。addInput\
  \ 方法返回 InputFilter 实例的引用。因此，我们可以在一条指令中从 InputFilter 实例调用多个方法——例如，在一条指令中添加两个字段：\n\
  \n```php\n$inputFilter = new InputFilter();\n$inputFilter->addInput(\"code\") ->addInput(\"\
  name\");\n```\n\n您不需要重复 InputFilter 实例的变量名来调用另一个方法，或多次调用相同的方法。对于那些本来不会返回任何内容的方法，返回\
  \ $this 是一个优势。\n\n接下来，我们将在 Discount 和 Product 类中用 Generic\\Model\\InputFilter 替换\
  \ Laminas\\InputFilter\\InputFilter。这种替换将在几行代码中减少 getInputFilter 的实现。例如，Discount\
  \ 类的 getInputFilter 方法将如下所示：\n\n```php\npublic function getInputFilter() : InputFilter\n\
  {\n    $inputFilter = new InputFilter();\n\n    $inputFilter->addInput('code', [new\
  \ ToInt()])\n    ->addInput('name',\n    [\n        new StringToUpper(),\n     \
  \   new Alnum(true)\n    ],\n    [new StringLength(['min' => 3])]\n    )\n    ->addInput('operator',\
  \ [\n        new AllowList(['list' => ['-','*','/']])\n    ])\n    ->addInput('factor',\
  \ [new ToFloat()]);\n\n    return $inputFilter;\n}\n```\n\n请注意，我们多次调用 addInput 方法，但只需使用一次\
  \ $inputFilter 变量。这是因为 addInput 方法返回 InputFilter 实例的引用。\n\n好了，我们缩短了 Discount->getInputFilter\
  \ 方法几行代码。同样，我们也可以缩短 Product->getInputFilter 方法几行代码。重构源代码后，我们需要运行测试来检查一切是否仍然正常工作。在运行测试之前，我们需要通过运行\
  \ composer install 命令重新创建 vendor 目录。\n\n在检查所有代码都能通过测试，并且再次删除 vendor 目录后，我们可以再次运行\
  \ phpcpd。重构后，这次我们将看到如下输出：\n\n```\n$ phpcpd whatstore/\nphpcpd 6.0.3 by Sebastian\
  \ Bergmann.\n\nNo clones found.\n\nTime: 00:00.563, Memory: 4.00 MB\n```\n\n如您所见，重构已消除了\
  \ whatstore 项目中的重复代码。phpcpd 工具非常有用，可以帮助我们结合 TDD 查找重复代码。\n\n> **PHP 混乱检测器**\n> \n\
  > 还有一个名为 **PHP 混乱检测器 (PHPMD)** 的有趣的 PHP 命令行工具。该工具用于查找 PHP 源代码中的多种潜在问题，例如可能的错误、次优代码、过于复杂的表达式以及未使用的参数、方法和属性。建议您将\
  \ PHPMD 与 IDE 配合使用。您可以从 https://phpmd.org 下载 PHPMD。\n\n在下一节中，我们将进行更多重构，这次是为了删除不必要的配置。\n\
  \n### 删除不必要的配置\n\n在上一节中，我们学习了如何查找和删除源代码的克隆。克隆是原件的精确副本，如《星球大战》中的贡戈·费特克隆人。克隆不是长得相似但并不完全相同的孪生兄弟，如电影《双胞胎》中的阿诺德·施瓦辛格和丹尼·德维托。因此，phpcpd\
  \ 可能找不到相似的源代码片段，因为它们之间有一些小的差异。在我们的情况中，有关视图和布局的一些源代码片段是相似的。\n\n正如我们在第 5 章“创建虚拟商店项目”的“为我们的项目准备模块”部分所决定的，Application\
  \ 模块将定义应用程序布局。我们还说，modules.config.php 数组中的最后一个模块是定义应用程序布局的模块。但是为什么以及如何实现呢？\n\n您已经观察到，在\
  \ Laminas MVC 应用程序中存在多个配置文件。根 config 文件夹中有文件，每个模块也有一个配置文件。当应用程序初始化时，所有这些文件会被合并到一个配置数组中，或者更准确地说，合并到一个数据映射中。每个映射键都是唯一的，因此，如果相同的映射键存在于不同的配置文件中，那么合并过程中其中一个值会丢失。最后合并的文件会覆盖之前的文件，因此模块列表中的最后一个模块会覆盖其他模块的布局配置。\n\
  \n但是，如果相同的配置键对每个模块都不是必需的，就没有必要覆盖值。module.config.php 文件中 view_manager 键的大多数子键就是这种情况。只有应用程序模块需要所有子键，因为它定义布局和错误模板。\n\
  \n因此，Application 模块的 module.config.php 文件中 view_manager 键应如下所示：\n\n```php\n'view_manager'\
  \ => [\n    'display_not_found_reason' => true,\n    'display_exceptions'      \
  \ => true,\n    'doctype'                  => 'HTML5',\n    'not_found_template'\
  \       => 'error/404',\n    'exception_template'       => 'error/index',\n    'template_map'\
  \ => [\n        'layout/layout'           => __DIR__ . '/../view/layout/layout.phtml',\n\
  \        'error/404'               => __DIR__ . '/../view/error/404.phtml',\n  \
  \      'error/index'             => __DIR__ . '/../view/error/index.phtml',\n  \
  \  ],\n    'template_path_stack' => [\n        __DIR__ . '/../view',\n    ],\n],\n\
  ```\n\n请注意，我们已从 template_map 中删除了 application/index 项。这是因为该项也不是必需的。事实上，我们不需要为 Application/\
  \ IndexController->indexAction 方法创建页面。我们可以删除 view/application/ index 文件夹，并使用重定向来重构上述方法：\n\
  \n```php\npublic function indexAction()\n{\n    return $this->redirect()->toRoute('home');\n\
  }\n```\n\n因此，如果有人输入 /application 路径，此人将被重定向到主页，即 Store 模块的主页。\n\n好了，让我们为其他模块（Inventory\
  \ 和 Store；Generic 没有视图）丢弃不必要的视图配置。对于 Inventory 模块，view_manager 键应如下所示：\n\n```php\n\
  'view_manager' => [\n    'template_path_stack' => [\n        __DIR__ . '/../view',\n\
  \    ],\n    'strategies' => [\n        'ViewJsonStrategy',\n    ],\n],\n```\n\n\
  正如我们在构建 API 时所学到的，strategies 中的 ViewJsonStrategy 值使控制器能够以 JSON 进行响应。\n\n对于 Store\
  \ 模块，view_manager 键应如下所示：\n\n```php\n'view_manager' => [\n    'template_path_stack'\
  \ => [\n        __DIR__ . '/../view',\n    ],\n],\n```\n\ntemplate_path_stack 子键是必需的，因为每个模块都有自己的视图文件夹。\n\
  \n\n\n\n\n因此，我们移除了 phpcpd 未检测到的不必要的代码行，因为它们并非完美克隆。应用程序仍像之前一样运行，但现在不再合并无用的配置数据。\n\
  \n在下一节中，我们将进行更多重构，这次是为了实现一个新功能。\n\n### 创建产品搜索框\n\n当前 whatstore 主页列出了所有已注册的产品，但访问此页面的客户可能在搜索特定产品。因此，页面上需要有一个搜索引擎。我们本可以实现这个功能，因为我们认为这是一个好功能，但事实上，我们将实现它是因为这是客户的一个需求。这是在第\
  \ 5 章“创建虚拟商店项目”中提到的第二个需求——客户区域的主页必须允许他们按名称（完全或部分）搜索产品。\n\n让我们在 module/Store/view/store/index\
  \ 文件夹中的 index.phtml 文件里插入一个 HTML 表单。这个 HTML 表单将位于显示产品购物篮和登录链接的 HTML 表格内，如下面的代码片段所示：\n\
  \n```\n<h1>Our products</h1>\n<table style=\"width: 100%\">\n<tbody>\n<tr>\n<td><a\
  \ href=\"<?=$this->url('store', ['controller' =>\n'productbasket']) ?>\">Product\
  \ Basket</a></td>\n<td>\n<form method=\"post\" action=\"<?=$this->url('store') ?>\"\
  >\n<input type=\"text\" name=\"name\"/>\n<input type=\"submit\" value=\"search\"\
  />\n</form>\n</td>\n<td><a href=\"<?=$this->url('store', ['controller' =>\n'customer',\
  \ 'action' => $link['action']]) ?>\"\n<?=$link['label'] ?></a></td>\n</tr>\n</tbody>\n\
  </table>\n```\n\n前面的代码片段将呈现一个搜索框，如图 12.2 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_337_0.png)\n\
  \nFigure 12.2: whatstore 主页上的搜索框\n\n搜索表单将向 Store 模块的 IndexController 默认操作发送一个 HTTP\
  \ POST 请求。然后，我们需要用以下实现修改默认操作，即 indexAction 方法：\n\n```\npublic function indexAction()\n\
  {\n    $name = $this->getRequest()->getPost('name');\n    $where = null;\n    if\
  \ (!empty($name)) {\n        $where = new Where();\n        $name = strtoupper($name);\n\
  \        $where->like('products.name', \"%$name%\");\n    }\n    $products = $this->productTable->getAll($where);\n\
  \    $form = new ProductForm();\n    return new ViewModel([\n        'form' => $form,\n\
  \        'products' => $products\n    ]);\n}\n```\n\n你可以看到，在 IndexController->indexAction\
  \ 方法中，我们添加了对 HTTP POST 请求提供的数据的检查。如果发送了 name 字段，产品的数据表网关（ProductTable 类）将接收一个 Where\
  \ 对象，该对象配置了 SQL LIKE 运算符。Laminas 的 Where 类封装了所有 SQL SELECT 运算符以过滤查询。我们使用了 strtoupper\
  \ 函数，因为产品名称以大写形式存储。\n\n当然，为了让 ProductTable->getAll 方法能够执行 SQL SELECT 语句，我们必须修改该方法，因为当前实现仅期望等量过滤条件。为了支持使用\
  \ LIKE 和任何其他 SQL SELECT 运算符，ProductTable->getAll 方法必须更改为以下代码片段：\n\n```\npublic function\
  \ getAll($where = null): iterable {\n    $select = new Select($this->\n        tableGateway->getTable());\n\
  \    $select->join('discounts', 'products.code_discount\n        =discounts.code',\
  \ ['name_discount' => 'name']);\n    if (!is_null($where)) {\n        if (is_array($where))\
  \ {\n            $parsedWhere = [];\n            foreach($where as $index => $value)\
  \ {\n                $parsedWhere['products.' . $index] =\n                $value;\n\
  \            }\n            $select->where($parsedWhere);\n        } else {\n  \
  \          $select->where($where);\n        }\n    }\n    return $this->tableGateway->selectWith($select);\n\
  }\n```\n\n请记住，ProductTable->getAll 方法已经支持多个由 AND 运算符连接的等量过滤条件。现在，该方法可以通过 Laminas\
  \ Where 类使用任何 SQL SELECT 运算符。\n\n通过对三个文件进行这些外科手术式的修改，客户现在可以在主页上按名称搜索产品。\n\n在下一节中，我们将学习如何生成\
  \ API 文档。\n\n### 生成 API 文档\n\n如果没人知道，拥有成千上万个功能也没有任何用处。开发者需要文档。\n开发者可能会忘记自己上周做了什么，更不用说有新开发者在项目中期加入的情况。这是一个重要的一点。\n\
  \n另一个重要的一点是其他客户端对我们应用程序 API 的消费。我们在第 7 章“请求控制和数据视图”中讨论过这一点。客户端的创建者和维护者需要良好的文档来了解如何消费\
  \ whatstore 服务。\n\n在本节中，我们将基于 OpenAPI 规范（即 Swagger 规范）创建 API 文档。有一个很棒的组件可以从 PHP\
  \ 注释生成 Swagger 文档——swagger-php。但是 swagger-php 要求你编写一些 PHP 代码来生成 Swagger 文档。我们将使用另一个组件\
  \ swagger-docs，它扩展了 swagger-php 且只需要在要记录的类中使用注释。\n\n> Swagger\n> 你可以在 https://swagger.io/resources/open-api\
  \ 上阅读更多关于 Swagger 的内容。\n\n我们将使用 Composer 安装 swagger-docs，如下所示：\n\n```\ncomposer\
  \ require fgsl/swagger-docs\n```\n\n你也可以使用 Eclipse Composer 界面，正如我们在第 3 章“将 Laminas\
  \ 用作带有测试驱动开发的库”中学到的那样。\n\n我们需要在一个文件中添加一个 @OA\\Info 注解，以定义 API 文档的标题和版本。我们将在 Application\
  \ 模块的一个新控制器类 APIController 中包含此注解。注解块将紧跟在类声明之前，如下面的完整源代码所示：\n\n### APIController.php\n\
  \n```\n<?php\ndeclare(strict_types=1);\nnamespace Application\\Controller;\nuse\
  \ Laminas\\Mvc\\Controller\\AbstractActionController;\nuse Laminas\\View\\Model\\\
  ViewModel;\n/**\n* @OA\\Info(title=\"Whatstore API\", version=\"0.1\")\n*/\nclass\
  \ APIController extends AbstractActionController\n{\n    public function indexAction()\n\
  \    {\n        $view = new ViewModel();\n        $view->setTerminal(true);\n  \
  \      return $view;\n    }\n}\n```\n\n你可能在想 setTerminal 方法是做什么用的。这个方法禁用此操作使用的布局。我们这样做是因为\
  \ API 页面不会使用布局。\n\nAPIController->indexAction 方法需要一个 index.phtml 文件。我们这里没有显示此文件的内容，但可以在“技术要求”部分提到的\
  \ URL 中找到。这个 API 页面的模型基于 https://github.com/fgsl/swagger-docs#model-for-api-page\
  \ 提供的模板。该模板有一个占位符 [WEB ROOT ROUTE]，应该替换为 <?=$this->url('home') ?>。反过来，这条指令将生成指向\
  \ Web 根端点的超链接。\n\n接下来，我们将为 API 文档创建一个特定路由。在 Application 模块的 module.config.php 文件中，我们将添加以下路由配置作为\
  \ routes 键的一个新元素：\n\n```\n'api' => [\n    'type' => Literal::class,\n    'options'\
  \ => [\n        'route' => '/api',\n        'defaults' => [\n            'controller'\
  \ => Controller\\APIController::class,\n            'action' => 'index',\n     \
  \   ],\n    ],\n],\n```\n\n在创建 API 路由、控制器和无布局页面后，我们可以在类中编写注解。我将以 `Inventory` 模块的\
  \ `ProductAPIController` 类为例，展示注解块代码。该块的样子如下：\n\n```\n/**\n * @OA\\Post(\n *   \
  \  path=\"/inventoryapi/productapi/{key}\",\n *     @OA\\Parameter(\n *        \
  \ name=\"key\",\n *         in=\"path\",\n *         description=\"product code\"\
  ,\n *         required=false\n *     ),\n *     @OA\\RequestBody(\n *         @OA\\\
  MediaType(mediaType=\"multipart/form-data\",\n *             @OA\\Schema(\n *  \
  \               @OA\\Property(property=\"code\",type=\"integer\"),\n *         \
  \        @OA\\Property(property=\"name\",type=\"string\"),\n *                 @OA\\\
  Property(property=\"price\",type=\"float\"),\n *                 @OA\\Property(property=\"\
  code_discount\",type=\"integer\"),\n *                 required={\"name\", \"price\"\
  , \"code_discount\"}\n *             )\n *         )\n *     ),\n *     @OA\\Response(response=\"\
  200\", description=\"insert a product\"),\n *     @OA\\MediaType(mediaType=\"application/json\"\
  )\n * )\n */\n```\n\n让我们来理解每个注解：\n\n- @OA\\Post 告诉我们，注解块之后的方法会发出 HTTP POST 请求。path\
  \ 参数是 Web 服务的 URL。花括号中的名称（key）是由 @OA\\Parameter 注解定义的变量参数。\n- @OA\\Parameter 告诉我们需要随请求发送的参数。in\
  \ 参数取 path 值表示参数必须放在 URL 中。\n\n\n\n\n\n- @OA\\RequestBody 包含 HTML 表单字段的定义。\n- @OA\\\
  MediaType 在 @OA\\RequestBody 内告知我们 HTML 表单 enctype 属性的值。\n- @OA\\Schema 包含一组表单字段。每个字段由\
  \ @OA\\Property 注解定义。\n- @OA\\Response 告诉我们预期的 HTTP 代码和响应的描述。\n- 末尾的 @OA\\MediaType\
  \ 告诉我们 HTTP 响应的 Content-Type 标头。\n\n编写完注解代码块后，我们可以像这样运行 swagger-docs 命令：\n\n```\n\
  vendor/bin/fsd module\n```\n\n我们将 module 作为参数传递，因为 module 是存放类的目录。如果需要，您可以使用在第 2\
  \ 章“为我们的电子商务应用程序设置环境”中学到的知识，将 fsd 命令集成到 Eclipse 工具栏中。\n\n运行 fsd 命令后，我们访问 http://localhost:8000/api，将看到类似图\
  \ 12.3 的页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_342_0.png)\n\n图 12.3: 带有插入产品端点的\
  \ API 页面\n\n请注意，页面显示一行，包含插入产品操作的路径，前面是 HTTP 方法。如果单击路径，该项将展开，显示类似图 12.4 的视图。\n\n\
  POST /inventoryapi/productapi/{key}\n\n**参数**\n| 名称 | 描述 |\n|------|-------------|\n\
  | key (path) | 产品代码 |\n\n**请求体**\nmultipart/form-data\n- code (integer)\n- name\
  \ * 必需 (string)\n- price * 必需 (float)\n- code_discount * 必需 (integer)\n\n**响应**\n\
  | 代码 | 描述 | 链接 |\n|------|-------------|-------|\n| 200 | 插入一个产品 | 无链接 |\n\n图 12.4:\
  \ 插入产品 API 的展开视图\n\n我们可以从 Swagger 视图向 whatstore 应用程序发送请求。您可以看到右上角有一个“试用”按钮。单击此按钮后，表单字段将变为可编辑，并出现“执行”按钮。让我们看看\
  \ Swagger 页面上获取产品的请求示例。\n\n我们将在 ProductAPIController->get 方法的声明之前添加一个注解代码块。该块将如下所示：\n\
  \n```\n/**\n * @OA\\Get (\n *     path=\"/inventoryapi/productapi/{key}\",\n * \
  \    @OA\\Parameter (\n *         name=\"key\",\n *         in=\"path\",\n *   \
  \      description=\"product code\",\n *         required=false\n *     ),\n * \
  \    @OA\\Response(response=\"200\", description=\"get a product\"),\n *     @OA\\\
  MediaType(mediaType=\"application/json\")\n *     )\n */\n```\n\n再次运行 fsd 命令后，我们将拥有类似这样的\
  \ API 页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_344_0.png)\n\n图 12.5: 带有 GET\
  \ 和 POST 方法端点的 API 页面\n\n如果单击产品 HTTP GET 请求的项，页面将展开该项，显示一个表单，如图 12.4 所示。当单击**试用**按钮时，会出现两个按钮，**执行**和**清除**，如图\
  \ 12.6 所示。\n\nWhatstore API\n\ndefault\n\n| 名称 | 描述 |\n|---|---|\n| key (path) |\
  \ 产品代码 |\n\n图 12.6: 用于发出 HTTP GET 请求的表单\n\n使用有效值填写产品代码字段并单击**执行**按钮后，页面将显示一个带有请求响应的部分，如图\
  \ 12.7 所示。\n\n响应\n\n```\ncurl -X GET \"http://localhost:8000/inventoryapi/productapi/1\"\
  \ -H \"accept: */*\"\n```\n\n```\nhttp://localhost:8000/inventoryapi/productapi/1\n\
  ```\n\n| 代码 | 详情 |\n|---|---|\n| 200 | 响应正文 |\n\n```\n{\n \"product\": {\n \"code\"\
  : 1,\n \"name\": \"ENCHANTED HAMMER\",\n \"price\": 9,\n \"code_discount\": 1\n\
  \ }\n}\n```\n\n```\nconnection: close\ncontent-type: application/json; charset=utf-8\n\
  Date: Sat, 14 May 2022 20:15:53 GMT host: localhost:8000\nX-powered-by: PHP/8.0.5\n\
  ```\n\n| 代码 | 描述 | 链接 |\n|---|---|---|\n| 200 | 获取一个产品 | 无链接 |\n\n图 12.7: Swagger\
  \ 页面上的输出响应部分\n\n目前，请注意我们有一个获取单个产品的方法；但是，我们没有获取产品列表的方法。没关系。我们可以向 `ProductAPIController`\
  \ 类添加一个用于此目的的方法。`AbstractRestfulController` 父类通过键参数区分针对单个元素和列表的 HTTP `GET` 请求。如果\
  \ HTTP `GET` 请求没有键参数，`AbstractRestfulController` 父类将执行 `getList` 方法。然后，我们实现此方法，它将如下所示：\n\
  \n```\n/**\n * @OA\\Get(\n *     path=\"/inventoryapi/productapi\",\n *     @OA\\\
  Response(response=\"200\", description=\"get list of products\"),\n *     @OA\\\
  MediaType(mediaType=\"application/json\")\n * )\n*/\npublic function getList()\n\
  {\n    $resultSet = $this->productTable->getAll();\n    $products = [];\n    foreach($resultSet\
  \ as $result){\n        $products[] = $result->toArray();\n    }\n    return new\
  \ JsonModel(['products' => $products]);\n}\n```\n\n现在，我们只需为每个公共控制器方法编写注解代码块并运行 `fsd`\
  \ 命令，即可获得一个完整的 API 文档页面（图 12.8），该页面还允许我们测试 whatstore 应用程序的请求。\n\n![](img/e6cf5550804ccae9d1859270da8688f5_347_0.png)\n\
  \n图 12.8: 使用 Swagger 生成的完整 API 文档页面顶部\n\n在下一节也是最后一节中，我们将审查 whatstore 的身份验证实现并重构它们以避免安全问题。\n\
  \n### 为每个模块隔离身份管理\n\n在第 9 章“事件驱动身份验证”中，我们学习了如何为库存模块中的员工实现身份验证控制。在第 11 章“实现产品购物篮”中，我们学习了如何为商店模块中的客户实现身份验证控制。因此，whatstore\
  \ 应用程序有两个身份验证控制，两者都使用 laminas-authentication 组件。\n\n身份验证控制基于事件。具体来说，它基于 Laminas\
  \ EVENT_ROUTE 事件。身份检查通过监听器类完成，具体来说是库存模块中的 InventoryAuthenticationListener 和商店模块中的\
  \ StoreAuthenticationListener。这两个类使用相同的代码行检查身份：\n\n```php\n$authenticationService\
  \ = new AuthenticationService();\nif (!$authenticationService->hasIdentity()) {\n\
  }\n```\n\n事实上，InventoryAuthenticationListener 没有这些行，而是调用 IdentityManager->hasIdentity\
  \ 方法，该方法包含这些行。然而，归根结底，这两个监听器类都使用相同的代码行来检查身份验证状态。\n\n查看此代码，我们可以看到 `AuthenticationService->hasIdentity`\
  \ 方法返回一个布尔值。也许您以前不需要担心这个问题，但现在请考虑一下——`AuthenticationService` 如何知道是否存在经过身份验证的身份？\n\
  \n在这里，我们有自由开源软件的一个优势示例——我们可以看到事物的工作原理。如果找到 `AuthenticationService->hasIdentity`\
  \ 方法的源代码，我们将看到以下行：\n\n```php\npublic function hasIdentity()\n{\n    return ! $this->getStorage()->isEmpty();\n\
  }\n```\n\n请注意，如果其存储不为空，`AuthenticationService` 会回答存在经过身份验证的身份。但是，未测试存储内容。如果只有一个身份验证控制，这不是问题，但对于拥有多个身份验证控制的系统（例如\
  \ whatstore），可能会导致意外行为。\n\n这种意外行为是什么？想象一下，一位客户在商店模块中经过身份验证。具体来说，这位客户 Mr. Bad Guy\
  \ 是个怀有不良动机的人。他尝试调用一些端点以发现一些有趣的 URL，直到他发现有一个 `/inventory` 路由。预期的行为是 `/inventory`\
  \ 路由显示登录页面。但是，已经在 `Store` 模块中经过身份验证的 Mr. Bad Guy 会直接进入 `Inventory` 模块的菜单页面。这并不意味着\
  \ Mr. Bad Guy 将能够访问 `Inventory` 注册，因为还有授权控制，但这种直接访问菜单页面显然是安全漏洞。\n\n问题的原因是什么？是在同一应用程序中为两个身份验证控制使用\
  \ `AuthenticationService->hasIdentity` 方法。`laminas-authentication` 文档仅针对一个身份验证控制提供示例。这表明\
  \ `AuthenticationService->hasIdentity` 方法通常仅用于一个身份验证控制。事实上，您可以根据需要使用 `laminas-authentication`\
  \ 组件实现任意数量的身份验证控制。只需隔离每个身份验证上下文。这意味着要避免直接使用 `AuthenticationService->hasIdentity`\
  \ 方法来检查身份验证是否成功。我们将在下一节这样做。\n\n### 修改身份管理类\n\n我们已经创建了一个通用身份管理类（`IdentityManager`，位于\
  \ `Generic` 模块中）并为每个模块对其进行了扩展。现在，我们将根据上下文修改此类来管理身份——更具体地说，是身份管理器类的命名空间，每个模块的命名空间都不同。让我们分三步修改\
  \ `Generic\\Model\\IdentityManager` 类。\n\n\n\n\n首先，让我们向类中添加一个 getNamespace 方法：\n\
  \n```\nprotected function getNamespace() : string\n{\n    $fqcn = explode('\\\\\
  ',static::class);\n    return $fqcn[0];\n}\n```\n\n此方法将返回被调用类的命名空间。这意味着它并不完全是一个\
  \ Generic 命名空间。如果该方法由子类调用，则考虑的命名空间将是子类的命名空间。例如，如果由 Inventory\\\\Model\\\\IdentityManager\
  \ 调用 getNamespace 方法，它将返回 Inventory。\n\n第二步是修改 Generic\\\\Model\\\\IdentityManager->__construct\
  \ 方法：\n\n```\npublic function __construct(AdapterInterface $adapter,\narray $encryptionMethod)\n\
  {\n    $this->adapter = $adapter;\n    $this->encryptionMethod = $encryptionMethod;\n\
  \    $this->auth = new AuthenticationService();\n    $storage = new Session($this->getNamespace());\n\
  \    $this->auth->setStorage($storage);\n}\n```\n\n请注意，我们向构造方法中添加了两行新代码。我们实例化了 Laminas\\\
  \\Authentication\\\\Storage\\\\Session 类，并将 getNamespace 方法返回的命名空间值定义为命名空间。因此，我们将在会话中拥有一个命名空间，从而避免不同\
  \ IdentityManager 实例之间可能出现的会话键覆盖问题。\n\n第三步是修改 Generic\\\\Model\\\\IdentityManager->hasIdentity\
  \ 方法：\n\n```\npublic function hasIdentity() : bool\n{\n    if ($this->auth->hasIdentity())\
  \ {\n        $storage = $this->auth->getStorage();\n        error_log('namespace:\
  \ ' . $storage->getNamespace());\n        return ($storage->getNamespace() == $this->getNamespace());\n\
  \    }\n    return false;\n}\n```\n\n现在，我们不仅检查是否存在经过身份验证的会话，还检查存储会话命名空间是否与 IdentityManager\
  \ 实例的命名空间相同。在下一节中，我们将使用这个新的 IdentityManager 类来重构 Store 模块的 StoreAuthenticationListener\
  \ 和 IndexController 类。\n\n### 重构侦听器和控制器类\n\n在本节中，我们将重构 Store\\\\Listener\\\\StoreAuthenticationListener\
  \ 和 Store\\\\Controller\\\\IndexController 类中的一些行。在 StoreAuthenticationListener\
  \ 类中，我们首先定位这些行：\n\n```\n$authenticationService = new AuthenticationService();\n\
  if (!$authenticationService->hasIdentity()) {\n```\n\n将它们替换为以下行：\n\n```\n$identityManager\
  \ = $event->getApplication()->getServiceManager()->get(IdentityManager::class);\n\
  if (!$identityManager->hasIdentity()) {\n```\n\n请记住，在这种情况下，IdentityManager 特指 Store\\\
  \\Model\\\\IdentityManager。\n\n在 Store\\\\Controller\\\\IndexController 中，我们将添加一个新属性并修改构造方法以使用该属性：\n\
  \n```\nprivate IdentityManager $identityManager;\npublic function __construct(ProductTable\
  \ $productTable,\nIdentityManager $identityManager) {\n$this->productTable = $productTable;\n\
  $this->identityManager = $identityManager;\n}\n```\n\n在 Store\\\\Controller\\\\\
  IndexController->indexAction 方法中，我们将向注入到 ViewModel 实例的数组中添加一个键：\n\n```\nreturn new\
  \ ViewModel([\n\"form\" => $form,\n\"products\" => $products,\n\"authenticated\"\
  \ => $this->identityManager->hasIdentity()\n]);\n```\n\n当然，如果我们修改了控制器构造方法，就需要调整其在\
  \ Store\\\\Controller\\\\IndexControllerFactory 中的工厂方法：\n\n```\npublic function\
  \ __invoke(ContainerInterface $container,\n$requestedName, array $Options = null)\
  \ {\n$identityManager = $container->get(IdentityManager::class);\nreturn new CustomerController($identityManager);\n\
  }\n```\n\n现在，我们将定位 view\\\\store\\\\index\\\\index.phtml 文件中的这些行：\n\n```\n$authenticationService\
  \ = new AuthenticationService();\n$link = [\"action\" => \"index\", \"label\" =>\
  \ \"Login\"];\nif ($authenticationService->hasIdentity()) {\n```\n\n将它们替换为以下行：\n\
  \n```\n$link = [\"action\" => \"index\", \"label\" => \"Login\"];\nif ($this->authenticated)\
  \ {\n```\n\n这样，我们避免了视图脚本与身份验证类的耦合，将视图脚本限制为仅使用变量，这更为合适。视图脚本的良好做法是仅使用控制器类发送的变量。\n\n\
  因此，我们已完成隔离 whatstore 应用程序中两个身份验证控件所需的更改。我们不再需要担心“坏家伙”了。\n\n在本节中，我们已隔离身份管理，以避免一个模块的用户对另一个模块拥有特权和非允许的访问。为实现此目的，我们修改了用于身份管理的通用类\
  \ Generic\\\\Model\\\\IdentityManager。最后，我们重构了 StoreAuthenticationListener 和 CustomerController\
  \ 类，以使用继承的 Store\\\\Model\\\\IdentityManager 类。\n\n### 总结\n\n在本章中，我们首先讨论了一些敏捷开发概念，这些概念对软件维护非常重要。在这些概念之后，我们学习了如何使用免费开源的\
  \ phpcpd 工具轻松检测 PHP 程序中的重复代码。在检测模型类中需过滤和验证的重复代码块后，我们展示了如何在 Laminas\\\\InputFilter\\\
  \\InputFilter 类的扩展中统一这些代码块。\n\n接下来，我们学习了如何创建产品搜索框。为此，我们必须修改 ProductTable 类以执行带有\
  \ LIKE 运算符的 SQL SELECT 查询。\n\n然后，我们学习了如何使用免费开源的 swagger-docs 工具生成 API 文档。在演示如何使用\
  \ OpenAPI Specification 生成带有 REST 端点的丰富 HTML 页面时，我们还学习了如何实现 REST 请求以列出集合。\n\n最后，我们学习了如何隔离身份管理，以避免在存在多个身份验证控件时出现安全问题。\n\
  \n在下一章中，我们将介绍一些技巧和窍门，帮助开发人员解决在构建面向对象的 PHP Web 应用程序时可能最终出现的一些问题。\n"
- "## 技巧和窍门\n\n本章提供了一些技巧和窍门，将帮助你作为开发人员解决在构建 Web 应用程序时可能最终出现的一些问题。\n\n我们将首先学习创建映射模型（即连接到数据库表的类）所需的方法是什么。\n\
  \n之后，我们将学习如何自定义过滤器和验证器，以在模型层中实现特定业务规则。\n\n然后，我们将更好地了解 Laminas 视图层，学习如何生成 JSON 响应、管理文件上传以及更改应用程序布局。\n\
  \n最后，我们将掌握 Laminas 控制器层，学习如何检测 AJAX 请求、如何在控制器层和视图层之间交换消息，以及结束控制器操作的不同方式。\n\n到本章结束时，你将能够使用\
  \ Laminas 框架满足 Web 应用程序的最终需求。\n\n本章将涵盖以下主题：\n\n- 创建映射模型\n- 自定义过滤器和验证器\n- 了解 Laminas\
  \ 视图层\n- 掌握控制器层\n\n### 技术要求\n\n本章相关的所有代码均可在两个仓库中找到：\n\n- https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter13/tipsandtricks\n\
  - https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter13/whatstore\n\
  \n第一个 URL 包含一个名为 `tipsandtricks` 的 Laminas 应用程序。本章中的所有代码示例均可在 `tipsandtricks` 中找到。你可以使用\
  \ PHP 作为 Web 服务器运行此应用程序，就像我们在 _第 2 章，为我们的电子商务应用程序设置环境_ 中使用 `myfirstlaminas` 应用程序一样。\n\
  \n第二个 URL 是用于我们的电子商务应用程序 `whatstore`，其中与使用过滤器相关有一些小修改。这将在 _创建自定义过滤器_ 部分中解释。\n\n\
  ### 创建映射模型\n\n这是一个有用的技巧，可在使用 `laminas-db` 创建映射到表的模型时避免麻烦。这些模型需要实现两个方法，即 `exchangeArray`\
  \ 和 `getArrayCopy`：\n\n```\npublic function exchangeArray($data)\n```\n\n`exchangeArray`\
  \ 方法由 `Laminas\\Db\\ResultSet` 类用于使用表记录中的数据填充模型。\n\n```\npublic function getArrayCopy()\n\
  ```\n\n`getArrayCopy` 方法由 `Laminas\\Db\\ResultSet` 类用于从模型获取数据。它还被 `Laminas\\Form\\\
  Form` 用于将模型属性值绑定到表单字段值。\n\n实际上，`Laminas\\Db\\ResultSet` 类也接受 `toArray` 方法，用于替换 `getArrayCopy`\
  \ 方法。我建议在模型中实现 `toArray` 方法，以提取要使用 `TableGateway` 类持久化的数据。有时，要发送到表单对象的模型数据与要发送到数据映射器的模型数据不同。你可以在\
  \ HTML 表单中显示不会保存到数据库表的数据，因为 HTML 表单可以显示来自两个关联表的数据，而其中一个表是只读的，不可写入。\n\n这是一个简短的技巧。这是个不错的开始。在下一节中，我们仍将讨论模型层，学习如何自定义过滤器和验证器。它不会那么简短，但会更加精彩。\n\
  \n\n\n\n### 自定义过滤器和验证器\n\n在本节中，我们将学习如何自定义过滤器和验证器，以及映射模型所需的方法。\n\n在 tipsandtricks\
  \ 应用程序的主页上，你将在左侧看到一个框，类似于图 13.1 所示的框，其中包含模型层的过滤器和验证器自定义示例：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_355_0.png)\n\
  \n图 13.1 – 访问自定义过滤器和验证器示例\n\n我们将学习该框中按钮的工作原理，并了解如何使用 Laminas 框架创建过滤器和验证器。\n\n在第\
  \ 8 章「创建表单并实现过滤器和验证器」中，我们学习了如何使用 laminas-filter 和 laminas-validator 组件中提供的一些过滤器和验证器。但是，我们并不仅限于已实现的\
  \ Laminas 过滤器和验证器。这两个组件都有接口，允许我们实现自定义过滤器和验证器。\n\n让我们先测试自定义过滤器。\n\n### 创建自定义过滤器\n\
  \n单击「自定义过滤器」按钮（如图 13.1 所示），你将被带到以下页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_356_0.png)\n\
  \n图 13.2 – 测试自定义过滤器的表单\n\n图 13.2 所示的表单用于应用一个反转输入表达式的过滤器。例如，你可以在文本框中输入 open sesame，然后单击「扎坦娜是怎么说这个的？」按钮。除了发现\
  \ Zatanna 的发音有些问题外，你还会看到页面重新加载并显示以下内容：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_356_1.png)\n\
  \n图 13.3 – 应用过滤器后的表单页面\n\n图 13.3 中的表单调用 IndexController->filterAction 方法，其实现如下：\n\
  \n```\npublic function filterAction()\n{\n    $expression = $this->getRequest()->getPost\n\
  \        ('expression');\n    if (empty($expression)) {\n        $response = '';\n\
  \    } else {\n        $filter = new Zatanna();\n        $response = 'Zatanna says:\
  \ ' . $filter->filter\n            ($expression);\n    }\n\n    return new ViewModel([\n\
  \        'expression' => $expression,\n        'response' => $response\n    ]);\n\
  }\n```\n\n请注意，如果表单发送了值，filterAction 方法会创建 Zatanna 类的一个实例。Zatanna 类有一个 filter 方法，用于反转给定的值。Zatanna\
  \ 类实现了每个 Laminas 过滤器类共有的 Laminas\\Filter\\FilterInterface 接口：\n\n### Zatanna.php\n\
  \n```\n<?php\nnamespace Application\\Filter;\n\nuse Laminas\\Filter\\FilterInterface;\n\
  \nclass Zatanna implements FilterInterface\n{\n    public function filter($value)\n\
  \    {\n        return strtolower(strrev($value));\n    }\n}\n```\n\n如你所见，过滤器类是一个必须实现\
  \ filter 方法的类，该方法接收一个无类型值并返回某个内容。因此，你可以根据需要创建自己的过滤器类，并轻松使用它们。\n\n### 用于加密密码的过滤器\n\
  \n如你所记得，我们在 Customer 和 Employee 类中创建了加密密码的方法。这两个模型类的加密实现是相同的。在本章的 whatsstore 版本中，你将找到一个应用于提取重复加密实现到单个类的自定义过滤器示例。在\
  \ Generic 模块中搜索 Encrypt 类。\n\n在下一节中，我们将学习如何自定义验证器。\n\n### 创建自定义验证器\n\n返回 tipsandtricks\
  \ 主页并单击「自定义验证器」按钮；你将被带到以下页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_358_0.png)\n\
  \n图 13.4 – 测试自定义验证器的表单\n\n图 13.4 所示的表单用于应用一个验证器，以检查输入的单词或短语是否为回文。例如，你可以在文本框中输入 Namor\
  \ sees Roman，然后单击「是回文吗？」按钮。然后，你会看到页面重新加载并显示以下内容：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_358_1.png)\n\
  \n图 13.5 – 应用验证器后的表单页面\n\n图 13.5 所示的表单调用 IndexController->validatorAction 方法，其实现如下：\n\
  \n```\npublic function validatorAction()\n{\n    $expression = $this->getRequest()->getPost\n\
  \            ('expression');\n    if (empty($expression)) {\n        $response =\
  \ '';\n    } else {\n        $validator = new Palindrome();\n        $response =\
  \ 'It is not a palindrome!';\n        if ($validator->isValid($expression)) {\n\
  \            $response = 'It is a palindrome!';\n        }\n    }\n    return new\
  \ ViewModel([\n        'expression' => $expression,\n        'response' => $response\n\
  \    ]);\n}\n```\n\n请注意，如果表单发送了值，validatorAction 方法会创建 Palindrome 类的一个实例。Palindrome\
  \ 类具有一个 isValid 方法，如果给定的值是回文，则返回 true。Palindrome 类实现了每个 Laminas 验证器类共有的 Laminas\\\
  Validator\\ValidatorInterface 接口：\n\n### Palindrome.php\n\n```\n<?php\nnamespace\
  \ Application\\Validator;\nuse Laminas\\Validator\\ValidatorInterface;\nclass Palindrome\
  \ implements ValidatorInterface\n{\n    private array $messages = [];\n    public\
  \ function isValid($value)\n    {\n        $value = strtolower($value);\n      \
  \  $value = str_replace(' ', '', $value);\n        $valueLength = strlen($value);\n\
  \        $repeated = (int) ($valueLength/2);\n        $n = $valueLength-1;\n   \
  \     for($i=0;$i<$repeated;$i++) {\n            $palindrome = ($value[$i] == $value[$n]);\n\
  \            if (!$palindrome) {\n                $this->messages[] = \"{$value[$i]}\
  \ is\n                different of {$value[$n]}\";\n                return false;\n\
  \            }\n            $n--;\n        }\n        return true;\n    }\n    public\
  \ function getMessages()\n    {\n        return $this->messages;\n    }\n}\n```\n\
  \n如你所见，验证器类是一个实现 isValid 方法的类，该方法接收一个无类型值并返回 true 或 false，以及一个 getMessages 方法，返回错误消息数组。因此，你可以根据需要创建自己的验证器类，并轻松使用它们。\n\
  \n接下来，我们将更好地了解 Laminas 视图层。\n\n### 了解 Laminas 视图层\n\n在本节中，我们将学习如何在控制器操作中生成 JSON\
  \ 响应，以及如何使用 laminas-form 上传文件。\n\n在 tipsandtricks 主页的中心，你可以看到一个类似于图 13.6 的框，其中包含前一节中提到的视图层功能示例：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_361_0.png)\n\n图 13.6 – 访问视图示例\n\n我们将在以下小节中使用与该框相关的操作。\n\
  \n### 使用 laminas-view 生成 JSON 响应\n\n要创建包含 JSON 格式数据的 HTTP 响应，你需要做两件事：\n\n- 将 Laminas\\\
  View\\Model\\Json 类用作控制器操作方法的返回类型。\n- 将以下元素添加到 module.config.php 文件的 view_manager\
  \ 数组键中：\n\n```\n'strategies' => [\n    'ViewJsonStrategy',\n],\n```\n\n让我们看一个 JSON\
  \ 响应示例。单击中心框中的「JSON 响应」按钮。你将看到以下输出：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_362_0.png)\n\
  \n图 13.7 – 由 JsonModel 生成的 JSON 响应\n\n此响应由 IndexController->showJsonAction 方法生成，如下所示：\n\
  \n```\npublic function showJsonAction()\n{\n    $simpleValue = 'a simple text';\n\
  \    $list = ['apple', 'banana', 'coconut'];\n    $car = new \\stdClass();\n   \
  \ $car->color = 'red';\n    $car->wheels = 4;\n\n    return new JsonModel([\n  \
  \      'simple-value' => $simpleValue,\n        'array' => $list,\n        'object'\
  \ => $car\n    ]);\n}\n```\n\n由于 ViewJsonStrategy 已启用，注入到 JsonModel 构造函数中的值将转换为\
  \ JSON 格式，并且 HTTP 响应的内容类型将配置为 JSON。\n\n你有既视感吗？是的！这是因为我们在第 7 章「请求控制和数据视图」中已经使用过 ViewJsonStrategy。但我们担心你可能已经忘记了这一点。在以\
  \ API 为导向的世界中，了解如何生成 JSON 响应是件好事。\n\n接下来，让我们学习如何处理文件上传。\n\n\n\n\n\n### 使用 laminas-form\
  \ 上传文件\n\n你可能已经意识到，你的 whatstore 应用程序的产品注册中缺少了一些东西：产品图片。图片可以存储在数据库表中，使用文本或图像专用字段。图片也可以存储在文件系统中，这样数据库只需保留图片文件的路径。但是，无论图片如何存储，或者与产品关联多少张图片，文件上传过程都是相同的。\n\
  \n如果单击**上传图片**按钮，你将被带到以下页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_363_0.png)\n\
  \n© 2022 Laminas Web Development 一本关于使用面向对象 PHP 进行 Web 开发的书。\n\n图 13.8 – 上传图片表单\n\
  \n用于上传的表单由 UploadForm 类创建，该类扩展了 Laminas\\Form\\Form：\n\n### UploadForm.php\n\n```php\n\
  <?php\nnamespace Application\\Form;\nuse Laminas\\Form\\Element;\nuse Laminas\\\
  Form\\Form;\nclass UploadForm extends Form\n{\n    public function __construct($name\
  \ = null, $options = [])\n    {\n        parent::__construct($name, $options);\n\
  \        $this->addElements();\n    }\n\n    public function addElements()\n   \
  \ {\n        // File Input\n        $file = new Element\\File('image-file');\n \
  \       $file->setLabel('Image Upload');\n        $file->setAttribute('id', 'image-file');\n\
  \        $this->add($file);\n    }\n}\n```\n\n**浏览...** 按钮由 Laminas\\Form\\Element\\\
  File 类呈现。当你单击**浏览...**按钮时，浏览器将打开文件管理器窗口，你可以选择文件。tipsandtricks 应用程序在 data 文件夹中有一个名为\
  \ pets.jpg 的示例免版税图片文件。选择图片文件并单击**提交**按钮后，页面将重新加载，并添加上传的数据：\n\n```\nArray\n(\n  \
  \  [image-file] => Array\n        (\n            [name] => pets.jpg\n          \
  \  [type] => image/jpeg\n            [tmp_name] => /opt/lampp/temp/phpQb1F1p\n \
  \           [error] => 0\n            [size] => 226510\n        )\n)\n```\n\n请注意，主要数据包括上传文件的原始名称、文件类型以及服务器上存储文件的临时目录。此数据由\
  \ IndexController->uploadFormAction 方法发送，如下所示：\n\n```php\npublic function uploadFormAction()\n\
  {\n    $form = new UploadForm('upload-form');\n    $form->setAttribute('action',\
  \ $this->url()->fromRoute('application', ['action' => 'upload-form']));\n    $data\
  \ = [];\n    $request = $this->getRequest();\n    if ($request->isPost()) {\n  \
  \      // Make certain to merge the $_FILES info!\n        $post = array_merge_recursive(\n\
  \            $request->getPost()->toArray(),\n            $request->getFiles()->toArray()\n\
  \        );\n        $form->setData($post);\n        if ($form->isValid()) {\n \
  \           $data = $form->getData();\n            $content = file_get_contents($data['image-file']['tmp_name']);\n\
  \            file_put_contents(self::TARGET_DIR . 'image.jpg', $content);\n    \
  \    }\n    }\n    return new ViewModel([\n        'form' => $form,\n        'data'\
  \ => $data\n    ]);\n}\n```\n\n如果数据表单有效，我们将图片文件从临时目录复制到应用程序的 public/img 目录中。\n\n\
  重新加载的页面还有一个**查看已上传的图片**链接。单击此链接，你将被带到以下页面：\n\n### 已上传的图片\n\n![](img/e6cf5550804ccae9d1859270da8688f5_366_0.png)\n\
  \nMEGAPIXEL。从 megapixl.com/72544067 下载 © 2022 Laminas Web Development 一本关于使用面向对象\
  \ PHP 进行 Web 开发的书。\n\n图 13.9 – 已上传的图片\n\n如你所见，使用 Laminas\\Form\\Element\\File 上传文件非常简单。\n\
  \n> 安全建议\n> 使用 Laminas\\Filter\\File\\RenameUpload 组件更改上传文件的目标目录。这样可以防止攻击者尝试调用文件，因为默认上传目录是已知的。使用\
  \ Laminas\\Validator\\File\\MimeType 组件检查上传的文件是否真的是预期的类型，这也是个好主意。\n\n在下一节中，我们将看到更改应用程序布局也很容易。\n\
  \n### 更改应用程序布局\n\n在图 13.6 底部，你可以看到一个更改布局按钮。如果单击此按钮，你将被带到以下页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_367_0.png)\n\
  \n图 13.10 – 替代布局\n\n如你所观察到的，标题颜色和内容不同，正文背景颜色也不同。此布局更改由 `IndexController->changeLayoutAction`\
  \ 方法完成，该方法调用布局控制器插件的 `setTemplate` 方法：\n\n```php\npublic function changeLayoutAction()\n\
  {\n    $this->layout()->setTemplate('/layout/otherlayout');\n    return new ViewModel();\n\
  }\n```\n\n`setTemplate` 方法仅更改当前操作的布局。如果单击主页链接并导航到其他页面，你将看到仍在使用默认布局。\n\n`setTemplate`\
  \ 方法从 `view` 文件夹中查找布局文件。文件扩展名为 `.phtml`，但调用该方法时不需要添加扩展名。\n\n你也可以为控制器操作禁用布局。我们在 _第\
  \ 12 章，回顾和改进我们的应用_ 中看到过如何做到这一点，当时我们创建了 API 页面。布局通过 `ViewModel` 类禁用，将 `true` 传递给\
  \ `setTerminal` 方法，如下所示：\n\n```php\n$view = new ViewModel();\n$view->setTerminal(true);\n\
  ```\n\n因此，你可以完全控制应用程序布局。\n\n在下一节中，我们将了解一些关于控制器层 Laminas 的有用知识。\n\n### 掌握控制器层\n\n\
  在本节中，我们将学习控制器类如何检测 AJAX 请求、如何在控制器层和视图层之间交换消息，以及如何完成控制器操作。\n\n在 tipsandtricks 应用程序的主页上，你将看到图\
  \ 13.11 所示的框架，右侧“控制器层”标题下展示了上述功能的示例：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_368_0.png)\n\
  \n图 13.11 – 访问控制器层示例\n\n我们将在下一个小节中使用与此框架相关的操作。\n\n### 检测 AJAX 请求\n\n异步请求和同步请求按钮向同一控制器操作（即\
  \ IndexController->ajaxAction 方法）发出 HTTP 请求：\n\n```php\npublic function ajaxAction()\n\
  {\n    if ($this->getRequest()->isXmlHttpRequest()) {\n        return new JsonModel();\n\
  \    }\n    return new ViewModel();\n}\n```\n\n如果请求是使用 XMLHttpRequest 发出的，`Request->isXmlHttpRequest`\
  \ 方法将返回 `true`。此对象发出异步请求。\n\n由于 XMLHttpRequest 在客户端由 JavaScript 处理，并且 XML 曾被广泛用于在客户端和服务器端之间交换数据，因此\
  \ XMLHttpRequest 的使用获得了一个特殊名称：**异步 JavaScript 和 XML**（AJAX）。尽管如今由于 JSON 的轻量级特性，XML\
  \ 的使用越来越少，但 AJAX 这个缩写词仍在使用。\n\nXMLHttpRequest 规范\nXMLHttpRequest 是一个开放的 Web 标准，详见\
  \ https://xhr.spec.whatwg.org。\n\n如果单击**异步请求**按钮，你将看到一个警报窗口，如图 13.12 所示。它显示页面未重新加载：\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_369_0.png)\n\n图 13.12 – 对异步请求的响应\n\n\
  如果单击**同步请求**按钮，你将被带到以下页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_369_1.png)\n\
  \n图 13.13 – 对同步请求的响应\n\n你可以看到页面已重新加载。请注意，同一控制器操作可以处理同步请求和异步请求，并根据情况生成不同的响应。\n\n\
  在下一个小节中，我们将看到一种在不使用 ViewModel 类的情况下在控制器和视图脚本之间交换消息的方法。\n\n\n\n\n\n### 控制器与视图层之间交换消息\n\
  \n如果单击 Flash 信使按钮，您将被带到以下页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_370_0.png)\n\
  \n图 13.14 – FlashMessenger 插件存储的消息\n\nFlash 信使按钮以如下方式调用 IndexController->flashMessengerAction\
  \ 方法：\n\n```php\npublic function flashMessengerAction()\n{\n    $this->flashMessenger()->addMessage('You\
  \ called\n        this action at ' . date('H:i:s'));\n    $messages = $this->flashMessenger()->getMessages();\n\
  \    return new ViewModel(['messages' => $messages]);\n}\n```\n\n控制器中使用的 FlashMessenger\
  \ 类将消息存储在会话容器中。消息存储在消息堆栈中，可以通过 getMessages 方法访问。简而言之，FlashMessenger 类是一个消息管理器。将\
  \ FlashMessenger 实例中存储的消息发送到视图脚本的常规方法是在 ViewModel 构造函数中注入 getMessages 方法的输出，正如我们在前面的代码片段中所看到的。但是，正如我们在下面的代码片段中所看到的，这并非必要：\n\
  \n### flash-messenger.phtml\n\n```php\n<h1>Messages</h1>\n<?=$this->flashMessenger()->render()\
  \ ?>\n```\n\n请注意，与 `flashMessengerAction` 方法相关的视图脚本不使用在 `ViewModel` 中注入的 `$messages`\
  \ 变量。相反，视图脚本使用 `FlashMessenger` 的视图助手，该助手带有一个 `render` 方法。`render` 方法避免遍历消息数组，将内容作为纯文本输出。\n\
  \n`FlashMessenger` 是一个控制器插件，它不是 `laminas-mvc` 的一部分。您需要通过 Composer 分别安装它。\n\n使用非内置控制器插件有两种方法。最简单的方法是将插件作为模块添加到\
  \ `modules.config.php` 文件中。您必须添加 **完全限定类名 (FQCN)**：\n\n```php\n'Laminas\\\\Mvc\\\
  \\Plugin\\\\FlashMessenger'\n```\n\n另一种更详细的方法是在将要使用的模块的 `module.config.php` 文件中配置插件。您需要创建一个\
  \ `controller_plugins` 键，包含 `factories` 和 `aliases` 子键。以下代码片段展示了如何在 `tripsandtricks`\
  \ 应用程序中配置 `FlashMessenger` 插件：\n\n```php\n'controller_plugins' => [\n    'factories'\
  \ => [\n        FlashMessenger::class => InvokableFactory::class\n    ],\n    'aliases'\
  \ => [\n        'flashMessenger' => FlashMessenger::class\n    ]\n],\n```\n\n虽然\
  \ `factories` 键定义了如何创建 `FlashMessenger` 实例，但 `aliases` 键定义了您将在控制器操作中用来调用该插件的名称。\n\
  \n![](img/e6cf5550804ccae9d1859270da8688f5_371_0.png)\n\n这是控制器插件的配置。要使用 FlashMessenger\
  \ 视图助手，如果您未将组件配置为模块，则需要向 modules.config.php 文件添加一个 view_helpers 键，如下所示：\n\n```php\n\
  'view_helpers' => [\n    'invokables' => [\n        'flashMessenger' => \\Laminas\\\
  Mvc\\Plugin\\FlashMessenger\\View\\Helper\\FlashMessenger::class\n    ]\n]\n```\n\
  \n控制器插件配置对您来说应该是新的，但视图助手配置则不然。事实上，您在第 8 章「创建表单并实现过滤器和验证器」中已编写过此配置，以启用表单视图助手。\n\n\
  接下来，我们将了解结束控制器操作的不同方式。\n\n### 结束控制器操作\n\n在大多数情况下，返回以下对象之一时，控制器操作可以终止：\n\n- 一个 ViewModel\
  \ 实例，如果它是对期望 HTML 页面的同步请求的响应。\n- 一个 JSONModel 实例，如果它是对期望 JSON 数据的异步请求的响应。\n- 对 `$this->redirect()->toRoute()`\
  \ 方法的调用。该方法需要两个参数；第一个是路由名称，第二个是包含路由参数的数组。该方法会导致 HTTP 重定向请求（HTTP 状态码 302）。\n\n还有其他\
  \ Laminas\\View\\Model 类：ConsoleModel，用于为终端生成输出；以及 FeedModel，用于为 RSS 消费者生成输出。您也可以扩展\
  \ Laminas\\View\\Model ModelInterface 并创建特定输出。\n\n### 总结\n\n在本章中，我们学习了一些与 MVC 应用程序三层相关的\
  \ Laminas 实用技巧和窍门。\n\n我们首先学习了如何使用 Laminas 接口为模型层自定义过滤器和验证器。我们了解了使用映射模型或与表单集成的模型所需的方法。\n\
  \n随后，我们学习了，或者更确切地说，回忆了如何为视图层生成 JSON 响应。我们还学习了如何使用 laminas-form 上传文件以及如何更改布局配置。\n\
  \n在本章末尾，我们学习了如何在控制器中检测 AJAX 请求以及如何使用 laminas-mvc-plugin-flashmessenger 管理消息。最后，我们了解了结束控制器操作的可能方式。\n\
  \n在下一章中，我们将介绍最后几件事。是的，很遗憾，但本书即将结束...\n"
- '## 最后考虑


  本章标志着本书的结束，展示了未来可使用的未在示例应用程序中使用的其他组件的可能性。


  在本章中，我们将概览本书早期章节示例应用程序中未使用的一些 Laminas 组件。我们将了解用于创建分布式和去中心化应用程序的组件，以及用于创建 API 的组件。最后，我们将了解在哪里可以获得
  Laminas 组件的帮助，以及如何成为 Laminas 社区的一部分并改进 Laminas 框架。


  本章将介绍以下主题：


  - 其他 Laminas 组件

  - 面向微服务的开发

  - 构建 API

  - 社区资源


  ### 其他 Laminas 组件


  在本节中，我们将概览本书项目中未使用的一些 Laminas 组件。您可以在 `https://docs.laminas.dev/components` 阅读所有
  Laminas 组件的文档。


  ### 缓存


  让我们用旅行作为类比。我们在旅行中花费时间和金钱。既然时间就是金钱，我们在旅行中花费大量金钱。此外，我们走得越远，花费的金钱就越多。换句话说，最便宜的去处就是您当前所在的地方。原地停留是最便宜的旅行类型。这就是缓存的理念：将数据保存在尽可能最近的位置，以减少传输的时间和成本。`laminas-cache`
  组件允许我们使用多个存储适配器缓存数据，这些适配器使您的应用程序能够从文件系统、Memcached、Redis 或 MongoDB 数据库等保存和读取数据。


  ### CLI


  尽管我们使用 Laminas 开发 Web 应用程序，但该框架并不局限于此目的。事实上，PHP 手册指出 PHP 可以做任何事情。使用 Laminas，我们可以做任何事情，但控制力更强。


  > **PHP 能做什么？**

  > 您可以在 https://www.php.net/manual/en/intro-whatcando.php 找到 PHP 可能用途的描述。


  信不信由你，您可以使用 Laminas 创建命令行 PHP 程序。为此，您应该使用 laminas-cli 组件。


  ### 加密


  在我们的 whatstore 项目中，我们说过加密密码很重要。但您不应使用本书示例中使用的算法。建议使用强大的加密和密码哈希来保护和验证敏感数据。laminas-crypt
  组件提供了一种在 PHP 应用程序中实现加密的简便且安全的方法。该组件由多位杰出的应用加密专家开发，例如 Enrico Zimuel，他是 PHP 框架互操作性组的核心成员。


  ### CSRF


  实际上，没有名为 laminas-crsf 的组件。但是，有两个类处理 CSRF。CSRF 是跨站请求伪造的缩写，是一种攻击，有人试图通过伪造的表单发送恶意数据。laminas-form
  组件提供 Element\Csrf 以向表单添加带超时配置的哈希元素。要验证哈希元素的值，可以使用 Laminas\Validator\Csrf 类。


  ### DOM


  DOM 是文档对象模型的缩写。这是一个 Web 标准，文档位于 https://www.w3.org/DOM/DOMTR。根据该标准，HTML 标签可以作为对象层次结构来处理。此外，可以使用
  XPath 语言和 CSS 选择器来搜索和选择对象。laminas-dom 组件使您可以使用这两种方法在 XML 和 HTML 文档中查找元素。自动化读取这些格式的文档非常有用，以便导入数据或通过实现网络爬虫在网站上搜索数据。






  ### XPath 和 CSS 选择器

  XPath 语言的根文档可在 https://www.w3.org/TR/1999/REC-xpath-19991116 处查阅。CSS 选择器的根文档可在 https://www.w3.org/TR/2018/REC-selectors-3-20181106
  处查阅。


  ### laminas-dom 的开发状态

  `laminas-dom` 组件被认为功能完备，目前正处于 **仅安全** 维护模式，遵循 **Laminas 技术指导委员会** 的决定。这并不意味着该包已被弃用，而意味着只有安全更新会被纳入。然而，该委员会建议将
  symfony/dom-crawler 作为替代组件，积极开发中（即功能不完整）。


  ### 如何处理被弃用的包

  虽然 `laminas-dom` 未被弃用，但了解如果某个组件不再开发该怎么办是有用的。如果组件的维护者担心其用户，可以在组件的 GitHub 主页或其 Packagist
  页面上找到关于替代组件的信息。


  ### Escaper

  根据 **开放 Web 应用程序安全项目 (OWASP)**，注入是 2021 年十大 Web 应用程序安全风险之一。注入的一种形式是 **跨站脚本 (XSS)**。要防止
  PHP 应用程序中此类注入攻击，可以使用 `laminas-escaper` 组件。此组件会中和带有恶意意图的注入代码，用于输出数据，无论代码是用 HTML、CSS
  还是 JavaScript 编写的。


  ### OWASP 十大

  OWASP 是一个旨在提高软件安全性的基金会。您可以在 https://owasp.org/www-project-top-ten 处找到安全风险、示例攻击场景及其预防方法的完整概述。


  ### Feed

  如果您需要使用 RSS 或 Atom 源，可以使用 `laminas-feed` 组件。此组件允许您将馈源响应作为对象集合处理。


  > **RSS 参考**

  > 您可以在 https://validator.w3.org/feed/docs/rss2.html 处找到有关 RSS 的文档。


  ### Hydrator

  在面向对象应用程序中，有一些常见操作，如下所示：


  - 对象水合（用数据集填充它们）

  - 从对象中提取数据


  `laminas-hydrator` 组件提供水合和提取功能。此组件要求要进行水合和提取的类必须实现 `exchangeArray` 和 `getArrayCopy`
  方法，与映射模型所需的方法相同，如我们在 *第 13 章，技巧和窍门* 中看到的那样。


  ### JSON-RPC 服务器

  JSON 是 REST API 的事实上的标准。但这并非我的观点；而是巴拉吉·瓦拉纳西（Balaji Varanasi）和苏达·贝利达（Sudha Belida）在其书籍
  *Spring REST* 中所述，该书由 *Apress* 出版于 2015 年。他们是对的。今天，除非有约束性要求，否则没有人会以 JSON 以外的格式公开
  API 数据。


  `laminas-json-server` 组件使您能够将 PHP 类公开为服务。使用 PHP DocBlocks，`laminas-json-server`
  组件允许对 PHP 函数和方法进行远程过程调用。


  > **JSON-RPC 参考**

  > 您可以在 https://www.jsonrpc.org/specification 处找到 JSON-RPC 规范。


  ### LDAP

  **轻量级目录访问协议** (**LDAP**) 是管理目录服务的开放标准协议。名为 OpenLDAP 的 LDAP 开源实现可在多种 Linux 发行版中找到。许多公司以
  Red Hat 的 RHDS 或 Microsoft 的 Azure Active Directory 之名销售 LDAP 服务。您可以在大多数云服务提供商处找到
  LDAP 实现。


  拥有一个能简化在 PHP 应用程序中管理 LDAP 操作的组件是很有用的。这正是 `laminas-ldap` 所做的。


  ### LDAP 参考

  您可以在 `https://ldap.com` 处找到更多有关 LDAP（包括其历史）的信息。另一方面，您可以在 `https://www.openldap.org`
  处找到有关 OpenLDAP 及其实现的信息。


  ### 日志

  您应该记得，我们多次使用 `error_log` 函数将消息保存到 Web 服务器日志中。在大多数情况下，我们使用此函数保存有关异常的消息。然而，曾有一段时间，我们使用
  `error_log` 函数保存有关成功身份验证的信息。使用名称中带有 `error` 单词的函数来保存信息消息似乎不太合适，您同意吗？


  要管理带有适当标识的日志消息并将消息存储到各种后端，可以使用 `laminas-log` 组件。此组件符合 PSR-3 规范，可在 `https://www.php-fig.org/psr/psr-3`
  处查阅。


  还有其他 Laminas 组件，但本节介绍的组件具有通用兴趣。


  在下一节中，我们将讨论一个对分布式架构非常有用的组件。


  ### 面向微服务的开发

  有一个特殊的组件，或者更准确地说，是一组 Laminas 组件，可以被视为微框架或微服务框架。我们指的是 **Mezzio**。


  Mezzio 旨在根据 PHP-FIG 实现中间件概念。在 PSR-15 规范中，中间件“是一个单独的组件，通常与其他中间件组件一起，参与处理传入请求和创建结果响应”
  (`https://www.php-fig.org/psr/psr-15`)。使用 Mezzio，您可以轻松创建中间件管道来处理 HTTP 请求。


  Mezzio 非常适合构建精简应用程序。此微框架基本上使用四个组件来创建中间件：路由器、依赖注入容器、模板引擎和错误处理程序。通过使用最少资源，Mezzio 帮助开发者在
  PHP 中创建微服务。


  您可以在 `https://docs.mezzio.dev` 处找到有关 Mezzio 的特定文档。


  在下一节中，我们将讨论使用 Laminas 组件构建 API。事实上，我们已使用 Laminas 组件构建了 API。好消息是，现在我们将揭示有一个工具可以使此过程更轻松。


  ### 构建 API

  Laminas 社区提供了一个用于构建 PHP API 的工具：**API 工具**。API 工具使用 Laminas 组件实现，但不要求开发者将 Laminas
  作为框架使用。这意味着您可以使用 API 工具为使用任何库或框架编写的 PHP 应用程序生成 API。

  您可以在 `https://api-tools.getlaminas.org` 处找到有关 API 工具的文档。


  在下一节中，我们将介绍社区提供的一些有用的 Laminas 资源。


  ### 社区资源

  除了 Laminas 文档之外，还有两个其他来源可用于了解 Laminas 和提问：


  - **Laminas 论坛**：您无需在 `https://discourse.laminas.dev` 拥有帐户即可阅读官方 Laminas 论坛上的帖子。但是，您需要创建帐户才能发布问题。


  - **Laminas GitHub 仓库**：Laminas 组件的开源代码也是文档。您可以在 `https://github.com/laminas` 处找到每个
  Laminas 组件的仓库。此网页提供获取支持、为项目做出贡献和报告安全问题的基本指南。


  此外，您可以在此处找到一些 Laminas 组件扩展示例：`https://github.com/fgsl/framework`。


  ### 摘要

  在本章中，我们简要了解了一些未在本书示例应用程序中使用的 Laminas 组件。我们了解了一些与通用目的相关的组件，例如缓存和日志。


  我们还了解到，有一个专门用于创建分布式和去中心化应用程序的组件，即 Mezzio 微框架。此外，我们了解到 Laminas 社区提供 API 工具来创建 PHP
  API。


  最后，我们了解了在哪里可以获得 Laminas 方面的帮助，以及如何成为 Laminas 社区的一员并改进该框架。


  真正的框架关注通用问题。但您应该利用 Laminas 的可扩展性和开源特性来实现特定问题的解决方案。


  总而言之，记住敏捷宣言中的一个原则是件好事：“简洁——最大化未完成工作量的艺术——至关重要。” 使用 Laminas 并简化您的工作。


