  \n### 配置测试类的自动加载\n\n接下来，我们将为测试类配置自动加载：\n\n- 1. 在 Composer 视图中，单击 **Autoload-dev**\
  \ 选项卡。\n\n- 2. 此选项卡与 **Autoload** 选项卡具有相同的结构。区别在于，**Autoload-dev** 仅处理开发期间使用的类——换句话说，就是不会打包用于生产环境安装的类。测试类在生产环境中不是必需的，因为它们仅在开发期间和部署前使用。\n\
