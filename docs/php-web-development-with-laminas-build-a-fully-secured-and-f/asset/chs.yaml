  \ in the registration\nGiven I have a product called \"Troop Power Battery\",\n\
  which costs $2814\nWhen I change the name of product to \"Enchanted Hammer\"\nThen\
  \ there is a product in the table products called\n\"Enchanted Hammer\"\n```\n\n\
  我们需要有一个类与这个功能关联。我们通过复制创建了第一个上下文类。现在，让我们使用 文件 | 新建 | 类 菜单创建 ProductUpdatingContext\
  \ 类。选择 features/bootstrap 文件夹和 Context 接口，如图 6.3 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_165_0.png)\n\
