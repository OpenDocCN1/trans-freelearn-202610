  \ 文件中。contexts 部分应如下所示：\n\n```\ncontexts:\n  - ProductAdditionContext\n  - ProductUpdatingContext\n\
  ```\n\n如果您现在执行 Behat 运行，输出将以以下内容结束：\n\n```\n[0] None\n[1] ProductAdditionContext\n\
  [2] ProductUpdatingContext\n```\n\n是的，新的上下文类似乎正在被选中。但是，如果您查看这些选项前面出现的内容，您会注意到呈现了两个场景：产品添加和产品更新。当我们不告诉\
  \ Behat 我们想要哪些场景时，Behat 会列出所有场景。\n\n是的，但是我们如何告诉 Behat 我们只想处理一个场景？这很简单。此刻，我们将进行分离。**Behat\
  \ 运行** 外部工具将继续运行行为测试。我们将创建另一个外部工具配置来显示代码片段：\n\n- 1. 打开 **运行 | 外部工具 | 外部工具配置** 菜单。\n\
  - 2. 右键单击 **Behat 运行** 项目，并选择 **复制** 选项。Eclipse 将创建一个名为 Behat `run (1)` 的副本。\n-\
  \ 3. 选择此新配置并将其名称更改为 **Behat 生成代码片段**。\n- 4. 将 **参数** 字段替换为以下代码：\n\n```\n--config\
