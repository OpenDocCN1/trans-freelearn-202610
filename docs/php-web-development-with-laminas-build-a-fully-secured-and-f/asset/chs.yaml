  现在，场景的短语在注释中带有上下文类中对应方法的名称。最终，我们可以看到该场景不再是未定义的，而是挂起的。步骤已更改为 1 个挂起和 3 个跳过。挂起状态意味着上下文类具有实现场景步骤的方法；但是，这些方法尚无内容。这就像\
  \ PHPUnit 测试用例因没有可测试的代码而失败一样。\n\n我们必须完成场景实现。为此，我们需要实现与场景相关的模型和对象关系映射器。我们将在下一节开始此工作。\n\
  \n## 从用户故事创建模型\n\n在语法课上，你可能听过这样的问题：“在这个短语中，主语是谁或是什么？”同样，我们提出以下问题：“在‘在注册中插入产品’场景中，模型是什么？”是的，没错——就是产品！然后，我们需要在行为测试类中实例化\
  \ Product 类。为此，我们必须在 ProductAdditionContext 类中定义一个 $product 属性：\n\n```\nprivate\
  \ ?Product $product = null;\n```\n\n我们可以在 ProductAdditionContext 类的构造函数中实例化 Product\
  \ 类，并在 thereIsAProductCalledWhichCosts 方法中使用此实例，如下所示：\n\n```\npublic function __construct()\n\
  {\n    $this->product = new Product();\n}\n\n/**\n * @Given there is a product called\
  \ :arg1, which costs\n * $:arg2\n */\npublic function thereIsAProductCalledWhichCosts($arg1,\
  \ $arg2)\n{\n    $data = [\n        'name' => $arg1,\n        'price' => $arg2\n\
  \    ];\n\n    $this->product->exchangeArray($data);\n}\n```\n\n请注意，我们将 $arg1（产品名称）和\
  \ $arg2（产品价格）作为参数传递给 Product 类的 exchangeArray 方法。当然，如果你现在尝试运行 **Behat 运行**，将会发生失败，因为\
  \ Product 类尚不存在。我们处于 TDD 的第一步——一个失败的测试。请记住，BDD 是 TDD 的扩展，因此我们在 BDD 中保留 TDD 步骤。如果测试失败，我们就欠债了。我们需要编写代码以使测试成功运行。让我们创建\
  \ Product 模型。\n\n> 注意 – 定义中的 Behat 参数\n>\n> feature 文件中被标识为参数的值借助 @Given、@When 和\
  \ @Then 注释映射到上下文类。这些注释告知以下方法是否带有参数。如果你更改定义中参数的值，则无需更改实现。例如，如果在 productaddition.feature\
  \ 文件中更改了产品价格，则无需在 ProductAdditionContext 类中更改任何内容。这样可以避免在规则中的某个值发生变化时需要更改类。\n\n\
  Product 类将位于 Inventory 模块内。在此模块的 src 文件夹中创建一个 Model 文件夹，用于存放模型类。Product 模型的源代码将如下所示：\n\
  \n\n\n### Product.php\n\n```php\n<?php\nnamespace Inventory\\Model;\n\nclass Product\n\
  {\n    public int $code;\n    public string $name;\n    public float $price;\n \
  \   public Discount $discount;\n\n    public function __construct()\n    {\n   \
  \     $this->exchangeArray([]);\n    }\n\n    public function exchangeArray($data):\
  \ void\n    {\n        $this->code = ($data['code'] ?? 0);\n        $this->name\
  \ = ($data['name'] ?? '');\n        $this->price = ($data['price'] ?? 0.0);\n  \
  \      $this->discount = new Discount();\n        $this->discount->code = ($data['code_discount']\
  \ ?? 0);\n    }\n}\n```\n\n你为什么要实现一个调用 exchangeArray 方法的构造函数？为了初始化属性。否则，我们可能会突然遇到“属性在初始化前不得访问”的错误。\n\
  \n如你所见，Product 类依赖于 Discount 类。因此，我们需要按如下方式创建 Discount 类：\n\n### Discount.php\n\n\
  ```php\n<?php\nnamespace Inventory\\Model;\n\nclass Discount\n{\n    public int\
  \ $code;\n    public string $name;\n    public string $operator;\n    public float\
  \ $factor;\n\n    public function __construct()\n    {\n        $this->exchangeArray([]);\n\
  \    }\n\n    public function exchangeArray($data): void\n    {\n        $this->code\
  \ = ($data['code'] ?? 0);\n        $this->name = ($data['name'] ?? '');\n      \
  \  $this->operator = ($data['operator'] ?? '');\n        $this->factor = ($data['factor']\
  \ ?? 0.0);\n    }\n}\n```\n\n也许另一个框架会根据表架构生成模型类。也许会。\n但为了通用性，这样的框架也可能生成不必要的代码。我们只为模型创建必要的代码。\n\
  \n好吧，创建模型后，你可以返回到 ProductAdditionContext 类并添加命名空间：\n\n```\nuse Inventory\\Model\\\
  Product;\n```\n\n然后，你可以再次运行 Behat，得到不同的摘要结果：\n\n```\n1 scenario (1 pending)\n4 steps\
  \ (1 passed, 1 pending, 2 skipped)\n0m0.09s (9.31Mb)\n```\n\n现在，第一步已通过行为测试。你可以观察到该步骤以绿色打印。\n\
  \n下一步是将产品添加到注册表中。为此，我们需要创建一个表映射器。这是下一节的主题。不要担心其他模型；我们稍后会回到它们。\n\n### 从用户故事创建映射器\n\
  \n在 `ProductAdditionContext` 类中编写新代码之前，我们将复用在培训项目中编写的代码。如果你记得 `school13` 项目，我们为数据库连接创建了全局和本地配置。好了，你可以将\
  \ `school13` 项目中的 `global.php` 和 `local.php` 文件复制到 `whatstore` 项目。这两个文件位于 `config/autoload`\
  \ 文件夹中。复制后，你需要将 `global.php` 文件中的数据库名称重命名为 `whatstore`。\n\n我们还需要安装 `laminas-db`\
  \ 来实现对象关系映射。我们在 *第 4 章，从对象关系映射到 MVC 容器* 中做过这一点。然后，像之前一样使用 Composer 安装 `laminas-db`。不要忘记，仅将依赖项添加到\
  \ `composer.json` 文件是不够的。你必须在 Composer Eclipse 编辑器中点击 **更新依赖** 按钮运行 `composer update`。控制台上应该出现以下问题：\n\
  \n```\nPlease select which config file you wish to inject 'Laminas\\Db' into:\n\
  ```\n\n选择将配置注入到 `config/modules.config.php` 文件的选项。为什么？请再次阅读 *第 4 章，从对象关系映射到 MVC\
  \ 容器*。接下来，还会出现另一个问题：\n\n```\nRemember the option for other packages of the same\
  \ type? (Y/n) ?:\n```\n\n回答 Y 以避免重复出现此问题。\n\n我们在 *第 4 章，从对象关系映射到 MVC 容器* 的 *实现测试方法*\
  \ 部分介绍了使用 `laminas-db` 进行对象关系映射。你可能记得，我们使用 **表数据网关** 模式的实现。该模式在 Laminas 中由 `TableGateway`\
  \ 类实现。为特定映射器类使用此类有一些重复步骤。为此，我们在 `school13` 项目中创建了一些抽象。是时候复用它们了。将 `school13` 项目中\
  \ School 模块的 `AbstractModel.php` 和 `AbstractTable.php` 文件复制到 `whatstore` 项目的 Inventory\
  \ 模块中。这些文件属于模型层，因此必须留在 `src/Model` 文件夹中。更改这些类在目标中的命名空间为 `Inventory\\Model`。好了！你将避免重复代码。让我们来编写将产品添加到注册表的代码。\n\
  \n### 将产品添加到产品表中\n\n我们将更改 ProductAdditionContext 类的构造函数以实例化 **表数据网关** 实现，如下所示：\n\
  \n```php\npublic function __construct()\n{\n    $this->product = new Product();\n\
  \    $this->productTable = $this->getApplication()->getServiceManager()->get('ProductTable');\n\
  }\n```\n\n如你所见，我们正在设置一个 `$this->productTable` 属性。因此，该属性必须在类开头声明：\n\n```php\nprivate\
  \ ?ProductTable $productTable = null;\n```\n\n`$this->productTable` 属性从 Laminas\\\
  ServiceManager\\ServiceManager 类的 get 方法接收一个对象。我们从 Laminas\\Mvc\\Application 的实例中恢复\
  \ ServiceManager 的实例。最后一个实例由私有 `getApplication` 方法创建，我们必须按以下方式实现：\n\n```php\nprivate\
  \ function getApplication()\n{\n    $appConfig = require __DIR__ . '/../../../config/application.config.php';\n\
  \    if (file_exists(__DIR__ . '/../../../config/development.config.php')) {\n \
  \       $appConfig = ArrayUtils::merge($appConfig,\n        require __DIR__ . '/../../../config/development.config.php');\n\
  \    }\n\n    return Application::init($appConfig);\n}\n```\n\nApplication 实例由该类的\
  \ `init` 方法创建，基于应用程序配置。\n\n既然我们有表映射器，就可以插入产品了。ProductAdditionContext->iAddThisProductToTheRegistration\
  \ 方法将以这种方式调用 ProductTable 类的 save 方法：\n\n```php\npublic function iAddThisProductToTheRegistration()\n\
  {\n    $this->productTable->save($this->product);\n}\n```\n\n对吧，但 save 方法从哪里来？好吧，ProductTable\
  \ 类必须通过以下实现创建：\n\n### ProductTable.php\n\n```php\n<?php\ndeclare(strict_types =\
  \ 1);\nnamespace Inventory\\Model;\n\nuse Laminas\\Db\\TableGateway\\TableGateway;\n\
  use Laminas\\Db\\TableGateway\\TableGatewayInterface;\nuse Laminas\\Db\\ResultSet\\\
  ResultSet;\n\nclass ProductTable extends AbstractTable\n{\n\n    protected string\
  \ $keyName = 'code';\n\n    protected string $modelName = 'Inventory\\Model\\Product';\n\
  \n    public function __construct(TableGatewayInterface $tableGateway)\n    {\n\
  \        $this->tableGateway = $tableGateway;\n    }\n}\n```\n\n如你所见，ProductTable\
  \ 类扩展了 AbstractTable 类。save 方法由 AbstractTable 实现，因此我们只需要告知子类将处理哪个模型类（$modelName\
  \ 属性）。\n\n这意味着现在可以插入产品了吗？事实上，如果你运行 Behat，你会看到以下错误消息：\n\n> 无法将服务 \"ProductTable\"\
  \ 解析为工厂；您确定在配置中提供了它吗？\n\n为什么会发生这种情况？这是因为我们需要为 ProductTable 定义一个工厂。ServiceManager\
  \ 类不使用 new 运算符直接创建实例。ServiceManager 从别名中搜索工厂。我们使用表映射器的名称作为别名，因此 ProductTable 类的工厂别名是\
  \ ProductTable。但是，真正的工厂类是什么样子呢？好吧，数据映射器的工厂位于映射器所处理的模型类的同一 Model 文件夹中。因此，我们必须在 Inventory\
  \ 模块的 Model 文件夹中创建以下类：\n\n### ProductTableFactory.php\n\n```php\n<?php\ndeclare(strict_types\
  \ = 1);\nnamespace Inventory\\Model;\n\nuse Interop\\Container\\ContainerInterface;\n\
  use Laminas\\Db\\ResultSet\\ResultSet;\nuse Laminas\\Db\\TableGateway\\TableGateway;\n\
  use Laminas\\ServiceManager\\Factory\\FactoryInterface;\n\nclass ProductTableFactory\
  \ implements FactoryInterface\n{\n    public function __invoke(ContainerInterface\
  \ $container,\n        $requestedName, ?array $options = null)\n    {\n        $adapter\
  \ = $container->get('DbAdapter');\n        $resultSetPrototype = new ResultSet();\n\
  \        $resultSetPrototype->setArrayObjectPrototype(new Product());\n        $tableGateway\
  \ = new TableGateway('products',\n            $adapter, null, $resultSetPrototype);\n\
  ```\n\n\n\n\n\n```\nreturn new ProductTable($tableGateway);\n    }\n}\n```\n\nProductTableFactory\
  \ 类与我们在第 4 章“从对象关系映射到 MVC 容器”的 school3 项目中创建的工厂非常相似。该类的 __invoke 方法封装了创建 ProductTable\
  \ 实例的依赖链。既然我们已创建工厂，将为查找该工厂的 ServiceManager 实例配置一个别名。ServiceManager 使用别名来调用对象工厂，因为这是使用键在映射配置中快速访问值的一种方式。我们将在\
  \ Inventory 模块的 module.config.php 文件中完成此操作。我们将在数组末尾添加一个键，如下所示：\n\n```php\n'service_manager'\
  \ => [\n    'factories' => [\n        'ProductTable' => Model\\ProductTableFactory::class\n\
  \    ]\n]\n```\n\n现在呢？产品会被插入吗？暂时不会。如果你执行 **Behat 运行**，将看到以下错误消息：\n\n```\nType error:\
  \ Inventory\\Model\\AbstractTable::save(): Argument\n#1 ($model) must be of type\
  \ Inventory\\Model\\AbstractModel,\nInventory\\Model\\Product given\n```\n\n发生这种情况是因为我们的\
  \ Product 模型类不是 AbstractModel 的子类。但这很容易解决。在 Product 类的声明中添加 extends AbstractModel。\n\
  \n做出此更改后，可以执行 **Behat 运行**。接着，将看到以下错误：\n\n```\nType error: PDO::quote(): Argument\
  \ #1 ($string) must be of type\nstring, Inventory\\Model\\Discount given\n```\n\n\
  出现上述错误是因为 AbstractTable 的 toArray 方法返回 Product 的所有属性，其中一个属性是 Discount 类的实例。然而，ProductTable->save\
  \ 方法需要标量值来构建 SQL INSERT。因此，我们必须以以下方式在 Product 类中重写 toArray 方法：\n\n```php\npublic\
  \ function toArray()\n{\n    $attributes = get_object_vars($this);\n    unset($attributes['discount']);\n\
  \    $attributes['code_discount'] = $this->discount->code;\n    return $attributes;\n\
  }\n```\n\n请注意，我们移除了对象属性，仅添加外键的值。最后，我们可以执行 **Behat 运行** 并获得成功输出：\n\n```\n1 scenario\
  \ (1 pending)\n4 steps (2 passed, 1 pending, 1 skipped)\n0m0.23s (12.66Mb)\n```\n\
  \n太棒了！我们已实现场景的两个步骤：ProductAdditionContext 类的 thereIsAProductCalledWhichCosts 和 iAddThisProductToTheRegistration\
  \ 方法。现在让我们检查产品是否已插入。\n\n### 检查产品是否已插入\n\n由于我们未达到场景的结尾，尚未回滚数据库中的更改。请手动删除上次执行 **Behat\
  \ 运行** 时插入的记录，以避免 products 表中产生脏数据。\n\n现在，我们将实现断言，以检查产品是否确实已插入 products 表。这些断言必须按预期结果命名实现在\
  \ ProductAdditionContext 类的方法中，即 iShouldHaveProductInTheTableProducts 和 theOverallProductPriceShouldBe\
  \ 方法。源代码如下：\n\n```php\n/**\n * @Then I should have a product called :arg1 in the\n\
  \ * table products\n */\npublic function iShouldHaveAProductCalledInTheTableProducts($arg1)\n\
  {\n    $this->product = $this->productTable->getByField('name', $arg1);\n    Assert::assertEquals($arg1,\
  \ $this->product->name);\n}\n\n/**\n * @Then the overall product price should be\
  \ $:arg1\n */\npublic function theOverallProductPriceShouldBe($arg1)\n{\n    $product\
  \ = $this->productTable->getByField('name', $this->product->name);\n\n    Assert::assertEquals($this->product->name,\
  \ $product->name);\n}\n```\n\n请注意，我们使用的是 PHPUnit 中 Assert 类的断言方法。这意味着需要声明该类的命名空间：\n\
  \n```php\nuse PHPUnit\\Framework\\Assert;\n```\n\n最后，我们发现 Behat 与 PHPUnit 集成。你已经学习了如何从测试用例开发。现在，你已学习如何从用户故事开发。如果现在执行\
  \ **Behat 运行**，输出将如下：\n\n```\n1 scenario (1 passed)\n4 steps (4 passed)\n0m1.49s\
  \ (13.62Mb)\n```\n\n> **注意 – Behat 不包含 PHPUnit**\n>\n> Behat 默认不将 PHPUnit 作为依赖项。因此，要在\
  \ Behat 上下文类中使用 Assert 类或 PHPUnit 的任何其他类，需要单独安装 PHPUnit。\n> 在我们的情况中，已经安装了 PHPUnit。\n\
  \n正如我们所见，场景已完全测试。但等等！运行 ProductAdditionContext 行为测试类后，必须在 products 表中创建一条记录。由于此插入是由测试完成的，必须删除该记录以返回到先前状态。否则，每次测试都会使表增加一条记录。\n\
  \n首先，手动删除已插入的记录。然后，将以下方法插入 ProductAdditionContext 类：\n\n```php\npublic function\
  \ __destruct()\n{\n    $product = $this->productTable->getByField('name', $this->product->name);\n\
  \    $this->productTable->delete($product->code);\n}\n```\n\n这是一个析构方法。该方法会在实例销毁前自动执行。我们从表中检索已插入的产品并将其删除。现在，如果执行\
  \ **Behat 运行**，将注意到 `products` 表中没有新记录。这是因为记录在行为测试结束时被删除——也就是说，你可以根据需要多次执行行为测试。测试后\
  \ `products` 表中的记录数量将与测试前相同。\n\n现在，我们已学习如何从用户故事实现表映射器。在下一节中，我们将回到模型，解释如何处理模型层的泛化。\n\
  \n### 创建通用模型和通用映射器\n\n实际上，我们已经创建了一个通用模型（`AbstractModel` 类）和一个通用映射器（`AbstractTable`\
  \ 类）。在本章中，我们分别将这些泛化用作 `Product` 和 `ProductTable` 的超类。事实上，通用模型和通用映射器似乎已准备就绪。但这些泛化不在合适的位置。如果你查看，`AbstractModel`\
  \ 和 `AbstractTable` 类位于 `Inventory` 模块中。问题是，`Inventory` 模块不是唯一拥有模型的模块。我们还有 `Store`\
  \ 模块。我们将在两个模块中使用通用模型和映射器。为此，我们将通用模型和映射器提取到 `Generic` 模块。请按以下步骤操作：\n\n- 将 `Application`\
  \ 模块复制到 `Generic`。这意味着将 `Application` 文件夹复制到 `Generic` 文件夹。\n- 从 `Generic` 模块中删除\
  \ `config`、`test` 和 `view` 文件夹。\n- 从 `module/Generic/src/Controller` 文件夹中删除 `IndexController.php`\
  \ 文件。该文件从 `Application` 模块复制而来，但对 `Generic` 模块不是必需的。\n- 将 `src` 文件夹中 `Module` 类的命名空间更改为\
  \ `Generic`，并从此类中删除 `getConfig` 方法。\n\n`Generic` 模块将作为其他模块的库使用。我们将把应用程序中多个模块共享的任何抽象类或接口放入\
  \ `Generic` 模块。\n\n你可能已经注意到，表映射器的构造方法完全相同。因此，让我们通过将构造方法移至 `AbstractTable` 类来优化代码以实现复用。剪切\
  \ `ProductTable` 类的以下部分：\n\n```php\npublic function __construct(TableGatewayInterface\
  \ $tableGateway)\n{\n    $this->tableGateway = $tableGateway;\n}\n```\n\n将上述代码粘贴到\
  \ `AbstractTable` 类中。从现在起，表映射器无需再声明构造方法。\n\n> 注意 – 继承还是使用？这是个问题\n>\n> 我们的表映射器抽象类（AbstractTable）使用来自\
  \ Laminas 的 TableGatewayInterface 实现。这种方法允许我们轻松地将表数据网关模式的实现替换为任何其他实现。依赖注入提供了灵活性和供应商独立性。但是，如果你接受与\
  \ Laminas 面向对象映射建立强耦合，则可以选择继承 TableGateway 或 AbstractTableGateway 类。继承可能更方便，但正如我们所说，通过依赖注入使用类能提供更多灵活性。当你考虑到软件变更是必然的时，使用优于继承。\n\
  \n与之前的模块一样，有必要为此新模块配置自动加载规则。编辑 composer.json 文件，并在 autoload/psr-4 键中添加以下行：\n\n```json\n\
  \"Generic\\\\\": \"module/Generic/src\"\n```\n\n在 Eclipse 中，可以通过单击 Composer 编辑器的\
  \ composer.json 选项卡来进行此更改，如图 6.1 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_161_0.png)\n\
  \n图 6.1 – 带有 Generic 模块自动加载规则的 composer.json 文件\n\n\n\n\n\n您可能会问，为什么不为 Generic 测试添加自动加载规则，就像我们为\
  \ Inventory 和 Store 模块所做的那样？我们不这样做是因为没有必要。如果您测试扩展 Generic 模块中类的类，则 Inventory 和 Store\
  \ 模块都会被覆盖。事实上，我们无法有效测试抽象类或接口，因为它们没有实现——至少不是所有实现。\n\n保存 `composer.json` 文件并执行 **Composer\
  \ 自动加载文件重新生成** 外部工具。该工具可在工具栏上使用，如图 6.2 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_162_0.png)\n\
  \n图 6.2 – Composer 自动加载文件重新生成 外部工具\n\n这个外部工具 **Composer 自动加载文件重新生成** 是在 *第 5 章，创建虚拟商店项目*\
  \ 中创建的。您可以看到，我们在之前的章节中已经配置了多个外部工具。请注意，我们创建 **Composer 自动加载文件重新生成** 是因为需要重新创建 Composer\
  \ 自动加载文件以反映 `composer.json` 的内容。仅靠 Generic 模块被找到就足够了吗？不。虽然 Laminas 可以找到 Generic\
