  \ Product->toArray 方法更改为此内容：\n\n```php\npublic function toArray()\n{\n    $attributes\
  \ = get_object_vars($this);\n    unset($attributes['discount']);\n    unset($attributes['name_discount']);\n\
  \    $attributes['code_discount'] = $this->discount->code;\n\n    return $attributes;\n\
  }\n```\n\n请注意，我们删除了 name_discount 键，因为该字段未在 products 表中持久化。\n\n这个 name_discount\
  \ 键来自哪里？此键将由 ProductTable 类恢复，但我们必须通过制作 INNER JOIN SQL 语句来重写该类中的 getAll 方法。ProductTable->getAll\
  \ 方法必须如下所示：\n\n```php\npublic function getAll($where = null): iterable {\n    $select\
  \ = new Select($this->tableGateway->getTable());\n\n    $select->join('discounts',\
  \ 'products.code_Discount = discounts.code', ['name_discount' => 'name']);\n\n \
  \   if (!is_null($where)) {\n        $parsedWhere = [];\n        foreach($where\
  \ as $index => $value) {\n            $parsedWhere['products.' . $index] = $value;\n\
  \        }\n    }\n\n    $select->where($parsedWhere);\n    return $this->tableGateway->selectWith($select);\n\
  }\n```\n\n做出这些更改后，我们可以测试我们的 Web 界面：\n\n- 1. 首先，我们将手动添加折扣，因为产品依赖于折扣。打开您的终端并进入 c:\\\
