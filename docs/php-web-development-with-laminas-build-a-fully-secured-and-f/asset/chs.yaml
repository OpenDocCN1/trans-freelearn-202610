  \ SchoolClassTest extends TestCase\n{\n}\n```\n\n现在，我们基于 PHPUnit 拥有了测试用例类的骨架。此测试用例可以在\
  \ Eclipse 中运行。你可以右键单击测试类文件并访问 Run As | PHPUnit Test 菜单。如果现在执行此操作，你将在 Console 选项卡下看到以下内容：\n\
  \n> PHPUnit 9.5.10 by Sebastian Bergmann and contributors.\n> W                \
  \     1 / 1 (100%)\n\n这表明我们可以在 Eclipse 中运行 PHPUnit 并查看测试输出，就像打开了一个终端窗口一样。在 Eclipse\
  \ 中运行 PHPUnit 避免了在两个程序窗口之间切换。Eclipse 提供了一个类似飞机驾驶舱的单一面板。W 代表 Warning。它意味着没有测试。\n\n\
  在本节中，我们学习了如何为测试创建文件夹以及如何创建扩展 PHPUnit TestCase 的测试类。具体来说，我们创建了 SchoolClassTest 测试类。你可能已经忘记了，但我们所做的一切都是为了为\
  \ SchoolClass 业务类创建测试。在下一节中，我们将真正开始实践 TDD。\n\n> **什么是业务类？**\n> 与客户业务直接相关的类可以称为业务类。这类类具有业务规则。软件中可以有许多其他类与业务类进行交互。在\
  \ MVC 模式中，业务类被称为模型。\n\n### 在 SchoolClass 类中创建测试方法\n\n请记住，我们在 list.php 文件中调用业务类 SchoolClass\
  \ 以获取学校类集合。那么，让我们创建一个测试来检查这一点。等等，创建一个测试？但我们不是已经创建了 SchoolClass 类了吗？没错！在 TDD 中，我们从一个失败的测试开始，因此在编写测试之前不需要创建\
  \ SchoolClass。我们只需要类接口，我们可以从图 3.5 的类图中获得该接口。\n\n没错，我们知道 SchoolClass::getAll 方法必须返回一个可迭代值。那么，让我们按照以下步骤为其编写测试：\n\
  \n- 1. 在 SchoolClass 类中创建一个名为 testListing 的方法。\n- 2. 将 SchoolClass::getAll 方法的输出赋值给名为\
  \ $rows 的变量。\n- 3. 将此 $rows 变量作为参数传递给 $this->assertIsIterable 方法。\n\nSchoolClass\
  \ 测试类将类似于以下代码：\n\n### SchoolClassTest.php\n\n```php\n<?php\nnamespace SchoolTest;\n\
  use PHPUnit\\Framework\\TestCase;\nuse School\\SchoolClass;\nclass SchoolClassTest\
  \ extends TestCase\n{\n    public function testListing()\n    {\n        $rows =\
  \ SchoolClass::getAll();\n        $this->assertIsIterable($rows);\n    }\n}\n```\n\
  \ntestListing 方法通过 assertIsIterable 方法检查 SchoolClass::getAll 的结果是否可迭代。请注意，我们添加了一个\
  \ use 语句来导入 SchoolClass 类。你可以再次运行测试用例。Console 选项卡下的输出必须如下：\n\n```text\nPHPUnit 9.5.10\
