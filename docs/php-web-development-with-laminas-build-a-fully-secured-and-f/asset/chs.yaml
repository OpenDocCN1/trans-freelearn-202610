  现在，我们可以重构 whatstore 项目，将通用模型和映射器从 Inventory 模块移动到 Generic 模块。让我们执行以下步骤：\n\n- 1.\
  \ 在 modules/Generic/src 中创建 Model 文件夹。\n- 2. 选择 modules/Inventory/src/Model 中的 AbstractModel.php\
  \ 和 AbstractTable.php 文件。\n- 3. 将这些文件移动到 modules/Generic/src。\n- 4. 将两个文件的命名空间更改为\
