  }\n```\n\n```php\n/**\n * @When I change the name of product to :arg1\n */\npublic\
  \ function iChangeTheNameOfProductTo($arg1)\n{\n    throw new PendingException();\n\
  }\n\n/**\n * @Then there is a product in the table products\n * called :arg1\n */\n\
  public function thereIsAProductInTheTableProductsCalled\n($arg1)\n{\n    throw new\
  \ PendingException();\n}\n```\n\n如您所见，**Behat 生成代码片段** 让我们有机会在将代码添加到上下文类之前检查生成的代码。现在，我们可以执行\
  \ **Behat 追加代码片段** 来添加片段。\n\n> **关于 Behat 定义的注意事项**\n> \n> 在功能文件中编写定义时要小心。您不应该为不同的文件使用相同的定义。Behat\
  \ 会在文件之间比较定义，如果存在相同的定义，会发出警告。对于 Behat，多个功能文件中的相同定义会创建一个错误，测试将失败。正因为如此，我们在 ProductAddition.feature\
  \ 中有一个“there is a product called...”定义，在 productupdating.feature 中有一个“I have a product\
  \ called...”定义。这就像 Behat 在说：“你已经说了。”然后，你回答：“好吧，我会使用同义词。”\n\n我们可以从 `ProductAdditionContext`\
  \ 重用一些代码到 `ProductUpdatingContext`。将第一个类中的 `$product` 和 `$productTable` 属性以及构造函数方法复制到第二个类中。\n\
  \n由于您已经复制了构造函数方法，您可能已经注意到，此方法依赖于私有 `getApplication` 方法。您是否也需要从 `ProductAdditionContext`\
  \ 复制此方法？不需要。但是为什么呢？\n\n\n\n\ngetApplication 方法可能对多个行为测试类是必需的。如果相同的方法出现在许多不同的类中，此方法可以集中到一个可重用的公共代码单元中。在这种情况下，此单元可以是一个抽象类。\n\
  \n我们将在 Generic 模块中创建此类。因此，在 Generic 模块和 src 文件夹中的 Context 文件夹中创建此类。然后，使用 文件 | 新建\
  \ | 类 菜单在 Generic/src/Context 文件夹中创建抽象 AbstractContext 类。AbstractContext 将实现行为测试类通用的\
  \ Context 接口。图 6.4 显示了我们必须如何填写类创建表单的字段：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_168_0.png)\n\
  \n### 图 6.4 – 创建抽象 AbstractContext 类\n\n创建 AbstractContext 类后，将 ProductAdditionContext\
  \ 类中的 getApplication 方法从 ProductAdditionContext 移动到 AbstractContext 类。将 getApplication\
  \ 的作用域更改为 protected，因为此方法只对 AbstractContext 的子类可见。因此，AbstractContext 类将如下所示：\n\n\
  ### AbstractContext.php\n\n```php\n<?php\nnamespace Generic\\Context;\n\nuse Behat\\\
  Behat\\Context\\Context;\nuse Laminas\\Stdlib\\ArrayUtils;\nuse Laminas\\Mvc\\Application;\n\
  \nabstract class AbstractContext implements Context\n{\n    protected function getApplication()\n\
  \    {\n        $appConfig = require __DIR__ . '../../../../../config/application.config.php';\n\
  \        if (file_exists(__DIR__ . '../../../../../config/development.config.php'))\
  \ {\n            $appConfig = ArrayUtils::merge($appConfig,\n            require\
  \ __DIR__ . '../../../../../config/development.config.php');\n        }\n\n    \
  \    return Application::init($appConfig);\n    }\n}\n```\n\n当然，我们必须更改包含文件路径的行，因为相对层级不同。以前，我们需要返回三个层级才能到达根路径；现在，需要返回四个层级。\n\
  \n从现在开始，ProductAdditionContext 和 ProductUpdatingContext 类必须扩展 AbstractContext 而不是实现\
  \ Context 接口。按照 ProductAdditionContext 的示例对这些类的声明进行此更改：\n\n```php\nclass ProductAdditionContext\
  \ extends AbstractContext\n```\n\n在完成与继承相关的调整后，我们可以结束 ProductUpdatingContext 类的实现。让我们逐步展示这个类的代码。首先，像我们在\
  \ PHP 类中必须做的那样，我们需要使用 use 命令添加依赖项的引用：\n\n```php\n<?php\nuse Behat\\Behat\\Tester\\\
  Exception\\PendingException;\nuse Behat\\Gherkin\\Node\\PyStringNode;\nuse Behat\\\
  Gherkin\\Node\\TableNode;\n\nuse Inventory\\Model\\Product;\nuse Inventory\\Model\\\
  ProductTable;\nuse Inventory\\Model\\ProductTableFactory;\nuse PHPUnit\\Framework\\\
  Assert;\nuse Generic\\Context\\AbstractContext;\n```\n\n请注意，Behat 有实现 Gherkin 语言的类。这些类，具体来说，与\
  \ .feature 文件的解析相关。接下来，我们声明 ProductUpdating 类和两个私有属性：\n\n```php\n/**\n * Defines\
  \ application features from the specific context.\n *\n */\nclass ProductUpdatingContext\
  \ extends AbstractContext\n{\n    private ?Product $product = null;\n    private\
  \ ?ProductTable $productTable = null;\n```\n\n我们为模型对象 ($product) 定义了一个属性，它将数据保存在内存中；还为表网关对象\
  \ ($productTable) 定义了另一个属性，它从表中恢复数据到内存并将内存中的数据保存到表中。接下来，我们定义了构造函数，在创建 ProductUpdating\
  \ 类的实例时自动执行：\n\n```php\n/**\n * Initializes context.\n *\n * Every scenario gets\
  \ its own context instance.\n * You can also pass arbitrary arguments to the\n *\
  \ context constructor through behat.yml.\n */\npublic function __construct()\n{\n\
  \    $this->product = new Product();\n    $this->productTable = $this->getApplication()\
  \ ->\n        getServiceManager()->get('ProductTable');\n}\n```\n\nProductUpdating\
  \ 构造函数直接实例化 Product 类，并使用工厂来实例化 ProductTable 类。接下来，我们有一个实现带有 @Given 注释的 Gherkin\
  \ 短语的方法：\n\n```php\n/**\n * @Given I have a product called :arg1, which costs\n\
  \ * $:arg2\n */\npublic function iHaveAProductCalledWhichCosts($arg1,\n    $arg2)\n\
  {\n    $data = [\n        'name' => $arg1,\n        'price' => $arg2\n    ];\n \
  \   $this->product->exchangeArray($data);\n}\n```\n\niHaveAProductCalledWhichCosts\
  \ 方法使用 productupdating.feature 文件提供的数据填充 Product 类的实例。接下来，我们有一个实现带有 @When 注释的 Gherkin\
  \ 短语的方法：\n\n```php\n/**\n * @When I change the name of product to :arg1\n */\npublic\
  \ function iChangeTheNameOfProductTo($arg1)\n{\n    $product = $this->productTable->getByField\n\
  \        ('name', $this->product->name);\n    $product->name = $arg1;\n    $this->productTable->save($product);\n\
  }\n```\n\niChangeTheNameOfProductTo 方法按名称恢复产品；更改此名称并更新表中的记录。接下来，我们有一个实现带有 @Then\
  \ 注释的 Gherkin 短语的方法：\n\n```php\n/**\n * @Then there is a product in the table products\n\
  \ * called :arg1\n */\npublic function thereIsAProductInTheTableProductsCalled($arg1)\n\
  {\n    $this->product = $this->productTable->getByField\n        ('name', $arg1);\n\
  \n    Assert::assertEquals($arg1, $this->product->name);\n}\n```\n\nthereIsAProductInTheTableProductsCalled\
  \ 方法代表了 BDD 与 TDD 之间的连接。在此方法中，我们使用 PHPUnit 进行断言。最后，我们使用析构函数回退之前方法执行的更改：\n\n```php\n\
  /**\n */\npublic function __destruct()\n{\n    $product = $this->productTable->getByField(\n\
  \        'name', $this->product->name);\n    $this->productTable->delete($product->code);\n\
  \    $product = $this->productTable->getByField\n        ('name', $product->name);\n\
  \n    Assert::assertEmpty($product->name);\n}\n```\n\n您可以看到 ProductUpdatingContext\
  \ 的大部分实现与我们为 ProductAdditionContext 类所做的相似。请注意，我们在析构函数中添加了一个断言来检查产品是否已被删除。因此，没有必要为产品删除用例创建功能文件。事实上，您可以组织功能来分组用例，从而避免重复。\n\
  \n至此，我们已介绍完在 Behat 辅助的 Laminas 项目中关于模型创建所需了解的所有内容。\n\n### 摘要\n\n在本章中，我们介绍了使用 Behat\
  \ 进行 BDD 的相关知识。我们了解到 BDD 允许我们在 TDD 的有用技能基础上进行构建，并且还为我们提供了一种编写用户故事的方法，这些用户故事会生成部分测试代码。\n\
  \n借助作为 PHP BDD 工具的 Behat，我们学习了如何从用户故事创建模型和表映射器。事实上，我们发现 Behat 和 Laminas 的组合对于构建模型层非常强大。\n\
  \n我们还学习了如何创建带有抽象类的 `Generic` 模块，以供其他模块使用，并重用在 *第 4 章 从对象关系映射到 MVC 容器* 中创建的通用类。同一个\
  \ `Generic` 模块用于存储上下文类（即行为测试实现）的抽象。在此，我们了解到拥有可重用的抽象非常有用，可以避免复制所产生的不必要的工作和复杂性。由于这种抽象行为发生在每个代码单元中，抽象类可以在软件项目的每个演进阶段增长，以促进更多代码重用。然后，每个应用于多个类的新功能都是一个警示，提示我们应使用抽象来减少代码行数。\n\
  \n在下一章中，我们将创建应用程序的控制层和视图层，这些层将使用本章中创建的模型和表映射器。\n\n\n\n"
- "## 请求控制与数据视图\n\n本章将演示如何在 MVC 应用程序中使用 Laminas 对控制器和视图层的实现。我们将先简要回顾 PHP 与 **超文本传输协议（HTTP）**\
  \ 之间的关系。我们将了解 Laminas 如何处理 HTTP 请求和响应。之后，我们将实现 `Inventory` 模块的控制器和视图，即学习模块在 Laminas\
  \ MVC 中如何工作。最后，我们将学习如何创建页面控制器和页面模板，并了解页面控制器的工作原理。\n\n本章将涵盖以下主题：\n\n- 了解 HTTP 与 PHP\
  \ 之间的关系\n- Laminas MVC 中的请求生命周期\n- 使用控制器和视图页面实现 CRUD\n\n本章结束时，您将能够使用 Laminas 模块和\
  \ MVC 模式实现注册功能，并了解 `laminas-mvc` 组件如何处理 HTTP 请求。此外，您将了解 Laminas 控制器页面类的工作原理，并能够使用\
  \ Laminas 模块管理 HTML 页面。\n\n### 技术要求\n\n本章所有相关代码均可在 `https://github.com/PacktPublishing/PHP-Web-Development-with-Laminas/tree/main/chapter07/whatstore`\
  \ 中找到。\n\n### 了解 HTTP 与 PHP 之间的关系\n\nHTTP 的本质是这样的：一台名为客户端的计算机向另一台名为服务器的计算机发送一条文本消息（或请求）。服务器用一条文本消息（或响应）进行回复。自\
  \ 2014 年起，HTTP 已由 RFC 7230 至 7237 定义。根据 RFC 7230，“客户端”和“服务器”是角色，因此同一台计算机既可以是客户端也可以是服务器。例如，在基于微服务的分布式系统中，每个微服务既可以充当另一个微服务的客户端，也可以充当另一个微服务的服务器。\n\
  \n有些编程语言被改编用于构建 Web 应用程序。然而，PHP 是一种最初为使用 HTTP 而创建的语言。Rasmus Lerdorf 开发 PHP 是因为他对用于创建动态页面（或者更准确地说，与数据库集成的\
  \ HTML 页面）的现有工具不满意。PHP 与用于 Web 应用程序开发的协议并行发展。使用 PHP 可以非常快速地提供动态页面。挑战在于不要使 PHP 应用程序变得复杂，并随着应用程序的增长保持应用程序可控。\n\
  \nLaminas 有一个将 HTTP 元素封装为对象的组件。这就是 `laminas-http` 组件。该组件由 `laminas-mvc` 使用。`laminas-http`\
  \ 组件实现了由 `laminas-stdlib` 定义的接口。`laminas-stdlib` 组件代表了 Laminas 框架中最高级别的复用，包含大多数\
  \ Laminas 组件使用的接口和抽象类。\n\n我们将看到 `laminas-mvc` 如何使用 `laminas-http` 中的类。在下一节中，我们将了解\
  \ Laminas MVC 应用程序中的请求生命周期。\n\n### Laminas MVC 中的请求生命周期\n\n此刻，您可以快速启动 `whatstore`\
  \ 应用程序，并使用 PHP 的内嵌 Web 服务器查看主页。从 `whatstore` 目录中，您可以键入以下命令：\n\n```\nphp -S localhost:8000\
  \ -t public/\n```\n\n当您在浏览器中打开 `localhost:8000` 时，将看到与第 2 章《为我们的电子商务应用程序设置环境》中看到的相同的欢迎页面。当然，我们尚未更改任何视图。\n\
  \n在第 5 章《创建虚拟商店项目》中，我们了解了 `public` 目录的一些知识。我们了解到，MVC Laminas 应用程序的结构就像一座中世纪城堡，唯一进入方式是通过吊桥。这里的吊桥就是\
  \ `public` 目录。所有 HTTP 请求都将传递给 `public` 目录内的 `index.php` 文件。那么，`index.php` 到底做什么？它会执行以下操作：\n\
  \n- 导入 `autoload.php` Composer 文件。\n- 检查 Laminas Application 类是否存在。\n- 检索配置。如果存在开发配置，则该配置将覆盖生产配置。\n\
  - 使用 `Application::init` 方法实例化 `Application` 类。该实例通过依赖注入接收来自 `laminas-http` 的对象。\n\
  - 从创建的实例中执行 `Application->run` 方法。\n\n当 index.php 执行 Application->run 时，会发生控制反转。从这一点开始，Laminas\
  \ 将接管控制权并会调用您的特定代码，换句话说，您的业务代码。\n\n> 注：控制反转\n> 您可以在 Martin Fowler 的以下文章中了解有关控制反转模式的更多信息：https://martinfowler.com/bliki/InversionOfControl.html。\n\
  \n图 7.1 展示了 Laminas MVC 应用程序中请求生命周期的总体情况：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_177_0.png)\n\
  \n图 7.1 – Laminas MVC 应用程序中的 HTTP 请求生命周期\n\nLaminas 使用事件驱动编程来处理请求生命周期的步骤：引导、路由、分发控制器和呈现视图。我们可以将此生命周期划分为两个主要时刻：\n\
  \n- 执行 `Application::init` 方法时，`ServiceManager` 将获取 `ModuleManager` 的实例，该实例加载在 `modules.config.php`\
  \ 文件中注册的模块。`Application::init` 方法还使用 `bootstrap` 方法触发 `EVENT_BOOTSTRAP` 事件。`EventManager`\
  \ 类会通知该事件的侦听器以执行引导任务。\n\n- 执行 `Application->run` 方法时，`Application` 会触发 `EVENT_DISPATCH`\
  \ 事件。`EventManager` 类会通知该事件的侦听器，其中一个侦听器会实例化一个控制器类。该控制器类随即为 HTTP 响应呈现一个视图。此视图可以是\
  \ JSON 对象、HTML 页面，或者其他应用程序可消费的任何格式。\n\n等一下。到底会调用哪个控制器？这取决于路由。如前所述，在 *第 4 章，从对象关系映射到\
  \ MVC 控制器* 中，Laminas 在其模块中定义路由。路由是 URL 模式与控制器类之间的关联。`Application->run` 方法还会触发一个名为\
  \ `EVENT_ROUTE` 的事件，`EventManager` 会通知与 `ModuleManager` 相关的某些侦听器（`ModuleRouteListener`\
  \ 和 `RouteListener`）。这些侦听器会根据与 URL 匹配的路由定义要调用的控制器。\n\n我们将在下一节中更好地理解此生命周期，届时我们将为产品注册实现控制器和视图页面。\n\
  \n### 使用控制器和视图页面实现 CRUD\n\n我们将在 `Inventory` 模块中创建一个用于管理产品的控制器。遵循 TDD 的良好实践，我们将从测试开始创建此控制器。\n\
  \n在本节中，我们将首先测试当前的测试用例。然后，我们将创建用于插入、检索、更新和删除产品的测试。\n\n### 测试当前的测试用例\n\n第一步是按照以下步骤检查当前测试用例的状态：\n\
  \n- 1. 选择 `whatstore` 项目，右键单击 **运行方式/PHPUnit 测试**。您将在 **PHPUnit** 选项卡中看到 PHPUnit\
  \ 的输出，如 *图 7.2* 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_179_0.png)\n\n图\
  \ 7.2 – PHPUnit 输出\n\n如您所见，`Inventory` 模块中的 `IndexControllerTest` 类失败了。失败是因为该类是从\
  \ `Application` 模块的 `IndexControllerTest` 复制而来的，而路由和页面不同。让我们修复此类。\n\n- 2. 首先，将 `Inventory\\\
  \\Controller\\\\IndexControllerTest` 的 `testIndexActionCanBeAccessed` 方法更改为以下代码：\n\
  \n```\npublic function testIndexActionCanBeAccessed(): void\n{\n    $this->dispatch('/inventory',\
  \ 'GET');\n    $this->assertResponseStatusCode(200);\n    $this->assertModuleName('inventory');\n\
  \    $this->assertControllerName(IndexController::class); // as specified in router's\
  \ controller name alias\n    $this->assertControllerClass('IndexController');\n\
  \    $this->assertMatchedRouteName('inventory');\n}\n```\n\n- 3. 然后，从 `InventoryTest\\\
  \\Controller\\\\IndexControllerTest` 中删除 `testIndexActionViewModelTemplateRenderedWithinLayout`\
  \ 方法。此方法仅适用于 *whatstore* 主页。\n\n- 4. 还要删除 `testInvalidRouteDoesNotCrash` 方法。该方法已为\
  \ `Application` 模块定义。\n\n如果您再次执行 **运行方式/PHPUnit 测试**，`IndexControllerTest` 将再次失败。现在，原因是\
  \ `inventory` 路由尚不存在。我们需要在 `Inventory` 模块的 `module.config.php` 文件中创建此路由。\n\n\n\n\
  \n\n- 5. 将以下代码添加到 module.config.php 文件中，使文件中的 routes 键如下所示：\n\n```php\n'routes'\
  \ => [\n    'inventory' => [\n        'type' => Segment::class,\n        'options'\
  \ => [\n            'route' => '/inventory[:/controller[/:action[/:key]]]',\n  \
  \          'defaults' => [\n                'controller' => Controller\\IndexController::class,\n\
  \                'action' => 'index'\n            ],\n        ],\n    ],\n],\n```\n\
  \n我们已创建一种 Segment 类型的路由，即接受参数的路由。我们在第 4 章“从对象关系映射到 MVC 容器”中已经学习过此路由。方括号之间的单词为可选项。冒号前的单词为变量。inventory\
  \ 路由允许我们定义要实例化的控制器、要执行的动作以及用于选择要处理对象的 key 参数。如果未提供这些参数，则默认控制器为 IndexController，默认动作为\
  \ index。\n\n- 6. 将 StoreTest\\Controller\\IndexControllerTest 类的 testIndexActionCanBeAccessed\
  \ 方法更改为以下代码：\n\n```php\npublic function testIndexActionCanBeAccessed() : void\n\
  {\n    $this->dispatch('/store', 'GET');\n    $this->assertResponseStatusCode(200);\n\
  \    $this->assertModuleName('store');\n    $this->assertControllerName(IndexController::class);\
  \ // as specified in router's controller name alias\n    $this->assertControllerClass('IndexController');\n\
  \    $this->assertMatchedRouteName('store');\n}\n```\n\n- 7. 然后，根据我们已完成的工作，从 StoreTest\\\
  Controller\\IndexControllerTest 中移除 testIndexActionViewModelTemplateRenderedWithinLayout\
  \ 方法。别忘了也移除 testInvalidRouteDoesNotCrash 方法。\n\n正如我们应该学到的，我们需要在 Store 模块的 module.config.php\
  \ 文件中创建此路由。该文件中的 routes 键必须如下所示：\n\n```php\n'routes' => [\n    'store' => [\n  \
  \      'type' => Segment::class,\n        'options' => [\n            'route' =>\
  \ '/store[:/controller[/:action[/:key]]]',\n            'defaults' => [\n      \
  \          'controller' => Controller\\IndexController::class,\n               \
  \ 'action' => 'index',\n            ],\n        ],\n    ],\n],\n```\n\n太好了——暂时，我们的测试运行成功。从现在开始，我们将使用测试来实现产品的控制器层和视图层。我们的产品控制器层将有两个控制器类，一个用于接收来自\
  \ HTML 默认页面（whatstore 应用程序的一部分）的请求，另一个用于接收来自任何客户端的请求。此架构允许其他客户端（如移动应用程序）使用 whatstore\
  \ 的服务。图 7.3 描绘了该面向服务的架构：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_182_0.png)\n\
  \n### 图 7.3 – 产品控制器架构\n\n我们将从 ProductAPIController 开始，任何客户端都可以使用它。正如我们已定义的，我们将实现一个测试类来构建控制器类。在这样做之前，请执行以下操作：\n\
  \n- 1. 在 Inventory 模块的 test/Controller 文件夹中，将 IndexControllerTest.php 文件复制到 ProductAPIControllerTest.php。\n\
  - 2. 将上述文件中的类名更改为 ProductAPIControllerTest 并移除 testIndexActionCanBeAccessed 方法。\n\
  \n现在，让我们为 ProductAPIController 类实现测试方法。\n\n### 测试产品插入\n\n要在 ProductAPIControllerTest\
  \ 中创建的第一个测试方法将是 testProductInsert。代码如下：\n\n```php\npublic function testProductInsert()\
  \ : void\n{\n    $discount = new Discount();\n    $data = [\n        'name' => 'no\
  \ discount',\n        'operator' => '-',\n        'factor' => 0\n    ];\n    $discount->exchangeArray($data);\n\
  \    $discountTable = $this->getApplication()->getServiceManager()->get('DiscountTable');\n\
  \    $discountTable->save($discount);\n    $discount = $discountTable->getByField('name',\
  \ 'no discount');\n\n    $_POST = [\n        'name' => 'Cosmic Cube',\n        'price'\
  \ => 5642,\n        'code_discount' => $discount->code\n    ];\n\n    $this->dispatch('/inventoryapi/productapi',\
  \ 'POST', $_POST);\n    $this->assertResponseStatusCode(200);\n    $this->assertModuleName('inventory');\n\
  \    $this->assertControllerName('productapi'); // as specified in router's controller\
  \ name alias\n    $this->assertControllerClass('ProductAPIController');\n    $this->assertMatchedRouteName('inventoryapi');\n\
  }\n```\n\ntestProductInsert 方法执行以下操作：\n\n- 创建并持久化一个 Discount 对象\n- 向 /inventoryapi/productapi\
  \ 端点发送 HTTP POST 请求\n- 检查响应是否具有 200 状态（成功）\n- 检查被调用的模块是否为 Inventory\n- 检查被调用控制器名称的别名是否为\
  \ productapi\n- 检查被调用的控制器名称是否为 ProductAPIController\n- 检查路由名称是否为 inventoryapi\n\n\
  我们需要定义重定向到 ProductAPIController 的 inventoryapi 路由。我们还需要为 ProductController 定义另一个路由。因此，在\
  \ Inventory 模块的 module.config.php 文件中，我们将以下路由添加到 routes 键：\n\n```php\n'routes' =>\
  \ [\n    'inventory' => [\n        'type'     => Segment::class,\n        'options'\
  \  => [\n            'route'    => '/inventory[:/controller[/:action[/:key]]]',\n\
  \            'defaults' => [\n                'controller' => Controller\\IndexController::class,\n\
  \                'action'     => 'index'\n            ],\n        ],\n    ],\n \
  \   'inventoryapi' => [\n        'type'     => Segment::class,\n        'options'\
  \  => [\n            'route'    => '/inventoryapi[:/controller[/:key]]'\n      \
  \  ],\n    ],\n],\n```\n\n> **重要提示：RESTful 控制器不得具有默认动作**\n>\n> 当我们使用 RESTful 控制器时，不得定义默认动作。原因是默认动作会覆盖\
  \ HTTP 方法的推断。\n\n在实现产品插入的测试后，我们将接下来实现产品恢复的测试。\n\n### 测试产品恢复\n\n我们将在 ProductAPIControllerTest\
  \ 类中实现 testProductRecover 方法，代码应如下所示：\n\n```php\npublic function testProductRecover()\
  \ : void\n{\n    $name = 'Cosmic Cube';\n    $this->dispatch('/inventoryapi/productapi/'\
  \ . $name, 'GET');\n    $this->assertResponseStatusCode(200);\n    $this->assertModuleName('inventory');\n\
  \    $this->assertControllerName('productapi'); // as\n    $this->assertControllerClass('ProductAPIController');\n\
  \    $this->assertMatchedRouteName('inventoryapi');\n    $body = $this->getResponse()->getBody();\n\
  \    $this->assertStringContainsString($name, $body);\n}\n```\n\ntestProductRecover\
  \ 方法执行以下操作：\n\n- 向 /inventoryapi/productapi 端点发送 HTTP GET 请求（注意搜索参数为产品名称）\n- 检查响应是否具有\
  \ 200 状态（成功）\n- 检查被调用的模块是否为 Inventory\n- 检查被调用控制器名称的别名是否为 productapi\n- 检查被调用的控制器名称是否为\
  \ ProductAPIController\n- 检查路由名称是否为 inventoryapi\n- 检查响应体是否包含产品名称\n\n在实现产品恢复的测试后，我们将实现产品更新的测试。\n\
  \n### 测试产品更新\n\n现在，我们将在 ProductAPIControllerTest 类中实现 testProductUpdate 方法，代码如下所示：\n\
  \n```php\npublic function testProductUpdate() : void\n{\n    $productTable = $this->getApplication()->getServiceManager()->get('ProductTable');\n\
  \    $product = $productTable->getByField('name', 'Cosmic Cube');\n    $product->name\
  \ = 'Infinity Gauntlet';\n    $product->price = 9654;\n    $_POST = $product->toArray();\n\
  \    $this->dispatch('/inventoryapi/productapi/' . $product->code, 'PUT', $_POST);\n\
  \    $this->assertResponseStatusCode(200);\n    $this->assertModuleName('inventory');\n\
  \    $this->assertControllerName('productapi'); // as specified in router's controller\
  \ name alias\n    $this->assertControllerClass('ProductAPIController');\n    $this->assertMatchedRouteName('inventoryapi');\n\
  }\n```\n\ntestProductUpdate 方法执行以下操作：\n\n- 获取 ProductTable 的实例\n- 恢复之前插入的产品\n- 将产品数据提取到\
  \ $_POST 变量中\n- 向 /inventoryapi/productapi 端点发送 HTTP PUT 请求（注意搜索参数为产品代码）\n- 检查响应是否具有\
  \ 200 状态（成功）\n- 检查被调用的模块是否为 Inventory\n- 检查被调用控制器名称的别名是否为 productapi\n\n\n\n\n\n\
  - 检查调用的控制器名称是否为 `ProductAPIController`\n- 检查路由名称是否为 `inventoryapi`\n\n在实现产品更新测试后，我们将实现产品删除测试。\n\
  \n### 测试产品删除\n\n最后，为了完成 API 测试，我们将在 `ProductAPIControllerTest` 类中实现 `testProductDelete`\
  \ 方法。代码应如下所示：\n\n```\npublic function testProductDelete() : void\n{\n    $productTable\
  \ = $this->getApplication() ->\n        getServiceManager()->get('ProductTable');\n\
  \    $product = $productTable->getByField('name',\n        'Infinity Gauntlet');\n\
  \    $this->dispatch('/inventoryapi/productapi/' .\n        $product->code, 'DELETE');\n\
  \    $this->assertResponseStatusCode(200);\n    $this->assertModuleName('inventory');\n\
  \    $this->assertControllerName('productapi'); // as\n        specified in router's\
  \ controller name alias\n    $this->assertControllerClass\n        ('ProductAPIController');\n\
  \    $this->assertMatchedRouteName('inventoryapi');\n    $discountTable = $this->getApplication()\
  \ ->\n        getServiceManager()->get('DiscountTable');\n    $discount = $discountTable->getByField('name',\
  \ 'no\n        discount');\n    $discountTable->delete($discount->code);\n}\n```\n\
  \ntestProductDelete 方法执行以下操作：\n\n- 获取 `ProductTable` 的实例\n- 恢复先前插入的产品\n- 向 `/inventoryapi/productapi`\
  \ 端点发送 HTTP DELETE 请求（请注意，删除的参数是产品代码）\n- 检查响应是否具有 200 状态码（成功）\n- 检查调用的模块是否为 Inventory\n\
  - 检查调用的控制器名称的别名是否为 productapi\n- 检查调用的控制器名称是否为 ProductAPIController\n- 检查路由名称是否为\
  \ inventoryapi\n- 恢复由 testProductInsert 方法插入的 Discount 对象\n- 使用 DiscountTable 实例删除折扣\n\
  \n如果您现在执行 Run As/PHPUnit 测试，ProductAPIControllerTest 将失败，因为我们没有 ProductAPIController\
  \ 类。我们将在下一节中创建此类。\n\n### 创建 ProductAPIController 类\n\n在 Inventory 模块的 src/Controller\
  \ 文件夹中创建 ProductAPIController.php 文件。让我们逐部分查看 ProductAPIController.php 文件的源代码。此文件以以下内容开始：\n\
  \n```\n<?php\nnamespace Inventory\\Controller;\nuse Laminas\\Mvc\\Controller\\AbstractRestfulController;\n\
  use Laminas\\View\\Model\\JsonModel;\nuse Inventory\\Model\\Product;\nuse Inventory\\\
  Model\\ProductTable;\n```\n\n在 ProductAPIController 类的第一部分中，我们使用了四个依赖项。ProductAPIController\
  \ 类扩展 AbstractRestfulController。此超类旨在将 HTTP 方法映射到特定方法：\n\n```\nclass ProductAPIController\
  \ extends\nAbstractRestfulController\n{\n```\n\n从 AbstractRestfulController 继承的\
  \ $identifierName 属性被重写为键值。$identifierName 的默认值为 id，但 inventoryapi 路由定义了键参数。\n\n\
  由于 ProductAPIController 处理产品，它需要有一个 ProductTable 实例的属性：\n\n```\nprotected $identifierName\
  \ = 'key';\nprivate ProductTable $productTable;\n```\n\n构造方法接收 ProductTable 实例并将其分配给\
  \ productTable 属性：\n\n```\npublic function __construct(ProductTable $productTable)\n\
  {\n    $this->productTable = $productTable;\n}\n```\n\nHTTP POST 映射到 create 方法：\n\
  \n```\npublic function create($data)\n{\n    $product = new Product();\n    $product->exchangeArray($data);\n\
  \    $inserted = $this->productTable->save($product);\n    return new JsonModel(['inserted'\
  \ => $inserted]);\n}\n```\n\ncreate 方法接收的 $data 参数包含来自 $_POST 的数据。\n\nHTTP GET（带参数）映射到\
  \ get 方法：\n\n```\npublic function get($id)\n{\n    $field = (is_numeric($id) ? 'code'\
  \ : 'name');\n    $id = (is_numeric($id) ? (int) $id : $id);\n    $product = $this->productTable->getByField($field,\
  \ $id);\n    return new JsonModel(['product' => $product->toArray()]);\n}\n```\n\
  \nHTTP PUT 映射到 update 方法：\n\n```\npublic function update($id, $data)\n{\n    $product\
  \ = $this->productTable->getByField('code', $id);\n    $product->exchangeArray($data);\n\
  \    $updated = $this->productTable->save($product);\n    return new JsonModel(['updated'\
  \ => $updated]);\n}\n```\n\nHTTP DELETE 映射到 delete 方法：\n\n```\npublic function delete($id)\n\
  {\n    $deleted = $this->productTable->delete($id);\n    return new JsonModel(['deleted'\
  \ => $deleted]);\n}\n```\n\n请注意，ProductAPIController 的方法返回 JsonModel 实例。\n\nJsonModel\
  \ 类将注入其构造函数的数据转换为 JSON 格式——这是 API 的适当行为。但是，要使用 JsonModel 将数据发送到视图层，我们需要设置一个策略。默认策略用于\
  \ HTML 页面渲染。要在响应中使用 JSON 格式，我们必须将以下项添加到 Inventory 模块的 modules.config.php 中的 view_manager\
  \ 键：\n\n```\n'strategies' => [\n    'ViewJsonStrategy',\n],\n```\n\n要调用 ProductAPIController\
  \ 类，我们需要将 Inventory 模块中 modules.config.php 的 controllers 键更改为以下内容：\n\n```\n'controllers'\
  \ => [\n    'aliases' => [\n        'productapi' => Controller\\ProductAPIController::class\n\
  \    ],\n    'factories' => [\n        Controller\\IndexController::class =>\n \
  \           InvokableFactory::class,\n        Controller\\ProductAPIController::class\
  \ =>\n            Controller\\ProductAPIControllerFactory::class\n    ],\n],\n```\n\
  \naliases 键（如我们在 *第 4 章，从对象关系映射到 MVC 容器* 中所见）用于将控制器别名映射到实际控制器类名。正如我们所知，factories\
  \ 键定义了如何创建控制器类。我们需要在 Inventory 模块的 src/Controller 文件夹中创建 ProductAPIControllerFactory\
  \ 类。源代码将如下所示：\n\n### ProductAPIControllerFactory.php\n\n```\n<?php\nnamespace Inventory\\\
  Controller;\nuse Laminas\\ServiceManager\\Factory\\FactoryInterface;\nuse Interop\\\
  Container\\ContainerInterface;\nclass ProductAPIControllerFactory implements\nFactoryInterface\n\
  {\n    public function __invoke(ContainerInterface $container,\n    $requestedName,\
  \ array $options = null)\n    {\n    $productTable = $container->get('ProductTable');\n\
  \    return new ProductAPIController($productTable);\n    }\n}\n```\n\n如果您现在执行 Run\
  \ As/PHPUnit 测试，测试将成功运行。因此，产品 API 似乎已完成。在下一节中，我们将创建负责控制 whatstore 应用程序 HTML 页面的类。\n\
  \n### 实现 ProductController 类\n\n我们现在将在 Inventory 模块中创建 ProductControllerTest 类。让我们逐部分进行，从以下源代码开始：\n\
  \n```\n<?php\ndeclare(strict_types=1);\nnamespace InventoryTest\\Controller;\nuse\
  \ Inventory\\Controller\\IndexController;\nuse Laminas\\Stdlib\\ArrayUtils;\nuse\
  \ Laminas\\Test\\PHPUnit\\Controller\\AbstractHttpControllerTestCase;\nuse Inventory\\\
  Controller\\ProductController;\n```\n\n在 ProductAPIController 类的第一部分中，我们使用了四个依赖项。\n\
  \n接下来，我们将使用 setUp 方法准备测试环境，恢复应用程序配置：\n\n```\nclass ProductControllerTest extends\n\
  \    AbstractHttpControllerTestCase\n{\n    public function setUp(): void\n    {\n\
  \        $configOverrides = [];\n        $this->setApplicationConfig(ArrayUtils::merge(\n\
  \            include __DIR__ . '/../../../../../config/application.config.php',\n\
  \            $configOverrides\n        ));\n\n        parent::setUp();\n    }\n\
  }\n```\n\n请注意，应用程序配置的内容与 $configOverrides 数组合并。此 $configOverrides 数组允许我们更改运行测试的配置值。\n\
  \n接下来，我们将使用 testIndexActionCanBeAccessed 方法测试 ProductController 索引页面的请求，该页面将列出产品：\n\
  \n```\npublic function testIndexActionCanBeAccessed(): void\n{\n    $this->dispatch('/inventory/product',\
  \ 'GET');\n    $this->assertResponseStatusCode(200);\n    $this->assertModuleName('inventory');\n\
  \    $this->assertControllerName('product'); // as\n        specified in router's\
  \ controller name alias\n    $this->assertControllerClass('ProductController');\n\
  \    $this->assertMatchedRouteName('inventory');\n}\n```\n\n\n\n\n\n最后，我们将使用 testEditActionCanBeAccessed\
  \ 方法来测试对编辑页面的请求，该请求需要允许我们插入和更新产品：\n\n```php\npublic function testEditActionCanBeAccessed():\
  \ void\n{\n    $this->dispatch('/inventory/product/edit', 'GET');\n    $this->assertResponseStatusCode(200);\n\
  \    $this->assertModuleName('inventory');\n    $this->assertControllerName('product');\
  \ // as specified in router's controller name alias\n    $this->assertControllerClass('ProductController');\n\
  \    $this->assertMatchedRouteName('inventory');\n}\n```\n\n现在，让我们创建要测试的类。以下代码块显示了控制产品注册\
  \ HTML 界面的类：\n\n### ProductController.php\n\n```php\n<?php\ndeclare(strict_types=1);\n\
  namespace Inventory\\Controller;\nuse Laminas\\Mvc\\Controller\\AbstractActionController;\n\
  use Laminas\\View\\Model\\ViewModel;\nuse Inventory\\Model\\ProductTable;\nuse Inventory\\\
  Model\\DiscountTable;\nclass ProductController extends AbstractActionController\n\
  {\n    private ?ProductTable $productTable = null;\n    private ?DiscountTable $discountTable\
  \ = null;\n    public function __construct(ProductTable $productTable,\n    DiscountTable\
  \ $discountTable)\n    {\n    $this->productTable = $productTable;\n    $this->discountTable\
  \ = $discountTable;\n    }\n    public function indexAction()\n{\n    $products\
  \ = $this->productTable->getAll();\n    return new ViewModel(['products' => $products]);\n\
  }\npublic function editAction()\n{\n    $key = $this->params('key');\n    $product\
  \ = $this->productTable->\n        getByField('code',$key);\n    $discounts = $this->discountTable->getAll();\n\
  \    return new ViewModel([\n        'product' => $product,\n        'discounts'\
  \ => $discounts\n    ]);\n}\n}\n```\n\n**用数组代替 ViewModel 对象**\n\n你也可以返回一个数组来代替 ViewModel\
  \ 对象。控制器类会将该数组注入到 ViewModel 对象中。\n\nindexAction 方法检索一组产品并将其传递到视图层。editAction 方法尝试通过产品代码查找产品，并将产品对象和一组折扣传递到视图层。你可能已经发现，产品和折扣的检索依赖于表映射器对象。这些对象由构造函数注入。这种注入是由工厂类\
  \ ProductControllerFactory 完成的，其源代码如下所示：\n\n### ProductControllerFactory.php\n\n\
  ```php\n<?php\nnamespace Inventory\\Controller;\nuse Laminas\\ServiceManager\\Factory\\\
  FactoryInterface;\nuse Interop\\Container\\ContainerInterface;\nclass ProductControllerFactory\
  \ implements FactoryInterface\n{\n    public function __invoke(ContainerInterface\
  \ $container,\n        $requestedName, array $options = null)\n{\n    $productTable\
  \ = $container->get('ProductTable');\n    $discountTable = $container->get('DiscountTable');\n\
  \    return new ProductController($productTable,\n        $discountTable);\n   \
  \ }\n}\n```\n\n我们需要在 modules.config.php 中注册此工厂。此外，我们还需要为 ProductController 注册一个别名。Inventory\
  \ 模块中 modules.config.php 的 controllers 键将如下所示：\n\n```php\n'controllers' => [\n \
  \   'aliases' => [\n        'productapi' => Controller\\\n            ProductAPIController::class,\n\
  \        'product' => Controller\\\n            ProductController::class\n    ],\n\
  \    'factories' => [\n        Controller\\IndexController::class =>\n         \
  \   InvokableFactory::class,\n        Controller\\ProductAPIController::class =>\n\
  \            Controller\\ProductAPIControllerFactory::class,\n        Controller\\\
  ProductController::class =>\n            Controller\\ProductControllerFactory::class,\n\
  \    ],\n],\n```\n\n如果你现在执行 Run As/PHPUnit 测试，测试将失败，并显示以下消息：\n\n```\nThere were\
  \ 2 failures:\n1) InventoryTest\\Controller\\\nProductControllerTest::testIndexActionCanBeAccessed\n\
  Failed asserting response code \"200\", actual status code is\n\"500\"\nExceptions\
  \ raised:\nException 'Laminas\\View\\Exception\\RuntimeException' with\nmessage\
  \ 'Laminas\\View\\Renderer\\PhpRenderer::render: Unable\nto render template \"inventory/product/index\"\
  ; resolver could\nnot resolve to a file' in /opt/lampp/htdocs/whatstore/vendor/\n\
  laminas/laminas-view/src/Renderer/PhpRenderer.php:511\n/opt/lampp/htdocs/whatstore/vendor/laminas/laminas-test/src/\n\
  PHPUnit/Controller/AbstractControllerTestCase.php:434\n/opt/lampp/htdocs/whatstore/module/Inventory/test/Controller/\n\
  ProductControllerTest.php:33\n2) InventoryTest\\\\Controller\\\\\nProductControllerTest::testEditActionCanBeAccessed\n\
  Failed asserting response code \"200\", actual status code is\n\"500\"\nExceptions\
  \ raised:\nException 'Laminas\\\\View\\\\Exception\\\\RuntimeException' with\nmessage\
  \ 'Laminas\\\\View\\\\Renderer\\\\PhpRenderer::render: Unable\nto render template\
  \ \"inventory/product/edit\"; resolver could\nnot resolve to a file' in /opt/lampp/htdocs/whatstore/vendor/\n\
  laminas/laminas-view/src/Renderer/PhpRenderer.php:511\n/opt/lampp/htdocs/whatstore/vendor/laminas/laminas-test/src/\n\
  PHPUnit/Controller/AbstractControllerTestCase.php:434\n/opt/lampp/htdocs/whatstore/module/Inventory/test/Controller/\n\
  ProductControllerTest.php:43\n```\n\n请注意，错误消息涉及模板渲染。这些错误的原因是我们尚未为这些操作生成 HTTP 响应创建\
  \ HTML 页面。我们将在下一节中创建这些页面。\n\n### 实现 ProductController 的页面\n\n默认情况下，当控制器方法返回 ViewModel\
  \ 对象时，视图管理器将搜索与方法名相同的页面（不包括 Action 后缀）。如果 indexAction 和 editAction 方法的先前测试失败，那么我们必须创建\
  \ index.phtml 和 edit.phtml 文件。这些文件必须在 Inventory/view/inventory/product 文件夹中创建，如图\
  \ 7.4 所示。.phtml 文件是 PHP 文件：\n\n```\nmodule\n  Application\n  Generic\n  Inventory\n\
  \    config\n    src\n    test\n    view\n      error\n      inventory\n       \
  \ index\n    product\n      edit.phtml\n      index.phtml\n  Store\n```\n\n### 图\
  \ 7.4 – Inventory 模块中 ProductController 的视图页面\n\n仅有 edit.phtml 和 index.phtml 文件的存在就足以让\
  \ ProductControllerTest 成功运行，但这并不意味着用户可以与网页进行交互。ProductControllerTests 测试旨在检查这些文件是否存在（结果是，你的内容将与布局合并以组成响应）。\n\
  \n首先，将以下代码添加到 index.phtml 文件中：\n\n### index.phtml\n\n```php\n<h1>Product Registration</h1>\n\
  <a href=\"<?= $this->url('inventory', ['controller' =>\n    'product', 'action'\
  \ => 'edit']) ?>\">Add product</a>\n<table>\n    <thead>\n        <tr>\n       \
  \     <th>code</th>\n            <th>name</th>\n            <th>product</th>\n \
  \           <th>discount</th>\n        </tr>\n    </thead>\n    <tbody>\n<?php\n\
  foreach ($this->products as $product) :\n?>\n\t<tr>\n\t\t<td><button id=\"<?=$product->code?>\"\
  ></button></td>\n\t\t<td><?=$product->name?></td>\n\t\t<td><?=$product->price?></td>\n\
  \t\t<td><?=$product->discount->name?></td>\n\t\t<td><button id=\"<?=$product->discount->name?>\"\
  >delete</button></td>\n\t</tr>\n<?php\nendforeach;\n?>\n    </tbody>\n</table>\n\
  ```\n\n$this->products 属性是在 ProductController->indexAction 方法的 ViewModel 实例构造函数中传递的相同对象。.phtml\
  \ 文件中的 $this 关键字引用 Laminas\\View\\Renderer\\PhpRenderer 类。该类拥有用于生成视图元素的帮助程序，并包含控制器发送的数据。index.phtml\
  \ 文件将呈现页面，如图 7.5 所示：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_199_0.png)\n\n\
  图 7.5 – 产品列表页面\n\n“添加产品”将带你进入由 edit.phtml 呈现的页面。该文件的内容将如下所示：\n\n### edit.phtml\n\
  \n```php\n<h1>Product <?= (empty($this->product->code)) ? 'insert' :\n'update' ?>?</h1>\n\
  <form id=\"product\">\nName: <input type=\"text\" name=\"name\" autofocus=\n\"autofocus\"\
  \ value=\"<?=$this->product->name?>\"><br />\nPrice: <input type=\"text\" name=\"\
  price\" value=\"<?=$\nthis->product->price?>\"><br />\nDiscount: <select name=\"\
  code_discount\" value=\"<?=$\nthis->product->discount->code?>\">\n<?php\nforeach($this->discounts\
  \ as $discount):\n?>\n<option value=\"<?=$discount->code?>\" <?= ($discount->code\
  \ ==\n$this->product->discount->code ? 'selected' : '')?>\n>$discount->name</option>\n\
  <?php\nendforeach;\n?>\n</select><br />\n<input type=\"hidden\" name=\"code\" value=\"\
  <?=$this->product->code?>\">\n```\n\n\n\n```\n</form>\n<button id=\"save\">save</button>\n\
  <a href=\"<?= $this->url('inventory', ['controller' => 'product']) ?>\">Go back</a>\n\
  ```\n\nedit.phtml 文件将呈现图 7.6 所示的页面：\n\n![](img/e6cf5550804ccae9d1859270da8688f5_200_0.png)\n\
  \n图 7.6 – 产品插入表单\n\n我们已定义页面的内容，但它们尚未可用。在下一节中，我们将实现 HTML 页面与产品 API 之间的交互。\n\n###\
  \ 实现 Web 界面与 API 之间的交互\n\n我们将使用 jQuery 在 index.phtml 和 edit.phtml 页面中实现 REST 交互。Laminas\
  \ 应用程序骨架已将 jQuery 带到 public/js 文件夹中。Application 模块的 layout.phtml 文件不仅导入 jQuery 文件，还导入\
  \ Bootstrap 文件。不过，这些文件是直接嵌入在 HTML 文档主体中的。我们将更改为在 HTML 文档头部导入这些文件：\n\n- 打开 modules/Application/view/layout\
  \ 中的 layout.phtml 文件，从文件底部删除以下部分：\n\n```php\n<?=$this->inlineScript()\n->prependFile($this->basePath\n\
  ('js/bootstrap.min.js'))\n->prependFile($this->basePath\n('js/jquery-3.5.1.min.js'))\
  \ ?>\n```\n\n然后，我们将在 layout.phtml 的 <head> 节末尾添加以下部分：\n\n```php\n<?=$this->headScript()\n\
  ->prependFile($this->basePath\n('js/bootstrap.min.js'))\n->prependFile($this->basePath\n\
  ('js/jquery-3.5.1.min.js')) ?>\n```\n\n此更改是必要的，因为我们将向文档头部添加依赖于 jQuery 的 JavaScript\
  \ 块。我们也引入 Bootstrap 以保持统一性。\n\n- 让我们返回到 Inventory 模块，使用以下内容修改 view/inventory/product\
  \ 中的 edit.phtml 文件：\n\n### edit.phtml\n\n```php\n<?php\n$this->headScript() ->appendScript\n\
  (file_get_contents(__DIR__ . '/edit.js'));\n?>\n<h1>Product <?= (empty($this->product->code))\
  \ ?\n'insert' : 'update' ?></h1>\n<form id=\"product\">\nName: <input type=\"text\"\
  \ name=\"name\"\nautofocus=\"autofocus\" value=\"<?=$this->product->name?>\"><br/>\n\
  Price: <input type=\"text\" name=\"price\"\nvalue=\"<?=$this->product->price?>\"\
  ><br/>\nDiscount: <select name=\"code_discount\">\n<?php\nforeach($this->discounts\
  \ as $discount):\n?>\n<option value=\"<?=$discount->code?>\" <?= \n($discount->code\
  \ == $this->product->discount->code\n? 'selected' : '')?>> <?=$discount->name?></option>\n\
  <?php\nendforeach;\n?>\n</select><br/>\n<input type=\"hidden\" name=\"code\" value=\"\
  <?=$this->product->code?>\" />\n</form>\n<button id=\"save\">save</button>\n<p>\n\
