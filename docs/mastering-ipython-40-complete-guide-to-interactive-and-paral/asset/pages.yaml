  md: "This code is interesting enough to look more closely at:\n\n+   - **Line 1:**\
    \ This magic starts the multiline R interpreter. Unlike the `%R` magic, it does\
    \ not return anything to IPython by default. The values of variables can be pushed\
    \ to/from R using commands that will be covered later in this section.\n+   -\
    \ **Lines 2-3:** These lines slice the mtcars dataset/array. A subscript notation\
    \ is used, where the subscript is a test. In English, line 2 translates to \"\
    return all the lines in mtcars for which the cyl column has the value 4\" (similarly\
    \ for line 3 and eight cylinders). The comma is required.\n\n> There is a subtle\
    \ difference in R between `=` and `<-`, but it need not concern us here. For our\
    \ purposes, replacing the equal to sign with the arrow would make no difference.\n\
    \n+   - **Line 4:** This performs a t-test comparing the mpg columns of the four-\
    \ and eight-cylinder cars we separated out in the previous lines. To make a long\
    \ story short, given the cars included in the dataset, four-cylinder cars almost\
    \ certainly make better gas mileage than eight-cylinder cars.\n\n# Pulling and\
    \ pushing\n\nGiven our previous example, it might be interesting to know which\
    \ cars had four cylinders (perhaps they were not representative of four-cylinder\
    \ cars in general and our test would be less informative than we thought). Despite\
    \ the fact that the `%R` magic does not return a value and the magic is over,\
    \ that data has not gone away. It was stored in the fourCyl variable, which lives\
    \ on in the shared R instance and can be pulled into IPython using the `%Rpull`\
    \ magic:\n\n```\nIn [40]: %Rpull fourCyl\n\nIn [41]: fourCyl\nOut[41]:\n\n   \
    \          mpg  cyl   disp   hp  drat    wt   qsec  vs  am  gear  carb\nDatsun\
    \ 710    22.8    4  108.0   93  3.85  2.320  18.61   1   1     4     1\nMerc 240D\
    \     24.4    4  146.7   62  3.69  3.190  20.00   1   0     4     2\nMerc 230\
    \      22.8    4  140.8   95  3.92  3.150  22.90   1   0     4     2\n```"
