    Ran 3 tests in 0.227s\n\nOK\n```\n\n# Decorators\n\nIt was somewhat awkward to\
    \ use `assertLess` for one test and `assertGreater` for other tests. This is the\
    \ sort of small inconsistency that can easily be overlooked, leading to bigger\
    \ problems later on. Even worse, it might be caught and \"corrected\" only for\
    \ that correction to cause the test to fail and lead to a lot of confused standing\
    \ around as to why it was written that way in the first place.\n\nThis sort of\
    \ thing happens all the time, especially when tests are not written before code.\n\
    \n> **Test-driven development**\n> **Test-driven development (TDD)** is a software\
    \ development process in which tests are written before code. This process allows\
    \ them to be used as an automated means by which code can be checked against (at\
    \ least some of) the requirements. The tests can also be used to ensure that future\
    \ changes to the code do not break any already existing functionality.\n\nIn theory,\
    \ all tests should be run and passed before the code is accepted. This is not\
    \ always practical. To this end, unittest provides decorators to allow the tester\
    \ to explicitly mark failing and skipped tests.\n\nFor example, our previous test\
    \ can be decorated as follows:\n\n```\n@unittest.expectedFailure\ndef test_bad(self):\n\
