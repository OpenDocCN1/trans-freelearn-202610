  md: "# Works Well with Others – IPython and Third-Party Tools\n\n```\n```text\n\
    <FloatVector - Python:0x2ad3d0e06508 / R:0x2847ca0>\n\n[4.000000, 4.000000, 4.000000,\
    \ ..., 5.000000, 5.000000, 4.000000]\n\ndisp: <class 'rpy2.robjects.vectors.FloatVector'>\n\
