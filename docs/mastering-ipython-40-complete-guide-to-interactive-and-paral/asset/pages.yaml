  md: '# # 恶性结节和良性结节


    ![](img/8628b86fcc4f22d859c0104c2ec1d15f_51_0.png)


    **良性结节**：形态规则、边界清晰、内部回声均匀


    **恶性结节**：形态不规则、边界模糊、内部回声不均匀


    乳腺结节的发病率逐年增高，超声检查是发现乳腺结节的主要手段之一。良性结节和恶性结节的超声征象有较大区别。良性结节多表现为形态规则、边界清晰、内部回声均匀；恶性结节多表现为形态不规则、边界模糊、内部回声不均匀。'
