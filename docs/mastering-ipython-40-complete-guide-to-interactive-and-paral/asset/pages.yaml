- pgno: 24
  md: 'The same is true today, except that the models have become larger and the simulations
    more intricate. Testing a new nuclear missile by actually launching it is ill-advised.
    Instead, a model of the missile is built in software and a simulation of its launching
    is run on a computer. Design flaws can be exposed in the computer (where they
    are harmless), and not in reality.


    Modeling a missile is much more complex than modeling the course of a ship. There
    are more moving parts, the relevant laws of physics are more complicated, the
    tolerance for error is lower, and so on and so forth. This would not be possible
    without employing more sophisticated tools than the medieval navigator had access
    to. In the end, it is our tools'' abilities that limit what we can do.


    It is the nature of problems to expand to fill the limits of our capability to
    solve them. When computers were first invented, they seemed like the answer to
    all our problems. It did not take long before new problems arose.


    # FORTRAN to the rescue – the problems FORTRAN addressed


    After the initial successes of the computer (breaking German codes and calculating
    logarithms), the field ran into two problems. Firstly, the machine itself was
    slow — or at least slower than desired — for the new problems at hand. Secondly,
    it took too long to write the instructions (code) that the machine would execute
    to solve the problem.


    Making the machine itself faster was largely an engineering problem. The underlying
    substrate went from steam and valves to electromechanical relays to vacuum tubes
    to integrated circuits. Each change in the substrate improved the rate at which
    instructions could be executed. This form of progress, while interesting, is outside
    of the scope of this book.


    Once computers evolved past needing their programs to be wired up, programmers
    were free to start expressing their algorithms as text, in a programming language.
    While typing is faster than running wires, it has its own issues. Fortran was
    one of the first languages to address them successfully.


    # Readability


    Early languages were generally not very human-friendly. It took specialized training
    to be able to write (and read) programs written in these languages. Programmers
    would often add comments to their code, either within the code itself or in external
    documentation, but the problem was deeper. The languages themselves were cryptic.'
  merge: -1
