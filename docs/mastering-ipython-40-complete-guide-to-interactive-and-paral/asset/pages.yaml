  md: "# Broadcasting\n\nBroadcasting would seem to be inapplicable when using MPI:\
    \ after all, every process has the same code, so what could one know that another\
    \ did not? One example of asymmetry comes from the use of I/O. Consider a program\
    \ that receives input from the user, and then acts upon that input in each process.\
    \ It would be madness for each process to ask for user input independently. The\
    \ rank 0 process should gather the input and then send it to all the other processes,\
    \ for example:\n\n```\n```python\nfrom mpi4py import MPI\n\ncomm = MPI.COMM_WORLD\n\
    rank = comm.Get_rank()\n\nif rank == 0:\n    data = input(\"Please enter random\
    \ number seed\")\nelse:\n    data = None\n\n# mpi4py wants to send an object,\
    \ so we will leave the\n# input in that format\ndata = comm.bcast(data, root=0)\n\
    ```\n```\n\n# Reduce\n\nWith all the processes performing separate operations,\
    \ it can be useful to combine their results. For example, when computing the Reimann\
    \ integral of a function, it can be much more efficient to divide the work across\
    \ several processes. The result is then the sum of the values calculated in each\
    \ process, for example:\n\n```\n```python\nimport numpy\n\nimport sys\nfrom mpi4py\
    \ import MPI\n\ncomm = MPI.COMM_WORLD\nrank = comm.Get_rank()\n\n# integrate from\
    \ in [0, 4] using 8 rectangles\na = 0\nb = 4\n```\n```"
  merge: -1
