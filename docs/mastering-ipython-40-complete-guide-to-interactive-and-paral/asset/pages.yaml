- pgno: 106
  md: "# Data parallelism\n\nSo far we have talked primarily about the way tasks are\
    \ distributed, and have left the data in the background. It can be instructive\
    \ to look at the way data is obtained and made available to the tasks, also. After\
    \ all, if a task is starved for data it cannot produce any results.\n\n# No data\
    \ dependence\n\nThis is the situation where each task either needs no data, or\
    \ can independently generate it (perhaps through sensor readings or a random number\
    \ generator). This can often happen when running Monte Carlo simulations, where\
    \ the only input to each simulation is a random number.\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_106_0.png)\n\
    \n> **Monte Carlo simulation**\n> \n> It is often the case in a simulation, that\
    \ exact values for parameters are not known. When this is the case, the Monte\
    \ Carlo method entails running the simulation multiple times, with each run using\
    \ a valid but randomly chosen value for each parameter. The results of the runs\
    \ can then be combined statistically to provide an estimate of the desired result.\n\
    \nIn this example, each instance of the simulation may as well generate its own\
    \ random number, so the only data exchanges are as follows:\n\n+   - At the beginning\
    \ of the run, some minimal amount of configuration data will be sent (for example,\
    \ number of steps or tolerance)\n+   - At the end of the run, when results are\
    \ collected\n\nConsider the following Monte Carlo calculation of Pi:\n\n```\n\
    def monteCarloPI(n):\n    s = 0\n    for i in xrange(n):\n        x = random()\n\
    \        y = random()\n        if x*x + y*y <= 1:\n            s+=1\n    return\
    \ 4.*s/n\n\ndef parCalcPI(view, n):\n    p = len(view.targets)\n\n    ar = view.apply(monteCarloPI,\
    \ n)\n    return sum(ar)/p\n```"
  merge: -1
  img_proc: true
