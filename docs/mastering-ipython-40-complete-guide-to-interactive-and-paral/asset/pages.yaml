- pgno: 102
  md: "Given a function func to process the data, and a subset function to determine\
    \ what data to send to each engine, this will put the results of all the parallel\
    \ calls into the results list.\n\nWhile not as powerful or sophisticated as Hadoop,\
    \ these mechanisms provide a lightweight alternative suitable for exploratory\
    \ analysis on smaller data sets.\n\n# MIMD\n\nThe Multiple Instruction Multiple\
    \ Data stream paradigm describes a situation where multiple processors can be\
    \ executing different instructions on different data streams. It can be viewed\
    \ as a slightly more general form of SIMD, where each processing unit does not\
    \ have to be in sync with all the other processing units. In practice, the term\
    \ usually refers to the (even more general) MPMD paradigm, which will be discussed\
    \ later.\n\n# MPMD\n\nThe Multiple Program Multiple Data stream paradigm is the\
    \ most general form of parallel computing. In this paradigm, the individual processing\
    \ units are essentially independent programs that may or may not communicate with\
    \ each other. This can be especially handy in heterogeneous environments, where\
    \ different portions of the system may require various specialized resources.\n\
    \nGiven a program using slight modifications of earlier examples, we would want\
    \ to ensure that the useGPUs function was executed only on nodes with an attached\
    \ GPU:\n\n```\nimport numpy\nfrom numba pro import vectorize\n\n@vectorize([\"\
    float32(float32, float32)\"], target=\"gpu\")\ndef vectorAdd(a, b):\n    return\
    \ a + b\n\ndef useGPUs():\n    N = 64\n\n    A = numpy.random.rand(N).astype(numpy.float32)\n\
    \    B = numpy.random.rand(N).astype(numpy.float32)\n    C = numpy.zeros(N, dtype=numpy.float32)\n\
    \n    C = vectorAdd(A, B)\n    print(C)\n```"
  merge: -1
