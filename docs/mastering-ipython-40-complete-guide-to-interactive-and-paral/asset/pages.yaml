    ================================================= 1 passed in 0.02 seconds\n=================================================\n\
    ```\n\nEven the results can be abbreviated with the `-q` command-line argument:\n\
    \n```\nIn [3]: !py.test -q test_2.py\n.\n1 passed in 0.01 seconds\n```"
