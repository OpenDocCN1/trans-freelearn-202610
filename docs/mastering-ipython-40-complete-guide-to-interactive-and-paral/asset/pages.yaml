- pgno: 316
  md: '# Docutils


    Docutils is a suite of utilities for transforming text files that contain reStructuredText
    into other formats, including HTML, XML, and LaTeX. It is meant to bridge the
    gap between what users want to read (aesthetically pleasant formats) and what
    programmers can easily type (plain text). Docutils falls into two broad categories:
    libraries (to do behind-the-scenes parsing and manipulation) and frontend tools
    (which use libraries to produce a particular output format).


    # Installation


    Docutils can be installed using pip:


    ```

    pip install docutils

    ```


    This will install a number of scripts, including the important transformation
    scripts. The author''s installation is included:


    +   - `rst2html.py`

    +   - `rst2latex.py`

    +   - `rst2man.py`

    +   - `rst2odt_prepstyles.py`

    +   - `rst2odt.py`

    +   - `rst2pseudoxml.py`

    +   - `rst2s5.py`

    +   - `rst2xetex.py`

    +   - `rst2xml.py`

    +   - `rstpep2html.py`


    # Usage


    These scripts can be used from the command line. They expect an input from `stdin`
    and produce the output in `stdout`:


    ```

    ./rst2html.py <infile> > <outfile>

    ```'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Documenting source files


    Unfortunately, unlike Javadoc, Docutils cannot take a .py file full of Python
    code and automatically extract the docstrings from it in order to generate documentation.
    There is a tool called Epydoc that will do this, but the project has been inactive
    since 2009. A team could write a script to attempt to extract just the docstrings,
    but there is a better solution. It will be outlined in the next section.


    # Sphinx


    Sphinx is a documentation generation tool. It began as a way to produce Python
    documentation, but it is branching out to other languages, notably C/C++. It can
    produce output in several formats, including HTML, LaTeX, ePub, man pages, and
    plain text, among others. It accepts reStructuredText and builds upon the Docutils
    suite, adding a few pieces of markup along the way.


    # Installation and startup


    Sphinx can be installed using `pip`:


    ```

    pip install sphinx

    ```


    Installation will add several scripts to the path. The first one we will examine
    is named `sphinx-quickstart`. It will set up a prompt the user for information
    and then a source directory, a configuration file, and some skeleton files:


    ```

    bash-4.1$ sphinx-quickstart

    Welcome to the Sphinx 1.3.6 quickstart utility.


    Please enter values for the following settings (just press Enter to accept a default
    value, if one is given in brackets).


    Enter the root path for documentation.

    > Root path for the documentation [.] : docs


    You have two options for placing the build directory for Sphinx output.

    Either, you use a directory "_build" within the root path, or you separate

    "source" and "build" directories within the root path.

    ```'
