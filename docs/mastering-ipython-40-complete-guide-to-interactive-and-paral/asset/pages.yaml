- pgno: 208
  md: 'This code deserves some further description, as the first matplotlib example:


    +   - **Line 1:** The `numpy.random.randn` function creates a one-dimensional
    array of 90,000 floating-point numbers; they follow a normal distribution with
    mean equal to 0 and variance equal to 1.

    +   - **Line 2:** The `hist` function accepts an array as an argument and computes
    and draws the histogram of the array. It takes many optional arguments; in this
    case, we have provided the number of bins to use.


    # Modifying the graph


    It was easy to get the first graph up and running, but it could use some work.
    The first way to change things is to change/add parameters to the constructor.
    For example, suppose we execute this:


    ```

    In [11]: hist(x, 300, orientation="horizontal", color="green")

    ```


    It results in the following:


    ![](img/8628b86fcc4f22d859c0104c2ec1d15f_208_0.png)


    matplotlib2.gif'
