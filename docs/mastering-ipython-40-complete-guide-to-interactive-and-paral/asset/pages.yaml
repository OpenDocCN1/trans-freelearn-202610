- pgno: 19
  md: 'Chapter 9, Documentation, discusses the different audience for documentation
    and their requirements. The use of docstrings with reStructuredText, docutils,
    and Sphinx is demonstrated in the context of good documentation standards.


    Chapter 10, Visiting Jupyter, introduces the Jupyter notebook and describes its
    use as a laboratory notebook combining data and calculations.


    Chapter 11, Into the Future, reflects on the current rapid rate of change and
    speculates on what the future may hold, both in terms of the recent split between
    IPython and the Jupyter project and relative to some emerging trends in scientific
    computing in general.


    # What you need for this book


    This book was written using the IPython 4.0 and 4.0.1 (stable) releases from August
    2015 through March 2016; all examples and functions should work in these versions.
    When third-party libraries are required, the version used will be noted at that
    time. Given the rate of change of the IPython 4 implementation, the various third-party
    libraries, and the field in general, it is an unfortunate fact that getting every
    example in this book to run on every reader''s machine is doubtful. Add to that
    the differences in machine architecture and configuration and the problem only
    worsens. Despite efforts to write straightforward, portable code, the reader should
    not be surprised if some work is required to make the odd example work on their
    system.


    # Who this book is for


    This book is for IPython developers who want to make the most of IPython and perform
    advanced scientific computing with IPython, utilizing the ease of interactive
    computing.


    It is ideal for users who wish to learn about the interactive and parallel computing
    properties of IPython 4.0, along with its integration with third-party tools and
    concepts such as testing and documenting results.


    # Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.'
