    \ everything that can be done with an Rmagic can be done with robjects.r:\n\n\
    ```\n```python\nIn [18]: %R\n\n   ....: letters\n   ....:\n\n[1] \"a\" \"b\" \"\
    c\" \"d\" \"e\" \"f\" \"g\" \"h\" \"i\" \"j\" \"k\" \"l\" \"m\" \"n\" \"o\" \"\
