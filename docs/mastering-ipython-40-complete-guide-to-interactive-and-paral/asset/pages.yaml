  md: "# A test using setUp and tearDown\n\nunittest depends on overloading the setUp\
    \ and tearDown functions from its parent class. As pytest drops the parent class,\
    \ it needs a different mechanism. In fact, it has two: a classic xUnit-style and\
    \ one using fixtures.\n\n# Classic xUnit-style\n\nThe following methods are provided\
    \ to do setup and teardown:\n\n| Method | Effect |\n|---|---|\n| setup_method(self,\
    \ method) | Called before every test method in a class |\n| teardown_method(self,\
    \ method) | Called after every test method in a class |\n| setup_function(function)\
    \ | Called before every test method in a module |\n| teardown_function(function)\
    \ | Called after every test method in a module |\n\nThis makes rewriting our first\
    \ random number test a breeze:\n\n```\nimport numpy as np\nimport myrand\nimport\
    \ scipy.stats\nimport sys\nimport random\n\nclass TestRandoms():\n\n    def setup_method(self,\
    \ mthd):\n        print(\"Doing setUp\")\n        self.numVals = 10000\n     \
    \   self.vals = np.zeros((10), dtype=np.int32)\n        self.randGen = myrand.MyRand()\n\
    \n    def test_bad(self):\n        print(\"Doing test_bad\")\n        x0 = 15\n\
    \        p1 = 50\n        p2 = 100\n        modulus = 2217\n        self.randGen.set(p1,\
    \ p2, x0, modulus)\n        for i in range(self.numVals):\n            tmp = self.randGen.next()\n\
    \            tmp = tmp % 10\n```"
