  md: "# Publisher\n\nThis is the publisher. It uses a PUB socket to send the time\
    \ and weather to an arbitrary number of subscribers:\n\n```\n```python\nimport\
    \ zmq\nimport random\n\ncontext = zmq.Context()\nsocket = context.socket(zmq.PUB)\n\
    socket.bind(\"tcp://*:5678\")\n\nwhile True:\n    topic = \"load\"\n    socket.send(topic\
    \ + \" \" + str(random.random()))\n\n    topic = \"weather\"\n    messagedata\
    \ = \"dark and stormy night\"\n    socket.send(topic + \" \" + messagedata)\n\n\
    \    time.sleep(1)\n```\n```\n\n# Subscriber\n\nThis subscriber uses a SUB socket\
    \ to listen to the preceding publishers. It is, however, only interested in the\
    \ weather:\n\n```\n```python\nimport zmq\n\ncontext = zmq.Context()\nsocket =\
    \ context.socket(zmq.SUB)\nsocket.connect(\"tcp://localhost:5678\")\nsocket.setsockopt_string(zmq.SUBSCRIBE,\
    \ \"weather\")\n\nwhile True:\n    wtr = socket.recv_string()\n    print(\"the\
    \ weather is: \" + wtr)\n```\n```"
