  md: '# # Opening the Toolkit – The IPython API


    This chapter covers some useful features of IPython that did not fit in elsewhere
    and some features that deserved deeper coverage.


    The following topics will be covered:


    +   - Performance profiling

    +   - The `AsyncResult` class

    +   - Results metadata

    +   - The `Client` class

    +   - The `View` class (including `DirectView` and `LoadBalancedView`)


    > > IPython libraries are very flexible in terms of parameters. Most parameters
    are optional, with sensible defaults. This chapter will not attempt to describe
    every parameter for every function, but will instead cover the more interesting
    features provided by these libraries. I have added respective links to the official
    documentations for further reference.


    # ## Performance profiling


    Before optimizing a system, it is handy to know exactly which part is slow. IPython
    adds some specialized tools for this purpose, along with the tools that Python
    provides.'
