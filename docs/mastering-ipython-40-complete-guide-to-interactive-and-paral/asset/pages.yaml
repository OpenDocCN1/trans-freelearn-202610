- pgno: 196
  md: 'The odd thing about Hy''s parentheses is that they come before the function
    name and after the argument, rather than after the function name and around the
    arguments. This is the standard syntax for Lisp and all its dialects. The syntactic
    unit created by this form is called an *expression*, and every expression has
    the same form:


    ```

    (<function> <arguments>)

    ```


    In Hy, everything is an expression, so there will be a lot of parentheses. It
    can look awkward at first, but this simple syntax makes expression evaluation
    simple:


    +   - Apply the function to the arguments to return the value of the expression

    +   - There will only ever be one function


    # Arithmetic operations are in the wrong place


    The code to add 1 and 1 is as follows:


    ```

    (+ 1 1)

    ```


    This follows the standard expression semantics: function first, arguments later
    (in this case, operator first and operands later). It is not Hy''s fault that
    people use infix notation—consistency is a virtue in a programming language. A
    side benefit of this notation is that arithmetic operators can take an arbitrary
    number of operands:


    ```

    (* 1 2 3 4)

    ```


    This returns 24.


    This should not be confused with a prefix version of stack arithmetic, however.
    The expression:


    ```

    (* + + 1 2 3 4)

    ```


    Is a syntax error. It breaks the second rule mentioned in the preceding list by
    having more than one function inside a single set of parentheses.


    # Function composition is everywhere


    One can fix the previous example by using parentheses:


    ```

    (* (+ (+ 1 2) 3) 4)

    ```'
