- pgno: 137
  md: '# # ZeroMQ and IPython


    ZeroMQ is more than a messaging library for parallel environments: IPython has
    moved to using ZeroMQ as its internal messaging infrastructure. In this section,
    we will provide further details on the operation of IPython in terms of the ZeroMQ
    mechanisms underlying it.


    To do this, we will introduce some additional socket types, describe how they
    interact to enable some of IPython''s parallel components, and finish up with
    some use cases employing those components. While this section cannot hope to cover
    all the details of the IPython parallel architecture, it is hoped that these examples
    will provide the user with a basic understanding of the underlying mechanisms.


    # ## ZeroMQ socket types


    ZeroMQ supports a large number of different socket types, 14 at last count (version
    4.2.0). The preceding section provided an overview of some of the important types,
    but a discussion of the IPython architecture requires at least cursory knowledge
    of some advanced socket types:


    +   - **DEALER:** This is similar to a REQ socket, but is asynchronous. Each message
    sent is sent among all connected peers in a round-robin fashion, and each message
    received is fair-queued from all connected peers. It is compatible with ROUTER,
    REP, and DEALER sockets.

    +   - **ROUTER:** This is similar to a REP socket but is asynchronous. It keeps
    track of all connected peers. Every message sent by a router includes the identity
    of the message''s source. This allows the socket to route messages based on their
    origination. Situations where a ROUTER has multiple REQ and REP sockets connected
    require that messages be sent to the correct endpoints.


    # ## IPython components


    *Chapter 3, Stepping Up to IPython for Parallel Computing*, provided an overview
    of the major IPython architectural components. We will provide more details in
    this section, with an emphasis on how each component uses messaging to perform
    its tasks.'
  merge: -1
  img_proc: true
