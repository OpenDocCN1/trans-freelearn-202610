- pgno: 365
  md: 'The difficulty comes from their patchwork nature. Knowing which tool applies
    when and how to use it is more of an art than a science. The situation is analogous
    to the end of the assembly language era: some developers can do amazing things
    with these tools, but not many, and it is becoming apparent that continued ad
    hoc progress will not be enough.


    # Better tools


    Another approach is to empower the programmer by giving them better tools. This
    approach has synergies with the pragmatic evolution approach, in that new techniques
    often require new tools to make them easy to work with, and new tools can spur
    the development of new techniques. There are multiple sections in the Grand Challenges
    paper devoted to tools. The paper calls out several in particular, including compilers,
    debuggers, and development environments.


    IPython has one foot squarely planted in this approach. To use IPython (with Python)
    is to sacrifice some level of performance for other benefits: a high level of
    abstraction, multi-language support, a friendly IDE, and all the other features
    detailed in this book. It is in some way a bet – the cycles spent running IPython
    will outweigh the ones lost to a less efficient final product. Given that the
    power of the tools available is the difference between creating a working product
    at all, and producing one that doesn''t work, this looks to be a safe bet.


    To the extent that IPython is a tool for interactive parallel computing, its future
    looks secure, if unclear. The future is secure to the extent that, as new techniques
    are developed, IPython (and the Jupyter organization as a whole) is well situated
    to integrate them into itself. It is unclear in that no one knows what techniques
    will be developed in the future.


    Because of the ongoing growth in parallel computing, learning IPython is not a
    matter of memorizing some syntax and working through a few koans. IPython will
    grow and evolve over the next few decades in a way that will require developers
    to regularly update their knowledge of the field, in addition to adopting new
    versions of the tool.


    # The Next Big Idea


    It may be that, between evolving new techniques and improving tools, the community
    will arrive at a satisfactory framework for developing parallel systems. If history
    is any guide, however, an entirely new paradigm (similar to the change from hand-coding
    assembly language to compiling a high-level language) will be needed.'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'As an example, consider Notre Dame de Paris. In outline, it sounds a great
    deal like a software project:


    ![](img/8628b86fcc4f22d859c0104c2ec1d15f_366_0.png)


    Source image: https://commons.wikimedia.org/wiki/File:Notre_Dame_dalla_Senna.jpg


    Notre Dame was built over the course of ~182 years (1163 AD - ~1345 AD) under
    at least four different architects. It was in continuous use from its earliest
    days, despite ongoing construction. Although there was a plan at the outset, important
    features (including some of the famous flying buttresses) were added over time
    as construction difficulties uncovered a need for them. It is a remarkable feat
    of engineering.'
  merge: -1
  img_proc: true
- pgno: 367
  md: "What makes it even more remarkable is that, in a very real sense, nobody involved\
    \ really understood what they were doing. The underlying physical laws that justified\
    \ the architectural decisions were not understood until Newton, almost 350 years\
    \ later. Until Newton, all architectural knowledge was a result of trial and error\
    \ – decisions about wall thickness, height, the ability to bear loads, arch height/width,\
    \ and all other structural parameters were made based on the accumulated results\
    \ of past experiment and the architect's own judgement.\n\nThis does not make\
    \ their decisions wrong – obviously, they could build quite large, stable, and\
    \ aesthetically pleasing buildings. What it does mean is that they had strict\
    \ limits to what they could accomplish. As buildings got larger, there were fewer\
    \ previous examples to rely on, and the costs of failure grew.\n\nSoftware development\
    \ for massively parallel machines shares this problem. We have a lot of experience\
    \ building smaller parallel systems, and some for larger degrees of parallelism,\
    \ but the problems (and the costs of failure) are growing. What the field needs\
    \ is something similar to the Principia – a unified theory of parallel programming.\
    \ We need the Next Big Idea.\n\nUntil the Next Big Idea comes along, the scientific\
    \ software development community can advance by adopting some practices from the\
    \ field of software engineering.\n\n# Growing professionalism\n\n> \"A scientist\
    \ builds in order to learn; an engineer learns in order to build.\"\n> \n> – Fred\
    \ Brooks\n\nWhat scientists do and what engineers do is different. Scientists\
    \ are concerned with extending knowledge, engineers with applying it. When a scientist\
    \ builds something, its purpose is fulfilled when the desired knowledge is gained\
    \ – at that point, the useful life of the object is over. When an engineer builds\
    \ something, a long useful lifetime is the purpose of applying the knowledge.\n\
    \nMuch scientific software is written by scientists for scientific purposes. It\
    \ is no surprise that it is often considered expendable once the knowledge it\
    \ was written to produce has been extracted. While this approach produces immediate\
    \ results, other researchers in the field who would also wish to use the software\
    \ often find it difficult to use, maintain, and extend."
  merge: -1
  img_proc: true
