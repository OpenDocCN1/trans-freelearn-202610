- pgno: 117
  md: 'To some extent then, ZeroMQ will attempt to recover from external errors. For
    example, it will try to handle network errors in an intelligent manner, even automatically
    retrying when that makes sense. While the framework cannot handle every error
    that could occur, it is likely that any error that does prevent successful completion
    of a call really requires the attention of the process that initiated the call.
    If it did nothing else, ZeroMQ would be worth using just for this feature.


    If it cannot succeed for whatever reason, at a low level, this means that every
    ZeroMQ call will return a status code or fail an assertion. The Python wrapper
    for ZeroMQ will tend to throw exceptions for any sort of error event. The following
    table summarizes these exceptions:


    | Exception | Condition |

    |---|---|

    | ZMQError | Wraps a ZeroMQ error number |

    | ZMQVersionError | This is raised when a feature is not provided by the linked
    version of libzmq |

    | Again | Wrapper for ZeroMQ''s EAGAIN error |

    | ContextTerminated | Wrapper for ZeroMQ''s ETERM error |

    | NotDone | Timeout while waiting for a message |

    | ZMQBindError | When a socket fails to bind to a port |


    The complete details can be found at `https://pymq.readthedocs.org/en/latest/api/index.html`.
    Every call to ZeroMQ should be wrapped in a try-catch block, and liberal use of
    assertions is encouraged. However, as important as error handling is in production,
    it can tend to clutter up otherwise clean code. All examples will be provided
    without it:


    +   - **Line 14:** Receiving a request is a blocking statement. This process will
    wait indefinitely for a connection on the port specified previously. A limit can
    be specified so that the wait times out.

    +   - **Line 21:** After the message is received and (some minimal) processing
    occurs, a response can be sent back to the process that initiated the connection.
    At a low level, ZeroMQ sends bytes, not Python characters. If both the client
    and the server are Python (and possibly the same version), sending a string in
    this manner should work without issue.


    Cross-language and cross-platform applications may want to use this:


    ```

    socket.send(b"World")

    ```


    Instead of using the following line of code:


    ```

    socket.send("World")

    ```'
