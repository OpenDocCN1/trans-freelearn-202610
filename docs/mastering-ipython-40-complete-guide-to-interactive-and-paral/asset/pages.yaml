  md: "# # Assertions\n\npytest uses the assert statement found in Python. This obviates\
    \ the need to remember all the different `assert*` methods from unittest. Consider\
    \ the difference in readability between this:\n\n```\nself.assertEqual(f(i), ans[i])\n\
    ```\n\nAnd this line of code:\n\n```\nassert f(i) == ans[i]\n```\n\nIn general,\
    \ pytest tests are smaller in terms of lines of code. The `test2.py` test file\
    \ can be rewritten under pytest as follows:\n\n```\nfrom hail2 import f\n\nclass\
    \ TestHailstones():\n\n    def test_f(self):\n        ans = [0, 0, 1, 7, 2, 5,\
    \ 8, 16, 3, 19, 6]\n        for i in range(1, 11):\n            print(i)\n   \
    \         assert f(i) == ans[i]\n```\n\ntest_2.py\n\nHere is the result:\n\n```\n\
    In [2]: !py.test test_2.py\n=================================================\
    \ test session starts ===\n=================================================\n\
    platform linux -- Python 3.4.4, pytest-2.8.7, py-1.4.31, pluggy-0.3.1\nrootdir:\
