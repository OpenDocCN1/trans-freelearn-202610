- pgno: 307
  md: '# # reStructuredText


    One could say a lot of things about the preceding example (in particular, that
    there are more lines of comments than code), but it would be difficult to say
    that the end result is aesthetically pleasing. In particular, compared to the
    output of a program using Javadoc, this documentation looks rather plain. In order
    to remedy this shortcoming, it was decided that a more sophisticated way of specifying
    and generating documentation was needed.


    # ## History and goals


    Jim Fulton of Zope invented StructuredText as a simple markup language. It is
    similar to WikiWikiWebMarkup but simpler. Problems with both the specification
    and the implementation led to David Goodger creating a revised version, called
    reStructuredText. His goals for the language were that it should be:


    +   - Readable

    +   - Unobtrusive

    +   - Unambiguous

    +   - unsurprising

    +   - Intuitive

    +   - Easy

    +   - Scalable

    +   - Powerful

    +   - Language-neutral

    +   - Extensible

    +   - Output-format-neutral


    This led to the publication of PEP 0287 (`https://www.python.org/dev/peps/pep-0287/`).


    # ## Customers


    Any documentation system has three groups of customers: developers, automated
    document generation software, and readers. Each of them has different requirements
    and limitations.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# Documentation


    Developers have to write the documentation. As a class, developers hate typing,
    and hate typing anything that is not code even more. Any attempt to force them
    to write great swathes of comments will result in a failed standard. So much so
    that if documentation can be generated from code, it should be. Any additional
    comments should be easy to create with a standard keyboard and minimal additional
    markup.


    The document generation software turns the characters produced by the developers
    into documents to be consumed by outside readers. This generally consists of a
    transformation from the markup language used by the developers into a more human-readable
    format. For example, the Javadoc written by developers can automatically be transformed
    into HTML that readers can view in a browser. This transformation can include
    the addition of both aesthetic (for example, colors and formatting) and functional
    (for example, hyperlinks) properties. It is important for the document generation
    software that the markup used by the developers be powerful and structured enough
    to support this transformation.


    Readers consume the end result of this transformation. Readers may or may not
    be developers, but they expect the documentation to be structurally well organized.
    The documentation should be easy to read, and it should be easy to find what one
    is looking for. Note that readers often do not have access to the original source
    and might not be able to read the original markup if it were to be available.


    There is an important tension in this division between developers and readers.
    Simply put, readers want as much documentation as possible, and in a structured
    form. Developers will write as little documentation as they can get away with
    and will use as little structure as possible.


    # The solution


    The solution that reStructuredText adopted was to use a two-fold process: a simple
    markup language coupled with powerful documentation generation software. The markup
    is reStructuredText and the software is Docutils. The basic process is simple:


    +   1. The developer writes docstrings in plain text using the reStructuredText
    conventions.

    +   2. Docutils is applied to the resulting code + comments document to generate
    documentation in an external format (for example, HTML or LaTeX).

    +   3. The reader consumes the resulting document in the appropriate viewer.


    We will later take a look at Sphinx, a documentation generation program that builds
    upon and extends reStructuredText and Docutils.'
  merge: -1
  img_proc: true
- pgno: 309
  md: "# Overview\n\nThe basic syntax of reStructuredText is that of regular text,\
    \ with special conventions associated with certain usages. This is in contrast\
    \ with, say, HTML, in which metadata is associated with text through the use of\
    \ angle brackets. For example, in HTML a bulleted list might look like this:\n\
    \n```\n```html\n<ul>\n  <li>Python</li>\n  <li>Java</li>\n  <li>Ruby</li>\n</ul>\n\
    ```\n```\n\nIn reStructuredText, it would look like the following:\n\n+   * Python\n\
    +   * Java\n+   * Ruby\n\nAn important difference is that while HTML (and its\
    \ relatives, such as XML) allows nested tags, reStructuredText does not allow\
    \ nested markup. While this is ordinarily not an issue, it does come up from time\
    \ to time.\n\nWhat follows is a listing of some of the more important usages.\n\
    \n# Paragraphs\n\nA paragraph is a chunk of text separated by one or more blank\
    \ lines. The left edge of paragraphs should line up. If a paragraph is indented\
    \ relative to other paragraphs, it is treated as a quote.\n\nThe reStructuredText\
    \ looks as follows:\n\n> > It turns out Abraham Lincoln never said\n> >\n> > Never\
    \ trust anything you read on the Internet.\n> >\n> > It was Benjamin Franklin"
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Documentation


    This produces HTML output which is displayed as follows:


    ![](img/8628b86fcc4f22d859c0104c2ec1d15f_310_0.png)


    # Text styles


    Text in italics should be surrounded by asterisks (*):


    ```

    Use italics for *emphasis*.

    ```


    Text in bold uses two asterisks (**):


    ```

    Using a **goto** statement is a bold move in structured programming.

    ```


    Unfortunately, there is no easy way to make text both italicized and bold.


    For the most part, reStructuredText is pretty smart in knowing when something
    is markup and when it should be left alone. For example, consider these strings:


    ```

    x = 5*6

    x = 5*6*7

    ```


    The asterisk is not interpreted as making the 6 italicized.


    Surrounding text with double back quotes (``) forces it to be a fixed-space literal—all
    special characters between the quotes are left uninterpreted. Individual characters
    that would otherwise be interpreted as markup can be escaped using a backslash
    (\).


    # Literal blocks


    If there is a need to have an entire paragraph included as a literal block (that
    is, exactly as it is, without any interpretation of markup characters or indentation
    within the paragraph), then a paragraph containing only two colons indicates that
    the following indented or quoted text should be taken literally. This can be useful
    when citing code or explaining markup conventions.'
