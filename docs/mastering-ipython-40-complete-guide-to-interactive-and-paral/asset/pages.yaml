- pgno: 220
  md: '# Interactive plots


    An important feature of Bokeh is the ability to allow the user to interact with
    finished plots. This is accomplished in two ways:


    +   - Built-in Bokeh functionality

    +   - The ability to interface with JavaScript in the browser


    Our example will involve the first option.


    # An example interactive plot


    The following code displays two graphs side by side, and allows the user to select
    a set of points in one graph and see where the corresponding points lie in the
    other graph. The code introduces some new concepts, which will be discussed:


    ```

    In [2]: import numpy as np

    ```


    ```

    In [3]: import bokeh.plotting as bp

    ```


    ```

    In [4]: import bokeh.models as bm

    ```


    ```

    In [5]: bp.output_file("bokeh4.html")

    ```


    ```

    In [6]: x = np.linspace(-2 * np.pi, 2 * np.pi, 100)

    ```


    ```

    In [7]: y0 = np.cos(x)

    ```


    ```

    In [8]: y1 = np.sin(x)

    ```


    ```

    In [9]: mySource = bm.ColumnDataSource(data=dict(x=x, y0=y0, y1=y1))

    ```


    ```

    In [10]: myTools = "box_select,lasso_select,help"

    ```


    ```

    In [11]: left = bp.figure(tools=myTools, width=300, height=300,

    title="Left")

    ```'
