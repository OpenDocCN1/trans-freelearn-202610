- pgno: 179
  md: "This fits a straight line and a quadratic equation to the data.\n\n# Using\
    \ rpy2.objects\n\nrpy2 can be imported as a standard module and used from IPython's\
    \ command line. There are various ways of doing this, and the option exists for\
    \ the developer to build their own by building on top of rpy2.interface. The rpy2.objects\
    \ module is a popular choice for general development.\n\n# The basics\n\nWhen\
    \ you import the rpy2.objects module, a singleton object, r, is loaded. This is\
    \ the entry point to an R process. Here is an example:\n\n```\nIn [5]: import\
    \ rpy2.objects as robjects\n\nIn [6]: robjects.r\nOut[6]: <rpy2.objects.R at 0x2ad3d0960a90>\n\
    ```\n\nElements from an R session are available as attributes of the robjects.r\
    \ object:\n\n```\nIn [7]: robjects.r.mtcars\nOut[7]:\n<DataFrame - Python:0x2ad3d0dfd6c8\
    \ / R:0x262cef0>\n[Float..., Float..., Float..., ..., Float..., Float..., Float...]\n\
    \  mpg: <class 'rpy2.objects.vectors.FloatVector'>\n    <FloatVector - Python:0x2ad3d0dfdb08\
    \ / R:0x2daf890>\n[21.000000, 21.000000, 22.800000, ..., 19.700000, 15.000000,\
    \ 21.400000]\n  cyl: <class 'rpy2.objects.vectors.FloatVector'>\n    <FloatVector\
    \ - Python:0x2ad3d0e03488 / R:0x345abaa0>\n[6.000000, 6.000000, 4.000000, ...,\
    \ 6.000000, 8.000000, 4.000000]\n  disp: <class 'rpy2.objects.vectors.FloatVector'>\n\
    \    <FloatVector - Python:0x2ad3d0e03988 / R:0x33ed340>\n[160.000000, 160.000000,\
    \ 108.000000, ..., 145.000000, 301.000000, 121.000000]\n  ...\n  mpg: <class 'rpy2.objects.vectors.FloatVector'>\n\
    \    <FloatVector - Python:0x2ad3d0e03fc8 / R:0x38dfd40>\n[1.000000, 1.000000,\
    \ 1.000000, ..., 1.000000, 1.000000, 1.000000]\n  cyl: <class 'rpy2.objects.vectors.FloatVector'>\n\
    ```"
