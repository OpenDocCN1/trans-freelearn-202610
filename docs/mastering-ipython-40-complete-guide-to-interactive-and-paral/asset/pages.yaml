- pgno: 354
  md: '# The Notebook


    The Jupyter Notebook is the primary cause for the Big Split. Looking back over
    the release notes for the versions of IPython before 4.0, it is clear that a great
    number of the improvements were being made to the notebook component rather than
    the Python-specific features, or even the underlying architecture.


    The Notebook itself is so big it has subprojects of its own:


    +   - The document format (and its API, nbformat)

    +   - nbconvert

    +   - nbviewer


    The Notebook''s primary function is information display - the computation is left
    to the kernels - so it seems unlikely that compatibility issues will arise at
    this level. The notebook provides more functionality than just display, however,
    and more functionality is being added all the time, so the opportunity for compatibility
    issues to arise will persist.


    # The console


    The console is a command-line interface that can communicate with any kernel that
    follows the Jupyter interactive computing protocol. It is not clear why a new
    terminal interface was needed, instead of just using IPython''s terminal now that
    it is language-independent. They certainly look the same from a user''s perspective.
    They may actually be the same, just with some IPython-specific code swapped out
    for Jupyter-compatible code. The documentation explains how to start and use the
    console, but not how it is related to IPython, if at all. A quick search on the
    web is no help, with some sites even claiming that the console is the new IPython.


    # Jupyter Client


    The Jupyter Client package is a Python API used to start, manage, and communicate
    with kernels. IPython also follows this standard for its kernels. It specifies
    the messaging protocol that all kernels must adhere to in order to communicate
    with the notebook. The IPython kernel will certainly continue to adhere to this
    specification as the reference kernel for Jupyter.'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# # The future of Jupyter


    Although Fernando Perez is *Benevolent Dictator For Life*, and there is a Steering
    Committee of 10 members, Jupyter is an open source project using a revised BSD
    license. As such, there is no authoritative list of things to do. Instead, there
    are varying levels of "officialness."


    # ## Official roadmap


    At the first level are the mainline subprojects at the Jupyter GitHub site: `https://github.com/jupyter`.
    A high-level roadmap is held at `https://github.com/jupyter/roadmap`. The following
    table presents some highlights:


    | Feature | Description | Details |

    |---|---|---|

    | **JupyterLab** | Initially a new page in the existing notebook web app that
    allows multiple plugins in the same browser tab | Potentially a replacement for
    the current notebook interface. A major project. |

    | **ipywidgets** | Interactive widgets that tie together code in the kernel and
    JavaScript/CSS/HTML in the browser | Improved styling. General refactoring. Compartmentalization
    of JavaScript. |

    | **JupyterHub** | Manages and proxies multiple instances of the single-user Jupyter
    notebook server | Configuration enhancements. Sharing and collaboration. |

    | **IPython** |  | Comparatively mature, so few major changes planned. |


    At a finer level of detail are the bugs listed under the **Issues** tag and the
    new features under the **Pulls** tag.


    Next in line appear to be the **Jupyter Enhancement Proposals (JEPs)** (`https://github.com/jupyter/enhancement-proposals`).
    According to the documentation (`http://jupyter.readthedocs.org/en/latest/contrib_guide_bugs_enh.html`)
    these are similar to bug requests in that the submitter hopes someone else does
    the work. At present, there are only four Enhancement Proposals on the site. There
    are four pull requests. None of them appear to be prominent parts of the Roadmap.'
  merge: -1
  img_proc: true
