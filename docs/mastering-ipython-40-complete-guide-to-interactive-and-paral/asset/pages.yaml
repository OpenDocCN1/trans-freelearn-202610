    # Bokeh


    Bokeh is a Python interactive visualization library that targets modern web browsers
    for presentation. Its goal is to provide elegant, concise construction of novel
    graphics in the style of D3.js and extend this capability with high-performance
    interactivity over very large or streaming datasets. Bokeh can help anyone who
    wants to quickly and easily create interactive plots, dashboards, and data applications.


    For our purposes, Bokeh can be used to produce graphics that will be viewed from
    web browsers. Although it does not support the same sort of command-line interactivity
    as Matplotlib when used in this manner, the ability to produce durable images
    that are easily viewed remotely is important for purposes such as reporting. In
    addition, Bokeh''s ability to generate web pages using HTML, JavaScript, and CSS
    means that the graph itself can be as interactive as those tools can make it.


    A command-line-driven interactive approach is supported when using a Bokeh server,
    but this is beyond the scope of the current section.


    # Starting Bokeh


    Bokeh can be installed as a standard IPython module using pip:


    ```

    pip install bokeh

    ```


    Once installed, the bokeh libraries can be accessed through a standard import
    statement:


    ```

    In [1]: import bokeh

    ```


    Bokeh is currently in constant flux. The version used in these examples did not
    include a %bokeh or %%bokeh magic, although one may become available.'
