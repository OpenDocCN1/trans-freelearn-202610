- pgno: 288
  md: '# Documentation


    The following topics will be covered in this chapter:


    +   - Inline comments

    +   - Docstrings

    +   - reStructuredText

    +   - Docutils

    +   - Sphinx


    # Inline comments


    We will use the term "inline comment" to refer to all comments that are meant
    for maintenance coders and will never be visible to anyone not reading the source
    code.


    Inline comments start with a # sign and continue up to the end of the line. They
    may not occur within a string literal. No characters within an inline comment
    are interpreted.


    Python does not support block comments. Rumors to the effect that triple double-quotes
    (" " ") can be used to comment out multiple lines are to be disbelieved. While
    that will often work, what actually happens is that Python looks at the included
    lines as one multiline string. As a string, the included lines are not interpreted.
    A string literal is created instead. As this new literal is not assigned to a
    variable, it is immediately garbage-collected.


    In addition to this strange behavior, triple double-quotes are used for docstrings.
    Using them for both purposes can be confusing, which is what we set out to avoid
    in the first place.


    # Using inline comments


    The "official" guide for Python style is PEP 0008 (found at `https://www.python.org/dev/peps/pep-0008/`).
    To the extent that code can be said to be self-documenting, this guide provides
    a standard set of suggestions for stylistic consistency that can help further
    that goal. The section on comments in particular contains some useful recommendations:


    +   - Comments should match code. If the code changes, make sure that the comments
    reflect it.

    +   - Comment in complete sentences.'
  merge: -1
  img_proc: true
- pgno: 289
  md: "+   - Block comments should be at the same indentation level as the code they\
    \ apply to. Each line should start with a # sign and a single space.\n+   - Comments\
    \ should rarely be used on the same line as code.\n\n# Function annotations\n\n\
    Function annotations and type hints can be considered a type of inline comment.\
    \ Function annotations originated in PEP 3107, which provided a syntax for adding\
    \ arbitrary metadata annotations to Python functions. From the definition (https://www.python.org/dev/peps/pep-3107/):\n\
    \n> > \"Because Python's 2.x series lacks a standard way of annotating a function's\
    \ parameters and return values, a variety of tools and libraries have appeared\
    \ to fill this gap. (...) This PEP aims to provide a single, standard way of specifying\
    \ this information, reducing the confusion caused by the wide variation in mechanism\
    \ and syntax that has existed until this point.\"\n\n# Syntax\n\nFunction annotations\
    \ apply to two sorts of things: parameters and return values.\n\n# Parameters\n\
    \nFor parameters, an annotation is indicated by a colon, in a manner similar to\
    \ that of marking a default value by an equal to sign, like this for example:\n\
    \n```\n```python\ndef foo(x: \"int >= 0\"):\n```\n```\n\nBoth an annotation and\
    \ a default value can be indicated by placing them sequentially, as follows:\n\
    \n```\n```python\ndef foo(x: \"int >= 0\" = 0):\n```\n```\n\nInformally, parameters\
    \ can be described like this:\n\n```\n```text\nidentifier [: expression] [= expression]\n\
    ```\n```\n\nHere, both the annotation and the default value are optional.\n\n\
    # Return values\n\nThe return value of the function can be annotated by following\
    \ the parameter list with -> and an expression. Here is an example:\n\n```\n```python\n\
    def foo(x: \"int >= 0\" = 0) -> \"seemingly random integer\":\n    return 42\n\
    ```\n```"
