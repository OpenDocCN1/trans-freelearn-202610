- pgno: 302
  md: "# Documentation\n\nAn important relationship is that of dependency. One part\
    \ can depend on another part logically (through inheritance or composition), functionally\
    \ (for example, by being imported), or temporally (perhaps, one part performs\
    \ the setup required for another part to function correctly). All dependencies\
    \ should be documented.\n\nAnother important relationship is being a part of the\
    \ same pattern. Design patterns are becoming increasingly important and dictating\
    \ the existence of various mechanisms. If a class is part of the implementation\
    \ of a pattern, this should be documented.\n\n# Example uses\n\nAs useful as an\
    \ English description is, there is no substitute for a few examples. There are\
    \ entire operating systems where the only useful documentation is in the form\
    \ of examples.\n\n# Example\n\nWe will take an example from Rosetta Code, the\
    \ Python implementation of the Chinese Remainder Theorem (http://rosettacode.org/wiki/Chinese_remainder_theorem#Python).\
    \ Our implementation will be modified in two ways. First, it will use a class\
    \ rather than the functions shown so that a full range of commenting conventions\
    \ can be demonstrated. Second, it will be brought up to Python 3 from 2.7:\n\n\
    ```\n'''Company boilerplate goes here.\n```\n\nSuppose n1, ..., nk are positive\
    \ integers that are pairwise coprime. Then, for any given sequence of integers\
    \ a1, ..., ak, there exists an integer x solving the following system of simultaneous\
    \ congruences.\n\n```\nx ≡ a1 mod n1\n\nx ≡ a2 mod n2\n\n…\n\nx ≡ ak mod nk\n\
    ```\n\nA full explanation of the theorem can be found at https://en.wikipedia.org/wiki/Chinese_remainder_theorem.\n\
    \n+   **Attributes:**\n+   \n+   - None\n\n**Dependencies:**"
