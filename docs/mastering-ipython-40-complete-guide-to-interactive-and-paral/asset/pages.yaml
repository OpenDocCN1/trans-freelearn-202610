  md: "If display does return a value, things are not much better. First off, it is\
    \ not clear what meaningful value it could return. Maybe true for \"it worked\"\
    \ and false for \"it did not work\"? That value can be tested at least. However,\
    \ it will not resolve the underlying problem — perhaps, display returned true\
    \ but the character was not actually displayed.\n\nThe takeaway from this short\
    \ digression is that testing works better when the code to be tested is written\
    \ in such a way as to make writing meaningful tests easier. The techniques for\
    \ doing so can fill an entire book (and they have). Luckily, scientific and engineering\
    \ code, with its emphasis on mathematical modeling, tends to naturally break down\
    \ into testable functions.\n\n# unittest\n\nunittest is the built-in (since version\
    \ 2.1) testing framework for Python. It is modelled after the excellent JUnit\
    \ framework for Java, and the xUnit testing frameworks in general. This makes\
    \ for a clean, object-oriented style.\n\n# Important concepts\n\nunittest supports\
    \ the standard unit testing parts in a straightforward manner. The following concepts\
    \ map onto functional elements:\n\n+   - **Test case:** This is an individual\
    \ test or group of tests. All tests in a test case belong to the same class and\
    \ share a fixture.\n+   - **Test fixture:** The functions required to do setUp\
    \ and tearDown for all the test cases in a class.\n+   - **Test suite:** This\
    \ is a collection of test cases. Test cases in a test suite are meant to be run\
    \ together.\n+   - **Test runner:** This is a component that runs test suites\
    \ and reports the results to the user.\n\nLet's take a closer look at some code\
    \ from earlier as an example:\n\n```\ndef F(n):\n    curr = n\n    tmp = 1\n \
    \   while curr != 1:\n        tmp = tmp + 1\n        if curr % 2 == 1:\n```"
