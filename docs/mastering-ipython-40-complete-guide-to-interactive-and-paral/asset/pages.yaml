- pgno: 262
  md: "+   - `recurse` into directories, unless they match `norecursedirs`.\n+   -\
    \ `test_*.py` or `*_test.py` files, imported by their test package name.\n+  \
    \ - Test prefixed test classes (without an `__init__` method).\n+   - `test_`\
    \ prefixed test functions or methods are test items.\n\n# Organizing test files\n\
    \npytest allows test functions to be included in the same file as the functions\
    \ to be tested. This has some advantages in that it makes it more likely that\
    \ tests will be updated when functionality is, and makes the tests easy to find.\n\
    \nHowever, this is not a good idea for any but the smallest project, for several\
    \ reasons:\n\n+   - A good test suite can be several times the size of the code\
    \ to be tested. Putting both in the same place obscures the code.\n+   - It is\
    \ often the case that different groups develop tests and code. Using different\
    \ files makes for easier version control.\n+   - Tests should not depend on how\
    \ code is written, nor should code depend on how tests are structured. The easiest\
    \ way to ensure this is to keep them completely separate.\n\nWhen tests are no\
    \ longer in the same file as code, it is important to keep them somewhere easy\
    \ to find and associate with the code they test. A parallel directory structure\
    \ is an easy way to achieve this:\n\n```\npkg/\n    __init__.py\n    prog1.py\n\
    \    …\n\ntests/\n    test_prog1.py\n    …\n```\n\nNote the lack of an `__init__.py`\
    \ file in the tests directory. This provides an easier time for one of the test\
    \ discovery rules listed previously. There is no requirement in pytest that things\
    \ be mirrored this exactly; it is just a useful heuristic."
