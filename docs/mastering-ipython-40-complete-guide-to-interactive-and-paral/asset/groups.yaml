    \nWe can use these IPython commands to run it:\n\n```\nIn [1]: from oct2py import\
    \ octave\n\nIn [2]: octave.addpath(\"/nfs/02/wit0096/Packt/chap06/\")\n\nIn [3]:\
    \ octave.myIntegrate( )\nOut[3]: 1.3333333333333326\n```\n\nThis yields an easy\
    \ integration of a complicated function.\n\n# Hy\n\nSometimes, nothing less than\
    \ a functional programming language will do. This is especially true in machine\
    \ learning and artificial intelligence, where Lisp and Scheme have a long tradition.\
    \ Hy is a dialect of Lisp that translates expressions into Python's abstract syntax\
    \ tree format.\n\nAn abstract syntax tree is a high-level representation of a\
    \ program's structure, independent of the source code. The Python parser turns\
    \ all Python programs into abstract syntax trees, after which the interpreter\
    \ performs further operations on the tree on the path to creating executable bytecode.\
    \ Because the Hy frontend accepts Hy code as input and produces as output an abstract\
    \ syntax tree compatible with Python's interpreter, Hy code runs in the same interpreter\
    \ as your Python code.\n\nIn practical terms, Hy programs can call any Python\
    \ libraries and Python code can invoke Hy code.\n\nIt is available under the MIT\
    \ (Expat) license from its home page at `http://docs.hylang.org/en/latest/`.\n\
    \n> > \"Hy is a wonderful dialect of Lisp that's embedded in Python.\n> >\n> >\
    \ Since Hy transforms its Lisp code into the Python Abstract Syntax Tree, you\
    \ have the whole beautiful world of Python at your fingertips, in Lisp form!\""
