    \n## 打开工具包 – IPython API\n\n本章涵盖 IPython 中一些在其他地方未涉及的有用功能，以及一些值得深入介绍的功能。\n\n将涵盖以下主题：\n\
    \n- 性能分析\n- `AsyncResult` 类\n- 结果元数据\n- `Client` 类\n- `View` 类（包括 `DirectView`\
    \ 和 `LoadBalancedView`）\n\n> IPython 库在参数方面非常灵活。大多数参数都是可选的，并且有合理的默认值。本章不会试图描述每个函数的每个参数，而是会介绍这些库提供的更有趣的功能。我已将相应链接添加到官方文档中，供进一步参考。\n\
    \n### 性能分析\n\n在优化系统之前，最好确切地知道哪一部分慢。IPython 为此添加了一些专门的工具，以及 Python 提供的工具。\n\n```text\n\
    1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n\
    1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n\
    1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n\
    1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n1.71828182846\n\
    1.71828182846\n10 loops, best of 3: 344 μs per loop\n```\n\n`%%timeit`（和 `%timeit`）接受许多选项——使用\
    \ `?timeit` 查看详细信息。\n\n### 使用 %%prun\n\n`%%prun` 魔法命令使用 Python 内置的 `cProfile`\
    \ 模块。它提供了关于时间花费在何处的更多信息。特别是，它可以按函数细分执行时间。下面是一个示例：\n\n```python\nIn [58]: %%prun\n\
    \ns = 0\nfor i in range(1, 1500):\n    s = s + 1/math.factorial(i)\n```\n\n###\
    \ 作业控制\n\n每个 View 还包含用于控制其队列中作业的函数。这些函数与 `Client` 中提供的函数类似，但仅适用于 View 中的引擎：\n\n\
    | 方法 | 参数 | 作用 |\n|---|---|---|\n| abort | `jobs`（以下之一）：<br>`(list of) str`<br>`None`<br>`targets`\
    \ | `(list of) str` 是要中止的 `msg_id` 列表。如果为 None，则中止所有作业。该操作会在 `targets` 中列出的所有引擎上发生。\
    \ |\n| get_result | `indices_or_msg_ids`（以下之一）：<br>`(list of) job index`<br>`(list\
    \ of) msg_ids` | 通过 `msg_id` 或历史索引获取作业结果。结果是一个 `AsyncResult` 对象。当作业被阻塞时，这很有用，因为客户端将无法访问这些信息。\
    \ |\n| queue_status | `targets`（以下之一）：<br>`(list of) int`<br>`(list of) str` |\
    \ 返回所列引擎队列的状态。默认返回所有队列的状态。 |\n| shutdown | `targets`（以下之一）：<br>`list of ints`<br>`\"\
    all\"`<br>`hub: bool` | 终止引擎进程。如果 hub 为 True，它还会终止 Hub。 |\n\n### DirectView\n\n\
    `DirectView` 对象就像一个多路复用器——它有一组引擎（`targets`），并对所有引擎执行相同的操作。基本概念是，可以将 `DirectView`\
    \ 视为单个引擎，只不过它会在多个引擎上并行执行。\n\n这对函数执行的影响很简单：\n\n- 对于 `apply*` 函数，`f`、`*args` 和 `**kwargs`\
    \ 会被发送到目标组中的每个引擎。\n- 对于 `map*` 函数，`f`、来自 `*sequences` 的一个条目以及 `**kwargs` 会被发送到目标组中的每个引擎。每个引擎从\
    \ `*sequences` 中获得不同的条目。如果 `*sequences` 中的元素多于引擎数，某些引擎将多次执行，每次使用不同的条目。\n\n## 打开工具包\
    \ – IPython API\n\nDirectView 作为一个多路复用器工作。它有一组引擎（targets），并对所有引擎执行相同的操作。这使开发人员可以将一组引擎视为一个单一实体。DirectView\
    \ 的一个重要能力是让所有目标引擎上的事物保持“相同”。具体来说，DirectView 提供了数据移动机制（全局字典、scatter-gather 和 push-pull）以及环境管理机制（sync_imports\
    \ 上下文管理器）。\n\nLoadBalancedView 也允许将多个引擎视为单个引擎。然而，在这种情况下，概念模型是单个非阻塞引擎，而不是一组引擎。控制器可以非阻塞地向\
    \ LoadBalancedView 提交多个作业。而 LoadBalancedView 本身则依赖调度器来实际执行作业。这不会改变相对于 DirectView\
    \ 的环境管理状况，但确实需要外部数据移动工具，如 MPI 或 ZeroMQ。\n\n虽然本章简要概述了 IPython 库中一些更有用的功能，但 IPython\
    \ 本身并不能完成所有事情。在下一章中，我们将了解如何将其他语言与 Python 结合，以进一步扩展可用工具的范围。\n\n这段代码非常有趣，值得更仔细地看一看：\n\
    \n- **第 1 行：** 该魔法命令启动多行 R 解释器。与 `%R` 魔法命令不同，默认情况下它不会向 IPython 返回任何内容。变量的值可以使用本节后面会介绍的命令推送到\
    \ R 或从 R 拉取。\n- **第 2-3 行：** 这两行对 mtcars 数据集/数组进行切片。使用了下标表示法，其中下标是一个测试。通俗地说，第\
    \ 2 行的意思是“返回 mtcars 中 cyl 列值为 4 的所有行”（第 3 行和八缸的情况类似）。逗号是必需的。\n\n> 在 R 中，`=` 和\
    \ `<-` 之间存在细微差别，但在这里我们无需关心。就我们的目的而言，用箭头替换等号不会有什么区别。\n\n- **第 4 行：** 这执行了一个 t 检验，比较我们在前面几行中分离出的四缸和八缸汽车的\
    \ mpg 列。简而言之，考虑到数据集中包含的汽车，四缸汽车几乎肯定比八缸汽车更省油。\n\n### 拉取与推送\n\n鉴于前面的示例，了解一下哪些汽车有四个气缸可能会很有趣（也许它们不能代表一般的四缸汽车，那么我们的检验就不会像我们想的那样有信息量）。尽管\
    \ `%R` 魔法命令不返回值，而且魔法已经结束，但这些数据并没有消失。它存储在 fourCyl 变量中，该变量存在于共享的 R 实例中，可以使用 `%Rpull`\
    \ 魔法命令将其拉取到 IPython 中：\n\n```\nIn [40]: %Rpull fourCyl\n\nIn [41]: fourCyl\nOut[41]:\n\
    ```\n\n|   | mpg | cyl | disp | hp | drat | wt | qsec | vs | am | gear | carb\
    \ |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| Datsun 710 | 22.8 |\
    \ 4 | 108.0 | 93 | 3.85 | 2.320 | 18.61 | 1 | 1 | 4 | 1 |\n| Merc 240D | 24.4\
    \ | 4 | 146.7 | 62 | 3.69 | 3.190 | 20.00 | 1 | 0 | 4 | 2 |\n| Merc 230 | 22.8\
    \ | 4 | 140.8 | 95 | 3.92 | 3.150 | 22.90 | 1 | 0 | 4 | 2 |\n\n"
