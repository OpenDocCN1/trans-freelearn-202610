    Creating file docs/modules.rst.\n```\n\nThe files themselves are not much to look\
    \ at, but they can be fed into Sphinx or other documentation tools that are expecting\
    \ reStructuredText for further processing. This is especially handy when using\
    \ tools that cannot extract docstrings on their own.\n\n# Summary\n\nWhile inline\
    \ comments and type notations are useful for developers who will be working on\
    \ the code base, external parties need more extensive documentation, and need\
    \ it in a more attractive format than reading the source (this is especially true\
    \ when they do not have access to the source). This need for documentation must\
    \ be balanced against the understandable reluctance of developers to spend a great\
    \ deal of time and energy producing anything but code.\n\nPython's solution is\
    \ to employ a lightweight markup language, reStructuredText, and a toolchain (Docutils,\
    \ Sphinx) to transform reStructuredText into a more aesthetically attractive format\
    \ (for example, HTML or LaTeX)."
