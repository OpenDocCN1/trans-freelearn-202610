    # The cost of building (and maintaining) software


    If developers were all equal in talent, they worked for free, development time
    were no object, all code were bug-free, and all programs only needed to run once
    and were then thrown away, Fortran would be the clear winner given its efficiency
    and installed library base.


    This is not how commercial software is developed. At a first approximation, a
    software project''s cost can be broken down into the cost of several parts:


    +   - Requirements and specification gathering

    +   - Development

    +   - Execution

    +   - Testing and maintenance


    # Requirements and specification gathering


    There is no clear differentiation between IPython and Fortran in the difficulty
    of production, good requirements, and specifications. These activities are language-independent.
    While the availability of prewritten software packages may impact parts of the
    specification, both languages are equally capable of reducing requirements and
    specifications to a working system.


    # Development


    As discussed previously, Python code tends to be more concise, leading to higher
    programmer productivity. Combine this with the growing numbers of developers already
    fluent in Python and Python is the clear winner in terms of reducing development
    time.


    # Execution


    If it is costly to run on the target system (which is true for many supercomputers),
    or the program takes a long time to run (which is true for some large-scale simulations
    such as weather prediction), then the runtime efficiency of Fortran is unmatched.
    This consideration looms especially large when development on a program has largely
    concluded and the majority of the time spent on it is in waiting for it to complete
    its run.'
