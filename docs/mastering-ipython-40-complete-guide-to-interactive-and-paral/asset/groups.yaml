    # *Documentation*


    It results in the following web page:


    ![](img/8628b86fcc4f22d859c0104c2ec1d15f_314_0.png)


    # Sections


    The preceding markup should suffice for most developers, for most documentation.
    Should more in-depth documentation be required, reStructuredText provides the
    ability to break documents into sections using section headers. This is accomplished
    by creating a single line of text consisting entirely of a single repeated character
    (the underline). The previous line becomes the section header (the overline).
    The underline and the overline must be of the same length. All sections that use
    the same underline are at the same level. Any section beneath a section with a
    different underline is at a lower level than that section.


    Here is an example:


    ```

    Chapter 1 Main Title

    --------------------


    Section 1.1 An Important Subject

    ```'
