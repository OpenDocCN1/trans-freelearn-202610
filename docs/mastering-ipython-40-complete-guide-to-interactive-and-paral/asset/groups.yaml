    \ 一个 XML 文件（nose2-junit.xml），创建于测试运行所在目录\n\n### 小结\n\n一个运行中的程序最重要的属性就是正确性。很多时候，测试被留到开发结束时才进行，而到了那时，由于项目已经延期，测试要么被完全跳过，要么草草了事。对于科学和工程代码来说尤其如此，因为可能危及生命。即使是探索性代码也需要经过测试，以便基于它做出合理的决策。没有相关单元测试的代码不应被接受到项目仓库中。因此，应尽可能让开发者轻松地进行测试。\n\
    \n虽然 IPython 支持许多出色的可视化工具，可以为结果提供视觉反馈，但没有任何东西可以替代彻底的单元测试。本章概述了单元测试的基础知识——setup、test\
    \ 和 teardown——并展示了三个不同框架如何实现这些概念。使用哪种框架的决定权在项目团队手中。\n\n在下一章中，我们将探讨对专业级软件中另一个常被忽视的组件的支持：文档。我们将讨论文档面向的不同受众、每个受众所关注的信息类型、格式选项，以及可用于让文档编写相对轻松的工具。\n\
    \n## 文档\n\n本章将涵盖以下主题：\n\n- 内联注释\n- 文档字符串\n- reStructuredText\n- Docutils\n- Sphinx\n\
    \n### 内联注释\n\n我们将使用“内联注释”一词来指代所有面向维护编码人员、且除阅读源代码的人之外任何人都看不到的注释。\n\n内联注释以 `#` 符号开头，一直延续到行尾。它们不能出现在字符串字面量中。内联注释中的任何字符都不会被解释。\n\
    \nPython 不支持块注释。关于三重双引号（`\"\"\"`）可用于注释掉多行的说法并不可信。虽然这通常也能奏效，但实际发生的是 Python 将所包含的行视为一个多行字符串。作为一个字符串，其中的行不会被解释，而是创建了一个字符串字面量。由于这个新字面量未赋值给任何变量，它会被立即回收。\n\
    \n除了这种奇怪的行为之外，三重双引号还用于文档字符串。将两者混用可能会造成混淆，而这正是我们首先要避免的。\n\n#### 使用内联注释\n\nPython\
    \ 风格的“官方”指南是 PEP 0008（见 `https://www.python.org/dev/peps/pep-0008/`）。在一定程度上，代码可以说成是自文档化的，本指南提供了一组关于风格一致性的标准建议，有助于推进这一目标。其中关于注释的部分尤其包含一些有用的建议：\n\
    \n- 注释应与代码保持一致。如果代码发生变化，请确保注释能够反映这些变化。\n- 使用完整的句子进行注释。\n"
