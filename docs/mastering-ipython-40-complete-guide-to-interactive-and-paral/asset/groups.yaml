    ![](img/8628b86fcc4f22d859c0104c2ec1d15f_366_0.png)


    Source image: https://commons.wikimedia.org/wiki/File:Notre_Dame_dalla_Senna.jpg


    Notre Dame was built over the course of ~182 years (1163 AD - ~1345 AD) under
    at least four different architects. It was in continuous use from its earliest
    days, despite ongoing construction. Although there was a plan at the outset, important
    features (including some of the famous flying buttresses) were added over time
    as construction difficulties uncovered a need for them. It is a remarkable feat
    of engineering.'
  - "[PAGE 367]\n\nWhat makes it even more remarkable is that, in a very real sense,\
    \ nobody involved really understood what they were doing. The underlying physical\
    \ laws that justified the architectural decisions were not understood until Newton,\
    \ almost 350 years later. Until Newton, all architectural knowledge was a result\
    \ of trial and error – decisions about wall thickness, height, the ability to\
    \ bear loads, arch height/width, and all other structural parameters were made\
    \ based on the accumulated results of past experiment and the architect's own\
    \ judgement.\n\nThis does not make their decisions wrong – obviously, they could\
    \ build quite large, stable, and aesthetically pleasing buildings. What it does\
    \ mean is that they had strict limits to what they could accomplish. As buildings\
    \ got larger, there were fewer previous examples to rely on, and the costs of\
    \ failure grew.\n\nSoftware development for massively parallel machines shares\
    \ this problem. We have a lot of experience building smaller parallel systems,\
    \ and some for larger degrees of parallelism, but the problems (and the costs\
    \ of failure) are growing. What the field needs is something similar to the Principia\
    \ – a unified theory of parallel programming. We need the Next Big Idea.\n\nUntil\
    \ the Next Big Idea comes along, the scientific software development community\
    \ can advance by adopting some practices from the field of software engineering.\n\
    \n# Growing professionalism\n\n> \"A scientist builds in order to learn; an engineer\
    \ learns in order to build.\"\n> \n> – Fred Brooks\n\nWhat scientists do and what\
    \ engineers do is different. Scientists are concerned with extending knowledge,\
    \ engineers with applying it. When a scientist builds something, its purpose is\
    \ fulfilled when the desired knowledge is gained – at that point, the useful life\
    \ of the object is over. When an engineer builds something, a long useful lifetime\
    \ is the purpose of applying the knowledge.\n\nMuch scientific software is written\
    \ by scientists for scientific purposes. It is no surprise that it is often considered\
    \ expendable once the knowledge it was written to produce has been extracted.\
    \ While this approach produces immediate results, other researchers in the field\
    \ who would also wish to use the software often find it difficult to use, maintain,\
    \ and extend."
