  mdcn: "\n## reStructuredText\n\n关于前面的示例，可以说很多（尤其是注释行比代码还多），但很难说最终效果在美学上是令人愉悦的。特别是与使用\
    \ Javadoc 的程序输出相比，这份文档看起来相当朴素。为了弥补这一缺陷，人们决定需要一种更精细的规范和生成文档的方式。\n\n### 历史与目标\n\n\
    Zope 的 Jim Fulton 发明了 StructuredText 作为一种简单的标记语言。它与 WikiWikiWebMarkup 类似，但更简单。规范和实现方面的问题促使\
    \ David Goodger 创建了一个修订版本，称为 reStructuredText。他为该语言设定的目标如下：\n\n- 可读\n- 不突兀\n-\
    \ 无歧义\n- 不令人意外\n- 直观\n- 简单\n- 可伸缩\n- 强大\n- 语言中立\n- 可扩展\n- 输出格式中立\n\n这导致了 PEP 0287（https://www.python.org/dev/peps/pep-0287/）的发布。\n\
    \n### 用户\n\n任何文档系统都有三类用户：开发人员、自动化文档生成软件和读者。它们各自有不同的需求和限制。\n\n开发人员必须编写文档。作为一个群体，开发人员讨厌打字，更讨厌输入任何不是代码的内容。任何强迫他们编写大段注释的尝试都会导致标准失败。因此，如果文档可以从代码生成，就应该如此。任何额外的注释都应该易于使用标准键盘和最少量的额外标记来创建。\n\
    \n文档生成软件将开发人员编写的文本转换成供外部读者阅读的文档。这通常包括将开发人员使用的标记语言转换为更易读的格式。例如，开发人员编写的 Javadoc\
    \ 可以自动转换为读者可以在浏览器中查看的 HTML。这种转换可以同时添加美观属性（例如颜色和格式）和功能属性（例如超链接）。重要的是，对于文档生成软件而言，开发人员使用的标记必须足够强大且结构化，以支持这种转换。\n\
    \n读者阅读这种转换的最终结果。读者可能是开发人员，也可能不是，但他们期望文档在结构上组织良好。文档应该易于阅读，并且应该易于找到所需内容。请注意，读者通常无法访问原始源，即使原始标记可用，他们也可能无法阅读。\n\
    \n开发人员和读者之间的这种划分存在一种重要的紧张关系。简而言之，读者希望获得尽可能多的文档，并且以结构化的形式呈现。开发人员则会尽可能少地编写文档，并尽可能少地使用结构。\n\
    \n### 解决方案\n\nreStructuredText 采用的解决方案是使用一个两步过程：一种简单的标记语言，再加上强大的文档生成软件。标记语言是 reStructuredText，软件是\
    \ Docutils。基本过程很简单：\n\n1. 开发人员使用 reStructuredText 约定以纯文本形式编写文档字符串。\n2. 对生成的代码+注释文档应用\
    \ Docutils，以外部格式（例如 HTML 或 LaTeX）生成文档。\n3. 读者在适当的查看器中阅读生成的文档。\n\n稍后我们将介绍 Sphinx，这是一个建立在\
    \ reStructuredText 和 Docutils 之上并对其进行扩展的文档生成程序。\n\n### 概述\n\nreStructuredText\
    \ 的基本语法是常规文本，并针对某些用法附带了特殊约定。这与 HTML 等语言形成对比，在 HTML 中，元数据通过尖括号与文本关联。例如，在 HTML 中，项目符号列表可能如下所示：\n\
    \n```html\n<ul>\n  <li>Python</li>\n  <li>Java</li>\n  <li>Ruby</li>\n</ul>\n\
    ```\n\n而在 reStructuredText 中，它看起来如下：\n\n- Python\n- Java\n- Ruby\n\n一个重要的区别是，虽然\
    \ HTML（及其近亲，如 XML）允许嵌套标签，但 reStructuredText 不允许嵌套标记。虽然这通常不是问题，但偶尔也会遇到。\n\n下面列出了一些更重要的用法。\n\
    \n#### 段落\n\n段落是由一个或多个空行分隔的文本块。段落的左边缘应对齐。如果某个段落相对于其他段落缩进，则它被视为引用。\n\nreStructuredText\
    \ 如下所示：\n\n> 事实证明，亚伯拉罕·林肯从未说过\n>\n> 永远不要相信你在互联网上读到的任何东西。\n>\n> 那是本杰明·富兰克林说的\n\n\
    这产生的 HTML 输出显示如下：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_310_0.png)\n\n####\
    \ 文本样式\n\n斜体文本应使用星号（*）括起来：\n\n```\nUse italics for *emphasis*.\n```\n\n粗体文本使用两个星号（**）：\n\
    \n```\nUsing a **goto** statement is a bold move in structured programming.\n\
    ```\n\n遗憾的是，没有简单的方法使文本同时变成斜体和粗体。\n\n在大多数情况下，reStructuredText 很聪明，知道什么时候是标记，什么时候应该原样保留。例如，考虑这些字符串：\n\
    \n```\nx = 5*6\nx = 5*6*7\n```\n\n星号不会被解释为将 6 变为斜体。\n\n用双反引号（``）包围文本会强制其成为等宽字面量——引号之间的所有特殊字符都保持原样，不被解释。否则会被解释为标记的单个字符可以使用反斜杠（\\\
    ）进行转义。\n\n#### 字面量块\n\n如果需要将整个段落作为字面量块（即完全按原样，不解释段落中的标记字符或缩进），那么一个只包含两个冒号的段落表示后面的缩进或引用文本应按字面量处理。这在引用代码或解释标记约定时非常有用。\n\
    \n它产生的网页如下：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_312_0.png)\n\n#### 项目符号列表\n\
    \n项目符号列表的工作方式与枚举列表类似，除了：\n\n- 唯一允许的项目符号是 -、+ 和 *\n- 没有分隔符\n\n项目符号列表支持常见的缩进规则。\n\
    \n#### 定义列表\n\n定义列表只是一系列术语-定义对。术语在第一行，定义在随后的缩进段落中。下面是一个示例：\n\n```\ndo\n    a deer,\
    \ a female deer\nre\n    a drop of golden sun\nmi\n    a name i call myself\n\
    fa\n```\n\n它产生的网页如下：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_314_0.png)\n\n\
    #### 章节\n\n上述标记对于大多数开发人员、大多数文档来说应该足够了。如果需要更深入的文档，reStructuredText 提供了使用章节标题将文档划分为章节的能力。这是通过创建一行完全由单个重复字符（下划线）组成的文本实现的。前一行成为章节标题（上划线）。下划线和上划线必须长度相同。所有使用相同下划线的章节处于同一级别。位于使用不同下划线的章节下方的任何章节都比该章节低一级。\n\
    \n下面是一个示例：\n\n```\nChapter 1 Main Title\n--------------------\n\nSection 1.1 An\
    \ Important Subject\n```\n\n## Docutils\n\nDocutils 是一套工具，用于将包含 reStructuredText\
    \ 的文本文件转换为其他格式，包括 HTML、XML 和 LaTeX。它旨在弥合用户想要阅读的内容（美观的格式）与程序员容易输入的内容（纯文本）之间的差距。Docutils\
    \ 分为两大类：库（用于后台解析和操作）和前端工具（使用库生成特定输出格式）。\n\n### 安装\n\n可以使用 pip 安装 Docutils：\n\n\
    ```\npip install docutils\n```\n\n这将安装许多脚本，包括重要的转换脚本。作者的安装中包括以下脚本：\n\n- `rst2html.py`\n\
    - `rst2latex.py`\n- `rst2man.py`\n- `rst2odt_prepstyles.py`\n- `rst2odt.py`\n\
    - `rst2pseudoxml.py`\n- `rst2s5.py`\n- `rst2xetex.py`\n- `rst2xml.py`\n- `rstpep2html.py`\n\
    \n### 用法\n\n这些脚本可以在命令行中使用。它们从 `stdin` 读取输入，并将输出写到 `stdout`：\n\n```\n./rst2html.py\
    \ <infile> > <outfile>\n```\n\n"
