  - '[PAGE 300]


    As with any standard that allows variations, there are several groups that promote
    different versions:


    +   - Google weighs in its Python Style Guide at https://google.github.io/styleguide/pyguide.html#Comments

    +   - numpy has its own recommendations at https://github.com/numpy/numpy/blob/master/doc/HOWTO_DOCUMENT.rst.txt#docstring-standard

    +   - Epydoc prefers docstrings at http://epydoc.sourceforge.net/manual-docstring.html


    Finally, your team should pick a multiline docstring syntax that works for it
    and the tool (or tools) it uses to generate documentation.


    # Semantics


    A multiline docstring should provide enough information for an interested party
    to use the thing it is documenting. It is not enough to just describe its name
    and purpose. The potential user should, by reading the docstring, understand the
    following:


    +   - The API

    +   - The inputs

    +   - Functionality

    +   - The output (or outputs)

    +   - The error conditions

    +   - The relationship with other parts of the system

    +   - Example uses


    # The API


    This is important for classes and modules. This docstring for a module should
    describe all classes, exceptions, and functions that are exported by that module.
    The docstring for a class should describe its public interface and instance variables.
    The descriptions should be brief (a single line is good enough) — more details
    will be provided by the docstrings for the individual parts.


    # Inputs


    These are especially important for scripts (command-line arguments and options)
    and functions (parameters). Users should be able to specify complete, valid inputs,
    which means describing:


    +   - The names of the inputs

    +   - Their types'
  - '[PAGE 301]


    +   - Their ranges

    +   - Optional versus required


    # Functionality


    These are important for scripts and functions. Users should understand what relationship
    the inputs have with the outputs without being told (more than necessary) about
    the mechanism used to achieve the results. This means using plain English to describe
    what the function does. If there is a simple mathematical expression that the
    function implements, this is a good place to include it. This is probably the
    hardest part of the comment to write.


    # Outputs


    These are important for scripts and functions. The number and types of outputs
    should be listed. Any side effects should also be described.


    # Error conditions


    Possible conditions that could result in an error should be listed. Errors fall
    under two categories: silent errors and noisy errors.


    Noisy errors are those that result in thrown exceptions or error codes being set.
    All thrown exceptions should be documented. Any variables or data structures used
    to signal errors (for example, `errno`) should also be documented.


    Silent errors are those in which the code appears to function normally, but in
    fact is producing invalid results. For example, many numeric algorithms produce
    meaningful results over only a subset of otherwise legal inputs.


    In either case, users should be presented with enough information to:


    +   - Avoid error conditions (when possible)

    +   - Detect error conditions (whether by catching an exception or by checking
    for an error code)

