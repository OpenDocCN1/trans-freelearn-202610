    \n### 推荐元素\n\nPEP 0257 记录了与文档字符串相关的约定。从标准（https://www.python.org/dev/peps/pep-0257/）中：\n\
    \n> \"本 PEP 的目标是标准化文档字符串的高级结构：它们应包含什么内容，以及如何表述（而不涉及文档字符串内的任何标记语法）。PEP 包含约定，而非法律或语法。\"\
