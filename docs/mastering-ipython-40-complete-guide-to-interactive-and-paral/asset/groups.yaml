  - '[PAGE 352]


    IPython is not such a system. In 2001, Fernando Perez was a graduate student at
    the University of Colorado in Boulder. He was not a computer science major, he
    was a physics graduate student who needed to program and wanted a better tool.
    As a physicist, his idea of "better" was different from what a computer scientist
    might have envisioned. In particular, the formative influences on the young IPython
    was tools designed primarily for data analysis and presentation: Mathematica (http://www.wolfram.com/mathematica/)
    and Sage (http://www.sagemath.org/).


    Perez has stated that IPython is "meant to be a highly configurable tool for building
    problem-specific interactive environments," which provides a key to its history
    and future directions.


    Initial efforts came at the problem from two directions. On one hand, there were
    a couple of Python extensions that already existed – IPP (by Janko Hauser) and
    LazyPython (by Nathan Gray). On the other hand, Perez had his own ideas about
    what should be implemented. In the end, IPython was born through a merger of code
    from IPP, LazyPython, and Perez''s own efforts.


    At this point development slowed down. A few stabs at making a notebook were made.
    Some consideration was given to merging with Sage, but in the end the projects
    went their own ways. In 2009, the first full-time developer was funded. His first
    task was a refactoring of the entire codebase, which was at that point still a
    mash of IPP, LazyPython, and Perez''s original code. No new functionality was
    added, but development could move forward more easily on the newly clean code.


    2010 was an important year. The first big development was the move to an architecture
    based on ZeroMQ. The adoption of ZeroMQ allowed for two important architectural
    advances: separation between the frontend and the interpreter, and support for
    parallelism.


    Separating the frontend and backend was huge on several fronts. Perhaps most importantly,
    it meant that implementing a notebook was simple(r): the Notebook became just
    another interface to the Python kernel on the back end. On the flip side, the
    command-line interface was free to connect to a kernel that supported any language,
    not just Python. IPython was moving from "a better Python shell" to "a multi-interface,
    multi-language platform." Work proceeded quickly at this point: the remainder
    of 2010 saw the development of a command-line interface, a Qt console, integration
    into Python Tools for Visual Studio, and a prototype web notebook. 2011 saw the
    prototype turned into a fully-working version, and IPython 0.12 was released.'
