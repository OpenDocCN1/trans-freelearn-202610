    \ 收到消息并完成（一些最少限度的）处理后，可以将响应发送回发起连接的进程。在底层，ZeroMQ 发送的是字节，而不是 Python 字符。如果客户端和服务器都是\
    \ Python（且可能是同一版本），以这种方式发送字符串应该没有问题。\n\n跨语言和跨平台应用程序可能希望使用以下方式：\n\n```\nsocket.send(b\"\
    World\")\n```\n\n而不是使用下面这行代码：\n\n```\nsocket.send(\"World\")\n```\n\n# 发布者\n\n\
    这是一个发布者。它使用 PUB 套接字将时间和天气发送给任意数量的订阅者：\n\n```\n```python\nimport zmq\nimport random\n\
    \ncontext = zmq.Context()\nsocket = context.socket(zmq.PUB)\nsocket.bind(\"tcp://*:5678\"\
    )\n\nwhile True:\n    topic = \"load\"\n    socket.send(topic + \" \" + str(random.random()))\n\
    \n    topic = \"weather\"\n    messagedata = \"dark and stormy night\"\n    socket.send(topic\
    \ + \" \" + messagedata)\n\n    time.sleep(1)\n```\n```\n\n# 订阅者\n\n该订阅者使用 SUB\
    \ 套接字来监听上述发布者。但它只对天气感兴趣：\n\n```\n```python\nimport zmq\n\ncontext = zmq.Context()\n\
    socket = context.socket(zmq.SUB)\nsocket.connect(\"tcp://localhost:5678\")\nsocket.setsockopt_string(zmq.SUBSCRIBE,\
    \ \"weather\")\n\nwhile True:\n    wtr = socket.recv_string()\n    print(\"the\
    \ weather is: \" + wtr)\n```\n```\n\n# 广播\n\n使用 MPI 时，广播似乎并不适用：毕竟，每个进程都运行相同的代码，那么一个进程怎么能知道另一个进程不知道的信息呢？一个不对称的例子来自\
    \ I/O 的使用。考虑一个程序，它接收用户输入，然后在每个进程中根据该输入执行操作。如果每个进程都独立地向用户请求输入，那将是疯狂的。0 号进程（rank\
    \ 0）应该收集输入，然后将其发送给所有其他进程，例如：\n\n```\n```python\nfrom mpi4py import MPI\n\ncomm\
    \ = MPI.COMM_WORLD\nrank = comm.Get_rank()\n\nif rank == 0:\n    data = input(\"\
    Please enter random number seed\")\nelse:\n    data = None\n\n# mpi4py wants to\
    \ send an object, so we will leave the\n# input in that format\ndata = comm.bcast(data,\
    \ root=0)\n```\n```\n\n# 归约\n\n当所有进程执行各自独立的操作时，将它们的计算结果合并起来可能很有用。例如，在计算函数的黎曼积分时，将工作分配到多个进程上可能会高效得多。然后所得结果就是每个进程中计算出的值之和，例如：\n\
    \n```\n```python\nimport numpy\n\nimport sys\nfrom mpi4py import MPI\n\ncomm =\
    \ MPI.COMM_WORLD\nrank = comm.Get_rank()\n\n# integrate from in [0, 4] using 8\
    \ rectangles\na = 0\nb = 4\n```\n```\n\n## ZeroMQ 与 IPython\n\nZeroMQ 不仅仅是一个用于并行环境的消息库：IPython\
    \ 已经转向使用 ZeroMQ 作为其内部消息传递基础设施。在本节中，我们将从 ZeroMQ 底层机制的角度，提供有关 IPython 运行的更多细节。\n\
    \n为此，我们将介绍一些额外的套接字类型，描述它们如何交互以支持 IPython 的某些并行组件，最后介绍一些使用这些组件的用例。虽然本节无法涵盖 IPython\
    \ 并行架构的所有细节，但希望这些示例能让用户对底层机制有一个基本的了解。\n\n### ZeroMQ 套接字类型\n\nZeroMQ 支持大量不同类型的套接字，截至目前（版本\
    \ 4.2.0）共有 14 种。上一节概述了一些重要的类型，但要讨论 IPython 架构，至少需要对一些高级套接字类型有初步了解：\n\n- **DEALER：**\
    \ 这类似于 REQ 套接字，但它是异步的。每条发送的消息都会以轮询（round-robin）方式在所有已连接对等节点间发送，每条接收的消息都会从所有已连接对等节点公平排队。它与\
    \ ROUTER、REP 和 DEALER 套接字兼容。\n- **ROUTER：** 这类似于 REP 套接字，但它是异步的。它会跟踪所有已连接的对等节点。路由器发送的每条消息都包含消息来源的身份标识。这使得套接字能够根据消息来源进行路由。当\
    \ ROUTER 连接了多个 REQ 和 REP 套接字时，需要将消息发送到正确的端点。\n\n### IPython 组件\n\n*第 3 章“迈向 IPython\
    \ 并行计算”* 概述了 IPython 的主要架构组件。在本节中，我们将提供更多细节，重点介绍每个组件如何使用消息传递来执行其任务。\n\nZeroMQ\
    \ 追求最小化配置：客户端和引擎只需知道 Hub 的 ROUTER 套接字的 IP 地址和端口即可连接。一旦建立了这个初始连接，建立进一步连接所需的任何信息都会发送过去。此外，客户端还可以利用此连接向\
    \ Hub 查询关于引擎的状态信息。这样就形成了一个简单的连接架构：客户端和引擎都使用 DEAL 套接字，而 Hub 使用 ROUT 套接字：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_140_0.png)\n\
    \n# 心跳\n\nHub 还负责检查哪些引擎仍在响应。为此，它会定期向每个引擎发送一条消息。然后引擎会以相同的消息进行响应，并带有前缀表示哪个引擎作出了响应。如果某个引擎没有响应，Hub\
    \ 将尝试终止它。\n\n"
