    ZeroMQ goes for minimum configuration: clients and engines only need to know the
    IP address and port of the Hub''s ROUTER socket in order to connect. Once this
    initial connection is established, any information needed to establish further
    connections is sent over. In addition, clients can use this connection to query
    the Hub for state information concerning the engines. This results in a simple
    connection architecture where the client and engine both use DEAL sockets and
    the hub uses a ROUT:


    ![](img/8628b86fcc4f22d859c0104c2ec1d15f_140_0.png)


    # Heartbeat


    The Hub is also responsible for checking which engines are still responding. It
    does this by periodically sending a message to each engine. The engine then responds
    with the same message, with a prefix denoting which engine responded. If an engine
    does not respond, the Hub will attempt to terminate it.'
