  - '[PAGE 170]


    # Opening the Toolkit – The IPython API


    DirectView works as a multiplexer. It has a set of engines (targets) and it does
    the same thing to all of its engines. This allows the developer to treat a set
    of engines as if they were a single entity. An important capability of a DirectView
    is its ability to make things "the same" on all of its target engines. In particular,
    DirectView provides mechanisms for data movement (a global dictionary, scatter-gather,
    and push-pull) and for managing the environment (the sync_imports context manager).


    A LoadBalancedView also allows multiple engines to be treated as a single engine.
    In this case, however, the conceptual model is that of a single, nonblocking engine
    rather than a set of engines. The controller can feed multiple jobs to the LoadBalancedView
    without blocking. For its part, the LoadBalancedView depends on a scheduler to
    actually execute the jobs. This does not change the environmental management situation
    with respect to a DirectView, but it does necessitate an external data movement
    tool, such as MPI or ZeroMQ.


    While this chapter briefly outlined some of the more useful features of IPython''s
    libraries, IPython cannot do everything itself. In the next chapter, we will take
    a look at how additional languages can be combined with Python to further expand
    the range of available tools.'
