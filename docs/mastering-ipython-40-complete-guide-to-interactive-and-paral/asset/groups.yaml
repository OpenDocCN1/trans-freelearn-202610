  - "[PAGE 272]\n\nThe solution is to monkeypatch `os.getcwd`. A monkeypatch can set\
    \ or delete the following:\n\n+   - An attribute\n+   - A dictionary item\n+ \
    \  - An environment variable\n+   - Items in `sys.path`\n\nThe monkeypatch is\
    \ used in a manner similar to a decorator object, except that the monkeypatch\
    \ object is not explicitly declared; only its functions are called. Once a function\
    \ that uses monkeypatch has ended, the settings obtained before it are invoked.\
    \ Consider the following test (pseudo)code:\n\n```\ndef test_func1():\n    logdir\
    \ = os.getcwd() + \"/func1/loadtests\"\n    logfile = open(logdir + \"/results1.log\"\
    , \"w\")\n    <do test things>\n    logfile.close()\n```\n\nThis can be monkeypatched\
    \ as follows:\n\n```\n@pytest.fixture(scope=\"function\")\ndef change_cwd(monkeypatch):\n\
    \    monkeypatch.setattr(\"os.getcwd\", lambda: \"/\")\n\ndef test_func1(change_cwd):\n\
    \    logdir = os.getcwd() + \"/func1/loadtests\"\n    logfile = open(logdir +\
    \ \"/results1.log\", \"w\")\n    <do test things>\n    logfile.close()\n```\n\n\
    The `change_cwd` function will tell monkeypatch to change the `os.getcwd` function\
    \ into the lambda expression that is monkeypatch's second argument. Feeding `change_cwd`\
    \ into `test_func1` ensures that the monkeypatch call is executed. Other test\
    \ functions that do not require this modification to `os.getcwd` will simply not\
    \ use `change_cwd` and will see normal functionality."
