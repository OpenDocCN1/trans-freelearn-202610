  md: "\n- Block comments should be at the same indentation level as the code they\
    \ apply to. Each line should start with a # sign and a single space.\n- Comments\
    \ should rarely be used on the same line as code.\n\n## Function annotations\n\
    \nFunction annotations and type hints can be considered a type of inline comment.\
    \ Function annotations originated in PEP 3107, which provided a syntax for adding\
    \ arbitrary metadata annotations to Python functions. From the definition (https://www.python.org/dev/peps/pep-3107/):\n\
    \n> \"Because Python's 2.x series lacks a standard way of annotating a function's\
    \ parameters and return values, a variety of tools and libraries have appeared\
    \ to fill this gap. (...) This PEP aims to provide a single, standard way of specifying\
    \ this information, reducing the confusion caused by the wide variation in mechanism\
    \ and syntax that has existed until this point.\"\n\n### Syntax\n\nFunction annotations\
    \ apply to two sorts of things: parameters and return values.\n\n### Parameters\n\
    \nFor parameters, an annotation is indicated by a colon, in a manner similar to\
    \ that of marking a default value by an equal to sign, like this for example:\n\
    \n```python\ndef foo(x: \"int >= 0\"):\n```\n\nBoth an annotation and a default\
    \ value can be indicated by placing them sequentially, as follows:\n\n```python\n\
    def foo(x: \"int >= 0\" = 0):\n```\n\nInformally, parameters can be described\
    \ like this:\n\n```text\nidentifier [: expression] [= expression]\n```\n\nHere,\
    \ both the annotation and the default value are optional.\n\n### Return values\n\
    \nThe return value of the function can be annotated by following the parameter\
    \ list with -> and an expression. Here is an example:\n\n```python\ndef foo(x:\
    \ \"int >= 0\" = 0) -> \"seemingly random integer\":\n    return 42\n```\n\n###\
    \ Syntax\n\nType hints use the same syntax and apply to the same things as function\
    \ annotations. The major extension is that they allow the annotation to be a class.\
    \ The full rule set is complicated, but the following hints should cover the most\
    \ common cases:\n\n- Built-in classes\n- User-defined classes\n- Types in the\
    \ `types` module\n- Abstract base classes\n- Special constructs, including `None`,\
    \ `Any`, `Union`, `Tuple`, and `Callable`\n\nA great deal of the PEP is devoted\
    \ to special cases and complex types, including generics, covariance and contravariance,\
    \ forward references, and stub files.\n\n### Semantics\n\nLike PEP 3107, there\
    \ is no standard semantics associated with type hints. The goal instead was to\
    \ provide a standard that third-party tools could work with. To the extent that\
    \ type hints have a semantics, it is the one provided by the tool they are used\
    \ with, not by the Python language itself. From the definition:\n\n> \"This PEP\
    \ aims to provide a standard syntax for type annotations, opening up Python code\
    \ to easier static analysis and refactoring, potential runtime type checking,\
    \ and (perhaps, in some contexts) code generation utilizing type information.\"\
    \n\nAn influential tool in the formation of the standard was mypy (http://mypy-lang.org/).\
    \ The purpose of mypy is to provide a static type checker for Python. While the\
    \ merits of static type checking in documentation and debugging can be debated,\
    \ it is nice to have the option.\n\n## Docstrings\n\nA Python docstring is a string\
    \ literal. It can occur as the first statement in a module or as the first statement\
    \ following the definition of a function, method, or class. The docstring becomes\
    \ the __doc__ special attribute of that thing. Its purpose is to provide a more\
    \ free-form way to document part of a program.\n\n### Example\n\nThe following\
    \ code provides docstrings for an abbreviated version of an earlier test suite:\n\
    \n```python\n\"\"\"\nThis is an abbreviated version of my random number generator\
    \ test\nsuite.\n\nIt uses the pytest framework.  It does not do much in this form.\n\
    \"\"\"\n\nimport numpy as np\nimport scipy.stats\nimport random\n\nclass TestRandoms(\
    \ ):\n    \"\"\"\n    This is the main class.\n\n    Normally it would hold all\
    \ the tests, plus and setup and\n    tearDown fixtures.\n    \"\"\"\n    def test_builtin(self):\n\
    \        \"\"\"\n        Test the built-in random number generator on 10000\n\
    \        numbers.\n        \"\"\"\n        num_tests = 10000\n        vals = [0\
    \ for i in range(10)]\n        for i in range(num_tests):\n            tmp = random.randint(0,\
    \ 9)\n            vals[tmp] = vals[tmp] + 1\n\n        chi2, p = scipy.stats.chisquare(self.vals)\n\
    \        assert p > 0.05\n\ndef foo( ):\n    \"\"\" I just needed a function outside\
    \ of a class as an\nexample\"\"\"\n    pass\n```\n\ncode1.py\n\n### Documentation\n\
    \nThe docstring can be accessed by using Python's built-in help function. The\
    \ results are displayed in the standard help fashion (that is, as if viewing a\
    \ text file with less) and are as follows:\n\n```text\nIn [4]: import code1\n\n\
    In [5]: help(code1)\nHelp on module code1:\n\nNAME\n    code1 - This is an abbreviated\
    \ version of my random number generator test suite.\n\nDESCRIPTION\n    It uses\
    \ the pytest framework.  It does not do much in this form.\n\nCLASSES\n    builtins.object\n\
    \        TestRandoms\n\n    class TestRandoms(builtins.object)\n    |   This is\
    \ the main class.\n    |\n    |   Normally it would hold all the tests, plus and\
    \ setup and teardown fixtures.\n    |\n    |   Methods defined here:\n    |\n\
    \    |   test_builtin(self)\n    |       Test the built-in random number generator\
    \ on 10000 numbers.\n    |\n    |   --------------------------------------------------------------------------\n\
    \    |\n    |   Data descriptors defined here:\n    |\n    |   __dict__\n    |\
    \       dictionary for instance variables (if defined)\n    |\n    |   __weakref__\n\
    \    |       list of weak references to the object (if defined)\n\nFUNCTIONS\n\
    \    foo()\n        I just needed a function outside of a class as an example\n\
    \nFILE\n    /nfs/02/wit0096/Packt/chap09/code1.py\n```\n\nDocstrings for individual\
    \ parts can be accessed by naming them.\n\nHere, we access `help` for the class:\n\
    \n```text\nIn [6]: help(code1.TestRandoms)\nHelp on class TestRandoms in module\
    \ code1:\n\nclass TestRandoms(builtins.object)\n |  This is the main class.\n\
    \ |\n |  Normally it would hold all the tests, plus and setup and teardown\n \
    \   fixtures.\n |\n |  Methods defined here:\n |\n |  test_builtin(self)\n | \
    \     Test the built-in random number generator on 10000 numbers.\n |\n |  ----------------------------------------------------------------------\n\
    \ |  Data descriptors defined here:\n |\n |  __dict__\n |      dictionary for\
    \ instance variables (if defined)\n |\n |  __weakref__\n |      list of weak references\
    \ to the object (if defined)\n```\n\n```python\nself.assertEqual(f(i), ans[i])\n\
    ```\n\n```python\ndef foo():\n    \"\"\"\n    An independent function.\n\n   \
    \ I needed another function to illustrate the docstring for a\n    function that\
    \ was not a member of a class.\n    \"\"\"\n    pass\n```\n\ncode2.py\n\nIt produces\
    \ the following (abbreviated) output:\n\n```text\nIn [10]: import code2\n\nIn\
    \ [11]: help(code2)\n\nHelp on module code2:\n\nNAME\n    code2 - This is my hailstone\
    \ unit test suite.\n\nDESCRIPTION\n    It uses the unittest framework.  Admittedly,\
    \ it does not do much.\n\nCLASSES\n    unittest.case.TestCase(builtins.object)\n\
    \        TestHailStones\n\n        class TestHailStones(unittest.case.TestCase)\n\
    \        |   The main class for testing the hailstone sequence generator.\n  \
    \      |\n        |   Method resolution order:\n        |       TestHailStones\n\
    \        |       unittest.case.TestCase\n        |       builtins.object\n\naddTypeEqualityFunc(self,\
    \ typeobj, function)\n\nAdd a type specific assertEqual style function to compare\
    \ a type.\n\nThis method is for use by TestCase subclasses that need to register\n\
    their own type equality functions to provide nicer error messages.\n\nArgs:\n\
    \    typeobj: The data type to call this function on when both values\n      \
    \  are of the same type in assertEqual().\n    function: The callable taking two\
    \ arguments and an optional\n        msg= argument that raises self.failureException\
    \ with a\n        useful error message when the two arguments are not equal.\n\
    \nassertAlmostEqual(self, first, second, places=None, msg=None, delta=None)\n\
    ```\n\nNote how the documentation for the `unittest.TestCase` class is included\
    \ without additional effort.\n\n### Recommended elements\n\nPEP 0257 documents\
    \ the conventions associated with docstrings. From the standard (https://www.python.org/dev/peps/pep-0257/):\n\
    \n> \"The aim of this PEP is to standardize the high-level structure of docstrings:\
    \ what they should contain, and how to say it (without touching on any markup\
    \ syntax within docstrings). The PEP contains conventions, not laws or syntax.\"\
    \n\nWhile there is no requirement that developers should follow these guidelines,\
    \ third-party tools (such as Docutils and Sphinx) may rely upon them to extract\
    \ features from docstrings.\n"
  mdcn: "\n\n- 块注释应与它们所适用的代码保持相同的缩进级别。每一行应以 # 符号和一个空格开头。\n- 注释很少应与代码写在同一行。\n\n## 函数注解\n\
    \n函数注解和类型提示可以被视为一种内联注释的类型。函数注解起源于 PEP 3107，该 PEP 提供了为 Python 函数添加任意元数据注解的语法。从定义（https://www.python.org/dev/peps/pep-3107/）中：\n\
    \n> \"由于 Python 的 2.x 系列缺乏标注函数参数和返回值标准方式的手段，出现了各种工具和库来填补这一空白。(...) 本 PEP 旨在提供一种单一、标准的方式来指定此信息，减少到目前为止因机制和语法差异过大而造成的混乱。\"\
    \n\n### 语法\n\n函数注解适用于两类事物：参数和返回值。\n\n### 参数\n\n对于参数，注解由冒号表示，其方式类似于用等号标记默认值，如此示例所示：\n\
    \n```python\ndef foo(x: \"int >= 0\"):\n```\n\n注解和默认值都可以按顺序放置来同时指示，如下所示：\n\n```python\n\
    def foo(x: \"int >= 0\" = 0):\n```\n\n非正式地，参数可以这样描述：\n\n```text\nidentifier [:\
    \ expression] [= expression]\n```\n\n这里，注解和默认值都是可选的。\n\n### 返回值\n\n函数返回值可以通过在参数列表后跟\
    \ -> 和一个表达式来注解。以下是示例：\n\n```python\ndef foo(x: \"int >= 0\" = 0) -> \"seemingly\
    \ random integer\":\n    return 42\n```\n\n### 语法\n\n类型提示使用相同的语法并适用于与函数注解相同的事物。主要扩展是它们允许注解为一个类。完整规则集很复杂，但以下提示应涵盖最常见的情况：\n\
    \n- 内置类\n- 用户定义类\n- `types` 模块中的类型\n- 抽象基类\n- 特殊构造，包括 `None`、`Any`、`Union`、`Tuple`\
    \ 和 `Callable`\n\nPEP 的很大一部分致力于特殊情况和复杂类型，包括泛型、协变和逆变、前向引用以及存根文件。\n\n### 语义\n\n\
    与 PEP 3107 一样，类型提示没有关联的标准语义。其目标是提供第三方工具可以使用的标准。在类型提示具有语义的程度上，其语义是由使用它们的工具提供的，而不是由\
    \ Python 语言本身提供的。从定义中：\n\n> \"本 PEP 旨在提供类型注解的标准语法，使 Python 代码更容易进行静态分析和重构，可能的运行时类型检查，以及（也许在某些上下文中）利用类型信息进行代码生成。\"\
    \n\n形成该标准的重要工具是 mypy（http://mypy-lang.org/）。mypy 的目的是为 Python 提供静态类型检查器。虽然在文档和调试中静态类型检查的优点可以争论，但拥有该选项是很好的。\n\
    \n## 文档字符串\n\nPython 文档字符串是一个字符串字面量。它可以作为模块中的第一个语句出现，也可以作为函数、方法或类定义后的第一个语句出现。文档字符串成为该对象的\
    \ __doc__ 特殊属性。其目的是提供一种更自由的方式来记录程序的一部分。\n\n### 示例\n\n以下代码为一个简化的早期测试套件提供了文档字符串：\n\
    \n```python\n\"\"\"\nThis is an abbreviated version of my random number generator\
    \ test\nsuite.\n\nIt uses the pytest framework.  It does not do much in this form.\n\
    \"\"\"\n\nimport numpy as np\nimport scipy.stats\nimport random\n\nclass TestRandoms(\
    \ ):\n    \"\"\"\n    This is the main class.\n\n    Normally it would hold all\
    \ the tests, plus and setup and\n    tearDown fixtures.\n    \"\"\"\n    def test_builtin(self):\n\
    \        \"\"\"\n        Test the built-in random number generator on 10000\n\
    \        numbers.\n        \"\"\"\n        num_tests = 10000\n        vals = [0\
    \ for i in range(10)]\n        for i in range(num_tests):\n            tmp = random.randint(0,\
    \ 9)\n            vals[tmp] = vals[tmp] + 1\n\n        chi2, p = scipy.stats.chisquare(self.vals)\n\
    \        assert p > 0.05\n\ndef foo( ):\n    \"\"\" I just needed a function outside\
    \ of a class as an\nexample\"\"\"\n    pass\n```\n\ncode1.py\n\n### 文档\n\n文档字符串可以通过使用\
    \ Python 内置的 help 函数来访问。结果以标准帮助方式显示（即如同用 less 查看文本文件），如下所示：\n\n```text\nIn [4]:\
    \ import code1\n\nIn [5]: help(code1)\nHelp on module code1:\n\nNAME\n    code1\
    \ - This is an abbreviated version of my random number generator test suite.\n\
    \nDESCRIPTION\n    It uses the pytest framework.  It does not do much in this\
    \ form.\n\nCLASSES\n    builtins.object\n        TestRandoms\n\n    class TestRandoms(builtins.object)\n\
    \    |   This is the main class.\n    |\n    |   Normally it would hold all the\
    \ tests, plus and setup and teardown fixtures.\n    |\n    |   Methods defined\
    \ here:\n    |\n    |   test_builtin(self)\n    |       Test the built-in random\
    \ number generator on 10000 numbers.\n    |\n    |   --------------------------------------------------------------------------\n\
    \    |\n    |   Data descriptors defined here:\n    |\n    |   __dict__\n    |\
    \       dictionary for instance variables (if defined)\n    |\n    |   __weakref__\n\
    \    |       list of weak references to the object (if defined)\n\nFUNCTIONS\n\
    \    foo()\n        I just needed a function outside of a class as an example\n\
    \nFILE\n    /nfs/02/wit0096/Packt/chap09/code1.py\n```\n\n可以通过命名它们来访问各个部分的文档字符串。\n\
    \n这里，我们访问类的 `help`：\n\n```text\nIn [6]: help(code1.TestRandoms)\nHelp on class\
    \ TestRandoms in module code1:\n\nclass TestRandoms(builtins.object)\n |  This\
    \ is the main class.\n |\n |  Normally it would hold all the tests, plus and setup\
    \ and teardown\n    fixtures.\n |\n |  Methods defined here:\n |\n |  test_builtin(self)\n\
    \ |      Test the built-in random number generator on 10000 numbers.\n |\n | \
    \ ----------------------------------------------------------------------\n | \
    \ Data descriptors defined here:\n |\n |  __dict__\n |      dictionary for instance\
    \ variables (if defined)\n |\n |  __weakref__\n |      list of weak references\
    \ to the object (if defined)\n```\n\n```python\nself.assertEqual(f(i), ans[i])\n\
    ```\n\n```python\ndef foo():\n    \"\"\"\n    An independent function.\n\n   \
