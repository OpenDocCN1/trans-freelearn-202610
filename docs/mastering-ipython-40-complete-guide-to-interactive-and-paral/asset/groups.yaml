    \ system\n- Example uses\n\n## The API\n\nThis is important for classes and modules.\
    \ This docstring for a module should describe all classes, exceptions, and functions\
    \ that are exported by that module. The docstring for a class should describe\
    \ its public interface and instance variables. The descriptions should be brief\
    \ (a single line is good enough) — more details will be provided by the docstrings\
    \ for the individual parts.\n\n## Inputs\n\nThese are especially important for\
    \ scripts (command-line arguments and options) and functions (parameters). Users\
    \ should be able to specify complete, valid inputs, which means describing:\n\n\
    - The names of the inputs\n- Their types\n- Their ranges\n- Optional versus required\n\
