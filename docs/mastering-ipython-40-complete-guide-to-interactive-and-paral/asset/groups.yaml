    \ 的一个重要特性是实现了改进的插件 API。插件提供了额外的功能，并允许第三方扩展 nose2。列出所有插件的完整清单超出了本书的范围，而且在出版时无论如何都难免不完整。一个示例就足以证明插件的强大功能。\n\
    \n#### 使用 junitxml 插件生成 XML\n\n尽管 nose2 默认将测试结果输出到 stdout，但当测试套件很大时，一个人盯着屏幕观察结果滚动可能过于吃力。在这种情况下，让每个测试以标准化格式生成输出会很有帮助。xUnit\
