    license. As such, there is no authoritative list of things to do. Instead, there
    are varying levels of "officialness."


    # ## Official roadmap


    At the first level are the mainline subprojects at the Jupyter GitHub site: `https://github.com/jupyter`.
    A high-level roadmap is held at `https://github.com/jupyter/roadmap`. The following
    table presents some highlights:


    | Feature | Description | Details |

    |---|---|---|

    | **JupyterLab** | Initially a new page in the existing notebook web app that
    allows multiple plugins in the same browser tab | Potentially a replacement for
    the current notebook interface. A major project. |

    | **ipywidgets** | Interactive widgets that tie together code in the kernel and
    JavaScript/CSS/HTML in the browser | Improved styling. General refactoring. Compartmentalization
    of JavaScript. |

    | **JupyterHub** | Manages and proxies multiple instances of the single-user Jupyter
    notebook server | Configuration enhancements. Sharing and collaboration. |

    | **IPython** |  | Comparatively mature, so few major changes planned. |


