    \ understand what relationship the inputs have with the outputs without being\
    \ told (more than necessary) about the mechanism used to achieve the results.\
    \ This means using plain English to describe what the function does. If there\
    \ is a simple mathematical expression that the function implements, this is a\
    \ good place to include it. This is probably the hardest part of the comment to\
    \ write.\n\n## Outputs\n\nThese are important for scripts and functions. The number\
    \ and types of outputs should be listed. Any side effects should also be described.\n\
    \n## Error conditions\n\nPossible conditions that could result in an error should\
    \ be listed. Errors fall under two categories: silent errors and noisy errors.\n\
    \nNoisy errors are those that result in thrown exceptions or error codes being\
    \ set. All thrown exceptions should be documented. Any variables or data structures\
    \ used to signal errors (for example, `errno`) should also be documented.\n\n\
    Silent errors are those in which the code appears to function normally, but in\
    \ fact is producing invalid results. For example, many numeric algorithms produce\
    \ meaningful results over only a subset of otherwise legal inputs.\n\nIn either\
    \ case, users should be presented with enough information to:\n\n- Avoid error\
    \ conditions (when possible)\n- Detect error conditions (whether by catching an\
    \ exception or by checking for an error code)\n- Recover from an error (for example,\
    \ retrying, or using an alternate method)\n\n## Relationship with other parts\
    \ of the system\n\nThis is important primarily for classes, modules, and public\
    \ interfaces. Object-oriented systems consist of a myriad of interacting parts.\
