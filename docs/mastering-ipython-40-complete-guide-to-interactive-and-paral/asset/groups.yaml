  - "[PAGE 185]\n\nWe find the eigenvalues and eigenvectors:\n\n```\nIn [13]: %octave\
    \ mat = [1 2 3; 4 5 6; 7 8 9]; [vect, vals] = eig(mat)\n\nvect =\n\n   -0.231971\
    \  -0.785830   0.408248\n   -0.525322  -0.086751  -0.816497\n   -0.818673   0.612328\
    \   0.408248\n\nvals =\n\nDiagonal Matrix\n\n    1.6117e+01             0    \
    \         0\n             0   -1.1168e+00             0\n             0      \
    \       0   -1.3037e-15\n```\n\n# Tricky issues\n\nNote that the syntax/semantics\
    \ can be tricky here. The definition of the `eig` function in the Octave language\
    \ specifies the following behavior:\n\n+   - `lambda = eig(A)` returns the eigenvalues\
    \ of A in the vector lambda.\n+   - `[V, lambda] = eig(A)` also returns the eigenvectors\
    \ in V, but lambda is now a matrix whose diagonals contain the eigenvalues. This\
    \ relationship holds true (within round-off errors): `A = V*lambda*inv(V)`.\n\n\
    The `[a, b]` notation and multiple return values do not carry over cleanly into\
    \ IPython.\n\nSo, this sort of works as expected (one might as well expect x to\
    \ be a two-element vector):\n\n```\nIn [14]: x = %octave mat = [1 2 3; 4 5 6;\
    \ 7 8 9]; eig(mat)\n\nans =\n\n    1.6117e+01\n   -1.1168e+00\n   -1.3037e-15\n\
    \nIn [15]: x\n```"
