  md: "\nThe odd thing about Hy's parentheses is that they come before the function\
    \ name and after the argument, rather than after the function name and around\
    \ the arguments. This is the standard syntax for Lisp and all its dialects. The\
    \ syntactic unit created by this form is called an *expression*, and every expression\
    \ has the same form:\n\n```\n(<function> <arguments>)\n```\n\nIn Hy, everything\
    \ is an expression, so there will be a lot of parentheses. It can look awkward\
    \ at first, but this simple syntax makes expression evaluation simple:\n- Apply\
    \ the function to the arguments to return the value of the expression\n- There\
    \ will only ever be one function\n\n## Arithmetic operations are in the wrong\
    \ place\n\nThe code to add 1 and 1 is as follows:\n\n```\n(+ 1 1)\n```\n\nThis\
    \ follows the standard expression semantics: function first, arguments later (in\
    \ this case, operator first and operands later). It is not Hy's fault that people\
    \ use infix notation—consistency is a virtue in a programming language. A side\
    \ benefit of this notation is that arithmetic operators can take an arbitrary\
    \ number of operands:\n\n```\n(* 1 2 3 4)\n```\n\nThis returns 24.\n\nThis should\
    \ not be confused with a prefix version of stack arithmetic, however. The expression:\n\
    \n```\n(* + + 1 2 3 4)\n```\n\nIs a syntax error. It breaks the second rule mentioned\
    \ in the preceding list by having more than one function inside a single set of\
    \ parentheses.\n\n## Function composition is everywhere\n\nOne can fix the previous\
    \ example by using parentheses:\n\n```\n(* (+ (+ 1 2) 3) 4)\n```\n\n```\nif curr\
    \ % 2 == 1:\n    curr = 3 * curr + 1\nelse:\n    curr = curr/2\n    return tmp\n\
    ....:\n```\n\n```\nIn [21]: %hylang (f 35)\nOut[21]: 13\n```\n\nAnd so are built-in\
    \ Python functions and libraries:\n\n```\nIn [28]: %hylang\n....: (setv f (open\
    \ \"hy1.hy\"))\n....: (print (.read f))\n....:\n```\n\nThis prints the contents\
    \ of that file:\n\n```\n%hylang\n(import math)\n(defn safe-sqrt [x]\n  (if (<\
    \ x 0)\n    (math.sqrt (- 0 x))\n    (math.sqrt x)\n  )\n)\n```\n\nHy interoperates\
    \ with Python in too many ways to list here, including list comprehensions, objects,\
    \ and exceptions. It suffices to say that if you are already comfortable with\
    \ Python and interested in branching out into a functional language, Hy is a good\
    \ choice.\n\n## Matplotlib\n\nMatplotlib is a Python-based 2D plotting library.\
    \ It works well with Python, and even better with IPython. It includes the `pyplot`\
    \ module, which provides MATLAB-like functionality. Matplotlib functionality can\
    \ be accessed both programmatically and interactively, from the IPython command\
    \ line. The examples in this section will be run from the command line for ease\
    \ of explication.\n\n## Starting matplotlib\n\nMatplotlib should be installed\
    \ along with most major IPython distributions. If yours does not include it, standard\
    \ package installation procedures (for example, `pip install` or `sudo apt-get`)\
    \ should suffice.\n\nThere are two ways to start up matplotlib: `matplotlib-only`\
    \ or `pylab`.\n\nThe difference is that using `matplotlib-only` mode activates\
    \ `matplotlib` interactive support but does not import anything into the namespace.\
    \ `pylab` mode executes more imports and changes the namespace.\n\nOnce installed,\
    \ `matplotlib-only` mode can be started either from the command line or by using\
    \ the `%matplotlib` magic, as shown here:\n\n```\n(Ipython) -bash-4.1$ ipython\
    \ --matplotlib\nPython 3.4.3 |Anaconda 2.0.1 (64-bit) | (default, Oct 19 2015,\
    \ 21:52:17)\nType \"copyright\", \"credits\" or \"license\" for more information.\n\
    \nIPython 4.0.1 -- An enhanced Interactive Python.\n?          -> Introduction\
    \ and overview of IPython's features.\n%quickref  -> Quick reference.\nhelp  \
    \     -> Python's own help system.\nobject?    -> Details about 'object', use\
    \ 'object??' for extra details.\nUsing matplotlib backend: Qt4Agg\n\nIn [1]:\n\
    ```\n\n## An initial graph\n\nAs always with a new module, it is worth checking\
    \ to see whether everything is working. From the IPython command line, issue the\
    \ following commands:\n\n```\nIn [2]: x = randn(90000)\n```\n\n```\nIn [3]: hist(x,\
    \ 300)\nOut[3]:\n```\n\nAt this point, my command line printed two sorts of things:\n\
    - Two arrays and a list (the return values of the hist call)\n- A stack trace\
    \ (which went away when I deleted my matplotlib font cache in ~/.cache/matplotlib/fontList*.cache)\n\
    \nMore to the point, it produced the following graph:\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_207_0.png)\n\
    \nThis code deserves some further description, as the first matplotlib example:\n\
    - **Line 1:** The `numpy.random.randn` function creates a one-dimensional array\
    \ of 90,000 floating-point numbers; they follow a normal distribution with mean\
    \ equal to 0 and variance equal to 1.\n- **Line 2:** The `hist` function accepts\
    \ an array as an argument and computes and draws the histogram of the array. It\
    \ takes many optional arguments; in this case, we have provided the number of\
    \ bins to use.\n\n## Modifying the graph\n\nIt was easy to get the first graph\
    \ up and running, but it could use some work. The first way to change things is\
    \ to change/add parameters to the constructor. For example, suppose we execute\
    \ this:\n\n```\nIn [11]: hist(x, 300, orientation=\"horizontal\", color=\"green\"\
    )\n```\n\nIt results in the following:\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_208_0.png)\n\
    \nmatplotlib2.gif\n\n```\nOut[49]: <matplotlib.text.Text at 0x2b15e5bdc7f0>\n\
    ```\n\n```\nIn [53]: ion\nOut[53]: <function matplotlib.pyplot.ion>\n```\n\n```\n\
    In [54]: plot()\nOut[54]: []\n```\n\nThis would result in changes to the diagram\
    \ being delayed until the call to plot( ), at which point they all happen simultaneously.\n\
    \n## Bokeh\n\nBokeh is a Python interactive visualization library that targets\
    \ modern web browsers for presentation. Its goal is to provide elegant, concise\
    \ construction of novel graphics in the style of D3.js and extend this capability\
    \ with high-performance interactivity over very large or streaming datasets. Bokeh\
    \ can help anyone who wants to quickly and easily create interactive plots, dashboards,\
    \ and data applications.\n\nFor our purposes, Bokeh can be used to produce graphics\
    \ that will be viewed from web browsers. Although it does not support the same\
    \ sort of command-line interactivity as Matplotlib when used in this manner, the\
    \ ability to produce durable images that are easily viewed remotely is important\
    \ for purposes such as reporting. In addition, Bokeh's ability to generate web\
    \ pages using HTML, JavaScript, and CSS means that the graph itself can be as\
    \ interactive as those tools can make it.\n\nA command-line-driven interactive\
    \ approach is supported when using a Bokeh server, but this is beyond the scope\
    \ of the current section.\n\n## Starting Bokeh\n\nBokeh can be installed as a\
    \ standard IPython module using pip:\n\n```\npip install bokeh\n```\n\nOnce installed,\
    \ the bokeh libraries can be accessed through a standard import statement:\n\n\
    ```\nIn [1]: import bokeh\n```\n\nBokeh is currently in constant flux. The version\
    \ used in these examples did not include a %bokeh or %%bokeh magic, although one\
    \ may become available.\n\n## Interactive plots\n\nAn important feature of Bokeh\
    \ is the ability to allow the user to interact with finished plots. This is accomplished\
    \ in two ways:\n- Built-in Bokeh functionality\n- The ability to interface with\
    \ JavaScript in the browser\n\nOur example will involve the first option.\n\n\
    ## An example interactive plot\n\nThe following code displays two graphs side\
    \ by side, and allows the user to select a set of points in one graph and see\
    \ where the corresponding points lie in the other graph. The code introduces some\
    \ new concepts, which will be discussed:\n\n```\nIn [2]: import numpy as np\n\
    ```\n\n```\nIn [3]: import bokeh.plotting as bp\n```\n\n```\nIn [4]: import bokeh.models\
    \ as bm\n```\n\n```\nIn [5]: bp.output_file(\"bokeh4.html\")\n```\n\n```\nIn [6]:\
    \ x = np.linspace(-2 * np.pi, 2 * np.pi, 100)\n```\n\n```\nIn [7]: y0 = np.cos(x)\n\
    ```\n\n```\nIn [8]: y1 = np.sin(x)\n```\n\n```\nIn [9]: mySource = bm.ColumnDataSource(data=dict(x=x,\
    \ y0=y0, y1=y1))\n```\n\n```\nIn [10]: myTools = \"box_select,lasso_select,help\"\
    \n```\n\n```\nIn [11]: left = bp.figure(tools=myTools, width=300, height=300,\n\
    title=\"Left\")\n```\n"
  mdcn: "\n关于 Hy 的括号，奇怪之处在于它们位于函数名之前、参数之后，而不是位于函数名之后并包围参数。这是 Lisp 及其所有方言的标准语法。这种形式创建的语法单元称为*表达式*，每个表达式都具有相同的形式：\n\
    \n```\n(<function> <arguments>)\n```\n\n在 Hy 中，一切都是表达式，所以会有大量括号。起初可能看起来不太习惯，但这种简洁的语法使表达式求值变得简单：\n\
    - 将函数应用于参数，返回表达式的值\n- 永远只存在一个函数\n\n## 算术运算的位置不同寻常\n\n将 1 和 1 相加的代码如下：\n\n```\n\
    (+ 1 1)\n```\n\n这遵循标准表达式语义：先是函数，后是参数（在这里是先运算符，后操作数）。人们使用中缀表示法并不是 Hy 的错——一致性是编程语言的一种美德。这种表示法的一个附带好处是算术运算符可以接受任意数量的操作数：\n\
    \n```\n(* 1 2 3 4)\n```\n\n这将返回 24。\n\n但是，这不应与栈算术的前缀版本混淆。表达式：\n\n```\n(* + + 1\
    \ 2 3 4)\n```\n\n是一个语法错误。它违反前面列表中的第二条规则，因为在一对括号内包含了多个函数。\n\n## 函数组合无处不在\n\n可以用括号修复前面的示例：\n\
    \n```\n(* (+ (+ 1 2) 3) 4)\n```\n\n```\nif curr % 2 == 1:\n    curr = 3 * curr\
    \ + 1\nelse:\n    curr = curr/2\n    return tmp\n....:\n```\n\n```\nIn [21]: %hylang\
    \ (f 35)\nOut[21]: 13\n```\n\nPython 的内置函数和库也是如此：\n\n```\nIn [28]: %hylang\n....:\
    \ (setv f (open \"hy1.hy\"))\n....: (print (.read f))\n....:\n```\n\n这将打印该文件的内容：\n\
    \n```\n%hylang\n(import math)\n(defn safe-sqrt [x]\n  (if (< x 0)\n    (math.sqrt\
    \ (- 0 x))\n    (math.sqrt x)\n  )\n)\n```\n\nHy 与 Python 的互操作方式多到无法在此一一列举，包括列表推导式、对象和异常。可以说，如果你已经熟悉\
    \ Python，并且有兴趣扩展到函数式语言，Hy 是一个不错的选择。\n\n## Matplotlib\n\nMatplotlib 是一个基于 Python\
    \ 的 2D 绘图库。它与 Python 配合良好，与 IPython 配合更佳。它包含 `pyplot` 模块，提供类似 MATLAB 的功能。Matplotlib\
    \ 的功能既可以通过编程方式访问，也可以在 IPython 命令行中以交互方式访问。为了便于说明，本节中的示例将在命令行中运行。\n\n## 启动 matplotlib\n\
    \nMatplotlib 应该随大多数主流 IPython 发行版一同安装。如果你的发行版未包含它，标准的包安装过程（例如 `pip install` 或\
    \ `sudo apt-get`）应该就足够了。\n\n有两种启动 matplotlib 的方式：`matplotlib-only` 或 `pylab`。\n\
    \n区别在于，使用 `matplotlib-only` 模式会激活 `matplotlib` 的交互支持，但不会向命名空间导入任何内容。`pylab` 模式会执行更多导入并更改命名空间。\n\
    \n安装后，可以通过命令行或使用 `%matplotlib` 魔法命令启动 `matplotlib-only` 模式，如下所示：\n\n```\n(Ipython)\
    \ -bash-4.1$ ipython --matplotlib\nPython 3.4.3 |Anaconda 2.0.1 (64-bit) | (default,\
    \ Oct 19 2015, 21:52:17)\nType \"copyright\", \"credits\" or \"license\" for more\
    \ information.\n\nIPython 4.0.1 -- An enhanced Interactive Python.\n?        \
    \  -> Introduction and overview of IPython's features.\n%quickref  -> Quick reference.\n\
    help       -> Python's own help system.\nobject?    -> Details about 'object',\
    \ use 'object??' for extra details.\nUsing matplotlib backend: Qt4Agg\n\nIn [1]:\n\
    ```\n\n## 初始图形\n\n与其他新模块一样，值得检查一切是否正常。在 IPython 命令行中，输入以下命令：\n\n```\nIn [2]: x\
    \ = randn(90000)\n```\n\n```\nIn [3]: hist(x, 300)\nOut[3]:\n```\n\n此时，我的命令行打印了两类内容：\n\
    - 两个数组和一个列表（`hist` 调用的返回值）\n- 一个堆栈跟踪（当我删除位于 ~/.cache/matplotlib/fontList*.cache\
    \ 的 matplotlib 字体缓存后，它就消失了）\n\n更重要的是，它生成了以下图形：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_207_0.png)\n\
    \n作为第一个 matplotlib 示例，这段代码值得进一步说明：\n- **第 1 行：** `numpy.random.randn` 函数创建一个包含\
    \ 90,000 个浮点数的一维数组；它们遵循均值为 0、方差为 1 的正态分布。\n- **第 2 行：** `hist` 函数接受一个数组作为参数，计算并绘制该数组的直方图。它接受许多可选参数；在本例中，我们提供了要使用的箱数。\n\
    \n## 修改图形\n\n让第一个图形运行起来很容易，但它还可以改进。改变事物的第一种方法是更改/添加构造函数的参数。例如，假设我们执行以下命令：\n\n\
    ```\nIn [11]: hist(x, 300, orientation=\"horizontal\", color=\"green\")\n```\n\
    \n结果如下：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_208_0.png)\n\nmatplotlib2.gif\n\
    \n```\nOut[49]: <matplotlib.text.Text at 0x2b15e5bdc7f0>\n```\n\n```\nIn [53]:\
    \ ion\nOut[53]: <function matplotlib.pyplot.ion>\n```\n\n```\nIn [54]: plot()\n\
    Out[54]: []\n```\n\n这将导致对图表的更改被延迟到调用 plot( ) 时，届时它们会同时发生。\n\n## Bokeh\n\nBokeh\
    \ 是一个 Python 交互式可视化库，面向现代 Web 浏览器进行呈现。其目标是提供以 D3.js 风格优雅、简洁地构建新颖图形，并将这一能力扩展到对超大规模或流式数据集的高性能交互。Bokeh\
    \ 可以帮助任何希望快速轻松创建交互式绘图、仪表盘和数据应用程序的人。\n\n就我们的目的而言，Bokeh 可用于生成将在 Web 浏览器中查看的图形。虽然以这种方式使用时，它不支持像\
    \ Matplotlib 那样的命令行交互性，但生成持久图像并易于远程查看的能力对于报告等目的非常重要。此外，Bokeh 使用 HTML、JavaScript\
    \ 和 CSS 生成网页的能力意味着图形本身可以像这些工具所能实现的那样具有交互性。\n\n使用 Bokeh 服务器时支持命令行驱动的交互式方法，但这超出了当前章节的范围。\n\
    \n## 启动 Bokeh\n\n可以使用 pip 将 Bokeh 作为标准 IPython 模块安装：\n\n```\npip install bokeh\n\
    ```\n\n安装后，可以通过标准 import 语句访问 bokeh 库：\n\n```\nIn [1]: import bokeh\n```\n\nBokeh\
    \ 目前处于持续变化中。这些示例中使用的版本不包含 %bokeh 或 %%bokeh 魔法命令，尽管以后可能会有。\n\n## 交互式绘图\n\nBokeh\
    \ 的一个重要特性是允许用户与完成的绘图进行交互。这通过两种方式实现：\n- Bokeh 内置功能\n- 与浏览器中的 JavaScript 交互的能力\n\
    \n我们的示例将涉及第一种选项。\n\n## 一个交互式绘图示例\n\n以下代码并排显示两个图形，并允许用户在一个图形中选择一组点，查看相应点在另一个图形中的位置。该代码引入了一些新概念，下面将进行讨论：\n\
    \n```\nIn [2]: import numpy as np\n```\n\n```\nIn [3]: import bokeh.plotting as\
    \ bp\n```\n\n```\nIn [4]: import bokeh.models as bm\n```\n\n```\nIn [5]: bp.output_file(\"\
    bokeh4.html\")\n```\n\n```\nIn [6]: x = np.linspace(-2 * np.pi, 2 * np.pi, 100)\n\
    ```\n\n```\nIn [7]: y0 = np.cos(x)\n```\n\n```\nIn [8]: y1 = np.sin(x)\n```\n\n\
    ```\nIn [9]: mySource = bm.ColumnDataSource(data=dict(x=x, y0=y0, y1=y1))\n```\n\
    \n```\nIn [10]: myTools = \"box_select,lasso_select,help\"\n```\n\n```\nIn [11]:\
    \ left = bp.figure(tools=myTools, width=300, height=300,\ntitle=\"Left\")\n```\n"
