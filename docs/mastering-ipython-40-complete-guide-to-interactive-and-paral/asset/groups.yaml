  - '[PAGE 83]


    # Using multiple processors


    Given the limitations of threading for CPU-bound code, perhaps a solution can
    be found using multiple processors. The problem with CPU-bound algorithms and
    threading was that there was an implicitly-shared resource: the CPU. With multiple
    processors this limitation can be eased – each function call can have its own
    CPU, up to the physical number of CPUs. Each CPU would work independently and
    in parallel rather than being a bottleneck. We will examine the tools that IPython
    provides for working with multiple processors in the following sections.


    # The IPython parallel architecture


    The `IPython.parallel` package has moved to the `ipyparallel` project. While not
    a major change, this has introduced a dependency on the ZeroMQ messaging library.


    # Overview


    The ipyparallel architecture is a natural extension of the serial IPython architecture.
    The decoupling of the client from the interpreter lends itself to an architecture
    in which multiple interpreters and clients can run in parallel.


    # Components


    The IPython architecture consists of four components:


    +   - The IPython Engine

    +   - The IPython Controller/Client

    +   - The IPython Hub

    +   - The IPython Scheduler


    # The IPython Engine


    An IPython Engine is a Python instance that accepts Python commands and objects
    over a network connection. The ability to run engines on different processors
    is what makes distributed computing in IPython possible.


    # The IPython Controller


    The IPython Controller provides an interface for working with a set of engines.
    It consists of a hub and a set of schedulers. The Controller provides the single
    point of contact for users who wish to interact with the engines.'
