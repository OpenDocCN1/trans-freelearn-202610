    # Job control


    Each View also contains functions for controlling the job in its queue. These
    are similar to the functions provided in `Client`, but apply only to the engines
    in the View:


    | Method | Arguments | Effect |

    |---|---|---|

    | abort | `jobs` (one of):<br>`(list of) str`<br>`None`<br>`targets` | The `(list
    of) str` is a list of `msg_id` to be aborted. If None, all jobs are aborted. This
    occurs on all engines listed in `targets`. |

    | get_result | `indices_or_msg_ids` (one of):<br>`(list of) job index`<br>`(list
    of) msg_ids` | This gets the result of a job by `msg_id` or history index. The
    result is an `AsyncResult` object. This is useful when a job is blocked, as the
    client will not have access to the information. |

    | queue_status | `targets` (one of):<br>`(list of) int`<br>`(list of) str` | This
    returns the status of the listed engine queues. It defaults to all queues. |

    | shutdown | `targets` (one of):<br>`list of ints`<br>`"all"`<br>`hub: bool` |
    This terminates engine processes. If hub is True, it also terminates the Hub.
    |


    # DirectView


    A `DirectView` object works as a multiplexer—it has a set of engines (`targets`)
    and it does the same thing to all of its engines. The basic concept is that a
    `DirectView` can be treated as if it were a single engine, except that it will
    execute on multiple engines in parallel.


    The effect of this on function execution is straightforward:


    +   - For `apply*` functions, `f`, `*args`, and `**kwargs` are sent to every engine
    in the target set.

    +   - For `map*` functions, `f`, one item from `*sequences`, and `**kwargs` are
    sent to each engine in the target set. Each engine gets a different item from
    `*sequences`. If there are more elements in `*sequences` than there are engines,
    some engines will execute multiple times, with a different item each time.'
