  \ 以 `test_` 为前缀的测试函数或方法是测试项。\n\n## 组织测试文件\n\npytest 允许测试函数与被测试的函数包含在同一文件中。这样做有一些优点，即更有可能在功能更新时更新测试，并且使测试易于查找。\n\
