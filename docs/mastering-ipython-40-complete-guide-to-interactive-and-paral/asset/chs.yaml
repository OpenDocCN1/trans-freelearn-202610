  \nIn [12]: df_wtVsMpg['wt'] = wt\n\nIn [13]: df_wtVsMpg['mpg'] = mpg\n\nIn [14]:\
  \ p = ggplot2.ggplot(df_wtVsMpg)\n\nIn [15]: type(p)\nOut[15]: rpy2.robjects.lib.ggplot2.GGPlot\n\
  \nIn [16]: p.plot()\n```\n\ncode6.py\n\n- **第 2-3 行：** 这些行导入并激活了在 IPython/R 之间传输数据的新方法。这是自\
