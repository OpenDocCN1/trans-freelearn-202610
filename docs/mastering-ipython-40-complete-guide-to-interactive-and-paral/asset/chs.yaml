- '# IPython 4.0 精通：使用 IPython 4.0 的交互式和并行计算 完整指南





  '
- '# 前言


  欢迎来到 IPython 4.0 的世界，它被用于高性能和并行环境。Python 本身在这些领域逐渐受到青睐，而 IPython 正是在这些优势之上构建的。


  高性能计算（HPC）有许多特性，使其与大多数其他计算领域有所不同。我们将首先简要介绍 HPC 的不同之处，以及 IPython 如何成为一项颠覆性技术。


  然后我们将从 IPython 命令行开始。既然 Jupyter 已从 IPython 项目中分离出来，这就是开发者与该语言交互的主要方式。这是一个足够重要的主题，值得用两章来讲述。在第一章中，我们将重点介绍基本命令，并理解
  IPython 如何执行这些命令。第二章将涵盖更高级的命令，让读者对命令行的功能打下坚实的基础。


  之后，我们将讨论并行编程的一些细节。IPython parallel 是一个包含 IPython 中并行计算所需大量功能的包。它支持一套灵活的并行编程模型，如果你想利用大规模并行架构的强大能力，这一点至关重要。


  并行运行但在不同处理器上的程序，尽管拥有独立的地址空间，往往仍需要交换信息。它们通过发送消息来实现这一点。我们将介绍两个消息传递系统：ZeroMQ 和 MPI，并涉及它们如何在现有程序中使用以及如何与
  IPython 交互。


  接下来，我们将更深入地探讨能够提高生产力的库，无论它们是 IPython 自带的还是第三方提供的。本书无法涵盖所有工具，而且新工具层出不穷，但其中一些将特别适用于并行和
  HPC 项目。


  第 9 章《文档》讨论了文档的不同受众及其需求。在良好文档标准的背景下，演示了如何使用带有 reStructuredText、docutils 和 Sphinx
  的 docstring。


  第 10 章《访问 Jupyter》介绍了 Jupyter notebook，并将其描述为一种结合数据和计算的实验室笔记本。


  第 11 章《走向未来》反思了当前快速变化的节奏，并展望了未来可能的发展方向，既涉及最近 IPython 与 Jupyter 项目的分离，也涉及科学计算领域整体的一些新兴趋势。


  # 本书所需准备


  本书基于 2015 年 8 月至 2016 年 3 月期间的 IPython 4.0 和 4.0.1（稳定版）编写；所有示例和函数在这些版本中均应可用。当需要第三方库时，会在相应位置注明所使用的版本。鉴于
  IPython 4 实现、各种第三方库以及整个领域的变化速度，很遗憾，无法保证本书中的每个示例都能在每位读者的机器上运行。再加上机器架构和配置的差异，问题只会更加严重。尽管我们努力编写简洁、可移植的代码，但读者在让个别示例在自己的系统上运行时遇到一些困难，也不应感到意外。


  # 本书读者对象


  本书面向希望充分利用 IPython、利用交互式计算的便捷性，使用 IPython 进行高级科学计算的 IPython 开发者。


  它非常适合希望了解 IPython 4.0 的交互式和并行计算特性，以及与第三方工具和概念（如测试和结果文档化）集成的用户。


  # 约定


  在本书中，您会发现多种文本样式来区分不同类型的信息。以下是这些样式的一些示例及其含义说明。


  如今也是如此，只不过模型变得更大，模拟变得更加复杂。通过实际发射来测试新型核导弹是不明智的。相反，在软件中构建导弹模型，并在计算机上运行其发射模拟。设计缺陷可以在计算机中被暴露出来（在计算机中它们是无害的），而不是在现实中。


  对导弹进行建模比对船只航程建模要复杂得多。运动部件更多，相关物理定律更复杂，容错性更低，如此等等。如果不使用比中世纪航海家所能获得的更复杂的工具，这是不可能做到的。归根结底，是我们的工具能力限制了我们的行动范围。


  问题的本质是不断扩展，直至填满我们解决问题的能力上限。当计算机刚被发明时，它们似乎能解决我们所有的问题。但没过多久，新的问题就出现了。

