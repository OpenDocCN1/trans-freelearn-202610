  \n解决方案是对 `os.getcwd` 进行 monkeypatch。monkeypatch 可以设置或删除以下内容：\n\n- 属性\n- 字典项\n- 环境变量\n\
  - `sys.path` 中的项\n\nmonkeypatch 的使用方式类似于装饰器对象，只是 monkeypatch 对象没有被显式声明，只调用它的函数。一旦使用\
  \ monkeypatch 的函数结束，之前获取的设置会被恢复。考虑以下测试（伪）代码：\n\n```python\ndef test_func1():\n \
  \   logdir = os.getcwd() + \"/func1/loadtests\"\n    logfile = open(logdir + \"\
  /results1.log\", \"w\")\n    <do test things>\n    logfile.close()\n```\n\n可以通过如下方式对其进行\
  \ monkeypatch：\n\n```python\n@pytest.fixture(scope=\"function\")\ndef change_cwd(monkeypatch):\n\
  \    monkeypatch.setattr(\"os.getcwd\", lambda: \"/\")\n\ndef test_func1(change_cwd):\n\
  \    logdir = os.getcwd() + \"/func1/loadtests\"\n    logfile = open(logdir + \"\
  /results1.log\", \"w\")\n    <do test things>\n    logfile.close()\n```\n\n`change_cwd`\
  \ 函数会告诉 monkeypatch 将 `os.getcwd` 函数改为其第二个参数——那个 lambda 表达式。将 `change_cwd` 作为参数传入\
  \ `test_func1`，可确保 monkeypatch 的调用被执行。其他不需要对 `os.getcwd` 做此修改的测试函数，只需不使用 `change_cwd`，就会看到正常的功能。\n\
  \nmonkeypatch 与模拟对象（mock object）的概念类似。模拟对象是用户定义的对象，它对外暴露的接口与另一个对象相同，但实现要简单得多。例如，在测试一个从生产数据库读取数据的函数时，通常不希望使用真实的线上数据。相反，每次运行都应使用一组稳定的测试数据，以确保各次运行之间可以进行对比。在这种情况下，可以构造一个模拟数据库对象。它支持（一部分）数据库操作，但返回的是测试数据，而不是连接数据库服务器获取实时数据。monkeypatch\
  \ 也执行类似的功能：它用一个简化的实现替换一个功能完整的值/函数/对象，以便进行测试。\n"
