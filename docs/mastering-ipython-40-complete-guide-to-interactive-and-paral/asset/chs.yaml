  \        tmp = random.randint(0, 9)\n        vals[tmp] = vals[tmp] + 1\n\n    chi2,\
  \ p = scipy.stats.chisquare(vals)\n    assert p > 0.05\n```\n\n预期结果如下：\n\n```text\n\
  (my_rpy2_zone)-bash-4.1$ ./local/bin/nose2 -v testrand_nose2decs_1\ntestrand_nose2decs_1.FunctionTestCase\
  \ (test_bad) ... Doing setUp\nDoing test_bad\nDoing tearDown\nFAIL\ntestrand_nose2decs_1.FunctionTestCase\
  \ (test_better) ... Doing setUp\nDoing test_better\nDoing tearDown\nok\ntestrand_nose2decs_1.FunctionTestCase\
  \ (test_builtin) ... Doing setUp\nDoing test_builtin\nDoing tearDown\nok\n======================================================================\n\
  FAIL: testrand_nose2decs_1.FunctionTestCase (test_bad)\n----------------------------------------------------------------------\n\
  Traceback (most recent call last):\n    File \"/nfs/02/wit0096/Packt/chap08/testrand_nose2decs_1.py\"\
  , line 40,\n    in test_bad\n        assert p > 0.05\nAssertionError\n\n------------------------------------------------------------\n\
  Ran 3 tests in 0.277s\n\nFAILED (failures=1)\n```\n\n### 插件\n\n从 nose 迁移到 nose2\
  \ 的一个重要特性是实现了改进的插件 API。插件提供了额外的功能，并允许第三方扩展 nose2。列出所有插件的完整清单超出了本书的范围，而且在出版时无论如何都难免不完整。一个示例就足以证明插件的强大功能。\n\
  \n#### 使用 junitxml 插件生成 XML\n\n尽管 nose2 默认将测试结果输出到 stdout，但当测试套件很大时，一个人盯着屏幕观察结果滚动可能过于吃力。在这种情况下，让每个测试以标准化格式生成输出会很有帮助。xUnit\
  \ 家族已经普及了 XML 作为这种格式，因此许多测试报告工具都期望以 XML 作为输入。\n\n为了输出 XML，可以按如下方式调用 junitxml 插件：\n\
  \n```bash\n(my_rpy2_zone)-bash-4.1$ ~/.local/bin/nose2 -v --plugin nose2.plugins.junitxml\
  \ --junit-xml testrand_nose2decs_1\n```\n\n输出由两个流组成：\n\n- 通常的输出，发送到 stdout\n- 一个\
  \ XML 文件（nose2-junit.xml），创建于测试运行所在目录\n\n### 小结\n\n一个运行中的程序最重要的属性就是正确性。很多时候，测试被留到开发结束时才进行，而到了那时，由于项目已经延期，测试要么被完全跳过，要么草草了事。对于科学和工程代码来说尤其如此，因为可能危及生命。即使是探索性代码也需要经过测试，以便基于它做出合理的决策。没有相关单元测试的代码不应被接受到项目仓库中。因此，应尽可能让开发者轻松地进行测试。\n\
  \n虽然 IPython 支持许多出色的可视化工具，可以为结果提供视觉反馈，但没有任何东西可以替代彻底的单元测试。本章概述了单元测试的基础知识——setup、test\
  \ 和 teardown——并展示了三个不同框架如何实现这些概念。使用哪种框架的决定权在项目团队手中。\n\n在下一章中，我们将探讨对专业级软件中另一个常被忽视的组件的支持：文档。我们将讨论文档面向的不同受众、每个受众所关注的信息类型、格式选项，以及可用于让文档编写相对轻松的工具。\n"
- "## 文档\n\n本章将涵盖以下主题：\n\n- 内联注释\n- 文档字符串\n- reStructuredText\n- Docutils\n- Sphinx\n\
  \n### 内联注释\n\n我们将使用“内联注释”一词来指代所有面向维护编码人员、且除阅读源代码的人之外任何人都看不到的注释。\n\n内联注释以 `#` 符号开头，一直延续到行尾。它们不能出现在字符串字面量中。内联注释中的任何字符都不会被解释。\n\
  \nPython 不支持块注释。关于三重双引号（`\"\"\"`）可用于注释掉多行的说法并不可信。虽然这通常也能奏效，但实际发生的是 Python 将所包含的行视为一个多行字符串。作为一个字符串，其中的行不会被解释，而是创建了一个字符串字面量。由于这个新字面量未赋值给任何变量，它会被立即回收。\n\
  \n除了这种奇怪的行为之外，三重双引号还用于文档字符串。将两者混用可能会造成混淆，而这正是我们首先要避免的。\n\n#### 使用内联注释\n\nPython\
  \ 风格的“官方”指南是 PEP 0008（见 `https://www.python.org/dev/peps/pep-0008/`）。在一定程度上，代码可以说成是自文档化的，本指南提供了一组关于风格一致性的标准建议，有助于推进这一目标。其中关于注释的部分尤其包含一些有用的建议：\n\
  \n- 注释应与代码保持一致。如果代码发生变化，请确保注释能够反映这些变化。\n- 使用完整的句子进行注释。\n\n\n\n\n- 块注释应与它们所适用的代码保持相同的缩进级别。每一行应以\
  \ # 符号和一个空格开头。\n- 注释很少应与代码写在同一行。\n\n## 函数注解\n\n函数注解和类型提示可以被视为一种内联注释的类型。函数注解起源于 PEP\
  \ 3107，该 PEP 提供了为 Python 函数添加任意元数据注解的语法。从定义（https://www.python.org/dev/peps/pep-3107/）中：\n\
  \n> \"由于 Python 的 2.x 系列缺乏标注函数参数和返回值标准方式的手段，出现了各种工具和库来填补这一空白。(...) 本 PEP 旨在提供一种单一、标准的方式来指定此信息，减少到目前为止因机制和语法差异过大而造成的混乱。\"\
  \n\n### 语法\n\n函数注解适用于两类事物：参数和返回值。\n\n### 参数\n\n对于参数，注解由冒号表示，其方式类似于用等号标记默认值，如此示例所示：\n\
  \n```python\ndef foo(x: \"int >= 0\"):\n```\n\n注解和默认值都可以按顺序放置来同时指示，如下所示：\n\n```python\n\
  def foo(x: \"int >= 0\" = 0):\n```\n\n非正式地，参数可以这样描述：\n\n```text\nidentifier [: expression]\
  \ [= expression]\n```\n\n这里，注解和默认值都是可选的。\n\n### 返回值\n\n函数返回值可以通过在参数列表后跟 -> 和一个表达式来注解。以下是示例：\n\
  \n```python\ndef foo(x: \"int >= 0\" = 0) -> \"seemingly random integer\":\n   \
  \ return 42\n```\n\n### 语法\n\n类型提示使用相同的语法并适用于与函数注解相同的事物。主要扩展是它们允许注解为一个类。完整规则集很复杂，但以下提示应涵盖最常见的情况：\n\
  \n- 内置类\n- 用户定义类\n- `types` 模块中的类型\n- 抽象基类\n- 特殊构造，包括 `None`、`Any`、`Union`、`Tuple`\
  \ 和 `Callable`\n\nPEP 的很大一部分致力于特殊情况和复杂类型，包括泛型、协变和逆变、前向引用以及存根文件。\n\n### 语义\n\n与 PEP\
  \ 3107 一样，类型提示没有关联的标准语义。其目标是提供第三方工具可以使用的标准。在类型提示具有语义的程度上，其语义是由使用它们的工具提供的，而不是由 Python\
  \ 语言本身提供的。从定义中：\n\n> \"本 PEP 旨在提供类型注解的标准语法，使 Python 代码更容易进行静态分析和重构，可能的运行时类型检查，以及（也许在某些上下文中）利用类型信息进行代码生成。\"\
  \n\n形成该标准的重要工具是 mypy（http://mypy-lang.org/）。mypy 的目的是为 Python 提供静态类型检查器。虽然在文档和调试中静态类型检查的优点可以争论，但拥有该选项是很好的。\n\
  \n## 文档字符串\n\nPython 文档字符串是一个字符串字面量。它可以作为模块中的第一个语句出现，也可以作为函数、方法或类定义后的第一个语句出现。文档字符串成为该对象的\
  \ __doc__ 特殊属性。其目的是提供一种更自由的方式来记录程序的一部分。\n\n### 示例\n\n以下代码为一个简化的早期测试套件提供了文档字符串：\n\
  \n```python\n\"\"\"\nThis is an abbreviated version of my random number generator\
  \ test\nsuite.\n\nIt uses the pytest framework.  It does not do much in this form.\n\
  \"\"\"\n\nimport numpy as np\nimport scipy.stats\nimport random\n\nclass TestRandoms(\
  \ ):\n    \"\"\"\n    This is the main class.\n\n    Normally it would hold all\
  \ the tests, plus and setup and\n    tearDown fixtures.\n    \"\"\"\n    def test_builtin(self):\n\
  \        \"\"\"\n        Test the built-in random number generator on 10000\n  \
  \      numbers.\n        \"\"\"\n        num_tests = 10000\n        vals = [0 for\
  \ i in range(10)]\n        for i in range(num_tests):\n            tmp = random.randint(0,\
  \ 9)\n            vals[tmp] = vals[tmp] + 1\n\n        chi2, p = scipy.stats.chisquare(self.vals)\n\
  \        assert p > 0.05\n\ndef foo( ):\n    \"\"\" I just needed a function outside\
  \ of a class as an\nexample\"\"\"\n    pass\n```\n\ncode1.py\n\n### 文档\n\n文档字符串可以通过使用\
  \ Python 内置的 help 函数来访问。结果以标准帮助方式显示（即如同用 less 查看文本文件），如下所示：\n\n```text\nIn [4]:\
  \ import code1\n\nIn [5]: help(code1)\nHelp on module code1:\n\nNAME\n    code1\
  \ - This is an abbreviated version of my random number generator test suite.\n\n\
  DESCRIPTION\n    It uses the pytest framework.  It does not do much in this form.\n\
  \nCLASSES\n    builtins.object\n        TestRandoms\n\n    class TestRandoms(builtins.object)\n\
  \    |   This is the main class.\n    |\n    |   Normally it would hold all the\
  \ tests, plus and setup and teardown fixtures.\n    |\n    |   Methods defined here:\n\
  \    |\n    |   test_builtin(self)\n    |       Test the built-in random number\
  \ generator on 10000 numbers.\n    |\n    |   --------------------------------------------------------------------------\n\
  \    |\n    |   Data descriptors defined here:\n    |\n    |   __dict__\n    | \
  \      dictionary for instance variables (if defined)\n    |\n    |   __weakref__\n\
  \    |       list of weak references to the object (if defined)\n\nFUNCTIONS\n \
  \   foo()\n        I just needed a function outside of a class as an example\n\n\
  FILE\n    /nfs/02/wit0096/Packt/chap09/code1.py\n```\n\n可以通过命名它们来访问各个部分的文档字符串。\n\
  \n这里，我们访问类的 `help`：\n\n```text\nIn [6]: help(code1.TestRandoms)\nHelp on class TestRandoms\
  \ in module code1:\n\nclass TestRandoms(builtins.object)\n |  This is the main class.\n\
  \ |\n |  Normally it would hold all the tests, plus and setup and teardown\n   \
  \ fixtures.\n |\n |  Methods defined here:\n |\n |  test_builtin(self)\n |     \
  \ Test the built-in random number generator on 10000 numbers.\n |\n |  ----------------------------------------------------------------------\n\
  \ |  Data descriptors defined here:\n |\n |  __dict__\n |      dictionary for instance\
  \ variables (if defined)\n |\n |  __weakref__\n |      list of weak references to\
  \ the object (if defined)\n```\n\n```python\nself.assertEqual(f(i), ans[i])\n```\n\
  \n```python\ndef foo():\n    \"\"\"\n    An independent function.\n\n    I needed\
  \ another function to illustrate the docstring for a\n    function that was not\
  \ a member of a class.\n    \"\"\"\n    pass\n```\n\ncode2.py\n\n它产生以下（简略）输出：\n\n\
  ```text\nIn [10]: import code2\n\nIn [11]: help(code2)\n\nHelp on module code2:\n\
  \nNAME\n    code2 - This is my hailstone unit test suite.\n\nDESCRIPTION\n    It\
  \ uses the unittest framework.  Admittedly, it does not do much.\n\nCLASSES\n  \
  \  unittest.case.TestCase(builtins.object)\n        TestHailStones\n\n        class\
  \ TestHailStones(unittest.case.TestCase)\n        |   The main class for testing\
  \ the hailstone sequence generator.\n        |\n        |   Method resolution order:\n\
  \        |       TestHailStones\n        |       unittest.case.TestCase\n      \
  \  |       builtins.object\n\naddTypeEqualityFunc(self, typeobj, function)\n\nAdd\
  \ a type specific assertEqual style function to compare a type.\n\nThis method is\
  \ for use by TestCase subclasses that need to register\ntheir own type equality\
  \ functions to provide nicer error messages.\n\nArgs:\n    typeobj: The data type\
  \ to call this function on when both values\n        are of the same type in assertEqual().\n\
  \    function: The callable taking two arguments and an optional\n        msg= argument\
  \ that raises self.failureException with a\n        useful error message when the\
  \ two arguments are not equal.\n\nassertAlmostEqual(self, first, second, places=None,\
  \ msg=None, delta=None)\n```\n\n注意 `unittest.TestCase` 类的文档无需额外努力即可包含在内。\n\n###\
  \ 推荐元素\n\nPEP 0257 记录了与文档字符串相关的约定。从标准（https://www.python.org/dev/peps/pep-0257/）中：\n\
  \n> \"本 PEP 的目标是标准化文档字符串的高级结构：它们应包含什么内容，以及如何表述（而不涉及文档字符串内的任何标记语法）。PEP 包含约定，而非法律或语法。\"\
  \n\n虽然开发者没有必须遵循这些指南的要求，但第三方工具（如 Docutils 和 Sphinx）可能依赖它们从文档字符串中提取特性。\n\n\n\n\n与任何允许存在不同形式的标准一样，有若干团体提倡不同的版本：\n\
  \n- Google 在 https://google.github.io/styleguide/pyguide.html#Comments 中给出了其 Python\
  \ 风格指南的意见\n- numpy 在 https://github.com/numpy/numpy/blob/master/doc/HOWTO_DOCUMENT.rst.txt#docstring-standard\
  \ 提出了自己的建议\n- Epydoc 则倾向于在 http://epydoc.sourceforge.net/manual-docstring.html 使用文档字符串\n\
  \n最终，你的团队应选择一种既适合自己、也适合其用于生成文档的工具（或多种工具）的多行文档字符串语法。\n\n## 语义\n\n多行文档字符串应提供足够的信息，使感兴趣的人能够使用它所记录的对象。仅仅描述其名称和用途是不够的。潜在用户应通过阅读文档字符串了解以下内容：\n\
  \n- API\n- 输入\n- 功能\n- 输出（或各项输出）\n- 错误条件\n- 与系统其他部分的关系\n- 示例用法\n\n## API\n\n这对于类和模块很重要。模块的文档字符串应描述该模块导出的所有类、异常和函数。类的文档字符串应描述其公共接口和实例变量。描述应该简短（一行就足够了）——更详细的内容将由各个部分的文档字符串提供。\n\
  \n## 输入\n\n这些对于脚本（命令行参数和选项）和函数（参数）尤其重要。用户应能够指定完整、有效的输入，这意味着需要描述：\n\n- 输入的名称\n- 它们的类型\n\
  - 它们的取值范围\n- 可选与必需\n\n## 功能\n\n这些对于脚本和函数很重要。用户无需被过多告知用于实现结果的机制，就能理解输入与输出之间的关系。这意味着要用通俗易懂的语言描述函数的功能。如果函数实现了某个简单的数学表达式，这里是包含它的好地方。这可能是注释中最难写的一部分。\n\
  \n## 输出\n\n这些对于脚本和函数很重要。应列出输出的数量和类型。任何副作用也应加以描述。\n\n## 错误条件\n\n应列出可能导致错误的各种条件。错误分为两类：静默错误和显式错误。\n\
  \n显式错误是指导致抛出异常或设置错误码的错误。所有抛出的异常都应记录在文档中。任何用于指示错误的变量或数据结构（例如 `errno`）也应记录在文档中。\n\n\
  静默错误是指代码看似正常运行，但实际上产生了无效结果的情况。例如，许多数值算法只对一部分本来合法的输入产生有意义的结果。\n\n无论哪种情况，都应向用户提供足够的信息，以便：\n\
  \n- 避免错误条件（在可能的情况下）\n- 检测错误条件（无论是通过捕获异常还是检查错误码）\n- 从错误中恢复（例如，重试，或使用替代方法）\n\n## 与系统其他部分的关系\n\
  \n这主要对类、模块和公共接口很重要。面向对象的系统由大量相互交互的部分组成。其中一些部分位于系统内部，一些位于外部。文档字符串应描述当前部分与其他部分的关系。\n\
  \n## 文档\n\n一种重要的关系是依赖关系。一个部分可以在逻辑上（通过继承或组合）、功能上（例如，通过被导入），或时间上（也许，一个部分执行另一个部分正常运作所需的设置）依赖于另一个部分。所有依赖关系都应记录在文档中。\n\
  \n另一种重要关系是作为同一模式的一部分。设计模式正变得越来越重要，并决定了各种机制的存在。如果某个类是某个模式实现的一部分，这一点应记录在文档中。\n\n##\
  \ 示例用法\n\n尽管英文描述很有用，但几个示例仍然无可替代。在某些操作系统中，唯一有用的文档就是示例形式的。\n\n## 示例\n\n我们将从 Rosetta\
  \ Code 中选取一个例子，即中国剩余定理的 Python 实现（http://rosettacode.org/wiki/Chinese_remainder_theorem#Python）。我们的实现将做两处修改。第一，它将使用一个类，而不是展示的函数，以便能够演示完整的注释约定。第二，它将从\
  \ Python 2.7 升级到 Python 3：\n\n```\n'''Company boilerplate goes here.\n```\n\n假设\
  \ n1, ..., nk 是两两互质的正整数。那么，对于任意给定的整数序列 a1, ..., ak，存在一个整数 x 满足下面的同余方程组。\n\n```\n\
  x ≡ a1 mod n1\n\nx ≡ a2 mod n2\n\n…\n\nx ≡ ak mod nk\n```\n\n该定理的完整解释可在 https://en.wikipedia.org/wiki/Chinese_remainder_theorem\
  \ 查看。\n\n- **属性：**\n  \n  - 无\n\n**依赖项：**\n\n```\nfunctools\n\n\"\"\"\n\nimport\
  \ functools\n\nclass CRT:\n    \"\"\"The Chinese Remainder Theorem method for solving\
  \ a system of linear congruences.\n\n    This class has no __init__ method. As such,\
  \ there are no arguments required to construct an instance. Without class or instance\
  \ variables, all objects of this class are stateless.\n\n    Args:\n        None\n\
  \n    Attributes:\n        None\n\n    Example:\n        An example is provided\
  \ in the main guard corresponding to the system:\n            x ≡ 2 mod 3\n    \
  \        x ≡ 3 mod 5\n            x ≡ 2 mod 7\n    \"\"\"\n\n    def chinese_remainder(self,\
  \ n, a):\n        \"\"\"Use the existence construction form of the CRT to compute\
  \ the solution.\n\n        First, calculate the product of all the modulos (b1,\
  \ n2, ..., nk) as prod\n        For each i, calculate prod/n_i as p\n        Sum\
  \ up each ai * the multiplicative inverse of ni mod p\n\n        Args:\n       \
  \     n: a list of modulos (n1, n2, ..., nk)\n```\n\n```\na: a list of congruences\
  \ (a1, a2, ..., ak)\n\nReturns:\n    The smallest integer solution to the system\
  \ of congruence equations defined\n    by a and n.\n\nError conditions:\n    When\
  \ len(n) == len(a), a solution always exists.\n    When len(a) > len(n), any additional\
  \ a's are ignored.\n    When len(n) > len(a), behavior is deterministic but erroneous.\n\
  \    \"\"\"\n    sum = 0\n    prod = functools.reduce(lambda a, b: a*b, n)\n\n \
  \   for n_i, a_i in zip(n, a):\n        p = prod / n_i\n        sum += a_i * self.__mul_inv(p,\
  \ n_i) * p\n    return int(sum % prod)\n\ndef __mul_inv(self, a, b):\n    \"\"\"\
  Calculate the multiplicative inverse of b mod a.\"\"\"\n    b0 = b\n    x0, x1 =\
  \ 0, 1\n    if b == 1:\n        return 1\n    while a > 1:\n        q = a / b\n\
  \        a, b = b, a%b\n        x0, x1 = x1 - q * x0, x0\n    if x1 < 0:\n     \
  \   x1 += b0\n    return x1\n\nif __name__ == '__main__':\n    n = [3, 5, 7]\n```\n\
  \n```\na = [2, 3, 2]\ncrt = CRT()\nprint(crt.chinese_remainder(n, a))\n```\n\n结果如下：\n\
  \n```\nIn [22]: help(CRT)\n```\n\n```\nHelp on class CRT in module __main__:\n\n\
  class CRT(builtins.object)\n |  The Chinese Remainder Theorem method for solving\
  \ a system of linear congruences.\n |\n |  Notes:\n |      This class has no __init__\
  \ method. As such, there are no arguments required\n |      to construct an instance.\n\
  \ |\n |      Without class or instance variables, all objects of this class are\
  \ stateless.\n |\n |  Args:\n |      None\n |\n |  Attributes:\n |      None\n |\n\
  \ |  Example:\n |      An example is provided in the main guard corresponding to\
  \ the system:\n |          x = 2 mod 3\n |          x = 3 mod 5\n |          x =\
  \ 2 mod 7\n |\n |  Methods defined here:\n```\n\n| chinese_remainder(self, n, a)\n\
  |     使用 CRT 的存在性构造形式来计算解。\n|     首先，将所有模数（n1, n2, ..., nk）的乘积计算为 prod\n|     对于每个\
  \ i，将 prod/n_i 计算为 p\n|     将每个 ai 与 ni 对 p 的乘法逆元相乘后求和\n|     参数：\n|         n:\
  \ 模数列表（n1, n2, ..., nk）\n|         a: 同余式列表（a1, a2, ..., ak）\n|     返回：\n|     \
  \    由 a 和 n 所定义的同余方程组的最小整数解。\n|     错误条件：\n|         当 len(n) == len(a) 时，解总是存在。\n\
  |         当 len(a) > len(n) 时，多余的 a 会被忽略。\n|         当 len(n) > len(a) 时，行为是确定的，但结果是错误的。\n\
  |     ---------------------------------------------------------------\n| 在此定义的数据描述符：\n\
  | __dict__\n|     实例变量的字典（如果已定义）\n| __weakref__\n|     对象弱引用的列表（如果已定义）\n\n请注意，私有方法\
  \ __mul_inv 的文档字符串并未包含在内。\n\n\n\n## reStructuredText\n\n关于前面的示例，可以说很多（尤其是注释行比代码还多），但很难说最终效果在美学上是令人愉悦的。特别是与使用\
  \ Javadoc 的程序输出相比，这份文档看起来相当朴素。为了弥补这一缺陷，人们决定需要一种更精细的规范和生成文档的方式。\n\n### 历史与目标\n\n\
  Zope 的 Jim Fulton 发明了 StructuredText 作为一种简单的标记语言。它与 WikiWikiWebMarkup 类似，但更简单。规范和实现方面的问题促使\
  \ David Goodger 创建了一个修订版本，称为 reStructuredText。他为该语言设定的目标如下：\n\n- 可读\n- 不突兀\n- 无歧义\n\
  - 不令人意外\n- 直观\n- 简单\n- 可伸缩\n- 强大\n- 语言中立\n- 可扩展\n- 输出格式中立\n\n这导致了 PEP 0287（https://www.python.org/dev/peps/pep-0287/）的发布。\n\
  \n### 用户\n\n任何文档系统都有三类用户：开发人员、自动化文档生成软件和读者。它们各自有不同的需求和限制。\n\n开发人员必须编写文档。作为一个群体，开发人员讨厌打字，更讨厌输入任何不是代码的内容。任何强迫他们编写大段注释的尝试都会导致标准失败。因此，如果文档可以从代码生成，就应该如此。任何额外的注释都应该易于使用标准键盘和最少量的额外标记来创建。\n\
  \n文档生成软件将开发人员编写的文本转换成供外部读者阅读的文档。这通常包括将开发人员使用的标记语言转换为更易读的格式。例如，开发人员编写的 Javadoc 可以自动转换为读者可以在浏览器中查看的\
  \ HTML。这种转换可以同时添加美观属性（例如颜色和格式）和功能属性（例如超链接）。重要的是，对于文档生成软件而言，开发人员使用的标记必须足够强大且结构化，以支持这种转换。\n\
  \n读者阅读这种转换的最终结果。读者可能是开发人员，也可能不是，但他们期望文档在结构上组织良好。文档应该易于阅读，并且应该易于找到所需内容。请注意，读者通常无法访问原始源，即使原始标记可用，他们也可能无法阅读。\n\
  \n开发人员和读者之间的这种划分存在一种重要的紧张关系。简而言之，读者希望获得尽可能多的文档，并且以结构化的形式呈现。开发人员则会尽可能少地编写文档，并尽可能少地使用结构。\n\
  \n### 解决方案\n\nreStructuredText 采用的解决方案是使用一个两步过程：一种简单的标记语言，再加上强大的文档生成软件。标记语言是 reStructuredText，软件是\
  \ Docutils。基本过程很简单：\n\n1. 开发人员使用 reStructuredText 约定以纯文本形式编写文档字符串。\n2. 对生成的代码+注释文档应用\
  \ Docutils，以外部格式（例如 HTML 或 LaTeX）生成文档。\n3. 读者在适当的查看器中阅读生成的文档。\n\n稍后我们将介绍 Sphinx，这是一个建立在\
  \ reStructuredText 和 Docutils 之上并对其进行扩展的文档生成程序。\n\n### 概述\n\nreStructuredText 的基本语法是常规文本，并针对某些用法附带了特殊约定。这与\
  \ HTML 等语言形成对比，在 HTML 中，元数据通过尖括号与文本关联。例如，在 HTML 中，项目符号列表可能如下所示：\n\n```html\n<ul>\n\
  \  <li>Python</li>\n  <li>Java</li>\n  <li>Ruby</li>\n</ul>\n```\n\n而在 reStructuredText\
  \ 中，它看起来如下：\n\n- Python\n- Java\n- Ruby\n\n一个重要的区别是，虽然 HTML（及其近亲，如 XML）允许嵌套标签，但\
  \ reStructuredText 不允许嵌套标记。虽然这通常不是问题，但偶尔也会遇到。\n\n下面列出了一些更重要的用法。\n\n#### 段落\n\n段落是由一个或多个空行分隔的文本块。段落的左边缘应对齐。如果某个段落相对于其他段落缩进，则它被视为引用。\n\
  \nreStructuredText 如下所示：\n\n> 事实证明，亚伯拉罕·林肯从未说过\n>\n> 永远不要相信你在互联网上读到的任何东西。\n>\n>\
  \ 那是本杰明·富兰克林说的\n\n这产生的 HTML 输出显示如下：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_310_0.png)\n\
  \n#### 文本样式\n\n斜体文本应使用星号（*）括起来：\n\n```\nUse italics for *emphasis*.\n```\n\n粗体文本使用两个星号（**）：\n\
  \n```\nUsing a **goto** statement is a bold move in structured programming.\n```\n\
  \n遗憾的是，没有简单的方法使文本同时变成斜体和粗体。\n\n在大多数情况下，reStructuredText 很聪明，知道什么时候是标记，什么时候应该原样保留。例如，考虑这些字符串：\n\
  \n```\nx = 5*6\nx = 5*6*7\n```\n\n星号不会被解释为将 6 变为斜体。\n\n用双反引号（``）包围文本会强制其成为等宽字面量——引号之间的所有特殊字符都保持原样，不被解释。否则会被解释为标记的单个字符可以使用反斜杠（\\\
  ）进行转义。\n\n#### 字面量块\n\n如果需要将整个段落作为字面量块（即完全按原样，不解释段落中的标记字符或缩进），那么一个只包含两个冒号的段落表示后面的缩进或引用文本应按字面量处理。这在引用代码或解释标记约定时非常有用。\n\
  \n它产生的网页如下：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_312_0.png)\n\n#### 项目符号列表\n\
  \n项目符号列表的工作方式与枚举列表类似，除了：\n\n- 唯一允许的项目符号是 -、+ 和 *\n- 没有分隔符\n\n项目符号列表支持常见的缩进规则。\n\n\
  #### 定义列表\n\n定义列表只是一系列术语-定义对。术语在第一行，定义在随后的缩进段落中。下面是一个示例：\n\n```\ndo\n    a deer,\
  \ a female deer\nre\n    a drop of golden sun\nmi\n    a name i call myself\nfa\n\
  ```\n\n它产生的网页如下：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_314_0.png)\n\n####\
  \ 章节\n\n上述标记对于大多数开发人员、大多数文档来说应该足够了。如果需要更深入的文档，reStructuredText 提供了使用章节标题将文档划分为章节的能力。这是通过创建一行完全由单个重复字符（下划线）组成的文本实现的。前一行成为章节标题（上划线）。下划线和上划线必须长度相同。所有使用相同下划线的章节处于同一级别。位于使用不同下划线的章节下方的任何章节都比该章节低一级。\n\
  \n下面是一个示例：\n\n```\nChapter 1 Main Title\n--------------------\n\nSection 1.1 An\
  \ Important Subject\n```\n\n## Docutils\n\nDocutils 是一套工具，用于将包含 reStructuredText\
  \ 的文本文件转换为其他格式，包括 HTML、XML 和 LaTeX。它旨在弥合用户想要阅读的内容（美观的格式）与程序员容易输入的内容（纯文本）之间的差距。Docutils\
  \ 分为两大类：库（用于后台解析和操作）和前端工具（使用库生成特定输出格式）。\n\n### 安装\n\n可以使用 pip 安装 Docutils：\n\n```\n\
  pip install docutils\n```\n\n这将安装许多脚本，包括重要的转换脚本。作者的安装中包括以下脚本：\n\n- `rst2html.py`\n\
  - `rst2latex.py`\n- `rst2man.py`\n- `rst2odt_prepstyles.py`\n- `rst2odt.py`\n- `rst2pseudoxml.py`\n\
  - `rst2s5.py`\n- `rst2xetex.py`\n- `rst2xml.py`\n- `rstpep2html.py`\n\n### 用法\n\n\
  这些脚本可以在命令行中使用。它们从 `stdin` 读取输入，并将输出写到 `stdout`：\n\n```\n./rst2html.py <infile> >\
  \ <outfile>\n```\n\n\n\n## 为源文件编写文档\n\n遗憾的是，与 Javadoc 不同，Docutils 无法接受包含大量 Python\
  \ 代码的 .py 文件，并自动从中提取文档字符串以生成文档。有一个名为 Epydoc 的工具可以做到这一点，但该项目自 2009 年以来一直处于不活跃状态。团队可以编写脚本来尝试仅提取文档字符串，但还有更好的解决方案。这将在下一节中概述。\n\
  \n## Sphinx\n\nSphinx 是一个文档生成工具。它最初用于生成 Python 文档，但目前已扩展到其他语言，尤其是 C/C++。它可以生成多种格式的输出，包括\
  \ HTML、LaTeX、ePub、man 页面和纯文本等。它接受 reStructuredText，并在 Docutils 套件的基础上构建，同时添加了一些标记。\n\
  \n## 安装与启动\n\n可以使用 `pip` 安装 Sphinx：\n\n```\npip install sphinx\n```\n\n安装完成后，会将多个脚本添加到路径中。我们要介绍的第一个脚本是\
  \ `sphinx-quickstart`。它会提示用户输入信息，然后创建源目录、配置文件和某些骨架文件：\n\n```\nbash-4.1$ sphinx-quickstart\n\
  Welcome to the Sphinx 1.3.6 quickstart utility.\n\nPlease enter values for the following\
  \ settings (just press Enter to accept a default value, if one is given in brackets).\n\
  \nEnter the root path for documentation.\n> Root path for the documentation [.]\
  \ : docs\n\nYou have two options for placing the build directory for Sphinx output.\n\
  Either, you use a directory \"_build\" within the root path, or you separate\n\"\
  source\" and \"build\" directories within the root path.\n```\n\n## 文档\n\n这将生成如下页面：\n\
  \n![](img/8628b86fcc4f22d859c0104c2ec1d15f_324_0.png)\n\n页面中缺少对 `chinese_remainder`\
  \ 方法的文档，因此可以使用 automethod 指令将其添加到 `index.rst` 中：\n\n```rst\n.. toctree::\n   :maxdepth:\
  \ 2\n\n.. automodule:: crt1\n```\n\n虽然这样很灵活，但可能繁琐且容易出错。一种解决方案是使用 `:members:` 属性，如下所示：\n\
  \n```\n    .. toctree::\n       :maxdepth: 2\n\n    .. automodule:: crt1\n     \
  \  :members:\n```\n\n另一种方法是使用 `sphinx-apidoc` 工具。`sphinx-apidoc` 的作用是从源文件中提取文档字符串，并根据它们生成\
  \ `.rst` 文件。请参考以下示例：\n\n```\nbash-4.1$ sphinx-apidoc -o docs .\n```\n\n它会生成一组 `.rst`\
  \ 文件：\n\n```\nCreating file docs/code1.rst.\nCreating file docs/code2.rst.\nCreating\
  \ file docs/crt1.rst.\nCreating file docs/hail1.rst.\nCreating file docs/modules.rst.\n\
  ```\n\n这些文件本身没什么可看的，但它们可以输入到 Sphinx 或其他期望 reStructuredText 的文档工具中，以进行进一步处理。当使用本身无法提取文档字符串的工具时，这一点尤其方便。\n\
  \n## 总结\n\n虽然内联注释和类型标注对于将在代码库上工作的开发人员很有用，但外部人员需要更全面的文档，并且需要一种比阅读源代码更具吸引力的格式（尤其是当他们无法访问源代码时）。对文档的需求必须与开发人员可以理解的、不愿花费大量时间和精力去编写代码以外任何东西的心理相平衡。\n\
  \nPython 的解决方案是采用轻量级标记语言 reStructuredText 和工具链（Docutils、Sphinx），将 reStructuredText\
  \ 转换为外观更精美的格式（例如 HTML 或 LaTeX）。\n\n第 3 章“迈入 IPython 进行并行计算”提供了一些细节，说明如何拆分内核和 REPL\
  \ 协议，从而使并行架构得以出现。\n\n本章将提供一些示例，展示 notebook 的强大功能，以及它与其他组件的关系。从 IPython notebook\
  \ 到 Jupyter 项目的转变可能是最大的一次重组，被称为“大分裂”（The Big Split）。如需深入探讨“大分裂”的原因及其对各种包结构的影响，请参阅\
  \ https://blog.jupyter.org/2015/04/15/the-big-split/。\n\n## 安装与启动\n\nJupyter 可以使用\
  \ pip 安装：\n\n```\npip install jupyter\n```\n\n可以像这样启动：\n\n```\n(my_rpy2_zone)-bash-4.1$\
  \ ipython notebook\n[I 10:38:27.193 NotebookApp] Serving notebooks from local directory:\
  \ /nfs/02/wit0096\n[I 10:38:27.193 NotebookApp] 0 active kernels\n[I 10:38:27.193\
  \ NotebookApp] The Jupyter Notebook is running at: http://localhost:8888/\n[I 10:38:27.193\
  \ NotebookApp] Use Control-C to stop this server and shut down all kernels (twice\
  \ to skip confirmation).\n/usr/bin/xdg-open: line 402: htmlview: command not found\n\
  console.error:\n  [CustomizableUI]\n  Custom widget with id loop-button does not\
  \ return a valid node\nconsole.error:\n  [CustomizableUI]\n  Custom widget with\
  \ id loop-button does not return a valid node\n1457711201438  addons.update-checker\
  \  WARN  Update manifest for {972ce4c6-7e08-4474-a285-3208198ce6fd} did not contain\
  \ an updates property\n```\n\n注意，这会在 8888 端口启动一个 HTML 服务器（称为 Jupyter Notebook 应用）。它可能还会（取决于你的平台）启动指向\
  \ http://localhost:8888 的浏览器。如果没有，请手动启动浏览器并指向该地址。Jupyter 只能访问其启动目录（及其子目录）中的文件，因此请务必在其能够访问你的\
  \ notebook 文件的位置启动它。\n\n## 创建 notebook\n\n当然，没有人会用 JSON 编写 notebook——它只是用作持久化和交换的文本格式。可以使用仪表盘（Dashboard）创建\
  \ notebook。在界面的右上部分有一个下拉框，提供创建新 notebook 的选项：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_336_0.png)\n\
  \n## 使用 matplotlib\n\n在 notebook 中使用 matplotlib 的关键是 `%matplotlib inline` 魔术命令。它应该是单元格中的第一行。例如：\n\
  \n![](img/8628b86fcc4f22d859c0104c2ec1d15f_344_0.png)\n\n第一个单元格（打印 **图形很有趣**）是 Markdown；第二个单元格创建了所示图表。\n\
  \n## 使用 R\n\n使用 R 时，重要的是所有工作都应在 R 中完成（或者至少是实际显示图表的部分）。否则，图表将在单独的窗口中打开，而不是在 notebook\
  \ 中。%%R 单元格魔术是完成这项工作的正确工具。特别是，应该打印图表，而不是使用 plot( ) 函数。例如：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_346_0.png)\n\
  \nIPython 不是这样的系统。2001 年，Fernando Perez 是科罗拉多大学博尔德分校的一名研究生。他不是计算机科学专业，而是一名需要编程并希望有更好工具的物理学研究生。作为一名物理学家，他对“更好”的想法与计算机科学家可能设想的不同。特别是，对早期\
  \ IPython 形成影响的是主要为数据分析和展示而设计的工具：Mathematica (http://www.wolfram.com/mathematica/)\
  \ 和 Sage (http://www.sagemath.org/)。\n\nPerez 曾表示，IPython“旨在成为一个高度可配置的工具，用于构建针对特定问题的交互式环境”，这为其历史和未来方向提供了一把钥匙。\n\
  \n最初的努力从两个方向入手。一方面，当时已经存在几个 Python 扩展——IPP（由 Janko Hauser 开发）和 LazyPython（由 Nathan\
  \ Gray 开发）。另一方面，Perez 对自己应该实现什么有自己的想法。最终，IPython 诞生于 IPP、LazyPython 和 Perez 自己努力的代码合并。\n\
  \n此时开发速度放缓了。有人尝试过制作 notebook。也曾考虑过与 Sage 合并，但最终项目各自发展。2009 年，第一位全职开发者获得了资助。他的第一项任务是重构整个代码库，当时它仍然是\
  \ IPP、LazyPython 和 Perez 原始代码的大杂烩。虽然没有添加新功能，但在此后干净整洁的代码上，开发可以更容易地推进。\n\n2010 年是重要的一年。第一个重大发展是转向基于\
  \ ZeroMQ 的架构。采用 ZeroMQ 带来了两项重要的架构进步：前端与解释器的分离，以及对并行性的支持。\n\n分离前端和后端在多个方面意义重大。也许最重要的是，这意味着实现\
  \ notebook 变得更简单：Notebook 只是后端 Python 内核的另一个接口。另一方面，命令行界面可以自由连接到支持任何语言（不仅仅是 Python）的内核。IPython\
  \ 正从“一个更好的 Python shell”转变为“一个多接口、多语言的平台”。此时工作进展迅速：2010 年剩余时间里，开发了命令行界面、Qt 控制台、与\
  \ Visual Studio 的 Python 工具集成，以及一个 Web notebook 原型。2011 年，该原型变成了完全可用的版本，IPython\
  \ 0.12 发布。\n\n\n\n\n"
- '# Notebook


  Jupyter Notebook 是造成这次重大分裂的主要原因。回顾 IPython 4.0 之前各版本的发行说明，可以清楚地看出，许多改进针对的是 Notebook
  组件，而非 Python 专属功能，甚至也不是底层架构。


  Notebook 本身规模庞大，拥有自己的子项目：


  - 文档格式（及其 API，nbformat）

  - nbconvert

  - nbviewer


  Notebook 的主要功能是显示信息——计算则交由内核完成——因此这一层似乎不太可能出现兼容性问题。不过，Notebook 提供的功能不止信息显示，而且功能还在不断增加，因此兼容性问题仍有可能出现。


  # 控制台


  控制台是一种命令行界面，可以与遵循 Jupyter 交互式计算协议的任何内核通信。目前尚不清楚，既然 IPython 的终端如今已与语言无关，为何还需要一种新的终端界面，而不直接使用
  IPython 的终端。从用户的角度来看，它们看起来确实一样。实际上，它们可能是同一个东西，只是将一些 IPython 专属代码替换成了与 Jupyter 兼容的代码。文档说明了如何启动和使用控制台，却没有解释它与
  IPython 的关系（如果存在这种关系的话）。快速搜索网络也无济于事，甚至有些网站声称控制台就是新版 IPython。


  # Jupyter 客户端


  Jupyter Client 包是一个 Python API，用于启动、管理内核并与之通信。IPython 的内核也遵循这一标准。它规定了所有内核必须遵循的消息传递协议，以便与
  Notebook 通信。作为 Jupyter 的参考内核，IPython 内核必定会继续遵循这一规范。

  '
- "# Jupyter 的未来\n\n尽管 Fernando Perez 是*终身仁慈独裁者*，并且 Jupyter 设有一个由 10 名成员组成的指导委员会，但\
  \ Jupyter 是一个采用修订版 BSD 许可证的开源项目。因此，并不存在权威的待办事项清单，取而代之的是不同程度的“官方”规划。\n\n## 官方路线图\n\
  \n第一层是 Jupyter GitHub 站点上的主要子项目：`https://github.com/jupyter`。高层次路线图位于 `https://github.com/jupyter/roadmap`。下表列出了一些重点：\n\
  \n| 功能 | 描述 | 详情 |\n|---|---|---|\n| **JupyterLab** | 最初是在现有 Notebook Web 应用中新增的一个页面，允许在同一个浏览器标签页中使用多个插件\
  \ | 有望取代当前的 Notebook 界面。这是一个大型项目。 |\n| **ipywidgets** | 交互式组件，可将内核中的代码与浏览器中的 JavaScript/CSS/HTML\
  \ 联系起来 | 改进样式。全面重构。将 JavaScript 模块化。 |\n| **JupyterHub** | 管理并代理多个单用户 Jupyter Notebook\
  \ 服务器实例 | 改进配置。支持共享与协作。 |\n| **IPython** |  | 相对成熟，因此计划中的重大变更很少。 |\n\n更具体的事项则包括\
  \ **Issues** 标签下列出的错误，以及 **Pulls** 标签下的新功能。\n\n接下来似乎是 **Jupyter 增强提案（JEP）**（`https://github.com/jupyter/enhancement-proposals`）。根据文档（`http://jupyter.readthedocs.org/en/latest/contrib_guide_bugs_enh.html`），这类提案与错误请求类似：提交者希望由其他人来完成相关工作。目前，该站点上只有四项增强提案，也有四个拉取请求，但它们似乎都不是路线图中的重点内容。\n\
  \n难点在于，这些工具各自为政。知道何时该用哪种工具，以及如何使用，更像是一门艺术，而非一门科学。这种情况类似于汇编语言时代的末期：有些开发者能用这些工具做出令人惊叹的成果，但这样的人并不多；而且，显而易见，仅靠持续的临时性进展已不足以应对挑战。\n\
  \n# 更好的工具\n\n另一种方法是为程序员提供更好的工具，增强他们的能力。这种方法与务实的演进方法相辅相成：新技术往往需要新工具才能更容易地使用，而新工具也能推动新技术的发展。《重大挑战》论文中有多个章节专门讨论工具。论文特别提到了几种工具，包括编译器、调试器和开发环境。\n\
  \nIPython 在这一方法上可谓一只脚稳稳地踏入其中。使用 IPython（配合 Python），就意味着牺牲一定的性能，以换取其他优势：高层次抽象、多语言支持、友好的\
  \ IDE，以及本书详述的其他所有功能。从某种意义上说，这是一场押注——运行 IPython 所耗费的计算周期，所换来的收益将超过使用效率较低的最终产品所损失的部分。考虑到工具的强大与否，往往决定了能否做出可用的产品，这看起来是一场稳妥的押注。\n\
  \n如果把 IPython 看作交互式并行计算工具，那么它的未来似乎有保障，尽管具体前景尚不明朗。说它有保障，是因为随着新技术不断涌现，IPython（以及整个\
  \ Jupyter 组织）完全有条件将这些技术整合进自身。说它不明朗，则是因为没人知道未来会出现哪些新技术。\n\n由于并行计算仍在持续发展，学习 IPython\
  \ 并不是背下一些语法、做几道编程练习就能完成的事。未来几十年里，IPython 将不断发展演进，开发者不仅需要采用新版本的工具，还需要定期更新自己对这一领域的认知。\n\
  \n# 下一个重大创意\n\n通过不断演进新技术并改进工具，社区或许能够找到一个令人满意的并行系统开发框架。然而，如果历史经验可以作为参考，我们仍然需要一种全新的范式（类似于从手写汇编代码转向编译高级语言），才能实现突破。\n\
  \n以巴黎圣母院为例。概括而言，它听起来很像一个软件项目：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_366_0.png)\n\
  \n图片来源：https://commons.wikimedia.org/wiki/File:Notre_Dame_dalla_Senna.jpg\n\n巴黎圣母院历时约\
  \ 182 年建成（公元 1163 年至约 1345 年），期间至少更换过四位建筑师。尽管工程一直在进行，它从建成初期起便持续投入使用。虽然最初有整体规划，但随着施工困难暴露出新的需求，一些重要特征（包括著名的飞扶壁）也在后续逐步增建。这是一项非凡的工程成就。\n\
  \n更令人惊叹的是，从某种非常现实的意义上说，参与其中的人其实都不真正明白自己在做什么。直到近 350 年后的牛顿时代，人们才理解那些能够证明建筑设计决策合理性的基本物理定律。在牛顿之前，所有建筑知识都来自反复试验：墙体厚度、建筑高度、承重能力、拱门的高度和宽度，以及其他所有结构参数，都是依据以往实验的累积结果和建筑师自身的判断来决定的。\n\
  \n这并不意味着他们的决策是错误的——显然，他们能够建造出规模相当大、结构稳固且美观的建筑。但这意味着他们能做到的事情有严格的限度。建筑规模越大，可供借鉴的先例就越少，失败的代价也越高。\n\
  \n面向大规模并行计算机的软件开发也面临同样的问题。我们在构建规模较小的并行系统方面积累了丰富经验，在并行度更高的系统方面也有一些经验，但问题和失败代价都在不断增大。这个领域需要类似《自然哲学的数学原理》（Principia）的成果——一套统一的并行编程理论。我们需要下一个重大创意。\n\
  \n在下一个重大创意出现之前，科学软件开发社区可以借鉴软件工程领域的一些实践来推动发展。\n\n# 提升专业化水平\n\n> “科学家建造，是为了学习；工程师学习，是为了建造。”\n\
  >\n> — Fred Brooks\n\n科学家和工程师的工作各不相同。科学家致力于扩展知识，工程师则致力于应用知识。科学家建造某样东西，是为了获得所需的知识；一旦获得这些知识，这个东西的使命便告结束。工程师建造某样东西，则是为了应用知识，而让它长期发挥作用正是其目的。\n\
  \n许多科学软件都是由科学家为科学研究而编写的。因此，一旦从软件中提取出预期的知识，它往往就会被视为可以弃用，这并不令人意外。虽然这种做法能够立即取得成果，但该领域中其他同样希望使用这些软件的研究人员，往往会发现它们难以使用、维护和扩展。\n\
