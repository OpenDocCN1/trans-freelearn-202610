  \ 确实返回了一个值，情况也好不了多少。首先，不清楚它能返回什么有意义的值。也许返回 true 表示“成功”，返回 false 表示“失败”？至少可以测试那个值。然而，这并不能解决根本问题——也许\
  \ display 返回了 true，但字符实际上并没有被显示。\n\n从这段简短离题话中得到的启示是，当被测代码的编写方式使得编写有意义的测试更容易时，测试的效果更好。这样做的技巧可以写满一整本书（也确实如此）。幸运的是，科学和工程代码重视数学建模，往往自然地分解为可测试的函数。\n"
- "## unittest\n\nunittest 是 Python 内置（自 2.1 版本起）的测试框架。它仿照优秀的 Java JUnit 框架以及一般的 xUnit\
  \ 测试框架而设计。这造就了一种简洁、面向对象的风格。\n\n### 重要概念\n\nunittest 以直接的方式支持标准的单元测试组成部分。以下概念与功能元素相对应：\n\
  \n- **测试用例：** 这是一个单独的测试或一组测试。一个测试用例中的所有测试都属于同一个类，并共享一个夹具（fixture）。\n- **测试夹具：**\
  \ 为一个类中的所有测试用例执行 setUp 和 tearDown 所需的函数。\n- **测试套件：** 这是测试用例的集合。测试套件中的测试用例旨在一起运行。\n\
  - **测试运行器：** 这是一个运行测试套件并向用户报告结果的组件。\n\n让我们更仔细地看前面的一些代码作为示例：\n\n```\ndef F(n):\n\
  \    curr = n\n    tmp = 1\n    while curr != 1:\n        tmp = tmp + 1\n      \
  \  if curr % 2 == 1:\n```\n\n```\n244      self.result = testRunner.run(self.test)\n\
  245      if self.exit:\n--> 246      sys.exit(not self.result.wasSuccessful())\n\
  247\n248 main = TestProgram\n\nSystemExit: True\n```\n\n在这种情况下，这并不是很有趣，但如果有需要，信息就在那里。\n\
  \n一个小修复应该能解决这个问题：\n\n```\ndef f(n):\n    curr = n\n    tmp = 0\n    while curr !=\
  \ 1:\n        tmp = tmp + 1\n        if curr % 2 == 1:\n            curr = 3 * curr\
  \ + 1\n        else:\n            curr = curr/2\n    return tmp\n```\n\nhail2.py\n\
  \n同时相应修改测试（通常只需修改原始源代码，但为了教学目的，这样更清晰）：\n\n```\nimport unittest\nfrom hail2 import\
  \ f\n\nclass TestHailStones(unittest.TestCase):\n\n    def test_f(self):\n     \
  \   ans = [0, 0, 1, 7, 2, 5, 8, 16, 3, 19, 6]\n        for i in range(1, 11):\n\
  \            print(i)\n            self.assertEqual(f(i), ans[i])\n\nif __name__\
  \ == '__main__':\n    unittest.main()\n```\n\ntest2.py\n\n输出将变为以下内容：\n\n```\nIn\
  \ [2]: %run testrand.py\nDoing setUp\nDoing test_bad\nDoing tearDown\nDoing setUp\n\
  Doing test_better\nDoing tearDown\n.Doing setUp\nDoing test_builtin\nDoing tearDown\n\
  .\n======================================================================\nFAIL:\
  \ test_bad (__main__.TestRandoms)\n----------------------------------------------------------------------\n\
  Traceback (most recent call last):\n  File \"/nfs/02/wit0096/Packt/chap08/testrand.py\"\
  , line 29, in test_bad\n    self.assertGreater(p, 0.05)\nAssertionError: 3.5277031043732684e-204\
  \ not greater than 0.05\n----------------------------------------------------------------------\n\
  Ran 3 tests in 0.171s\n\nFAILED (failures=1)\nAn exception has occurred, use %tb\
  \ to see the full traceback.\n\nSystemExit: True\n```\n\n关于整个程序，有一些值得指出的地方：\n\n\
  - 代码包含多个测试。无需将它们标记为测试，因为 unittest 假定每个以 test 开头的函数都是测试，并会将其作为测试运行。\n\n```\nDoing\
  \ tearDown\n.Doing setUp\nDoing test_better\nDoing tearDown\n.Doing setUp\nDoing\
  \ test_builtin\nDoing tearDown\n.\n------------------------------------------------------------\n\
  Ran 3 tests in 0.227s\n\nOK\n```\n\n### 装饰器\n\n对一个测试使用 `assertLess`，对另一个测试使用 `assertGreater`\
  \ 有点笨拙。这种小的不一致很容易被忽视，从而在以后导致更大的问题。更糟糕的是，它可能会被发现并“纠正”，但纠正反而会导致测试失败，并让人困惑地站在那里，想不明白当初为什么要那样写。\n\
  \n这种事情经常发生，尤其是当测试不是先于代码编写时。\n\n> **测试驱动开发**\n>\n> **测试驱动开发（TDD）** 是一种软件开发过程，在这种过程中，测试先于代码编写。这个过程允许测试用作自动化手段，用来检查代码是否满足（至少部分）需求。测试还可以用来确保将来对代码的修改不会破坏任何已有的功能。\n\
  \n理论上，在代码被接受之前，所有测试都应该运行并通过。但这并不总是可行的。为此，unittest 提供了装饰器，允许测试人员显式标记失败和跳过的测试。\n\n\
  例如，我们之前的测试可以如下进行装饰：\n\n```\n@unittest.expectedFailure\ndef test_bad(self):\n   \
  \ print(\"Doing test_bad\")\n    x0 = 15\n    p1 = 50\n```\n\n\n\n从命令行调用它非常容易：\n\
  \n```\n(my_rpy2_zone)-bash-4.1$ py.test\n=======================================\
  \ test session starts ===\n========================================\nplatform linux\
  \ -- Python 3.4.4, pytest-2.8.7, py-1.4.31, pluggy-0.3.1\nrootdir: .../chap08, inifile:\n\
  collected 0 items\n\n======================================= no tests ran in 0.03\
  \ seconds ========================================\n```\n\npytest 会尝试根据将在后面章节介绍的规则自动定位测试。在这种情况下，没有找到任何测试。\n\
  \n## 向后兼容性\n\n把之前章节中对测试所做的所有工作都丢弃似乎很可惜。pytest 会在形如 test_*.py（和 *_test.py）的文件中查找测试。最懒的做法就是直接把\
  \ test1.py 复制成 test_1.py 看看会发生什么：\n\n```\n(my_rpy2_zone)-bash-4.1$ cp test1.py test_1.py\n\
  (my_rpy2_zone)-bash-4.1$ py.test\n======================================= test session\
  \ starts ===\n========================================\nplatform linux -- Python\
  \ 3.4.4, pytest-2.8.7, py-1.4.31, pluggy-0.3.1\nrootdir: .../chap08, inifile:\n\
  collected 1 items\n\ntest_1.py F\n\n======================================= FAILURES\
  \ =========\n========================================\n________________________________________\
  \ TestHailStones.test_f ________________________________________\n\nself = <test_1.TestHailStones\
  \ testMethod=test_f>\n\n    def test_f(self):\n```\n\n- `recurse` 进入目录，除非它们匹配 `norecursedirs`。\n\
