  \n这将导致对图表的更改被延迟到调用 plot( ) 时，届时它们会同时发生。\n\n## Bokeh\n\nBokeh 是一个 Python 交互式可视化库，面向现代\
  \ Web 浏览器进行呈现。其目标是提供以 D3.js 风格优雅、简洁地构建新颖图形，并将这一能力扩展到对超大规模或流式数据集的高性能交互。Bokeh 可以帮助任何希望快速轻松创建交互式绘图、仪表盘和数据应用程序的人。\n\
  \n就我们的目的而言，Bokeh 可用于生成将在 Web 浏览器中查看的图形。虽然以这种方式使用时，它不支持像 Matplotlib 那样的命令行交互性，但生成持久图像并易于远程查看的能力对于报告等目的非常重要。此外，Bokeh\
  \ 使用 HTML、JavaScript 和 CSS 生成网页的能力意味着图形本身可以像这些工具所能实现的那样具有交互性。\n\n使用 Bokeh 服务器时支持命令行驱动的交互式方法，但这超出了当前章节的范围。\n\
  \n## 启动 Bokeh\n\n可以使用 pip 将 Bokeh 作为标准 IPython 模块安装：\n\n```\npip install bokeh\n\
