- "## 使用 rpy2.robjects\n\nrpy2 可以作为标准模块导入，并从 IPython 的命令行中使用。有多种使用方式，开发者也可以基于 rpy2.interface\
  \ 构建自己的使用方式。rpy2.robjects 模块是进行常规开发时的一种常用选择。\n\n### 基础知识\n\n导入 rpy2.robjects 模块时，会加载一个单例对象\
  \ r。这是 R 进程的入口点。下面是一个示例：\n\n```python\nIn [5]: import rpy2.robjects as robjects\n\
  \nIn [6]: robjects.r\nOut[6]: <rpy2.robjects.R at 0x2ad3d0960a90>\n```\n\nR 会话中的元素可以作为\
  \ robjects.r 对象的属性访问：\n\n```python\nIn [7]: robjects.r.mtcars\nOut[7]:\n<DataFrame\
  \ - Python:0x2ad3d0dfd6c8 / R:0x262cef0>\n[Float..., Float..., Float..., ..., Float...,\
  \ Float..., Float...]\n  mpg: <class 'rpy2.robjects.vectors.FloatVector'>\n    <FloatVector\
  \ - Python:0x2ad3d0dfdb08 / R:0x2daf890>\n[21.000000, 21.000000, 22.800000, ...,\
  \ 19.700000, 15.000000, 21.400000]\n  cyl: <class 'rpy2.robjects.vectors.FloatVector'>\n\
  \    <FloatVector - Python:0x2ad3d0e03488 / R:0x345abaa0>\n[6.000000, 6.000000,\
  \ 4.000000, ..., 6.000000, 8.000000, 4.000000]\n  disp: <class 'rpy2.robjects.vectors.FloatVector'>\n\
  \    <FloatVector - Python:0x2ad3d0e03988 / R:0x33ed340>\n[160.000000, 160.000000,\
  \ 108.000000, ..., 145.000000, 301.000000, 121.000000]\n  ...\n  mpg: <class 'rpy2.robjects.vectors.FloatVector'>\n\
  \    <FloatVector - Python:0x2ad3d0e03fc8 / R:0x38dfd40>\n[1.000000, 1.000000, 1.000000,\
  \ ..., 1.000000, 1.000000, 1.000000]\n  cyl: <class 'rpy2.robjects.vectors.FloatVector'>\n\
  \    <FloatVector - Python:0x2ad3d0e06508 / R:0x2847ca0>\n\n[4.000000, 4.000000,\
  \ 4.000000, ..., 5.000000, 5.000000, 4.000000]\n\ndisp: <class 'rpy2.robjects.vectors.FloatVector'>\n\
  \n<FloatVector - Python:0x2ad3d30e06a08 / R:0x3bc0b60>\n\n[4.000000, 4.000000, 1.000000,\
  \ ..., 6.000000, 8.000000, 2.000000]\n```\n\n在大多数情况下，使用 Rmagic 可以完成的操作，都可以通过 robjects.r\
  \ 完成：\n\n```python\nIn [18]: %R\n\n   ....: letters\n   ....:\n\n[1] \"a\" \"b\"\
  \ \"c\" \"d\" \"e\" \"f\" \"g\" \"h\" \"i\" \"j\" \"k\" \"l\" \"m\" \"n\" \"o\"\
  \ \"p\" \"q\"\n[1] \"r\" \"s\"\n[20] \"t\" \"u\" \"v\" \"w\" \"x\" \"y\" \"z\"\n\
  ```\n\n```python\nIn [19]: robjects.r.letters\n\nOut[19]:\n\n<StrVector - Python:0x2ad3d8887f48\
  \ / R:0x4735690>\n['a', 'b', 'c', ..., 'x', 'y', 'z']\n```\n\n不过，两者并不完全对应。下面尝试访问\
  \ mtcars 数据框中的 wt 列时，就可以说明这一点：\n\n```python\nIn [8]: robjects.r.mtcars$mpg\n   File\
  \ \"<ipython-input-8-d46a62a01451>\", line 1\n     robjects.r.mtcars$mpg\n     \
  \                 ^\nSyntaxError: invalid syntax\n```\n\n此时需要使用数值索引：\n\n```python\n\
  In [17]: robjects.r.mtcars[5]\n\nOut[17]:\n\n<FloatVector - Python:0x2ad3d887efc8\
  \ / R:0x31b0650>\n[2.620000, 2.875000, 2.320000, ..., 2.770000, 3.570000, 2.780000]\n\
  ```\n\n我们求出特征值和特征向量：\n\n```python\nIn [13]: %octave mat = [1 2 3; 4 5 6; 7 8 9];\
  \ [vect, vals] = eig(mat)\n\nvect =\n\n   -0.231971  -0.785830   0.408248\n   -0.525322\
  \  -0.086751  -0.816497\n   -0.818673   0.612328   0.408248\n\nvals =\n\nDiagonal\
  \ Matrix\n\n    1.6117e+01             0             0\n             0   -1.1168e+00\
  \             0\n             0             0   -1.3037e-15\n```\n\n## 容易混淆的问题\n\
  \n请注意，这里的语法和语义可能比较棘手。Octave 语言中 `eig` 函数的定义规定了以下行为：\n\n-   `lambda = eig(A)` 返回\
  \ A 的特征值，并将其存储在向量 lambda 中。\n-   `[V, lambda] = eig(A)` 还会在 V 中返回特征向量，但此时 lambda\
  \ 是一个矩阵，其对角线包含特征值。以下关系成立（存在舍入误差）：`A = V*lambda*inv(V)`。\n\n`[a, b]` 表示法和多个返回值无法无缝转换到\
  \ IPython 中。\n\n因此，下面的代码在一定程度上能够按预期工作（人们自然也会认为 x 应该是一个包含两个元素的向量）：\n\n```python\n\
  In [14]: x = %octave mat = [1 2 3; 4 5 6; 7 8 9]; eig(mat)\n\nans =\n\n    1.6117e+01\n\
  \   -1.1168e+00\n   -1.3037e-15\n\nIn [15]: x\n```\n\n## “一带一路”倡议下中国中小企业国际电子商务平台可行性研究\n\
  \n**冯宇**  \n北京交通大学经济管理学院，中国北京  \n电子邮箱：fengyu@bjtu.edu.cn\n\n*本文分析了“一带一路”倡议下中国中小企业开展国际电子商务的可行性和战略路径。在分析当前形势与现存问题的基础上，本文提出了合作型电子商务平台框架，并探讨了成功的关键因素。*\n\
  \n**关键词：**“一带一路”倡议；中小企业；国际电子商务；可行性研究；合作型平台\n\n### 1. 引言\n\n随着“一带一路”倡议的持续推进，中国中小企业正面临拓展国际市场的新机遇。然而，由于资源有限且缺乏经验，这些企业在跨境电子商务领域往往会遇到困难。本研究旨在探讨建立一个符合中国中小企业需求的国际电子商务平台的可行性。\n\
  \n作为一种新兴商业模式，国际电子商务可以帮助中小企业克服地理障碍、降低交易成本并改善市场准入。“一带一路”沿线国家的发展为此类平台提供了有利的政策环境和市场需求。\n\
  \n### 2. 文献综述\n\n现有研究已经广泛考察了中小企业对电子商务的采用、“一带一路”倡议对贸易的影响，以及跨境平台的设计。然而，很少有研究关注这两个主题的结合。本文通过同时研究宏观层面的政策支持和微观层面的企业需求，填补了这一空白。\n\
  \n- 宏观层面：政策协调、基础设施互联互通、贸易便利化\n- 微观层面：中小企业能力、技术采用、物流整合\n- 平台层面：商业模式、服务生态系统、风险管理\n\
  \n### 3. 可行性分析\n\n本节从政策、市场、技术和资本等角度评估拟议平台的可行性。结果表明，尽管存在挑战，但在“一带一路”背景下，建立国际电子商务平台的整体环境是有利的。\n\
  \n```text\nretval = quad(\"myFunc\", 0, pi)\ndisp(\"hello\")\nendfunction\n\nfunction\
  \ y = myFunc(x)\n    y = sin(x) * sqrt(abs(cos(x)))\nendfunction\n```\n\n我们可以使用以下\
  \ IPython 命令来运行它：\n\n```python\nIn [1]: from oct2py import octave\n\nIn [2]: octave.addpath(\"\
  /nfs/02/wit0096/Packt/chap06/\")\n\nIn [3]: octave.myIntegrate( )\nOut[3]: 1.3333333333333326\n\
  ```\n\n这样就可以轻松地对复杂函数进行积分。\n\n## Hy\n\n有时，只有函数式编程语言才能满足需求。在机器学习和人工智能领域尤其如此，因为 Lisp\
  \ 和 Scheme 在这些领域拥有悠久的传统。Hy 是 Lisp 的一种方言，可以将表达式转换为 Python 的抽象语法树格式。\n\n抽象语法树是对程序结构的高级表示，与源代码无关。Python\
  \ 解析器会将所有 Python 程序转换为抽象语法树，之后解释器会在生成可执行字节码的过程中，对这棵树执行进一步操作。由于 Hy 前端接受 Hy 代码作为输入，并输出与\
  \ Python 解释器兼容的抽象语法树，因此 Hy 代码会与 Python 代码在同一个解释器中运行。\n\n从实际应用角度看，Hy 程序可以调用任意 Python\
  \ 库，而 Python 代码也可以调用 Hy 代码。\n\n它以 MIT（Expat）许可证发布，主页地址为 `http://docs.hylang.org/en/latest/`。\n\
  \n> “Hy 是一种嵌入 Python 的出色 Lisp 方言。\n>\n> 由于 Hy 会将其 Lisp 代码转换为 Python 抽象语法树，因此你可以用\
  \ Lisp 的形式，随时使用 Python 的整个精彩世界！”\n\n\n\n\n关于 Hy 的括号，奇怪之处在于它们位于函数名之前、参数之后，而不是位于函数名之后并包围参数。这是\
  \ Lisp 及其所有方言的标准语法。这种形式创建的语法单元称为*表达式*，每个表达式都具有相同的形式：\n\n```\n(<function> <arguments>)\n\
  ```\n\n在 Hy 中，一切都是表达式，所以会有大量括号。起初可能看起来不太习惯，但这种简洁的语法使表达式求值变得简单：\n- 将函数应用于参数，返回表达式的值\n\
  - 永远只存在一个函数\n\n## 算术运算的位置不同寻常\n\n将 1 和 1 相加的代码如下：\n\n```\n(+ 1 1)\n```\n\n这遵循标准表达式语义：先是函数，后是参数（在这里是先运算符，后操作数）。人们使用中缀表示法并不是\
  \ Hy 的错——一致性是编程语言的一种美德。这种表示法的一个附带好处是算术运算符可以接受任意数量的操作数：\n\n```\n(* 1 2 3 4)\n```\n\
  \n这将返回 24。\n\n但是，这不应与栈算术的前缀版本混淆。表达式：\n\n```\n(* + + 1 2 3 4)\n```\n\n是一个语法错误。它违反前面列表中的第二条规则，因为在一对括号内包含了多个函数。\n\
  \n## 函数组合无处不在\n\n可以用括号修复前面的示例：\n\n```\n(* (+ (+ 1 2) 3) 4)\n```\n\n```\nif curr\
  \ % 2 == 1:\n    curr = 3 * curr + 1\nelse:\n    curr = curr/2\n    return tmp\n\
  ....:\n```\n\n```\nIn [21]: %hylang (f 35)\nOut[21]: 13\n```\n\nPython 的内置函数和库也是如此：\n\
  \n```\nIn [28]: %hylang\n....: (setv f (open \"hy1.hy\"))\n....: (print (.read f))\n\
  ....:\n```\n\n这将打印该文件的内容：\n\n```\n%hylang\n(import math)\n(defn safe-sqrt [x]\n\
  \  (if (< x 0)\n    (math.sqrt (- 0 x))\n    (math.sqrt x)\n  )\n)\n```\n\nHy 与\
  \ Python 的互操作方式多到无法在此一一列举，包括列表推导式、对象和异常。可以说，如果你已经熟悉 Python，并且有兴趣扩展到函数式语言，Hy 是一个不错的选择。\n\
  \n## Matplotlib\n\nMatplotlib 是一个基于 Python 的 2D 绘图库。它与 Python 配合良好，与 IPython 配合更佳。它包含\
  \ `pyplot` 模块，提供类似 MATLAB 的功能。Matplotlib 的功能既可以通过编程方式访问，也可以在 IPython 命令行中以交互方式访问。为了便于说明，本节中的示例将在命令行中运行。\n\
  \n## 启动 matplotlib\n\nMatplotlib 应该随大多数主流 IPython 发行版一同安装。如果你的发行版未包含它，标准的包安装过程（例如\
  \ `pip install` 或 `sudo apt-get`）应该就足够了。\n\n有两种启动 matplotlib 的方式：`matplotlib-only`\
  \ 或 `pylab`。\n\n区别在于，使用 `matplotlib-only` 模式会激活 `matplotlib` 的交互支持，但不会向命名空间导入任何内容。`pylab`\
  \ 模式会执行更多导入并更改命名空间。\n\n安装后，可以通过命令行或使用 `%matplotlib` 魔法命令启动 `matplotlib-only` 模式，如下所示：\n\
  \n```\n(Ipython) -bash-4.1$ ipython --matplotlib\nPython 3.4.3 |Anaconda 2.0.1 (64-bit)\
  \ | (default, Oct 19 2015, 21:52:17)\nType \"copyright\", \"credits\" or \"license\"\
  \ for more information.\n\nIPython 4.0.1 -- An enhanced Interactive Python.\n? \
  \         -> Introduction and overview of IPython's features.\n%quickref  -> Quick\
  \ reference.\nhelp       -> Python's own help system.\nobject?    -> Details about\
  \ 'object', use 'object??' for extra details.\nUsing matplotlib backend: Qt4Agg\n\
  \nIn [1]:\n```\n\n## 初始图形\n\n与其他新模块一样，值得检查一切是否正常。在 IPython 命令行中，输入以下命令：\n\n```\n\
  In [2]: x = randn(90000)\n```\n\n```\nIn [3]: hist(x, 300)\nOut[3]:\n```\n\n此时，我的命令行打印了两类内容：\n\
  - 两个数组和一个列表（`hist` 调用的返回值）\n- 一个堆栈跟踪（当我删除位于 ~/.cache/matplotlib/fontList*.cache\
  \ 的 matplotlib 字体缓存后，它就消失了）\n\n更重要的是，它生成了以下图形：\n\n![](img/8628b86fcc4f22d859c0104c2ec1d15f_207_0.png)\n\
  \n作为第一个 matplotlib 示例，这段代码值得进一步说明：\n- **第 1 行：** `numpy.random.randn` 函数创建一个包含 90,000\
  \ 个浮点数的一维数组；它们遵循均值为 0、方差为 1 的正态分布。\n- **第 2 行：** `hist` 函数接受一个数组作为参数，计算并绘制该数组的直方图。它接受许多可选参数；在本例中，我们提供了要使用的箱数。\n\
  \n## 修改图形\n\n让第一个图形运行起来很容易，但它还可以改进。改变事物的第一种方法是更改/添加构造函数的参数。例如，假设我们执行以下命令：\n\n```\n\
