  ```\nIn [11]: %%R\n    ....: head(df)\n    ....:\n      x y\n1 1 2\n2 2 3\n3 3 5\n\
  4 4 7\n```\n\n注意，即使在多次调用 `%%R` 之间，df 也保持其值。内置的 mtcars 数据是 R 中的一个数据框。\n\n|    | mpg\
  \ | cyl | disp | hp | drat | wt | qsec | vs | am | gear | carb | kpg |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
