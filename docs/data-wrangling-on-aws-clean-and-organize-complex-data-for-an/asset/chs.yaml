  stat4_val\": \"\",\n  \"team\": \"\",\n  \"\": \"IND\"\n}\n```\n\n图 9.10：作为 JSON\
  \ 格式输出探索的示例记录\n\n现在，如您从数据中看到的，我们的 CSV 导出文件包含带有逗号的列。**Name** 字段是名和姓的组合。您可以从源（MySQL\
  \ CLI）或 Glue 作业日志中参考原始数据：\n\n| Position | FS |\n|---|---|\n| player_number | 32\
  \ |\n| Name | Green, T.J. |\n| status | ACT |\n\n图 9.11：从 Glue 控制台输出看到的示例记录\n\n\
  现在我们已经发现，我们的作业在写入 CSV 输出时未用封装字符包裹字段，这导致字段错位。然而，我们不能使用 awswrangler 代码为这些列添加封装符，因为\
  \ AWS SDK 的 GitHub 网站上的文档指出，如果我们在同一代码中使用 Glue 目录同步（我们正在这样做以在 Athena 中查询最终数据），pandas\
  \ 关键字参数将被忽略。\n\n4. 如果传递了 table 和 database 参数，**pandas_kwargs** 将因 Athena/Glue Catalog\
  \ 所需的限制性引号、**date_format**、**escapechar** 和编码而被忽略。\n\nAWS SDK for Pandas 会将 escapechar\
  \ 设置为 \\ 以启用与 Athena 的配合使用。您可以从以下代码片段中看到，当我们需要同 Glue Catalog 集成时，pandas 的额外关键字参数被忽略，并且默认设置了\
  \ escapechar。\n\n```\nif database and table:\n    quoting: Optional[int] = csv.QUOTE_NONE\n\
  \    escapechar: Optional[str] = \"\\\\\"\n    header: Union[bool, List[str]] =\
  \ pandas_kwargs.get(\"header\", False)\n    date_format: Optional[str] = \"%Y-%m-%d\
  \ %H:%M:%S.%f\"\n    pd_kwargs: Dict[str, Any] = {}\n```\n\n图 9.12：显示 escapechar\
  \ 配置的 AWS SDK for Pandas 代码片段\n\n5. 让我们重新执行 Glue 作业以填充数据，手动用双引号包裹列。添加以下代码片段以在将其写入为\
  \ CSV 文件之前用双引号包裹 Name 列。取消代码片段中这一行的注释并重新运行作业：\n\n```\noutput_data['Name'] = output_data['Name'].apply(lambda\
  \ x: '\"\"' + str(x) + '\"\"')\n```\n\n图 9.13：包含转义字符双引号包裹的列的输出文件\n\n即使我们修复了一个文件，还有其他具有类似问题的文件，转义字符的存在会导致该列上的数据过滤器无法正常工作。因此，根据我们的初步分析，将原始文件存储为\
  \ JSON 格式以便进一步分析是合适的。\n\n6. 更改 Glue 控制台中的源代码，将数据存储为 JSON 文件格式。克隆当前的 Glue 作业并更改脚本如下所示：\n\
  \n```\nimport sys\nimport awswrangler as wr\nimport time\nimport csv\n#Connect to\
  \ MySQL using Glue connections\ncon=wr.mysql.connect(\"wranglerbook\")\nschema=\"\
  dms_sample\"\n#table_list=[\"mlb data\",\"name data\", \"nfl data\", \"nfl stadium\
  \ data\",\"person\", \"player\", \"seat\", \"seat_type\", \"sport division\", \"\
  sport_league\", \"sport_location\", \"sport_team\", \"sporting event\", \"ticket_purchase_hist\"\
  ]\ntable_list=[\"nfl_data\"]\n```\n\n| position | name | status | stat1 | stat1_val\
  \ | stat2 | stat2_val | stat3 | stat3_val | stat4 | stat4_val | team |\n|----------|------|--------|-------|-----------|------|-----------|------|-----------|------|-----------|------|\n\
  | FS | 66 | Graf, Kevin | ACT | G | -- | GS | -- | FF | -- | INT | -- |\n| FS |\
  \ 27 | Guy, Windem | ACT | TCKL | 6 | SCK | 0 | FF | 0 | INT | -- |\n| OT | 75 |\
  \ Haeg, Joe | ACT | G | -- | GS | -- | -- | -- | -- | -- |\n\n```\nfor table in\
  \ table_list:\n    #Read data from MySQL tables into Pandas dataframe\n    start_time\
  \ = time.time()\n    output_data=wr.mysql_read_sql_query(\"SELECT * FROM \"\n  \
  \          +schema+\".\"+ table +\";\", con=con)\n    \n    #Print one row for debugging\n\
  \    #print(output_data.loc[1,:])\n    if len(output_data.axes[0])>0:\n        #Write\
  \ Pandas dataframe into S3\n        wr.s3.to_json(\n                df=output_data,\
  \       path=\"s3://wranglerbook/\n                awswrangler/\"+table+\"/\",\n\
  \                dataset=True,\n                orient='records',\n            \
  \    lines=True,\n                mode=\"overwrite\",\n                database=\"\
  mysql_extract\",\n                table=\"mysql_\"+table)\n        end_time=time.time()\n\
  \        print(f\"Completed the data extraction for table -\n                {table}\
  \ ,Loaded record count - {len(output_data.axes[0])} and\n                took {round(end_time-start_time,2)}\
  \ seconds\")\n    else:\n        print(f\"Data load not performed for table {table}\
  \ as it\n                is empty.\")\nprint(\"Completed the data extraction process\"\
  )\ncon.close()\n```\n\n如果您注意到差异，我们只是将 `to_csv` 函数更改为 `to_json`。这说明了将文件保存到 S3 的便捷程度。\n\
  \n现在您可以看到数据正确填充为 JSON 文件，并可以从 S3 Select 验证这一点，如下所示。\n\n\n\n\n### Pandas 中的数据探索\n\
  \n一旦数据被加载到 pandas DataFrame 中，你就可以使用 pandas 的数据探索功能来分析数据。根据数据类型和业务用途，可以执行不同类型的探索。我们将在本节中介绍一些高层级的数据探索活动，并使用\
  \ `info` 函数来识别数据结构，包括记录数、列数、列类型、内存使用情况等。这会让您对数据及其结构有个概念。\n\n```python\noutput_data.info()\n\
