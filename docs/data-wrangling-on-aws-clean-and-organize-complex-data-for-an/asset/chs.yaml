  \ Redshift 数据仓库的额外功能，如下所示：\n\n- **连接到数据仓库**：我们可以使用用户名/密码像其他 RDS 数据库一样连接，或使用临时登录凭据连接到数据库用户名，前提是你拥有获取\
  \ Redshift 集群凭据的 IAM 权限（https://docs.aws.amazon.com/cli/latest/reference/redshift/get-cluster-credentials.html）。\n\
  - **向数据仓库写入/加载数据：**\n    - **从 pandas DataFrame 加载：** 有几种选项可以将数据从 DataFrame 加载到\
  \ Redshift 表中。`to_sql` 函数，可用于 RDS，此前已使用，可用于此目的。另一个选项是使用 `copy` 方法，它使用 S3 中的 Parquet\
