  \ Lambda 函数。\n\n#### 步骤 3c\n在 Lambda 函数中更新以下代码。单击**部署**以保存 Lambda 代码。以下代码从 S3 位置读取数据并整合数据，以便通过电子邮件发送：\n\
  \n```\nimport json\nimport boto3\nimport csv\nfrom urllib.parse import urlparse\n\
  s3 = boto3.resource('s3')\n\ndef lambda_handler(event, context):\n    # TODO implement\n\
