  \n# 数据质量验证与数据管道的集成\n\n我们可以根据每个项目的特定要求对数据集执行不同的验证。可以通过以下更新进一步提高数据质量验证：\n\n\n\n- 创建可在\
  \ SQL 格式下执行的业务规则并将其存储在元数据存储中（如 DynamoDB）。每次运行都执行存储的数据质量规则并识别不符合的记录。加载应仅使用分区或自定义书签功能处理新数据。\n\
  \n- GreatExpectations 是一个基于 Python 的开源库，用于数据的验证、分析和文档化。通过该库，我们可以在数据集上创建期望的断言。该库还支持多个内置期望。一旦执行期望，您将以名为\
  \ Data Docs 的格式化的 HTML 文档形式获得结果。\n\n现在，我们将在下一节中探索数据可视化，这是数据整理管道的最后一个阶段。\n\n## Data\
  \ visualisation\n\n数据可视化是您将创建可视化和图表以更好地向业务用户传达分析结果的阶段。一图胜千言，图表/仪表板比表格/文本数据更能更好地传达想法/信息。\n\
  \n## Visualization with Python libraries\n\n在本节中，我们将使用 Python 库（如 matplotlib (https://matplotlib.org/)\
  \ 和 Seaborn (https://seaborn.pydata.org/index.html)）探索创建仪表板。还有更多 Python 库可以帮助可视化数据，但我们在此不会比较所有这些库。\n\
  \n我们将继续使用本节的同一体育数据集。还有其他数据集，例如 NY 出租车行程数据集，我们可以用它们来涵盖不同的可视化方面，但为了本章的连贯性，我们将使用体育数据。让我们考虑一个用例，我们希望可视化以下需求：\n\
  \n- 每天售出的商品数量及其价格范围\n- 按座位类别售出的票的价格范围，以便更好地了解票价带的构成\n\n为了获取售出的票数，我们将使用 ticket_purchase_hist\
  \ 表的数据。表中的数据将具有以下屏幕截图中所示的信息：\n\n![](img/e28602b44ec813a47df57c96b204412c_340_0.png)\n\
  \nFigure 9.67: Exploring the ticket_purchase_hist table\n\n该表包含票证 ID、交易日期、购买价格和购买人员\
  \ ID 的详细信息。我们可以单独使用此表来可视化每天售出的票数。\n\n我们将使用 Matplotlib 散点图来可视化每天售出的票数。请注意这只是测试数据，我们已在本章前面运行存储过程来填充票证购买历史。在屏幕截图中显示的示例数据中，存储过程在两天内执行以生成票证购买数据量：\n\
  \n```\nimport matplotlib.pyplot as plt\nplt.xticks(rotation=-90)\nplt.scatter(ticket_purchase_hist['transaction_date_time'].dt.date,\
