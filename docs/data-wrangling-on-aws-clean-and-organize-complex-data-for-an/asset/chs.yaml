  \ EMR 文档（https://docs.aws.amazon.com/emr/latest/ReleaseGuide/emr-jupyterhub-install-kernels-libs.html）以安装额外的包和内核。\n\
  \n我们花费了大量时间在不同环境中安装 awswrangler，以便组织中的不同角色能够利用 awswrangler 库。此外，我们还展示了如何更改 awswrangler\
  \ 并将其部署到所有环境中，以更适合组织的需求。AWS SDK for pandas 库已经提供了大量功能，大多数客户可以在其项目中使用官方库，因此我们提供了针对不同角色使用它的方案。如果您的项目需要为您的需求定制\
  \ awswrangler 库，我们也展示了实现的方法。现在，我们将探讨如何设置配置选项以使 awswrangler 更符合项目特定需求的定制。\n\n# AWS\
  \ SDK for pandas 的配置选项\n\nawswrangler 中有配置全局变量的选项，这将帮助我们使 awswrangler 库更符合我们的特定用例。我们将深入了解如何设置配置以定制\
  \ awswrangler 的工作方式。\n\n# 设置全局变量\n\n全局配置变量可以通过 awswrangler 中的两种不同机制进行设置：\n\n- **环境变量**：在\
  \ awswrangler 包将被执行的 operating system/kernel 环境中创建环境变量。例如，在 Jupyter notebook 中，使用\
  \ %env 命令为环境变量设置值。这在 awswrangler 对象实例化时加载。\n\n- **Wrangler 配置变量**：您也可以直接使用 wrangler\
  \ 对象为环境变量设置值。使用 awswrangler.config.<<variable name>> 语法为该配置分配值。\n\n# 配置如何应用？\n\n\
  Python 有一个有趣的功能称为装饰器，用于为现有代码添加功能。这也称为元编程，因为程序的一部分试图在编译时修改程序的另一部分。装饰器确保在函数被调用之前应用配置，使用\
  \ @decorator_func 语法在 awswrangler 源代码中为不同服务。\n\n参考以下截图，其中装饰器函数在 Athena read_sql_query\
  \ 函数之前应用，这将设置代码中与 Athena 相关的全局变量。apply_configs 函数在 config.py 脚本中定义，如果需要，您可以阅读它以更深入地理解。\n\
  \n```\n@apply_configs\ndef read_sql_query(\n    sql: str,\n    database: str,\n\
  \    ctas_approach: bool = True,\n    unload_approach: bool = False,\n    unload_parameters:\
  \ Optional[Dict[str, Any]] = None,\n    categories: Optional[List[str]] = None,\n\
  \    chunksize: Optional[Union[int, bool]] = None,\n    s3_output: Optional[str]\
  \ = None,\n    workaroud: Optional[str] = None.\n```\n\nFigure 3.41: awswrangler\
  \ – a config.py code snippet\n\nawswrangler 包中可用的变量类别如下。然而，用户可以根据特定项目需求向代码添加配置变量：\n\
  \n- **Endpoint URL**：为 awswrangler 用于连接 AWS 环境的各种服务提供端点 URL。要以编程方式连接到 AWS 服务，您使用端点，它是\
  \ AWS Web 服务的入口点。AWS SDK 和 AWS 命令行界面（CLI）会自动为 AWS 区域中的每个服务使用默认端点，但您可以使用此变量为 API\
  \ 请求指定替代端点。一个示例是连接到特定区域或使用 FIPS 端点以增强 TLS 连接的安全性。\n- **botocore 配置变量**：这些是 boto\
  \ 环境的配置参数。有关可传递给 botocore 配置的参数的更多详细信息，请参考 boto3 文档。boto3 配置中的一些参数示例是区域名称、输出格式、连接超时和重试。参考\
  \ botocore 文档（https://botocore.amazonaws.com/v1/documentation/api/latest/reference/config.html）了解可配置变量的更多详细信息。\n\
  - **General 配置变量**：这些是用于影响其行为方式的各种服务的通用配置 - 例如，我们可以配置块大小参数以从 S3 读取数据。\n\n# 与 Athena\
  \ 缓存行为相关的参数\n\nawswrangler 可以在特定时间段内检索已执行的 Athena 查询结果。我们可以使用配置变量来配置此行为，以在 X 秒内或\
  \ X 个查询内返回预执行的数据，以便用户可以更快地获得有效数据。以下变量有助于配置 Athena 缓存行为：\n\n- **MAX_CACHE_SECONDS**：awswrangler\
  \ 可以在 Athena 的历史中检查此查询是否之前已运行。如果是，并且其完成时间距离当前查询小于 max_cache_seconds，则 awswrangler\
  \ 跳过查询执行并仅返回上次的相同结果。\n- **MAX_CACHE_QUERY_INSPECTIONS**：这是将从历史中检查以尝试找到可重用结果的最大查询数。只有在\
  \ max_cache_seconds > 0 时才生效。\n- **MAX_REMOTE_CACHE_ENTRIES**：这是将从 AWS 检索用于缓存检查的最大查询数。只有在\
  \ max_cache_seconds > 0 时才生效，默认值是 50。\n- **MAX_LOCAL_CACHE_ENTRIES**：这是将本地缓存元数据的最大查询数。这将降低延迟并能够使超过\
  \ max_remote_cache_entries 的查询保持可用。此值不应小于 max_remote_cache_entries。只有在 max_cache_seconds\
  \ > 0 时才生效，默认值是 100。\n\n\n\n\n\n## 跨不同服务使用的参数\n\n使用 `awswrangler` 包与 Amazon S3 交互时，以下参数会被使用。它们有助于提高读写操作的性能：\n\
  \n- `CONCURRENT_PARTITIONING`：如果为 True，则在写入分区时将提高并行度（使用线程）。它会减少写入时间并增加内存使用。\n- `S3_BLOCK_SIZE`：此配置用于从\
  \ S3 读取文件，要么按指定块大小读取，要么如果此变量的值设为 -1 则一次性完全读取。\n\n## 配置的常见用例\n\n我们可以配置 awswrangler\
  \ 使相同的设置在多个命令中重复使用，这意味着我们无需每次都输入它们。此外，当我们在多个环境中执行程序时，全局配置有助于设置默认值，从而使 awswrangler\
  \ 执行针对该环境进行定制。\n\n考虑一种情况，我们需要对测试数据库和生产数据库执行 Athena 查询。测试和生产查询之间的区域、账户和缓存因子是不同的。\
  \ rather than configuring them individually in each API call, we can customize them\
  \ using global configurations once.\n\n这里的另一个优势是，您可以自定义配置变量以添加自己的变量，以及进一步自定义 awswrangler\
  \ 对您项目的行为。\n\n到目前为止，我们已经学习了多种安装和配置 awswrangler 包以满足您特定用例的方法。现在，我们将探讨各种 AWS 服务与 awswrangler\
  \ 的集成以及如何与这些服务高效使用它。\n\n## AWS SDK for pandas 与不同 AWS 服务的功能\n\n我们现在将探讨 awswrangler\
  \ 包与 AWS 服务的集成。awswrangler 可与更多 AWS 服务配合使用，我们解释了其与一些常用服务（如 Amazon S3、RDS 数据库、Amazon\
  \ Redshift 和 Amazon Athena）的集成。\n\n## Amazon S3\n\nAmazon 的 **Simple Storage Service\
  \ (S3)** 是用于结构化、半结构化和非结构化数据的最大且性能最强的对象存储服务，也是构建数据湖的首选存储服务。Amazon S3 允许您以无限规模迁移、存储、管理和保护所有结构化和非结构化数据。借助\
  \ S3 数据湖，您可以打破数据孤岛、分析多样化数据集、在一个集中位置管理数据访问并加速机器学习。Amazon S3 按设计安全、按需可扩展，并且能够抵御整个\
  \ AWS 可用区故障。您可以使用 AWS 原生服务并与第三方服务提供商集成，在您的数据湖上运行应用程序。\n\n`awswrangler` 与 Amazon\
  \ S3 可用的主要功能如下：\n\n- **从 S3 读取/下载数据**：我们有函数可从 S3 路径读取 JSON、CSV、Excel、Parquet 和定宽文件格式的数据到\
  \ pandas DataFrame。这些函数有助于将数据从 S3 位置加载到 DataFrames 中以使用 pandas 函数进行处理。它们还提供分区推送、加载在特定时间后修改/加载的对象（用于增量数据加载）、为大文件以可配置的块加载数据以及在数据上提供多种格式化选项（pandas\
  \ 或 PyArrow 参数）的额外功能。\n  要将数据从 S3 位置获取到本地路径/本地服务器，用户可以利用下载函数并在本地机器上对数据进行进一步处理。同样，如果用户想要查询\
  \ S3 对象中的数据以调试并了解元数据以进行目录更新，S3 Select 和 `read_parquet_metadata` 函数都会有所帮助。\n\n- **向\
  \ S3 写入/上传数据**：数据可以使用 `awswrangler` 库以 JSON、CSV、Parquet 和 Excel 等各种文件格式写入 S3。用户可以选择以各种格式在\
  \ S3 中存储数据集。这些函数还提供创建分区并更新 Glue 目录的选项，以便数据可以通过 Athena 和 Redshift Spectrum 查询。数据可以以各种模式保存，例如追加（添加新文件）、覆盖（替换目标路径下的所有文件）和覆盖分区（仅覆盖该分区中的文件）。用户可以配置\
  \ S3 函数以支持模式演进（允许缺失或新列）并允许 Athena 进行分区投影。\n\n如果您想从本地/本地位置将数据导出到 S3，可以利用 `upload`\
  \ 函数。`download` 和 `upload` 函数使用文件系统函数读写数据并使用多线程逻辑提高效率。\n\n## Parquet 文件处理有何不同？\n\
  \n为了读取和写入其他文件格式，`awswrangler` 使用 pandas 函数来读取和写入文件。然而，对于 Parquet 文件的加载/写入，`awswrangler`\
  \ 将利用 Arrow 库以实现更快的加载并在内存中映射它们。请阅读介绍部分中有关使用 Arrow 库的好处的介绍以获取更多详细信息。\n\n## 使用 awswrangler\
  \ 的 Amazon S3 实用示例\n\n让我们使用一些实用示例来进一步了解 `awswrangler` 读取/写入 S3 的概念。\n\n1. 在笔记本中安装\
  \ `memory_profiler` 库以跟踪内存使用情况，以及加载和卸载数据所需的时间：\n\n![](img/e28602b44ec813a47df57c96b204412c_123_0.png)\n\
  \n2. 我们将加载 ~4 GB 数据到 pandas `DataFrame` 中，顺便说一下，这是一个相当大的数据集来进行我们的数据加载基准测试。\n\n![](img/e28602b44ec813a47df57c96b204412c_123_1.png)\n\
