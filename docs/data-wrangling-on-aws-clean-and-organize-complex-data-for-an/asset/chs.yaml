- "# 5 使用 Amazon S3\n\n在之前的章节中，我们反复讨论了大数据和数据湖的概念，以及组织如何通过各种数据整理过程（如*第 1 章*中所述）利用它们来存储数据并提取有价值的见解，使用的是诸如\
  \ AWS Glue DataBrew、AWS SDK for Pandas 和 SageMaker Data Wrangler 等**Amazon Web Services**（AWS）服务。本章将更详细地探讨大数据和数据湖的具体细节。\n\
  \n具体来说，我们将涵盖以下主题：\n\n- 大数据的定义和概念\n- 大数据的特征\n- 数据湖的概念和定义\n- 在**Amazon Simple Storage\
  \ Service**（Amazon S3）上构建数据湖的最佳实践\n- Amazon S3 上的数据布局和组织结构\n\n我们将首先探讨大数据的定义和特征。\n\
  \n## 什么是大数据？\n\n大数据指的是那些过于复杂和多样化，无法使用传统数据管理和分析工具进行处理和分析的极大数据集。大数据通常来自多个来源，如传感器、社交媒体和电子商务平台，并可能包括结构化、半结构化和非结构化数据。\n\
  \n大数据的体积、速度和多样性给数据管理和分析带来了重大挑战。传统的数据存储和处理系统并非设计用于处理如此庞大和复杂的数据集，它们可能无法提供大数据应用程序所需的性能、可扩展性和灵活性。\n\
  \n\n\n\n为了应对这些挑战，各组织已转向大数据技术，例如 Apache Hadoop、Apache Spark 和 Apache Flink。这些技术旨在支持大规模大数据的存储、处理和分析，并提供了一种能够处理海量数据的分布式并行架构。\n\
  \n大数据技术使组织能够从数据中提取有价值的洞察和知识，它们已成为数据驱动决策和创新过程的关键推动力。例如，大数据技术被广泛应用于多种场景，如欺诈检测、推荐系统和预测性维护。\n\
  \n尽管大数据技术带来了诸多优势，但我们也需考虑其面临的挑战和局限性。例如，大数据系统可能复杂且难以管理，并且可能需要专门的技能和专业知识。此外，大数据系统还可能引发隐私和安全问题，需要谨慎管理以确保数据的完整性和质量。\n\
  \n正如我们所了解的，“大数据”一词通常指代海量结构化、半结构化和非结构化数据，这些数据通常非常复杂，需要强大的计算能力进行处理。然而，大数据的定义是相对的，取决于可用的存储和计算选项。\n\
  \n例如，对于使用 Excel 处理数据的人来说，1 GB 的数据可能被视为大数据；但对于在配备 32 GB 内存的笔记本电脑上使用 Apache Spark\
  \ 框架的人来说，这可能算不上大数据。同样，当数据量增长到 1 TB 时，可能需要使用外部数据库和**提取、转换和加载（ETL）** 工具进行处理。而当数据量扩展到几十\
  \ TB 时，可能需要使用本地或云端的分布式处理方案，例如使用 **Hadoop 分布式文件系统（HDFS）** 等存储系统和 Hadoop 等处理框架，或使用\
  \ Amazon S3 等对象存储并结合 AWS Glue 等 AWS 服务进行处理。然而，即便有了这些选项，当数据量扩展到数百 TB 时，即使是 AWS Glue\
  \ 也会将其视为大数据，且处理成本高昂，这会降低其业务价值，并可能需要使用 **Amazon Elastic MapReduce (Amazon EMR)**\
  \ 等方案。\n\n客户对于何谓大数据的看法也可能各不相同；有些人可能认为几 TB 的数据就是大数据，而另一些人则认为 PB 甚至 EB 级别的数据才算大数据。这种观点相对于像\
  \ Amazon、Facebook、Google 和 Apple 这样的大型科技公司存储和处理数据的规模而言也是相对的，它们的数据量可达数 PB 甚至数 EB。\n\
  \n根据 *Statista* 的数据，到 2025 年，全球将创建、捕获、复制和消费 181 泽字节（1 泽字节 = 1,024 艾字节）的数据（`https://www.statista.com/statistics/871513/worldwide-data-created/`）。\n\
  \n总体而言，大数据是现代数据管理和分析的关键组成部分，它为组织带来了机遇，也带来了挑战。通过利用正确的工具和技术，组织可以解锁数据的价值，推动业务增长和创新。\n\
  \n现在我们对大数据有了相当全面的理解，让我们来了解其主要特征。\n\n## 大数据的 5 个 V\n\n大数据的 5 个 V 是定义大数据概念的五个关键特征。这些特征有助于理解大数据的本质以及如何有效地分析和利用它。让我们详细探讨如下：\n\
  \n数据湖旨在支持以原始格式存储大量数据，以便组织内的各个团队在后续阶段进行处理和分析。这种数据存储和管理方法为组织提供了灵活性，使其能够从广泛的数据源中收集和数据存储，而无需对数据进行任何特定方式的预处理或结构化。\n\
  \n使用数据湖的一个关键优势是它允许组织存储和管理来自各种不同来源的数据，包括结构化和非结构化数据。这意味着组织可以收集来自社交媒体信息流、传感器数据和交易系统等来源的数据，然后利用这些数据获取洞察并做出数据驱动的决策。\n\
  \n数据湖的另一个关键优势是为组织提供了灵活处理和分析数据的方式。这是因为数据湖中的数据以原始格式存储，可以供组织内的各个团队（如数据科学家、业务分析师和数据工程师）访问和分析。\n\
  \n让我们详细探讨这些优势，如下所示：\n\n- * **成本效益高的存储：** 与传统数据仓库相比，数据湖可以以更低的成本存储大量数据。这是因为数据湖使用通用硬件和开源技术，通常比专有解决方案更便宜。\n\
  - * **灵活性——按需模式（Schema-on-Read）：** 数据湖允许您以原始、初始格式存储数据，无需预先转换或结构化。这使您能够将如何使用数据的决策推迟到需要之时，从而为您的数据管理策略提供更多灵活性。\n\
  - * **可扩展性——存储与计算解耦：** 数据湖旨在水平扩展，这意味着您可以轻松地根据需要增加存储和处理能力。这使其非常适合处理大量数据以及数据量的突然激增。\n\
  - * **集成性：** 数据湖可以集成各种数据源和分析工具，使您能够汇集来自多个来源的数据并对执行多种分析。\n- * **协作性：** 数据湖允许多个用户和团队访问和分析数据，促进协作并支持数据驱动的决策。\n\
  \n总体而言，数据湖为组织提供了一种强大的工具，用于管理和分析来自各种不同来源的大量数据。通过允许组织以原始格式收集、存储和管理数据，数据湖提供了支持广泛数据驱动应用和使用场景所需的灵活性和可扩展性。\n\
  \n## 在 Amazon S3 上构建数据湖\n\nAmazon S3 是一种基于云的存储服务，为数据和媒体提供可扩展、持久且安全的存储。Amazon S3\
  \ 是存储和管理数据的热门选择，因为它提供高性能、可靠性和灵活性。\n\n## 在 Amazon S3 上工作\n\n在本章中，我们将讨论在 Amazon S3\
  \ 上构建数据湖的过程。数据湖是一个集中式存储库，允许组织以任何规模存储其所有结构化和非结构化数据。构建数据湖最流行的平台之一是 Amazon S3。Amazon\
  \ S3 是一种高度持久且可扩展的存储服务，使存储和分析大量数据变得轻而易举。\n\n让我们看看在 Amazon S3 上构建数据湖所涉及的步骤：\n\n- 1.\
  \ 在 Amazon S3 上构建数据湖的第一步是设计数据架构。这包括确定将存储在数据湖中的数据的数据类型和来源，以及将使用的数据摄取、处理和分析管道。需要考虑数据湖的性能、可扩展性和安全性要求，并选择合适的存储、计算和网络资源。\n\
  - 2. 在 Amazon S3 上构建数据湖的下一步是准备和组织数据。这涉及清理、转换和丰富数据，使其适合分析和可视化。确保数据的质量、一致性和完整性很重要，并应用适当的元数据、标记和编目以方便数据发现访问。\n\
  - 3. 数据准备好并组织好后，即可加载到 Amazon S3 上的数据湖中。这可以使用各种工具和技术完成，例如批处理、实时流处理和批量导入。为数据选择合适的文件格式和压缩方法很重要，并应用正确的分区和索引策略以支持高效的数据存储和查询。\n\
  - 4. 数据加载到 Amazon S3 上的数据湖后，可以使用各种工具和框架进行访问和查询。这可能包括基于 **结构化查询语言（SQL）** 的查询引擎（如\
  \ Amazon Redshift 和 Amazon Athena），以及 Apache Spark 和 Apache Flink 等大数据框架。选择能够支持数据湖的性能、可扩展性和灵活性要求的正确工具和技术很重要。\n\
  - 5. 最后，Amazon S3 数据湖中的数据可用于各种用途，例如报告、分析、机器学习和数据可视化。这可以使用各种工具和平台完成，例如仪表板和可视化工具、数据科学笔记本以及分析和机器学习平台。选择能够支持数据湖及预期使用场景的正确工具和技术很重要。\n\
  \n总之，在 Amazon S3 上构建数据湖需要仔细的规划、设计和执行。通过利用正确的工具和技术，组织可以创建一个可扩展、安全且具有成本效益的平台，用于存储、处理和分析大型数据集。\n\
  \n\n\n\n![](img/e28602b44ec813a47df57c96b204412c_175_0.png)\n\n## 什么是数据湖？\n\n##\
  \ 在 Amazon S3 上构建数据湖的优势\n\n在上一节中，您了解了如何在 Amazon S3 上构建数据湖，但您一定想知道为什么要在 Amazon S3\
  \ 上构建数据湖——这正是我们在本节中要探讨的内容。\n\n以下是在 Amazon S3 上构建数据湖的一些主要优势：\n\n- **可扩展性**：Amazon\
  \ S3 具有高度可扩展性，能够处理大量数据，是构建数据湖的理想选择。S3 可扩展性的一个示例是：一家公司最初只有少量数据，随着时间的推移，其数据湖中收集和存储的数据量显著增加。借助\
  \ Amazon S3，该公司可以轻松扩展其数据存储，以适应数据量的增长，而无需担心存储空间不足。例如，一个组织最初有 50 GB 的数据，随着时间的推移，数据量增加到\
  \ 100 TB。它可以轻松扩展 Amazon S3 中的数据存储来处理数据量的增加，而无需担心存储空间耗尽或将数据迁移到新的存储系统。\n\n- **成本效益**：Amazon\
  \ S3 是一种经济高效的数据存储解决方案，您只需为使用的存储付费。例如，一家公司希望在数据湖中存储 1 PB 的数据。如果将其存储在本地，则必须购买和维护昂贵的基础存储设施，这可能成本高昂。使用\
  \ Amazon S3，公司可以以更低的成本存储相同数量的数据，因为它只为使用的存储付费，并且不必担心与维护和升级存储基础设施相关的额外成本。此外，Amazon\
  \ S3 还提供经济高效的数据检索选项，例如 Amazon S3 Select 和 Amazon S3 Glacier，允许您只检索所需的数据，从而降低数据检索成本。\n\
  \n- **数据安全**：Amazon S3 提供强大的安全功能，例如加密、访问控制以及符合各种法规要求。以下是一些示例：\n  - **静态加密**：组织使用\
  \ Amazon S3 的**服务端加密（SSE）**功能对数据湖中存储的所有患者数据进行加密。这确保了即使数据湖遭到破坏，数据也能受到保护。\n  - **访问控制**：组织使用\
  \ Amazon S3 的访问控制功能，例如存储桶策略和**访问控制列表（ACL）**，将患者数据的访问权限限制为仅限授权的个人和系统。\n  - **合规性**：组织使用\
  \ Amazon S3 的合规功能，例如对**《健康保险携带和责任法案》（HIPAA）**和**《支付卡行业数据安全标准》（PCI DSS）**的支持，以确保数据湖满足存储敏感患者数据的监管要求。\n\
  \  - **审计**：组织使用 AWS CloudTrail 和 AWS Config 来记录和监控对数据湖中患者数据的访问。这使组织能够检测并响应任何对患者数据的未经授权访问。\n\
  \n- **灵活性**：Amazon S3 支持多种数据类型和格式，允许您在同一数据湖中存储结构化、半结构化和非结构化数据。例如，一家公司以**逗号分隔值（CSV）**格式收集结构化数据（如客户交易），以**JavaScript\
  \ 对象表示法（JSON）**格式收集半结构化数据（如社交媒体评论），并以文本格式收集非结构化数据（如网站日志）。借助 Amazon S3，该公司可以轻松地将所有这些类型的数据存储在同一个数据湖中，而无需担心兼容性问题。\n\
  \n- **与其他 AWS 服务集成**：Amazon S3 可以轻松与其他 AWS 服务（如 Glue、Kinesis 和 Redshift）集成，用于数据处理、分析和可视化。\n\
  \n- **数据管理和治理**：Amazon S3 提供数据目录、元数据管理、数据沿袭和数据治理功能，使管理和组织大量数据变得容易。\n\n- **持久性和可用性**：持久性和可用性是\
  \ Amazon S3 中的两个重要概念。持久性是指 Amazon S3 在硬件故障时维持数据不丢失的能力，而可用性是指 Amazon S3 在用户请求时提供所存储数据的能力。持久性以**年故障率（AFR）**来衡量——即在给定年份中预期丢失的对象百分比。Amazon\
  \ S3 提供 11 个 9 的持久性，这意味着 AFR 为 0.000000001，即十亿分之一。这种高水平的持久性意味着存储在 Amazon S3 中的数据极不可能丢失。\n\
  \n可用性以对象成功可检索的时间百分比来衡量，Amazon S3 提供 4 个 9 的可用性，这意味着对象预计在 99.99% 的时间内可检索。这种高水平的可用性意味着用户可以期望几乎始终能够访问存储在\
  \ Amazon S3 中的数据。\n\n- **易于访问和共享**：Amazon S3 允许不同团队和用户轻松访问和共享数据，从而促进协作和自助式分析。\n\n\
  ## 在 Amazon S3 上设计数据湖的设计原则\n\n在 Amazon S3 上创建数据湖时，可以遵循以下几个设计原则：\n\n- **使用扁平文件结构**：在数据湖中，通常建议使用扁平文件结构而不是分层结构。这意味着所有数据都存储在文件系统的同一级别，而不是组织到子文件夹或嵌套目录中。扁平文件结构允许更轻松、更灵活的数据访问，因为无需浏览复杂的目录结构即可轻松查询数据。\n\
  \n- **使用分区**：分区是根据日期、位置或产品等属性将数据划分为逻辑部分的过程。这可以通过允许您轻松访问和查询特定数据子集来提高数据湖的性能和效率。\n\n\
  - **使用对象标记**：对象标记允许您以键值对的形式将元数据附加到数据。这些元数据可用于描述数据、对数据分类或提供额外的上下文。对象标记对于组织和管理数据湖中的大量数据非常有用。\n\
  \n- **使用数据治理**：在创建数据湖时，建立适当的数据治理非常重要。这包括定义角色和职责、制定数据政策和标准，以及实施安全和合规控制。\n\n- **使用数据管理工具**：数据管理工具（如\
  \ AWS Glue 或 Amazon EMR）可用于组织、清理和转换数据湖中的数据。这些工具还可以帮助自动化数据管道并提高数据处理的效率。\n\n总之，遵循这些设计原则可以帮助您在\
  \ Amazon S3 上创建一个组织良好且高效的数据湖。扁平文件结构、分区、对象标记、数据治理以及使用数据管理工具都有助于成功的数据湖设计。\n\n## 数据湖布局\n\
  \n数据湖布局是指数据在数据湖内的组织和结构方式。这包括数据在数据湖中的物理位置，以及数据在不同类别（如结构化和非结构化数据）中的逻辑组织。\n\n一般来说，数据湖布局旨在支持高效存储和管理来自各种不同来源的大量数据。这可以包括按来源、按类型或按与组织数据管理需求相关的某些其他标准来组织数据。\n\
  \n\n\n\n数据湖布局的一些常见要素包括以下内容：\n\n- **物理位置**：数据在数据湖中的物理位置，例如本地存储或基于云的存储\n- **逻辑组织**：将数据按不同类别进行逻辑组织，例如结构化和非结构化数据\n\
  - **数据血缘**：数据的历史记录，包括数据来源、处理方式以及使用方式\n- **元数据**：有关数据的信息，例如其格式、质量以及与组织的相关性\n- **安全与访问控制**：用于控制谁能访问数据以及确保数据保密性、完整性和可用性的策略和机制\n\
  \n总体而言，数据湖布局的目标是提供一个灵活且可扩展的框架，用于存储和管理大量数据，以支持组织的数据管理需求。\n\n## 在 Amazon S3 数据湖中组织和构建数据\n\
  \n根据组织的具体需求和条件，数据湖中的数据可以通过多种不同方式进行组织和构建。数据湖中一些常见的数据布局模式包括以下内容：\n\n- **结构化数据与非结构化数据**：数据湖中的数据可以根据是结构化还是非结构化来划分为不同类别。结构化数据是以固定格式组织的数据，例如数据库表中的行和列。而非结构化数据则是没有固定格式的数据，例如文本文档、图像或音频和视频文件。\n\
  - **按数据来源**：数据湖中的数据可以按收集来源进行组织，例如社交媒体信息流、传感器数据或事务系统。这可以帮助组织以一致且协调的方式管理和分析来自不同来源的数据。\n\
  - **按数据类型**：数据湖中的数据也可以按类型进行组织，例如客户数据、产品数据或销售数据。这可以帮助组织快速轻松地访问与其特定需求和使用场景相关的数据。\n\
  - **按时间**：数据湖中的数据也按时间进行组织，例如来自特定时间段的数据，或者在特定时间范围内更新或修改的数据。这可以帮助组织分析随时间的趋势和模式，并执行时间序列分析。\n\
  \n总体而言，数据湖中使用的具体数据布局模式将取决于组织的具体需求和条件。关键是选择一种能够支持组织数据高效、有效存储、管理和分析的数据布局模式。\n\n##\
  \ 在 Amazon S3 上构建数据湖的过程\n\n现在，让我们了解如何在 Amazon S3 上构建数据湖。\n\n首先，如果你还没有 AWS 账户，则需要创建一个。一旦你拥有\
  \ AWS 账户，就可以创建一个 S3 存储桶来存储数据。S3 存储桶是一个逻辑存储单元，用于存储对象，这些对象是构成数据湖的各个数据片段。\n\n创建 S3\
  \ 存储桶后，你就可以开始向其中上传数据。有几种方法可以做到这一点，包括使用 AWS 管理控制台、AWS 命令行界面（CLI）和编程 API。例如，你可以使用\
  \ AWS CLI 通过以下命令将数据上传到 S3 存储桶：\n\n```\naws s3 cp <local_file_path> s3://<your_bucket_name>/<object_key>\n\
  ```\n\n将数据上传到 S3 存储桶后，你可以通过在存储桶内创建文件夹和子文件夹来组织数据。这将使管理和访问数据变得更加容易。你还可以为数据应用标签，以帮助识别和分类数据。\n\
  \n数据组织并标记好后，就可以使用 Amazon Athena 开始查询数据。Athena 是一种无服务器交互式查询服务，可以轻松使用 SQL 分析 Amazon\
  \ S3 中的数据。Athena 与 S3 集成，因此你可以使用 SQL 轻松查询 S3 存储桶中的数据。\n\n你还可以使用其他工具和服务来访问和分析 S3\
  \ 数据湖中的数据。例如，你可以使用 Amazon EMR 通过托管的 Hadoop 框架处理和分析大型数据集。你还可以使用 Amazon Redshift 通过托管数据仓库对数据执行快速、复杂的查询。\n\
  \n总之，在 Amazon S3 上构建数据湖是一种简单且经济高效地存储和分析大量数据的方式。通过使用 S3 存储数据，你可以利用其持久性和可扩展性，并使用 Athena\
  \ 和 EMR 等工具轻松访问和分析数据。\n\n## 为数据湖选择正确的文件格式\n\n为 Amazon S3 上的数据湖选择正确的文件格式是一个重要决策，可能会影响数据湖的性能和效率。选择文件格式时需要考虑几个因素，包括数据的类型和结构、数据的预期用途以及与其他系统和工具的兼容性。\n\
  \nAmazon S3 数据湖中最流行的文件格式之一是 Apache Parquet 格式。这种列式文件格式针对大数据分析进行了优化，并支持复杂数据类型，例如嵌套数据结构和数组。它还非常高效，因为它支持压缩和高效的数据跳过，这可以改善查询性能。\n\
  \nAmazon S3 数据湖中另一种流行的文件格式是 Apache 优化的行纵列式（ORC）格式。这种格式类似于 Parquet，但提供了额外功能，例如支持复杂数据类型、索引和谓词下推。ORC\
  \ 文件也非常高效，支持快速数据摄取和查询处理。\n\n除了 Parquet 和 ORC，其他文件格式也可能适用于 Amazon S3 上的数据湖，具体取决于数据的特定需求和使用场景。例如，Apache\
  \ Avro 格式是数据序列化的热门选择，支持多种数据类型。Apache JSON 格式是在数据湖中存储数据的另一种选择，因为它是人类可读的，并且易于与其他系统集成。\n\
  \n最终，Amazon S3 数据湖的正确文件格式将取决于数据的特定需求和条件以及数据湖的预期用途。仔细评估可用选项并选择能够支持高效数据存储、处理和分析的文件格式非常重要。除了我们之前讨论的列式和行式文件格式外，文件格式的另一个重要特性是其可拆分性。在数据湖中，可拆分文件格式更受青睐，因为它们允许对大型数据集进行高效并行处理。让我们了解可拆分和不可拆分文件格式之间的区别。\n\
  \n可拆分文件格式是一种可以分成较小块并独立处理的文件格式，各个数据块可以重新组合以形成原始文件。可拆分文件格式的示例包括 Hadoop 的 HDFS 和 Apache\
  \ Cassandra 的**排序字符串表（SSTable）**。\n\n另一方面，不可拆分文件格式是一种不能拆分并独立处理的文件格式。不可拆分文件格式的一个示例是\
  \ PDF 文件。由于它是一种二进制文件格式，你可能无法轻松提取内容，因此它不能拆分为数据块进行处理。\n\n需要注意的是，某些文件可以转换为可拆分格式——例如，从\
  \ Excel 转换的 CSV，以及从 PDF 转换的 JSON。因此，如果需要，在将文件存储到数据湖之前将其转换为可拆分格式始终是一个好做法。\n\n| 文件格式\
  \ | 可拆分 | 不可拆分 |\n| :--- | :--- | :--- |\n|  | 单行分隔的 CSV | 多行 CSV |\n|  | 单行分隔的\
  \ JSON | 多行 JSON |\n|  | Apache Parquet |  |\n|  | Apache ORC |  |\n|  | Apache\
  \ Avro |  |\n|  | 带行级 snappy 压缩的 Apache Parquet |  |\n|  | 带行级 snappy 压缩的 Apache\
  \ ORC |  |\n|  | 带 gzip 压缩的 Apache Parquet |  |\n|  | XML |  |\n| 压缩类型 | bzip2 |\
  \ gzip |\n|  | zstd | LZO |\n|  |  | snappy |\n\n表 5.1 – 文件格式和压缩类型\n\n\n\n\n现在我们已经对列式/可拆分和行式/不可拆分的文件格式有了充分的了解，下面通过一个示例来巩固这些概念，我们将比较不同文件类型对性能和成本的影响。\n\
  \n在本例中，我们将使用 *Amazon Customer Reviews* 数据集，你可以在这里找到：`https://registry.opendata.aws/amazon-reviews/`。\n\
  \n该数据集包含自1995年以来1.3亿条客户评论记录，提供**制表符分隔值（TSV）**和**Parquet**两种文件格式。\n\n```text\n(base)\
  \ navn...@38f9d36a27bd ~ % aws s3 ls s3://amazon-reviews-pds/\n                \
  \              PRE parquet/\n                              PRE tsv/\n```\n\n![](img/e28602b44ec813a47df57c96b204412c_181_0.png)\n\
  \n**TSV**与CSV类似。它是一种用于以表格形式存储数据的简单文件格式——例如，数据库表或电子表格数据——表中的每一行表示为文件中的单独一行，表中的每个单元格由制表符分隔。\n\
  \n**Parquet**是一种面向列的文件格式，用于在文件中存储大量数据。它用于在分布式环境中存储数据，例如Hadoop集群中。Parquet针对高效的数据查询和存储进行了优化，并设计用于Apache\
  \ Spark和Impala等数据处理框架。\n\n首先，我们创建两张表——表1（`amazon_reviews_tsv`），基于TSV数据集构建；表2（`amazon_reviews_parquet`），基于Parquet数据集构建。`amazon_reviews_parquet`表不仅使用了Parquet文件格式，还按`product_category`进行了分区，如下面的截图所示：\n\
  \n```text\n(base) ... % aws s3 ls s3://amazon-reviews-pds/parquet/\n       PRE product_category=Apparel/\n\
  \       PRE product_category=Automotive/\n       PRE product_category=Baby/\n  \
  \     PRE product_category=Beauty/\n       PRE product_category=Books/\n       PRE\
  \ product_category=Camera/\n       PRE product_category=Digital_Ebook_Purchase/\n\
  \       PRE product_category=Digital_Music_Purchase/\n       PRE product_category=Digital_Software/\n\
  \       PRE product_category=Digital_Video_Download/\n       PRE product_category=Digital_Video_Games/\n\
  \       PRE product_category=Electronics/\n       PRE product_category=Furniture/\n\
  \       PRE product_category=Gift_Card/\n       PRE product_category=Grocery/\n\
  \       PRE product_category=Health_&_Personal_Care/\n       PRE product_category=Home/\n\
  \       PRE product_category=Home_Entertainment/\n```\n\n![](img/e28602b44ec813a47df57c96b204412c_181_1.png)\n\
  \n以下SQL代码用于定义amazon_reviews_tsv表：\n\n```sql\nCREATE EXTERNAL TABLE amazon_reviews_tsv(\n\
  \  marketplace string,\n  customer_id string,\n  review_id string,\n  product_id\
  \ string,\n  product_parent string,\n  product_title string,\n  product_category\
  \ string,\n  star_rating int,\n  helpful_votes int,\n  total_votes int,\n  vine\
  \ string,\n  verified_purchase string,\n  review_headline string,\n  review_body\
  \ string,\n  review_date date)\nROW FORMAT DELIMITED\n  FIELDS TERMINATED BY '\\\
  t'\n  ESCAPED BY '\\\\'\n  LINES TERMINATED BY '\\n'\nLOCATION\n  's3://amazon-reviews-pds/tsv/'\n\
  TBLPROPERTIES (\"skip.header.line.count\"=\"1\");\n```\n\n以下SQL用于定义按product_category分区的amazon_reviews_parquet表：\n\
  \n```sql\nCREATE EXTERNAL TABLE `amazon_reviews_parquet`(\n  `marketplace` string,\n\
  \  `customer_id` string,\n  `review_id` string,\n  `product_id` string,\n  `product_parent`\
  \ string,\n  `product_title` string,\n  `star_rating` int,\n  `helpful_votes` int,\n\
  \  `total_votes` int,\n  `vine` string,\n  `verified_purchase` string,\n  `review_headline`\
  \ string,\n  `review_body` string,\n  `review_date` bigint,\n  `year` int)\nPARTITIONED\
  \ BY ( `product_category` string )\nSTORED AS PARQUET\nLOCATION 's3://amazon-reviews-pds/parquet';\n\
  ```\n\n下表比较了TSV和Parquet表的执行时间、数据扫描量和成本：\n\n| 查询 | TSV (amazon_reviews_tsv) | Parquet\
  \ (amazon_reviews_parquet) | TSV | Parquet | TSV | Parquet |\n|---|---|---|---|---|---|---|\n\
  | | | | | | | |\n| SELECT count(*) FROM | 1 min 2.54 sec | 704 ms | 32.22 GB | 0\
  \ | $0.15 | $0 |\n| SELECT count(*) FROM \"<table>\" WHERE marketplace = 'US' |\
  \ 1 min 25.66 sec | 1.298 sec | 32.22 GB | 5.28 MB | $0.15 | $0.000025 |\n| SELECT\
  \ * FROM \"<table>\" WHERE marketplace = 'US' limit 1000; | 1.08 sec | 669 ms |\
  \ 1.88 MB | 2.69 MB | | |\n| select distinct product_category from \"<table_name>\"\
  \ | 1 min 16 sec | 1.38 sec | 32.22 GB | 0 | | 0 |\n\n| SQL 查询 | TSV 执行时间 | Parquet\
  \ 执行时间 | TSV 数据扫描 | Parquet 数据扫描 | TSV 成本 | Parquet 成本 |\n|---|---|---|---|---|---|---|\n\
  | `SELECT product_id, product_title, count(*) as num_reviews, avg(star_rating) as\
  \ avg_stars FROM <table_name> where product_category='Toys' GROUP BY 1, 2 ORDER\
  \ BY 3 DESC limit 100;` | 1 min 17 sec | 2.27 sec | 32.22 GB | 215 MB | $0.15 |\
  \ $0.00102 |\n\n表5.2 – 比较TSV和Parquet文件执行时间、数据扫描量和成本的表格\n\n如果你查看表中关于执行时间、数据扫描量和成本的统计数据，你就会清楚地了解为什么需要将数据存储为Parquet这样的优化列式文件格式。\n\
  \n例如，当数据以未分区的TSV格式存储时，在大多数查询中，你需要扫描整个数据集（例如，运行`count(*)`或`distinct`）或数据集的一部分。\n\n\
  类似地，当数据以带分区的Parquet格式存储时，在`count(*)`和`distinct`等情况下，它不需要扫描数据集，因为它维护了关于数据的统计信息。如果你需要在TSV中运行诸如WHERE子句之类的过滤语句，它必须扫描整个数据集；而如果数据已分区，它只会扫描特定的分区，最终使查询更快，因为扫描的数据量大大减少。\n\
  \n# 为数据湖选择正确的压缩方法\n\n为Amazon S3中的数据湖选择正确的压缩方法是一个重要决策，它会影响数据湖的性能和效率。压缩有助于减少数据所需的存储空间，同时提高数据传输和查询处理的速度。\n\
  \nAmazon S3数据湖中最流行的压缩方法之一是Snappy压缩算法。该算法专为高速数据压缩和解压缩而设计，能够在压缩比和性能之间取得良好平衡。Snappy受到许多流行的大数据框架支持，例如Apache\
  \ Spark和Apache Flink，并且可以轻松集成到数据管道和应用程序中。\n\n另一种流行的Amazon S3数据湖压缩方法是gzip压缩算法。该算法广泛用于数据压缩，并提供比Snappy更高的压缩比。然而，gzip可能比Snappy慢，因此可能不适合实时或交互式数据处理应用程序。\n\
  \n除了Snappy和gzip之外，其他压缩算法也可能适用于Amazon S3中的数据湖，具体取决于数据的特定需求和使用场景。例如，LZO算法是数据压缩的热门选择，因为它提供高压缩比和良好性能。LZ4算法是另一个选项，因为它提供高压缩速度和低内存占用。\n\
  \n最终，为Amazon S3中的数据湖选择正确的压缩方法将取决于数据的特定需求和要求以及数据湖的预期用途。仔细评估可用选项并选择一种能够支持高效数据存储、处理和分析的压缩算法非常重要。\n\
  \n# 为数据湖选择正确的分区策略\n\n为数据湖选择正确的分区策略是一个重要决策，它会影响数据湖的性能和效率。分区是将大型数据集划分为更小、更易于管理的部分（称为分区）的过程。每个分区都独立存储和管理，并且可以独立查询和处理。\n\
  \n数据湖最常见的分区策略之一是按时间对数据进行分区。这对于按固定间隔生成的数据（例如传感器数据、日志数据或财务数据）非常有用。基于时间的分区可以高效查询和处理特定时间范围内的数据，还可以支持数据归档和数据保留策略。你可以在这里看到按日期分区的示例：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_185_0.png)\n\n\n\n\n![](img/e28602b44ec813a47df57c96b204412c_187_0.png)\n\
  \n图 5.6 – Amazon S3 生命周期规则\n\n点击**创建生命周期规则**，为驻留在该 Amazon S3 存储桶中的数据创建数据生命周期。随后您应该看到类似这样的屏幕：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_187_1.png)\n\n图 5.7 – 配置 Amazon S3 生命周期规则\n\
  \n除了 Amazon S3 生命周期，Amazon S3 还提供 Amazon S3 智能分层（Intelligent-Tiering）。\n\nAmazon\
  \ S3 智能分层是一种存储类，它根据访问模式的变化自动将数据移动到最具有成本效益的存储层。数据会自动在两个访问层之间转换：一个用于频繁访问的数据，另一个用于不频繁访问的数据。这有助于您在确保频繁访问的数据始终能以低延迟可用的同时优化成本。\n\
  \n总之，S3 智能分层可以根据访问模式将数据从不频繁访问层移动到 S3 频繁层。但生命周期策略只会导致数据向更不频繁的访问层移动（反之则不然）。\n\n您可以通过创建或选择您希望用于智能分层的现有存储桶来配置\
  \ Amazon S3 智能分层。从存储桶的属性选项卡中，从存储类列表中选择智能分层。一旦选择了智能分层类，您就可以为存储桶配置多项设置，例如对象锁定、版本控制和事件。您还可以设置生命周期规则，以便根据某些条件自动在频繁和不频繁访问层之间移动对象。图\
  \ 5.8 和图 5.9 说明了如何配置智能分层：\n\n![](img/e28602b44ec813a47df57c96b204412c_188_0.png)\n\
  \n图 5.8 – 配置 Amazon S3 智能分层\n\n![](img/e28602b44ec813a47df57c96b204412c_188_1.png)\n\
  \n图 5.9 – Amazon S3 智能分层配置\n\n仔细评估数据湖的生命周期规则和策略，并选择支持数据湖性能、可扩展性和成本效益的正确选项至关重要。同样重要的是定期审查和更新生命周期规则和策略，以确保它们仍然相关且有效。\n\
  \n## 优化文件数量和每个文件的大小\n\n优化 Amazon S3 中的文件数量和每个文件的大小，可以帮助提高使用 S3 作为数据存储的应用程序的性能和效率。以下是一些优化\
  \ Amazon S3 中文件数量和文件大小的技巧：\n\n- **使用较大的文件尺寸：** 通常，存储和检索较大文件比小文件更高效。这是因为 S3 对数据传输和请求收取费用，而这些费用基于请求数量而非传输的数据量。因此，使用较大的文件尺寸有助于减少请求数量并降低使用\
  \ S3 的总体成本。\n- **使用一致的文件尺寸：** 使用一致的文件尺寸可以更容易地管理和处理您的数据。它还可以提高应用程序的性能，因为数据可以更轻松地分割并并行处理。\n\
  - **使用合理的文件数量：** 虽然使用较大的文件尺寸可能更高效，但文件太少可能导致非常大的文件，难以管理和处理。另一方面，拥有太多小文件也可能效率低下，因为它可能导致大量请求和成本增加。在文件大小和文件数量之间找到平衡有助于优化性能和成本。\n\
  - **使用前缀和分区：** 使用前缀和分区有助于在 S3 中组织和管理大量文件。前缀允许您将相关文件分组在一起，而分区允许您根据日期或位置等属性将数据划分为逻辑部分。这使得访问和处理特定数据子集变得更加容易。\n\
  \n优化 Amazon S3 中文件数量和文件大小的方法有几种，如下所示：\n\n- **对大文件使用多部分上传：** 多部分上传允许您将大文件分成较小的块进行上传，这比上传一个大文件更高效。\n\
  - **使用较小的文件尺寸：** 尝试将一个大文件拆分成多个小文件，而不是上传一个大文件。这可以减少上传和下载文件所需的时间。\n- **使用对象生命周期策略：**\
  \ 如前文所述，设置对象生命周期策略以自动删除或归档不再需要的旧文件，有助于减少 S3 存储桶中的文件数量并降低存储成本。\n- 使用 AWS Glue 或 AWS\
  \ EMR 对 S3 中的数据运行分析，然后从 S3 存储桶中删除不必要的数据。\n- 如前一节所述，使用 AWS S3 智能分层、S3 **标准 - 不频繁访问\
  \ (Standard-IA)** 和 S3 **单一区域 - 不频繁访问 (One Zone-IA)** 来存储不频繁访问的文件，可能有助于降低存储这些文件的成本。\n\
  - 为 S3 存储桶中的文件启用服务器端压缩，有助于减少所需的存储空间。\n\n总之，优化 Amazon S3 中文件数量和文件大小涉及找到一种平衡，在提高性能和效率的同时最小化成本。使用较大的文件尺寸、一致的文件尺寸、合理的文件数量，以及利用前缀和分区，都有助于优化\
  \ S3 在数据存储需求方面的使用。\n\n在本节中，我们学习了如何优化您的数据湖。在下一节中，我们将讨论在构建数据湖时应了解挑战和注意事项。\n\n## 在\
  \ Amazon S3 上构建数据湖时的挑战与注意事项\n\n在 Amazon S3 或一般意义上的数据湖上构建数据湖时，以下是一些需要了解挑战和注意事项：\n\
  \n- **数据摄取：** 将数据引入数据湖的过程可能具有挑战性，特别是当数据来自具有不同格式和结构的多个源时。这可能导致确保数据质量和一致性变得困难。此外，处理大量数据可能是一个挑战，特别是随着数据的增长。另一个问题是保持架构变更在所有下游应用中的一致性。\n\
  \n- **数据治理：** 在处理数据湖中的大量数据时，维持数据质量、安全性和合规性可能很困难。实施数据分类、质量和保留的政策和标准，以及管理访问和权限（包括**基于角色的访问控制\
  \ (RBAC)** 和数据加密）可能具有挑战性。此外，通过谱系和审计跟踪数据来源和使用情况、管理数据保留和归档，以及保护数据免受泄露和未授权访问也可能很困难。\n\
  \n- **数据管理：** 组织和存储在数据文件和对象存储中的大量数据可能是一个挑战。此外，将数据谱系和治理纳入数据管理流程、管理存储和检索成本，以及将数据湖与其他数据管理和分析工具和服务集成可能具有挑战性。确保数据质量和一致性、为不同用户和团队提供数据访问和自助服务、随着数据量增加管理可扩展性和性能，以及管理数据备份和**灾难恢复\
  \ (DR)** 也是数据湖中数据管理的挑战。\n\n- **数据处理：** 数据湖内的数据处理——包括数据转换、清理和分析等任务——可能很困难，可能需要专门的工具和技术，例如\
  \ AWS Glue、Kinesis 等。挑战可能包括与其他 AWS 服务集成以用于数据处理和分析、管理数据处理和计算资源的成本、处理实时和批量处理、维持数据质量和一致性、为不同用户和团队提供访问和自助服务、保护敏感数据以及满足性能和可用性要求。\n\
  \n\n\n\n\n- **数据访问**：为不同用户和组启用对数据湖中数据的轻松高效访问可能是一项复杂的任务，尤其是在多租户环境中工作时。\n- **成本**：在\
  \ Amazon S3 上存储和处理大量数据的成本可能很高，需要仔细管理。这就是为什么设置 S3 存储桶生命周期很重要。\n- **数据安全**：有必要确保敏感数据得到保护并符合合规要求。我们将在安全和监控章节中探讨数据安全挑战。\n\
  - **性能**：数据湖性能应得到优化，以确保数据易于用于分析和报告。这就是为什么实施 *在 Amazon S3 数据湖中组织和结构化数据* 部分中描述的最佳实践非常重要。\n\
  \n## 摘要\n\n在本章中，我们讨论了大数据是什么、大数据的特征、数据湖是什么、为什么我们需要数据湖，以及如何在 Amazon S3 上构建数据湖，通过概述数据湖的好处、数据湖的不同层以及在\
  \ Amazon S3 上构建数据湖的最佳实践。我们还提供了在 S3 上的数据湖中组织和管理数据的详细信息，包括使用文件格式、分区、S3 生命周期管理、Amazon\
  \ S3 Intelligent-Tiering 等功能。本章还讨论了在 Amazon S3 上构建数据湖时的一些挑战和注意事项，例如成本和性能。\n\n在下一章中，我们将学习\
  \ AWS Glue。AWS Glue 是一种数据集成服务，可让您从不同的数据源获取数据，并允许您使用 Apache Spark 和 Python 等框架在其上执行\
  \ ETL。\n"
- "## 6\n\n## 使用 AWS Glue\n\n在前一章中，我们讨论了各种数据存储类型，包括数据仓库、数据湖、数据湖仓和数据网格，以及它们的关键区别。\n\
  \n本章将探讨 AWS Glue 的不同组件，提供有关它们如何帮助数据整理任务的见解。\n\n完成本章后，您将能够理解并定义 AWS Glue 如何用于数据整理。您还将能够解释与各种\
  \ AWS Glue 功能相关的基本概念，例如 AWS Glue 数据目录、AWS Glue 连接、AWS Glue 爬虫、AWS Glue Schema Registry、AWS\
  \ Glue 作业、AWS Glue 开发端点、AWS Glue 交互式会话和 AWS Glue 触发器。\n\n本章将涵盖以下主题：\n\n- Spark 基础\n\
  - AWS Glue 功能\n- 使用 AWS Glue 进行数据发现\n- 使用 AWS Glue 进行数据摄取\n\n### 什么是 Apache Spark？\n\
  \nApache Spark 是一个用于处理大数据的统一分析引擎，于 2009 年在加州大学伯克利分校的 AMPLab 作为开源项目开发。最初，它是作为一个课程项目创建的，旨在解决\
  \ Hadoop 框架在机器学习用例中通过 HDFS 在迭代之间交换数据的局限性。目标是设计一个用于快速交互式处理的新框架，包括机器学习和交互式数据分析，同时保留\
  \ Hadoop 框架的 MapReduce 和 HDFS 的隐式数据并行性和容错性。它结合了内存缓存，并针对任何规模的分析工作负载进行了优化。\n\nApache\
  \ Spark 于 2010 年根据 BSD 许可证开源，并在 2013 年贡献给 Apache 软件基金会。2014 年，Spark 成为顶级 Apache\
  \ 项目。它已获得超过 1.7 千名贡献者和 GitHub 上超过 30K 星标。\n\n根据 Spark 文档，该引擎在 Java、Scala、Python\
  \ 和 R 中提供高级 API，并通过优化的引擎支持通用执行图。此外，它还提供了一系列高级工具，使处理不同类型的数据和执行特定任务变得更容易。例如，Spark\
  \ SQL 允许您处理结构化数据并执行 SQL 查询。如果您更喜欢使用 pandas 进行数据分析，您也可以使用 Spark 上的 pandas API 来利用其功能。对于机器学习任务，有\
  \ MLlib，它提供工具和算法来帮助您构建和训练模型。如果您正在处理图数据，GraphX 可用于帮助图处理。最后，如果您需要对数据流执行计算并处理增量更新，您可以使用\
  \ Structured Streaming，它使 Spark 能够进行流处理。\n\n### Apache Spark 架构\n\n在高层次上，Apache\
  \ Spark 在领导者和工作节点架构上运行，其中有一个中央协调器和多个分布式工作节点。它包括驱动程序、多个执行器和集群管理器。驱动程序将用户的代码转换为可在工作节点之间分发的多个任务。执行器在工作节点上运行并执行分配给它的任务。需要集群管理器来在驱动程序和工作节点之间进行调解。\n\
  \n驱动程序和工作节点的协作称为 Spark 集群，驱动程序和工作器的有效组合称为 Spark 应用程序。\n\nSpark 应用程序可以借助集群管理器启动。有许多集群管理器类型：\n\
  \n- **Standalone**：这是一个简单的集群管理器，随 Spark 一起捆绑。它提供了一种简单的方法来设置和管理您的集群。\n- **Apache\
  \ Mesos**：Mesos 是一个多功能集群管理器，可以处理各种工作负载，包括运行 Hadoop MapReduce 和服务应用程序。然而，值得注意的是，Mesos\
  \ 现在已被弃用，可能不是首选。\n- **Hadoop YARN**：YARN 是 Hadoop 2 和 Hadoop 3 中使用的资源管理器。它提供集群管理功能，可与\
  \ Spark 配合使用以运行和分配资源。\n- **Kubernetes**：Kubernetes 是一个开源系统，旨在自动化部署、扩展和管理容器化应用程序的过程。它也可以用于管理\
  \ Spark 集群，提供灵活性和可扩展性：\n\n![](img/e28602b44ec813a47df57c96b204412c_195_0.png)\n\n\
  让我们了解驱动程序的职责：\n\n- 驱动程序是一个 Java 进程，负责运行 Scala、Python 和 Java 的 main() 方法\n- 它执行用户代码并创建\
  \ SparkSession，该会话负责创建 **弹性分布式数据集 (RDD)**\n- 它创建血统，即逻辑和物理计划\n- 驱动程序负责通过与集群管理器协调来安排任务的执行\n\
  - 它跟踪已在执行器内存中缓存的数据的元数据\n\n让我们了解执行器的职责：\n\n- 执行器由核心（slot）、内存和本地存储组成\n- Slot 表示可用于\
  \ Spark 并行工作的线程\n- 它们还包含两种类型的内存：\n  - **工作内存**：Spark 工作负载使用此内存\n  - **存储内存**：一半内存（存储）用于持久化对象\n\
  - 它们还包含磁盘，直接附加并为 shuffle 分区（Spark shuffle 分区是在 shuffle 过程中数据在阶段之间交换以促进数据交换的中间数据划分）提供空间，以供\
  \ shuffle 阶段使用\n\n- 它们负责运行单个任务并将其返回给驱动程序：\n\n![](img/e28602b44ec813a47df57c96b204412c_196_0.png)\n\
  \n要在 Spark 集群上开始运行应用程序，您可以使用位于 Spark `bin` 目录中的 `spark-submit` 脚本。该脚本充当统一接口，允许您启动应用程序，而无需为\
  \ Spark 支持的每个集群管理器单独配置它们。这意味着您可以使用不同的集群管理器，而无需为每个集群管理器单独修改应用程序设置。\n\n现在我们对 Apache\
  \ Spark 架构有了合理的了解，让我们继续探索 Apache Spark 框架。\n\n### Apache Spark 框架\n\nApache Spark\
  \ 框架是一个用于大规模数据处理的统一分析引擎。它由四个主要组件组成：Spark Core、Spark SQL、Spark Streaming 和 GraphX。\n\
  \nApache Spark Core 是 Spark 平台的基础或基本单元，提供内存计算能力。Spark Core 促进并行和分布式处理、任务调度、分派和基本\
  \ I/O 功能。Spark Core 可通过为 Scala、Python、Java 和 R 开发的 **应用程序编程接口 (API)** 访问。Spark API\
  \ 降低了分布式并行处理引擎的复杂性。Spark 利用一种特殊类型的数据结构\n\n\ncalled RDD to handle data. RDD represents\
  \ a logical collection of data that is spread across multiple machines in the cluster.\n\
  \nHere are some key modules in Spark and what they offer:\n\n- Spark SQL: This module\
  \ focuses on processing structured data. It introduces a programming abstraction\
  \ called DataFrames, which provides a convenient way to work with structured data.\
  \ Additionally, Spark SQL can be used as a distributed SQL query engine, allowing\
  \ you to query and analyze data using SQL-like syntax.\n- Spark Streaming: With\
  \ Spark Streaming, you can build powerful applications that process both real-time\
  \ streaming data and historical data. It inherits Spark's user-friendly nature and\
  \ fault-tolerance capabilities, making it easier to develop interactive and analytical\
  \ applications that can handle continuous streams of data.\n- GraphX: GraphX is\
  \ an engine built on top of Spark that specializes in graph computation. It empowers\
  \ users to interactively create, transform, and reason about large-scale graph data.\
  \ This is particularly useful for applications that involve analyzing and processing\
  \ data with complex relationships, such as social networks or web graphs:\n\n![](img/e28602b44ec813a47df57c96b204412c_197_0.png)\n\
  \n## Resilient Distributed Datasets\n\nSpark introduces the concept of RDD. It is\
  \ a logical collection of data partitioned across different machines. RDD is the\
  \ fundamental data structure of Spark. It is an immutable, fault-tolerant, distributed\
  \ collection of objects of any type that operate in parallel:\n\n![](img/e28602b44ec813a47df57c96b204412c_198_0.png)\n\
  \nFigure 6.4 – Spark framework\n\nRDDs are immutable but you can modify them with\
  \ transformations. However, these transformations return a new RDD, while the original\
  \ RDD remains the same.\n\nRDDs support two types of operations:\n\n- **Transformations**\
  \ are operations (for example, select, read, filter, groupBy, sort, and so on) that\
  \ are performed on an RDD and which yield a new RDD containing the result.\n\nThe\
  \ official Spark page provides a comprehensive list of all available transformations\
  \ (https://spark.apache.org/docs/1.2.1/programming-guide.html#transformations).\n\
  \n- **Actions** are operations (for example, reduce, count, first, and so on) that\
  \ return a value after running a computation on an RDD.\n\nThe official Spark page\
  \ provides a comprehensive list of all the available actions (https://spark.apache.org/docs/1.2.1/programming-guide.html#actions).\n\
  \nTransformations in Spark are called “lazy evaluation.” Lazy evaluation means the\
  \ transformation will not be executed until an action is triggered.\n\nAnother important\
  \ concept in Apache Spark is Spark SQL. Spark SQL is a programming module for structured\
  \ data processing.\n\n## Datasets and DataFrames\n\nAccording to the Apache Spark\
  \ documentation, DataFrames are a crucial aspect of any framework. DataFrames consist\
  \ of named columns and can be thought of as tables in a relational database or a\
  \ DataFrame in R/Python but with enhanced optimizations. They can be created from\
  \ a variety of sources, including structured data files, tables in Hive, external\
  \ databases, or existing RDDs. The DataFrame API is available in Scala, Java, Python,\
  \ and R, with Scala and Java representing DataFrames as a dataset of rows; in the\
  \ Java API, Dataset<Row> is used to represent a DataFrame. Now that we understand\
  \ Apache Spark, we can start learning about AWS Glue and its building blocks.\n\n\
  ## AWS Glue building blocks\n\nAWS Glue Crawler allows you to crawl data from various\
  \ data sources, including S3, and databases such as Redshift, MySQL, MSSQL, Oracle,\
  \ and MongoDB, among others. Once the crawling process is complete, AWS Glue Crawler\
  \ automatically creates or updates tables in the AWS Glue Data Catalog. A list of\
  \ supported data sources can be found at https://docs.aws.amazon.com/glue/latest/dg/crawler-data-stores.html:\n\
  \n- **AWS Glue Data Catalog**: The AWS Glue Data Catalog is a centralized catalog\
  \ that stores metadata from various data stores. These can be used by other AWS\
  \ services such as Amazon Athena, Amazon QuickSight, Amazon EMR, and Amazon Redshift.\n\
  - **AWS Glue Triggers**: AWS Glue Triggers enable you to create schedules that can\
  \ manually or automatically start one or more AWS Glue Crawlers or AWS Glue ETL\
  \ jobs. Triggers can be configured to fire on demand, based on a schedule, or based\
  \ on a combination of events.\n- **AWS Glue Workflows**: AWS Glue Workflows enable\
  \ you to orchestrate the execution of Glue ETL and Glue Crawler using a Glue Trigger.\n\
  - **AWS Glue ETL**: AWS Glue ETL allows users to create **Extract, Transform, and\
  \ Load** (ETL) pipelines using Python, PySpark, or Scala. With Glue ETL, you can\
  \ process data from various data sources, perform transformations, and eventually\
  \ write to different data sources (such as Amazon Redshift, Oracle, OpenSearch,\
  \ and Amazon S3). You have the option to choose from different processing engines:\
  \ for distributed processing, you can choose between PySpark and Scala, while for\
  \ non-distributed processing, you can select Python:\n\n![](img/e28602b44ec813a47df57c96b204412c_199_0.png)\n\
  \nFigure 6.5 – Simple data pipeline using AWS Glue\n\n- AWS Glue interactive sessions:\
  \ AWS Glue interactive sessions provide a managed Jupyter notebook-based integrated\
  \ development environment (IDE) for developing and testing AWS Glue ETL scripts.\n\
  \n- AWS Glue Schema Registry: AWS Glue Schema Registry is a tool that allows users\
  \ to have centralized control over data stream schemas. It seamlessly works with\
  \ popular data streaming platforms such as Apache Kafka, Amazon Kinesis, and AWS\
  \ Lambda. With AWS Glue Schema Registry, you can easily manage and govern the schemas\
  \ used in your data streams, ensuring consistency and compatibility across different\
  \ components of your data processing pipeline.\n\n- AWS Glue Blueprint: AWS Glue\
  \ Blueprint allows users to scale similar ETL use cases by parameterizing a single\
  \ workflow to handle them all -- for example, crawling different S3 buckets. Blueprint\
  \ examples can be found here: https://github.com/aws-labs/aws-glue-blueprint-libs/tree/master/samples.\n\
  \n- AWS Glue Connections: AWS Glue Connections are catalog objects that provide\
  \ a convenient way for users to create and store connection information for different\
  \ data stores. These connections act as a bridge between AWS Glue and various data\
  \ sources. With AWS Glue Connections, you can easily configure and manage the necessary\
  \ connection details for your data stores.\n\nIn addition to standard data stores,\
  \ AWS Glue Connections also support Marketplace AWS Glue Connectors. These connectors\
  \ enable integration with third-party data stores such as Apache Hudi, Google Big\
  \ Query, and Elasticsearch. This means you can seamlessly connect and interact with\
  \ these external data sources using AWS Glue, making it easier to access and process\
  \ data from diverse systems in a unified manner.\n\nWe have now gained a fundamental\
  \ understanding of Apache Spark and AWS Glue’s building blocks. In the following\
  \ discussion, we will delve into the various components of AWS Glue to comprehend\
  \ how it can be employed in data wrangling.\n\n## Data discovery with AWS Glue\n\
  \nOne of the unique features that sets AWS Glue apart from other ETL tools is its\
  \ ability to create a centralized data catalog. This catalog is crucial for performing\
  \ data discovery and relies on two important components of Glue:\n\n- Glue Data\
  \ Catalog\n- Glue Data Crawler\n\n### AWS Glue Data Catalog\n\nA data catalog is\
  \ a centralized storage of metadata for data stored in different data stores, such\
  \ as data lakes, data warehouses, relational databases, and non-relational databases.\
  \ The metadata contains information about columns, data formats, locations, and\
  \ serialization/deserialization mechanisms. Hive Metastore is one of the most popular\
  \ metadata products used in the industry. However, it uses\n\n**relational database\
  \ management systems (RDBMSs)** such as MySQL and PostgreSQL. The problem with using\
  \ an RDBMS for Hive metadata is managing and maintaining it, especially for production\
  \ workloads where high availability, scaling, and redundancy must be taken into\
  \ account. This increases the complexity and cost of the solution. AWS Glue Data\
  \ Catalog solves this problem with its serverless nature, eliminating the need for\
  \ additional administrative overhead in managing the infrastructure.\n\nAWS Glue\
  \ Data Catalog is comprised of the following:\n\n- Databases\n- Tables\n- Partitions\n\
  - Partition indexes\n\n### Databases\n\nIn AWS Glue, a database is a grouping of\
  \ metadata tables. Whenever a table is created in AWS Glue Data Catalog, it must\
  \ be associated with a specific database. It’s not possible to have the same table\
  \ present in multiple databases:\n\n![](img/e28602b44ec813a47df57c96b204412c_201_0.png)\n\
  \nFigure 6.6 – Databases in AWS Glue Data Catalog\n\n### Tables\n\nAn AWS Glue Data\
  \ Catalog table is a metadata representation of your data. It contains various information\
  \ about your data, such as its name, description, location, input/output format,\
  \ serialization libraries, schema, partitions, indexes, and more.\n\n\n\n\n\nAWS\
  \ Glue Data Catalog 支持表的版本控制，这意味着每当表被更新时，默认会创建该表的一个新版本。这是一个关键功能，用于识别源中的任何 schema\
  \ 变更，并防止因这些变更而导致下游应用程序故障。请查看这篇博客文章，它解释了如何使用 AWS Glue 检测数据源结构中的任何变化：https://aws.amazon.com/blogs/big-data/identify-source-schema-changes-using-aws-glue/\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_202_0.png)\n\n图 6.7 – AWS Glue Data Catalog\
  \ 中的表属性\n\n![](img/e28602b44ec813a47df57c96b204412c_202_1.png)\n\n图 6.8 – AWS Glue\
  \ Data Catalog 中的表属性\n\n## 分区\n\n分区是一种用于优化查询性能的策略，它根据特定列的值来划分表。一个表可以有多个分区键，这些分区键定义了一个特定的分区（也称为分区规范）。该技术通过减少处理特定查询所需的数据量来提升查询性能：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_203_0.png)\n\n图 6.9 – AWS Glue Data Catalog\
  \ 表中的分区\n\n## Glue 连接\n\nAWS Glue 提供了 Glue 连接，允许你连接到不同的数据源。Glue 连接存储了建立数据源连接所需的重要信息，例如登录凭证、连接字符串（URI）和\
  \ VPC 配置详细信息（VPC 子网和安全组信息）：\n\n![](img/e28602b44ec813a47df57c96b204412c_203_1.png)\n\
  \n图 6.10 – AWS Glue 连接\n\n在介绍了 AWS Glue Data Catalog 的基础知识之后，我们接下来要讨论的是 AWS Glue\
  \ 爬网程序和分类器，以及它们在促进数据发现方面的作用。\n\n## AWS Glue 爬网程序\n\nGlue 爬网程序允许你从不同类型的数据存储中抓取数据，推断其\
  \ schema，并将抓取的数据集的元数据填充到 AWS Glue Data Catalog 中：\n\n![](img/e28602b44ec813a47df57c96b204412c_204_0.png)\n\
  \n图 6.11 – Glue 爬网程序的工作流程\n\nGlue 爬网程序的工作流程包含几个阶段：\n\n1. **分类：**\n\n   在 AWS Glue\
  \ 中，分类器负责检查数据存储中的数据并确定其格式。一旦识别出格式，分类器就会为数据生成适当的 schema。\n\n   为了执行此任务，Glue 提供了内置和自定义分类器。当你创建并运行\
  \ Glue 爬网程序时，它首先会按照爬网程序配置中定义的顺序应用你指定的自定义分类器。在 schema 识别过程中，这些自定义分类器会被优先考虑。\n\n为了说明这个示例，我们将使用\
  \ COVID-19 数据集，该数据集可在 AWS 开放数据（Open Data on AWS）中找到：\n\n1. 转到 **Registry of Open\
  \ Data on AWS**（https://registry.opendata.aws/）页面。在 **Search datasets** 搜索框中，输入\
  \ `COVID-19 Data Lake` 作为搜索条件。你应该会看到一个数据集 **COVID-19 Data Lake** 作为结果。\n2. 点击页面上的\
  \ **Details**（https://registry.opendata.aws/aws-covid19-lake/）链接；你将看到有关如何访问该数据集的\
  \ AWS 资源信息。\n3. 你可以使用 AWS CLI（https://aws.amazon.com/cli/）从 Amazon S3 位置访问数据：\n\n\
  \   ```\n   aws s3 ls --no-sign-request s3://covid19-lake/\n   ```\n\n4. 对于我们的示例，我们希望使用\
  \ COVID-19 数据集的子集：\n\n   ```\n   aws s3 ls s3://covid19-lake/rearc-covid-19-testing-data/\n\
  \   ```\n\n5. 转到 AWS Glue 控制台（https://console.aws.amazon.com/glue/），点击左侧的 **Databases**。\n\
  6. 点击 **Add Database**，然后点击 **Create**，创建一个名为 `chapter6_covid19` 的数据库。\n\n要继续此示例，下一步是创建\
  \ Glue Catalog 数据库。\n\n![](img/e28602b44ec813a47df57c96b204412c_206_0.png)\n\n要继续此示例，下一步是创建\
  \ Glue 爬网程序。\n\n7. 点击左侧的 **Crawlers**。\n8. 点击 **Create Crawler**。\n9. 在 **Set crawler\
  \ properties** 页面上，为新爬网程序提供一个名称，例如 `chapter-gluecrawler`，然后点击 **Next**。\n10. 在 **Choose\
  \ data sources and classifiers** 页面上，在 **Data source configuration** 下选择 **Not Yet**。\n\
  11. 点击 **Add a data store**，在 **Location of S3 data** 下选择 **In a different account**，在\
  \ **S3 path** 下设置 `s3://covid19-lake/rearc-covid-19-testing-data/`，然后点击 **Add an\
  \ S3 data source**。接着点击 **Next**，其余选项保持默认。\n12. 在 **Configure security settings**\
  \ 页面上，点击 **Create new IAM role** 并提供 `AWSGlueServiceRole-covid19`。然后点击 **Create**，再点击\
  \ **Next**。\n13. 在 **Set output and scheduling** 页面上，在 **Output configuration**\
  \ 部分，从 **Database** 下拉列表中选择 `chapter6_covid19`。输入 `covid19_` 作为添加到表的前缀（可选），并在 **Crawler\
  \ schedule** 下将频率保持为 **on demand**。\n14. 检查所有配置并点击 **Create crawler**。\n\n![](img/e28602b44ec813a47df57c96b204412c_207_0.png)\n\
  \n图 6.13 – AWS Glue – 爬网程序\n\n15. 现在我们已经创建了爬网程序，点击它旁边的复选框，然后通过点击页面顶部的 **Run** 按钮来运行该爬网程序。爬网程序需要一两分钟才能完成。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_207_1.png)\n\n图 6.14 – AWS Glue – 运行\n\
  \n一旦爬网程序成功完成，它将列出四个表。让我们转到数据库并查看表定义：\n\n![](img/e28602b44ec813a47df57c96b204412c_207_2.png)\n\
  \n图 6.15 – AWS Glue – 爬网程序状态\n\n观察表的位置和分类，我们可以看到它指向 COVID-19 数据集，并为不同的文件类型提取数据库定义——在本例中是\
  \ CSV 和 JSON。正如你所了解的，Glue 爬网程序允许你从不同的 AWS 账户抓取数据，这在构建集中式数据目录（数据存储在不同 AWS 账户中）时非常有用：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_208_0.png)\n\n图 6.16 – AWS Glue Data\
  \ Catalog 表\n\n通过点击表名（本例中为 `covid19_csv`），你可以查看表定义。正如我们之前所学，这提供了有关表的有价值信息，包括统计信息和元数据：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_208_1.png)\n\n图 6.17 – AWS Glue Catalog\
  \ 表属性\n\n## 表统计信息\n\n在 AWS Glue 中，表统计信息是指 Glue Data Catalog 中有关表的统计信息。这些统计信息包括每列中总计值和不同值的数量、最小值和最大值，以及值的平均长度。这些信息对于查询优化和性能调优非常重要：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_209_0.png)\n\n表统计信息可以通过 AWS Glue 控制台或\
  \ Glue API 进行查看和更新。它们也可以由 AWS Glue 爬网程序在数据发现过程中自动收集。\n\nGlue Data Catalog 中的表统计信息提供了有关数据目录中存储的表的重要元数据。这些统计信息包括表中的行数、表的大小，以及列统计信息（如最小值、最大值、数据分布和数据类型）。这些统计信息在\
  \ AWS Glue 中的查询优化和性能调优中发挥着关键作用。\n\nAWS Glue 和查询引擎（如 Amazon Athena 或 Amazon Redshift\
  \ Spectrum）会利用这些表统计信息来制定关于查询执行计划的明智决策。以下是表统计信息的重要性以及如何利用它们进行查询优化和性能调优：\n\n- **查询规划：**\
  \ 查询优化器使用表统计信息来估计查询中所涉及表的基数（行数）和数据分布。这种估计有助于优化器选择最高效的查询执行计划。准确的统计信息使优化器能够做出更好的决策，从而加快查询处理速度并提高效率。\n\
  - **连接优化：** 在连接多个表时，查询优化器利用表统计信息来确定最佳连接策略。通过分析列统计信息（如数据分布和值范围），优化器可以决定是执行哈希连接、合并连接还是其他连接算法。这些信息有助于减少数据重排并提高整体连接性能。\n\
  - **谓词下推：** 表统计信息也用于谓词下推，即在将数据带入查询引擎之前，将过滤操作下推到数据源。通过了解列的数据分布和值范围，优化器可以确定在数据源处进行过滤是否能够显著减少需要处理的数据量，从而加快查询执行速度。\n\
  - **数据倾斜检测：** 表统计信息有助于识别数据倾斜，即数据在分区或列之间的分布不均匀。数据倾斜会对查询性能产生负面影响，导致某些任务花费的时间明显长于其他任务。通过分析表统计信息，你可以检测数据倾斜并采取纠正措施，例如重新分布数据或使用不同的分区策略，以实现更好的负载均衡并改善查询性能。\n\
  \n为了确保表统计信息的准确性，随着数据的变化定期更新它们非常重要。AWS Glue 提供了通过使用爬网程序自动收集表统计信息的功能。此外，你还可以使用 Amazon\
  \ Athena 等查询引擎中的 `ANALYZE TABLE` 命令手动更新表统计信息：\n\n\n\n## Schema (60)\n\n查看和管理表架构。\n\
  \n过滤架构\n\n| # | 列名 | 数据类型 | 分区键 | 注释 |\n|---|---|---|---|---|\n| 1 | date | bigint\
  \ | - | - |\n| 2 | state | string | - | - |\n| 3 | positive | bigint | - | - |\n\
  | 4 | probablecases | bigint | - | - |\n| 5 | negative | bigint | - | - |\n| 6 |\
  \ pending | bigint | - | - |\n| 7 | totaltestresultssource | string | - | - |\n\
  | 8 | totaltestresults | bigint | - | - |\n| 9 | hospitalizedcurrently | bigint\
  \ | - | - |\n| 10 | hospitalizedcumulative | bigint | - | - |\n| 11 | inicucurrently\
  \ | bigint | - | - |\n| 12 | inicucumulative | bigint | - | - |\n| 13 | onventilatorcurrently\
  \ | bigint | - | - |\n| 14 | onventilatorcumulative | bigint | - | - |\n| 15 | recovered\
  \ | bigint | - | - |\n\n图 6.19 – AWS Glue Catalog 表架构定义\n\n在探索了表定义之后，我们现在可以使用 Amazon\
  \ Athena 查看数据。\n\n点击 Table data 将把我们重定向到 Athena 控制台：\n\n## Tables (4)\n\n查看和管理所有可用表。\n\
  \n过滤表\n\n| 名称 | 数据库 | 位置 | 分类 | 已弃用 | 查看数据 |\n|---|---|---|---|---|---|\n| covid19_csv\
  \ | chapter6_covid19 | s3://covid19-lake/rearc-co... | csv | - | Table data |\n\
  | covid19_states_daily | chapter6_covid19 | s3://covid19-lake/rearc-co... | json\
  \ | - | Table data |\n| covid19_us_daily | chapter6_covid19 | s3://covid19-lake/rearc-co...\
  \ | json | - | Table data |\n| covid19_us_total_latest | chapter6_covid19 | s3://covid19-lake/rearc-co...\
  \ | json | - | Table data |\n\n图 6.20 – AWS Glue Data Catalog 中的表列表\n\n在这里，我们使用\
  \ Amazon Athena 访问了 `covid19_csv` 表的数据。通过点击 **Table data**，我们被重定向到 Athena 控制台，在那里可以看到表的数据。其他表也在\
  \ Athena 中列出。在下一章中，我们将更详细地探索 Athena：\n\n![](img/e28602b44ec813a47df57c96b204412c_212_0.png)\n\
  \n在本示例中，我们演示了如何使用 AWS Glue Catalog 对 Covid-19 数据集进行编目，并使用 Amazon Athena 对其运行 SQL\
  \ 查询。在下一节中，我们将重点介绍如何使用 AWS Glue ETL 执行数据摄取。\n\n## 使用 AWS Glue ETL 进行数据摄取\n\n在上一节中，我们学习了如何使用\
  \ AWS Glue Crawler 和 AWS Glue Data Catalog 的各种功能为数据发现创建集中式数据目录。在本节中，我们将探索使用 AWS\
  \ Glue ETL 从各种数据源进行数据摄取的选项，例如数据湖（Amazon S3）、数据库、流式处理和 SaaS 数据存储。此外，我们还将学习如何使用作业书签从数据湖（S3）和\
  \ JDBC 执行增量数据加载。\n\nGlue 使用户能够使用三种不同类型的 ETL 框架创建 ETL 作业 – Spark ETL、Spark Streaming\
  \ 和 Python Shell。在 Glue DataBrew 的介绍部分，我们了解到 AWS Glue 已发展，并且现在 AWS Glue Studio 可用于构建\
  \ ETL 管道。\n\nAWS Glue 用户界面允许您使用一个有趣的功能构建 ETL 管道，该功能将您的 UI 作业转换为脚本，这有助于在构建类似管道时扩展，或在您需要一些帮助入门然后添加自定义时提供帮助。\n\
  \n除了支持多个 Spark 框架来处理数据外，Glue 在作业创建期间还提供高级功能，例如自动扩展、作业书签、启用连续日志记录、Spark UI、Flex 实例以及传递\
  \ Spark 和作业参数。\n\n除了 Spark 框架之外，Glue ETL 还提供 Glue 原生的高级框架/API 和格式，用于复杂的 ETL，例如 GlueContext、DynamicFrame、作业书签、Glue\
  \ Parquet、Glue 交互式会话、工作流、触发器等。\n\n让我们逐一探索这些功能。\n\n### AWS GlueContext\n\n`GlueContext`\
  \ 类封装了 Apache 的 `SparkContext`，可使用以下代码片段进行初始化：\n\n```\n```python\nsc = SparkContext()\n\
  glueContext = GlueContext(sc)\n```\n```\n\nGlueContext 允许您与 Spark 框架通信，并且是许多 Glue\
  \ ETL 功能的入口点，例如 DynamicFrame、作业书签、作业参数等。\n\n### DynamicFrame\n\nGlue ETL 的 DynamicFrame\
  \ 是一个重要功能，使 Spark 开发人员能够创建更高效的 Spark 管道，并且是 Glue 原生的。Glue DynamicFrame 是自描述 DynamicRecord\
  \ 对象的分布式集合，但它不需要它们遵循固定架构。由于 DynamicFrame 中记录的自描述特性，它不需要创建架构即可用于读取/转换具有不一致架构的数据。\n\
  \n您可以根据用例使用不同的 API 创建 Glue DynamicFrame。例如，以下代码片段为 `my_database` 数据库中的 `my_table`\
  \ 表创建名为 `datasource0` 的 DynamicFrame 对象：\n\n```\n```python\ndatasource0 = glueContext.create_dynamic_frame.from_catalog(database_\n\
  name='my_database', table_name='my_table', transformation_\nctx='datasource0')\n\
  ```\n```\n\n在此语句中，我们使用了 GlueContext 对象，该对象使用 Glue SDK 来连接到 Glue Data Catalog 并获取数据源分类和属性以创建对象。用户还可以使用\
  \ `additional_options` 参数传递其他选项，例如 `push_down_predicate` 参数。\n\n除了使用 `from_catalog`\
  \ 方法创建 DynamicFrame 外，您还可以使用以下方法创建 DynamicFrames：\n\n- **`from_options`**: 此方法允许用户通过手动指定连接类型、选项和格式来创建\
  \ DynamicFrames。此方法为用户提供了自定义数据存储选项的灵活性。\n- **`from_rdd`**: 此方法允许用户使用 Spark RDDS\
  \ 创建 DynamicFrames。\n\n为了利用 DataFrame 中可用的功能，您可以使用以下语法将 DynamicFrame 转换为 DataFrame：\n\
  \n```\ndf = datasource0.toDF()\n```\n\n同样，您可以使用以下语法将 Spark DataFrame 转换为 Glue DynamicFrame：\n\
  \n```\nfrom awsglue.dynamicframe import DynamicFrame\n\ndyf = DynamicFrame.fromDF(dataframe=df,\
  \ glue_ctx=glueContext, name=\"dyf\")\n```\n\nDynamicFrame 和 DataFrame 都是与 Spark\
  \ RDDs 交互的高级 API。然而，DynamicFrame 的结构与 DataFrame 不同：\n\n| Spark DataFrames | Glue\
  \ DynamicFrames |\n| ----------------- | ------------------ |\n| Spark Core : RDD\
  \ |  |\n\n图 6.22 – AWS Glue ETL 高级架构\n\n需要注意的是，将 Glue DynamicFrame 转换为 Spark DataFrame\
  \ 需要 Spark 中的完整 Map 阶段，这可能资源密集并增加作业执行时间。这是因为将 DynamicFrame 转换为 DataFrame 会阻塞 Spark，使用针对\
  \ DynamicFrame 所做的所有优化。\n\n### AWS Glue 作业书签\n\nAWS Glue 提供了独特的书签功能，这使其区别于其他基于 Spark\
  \ 的 ETL 解决方案，例如在 Amazon Elastic MapReduce (EMR) 上运行 Spark。书签通过跟踪已处理和写入的数据来启用增量数据加载。当处理大型数据集或从数据库提取数据时，这尤其有用。\n\
  \n作业书签适用于 JDBC 数据源、Amazon S3 和关系转换。对于 Amazon S3，作业书签适用于 JSON、CSV、Apache Avro、XML、Parquet\
  \ 和 ORC 文件格式。在使用 JDBC 源时，用户需要指定一列作为书签键；否则，AWS Glue 将使用主键作为书签键，前提是它按顺序递增或递减且没有间隙。如果使用用户定义的书签键，则它们应单调递增或递减；这种情况下允许存在间隙。\n\
  \n对于 Amazon S3，AWS Glue 使用对象的最后修改时间来确定需要重新处理哪些对象。有各种处理选项可用，例如重置作业书签和回退。重置作业书签允许用户使用相同的\n\
  \n\njob，而回退（rewinding）则使它们能够回到任何先前的任务运行。需要注意的是，将 Glue DynamicFrame 转换为 Spark DataFrame\
  \ 需要在 Spark 中执行一个完整的 Map 阶段，这可能非常耗费资源，并且由于阻塞了 Spark 针对 DynamicFrame 的优化，会增加任务的执行时间。\n\
  \n## AWS Glue 触发器\n\nAWS Glue 触发器允许你调度你的 Glue 工作流，其中包括 Glue 任务和爬虫（crawlers）。你可以创建按需触发、定时触发或基于事件触发的触发器。触发器可以处于多种状态，例如\
  \ CREATED（已创建）、ACTIVATED（已激活）和 DEACTIVATED（已停用）。\n\n有三种类型的触发器可用：\n\n- **定时触发器**：这些触发器基于时间，可以使用\
  \ cron 表达式进行配置以定义调度。\n- **条件触发器**：这些触发器根据先前任务或爬虫的状态执行。例如，你可以配置一个触发器，仅在爬虫完成时执行任务\
  \ 1。\n- **按需触发器**：顾名思义，这些触发器通过手动激活，并在你运行它们时执行。\n\n## AWS Glue 交互式会话\n\nAWS Glue\
  \ 提供了一个交互式环境，用于在 AWS 上构建、测试和运行你的 ETL 任务。此环境包含一个开源 Jupyter 内核，可与 PyCharm、IntelliJ\
  \ 和 VS Code 等流行 IDE 集成，允许你在本地编写和测试代码。要设置交互式会话，你可以参考位于 https://docs.aws.amazon.com/glue/latest/dg/interactive-sessions.html\
  \ 的官方 Glue 文档。\n\n现在，我们已经对所有 Glue 组件有了相当程度的理解，让我们通过示例学习一些摄取（ingestion）模式：\n\n- 从\
  \ Amazon S3（对象存储）摄取数据\n- 从 SaaS 应用程序摄取数据\n- 从关系型数据库摄取数据\n\n## AWS Glue Studio\n\n\
  Glue Studio 是由 AWS Glue 提供的一个强大的可视化界面，用于构建和管理 ETL 工作流。它提供了多项功能和优势，以增强数据集成和转换过程。然而，也有一些局限性和需要考虑的因素。让我们提供一个概述。\n\
  \nGlue Studio 的功能和优势如下：\n\n- **可视化 ETL 开发**：Glue Studio 提供了一个用户界面，用于可视化设计 ETL 工作流。它允许用户创建、连接和配置预构建的组件（称为“转换”），而无需编写代码，从而简化了构建数据管道的过程。\n\
  - **预构建转换库**：Glue Studio 提供了一个丰富的预构建转换库，这些转换是数据处理操作，如过滤、聚合、连接等。这些转换可以轻松集成到工作流中，节省开发复杂数据转换的时间和精力。\n\
  - **自动生成的 Spark 代码**：在幕后，Glue Studio 根据可视化工作流自动生成 Apache Spark 代码。这使得用户能够利用 Spark\
  \ 进行分布式数据处理的优势，同时抽象出 Spark 编程的复杂性。\n- **与 Glue 数据目录集成**：Glue Studio 与 Glue 数据目录无缝集成，允许轻松访问元数据、表定义和模式。它简化了在\
  \ Amazon S3、RDS、Redshift 等各种 AWS 数据源中存储的数据处理过程。\n- **内置数据目录和数据湖**：Glue Studio 利用\
  \ Glue 数据目录作为管理和组织元数据的中央仓库。它使用户能够在其数据湖中发现、编目和探索数据资产，促进数据治理和自助数据发现。\n- **便捷的部署和调度**：Glue\
  \ Studio 提供了简单的部署选项，允许用户只需单击几下即可将工作流部署为 AWS Glue ETL 任务。它还提供了调度功能，以自动化工作流的重复执行。\n\
  \nAWS Glue Studio 的局限性和考虑因素之一是**有限的自定义**。虽然 Glue Studio 提供了用于 ETL 开发的可视化界面，但在处理复杂转换或自定义逻辑时可能存在局限性。在这种情况下，你可能需要转向使用\
  \ Glue ETL 脚本或其他 AWS 服务的传统编码方法。\n\n## 从对象存储摄取数据\n\n本示例涉及从 AWS 开放数据上的 COVID-19 数据湖（https://registry.opendata.aws/aws-covid19-lake/）复制数据，该数据湖存储在一个名为\
  \ `s3://covid19-lake/` 的公共 S3 桶中。为了实现这一点，我们将使用 Amazon S3 Boto3 库，这是一个 Python 包，用于连接到\
  \ SFTP、FTP 和其他不同文件存储中的数据。在这种情况下，将使用 Glue Python shell ETL 任务从 Amazon S3 读取 CSV 数据，将其转换为\
  \ JSON，然后将其复制到目标 S3 桶。Amazon S3 上的 COVID-19 数据湖包含各种文件夹，在本示例中，将使用 `s3://covid19-lake/rearc-covid-19-testing-data/csv/us_daily/`\
  \ 文件夹：\n\n```text\n(base) ~ % aws s3 ls s3://covid19-lake/rearc-covid-19-testing-data/csv/us_daily/\n\
  2021-03-15 15:34:30       82926 us_daily.csv\n```\n\n以下是代码片段：\n\n```python\nimport\
  \ boto3\nimport io\nimport pandas as pd\n\nclient = boto3.client('s3')\n\n# covid-19\
  \ data lake - https://registry.opendata.aws/aws-covid19-lake/\n\nsrc_bucket = 'covid19-lake'\
  \  # SOURCE_S3_BUCKET_NAME\ntarget_bucket = 'S3_TARGET_BUCKET_NAME'\n\nsrc_object\
  \ = client.get_object(\n    Bucket=src_bucket,\n    Key='rearc-covid-19-testing-data/csv/us_daily/us_daily.csv'\n\
  )\n\n# Read CSV and Transform to JSON\n\ndf = pd.read_csv(src_object['Body'])\n\n\
  jsonBuffer = io.StringIO()\n\ndf.to_json(jsonBuffer, orient='records')\n\n# Write\
  \ JSON to target location\n\nclient.put_object(\n    Bucket=target_bucket,\n   \
  \ Key='target_prefix/data.json',\n    Body=jsonBuffer.getvalue()\n)\n```\n\n提供的代码片段利用\
  \ get_object() 方法从 Amazon S3 检索数据，随后使用 pandas 库将数据从 CSV 格式转换为 JSON 格式。最后，利用 put_object()\
  \ 方法将转换后的数据写入目标位置。\n\n## 从数据库摄取数据（JDBC 数据存储）\n\nAWS Glue 常用于将数据从数据库引入数据湖。这通常以批处理方式通过\
  \ JDBC 连接完成。要连接到数据库，你可以使用 AWS Glue 连接，它存储数据库的登录凭据、URI 字符串和**虚拟私有云**（VPC）信息。AWS Glue\
  \ 支持多种类型的连接，包括 JDBC、Amazon RDS、Amazon Redshift、Amazon DocumentDB、Kafka 和 MongoDB。要创建\
  \ JDBC 连接，你可以使用以下格式：\n\n```text\njdbc:protocol://host:port/db_name\n```\n\n你可以通过阅读\
  \ AWS Glue 文档（https://docs.aws.amazon.com/glue/latest/dg/connection-properties.html#connection-properties-required）来了解如何为各种数据库创建连接。\n\
  \n以下是 Microsoft SQL Server 数据库连接的示例：\n\n![](img/e28602b44ec813a47df57c96b204412c_218_0.png)\n\
  \n图 6.24 – AWS Glue JDBC 连接\n\n以下是代码片段。这里，我们正在连接 MSSQL 数据库并将数据从 MSSQL 数据库移动到 Amazon\
  \ S3，格式为 Parquet 文件：\n\n```python\nMicrosoftSQLServer = directJDBCSource(\n    glueContext,\n\
  \    connectionName=\"mssql\",\n    connectionType=\"sqlserver\",\n    database=\"\
  ec2-00-000-000-00.compute-1.amazonaws.com:1433;databaseName=dms_sample\",\n    table=\"\
  dms_sample.sports\",\n    redshiftTmpDir=\"\",\n    transformation_ctx=\"MicrosoftSQLServer\"\
  ,\n)\n\nS3bucket_node3 = glueContext.write_dynamic_frame.from_options(\n    frame=MicrosoftSQLServer,\n\
  \    connection_type=\"s3\",\n    format=\"parquet\",\n    connection_options={\"\
  path\": \"s3://target_dir\"},\n    format_options={\"compression\": \"uncompressed\"\
  },\n    transformation_ctx=\"S3bucket_node3\",\n)\n```\n\n## 从 SaaS 数据存储摄取数据\n\n\
  到目前为止，我们已经学习了如何使用 AWS Glue 从 Amazon S3 等对象存储以及 Microsoft SQL Server 等关系型数据库中提取数据。现在，我们将学习如何使用\
  \ AWS Glue 从 SaaS 数据存储摄取数据。\n\n要连接到 SaaS 数据存储，你需要使用 AWS Glue Marketplace 连接器；这些连接器是在\
  \ 2020 年 12 月推出的。截至撰写本文时，Marketplace 共有 66 个连接器，包括 AWS 和第三方连接器，如 Snowflake、ServiceNow、Google\
  \ BigQuery、Elasticsearch、Apache Iceberg、Delta Lake 等：\n\n![](img/e28602b44ec813a47df57c96b204412c_219_0.png)\n\
  \n图 6.25 – AWS Glue Marketplace 连接器\n\n要连接 ServiceNow 并将数据引入 Amazon S3 数据湖，请遵循以下步骤：\n\
  \n1. 访问 AWS Marketplace (https://us-east-1.console.aws.amazon.com/gluestudio/home?region=us-east-1#/marketplace)\
  \ 并订阅 ServiceNow 连接器。在继续之前，请查阅文档、定价和用户指南。\n2. 使用已订阅的 ServiceNow 连接器创建一个连接。\n3. 使用\
  \ AWS Glue Studio 构建 ETL 管道：\n\n```python\nimport sys\nfrom awsglue.transforms import\
  \ *\nfrom awsglue.utils import getResolvedOptions\nfrom pyspark.context import SparkContext\n\
  from awsglue.context import GlueContext\nfrom awsglue.job import Job\n\nargs = getResolvedOptions(sys.argv,\
  \ [\"JOB_NAME\"])\n```\n\n\n\n\n\n```python\nsc = SparkContext()\nglueContext =\
  \ GlueContext(sc)\nspark = glueContext.spark_session\njob = Job(glueContext)\njob.init(args[\"\
  JOB_NAME\"], args)\n\n# Script generated for node CData AWS Glue Connector for ServiceNow\n\
  CDataAWSGlueConnectorforServiceNow_node1 = (\n    glueContext.create_dynamic_frame.from_options(\n\
  \        connection_type=\"marketplace.jdbc\",\n        connection_options={\n \
  \           \"tableName\": \"incident\",\n            \"dbTable\": \"incident\"\
  ,\n            \"connectionName\": \"service-now-glue-connector\",\n        },\n\
  \        transformation_ctx=\"CDataAWSGlueConnectorforServiceNow_node1\",\n    )\n\
  )\n```\n\n您可以在 [https://aws.amazon.com/blogs/big-data/extract-servicenow-data-using-aws-glue-studio-in-an-amazon-s3-data-lake-and-analyze-using-amazon-athena/](https://aws.amazon.com/blogs/big-data/extract-servicenow-data-using-aws-glue-studio-in-an-amazon-s3-data-lake-and-analyze-using-amazon-athena/)\
  \ 找到一篇有用的博文，该博文提供了逐步详细指南，介绍如何构建一个连接 ServiceNow 并在使用 AWS Glue Studio 的情况下将数据引入 Amazon\
  \ S3 数据湖的管道。这篇博文还包括有关在 AWS 市场上订阅 ServiceNow 连接器、使用连接器创建连接以及使用 AWS Glue Studio 构建\
  \ ETL 管道的说明。此外，它还解释了在数据摄入数据湖后，如何使用 Amazon Athena 分析 ServiceNow 数据。\n\n# 摘要\n\n在本章中，我们介绍了\
  \ Apache Spark、其与 AWS Glue 的连接以及 AWS Glue 中的各种可用功能，包括用于数据发现的 AWS Glue 数据目录、用于元数据提取的\
  \ AWS Glue 爬虫以及用于构建基于 UI 的 ETL 管道的 AWS Glue Studio。我们还探索了如何使用 AWS Glue 市场订阅不同的连接器，以便我们可以从\
  \ SaaS 应用程序中提取数据。\n\n在下一章中，我们将讨论另一种在数据整理和发现过程中发挥重要作用的关键服务：Amazon Athena。\n"
- "# 使用 Athena 进行处理\n\n在前几章中，您了解了 AWS Glue 和 Amazon S3 服务以及它们如何融入数据整理管道。在本章中，我们将探索\
  \ Amazon Athena 服务如何帮助数据整理管道的数据发现、数据结构化、数据丰富和数据质量阶段。我们将处理一些实用示例并对数据进行分析，使其更加有趣。\n\
  \n本章涵盖以下主题：\n\n- 了解 Amazon Athena\n- 使用 Athena 进行高级数据发现和数据结构化\n- 使用 Athena 丰富来自多个来源的数据\n\
  - 使用 Athena 设置无服务器数据质量管道\n\n## 了解 Amazon Athena\n\nAmazon Athena 是一种交互式无服务器分析服务，有助于探索\
  \ Amazon S3 中可用的数据而无需加载数据。Athena 通过 SQL 语法或交互式 Spark 应用程序帮助分析数据。它可以帮助客户通过熟悉的 SQL\
  \ 分析存储在 Amazon S3 上多种数据格式中的数据。由于 Athena 是一种无服务器服务，用户根据查询扫描的数据量收费，无需维护单独的服务器来启用用户查询。这使得业务和分析团队能够针对特定用例快速分析、转换和可视化数据湖中的数据，而无需依赖数据工程团队创建复杂的\
  \ ETL 管道。\n\nAmazon Athena 于 re:Invent 2016 发布，并随着时间的推移经历了重大改进。它最初发布为一种使用托管 Presto\
  \ 服务器（来自 Athena 目录，不同于 Glue 目录）查询 Amazon S3 数据的无服务器机制。现在，它支持从 Glue 目录查询数据、查询联合、CTAS\
  \ 语句、Lake Formation 集成、支持事务性数据湖格式、Athena for Spark 等等。\n\n自 *re:Invent 2022* 宣布\
  \ Athena for Apache Spark 之后，Athena 支持两种数据分析模式，如下所示：\n\n- 用户可以使用 SQL 语法查询数据，这与 Presto/Trino\
  \ 相似但存在限制。这使得不具备编程语言专长的分析人员可以在没有他人支持的情况下分析 S3 数据湖中的数据。以下博客文章包含了 Amazon Athena 使用最佳实践，用于优化基于\
  \ SQL 分析的成本并提高性能：[https://aws.amazon.com/blogs/big-data/top-10-performance-tuning-tips-for-amazon-athena/](https://aws.amazon.com/blogs/big-data/top-10-performance-tuning-tips-for-amazon-athena/)。\n\
  - Athena for Spark 发布时支持 Apache Spark 版本 3.2。有关最近支持的 Spark 版本，请参阅 Athena 文档。有关 Athena\
  \ for Spark 的更多详细信息，请参阅以下博客。\n\n### 何时使用 SQL/Spark 分析选项？\n\n如果希望在不将数据加载到另一个存储层的情况下对数据湖执行分析，请使用\
  \ Athena SQL 来编目和查询数据。您还可以使用 CTAS 语句执行轻量级数据转换。如果您希望以交互式和无服务器方式执行 Spark 程序用于某些分析用例，可以使用\
  \ Athena for Spark 选项。\n\n## 使用 Athena 进行高级数据发现和数据结构化\n\n在本节中，我们将探索 Amazon Athena\
  \ 如何帮助执行数据整理管道的高级数据发现和数据结构化阶段。\n\n### 使用 Athena 进行基于 SQL 的数据发现\n\nAmazon Athena\
  \ 提供基于 SQL 的数据探索，并支持高级数据类型。这里的优势在于，即使没有编程经验的人也可以使用熟悉的 SQL 语法探索多种数据格式和不同存储类型的数据。\n\
  \n在使用 Amazon Athena 查询数据之前，我们需要在 Glue 目录中为表创建元数据。Amazon Athena 帮助您从不同的数据源查询数据，如下所示：\n\
  \n- **AWS Glue 目录** — 访问 AWS Glue 目录中可用的表。我们可以通过多种方式在 AWS Glue 目录中创建表，我们将在本章后面探索这些方式。\n\
  - **联合数据源** — 支持从 Apache Hive、AWS 以及第三方数据库和服务查询数据。有关受支持数据源的综合列表，请参阅 [https://docs.aws.amazon.com/athena/latest/ug/connectors-prebuilt.html](https://docs.aws.amazon.com/athena/latest/ug/connectors-prebuilt.html)。\n\
  \n除了预构建的连接程序外，您还可以创建自定义连接程序来查询您选择的数据源。我们将在本章中进一步详细探索联合数据源。\n\n让我们更多地了解 Glue 目录，它将是大多数\
  \ Athena 查询的中心元数据存储。Glue 目录是一个持久元数据存储，允许用户存储、注释和共享元数据。每个 AWS 账户在区域内将有唯一的 Glue 目录。您可以使用\
  \ **身份和访问管理（IAM）** 策略来定义和控制用户对 Glue 目录和表的访问权限。对于细粒度数据访问（记录和列级别），用户必须探索 AWS Lake\
  \ Formation 服务。\n\n如果您查看 AWS Glue 控制台，可以看到 **数据目录** 部分下的不同链接，如下所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_223_0.png)\n\
  \n让我们更详细地了解这些部分：\n\n- **数据库：** 数据库是用于存储来自不同数据源的表元数据信息的容器。用户可以将其理解为数据库世界中的架构/数据库概念。\n\
  - **表：** 每个表都有源数据的架构定义。我们要强调，这只是存储在某个位置（如 S3 数据湖）的实际数据的元数据定义。当文件具有相同的架构、数据格式和压缩格式时，它还在表中创建分区。\n\
  \n表可以从以下三个来源创建：\n\n- 爬虫运行时创建新表。我们可以通过按计划运行 Glue 爬虫来使用新分区、额外列等保持架构更新。\n- 手动添加架构定义。当您想要自定义表/列的名称、仅显示数据集的特定列等时，可以通过这种方法进行操作。\n\
  - 使用流式数据源的架构注册表中的现有架构创建表。\n\n\n\n\nGlue 目录表可以有多个版本。每次对表元数据的编辑都会创建该表的新版本。您可以在 AWS\
  \ Glue 控制台 UI 上比较表的版本，并验证不同版本的表之间所做的更改，如以下截图所示。此外，我们还可以通过使用 delete-table-version\
  \ API 回滚到以前的版本：\n\n![](img/e28602b44ec813a47df57c96b204412c_224_0.png)\n\n图 7.2：AWS\
  \ Glue 控制台 – 具有多个版本的表\n\n- **连接**：存储登录凭据、URI 和 VPC 信息，以避免在每次运行爬虫/作业时提供这些信息。我们还可以创建网络连接，通过\
  \ VPC 访问 Amazon S3 或其他服务，而不使用公共互联网。\n\n- **爬虫**：Glue 爬虫会自动为用户发现数据并编目元数据（包括半结构化和日志数据）。爬虫使用分类器来推断和识别数据类型，包括\
  \ AWS Glue 创建的（CSV、JSON 等）以及使用 grok 模式的自定义分类器。爬虫可以检测架构变更，并根据用户提供的配置自动更新表定义。\n\n\
  为了探索 Athena 的功能，我们将使用来自 [https://docs.opendata.aws/noaa-ghcn-pds/readme.html](https://docs.opendata.aws/noaa-ghcn-pds/readme.html)\
  \ 的 Amazon 评论示例数据集。我们有 Parquet、CSV 和压缩 CSV 格式，数据在这些格式中可用。\n\n我们将如前所述，通过 AWS Glue\
  \ 爬虫和手动方法以两种格式创建表。\n\n## 通过 AWS Glue 爬虫创建表并在 Athena 中查询\n\n我们将按如下步骤开始：\n\n- 1. 导航到\
  \ AWS Glue 控制台，创建一个新的爬虫，并提供 noaa 数据集的 S3 路径，如爬虫添加数据源屏幕所示：\n\n  ![](img/e28602b44ec813a47df57c96b204412c_225_0.png)\n\
  \n  图 7.3：AWS Glue 控制台 – 配置爬虫\n\n  提供一个具有适当访问权限（包括 S3 读取访问权限）的 IAM 角色和一个数据库名称，以完成爬虫的创建。\n\
  \n- 2. 一旦爬虫创建完成，点击运行它，并等待其完成。当爬虫完成后，您会看到 Glue 目录中新增了一个表，并添加了分区：\n\n  ![](img/e28602b44ec813a47df57c96b204412c_225_1.png)\n\
  \n  图 7.4：AWS Glue 控制台 – 爬虫成功运行的结果\n\n- 3. 现在，您可以在 Athena 中查询该表并开始分析数据。在表上运行一个 SELECT\
  \ 查询，您还可以使用表中可用的分区来筛选数据：\n\n  ![](img/e28602b44ec813a47df57c96b204412c_226_0.png)\n\
  \n  图 7.5：AWS Athena 控制台 – 查询由 Glue 爬虫创建的表\n\n## 手动在 Athena 中创建表并查询该表\n\n在这里，我们将以手动方式为\
  \ CSV 格式创建一个表。我们将遵循此处列出的方法：\n\n- 1. 下载一个样本文件并理解表结构。\n\n在手动创建表之前，我们需要了解源文件中的列和数据类型，以便我们适当地创建表数据定义语言（DDL）语句。在这个例子中，我们将使用\
  \ CLI 中的命令仅下载 2022 年的数据（假设机器中已经安装了 AWS CLI），如下所示：\n\n```\naws s3 cp s3://noaa-ghcn-pds/csv/by_year/2022.csv\
  \ .\n```\n\n由于这是一个 CSV 文件，我们可以使用 Excel 应用程序打开它；在某些系统中可能会遇到错误，因为这是一个大于 1 GB 的超大文件，但您可以浏览数据中可用的不同列和数据类型。您可以在这里看到文件在\
  \ Excel 中打开的样子：\n\n![](img/e28602b44ec813a47df57c96b204412c_226_1.png)\n\n图 7.6：在\
  \ Excel 中打开样本数据文件，以理解列结构和数据类型\n\n- 2. 现在，我们将创建一个 DDL 语句并在 Athena 中执行它以创建表：\n\n \
  \ ![](img/e28602b44ec813a47df57c96b204412c_227_0.png)\n\n  图 7.7：AWS Athena 控制台\
  \ – 使用 DDL 语句手动创建表\n\n> 注意\n> 下面显示了所使用的 DML 语句。该 DML 语句取自不同的 Glue 爬虫以节省时间，并在此处根据我们的需求进行了修改。\n\
  \n```\nCREATE EXTERNAL TABLE `noaa_data_csv`(\n`id` string,\n`date` bigint,\n`element`\
  \ string,\n`data_value` bigint,\n`m_flag` string,\n`q_flag` string,\n`s_flag` string,\n\
  `obs_time` bigint)\nROW FORMAT DELIMITED\nFIELDS TERMINATED BY ','\nSTORED AS INPUTFORMAT\n\
  'org.apache.hadoop.mapred.TextInputFormat'\nOUTPUTFORMAT\n'org.apache.hadoop.hive.ql.io.HiveIgnoreKeyTextOutputFormat'\n\
  LOCATION\n's3://noaa-ghcn-pds/csv/by_year/'\nTBLPROPERTIES (\n'areColumnsQuoted'='false',\n\
  'classification'='csv',\n'columnsOrdered'='true',\n'compressionType'='none',\n'delimiter'=',',\n\
  'skip.header.line.count'='1',\n'typeOfData'='file')\n```\n\n- 3. 现在，我们可以使用 Amazon\
  \ Athena 从该表位置开始查询数据，如下所示：\n\n  ![](img/e28602b44ec813a47df57c96b204412c_228_0.png)\n\
  \n## 使用正则表达式解析器加载固定宽度表\n\n一个更好的例子是加载一个不被 Glue 爬虫支持的表。我们将为 inventory 文件（http://noaa-ghcn-pds.s3.amazonaws.com/ghcnd-inventory.txt）创建一个表。该文件的结构是从数据源文档页面粘贴在这里的：\n\
  \n文件结构在下表中描述。\n\n| 变量 | 列 | 类型 |\n| :--- | :--- | :--- |\n| ID | 1-11 | CHARACTER\
  \ |\n| LATITUDE | 13-20 | REAL |\n| LONGITUDE | 22-30 | REAL |\n| ELEMENT | 32-35\
  \ | CHARACTER |\n| FIRSTYEAR | 37-40 | INTEGER |\n| LASTYEAR | 42-45 | INTEGER |\n\
  \n- **ID** = 站点识别码。请参阅 \"ghcnd-stations.txt\" 以获取站点的完整列表及其元数据。\n- **LATITUDE** =\
  \ 站点的纬度（以十进制度表示）。\n- **LONGITUDE** = 站点的经度（以十进制度表示）。\n- **ELEMENT** = 要素类型。请参阅第三部分以获取要素的定义。\n\
  - **FIRSTYEAR** = 给定要素无标志数据的第一年。\n- **LASTYEAR** = 给定要素无标志数据的最后一年。\n\n图 7.9：数据结构\n\
  \n这意味着前 11 个字符是 ID 字段，第 12 个字符可以是空格或任何内容，接下来的 7 位数字是纬度，如 *图 7.9* 中粘贴的那样。我们可以使用 **正则表达式\
  \ (regex)** 来解析数据并查询它。我们将执行以下步骤来从固定宽度文件中查询和发现数据：\n\n- 1. 下载并识别文件内的数据结构，如下所示：\n\n\
  ```\naws s3 cp s3://noaa-ghcn-pds/ghcnd-inventory.txt .\n```\n\n一旦文件已下载到本地磁盘，您可以使用任何您喜欢的编辑器打开文件并分析数据以理解模式结构。我们将理解此处看到的每一列中可用的值，以设计用于解析文件的正则表达式：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_229_0.png)\n\n> **注意**\n> \n> 如果文件没有特殊字符或复杂结构，我们也可以使用\
  \ S3 Select 从文件中查询数据。\n\n- 2. 设计一个正则表达式从文件中读取数据。\n\n在创建 Glue 表之前，您可以基于组织的安全需求使用任何正则表达式验证器来验证正则表达式。在我们的用例中，我们将使用\
  \ [https://regex101.com/](https://regex101.com/) 来验证正则表达式。\n\n对于正则表达式的新手，您可以在线阅读更多关于正则表达式的资料和备忘录，然后再开始。我们将复制一些代表数据文件中不同数据格式的样本记录，并开始逐字段创建正则表达式。以下截图显示了捕获第一个字段以匹配\
  \ 11 个字符单词以及存在于某些记录中的连字符的正则表达式（参见截图中的 *记录 3*）：\n\n![](img/e28602b44ec813a47df57c96b204412c_229_1.png)\n\
  \n```text\n`firstyear` int,\n`lastyear` int\n)\nROW FORMAT SERDE 'org.apache.hadoop.hive.serde2.RegexSerDe'\n\
  WITH SERDEPROPERTIES (\n    \"input.regex\" = \"^(\\\\\\\\w\\\\s.+-){1}\\\\s(\\\\\
  \\\\w\\\\s.+-){8}\\\\s(\\\\\\\\w\\\\s.+-){9}\\\\s(\\\\\\\\w]{4})\\\\s(\\\\\\\\d]{4})\"\
  \nLOCATION 's3://<location your file/'\n```\n\n- 5. 在 Athena 中查询数据并进行验证。\n\n一旦表创建完成，您可以查询数据并验证数据是否被正确解析，如下所示：\n\
  \n```text\n   * CREATE EXTERNAL TABLE ghndinv\n   6 w (     \n   7  `id` string,\n\
  \   8  `latitude` string,\n   9  `longitude` string,\n  10  `element` string,\n\
  SQL\nLn 3, Col 1\n```\n\n![](img/e28602b44ec813a47df57c96b204412c_231_0.png)\n\n\
  恭喜！您现在已经从一个固定宽度文件创建了一个表，并使用 SQL 语句来探索数据。\n\n您现在已理解在 Amazon Athena 中创建表以进行查询的不同方法，这是我们在\
  \ Athena 中进行分析之前的第一步也是重要的一步。您还可以以编程方式或通过诸如 AWS Glue 等服务使用 ETL 管道在 Glue 目录中创建表。\n\
  \n\n\n\n## 使用 CTAS 进行数据结构化\n\nCTAS 语句提供了一种通过 SQL 执行数据结构化的强大方式。你也可以使用此命令转换数据类型、存储格式以及其他较小的轻量级\
  \ ETL。\n\n我们将继续上一步的工作，在该步骤中我们使用 `serde` 正则表达式解析了固定宽度文件并从中创建了表。但如果你展开表定义和列类型，你会发现\
  \ `latitude` 和 `longitude` 列的数据类型为 `string`。我们可以将这两个字段转换为 `float` 数据类型，并将输出文件存储为\
  \ Parquet 格式，如下所示：\n\n```sql\ncreate table ghndinv_parquet\nwith (\n    format =\
  \ 'Parquet',\n    write_compression = 'GZIP',\n    external_location = 's3://<<s3\
  \ bucket>>/ghndinv_parquet/')\nas\nselect\n    id, cast(latitude as real) as latitude,\
  \ cast(longitude as real) as longitude, element, firstyear, lastyear\nfrom ghndinv\n\
  ```\n\n你可以查看 S3 位置并验证 Parquet 文件是否已为该表创建，并且它不再是固定宽度文本文件，如下所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_232_0.png)\n\
  \n图 7.14：使用 CTAS 命令创建的表的 S3 位置\n\n此外，正如我们在此处看到的，`latitude` 和 `longitude` 列的数据类型已更改为\
  \ `float`：\n\n![](img/e28602b44ec813a47df57c96b204412c_232_1.png)\n\n图 7.15：使用 Amazon\
  \ Athena 的 CTAS 命令创建的表的列和数据类型\n\n我们还将把 CSV 数据转换为 Parquet 格式，同时基于数据访问模式所需的分区架构。我们将根据国家代码对表进行分区，以便以高效的方式访问每个国家/地区的天气数据。\n\
  \n我们已在本书的 earlier 部分手动加载了 CSV 表到 `noaa_data_csv` 表中。我们将使用该表中的数据并从 `id` 列的前两个字符中提取\
  \ `countrycode` 值。我们还将把 `date` 字段转换为 `date` 类型，以便在查询中高效运行基于时间的过滤：\n\n```sql\ncreate\
  \ table noaa_data_parquet\nwith (\n    format = 'Parquet',\n    write_compression\
  \ = 'GZIP',\n    partitioned_by = ARRAY['countrycode'],\n    external_location =\
  \ 's3://<bucketname>/noaa_data_parquet/')\nas\nselect\n    id, element, data_value,\
  \ m_flag, q_flag, s_flag, obs_time, cast(date_parse(cast(\"date\" as varchar(8)),\
  \ '%Y%m%d') as date_field, substr(id, 1, 2) as countrycode\nfrom noaa_data_csv\n\
  ```\n\n请注意，我们在前面的查询中使用了 `partition` 列，而在库存表 (`ghndinv`) 中我们没有使用它。当执行此查询时，我们会收到错误，如以下屏幕截图所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_233_0.png)\n\nAthena 每次最多只支持插入 100 个分区，而我们的数据中有\
  \ 218 个唯一国家代码值，如 *图 7.17* 所示：\n\n```sql\nSelect substr(id, 1, 2) as countrycode\n\
  from noaa_data_csv\ngroup by substr(id, 1, 2) order by substr(id, 1, 2)\n```\n\n\
  |  |  |\n|---|---|\n| 217 | WZ |\n| 218 | ZA |\n| 219 | ZI |\n\n图 7.17：分区列中唯一值的总数\n\
  \n我们必须分三次批次加载数据，每次最多 100 个分区值。由于我们已对 countrycode 值进行了排序，因此我们可以根据 https://docs.aws.amazon.com/athena/latest/ug/ctas-insert-into.html\
  \ 中的文档所述来构建 INSERT 查询。\n\n我们将使用 CTAS 和 INSERT INTO 语句根据前面的查询使用国家代码过滤器三次插入数据。如果数据仅包含\
  \ <100 个分区值，我们可以一次运行此 CTAS 加载查询而无需任何额外步骤。操作如下：\n\n- 1. 创建一个 CTAS 语句来加载前 100 个分区的数据。你可以从图\
  \ 7.18 中的表中看到，我们已按字母顺序加载了约旦 (JO) 之前国家/地区的数据：\n\n![](img/e28602b44ec813a47df57c96b204412c_234_0.png)\n\
  \n图 7.18：运行限制分区值为 100 的 CTAS 命令\n\n- 2. N（根据需要重复多次）：插入语句将数据填充到目标表中，如下所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_235_0.png)\n\
  \n图 7.19：运行限制分区值为 100 的 CTAS 命令（续）\n\n重复此步骤直到你已从源表加载所有数据。完成后，你可以使用计数查询验证是否已从源表加载了所有数据。你也可以浏览\
  \ S3 路径以验证国家代码分区中的数据。你可以在此处看到我们已加载了所有国家代码的数据（219 个唯一国家代码值）：\n\n![](img/e28602b44ec813a47df57c96b204412c_235_1.png)\n\
  \n图 7.20：在 S3 路径中验证 CTAS 表输出\n\n现在，你可以根据查询访问模式高效地探索分区数据。或者，如果你想将数据拆分为等大小的桶，你可以使用本章后面提到的分桶命令。你也可以在\
  \ https://aws.amazon.com/premiumsupport/knowledge-center/set-file-number-size-ctas-athena/\
  \ 的文档中阅读有关分区（我们之前执行的操作）和分桶之间的区别。\n\n我们仅做了一个小的更改来展示 Athena 在重构数据方面的能力以及执行 ETL 操作的能力。你可以进一步尝试并在此练习中创建强大的数据转换。\n\
  \n## 使用 Athena 从多个来源丰富数据\n\n在本节中，我们将探讨如何使用 Athena SQL 以及使用 Athena 联邦设置从其他受支持的数据源丰富数据。\n\
  \n### 使用 Athena SQL 连接丰富数据\n\n在上一节中，我们看到了通过 Amazon Athena 探索数据的各种方式。现在，我们将更专注于通过\
  \ Athena 查询丰富数据以添加额外信息的方式。\n\n在此阶段，我们可以通过与其他数据源连接来进一步丰富原始数据。我们将继续使用我们在 earlier 部分中使用过的相同数据源。让我们假设一个场景，我们想要识别本世纪（2000\
  \ 年之后）美国某个州（康涅狄格州）在特定年份（2022 年）的最高记录温度。我们将从使用上一节中 CTAS 语句创建的 Parquet 表 (`noaa_data_parquet`)\
  \ 获取读数数据。\n\n我们可以根据分区架构过滤并获取国家代码 = US 的记录。但为了获取康涅狄格州的记录，我们需要将 `noaa_data_parquet`\
  \ 表与站点数据文件 (http://noaa-ghcn-pds.s3.amazonaws.com/ghcn-d-stations.txt) 连接，该文件包含美国和加拿大所有站点的州信息。\n\
  \n我们将按照以下步骤使用州数据丰富我们的数据集：\n\n- 1. 使用正则表达式格式加载州数据文件。我们将遵循我们在 earlier 部分加载库存表时使用的方法。我们将首先使用正则表达式验证器和示例记录设计用于加载表的正则表达式，如下所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_236_0.png)\n\n- 2. 创建表并通过 Amazon Athena\
  \ 加载固定宽度文件，如下所示。验证数据是否成功加载：\n\n| id | latitude | longitude | elevation | state |\
  \ name |\n|---|---|---|---|---|---|\n| US1CTR00002 | 41.4230 | -73.5187 | 256.0\
  \ | CT | DANBURY 2.8 NNW |\n| US1CTR00003 | 41.1486 | -73.4591 | 71.6 | CT | NEW\
  \ CANAAN 1.9 ENE |\n| US1CTR00005 | 41.1028 | -73.4893 | 60.0 | CT | DARIEN 3.6\
  \ N |\n\n图 7.22：使用正则表达式语句加载的表在 Amazon Athena 中的查询\n\n- 3. 我们将使用 `id` 列连接表，然后仅对来自\
  \ state='CT' 且国家代码='US'（分区列以加快分析）的记录进行过滤和聚合，以识别本世纪（21 世纪）的最高温度，如下所示：\n\n```sql\n\
  select max(data_value) from noaa_data_parquet t1 inner join\n ghnd_stations t2 on\
  \ t1.id=t2.id\nwhere countrycode='US' and state='CT' and element='TMAX' and\n date_field>cast('2000-01-01'\
  \ as date)\n```\n\n我们可以看到从以下屏幕截图中，本世纪记录的最高温度为 54.4°C：\n\n![](img/e28602b44ec813a47df57c96b204412c_237_0.png)\n\
  \n- 4. 通过识别本世纪康涅狄格州记录温度前三名的地点进行进一步分析。我们将使用分区和排名函数来实现此结果，通过执行以下查询：\n\n```sql\nselect\
  \ * from ( select t1.id,t1.data_value,t1.obs_time,t2.state,t2.name,\n ROW_NUMBER()\
  \ OVER (PARTITION BY t1.countrycode,t2.state ORDER BY\n data_value DESC) AS temp_rank\n\
  \ from noaa_data_parquet t1 inner join ghnd_stations t2 on\n t1.id=t2.id\nwhere\
  \ countrycode='US' and state='CT' and element='TMAX' and\n date_field>cast('2000-01-01'\
  \ as date) ) TMP_TABLE\n where temp_rank <=3\n```\n\n\n\n\n\n你可以看到本世纪记录最高气温的三个地点——梅里登（Meriden）、丹伯里（Danbury）和新\
  \ Haven（New Haven）。此外，正如你从分析中可以看到的那样，自 2000 年以来，气温从未超过 50°C：\n\n![](img/e28602b44ec813a47df57c96b204412c_238_0.png)\n\
  \n前面的练习展示了使用 Amazon Athena 进行此类分析的威力，而它依赖于数据的质量和准确性以获取正确结果。你需要依靠数据清洗和数据质量规则来创建更干净的数据集，以提供准确的分析结果。\n\
  \nAmazon Athena 支持所有类型的连接，如 INNER JOIN、LEFT JOIN、RIGHT JOIN、OUTER JOIN 和 CROSS JOIN，具体取决于你的使用场景需求。此外，Athena\
  \ SQL 中还有一组丰富的功能，可用于对数据进行高度复杂的分析和转换。请参阅文档，了解 Athena SQL 功能的完整列表，见 `https://docs.aws.amazon.com/athena/latest/ug/ddl-sql-reference.html`。\n\
  \n> **挑战练习**\n> 你可以连接我们在*第 10 章，使用 SageMaker Data Wrangler 进行机器学习的数据处理*中使用的体育博彩使用案例的数据集。你可以使用\
  \ Athena 查询重新创建我们在该章的数据富集部分创建的体育队伍赛程。\n\n## 为源数据库设置数据联合\n\n我们现在将更深入地探索从不同数据源连接数据集的方法。由于\
  \ NOAA 天气数据集仅存储在 Amazon S3 桶中，我们将向**关系型数据库服务 (RDS)** MySQL 数据库添加一些数据集，并展示如何在不将数据移动到中心位置的情况下查询数据。这有助于业务团队使用\
  \ SQL 运行快速分析，而无需依赖数据工程团队将数据从一个数据源移动到另一个位置。这对业务团队来说非常有用，因为他们可以在不依赖其他团队的情况下运行快速分析，但仅应用于即席分析场景，即你需要在短时间内获取结果的情况；而对于重复的数据分析以获取更好的性能，则应设置数据管道。\n\
  \nAthena 查询联合通过创建带有必要代码的 Lambda 函数来连接源数据库，从而起作用。支持的源的源代码可以在此处找到：`https://github.com/awslabs/aws-athena-query-federation`。由于这是开源代码，你可以进一步开发并根据需求进行自定义，按照仓库中提供的说明创建你自己数据库的代码。一旦你在\
  \ AWS 账户中部署了无服务器应用程序，它就会创建一个 Lambda 函数，由 Athena 在后端有效执行以连接你的数据库。Athena 使用有效的机制通过多次\
  \ Lambda 调用连接源数据库，并且 Amazon Athena 拥有一种机制来绕过 Lambda 的 15 分钟超时限制，执行运行时间超过 15 分钟的查询。\n\
  \n## 前提条件 – 在 RDS MySQL 中创建源表\n\n让我们假设一种场景，我们想要查询南极洲的天气数据，并以类似之前了解本世纪最低温度是如何做到的方式去理解。我们在\
  \ `noaa_data_parkue` 表中拥有国家代码值，但我们可能不知道南极洲的正确国家代码。我们将模拟一种场景，即国家查找表数据（包含国家代码和国家名称）来自\
  \ MySQL 数据库。为了创建该场景，我们将手动将数据加载到 MySQL 表中。你可以按照此处提供的信息创建 RDS MySQL 实例：`https://aws.amazon.com/getting-started/hands-on/create-mysql-db/`。\n\
  \n你可以使用 MySQL Workbench 连接到公共实例，如果你更喜欢在私有子网中启动 RDS 实例，则我们将使用**弹性计算云 (EC2)** 实例连接到\
  \ RDS 数据库。我们还将创建与 RDS MySQL 位于同一 VPC 中的 EC2 实例，并使用此机器连接到 MySQL 数据库。你可以按照此处描述的步骤设置\
  \ EC2 跳板主机：`https://aws.amazon.com/premiumsupport/knowledge-center/rds-connect-ec2-bastion-host/`。\n\
  \n在本节中，我们将登录到 EC2 实例并使用 `scp` 命令上传国家文件。在上传文件之前，你可以使用任何你选择的编辑器，将第一次出现的空格替换为逗号，如下所示，然后依次替换逗号并用双引号括起来。这将把数据转换为具有两个字段（国家代码和国家名称）的\
  \ CSV 文件：\n\n```\n1 AC,Antigua and Barbuda\n2 AE,United Arab Emirates\n3 AF,Afghanistan\n\
  4 AG,Algeria\n5 AJ,Azerbaijan\n6 AL,Albania\n```\n\n图 7.25：浏览国家查找文件中的数据\n\n在进行上述更改后，将文件保存为\
  \ CSV 格式，并使用 `scp` 命令将文件上传到 EC2 实例的主目录，如下所示：\n\n```\nscp -i \"yourpemfile.pem\"\
  \ <path/to/ghcnd-countries.csv> ec2-user@ec2-XXX-XXX-XXX-XXX.region.compute.amazonaws.com:~/\n\
  ```\n\n我们将使用 `ssh` 命令（从 EC2 控制台的连接屏幕）登录到 EC2 实例，然后使用以下命令连接到 `mysql` 实例：\n\n```\n\
  mysql -h <<database endpoint string>> -u <<db username>> -P 3306 -p\n```\n\n我们将创建一个新的数据库，如下面的截图所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_240_0.png)\n\n图 7.26：在 RDS MySQL 中创建数据库以加载国家查找文件\n\
  \n我们将创建一个表并将数据加载到该表中，如下所示。此时，我们已完成在 MySQL 中创建源表的前提条件：\n\n![](img/e28602b44ec813a47df57c96b204412c_240_1.png)\n\
  \n图 7.27：将国家查找文件加载到 RDS MySQL\n\n现在，我们将为此 MySQL 数据库在 Amazon Athena 中设置查询联合。导航到 Amazon\
  \ Athena 控制台并创建一个数据源。或者，你也可以转到 AWS 无服务器应用程序仓库，创建一个应用程序以部署 Lambda 函数和支持查询联合所需的资源，如下所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_241_0.png)\n\n图 7.28：搜索应用程序\n\n在我们的使用案例中，我们将通过\
  \ Athena 控制台创建数据源，如下文所述。\n\n## 在你的 AWS 账户中设置数据联合\n\n从 Amazon Athena 创建一个新的数据源，如下所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_241_1.png)\n\n图 7.29：Amazon Athena 数据源屏幕\n\
  \n在这里，我们将选择 mysql 作为数据源并点击 Next。你可以根据不同的使用案例选择相应的源数据库引擎：\n\n![](img/e28602b44ec813a47df57c96b204412c_241_2.png)\n\
  \n图 7.30：Amazon Athena 针对 MySQL 数据源的数据联合\n\n为应用程序输入一个名称——在我们的使用案例中是 wranglerathena——并点击**创建\
  \ Lambda 函数**，这将带你到无服务器应用程序部署屏幕。为了更多地了解连接器，你可以阅读许可证、README 文件和模板部分，以了解将要部署的资源。在**应用程序设置**下，你可以为当前的使用案例输入以下值：\n\
  \n- **应用程序名称：** `AthenaMySQLConnector`（保留默认值）。\n- **SecretNamePrefix：** `SecretsManager`\
  \ 密钥的名称，其中包含源数据库的用户名和密码。对于我们的测试，我们将直接在连接字符串中提供它们。但对于生产部署，强烈建议使用带有密码轮换功能的 secrets\
  \ manager 以实现高效的安全。因此，在此字段中输入 `dummysecret` 值。\n- **Spillbucket：** 提供 Lambda 函数可以存储超出其内存限制的数据的\
  \ S3 桶的名称。此功能有效地防止了较大查询结果的 Lambda 内存错误。\n- **DefaultConnectionString：** 以以下格式提供连接字符串：\n\
  - **DisableSpillEncryption：** `False`（除非你不想加密 S3 中的 spill 数据）。\n- **LambdaFunctionName：**\
  \ 提供与 Athena 数据源连接器相同的名称以便于识别。在我们的情况下，这是 wranglerathena。\n- **LambdaMemory** 和 **LambdaTimeout：**\
  \ 除非你想更改它们，否则保留默认的最大值。\n- **PermissionsBoundaryARN：** 在我们的使用案例中留空。\n- **SecurityGroupIds：**\
  \ 提供你希望与 Lambda 函数关联的安全组 ID。安全组需要有访问 MySQL 数据库的规则。\n- **SpillPrefix：** 将此保留为默认值\
  \ `athena-spill`。\n- **SubnetIds：** 提供 Lambda 函数将启动并连接到 RDS MySQL 的子网 ID。提供 RDS\
  \ MySQL 实例所在的子网 ID，或者一个具有访问数据库权限的子网列表。\n\n```\nmysql://jdbc:mysql://<<database endpoint>>:3306/noaa?user=<<username>>&password=<<password>>\n\
  ##Replace << >> values in the above string with correct values for your use case\n\
  ```\n\n应用程序创建完成后，选择在上一步中创建的 Lambda 函数，并在 Amazon Athena 中完成数据源的创建。\n\n\n\n\n\n# 验证联邦数据源的工作状态\n\
  \n方法 1：通过直接按名称引用 Lambda 函数，在 Amazon Athena 中不选择数据源选项执行查询，如下所示。如果一切设置正确，你应该能看到源表中的数据，如下所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_243_0.png)\n\n方法 2：使用在上一步中创建的 Amazon\
  \ Athena 数据源执行查询。在通过此选项进行验证之前，我们需要对由无服务器应用程序创建的 Lambda 函数进行更改，如下所示：\n\n- 导航到 Lambda\
  \ 控制台，选择配置部分中使用的函数名称——wranglerathena。\n- 选择“配置”，然后选择“环境变量”。现在，从默认键名中复制环境变量，并创建一个名为\
  \ wranglermysql_connection_string 的新键，如下面的截图所示。该键名应采用 athenadatasource_connection_string\
  \ 的格式：\n\n图 7.32：更新联邦 Lambda 函数的配置\n\n- 然后，点击“保存”以更新我们在 Lambda 函数中所做的新环境变量更改。\n\n\
  现在，导航到 Amazon Athena 控制台，选择 wranglermysql 作为数据源，你将能够看到新创建的表，如下面的截图所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_244_0.png)\n\
  \n图 7.33：在 Amazon Athena 控制台中从联邦数据源访问表列表\n\n你可以使用 datasource.database.tablename\
  \ 格式查询该表，并像这样验证连接器的功能：\n\n![](img/e28602b44ec813a47df57c96b204412c_245_0.png)\n\n\
  图 7.34：通过 Athena 控制台和注册的数据源查询 RDS MySQL 中的国家表\n\n现在，我们将探讨如何使用 Athena 查询将 MySQL 中的国家数据与\
  \ Amazon S3 中可用的 noaa_parquet 表结合。\n\n## 通过数据联邦丰富数据\n\n为了演示 Athena 联邦的好处，让我们考虑一种情况：你的经理（作为公司的数据分析师）要求你尽快找出本世纪南极洲和另外\
  \ 10 个国家中的最低气温。作为公司的数据分析师，你知道你必须查询 noaa_data_parquet 表，但不确定这些国家的国家代码值。你还知道 MySQL\
  \ 中有一个表包含此信息，并不想等待数据工程团队将该表迁移到 Amazon S3 并在此基础上创建数据目录以便在 Amazon Athena 中查询。\n\n\
  让我们创建一个联邦查询，该查询连接 Amazon S3 和 RDS MySQL 中的数据，并为我们提供用例所需的输出。我们将执行以下查询，以在无数据源之间进行数据迁移的情况下结合所需的数据集：\n\
  \n```\nselect min(data_value) as min_temp from AwsDataCatalog.wranglerathena.noaa_data_parquet\
  \ t1 inner join wranglermysql.noaa.noaa_country t2 on t1.countrycode=t2.countrycode\
  \ where trim(t2.countryname)='Antarctica' and date_field>cast('1900-01-01' as date)\
  \  and element='TMIN'\n```\n\n![](img/e28602b44ec813a47df57c96b204412c_246_0.png)\n\
  \n图 7.35：使用联邦连接识别南极洲最低温度的 Amazon Athena 查询\n\n这展示了 Athena 的能力，可以在实际不移动数据的情况下丰富来自多个源的数据。这对许多团队可能会非常有用。\n\
  \n现在我们已经了解了通过 Amazon Athena 丰富数据的各种方式，我们将在下一节中探讨如何使用 Athena 查询设置数据质量管道。\n\n## 使用\
  \ Athena 设置无服务器数据质量管道\n\n数据质量验证是数据清理管道中非常重要的一步，确保用于分析和可视化的数据准确性。我们将在本节中探讨如何通过 Amazon\
  \ Athena 执行数据质量验证。\n\n### 在 Athena 中实现数据质量规则\n\n让我们考虑一下我们想在 NOAA 气象数据集中验证的规则。以下是仅对某些数据质量规则的高层表示，并非气象数据集的全面规则集：\n\
  \n- 1. 当国家代码为 US 时，state 列应有两个字符的值。\n- 2. date 字段不应有任何未来日期的值，这些值会是错误的测量结果。\n- 3.\
  \ 验证 element 列仅接受文档中提供的值列表。\n\n我们可以制定更多确保更好数据质量的规则，但上述规则足以让我们演示使用 Amazon Athena\
  \ 进行数据质量验证。我们首先设计查询，然后在 Athena 中执行以确保语法和语义的正确性。\n\n```\nselect min(data_value) as\
  \ min_temp from AwsDataCatalog.wranglerathena.noaa_data_parquet t1 inner join wranglermysql.noaa_noaa_country\
  \ t2 on t1.countrycode=t2.countrycode where trim(t2.countryname)='Antarctica' and\
  \ date_field=cast('1900-01-01' as date) and element='TMIN'\n```\n\n数据质量规则 1：对于 state\
  \ 代码列验证，使用这里给出的查询：\n\n```\n--Identify incorrect state codes when Country is US\n\
  select * from ghnd_stations where substring(ID,1,2)='US'\nand length(state)<>2\n\
  ```\n\n在 Athena 中执行查询，并验证我们没有违反数据质量规则的任何记录，如下面的截图所示。这确保了当前数据没有数据错误，并验证我们的查询按预期正确工作：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_247_0.png)\n\n图 7.36：用于识别州代码不等于 2 个字符的记录的\
  \ Amazon Athena 数据质量检查\n\n数据质量规则 2：为了验证我们没有来自未来日期的任何气象观测值，我们将使用下面给出的查询。这确保我们没有来自未来日期的错误观测值：\n\
  \n```\n--Identify records that have future dated values\nselect * from noaa_data_parquet\
  \ where date_field > current_date\n```\n\n我们可以以类似的方式执行并验证上一个查询，确保没有存在数据质量问题的记录。\n\
  \n数据质量规则 3：我们将执行下面给出的查询，以验证观测值是否仅针对有效维度。这是通过验证 element 列来实现的。我们通过使用 NOAA 数据集 README\
  \ 文件（https://docs.opendata.aws/noaa-ghcn-pds/readme.html）中的数据获取了值列表。我们将这些值复制到 Excel\
  \ 表中，使用 = 分隔符将它们分成两列，然后在以下查询中使用它们：\n\n```\n--Identify records with invalid values\
  \ in element column\nselect element,s_flag,max(date_field) as latest_date,count(*)\
  \ as cnt\n```\n\n```\nfrom noaa_data_parquet\nwhere countrycode='US' and element\
  \ not in\n('PRCP','SNOW','SNWD','TMAX','TMIN','ACMC','ACMH','ACSC','ACSH',\n'AWDR','AWND','DAEV','DAPR','DASF','DATN','DATX','DAWM','DWPR','EVAP',\n\
  'FMTM','FRGB','FRGT','FRTH','GAHT','MDEV','MDPR','MDSF','MDTN','MDTX',\n'MDWM','MNP\
  \ N','MXPN','PGTM','PRCP','PSUN','SNOW','SNWD','TAVG','THIC',\n'TMAX','TMIN','TOBS','TSUN','WDF1','WDF2','WDF5','WDFG','WDFI',\n\
  'WDFM','WDMV','WESD','WESF','WSF1','WSF2','WSF5','WSFG','WSFI','WSFM')\nand element\
  \ not like ('SN%') and element not like ('SX%')\nand element not like ('WT%') and\
  \ element not like ('WV%')\ngroup by element,s_flag\n```\n\n在执行查询时，我们发现了一些文档中未提供但基于大量记录的存在似乎像有效值的\
  \ element 值，如下所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_248_0.png)\n\n图 7.37：用于识别不在有效值列表中的\
  \ element 值的 Amazon Athena 数据质量检查\n\n现在，我们有三个数据质量查询，其中有一个包含我们需要进一步分析以理解的一些记录。下一步是在\
  \ DynamoDB 表中设置这些查询，以便可以通过 AWS Step Functions 以无服务器方式在 Amazon Athena 中执行。\n\n##\
  \ 将 Amazon DynamoDB 用作数据质量管道的元数据存储\n\n我们将使用 DynamoDB 来存储查询，以便可以通过您选择的工具以自动化方式执行。让我们创建一个\
  \ DynamoDB 表来存储 SQL 脚本。输入表名，以及分区键和排序键，并将其他设置保留为默认值，如下所示：\n\n\n![](img/e28602b44ec813a47df57c96b204412c_249_0.png)\n\
  \n图 7.38：Amazon DynamoDB 表创建流程 – 用于存储数据质量查询\n\n我们使用应用程序名称作为分区键，这样我们就可以使用同一个 DynamoDB\
  \ 表来存储多个应用程序的数据质量查询。queryid 可以作为一个字段，帮助我们唯一标识每个应用程序内的数据质量查询。\n\n一旦表成功创建，我们将把前一步中设计的查询加载到我们之前创建的\
  \ DynamoDB 表中。选择“探索项目” -> 选择表名 -> “创建项目”按钮。您应该会看到以下内容：\n\n![](img/e28602b44ec813a47df57c96b204412c_249_1.png)\n\
  \n图 7.39：Amazon DynamoDB 表 – 向存储数据质量脚本的表中添加项目\n\n为每个项目输入以下值，并将它们保存回表中：\n\n- application：输入\
  \ noaa_weather\n- queryid：输入 query<x>\n- querystring：从 Athena 控制台复制并粘贴查询字符串\n\n\
  ![](img/e28602b44ec813a47df57c96b204412c_250_0.png)\n\n当所有值都存储在表中后，您可以选择一个 DynamoDB\
  \ 表名，然后选择**探索表项目**，这将带您进入此屏幕，以验证它们是否已正确加载：\n\n![](img/e28602b44ec813a47df57c96b204412c_250_1.png)\n\
  \n现在，我们的查询已在 DynamoDB 表中准备就绪以便执行，我们将看看如何通过无服务器方式通过状态机工作流来执行它们。\n\n## 无服务器数据质量管道\n\
  \n在 AWS 控制台中导航到 **Step function**（步骤函数），并创建一个状态机。选择**标准**工作流，并选择可视化开发，如下所示：\n\n\
  ![](img/e28602b44ec813a47df57c96b204412c_250_2.png)\n\n针对我们的用例，应在状态机中设计以下工作流：\n\n\
  1. 对 Amazon DynamoDB 运行查询，并检索我们应用程序的数据质量 SQL 脚本。\n2. 以并行方式在 Athena 中执行数据质量 SQL 脚本。\n\
  3. 收集结果并在 Lambda 函数中整合它们。\n4. 将 Lambda 函数中的整合输出发送到**简单通知服务**（SNS）端点。这将使一组个人能够收到步骤函数结果的通知，以便采取适当的行动。\n\
  5. 执行并验证步骤函数工作流的工作情况。\n6. 通过 Amazon EventBridge 调度器配置步骤函数以定期执行。\n\n### 步骤 1\n在我们状态机的步骤函数控制台中，在搜索框中搜索\
  \ `dynamoDB query`，并将 DynamoDB 查询图标拖到可视调色板中。\n\n![](img/e28602b44ec813a47df57c96b204412c_251_0.png)\n\
  \n现在，按照以下说明更新参数：\n\n```\n{\n  \"TableName\": \"wranglerdg\",\n  \"KeyConditionExpression\"\
  : \"application=:v1\",\n  \"ExpressionAttributeValues\": {\n    \":v1\": {\n   \
  \   \"S\": \"noaa_weather\"\n    }\n  }\n}\n```\n\n![](img/e28602b44ec813a47df57c96b204412c_252_0.png)\n\
  \n此步骤将针对 wranglerdq 表运行 DynamoDB Query SDK，并根据 `Application = noaa_weather` 属性过滤结果。您可以通过查看\
  \ https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_Query.html#API_Query_ResponseSyntax\
  \ 上此 API 调用的文档，了解此 API 调用的输出将是什么。\n\n我们可以看到它有一个 Items 数组字段，该字段将包含字段名称和字段类型。我们需要仅提取\
  \ SQL 脚本并将其传递给 Athena 以进行执行，如下所示：\n\n```json\n\"Items\": [\n{\n\"string\" : {\n\"\
  B\": blob,\n\"BOOL\": boolean,\n\"BS\": [ blob ],\n\"L\": [\n\"AttributeValue\"\n\
  ],\n\"M\": {\n\"string\" : \"AttributeValue\"\n},\n\"N\": \"string\",\n\"NS\": [\
  \ \"string\" ],\n\"NULL\": boolean,\n\"S\": \"string\",\n```\n![](img/e28602b44ec813a47df57c96b204412c_252_1.png)\n\
  \n我们将使用 $.Items[*].querystring.S JSON 路径来过滤此步骤的输出。在输出部分，选择“使用 OutputPath 过滤输出”，并提供粘贴在此处的\
  \ JSON 路径：\n\n![](img/e28602b44ec813a47df57c96b204412c_252_2.png)\n\n现在，我们将继续开发无服务器数据质量工作流的后续步骤。\n\
  \n### 步骤 2\n我们可以使用 map 函数以并行方式执行 Athena 查询。此函数将根据传递给它的数组输入，以不同输入并行执行操作。在我们的用例中，我们将把查询列表作为一个数组传递给\
  \ map 函数，该函数将对输入数组中的每个查询并行执行 Athena-Startqueryexecution API。\n\nMap 函数将在**流**选项卡下可用，如下图所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_253_0.png)\n\n我们将提供 map 函数各种参数的更新值，您可以在您的工作流中更新它们，如下所示：\n\
  \n- **处理模式：** 选择*内联*。\n- **提供项目数组的路径：** 输入 \"$\"。由于我们已经在上一阶段的输出中仅过滤了查询字符串，因此我们将使用顶层\
  \ JSON 元素（使用 \"$\"）获取数据。\n- **最大并发数：** 输入 5。您可以为您的用例输入不同的值。我们将通过每批执行五个查询来查看查询性能，然后使用此参数增加/减少并行查询执行数量。\n\
  \n搜索 Athena start，您应该会在结果窗口中看到 Athena StartQueryExecution API 对象。将该对象拖到 map 函数内部，如图所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_254_0.png)\n\n图 7.48：步骤函数工作流 – Map 函数并行执行\
  \ Athena 查询\n\n为 Athena StartQueryExecution API 对象输入以下参数：\n\nAPI 参数：输入以下值。如果您针对特定功能使用不同的工作组，请相应更新输入：\n\
  \n```\n{\n  \"QueryString.$\": \"$\",\n  \"WorkGroup\": \"primary\",\n  \"ResultConfiguration\"\
  : {\n    \"OutputLocation\": \"s3://<<path to store athena results>>/\"\n  }\n}\n\
  ```\n\n等待任务完成：勾选复选框。这样做非常重要，以确保工作流等待查询完成。如果您未勾选此复选框，后续步骤将失败，因为它们试图检索尚未完成的 Athena\
  \ 查询结果。\n\n### 步骤 3\n使用 Lambda 函数整合前一步的结果。\n\n#### 步骤 3a\n我们将添加一个**“传递步骤”**，以从 map\
  \ 函数获取结果并将其传递给 Lambda 函数。搜索**“Pass”步骤**并将其拖到工作流中 map 函数之后。单击**Pass 步骤**，导航到**输入**选项卡，然后勾选**使用参数转换输入**复选框，并输入以下值：\n\
  \n```\n{\n    \"Resultpath.$\": \"$[*].QueryExecution.ResultConfiguration.OutputLocation\"\
  ,\n    \"query.$\": \"$[*].QueryExecution.Query\"\n}\n```\n\n#### 步骤 3b\n创建一个 Lambda\
