  \n- 写入数据库：我们可以使用每个数据库引擎模块中的 to_sql 函数将 pandas DataFrame 写入表。这会验证连接对象，然后在表尚不存在时创建表（如果模式设置为覆盖，则会删除并重新创建表）。基于不同的模式，数据会以不同的方式更新：\n\
  \n* **Upsert**：当与一组匹配列匹配时，这会更新特定的一组列（主要用于识别唯一记录）。这适用于具有 Column1、Column2 和 Column3\
  \ 作为主键列的现有表的情况。当我们执行 upsert 时，我们会检查新记录是否与现有记录在 Column1、Column2 和 Column3 上匹配，如果匹配，我们将更新其余列（或其余列的子集）。如果与\
  \ Column1、Column2 和 Column3 不匹配，则新记录将被插入到表中。\n\n* **Append**：这会将新记录插入到表中。我们可以通过将记录与特定的一组列匹配来检查记录是否与现有记录匹配，然后在匹配时选择忽略它。如果没有匹配，记录可以插入到表中。\n\
