  \n我们看到了如何通过简单地使用 pip 命令在本地机器/EC2 实例上安装 awswrangler 软件包。我们还从 awswrangler git 仓库下载了代码，进行了项目所需的更改，并安装了修改后的\
  \ awswrangler 版本。我们还学习了如何在虚拟环境中安装软件包，以便为一个项目所做的更改不会与其他项目冲突。\n\n恭喜完成此步骤！你可以花一些时间在此处与该软件包互动以更深入地了解它。一旦你完成探索，让我们进入下一节，在那里我们需要帮助\
  \ IT 人员使用 Lambda 函数安装 awswrangler。\n\n\n\n\n\n![](img/e28602b44ec813a47df57c96b204412c_104_0.png)\n\
  \n如果您想在不做任何自定义修改的情况下使用某个包，从 AWS 管理的层中使用 pandas 的 AWS SDK 是最简单、最容易的选择。另请注意，在新功能在\
  \ AWS 管理的层中发布或提供之前，可能存在长达一周或更长时间的延迟。现在，您也可以使用不同的 Python 版本和不同的架构创建 Lambda 函数，同时仍然利用\
  \ `aws wrangler`。以下截图显示了在 Python 3.8 和 ARM 架构下创建的 Lambda 函数中可用的 `aws wrangler` 层。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_104_1.png)\n\n## 自定义安装 – 创建自定义托管层\n\n\
  也有一种情况，您希望使用 AWS SDK for pandas 并添加一些修改和自定义代码以满足您的需求。我们将 `.zip` 归档文件上传到自定义层，然后在\
  \ Lambda 函数中使用它。存在 Lambda 服务限制（https://docs.aws.amazon.com/Lambda/latest/dg/gettingstarted-limits.html#function-configuration-deployment-and-execution-整个\
  \ Lambda 部署包大小应小于未压缩 250 MB（压缩 50 MB）。\n\n如以下截图所示，如果我们归档 awswrangler 库的内容，压缩后约为\
  \ 86 MB，不包括实际的 Lambda 代码。这超过了 Lambda 部署包大小的限制：\n\n```\n(awspanadas) $ ls\n   aws-sdk-pandas\
  \    awspanadas\n(awspanadas) $cd awspanadas/lib/python3.9/site-packages\n(awspanadas)\
  \ $zip -r ../../..awswrangler.zip .\nadding: pandas-1.5.0.dist-info/ (stored 0%)\n\
  adding: pandas-1.5.0.dist-info/RECORD (deflated 69%)\n```\n\n图 3.14：awswrangler\
  \ Lambda 安装 – 创建自定义 Lambda 包\n\n```\n(awspanadas) $ ls -lh\ntotal 197032\ndrwxr-xr-x\
  \  29 sssmSun staff    928B Sep 28 14:30 aws-sdk-pandas\ndrwxr-xr-x   8 sssmSun\
  \ staff    256B Sep 28 14:48 awspanadas\n-rw-r--r--   1 sssmSun staff      86M Sep\
  \ 28 16:23 awswrangler.zip\n```\n\n图 3.15：awswrangler Lambda 安装 – 验证创建的 Lambda 包\n\
  \n因此，我们必须以最佳方式构建 Lambda 包以便上传到 Lambda 函数。幸运的是，我们有一个脚本可以帮助我们执行完全相同的活动。请按照以下步骤获取一个小于\
  \ 50 MB 的 ZIP 文件以上传到 Lambda 函数。\n\n以下是先决条件：\n\n- 我们将利用为本地机器/EC2 实例设置而使用的 awswrangler\
  \ 本地存储库。还记得我们在 __init__.py 中对 message 和 description 变量所做的更改吗？我们将在 Lambda 函数中打印它们以验证我们的安装。\n\
  - 您的机器上需要运行 Docker daemon，我们将用它来构建 Lambda 层。此外，请注意，Docker 应分配足够的内存来构建代码，以避免在过程中出现内存不足错误。请注意，以下截图为\
  \ Docker 分配了 8 GB 内存以供使用，因此无论您的物理机器容量如何，Docker 都需要有足够的内存和计算资源才能成功完成构建。\n\n![](img/e28602b44ec813a47df57c96b204412c_106_0.png)\n\
  \n图 3.16：awswrangler 自定义 Lambda 安装 – 容器内存配置\n\n我们现在开始操作，如下所示：\n\n- 1. 进入源代码路径并执行构建可添加到\
  \ AWS Lambda 函数的 Lambda 层的命令。现在，执行 `sh build-lambda-layers.sh` 命令以启动 `awswrangler`\
  \ 自定义构建。\n\n```\n(awspandas) $ ls\n build-docs.sh build-wheel.sh publish.sh\nbuild-lambda-layers.sh\
  \ lambda\n(awspandas) $ sh build-lambda-layers.sh\n++ python -c 'import awswrangler\
  \ as wr; print(wr.__version__)'\n+ VERSION=2.17.0\n```\n\n图 3.17：awswrangler 自定义\
  \ Lambda 安装 – 构建 Lambda 层\n\n> **注意**\n> \n> 此步骤完成需要很长时间。此代码将为 Python 3.7、Python\
  \ 3.8 和 Python 3.9 分发构建 Lambda 层。\n\n打开 `build-lambda-layers.sh` 的代码，如果您计划仅在 Python\
  \ 3.9 环境中部署此库，请在构建过程中注释掉 Python 3.7 和 Python 3.8 行。\n\n```\n# # Python 3.7\n# docker\
  \ run \\\n# --volume \"$DIR_NAME\":/aws-data-wrangler/ \\\n# --workdir /aws-data-wrangler/building/lambda\
  \ \\\n# --rm \\\n# awswrangler-build-py37 \\\n# build-lambda-layer.sh \"${VERSION}-py3.7\"\
  \ \"ninja-build\"\n#fi\n\n# Python 3.8\n#docker run \\\n# --volume \"$DIR_NAME\"\
  :/aws-data-wrangler/ \\\n# --workdir /aws-data-wrangler/building/lambda \\\n# --rm\
  \ \\\n# awswrangler-build-py38 \\\n# build-lambda-layer.sh \"${VERSION}-py3.8${ARCH_SUFFIX}\"\
  \ \"ninja-build\"\n\n# Python 3.9\ndocker run \\\n--volume \"$DIR_NAME\":/aws-data-wrangler/\
  \ \\\n--workdir /aws-data-wrangler/building/lambda \\\n--rm \\\nawswrangler-build-py39\
  \ \\\nbuild-lambda-layer.sh \"${VERSION}-py3.9${ARCH_SUFFIX}\" \"ninja-build\"\n\
  ```\n\n图 3.18：awswrangler 自定义 Lambda 安装 – Python 3.9\n\n前面的截图显示了针对 Python 3.7 和\
  \ Python 3.8 的注释代码段。\n\n- 2. 构建完成后，您应该会看到为三个 Python 版本 3.7、3.8 和 3.9 创建的压缩文件。请记住将构建函数更改为您\
  \ Lambda 应用程序使用的特定 Python 版本或版本。可以看到压缩文件现在的大小约为 ~44–46 MB。\n\n```\n(awspandas) $ls\
  \ -lh ../dist\ntotal 279048\n-rw-r--r--  1 smsun  staff  246K Sep 28 22:17 awswrangler-2.17.1-py3-none-any.whl\n\
  -rw-r--r--  1 smsun  staff   44M Sep 30 11:41 awswrangler-layer-2.17.0-py3.7.zip\n\
  -rw-r--r--  1 smsun  staff   46M Sep 30 13:33 awswrangler-layer-2.17.0-py3.8.zip\n\
  -rw-r--r--@ 1 smsun  staff   46M Sep 30 16:06 awswrangler-layer-2.17.0-py3.9.zip\n\
  ```\n\n图 3.19：awswrangler 自定义 Lambda 安装 – 验证创建的 Lambda 层\n\n- 3. 使用 Lambda 版本 3.9\
  \ 创建一个 Lambda 函数，然后在 Lambda 控制台中创建一个自定义层。\n\n### 层版本配置\n\n- Description - *可选*\n\
  - aws-wrangler with Python3.9 version\n- ● Upload a .zip file\n- ○ Upload a file\
  \ from Amazon S3\n\n![](img/e28602b44ec813a47df57c96b204412c_108_0.png)\n\n- Compatible\
  \ architectures - *可选* Info\n- 选择层的兼容指令集架构。\n- ☑ x86_64\n- ☐ arm64\n\n- Compatible\
  \ runtimes - *可选* Info\n- 选择最多 15 个运行时。\n- Runtimes ▼\n- Python 3.9 ✖\n\n图 3.20：aws-wrangler\
  \ 自定义 Lambda 安装 – 上传自定义 Lambda 层\n\n4. 使用 Python 3.9 运行时创建一个 Lambda 函数并粘贴以下代码到其中：\n\
  \n```\n```python\nimport json\nimport awswrangler as wr\n\ndef lambda_handler(event,\
  \ context):\n    # TODO implement\n    print(wr.__version__)\n    print(wr.__description__)\n\
  \    print(wr.__message__)\n    return {\n        'statusCode': 200,\n        'body':\
  \ json.dumps('Hello from Lambda!')\n    }\n```\n```\n\n## Python shell 作业的 awswrangler\
  \ 标准安装\n\nPython shell 作业环境有两种不同的 Python 版本，3.6 和 3.9（默认是 Python 3.6）。我们可以使用 wheel\
  \ 文件将外部库附加到 Glue Python shell 作业。Wheel 文件是 Python 生态系统的一部分，有助于 Python 包安装过程，使其更快、更稳定：\n\
  \n- AWS Glue Python 3.6 环境未预装 awswrangler。请参阅 Python Glue 作业环境中已安装的库（https://docs.aws.amazon.com/glue/latest/dg/add-job-python.html#python-shell-supported-library），然后再添加其他库。我们必须附加我们希望在\
  \ Glue 作业中使用的 awswrangler 版本的 wheel 文件，并将其附加，如以下步骤所述：\n\n- I. 对于 Python 3.6 作业，您可以使用以下语法从公共工件存储桶下载\
  \ wheel 文件：s3://aws-data-wrangler-public-artifacts/releases/<version>/ awswrangler-<version>-py3-none-any.whl。\n\
  \n```\n(awspandas) $aws s3 cp s3://aws-data-wrangler-public-artifacts/releases/2.14.0/awswrangler-2.14.0-py3-none-any.whl\
  \ .\ndownload: s3://aws-data-wrangler-public-artifacts/releases/2.14.0/awswrangler-2.14.0-py3-none-any.whl\
  \ to ./awswrangler-2.14.0-py3-none-any.whl\n```\n\n图 3.23：awswrangler glue 安装 –\
  \ 下载 wheel 文件\n\n> Note\n> awswrangler 从 awswrangler 版本 2.15 开始不再支持 Python 3.6，因此如果您使用\
  \ Python 3.6 使用更高版本，将会抛出错误。\n\n- II. 将 wheel 文件上传到 S3 存储桶并复制 S3 URL。使用 Python 版本\
  \ 3.6 创建一个 Glue 作业，并在作业详细信息页面的高级属性下 Python 库路径部分提供 wheel 文件。\n\n![](img/e28602b44ec813a47df57c96b204412c_110_0.png)\n\
