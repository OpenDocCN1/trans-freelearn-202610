  \ Pandas 构建端到端数据整理流水线\n\n现在我们拥有了一种不同的数据表示方式，这是原始数据源中不可用的。类似地，你可以根据项目消费需求使用 pandas\
  \ 操作（如透视、非透视等）来转换数据。\n\nPandas 提供了结构化成数据的能力，例如删除不需要的列、重命名列以及根据需要更改索引。这有助于将数据格式更改为更适合每种用例的更标准格式。此外，Pandas\
  \ 中有一些函数可用于展平单列内的嵌套数据，以便更好地分析数据。\n\n为了展示我们的工作，让我们考虑一个示例体育场数据，其中包含体育场的地址和餐饮选项。我们的示例数据集中没有这些数据，因此将使用一个示例值来展示\
  \ JSON 数据展平是如何工作的。我们将使用 `json_normalize` ([https://pandas.pydata.org/docs/reference/api/pandas.json_normalize.html](https://pandas.pydata.org/docs/reference/api/pandas.json_normalize.html))\
  \ 函数将嵌套的 JSON 数据展平为列以供分析。现在我们可以更高效地查询这些列的数据。你可以通过筛选 Location.State 列来查询加利福尼亚州有多少个体育场。\n\
  \n```python\nstadium_address = {'Name': 'Angel Stadium', 'Location': {'City': 'Anaheim',\
  \ 'Zipcode': '92806', 'State': 'CA', 'Address': {'Street Name': 'E Gene Autry Way',\
  \ 'Number': '2000'}}, 'Dining': ['The Sweet shop', 'Big A Burger']}\n```\n\n```python\n\
  from pandas import json_normalize\nflat1 = json_normalize(stadium_address)\n```\n\
  \n| | Name | Dining | Location.City | Location.Zipcode | Location.State | Location.Address.Street\
  \ Name | Location.Address.Number |\n|:---|:---|:---|:---|:---|:---|:---|:---|\n\
  | 0 | Angel Stadium | [The Sweet shop, Big A Burger] | Anaheim | 92806 | CA | E\
  \ Gene Autry Way | 2000 |\n\n图 9.30：使用 json_normalize 函数展平层次结构 JSON 数据\n\n然而，我们在\
  \ Dining 列中仍有列表形式的数据。如果我们希望展开该列，它将有助于我们进一步分析。为此，我们需要创建一个函数，该函数将展平来自 JSON 字符串的字典和列表数据。\n\
  \n```python\n# 函数参考自 https://towardsdatascience.com/flattening-json-objects-in-python-f5343c794b10\n\
  def flatten_json(y):\n    out = {}\n    def flatten(x, name=''):\n        if type(x)\
  \ is dict:\n            for a in x:\n                flatten(x[a], name + a + '_')\n\
  \        elif type(x) is list:\n            i = 0\n            for a in x:\n   \
  \             flatten(a, name + str(i) + '_')\n                i += 1\n        else:\n\
  \            out[name[:-1]] = x\n    flatten(y)\n    return out\n```\n\n图 9.31：展平包含\
  \ JSON 数据的列表和字典列的函数\n\n现在，你可以看到输出显示了从 JSON 字符串中展平的字典和列表数据。我们使用了在前一步骤中创建的 `flatten_json`\
  \ 函数来实现所需输出：\n\n```python\nflat = flatten_json(stadium_address)\njson_normalize(flat)\n\
  ```\n\n图 9.32：展平包含列表和字典列的 JSON 数据\n\n| | Name | Location_City | Location_Zipcode\
  \ | Location_State | Location_Address_Street_Name | Location_Address_Number | Dining_0\
  \ | Dining_1 |\n|:---|:---|:---|:---|:---|:---|:---|:---|:---|\n| 0 | Angel Stadium\
  \ | Anaheim | 92806 | CA | E Gene Autry Way | 2000 | The Sweet shop | Big A Burger\
  \ |\n\n让我们花点时间来理解该函数是如何工作的，以便你可以进一步开发它。我们将向函数添加注释，并展示 `flatten` 函数的工作方式。该函数将被递归调用以展平\
  \ JSON 字符串：\n\n```python\n# 用于学习函数的工作方式。\ndef flatten(x, name='', out={}):\n   \
  \ print(x)\n    a=\"\"\n    if type(x) is dict:\n        for a in x:\n         \
  \   print(\"\")\n            print(\"Dictionary route \" + a)\n            flatten(x[a],\
  \ name + a + '_')\n    elif type(x) is list:\n        i = 0\n        for a in x:\n\
  \            print(\"********************\")\n            print(\"List route \"\
  \ + name + str(i) + '_')\n            flatten(a, name + str(i) + '_')\n        \
  \    i += 1\n    else:\n        print(\"===> Found a value for target column -->\
  \ \" + x)\n        out[name[:-1]] = x\n```\n\n图 9.33：通过添加注释来理解 flatten 函数的工作方式\n\
  \n我们在函数中立即添加了 print 语句，以理解传入的输入字符串。我们在每个部分中添加了 print 语句，执行以下功能：\n\n- 展平字典对象\n- 展平列表对象\n\
  - 识别要存储在目标列中的原子值\n\n### 该函数是如何工作的？\n\n该函数将遍历提供的数据，并识别当前对象是字典还是列表：\n\n- 字典对象具有花括号，并采用键值对结构，例如：`{\
  \ \"name\":\"Angel stadium\", \"state\":\"CA\" }`。字典内部可以包含字典或列表对象。\n- 列表对象包含重复多次的类似数据项。它们存储在中括号结构中。它们可用于存储多值属性。在上面的示例中，我们将\
  \ Angel stadium 内多家餐厅的数据存储在列表中 – 例如：`[ \"The sweet shop\", \"Big A burger\" ]`。\n\
  \n一旦识别出对象，如果它是嵌套在另一个对象中的字典或列表，该函数将递归调用自身。\n\n以下截图提供了该函数在提供最终输出之前如何解析数据的说明。遵循每个步骤，你可以更好地理解该函数的工作原理：\n\
  \n\n\n\n\n## Flatten 函数执行输出\n\n```python\nflatten(stadium_address)\n\n{'Name': 'Angel\
