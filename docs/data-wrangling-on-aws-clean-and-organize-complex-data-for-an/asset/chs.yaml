  \ Redshift。\n\n## 摘要\n\n在本章中，我们学习了如何使用 AWS SDK for pandas（也称为 `awswrangler`）。我们探索了\
  \ `awswrangler` 库中可用的各种组件，以及它如何将 pandas DataFrame 更靠近 AWS 生态系统。我们学习了如何为不同的用例和开发环境定制和安装该库。我们还查看了\
  \ `awswrangler` 与 AWS 服务的集成，例如 Amazon S3、Amazon RDS、Amazon Redshift 和 Amazon Athena，以及\
  \ `awswrangler` 中可用的不同功能。\n\n在下一章中，我们将学习 SageMaker Data Wrangler，它帮助我们作为机器学习管道的一部分执行数据整理活动。\n\
  \n## 介绍 SageMaker Data Wrangler\n\n数据处理是机器学习（ML）的重要组成部分。事实上，说 ML 模型的好坏仅取决于用于训练它们的\
  \ 가데이터，这并不过分。根据 2016 年福布斯的一项调查，80% 花在 ML 工程项目上的时间是用于数据准备。这是一个惊人的高比例的时间。为什么会这样？由于现实世界数据的固有特性，数据准备既繁琐又资源密集。这种现实世界数据通常被称为\
  \ ML 中的脏数据、不干净数据、嘈杂数据或原始数据。在几乎所有情况下，这都是你开始 ML 过程时使用的数据类型。即使在罕见的情况下，你认为拥有良好的数据，你仍然需要确保其格式正确，并将其缩放以使其有用。对此原始数据应用\
  \ ML 算法不会产生高质量的结果，因为它们无法识别模式、正确检测异常，或者在开发和训练环境之外具有良好的泛化能力。\n\n在当今互联和数字化的世界中，数据生成的速度快于其消费和处理的速度。这种大量生成的数据对于构建先前未探索过或被认为不可能的应用程序的\
  \ ML 模型可以成为一个真正的优势。然而，这也带来了一些挑战。让我们接下来看看其中一些。\n\n主要挑战之一是数据量。由于生成的数据量巨大，我们需要能够摄取、处理和相关属性的框架和工具。我们需要健壮且能够自动扩展以满足数据摄取需求的工具。下一个挑战是数据质量。在现实世界中，数据很少是完美的；你必须应对诸如不准确、不一致、缺失数据以及多种数据格式等挑战，等等。在这里，我们需要能够准备和清理这些数据的工具，以便它们可以作为我们\
  \ ML 管道的输入。由于大量此数据清洗是可重复且耗时的，这些工具应该原生支持可重用性，以便数据从业者能够有效地以尽可能少的摩擦操作。数据从业者很少在孤立的系统中工作。他们通常是组织内更大团队的一部分，并且通常需要与其他跨职能团队进行协作。重要的是，他们用于数据处理的工具支持这种协作，并与组织现有的工具和存储库集成。\n\
  \n\n\n\n\n近年来，我们有意努力构建负责任的机器学习模型——公平且无偏见的模型。解决这个问题是困难的。之所以在真实世界数据中难以解决的一个主要原因是此类数据中可能存在固有的偏见。这些偏见可能表现为某一类别的不平衡或代表性不足。偏见也可能由于特定数据源的选择而渗入。此外，某些数据集中可能存在历史偏见，这些偏见会进入你的机器学习数据。检测偏见也很困难，因为它并不总是能通过标准的数据可视化和分析工具显现出来。你通常需要计算额外的指标来挖掘这些隐藏的偏见。这，如果手动完成，又会既繁琐又耗时。即使是脚本化或编程实现，也可能出错。如果这些偏见未被检测到且未得到纠正，它们可以直接转移到在该数据上训练的机器学习模型中，从而导致现实世界的机器学习模型存在偏见。虽然重要的是要理解在数据科学中存在这样一些场景，即偏见确实是我们机器学习模型能够在现实世界中很好地泛化所需要的，但这超出了本书的范围。目前，我们将假设数据中的偏见是我们需要在数据准备过程中检测和纠正的东西。因此，我们用于机器学习的\
  \ 数据准备和处理工具必须能够原生地检测和修复原始数据中的这些偏见。机器学习的数据准备涉及多个步骤，例如数据转换、特征工程以及数据可视化和验证。机器学习的数据准备涵盖了将数据以可用于训练机器学习模型格式所需的一切。更具体地说，数据准备包括数据预处理和特征工程。虽然独立的数据准备工具的采用率不断增长，但数据准备仍然繁琐、耗时且复杂。这些工具中的大多数通常缺乏集成框架，而集成框架对于构建机器学习管道至关重要。将数据准备与机器学习管道集成的能力确保了这些管道是可重复、可重用和可部署的。这进一步使机器学习工程师能够构建机器学习运维（MLOps）管道。\n\
  \n正如你在前几章中所看到的，亚马逊网络服务（AWS）提供了各种用于数据处理的专用工具，如 Glue 和 Elastic MapReduce（EMR）。虽然迄今为止我们所涵盖的所有工具都可用于机器学习，但在本章中，我们将介绍\
  \ SageMaker Data Wrangler，这是一个专为机器学习设计的工具。SageMaker Data Wrangler 是一种数据处理工具，使数据科学家能够导入、转换和分析数据以专门用于机器学习。SageMaker\
  \ Data Wrangler 拥有超过 300 种内置转换，这些转换通常用于处理机器学习的数据。借助 SageMaker Data Wrangler，数据科学家可以创建自动化的\
  \ 数据编排工作流并生成数据质量的洞察。使用 Data Wrangler，你可以轻松地将实验代码投入生产。无需手动筛选和翻译数百行的数据准备和摄取代码，你可以直接导出已准备好的数据。你可以从多个数据源导入数据，例如亚马逊简单存储服务（Amazon\
  \ S3）、Amazon Athena、Amazon Redshift、Snowflake 和 Databricks，并使用超过 300 种内置数据转换和代码片段库处理你的数据，以便在无需编写任何代码的情况下快速规范化、转换和组合特征。你还可以将自定义转换以\
  \ PySpark、结构化查询语言（SQL）或 pandas 的形式引入。事实上，你甚至无需导入数据集即可开始探索 Data Wrangler。Data Wrangler\
  \ 的一项新近发布的功能使你能够更快地开始使用 Data Wrangler 进行实验，通过使用示例数据集并遵循建议的操作，轻松首次导航该产品。一旦你处理完原始数据，你可以直接将其导出到\
  \ S3 或直接导出到特征存储，例如 SageMaker Feature Store。\n\nData Wrangler 支持额外的集成，允许你与其他数据存储集成，例如\
  \ Snowflake，从而使数据科学家能够以更少的精力和时间完成数据准备、清理和特征工程任务。除了直接导出处理后的数据外，你还可以一键将所有数据准备工作流直接导出到笔记本中，以便轻松将其投入生产。这种将整个数据处理流程导出为代码的能力在将数据处理与多种工作流自动化和编排工具集成时非常有用，例如\
  \ Apache Airflow、SageMaker Pipelines 和 AWS Step Functions 等。换句话说，SageMaker Data\
  \ Wrangler 可以减少聚合和准备数据用于机器学习所需的时间，并直接使数据科学家能够花费更多时间创建机器学习模型。总体而言，Data Wrangler 不仅为你提供强大的数据可视化和数据转换工具集，还为你提供快速将工作流投入生产的能力。顾名思义，Amazon\
  \ SageMaker Data Wrangler 是 Amazon SageMaker Studio 中的一个功能。出于清晰起见，曾经存在 SageMaker\
  \ Studio 之外的开源版本的 Data Wrangler，现已更名为 AWS SDK for pandas。Amazon SageMaker Studio\
  \ 是机器学习的基于 Web 的集成开发环境（IDE）。SageMaker Studio 为数据科学家构建、训练和部署机器学习模型提供了所需的所有工具。SageMaker\
  \ Studio 具有多项功能，可进行偏见检测、数据处理、自动化机器学习（AutoML）、机器学习训练、模型部署和 MLOps。因此，要从 SageMaker\
  \ Studio 使用 SageMaker Data Wrangler，你必须首先确保已设置 Amazon SageMaker Studio。虽然本章不涉及 SageMaker\
  \ Studio 提供的所有功能的详细概述，但我们在本章末尾包含了一个 SageMaker Studio 设置先决条件部分，以便你能够快速设置并开始使用 SageMaker\
  \ Data Wrangler。在本书撰写时，SageMaker Data Wrangler 支持表格数据和时间序列数据。简而言之，Amazon SageMaker\
  \ Data Wrangler 是 Amazon SageMaker 的一个功能，可通过可视化界面使数据科学家和工程师更快地为机器学习应用准备数据。Data Wrangler\
  \ 将聚合和准备数据用于机器学习所需的时间从数周缩短到数分钟。SageMaker Data Wrangler 的核心功能包括纠正数据问题，例如数据不平衡和缺失数据，以及专门为机器学习转换数据。在下一节中，我们将介绍\
  \ SageMaker Data Wrangler 的一些核心功能。\n\n## 数据导入\n\n在使用 SageMaker Data Wrangler 处理数据之前，你首先需要将数据导入\
  \ Data Wrangler。使用 Data Wrangler，你可以连接并从各种数据存储导入数据。当你首次启动 Data Wrangler 时，第一个屏幕会询问你是否要导入数据或使用示例数据集：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_152_0.png)\n\nAmazon S3 是一种基于对象的 数据存储，已迅速成为互联网的事实上的存储。由于其每\
  \ GB 的低成本和高可靠性，你可以随时随地从网络上的任何位置存储和检索任意数量的数据，使用 Amazon S3。你可以使用控制台或通过 API 以编程方式上传和访问数据，这也是与\
  \ Amazon S3 中数据交互最常见的方式。Amazon S3 实现了存储桶和对象架构。你可以将存储桶视为文件夹，将对象视为逻辑上存储在存储桶内的文件。SageMaker\
  \ Data Wrangler 支持与 Amazon S3 的原生连接。当你将 Data Wrangler 连接到 Amazon S3 中的数据时，它会使用 S3\
  \ Select 在实际导入之前查询和预览你的数据。这使数据科学从业者能够获得数据的概览，包括其特征，以确保一切看起来正常，然后再继续数据处理。S3 Select\
  \ 也非常快；事实上，它旨在将查询性能提高多达 400%，并将查询成本降低多达 80%。它通过检索对象数据的子集（使用简单的 SQL 表达式）而不是整个对象来实现这一点，而整个对象大小可达\
  \ 5 TB。当从 Amazon S3 导入数据时，你可以选择导入单个文件或同一存储桶中的多个文件。你还可以选择导入整个文件或作为样本的一部分。然而，在处理多个文件时，你需要确保文件必须位于\
  \ S3 存储桶内的同一文件夹中，并且必须共享相同的标题或没有标题。支持的文件格式包括 JavaScript 对象表示法（JSON）、逗号分隔值（CSV）、Parquet\
  \ 和优化行列式（ORC）。除了 Amazon S3 外，Data Wrangler 还支持与 Amazon Athena 的原生连接以导入数据。Amazon\
  \ Athena 是一种无服务器交互式查询服务，可轻松使用标准 SQL 直接在 Amazon S3 中分析数据。在 Athena 中，表和数据库是用于定义底层源数据架构的元数据定义的容器。对于每个数据集，Athena\
  \ 中必须存在一个表。数据库是表的逻辑分组，并且仅保存数据集的元数据和架构信息。使用 Data Wrangler，你可以查询 Athena 数据库并将结果导入\
  \ Data Wrangler。与 Amazon S3 类似，从 Athena 导入数据时，你可以导入整个数据集或作为样本导入数据集的一部分。大中型企业通常会设置数据仓库。Data\
  \ Wrangler 支持与数据仓库服务（如 Amazon Redshift 和 Snowflake）的原生集成。Amazon Redshift 是一种完全托管的\
  \ PB 级云数据仓库服务。你可以连接并查询一个\n\n\n\nor more Amazon Redshift clusters in Data Wrangler.\
  \ Additionally, Data Wrangler offers seamless integration with Snowflake, allowing\
  \ you to effortlessly prepare data stored in Snowflake for ML tasks. With a simple\
  \ and intuitive interface, you can establish a direct connection to Snowflake without\
  \ the need for any coding. Moreover, Data Wrangler facilitates data integration\
  \ by enabling you to combine your Snowflake data with information residing in Amazon\
  \ S3, as well as data extracted through Amazon Athena and Amazon Redshift. If you\
  \ prefer to utilize Databricks as your data source, Data Wrangler supports connection\
  \ to this data processing service as well. By leveraging the **Java Database Connectivity\
  \ (JDBC)** import functionality, you can import data assets from your Databricks\
  \ database. Once connected, you can specify a SQL query to extract the required\
  \ data and seamlessly import it into Data Wrangler for further processing.\n\n##\
  \ Data orchestration\n\nData orchestration can be defined as the process of combining\
  \ data from various sources, including the steps to import, transform, and load\
  \ it to the destination data source, with the fundamental principle being the ability\
  \ to automate all the steps involved in the data preparation steps in a repeatable\
  \ and reusable form, which can then be integrated with the overall ML pipelines.\
  \ While data orchestration can be used in a wider context that can also include\
  \ resource provisioning, scaling, and monitoring, the core of data orchestration\
  \ is creating and automation data workflows, and this is where we will focus for\
  \ the remainder of the book. The other heavy-lifting tasks of provisioning, scaling,\
  \ and monitoring are taken care of by AWS.\n\nSageMaker Data Wrangler uses a data\
  \ flow to connect the datasets and perform transformation and analysis steps. This\
  \ data flow can be used to define your data pipeline and consists of all the steps\
  \ that are involved in data preparation. When you create a data flow in Data Wrangler,\
  \ it automatically provisions the resources needed to run your analysis and transformations\
  \ that you will define inside your flow. While there is a default option, you also\
  \ have the flexibility of choosing a supported instance type based on your specific\
  \ data preparation needs.\n\nData flow creation in SageMaker Data Wrangler is GUI\
  \ based. When you first import your data (or use a sample dataset), Data Wrangler\
  \ automatically infers the data types of the columns in your data source and creates\
  \ a new data frame. Both the data source and the data frame appear in the data flow\
  \ UI of Data Wrangler. Data Wrangler allows you to easily add additional steps to\
  \ your data pipeline using the data flow UI.\n\nData Wrangler steps can be categorized\
  \ as transform, analysis, join, and concatenate. A transform step—as the name indicates—consists\
  \ of applying transformations to your data. A join step includes a join operation\
  \ with another dataset. A concatenate step, on the other hand, includes a concatenate\
  \ operation with another dataset. You can use the analysis step to add ad hoc analysis\
  \ that may be helpful with your data preparation.\n\nSpending time on data preparation\
  \ early in the ML life cycle can significantly improve the model performance and\
  \ also significantly reduce training time and cost. In most real-life scenarios,\
  \ data preparation is iterative and includes multiple passes; as such, you will\
  \ end up doing multiple transformations on the same dataset, and these will appear\
  \ stacked in the data flow UI. All the steps in your data flow can be updated or\
  \ deleted directly from the data flow UI (shown in *Figure 4.2*) or the table UI:\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_154_0.png)\n\nFigure 4.2 – Data Wrangler\
  \ data flow UI\n\nWe will go through the details of a data flow in the next chapter,\
  \ where we will cover a step-by-step example of creating a data flow. All the steps\
  \ in your data flow can be saved and exported as a file with the .flow extension.\
  \ This enables the process to be repeatable, version controlled, and integrated\
  \ with the overall ML pipeline. Additionally, you can also use AWS services such\
  \ as Amazon EventBridge and AWS Lambda to schedule automatic runs of these data\
  \ flows. Finally, since this orchestration is logically separated from compute and\
  \ storage, you can optimize resource utilization by turning off instances when not\
  \ in use and still retain all the steps in the flow that can be executed as needed.\n\
  \n## Data transformation\n\nData processing for ML primarily includes data transformation.\
  \ At its core, SageMaker Data Wrangler includes over 300 built-in transformations\
  \ that are commonly used for cleaning, transforming, and featuring your data specifically\
  \ for data science and ML. Using these built-in transformations, you can transform\
  \ columns within your dataset without having to write any code. In addition to these\
  \ built-in transformations, you can add custom transformations using PySpark, Python,\
  \ pandas, and PySpark SQL.\n\nSome of these transformations operate in place, while\
  \ others create a new output column in your dataset. Whenever you incorporate a\
  \ transform into your data flow, it introduces a new step in the process. Each added\
  \ transform modifies your dataset and generates a fresh data frame as a result.\
  \ Subsequently, any subsequent transforms you apply will be performed on this updated\
  \ data frame.\n\nIn the real world, datasets are often imbalanced. This imbalance\
  \ can be in the form of an underrepresented class or sometimes even a complete absence\
  \ due to sampling errors. Needless to say, this is one of the starting issues that\
  \ must be tackled in data processing and can also be time-consuming to detect and\
  \ fix. SageMaker Data Wrangler includes a balance data operation that enables data\
  \ practitioners to quickly balance imported datasets. The balance operation within\
  \ Data Wrangler enables standard data balance operations. These include the following:\n\
  \n- **Random oversampling**: This operation randomly duplicates instances from the\
  \ minority class\n- **Random undersampling**: Similar to random oversampling, this\
  \ operation randomly removes samples from the overrepresented class\n- **Synthetic\
  \ Minority Oversampling Technique (SMOTE)**: SMOTE utilizes samples from the underrepresented\
  \ category to interpolate new synthetic minority samples\n\nIn addition to the built-in\
  \ one-click transforms, Data Wrangler also supports custom transforms. Custom transforms\
  \ enable data scientists to work with packages and frameworks that they are already\
  \ familiar with to write custom transform operations. These include the use of defined\
  \ functions via Python, PySpark, PySpark (SQL), or pandas. Data Wrangler also allows\
  \ you to use popular libraries by importing them in the custom code block of the\
  \ custom transform operation. There are, however, some restrictions using custom\
  \ transform operations, which we will cover in depth in the next chapter.\n\nYou\
  \ can also implement custom formulas via PySpark SQL to generate new columns or\
  \ features for your dataset. As we briefly looked at in the *Data orchestration*\
  \ section, SageMaker Data Wrangler data transformations also support standard join\
  \ and concatenation operations.\n\nSageMaker Data Wrangler also works with non-numeric\
  \ data. It includes built-in transforms for one-hot encoding, categorical encoding,\
  \ and similarity encoding, among others. In addition, depending on the type of data\
  \ science or ML problem at hand, it might be useful to featurize text. Data Wrangler\
  \ transforms include capabilities to vectorize text data—that is, create meaningful\
  \ numeric embeddings from text data in the form of vectors, which can then be used\
  \ to perform numeric operations.\n\nAnother commonly seen data type in ML is time\
  \ series data. This is data that is indexed to a specific time. SageMaker Data Wrangler\
  \ transforms include a number of options to work with time series data. This includes\
  \ commonly used operations such as grouping time series data, handling missing values\
  \ within time series data, extracting features from time series data, and using\
  \ rolling windows within time series data.\n\nThe following screenshot shows the\
  \ built-in transformations available in Data Wrangler:\n\n![](img/e28602b44ec813a47df57c96b204412c_155_0.png)\n\
  \n\n\n\n\n![](img/e28602b44ec813a47df57c96b204412c_156_0.png)\n\nFigure 4.3 – Data\
  \ Wrangler built-in transformations\n\n## Insights and data quality\n\nGenerating\
  \ insight reports on data and quality is part of data profiling. Data profiling\
  \ is a broader term that includes all the processes involved in reviewing the data\
  \ source, understanding the structure and composition of data, generating useful\
  \ summaries and statistics from the data, and studying any inherent relationships\
  \ that exist between various features in the dataset. Before you even begin to take\
  \ steps to process your data, you must first understand the state of your data.\
  \ As such, data profiling is most often one of the first steps done after the data\
  \ is imported into Data Wrangler. Data Wrangler provides a built-in feature to generate\
  \ an insight report on data and quality. This report works either on the entire\
  \ dataset that you import into Data Wrangler or on the sample if you sampled the\
  \ data after importing data into Data Wrangler. The report gives you a quick insight\
  \ into common data issues such as imbalances in the data, target leakage, and so\
  \ on. You can also find out additional information about your data, such as missing\
  \ values, outliers, and other descriptive statistics.\n\nIn addition to the report\
  \ being available for viewing online, the generated report can be downloaded for\
  \ offline viewing and sharing. The summary section of the report provides a concise\
  \ overview of the data, encompassing various aspects such as missing values, invalid\
  \ values, feature types, outlier counts, and more. Additionally, it may highlight\
  \ high-severity warnings that indicate potential issues within the dataset.\n\n\
  While generating the report, you can optionally choose a target column. Once a target\
  \ column is selected in Data Wrangler, it automatically generates a corresponding\
  \ target column analysis. Additionally, Data Wrangler arranges the features in descending\
  \ order based on their predictive strength. When choosing a target column, it is\
  \ necessary to specify whether you are addressing a regression or a classification\
  \ problem. Data Wrangler also provides additional insights on your samples, such\
  \ as if they contain duplicates or anomalous records. While some duplicate data\
  \ might be valid, it is often a result of errors in data collection or sampling.\
  \ You can manage duplicate data using the Drop duplicates option.\n\nAnomalous records\
  \ are identified by Data Wrangler using an isolation forest algorithm. This associates\
  \ an anomaly score with each record of the dataset. One of the most interesting\
  \ and often useful features of the insight report is Quick Model. Data Wrangler\
  \ creates a quick model on a sample of your data, which provides an estimate of\
  \ the expected predicted quality of a model that you train on your data. For the\
  \ quick model, Data Wrangler trains an XGBoost model on the sample of your data\
  \ with the default hyperparameters. It automatically splits the sample into training\
  \ and test sets before training the quick model. It does minimal automatic data\
  \ preprocessing, and an early stopping is applied on the training for efficiency.\n\
  \nA summary of the model performance is generated with metrics such as accuracy,\
  \ F1, R2, Root Mean Squared Error (RMSE), and so on, depending on whether you choose\
  \ a regression or a classification problem. For example, if you choose a classification\
  \ problem, a confusion matrix is generated along with the summary, as shown here:\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_157_0.png)\n\nFigure 4.4 – Data insight\
  \ report\n\n## Data analysis\n\nClosely related to generating insights on data and\
  \ quality is the ability to quickly analyze the imported data. Data analysis is\
  \ part of the data profiling phase and lets you get a better understanding of the\
  \ data before you can move to processing your data for ML. SageMaker Data Wrangler\
  \ includes built-in analyses that help you generate visualizations and data analyses\
  \ in a few clicks. In addition, you can also create your own custom analysis using\
  \ custom code.\n\nUsing data visualizations, you can get a quick overview of your\
  \ entire dataset. It provides an accessible way to see and understand trends, outliers,\
  \ and patterns in data. Data Wrangler provides out-of-the-box analysis tools, including\
  \ histograms and scatter plots. You can create these visualizations with a few clicks\
  \ and customize them with your own code. In addition to the visualizations, under\
  \ analysis, you can also create table summaries. Table summaries enable data practitioners\
  \ to quickly summarize their data and can contain important characteristics of the\
  \ data, such as the number of records, and descriptive statistics such as mean and\
  \ standard deviation.\n\nData Wrangler also includes analysis specifically for data\
  \ science and ML. One of them is for detecting multicollinearity in data. Multicollinearity\
  \ refers to a situation where there is a correlation between two or more predictor\
  \ variables. These predictor variables represent the features within your dataset\
  \ that are utilized to predict a target variable. In the presence of multicollinearity,\
  \ the predictor variables exhibit not only predictiveness toward the target variable\
  \ but also toward each other.\n\nData Wrangler provides several approaches to assess\
  \ multicollinearity within your data, including the Variance Inflation Factor (VIF),\
  \ Principal Component Analysis (PCA), and Lasso feature selection. The VIF quantifies\
  \ how much the variance of the estimated regression coefficients is inflated if\
  \ your predictors are correlated. A high VIF indicates that the associated predictor\
  \ has a strong correlation with other predictors, which can compromise the reliability\
  \ of the regression model. PCA is commonly used for dimensionality reduction in\
  \ ML, allowing for easier data visualization and noise reduction, thereby resulting\
  \ in the avoidance of correlated features. Similarly, Lasso feature selection can\
  \ reduce the coefficient of less important features to zero, effectively eliminating\
  \ them from the model. This helps in reducing model complexity and preventing overfitting.\
  \ These measures assist in identifying and quantifying the degree of multicollinearity\
  \ present in your dataset. We will look at these techniques in more detail in the\
  \ next chapter.\n\nDetecting anomalies in time series data is another analysis provided\
  \ by Data Wrangler that is commonly used when working with such data. Time series\
  \ data can include trends and seasonality. A trend is a long-term change (increase\
  \ or decrease) in the data. This can be linear or exponential and sometimes can\
  \ also change in direction. Seasonality, on the other hand, is a repeating cycle\
  \ in the series with fixed frequencies.\n\nData Wrangler employs a decomposition\
  \ technique to analyze time series data, separating it into a predicted term and\
  \ an error term. The predicted term captures the seasonality and trend of the time\
  \ series, while the residuals represent the error term. Within the error term, you\
  \ have the flexibility to define a threshold, indicating the number of standard\
  \ deviations the residual can deviate from the mean to be identified as an anomaly.\
  \ Additionally, Data Wrangler offers the capability to decompose the seasonal trend\
  \ within time series data. By utilizing the Seasonal-Trend decomposition visualization,\
  \ you can determine the presence of seasonality in your time series data. The decomposition\
  \ process employed by Data Wrangler leverages the Seasonal-Trend decomposition using\
  \ LOESS (STL) method to separate the time series into its distinct components—namely,\
  \ seasonal, trend, and residual. Providing data is suitable for further analysis\
  \ and processing.\n\nEach transformation that is added to the data flow is represented\
  \ as a new node, enabling a visual representation of the sequence of operations\
  \ performed on the dataset. Think of this data flow as a code file that includes\
  \ all the code and sequences of your data transformations. Data Wrangler supports\
  \ exporting these transformations to multiple supported destinations and formats\
  \ that include Amazon S3, SageMaker Pipelines, SageMaker Feature Store, and as standard\
  \ Python code.\n\nIn the case of S3, Data Wrangler allows you to export your processed\
  \ data to a bucket location in S3. You can specify this S3 location as a destination\
  \ node or use the Export option to export the processed data or transformation results\
  \ to S3. In addition to the exported data, the flow itself is saved to the S3 bucket\
  \ location. When you choose S3 as the destination, you do that by adding a destination\
  \ node, which is the S3 bucket location. Data Wrangler allows you to add multiple\
  \ destination nodes. The export happens using a Data Wrangler job, which behind\
  \ the scenes is a SageMaker processing job. When you create a Data Wrangler export\
  \ job, you can specify the number of instances and a supported instance type.\n\n\
  Data Wrangler also allows you to export to SageMaker Pipelines, which is a SageMaker\
  \ feature for building end-to-end ML workflows that take advantage of direct SageMaker\
  \ integration. You can export your entire flow or some of the steps from your data\
  \ flow to SageMaker Pipelines. Data Wrangler will create a Jupyter notebook that\
  \ you can use to define, instantiate, run, and manage a pipeline.\n\nFeature stores\
  \ have gained prominence in ML. Features are specific columns in your dataset. A\
  \ feature store contains processed data along with some associated metadata and\
  \ acts as a central repository for all the processed data or features that can be\
  \ used by various data science teams within their ML workflows. Data Wrangler enables\
  \ you to export features you’ve created to Amazon SageMaker Feature Store, which\
  \ is another SageMaker service to store and discover features. Using Data Wrangler,\
  \ you can either update existing feature groups or create completely new feature\
  \ groups in SageMaker Feature Store. You can use either a Jupyter notebook or a\
  \ destination node to update your feature group with the observations in the dataset\
  \ or create a feature group in Feature Store.\n\nFinally, you can also export all\
  \ the transformations in your data flow as Python code that you can integrate with\
  \ any data processing workflow. Since the exported code will have references to\
  \ SageMaker and AWS resources, you will need to make sure that the environment or\
  \ workflow with which you integrate has access to the AWS resources referenced.\n\
  \n## SageMaker Studio setup prerequisites\n\nSageMaker Data Wrangler is available\
  \ as a service within Amazon SageMaker Studio. While you can still use some of the\
  \ SageMaker Data Wrangler features via APIs, for the purposes of this book, we will\
  \ be using Data Wrangler from within SageMaker Studio. In this section, we will\
  \ cover a brief overview of SageMaker Studio and how to set up a SageMaker Studio\
  \ domain and users in your AWS account.\n\n## Prerequisites\n\nBefore we can start\
  \ setting up SageMaker Studio, there are a few prerequisites, as follows:\n\n- An\
  \ AWS account.\n\n\n\n\n\n一个附带了适当策略和权限的**身份与访问管理（IAM）**角色。Amazon SageMaker Full\
  \ Access 是 AWS 托管策略，你可以直接使用它，或将其作为创建自定义策略的起点。\n\n### Studio 域\n\n你将首先使用 AWS 控制台创建并引入一个\
  \ SageMaker 域。SageMaker 域包括一个**Amazon Elastic File System（Amazon EFS）**卷、一个授权的 Studio\
  \ 用户列表，以及多种安全、应用、策略和**Amazon Virtual Private Cloud（Amazon VPC）**配置。在创建域时，你可以选择要在该域中引入哪些用户。你有两个选项：使用\
  \ AWS IAM Identity Center（**AWS Single Sign-On**或 AWS SSO 的继任者）或 AWS IAM 作为认证方法。如果你要将\
  \ SageMaker Studio 与现有的 SSO 集成，或者创建一个新的 SSO 设置，请选择 IAM Identity Center 选项；否则，请选择\
  \ IAM 认证选项。请记住，一旦域创建完成，除非删除并重新创建该域，否则无法更改此设置。当你使用 IAM 认证时，你可以选择**快速设置**或**标准设置**选项来引入域。就本书的范围而言，我们将考虑使用**快速设置**的\
  \ IAM 认证。\n\n### Studio 引入步骤\n\n让我们看看 Studio 引入的步骤：\n\n1. 登录你的 AWS 账户并导航到 SageMaker\
  \ 控制台。\n2. 从左侧的**控制面板**选项中选择**Studio**，如下图所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_161_0.png)\n\
  \n3. 点击**启动 SageMaker Studio**按钮。如果是第一次使用，你将进入**设置 SageMaker 域**页面，其中包含**快速设置**和**标准设置**选项：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_162_0.png)\n\n图 4.7 – 域设置选项\n\n默认选中**快速设置**。请保持此状态不变。\n\
  \n4. 接下来，你需要为默认管理员用户提供用户名，并为你的域选择一个默认执行角色，如下图所示。如果你的账户中还没有 SageMaker 执行角色，你可以使用*先决条件*部分中提到的内置策略创建一个：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_162_1.png)\n\n图 4.8 – SageMaker Studio\
  \ 执行角色\n\nSageMaker Canvas 不在本书讨论范围内。你可以选择保持该选项启用，或在继续之前在此处禁用它。\n\n5. 点击**提交**后，将开始创建域的过程。在后台，SageMaker\
  \ 会为你创建一个 Studio 域，配置所需的 AWS 服务（如 EFS），并为该域创建一个默认用户。这需要几分钟时间，域状态在完成后将显示为**处理中**：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_163_0.png)\n\n图 4.9 – 检查域创建状态\n\n6. 域创建完成后，状态将变为**就绪**，你可以使用默认用户登录\
  \ SageMaker Studio。要登录，请在控制台中的**启动应用**按钮处选择**Studio**，如下图所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_163_1.png)\n\
  \n图 4.10 – 启动 SageMaker Studio\n\n7. 首次登录 SageMaker Studio 需要几分钟，因为它需要配置默认应用程序。后续的登录会更快。应用程序创建完成并成功登录后，应打开\
  \ SageMaker Studio IDE 着陆页：\n\n![](img/e28602b44ec813a47df57c96b204412c_164_0.png)\n\
  \n就这样——从现在开始，你可以跟随书中所有的 Data Wrangler 示例进行操作了。\n\n### 总结\n\n在本章中，我们介绍了 AWS 上的数据处理入门，特别关注机器学习和数据科学。我们探讨了机器学习数据处理有何独特之处，以及为什么它是整体机器学习工作流程中如此关键且重要组成部分。我们讨论了处理大型分布式数据集和数据源时面临的一些挑战，以及如何以大规模方式处理这些数据。我们讨论了拥有一个可靠且可重复的机器学习数据处理工作流程的重要性。然后，我们介绍了数据处理工具和数据框架所需的一些关键能力，这些包括检测现实数据中存在的偏见的能力，检测和修复数据不平衡的能力，以大规模执行快速且无错误的转换并运行预处理报告和可视化的能力，以及以大规模摄入数据的能力。\n\
  \n当企业从实验和研究转向生产环境时，重点将转向运维。在这里，我们在运维背景下介绍了机器学习数据处理，特别是 MLOps。我们讨论了工具和框架与企业主管道无缝集成的重要性。接下来，我们介绍了\
  \ SageMaker Data Wrangler，这是专为机器学习数据处理而构建的一项 SageMaker 服务。我们详细讲解了 SageMaker Data\
  \ Wrangler 的关键能力，以及它们如何帮助我们解决前面提到的一些具体数据处理挑战。数据处理工具的重要性取决于其支持的数据源，因此我们查看了 Data Wrangler\
  \ 支持的数据源，以及与其他 AWS 和第三方服务的集成点。数据处理任务和转换完成后，我们讨论了如何导出处理后的数据。我们查看了数据可以导出的各种格式，以及 Data\
  \ Wrangler 支持的各种导出目标。除了处理后的数据外，我们还需要处理步骤和转换具有一致性和可重复性；在这里，我们查看了如何以数据流的形式导出转换。\n\n\
  SageMaker Data Wrangler 是 SageMaker Studio 的一个组件。使用 Data Wrangler 的先决条件之一是设置 SageMaker\
  \ Studio。我们通过回顾如何在你的 AWS 账户中设置 SageMaker Studio 域以及如何引入用户和账户来结束本章。数据处理是机器学习中具有挑战性且耗时的领域之一。如果正确执行，它可以为你的机器学习模型带来直接的性能提升。SageMaker\
  \ Data Wrangler 提供了使数据科学家和机器学习从业者能够以大规模执行数据处理，并与组织的整体机器学习工作流程集成的功能。**快速设置**选项使用默认设置，并允许互联网访问和可共享的笔记本。\n"
- '# 第 3 部分：AWS 数据管理与分析


  在本部分，我们将探索用于有效数据管理与分析的必需 AWS 服务。第 5 章介绍了 Amazon S3，揭示了其作为数据存储和组织强大解决方案的潜力。第 6 章深入探讨了
  AWS Glue，展示了这个强大的 ETL 服务如何自动化数据准备和转换工作流程。第 7 章介绍了 Amazon Athena，这是一种无服务器查询服务，使你能够直接在
  Amazon S3 数据上通过 SQL 查询获取有价值的见解。最后，第 8 章探索了 Amazon QuickSight，这是一种快速商业智能服务，用于创建交互式仪表板和可视化，从而从你的数据中获取有价值的见解。


  本部分包含以下章节：


  - 第 5 章，使用 Amazon S3

  - 第 6 章，使用 AWS Glue

  - 第 7 章，使用 Athena

  - 第 8 章，使用 QuickSight

