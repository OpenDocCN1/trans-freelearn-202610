  \ model – 实验进度\n\n使用我们的数据集和默认作业设置，该过程需要几个小时才能完成。一旦完成，SageMaker Autopilot 将列出所有实验或作业运行以及关键评估指标、状态和时间。它还将显示用于创建部署端点的最佳模型。\n\
