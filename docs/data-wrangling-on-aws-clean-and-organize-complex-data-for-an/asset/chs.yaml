  n\" +\n            event [\"query\" ] [i] +\"\\n \"\n            i=i+1\n       \
  \     lines = csv.reader(data)\n            headers = next(lines)\n            output=output\
  \ + \"Header \"+ \",\".join(headers)+\"\\n\"\n            for line in lines:\n \
  \               output=output+\",\".join(line)+\"\\n \"\n            return output\n\
  ```\n\n**步骤 3d**：更新附加到 Lambda 函数的 IAM 角色，使其拥有 Amazon S3 权限。我们将为 IAM 角色附加 AmazonS3FullAccess\
  \ 托管策略。在生产环境中，为了进一步限制访问权限，请仅授予对所需 S3 位置的访问权限。\n\n**步骤 3e**：在步骤函数控制台中搜索 Lambda，并将其拖入工作流中的传递步骤之后。输入函数名参数，填入在*步骤\
  \ 3b*中创建的 Lambda 函数，如图所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_256_0.png)\n\
