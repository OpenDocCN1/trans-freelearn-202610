  在整个本节中，我们已经了解了 Glue DataBrew 如何帮助识别和解决数据质量问题。虽然前面介绍的技术是手动执行的，但请注意，在实际操作中，实施基于事件驱动的数据质量检查是更优的选择。这种方法会在数据质量问题（例如缺少有效的社会安全号码或员工\
  \ ID）发生时自动识别这些问题，并采取相应措施，例如向业务方或应用程序所有者发送警报，以便他们验证数据并实施必要的修复。\n\n## 使用 Glue DataBrew\
  \ 进行基于事件的数据质量检查\n\n在此架构中，每当文件上传到 Amazon S3 时，EventBridge 规则都会触发 Step Functions 状态机。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_85_0.png)\n\n图 2.67：基于事件的数据质量检查\n\n状态机启动一个\
  \ DataBrew 配置文件作业，该作业已配置了一组数据质量规则，其结果输出存储在 Amazon S3 中。使用 Lambda 函数从 Amazon S3 读取数据质量结果，并向状态机返回布尔响应。如果规则集中的一个或多个规则失败，该函数返回\
  \ false；如果所有规则成功，则返回 true。如果布尔响应为 false，状态机向 Amazon SNS 发送电子邮件通知，并以失败状态结束。相反，如果布尔响应为\
  \ true，状态机以成功状态结束。该流程的下一步是学习如何使用 AWS Glue DataBrew 识别 PII（个人身份信息）数据。\n\n## 使用 AWS\
  \ Glue DataBrew 保护数据\n\n组织面临的数据挑战不仅限于数据质量，还包括识别和保护个人信息。数据泄露的新闻屡见不鲜，例如 2021 年 LinkedIn\
  \ 数据泄露事件中，与 7 亿用户相关的数据被发布在 Dark Web（暗网）上出售，影响了 LinkedIn 92% 的用户基础。同样，Yahoo! 在 2017\
  \ 年报告称，3200 万个账户通过基于 Cookie 的攻击被访问。监管和合规要求（如 FedRAMP、FINMA、HIPAA 和 PCI）也需要安全的数据处理和存储。AWS\
  \ Glue DataBrew 提供了功能，帮助您保护数据并符合这些要求。\n\n### 静态加密\n\n静态加密（Encryption at rest）是一种安全措施，涉及在数据存储在本地存储设备（如硬盘）时对其进行加密，以防止在设备被攻击者访问时未经授权访问机密信息。AWS\
  \ Glue DataBrew 支持 DataBrew 项目和作业的静态数据加密。借助 AWS **密钥管理服务（KMS）**，作业可以读写加密数据。\n\n\
  要在作业中启用静态加密，请遵循以下步骤：\n\n1. 前往**作业输出设置**。\n2. 选择**附加配置 – 可选**。\n3. 勾选**为作业输出文件启用加密**。\n\
  4. 选择使用 SSE-S3（Amazon S3 管理的加密密钥）或 AWS KMS。\n\n![](img/e28602b44ec813a47df57c96b204412c_86_0.png)\n\
  \n图 2.68：AWS Glue DataBrew 作业中的 AWS KMS 加密\n\n### 传输中加密\n\n传输中加密（Encryption in transit）是在数据通过互联网在服务之间传输时对其进行加密以确保安全的过程，例如使用\
  \ JDBC 连接数据库时。\n\n为了启用传输中加密，AWS 提供了**安全套接字层（SSL）**加密。AWS Glue DataBrew 利用 SSL 进行\
  \ JDBC 操作，这是 AWS Glue 的内置功能，因为它使用由 AWS Glue 提供的 JDBC 连接器。\n\n## 识别和处理 PII\n\n数据安全的至关重要的一部分是识别、编辑、替换、加密和解密\
  \ PII 数据，例如名字、姓氏、电子邮件地址、社会安全号码（SSN）和电话号码。当我们谈论大规模识别和保护敏感数据时，情况变得更加复杂。即使识别出敏感数据后，围绕大规模敏感数据的编辑、掩码或加密实施解决方案也并不容易。\n\
  \n您可以在数据准备步骤中使用 AWS Glue DataBrew 对 PII 数据进行混淆。根据您的要求，有多种可用的 PII 数据编辑机制。您可以选择混淆\
  \ PII 数据，使用户无法恢复原始数据；或者，您可以使混淆可逆。\n\n可以采用以下技术来掩码数据：\n\n- **替换（Substitution）**：这涉及用其他看似真实的值（如假名、虚拟地址或随机生成的标识符）替换\
  \ PII 数据值（如姓名、地址和社会安全号码）\n- **洗牌（Shuffling）**：该技术将同一列中不同行的值进行随机重新排列\n- **确定性加密（Deterministic\
  \ encryption）**：这涉及对列值应用确定性加密算法，对于给定值始终产生相同的密文\n- **概率加密（Probabilistic encryption）**：在此技术中，对列值应用概率加密算法，每次使用时产生不同的密文\n\
  - **解密（Decryption）**：这涉及根据加密密钥解密列\n- **置空或删除（Nulling out or deletion）**：可以将特定字段替换为\
  \ null 值，或者删除整个列\n- **掩码（Masking out）**：该技术使用字符乱序或掩码列中的某些部分\n- **哈希（Hashing）**：可以将哈希函数应用于列值作为掩码的一种手段\n\
  \n让我们看一个例子来理解这一点。在数据质量部分，我们学习了如何创建数据集并进行配置文件分析。以下是步骤：\n\n1. 参照前一节，创建一个新的名为 `raw-human-resource-pii-dataset`\
  \ 的数据集。\n\n![](img/e28602b44ec813a47df57c96b204412c_88_0.png)\n\n图 2.69：AWS Glue\
  \ DataBrew 中的数据集\n\n2. 选择新创建的数据集，并点击**运行数据配置文件（Run data profile）**。\n3. 在提示时创建配置文件作业。\n\
  4. 保持作业名称和作业运行样本为默认值。\n5. 在作业输出设置中，指定要存储 JSON 格式数据配置文件信息的 Amazon S3 路径。\n6. 在**数据集级别配置**下启用**PII\
  \ 统计信息**，并在 PII 类别下选择**所有类别**。请注意，在生产环境中，您可能需要根据您的数据选择相关的类别。\n\n![](img/e28602b44ec813a47df57c96b204412c_88_1.png)\n\
  \n图 2.70：AWS Glue DataBrew 中的 PII 配置\n\n7. 将其他选项保持为默认值。\n8. 选择我们在数据质量规则期间创建的角色名称。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_89_0.png)\n\n图 2.71：Glue DataBrew 作业中添加的角色\n\
  \n9. 等待配置文件作业完成。\n\n作业完成后，您将能够在**数据集**中的数据配置文件概览部分查看统计信息。对于我们的数据集，它显示有 17 列是 PII。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_89_1.png)\n\n图 2.72：数据集的 PII 摘要\n\n向下滚动时，您会发现\
  \ Email（电子邮件）、出生日期、入职日期、SSN（社会安全号码）和 Phone（电话号码）等列具有 100% 的 PII 行。\n\n| 列 | 类型 |\
  \ PII 行百分比 | 非 PII 行百分比 |\n|--------|------|------------|----------------|\n| Short\
  \ DOW | 多种 | 85% | 14% |\n| Person name | 人名 | 43% | 56% |\n| Date | 人名 | 42% |\
  \ 57% |\n| SSN | 美国 SSN | 100% | 0% |\n| Phone | 美国电话号码 | 100% | 0% |\n| Place Name\
  \ | 人名 | 47% | 52% |\n| County | 人名 | 65% | 34% |\n| City | 人名 | 47% | 52% |\n\n\
  图 2.73：各列的 PII 统计信息\n\n既然我们已经识别了 PII 列，下一步是编辑和加密 PII 列。您可以使用 AWS Glue DataBrew 转换部分中描述的步骤来执行此任务。\n\
  \n在充分了解了 AWS Glue 中可用的各种数据安全选项（如静态数据加密、传输中数据加密、PII 识别和编辑）之后，下一步是了解 AWS Glue DataBrew\
  \ 的数据血缘功能。\n\n请考虑以下示例：\n\n- 测试和开发环境：在创建测试和开发环境时，通常需要使用模拟真实场景的代表性数据。然而，在这些环境中暴露敏感\
  \ PII 数据可能会带来安全风险。通过使用 AWS Glue DataBrew 对 PII 数据进行混淆，您可以在保持测试和开发所需真实性的同时确保数据隐私。\n\
  - 数据分析和报告：在需要将数据共享给分析师或第三方供应商以进行数据分析或报告的情况下，混淆 PII 数据对于遵守隐私法规和维护机密性至关重要。AWS Glue\
  \ DataBrew 可以帮助将敏感信息匿名化或用看似真实的值替换，使分析师能够在保护个人隐私的同时处理数据。\n\n\n\n\n- **数据共享与协作**：协作项目通常涉及跨团队或跨组织共享数据集。在这些场景中，必须确保敏感信息得到保护。通过使用\
  \ AWS Glue DataBrew 对 PII（个人身份信息）数据进行混淆处理，您可以在保持数据完整性和有效性的同时，安全地共享数据集以用于协作分析和决策制定。\n\
  - **机器学习训练**：机器学习模型通常需要进行大量数据的训练。在处理敏感的 PII 数据时，混淆这些信息对于保护个人隐私至关重要。AWS Glue DataBrew\
  \ 可以帮助替换或转换 PII 数据，以确保训练数据保持匿名状态，并符合数据保护法规的要求。\n- **符合数据隐私法规**：在医疗保健、金融或电子商务等行业运营的组织必须遵守严格的数据隐私法规，例如\
  \ GDPR（通用数据保护条例）或 HIPAA（健康保险流通与责任法案）。使用 AWS Glue DataBrew 混淆 PII 数据有助于通过降低未经授权访问敏感信息的风险，确保符合这些法规的要求。\n\
  \n## 数据血缘与数据发布\n\n数据血缘和数据发布是数据管理的关键方面。数据血缘是指跟踪数据从其来源到消费过程的过程，AWS Glue 提供数据血缘功能，尽管该功能仍处于开发初期。与\
  \ Talend 和 Collibra 等企业级工具相比，AWS Glue 的数据血缘功能在与外部服务的集成方面有限，并且对于各个阶段的数据集和配方（recipes）提供的信息也有限。尽管存在局限性，AWS\
  \ Glue DataBrew 中的数据血缘功能仍然是一个有价值的补充，希望未来它能整合更多功能。\n\n![](img/e28602b44ec813a47df57c96b204412c_91_0.png)\n\
  \n图 2.74：AWS Glue DataBrew 中的数据血缘\n\n## 本章小结\n\n在本章中，我们探讨了 AWS Glue DataBrew 的功能，这是一种由\
  \ AWS 提供的无代码数据整理服务。我们学习了如何执行各种数据整理任务，包括数据发现、数据增强、识别和编辑 PII，以及执行数据质量检查。我们还了解了数据剖析及其实用性。在下一章中，我们将深入探讨\
  \ AWS Glue Data Wrangler，这是一个基于 Python 的开源数据整理选项。\n\n## 介绍\n### AWS SDK for pandas\n\
  \n在本章中，我们将探索 AWS SDK for pandas 包并理解其构建模块。我们将详细介绍针对各种使用场景安装 AWS SDK for pandas 包的不同模式，并展示如何进一步定制该包以适合您的特定项目需求。我们还将学习该包与\
  \ AWS 服务的集成，以及它如何帮助高效执行常见的数据整理活动。因此，到本章结束时，您将能够理解 AWS SDK for pandas 及其构建模块、针对不同使用场景的标准和自定义安装选项，以及与\
  \ Amazon S3、Amazon RDS、Amazon Redshift 和 Amazon Athena 等 AWS 服务的集成。\n\n本章涵盖以下主题：\n\
  \n- AWS SDK for pandas\n- AWS SDK for pandas 的构建模块\n- 定制、构建和安装 AWS SDK for pandas\n\
  - AWS SDK for pandas 的配置选项\n- AWS SDK for pandas 在不同 AWS 服务中的功能\n\n## AWS SDK for\
  \ pandas\n\nAWS SDK for pandas（原名 AWS Data Wrangler）是一个 Python 库，它通过额外功能增强了 AWS\
  \ 软件开发工具包（SDK），并提供了一个与 pandas DataFrame 的接口。这是 AWS 专业服务团队发起的一个开源项目，提供与一系列 AWS 服务的轻松集成。除了\
  \ AWS SDK 的现有功能外，与 pandas 库的集成为执行数据整理和数据集成活动提供了一组丰富的功能。\n\nAWS SDK for pandas 最初被称为\
  \ `awswrangler` 包，由 AWS 专业服务团队于 2019 年 7 月左右创建。AWS SDK for pandas 是一个在 Apache 2.0\
  \ 许可证下发布的开源项目。该框架经历了一次重新命名过程，自 2022 年 8 月起更名为 AWS SDK for pandas。然而，关于该库的一切保持不变，名称的更改是为了更好地与\
  \ AWS 生态系统保持一致。从本书后文开始，我们将使用术语 `awswrangler` 来指代 AWS SDK for pandas 库。\n\n使用 AWS\
  \ 生态系统的客户可以使用 AWS SDK，通过其选择的编程语言以编程方式访问服务并执行任务。截至 2022 年 10 月，AWS SDK 支持 12 种编程语言，包括\
  \ C++、Go、Python、Rust、JavaScript、Kotlin、Java、Node. JS、PHP、Ruby、Swift 和 .NET。每个 SDK\
  \ 中可用的功能在 AWS 文档（`https://aws.amazon.com/developer/tools/`）中有详细记录。对于使用 Python 编程语言的客户，AWS\
  \ SDK for Python（也称为 Boto3）提供了一种与 AWS 服务交互的机制。\n\nAWS SDK for pandas 旨在在 Boto3 之上运行，并提供与\
  \ pandas DataFrame 和 AWS 服务的集成。代码库由 AWS 内部和外部的一组志愿者积极维护。截至 2022 年 10 月，已有约 95 个版本发布，平均每月发布两次以上，这表明该库不断添加功能以使其更加实用。以下图表显示了过去一年中对该仓库进行的提交，这展示了代码库由团队积极管理的情况。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_94_0.png)\n\n实际上，如果您使用 pandas 进行数据整理或数据集成活动，AWS\
  \ SDK for pandas 将为您提供功能，可以更简单、更有效地*将数据加载或读取到* AWS 服务（如 S3、RDS、NoSQL 数据库和 Redshift），使用诸如\
  \ `pyarrow` 等库。一旦数据在 pandas DataFrame 中可用，用户就可以利用 pandas 库的丰富生态系统对数据集执行数据整理活动。既然我们已经了解了\
  \ AWS SDK for pandas 是什么，让我们来看看构成该 SDK 的构建模块。\n\n## AWS SDK for pandas 的构建模块\n\n\
  在本节中，我们将探索 AWS SDK for pandas 库的构建模块，例如 Apache Arrow、pandas 和 Boto3。\n\n## Arrow\n\
  \nApache Arrow（https://arrow.apache.org/）是一种内存中、面向列的数据格式（类似于 DataFrame 格式），在许多系统和编程语言中用于在现代硬件上高效执行内存中的分析操作。用户可能已经熟悉\
  \ Parquet 文件格式，它有助于将数据以列格式存储在磁盘上，但当数据加载到内存中时，不同的运行时（Runtime）会以不同的方式将其映射（例如，Spark\
  \ 在从磁盘读取 Parquet 文件后将数据加载到 DataFrame 中）。因此，当数据需要在系统之间交换时，需要进行序列化/反序列化以将其从一种格式转换为另一种格式。使用\
  \ Arrow 的一个优势是能够在内存中以列格式存储数据，支持分析操作，并高效地在不同的运行时环境之间传输数据，而无需序列化和反序列化数据。许多不同的项目和团队使用\
  \ Arrow 库，例如 pandas 和 Spark。这对使用 pandas 和 NumPy 数据的 Python 开发人员非常有益。\n\n例如，在 PySpark\
  \ 编程中，我们通常在 Python UDF 和 Java 虚拟机（JVM）环境之间对数据进行序列化/反序列化。由于 PySpark 程序是用 Python 编写的，最终将在\
  \ JVM 中执行。此过程涉及将数据转换为 pickle 格式以进行序列化和反序列化活动，这是耗时的。通过基于 Arrow 的序列化，数据可以在 JVM 和 Python\
  \ 进程之间更高效、更快地移动。\n\n> 根据 Wes McKinney 的说法：“Apache Arrow 定义了一种二进制‘序列化’协议，用于组织 Arrow\
  \ 列式数组的集合（称为‘记录批次’），可用于消息传递和进程间通信。您可以将该协议放在任何地方，包括磁盘上，之后可以内存映射或读取到内存并发送到其他地方。Arrow\
  \ 协议的设计使得您可以在不进行任何反序列化的情况下‘映射’Arrow 数据块，因此对磁盘上的 Arrow 协议数据执行分析可以使用内存映射，并且实际上支付零成本”（https://stackoverflow.com/questions/56472727/difference-between-apache-parquet-and-arrow）。\n\
  \n## pandas\n\n在其核心，awswrangler 库使 pandas DataFrame 更接近 AWS 生态系统。除此之外，awswrangler\
  \ 还有方法，使用基于 Boto3 功能的预制模块简化常见活动（如列出在特定时间后创建的 S3 对象）。pandas 是为 Python 编程语言编写的开源库，为大多数数据分析工作负载提供了快速且高性能的数据结构。Python\
  \ 编程语言拥有各种各样的机器学习库，而 pandas 有助于人们使用 Python 执行数据分析活动。pandas 库（https://pandas.pydata.org/）可以帮助用户根据项目需求将数据转换为不同的格式，并且它与多种工具有更广泛的集成。\n\
  \n\n\n\n\n## Boto3\n\n面向 Python 的 AWS SDK（Boto3）（[https://boto3.amazonaws.com/v1/documentation/api/latest/index.html](https://boto3.amazonaws.com/v1/documentation/api/latest/index.html)）为用户提供了通过\
  \ Python 代码以编程方式访问 AWS 服务并执行各种操作的能力。这有助于自动化常见任务，也有助于在云中部署生产级应用程序。Boto3 使用 AWS 凭据对向\
  \ AWS 服务发出的 API 调用进行身份验证，并且访问权限根据通过 **身份和访问管理（IAM）** 服务提供的 AWS 凭据进行限制。\n\nBoto3\
  \ 同时提供高层级、面向对象的 API（resource）和低层级 API（client），用于访问 AWS 服务：\n\n- 客户端提供的是与 AWS 服务交互的低层级接口，其方法与服务\
  \ API 一一对应。所有服务操作都由客户端支持。响应以 Python 字典形式返回。需要由用户自行遍历并处理响应，以获取他们所需的属性。\n- 资源提供了比服务客户端发出的原始低层级调用更高层级的抽象。要使用资源，您需要调用会话的\
  \ resource 方法，并传入 AWS 服务名称。资源可能不具备服务（如低层级 API）的所有功能，但一旦理解了相关概念，使用起来会更简单、更强大。\n-\
  \ 会话管理特定配置的状态，通常存储用户凭据、AWS 区域以及与用户配置文件相关的其他配置等信息。这使用户可以通过使用不同的凭据连接到不同的 AWS 账户和区域，从而自定义其代码。\n\
  \n> Boto 是葡萄牙语中对一种原产于亚马逊河的淡水海豚的称呼。这个名字由最初的 Boto 库作者 Mitch Garnaat 选定，作为对公司的呼应。\n\
  \n现在我们已经了解了 `awswrangler` 包的构成模块，接下来让我们探索在各种 AWS 服务和环境中自定义和安装 `awswrangler` 的各种选项。\n\
  \n### 针对不同用例自定义、构建和安装 AWS SDK for pandas\n\nAWS SDK for pandas 可以安装在不同的编程环境中，以执行数据整理活动。让我们看下面的示例，这些示例将帮助我们理解\
  \ `awswrangler` 在不同环境中的用法：\n\n- 项目 A 的业务用户希望在本地机器上安装 AWS SDK for pandas，并为新项目进行概念验证。该用户还希望在\
  \ Amazon EC2 实例上进行同样的操作，以使用 AWS 环境中的数据测试该解决方案。\n- 项目 A 的 IT 人员希望在 Lambda 函数上使用 AWS\
  \ SDK for pandas，对少量数据执行数据整理活动。\n- 项目 B 的 IT 人员希望在 Glue Python shell 上使用 AWS SDK\
  \ for pandas，对从源数据库提取的数据执行数据整理活动。团队预计转换将耗时超过 15 分钟（Lambda 执行时间限制）。该团队还有另一个数据项目，负责消费和转换更大量的数据，他们希望使用\
  \ Glue Spark shell 进行数据转换，并使用 Glue 书签进行增量数据处理。\n- 项目 B 的数据分析师希望在将数据传递给自定义 ML 模型之前执行数据整理活动。他们希望在\
  \ SageMaker 笔记本上使用 AWS SDK for pandas 对数据进行探索性分析。\n- 某个战略计划的项目经理希望他的团队实现一个“大数据管道”，并使用\
  \ AWS SDK for pandas 进行数据准备活动。该团队希望在 EMR 作业中使用 AWS SDK for pandas 进行数据整理活动。\n\n\
  ### 在本地机器或 Amazon EC2 上的标准安装和自定义安装\n\n项目 A 的业务用户可以在其本地机器或 EC2 实例上从 PyPI 或 Conda\
  \ 安装 AWS SDK for pandas。Python 用户可以从两个流行的打包系统 PIP 和 Conda 安装软件包。大多数 Python 发行版都预装了\
  \ `pip`。`pip` 从 Python 2.7 起预装，`pip3` 从 Python 3.4 起默认预装。\n\n使用 PIP 的优点是，它可以在命令行中使用，并且会随软件包一起安装所有必需的依赖项。通过\
  \ pip 安装 `awswrangler` 的语法如下：\n\nPython 2.x：\n\n```\npip install awswrangler\n```\n\
  \nPython 3.x：\n\n```\npip3 install awswrangler\n```\n\n当您执行此命令时，以下附加软件包也会一并安装，这些软件包在\
  \ `awswrangler` 内部作为依赖项使用。不过，作为用户，我们只需执行上述命令，其余工作由 pip 软件包安装程序处理：\n\n### AWS SDK\
  \ for pandas 简介\n\n![](img/e28602b44ec813a47df57c96b204412c_98_0.png)\n\n上面的截图显示了随\
  \ AWS SDK for pandas 一起安装的附加软件包。\n\n![](img/e28602b44ec813a47df57c96b204412c_98_1.png)\n\
  \n安装完成后，您可以按如下方式在 Python shell 中打印 `awswrangler` 版本来验证安装是否成功。此时，我们已经成功安装了 `awswrangler`，可以开始在\
  \ Python 程序中使用它进行各种数据整理活动：\n\n> 趣味提示\n> PIP 是一个递归缩写，代表 PIP Installs Python（PIP 安装\
  \ Python）。它最初于 2008 年由 Ian Bicking（virtualenv 包的创建者）以 pyinstall 的名称引入，作为 easy_install\
  \ 的替代方案。\n\n### 在虚拟环境中安装 `awswrangler`\n\n用户可以创建虚拟环境，在其中安装 `awswrangler` 库，而不会影响该机器上现有的项目。考虑这样一种情况：您已经在另一个项目中使用了\
  \ pandas 1.3.6 版本，而项目代码无法在 pandas 1.3.5 版本下运行。现在，如果您使用 pip 命令安装 `awswrangler`，它会安装\
  \ pandas 1.3.5 版本，于是您的机器上就有了同一个库的两个冲突版本，这可能会导致程序崩溃。因此，最佳实践是创建 Python 虚拟环境，以便在具有冲突依赖关系的独立项目中工作。从现在开始，我们将使用这个虚拟环境来安装和修改\
  \ `awswrangler` 包。\n\n您可以使用 `activate` 和 `deactivate` 命令进入 Python 虚拟环境。这使您可以在不同项目之间切换并开展工作，而不会相互影响。下面的截图显示了新虚拟环境和\
  \ `python3` 环境中安装的软件包。在 `deactivate` 命令之后使用 `pip3 list` 命令，将显示来自 `python3` 默认安装的库。\n\
  \n```\n$python3 --version\nPython 3.9.12\n$python3 -m venv awspandas\n$s awspandas\n\
  $source awspandas/bin/activate\n(awspandas) $pip3 list --disable-pip-version-check\n\
  Package      Version\n-----------  -------\npip          22.0.4\nsetuptools   58.1.0\n\
  (awspandas) $deactivate\n$pip3 list\nPackage       Version\n------------  -------\n\
  anenum        3.1.11\naiohttp       3.8.1\naiosignal     1.2.0\nasn1crypto    1.5.1\n\
  async-timeout 4.0.2\nattrs         22.1.0\nawsccli       1.25.50\n```\n\n图 3.4：Python\
  \ 虚拟环境\n\n### 自定义安装\n\n开源库的一大优势是能够根据项目需要自定义并添加额外的代码段。您可以按照以下步骤对 AWS SDK for pandas\
  \ 执行自定义安装，添加特定于项目需求的模块。\n\n作为前提条件，请激活虚拟环境，并在您的笔记本电脑/EC2 机器上安装 `python3` 和 `git`：\n\
  \n- 要在 Mac 上安装 `git`，可以使用 `brew` 命令\n- 要在 EC2 实例上安装 `git`，可以使用 `sudo yum install\
  \ git`：\n\n1. 将代码库下载或复制到您的本地机器或 EC2 实例：\n    1. 从 `aws-sdk-pandas` 仓库（[https://github.com/aws/aws-sdk-pandas](https://github.com/aws/aws-sdk-pandas)）复制\
  \ git 仓库 URL。\n\n\n\n\n\n## 使用 Lambda 函数的标准与自定义安装\n\n对于大多数用例，例如项目 A 的 IT 人员处理小体量数据的情况，我们希望将数据集成代码部署到无服务器（serverless）环境中并执行。AWS\
  \ Lambda 是一种无服务器的事件驱动计算服务，让你能够在几乎任何类型的应用程序或后端服务上运行代码，而无需配置或管理服务器。Lambda 预装了各种重要库，但当部署到\
  \ Lambda 函数时，用户必须将与代码一起打包那些默认环境中不可用的库。\n\n对于较小的库，用户可以将依赖项与代码一起打包，并将其上传到 Lambda 函数。我们将学习如何创建包含\
  \ Lambda 函数依赖库的 ZIP 归档文件 ([创建包含依赖项的软件包](https://docs.aws.amazon.com/Lambda/latest/dg/python-package.html#python-package-create-package-with-dependency))。为此，请创建一个新的\
  \ Python 虚拟环境，并在虚拟环境中安装新软件包。这将在你的机器上的 pip 安装路径下安装依赖软件包。然后，你可以将这些软件包移动到 Lambda 函数的部署文件夹中，并将其归档为\
  \ ZIP 文件，以便上传到 Lambda 函数。\n\nLambda 函数还可以拥有层（layers），它们保存为 ZIP 文件，包含额外的代码/库。它也可以包含自定义运行时、数据或配置文件。在\
  \ Lambda 函数中使用层可以减小部署包的大小，并且同一个 Lambda 层可以在多个 Lambda 函数之间共享，从而促进可重用代码组件。此外，这有助于在\
  \ different 团队之间分离管理代码片段的职责。另外，当你在单个 ZIP 文件中部署代码和依赖项时，Lambda 函数在控制台中是不可编辑的，这增加了代码维护的难度。目前，可以使用\
  \ `.zip` 文件归档创建 Lambda 层。\n\n基于上述所有内容，我们在哪里使用 Lambda 层？考虑这样一种情况：存在一个中央数据仓库，不同的项目团队使用\
  \ Lambda 函数作为微服务从中访问数据，并将其用于不同目的。需求是只提供组织内特定用户组访问权限，同时在访问数据时执行数据脱敏。数据库管理员还担心过多的并发用户访问数据库以及留下空闲打开的连接可能会使数据库不堪重负。各个项目团队也担心使用和\
  \ maintenance 数据库驱动程序以连接到仓库，并且他们没有管理经验数据库连接状态、配置等的经验。理想的解决方案是创建一个符合上述所有要求的用于访问仓库的\
  \ Lambda 层，该层将由数据库管理团队维护，而各个团队可以利用该 Lambda 层在 Lambda 函数中开发其代码。这促进了代码重用、职责分离以及更快的开发周期。\n\
  \n在相同的上下文中，用户可以从 Lambda 层使用 AWS SDK for pandas。在 Lambda 代码中使用 AWS SDK for pandas\
  \ 有两个选项。\n\n### 标准安装 – Lambda 管理的层\n\n在 AWS 控制台中创建一个使用 Python 3.9 运行时的 Python Lambda\
  \ 函数。向下滚动 Lambda 函数概览屏幕，直到页面底部，在那里你可以找到 **Layers**（层）部分：\n\n![](img/e28602b44ec813a47df57c96b204412c_103_0.png)\n\
  \n然后你可以选择添加一个层；选择 **AWSSDKPandas-Python39** 层，如以下屏幕截图所示。随着 AWS 团队添加新发行版，版本号将来可能会改变。这是\
  \ AWS 团队为你精心策划的一个层，它移除并优化了组件，从而减小了软件包的大小。\n\n### 自定义安装\n\n- **II. 使用链接将整个 git 仓库克隆到本地机器/EC2\
  \ 以进行进一步开发：**\n\n```bash\n(awspandas) $ git --version\ngit version 2.37.3\n(awspandas)\
  \ $ git clone https://github.com/aws/aws-sdk-pandas\nCloning into 'aws-sdk-pandas'...\n\
  remote: Enumerating objects: 13000, done.\nremote: Counting objects: 100% (565/565),\
  \ done.\nremote: Compressing objects: 100% (264/264), done.\nremote: Total 13000\
  \ (delta 388), reused 431 (delta 299), pack-reused 12435\nReceiving objects: 100%\
  \ (13000/13000), 8.00 MiB | 7.91 MiB/s, done.\nResolving deltas: 100% (9773/9773),\
  \ done.\n(awspandas) $\n```\n\n图 3.5：awswrangler git 副本\n\n- **2. 进入代码库并探索代码。**\
  \ 你可以修改现有代码并添加额外模块以满足项目需求：\n  - **I. 导航到 awswrangler 的安装路径并探索不同的文件夹。** 你应该在名为 `awswrangler`\
  \ 的文件夹下看到代码，并且为不同服务有单独的文件夹。\n  - **II. 为了学习目的，让我们修改 `__init__.py` 文件**，该文件将在我们在\
  \ Python 代码中导入 `awswrangler` 时执行。探索为各种 AWS 服务/awswrangler 功能导入的模块。你可以看到一条导入语句，它从\
  \ `__metadata__.py` 文件中获取变量。按照此处所示，向导入语句附加一个新变量 `__message__`，并保存文件。\n\n```python\n\
  from awswrangler.__metadata__ import __description__, __license__, __title__, __version__,\
  \ __message__\n# noqa\nfrom awswrangler.__config import config # noqa\n```\n\n图\
  \ 3.6：awswrangler init.py 文件\n\n  - **III. 打开 `__metadata__.py` 文件并修改 `__description__`\
