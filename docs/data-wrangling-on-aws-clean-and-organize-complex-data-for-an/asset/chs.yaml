  \n# AWS 通知消息\n\n![](img/e28602b44ec813a47df57c96b204412c_258_1.png)\n\n图 7.53：数据质量工作流成功完成后收到的电子邮件片段\n\
  \n现在，我们拥有了一个可定制的无服务器数据质量管道。我们可以修改现有的数据质量查询，添加更多的数据质量查询，并添加拥有自身数据质量查询集的新应用程序。但数据质量管道无需任何更改即可执行它们。\n\
  \n## 挑战练习\n\n你能修改电子邮件输出，使其包含一个摘要表，列出已执行的规则及其通过/失败状态，以及仅来自失败规则的示例记录以供进一步分析吗？\n\n\
  ## 提示\n\n设计数据质量查询，使其输出不符合规则记录。因此，如果查询没有记录输出，则数据质量规则应视为通过，反之亦然。您可以在 Lambda 函数中添加此逻辑。在迭代过程中收集每个查询的结果，最后打印摘要仪表板。此外，仅在状态为失败时，才将示例记录附加到电子邮件中的输出数据中。\n\
  \n## 自动化数据质量管道\n\n目前，无服务器管道是以临时方式执行的。我们可以通过 EventBridge Scheduler 使管道按自定义计划执行。\n\
  \n导航至 EventBridge 控制台，并选择计划（Schedules），如图所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_259_0.png)\n\
  \n图 7.54：AWS 控制台中的 EventBridge Scheduler\n\n选择**创建计划**，并为计划提供名称。目前，我们将使用循环计划将数据质量管道设置为每小时执行一次，但您也可以使用基于\
  \ cron 的方法设置更复杂的计划，如图所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_260_0.png)\n\
  \n图 7.55：EventBridge Scheduler – 设置每小时运行的计划\n\n在**目标 API**下，选择 **AWS Lambda (Invoke)**\
  \ 选项，并选择在上一节中创建的步骤函数，如图所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_260_1.png)\n\
  \n图 7.56：EventBridge Scheduler – 调用步骤函数作为目标\n\n其余参数保持默认值并创建计划。恭喜！我们现在已设置了一个按计划执行的无服务器数据质量管道。\n\
  \n从以下截图中可以看到，工作流每小时都在运行并执行数据质量查询：\n\n![](img/e28602b44ec813a47df57c96b204412c_261_0.png)\n\
  \n图 7.57：由 EventBridge 每小时执行的步骤函数工作流\n\n在当前的场景中，我们反复对数据执行相同的查询。我们可以修改查询，使其仅针对新数据进行操作，使用标识新数据的时间戳列或分区列即可实现。您可以进一步通过更多参数和\
  \ Athena 预定义语句定制管道，以满足您的需求。\n\n## 摘要\n\n在本章中，我们探讨了 Amazon Athena 服务以及它如何帮助数据清洗管道的各个阶段。Amazon\
  \ Athena 将提供功能，帮助以更好、更高性能的方式执行数据发现、数据转换、数据结构和数据质量，并利用 SQL 语言的高级函数。\n\n在下一章中，我们将学习\
  \ Amazon QuickSight，以及它如何帮助数据清洗管道中的数据发现和数据可视化阶段。\n"
- "8\n\n# 使用 QuickSight 工作\n\n在上一章中，您学习了 Amazon Athena 服务，以及它如何有效地用于数据发现、数据丰富化和数据质量管道。在本章中，我们将探讨\
  \ Amazon QuickSight 服务如何帮助数据清洗管道中的数据发现和数据可视化阶段。\n\n本章涵盖以下主题：\n\n- *介绍 Amazon QuickSight\
  \ 及其概念*\n- *使用 QuickSight 进行数据发现*\n- *使用 QuickSight 进行数据可视化*\n\n## 介绍 Amazon QuickSight\
  \ 及其概念\n\nAmazon QuickSight 是一种**商业智能 (BI)** 服务，可帮助您从各种数据源（如云、本地和第三方服务）生成交互式仪表板，包含可视化图表。此外，Amazon\
  \ QuickSight 还提供高级功能，如嵌入式分析和 AI 驱动的智能搜索栏。\n\n为什么我们需要数据可视化工具？\n\n如前所述，一图胜千言。用户通过可视化和图表比通过表格数据更容易理解数据中的模式。此外，当识别出数据洞察时，可以通过仪表板与业务团队和高管团队共享，从而更有效地传达信息。\n\
  \nQuickSight 是如何工作的？\n\nQuickSight 从支持的数据源加载数据，用户可以在 QuickSight 中准备数据以满足其可视化要求。在\
  \ QuickSight 中渲染可视化之前，数据是从**快速、并行、内存计算引擎 (SPICE)** 本地检索，还是通过数据源直接查询。以下截图显示了 QuickSight\
  \ 的重要组件：\n\n\n\n**主题**\n这是使业务用户能够用英语提问并通过机器学习技术理解数据中关系来获得答案的部分。这避免了希望从数据中快速获得答案的团队不得不构建报表和仪表板。\n\
  \n现在我们已经在高层次上了解了 QuickSight，让我们探索如何从各种数据源使用 QuickSight 执行数据发现。\n\n## 使用 QuickSight\
  \ 进行数据发现\n\nAmazon QuickSight 支持从各种数据源加载数据，然后我们可以在 **分析** 选项卡中创建可视化以理解数据。数据发现也可以使用\
  \ Jupyter 笔记本和自定义可视化库来完成，但这可能需要在执行数据发现活动之前具备编程专业知识和复杂的设置。相比之下，业务用户可以在 QuickSight\
  \ 的 **分析** 选项卡中使用可视化进行数据发现。\n\n## QuickSight 支持的数据源和设置\n\nQuickSight 支持各种各样的数据源。完整列表可在\
  \ https://docs.aws.amazon.com/quicksight/latest/user/supported-data-sources.html\
  \ 找到。\n\n来源可分为以下几个大类：\n\n- **关系型数据源**：涵盖云端和本地数据源，包括流行的数据库引擎，如 MySQL、Postgres、SQL\
  \ Server、Oracle、Snowflake 和 Redshift。在连接本地数据源时，您还需要创建一个 QuickSight VPC 接口，以便通过安全连接导入数据。\n\
  - **文件数据源**：从 S3 或本地网络导入文件。用户可以从本地网络上传文件以便快速分析，或提供一个符号链接文件，其中包含用于分析所需的 S3 文件位置。\n\
  - **软件即服务 (SaaS) 数据源**：支持从流行的 SaaS 数据源导入数据，如 Salesforce、Twitter、Jira 和 ServiceNow。如果您的\
  \ SaaS 提供商未在 QuickSight 数据源列表中列为受支持，您可以使用 AWS AppFlow 服务导入数据，或者您也可以选择通过在 ECS 容器、AWS\
  \ Glue 或 Lambda 函数中运行的代码以编程方式将 SaaS 数据导入 Amazon S3。\n- **分析数据源**：支持从分析服务导入数据，以便可以将分析引擎的数据可视化。支持从\
  \ Amazon Athena、Presto、Spark、Amazon OpenSearch、IoT Analytics 等导入数据。\n\n请参阅 AWS 文档，了解如何为流行数据源设置连接的一些示例：https://docs.aws.amazon.com/quicksight/latest/user/connecting-to-data-examples.html。\n\
  \n## 使用 QuickSight 分析进行数据发现\n\n现在，我们可以通过导入来自示例数据集的销售管道数据来查看 Amazon QuickSight 的数据发现（请参阅图\
  \ 8.3 中的销售管道数据集）。您可以导入数据并为我们的分析创建一个新数据集。\n\n导入数据后，它将显示一个空白画布，左侧显示我们数据集的字段。您可以通过在想要探索的字段上创建可视化，使用\
  \ QuickSight 随意尝试。\n\n![](img/e28602b44ec813a47df57c96b204412c_267_0.png)\n\n图 8.4：QuickSight\
  \ – QuickSight 控制台中的分析屏幕\n\n我们将考虑以下情况来执行数据发现活动：一位没有编码专业知识的业务用户希望在对销售预测做出决策之前探索和理解销售数据集。\n\
  \n使用可视化工具的优势在于，您可以在没有任何编程专业知识的情况下快速创建可视化。为了在一段时间内可视化销售数据，我们只需单击 **日期** 列，QuickSight\
  \ 就会自动创建最适合该类型数据的可视化。\n\n![](img/e28602b44ec813a47df57c96b204412c_268_0.png)\n\n\
  图 8.5：QuickSight – 自动图表，可自动为日期字段选择最佳可视化\n\n正如前面的屏幕截图所示，QuickSight 为日期字段创建了一个自动图表，显示了跨日期的销售记录计数。该图表显示了销售的上升趋势，您可以悬停在图表上以查看特定时间段的记录计数，如前面的屏幕截图所示。\n\
  \n但我们的数据仍然跨越了巨大的时间段，我们希望将分析重点放在仅 2016 年的销售记录上，这是此示例数据集中最新的年份。我们将添加一个过滤器来仅可视化 2016\
  \ 年的数据。单击左侧的过滤器图标，它将显示添加过滤器选项，如下所示：\n\n![](img/e28602b44ec813a47df57c96b204412c_269_0.png)\n\
  \n单击 **添加过滤器** 并从数据集中选择列/属性，以根据该列/属性应用过滤条件。请记住选择 **仅此可视化** 选项，以避免日期过滤器应用于我们在本表中可能创建的其他可视化。我们将为\
  \ **条件** 选择 *之后* 并将 *日期* 字段设置为 *2016/01/01*。我们也有选择滚动窗口的选项，以继续查看最新数据（仅可视化最近 90 天的数据）。选择所有选项后，单击\
  \ **应用**。现在您可以看到数据仅显示 2016 年的数据，这使得图表更易读：\n\n图 8.7：QuickSight – 应用过滤器以在 QuickSight\
  \ 控制台中可视化数据\n\n尽管如此，数据仍跨越 365 天，我们希望查看每个月的汇总数字，以便我们能够理解来自销售数据集的销售模式。我们可以通过单击可视化并查看画布上方的字段井部分来实现这一点。请参阅以下突出显示字段井中日期字段的屏幕截图。\n\
  \n图 8.8：QuickSight – QuickSight 字段井演示\n\n现在，我们可以单击字段井下的日期字段，按月汇总数据，如以下屏幕截图所示：\n\n\
  ![](img/e28602b44ec813a47df57c96b204412c_271_0.png)\n\n图 8.9：QuickSight – 通过字段井在可视化中汇总数据\n\
  \n这将按月级别显示汇总的数据，如下所示，这使得我们更容易可视化和理解 2016 年的销售趋势：\n\n![](img/e28602b44ec813a47df57c96b204412c_271_1.png)\n\
  \n图 8.10：QuickSight – 折线图 – 按月汇总的记录计数\n\n![](img/e28602b44ec813a47df57c96b204412c_273_0.png)\n\
  \n我们还可以向此可视化添加其他字段，以使用不同因素的组合分析销售数字。我们可以添加 **细分** 和 **区域** 字段，以了解是否有任何特定属性对我们的销售增长做出了重大贡献。这可以通过简单地单击\
  \ **字段** 列表下的 **细分** 字段来实现。\n\n![](img/e28602b44ec813a47df57c96b204412c_273_1.png)\n\
  \n## 使用 QuickSight\n\n我们仍然想了解是否有任何特定区域对我们的销售数字贡献更大。我们只需在字段列表下单击区域字段，QuickSight 就会在主图表内自动呈现子图/子图表，以提供区域级可视化，如下所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_274_0.png)\n\n这一切看起来都不错，但 QuickSight\
  \ 是如何不断创建这些不同可视化的呢？如果您查看字段井，您会看到 QuickSight 已将第一个字段细分添加到颜色部分，并将第二个字段区域添加到小型多图部分，并创建了我们之前看到的漂亮可视化：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_274_1.png)\n\n对于好奇的人，如果我们继续通过单击添加新字段会发生什么？让我们继续单击销售人员字段。您现在会看到区域已被销售人员替换在小型多图中。QuickSight\
  \ 使用机制来理解图表类型并不断添加适合当前可视化选项的属性（这里我们有折线图）。\n\n![](img/e28602b44ec813a47df57c96b204412c_275_0.png)\n\
  \n对于其他字段也可以这样做，QuickSight 将根据所选字段类型呈现图表。我们将进一步探索销售人员字段以了解该字段中的唯一值。单击当前折线图外部并从字段列表中选择销售人员。您将看到一个以销售人员姓名为内容的条形图。QuickSight\
  \ 自动确定最适合用户选择的字段的可视化类型。我们可以轻松地在所示的视觉类型部分更改可视化：\n\n\n![](img/e28602b44ec813a47df57c96b204412c_276_0.png)\n\
  \n您可以继续添加更多可视化内容，并高效地探索数据。但这里的关键在于，用户无需掌握任何编程语言专业知识，就能轻松地高效探索数据。\n\n## QuickSight\
  \ Q 与基于 AI 的数据分析/发现\n\nAmazon QuickSight Q 还通过业务语言问题提供高级数据分析或数据探索，而无需依赖 IT 团队创建的\
  \ SQL 脚本或 BI 仪表板。QuickSight Q 在后端使用自然语言处理模型来回答问题。这有助于业务团队和管理团队在没有编程语言专业知识的情况下从数据中获取答案，也无需等待\
  \ IT 团队为他们创建仪表板。\n\n您可以向 QuickSight Q 提问，例如“谁是按销售额计算的最佳销售代理？”和“去年排名靠前的销售代理有哪些？”使用的词语可能不同，但\
  \ QuickSight Q 仍然能够理解并从数据集中提供有意义的结果。\n\n让我们使用 QuickSight 提供的示例数据集来探索 QuickSight\
  \ Q。您可以选择主题并单击 **Try Q**，使用示例数据集探索 Q。如果您想用自己的数据探索 Q 并配置 QuickSight Q，可以单击 **Start\
  \ free trial**。您可以查看附加定价部分，了解使用 QuickSight Q 的成本详情。为了本书的学习目的，我们继续使用 **TRY Q** 选项。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_277_0.png)\n\n图 8.18：QuickSight – 控制台中启用了\
  \ QuickSight Q\n\n从示例数据集中选择“Product sales”。现在您将看到一个可以通过 Q 提问的界面。它还提供了关于示例数据集的可建议问题，以及一个已经提供了良好数据可视化的仪表板。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_277_1.png)\n\n图 8.19：QuickSight – 带有搜索栏的\
  \ QuickSight Q 主屏幕\n\n我们可以先使用 Q 建议的示例问题之一。我们可以看到输出结果以水平条形图显示，按销售额（美元）排序的前五名客户。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_278_0.png)\n\n图 8.20：QuickSight – QuickSight\
  \ Q 显示热门建议问题的结果\n\n让我们通过优化问题来进一步探索，以便按区域获取销售代理。我们将看到结果现在按区域分组显示。\n\n![](img/e28602b44ec813a47df57c96b204412c_278_1.png)\n\
  \n图 8.21：QuickSight Q – 按区域汇总的前五名客户销售额结果\n\n我们可以看到，排名第一的客户来自 EMEA 地区，收入最高。我们想要识别\
  \ AMER 地区的顶级客户。让我们通过询问特定区域的顶级客户来优化问题。\n\n![](img/e28602b44ec813a47df57c96b204412c_279_0.png)\n\
  \n图 8.22：QuickSight Q – 仅 AMER 地区前五名客户的销售结果\n\n现在，我们想查看最近数据中的顶级客户。业务团队希望识别过去两年数据中的顶级客户，以便为这些顶级客户提供奖励/折扣。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_279_1.png)\n\n图 8.23：QuickSight Q – 仅\
  \ AMER 地区前五名客户并按最近两年筛选的销售结果\n\n现在，您可以从这些结果中导出数据或执行进一步分析。这里的重要启示是，我们只需使用简单的英语语句即可轻松获得图表和可视化。用户无需知道如何使用任何编程语言、SQL\
  \ 脚本或 BI 工具，仍然可以使用 QuickSight Q 创建可视化来探索数据。它还可以处理一些拼写错误、缩写词和同义词，并根据每个项目的业务需求提供自动完成建议。用户还可以对结果提供进一步反馈，以便\
  \ QuickSight Q 能够从用户交互中学习和改进。\n\n我们仅从数据发现的角度使用示例数据探索了 QuickSight Q 的功能。但 QuickSight\
  \ Q 还有许多高级功能，可用于在您的数据集上启用**自然语言查询（NLQ）**。我们已经了解了使用 QuickSight 探索数据的方法，接下来将了解 QuickSight\
  \ 中的数据可视化选项。\n\n## 使用 QuickSight 进行数据可视化\n\n在本节中，我们将探索 QuickSight 中可用的不同视觉对象和选项。我们将介绍\
  \ QuickSight 中的高级概念、不同的视觉对象和功能。\n\n### 使用 QuickSight 进行可视化和图表\n\n在 QuickSight 中发布仪表板时，会执行以下步骤。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_280_0.png)\n\n1. **创建数据源**：这是建立与数据源连接的步骤。这可以是一次性活动，并且在从该数据源创建新数据集时可以多次复用。\n\
  2. **创建数据集**：可以根据不同的分析需求，从新的数据源或现有数据集创建数据集。可以根据特定的分析需求修改、解析或丰富数据集。\n3. **创建分析（创建视觉对象）**：从特定数据集创建视觉对象。在这里，仪表板作者将创建交互式视觉对象，这些视觉对象可以发布到仪表板供用户使用。\n\
  4. **发布仪表板**：从 **Analyses** 选项卡创建仪表板后，仪表板作者可以发布该仪表板，然后用户（读者或作者）即可使用。用户现在可以订阅报告、将其导出为\
  \ PDF，或者根据情况将其嵌入到他们的应用程序中。\n\n以下是可以在 QuickSight 中使用的不同类型的可视化图表。我们不会提供 QuickSight\
  \ 中所有可用视觉对象的完整列表，但会重点介绍一些常用图表以及可以使用它们的场景：\n\n* **折线图** 有助于连续可视化随时间的变化。如果一个度量值较小而另一个度量值很大，可以使用双轴折线图，例如比较一段时间内的收入（较高的美元金额）和利润（较低的美元金额）。折线图和柱状图都有助于可视化某个维度在一段时间内的变化。\n\
  \n* **面积图** 类似于折线图，但线条下方的区域会被着色，以便更好地可视化。当存在多个度量且它们下方的区域不重叠时，可以使用面积图。下图显示了折线图和面积图：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_281_0.png)\n\n* **条形图** 有助于在维度列中存在离散值时可视化和比较维度：\n\
  \    * **单度量：** 将维度添加到 *x*（垂直）或 *y* 轴（水平），图表将显示每次出现的计数\n    * **多度量：** 每个维度针对一个或多个度量并排比较，例如比较每个部门的成本和利润\n\
  \n* **堆叠条形图** 可用于在单个度量上可视化分组在单个堆栈中的多个维度\n\n![](img/e28602b44ec813a47df57c96b204412c_281_1.png)\n\
  \n* **组合图** 可用于显示条形图和折线图之间存在关系的情况。下图显示了在折线图上显示预测收入、在柱状图上显示实际收入的可视化。\n\n![](img/e28602b44ec813a47df57c96b204412c_282_0.png)\n\
  \n图 8.27：QuickSight – 使用组合图进行可视化\n\n* **饼图** 让我们可视化每个值在总份额中的贡献。每个扇区/饼块的大小代表该值在整体份额中所占的百分比。任何可以分解为不同类别的数据都可以使用此图表，但尽量将图表中的数据类别数量限制在五个以下，否则可能难以阅读和比较饼图中的各个扇区。\n\
  \n* 在**环形图**中，除了显示每个值的贡献外，整个值还会显示在中心位置，以便参考。在下图中，您可以在饼图和环形图中看到每个区域对收入的贡献。\n\n![](img/e28602b44ec813a47df57c96b204412c_282_1.png)\n\
  \n图 8.28：QuickSight – 使用饼图和环形图进行可视化\n\n\n\n\n\n- **仪表盘图（gauge chart）** 帮助我们理解某个指标相对于总体目标的进展。在下面的仪表盘图中，我们可以看到实际收入与预测收入的对比。它清晰地表明当前实际收入仅为预测收入的19.84%。此图表可用于定期跟踪某个指标相对于目标的进展。\n\
  \n- **KPI图（KPI chart）** 通过将关键绩效指标与目标值进行对比来展示这些指标。我们也可以用它来定期比较指标的进展，如下所示。*图8.29*右侧显示的KPI图表明，加权收入在**2016年第三季度**和**2016年第四季度**之间增长了8.82%。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_283_0.png)\n\n## 图8.29：QuickSight – 仪表盘图和KPI图\n\
  \n- **热力图（heat map）** 有助于识别两个不同维度属性之间的数据离群值和数据分布。数据以表格格式显示，每个方框根据为热力图选择的指标列进行颜色编码。指标值越高，方框颜色越深；指标值越低，颜色越浅。在下图中，我们可以立即看到EMEA企业客户应获得更多关注，因为该细分市场/地区的收入与其他地区相比更低（尽管这仍然是EMEA地区内收入最高的细分市场）。\n\
  \n## 图8.30：QuickSight – 热力图\n\n- **箱线图（box/whisker plot）** 有助于可视化数据沿轴的分布。在下图中，您可以看到不同业务细分市场的收入分布。这帮助我们看出初创企业细分市场具有收入潜力。\n\
  \n## 图8.31：QuickSight – 箱线图/须状图\n\n- **桑基图（sankey diagram）** 展示了数据从一个维度到另一个维度的流动。下图展示了各地区与业务细分市场之间的收入分布，连接路径的大小提供了该地区该业务细分市场产生的收入规模的概念。\n\
  \n各地区和业务细分市场的加权收入总和\n\n![](img/e28602b44ec813a47df57c96b204412c_285_0.png)\n\n-\
  \ **地图图（map charts）** 让我们使用地理字段（邮政编码、州、县等）在地图上可视化某个指标。\n- 在QuickSight中可以创建两种类型的地图图：\n\
  \n  - **点地图（point maps）** 以不同大小的点显示指标——较大的点表示较高的值，较小的点表示较低的值。\n  - **填充地图（filled\
  \ maps）** 以不同深浅的颜色显示指标——较深的阴影表示较高的值，较浅的阴影表示较低的值。\n\n下图显示了一个点地图，展示了来自不同医院的加权收入。每个地区以不同颜色标识，便于业务团队分析。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_286_0.png)\n\n下图显示了一个填充地图，每个州根据该州内医院的收入进行着色。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_286_1.png)\n\n在本节中，您了解了不同的图表。Amazon QuickSight中还有其他图表，可用于针对不同用例可视化数据。在仪表板中正确使用图表可以帮助用户更有效地向更广泛的受众传达他们的故事。在下一节中，我们将学习嵌入式分析。\n\
  \n## 嵌入式分析\n\n本节内容很短，旨在向您介绍将仪表板嵌入应用程序的概念。组织可以将仪表板嵌入到其应用程序或Web门户中，这样用户无需登录AWS控制台即可访问QuickSight，从而探索QuickSight仪表板。这使团队的生活更简单，他们现在可以在Web门户上发布高级仪表板和可视化内容，并增强用户交互。QuickSight支持三种不同方式的嵌入：\n\
  \n- **QuickSight控制台**：将整个QA控制台嵌入到Web门户中，以便用户可以创作和发布仪表板。团队可以使用此功能将QuickSight创作体验嵌入到其Web门户中，并为员工提供额外功能。\n\
  - **仪表板和可视化**：嵌入在QuickSight控制台中开发的仪表板，用户只需查看仪表板并与之交互。希望在其Web应用程序中向客户发布高级仪表板的团队可以使用此功能。\n\
  - **QuickSight Q**：将QuickSight Q搜索栏嵌入到Web应用程序中。\n\nQuickSight支持一键式仪表板嵌入。相关步骤记录在此博客文章中：https://docs.aws.amazon.com/quicksight/latest/user/1-click-embedding.html。\n\
  \n要启用一键式公共嵌入，您需要将QuickSight订阅更改为基于会话的模型。\n\n## 总结\n\n在本章中，我们探索了Amazon QuickSight服务及其如何帮助完成数据整理管道的各个阶段。我们学习了各种AWS服务及其如何融入数据整理管道，并能够高效地执行某些数据整理活动。\n\
  \n在下一章中，我们将学习数据整理管道的实际用例。\n"
- "## 第4部分：\n高级数据操作\n与机器学习数据优化\n\n在本部分中，我们将探索使用AWS Data Wrangler和AWS SageMaker Data\
  \ Wrangler进行高级数据操作和机器学习数据优化。第9章展示了AWS Data Wrangler与pandas的强大组合，指导您完成高级数据转换和分析。第10章深入探讨了使用AWS\
  \ SageMaker Data Wrangler进行机器学习数据优化，帮助您为机器学习项目预处理和准备数据，以最大化模型性能和准确性。\n\n本部分包含以下章节：\n\
  \n- 第9章，使用AWS SDK for Pandas构建端到端数据整理管道\n- 第10章，使用SageMaker Data Wrangler进行机器学习数据处理\n\
  \n- 使用Pandas重构数据\n- 数据清洗\n- 数据丰富\n- 数据质量验证\n- 数据可视化\n\n让我们开始吧！\n\n## sportstickets.com解决方案演练\n\
  \n我们将通过一个虚构的示例sportstickets.com进行演练，这是一家体育票务特许经营公司。该公司管理不同的体育赛事，并以折扣价出售体育赛事门票。sportsticket.com的业务分析师想要建立一个端到端的数据整理管道，以对数据执行门票销售分析。\n\
  \n我们将探索数据整理管道的不同阶段，并解释Pandas库如何帮助有效且高效地执行这些操作。\n\n![](img/e28602b44ec813a47df57c96b204412c_292_0.png)\n\
  \n## 图9.1：数据整理管道的不同阶段\n\n## 数据摄取的前提条件\n\n为了对上述用例执行数据整理活动，我们首先需要将数据摄取到数据湖中。为了将本地数据库中的数据摄取到云环境中，我们有以下选项：\n\
  \n1. 使用SQL查询从服务（如AWS Glue或部署在Elastic Kubernetes Service（EKS）/Elastic Container Service（ECS）上的容器）中以编程方式提取数据。\n\
  \n这种方法的优点如下：\n\n- 只要存在用于连接数据库的包/库，它就可以与大多数数据库配合使用\n- 除了需要具有所需权限的登录凭据来提取数据外，不需要任何额外设置\n\
  - 这种方法直接从表中读取数据，因此服务器无需额外负载来创建数据库日志文件，这些文件是**变更数据捕获（CDC）** 流式传输工具所需的\n\n这种方法的局限性如下：\n\
  \n- 数据是使用SQL查询提取的，需要一个额外的书签列来增量提取后续运行的数据。如果有一个时间戳列表示记录上次更新的时间，我们可以使用它来仅提取新数据。\n\
  - 管理书签列状态的额外负担也落在用户身上。因此，用户必须将元数据存储在如DynamoDB之类的数据库中，以从上次成功的数据提取中获取值。\n- 已删除的记录无法使用书签列提取，需要额外设置，这会在数据库中消耗大量资源。\n\
  - 使用这种方法也无法捕获DDL更改。\n- 由于提取过程是使用SQL脚本完成的，因此它会与用户查询竞争数据库资源，并可能影响数据库性能。\n\n2. 使用AWS\
  \ **数据库迁移服务（AWS DMS）**、Debezium等工具从数据库变更日志中提取数据。\n\n这种方法的优点如下：\n\n- 它可以使用数据库日志捕获几乎所有数据更改，包括记录删除和DDL更改\n\
  - 更改在数据库日志中捕获，不会与用户查询竞争数据库资源来提取数据\n- 更改会增量捕获，并通过工具立即流式传输\n\n这种方法的局限性如下：\n\n- 用户将依赖工具及其支持的数据库才能使此方法正常工作。从数据库CDC流式传输解决方案迁移到另一种方法将需要大量工作。\n\
  - 对于定期的数据导出，持续流式传输不是一种经济高效的方法。但是，使用AWS DMS，您可以在计划的基础上仅加载增量数据，而无需持续运行DMS实例，从而节省成本，如这篇博客文章所述：https://aws.amazon.com/blogs/database/build-an-incremental-data-load-solution-using-aws-dms-checkpoints-and-database-logs/。\n\
  - 它需要额外的权限来读取数据库日志，并且数据库必须启用日志捕获并保留足够长的时间。如果日志在数据库CDC工具捕获之前被删除，将导致数据丢失，用户必须重新捕获所有数据才能继续。\n\
  \n\n\n\n\n- 数据库需要为每个事务捕获完整日志，因为某些CDC工具要求这样做，这会产生少量开销。\n\n## 何时使用它们？\n\n在大多数情况下，使用AWS\
  \ DMS等CDC工具会更快速、更简单地完成设置。如果您是全新开始，请根据您的生态系统选择基于AWS DMS/Debezium的方案。还有其他来自不同厂商的CDC捕获工具可供进一步探索。如果CDC捕获工具不支持您的源数据库类型，或者您需要工具不支持的配置（例如，从副本数据库捕获更改），您可以使用编程方式提取数据。\n\
  \n在本示例中，我们将使用编程式提取来展示AWS SDK for Pandas (awswrangler)在数据提取过程中的能力。\n\n## 向源数据库加载示例数据\n\
  \n我们将使用Amazon RDS MySQL作为源数据库，但这种方法也可以扩展到本地数据库。\n\n我们将按照https://aws.amazon.com/getting-started/hands-on/create-mysql-db/\
  \ 中提到的步骤创建一个RDS MySQL数据库。请注意，在上述方法中，数据库是创建为公共访问的。请限制附加到数据库的安全组的访问权限，使其仅允许来自客户机IP地址的流量。在生产部署中，数据库应部署在私有子网中，并通过具有额外设置的更安全的机制进行访问。\n\
  \n在这里，我们将使用Amazon EC2实例连接RDS MySQL数据库，并从aws-database-migration-samples Git存储库（https://github.com/aws-samples/aws-database-migration-samples）加载示例数据库。我们将使用票务数据库，并按以下步骤将其加载到RDS\
  \ MySQL中：\n\n1. 登录EC2实例并安装MySQL客户端和git。执行以下命令在EC2上安装git和MySQL：\n\n```bash\nsudo\
  \ yum update # as needed\nsudo yum install git\ngit version\nsudo yum install mysql\n\
  mysql --version\n```\n\n以下截图显示了在EC2实例上成功安装git和MySQL：\n\n```\nDependency Installed:\n\
