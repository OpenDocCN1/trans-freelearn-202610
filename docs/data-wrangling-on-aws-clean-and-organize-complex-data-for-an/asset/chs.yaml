  \ 构建端到端数据整理管道：* 在本章中，您将探索 AWS Data Wrangler 与 pandas（一个流行的 Python 数据操作与分析库）的强大组合。本章将指导您如何在\
  \ AWS Data Wrangler 中利用 pandas 操作，对数据集执行高级数据转换和分析。\n\n*第10章，使用 SageMaker Data Wrangler\
  \ 进行机器学习数据处理：* 在本章中，您将深入了解利用 AWS SageMaker Data Wrangler 的强大功能进行**机器学习（ML）** 数据优化的世界。本章将指导您如何利用\
  \ SageMaker Data Wrangler 为 ML 项目预处理和准备数据，从而最大化 ML 模型的性能和准确性。\n\n*第11章，数据湖安全与监控：*\
  \ 在本章中，您将了解 AWS 上的**身份与访问管理（IAM）**，以及 Data Wrangler 如何与 AWS 的安全功能紧密集成。我们将展示如何直接与\
  \ Amazon CloudWatch 日志交互、对日志执行查询，并将日志以数据帧的形式返回。\n\n如何充分利用本书\n\n为了充分利用本书，建议您具备数据概念的基本理解，并熟悉数据处理技术。如果之前接触过\
