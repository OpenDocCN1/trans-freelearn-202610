  \n\n\n\n现在，我们能够更清晰地可视化不同座位类型对票价区间的影响。我们可以进一步探索如何根据每种座位类型的售票数量，通过为某些座位类型提供折扣来最大化票务销售额。\n\
  \n这些库还支持更多类型的可视化，你可以使用之前提供的这些库的链接来进一步了解它们。对于大多数用例，前面介绍的库应该足以实现用户数据的可视化。此外，我们建议使用\
  \ Amazon QuickSight 来可视化更复杂的用例。\n\n## 摘要\n\n在本章中，我们学习了如何对数据集执行 pandas 操作以实现数据整理目的。我们通过发现、结构化、清理、丰富、数据质量验证以及可视化等阶段，探索了数据整理生命周期的各个阶段，以及如何使用\
  \ pandas 操作无缝执行这些活动。用户可以使用 AWS SDK for pandas（也称为 awswrangler 集成）结合 pandas 数据帧，在\
  \ AWS 云服务上执行数据整理活动。\n\n在下一章中，我们将学习 SageMaker Data Wrangler，它有助于将数据整理活动作为机器学习流程的一部分来执行。\n\
  \n## 使用 SageMaker Data Wrangler 进行机器学习的预处理\n\n在*第 4 章*中，我们向你介绍了 SageMaker Data Wrangler，这是一种专门用于处理机器学习数据的工具。我们讨论了为什么机器学习的数据处理是整体机器学习流程中的关键组成部分，以及处理不干净或原始数据的一些风险。我们还涵盖了\
  \ SageMaker Data Wrangler 的核心功能，以及它如何有助于解决机器学习数据处理中的一些关键挑战。\n\n在本章中，我们将通过一个实际的分步骤数据流程，将示例数据集预处理为适合机器学习使用，从而更进一步。我们将首先使用\
  \ SageMaker Data Wrangler 预加载的示例数据集，然后使用 Data Wrangler 内置的分析功能进行一些基本的探索性数据分析。我们还将为数据集中的不平衡和偏差添加几个自定义检查。特征工程是机器学习周期中的关键步骤。它包括选择和转换原始数据特征，生成更能代表机器学习模型底层问题的新特征。我们将创建一个\
  \ Data Wrangler 流程，并在我们的示例数据集上定义数据转换来进行特征工程。SageMaker Data Wrangler 是一个统一的数据处理工具，使你可以完成完整的机器学习周期，包括训练机器学习模型并直接从工具内部部署模型用于推理。我们将导出处理后的数据，并从\
  \ Data Wrangler 训练和部署模型。\n\n本章涵盖以下部分：\n\n- 登录 SageMaker Studio\n- 导入数据\n- 探索性数据分析\n\
  \n### 步骤 1 – 登录 SageMaker Studio\n\n![](img/e28602b44ec813a47df57c96b204412c_349_0.png)\n\
  \n图 10.1：AWS 控制台 – SageMaker\n\n进入 SageMaker 界面后，你应该能看到你在*第 4 章*先决条件部分中创建的域。在继续之前，请确保域的状态为\
  \ **InService（服务中）**。如果你完全看不到域，请验证你当前所在区域是否是你创建域的区域。在 AWS 控制台的右上角部分检查并切换你的区域。点击域名。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_349_1.png)\n\n图 10.2：SageMaker 域\n\n\
  这将带你进入该域的注册用户列表。如果你遵循了*第 4 章*中的先决条件步骤，你会在这里看到你创建的用户。如果你看不到用户，你可以使用**添加用户**按钮创建一个新的\
  \ SageMaker Studio 用户。有关详细信息，请参阅*第 4 章*中的先决条件步骤。使用**启动**按钮上的下拉选项选择**Studio**。这将带你进入\
  \ SageMaker Studio 主页。\n\n![](img/e28602b44ec813a47df57c96b204412c_350_0.png)\n\n\
  图 10.3：SageMaker Studio\n\n如果你第一次登录 SageMaker Studio，创建和设置用户环境需要几分钟时间。在 SageMaker\
  \ Studio 主页上，点击**可视化导入和准备数据**。这将带你进入 Data Wrangler 页面并创建一个新流程。\n\n![](img/e28602b44ec813a47df57c96b204412c_350_1.png)\n\
  \n图 10.4：SageMaker Studio 主页\n\n一旦你登录并启动了 Data Wrangler，你就需要将数据导入 SageMaker。我们将在*步骤\
  \ 2*中介绍这部分内容。\n\n### 步骤 2 – 导入数据\n\n在我们可以开始将数据导入 SageMaker Data Wrangler 之前，我们需要与数据源建立连接。SageMaker\
  \ Data Wrangler 提供了适用于 Amazon S3、Amazon Athena、Amazon Redshift、Snowflake、Amazon\
  \ EMR 和 Databricks 的现成原生连接器。除此之外，你还可以使用 Amazon AppFlow（一项完全托管的集成服务，帮助你安全地在**软件即服务\
  \ (SaaS)** 应用程序之间传输数据）设置新的数据源，连接超过 40 种 SaaS 和 Web 应用程序。**创建连接**界面显示了 Data Wrangler\
  \ 中的连接器，以及你可以使用 Amazon AppFlow 设置的额外数据源。\n\n![](img/e28602b44ec813a47df57c96b204412c_351_0.png)\n\
  \n在本章中，我们将使用一个公开可用的示例：泰坦尼克号数据集。由于该示例数据集能够应用许多常用的数据处理和机器学习技术，泰坦尼克号数据集被视为机器学习数据集中的“你好，世界”（Hello\
  \ World）。我们将使用泰坦尼克号数据集的一个略微修改版本。你可以在此了解更多关于该数据集的信息：https://www.openml.org/search?type=data&sort=runs&id=40945&status=active。该数据集通过公共\
  \ S3 存储桶提供。要在 Data Wrangler 中使用此数据集，我们可以将其上传到我们 AWS 账户中的 S3 存储桶，或者直接通过“数据源”部分右上角的**使用示例数据**选项将数据集直接导入\
  \ Data Wrangler。在本章中，我们将使用后者。\n\n![](img/e28602b44ec813a47df57c96b204412c_352_0.png)\n\
  \n图 10.6：Data Wrangler 示例数据\n\n点击“使用示例数据”后，将在托管该数据集的 S3 存储桶中创建一个 Data Wrangler 连接，并将该数据集的一个示例子集加载到\
  \ Data Wrangler 中。这也为你的数据流创建了起点。\n\n![](img/e28602b44ec813a47df57c96b204412c_352_1.png)\n\
  \n图 10.7：Data Wrangler 数据流\n\n你可以通过双击源（在本例中为 S3）来查看数据集样本。这将显示数据集的前几行，以及标题或列名（如果存在）。在这里，你还可以检查\
  \ Data Wrangler 自动确定的每个特征或列的数据类型。\n\n![](img/e28602b44ec813a47df57c96b204412c_353_0.png)\n\
  \n你可能已经注意到，Data Wrangler 自动对你的数据集做出了一些假设，例如文件格式、数据类型、采样方法和数量。你可以通过点击**加号**并选择*编辑数据集*选项来更改这些设置。Data\
  \ Wrangler 还自动检测了我们的数据集文件格式、分隔符，以及第一行包含标题。你可以更改这些设置。例如，你可以将文件从 `csv` 更改为**Parquet**，或将分隔符从**COMMA（逗号）**更改为**space（空格）**。有时，你的数据集可能没有标题，因此你也可以在此更新标题设置。默认情况下，Data\
  \ Wrangler 将选择*前 K 个（First K）*方法对数据集进行采样。你可以将此采样方法更改为**随机（random）**或**分层（stratified）**。你还可以在此设置样本大小。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_353_1.png)\n\n\n\n\n\n这里有一个关键点需要牢记：如果你计划使用\
  \ Data Wrangler 进行模型训练，并且在此处使用了采样，那么你需要重新导入数据。我们将在本章的后半部分介绍模型训练。在接下来的步骤中，我们将进行一些探索性数据分析（EDA），以便更好地理解我们的数据。\n\
  \n## 探索性数据分析\n\n在进行任何数据转换或操作之前，我们需要充分了解我们的数据。**探索性数据分析**（EDA）是数据科学中至关重要的一步，因为它使我们能够理解所处理数据的结构和特征。EDA\
  \ 涉及使用各种技术和工具来总结和可视化数据，以识别模式、趋势和关系。此外，在进行任何数据转换或建模之前执行此步骤也很重要，因为 EDA 可以帮助我们理解哪些特征与当前的机器学习问题相关，哪些特征最为重要。EDA\
  \ 可以帮助你理解数据的分布，并识别数据集中特征之间存在的关系。在处理现实世界的真实数据时，你不可避免地会遇到数据质量问题，例如缺失数据、各类别不平衡、数据收集错误以及离群值。EDA\
  \ 有助于识别这些数据质量问题，这些问题可能会对机器学习模型的质量产生不利影响。Data Wrangler 通过内置的数据分析报告提供了常用的 EDA 工具，你还可以生成自定义的数据分析。\n\
  \n## 内置数据洞察\n\nAWS Data Wrangler 开箱即用地提供了几种常用的数据分析工具。在本节中，我们将介绍其中一些。你可以点击数据源图标旁边的\
  \ + 按钮并选择**获取数据洞察**（Get Data Insights）进入**数据分析**部分。\n\n![](img/e28602b44ec813a47df57c96b204412c_355_0.png)\n\
  \n图 10.10：Data Wrangler 数据洞察\n\n让我们创建一个新的分析报告：\n\n- 1. 选择数据质量与洞察报告。\n- 2. 选择你的目标列，或者你的机器学习模型试图预测的列。\n\
  - 3. 在这里，我们还需要选择我们将尝试解决的机器学习问题类型，是分类问题还是回归问题。在我们的案例中，我们试图预测乘客是否幸存于泰坦尼克号悲剧。我们将目标列改为\
  \ Survived（生存），将问题类型设置为分类（Classification），然后点击创建按钮。Data Wrangler 将花费几分钟时间生成报告。这当然取决于你的数据集和样本大小。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_356_0.png)\n\n图 10.11：数据洞察摘要\n\n让我们逐一查看报告的不同部分，首先从顶部的摘要开始。摘要包括你数据集的关键统计信息和特征类型。在这里，我们可以看到数据集中的总行数、缺失行数以及重复行数（如果有的话）。在摘要部分，你还可以查看数据集中特征的数量及其计数。如果数据集中存在将对机器学习模型质量产生显著影响的关键错误，它们将显示在报告的**高优先级警告**部分。高优先级警告的一个例子是目标泄露（target\
  \ leakage）。当某个特征直接受目标变量影响时，就会发生目标泄露，导致在训练集上准确率很高但在测试数据上表现糟糕。为了防止目标泄露，重要的是将目标变量排除在训练过程之外，确保我们仅使用独立特征来训练模型。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_356_1.png)\n\n图 10.12：数据洞察异常值\n\n报告的下一部分显示了数据中可能存在的异常值。Data\
  \ Wrangler 在基本预处理后使用孤立森林（Isolation Forest）算法检测异常样本。孤立森林算法根据数据点与其他数据的距离来检测异常值。该算法为数据集中的每条记录计算一个异常分数。负分数被视为异常值，而较高的分数表明样本非异常。虽然移除所有被归类为异常的样本很有诱惑力，但有时，根据机器学习问题和数据集的情况，保留训练数据集中的异常值可能是有用的。在我们的示例数据集中，我们可以看到某些记录的异常分数较低，但没有负值。我们将保留这些样本作为训练数据的一部分。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_357_0.png)\n\n图 10.13：数据洞察快速模型\n\n目标列部分告知我们目标变量的分布以及其他相关信息，例如缺失记录。在我们的示例数据集中，我们可以看到泰坦尼克号悲剧中的幸存人数少于未幸存的人数。虽然数据集中存在轻微的分类不平衡，但这并不足以对我们的机器学习模型造成损害。在发现显著分类不平衡的情况下（例如，某个类别过度代表或代表不足的场景），请考虑其他数据平衡技术，例如对多数类进行欠采样（under-sampling）或对少数类进行过采样（over-sampling）。\n\
  \n报告中的快速模型部分是通过自动在数据集中的样本上训练 XGBoost 模型生成的。快速模型自动保留 20% 的样本数据并将其用于测试。快速模型的目的是提供模型预期预测质量的估算。根据机器学习问题的类型（即分类或回归），快速模型会生成各种指标来评估模型质量。在我们的例子中，由于我们面对的是分类问题，我们可以看到诸如准确率、F1\
  \ 分数、精确率、召回率和 AUC 等指标。例如，我们可以看到训练数据集中的 F1 分数为 .99，而验证数据集中的分数为 .96。\n\n更高的 F1 分数意味着模型具有更高的准确性，在精确率和召回率之间取得了更好的平衡，表明误报和漏报较少，从而在分类任务中表现更好。由于我们正在处理分类问题，除了这些关键指标外，快速模型部分还生成了一个混淆矩阵，用于比较我们样本数据集中的实际类别和预测类别。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_358_0.png)\n\n图 10.14：数据洞察特征摘要\n\n报告中的特征摘要部分生成特征重要性或特征的预测能力。这有助于使我们的机器学习模型更具可解释性。我们将特征重要性的值归一化到\
  \ 0 到 1 的尺度上。值越接近 1，表明该特征在最终预测中越重要。值等于 1 可能表明存在目标泄露。相比之下，较低的分值（接近 0）指向包含对预测目标信息较少的列。你可能会决定对这些列进行特征工程或直接删除它们。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_358_1.png)\n\n图 10.15：数据洞察特征详情\n\n**特征详情**部分列出了我们数据集中每个特征的关键信息。例如，它可以突出显示可能包含错误或不干净数据的列。我们可以看到一个名为“boat”（船）的特征，它是一个具有九个类别的分类特征。这种情况很少见，可能指向数据收集中的错误。在数据转换阶段，我们可能会决定删除该列或对该列应用特征工程。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_359_0.png)\n\n图 10.16：数据洞察数值特征\n\n同样，对于数值特征，**特征详情**部分可以列出关键描述性统计信息，例如平均值和中位值，除了最大值、最小值、缺失值和离群值外。你还会得到这些数值特征的值的频率分布。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_359_1.png)\n\n图 10.17：数据洞察基于文本的特征\n\n\
  \n\n\n\n虽然我们正在处理结构化的表格数据，但某些列包含纯文本数据，例如目的地或姓名特征。虽然删除这些特征可能看似显而易见，但应用数据转换并提取有助于改善预测的有用信息也是可能的。在处理这些特征时，报告中的**特征详情（FEATURE\
  \ DETAILS）**部分可以对包含文本的特征进行分词，并显示诸如词频等有用信息，从而帮助我们做出特征转换决策。\n\n**特征详情（FEATURE DETAILS）**部分是确定我们要在数据整理过程中添加哪些具体的特征转换步骤的重要场所。\n\
  \n## 第 3 步 – 创建数据分析\n\n正如前一节所述，Data Wrangler 开箱即用的内置数据分析报告涵盖了机器学习中许多常用的探索性数据分析（EDA）；然而，你还可以在\
  \ Data Wrangler 中创建额外的分析和自定义分析。在本节中，我们将介绍其中的一些内容：\n\n- **目标泄漏（Target leakage）**是机器学习中的一个常见问题，即使用目标变量或结果的信息来创建特征或预测变量，从而导致模型过于乐观或存在偏差。当使用在预测或决策时间不可用的信息创建的特征来训练预测模型时，就会发生目标泄漏。目标泄漏分析至关重要，因为它有助于确保预测模型建立在有效且无偏差的数据之上。在\
  \ Data Wrangler 中，你可以通过点击数据集旁边的 + 图标并选择 **Add Analysis（添加分析）**来生成目标泄漏分析。在 **Analysis\
  \ Type（分析类型）**下拉菜单中，选择 **Target Leakage（目标泄漏）**。然后，选择问题类型和目标下拉菜单中的一个选项。\n\n  ![](img/e28602b44ec813a47df57c96b204412c_360_0.png)\n\
  \n  *图 10.18：目标泄漏*\n\n  如你所见，在我们的数据集中，`boat` 特征可能存在目标泄漏问题。`boat` 特征包含乘客所乘救生艇的编号（如果乘客乘坐了救生艇）。该特征可能不适用于我们数据集中的所有记录，并且是在预测后填充的。我们将在数据转换和特征工程步骤中研究如何处理这个问题。\n\
  \n- 散点图分析：散点图表示两个或三个变量之间的关系。在我们的示例数据集中，我们将使用散点图来可视化票价（fare）、年龄（age）和目标变量存活状态（survived）之间的关系。你可以按照与之前添加分析相同的方式添加新分析。在\
  \ **Analysis type（分析类型）**下拉菜单中，选择 **Scatter Plot（散点图）**，然后选择 `age` 作为 X 轴，`fare`\
  \ 作为 Y 轴。要将目标作为另一个变量添加，请在 **Color by（按颜色区分）**下拉菜单中选择 `survived`。\n\n  ![](img/e28602b44ec813a47df57c96b204412c_361_0.png)\n\
  \n  虽然年龄和票价之间可能没有明显的趋势或关系，但我们可以观察到散点图中的一些模式，为数据提供额外的洞察。例如，我们可以发现支付较高票价的乘客存活率更高。或者，我们可以发现与成人相比，儿童的存活率更高，显示出存活率中潜在的年龄相关因素。\n\
  \n- 自定义可视化：除了使用预定义的分析可视化外，你还可以使用 Altair 在 Data Wrangler 中创建自己的自定义数据可视化。Altair 是一个\
  \ Python 数据可视化库，允许用户使用简洁且直观的代码轻松创建交互式可视化。它还与 Python 其他数据分析库（如 pandas、NumPy 和 SciPy）很好地集成，使其成为数据科学家和分析师的流行选择。Data\
  \ Wrangler 使用 `df` 变量来存储数据框，用户可以访问该变量。你可以通过点击任何步骤的 + 按钮并选择 **Add analysis（添加分析）**来添加类似于上述的自定义可视化。将分析类型设置为\
  \ **Custom Visualization（自定义可视化）**。在这里，我们将创建一个数据集。\n\n**方差膨胀因子（variance inflation\
  \ factor, VIF）**是变量之间共线性的度量。我们通过解决一个回归问题来计算它，即在给出其他变量的情况下预测其中一个变量。VIF 分数是一个大于或等于\
  \ 1 的正数，得分为 1 表示该变量与其他变量完全独立。分数越大，依赖性越强。经验法则是，我们可以删除或特征工程化 VIF 分数大于 1 的特征。\n\n要使用\
  \ VIF 创建多重共线性分析，请选择 **Add Analysis（添加分析）**，然后选择 **Multicollinearity（多重共线性）**。\n\n\
  ![](img/e28602b44ec813a47df57c96b204412c_363_0.png)\n\n*图 10.21：使用 VIF 进行多重共线性分析*\n\
  \n点击预览后，你会看到一个直方图，*X* 轴显示特征名称，*Y* 轴显示 VIF 分数。在我们的示例中，我们可以看到，基于 VIF，我们没有具有多重共线性的特征。\n\
  \n- 除了 VIF，Data Wrangler 还提供了几种你可以开箱即用的其他多重共线性分析。让我们看看 **Lasso 特征选择分析（Lasso feature\
  \ selection analysis）**。Lasso 方法涉及在回归模型中添加一个惩罚项，将自变量的系数向零收缩。该惩罚项有助于识别哪些自变量对预测因变量最为重要，也有助于解决多重共线性问题。要在\
  \ Data Wrangler 中使用 Lasso 特征选择方法，请选择之前讨论过的 **Multicollinearity（多重共线性）** 分析，然后将 **Analysis（分析）**设置为\
  \ **Lasso feature selection（Lasso 特征选择）**。你可以可选地选择 L1 幅度，即惩罚项；默认值为 **1**。接下来，我们将问题类型设置为\
  \ **Classification（分类）**，并将标签列设置为 **Survived（存活）**。这将创建一个基线回归模型，使数据集中所有自变量的正则化参数设置为足够大，导致某些系数向零收缩。这将创建一个直方图，显示最重要的特征——即具有非零系数的特征。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_364_0.png)\n\n*图 10.22：使用 Lasso 特征选择进行多重共线性分析*\n\
  \n检查所选自变量之间的相关性，以确定是否存在任何多重共线性问题。通过以这种方式使用 Lasso 特征选择方法，你可以识别并解决回归模型中的多重共线性，这有助于提高其准确性和可靠性。\n\
  \n除了我们在本章节中涵盖的分析外，Data Wrangler 还具有分析其他特定类型数据集（如时间序列数据）的功能。这些功能允许你进行异常检测和季节性趋势检测等额外分析。现在，你对数据和底层模式有了很好的理解，你可以进入下一步，通过添加转换来修改你的数据。\n\
  \n## 第 4 步 – 添加转换\n\n作为数据分析的一部分，你可能已经注意到想要更改或转换的数据集元素。数据转换的目标是使数据更适合建模，提高机器学习算法的性能，或处理缺失或损坏的值。机器学习的特征转换可以包括归一化、标准化、数据编码和分箱等。并非所有数据集都相同，也并非所有转换都适用于所有数据集。数据分析的目标是为你的数据集确定特定的转换。虽然通常我们在机器学习管道中将数据转换作为早期步骤，在数据用于训练模型之前应用，但在实际机器学习中，我们会持续监控模型性能，并在必要时应用转换。在\
  \ Data Wrangler 中导入并检查你的数据集后，你可以开始在数据流中添加转换。你可能已经注意到，我们数据集中的某些列没有与其关联的正确数据类型。例如，我们数据集中的\
  \ `age` 特征具有 String 类型，而不是 Numeric 类型。在应用转换之前，我们建议审查并修复数据集中所有特征的数据类型。\n\n你可以审查 Data\
  \ Wrangler 自动分配给特征的数据类型。\n\n\n\n\n\n![](img/e28602b44ec813a47df57c96b204412c_365_0.png)\n\
  \n图 10.23：数据源数据类型\n\n您可以使用以下步骤来执行此操作：\n\n- 前往数据流界面并双击**数据类型**框。这将打开一个部分，列出您的所有特征以及自动推断出的每个特征的数据类型。屏幕右侧还会实时显示您数据集的预览。\n\
  - 您可以使用**类型**下拉菜单来更改特定特征的数据类型。在进行下一步之前，让我们先执行其中一些操作。在这里，我们将`age`、兄弟姐妹（**sibsp**）和父母（**parch**）的数据类型更改为\
  \ Long，并将`age`特征更改为`Float`。在我的案例中，Data Wrangler 自动将这些所有特征分类为**字符串**。如果您在自己的账户中尝试此操作，结果可能略有不同。一旦您选择了特征所需的数据类型，即可使用**预览**按钮查看预览。\n\
  - 一旦您对更改感到满意，就可以点击**更新**按钮以应用这些更改。\n\n## 类别编码\n\n在删除前一部分中的特征后，我们的示例数据集中仍有两个包含表示类别的文本数据的特征，即**sex**（性别）和**boat**（救生艇）。我们将使用类别编码来转换**sex**特征。类别编码是一种常见的特征工程技术，它将代表一组离散值的分类数据转换为可用于机器学习模型的数值数据。由于大多数机器学习算法都基于数值数据工作，而分类数据不能直接用于许多机器学习模型，因此类别编码是必要的。有几种常见的类别编码技术，例如“独热编码”，其中每个类别值被转换为一个新列，并分配给该列\
  \ 1 或 0。例如，**sex**特征可以通过独热编码转换为两个新列，`sex_male`（男性）和`sex_female`（女性），每列根据**sex**特征的原始值包含\
  \ 1 或 0。标签编码是另一种常用的类别编码方法，它为每个类别分配一个唯一的整数值。例如，在我们的情况下，如果我们对**sex**特征应用标签编码，\n\n\
  我们将得到分别对应`female`（女性）和`male`（男性）值的 1 和 2。由于我们处理的是数字，较高的数值可能与具有较高正相关或负相关性的机器学习模型相关联，而这并不是我们想要的特征结果。除了独热编码和标签编码外，其他类别编码方法包括计数编码（将每个类别替换为其在数据集中出现的次数）和目标编码（将每个类别替换为该类别的目标变量的平均值）。目前，让我们对\
  \ sex 特征应用独热编码。我们将通过点击数据流中**删除列**按钮旁边的加号来添加一个新的转换步骤开始。\n\n![](img/e28602b44ec813a47df57c96b204412c_366_0.png)\n\
  \n图 10.24：数据转换 – 添加步骤\n\n接下来，点击**添加步骤**按钮并选择**类别编码**部分。在这里，您可以从**转换**下拉菜单中选择编码类型。我们将选择**独热编码**。我们将指定输入列，在我们的例子中是`sex`。接下来，指定您希望如何处理该列中的缺失值。您可以选择保留它们、跳过它们，或者如果在遇到缺失值时以错误结束转换过程。您可以预览转换，一旦您感到满意，就可以点击**添加**按钮将新的转换步骤添加到您的流程中。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_367_0.png)\n\n图 10.25：数据转换 – 独热编码\n\n\
  检查可视化器中的数据流，确保一切看起来符合预期。您现在应该看到一个用于独热编码的额外步骤。\n\n## 自定义转换\n\nData Wrangler 提供了几种开箱即用的常用内置转换，无需从头编写代码即可使用。我们在前面的章节中介绍了其中两种：首先，当我们使用删除列转换从数据集中删除冗余或无关的特征时；另一种我们使用的内置转换是对\
  \ DataFrame 的 sex 特征应用类别编码转换来进行独热编码。除此之外，还有其他内置转换可用于处理文本数据和时序数据、处理缺失和异常数据，以及执行常见的数据工程任务，如降维和在平衡数据集中工作。然而，可能会有场景需要您进行超出内置转换范围的数据转换。Data\
  \ Wrangler 通过**自定义转换**为您提供此功能，您可以在其中提供自己的 PySpark、PySparSQL 和 Python pandas 自定义代码，以及\
  \ Python 用户定义函数。选择要使用的特定类型自定义转换代码之前，注意数据集的大小至关重要。例如，如果您选择 Python (pandas)，您的数据集必须适合单个实例的内存。如果您有更大的数据集，请选择提供\
  \ PySpark 代码，这将允许您将数据分布在多个实例上并聚合结果。在我们的例子中，Titanic 数据集有一个**boat**（救生艇）特征，其中包含乘客如果登上的救生艇编号。虽然救生艇编号本身不包含重要信息，但乘客能够接触救生艇会显著增加其生存几率。我们将使用自定义转换来为数据集生成一个新特征，指定乘客是否能接触救生艇。以下自定义\
  \ Python 代码片段正是这样做的。它创建了一个新特征，**Lifeboat Exists**（是否有救生艇），并检查**boat**特征是否有值，如果有，则添加值\
  \ 1，如果没有，则插入 0。最后，它删除现有的**boat**特征，因为不再需要它：\n\n```python\n# Table is available as\
  \ variable `df`\n# Assign a target value to check, in our case '?' and use an escape\
  \ as\n# this is a special character\ntarget_value = '\\\\?'\n# Create a new column\
  \ that will check if value exists for boat number\ndf['lifeboat_exists'] = (~df['boat'].str.contains(target_value,\n\
  na=False)).astype(int)\n# Drop the existing \"boat\" column\ndf.drop('boat', axis=1,\
  \ inplace=True)\n```\n\n使用以下步骤在 Data Wrangler 中添加自定义转换：\n\n1. 前往 Data Wrangler 流程，通过点击数据流中**删除列**步骤旁边的加号来添加一个新的转换步骤。\n\
  2. 接下来，点击**添加步骤**按钮并选择**自定义转换**部分。在这里，您可以为您的自定义转换步骤提供一个可选的名称；我们将调用它`Lifeboat_check`。\n\
  3. 然后，我们将选择类型；由于我们的数据集相对较小，我们将选择 Python (pandas)。您将收到一条警告消息，提醒您检查数据集大小并确保可以将其放入单台机器的内存中。\n\
  4. 然后您可以粘贴上一节中的代码。为了确保没有错误，点击**预览**按钮并确保一切正常。您应该看到创建了一个新列`lifeboat_exists`，并且之前的`boat`列应该不再存在。\n\
  5. 一旦您对结果感到满意，点击**添加**按钮将此转换作为数据流中的额外步骤添加。您还可以像在之前一样在可视化器中审查您的数据流。\n\n```\ndf['cabin_bin']\
  \ = pd.cut(pd.factorize(df['cabin'])[0], num_bins,\nlabels=False)\n# Drop the existing\
  \ \"cabin\" column\ndf.drop('cabin', axis=1, inplace=True)\n```\n\n![](img/e28602b44ec813a47df57c96b204412c_370_0.png)\n\
  \n通过选择一个新的自定义转换，类似于我们为救生艇检查所做的那样，您可以添加此转换步骤。\n\n## 数值缩放\n\n使用梯度下降作为优化技术的机器学习算法，如线性回归、逻辑回归、神经网络等，要求数据进行缩放。您可以缩放数据集中特征的方法有两种。您可以应用归一化，也可以选择标准化。决定使用归一化还是标准化取决于归一化\n\
  \n\nof the distribution of the features. We use standardization for features with\
  \ a normal distribution. If the features have a skewed distribution, normalization\
  \ may be more appropriate. Normalization scales the features to a range of 0 to\
  \ 1, while standardization scales the features to have a mean of 0 and a standard\
  \ deviation of 1. In our case, fare is highly skewed, and age is closer to the normal\
  \ distribution. For the sake of simplicity, we will apply normalization to both\
  \ these features. To apply scaling in Data Wrangler, go to the Data Wrangler flow\
  \ to add a new transform step by clicking on the + sign next to the last step in\
  \ your data flow. Here, it is the transformation step for creating bins. Next, click\
  \ the Add step button and choose the Process numeric section. Here, choose Min-max\
  \ scaler as the scaler. For Input columns, select age and fare. Specify the Min\
  \ and Max values. We keep them as 0 and 1. Optionally, give the prefix for the new\
  \ input columns as scaled_. Hit the Preview button to make sure that the data looks\
  \ correct.\n\n![](img/e28602b44ec813a47df57c96b204412c_371_0.png)\n\nFigure 10.28:\
  \ Scale values\n\nOnce you are satisfied with the results, click on the **Add**\
  \ button to add this new transformation to your data flow. As usual, you can verify\
  \ the flow in the Data Wrangler visualizer.\n\n# Dropping columns\n\nNow that we\
  \ have applied several transformations, there are likely columns and features in\
  \ our dataset that are redundant or no longer needed. Let’s review them now. Picking\
  \ the right features and dropping irrelevant or redundant features are crucial steps\
  \ in building a machine learning model because they can significantly affect the\
  \ model’s performance and the quality of the predictions it makes. While feature\
  \ selection directly improves the accuracy of the model by preventing overfitting\
  \ issues, it also helps to keep the model simple and easier to explain, as well\
  \ as reduce the training time, leading to cost and performance efficiencies. In\
  \ other words, adding too many features may cause a complex model that may overfit\
  \ on the training data and be difficult to explain and train. But how do you choose\
  \ which features to drop and which to keep? Choosing the columns or features from\
  \ a dataset often depends on the specific machine learning problem and the analysis\
  \ that you do. Let’s look at some features in our example dataset that we could\
  \ consider dropping, starting with the **name** feature. While we may deduce meaningful\
  \ information about a passenger’s name, such as the sex of the passenger perhaps,\
  \ it is unlikely to have any direct impact on whether the passenger survived, and\
  \ it would be difficult to derive any meaningful insights from this column. In addition,\
  \ we already have the sex of the passenger as a distinct feature in the dataset,\
  \ so it makes the information irrelevant. Similarly, the **ticket** number is unlikely\
  \ to affect survival and may not provide any useful insights. We could try deriving\
  \ other useful information from the **ticket** feature, such as the class of passenger,\
  \ but that information is also already available in the dataset as a distinct feature.\
  \ This also is not likely to influence the chances of survival. We will drop the\
  \ **home destination** feature, which shows the final destination of the passenger,\
  \ for similar reasons. The **body** feature represents the body number of the recovered\
  \ body of the passenger. A value for that feature would show the person would not\
  \ have survived the tragedy. The **boat** feature has the lifeboat number of the\
  \ passenger, which would also show that the passenger survived. Both these features\
  \ can be tricky. In our example, we will drop the **body** feature as it is a strong\
  \ and independent predictor of our target. We will, however, keep the **boat** feature.\
  \ Finally, since we have already encoded the **sex** feature and scaled the **age**\
  \ and **fare** features, we also no longer need those. To drop a feature, click\
  \ on the + sign next to the last step and choose **Add Transform**. Data Wrangler\
  \ refers to each data transformation we define as a step. On the **All Steps** screen,\
  \ click on **Add step** to create a new transformation. This will bring up the **Add\
  \ Transform** screen. Here, we will get a comprehensive list of out-of-the-box transformations\
  \ that Data Wrangler provides. Let’s choose the **MANAGE COLUMNS** section and then\
  \ choose **Drop column** from the **Transform** dropdown.\n\n![](img/e28602b44ec813a47df57c96b204412c_373_0.png)\n\
  \nThe **Drop column** transformation allows you to select the columns you want to\
  \ drop from your dataset. Once we have selected the features, we can preview the\
  \ changes and click on the **Add** button to add the data transformation to our\
  \ flow. You can also go back and check to see whether a new step added to your data\
  \ flow in the data flow visualizer. Once we have defined all our transformations,\
  \ we are ready to actually apply them and export our data. We will cover this in\
  \ *step 5*.\n\n# Step 5 – exporting data\n\nSo far, we have performed several analyses\
  \ on our dataset. We have also defined several feature engineering data transformations.\
  \ However, it is important to remember that we have made no changes to the actual\
  \ data itself yet. We have defined the data flow, which contains a series of analysis\
  \ and transformation steps that can be executed before we build machine learning\
  \ models. If you check the data flow, it will look something similar to the following:\n\
  \nYou can choose to update your sources and your destination locations directly\
  \ in the Jupyter notebook before executing it. Data Wrangler uses a SageMaker Processing\
  \ job to apply the transformations from your data flow, which are defined in the\
  \ Jupyter notebook.\n\n- **Export to SageMaker Pipelines**: SageMaker Pipelines\
  \ is a fully managed service to build machine learning pipelines. When you choose\
  \ this option, Data Wrangler creates a Jupyter notebook with code to create a SageMaker\
  \ pipeline that executes your entire data flow. As with the Export to S3 option,\
  \ you are able to update your input and destination sources directly from the generated\
  \ Jupyter notebook.\n- **Export to an inference pipeline**: Using Data Wrangler,\
  \ you can directly export to a SageMaker inference pipeline that can be used with\
  \ a SageMaker endpoint. When you choose this option, Data Wrangler creates a Jupyter\
  \ notebook with code to apply all the transformations in your data flow and then\
  \ train an autopilot model. It then creates an inference pipeline and deploys it\
  \ to an endpoint. The inference pipeline uses the Data Wrangler flow to transform\
  \ the data from your inference request into a format that the trained model can\
  \ use.\n- **Export as Python code**: This option creates a Python script file with\
  \ code that contains all the transformations defined in your data flow. Depending\
  \ on where and how you run this script file, you might need to provide additional\
  \ permissions to access your AWS resources.\n- **Export to Feature Store**: Finally,\
  \ you can use Data Wrangler to export directly to SageMaker Feature Store. SageMaker\
  \ Feature Store is a fully managed feature repository for storing and retrieving\
  \ all your features and the metadata associated with those features. SageMaker Feature\
  \ Store uses a feature group, which is a collection of features. Using Data Wrangler,\
  \ you can either update an existing feature group or create a new one. When you\
  \ choose this option, Data Wrangler will create a Jupyter notebook with the code\
  \ to define and configure a feature group in SageMaker Feature Store. It will then\
  \ run a SageMaker Processing job to apply the transformations defined in your data\
  \ flow and update the feature group.\n\nOnce we have the data in the right format\
  \ and the location that we want, we can move on to the next step of building and\
  \ training a machine learning model.\n\n# Training a machine learning model\n\n\
  We have now used Data Wrangler to do data analysis and processing, which involved\
  \ several steps, such as data cleaning, preprocessing, feature engineering, and\
  \ exploratory data analysis. These steps are crucial before doing machine learning,\
  \ as they ensure that data is in the correct format, we selected the relevant features,\
  \ and we dealt with outliers and missing values using data transformation. Data\
  \ Wrangler provides a unified experience, enabling you to prepare data and seamlessly\
  \ train a machine learning model, all from within the tool.\n\n\n\n\n**SageMaker\
  \ Autopilot** 是一个自动化 **自动机器学习（AutoML）** 流程关键任务的工具。这包括探索您的数据、选择与问题类型相关的算法，以及准备数据以便于模型训练和调优。只需几次点击，您就可以使用\
  \ Autopilot、XGBoost 或您自己的算法，直接从 Data Wrangler **用户界面**（UI）自动构建、训练和调优 ML 模型。当您训练和调优模型时，Data\
  \ Wrangler 会将您的数据导出到 Amazon S3 位置，以便 Amazon SageMaker Autopilot 可以访问它。让我们看看如何从 Data\
