  *第7章，使用 Athena：* 在本章中，您将探索 Amazon Athena 的强大功能，这是一种无服务器查询服务，使您能够使用标准 SQL 查询直接分析\
  \ Amazon S3 中的数据。本章将指导您如何利用 Amazon Athena 从数据中获取宝贵见解，而无需复杂的数据处理基础设施。\n\n*第8章，使用\
  \ QuickSight：* 在本章中，您将发现 Amazon QuickSight 的强大功能，这是 AWS 提供的一项快速、云驱动的**商业智能（BI）**\
