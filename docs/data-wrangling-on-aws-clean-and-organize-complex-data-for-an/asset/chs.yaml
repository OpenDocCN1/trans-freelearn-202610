  \n## Challenge exercise\n\nYou can use this function in your custom code to create\
  \ incremental data processing logic. Every time you execute the read function, only\
  \ newer files that were created after the last successful run should be processed.\n\
  \n## Hint\n\nYou can use DynamoDB to store the timestamp from the ETL job once it\
  \ is successfully completed as part of the last step of the job. The next execution\
  \ of the job should retrieve the latest timestamp for every new execution, and it\
  \ should only list files between the timestamp from the last successfully completed\
  \ job run and the timestamp of the start of the current job run. Add a lock mechanism\
  \ as a part of the initialization step of the job (or before reading the files)\
  \ to avoid two jobs running in parallel reading the data at the same time. The DynamoDB\
  \ table should store state information with a primary key and a sort key as a combination\
  \ of a job identifier and an S3 path, and store start timestamp and stop timestamp\
  \ information for each job and S3 path combination.\n\n- **Describe objects:** Users\
  \ can execute a boto3 head_object command for a single file or for a prefix (which\
  \ can be done in parallel threads for improved performance). The advantage of using\
  \ this function is that it doesn’t download the object; instead, it gets only the\
  \ metadata of the S3 object.\n\n## Usage\n\nYou can use the describe object command\
  \ with filters (time or job identifier prefix) to identify the list of new files\
  \ and their sizes. This can help to identify the scope to optimize your output file\
  \ size once the job is completed.\n\nThe following screenshot shows an example of\
  \ using S3 Select on a CSV file:\n\n```\n%time\n%memit\nweather_data=wr.s3.select_query(\n\
  \    sql='SELECT * FROM s3object s where s.DATA_VALUE<>\\'\\\\0\\'',\n    path='s3://noaa-ghcn-pds/csv/by_year/2022.csv',\n\
  \    input_serialization = 'CSV',\n    input_serialization_params={\n    'FileHeaderInfo':\
  \ 'Use'\n    },\n    use_threads=True,\n)\n```\n\n```\npeak memory: 39506.35 MiB,\
  \ increment: 19722.42 MiB\nCPU times: user 4min 17s, sys: 55.2 s, total: 5min 12s\n\
  Wall time: 4min 7s\n```\n\n```\nweather_data.head(5)\n```\n\n|   | ID          \
  \ | DATE      | ELEMENT | DATA_VALUE | M_FLAG | O_FLAG | S_FLAG | OBS_TIME |\n|---:|:------------|:----------|:--------|:-----------|:-------|:-------|:-------|:---------|\n\
  | 0  | AEM000041196 | 20220101  | TAVG    | 204        | H      |        | S   \
  \   |          |\n| 1  | AEM000041194 | 20220101  | TAVG    | 211        | H   \
  \   |        | S      |          |\n\nFigure 3.49: S3 integration – S3 Select queries\n\
  \nIt takes four minutes to get the results back from the query, which reads 1 GB\
  \ of data in the CSV format, as the data is stored in an uncompressed format and\
  \ it needs to read all the data, but less data will be transferred between systems.\
  \ The benefits will be more pronounced when transferring high-volume data in a low-bandwidth\
  \ network. Also, note that this test was done on a high-memory and high-bandwidth\
  \ machine, which can load the entire file much faster and filter the data quickly\
  \ in memory. So, if your only need is better performance, you also need to consider\
  \ the data storage format and compute and memory resources available to your machine\
  \ before using S3 Select or filtering data after reading the entire table object\
  \ into your compute layer.\n\n- **Merging datasets on an S3 data lake:** The merge\
  \ upsert table function will help to perform `upsert` operations on existing files.\
  \ This function takes a primary key and performs an `upsert` operation. The underlying\
  \ logic is to drop the records from the existing table, which has the same primary\
  \ key with the DataFrame that has the new records to be loaded into the table. This\
  \ will create a final table with the new records inserted, and the existing records\
  \ will be updated with the most recent value.\n\n> **Note**\n> This is not a performant\
  \ solution for larger tables, as loading an entire table in memory is not an efficient\
  \ operation. Users should think of using transactional data lake formats such as\
  \ Hudi, Iceberg, Delta, or Lake Formation governed tables if they deal with huge\
  \ data volumes and use Apache Spark to process the data.\n\n- 4. If there is no\
  \ hit in the cache step, the query is submitted for execution by `awswrangler` in\
  \ either *Create Table as Statement* (CTAS), UNLOAD, or regular mode:\n  - **CTAS\
  \ mode:** This is the default mode, and it involves wrapping a query within a `create\
  \ table as statement`, with data stored in an S3 location in the Parquet format.\
  \ This method also creates a table with the output of the query in a CTAS database,\
  \ which is provided as an input argument. The Parquet file is then loaded into a\
  \ DataFrame using the `awswrangler` S3 read parquet file API. Also, the temporary\
  \ tables will be deleted at the end of the query execution to avoid cluttering the\
  \ tables from each query. Use this for bigger datasets where performance is necessary\
  \ and it also needs permissions to create and drop temporary CTAS tables.\n  - **Unload\
  \ mode:** This mode involves uploading data from a query into an S3 location as\
  \ a Parquet file. After that, similar to CTAS, we will load the dataset into a pandas\
  \ DataFrame using the `awswrangler` S3 read parquet file API. Use this for bigger\
  \ datasets and data that is exported to S3 in the Parquet format. Note that this\
  \ method doesn't create Glue tables before loading into a DataFrame.\n  - **Regular\
  \ mode:** This mode uses the Athena output location where the results are saved\
  \ in the CSV file format. This method is simple and doesn't require any additional\
  \ configuration to execute queries. Use this for smaller datasets, as they are stored\
  \ in the CSV file format in S3. The files are stored by default using Athena and,\
  \ hence, don't require any additional storage or configuration requirements.\n\n\
  The following diagram summarizes the `awswrangler` Athena query execution flow:\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_130_0.png)\n\n## How to utilize query\
  \ metadata for performance\n\nThe pandas DataFrame also has a query_metadata dictionary,\
  \ which is similar to the output of the GetQueryExecution command from Athena that\
  \ retrieves each query metadata. In the following screenshot, you can see information\
  \ such as when the query started and finished, where the results are stored, the\
  \ format of the file, and so on.\n\n```\nresult_type = {\n  'results.query_metadata':\
  \ {\n    'QueryExecutionId': 'a551b95f-c7e6-4423-b3ef-a2994f0e7f6',\n    'Query':\
  \ 'CREATE TABLE `default`...',\n    'StatementType': 'DDL',\n    'ResultConfiguration':\
  \ {'OutputLocation': 's3://...'},\n    'Statistics': {'TotalExecutionTime': 1416,\
  \ 'EngineExecutionTime': 1289, 'QueryQueueTime': 106, 'ServiceProcessingTime': 21,\
  \ 'DataScannedInBytes': 1495},\n    'DataManifestLocation': 's3://...'\n  }\n}\n\
  ```\n\n![](img/e28602b44ec813a47df57c96b204412c_131_0.png)\n\nHowever, we also have\
  \ a bunch of important attributes under the “Statistics” segment. They provide information\
  \ on the query wait time, the planning time, the execution time, and also the data\
  \ scanned. Note that Athena queries are charged based on the data scanned:\n\n>\
  \ TotalExecutionTime = EngineExecutionTime(includes QueryPlanningTime) + QueryQueueTime\
  \ + ServiceProcessingTime\n\nHere is an example from the preceding case – 1,416\
  \ ms = 1,289 ms + 106 ms + 21 ms.\n\nThe EngineExecutionTime was 1,289 ms, out of\
  \ which QueryPlanningTime was 156 ms. So, the actual execution time for the query\
  \ in the Athena engine was 1,133 ms.\n\n- **TotalExecutionTime:** The number of\
  \ ms that Athena took to run a DDL or DML query.\n- **EngineExecutionTime:** The\
  \ number of ms that the Athena engine took to run the query. The more complex the\
  \ query and the larger the data volume, the longer this phase takes.\n- **QueryPlanningTime:**\
  \ The number of ms that Athena took to plan the query processing flow.\n\n\n\n\n\
  \n# 介绍 AWS SDK for pandas\n\n- QueryQueueTime：查询在查询队列中等待资源的时间，单位为毫秒。这是一个可变时间，取决于特定区域和时间点的资源可用性。\n\
  - ServiceProcessingTime：Athena 在查询引擎完成运行查询后处理查询结果所花费的时间，单位为毫秒。如果查询在此阶段花费太多时间，我们会将大型数据集重写到\
  \ S3 并尝试减小结果集的大小。\n\n你可以使用这些指标来查看每个查询花费的时间然后对其进行优化。但是请注意，这些指标不包括任何网络延迟以及 Athena\
  \ 查询引擎之外的延迟。\n\n## Athena 缓存是如何工作的？\n\n我们可以通过将 MAX_CACHE_SECONDS 变量设置为大于零来启用缓存逻辑。这将有助于减少查询执行时间（如果结果仍然可用，则完全跳过执行并重用过去的结果）。\n\
  \n- 1. 检查 MAX_CACHE_SECONDS 变量是否大于零；如果设置为零或更小，则立即返回，查询每次调用时都会执行。这对于数据更新更频繁且需要最新数据而不是更低查询执行时间的用例是必要的。\n\
  - 2. 使用分页从 Athena 历史日志中根据 MAX_REMOTE_CACHE_ENTRIES 检索查询。检查查询详细信息是否在本地缓存中可用；如果没有，则将查询详细信息追加到本地缓存对象。本地缓存存储最近\
  \ 100 个查询的数据，以便比远程缓存更快地检索数据。在此 aws wrangler Athena 上下文中，缓存可以理解为查询元数据详细信息的存储，例如查询执行\
  \ ID 和查询完成时间。\n- 3. 根据条件对本地缓存和远程缓存中的查询列表进行排序，即查询完成时间经过的秒数不超过 MAX_CACHE_SECONDS。\n\
  - 4. 解析查询以便可以与旧查询成功匹配。目前，查询会被去除空白字符和尾部分号，并删除首尾括号，以便查询可以以合理的置信度进行匹配。\n- 5. 如果旧查询是\
  \ CTAS（使用 aws wrangler CTAS 模式执行），则在与新查询进行比较之前解析并获取内部查询。比较两个查询，如果匹配，则将缓存匹配作为成功返回。\n\
  \n例如，让我们执行一个简单的查询，从示例表中提取数据，该表在 CloudFront 日志上爬取并存储在 S3 存储桶中。你可以使用任何表来演示此 Athena\
  \ 缓存功能。\n\n```\n: %time\nwr.athena.read_sql_query(\"SELECT date,time,bytes,method,uri,referrer,result_type\
  \ from cloudfront_logs limit 1\")\nCPU times: user 298 ms, sys: 12.7 ms, total:\
  \ 311 ms\nWall time: 3.42 s\n:\n| date | time | bytes | method | uri | referrer\
  \ | result_type |\n| 2022-02-18 | 16:12:03 | 481 | GET | / | - | Error |\n\n: %time\n\
  wr.athena.read_sql_query(\"SELECT date,time,bytes,method,uri,referrer,result_type\
  \ from cloudfront_logs limit 1;\")\nCPU times: user 87.3 ms, sys: 2.99 ms, total:\
  \ 90.2 ms\nWall time: 353 ms\n:\n| date | time | bytes | method | uri | referrer\
  \ | result_type |\n| 2022-02-18 | 16:12:03 | 481 | GET | / | - | Error |\n```\n\n\
  Figure 3.53: Athena integration – Athena cache functionality\n\n你可以看到，查询的第一次运行花费了\
