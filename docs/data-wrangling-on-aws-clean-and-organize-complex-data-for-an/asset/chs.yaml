  \ = {}\n            print(\"**************************\")\n            print(\"\
  List route \" + name + str(i) + '_')\n            df_name = name[:-1]\n        \
  \    df1[name[:-1]] = a\n            df1[name[:-1] + \"_PK\"] = i\n            df1[pk]\
  \ = pk_val\n            df_list.append(df1)\n            print(\"Output in list-->\"\
  , df_list)\n            i += 1\n        out_dfs[df_name] = df_list\n        return\
  \ out_dfs\n    else:\n        print(\"====> Found a value for target column -->\
  \ \" + x)\n        out[name[:-1]] = x\n        out_dfs[df_name] = out\n        print(\"\
  Output-->\", out)\n        return out_dfs\n```\n\n图 9.35：更新后的 flatten 函数，用于将列表对象拆分为另一个\
  \ DataFrame，并建立主外键关系\n\n探索该函数，你可以在自己的环境中执行它以更好地理解其内部工作原理。现在，让我们将此整合为一个可用的 flatten\
  \ 函数并验证输出：\n\n```python\ndef flatten_json_v2(y):\n    out = {}\n    out_dfs = {}\n\
  \n    def flatten(x, name='', pk_name='df', pk=pk_val):\n        df1 = {}\n    \
