  \n## 挑战\n\n我们已经从MySQL数据库中完成了全量数据提取，那么您如何提取仅需要增量数据以用于后续加载？\n\n## 提示\n\n您必须修改提取脚本，以查询源表，仅在特定时间戳列之后提取数据。如果源数据库中当前没有这样的列，我们有两个选项：\n\
  \n- 选项 1：修改源数据库表，添加一个时间戳列，以便您可以增量提取数据。请记住，这种方法仍然无法帮助您获取删除的记录和DDL更改。\n- 选项 2：使用AWS\
  \ DMS或其他流式处理解决方案从源数据库进行CDC。\n\n尽管我们已经展示了如何使用Glue Python shell作业和AWS SDK for Pandas以编程方式提取数据，但我们建议使用AWS\
  \ DMS设置从数据库进行数据摄取，它具有多个优势并且性能更好。如果我们试图加载数据量较大的表，Glue作业将因内存不足异常而失败。您可以通过添加数据量更大的sporting_event_ticket表来尝试这一点。此外，在本章的剩余部分，我们将探索MySQL数据库中的所有表，我们已经使用AWS\
  \ DMS将数据迁移到S3原始层以供探索。您可以按照此博文使用DMS迁移数据 - https://aws.amazon.com/blogs/database/replicate-data-from-amazon-aurora-to-amazon-s3-with-aws-database-migration-service/。\n\
  \n现在，我们将通过数据整理活动的各个阶段（如数据发现、数据结构化、数据清洗、数据丰富、数据质量验证和数据可视化）来探索源数据。让我们从下一节的数据发现开始。\n\
  \n## 数据发现\n\n数据发现是数据整理管道中的一个重要阶段，因为它帮助用户理解数据并指导后续步骤应如何进行。例如，如果用户查看数据并确定某些列包含缺失值，则数据清洗应修复这些值，缺失的列可以通过与其他数据源连接或从原始数据中推导出来来添加。本质上，此步骤将让用户了解数据集的完整性、有用性和相关性。\n\
  \n\n\n\n\n## 使用 AWS SDK for Pandas 构建端到端数据整理流水线\n\n有多种方式进行数据发现，包括在本地机器上下载小文件，以及使用\
  \ Excel 文件来探索数据。我们将探讨如何探索存储在数据湖中的原始数据。在数据发现阶段执行的一些常见步骤如下：\n\n- 识别源数据结构/格式及其相关属性\n\
  - 可视化数据集上的数据分布\n- 验证数据集中是否存在有用的数据值\n- 可视化探索数据集以理解数据模式\n- 对数据集进行切片和分割，并探索满足特定业务需求的数据\n\
  \n您的特定项目可能包含额外的数据发现活动，您仍然可以使用以下各节中提到的选项来执行这些活动。\n\n## 使用 S3 Select 命令探索数据\n\nS3\
  \ Select 功能（https://docs.aws.amazon.com/AmazonS3/latest/userguide/selecting-content-from-objects.html）有助于通过\
  \ AWS 控制台界面和代码探索较小的数据集，以查看示例记录并运行一些探索性 SQL 查询。预计该功能仅支持小于 128 MB 卷的文件，并且可以提取最多 40\
  \ MB 的数据，但围绕行组和记录大小的限制仍然存在。对于受这些限制阻碍的数据集分析或发现，建议使用其他形式的分析。\n\n> 128 MB 和 40 MB 的文件大小/检索数据限制适用于控制台和\
  \ S3 Select，当以编程方式使用时，S3 Select 没有此限制。然而，无论通过哪种访问机制（通过控制台或编程方式），行组和记录大小的限制仍然适用。\n\
  \n我们将使用 S3 Select 命令探索 S3 原始存储桶中可用的数据，步骤如下所示：\n\n1. 导航到源文件所在的 S3 路径进行探索。在我们的示例中，让我们选取一个表进行探索，即\
  \ nfl_data：\n\n![](img/e28602b44ec813a47df57c96b204412c_301_0.png)\n\n图 9.7：在 AWS\
  \ 控制台中使用 S3 Select 查询 S3 文件\n\n2. 在 AWS 控制台中，验证输入和输出设置是否正确。在大多数用例中，这些设置会自动填充并正确推断，但您也可以针对我们的用例进行验证。我们将输入数据存储在\
  \ GZIP 压缩的逗号分隔值 (CSV) 文件格式中。\n\n![](img/e28602b44ec813a47df57c96b204412c_301_1.png)\n\
  \n图 9.8：AWS 控制台中的 S3 Select 配置\n\n如果您运行输出格式为 CSV 的查询，您可以在格式化视图中看到表头已正确填充。但是，列和字段对齐存在问题，我们将在接下来的步骤中进一步探讨此问题。查看列，从\
