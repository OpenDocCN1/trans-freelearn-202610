  \n## Summary\n\nSageMaker Data Wrangler 是一个专门用于分析和处理机器学习数据的工具。它也是 AWS 上机器学习的基础平台之一。这是一个很长的章节，虽然我们涵盖了\
  \ Data Wrangler 的几个关键功能，但仍有一些功能未包含在这本书中。我们首先介绍了如何登录 SageMaker Studio 并访问 Data Wrangler。对于示例数据集，我们使用了通过公共\
  \ S3 存储桶提供的内置 Titanic 数据集。然后我们执行了 EDA，首先使用 Data Wrangler 中的内置洞察报告，然后添加了额外的分析，包括使用自定义代码。接下来，为我们的\
  \ Data Wrangler 流程定义了几个数据转换步骤以进行特征工程。为此，我们使用了 Data Wrangler 中的多个内置数据转换。我们还研究了如何使用\
  \ Python（pandas）应用自定义数据转换。一旦我们定义了数据转换，我们就研究了将 Data Wrangler 流程导出到各种目标的各种选项，包括 S3、SageMaker\
  \ Feature Store、SageMaker Pipelines 和独立的 Python 脚本。最后但同样重要的是，我们研究了直接从 Data Wrangler\
  \ 运行完整的端到端机器学习周期的便捷性，其中包括所有数据处理步骤，选择合适的算法，并运行训练实验以及超参数调优作业。作为本次练习的一部分，我们还将实验中的最佳模型部署为\
  \ SageMaker 实时端点。随着本章的结束，请确保删除您账户中创建的任何已使用资源。\n\n随着我们进入本书的最后一章，我们将重点关注数据安全和监控。在这一最终部分，我们将把本书中探索的各种\
  \ AWS 服务汇集在一起，重点关注安全和监控。\n\n\n\n\n## 11\n数据湖安全\n与监控\n\n在前几章中，我们学习了数据整理流程，以及如何利用\
  \ AWS 生态系统中的不同服务进行数据整理活动。到目前为止，你应该已经掌握了使用 Glue DataBrew、SageMaker Data Wrangler\
  \ 和 AWS SDK for pandas 创建数据管道的足够知识。我们还讨论了 AWS 服务（如 AWS Glue、Athena、Amazon S3 和 QuickSight）提供的功能，所有这些都更有效地支持数据整理管道中的特定活动。在本章中，我们将探讨如何为您的工作负载的数据整理管道设置安全和监控。\n\
  \n本章涵盖以下主题：\n\n- 数据湖安全\n- 监控与审计\n\n## 数据湖安全\n\n在本节中，我们将讨论增强数据湖安全性的各种选项和方法。我们将讨论跨越多个层级的安全性；然而，这应仅被视为一个起点。你需要进一步完善，并根据项目的需要添加额外的安全层级。\n\
  \n## 数据湖访问控制\n\n为了保障数据湖的安全，我们可以结合使用基于用户的访问策略和基于资源的访问策略。用户策略附加到用户/角色，并控制用户/角色在账户内可执行的操作。除了基于用户的控制策略外，我们还可以通过将访问策略附加到\
  \ Amazon S3、Amazon SQS 等资源来控制对该特定资源的访问。这为保护 AWS 资源提供了另一层安全。作为一个通用最佳实践，访问策略应保持最小权限原则，仅允许在特定条件下执行所需的行动。\n\
  \n### 基于用户的访问策略\n\nAWS 身份和访问管理（IAM）以集中式的方式帮助控制对 AWS 资源的访问。它同时为您的 AWS 账户提供身份验证和授权：\n\
  \n- 身份验证使用其凭据在访问 AWS 资源之前验证资源/人员的身份\n- 授权验证已验证身份的用户/资源是否被允许执行特定操作\n\n我们将在本节中更多地讨论\
  \ IAM 授权，以了解它如何保护数据湖的访问。\n\n一些 IAM 策略的最佳实践在此处有详细说明。你还应遵循以下 AWS 文档中概述的最佳实践：[https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html](https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html)。让我们来看一下：\n\
  \n- 你应该使用服务控制策略（SCPs）为整个账户或组织内的多个账户应用权限护栏。护栏策略是用户在各账户上的最大可用权限。组织可以使用这些策略来阻止某些操作，以确保严格的安全姿态。一个例子是添加一个\
  \ SCP 策略，阻止个人团队成员创建新的角色/用户。以下链接提供了你开始使用的一些示例 SCP 策略：[https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_general.html#example-scp-restricts-iam-principals](https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_general.html#example-scp-restricts-iam-principals)。\n\
  - 你还可以为用户或角色提供 IAM 权限边界，以定义可以附加到该角色的权限最大边界。这将防止添加原本意图之外的额外权限。即使通过托管或内联策略为 IAM 用户/角色添加了更广泛的权限，权限边界也将作为预防性护栏，使该用户/角色只能拥有定义在权限边界内的访问权限。一个常见的用例是允许开发人员创建额外角色以执行日常任务，但同时也限制这些服务角色拥有更广泛的权限，以避免任何安全问题。请参阅以下博文，了解有关使用权限边界的更多详细信息：[https://aws.amazon.com/blogs/security/when-and-where-to-use-iam-permissions-boundaries/](https://aws.amazon.com/blogs/security/when-and-where-to-use-iam-permissions-boundaries/)。\n\
  \n你可以通过基础架构供应代码或控制台为特定用户将权限边界附加到个人用户角色：\n\n```\n1 - {\n2       \"Version\": \"2012-10-17\"\
  ,\n3       \"Statement\": [\n4           {\n5               \"Sid\": \"Statement1\"\
  ,\n6               \"Principal\": \"*\",\n7               \"Effect\": \"Deny\",\n\
  8               \"Action\": \"*\",\n9               \"Resource\": [\"arn:aws:s3:::wranglerbook\"\
  , \"arn:aws:s3:::wranglerbook/*\"],\n10              \"Condition\": {\n11      \
  \            \"NotIpAddress\": {\n12                      \"aws:SourceIp\": \"172.0.0.0/24\"\
  \n13                  }\n14              }\n15          }\n16      ]\n17  }\n```\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_390_0.png)\n\n- 你还可以通过文件夹级别控制用户的访问。请注意，Amazon\
  \ S3 是一个对象数据存储，具有扁平的文件存储层次结构；AWS 控制台将具有相同前缀的数据可视化为文件夹，以便于浏览。因此，在共享数据集的情况下，仅授予特定前缀的访问权限。例如，假设我们在不同的文件夹下存储了来自多个客户的数据。我们可以将特定用户角色的访问权限限制在特定的文件夹/前缀。请参阅以下文档路径，了解设置文件夹级别访问权限的存储桶策略示例：`https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies.html#example-bucket-policies-folders`。\n\
  \n- 在需要为多组用户提供不同文件夹中对象访问权限的情况下，使用对象标签将访问权限限制为 S3 存储桶中的特定对象。例如，假设我们有三个不同的数据源（电子商务、代理、其他）将用户数据存入\
  \ S3 存储桶。每个源每天将上传两个文件，一个包含敏感数据（不应被用户访问），另一个不包含敏感数据（可被所有用户访问）。每个源将文件上传到以其名称命名的文件夹下。在这种情况下，我们可以使用对象标签来提供对不包含敏感数据的文件的访问权限，如下所示：\n\
  \n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Principal\"\
  :{\"AWS\":[\n        \"arn:aws:iam::<<accountid>>/role/role_name\"]},\n      \"\
  Effect\": \"Allow\",\n      \"Action\": [\"s3:GetObject\"],\n      \"Resource\"\
  : \"arn:aws:s3::wranglerbook/*\",\n      \"Condition\": { \"StringEquals\": {\"\
  s3:ExistingObjectTag/dataclassification\": \"sensitive\" } }\n    }\n  ]\n}\n```\n\
  \n图 11.3：基于附加到 S3 存储桶的标签限制访问的 S3 访问策略语句\n\n你还可以在数据上传到 S3 存储桶时确保对象被正确标记，通过使标签成为 PutObject\
  \ 操作的条件。请参阅以下 AWS 文档，了解基于对象的标签的更多详细信息：[https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies.html#example-bucket-policies-object-tags](https://docs.aws.amazon.com/AmazonS3/latest/userguide/example-bucket-policies.html#example-bucket-policies-object-tags)。\n\
  \n### 控制数据湖访问的额外选项\n\n你可以执行以下活动来保护数据湖中的数据：\n\n- **S3 访问点**帮助简化被多个团队访问的共享存储桶的访问控制。它们是附加到\
  \ S3 存储桶的命名网络端点，具有不同的权限策略。S3 端点通过将每个用例的策略分离到独立的端点中，帮助管理具有复杂存储桶策略且难以维护的存储桶。一些常见用例包括托管大型共享数据集的存储桶，其中每个数据集具有不同的访问策略，以及在影响现有策略的情况下在\
  \ S3 存储桶上测试新的访问策略更改。\n\n- **对象 Lambda 访问点**在你希望在访问点前使用 Lambda 函数时非常有用。它们有助于使用 Lambda\
  \ 对象进行 PII 数据脱敏等情况。请参阅以下博文以了解如何实现此解决方案：[https://docs.aws.amazon.com/AmazonS3/latest/userguide/tutorial-s3-object-lambda-redact-pii.html](https://docs.aws.amazon.com/AmazonS3/latest/userguide/tutorial-s3-object-lambda-redact-pii.html)。\n\
  \n- **IAM Access Analyzer** 有助于验证策略的语法和最佳实践，识别与外部实体共享的资源，并基于 CloudTrail 日志生成策略。它帮助你应用遵循最小权限模型的政策，仅授予用户所需的最小权限。应定期验证，以确保根据最近的用户活动更新策略。\n\
  \n\n\n\n- **Amazon S3 日志选项**：Amazon S3 提供了几种日志选项，用于捕获所有用户操作，以满足审计、合规性和安全需求：\n  -\
  \ Amazon S3 服务器日志用于捕获细粒度详细的日志（生命周期转换事件、身份验证失败等）。这些日志包含对象大小、HTTP 引用者等额外字段。除了日志的存储成本外，没有额外费用。\n\
  \  - AWS CloudTrail 事件（S3 API 调用）通过 CloudTrail 捕获对象和存储桶的 API 操作。日志可以传送到多个位置，并转发到\
  \ Amazon CloudWatch 进行进一步分析。除了日志存储成本外，CloudTrail 事件捕获还有额外费用，但它与其他系统的集成能力更强。\n\n\
  请参阅以下文档页面，了解 AWS CloudTrail 和 Amazon S3 服务器日志之间的区别：https://docs.aws.amazon.com/AmazonS3/latest/userguide/logging-with-S3.html。\n\
  \n- **Amazon S3 Inventory** 可帮助您定期导出 CSV/ORC/Parquet 格式文件，其中包含 S3 存储桶或前缀中的对象列表。此报告可用于分析对象的复制和加密状态，以确保数据安全。可以使用\
  \ Amazon Athena 查询清单文件，通过 SQL 查询识别 S3 存储桶中的监管或合规性问题。\n\n## 监控、发现和识别安全问题\n\n以下服务可帮助您监控、发现和识别数据湖中的安全问题：\n\
  \n- **AWS Config** 帮助用户持续监控 AWS 资源并审计配置变更。用户可以在 AWS Config 上配置规则，以监控和标记不符合所配置规则的资源。您可以设置\
  \ AWS Config 来验证组织内所有存储桶的公共读写配置。请参阅以下博客文章，了解如何使用 AWS Config 识别和更新您账户中 S3 存储桶的公共设置：https://aws.amazon.com/blogs/security/how-to-use-aws-config-to-monitor-for-and-respond-to-amazon-s3-buckets-allowing-public-access/。\n\
  \n- **AWS Trusted Advisor** 会扫描您账户中的 AWS 基础设施，并提供遵循最佳实践的建议。它可用于识别数据湖配置中的任何问题并适当修复。此服务适用于\
  \ AWS Enterprise Support 客户。Trusted Advisor 提供优化建议，帮助解决以下问题：\n  - **成本优化**：识别未分配、未充分利用和空闲的\
  \ AWS 资源，帮助用户优化成本。\n  - **性能**：通过分析 AWS 资源的吞吐量、延迟和计算使用情况，提供改进性能的建议。\n  - **安全性**：识别暴露的凭证、安全组漏洞、S3\
  \ 存储桶权限过于开放等问题，并提供相关建议。\n  - **容错能力**：识别并突出 EC2 自动扩缩、健康检查、数据备份等。\n  - **服务限制**：AWS\
  \ 对不同服务设有服务限制。当用户达到服务限制的 80% 时，它会突出显示，以便用户做好充分准备。\n\n- **Amazon Macie** 通过机器学习模式匹配识别您\
  \ S3 存储桶中的敏感数据。Macie 还支持对 S3 存储桶进行自动敏感数据发现。请参阅以下文章，了解使用 Amazon Macie 跨多个账户实现自动化敏感数据发现框架：https://aws.amazon.com/blogs/security/use-amazon-macie-for-automatic-continual-and-cost-effective-discovery-of-sensitive-data-in-s3/。\n\
  \n- **AWS GuardDuty** 是一项威胁检测服务，可持续监控您的 AWS 账户是否存在可疑活动。您可以使用 GuardDuty 监控 S3 管理事件和数据事件，从而识别安全问题。系统将生成报告，以便用户针对这些问题采取行动。一些常见用例包括：\n\
  \  - 识别存储在 EBS 存储卷中的文件相关问题\n  - 通过分析 EKS 审计日志识别容器部署问题\n  - 识别受损凭证、可疑登录和访问模式等\n\n\
  ## AWS Lake Formation 集成\n\nAWS Lake Formation 为数据湖提供细粒度访问控制，允许您向 Data Catalog 资源、Amazon\
  \ S3 位置以及底层数据上的各个主体授予权限。这可以实现对数据访问和用户操作的精确控制。\n\n在 Lake Formation 中，有两种执行细粒度访问控制的方式：\n\
  \n- **IAM 访问控制**：推荐的方法是向各个主体授予对 Data Catalog 资源、S3 位置和底层数据的 IAM 权限。此方法可实现对数据访问的最大控制。\n\
  - **IAM 和 Lake Formation 权限**：此方法结合了 IAM 权限和 Lake Formation 权限。它有助于实施额外的安全控制，例如行级访问控制。\n\
  \n要有效配置安全规则，请考虑以下因素：\n\n- **数据安全要求**：确定数据所需的安全级别，包括防止未经授权的访问、修改或删除\n- **数据访问要求**：确定谁需要访问数据以及他们应能够执行哪些操作\n\
  - **数据治理要求**：考虑需要强制执行的任何数据治理策略\n\n要有效配置安全规则，请遵循以下提示：\n\n- 从最小权限原则开始，只向需要权限的用户授予权限，以缩小攻击面\n\
  - 使用细粒度权限，通过授予对特定资源（如表或列）的访问权限，更好地控制数据访问\n- 实施**基于角色的访问控制（RBAC）**，将权限分配给角色，然后将这些角色分配给用户或组，以简化安全管理\n\
  - 启用审计日志以跟踪数据访问和用户操作，帮助排查安全事件\n\n通过考虑这些因素并遵循安全规则配置的最佳实践，您可以有效控制对数据湖的访问、降低安全风险并强制实施数据治理策略。\n\
  \n## 数据保护\n\n数据必须在必要时通过安全和加密措施加以保护。在适用的情况下，对 S3 存储桶和数据库中的数据进行加密。敏感数据可以进行令牌化处理，以在必要时增加一层安全保护。除非您有权访问令牌化服务器，否则令牌化数据无法逆向工程得到原始数据项。有关在\
  \ AWS 中实施令牌化解决方案的更多详细信息，请参阅以下 Protegrity/Athena 博客：https://aws.amazon.com/blogs/apn/data-tokenization-with-amazon-athena-and-protegrity/。\n\
  \n为了获得稳健的安全性，我们需要启用其他 S3 数据保护选项，以保护数据免受恶意或意外删除：\n\n- **启用对象版本控制**：对象版本控制在每次更改时在存储桶中保留对象的多个版本。当对象被删除时，会插入一个删除标记，并且该对象不会从存储桶中永久删除。这有助于您在出现问题时回滚到对象的先前版本。\n\
  - **启用 MFA 删除以防止意外删除**：此功能通过要求两种形式的身份验证来删除或更改对象状态，有助于防止意外删除文件。\n- **阻止公共访问**：为数据湖存储桶启用此功能，避免所有人获得对存储桶的访问权限。这除了存储桶策略和其他访问控制机制之外，还增加了另一层安全保护，以保护数据湖对象。\n\
  - **对象锁定**：对象锁定可防止对象在一定时期内被删除或覆盖。此功能有助于存储对象以满足监管合规性要求（**一次写入，多次读取 – WORM**）\n- **强制实施\
  \ TLS 连接**：您可以通过使用存储桶策略和加密数据存储来实现这一点。\n\n\n\n\n\n请参考以下 Amazon S3 博客以了解保护数据的最佳实践：https://aws.amazon.com/blogs/security/top-10-security-best-practices-for-securing-data-in-amazon-s3/。\n\
  \n对于 Redshift/RDS 数据库，最佳实践是使用 IAM 身份验证来增强安全性。或者，您可以使用 AWS Secrets Manager 安全地存储数据库用户名/密码并自动轮换密钥以提高您的安全态势。Redshift\
  \ 原生支持行级和列级过滤器以提供细粒度的访问控制。对于其他自定义数据库，您可以利用视图来强制执行安全性：https://aws.amazon.com/blogs/big-data/achieve-fine-grained-data-security-with-row-level-access-control-in-amazon-redshift/。\n\
  \n关于 Redshift，请参考以下文档了解有关安全的更多信息：https://docs.aws.amazon.com/redshift/latest/dg/c_security-overview.html。\n\
  \n## 在 AWS Glue 中保护您的数据\n\n在上一章中，我们学习了如何使用 AWS Glue，它为您提供了一种简便高效的方式来准备和转换数据以进行分析。在本节中，我们将探讨如何使用\
  \ AWS Glue 来保护数据：\n\n- 1. **对静态数据使用加密**：保护数据最关键的步骤之一是对其进行加密。AWS Glue 为静态数据提供了多种加密选项。您可以使用\
  \ Amazon S3 服务器端加密在将数据存储到 S3 之前对其进行加密。您还可以使用 AWS Key Management Service (KMS) 安全地管理加密密钥。此外，您还可以使用\
  \ Glue 的 Data Catalog Encryption 功能来加密存储在 Data Catalog 中的元数据。\n\n- 2. **限制对数据的访问**：为了防止未经授权访问您的数据，您需要控制对\
  \ AWS Glue 资源的访问。AWS Glue 提供了多种限制对数据访问的工具。您可以使用 AWS IAM 创建策略来定义谁可以访问 AWS Glue 资源。您还可以使用\
  \ VPC 端点将对 AWS Glue 资源的访问限制在您的 VPC 内。此外，您还可以使用 AWS PrivateLink 通过私有网络安全地访问您的 AWS\
  \ Glue 资源。\n\n让我们看一个示例。在此策略中，使用了 Deny 效果来限制对 glue:GetTable、glue:GetPartition 和 glue:GetDatabase\
  \ 操作的访问。Resource 字段用于指定受此策略影响的资源，例如目录、数据库、表和分区。Condition 字段用于指定该策略仅适用于未在 aws:PrincipalArn\
  \ 字段中指定的用户或角色：\n\n```\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n \
  \   {\n      \"Effect\": \"Deny\",\n\"Action\": [\n    \"glue:GetTable\",\n    \"\
  glue:GetPartition\",\n    \"glue:GetDatabase\"\n  ],\n  \"Resource\": [\n    \"\
  arn:aws:glue:region:account-id:catalog\",\n    \"arn:aws:glue:region:account-id:database/database-name\"\
  ,\n    \"arn:aws:glue:region:account-id:table/database-name/table-name\",\n    \"\
  arn:aws:glue:region:account-id:table/database-name/table-name/*\",\n    \"arn:aws:glue:region:account-id:partition/database-name/table-name/*/*\"\
  \n  ],\n  \"Condition\": {\n    \"StringNotEquals\": {\n      \"aws:PrincipalArn\"\
  : [\n        \"arn:aws:iam::account-id:user/username\",\n        \"arn:aws:iam::account-id:role/role-name\"\
  \n      ]\n    }\n  }\n}\n]\n```\n\n通过使用 IAM 策略限制对 AWS Glue 中数据的访问，您可以确保只有授权的用户和角色可以查看、修改或删除您的数据。您可以在\
  \ AWS Glue 的官方文档中找到更多示例：https://docs.aws.amazon.com/glue/latest/dg/glue-policy-examples.html。\n\
  \n- 3. **监控数据访问**：监控谁在访问您的数据以及何时访问至关重要。AWS Glue 提供了多种监控和日志功能来帮助您监控对数据的访问。您可以使用 AWS\
  \ CloudTrail 记录 API 调用并跟踪谁在访问您的 AWS Glue 资源。您还可以使用 Amazon CloudWatch 监控并在特定事件或阈值发生时提醒您。例如，您可以创建一个规则来查找\
  \ Glue.DataCatalog 事件，其中 eventName 字段设置为 GetTable、GetPartition 或 GetDatabase。\n\n\
  - 4. **保护传输中的数据**：为了保护数据在架构不同组件之间传输时的安全，您需要使用安全协议。AWS Glue 提供了多种保护传输中数据的选项。您可以使用\
  \ HTTPS 在 Glue 作业和 S3 之间传输时加密数据。您还可以使用 SSL/TLS 在 Glue 作业和其他 AWS 服务之间传输时加密数据。\n\n\
  - 5. **使用 IAM 角色和策略：** AWS Glue 使用 IAM 角色来控制对 AWS Glue 资源的访问。您可以创建授予特定 Glue 资源权限的\
  \ IAM 角色。IAM 策略定义每个角色的权限。您可以使用 IAM 策略来控制对 AWS Glue 资源的访问，包括作业、爬虫和触发器。\n\n至此，我们已经探讨了确保数据湖安全的各种选项。即使平台具有最高可能的安全标准，也应建立监控和审计框架以确保安全标准/规则按预期工作。我们将在下一节中详细继续探讨监控和审计的选项。\n\
  \n## 监控和审计\n\n在本节中，我们将查看监控数据湖工作负载的不同选项。这将帮助您了解数据湖和其他 AWS 服务的性能和健康状况。我们还将使用 Amazon\
  \ CloudTrail 探讨数据湖的审计方面。\n\n## Amazon CloudWatch\n\nAmazon CloudWatch 是一种监控和可观测性服务，为用户提供其\
  \ AWS 资源和应用程序的性能和健康状况的可见性。它从各种 AWS 资源中收集和存储指标、日志和事件，包括 EC2 实例、Lambda 函数、RDS 数据库等。用户随后可以使用这些数据来排除故障、优化性能并提高运营效率。\n\
  \n### Amazon CloudWatch 概述\n\n- - **指标：** 表示资源随时间推移的性能或利用率的数值数据点，例如 CPU 利用率、网络流量或数据库延迟\n\
  - - **日志：** 应用程序或系统中发生的事件和活动的基于文本的记录，例如服务器日志、应用程序日志和安全日志\n- - **事件：** AWS 资源内发生的重大更改或操作的通知，例如启动新的\
  \ EC2 实例或更改安全组\n\n### Amazon CloudWatch 的关键功能\n\n- - **指标和警报：** CloudWatch 从 AWS\
  \ 资源和服务收集和存储指标，并允许用户根据特定指标设置警报和触发器。当指标突破阈值时，用户可以收到通知并采取自动操作，例如扩展资源。\n- - **日志和洞察：**\
  \ CloudWatch 允许用户收集、监控和分析来自 AWS 资源和应用程序的日志。用户可以搜索和过滤日志并使用 CloudWatch Logs Insights\
  \ 深入了解日志数据并识别问题。\n- - **事件和规则：** CloudWatch 提供了一个集中式事件管理系统，允许用户监控和响应其 AWS 资源和服务中的更改和操作。用户可以创建规则以根据特定事件触发自动操作，例如启动\
  \ EC2 实例或停止 RDS 数据库。\n- - **仪表板和可视化：** CloudWatch 提供了用于可视化和分析指标和日志的各种工具，包括可自定义的仪表板、图表和图形。用户可以创建自定义可视化以监控其\
  \ AWS 基础设施和应用程序的特定方面。\n- - **集成和 API：** CloudWatch 与各种 AWS 服务和第三方工具集成，并提供用于以编程方式访问和管理\
  \ CloudWatch 数据的 API。用户还可以使用 AWS CloudFormation 模板自动创建和管理 CloudWatch 资源。\n\n###\
  \ Amazon CloudWatch 的优势\n\n- - **实时监控和可见性：** 使用 Amazon CloudWatch，用户可以实时了解其 AWS\
  \ 基础设施和应用程序的性能和健康状况，并快速响应问题和事件\n- - **自动扩展和优化：** Amazon CloudWatch 允许用户根据特定指标设置警报和触发器，并采取自动操作，例如扩展资源以优化性能和成本\n\
  - - **提高运营效率：** Amazon CloudWatch 提供了用于监控和分析 AWS 基础设施和应用程序的各种工具，使用户能够更快、更高效地识别和排除故障\n\
  - - **降低成本：** Amazon CloudWatch 可以帮助用户通过优化资源使用并在问题导致停机或性能下降之前识别和解决它们来降低成本\n\n###\
  \ 使用 AWS Glue ETL 作业监控监控 AWS Glue 作业\n\n要使用 AWS Glue ETL 作业监控监控您的 AWS Glue 作业的状态和进度，请按照以下步骤操作：\n\
  \n- 1. 转到 AWS Glue 并导航到 ETL **Jobs** 部分。单击 **Job run monitoring**。\n- 2. 指定您想要监控作业的日期范围。系统将提供在指定日期范围内执行的所有作业的摘要，包括\
  \ **Total runs、Success、Failed、DPU hours** 等：\n\n\n\n\n\n## 图 11.4：AWS Glue ETL 监控\n\
  \n3. 要监控特定作业，请选择所需作业并单击查看运行详情：\n\n![](img/e28602b44ec813a47df57c96b204412c_399_0.png)\n\
  \n## 图 11.5：监控 AWS Glue ETL 作业\n\n4. 作业运行标签页将向您展示作业的当前状态，包括作业的运行 ID、开始时间和状态。\n\n\
  5. 如果您希望查看作业的详细日志，请单击 CloudWatch 日志下的超链接。此操作将打开一个 CloudWatch 页面，指定日志的详细信息：\n\n![](img/e28602b44ec813a47df57c96b204412c_400_0.png)\n\
  \n6. CloudWatch 日志将被列出，为您提供必要的信息：\n\n![](img/e28602b44ec813a47df57c96b204412c_400_1.png)\n\
  \n7. 要获取有关作业的更多详细信息，请单击任何可用的日志流。\n\n按照这些步骤，您可以使用 AWS Glue ETL 作业监控有效地监控您的 AWS Glue\
  \ 作业。\n\n# Amazon CloudTrail\n\nCloudTrail 是 Amazon Web Services（AWS）提供的一项服务，使您能够记录和监控\
  \ AWS 账户内所做的所有 API 调用。它提供了一个全面的审计跟踪，可用于安全分析、合规审计和故障排除。\n\n## CloudTrail 的功能\n\n\
  - **API 日志记录**：CloudTrail 记录对 AWS 服务所做的所有 API 调用，包括通过 AWS 管理控制台、SDK、命令行工具和其他 AWS\
  \ 服务所做的调用\n- **事件历史**：CloudTrail 提供所有 API 事件的详细历史，包括调用者的身份、事件时间以及 API 调用中使用的参数\n\
  - **日志文件完整性验证**：CloudTrail 使用加密哈希来确保日志文件的完整性，防止篡改或未经授权的访问\n- **S3 集成**：CloudTrail\
  \ 可以将其日志文件存储在 S3 存储桶中，为您的日志文件提供经济高效、持久且可扩展的存储\n- **实时通知**：CloudTrail 可以在特定事件发生时向您发送实时通知，例如创建或删除\
  \ EC2 实例\n\n## CloudTrail 的优势\n\n- **提高安全性**：CloudTrail 为您提供 AWS 账户内所做所有 API 调用的完整审计跟踪，使您能够快速识别和响应安全威胁\n\
  - **合规审计**：CloudTrail 通过提供所有 API 事件的详细历史来帮助您满足合规要求，可用于审计和报告\n- **故障排除**：CloudTrail\
  \ 通过提供所有 API 事件的详细历史来帮助您排除问题，可用于识别问题的根本原因\n- **经济高效的存储**：CloudTrail 可以将其日志文件存储在\
  \ S3 存储桶中，为您的日志文件提供经济高效、持久且可扩展的存储\n\n## CloudTrail 的工作原理\n\nCloudTrail 通过捕获和记录 AWS\
  \ 账户内所做的 API 调用而工作。当进行 API 调用时，CloudTrail 会创建一个 JSON 格式的日志文件，其中包含有关调用的信息，例如调用者的身份、调用时间以及调用中使用的参数。然后日志文件存储在\
  \ S3 存储桶中。\n\n您可以配置 CloudTrail 以记录特定 AWS 服务或整个 AWS 账户的 API 调用。您还可以配置 CloudTrail\
  \ 在特定事件发生时发送实时通知，例如创建或删除 EC2 实例。\n\n要使用 CloudTrail，您必须首先在 AWS 账户中启用它。然后您可以配置它以记录特定服务的\
  \ API 调用并发送实时通知。一旦启用，CloudTrail 将开始捕获和记录 AWS 账户内所做的 API 调用。\n\n# 总结\n\n在本章中，我们讨论了在\
  \ AWS 中保护、监控和审计您的数据管道的选项。本书前面，我们探索了在 AWS 中执行数据整理活动的各种选项。让我们总结一下本书前面讨论的数据：\n\n- 首先，我们探索了\
  \ AWS Glue DataBrew，它通过基于 GUI 的方法帮助您为每种类型的用户创建数据整理管道。这对于希望快速设置数据整理管道而无需担心管道的编码和管理方面的团队非常有用。\n\
  - 我们还介绍了 SageMaker Data Wrangler，它帮助用户创建基于 GUI 的数据整理管道。然而，它更紧密地与机器学习工作负载相关联，并与 SageMaker\
  \ 服务集成更紧密。这对于计划在 SageMaker 中管理模型训练和推理的数据整理的团队非常有用。\n- 我们还探索了用于 pandas 的 AWS SDK，也称为\
  \ awswrangler，一种动手编码的数据整理方法，将 pandas 库与 AWS 生态系统集成。这被更喜欢 Python 编程并且热爱 pandas 库及其能力的用户使用。\n\
  - 我们还介绍了不同的 AWS 服务，例如 Amazon S3、Amazon Athena、AWS Glue 和 Amazon QuickSight，以及这些服务如何帮助数据整理管道的不同方面。这些功能应有效地使用，以使您的数据整理管道更有效和高效。\n\
  \n我们希望您所学到的关于在 AWS 中创建稳健数据管道的概念对您有所帮助。您可以使用所学知识开始在您的 AWS 账户中实施数据整理管道。\n\n如果您有任何其他问题，请联系本书的作者——我们将很乐意帮助您。祝学习愉快！！\n"
