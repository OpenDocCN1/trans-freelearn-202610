  \ Challenge\n\n你可以扩展查询架构以匹配之前具有更宽数据集的查询，然后应用过滤器以获得更小的数据集。扩展以下列表中列出的高级流程。\n\n- 1.\
  \ 识别旧查询并在比较之前在查询中拆分 where 子句和 from 子句。\n- 2. 以类似格式解析新查询并将其与旧查询进行比较。如果新查询比旧查询有更多过滤器和/或更少的列，我们可以使用旧查询的数据并在\
  \ pandas DataFrame 中应用过滤器并返回结果，例如以下内容：\n\n```\nQuery 1: select * from hr. employee\
  \ where city='NY'\nQuery 2: select * from hr. employee where city='NY' and join_date>'2020-10-01'\n\
  ```\n\n在这里，我们可以看到 Query 2 是 Query 1 的子集，我们可以使用已执行的数据并在 pandas DataFrame 的列上应用进一步的过滤器。\n\
  \n此外，改进查询匹配逻辑以提高缓存命中率的空间巨大，你所做的更新可以贡献回 AWS SDK for pandas 仓库。祝编码愉快!!!\n\n另外，它提供了许多有用的模块，其中一些列在这里：\n\
  \n- Repair table：这会运行 MSCK REPAIR 命令，以使用存储层中的最新数据更新表元数据。此函数执行 Hive 的元存储一致性检查 – MSCK\
  \ REPAIR TABLE <tablename>。该命令恢复分区和与分区相关的数据并更新表定义。这是为了查询在这些分区下可用的数据而需要的。当从不更新 Glue\
  \ 目录的 ETL 作业创建新分区时，这很有用。\n- Wait query：这会每 250 ms 迭代查询状态，直到查询移动到 FAILED、SUCCEEDED\
  \ 或 CANCELLED 状态（查询执行的最终状态）。如果你想使用更短或更长的轮询机制来验证查询执行状态，你必须自定义你的代码。\n\naws wrangler\
