  \ matplotlib 来可视化结果，从而更深入地了解数据。\n\n## 通过 Amazon Athena 和 Glue Catalog 访问\n\n为了让习惯使用基于\
  \ SQL 访问的用户能够发现数据，我们可以将数据集编目到 AWS Glue Data Catalog 中，并对数据集进行更复杂的分析。Athena 提供了基于\
  \ SQL 的访问机制，可在没有任何文件大小限制的情况下探索数据，支持 SQL，并且无需 Python 编程即可探索数据集。\n\n让我们对 nfl_data\
  \ 表进行进一步分析，其中我们希望从 stat1_val 列中运行复杂的值：\n\n```sql\nselect case when regexp_like(stat1_val,\
  \ '^A-?\\d+$') then 'valid'\n    else stat1_val end as column_spread,count(*)\n\
  from mysql_nfl_data\ngroup by case when regexp_like(stat1_val, '^A-?\\d+$') then\
  \ 'valid'\n    else stat1_val end\n```\n\n| # | column_spread | _col1 |\n|---|---|---|\n\
  | 1 | -- | 1218 |\n| 2 | valid | 1710 |\n\n图 9.25：使用 Amazon Athena 查询来识别数据集中有效的统计值\n\
  \n你可以验证并看到 stat1_val 列中约有 40% 的值未填充有效的统计值。\n\n> 注意：单个行或其列的大小不能超过 32 兆字节。例如，当 CSV\
  \ 或 JSON 文件中的一行包含 100 兆字节的单个列时，就会超出此限制。超出此限制还可能产生错误消息 Line too long in text file。\
  \ (https://docs.aws.amazon.com/athena/latest/ug/other-notable-limitations.html)\n\
  \n现在我们已经了解了不同的数据探索技术，让我们讨论何时使用前面提到的数据探索方法：\n\n- 如果文件大小较小且不需要从多个文件探索数据，请使用 S3 Select\
  \ 来探索数据集。这将支持你快速搜索数据集中不正确的值、缺失列等。\n- 如果文件大小很大并且你希望对数据进行更深入的分析（例如某列中空值的百分比），并且团队熟悉\
  \ Python 编程，请使用 Pandas 探索数据集。\n- 如果文件大小很大并且团队习惯于基于 SQL 的探索活动，则使用 Athena 以及 Glue\
  \ Catalog。awswrangler 有助于在写入文件时填充 Glue Catalog。对于来自其他数据源的文件，Glue Crawler 将帮助你推断模式，该模式可使用\
  \ Athena 进行查询。\n\n我们已经了解了数据探索的不同技术，现在可以探索数据整理管道的下一阶段——数据结构化。\n\n## 数据结构化\n\n现在我们需要进入将数据从原始格式重构为可用格式的部分。在我们的用例中，我们以\
  \ JSON 格式提取了数据，这对于我们使用的探索性分析来说是合适的。当我们进一步进入数据整理管道时，不同的文件格式和结构会更有效。\n\n### 不同文件格式及何时使用\n\
  \n数据管道中常用的文件格式有多种：\n\n- **可读文件格式**：CSV、JSON 和 **可扩展标记语言（XML）** 是一些可被人类用户读取的文件格式：\n\
  \  - CSV 文件主要用于数据提取阶段，当数据需要与分析师共享以便阅读和执行进一步操作时。优点是你不需要任何编程语言即可读取文件，并且可以在最常见的文本编辑器中打开。这些文件格式在数据分析社区中与\
  \ Excel 文件一起很受欢迎。它们可用于在 Excel 应用程序本身内执行快速透视和其他分析/可视化。然而，它们不支持数据类型或复杂数据格式（分层数据）的概念，并且可扩展性有限。\n\
  \  - XML 于 1990 年代创建，很快成为 W3C 用于共享分层和复杂数据类型的标准。这是第一个支持分层数据格式的流行格式，并被广泛用于各种系统之间的数据交换。XML\
  \ 文件在存储大小上很大，因为它们使用开放和关闭标签来表示数据，而不像 CSV 文件格式。\n  - JSON 文件格式主要被 Web 应用程序用于存储数据，并传递到下游数据管道用于数据分析。JSON\
  \ 文件比 XML 文件更受欢迎，因为它们比 XML 更容易阅读和理解。它们支持更复杂的数据格式，包括分层数据、对象和数组。它们还支持通过键值组合进行模式演进，这有助于我们理解存储的数据。我们可以选择性地跳过某些字段，如果它们不适用，而不像\
  \ CSV 文件那样具有刚性模式，这对前端应用程序有利。然而，与 CSV 文件相比，它们消耗更多大小和内存来处理。\n\n选择可读文件格式的主要原因是为了在用户希望下载文件并用于不同用例的场景，例如将用户列表共享给另一个团队以便进行电话跟进：\n\
  \n- 如果数据结构相对简单且没有分层字段，可以选择 CSV 文件格式，因为它易于阅读且轻量。CSV 文件与 Excel 结合将为轻量级数据分析提供良好的可视化。\n\
  - 如果数据具有更复杂的数据类型并且你需要存储不同的数据格式，请选择 JSON 文件格式。在前面的示例中，我们从 CSV 迁移到 JSON 文件格式，因为我们的数据中包含逗号，并且使用\
  \ pandas 库处理该数据带来了更多挑战。\n- **二进制文件格式**：Parquet、Avro 和 ORC 是一些常见的文件格式，它们不可读且在数据管道的分析阶段使用。这些文件格式以机器可读的二进制格式存储，可以拆分并存储在多个磁盘上，从而支持并行处理。这些文件格式在大数据处理领域被广泛使用。它们是自描述的，这意味着它们将模式和数据一起存储，因此处理系统可以轻松读取数据。\n\
  \n什么是行存储与列存储？Parquet 和 ORC 文件格式以记录级格式以列式格式存储数据。列式格式将来自同一列的数据一起存储在一个记录块中。这在分析系统中很有帮助，其中数据针对特定列进行聚合和可视化。将来自相邻列的数据一起存储有助于更快地读取数据，并跳过分析查询中未使用的其他列的读取。\n\
  \n例如，见下文：\n\n表 9.1：原始数据（记录块 – 3 条记录）\n\n| Name | stat1 | stat2 |\n|------|-------|-------|\n\
  | Test_user1 | 12 | 13 |\n| Test_user2 | 14 | 15 |\n| Test_user3 | 16 | 17 |\n\n\
  以下是记录级存储：\n\n表 9.2：表的记录级存储\n\n| Test_user1 | 12 | 13 | Test_user2 | 14 | 15 | Test_user3\
  \ | 16 | 17 |\n\n以下是列式存储：\n\n表 9.3：表的列级存储\n\n| Test_user1 | Test_user2 | Test_user3\
  \ | 12 | 14 | 16 | 13 | 15 | 17 |\n\n前面的表格仅用于说明和理解目的，实际存储将与数据块一起存储额外信息，以及压缩。\n\n\
  ### 何时选择文件格式\n\nParquet 文件是最常用的，如果你不确定数据存储格式的选择，但你知道数据将用于分析用例，你可以从它们开始。如果需要实时流式处理并且模式演进是主要关注点，并且数据将用于探索性目的，你可以选择使用\
  \ Avro 文件格式。\n\n### 使用 Pandas 重构数据\n\n我们将继续以票务数据库中的 seat 表为例。表的结构如下所示粘贴：\n\n![](img/e28602b44ec813a47df57c96b204412c_314_0.png)\n\
