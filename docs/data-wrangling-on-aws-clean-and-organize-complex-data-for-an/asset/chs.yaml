  __title__: str = \"awswrangler\"\n__description__: str = \"Pandas on AWS. Updated\
  \ for custom installation.\"\n__version__: str = \"2.17.0\"\n__license__: str =\
  \ \"Apache License 2.0\"\n__message__: str = \"This was changed as a part of Learning\
  \ exercise.\"\n```\n\n图 3.7：awswrangler metadata.py 文件\n\n- **3. 从你在本地机器或 EC2 实例上修改的自定义代码安装\
  \ `awswrangler`：**\n  - **I. 导航到顶层文件夹，那里有 `awswrangler` 代码。**\n  - **II. 执行 `pip3\
  \ install .` 命令**，如下所示。这将在你的机器上安装 `awswrangler`，使用包含你自定义更改的本地代码库。\n\n```bash\n(awspanandas)$\
  \ cd aws-sdk-pandas\n(awspanandas)$ ls\nCODE_OF_CONDUCT.md             awswrangler\
  \              test_infra\nCONTRIBUTING.md                building             \
