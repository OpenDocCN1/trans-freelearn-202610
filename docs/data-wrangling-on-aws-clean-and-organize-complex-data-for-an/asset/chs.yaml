  \ 4**：通过电子邮件发送合并后的结果。\n\n**步骤 4a**：在新标签页中导航至 SNS 控制台，创建一个**标准**类型的 SNS 主题。主题创建后，点击该主题，并从该主题创建订阅。选择**电子邮件**作为协议，并在**端点**字段中输入您的电子邮件地址（或组）。确保点击确认订阅电子邮件。\n\
