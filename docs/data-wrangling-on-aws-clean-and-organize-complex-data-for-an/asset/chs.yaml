- "# 开始数据整理\n\n在本書的引言部分，我们列出了组织如何使用数据为客户创造价值的用例。除此之外，组织还会收集大量其他数据，以便了解客户的财务状况，这有助于他们与利益相关者分享，包括用于安全、系统健康检查的日志数据，以及用于客户\
  \ 360 等用例的客户数据。\n\n我们讨论了所有这些用例，以及如何从不同的数据源收集数据来解决它们。然而，从收集数据到解决这些业务用例，一个非常重要的步骤是清理数据。这就是数据整理发挥作用的地方。\n\
  \n在本章中，我们将学习数据整理的基礎并涵盖以下主题：\n\n- 介绍数据整理\n- 数据整理涉及的步骤\n- 数据整理的最佳实践\n- **亚马逊网络服务 (AWS)**\
  \ 中用于执行数据整理的可用选项\n\n## 介绍数据整理\n\n为了使组织能够以数据驱动的方式为客户创造价值或做出更明智的业务决策，他们需要从不同的数据源收集大量数据，例如点击流、日志数据、交易系统和平文件，并将它们存储在不同的数据存储中，例如数据湖、数据库和数据仓库作为\
  \ **原始数据**。一旦数据存储在不同的数据存储中，就需要对其进行清理、转换、组织并从不同的数据源进行连接，以为下游应用程序提供更有意义的信息，例如机器学习模型提供产品推荐或查找交通状况。或者，它可以被业务或数据分析使用，以提取有意义的业务信息：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_22_0.png)\n\n图 1.1：数据管道\n\n## 数据分析的 80-20\
  \ 法则\n\n当组织从不同的数据源收集数据时，最初并无多大用处。据估计，数据科学家花费约 80% 的时间来清理数据。这意味着他们只有 20% 的时间用于分析和从数据科学流程中获得洞察：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_22_1.png)\n\n图 1.2：数据科学家的任务分配\n\n现在我们了解了数据整理的基本概念，我们将学习它为何必不可少，以及它带来的各种好处。\n\
  \n## 数据整理的优势\n\n如果我们回到石油的类比，最初提取时它是原油形式，并无多大用处。为了使其有用，它必须经过炼油厂，在那里原油被放入蒸馏装置。在此蒸馏过程中，液体和蒸汽根据沸点分离成称为馏分的石油成分。重馏分在底部，而轻馏分在顶部，如下所示：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_23_0.png)\n\n图 1.3：原油加工\n\n下图展示了石油加工与数据整理流程之间的相关性：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_23_1.png)\n\n图 1.4：数据整理流程\n\n数据整理带来诸多优势：\n\
  \n- **增强数据质量：** 数据整理有助于提高数据的整体质量。它涉及识别和处理缺失值、异常值、不一致和错误。通过解决这些问题，数据整理可确保用于分析的数据准确可靠，从而产生更稳健、更值得信赖的结果。\n\
  \n- **提高数据一致性：** 原始数据通常来自各种来源或以不同格式存在，导致命名约定、测量单位或数据结构不一致。数据整理允许您标准化并协调数据，确保数据集中的一致性。一致的数据使信息更容易集成和比较，促进有效的分析和解释。\n\
  \n- **提高数据完整性：** 不完整的数据在分析和建模过程中会带来挑战。数据整理方法允许您通过应用诸如插补等技术来处理缺失数据，其中缺失值基于现有信息进行估计或填充。通过适当处理缺失数据，数据整理有助于确保数据集更完整，减少潜在偏差并提高分析的准确性。\n\
  \n- **促进数据集成：** 组织的数据通常分散在多个系统和来源中，使集成成为一项复杂任务。数据整理有助于合并和集成来自各种来源的数据，使分析人员能够使用统一的数据集。这种集成提供了数据的整体视图，使全面分析和洞察成为可能，而这些在处理碎片化数据时可能无法实现。\n\
  \n- **简化数据转换：** 数据整理提供工具和技术将原始数据转换为适合分析的格式。这种转换包括数据规范化、聚合、过滤和重新格式化等任务。通过简化这些流程，数据整理简化了数据准备阶段，为分析人员节省时间和精力，使他们能够更专注于实际分析和结果解释。\n\
  \n- **实现有效的特征工程：** 特征工程涉及创建新的派生变量或转换现有变量以提高机器学习模型的性能。数据整理为特征工程奠定了基础，通过以允许有意义转换的方式准备数据。通过执行诸如缩放、对类别变量进行编码或创建交互项等任务，数据整理有助于导出信息丰富的特征，增强模型的预测能力。\n\
  \n- **支持数据探索和可视化：** 数据整理通常涉及探索性数据分析 (EDA)，分析人员在正式建模之前获得数据见解并了解数据模式。通过清理和准备数据，数据整理能够进行有效的数据探索，帮助分析人员发现关系、识别趋势并使用图表、图形或其他视觉表示来可视化数据。这些探索步骤对于形成假设、做出数据驱动的决策和有效传达见解至关重要。\n\
  \n\n\n\n\n现在我们已经了解了数据整理（data wrangling）的优势，让我们来了解数据整理过程中涉及的步骤。\n\n## 数据整理涉及的步骤\n\
  \n与原油类似，原始数据必须经过多个数据整理步骤才能变得有意义。在本节中，我们将学习数据整理涉及的六步流程：\n\n- 1. 数据发现\n- 2. 数据结构化\n\
  - 3. 数据清洗\n- 4. 数据丰富\n- 5. 数据验证\n- 6. 数据发布\n\n在开始之前，重要的是要理解这些活动可能不需要按顺序执行，或者在某些情况下，你可能会跳过其中任何一步。\n\
  \n另外，请记住这些步骤是迭代的，并且因不同角色而异，例如数据分析师、数据科学家和数据工程师。\n\n举例来说，数据工程师的数据发现可能与数据分析师或数据科学家对数据发现的理解不同：\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_25_0.png)\n\n让我们开始详细学习这些步骤。\n\n数据整理过程的第一步是数据发现。这是数据整理中最重要的步骤之一。在数据发现中，我们熟悉我们拥有的原始数据的种类，我们希望用该数据解决什么用例，原始数据之间存在什么关系，数据格式会是什么样的，例如\
  \ CSV 或 Parquet，存储、转换和查询此数据的可用工具有哪些，以及我们希望如何组织此数据，例如按文件夹结构、文件大小、分区等，以便于访问。\n\n让我们通过一个例子来理解这一点。\n\
  \n在这个例子中，我们将尝试了解数据发现如何根据角色而变化。假设我们有两位同事，James 和 Jean。James 是数据工程师，而 Jean 是数据分析师，他们都在一家汽车销售公司工作。\n\
  \nJean 是组织的新人，她需要分析南加州的汽车销售数据。她已联系 James，请他从生产系统中的销售表中提供数据。\n\n以下是 Jane（数据分析师）的数据发现过程：\n\
  \n- 1. Jane 必须确定她需要生成销售报告的数据（例如，销售交易数据、车辆详细信息数据、客户数据等）。\n- 2. Jane 必须找到销售数据存储的位置（数据库、文件共享、CRM\
  \ 等）。\n- 3. Jane 必须确定她需要多少数据（过去 12 个月、过去一个月等）。\n- 4. Jane 必须确定她将使用什么工具（Amazon QuickSight、Power\
  \ BI 等）。\n- 5. Jane 必须确定她需要数据以何种格式，以便与她拥有的工具兼容。\n- 6. Jane 必须确定她希望将此数据存储在哪里——在数据湖（Amazon\
  \ S3）、她的桌面、文件共享、沙箱环境等。\n\n以下是 James（数据工程师）的数据发现过程：\n\n- 1. 哪个系统请求数据？例如，Amazon RDS、Salesforce\
  \ CRM、生产 SFTP 位置等。\n- 2. 数据将如何提取？例如，使用 Amazon DMS 或 AWS Glue 等服务或编写脚本。\n- 3. 时间表会是什么样？每天、每周或每月？\n\
  - 4. 文件格式会是什么样？例如，CSV、Parquet、orc 等。\n- 5. 数据将如何存储在提供的存储中？\n\n## 数据结构化\n\n为了支持现有和未来的业务用例更好地为客户服务，组织必须从不同的数据源以不同的形式收集前所未有的大量数据。在现代数据架构中，大多数情况下数据存储在数据湖中，因为数据湖允许你存储各种各样的数据文件，无论是结构化数据、非结构化数据、图像、音频、视频或其他，其原始形式形状和大小各不相同。当数据处于原始形式时，它缺乏明确的结构，这是将其存储在数据库或数据仓库中或用于构建分析和机器学习模型所必需的。在这一点上，它尚未针对成本和性能进行优化。\n\
  \n此外，当你处理流数据（如点击流和日志分析）时，并非所有数据字段（列）都用于分析。\n\n在数据整理的这个阶段，我们通过执行分区和转换文件类型（例如，将 CSV\
  \ 转换为 Parquet）来尝试优化原始数据集以获得成本和性能优势。\n\n再次，让我们考虑我们的朋友 James 和 Jean 来理解这一点。\n\n对于\
  \ Jean，数据分析师而言，数据结构化意味着她希望直接查询或将数据存储在 BI 工具的内存存储中，在 Amazon QuickSight 的情况下称为 SPICE\
  \ 层，可提供更快的数据访问。\n\n对于 James，数据工程师而言，当他从生产系统提取数据并希望将其存储在 Amazon S3 等数据湖中时，他必须考虑文件格式会是什么样。他可以按地理区域（如县、州或地区）或按日期进行分区——例如，year=YYYY、month=MM\
  \ 和 day=DD。\n\n## 数据清洗\n\n数据整理过程的下一步是数据清洗。前两个步骤让我们了解数据看起来如何以及如何存储。在数据清洗步骤中，我们开始处理原始数据，使其变得有意义，以便我们可以定义未来的用例。\n\
  \n在数据清洗步骤中，我们通过以下方式使数据变得有意义：\n\n- 删除不需要的列、重复值并填充空值列以提高数据的就绪度\n- 执行数据验证，例如识别必填列（如名字、姓氏、SSN、电话号码等）的缺失值\n\
  - 验证或修复数据类型以更好地优化存储和性能\n- 识别并修复异常值\n- 删除垃圾数据或不需要的值，例如特殊字符\n\nJames 和 Jane 都可以执行类似的数据清洗任务；然而，其规模可能不同。对于\
  \ James，这些任务必须针对整个数据集执行。对于 Jane，她可能只需要对来自南加州的数据执行，并且粒度也可能不同。对于 James，也许仅限于南加州、北加州等地区，而对于\
  \ Jean，可能是城市级别甚至邮政编码级别。\n\n## 数据丰富\n\n直到数据清洗步骤，我们主要是在单个数据源上工作，并使其对未来使用变得有意义。然而，在现实世界中，大多数情况下，数据是分散的并存储在多个不同的数据存储中，为了支持构建个性化或推荐解决方案或构建客户\
  \ 360 或日志取证等用例，我们需要将来自不同数据存储的数据连接起来。\n\n例如，要构建客户 360 解决方案，你需要来自 **客户关系管理（CRM）**\
  \ 系统、点击流日志、关系数据库等的数据。\n\n因此，在数据丰富步骤中，我们构建流程，将原始数据与从不同来源获得的相关数据进行增强。\n\n## 数据验证\n\
  \n计算机科学中有一个非常有趣的术语，称为 **垃圾进，垃圾出（GIGO）**。GIGO 的概念是，有缺陷或有问题的（垃圾）输入数据会产生有缺陷的输出。\n\n\
  换句话说，输出的质量取决于输入的质量。因此，如果我们提供不良数据作为输入，我们将得到不准确的结果。\n\n在数据验证步骤中，我们通过执行各种数据质量检查来解决这个问题：\n\
  \n- 业务验证数据准确性\n- 验证数据安全\n- 验证整个数据集中的结果一致性\n- 通过验证以下数据质量检查来验证数据质量：\n  - 记录数\n  -\
  \ 重复值\n  - 缺失值\n  - 异常值\n  - 不同的值\n  - 唯一值\n  - 相关性\n\n\n\n\n数据清洗和数据验证之间有很多重叠之处，是的，这两个过程之间有很多相似之处。然而，数据验证是在结果数据集上进行的，而数据清洗主要是在原始数据集上进行的。\n\
  \n## 数据发布\n\n完成所有数据整理步骤后，数据就可以用于分析，从而解决业务问题。\n\n因此，最后一步是以所需的访问权限和许可将数据发布给最终用户。\n\
  \n在这一步中，我们主要关注数据如何暴露给最终用户，以及最终数据存储在何处——即关系数据库、数据仓库、数据湖中的精选区或用户区，或通过**安全文件传输协议（SFTP）**。\n\
  \n数据存储的选择取决于最终用户希望通过哪种工具访问数据。例如，如果最终用户希望通过 Amazon QuickSight、Power BI、Informatica\
  \ 等 BI 工具访问数据，那么关系型数据存储将是理想的选择。如果是数据科学家访问，理想情况下应存储在对象存储中。\n\n我们将在本书后面了解可用于存储原始数据和整理后数据的不同类型的数据存储。\n\
  \n在本节中，我们通过朋友 James 和 Jean 了解了数据整理过程的各个步骤，以及这些步骤如何可能或可能不会因角色而异。现在，让我们了解数据整理的最佳实践。\n\
  \n# 数据整理的最佳实践\n\n执行数据整理有很多方法和工具，具体取决于数据整理的方式和人员。例如，如果你正在处理实时用例，如提供产品推荐或欺诈检测，那么与构建**商业智能（BI）**仪表板以显示销售数据相比，你选择的数据整理工具和流程会有很大不同。\n\
  \n无论你要解决哪种类型的用例，每种情况都可以应用一些标准的最佳实践，这些实践将帮助数据整理者更轻松地完成工作。\n\n## 识别业务用例\n\n建议在编写任何代码之前，先决定要使用哪种服务或工具进行数据整理。识别业务用例非常重要，因为这将为数据整理过程奠定基础，并使识别你打算使用的服务变得更加容易。例如，如果你有一个业务用例，比如为小型组织分析\
  \ HR 数据，只需要对一个包含 10,000 条记录的小型数据集进行几列拼接、删除几列、删除重复项、删除 NULL 值等操作，并且只有少数用户会访问整理后的数据，那么你不需要投入大量资金去购买市场上花哨的数据整理工具——只需使用\
  \ Excel 工作表即可完成工作。\n\n然而，当你有一个业务用例，例如处理从不同合作伙伴处接收的索赔数据，需要处理 JSON 等半结构化文件或 XML 等非结构化数据集，仅提取少量文件数据（如索赔\
  \ ID 和客户信息），并且需要执行复杂的数据整理过程（如连接、使用正则表达式查找模式等），那么你应该考虑编写脚本或订阅任何企业级工具来完成工作。\n\n##\
  \ 识别数据源并获取正确的数据\n\n在识别业务用例之后，重要的是确定需要哪些数据源来解决它。识别数据源将帮助你选择需要哪些服务来获取数据、获取频率以及最终存储方式。例如，如果你要构建信用卡欺诈检测解决方案，就需要实时获取信用卡交易数据；甚至数据清洗和处理也应在实时进行。机器学习推理也需要在实时数据上运行。\n\
  \n类似地，如果你正在构建销售仪表板，可能需要从 Salesforce 等 CRM 系统或 Oracle、Microsoft SQL Server 等事务性数据存储中获取数据。\n\
  \n在识别了正确的数据源之后，重要的是从这些数据源中引入正确的数据，因为这将帮助你解决业务用例并使数据整理过程变得简单。\n\n## 识别你的受众\n\n在执行数据整理时，一个重要方面是识别你的受众。了解受众将帮助你确定他们希望消费哪种类型的数据。例如，与数据科学团队或业务高管相比，营销团队可能有不同的数据整理需求。\n\
  \n这也会让你了解你打算在哪里展示数据——例如，数据科学家团队可能需要 Amazon S3 等对象存储中的数据，业务分析师可能需要 CSV 等平面文件中的数据，BI\
  \ 开发人员可能需要事务性数据存储中的数据，而业务用户可能需要应用程序中的数据。\n\n至此，我们已经介绍了数据整理的最佳实践。接下来，我们将探讨 AWS 中可用于执行数据整理的不同选项。\n\
  \n# AWS 上可用于数据整理的选项\n\n根据客户需求、数据源和团队专业技能，AWS 提供了多种数据整理选项。在本节中，我们将介绍 AWS 可用的最常见选项。\n\
  \n## AWS Glue DataBrew\n\nAWS Glue DataBrew 于 2020 年发布，是一种可视化数据准备工具，可让你轻松清洗和规范化数据，以便为分析和机器学习做好准备。该服务提供的可视化\
  \ UI 使没有编码或脚本经验的数据分析师也能完成数据整理的各个方面。它附带了一组丰富的常见预构建数据转换操作，可以简化这些数据整理活动。与任何软件即服务（SaaS）(https://en.wikipedia.org/wiki/Software_as_a_service)\
  \ 类似，客户无需预置任何服务器即可开始使用 Web UI，并且只需为使用的资源付费。\n\n## SageMaker Data Wrangler\n\n与 AWS\
  \ Glue DataBrew 类似，AWS 还提供了 SageMaker Data Wrangler，这是一种基于 Web UI 的数据整理服务，更面向数据科学家。如果主要用例是构建机器学习管道，则应优先选择\
  \ SageMaker Data Wrangler。它直接与 SageMaker Studio 集成，使用 SageMaker Data Wrangler 准备的数据可以输入数据管道，以构建、训练和部署机器学习模型。它带有预配置的数据转换，可使用均值或中位数填补缺失数据、独热编码，以及为机器学习准备数据所需的时间序列专用转换器。\n\
  \n## AWS SDK for pandas\n\n对于拥有具备编码和脚本经验的数据集成团队的客户来说，AWS SDK for pandas (https://github.com/aws/aws-sdk-pandas)\
  \ 是一个很好的选择。它构建在其他开源项目之上，提供了抽象函数来执行典型的数据整理任务，例如从各种数据库、数据仓库和 Amazon S3 等对象数据存储加载/卸载数据。AWS\
  \ SDK for pandas 简化了与常见 AWS 服务的集成，如 Athena、Glue、Redshift、Timestream、OpenSearch、Neptune、DynamoDB\
  \ 和 S3。它还支持 MySQL 和 SQL Server 等常见数据库。\n\n## 总结\n\n在本章中，我们学习了数据整理的基础知识、其重要性、数据整理的步骤和最佳实践，以及数据整理步骤如何因角色而异。我们还讨论了\
  \ AWS 中可用的不同数据整理选项。\n\n在接下来的章节中，我们将深入探讨每一个选项，并学习如何使用这些服务来执行数据整理。\n\n\n"
- "## 第 2 部分：\n## 使用 AWS 工具进行数据整理\n\n在本节中，我们将探讨三种强大的 AWS 工具，旨在简化数据整理和准备工作。首先，我们将深入研究\
  \ AWS Glue DataBrew，学习如何清洗、转换和丰富数据，以确保高质量且可用的数据集。随后，我们将揭示 AWS SDK for pandas 的多功能性，全面了解在\
  \ AWS 平台上进行高效数据操作和准备的方法。最后，我们将探索 Amazon SageMaker Data Wrangler，赋予您技能，以便无缝地对数据进行预处理和准备，用于具有影响力的机器学习项目。\n\
  \n本部分包含以下章节：\n- *第 2 章，AWS Glue DataBrew 简介*\n- *第 3 章，介绍 AWS SDK for pandas*\n\
  - *第 4 章，SageMaker Data Wrangler 简介*\n\n## AWS Glue\n## DataBrew 简介\n\n前一章讨论了组织如何向现代数据架构转型。现代数据架构的一个关键方面是让组织中的每个个体都能访问数据。这促进了数据驱动的决策制定，从而增强了用户能力，提高了生产力，并最终带来更高的利润以及更大的客户和员工满意度。\n\
  \n本章专注于 Amazon Web Services (AWS) Glue DataBrew 及其在数据整理中的应用。将涵盖以下主题：\n- 使用 AWS Glue\
  \ DataBrew 的优势\n- 开始使用 AWS Glue DataBrew\n- 使用 AWS Glue DataBrew 进行操作\n\n### 为什么选择\
  \ AWS Glue DataBrew？\n\n拥有正确的工具是实现组织数据驱动的关键因素，而 AWS Glue DataBrew 就是这样的工具之一。它是 AWS\
  \ Glue 系列的一部分，该系列在 re:Invent 2020 上推出。\n\n起初，当 AWS Glue 在 2017 年 8 月发布时，其目标用户是编写\
  \ Apache Spark 代码的开发者和数据工程师。目标是为他们提供一个平台，提供运行 Spark 代码所需的计算和存储资源。这使他们能够利用 Apache\
  \ Spark 的速度和易用性——其在大规模数据处理方面比 Hadoop 快 100 倍——同时也利用云的优势，如弹性、性能和经济性。\n\n随着公有云采用率的增加并日益成为主流，AWS\
  \ Glue 不断进化以满足企业不断变化的需求。最初，它主要被用作 ETL 工具，但随后扩展为一个更全面的数据治理工具。这一扩展包括添加诸如 Python 引擎、Glue\
  \ 数据目录、Glue 爬虫和 AWS Glue Studio 等功能。此外，用户角色已从不仅仅是开发者，演变为现在包括数据分析师、业务分析师、产品经理和数据科学家等业务人员。\n\
  \n尽管增加了新功能，包括用于创建 Glue ETL 作业的 UI 体验以及 2021 年引入的 Glue Studio，但对易用性的更高要求一直是一个共同的需求。虽然这些功能主要服务于使用\
  \ Apache Spark 执行 ETL，但它们仍需一定程度的编码或脚本知识。\n\n业务用户需要一种工具，能够消除数据生产者与数据消费者、开发者与业务用户之间的延迟。他们寻求一种易于使用的工具，如\
  \ Microsoft Excel，无需学习 Scala、PySpark、Python 或 SQL 等编程语言或脚本语言。通常，在企业中，业务用户严重依赖 BI\
  \ 开发者基于不同的 KPI 构建仪表板，以便他们做出关键业务决策并识别任何异常。然而，对 KPI、数据源甚至数据进行微小更改可能需要一周或更长时间。\n\n\
  除了易用性之外，客户还需要一个可扩展的解决方案。虽然 Microsoft Excel 是其中最好的数据整理工具之一，但它缺乏可扩展性。虽然它非常适合处理拥有数千条记录的小型数据集，但当数据增长到数万或数百万条记录时，它表现不佳。\n\
  \n根据与各种规模组织的互动，从寻求建立数据驱动文化或启用数据即服务（DaaS）的初创公司到大型企业，最大的挑战是如何提供安全且高质量的数据访问。客户希望有一种工具，使他们能够进行数据整理而无需将数据下载到本地机器，这会给数据安全带来重大风险并可能导致数据质量问题，特别是在生命科学或政府和金融机构等垂直领域。虽然\
  \ AWS Glue 允许构建 ETL 管道，但进行数据分析需要将从数据湖（Amazon S3）或数据仓库（如 Amazon Redshift 或 Snowflake）中的数据下载到本地桌面，从而带来数据安全和质量风险，或者使用第三方工具，这也会带来数据安全风险，因为数据必须通过互联网从\
  \ AWS 云移动到第三方工具，从而增加了成本。\n\n例如，许多数据隐私法律，如欧盟《通用数据保护条例》(GDPR)、《加州消费者隐私法》(CCPA) 和 1996\
  \ 年的《健康保险流通与责任法案》(HIPAA)，现在限制了公司对客户数据的使用、存储位置以及可以使用哪些工具。例如，携带包含不应超越国界数据的笔记本电脑或使用不符合\
  \ HIPAA 标准的工具可能会给组织带来法律和财务挑战。\n\n处理大数据的挑战之一是保持数据质量。例如，像 Excel 这样的工具可能无法提供与 Spark\
  \ 相同级别的精度，尤其是在云中处理大型数据集时。此外，市场上很少有基于 Apache Spark 等开源技术构建的易用型 UI 工具。\n\n这就是 AWS\
  \ Glue DataBrew 发挥作用的地方。它是 AWS 提供的一款无代码/低代码、无服务器视觉数据准备工具，使数据专业人员（如数据分析师、业务分析师、BI\
  \ 开发人员和数据科学家）无需编写任何代码即可进行数据整理。它提供 300 多种即用型转换来自动化数据整理过程，包括数据发现、结构化、质量检查、清洗、验证、异常检测和\
  \ personally identifiable information (PII) 识别。这将用于分析和机器学习的准备数据的时间最多缩短 80%。\n\n\
  AWS Glue DataBrew 的一个关键特性是其无服务器性质，通过消除资源供应、扩展、高可用性和服务器维护等基础设施管理任务，提供敏捷性。AWS Glue\
  \ DataBrew 构建在开源 Apache Spark 之上，提供 Spark 的规模和速度，且无许可费用。它特别适用于数据存储在 Amazon S3 等数据湖中的大数据项目。\n\
  \n除了无服务器之外，AWS Glue DataBrew 还提供高级数据配置文件、视觉数据血缘、与数据管道的集成能力，以及为高级机器学习用例准备数据的能力。\n\
  \n下图从高层次展示了 DataBrew 的工作原理。\n\n![](img/e28602b44ec813a47df57c96b204412c_37_0.png)\n\
  \n图 2.1：DataBrew 工作原理的高层视图\n\n为了为在 AWS Glue DataBrew 上构建数据整理解决方案奠定基础，让我们首先深入研究其基本构建块。\n\
  \n### AWS Glue DataBrew 的基本构建块\n\n以下是 DataBrew 的核心构建块：\n- **项目：** 在 DataBrew 中，项目包含了您视觉探索、理解、合并、清洗和标准化数据所需的所有组件。创建一个项目会建立一个工作区，存储关于您的数据、应用于它的转换以及转换它的计划作业的信息。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_38_0.png)\n\n图 2.2：AWS Glue DataBrew\
  \ 控制台中的项目列表\n- **DataBrew 数据集：** 使用 DataBrew 数据集，您可以从各种数据源创建新数据集。这些源包括从本地机器上传的文件、存储在\
  \ Amazon S3 数据湖中的数据、AWS Glue 爬虫爬取的 AWS Glue 数据目录中可用的元数据，以及通过 Amazon AppFlow 从不同的\
  \ SaaS 数据源（如 Datadog、Salesforce 和 Marketo）获取的数据。此外，AWS Data Exchange 提供了广泛的第三方数据产品的访问权限，并使其可用于\
  \ DataBrew。\n\n![](img/e28602b44ec813a47df57c96b204412c_38_1.png)\n\n图 2.3：AWS Glue\
  \ DataBrew 控制台中的数据集列表\n\n\n\n![](img/e28602b44ec813a47df57c96b204412c_39_0.png)\n\
  \n图 2.4：AWS Glue DataBrew 控制台中的数据源列表\n\n-   **配方：** 在 AWS Glue DataBrew 中，配方是您在处理项目时创建或修改的一组转换步骤。您可以将配方发布为独立实体。已发布的配方仅包含转换步骤，不引用原始数据。您可以通过下载为\
  \ YAML 或 JSON 格式来共享已发布的配方。配方可以有多个已发布的版本，您可以从项目中发布这些版本。随着您逐步处理多个草稿，您也可以拥有同一个配方的多个工作副本。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_39_1.png)\n\n图 2.5：AWS Glue DataBrew\
  \ 控制台中的配方列表\n\n-   **作业：** 在 AWS Glue DataBrew 中，作业是一组可对数据集或项目执行的指令。有两种类型的作业可用：\n\
  \    -   **配方作业：** 配方作业对数据集或项目运行配方中的所有转换，并生成不同文件格式的输出，该输出可保存到相同或外部 AWS 账户中的 Amazon\
  \ S3 存储桶。\n    -   **配置文件作业：** 配置文件作业检查数据集，以提供相关性、值分布、列统计等信息。\n\n对于配方作业，您可以定义作业输出设置，例如文件类型和输出对象的\
  \ Amazon S3 路径。您还可以压缩输出。此外，您可以将计划与作业关联，并选择作业的运行频率和时间。AWS Glue DataBrew 提供多种调度选项，包括\
  \ `cron` 设置。\n\n![](img/e28602b44ec813a47df57c96b204412c_40_0.png)\n\n图 2.6：AWS\
  \ Glue DataBrew 控制台中的作业列表\n\n-   **DataBrew 数据血缘：** 数据血缘允许您轻松跟踪和可视化数据集的来源、事件和目标，清晰地了解数据所经历的路径。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_40_1.png)\n\n图 2.7：AWS Glue DataBrew\
  \ 控制台中的数据血缘可视化\n\n-   **数据剖析：** 数据剖析是 Glue DataBrew 提供的最重要功能之一。其核心是，AWS Glue DataBrew\
  \ 使用户能够轻松地为其数据集创建全面的数据配置文件。通过运行 AWS Glue DataBrew 数据配置文件作业，用户可以获得有关当前数据形态的宝贵信息。这包括对内容上下文、数据的底层结构以及各种数据元素之间复杂关系的深入理解。\n\
  \n通过先进的算法和智能分析，AWS Glue DataBrew 配置文件会细致地检查每个数据点，提供描述性统计、数据分布洞察和数据质量评估。它们帮助数据专业人员识别潜在的异常、缺失值和不一致之处，使他们能够做出明智的决策并采取必要措施提高数据质量。\n\
  \nAWS Glue DataBrew 配置文件还提供可视化和直观的仪表板，以易于理解的格式呈现数据配置文件。这使用户能够更有效地掌握复杂模式、发现趋势并从数据集中提取有意义的见解。\n\
  \n凭借其用户友好的界面和强大的功能，AWS Glue DataBrew 配置文件使数据专业人员能够释放数据集的隐藏潜力。通过利用从数据配置文件中获得的见解，他们可以做出明智的决策，提高数据质量，并为组织带来有影响力的成果。\n\
  \n根据《哈佛商业评论》的一份报告，只有 3% 的公司数据符合基本质量标准，平均而言，47% 的新创建数据记录至少有一个严重错误（即影响其工作的错误）。\n\n\
  ![](img/e28602b44ec813a47df57c96b204412c_41_0.png)\n\n既然我们已经了解了 AWS Glue DataBrew\
  \ 的基础知识，接下来让我们开始使用它来完成各种任务。\n\n# AWS Glue DataBrew 入门\n\n了解任何服务或工具最有效的方法之一是通过动手实践或从示例中学习。我们将采用同样的方法。在本指南及后续教程中，我们将使用\
  \ AWS 控制台来学习 AWS Glue DataBrew 作为数据整理工具。使用 AWS Glue DataBrew 的首要条件是数据。我们之前讨论过数据是新石油，但当数据处于原始形态时，几乎没有价值。在继续之前，了解任何服务的定价模式至关重要。\n\
  \n# 了解 AWS Glue DataBrew 的定价\n\n值得注意的是，AWS 服务的定价因区域而异，并可能发生变化。在本节中，我们将讨论 us-east-1\
  \ 区域的定价。AWS Glue DataBrew 有各种组件，例如项目、数据集、作业和配方。\n\n让我们从数据集开始。当您从不同的数据存储（包括 S3、AWS\
  \ Glue Data Catalog、Redshift、Snowflake、Amazon AppFlow 和 AWS Data Exchange）引入数据时，就会创建数据集。客户使用\
  \ AWS Glue DataBrew 连接器（如 JDBC 驱动程序）无需付费（JDBC 驱动程序是一种软件组件，允许 Java 应用程序连接并与特定类型的数据库交互）。但是，客户需要承担\
  \ Glue Data Catalog 的费用，该费用非常低。例如，您可以免费存储多达一百万个对象。如果您存储超过一百万个对象，则每月为超出的一百万个对象每 100,000\
  \ 个支付 $1.00。AWS Glue Data Catalog 中的对象是表、表版本、分区或数据库。\n\n每月对 AWS Glue Data Catalog\
  \ 的前一百万次访问请求免费。如果您在一个月内超过一百万次请求，则超出第一个百万的每百万次请求将收取 $1.00。常见请求包括 *CreateTable*、*CreatePartition*、*GetTable*\
  \ 和 *GetPartitions*。\n\n接下来是项目，这里开始变得有趣。Glue DataBrew 的费用主要来自 DataBrew 交互式会话。当 DataBrew\
  \ 项目中的数据加载后，就会启动一个 DataBrew 交互式会话。客户按使用的会话总数计费，以 30 分钟为增量计算。\n\n当您与 Glue DataBrew\
  \ 项目交互时，例如通过 UI 或 DataBrew API/CLI/SDK 添加配方或过滤数据，您将启动一个会话。即使您不做任何操作，会话也会保持活动状态，但它会在当前\
  \ 30 分钟周期结束时自动关闭。如果您要休息或不处理它，关闭会话很重要。会话费用为 $1.00。\n\n例如，假设您在上午 09:00 启动一个交互式会话并工作到上午\
  \ 09:20，然后休息，并在上午 09:30 启动另一个会话，接下来一个小时努力工作，完成所有工作，然后再次休息。第二天查看 AWS 账单时，您会看到账单上增加了\
  \ $3.00，尽管第一个会话只有 20 分钟。\n\n在另一种情况下，假设您打开一个项目 2 分钟并关闭它，然后在 5 分钟后再次打开同一个项目并工作 10\
  \ 分钟，关闭它，并在 30 分钟内重复相同活动五次；这只会花费您 $1。这是因为每次打开会话时，AWS Glue DataBrew 都会分配资源以提供更快的访问，并减少为每个项目分配资源的延迟。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_43_0.png)\n\n图 2.9：Glue DataBrew 交互式会话正在启动\n\
  \nAWS Glue DataBrew 作业也在决定定价方面发挥作用。当您创建数据集时，您还没有可供查看的数据配置文件概览。要生成数据配置文件概览，您需要运行一个数据配置文件，这会为您创建一个\
  \ AWS Glue DataBrew 作业。在接下来的章节中，我们将了解在运行作业之前可用于配置作业的各种选项。但出于定价目的，需要注意的一个重要配置选项是您为作业分配了多少节点。此选项可以在**高级作业设置\
  \ - 可选**下找到。请注意，此选项之所以称为*可选*，是因为 AWS Glue DataBrew 默认配置为五个节点。\n\n![](img/e28602b44ec813a47df57c96b204412c_43_1.png)\n\
  \n图 2.10：创建数据集时的数据配置文件概览部分\n\n\n\n![](img/e28602b44ec813a47df57c96b204412c_44_0.png)\n\
  \n图2.11：具有默认配置的高级作业设置\n\n要确定AWS Glue DataBrew作业的成本，用于运行作业的节点数量是一个关键因素。每个节点包含四个vCPU和16\
  \ GB内存，按每个节点每小时0.48美元计费。但是，AWS Glue DataBrew作业按最少一分钟计费。为了说明，让我们考虑一个示例：一个作业运行20分钟，使用10个节点。成本计算方法如下：\n\
  \n```\n1 node/hour = $0.48\n```\n\n```\n10 nodes/hour = $0.48 x 10 = $4.80/hour\n\
  ```\n\n由于AWS Glue DataBrew作业按最少1分钟计费，我们可以将20分钟转换为1/3小时。因此，最终成本将是$4.80 x 1/3 = $1.60。当你针对样本数据集为项目构建好配方，并准备将同一配方应用于整个数据集时，可以使用该配方创建作业。现在我们已经介绍了AWS\
  \ Glue DataBrew的定价方面，接下来让我们使用Glue DataBrew执行一些数据整理任务。\n\n## 使用AWS Glue DataBrew进行数据整理\n\
  \n在本节中，我们将探讨如何将AWS Glue DataBrew用于各种数据整理任务，包括以下内容：\n\n- 数据发现\n- 数据结构化\n- 数据清洗\n\
  - 数据增强\n- 数据验证\n- 数据发布\n\n在开始之前，第一步是确定数据源，获取数据集，并使其可用于数据整理。\n\n### 识别数据集\n\n为了演示数据整理的步骤和任务，我们将使用通过互联网上提供的Random\
  \ HR Data Generator Excel宏生成的人力资源数据。我们将使用500万条记录的样本量，属性如下：\n\n```\nEmp ID,Name Prefix,First\
  \ Name,Middle Initial,Last Name,Gender,E Mail,Father's Name,Mother's Name,Mother's\
  \ Maiden Name,Date of Birth,Time of Birth,Age in Yrs.,Weight in Kgs.,Date of Joining,Quarter\
  \ of Joining,Half of Joining,Year of Joining,Month of Joining,Month Name of Joining,Short\
  \ Month,Day of Joining,DOW of Joining,Short DOW,Age in Company (Years),Salary,Last\
  \ % Hike,SSN,Phone No.,Place Name,County,City,State,Zip,Region,User Name,Password.\n\
  ```\n\n识别数据集后，下一步是从互联网下载。\n\n目前，AWS Glue DataBrew支持CSV、TSV、JSON、JSONL、ORC、Parquet和XLSX格式。\n\
  \n### 下载示例数据集\n\n我们将使用互联网上提供的Syntactic Human Resource数据集，可从https://eforexcel.com/wp/downloads-16-sample-csv-files-data-sets-for-testing/下载。\n\
  \n然而，在实际生产环境中，数据通常从各种来源提取，例如网络、SFTP、数据库和物联网传感器，并使用诸如AWS Glue（我们将在后续章节中介绍）之类的服务，将其摄取到数据湖（S3）或其他数据存储中，例如文件共享、数据库和数据仓库。\n\
  \n例如，以下架构演示了如何使用带有Python引擎的AWS Glue从FTP位置获取数据并将其存储在Amazon S3中。\n\n![](img/e28602b44ec813a47df57c96b204412c_46_0.png)\n\
  \n图2.12：从FTP位置获取数据的数据管道\n\n下载数据后，下一步是将数据集上传到Amazon S3。为此，请按照以下步骤操作：\n\n- 1. 前往AWS控制台。\n\
  - 2. 如果已有S3存储桶，请在存储桶列表中搜索它。否则，创建一个新存储桶。\n- 3. 单击“Upload”按钮。\n- 4. 单击“Add Files”，或直接从本地计算机拖放文件。\n\
  - 5. 单击“Upload”。\n\n你可能已经注意到，我的Amazon S3存储桶名称带有raw-前缀。此前缀用于区分数据湖中不同阶段的数据处理。在raw层，数据以其原始形式原样存储。这使我们能够拥有单一事实来源，并将数据用于未来的用例。我将在后续章节中介绍有关数据湖及其最佳实践的更多细节。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_47_0.png)\n\n图2.13：Amazon S3数据湖文件夹结构\n\
  \n将数据放置到Amazon S3存储桶的原始层后，下一步是创建AWS Glue数据集。在DataBrew中，数据集由关于数据所收集的元数据构成。数据可以直接连接，也可以导出到文件并从Amazon\
  \ S3或本地驱动器加载：\n\n要创建DataBrew数据集，请按照以下步骤操作：\n\n- 1. 前往AWS Glue DataBrew。\n- 2. 在左侧，单击“Datasets”，然后单击“Connect\
  \ new dataset”。\n\n3. 提供数据集名称（例如，raw-human-resource）并选择上传人力资源数据集的S3存储桶，如下图所示：\n\n\
  ![](img/e28602b44ec813a47df57c96b204412c_48_0.png)\n\n图2.14：在AWS Glue DataBrew控制台中将Amazon\
  \ S3作为数据源\n\n- 在**其他配置**下，选择**CSV**作为文件格式，选择**逗号 (,)**作为分隔符（因为这是CSV文件的默认值），并在**列标题值**下保持勾选**将首行视为标题**。\n\
  \nDataBrew有一个有趣的功能，可以在创建数据集之前预览数据，这有助于数据发现。单击**预览数据**以执行一些数据发现。\n\n### 图2.15：AWS\
  \ Glue DataBrew控制台中的预览数据选项\n\n“预览数据”部分允许用户查看数据及数据结构的样子。\n\n### 图2.16：AWS Glue DataBrew控制台中的数据集预览\n\
  \n审阅数据集后，单击**创建数据集**。\n\n![](img/e28602b44ec813a47df57c96b204412c_50_0.png)\n\n\
  图2.17：AWS Glue DataBrew控制台中的数据集\n\n数据集现在已就绪，可以进行数据发现了。\n\n### 数据发现 – 为数据集创建AWS Glue\
  \ DataBrew配置文件\n\n要为数据集创建AWS Glue DataBrew数据配置文件，请按照以下步骤操作：\n\n- 1. 选择一个作业名称，例如\
  \ `raw-human-resource-profile-job`。\n- 2. 为作业运行样本选择**完整数据集**。\n- 3. 选择要将配置文件输出以JSON格式存储的S3位置，该输出可用于自动化任务，例如数据质量检查和PII识别。\n\
  - 4. 其余选项保留默认值。\n- 5. 在**权限**下，选择**创建新的IAM角色**，并为角色提供名称，例如 `human-resource`。\n-\
  \ 6. 单击**创建并运行作业**。\n- 7. 等待生成数据配置文件。\n\n创建数据配置文件后，您可以在摘要部分查看它，其中提供有关数据集的有用信息，包括以下内容：\n\
  \n- 数据集的大小，作为良好的数据质量检查，确保摄取期间未发生数据丢失\n- 数据集的数据类型，包括整数、双精度和字符串列的数量\n- 任何重复行或缺失单元格，这有助于识别数据质量问题\n\
  \n在所提供的示例中，数据集有500万行，没有缺失单元格或重复行，表明数据质量很高。查看数据配置文件可以为比较源系统中的数据与目标系统中的数据提供参考基准。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_51_0.png)\n\n![](img/e28602b44ec813a47df57c96b204412c_51_1.png)\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_51_2.png)\n\n图2.18：AWS Glue控制台中的数据配置文件概览\n\
  \n### 相关性\n\n相关系数(r)衡量两个变量之间的关联程度，取值范围为-1.0到+1.0，其中0表示变量之间不存在关系。可以根据r的值进行如下解释：\n\
  \n- 恰好为-1：完美的负（下降）线性关系\n- -0.70：强负（下降）线性关系\n- -0.50：中等负（下坡）关系\n- -0.30：弱负（下坡）线性关系\n\
  - 0：无线性关系\n\n\n\n\n\n+0.30: 弱正相关（向上倾斜）线性关系\n\n+0.50: 中等正相关（向上倾斜）线性关系\n\n+0.70: 强正相关（向上倾斜）线性关系\n\
  \n恰好 +1：完美正相关（向上倾斜）线性关系\n\n在给定的相关系数图中，**_入职年份_** 和 **_公司年限_** 变量之间存在强关系，但方向相反。这意味着如果一个变量增加（例如，**_入职年份_**\
  \ 相对于 2022 年从 2018 年变为 2016 年），另一个变量就会减少（即 **_公司年限_** 也减少两年）。\n\n![](img/e28602b44ec813a47df57c96b204412c_52_0.png)\n\
  \n图 2.19：相关系数\n\n**_公司年限_**（以年为单位）与 **_年龄（岁）_** 之间的相关系数为 **+65**，表明这两个变量之间存在正相关。这意味着如果某人的年龄较大，他们很可能在公司工作的时间更长，因此是任职时间更长的员工。然而，需要注意的是，这种相关系数并不总是适用于所有情况，其他因素也可能影响员工的任期。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_52_1.png)\n\n图 2.20：相关系数\n\n## 值分布\n\n\
  数据集的值分布表明数据分布的程度如何，并且是衡量数据偏斜的良好指标。例如，如果我们考虑 Salary 列，它似乎分布均匀，这是一个数据集分布良好的积极指标。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_53_0.png)\n\n图 2.21：值分布\n\n## 列摘要\n\n\
  配置文件中列的摘要部分提供了有关其特征的宝贵信息，包括其分布、缺失值、唯一值、不同值、中位数、最小值、众数、异常值和偏度。了解这些数据值可以帮助进行特征工程。例如，偏度是一种查看数据是否倾斜的方法。它告诉我们数据与完全平衡的差异有多大。如果偏度为正，则意味着右侧数据更多，使该侧的尾部更长或更胖。如果偏度为负，则意味着左侧数据更多，使该侧的尾部更长或更胖。如果偏度为\
  \ 0，则意味着数据完全平衡。\n\n例如，检查 Ages in Yrs. 列的摘要可以让你很好地了解公司员工的年龄。员工的最低年龄约为 21 岁，最高年龄为\
  \ 60 岁，平均年龄为 40.50 岁。\n\n图 2.22：AWS Glue DataBrew 控制台中的数据概览\n\n## 数据清洗和丰富 – AWS\
  \ Glue DataBrew 转换\n\n要创建 DataBrew 项目，即数据探索、清洗和规范化信息的集合，请按照以下步骤操作：\n\n- 1. 转到 DataBrew\
  \ 控制台并选择 **Projects**。\n- 2. 单击 **Create project**。\n- 3. 为项目输入名称，例如 `basic-transform-human-resource-project`。\n\
  - 4. 保留默认的配方名称。\n- 5. 选择 **My datasets** 并选择上一节中创建的 `raw-human-resource` 数据集。\n\
  - 6. 保留默认的采样大小 **500**。\n- 7. 在 **Permissions** 下，选择在数据配置文件部分下创建的 IAM 角色作为角色名称。\n\
  - 8. 单击 **Create project**。\n\n要为项目构建配方，请在 AWS Glue DataBrew 交互式会话中打开项目并按照说明创建一组数据整理步骤或操作。\n\
  \n常见的数据整理任务之一是将多个列合并为一列，例如合并姓名或日期列。要在 AWS Glue DataBrew 中执行此任务，请使用 **MERGE** 转换，它允许您合并多个列并创建单个列。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_55_0.png)\n\n要执行此任务，请按照以下步骤操作：\n\n- 1.\
  \ 打开上一步中创建的 `basic-transform-human-resource-project` 项目。\n- 2. 在顶部菜单中单击 **MERGE**。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_56_0.png)\n\n图 2.24：MERGE 选项\n\n- 3.\
  \ 选择 Name Prefix、First Name、Middle Initial 和 Last Name 作为源列。\n- 4. 添加空格作为分隔符。\n\
  - 5. 提供新的列名，例如 Employee_Full_Name。\n\n![](img/e28602b44ec813a47df57c96b204412c_56_1.png)\n\
  \n图 2.25：合并列列表\n\n- 6. 单击 Apply。\n\n![](img/e28602b44ec813a47df57c96b204412c_59_0.png)\n\
  \n9. 重命名列。\n\n在数据集分析期间，发现某些列名，例如 **Phone No.**，以点结尾。为了解决此问题，应重命名该列。要更改列名，请选择该列并单击三个点，然后选择\
  \ **Rename** 选项。\n\n要更新列名，请选择一个新名称。例如，**Phone No.** 可以更改为 **Phone**。选择新名称后，单击 **Apply**。\n\
  \n图 2.29：AWS Glue DataBrew 控制台中重命名列\n\n图 2.30：AWS Glue DataBrew 控制台中重命名列选项\n\n10.\
  \ 隐藏敏感列。\n\nAWS Glue DataBrew 提供了一个非常有用的功能，即隐藏敏感列。当构建 Daas 等解决方案、实现自助服务或在内部或外部共享数据时，此功能特别有帮助。在所有此类情况下，隐藏敏感数据都是关键要求：\n\
  \n- I. 要隐藏敏感列，首先查看数据集并识别包含敏感信息的列，例如社会安全号码、电话号码、用户名和密码。识别后，您可以使用 AWS Glue DataBrew\
  \ 中的 SENSITIVE 图标来选择并隐藏这些列中的值。\n- II. 要执行数据隐藏，请选择 SENSITIVE 图标并选择 **Redact values**\
  \ 选项。然后，选择源列并将其他选项保持为默认值（即使用隐藏符号，#），然后单击 **Apply**。\n\n![](img/e28602b44ec813a47df57c96b204412c_61_0.png)\n\
  \n**图 2.31**：AWS Glue DataBrew 控制台中敏感列 Redact values 选项\n\n图 2.32：AWS Glue DataBrew\
  \ 控制台中敏感列 Redact values 选项\n\n应用配方后，您将能够看到哈希列。\n\n图 2.33：AWS Glue DataBrew 中敏感列的隐藏\n\
  \n11. 执行确定性加密。\n\n要执行确定性加密，请按照以下步骤操作：\n\n- I. 单击 **SENSITIVE** 图标并导航到 **Encryption**\
  \ 部分。\n- II. 选择 **Deterministic encryption**。\n\n![](img/e28602b44ec813a47df57c96b204412c_63_0.png)\n\
  \n图 2.34：AWS Glue DataBrew 控制台中敏感列 Deterministic encryption 选项\n\n- III. 选择要加密的列，例如\
  \ Employee_Full_Name、E Mail 和 Date of Birth。\n- IV. 选择 secret 选项并选择默认的 DataBrew\
  \ 密钥。\n- V. 单击 Apply，您将能够看到加密后的数据。\n\n![](img/e28602b44ec813a47df57c96b204412c_64_0.png)\n\
  \n12. 按性别分组。\n首先，按性别对数据进行分组。然后，我们可以分析工资在男性与女性之间的分布情况。\n\n![](img/e28602b44ec813a47df57c96b204412c_64_1.png)\n\
  \n## 13. 连接数据集。\n\n连接数据集涉及基于公共键组合两个或多个表。它是数据整理过程中的关键步骤，可实现数据丰富。\n\nAWS Glue DataBrew\
  \ 支持多种类型的连接，包括以下类型：\n\n- • 内连接：这是 Glue DataBrew 中的默认连接类型。它返回基于连接键在两个表中具有匹配值的记录。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_65_0.png)\n\n- • 左连接：它返回左表中所有记录以及基于连接键从右表中匹配的记录。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_65_1.png)\n\n- • 右连接：它返回右表中所有记录以及基于连接键从左表中匹配的记录。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_65_2.png)\n\n- • 外连接：它返回表 A 和表 B 的所有行，而不管连接条件如何。\n\
  \n![](img/e28602b44ec813a47df57c96b204412c_65_3.png)\n\n\n\n\n\n- **左排除连接**：这会返回表\
  \ A 的所有行，排除满足连接条件的行。\n\n![](img/e28602b44ec813a47df57c96b204412c_66_0.png)\n\n-\
  \ **右排除连接**：这会返回表 B 的所有行，排除满足连接条件的行。\n\n![](img/e28602b44ec813a47df57c96b204412c_66_1.png)\n\
  \n- **外排除连接**：这会返回表 A 和表 B 的所有行，排除满足连接条件的行。\n\n![](img/e28602b44ec813a47df57c96b204412c_66_2.png)\n\
  \n每种连接类型对结果数据集都有不同的影响。了解这些差异对于选择适合您数据分析需求的连接非常重要。\n\n要在 AWS Glue DataBrew 中执行连接，请按照以下步骤操作：\n\
  \n1. 打开您的项目并单击 JOIN 图标以访问连接选项。\n\n![](img/e28602b44ec813a47df57c96b204412c_66_3.png)\n\
  \n2. 选择您想要连接的数据集。如果您只有一个数据集，您可以通过将数据集与其自身连接来执行自连接（或自内连接）。\n\n3. 选择要连接的连接类型和列，然后单击\
  \ **Finish**。您的项目现在将拥有一个已连接的数据集。\n\n![](img/e28602b44ec813a47df57c96b204412c_67_0.png)\n\
  \n**Figure 2.45: Join option in AWS Glue DataBrew**\n\n现在您已经了解如何使用 AWS Glue DataBrew\
  \ 执行数据转换，您可以自行尝试其他转换。下一步是学习如何使用 AWS Glue DataBrew 执行数据质量检查。\n\n## 数据验证 – 使用 AWS\
  \ Glue DataBrew 执行数据质量检查\n\n本节将重点介绍如何使用 AWS Glue DataBrew 通过实际示例执行数据验证和质量检查。\n\n\
  在本第一个示例中，我们将学习如何使用 AWS Glue DataBrew 识别和纠正数据质量问题。但首先，让我们简要讨论数据质量问题以及为什么必须解决它们。正如我们在上一章中所讨论的，组织正在努力成为数据驱动的，对于此类组织而言，解决它们面临的任何数据质量挑战或拥有处理数据质量问题的必要工具和流程至关重要。\n\
  \n根据 KPMG 的一份报告，77% 的首席执行官担心其组织是否跟上新技术，并且数据和分析将在未来三年成为投资的重点领域。此外，84% 的首席执行官担心他们基于其关键业务决策的数据质量。数据质量差不仅仅是一个技术问题，因为它会对企业产生重大影响。根据\
  \ Gartner 在 2018 年的研究论文，组织认为数据质量差平均每年造成 1500 万美元的损失。\n\n流行的消费者工具 Zestimate，由人工智能驱动来估算房屋价值，由\
  \ Zillow 提供，是数据质量问题的典型例子。Zillow 采用了独特的算法，每周多次定期更新其房产价值数据库。这些算法考虑了来自公开可用数据和用户提交的数据得出的信息。Zillow\
  \ 声称其 Zestimate，即为在售和未在售房屋提供的估算房产价值，对于全国在售房屋的中位误差率为 1.9%，而未在售房屋的中位误差率为 6.9%。然而，需要注意的是，Zestimate\
  \ 的准确性在很大程度上依赖于基础数据的准确性。如果 Zillow 上房屋的关键细节，如卧室或浴室数量、平方英尺或地块大小记录不准确，将导致提供的 Zestimate\
  \ 出现显著偏差。这一问题最终导致 Zillow 以远高于售价的价格购买了许多房屋，因为 Zestimate 失败。因此，Zillow 决定关闭其房屋购买业务，导致数千人失业和数百万美元的损失。\n\
  \n在另一个例子中，数据质量问题导致一家知名信用历史提供商的实时电子商务网站崩溃。经调查，他们发现网站在评论字段中期望字母字符，而不幸的是其中包含一个无法读取的\
  \ TAB 字符，导致连锁系统故障。\n\n正如我们在上一章中简要讨论的，计算机科学概念 **垃圾进，垃圾出 (GIGO)** 决定了数据的质量。数据的输出质量由其输入质量决定。用外行的话说，如果我们提供糟糕的数据作为输入，我们将得到糟糕的数据作为输出。数据质量问题涉及完整性、一致性、有效性、准确性、唯一性、完整性和及时性。\n\
  \n现在我们了解了数据质量对技术和业务的影响，让我们继续使用 AWS Glue DataBrew 构建数据质量规则以识别和修复问题的示例。\n\n![](img/e28602b44ec813a47df57c96b204412c_68_0.png)\n\
  \n如果您想跟随操作，我将提供创建数据质量规则的分步说明。要创建数据质量规则，请按照此处提到的步骤操作：\n\n1. 单击 **DQ Rules** 选项。\n\
  2. 为您的数据质量规则集提供名称。例如，您可以将其命名为 `data-quality-human-resource`。\n3. 在 **Choose dataset**\
  \ 部分，选择您在 *step 2* 中创建的数据集。选择数据集后，系统将为您提供数据质量规则的建议。\n\n![](img/e28602b44ec813a47df57c96b204412c_70_0.png)\n\
  \n**Figure 2.48: Creating the data profile job**\n\n完成数据配置文件作业并返回到数据质量规则部分后，选择 raw-human-resource\
