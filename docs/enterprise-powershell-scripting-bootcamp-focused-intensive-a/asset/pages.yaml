  md: 'Inside the foreach loop, you take the current value and leverage the [regex]
    .NET class to ::escape any characters that may interfere with the regular expression.
    This will dynamically interpret those characters as literal characters instead
    of regular expression instructions. You then leverage the -join operator to add
    a | between each of the words in the $myarray array. The | character in the search
    string designates the OR operation. The foreach loop continues to add the remaining
    words to the regular expression string. This creates the search pattern of administrator
    | password | username.


    You continue to add the ).*$ to the end of the pattern to close the parenthetical
    statement, and match any characters from the end of the pattern. Finally, you
    place the string you built into a variable named $searchregex. You can then use
    this regular expression to search by leveraging the -match operator, or a cmdlet
    that supports regular expressions.


    > By default, regular expressions in PowerShell are case-insensitive. When you
    leverage the [regex] .NET class, however, the class casts the expression with
    case sensitivity, overriding the default setting. This requires you to force the
    expression to evaluate with case insensitivity by calling (?i).


    To create an array and search using a dynamically built regular expression, you
    can do the following:


    ```

    $myarray = "administrator","password","username"

    $searchRegex = ''(?i)^.*('' + ($myarray | % {[regex]::escape($_)}) -join "|" +
    '').*$''

    "This String has Administrators in it." -match $searchRegex

    "This PASSWORD is not secure." -match $searchRegex

    "TheUsernames are not written." -match $searchRegex

    $searchRegex.tostring()

    ```


