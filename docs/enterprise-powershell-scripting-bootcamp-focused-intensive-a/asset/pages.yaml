    providing the -FilePath parameter pointing to the location of the item you want
    to execute. You can then call the optional -argumentList parameter referencing
    the parameters that are needed to execute the item, the optional -verb parameter
    to invoke any verbs associated with the file type (such as Edit, Open, Play, Print,
    and RunAs), the optional -NoNewWindow parameter to not spawn the command in a
    new Powershell console, and the optional -wait parameter to wait for the process
    to complete before continuing with the script. If you do not execute the -wait
    parameter, the script will continue to the next step without waiting for the current
    step to be successful. After starting a process, the process will receive a process
    ID, which you can reference with the other process cmdlets.


    To start a new Notepad process, you can do the following:


    ```

    start-process -FilePath notepad.exe

    $process = get-process notepad*

    ```'
