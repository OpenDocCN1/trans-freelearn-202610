    # Pre-script security


    When you want to create an enterprise-ready script, you need to start with your
    security components. In Chapter 4, String Encryption and Decryption, you learned
    the importance of leveraging encoding and encryption to provide added security
    to your scripts. You can follow several enterprise strategies to ensure that you
    properly implement encoding and encryption. One of the popular strategies is to
    create an encryption and decryption salt, init, and password that are shared by
    all of your scripts. While this is a simpler method from a script management perspective,
    you provide all departments access to the same encrypted data. Alternatively,
    you can have the departments create their own encoded salt, init, and passwords
    for scripts. In this, the encrypted data is different than what your department
    generates. This provides an additional layer of obscurity to the encrypted data
    as it''s implemented in answer files. While this is more secure, it is a bit more
    difficult to coordinate a shared script. You will need to ensure that each team
    implements their own encoded salt, init, and password in the script and answer
    file.


    # Script 1 - randomized password and string generator


    Whatever strategy you choose for your environment, you will need to start the
    scripting process by creating a randomized password. You then encode this password
    to split into the Script Side Decryptor (SSD), or $SSD, the Answer File Decryptor
    (AFD), or $AFD, and the Runtime Decryptor (RTD), or $RTD. Finally, you specify
    an salt string, and encode it in a $salt variable, and specify an init string,
    and encode it in a $init variable. You now have all of the prerequisites to start
    encrypting data by leveraging an encryption function.'
