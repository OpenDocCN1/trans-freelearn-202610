    # XML tag function


    As you start building more complex scripts, you will likely add more tags into
    your answer files. You can leverage the .GetElementsByTagName() method with the
    argument of the tag names to gather additional data from the answer file. This
    enables you to call each of the tags individually and store the contents into
    a variable.


    When you leverage the .GetElementsByTagName() method, it only reads the data once
    and stores the data in the variable. This means that if the XML file changes,
    the data will not automatically update in the variable. You will need to call
    the method a second time to gather an updated copy of the data in the XML file.


    Alternatively, you may also choose to create a function to read the individual
    XML tags. This function can refresh the XML content in memory each time it is
    called. This enables the function to be called in multiple parts of the script,
    and to always have the current XML data.'
