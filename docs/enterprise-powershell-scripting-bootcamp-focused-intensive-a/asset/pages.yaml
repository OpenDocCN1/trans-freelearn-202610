- pgno: 214
  md: "After you create your log files and event log source, you can create the logging\
    \ function. The logging function will enable you to write information to a variety\
    \ of places with a single command. The log function accepts three different parameters,\
    \ the default parameter is when no values are included other than the $string.\
    \ This will assume you want to write to the CSV file and will append additional\
    \ data to the CSV. If you include a $string with a single \"y\", it will attempt\
    \ to log to the log file. If the log file is not enabled, the logging mechanism\
    \ skips adding to the log file. The third parameter is to write to the event log.\
    \ This is invoked by including a $string, a Y, or an N for the second parameter,\
    \ and a Y for the third parameter in the function. If the event log writing is\
    \ enabled, it will write the $string to the event log. Finally, the function will\
    \ evaluate if verbose logging is turned on. If verbose logging is enabled, it\
    \ will write the current action to the screen.\n\nTo create a log function that\
