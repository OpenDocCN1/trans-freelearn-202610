    # Securing the password


    | Script Side Decryptor SSD | Answer File Decryptor AFD | Runtime Decryptor RTD
    |

    |---|---|---|

    | A_Complex_Pass | + | word_With_A_Lot | + | _Of_Characters |


    One of the most important parts of your encryption methodology is securing the
    password used for your encryption. A recommended methodology for securing your
    password is to break the password into three or more locations. The preceding
    diagram takes the password of A_Complex_Password_With_A_Lot_Of_Characters and
    breaks it into three separate segments. The purpose is to have the password data
    partially in the script itself, partially in the answer file, and the remainder
    fed into the script as an argument during runtime. If any of the three password
    sections are not provided, the encryption process would fail due to an incorrect
    password.'
