- pgno: 121
  md: "This example explains how to query the disks on a system, convert the disk\
    \ size and freespace, and identify the drive types:\n\n+   1. You first start\
    \ by defining the `measure-diskunit` function.\n+   \n+   Earlier in the chapter,\
    \ you learned that this function is used to determine the unit of measure, and\
    \ calculate the converted value in that unit of measure. You learned that this\
    \ function also leverages the `[System.Math] ::Round()` method to round the values\
    \ to two decimal places. You also learned that this function returns two values\
    \ back to the script in an array. The first value is the converted value; the\
    \ second value is the unit of measure.\n+   \n+   2. You then proceed to query\
    \ the local disks on a system, leveraging the `get-wmiobject` cmdlet with the\
    \ `win32_logicaldisk` argument, and set the results in the `$disks` variable.\
    \ You create a `Foreach` loop for each `$disk` in the `$disks` variable.\n+  \
    \ \n+   3. You then proceed to obtain the drive letter by calling the `$disk.DeviceID`\
    \ property and storing it in the `$driveletter` variable.\n+   \n+   4. You retrieve\
    \ the free space by calling the `$disk.FreeSpace` property and storing the result\
    \ in the `$freespace` variable.\n+   \n+   5. You finally call the `$disk.Size`\
    \ property, and store the value in the `$size` variable.\n+   \n+   6. The next\
    \ step is to evaluate whether the disk freespace or the disk size is less than\
    \ 1. This means that the drive is either full, or no media are loaded in the drive.\
    \ To catch divide-by-zero errors, you set the `$freespace` value to 0 if the free\
    \ space is 0. You set the `$size` to zero if the size is 0.\n+   \n+   7. Next\
    \ you evaluate the disk free space unit of measure by leveraging `measure-diskunit`\
    \ with the `$freespace` argument. The result from the function is calculated,\
    \ returned, and stored in the `$freetype` variable. Since the returned value from\
    \ `measure-diskunit` is an array of two items, you set the first value, or `$freetype[0]`,\
    \ in the `$convFreeSpc` variable. You set the second value, or `$freetype[1]`,\
    \ in the `$funit` variable.\n+   \n+   8. You continue to evaluate the disk size\
    \ unit of measure by leveraging the `measure-diskunit` with the `$size` argument.\
    \ The result from the function is calculated, returned, and stored in the `$sizetype`\
    \ variable. Since the returned value from `measure-diskunit` is an array of two\
    \ items, you set the first value, or `$sizetype[0]`, in the `$convSize` variable.\
    \ You set the second value, or `$sizetype[1]`, in the `$sunit` variable.\n+  \
    \ \n+   9. Finally, you use the switch you created earlier to determine the drive\
    \ type based on the drive type number."
