- pgno: 140
  md: 'PowerShell has the same file path limitations as the Windows operating systems.
    All of the PowerShell cmdlets will have issues querying file systems that have
    folder paths longer than 248 characters. There are several programs such as robocopy.exe
    that can be leveraged to display the full paths of files and folders longer than
    248 characters. While you have the ability to return long paths, you still would
    not be able to interact with any of the files in that directory using PowerShell
    cmdlets. Additionally, robocopy.exe is very slow in comparison to the Get-ChildItem
    cmdlet, and requires administrative backup privileges to the systems it is being
    run on.


    This leaves you with limited options for interacting with long file and folder
    paths. As a result, it''s recommended that you work through handling the file
    path, and access error messages in your script. Handling errors with the Get-ChildItem
    cmdlet is done by using the -ErrorAction and -ErrorVariable parameters. Instead
    of creating a single variable for errors, however, you will need to place the
    errors in an array. This is because the Get-ChildItem cmdlet obtains all files
    and directories in a specified path, even if it has access issues or cannot access
    the path due to path length. If you only use a variable, the only error that would
    be in the error variable is the last one to occur. Instead, to work around this,
    you can define an array leveraging $errors = @() and use $errors as the argument
    to -ErrorVariable. This tells PowerShell to add an additional item to the $errors
    array when an error occurs.


    > To execute the following example, you will need to create a local user on your
    system named "Brenton". Alternatively, you can update the line that reflects "$env:computername\Brenton"
    to whatever username you would like.


    To create a shared directory structure that exceeds 248 characters, gather the
    file and directory information, and catch the errors, you can perform the following
    actions:


    ```

    # Create Folder Structure to Scan

    $userdrive = "c:\Temp\POSHScript\Chapter9Examples\CompanyXYZ\Milwaukee\

    InformationTechnologyDepartment\UserHomeDrives\UserLoginID\"

    new-item $userdrive -ItemType Directory -Force

    $domainuser = "$env:computername\Brenton"

    New-SmbShare -name "UserData" -Path $userdrive -FullAccess $domainuser

    New-PSDrive -Name H -root "\\$env:computername\Userdata" -Persist

    -PSProviderFileSystem

    cd H:

    $userFolder = "Information Technology Department\All Company Software\

    ISO\Microsoft\Microsoft SQL Server 2012 R2\SQL Server Update Patches\

    Service Pack 3\Cumulative Update 7\AutomatedWindowsInstaller\"

    ```'
  merge: -1
