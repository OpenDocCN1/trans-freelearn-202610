    # Windows server scanning script overview


    The Windows server scanning script is an enterprise-ready tool that you can use
    to inspect systems in your environment. This script can be used as a starting
    point to enable the creation of your own scripts. When implementing the Windows
    server scanning script, you need to follow a general workflow to ensure that the
    script is secure and reliable.


    The workflow steps include:


    +   1. **Security key generation:** You will create a string generation script
    that can randomly create your encryption password, salt, and init. You will also
    leverage encoding to strengthen the password, salt, and init. The output of this
    script will be used by the `encryption` function, `decryption` function, and `answer`
    file.

    +   2. **Encryption script:** You will then leverage the values that are generated
    in the security key generation to create an encryption script. This will enable
    you to encrypt strings for use in your `answer` File.

    +   3. **Answer file:** You will learn the different answers that you will need
    to store in your `answer` file. You will also learn that you need to download
    the `Scan_Answers.xml` answer file from the book''s code files for this chapter.'
  merge: -1
  img_proc: true
