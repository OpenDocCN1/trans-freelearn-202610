- pgno: 32
  md: '# Script logging


    As you create your enterprise script template, you will need to incorporate a
    logging mechanism. Logging allows you to capture script output, including informational,
    warning, and error messages. In typical logging scenarios, you will need to record
    script actions to either the event log, a log file, or a data collection file,
    like a Comma Separated Values (CSV) file. While PowerShell has a transcript which
    you can invoke, leveraging the start-transcript and stop-transcript cmdlets, it
    only allows you to record output to a single log file. This doesn''t provide for
    writing to the event log or data collection files.


    A popular logging mechanism is to create your own PowerShell logging function.
    This enables you to pass in parameters into the logging function to tell the script
    to either write to the event log, log file, or append data to the data collection
    file. It can also write the actions to the PowerShell window to view progress.
    This avoids having to write multiple lines of code each time you want something
    to be displayed in either the event log, log file, or the data collection file.
    You just need to call the logging function and pass in the required parameters,
    and it will write to the locations you specify.


    # Creating the logging files


    To start, you will need to create the files for logging. Enterprises typically
    include both the server name and a date timestamp for log files. This allows for
    a clear identity of log files and execution times in large environments.


    To create a time-stamped log file, you can perform the following:


    ```

    $date = (Get-Date -format "yyyyMMddmmss")

    $compname = $env:COMPUTERNAME

    $logname = $compname + "_" + $date + "_ServerScanScript.log"

    $scanlog = "c:\temp\logs\" + $logname

    new-item -path $scanlog -ItemType File -Force

    ```


    The output of creating the log file is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_32_0.png)'
  merge: -1
  img_proc: true
