- pgno: 117
  md: "# Free Space property\n\nAnother important property is the FreeSpace property.\
    \ The FreeSpace property can range from the value of the disk's Size property\
    \ to 0. When scripting to determine the free space, you have to consider that\
    \ the remaining space may not be the same unit of measure you started with. For\
    \ example, you may have a 2-terabyte drive, but you may only have 100 kilobytes\
    \ left on the disk. If you were to convert the remaining 100 kilobytes to terabytes,\
    \ the value would be many decimal places long. Instead, you need to build in logic\
    \ to determine the appropriate unit of measure, based on the remaining space on\
    \ the drive.\n\nOne of the easiest ways to accomplish this is to create a PowerShell\
    \ function that evaluates the disk space on the system. This function will allow\
    \ for a $diskspace argument. It will then leverage a switch statement to evaluate\
    \ the $diskspace value. If it is greater than 1PB, 1TB, 1MB, or 1KB, in that order,\
    \ it will perform the appropriate math calculation to convert the appropriate\
    \ unit of measure. The value, rounded to two decimal places, would then be returned\
    \ to the script, along with the unit of measure. The key to success with this\
    \ methodology is leveraging a function for the evaluation. When the appropriate\
    \ unit of measure is found, you use the Return command and the function exits\
    \ after returning the values to the script.\n\nTo convert diskspace into the respective\
    \ unit of measure, you can perform the following actions:\n\n```\nfunction measure-diskunit\
    \ { param($diskspace)\n    switch ($diskspace) {\n        {$_ -gt 1PB} { return\
    \ [System.Math]::Round(($_ / 1PB),2),\"PB\" }\n        {$_ -gt 1TB} { return [System.Math]::Round(($_\
    \ / 1TB),2),\"TB\" }\n        {$_ -gt 1GB} { return [System.Math]::Round(($_ /\
    \ 1GB),2),\"GB\" }\n        {$_ -gt 1MB} { return [System.Math]::Round(($_ / 1MB),2),\"\
    MB\" }\n        {$_ -gt 1KB} { return [System.Math]::Round(($_ / 1KB),2),\"KB\"\
    \ }\n        default { return [System.Math]::Round(($_ / 1MB),2),\"MB\" }\n  \
    \  }\n}\n\nmeasure-diskunit 868739194880123456\nmeasure-diskunit 868739194880123\n\
    measure-diskunit 868739194880\nmeasure-diskunit 868739194\nmeasure-diskunit 868739\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 118
  md: 'The output of this script is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_118_0.png)


    This example displays how to convert a byte value into multiple units of measure:


    +   1. You first start by declaring a function named `measure-diskunit` with the
    param of (`$diskspace`).

    +   2. You then create a `switch` statement with the argument `$diskspace`.


    In the `switch` evaluations, you first evaluate the pipeline designated by `$_`
    and then determine whether the `$diskspace` value is greater than 1 petabyte (1PB):


    +   - If the value is greater than 1PB, the script will use the pipeline value
    and divide it by 1PB. It will then round the resulting value leveraging the `[System.Math]::Round()`
    method with the argument 2, for two decimal places. As a second value for the
    return array, you provide a comma followed by the PB unit of measure. The converted
    value and the unit of measure are returned to the script, terminating further
    evaluations in the function.

    +   - If the unit of measure is not greater than 1PB, it will continue to evaluate
    the statements in the `switch` statement.

    +   - It will determine whether the `$diskspace` value is greater than 1TB, perform
    the rounding, and return the unit of measure to the script.'
  merge: -1
  img_proc: true
- pgno: 119
  md: "+   - If the $diskspace value is not greater than 1TB, it will continue in\
    \ the switch statement to determine whether the value is greater than 1GB, 1MB,\
    \ and 1KB in the same fashion, returning the converted value and unit of measure\
    \ when matched.\n+   - If no values match, the switch will by default return the\
    \ value in MB.\n\nIn this example, you run the measure-diskunit function with\
    \ five different $diskspace values. The first statement of measure-diskunit 868739194880123456\
    \ returns the array of 771.6 and PB. The next statement of measure-diskunit 868739194880123\
    \ returns the array of 790.11 and TB. The following statement of measure-diskunit\
    \ 868739194880 returns the array of 809.08 and GB. The statement of measure-diskunit\
    \ 868739194 returns the array of 828.49 and MB. The final statement of measure-diskunit\
    \ 868739 returns the array of 848.38 and KB.\n\n# Disk information script\n\n\
    This chapter explains different methodologies for scanning the different aspects\
    \ of the logical drives attached to your system. If you want to query the disks\
    \ on a system, convert the disk size and free space, and identify the drive types,\
    \ you can create the following script:\n\n```\nfunction measure-diskunit { param($diskspace)\n\
    \    switch ($diskspace) {\n        {$_ -gt 1PB} { return [System.Math]::Round(($_\
    \ / 1PB),2),\"PB\" }\n        {$_ -gt 1TB} { return [System.Math]::Round(($_ /\
    \ 1TB),2),\"TB\" }\n        {$_ -gt 1GB} { return [System.Math]::Round(($_ / 1GB),2),\"\
    GB\" }\n        {$_ -gt 1MB} { return [System.Math]::Round(($_ / 1MB),2),\"MB\"\
    \ }\n        {$_ -gt 1KB} { return [System.Math]::Round(($_ / 1KB),2),\"KB\" }\n\
    \        default { return [System.Math]::Round(($_ / 1MB),2),\"MB\" }\n    }\n\
    }\n```\n\n```\n$disks = get-wmiobject win32_logicaldisk\nForeach ($disk in $disks)\
    \ {\n    $driveletter = $disk.DeviceID\n    $freespace = $disk.FreeSpace\n   \
    \ $size = $disk.Size\n}\n```"
