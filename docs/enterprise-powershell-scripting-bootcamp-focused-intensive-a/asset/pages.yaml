  md: "# Speed consideration - switches versus if statements\n\nThere may be times\
    \ where you need to evaluate a string for multiple values. It's common to start\
    \ by creating multiple if statements to evaluate those strings. While this may\
    \ work well in small datasets, you can get a gain in performance by leveraging\
    \ a switch statement. This is due to the way that switch statements evaluate data\
    \ as it passes through. Switch statements stop evaluating down the list of statements\
    \ after a match is found. Conversely, multiple if statements will evaluate every\
    \ time even if a match is found. This also means that, if you are sorting a large\
    \ amount of data, you will want to place your most common data near the top of\
    \ the switch statement, and the less likely data at the bottom. This will allow\
    \ you to quickly match the most common denominator and move on to the next value\
    \ being passed through the loop.\n\nThe next example will emulate a large folder\
    \ structure of .exe, .dll, and .xml files. Part one of this example sets up the\
    \ dataset for evaluation, whereas part two will sort the data counts of file types\
    \ into different variables. You will leverage both if statements and switches\
    \ to determine the efficiency of switches.\n\n> Part 1 and Part 2 require that\
    \ a PowerShell Window is Run as administrator. When testing this code, you will\
    \ want to right-click the PowerShell icon and select Run as administrator. If\
    \ you are remotely executing this code, you will want to ensure that the user\
    \ credentials you are using have administrative rights to the system.\n\nPart\
    \ 1 – To create a dataset of .dll, .exe, and .xml files, you can perform the following:\n\
    \n```\n```powershell\n# Gather all the File Extensions c:\\windows\\System32\n\
    $dlls = 0\n$exes = 0\n$xmls = 0\n$extensions = @()\n$contents += ((Get-ChildItem\\\
    \"c:\\\\windows\\\\System32\\\\\\\" -include \\\"*.xml\\\",\\\"*.dll\\\",\\\"\
    *.exe\\\" -Recurse -ErrorActionSilentlyContinue) | Select Name)\nforeach ($item\
    \ in ($contents.Name)) {\n    $sline = $item.split(\\\".\\\").length\n    $extensions\
    \ += '.' + $item.split(\\\".\\\")[$sline-1]\n}\n1..13 | % { $extensions += $extensions\
    \ }\nWrite-host \\\"Total number of Extensions: \\\" $extensions.count\n```\n\
    ```"
  merge: -1
  img_proc: true
