- pgno: 35
  md: '# Creating a windows event log source


    In the instance that you want to write to the Windows event log, one of the prerequisites
    is to register the script as an event source with the Windows event log system.
    This is done with the use of the New-EventLog cmdlet. You start by specifying
    the New-EventLog cmdlet, followed by the -LogName parameter followed by an event
    log name. You can either select your own event log or specify one of the built-in
    event logs, such as Application or system. Finally, you specify the -Source parameter
    with the name of the script you are executing.


    You can only register the event log source once, which may lead to errors when
    executing a script multiple times on the same system. You can retrieve the event
    log sources by specifying the get-eventlog cmdlet with the -LogName parameter,
    and piping the results to Select-object Source -Unique. This is not very desirable
    as it requires the system to query all the log events to determine if a source
    is already registered. Since Windows systems have a large number of event logs
    and log events, the query is very CPU and memory intensive.


    The fastest way to get around a duplicate event log source error message is to
    suppress the error message itself. This is done through leveraging the -ErrorAction
    parameter set to SilentlyContinue with the New-EventLog cmdlet. The -ErrorAction
    parameter with SilentlyContinue specified will capture the error and silently
    continue with the script, suppressing the error messages.


    To register a new event log source suppressing error messages, you can perform
    the following:


    ```

    New-EventLog -LogName Application -Source "WindowsServerScanningScript" -ErrorAction
    SilentlyContinue

    ```


    The output of the PowerShell window will look like the following:


    ![](img/a27a138d6586c10902d8e86ab3384834_35_0.png)


    The preceding script displays how to register a new event log source with the
    Windows event log system. You first start by using the New-EventLog cmdlet with
    the -LogName parameter set to Application. You then specify the -Source argument
    and set it to the script name of "WindowsServerScanningScript". Finally, you suppress
    error messages by using the -ErrorAction argument and setting it to SilentlyContinue.
    After executing this command, you will be able to write to the Application event
    log with the event source of WindowsServerScanningScript.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/a27a138d6586c10902d8e86ab3384834_36_0.png)


    > When you create an event log source, it provides the ability to use that source
    for logging of messages. You need to write something to that event log source
    to have it appear in the Application event log.


    ![](img/a27a138d6586c10902d8e86ab3384834_36_1.png)


    > The Windows event log cmdlets require that the PowerShell Window is Run as administrator.
    When testing this code, you will want to right-click the PowerShell icon and Run
    as administrator. If you are remotely executing this code, you may want to ensure
    the user credentials you are using have administrative rights to the system.


    # Creating the logging function


    After creating the log files and registering the event log source, you are now
    able to create a custom logging function. The logging function will be flexible
    in that it can accept arguments for three types of data writes. These include
    event logs, log files, and the data collection .csv file.


    The logging function is declared with function log {. You will then need to leverage
    a parameter block to accept arguments into the function. The parameter block is
    declared with param() and includes the variables $string, $scnlg, and $evntlg.
    $string will be the string value for the informational, warning, error, or data
    collection content. The $scnlg variable dictates if the content is written to
    the scan log file. The $evntlg variable dictates if the content is written to
    the event log.


    To create the beginning of the logging function, type the following:


    ```

    ```

    function log { param($string, $scnlg, $evntlg)

    ```

    ```


    Using a variation of the arguments with the logging function, you can write log
    information to different locations. You can set the following:


    +   - If $scnlg is set to Y and no value is specified for $evntlg, the script
    will only write to the scanning log file.

    +   - If $scnlg is set to N and $evntlg is set to Y, the script will write only
    to the event log.

    +   - If $scnlg is set to Y and $evntlg is set to Y, the script will write to
    both the scanning log file and the event log.'
  merge: -1
  img_proc: true
- pgno: 37
  md: "+   - If no parameters other than $string are passed into the function, it\
    \ will write the contents to the data collection CSV file.\n+   - In all cases,\
    \ the logging function will leverage the write-host cmdlet with the contents of\
    \ the $string variable. This will verbose print all the logging variations.\n\n\
    To create the full logging function, you can perform the following:\n\n```\nfunction\
    \ log { param($string, $scnlg, $evntlg)\n    # If Y is populated in the second\
    \ position, add to log file.\n    if ($scnlg -like \"y*\") {\n        Add-content\
    \ -path $scanlog -Value $string\n    }\n    # If Y is populated in the third position,\
    \ Log Item to Event Log As well\n    if ($evntlg -like \"y*\") {\n        write-eventlog\
    \ -logname Application -source \"WindowsServerScanningScript\" -eventID 1000 -entrytype\
    \ Information -message \"$string\"\n    }\n    # If there are no parameters specified,\
    \ write to the data collection file (CSV)\n    if (! $scnlg) {\n        $content\
    \ = \"$env:COMPUTERNAME,$string\"\n        Add-Content -path $scanresults -Value\
    \ $content\n    }\n    # Verbose Logging\n    write-host $string\n}\n```\n\n```\n\
    $date = Get-Date\nlog \"Starting WindowsServerScanningScript at $date ...\" \"\
    y\" \"y\"\nlog \"Writing a message to the Event Log Only.\" \"N\" \"y\"\nlog \"\
    ScriptStart,$date\"\n```"
  merge: -1
  img_proc: true
