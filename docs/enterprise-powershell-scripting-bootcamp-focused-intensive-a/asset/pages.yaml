- pgno: 95
  md: 'This example displays how to retrieve the SID, username, and age of user profiles.
    You first start by leveraging the get-wmiobject cmdlet with the win32_UserProfile
    class argument and storing the UserProfile objects in the $profiles variable.
    You then leverage a foreach loop with the $profile as the iterator, and $profiles
    as the dataset. For the profile aging process, you call the Get-Date cmdlet and
    set the value in the $currentdate variable. You then take the current instance
    of the $profile.LastUseTime property, and place it in the $lastusetime variable.


    To calculate the age, you first have to convert the $lastusetime to a friendly
    format. To do this, you leverage the [Management.ManagementDateTimeConverter]::ToDateTime()
    method with the $lastusetime variable as the argument and place the result in
    the $lastusetime variable. This overwrites the previous DMTF-formatted value with
    the standard time format value. You then calculate the age by subtracting the
    $currentdate variable from $lastusetime, and selecting the .TotalDays property.
    Since the returned value has decimals, you perform the .net rounding calculation
    using the [math]::Round() method on the TotalDays property result. This returns
    a single digit as a date age, which is set in the $age variable.


    To calculate the username, you call the current instance $profile.SID property
    and set it equal to the $sid variable. You then perform a Try{ statement to catch
    any .NET translate errors on the SID. Inside the Try statement, you obtain the
    SID object using the New-Object cmdlet with the System.Security.Principal.SecurityIdentifier()
    class and the $SID argument. The SID object is then returned to the $usersid variable.
    You then translate the SID to a NTAccount leveraging the $usersid.Translate()
    method set to the [System.Security.Principal.NTAccount] class object. After the
    value translates, you call the .Value property to place the result in the $username
    variable.


    In the instance the SID or user doesn''t exist, you perform a Catch { statement
    to catch the error. If this occurs, you write to the display using the Write-Host
    cmdlet "There was an error translating SID value $sid to a username. Account may
    not exist". You then set the $username variable to "(Deleted Account)".


    As the last step, you write to the screen leveraging the Write-Host cmdlet "User
    with the name $username and SID $sid last logged in $lastusetime. ($age Days old)".
    After processing this script, this example displays the built-in, local, and domain
    profiles that are on the system.'
  merge: -1
