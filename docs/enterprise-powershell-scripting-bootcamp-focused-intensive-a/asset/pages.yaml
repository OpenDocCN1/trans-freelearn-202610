- pgno: 46
  md: '# Reading XML answer files


    PowerShell has the ability to natively read and parse the data in XML files. This
    is done by loading an XML file into an XML document object, leveraging the get-content
    cmdlet. You first start by defining a variable like $xmlfile with the data type
    set to [xml]. You then call the get-content cmdlet with the -path parameter set
    to the location of an XML file. If you omit the [xml] data type while defining
    the variable, it will interpret the file as a text file. This means that you will
    not be able to leverage any of the built-in XML support.


    To load the XML answer file you created earlier, you can perform the following:


    ```

    [xml] $xml = get-content "C:\temp\POSHScript\Answers.xml"

    $xml

    ```


    The output of this command will look as follows:


    ![](img/a27a138d6586c10902d8e86ab3384834_46_0.png)


    This example displays how to properly obtain the contents of an XML file and place
    them into an XML formatted variable. The command starts by declaring the [xml]
    data type followed by the variable of $xml. You then leverage the get-content
    cmdlet and declare the content path of "C:\temp\POSHScript\Answers.xml" and contents
    are stored in the $xml variable. Finally, you call the $xml variable to display
    the XML formatted contents.


    After retrieving the contents of the XML file, you will want to retrieve the individual
    XML tags to store the configuration information in memory for the script. The
    .GetElementsByTagName("TagName") method enables you to search the XML file for
    tags named with specific values. This will return the attributes and elements
    of an XML tag. In the instance that there are tags named the same, or the child
    tag has siblings, the method will return all values that equal the tag value specified
    in the method.


    To retrieve the contents of an XML file and retrieve specific tag information,
    you can perform the following:


    ```

    [xml] $xml = get-content "C:\temp\POSHScript\Answers.xml"

    $ports = $xml.GetElementsByTagName("ports")

    $ports | Select Name, Port

    ```'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'The output of this command will look as follows:


    ![](img/a27a138d6586c10902d8e86ab3384834_47_0.png)


    This example displays how to obtain the contents of an XML file, place it into
    an XML formatted variable, and retrieve data by XML tag names. The command starts
    by declaring the [xml] data type followed by the variable of $xml. You then leverage
    the get-content cmdlet and declare the content path of "C:\temp\POSHScript\Answers.xml"
    and contents are stored in the $xml variable.


    You then leverage the .GetElementsByTagName() method on the $xml variable with
    the "ports" argument to obtain the XML tags named "ports". After this command
    is executed, you will have the child and sibling information that matches the
    tag name of "ports" in the $ports variable. You then pipe $ports to Select Name,
    Port, which will display the attribute values for the attributes Name and Port.


    > Once you call the get-content cmdlet and place the XML data into a variable,
    you are no longer working with the data contained in the XML file. You will be
    working with an in-memory copy of the XML file. If you change any of the contents
    in the XML file, you will need to re-run the get-content cmdlet to have an updated
    copy in memory.


    XML also supports dot notation for retrieving XML tag data. Using dot notation,
    you can retrieve all the parent, child, and sibling tags simply by calling the
    tag names and attributes, separated by a period. For the previous example, you
    could call $ports.Name to return FTP, SMTP, DNS, HTTP, and HTTPS. You can also
    reference the $xml content directly and specify $xml.ScriptAnswers.Ports.Name
    to return FTP, SMTP, DNS, HTTP, and HTTPS.


    Using dot notation to view the port names, you can type the following:


    ```

    $ports.Name

    $xml.ScriptAnswers.Ports.Name

    ```'
