  md: '# 13


    # Creating the Windows Server Scanning Script and Post-Execution Cleanup


    When you are running systems in a large enterprise, you often need to identify
    information about different servers in your environment. While you could manually
    evaluate items on each server to determine its role, you most likely will want
    to automate that process. As you worked through this book, you learned multiple
    facets to scanning and identifying non-standard configurations on servers using
    PowerShell. You also learned how to optimize code to significantly increase the
    performance of your scripts. These examples led you up to this chapter, which
    combines all of the concepts that you learned into a single Windows server scanning
    script.


    The Windows server scanning script was developed to provide a deep insight into
    a server''s roles and functions in an environment. When you execute the Windows
    server scanning script against your environment, you can quickly view non-default
    configurations that make the server unique. This is also powerful when you are
    performing large-scale server discoveries to determine commonality amongst servers
    in your environment. It''s encouraged to take this existing script and build upon
    it for the unique needs of your environment.


    In this chapter, you will:


    +   - Obtain an overview of the overall script structure

    +   - Implement the comment block, parameter block, answer file reading function,
    and decryption functions

    +   - Populate variables and arrays from the answer file'
