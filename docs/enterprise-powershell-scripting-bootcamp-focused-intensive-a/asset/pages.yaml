  md: "# Answer file reading function\n\nYou continue with the scanning script by\
    \ defining the answer file reading function, loading the XML into memory, and\
    \ removing the answer file. You may choose to comment out the Remove-Item cmdlet\
    \ step. This will provide for testing in your environment without having to recreate\
    \ the XML file in the script directory.\n\nTo create an XML reading function,\
    \ load the XML into memory, and delete the XML file, you can perform the following:\n\
    \n```\nFunction read-xmltag { param ($xmlextract)\nreturn $xml.GetElementsByTagName(\"\
    $xmlextract\")\n}\n\n$xmlfile =\"$PSScriptRoot\\Scan_Answers.xml\"\n\n$test =\
    \ test-path $xmlfile\n\nif (!$test) {\n    Write-Error \"$xmlfile not found on\
    \ the system. Select any key to exit!\"\n    PAUSE\n    exit\n}\n\n[xml] $xml\
    \ = get-content $xmlfile\nRemove-Item $xmlfile -force\n```\n\nThere is no output\
    \ to display from creating this function.\n\nIn this example, you define the answer\
    \ file reading function:\n\n+   1. You first start by defining the read-xmltag\
    \ function with a parameter block of param ($xmlextract).\n+   2. You then leverage\
    \ the $xml.GetElementsByTagName() method to obtain the xml tag specified in the\
    \ $xmlextract.\n+   3. You take the result and return it to the portion of the\
    \ script that called the function. You then continue to gather the current path\
    \ of the script by calling $PSScriptRoot and combining the value with \"\\Scan_Answers.xml\"\
    . You store the result in the $xmlfile variable.\n+   4. You continue to determine\
    \ if the file exists by leveraging the test-path cmdlet with the $xmlfile argument."
