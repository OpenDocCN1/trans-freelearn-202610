- pgno: 90
  md: "# Identifying logged on users\n\nThere may be instances where you need to identify\
    \ users that are logged in to your systems. When a user logs into your computer,\
    \ they create an interactive session with your system. This spawns processes under\
    \ that username as the process owner. Additionally, when you create a service\
    \ account to start services on a system, the underlying processes run as that\
    \ service account. Given that both methods invoke processes, the best method to\
    \ determine currently logged on users is to evaluate the running processes.\n\n\
    In addition to identifying the logged in users, you will need to filter out the\
    \ built-in Windows accounts. To perform this, you can create a switch statement\
    \ to make multiple evaluations of the process owner. If the process owner username\
    \ is NETWORK SERVICE, LOCAL SERVICE, $null, or SYSTEM, you can skip reporting\
    \ the username. If it doesn't match any of these values, it will use the default\
    \ switch and report the user to a list. Since multiple processes run under the\
    \ same user, you can pipe the user results to the Get-Unique cmdlet, which will\
    \ only select the unique values in the array.\n\n> Depending on how many processes\
    \ you have on your system, the following example will take up to 30 seconds to\
    \ execute.\n\nTo evaluate the running processes to obtain a list of non-built-in\
    \ logged on users, you can perform the following:\n\n```\n$users = @()\n$processes\
    \ = Get-WmiObject win32_process\nforeach ($process in $processes) {\n    $procuser\
    \ = $process.GetOwner().User\n    switch ($process.GetOwner().User) {\n      \
    \  \"NETWORK SERVICE\" { $continue = \"Skip User\" }\n        \"LOCAL SERVICE\"\
    \ { $continue = \"Skip User\" }\n        \"SYSTEM\" { $continue = \"Skip User\"\
    }\n        \"$null\" { $continue = \"Skip User\" }\n        default { $continue\
    \ = \"Report User\" }\n    }\n    if ($continue -eq \"Report User\") {\n     \
    \   $users += $procuser\n    }\n}\n$users | Get-Unique\n```"
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The output of this is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_91_0.png)


    This example displays how to output the current non-built-in users on a system.
    You start by defining an array named $users. You then leverage the get-wmi object
    with the argument of the win32_process class and place the result in $processes.
    You then create a foreach loop and loop through each $process in the $processes
    variable. You proceed to gather the iterative process owner using the $process.GetOwner()
    method and place the .User property in the $procuser variable. You then declare
    a switch statement evaluating the $process.GetOwner().User property. The first
    evaluations are for built-in accounts. If the accounts are NETWORK SERVICE, LOCAL
    SERVICE, SYSTEM, or $null, it will set $continue to "Skip User". If it doesn''t
    match any of these built-in users, it will leverage the default value, which sets
    the $continue variable to "Report User".


    After exiting the switch statement, you evaluate the $continue variable with an
    If statement, and proceed if the value is equal to "Report User". This step will
    add the $procuser variable to the $users array. After the foreach loop completes,
    you will have a large number of users listed for each non-built-in user. To trim
    the list to individual or unique users, you pipe the $users variable to Get-Unique
    cmdlet. The result is a list of the unique nonbuilt-in users on the system. The
    system the example was run on has three users: DWM-1, bblawat, and LocalJoe.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# User profiles


    User profiles are a common challenge in enterprises. Since they are autogenerated
    upon logon and there is no built-in automated functionality to remove local profiles,
    systems are plagued with old profile accounts. Old profiles not only consume data
    on systems, they also reveal information about other active accounts in the environment.


    PowerShell offers the ability to retrieve user profile information. To retrieve
    user profiles from a system, you can leverage the get-wmiobject cmdlet calling
    the win32_UserProfile class. After you retrieve user profile objects, you have
    the ability to use multiple properties to gather information about the profiles.
    The .SID property is the security identifier of the user in the profile. While
    the SID is a unique user number, you can easily translate it with the .NET System.Security.Principal
    class. You first start by creating a new .NET object by calling the New-Object
    cmdlet with the System.Security.Principal.SecurityIdentifier class with the SID
    of the user as the argument. You then retrieve the value from the .Translate()
    method set to [System.Security.Principal.NTAccount] class. The .NET class will
    translate from the SecurityIdentifier to the NTAccount, which results in the output
    of the username.


    To translate the security identifier of a user to a username, you can perform
    the following:


    ```

    ```powershell

    $sid = "S-1-5-18"


    $usersid = New-Object System.Security.Principal.

    SecurityIdentifier("$SID")


    $usersid.Translate( [System.Security.Principal.NTAccount] ).Value

    ```

    ```


    The output of this is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_92_0.png)


    This example displays how to properly convert a SID to username. You first start
    by defining the security identifier of "S-1-5-18" and place it in the $sid variable.
    You then leverage the New-Object cmdlet to call the System.Security.Principal.SecurityIdentifier
    class with the $sid argument and set it equal to $SID. This places the SID object
    in the $usersid variable. You then call the $usersid.Translate() method on the
    SID object, and specify the argument of [System.Security.Principal.NTAccount].
    Finally, you call the .Value property on the translated data, and you get the
    value of the username. In this example, you learn that the SID of S-1-5-18 is
    translated to NT AUTHORITY\SYSTEM.'
  merge: -1
  img_proc: true
- pgno: 93
  md: "Another common property you may use with the win32_profile class is the LastUseTime\
    \ property. The LastUseTime provides insight as to the last time the profile was\
    \ used. This timestamp is in the Distributed Management Task Force (DMTF) format,\
    \ which is typically not a user-friendly format for reading. To simplify this\
    \ value into a different time format, you can leverage the [Management.ManagementDateTimeConverter]\
    \ class with the ToDateTime() method and the argument of the LastUseTime. After\
    \ running this method, you will successfully convert the value into a user-friendly\
    \ format.\n\nTo convert the LastUseTime into a user-friendly format, you can perform\
    \ the following:\n\n```\n```powershell\n$profile = get-wmiobject Win32_UserProfile\
    \ | Where {$_.SID -eq \"S-1-5-18\"}\n$lastusetime = $profile.LastUseTime\n$lastusetime\n\
    [Management.ManagementDateTimeConverter]::ToDateTime($lastusetime)\n```\n```\n\
    \nThe output of this is shown in the following screenshot:\n\n![](img/a27a138d6586c10902d8e86ab3384834_93_0.png)\n\
    \nThis example displays how to convert a DMTF-formatted value into a user-friendly\
    \ format. You start by leveraging the get-wmiobject cmdlet and call the win32_UserProfile\
    \ class. You then pipe this value to Where {$_.SID -eq \"S-1-5-18\"} and place\
    \ this profile object into the $profile variable. You then retrieve the .LastUseTime\
    \ property and place it in the $lastusetime variable. You then call the $lastusetime\
    \ to display the DMTF-formatted time on the screen. In this example, the DMTF\
    \ is 20170216051704.765000+000. Finally, you call the [Management.ManagementDateTimeConverter]\
    \ class and invoke the ToDateTime() method with the $lastusetime as the argument.\
    \ The output from this command is the user-friendly value of Wednesday, February\
    \ 15, 2017 11:17:04 PM.\n\nTo determine the SID, username, and age of user profiles,\
    \ you can perform the following:\n\n```\n```powershell\n$profiles = get-wmiobject\
    \ Win32_UserProfile\nforeach ($profile in $profiles) {\n    $currentdate = Get-Date\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 94
  md: "```\n$lastusetime = $profile.LastUseTime\n$lastusetime = [Management.ManagementDateTimeConverter]::ToDateTime($lastusetime)\n\
    \n$age = [math]::Round(($currentdate - $lastusetime).TotalDays)\n\n$sid = $profile.SID\n\
    Try {\n    $usersid = New-Object System.Security.Principal.\nSecurityIdentifier(\"\
    $SID\")\n    $username = $usersid.Translate( [System.Security.Principal.\nNTAccount]).Value\n\
    }\nCatch {\n    Write-Host \"There was an error translating SID value $sid to\
    \ a username. Account may not exist.\"\n    $username = \"(Deleted Account)\"\n\
    }\n    Write-host \"User with name $username and SID $sid last logged in $lastusetime.\
    \ ($age Days Old)\"\n}\n```\n\nThe output of this is shown in the following screenshot:\n\
    \n![](img/a27a138d6586c10902d8e86ab3384834_94_0.png)"
  merge: -1
