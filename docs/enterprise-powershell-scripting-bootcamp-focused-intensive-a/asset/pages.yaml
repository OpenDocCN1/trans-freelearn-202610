- pgno: 64
  md: 'After setting the proper character encoding, you proceed to create the encryption
    key for the RijndaelManaged encryption algorithm. This is done by setting the
    RijndaelManaged $r.Key attribute to the object created by (new-Object Security.Cryptography.PasswordDeriveBytes
    $pass, $salt, "SHA1", 50000).GetBytes(32). This object leverages the Security.Cryptography.PasswordDeriveBytes
    class and creates a key using the $pass variable, $salt variable, "SHA1" hash
    name, and iterating the derivative 50000 times. Each iteration of this class generates
    a different key value, making it more complex to guess the key. You then leverage
    the .Get-Bytes(32) method to return the 32-byte value of the key.


    > RijndaelManaged 256-bit encryption is a derivative of the 32 bytes in the key.
    32 bytes times 8 bits per byte is 256 bits.


    To create the initialization vector for the algorithm, you set the RijndaelManaged
    $r.IV attribute to the object created by (new-Object Security.Cryptography.SHA1Managed).ComputeHash($init)[0..15].
    This section of the code leverages Security.Cryptography.SHA1Managed and computes
    the hash based on the $init value. When you invoke the [0..15] range operator,
    it will obtain the first 16 bytes of the hash and place them into the $r.IV attribute.


    > The RijndaelManaged default block size for the initialization vector is 128
    bits. 16 bytes times 8 bits per byte is 128bits.


    After setting up the required attributes, you are now ready to start encrypting
    data. You first start by leveraging the $r RijndaelManaged object with the $r.Key
    and $r.IV attributes defined. You use the $r.CreateEncryptor() method to generate
    the encryptor.


    Once you''ve generated the encryptor, you have to create a memory stream to do
    the encryption in memory. This is done by declaring the new-Object cmdlet, set
    to the IO.MemoryStream class, and placing the memory stream object in the $ms
    variable.


    Next, you create CryptoStream. CryptoStream is used to transform the unencrypted
    data into the encrypted data. You first declare the new-Object cmdlet with the
    Security.Cryptography.CryptoStream argument. You also define the memory stream
    of $ms, the encryptor of $c, and the operator of "Write" to tell the class to
    write unencrypted data to the encryption stream in memory.


    After creating CryptoStream, you are ready to write the unencrypted data into
    CryptoStream. This is done using the IO.StreamWriter class. You declare a new-Object
    cmdlet with the IO.StreamWriter argument, and define CryptoStream of $cs for writing.'
