    # Installed software detection


    Detecting software on your system can be a difficult task. While the WMI `win32_product`
    class has a record of each **Microsoft Installer (MSI)**-installed software on
    your system, it is strongly recommended you do NOT use this class. When you query
    the `win32_product` class, it reconfigures each MSI software installed on your
    system. This can create unintended service disruptions due to applications being
    reinstalled, configurations being overwritten, and MSI repairs not completing
    successfully:


    ![](img/a27a138d6586c10902d8e86ab3384834_129_0.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: "The preceding screenshot displays one of the multiple messages generated when\
    \ the win32_product class is invoked. You will see that the Windows installer\
    \ forces a reconfiguration of the installed software product. You will also see\
    \ a reconfiguration status and error status message. If you accidentally use the\
    \ win32_product class, you can scan the event log for status messages and properly\
    \ reinstall the application upon error.\n\n![](img/a27a138d6586c10902d8e86ab3384834_130_0.png)\n\
    \n> Avoid using the win32_product class in your scripts. Since the MSI performs\
    \ a repair/reconfiguration of the installed software, this will create instabilities\
    \ in your environment. Use the other methods in this chapter to identify software\
    \ installed on the system.\n\nDue to the limitations with the win32_product class,\
    \ you will need to access multiple areas of the operating system to identify installed\
    \ applications. The first place to start is the registry. Since MSIs, and other\
    \ software installers, place the logic for uninstalling the application in the\
    \ registry, you can identify installed software in the HKLM:\\Software\\Microsoft\\\
    Windows\\CurrentVersion\\Uninstall\\ and HKLM:\\Software\\Wow6432Node\\Microsoft\\\
    Windows\\CurrentVersion\\Uninstall\\ registry key locations. To identify those\
    \ software titles, you have to loop through each sub-key and search for the property:\
    \ DisplayName. If the key does not have a DisplayName property, it is highly likely\
    \ that you need to discover the installed software by leveraging alternative methods.\n\
    \nTo identify installed software by using the registry, you can perform the following:\n\
    \n```\n$RegLocations = \"HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\\
    \nUninstall\\*\",\"HKLM:\\Software\\Wow6432Node\\Microsoft\\Windows\\\nCurrentVersion\\\
    Uninstall\\*\"\n\nforeach ($reg in $RegLocations) {\n    $softwareKeys = get-ItemProperty\
    \ $Reg | Select DisplayName | Sort DisplayName\n    foreach ($software in $softwareKeys)\
    \ {\n        if ($software.DisplayName -ne $null) { Write-host \"Software Found:\
    \ \" $software.DisplayName }\n    }\n}\n```"
  merge: -1
  img_proc: true
