    set to `"c:\temp\KILL_SERVER_SCAN.NOW"`.

    +   2. You then specify the `-ItemType` parameter with the argument of `File`.

    +   3. After execution, the `KILL_SERVER_SCAN.NOW` file will be created on the
    system, and the `new-item` cmdlet will display the file creation.


    To create a termination file remotely on a system, you can leverage a PSSession
    to enable a remote PowerShell session on a system. You can open a PSSession by
    leveraging the Enter-PSSession cmdlet with the -ComputerName parameter set to
    a server name. You can then create the termination file by leveraging the new-item
    cmdlet as you did locally. After running the command, you can leverage the Exit-PSSession
    cmdlet to close the PowerShell session. If you need to leverage different credentials
    to access a server, you can leverage the get-credentials cmdlet to obtain or declare
    new credentials, and store it in a variable. You then can leverage the Enter-PSSession
    cmdlet, the -credential parameter, and the variable containing the credentials
    to authenticate to a PowerShell session with a different user account.


    > PSSession is meant to be manually typed in a PowerShell console. If you execute
    the commands in the script, you will want to build in a delay to ensure you are
    in the PSSession. If you don''t, the commands after the Enter-PSSession cmdlet
    may run locally, versus in the session itself.'
