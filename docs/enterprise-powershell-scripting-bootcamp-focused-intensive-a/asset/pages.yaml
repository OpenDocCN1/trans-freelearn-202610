- pgno: 28
  md: '# 2


    # Script Structure, Comment Blocks, and Script Logging


    The Windows server scanning script requires three core components to make the
    script suitable for enterprise environments. These components include developing
    a strict scripting structure, creating the comment block, and developing a flexible
    logging solution. Strict scripting structures ensure that all your scripts are
    created in the same order. This means that each section of the code is defined
    in the same place in all your scripts. A uniform structure helps others understand
    your code quickly and enables them to follow a standardized format for changes.


    You will also learn how to create a comment block at the beginning of the script.
    The comment block ensures that you fully document the purpose, the requirements,
    the bug fixes, and change history for the script. It also provides details on
    how to execute the script leveraging command line parameters.


    The final core component discussed in this chapter is logging mechanisms. Logging
    mechanisms provide the ability to record information about what is being performed
    during the execution of the script. This information is typically written to log
    files, event logs, and data collection files.


    In this chapter, you will:


    +   - Learn the overall structure of a PowerShell Script

    +   - Create a comment block to describe the script''s function

    +   - Develop a logging platform for your scripts


    ![](img/a27a138d6586c10902d8e86ab3384834_28_0.png)


    > The examples in this chapter build upon each other. You will need to execute
    the script sequentially to have the final script in this chapter work properly.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Overall script structure


    When you are creating scripts, you should adhere to a strict script structure.
    The structure of the script dictates the order of execution and how things are
    processed. The following diagram displays the proper method for organizing your
    script:


    | Code | Description |

    |------|-------------|

    | `<# Comment Block #>` | ← Header |

    | `Param($Input1,$Input2)` | ← Input Parameters |

    | `$CPU = $env:computername` | ← Global Parameters |

    | `Function doSomething { write-host "$cpu Done" }` | ← Functions |

    | `doSomething` | ← Execution of Script |

    | `write-host "Script Complete"` | ← End of Script |


    It is recommended that you structure your scripts as follows:


    +   1. **Declare the comment block:** To start the scripting process, declare
    a comment block and include everything that is pertinent to the script. This may
    include a description, revision information, author, editor, and additional notes.

    +   2. **Declare the input parameters:** After the header, declare your input
    parameters, if required by the script. The input parameters are required to be
    directly after the comment block. Input parameters help the developers identify
    what is being inputted into the script, and what fields are required for proper
    execution of the script.

    +   3. **Declare the global variables:** You should declare your global variables
    after the input parameters. Since variables declared in a function only stay within
    the boundary of the function, the variables you need to use globally should be
    defined here.

    +   4. **Declare the functions in order:** The next portion of the structure is
    declaring your functions. If you have functions that call each other, you will
    want to declare the functions that are needed first in the script. This ensures
    that your scripts will not error out due to the function not being declared prior
    to execution.

    +   5. **Start the execution of the script:** After declaring the functions, you
    can start the execution of the script. This section will call the other functions
    used by the global variables, and parameters to complete the tasks for the script.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '6. **Declare the end of the script:** After execution, it is recommended that
    you create an indicator that specifies that the script has run successfully. Whether
    it is a logging of exit codes to a file or pausing the script at the end, it is
    important for you to create logic to declare proper or improper execution of your
    script.


    # Comment blocks


    The first recommendation is to create comment blocks for detailed tracking information
    about the PowerShell script itself. Comment blocks can track information about
    the script''s creation, authors, changes, and other useful information that will
    enable you to quickly determine what the script is doing. PowerShell has built-in
    comment block support which integrates with the `get-help cmdlet`.


    The required components include the following:


    +   1. **Comment block location:** The comment block must be the first item defined
    at the top of your script. If you use parameter blocks, you specify the parameter
    blocks after the comment block.

    +   2. **Start comment block:** In order to integrate with the help system, you
    need to specify the starting of the comment block. To start a comment block, you
    type `<#`.

    +   3. **.SYNOPSIS:** To create a synopsis for the script, type `.SYNOPSIS` on
    a line, and then on a subsequent line type a one-line description of why the script
    is being created.

    +   4. **.DESCRIPTION:** To create a full description for the script, type `.DESCRIPTION`
    on a line, and then on a subsequent line type a description of the script''s functions
    so that any editor of the script will know the script''s basic function. If it
    is a complicated script or a script that invokes other scripts, describe the overall
    process for it. You may also want to include author information that contains
    the author''s name, author''s position, author''s company, contact information,
    initial release number, and date of the initial release.

    +   5. **.PARAMETER:** To provide parameter information that can be used while
    running the script, you can type `.PARAMETER`, and specify the parameter name.
    On a subsequent line, type a description of that parameter. If you have multiple
    parameters, you can define multiple `.PARAMETER` statements referencing parameter
    names.'
  merge: -1
  img_proc: true
- pgno: 31
  md: "+   6. `.EXAMPLE`: To provide an example of usage for your script, you can\
    \ type `.EXAMPLE` and provide an example on how to run the script from a command\
    \ line. If you have multiple examples, you can define multiple `.EXAMPLE` statements.\n\
    +   \n+   7. `.NOTES`: To provide notes for execution caveats, you can type `.NOTES`,\
    \ and on a subsequent line type a usage note to execute the script.\n+   \n+ \
    \  8. `.LINK`: If you have other help topics you want to link to, you can type\
    \ `.LINK`, and on a subsequent line provide a URL to another help topic.\n+  \
    \ \n+   9. `Ending comment block`: In order to integrate with the help system,\
    \ you need to specify the ending of the comment block. To end a comment block,\
    \ you type `#>`.\n\nThe following screenshot displays a proper comment block that\
    \ will integrate with the help system:\n\n```\n<#\n.SYNOPSIS\nThis is a server\
    \ discovery script which will scan different server components to determine\n\
    the current configuration.\n.DESCRIPTION\nThis script will scan processes, Windows\
    \ services, scheduled tasks, server features, disk information,\nregistry, and\
    \ files for pertinent server information.\nAuthor: Brenton J.W. Blawat / Packt\
    \ Publishing / Author / email@email.com\nRevision: 2.1a - Initial Release of Script\
    \ / 6-22-2018\nRevision: 2.5 - Paul Brandes / Company XYZ / Consultant / email@company.com\
    \ / 11-21-2018\nR2.5 details: Updated script to support systems still running\
    \ PowerShell 2.0.\n.PARAMETER SDD\nThis script requires a server side decryptor\
    \ as a parameter to the script.\n.EXAMPLE\npowershellscript.ps1 /SDD \"ServerSideDecryptor\"\
    \n.NOTES\nYou must have administrative rights to the server you are scanning.\
    \ Certain functions will not work properly\nwithout running the script as system\
    \ or administrator.\n#>\n```\n\nThis properly shows the syntax of a comment block\
    \ that is usable via the PowerShell help system. You start by first defining the\
    \ commend block with <# . You then create a .SYNOPSIS section with a synopsis\
    \ of the script. Then you create a .DESCRIPTION section and provide a detailed\
    \ description of the script. You also provide details regarding the author, revision,\
    \ and editing revisions to the script. Following that section, you define a .PARAMETER\
    \ PATH section, which provides detailed information about the .PARAMETER PATH\
    \ in the script. Next, you create an .EXAMPLE section, to provide an example for\
    \ usage, and you create a .NOTES section to provide information about the required\
    \ execution environment. You then close the comment block by issuing #>."
