- pgno: 110
  md: '# 7


    # Determining Disk Statistics


    Another important component to evaluate with the Windows server scanning script
    is disk statistics. Whether you are scanning to the identify configuration or
    scanning to replace a system, it''s important to evaluate the full disk configuration.
    Through PowerShell, you have the ability to gather information about your physical
    disk layout, your logical disk layout, and even removable devices plugged into
    your system. This can be helpful to identify USB licensing key devices, or even
    external hard drives plugged in to back up the system.


    The Windows server scanning script can also enable you to view the disk size and
    free space of all devices connected to the system. This information can be helpful
    in the event that the system is running low on disk space, or if the drive sizes
    don''t conform to your corporate standards. This chapter will enable you to get
    detailed visibility into the disk configuration on your systems.


    In this chapter, we discuss the following topics:


    +   - Retrieving physical and logical disk information

    +   - Determining the disk types connected to your system

    +   - Converting from disk byte values into megabytes and gigabytes

    +   - Dynamically determining disk unit of measure

    +   - Creating a disk information script to query the disks on a system, convert
    disk size and freespace, calculate units of measure, and identify drive types


    > For the best results with the examples in this chapter, it is recommended to
    use a system with multiple disks. You may also choose to plug in external hard
    disks or USB drives to emulate additional storage devices.


    ![](img/a27a138d6586c10902d8e86ab3384834_110_0.png)'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Disk statistics


    Whether you are capacity-planning or planning for server replacements, there are
    many reasons why you may want to evaluate disk information. PowerShell offers
    several methods to retrieve disk information. If you want to learn more about
    the physical disks on your system, you can leverage the `get-disk` cmdlet. The
    `get-disk` cmdlet provides information such as Number, Friendly Name, Serial Number,
    HealthStatus, OperationalStatus, Total size, and Partition Style.


    ![](img/a27a138d6586c10902d8e86ab3384834_111_0.png)


    > To determine all of the properties available to the `get-disk` cmdlet, you can
    execute `get-disk | get-member`. This will display all of the available methods
    and properties for the physical disks.


    # Retrieving physical and logical disk information


    To retrieve disk information about the physical disks on your system, you can
    perform the following command:


    ```

    get-disk

    ```


    The output of this is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_111_1.png)


    This example displays how to get information about the physical disks on a system.
    When you execute the `get-disk` cmdlet, the cmdlet returns the disk Number, Friendly
    Name, Serial Number, HealthStatus, OperationalStatus, TotalSize, and Partition
    Style. The system this example was run on had five logical devices connected,
    which are reflected in the output from the cmdlet.


    When you want to determine more information about the operating system usage of
    a disk, you can leverage Windows Management Instrumentation (WMI). To read the
    logical disk information, you can use the `get-wmiobject` cmdlet with the `-class`
    parameter set to the `win32_logicaldisk` argument. When you query the `win32_logicaldisk`
    class, you can access the DeviceID, DriveType, ProviderName, FreeSpace, Size,
    and Volume name properties.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'To query the win32_logicaldisk class for disk information, you can perform
    the following:


    ```

    Get-WmiObject -class win32_logicaldisk

    ```


    The output of this is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_112_0.png)


    The following example displays how to leverage get-wmiobject to query WMI to provide
    disk information:


    +   1. You start by leveraging the get-wmiobject cmdlet with the -class parameter
    set to the win32_logicaldisk argument.

    +   2. After execution, the cmdlet returns the DeviceID, DriveType, ProviderName,
    FreeSpace, Size, and VolumeName properties.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "The system this example was run on had six devices connected, reflected in\
    \ the output from the cmdlet. This differs from the get-disk cmdlet, and the WMI\
    \ provider accounts for the empty CD-ROM/DVD drive.\n\n# The DriveType property\n\
    \nThe DriveType property represents a numerical value that translates to a type\
    \ of drive. This value ranges from 0 to 6, depending on the type of physical device\
    \ connected. The DriveType correlation is as follows:\n\n+   - 0: Unknown device\
    \ type\n+   - 1: Drive does not have a root directory\n+   - 2: Removable disk\
    \ (USB key)\n+   - 3: Local disk (hard drive/USB hard drive/virtual drive mount)\n\
    +   - 4: Network drive/mapped drive\n+   - 5: Compact disk (CD/DVD drive)\n+ \
    \  - 6: RAM drive (memory mapped drive/PE OS drive)\n\nTo quickly determine the\
    \ DriveType property correlation, you can perform the following switch command:\n\
    \n```\n```powershell\n$disks = get-wmiobject win32_logicaldisk\nForeach ($disk\
    \ in $disks) {\n    $driveletter = $disk.DeviceID\n    switch ($disk.DriveType)\
    \ {\n        0 { $type = \"Type Unknown.\" }\n        1 { $type = \"Doesn't have\
    \ a Root Directory.\" }\n        2 { $type = \"Removable Disk (e.g. USB Key)\"\
    \ }\n        3 { $type = \"Local Disk (e.g. Hard Drive / USB hard drive / Virtual\
    \ drive mount)\" }\n        4 { $type = \"Network Drive (e.g. Mapped Drive)\"\
    \ }\n        5 { $type = \"Compact Disk (e.g. CD/DVD Drive)\" }\n        6 { $type\
    \ = \"RAM Disk (e.g. Memory Mapped Drive / PE OS Drive)\" }\n        default {\
    \ $type = \"Unable To Determine Drive Type!\" }\n    }\n    Write-host \"Drive:\
    \ $driveletter | Disk Type: $type\"\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 114
  md: 'The output of this script is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_114_0.png)


    In this example, you create a switch statement to correlate DriveType numbers
    with readable values:


    +   1. You start by using `get-wmiobject` with the `win32_logicaldisk` argument
    and storing the drive information in the `$disks` variable.

    +   2. You then create a `Foreach` statement to evaluate each `$disk` in the `$disks`
    variable.

    +   3. You then gather the drive letter by calling the `$disk.DeviceID` property
    and setting the value in `$driveletter`.

    +   4. You then start your `switch` statement and evaluate the `$disk.DriveType`
    value.


    The `switch` statement evaluates the number and correlates it to a readable value.
    If the `DriveType` is 0, it will set the `$type` variable to Type Unknown. If
    the `DriveType` is 1, it will set the `$type` variable to Doesn''t have a Root
    Directory. If the `DriveType` is 2, it will set the `$type` variable to Removable
    Disk (e.g. USB key). If the `DriveType` is 3, it will set the `$type` variable
    to Local Disk (e.g. Hard Drive / USB hard drive / Virtual drive mount). If the
    `DriveType` is 4, it will set the `$type` variable to Network Drive (e.g. Mapped
    Drive). If the `DriveType` is 5, it will set the `$type` variable to Compact Disk
    (e.g. CD/DVD Drive). If the `DriveType` is 6, it will set the `$type` variable
    to RAM Disk (e.g. Memory Mapped Drive / PE OS Drive).


    +   5. After these evaluations, you then leverage the `write-host` cmdlet to print
    to the screen: Drive: `$driveletter` | Disk Type: `$type`.'
  merge: -1
  img_proc: true
- pgno: 115
  md: "The system this example was run on had five logical devices connected, with\
    \ different drive types. The different drive types are reflected in the output\
    \ from the cmdlet.\n\n# Converting disk space to MB and GB\n\nWhen working with\
    \ the Size and FreeSpace properties of the logical disks, the values are represented\
    \ in bytes. PowerShell offers a quick method to convert bytes into multiple formats.\
    \ You can take the Size or FreeSpace properties and divide them by 1MB for megabytes,\
    \ 1GB for gigabytes, 1TB for terabytes, and 1PB for petabytes. After the conversion,\
    \ however, you often need to round the numbers, leveraging the [System.Math]::Round()\
    \ method. By default, this .NET Round() method rounds to the closest full number.\
    \ To include decimal places, you can provide an additional numerical argument,\
    \ such as [System.Math]::Round($value,2), to round the $value to two decimal places.\n\
    \nTo convert the disk Size property to megabytes and gigabytes, you can perform\
    \ the following actions:\n\n```\n$disks = get-wmiobject win32_logicaldisk\nForeach\
    \ ($disk in $disks) {\n    $driveletter = $disk.DeviceID\n    $sizeMB = [System.Math]::Round(($disk.size\
    \ / 1MB),2)\n    $sizeGB = [System.Math]::Round(($disk.size / 1GB),2)\n    Write-host\
    \ \"$driveletter | Size (in MB): $sizeMB | Size (in GB): $sizeGB\"\n}\n```\n\n\
    The output of this script is shown in the following screenshot:\n\n![](img/a27a138d6586c10902d8e86ab3384834_115_0.png)"
  merge: -1
  img_proc: true
- pgno: 116
  md: 'This example displays how to format a hard drive `Size` property to megabytes
    and gigabytes:


    +   1. You first start the script by leveraging the `get-wmiobject` cmdlet with
    the `win32_logicaldisk` argument and place the returned values in the `$disks`
    variable.

    +   2. You then create a `Foreach` statement to evaluate each `$disk` in the `$disks`
    variable.

    +   3. You evaluate the `$disk.DeviceID` property and set the drive letter value
    to the `$driveletter` variable.

    +   4. You then leverage the `[System.Math]::Round()` method to round the value
    of the calculation from the `$disk.Size` parameter, divided by 1MB.

    +   5. You also pass the `,2` argument into the method to provide two decimal
    places in the calculation.

    +   6. You store the output of this value in the `$sizeMB` variable.

    +   7. You continue to leverage the `[System.Math]::Round()` method to round the
    value of the calculation from the `$disk.Size` parameter, divided by 1GB.

    +   8. You again pass the `,2` argument into the method to provide two decimal
    places in the calculation.

    +   9. You store the output of this value in the `$sizeGB` variable.

    +   10. Finally, you leverage the `write-host` cmdlet to print to the screen:`$driveletter
    | Size (in MB): $sizeMB | Size (in GB): $sizeGB`.

    +   11. After executing this script on the system, you see that each drive letter
    is printed and the `Size` in MB and the size in GB are displayed.


    You will also see that all of the values are rounded to two decimal places, unless
    they calculate to whole numbers. You will also see in the example that one drive
