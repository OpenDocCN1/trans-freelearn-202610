- pgno: 61
  md: "After you load System.Security Assembly, you can start creating the encryption\
    \ function. RijndaelManaged encryption requires a four-step process to encrypt\
    \ the strings, which is represented in the preceeding diagram.\n\nThe RijndaelManaged\
    \ encryption process is as follows:\n\n+   1. The process starts by creating the\
    \ encryptor. The encryptor is derived from the encryption key (password and salt)\
    \ and initialization vector.\n+   2. After you define the encryptor, you will\
    \ need to create a new memory stream using the IO.MemoryStream object. A memory\
    \ stream is what stores values in memory for use by the encryption assembly.\n\
    +   3. Once the memory stream is open, you define a System.Security.Cryptography.CryptoStream\
    \ object. The CryptoStream is the mechanism that uses the memory stream and the\
    \ encryptor to transform the unencrypted data to encrypted data. In order to leverage\
    \ the CryptoStream, you need to write data to the CryptoStream.\n+   4. The final\
    \ step is to use the IO.StreamWriter object to write the unencrypted value into\
    \ the CryptoStream. The output from this transformation is placed into MemoryStream.\
    \ To access the encrypted value, you read the data in the memory stream.\n\n>\
    \ To learn more about the System.Security.Cryptography.RijndaelManaged class,\
    \ you can view the following MSDN article: https://msdn.microsoft.com/en-us/library/system.security.cryptography.rijndaelmanaged(v=vs.110).aspx.\n\
    \nTo create a script that encrypts strings using RijndaelManaged encryption, perform\
    \ the following:\n\n```\nAdd-Type -AssemblyNameSystem.Security\nfunction Encrypt-String\
    \ { param($String, $Pass,\n$salt=\"CreateAUniqueSalt\", $init=\"CreateAUniqueInit\"\
    )\ntry{\n    $r = new-Object System.Security.Cryptography.RijndaelManaged\n  \
    \  $pass = [Text.Encoding]::UTF8.GetBytes($pass)\n    $salt = [Text.Encoding]::UTF8.GetBytes($salt)\n\
    \    $init = [Text.Encoding]::UTF8.GetBytes($init)\n```"
  merge: -1
  img_proc: true
- pgno: 62
  md: "```\n$r.Key = (new-Object Security.Cryptography.PasswordDeriveBytes\n$pass,\
    \ $salt, \"SHA1\", 50000).GetBytes(32)\n$r.IV = (new-Object Security.Cryptography.SHA1Managed).\n\
    ComputeHash($init)[0..15]\n\n$c = $r.CreateEncryptor()\n$ms = new-Object IO.MemoryStream\n\
    $cs = new-Object Security.Cryptography.CryptoStream\n$ms,$c,\"Write\"\n$sw = new-Object\
    \ IO.StreamWriter $cs\n$sw.Write($String)\n$sw.Close()\n$cs.Close()\n$ms.Close()\n\
    $r.Clear()\n[byte[]]$result = $ms.ToArray()\n}\ncatch {\n    $err = \"Error Occurred\
    \ Encrypting String: $_\"\n}\nif($err) {\n    # Report Back Error\nreturn $err\n\
    }\nelse {\nreturn [Convert]::ToBase64String($result)\n}\n}\nEncrypt-String \"\
    Encrypt This String\"\"A_Complex_Password_With_A_Lot_Of_Characters\"\n```"
