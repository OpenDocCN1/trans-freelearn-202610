- pgno: 124
  md: '# 8

    Windows Features and Installed Software Detection


    Part of discovering a system''s function is determining what Windows features
    and software titles are installed. In an enterprise environment, it is sometimes
    difficult to determine what is installed on individual systems. While you can
    manually log in to servers and evaluate the configurations, it can take a very
    long time to gather all of the server information.


    The Windows server scanning script makes it easy to scan individual Windows features,
    roles, and software through a variety of cmdlets. You will learn how to scan the
    registry and individual executable files for information about installed software
    on your system. This enables you to detect both software that you''d find in add/remove
    programs, and software that does not add an installed entry in add/remove programs.


    In this chapter, you will:


    +   - Use the `get-windowsFeature` cmdlet to retrieve server features and roles

    +   - Evaluate the `win32_serverfeature` class for feature and roles on legacy
    systems

    +   - Correlate Windows features, role IDs, and parent IDs to user-friendly names

    +   - Learn why you should not use the `win32_product` class for software discovery

    +   - Leverage the registry to determine installed software

    +   - Scan `Program Files` and `Program Files (x86)` for installed software information'
  merge: -1
  img_proc: true
- pgno: 125
  md: '> To follow the examples in this chapter, it is recommended that you run the
    examples on a Windows Server 2012 system. Some of the cmdlets referenced in this
    chapter are not available in PowerShell 2.0, workstation operating systems, or
    in operating systems older than Server 2008 R2.


    # Windows features


    When you are trying to determine the function of a Windows server, typically you
    start by evaluating the Windows features and roles. PowerShell has multiple methods
    to query server features and roles on a system. The get-WindowsFeature cmdlet,
    available in Server 2008 R2 and higher, provides a simple display of the features
    and roles installed on a system. The get-WindowsFeature cmdlet has multiple properties
    including the DisplayName property, Name property, Installed property, Parent
    property, and the InstallState property. The DisplayName property is the friendly
    name of the service. The Name property is the short version of DisplayName. The
    Installed property is a true or false property that reflects if the feature is
    installed. The InstallState property provides information as to whether the feature
    is installed, removed, or available for installation.


    To query a server for the installed server features, you can perform the following:


    ```

    get-WindowsFeature | where {$_ .Installed -eq $true} | Select DisplayName, InstallState,
    Parent

    ```


    The output of this is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_125_0.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'In this example, you display how to leverage the get-WindowsFeature cmdlet
    to report installed Windows features:


    +   1. You start by calling the get-WindowsFeature cmdlet and piping it to where
    {$_.Installed -eq $true}. This selects all the Windows features installed on the
    system. You then pipe those results to the Select cmdlet to gather the DisplayName,
    InstallState, and Parent properties.

    +   2. After execution, you see all of the Windows features installed on the server
    system, inclusive of their DisplayName, InstallState, and Parent properties.


    On systems that are older than Windows Server 2008 R2, or that have PowerShell
    2.0 installed on them, the get-WindowsFeature cmdlet is not available. Instead,
    you can leverage the Windows Management Instrumentation (WMI) to provide a list
    of installed server features. You first start by calling the get-wmiobject cmdlet
    with the win32_serverfeature class as the argument. After execution, you only
    receive the features installed on the system. The number of available properties
    is also limited to ID, Name, and ParentID.


    To query a server for the installed server features on systems older than Windows
    Server 2008 R2, or that have PowerShell 2.0, you can perform the following:


    ```

    get-wmiobject win32_serverfeature | select ID, Name, ParentID

    ```


    The output of this is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_126_0.png)'
