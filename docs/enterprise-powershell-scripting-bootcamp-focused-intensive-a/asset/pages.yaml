    # Windows server scanning script creation


    As you start building your version of the Windows server scanning script, you
    will want to follow a script structure. When you use a standardized script structure,
    you organize your code into different sections. This allows you to quickly find
    components in your scripts and add to the individual sections. It also provides
    an easy platform for others to quickly learn and modify your scripts.


    The following sections make up the Windows server scanning script:


    **Comment block**: This is where you describe the function of the script.


    **Parameter block**: This is where you can pass in variables and data into the
    script, such as the Runtime Decryptor.


    **Answer file reading function**: This enables you to dynamically read the different
    values in the answer file.


    **Decryption function**: This enables you to decrypt encrypted strings during
    runtime.


    **Populating script answers into variables and arrays**: This will take the output
    from the answer file reading function to populate variables and arrays. This also
    enables you to dynamically build regular expressions from the answer file data.


    **Create log files and logging functions**: This will enable you to log the different
    actions of the script, record data found by the script, write output to the screen,
    and even write events to the event log.


    **Creating a termination function**: The termination function will enable you
    to check multiple times if a termination file is placed on the system. This will
    terminate the scanning script if present.


    **Multiple script functions**: This is where you define all of the functions to
    scan different components of the system.'
