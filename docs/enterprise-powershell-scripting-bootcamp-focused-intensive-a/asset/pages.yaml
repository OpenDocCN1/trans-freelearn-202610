- pgno: 107
  md: 'This example displays how to update an existing scheduled task to have two
    new scheduled task actions:


    +   1. You first start by calling the `New-ScheduledTaskAction` cmdlet with the
    `-Execute` parameter and the `calc.exe` argument.

    +   2. You place this scheduled action task object in the `$schAction1` variable.

    +   3. You then call the `New-ScheduledTaskAction` cmdlet with the `-Execute`
    parameter and the `notepad.exe` argument.

    +   4. You place this scheduled action task object in the `$schAction2` variable.

    +   5. Finally, you call the `Set-ScheduledTask` cmdlet with the `-TaskName` parameter
    set to `Start Calc Daily at 11PM`. You also call the `-Action` parameter and declare
    both actions: `$schAction1`, `$schAction2`. After execution, a scheduled task
    is set up for 11:00 pm and will launch both `calc.exe` and `notepad.exe`.


    > At the time of writing, there is no native way to rename a scheduled task. In
    order to perform this, you need to export the scheduled task to XML, and register
    a new scheduled task with the XML file. More information on the export process
    can be found here: https://technet.microsoft.com/itpro/powershell/windows/scheduled-tasks/export-scheduledtask.


    # Identifying scheduled tasks running as alternate users


    There may be instances where you need to identify scheduled tasks that are running
    with non-default credentials. If a user leverages their identity to run a scheduled
    task, or you are leveraging a service account, you will need to identify its usage
    on a system. The `Get-ScheduledTasks` cmdlet has the Principal property, which
    contains information about the user account running the scheduled task. The `UserID`
    reflects the username of the account that is designated to run the scheduled task.


    In addition to identifying the Principal UserId, you will need to filter out built-in
    Windows accounts. To perform this, you can create a switch statement to make multiple
    evaluations of the Principal UserIds. If the process owner username is `NETWORK
    SERVICE`, `LOCAL SERVICE`, `$null`, or `System`, you can skip reporting the username.
    If it doesn''t match any of those values, it will use the default switch and report
    the user to a list. Since multiple scheduled tasks run under the same user, you
    can pipe the user results to the `get-unique` cmdlet, which will only select the
    unique values in the array.'
  merge: -1
  img_proc: true
- pgno: 108
  md: "To evaluate scheduled tasks and obtain a list of accounts running scheduled\
    \ tasks, you can perform the following actions:\n\n```\n$users = @()\n$schtasks\
    \ = Get-ScheduledTask\nforeach ($Task in $schtasks) {\n    $tskUser = $Task.Principal.UserId\n\
    \    switch ($Task.Principal.UserId) {\n\"NETWORK SERVICE\" { $continue = \"Skip\
    \ User\" }\n\"LOCAL SERVICE\" { $continue = \"Skip User\" }\n\"SYSTEM\" { $continue\
    \ = \"Skip User\"}\n\"$null\" { $continue = \"Skip User\" }\n        default {\
    \ $continue = \"Report User\" }\n    }\n    if ($continue -eq \"Report User\"\
    ) {\n\n        $users += $tskUser\n    }\n}\n$users | Get-Unique\n```\n\nThe output\
    \ of this is shown in the following screenshot:\n\n![](img/a27a138d6586c10902d8e86ab3384834_108_0.png)"
  merge: -1
  img_proc: true
- pgno: 109
  md: 'This example displays how to output non-built-in user accounts running scheduled
    tasks:


    +   1. You start by defining an array named `$users`.

    +   2. You then leverage the `Get-ScheduledTask` cmdlet, placing the result in
    the `$schtasks` variable.

    +   3. You then create a `foreach` loop to loop through each `$Task` in the `$schtasks`
    variable.

    +   4. You proceed to gather the iterative scheduled task''s `Principal.UserID`
    by using the `$Task.Principal.UserID` property and place it in the `$tskUser`
    variable.

    +   5. You then declare a `switch` statement evaluating the `$Task.Principal.UserID`
    property. The first evaluations are for built-in accounts. If the accounts are
    `NETWORK SERVICE`, `LOCAL SERVICE`, `SYSTEM`, or `$null`, it will set `$continue`
    to `Skip User`. If it doesn''t match any of these built-in users, it will leverage
    the `default` value, which sets the `$continue` variable to `Report User`.

    +   6. After exiting the `switch` statement, you evaluate the `$continue` variable
    with an `If` statement, and proceed if the value is equal to `Report User`. This
    step will add the `$tskUser` variable to the `$users` array.


    After the `foreach` loop completes, you will have a large number of users listed
    for each non-built-in user. To trim the list to individual or unique users, you
    pipe the `$users` variable to the `get-unique` cmdlet. The result is a list of
    unique non-built-in users on the system.


    The system the example was run on has two non-default user accounts:

    `POSHDEMO\bblawat` and `POSHDEMO\svcSchTasks`.


    # Summary


    In this chapter, you learned how to work with scheduled tasks in PowerShell. You
    started by learning how to get scheduled tasks on a system. You then learned how
    to set scheduled task triggers, scheduled task actions, and scheduled task setting
    sets. You continued by creating a scheduled task object and registering it with
    the system. You also learned how to unregister a scheduled task to remove it from
    the system. You then worked through updating an existing scheduled task. You completed
    the chapter by learning how to identify any users or service accounts whose permissions
    are being used to run the scheduled task.


    In the next chapter, you will be learning how to query the system to determine
    disk statistics such as free space, disk utilization, and drive type determinations.'
