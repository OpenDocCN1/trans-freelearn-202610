- pgno: 80
  md: 'You also have the ability to modify different aspects of the Windows services
    by using the set-service cmdlet. The set-service cmdlet can modify the service
    descriptions, start-up types, and even the display names for services. Since Windows
    does not allow you to modify running services, you first have to leverage the
    stop-service cmdlet to stop the service for editing.


    If you want to modify the start-up type for a service, you can leverage the set-service
    cmdlet with the -Name parameter with the corresponding service name. You then
    include the -startup type parameter with Automatic for automatic start-up, Manual
    for manual start-up, or Disabled to disable the service start-up. To view the
    changes to the service start-up type, you will need to leverage the get-wmiobject
    cmdlet referencing the win32_service class, and the -filter parameter referencing
    DisplayName=''Display Name''.


    ![](img/a27a138d6586c10902d8e86ab3384834_80_0.png)


    > While in most cases you can leverage the Get-service cmdlet to display the properties
    of a service, there are certain properties that are not made available to the
    cmdlet. As a result, you may have to directly query WMI using the get-wmiobject
    to view all of the properties for that service. To view all of the properties
    available to Get-service or through WMI, you can pipe | the results to get-member,
    and it will display all the available properties you can view.


    To change the Windows Audio -startup type parameter, you can do the following:


    ```

    (get-wmiobject win32_service -filter "DisplayName=''Windows Audio''").StartMode

    stop-service -name "Audiosrv"

    set-service -name "Audiosrv" -startup "Manual"

    (get-wmiobject win32_service -filter "DisplayName=''Windows Audio''").StartMode

    set-service -name "Audiosrv" -startup "Automatic"

    (get-wmiobject win32_service -filter "DisplayName=''Windows Audio''"

    ).StartMode

    Start-service -name "Audiosrv"

    ```'
