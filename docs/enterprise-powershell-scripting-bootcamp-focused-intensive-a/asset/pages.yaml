    # Excluding long paths


    With enterprise file servers, you may run into situations where the folder structures
    and file character count are over 248 characters. Windows, by default, restricts
    the use of long file paths to 248 characters in length. It is not uncommon to
    have Linux-based file servers, or mapped network drives with long file paths that
    go over the 248-character limit.'
