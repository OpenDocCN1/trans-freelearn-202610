  md: "+   10. You close the $sr, $cs, and $ms objects.\n+   11. You clear the $r\
    \ variable and return the result of $result to the portion of the script that\
    \ called the function.\n+   12. If there is an error during the decryption process,\
    \ the script will leverage the write-host cmdlet to display \"Error Occurred Decrypting\
    \ String: Wrong String Used In Script\".\n\n# Populating script answers in variables\
    \ and arrays\n\nThe next step in the Windows server scanning script is to populate\
    \ the data from the answer file into the variables and arrays. When you access\
    \ the answer file data in memory, you will need to manipulate the data for use\
    \ in the script. For example, the search data will have encrypted values that\
    \ need to be decrypted, the ignore lists will need to be made into regular expressions,\
    \ and the search extensions will need to be put into an array.\n\nSince you will\
    \ be dynamically making more than one regular expression for the script, it is\
    \ best practice to make a function that generates the regular expressions. The\
    \ script will be able to run without values in the file search data, the file\
    \ ignore list, the search ignore list, and the built-in user list. You will need\
    \ to verify that the list being passed into the function is not blank. A regular\
    \ expression that is blank, or populated with no values, will match all values\
    \ as true. This will cause execution issues in your script and this should be\
    \ avoided.\n\nTo work around this issue, if you detect that the list is blank,\
    \ you set the list value to a string that would not be matched on the system,\
    \ such as No_Input_Provided_For_List_Item. When the regular expression is evaluated\
    \ with that expression, it will be highly unlikely that the expression will match\
    \ the criteria.\n\nTo create a function to dynamically create regular expressions,\
    \ you can do the following:\n\n```\n```powershell\nfunction create-SearchRegEx\
    \ { param($list)\n    if (! $list) { $list = \"No_Input_Provided_For_List_Item\"\
    \ }\n    $RegEx = '(?i)^.*(' + (($list | % {[regex]::escape($_)}) -join \"|\"\
    ) + ').*$'\n    return $regex\n}\n```\n```"
