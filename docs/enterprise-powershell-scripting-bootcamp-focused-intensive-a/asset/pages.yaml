- pgno: 16
  md: '# Preface


    PowerShell is quickly becoming the language of choice to support Microsoft systems
    in organizations. With Microsoft''s deep integration of PowerShell in all of their
    software and cloud services, scripting knowledge will be a required skill set
    in the years to come. Even third-party vendors are creating modules or plugins
    to extend the PowerShell manageability of their systems. As a result, organizations
    are relying on their cross-platform engineers to automate systems through the
    use of PowerShell.


    When you are implementing PowerShell scripts in enterprise environments, there
    are many common challenges that need to be solved. Robust logging functions, for
    example, are typically required to ensure that the script ran successfully and
    as intended. You may also need to implement a string encryption strategy to encrypt
    credentials, server host names, IP addresses, or other sensitive data. Further
    more, script execution speed may also take some consideration when processing
    large sets of data. You will want to ensure you are leveraging the fastest coding
    methods possible to optimize your scripting performance.


    All of these challenges, and many more, can be solved by leveraging PowerShell.
    Through both native cmdlets and the .NET Framework, you can create sophisticated
    scripts to solve almost any problem. The PowerShell community of developers is
    very passionate about sharing their knowledge and providing information on how
    to solve problems. Through code sharing websites, social media, and Microsoft''s
    TechNet, there is always a constant stream of examples that you can implement
    in your code. Also, now that PowerShell is open source and available on Linux,
    it deepens the relationships with the open source community. It provides a much
    wider set of open source developers to solve enterprise problems.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'This book has been designed to teach you the ins and outs of enterprise PowerShell
    scripting. It is geared towards real-world scenarios of how Fortune 500 companies
    leverage PowerShell to solve problems. It provides a scripting framework that
    you can easily follow to start integrating the examples into your own scripts.
    At the end of this book, you will have learned many techniques to secure, optimize,
    and deliver PowerShell scripts that are ready to be deployed in the enterprise.


    # What this book covers


    Chapter 1, Getting Started with Enterprise PowerShell Scripting, introduces the
    Windows server scanning script and performance considerations, and helps you create
    your own PowerShell scripting templates.


    Chapter 2, Script Structure, Comment Blocks, and Script Logging, explores how
    to structure your PowerShell scripts, how to properly comment your script, and
    how to create a robust logging function.


    Chapter 3, Working with Answer Files, explains the purpose of XML-based answer
    files and displays how to leverage them in your scripts.


    Chapter 4, String Encryption and Decryption, dives into advanced string encryption
    and encoding methodologies. It shows you how to securely store encrypted data
    in scripts, and a how to decrypt and decode values during runtime.


    Chapter 5, Interacting with Services, Processes, Profiles, and Logged-on Users,
    evaluates different Windows server components for nonstandard configurations.
    It also evaluates logged-on users and user profiles to identify what users have
    been interacting with a particular system.


    Chapter 6, Evaluating Scheduled Tasks, displays how to interact with scheduled
    tasks on a system. It helps identify the different processes that may be invoked
    on a scheduled basis on a system.


    Chapter 7, Determining Disk Statistics, explores how to interact with the disks
    on a system to retrieve and record disk information.


    Chapter 8, Windows Features and Installed Software Detection, explains how to
    review the installed Windows features and installed software on a system.


    Chapter 9, File Scanning, dives into scanning for file types in directories on
    a server. It also displays the process to scan for strings in files.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chapter 10, Optimizing Script Execution Speed, evaluates how to increase server
    performance through the use of different scripting techniques. It also evaluates
    how to measure command execution time for benchmarking script performance.


    Chapter 11, Improving Performance Using Regular Expressions, displays how to leverage
    regular expressions to significantly increase the performance of your PowerShell
    scripts.


    Chapter 12, Overall Script Workflow, Termination Files, and Merging Data Results,
    evaluates the overall Windows server scanning script workflow and the full answer
    file creation. It also explores when and why you would use termination files and
    how to merge the results from the Windows server scanning script.


    Chapter 13, Creating the Windows Server Scanning Script and Post Execution Cleanup,
    provides an in-depth explanation of all of the components in the Windows server
    scanning script. It also provides cleanup considerations for postscript execution
    on systems.


    # What you need for this book


    To work through the examples provided in Enterprise PowerShell Scripting Bootcamp,
    you will need access to two Server 2012 R2, or greater, Windows Server operating
    systems. Preferably, both systems will be joined to a domain. The chapters in
    this book highly rely on Windows Management Framework and it is recommended to
    leverage version 5.0 for PowerShell 5.0. You will need to download and install
    Windows Management Framework on the systems you are running these examples on.


    # Who this book is for


    Enterprise PowerShell Scripting Bootcamp has been designed for PowerShell scripters
    that are both beginner- and advanced-level coders. After reading this book, you
    will have in-depth knowledge of PowerShell scripting in enterprises and will create
    a working script to execute in your environment. Previous scripting and basic
    coding experience is required to understand the concepts presented in this book.


    # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.'
  merge: -1
  img_proc: true
