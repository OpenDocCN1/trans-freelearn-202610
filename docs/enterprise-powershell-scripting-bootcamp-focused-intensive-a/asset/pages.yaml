- pgno: 232
  md: '# Running the script


    The very last step in the script process is invoking the Windows server scanning
    script. You will need to ensure that you have the answer file in the same directory
    as the script. You will also want to make sure that you keep a copy of the answer
    file, because the Windows server scanning script will remove the answer file after
    execution.


    To execute the Windows server scanning script from a command line, you can perform
    the following:


    ```

    powershell.exe -executionPolicy bypass -noexit -file"c:\temp\ScanningScript.ps1"
    "AAZwAmAE4AMgAoAFEAVA...AhAF..."

    ```


    The output of this is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_232_0.png)


    In this example, you successfully launch the Windows server scanning script:


    +   1. You first start by calling the powershell.exe executable from an elevated
    command prompt.

    +   2. You bypass the PowerShell execution policy by leveraging the -executionPolicy
    parameter with the bypass argument.

    +   3. You then leverage the -noexit parameter to ensure that the PowerShell session
    doesn''t exit after execution.

    +   4. You then leverage the -file parameter with the c:\temp\ScanningScript.ps1
    script name and location. You will need to update this value to match the name
    of your script.

    +   5. Finally, you include the runtime decryptor of "AAZwAmAE4AMgAoAFEAVA...AhAF..."
    as the final argument for invoking the Windows server scanning script.'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'After executing this command, you will see that the Windows server scanning
    script will start executing on the system.


    # Performing script cleanup


    Once you are done executing a PowerShell script on a system, you will need to
    evaluate the data footprint that you are leaving on the system. If you are creating
    files, you will want to make sure that they don''t contain sensitive data. If
    you are leveraging answer files, you will want to make sure that they''re removed
    from the system.


    Some of the common script cleanup activities include:


    +   - **Delete answer files**: Since answer files typically contain sensitive
    information, you will want to verify that the files have been deleted at the end
    of your script.

    +   - **Delete supporting files**: Any files that are used for installation of
    software should be removed from the system.

    +   - **Delete sensitive files**: If you are performing data collection for sensitive
    information, you will want to make sure that you delete the files from the system.
    In some cases, you may want to encrypt the data as its being written to ensure
    a secure data gathering experience.

    +   - **Ensure all script-created processes and jobs have completed**: In some
    instances, your PowerShell scripts may invoke additional processes and jobs on
    the system. Before exiting PowerShell, you should verify that all processes and
    jobs have completed successfully.


    # Summary


    In this chapter, you learned how to compose a Windows server scanning script.
    You started the chapter learning about the structure of the Windows server scanning
    script. You proceeded to the core scripting components section where you defined
    the comment block, parameter block, created the answer file reading function,
    the decryption function, populated the answer files, created the script''s logs
    and logging functions, and created the check-kill function.'
  merge: -1
