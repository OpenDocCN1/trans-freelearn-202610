- pgno: 98
  md: '# 6


    # Evaluating Scheduled Tasks


    Enterprises leverage scheduled tasks for a multitude of purposes. Whether it is
    to process business transactions or to provide health checks, they have become
    the standard for running actions on a scheduled basis. Scheduled tasks are flexible,
    in that they can also be run on logon, after a certain event is triggered, or
    even manually. Scheduled tasks can run executables, or even start scripts to extend
    limitless possibilities for automation.


    Due to the wide variety of uses for scheduled tasks, it''s important to scan them
    with the Windows server scanning script. This will help you identify processes
    that only run on a triggered or scheduled basis, such as a quarterly report or
    a nightly process. It can also be used to identify alternate user accounts that
    are used to run these scheduled tasks. Since scheduled tasks are so flexible,
    it''s essential to capture what the scheduled tasks are doing, how they are invoked,
    and what account is designated to run the task.


    In this chapter, you will:


    +   - Understand how to view scheduled tasks on a system

    +   - Create scheduled task triggers, actions, and setting set objects

    +   - Leverage the triggers, actions, and setting sets to create a scheduled task
    object

    +   - Register and unregister scheduled tasks with a system

    +   - Update an existing scheduled task with new actions

    +   - Identify scheduled tasks running as alternate user accounts'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Scheduled tasks


    Scheduled tasks enable you to schedule automated actions on a system. Microsoft
    has a wide variety of built-in scheduled tasks, which include time synchronization,
    universal plug and play, Windows updates, and disk defragmentation. These task
    actions are invoked by different trigger criteria and automatically run on your
    system.


    You can retrieve the list of scheduled tasks on a system by using the get-scheduledtask
    cmdlet. The get-scheduledtask cmdlet reveals a list of scheduled task names, their
    taskpath, and their current state. You may also return other properties such as
    author, date, description, version, and documentation.


    To retrieve and count scheduled tasks on a system, you can leverage the following:


    ```

    get-scheduledtask

    (get-scheduledtask).count

    ```


    The output of this command would look like this:


    ![](img/a27a138d6586c10902d8e86ab3384834_99_0.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'This example displays how to retrieve scheduled tasks on a system and how to
    count the total number of tasks:


    +   1. You first start by calling the get-scheduledtask cmdlet. You will see a
    long list of scheduled tasks displayed on your system.

    +   2. You then execute the get-scheduledtask cmdlet with the .count method. The
    system in this example returns 165 scheduled tasks.


    The two components that are required to create a scheduled task are the task action
    and task trigger. Task triggers start the scheduled task. The most common triggers
    are on a schedule, at logon, at startup, on idle, on an event, and manual. In
    order to use a trigger, you must leverage the New-ScheduledTaskTrigger cmdlet
    to create a new task trigger object. You will then need to store the task trigger
    object in a variable for creating the scheduled task.


    To create a scheduled task trigger on a schedule, you can perform the following:


    ```

    $schTrigger = New-ScheduledTaskTrigger -Daily -DaysInterval 1 -At "23:00"

    $schTrigger

    ```


    The output of this command would look like this:


    ![](img/a27a138d6586c10902d8e86ab3384834_100_0.png)


    In this example, you learn how to create a scheduled task trigger:


    +   1. You first start by calling the New-ScheduledTaskTrigger cmdlet with the
    -Daily parameter, the -DaysInterval parameter with the 1 attribute, and the -At
    parameter set to the 23:00 attribute.

    +   2. You then store this scheduled task trigger object in the $schTrigger variable.
    When you call the $schTrigger variable, it returns the trigger Id of 0, the Frequency
    of Daily, the Time of 2/18/2017 11:00:00 PM, the DaysOfWeek of $null, and Enabled
    set to true.


    > For more information on scheduled task triggers and their syntax, you can browse
    to: https://technet.microsoft.com/itpro/powershell/windows/scheduled-tasks/new-scheduledtasktrigger.'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'Task actions define what the scheduled task is executing. Task actions can
    be as simple as running an executable, or can invoke a script to do a wide variety
    of actions. You use the New-ScheduledTaskAction cmdlet to create a new action
    object. Along with the cmdlet, you can leverage the -Execute parameter to start
    an executable. You also have the -Argument parameter, which enables you to pass
    in arguments to the executable being invoked. You will need to store the task
    action object in a variable to create the scheduled task.


    To create a scheduled task action to open calc.exe, you can perform the following:


    ```

    ```powershell

    $schAction = New-ScheduledTaskAction -Execute "Calc.exe"

    $schAction

    ```

    ```


    The output of this command would look like this:


    ![](img/a27a138d6586c10902d8e86ab3384834_101_0.png)


    In this example, you learn how to create a scheduled task action:


    +   1. You first start by calling the New-ScheduledTaskAction cmdlet with the
    -Execute parameter set to the calc.exe attribute.

    +   2. You then save this scheduled task object in the $schAction variable.


    When you call the $schAction variable, it returns the Id of $null, the Arguments
    of $null, the Execute of Calc.exe, the WorkingDirectory of $null and PSComputerName
    of $null. If there other parameters were passed into the new-ScheduledTaskAction
    cmdlet, the $null fields would be populated with data.


    An optional component for configuration is task setting sets, which provide configurations
    for the scheduled task itself. If you want to include additional parameters, you
    can configure execution on batteries, execution duration, idle duration, restart
    count, and restart interval. You can use the New-ScheduledTaskSettingsSet cmdlet
    to define the scheduled task settings set, and you will need to store it in a
    variable to create the scheduled task.'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'To create a scheduled task setting set with the -DisallowDemandStart, -Hidden,
    and -DisallowHardTerminate parameters, you can perform the following actions:


    ```

    $schSettingSet = New-ScheduledTaskSettingsSet -DisallowDemandStart

    -Hidden -DisallowHardTerminate

    $schSettingSet

    ```


    The output of this command would look like the following:


    ![](img/a27a138d6586c10902d8e86ab3384834_102_0.png)


    In this example, you create a new scheduled task setting set:


    +   1. You first start by declaring the New-ScheduledTaskSettingsSet cmdlet with
    the -DisallowDemandStart, -Hidden, and -DisallowHardTerminate parameters.

    +   2. You then set the scheduled task setting set object to the $schSettingSet
    variable.


    When you call the $schSettingSet cmdlet, you reveal all of the parameters the
    scheduled task setting set has. In this setting set, you can see AllowDemandStart
    is set to False, AllowHardTerminate is set to False, and Hidden is set to True.


    > For more information on scheduled task settings and their syntax, you can browse
    to: https://technet.microsoft.com/itpro/powershell/windows/scheduled-tasks/new-scheduledtasksettingsset.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'After capturing the task action and task trigger in variables, you create the
    scheduled task object. You call the New-ScheduledTask cmdlet with the -Action
    parameter, referencing the task action object, and the -Trigger parameter referencing
    the task trigger object. You may also use the optional task settings set by the
    -Settings parameter, by referencing the task settings set object. You place all
    of these items into a variable that will contain the scheduled task object.


    To create a scheduled task variable, you can perform the following actions:


    ```

    $schAction = New-ScheduledTaskAction -Execute "Calc.exe"

    $schTrigger = New-ScheduledTaskTrigger -Daily -DaysInterval 1 -At "23:00"

    $schSettingSet = New-ScheduledTaskSettingsSet -DisallowDemandStart -Hidden -DisallowHardTerminate

    $schTask = New-ScheduledTask -Action $schAction -Trigger $schTrigger -Settings
    $schSettingSet

    $schTask

    $schTask.Triggers

    ```


    The output of this command would look like this:


    ![](img/a27a138d6586c10902d8e86ab3384834_103_0.png)


    This example displays how to take the scheduled task action, trigger, and setting
    set to create a scheduled task object:


    +   1. You first start by calling the New-ScheduledTaskAction cmdlet with the
    -Execute parameter set to the calc.exe attribute.

    +   2. You then save this scheduled task object in the $schAction variable.

    +   3. You then use the New-ScheduledTaskAction cmdlet with the -Execute parameter
    set to the calc.exe attribute.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '+   4. You then save this scheduled task object in the `$schAction` variable.

    +   5. You continue to declare the `New-ScheduledTaskSettingSet` cmdlet with the
    `-DisallowDemandStart`, `-Hidden`, and `-DisallowHardTerminate` parameters.

    +   6. You then set the scheduled task setting set object to the `$schSettingSet`
    variable.

    +   7. Finally, you call the `New-scheduledTask` cmdlet with the `-Action` parameter
    set to `$schAction`, the `-Trigger` parameter set to `$schTrigger`, and the `-Settings`
    parameter set to `$schSettingSet`.

    +   8. You then take the scheduled task object and place it in the `$schTask`
    variable. When you call the `$schTask` variable, however, it comes back with a
    blank `TaskPath`, `TaskName`, and `State`. This is because the task will need
    to be registered, as explained in the next step. Although `TaskPath`, `TaskName`,
    and `State` properties are blank, when you call properties such as `$schTask.Triggers`,
    you will see that those properties are populated properly. In this case, it returns
    the 11PM trigger you set up in the earlier step.

    +   9. The last step is to register the scheduled task on the system.


    To register a scheduled task, you can leverage the `Register-ScheduledTask` cmdlet
    with the `-TaskName` parameter and the desired name as the argument. You will
    need to also include the `-InputObject` parameter, referencing the object you
    created with the `New-ScheduledTask` cmdlet. After execution, the scheduled task
    will be properly created on your system.


    If you want to remove a scheduled task, you can leverage the `Unregister-ScheduledTask`
    cmdlet with the `-TaskName` parameter and the desired name for removal as the
    argument. After execution, the `Unregister-ScheduledTask` cmdlet will prompt you
    to confirm deleting the scheduled task. To suspend the confirm prompt, you can
    leverage `-Confirm:$false` as a parameter. This will remove the scheduled task
    from the system without prompting.


    To register two scheduled tasks to start the calculator every day at 11:00 pm,
    and unregister one of the scheduled tasks, you perform the following actions:


    ```

    $schAction = New-ScheduledTaskAction -Execute "Calc.exe"

    $schTrigger = New-ScheduledTaskTrigger -Daily -DaysInterval 1 -At "23:00"

    $schTask = New-ScheduledTask -Action $schAction -Trigger $schTrigger

    Register-ScheduledTask -TaskName "Start Calc Daily at 11PM" -InputObject $schTask

    ```'
  merge: -1
  img_proc: true
- pgno: 105
  md: '```

    Register-ScheduledTask -TaskName "Start Calc Daily at 11PM_DeleteMe"

    -InputObject $schTask

    ```


    ```

    Unregister-ScheduledTask -TaskName "Start Calc Daily at 11PM_DeleteMe"

    -Confirm:$false

    ```


    ```

    Get-ScheduledTask | where {$_.TaskName -like "Start Calc Daily at 11PM*"}

    ```


    The output of this command would look like this:


    ![](img/a27a138d6586c10902d8e86ab3384834_105_0.png)


    In this example, you learn how to create two scheduled tasks to launch calculator
    every day at 11:00 pm. You also learn how to remove one of the two scheduled tasks:


    +   1. You first start by creating a scheduled task action leveraging the new-ScheduledTaskAction
    cmdlet with the -Execute parameter and the Calc.exe argument.

    +   2. You place this object into the $schAction variable.

    +   3. You continue to create the scheduled task trigger by leveraging the new-ScheduledTaskTrigger
    cmdlet with the -Daily parameter, the -DaysInterval parameter with the argument
    of 1, and the -At parameter with the argument of 23:00.

    +   4. You place the scheduled task trigger object into the $schTrigger variable.

    +   5. You then create the scheduled task object by leveraging the New-ScheduledTask
    cmdlet with the -Action parameter set to the argument of $schAction, and the -Trigger
    parameter set to the argument of $schTrigger.

    +   6. You place this scheduled task object into the $schTask variable.'
