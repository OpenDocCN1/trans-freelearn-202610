    \ you will have a need to merge multiple CSV files into a single CSV file. This\
    \ will allow for better searching of the scan results, and help you identify trends\
    \ in your server infrastructure. PowerShell offers the Import-csv and Export-csv\
    \ cmdlets, which provide the ability to manipulate CSV data. A common technique\
    \ is to use the Import-csv and Export-csv cmdlets with a pipeline to import, manipulate,\
    \ and export the data to a new CSV file.\n\nTo get started, you will need to create\
    \ several CSV files to merge together. To create multiple CSVs that are similar\
    \ to the Windows server scanning script output, you can perform the following:\n\
    \n```\n```powershell\n$logloc = \"C:\\temp\\POSHScript\\CSVDEMO\\\"\n$date = (Get-Date\
    \ -format \"yyyyMMddhhss\")\nFunction create-testcsv { param($servername)\n  \
    \  $csvfile = \"$logloc\\$servername\" + \"_\" + $date + \"_ScanResults.csv\"\n\
    \    new-item $csvfile -ItemType File -Force | Out-Null\n\n    $csvheader = \"\
    ServerName, Classification, Other Data\"\n    Add-content $csvfile -Value $csvheader\n\
    \n    $csvcontent = \"$servername, CSVTestData, This is CSV Test Data for $servername.\"\
    \n    Add-content $csvfile -Value $csvcontent\n}\ncreate-testcsv POSHDEMO-Server1\n\
    create-testcsv POSHDEMO-Server2\ncreate-testcsv POSHDEMO-Server3\ncreate-testcsv\
    \ POSHDEMO-Server4\ncreate-testcsv POSHDEMO-Server5\nget-childitem $logloc\n```\n\
    ```"
