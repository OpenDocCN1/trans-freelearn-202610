- pgno: 106
  md: '7. To register the scheduled task on the system with two different names, you
    leverage the Register-ScheduledTask cmdlet with the -TaskName parameter set to
    the Start Calc Daily at 11pm argument. You also include the -InputObject parameter
    set to the $schTask variable. After execution, a scheduled task is created with
    the name Start Calc Daily at 11pm.


    8. To create a second scheduled task, you leverage the RegisterScheduledTask cmdlet
    with the -TaskName parameter set to the Start Calc Daily at 11pm_DeleteMe argument.
    You also include the -inputobject parameter set to the $schTask variable. After
    execution, a scheduled task is created with the name Start Calc Daily at 11pm_DeleteMe.


    To unregister the scheduled task with the name ending in _Deleteme, you use the
    Unregister-scheduledtask cmdlet with the -TaskName parameter set to Start Calc
    Daily at 11PM_DeleteMe. You also use the -Confirm:$false parameter to designate
    that the cmdlet does not need to prompt for confirmation. After execution, the
    scheduled task named Start Calc Daily at 11PM_DeleteMe is deregistered from the
    system. You confirm this by running the Get-ScheduledTask cmdlet, piped to where
    {$_.TaskName -like "Start Calc Daily at 11PM*"}. After execution, the script returns
    a single instance of Start Calc Daily at 11PM.


    There are two primary methods to modify a scheduled task:


    +   1. You may choose to unregister and recreate a scheduled task.

    +   2. You may choose to leverage the set-scheduledtask cmdlet. The set-ScheduledTask
    cmdlet allows you to call a specific scheduled task by the -TaskName parameter,
    and specify new or additional triggers, actions, and scheduled task settings.


    Leveraging the previous example, to set two new scheduled task actions to open
    notepad and calc, you can do the following:


    ```

    ```powershell

    $schAction1 = New-ScheduledTaskAction -Execute "Calc.exe"

    $schAction2 = New-ScheduledTaskAction -Execute "Notepad.exe"

    Set-ScheduledTask -TaskName "Start Calc Daily at 11PM" -Action

    $schAction1,$schAction2

    ```

    ```


    The output of this command would look like this:


    ![](img/a27a138d6586c10902d8e86ab3384834_106_0.png)'
