- pgno: 85
  md: '# Managing Windows processes


    There may be times in scripting where you need to check if there is a running
    process on a system. PowerShell offers the get-process cmdlet to search for available
    processes on a system. By running the get-process cmdlet alone, you will get a
    report of all the running services on the system. The default record set that
    is returned about running services includes:


    +   - Handles: The number of thread handles that are being used by a particular
    process

    +   - NPM (K): Non-Paged Memory is the memory that is solely in physical memory,
    and not allocated to the page file that is being used by a process

    +   - PM (K): Pageable Memory is the memory that is being allocated to the page
    file that is used by a process

    +   - WS (K): Working Set is the memory recently referenced by the process

    +   - VM (M): Virtual Memory is the amount of virtual memory that is being used
    by a process

    +   - CPU (s): This is the processor time, or the time the CPU takes to utilize
    the process

    +   - ID: This is an assigned unique ID to the process

    +   - ProcessName: This is the name of the process in memory


    Typically, when you query the active running processes on a system, you will be
    looking for a particular process. To do this, you can leverage the get-process
    cmdlet with the -name parameter referencing a process name to view information
    about that particular process. You can also leverage the asterisk (*) as a wildcard
    to query processes that are like the partial word you specify. You may also directly
    reference the Process ID of a process if you invoke the -id parameter with an
    ID of a process. If you want more information about the process that is running,
    you can also leverage the -FileVersionInfo parameter to pull the ProductVersion,
    FileVersion, and FileName information from the process. In instances where you
    need to find all of the modules, or DLL references, that are loaded by a process,
    you may also leverage the -module parameter.


    To search for a process using a wildcard and get a process by a process ID, you
    can do the following:


    ```

    $process = get-process powersh*

    $process

    get-process -id $process.id

    ```'
  merge: -1
  img_proc: true
