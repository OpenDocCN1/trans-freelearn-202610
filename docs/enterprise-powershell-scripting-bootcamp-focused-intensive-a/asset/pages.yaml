- pgno: 54
  md: '# 4

    String Encryption

    and Decryption


    Large enterprises often have very strict security standards that are required
    by industry-specific regulations. When you are creating your Windows server scanning
    script, you will need to approach the script carefully with certain security concepts
    in mind. One of the most common situations you may encounter is the need to leverage
    sensitive data, such as credentials, in your script. While you could prompt for
    sensitive data during runtime, most enterprises want to automate the full script
    using zero-touch automation.


    Zero-touch automation requires that the scripts are self-contained and have all
    of the required credentials and components to successfully run. The problem with
    incorporating sensitive data in the script, however, is that data can be obtained
    in clear text. The usage of clear text passwords in scripts is a bad practice,
    and violates many regulatory and security standards.


    As a result, PowerShell scripters need a method to securely store and retrieve
    sensitive data for use in their scripts. One popular method to secure sensitive
    data is to encrypt the sensitive strings. This chapter explores RijndaelManaged
    symmetric encryption, and how to use it to encrypt and decrypt strings using PowerShell.


    In this chapter, we will cover the following topics:


    +   - Learn about RijndaelManaged symmetric encryption

    +   - Understand salt, init, and password for the encryption algorithm

    +   - Script a method to create randomized salt, init, and password values

    +   - Encrypt and decrypt strings using RijndaelManaged encryption

    +   - Create an encoding and data separation security mechanism for encryption
    passwords'
  merge: -1
  img_proc: true
- pgno: 55
  md: '> The examples in this chapter build upon each other. You will need to execute
    the scripts sequentially to have the final script in this chapter work properly.


    # RijndaelManaged encryption


    When you are creating your scripts, it is best practice to leverage some sort
    of obfuscation or encryption for sensitive data. There are many different strategies
    that you can use to secure your data. One is leveraging string and script encoding.
    Encoding takes your human readable string or script, and scrambles it to make
    it more difficult for someone to see what the actual code is. The downsides of
    encoding are that you must decode the script to make changes to it and decoding
    does not require the use of a password or passphrase. Thus, someone can easily
    decode your sensitive data using the same method you would use to decode the script.


    The alternative to encoding is leveraging an encryption algorithm. Encryption
    algorithms provide multiple mechanisms to secure your scripts and strings. While
    you can encrypt your entire script, it''s most common to encrypt the sensitive
    data in the scripts themselves, or answer files.


    One of the most popular encryption algorithms used with PowerShell is RijndaelManaged.
    RijndaelManaged is a symmetric block cipher algorithm, which was selected by United
    States National Institute of Standards and Technology (NIST) for its implementation
    of Advanced Encryption Standard (AES). When using RijndaelManaged for the AES
    standard, it supports 128-bit, 192-bit, and 256-bit encryption.


    ![](img/a27a138d6586c10902d8e86ab3384834_55_0.png)'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'In contrast to encoding, encryption algorithms require additional information
    to properly encrypt and decrypt the string. When implementing RijndaelManaged
    in PowerShell, the algorithm requires **salt**, a **password**, and the **InitializationVector**
    (IV). **Salt** is typically a randomized value that changes each time you leverage
    the encryption algorithm. The purpose of **salt** in a traditional encryption
    scenario is to change the encrypted value each time the encryption function is
    used. This is important in scenarios where you are encrypting multiple passwords
    or strings with the same value. If two users are using the same password, the
    encryption value in the database would also be the same. By changing the **salt**
    each time, the passwords, though the same value, would have different encrypted
    values in the database. In this chapter, we will be leveraging a static salt value.


    The **password** typically is a value that is manually entered by a user, or fed
    into the script using a parameter block. You can also derive the password value
    from a certificate, Active Directory attribute values, or a multitude of other
    sources. In this chapter, we will be leveraging three sources for the password.


    The **InitializationVector** (IV) is a hash generated from the IV string and is
    used for the **EncryptionKey**. The IV string is also typically a randomized value
    that changes each time you leverage the encryption algorithm. The purpose of the
    IV string is to strengthen the hash created by the encryption algorithm. This
    was created to thwart a hacker who is leveraging a rainbow attack using precalculated
    hash tables using no IV strings, or commonly used strings. Since you are setting
    the IV string, the number of hash combinations exponentially increases and it
    reduces the effectiveness of a rainbow attack. In this chapter, we will be using
    a static initialization vector value.


    The implementation of randomization of the salt and initialization vector strings
    becomes more important in scenarios where you are encrypting a large set of data.
    An attacker can intercept hundreds of thousands of packets, or strings, which
    reveals an increasing amount of information about your IV. With this, the attacker
    can guess the IV and derive the password.


    ![](img/a27a138d6586c10902d8e86ab3384834_56_0.png)


    > The most notable hack of IVs were with **WiredEquivalentPrivacy** (WEP) wireless
    protocol that used a weak, or small, initialization vector. After capturing enough
    packets, an IV hash could be guessed and a hacker could easily obtain the passphrase
    used on the wireless network.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "# Creating random salt, initialization vector, and passwords\n\nAs you are\
    \ creating your scripts, you will want to make sure you use complex random values\
    \ for the salt, IV string, and password. This is to prevent dictionary attacks\
    \ where an individual may use common passwords and phrases to guess the salt,\
    \ IV string, and password. When you create your salt and IVs, make sure they are\
    \ a minimum of 10 random characters each. It is also recommended that you use\
    \ a minimum of 30 random characters for the password.\n\nTo create random passwords\
    \ in PowerShell, you can do the following:\n\n```\nFunction create-password {\n\
    \    # Declare password variable outside of loop.\n    $password = \"\"\n    #\
    \ For numbers between 33 and 126\n    For ($a=33;$a -le 126;$a++) {\n        #\
    \ Add the Ascii text for the ascii number referenced.\n        $ascii += ,[char][byte]$a\n\
    \    }\n    # Generate a random character form the $ascii character set.\n   \
    \ # Repeat 30 times, or create 30 random characters.\n    1..30 | ForEach { $password\
    \ += $ascii | get-random }\n    # Return the password\n    return $password\n\
    }\n# Create four 30 character passwords\ncreate-password\ncreate-password\ncreate-password\n\
    create-password\n```"
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The output of this command would look like the following:


    ![](img/a27a138d6586c10902d8e86ab3384834_58_0.png)


    This function will make a string with 30 random characters for use with random
    password creation. You first start by declaring the create-password function.
    You then declare the $password variable for use within the function by setting
    it equal to "".


    The next step is creating a For command to loop through a set of numbers. These
    numbers represent ASCII character numbers that you can select from for the password.
    You then create the For command by writing For ($a=33; $a -le 126;$a++). This
    means starting at the number 33, increasing the value by one ($a++), and continuing
    until the number is less than or equal to 126. You then declare the $ascii variable
    and construct the variable using the += assignment operator. As the For loop goes
    through its iterations, it adds a character to the array values. The script then
    leverages the [char] or character value of the [byte] number contained in $a.
    After this section, the $ascii array will contain an array of all the ASCII characters
    with the byte values between 33 and 126.'
  merge: -1
  img_proc: true
- pgno: 59
  md: "You then continue to the random character generation. You declare the 1..30\
    \ command, which means, for numbers 1 to 30, repeat the following command. You\
    \ pipe this to ForEach {, which will designate for each of the 30 iterations.\
    \ You then call the $ascii array and pipe it to | get-random cmdlet. The get-random\
    \ cmdlet will randomly select one of the characters in the $ascii array. This\
    \ value is then joined to the existing values in the $password string using the\
