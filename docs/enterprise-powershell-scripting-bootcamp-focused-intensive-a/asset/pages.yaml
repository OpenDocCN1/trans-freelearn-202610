    \ the get-itemproperty cmdlet to get-member to access extended properties about\
    \ the executable.\n\n> Scanning Program Files requires a PowerShell window running\
    \ with elevated privileges. You will need to open PowerShell with the Run as Administrator\
    \ parameter.\n\nTo evaluate the Program Files and Program File (x86) directories\
    \ for .exe files, and retrieve their extended properties, you can do the following:\n\
    \n```\n$progpaths = \"\\Program Files\\\",\"\\Program Files (x86)\\\"\n$disks\
    \ = (Get-WmiObject win32_logicaldisk | where {$_.DriveType -eq \"3\"}).DeviceID\n\
    foreach ($disk in $disks) {\n    foreach ($progpath in $progpaths) {\n       \
    \ $progfile = $disk + $progpath\n        $test = test-path $progfile\n       \
    \ if ($test) {\n            $files = Get-ChildItem -file $progfile -Recurse |\
    \ where {$_.FullName -like \"*.exe\"} | Select Fullname\n            foreach ($file\
    \ in $files) {\n                $productName = (get-itemproperty $file.FullName).VersionInfo.ProductName\n\
    \                if (!$productName) { $productName = \"Product Name n/a\" }\n\
    ```"
