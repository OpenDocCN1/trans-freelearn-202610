- pgno: 155
  md: "There are two strategies to improving displaying information on the screen.\
    \ The first strategy is to leverage a function to write information to the screen\
    \ that you can turn on and off with a variable. In this, you have the ability\
    \ to display verbose information on screen during the testing phase. When you\
    \ are done testing, you can turn off all writing to the screen for production\
    \ use.\n\nThe second strategy is to write only high-level script status information.\
    \ Instead of writing each operation to the screen, designate the start with Running\
    \ Operation... and complete it with Operation Complete. This will reduce the volume\
    \ of text that is being placed on the screen; however, it will still display progress\
    \ on the screen. Creating a function that allows you to enable and disable printing\
    \ to the screen can allow you to disable verbose output in certain sections of\
    \ your code, while enabling it in others for testing purposes. This combination\
    \ provides great flexibility in your ability to manage screen writing performance.\n\
    \nTo create a write-host function that can be enabled and disabled, disable verbose\
    \ logging half-way through an operation, and time the difference, you can do the\
    \ following:\n\n```\n$verbose = $true\nfunction log { if ($verbose) { write-host\
    \ $_ } }\n\n$time1 = measure-command {\n    1..10000 | % {\n        log \"Number\
    \ $_\"\n        # Get the contents of C:\\Windows\\\n        $contents = Get-ChildItem\
    \ c:\\windows\\\n    }\n}\n\n$time2 = measure-command {\n    1..5000 | % {\n \
    \       log \"Log $_\"\n        # Get the contents of C:\\Windows\\\n        $contents\
    \ = Get-ChildItem c:\\windows\\\n    }\n    $verbose = $false\n    Write-host\
    \ \"Running Folder Scanning Operation...\"\n    1..5000 | % {\n        log \"\
    Number $_\"\n        # Get the contents of C:\\Windows\\\n    }\n}\n```"
  merge: -1
