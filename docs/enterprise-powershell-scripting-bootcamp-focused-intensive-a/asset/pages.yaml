    # Comment block


    The first lines of your Windows server scanning script should be the comment block.
    The comment block will describe the script''s function and provide revision details
    and information about the required Runtime Decryptor (RTD). This section should
    provide an example on how to run the script, and any additional notes about the
    script''s execution.


    The following screenshot displays a properly created comment block that integrates
    with the help system:


    ```

    <#

    .SYNOPSIS

    This is a server discovery script which will scan different server components
    to determine

    the current configuration.

    .DESCRIPTION

    This script will scan processes, Windows services, scheduled tasks, server features,
    disk information,

    registry, and files for pertinent server information.

    Author: Brenton J.W. Blawat / Packt Publishing / Author / email@email.com

    .PARAMETER RTD

    This script requires a run time decryptor as a parameter to the script.

    .EXAMPLE

    powershellscript.ps1 /RTD "Run Time Decryptor"

    .NOTES

    You must have administrative rights to the server you are scanning. Certain functions
    will not work properly

    without running the script as system or administrator.#>

    ```


    # Parameter block


    After the comment block of your script, you will want to immediately declare the
    parameter block. The parameter block is required for the RTD to be captured in
    the script. Since the decryption process relies on the RTD, you will exit the
    script if that parameter is not available.


    To create a parameter block and to check to see if there is a value, you can perform
    the following:


    ```

    param($RTD)

    if (!$RTD) { exit }

    ```


    There is no output from declaring the parameter block. In this example, you define
    a parameter block with the param command, and populate the $RTD variable with
    the input to the script. You also create an if statement that if the $RTD variable
    is $null, it will exit the script.'
