- pgno: 136
  md: '# 9

    File Scanning


    When you are evaluating systems in your environment, there may be a time where
    you need to scan files for specific content. The Window server scanning script
    enables you to search directories for files with specific strings. Common strings
    may include error messages, clear text passwords, or even specific server information
    such as hostnames and IP addresses. The ability to scan systems for specific content
    is an immensely powerful tool that can reveal a plethora of information about
    your systems.


    It is common, when scanning a system, to have a lot of results that are not what
    you are looking for, also known as false positives. This chapter will explore
    how to reduce the number of false positives by narrowing the search to specific
    file types. It will also explain how to exclude files from your search to help
    you get the data you need.


    In this chapter, you will:


    +   - Understand how to obtain subdirectories and their contents

    +   - Limit the file discovery process to specific file types

    +   - Efficiently search files for strings and identify their location in a file

    +   - Learn how to handle errors from long paths that exceed 248 characters and
    permission issues

    +   - Exclude files that are false positives in your search


    # File scanning


    File scanning is an important activity in enterprise environments. Whether it
    is to identify where credentials are being used, the use of sensitive information,
    or server configuration information, you will need a technique to quickly and
    efficiently scan file data. PowerShell natively has the ability to gather data
    from clear text files and parse information. Some of the most common clear text
    files include, but are not limited to, text files, log files, XML files, configuration
    files, and scripting files.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'When you are developing a scanning function, you will have to scan the directories
    for specific file types and the contents of the file itself. To scan for specific
    file types, you can leverage the Get-ChildItem cmdlet with a folder path as an
    argument. You also use the -Include parameter with the wildcard file extension
    that you want to search for. For log and text files, wildcard file extensions
    would look like *.log and *.txt respectively. If you want to scan multiple extensions,
    you can place a comma between each file extension you want to search for. If you
    want to scan subdirectories for file types, you can include the -Recurse parameter
    to recursively go through the subdirectories.


    To scan the Program Files directory and subdirectories for *.log and *.txt files,
    you can perform the following:


    ```

    Get-ChildItem "c:\Program Files\" -Include *.log,*.txt -recurse

    ```


    The output of this is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_137_0.png)'
  merge: -1
  img_proc: true
- pgno: 138
  md: "This example displays how to scan the Program Files directory for .config and\
    \ .txt file types. You start by calling the Get-ChildItem cmdlet with the C:\\\
    Program Files\\ argument. You also leverage the -Include parameter with the *.log,*.txt\
    \ argument to scan for .log and .txt files. Finally, you leverage the -recurse\
    \ parameter to scan the subdirectories of C:\\Program Files\\. After execution,\
    \ the PowerShell script displays all of the .log files and .txt files in the C:\\\
    Program Files\\ directory.\n\nTo scan for specific content inside a file, you\
    \ need to obtain the contents of the file and place them in memory. To do this,\
    \ you can leverage the get-content cmdlet with the path to the file you want to\
    \ scan as the argument. You then place the result into a variable for evaluation.\
    \ To scan the contents of the file, you can leverage the select-string cmdlet,\
    \ which allows you to match content strings to regular expressions. You start\
    \ by defining the select-string cmdlet followed by the -path parameter with a\
    \ file argument. You then call the -pattern parameter with a regular expression\
    \ as an argument. To search for a literal string, you can use the -pattern parameter\
    \ with a string as the argument and leverage the -SimpleMatch parameter to match\
    \ to a specific string.\n\nYou may also choose to leverage the select-string cmdlet\
    \ after a pipe. To scan for specific content inside a file, you have the ability\
    \ to pipe the filename result of the Get-ChildItem cmdlet to the select-string\
    \ cmdlet. The select-string cmdlet will then evaluate the individual files for\
    \ string patterns. This avoids the need to leverage a foreach loop to query the\
    \ individual files, and each file will be evaluated as it is returned by the Get-ChildItem\
    \ cmdlet.\n\nAnother unique feature of the select-string cmdlet is that it also\
    \ returns the line number in the file, and the whole line of the matched content\
    \ as it finds the individual results. You can call the Line property to return\
