    # Creating the log files and logging function


    The final core scripting components are the log files and logging functions. When
    you are creating your log files, you typically want to include the server name
    and the timestamp in the filename. This allows you to determine what machine the
    log file is for and when the scan was run. Since the Windows server scanning script
    also collects data about the system, you will also need to create a CSV file for
    logging pertinent information.


    To create the log and CSV files with the server name and timestamp in the filename,
    you can do the following:


    ```

    ```powershell

    $date = (Get-Date -format "yyyyMMddmmss")

    $compname = $env:COMPUTERNAME

    $logloc = $logloc.id

    ```

    ```'
