    the four-digit year, two-digit month, two-digit day, two-digit minute, and two-digit
    seconds, from when the script was executed, contained in it. You then gather the
    computer name by leveraging the $env:COMPUTERNAME environment variable and placing
    the value into the $compname variable. You then combine the $compname variable
    with a plus symbol, an underscore for separation with a plus symbol, the date
    timestamp with a plus symbol, and log file name of "ServerScanScript.log", and
    store it in the $logname variable. You then create the full log path by specifying
    "c:\temp\logs\" with a plus symbol and the $logname directory and store it in
    the $scanlog variable. Finally, you leverage the new-item cmdlet with the -path
    parameter set to $scanlog, -ItemType set to File, and the -Force parameter. After
    execution, you will have a log file in c:\temp\logs\ with the filename of computername_datetimestamp_ServerScanScript.log.


    To create a time-stamped data collection file in the format of a CSV file, you
