- pgno: 66
  md: "# Decrypting strings\n\nThe decryption of strings is very similar to the process\
    \ you performed when encrypting strings. Instead of writing data to the memory\
    \ stream, the function reads the data in the memory stream. Also, instead of using\
    \ the .CreateEncryptor() method, the decryption process leverages the .CreateDecryptor()\
    \ method.\n\nTo create a script that decrypts encrypted strings using RijndaelManaged\
    \ encryption, perform the following:\n\n```\n```powershell\nAdd-Type -AssemblyNameSystem.Security\n\
    function Decrypt-String { param($Encrypted, $pass,\n$salt=\"CreateAUniqueSalt\"\
    , $init=\"CreateAUniqueInit\")\n\nif($Encrypted -is [string]){\n    $Encrypted\
    \ = [Convert]::FromBase64String($Encrypted)\n}\n\n$r = new-Object System.Security.Cryptography.RijndaelManaged\n\
    $pass = [System.Text.Encoding]::UTF8.GetBytes($pass)\n$salt = [System.Text.Encoding]::UTF8.GetBytes($salt)\n\
    $init = [Text.Encoding]::UTF8.GetBytes($init)\n\n$r.Key = (new-Object Security.Cryptography.PasswordDeriveBytes\
    \ $pass,\n$salt, \"SHA1\", 50000).GetBytes(32)\n$r.IV = (new-Object Security.Cryptography.SHA1Managed).\n\
    ComputeHash($init)[0..15]\n\n$d = $r.CreateDecryptor()\n$ms = new-Object IO.MemoryStream@(,\
    \ $Encrypted)\n$cs = new-Object Security.Cryptography.CryptoStream $ms,$d,\"Read\"\
    \n$sr = new-Object IO.StreamReader $cs\n\ntry {\n    $result = $sr.ReadToEnd()\n\
    \    $sr.Close()\n    $cs.Close()\n    $ms.Close()\n    $r.Clear()\n```\n```"
