  md: '# 10


    # Optimizing Script Execution Speed


    When you execute the Windows server scanning script, you most likely will be processing
    a large number of objects. Small efficiencies in your coding practices can equate
    to exponentially faster execution times for large sets of data. Due to PowerShell
    being so flexible, it is possible to write two different sets of code that perform
    the exact same activity. However, you will find that certain coding techniques
    are much more efficient than others. In some cases, you can increase your script
    performance by over 200 percent.


    This chapter focuses on the quick changes that you can make to your scripts to
    optimize efficiency. You will also learn about cmdlets and methods that you should
    avoid to ensure that you are not impacting your script''s performance. By following
    the recommendations in this chapter, you can significantly reduce the amount of
    time that the Window server scanning script takes to scan systems.


    In this chapter, you will:


    +   - Learn how to measure the duration of commands in scripts

    +   - Determine the overhead of writing all actions to the screen

    +   - Create a logging function that allows you to turn on and off verbose logging

    +   - Evaluate the write-progress function''s impact on script performance

    +   - Determine the speed differences between multiple `if` and `switch` statements'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Script execution speed


    When PowerShell scripts are executing, they consume both memory and CPU resources
    on a system. With larger scanning scripts, this may spike system resources for
    a noticeable duration of time. As a result, it''s important to optimize your scripts
    to quickly execute the task at hand. One of the cmdlets that you can use to measure
    script execution time is the measure-command cmdlet. To measure the execution
    time, you call the measure-command cmdlet and place the code you want to execute
    in curly brackets. The output of the measure-command cmdlet will display the Days,
    Hours, Seconds, Milliseconds, Ticks, TotalDays, TotalHours, TotalMinutes, TotalSeconds,
    and TotalMilliseconds of the operation. This represents the duration of time the
    code took to execute the section of code.


    To measure a command by leveraging the measure-command cmdlet, you can perform
    the following:


    ```

    measure-command { ping localhost }

    ```


    The output of this is shown in the following screenshot:


    ![](img/a27a138d6586c10902d8e86ab3384834_151_0.png)


    In this example, you measure the duration it takes to ping the localhost on a
    system. You first start by declaring the measure-command cmdlet. In curly brackets,
    you specify ping localhost. After execution, the measure-command returns the Days,
    Hours, Seconds, Milliseconds, Ticks, TotalDays, TotalHours, TotalMinutes, TotalSeconds,
    and TotalMilliseconds of the operation. You will see that the duration for ping
    localhost in this example is 3.13 seconds.'
  merge: -1
  img_proc: true
- pgno: 152
  md: "# Speed considerations for the write-host cmdlet\n\nDisplaying progress information\
    \ is helpful in determining what actions are being performed in a script, or during\
    \ the script troubleshooting process. When you start writing a large volume of\
    \ information to the PowerShell window, however, you will start seeing slower\
    \ performance with the script's execution. When you keep PowerShell operations\
    \ in memory, the system interacts with the operation in memory. When you display\
    \ content to the screen, you have to wait for the kernel to write the operation\
    \ to the screen before it can continue to the next operation. This is inherently\
