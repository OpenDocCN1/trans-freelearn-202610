- pgno: 42
  md: '# 3


    # Working with Answer Files


    As you continue developing the Windows server scanning script, you may run into
    scenarios where you need to modify your script to run in different environments.
    While it''s fairly low risk to modify code in a one or two-line script, large
    enterprise scripts require a better structure and process. The general rule of
    thumb is that if you need to adjust values in your script for different scenarios,
    you should put those values into an answer file. The contents of the answer file
    are read during runtime, and those values are used as input into the script. This
    provides another layer of stability to your scripts because you''re not adding
    risk by modifying code in the script itself.


    There are many different formats for answer files. The industry standard with
    .NET programs are XML-based answer files. This is due to their ability to have
    file format integrity built into the standards for XML. If the answer file is
    not formatted properly, it will not be possible for it to be used by applications.
    PowerShell has built-in XML support to be able to create, read, modify, and utilize
    XML files, which makes it perfect for script answer files.


    In this chapter, you will:


    +   - Explore different ways you can leverage answer files

    +   - Learn the structure of XML-based files

    +   - Read the individual tags, attributes, and attribute values of XML-based
    answer files

    +   - Create a function to pull different elements from the XML file, and store
    them in variables


    ![](img/a27a138d6586c10902d8e86ab3384834_42_0.png)


    > The examples in this chapter build upon each other. You will need to execute
    the script sequentially to have the examples in this chapter work properly.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Answer files


    As you develop your enterprise scripting templates, you will find that you may
    need to modify small portions of code for running in different environments. For
    example, if you are using the same script in multiple non-trusted Active Directory
    forests, you most likely would have to store information about those respective
    forests in your script. This creates complexity as you would have to manage multiple
    scripts for multiple forests. Not only is this inefficient, but changing a validated
    script introduces a great amount of risk for scripting errors.


    A common way to reduce this risk is to leverage answer files. Answer files are
    separate files that contain information you will use in your script. This allows
    you to modify parameters for your script, without having to touch the code in
    the script itself.


    Some of the most common items to include in an answer file are:


    +   - **Script logging location**: This defines where you want all your log files
    to be stored. This typically is locally to the system or a UNC path.

    +   - **Data sources**: This defines the connection string information for connecting
    to different data source types. This could include server information, usernames,
    passwords, port numbers, and driver information.

    +   - **Data output information**: This defines where you want the output from
    the script to be stored. This could be email server information, database information,
    or a UNC path to store files.

    +   - **Encrypted data**: Any encrypted usernames, passwords, server names, security
    keys, and other secure data can be stored in the answer file. Since you can easily
    delete the answer file after execution within your script, this is a common place
    for this type of data.

    +   - **Inclusion/Exclusion lists**: Inclusion and exclusion lists are lists of
    data that you want to use in your script. Typically, these lists are stored as
    an array or a regular expression.

    +   - **Enable/Disable script features**: It is a common need for administrators
    to quickly turn on and off portions of a script. Instead of commenting out the
    code, you can leverage your answer file to quickly enable and disable blocks of
    code.


    > > It is strongly recommended to not use clear text usernames and passwords in
    your scripts or in your answer files. Since PowerShell scripts and answer files
    are written in human readable clear text, it is recommended to only leverage secure
    methods for storing credentials. This will be discussed in later chapters.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# XML answer files


    There are many different types of answer file formats used with scripting languages.
    Languages like .NET leverage .config formatted files for application configurations,
    while languages like Java leverage .properties formatted files for configuration
    data. While you can use comma separated value (CSV) files for answer files with
    PowerShell, it is highly recommended to use eXtensible Markup Language (XML) formatted
    files.


    XML was created by the World Wide Web Consortium (W3C) to standardize the encoding
    of documents to make them both legible to humans and usable by computer systems.
    The XML format is very similar to Hypertext Markup Language (HTML). If you know
    the basics of HTML, you should be able to pick up XML rather quickly.


    There are four main components to the syntax of XML files:


    +   - **XML declaration:** The XML declaration is a mandatory line at the very
    beginning of the XML document itself. The declaration tells the XML parser what
    XML specification version to use and what encoding format (optional) to use.

    +   - **XML comments:** Comments are data and are just like comments in PowerShell.
    They provide developers with information about each of the sections or individual
    items in an XML file.

    +   - **XML tags:** As you build multiple tags in your XML files, you will need
    to follow the XML W3C Document Object Model (DOM) tree structure. In simple terms,
    the XML DOM tree structure consists of a parent, child, and siblings. The parent
    is a grouping tag which groups the child tags. If there are multiple child tags
    in the parent tag, the individual child tags are siblings.

    +   - **XML attributes and elements:** There are two methods to define data about
    the individual XML tag. The first method is leveraging attributes and attribute
    values. An attribute is a unique name that describes an item related to the XML
    tag. The attribute value is whatever data you want stored for that attribute.
    The second method is to leverage elements, or inner XML data. This data is also
    associated with the tag. When the XML parser calls a tag in a script, the element
    is returned for use.'
  merge: -1
  img_proc: true
- pgno: 45
