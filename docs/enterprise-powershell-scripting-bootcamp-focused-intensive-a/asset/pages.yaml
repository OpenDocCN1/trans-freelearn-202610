- pgno: 76
  md: '# 5


    # Interacting with Services,

    Processes, Profiles, and

    Logged on Users


    The Windows server scanning script provides enterprises with visibility into the
    overall function of the system being scanned. While you may be able to evaluate
    installed Windows features and roles, doing so often does not provide enough information
    to be able to determine the full function of a server. Further, without deeper
    inspection, you won''t be able to determine whether there are business-critical
    services and processes running on a system.


    When you evaluate identities on a system, however, you can gain very valuable
    information about a system''s function. Typically, in enterprise environments,
    service accounts are used to run different services and processes on a system.
    These service accounts are similar to normal users; however, they have restricted
    privileges. When you identify services or processes that are not running as the
    default built-in users, there is a high possibility that the system was configured
    that way for a reason. This will reveal nonstandard configurations for a system,
    which are excellent callouts for review with the Window server scanning script.


    In addition to determining service account usage, scanning processes reveal the
    users logged into a particular system. Since every user account logged in to the
    system has its own processes assigned to its session, you can quickly dissect
    why a user is logged in. Also, there are legacy software solutions that are known
    to require an interactive login to properly run services, shells, and programs.
    Evaluating logged in users will enable you to better understand how user accounts
    are interacting with a system.'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'Lastly, you will want to evaluate user profiles. In large enterprise environments,
    there can be few traces of what user or department owns a particular system. Since
    user profiles contain the usernames of individuals who logged into the system,
    scanning the profiles will provide guidance for system ownership.


    In this chapter, you will:


    +   - Understand how to get, stop, start, and set Windows services

    +   - Leverage different cmdlets to interact with Windows processes

    +   - Identify logged on users on a system

    +   - Gather data about the user profiles on a system


    > The examples in this chapter build upon each other. You will need to execute
    the scripts sequentially to have the final script in this chapter work properly.

    > It is also recommended you execute these examples on Windows 2012 R2 server
    (or greater) with PowerShell installed. This server must be joined to a Windows
    domain.


    # Windows services


    When you are working with Microsoft-based systems, there may be times where you
    need to interact with Windows services. PowerShell offers a variety of cmdlets
    that enable you to work with these services. To start, you can review the services
    on a system by leveraging the Get-service cmdlet. By calling the Get-service cmdlet,
    you can retrieve the full list of Windows services on a system. If you want to
    obtain a filtered view into a specific service, you can leverage the -name parameter
    referencing a specific name of a service. After executing this command, you will
    see the Status, Name, and DisplayName of the service. You may also issue the -RequiredServices
    parameter to display the services that are required to be running for that particular
    service to be functional. You can query dependent Windows services by executing
    the -DependentServices parameter.


    To use the Get-service cmdlet to query the Windows Audio Service, you could do
    the following:


    ```

    ```powershell

    Get-service -DisplayName "Windows Audio"

    Get-service -DisplayName "Windows Audio" -RequiredServices

    (Get-service -DisplayName "Windows Audio").Status

    ```

    ```'
  merge: -1
  img_proc: true
