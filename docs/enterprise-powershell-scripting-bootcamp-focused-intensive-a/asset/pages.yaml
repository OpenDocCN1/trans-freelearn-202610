- pgno: 70
  md: 'The purpose of this methodology is to provide multiple data points for passwords.
    The Runtime Decryptor requires user intervention, the Answer File Decryptor requires
    the answer file to be present for execution, and the Script Side Decryptor ensures
    that a password can''t be solely determined from an answer file.


    ![](img/a27a138d6586c10902d8e86ab3384834_70_0.png)


    An added layer of security to this methodology is to leverage encoding the password
    input. While encoding may not be great for encrypting the actual passwords in
    your script, it provides a very valuable obfuscation for storing a password in
    multiple locations. When you generate the encoded value for the password, it increases
    the character quantity and greatly obstructs brute-forcing of the encoding and
    password used in the encryption process.


    To encode a password, do the following:


    ```

    $pass = "A_Complex_Password_With_A_Lot_Of_Characters"

    $encodedpass = [System.Text.Encoding]::Unicode.GetBytes($pass)

    $encodedvalue = [Convert]::ToBase64String($encodedpass)

    $encodedvalue

    ```


    The output of this command would look like the following:


    ![](img/a27a138d6586c10902d8e86ab3384834_70_1.png)


    This example displays how to encode a password broken into multiple data points.
    You first start by defining the $pass variable with the value of "A_Complex_Password_With_A_Lot_Of_Characters".
    You then encode the password leveraging the [System.Text.Encoding]::Unicode.GetBytes($pass)
    method and store the value in the $encodedpass variable. You then convert the
    encoded value into a string by leveraging [Convert]::ToBase64String($encodedpass)
    and storing the value in the $encodedvalue variable. At the end of this example,
    you call the $encodedvalue variable to display the encoded string.'
