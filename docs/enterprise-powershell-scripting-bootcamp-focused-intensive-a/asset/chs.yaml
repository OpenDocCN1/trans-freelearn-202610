  # 1 使用企业 PowerShell 脚本入门


  PowerShell 语言是为了让工程师能够快速自动化环境的配置和管理而开发的。在过去十年中，PowerShell 的使用大幅扩展，涵盖了各种硬件和软件系统的设置和配置。由于第三方制造商正在创建
  PowerShell 模块来控制其系统，PowerShell 正在成为首选的自动化语言。它使用单一的 PowerShell 代码集来配置来自多个制造商的多个系统。


  为企业环境创建脚本需要一个强大的脚本框架。脚本框架由可重用的代码组成，您可以在大部分脚本中利用这些代码。该框架需要高效、可靠且安全。它还必须提供日志记录功能，利用应答文件，并能够在各种各样的系统上灵活执行。


  在阅读本书的过程中，您将学习大量经过测试且业界验证的脚本技术。您创建的示例将在本书结尾应用于 Windows 服务器扫描脚本。这将使您能够快速将新的代码段集成到自己的脚本中，并提供一个值得信赖的平台，您可以自信地在环境中部署。


  在本章中，您将：


  - 了解贯穿本书创建的 Windows 服务器扫描脚本

  - 探索在各章中实施的性能优化

  - 回顾应包含在所有 PowerShell 脚本中的不同组件


  ## Windows 服务器扫描脚本


  在大型企业中，可能存在需要确定系统功能的情况。如果您没有大型资产管理软件，您将需要执行发现的能力。本书旨在为创建 Windows 服务器扫描脚本提供显著的起点。该脚本考虑了
  Windows 组件的限制，并提供关于系统的极其详细的信息。


  您将扫描的一些项目包括：


  - **磁盘配置：** 您将能够查询特定系统的磁盘布局并确定设备类型、驱动器号、可用空间和总磁盘大小。

  - **计划任务扫描：** 您将发现未以内置账户运行的计划任务，从而了解非标准配置。

  - **Windows 进程：** 您将识别系统上的 Windows 进程，以确定哪些进程使用备用用户凭据运行。这将有助于识别具有用于进程执行的服务账户的系统。

  - **Windows 服务：** 您将审查系统上的 Windows 服务，以发现哪些服务未以内置账户运行。这将进一步识别企业中的服务账户使用情况。

  - **已安装软件：** 您将学习如何安全地扫描系统以识别系统上安装的软件标题。

  - **用户配置文件：** 您将评估系统上创建的所有用户配置文件，以确定最后登录的用户名和时间。这将有助于识别负责服务器管理的团队。

  - **Windows 功能：** 您将确定系统上安装的 Windows 功能和角色，以帮助识别服务器在企业中的角色。

  - **扫描文件：** 您将扫描系统上的单个文件以查找字符串。这提供了识别用户凭据和配置的服务器名称等项目的


  ## 性能注意事项


  本书深入探讨了脚本的重要性能注意事项。由于 PowerShell 是一种极其灵活的语言，您可以用多种方式完成相同的活动。虽然两组代码都能使脚本产生相同的结果，但有方法可以优化代码使其更高效。随着您评估的数据量增大，这变得越来越重要。


  例如，文件扫描的执行时间随文件数量和文件大小呈指数增长。100 个文件包含 100 行代码即可快速产生 10,000 次评估。现在，如果将其扩展到存储卷中的 600
  万个文件乘以 100 行代码，您将执行 6 亿次评估。小代码性能改进可以显著优化大规模脚本的扫描。


  一些性能注意事项包括：


  - **测量命令：** 您将评估一种衡量命令执行时间的技术。

  - **Cmdlet 注意事项：** 您将学习哪些 cmdlet 更高效以及如何避免常见的 cmdlet 错误。

  - **正则表达式优于数组：** 正则表达式可能难以学习，但它们可为脚本提供显著的性能改进。您将学习如何在脚本中正确实现动态正则表达式。

  - **Switch 语句：** 您将评估如何使用 switch 进行数据排序以及 switch 语句为何显著更快。




  ## PowerShell 脚本模板


  随着你在企业环境中开发不同的脚本，你会有一组核心函数倾向于在所有脚本中使用。一些企业脚本编写者创建自己的函数，而其他人则利用庞大的 PowerShell 开发者社区的脚本。无论采用哪种方法，你都需要一个坚实的基础来构建脚本。


  本书记载的脚本模板中最常见的项目包括：


  - **加密和解密技术**：在企业环境中最常见的需求可能是安全性。众所周知，脚本中不应包含明文的管理员级凭据。在脚本中提供加密和解密功能对于维护安全的企业至关重要。

  - **日志机制**：企业环境中第二常见的需求是记录脚本操作。由于脚本通常同时在大量系统上执行，你需要能够追踪这些系统上正在执行的确切操作。创建日志功能将提供将脚本操作记录到事件日志和日志文件的能力。

  - **答案文件逻辑**：PowerShell 脚本编写的更高级方法之一是利用答案文件来管理脚本变量。答案文件的核心在于，你可以在不修改脚本的情况下添加、删除和修改答案文件中的值。这提供了在脚本中实现灵活性的能力，而无需触及任何代码行。

  - **标准化注释块**：在创建脚本时，为自己和其他人提供脚本功能的提醒至关重要。注释块能够提供有关脚本、修订历史和脚本执行参数的详细信息。


  无论你是 PowerShell 脚本编写的新手还是经验丰富，本书都提供了激发思考的方法来提升你的脚本编写能力。随着你阅读本书，强烈建议将这些示例融入自己的脚本中。这种应用型学习方法将显著帮助你保留内容，并提供一个非常强大的企业脚本平台。


