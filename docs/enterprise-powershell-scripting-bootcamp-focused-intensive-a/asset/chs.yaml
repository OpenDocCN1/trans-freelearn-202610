  \ 如果未找到产品版本，您将 $productversion 变量替换为 “Product Version n/a”。\n- 8. 然后您创建 “InstalledSoftware,”\
  \ + $file.Fullname + \" | Name: $productName | Version: $productVersion\" 字符串并将其放在\
  \ $value 变量中。\n- 9. 然后您使用 $value 利用 log 函数将各个软件可执行产品的产品名称和产品版本记录到 CSV 文件中。\n\n##\
  \ 用户配置文件函数\n\n要创建用于扫描系统配置文件以识别用户配置文件的函数，您可以执行以下操作：\n\n```\nfunction scan-profiles\
  \ {\ncheck-kill\n$profiles = get-wmiobject Win32_UserProfile\n    foreach ($profile\
