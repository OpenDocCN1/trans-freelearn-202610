  ## 前言


  PowerShell 正迅速成为组织中支持 Microsoft 系统的首选语言。随着 Microsoft 在其所有软件和云服务中深度集成 PowerShell，脚本知识将在未来几年成为必备技能。甚至第三方厂商也在创建模块或插件来扩展其系统
  PowerShell 的可管理性。因此，组织正依靠其跨平台工程师通过使用 PowerShell 来自动化系统。


  在企业环境中实施 PowerShell 脚本时，需要解决许多常见挑战。例如，通常需要强大的日志函数来确保脚本成功运行且按预期执行。您可能还需要实施字符串加密策略来加密凭据、服务器主机名、IP地址或其他敏感数据。此外，在处理大量数据时，脚本执行速度也需要考虑。您希望确保使用尽可能快的编码方法来优化脚本性能。


  所有这些挑战，以及更多挑战，都可以通过利用 PowerShell 来解决。通过原生 cmdlet 和 .NET Framework，您可以创建复杂的脚本来解决几乎任何问题。PowerShell
  开发者社区非常热衷于分享知识并提供解决问题的信息。通过代码共享网站、社交媒体和 Microsoft TechNet，始终有一股源源不断的示例可供您在代码中实现。此外，现在
  PowerShell 已开源并可在 Linux 上使用，它加深了与开源社区的关系。它提供了更广泛的开源开发者来解决企业问题。


  本书旨在教您企业 PowerShell 脚本编写的方方面面。它针对的是财富 500 强公司如何利用 PowerShell 解决问题的真实场景。它提供了一个脚本框架，您可以轻松遵循以开始将示例集成到自己的脚本中。读完本书后，您将学会许多技术来保护、优化和交付可部署到企业环境的
  PowerShell 脚本。


  ## 本书涵盖内容


  第1章《企业 PowerShell 脚本入门》介绍了 Windows 服务器扫描脚本和性能考虑，并帮助您创建自己的 PowerShell 脚本模板。


  第2章《脚本结构、注释块和脚本日志记录》探讨了如何构建 PowerShell 脚本、如何正确注释脚本以及如何创建强大的日志函数。


  第3章《使用答案文件》解释了基于 XML 的答案文件的用途并展示了如何在脚本中利用它们。


  第4章《字符串加密和解密》深入探讨了高级字符串加密和编码方法。它展示了如何在脚本中安全存储加密数据，以及如何在运行时解密和解码值。


  第5章《与服务、进程、配置文件和已登录用户交互》评估了不同 Windows 服务器组件的非标准配置。它还评估已登录用户和用户配置文件，以识别哪些用户与特定系统交互过。


  第6章《评估计划任务》展示了如何与系统上的计划任务交互。它有助于识别系统上可能按计划调用的不同进程。


  第7章《确定磁盘统计信息》探讨了如何与系统上的磁盘交互以检索和记录磁盘信息。


  第8章《Windows 功能和已安装软件检测》解释了如何查看系统上已安装的 Windows 功能和已安装软件。


  第9章《文件扫描》深入探讨了在服务器目录中扫描文件类型的过程。它还展示了扫描文件中字符串的过程。


  第10章《优化脚本执行速度》评估了如何通过使用不同的脚本技术提高服务器性能。它还评估了如何测量命令执行时间以基准测试脚本性能。


  第11章《使用正则表达式提高性能》展示了如何利用正则表达式显著提高 PowerShell 脚本的性能。


  第12章《整体脚本工作流程、终止文件和合并数据结果》评估了 Windows 服务器扫描脚本的整体工作流程和完整的答案文件创建。它还探讨了何时以及为何使用终止文件，以及如何合并
  Windows 服务器扫描脚本的结果。


  第13章《创建 Windows 服务器扫描脚本和执行后清理》提供了 Windows 服务器扫描脚本中所有组件的深入解释。它还提供了系统上脚本执行后清理的注意事项。


  ## 阅读本书所需条件


  要完成《企业 PowerShell 脚本训练营》中提供的示例，您需要访问两个 Server 2012 R2 或更高版本的 Windows Server 操作系统。最好将两个系统都加入域。本书的章节高度依赖
  Windows Management Framework，建议使用 5.0 版本以支持 PowerShell 5.0。您需要在运行这些示例的系统上下载并安装 Windows
  Management Framework。


  ## 本书适合人群


  《企业 PowerShell 脚本训练营》专为初级和高级编码员的 PowerShell 脚本编写者设计。阅读本书后，您将深入了解企业中的 PowerShell
  脚本编写，并创建可在环境中执行的可用脚本。需要先前的脚本和基础编码经验才能理解本书中介绍的概念。


