  \ 参数设置为 \"yyyyMMddmmss\" 属性来获取日期。\n- 2. 您使用 log 函数并传入 \"Windows Server Scanning\
  \ Script completed execution at $date\" \"Y\" \"Y\" 值。\n- 3. 如果已启用，这会将字符串同时添加到日志文件和事件日志中。\n\
  - 4. 您继续使用 log 函数并传入 \"Scriptend,$date\"。\n- 5. 这会在 CSV 文件中写入脚本完成的时间戳。\n- 6. 最后，您使用\
  \ copy-item cmdlet 并使用 -Force 参数将 $scnresults 文件复制到 $csvunc.id 路径。\n- 7. 您还使用 copy-item\
  \ cmdlet 并使用 -Force 参数将 $scanlog 文件复制到 $csvunc.id 路径。\n\n执行后，您将已完全扫描系统，并且日志文件位于文件共享中以供审查。\n\
  \n## 运行脚本\n\n脚本过程中的最后一步是调用 Windows 服务器扫描脚本。您需要确保答案文件与脚本位于同一目录中。您还希望保留答案文件的副本，因为\
  \ Windows 服务器扫描脚本将在执行后删除答案文件。\n\n要从命令行执行 Windows 服务器扫描脚本，您可以执行以下操作：\n\n```\npowershell.exe\
  \ -executionPolicy bypass -noexit -file\"c:\\temp\\ScanningScript.ps1\" \"AAZwAmAE4AMgAoAFEAVA...AhAF...\"\
  \n```\n\n此输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_232_0.png)\n\
  \n在此示例中，您成功启动 Windows 服务器扫描脚本：\n\n- 1. 您首先从提升的命令提示符调用 powershell.exe 可执行文件。\n- 2.\
  \ 您通过使用 -executionPolicy 参数并使用 bypass 参数来绕过 PowerShell 执行策略。\n- 3. 然后您使用 -noexit\
  \ 参数以确保 PowerShell 会话在执行后不会退出。\n- 4. 然后您使用 -file 参数并指定 c:\\temp\\ScanningScript.ps1\
  \ 脚本名称和位置。您需要将此值更新为与您的脚本名称相匹配。\n- 5. 最后，您将运行时解密器 \"AAZwAmAE4AMgAoAFEAVA...AhAF...\"\
  \ 作为调用 Windows 服务器扫描脚本的最终参数包含在内。\n\n执行此命令后，您将看到 Windows 服务器扫描脚本开始在系统上执行。\n\n## 执行脚本清理\n\
  \n一旦您在系统上完成 PowerShell 脚本的执行，您需要评估在系统上留下的数据占用情况。如果您正在创建文件，您需要确保它们不包含敏感数据。如果您使用答案文件，您需要确保它们已从系统上删除。\n\
  \n一些常见的脚本清理活动包括：\n\n- **删除答案文件**：由于答案文件通常包含敏感信息，您希望在脚本结束时验证文件已被删除。\n- **删除支持文件**：用于软件安装的任何文件都应从系统上删除。\n\
  - **删除敏感文件**：如果您正在收集敏感信息的数据，您需要确保从系统上删除文件。在某些情况下，您可能希望在写入数据时对其进行加密，以确保安全的数据收集体验。\n\
  - **确保所有由脚本创建的进程和作业已完成**：在某些情况下，您的 PowerShell 脚本可能会在系统上调用额外的进程和作业。在退出 PowerShell\
  \ 之前，您应验证所有进程和作业是否已成功完成。\n\n## 摘要\n\n在本章中，您学习了如何编写 Windows 服务器扫描脚本。您首先学习了 Windows\
  \ 服务器扫描脚本的结构。您继续进入核心脚本组件部分，在那里您定义了注释块、参数块，创建了答案文件读取函数、解密函数，填充了答案文件，创建了脚本的日志和日志函数，并创建了\
  \ check-kill 函数。\n\n\n\n你继续通过创建用于扫描磁盘、计划任务、进程、Windows 服务、软件、用户配置文件、Windows 功能以及包含字符串的文件目录的函数来创建脚本。然后你创建了一个部分来查询扫描脚本函数是否已启用，并在启用时调用这些函数。你通过在脚本文件末尾添加注释并将日志和\
  \ CSV 文件复制到 UNC 路径来完成脚本。你学习了如何通过命令行使用多个参数启动 Windows 服务器扫描脚本。本章以探索不同的执行后清理活动作为结尾。\n"
