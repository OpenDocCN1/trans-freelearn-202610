  \ 环境变量并将值放入 $compname 变量来获取计算机名称。然后你将 $compname 变量与加号、用于分隔的下划线与加号、日期时间戳与加号以及日志文件名\
  \ \"ServerScanScript.log\" 组合起来，并存储在 $logname 变量中。然后你通过指定 \"c:\\temp\\logs\\\" 与加号和\
  \ $logname 目录来创建完整日志路径，并将其存储在 $scanlog 变量中。最后，你利用 new-item cmdlet，-path 参数设置为 $scanlog，-ItemType\
  \ 设置为 File，-Force 参数。执行后，你将在 c:\\temp\\logs\\ 中拥有一个日志文件，文件名格式为 computername_datetimestamp_ServerScanScript.log。\n\
  \n要创建格式为 CSV 文件的带时间戳数据收集文件，可以执行以下操作：\n\n```\n$date = (Get-Date -format \"yyyyMMddmmss\"\
