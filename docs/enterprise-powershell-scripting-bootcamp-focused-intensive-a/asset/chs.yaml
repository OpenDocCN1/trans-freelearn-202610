  \ Windows 服务：\n\n- 1. 您首先定义 scan-services 函数。\n- 2. 您调用 check-kill 函数以确定脚本应继续还是终止。\n\
  - 3. 如果脚本可以继续，您利用 win32_service WMI 类获取有关 Windows 服务的信息。\n- 4. 您继续评估每个服务，以确定 .Startname\
  \ 属性是否与内置用户正则表达式匹配。\n- 5. 如果用户未被 $blstRegEx 正则表达式匹配，或 !($svcAuthUser -match $blstRegEx)，您将收集服务的\
  \ DisplayName。\n- 6. 您通过使用 log 函数并传入 “WindowsServicedata, Service with $svcdisplay\
  \ name is running with $svcAuthUser account.” 值来完成该函数。\n\n## 已安装软件函数\n\n要创建用于扫描系统上已安装软件的函数，您可以执行以下操作：\n\
