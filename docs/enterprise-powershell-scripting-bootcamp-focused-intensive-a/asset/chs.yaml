  - 6. 您获取功能的 .Name 属性并将其放在 $featurename 变量中。\n- 7. 最后，您使用 log 函数并传入 “ServerFeatureInfo,\
  \ $featurename feature is installed on the system.” 值。\n\n## 扫描文件和文件夹函数\n\n要创建用于扫描目录中包含特定字符串的文件的函数，您可以执行以下操作：\n\
