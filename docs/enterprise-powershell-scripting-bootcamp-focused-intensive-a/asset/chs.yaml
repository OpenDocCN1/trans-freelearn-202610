  \ cmdlet 并将其放入 $date 变量中。$date 变量随后将按顺序包含脚本执行时的四位年份、两位月份、两位日期、两位分钟和两位秒。你然后通过利用 $env:COMPUTERNAME\
  \ 环境变量并将值放入 $compname 变量来获取计算机名称。然后你将 $compname 变量与加号、用于分隔的下划线与加号、日期时间戳与加号以及日志文件名\
  \ _ScanResults.csv 组合起来，并存储在 $logname 变量中。然后你通过指定 \"c:\\temp\\logs\\\" 与加号和 $logname\
  \ 目录来创建完整日志路径，并将其存储在 $scanresults 变量中。然后你将利用 new-item cmdlet，-path 参数设置为 $scanresults，-ItemType\
  \ 设置为 File，-Force 参数。执行后，你将在 c:\\temp\\logs\\ 中拥有一个 .csv 文件，文件名格式为 computername_datetimestamp_ScanResults.csv。\n\
  \n最后，要向 CSV 文件添加标题，你将标题名称以 \"ServerName, Classification, Other Data\" 的形式分隔并存储在\
  \ $csvheader 变量中。然后你通过利用 Add-content cmdlet，-path 参数设置为 $scanresults，-value 参数设置为\
  \ $csvheader，将标题添加到 CSV 文件中。computername_datetimestamp_ScanResults.csv 文件将具有 ServerName、Classification\
  \ 和 Other Data 的标题。\n\n在 Excel 中打开 CSV 文件时，标题显示如下：\n\n![](img/a27a138d6586c10902d8e86ab3384834_34_0.png)\n\
  \n> 你可以选择通过不使用 $compname 变量添加计算机名称来优化此代码。或者，你也可以在设置 $logname 变量时直接调用 $env:COMPUTERNAME\
  \ 变量。该脚本编写的目的是展示日志文件字符串的构建过程，其中包含计算机名称、日期时间戳和脚本文件名。\n\n\n\n## 创建 Windows 事件日志源\n\
  \n如果您想要写入 Windows 事件日志，其先决条件之一是将脚本作为事件源注册到 Windows 事件日志系统。这是使用 New-EventLog cmdlet\
  \ 完成的。您首先指定 New-EventLog cmdlet，然后是 -LogName 参数，后跟事件日志名称。您可以选择自己的事件日志，也可以指定内置事件日志之一，例如\
  \ Application 或 System。最后，您使用正在执行的脚本名称指定 -Source 参数。\n\n事件日志源只能注册一次，这可能导致在同一系统上多次执行脚本时出现错误。您可以通过指定带有\
  \ -LogName 参数的 get-eventlog cmdlet 并将结果通过管道传递到 Select-object Source -Unique 来检索事件日志源。这并不理想，因为它要求系统查询所有日志事件以确定源是否已注册。由于\
  \ Windows 系统具有大量事件日志和日志事件，因此该查询非常占用 CPU 和内存。\n\n避免重复事件日志源错误消息的最快方法是抑制错误消息本身。这是通过使用\
  \ New-EventLog cmdlet 将 -ErrorAction 参数设置为 SilentlyContinue 来实现的。指定 SilentlyContinue\
  \ 的 -ErrorAction 参数将捕获错误并静默继续执行脚本，从而抑制错误消息。\n\n要注册新的事件日志源并抑制错误消息，您可以执行以下操作：\n\n\
  ```\nNew-EventLog -LogName Application -Source \"WindowsServerScanningScript\" -ErrorAction\
  \ SilentlyContinue\n```\n\nPowerShell 窗口的输出将如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_35_0.png)\n\
  \n前面的脚本演示了如何使用 Windows 事件日志系统注册新的事件日志源。您首先使用 -LogName 参数设置为 Application 的 New-EventLog\
  \ cmdlet。然后您指定 -Source 参数并将其设置为脚本名称 “WindowsServerScanningScript”。最后，您通过使用 -ErrorAction\
  \ 参数并将其设置为 SilentlyContinue 来抑制错误消息。执行此命令后，您将能够使用事件源 WindowsServerScanningScript\
  \ 写入 Application 事件日志。\n\n![](img/a27a138d6586c10902d8e86ab3384834_36_0.png)\n\n\
  > 当您创建事件日志源时，它提供了使用该源记录消息的能力。您需要向该事件日志源写入内容，才能使其出现在 Application 事件日志中。\n\n![](img/a27a138d6586c10902d8e86ab3384834_36_1.png)\n\
  \n> Windows 事件日志 cmdlet 要求 PowerShell 窗口以管理员身份运行。在测试此代码时，您需要右键单击 PowerShell 图标并选择以管理员身份运行。如果您远程执行此代码，可能需要确保您使用的用户凭据对系统具有管理员权限。\n\
  \n## 创建日志函数\n\n在创建日志文件并注册事件日志源之后，您现在可以创建自定义日志函数。日志函数具有灵活性，因为它可以接受三种类型的数据写入的参数。这些包括事件日志、日志文件和数据收集\
  \ .csv 文件。\n\n日志函数使用 function log { 声明。然后您需要利用参数块将参数接受到函数中。参数块使用 param() 声明，并包括变量\
  \ $string、$scnlg 和 $evntlg。$string 将是信息、警告、错误或数据收集内容的字符串值。$scnlg 变量决定内容是否写入扫描日志文件。$evntlg\
  \ 变量决定内容是否写入事件日志。\n\n要创建日志函数的开头，请输入以下内容：\n\n```\nfunction log { param($string, $scnlg,\
  \ $evntlg)\n```\n\n使用日志函数的参数变体，您可以将日志信息写入不同的位置。您可以设置以下内容：\n\n- 如果将 $scnlg 设置为 Y\
  \ 且未为 $evntlg 指定值，脚本将仅写入扫描日志文件。\n- 如果将 $scnlg 设置为 N 且将 $evntlg 设置为 Y，脚本将仅写入事件日志。\n\
  - 如果将 $scnlg 设置为 Y 且将 $evntlg 设置为 Y，脚本将同时写入扫描日志文件和事件日志。\n- 如果除 $string 之外的参数未传递到函数中，它将把内容写入数据收集\
  \ CSV 文件。\n- 在所有情况下，日志函数都将使用 write-host cmdlet 并使用 $string 变量的内容。这将详细打印所有日志变体。\n\
  \n要创建完整的日志函数，您可以执行以下操作：\n\n```\nfunction log { param($string, $scnlg, $evntlg)\n\
  \    # If Y is populated in the second position, add to log file.\n    if ($scnlg\
  \ -like \"y*\") {\n        Add-content -path $scanlog -Value $string\n    }\n  \
  \  # If Y is populated in the third position, Log Item to Event Log As well\n  \
  \  if ($evntlg -like \"y*\") {\n        write-eventlog -logname Application -source\
  \ \"WindowsServerScanningScript\" -eventID 1000 -entrytype Information -message\
  \ \"$string\"\n    }\n    # If there are no parameters specified, write to the data\
  \ collection file (CSV)\n    if (! $scnlg) {\n        $content = \"$env:COMPUTERNAME,$string\"\
  \n        Add-Content -path $scanresults -Value $content\n    }\n    # Verbose Logging\n\
  \    write-host $string\n}\n```\n\n```\n$date = Get-Date\nlog \"Starting WindowsServerScanningScript\
  \ at $date ...\" \"y\" \"y\"\nlog \"Writing a message to the Event Log Only.\" \"\
  N\" \"y\"\nlog \"ScriptStart,$date\"\n```\n\n此脚本的输出将如下所示的屏幕截图：\n\n![](img/a27a138d6586c10902d8e86ab3384834_38_0.png)\n\
  \n此示例演示如何创建日志函数并将信息记录到日志文件、事件日志和数据收集 CSV 文件。首先，您先声明 function log {。然后您使用 param($string,\
  \ $scnlg, $evntlg) 代码段将三个参数接受到函数中。然后您创建一个 IF 语句来确定 $scnlg 内容是否 -like “Y”。如果返回 true，则执行\
  \ Add-content cmdlet，将 -path 参数设置为 $scanlog，将 -Value 参数设置为 $string。字符串的内容现在将在 $scanlog\
  \ 文件中。\n\n第二个 IF 语句评估 $evntlg 内容是否 -like “Y”。如果返回 True，则使用 -logname 参数设置为 Application\
  \ 的 write-eventlog cmdlet。您还包括 -source 参数设置为 “WindowsServerScanningScript”、-eventID\
  \ 参数设置为事件 ID 号 1000、-entrytype 参数设置为 Information 以及 -message 属性设置为 $string。字符串的内容现在将在\
  \ Application 事件日志中，源为 WindowsServerScanningScript，事件 ID 为 1000。\n\n> 某些企业环境具有可以解析事件日志并根据事件\
  \ ID 触发操作的监控解决方案。作为传递 “Y” 的替代方案，您可以传递事件 ID，从而自动使用这些监控系统触发警报。您需要将 if 语句更新为 if ($evntlg)\
  \ {}，如果变量中包含数据则返回 True。然后您可以在脚本中将 -eventID 参数设置为 $evntlg，从而能够根据需要更改事件 ID。\n\n第三个\
  \ if 语句确定 $scnlg 变量中是否有任何数据。这意味着默认操作将写入数据收集 CSV 文件。您使用在 $scnlg 变量前加上感叹号的 if 语句。这指定如果不是\
  \ True，或者该变量中未传递任何数据，则继续执行下一步。然后您指定环境变量 $env:COMPUTERNAME，后跟逗号，后跟 $string 变量，并将值设置为\
  \ $content 变量。然后您通过使用 -path 参数设置为 $scanresults 且 -value 参数设置为 $content 的 Add-content\
  \ cmdlet 将 $content 变量写入 CSV 文件。\n\n函数的最后一步是通过使用 write-host cmdlet 并将 $string 作为内容来显示内容。\n\
  \n要测试脚本，您然后使用 Get-Date cmdlet 获取日期时间戳并将值设置为 $date 变量。然后您使用第一个参数为 “Starting WindowsServerScanningScript\
  \ at $date”、第二个参数为 “Y”、第三个参数为 “Y” 调用 log 函数。这会将第一个参数中的内容同时写入日志文件和事件日志。\n\n以下显示了所创建日志文件的内容：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_39_0.png)\n\n以下显示了脚本生成的事件日志的内容：\n\n![](img/a27a138d6586c10902d8e86ab3384834_39_1.png)\n\
  \n\n\n然后你再次调用 log 函数，第一个参数为 \"Writing A Message to the Event Log Only.\"，第二个参数为\
  \ \"N\"，第三个参数设为 \"Y\"。这会将信息写入应用程序日志，来源为 WindowsServerScanningScript，事件 ID 为 1000。\n\
  \n以下显示了由脚本生成的事件日志的内容：\n\n![](img/a27a138d6586c10902d8e86ab3384834_40_0.png)\n\n\
  最后，你调用 log 函数并将第一个参数设为 \"Script, $date\"。此函数未指定其他参数。脚本随后将按照以下语法写入数据收集 CSV 文件—— \"\
  computer name, ScriptStart, DateTimestamp\"。\n\n以下显示了所创建的数据收集 CSV 文件的内容：\n\n| A\
  \ | B | C | D |\n|---|---|---|---|\n| 服务器名称 | 分类 | 其他数据 |  |\n| DESKTOP-VJ71805\
  \ | ScriptStart | 201701242748 |  |\n|  |  |  |  |\n\n## 摘要\n\n在本章中，你成功学习了脚本模板的三个核心组件。第一个组件是定义脚本结构。你学习了各个脚本组件所需的所有位置。然后你学习了如何编写注释块以及在注释块本身中包含的正确文档。最后，你学习了如何为脚本创建日志机制。你首先学习了如何创建带时间戳的日志文件，然后学习了如何创建数据收集\
  \ CSV 文件，以及如何创建新的事件日志源。最后，你将所有组件放在一起创建了一个名为 log 的函数。\n\n在下一章中，你将探索脚本的应答文件和排除列表。\n"
- "# 3 使用应答文件\n## 使用应答文件\n\n随着你继续开发 Windows 服务器扫描脚本，你可能会遇到需要修改脚本以在不同环境中运行的情况。虽然在一两行脚本中修改代码的风险相对较低，但大型企业脚本需要更好的结构和流程。一般的经验法则是，如果你需要为不同场景调整脚本中的值，就应该将这些值放入应答文件中。应答文件的内容在运行时读取，并将这些值用作脚本的输入。这为你的脚本提供了另一层稳定性，因为你不会通过修改脚本本身的代码而增加风险。\n\
  \n应答文件有许多不同的格式。.NET 程序的行业标准是基于 XML 的应答文件。这是因为 XML 标准中内置了文件格式完整性。如果应答文件格式不正确，应用程序将无法使用它。PowerShell\
  \ 具有内置的 XML 支持，可以创建、读取、修改和利用 XML 文件，这使其非常适合脚本应答文件。\n\n在本章中，你将：\n\n- 探索可以利用应答文件的不同方式\n\
  - 学习基于 XML 的文件的结构\n- 读取基于 XML 的应答文件中各个标签、属性和属性值\n- 创建一个函数从 XML 文件中提取不同的元素并将它们存储在变量中\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_42_0.png)\n\n> 本章中的示例相互构建。你需要按顺序执行脚本，才能使本章中的示例正常工作。\n\
  \n## 应答文件\n\n在你开发企业脚本模板时，你会发现可能需要为在不同环境中运行而修改代码的少量部分。例如，如果你在多个不信任的 Active Directory\
  \ 森林中使用相同的脚本，你很可能需要在脚本中存储有关这些相应森林的信息。这会造成复杂性，因为你必须为多个森林管理多个脚本。不仅效率低下，而且更改已验证的脚本会引入大量脚本错误的风险。\n\
  \n减少这种风险的常见方法是利用应答文件。应答文件是包含将在脚本中使用的信息的单独文件。这使你能够修改脚本的参数，而无需触及脚本本身的代码。\n\n包含在应答文件中的最常见项目包括：\n\
  \n- **脚本日志位置**：这定义了你希望存储所有日志文件的位置。这通常是本地系统或 UNC 路径。\n- **数据源**：这定义了连接到不同数据源类型的连接字符串信息。这可能包括服务器信息、用户名、密码、端口号和驱动程序信息。\n\
  - **数据输出信息**：这定义了你希望存储脚本输出的位置。这可能是电子邮件服务器信息、数据库信息或存储文件的 UNC 路径。\n- **加密数据**：任何加密的用户名、密码、服务器名称、安全密钥和其他安全数据都可以存储在应答文件中。由于你可以在脚本中执行后轻松删除应答文件，因此这是一种常见的数据类型存储位置。\n\
  - **包含/排除列表**：包含和排除列表是你希望在脚本中使用的列表数据。通常，这些列表存储为数组或正则表达式。\n- **启用/禁用脚本功能**：管理员快速打开和关闭脚本部分的常见需求。与其注释掉代码，你可以利用应答文件快速启用和禁用代码块。\n\
  \n> 强烈建议不要在脚本或应答文件中使用明文用户名和密码。由于 PowerShell 脚本和应答文件以人类可读的明文编写，因此建议仅利用安全的方法来存储凭据。这将在后面的章节中讨论。\n\
  \n## XML 应答文件\n\n脚本语言使用的应答文件格式有很多种。像 .NET 这样的语言利用 .config 格式的文件进行应用程序配置，而像 Java\
  \ 这样的语言利用 .properties 格式的文件进行配置数据。虽然你可以使用逗号分隔值（CSV）文件作为 PowerShell 的应答文件，但强烈建议使用可扩展标记语言（XML）格式的文件。\n\
  \nXML 由万维网联盟（W3C）创建，用于标准化文档的编码，使其既可供人类阅读又可供计算机系统使用。XML 格式与超文本标记语言（HTML）非常相似。如果你了解\
  \ HTML 的基础知识，应该能很快掌握 XML。\n\nXML 文件语法的四个主要组件是：\n\n- **XML 声明：** XML 声明是 XML 文档本身开头的一个强制性行。声明告诉\
  \ XML 解析器使用哪个 XML 规范版本以及使用哪个编码格式（可选）。\n- **XML 注释：** 注释是数据，与 PowerShell 中的注释一样。它们为开发人员提供有关\
  \ XML 文件中各个部分或单个项目的的信息。\n- **XML 标签：** 当你在 XML 文件中构建多个标签时，你需要遵循 XML W3C 文档对象模型（DOM）树结构。简单来说，XML\
  \ DOM 树结构由父级、子级和同级组成。父级是分组标签，用于分组子标签。如果父标签中有多个子标签，则各个子标签是同级。\n- **XML 属性和元素：** 定义单个\
  \ XML 标签数据的有两种方法。第一种方法是利用属性和属性值。属性是描述与 XML 标签相关的项目的唯一名称。属性值是你希望为该属性存储的任何数据。第二种方法是利用元素或内部\
  \ XML 数据。此数据也与标签相关联。当 XML 解析器在脚本中调用标签时，元素将被返回以供使用。\n\n\n\n一个 XML 答案文件的示例如下所示：\n\n\
  ```\n```xml\n<?xml version=\"1.0\"?>\n<!-- XML Comment -->\n<!-- XML Declaration\
  \ -->\n\n<!-- XML Parent Tag -->\n<ScriptAnswers>\n\n    <!-- XML Child Tag -->\n\
  \    <ports port=\"21\" name=\"FTP\"></ports>\n\n    <!-- XML Sibling Tags -->\n\
  \    <ports port=\"25\" name=\"SMTP\"></ports>\n    <ports port=\"53\" name=\"DNS\"\
  ></ports>\n    <ports port=\"80\" name=\"HTTP\"></ports>\n    <ports port=\"443\"\
  \ name=\"HTTPS\"></ports>\n\n<!-- XML Parent Closing Tag -->\n</ScriptAnswers>\n\
  ```\n```\n\n前面的图形显示了一个格式正确的 XML 答案文件。文件通过指定 XML 声明来打开。这必须是 XML 文件中的第一行，否则你会收到语法错误。它以\
  \ <?xml 开头，并且将属性 version 设置为属性值 1.0。声明随后以 ?> 关闭。脚本随后展示了 XML 注释的使用。注释的语法以 <!-- 开头，后跟注释，并以\
  \ --> 关闭。\n\n答案文件继续声明父标签 <ScriptAnswers>。在父标签之后，声明了子标签 <ports。该标签将 port 属性设置为属性值\
  \ 21，并将 name 属性设置为 FTP。标签通过声明 </ports> 来关闭。脚本继续使用 ports 的同级标签。它显示了 SMTP 的端口 25、DNS\
  \ 的 53、HTTP 的 80 以及 HTTPS 的 443。最后，XML 文件以父关闭标签 </ScriptAnswers> 关闭。\n\n要完成本章中的示例，你需要在\
  \ C:\\Temp\\POSHScript\\ 位置创建一个名为 Answers.xml 的新 XML 文件。利用你选择的文本编辑器，将前面数据插入 Answers.xml\
  \ 文件中。示例也是相互关联的，因此你希望按顺序执行本章，以确保所有代码示例都能正常工作。\n\n你也可以参考本章的代码文件，以便快速创建前面描述的内容。\n\n\
  ## 读取 XML 答案文件\n\nPowerShell 能够原生读取和解析 XML 文件中的数据。这是通过将 XML 文件加载到 XML 文档对象中，使用 get-content\
  \ cmdlet 来完成的。你首先通过将数据类型设置为 [xml] 来定义一个像 $xmlfile 这样的变量。然后你调用 get-content cmdlet，并将\
  \ -path 参数设置为 XML 文件的位置。如果你定义变量时省略了 [xml] 数据类型，它会将文件解释为文本文件。这意味着你将无法利用任何内置的 XML\
  \ 支持。\n\n加载你之前创建的 XML 答案文件，可以执行以下操作：\n\n```\n[xml] $xml = get-content \"C:\\temp\\\
  POSHScript\\Answers.xml\"\n$xml\n```\n\n此命令的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_46_0.png)\n\
  \n此示例展示了如何正确获取 XML 文件的内容并将其放入 XML 格式的变量中。命令首先声明 [xml] 数据类型，然后是 $xml 变量。你随后利用 get-content\
  \ cmdlet 并声明内容路径为 \"C:\\temp\\POSHScript\\Answers.xml\"，内容存储在 $xml 变量中。最后，你调用 $xml\
  \ 变量以显示 XML 格式的内容。\n\n在检索到 XML 文件的内容后，你将希望检索单个 XML 标签，以便将配置信息存储在脚本的内存中。.GetElementsByTagName(\"\
  TagName\") 方法使你能够搜索名称为特定值的标签。这将返回 XML 标签的属性和元素。如果存在同名标签，或子标签有同级标签，该方法将返回所有等于方法中指定的标签值的值。\n\
  \n要检索 XML 文件的内容并检索特定的标签信息，可以执行以下操作：\n\n```\n[xml] $xml = get-content \"C:\\temp\\\
  POSHScript\\Answers.xml\"\n$ports = $xml.GetElementsByTagName(\"ports\")\n$ports\
  \ | Select Name, Port\n```\n\n此命令的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_47_0.png)\n\
  \n此示例展示了如何获取 XML 文件的内容，将其放入 XML 格式的变量中，并通过 XML 标签名称检索数据。命令首先声明 [xml] 数据类型，然后是 $xml\
  \ 变量。你随后利用 get-content cmdlet 并声明内容路径为 \"C:\\temp\\POSHScript\\Answers.xml\"，内容存储在\
  \ $xml 变量中。\n\n你随后在 $xml 变量上使用 \"ports\" 参数利用 .GetElementsByTagName() 方法来获取名为 \"\
  ports\" 的 XML 标签。执行此命令后，你将在 $ports 变量中拥有与标签名称 \"ports\" 匹配的子级和同级信息。然后你将 $ports 管道传输到\
  \ Select Name, Port，这将显示 Name 和 Port 属性的属性值。\n\n> 一旦你调用 get-content cmdlet 并将 XML\
  \ 数据放入变量中，你就不再处理 XML 文件中包含的数据。你将处理 XML 文件的内存副本。如果你更改 XML 文件中的任何内容，你需要重新运行 get-content\
  \ cmdlet 以在内存中获得更新的副本。\n\nXML 还支持使用点表示法检索 XML 标签数据。使用点表示法，你只需通过调用标签名称和属性，以句点分隔，即可检索所有父级、子级和同级标签。对于前面的示例，你可以调用\
  \ $ports.Name 来返回 FTP、SMTP、DNS、HTTP 和 HTTPS。你也可以直接引用 $xml 内容并指定 $xml.ScriptAnswers.Ports.Name\
  \ 来返回 FTP、SMTP、DNS、HTTP 和 HTTPS。\n\n使用点表示法查看端口名称，可以输入以下内容：\n\n```\n$ports.Name\n\
  $xml.ScriptAnswers.Ports.Name\n```\n\n此命令的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_48_0.png)\n\
  \n前面的示例展示了如何在 PowerShell 中利用点表示法查看 XML 内容中的不同属性。第一个示例利用 $ports 变量通过点表示法引用 Name 属性。这返回了\
  \ FTP、SMTP、DNS、HTTP 和 HTTPS。第二个示例展示了使用顶级 XML 内容来引用子级和同级属性。这是通过在 $xml 内容、父级 ScriptAnswers、子级\
  \ Ports 和属性 Name 之间使用点表示法完成的。这返回了 FTP、SMTP、DNS、HTTP 和 HTTPS。\n\n## XML 标签函数\n\n\
  随着你开始构建更复杂的脚本，你可能会在答案文件中添加更多标签。你可以使用标签名称作为参数利用 .GetElementsByTagName() 方法来收集答案文件中的额外数据。这使你能够单独调用每个标签并将内容存储到变量中。\n\
  \n当你利用 .GetElementsByTagName() 方法时，它只读取一次数据并将数据存储在变量中。这意味着如果 XML 文件发生变化，数据不会自动在变量中更新。你需要第二次调用该方法以收集\
  \ XML 文件中数据的更新副本。\n\n或者，你也可以选择创建一个函数来读取单个 XML 标签。此函数每次调用时都可以刷新内存中的 XML 内容。这使得函数可以在脚本的多个部分中调用，并且始终具有当前的\
  \ XML 数据。\n\n考虑以下用于 XML 标签函数的答案文件（Scan_Answers.xml）：\n\n```\n```xml\n<?xml version=\"\
  1.0\"?>\n<ScriptAnswers>\n    <!-- This section enables and disables features in\
  \ the script -->\n    <!-- To Enable Logging For Each Step, Set To True. To Disable\
  \ Logging, Set to False -->\n    <verboselog id=\"False\"></verboselog>\n    <!--\
  \ Scan Disks -->\n    <scndisks id=\"True\"></scndisks>\n    <!-- Scan Scheduled\
  \ Tasks -->\n    <scnschtks id=\"True\"></scnschtks>\n    <!-- Scan Processes -->\n\
  \    <scnproc id=\"True\"></scnproc>\n    <!-- Scan Services -->\n    <scnsvcs id=\"\
  True\"></scnsvcs>\n    <!-- Scan Software -->\n    <scnsoft id=\"True\"></scnsoft>\n\
  \    <!-- Scan User Profiles -->\n    <scnuprof id=\"True\"></scnuprof>\n    <!--\
  \ Scan Windows Features -->\n    <scnwfeat id=\"True\"></scnwfeat>\n    <!-- Scan\
  \ Files -->\n    <scnfls id=\"True\"></scnfls>\n    <!-- Scan Windows Updates -->\n\
  \    <scnwupd id=\"True\"></scnwupd>\n</ScriptAnswers>\n```\n```\n\n前面的 XML 文件和数据将在本章的其余部分中使用。要完成本章中的示例，你需要在\
  \ c:\\Temp\\POSHScript\\ 位置创建一个名为 Scan_Answers.xml 的新 XML 文件。利用你选择的文本编辑器，将之前的数据插入\
  \ Scan_Answers.xml 文件中。\n\n> 你也可以参考本章的代码文件，以便快速创建前面描述的内容。\n\n要创建 XML 标签读取函数，可以执行以下操作：\n\
  \n```\n```powershell\n# Answer File Location\n$xmlfile = \"c:\\temp\\POSHScript\\\
  Scan_Answers.xml\"\nFunction read-xmltag { param($xmlanswers, $xmlextract)\n   \
  \ # Validate that the XML file still exists\n    $test = test-path $xmlanswers\n\
  \    if (!$test) {\n        Write-Error \"$xmlanswers not found on the system. Select\
  \ any key to exit!\"\n        # Stop the Script for reading the Error Message\n\
  \        PAUSE\n```\n\n```powershell\n# Exit the Script\n    exit\n}\n# Read XML\
  \ Data\n[xml] $xml = (get-content $xmlanswers)\nreturn $xml.GetElementsByTagName(\"\
  $xmlextract\")\n}\n# Determine Features of Script\n$logging = (read-xmltag $xmlfile\
  \ \"verboselog\").id\n$scanDisks = (read-xmltag $xmlfile \"scndisks\").id\n$scanSchTasks\
  \ = (read-xmltag $xmlfile \"scnschtks\").id\n$scanProcess = (read-xmltag $xmlfile\
  \ \"scnproc\").id\n$scanServices = (read-xmltag $xmlfile \"scnsvcs\").id\n$scanSoftware\
  \ = (read-xmltag $xmlfile \"scnsoft\").id\n$scanProfiles = (read-xmltag $xmlfile\
  \ \"scnuprof\").id\n$scanFeatures = (read-xmltag $xmlfile \"scnwfeat\").id\n$scanFiles\
  \ = (read-xmltag $xmlfile \"scnfls\").id\n$scanWinUpdates = (read-xmltag $xmlfile\
  \ \"scnwupd\").id\n#Display Features\nWrite-host \"Script Scanning Settings: Verbose\
  \ Logging: $logging | Scan Disks: $scanDisks | Scan Scheduled Tasks: $scanSchTasks\
  \ | Scan Processes: $scanProcess | Scan Services: $scanServices | Scan Software:\
  \ $scanSoftware | Scan Profiles: $scanProfiles | Scan Features: $scanFeatures |\
  \ Scan Files: $scanFiles | Scan Windows Updates: $scanWinUpdates\"\n# Intentional\
  \ Wrong Answer File Path to Display Error\nread-xmltag \"C:\\Temp\\POSHScript\\\
  DOES_NOT_EXIST.xml\" \"scndisks\"\n```\n\n该脚本的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_50_0.png)\n\
  \n本示例演示了如何正确创建 XML 读取函数，使其在每次调用时读取 XML 文件。它还展示了如何在脚本中显示收集到的 XML 数据。脚本通过显示缺失 XML\
  \ 答案文件的错误处理来完成。\n\n首先，通过将 $xmlfile 变量设置为 c:\\temp\\POSHScript\\Scan_Answers.xml\
  \ 来定义 XML 文件位置。然后你继续声明新函数，声明 function read-xmltag {}。由于在调用函数时你将提供 XML 文件位置和标签名称，因此通过声明\
  \ param ($xmlanswers, $xmlextract) 创建参数块。使用时，$xmlanswers 将包含文件名，而 $xmlextract 将包含\
  \ XML 标签名称。\n\n你继续使用 test-path cmdlet 来确定 $xmlanswers 中声明的文件是否存在于系统中，并将值设置为 $test。你然后创建语句\
  \ if (!$test) {}，即如果不为真，则使用 write-error cmdlet 抛出 $xmlanswers 未在系统上找到的错误。按任意键退出！然后你执行\
  \ PAUSE 命令，以暂停脚本并为用户提供阅读错误消息的机会。然后你提供 exit 命令以关闭 PowerShell 脚本。这样做是为了确保如果答案文件不存在，脚本将无法正常运行。\n\
  \n如果 $test 等于 true，即答案文件存在，你继续读取答案文件中的数据。你使用 $xmlanswers 作为参数调用 get-content cmdlet，将内容存储在变量\
  \ $xml 中，该变量的强制数据类型为 [xml]。最后，你使用 $xmlextract 参数调用 $xml.GetElementsByTagName() 方法来收集标签信息。不是将结果存储在变量中，你使用\
  \ return，它将值返回给原始调用函数。通过执行此函数，你有效地将参数传递给函数，操作数据，并将结果返回给脚本以供将来使用。\n\n然后你继续将来自 XML\
  \ 答案文件的脚本设置数据存储在各个变量中。你首先声明一个变量并执行 read-xmltag 函数，第一个参数为 $xmlfile，第二个参数为你想要从答案文件中提取的\
  \ XML 标签。当函数执行时，它返回所有标签元素，包括属性和属性值。由于你只想要 id 属性的属性数据，你在 read-xmltag 语句周围使用括号并使用点表示法指定\
  \ id。Settings 变量现在将包含来自 XML 答案文件的设置信息。这一过程重复多次，直到 XML 答案文件中的所有设置都存储在变量中。\n\n然后你使用\
  \ write-host cmdlet 显示来自 XML 文件的不同设置值。当你执行命令时，脚本返回 Script Scanning Settings: Verbose\
  \ Logging: False | Scan Disks: True | Scan Scheduled Tasks: True | Scan Processes:\
  \ True | Scan Services: True | Scan Software: True | Scan Profiles: True | Scan\
  \ Features: True | Scan Files: True | Scan Windows Updates: True。\n\n脚本中使用的最后一个命令指定了一个无效的\
  \ XML 答案文件 \"C:\\temp\\POSHScript\\DOES_NOT_EXIST.xml\"。由于这是一个无效文件，脚本会抛出错误消息 read-xmltag:\
  \ C:\\Temp\\POSHScripts\\DOES_NOT_EXIST.xml 未在系统上找到。按任意键退出！当你按下键盘上的任意键时，脚本退出。\n\n\
  ![](img/a27a138d6586c10902d8e86ab3384834_52_0.png)\n\n> 在某些情况下，PowerShell 2.0 可能无法使用点表示法。为了解决此问题，你可以使用相同的函数调用，但不要使用\
  \ .id 的点表示法，而是将结果通过管道传递给 Select id。\n\n## 摘要\n\n本章中，你学习了答案文件的基础知识以及它们为何与脚本结合使用。你学习了\
  \ XML 的结构以及如何创建基于 XML 的答案文件。你继续探索如何从文件中读取标签数据。然后你创建了一个名为 read-xmltag 的函数，用于从答案文件读取标签数据。最后，你学习了如何将\
  \ XML 答案文件数据存储在变量中以便在脚本后面使用。在下一章中，你将学习如何利用 RijndaelManaged 256 位加密进行字符串加密和解密。\n"
- "# 4 RijndaelManaged 加密\n字符串加密\n和解密\n\n大型企业通常具有行业特定法规要求的非常严格的安全标准。当你创建 Windows 服务器扫描脚本时，需要在某些安全概念的指导下谨慎处理脚本。你可能遇到的最常见情况之一是在脚本中需要使用敏感数据，例如凭据。虽然你可以在运行时提示输入敏感数据，但大多数企业希望使用零接触自动化来完全自动化脚本。\n\
  \n零接触自动化要求脚本是自包含的，并且具有成功运行所需的所有凭据和组件。然而，将敏感数据纳入脚本的问题在于数据可以以明文形式获取。脚本中使用明文密码是不良做法，并且违反了许多法规和安全标准。\n\
  \n因此，PowerShell 脚本编写者需要一种方法来安全地存储和检索敏感数据以在脚本中使用。保护敏感数据的一种流行方法是加密敏感字符串。本章探讨 RijndaelManaged\
  \ 对称加密，以及如何使用 PowerShell 加密和解密字符串。\n\n本章将涵盖以下主题：\n- 了解 RijndaelManaged 对称加密\n- 了解加密算法的\
  \ salt、init 和 password\n- 编写创建随机 salt、init 和 password 值的方法\n- 使用 RijndaelManaged\
  \ 加密加密和解密字符串\n- 为加密密码创建编码和数据分离安全机制\n\n> 本章中的示例相互构建。你需要按顺序执行脚本，才能使本章的最终脚本正常工作。\n\n\
  ### RijndaelManaged 加密\n\n当你创建脚本时，最佳做法是为敏感数据使用某种混淆或加密。有许多不同的策略可以用来保护你的数据。其中之一是利用字符串和脚本编码。编码会将你的可读字符串或脚本打乱，使他人更难看到实际代码是什么。编码的缺点是你必须解码脚本才能对其进行更改，并且解码不需要使用密码或密码短语。因此，有人可以使用与你解码脚本相同的方法轻松解码你的敏感数据。\n\
  \n编码的替代方案是利用加密算法。加密算法提供了多种保护脚本和字符串的机制。虽然你可以加密整个脚本，但最常见的是加密脚本本身或答案文件中的敏感数据。\n\n与\
  \ PowerShell 一起使用的最受欢迎的加密算法之一是 RijndaelManaged。RijndaelManaged 是一种对称分组密码算法，美国国家标准与技术研究院（NIST）为其高级加密标准（AES）实现而选定。使用\
  \ RijndaelManaged 实现 AES 标准时，它支持 128 位、192 位和 256 位加密。\n\n![](img/a27a138d6586c10902d8e86ab3384834_55_0.png)\n\
  \n\n\n与编码不同，加密算法需要额外的信息才能正确加密和解密字符串。在 PowerShell 中实现 RijndaelManaged 时，算法需要 **盐**、**密码**\
  \ 和 **初始化向量** (IV)。**盐** 通常是一个随机值，每次使用加密算法时都会发生变化。在传统的加密场景中，**盐** 的目的是每次使用加密函数时更改加密值。这在加密多个具有相同值的密码或字符串的场景中很重要。如果两个用户使用相同的密码，则数据库中的加密值也将相同。通过每次更改\
  \ **盐**，密码虽然值相同，但在数据库中会有不同的加密值。在本章中，我们将使用静态盐值。\n\n**密码** 通常是由用户手动输入的值，或通过参数块输入到脚本中。您也可以从证书、Active\
  \ Directory 属性值或多种其他来源派生密码值。在本章中，我们将使用三个来源作为密码。\n\n**初始化向量** (IV) 是从 IV 字符串生成的哈希值，并用于\
  \ **加密密钥**。IV 字符串也通常是一个随机值，每次使用加密算法时都会发生变化。IV 字符串的目的是加强加密算法创建的哈希值。这是为了阻止黑客使用预先计算的哈希表进行彩虹攻击，而这些哈希表不使用\
  \ IV 字符串或使用常用字符串。由于您设置了 IV 字符串，哈希组合的数量呈指数级增长，从而降低了彩虹攻击的有效性。在本章中，我们将使用静态初始化向量值。\n\
  \n盐和初始化向量字符串的随机化实现在加密大量数据的情况下变得更加重要。攻击者可以拦截数十万个数据包或字符串，从而揭示有关您 IV 的越来越多的信息。有了这些信息，攻击者可以猜测\
  \ IV 并推导出密码。\n\n![](img/a27a138d6586c10902d8e86ab3384834_56_0.png)\n\n> IV 最著名的攻击案例是使用弱或较小的初始化向量的\
  \ **有线等效隐私** (WEP) 无线协议。在捕获足够多的数据包后，IV 哈希值可能被猜出，黑客可以轻松获取无线网络上使用的密码短语。\n\n## 创建随机盐、初始化向量和密码\n\
  \n在创建脚本时，您需要确保为盐、IV 字符串和密码使用复杂的随机值。这是为了防止字典攻击，其中个人可能会使用常见的密码和短语来猜测盐、IV 字符串和密码。创建盐和\
  \ IV 时，请确保它们各自至少为 10 个随机字符。还建议密码至少使用 30 个随机字符。\n\n在 PowerShell 中创建随机密码，您可以执行以下操作：\n\
  \n```\nFunction create-password {\n    # Declare password variable outside of loop.\n\
  \    $password = \"\"\n    # For numbers between 33 and 126\n    For ($a=33;$a -le\
  \ 126;$a++) {\n        # Add the Ascii text for the ascii number referenced.\n \
  \       $ascii += ,[char][byte]$a\n    }\n    # Generate a random character from\
  \ the $ascii character set.\n    # Repeat 30 times, or create 30 random characters.\n\
  \    1..30 | ForEach { $password += $ascii | get-random }\n    # Return the password\n\
  \    return $password\n}\n# Create four 30 character passwords\ncreate-password\n\
  create-password\ncreate-password\ncreate-password\n```\n\n此命令的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_58_0.png)\n\
  \n此函数将创建一个包含 30 个随机字符的字符串，用于随机密码创建。您首先通过声明 create-password 函数开始。然后通过将其设为 \"\" 来声明\
  \ $password 变量以在函数内使用。\n\n下一步是创建 For 命令以循环一组数字。这些数字代表可用于密码选择的 ASCII 字符编号。然后您通过编写\
  \ For ($a=33; $a -le 126;$a++) 来创建 For 命令。这意味着从数字 33 开始，将值增加一 ($a++)，并继续直到数字小于或等于\
  \ 126。然后您声明 $ascii 变量并使用 += 赋值运算符构造该变量。随着 For 循环进行迭代，它会向数组值添加一个字符。然后脚本利用 [char]\
  \ 或包含在 $a 中的 [byte] 数字的字符值。在此部分之后，$ascii 数组将包含字节值在 33 到 126 之间的所有 ASCII 字符的数组。\n\
  \n然后您继续进行随机字符生成。您声明 1..30 命令，这意味着对于 1 到 30 的数字，重复以下命令。您将其通过管道传递给 ForEach {，这将指定每个\
  \ 30 次迭代。然后您调用 $ascii 数组并将其通过管道传递给 | get-random cmdlet。get-random cmdlet 将随机选择 $ascii\
  \ 数组中的一个字符。然后使用赋值运算符 += 将该值连接到 $password 字符串中的现有值。经过 30 次迭代后，$password 变量中将有 30\
  \ 个随机值。最后，您使用 return $password 将此值返回给脚本。在声明函数后，您使用 create-password 四次调用该函数。这创建了四个随机密码以供使用。\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_59_0.png)\n\n> 要创建长度小于 30 个随机字符的字符串，您可以将\
  \ 1..30 修改为您想要的任何值。如果您想要 15 个随机字符的盐和初始化向量，则使用 1..15 即可。\n\n## 加密和解密字符串\n\n要开始使用\
  \ RijndaelManaged 加密，您需要在脚本中导入 .NET System.Security 程序集。与导入模块以提供额外的 cmdlet 类似，使用\
  \ .NET 程序集为 PowerShell 中通常无法访问的各种类提供了扩展。导入程序集不是持久的。这意味着您需要在 PowerShell 会话中使用它或每次运行脚本时都需要导入程序集。\n\
  \n要加载 .NET 程序集，您可以使用 Add-Type cmdlet，并使用 System.Security 参数作为 -AssemblyName 参数。由于该\
  \ cmdlet 实际上不会向屏幕输出任何内容，您可以在成功导入程序集后选择向屏幕打印信息。\n\n要导入带有显示信息的 System.Security 程序集，您可以执行以下操作：\n\
  \n```\nWrite-host \"Loading the .NET System.Security Assembly For Encryption\"\n\
  Add-Type -AssemblyName System.Security -ErrorAction SilentlyContinue -ErrorVariable\
  \ err\nif ($err) {\nWrite-host \"Error Importing the .NET System.Security Assembly.\"\
  \n    PAUSE\n    EXIT\n}\n```\n\n```\n# if err is not set, it was successful.\n\
  if (!$err) {\n    Write-host \"Successfully loaded the .NET System.Security Assembly\
  \ For Encryption\"\n}\n```\n\n此命令的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_60_0.png)\n\
  \n在此示例中，您成功导入 .NET System.Security 程序集以供 PowerShell 使用。您首先使用 Write-host 命令将 \"Loading\
  \ the .NET System.Security Assembly for Encryption\" 写入屏幕。然后您使用 Add-Type cmdlet，并使用\
  \ System.Security 参数作为 -AssemblyName 参数，使用 SilentlyContinue 参数作为 -ErrorAction 参数，以及使用\
  \ err 参数作为 -ErrorVariable 参数。然后您创建一个 if 语句来检查 $err 是否包含数据。如果包含，它将使用 Write-host cmdlet\
  \ 向屏幕打印 \"Error Importing the .NET System.Security Assembly.\"。它将暂停脚本以便读取错误。最后，它将退出脚本。如果\
  \ $err 为 $null，由 if (!$err) { 指定，它将使用 Write-host cmdlet 向屏幕打印 \"Successfully loaded\
  \ the .NET System.Security Assembly for Encryption\"。此时，脚本或 PowerShell 窗口已准备好使用\
  \ System.Security 程序集。\n\n![](img/a27a138d6586c10902d8e86ab3384834_60_1.png)\n\n\
  \n\n加载 System.Security 程序集后，您可以开始创建加密函数。RijndaelManaged 加密需要四步流程来加密字符串，该流程在前面的图表中表示。\n\
  \nRijndaelManaged 加密流程如下：\n\n- 1. 流程首先通过创建加密器开始。加密器由加密密钥（密码和盐）以及初始化向量派生而来。\n- 2.\
  \ 在定义加密器后，您需要使用 IO.MemoryStream 对象创建一个新的内存流。内存流用于在内存中存储值以供加密程序集使用。\n- 3. 内存流打开后，您定义一个\
  \ System.Security.Cryptography.CryptoStream 对象。CryptoStream 是使用内存流和加密器将未加密数据转换为加密数据的机制。为了利用\
  \ CryptoStream，您需要向 CryptoStream 写入数据。\n- 4. 最后一步是使用 IO.StreamWriter 对象将未加密值写入 CryptoStream。此转换的输出被放置到\
  \ MemoryStream 中。要访问加密值，您需要读取内存流中的数据。\n\n> 要了解有关 System.Security.Cryptography.RijndaelManaged\
  \ 类的更多信息，您可以查看以下 MSDN 文章：https://msdn.microsoft.com/en-us/library/system.security.cryptography.rijndaelmanaged(v=vs.110).aspx.\n\
  \n要创建使用 RijndaelManaged 加密来加密字符串的脚本，请执行以下操作：\n\n```\nAdd-Type -AssemblyName System.Security\n\
  function Encrypt-String { param($String, $Pass,\n$salt=\"CreateAUniqueSalt\", $init=\"\
  CreateAUniqueInit\")\ntry{\n    $r = new-Object System.Security.Cryptography.RijndaelManaged\n\
  \    $pass = [Text.Encoding]::UTF8.GetBytes($pass)\n    $salt = [Text.Encoding]::UTF8.GetBytes($salt)\n\
  \    $init = [Text.Encoding]::UTF8.GetBytes($init)\n$r.Key = (new-Object Security.Cryptography.PasswordDeriveBytes\
  \ $pass, $salt, \"SHA1\", 50000).GetBytes(32)\n$r.IV = (new-Object Security.Cryptography.SHA1Managed).ComputeHash($init)[0..15]\n\
  \n$c = $r.CreateEncryptor()\n$ms = new-Object IO.MemoryStream\n$cs = new-Object\
  \ Security.Cryptography.CryptoStream $ms,$c,\"Write\"\n$sw = new-Object IO.StreamWriter\
  \ $cs\n$sw.Write($String)\n$sw.Close()\n$cs.Close()\n$ms.Close()\n$r.Clear()\n[byte[]]$result\
  \ = $ms.ToArray()\n}\ncatch {\n    $err = \"Error Occurred Encrypting String: $_\"\
  \n}\nif($err) {\n    # Report Back Error\nreturn $err\n}\nelse {\nreturn [Convert]::ToBase64String($result)\n\
  }\n}\nEncrypt-String \"Encrypt This String\",\"A_Complex_Password_With_A_Lot_Of_Characters\"\
  \n```\n\n此脚本的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_63_0.png)\n\n此函数展示了如何利用\
  \ RijndaelManaged 加密算法加密字符串。您首先通过利用 Add-Type cmdlet 导入 System.Security 程序集开始，使用\
  \ -AssemblyName 参数并传入 System.Security 参数。然后您声明 Encrypt-String 函数。您包含一个参数块以接受并将值设置到函数中。第一个值是\
  \ $string，即未加密文本。第二个值是 $pass，用于加密密钥。第三个是预定义的 $salt 变量，设置为 \"CreateAUniqueSalt\"\
  。然后您定义 $init 变量，设置为 \"CreateAUniqueInit\"。\n\n在参数块之后，您声明 try { 以处理 .NET 程序集中的任何错误。第一步是使用\
  \ new-Object cmdlet 并传入 System.Security.Cryptography.RijndaelManaged 参数来声明加密类。您将此对象放置在\
  \ $r 变量中。\n\n然后您将 $pass、$salt 和 $init 值转换为 UTF8 字符编码标准，并将字符字节值存储在变量中。这是通过为 $pass\
  \ 变量指定 [Text.Encoding]::UTF8.GetBytes($pass)、为 $salt 变量指定 [Text.Encoding]::UTF8.GetBytes($salt)\
  \ 以及为 $init 变量指定 [Text.Encoding]::UTF8.GetBytes($init) 来完成的。\n\n在设置正确的字符编码后，您继续为\
  \ RijndaelManaged 加密算法创建加密密钥。这是通过将 RijndaelManaged $r.Key 属性设置为由 (new-Object Security.Cryptography.PasswordDeriveBytes\
  \ $pass, $salt, \"SHA1\", 50000).GetBytes(32) 创建的对象来完成的。此对象利用 Security.Cryptography.PasswordDeriveBytes\
  \ 类，并使用 $pass 变量、$salt 变量、\"SHA1\" 哈希名称以及迭代派生 50000 次来创建密钥。此类的每次迭代都会生成不同的密钥值，使猜测密钥变得更加复杂。然后您利用\
  \ .Get-Bytes(32) 方法返回密钥的 32 字节值。\n\n> RijndaelManaged 256 位加密是密钥中 32 字节的派生。32 字节乘以每字节\
  \ 8 位等于 256 位。\n\n要为算法创建初始化向量，您将 RijndaelManaged $r.IV 属性设置为由 (new-Object Security.Cryptography.SHA1Managed).ComputeHash($init)[0..15]\
  \ 创建的对象。代码的这一部分利用 Security.Cryptography.SHA1Managed 并基于 $init 值计算哈希。当您调用 [0..15]\
  \ 范围运算符时，它将获取哈希的前 16 个字节并将其放入 $r.IV 属性中。\n\n> RijndaelManaged 初始化向量的默认块大小为 128 位。16\
  \ 字节乘以每字节 8 位等于 128bits。\n\n在设置所需属性后，您现在准备开始加密数据。您首先利用具有已定义 $r.Key 和 $r.IV 属性的 $r\
  \ RijndaelManaged 对象开始。您使用 $r.CreateEncryptor() 方法生成加密器。\n\n生成加密器后，您需要创建一个内存流以在内存中进行加密。这是通过声明\
  \ new-Object cmdlet，设置为 IO.MemoryStream 类，并将内存流对象放置在 $ms 变量中来完成的。\n\n接下来，您创建 CryptoStream。CryptoStream\
  \ 用于将未加密数据转换为加密数据。您首先声明 new-Object cmdlet 并传入 Security.Cryptography.CryptoStream\
  \ 参数。您还定义 $ms 的内存流、$c 的加密器以及 \"Write\" 操作符，以告诉该类将未加密数据写入内存中的加密流。\n\n创建 CryptoStream\
  \ 后，您准备将未加密数据写入 CryptoStream。这是通过使用 IO.StreamWriter 类来完成的。您声明一个 new-Object cmdlet\
  \ 并传入 IO.StreamWriter 参数，并为写入定义 $cs 的 CryptoStream。\n\n最后，您取出存储在 $string 变量中的未加密字符串，并通过\
  \ $sw.Write($String) 将其传递给 StreamWriter $sw。加密值现在存储在内存流中。为了停止向 CryptoStream 和 MemoryStream\
  \ 写入数据，您使用 $sw.Close() 关闭 StreamWriter，使用 $cs.Close() 关闭 CryptoStream，并使用 $ms.Close()\
  \ 关闭内存流。出于安全目的，您还通过声明 $r.Clear() 清除加密器数据。\n\n加密过程完成后，您需要将内存流导出为字节数组。这是通过调用 $ms.ToArray()\
  \ 方法并将其设置为具有 [byte[]] 数据类型的 $result 变量来完成的。内容以字节数组形式存储在 $result 中。\n\n代码的这一部分是您声明\
  \ catch { 语句的地方。如果加密过程中出现任何错误，脚本将执行此部分。您使用 \"Error Occurred Encrypting String: $_\"\
  \ 参数声明 $err 变量。$_ 将是在 try {} 部分期间发生的管道错误。然后您创建一个 if 语句来确定 $err 变量中是否有数据。如果 $err\
  \ 中有数据，它将错误字符串返回给脚本。\n\n如果没有错误，脚本将进入脚本的 else { 部分。它将通过利用 [Convert]::ToBase64String($result)\
  \ 将 $result 字节数组转换为 Base64String。这将字节数组转换为字符串以供脚本使用。\n\n在定义加密函数后，您调用该函数以供使用。您首先通过调用\
  \ Encrypt-String 后跟 \"Encrypt This String\" 开始。您还将第二个参数声明为加密器的密码，即 \"A_Complex_Password_With_A_Lot_Of_Characters\"\
  。执行后，此示例接收到由函数生成的加密值 hK7GHaDD1FxknHu03TYAPxbfAAZeJ6KTSH1nSCPpJ7c=。您的结果将根据您为加密算法使用的盐、init\
  \ 和密码而有所不同。\n\n> 虽然此示例使用 $salt 为 \"CreateAUniqueSalt\"、$init 为 \"CreateAUniqueInit\"\
  \ 以及密码为 \"A_Complex_Password_With_A_Lot_Of_Characters\"，但强烈建议为自己的脚本更改这些值。这些值应使用在“创建随机盐、初始化向量和密码”部分中描述的随机生成的强值。未能使用强值以及未能将这些值保存在安全位置可能会损害您的加密数据。\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_65_0.png)\n\n\n\n## 解密字符串\n\n字符串的解密与您在加密字符串时执行的过程非常相似。与将数据写入内存流不同，该函数从内存流中读取数据。此外，与使用\
  \ .CreateEncryptor() 方法不同，解密过程利用 .CreateDecryptor() 方法。\n\n要创建使用 RijndaelManaged\
  \ 加密解密加密字符串的脚本，请执行以下操作：\n\n```powershell\nAdd-Type -AssemblyName System.Security\n\
  function Decrypt-String { param($Encrypted, $pass,\n$salt=\"CreateAUniqueSalt\"\
  , $init=\"CreateAUniqueInit\")\n\nif($Encrypted -is [string]){\n    $Encrypted =\
  \ [Convert]::FromBase64String($Encrypted)\n}\n\n$r = new-Object System.Security.Cryptography.RijndaelManaged\n\
  $pass = [System.Text.Encoding]::UTF8.GetBytes($pass)\n$salt = [System.Text.Encoding]::UTF8.GetBytes($salt)\n\
  $init = [System.Text.Encoding]::UTF8.GetBytes($init)\n\n$r.Key = (new-Object Security.Cryptography.PasswordDeriveBytes\
  \ $pass,\n$salt, \"SHA1\", 50000).GetBytes(32)\n$r.IV = (new-Object Security.Cryptography.SHA1Managed).\n\
  ComputeHash($init)[0..15]\n\n$d = $r.CreateDecryptor()\n$ms = new-Object IO.MemoryStream\
  \ @(, $Encrypted)\n$cs = new-Object Security.Cryptography.CryptoStream $ms,$d,\"\
  Read\"\n$sr = new-Object IO.StreamReader $cs\n\ntry {\n    $result = $sr.ReadToEnd()\n\
  \    $sr.Close()\n    $cs.Close()\n    $ms.Close()\n    $r.Clear()\nReturn $result\n\
  }\nCatch {\n    Write-host \"Error Occurred Decrypting String: Wrong String Used\
  \ In Script.\"\n}\n}\nDecrypt-String \"hK7GHaDD1FxknHu03TYAPxbFAAZeJ6KTSH1nSCPpJ7c=\"\
  \ \"A_Complex_Password_With_A_Lot_Of_Characters\".\n```\n\n此脚本的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_67_0.png)\n\
  \n此函数演示了如何利用 RijndaelManaged 加密算法解密字符串。您首先通过利用 Add-Type cmdlet 导入 System.Security\
  \ 程序集，使用 -AssemblyName 参数并指定 System.Security 参数。然后您声明 Decrypt-String 函数。您包含一个参数块以接受并为函数设置值。第一个值是\
  \ $Encrypted，即加密文本。第二个值是 $pass，用于加密密钥。第三个是预定义的 $salt 变量，设置为 \"CreateAUniqueSalt\"\
  。然后您定义 $init 变量，其设置为 \"CreateAUniqueInit\"。\n\n在参数块之后，您通过使用 if ($Encrypted -is [string])\
  \ { 检查加密值是否格式化为字符串。如果此条件评估为 True，您将使用 [Convert]::FromBase64String($Encrypted) 将字符串转换为字节，并将编码值放入\
  \ $Encrypted 变量中。接下来，您使用 new-Object cmdlet 并传入 System.Security.Cryptography.RijndaelManaged\
  \ 参数来声明解密类。您将此对象放入 $r 变量中。\n\n然后您将 $pass、$salt 和 $init 值转换为 UTF8 字符编码标准，并将字符字节值存储在变量中。这是通过为\
  \ $pass 变量指定 [System.Text.Encoding]::UTF8.GetBytes($pass)、为 $salt 变量指定 [System.Text.Encoding]::UTF8.GetBytes($salt)，以及为\
  \ $init 变量指定 [System.Text.Encoding]::UTF8.GetBytes($init) 来完成的。\n\n在设置正确的字符编码后，您继续为\
  \ RijndaelManaged 加密算法创建加密密钥。这是通过将 RijndaelManaged $r.Key 属性设置为由 (new-Object Security.Cryptography.PasswordDeriveBytes\
  \ $pass, $salt, \"SHA1\", 50000).GetBytes(32) 创建的对象来完成的。此对象利用 Security.Cryptography.PasswordDeriveBytes\
  \ 类，并使用 $pass 变量、$salt 变量、\"SHA1\" 哈希名称以及迭代派生 50000 次来创建密钥。此类的每次迭代都会生成不同的密钥值，使密钥更难以猜测。然后您利用\
  \ .get-bytes(32) 方法返回密钥的 32 字节值。\n\n为了为算法创建初始化向量，您将 RijndaelManaged $r.IV 属性设置为由\
  \ (new-Object Security.Cryptography.SHA1Managed).ComputeHash($init)[0..15] 创建的对象。代码的这一部分利用\
  \ Security.Cryptography.SHA1Managed 类并基于 $init 值计算哈希。当您调用 [0..15] 范围运算符时，哈希的前 16\
  \ 个字节将被获取并放入 $r.IV 属性中。\n\n在设置所需属性后，您现在准备开始解密数据。您首先利用具有已定义 $r.key 和 $r.IV 属性的 $r\
  \ RijndaelManaged 对象。您使用 $r.CreateDecryptor() 方法生成解密器。\n\n生成解密器后，您必须创建一个内存流以在内存中进行解密。这是通过声明\
  \ new-Object cmdlet 并传入 IO.MemoryStream 类参数来完成的。然后您使用 @(, $Encrypted) 将 $encrypted\
  \ 值引用到内存流对象中，并将填充的内存流存储在 $ms 变量中。\n\n接下来，您创建 CryptoStream，用于将加密数据转换为解密数据。您首先声明 new-Object\
  \ cmdlet 并传入 Security.Cryptography.CryptoStream 类参数。您还定义 $ms 的内存流、$d 的解密器以及 \"Read\"\
  \ 操作符，以告诉该类从内存中的加密流读取加密数据。\n\n创建 CryptoStream 后，您准备好从 CryptoStream 读取解密数据。这是通过使用\
  \ IO.StreamReader 类来完成的。您使用 IO.StreamReader 类参数声明 new-Object，并定义要读取的 $cs CryptoStream。\n\
  \n此时，您使用 try { 来捕获从 StreamReader 读取数据时生成的任何错误消息。您调用 $sr.ReadToEnd()，它调用 StreamReader，读取完整的解密值，并将数据放入\
  \ $result 变量中。为了停止向 CryptoStream 和 MemoryStream 读取数据，您使用 $sw.Close() 关闭 StreamWriter，使用\
  \ $cs.Close() 关闭 CryptoStream，并使用 $ms.Close() 关闭内存流。出于安全目的，您还通过声明 $r.Clear() 清除解密器数据。如果解密成功，您将\
  \ $result 的值返回给脚本。\n\n在定义解密函数后，您调用该函数以供使用。您首先通过调用 Decrypt-String 后跟 \"hK7GHaDD1FxknHu03TYAPxbFAAZeJ6KTSH1nSCPpJ7c=\"\
  \ 来开始。您还将第二个参数声明为解密器的密码，即 \"A_Complex_Password_With_A_Lot_Of_Characters\"。执行后，您将收到由该函数生成的解密值\
  \ \"Encrypt This String\"。\n\n## 保护密码\n\n| 脚本侧解密器 SSD | 答案文件解密器 AFD | 运行时解密器 RTD\
  \ |\n|---|---|---|\n| A_Complex_Pass + | word_With_A_Lot + | _Of_Characters |\n\n\
  您加密方法中最重要的部分之一是保护用于加密的密码。一种推荐的保护密码的方法是将密码拆分为三个或更多位置。前面的图表将密码 A_Complex_Password_With_A_Lot_Of_Characters\
  \ 拆分为三个独立的段。目的是使密码数据部分位于脚本本身中，部分位于答案文件中，其余部分在运行时作为参数馈送到脚本中。如果三个密码段中的任何一个未提供，加密过程将因密码不正确而失败。\n\
  \n这种方法的目的是为密码提供多个数据点。运行时解密器需要用户干预，答案文件解密器需要在执行时存在答案文件，而脚本侧解密器确保密码不能仅从答案文件中确定。\n\n\
  ![](img/a27a138d6586c10902d8e86ab3384834_70_0.png)\n\n对此方法的一项额外安全层是利用密码输入的编码。虽然编码可能不适合加密脚本中的实际密码，但它为在多个位置存储密码提供了非常有价值的混淆。当您为密码生成编码值时，它会增加字符数量并极大地阻碍对加密过程中使用的编码和密码的暴力破解。\n\
  \n要编码密码，请执行以下操作：\n\n```\n$pass = \"A_Complex_Password_With_A_Lot_Of_Characters\"\
  \n$encodedpass = [System.Text.Encoding]::Unicode.GetBytes($pass)\n$encodedvalue\
  \ = [Convert]::ToBase64String($encodedpass)\n$encodedvalue\n```\n\n此命令的输出如下所示：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_70_1.png)\n\n此示例演示了如何编码拆分为多个数据点的密码。您首先通过将值\
  \ \"A_Complex_Password_With_A_Lot_Of_Characters\" 定义为 $pass 变量来开始。然后您利用 [System.Text.Encoding]::Unicode.GetBytes($pass)\
  \ 方法对密码进行编码，并将值存储在 $encodedpass 变量中。然后您通过利用 [Convert]::ToBase64String($encodedpass)\
  \ 将编码值转换为字符串，并将值存储在 $encodedvalue 变量中。在此示例的末尾，您调用 $encodedvalue 变量以显示编码字符串。\n\n\n\
  \n要解码一个字符串，您可以执行以下操作：\n\n```\n$encvalue = \"QQBfAEMAbwBtAHAAbAB1AHgAXwBQAGEAcwBzAHcAbwByAGQAXwBXAGkAdABoAF8AQQBfAEwAbwB0AF8ATwBmAF8AQwBoAGEAcgBhAGMADAB1AHIAcwA=\"\
  \n$encbytes = [System.Convert]::FromBase64String($encvalue)\n$decodedvalue = [System.Text.Encoding]::Unicode.GetString($encbytes)\n\
  $decodedvalue\n```\n\n解码字符串的输出将如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_71_0.png)\n\
  \n本示例演示如何解码密码以在脚本中使用。您首先通过定义 $encvalue 变量并赋值为 \"QQBfAEMAbwBtAHAAbAB1AHgAXwBQAGEAcwBzAHcAbwByAGQAXwBXAGkAdABoAF8AQQBfAEwAbwB0AF8ATwBmAF8AQwBoAGEAcgBhAGMADAB1AHIAcwA=\"\
  \ 开始。然后您通过执行 [System.Convert]::FromBase64String($encvalue) 将字符串转换为字节，并将输出存储在 $encbytes\
  \ 中。然后您通过调用 [System.Text.Encoding]::Unicode.GetString($encbytes) 解码字节，并将输出存储在 $decodedvalue\
  \ 中。在此示例的末尾，您调用 $decodedvalue 变量以显示解码后的密码 \"A_Complex_Password_With_A_Lot_Of_Characters\"\
  。\n\n## 使用编码密码进行解密\n\n本章的最终脚本将您在前两章中学到的多个组件联系在一起。您将学习如何结合 Answer File Decryptor、Script\
  \ Side Decryptor 和 Runtime Decryptor 来解密加密字符串。要遵循此示例，您需要在系统的 c:\\temp\\ 目录中创建 Example.xml\
  \ 文件和 Example.ps1 文件。\n\n> 参阅本章的代码文件有助于快速创建接下来描述的内容。\n\n在 c:\\temp\\ 目录中创建 Example.xml\
  \ 文件，并将解密器值设置为 wBzAHcAbwByAGQAXwBXAGkAdABoAF8AQQBfAEwAbwB0AF8ATwB：\n\n![](img/a27a138d6586c10902d8e86ab3384834_72_0.png)\n\
  \n您需要在系统的 c:\\temp\\ 中创建 Example.ps1 脚本。该脚本的内容应如下所示：\n\n```\n# The script is invoked\
  \ with the command line of:\n# powershell.exe -file \"c:\\temp\\Example.ps1\"\"\
  c:\\temp\\Example.xml\"\"mAF8AQwBoAGEAcgBhAGMADAbIAHIAcwA=\"\nparam($xmlfile, $RTD)\n\
  ########################################################################################\n\
  # Example On How To Decrypt a String\n########################################################################################\n\
  Add-Type -AssemblyName System.Security\nfunction Decrypt-String { param($Encrypted,\
  \ $pass,\n$salt=\"CreateAUniqueSalt\", $init=\"CreateAUniqueInit\")\nif($Encrypted\
  \ -is [string]){\n    $Encrypted = [Convert]::FromBase64String($Encrypted)\n}\n\
  $r = new-Object System.Security.Cryptography.RijndaelManaged\n$pass = [System.Text.Encoding]::UTF8.GetBytes($pass)\n\
  $salt = [System.Text.Encoding]::UTF8.GetBytes($salt)\n$init = [System.Text.Encoding]::UTF8.GetBytes($init)\n\
  $r.Key = (new-Object Security.Cryptography.PasswordDeriveBytes $pass,\n$salt, \"\
  SHA1\", 50000).GetBytes(32)\n$r.IV = (new-Object Security.Cryptography.SHA1Managed).\n\
  ComputeHash($init)[0..15]\n$d = $r.CreateDecryptor()\n$ms = new-Object IO.MemoryStream@(,\
  \ $Encrypted)\n$cs = new-Object Security.Cryptography.CryptoStream $ms,$d,\"Read\"\
  \n$sr = new-Object IO.StreamReader $cs\ntry {\n    $result = $sr.ReadToEnd()\n \
  \   $sr.Close()\n    $cs.Close()\n    $ms.Close()\n    $r.Clear()\n    Return $result\n\
  }\nCatch {\n    Write-host \"Error Occurred Decrypting String: Wrong String Used\
  \ In Script.\"\n}\n}\n# Read the XML file for the Answer File Decryptor\n[xml] $xml\
  \ = (get-content $xmlfile)\n$AFD = $xml.GetElementsByTagName(\"AFD\").Name\n# Define\
  \ the Script Side Decryptor\n$SSD = \"QQBfAEMAbwBtAHAAbABlAHgAXwBQAGEAc\"\n# Combine\
  \ the Decryptors\n$encvalue = $SSD + $AFD + $RTD\n# Decode the values\n$encbytes\
  \ = [System.Convert]::FromBase64String($encvalue)\n$decrypt = [System.Text.Encoding]::Unicode.GetString($encbytes)\n\
  # Decrypt the string.\nDecrypt-String \"hK7GHaDD1FxknHu03TYAPxbFAAZeJ6KTSH1nSCPpJ7c=\"\
  \ $decrypt\nPAUSE\n```\n\n要执行此脚本，您需要在 PowerShell 中执行以下命令：\n\n```\npowershell.exe\
  \ -file \"c:\\temp\\Example.ps1\"\"c:\\temp\\Example.xml\"\"mAF8AQwBoAGEAcgBhAGMAbAB1AHIAcwA=\"\
  \n```\n\n此脚本的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_73_0.png)\n\n本示例演示如何结合\
  \ Answer File Decryptor、Script Side Decryptor 和 Runtime Decryptor 来解密加密字符串。在本章开始时，您加密了字符串\
  \ \"Encrypt This String\"。这生成了加密值 hK7GHaDD1FxnHu03TYAPxbFAAZeJ6KTSH1nSCPpJ7c=。本章后面我们学习了如何利用密码\
  \ \"A_Complex_Password_With_A_Lot_Of_Characters\" 解密加密值。然后您了解到应将密码进行编码并将值分离到三个位置。此脚本涵盖了解密字符串并利用来自三个数据源的编码密码。\n\
  \n您首先通过 param ($xmlfile,$RTD) 定义参数块。当您执行脚本时，您输入了 xml 文件位置 c:\\temp\\example.xml，其存储在\
  \ $xmlfile 中，以及运行时解密器 \"mAF8AQwBoAGEAcgBhAGMAdABlAHIAcwA=\"，其存储在 $RTD 中。在参数块填充后，您使用\
  \ Add-Type cmdlet 并将 -AssemblyName 参数设置为 System.Security 参数来添加 System.Security 程序集。然后您定义\
  \ Decrypt-String 函数，该函数在本章前面已详细解释。\n\n下一步是检索 XML 文件内容。您使用 get-content cmdlet 并使用\
  \ $xmlfile 路径执行此操作，并将值存储在具有 [xml] 数据类型的 $xml 变量中。然后您调用设置为 AFD 的 $xml.GetElementsByTagName()\
  \ 方法。您使用点表示法检索具有 Name 属性值的答案文件解密器，并将其存储在 $AFD 变量中。\n\n检索 Answer File Decryptor 后，您指定\
  \ Script Side Decryptor，将 $SSD 变量设置为 \"QQBfAEMAbwBtAHAAbABlAHgAXwBQAGEAc\"。然后您将\
  \ Script Side Decryptor（即 $SSD）后面的字符串与 Answer File Decryptor（即 $AFD）以及最终的 Runtime\
  \ Decryptor（即 $RTD）组合起来。您继续通过将它们转换为字节来解码组合值，并将值存储在 $encbytes 变量中。然后您解码 $encbytes\
  \ 变量以显示存储在 $decrypt 中的脚本密码。\n\n一旦获得加密密码，您就会执行来自前一个示例的 Decrypt-String \"hK7GHaDD1FxnHu03TYAPxbFAAZeJ6KTSH1nSCPpJ7c=\"\
  \ $decrypt 命令，以返回结果 \"Encrypt This String\"。您还发出 pause 命令以阻止脚本关闭。执行后，您已成功解码密码并解密字符串。\n\
  \n## 摘要\n\n在本章中，我们学习了 RijndaelManaged 256 位加密。我们首先从加密过程的基础开始。然后，我们继续学习如何在脚本中创建随机\
  \ salt、init 和密码。然后我们学习了如何加密和解密字符串。我们以学习如何编码密码并利用多个来源派生编码密码结束本章。\n\n在下一章中，我们将学习如何与服务、进程、配置文件和已登录用户交互。\n"
- "# 5 与服务、进程、配置文件和已登录用户交互\n\n## 与服务、进程、配置文件和已登录用户交互\n\nWindows 服务器扫描脚本为企业提供了对正在扫描的系统的整体功能的可见性。虽然您可以评估已安装的\
  \ Windows 功能和角色，但这样做通常无法提供足够的信息来确定服务器的完整功能。此外，如果没有更深入的检查，您将无法确定系统上是否正在运行业务关键服务和进程。\n\
  \n然而，当您评估系统上的身份时，您可以获得有关系统功能非常有价值的信息。通常，在企业环境中，服务帐户用于在系统上运行不同的服务和进程。这些服务帐户与普通用户类似；然而，它们具有受限的权限。当您识别出未作为默认内置用户运行的服务或进程时，系统很可能出于某种原因而这样配置。这将揭示系统的非标准配置，这些配置是使用\
  \ Windows 服务器扫描脚本进行审查的绝佳提示。\n\n除了确定服务帐户使用情况外，扫描进程还会显示登录到特定系统的用户。由于登录到系统的每个用户帐户都有自己的进程分配给其会话，因此您可以快速分析用户登录的原因。此外，还有一些已知的遗留软件解决方案需要交互式登录才能正确运行服务、shell\
  \ 和程序。评估已登录用户将使您更好地了解用户帐户如何与系统交互。\n\n\n\n\n最后，您需要评估用户配置文件。在大型企业环境中，可能几乎没有关于哪个用户或部门拥有特定系统的痕迹。由于用户配置文件包含登录系统的个人的用户名，扫描这些配置文件将为系统所有权提供指导。\n\
  \n在本章中，您将：\n\n- 了解如何获取、停止、启动和设置 Windows 服务\n- 利用不同的 cmdlet 与 Windows 进程交互\n- 识别系统上的已登录用户\n\
  - 收集系统上用户配置文件的数据\n\n> 本章中的示例相互构建。您需要按顺序执行脚本，才能使本章中的最终脚本正常工作。\n> 建议您在安装了 PowerShell\
  \ 的 Windows Server 2012 R2 或更高版本服务器上执行这些示例。该服务器必须加入 Windows 域。\n\n## Windows services\n\
  \n当您使用基于 Microsoft 的系统时，可能需要与 Windows 服务交互。PowerShell 提供了多种 cmdlet，可让您处理这些服务。首先，您可以通过利用\
  \ Get-service cmdlet 来查看系统上的服务。通过调用 Get-service cmdlet，您可以检索系统上 Windows 服务的完整列表。如果您想获得特定服务的筛选视图，可以利用引用服务特定名称的\
  \ -name 参数。执行此命令后，您将看到服务的 Status、Name 和 DisplayName。您还可以使用 -RequiredServices 参数来显示使该特定服务正常运行所需的服务。您可以通过执行\
  \ -DependentServices 参数来查询依赖的 Windows 服务。\n\n要使用 Get-service cmdlet 查询 Windows Audio\
  \ 服务，您可以执行以下操作：\n\n```powershell\nGet-service -DisplayName \"Windows Audio\"\nGet-service\
  \ -DisplayName \"Windows Audio\" -RequiredServices\n(Get-service -DisplayName \"\
  Windows Audio\").Status\n```\n\n以下屏幕截图显示了此输出：\n\n![](img/a27a138d6586c10902d8e86ab3384834_78_0.png)\n\
  \n此示例演示如何获取有关 Windows Audio 服务的信息。您首先通过调用 Get-service cmdlet，利用 -DisplayName 参数并引用\
  \ Windows Audio Windows 服务。执行后，您将在 PowerShell 窗口中看到 Status、Name 和 DisplayName 字段。然后使用\
  \ Get-service cmdlet，-DisplayName 参数引用 Windows Audio，并使用 -RequiredServices 参数。执行\
  \ Get-service 命令后，您将看到使 Windows Audio Windows 服务正常运行所需的所有服务的 Status、Name 和 DisplayName。您最后一次调用利用\
  \ Get-service cmdlet，-DisplayName 参数引用 Windows Audio。此整个语句用括号括起来，然后是 .Status 的点表示法。这将返回\
  \ Windows Audio Windows 服务的当前状态，即 Running。\n\n在您想要启动、重新启动和停止服务的情况下，您也可以利用 start-service、restart-service\
  \ 和 stop-service cmdlet。要启动服务，您可以调用 start-service cmdlet，后跟 -name 或 -DisplayName\
  \ 参数以及相应的服务名称。执行后，服务状态将从 Stopped 更改为 StartPending；成功启动后，状态将更改为 Running。\n\n要停止服务，您可以调用\
  \ stop-service cmdlet，后跟 -name 或 -DisplayName 参数以及相应的服务名称。执行后，服务状态将从 Running 更改为\
  \ StopPending，成功停止后，状态将更改为 Stopped。\n\n要重新启动服务，您可以调用 restart-service cmdlet，后跟 -Name\
  \ 或 -DisplayName 参数以及相应的服务名称。执行后，服务状态将从 Running 更改为 StopPending，StopPending 更改为\
  \ Stopped，Stopped 更改为 StartPending；成功启动后，状态将更改为 Running。\n\n> 启动和停止 Windows 服务需要以提升权限运行的\
  \ PowerShell 窗口。您需要使用“以管理员身份运行”参数打开 PowerShell。\n\n要停止和启动 Windows Audio 服务，您可以执行以下操作：\n\
  \n```\nstop-service -DisplayName \"Windows Audio\"\n(Get-service -DisplayName \"\
  Windows Audio\").Status\nstart-service -DisplayName \"Windows Audio\"\n(Get-service\
  \ -DisplayName \"Windows Audio\").Status\n```\n\n以下屏幕截图显示了此输出：\n\n![](img/a27a138d6586c10902d8e86ab3384834_79_0.png)\n\
  \n此示例演示如何启动和停止 Windows 服务。您首先通过利用 stop-service cmdlet 和 -DisplayName 参数引用 Windows\
  \ Audio 显示名称来停止 Windows Audio 服务。然后通过执行 Get-service 并使用 -DisplayName 参数引用 Windows\
  \ Audio 显示名称来获取服务的当前状态。将其括在括号中并利用 .Status 的点表示法将当前状态打印到屏幕上。控制台将返回 Stopped 状态。\n\n\
  然后通过利用 start-service cmdlet 和 -DisplayName 参数引用 Windows Audio 显示名称来启动 Windows Audio\
  \ 服务。然后通过执行 Get-service 并使用 -DisplayName 参数引用 Windows Audio 显示名称来获取服务的当前状态。将其括在括号中并利用\
  \ .Status 的点表示法将当前状态打印到屏幕上。控制台将返回 Running 状态。\n\n您还可以使用 set-service cmdlet 修改 Windows\
  \ 服务的不同方面。set-service cmdlet 可以修改服务描述、启动类型，甚至服务的显示名称。由于 Windows 不允许您修改正在运行的服务，因此您首先需要利用\
  \ stop-service cmdlet 停止服务以进行编辑。\n\n如果您想修改服务的启动类型，可以利用 set-service cmdlet 并使用 -Name\
  \ 参数以及相应的服务名称。然后使用 -startup type 参数包含 Automatic 表示自动启动、Manual 表示手动启动，或 Disabled\
  \ 表示禁用服务启动。要查看服务启动类型的更改，您需要利用 get-wmiobject cmdlet 引用 win32_service 类，并使用 -filter\
  \ 参数引用 DisplayName='Display Name'。\n\n![](img/a27a138d6586c10902d8e86ab3384834_80_0.png)\n\
  \n> 在大多数情况下，您可以利用 Get-service cmdlet 显示服务属性，但某些属性对 cmdlet 不可用。因此，您可能需要直接使用 get-wmiobject\
  \ 查询 WMI 以查看该服务的所有属性。要查看 Get-service 或 WMI 可用的所有属性，可以将结果通过管道 | 传递给 get-member，它将显示您可以查看的所有可用属性。\n\
  \n要更改 Windows Audio -startup type 参数，您可以执行以下操作：\n\n```\n(get-wmiobject win32_service\
  \ -filter \"DisplayName='Windows Audio'\").StartMode\nstop-service -name \"Audiosrv\"\
  \nset-service -name \"Audiosrv\" -startup \"Manual\"\n(get-wmiobject win32_service\
  \ -filter \"DisplayName='Windows Audio'\").StartMode\nset-service -name \"Audiosrv\"\
  \ -startup \"Automatic\"\n(get-wmiobject win32_service -filter \"DisplayName='Windows\
  \ Audio'\").StartMode\nStart-service -name \"Audiosrv\"\n```\n\n以下屏幕截图显示了此输出：\n\n\
  ![](img/a27a138d6586c10902d8e86ab3384834_81_0.png)\n\n此示例演示如何在系统上更改 Windows 服务的启动方式。您首先通过查询系统来查看现有的\
  \ StartMode。为此，您需要利用 get-wmiobject cmdlet 引用 win32_service 类。您利用 -filter 参数，过滤选项为\
  \ DisplayName='Windows Audio'。然后将该语句括在括号中并利用 .StartMode 的点表示法将系统的启动模式打印到屏幕上。命令将打印\
  \ Auto 到屏幕，表示服务启动类型设置为 Automatic。然后通过调用 stop-service cmdlet 并使用 -name 参数引用 Audiosrv\
  \ 服务名称来停止服务。然后通过调用 set-service cmdlet 并使用 -name 参数引用 AudioSrv 以及 -startup 参数引用 Manual\
  \ 来将服务启动类型配置为 Manual。运行此命令后，您使用 get-wmiobject cmdlet 引用 win32_service 类来验证启动更改。您利用\
  \ -filter 参数，过滤选项为 DisplayName='Windows Audio'。然后将该语句括在括号中并利用 .StartMode 的点表示法将系统的启动模式打印到屏幕上。命令将打印\
  \ Manual 到屏幕，表示服务启动类型设置为 Manual。\n\n然后通过调用 set-service cmdlet 并使用 -name 参数引用 AudioSrv\
  \ 以及 -startup 参数引用 Automatic 将服务设置回 Automatic。设置此命令后，您使用 get-wmiobject cmdlet 引用\
  \ win32_service 类来验证启动更改。您利用 -filter 参数，过滤选项为 Displayname='Windows Audio'。然后将该语句括在括号中并利用\
  \ .StartMode 的点表示法将系统的启动模式打印到屏幕上。命令将打印 Auto 到屏幕，表示服务启动类型设置为 Automatic。完成最终配置后，您通过调用\
  \ start-service cmdlet 并使用 -name 参数引用 Audiosrv 服务名称来启动服务。\n\n\n\n在您想要修改服务的描述时，首先需要通过使用\
  \ stop-service cmdlet 来停止该服务。然后调用 set-service cmdlet，并使用 -name 指定服务名称，以及 -Description\
  \ 参数指定要为特定服务设置的描述。description 属性是唯一的，因为它不会在 get-service cmdlet 中提供。为了解决这个问题，您需要使用\
  \ get-wmiobject cmdlet。要查看描述，您可以使用引用 win32_service 类的 get-wmiobject cmdlet，并使用 -filter\
  \ 参数引用 DisplayName='Display Name'。执行此脚本后，描述将打印到屏幕上。设置描述后，您可以使用 start-service cmdlet\
  \ 启动服务。\n\n要为 Windows Audio 服务设置描述，您可以执行以下操作：\n\n```powershell\n$olddesc = (get-wmiobject\
  \ win32_service -filter \"DisplayName='Windows Audio'\").description\n$olddesc\n\
  stop-service -DisplayName \"Windows Audio\"\nSet-service -name \"Audiosrv\" -Description\
  \ \"My New Windows Audio Description.\"\n(get-wmiobject win32_service -filter \"\
  DisplayName='Windows Audio'\").description\nSet-service -name \"Audiosrv\" -Description\
  \ $olddesc\n(get-wmiobject win32_service -filter \"DisplayName='Windows Audio'\"\
  ).description\nstart-service -DisplayName \"Windows Audio\"\n```\n\n此操作的输出显示在以下屏幕截图中：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_82_0.png)\n\n此示例演示如何更改 Windows 服务的描述并将其恢复为原始描述。您首先通过查询系统来查看现有描述是什么。为此，您需要使用引用\
  \ win32_service 类的 get-wmiobject cmdlet。您使用 -filter 参数并使用 DisplayName='Windows Audio'\
  \ 的筛选选项。然后将该语句用括号括起来并使用 .description 的点表示法。输出即 Windows 服务描述，然后被设置为变量 $olddesc。要查看旧描述，您调用\
  \ $olddesc 变量，其显示内容为：管理基于 Windows 的程序的音频。如果停止此服务，音频设备和效果将无法正常工作。如果禁用此服务，任何显式依赖它的服务都将无法启动。您然后使用\
  \ stop-service cmdlet 和引用 Windows Audio 的 -DisplayName 参数停止服务。要设置描述，您使用 set-service\
  \ cmdlet，将 -name 参数设置为 Audiosrv，并将 -Description 参数设置为 My New Windows Audio Description。\n\
  \n设置描述后，您使用引用 win32_service 类的 get-wmiobject cmdlet 查询系统，并使用 DisplayName='Windows\
  \ Audio' 的筛选选项的 -filter 参数。然后将该语句用括号括起来并使用 .description 的点表示法。此操作的输出将是当前描述，即 My\
  \ New Windows Audio Description。要将描述恢复为原始值，您使用 set-service cmdlet，将 -name 参数设置为\
  \ Audiosrv，并将 -description 参数引用 $olddesc 变量。将描述恢复为原始描述后，您使用引用 win32_service 类的 get-wmiobject\
  \ cmdlet 查询系统，并使用 DisplayName='Windows Audio' 的筛选选项的 -filter 参数。然后将该语句用括号括起来并使用\
  \ .description 的点表示法。此操作的输出将是当前描述，即管理基于 Windows 的程序的音频。如果停止此服务，音频设备和效果将无法正常工作。如果禁用此服务，任何显式依赖它的服务都将无法启动。您然后通过启动\
  \ Windows Audio 服务完成此过程。您使用引用 Windows Audio 的 -DisplayName 参数的 start-service cmdlet。\n\
  \n可能存在您想要确定哪个用户或服务帐户正在运行 Windows 服务的情况。为此，您可以使用 -class 参数和 win32_service 参数使用 get-wmiobject\
  \ cmdlet。WMI 服务对象具有多个属性，可让您查看系统上运行的服务的扩展信息。.DisplayName 属性显示 Windows 服务显示名称，而 .StartName\
  \ 属性显示被委派启动 Windows 服务的用户。\n\n> 查询 Windows 服务需要以提升权限运行的 PowerShell 窗口。您需要使用“以管理员身份运行”参数打开\
  \ PowerShell。\n\n要查询 Windows Audio 服务以获取被委派启动该服务用户，您可以执行以下操作：\n\n```\n$service =\
  \ get-wmiobject win32_service | where {$_.DisplayName -like \"Windows Audio\"}\n\
  $servicedisplay = $service.DisplayName\n$serviceAuthUser = $service.StartName\n\
  write-host \"Service with $servicedisplay name is running with $serviceAuthUser\
  \ account.\"\n```\n\n此操作的输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_84_0.png)\n\
  \n此示例演示如何确定系统上服务的拥有者。您首先调用 get-wmiobject cmdlet，将 -class 参数设置为 win32_service。此命令通过管道传递到\
  \ where {$_.DisplayName -like \"Windows Audio\"}。Windows Audio 对象然后被放入 $service\
  \ 变量中。您通过调用 $service.DisplayName 属性来收集 Windows 服务显示名称，并将该属性放入 $servicedisplay 变量中。您通过调用\
  \ $service.StartName 属性来检索 Windows 服务启动用户，并将该属性放入 $serviceAuthUser 变量中。要显示收集的数据，您使用\
  \ write-host cmdlet，并使用 Service with $servicedisplay name is running with $serviceAuthUser\
  \ account.。在此特定系统上，返回 Service with Windows Audio name is running NT Authority\\\
  LocalService account.。\n\n## 管理 Windows 进程\n\n在脚本编写中，可能需要检查系统上是否有正在运行的进程。PowerShell\
  \ 提供 get-process cmdlet 来搜索系统上可用的进程。单独运行 get-process cmdlet 时，您将获得系统上所有正在运行服务的报告。关于正在运行服务的默认记录集包括：\n\
  \n- Handles：某个进程正在使用的线程句柄数\n- NPM (K)：非分页内存是完全位于物理内存中且未分配到页面文件中的内存，该内存正被进程使用\n-\
  \ PM (K)：可分页内存是被分配到页面文件中的内存，该内存正被进程使用\n- WS (K)：工作集是进程最近引用的内存\n- VM (M)：虚拟内存是进程正在使用的虚拟内存量\n\
  - CPU (s)：这是处理器时间，即 CPU 利用该进程所花费的时间\n- ID：这是分配给进程的唯一 ID\n- ProcessName：这是内存中的进程名称\n\
  \n通常，当您查询系统上活动的正在运行进程时，您会查找特定进程。为此，您可以使用 -name 参数引用进程名称来使用 get-process cmdlet 查看有关该特定进程的信息。您还可以使用星号\
  \ (*) 作为通配符来查询与您指定的部分词相似的进程。您也可以直接引用进程的进程 ID，如果您使用进程的 ID 调用 -id 参数。 如果您想要有关正在运行进程的更多信息，您还可以使用\
  \ -FileVersionInfo 参数从进程中提取 ProductVersion、FileVersion 和 FileName 信息。在需要查找进程加载的所有模块或\
  \ DLL 引用的情况下，您也可以使用 -module 参数。\n\n要使用通配符搜索进程并通过进程 ID 获取进程，您可以执行以下操作：\n\n```\n$process\
  \ = get-process powersh*\n$process\nget-process -id $process.id\n```\n\n本输出显示在以下屏幕截图中：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_86_0.png)\n\n本脚本演示如何通过通配符搜索进程并获取进程 ID。你也可以通过调用该服务的进程\
  \ ID 来查看同一服务。首先使用 get-process cmdlet 并使用 powersh* 搜索通配符开始。系统将 PowerShell 进程对象返回到\
  \ $process 变量中。然后你调用 $process 变量以查看有关 PowerShell 进程的信息。然后你使用指向 $process 变量的 -id\
  \ 参数利用 get-process cmdlet，引用 .id 的点表示法。这会返回相同的 PowerShell 进程信息，即在第一次搜索结果的进程 ID 中引用的\
  \ $process.id。执行此脚本后，你将看到 PowerShell 进程的 Handles、NPM(K)、PM(K)、WS(K)、VM、CPU(s)、Id\
  \ 和 ProcessName 信息。\n\n要使用通配符获取进程并获取其 FileVersionInfo 信息，可以执行以下操作：\n\n```\n$process\
  \ = get-process powersh*\nget-process -id $process.id -FileVersionInfo | format-table\
  \ -AutoSize\n```\n\n本输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_86_1.png)\n\
  \n本脚本演示如何通过通配符搜索进程，然后使用该信息查看文件版本信息。你首先使用 get-process cmdlet 并使用 powersh* 搜索通配符开始。系统将\
  \ PowerShell 进程返回到 $process 变量中。然后你调用 get-process cmdlet 并利用指向 $process 变量的 -id\
  \ 参数，引用 .id 的点表示法。你还调用 -FileVersionInfo 参数以显示有关 PowerShell 进程的详细信息。然后你将结果通过管道传递给带有\
  \ -AutoSize 参数的 format-table cmdlet，该参数格式化表格以免截断结果。执行此脚本后，你将看到有关 PowerShell 进程的\
  \ ProductVersion、FileVersion 和 FileName 信息。\n\n可能存在需要确定哪个用户或服务帐户正在运行进程的情况。为此，你可以使用带有\
  \ -class 参数和 win32_process 参数的 get-wmiobject cmdlet。WMI 进程对象具有多个属性和方法，可让你查看系统上运行的进程的扩展信息。.Name\
  \ 属性显示名称，而 .GetOwner() 方法则显示有关进程所有者的信息。此方法是一个 .User 属性，显示运行服务的用户，以及 .Domain 属性，提供用户所属的域。\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_87_0.png)\n\n> 查询系统进程和其他用户的进程需要以提升权限运行的\
  \ PowerShell 窗口。你需要使用“以管理员身份运行”参数打开 PowerShell。\n\n要获取系统上运行 PowerShell.exe 的用户，可以执行以下操作：\n\
  \n```powershell\n$processes = Get-WmiObject -class win32_process | where {$_.Name\
  \ -like \"powersh*\"}\n\nforeach ($process in $processes) {\n    $procname = $process.Name\n\
  \    $procdom = $process.GetOwner().Domain\n    $procuser = $process.GetOwner().User\n\
  \    Write-host \"$procname is running with the $procdom\\$procuser account.\"\n\
  }\n```\n\n本输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_88_0.png)\n\
  \n本示例演示如何确定系统上进程的所有者。你首先通过将 -class 参数设置为 win32_process 调用 get-WmiObject cmdlet 开始。此命令通过管道传递到\
  \ where {$_.Name -like \"powersh*\"}，它将检索所有名称以 Powersh 开头的进程。这些对象随后被放入 $processes\
  \ 变量中。然后你创建一个 foreach 语句来遍历 $processes 变量中的每个 $process 对象。你使用 $process.Name 属性检索进程名称并将其设置为\
  \ $procname 变量。你通过利用 $process.GetOwner() 方法和 .Domain 属性来收集进程所有者域名称。最后，你使用 $process.GetOwner()\
  \ 方法和 .User 属性检索进程所有者名称。要显示收集的数据，你使用 write-host cmdlet 并显示 $procname is running\
  \ with the $procdom\\$procuser account。在此特定系统上，返回 powershell_ise.exe 以 POSHDEMO\\\
  Brenton 帐户运行。 和 powershell.exe 以 POSHDEMO\\Brenton 帐户运行。\n\n要启动新进程或调用程序，可以使用 start-process\
  \ cmdlet。使用此 cmdlet 的正确语法是调用 start-process cmdlet，提供指向要执行项目的所在位置的 -FilePath 参数。然后你可以调用可选的\
  \ -argumentList 参数引用执行项目所需的参数，可选的 -verb 参数以调用与文件类型关联的任何动词（如 Edit、Open、Play、Print\
  \ 和 RunAs），可选的 -NoNewWindow 参数以不在新的 Powershell 控制台中生成命令，以及可选的 -wait 参数以在继续脚本之前等待进程完成。如果不执行\
  \ -wait 参数，脚本将继续执行下一步，而不会等待当前步骤成功。启动进程后，进程将获得一个进程 ID，你可以使用其他进程 cmdlet 引用它。\n\n要启动新的记事本进程，可以执行以下操作：\n\
  \n```\nstart-process -FilePath notepad.exe\n$process = get-process notepad*\n```\n\
  \n本输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_89_0.png)\n\n本脚本演示如何启动记事本进程并通过通配符搜索记事本进程。你首先使用\
  \ start-process cmdlet 并使用引用 notepad.exe 进程的 -FilePath 参数开始。执行后，它将启动 notepad.exe。然后你使用\
  \ notepad* 通配符使用 get-process cmdlet。系统将 PowerShell 进程对象返回到 $process 变量中。将 PowerShell\
  \ 进程对象存储在 $process 变量中可让你根据需要与该对象的属性进行交互。\n\n要停止进程或停止程序，可以使用 stop-process cmdlet。使用此\
  \ cmdlet 的正确语法是调用 stop-process cmdlet，提供指向要终止项目的所在位置的 -FilePath 参数。你也可以利用 -processname\
  \ 参数通过其进程名称停止服务。你还可以使用通配符与 -processname 参数一起使用，以结束与你指定的部分单词相似的进程。你也可以指定 -id 参数通过其进程\
  \ ID 终止进程。默认情况下，如果你终止进程，它会提示确认。使用 -force 参数将强制终止进程而不提示用户。\n\n要停止正在运行的记事本进程，可以执行以下操作：\n\
  \n```\nstart-process -FilePath notepad.exe\n$process = get-process notepad*\nstop-process\
  \ -ID $process.id\n```\n\n本输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_89_1.png)\n\
  \n本脚本演示如何启动记事本进程，通过通配符搜索记事本进程，然后使用该信息停止记事本进程。你首先使用 start-process cmdlet 并使用引用 notepad.exe\
  \ 进程的 -FilePath 参数开始。执行后，它将启动 notepad.exe。然后你使用 notepad* 通配符使用 get-process cmdlet。系统将\
  \ PowerShell 进程返回到 $process 变量中。然后你调用 stop-process cmdlet 并利用指向 $process 变量的 -id\
  \ 参数，引用 .id 的点表示法。执行此脚本后，你将看到记事本打开并关闭。\n\n## 识别已登录用户\n\n可能存在需要识别已登录到系统的用户的情况。当用户登录到你的计算机时，他们会与系统创建交互式会话。这会在该用户名下生成进程作为进程所有者。此外，当你创建服务帐户在系统上启动服务时，底层进程将作为该服务帐户运行。鉴于这两种方法都会调用进程，确定当前已登录用户的最佳方法是评估正在运行的进程。\n\
  \n除了识别已登录用户外，你还需要过滤掉内置 Windows 帐户。为此，你可以创建 switch 语句以对进程所有者进行多次评估。如果进程所有者用户名是 NETWORK\
  \ SERVICE、LOCAL SERVICE、$null 或 SYSTEM，你可以跳过报告用户名。如果它与这些值中的任何一个都不匹配，它将使用默认 switch\
  \ 并将用户报告到列表中。由于多个进程在同一用户下运行，你可以将用户结果通过管道传递给 Get-Unique cmdlet，它只会选择数组中的唯一值。\n\n\
  > 根据系统上进程的数量，以下示例最多需要 30 秒才能执行。\n\n要评估正在运行的进程以获取非内置已登录用户列表，可以执行以下操作：\n\n```\n$users\
  \ = @()\n$processes = Get-WmiObject win32_process\nforeach ($process in $processes)\
  \ {\n    $procuser = $process.GetOwner().User\n    switch ($process.GetOwner().User)\
  \ {\n        \"NETWORK SERVICE\" { $continue = \"Skip User\" }\n        \"LOCAL\
  \ SERVICE\" { $continue = \"Skip User\" }\n        \"SYSTEM\" { $continue = \"Skip\
  \ User\"}\n        \"$null\" { $continue = \"Skip User\" }\n        default { $continue\
  \ = \"Report User\" }\n    }\n    if ($continue -eq \"Report User\") {\n       \
  \ $users += $procuser\n    }\n}\n$users | Get-Unique\n```\n\n此输出显示在以下屏幕截图中：\n\n\
  ![](img/a27a138d6586c10902d8e86ab3384834_91_0.png)\n\n此示例演示如何在系统上输出当前非内置用户。你首先定义一个名为\
  \ $users 的数组。然后你使用 Get-WmiObject 并传入 Win32_Process 类作为参数，并将结果放入 $processes 中。然后你创建一个\
  \ foreach 循环，并遍历 $processes 变量中的每个 $process。你接着使用 $process.GetOwner() 方法获取迭代进程的所有者，并将\
  \ .User 属性放入 $procuser 变量中。然后你声明一个 switch 语句来评估 $process.GetOwner().User 属性。首次评估针对的是内置账户。如果账户为\
  \ NETWORK SERVICE、LOCAL SERVICE、SYSTEM 或 $null，则会将 $continue 设置为 \"Skip User\"。如果不匹配这些内置用户，则会使用默认值，将\
  \ $continue 变量设置为 \"Report User\"。\n\n退出 switch 语句后，你使用 If 语句评估 $continue 变量，如果值等于\
  \ \"Report User\" 则继续执行。此步骤会将 $procuser 变量添加到 $users 数组中。foreach 循环完成后，你将为每个非内置用户列出大量用户。为了将列表精简为单个或唯一用户，你将\
  \ $users 变量通过管道传递给 Get-Unique cmdlet。结果是系统上唯一非内置用户的列表。运行此示例的系统上有三个用户：DWM-1、bblawat\
  \ 和 LocalJoe。\n\n## User profiles\n\n用户配置文件是企业中的常见挑战。由于它们在登录时自动生成，且没有内置的自动删除本地配置文件的功能，系统饱受旧配置文件账户困扰。旧配置文件不仅占用系统数据，还会泄露环境中其他活动账户的信息。\n\
  \nPowerShell 提供了检索用户配置文件信息的能力。要从系统检索用户配置文件，可以使用调用 Win32_UserProfile 类的 Get-WmiObject\
  \ cmdlet。检索到用户配置文件对象后，你可以使用多个属性来收集有关配置文件的的信息。.SID 属性是配置文件中用户的 security identifier。虽然\
  \ SID 是一个唯一的用户名，但你可以使用 .NET System.Security.Principal 类轻松将其转换。你首先通过调用 New-Object\
  \ cmdlet 并使用 System.Security.Principal.SecurityIdentifier 类创建新的 .NET 对象，将用户的 SID\
  \ 作为参数。然后你从设置为 [System.Security.Principal.NTAccount] 类的 .Translate() 方法中检索值。.NET\
  \ 类将从 SecurityIdentifier 转换到 NTAccount，从而输出用户名。\n\n要将用户的 security identifier 转换为用户名，可以执行以下操作：\n\
  \n```powershell\n$sid = \"S-1-5-18\"\n\n$usersid = New-Object System.Security.Principal.SecurityIdentifier(\"\
  $SID\")\n\n$usersid.Translate( [System.Security.Principal.NTAccount] ).Value\n```\n\
  \n此输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_92_0.png)\n\n此示例演示如何正确地将\
  \ SID 转换为用户名。你首先定义 \"S-1-5-18\" 的 security identifier 并将其放入 $sid 变量中。然后你使用 New-Object\
  \ cmdlet 调用 System.Security.Principal.SecurityIdentifier 类，并使用 $sid 参数并将其设为等于 $SID。这会将\
  \ SID 对象放入 $usersid 变量中。然后你在 SID 对象上调用 $usersid.Translate() 方法，并指定 [System.Security.Principal.NTAccount]\
  \ 作为参数。最后，你在转换后的数据上调用 .Value 属性，即可获得用户名的值。在此示例中，你了解到 SID S-1-5-18 被转换为了 NT AUTHORITY\\\
  SYSTEM。\n\nWin32_UserProfile 类中另一个常用的属性是 LastUseTime 属性。LastUseTime 提供了配置文件上次使用时间的洞察。此时间戳采用分布式管理任务组（DMTF）格式，通常不是便于阅读的用户友好格式。为了将此值简化为不同的时间格式，可以使用\
  \ [Management.ManagementDateTimeConverter] 类的 ToDateTime() 方法，并将 LastUseTime 作为参数。运行此方法后，你将成功把值转换为用户友好的格式。\n\
  \n要将 LastUseTime 转换为用户友好的格式，可以执行以下操作：\n\n```powershell\n$profile = Get-WmiObject\
  \ Win32_UserProfile | Where {$_.SID -eq \"S-1-5-18\"}\n$lastusetime = $profile.LastUseTime\n\
  $lastusetime\n[Management.ManagementDateTimeConverter]::ToDateTime($lastusetime)\n\
  ```\n\n此输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_93_0.png)\n\n\
  此示例演示如何将 DMTF 格式的值转换为用户友好的格式。你首先使用 Get-WmiObject cmdlet 并调用 Win32_UserProfile 类。然后你将此值通过管道传递给\
  \ Where {$_.SID -eq \"S-1-5-18\"} 并将此配置文件对象放入 $profile 变量中。然后你检索 .LastUseTime 属性并将其放入\
  \ $lastusetime 变量中。然后你调用 $lastusetime 以在屏幕上显示 DMTF 格式的时间。在此示例中，DMTF 为 20170216051704.765000+000。最后，你调用\
  \ [Management.ManagementDateTimeConverter] 类并使用 $lastusetime 作为参数调用 ToDateTime()\
  \ 方法。此命令的输出是用户友好的值 Wednesday, February 15, 2017 11:17:04 PM。\n\n要确定用户配置文件的 SID、用户名和年龄，可以执行以下操作：\n\
  \n```powershell\n$profiles = Get-WmiObject Win32_UserProfile\nforeach ($profile\
  \ in $profiles) {\n    $currentdate = Get-Date\n    $lastusetime = $profile.LastUseTime\n\
  \    $lastusetime = [Management.ManagementDateTimeConverter]::ToDateTime($lastusetime)\n\
  \n    $age = [math]::Round(($currentdate - $lastusetime).TotalDays)\n\n    $sid\
  \ = $profile.SID\n    Try {\n        $usersid = New-Object System.Security.Principal.SecurityIdentifier(\"\
  $SID\")\n        $username = $usersid.Translate( [System.Security.Principal.NTAccount]).Value\n\
  \    }\n    Catch {\n        Write-Host \"There was an error translating SID value\
  \ $sid to a username. Account may not exist.\"\n        $username = \"(Deleted Account)\"\
  \n    }\n    Write-host \"User with name $username and SID $sid last logged in $lastusetime.\
  \ ($age Days Old)\"\n}\n```\n\n此输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_94_0.png)\n\
  \n此示例演示如何检索用户配置文件的 SID、用户名和年龄。你首先使用 Win32_UserProfile 类作为参数使用 Get-WmiObject cmdlet\
  \ 并将 UserProfile 对象存储在 $profiles 变量中。然后你使用 $profile 作为迭代器、$profiles 作为数据集的 foreach\
  \ 循环。对于配置文件老化过程，你调用 Get-Date cmdlet 并将值设置在 $currentdate 变量中。然后你获取 $profile.LastUseTime\
  \ 属性的当前实例，并将其放入 $lastusetime 变量中。\n\n要计算年龄，首先必须将 $lastusetime 转换为友好格式。为此，你使用 $lastusetime\
  \ 变量作为参数使用 [Management.ManagementDateTimeConverter]::ToDateTime() 方法，并将结果放入 $lastusetime\
  \ 变量中。这会用标准时间格式值覆盖之前的 DMTF 格式值。然后你通过从 $lastusetime 中减去 $currentdate 变量并选择 .TotalDays\
  \ 属性来计算年龄。由于返回的值包含小数，你使用 [math]::Round() 方法对 TotalDays 属性结果执行 .net 四舍五入计算。这会返回一个日期年龄的单个数字，并设置在\
  \ $age 变量中。\n\n要计算用户名，你调用当前实例 $profile.SID 属性并将其设为等于 $sid 变量。然后你执行 Try{ 语句以捕获 SID\
  \ 上任何 .NET 转换错误。在 Try 语句内部，你使用 New-Object cmdlet、System.Security.Principal.SecurityIdentifier()\
  \ 类和 $SID 参数获取 SID 对象。然后 SID 对象返回到 $usersid 变量。然后你使用设置为 [System.Security.Principal.NTAccount]\
  \ 类对象的 $usersid.Translate() 方法将 SID 转换为 NTAccount。值转换后，你调用 .Value 属性将结果放入 $username\
  \ 变量中。\n\n如果 SID 或用户不存在，你执行 Catch { 语句来捕获错误。如果发生这种情况，你使用 Write-Host cmdlet 向显示器写入\
  \ \"There was an error translating SID value $sid to a username. Account may not\
  \ exist\"。然后你将 $username 变量设置为 \"(Deleted Account)\"。\n\n作为最后一步，你使用 Write-Host cmdlet\
  \ 向屏幕写入 \"User with the name $username and SID $sid last logged in $lastusetime.\
  \ ($age Days old)\"。处理此脚本后，此示例显示系统上内置的、本地的和域配置文件。\n\n\n\n## 摘要\n\n本章中，您了解了 Windows\
  \ 服务以及如何在 Windows 服务中停止、启动和设置项目。您继续学习了 Windows 进程以及如何获取、停止和启动进程。您学习了如何通过系统上运行的进程扫描系统以查找已登录用户。您通过使用\
  \ PowerShell 学习如何评估系统上的用户配置文件来结束本章。\n\n在下一章中，您将学习如何与系统上的计划任务进行交互。\n"
- "# 6 评估计划任务\n## 评估计划任务\n\n企业利用计划任务实现多种目的。无论是处理业务交易还是提供健康检查，它们已成为按计划运行操作的标准。计划任务具有灵活性，因为它们也可以在登录时、在触发特定事件后甚至手动运行。计划任务可以运行可执行文件，甚至可以启动脚本以扩展自动化无限的可能性。\n\
  \n由于计划任务用途广泛，使用 Windows 服务器扫描脚本扫描它们非常重要。这将帮助您识别仅在触发或按计划运行的进程，例如季度报告或夜间进程。它还可以用于识别用于运行这些计划任务的备用用户帐户。由于计划任务非常灵活，因此必须捕获计划任务正在执行的操作、如何调用它们以及指定运行任务的帐户。\n\
  \n本章中，您将：\n\n- 了解如何在系统上查看计划任务\n- 创建计划任务触发器、操作和设置集对象\n- 利用触发器、操作和设置集创建计划任务对象\n- 在系统上注册和注销计划任务\n\
  - 使用新操作更新现有计划任务\n- 识别作为备用用户帐户运行的计划任务\n\n### 计划任务\n\n计划任务使您能够在系统上安排自动化操作。Microsoft\
  \ 具有各种内置计划任务，其中包括时间同步、通用即插即用、Windows 更新和磁盘碎片整理。这些任务操作由不同的触发条件调用并自动在系统上运行。\n\n您可以使用\
  \ get-scheduledtask cmdlet 检索系统上的计划任务列表。get-scheduledtask cmdlet 显示计划任务名称、其 taskpath\
  \ 和当前状态的列表。您还可以返回其他属性，例如作者、日期、说明、版本和文档。\n\n要检索和计算系统上的计划任务，您可以利用以下内容：\n\n```\nget-scheduledtask\n\
  (get-scheduledtask).count\n```\n\n此命令的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_99_0.png)\n\
  \n此示例显示如何检索系统上的计划任务以及如何计算任务总数：\n\n1. 您首先通过调用 get-scheduledtask cmdlet 开始。您将在系统上看到大量计划任务列表。\n\
  2. 然后您使用 .count 方法执行 get-scheduledtask cmdlet。此示例中的系统返回 165 个计划任务。\n\n创建计划任务所需的两个组件是任务操作和任务触发器。任务触发器启动计划任务。最常见的触发器是按计划、在登录时、在启动时、在空闲时、在事件上和手动。在使用触发器时，您必须利用\
  \ New-ScheduledTaskTrigger cmdlet 创建新的任务触发器对象。然后您需要将任务触发器对象存储在变量中以创建计划任务。\n\n要按计划创建计划任务触发器，您可以执行以下操作：\n\
  \n```\n$schTrigger = New-ScheduledTaskTrigger -Daily -DaysInterval 1 -At \"23:00\"\
  \n$schTrigger\n```\n\n此命令的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_100_0.png)\n\
  \n在此示例中，您学习如何创建计划任务触发器：\n\n1. 您首先通过调用 New-ScheduledTaskTrigger cmdlet 开始，使用 -Daily\
  \ 参数、使用 1 属性的 -DaysInterval 参数以及设置为 23:00 属性的 -At 参数。\n2. 然后您将此计划任务触发器对象存储在 $schTrigger\
  \ 变量中。当您调用 $schTrigger 变量时，它返回触发器 Id 为 0，频率为 Daily，时间为 2/18/2017 11:00:00 PM，DaysOfWeek\
  \ 为 $null，并且 Enabled 设置为 true。\n\n> 有关计划任务触发器及其语法的更多信息，您可以浏览至： https://technet.microsoft.com/itpro/powershell/windows/scheduled-tasks/new-scheduledtasktrigger.\n\
  \n任务操作定义计划任务正在执行的内容。任务操作可以简单到运行可执行文件，也可以调用脚本执行各种操作。您使用 New-ScheduledTaskAction cmdlet\
  \ 创建新的操作对象。除了 cmdlet 之外，您还可以利用 -Execute 参数启动可执行文件。您还具有 -Argument 参数，它使您可以向正在调用的可执行文件传递参数。您需要将任务操作对象存储在变量中以创建计划任务。\n\
  \n要创建打开 calc.exe 的计划任务操作，您可以执行以下操作：\n\n```powershell\n$schAction = New-ScheduledTaskAction\
  \ -Execute \"Calc.exe\"\n$schAction\n```\n\n此命令的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_101_0.png)\n\
  \n在此示例中，您学习如何创建计划任务操作：\n\n1. 您首先通过调用 New-ScheduledTaskAction cmdlet 开始，将 -Execute\
  \ 参数设置为 calc.exe 属性。\n2. 然后您将此计划任务对象保存在 $schAction 变量中。\n\n当您调用 $schAction 变量时，它返回\
  \ Id 为 $null，Arguments 为 $null，Execute 为 Calc.exe，WorkingDirectory 为 $null 和 PSComputerName\
  \ 为 $null。如果向 new-ScheduledTaskAction cmdlet 传递了其他参数，$null 字段将填充数据。\n\n配置的可选组件是任务设置集，它为计划任务本身提供配置。如果您想要包含其他参数，可以配置电池上的执行、执行持续时间、空闲持续时间、重启计数和重启间隔。您可以使用\
  \ New-ScheduledTaskSettingsSet cmdlet 定义计划任务设置集，并且您需要将其存储在变量中以创建计划任务。\n\n要使用 -DisallowDemandStart、-Hidden\
  \ 和 -DisallowHardTerminate 参数创建计划任务设置集，您可以执行以下操作：\n\n```\n$schSettingSet = New-ScheduledTaskSettingsSet\
  \ -DisallowDemandStart\n-Hidden -DisallowHardTerminate\n$schSettingSet\n```\n\n\
  此命令的输出如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_102_0.png)\n\n在此示例中，您创建一个新的计划任务设置集：\n\
  \n1. 您首先通过声明 New-ScheduledTaskSettingsSet cmdlet 开始，使用 -DisallowDemandStart、-Hidden\
  \ 和 -DisallowHardTerminate 参数。\n2. 然后您将计划任务设置集对象设置为 $schSettingSet 变量。\n\n当您调用 $schSettingSet\
  \ cmdlet 时，您会显示计划任务设置集具有的所有参数。在此设置集中，您可以看到 AllowDemandStart 设置为 False，AllowHardTerminate\
  \ 设置为 False，Hidden 设置为 True。\n\n> 有关计划任务设置及其语法的更多信息，您可以浏览至： https://technet.microsoft.com/itpro/powershell/windows/scheduled-tasks/new-scheduledtasksettingsset.\n\
  \n在将任务操作和任务触发器捕获到变量后，您创建计划任务对象。您调用 New-ScheduledTask cmdlet，使用 -Action 参数引用任务操作对象，并使用\
  \ -Trigger 参数引用任务触发器对象。您还可以使用 -Settings 参数使用可选的任务设置集，通过引用任务设置集对象。您将所有这些项目放入将包含计划任务对象的变量中。\n\
  \n要创建计划任务变量，您可以执行以下操作：\n\n```\n$schAction = New-ScheduledTaskAction -Execute \"\
  Calc.exe\"\n$schTrigger = New-ScheduledTaskTrigger -Daily -DaysInterval 1 -At \"\
  23:00\"\n$schSettingSet = New-ScheduledTaskSettingsSet -DisallowDemandStart -Hidden\
  \ -DisallowHardTerminate\n$schTask = New-ScheduledTask -Action $schAction -Trigger\
  \ $schTrigger -Settings $schSettingSet\n$schTask\n$schTask.Triggers\n```\n\n此命令的输出如下所示：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_103_0.png)\n\n此示例显示如何采用计划任务操作、触发器和设置集来创建计划任务对象：\n\
  \n1. 您首先通过调用 New-ScheduledTaskAction cmdlet 开始，将 -Execute 参数设置为 calc.exe 属性。\n2.\
  \ 然后您将此计划任务对象保存在 $schAction 变量中。\n3. 然后您使用 New-ScheduledTaskAction cmdlet 将 -Execute\
  \ 参数设置为 calc.exe 属性。\n\n\n\n- 4. 然后你将此计划任务对象保存在 `$schAction` 变量中。\n- 5. 你继续声明 `New-ScheduledTaskSettingsSet`\
  \ cmdlet，并使用 `-DisallowDemandStart`、`-Hidden` 和 `-DisallowHardTerminate` 参数。\n-\
  \ 6. 然后你将计划任务设置集对象设置为 `$schSettingSet` 变量。\n- 7. 最后，你调用 `New-ScheduledTask` cmdlet，将\
  \ `-Action` 参数设置为 `$schAction`，将 `-Trigger` 参数设置为 `$schTrigger`，并将 `-Settings` 参数设置为\
  \ `$schSettingSet`。\n- 8. 然后你取出计划任务对象并将其放入 `$schTask` 变量中。然而，当你调用 `$schTask` 变量时，它返回的\
  \ `TaskPath`、`TaskName` 和 `State` 为空白。这是因为任务需要注册，如下一步所述。虽然 `TaskPath`、`TaskName`\
  \ 和 `State` 属性为空，但当你调用诸如 `$schTask.Triggers` 之类的属性时，你会看到这些属性已正确填充。在这种情况下，它返回你在之前步骤中设置的晚上11点触发器。\n\
  - 9. 最后一步是在系统上注册计划任务。\n\n要注册计划任务，你可以使用 `Register-ScheduledTask` cmdlet，并使用 `-TaskName`\
  \ 参数以及所需的名称作为参数。你还需要包含 `-InputObject` 参数，引用使用 `New-ScheduledTask` cmdlet 创建的对象。执行后，计划任务将在你的系统上正确创建。\n\
  \n如果你想删除计划任务，可以使用 `Unregister-ScheduledTask` cmdlet，并使用 `-TaskName` 参数以及要删除的名称作为参数。执行后，`Unregister-ScheduledTask`\
  \ cmdlet 会提示你确认删除计划任务。要暂停确认提示，可以使用 `-Confirm:$false` 作为参数。这将从系统上删除计划任务而不提示。\n\n\
  要注册两个计划任务以便每天在 23:00 启动计算器，并注销其中一个计划任务，请执行以下操作：\n\n```\n$schAction = New-ScheduledTaskAction\
  \ -Execute \"Calc.exe\"\n$schTrigger = New-ScheduledTaskTrigger -Daily -DaysInterval\
  \ 1 -At \"23:00\"\n$schTask = New-ScheduledTask -Action $schAction -Trigger $schTrigger\n\
  Register-ScheduledTask -TaskName \"Start Calc Daily at 11PM\" -InputObject $schTask\n\
  ```\n\n```\nRegister-ScheduledTask -TaskName \"Start Calc Daily at 11PM_DeleteMe\"\
  \ -InputObject $schTask\n```\n\n```\nUnregister-ScheduledTask -TaskName \"Start\
  \ Calc Daily at 11PM_DeleteMe\" -Confirm:$false\n```\n\n```\nGet-ScheduledTask |\
  \ where {$_.TaskName -like \"Start Calc Daily at 11PM*\"}\n```\n\n此命令的输出将如下所示：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_105_0.png)\n\n在此示例中，你将学习如何创建两个计划任务以便每天在\
  \ 23:00 启动计算器。你还将学习如何删除其中一个计划任务：\n\n- 1. 你首先通过使用 New-ScheduledTaskAction cmdlet\
  \ 创建计划任务操作，使用 -Execute 参数和 Calc.exe 参数开始。\n- 2. 你将此对象放入 $schAction 变量中。\n- 3. 你继续通过使用\
  \ New-ScheduledTaskTrigger cmdlet 创建计划任务触发器，使用 -Daily 参数、使用参数为 1 的 -DaysInterval\
  \ 参数，以及参数为 23:00 的 -At 参数。\n- 4. 你将计划任务触发器对象放入 $schTrigger 变量中。\n- 5. 然后你通过使用 New-ScheduledTask\
  \ cmdlet 创建计划任务对象，将 -Action 参数设置为 $schAction 的参数，并将 -Trigger 参数设置为 $schTrigger 的参数。\n\
  - 6. 你将此计划任务对象放入 $schTask 变量中。\n\n- 7. 要使用两个不同的名称在系统上注册计划任务，你使用 Register-ScheduledTask\
  \ cmdlet，将 -TaskName 参数设置为 Start Calc Daily at 11pm 参数。你还包含将 -InputObject 参数设置为\
  \ $schTask 变量。执行后，将创建名为 Start Calc Daily at 11pm 的计划任务。\n- 8. 要创建第二个计划任务，你使用 Register-ScheduledTask\
  \ cmdlet，将 -TaskName 参数设置为 Start Calc Daily at 11pm_DeleteMe 参数。你还包含将 -InputObject\
  \ 参数设置为 $schTask 变量。执行后，将创建名为 Start Calc Daily at 11pm_DeleteMe 的计划任务。\n\n要注销名称以\
  \ _Deleteme 结尾的计划任务，你使用 Unregister-ScheduledTask cmdlet，将 -TaskName 参数设置为 Start\
  \ Calc Daily at 11PM_DeleteMe。你还使用 -Confirm:$false 参数来指定 cmdlet 无需提示确认。执行后，名为 Start\
  \ Calc Daily at 11PM_DeleteMe 的计划任务将被从系统注销。你可以通过运行 Get-ScheduledTask cmdlet 并管道到\
  \ where {$_.TaskName -like \"Start Calc Daily at 11PM*\"} 来确认这一点。执行后，脚本将返回一个 Start\
  \ Calc Daily at 11PM 的实例。\n\n修改计划任务主要有两种方法：\n\n- 1. 你可以选择注销并重新创建计划任务。\n- 2. 你可以选择使用\
  \ Set-ScheduledTask cmdlet。Set-ScheduledTask cmdlet 允许你通过 -TaskName 参数调用特定的计划任务，并指定新的或额外的触发器、操作和计划任务设置。\n\
  \n利用前面的示例，要设置两个新的计划任务操作以打开记事本和计算器，你可以执行以下操作：\n\n```powershell\n$schAction1 = New-ScheduledTaskAction\
  \ -Execute \"Calc.exe\"\n$schAction2 = New-ScheduledTaskAction -Execute \"Notepad.exe\"\
  \nSet-ScheduledTask -TaskName \"Start Calc Daily at 11PM\" -Action $schAction1,$schAction2\n\
  ```\n\n此命令的输出将如下所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_106_0.png)\n\n此示例显示如何更新现有计划任务以具有两个新的计划任务操作：\n\
  \n- 1. 你首先通过调用 `New-ScheduledTaskAction` cmdlet 开始，使用 `-Execute` 参数和 `calc.exe`\
  \ 参数。\n- 2. 你将此计划操作任务对象放入 `$schAction1` 变量中。\n- 3. 然后你调用 `New-ScheduledTaskAction`\
  \ cmdlet，使用 `-Execute` 参数和 `notepad.exe` 参数。\n- 4. 你将此计划操作任务对象放入 `$schAction2` 变量中。\n\
  - 5. 最后，你调用 `Set-ScheduledTask` cmdlet，将 `-TaskName` 参数设置为 `Start Calc Daily at\
  \ 11PM`。你还调用 `-Action` 参数并声明两个操作：`$schAction1`、`$schAction2`。执行后，计划任务设置为 23:00 并将同时启动\
  \ `calc.exe` 和 `notepad.exe`。\n\n> 在撰写本文时，没有原生的重命名计划任务的方法。为此，你需要将计划任务导出为 XML，并使用\
  \ XML 文件注册新的计划任务。有关导出过程的更多信息，请参阅这里: https://technet.microsoft.com/itpro/powershell/windows/scheduled-tasks/export-scheduledtask。\n\
  \n## 识别以其他用户身份运行的计划任务\n\n可能存在需要识别使用非默认凭据运行的计划任务的情况。如果用户利用其身份运行计划任务，或你正在使用服务帐户，你需要在系统上识别其使用情况。`Get-ScheduledTask`\
  \ cmdlet 具有 Principal 属性，其中包含运行计划任务的用户帐户的信息。`UserID` 反映了指定运行计划任务的帐户的用户名。\n\n除了识别\
  \ Principal UserId 之外，你还需要过滤掉内置 Windows 帐户。为此，你可以创建 switch 语句以对 Principal UserIds\
  \ 进行多次评估。如果进程所有者用户名是 `NETWORK SERVICE`、`LOCAL SERVICE`、`$null` 或 `System`，你可以跳过报告用户名。如果它与这些值中的任何一个都不匹配，它将使用默认\
  \ switch 并将用户报告到列表中。由于多个计划任务在同一用户下运行，你可以将用户结果管道到 `Get-Unique` cmdlet，该 cmdlet 仅选择数组中的唯一值。\n\
  \n\n\n为了评估计划任务并获取运行计划任务的账户列表，您可以执行以下操作：\n\n```\n$users = @()\n$schtasks = Get-ScheduledTask\n\
  foreach ($Task in $schtasks) {\n    $tskUser = $Task.Principal.UserId\n    switch\
  \ ($Task.Principal.UserId) {\n\"NETWORK SERVICE\" { $continue = \"Skip User\" }\n\
  \"LOCAL SERVICE\" { $continue = \"Skip User\" }\n\"SYSTEM\" { $continue = \"Skip\
  \ User\"}\n\"$null\" { $continue = \"Skip User\" }\n        default { $continue\
  \ = \"Report User\" }\n    }\n    if ($continue -eq \"Report User\") {\n\n     \
  \   $users += $tskUser\n    }\n}\n$users | Get-Unique\n```\n\n其输出如下图所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_108_0.png)\n\
  \n本示例展示如何输出运行计划任务的非内置用户账户：\n\n1. 你首先定义一个名为 `$users` 的数组。\n2. 然后你利用 `Get-ScheduledTask`\
  \ cmdlet，将结果放在 `$schtasks` 变量中。\n3. 然后你创建一个 `foreach` 循环，遍历 `$schtasks` 变量中的每个 `$Task`。\n\
  4. 你接着使用 `$Task.Principal.UserID` 属性收集当前迭代计划任务的 `Principal.UserID`，并将其放入 `$tskUser`\
  \ 变量中。\n5. 然后你声明一个 `switch` 语句来评估 `$Task.Principal.UserID` 属性。最初的评估针对的是内置账户。如果账户为\
  \ `NETWORK SERVICE`、`LOCAL SERVICE`、`SYSTEM` 或 `$null`，则会将 `$continue` 设置为 `Skip\
  \ User`。如果与这些内置用户都不匹配，则会使用 `default` 值，将 `$continue` 变量设置为 `Report User`。\n6. 退出\
  \ `switch` 语句后，你使用 `If` 语句评估 `$continue` 变量，如果值等于 `Report User` 则继续。此步骤会将 `$tskUser`\
  \ 变量添加到 `$users` 数组中。\n\n`foreach` 循环完成后，你将为每个非内置用户列出大量用户。为了将列表精简为单个或唯一用户，你将 `$users`\
  \ 变量通过管道传递给 `get-unique` cmdlet。结果是系统上唯一非内置用户的列表。\n\n该示例运行的系统有两个非默认用户账户：\n`POSHDEMO\\\
  bblawat` 和 `POSHDEMO\\svcSchTasks`。\n\n## Summary\n\n本章中，你学习了如何在 PowerShell 中处理计划任务。你首先学习了如何在系统上获取计划任务。然后你学习了如何设置计划任务触发器、计划任务操作和计划任务设置集。你继续创建了一个计划任务对象并将其注册到系统中。你还学习了如何注销计划任务以将其从系统中移除。然后你练习了更新现有计划任务。本章以学习如何识别用于运行计划任务的任何用户或服务账户的权限而结束。\n\
  \n在下一章中，你将学习如何查询系统以确定磁盘统计信息，例如可用空间、磁盘利用率和驱动器类型判定。\n"
- "# 7 Determining Disk Statistics\n\n## Determining Disk Statistics\n\n使用 Windows\
  \ 服务器扫描脚本评估的另一个重要组件是磁盘统计信息。无论你是扫描以识别配置还是扫描以替换系统，评估完整的磁盘配置都很重要。通过 PowerShell，你能够收集有关物理磁盘布局、逻辑磁盘布局以及插入系统中的可移动设备的信息。这有助于识别\
  \ USB 授权密钥设备，甚至是插入系统用于备份的外部硬盘。\n\nWindows 服务器扫描脚本还可以让你查看连接到系统上的所有设备的磁盘大小和可用空间。这些信息在系统磁盘空间不足或驱动器大小不符合公司标准时可能很有帮助。本章将使你能够详细了解系统上的磁盘配置。\n\
  \n本章中，我们讨论以下主题：\n\n- 检索物理和逻辑磁盘信息\n- 确定连接到系统的磁盘类型\n- 将磁盘字节值转换为兆字节和千兆字节\n- 动态确定磁盘度量单位\n\
  - 创建磁盘信息脚本以查询系统上的磁盘、转换磁盘大小和可用空间、计算度量单位并识别驱动器类型\n\n> 为了获得本章示例的最佳效果，建议使用具有多个磁盘的系统。你也可以选择插入外部硬盘或\
  \ USB 驱动器以模拟额外的存储设备。\n\n![](img/a27a138d6586c10902d8e86ab3384834_110_0.png)\n\n\
  ### Disk statistics\n\n无论你是进行容量规划还是计划服务器更换，评估磁盘信息的原因有很多。PowerShell 提供了多种检索磁盘信息的方法。如果想了解系统上物理磁盘的更多信息，可以使用\
  \ `get-disk` cmdlet。`get-disk` cmdlet 提供的信息包括 Number、Friendly Name、Serial Number、HealthStatus、OperationalStatus、Total\
  \ size 和 Partition Style。\n\n![](img/a27a138d6586c10902d8e86ab3384834_111_0.png)\n\
  \n> 要确定 `get-disk` cmdlet 可用的所有属性，可以执行 `get-disk | get-member`。这将显示物理磁盘的所有可用方法和属性。\n\
  \n### Retrieving physical and logical disk information\n\n要检索系统上物理磁盘的磁盘信息，可以执行以下命令：\n\
  \n```\nget-disk\n```\n\n其输出如下图所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_111_1.png)\n\
  \n本示例展示如何获取系统上物理磁盘的信息。当你执行 `get-disk` cmdlet 时，该 cmdlet 返回磁盘 Number、Friendly Name、Serial\
  \ Number、HealthStatus、OperationalStatus、TotalSize 和 Partition Style。该示例运行的系统连接了五个逻辑设备，这在\
  \ cmdlet 的输出中有所体现。\n\n当你想确定有关磁盘操作系统使用的更多信息时，可以利用 Windows 管理规范（WMI）。要读取逻辑磁盘信息，可以使用\
  \ `get-wmiobject` cmdlet，并将 `-class` 参数设置为 `win32_logicaldisk` 参数。当你查询 `win32_logicaldisk`\
  \ 类时，可以访问 DeviceID、DriveType、ProviderName、FreeSpace、Size 和 Volume name 属性。\n\n要查询\
  \ win32_logicaldisk 类以获取磁盘信息，可以执行以下操作：\n\n```\nGet-WmiObject -class win32_logicaldisk\n\
  ```\n\n其输出如下图所示：\n\n![](img/a27a138d6586c10902d8e86ab3384834_112_0.png)\n\n以下示例展示如何利用\
  \ get-wmiobject 查询 WMI 以提供磁盘信息：\n\n1. 你首先使用 `-class` 参数设置为 win32_logicaldisk 参数的\
  \ get-wmiobject cmdlet。\n2. 执行后，cmdlet 返回 DeviceID、DriveType、ProviderName、FreeSpace、Size\
  \ 和 VolumeName 属性。\n\n该示例运行的系统连接了六个设备，这在 cmdlet 的输出中有所体现。这与 get-disk cmdlet 不同，WMI\
  \ 提供程序考虑了空的 CD-ROM/DVD 驱动器。\n\n### The DriveType property\n\nDriveType 属性表示一个数值，对应于一种驱动器类型。该值范围为\
  \ 0 到 6，具体取决于连接的物理设备类型。DriveType 对应关系如下：\n\n- 0: Unknown device type\n- 1: Drive\
  \ does not have a root directory\n- 2: Removable disk (USB key)\n- 3: Local disk\
  \ (hard drive/USB hard drive/virtual drive mount)\n- 4: Network drive/mapped drive\n\
  - 5: Compact disk (CD/DVD drive)\n- 6: RAM drive (memory mapped drive/PE OS drive)\n\
  \n为了快速确定 DriveType 属性的对应关系，可以执行以下 switch 命令：\n\n```powershell\n$disks = get-wmiobject\
  \ win32_logicaldisk\nForeach ($disk in $disks) {\n    $driveletter = $disk.DeviceID\n\
  \    switch ($disk.DriveType) {\n        0 { $type = \"Type Unknown.\" }\n     \
  \   1 { $type = \"Doesn't have a Root Directory.\" }\n        2 { $type = \"Removable\
  \ Disk (e.g. USB Key)\" }\n        3 { $type = \"Local Disk (e.g. Hard Drive / USB\
  \ hard drive / Virtual drive mount)\" }\n        4 { $type = \"Network Drive (e.g.\
  \ Mapped Drive)\" }\n        5 { $type = \"Compact Disk (e.g. CD/DVD Drive)\" }\n\
  \        6 { $type = \"RAM Disk (e.g. Memory Mapped Drive / PE OS Drive)\" }\n \
  \       default { $type = \"Unable To Determine Drive Type!\" }\n    }\n    Write-host\
  \ \"Drive: $driveletter | Disk Type: $type\"\n}\n```\n\n本脚本的输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_114_0.png)\n\
  \n在此示例中，您创建一个 switch 语句，将 DriveType 数字与可读值关联起来：\n\n- 1. 您首先使用 `get-wmiobject` 并传入\
  \ `win32_logicaldisk` 参数，并将驱动器信息存储在 `$disks` 变量中。\n- 2. 然后您创建一个 `Foreach` 语句来评估\
  \ `$disks` 变量中的每个 `$disk`。\n- 3. 然后您通过调用 `$disk.DeviceID` 属性来获取驱动器号，并将值设置到 `$driveletter`\
  \ 中。\n- 4. 然后您启动 `switch` 语句并评估 `$disk.DriveType` 值。\n\n`switch` 语句评估数字并将其关联到可读值。如果\
  \ `DriveType` 为 0，则会将 `$type` 变量设置为 类型未知。如果 `DriveType` 为 1，则会将 `$type` 变量设置为 没有根目录。如果\
  \ `DriveType` 为 2，则会将 `$type` 变量设置为 可移动磁盘（例如 USB 密钥）。如果 `DriveType` 为 3，则会将 `$type`\
  \ 变量设置为 本地磁盘（例如 硬盘 / USB 硬盘 / 虚拟驱动器挂载）。如果 `DriveType` 为 4，则会将 `$type` 变量设置为 网络驱动器（例如\
  \ 映射驱动器）。如果 `DriveType` 为 5，则会将 `$type` 变量设置为 光盘（例如 CD/DVD 驱动器）。如果 `DriveType` 为\
  \ 6，则会将 `$type` 变量设置为 RAM 磁盘（例如 内存映射驱动器 / PE OS 驱动器）。\n\n- 5. 在这些评估之后，您随后利用 `write-host`\
  \ cmdlet 将内容打印到屏幕：驱动器：`$driveletter` | 磁盘类型：`$type`。\n\n运行此示例的系统上连接了五个逻辑设备，具有不同的驱动器类型。不同的驱动器类型在\
  \ cmdlet 的输出中有所体现。\n\n## 将磁盘空间转换为 MB 和 GB\n\n在处理逻辑磁盘的 Size 和 FreeSpace 属性时，值以字节表示。PowerShell\
  \ 提供了一种快速方法将字节转换为多种格式。您可以取 Size 或 FreeSpace 属性并除以 1MB 得到兆字节，除以 1GB 得到千兆字节，除以 1TB\
  \ 得到太字节，除以 1PB 得到拍字节。转换后，您通常需要对数字进行四舍五入，利用 `[System.Math]::Round()` 方法。默认情况下，此 .NET\
  \ Round() 方法会四舍五入到最接近的整数。要包含小数位，您可以提供额外的数值参数，例如 `[System.Math]::Round($value,2)`，将\
  \ $value 四舍五入到两位小数。\n\n要将磁盘 Size 属性转换为兆字节和千兆字节，您可以执行以下操作：\n\n```\n$disks = get-wmiobject\
  \ win32_logicaldisk\nForeach ($disk in $disks) {\n    $driveletter = $disk.DeviceID\n\
  \    $sizeMB = [System.Math]::Round(($disk.size / 1MB),2)\n    $sizeGB = [System.Math]::Round(($disk.size\
  \ / 1GB),2)\n    Write-host \"$driveletter | Size (in MB): $sizeMB | Size (in GB):\
  \ $sizeGB\"\n}\n```\n\n本脚本的输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_115_0.png)\n\
  \n此示例演示如何将硬盘 `Size` 属性格式化为兆字节和千兆字节：\n\n- 1. 您首先通过利用 `get-wmiobject` cmdlet 并传入 `win32_logicaldisk`\
  \ 参数来启动脚本，并将返回的值放在 `$disks` 变量中。\n- 2. 然后您创建一个 `Foreach` 语句来评估 `$disks` 变量中的每个 `$disk`。\n\
  - 3. 您评估 `$disk.DeviceID` 属性并将驱动器号值设置为 `$driveletter` 变量。\n- 4. 然后您利用 `[System.Math]::Round()`\
  \ 方法对从 `$disk.Size` 参数计算得出的值除以 1MB 后进行四舍五入。\n- 5. 您还将 `,2` 参数传递给该方法，以在计算中提供两位小数。\n\
  - 6. 您将此值的输出存储在 `$sizeMB` 变量中。\n- 7. 您继续利用 `[System.Math]::Round()` 方法对从 `$disk.Size`\
  \ 参数计算得出的值除以 1GB 后进行四舍五入。\n- 8. 您再次将 `,2` 参数传递给该方法，以在计算中提供两位小数。\n- 9. 您将此值的输出存储在\
  \ `$sizeGB` 变量中。\n- 10. 最后，您利用 `write-host` cmdlet 将内容打印到屏幕：`$driveletter | Size\
  \ (in MB): $sizeMB | Size (in GB): $sizeGB`。\n- 11. 在系统上执行此脚本后，您会看到每个驱动器号都被打印出来，并且以\
  \ MB 为单位的 `Size` 和以 GB 为单位的大小都会显示。\n\n您还会看到所有值都四舍五入到两位小数，除非计算结果为整数。您还会在示例中看到一个驱动器的驱动器大小评估为\
  \ 0。根据前面的示例，您注意到该驱动器是系统上的 CD-ROM/DVD 驱动器。由于该驱动器中没有插入磁盘，因此 `Size` 为 0。\n\n## 空闲空间属性\n\
  \n另一个重要的属性是 FreeSpace 属性。FreeSpace 属性的范围可以从磁盘的 Size 属性值到 0。在编写脚本以确定可用空间时，您必须考虑剩余空间可能不是您开始时使用的相同度量单位。例如，您可能有一个\
  \ 2 太字节的驱动器，但磁盘上可能只剩下 100 千字节。如果您将剩余的 100 千字节转换为太字节，该值将会有很长的十进制位数。相反，您需要建立逻辑来根据驱动器上的剩余空间确定适当的度量单位。\n\
  \n实现此目的最简单的方法之一是创建一个 PowerShell 函数来评估系统上的磁盘空间。此函数将允许使用 $diskspace 参数。然后它将利用 switch\
  \ 语句来评估 $diskspace 值。如果它大于 1PB、1TB、1MB 或 1KB，按此顺序，它将执行适当的数学计算以转换适当的度量单位。随后将四舍五入到两位小数的值连同度量单位一起返回给脚本。此方法成功的关键在于利用函数进行评估。当找到适当的度量单位时，您使用\
  \ Return 命令，函数在将值返回给脚本后退出。\n\n要将磁盘空间转换为相应的度量单位，您可以执行以下操作：\n\n```\nfunction measure-diskunit\
  \ { param($diskspace)\n    switch ($diskspace) {\n        {$_ -gt 1PB} { return\
  \ [System.Math]::Round(($_ / 1PB),2),\"PB\" }\n        {$_ -gt 1TB} { return [System.Math]::Round(($_\
  \ / 1TB),2),\"TB\" }\n        {$_ -gt 1GB} { return [System.Math]::Round(($_ / 1GB),2),\"\
  GB\" }\n        {$_ -gt 1MB} { return [System.Math]::Round(($_ / 1MB),2),\"MB\"\
  \ }\n        {$_ -gt 1KB} { return [System.Math]::Round(($_ / 1KB),2),\"KB\" }\n\
  \        default { return [System.Math]::Round(($_ / 1MB),2),\"MB\" }\n    }\n}\n\
  \nmeasure-diskunit 868739194880123456\nmeasure-diskunit 868739194880123\nmeasure-diskunit\
  \ 868739194880\nmeasure-diskunit 868739194\nmeasure-diskunit 868739\n```\n\n本脚本的输出显示在以下屏幕截图中：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_118_0.png)\n\n此示例演示如何将字节值转换为多种度量单位：\n\
  \n- 1. 您首先通过声明一个名为 `measure-diskunit` 的函数并使用 param of (`$diskspace`) 来开始。\n- 2.\
  \ 然后您创建一个带有参数 `$diskspace` 的 `switch` 语句。\n\n在 `switch` 评估中，您首先评估由 `$_` 表示的管道，然后确定\
  \ `$diskspace` 值是否大于 1 PB（1PB）：\n\n- 如果值大于 1PB，脚本将使用管道值并除以 1PB。然后它将利用 `[System.Math]::Round()`\
  \ 方法并使用参数 2 对结果值进行四舍五入，以保留两位小数。作为返回数组的第二个值，您提供一个逗号后跟 PB 单位。转换后的值和单位将返回给脚本，从而终止函数中的进一步评估。\n\
  - 如果单位不是大于 1PB，它将继续评估 `switch` 语句中的语句。\n- 它将确定 `$diskspace` 值是否大于 1TB，进行四舍五入，并将单位返回给脚本。\n\
  \n\n\n- 如果 $diskspace 值不大于 1TB，它将在 switch 语句中继续判断该值是否大于 1GB、1MB 和 1KB，判断方式相同，并在匹配时返回转换后的值和度量单位。\n\
  - 如果没有值匹配，switch 将默认以 MB 返回值。\n\n在此示例中，你使用五个不同的 $diskspace 值运行 measure-diskunit\
  \ 函数。第一个语句 measure-diskunit 868739194880123456 返回数组 771.6 和 PB。下一个语句 measure-diskunit\
  \ 868739194880123 返回数组 790.11 和 TB。接下来的语句 measure-diskunit 868739194880 返回数组 809.08\
  \ 和 GB。语句 measure-diskunit 868739194 返回数组 828.49 和 MB。最后的语句 measure-diskunit 868739\
  \ 返回数组 848.38 和 KB。\n\n## 磁盘信息脚本\n\n本章解释了扫描系统上附加的逻辑驱动器不同方面的不同方法。如果您想查询系统上的磁盘、转换磁盘大小和可用空间并识别驱动器类型，可以创建以下脚本：\n\
  \n```\nfunction measure-diskunit { param($diskspace)\n    switch ($diskspace) {\n\
  \        {$_ -gt 1PB} { return [System.Math]::Round(($_ / 1PB),2),\"PB\" }\n   \
  \     {$_ -gt 1TB} { return [System.Math]::Round(($_ / 1TB),2),\"TB\" }\n      \
  \  {$_ -gt 1GB} { return [System.Math]::Round(($_ / 1GB),2),\"GB\" }\n        {$_\
  \ -gt 1MB} { return [System.Math]::Round(($_ / 1MB),2),\"MB\" }\n        {$_ -gt\
  \ 1KB} { return [System.Math]::Round(($_ / 1KB),2),\"KB\" }\n        default { return\
  \ [System.Math]::Round(($_ / 1MB),2),\"MB\" }\n    }\n}\n```\n\n```\n$disks = get-wmiobject\
  \ win32_logicaldisk\nForeach ($disk in $disks) {\n    $driveletter = $disk.DeviceID\n\
  \    $freespace = $disk.FreeSpace\n    $size = $disk.Size\n}\n```\n\n```\nif ($freespace\
  \ -lt 1) { $freespace = \"0\" }\nif ($size -lt 1) { $size = \"0\" }\n\n$freetype\
  \ = measure-diskunit $freespace\n$convFreeSpc = $freetype[0]\n$funit = $freetype[1]\n\
  \n$sizetype = measure-diskunit $size\n$convsize = $sizetype[0]\n$sunit = $sizetype[1]\n\
  \nswitch ($disk.DriveType) {\n  0 { $type = \"Type Unknown.\" }\n  1 { $type = \"\
  Doesn't have a Root Directory.\" }\n  2 { $type = \"Removable Disk\" }\n  3 { $type\
  \ = \"Local Disk\" }\n  4 { $type = \"Network Drive\" }\n  5 { $type = \"Compact\
  \ Disk\" }\n  6 { $type = \"RAM Disk\" }\n  default { $type = \"Unable To Determine\
  \ Drive Type!\" }\n}\n\n    write-host \"Drive $driveletter | Drive Type: $type\
  \ | Size: $convsize $sunit | Freespace: $convFreeSpc $funit\"\n}\n```\n\n此脚本的输出显示在以下屏幕截图中：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_120_0.png)\n\n此示例解释了如何查询系统上的磁盘、转换磁盘大小和可用空间并识别驱动器类型：\n\
  \n- 1. 你首先通过定义 `measure-diskunit` 函数开始。\n\n本章前面你了解到，此函数用于确定度量单位，并计算该单位中的转换值。你还了解到此函数还利用\
  \ `[System.Math]::Round()` 方法将值四舍五入到两位小数。你还了解到此函数以数组形式向脚本返回两个值。第一个值是转换后的值；第二个值是度量单位。\n\
  \n- 2. 然后你继续查询系统上的本地磁盘，利用 `get-wmiobject` cmdlet 并使用 `win32_logicaldisk` 参数，并将结果设置在\
  \ `$disks` 变量中。你为 `$disks` 变量中的每个 `$disk` 创建一个 `Foreach` 循环。\n\n- 3. 然后你通过调用 `$disk.DeviceID`\
  \ 属性来获取驱动器号并将其存储在 `$driveletter` 变量中。\n\n- 4. 你通过调用 `$disk.FreeSpace` 属性来检索可用空间并将结果存储在\
  \ `$freespace` 变量中。\n\n- 5. 你最后调用 `$disk.Size` 属性并将值存储在 `$size` 变量中。\n\n- 6. 下一步是评估磁盘可用空间或磁盘大小是否小于\
  \ 1。这意味着驱动器已满或驱动器中未加载任何介质。为捕获除零错误，如果可用空间为 0，则将 `$freespace` 值设置为 0。如果大小为 0，则将 `$size`\
  \ 设置为零。\n\n- 7. 接下来你通过使用 `$freespace` 参数利用 `measure-diskunit` 来评估磁盘可用空间的度量单位。函数的计算结果被返回并存储在\
  \ `$freetype` 变量中。由于 `measure-diskunit` 返回的值是一个包含两项的数组，你将第一个值，即 `$freetype[0]`，设置在\
  \ `$convFreeSpc` 变量中。你将第二个值，即 `$freetype[1]`，设置在 `$funit` 变量中。\n\n- 8. 你继续通过使用 `$size`\
  \ 参数利用 `measure-diskunit` 来评估磁盘大小的度量单位。函数的计算结果被返回并存储在 `$sizetype` 变量中。由于 `measure-diskunit`\
  \ 返回的值是一个包含两项的数组，你将第一个值，即 `$sizetype[0]`，设置在 `$convSize` 变量中。你将第二个值，即 `$sizetype[1]`，设置在\
  \ `$sunit` 变量中。\n\n- 9. 最后，你使用之前创建的 switch 根据驱动器类型编号确定驱动器类型。\n\n然后驱动器类型的结果被放入 $type\
  \ 变量以供脚本最终输出使用。在 `Foreach` 循环的最后，你运行 `write-host` cmdlet 来输出该磁盘迭代的 `Drive $driveletter\
  \ | Drive Type: $type | Size: $convsize $sunit | Freespace: $convFreeSpc $funit`\
  \ 结果。执行脚本后，所有磁盘驱动器号、驱动器类型、大小、可用空间以及适当的度量单位都会返回到屏幕上。\n\n## 总结\n\n在本章中，你学习了如何利用 PowerShell\
  \ 与磁盘驱动器交互。你通过学习 `get-disk` cmdlet 开始本章。你继续利用 `get-wmiobject` 和 `win32_logicaldisk`\
  \ 类来查询磁盘信息。然后你创建了一个 `switch` 语句来确定不同的磁盘类型。你还学习了如何将字节转换为兆字节和千兆字节。你创建了一个函数来动态转换为不同的度量单位并将值四舍五入到两位小数。你以创建磁盘信息脚本结束本章，该脚本查询系统上的磁盘、转换磁盘大小和可用空间、计算度量单位并识别驱动器类型。\n\
  \n在下一章中，你将扫描 Windows 功能和系统上安装的软件。\n"
- "# 8 Windows 功能和已安装软件检测\n\n发现系统功能的一部分是确定安装了哪些 Windows 功能和软件标题。在企业环境中，有时很难确定单个系统上安装了什么。虽然你可以手动登录服务器并评估配置，但收集所有服务器信息可能需要很长时间。\n\
  \nWindows 服务器扫描脚本通过各种 cmdlet 使扫描单个 Windows 功能、角色和软件变得容易。你将学习如何扫描注册表和单个可执行文件以获取系统上已安装软件的信息。这使你能够检测在添加/删除程序中可以找到的软件，以及未在添加/删除程序中添加已安装条目的软件。\n\
  \n在本章中，你将：\n\n- 使用 `get-windowsFeature` cmdlet 检索服务器功能和角色\n- 评估 `win32_serverfeature`\
  \ 类以获取旧系统上的功能和角色\n- 将 Windows 功能、角色 ID 和父 ID 与用户友好的名称相关联\n- 了解为什么不应使用 `win32_product`\
  \ 类进行软件发现\n- 利用注册表确定已安装的软件\n- 扫描 `Program Files` 和 `Program Files (x86)` 以获取已安装软件信息\n\
  \n\n\n> 为遵循本章中的示例，建议您在 Windows Server 2012 系统上运行示例。本章中引用的某些 cmdlet 在 PowerShell\
  \ 2.0、工作站操作系统或早于 Server 2008 R2 的操作系统中不可用。\n\n## Windows 功能\n\n当您尝试确定 Windows 服务器的功能时，通常首先通过评估\
  \ Windows 功能和角色开始。PowerShell 有多种方法可在系统上查询服务器功能和角色。get-WindowsFeature cmdlet 可在 Server\
  \ 2008 R2 及更高版本中使用，可提供已安装在系统上的功能和角色的简单显示。get-WindowsFeature cmdlet 具有多个属性，包括 DisplayName\
  \ 属性、Name 属性、Installed 属性、Parent 属性和 InstallState 属性。DisplayName 属性是服务的友好名称。Name\
  \ 属性是 DisplayName 的简短版本。Installed 属性是一个 true 或 false 属性，反映功能是否已安装。InstallState 属性提供有关功能是否已安装、已移除或可供安装的信息。\n\
  \n要查询服务器上已安装的服务器功能，您可以执行以下操作：\n\n```\nget-WindowsFeature | where { $_.Installed\
  \ -eq $true } | Select DisplayName, InstallState, Parent\n```\n\n此输出显示在以下屏幕截图中：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_125_0.png)\n\n在此示例中，您展示如何利用 get-WindowsFeature\
  \ cmdlet 报告已安装的 Windows 功能：\n\n- 1. 您首先调用 get-WindowsFeature cmdlet 并将其通过管道传递给 where\
  \ {$_.Installed -eq $true}。这会选择系统上安装的所有 Windows 功能。然后您将这些结果通过管道传递给 Select cmdlet\
  \ 以收集 DisplayName、InstallState 和 Parent 属性。\n- 2. 执行后，您会看到服务器系统上安装的所有 Windows 功能，包括其\
  \ DisplayName、InstallState 和 Parent 属性。\n\n在早于 Windows Server 2008 R2 的系统上，或安装了\
  \ PowerShell 2.0 的系统上，get-WindowsFeature cmdlet 不可用。相反，您可以利用 Windows 管理规范 (WMI)\
  \ 提供已安装服务器功能的列表。您首先通过调用 get-wmiobject cmdlet 并将 win32_serverfeature 类作为参数。执行后，您只会收到系统上安装的功能。可用属性的数量也仅限于\
  \ ID、Name 和 ParentID。\n\n要在早于 Windows Server 2008 R2 的系统上或安装了 PowerShell 2.0 的系统上查询服务器上已安装的服务器功能，您可以执行以下操作：\n\
  \n```\nget-wmiobject win32_serverfeature | select ID, Name, ParentID\n```\n\n此输出显示在以下屏幕截图中：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_126_0.png)\n\n此示例展示如何通过利用 win32_serverfeature\
  \ 类查询 Windows 功能：\n\n- 1. 您首先使用 get-wmiobject cmdlet 并使用 win32_serverfeature 参数。\n\
  - 2. 然后您将结果通过管道传递给 Select cmdlet，值为 ID、Name 和 ParentID。\n- 3. 执行后，已安装的 Windows 功能将与其\
  \ ID、Name 和 ParentID 属性一起显示。\n\n> 本节利用预填充的 XML 文件进行 Windows 功能 ID 搜索。要获取此文件，您可以从本书的资源页面下载。\n\
  \n当您查询 win32_serverfeature 类时，功能和角色父信息将作为 ID 返回。当您想要确定功能或角色的 ParentID 时，您必须想出替代方法来执行关联。本章中，您将利用本书示例中的预填充\
  \ ServerFeatureIDs.xml 文件将 ID 与其友好名称相关联。ServerFeatureIDs.xml 文件应复制到 c:\\temp\\POSHScript\\\
  \ 目录。\n\n要调用 win32_serverfeature 类、查询具有 ParentID 的功能和角色并通过利用 XML 文件进行关联，您可以执行以下操作：\n\
  \n```\n[xml] $frxml = Get-Content \"C:\\temp\\POSHScript\\ServerFeatureIDs.xml\"\
  \n$featRoleTable = $frxml.GetElementsByTagName(\"feature\")\n$crntFeatures = Get-wmiobject\
  \ win32_serverfeature\nforeach ($feature in $crntFeatures) {\n    $featurename =\
  \ $feature.Name\n    $featureparentID = $feature.ParentID\n    if ($featureparentID)\
  \ {\n        $featureparentName = ($featRoleTable | where { $_.ID -eq $featureparentID}).Name\n\
  \        Write-host \"The $featurename feature has the parentID of $featureparentID.\
  \ Parent Name: $featureparentName.\"\n    }\n}\n```\n\n此输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_128_0.png)\n\
  \n此示例展示如何利用 win32_serverfeature 类查询 Windows 功能和角色，并将它们的 ParentIDs 与友好名称相关联：\n\n\
  - 1. 您首先获取 ServerFeatureIDs.xml 文件中的 XML 内容。这是通过使用 Get-Content cmdlet 并使用 c:\\temp\\\
  POSHScript\\ServerFeatureIDs.xml 参数完成的。\n- 2. 您将结果保存在 $frxml 变量中，强制为 [XML] 数据类型。\n\
  - 3. 然后您从 ServerFeatureIDs.xml 创建关联数据的表。为此，您调用 $frxml 变量并使用 .GetElementsByTagName()\
  \ 方法，并使用 feature 参数。然后关联数据的数组存储在 $featRoleTable 变量中。\n- 4. 然后您继续查询系统上安装的所有功能。\n\
  - 5. 您利用 get-wmiobject cmdlet 并将 win32_serverfeature 类作为参数，并将结果存储在 $crntFeatures\
  \ 变量中。\n- 6. 然后您使用 foreach 循环评估 $crntFeatures 中的每个 $feature。\n- 7. 您收集 $feature.Name\
  \ 属性以将其放入 $featurename 变量中，并将 $feature.ParentID 属性放入 $featureparentID 变量中。\n- 8.\
  \ 为确保仅显示具有父 ID 的功能，您利用 if ($featureparentID) 语句，只有在 $featureparentID 用数据填充时才会继续。如果存在父\
  \ ID，则您通过使用管道搜索 $featRoleTable 数组。您查询 | where { $_.ID -eq $featureparentID }，它将\
  \ $featureparentID 与关联数据中的 ID 匹配，\n- 9. 然后您将整个语句用括号括起来并选择查询结果的 .Name 属性。\n- 10.\
  \ 最后，您利用 `write-host` cmdlet 将内容写入屏幕。`$featurename` 功能的 parentID 为 `$featureparentID`。父名称：`$featureparentName`。执行后，脚本返回系统上的活动功能、功能或角色名称、功能的\
  \ parentID 以及从 parentID 到功能父友好名称的关联。\n\n> 服务器功能和角色名称随着不同版本的 Windows Server 不断发展。如需获取最新的\
  \ Windows 功能和角色 ID 及名称列表，您可以参考以下 MSDN 链接：https://msdn.microsoft.com/en-us/library/cc280268(v=vs.85).aspx。\n\
  \n## 已安装软件检测\n\n检测系统上的软件可能是一项困难的任务。虽然 WMI `win32_product` 类记录了系统上每个 **微软安装程序 (MSI)**\
  \ 安装的软件，但强烈建议您不要使用此类。当您查询 `win32_product` 类时，它会重新配置系统上安装的每个 MSI 软件。这可能会导致意外服务中断，因为应用程序被重新安装、配置被覆盖，并且\
  \ MSI 修复无法成功完成：\n\n![](img/a27a138d6586c10902d8e86ab3384834_129_0.png)\n\n前面的屏幕截图显示了调用\
  \ win32_product 类时生成的多个消息之一。您会看到 Windows 安装程序强制重新配置已安装的软件产品。您还会看到重新配置状态和错误状态消息。如果您不小心使用了\
  \ win32_product 类，您可以扫描事件日志以获取状态消息，并在出现错误时正确重新安装应用程序。\n\n![](img/a27a138d6586c10902d8e86ab3384834_130_0.png)\n\
  \n> 请避免在脚本中使用 win32_product 类。由于 MSI 会对已安装的软件执行修复/重新配置，这将导致环境不稳定。请使用本章中的其他方法来识别系统上安装的软件。\n\
  \n由于 win32_product 类的限制，您需要访问操作系统的多个区域来识别已安装的应用程序。首先要开始的地方是注册表。由于 MSI 和其他软件安装程序将卸载应用程序的逻辑放在注册表中，您可以在\
  \ HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ 和 HKLM:\\Software\\\
  Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\ 注册表项位置中识别已安装的软件。要识别这些软件标题，您必须遍历每个子项并搜索属性：DisplayName。如果键没有\
  \ DisplayName 属性，很可能您需要利用替代方法来发现已安装的软件。\n\n要使用注册表识别已安装的软件，您可以执行以下操作：\n\n```\n$RegLocations\
  \ = \"HKLM:\\Software\\Microsoft\\Windows\\CurrentVersion\\\nUninstall\\*\",\"HKLM:\\\
  Software\\Wow6432Node\\Microsoft\\Windows\\\nCurrentVersion\\Uninstall\\*\"\n\n\
  foreach ($reg in $RegLocations) {\n    $softwareKeys = get-ItemProperty $reg | Select\
  \ DisplayName | Sort DisplayName\n    foreach ($software in $softwareKeys) {\n \
  \       if ($software.DisplayName -ne $null) { Write-host \"Software Found: \" $software.DisplayName\
  \ }\n    }\n}\n```\n\n\n\nThe output of this is shown in the following screenshot:\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_131_0.png)\n\nThis example displays how\
  \ to identify installed software by leveraging the Uninstall registry keys:\n\n\
  - 1. You first start by declaring both the standard registry location of `HKLM:\\\
  Software\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*` and the WOW6432Node\
  \ location of `HKLM:\\Software\\Wow6432Node\\Microsoft\\Windows\\CurrentVersion\\\
  Uninstall\\*`, and placing it into the `$regLocations` array.\n- 2. You continue\
  \ to create a `foreach` loop to evaluate each `$reg` key in `$RegLocations`.\n-\
  \ 3. To get the sub-keys of both registry locations, you leverage the `get-ItemProperty`\
  \ cmdlet with the current `$reg` key.\n- 4. You pipe that value to select the `DisplayName`\
  \ property, and pipe those results to sort by `DisplayName`.\n- 5. You then place\
  \ the result of this in the `$softwarekeys` variable.\n- 6. After gathering all\
  \ of the sub-keys, you leverage a `foreach` loop to examine each `$software` in\
  \ `$softwarekeys`.\n- 7. You create an If statement to ensure that the $software.DisplayName\
  \ is not equal to blank or $null.\n- 8. You then use the write-host cmdlet with\
  \ Software Found: $software.Displayname. When you execute this command, the script\
  \ will look at both registry locations, gather the sub-keys, select DisplayName\
  \ properties that are not blank, and output the values on the screen.\n\n## Scanning\
  \ executables in \\Program Files\n\nWhen you are scripting, there will be additional\
  \ applications that do not place Uninstall data in the registry. For these applications,\
  \ you may be able to find them by evaluating the executables in the Program Files\
  \ and Program Files (X86) directories. To create a dynamic script, you will need\
  \ to evaluate all of the logical drives for the Program Files directories, and scan\
  \ the subdirectories for files ending in .exe. You can then evaluate the individual\
  \ files, leveraging the get-itemproperty cmdlet, and reveal the ProductName and\
  \ ProductVersion executables' properties. You may also pipe the results from the\
  \ get-itemproperty cmdlet to get-member to access extended properties about the\
  \ executable.\n\n> Scanning Program Files requires a PowerShell window running with\
  \ elevated privileges. You will need to open PowerShell with the Run as Administrator\
  \ parameter.\n\nTo evaluate the Program Files and Program Files (x86) directories\
  \ for .exe files, and retrieve their extended properties, you can do the following:\n\
  \n```\n$progpaths = \"\\Program Files\\\",\"\\Program Files (x86)\\\"\n$disks =\
  \ (Get-WmiObject win32_logicaldisk | where {$_.DriveType -eq \"3\"}).DeviceID\n\
  foreach ($disk in $disks) {\n    foreach ($progpath in $progpaths) {\n        $progfile\
  \ = $disk + $progpath\n        $test = test-path $progfile\n        if ($test) {\n\
  \            $files = Get-ChildItem -file $progfile -Recurse | where {$_.FullName\
  \ -like \"*.exe\"} | Select Fullname\n            foreach ($file in $files) {\n\
  \                $productName = (get-itemproperty $file.FullName).VersionInfo.ProductName\n\
  \                if (!$productName) { $productName = \"Product Name n/a\" }\n  \
  \              $productVersion = (get-itemproperty $file.FullName).VersionInfo.ProductVersion\n\
  \                if (!$productVersion) { $productVersion = \"Product Version n/a\"\
  }\n                Write-host $file.Fullname \" | Name: $productName | Version:\
  \ $productVersion\"\n            }\n        }\n    }\n}\n```\n\nThe output of this\
  \ is shown in the following screenshot:\n\n![](img/a27a138d6586c10902d8e86ab3384834_133_0.png)\n\
  \nIn this example, you learned how to evaluate the Program Files directories for\
  \ .exe files, and retrieve their extended properties:\n\n- 1. To start the script,\
  \ you begin by declaring the \\Program Files\\ and \\Program Files (x86)\\ strings\
  \ in the $progpaths array. These strings are used to build dynamic paths for all\
  \ of the local drives on the system.\n- 2. Next, you gather the local drive letters\
  \ by using the get-wmiobject cmdlet with the win32_logicaldisk class.\n- 3. You\
  \ filter the data by piping the result to where {$_.DriveType -eq \"3\"}, or where\
  \ the drive is equal to a local disk.\n- 4. You then set the entire statement in\
  \ parentheses and set the DeviceID property of each disk in the $disks variable.\
  \ The $disks variable will now contain all of the drive letters of the local disks\
  \ on the system.\n- 5. You then create a foreach loop to query each $disk drive\
  \ letter in the $disks variable.\n- 6. You create a second foreach loop to dynamically\
  \ build the \\Program Files\\ and \\Program Files (x86)\\ directories for each drive\
  \ letter. Within the second foreach loop, you build the drive letter by combining\
  \ the current $disk and the current $progpath and set the result to the $progfile\
  \ variable.\n\nTo verify that the directory exists, you leverage the test-path cmdlet\
  \ with the $progfile argument. If the directory exists, the script continues to\
  \ gather all of the executable files in that directory. This is done by leveraging\
  \ the get-childitem cmdlet with the -file parameter, the $progfile argument, and\
  \ the -recurse parameter:\n\n- 1. You then filter the returned list by piping the\
  \ result to where {$_.Fullname -like \"*.exe\"}.\n- 2. You finally pipe this result\
  \ to select FullName, to only return the FullName property of each file, and set\
  \ the individual files in the $files variable.\n- 3. To dig deeper into the individual\
  \ file for extended attributes, you create a third foreach loop to query each $file\
  \ in the $files variable.\n- 4. You gather the ProductName attribute by leveraging\
  \ the get-itemproperty cmdlet with the $file.Fullname argument.\n- 5. You embrace\
  \ the statement in parentheses and leverage dot notation to access the extended\
  \ attributes of .VersionInfo.ProductName for that file.\n- 6. You then set the ProductName\
  \ property result in the $productName variable. In the instance that the ProductName\
  \ property is not defined for an executable, you create an If statement of !$productname,\
  \ where $productname is not TRUE. The script will set the $productname variable\
  \ to Product Name n/a.\n- 7. You then gather the ProductVersion attribute by leveraging\
  \ the get-itemproperty cmdlet with the $file.Fullname argument.\n- 8. You embrace\
  \ the statement in parentheses and leverage dot notation to access the extended\
  \ attributes of .VersionInfo.ProductVersion for that file.\n- 9. You then set the\
  \ ProductVersion property result in the $productVersion variable. In the instance\
  \ that the ProductVersion property is not defined for an executable, you create\
  \ an If statement of !$productVersion, where $productVersion is not TRUE. The script\
  \ will set the $productVersion variable to Product Version n/a.\n- 10. Finally,\
  \ you print the result to the screen by leveraging the write-host cmdlet with $file.Fullname\
  \ | Name: $productName | Version: $productVersion.\n\nAfter executing this script,\
  \ PowerShell will scan the system for drive letters; for each drive on the system\
  \ it will look for the `Program Files` and `Program Files (x86)` directories. If\
  \ a drive contains one or both of those folders, it will evaluate the individual\
  \ files in those directories whose extension matches `.exe`. It will continue to\
  \ dig into the extended properties for those executables to retrieve their `ProductNames`,\
  \ and `ProductVersions`. It will print all of the file information to the screen,\
  \ successfully scanning all of the Program Files directories for installed software.\n\
  \n## Summary\n\nIn this chapter, you learned how to get Windows features with the\
  \ `get-windowsFeature` cmdlet. You then learned how to use the `win32_serverfeature`\
  \ to retrieve Windows features on legacy systems. You also leveraged an XML file\
  \ to correlate feature, role, and parent IDs from the `win32_serverfeature` class\
  \ to user-friendly names. You proceeded to evaluate why `win32_product` should not\
  \ be used in scripts. You then leveraged the registry to discover installed software.\
  \ Finally, you learned how to scan the `Program Files` and `Program Files (x86)`\
  \ directories for executables and extended properties for software identification.\n\
  \nIn the next chapter, you will learn a method for scanning a folder structure for\
  \ files that contain specific strings.\n\n\n\n"
- "# 9 文件扫描\n\n当你在评估环境中的系统时，可能需要扫描文件以查找特定内容。Windows 服务器扫描脚本使你能够搜索目录中包含特定字符串的文件。常见字符串可能包括错误消息、明文密码，甚至是主机名和\
  \ IP 地址等特定服务器信息。扫描系统以查找特定内容的能力是一项极其强大的工具，可以揭示有关系统的诸多信息。\n\n扫描系统时，出现大量并非所需的结果是很常见的，这也被称为误报。本章将探讨如何通过将搜索范围缩小到特定文件类型来减少误报数量。它还将解释如何从搜索中排除文件，以帮助你获取所需的数据。\n\
  \n在本章中，你将：\n\n-   了解如何获取子目录及其内容\n-   将文件发现过程限制为特定文件类型\n-   高效地在文件中搜索字符串并确定其位置\n\
  -   学习如何处理超过 248 个字符的长路径和权限问题导致的错误\n-   排除搜索中的误报文件\n\n### 文件扫描\n\n文件扫描是企业环境中的一项重要活动。无论是为了识别凭据的使用位置、敏感信息的使用，还是服务器配置信息，你都需要一种快速高效地扫描文件数据的技术。PowerShell\
  \ 原生具有从明文文件收集数据并解析信息的能力。最常见的明文文件包括但不限于文本文件、日志文件、XML 文件、配置文件和脚本文件。\n\n在开发扫描函数时，你需要扫描目录中的特定文件类型以及文件本身的内容。要扫描特定文件类型，可以使用文件夹路径作为参数利用\
  \ Get-ChildItem cmdlet。你还使用 -Include 参数并指定要搜索的通配符文件扩展名。对于日志和文本文件，通配符文件扩展名分别看起来像\
  \ *.log 和 *.txt。如果要扫描多个扩展名，可以在每个要搜索的文件扩展名之间放置逗号。如果要扫描子目录中的文件类型，可以包含 -Recurse 参数以递归遍历子目录。\n\
  \n要扫描 Program Files 目录及其子目录中的 *.log 和 *.txt 文件，可以执行以下操作：\n\n```\nGet-ChildItem \"\
  c:\\Program Files\\\" -Include *.log,*.txt -recurse\n```\n\n以下屏幕截图显示了此操作的输出：\n\n\
  ![](img/a27a138d6586c10902d8e86ab3384834_137_0.png)\n\n此示例演示如何扫描 Program Files 目录中的\
  \ .log 和 .txt 文件类型。你首先使用 C:\\Program Files\\ 参数调用 Get-ChildItem cmdlet。你还使用 *.log,*.txt\
  \ 参数利用 -Include 参数来扫描 .log 和 .txt 文件。最后，你利用 -recurse 参数来扫描 C:\\Program Files\\ 的子目录。执行后，PowerShell\
  \ 脚本将显示 C:\\Program Files\\ 目录中的所有 .log 文件和 .txt 文件。\n\n要扫描文件内部的特定内容，需要获取文件内容并将其放入内存。为此，可以使用要扫描的文件路径作为参数利用\
  \ get-content cmdlet。然后将结果放入变量中进行评估。要扫描文件内容，可以利用 select-string cmdlet，它允许将内容字符串与正则表达式匹配。你首先定义\
  \ select-string cmdlet，然后跟上带有文件参数的 -path 参数。然后使用正则表达式作为参数调用 -pattern 参数。要搜索字面字符串，可以使用字符串作为参数的\
  \ -pattern 参数，并利用 -SimpleMatch 参数来匹配特定字符串。\n\n你也可以选择在管道后利用 select-string cmdlet。要扫描文件内部的特定内容，可以将\
  \ Get-ChildItem cmdlet 的文件名结果通过管道传递给 select-string cmdlet。然后 select-string cmdlet\
  \ 将对各个文件进行字符串模式评估。这避免了使用 foreach 循环查询各个文件的需要，并且每个文件在由 Get-ChildItem cmdlet 返回时都会被评估。\n\
  \nselect-string cmdlet 的另一个独特功能是它还会返回文件中匹配的行号，以及找到各个结果时匹配内容的整行。你可以调用 Line 属性返回整行，并调用\
  \ LineNumber 属性返回行号。你还可以调用 FileName 属性返回找到条件的特定文件。\n\n要搜索 Program Files 中的 .log\
  \ 和 .txt 文件并扫描其中的字符串，可以执行以下操作：\n\n```\n$matches = Get-ChildItem \"c:\\Program Files\\\
  \" -Include *.log,*.txt -recurse\n| select-string -pattern \"Complete\" -SimpleMatch\n\
  foreach ($match in $matches) {\n    Write-Host \"Filename: \" $match.FileName\n\
  \    Write-Host \"Line Number: \" $match.LineNumber\n    Write-Host \"Line Contents:\
  \ \" $match.Line\n}\n```\n\n以下屏幕截图显示了此操作的输出：\n\n![](img/a27a138d6586c10902d8e86ab3384834_139_0.png)\n\
  \n此示例演示如何扫描 Program Files 目录中的 .log 和 .txt 文件，并搜索文件中的字符串 \"Complete\"。你首先使用 c:\\\
  Program Files\\ 参数调用 Get-ChildItem cmdlet。你还将 -Include 参数设置为 *.log,*.txt 参数，并使用\
  \ -recurse 参数搜索子目录。然后将结果通过管道传递给 select-string cmdlet，并将 -pattern 参数设置为 \"Complete\"\
  \ 字符串作为参数。然后发出 -SimpleMatch 参数以对该字符串执行简单搜索。这些命令的输出随后存储在 $matches 变量中。\n\n然后继续利用\
  \ foreach 循环评估 $matches 中的每个 $match。然后利用 Write-Host cmdlet 显示 \"FileName:\" 以及 $match\
  \ 变量的 .FileName 属性。你还使用 Write-Host cmdlet 显示 \"Line Number:\" 以及 $match 变量的 .LineNumber\
  \ 属性。最后，你使用 Write-Host cmdlet 显示 \"Line Contents:\" 以及 $match 变量的 .Line 属性。\n\n\
  执行后，脚本将已扫描 c:\\Program Files\\ 目录中的 .log 和 .txt 文件。当识别出正确文件类型的文件时，脚本将评估该文件是否包含 \"\
  Complete\" 字符串。如果找到该字符串，脚本将继续提供各个文件中的文件名、行号和该行的内容。\n\n### 排除长路径\n\n在企业文件服务器中，你可能会遇到文件夹结构和文件字符数超过\
  \ 248 个字符的情况。Windows 默认将长文件路径的使用限制为 248 个字符长度。拥有基于 Linux 的文件服务器或映射网络驱动器，其文件路径超过\
  \ 248 个字符限制的情况并不少见。\n\nPowerShell 与 Windows 操作系统具有相同的路径限制。所有 PowerShell cmdlet 在查询文件夹路径长于\
  \ 248 个字符的文件系统时都会出现问题。有一些程序例如 robocopy.exe 可以用来显示长于 248 个字符的文件和文件夹的完整路径。虽然你有返回长路径的能力，但仍无法使用\
  \ PowerShell cmdlet 与该目录中的任何文件进行交互。此外，与 Get-ChildItem cmdlet 相比，robocopy.exe 速度非常慢，并且需要在其上运行的系统上具有管理员备份权限。\n\
  \n这使你与长文件和文件夹路径交互的选项变得有限。因此，建议你在脚本中处理文件路径并访问错误消息。使用 Get-ChildItem cmdlet 处理错误是通过使用\
  \ -ErrorAction 和 -ErrorVariable 参数完成的。然而，与其为错误创建单个变量，你需要将错误放在数组中。这是因为 Get-ChildItem\
  \ cmdlet 会获取指定路径中的所有文件和目录，即使它存在访问问题或由于路径长度无法访问该路径。如果你只使用一个变量，错误变量中唯一的错误将是最后发生的那个。相反，为了规避这个问题，你可以利用\
  \ $errors = @() 定义一个数组，并将 $errors 用作 -ErrorVariable 的参数。这告诉 PowerShell 在发生错误时向 $errors\
  \ 数组添加一个额外项。\n\n> 要执行以下示例，你需要在系统上创建一个名为 \"Brenton\" 的本地用户。或者，你可以将反映 \"$env:computername\\\
  Brenton\" 的行更新为你想要的任何用户名。\n\n要创建超过 248 个字符的共享目录结构，收集文件和目录信息并捕获错误，可以执行以下操作：\n\n```\n\
  # Create Folder Structure to Scan\n$userdrive = \"c:\\Temp\\POSHScript\\Chapter9Examples\\\
  CompanyXYZ\\Milwaukee\\InformationTechnologyDepartment\\UserHomeDrives\\UserLoginID\\\
  \"\nnew-item $userdrive -ItemType Directory -Force\n$domainuser = \"$env:computername\\\
  Brenton\"\nNew-SmbShare -name \"UserData\" -Path $userdrive -FullAccess $domainuser\n\
  New-PSDrive -Name H -root \"\\\\$env:computername\\Userdata\" -Persist -PSProvider\
  \ FileSystem\ncd H:\n$userFolder = \"Information Technology Department\\All Company\
  \ Software\\ISO\\Microsoft\\Microsoft SQL Server 2012 R2\\SQL Server Update Patches\\\
  Service Pack 3\\Cumulative Update 7\\AutomatedWindowsInstaller\\\"\n```\n\n\n\n\
  ```\nnew-item $userFolder -ItemType Directory -Force\n```\n\n## 扫描文件夹结构\n$directory\
  \ = \"c:\\Temp\\POSHScript\\Chapter9Examples\\CompanyXYZ\\\"\n$errors = @()\nget-childitem\
  \ $directory -recurse -ErrorActionSilentlyContinue -ErrorVariable +errors\nif ($errors)\
  \ {\nforeach ($err in $errors) {\nif ($err.Exception -like \"*Could not find a part\
  \ of the path*\") {\n    $filepath = ($err.Exception).ToString().split(\"'\")[1]\n\
  \    Write-Host \"Error Accessing Path: \"$filepath\" may be over 248 Characters.\"\
  \n}\nif ($err.Exception -like \"*is denied.*\") {\n    $filepath = ($err.Exception).ToString().split(\"\
  '\")[1]\n    Write-Host \"Error Accessing Path: \"$filepath\" Access Is Denied.\"\
  \n}\n}\n}\n\n## 移除映射驱动器和共享\ncd c:\nRemove-PSDrive -Name H -Force\nRemove-SmbShare\
  \ -name \"UserData\" -Force\n\n此输出显示在以下屏幕截图中：\n\n![](img/a27a138d6586c10902d8e86ab3384834_141_0.png)\n\
  \n此示例展示了如何在捕获访问被拒绝和长文件路径错误的同时，正确地查询系统以获取文件和文件夹信息：\n\n- 1. 你首先通过创建所需的文件夹结构开始。由于无法创建超过\
  \ 248 个字符长的文件夹结构，你创建一组较小的目录，共享这些目录，将驱动器映射到该目录路径，并使用映射的驱动器位置创建额外的文件夹。其输出是一个超过 248\
  \ 个字符的目录结构。\n- 2. 要创建第一个目录结构，你定义字符串 \"C:\\Temp\\POSHScript\\Chapter9Examples\\CompanyXYZ\\\
  Milwaukee\\InformationTechnologyDepartment\\UserHomeDrives\\UserLoginID\\\" 并将其设置为\
  \ $userdrive 变量。\n- 3. 然后你利用 new-item cmdlet 以 $userdrive 变量作为参数，-ItemType 参数值为\
  \ Directory，以及 -Force 参数。这会创建第一个目录结构。\n- 4. 要创建目录共享，你必须指定共享将与之共享的凭据。你指定 $env:computername\
  \ 来表示计算机名称，后跟反斜杠、Brenton 用户，并将值放在 $domainuser 变量中。\n- 5. 你通过利用 New-SmbShare cmdlet\
  \ 将此目录结构共享，其 -name 参数设置为 \"UserData\"。你还包含 -Path 参数并指定 $userdrive 参数，以及 -FullAccess\
  \ 参数并使用 $domainuser 参数。\n\n执行后，\"c:\\Temp\\POSHScript\\Chapter9Examples\\CompanyXYZ\\\
  Milwaukee\\InformationTechnologyDepartment\\UserHomeDrives\\UserLoginID\\\" 在系统上共享，可以通过\
  \ UNC 路径 \\\\computername\\Userdata 访问。\n\n- 6. 然后你继续通过利用 New-PSDrive cmdlet 映射\
  \ H 驱动器，-Name 参数为 H 作为参数。然后你指定 -root 参数并指定 \\\\\\$env:computername\\Userdata 作为参数。你还包含\
  \ -Persist 参数以使映射持久化，以及 -PSProvider 参数设置为 FileSystem。执行后，你将 H:\\ 驱动器映射到 \\\\computername\\\
  Userdata。\n- 7. 然后你使用 cd H: 发出对 H: 驱动器的目录更改并继续构建目录结构。\n- 8. 你构建字符串 \"Information\
  \ Technology Department\\All Company Software\\ISO\\Microsoft\\Microsoft SQL Server\
  \ 2012 R2\\SQL Server Update Patches\\Service Pack 3\\Cumulative Update 7\\AutomatedWindowsInstaller\\\
  \" 并将其放在 $userFolder 变量中。\n- 9. 然后你利用 new-item cmdlet 以 $userFolder 作为参数，-ItemType\
  \ 参数值为 Directory，以及 -Force 参数。\n\n这会在 H: 驱动器中创建第二组目录。然后你继续扫描文件夹结构。\n\n- 10. 你首先通过定义要在\
  \ C:\\Temp\\POSHScript\\Chapter9Examples\\CompanyXYZ\\ 中扫描的目录并将其设置为 $directory 变量开始。\n\
  - 11. 然后你通过将其设置为 @() 的值来定义 $errors 数组。\n- 12. 你利用 Get-ChildItem cmdlet 使用 $directory\
  \ 参数和 -recurse 参数扫描 C:\\Temp\\POSHScript\\Chapter9Examples\\CompanyXYZ\\ 目录及其子目录。你利用\
  \ -ErrorAction 参数值为 SilentlyContinue 以及 -ErrorVariable 参数值为 +errors。这为一系列错误消息启用了累加操作，因为它们会发生到\
  \ $errors 数组中。\n- 13. Get-ChildItem cmdlet 完成后，你评估 $errors 变量以确定其中是否有任何值。\n- 14.\
  \ 由于你创建了一个超过 248 个字符的文件夹结构，$errors 变量中将有数据，导致 if 语句评估为 $true。\n- 15. 然后脚本继续执行 foreach\
  \ 循环以评估 $errors 数组中的每个 $err。\n- 16. 然后脚本执行 if 语句以确定 $err.Exception 属性是否类似于 \"*Could\
  \ not find a part of the path*\"。如果 Get-ChildItem 知道路径存在但无法进一步遍历目录，则会指定此特定错误消息。这表明文件路径长于\
  \ 248 个字符。\n- 17. 如果评估为 true，脚本将获取 $err.Exception 属性并将异常转换为字符串。\n- 18. 你评估字符串以按撇号字符将其拆分。\n\
  - 19. 你指定 [1] 以选择第二个值，即文件名，并将其设置为 $filepath 变量。\n- 20. 你利用 Write-Host cmdlet 使用字符串\
  \ \"Error Accessing Path:\"\"$filepath\"\" may be over 248 Characters\"。\n- 21.\
  \ 如果 $errors 变量中的此特定 $err 匹配，它将在屏幕上显示适当的 message。你继续进行对 $errors 变量的第二次评估。\n- 22.\
  \ 在此评估期间，你确定 $err.Exception 属性是否类似于 \"*is denied.*\"。这会捕获系统上可能发生的访问被拒绝错误消息。\n- 23.\
  \ 如果评估为 true，脚本将获取 $err.Exception 属性并将异常转换为字符串。\n- 24. 你评估字符串以按撇号字符将其拆分。\n- 25.\
  \ 你指定 [1] 以选择第二个值，即文件名，并将其设置为 $filepath 变量。\n- 26. 你利用 Write-Host cmdlet 使用字符串 \"\
  Error Accessing Path: \"$filepath\" Access Is Denied.\"。\n- 27. 如果 $errors 变量中的此特定\
  \ $err 匹配，它将在屏幕上显示适当的 message。\n最终步骤是脚本的清理部分。\n- 28. 为了清理脚本，你执行 cd c: 将目录更改回 c:\
  \ 驱动器。\n- 29. 你通过利用 Remove-PSDrive cmdlet 将 H 驱动器断开连接，-name 参数设置为 H 且 -Force 参数。\n\
  - 30. 你关闭 SMB 共享，利用 Remove-SmbShare cmdlet 将 -name 参数设置为 \"UserData\" 且 -Force 参数。\n\
  \n如果此脚本在服务器文件共享上执行，Get-ChildItem cmdlet 将报告 $directory 变量中的所有文件和目录。它还将打印到屏幕上，如果有任何目录长于\
  \ 248 个字符，以及文件夹结构上是否生成任何访问被拒绝错误消息。\n\n## 排除文件\n\n当你在环境中执行扫描时，你最终希望过滤掉一些误报。这在你利用模板构建系统时尤其正确，因为可能会检测到大量共同点。你可能还希望过滤掉已知安全的非常大的文件以优化扫描持续时间。\n\
  \nGet-ChildItem cmdlet 包含 -exclude 参数，它使你能够指定要排除的对象字符串。-exclude 参数还支持用逗号分隔的多个值以及使用星号字符的通配符。首先，你指定\
  \ Get-ChildItem cmdlet 并以要扫描的目录作为参数。然后你提供 -exclude 参数并以文件作为其参数。当 Get-ChildItem cmdlet\
  \ 执行时，它将过滤掉指定为 -exclude 参数参数的那些项。\n\n\n\n\n为了创建一个函数来扫描系统中 .xml 和 .txt 文件中是否包含单词\
  \ \"Complete\"，先不使用排除项，再使用排除项，可以执行以下操作：\n\n```\nfunction scan-directory { param($directory)\n\
  \    $errors = @()\n    $content = get-childitem $directory -Include $include -Exclude\
  \ $exclude -recurse -ErrorActionSilentlyContinue -ErrorVariable +errors | select-string\
  \ -Pattern $findword -SimpleMatch -ErrorActionSilentlyContinue\n    if ($errors)\
  \ {\n        foreach ($err in $errors) {\n            if ($err.Exception -like \"\
  *Could not find a part of the path*\") {\n                $filepath = ($err.Exception).ToString().split(\"\
  \ \")[1]\n                Write-Host \"Error Accessing Path: ~\"$filepath\"~ may\
  \ be over 248 Characters.\"\n            }\n            if ($err.Exception -like\
  \ \"*is denied.*\") {\n                $filepath = ($err.Exception).ToString().split(\"\
  \ \")[1]\n                Write-Host \"Error Accessing Path: ~\"$filepath\"~ Access\
  \ Is Denied.\"\n            }\n        }\n    }\n    foreach ($match in $content)\
  \ {\n        Write-Host \"Filename: \" ($match.FileName).Trim()\n        Write-Host\
  \ \"Line Number: \" $match.LineNumber\n        Write-Host \"Line Contents: \" ($match.Line).Trim()\n\
  \    }\n}\n```\n\n$include = \"*.xml\",\"*.txt\"\n$exclude = \"\"\n$findword = \"\
  Complete\"\nscan-directory \"c:\\Windows\\System32\\\"\n\n$include = \"*.xml\",\"\
  *.txt\"\n\n```\n$exclude = \"*hppc13-pipelineconfig.xml*\", \"Cleanup.xml\"\n$findword\
  \ = \"Complete\"\nscan-directory \"c:\\Windows\\System32\\\"\n```\n\n以下截图显示了此操作的输出：\n\
  \n![](img/a27a138d6586c10902d8e86ab3384834_146_0.png)\n\n此示例展示了如何扫描目录结构中 .xml 和\
  \ .txt 文件以查找单词 \"Complete\"。它还展示了如何成功排除扫描函数返回的结果：\n\n- 1. 你首先通过创建名为 `scan-directory`\
  \ 的函数开始。\n- 2. 你创建一个参数块，将第一个参数设为 `$directory`。\n- 3. 为了启动函数，你通过将 `$errors` 设为 `@()`\
  \ 来声明 `$errors` 数组。\n- 4. 你使用 `$directory` 参数调用 `Get-ChildItem` cmdlet，使用 `$include`\
  \ 参数的 `-Include` 参数，以及使用 `$exclude` 参数的 `-exclude` 参数。\n- 5. 你继续包含用于子目录扫描的 `-recurse`\
  \ 参数，将 `-ErrorAction` 参数设为 `SilentlyContinue` 参数，并将 `-ErrorVariable` 设为 `+errors`\
  \ 加法运算符。\n- 6. 然后 `Get-ChildItem` cmdlet 语句被管道传输到 `select-string` cmdlet，使用 `$findword`\
  \ 参数、`-SimpleMatch` 参数以及 `SilentlyContinue` 的 `-ErrorAction`。\n- 7. 此部分将查询 $directory\
  \ 位置及其子目录中 $include 中指定的文件类型，排除 $exclude 中的文件，并选择具有 -Simplematch $findword 的字符串。\n\
  - 8. -ErrorAction 应用于 select-string cmdlet，以抑制无法访问的文件和文件夹或长度超过 248 个字符的错误。\n- 9.\
  \ 这些错误已通过 Get-ChildItem cmdlet 添加到 $errors 变量中。\n- 10. 此命令的结果随后存储在 $content 变量中。\n\
  - 11. 在 Get-ChildItem cmdlet 完成后，你评估 $errors 变量以确定其中是否有任何值。\n- 12. 由于你创建了一个长度超过\
  \ 248 个字符的文件夹结构，$errors 变量中将有数据，导致 if 语句求值为 $true。然后脚本继续执行 foreach 循环以评估 $errors\
  \ 数组中的每个 $err。\n- 13. 然后脚本执行一个 if 语句，以确定 $err.Exception 属性是否类似于 \"*Could not find\
  \ a part of the path*\"。\n- 14. 如果此求值为 true，脚本将获取 $err.Exception 属性并将 Exception\
  \ 转换为字符串。\n- 15. 你评估字符串以按撇号字符将其拆分。\n- 16. 你指定 [1] 来选择第二个值，即文件名，并将其设为 $filepath 变量。\n\
