  \ True 或 False。如果值为 True，则相应的函数将执行。\n\n脚本的最后一步要求您拥有一个名为 csvFiles 的共享本地文件夹。脚本将在执行后将日志文件和\
  \ CSV 文件复制到 \\\\localhost\\csvFiles。要标记脚本的结束并将日志文件和 CSV 文件复制到 UNC 路径，您可以执行以下操作：\n\
  \n```\n$date = (Get-Date -format \"yyyyMMddmmss\")\nlog \"Windows Server Scanning\
