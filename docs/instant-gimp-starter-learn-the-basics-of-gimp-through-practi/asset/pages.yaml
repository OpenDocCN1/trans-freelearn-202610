- pgno: 11
  md: '# Instant GIMP Starter


    Welcome to *Instant GIMP Starter*. This book is written to provide motivation
    for anyone to start using GIMP. Readers will be exposed to the features of GIMP,
    which will be enough for them to start using the tool. Each topic in this book
    will get the reader into the action of creating various wonderful works of art.
    Along the way, readers are also introduced to the new techniques and tools within
    GIMP.


    The documentation contains the following sections:


    *So, what is GIMP?* introduces GIMP and its features to the reader.


    *Installation* explains to the reader how to start using it.


    *Quick start – A tour around GIMP* enables the user to get familiarized with the
    basic concept of using GIMP.


    *Top 5 features you''ll want to know about* draws the reader into action on how
    to work with GIMP and start getting creative.


    *People and places you should get to know* provides guidelines to the reader on
    discovering various resources that could help and also get them inspired.'
  merge: -1
  img_proc: true
- pgno: 12
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 13
  md: '# So, what is GIMP?


    GIMP stands for GNU Image Manipulation Program. It is an open source program that
    users can use to retouch images and also create their own drawings; it is a complete
    painting tool.


    Remember a picture where you wished that you could crop out unnecessary object
    that spoils the whole picture? Now you can do exactly that, or even better make
    that picture your piece of memory with beautiful effects.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_13_0.png)


    Throughout the book, I will use GIMP Version 2.8.2, installed on Windows 7. GIMP
    is available for Windows, Linux, or Mac machines; all of these are free.


    The user experience should be equivalent between Windows, Linux machine, and Mac.
    I often take pictures with my digital camera or my phone. When I come home, I
    just plug the device into my Linux machine and transfer my pictures to the USB
    drive. I might use it on my Linux machine to retouch pictures or work on some
    designs and later bring the USB drive to my personal laptop to continue working
    on it. GIMP enables you to bring your work around without any problem.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'I even use GIMP at work. I don''t have to worry about licensing or service
    subscriptions. You may read them at http://www.gimp.org/about/COPYING. What makes
    GIMP so usable is that I can perform certain tasks faster. I work with lots of
    images to be inserted into websites or documents. I have experienced working with
    thousands of images that need to be edited before submission. At times like these,
    there is no room for trial and error. GIMP allows us to perform scripts (known
    as Script-Fu) by which I can do a 5-minute job in a matter of seconds. I will
    tell more about this later in this book.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_14_0.png)


    GIMP is also available as a portable app, where you can copy data into an USB
    drive and open it in any Windows machine without installing it. This book, however,
    does not cover the portable app.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Installation


    In a few easy steps, you can install GIMP and get it set up on your system.


    # Step 1 – what do I need?


    Before you install GIMP, you will need to check whether you have all of the required
    elements, as listed in the following items:


    +   ♦ 256 MB of minimum memory is needed, though 1 GB is recommended for smoother
    work

    +   ♦ Disk space of minimum 100 MB

    +   ♦ For a Linux machine, GIMP requires an X Window System running on the machine


    While we''re on the subject, in the following screenshot, there is the one and
    only step shown to get GIMP installed on Ubuntu:


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_15_0.png)


    Open up terminal and issue the following command:


    ```

    sudo apt-get install gimp

    ```


    # Step 2 – downloading GIMP


    The easiest way to download GIMP is from http://www.gimp.org/downloads/. There
    is a link to the latest version of Windows Installer on the website.'
  merge: -1
  img_proc: true
