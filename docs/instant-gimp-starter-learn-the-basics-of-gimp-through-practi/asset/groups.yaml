  mdcn: '

    13. 让我们绘制速度表指针的导向线；我们只需要找到圆的中心。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_47_0.png)


    14. 创建一个指向零的指针，并根据动物颜色对其进行着色。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_47_1.png)


    15. 现在旋转指针以显示动物的速度。之后立即添加投影。点击 Filters | Light and Shadow | Drop Shadow 添加投影。


    > 顺便说一下：

    > 如何计算指针的旋转角度？考虑以下数值。

    > 大象的速度 = 25

    > 完整象限指示 = 120

    > 这使得旋转：25/120 × 360° = 75°


    结果显示在以下截图中：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_48_0.png)


    整体图片将如下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_49_0.png)


    16. 现在我们要为动物创建高度指示器。为此，我们将使用铅笔工具创建一条直线。


    17. 在某一点单击，按住 Shift 键，它将形成一条直线。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_50_0.png)


    18. 添加文字以明确每个图像代表动物的高度和速度。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_51_0.png)


    19. 发挥你的创意，为彩色编码的动物制作标题和图例，如以下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_52_0.png)


    20. 最后，信息图表完成，如以下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_53_0.png)


    ## 合并多张图片


    本节我们将学习如何制作由多张图片组成的一张图片。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_54_0.png)


    为此，请按照以下步骤操作：


    - 1. 首先，我们选择一张图片并将其作为图层打开，如以下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_54_1.png)


    我选择的图片如下：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_55_0.png)


    2. 为图片添加 alpha 通道，使其显示透明度，如以下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_55_1.png)


    - 3. 使用魔术棒选择天空。

    - 4. 将其剪切并粘贴为新图层。

    - 5. 将图层向后移动，使其位于后面。


    先放下这张图片；我们正在研究在背景上绘制怪物。我在我的素描本上画了一张怪物的图片并扫描了它。因此，我可以使用 GIMP 打开它。我们可以使用阈值设置使轮廓更清晰。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_56_0.png)


    要在背景上绘制图片，请按照以下步骤操作：


    - 1. 使用按颜色选择来选择怪物的轮廓。

    - 2. 清理图片并删除背景，这样我们只能得到怪物。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_57_0.png)


    3. 复制怪物并将其粘贴到我们之前正在处理的图片上。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_57_1.png)


    4. 锚定图层，并调整图层使怪物落在景色的后面。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_58_0.png)


    5. 下一步是创建火焰。为此，创建一个新图层，并选择怪物嘴附近图层的一部分。用渐变填充选区，如以下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_58_1.png)


    6. 取消选择矩形，并选择图层更大的部分。


    7. 进入 Filters | Distorts | IWarp 将火焰塑形为渐变。模糊向上指向的渐变。使用 Swirl CCW 或 Swirl CW 选项创建猛烈火焰的美丽效果。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_59_0.png)


    8. 然后点击 Move 单选按钮，如以下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_59_1.png)


    9. 现在我们有了喷火怪物，尝试进行一些调整，使火焰倾斜到头部的位置。使用 Move Tool 和 Rotate Tool 选项来执行此操作。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_60_0.png)


    现在让我们为怪物上色。为此，请按照以下步骤操作：


    - 1. 在怪物上应用渐变。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_61_0.png)


    - 2. 最后，使用 Airbrush Tool 选项为怪物添加一些阴影。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_62_0.png)


    现在，我们制作了一个喷火怪物，正在恐吓邻里。

    这有多酷！


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_63_0.png)


    ## 插件


    插件是 GIMP 中非常有趣的一部分。我不会逐步解释如何安装插件。但是，由于插件比较高级，我将不得不解释如何安装一个插件。


    插件可以为 GIMP 带来新功能。它可能是基本的批量旋转，也可能是基于复杂数学计算绘制图形的出色矢量绘图插件。


    ## 即时 GIMP 入门


    我将使用我自己的水印插件，它可以在一批图像上添加水印。请按照以下步骤操作：


    - 1. 浏览至 https://github.com/fazreil/GIMP-Watermarker/blob/master/fazreil.scm。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_64_0.png)


    此页面显示了我为 GIMP 制作的插件。


    - 2. 现在，从页面下载它。


    3. 将下载的文件解压到 GIMP 安装文件夹中的脚本目录。我的设置路径为 C:\Program Files\GIMP 2\share\gimp\2.0\scripts，如以下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_65_0.png)


    4. 重新启动 GIMP 2.0。


    5. 重新启动服务器后，它将如下截图所示，菜单中会出现一个新项目：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_65_1.png)


    有很多地方存放人们编写的插件；如果你在搜索引擎中搜索或前往 http://registry.gimp.org/，你可能会找到它们。祝你搜寻和安装愉快！


    ## 使用滤镜


    滤镜是 GIMP 中非常酷的功能。我们在之前的工作中已经使用了一些滤镜（如创建火焰效果时的 IWarp）。这次我们将使用更多滤镜来创建以下图片：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_66_0.png)


    要使用滤镜创建上一张图片，请按照以下步骤操作：


    - 1. 要创建新图像，请按照以下截图所示的设置进行操作：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_66_1.png)


    - 2. 渲染蓝色雾气作为背景。点击 **Filters | Render | Fog**，你将看到以下菜单：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_67_0.png)


    你将得到非常随机的雾气图案，如以下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_67_1.png)


    - 3. 我将把 GIMP 男孩作为新图层粘贴到此绘图中。

    - 4. 将你选择的图片复制并粘贴到新图层中。

    - 5. 使用 Scale Tool 选项将其缩小到更小的比例。拖动时按住 Ctrl 以保持纵横比。在以下截图中，注意 GIMP 男孩太大而无法放入此图片中。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_68_0.png)


    6. 通过点击 Filters | Light and Shadow | Lighting Effects 添加光照效果。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_68_1.png)


    7. 现在，周围看起来效果更好。接下来，为了好玩，添加 Fin，如以下截图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_69_0.png)


    8. 使用新图层，并用渐变填充底部部分。这是在画布上渲染草的简单方法。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_69_1.png)


    9. 使用 whirl and pinch（Filters | Distorts | Whirl and Pinch）使渐变看起来波浪形。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_70_0.png)


    10. 通过点击 Filters | Distorts | Shifts 应用位移效果，将草放在渐变上。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_70_1.png)

    '
