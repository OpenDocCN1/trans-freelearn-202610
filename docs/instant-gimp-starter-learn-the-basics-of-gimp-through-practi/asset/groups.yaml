  md: '

    ## Installation

    In a few easy steps, you can install GIMP and get it set up on your system.


    ### Step 1 – what do I need?

    Before you install GIMP, you will need to check whether you have all of the required
    elements, as listed in the following items:

    - 256 MB of minimum memory is needed, though 1 GB is recommended for smoother
    work

    - Disk space of minimum 100 MB

    - For a Linux machine, GIMP requires an X Window System running on the machine


    While we''re on the subject, in the following screenshot, there is the one and
    only step shown to get GIMP installed on Ubuntu:


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_15_0.png)


    Open up terminal and issue the following command:


    ```

    sudo apt-get install gimp

    ```


    ### Step 2 – downloading GIMP

    The easiest way to download GIMP is from http://www.gimp.org/downloads/. There
    is a link to the latest version of Windows Installer on the website.


    ### Step 3 – setting up installation

    To set up the installation, follow these steps:

    - 1. Find the executable downloaded, and double-click on it to begin, as shown
    in the following screenshot:

    - 2. Select the preferred language for use during installation.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_16_0.png)


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_16_1.png)


    ### Step 4 – installing

    To begin installing GIMP, follow these steps:

    - 1. The installation begins after clicking on the Install button, as shown in
    the following screenshot:


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_17_0.png)


    - 2. On the following screenshot, the installer is unpacking its content and loading
    it into the machine. Please wait for the process to finish.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_17_1.png)


    - 3. The final screen for the installation indicates that the installation is
    successful. Then, click on the Finish button to end the installation process.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_18_0.png)


    ### And that''s it!

    By this point, you should have a working installation of GIMP and are ready to
    spark creativity.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_18_1.png)


    ## Quick start – a tour around GIMP

    Let''s take a tour around GIMP for a start. This tour will give you an exposure
    to basic tasks to do with GIMP. Along the way, we will be introduced to the GIMP
    conceptual idea that makes it different than some of the other image manipulation
    programs.


    We will go to produce the following image:


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_19_0.png)


    ### Step 1 – creating a new file

    Working with GIMP requires you to work on canvas, just like an artist would do.
    In GIMP, the canvas is a file on your system. You may have a clean canvas (a new
    file), or you may also work on an image obtained from various sources.


    ### Instant GIMP Starter

    The **File** menu presents you with a number of options. From here, you can create
    a clean canvas by selecting **New**. From the next screenshot, we can see that
    there is an extensive menu for **Create**. You may start to import images copied
    from somewhere else, scan them, or take a screenshot to begin with.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_20_0.png)


    To create a new canvas, follow these steps:

    - 1. Click on **File**.

    - 2. From the menu, click on **New**.

    - 3. Now the **Create a New Image** dialog box will appear. Adjust the width and
    height. Before clicking on **OK**, set the background to be filled with nothing
    by selecting **Transparency**.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_21_0.png)


    Now you have the canvas to work on your first art, as shown in the following screenshot:


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_21_1.png)


    If you have hand drawn the outline of the picture and scanned it previously like
    I do, locate the scanned picture on your machine, and all you got to do is drag
    the file into the canvas. If you happen to have a stylus pen, you could easily
    draw on the canvas.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_22_0.png)


    ### Step 2 – setting the picture for painting

    It is the perfect time to introduce the toolbox. The Toolbox option provides you
    with a set of tools to complete your work. The collections of tools here involve
    tools to select areas, painting, transform, and touch-up tools.


    - 1. If the Toolbox window does not show up, press Ctrl + B. Following is a screenshot
    of the Toolbox window.


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_23_0.png)


    The previous screenshot consists of two parts, the tools and also tool options
    that further define the properties of the tool. The default installation of GIMP
    puts the Toolbox window and Tool option together, but they can be separated. It
    is one of the GIMP feature to be able to dock windows together or separate them
    according to user preference.


    - 2. Click on **Windows** and choose **Dockable Dialogs** to expose various dialog
    boxes that you might want to bring up front while working.

    - If you''re not sure how to go with each item of the menu, place the cursor on
    the icon, and a tooltip will appear together with a shortcut key in bold. At the
    bottom of the **Toolbox** window is the color chooser, where user can select an
    active color and alternative color, making painting easier when these colors are
    switchable.

    - 3. Click on the magic wand icon. Then, by clicking on the hair of the boy, the
    hair will be selected.

    - 4. Now, duplicate the layer, so we can have a layer exclusively for his hair.
    This step involves working with layers.


    ### Step 3 – create layers

    It is a good idea to have a layer for each part of the image. Hair, shirt, skin
    – all should have their own layer. This way you can paint each part without accidentally
    filling other parts.


    The concept of layers is important when you are working with GIMP. Think of it
    as if you are drawing on different set of papers or transparencies that you may
    cut and rearrange before you paste them on the drawing board.


    The Layers dockable window can be accessed from Windows | Dockable Dialogs | Layers.
    The Layers window is useful to navigate between layers. Refer to the following
    screenshot:


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_24_0.png)


    To navigate between layers, follow these steps:

    - 1. Drag a layer to the icon to quickly create a duplicate of the layer.

    - 2. Press Ctrl + I (or click on Select | Invert) to select the opposite part
    and delete it. Now you have a layer specific for a part.

    - 3. Create a layer for each of the parts. The layers should be aligned and overlapped
    on top of the original outline. To rename the layers, double-click on the layer
    name or click on the layer and press F2.


    The following is a screenshot of how the layers should look:


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_25_0.png)


    There are various controls that can be used from the Layers window alone. You
    may set certain layers'' visibility by clicking on the eye icon and control how
    it blends with other layers by selecting the mode.


    Layers are best used when composing images. Each of the images can be on a layer,
    so it is easier to adjust them around images on other layers. These layers can
    be organized to let certain layer sit on top of others. To do so, drag the layer
    to the top to make it sit on top of the other image.


    ### Step 4 – coloring

    This is going to be the best part. When the layers are duplicated and separated,
    it is easy to paint them. The trick to color carefully, so that the colors stay
    inside of the parts, is to select outside of the parts using the magic wand, and
    invert the selection (shortcut keys are Ctrl + I). Having done so, follow these
    steps:

    - 1. Click the **Paintbrush Tool** 🖌️, and pick a color of your choice and paint
    away.

    - 2. To select another color, click on 🎨, and you''ll be given a menu, which has
    a set of colors to choose from:

    - 3. It is up to you to pick any color from the spectrum. Once done, click on
    **OK**, and you''re back to the canvas.

    - 4. Repeat the select-and-paint process for each part. To illustrate the separate
    layers being colored, let''s look at the following screenshot:


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_26_0.png)

    '
  mdcn: '

    ## 安装

    只需几个简单的步骤，你就可以安装 GIMP 并在系统上设置好它。


    ### 第 1 步 – 我需要什么？

    在安装 GIMP 之前，你需要检查是否拥有以下项目中列出的所有必需元素：

    - 需要至少 256 MB 内存，不过推荐 1 GB 以获得更流畅的工作体验

    - 最低磁盘空间 100 MB

    - 对于 Linux 机器，GIMP 需要机器上运行 X Window 系统


    顺便说一下，在下面的截图中，展示了在 Ubuntu 上安装 GIMP 的唯一步骤：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_15_0.png)


    打开终端并执行以下命令：


    ```

    sudo apt-get install gimp

    ```


    ### 第 2 步 – 下载 GIMP

    下载 GIMP 最简单的方式是从 http://www.gimp.org/downloads/。网站上有指向最新版 Windows 安装程序的链接。


    ### 第 3 步 – 设置安装

    设置安装，请按以下步骤操作：

    - 1. 找到已下载的可执行文件，双击开始，如下图所示：

    - 2. 选择安装过程中使用的首选语言。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_16_0.png)


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_16_1.png)


    ### 第 4 步 – 安装

    开始安装 GIMP，请按以下步骤操作：

    - 1. 点击 Install 按钮后安装开始，如下图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_17_0.png)


    - 2. 在下面的截图中，安装程序正在解包其内容并加载到机器中。请等待进程完成。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_17_1.png)


    - 3. 安装的最后屏幕表明安装成功。然后，点击 Finish 按钮结束安装过程。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_18_0.png)


    ### 就这样！

    到此时，你应该已经拥有一个可用的 GIMP 安装，并准备好激发创造力。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_18_1.png)


    ## 快速入门 – GIMP 巡览

    让我们开始巡览 GIMP。本次巡览将让你接触到使用 GIMP 的基本任务。在过程中，我们将介绍使 GIMP 与其他图像处理程序不同的概念性理念。


    我们将制作以下图像：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_19_0.png)


    ### 第 1 步 – 创建新文件

    使用 GIMP 需要你在画布上工作，就像艺术家一样。在 GIMP 中，画布是系统上的一个文件。你可以有一个干净的画布（新文件），也可以在从各种来源获得的图像上工作。


    ### 即时 GIMP 入门

    **文件** 菜单为你提供许多选项。从这里，你可以通过选择 **新建** 来创建一个干净的画布。从下一张截图可以看到，**创建** 有一个丰富的菜单。你可以开始导入从别处复制的图像，扫描它们，或截屏开始。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_20_0.png)


    创建新画布，请按以下步骤操作：

    - 1. 点击 **文件**。

    - 2. 从菜单中点击 **新建**。

    - 3. 现在 **创建新图像** 对话框会出现。调整宽度和高度。在点击 **确定** 之前，通过选择 **透明度** 将背景设置为不填充。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_21_0.png)


    现在你有了画布，可以在上面进行第一次创作，如下图所示：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_21_1.png)


    如果你像我一样事先手绘了图片轮廓并扫描过，定位机器上的扫描图片，然后只需将文件拖入画布即可。如果你有数位笔，也可以在画布上轻松绘画。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_22_0.png)


    ### 第 2 步 – 设置绘画图片

    现在是介绍工具箱的完美时机。工具箱选项为你提供完成工作的工具集。这里的工具集合包括选择区域、绘画、变换和修补工具。


    - 1. 如果工具箱窗口没有显示，按 Ctrl + B。以下是工具箱窗口的截图。


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_23_0.png)


    上一张截图包含两部分，工具以及进一步定义工具属性的工具选项。GIMP 默认安装将工具箱窗口和工具选项放在一起，但可以分开。根据用户偏好将窗口停靠在一起或分开是
    GIMP 的一项功能。


    - 2. 点击 **窗口** 并选择 **可停靠对话框** 以显示在工作时可能想要调到前面的各种对话框。

    - 如果你不确定菜单中每个项目的操作，将光标放在图标上，会出现一个工具提示以及加粗的快捷键。**工具箱** 窗口底部是颜色选择器，用户可以在其中选择活动颜色和备用颜色，使在这些颜色可切换时绘画更轻松。

    - 3. 点击魔术棒图标。然后，通过点击男孩的头发，头发将被选中。

    - 4. 现在，复制图层，以便我们拥有专门用于他头发的图层。此步骤涉及图层操作。


    ### 第 3 步 – 创建图层

    为图像的每个部分设置一个图层是个好主意。头发、衬衫、皮肤——都应有自己的图层。这样你就可以在不意外填充其他部分的情况下为每个部分上色。


    图层的概念在使用 GIMP 时很重要。可以把它想象成你在不同的纸张或透明胶片上作画，然后在粘贴到绘图板上之前可以剪切和重新排列。


    图层可停靠窗口可通过 Windows | Dockable Dialogs | Layers 访问。图层窗口有助于在图层之间导航。请参考以下截图：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_24_0.png)


    在图层之间导航，请按以下步骤操作：

    - 1. 将图层拖到图标上可快速创建图层的副本。

    - 2. 按 Ctrl + I（或点击 选择 | 反选）来选择相反的部分并删除它。现在你有一个专门用于某一部分的图层。

    - 3. 为每个部分创建图层。图层应与原始轮廓对齐并重叠在其上方。要重命名图层，双击图层名称或点击图层后按 F2。


    以下是图层应有的外观截图：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_25_0.png)


    仅从图层窗口即可使用各种控件。你可以通过点击眼睛图标设置某些图层的可见性，并通过选择模式控制它与其他图层的混合方式。


    图层在合成图像时最有用。每个图像都可以放在一个图层上，这样更容易在其他图层的图像周围调整它们。这些图层可以组织起来让某些图层位于其他图层之上。为此，将图层拖到顶部，使其位于其他图像之上。


    ### 第 4 步 – 上色

    这将是最精彩的部分。当图层被复制并分离后，上色就很容易了。小心上色的技巧是使用魔术棒选择部分外部，然后反转选择（快捷键为 Ctrl + I），使颜色保持在部分内部。


    完成此操作后，请按以下步骤操作：

    - 1. 点击 **画笔工具** 🖌️，并选择你喜欢的颜色开始绘画。

    - 2. 要选择另一种颜色，点击 🎨，你会得到一个菜单，其中有一组可供选择的颜色：

    - 3. 你可以从光谱中选择任何颜色。完成后，点击 **确定**，你将返回画布。

    - 4. 对每个部分重复选择并绘画的过程。为了说明单独图层被上色的情况，让我们看一下以下截图：


    ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_26_0.png)

