    \n*快速开始 – GIMP 巡览* 使用户能够熟悉使用 GIMP 的基本概念。\n\n*您会想了解的 5 大功能* 引导读者了解如何使用 GIMP 工作并开始发挥创造力。\n\
    \n*您应该认识的人和地方* 为读者提供有关发现各种资源以帮助他们并激发灵感的指南。\n\n## 那么，GIMP 是什么？\n\nGIMP 是 GNU Image\
    \ Manipulation Program 的缩写。它是一款开源程序，用户可以用它来修图并创建自己的绘画；它是一款完整的绘画工具。\n\n还记得那张你希望能裁掉破坏整张照片的不必要物体的照片吗？现在你可以做到这一点，甚至可以更好地通过美丽的效果让那张照片成为你的回忆。\n\
    \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_13_0.png)\n\n在整本书中，我将使用安装在 Windows\
    \ 7 上的 GIMP 版本 2.8.2。GIMP 可用于 Windows、Linux 或 Mac 机器；所有这些都是免费的。\n\nWindows、Linux\
    \ 机器和 Mac 之间的用户体验应该相当。 我经常用数码相机或手机拍照。回家后，我只需将设备插入 Linux 机器并将照片传输到 USB 驱动器。我可能会在\
    \ Linux 机器上修图或进行一些设计，然后将 USB 驱动器带到我的个人笔记本电脑上继续工作。GIMP 使您可以在没有任何问题的情况下携带自己的作品。\n\
    \n我甚至在工作中使用 GIMP。我不必担心许可或服务订阅。您可以在 http://www.gimp.org/about/COPYING 阅读它们。GIMP\
    \ 如此易用的原因是，我可以更快地执行某些任务。我需要处理大量要插入网站或文档的图像。我曾处理过数千张需要在提交前编辑的图像。在这种时候，没有试错的余地。GIMP\
    \ 允许我们执行脚本（称为 Script-Fu），我可以用几秒钟完成 5 分钟的工作。我将在本书后面详细介绍这一点。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_14_0.png)\n\
    \nGIMP 也可作为便携式应用程序提供，您可以将数据复制到 USB 驱动器并在任何 Windows 机器上打开，而无需安装它。然而，本书不涵盖便携式应用程序。\n"
