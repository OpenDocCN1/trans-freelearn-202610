    # Instant GIMP Starter


    Welcome to *Instant GIMP Starter*. This book is written to provide motivation
    for anyone to start using GIMP. Readers will be exposed to the features of GIMP,
    which will be enough for them to start using the tool. Each topic in this book
    will get the reader into the action of creating various wonderful works of art.
    Along the way, readers are also introduced to the new techniques and tools within
    GIMP.


    The documentation contains the following sections:


    *So, what is GIMP?* introduces GIMP and its features to the reader.


    *Installation* explains to the reader how to start using it.


    *Quick start – A tour around GIMP* enables the user to get familiarized with the
    basic concept of using GIMP.


    *Top 5 features you''ll want to know about* draws the reader into action on how
    to work with GIMP and start getting creative.


    *People and places you should get to know* provides guidelines to the reader on
    discovering various resources that could help and also get them inspired.'
