  ## 关于作者


  **Fazreil Amreen**，除非被问及，否则不会透露他的名字。这是他的天性，他通过展示自己的作品来介绍自己。他是美丽的国家马来西亚的公民，并以欢乐和笑声欣赏生活的各个方面。为了避免过着刻板、乏味的生活，他坚持着“做大事”的座右铭，无论他走到哪里。自
  8 位时代以来，他就是一名电子游戏玩家，喜欢充满挑战的虚拟生活，在那里没有什么能阻止他（这也是他在虚拟生活中的座右铭）。


  他喜欢尝试新事物，尤其是需要创造力的事物。他在工作中也是如此，这使他能够了解有助于软件工程流程的最新工具，这就是为什么他们称他为软件配置管理工程师。他热爱开源软件，并在可能的情况下使用它，甚至帮助他人。如果这是有回报的结局，他想制作自己的电子游戏。在
  twitter 上关注他 @fab52。


  ## 关于审阅者


  **Safurah Harun** 目前在一家名为马来西亚的和平国家的国家 ICT 研发中心工作之一工作。拥有 3 年软件开发领域技术写作经验，她对计算机技术非常感兴趣，喜欢结识人、分享知识和拓展思想。


