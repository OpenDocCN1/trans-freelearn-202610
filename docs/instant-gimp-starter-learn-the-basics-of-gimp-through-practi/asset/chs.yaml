- "## 即时 GIMP 入门\n\n欢迎阅读 *即时 GIMP 入门*。本书旨在为任何想要开始使用 GIMP 的人提供动力。读者将接触到 GIMP 的功能，这足以让他们开始使用该工具。本书中的每个主题都将引导读者动手创作各种精彩的艺术作品。在此过程中，读者还将了解\
  \ GIMP 中的新技术和工具。\n\n文档包含以下部分：\n\n*那么，GIMP 是什么？* 向读者介绍 GIMP 及其功能。\n\n*安装* 解释读者如何开始使用它。\n\
  \n*快速开始 – GIMP 巡览* 使用户能够熟悉使用 GIMP 的基本概念。\n\n*您会想了解的 5 大功能* 引导读者了解如何使用 GIMP 工作并开始发挥创造力。\n\
  \n*您应该认识的人和地方* 为读者提供有关发现各种资源以帮助他们并激发灵感的指南。\n\n### 那么，GIMP 是什么？\n\nGIMP 是 GNU Image\
  \ Manipulation Program 的缩写。它是一款开源程序，用户可以用它来修图并创建自己的绘画；它是一款完整的绘画工具。\n\n还记得那张你希望能裁掉破坏整张照片的不必要物体的照片吗？现在你可以做到这一点，甚至可以更好地通过美丽的效果让那张照片成为你的回忆。\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_13_0.png)\n\n在整本书中，我将使用安装在 Windows 7\
  \ 上的 GIMP 版本 2.8.2。GIMP 可用于 Windows、Linux 或 Mac 机器；所有这些都是免费的。\n\nWindows、Linux 机器和\
  \ Mac 之间的用户体验应该相当。 我经常用数码相机或手机拍照。回家后，我只需将设备插入 Linux 机器并将照片传输到 USB 驱动器。我可能会在 Linux\
  \ 机器上修图或进行一些设计，然后将 USB 驱动器带到我的个人笔记本电脑上继续工作。GIMP 使您可以在没有任何问题的情况下携带自己的作品。\n\n我甚至在工作中使用\
  \ GIMP。我不必担心许可或服务订阅。您可以在 http://www.gimp.org/about/COPYING 阅读它们。GIMP 如此易用的原因是，我可以更快地执行某些任务。我需要处理大量要插入网站或文档的图像。我曾处理过数千张需要在提交前编辑的图像。在这种时候，没有试错的余地。GIMP\
  \ 允许我们执行脚本（称为 Script-Fu），我可以用几秒钟完成 5 分钟的工作。我将在本书后面详细介绍这一点。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_14_0.png)\n\
  \nGIMP 也可作为便携式应用程序提供，您可以将数据复制到 USB 驱动器并在任何 Windows 机器上打开，而无需安装它。然而，本书不涵盖便携式应用程序。\n\
  \n\n\n### 安装\n只需几个简单的步骤，你就可以安装 GIMP 并在系统上设置好它。\n\n### 第 1 步 – 我需要什么？\n在安装 GIMP 之前，你需要检查是否拥有以下项目中列出的所有必需元素：\n\
  - 需要至少 256 MB 内存，不过推荐 1 GB 以获得更流畅的工作体验\n- 最低磁盘空间 100 MB\n- 对于 Linux 机器，GIMP 需要机器上运行\
  \ X Window 系统\n\n顺便说一下，在下面的截图中，展示了在 Ubuntu 上安装 GIMP 的唯一步骤：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_15_0.png)\n\
  \n打开终端并执行以下命令：\n\n```\nsudo apt-get install gimp\n```\n\n### 第 2 步 – 下载 GIMP\n下载\
  \ GIMP 最简单的方式是从 http://www.gimp.org/downloads/。网站上有指向最新版 Windows 安装程序的链接。\n\n###\
  \ 第 3 步 – 设置安装\n设置安装，请按以下步骤操作：\n- 1. 找到已下载的可执行文件，双击开始，如下图所示：\n- 2. 选择安装过程中使用的首选语言。\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_16_0.png)\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_16_1.png)\n\
  \n### 第 4 步 – 安装\n开始安装 GIMP，请按以下步骤操作：\n- 1. 点击 Install 按钮后安装开始，如下图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_17_0.png)\n\
  \n- 2. 在下面的截图中，安装程序正在解包其内容并加载到机器中。请等待进程完成。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_17_1.png)\n\
  \n- 3. 安装的最后屏幕表明安装成功。然后，点击 Finish 按钮结束安装过程。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_18_0.png)\n\
  \n### 就这样！\n到此时，你应该已经拥有一个可用的 GIMP 安装，并准备好激发创造力。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_18_1.png)\n\
  \n### 快速入门 – GIMP 巡览\n让我们开始巡览 GIMP。本次巡览将让你接触到使用 GIMP 的基本任务。在过程中，我们将介绍使 GIMP 与其他图像处理程序不同的概念性理念。\n\
  \n我们将制作以下图像：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_19_0.png)\n\n### 第 1 步\
  \ – 创建新文件\n使用 GIMP 需要你在画布上工作，就像艺术家一样。在 GIMP 中，画布是系统上的一个文件。你可以有一个干净的画布（新文件），也可以在从各种来源获得的图像上工作。\n\
  \n### \n**文件** 菜单为你提供许多选项。从这里，你可以通过选择 **新建** 来创建一个干净的画布。从下一张截图可以看到，**创建** 有一个丰富的菜单。你可以开始导入从别处复制的图像，扫描它们，或截屏开始。\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_20_0.png)\n\n创建新画布，请按以下步骤操作：\n- 1. 点击\
  \ **文件**。\n- 2. 从菜单中点击 **新建**。\n- 3. 现在 **创建新图像** 对话框会出现。调整宽度和高度。在点击 **确定** 之前，通过选择\
  \ **透明度** 将背景设置为不填充。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_21_0.png)\n\n现在你有了画布，可以在上面进行第一次创作，如下图所示：\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_21_1.png)\n\n如果你像我一样事先手绘了图片轮廓并扫描过，定位机器上的扫描图片，然后只需将文件拖入画布即可。如果你有数位笔，也可以在画布上轻松绘画。\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_22_0.png)\n\n### 第 2 步 – 设置绘画图片\n现在是介绍工具箱的完美时机。工具箱选项为你提供完成工作的工具集。这里的工具集合包括选择区域、绘画、变换和修补工具。\n\
  \n- 1. 如果工具箱窗口没有显示，按 Ctrl + B。以下是工具箱窗口的截图。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_23_0.png)\n\
  \n上一张截图包含两部分，工具以及进一步定义工具属性的工具选项。GIMP 默认安装将工具箱窗口和工具选项放在一起，但可以分开。根据用户偏好将窗口停靠在一起或分开是\
  \ GIMP 的一项功能。\n\n- 2. 点击 **窗口** 并选择 **可停靠对话框** 以显示在工作时可能想要调到前面的各种对话框。\n- 如果你不确定菜单中每个项目的操作，将光标放在图标上，会出现一个工具提示以及加粗的快捷键。**工具箱**\
  \ 窗口底部是颜色选择器，用户可以在其中选择活动颜色和备用颜色，使在这些颜色可切换时绘画更轻松。\n- 3. 点击魔术棒图标。然后，通过点击男孩的头发，头发将被选中。\n\
  - 4. 现在，复制图层，以便我们拥有专门用于他头发的图层。此步骤涉及图层操作。\n\n### 第 3 步 – 创建图层\n为图像的每个部分设置一个图层是个好主意。头发、衬衫、皮肤——都应有自己的图层。这样你就可以在不意外填充其他部分的情况下为每个部分上色。\n\
  \n图层的概念在使用 GIMP 时很重要。可以把它想象成你在不同的纸张或透明胶片上作画，然后在粘贴到绘图板上之前可以剪切和重新排列。\n\n图层可停靠窗口可通过\
  \ Windows | Dockable Dialogs | Layers 访问。图层窗口有助于在图层之间导航。请参考以下截图：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_24_0.png)\n\
  \n在图层之间导航，请按以下步骤操作：\n- 1. 将图层拖到图标上可快速创建图层的副本。\n- 2. 按 Ctrl + I（或点击 选择 | 反选）来选择相反的部分并删除它。现在你有一个专门用于某一部分的图层。\n\
  - 3. 为每个部分创建图层。图层应与原始轮廓对齐并重叠在其上方。要重命名图层，双击图层名称或点击图层后按 F2。\n\n以下是图层应有的外观截图：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_25_0.png)\n\
  \n仅从图层窗口即可使用各种控件。你可以通过点击眼睛图标设置某些图层的可见性，并通过选择模式控制它与其他图层的混合方式。\n\n图层在合成图像时最有用。每个图像都可以放在一个图层上，这样更容易在其他图层的图像周围调整它们。这些图层可以组织起来让某些图层位于其他图层之上。为此，将图层拖到顶部，使其位于其他图像之上。\n\
  \n### 第 4 步 – 上色\n这将是最精彩的部分。当图层被复制并分离后，上色就很容易了。小心上色的技巧是使用魔术棒选择部分外部，然后反转选择（快捷键为 Ctrl\
  \ + I），使颜色保持在部分内部。\n\n完成此操作后，请按以下步骤操作：\n- 1. 点击 **画笔工具** \U0001F58C️，并选择你喜欢的颜色开始绘画。\n\
  - 2. 要选择另一种颜色，点击 \U0001F3A8，你会得到一个菜单，其中有一组可供选择的颜色：\n- 3. 你可以从光谱中选择任何颜色。完成后，点击 **确定**，你将返回画布。\n\
  - 4. 对每个部分重复选择并绘画的过程。为了说明单独图层被上色的情况，让我们看一下以下截图：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_26_0.png)\n\
  \n\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_27_0.png)\n\n绘图中的每个填充都由图层分隔，以便可以修改每个图层而不影响其他图层。您还可以指定单个图层的透明度。\n\
  \n这就结束了 GIMP 的简要介绍。这些基础步骤只是冰山一角。GIMP 为您准备的内容令人惊叹。\n"
- "## 你会想了解的 Top 5 功能\n\n这是本书最有趣的部分。在本章中，我们实际上将学习如何像艺术家一样工作。\n\n我们将要探讨的五个主题是如何：\n\n\
  - Draw a poster\n- Make precise diagrams (infographic)\n- Combine multiple pictures\n\
  - Install plugins\n- Use filters\n\n### 绘制海报\n\n海报是一种传达有力信息的绘画。海报通常包含文字信息和图像来补充信息。海报可能只包含非常有限的颜色。我们将逐步制作以下海报：\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_28_0.png)\n\n要制作海报，请按照以下步骤操作：\n\n- 1.\
  \ Create a new file by clicking on File | New (or keyboard shortcut Ctrl + N), and\
  \ you'll be presented by this new file menu:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_29_0.png)\n\
  \n让我们使用适合 A4 打印的设置；为此绘图选择 A4（300ppi）模板。它将是一个大画布，尺寸为 2480 x 3508 像素。大画布意味着创建的图像将是高分辨率图像，适合打印。低分辨率会导致打印时图像模糊且锯齿状。\n\
  \n- 2. Click on the Text Tool option to start putting text on the canvas. The setting\
  \ of the text can be modified at the tool options. Here, I choose Rockwell font.\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_29_1.png)\n\n3. Now let's write PEN on\
  \ the canvas. Click-and-drag to form a rectangle on the canvas. Type PEN at the\
  \ placeholder, as shown in the following screenshot:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_30_0.png)\n\
  \n4. Make another two rectangles for & and Pencil.\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_31_0.png)\n\
  \n您应该已创建了三个文字图层；您的图层菜单应如下屏幕截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_31_1.png)\n\
  \n现在让我们尝试绘制一支简单的钢笔。操作如下：\n\n- 1. To make a geometrical shape, we could use the selection\
  \ where you begin by forming a rectangle selection, and put a stroke to the selection,\
  \ as shown in the following screenshot:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_32_0.png)\n\
  \n2. This requires a few steps to form the fountain pen shape, as shown in the following\
  \ screenshot:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_33_0.png)\n\n上一个屏幕截图包含一个矩形、一个圆形和一个旋转的正方形。每个都需要使用矩形、圆形和正方形形成的选区。然后，对选区应用描边以形成形状。\n\
  \n- 3. Rotating the square is a bit tricky. Use the **Rotate Tool** option to do\
  \ so. Create a square selection first (*Ctrl* + drag to form a square), click on\
  \ the **Rotate Tool** option, and click-and-drag the selection of the square to\
  \ 45 degrees. You may also use the rotate menu box; this way the rotation is more\
  \ precise. Refer to the following screenshot:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_34_0.png)\n\
  \n4. Complete the outline with the **Pencil Tool** option. Click a start point,\
  \ and hold the *Alt* key to draw a straight line. Use the edges on the strokes for\
  \ your guide to make a fountain pen tip.\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_35_0.png)\n\
  \n5. Now you should be getting used to forming geometrical shapes. Remove unnecessary\
  \ lines using Eraser Tool option. Use the Bucket Fill Tool option to fill in with\
  \ colors.\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_36_0.png)\n\n6. To draw a\
  \ pencil on the other side is simpler than a fountain pen. The basic shape to form\
  \ is shown in the following screenshot:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_37_0.png)\n\
  \n7. Notice, there are two circles; they were generated by clicking on the round\
  \ selection tool, and holding Ctrl + Shift while dragging the cursor from the tip\
  \ of the pencil.\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_37_1.png)\n\n8. Erase\
  \ the unneeded lines, and start filling the drawing with colors. It should look\
  \ like the image shown in the following screenshot:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_38_0.png)\n\
  \n9. Now let's paint the background that I would like to look like a triangular\
  \ gradient design. Using the lasso tool, in orderly fashion, click at the top-right\
  \ corner, bottom-left corner, top-left corner, and finally click the top-right corner\
  \ where we started; a triangular selection is formed.\n\n10. Set up a gradient fill\
  \ to have settings like the following, and drag from top-left corner to the center\
  \ of the drawing:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_39_0.png)\n\n- 11.\
  \ Repeat the same process for the other half.\n- 12. To quickly invert the selection,\
  \ to select the other half, press Ctrl + I.\n\n13. Rearrange the words using the\
  \ Move Tool option, so they align in the center of the poster. Now we have a poster\
  \ ready for print!\n\n### 绘制信息图\n\n信息图如今随处可见；它们提供图表来可视化信息。信息图与海报不同。虽然许多人认为它们看起来相同，但信息图以精确的方式呈现数据的可视化。绘图的精确度非常重要。我们将创建一个信息图来教育人们了解非洲动物。\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_40_0.png)\n\n这是计划。我一直在网上浏览并找到了一些关于非洲动物的有趣事实。以下表格显示了我找到的事实：\n\
  \n|  | Giraffe | Elephant | Baboon | Lion | Cheetah |\n|---|---|---|---|---|---|\n\
  | Speed | 32 mph | 25 mph | 30 mph | 50 mph | 70 mph |\n| Height | 16 ft | 10 ft\
  \ | 1.8 ft | 5.5 ft | 4 ft |\n\n我还为每种动物找到了一些剪贴画以复制到 GIMP 中。使用您的 Internet 浏览器，前往\
  \ http://www.freecipartnow.com/animals。我想以 A4 大小的图像创建此文档。为此，请按照以下步骤操作：\n\n- 1. Click\
  \ on **File | New**, and create an A4 size canvas.\n- 2. Drag the picture into the\
  \ canvas.\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_41_0.png)\n\n3. If the image\
  \ does not have a visible alpha channel, please add one from the layer content menu:\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_42_0.png)\n\n4. Remove the other surroundings,\
  \ so that we are left with the shape of a baboon.\n\n5. Resize the picture so that\
  \ the picture is proportionate with the other pictures. Use information from the\
  \ table to set the height. I represent 1.8 feet with 18 mm, as 1 foot is represented\
  \ as 10 mm.\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_42_1.png)\n\n6. Select the\
  \ shape with a magic wand so that it is easier to work with. Add a gradient to fill\
  \ the shape and stroke the outline. The result should look like the image shown\
  \ in the following screenshot:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_43_0.png)\n\
  \n7. Repeat the process for lion, cheetah, elephant, and giraffe.\n\n8. Now for\
  \ the speedometer, draw a basic guide, as shown in the following screenshot:\n\n\
  ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_44_0.png)\n\n9. On the top of another layer,\
  \ create radii of the circles. These will be the levels on the speedometer.\n\n\
  ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_44_1.png)\n\n10. This enables the layer\
  \ to be copied and rotated to fill other quadrants.\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_45_0.png)\n\
  \n11. After the second quadrant, rotate to fill up until the third quadrant merge\
  \ all three quadrants. Refer to the following screenshot:\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_45_1.png)\n\
  \n现在我们有一个接近完成的 speedometer：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_46_0.png)\n\
  \n12. Clean up the speedometer and put the labels for each level.\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_46_1.png)\n\
  \n\n\n13. 让我们绘制速度表指针的导向线；我们只需要找到圆的中心。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_47_0.png)\n\
  \n14. 创建一个指向零的指针，并根据动物颜色对其进行着色。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_47_1.png)\n\
  \n15. 现在旋转指针以显示动物的速度。之后立即添加投影。点击 Filters | Light and Shadow | Drop Shadow 添加投影。\n\
  \n> 顺便说一下：\n> 如何计算指针的旋转角度？考虑以下数值。\n> 大象的速度 = 25\n> 完整象限指示 = 120\n> 这使得旋转：25/120\
  \ × 360° = 75°\n\n结果显示在以下截图中：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_48_0.png)\n\
  \n整体图片将如下截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_49_0.png)\n\n16. 现在我们要为动物创建高度指示器。为此，我们将使用铅笔工具创建一条直线。\n\
  \n17. 在某一点单击，按住 Shift 键，它将形成一条直线。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_50_0.png)\n\
  \n18. 添加文字以明确每个图像代表动物的高度和速度。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_51_0.png)\n\
  \n19. 发挥你的创意，为彩色编码的动物制作标题和图例，如以下截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_52_0.png)\n\
  \n20. 最后，信息图表完成，如以下截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_53_0.png)\n\
  \n### 合并多张图片\n\n本节我们将学习如何制作由多张图片组成的一张图片。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_54_0.png)\n\
  \n为此，请按照以下步骤操作：\n\n- 1. 首先，我们选择一张图片并将其作为图层打开，如以下截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_54_1.png)\n\
  \n我选择的图片如下：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_55_0.png)\n\n2. 为图片添加 alpha\
  \ 通道，使其显示透明度，如以下截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_55_1.png)\n\n\
  - 3. 使用魔术棒选择天空。\n- 4. 将其剪切并粘贴为新图层。\n- 5. 将图层向后移动，使其位于后面。\n\n先放下这张图片；我们正在研究在背景上绘制怪物。我在我的素描本上画了一张怪物的图片并扫描了它。因此，我可以使用\
  \ GIMP 打开它。我们可以使用阈值设置使轮廓更清晰。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_56_0.png)\n\
  \n要在背景上绘制图片，请按照以下步骤操作：\n\n- 1. 使用按颜色选择来选择怪物的轮廓。\n- 2. 清理图片并删除背景，这样我们只能得到怪物。\n\n\
  ![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_57_0.png)\n\n3. 复制怪物并将其粘贴到我们之前正在处理的图片上。\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_57_1.png)\n\n4. 锚定图层，并调整图层使怪物落在景色的后面。\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_58_0.png)\n\n5. 下一步是创建火焰。为此，创建一个新图层，并选择怪物嘴附近图层的一部分。用渐变填充选区，如以下截图所示：\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_58_1.png)\n\n6. 取消选择矩形，并选择图层更大的部分。\n\n\
  7. 进入 Filters | Distorts | IWarp 将火焰塑形为渐变。模糊向上指向的渐变。使用 Swirl CCW 或 Swirl CW 选项创建猛烈火焰的美丽效果。\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_59_0.png)\n\n8. 然后点击 Move 单选按钮，如以下截图所示：\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_59_1.png)\n\n9. 现在我们有了喷火怪物，尝试进行一些调整，使火焰倾斜到头部的位置。使用\
  \ Move Tool 和 Rotate Tool 选项来执行此操作。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_60_0.png)\n\
  \n现在让我们为怪物上色。为此，请按照以下步骤操作：\n\n- 1. 在怪物上应用渐变。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_61_0.png)\n\
  \n- 2. 最后，使用 Airbrush Tool 选项为怪物添加一些阴影。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_62_0.png)\n\
  \n现在，我们制作了一个喷火怪物，正在恐吓邻里。\n这有多酷！\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_63_0.png)\n\
  \n### 插件\n\n插件是 GIMP 中非常有趣的一部分。我不会逐步解释如何安装插件。但是，由于插件比较高级，我将不得不解释如何安装一个插件。\n\n插件可以为\
  \ GIMP 带来新功能。它可能是基本的批量旋转，也可能是基于复杂数学计算绘制图形的出色矢量绘图插件。\n\n## \n\n我将使用我自己的水印插件，它可以在一批图像上添加水印。请按照以下步骤操作：\n\
  \n- 1. 浏览至 https://github.com/fazreil/GIMP-Watermarker/blob/master/fazreil.scm。\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_64_0.png)\n\n此页面显示了我为 GIMP 制作的插件。\n\n\
  - 2. 现在，从页面下载它。\n\n3. 将下载的文件解压到 GIMP 安装文件夹中的脚本目录。我的设置路径为 C:\\Program Files\\GIMP\
  \ 2\\share\\gimp\\2.0\\scripts，如以下截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_65_0.png)\n\
  \n4. 重新启动 GIMP 2.0。\n\n5. 重新启动服务器后，它将如下截图所示，菜单中会出现一个新项目：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_65_1.png)\n\
  \n有很多地方存放人们编写的插件；如果你在搜索引擎中搜索或前往 http://registry.gimp.org/，你可能会找到它们。祝你搜寻和安装愉快！\n\n\
  ### 使用滤镜\n\n滤镜是 GIMP 中非常酷的功能。我们在之前的工作中已经使用了一些滤镜（如创建火焰效果时的 IWarp）。这次我们将使用更多滤镜来创建以下图片：\n\
  \n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_66_0.png)\n\n要使用滤镜创建上一张图片，请按照以下步骤操作：\n\
  \n- 1. 要创建新图像，请按照以下截图所示的设置进行操作：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_66_1.png)\n\
  \n- 2. 渲染蓝色雾气作为背景。点击 **Filters | Render | Fog**，你将看到以下菜单：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_67_0.png)\n\
  \n你将得到非常随机的雾气图案，如以下截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_67_1.png)\n\
  \n- 3. 我将把 GIMP 男孩作为新图层粘贴到此绘图中。\n- 4. 将你选择的图片复制并粘贴到新图层中。\n- 5. 使用 Scale Tool 选项将其缩小到更小的比例。拖动时按住\
  \ Ctrl 以保持纵横比。在以下截图中，注意 GIMP 男孩太大而无法放入此图片中。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_68_0.png)\n\
  \n6. 通过点击 Filters | Light and Shadow | Lighting Effects 添加光照效果。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_68_1.png)\n\
  \n7. 现在，周围看起来效果更好。接下来，为了好玩，添加 Fin，如以下截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_69_0.png)\n\
  \n8. 使用新图层，并用渐变填充底部部分。这是在画布上渲染草的简单方法。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_69_1.png)\n\
  \n9. 使用 whirl and pinch（Filters | Distorts | Whirl and Pinch）使渐变看起来波浪形。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_70_0.png)\n\
  \n10. 通过点击 Filters | Distorts | Shifts 应用位移效果，将草放在渐变上。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_70_1.png)\n\
  \n\n\n11. 注意草地移到了顶部，若要将草地稍微移到底部画布，使用 **移动工具** 选项。\n\n12. 这是我最喜欢的部分；我想在场景中渲染一个星球。按住\
  \ *Ctrl + Shift* 制作圆形选区。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_71_0.png)\n\
  \n13. 点击 **滤镜 | 渲染 | 球体设计器** 来创建球体。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_71_1.png)\n\
  \n14. 点击确定后，你会在男孩身后看到一个大球体。\n\n15. 复制球体图层，并在球体上添加雾效果。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_72_0.png)\n\
  \n16. 通过选择 强光，如以下截图所示调整新图层：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_72_1.png)\n\
  \n结果是背景中一个美丽的星球，如以下截图所示：\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_73_0.png)\n\
  \n17. 作为最后的润色，创建一个新图层并在图片上方放置一个渐变。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_73_1.png)\n\
  \n18. 将模式设置为 **变暗**。\n\n![](img/a7d4ab10f584c5ec31bcd98067c9f4ab_74_0.png)\n\n就这样，GIMP\
  \ 男孩完成了他的旅程，开始使用 GIMP。他现在正在寻找冒险，发现 GIMP 的新高级技巧！\n"
