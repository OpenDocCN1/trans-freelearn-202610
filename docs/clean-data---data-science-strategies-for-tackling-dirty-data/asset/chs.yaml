  ## 摘要


  本章的目标是学习如何从 PDF 文件中导出数据。就像细酒中的沉淀物一样，PDF 文件中的数据乍一看似乎很难分离。然而，与倒酒不同，倒酒是一个非常被动的过程，分离
  PDF 数据需要大量的试错。我们学习了四种处理 PDF 文件以清理数据的方法：复制和粘贴、pdfMiner、Tabula 和 Acrobat 导出。每种工具都有其特定的优势和劣势：


  - 复制和粘贴无需成本且工作量很小，但对于复杂的表格效果不佳。

  - pdfMiner/Pdf2txt 也是免费的，作为命令行工具可以自动化。它也能处理大量数据。但与复制粘贴一样，它很容易被某些类型的表格弄混。

  - Tabula 需要一些设置工作，而且由于它仍在开发中，有时会给出奇怪的警告。它也比其他选项慢一点。然而，其输出非常干净，即使是复杂的表格也一样。

  - Acrobat 的输出与 Tabula 相似，但几乎无需设置且几乎不费力。它是一款付费产品。


  到最后，我们获得了一个干净的数据集，可用于分析或长期存储。


  在下一章中，我们将重点关注已放置在 **关系数据库管理系统** (**RDBMS**) 中长期存储的数据。我们将了解以这种方式存储数据时清理数据的挑战，以及一些常见的数据异常及其修复方法。

