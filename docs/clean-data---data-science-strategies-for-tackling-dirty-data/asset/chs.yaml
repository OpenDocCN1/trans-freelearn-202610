- "# 第7章：RDBMS 清洗技术\n\n## RDBMS 清理技术\n\n家用冰箱都配有架子，大多数还有一两个蔬菜抽屉。但如果你去过家居整理商店或与专业整理师交谈，你会了解到还有许多额外的存储选项，包括鸡蛋容器、奶酪盒、可乐罐分配器、酒瓶架、剩菜标签系统，以及各种尺寸的可堆叠、颜色编码的收纳箱。但我们真的需要所有这些额外物品吗？要回答这个问题，请问自己这些问题：我经常使用的食物是否容易找到？食物是否占用了比应有的更多空间？剩菜是否清楚地贴上标签，以便我记得它们是什么以及何时制作的？如果我们的答案是否定的，组织专家说容器和标签可以帮助我们优化存储、减少浪费，让生活更轻松。\n\
  \n在我们的 **关系数据库管理系统 (RDBMS)** 中也是如此。作为经典的长期数据存储解决方案，RDBMS 是现代数据科学工具包的标准组成部分。但我们经常犯的错误就是将数据简单地存入数据库，而对细节考虑甚少。在本章中，我们将学习如何设计一个超越\
  \ *两个架子和一个抽屉* 的 RDBMS。我们将学习一些技术，确保我们的 RDBMS 能够优化存储、减少浪费，让生活更轻松。具体来说，我们将：\n\n- 学习如何在\
  \ RDBMS 数据中查找异常\n- 学习多种清理不同类型问题数据的策略\n- 学习何时以及如何为清理后的数据创建新表，包括创建子表和查找表\n- 学习如何记录所做更改的规则\n\
  \n### 准备工作\n\n为了设置本章中的示例，我们将使用一个名为 **Sentiment140** 的流行数据集。该数据集创建的目的是帮助学习 Twitter\
  \ 消息中的正面和负面情绪。我们在本书中并不真正关心情感分析，但我们将使用该数据集来练习在数据已导入关系数据库后清理数据。\n\n要开始使用 Sentiment140\
  \ 数据集，您需要设置好 MySQL 服务器并准备就绪，就像之前的 Enron 示例中一样。\n\n### 第一步 – 下载并检查 Sentiment140\n\
  \n我们想要使用的 Sentiment140 数据版本是直接从 Sentiment140 项目提供的原始两文件集，网址为 `http://help.sentiment140.com/for-students`。这个推文及其正面和负面极性（或情感，范围为\
  \ 0、2 或 4）的 ZIP 文件由斯坦福大学的一些研究生创建。由于该文件被公开提供，原始的 Sentiment140 文件已被其他网站添加，并作为许多更大的推文集合的一部分提供。对于本章，我们将使用原始的\
  \ Sentiment140 文本文件，该文件要么可从前述网站的链接获得，要么可通过精确路径 `http://cs.stanford.edu/people/alecmgo/trainingandtestdata.zip`\
  \ 获取。\n\n下载 ZIP 文件，解压它，并使用文本编辑器查看其中的两个 CSV 文件。立刻你会注意到一个文件比另一个文件有更多的行，但这两个文件中的列数相同。数据以逗号分隔，每个列都用双引号括起来。每列的描述可以在前一节中链接的\
  \ `for-students` 页面上找到。\n\n### 第二步 – 清理以便数据库导入\n\n就我们的目的——学习如何清理数据而言，将这些文件中的较小文件加载到单个\
  \ MySQL 数据库表中就足够了。我们需要学习的一切，都可以用较小的文件来完成，该文件名为 `testdata.manual.2009.06.14.csv`。\n\
  \n当我们查看数据时，如果直接将此文件导入 MySQL，可能会注意到一些会给我们带来麻烦的区域。其中一个问题点位于文件的第 28 行：\n\n```\n\"4\"\
  ,\"46\",\"Thu May 14 02:58:07 UTC 2009\",\"\"\"booz allen\"\"\",\n```\n\n你能看到 booz\
  \ 关键字之前和 allen 单词之后的三个引号 \"\"\" 吗？同样的问题稍后在第 41 行出现，双引号包围了歌曲标题 P.Y.T.：\n\n```\n\"\
  4\",\"131\",\"Sun May 17 15:05:03 UTC 2009\",\"Danny Gokey\",\"VickyTigger\",\"\
  I'm listening to \"\"P.Y.T\"\" by Danny Gokey...\"\n```\n\n这些额外引号的问题在于 MySQL 导入例程会使用引号来分隔列文本。这会产生错误，因为\
  \ MySQL 会认为该行有比实际更多的列。\n\n为了解决这个问题，在文本编辑器中，我们可以使用查找和替换将所有 \"\"\" 实例替换为 \"（双引号），并将所有\
  \ \" 实例替换为 '（单引号）。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_175_0.png)\n\n> 这些\
  \ \" 也可能完全删除，对此清理练习的负面影响很小。要做到这一点，我们只需搜索 \" 并将其替换为空。但如果你想尽可能贴近推文的原始意图，使用单引号（甚至像这样转义的双引号\
  \ \\\"）作为替换字符是安全的选择。\n\n将此清理后的文件保存为新文件名，例如 cleanedTestData.csv。我们现在准备将其导入 MySQL。\n\
  \n### 第三步 – 将数据导入 MySQL 单表\n\n要将我们稍微清理过的数据文件加载到 MySQL 中，我们需要重新回顾第 3 章《Workhorses\
  \ of Clean Data – Spreadsheets and Text Editors》中《Importing spreadsheet data into\
  \ MySQL》部分中的 CSV 到 SQL 技术：\n\n- 1. 从命令行导航到保存步骤二中创建的文件的目录。这是我们要导入 MySQL 的文件。\n- 2.\
  \ 然后启动 MySQL 客户端并连接到数据库服务器：\n\n```\nuser@machine:~/sentiment140$ mysql -hlocalhost\
  \ -umsquire -p\nEnter password:\n```\n\n\n\n3. 输入您的密码，登录后，在 MySQL 中创建数据库以存放表，如下所示：\n\
  \n```\nmysql> CREATE DATABASE sentiment140;\nmysql> USE sentiment140;\n```\n\n4.\
  \ 接下来，我们需要创建一个表来存放数据。每个列的数据类型和长度应代表我们对所拥有数据的最佳匹配尝试。其中一些列将是 varchar，并且每个都需要一个长度。由于我们可能不知道这些长度应该是多少，我们可以使用清理工具来确定一个合适的范围。\n\
  \n5. 如果我们在 Excel 中打开 CSV 文件（使用 Google 表格也完全没问题），我们可以运行一些简单的函数来查找部分文本字段的最大长度。例如，len()\
  \ 函数会给出文本字符串的字符长度，而 max() 函数可以告诉我们某个范围内的最高数字。在 CSV 文件打开的情况下，我们可以应用这些函数来查看 MySQL\
  \ 中 varchar 列应该有多长。\n\n以下截图展示了一种使用函数解决此问题的方法。它显示了 length() 函数应用于列 G，以及 max() 函数用于列\
  \ H 但应用于列 G。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_176_0.png)\n\n列 G 和 H 显示了如何在\
  \ Excel 中获取文本列的长度，然后获取最大值。\n\n6. 为了更快地计算这些最大长度，我们也可以使用 Excel 快捷方式。以下数组公式可以快速将最大值与文本列的长度结合到单个单元格中——只需确保在输入此嵌套函数后按\
  \ Ctrl + Shift + Enter，而不是仅按 Enter：\n\n```\n=max(len(f1:f498))\n```\n\n此嵌套函数可应用于任何文本列，以获取该列中文本的最大长度，并且它仅使用一个单元格来完成此操作，而无需任何中间长度计算。\n\
  \n在运行这些函数后，我们发现我们所有推文的最大长度为 144 个字符。\n\n## 检测和清理异常\n\n您可能会想知道该数据集中的一条推文怎么可能长达 144\
  \ 个字符，因为 Twitter 将所有推文限制为最大长度 140 个字符。事实证明，在 sentiment140 数据集中，& 字符有时会被翻译成 HTML\
  \ 等效代码 &amp;，但并非总是如此。还使用了其他一些 HTML 代码，例如，有时 < 字符会变成 &lt;，而 > 会变成 &gt;。因此，对于少数很长的推文，仅仅增加几个字符就很容易使该推文超过\
  \ 140 的长度限制。由于我们知道这些 HTML 编码的字符并不是原始用户所推文的内容，并且因为我们看到它们有时会出现但并非总是如此，我们称这些为数据异常。\n\
  \n要清理这些，我们有两个选择。我们可以继续将混乱的数据导入数据库然后在其中清理，或者我们可以先在 Excel 或文本编辑器中尝试清理。为了展示这两种技术的差异，我们在这里两者都做。首先，我们将在电子表格或文本编辑器中使用查找和替换来尝试转换以下表格中显示的字符。我们可以将\
  \ CSV 文件导入 Excel，看看能做多少清理工作：\n\n| HTML 代码 | 替换为 | 实例计数 | 用于查找计数的 Excel 函数 |\n|---|---|---|---|\n\
  | &lt; | < | 6 | =COUNTIF(F1:F498,\"*&lt;*\") |\n| &gt; | > | 5 | =COUNTIF(F1:F498,\"\
  *&gt;*\") |\n| &amp; | & | 24 | =COUNTIF(F1:F498,\"*&amp;*\") |\n\n前两个字符交换在 Excel\
  \ 中使用查找和替换可以正常工作。&lt; 和 &gt; HTML 编码字符已被更改。看看类似这样的文本：\n\n```\nI'm listening to 'P.Y.T'\
  \ by Danny Gokey &lt;3 &lt;3 &lt;3 Aww,\n    he's so amazing. I &lt;3 him so much\
  \ :)\n```\n\n前者变成类似这样的文本：\n\n```\nI'm listening to 'P.Y.T' by Danny Gokey <3 <3\
  \ <3 Aww, he's so\n    amazing. I <3 him so much :)\n```\n\n然而，当我们尝试使用 Excel 查找\
  \ &amp; 并将其替换为 & 时，您可能会遇到错误，如下所示：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_178_0.png)\n\
  \n某些操作系统和版本的 Excel 在将 & 字符作为替换项时存在问题。此时，如果我们遇到此错误，可以采取几种不同的方法：\n\n- 我们可以使用自己选择的搜索引擎尝试为此错误找到\
  \ Excel 解决方案\n- 我们可以将 CSV 文本数据移至文本编辑器并在其中执行查找和替换功能\n- 我们可以继续前进，将数据扔进数据库，尽管其中包含奇怪的\
  \ &amp; 字符，然后尝试在数据库内部清理它\n\n通常，我会倾向于在尽可能在数据库外部清理的情况下不要将脏数据移入数据库。然而，由于本章是关于在数据库内部清理的，让我们继续将半清理后的数据导入数据库，我们将在数据进入表后处理\
  \ &amp; 问题。\n\n## 创建我们的表\n\n要将半清理后的数据移入数据库，我们将首先编写 CREATE 语句，然后在 MySQL 数据库上运行它。CREATE\
  \ 语句如下所示：\n\n```\nmysql> CREATE TABLE sentiment140 (\n    ->   polarity enum('0','2','4')\
  \ DEFAULT NULL,\n    ->   id int(11) PRIMARY KEY,\n    ->   date_of_tweet varchar(28)\
  \ DEFAULT NULL,\n    ->   query_phrase varchar(10) DEFAULT NULL,\n    ->   user\
  \ varchar(10) DEFAULT NULL,\n    ->   tweet_text varchar(144) DEFAULT NULL\n   \
  \ -> ) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_179_0.png)\n\
  \n> 此语句使用简单且快速的 MyISAM 引擎，因为我们预计不需要任何 InnoDB 功能，例如行级锁定或事务。有关 MyISAM 与 InnoDB 差异的更多信息，这里有一个关于何时使用每个存储引擎的有用讨论：http://stackoverflow.com/questions/20148/myisam-versus-innodb。\n\
  \n您可能会注意到代码仍然要求 tweet_text 列的长度为 144。这是因为我们无法清理其中包含 &amp; 代码的列。然而，这并不太困扰我，因为我知道\
  \ varchar 列不会使用其额外的空间，除非它们需要。毕竟，这就是它们被称为 varchar，即可变字符列的原因。但如果这个额外长度真的困扰您，您可以稍后更改表，使该列只有\
  \ 140 个字符。\n\n接下来，我们将使用 MySQL 命令行从以下位置运行以下导入语句：\n\n```\nmysql> LOAD DATA LOCAL INFILE\
  \ 'cleanedTestData.csv'\n    ->   INTO TABLE sentiment140\n    ->   FIELDS TERMINATED\
  \ BY ',' ENCLOSED BY '\"' ESCAPED BY '\\\\'\n    ->   (polarity, id, date_of_tweet,\
  \ query_phrase, user,\n        tweet_text);\n```\n\n此命令将我们清理后的 CSV 文件中的数据加载到我们创建的新表中。成功消息看起来像这样，表明所有\
  \ 498 行都已加载到表中：\n\n```\nQuery OK, 498 rows affected (0.00 sec)\nRecords: 498  Deleted:\
  \ 0  Skipped: 0  Warnings: 0\n```\n\n如果您有权访问基于浏览器的界面，例如 phpMyAdmin（或桌面应用程序，例如 MySQL\
  \ Workbench 或 Toad for MySQL），所有这些 SQL 命令都可以在这些工具内部非常轻松地完成，而无需在命令行上输入，例如在 phpMyAdmin\
  \ 中，您可以使用导入选项卡并在那里上传 CSV 文件。只需确保数据文件按照第二步 – 清理以便数据库导入中的程序进行清理，否则您可能会收到有关文件列数过多的错误。此错误是由引号问题引起的。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_180_0.png)\n\n## 第四步 – 清理 &amp; 字符\n\n\
  在上一步中，我们决定推迟清理 &amp; 字符，因为 Excel 对其给出了奇怪的错误。现在我们已经完成了第三步 – 将数据导入 MySQL 中的单个表，并且数据已导入\
  \ MySQL，我们可以使用 UPDATE 语句和 replace() 字符串函数非常轻松地清理数据。以下是将所有 &amp; 实例替换为 & 所需的 SQL\
  \ 查询：\n\n```sql\nUPDATE sentiment140 SET tweet_text = replace(tweet_text,'&amp;',\n\
  '&');\n```\n\nreplace() 函数的工作方式与 Excel 或文本编辑器中的查找和替换完全相同。我们可以看到推文 ID 594，以前说 #at&amp;t\
  \ is complete fail，现在读作 #at&t is complete fail。\n\n## 第五步 – 清理其他神秘字符\n\n当我们浏览 tweet_text\
  \ 列时，我们可能注意到一些奇怪的推文，例如推文 ID 613 和 2086：\n\n```\n613, Talk is Cheap: Bing that, I?ll\
  \ stick with Google\n2086, Stanford University?s Facebook Profile\n```\n\n? 字符是我们应该关注的。正如我们之前看到的\
  \ HTML 编码字符一样，此字符问题也非常可能是在字符集之间转换之前的产物。在这种情况下，原始推文中可能存在某种高 ASCII 或 Unicode 省略号（有时称为智能引号），但当数据转换为较低阶字符集，例如纯\
  \ ASCII 时，该特定风格的省略号 simply 被更改为 ?。\n\n\n\n根据我们计划对数据进行的操作，我们可能不想忽略 ? 字符，例如，如果我们进行词频统计或文本挖掘，将\
  \ I?ll 转换为 I’ll 以及 University?s 转换为 University's 可能会非常重要。如果我们决定这很重要，那么我们的任务就是检测出现此错误的推文，然后制定策略将问号转换回单引号。当然，诀窍在于我们不能简单地将\
  \ tweet_text 列中的每个问号都替换为单引号字符，因为某些推文中包含的问号应该保留。\n\n为了定位问题字符，我们可以运行一些 SQL 查询，尝试使用正则表达式定位问题。我们关注的是出现在奇怪位置的问号，例如后面紧跟字母字符的情况。以下是使用\
  \ MySQL REGEXP 功能的正则 SQL 表达式的初步尝试。运行它将让我们大致了解问题问号可能存在的位置：\n\n```\nSELECT id, tweet_text\n\
  FROM sentiment140\nWHERE tweet_text\nREGEXP '\\\\?[[:alpha:]]+' ;\n```\n\n这个 SQL\
  \ 正则表达式查找后面紧跟一个或多个字母字符的任何问号字符。该 SQL 查询产生六行，其中四行确实包含奇怪的问号，两行是 **假阳性**。假阳性是指匹配了我们的模式但实际上不应更改的推文。两个假阳性是\
  \ ID 为 **234** 和 **2204** 的推文。这两条推文中的问号是合法 URL 的一部分。推文 **139**、**224**、**613** 和\
  \ **2086** 是 **真阳性**，意味着被正确检测为异常且应更改的推文。所有结果都显示在以下 phpMyAdmin 截图中：\n\n| id | 推文文本\
  \ |\n|---|---|\n| 139 | ?Obama Administration Must Stop Bonuses to AIG Ponzi Schemers\
  \ ... http://bit.ly/2CUlg |\n| 224 | Life?s a bitch? and so is Dick Cheney. #p2\
  \ #bipart #lot #tcot #rhrs #GOP #DNC http://is.gd/DjyQ |\n| 234 | jQuery UI 1.6\
  \ Book Review - http://cfbloggers.org/?c=30631 |\n| 613 | Talk is Cheap: Bing that,\
  \ I?ll stick with Google. http://bit.ly/XC3C8 |\n| 2086 | Stanford University?s\
  \ Facebook Profile is One of the Most Popular Official University Pages - http://tinyurl.com/p5b3fl\
  \ |\n| 2204 | Learning jQuery 1.3 Book Review - http://cfbloggers.org/?c=30629 |\n\
  \n不过推文 139 很奇怪。它在单词 Obama 前有一个问号，就好像新闻文章的名称被引用了，但字符串末尾没有匹配的引号（或缺少引号）。这本应是其他字符吗？这可能实际上也是一个假阳性，或者至少不足以构成真正的阳性而需要我们修复它。在仔细查看推文时，224\
  \ 也在不合适的位置多了一个奇怪的问号。\n\n如果我们要编写一个 replace() 函数来将有问题的问号更改为单引号，我们就需要以某种方式编写一个正则表达式，使其仅匹配真阳性而不匹配任何假阳性。然而，由于这个数据集很小，只有四个真阳性——如果我们决定\
  \ 139 不需要清理，则为三个——那么我们完全可以手工清理真阳性。这尤其是个好主意，因为我们对其他可能的问题还有一些疑问，例如推文 224 中的额外问号。\n\
  \n在这种情况下，由于我们只有三行问题数据，直接运行三个小的 UPDATE 命令处理数据比尝试制作完美的正则表达式更快。以下是处理推文 224（仅第一个问题）、613\
  \ 和 2086 的 SQL 查询：\n\n```\nUPDATE sentiment140 SET tweet_text = 'Life''s a bitch?\
  \ and so is\n  Dick Cheney. #p2 #bipart #lot #tcot #rhrs #GOP #DNC\n  http://is.gd/DjyQ'\
  \ WHERE id = 224;\n```\n\n```\nUPDATE sentiment140 SET tweet_text = 'Talk is Cheap:\
  \ Bing that,\n  I''ll stick with Google. http://bit.ly/XC3C8' WHERE id = 613;\n\
  ```\n\n```\nUPDATE sentiment140 SET tweet_text = 'Stanford University''s\n  Facebook\
  \ Profile is One of the Most Popular Official University\n  Pages - http://tinyurl.com/p5b3fl'\
  \ WHERE id = 2086;\n```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_182_0.png)\n\
  \n> 请注意，我们必须在这些更新语句中转义单引号。在 MySQL 中，转义字符可以是反斜杠或单引号本身。这些示例显示了单引号作为转义字符。\n\n## 第六步\
  \ – 清理日期\n\n如果我们查看 date_of_tweet 列，我们会发现我们将其创建为一个简单的可变字符字段 varchar(30)。这有什么问题呢？好吧，假设我们想按从最早到最晚的顺序排列推文。现在我们无法使用简单的\
  \ SQL ORDER BY 子句获得正确的日期顺序，因为我们会得到字母顺序。所有星期五都会排在任何星期一之前，而五月总是排在六月之后。我们可以用以下 SQL\
  \ 查询来测试这一点：\n\n```\nSELECT id, date_of_tweet\nFROM sentiment140\nORDER BY date_of_tweet;\n\
  ```\n\n前几行是有序的，但在第 28 行附近，我们开始看到问题：\n\n```\n2018  Fri May 15 06:45:54 UTC 2009\n\
  2544  Mon Jun 08 00:01:27 UTC 2009\n...\n3     Mon May 11 03:17:40 UTC 2009\n```\n\
  \n5 月 11 日并没有排在 5 月 15 日或 6 月 8 日之后。为了解决这个问题，我们需要创建一个新列来清理这些日期字符串并将其转换为正确的 MySQL\
  \ datetime 数据类型。我们在第 2 章《基础 – 格式、类型和编码》中的“在数据类型之间转换”部分学到，MySQL 在日期和时间以原生 date、time\
  \ 或 datetime 类型存储时工作最佳。插入 datetime 类型的格式如下：YYYY-MM-DD HH:MM:SS。但这不是 date_of_tweet\
  \ 列中数据的样子。\n\n有许多内置的 MySQL 函数可以帮助我们将混乱的日期字符串格式化为首选格式。通过这样做，我们将能够利用 MySQL 对日期和时间进行数学运算的能力，例如查找两个日期或时间之间的差异，或按日期或时间顺序正确排序项目。\n\
  \n为了将我们的字符串转换为 MySQL 友好的 datetime 类型，我们将执行以下步骤：\n\n- 1. 修改表以包含一个新列，其目的是保存新的 datetime\
  \ 信息。我们可以将这个新列命名为 date_of_tweet_new 或 date_clean 或其他能清楚区别于原始 date_of_tweet 列的名称。执行此任务的\
  \ SQL 查询如下：\n\n```\nALTER TABLE sentiment140\nADD date_clean DATETIME NULL\nAFTER\
  \ date_of_tweet;\n```\n\n- 2. 对每一行执行更新，在此过程中我们将旧的日期字符串格式化为正确格式的 datetime 类型而不是字符串，并将新值添加到新创建的\
  \ date_clean 列中。执行此任务的 SQL 如下：\n\n```\nUPDATE sentiment140\nSET date_clean = str_to_date(date_of_tweet,\n\
  \  '%a %b %d %H:%i:%s UTC %Y');\n```\n\n此时，我们有一个新列，已填充干净的 datetime。请记住，旧的 date_of_tweet\
  \ 列存在缺陷，即无法正确排序日期。为了测试日期现在是否排序正确，我们可以按新列的顺序选择数据：\n\n```\nSELECT id, date_of_tweet\n\
  FROM sentiment140\nORDER BY date_clean;\n```\n\n我们看到行现在已完美排序，5 月 11 日的日期排在最前，且没有日期顺序错误。\n\
  \n我们应该删除旧的日期列吗？这由你决定。如果你担心自己可能犯了错误，或者出于某种原因可能需要原始数据，那么请务必保留它。但如果你想删除它，只需按如下所示删除该列即可：\n\
  \n```\nALTER TABLE sentiment140\nDROP date_of_tweet;\n```\n\n你也可以创建一个包含原始列的 Sentiment140\
  \ 表的副本作为备份。\n\n## 第七步 – 分离用户提及、话题标签和 URL\n\n目前这个数据还有另一个问题是 tweet_text 列中隐藏着大量有趣的信息，例如，考虑一个人使用\
  \ @ 符号在其用户名前将推文指向另一个人的所有情况。这在 Twitter 上称为提及。统计某个人被提及的次数或与特定关键词一起被提及的次数可能会很有趣。一些推文中隐藏的另一个有趣数据是话题标签；例如，ID\
  \ 为 2165 的推文使用 #jobs 和 #sittercity 话题标签讨论了工作和 babysitting 的概念。\n\n\n\n这条推文还包含一个外部的、非\
  \ Twitter 的 URL。我们可以提取这些提及、话题标签和 URL，并分别保存到数据库中。\n\n此任务与我们清理日期的方式类似，但有一个重要区别。对于日期而言，我们只有一个可能的修正版本，因此只需添加一列新列来保存新的清理版本即可。然而对于提及、话题标签和\
  \ URL，我们可能在单个 tweet_text 值中出现零个或多个，例如，我们之前查看的推文（ID 2165）中包含两个话题标签，这条推文（ID 2223）也是如此：\n\
  \n```\nHTML 5 Demos! Lots of great stuff to come! Yes, I'm excited. :)\nhttp://htmlfive.appspot.com\
  \ #io2009 #googleio\n```\n\n这条推文有零个提及、一个 URL 和两个话题标签。推文 13078 包含三个提及，但没有话题标签或 URL：\n\
  \n```\nMonday already. Iran may implode. Kitchen is a disaster. @annagoss\nseems\
  \ happy. @sebulous had a nice weekend and @goldpanda is\ngreat. whoop.\n```\n\n\
  我们需要更改数据库结构来保存这些新信息——话题标签、URL 和提及——同时要记住一条推文可能包含大量这些内容。\n\n## 创建一些新表\n\n遵循关系数据库理论，我们应避免创建存储多值属性的列，例如，如果一条推文有三个话题标签，我们不应只将三个话题标签全部存入单个列。对我们而言，此规则的影响是，我们不能直接复制之前在日期清理问题中使用的\
  \ ALTER 过程。\n\n相反，我们需要创建三个新表：sentiment140_mentions、sentiment140_urls 和 sentiment140_hashtags。每个新表的首要键都将是一个合成\
  \ ID 列，每个表还将包含另外两列：tweet_id，它将此新表链接回原始 sentiment140 表，以及提取的话题标签、提及或 URL 的实际文本。以下是创建我们需要的表的三个\
  \ CREATE 语句：\n\n```\nCREATE TABLE IF NOT EXISTS sentiment140_mentions (\n  id int(11)\
  \ NOT NULL AUTO_INCREMENT,\n  tweet_id int(11) NOT NULL,\n  mention varchar(144)\
  \ NOT NULL,\n  PRIMARY KEY (id)\n) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```\n\n\
  ```\nCREATE TABLE IF NOT EXISTS sentiment140_hashtags (\n  id int(11) NOT NULL AUTO_INCREMENT,\n\
  \  tweet_id int(11) NOT NULL,\n  hashtag varchar(144) NOT NULL,\n  PRIMARY KEY (id)\n\
  ) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```\n\n```\nCREATE TABLE IF NOT EXISTS sentiment140_urls\
  \ (\n  id int(11) NOT NULL AUTO_INCREMENT,\n  tweet_id int(11) NOT NULL,\n  url\
  \ varchar(144) NOT NULL,\n  PRIMARY KEY (id)\n) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n\
  ```\n\n> 这些表未使用指向原始 sentiment140 推文表的外键。如果你想添加这些，完全可以。对于学习如何清理此数据集的目的而言，这并不是必要的。\n\
  \n现在我们的表已创建，是时候用我们从 tweet_text 列中仔细提取的数据填充它们了。我们将分别处理每种提取情况，首先从用户提及开始。\n\n## 提取用户提及\n\
  \n为了设计一个能够处理用户提及提取的流程，让我们先回顾一下我们对推文中提及的了解：\n\n- 用户提及总是以 @ 符号开头\n- 用户提及是 @ 符号后面紧跟的词\n\
  - 如果 @ 后面有空格，则不是用户提及\n- 用户提及本身内部没有空格\n- 由于电子邮件地址也使用 @，我们应注意它们\n\n使用这些规则，我们可以构造一些有效用户提及：\n\
  \n- @foo\n- @foobar1\n- @_1foobar_\n\n我们可以构造一些无效用户提及的示例：\n\n- @ foo（@ 后的空格使其无效）\n\
  - foo@bar.com（bar.com 不会被识别）\n- @foo bar（只有 @foo 会被识别）\n- @foo.bar（只有 @foo 会被识别）\n\
  \n> 在此示例中，我们假设我们不关心普通 @mention 和 .@mention 之间的区别，后者有时称为点提及。这些是 @ 符号前面带有一个句点的推文。它们旨在将推文推送给用户的全部关注者。\n\
  \n由于这套规则比我们能在 SQL 中高效执行的复杂得多，最好编写一个简单的脚本使用正则表达式来清理这些推文。我们可以用任何能连接数据库的语言编写此类脚本，例如\
  \ Python 或 PHP。由于我们在第 2 章《Fundamentals – Formats, Types, and Encodings》中使用 PHP 连接到数据库，这里也让我们使用一个快速的\
  \ PHP 脚本。此脚本连接到数据库，在 tweet_text 列中搜索用户提及，并将找到的提及移动到新的 sentiment140_mentions 表中：\n\
  \n```\n<?php\n// connect to db\n$dbc = mysqli_connect('localhost', 'username', 'password',\n\
  \    'sentiment140')\n    or die('Error connecting to database!' . mysqli_error());\n\
  $dbc->set_charset(\"utf8\");\n\n// pull out the tweets\n$select_query = \"SELECT\
  \ id, tweet_text FROM sentiment140\";\n$select_result = mysqli_query($dbc, $select_query);\n\
  \n// die if the query failed\nif (!$select_result)\n    die (\"SELECT failed! [$select_query]\"\
  \ . mysqli_error());\n\n// pull out the mentions, if any\n$mentions = array();\n\
  while($row = mysqli_fetch_array($select_result))\n{\n    if (preg_match_all(\n \
  \       \"/(?<!\\pL)@(\\pL+)/iu\",\n        $row[\"tweet_text\"],\n        $mentions\n\
  \    ))\n    {\n        foreach ($mentions[0] as $name)\n        {\n           \
  \ $insert_query = \"INSERT into sentiment140_mentions (id,\ntweet_id, mention) VALUES\
  \ (NULL,\" . $row[\"id\"] . \",'$name')\";\n            echo \"<br />$insert_query\"\
  ;\n            $insert_result = mysqli_query($dbc, $insert_query);\n           \
  \ // die if the query failed\n            if (!$insert_result)\n               \
  \ die (\"INSERT failed! [$insert_query]\" .\nmysqli_error());\n        }\n    }\n\
  }\n?>\n```\n\n在 sentiment140 表上运行这个小脚本后，我们看到从 498 条原始推文中提取出了 124 个唯一用户提及。关于此脚本的一些有趣之处包括它能够处理用户名中的\
  \ Unicode 字符，尽管此数据集中恰好没有。我们可以通过在 sentiment140 表末尾快速插入一条测试行来测试，例如：\n\n```\nINSERT\
  \ INTO sentiment140 (id, tweet_text) VALUES (99999, \"This is a @ тест\");\n```\n\
  \n然后再次运行脚本；你会看到 sentiment140_mentions 表中已添加一行，其中 @тест Unicode 用户提及已成功提取。在下一节中，我们将构建一个类似的脚本来提取话题标签。\n\
  \n## 提取话题标签\n\n话题标签有自己的规则，与用户提及略有不同。以下是一些可用于判断某物是否为话题标签的规则列表：\n\n- 话题标签以 # 符号开头\n\
  - 话题标签是 # 符号后面紧跟的词\n- 话题标签可以包含下划线，但不能有空格和其他标点符号\n\n将话题标签提取到自己的表中的 PHP 代码与用户提及代码大部分相同，唯一例外是代码中间的正则表达式。我们只需将\
  \ $mentions 变量更改为 $hashtags，然后调整正则表达式使其如下所示：\n\n```\nif (preg_match_all(\n    \"\
  /(#\\pL+)/iu\",\n    $row[\"tweet_text\"],\n    $hashtags\n))\n```\n\n此正则表达式表示我们感兴趣的是匹配大小写不敏感的\
  \ Unicode 字母字符。然后，我们需要更改 INSERT 行以使用正确的表和列名，如下所示：\n\n```\n$insert_query = \"INSERT\
  \ INTO sentiment140_hashtags (id, tweet_id, hashtag) VALUES (NULL,\" . $row[\"id\"\
  ] . \",'$name')\";\n```\n\n成功运行此脚本后，我们看到 sentiment140_hashtags 表中已添加了 54 个话题标签。许多推文包含多个话题标签，甚至比包含多个用户提及的推文还要多，例如，我们可以立即看到推文\
  \ 174 和 224 都包含多个嵌入话题标签。\n\n接下来，我们将使用相同的骨架脚本并再次修改它以提取 URL。\n\n## 提取 URL\n\n从文本中提取\
  \ URL 可能简单到查找以 http:// 或 https:// 开头的任何字符串，也可能变得非常复杂，这取决于文本字符串包含的 URL 类型，例如，一些字符串可能包含\
  \ file:// URL 或 torrent 链接，如 magnet URL，或其他类型的异常链接。在我们的 Twitter 数据的情况下，我们的情况稍微容易一些，因为数据集中包含的\
  \ URL 都以 HTTP 开头。因此，我们可以偷懒，只设计一个简单的正则表达式来提取跟随 http:// 或 https:// 的任何字符串。此正则表达式将如下所示：\n\
  \n```\nif (preg_match_all(\n    \"!https?://\\S+!\",\n    $row[\"tweet_text\"],\n\
  \    $urls\n))\n```\n\n\n\n然而，如果我们在喜爱的搜索引擎上稍微搜索一下，就会发现可以轻松找到一些相当令人印象深刻且实用的通用 URL\
  \ 匹配模式，这些模式能够处理更复杂的链接模式。这之所以有用，是因为如果我们编写的 URL 提取能够处理更复杂的情况，那么即使未来数据发生变化，它仍然会有效。\n\
  \n一个记录非常详尽的 URL 模式匹配例程在 http://daringfireball.net/2010/07/improved_regex_for_matching_urls\
  \ 网站上给出。下面的代码展示了如何修改我们的 PHP 代码以使用此模式在 Sentiment140 数据集中进行 URL 提取：\n\n```php\n<?php\n\
  // connect to db\n$dbc = mysqli_connect('localhost', 'username', 'password',\n \
  \   'sentiment140')\n    or die('Error connecting to database!' . mysqli_error());\n\
  $dbc->set_charset(\"utf8\");\n\n// pull out the tweets\n$select_query = \"SELECT\
  \ id, tweet_text FROM sentiment140\";\n$select_result = mysqli_query($dbc, $select_query);\n\
  \n// die if the query failed\nif (!$select_result)\n    die (\"SELECT failed! [$select_query]\"\
  \ . mysqli_error());\n\n// pull out the URLS, if any\n$urls = array();\n$pattern\
  \ = '#\\b(([\\\\w-]+://?|www[.] )[^\\s()<>]+(?:\\:[\\\\w\\d]+\\)|[^[:punct:]\\\\\
  s|/]))#';\n\nwhile($row = mysqli_fetch_array($select_result))\n{\n    echo \"<br/>working\
  \ on tweet id: \" . $row[\"id\"];\n    if (preg_match_all(\n        $pattern,\n\
  \        $row[\"tweet_text\"],\n        $urls\n    ))\n    {\n        foreach ($urls[0]\
  \ as $name)\n        {\n            echo \"<br/>---url: \".$name;\n            $insert_query\
  \ = \"INSERT into sentiment140_urls (id,\n            tweet_id, url)\nVALUES (NULL,\"\
  \ . $row[\"id\"] . \",'$name')\";\n            echo \"<br />$insert_query\";\n \
  \           $insert_result = mysqli_query($dbc, $insert_query);\n            //\
  \ die if the query failed\n            if (!$insert_result)\n                die\
  \ (\"INSERT failed! [$insert_query]\" .\n                mysqli_error());\n    \
  \    }\n    }\n}\n?>\n```\n\n此程序几乎与我们之前编写的提及提取程序相同，只有两个例外。首先，我们将正则表达式模式存储在一个名为 $pattern\
  \ 的变量中，因为它很长且复杂。其次，我们对数据库 INSERT 命令做了少量修改，就像我们为 hashtag 提取所做的那样。\n\n正则表达式模式的逐行完整解释可在其原始网站上找到，但简要说明是，所示模式将匹配任何\
  \ URL 协议，例如 http:// 或 file://，并且它还尝试匹配有效的域名模式以及数层深的目录/文件模式。源网站还提供了自己的测试数据集，如果你想查看它将匹配的各种模式以及一些肯定不会匹配的已知模式。\n\
  \n## 第八步 – 为查找表清理\n\n在“第七步 – 分离用户提及、hashtag 和 URL”部分，我们创建了新表来保存提取的 hashtag、用户提及和\
  \ URL，然后通过 id 列提供了一种将每一行链接回原始表的方法。我们遵循数据库规范化的规则，创建了表示推文与用户提及之间、推文与 hashtag 之间或推文与\
  \ URL 之间一对多关系的新表。在本步骤中，我们将继续优化此表以提高性能和效率。\n\n我们现在关注的列是 query_phrase 列。查看列数据，可以看到它包含反复重复出现的相同短语。这些显然是最初用于定位和选择现在存在于此数据集中的推文的搜索短语。在\
  \ sentiment140 表中的 498 条推文中，有多少查询短语是反复重复的？我们可以使用以下 SQL 来检测这一点：\n\n```\nSELECT count(DISTINCT\
  \ query_phrase)\nFROM sentiment140;\n```\n\n查询结果显示只有 80 个不同的查询短语，但这些短语在 498 行中反复使用。\n\
  \n在 498 行的表中，这可能看起来不是问题，但如果我们有一个极大的表，例如包含数亿行，我们应该对该列担心两件事。首先，反复重复这些字符串会占用数据库中不必要的空间，其次，搜索不同的字符串值速度非常慢。\n\
  \n为了解决这个问题，我们将创建一个 **查找表** 来存放查询值。每个查询字符串在这个新表中只存在一次，我们还将为每个字符串创建一个 ID 号。然后，我们将更改原始表，使其使用这些新的数值而不是当前使用的字符串值。我们实现此目的的步骤如下：\n\
  \n- 1. 创建一个新的查找表：\n  ```sql\n  CREATE TABLE sentiment140_queries (\n      query_id\
  \ int(11) NOT NULL AUTO_INCREMENT,\n      query_phrase varchar(25) NOT NULL,\n \
  \     PRIMARY KEY (query_id)\n  ) ENGINE=MyISAM DEFAULT CHARSET=utf8 AUTO_INCREMENT=1;\n\
  \  ```\n- 2. 使用不同的查询短语填充查找表，并自动为每个短语分配一个 query_id 编号：\n  ```sql\n  INSERT INTO sentiment140_queries\
  \ (query_phrase)\n  SELECT DISTINCT query_phrase FROM sentiment140;\n  ```\n- 3.\
  \ 在原始表中创建一个新列来保存查询短语编号：\n  ```sql\n  ALTER TABLE sentiment140\n  ADD query_id INT\
  \ NOT NULL AFTER query_phrase;\n  ```\n- 4. 在下一步出错以防万一备份 sentiment140 表。任何时候我们在表上执行\
  \ UPDATE，都最好先进行备份。要创建 sentiment140 表的副本，我们可以使用 phpMyAdmin 等工具轻松复制表（使用 Operations\
  \ 选项卡）。或者，我们可以重新创建一个表的副本，然后将原始表的行导入其中，如以下 SQL 所示：\n  ```sql\n  CREATE TABLE sentiment140_backup(\n\
  \      polarity int(1) DEFAULT NULL,\n      id int(5) NOT NULL,\n      date_of_tweet\
  \ varchar(30) CHARACTER SET utf8 DEFAULT NULL,\n      date_clean datetime DEFAULT\
  \ NULL COMMENT 'holds clean,\n      formatted date_of_tweet',\n      query_id int(11)\
  \ NOT NULL,\n      user varchar(25) CHARACTER SET utf8 DEFAULT NULL,\n      tweet_text\
  \ varchar(144) CHARACTER SET utf8 DEFAULT NULL ,\n      PRIMARY KEY (id)) ENGINE=MyISAM\
  \ DEFAULT CHARSET=utf8;\n\n  SET SQL_MODE='NO_AUTO_VALUE_ON_ZERO';\n  INSERT INTO\
  \ sentiment140_backup SELECT * FROM sentiment140;\n  ```\n- 5. 用正确的编号填充新列。为此，我们将两个表按其文本列连接起来，然后从查找表中查找正确的编号值，并将其插入\
  \ sentiment140 表中。在以下查询中，每个表都已分配别名 s 和 sq：\n  ```sql\n  UPDATE sentiment140 s\n\
  \  INNER JOIN sentiment140_queries sq\n  ON s.query_phrase = sq.query_phrase\n \
  \ SET s.query_id = sq.query_id;\n  ```\n- 6. 删除 sentiment140 表中的旧 query_phrase 列：\n\
  \  ```sql\n  ALTER TABLE sentiment140\n  DROP query_phrase;\n  ```\n\n此时，我们有一种有效的方式来创建短语列表，如下所示。\n\
  这些按字母顺序显示：\n\n```\nSELECT query_phrase\nFROM sentiment140_queries\nORDER BY 1;\n\
  ```\n\n我们也可以通过在两个表之间执行连接来查找具有给定短语（baseball）的推文：\n\n```\nSELECT s.id, s.tweet_text,\
  \ sq.query_phrase\nFROM sentiment140 s\nINNER JOIN sentiment140_queries sq\nON s.query_id\
  \ = sq.query_id\nWHERE sq.query_phrase = 'baseball';\n```\n\n此时，我们有一个清理过的 sentiment140\
  \ 表和四个新表来保存各种提取和清理后的值，包括 hashtag、用户提及、URL 和查询短语。我们的 tweet_text 和 date_clean 列是干净的，并且我们有一个查询短语的查找表。\n\
  \n## 第九步 – 记录你所做的工作\n\n经过九步清理并使用多种语言和工具，毫无疑问我们会在某个时候犯错并不得不重复某个步骤。如果我们必须向他人描述我们做了什么，我们几乎肯定会难以记住确切的步骤以及我们做每件事的所有原因。\n\
  \n为了在过程中避免错误，保留清理步骤日志至关重要。至少，日志应按执行顺序包含以下内容：\n\n- 每条 SQL 语句\n- 每个 Excel 函数或文本编辑器例程，包括必要时的屏幕截图\n\
  - 每个脚本\n- 关于为何执行每项操作的说明和注释\n\n另一个绝佳的想法是在每个阶段创建表的备份，例如，我们在对 sentiment140 表执行 UPDATE\
  \ 之前创建了备份，并且我们讨论过在创建新的 date_clean 列后进行备份。备份很容易完成，如果你决定不需要它，随时可以删除备份的表。\n\n## 摘要\n\
  \n在本章中，我们使用了一个示例数据集，即名为 Sentiment140 的推文集合，来学习如何在关系数据库管理系统 中清理和操作数据。我们在 Excel 中执行了一些基本的清理操作，然后回顾了如何将数据从\
  \ CSV 文件中取出并导入数据库。此时，其余的清理操作都在 RDBMS 内部完成。我们学习了如何将字符串操作为正确的日期，然后着手从推文文本中提取三种类型的数据，最终将这些提取的值移动到新的、干净的表中。接下来，我们学习了如何创建当前存储效率低下的值的查找表，从而允许我们用高效的数值查找值更新原始表。最后，由于我们执行了许多步骤，并且总有可能出现错误或对我们所做的事情的沟通不畅，我们回顾了一些记录清理过程的策略。\n\
  \n在下一章中，我们将转换视角，从清理给定的数据转向为他人使用而准备清理后的数据。我们将学习一些最佳实践，以创建需要他人最少清理的数据集。\n\n\n"
- "# 第8章：共享干净数据的最佳实践\n\n## 分享干净数据的最佳实践\n\n迄今为止，在本书中，我们学习了许多不同的清理和组织数据集的方法。也许现在是时候考虑让他人使用我们清理过的数据了。本章的目标是介绍一些邀请朋友进入你的数据科学厨房的最佳实践。分享你的数据可能意味着将其提供给其他人、其他团队，甚至只是你未来的某个版本。怎样才能最好地将数据打包供他人使用？应该如何告知人们你所拥有的清理数据？如何确保你所有的辛苦工作都得到署名？\n\
  \n在本章中，我们将学习：\n\n- 如何呈现和打包你的清理数据\n- 如何为数据中包含的内容提供清晰的文档\n- 如何通过许可你的清理数据来保护和扩展你的辛苦工作\n\
  - 如何找到并评估宣传你的清理数据的选项\n\n在开始本章之前，我们应该明确指出的一点是，我们只能清理和分享我们有权分享的数据。也许这看起来显而易见，但值得重复。本章的全部内容都假设你只是在清理，并且随后分享你实际上有权以这种方式使用的数据。如果你对此有疑问，请阅读本章的\
  \ *为你的数据设定条款和许可* 部分，并确保你遵循与要求用户遵循相同的准则。\n\n## 准备干净的数据包\n\n在本节中，我们将深入探讨在你能够发布数据包供公众使用之前需要回答的许多重要问题。\n\
  \n你希望人们如何访问你的数据？如果它在数据库中，你希望用户能够登录并在上面运行 SQL 命令吗？还是你希望为他们创建可下载的纯文本文件供使用？你需要为数据创建\
  \ API 吗？无论如何你有多少数据，你是否希望对数据的不同部分提供不同级别的访问权限？\n\n分享干净数据的技术方面极其重要。一般来说，从简单的事情开始，并在需要时再转向更复杂的分发计划可能是个好主意。以下是一些分发数据的选项，按从最不复杂到最复杂的顺序排列。当然，随着复杂性的增加，带来的好处也越大：\n\
  \n- **压缩纯文本** – 这是一种风险很低的分发方法。正如我们在第 2 章 *基础 – 格式、类型和编码* 中学到的，纯文本可以被压缩以创建非常小的文件大小。简单的\
  \ CSV 或 JSON 文件具有通用用途，并且可以轻松转换为许多其他格式。需要考虑的一些事项包括：\n  - 你将如何让用户下载文件？网页上的开放链接极其简单方便，但它不允许你要求用户名和密码等凭据来访问文件。如果这对你很重要，那么你将不得不考虑其他分发文件的方法；例如，使用带用户名和密码的\
  \ FTP 服务器或使用 Web 服务器的访问控制。\n  - 你的文件有多大？你预计会有多少流量？在开始额外收费之前，你的主机提供商允许多少流量？\n- **压缩\
  \ SQL 文件** – 分发 SQL 文件允许你的用户在自己的系统上重建你的数据库结构和数据。需要考虑的一些事项包括：\n  - 你的用户可能运行的数据库系统与你不同，因此他们无论如何都必须清理数据。直接给他们纯文本可能更有效率。\n\
  \  - 你的数据库系统可能有与他们不同的服务器设置，因此你必须提前澄清这些自定义设置。\n  - 你还需要提前计划你的数据集是否设计为随时间增长，例如，通过决定你是否只提供\
  \ `UPDATE` 语句，还是你将始终提供足够的 `CREATE` 和 `INSERT` 语句来重建整个数据库。\n- **实时数据库访问** – 为用户提供直接访问你的数据库是一种非常好的方式，让他们在低层级与你的数据交互。需要考虑的一些事项包括：\n\
  \  - 提供实时访问确实要求你为每个用户设置单独的用户名和密码，这意味着需要跟踪用户。\n  - 因为你有可识别的用户，你需要提供一种方式与他们就支持问题进行沟通，包括丢失凭据和如何使用系统。\n\
  \  - 除非你也在数据库上构建了安全的[content]\n## 8\n\n## 分享干净数据的最佳实践\n\n迄今为止，在本书中，我们学习了许多不同的清理和组织数据集的方法。也许现在是时候考虑让他人使用我们清理过的数据了。本章的目标是介绍一些邀请朋友进入你的数据科学厨房的最佳实践。分享你的数据可能意味着将其提供给其他人、其他团队，甚至只是你未来的某个版本。怎样才能最好地将数据打包供他人使用？应该如何告知人们你所拥有的清理数据？如何确保你所有的辛苦工作都得到署名？\n\
  \n在本章中，我们将学习：\n\n- 如何呈现和打包你的清理数据\n- 如何为数据中包含的内容提供清晰的文档\n- 如何通过许可你的清理数据来保护和扩展你的辛苦工作\n\
  - 如何找到并评估宣传你的清理数据的选项\n\n在开始本章之前，我们应该明确指出的一点是，我们只能清理和分享我们有权分享的数据。也许这看起来显而易见，但值得重复。本章的全部内容都假设你只是在清理，并且随后分享你实际上有权以这种方式使用的数据。如果你对此有疑问，请阅读本章的\
  \ *为你的数据设定条款和许可* 部分，并确保你遵循与要求用户遵循相同的准则。\n\n## 准备干净的数据包\n\n在本节中，我们将深入探讨在你能够发布数据包供公众使用之前需要回答的许多重要问题。\n\
  \n你希望人们如何访问你的数据？如果它在数据库中，你希望用户能够登录并在上面运行 SQL 命令吗？还是你希望为他们创建可下载的纯文本文件供使用？你需要为数据创建\
  \ API 吗？无论如何你有多少数据，你是否希望对数据的不同部分提供不同级别的访问权限？\n\n分享干净数据的技术方面极其重要。一般来说，从简单的事情开始，并在需要时再转向更复杂的分发计划可能是个好主意。以下是一些分发数据的选项，按从最不复杂到最复杂的顺序排列。当然，随着复杂性的增加，带来的好处也越大：\n\
  \n- **压缩纯文本** – 这是一种风险很低的分发方法。正如我们在第 2 章 *基础 – 格式、类型和编码* 中学到的，纯文本可以被压缩以创建非常小的文件大小。简单的\
  \ CSV 或 JSON 文件具有通用用途，并且可以轻松转换为许多其他格式。需要考虑的一些事项包括：\n  - 你将如何让用户下载文件？网页上的开放链接极其简单方便，但它不允许你要求用户名和密码等凭据来访问文件。如果这对你很重要，那么你将不得不考虑其他分发文件的方法；例如，使用带用户名和密码的\
  \ FTP 服务器或使用 Web 服务器的访问控制。\n  - 你的文件有多大？你预计会有多少流量？在开始额外收费之前，你的主机提供商允许多少流量？\n- **压缩\
  \ SQL 文件** – 分发 SQL 文件允许你的用户在自己的系统上重建你的数据库结构和数据。需要考虑的一些事项包括：\n  - 你的用户可能运行的数据库系统与你不同，因此他们无论如何都必须清理数据。直接给他们纯文本可能更有效率。\n\
  \  - 你的数据库系统可能有与他们不同的服务器设置，因此你必须提前澄清这些自定义设置。\n  - 你还需要提前计划你的数据集是否设计为随时间增长，例如，通过决定你是否只提供\
  \ `UPDATE` 语句，还是你将始终提供足够的 `CREATE` 和 `INSERT` 语句来重建整个数据库。\n- **实时数据库访问** – 为用户提供直接访问你的数据库是一种非常好的方式，让他们在低层级与你的数据交互。需要考虑的一些事项包括：\n\
  \  - 提供实时访问确实要求你为每个用户设置单独的用户名和密码，这意味着需要跟踪用户。\n  - 因为你有可识别的用户，你需要提供一种方式与他们就支持问题进行沟通，包括丢失凭据和如何使用系统。\n\
  \  - 除非你也在数据库上构建了安全的\n\n- 其次，GitHub 有一些相当严格的文件大小限制。它将每个项目（仓库）的限制列为 1GB，每个文件的限制列为\
  \ 100MB。我发布的大多数数据文件单独来看都小于该限制，但由于我每年多次发布许多时间序列文件，我将不得不为它们创建多个仓库。在这种方案下，每次我发布新文件时，都必须评估是否接近文件大小限制。这很快就会成为一个大麻烦。\n\
  \n简而言之，GitHub 本身建议使用网络托管解决方案来分发文件，特别是如果它们很大或以数据库为导向。如果您决定在 GitHub 上托管，请务必注意不要发布包含用户凭据的文件。这包括发布数据库系统的用户名和密码、Twitter\
  \ 的身份验证密钥和密钥，或任何其他个人详细信息。由于 GitHub 本质上是一个 Git 仓库，错误将永远存在，除非仓库本身被删除。如果您发现自己确实犯了错误并将个人详细信息发布到\
  \ GitHub，您必须立即取消所有当前账户的身份验证并重新创建所有密钥和密码。\n\n## 记录您的数据\n\n一旦人们能够访问数据，最好是在此之前，他们就需要知道自己得到的是什么。对您来说，记录数据可能感觉像是事后才想到的，但对您的用户来说却极其重要，因为他们对数据或您对数据所做的所有处理都不熟悉。在本节中，我们将回顾一些可以添加到您的数据包中以使其更易于理解的内容。\n\
  \n## README 文件\n\n简单的 README 文件在计算领域有着悠久的历史。它只是一个文本文件，随软件包一起分发，或存放在包含其他文件的目录中，其理念是用户在开始使用其余软件包或文件之前应先阅读\
  \ README 文件。README 文件会向用户提供有关软件包的重要信息，例如谁编写了它以及为什么、安装说明、已知错误以及使用文件的基本说明等。\n\n如果您正在构建数据包，例如装满文本或\
  \ SQL 文件的压缩文件，在压缩之前快速轻松地向文件包添加一个 `README` 文件。如果您为文件制作网站或在线目录，在显眼的位置添加 `README` 文件会非常有帮助。以下截图显示了我用来分发我参与的一个项目文件的一个网络目录，名为\
  \ **FLOSSmole**。我添加了一个 `README` 目录，其中包含我希望用户首先阅读的所有文件。我在该目录名称前加上了下划线，以便它在列表中按字母顺序始终显示在顶部：\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_200_0.png)\n\n网站上的文件目录显示 README 文件位于顶部。\n\
  \n在 `README.txt` 文件中，我为用户提供有关文件的一般和具体说明。以下是我在该目录中为我的数据提供的 `README` 文件示例：\n\n```\n\
  README for http://flossdata.syr.edu/data directory\n\nWhat is this place?\nThis\
  \ is a repository of flat files or data \"dumps\", from the FLOSSmole project.\n\
  \nWhat is FLOSSmole?\nSince 2004, FLOSSmole aims to:\n  --freely provide data about\
  \ free, libre, and open source software (FLOSS) projects in multiple formats for\
  \ anyone to download;\n  --integrate donated data & scripts from other research\
  \ teams;\n  --provide a community for researchers to discuss public data about FLOSS\
  \ development.\n```\n\nFLOSSmole 包含：涵盖 2004 年至今的数十 TB 数据，并随着来自近 10,000 次基于网络的采集操作的数据集而不断增长，每月都在增长。这包括数百万个开源项目及其开发人员的数据。\n\
  \n如果您使用 FLOSSmole 数据，请相应地引用：\nHowison, J., Conklin, M., & Crowston, K. (2006). FLOSSmole:\
  \ A collaborative repository for FLOSS research data and analyses. International\
  \ Journal of Information Technology and Web Engineering, 1(3), 17-26.\n\n本网站包含什么？\n\
  来自各种软件锻造厂和项目的平面文件，均带有日期和时间戳。我们的数据库中还有大量其他数据，这里以平面文件形式不可用。例如，来自各个项目的 IRC 日志和电子邮件。有关这些，请参阅以下内容：\n\
  \n- 1. 直接数据库访问。请使用此链接直接访问我们的 MySQL 数据库：http://flossmole.org/content/direct-db-access-flossmole-collection-available\n\
  - 2. FLOSSmole 网站。包括更新、可视化和示例。http://flossmole.org/\n\n此示例 README 文件适用于整个文件目录，但您可以为每个文件或不同目录提供\
  \ README 文件。由您决定。\n\n## 文件头\n\n向用户传达信息的另一种有效方式，尤其是在创建文本或 SQL 命令的平面文件时，是在每个文件顶部放置一个标题，解释其格式和用法。常见做法是用类似注释的字符（如\
  \ # 或 //）为标题的每一行加上前缀。\n\n文件头中通常包含的一些项目包括：\n\n- 文件的名称以及其所在的包的名称\n- 参与创建的人员姓名及其组织和位置\n\
  - 发布日期\n- 其版本号，或查找文件早期版本的位置\n- 文件的用途\n- 数据最初来自何处，以及从那时到现在对数据所做的任何更改\n- 文件的格式及其组织方式，例如列出字段及其含义\n\
  - 文件的使用条款或许可\n\n以下示例显示了我其中一个数据项目分发的一个 TSV 文件的示例头。在其中，我解释了数据是什么以及如何解释文件中的每一列。我还解释了如何引用数据以及共享数据的政策。我们将在本章后面讨论许可和共享的选项：\n\
  \n```\n# Author: Squire, M. & Gazda, R.\n# License: Open Database License 1.0\n\
  # This data 2012LTinsultsLKML.tsv.txt is made available under the\n# Open Database\
  \ License: http://opendatacommons.org/licenses/\n# odbl/1.0/.\n#\n# filename: 2012LTinsultsLKML.tsv.txt\n\
  # explanation: This data set is part of a larger group of data\n# sets described\
  \ in the paper below, and hosted on the\n# FLOSSmole.org site. Contains insults\
  \ gleaned from messages sent\n# to the LKML mailing list by Linus Torvalds during\
  \ the year 2012\n#\n# explanation of fields:\n# date: this is the date the original\
  \ email was sent\n# markmail permalink: this is a permalink to the email on markmail\n\
  # (for easy reading)\n# type: this is our code for what type of insult this is\n\
  # mail excerpt: this is the fragment of the email containing the\n# insult(s). Ellipses\
  \ (...) have been added where necessary.\n#\n# Please cite the paper and FLOSSmole\
  \ as follows:\n#\n# Squire, M. & Gazda, R. (2015). FLOSS as a source for profanity\n\
  # and insults: Collecting the data. In Proceedings of 48th\n# Hawai'i International\
  \ Conference on System Sciences (HICSS-48).\n# IEEE. Hawaii, USA. 5290-5298\n#\n\
  # Howison, J., Conklin, M., & Crowston, K. (2006). FLOSSmole: A\n# collaborative\
  \ repository for FLOSS research data and analyses.\n# International Journal of Information\
  \ Technology and Web\n# Engineering, 1(3), 17-26.\n```\n\n如果您预计用户会定期收集您的数据文件，您应在使用标题的注释字符时保持一致。在前面的示例中，我使用了\
  \ # 字符。原因在于您的用户可能会编写程序自动下载和解析您的数据，也许将其加载到数据库中或在程序中使用。您对注释字符的一致使用将允许用户跳过标题而不处理它们。\n\
  \n## 数据模型和图表\n\n如果您分发 SQL 文件来构建数据库，或提供对数据库的实时查询访问，您可能会发现诸如 **entity-relationship\
  \ diagram (ERD)** 之类的可视化图表会真正帮助您的用户。\n\n在我的一些项目中，我喜欢同时提供表格的文本描述，例如前面描述的标题和 README\
  \ 文件，以及表格及其之间关系的视觉图表。由于我分发的数据库非常庞大，我还会对图表进行着色，并对图表的每个部分进行注释，以指示数据库该部分内部的内容。\n\n\
  以下截图显示了我其中一个大型图表的高级概述。它已缩小以显示 ERD 的大小：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_203_0.png)\n\
  \n\n\n由于此 ERD 有点令人不知所措且难以阅读，即使在大显示器上也是如此，我已对数据库的每个独立部分进行了着色，并在需要的地方提供了注释。以下是大图中左上角橙色部分的更近视图的屏幕截图：\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_204_0.png)\n\n数据库其中一个部分的特写视图，包括描述表用途的注释。\n\
  \n通过阅读此图，用户可以很好地了解数据库的不同部分如何相互配合。重要的是，高级注释直接显示在图表上，而当用户想要了解某个特定字段的更详细信息时，他们可以参考\
  \ README 文件或该特定文件中的标题。\n\n要创建 ERD，您可以使用任意数量的 RDBMS 工具，包括 MySQL Workbench（这是我用来创建您在此处看到的彩色版本的那一个）。其他流行的工具包括\
  \ Microsoft Visio、Sparx Enterprise Architect 和 draw.io。这些工具中的许多允许您连接到 RDBMS 并从现有数据库反向工程图表，或从绘图正向工程\
  \ SQL 语句。在任何一种情况下，ERD 都肯定会帮助您的用户更好地理解数据模型。\n\n## 文档 Wiki 或 CMS\n\n保持项目所有文档井然有序的另一种方法是将其发布到\
  \ Wiki 或内容管理系统（CMS）。用于此目的的 CMS 和 Wiki 软件包有数百种，但流行选项包括 MediaWiki、WordPress、Joomla!\
  \ 和 Drupal。GitHub 也为托管在其上的项目提供 Wiki 服务，一些其他软件托管服务（如 Sourceforge 和 Bitbucket）也是如此。\n\
  \n您可以使用 CMS 或 Wiki 提供文件本身的下载链接，并使用 CMS 发布文档和说明。我也在自己的工作中使用过 CMS 来托管更新博客、显示示例图表的可视化、基于数据构建的图表，以及用户可能在处理我的数据时觉得有帮助的脚本存储库。\n\
  \n以下是大多数数据导向项目在文档 CMS 或 Wiki 中包含的一些常见部分：\n\n- **关于项目** — 这告诉用户数据项目的目的以及如何联系项目负责人。本部分还可能包括如何参与的想法，如何加入邮件列表或讨论区，或如何联系项目负责人。\n\
  - **获取数据** — 这解释了访问数据的不同机制。常见选择包括直接数据库访问、文件下载或 API。本部分还解释任何特殊的注册或登录程序。\n- **使用数据**\
  \ — 这包括入门查询、使用示例、基于数据构建的图形以及图表和 ERD。它提供其他人使用数据所做事情的链接。本部分还解释（如果必要）您对数据引用的期望和任何许可政策。\n\
  \n在本节中，我们讨论了记录数据的各种方法，包括 READMEs、文件头、ERDs 和基于 Web 的解决方案。在整个讨论中，我们提到了许可数据的概念以及解释您对引用和共享数据的期望。在下一节中，我们将更深入地探讨许可您的数据集的具体细节。\n\
  \n## 为您的数据设定条款和许可\n\n数据分发计划的任何重要部分都是决定您对用户如何引用、共享或混搭您的数据的期望。您希望用户如何使用您的数据的期望列表称为数据的\
  \ **使用条款** (**ToU**)。ToU 还可能赋予用户特定权利，例如修改或重新分发数据的能力。您授予用户的这些权利集合称为 **数据许可**。用户可以根据是否同意遵守其\
  \ ToU 来选择是否使用您的数据集。他们还可以根据其许可是否允许他们想要对数据执行的操作来决定是否使用数据。\n\n在本节中，我们将概述您可以为用户如何与您的数据交互设定期望的几种选择。我们还将回顾您可能希望包含在\
  \ ToU 中的一些最常见项目，以及可应用于您的数据集的一些更常见的预制许可。\n\n## 常见使用条款\n\n并非每个人分享数据的目标都相同，例如，我参与的一个项目的具体目标是为科学界收集、清理和重新分发数据。因为我是大学教授，我的工作职责的一部分是发表对他人有用的学术研究论文、软件和数据集。因此，对我来说，人们在使用时引用我的论文和已发布的数据集很重要。然而，我的另一位朋友不是学术界人士，他经常完全匿名发布数据集，并且在使用该数据时没有任何引用或通知的期望。\n\
  \n以下是设定您的数据使用期望时常见的考虑因素列表：\n\n- **引用** – 您是否希望基于您的数据发表某物的作者明确说明他们的数据来自您？如果是这样，他们应该使用什么\
  \ URL 或参考？\n- **隐私** – 您是否有关于保护用户或其信息的隐私的任何规则？您是否希望您的用户遵守任何特定的隐私指南或研究指南？例如，有些人要求用户遵循与他们自己的\
  \ **机构审查委员会 (IRB)** 或其他研究伦理团体（例如 **互联网研究者协会 (AOIR)**）类似的程序。\n- **数据的适当用途** – 您是否怀疑您的数据集可能以某种方式被滥用？数据是否可能被断章取义？其内容是否可能以有害的方式与其他数据集结合？对于某些项目，为用户设定他们可以使用您提供的数据的方式的期望将是非常好的主意。\n\
  - **联系** – 您是否希望数据用户以特定方式通知您他们正在使用数据？他们是否需要通知您？如果您预计用户对数据有疑问或担忧，那么关于如何以及为何联系您（作为数据集提供者）的指南是有帮助的。\n\
  \n正如我们在本章的 *记录你的数据* 部分前面讨论的那样，数据集的 ToU 可以在 README 文件内、文件头内或网站上提供给潜在用户。如果您提供实时数据库访问，您还可以通知潜在用户，通过接受数据库系统的用户名和密码，他们同意遵守您的条款。类似的结构也可以用于\
  \ API 访问，其中积极使用身份验证令牌或访问凭据表明用户同意您的 ToU。\n\n当然，所有这些最佳实践都受各种国际国家和组织的法律和政策的约束。没有一点帮助就试图把这一切都做对可能会非常复杂。为了帮助数据提供者为用户设定期望，随着时间的推移出现了一些通用许可方案。我们现在将讨论其中两种：\n\
  \n## 知识共享\n\n**知识共享 (CC)** 许可是对受版权保护或可版权保护的材料提供者可以应用于其作品的预包装、通用规则集。这些许可规定了作品用户被允许做什么。通过提前说明许可，作品所有者可以避免为每个想要更改或重新分发特定作品的人授予单独许可。\n\
  \nCC 的问题——这可能根本不是您的问题，取决于您如何使用它——是 CC 许可旨在应用于可版权作品。您的数据库或数据集是否可版权？您是否有兴趣许可数据库的内容，还是数据库本身？为了帮助您回答这个问题，我们将指引您阅读\
  \ Creative Commons Wiki，该 Wiki 以比我们在这里希望做的更详细的程度解决了这个问题的所有考虑因素。该页面甚至有一个专门关于数据和数据库的常见问题解答部分：https://wiki.creativecommons.org/Data.\n\
  \n\n\n## ODbL 与开放数据公用\n\n许可数据的另一个不错选择是 **开放数据库许可 (ODbL)**。这是一种专门为数据库设计的通用许可。**开放知识基金会\
  \ (OKF)** 创建了一份关于如何开放数据的两分钟指南，您可以在此处找到：http://OpenDataCommons.org/guide/。\n\n如果您想要更多选择，http://OpenDefinition.org\
  \ 网站也是 OKF 的一部分，它提供了更多可预先打包的许可供您应用于数据集。这些许可范围从非常开放的公共领域风格许可，一直到要求署名和分享衍生作品的许可。此外，他们还提供了一本《开放数据手册》，它在引导您思考数据库或数据集中的知识产权以及您想如何使用它方面非常有帮助。您可以从此处下载《开放数据手册》或在线浏览：http://OpenDataHandbook.org。\n\
  \n## 公布您的数据\n\n一旦您拥有完整的数据包，就该向世界介绍它了。公布您数据的存在将确保尽可能多的人使用它。如果您已经为数据设想了用户社区，公布它可能只需在邮件列表或发送给特定研究组一个\
  \ URL 就行。不过，有时我们创建的数据集可能对更大、更模糊的群体感兴趣。\n\n## 数据集列表\n\n网上有很多数据集合列表，其中大多数围绕某种主题组织。这类元集合（集合的集合）的出版商通常很乐意列出符合其细分领域的新数据源。元集合主题可以包括：\n\
  \n- 与同一主题相关的数据集，例如，音乐数据、生物数据或新闻报道文章的集合\n- 与解决同一类型问题相关的数据集，例如，可用于开发推荐系统的数据集或用于训练机器学习分类器的数据集\n\
  - 与特定技术问题相关的数据集，例如，旨在基准测试或测试特定软件或硬件设计的数据集\n- 为特定系统设计使用的数据集，例如，针对学习 R 等编程语言、Tableau\
  \ 等数据可视化服务或 Amazon Web Services 等云平台优化的数据集\n- 所有具有相同类型许可的数据集，例如，仅列出公共领域数据集合或仅列出已获准用于学术研究的数据\n\
  \n如果您发现您的数据集在这些列表中没有得到充分代表，或不符合现有元集合的要求，另一个选择是建立自己的数据存储库。\n\n## Stack Exchange 上的开放数据\n\
  \nStack Exchange 上的开放数据区域，网址为 http://opendata.stackexchange.com，是与开放数据集相关的问答集合。我在这里找到有趣数据集的例子很多，有时我也能向其他人展示如何使用我自己的数据集来回答问题。这个问答网站也是了解人们有什么样的问题以及他们喜欢使用的数据格式的好方法。\n\
  \n在 Stack Exchange 上将您的数据作为某人问题的解决方案进行宣传之前，请确保您的访问方法、文档和许可符合标准，使用本章前面讨论的指南。这在 Stack\
  \ Exchange 上尤其重要，因为用户可以对问题和答案进行点踩。您最不想做的事情就是带着一堆损坏的链接和令人困惑的文档来宣传您的数据。\n\n## 黑客松\n\
  \n让人们参与您数据的另一种有趣方式是将其作为黑客松的可使用数据集进行宣传。数据黑客松通常是为期一天或多天的活动，程序员和数据科学家聚在一起在数据集上练习不同技术，或使用数据解决特定类别的问题。\n\
  \n简单的搜索引擎查询“数据黑客松”会向您展示当前黑客松的关注重点。其中一些由公司赞助，一些旨在应对社会问题。大多数都有维基或其他方法，可以在黑客松当天可使用的数据集列表中添加您的\
  \ URL 和数据的简要描述。我犹豫是否推荐其中某一个，因为黑客松的本质就是发生一次然后演变并改变成其他东西。它们也往往在不规律的时间举行，并由临时小组组织。\n\
  \n如果您的数据集是出于学术目的而设计的，例如，如果它是研究数据集，您可以考虑在学术会议的研讨会或海报环节期间举办自己的黑客松。这是一种让人们参与操作您数据的方式，至少，您可能会从会议的与会者那里获得有关如何改进您的数据或他们认为您应该构建哪些数据集的良好反馈。\n\
  \n## 摘要\n\n在本章中，我们研究了分享我们清理后的数据的各种可能性。我们讨论了数据打包和分发不同方式的各种解决方案和权衡。我们还回顾了提供文档的基础知识，包括用户最需要了解的重要事项以及如何在文档文件中传达这些内容。我们注意到许可和使用条款几乎总是出现在文档中，但它们意味着什么，您应该如何为数据选择一个？我们回顾了一些数据项目常见的使用条款，以及最常见的许可方案：知识共享许可和\
  \ ODbL。最后，我们集思广益了一些宣传您数据的方法，包括数据元集合、开放数据 Stack Exchange 网站和以数据为中心的黑客松。\n\n在本书的这个阶段，您已经看到了数据清理的完整从头到尾概述。接下来的两章包含更长、更详细的项目，将让您在实践中使用本书前面学到的技能来接触数据清理任务。\n"
- "# 第9章：Stack Overflow 项目\n\n## Stack Overflow 项目\n\n这是两个完整的、篇幅为一章的项目中的第一个，我们将在其中将我们所学到的数据清理知识付诸实践。我们可以将每个项目视为一次晚宴，在那里我们展示我们数据科学厨房的最佳技能。为了举办一次成功的晚宴，我们当然应该提前规划好菜单和宾客名单。然而，真正专家的标志是我们如何应对事情没有完全按计划进行的情况。尽管我们精心准备了食谱和购物清单，但我们都曾有过忘记购买重要配料的那一刻。我们能否调整计划来应对沿途遇到的新挑战？\n\
  \n在本章中，我们将使用公开发布的 Stack Overflow 数据库转储来处理一些数据清理。Stack Overflow 是 Stack Exchange\
  \ 问答网站家族的一部分。在这些网站上，撰写好的问题和答案可以让用户获得随时间累积的积分和徽章。为了练习我们的数据清理技能，我们将使用我们在 *第1章，为什么需要干净的数据？*\
  \ 中介绍的相同的六步方法。\n\n- 决定我们试图解决的问题类型——为什么要查看这些数据？\n- 收集和存储我们的数据，这包括下载和提取 Stack Overflow\
  \ 提供的数据库转储，创建 MySQL 数据库来保存数据，并编写脚本将数据导入 MySQL 数据库。由于 Stack Overflow 数据集非常庞大，我们还将创建一些较小的测试表，填充随机选择的行。\n\
  - 在尝试清理整个数据集之前，对测试表执行一些试清理任务。\n- 分析数据。我们需要执行任何计算吗？我们应该编写一些聚合函数来计数或汇总数据吗？我们需要以某种方式转换数据吗？\n\
  \n\n\n- 如果可能，提供数据的可视化。\n- 解决我们设定的研究问题。我们的流程有效吗？我们成功了吗？\n\n这工作量很大，但我们提前准备得越多、越早开始，就越有可能让我们的数据科学晚宴派对取得成功。\n\
  \n## 第一步 – 关于 Stack Overflow 的提问\n\n为了启动我们的项目，我们需要提出一个相当有趣的问题，该问题需要一些简单的数据分析来回答。我们应该从哪里开始？首先，让我们回顾一下我们对\
  \ Stack Overflow 的了解。我们知道它是一个面向程序员的问答网站，可以假设程序员在他们提问和回答的问题中很可能使用了大量源代码、错误日志和配置文件。此外，我们知道，有时在像\
  \ Stack Overflow 这样的基于网络的平台上发布这些长文本转储会很尴尬，因为行长度、格式和其他可读性问题。\n\n看到如此多包含令人沮丧的大量文本的问题和答案，我想知道\
  \ Stack Overflow 上的程序员是否会通过外部粘贴站点（如 Pastebin 或 JSFiddle）链接到他们的代码或日志文件，例如 http://www.Pastebin.com\
  \ 是一个网站，您可以在其中粘贴大量文本，例如源代码或日志文件，网站会为您提供一个可以与他人共享的简短 URL。大多数粘贴站点还允许进行源代码语法高亮，而 Stack\
  \ Overflow 默认不这样做。\n\n在 IRC 和电子邮件中使用粘贴站点非常常见，但 Stack Overflow 呢？一方面，就像在 IRC 或电子邮件中一样，提供链接可以使问题或答案更短，因此其余问题更容易阅读。但另一方面，根据使用的粘贴站点，URL\
  \ 不保证永远可用。这意味着问题或答案可能因链接腐烂而随着时间的推移失去价值。\n\n像 JSFiddle 这样的工具以一种额外的方式使这个问题复杂化。在像 JSFiddle\
  \ 这样的交互式粘贴站点上，您不仅可以粘贴源代码并获取其 URL，还可以允许其他人在浏览器中直接编辑和运行代码。这在 Stack Overflow 的问答场景中可能非常有帮助，尤其是在基于浏览器的语言（如\
  \ JavaScript）中。然而，链接腐烂的问题仍然存在。此外，对于初学者来说，JSFiddle 比简单的代码转储站点（如 Pastebin）使用起来稍微复杂一些。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_213_0.png)\n\nJSFiddle 有四个窗口，分别用于 HTML、CSS、JavaScript\
  \ 和结果。\n\n> 在 Stack Overflow 的社区讨论区，关于是否应该使用粘贴站点以及包含粘贴站点链接而没有实际代码的问题或答案的政策，应该如何处理，存在相当多的争论。总的来说，尽管人们倾向于同意粘贴站点可能有用，但他们也认识到保护\
  \ Stack Overflow 本身的持久性和实用性很重要。社区已决定应避免发布仅包含链接而没有代码的问题或答案。如果你想回顾该讨论，可以从此链接开始： http://meta.stackexchange.com/questions/149890/。\n\
  \n就我们而言，我们不需要在这场辩论中选边站队。相反，我们可以提出一些简单的数据驱动问题，例如：\n\n- 1. 人们在 Stack Overflow 上使用\
  \ Pastebin 和 JSFiddle（以及其他类似的粘贴站点）的频率有多高？\n- 2. 他们在问题中使用粘贴站点更多还是在答案中使用？\n- 3. 引用粘贴站点\
  \ URL 的帖子是否也倾向于包含源代码；如果是，包含多少？\n\n我们可以在收集、存储和清理 Stack Overflow 数据时使用这些问题作为我们的动机。即使最终发现其中一些问题太难或无法回答，记住我们的总体目的将有助于指导我们需要进行哪种清理。把问题放在我们思维的前沿将阻止我们偏离轨道或执行最终会证明是徒劳或浪费时间的任务。\n\
  \n## 第二步 – 收集和存储 Stack Overflow 数据\n\n在撰写本文时，Stack Exchange 以 XML 文件的形式免费提供其整个网站系列（包括\
  \ Stack Overflow）的数据供任何人下载。在本节中，我们将下载 Stack Overflow 文件，并将数据导入我们 MySQL 服务器上的数据库。最后，我们将为测试目的创建这些表的几个较小版本。\n\
  \n### 下载 Stack Overflow 数据转储\n\nStack Exchange 的所有可用数据都可以在 Internet Archive 上下载。截至撰写本文时，2014\
  \ 年 9 月的数据转储是最新的。每个 Stack Exchange 站点都有一个或多个文件，每个文件都链接到此详细信息页面： https://archive.org/details/stackexchange。\n\
  \n我们只对以下列表中按字母顺序排列的八个 Stack Overflow 文件感兴趣：\n\n|  |  |\n|---|---|\n| stackoverflow.com-Badges.7z\
  \ | 77.8 MB |\n| stackoverflow.com-Comments.7z | 1.8 GB |\n| stackoverflow.com-PostHistory.7z\
  \ | 9.4 GB |\n| stackoverflow.com-PostLinks.7z | 26.4 MB |\n| stackoverflow.com-Posts.7z\
  \ | 5.7 GB |\n| stackoverflow.com-Tags.7z | 508.1 KB |\n| stackoverflow.com-Users.7z\
  \ | 100.5 MB |\n| stackoverflow.com-Votes.7z | 385.0 MB |\n\nArchive.org 列表显示我们感兴趣的八个\
  \ Stack Overflow 文件。\n\n对于列表中的每个文件，右键单击链接并指示浏览器将文件保存到磁盘。\n\n### 解档文件\n\n请注意，每个文件都有\
  \ .7z 扩展名。这是一种压缩归档格式。可以使用匹配的 7-Zip 软件或其他兼容软件包进行解压缩和解档。7-Zip 并不是我们在 *第 2 章，基础 – 格式、类型和编码*\
  \ 中讨论的更常见的归档工具之一，您可能尚未在计算机上安装兼容的解档程序，因此我们可以将其视为我们需要解决的第一个小问题。尝试双击文件以打开它，但如果您没有安装与\
  \ .7z 扩展名关联的软件，则需要安装适当的 7-Zip 解档程序。\n\n- 对于 Windows，您可以从其网站下载 7-Zip 软件：\n  `http://www.7-zip.org`\n\
  - 对于 Mac OS X，您可以下载并安装 The Unarchiver，这是一款免费实用程序，可在 `http://unarchiver.c3.cx` 获取\n\
  \n安装软件后，依次解包每个文件。解压后的文件非常大，因此请确保您有足够的磁盘空间来容纳它们。\n\n> > 在我的系统上 right now，比较压缩和未压缩的文件大小显示，未压缩版本比压缩版本大约大十倍。这些文件也需要几分钟才能解档，具体取决于您正在使用的系统规格，因此请为此步骤预留时间。\n\
  \n### 创建 MySQL 表并加载数据\n\n我们现在有八个 .xml 文件，每个文件都将映射到我们即将构建的数据库中的一个表。要创建数据库和表，我们可以使用\
  \ phpMyAdmin 或其他图形工具通过点击来完成，或者我们可以运行 Georgios Gousios 编写的以下简单 SQL，并可在 `https://gist.github.com/gousiosg/7600626`\
  \ 获取。此代码包含前六个表的 `CREATE` 和 `LOAD INFILE` 语句，但自此脚本编写以来，数据库转储已添加了另外两个表。\n\n要构建新的表结构，我们可以在终端窗口或\
  \ shell 中运行 `head` 命令，以检查此文件的前几行。从终端，运行它在最小的 XML 文件 `PostLinks.xml` 上，如下所示：\n\n\
  ```\nhead PostLinks.xml\n```\n\n结果的前四行如下所示：\n\n```\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<postlinks>\n  <row Id=\"19\" CreationDate=\"2010-04-26T02:59:48.130\"\
  \ PostId=\"109\" RelatedPostId=\"32412\" LinkTypeId=\"1\" />\n  <row Id=\"37\" CreationDate=\"\
  2010-04-26T02:59:48.600\" PostId=\"1970\" RelatedPostId=\"617600\" LinkTypeId=\"\
  1\" />\n```\n\n我们新数据库表中的每一行都应对应 XML <row> 行中的一行，并且行行中显示的每个属性代表数据库表中的一列。我们可以在 Tags.xml\
  \ 文件上执行相同的 head 命令，以查看其应具有的列。以下 SQL 代码将处理另外两个表的 CREATE 语句和 LOAD 语句：\n\n```\nCREATE\
  \ TABLE post_links (\n  Id INT NOT NULL PRIMARY KEY,\n  CreationDate DATETIME DEFAULT\
  \ NULL,\n  PostId INT NOT NULL,\n  RelatedPostId INT NOT NULL,\n  LinkTypeId INT\
  \ DEFAULT NULL\n);\n\nCREATE TABLE tags (\n  Id INT NOT NULL PRIMARY KEY,\n  TagName\
  \ VARCHAR(50) DEFAULT NULL,\n  Count INT DEFAULT NULL,\n  ExcerptPostId INT DEFAULT\
  \ NULL,\n  WikiPostId INT DEFAULT NULL\n);\n\nLOAD XML LOCAL INFILE 'PostLinks.xml'\n\
  INTO TABLE post_links\nROWS IDENTIFIED BY '<row>';\n\nLOAD XML LOCAL INFILE 'Tags.xml'\n\
  INTO TABLE tags\nROWS IDENTIFIED BY '<row>';\n```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_216_0.png)\n\
  \n请注意，LOAD XML 语法略有更改，以便我们可以将文件保存在本地。如果您的 .xml 文件在本地机器上而不是数据库服务器本身，只需在 LOAD XML\
  \ 语句中添加 LOCAL 关键字，如前面的代码所示，您就可以引用文件的完整路径。\n有关 MySQL LOAD XML 语法的更多信息，请参阅 MySQL 文档中的此处：\
  \ http://dev.mysql.com/doc/refman/5.5/en/load-xml.html。\n\n\n\n此时，我们已经拥有一个完全可用的\
  \ MySQL 数据库，其中包含八个表，每个表都已填入数据。然而，这些表非常庞大。仅这八个表就超过 1.9 亿行。在开始清理数据并准备进行分析时，我们会注意到，如果在像\
  \ posts、comments、votes 或 post_history 这样的大表上犯错，重建表将花费很长时间。在下一步中，我们将学习如何创建测试表，以便在我们的程序或查询出现问题时将损失控制在最小范围内。\n\
  \n## Building test tables\n\n本节中，我们将构建原始表的八个较小版本，每个版本都使用来自原始表的数据随机填充。\n\n第一步是重新运行\
  \ CREATE 语句，但这次在每个表名前加上 test_ 前缀，如下所示的一个表：\n\n```sql\nDROP TABLE IF EXISTS test_post_links;\n\
  CREATE TABLE test_post_links (\n    Id INT NOT NULL PRIMARY KEY,\n    CreationDate\
  \ INT,\n    PostId INT,\n    RelatedPostId INT,\n    LinkTypeId INT\n);\n```\n\n\
  除了在表名前加上 test_ 之外，这八个测试表与我们之前创建的其他表完全相同。\n\n接下来，我们需要用数据填充新的测试表。我们可以简单地从每个表中选择前 1,000\
  \ 行并加载到测试表中。然而，这样做的缺点是行是根据插入 Stack Overflow 数据库的时间排序的，因此如果我们只请求前 1,000 行，我们的子集中将不会有来自不同日期和时间的好样本。我们希望所选行具有相当随机的分布。我们如何随机选择一组行？在这本书中我们之前还没有处理过这个问题，所以这又是我们必须准备尝试新事物以确保数据科学聚会顺利进行的一个例子。\n\
  \n选择随机行的可能性有几种，其中一些比其他更高效。在本项目中，效率对我们很重要，因为我们处理的表相当大。使我们的随机行选择比预期更棘手的一点是，虽然我们的表确实有\
  \ Id 列作为数字主键，但这些 Id 数字不是顺序的。存在许多空缺，例如，在 post_links 表中，Id 列的前几个值是 19、37、42 和 48。\n\
  \n数据中的空缺是有问题的，因为简单的随机化器操作如下：\n\n- 1. 编写一个 PHP 脚本，查询表中最低和最高的 Id 值，如下所示：\n```sql\n\
  SELECT min(Id) FROM post_links;\nSELECT max(Id) FROM post_links;\n```\n- 2. 然后，在脚本中，生成\
  \ min 和 max 值之间的某个随机数，并请求具有该随机值的行：\n```sql\nSELECT * FROM post_links WHERE Id =\
  \ [random value];\n```\n- 3. 重复步骤 2，直到获取所需数量的行。\n\n不幸的是，在 Stack Overflow 数据库表（例如我们的\
  \ post_links 表）中这样做会导致许多查询失败，因为 Id 列中有太多空缺，例如，如果前一个示例中的步骤 2 生成了数字 38 怎么办？我们的 post_links\
  \ 表中没有 Id 为 38 的记录。这意味着我们需要检测此错误并使用新的随机值重试。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_218_0.png)\n\
  \n> 在这一点上，懂一点 SQL 但不多的人通常会建议我们只需让 MySQL 对包含 Id 的列进行 ORDER BY rand()，然后执行 LIMIT 命令来筛选出我们想要的记录数。这个想法的问题在于，即使我们排序的列是索引列，ORDER\
  \ BY rand() 也必须读取每一行以便为其分配一个新的随机数。因此，在像 Stack Overflow 数据库中这样的大表上，这完全无法扩展。我们将不得不等待\
  \ ORDER BY rand() 查询完成太长时间。ORDER BY rand() 对于小表来说是可以接受的解决方案，但对于我们这里处理的大小则不行。\n\n\
  以下 PHP 脚本展示了我们的最终随机行选择过程如何工作，以构建每个包含恰好 1,000 行的八个测试表。每个表都将由尽可能随机且尽可能省力地选择的行值填充，并且不会过度设计这个简单问题：\n\
  \n```php\n<?php //randomizer.php\n// how many rows should be in each of the test\
  \ tables?\n$table_target_size = 1000;\n\n// connect to db, set up query, run the\
  \ query\n$dbc = mysqli_connect('localhost','username','password','stackoverflow')\n\
  \    or die('Error connecting to database!' . mysqli_error());\n$dbc->set_charset(\"\
  utf8\");\n\n$tables = array(\"badges\",\n    \"comments\",\n    \"posts\",\n   \
  \ \"post_history\",\n    \"post_links\",\n    \"tags\",\n    \"users\",\n    \"\
  votes\");\n\nforeach ($tables as $table)\n{\n    echo \"\\n=== Now working on $table\
  \ ===\\n\";\n    $select_table_info = \"SELECT count(Id) as c, min(Id) as mn,\n\
  \        max(Id) as mx FROM $table\";\n    $table_info = mysqli_query($dbc, $select_table_info);\n\
  \    $table_stuff = mysqli_fetch_object($table_info);\n    $table_count = $table_stuff->c;\n\
  \    $table_min = $table_stuff->mn;\n    $table_max = $table_stuff->mx;\n\n    //\
  \ set up loop to grab a random row and insert into new table\n    $i=0;\n    while($i\
  \ < $table_target_size)\n    {\n        $r = rand($table_min, $table_max);\n   \
  \     echo \"\\nIteration $i: $r\";\n        $insert_rowx = \"INSERT IGNORE INTO\
  \ test_$table (SELECT *\n            FROM $table WHERE Id = $r)\";\n        $current_row\
  \ = mysqli_query($dbc, $insert_rowx);\n\n        $select_current_count = \"SELECT\
  \ count(*) as rc FROM\n            test_$table\";\n        $current_count= mysqli_query($dbc,\
  \ $select_current_count);\n        $row_count = mysqli_fetch_object($current_count)->rc;\n\
  \        $i = $row_count;\n    }\n}\n?>\n```\n\n运行该代码后，我们可以看到如果需要，我们有一个不错的八个测试表可供使用。使用这些较小的表进行测试可确保我们的清理练习更顺利进行，并且错误可以得到控制。如果我们发现随机表中需要更多行，我们只需提高\
  \ `$table_target_size` 命令并再次运行即可。\n\n一旦你知道以简单且有用的方式创建它们是多么容易，建立测试表就是一个很好的习惯。\n\n\
  ## Step three – cleaning the data\n\n记住我们的目标是开始分析某些 URL 在问题、答案和评论中被引用的频率，从 Stack\
  \ Overflow `posts` 和 `comments` 表的文本开始是有意义的。然而，由于这些表非常庞大，我们将改用刚刚创建的 `test_posts`\
  \ 和 `test_comments` 表。然后，一旦我们确信查询完美运行，我们就可以在更大的表上重新运行它们。\n\n此清理任务与我们在 *第 7 章，RDBMS\
  \ 清理技术* 中存储从推文中提取的 URL 的方式非常相似。然而，本项目有一套自己的特定规则：\n\n- 由于 posts 和 comments 从一开始就是不同的实体，我们应该为来自\
  \ posts（包括问题和答案）的 URL 和来自 comments 的 URL 分别创建表。\n- 每个问题、答案或评论内部可能包含多个 URL。我们应该存储所有\
  \ URL，并且还应跟踪该 URL 来自哪个 post 或 comment 的唯一标识符。\n- 每个问题和答案中也可能包含格式化的源代码。`<code>` 标签用于分隔\
  \ Stack Overflow 帖子中的源代码。将代码与帖子分开将有助于我们回答关于粘贴站点 URL 与源代码共存的问题。这样的链接通常会伴随多少代码，如果有的话？\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_220_0.png)\n\n> 从技术上讲，posts *可以*在没有 `<code>`\
  \ 标签的情况下创建，但通常有人会迅速编辑错误的帖子以包含这些有用的标签，并因此获得 Stack Overflow 积分。为简洁起见，在本项目中，我们将假设代码包含在\
  \ `<code>` 标签中。\n\n\n\n- 根据 Stack Overflow 数据库转储文档（可在 http://meta.stackexchange.com/questions/2677/\
  \ 获取），实际上共有八种类型的帖子，其中问题和答案只是其中两种类型。因此，我们需要将查询限制为帖子类型 ID 为 `postTypeId=1` 的问题和 `postTypeId=2`\
  \ 的答案。\n- 为确保我们仅从针对问题或答案的评论中提取 URL，而非其他类型的帖子，我们需要将结果联回 posts 表，并将结果限制为 `postTypeId=1`\
  \ 或 `postTypeId=2`。\n\n## 创建新表\n\n我们需要存储这些 URL 的数据库表的 SQL 创建语句如下：\n\n```\nCREATE\
  \ TABLE clean_comments_urls (\n    id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,\n\
  \    commentId INT NOT NULL,\n    url VARCHAR(255) NOT NULL\n) ENGINE=MyISAM DEFAULT\
  \ CHARSET=utf8;\n```\n\n```\nCREATE TABLE IF NOT EXISTS clean_posts_urls (\n   \
  \ id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,\n    postId INT NOT NULL,\n    url\
  \ VARCHAR(255) NOT NULL\n) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```\n\n我们还需要创建一个表来保存从帖子中剥离出的代码：\n\
  \n```\nCREATE TABLE clean_posts_code (\n    id INT NOT NULL AUTO_INCREMENT PRIMARY\
  \ KEY,\n    postId INT NOT NULL,\n    code TEXT NOT NULL\n) ENGINE=MyISAM DEFAULT\
  \ CHARSET=utf8;\n```\n\n此时，我们有三个新表用于存储清理后的 URL 和清理后的源代码。在下一节中，我们将提取 URL 和代码并填充这些新表。\n\
  \n## 提取 URL 并填充新表\n\n我们可以修改我们在 *第 7 章，RDBMS 清理技术* 中编写的脚本，以在新的 Stack Overflow 环境中提取\
  \ URL，方法如下：\n\n```php\n<?php // urlExtractor.php\n// connect to db\n$dbc = mysqli_connect('localhost',\
  \ 'username', 'password',\n    'stackoverflow')\n    or die('Error connecting to\
  \ database!' . mysqli_error());\n$dbc->set_charset(\"utf8\");\n\n// pull out the\
  \ text for posts with\n// postTypeId=1 (questions)\n// or postTypeId=2 (answers)\n\
  $post_query = \"SELECT Id, Body\n    FROM test_posts\n    WHERE postTypeId=1 OR\
  \ postTypeId=2\";\n\n$comment_query = \"SELECT tc.Id, tc.Text\n    FROM test_comments\
  \ tc\n    INNER JOIN posts p ON tc.postId = p.Id\n    WHERE p.postTypeId=1 OR p.postTypeId=2\"\
  ;\n\n$post_result = mysqli_query($dbc, $post_query);\n// die if the query failed\n\
  if (!$post_result)\n    die (\"post SELECT failed! [$post_query]\" . mysqli_error());\n\
  \n// pull out the URLS, if any\n$urls = array();\n$pattern = '#\\b(([\\w]+://|www\\\
  .[.])[^\\s()<>]+(?:\\([\\w\\d]+\\))\n|([^\\[:punct:]\\s]|/))#';\n\nwhile($row =\
  \ mysqli_fetch_array($post_result))\n{\n    echo \"\\nworking on post: \" . $row[\"\
  id\"];\n    if (preg_match_all(\n        $pattern,\n        $row[\"Body\"],\n  \
  \      $urls\n    ))\n    {\n        foreach ($urls[0] as $url)\n        {\n   \
  \         $url = mysqli_escape_string($dbc, $url);\n            echo \"\\n---url:\
  \ \".$url;\n            $post_insert = \"INSERT INTO clean_posts_urls (id,\n   \
  \         postid, url)\n                VALUES (NULL,\" . $row[\"Id\"] . \",'$url')\"\
  ;\n            echo \"\\n$post_insert\";\n            $post_insert_result = mysqli_query($dbc,\n\
  \                $post_insert);\n        }\n    }\n}\n\n$comment_result = mysqli_query($dbc,\
  \ $comment_query);\n// die if the query failed\nif (!$comment_result)\n    die (\"\
  comment SELECT failed! [$comment_query]\" .\n    mysqli_error());\n\nwhile($row\
  \ = mysqli_fetch_array($comment_result))\n{\n    echo \"\\nworking on comment: \"\
  \ . $row[\"id\"];\n    if (preg_match_all(\n        $pattern,\n        $row[\"Text\"\
  ],\n        $urls\n    ))\n    {\n        foreach ($urls[0] as $url)\n        {\n\
  \            echo \"\\n---url: \".$url;\n            $comment_insert = \"INSERT\
  \ INTO clean_comments_urls\n            (id, commentid, url)\n                VALUES\
  \ (NULL,\" . $row[\"Id\"] . \",'$url')\";\n            echo \"\\n$comment_insert\"\
  ;\n            $comment_insert_result = mysqli_query($dbc,\n            $comment_insert);\n\
  \        }\n    }\n}\n?>\n```\n\n我们现在已经完全填充了 clean_post_urls 和 clean_comment_urls\
  \ 表。对于我随机填充的测试表，运行此脚本仅产生大约 100 条评论 URL 和 700 条帖子 URL。尽管如此，在对完整数据集运行之前，这足以测试我们的想法。\n\
  \n## 提取代码并填充新表\n\n要提取 <code> 标签中嵌入的文本并填充我们新的 clean_posts_code 表，我们可以运行以下脚本。它与 URL\
  \ 提取器类似，只是它不需要搜索评论，因为评论中没有使用 <code> 标签分隔的代码。\n\n在我版本的随机选择的测试表中，初始 SELECT 产生约 800\
  \ 行，共 1,000 行 test_post 表。然而，每个帖子可能包含多个代码片段，因此最终表最终包含超过 2,000 行。以下 PHP 代码提取 <code>\
  \ 标签中嵌入的文本：\n\n```php\n<?php // codeExtractor.php\n// connect to db\n$db = mysqli_connect('localhost',\
  \ 'username', 'password',\n    'stackoverflow')\n    or die('Error connecting to\
  \ database!' . mysqli_error());\n$db->set_charset(\"utf8\");\n\n// pull out the\
  \ text for posts with\n// postTypeId=1 (questions)\n// or postTypeId=2 (answers)\n\
  $code_query = \"SELECT Id, Body\n    FROM test_posts\n    WHERE postTypeId=1 OR\
  \ postTypeId=2\n    AND Body LIKE '%<code>%'\";\n\n$code_result = mysqli_query($db,\
  \ $code_query);\n// die if the query failed\nif (!$code_result)\n    die (\"SELECT\
  \ failed! [$code_query]\" . mysqli_error());\n\n// pull out the code snippets from\
  \ each post\n$codesnippets = array();\n$pattern = '/<code>(.*?)<\\/code>/';\n\n\
  while($row = mysqli_fetch_array($code_result))\n{\n    echo \"\\nworking on post:\
  \ \" . $row[\"Id\"];\n    if (preg_match_all(\n        $pattern,\n        $row[\"\
  Body\"],\n        $codesnippets\n    ))\n    {\n        $i=0;\n        foreach ($codesnippets[0]\
  \ as $code)\n        {\n            $code = mysqli_escape_string($dbc, $code);\n\
  \            $code_insert = \"INSERT INTO clean_posts_code (id,\n              \
  \  postid, code)\n                VALUES (NULL,\" . $row[\"Id\"] . \",'$code')\"\
  ;\n            $code_insert_result = mysqli_query($dbc,\n                $code_insert);\n\
  \            if (!$code_insert_result)\n                die (\"INSERT failed! [$code_insert]\"\
  \ .\n                    mysqli_error());\n            $i++;\n        }\n      \
  \  if($i>0)\n        {\n            echo \"\\n    Found $i snippets\";\n       \
  \ }\n    }\n}\n?>\n```\n\n我们现在拥有每个帖子中打印的所有代码的列表，并已将其存储在 `clean_post_code` 表中。\n\n\
  ## 第四步 – 分析数据\n\n本节中，我们编写一些代码来回答本章开头提出的三个问题。我们有兴趣查找：\n\n- 帖子和评论中 URL 提及的不同粘贴站点的计数\n\
  - 问题与答案中粘贴站点 URL 的计数\n- 包含粘贴站点 URL 的帖子中 `<code>` 的出现频率统计\n\n## 哪些粘贴站点最受欢迎？\n\n要回答第一个问题，我们将使用\
  \ clean_posts_urls 和 clean_comments_urls 表生成粘贴站点 URL 和计数的 JSON 表示。这种简单的分析将帮助我们了解哪些\
  \ pastebin 网站在此 Stack Overflow 数据转储中很受欢迎。以下 PHP 查询数据库中我们在 $pastebins 数组中预列出的粘贴站点，然后对帖子和评论中匹配的\
  \ URL 进行计数。它使用测试表，因此数字比使用真实表时要小得多：\n\n```php\n<?php // q1.php\n// connect to db\n\
  $dbc = mysqli_connect('localhost', 'username', 'password',\n    'stackoverflow')\n\
  \    or die('Error connecting to database!' . mysqli_error());\n$dbc->set_charset(\"\
  utf8\");\n\n// these are the web urls we want to look for and count\n$pastebins\
  \ = array(\"pastebin\",\n    \"jsfiddle\",\n    \"gists\",\n    \"jsbin\",\n   \
  \ \"dpaste\",\n    \"pastie\");\n$pastebin_counts = array();\n\nforeach ($pastebins\
  \ as $pastebin)\n{\n    $url_query = \"SELECT count(id) AS cp,\n        (SELECT\
  \ count(id)\n        FROM clean_comments_urls\n        WHERE url LIKE '%$pastebin%'\
  \ ) AS cc\n        FROM clean_posts_urls\n        WHERE url LIKE '%$pastebin%'\"\
  ;\n    $query = mysqli_query($dbc, $url_query);\n    if (!$query)\n        die (\"\
  SELECT failed! [{$url_query}]\" . mysqli_error());\n    $result = mysqli_fetch_object($query);\n\
  \    $countp = $result->cp;\n    $countc = $result->cc;\n    $sum = $countp + $countc;\n\
  \n    array_push($pastebin_counts, array('bin' => $pastebin,\n        'count' =>\
  \ $sum));\n}\n// sort the final list before json encoding it\n// put them in order\
  \ by count, high to low\nforeach ($pastebin_counts as $key => $row)\n{\n```\n\n\
  ```php\n$first[$key] = $row['bin'];\n$second[$key] = $row['count'];\n}\n\narray_multisort($second,\
  \ SORT_DESC, $pastebin_counts);\necho json_encode($pastebin_counts);\n?>\n```\n\n\
  我们可以通过查看脚本的输出来查看此脚本在测试表上运行时生成的 JSON 输出。我的随机行产生了以下计数：\n\n```json\n[{\"bin\":\"jsfiddle\"\
  ,\"count\":44},{\"bin\":\"jsbin\",\"count\":4},{\"bin\":\"pastebin\",\"count\":3},{\"\
  bin\":\"dpaste\",\"count\":0},{\"bin\":\"gists\",\"count\":0},{\"bin\":\"pastie\"\
  ,\"count\":0}]\n```\n\n> > 记住，由于您拥有不同的随机选择的 URL 集合，因此您的数据可能不同。\n\n当我们进入本章的“第 5 步\
  \ – 可视化数据”部分时，我们将使用此 JSON 代码构建条形图。但首先，让我们回答之前提出的另外两个问题。\n\n## 哪些粘贴站点在问题中很受欢迎，哪些在答案中很受欢迎？\n\
  \n我们的第二个问题是 pastebin URL 在问题帖子中更常见还是在答案帖子中更常见。为了开始构建答案，我们将运行一系列 SQL 查询。第一个查询只是询问\
  \ clean_posts_urls 表中每种类型的帖子有多少，既有问题也有答案：\n\n```sql\nSELECT tp.postTypeId, COUNT(cpu.id)\n\
  FROM test_posts tp\nINNER JOIN clean_posts_urls cpu ON tp.Id = cpu.postid\nGROUP\
  \ BY 1;\n```\n\n结果显示，在我随机选择的测试集中，我有 237 个问题和 440 个答案：\n\n| 帖子类型 ID | 计数(cpu.id)\
  \ |\n|------------|---------------|\n| 1 | 237 |\n| 2 | 440 |\n\nphpMyAdmin 显示了问题\
  \ URL 和答案 URL 的计数。\n\n现在，我们想知道这个问题的答案：在这 677 个 URL 中，按问题和答案划分，有多少个专门引用了六个 pastebin\
  \ URL 中的一个？我们可以运行以下 SQL 代码来找出答案：\n\n```sql\nSELECT  tp.postTypeId, count(cpu.id)\n\
  FROM test_posts tp\nINNER JOIN clean_posts_urls cpu ON tp.Id = cpu.postId\nWHERE\
  \ cpu.url LIKE '%jsfiddle%'\nOR cpu.url LIKE '%jsbin%'\nOR cpu.url LIKE '%pastebin%'\n\
  OR cpu.url LIKE '%dpaste%'\nOR cpu.url LIKE '%gist%'\nOR cpu.url LIKE '%pastie%'\n\
  GROUP BY 1;\n```\n\n结果如下表所示。总共有 18 个问题引用了其中一个粘贴站点，而 24 个答案引用了其中一个粘贴站点。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_228_0.png)\n\
  \nphpMyAdmin 显示了引用 pastebin 的问题和答案 URL 的计数。\n\n关于这些查询需要注意的一点是，它们统计的是单个 URL。因此，如果某个\
  \ postId 引用了五个 URL，则会被计算五次。如果我有兴趣知道有多少帖子至少使用了一次粘贴站点 URL，我需要按如下方式修改两个查询的第一行。此查询统计\
  \ URLs 表中的不同帖子：\n\n```sql\nSELECT tp.postTypeId, COUNT(DISTINCT cpu.postId)\nFROM\
  \ test_posts tp\nINNER JOIN clean_posts_urls cpu ON tp.Id = cpu.postId\nGROUP BY\
  \ 1;\n```\n\n以下屏幕截图显示了有多少问题和答案包含 URL：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_228_1.png)\n\
  \nphpMyAdmin 显示了有多少问题和答案包含任何 URL。\n\n此查询统计 URLs 表中提及粘贴站点的特定帖子：\n\n```sql\nSELECT\
  \  tp.postTypeId, count(DISTINCT cpu.postId)\nFROM test_posts tp\nINNER JOIN clean_posts_urls\
  \ cpu ON tp.Id = cpu.postId\nWHERE cpu.url LIKE '%jsfiddle%'\nOR cpu.url LIKE '%jsbin%'\n\
  OR cpu.url LIKE '%pastebin%'\nOR cpu.url LIKE '%dpaste%'\nOR cpu.url LIKE '%gist%'\n\
  OR cpu.url LIKE '%pastie%'\nGROUP BY 1;\n```\n\n此粘贴站点查询的结果如下，正如预期的那样，数字更小。在我们的测试集中，11\
  \ 个问题至少使用了一个 pastebin URL，16 个答案也是如此。合计，37 个帖子至少引用了一次 pastebin URL。\n\n| 帖子类型 ID\
  \ | count(distinct cpu.postid) |\n|---|---|\n| 1 | 11 |\n| 2 | 16 |\n\nPhpMyAdmin\
  \ 显示了有多少问题和答案包含任何粘贴站点 URL。\n\n即使这些结果似乎表明人们在答案中比在问题中更常引用粘贴站点 URL，我们仍需要在问题和答案的总体数量方面进行比较。我们应该将结果值报告为该帖子类型（问题或答案）总数的百分比。考虑到总数，我们现在可以说类似这样的话：“仅考虑至少使用过一种\
  \ URL 的问题和答案，81 个问题中有 11 个至少使用了一个粘贴站点 URL（13.6%），222 个答案中有 16 个至少使用了一个粘贴站点 URL（7.2%）。”\
  \ 考虑到这一点，似乎问题在引用粘贴站点方面实际上超过了答案，几乎是二比一。\n\n在任何数据分析项目的这个阶段，你一定会有大量问题，例如：\n\n- 问题和答案中粘贴站点\
  \ URL 的使用情况如何随时间变化？\n- 带有粘贴站点 URL 的问题在投票和收藏方面表现如何？\n- 发布带有粘贴站点 URL 的问题的用户的特征是什么？\n\
  \n但由于这是一本关于数据清洗的书，而且我们甚至还没有可视化这些数据，我会克制自己暂时不回答这些问题。我们仍有一个原始的三个问题需要回答，然后我们将继续可视化一些结果。\n\
  \n## 帖子是否同时包含粘贴站点的 URL 和源代码？\n\n回答我们的第三个问题需要我们比较 Stack Overflow 问题中的代码量与 Stack Overflow\
  \ 答案中的代码量，特别关注包含某种源代码的帖子，由 <code> 标签分隔。在“第三步 – 清理数据”部分，我们从测试表中的帖子中提取了所有代码，并创建了一个新表来保存这些代码片段。现在，一个简单的查询来确定有多少包含代码的帖子如下：\n\
  \n```sql\nSELECT count(DISTINCT postid)\nFROM clean_posts_code;\n```\n\n在我样本集中，这产生了\
  \ 664 个包含代码的帖子，共 1,000 个测试帖子。换一种说法：1,000 个帖子中有 664 个至少包含一个 <code> 标签。\n\n为了确定这些包含代码的帖子中有多少也包含任何\
  \ URL，我们可以运行以下 SQL 查询：\n\n```sql\nSELECT count(DISTINCT cpc.postid)\nFROM clean_posts_code\
  \ cpc\nINNER JOIN clean_posts_urls cpu\nON cpu.postId = cpc.postId;\n```\n\n我的样本集对此产生了\
  \ 175 行。我们可以这样解释：原始 1,000 个帖子测试集中有 17.5% 的帖子同时包含代码和 URL。\n\n现在，为了确定有多少包含代码的帖子也包含粘贴站点\
  \ URL，我们将进一步缩小 SQL 查询范围：\n\n```sql\nSELECT count(DISTINCT cpc.postid)\nFROM clean_posts_code\
  \ cpc\nINNER JOIN clean_posts_urls cpu\nON cpu.postId = cpc.postId\nWHERE cpu.url\
  \ LIKE '%jsfiddle%'\nOR cpu.url LIKE '%jsbin%'\nOR cpu.url LIKE '%pastebin%'\nOR\
  \ cpu.url LIKE '%dpaste%'\nOR cpu.url LIKE '%gist%'\nOR cpu.url LIKE '%pastie%';\n\
  ```\n\n从这些结果可以看出，只有 25 个帖子同时包含源代码和粘贴站点 URL。从第二个问题我们知道，37 个不同的帖子（问题和答案）至少使用了一次某种粘贴站点\
  \ URL。因此，25/37 约为 68%。在更大的数据集上运行这些查询以查看这些值的结果将很有趣。\n\n与此同时，我们将对我们的问题中的至少一个进行一些简单的可视化，以便在数据科学六步流程的一轮完整循环上收尾。\n\
  \n## 第五步 – 可视化数据\n\n可视化步骤有点像我们在晚宴中的甜点课程。每个人都喜欢精美的图形，看起来也很漂亮。然而，由于本书的重点是清理而不是分析和可视化，我们这里的图形会非常简单。在下面的代码中，我们将使用\
  \ JavaScript D3 可视化库以图形方式显示第一个问题的结果。这种可视化比我们在第 4 章《说通用语 – 数据转换》中所做的 D3 可视化要简单得多。在那一章中，你会记得我们构建了一个相当复杂的网络图，但在本文中，简单的条形图就足够了，因为我们要显示的只是几个标签和计数。\n\
  \nHTML 和 JavaScript/D3 代码如下。此代码扩展了 Mike Bostock 的“让我们构建条形图”教程，可在 http://bl.ocks.org/mbostock/3885304\
  \ 获取。我扩展此代码的一种方式是使其读取我们在 q1.php 脚本中之前生成的 JSON 文件。我们的 JSON 文件打印得非常漂亮，并且已经按从高到低排序，因此从中构建一个小条形图会很容易：\n\
  \n```html\n<!DOCTYPE html>\n<meta charset=\"utf-8\">\n<!--\nthis code is modeled\
  \ on mbostock's\n\"Let's Make a Bar Chart\" D3 tutorial\navailable at http://bl.ocks.org/mbostock/3885304\n\
  My modifications:\n* formatting for space\n* colors\n* y axis labels\n* changed\
  \ variable names to match our data\n* loads data via JSON rather than .tsv file\n\
  -->\n```\n\n\n\n```\n<style>\n.bar {fill: lightgrey;}\n.bar:hover {fill: lightblue;}\n\
  .axis {font: 10px sans-serif;}\n.axis path, .axis line {\n    fill: none;\n    stroke:\
  \ #000;\n    shape-rendering: crispEdges;\n}\n.x.axis path {display: none;}\n</style>\n\
  <body>\n<script src=\"d3.min.js\"></script>\n<script>\n\nvar margin = {top: 20,\
  \ right: 20, bottom: 30, left: 40},\n    width = 960 - margin.left - margin.right,\n\
  \    height = 500 - margin.top - margin.bottom;\n\nvar x = d3.scale.ordinal()\n\
  \    .rangeRoundBands([0, width], .1);\n\nvar y = d3.scale.linear()\n    .range([height,\
  \ 0]);\n\nvar xAxis = d3.svg.axis()\n    .scale(x)\n    .orient(\"bottom\");\n\n\
  var yAxis = d3.svg.axis()\n    .scale(y)\n    .orient(\"left\");\n\nvar svg = d3.select(\"\
  body\").append(\"svg\")\n    .attr(\"width\", width + margin.left + margin.right)\n\
  \    .attr(\"height\", height + margin.top + margin.bottom)\n    .append(\"g\")\n\
  \    .attr(\"transform\", \"translate(\" + margin.left + \",\" + margin.top + \n\
  \")\");\n\nd3.json(\"bincounter.php\", function(error, json)\n{\ndata = json;\n\
  \    draw(data);\n});\n\nfunction draw(data)\n{\n    x.domain(data.map(function(d)\
  \ { return d.bin; }));\n    y.domain([0, d3.max(data, function(d) { return d.count;\
  \ })]);\n\n    svg.append(\"g\")\n        .attr(\"class\", \"x axis\")\n       \
  \ .attr(\"transform\", \"translate(0,\" + height + \")\")\n        .call(xAxis);\n\
  \n    svg.append(\"g\")\n        .attr(\"class\", \"y axis\")\n        .call(yAxis)\n\
  \        .append(\"text\")\n        .attr(\"transform\", \"rotate(-90)\")\n    \
  \    .attr(\"y\", 6)\n        .attr(\"dy\", \".71em\")\n        .style(\"text-anchor\"\
  , \"end\")\n        .text(\"Frequency\");\n\n    svg.selectAll(\".bar\")\n     \
  \   .data(data)\n        .enter().append(\"rect\")\n        .attr(\"class\", \"\
  bar\")\n        .attr(\"x\", function(d) { return x(d.bin) ; })\n        .attr(\"\
  width\", x.rangeBand())\n        .attr(\"y\", function(d) { return y(d.count); })\n\
  \        .attr(\"height\", function(d) { return height - y(d.count); });\n}\n\n\
  </script>\n</body>\n</html>\n```\n\n我们可以将此保存为 `q1chart.html`，并在浏览器中查看。代码调用我们的 `q1.php`\
  \ 脚本，该脚本生成 JSON 文件，D3 然后使用它来构建此图表，其左侧显示如下：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_234_0.png)\n\
  \nD3 对三个 URL 计数产生的 JSON 的可视化。\n\n条形图显示指向 JSFiddle 的 URL 似乎是最常见的，至少在我使用的随机选择的测试数据集中是这样。我们仅从查看\
  \ `q1.php` 的 JSON 输出就知道了这一点，但将其图形化显示也很不错。在下一节中，我们将总结结果和我们的流程，并讨论此项目的下一步。\n\n## 第六步\
  \ – 问题解决\n\n从我们在 *第四步 – 分析数据* 和 *第五步 – 可视化数据* 部分开发的查询和可视化中，我们现在可以尝试回答最初促使该项目的三个问题中的每一个。\n\
  \n对于第一个问题，我们想要查找帖子和评论中按 URL 提及的不同粘贴站点的计数。我们制作的 q1.php 脚本和条形图用于可视化数据，显示至少在测试数据中，JSFiddle\
  \ 是我们查看的六个粘贴站点 URL 中引用最频繁的。\n\n第二个问题是关于粘贴站点 URL 是否在问题中更普遍还是在答案中更普遍。我们的查询显示，粘贴站点\
  \ URL 在问题中出现的可能性大约是答案的两倍，但两者的数据都很小，至少在我们的测试集中是这样。\n\n对于第三个问题，我们想看看人们是否真的在遵循 Stack\
  \ Overflow 的建议，除了粘贴站点 URL 之外还发布代码。在我们的测试集中，查询显示 25 条帖子（共 37 条）同时包含粘贴站点 URL 和推荐的附带源代码。这是一项约\
  \ 68% 的合规率。\n\n此时我们可以提出并回答许多额外的问题，并且有许多令人兴奋的方式可以将这项简单研究扩展成更有趣的东西。不过现在，我们将重点关注将此项目扩展到使用完整数据集所需的存储和清理流程。\n\
  \n## 从测试表迁移到完整表\n\n在本项目开始时，我们创建了一组测试表，以便在仅包含 1,000 行的表上在一个无压力的环境中开发项目。在不确定查询是否会按我们希望的方式工作，或者想要尝试棘手的连接、子查询、奇怪的正则表达式等情况下，使用行数可控的小表非常重要。不过到目前为止，如果我们对编写的查询和脚本感到满意，那么是时候重写我们的流程以使用全尺寸表了。\n\
  \n以下是我们将遵循的步骤以将项目迁移到全尺寸表：\n\n- 1. 删除测试表：\n```\nDROP TABLE IF EXISTS test_badges;\n\
  DROP TABLE IF EXISTS test_comments;\nDROP TABLE IF EXISTS test_posts;\nDROP TABLE\
  \ IF EXISTS test_post_history;\nDROP TABLE IF EXISTS test_post_links;\nDROP TABLE\
  \ IF EXISTS test_tags;\nDROP TABLE IF EXISTS test_users;\nDROP TABLE IF EXISTS test_votes;\n\
  ```\n- 2. 按如下方式清空 cleaned_posts_code、cleaned_posts_urls 和 cleaned_comments_urls\
  \ 表：\n- 3. 编辑 urlExtractor.php 和 codeExtractor.php 脚本，使其从 posts 表而不是 test_posts\
  \ 表中 SELECT。查询可以按如下方式编辑：\n- 4. 重新运行 urlExtractor.php 和 codeExtractor.php 脚本，以便它们重新填充我们之前清空（截断）的干净代码和\
  \ URL 表。\n```\nTRUNCATE TABLE cleaned_posts_code;\nTRUNCATE TABLE cleaned_posts_urls;\n\
  TRUNCATE TABLE cleaned_comments_urls;\n```\n```\nSELECT Id, Body FROM posts\n```\n\
  \n此时，我们已准备好对清理后的代码和 URL 表进行分析和可视化。执行这些步骤时请慢慢来，并请注意其中许多查询和脚本可能需要很长时间才能完成。posts 表相当大，我们编写的许多查询都是针对文本列使用通配符进行选择的。\n\
  \n## 总结\n\n在本项目中，我们提出了一些关于 Stack Overflow 上 URL 普遍性的问题，特别是与粘贴站点相关的 URL，例如 http://www.Pastebin.com\
  \ 和 http://www.JSFiddle.net。为了开始回答这些问题，我们从 Stack Exchange 公共文件发布中下载了 Stack Overflow\
  \ 帖子（以及其他 Stack Overflow 数据）的数据。我们构建了一个 MySQL 数据库和八个表来保存这些数据。然后我们为测试目的创建了每个表的较小的\
  \ 1,000 行版本，并填充了随机选择的数据样本。从这些测试表中，我们提取了每个问题、答案和评论中提及的 URL，并将它们保存到新的干净表中。我们还提取了问题和答案中发现的源代码，并将这些片段保存到新表中。最后，我们能够构建一些简单的查询和可视化来帮助我们回答最初提出的问题。\n\
  \n尽管结果较为 modest，从数据清理的角度来看，我们的晚宴取得了成功。我们能够制定一个连贯的计划，并采取有条不紊的步骤付诸行动，并在需要时进行调整。我们现在已准备好进行最终项目，以及一个完全不同的晚宴菜单。\n\
  \n在下一章中，我们将收集和清理我们自己的著名 Twitter 数据集版本。\n"
- "# 第10章：Twitter 项目\n\n与我们在第 9 章完成的 Stack Overflow 项目一样，我们下一个完整的章节晚宴旨在特别展示我们的数据清理技能，同时仍完成整体数据科学流程的每个阶段。我们之前的项目使用了\
  \ Stack Overflow 数据，使用 MySQL 和 PHP 的组合进行清理，并使用 JavaScript D3 进行可视化。在本章中，我们将使用 Twitter\
  \ 数据，使用 MySQL 和 Python 进行收集和清理，并使用 JavaScript 和 D3 进行可视化。与之前的项目一样，在本项目中，数据科学流程仍然相同：\n\
  \n- 1. 决定我们试图解决的问题类型——为什么需要检查这些数据？\n- 2. 收集和存储我们的数据，其中包括下载和提取一组公开可用的推文识别号，然后使用程序重新下载原始推文。此步骤还包括为测试目的创建较小的数据集。\n\
  - 3. 通过提取和存储我们需要的部分来清理数据。在此步骤中，我们编写一个快速的 Python 程序来加载数据，提取我们想要的字段，并将它们写入一组小的数据库表。\n\
  - 4. 分析数据。我们是否需要对数据执行任何计算？是否应该编写一些聚合函数来计数或汇总数据？我们是否需要以某种方式转换数据？\n- 5. 在可能的情况下提供数据的可视化。\n\
  - 6. 解决我们设法调查的问题。我们的流程有效吗？我们成功了吗？\n\n\n\n\n与之前的项目一样，大部分工作将集中在收集、存储和清理任务上。在本项目中，我们会注意到我们多次存储数据的不同版本，首先作为文本文件，然后作为已水合的\
  \ JSON 文件，然后作为 MySQL 数据库。这些不同格式中的每一种都源于不同的收集或清理过程，并为下一个过程提供输入。这样一来，我们开始看到收集、存储和清理步骤可以是**迭代的**——相互反馈——而不仅仅是线性的。\n\
  \n## 第一步 – 针对推文档案提出一个问题\n\nTwitter 是一个流行的 **microblogging** 平台，被全球数百万人用来分享他们的想法或就时事进行交流。由于\
  \ Twitter 在发布和阅读方面相对易于访问，尤其是在移动设备上，它已成为在公共事件期间分享信息的重要平台，例如政治危机和抗议活动，或追踪某个议题在公众意识中出现的轨迹。保存的推文成为一种时间胶囊，为事件发生时的公众情绪提供了丰富的洞察。被冻结在时间中，推文本身不受记忆\
  \ lapses 或公众舆论随后逆转的影响。学者和媒体专家可以收集和研究这些专题的 **tweet archives**，以尝试了解当时公众舆论是什么样的，或信息是如何传播的，甚至是事件中发生了什么、何时发生以及为什么。\n\
  \n现在很多人开始公开他们的推文集合。一些现在可供公开下载的推文档案包括：\n\n- 与 2014 年 8 月 10 日至 8 月 27 日美国密苏里州弗格森事件后抗议和动荡相关的推文。这些可在\
  \ https://archive.org/details/ferguson-tweet-ids 获取。\n- 2011 年阿拉伯之春期间来自多个国家的推文，包括利比亚、巴林、埃及等。这些可在\
  \ http://dfreelon.org/2012/02/11/arab-spring-twitter-data-now-available-sort-of/\
  \ 获取。\n- 在 2014 年 5 月至 6 月期间提及 **#YesAllWomen** 标签和相关标签 **#NotAllMen** 的推文。这些可在\
  \ http://digital.library.unt.edu/ark:/67531/metadc304853/ 获取。\n\n在下一步中，我们需要选择其中一个进行下载并开始使用。由于弗格森推文是这三个示例数据集中最新的也是最完整的，我围绕它设计了本章的其余部分。然而，无论你使用哪一组数据集，这里的概念和基本流程都适用。\n\
  \n本章中我们想要提出的基本问题相当简单：当人们推文谈论弗格森时，他们最常推文提及哪些互联网域名？与第 9 章《Stack Overflow 项目》中的问题集相比，这是一个非常简单的问题，但这里的数据收集过程有所不同，因此一个简单的问题足以激发我们的数据科学晚宴。\n\
  \n## 第二步 – 收集数据\n\n与我们在第 7 章《RDBMS 清理技术》中研究的少量情感推文档案不同，像上面提到的这些更新的推文档案不再包含推文本身的实际文本。Twitter\
  \ 的服务条款（ToS）自 2014 年起已更改，分发他人的推文现在违反了该条款。\n\n相反，在更新的推文档案中你会发现的实际上只是推文识别（ID）号码。使用这些号码，我们必须逐一收集实际的推文。届时，我们可以自行存储和分析这些推文。请注意，在此过程的任何阶段或之后，我们不能重新分发推文文本或其元数据，只能重新分发推文识别号码。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_239_0.png)\n\n> 即使这对想要收集推文的研究人员来说很不方便，Twitter\
  \ 更改其 ToS 的 stated reason 是为了尊重原始发布推文的人的版权概念。这在删除推文方面尤其重要。如果推文已被复制并在整个网络上重新分发，并由第三方存储在数据文件中，则推文实际上无法被删除。通过要求研究人员只复制推文\
  \ ID，Twitter 试图保护用户删除其自身内容的能力。对已删除推文 ID 的请求将不会返回结果。\n\n### 下载并解压弗格森文件\n\n弗格森相关的推文在互联网档案馆作为一组已归档的压缩文本文件提供。将浏览器指向\
  \ https://archive.org/details/ferguson-tweet-ids 并下载 147 MB 的 ZIP 文件。\n\n我们可以按如下方式提取文件：\n\
  \n```\nunzip ferguson-tweet-ids.zip\n```\n\nls 命令显示创建了一个名为 ferguson-tweet-ids 的目录，并且该目录内还有两个压缩文件：ferguson-indictment-tweet-ids.zip\
  \ 和 ferguson-tweet-ids.zip。我们实际上只需要解压其中一个即可完成本项目，因此我选择了这个：\n\n```\nunzip ferguson-tweet-ids.zip\n\
  ```\n\n解压此文件会显示多个清单文本文件以及一个 data 文件夹。data 文件夹内有一个 gzipped 文件。按如下方式解压：\n\n```\ngunzip\
  \ ids.txt.gz\n```\n\n这会生成一个名为 ids.txt 的文件。这正是我们要找的文件。让我们探索一下这个文件。\n\n要查看文件的大小，我们可以运行\
  \ wc 命令。如下所示从命令行运行时，wc 会按顺序显示文件中的行数、单词数和字符数：\n\n```\nmegan$ wc ids.txt\n  13238863\
  \ 13238863 251538397 ids.txt\n```\n\n第一个数字表示 ids.txt 文件中的行数，略高于 1300 万。接下来，我们可以用\
  \ head 命令查看文件内部：\n\n```\nmegan$ head ids.txt\n501064188211765249\n501064196642340864\n\
  501064197632167936\n501064196931330049\n501064198005481472\n501064198009655296\n\
  501064198059597824\n501064198513000450\n501064180468682752\n501064199142117378\n\
  ```\n\nhead 命令显示文件的前十行，以便我们可以看到每一行都由一个 18 位的推文 ID 组成。\n\n### 创建文件的测试版本\n\n在此阶段，我们将创建一个小型测试文件，供本项目剩余部分使用。我们这样做的原因与我们在第\
  \ 9 章《Stack Overflow 项目》中使用测试表的原因相同。因为原始文件极大，我们希望在出错时使用数据子集。我们还希望能够在不花费太多时间完成每个步骤的情况下测试我们的代码。\n\
  \n与之前的练习不同，在这种情况下，我们选择测试数据行是否随机可能并不重要。只需查看我们之前运行的 head 命令的结果，我们就可以看到这些行并不是真正按从低到高的顺序排列的。事实上，我们没有任何关于原始行集顺序的信息。因此，让我们直接获取前\
  \ 1,000 个推文 ID 并保存到文件中。这将成为我们的测试集：\n\n```\nhead -1000 ids.txt > ids_1000.txt\n```\n\
  \n### 水合推文 ID\n\n我们现在将使用这 1,000 个推文 ID 的测试集来测试我们根据识别号码收集原始推文的流程。此过程称为水合推文。为此，我们将使用一个方便的\
  \ Python 工具 twarc，该工具由 Ed Summers 编写，他也是归档所有弗格森推文的同一人。它通过获取推文 ID 列表并逐一从 Twitter\
  \ API 获取每个原始推文来工作。要使用 Twitter API 做任何事情，我们必须先设置好 Twitter 开发者账户。让我们先创建我们的 Twitter\
  \ 账户，然后我们可以安装 twarc 并使用它。\n\n### 设置 Twitter 开发者账户\n\n要设置 Twitter 开发者账户，请前往 https://apps.twitter.com\
  \ 并使用你的 Twitter 账户登录。如果你还没有 Twitter 账户，你需要创建一个才能完成接下来的步骤。\n\n\n\n登录 Twitter 账号后，在\
  \ http://apps.twitter.com 页面，点击 **创建新应用**。填写创建应用所需的详细信息（为其命名，例如 My Tweet Test；简短描述；以及一个\
  \ URL，无需永久）。我的已填写应用创建表单在此供您参考：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_242_0.png)\n\
  \nTwitter 的“创建新应用”表单，已用示例数据填写\n\n点击表示您同意开发者协议的复选框，您将被返回到列出所有 Twitter 应用的屏幕，您的新应用位于列表顶部。\n\
  \n接下来，要使用此应用，我们需要获取使其正常工作所需的一些关键信息。点击您刚刚创建的应用，您将在下一屏幕顶部看到四个标签。我们感兴趣的是写着 **密钥和访问令牌**\
  \ 的那个。它看起来像这样：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_242_1.png)\n\n您新创建的 Twitter\
  \ 应用中的标签界面。\n\n此屏幕上有许多数字和秘密代码，但有四项需要特别注意：\n\n- CONSUMER_KEY\n- CONSUMER_SECRET\n\
  - ACCESS_TOKEN\n- ACCESS_TOKEN_SECRET\n\n无论您进行何种 Twitter API 编程，至少目前，您始终需要这四项相同的项目。这无论您使用\
  \ twarc 还是其他工具都适用。这些凭据是 Twitter 用于验证您的身份并确保您拥有查看所请求内容的访问权限的方式。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_243_0.png)\n\
  \n> 这些 API 凭据也是 Twitter 限制您发送请求的数量以及请求速度的方式。twarc 工具代表我们处理所有这些，因此我们不必太担心超出速率限制。有关\
  \ Twitter 速率限制的更多信息，请查看其开发者文档 at https://dev.twitter.com/rest/public/rate-limiting。\n\
  \n## 安装 twarc\n\n现在我们已访问到 Twitter 凭据，可以安装 twarc。\n\ntwarc 下载页面在 GitHub 上可用，地址为 https://github.com/edsu/twarc。该页面上有关于如何使用该工具以及有哪些选项的文档。\n\
  \n要在您的 Canopy Python 环境中安装 twarc，启动 Canopy，然后从 Tools 菜单中选择 Canopy Command Prompt。\n\
  \n在命令提示符中，输入：\n\n```\npip install twarc\n```\n\n此命令将安装 twarc 并使其可作为命令行程序调用，或从您自己的\
  \ Python 程序中调用。\n\n## 运行 twarc\n\n现在我们可以使用命令行中的 twarc 来水合我们之前创建的 ids_1000.txt 文件。此命令行非常长，因为我们必须传入在\
  \ Twitter 网站上之前创建的四个长秘密令牌。为了避免出错，我使用文本编辑器 Text Wrangler 先创建命令行，然后再将其粘贴到我的命令提示符中。您的最终命令行将如下所示，只是凡是写着\
  \ abcd 的地方，您应改为填写相应的秘密令牌或密钥：\n\n```\ntwarc.py --consumer_key abcd --consumer_secret\
  \ abcd --access_token abcd --access_token_secret abcd --hydrate ids_1000.txt > tweets_1000.json\n\
  ```\n\n请注意，此命令行将把输出重定向到名为 tweets_1000.json 的 JSON 文件中。该文件内部包含我们之前仅有 ID 的每个推文的 JSON\
  \ 表示。让我们检查新文件的长度：\n\n```\nwc tweets_1000.json\n```\n\nwc 实用程序显示我的文件长 894 行，这表明有些推文无法找到（因为我最初的数据集中有\
  \ 1,000 条推文）。如果在撰写本文之后推文已被删除，您文件可能更小。\n\n接下来，我们也可以查看文件内部：\n\n```\nless tweets_1000.json\n\
  ```\n\n我们也可以在文本编辑器中打开它进行查看。\n\nJSON 文件中的每一行代表一条推文，其格式如下例所示。然而，此示例推文并非来自 Ferguson\
  \ 数据集，因为我没有分发这些推文的权利。相反，我使用了在第 2 章 Fundamentals – Formats, Types, and Encodings\
  \ 中为我们讨论 UTF-8 编码而创建的推文之一。由于此推文是为本书专门创建的，我拥有内容所有权，因此可以在不违反 Twitter 的 ToS 的情况下向您展示\
  \ JSON 格式。以下是我的推文在 Twitter 网页界面中的样子：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_245_0.png)\n\
  \n推文示例，如在 Twitter 网页界面中所示。\n\n以下是 twarc 水合后该推文的 JSON 表示形式。我在每个 JSON 元素之间添加了换行符，以便更轻松地查看每条推文可用的属性：\n\
  \n```\n{ \"contributors\": null, \"truncated\": false, \"text\": \"Another test.\
  \ Ég elska gögn. #datacleaning\", \"in_reply_to_status_id\": null, \"id\": 542486101047275520,\
  \ \"favorite_count\": 0, \"retweeted\": false, \"coordinates\": null, \"entities\"\
  : { \"symbols\": [], \"user_mentions\": [], \"hashtags\": [ {\"indices\": [29, 42],\
  \ \"text\": \"datacleaning\"} ], \"urls\": [] }, \"in_reply_to_screen_name\": null,\
  \ \"id_str\": \"542486101047275520\", \"retweet_count\": 0, \"in_reply_to_user_id\"\
