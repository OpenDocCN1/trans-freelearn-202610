  : false,\n\"url\": \"http://t.co/dBQNKhR6jY\",\n\"created_at\": \"Mon Mar 12 05:01:55\
  \ +0000 2007\",\n\"contributors_enabled\": false,\n\"time_zone\": \"Eastern Time\
  \ (US & Canada)\",\n\"protected\": false,\n\"default_profile\": false,\n\"is_translator\"\
  : false},\n\"geo\": null,\n\"in_reply_to_user_id_str\": null,\n\"lang\": \"is\"\
  ,\n\"created_at\": \"Wed Dec 10 01:09:00 +0000 2014\",\n\"in_reply_to_status_id_str\"\
  : null,\n\"place\": null}\n```\n\n不仅每个 JSON 对象包含推文本身的事实，例如文本、发送日期和时间，它还包含发布推文的人的丰富信息。\n\
  \n> 水合过程会产生关于单个推文的大量信息——而这是一个总共包含 13 million 条推文的数据集。请在准备在 本章末尾水合整个 Ferguson 数据集时牢记这一点。\n\
  \n## 第三步 – 数据清洗\n\n在这一点上，我们准备开始清理 JSON 文件，提取我们希望保存在长期存储中的每条推文的详细信息。\n\n## 创建数据库表\n\
  \n由于我们的动机问题只询问 URL，我们实际上只需要提取这些 URL，以及推文 ID。然而，为了练习清洗，并让我们能够将此练习与我们在第 7 章 RDBMS\
  \ Cleaning Techniques 中使用 sentiment140 数据集所做的工作进行比较，让我们按如下方式设计一组小型数据库表：\n\n- 一个\
  \ tweet 表，仅保存有关推文的信息\n- 一个 hashtag 表，保存有关哪些推文引用了哪些 hashtag 的信息\n\n\n\n\n-   一个 `URL`\
  \ 表，用于保存哪些推文引用了哪些 URL 的信息\n-   一个 `mentions` 表，用于保存哪些推文提及了哪些用户的信息\n\n这与我们在 *第7章，RDBMS\
  \ 清理技术* 中设计的结构类似，只是当时我们必须从推文文本中自行解析出 hashtags 和 URLs 以及用户提及的列表。twarc 工具确实在我们本章完成此项目时为我们节省了一些工作。\n\
  \n创建我们四个表的 CREATE 语句如下：\n\n```\nCREATE TABLE IF NOT EXISTS ferguson_tweets (\n \
  \ tid bigint(20) NOT NULL,\n  ttext varchar(200) DEFAULT NULL,\n  tcreated_at varchar(50)\
  \ DEFAULT NULL,\n  tuser bigint(20) DEFAULT NULL,\n  PRIMARY KEY (tid)\n) ENGINE=MyISAM\
  \ DEFAULT CHARSET=utf8mb4;\n\nCREATE TABLE IF NOT EXISTS ferguson_tweets_hashtags\
  \ (\n  tid bigint(20) NOT NULL,\n  ttag varchar(200) NOT NULL,\n  PRIMARY KEY (tid,\
  \ ttag)\n) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n\nCREATE TABLE IF NOT EXISTS ferguson_tweets_mentions\
  \ (\n  tid bigint(20) NOT NULL,\n  tuserid bigint(20) NOT NULL,\n  tscreen varchar(100)\
  \ DEFAULT NULL,\n  tname varchar(100) DEFAULT NULL,\n  PRIMARY KEY (tid,tuserid)\n\
  ) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n\nCREATE TABLE IF NOT EXISTS ferguson_tweets_urls\
  \ (\n  tid bigint(20) NOT NULL,\n  turl varchar(200) NOT NULL,\n  texpanded varchar(255)\
  \ DEFAULT NULL,\n  tdisplay varchar(200) DEFAULT NULL,\n  PRIMARY KEY (tid,turl)\n\
  ) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```\n\n关于 tweets 表需要注意的一点是，它是用 **utf8mb4**\
  \ 排序规则创建的。这是因为推文本身可能包含 UTF-8 范围内非常高的字符。事实上，这些推文中的某些字符所需的空间超过了原生 MySQL UTF-8 字符集可以容纳的\
  \ 3 字节限制。因此，我们设计主推文表以 MySQL 的 utf8mb4 排序规则保存数据，该排序规则包含在 MySQL 5.5 或更高版本中。如果你使用的是更旧的\
  \ MySQL 版本，或者由于其他原因无法访问 utf8mb4 排序规则，你可以使用 MySQL 旧的 UTF-8-general 排序规则，但请注意你可能会在某个表情符号处产生编码错误。如果你确实遇到此错误，MySQL\
  \ 在尝试 INSERT 记录时可能会给出关于 Error 1366 和 *不正确字符串值* 的消息。\n\n现在每个表都已创建，我们可以开始选择并加载数据。\n\
  \n## 在 Python 中填充新表\n\n以下的 Python 脚本将加载 JSON 文件，从我们感兴趣的字段中提取值，并填充前面描述的四个表。关于此脚本还有一些额外的、重要的说明，我现在将逐一介绍。\n\
  \n此脚本确实需要安装 MySQLdb Python 模块。作为 Canopy Python 用户，这些模块可以通过包管理器轻松安装。只需在包管理器中搜索 MySQLdb\
  \ 并点击安装：\n\n```\n#jsonTweetCleaner.py\nimport json\nimport MySQLdb\n\n# Open database\
  \ connection\ndb = MySQLdb.connect(host=\"localhost\",\\\n    user=\"username\"\
  , \\\n    passwd=\"password\", \\\n    db=\"ferguson\", \\\n    use_unicode=True,\
  \ \\\n    charset=\"utf8\")\ncursor = db.cursor()\ncursor.execute('SET NAMES utf8mb4')\n\
  cursor.execute('SET CHARACTER SET utf8mb4')\ncursor.execute('SET character_set_connection=utf8mb4')\n\
  ```\n\n```\n# open the file full of json-encoded tweets\nwith open('tweets_1000.json')\
  \ as f:\n    for line in f:\n        # read each tweet into a dictionary\n     \
  \   tweetdict = json.loads(line)\n\n        # access each tweet and write it to\
  \ our db table\n        tid     = int(tweetdict['id'])\n        ttext   = tweetdict['text']\n\
  \        uttext  = ttext.encode('utf8')\n        tcreated_at = tweetdict['created_at']\n\
  \        tuser   = int(tweetdict['user']['id'])\n\n        try:\n            cursor.execute(u\"\
  INSERT INTO ferguson_tweets(tid,\n            ttext, tcreated_at, tuser) VALUES\
  \ (%s, %s, %s, %s)\", \\\n            (tid,uttext,tcreated_at,tuser))\n        \
  \    db.commit() # with MySQLdb you must commit each change\n        except MySQLdb.Error\
  \ as error:\n            print(error)\n            db.rollback()\n\n        # access\
  \ each hashtag mentioned in tweet\n        hashdict = tweetdict['entities']['hashtags']\n\
  \        for hash in hashdict:\n            ttag = hash['text']\n            try:\n\
  \                cursor.execute(u\"INSERT IGNORE INTO\n                ferguson_tweets_hashtags(tid,\
  \ ttag) VALUES (%s, %s)\",(tid,ttag))\n                db.commit()\n           \
  \ except MySQLdb.Error as error:\n                print(error)\n               \
  \ db.rollback()\n\n        # access each URL mentioned in tweet\n        urldict\
  \ = tweetdict['entities']['urls']\n        for url in urldict:\n            turl\
  \      = url['url']\n            texpanded = url['expanded_url']\n            tdisplay\
  \  = url['display_url']\n\n            try:\n                cursor.execute(u\"\
  INSERT IGNORE INTO ferguson_tweets_urls(tid, turl, texpanded, tdisplay) VALUES (%s,\
  \ %s, %s, %s)\", (tid,turl,texpanded,tdisplay))\n                db.commit()\n \
  \           except MySQLdb.Error as error:\n                print(error)\n     \
  \           db.rollback()\n\n        # access each user mentioned in tweet\n   \
  \     userdict = tweetdict['entities']['user_mentions']\n        for mention in\
  \ userdict:\n            tuserid = mention['id']\n            tscreen = mention['screen_name']\n\
  \            tname   = mention['name']\n\n            try:\n                cursor.execute(u\"\
  INSERT IGNORE INTO\n    ferguson_tweets_mentions(tid, tuserid, tscreen, tname)\n\
  \    VALUES (%s, %s, %s, %s)\", (tid,tuserid,tscreen,tname))\n                db.commit()\n\
  \            except MySQLdb.Error as error:\n                print(error)\n    \
  \            db.rollback()\n    # disconnect from server\n    db.close()\n```\n\n\
  有关推文 JSON 表示中提供的每个字段的更多信息，Twitter API 文档非常有帮助。关于 Users、Entities 和 Entities in Tweets\
  \ 的部分在规划从 JSON 推文中提取哪些字段时特别具有指导意义。你可以从 https://dev.twitter.com/overview/api/ 开始阅读文档。\n\
  \n运行此脚本后，四个表将被数据填充。在我的 MySQL 实例上，运行上述脚本处理我的 ids_1000.txt 文件后，tweets 表中有 893 行；hashtags\
  \ 表中有 1,048 行；user mentions 表中有 896 行；URLs 表中有 371 行。如果这里或那里行数较少，请检查是否因为推文已被删除。\n\
  \n## 第四步 – 简单数据分析\n\n假设我们想了解 Ferguson 数据集中链接最多的网页域名是什么。我们可以通过提取 ferguson_tweets_urls\
  \ 表中 tdisplay 列存储的 URL 的域名部分来回答这个问题。就我们的目的而言，我们将把第一个斜杠 (/) 之前的所有内容视为 URL 的有趣部分。\n\
  \n以下 SQL 查询给出了域名以及引用该域名的帖子数量：\n\n```\nSELECT left(tdisplay,locate('/',tdisplay)-1)\
  \ as url,\n    count(tid) as num\n    FROM ferguson_tweets_urls\n    GROUP BY 1\
  \ ORDER BY 2 DESC;\n```\n\n此查询的结果是一个数据集，看起来类似于以下内容（在 1,000 行样本集上运行）：\n\n| url |\
  \ num |\n|---|---|\n| bit.ly | 47 |\n| wp.me | 32 |\n| dlvr.it | 18 |\n| huff.to\
  \ | 13 |\n| usat.ly | 9 |\n| ijreview.com | 8 |\n| latimes.com | 7 |\n| gu.com |\
  \ 7 |\n| ift.tt | 7 |\n\n该数据集的这段摘录仅显示了前几行，但我们已经可以看到一些更受欢迎的结果是 URL 缩短服务，例如 bit.ly。我们还可以看到，仅通过使用\
  \ display 列而不是主 URL 列，我们就能移除所有由 Twitter 自身缩短器 t.co 创建的缩短 URL。\n\n在下一节中，我们可以使用这些计数构建条形图，方式与我们在第\
  \ 9 章 Stack Overflow 项目中构建简单图的方式类似。\n\n## 第五步 – 可视化数据\n\n要构建一个小型的 D3 启用图，我们可以遵循我们在第\
  \ 9 章 Stack Overflow 项目中使用的相同流程，在该流程中我们制作了一个查询数据库的 PHP 脚本，然后我们的 JavaScript 将结果用作条形图的实时输入。或者，我们也可以用\
  \ Python 生成一个 CSV 文件，让 D3 从这些结果生成其图表。由于我们在上一章已经使用过 PHP 方法，这里让我们使用 CSV 文件方法，仅为增加多样性。这也是在本章继续使用\
  \ Python 的一个好借口，因为这已经是我们一直在使用的语言。\n\n\n\n\n下面的脚本连接到数据库，筛选出使用最多的前 15 个 URL 及其计数，并将整个内容写入\
  \ CSV 文件：\n\n```\nimport csv\nimport MySQLdb\n\n# Open database connection\ndb =\
  \ MySQLdb.connect(host=\"localhost\",\n    user=\"username\",\n    passwd=\"password\"\
  ,\n    db=\"ferguson\",\n    use_unicode=True,\n    charset=\"utf8\")\ncursor =\
  \ db.cursor()\n\ncursor.execute('SELECT left(tdisplay, LOCATE(\\'\\/\\', tdisplay)-1)\
  \ as url, COUNT(tid) as num\n    FROM ferguson_tweets_urls\n    GROUP BY 1 ORDER\
  \ BY 2 DESC LIMIT 15')\n\nwith open('fergusonURLcounts.tsv', 'wb') as fout:\n  \
  \  writer = csv.writer(fout)\n    writer.writerow([ i[0] for i in cursor.description\
  \ ])\n    writer.writerows(cursor.fetchall())\n```\n\n一旦我们有了这个 CSV 文件，我们就可以将其输入到标准的\
  \ D3 条形图模板中，只是为了看看它是什么样子。以下内容可以命名为 buildBarGraph.html 或类似名称：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_253_0.png)\n\
  \n> 请确保你的本地文件夹中有 D3 库，就像你在前几章中所做的那样，同时还有你刚刚创建的 CSV 文件。\n\n```\n<!DOCTYPE html>\n\
  <meta charset=\"utf-8\">\n<!--\nthis code is modeled on mbostock's\n\"Let's Make\
  \ a Bar Chart\" D3 tutorial\navailable at http://bl.ocks.org/mbostock/3885304\n\
  My modifications:\n* formatting for space\n* colors\n* y axis label moved\n* changed\
  \ variable names to match our data\n* loads data via CSV rather than TSV file\n\
  -->\n<style>\n.bar {fill: lightgrey;}\n.bar:hover {fill: lightblue;}\n.axis {font:\
  \ 10px sans-serif;}\n.axis path, .axis line {\n  fill: none;\n  stroke: #000;\n\
  \  shape-rendering: crispEdges;\n}\n.x.axis path {display: none;}\n</style>\n<body>\n\
  <script src=\"d3.min.js\"></script>\n<script>\n\nvar margin = {top: 20, right: 20,\
  \ bottom: 30, left: 40},\n    width = 960 - margin.left - margin.right,\n    height\
  \ = 500 - margin.top - margin.bottom;\n\nvar x = d3.scale.ordinal()\n    .rangeRoundBands([0,\
  \ width], .1);\n\nvar y = d3.scale.linear()\n    .range([height, 0]);\n\nvar xAxis\
  \ = d3.svg.axis()\n    .scale(x)\n    .orient(\"bottom\");\n\nvar yAxis = d3.svg.axis()\n\
  \    .scale(y)\n    .orient(\"left\");\n\nvar svg = d3.select(\"body\").append(\"\
  svg\")\n    .attr(\"width\", width + margin.left + margin.right)\n    .attr(\"height\"\
  , height + margin.top + margin.bottom)\n  .append(\"g\")\n    .attr(\"transform\"\
  , \"translate(\" + margin.left + \",\" + margin.top +\n\")\");\n\nd3.csv(\"fergusonURLcounts.csv\"\
  , type, function(error, data) {\n    x.domain(data.map(function(d) { return d.url;\
  \ }));\n    y.domain([0, d3.max(data, function(d) { return d.num; })]);\n\n    svg.append(\"\
  g\")\n        .attr(\"class\", \"x axis\")\n        .attr(\"transform\", \"translate(0,\"\
  \ + height + \")\")\n        .call(xAxis);\n\n    svg.append(\"g\")\n        .attr(\"\
  class\", \"y axis\")\n        .call(yAxis)\n        .append(\"text\")\n        .attr(\"\
  transform\", \"rotate(-90)\")\n        .attr(\"y\", 6)\n        .attr(\"dy\", \"\
  -3em\")\n        .style(\"text-anchor\", \"end\")\n        .text(\"Frequency\");\n\
  \n    svg.selectAll(\".bar\")\n        .data(data)\n        .enter().append(\"rect\"\
  )\n        .attr(\"class\", \"bar\")\n        .attr(\"x\", function(d) { return\
  \ x(d.url) ; })\n        .attr(\"width\", x.rangeBand())\n        .attr(\"y\", function(d)\
  \ { return y(d.num); })\n        .attr(\"height\", function(d) { return height -\
  \ y(d.num); });\n});\n\nfunction type(d) {\n    d.num = +d.num;\n    return d;\n\
  }\n\n</script>\n</body>\n</html>\n```\n\n生成的条形图看起来像这里所示的那样。再次提醒，我们使用的是测试数据集，因此数字相当小：\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_256_0.png)\n\n使用我们的 CSV 文件在 D3 中绘制的简单条形图。\n\
  \n## 第六步 – 问题解决\n\n由于数据可视化并不是本书的主要目的，我们并不特别关心本节中图表的复杂程度，足以说明在 Ferguson 数据集中，除了指向最多的\
  \ URL 之外，还有许多更有趣的模式有待发现。现在你已经知道如何轻松下载和清理这个庞大的数据集，也许你可以发挥想象力来发现其中的一些模式。请记住，当你向你的崇拜者公布研究成果时，你不得发布推文本身或其元数据。但如果你问题的需要，可以发布推文\
  \ ID，或其子集。\n\n## 将此过程移至完整（非测试）表\n\n就像在 *第 9 章，Stack Overflow 项目* 中一样，我们创建了测试表，以便在压力较小的环境中开发项目，并使用可管理的推文数量进行收集。当你准备收集完整的推文列表时，请做好花费一些时间来完成这项工作的准备。Twitter\
  \ 的速率限制将会生效，twarc 的运行时间会很长。Ed Summers 在这篇博文中指出，运行 Ferguson 推文大约需要一周时间：http://inkdroid.org/journal/2014/11/18/on-forgetting/。当然，如果你小心谨慎，你只需要运行一次。\n\
  \n你可以做的一件事来加快水合推文 ID 的时间是与他人组队。你可以将推文 ID 文件分成两半，每人处理自己的推文部分。在数据清理过程中，请确保你将两者都 INSERT\
  \ 到同一个最终数据库表中。\n\n以下是我们将遵循的步骤，以更改项目以收集完整的推文集，而不是 1,000 条推文的样本：\n\n- 1. 按如下方式清空 `ferguson_tweets`、`ferguson_tweets_hashtags`、`ferguson_tweets_mentions`\
  \ 和 `ferguson_tweets_urls` 表：\n```sql\nTRUNCATE TABLE ferguson_tweets;\nTRUNCATE\
  \ TABLE ferguson_tweets_hashtags;\nTRUNCATE TABLE ferguson_tweets_mentions;\nTRUNCATE\
  \ TABLE ferguson_tweets_urls;\n```\n- 2. 按如下方式在完整的 `ids.txt` 文件而不是 `ids_1000.txt`\
  \ 文件上运行 twarc：\n```bash\ntwarc.py --consumer_key abcd --consumer_secret abcd --access_token\
  \ abcd --access_token_secret abcd --hydrate ids.txt > tweets.json\n```\n- 3. 重新运行\
  \ `jsonTweetCleaner.py` Python 脚本。\n\n此时，你将拥有一个清理干净的数据库，里面充满了推文、 hashtags、提及和 URL，准备好进行分析和可视化。由于现在每个表中的行数多得多，请注意，具体取决于你运行的查询类型，每一步可视化步骤的运行时间可能会更长。\n\
  \n## 总结\n\n在这个项目中，我们学习了如何根据推文的识别号码重建推文列表。首先，我们找到了符合 Twitter 最新 ToS 的高质量归档推文数据。我们学习了如何将其拆分为足够小的集合以用于测试目的。然后，我们学习了如何使用\
  \ Twitter API 和 twarc 命令行工具将每条推文水合为其完整的 JSON 表示形式。接下来，我们学习了如何在 Python 中提取 JSON 实体的部分内容，将字段保存到\
  \ MySQL 数据库中的新表集中。然后我们运行了一些简单的查询来统计最常见的 URL，并使用 D3 绘制了条形图。\n\n在这本书中，我们学习了如何执行各种数据清理任务，从简单到复杂。我们使用了各种语言、工具和技术来完成工作，在此过程中，我希望你能够完善现有的技能，同时学习许多新技能。\n\
  \n此时，我们的最终晚宴已经结束，你现在准备好在设备齐全——而且非常干净——的数据科学厨房中开始自己的清理项目了。你应该从哪里开始？\n\n- 你喜欢比赛和奖品吗？Kaggle\
  \ 在其网站 http://kaggle.com 上定期举办数据分析竞赛。你可以单独工作，也可以作为团队的一部分。许多团队需要干净的数据，所以这是一个绝佳的参与方式。\n\
  - 如果你更倾向于公共服务类型的人，我建议你试试 School of Data？他们的网站是 http://schoolofdata.org，他们举办课程和 Data\
  \ Expeditions，来自世界各地的专家和业余爱好者聚集在一起，使用数据解决现实世界的问题。\n- 为了扩展你的数据清理实践，我强烈建议你亲自动手尝试一些众多公开可用的数据集。KDnuggets\
