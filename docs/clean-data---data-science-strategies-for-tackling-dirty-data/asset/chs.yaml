  ,\"light \\\"Carolina\\\" blue\",\"129,000\"\n\"Manu\",\"1984-11-03\",\"red\",\"\
  159,960\"\n\"Martin\",\"1978-12-10\",\"yellow\",\"76,888\"\n```\n\n> 或者，我们可以尝试用单引号而不是双引号来封装，但然后我们可能会遇到带撇号的问题，例如\
  \ \"it's\" 或名字如 O'Malley。总是有问题的！\n\n分隔文件非常方便，因为它们易于理解，并且易于在简单的文本编辑器中访问。然而，正如我们所见，它们也需要在提前进行一些规划，以确保数据值真正正确分隔，并且一切都按预期格式化。\n\
  \n如果你不幸收到前面类似的分隔错误文件，我们将在第 3 章《清洁数据的支柱 – 电子表格和文本编辑器》中为你提供一些技巧和窍门来清理它们。\n\n## The\
  \ JSON format\n\n**JavaScript 对象表示法 (JSON)**，读作 JAY-sahn，是有时称为半结构化数据的一种更受欢迎的格式之一。与其名称的含义相反，JSON\
  \ 的有用性并不依赖于 JavaScript。该名称指的是它被设计用于序列化 JavaScript 对象。\n\n当数据值被标记，但其顺序无关紧要，而且实际上某些数据值甚至可能缺失时，一组数据可以称为半结构化。JSON\
  \ 文件只是一组属性-值对，例如：\n\n```\n{\n  \"firstName\": \"Sally\",\n  \"birthDate\": \"1971-09-16\"\
  ,\n  \"faveColor\": \"light\\\"Carolina\\\" blue\",\n  \"salary\":129000\n}\n```\n\
  \n属性在冒号的左侧，值在冒号的右侧。每个属性由逗号分隔。整个实体用大括号括起来。\n\nJSON 的一些方面与分隔文件相似，一些方面则不同。首先，字符串值必须用双引号引起来，因此字符串内部的任何双引号都必须用反斜杠转义。（转义字符\
  \ \\，当用作普通字符时，也必须转义！）\n\n在 JSON 中，除非值被视为字符串并正确引用，否则数值中不能包含逗号。（字符串化数字时要小心——你确定要这样做吗？然后，参考本章中的数据类型部分，它可以帮助你解决这些问题。）\n\
  \n```\n{\n  \"firstName\": \"Sally\",\n  \"birthDate\": \"1971-09-16\",\n  \"faveColor\"\
  : \"light\\\"Carolina\\\" blue\",\n  \"salary\": \"129,000\"\n}\n```\n\n多值属性是可以接受的，层次值也是如此（这些在分隔文件中都很难实现）。这里有一个\
  \ JSON 文件的示例，其中 pet 有多值属性，jobTitle 有数据层次。注意我们已将薪资数据移入这个新的工作层次中：\n\n```\n{\n  \"\
  firstName\": \"Sally\",\n  \"birthDate\": \"1971-09-16\",\n  \"faveColor\": \"light\\\
  \"Carolina\\\" blue\",\n  \"pet\":\n  [\n    {\n      \"type\": \"dog\",\n     \
  \ \"name\": \"Fido\"\n```\n\n\n\n```\n},\n{\n    \"type\": \"dog\",\n    \"name\"\
  : \"Lucky\"\n}\n],\n\"job\": {\n    \"jobTitle\": \"Data Scientist\",\n    \"company\"\
  : \"Data Wizards, Inc.\",\n    \"salary\":129000\n}\n}\n```\n\n## 尝试 JSON\n\nJSON\
  \ 因其可扩展性、简洁性以及对多值属性、缺失属性和嵌套属性/属性层级结构支持而成为一种极受欢迎的数据交换格式。用于分发数据集的 API 的日益普及也促进了 JSON\
  \ 的实用性。\n\n为了查看 API 如何使用搜索词生成以 JSON 编码的数据集的示例，我们可以尝试 iTunes API。iTunes 是苹果运营的音乐服务。任何人都可以查询\
  \ iTunes 服务以获取有关歌曲、艺术家和专辑的详细信息。搜索词可以按如下方式附加到 iTunes API URL：\n\n```\nhttps://itunes.apple.com/search?term=the+growlers\n\
  ```\n\n在此 URL 中，= 号之后的所有内容都是搜索词。在这种情况下，我搜索了我喜欢的一个乐队，叫做 The Growlers。请注意，有一个 + 号代表空格字符，因为\
  \ URL 不允许空格。\n\niTunes API 会根据我的搜索关键词从其音乐数据库返回 50 条结果。整个集合被格式化为一个 JSON 对象。与所有 JSON\
  \ 对象一样，它被格式化为名称-值对的集合。此示例中返回的 JSON 看起来很长，因为返回了 50 条结果，但每条结果实际上非常简单——在该 URL 中显示的\
  \ iTunes 数据中没有多值属性，甚至没有任何分层数据。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_44_0.png)\n\
  \n> 有关如何使用 iTunes API 的更多详细信息，请访问 Apple iTunes 开发者文档 https://www.apple.com/itunes/affiliates/resources/documentation/itunes-store-web-service-search-api.html。\n\
  \n## HTML 格式\n\nHTML 文件或网页文件是另一种经常包含大量有用数据的文本文件类型。你有多少次看到网站上的有趣表格或信息列表，并想要保存数据？有时，复制和粘贴可以用来尝试从网页创建分隔文件，但大多数时候，复制和粘贴并不能有效工作。HTML\
  \ 文件可能非常混乱，因此是从中提取数据的一种可能很痛苦的方式。因此，有时我们将网页文件称为非结构化数据。即使网页可能有一些 HTML 标签可用于尝试以模式化方式组织数据的分隔类型，它们也不总是如此。而且，这些各种\
  \ HTML 标签的应用方式存在很多出错的空间，无论是在不同网站之间还是在同一网站内部。\n\n下图仅显示了 `http://weather.com` 网站的一小部分。即使此屏幕截图中包含图片、颜色和其他非文本内容，在其最基本层面上，该网页是用\
  \ HTML 编写的，如果我们想从该页面提取文本数据，我们可以做到。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_45_0.png)\n\
  \n如果我们查看网页的 HTML 源代码，我们可以找到近 1,000 行 HTML 代码中的几行，这些代码构成了浏览器显示该特定天气表格的数据和布局指令：\n\n\
  ```\n806 <div class=\"wx-temperature-label\">FEELS LIKE\n807 <span itemprop=\"feels-like-temperature-fahrenheit\"\
  >43</span>&deg;</div>\n808 </div>\n809 <div class=\"wx-data-part\">\n810 <div class=\"\
  wx-temperature\">43<span class=\"wx-degrees\">&deg;</span></div>\n811 <div class=\"\
  wx-temperature-label\">HIGH AT 1:25 PM</div>\n812 </div>\n813 <div class=\"wx-data-part\"\
  >\n814 <div class=\"wx-temperature\">28<span class=\"wx-degrees\">&deg;</span></div>\n\
  815 <div class=\"wx-temperature-label\">LOW</div>\n816 </div>\n```\n\n确实是非结构化的！当然，从技术上讲，可以从此页面提取数据值\
  \ 43（华氏温度），但这不会是一个有趣的过程，而且我们无法保证我们的方法明天或后天仍然适用，因为 http://weather.com 随时可能更改网站的源代码。尽管如此，网络上仍有大量数据，因此在第\
  \ 5 章《从网络收集和清理数据》中，我们将介绍几种从基于网络的非结构化文件中提取数据的策略。\n\n## 归档和压缩\n\n文本文件何时也是二进制文件？当然是当它已被压缩或归档时。归档和压缩是什么？在本节中，我们将了解文件归档和压缩文件是什么，归档和压缩如何工作，以及每种的标准。\n\
  \n这是一个重要的部分，因为你在现实世界中发现的大量真实数据（尤其是分隔数据）在你找到它们时会被压缩。你作为数据科学家最有可能遇到哪些最常见的压缩格式？我们肯定会找到这个问题的答案。你可能也想在与他人分享数据时压缩数据。如何确定哪种压缩方法是最好的选择？\n\
  \n## 归档文件\n\n归档文件只是一个包含其中多个文件的文件。这些文件内部可以是文本、二进制或两者混合。归档文件由特殊程序创建，该程序将文件列表更改为单个文件。当然，归档文件是以可以扩展回多个文件的方式创建的。\n\
  \n## tar\n\n你在进行数据科学工作时最有可能遇到的最常见的归档文件是所谓的磁带归档（TAR）文件，使用 tar 程序创建，通常带有 .tar 扩展名。它们的最初目的是创建磁带归档。\n\
  \ntar 程序可在类 Unix 操作系统上使用，我们也可以在 Mac OSX 终端中使用它。\n\n要创建 tar 文件，只需指示 tar 程序你想要包含哪些文件以及输出文件名应为多少。（程序选项\
  \ c 用于指示我们正在创建新的归档文件，选项 v 在提取时打印文件名。选项 f 让我们指定输出文件名。）\n\n```\ntar cvf fileArchive.tar\
  \ reallyBigFile.csv anotherBigFile.csv\n```\n\n要“解包”文件（或将其扩展为所有文件的完整列表），只需将 tar\
  \ 程序指向你想要扩展的文件。xvf 中的 x 字母代表 eXtract（提取）：\n\n```\ntar xvf fileArchive.tar\n```\n\
  \n那么，.tar 归档文件包含多个文件，但有多少个以及文件是什么？你希望在开始提取文件之前确保有足够的可用磁盘空间，并且文件确实是你一开始想要的文件。tar\
  \ 命令中的 t 选项将显示 tar 文件内部的文件列表：\n\n```\ntar -tf fileArchive.tar\n```\n\n除了 tar 之外还有许多其他归档程序，但其中一些有趣的程序（例如\
  \ OSX 上的内置归档 ZIP 压缩器以及 Windows 上的各种 ZIP 和 RAR 实用程序）在归档之外还对文件进行压缩，因此我们可能应该接下来讨论这个概念。\n\
  \n## 压缩文件\n\n压缩文件是那些被缩小以占用更少空间的文件。文件越小，磁盘上的存储空间越少，如果文件需要在网络上共享，传输时间也越快。对于我们感兴趣的数据文件而言，假设压缩文件可以轻松解压缩回原始文件。\n\
  \n## 如何压缩文件\n\n创建压缩文件的方法有很多，选择哪一种取决于你使用的操作系统和已安装的压缩软件。例如，在 OSX 上，任何文件或文件夹（或组）都可以轻松压缩，只需在\
  \ Finder 中选择它，右键单击并从菜单中选择压缩即可。此操作将在与原始文件相同的目录中创建一个压缩的（.zip 扩展名）文件。这在以下图像中显示：\n\n\
  ![](img/9aa003afabe05fdb07da46ad71325de6_48_0.png)\n\n## 如何解压缩文件\n\n数据科学流程的收集步骤通常包括下载压缩文件。这些可能是我们在本章前面描述的分隔文本文件，也可能是包含多种类型数据文件的文件，例如电子表格或用于构建数据库的\
  \ SQL 命令。\n\n在任何情况下，解压缩文件都会将数据返回到我们可以用来实现目标的状态。我们如何知道使用哪个程序来解压缩文件？第一个也是最大的线索是文件的扩展名。这是压缩程序创建文件的关键提示。知道如何解压缩文件取决于它是如何被压缩的。\n\
  \n在 Windows 中，你可以通过右键单击文件并选择属性来查看与文件扩展名关联的已安装程序。然后，查找“打开方式”选项，以查看 Windows 认为哪个程序将解压缩文件。\n\
  \n本节的其余部分将概述如何在 OSX 或 Linux 系统上使用命令行程序。\n\n\n\n## 使用 zip、gzip 和 bzip2 进行压缩\n\nzip、gzip\
  \ 和 bzip2 是最常见的压缩程序。它们的解压对应程序分别称为 Unzip、Gunzip 和 Bunzip2。\n\n下表展示了在这些程序中压缩和解压的示例命令行。\n\
  \n| | Compress | Uncompress |\n|---|---|---|\n| Zip | `zip filename.csv filename.zip`\
  \ | `unzip filename.zip` |\n| gzip | `gzip filename.csv filename.gz` | `gunzip filename.gz`\
  \ |\n| bzip2 | `bzip2 filename.csv filename.bz2` | `bunzip2 filename.bz2` |\n\n\
  有时，你会看到一个文件同时包含 .tar 和 .gz 扩展名或 .bz2 扩展名，像这样：somefile.tar.gz。常见的其他组合包括：.tgz 和 .tbz2，如\
  \ somefile.tgz。这些文件是先被 tar 打包（归档），然后再使用 gzip 或 bzip2 进行压缩。原因在于 gzip 和 bzip2 并不是归档程序；它们只是压缩器。因此，它们一次只能压缩单个文件（或文件归档）。由于\
  \ tar 的工作是将多个文件合并成单个文件，因此这些程序经常一起出现。\n\ntar 程序甚至有一个内置选项，可以在打包后立即对文件进行 gzip 或 bzip2\
  \ 压缩。要对新创建的 .tar 文件进行 gzip 压缩，我们只需在之前的 tar 命令中添加 z，并修改文件名：\n\n```\ntar cvzf fileArchive.tar.gz\
  \ reallyBigFile.csv anotherBigFile.csv\n```\n\n或者，你可以分两步完成：\n\n```\ntar cvf fileArchive.tar\
  \ reallyBigFile.csv anotherBigFile.csv\n```\n\n```\ngzip fileArchive.tar\n```\n\n\
  这一系列命令将创建 fileArchive.tar.gz 文件：\n\n要解压 tar.gz 文件，请使用两步：\n\n```\ngunzip fileArchive.tar.gz\n\
  ```\n\n```\ntar xvf fileArchive.tar\n```\n\n这些步骤也适用于 bzip2 文件：\n\n```\ntar cvjf\
  \ fileArchive.tar.bz2 reallyBigFile.csv anotherBigFile.csv\n```\n\n要解压 tar.bz2 文件，请使用两步：\n\
  \n```\nbunzip2 fileArchive.tar.bz2\n```\n\n```\ntar xvf fileArchive.tar\n```\n\n\
  ## 压缩选项\n\n在压缩和解压时，还有许多其他选项需要考虑，以便让你的数据清洗工作更轻松：\n\n- 你是否想压缩文件同时保留原始文件？默认情况下，大多数压缩和归档程序会删除原始文件。如果你想保留原始文件并同时创建其压缩版本，通常可以指定这一点。\n\
  - 你是否想向现有压缩文件添加新文件？大多数归档和压缩程序中都有此选项。有时，这被称为 **updating** 或 **replacing**。\n- 你是否想加密压缩文件并要求密码才能打开？许多压缩程序都提供此选项。\n\
  - 解压时，你是否想用同名文件覆盖目录中的文件？请查找 **force** 选项。\n\n根据你使用的压缩软件及其选项，你可以使用许多这些选项来使处理文件的工作更轻松。对于大文件——无论是体积大还是数量多——这一点尤其如此！\n\
  \n## 我应该使用哪种压缩程序？\n\n本节关于归档和压缩的概念适用于任何操作系统和任何类型的压缩数据文件。大多数时候，我们会从某个地方下载压缩文件，我们的主要关注点是高效地解压这些文件。\n\
  \n但是，如果你自己创建压缩文件怎么办？如果需要解压数据文件、清理它，然后重新压缩并发送给同事怎么办？或者，如果你可以选择下载的文件，每个文件使用不同的压缩格式：zip、bz2\
  \ 或 gz？你应该选择哪种格式？\n\n假设我们处于一个允许使用多种压缩类型的操作环境中，有一些经验法则可以说明不同压缩类型的各种优缺点。\n\n我们在做出压缩决策时使用的一些因素包括：\n\
  \n- 压缩和解压的速度\n- 压缩比（文件变小了多少？）\n- 压缩解决方案的互操作性（我的受众能否轻松解压此文件？）\n\n## 经验法则\n\nGzip\
  \ 压缩和解压速度更快，并且在每台 OSX 和 Linux 机器上都 readily available。然而，一些 Windows 用户可能没有 readily\
  \ available 的 gunzip 程序。\n\nBzip2 比 gzip 和 zip 产生更小的文件，但耗时更长。它在 OSX 和 Linux 上广泛使用。如果\
  \ Windows 用户尚未安装特殊软件，他们可能难以处理 bzip2 文件。\n\nZip 在 Linux、OSX 和 Windows 上都 readily\
  \ available，其压缩和解压速度也不算糟糕。然而，它并不能产生非常理想的压缩比（其他压缩器会产生更小的文件）。尽管如此，其普遍性和相对速度（例如与 bzip2\
  \ 相比）是其强项。\n\nRAR 是 Windows 的一种广泛可用的归档和压缩解决方案；然而，其在 OSX 和 Linux 上的可用性需要特殊软件，并且其压缩速度不如某些其他解决方案。\n\
  \n最终，你必须根据正在进行的特定项目以及你的受众或用户的需求来决定压缩标准，无论是自己、客户还是客户。\n\n## 数据类型、空值和编码\n\n本节概述了数据科学家必须定期处理的最常见数据类型以及这些类型之间的一些差异。我们还讨论了在数据类型之间转换以及如何在不丢失信息的情况下安全转换（或至少事先了解风险）。\n\
  \n本节还涵盖了神秘的空值、null 和空白世界。我们探讨了各种类型的缺失数据，并描述了缺失数据如何负面影响数据分析结果。我们将比较处理缺失数据的选择和权衡，以及每种方法的利弊。\n\
  \n由于我们的大部分数据将以字符串形式存储，我们将学习识别不同的字符编码以及在真实世界数据中会遇到的一些常见格式。我们将学习如何识别字符编码问题以及如何为特定数据集确定适当的字符编码类型。我们将编写一些\
  \ Python 代码以从一种编码方案转换到另一种编码方案。我们还将介绍这种策略的局限性。\n\n## 数据类型\n\n无论我们是在清理存储在文本文件、数据库系统还是其他格式中的数据，我们都会开始认识到相同类型的数据一次又一次出现：各种数字、日期、时间、字符、字符字符串等等。接下来的部分描述了一些最常见的数据类型，以及每个类型的一些示例。\n\
  \n## 数值数据\n\n在本节中，我们将发现存储数字的方式有很多种，其中一些比其他方式更容易清理和管理。尽管如此，与字符串和日期相比，数字相对简单，因此我们将从这些开始，然后再转向更棘手的数据类型。\n\
  \n## 整数\n\n整数，或整数，可以为正或负，正如名称所示，它们没有小数点或分数。根据整数存储在何种存储系统中，例如在 **Database Management\
  \ System (DBMS)** 中，我们可能还会有关于整数可以存储多大的额外信息，以及它是否允许有符号（正负值）或仅无符号（全部为正值）。\n\n## 带小数点的数字\n\
  \n在我们的数据清洗工作中，具有小数部分的数字——例如价格、平均值、测量值等——通常使用小数点表示（而不是分子/分母）。有时，特定的存储系统也制定规则，规定小数点后允许的数字位数（**scale**）以及数字中允许的总位数（**precision**）。例如，我们说数字\
  \ 34.984 的精度为 5，小数为 3。\n\n\n\n不同的数据存储系统也会允许不同类型的十进制数字。例如，在设置数据库时，DBMS 可能允许我们声明将存储浮点数、十进制数以及货币/金额数。它们各自的行为会略有不同——例如在数学问题中。我们需要阅读\
  \ DBMS 为每种数据类型提供的指导并及时了解变化。很多时候，由于内存考虑或其他原因，DBMS 提供商会更改特定数据类型的规范。\n\n另一方面，与 DBMS\
  \ 应用不同，电子表格应用程序旨在除了存储数据之外还显示数据。因此，我们实际上可能以一种格式存储数字，而以另一种格式显示它。如果在电子表格的数据单元格中应用了格式，这可能会引起一些混淆。下面的图示显示了为单元格设置的一些十进制显示属性的示例。公式栏显示完整的数字\
  \ 34.984，但单元格显示该数字似乎已被向下舍入。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_53_0.png)\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_53_1.png)\n\n> 在世界许多地区，逗号字符用于分隔数字的小数部分和非小数部分，而不是点或句点字符。这是一个很好的提醒，始终值得检查你所使用的系统的本地化设置，并确保它们与你正在处理的数据的预期相匹配。例如，在\
  \ OSX 中，**Language & Region** 对话框位于 **Systems Preferences** 菜单中。从这里，你可以根据需要更改本地化设置。\n\
  \n与 DBMS 不同，原始文本文件没有指定数字字段的大小或期望值的选项，而且与电子表格不同，文本文件也没有针对给定数据值的显示选项。如果文本文件显示的值为 34.98，那么这可能就是我们对该数字所知道的全部信息。\n\
  \n## 当数字不是数值时\n\n数值数据首先主要由 0-9 的数字序列组成，有时还包括小数点。但关于真正数值数据的一个关键点是，它主要设计用于在其上执行计算。当我们期望能够对数据值进行\
  \ *do math*、期望数值比较一个值与另一个值，或希望项目按数值顺序排序时，我们应选择数值存储。在这些情况下，数据值需要以数字形式存储。请考虑以下按数值从低到高排序的数字列表：\n\
  \n- 1\n- 10\n- 11\n- 123\n- 245\n- 1016\n\n现在，考虑将同一列表作为地址字段中的文本值进行排序：\n\n- 1 Elm\
  \ Lane\n- 10 Pine Cir.\n- 1016 Pine Cir.\n- 11 Front St.\n- 123 Main St.\n- 245\
  \ Oak Ave.\n\n电话号码和邮政编码（以及街道地址中的门牌号，如前例所示）通常由数字组成，但当我们将它们视为数据值时，它们更类似于文本还是数值数据？我们计划对它们进行加法、减法，或计算平均值或标准差吗？如果不打算这样做，它们可能更适合存储为文本值。\n\
  \n## 日期和时间\n\n你可能熟悉许多不同的日期书写方式，并且可能有一些你更偏爱的方式。例如，以下是书写同一日期的几种常见方式：\n\n- 11-23-14\n\
  - 11-23-2014\n- 23-11-2014\n- 2014-11-23\n- 23-Nov-14\n- November 23, 2014\n- 23\
  \ November 2014\n- Nov. 23, 2014\n\n无论我们偏爱哪种日期书写方式，完整的日期都由三个部分组成：月份、日期和年份。任何日期都应能解析为这些组成部分。日期混淆通常出现在两个方面：对于小于\
  \ 12 的数字，月份标识符和日期标识符缺乏清晰度，以及指定年份的混淆。例如，如果我们只看到“11-23”，我们可以假设是 11 月 23 日，因为没有缩写为“23”的月份，但那是哪一年呢？如果我们看到“11-12”这个日期，是\
  \ 11 月的第 12 天还是 12 月的第 11 天？又是在哪一年？38 年是指 1938 年还是 2038 年？\n\n大多数 DBMS 在你将数据指定为日期时有特定的导入方式，如果你导出数据，也会以该日期格式返回。然而，这些系统也有许多函数可以应用以重新格式化日期或提取你想要的部分。例如，MySQL\
  \ 有许多有趣的日期函数，允许我们仅提取月份或日期，以及更复杂的函数，允许我们找出特定日期在一年中的第几周或那天是星期几。例如，以下 SQL 统计了第 1 章《Why\
  \ Do You Need Clean Data?》中的 Enron 数据集中在每年 5 月 12 日发送的消息，并打印出星期几：\n\n```\nSELECT\
  \ YEAR(date) AS yr, DAYOFWEEK(date) AS day, COUNT(mid)\nFROM message WHERE MONTHNAME(date)\
  \ = \"May\" AND DAY(date) = 12\nGROUP BY yr, day\nORDER BY yr ASC;\n```\n\n一些电子表格程序，如\
  \ Excel，内部将日期存储为数字，但随后允许用户使用内置或自定义格式以任何喜欢的格式显示值。Excel 将给定日期值存储为自 1899 年 12 月 31\
  \ 日以来的天数的小数部分。你可以通过输入日期并要求常规格式来查看 Excel 中日期的内部表示，如下图所示。Excel 将 1986 年 5 月 21 日存储为\
  \ 31553。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_56_0.png)\n\n因此，当你在不同格式之间转换时，将斜杠改为破折号，或交换月份和日期的顺序，Excel\
  \ 只是对你所看到的日期应用了不同的外观，但在底层，其对日期值的内部表示并未改变。\n\n为什么 Excel 需要用小数来存储自 1899 年以来的日期？天数不是整数吗？事实证明，小数部分是\
  \ Excel 存储时间的方式。\n\n| E | F |\n|---|---|\n| 格式化为日期和时间 | 格式化为 'general' |\n| 5/21/86\
  \ 12:00 AM | 31553 |\n| 5/21/86 12:00 PM | 31553.5 |\n| 5/21/86 6:00 PM | 31553.75\
  \ |\n\n在前面的图中，我们可以看到内部日期 31553 如何映射到午夜，但 31553.5（一天的中间）是中午，而 31553.75 是下午 6 点。我们在小数点上添加的精度越大，内部表示中的时间特异性就越大。\n\
  \n但并非所有数据存储系统都将日期和时间存储为分数，并且它们也不都从同一个起点开始。一些系统将日期和时间存储为自 Unix 纪元（00:00:00，1970 年\
  \ 1 月 1 日，世界协调时）以来的秒数，并使用负数来存储纪元之前的时间。\n\nDBMS 和电子表格应用程序都允许进行一些日期运算，就像数字一样。在这两种类型的系统中，都有函数允许对日期进行减法以找到差异，或进行其他计算，例如将一周的数字加到某一天并得到新的日期值。\n\
  \n## 字符串\n\n字符串代表任何字符数据的序列，包括字母、数字、空格和标点符号、数百种语言中的字符以及各种特殊用途符号。字符串非常灵活，这使得它们成为存储数据最常见的方式。此外，由于它们可以存储几乎任何其他类型的数据（不一定高效），字符串成为在系统之间通信数据或移动数据的最低公分母。\n\
  \n与数值数据一样，我们当前使用的存储机制可能有一些我们预期要使用的字符串指南。例如，DBMS 或电子表格可能要求我们提前说明我们期望字符串的大小或我们期望的字符类型。字符编码本身就是一个有趣且重要的领域，因此本章后面我们将专门介绍它。\n\
  \n或者，在特定环境中，可能有关于我们允许处理的数据大小的指南。在数据库世界中，有固定宽度和可变宽度字符列，旨在保存较短的字符串，一些 DBMS 厂商设计了文本类型，旨在保存较长的字符串。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_57_0.png)\n\n> 通常，许多数据科学家会扩展这种术语。随着字符串数据变得更大、更难以处理，它被称为文本数据，其分析成为文本分析或文本挖掘。\n\
  \n字符串（或文本）数据可以在本章前面讨论的任何文件格式中找到（分隔文件、JSON 或网页），并且可以存储在或通过我们讨论过的许多存储解决方案访问（API、DBMS、电子表格和平文件）。但无论存储和交付机制如何，似乎字符串最常与大数据、混乱的非结构化数据一起讨论。Excel\
  \ 专家如果被要求解析几百个街道地址的各个部分或将几千个书名分类到类别中，不会感到困扰。没有统计学家或程序员会被要求计算词表中字符频率而眨眼。但当字符串操作变成“从\
  \ 9000 万封用俄语写成的电子邮件中提取嵌入的源代码”或“计算 Stack Overflow 网站全部内容的词汇多样性”时，事情就会变得更有趣得多。\n\n\
  \n\n## 其他数据类型\n\n数字、日期/时间 和 字符串 是三大主要数据类型，但根据我们工作的环境，我们还会遇到许多其他类型的奇异数据。以下是其中一些更有趣类型的简要介绍：\n\
  \n- **集合/枚举**：如果您的数据似乎只有少数几种可能的数据值可供选择，您可能正在查看集合或枚举（enum）类型。枚举数据的示例可能是大学课程中可能的最终成绩集合：{A,\
  \ A-, B+, B, B-, C+, C, C-, D+, D, D-, F, W}。\n- **布尔值**：如果您的数据仅限于两种选择之一，并且它们求值为\
  \ 0/1 或 true/false，您可能正在查看布尔数据。名为 package_shipped 的数据库列可能具有 yes 或 no 的值，表示包裹是否已发出。\n\
  - **BLOB（二进制大对象）**：如果您的数据是二进制的，例如，您存储的是图片文件的实际字节（而不仅仅是链接）或 mp3 音乐文件的实际字节，那么您可能正在查看\
  \ blob 数据。\n\n## 数据类型之间的转换\n\n数据类型之间的转换是数据清洗工作中不可避免的一部分。您可能获得的是字符串数据，但您知道需要对其进行数学运算，因此希望将其存储为数字。您可能获得的是一种格式的日期字符串，但希望将其转换为另一种日期格式。不过，在继续之前，我们需要讨论转换中可能出现的一个问题。\n\
  \n## 数据丢失\n\n在从一种数据类型转换为另一种数据类型时存在数据丢失的风险。通常，这发生在目标数据类型无法存储与原始数据类型一样多细节时。有时我们并不在意数据丢失（事实上，甚至可能有数据清洗过程需要一定程度的故意丢失），但如果我们没有预料到数据丢失，它可能会造成毁灭性后果。风险因素包括：\n\
  \n- **在相同数据类型的不同大小之间转换**：假设您有一个长度为 200 个字符的字符串列，并决定将其数据移动到仅有 100 个字符长的列中。任何超过 100\
  \ 个字符的数据可能会被截断或切掉。这在不同大小的数字列之间切换时也会发生，例如从大整数到常规整数，或从常规整数到微小整数。\n- **在不同精度级别之间转换：**\
  \ 假设您有一列精确到四位小数的小数列表，然后将其转换为两位精度的数字，甚至更糟，转换为整数。每个数字将被四舍五入或截断，您将失去原有的精度。\n\n## 转换策略\n\
  \n处理数据类型转换有许多策略，您使用的策略取决于数据当前存储的位置。我们将介绍数据科学清洗过程中最常见的两种数据类型转换方式。\n\n第一种策略，基于 SQL\
  \ 的操作，适用于数据存储在数据库中的情况。我们可以使用几乎每个数据库系统都提供的数据库函数，对数据进行切片和处理，转换为适合作为查询结果导出或存储到另一列的格式。\n\
  \n第二种策略，基于文件的操作，在我们获得平面数据文件（例如电子表格或 JSON 文件）并且需要在从文件中读取后以某种方式操作数据类型时发挥作用。\n\n##\
  \ SQL 级别的类型转换\n\n在这里，我们将介绍几种 SQL 可用于操作数据类型的常见情况。\n\n### 示例一 – 将 MySQL 日期解析为格式化字符串\n\
  \n对于此示例，我们将回到第 1 章《为什么需要干净的数据？》中使用的 Enron 电子邮件数据集。与之前的示例一样，我们将查看 message 表，其中我们使用的是\
  \ date 列，其存储为 datetime MySQL 数据类型。假设我们想打印完整的日期，其中月份拼写出来（而不是数字），甚至包括星期几和一天中的时间。我们如何最好地实现这一点？\n\
  \n对于 message ID（mid）为 52 的记录，我们有：\n\n```\n2000-01-21 04:51:00\n```\n\n我们想要的是：\n\n\
  ```\n4:51am, Friday, January 21, 2000\n```\n\n- 选项 1：使用 concat() 和单独的日期和时间函数，如以下代码示例所示。此选项的缺点是\
  \ a.m./p.m. 不容易打印：\n\n```\nSELECT concat(hour(date),\n':',\nminute(date),\n', ',\n\
  dayname(date),\n', ',\nmonthname(date),\n' ',\nday(date),\n', ',\nyear(date))\n\
  FROM message\nWHERE mid=52;\n```\n\n结果：\n\n```\n4:51, Friday, January 21, 2000\n\
  ```\n\n如果我们真的想要 a.m./p.m.，我们可以使用 if 语句测试小时数，如果小时数小于 12 则打印 \"am\"，否则打印 \"pm\"：\n\
  \n```\nSELECT concat(\n    concat(hour(date),\n        ': ',\n        minute(date)),\n\
  \    if(hour(date)<12,'am','pm'),\n    concat(\n        ', ',\n        dayname(date),\n\
  \        ', ',\n        monthname(date),\n        ' ',\n        day(date),\n   \
  \     ', ',\n        year(date)\n)\n)\nFROM message\nWHERE mid=52;\n```\n\n结果：\n\
  \n4:51am Friday, January 21, 2000\n\n![](img/9aa003afabe05fdb07da46ad71325de6_61_0.png)\n\
  \n> MySQL 日期和时间函数，例如 day() 和 year()，在其文档中有描述：http://dev.mysql.com/doc/refman/5.7/en/date-and-time-functions.html，其字符串函数，例如\
  \ concat()，可以在此处找到：http://dev.mysql.com/doc/refman/5.7/en/string-functions.html。其他数据库管理系统将有这些函数的类似版本。\n\
  \n- 选项 2：使用更复杂的 date_format() MySQL 函数。此函数接受一系列字符串说明符，用于指定您希望如何格式化日期。MySQL 文档中有这些说明符的非常长的列表。以下代码中显示了一个将日期转换为我们所需格式的完整示例：\n\
  \n```\nSELECT date_format(date, '%l:%i%p, %W, %M %e, %Y')\nFROM message\nWHERE mid=52;\n\
  ```\n\n结果：\n\n4:51AM, Friday, January 21, 2000\n\n这与我们想要的非常接近，而且比选项 1 短得多。唯一的区别是\
  \ a.m./p.m. 是大写的。如果我们真的想要小写，可以这样做：\n\n```\nSELECT concat(\n    date_format(date,\
  \ '%l:%i'),\n    lower(date_format(date,'%p ')),\n    date_format(date,'%W, %M %e,\
  \ %Y')\n)\nFROM message\nWHERE mid=52;\n```\n\n结果：\n\n4:51am, Friday, January 21,\
  \ 2000\n\n### 示例二 – 将字符串转换为 MySQL 的日期类型\n\n对于此示例，让我们查看 Enron 模式中的一个新表：名为 `referenceinfo`\
  \ 的表。该表显示了其他消息引用的消息。例如，该表中 `rfid` 为 2 的第一条记录，包含消息 79 引用的电子邮件的文本。该列是字符串，其数据如下所示（部分）：\n\
  \n```\n> From: Le Vine, Debi> Sent: Thursday, August 17, 2000 6:29 PM> To: ISO Market\
  \ Participants> Subject: Request for Bids - Contract for Generation Under Gas> Curtailment\
  \ Conditions>> Attached is a Request for Bids to supply the California ISO with>\
  \ Generation\n```\n\n这是一个非常混乱的字符串！让我们来提取顶行显示的日期，并将其转换为 MySQL 日期类型，以便插入到另一个表或执行一些日期计算。\n\
  \n为此，我们将使用内置的 `str_to_date()` MySQL 函数。此函数有点像我们之前看到的 `date_format()`，只是方向相反。以下是一个工作示例，它将查找单词\
  \ `Sent:` 并提取其后直到 `>` 符号的字符，然后将这些字符转换为真正的 MySQL datetime 数据类型：\n\n```\nSELECT\n\
  str_to_date(\n  substring_index(\n    substring_index(reference,' >',3),\n    'Sent:\
  \ ',\n    -1\n  ),\n  '%W,%M %e, %Y %h:%i %p'\n)\nFROM referenceinfo\nWHERE mid=79;\n\
  ```\n\n结果：\n\n```\n2000-08-17 18:29:00\n```\n\n现在我们有一个 datetime 值，可以准备插入到新的 MySQL\
  \ 列中，或对其执行更多日期函数或计算。\n\n\n\n## 示例三 – 将 MySQL 字符串数据强制转换或转换为十进制数字\n\n在本示例中，让我们考虑如何将隐藏在文本列中的数字转换为适合计算的格式。\n\
  \n假设我们有兴趣从 Enron 收到的邮件列表发送的某些电子邮件中提取一桶石油的价格（缩写为 bbl）。\n\n我们可以编写一个查询，使得每当我们在某个发件人的电子邮件中看到\
  \ /bbl 字符串时，就查找前面的美元符号并将附加的数值提取为十进制数字。\n\n以下是 Enron 消息表中 message ID（mid）为 270516\
  \ 的电子邮件消息中的示例片段，展示了数字在字符串中的外观：\n\n```\nMarch had slipped by 51 cts at the same time\
  \ to trade at $18.47/bbl.\n```\n\n执行此字符串提取并转换为十进制的 MySQL 命令如下：\n\n```\nSELECT convert(\n\
  \    substring_index(\n        substring(\n            body,\n            locate('$',body)+1\n\
  \        ),\n        '/bbl',\n        1\n    ),\n    decimal(4,2)\n) as price\n\
  FROM message\nWHERE body LIKE \"%$%\" AND body LIKE \"%/bbl%\" AND sender =\n  \
  \  'energybulletin@platts.com';\n```\n\n添加 WHERE 子句限制是为了确保我们只获取包含 bbl 油价的消息。\n\n\
  convert() 函数与 MySQL 中的 cast() 类似。大多数现代数据库系统都将有一种方法将数据类型转换为此类数字。\n\n## 文件级别的类型转换\n\
  \n在本节中，我们将展示一些在文件级别需要操作数据类型的常见情况。\n\n> 这些材料仅适用于具有隐式类型结构的文件类型，例如电子表格和像 JSON 这样的半结构化数据！我们在此没有使用分隔（纯文本）平面文件的示例，因为在文本文件中，所有数据都是文本数据！\n\
  \n### 示例一 – 在 Excel 中进行类型检测和转换\n\n您可能熟悉通过单元格格式菜单选项在 Excel 和类似的电子表格应用程序中进行类型转换。典型流程涉及选择要更改的单元格并使用位于功能区的下拉菜单。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_64_0.png)\n\n或者，如果这提供的选项不够，还有位于格式菜单中的“设置单元格格式”对话框，它提供了对转换过程输出的更精细控制。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_65_0.png)\n\n较少为人所知的 istext() 和 isnumber()\
  \ 函数在 Excel 中格式化数据时也可能有用。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_65_1.png)\n\
  \n这些函数可以应用于任何单元格，并根据数据是否为文本返回 TRUE 或 FALSE，或者在 isnumber() 的情况下，数字是否真的是数字。将它们与条件格式等功能配对，这两个公式可以帮助您在少量数据中定位错误值或类型错误的值。\n\
  \nExcel 除了使用菜单外，还有一些用于将字符串操作为其他数据类型的简单函数。以下图示显示了 TEXT() 函数被用来将数值日期转换为 yyyy-mm-dd\
  \ 格式的日期字符串。在公式栏中，我们输入 =TEXT(A4,\"yyyy-mm-dd\")，36528 这个数字被转换为 2000-01-03。日期字符串现在以我们指定的格式出现。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_66_0.png)\n\n### 示例二 – 在 JSON 中进行类型转换\n\
  \nJSON 作为一种半结构化的基于文本的格式，在格式和数据类型方面提供的选项并不多。回顾本章前面关于 JSON 的描述，JSON 对象是作为名称-值对构造的。名称-值对的值部分的格式选项只有文本字符串、数字或列表。虽然可以手工构建\
  \ JSON 对象——例如，通过在文本编辑器中键入它们——通常，我们以编程方式构建 JSON 对象，要么从数据库导出 JSON，要么编写一个小型程序将平面文本文件转换为\
  \ JSON。\n\n如果我们设计用于生成 JSON 的程序有缺陷会怎样？假设程序给我们的是字符串而不是数字。这种情况偶尔会发生，并且可能对设计用于消费 JSON\
  \ 的任何程序产生意想不到的后果。以下是一些示例，展示了旨在生成 JSON 的简单 PHP 代码，该 JSON 稍后将被读入 D3 以构建图表。\n\n从数据库生成数据集的\
  \ JSON 表示的 PHP 代码很直接。如下示例所示的示例代码，连接到 Enron 数据库，构建查询，运行查询，将查询结果的每个部分放入数组中，然后将数组值编码为\
  \ JSON 名称-值对。以下是构建日期和计数列表的代码，就像我们在第 1 章《为什么需要干净的数据？》中使用的日期和计数一样：\n\n```\n<?php\n\
  // connect to db\n$dbc = mysqli_connect('localhost','username','password','enron')\n\
  or die('Error connecting to database!' . mysqli_error());\n\n// the same sample\
  \ count-by-date query from chapter 1\n$select_query = \"SELECT date(date) AS dateSent,\
  \ count(mid) AS numMsg FROM message GROUP BY 1 ORDER BY 1\";\n$select_result = mysqli_query($dbc,\
  \ $select_query);\n// die if the query failed\nif (!$select_result)\n    die (\"\
  SELECT failed! [$select_query]\" . mysqli_error());\n// build a new array, suitable\
  \ for json printing\n$counts = array();\nwhile($row = mysqli_fetch_array($select_result))\n\
  {\n    array_push($counts, array('dateSent' => $row['dateSent'],\n        'numMsg'\
  \  => $row['numMsg']));\n}\necho json_encode($counts);\n?>\n```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_67_0.png)\n\
  \n请注意，json_encode() 函数需要 PHP 5.3 或更高版本，并且此示例依赖于我们在第 1 章《为什么需要干净的数据？》中构建的同一个可工作的\
  \ Enron 数据库。\n\n这里的问题是结果被字符串化了——PHP 将 numMsg 的数值放在了引号中，在 JSON 中这意味着字符串值：\n\n```\n\
  [\n    {\"dateSent\":\"0001-05-30\",\"numMsg\":\"2\"},\n    {\"dateSent\":\"0001-06-18\"\
  ,\"numMsg\":\"1\"}\n]\n```\n\n为了促使 PHP 函数对数值真正小心，而不是简单地假设一切都是字符串，我们需要在打印到屏幕之前专门将值转换为数字。只需更改我们调用\
  \ json_encode() 的方式，使其如下所示：\n\n```\necho json_encode($counts, JSON_NUMERIC_CHECK);\n\
  ```\n\n现在 JSON 结果包含 numMsg 的实际数字：\n\n```\n[\n    {\"dateSent\":\"0001-05-30\",\"\
  numMsg\":2},\n    {\"dateSent\":\"0001-06-18\",\"numMsg\":1}\n]\n```\n\nPHP 还包括将大整数转换为字符串的类似函数。当您有极大的数字但出于某种原因需要将其存储为字符串数据时，这可能很有用，例如在存储会话值或\
  \ Facebook 或 Twitter 用户 ID 值时。\n\n如果我们不控制生成 JSON 输出的 PHP 代码——例如，如果我们通过 API 访问 JSON\
  \ 并且对其生成没有任何控制——那么我们就必须在 JSON 已经构建之后进行转换。在这种情况下，我们需要让我们的 D3 JavaScript 代码使用 + 运算符将字符串强制转换为数字。在此示例中，我们已读取\
  \ JSON 输出并准备构建图表。numMsg 值已从字符串强制转换为数字：\n\n```\nd3.json(\"counts.json\", function(d)\
  \ {\n  return {\n    dateSent: d.dateSent,\n    numMsg: +d.numMsg\n  };\n}, function(error,\
  \ rows) {\n  console.log(rows);\n});\n```\n\n## 如果一个空值掉进森林...\n\n在本节中，我们将用厨师的勺子探入零、空值和空值的神秘炖菜中。\n\
  \n这些之间有什么区别？好吧，正如我提到的炖菜，首先考虑这个插图。想象一下，您在豪华厨师厨房里有一台顶级炉灶，在那台炉灶上，您将准备一锅浓稠丰盛的炖菜。您的副厨问您：“锅里有多少炖菜？”看看这些选项：\n\
  \n- 1. 一天开始时，您观察到炉灶上没有锅。“锅里有多少炖菜？”这个问题无法回答。没有锅！答案不是正值，不是零值，甚至不是空值。值是 NULL。\n- 2.\
  \ 几个小时后，经过大量清洗和切菜，您看向锅中，看到三升美味的炖菜。太好了；您现在有了问题的答案。在这种情况下，我们的答案是数据值 3。\n\n\n\n-  \
  \ 3. 午餐高峰过后，你再次看向锅里，发现汤已经没有了。每一滴都被卖掉了。你看了，你测量了，并且你发现“锅里有多少汤？”的答案是一个 **零** 值。你把锅送去水槽清洗。\n\
  -   4. 晚餐前夕，你从水槽里拿起干净的锅。穿过厨房时，副厨问道：“锅里有什么？”目前，锅是 **空** 的。锅里什么都没有。请注意，答案不是零，因为他问的问题不是数值性的。答案也不是\
  \ NULL，因为我们 *确实* 有一个锅，并且我们 *确实* 看过里面，但只是没有答案。\n\n不同数据和编程环境（DBMS、存储系统和编程语言）对这些零、空和\
  \ NULL 概念的处理略有不同。并非所有环境都能清楚地区分全部四种情况。因此，本章的写法较为通用，并且在给出示例时，我们会尽量指出所适用的环境。在每个环境中说某事物为\
  \ null、空或零时，了解 *你* 的含义非常重要。而且在真实世界的数据集中看到这些值时，明确你能（和不能）对每个值做出哪些假设也很重要。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_69_0.png)\n\
  \n> 特别提醒那些处理 Oracle 数据库的人：在 Oracle 中，empty、blank 和 NULL 与许多其他系统相比是不同的。请谨慎阅读本节内容，并查阅数据库文档以了解\
  \ Oracle 特有的细节。\n\n## 零\n\n先说重点。在零、空值和 NULL 中，最容易处理的是零值。零是一个可测量的数量，在数值系统中具有意义。我们可以对零进行排序（它们排在\
  \ 1、2、3...之前），并且可以使用方便的数轴（-2、-1、0、1、2、3...）将其他数字与零进行比较。我们也可以对零进行数学运算（除以零除外，除零总是很尴尬的）。\n\
  \n作为一个合法值，零最适合作为数值数据。零的字符串值意义不大，因为最终仍需要将其解释为 0，或字符 '0'，这可能并不是我们本意的。\n\n## 空值\n\n\
  空值比零更难处理一些，但在某些情况下很有意义，例如处理字符串时。例如，假设我们有一个名为中间名的属性。好吧，我没有中间名，所以我总是希望将此字段留空。 （有趣的事实：我母亲仍然讲述着我的幼儿园毕业证书上显示了一个我在现场编造的中间名的故事，因为太害羞而不敢告诉老师我没有中间名。）对于真正为空的值，填入空格或连字符（或编造一些东西）意义不大。空格不等于空。在空字符串的情况下，正确的值实际上可能是“空”。\n\
  \n在 CSV 或分隔文件中，空值可能看起来像这样——在这里，我们已清空了后两条记录的喜好颜色值：\n\n```\nFirst name,birth date,favorite\
  \ color,salary\n\"Sally\",\"1971-09-16\",\"light blue\",129000\n\"Manu\",\"1984-11-03\"\
  ,\"\",159960\n\"Martin\",\"1978-12-10\",\"\",76888\n```\n\n在 INSERT 数据库中，例如，要将 Manu\
  \ 记录放入 MySQL 系统中，我们会使用类似这样的代码：\n\n```\nINSERT INTO people (firstName, birthdate,\
  \ favoriteColor, salary)\nVALUES (\"Manu\",\"1984-11-03\",\"\",159960);\n```\n\n\
  有时，半结构化数据格式，如 JSON，会允许空白对象和空白字符串。考虑以下示例：\n\n```\n{\n  \"firstName\": \"Sally\",\n\
  \  \"birthDate\": \"1971-09-16\",\n  \"faveColor\": \"\",\n  \"pet\": [],\n  \"\
  job\": {\n    \"jobTitle\": \"Data Scientist\",\n    \"company\": \"Data Wizards,\
  \ Inc.\",\n    \"salary\":129000\n  }\n}\n```\n\n在这里，我们移除了 Sally 的宠物，并将她的喜好颜色设为空字符串。\n\
  \n## 空白\n\n请注意，“ ”（两个双引号中间有一个空格，有时称为空白但更恰当地称为 **空格**）不一定与 \"\"（两个双引号紧挨在一起，有时也称为空白但更恰当地称为\
  \ **空**）相同。考虑以下两个 MySQL INSERT 语句的区别：\n\n```\n-- this SQL has an empty for Sally's\
  \ favoriteColor and a space for Frank's\nINSERT INTO people (firstName, birthdate,\
  \ favoriteColor, salary)\nVALUES (\"Sally\",\"1971-09-16\",\"\",129000),\n     \
  \  (\"Frank\",\"1975-10-23\",\" \",76000);\n```\n\n除了空格之外，有时会被错误解释为空或空白的不可见字符还包括制表符和回车符/换行符。请注意这些字符，并在不确定的情况下，使用本章前面介绍的一些技巧来发现不可见字符。\n\
  \n## Null\n\n我知道如果你在字典里查 null，它可能会说它意味着零。但不要被骗了。在计算中，我们对 NULL 有一整套特殊的定义。对我们来说，NULL\
  \ 不是无；事实上，它甚至是无的缺席。\n\n这与空有什么不同？首先，空可以等于空，因为空字符串的长度为 0。所以，我们可以想象一个值存在，可以对其进行比较。然而，NULL\
  \ 不能等于 NULL，NOT NULL 也不会等于 NOT NULL。我听说有人建议我们都应该把 *NULL 不等于任何东西，甚至不等于它自己* 作为座右铭反复念诵。\n\
  \n我们使用 NULL 是在我们真正想要对数据值没有任何条目时。我们甚至不想把锅放在炉子上！\n\n## 为什么中间名示例是“空”而不是 NULL？\n\n好问题。回顾汤锅类比，如果我们问问题而答案为空，这与从未得到答案（NULL）不同。如果你问我我的中间名是什么，而我告诉你我没有，那么数据值为空。但如果你只是不知道我是否有中间名，那么数据值就是\
  \ NULL。\n\n## 是否 ever 有用使用零而不是空或 null 来清理数据？\n\n也许。记住第 1 章《为什么需要干净的数据？》中的电子邮件示例，当我们讨论向折线图添加缺失日期以及各种电子表格程序在创建缺少日期的折线图时自动将计数填充为零的情况？即使我们没有在这些日期统计电子邮件，我们的图表也会将缺失值插值为空值。我们能接受吗？好吧，这取决于。如果我们能确认电子邮件系统在这些日期是正常运行的，并且我们确信拥有发送的所有电子邮件的完整集合，那么这些日期的计数确实可以推断为零。然而，在第\
  \ 1 章《为什么需要干净的数据？》中我们使用的 Enron 电子邮件案例中，我们相当确定情况并非如此。\n\n存储零类型数据而不是空值可能有用的另一个情况是当我们有虚拟日期或只有部分日期时，例如，如果你知道月份和年份，但不知道日期，并且必须将数据插入完整的日期列。在这种情况下，填写\
  \ 2014-11-00 可能是可行的方法。但你当然应该记录此操作（参考第 1 章《为什么需要干净的数据？》中“关于数据清理的沟通”部分），因为你做了什么以及为什么，六个月后你查看这些数据时可能不会很明显！\n\
  \n## 字符编码\n\n在计算的旧时代，每个字符串值都必须由仅 128 个不同符号构建。这种早期的编码系统称为美国信息交换标准代码（ASCII），在很大程度上基于英语字母，并且是固定的。128\
  \ 个字符包括 a-z、A-Z、0-9、一些标点和空格，以及一些现在无用的电传打字机代码。在我们的数据科学厨房里，今天使用这种类型的编码系统就像烹饪冷冻晚餐一样。是的，它很便宜，但也缺乏多样性和营养，你真的不能指望把它端给客人。\n\
  \n在 1990 年代初期，提出并标准化了一种可变长度编码系统，现在称为 UTF-8。这种可变长度方案允许对更多自然语言符号以及所有数学符号进行正确编码，并为未来增长提供了充足的空间。（所有这些符号的列表称为\
  \ Unicode。Unicode 符号的编码称为 UTF-8。）现在还有 UTF-16 编码，每个字符编码至少需要两个字节。在撰写本文时，UTF-8 是 Web\
  \ 的主要编码。\n\n\n\n为本书的目的，我们主要关注的是如何处理存在于一种编码中的数据，并通过将其转换为另一种编码来清理数据。可能相关的一些示例场景包括：\n\
  \n- 你有一个使用简单编码创建的 MySQL 数据库（如 MySQL 默认的 256 个字符的 Latin-1 字符集之一），并且它将 UTF-8 数据存储为\
  \ Latin-1，但现在你希望将整个表转换为 UTF-8。\n- 你有一个 Python 2.7 程序，它使用为 ASCII 设计的函数，但现在必须处理 UTF-8\
  \ 文件或字符串。\n\n在本节中，我们将根据这些场景逐步介绍几个基本示例。遇到字符编码问题的情况还有很多，但这将是一个起点。\n\n## 示例一 – 在 MySQL\
  \ 数据中查找多字节字符\n\n假设我们有一个数据列，我们好奇该列中有多少值实际上具有多字节编码。看起来像单个字符但编码需要多个字节的字符可以通过比较其字节长度（使用\
  \ length() 函数）和字符长度（使用 char_length() 函数）来发现。\n\n> 以下示例使用的是 MySQL 文档中提供的 MySQL World\
  \ 数据库的 MyISAM 版本，网址为 http://dev.mysql.com/doc/index-other.html\n\n默认情况下，MySQL World\
  \ 测试数据库的 MyISAM 版本使用 latin1_swedish_ci 字符编码。因此，如果我们对包含特殊字符的国家名称运行查询，对于 Côte d'Ivoire，我们可能会看到如下内容：\n\
  \n```\nSELECT Name, length(Name)\nFROM Country\nWHERE Code='CIV';\n```\n\n这显示该国家的长度为\
  \ 15，且国家名称 Côte d'Ivoire 被编码为 CÂ™te dÃlvoire。其他列中也有几个条目被奇怪地编码了。为修复此问题，我们可以使用以下 SQL\
  \ 命令将 name 列的默认排序规则更改为 utf8：\n\n```\nALTER TABLE Country\n  CHANGE Name `Name` CHAR(52)\n\
  \  CHARACTER SET utf8\n  COLLATE utf8_general_ci\n  NOT NULL DEFAULT '';\n```\n\n\
  现在我们可以清空表并再次插入 239 条 Country 行：\n\n```\nTRUNCATE Country;\n```\n\n现在我们有了使用 UTF-8\
  \ 编码的国家名称。我们可以通过运行以下 SQL 来测试是否有哪些国家的名称现在使用了多字节字符表示：\n\n```\nSELECT *\n  FROM Country\n\
  \  WHERE length(Name) != char_length(Name);\n```\n\n它显示 Côte d'Ivoire 和法国岛屿 Réunion\
  \ 都有多字节字符表示。\n\n如果你无法访问 world 数据集，或者事实上根本没有任何数据集，这里是另一个示例。你可以作为 MySQL select 命令运行多字节字符比较：\n\
  \n```\nSELECT length('私は、データを愛し'), char_length('私は、データを愛し');\n```\n\n在此示例中，日文字符的长度为\
  \ 27，但字符长度为 9。\n\n当我们想要测试数据的字符集时，会使用此技术——也许你的行数太多，无法逐一查看，你只想要一个 SQL 语句，可以一次性显示所有多字节条目，以便你制定清理计划。此命令显示了当前具有多字节格式的数据。\n\
  \n## 示例二 – 查找存储在 MySQL 中的 Unicode 字符的 UTF-8 和 Latin-1 等价项\n\n以下代码将使用 convert() 函数和\
  \ RLIKE 运算符来打印使用 Latin-1 保存到 MySQL 中的 Unicode 字符串的 UTF-8 等价项。如果你在 MySQL 的 Latin-1\
  \ 编码文本列中存储了多字节数据，这很有用，这是一个不幸的常见情况，因为 Latin-1 仍然是默认编码（截至 MySQL 5）。\n\n此代码使用公开可用且广泛使用的\
  \ Movielens 电影及其评论数据库。整个 movielens 数据集在许多网站上广泛可用，包括原始项目站点：http://grouplens.org/datasets/movielens/。另一个适合\
  \ SQL 的链接在这里：https://github.com/ankane/movielens.sql。为了更轻松地完成这些示例，本书作者的 GitHub 站点上提供了仅针对相关行的一个小子集的\
  \ CREATE 和 INSERT 语句：https://github.com/megansquire/datacleaning/blob/master/ch2movies.sql。这样，如果你愿意，只需使用该代码创建这一个表并完成以下示例即可。\n\
  \n```\nSELECT convert(\n    convert(title USING BINARY) USING latin1\n) AS 'latin1\
  \ version',\nconvert(\n    convert(title USING BINARY) USING utf8\n) AS 'utf8 version'\n\
  FROM movies\nWHERE convert(title USING BINARY)\nRLIKE concat(\n    '[',\n    unhex('80'),\n\
  \    '-]',\n    unhex('FF'),\n    ']'\n);\n```\n\n以下截图显示了在 Movielens 数据库的 movies\
  \ 表中对 Latin-1 编码的 title 列在 phpMyAdmin 中运行此命令后，前三个电影的结果：\n\n| latin-1 版本 | utf-8\
  \ 版本 |\n|---|---|\n| City of Lost Children, The (CitÃ© des enfants perd... | City\
  \ of Lost Children, The (Cité des enfants perdu... |\n| MisÃ©rables, Les (1995)\
  \ | Misérables, Les (1995) |\n| Happiness Is in the Field (Bonheur est dans le prÃ...\
  \ | Happiness Is in the Field (Bonheur est dans le pré... |\n\n![](img/9aa003afabe05fdb07da46ad71325de6_76_0.png)\n\
  \n> 转换现有数据库到 UTF-8 有什么建议吗？\n> 由于 UTF-8 在网络上的普遍性及其在准确传达世界各地自然语言书写信息方面的重要性，我们强烈建议你以\
  \ UTF-8 编码方案创建新数据库。以 UTF-8 编码开始会比不这样做容易得多。\n> 然而，如果你已经创建了非 UTF-8 编码的表，但尚未填充数据，你将不得不将表更改为\
  \ UTF-8 编码，并将每个列的字符集更改为 UTF-8 编码。然后，你就可以插入 UTF-8 数据了。\n> 最困难的情况是当你已有大量非 UTF-8 编码的数据，并且希望在数据库中就地转换它时。在这种情况下，你需要做一些规划。你必须根据是否可以通过在少数表和/或少数列上运行命令来解决，还是有一个很长的列和表列表需要调整，来采取不同的方法。在规划此转换时，你应查阅特定于你的数据库系统的文档。例如，在执行\
  \ MySQL 转换时，有使用 mysqldump 实用程序的解决方案，也有使用 SELECT、convert() 和 INSERT 组合的解决方案。你必须确定哪一种适合你的数据库系统。\n\
  \n## 示例三 – 在文件级别处理 UTF-8 编码\n\n有时，你需要在文件级别调整代码以处理 UTF-8 数据。想象一个设计用于收集和打印网络内容的简单程序。如果大多数网络内容现在都是\
  \ UTF-8 编码的，那么我们的程序内部需要准备好处理它。不幸的是，许多编程语言仍需要一点点引导才能干净地处理 UTF-8 编码数据。考虑以下 Python\
  \ 2.7 程序示例，该程序设计用于使用其 API 连接到 Twitter 并将 10 条推文写入文件：\n\n```python\nimport twitter\n\
  import sys\n\n#################\ndef oauth_login():\n    CONSUMER_KEY = ''\n   \
  \ CONSUMER_SECRET = ''\n    OAUTH_TOKEN = ''\n    OAUTH_TOKEN_SECRET = ''\n    auth\
  \ = twitter.oauth.OAuth(OAUTH_TOKEN, OAUTH_TOKEN_SECRET,\n                     \
  \          CONSUMER_KEY, CONSUMER_SECRET)\n    twitter_api = twitter.Twitter(auth=auth)\n\
  \    return twitter_api\n#################\n\ntwitter_api = oauth_login()\ncodeword\
  \ = 'DataCleaning'\ntwitter_stream = twitter.TwitterStream(auth=twitter_api.auth)\n\
  stream = twitter_stream.statuses.filter(track=codeword)\n\nf = open('outfile.txt','wb')\n\
  counter = 0\nmax_tweets = 10\nfor tweet in stream:\n    print counter, \"-\", tweet['text'][0:10]\n\
  \    f.write(tweet['text'])\n    f.write('\\n')\n    counter += 1\n    if counter\
  \ >= max_tweets:\n        f.close()\n        sys.exit()\n```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_77_0.png)\n\
  \n如果你担心设置 Twitter 身份验证以获取此脚本中使用的密钥和令牌，请不要担心。你可以按照 https://dev.twitter.com/apps/new\
  \ 处的简单设置流程进行操作，或者我们在第 10 章《Twitter 项目》中有一个更长、更深入的 Twitter 挖掘示例。在该章节中，我们将完整介绍 Twitter\
  \ 开发者账户的设置，并更详细地介绍推文收集流程。\n\n\n\n\nThis little program finds 10 recent tweets that\
  \ use the keyword DataCleaning. (I chose this keyword because I recently posted\
  \ several tweets full of emojis and UTF-8 characters using this hashtag, I was pretty\
  \ sure it would quickly generate some nice results characters within the first 10\
  \ tweets.) However, asking Python to save these tweets to a file using this code\
  \ results in the following error message:\n\n```\nUnicodeEncodeError: 'ascii' codec\
  \ can't encode character u'\\u00c9' in position 72: ordinal not in range(128)\n\
  ```\n\nThe issue is that open() is not prepared to handle UTF-8 characters. We have\
  \ two choices for a fix: strip out UTF-8 characters or change the way we write files.\n\
  \n## Option one – strip out the UTF-8 characters\n\nIf we take this route, we need\
  \ to understand that by stripping out characters, we have lost data that could be\
  \ meaningful. As we discussed earlier in this chapter, data loss is generally an\
  \ undesirable thing. Still, if we did want to strip these characters, we could make\
  \ the following changes to the original for loop:\n\n```\nfor tweet in stream:\n\
  \    encoded_tweet = tweet['text'].encode('ascii','ignore')\n    print counter,\
  \ \"-\", encoded_tweet[0:10]\n    f.write(encoded_tweet)\n```\n\nThis new code changes\
  \ an original tweet written in Icelandic like this:\n\n```\nÉg elska gögn\n```\n\
  \nTo this:\n\n```\ng elska ggn\n```\n\nFor text analysis purposes, this sentence\
  \ no longer makes any sense as g and ggn are not words. This is probably not our\
  \ best option for cleaning the character encoding of these tweets.\n\n## Option\
  \ two – write the file in a way that can handle UTF-8 characters\n\nAnother option\
  \ is to just use the codecs or io libraries, which allow UTF-8 encoding to be specified\
  \ at the time the file is opened. Add an import codec line at the top of the file,\
  \ and then change the line where you open the file like this:\n\n```\nf = codecs.open('outfile.txt',\
  \ 'a+', 'utf-8')\n```\n\nThe a+ parameter states we want to append the data to the\
  \ file if it has already been created.\n\nAnother option is to include the io library\
  \ at the top of your program and then use its version of open(), which can be passed\
  \ a particular encoding, as follows:\n\n```\nf= io.open('outfile.txt', 'a+', encoding='utf8')\n\
  ```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_79_0.png)\n\n> Can we just use Python\
  \ 3? Why are you still using 2.7?\n> It is true that Python 3 handles UTF-8 encodings\
  \ more easily than Python 2.7. Feel free to use Python 3 if the rest of your development\
  \ environment can handle it. In my world, I prefer to use Enthought Canopy to work\
  \ in data analysis and data mining and to teach my students. Many distributions\
  \ of Python—Enthought included—are written for 2.7 and will not be moved to Python\
  \ 3 for quite some time. The reason for this is that Python 3 made some major changes\
  \ to the internals of the language (for example, in supporting UTF-8 encodings naturally,\
  \ as we just discussed), and this means that there were a lot of important and useful\
  \ packages that still have to be rewritten to work with it. This rewriting process\
  \ takes a long time. For more on this issue, visit https://wiki.python.org/moin/Python2orPython3\n\
  \n## Summary\n\nThis chapter covered a whirlwind of fundamental topics that we will\
  \ need in order to clean data in the rest of this book. Some of the techniques we\
  \ learned here were simple, and some were exotic. We learned about file formats,\
  \ compression, data types, and character encodings at both the file level and database\
  \ level. In the next chapter, we will tackle two more workhorses of clean data:\
  \ the spreadsheet and the text editor.\n"
- "# 第3章：Workhorses of Clean Data – Spreadsheets and Text Editors\n\nWhen designing\
  \ a home kitchen, the typical layout invokes the classic work triangle, the points\
  \ of which are the refrigerator, sink, and stove. In our Clean Data kitchen, we\
  \ have a few indispensable devices as well. Two of these are the humble **spreadsheet**\
  \ and the **text editor**. Although these unpretentious tools are often overlooked,\
  \ full knowledge of their features can make many cleaning tasks quicker and easier.\
  \ In *Chapter 2, Fundamentals – Formats, Types, and Encodings*, we briefly introduced\
  \ these two tools in the context of learning about data types and file types, but\
  \ in this chapter, we are ready to dig deeper into:\n\n- Useful functions in Excel\
  \ and Google Spreadsheets that can help us manipulate data, including text to columns,\
  \ splitting and concatenating strings, searching and formatting to find unusual\
  \ values, sorting, importing spreadsheet data into MySQL, and even generating SQL\
  \ using a spreadsheet\n- Typical features of a text editor that can automatically\
  \ extract and manipulate data into a more useful format, including searching and\
  \ replacing with regular expressions, altering line beginnings and endings, and\
  \ column-based editing\n- A small project where we use features of both of these\
  \ tools to clean some real-world data\n\n## Spreadsheet data cleaning\n\nThe utility\
  \ of the spreadsheet for data cleaning comes from two things: its ability to organize\
  \ data into columns and rows and its suite of built-in functions. In this section,\
  \ we will learn how to use the spreadsheet to its fullest in our quest for clean\
  \ data.\n\n## Text to columns in Excel\n\nAs spreadsheets are designed to hold data\
  \ in columns and rows, one of the first cleaning tasks we might need to do is arrange\
  \ our data accordingly. For instance, if you paste a large amount of data into Excel\
  \ or Google Spreadsheets, the software will first try to look for a delimiter (such\
  \ as a comma or tab) and divide the data into columns that way. (Refer to Chapter\
  \ 2, Fundamentals – Formats, Types, and Encodings, for a review of delimited data.)\
  \ Sometimes, the spreadsheet software will not find a delimiter, so we will have\
  \ to provide it more guidance about how to divide the data into columns. Consider\
  \ the following snippet of text from a list of several thousand Internet Relay Chat\
  \ channel topics on Freenode:\n\n```\n[2014-09-19 14:10:47] === #eurovision  4 \
  \ Congratulations to\nAustria, winner of the Eurovision Song Contest 2014!\n[2014-09-19\
  \ 14:10:47] === #tinkerforge  3\n[2014-09-19 14:10:47] === ##new  3  Welcome to\
  \ ##NEW\n```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_82_0.png)\n\n> To generate\
  \ a list of channels and their topics in an IRC chat server, use the alis command,\
  \ which can be sent as part of either /query or /msg, depending on your server's\
  \ settings. On Freenode, the /msg alis * command will generate a list of channels.\
  \ More information on IRC chat can be found here: https://freenode.net/services.shtml\n\
  \nWe can see with our human eyes that the first chunk of data is a timestamp, followed\
  \ by ===, # and a channel name, a number (the count of users on the channel at the\
  \ moment the list was constructed), and a description of the channel. However, if\
  \ we paste these lines into Excel or Google Spreadsheets, it is unable to automatically\
  \ make the same observations about what columns should be. The rows are detected\
  \ correctly by the spreadsheet, but the delimiting is too inconsistent for columns\
  \ to be detected automatically. How the data looks when pasted into Google Spreadsheets\
  \ is given in the following image. By highlighting cell A1, we can see that the\
  \ entire line is shown in the formula bar, indicating that the entire row has been\
  \ pasted into cell A1:\n\n![](img/9aa003afabe05fdb07da46ad71325de6_83_0.png)\n\n\
  How can we easily create columns from this data in the spreadsheet? We would like\
  \ each separate data item to be in its own column. By doing this, we will be able\
  \ to, for example, take an average of the number of users on the channels or sort\
  \ the data by the channel names. Right now, we cannot easily sort or use formulas\
  \ on this data as it is all in one giant text string.\n\nOne strategy will be to\
  \ use Excel's text-to-columns wizard to split the data into recognizable chunks;\
  \ then, we can reassemble them and strip out extra characters if needed. This is\
  \ shown in the steps mentioned as follows:\n\n- 1. Highlight column A, and launch\
  \ the text-to-columns wizard (located in the Data menu). In step 1, choose a fixed\
  \ width, and in step 2, double-click on all the lines that have been drawn to delimit\
  \ the description field. The following figure shows you how the data should look\
  \ after delimiting the first few columns and removing all the extra lines:\n\n![](img/9aa003afabe05fdb07da46ad71325de6_83_1.png)\n\
  \nFixed-width splitting in Excel.\n\nThe resulting data looks like the following\
  \ figure. The first three columns are good, but the fixed-width delimiting did not\
  \ work to separate the count of users and channel names in column D. This happened\
  \ because the channel names are not as predictable in length as the previous columns.\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_83_2.png)\n\nThis is the result after\
  \ the first round of text-to-columns splitting.\n\n\n\n\n2. 我们这次需要再次运行文本分列，但仅针对\
  \ D 列，并使用分隔符而不是定宽程序。首先，请注意频道名称 #eurovision 与用户数 (4) 之间有两个空格，4 与频道描述之间也又有两个空格。尽管文本分列不允许我们输入两个空格作为分隔符（它只允许单个字符），我们可以使用查找-替换对话框将文本中所有出现的两个空格替换为其他地方未使用的符号。（先执行查找操作以确保。）我选择了\
  \ ^ 符号。\n\n这一步看起来有点粗糙，所以如果你对替代方法感兴趣，我完全不怪你。Excel 在查找和替换错误文本的能力上比其他工具更受限制。我们将在本章后面的文本编辑器数据清理部分学习如何使用正则表达式。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_84_0.png)\n\n添加一个不寻常的分隔字符可以让我们拆分剩余的列。\n\
  \n3. 现在，使用 **查找-替换** 从 A 列和 B 列中删除 [ 和 ] 字符，并将其替换为空。（在开始查找替换之前先选中这些列，以免意外地在整个工作表中删除符号。）\n\
  \n不幸的是，Excel 在其永无止境地试图帮助我们的过程中，会将这些日期转换为我们可能不喜欢的格式：9/19/2014。如果你希望它们恢复原样（2014-09-19），请选中整列并使用自定义格式对话框将日期格式指定为\
  \ yyyy-mm-dd。\n\n4. **F** 列中的字符串开头仍有额外空格。我们可以使用 `trim()` 函数去除每个字符串值前面的额外空格。在 **F**\
  \ 左侧插入一列，并按如下所示应用 `trim()` 函数：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_85_0.png)\n\
  \n这是应用 `trim()` 函数去除首尾空格的结果。\n\n5. 我们也可以对修剪后的文本应用 `clean()` 函数。这将删除前 32 个 ASCII\
  \ 字符中的任何字符：所有可能以某种方式进入这些频道描述的非打印控制字符。你可以像这样在 `trim()` 函数外部应用 `clean()`：`clean(trim(g1))`。\n\
  \n6. 将 F1 框的角向下拖动，以将 `clean(trim())` 应用于 **F** 列其余单元格。\n\n7. 选择 **F** 列，复制它，并在 **F**\
  \ 列中使用 **粘贴值专用**，以便我们可以删除 **G** 列。\n\n8. 删除 **G** 列。好了，现在你拥有了完美清理过的数据。\n\n## 字符串拆分\n\
  \nGoogle Sheets 中可用而 Excel 中不可用的文本分列功能的轻量级版本是 split() 函数。该函数仅接收一个字符串值并将其拆分为各个组成部分。请注意，你需要提供足够的新的列来容纳拆分后的数据。在以下示例中，我们使用了与前一个示例相同的数据，但创建了三列新的列来保存来自\
  \ D 的拆分值。\n\n| fx | =split(D1,\"-\") |\n| --- | --- | --- | --- | --- |\n|  | A\
  \ | B | C | D |\n| 1 | 2014 | 9 | 19 | 2014-09-19 |\n| 2 | 2014 | 9 | 19 | 2014-09-19\
  \ |\n| 3 | 2014 | 9 | 19 | 2014-09-19 |\n\n## 字符串连接\n\nconcatenate() 函数接收多个字符串，可以是单元格引用或带引号的字符串，并将它们连接在一起放入新单元格中。在以下示例中，我们使用\
  \ concatenate() 函数将日期和时间字符串连接为一个。该函数在 Excel 和 Google Sheets 中都可用，如下图所示：\n\n| fx\
  \ | =CONCATENATE(B1,\" \",C1) |\n| --- | --- | --- |\n|  | A | B | C |\n| 1 | 2014-09-19\
  \ 14:10:47 | 2014-09-19 | 14:10:47 |\n| 2 | 2014-09-19 14:10:47 | 2014-09-19 | 14:10:47\
  \ |\n| 3 | 2014-09-19 14:10:47 | 2014-09-19 | 14:10:47 |\n\n## 使用条件格式查找异常值\n\nExcel\
  \ 和 Google Sheets 都有条件格式功能。条件格式使用一组规则，根据是否满足某些条件（条件）来更改单元格或单元格的外观（格式）。我们可以用它来查找过高、过低、缺失或其它异常的数据。一旦识别出来，我们就可以清理它。\n\
  \n以下是如何在 Google Sheets 中使用条件格式来查找示例数据中频道名称不包含 # 且聊天参与者数量为空的行的方法：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_87_0.png)\n\
  \n以下是更改背景单元格颜色后的结果，用于定位 D 列中不以 # 开头的单元格以及 E 列中为空的单元格。现在这些问题值可以通过目视检查轻松找到。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_87_1.png)\n\
  \n## 使用排序查找异常值\n\n如果数据太多无法目视检查，那么我们可以尝试使用排序来查找麻烦的数据。在 Google Sheets 或 Excel 中，选择要排序的列，可以是整个工作表，然后在数据菜单中使用排序选项。对于大多数列来说，这都很容易实现，特别是如果你正在查找像\
  \ D4 单元格这样的数据时。\n\n但是如果尝试按 E 列排序以查找缺失值会怎样？也许我们希望将所有缺失的数据放在一起，以便删除这些数据行。E4 的值为空。请记住第\
  \ 2 章《基础知识 – 格式、类型和编码》中的内容，NULL（在 Google Sheets 用语中为空）无法与其他任何值进行比较，因此无论按 E 列从低到高还是从高到低排序，它都仍保留在排序列表的底部。\n\
  \n## 将电子表格数据导入 MySQL\n\n现在你有一个充满干净数据的漂亮电子表格，你可能希望将其长期存储在数据库中。\n\n## 从电子表格创建 CSV\n\
  \n许多数据库系统会通过围绕 CSV 文件构建的导入例程接受数据。如果使用 MySQL，有一个 LOAD DATA IN FILE 命令可以将数据直接从分隔文件吸入数据库，而且你甚至可以设置自己的分隔符。首先，让我们看一下该命令的示例，然后我们可以根据想要的参数在\
  \ Excel 中创建文件。\n\n从 MySQL 命令行，我们可以运行：\n\n```\nload data local infile 'myFile.csv'\n\
  \    into table freenode_topics\n    fields terminated by ','\n    (dateOfTopic,\
  \ channel, numUsers, message);\n```\n\n这当然假设表已经创建。在这种情况下，它被称为 freenode_topics，并且其中有四列，这些列出现在此\
  \ SQL 查询的最后一行。\n\n因此，此查询中引用的 CSV 文件 myFile.csv 需要按此顺序排列列并用逗号分隔。\n\n在 Excel 中，可以通过导航到\
  \ 文件 | 另存为，然后从格式选项列表中选择 CSV (MS-DOS) 来从工作簿中的当前工作表创建 CSV。在 Google Sheets 中，你可以通过导航到\
  \ 文件 | 下载 | CSV 实现同样的目的。在这两种情况下，将文件保存到本地系统，然后启动 MySQL 客户端并按照前面所示的命令行操作。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_88_0.png)\n\
  \n> 如果你不喜欢使用 MySQL 命令行客户端，CSV 文件也可以使用 MySQL 自带的 Workbench 图形客户端或 PhpMyAdmin 等工具上传到服务器。PhpMyAdmin\
  \ 确实对上传文件有大小限制（目前为 2 MB）。\n\n## 使用电子表格生成 SQL\n\n另一种将数据导入数据库的方法乍一看似乎很奇怪，但如果你由于某种原因——也许是权限错误或文件大小限制——无法通过前面讨论的\
  \ CSV 加载它，这可以节省大量时间。在此方法中，我们将在电子表格内部构建 INSERT 语句，然后在数据库中运行这些命令。\n\n如果电子表格中的每一列代表数据库中的一列，那么我们只需在电子表格的列周围添加\
  \ SQL INSERT 命令的结构组件（带引号的字符串、括号、命令和行终止分号），然后将结果连接成一个巨大的 INSERT 命令字符串即可。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_89_0.png)\n\
  \n使用 concatenate (A1:I1) 函数将 A:I 列中的所有字符串连接起来后，我们得到的 INSERT 语句如下所示：\n\n```\nINSERT\
  \ INTO freenode_topics (dateOfTopic, channel, num_users, message) VALUES('2014-09-19\
  \ 14:10:47', '#eurovision',4, 'Congratulations to Austria, winner of the Eurovision\
  \ Song Contest 2014!');\n```\n\n这些可以粘贴到用户友好的前端，例如 PhpMyAdmin 或 MySQL Workbench。或者，你也可以将其保存为文本文件（使用文本编辑器），一个\
  \ INSERT 语句接一个。我将我的文件命名为 inserts.sql。此文件现在可以使用命令行和 MySQL 客户端导入到数据库中，如下所示：\n\n```\n\
  $mysql -uusername -p -hhostname databasename < inserts.sql\n```\n\n或者，可以使用 MySQL\
  \ 命令行客户端中的 source 命令像这样导入：\n\n```\n$mysql -uusername -p -hhostname\n[enter your\
  \ password]\n> use databasename;\n> source inserts.sql\n```\n\n这两种方法都可以将数据导入 MySQL。如果脚本足够小，你也可以使用其中一个图形客户端，例如\
  \ MySQL Workbench。但是请注意不要将非常大的脚本加载到图形客户端中，因为客户端机器上的内存量可能不足以加载数百 GB 的 SQL。我更喜欢第二种方法（source），因为它在每次成功插入后都会打印出成功消息，这样我就能知道我的命令是正确的。\n\
  \n\n\n如果你对如何创建名为 `inserts.sql` 的文本文件不太清楚，那么下一节就是为你准备的。我们将介绍比你想象中更多关于文本编辑器的内容！\n\n\
  ## 文本编辑器数据清洗\n\n我们在 *第 2 章，基础 – 格式、类型和编码* 中了解到，文本编辑器是读取和创建文本文件的首选方式。这听起来合理，也完全说得通。当时我们没有真正解释的是，文本编辑器有时也被称为程序员编辑器，因为它具有许多很酷的功能，可以帮助程序员以及数据清洗人员等，他们必须整天处理文本文件。我们现在将参观一些最有用的功能。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_90_0.png)\n\n> 每种操作系统都有数十种文本编辑器可供选择。有些需要付费，但许多是免费提供的。本章中，我将使用\
  \ Text Wrangler，这是一款适用于 OSX 的免费编辑器（可在此处获取： `http://www.barebones.com/products/textwrangler`）。本章中展示的功能在大多数其他编辑器中也很常见，例如\
  \ Sublime Editor，但如果你选择的编辑器中某个特定功能或工具的位置不明显，请查阅其文档。\n\n## 文本微调\n\n我们选择的文本编辑器内置了许多用于文本操作的实用功能。这里列出的功能代表了数据清洗任务中最常用的一些。请记住，在清洗一个文本文件的过程中，你可能需要在单个文本文件上运行数十个清洗例程，因此我们在\
  \ *第 1 章，为什么需要干净的数据？* 中关于如何清晰传达所做更改的提示在这里会非常有用。\n\n**更改大小写** 是数据清洗中非常常见的需求。很多时候，我们继承的数据全部是小写或全部是大写。以下图片显示了\
  \ Text Wrangler 中用于对所选文本执行大小写更改的对话框。每个选项右侧显示了键盘快捷键。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_91_0.png)\n\
  \n大小写更改选项包括大写和小写，以及将每个单词、行或句子的第一个单词的首字母大写。\n\n在所选内容中的每一行添加或删除前缀或后缀是另一项常见任务。几天前我在构建文本分类器时，需要对大量文本行执行此操作。我需要为每一行添加后缀，即逗号和该行所示例的类别（正类或负类）的名称。以下是\
  \ Text Wrangler 中的前缀和后缀对话框。请注意，你可以在同一操作中选择插入或删除，但不能同时进行。如果需要执行这两个任务，请先执行一个，然后再执行另一个。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_91_1.png)\n\n**清除小妖怪** 是文本编辑器的另一项优秀任务。Text\
  \ Wrangler 和 Windows 版的 Sublime Editor 都具有此功能。在清除小妖怪时，编辑器可以查找任何超出你期望字符集的字符，例如控制字符、NULL\
  \ 字符和非 ASCII 字符。它可以删除它们或用其字符代码替换它们。它也可以用你指定的任何字符替换小妖怪。这使得以后更容易找到它们。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_91_2.png)\n\
  \n## 列模式\n\n当文本编辑器处于列模式时，意味着你可以按列选择文本，而不仅仅是按行。以下是正常（非列）模式下选择的示例：\n\n```\n1 [2014-09-19\
  \ 14:10:47] === #eurovision 4 Congratulations to Austria,\n2 [2014-09-19 14:10:47]\
  \ === #tinkerforge 3\n3 [2014-09-19 14:10:47] === ##new 3 Welcome to ##NEW\n4 [2014-09-19\
  \ 14:10:47] === #postcyberpunk 3 Postcyberpunk related ma\n5 [2014-09-19 14:10:47]\
  \ === #osi 7 The Open Source Initiative\n6 [2014-09-19 14:10:48] === #apg-dev 3\
  \ APG - latest version: 1.1.1 -\n```\n\n这是列模式下选择的示例。按住 Option 键并按列选择文本。文本被选中后，你可以像对待任何选定文本一样对待它：你可以删除它、剪切它或将其复制到剪贴板，或者使用我们在上一节中讨论的任何文本微调，只要它们适用于选择即可。\n\
  \n```\n1 [2014-09-19 14:10:47] === #eurovision 4 Congratulations to Austria,\n2\
  \ [2014-09-19 14:10:47] === #tinkerforge 3\n3 [2014-09-19 14:10:47] === ##new 3\
  \ Welcome to ##NEW\n4 [2014-09-19 14:10:47] === #postcyberpunk 3 Postcyberpunk related\
  \ ma\n5 [2014-09-19 14:10:47] === #osi 7 The Open Source Initiative\n6 [2014-09-19\
  \ 14:10:48] === #apg-dev 3 APG - latest version: 1.1.1 -\n```\n\n该功能的一些限制包括：\n\n\
  - 每个字符占一列，因此字符应以非比例、打字机样式的字体显示。\n- 在 Text Wrangler 中，列模式仅在关闭换行时才有效。关闭软换行意味着你的行将向右延伸且不会被换行。\n\
  - 在 Text Wrangler 中，你所绘制的列的垂直高度必须能够由你手动绘制，因此这是一种适用于少量数据（数百或数千行，但可能不是数十万行）的技术。\n\n\
  ## 重型查找和替换\n\n文本编辑器在文本操作方面表现出色。使用文本编辑器进行列模式可能感觉很奇怪，因为这似乎更像是电子表格的自然任务。同样，在看到文本编辑器能做什么之后，使用电子表格进行查找-替换似乎也很别扭。\n\
  \nText Wrangler 中 **查找** 对话框窗口的主要部分如下所示。提供的功能包括区分大小写的搜索选项、环绕搜索、在文本子选择中搜索，以及在整个单词内或单词的一部分内查找给定文本模式。你还可以将特殊字符、空白（包括制表符和行终止符）、表情符号等粘贴到文本框中。**查找**\
  \ 框右侧的小下拉框提供额外功能。上面带时钟图标的下拉框保存最近的搜索和替换列表。下面带字母 **g** 的下拉框保存可能有用的内置搜索模式列表，并且该菜单底部有一个选项可将你自己的模式添加到列表中。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_93_0.png)\n\n其中最强大的查找-替换功能由 **Grep**\
  \ 复选框启用。选中此框允许我们对搜索使用正则表达式模式。简而言之，**正则表达式（regex）** 是一种用特殊语言编写的模式，由符号组成，旨在与某些字符串文本匹配。对正则表达式的完整论述超出了本书的范围，但可以说它们非常有用，我们在需要清洗数据时会定期使用它们。\n\
  \n> Text Wrangler 界面中的复选框说的是 Grep——而不是 RegEx 或 Match——是因为正则表达式模式匹配语言有几种细微的变体。Text\
  \ Wrangler 正在向我们表明它使用的是 Grep 的那种变体，Grep 最初是为 Unix 编写的程序，也是最常见的变体。\n\n在这里，我们将概述一些我们将反复用于清洗数据的必不可少的正则表达式符号。对于更复杂的模式，查阅一本专门的书籍或众多展示各种奇特正则表达式语法的网页是值得的：\n\
  \n| 符号 | 它做什么 |\n|---|---|\n| $ | 匹配行的末尾 |\n| ^ | 匹配行的开头 |\n| + | 匹配指定字符的一个或多个 |\n\
  | * | 匹配指定字符的零个或多个 |\n| \\w | 匹配任何单词字符（0-9、A-Z）。要匹配非单词字符，请使用 \\W |\n| \\s | 匹配任何空白字符（制表符、换行符或回车符）。要匹配非空白字符，请使用\
  \ \\S |\n| \\t | 匹配制表符 |\n| \\r | 匹配回车符。使用 \\n 表示换行符。 |\n| \\ | 这是转义字符。它匹配其后的确切字符，而不是正则表达式模式字符。\
  \ |\n\n以下是一些查找-替换组合示例，以便我们了解 Text Wrangler 如何与正则表达式配合使用。请确保选中 Grep 框。如果替换列中没有显示任何内容，则意味着应将替换字段留空。\n\
  \n| 查找 | 替换 | 它做什么 |\n|---|---|---|\n| \\r |  | 查找换行符（行终止符）并将其替换为空。另一种说法是“将多行合并为一行”。\
  \ |\n| ^\\w+ | - | 匹配行的开头，后跟至少一个单词字符。在行前面添加一个 - 字符。 |\n| \\\\r$ | \\[end\\] | 查找所有以实际\
  \ \\r 字符（反斜杠后跟 r）结尾的行，并将它们替换为实际字符 [end]。请注意，[ 和 ] 也是特殊的正则表达式字符，因此要将它们用作实际字符，需要对其进行转义。\
  \ |\n\n如果正则表达式看起来令人生畏，请放心。首先，回顾本章前面 *文本微调* 部分，大多数文本编辑器，包括 Text Wrangler，都具有许多内置的搜索和替换功能，这些功能基于最常见的正则表达式。因此，你可能会发现自己并不需要经常编写很多正则表达式。其次，由于正则表达式非常强大且有用，有很多在线资源可以供你查阅，以学习如何构建复杂的正则表达式，如果你需要的话。\n\
  \n\n\n我最喜欢的两个正则表达式资源是 Stack Overflow (http://stackoverflow.com) 和 regular-expressions.info\
  \ (http://regular-expressions.info)。通过快速网络搜索，还可以找到众多正则表达式测试网站。这些网站让你能够在示例文本上编写和测试正则表达式。\n\
  \n## A word of caution\n\n然而，使用在线正则表达式测试器时要小心，因为它们通常是为教授特定风格的正则表达式而设计的，例如 JavaScript、PHP\
  \ 或 Python 内部的正则表达式解析器。你想做的事情在你的文本编辑器中可能与这些语言中的正则表达式语法相同，也可能不相同。取决于你尝试完成任务的复杂程度，更好的做法可能只是创建一份文本数据的备份副本（或将相关文本的小样本提取到新文件中），然后在自己的文本编辑器中使用其正则表达式语法进行实验。\n\
  \n## Text sorting and processing duplicates\n\n一旦我们对正则表达式进行了一点实验，就会发现文本编辑器偶尔会在其他菜单选项中提供这些模式匹配技术，例如在排序和重复处理中。考虑以下排序对话框，看看如何将正则表达式应用于多行排序：\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_95_0.png)\n\n在这种情况下，我们可以使用“使用模式排序”复选框输入一个正则表达式模式来进行排序。重复处理对话框类似。你可以告诉编辑器是保留原始行还是删除它。有趣的是，如果你需要将它们用于其他用途，例如保留已删除行的日志，你还可以将重复项删除到另一个文件或剪贴板中。\n\
  \n> 在数据清洗中，最好至少考虑将已删除的行保存到自己的文件中，以防将来需要再次使用它们。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_96_0.png)\n\
  \n## Process Lines Containing\n\nText Wrangler 中的一个实用功能称为 Process Lines Containing。它将搜索（包括使用正则表达式的可能性）与逐行处理混合，例如将受影响的行移至另一个文件或剪贴板，或删除匹配的行。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_97_0.png)\n\n## An example project\n\n\
  在本示例项目中，我们将下载一个电子表格，使用 Excel 或文本编辑器对其进行清理，然后在其上运行一些简单的分析。\n\n## Step one – state\
  \ the problem\n\n本项目灵感来源于《高等教育纪事报》Chronicle of Higher Education 提供的一些数据，这是一份关于大学和高校新闻与动态的出版物。2012\
  \ 年，他们创建了一个名为 “Who does your college think its peers are?” 的互动功能。在此功能中，用户可以输入任何美国大学或学院的名称到表单中，并查看一个互动可视化，显示哪些其他大学将该目标学校视为同行。Peers\
  \ 是在某种程度上相似的大学。原始数据来自美国政府报告，但《纪事报》已将此可视化背后的数据免费提供给任何人使用。\n\n对于本示例，我们感兴趣的是一个互补的问题：当\
  \ University X 出现在一个列表中时，这些列表上还有哪些其他大学？要回答这个问题，我们需要找到所有与 University X 一起列出的其他大学，然后统计每个大学名称出现的次数。\n\
  \n## Step two – data collection\n\n在此步骤中，我们将逐步了解收集数据然后清理数据的流程。接下来的章节将讨论我们为项目收集适当数据所需采取的行动。\n\
  \n## Download the data\n\n本项目的数据可以从原始文章 http://chronicle.com/article/Who-Does-Your-College-Think/134222/\
  \ 下载，或从电子表格的直接链接 https://s3.amazonaws.com/03peers/selected_peers.csv.zip 下载。\n\n\
  文件是压缩的，因此使用你选择的解压程序解压文件。\n\n## Get familiar with the data\n\nZIP 文件夹内的文件具有 .csv\
  \ 扩展名，确实是一个 CSV 分隔文件，共有 1,686 行，包括标题行。逗号分隔两列：第一列是所讨论大学的名称，第二列是原始大学列为同行的所有大学列表。这些同行本身由竖线字符\
  \ | 分隔。以下是示例行：\n\n```\nHarvard University,Yale University|Princeton University|Stanford\
  \ University\n```\n\n在这种情况下，第一列说明 Harvard University 是目标大学，第二列显示 Yale、Princeton\
  \ 和 Stanford 已被 Harvard 列为其同行。\n\n## Step three – data cleaning\n\n由于本示例的目标是查看某一特定大学以及它被列为其他大学同行的所有时间，我们首先要清理掉不包含目标大学的任何行。然后我们将文件转换为单个长列表，其中包含单个大学。此时，我们的数据将被清理干净，我们就可以进入分析和可视化步骤。\n\
  \n## Extracting relevant lines\n\n让我们比较提取相关行的两种方法：一种使用电子表格，另一种使用本章概述的技术配合文本编辑器。\n\
  \n## Using a spreadsheet\n\n在电子表格程序中打开文件，使用条件格式突出显示包含 Harvard 书面内容的任何行（或你选择的目標大学），然后删除其余行。\n\
  \n## Using a text editor\n\n在文本编辑器中打开文件并使用 **Process Lines Containing** 查找包含 **Harvard\
  \ University** 短语（或你选择的大学）的所有行，然后将其复制到新文件。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_99_0.png)\n\
  \n无论采用哪种选项，此过程的结果都是一个包含 26 行的新文件，所有行都在某处包含 **Harvard University**。\n\n## Transform\
  \ the lines\n\n现在我们有一个包含 26 行的文件，每行包含多个大学（宽数据）。我们预计在某个时候可能会将文件读入 Python 以执行大学的简单频率计数。因此，我们决定将其更改为长数据，每行一个大学。\n\
  \n为了将文件转换为每行一个大学，我们将使用文本编辑器并进行三次查找和替换。首先，我们将查找逗号并将其替换为 \\r（回车）。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_99_1.png)\n\
  \n接下来，查找竖线字符 | 的实例并将其替换为 \\r。此时，文本文件有 749 行。\n\n最后，我们需要删除所有 Harvard University 的实例。记住，我们只对与\
  \ Harvard 一起提及的同行感兴趣，因此我们不需要在计数中包含 Harvard 本身。在 Text Wrangler 中，我们可以在查找框中输入 Harvard\
  \ University\\r 并将替换框留空。这将删除 26 行，文件总共剩下 723 行。\n\n## Step four – data analysis\n\
  \n由于我们的主要重点是数据清理，我们不会花费太多时间在分析和可视化上，但这里有一个快速的 Python 脚本来计算这些同行与 Harvard 一起出现在某所大学列表中的次数：\n\
  \n```\nfrom collections import Counter\nwith open('universities.txt') as infile:\n\
  \    counted = Counter(filter(None, [line.strip() for line in infile]))\n    sorted\
  \ = counted.most_common()\n    for key,value in sorted:\n        print key,\",\"\
  , value\n```\n\n结果显示有 232 所独特的大学以及该大学被提及的次数。以下是前几项结果。我们可以这样解释这些结果：\n\n- 当 Harvard\
  \ 被提及为同行时，Yale 也被提及 26 次：\n\nYale University , 26\nPrinceton University , 25\nCornell\
  \ University , 24\nStanford University , 23\nColumbia University in the City of\
  \ New York , 22\nBrown University , 21\nUniversity of Pennsylvania , 21\n\n此时，你可以取该列表（或更长列表的一部分）并将其输入条形图或词云或你认为具有说服力或有趣的任何类型的可视化。由于数据是逗号分隔的，你甚至可以轻松将其粘贴到电子表格程序中进行进一步分析。但在这一点上，我们已经回答了关于给定目标大学时哪些同行被提及最多的初始问题。\n\
  \n\n\n## 摘要\n\n在本章中，我们学习了一些非常实用的数据清洗技巧，使用两种易于获取的工具：文本编辑器和电子表格。我们概述了电子表格中用于拆分数据、移动数据、查找和替换部分、格式化数据，然后重新组合的可用函数。然后，我们学习了如何充分利用简单的文本编辑器，包括一些内置功能，以及如何最有效地使用查找和替换和正则表达式。\n\
  \n在下一章中，我们将把迄今为止学到的各种技术组合起来执行一些重要的文件转换。我们将使用的许多技术都基于我们在过去两章中关于文本编辑、正则表达式、数据类型和文件格式所学的内容，因此请准备好解决一些现实世界的数据清洗问题。\n"
- "# 第4章：说通用语 – 数据转换\n\n去年夏天，我在一所当地烹饪学校上了一门制作奶酪的课程。我们做的第一件事之一就是里科塔奶酪。我很高兴地了解到里科塔奶酪只需用牛奶和发酵奶即可在大约一个小时内制作出来，而且发酵奶本身可以用牛奶和柠檬汁制作。在厨房里，原料不断被转化为其他原料，而这些原料又会被转化为美味的餐点。在我们的数据科学厨房里，我们将常规地执行从一种数据格式到另一种数据格式的转换。我们可能需要这样做，以便执行各种分析，当我们想要合并数据集时，或如果我们需要以新的方式存储数据集。\n\
  \nLingua franca 是一种被采纳为不同语言使用者之间对话的通用标准的语言。在转换数据时，有几种数据格式可以作为通用标准。我们在第 2 章《基础 –\
  \ 格式、类型和编码》中介绍了一些这些格式。JSON 和 CSV 是最常见的两种。在本章中，我们将花一些时间学习：\n\n- 如何使用软件工具和语言（Excel、Google\
  \ Spreadsheets 和 phpMyAdmin）执行快速的 JSON 和 CSV 转换。\n- 如何编写 Python 和 PHP 程序来生成不同的文本格式并在它们之间转换。\n\
  - 如何实现数据转换以完成一项现实世界的任务。在此项目中，我们将使用 netvizz 软件从 Facebook 下载一个好友网络，并将数据清理并转换为构建 D3\
  \ 中社交网络可视化的所需 JSON 格式。然后，我们将以不同的方式清理数据，将其转换为社交网络包 networkx 所需的 Pajek 格式。\n\n###\
  \ 基于工具的快速转换\n\n将少量到中等量的数据转换为另一种格式的最快、最简单的方法之一就是直接让您正在使用的软件工具为您完成。有时，您正在使用的应用程序已经具有将数据转换为所需格式的选项。就像\
  \ *第 3 章《清洁数据的 workhorses – 电子表格和文本编辑器》* 中的技巧一样，我们希望尽可能利用工具中的这些隐藏功能。如果您的数据对于基于应用程序的转换来说太多，或者您想要的特定转换不可用，我们将在即将到来的章节\
  \ *使用 PHP 转换* 和 *使用 Python 转换* 中介绍编程解决方案。\n\n### 电子表格到 CSV\n\n将电子表格保存为分隔文件相当直接。Excel\
  \ 和 Google 电子表格都具有 **File** 菜单选项 **Save As**；在此选项中，选择 **CSV (MS DOS)**。此外，Google\
  \ Spreadsheets 具有保存为 Excel 文件和保存为制表符分隔文件的选项。将内容保存为 CSV 有一些限制：\n\n- 在 Excel 和 Google\
  \ Spreadsheets 中，使用 **Save As** 功能时，只会保存当前工作表。这是因为 CSV 文件本质上只描述一组数据；因此，它不能包含多个工作表。如果您有多个工作表的电子表格，您需要将每个工作表保存为单独的\
  \ CSV 文件。\n- 在这两个工具中，自定义 CSV 文件的选项相对较少，例如，Excel 使用逗号作为分隔符保存数据（作为 CSV 文件，这是有意义的），并且不提供将数据值用引号括起或使用不同行终止符的选项。\n\
  \n### 电子表格到 JSON\n\nJSON 比 CSV 更难处理。Excel 没有易用的 JSON 转换器，尽管网上有几个转换工具声称可以为您将 CSV\
  \ 文件转换为 JSON。\n\nGoogle Spreadsheets 然而，可以通过 URL 获得 JSON 转换器。这种方法有几个缺点，首先是您必须将文档发布到网络（至少暂时）才能访问其\
  \ JSON 版本。您还必须使用一些非常长的数字来自定义 URL，这些数字标识了您的电子表格。它还会在 JSON 转储中产生大量信息——可能比您想要或需要的多得多。尽管如此，这里有一些逐步说明，可将\
  \ Google 电子表格转换为其 JSON 表示形式。\n\n### 第一步 – 将 Google 电子表格发布到网络\n\n在创建并保存 Google 电子表格后，从\
  \ **File** 菜单中选择 **Publish to the Web**。点击后续的对话框（我为我的选择了所有默认设置）。此时，您就可以通过 URL 访问此文件的\
  \ JSON。\n\n### 第二步 – 创建正确的 URL\n\n从已发布的 Google 电子表格创建 JSON 的 URL 模式如下所示：\n\n```\n\
  http://spreadsheets.google.com/feeds/list/key/sheet/public/basic?alt=json\n```\n\
  \n您需要更改此 URL 的三个部分以匹配您的特定电子表格文件：\n\n- **list**：(可选) 您可以将 `list` 更改为例如 cells，如果您希望在\
  \ JSON 文件中分别列出每个单元格及其引用（A1、A2 等）。如果您希望每个行作为一个实体，请在 URL 中保留 `list`。\n- **key**：将此\
  \ URL 中的 `key` 更改为与 Google 内部用于表示您的文件的长唯一数字相匹配。在您在浏览器中查看电子表格的 URL 中，此 key 显示为 `/spreadsheets/d`\
  \ 部分之后、两个斜杠之间的长标识符，如下所示：\n- **sheet**：将示例 URL 中的 sheet 词更改为 `od6` 以表示您有兴趣转换第一个工作表。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_105_0.png)\n\n> od6是什么意思？Google 使用代码来表示每个工作表。然而，代码并不是严格按数字顺序排列的。关于编号方案的详细讨论可以在\
  \ Stack Overflow 帖子及其答案中的问题上找到：http://stackoverflow.com/questions/11290337/\n\n\
  为了测试此过程，我们可以为第 3 章《清洁数据的 workhorses – 电子表格和文本编辑器》中示例项目末尾练习生成的大学和计数创建一个 Google 电子表格。此电子表格的前三行如下所示：\n\
  \n| 耶鲁大学 | 26 |\n| 普林斯顿大学 | 25 |\n| 康奈尔大学 | 24 |\n\n我的 URL 通过 JSON 访问此文件如下所示：\n\n\
  ```\nhttp://spreadsheets.google.com/feeds/list/1mWIAk_5KNoQHr4vFgPHdm7GX8Vh22WjgAUYYHU\
  \ yXSNM/od6/public/basic?alt=json\n```\n\n将此 URL 粘贴到浏览器中会生成数据的 JSON 表示。它包含 231 个条目，每个条目看起来都像以下片段。我已为便于阅读在此条目中添加了换行符：\n\
  \n```\n{\n  \"id\":{\n    \"$t\":\"https://spreadsheets.google.com/feeds/list/1mWIAk_5KNoQHr4vFgPHdm7GX8Vh22WjgAUYYHU\
  \ yXSNM/od6/public/basic/cokwr\"\n  },\n  \"updated\":{\"$t\":\"2014-12-17T20:02:57.196Z\"\
  },\n  \"category\":[{\n    \"scheme\":\"http://schemas.google.com/spreadsheets/2006\"\
  ,\n    \"term\" :\"http://schemas.google.com/spreadsheets/2006#list\"\n  }],\n \
  \ \"title\":{\n    \"type\":\"text\",\n    \"$t\"  :\"Yale University \"\n  },\n\
  \  \"content\":{\n    \"type\":\"text\",\n    \"$t\"  :\"_cokwr: 26\"\n  },\n  \"\
  link\": [{\n    \"rel\" :\"self\",\n    \"type\":\"application/atom+xml\",\n   \
  \ \"href\":\"https://spreadsheets.google.com/feeds/list/1mWIAk_5KNoQHr4vFgPHdm7GX8Vh22WjgAUYYHU\
  \ yXSNM/od6/public/basic/cokwr\"\n  }]\n}\n```\n\n\n\n即使经过我的重新格式化，这个 JSON 也不太美观，而且其中许多名称-值对对我们来说并不有趣。尽管如此，我们还是成功生成了一个功能性的\
  \ JSON。如果我们使用程序来消费这个 JSON，我们将忽略有关电子表格本身的所有多余信息，只关注标题和内容实体以及 $t 值（在本例中为 Yale University\
  \ 和 _cokwr: 26）。这些值在前一个示例中显示的 JSON 中被突出显示。如果你想知道是否可以将电子表格转换为 CSV 再转换为 JSON，答案是肯定的。我们将在本章后面的“使用\
  \ PHP 转换”和“使用 Python 转换”部分详细介绍如何做到这一点。\n\n## 使用 phpMyAdmin 将 SQL 转换为 CSV 或 JSON\n\
  \n在本节中，我们将讨论两种无需编程即可直接从数据库写入 JSON 和 CSV 的选项，MySQL 在我们的例子中。\n\n首先，phpMyAdmin 是一个非常常见的\
  \ MySQL 数据库基于 Web 的前端。如果您使用的是该工具的现代版本，您将能够导出整个表或查询结果为 CSV 或 JSON 文件。使用我们在第 1 章 Why\
  \ Do You Need Clean Data? 中首次访问的同一个 enron 数据库，请考虑以下导出选项卡的屏幕截图，其中 JSON 被选为整个 employeelist\
  \ 表的目标格式（CSV 也可在该选择框中使用）：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_107_0.png)\n\
  \nPhpMyAdmin JSON export for entire tables\n\n导出查询结果的过程非常相似，只是不要使用屏幕顶部的导出选项卡，而是运行\
  \ SQL 查询，然后在页面底部的“查询结果操作”下使用导出选项，如下所示：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_108_0.png)\n\
  \nPhpMyAdmin can export the results of a query as well\n\n以下是我们可以在 employeelist\
  \ 表上运行以测试此过程的简单查询：\n\n```sql\nSELECT concat(firstName, \" \", lastName) as name,\
  \ email_id\nFROM employeelist\nORDER BY lastName;\n```\n\n当我们将结果导出为 JSON 时，phpMyAdmin\
  \ 会向我们显示 151 个值，格式如下：\n\n```json\n{\n  \"name\": \"Lysa Akin\",\n  \"email_id\"\
  : \"lysa.akin@enron.com\"\n}\n```\n\nphpMyAdmin 工具很好，并且在转换存储在 MySQL 中的中等数量的数据时非常有效，特别是作为查询的结果。如果您使用的是不同的\
  \ RDBMS，您的 SQL 接口很可能也有一些自己的格式选项，您应该探索一下。\n\n另一种策略是完全绕过 phpMyAdmin，只使用 MySQL 命令行来写出您想要格式化的\
  \ CSV 文件：\n\n```sql\nSELECT concat(firstName, \" \", lastName) as name, email_id\n\
  INTO OUTFILE 'enronEmployees.csv'\nFIELDS TERMINATED BY ',' OPTIONALLY ENCLOSED\
  \ BY '\"'\nLINES TERMINATED BY '\\n'\nFROM employeelist;\n```\n\n这将使用指定的名称写入一个逗号分隔的文件（employees.csv）。它将被写入当前目录。\n\
  \n那 JSON 呢？使用这种策略没有非常干净的方式输出 JSON，因此您应该使用前面显示的 phpMyAdmin 解决方案，或者使用用 PHP 或 Python\
  \ 编写的更强大的解决方案。这些编程解决方案将在后面的部分中介绍，所以请继续阅读。\n\n## 使用 PHP 转换\n\n在我们的第 2 章 Fundamentals\
  \ – Formats, Types, and Encodings 中，在关于 JSON 数值格式的讨论中，我们简要展示了如何使用 PHP 连接到数据库、运行查询、从结果构建\
  \ PHP 数组，然后将 JSON 结果打印到屏幕上。在这里，我们首先将此示例扩展为写入文件而不是打印到屏幕，并写入 CSV 文件。接下来，我们将展示如何使用\
  \ PHP 读取 JSON 文件并转换为 CSV 文件，反之亦然。\n\n### 使用 PHP 将 SQL 转换为 JSON\n\n在本节中，我们将编写一个 PHP\
  \ 脚本来连接到 enron 数据库，运行 SQL 查询，并将其导出为 JSON 格式的文件。为什么要为此编写 PHP 脚本而不是使用 phpMyAdmin？嗯，这种策略在我们需要在导出数据之前对数据进行额外处理，或者我们怀疑数据量超过基于\
  \ Web 的应用程序（如 phpMyAdmin）所能处理的情况时很有用：\n\n```php\n<?php\n// connect to db, set up\
  \ query, run the query\n$dbc = mysqli_connect('localhost','username','password','enron')\n\
  or die('Error connecting to database!' . mysqli_error());\n\n$select_query = \"\
  SELECT concat(firstName, \\\" \\\", lastName) as\n    name, email_id FROM employeelist\
  \ ORDER BY lastName\";\n\n$select_result = mysqli_query($dbc, $select_query);\n\n\
  if (!$select_result)\n    die (\"SELECT failed! [$select_query]\" . mysqli_error());\n\
  \n// ----JSON output----\n// build a new array, suitable for json\n$counts = array();\n\
  while($row = mysqli_fetch_array($select_result))\n{\n```\n```\n// add onto the json\
  \ array\n    array_push($counts, array('name'     => $row['name'],\n    'email_id'\
  \ => $row['email_id']));\n}\n// encode query results array as json\n$json_formatted\
  \ = json_encode($counts);\n\n// write out the json file\nfile_put_contents(\"enronEmail.json\"\
  , $json_formatted);\n?>\n```\n\n这段代码将 JSON 格式的输出文件写入 file_put_contents() 行中指定的位置。\n\
  \n### 使用 PHP 将 SQL 转换为 CSV\n\n以下代码片段展示了如何使用 PHP 文件输出流创建 SQL 查询结果的 CSV 格式文件。将此代码保存为\
  \ Web 服务器上脚本可用的目录中的 .php 文件，然后在浏览器中请求该文件。它将自动下载包含正确值的 CSV 文件：\n\n```php\n<?php\n\
  // connect to db, set up query, run the query\n    $dbc = mysqli_connect('localhost','username','password','enron')\n\
  \    or die('Error connecting to database!' . mysqli_error());\n\n$select_query\
  \ = \"SELECT concat(firstName, \\\" \\\", lastName) as\n    name, email_id FROM\
  \ employeelist ORDER BY lastName\";\n\n$select_result = mysqli_query($dbc, $select_query);\n\
  \nif (!$select_result)\n    die (\"SELECT failed! [$select_query]\" . mysqli_error());\n\
  \n// ----CSV output----\n// set up a file stream\n$file = fopen('php://output',\
  \ 'w');\nif ($file && $select_result)\n{\n    header('Content-Type: text/csv');\n\
  \    header('Content-Disposition: attachment;\n    filename=\"enronEmail.csv\"');\n\
  \    // write each result row to the file in csv format\n```\n```\nwhile($row =\
  \ mysqli_fetch_assoc($select_result))\n{\n    fputcsv($file, array_values($row));\n\
  }\n?>\n```\n\n结果的格式如下（仅显示前三行）：\n\n```\n\"Lysa Akin\",lysa.akin@enron.com\n\"Phillip\
  \ Allen\",k..allen@enron.com\n\"Harry Arora\",harry.arora@enron.com\n```\n\n如果你想知道\
  \ Phillip 的电子邮件是否真的应该有两个点，我们可以运行一个快速查询来找出 Enron 有多少电子邮件的格式是这样的：\n\n```sql\nSELECT\
  \ CONCAT(firstName, \" \", lastName) AS name, email_id\nFROM employeelist\nWHERE\
  \ email_id LIKE \"%..%\"\nORDER BY name ASC;\n```\n\n结果发现 24 个电子邮件地址的格式与此类似，带有双点。\n\
  \n### 使用 PHP 将 JSON 转换为 CSV\n\n在这里，我们将使用 PHP 读取 JSON 文件并将其转换为 CSV 并输出文件：\n\n```php\n\
  <?php\n// read in the file\n$json = file_get_contents(\"outfile.json\");\n// convert\
  \ JSON to an associative array\n$array = json_decode ($json, true);\n// open the\
  \ file stream\n$file = fopen('php://output', 'w');\nheader('Content-Type: text/csv');\n\
  header('Content-Disposition: attachment;\nfilename=\"enronEmail.csv\"');\n// loop\
  \ through the array and write each item to the file\nforeach ($array as $line)\n\
  {\n    fputcsv($file, $line);\n}\n?>\n```\n\n这段代码将创建一个 CSV，其中包含每一行，就像之前的示例一样。我们应该注意\
  \ file_get_contents() 函数会将文件作为字符串读入内存，因此对于极大的文件，您可能需要改用 fread()、fgets() 和 fclose()\
  \ PHP 函数的组合。\n\n### 使用 PHP 将 CSV 转换为 JSON\n\n另一个常见任务是读取 CSV 文件并将其写出为 JSON 文件。大多数时候，我们有一个\
  \ CSV，其第一行是标题行。标题行列出了文件中每一列的列名，我们希望标题行中的每一项都成为 JSON 格式的文件的键：\n\n```php\n<?php\n\
  $file = fopen('enronEmail.csv', 'r');\n$headers = fgetcsv($file, 0, ',');\n$complete\
  \ = array();\n\nwhile ($row = fgetcsv($file, 0, ','))\n{\n    $complete[] = array_combine($headers,\
  \ $row);\n}\nfclose($file);\n$json_formatted = json_encode($complete);\nfile_put_contents('enronEmail.json',$json_formatted);\n\
  ?>\n```\n\n此代码对前面创建的带有标题行的 enronEmail.csv 文件的结果如下：\n\n```\n[{\"name\":\"Lysa Akin\"\
  ,\"email_id\":\"lysa.akin@enron.com\"},\n{\"name\":\"Phillip Allen\",\"email_id\"\
  :\"k..allen@enron.com\"},\n{\"name\":\"Harry Arora\",\"email_id\":\"harry.arora@enron.com\"\
  },...]\n```\n\n对于此示例，实际 CSV 文件中的 151 个结果中，仅显示了前三行。\n\n## 使用 Python 转换\n\n在本节中，我们描述了多种使用\
  \ Python 将 CSV 转换为 JSON 以及反之亦然的方法。在这些示例中，我们将探索使用专门安装的库和使用更原生的 Python 代码来实现此目标的不同方法。\n\
  \n\n\n## 使用 Python 将 CSV 转换为 JSON\n\n我们找到了几种使用 Python 将 CSV 文件转换为 JSON 的方法。其中第一种使用内置的\
  \ csv 和 json 库。假设我们有一个 CSV 文件，其行如下所示（仅显示前三行）：\n\n```\nname,email_id\n\"Lysa Akin\"\
  ,lysa.akin@enron.com\n\"Phillip Allen\",k..allen@enron.com\n\"Harry Arora\",harry.arora@enron.com\n\
  ```\n\n我们可以编写一个 Python 程序来读取这些行并将其转换为 JSON：\n\n```\nimport json\nimport csv\n\n\
  # read in the CSV file\nwith open('enronEmail.csv') as file:\n    file_csv = csv.DictReader(file)\n\
  \    output = '['\n    # process each dictionary row\n    for row in file_csv:\n\
  \        # put a comma between the entities\n        output += json.dumps(row) +\
  \ ','\n    output = output.rstrip(',') + ']'\n# write out a new file to disk\nf\
  \ = open('enronEmailPy.json','w')\nf.write(output)\nf.close()\n```\n\n生成的 JSON 将如下所示（仅显示前两行）：\n\
  \n```\n[{\"email_id\": \"lysa.akin@enron.com\", \"name\": \"Lysa Akin\"},\n{\"email_id\"\
  : \"k..allen@enron.com\", \"name\": \"Phillip Allen\"},...]\n```\n\n使用这种方法的一个好处是，除了获取和放置正在读取（CSV）和写入（JSON）的文件外，它不需要任何特殊库安装或命令行访问。\n\
  \n## 使用 csvkit 将 CSV 转换为 JSON\n\n第二种将 CSV 更改为 JSON 的方法依赖于一个非常有趣的 Python 工具包，称为 **csvkit**。要使用\
  \ Canopy 安装 csvkit，只需启动 Canopy 终端窗口（您可以在 Canopy 中通过导航到 **工具 | Canopy 终端** 找到它），然后运行\
  \ `pip install csvkit` 命令。使用 csvkit 的所有依赖项都将为您安装。在这一点上，您可以选择通过 Python 程序作为库使用 `import\
  \ csvkit` 访问 csvkit，或通过命令行访问，正如我们在以下片段中所做的那样：\n\n```\ncsvjson enronEmail.csv > enronEmail.json\n\
  ```\n\n此命令获取 `enronEmail.csv` CSV 文件并快速无痛地将其转换为 JSON `enronEmail.csvkit.json` 文件。\n\
  \ncsvkit 包附带了几个其他非常有用的命令行程序，包括 `csvcut`，它可以从 CSV 文件中提取任意列列表，以及 `csvformat`，它可以对\
  \ CSV 文件执行分隔符交换或更改行结束符或类似的清理操作。`csvcut` 程序特别有帮助，如果您只想提取几列进行处理。对于这些命令行工具中的任何一个，您都可以将其输出重定向到新文件。以下命令行获取名为\
  \ `bigFile.csv` 的文件，剪切出第一列和第三列，并将结果保存为新的 CSV 文件：\n\n```\ncsvcut bigFile.csv -c 1,3\
  \ > firstThirdCols.csv\n```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_114_0.png)\n\
  \n有关 csvkit 的更多信息，包括完整文档、下载和示例，可在 http://csvkit.rtfd.org/ 获取。\n\n## Python JSON\
  \ 到 CSV\n\n使用 Python 读取 JSON 文件并将其转换为 CSV 进行处理非常简单：\n\n```\nimport json\nimport\
  \ csv\n\nwith open('enronEmailPy.json', 'r') as f:\n    dicts = json.load(f)\nout\
  \ = open('enronEmailPy.csv', 'w')\nwriter = csv.DictWriter(out, dicts[0].keys())\n\
  writer.writeheader()\nwriter.writerows(dicts)\nout.close()\n```\n\n此程序获取名为 `enronEmailPy.json`\
  \ 的 JSON 文件，并使用 JSON 的键作为新文件中的标题行导出此文件的 CSV 格式版本，名为 `enronEmailPy.csv`。\n\n## 示例项目\n\
  \n在本章中，我们专注于将数据从一种格式转换为另一种格式，这是在完成其余数据分析项目之前需要反复进行的一项常见数据清理任务。我们专注于一些非常常见的文本格式（CSV\
  \ 和 JSON）以及数据的常见位置（文件和 SQL 数据库）。现在，我们准备通过一个示例项目来扩展我们对数据转换的基本知识，该项目将要求我们在一些不太标准化——但仍基于文本——的数据格式之间进行转换。\n\
  \n在这个项目中，我们想调查我们的 Facebook 社交网络。我们将：\n\n- 1. 使用 netvizz 将我们的 Facebook 社交网络（朋友及其之间的关系）下载为一种名为\
  \ **图描述格式 (GDF)** 的基于文本的文件格式。\n- 2. 构建 Facebook 社交网络的图形表示，将我们网络中的人员显示为节点，将他们的友谊显示为这些节点之间的连接线（称为\
  \ *边*）。为此，我们将使用 D3 JavaScript 图形库。该库期望网络中数据的 JSON 表示。\n- 3. 计算有关社交网络的一些指标，例如网络的大小（称为网络的\
  \ *度*）以及我们网络中两个人之间的最短路径。为此，我们将使用 Python 中的 `networkx` 包。该包期望数据采用基于文本的格式，称为 **Pajek**\
  \ 格式。\n\n该项目的首要目标是展示如何协调所有这些不同的预期格式（GDF、Pajek 和 JSON）并执行从一种格式到另一种格式的转换。我们的次要目标是实际提供足够的示例代码和指导来执行我们社交网络的小型分析。\n\
  \n### 第一步 – 将 Facebook 数据下载为 GDF\n\n对于此步骤，您需要登录您的 Facebook 帐户。使用 Facebook 的搜索框查找\
  \ netvizz 应用，或使用此 URL 直接链接到 netvizz 应用：`https://apps.facebook.com/netvizz/`。\n\n\
  进入 netvizz 页面后，单击 **个人网络**。随后的页面解释说，单击 **开始** 按钮将提供一个可下载文件，其中包含两项：一份列出您所有朋友及其之间连接的\
  \ GDF 格式文件，以及一份制表符分隔的 **制表符分隔值 (TSV)** 统计文件。我们主要对本项目的 GDF 文件感兴趣。单击 **开始** 按钮，然后在随后的页面上，右键单击\
  \ GDF 文件将其保存到本地磁盘，如以下屏幕截图所示：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_116_0.png)\n\
  \nnetvizz Facebook 应用允许我们将社交网络下载为 GDF 文件\n\n在这一点上，给文件一个更短的名称也可能有所帮助。（我将我的文件命名为 `personal.gdf`\
  \ 并将其保存在为此项目创建的目录中。）\n\n### 第二步 – 在文本编辑器中查看 GDF 文件格式\n\n在文本编辑器中打开文件（我使用的是 Text Wrangler），并注意该文件格式的几点：\n\
  \n- 1. 文件分为两部分：nodes 和 edges。\n- 2. nodes 位于文件的第一部分，以单词 `nodedef` 开头。节点列表是我所有朋友的列表以及关于他们的一些基本事实（他们的性别和他们内部的\
  \ Facebook 识别号码）。节点按人员加入 Facebook 的日期顺序列出。\n- 3. 文件的第二部分显示了我朋友之间的 edges 或连接。有时，这些也称为\
  \ links。文件此部分以单词 `edgedef` 开头。edges 描述我的哪些朋友与哪些其他朋友相连。\n\n这里是一个 nodes 部分的摘录：\n\n\
  ```\nnodedef>name VARCHAR,label VARCHAR,sex VARCHAR,locale VARCHAR,agerank INT\n\
  1234,Bugs Bunny,male,en_US,296\n2345,Daffy Duck,male,en_US,295\n3456,Minnie Mouse,female,en_US,294\n\
  ```\n\n这里是一个 edges 部分的摘录。它显示 Bugs（1234）和 Daffy（2345）是朋友，Bugs 也与 Minnie（3456）是朋友：\n\
  \n```\nedgedef>node1 VARCHAR,node2 VARCHAR\n1234,2345\n1234,3456\n3456,9876\n```\n\
  \n### 第三步 – 将 GDF 文件转换为 JSON\n\n我们想要执行的任务是构建此数据的社交网络表示形式 in D3。首先，我们需要查看数十个可用的 D3\
  \ 示例来构建社交网络，例如 D3 示例画廊中可用的示例，https://github.com/mbostock/d3/wiki/Gallery 和 http://christopheviau.com/d3list/。\n\
  \n这些社交网络图示例依赖于 JSON 文件。每个 JSON 文件显示 nodes 及其之间的 edges。这里是一个这些 JSON 文件应如下所示的示例：\n\
  \n```\n{\"nodes\": [\n  {\"name\":\"Bugs Bunny\"},\n  {\"name\":\"Daffy Duck\"},\n\
  \  {\"name\":\"Minnie Mouse\"}],\n\"edges\": [\n  {\"source\": 0,\"target\": 2},\n\
  \  {\"source\": 1,\"target\": 3},\n  {\"source\": 2,\"target\": 3}]}\n```\n\n关于此\
  \ JSON 代码最重要的一点是注意它与 GDF 文件一样具有相同的两个主要部分：nodes 和 edges。nodes 只是人的姓名。edges 是表示友谊关系的数字对列表。然而，这些对没有使用\
  \ Facebook 识别号码，而是使用 nodes 列表中每个项目的索引，从 0 开始。\n\n\n\n目前我们还没有 JSON 文件。我们只有一份 GDF\
  \ 文件。我们将如何构建这个 JSON 文件？仔细查看 GDF 文件后，可以发现它看起来很像两份 CSV 文件叠放在一起。从本章前面部分我们知道，有几种不同的策略可以将\
  \ CSV 转换为 JSON。\n\n因此，我们决定先将 GDF 转换为 CSV，再将 CSV 转换为 JSON。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_118_0.png)\n\
  \n> 等等；如果那个 JSON 示例看起来不像我在网上找到的用于在 D3 中绘制社交网络图的 JSON 文件怎么办？\n> 你在网上找到的一些 D3 社交网络可视化示例会为每个节点或链接显示许多额外的值，例如，它们可能包含可用于表示大小差异、悬停功能或颜色变化的额外属性，如此示例所示：\
  \ http://bl.ocks.org/christophermanning/1625629。\n> 此可视化显示了芝加哥付费政治游说者的关系。在此示例中，代码会考虑\
  \ JSON 文件中的信息来确定节点的圆圈大小以及悬停在节点上时显示的文本。它制作出非常漂亮的图表，但很复杂。由于我们的主要目标是学习如何清理数据，我们将在此使用一个精简、简单的示例，其中没有太多这些额外内容。别担心；我们的示例仍然会构建一个不错的\
  \ D3 图表！\n\n将 GDF 文件转换为我们想要的格式的 JSON 时，可以按照以下步骤操作：\n\n- 1. 使用文本编辑器将 `personal.gdf`\
  \ 文件拆分为两个文件，`nodes.gdf` 和 `links.gdf`。\n- 2. 修改每个文件中的标题行，使其与我们最终希望在 JSON 文件中使用的列名相匹配：\n\
  ```\nid,name,gender,lang,num\n1234,Bugs Bunny,male,en_US,296\n2345,Daffy Duck,male,en_US,295\n\
  9876,Minnie Mouse,female,en_US,294\n\nsource,target\n1234,2345\n1234,9876\n2345,9876\n\
  ```\n- 3. 使用 `csvcut` 工具（之前讨论过的 csvkit 的一部分）从 `nodes.gdf` 文件中提取第一列和第二列，并将输出重定向到名为\
  \ `nodesCut.gdf` 的新文件：\n```\ncsvcut -c 1,2 nodes.gdf > nodesCut.gdf\n```\n\n- 4.\
  \ 现在，我们需要为每条边对赋予索引值，而不是其完整的 Facebook ID 值。索引只是通过其在节点列表中的位置来标识该节点。我们需要执行此转换，以便数据能够轻松地输入到我们现有的\
  \ D3 力网络代码示例中，且尽可能少地进行重构。我们需要将此内容转换为：\n```\nsource,target\n1234,2345\n1234,9876\n\
  2345,9876\n```\ninto this:\n```\nsource,target\n0,1\n0,2\n1,2\n```\n下面是一个小型 Python\
  \ 脚本，可自动创建这些索引值：\n```\nimport csv\n\n# read in the nodes\nwith open('nodesCut.gdf',\
  \ 'r') as nodefile:\n    nodereader = csv.reader(nodefile)\n    nodeid, name = zip(*nodereader)\n\
  \n# read in the source and target of the edges\nwith open('edges.gdf', 'r') as edgefile:\n\
  \    edgereader = csv.reader(edgefile)\n    sourcearray, targetarray = zip(*edgereader)\n\
  slist = list(sourcearray)\ntlist = list(targetarray)\n\n# find the node index value\
  \ for each source and target\nfor n,i in enumerate(nodeid):\n    for j,s in enumerate(slist):\n\
  \        if s == i:\n            slist[j]=n-1\n    for k,t in enumerate(tlist):\n\
  \        if t == i:\n            tlist[k]=n-1\n# write out the new edge list with\
  \ index values\nwith open('edgelistIndex.csv', 'wb') as indexfile:\n    iwriter\
  \ = csv.writer(indexfile)\n    for c in range(len(slist)):\n        iwriter.writerow([\
  \ slist[c], tlist[c]])\n```\n\n- 5. 现在，回到 nodesCut.csv 文件并删除 id 列：\n```\ncsvcut\
  \ -c 2 nodesCut.gdf > nodesCutName.gdf\n```\n\n- 6. 编写一个小型 Python 脚本，将这些文件读取并写入完整的\
  \ JSON 文件，以便 D3 处理：\n```\nimport csv\nimport json\n\n# read in the nodes file\n\
  with open('nodesCutName.gdf') as nodefile:\n    nodefile_csv = csv.DictReader(nodefile)\n\
  \    noutput = '['\n    ncounter = 0;\n\n    # process each dictionary row\n   \
  \ for nrow in nodefile_csv:\n        # look for ' in node names, like O'Connor\n\
  \        nrow[\"name\"] = \\\n            str(nrow[\"name\"]).replace(\"'\",\",\"\
  )\n        # put a comma between the entities\n        if ncounter > 0:\n      \
  \      noutput += ','\n        noutput += json.dumps(nrow)\n        ncounter +=\
  \ 1\n    noutput += ']'\n    # write out a new file to disk\n    f = open('complete.json','w')\n\
  \    f.write('{')\n    f.write('\\\"nodes\\\": ')\n    f.write(noutput)\n\n# read\
  \ in the edge file\nwith open('edgelistIndex.csv') as edgefile:\n    edgefile_csv\
  \ = csv.DictReader(edgefile)\n    eoutput = '['\n    ecounter = 0;\n    # process\
  \ each dictionary row\n    for erow in edgefile_csv:\n        # make sure numeric\
  \ data is coded as number not\n        # string\n        for ekey in erow:\n   \
  \         try:\n                erow[ekey] = int(erow[ekey])\n```\n```\nexcept ValueError:\n\
  \    # not an int\n    pass\n# put a comma between the entities\nif ecounter > 0:\n\
  \    eoutput += ','\neoutput += json.dumps(erow)\n    ecounter += 1\neoutput +=\
  \ ']'\n\n# write out a new file to disk\nf.write(',')\nf.write('\"links\":')\nf.write(eoutput)\n\
  f.write('}')\nf.close()\n```\n\n## 第四步 – 构建 D3 图表\n\n本节展示如何将我们的节点和链接 JSON 文件输入到\
  \ D3 中构建力导向图的样板示例中。此代码示例来自 D3 网站，并使用提供的 JSON 文件构建一个简单的图。每个节点显示为一个圆圈，当将鼠标悬停在节点上时，该人的姓名会作为工具提示显示：\n\
  ```\n<!DOCTYPE html>\n<!-- this code is based on the force-directed graph D3 example\
  \ given\nat : https://gist.github.com/mbostock/4062045 -->\n\n<meta charset=\"utf-8\"\
  >\n<style>\n\n.node {\n    stroke: #fff;\n    stroke-width: 1.5px;\n}\n\n.link {\n\
  \    stroke: #999;\n    stroke-opacity: .6;\n}\n\n</style>\n```\n```\n<body>\n<!--\
  \ make sure you have downloaded the D3 libraries and stored them locally -->\n<script\
  \ src=\"d3.min.js\"></script>\n<script>\n\nvar width = 960, height = 500;\nvar color\
  \ = d3.scale.category20();\nvar force = d3.layout.force()\n    .charge(-25)\n  \
  \  .linkDistance(30)\n    .size([width, height]);\n\nvar svg = d3.select(\"body\"\
  ).append(\"svg\")\n    .attr(\"width\", width)\n    .attr(\"height\", height);\n\
  \nd3.json(\"complete.json\", function(error, graph) {\n    force\n        .nodes(graph.nodes)\n\
  \        .links(graph.links)\n        .start();\n\n    var link = svg.selectAll(\"\
  .link\")\n        .data(graph.links)\n        .enter().append(\"line\")\n      \
  \  .attr(\"class\", \"link\")\n        .style(\"stroke-width\", function(d) { return\
  \ Math.sqrt(d.value);\n});\n\nvar node = svg.selectAll(\".node\")\n    .data(graph.nodes)\n\
  \    .enter().append(\"circle\")\n    .attr(\"class\", \"node\")\n    .attr(\"r\"\
  , 5)\n    .style(\"fill\", function(d) { return color(d.group); })\n    .call(force.drag);\n\
  \nnode.append(\"title\")\n    .text(function(d) { return d.name; });\n\nforce.on(\"\
  tick\", function() {\n    link.attr(\"x1\", function(d) { return d.source.x; })\n\
  \        .attr(\"y1\", function(d) { return d.source.y; })\n```\n```\n.attr(\"x2\"\
  , function(d) { return d.target.x; })\n.attr(\"y2\", function(d) { return d.target.y;\
  \ });\n\nnode.attr(\"cx\", function(d) { return d.x; })\n.attr(\"cy\", function(d)\
  \ { return d.y; });\n});\n});\n</script>\n```\n\n以下屏幕截图显示了此社交网络的一个示例。其中一个节点已被悬停，显示了该节点的工具提示（名称）。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_123_0.png)\n\n使用 D3 构建的社交网络\n\n## 第五步\
  \ – 将数据转换为 Pajek 文件格式\n\n到目前为止，我们已将 GDF 文件转换为 CSV，然后转换为 JSON，并为其构建了 D3 图表。在接下来的两个步骤中，我们将继续追求我们的目标，即将数据置于可以对其计算一些社交网络指标的格式中。\n\
  \n对于此步骤，我们将采用原始的 GDF 文件并对其进行调整，使其成为有效的 Pajek 文件，这是社交网络工具 networkx 所需的格式。\n\n\n\n\
  ![](img/9aa003afabe05fdb07da46ad71325de6_124_0.png)\n\n> 单词 *pajek* 在斯洛文尼亚语中意为 *蜘蛛*。社交网络可以被视为由节点及其之间的链接构成的网络。\n\
  \n我们 Facebook GDF 文件转换为 Pajek 文件的格式如下所示：\n\n```\n*vertices 296\n1234 Bugs_Bunny\
  \ male en_US 296\n2456 Daffy_Duck male en_US 295\n9876 Minnie_Mouse female en_US\
  \ 294\n*edges\n1234 2456\n2456 9876\n2456 3456\n```\n\n立即可注意到的关于此 Pajek 文件格式的几点重要事项如下：\n\
  \n- 它是空格分隔的，而不是逗号分隔的。\n- 就像在 GDF 文件中一样，数据有两个主要部分，并且这些部分以星号 * 开头进行标记。两个部分分别是顶点（节点的另一个词）和边。\n\
  - 文件中总共有多少个顶点（节点）有一个计数，并且该计数位于顶行单词 vertices 旁边。\n- 每个人姓名中的空格已被移除并替换为下划线。\n- 节点部分中的其他列是可选的。\n\
  \n为了将我们的 GDF 文件转换为 Pajek 格式，让我们使用文本编辑器，因为这些更改相当直接，并且我们的文件不是很大。我们将按如下方式执行数据清理任务：\n\
  \n1. 将你的 GDF 文件保存为新文件的副本，并将其命名为类似 fbPajek.net（.net 扩展名通常用于 Pajek 网络文件）。\n2. 替换文件中的顶行。目前，它看起来像这样：\n\
  \n```\nnodedef>name VARCHAR,label VARCHAR,sex VARCHAR,locale VARCHAR,agerank INT\n\
  ```\n\n你需要将其更改为类似这样：\n\n```\n*vertices 296\n```\n\n确保顶点数与实际文件中的数量相匹配。这是节点的计数。你的\
  \ GDF 文件中每行应有一个。\n\n3. 替换文件中的边行。目前，它看起来像这样：\n\n```\nedgedef>node1 VARCHAR,node2\
  \ VARCHAR\n```\n\n你需要将其更改为如下所示：\n\n```\n*edges\n```\n\n4. 从第 2 行开始，将每个空格实例替换为下划线。这可行，因为此文件中唯一的空格在名称中。看一下这个：\n\
  \n```\n1234,Bugs Bunny,male,en_US,296\n2456,Daffy Duck,male,en_US,295\n3456,Minnie\
  \ Mouse,female,en_US,294\n```\n\n此操作将前者转换为如下：\n\n```\n1234,Bugs_Bunny,male,en_US,296\n\
  2456,Daffy_Duck,male,en_US,295\n3456,Minnie_Mouse,female,en_US,294\n```\n\n5. 现在，使用查找和替换将所有逗号实例替换为空格。节点部分的結果将为：\n\
  \n```\n*vertices 296\n1234 Bugs_Bunny male en_US 296\n2456 Daffy_Duck male en_US\
  \ 295\n3456 Minnie_Mouse female en_US 294\n```\n\n边部分的結果将为：\n\n```\n*edges\n1234\
  \ 2456\n2456 9876\n2456 3456\n```\n\n6. 最后一点；使用文本编辑器的查找功能定位姓名中带有撇号的 Facebook 好友。将此撇号替换为空。于是，Cap'n_Crunch\
  \ 变为：\n\n```\n1998988 Capn_Crunch male en_US 137\n```\n\n这现在是一个完全清理过的、Pajek 格式的文件。\n\
  \n## 第六步 – 计算简单的网络指标\n\n在这一点上，我们准备使用像 networkx 这样的 Python 包运行一些简单的社交网络指标。尽管社会网络分析（SNA）超出了本书的范围，但我们仍然可以相当轻松地执行一些计算，而无需深入\
  \ SNA 的奥秘。\n\n首先，我们应该确保已安装 networkx 包。我使用 Canopy 作为我的 Python 编辑器，因此我将使用包管理器搜索 networkx\
  \ 并安装它。\n\n然后，一旦 networkx 安装完成，我们就可以编写一些快速的 Python 代码来读取我们的 Pajek 文件并输出有关我的 Facebook\
  \ 网络结构的一些有趣事实：\n\n```\nimport networkx as net\n\n# read in the file\ng = net.read_pajek('fb_pajek.net')\n\
  \n# how many nodes are in the graph?\n# print len(g)\n\n# create a degree map: a\
  \ set of name-value pairs linking nodes\n# to the number of edges in my network\n\
  deg = net.degree(g)\n# sort the degree map and print the top ten nodes with the\n\
  # highest degree (highest number of edges in the network)\nprint sorted(deg.iteritems(),\
  \ key=lambda(k,v): (-v,k))[0:9]\n```\n\n我网络的结果看起来像以下输出。列出了前十个节点，以及这些节点各自链接到的其他节点的数量：\n\
  \n```\n[(u'Bambi', 134), (u'Cinderella', 56), (u'Capn_Crunch', 50),\n    (u'Bugs_Bunny',\
  \ 47), (u'Minnie_Mouse', 47), (u'Cruella_Deville',\n    46), (u'Alice_Wonderland',\
  \ 44), (u'Prince_Charming', 42),\n    (u'Daffy_Duck', 42)]\n```\n\n这表明 Bambi 与我的\
  \ 134 个其他朋友相连，但 Prince_Charming 仅与我的 42 个其他朋友相连。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_126_0.png)\n\
  \n> 如果你遇到任何关于缺少引号的 Python 错误，请仔细检查你的 Pajek 格式文件，以确保所有节点标签都不包含空格和其他特殊字符。在前面示例中解释的清理过程中，我们移除了空格和引号字符，但你的朋友的姓名中可能包含更奇特的字符！\n\
  \n当然，使用 networkx 和 D3 可视化还可以做更多有趣的事情，但这个示例项目旨在让我们了解数据清理过程对任何更大分析工作成功结果的重要性。\n\n\
  ## 总结\n\n在本章中，我们学习了许多将数据从一种格式转换为另一种格式的不同方法。其中一些技术很简单，例如只需将文件保存为所需格式或查找菜单选项以输出正确格式。有时，我们需要编写自己的程序化解决方案。\n\
  \n许多项目，例如我们在本章中实现的示例项目，将需要几个不同的清理步骤，我们必须仔细规划清理步骤并写下我们所做的工作。networkx 和 D3 都是非常巧妙的工具，但它们确实要求数据以特定格式存在，我们才能准备好使用它们。同样，Facebook\
  \ 数据可以通过 netvizz 轻松获取，但它也有自己的数据格式。找到从一种文件格式轻松转换为另一种文件格式的方法是数据科学中的一项关键技能。\n\n在本章中，我们在结构化和半结构化数据之间进行了大量转换。但对于清理混乱的数据，例如非结构化文本怎么办？\n\
  \n在第 5 章《从 Web 收集和清理数据》中，我们将继续充实我们的数据科学清理工具箱，通过学习一些我们可以清理我们在网络上找到的页面的方法。\n"
- "# 第5章：从网络收集和清洗数据\n收集和清理数据\n来自网络\n\n最常见和有用的厨房工具之一是滤网，也称为筛子、漏勺或中式滤勺，其目的是在烹饪过程中将固体与液体分离。在本章中，我们将为我们在网络上找到的数据构建滤网。我们将学习如何创建几种类型的程序，帮助我们找到并保留我们想要的数据，同时丢弃我们不想要的部分。\n\
  \n在本章中，我们将：\n\n- 理解设想 HTML 页面结构的两种选项，即 (a) 作为我们可以查找模式的行集合，或 (b) 作为包含可识别和收集值的节点的树结构。\n\
  - 尝试三种解析网页的方法，一种使用逐行方法（基于正则表达式的 HTML 解析），两种使用树结构方法（Python 的 BeautifulSoup 库和名为 Scraper\
  \ 的 Chrome 浏览器工具）。\n- 在一些真实数据上实现这三种技术；我们将练习从发布到网络论坛的消息中抓取日期和时间。\n\n## 理解 HTML 页面结构\n\
  \n一个网页只是一个文本文件，其中包含一些特殊的标记 **元素**（有时称为 HTML **标签**），旨在指示网页浏览器在向用户显示页面时应如何显示，例如，如果我们希望某个单词以表示强调的方式显示，我们可以用\
  \ `<em>` 标签将其包围，如下所示：\n\n它是 `<em>非常重要</em>` 你必须遵循这些说明。\n\n所有网页都有这些相同的特征；它们由文本组成，文本中可能包含标签。我们可以采用两种主要的心智模型来从网页中提取数据。这两种模型都有其有用的方面。在本节中，我们将描述两种结构模型，然后在下一节中，我们将使用三种不同的工具进行数据提取。\n\
  \n### 行级分隔符模型\n\n在最简单地思考网页的方式中，我们关注的是有数十种 HTML 元素/标签用于在网络上组织和显示页面这一事实。如果我们想在这种简单模型中从网页中提取有趣的数据，我们可以使用页面文本和嵌入的\
  \ HTML 元素本身作为 **分隔符**。例如，在前面的例子中，我们可能会决定想要收集 `<em>` 标签内的所有内容，或者也许我们想要收集 `<em>` 标签之前或\
  \ `</em>` 标签之后的所有内容。\n\n在这种模型中，我们将网页视为大量非结构化文本的集合，而 HTML 标签（或其他文本特征，例如重复的词）有助于提供结构，我们可以使用它来分隔我们想要的部分。一旦我们有了分隔符，我们就能够从垃圾中筛选出有趣的数据。\n\
  \n例如，这里是来自真实网页的摘录，来自 Django IRC 频道的聊天记录。让我们考虑如何使用其 HTML 元素作为分隔符来提取有趣的数据：\n\n```\n\
  <div id=\"content\">\n<h2>Sep 13, 2014</h2>\n\n<a href=\"/2014/sep/14/\">← next\
  \ day</a> Sep 13, 2014 <a href=\"/2014/sep/12/\">previous day →</a>\n\n<ul id=\"\
  ll\">\n<li class=\"le\" rel=\"petisnnake\"><a href=\"#1574618\" name=\"1574618\"\
  >#</a> <span style=\"color:#b78a0f;8\" class=\"username\" rel=\"petisnnake\">&lt;petisnnake&gt;</span>\
  \ i didnt know that </li>\n```\n\n\n\n\n```\n...\n</ul>\n...\n</div>\n```\n\n根据此示例文本，我们可以使用\
  \ <h2></h2> 标签作为分隔符来提取此特定聊天日志的日期。我们可以使用 <li></li> 标签作为一行文本的分隔符，并且在该行内，我们可以看到 rel=\"\
  \" 可用于提取聊天者的用户名。最后，从 </span> 结束处到 </li> 开始处延伸的所有文本似乎是用户发送到聊天频道的实际行消息。\n\n> 这些聊天日志都可在\
  \ Django IRC 日志网站 http://django-irc-logs.com 上在线获取。该网站还提供日志的关键词搜索界面。前面代码中的省略号 (...)\
  \ 代表为简洁起见在此示例中已删除的文本。\n\n从这段杂乱的文本中，我们能够使用分隔符的概念提取出三个干净的数据片段（日志日期、用户和行消息）。\n\n##\
  \ 树结构模型\n\n另一种想象文本网页的方式是将其视为由 HTML 元素/标签组成的树结构，每个元素都与其他标签相关联。每个标签显示为一个节点，一棵树由特定页面中的所有不同节点组成。在\
  \ HTML 中出现在另一个标签内的标签被视为子节点，而包含的标签则是父节点。在之前的 IRC 聊天示例中，HTML 摘录可以用如下树状图表示：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_131_0.png)\n\
  \n如果我们能够将 HTML 文本设想为树结构，我们就可以使用编程语言为我们构建一棵树。这使我们能够根据元素的名称或其在元素列表中的位置提取所需文本值。例如：\n\
  \n- 我们可能想要按名称获取标签的值（给我 <h2> 节点的文本）\n- 我们可能想要特定类型的所有节点（给我 <ul> 内部、<div> 内部的所有 <li>\
  \ 节点）\n- 我们可能想要给定元素的所有属性（给我 <li> 元素中的 rel 属性列表）\n\n在本章的剩余部分，我们将把这两种心智模型——逐行和树结构——与一些示例一起付诸实践。我们将通过三种不同的方法逐步介绍如何从\
  \ HTML 页面中提取和清理数据。\n\n## 方法一 – Python 和正则表达式\n\n在本节中，我们将使用一种简单的方法从 HTML 页面中提取我们想要的数据。这种方法基于在页面中识别分隔符并使用正则表达式模式匹配来提取我们想要的数据的概念。\n\
  \n你可能还记得我们在第 3 章《清洁数据的支柱 – 电子表格和文本编辑器》中学习文本编辑器时，曾稍微尝试过正则表达式（regex）。在本章中，部分概念会相似，只是我们将编写\
  \ Python 程序来查找匹配文本并提取它，而不是像该章中那样使用文本编辑器进行替换。\n\n在开始示例之前最后说明一点，虽然这种正则表达式方法很容易理解，但它确实存在一些局限性，具体取决于你的项目。这些局限性可能会很显著。我们将在本节末尾详细描述这种方法的局限性。\n\
  \n### 第一步 – 查找并保存用于实验的网页文件\n\n对于本示例，我们将抓取前面提到的 Django 项目的其中一个 IRC 聊天日志之一。这些是结构相当规律的公开可用文件，因此非常适合本项目。前往\
  \ Django IRC 日志存档 http://django-irc-logs.com/ 并找到一个吸引你的日期。导航到其中一个日期的目标页面并将其保存到你的工作目录。完成后你应该有一个\
  \ .html 文件。\n\n### 第二步 – 查看文件并决定提取什么内容\n\n由于我们在第 2 章《基础 – 格式、类型和编码》中了解到 .html 文件只是文本，而第\
  \ 3 章《清洁数据的支柱 – 电子表格和文本编辑器》让我们非常习惯于在文本编辑器中查看文本文件，因此这一步应该很容易。只需在文本编辑器中打开 HTML 文件并查看它。有什么看起来适合提取的？\n\
  \n当我查看我的文件时，我看到有几样东西想要提取。立刻我看到对于每条聊天评论，都有行号、用户名和评论本身。让我们计划从每条聊天行中提取这三项。\n\n下图显示了我的文本编辑器中打开的\
  \ HTML 文件。我已打开软换行，因为有些行相当长（在 TextWrangler 中此选项位于菜单下的 View | Text Display | Soft\
  \ Wrap Text）。大约在第 29 行我们看到聊天行列表的开始，每行都有我们感兴趣的三个项目：\n\n```\n29 <ul id=\"li\">\n30\
  \ <li class=\"le\" rel=\"petisnnake\"><a href=\"#1574618\" name=\"1574618\">#</a>\
  \ <span style=\"color:#b78a0f;\" class=\"username\" rel=\"petisnnake\">&lt;petisnnake&gt;</span>\
  \ i didn't know that </li>\n31 <li class=\"le\" rel=\"dshap\"><a href=\"#1574619\"\
  \ name=\"1574619\">#</a> <span style=\"color:#b93d98;\" class=\"username\" rel=\"\
  dshap\">&lt;dshap&gt;</span> FunkyBob: ahh, hmm, i wonder if there's a way to do\
  \ it in my QuerySet subclass so i'm not creating a new manager subclass *only* for\
  \ get_queryset to do the initial filtering </li>\n```\n\n因此，我们的工作是找到每行中看起来相同的特征，以便可预测地从每条聊天行中提取相同的三项内容。查看文本后，以下是我们可以遵循的一些可能规则，以准确且只需少量调整地提取每个数据项：\n\
  \n- 似乎我们想要的全部三项都位于 <li> 标签内，而这些 <li> 标签本身位于 <ul id=\"li\"> 标签内。每个 <li> 代表一条聊天消息。\n\
  - 在该消息内，行号位于两个位置：它跟在字符串 <a href=\"# 后面，并且出现在 name 属性后的引号内。所示示例文本中，第一行号为 1574618。\n\
  - 用户名属性出现在三个位置，第一个是 li class=\"le\" 的 rel 属性值。在 span 标签内，用户名属性再次作为 rel 属性值出现，并且还在\
  \ &lt; 和 &gt; 符号之间出现。在示例文本中，第一个用户名为 petisnake。\n- 行消息位于 </span> 标签之后和 </li> 标签之前。在所示示例中，第一行消息为\
  \ i didn't know that。\n\n现在我们已经有了关于数据项所在位置的规则，我们可以编写程序了。\n\n### 第三步 – 编写 Python\
  \ 程序来提取有趣的部分并保存到 CSV 文件\n\n下面是一段简短的代码，用于以前面所示的格式打开给定的 IRC 日志文件，解析出我们感兴趣的三个部分，并将它们打印到新的\
  \ CSV 文件中：\n\n```\nimport re\nimport io\n\nrow = []\n\ninfile = io.open('django13-sept-2014.html',\
  \ 'r', encoding='utf8')\noutfile = io.open('django13-sept-2014.csv', 'a+', encoding='utf8')\n\
  for line in infile:\n    pattern = re.compile(ur'<li class=\"le\" rel=\"(.+?)\"\
  \ ><a href=\"#(.+?)\" name=\"(.+?)</span> (.+?)</li>', re.UNICODE)\n    if pattern.search(line):\n\
  ```\n\n```\nusername = pattern.search(line).group(1)\nlinenum = pattern.search(line).group(2)\n\
  message = pattern.search(line).group(4)\nrow.append(linenum)\nrow.append(username)\n\
  row.append(message)\noutfile.write(', '.join(row))\noutfile.write(u'\\n')\nrow =\
  \ []\ninfile.close()\n```\n\n这段代码中最棘手的部分是 pattern 行。该行构建了模式匹配，每行文件都将与之进行比较。\n\n\
  ![](img/9aa003afabe05fdb07da46ad71325de6_135_0.png)\n\n> 要保持警惕。只要网站开发者更改页面中的 HTML，我们精心构建的正则表达式模式就可能不再有效。事实上，在撰写本书的几个月里，该页面的\
  \ HTML 至少更改过一次！\n\n每个匹配目标组看起来像这样：.+?。共有五个。其中三个是我们感兴趣的项目（username、linenum 和 message），而另外两个组只是我们可以丢弃的垃圾。我们还将丢弃未匹配我们模式的网页其余内容。我们的程序就像一个恰好有三个功能孔的筛子。好东西会流过孔洞，留下垃圾。\n\
  \n### 第四步 – 查看文件并确保其干净\n\n当我们在文本编辑器中打开新的 CSV 文件时，可以看到前几行现在看起来像这样：\n\n```\n1574618,\
  \ petisnnake, i didn't know that\n1574619, dshap, FunkyBob: ahh, hmm, i wonder if\
  \ there's a way to do it in my QuerySet subclass so i'm not creating a new manager\
  \ subclass *only* for get_queryset to do the initial filtering\n1574620, petisnnake,\
  \ haven't used Django since 1.5\n```\n\n\n看起来结果很不错。你可能会注意到，第三列的文本周围没有封装字符。这可能会成为一个问题，因为我们使用了逗号作为分隔符。如果第三列中出现逗号怎么办？如果这让你担心，你可以给第三列加上引号，或者使用制表符来分隔列。要做到这一点，将第一个\
  \ `outfile.write()` 行改为使用 \\t（制表符）作为连接字符而不是逗号。你也可以通过 `lstrip()` 对消息进行一些空白修剪，以去除任何多余字符。\n\
  \n## 使用正则表达式解析 HTML 的局限性\n\n这种正则表达式方法乍一看似乎很直接，但它有一些局限性。首先，对于新手数据清洗人员来说，设计和完善正则表达式可能有点让人头疼。你应该做好花大量时间调试并为自己编写大量文档的准备。为了帮助生成正则表达式，我强烈建议使用正则表达式测试工具，例如\
  \ http://Pythex.org，或者直接使用你喜欢的搜索引擎查找一个。确保你指定想要 Python 正则表达式测试工具，如果你使用的语言是 Python。\n\
  \n接下来，你应该事先知道，正则表达式完全依赖于网页结构在未来保持不变。因此，如果你计划按计划从网站收集数据，今天编写的正则表达式明天可能就无法工作。它们只有在页面布局不发生变化时才有效。两个标签之间添加一个空格就会导致整个正则表达式失败，并且极难排查问题。还要记住，大多数时候你对网站更改几乎没有控制权或完全没有控制权，因为你收集数据的通常不是你自己的网站！\n\
  \n最后，有很多很多情况，准确编写正则表达式来匹配给定的 HTML 结构几乎是不可能的。Regex 强大但不完美也不万无一失。关于这个问题的一个有趣看法，我推荐你阅读在\
  \ Stack Overflow 上被点赞超过 4000 次的著名回答：http://stackoverflow.com/questions/1732348/。在该回答中，作者幽默地表达了许多程序员反复尝试解释为什么正则表达式不是解析网页中不规则且不断变化的\
  \ HTML 的完美解决方案时的挫败感。\n\n## 方法二 – Python 和 BeautifulSoup\n\n由于正则表达式存在一些局限性，我们肯定需要在数据清洗工具包中增加更多工具。在这里，我们描述如何使用名为\
  \ BeautifulSoup 的基于解析树的 Python 库从 HTML 页面中提取数据。\n\n### 第一步 – 查找并保存用于实验的文件\n\n对于这一步，我们将使用与方法\
  \ 1 相同的文件：来自 Django IRC 频道的文件。我们将搜索相同的三个项目。这样做可以轻松比较两种方法。\n\n### 第二步 – 安装 BeautifulSoup\n\
  \nBeautifulSoup 目前是第 4 版。此版本适用于 Python 2.7 和 Python 3。\n\n> 如果你使用的是 Enthought Canopy\
  \ Python 环境，只需在 Canopy 终端中运行 `pip install beautifulsoup4` 即可。\n\n### 第三步 – 编写 Python\
  \ 程序来提取数据\n\n我们感兴趣的三个项目都存在于 `li` 标签集合中，具体来说是那些具有 `class=\"le\"` 的标签。在这个特定文件中没有其他\
  \ `li` 标签，但为了以防万一，我们还是具体一点。以下是我们想要的项目以及在解析树中的查找位置：\n\n- 我们可以从 `li` 标签下的 `rel` 属性中提取用户名。\n\
  - 我们可以从 `a` 标签中的 `name` 属性获取 `linenum` 值。`a` 标签也是 `li` 标签的内容中的第一项。\n\n> 请记住数组是从零开始的，所以我们需要请求第\
  \ 0 项。\n\n在 BeautifulSoup 中，标签的 **内容** 是解析树中该标签下方的项目。其他一些包会称它们为 **子** 项。\n\n- 我们可以将消息提取为\
  \ li 标签中的第四个内容项（引用为数组项 [3]）。我们还注意到每个消息前面都有一个前导空格，所以在保存数据之前我们想将其去掉。\n\n以下是对应于我们想要从解析树中获取内容的轮廓的\
  \ Python 代码：\n\n```\nfrom bs4 import BeautifulSoup\nimport io\n\ninfile = io.open('django13-sept-2014.html',\
  \ 'r', encoding='utf8')\noutfile = io.open('django13-sept-2014.csv', 'a+', encoding='utf8')\n\
  soup = BeautifulSoup(infile)\n\nrow = []\nallLines = soup.findAll(\"li\",\"le\"\
  )\nfor line in allLines:\n    username = line['rel']\n    linenum = line.contents[0]['name']\n\
  \    message = line.contents[3].lstrip()\n    row.append(linenum)\n    row.append(username)\n\
  \    row.append(message)\n    outfile.write(', '.join(row))\n    outfile.write(u'\\\
  n')\n    row = []\ninfile.close()\n```\n\n### 第四步 – 查看文件并确保其干净\n\n当我们在文本编辑器中打开新的\
  \ CSV 文件时，可以看到前几行现在看起来与方法 1 中的完全相同：\n\n```\n1574618, petisnnake, i didn't know that\n\
  1574619, dshap, FunkyBob: ahh, hmm, i wonder if there's a way to do\nit in my QuerySet\
  \ subclass so i'm not creating a new manager subclass\n*only* for get_queryset to\
  \ do the initial filtering\n1574620, petisnnake, haven't used Django since 1.5\n\
  ```\n\n就像使用正则表达式方法一样，如果你担心最后一列中嵌入了逗号，你可以对列文本进行封装引号，或者直接使用制表符来分隔列。\n\n## 方法三 – Chrome\
  \ Scraper\n\n如果你真的不想编写程序来解析数据，有几个基于浏览器的工具使用树结构让你能够识别和提取你感兴趣的数据。我认为最容易使用且工作量最小的是一个名为\
  \ Scraper 的 Chrome 扩展，由一名名为 mnmldave 的开发者创建（真名：Dave Heaton）。\n\n### 第一步 – 安装 Scraper\
  \ Chrome 扩展\n\n如果尚未运行，请下载 Chrome 浏览器。确保你获取的是正确的 Scraper 扩展；有几个扩展名称非常相似。我建议使用该产品的开发者自己的\
  \ GitHub 网站，网址为 http://mnmldave.github.io/scraper/。这样你就可以获得正确的抓取工具，而不是尝试使用 Chrome\
  \ 商店搜索。从 http://mnmldave.github.io/scraper 网站，点击链接从 Google 商店安装扩展，然后重新启动浏览器。\n\n\
  ### 第二步 – 从网站收集数据\n\n将浏览器指向我们用于另外两次网页数据提取实验的相同网页 URL，即 Django IRC 日志之一。我在这里的示例和屏幕截图中使用的是\
  \ 2014 年 9 月 13 日的日志，所以我将访问 http://django-irc-logs.com/2014/sep/13/。\n\n在我撰写本文时，我的浏览器中该页面看起来如下：\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_139_0.png)\n\n我们对这个 IRC 日志感兴趣的三个项目是：\n\
  \n- 行号（我们从之前两次实验中知道这是 # 符号下链接的一部分）\n- 用户名（位于 < 和 > 符号之间）\n- 实际行消息\n\nScraper 允许我们依次突出显示这三个项目中的每一个，并将值导出到\
  \ Google 电子表格中，然后我们可以将它们重新组装到一个工作表中并导出为 CSV（或随心所欲地处理它们）。操作方法如下：\n\n1. 使用鼠标突出显示你想要抓取的项目。\n\
  2. 右键单击并从菜单中选择 Scrape similar...。在下面的示例中，我选择了用户名 petisnnake 作为我希望 Scraper 使用的用户名：\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_140_0.png)\n\n3. 选择 Scrape similar 后，工具会显示一个新窗口，其中包含页面上所有相似项目的集合。下面的屏幕截图显示了\
  \ Scraper 找到的整个用户名列表：\n\n\n![](img/9aa003afabe05fdb07da46ad71325de6_141_0.png)\n\
  \nScraper 根据一个示例用户名查找所有相似项目。\n\n- 4. 在窗口底部，有一个标记为 **Export to Google Docs...** 的按钮。请注意，根据您的设置，您可能需要点击同意以允许\
  \ Scraper 访问 Google Docs。\n\n## 第三步 – 对数据列进行最终清理\n\n一旦我们从页面中提取出所有数据元素并存放在单独的 Google\
  \ Docs 中，我们就需要将它们合并到一个文件中并进行最终清理。以下是行号在提取后但尚未清理时的示例：\n\n|  | A | B |\n|---|---|---|\n\
  | 1 | 链接 | 网址 |\n| 2 | # | #1574618 |\n| 3 | # | #1574619 |\n| 4 | # | #1574620\
  \ |\n| 5 | # | #1574621 |\n| 6 | # | #1574622 |\n\n我们对列 A 完全不感兴趣，也不关心前导的 # 符号。用户名和行消息数据类似——我们想要大部分内容，但希望删除一些符号并将所有内容合并到单个\
  \ Google 电子表格中。\n\n使用我们在第 3 章《干净数据的 workhorses – 电子表格和文本编辑器》中介绍的查找和替换技术（即删除 #、<\
  \ 和 > 符号并将行粘贴到单个工作表中），我们最终得到一个干净的数据集，如下所示：\n\n|  | A | B | C |\n|---|---|---|---|\n\
  | 1 | 1574618 | petisnake | 我不知道这一点 |\n| 2 | 1574619 | dshap | FunkyBob：啊，嗯，我想知道是否可以在我的\
  \ QuerySet 中做到这一点 |\n| 3 | 1574620 | petisnake | 从 1.5 版以来没有使用过 Django |\n| 4 |\
  \ 1574621 | FunkyBob | petisnake：真的吗？它可能是 1.7 中最大的单一新功能 |\n| 5 | 1574622 | FunkyBob\
  \ | renlo：顺便说一下——你可以做一个更聪明的查询 |\n\nScraper 是一个从网页中提取少量数据的不错工具。它具有方便的 Google 电子表格界面，如果你不想编写程序来完成这项工作，它可以是一个快速解决方案。在下一节中，我们将处理一个更大的项目。它可能复杂到足以让我们必须将本章中的一些概念实现到一个解决方案中。\n\
  \n## 示例项目 – 从电子邮件和网络论坛中提取数据\n\nDjango IRC 日志项目非常简单。它旨在向你展示三种常用的、可靠的技术之间的差异，这些技术常用于从\
  \ HTML 页面中提取干净数据。我们提取的数据包括行号、用户名和 IRC 聊天消息，所有这些都很容易找到，并且几乎不需要额外的清理。在这个新的示例项目中，我们将考虑一个概念上相似的案例，但它将要求我们将数据提取的想法从\
  \ HTML 扩展到网络上发现的另外两种半结构化文本：托管在网络上的电子邮件消息和基于网络的讨论论坛。\n\n## 项目背景\n\n我最近正在进行一项关于如何使用社交媒体提供软件技术支持的研究。具体来说，我试图发现某些制作\
  \ API 和框架的软件开发组织是否应将对开发者的技术支持转移到 Stack Overflow，还是应继续使用较旧的媒体，例如电子邮件和网络论坛。为了完成这项研究，我比较了（其中之一）开发者通过\
  \ Stack Overflow 获得 API 问题答案所需的时间，与在较旧的社交媒体如网络论坛和电子邮件组上所需的时间。\n\n在这个项目中，我们将处理这个问题的其中一小部分。我们将下载代表旧社交媒体的两种原始数据：来自网络论坛的\
  \ HTML 文件和来自 Google Groups 的电子邮件消息。我们将编写 Python 代码来提取发送到这两个支持论坛的消息的日期和时间。然后我们将找出哪些消息是对其他消息的回复，并计算每个消息获得回复所需时间的一些基本汇总统计数据。\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_143_0.png)\n\n> 如果你想知道为什么我们在这个示例项目中没有为该问题的\
  \ Stack Overflow 部分提取数据，只要等到第 9 章，Stack Overflow 项目。那一整章都致力于创建和清理 Stack Overflow\
  \ 数据库。\n\n该项目将分为两部分。在第一部分中，我们将从托管在 Google Groups 上的项目中提取电子邮件档案数据，在第二部分中，我们将从另一个项目的\
  \ HTML 文件中提取数据。\n\n## 第一部分 – 清理 Google Groups 电子邮件数据\n\n许多软件公司传统上使用电子邮件邮件列表或混合电子邮件-网络论坛为其产品提供技术支持。Google\
  \ Groups 是此服务的热门选择。用户可以向该组发送电子邮件，也可以从网络浏览器中阅读和搜索消息。然而，一些公司已放弃通过 Google Groups 向开发者提供技术支持（包括\
  \ Google 自身的产品），而改用 Stack Overflow。数据库产品 Google BigQuery 就是这样一个现在使用 Stack Overflow\
  \ 的组。\n\n## 第一步 – 收集 Google Groups 消息\n\n为了研究 BigQuery Google Group 上问题的响应时间，我首先创建了该组中所有帖子的\
  \ URL 列表。你可以在我的 GitHub 网站上找到我的完整 URL 列表：https://github.com/megansquire/stackpaper2015/blob/master/BigQueryGGurls.txt。\n\
  \n一旦我们有了目标 URL 列表，我们就可以编写一个 Python 程序来下载这些 URL 中驻留的所有电子邮件，并将它们保存到磁盘。在下面的程序中，我的 URL\
  \ 列表已保存为名为 GGurls.txt 的文件。包含了 time 库，以便我们在向 Google Groups 服务器发出请求之间进行短暂的 sleep()\
  \ 方法：\n\n```python\nimport urllib2\nimport time\n\nwith open('GGurls.txt', 'r')\
  \ as f:\n    urls = []\n    for url in f:\n        urls.append(url.strip())\n\n\
  currentFileNum = 1\nfor url in urls:\n    print(\"Downloading: {0} Number: {1}\"\
  .format(url, currentFileNum))\n    time.sleep(2)\n    htmlFile = urllib2.urlopen(url)\n\
  \    urlFile = open(\"msg%d.txt\" %currentFileNum,'wb')\n    urlFile.write(htmlFile.read())\n\
  \    urlFile.close()\n    currentFileNum = currentFileNum +1\n```\n\n该程序导致写入磁盘 667\
  \ 个文件。\n\n## 第二步 – 从 Google Groups 消息中提取数据\n\n我们现在有 667 条分别存放在不同文件中的电子邮件消息。我们的任务是编写一个程序逐一读取它们，并使用本章中的一种技术来提取我们需要的信息。如果我们查看其中一条电子邮件消息，我们会看到很多\
  \ **headers**，它们存储有关电子邮件或其 **metadata** 的信息。我们可以快速看到标识我们需要的元数据元素的三个头：\n\n```\nIn-Reply-To:\
  \ <ab71b72a-ef9b-4484-b0cc-a72ecb2a3b85@r9g2000yqd.googlegroups.com>\nDate: Mon,\
  \ 30 Apr 2012 10:33:18 -0700\nMessage-ID: <CA+qSDkQ4JB+Cn7HNjmtLOqqkbJnyBu=Z1Ocs5-dTe5cN9UEPyA@mail.gmail.com>\n\
  ```\n\n所有消息都有 Message-ID 和 Date，但 In-Reply-To 头只会出现在是对另一条消息的回复的消息中。In-Reply-To 值必须是另一条消息的\
  \ Message-ID 值。\n\n下面的代码展示了基于正则表达式的解决方案，用于提取 Date、Message-ID 和 In-Reply-To（如果可用）值，并创建原始消息和回复消息的一些列表。然后，代码尝试计算一条消息与其回复之间的时间差：\n\
  \n```python\nimport os\nimport re\nimport email.utils\nimport time\nimport datetime\n\
  import numpy\n\noriginals = {}\nreplies = {}\ntimelist = []\n\nfor filename in os.listdir(os.getcwd()):\n\
  \    if filename.endswith(\".txt\"):\n        f=open(filename, 'r')\n        i=''\n\
  \        m=''\n        d=''\n        for line in f:\n            irt = re.search('(In\\\
  -Reply\\-To: <)(.+?)@', line)\n            mid = re.search('(Message\\-ID: <)(.+?)@',\
  \ line)\n```\n\n\n\n```\ndt = re.search('(Date: )(.+?)\\r', line)\n    if irt:\n\
  \        i= irt.group(2)\n    if mid:\n        m= mid.group(2)\n    if dt:\n   \
  \     d= dt.group(2)\n    f.close()\n    if i and d:\n        replies[i] = d\n \
  \   if m and d:\n        originals[m] = d\n\nfor (messageid, origdate) in originals.items():\n\
  \    try:\n        if replies[messageid]:\n            replydate = replies[messageid]\n\
  \        try:\n            parseddate = email.utils.parsedate(origdate)\n      \
  \      parsedreply = email.utils.parsedate(replydate)\n        except:\n       \
  \     pass\n        try:\n            # this still creates some malformed (error)\
  \ times\n            timeddate = time.mktime(parseddate)\n            timedreply\
  \ = time.mktime(parsedreply)\n        except:\n            pass\n        try:\n\
  \            dtdate = datetime.datetime.fromtimestamp(timeddate)\n            dtreply\
  \ = datetime.datetime.fromtimestamp(timedreply)\n        except:\n            pass\n\
  \        try:\n            difference = dtreply - dtdate\n            totalseconds\
  \ = difference.total_seconds()\n            timeinhours = (difference.days*86400+difference.seconds)/3600\n\
  \            # this is a hack to take care of negative times\n            # I should\
  \ probably handle this with timezones but alas\n            if timeinhours > 1:\n\
  \                #print timeinhours\n```\n```\ntimelist.append(timeinhours)\n  \
  \  except:\n        pass\n    except:\n        pass\n\nprint numpy.mean(timelist)\n\
  print numpy.std(timelist)\nprint numpy.median(timelist)\n```\n\n在这段代码中，初始的 for 循环遍历每条消息并提取我们感兴趣的三个数据片段。（此程序不会将这些数据存储到单独的文件或磁盘中，但如果你愿意，可以添加此功能。）这部分代码还创建了两个重要的列表：\n\
  \n- `originals[]` 是原始消息的列表。我们假设这些主要是向列表成员提出的问题。\n- `replies[]` 是回复消息的列表。我们假设这些主要是对另一条消息中提出的问题的回答。\n\
  \n第二个 for 循环处理原始消息列表中的每条消息，执行以下操作：如果原始消息有回复，则尝试计算该回复发送所需的时间。我们随后保留一个回复时间列表。\n\n\
  ## 提取代码\n\n对于本章，我们主要关注代码的清理和提取部分，因此让我们仔细查看这些行。这里，我们处理电子邮件文件的每一行，查找三个电子邮件头：In-Reply-To、Message-ID\
  \ 和 Date。我们使用正则表达式搜索和分组，就像本章前面方法 1 中所做的那样，来界定这些头并轻松提取其后的值：\n\n```\nfor line in f:\n\
  \    irt = re.search('(In\\-Reply\\-To: <)(.+?)@', line)\n    mid = re.search('(Message\\\
  -ID: <)(.+?)@', line)\n    dt = re.search('(Date: )(.+?)\\r', line)\n    if irt:\n\
  \        i = irt.group(2)\n    if mid:\n        m = mid.group(2)\n    if dt:\n \
  \       d = dt.group(2)\n```\n\n我们为什么决定在这里使用正则表达式而不是基于树的解析器？主要有两个原因：\n\n- 1. 因为我们下载的电子邮件不是\
  \ HTML，无法轻易描述为具有父子关系的节点树。因此，像 BeautifulSoup 这样的基于解析树的解决方案并不是最佳选择。\n- 2. 因为电子邮件头是结构化且非常可预测的（尤其是我们在这里查找的三个头），正则表达式解决方案是可以接受的。\n\
  \n## 程序输出\n\n此程序的输出是打印三个数字，估计该 Google 群组中消息回复的平均时间、标准差和中位数（以小时为单位）。当我运行此代码时，结果如下：\n\
  \n```\n178.911877395\n876.102630872\n18.0\n```\n\n这意味着发布到 BigQuery Google 群组的消息的中位响应时间约为\
  \ 18 小时。现在让我们考虑如何从另一个来源：网络论坛中提取类似的数据。你认为网络论坛中对问题的回复会比 Google 群组更快、更慢还是差不多？\n\n##\
  \ 第二部分 – 从网络论坛清理数据\n\n我们将在本项目中研究的网络论坛来自一家名为 DocuSign 的公司。他们还将开发者支持转移到了 Stack Overflow，但他们仍在线存档了旧的基于网络的开发者论坛。我在他们的网站上查找，直到发现如何下载这些旧论坛中的一些消息。这里展示的过程比\
  \ Google Groups 示例更复杂，但你将学到很多关于如何自动收集数据的内容。\n\n### 第一步 – 收集指向 HTML 文件的 RSS\n\nDocuSign\
  \ 开发者论坛上有数千条消息。我们希望获得所有这些消息或讨论线程的 URL 列表，以便编写代码自动下载它们并高效地提取回复时间。\n\n为此，首先我们需要一份所有讨论的\
  \ URL 列表。我发现 DocuSign 旧 Dev-Zone 开发者站点的存档位于 https://community.docusign.com/t5/DevZone-Archives-Read-Only/ct-p/dev_zone。\n\
  \n浏览器中该站点看起来如下：\n\n![](img/9aa003afabe05fdb07da46ad71325de6_149_0.png)\n\n我们绝对不想逐个点击这些论坛，然后逐条进入每条消息并手动保存。那样会花费永远，而且极其无聊。有更好的方法吗？\n\
  \nDocuSign 网站的帮助页面指出，可以下载一个 Really Simple Syndication（RSS）文件，显示每个论坛中最新的线程和消息。我们可以使用\
  \ RSS 文件自动收集该站点上许多讨论的 URL。我们感兴趣的 RSS 文件是仅与开发者支持论坛相关的那些（不是公告或销售论坛）。这些 RSS 文件可从以下\
  \ URL 获取：\n\n- `https://community.docusign.com/docusign/rss/board?board.id=upcoming_releases`\n\
  - `https://community.docusign.com/docusign/rss/board?board.id=DocuSign_Developer_Connection`\n\
  - `https://community.docusign.com/docusign/rss/board?board.id=Electronic_Signature_API`\n\
  - https://community.docusign.com/docusign/rss/board?board.id=Java\n- https://community.docusign.com/docusign/rss/board?board.id=php_api\n\
  - https://community.docusign.com/docusign/rss/board?board.id=dev_other\n- https://community.docusign.com/docusign/rss/board?board.id=Ask_A_Development_Question_Board`\n\
  \n在你的网络浏览器中访问列表中的每个 URL（如果时间紧张，只访问一个）。文件是 RSS，看起来像带有标签的半结构化文本，类似于 HTML。将 RSS 保存为本地系统上的文件，并为每个文件添加\
  \ .rss 文件扩展名。完成此过程后，你最多应有七个 RSS 文件，每个对应前面显示的每个 URL。\n\n每个 RSS 文件内部都包含描述论坛上所有讨论线程的元数据，包括我们在此阶段真正想要的一项数据：每个特定讨论线程的\
  \ URL。在文本编辑器中打开其中一个 RSS 文件，你就能找到我们感兴趣的 URL 示例。它看起来像这样，并且在文件中，你会看到每个讨论线程都有一个这样的条目：\n\
  \n```\n<guid>http://community.docusign.com/t5/Misc-Dev-Archive-READ-ONLY/Re-Custom-CheckBox-Tabs-not-marked-when-setting-value-to-quot-X/m-p/28884#M1674</guid>\n\
  ```\n\n现在，我们可以编写一个程序循环遍历每个 RSS 文件，查找这些 URL，访问它们，然后提取我们感兴趣的回复时间。下一节将把此过程分解为一系列更小的步骤，然后展示一个完成整个任务的程序。\n\
  \n### 第二步 – 从 RSS 提取 URL；收集并解析 HTML\n\n在此步骤中，我们将编写一个程序执行以下操作：\n\n- 1. 打开我们在步骤 1\
  \ 中保存的每个 RSS 文件。\n- 2. 每当看到 <guid> 和 </guid> 标签对时，提取其中的 URL 并将其添加到列表中。\n- 3. 对列表中的每个\
  \ URL，下载该位置的 HTML 文件。\n- 4. 读取该 HTML 文件并从每条消息中提取原始发布时间和回复时间。\n- 5. 计算发送回复所需的时间的平均值、中位数和标准差，就像我们在第一部分中所做的那样。\n\
  \n\n\n\n以下是处理这些步骤的 Python 代码。我们将在代码列表末尾详细讲解提取部分：\n\n```\nimport os\nimport re\n\
  import urllib2\nimport datetime\nimport numpy\n\nalllinks = []\ntimelist = []\n\
  for filename in os.listdir(os.getcwd()):\n    if filename.endswith('.rss'):\n  \
  \      f = open(filename, 'r')\n        linktext = ''\n        linkurl = ''\n  \
  \      for line in f:\n            # find the URLs for discussion threads\n    \
  \        linktext = re.search('(<guid>)(.+?)(</guid>)', line)\n            if linktext:\n\
  \                linkurl= linktext.group(2)\n                alllinks.append(linkurl)\n\
  \        f.close()\n\nmainmessage = ''\nreply = ''\nmaindateobj = datetime.datetime.today()\n\
  replydateobj = datetime.datetime.today()\nfor item in alllinks:\n    print \"===\"\
  \n    print \"working on thread\\n\" + item\n    response = urllib2.urlopen(item)\n\
  \    html = response.read()\n    # this is the regex needed to match the timestamp\n\
  \    tuples = re.findall('lia-message-posted-on\\\\\">\\\\s+<span class=\\\\\"local-date\\\
  \\\">\\\\xe2\\\\x80\\\\x8e(.*?)</span>\\\\s+<span class=\\\\\"local-time\\\\\">([\\\
  \\w:\\\\sAM|PM]+)</span>', html)\n    mainmessage = tuples[0]\n    if len(tuples)\
  \ > 1:\n        reply = tuples[1]\n    if mainmessage:\n        print \"main: \"\
  \n        maindateastr = mainmessage[0] + \" \" + mainmessage[1]\n        print\
  \ maindateastr\n        maindateobj = datetime.datetime.strptime(maindateastr,\n\
  '%m-%d-%Y %I:%M %p')\n    if reply:\n        print \"reply: \"\n        replydateastr\
  \ = reply[0] + \" \" + reply[1]\n```\n```\nprint replydateastr\nreplydateobj = datetime.datetime.strptime(replydateastr,\n\
  '%m-%d-%Y %I:%M %p')\n\n# only calculate difference if there was a reply\ndifference\
  \ = replydateobj - maindateobj\ntotalseconds = difference.total_seconds()\ntimeinhours\
  \ = (difference.days*86400+difference.seconds)/3600\nif timeinhours > 1:\n    print\
  \ timeinhours\n    timelist.append(timeinhours)\n\nprint \"when all is said and\
  \ done, in hours:\"\nprint numpy.mean(timelist)\nprint numpy.std(timelist)\nprint\
  \ numpy.median(timelist)\n```\n\n## 程序状态\n\n随着程序运行，它会打印出状态信息，以便我们知道它正在处理什么。状态信息如下所示，并且\
  \ RSS 订阅源中发现的每个 URL 都会有一个：\n\n```\n===\nworking on thread\nhttp://community.docusign.com/t5/Misc-Dev-Archive-READ-ONLY/Can-you-disable-the-Echosign-notification-in-Adobe-Reader/m-p/21473#M1156\n\
  main:\n06-21-2013 08:09 AM\nreply:\n06-24-2013 10:34 AM\n74\n```\n\n在此显示中，74 表示线程中第一条消息的发布时间与第一条回复的发布时间之间（约三天零两小时）的小时数（四舍五入）。\n\
  \n## 程序输出\n\n在程序结束时，它会打印出回复时间的平均值、标准差和中位数（以小时为单位），就像第一部分程序对 Google Groups 所做的那样：\n\
  \n```\nwhen all is said and done, in hours:\n695.009009009\n2506.66701108\n20.0\n\
  ```\n\n看起来 DocuSign 论坛的回复时间比 Google Groups 稍慢一些。与 Google Groups 的 18 小时相比，它报告为 20\
  \ 小时，但至少这两个数字在相同的近似范围内。你的结果可能会发生变化，因为消息一直在不断添加。\n\n## 提取代码\n\n由于我们主要关注数据提取，让我们仔细看看代码中执行该操作的<|message|>。以下是相关性最强的代码行：\n\
  \n```\ntuples = re.findall('lia-message-posted-on\">\\s+<span class=\\\"local-date\\\
  \">\\xe2\\x80\\x8e(.*?)</span>\\s+<span class=\\\"local-time\\\">([\\w:\\sAM|PM]+)</span>',\
  \ html)\n```\n\n与之前的一些示例一样，这段代码也依赖正则表达式来完成工作。然而，这个正则表达式相当混乱。也许我们应该用 BeautifulSoup\
  \ 来写？让我们看看我们试图匹配的原始 HTML，以便更深入地了解这段代码试图做什么，以及我们是否应该以不同的方式来做。接下来是浏览器中页面外观的截图，我们感兴趣的时间已在截图上进行了标注：\n\
  \n![](img/9aa003afabe05fdb07da46ad71325de6_153_0.png)\n\n不过底层的 HTML 长什么样呢？这正是我们的程序需要能够解析的部分。事实证明，原始消息的日期在\
  \ HTML 页面上的多个位置都有打印，但日期和时间组合仅对原始消息打印一次，对回复也打印一次。以下是这些内容的 HTML 显示（HTML 已压缩并删除换行符以便于查看）：\n\
  \n```\n<p class=\"lia-message-dates lia-message-post-date lia-component-post-date-last-edited\"\
  \ class=\"lia-message-dates lia-message-post-date\">\n<span class=\"DateTime lia-message-posted-on\
  \ lia-component-common-widget-date\" class=\"DateTime lia-message-posted-on\">\n\
  <span class=\"local-date\">06-18-2013</span>\n<span class=\"local-time\">08:21 AM</span>\n\
  \n<p class=\"lia-message-dates lia-message-post-date lia-component-post-date-last-edited\"\
  \ class=\"lia-message-dates lia-message-post-date\">\n<span class=\"DateTime lia-message-posted-on\
  \ lia-component-common-widget-date\" class=\"DateTime lia-message-posted-on\">\n\
  <span class=\"local-date\">06-25-2013</span>\n<span class=\"local-time\">12:11 AM</span>\n\
  ```\n\n这对于正则表达式来说似乎是一个相当直接的问题，因为我们可以编写一个单一的正则表达式并为两种类型的消息找到所有实例。在代码中，我们说明我们找到的第一个实例成为原始消息，下一个实例成为回复，如下所示：\n\
  \n```\nmainmessage = tuples[0]\nif len(tuples) > 1:\n    reply = tuples[1]\n```\n\
  \n我们本可以使用 BeautifulSoup 等基于解析树的解决方案，但我们必须应对这样一个事实：两组日期的 span class 值是相同的，甚至父元素（the\
  \ <p> 标签）也具有相同的 class。因此，这个解析树比本章前面方法 2 中显示的要复杂得多。\n\n如果您真的想尝试使用 BeautifulSoup 进行此提取，我的建议是首先使用浏览器的开发者工具查看页面的结构，例如在\
  \ Chrome 浏览器中，您可以选中您感兴趣的元素——本例中的日期和时间——右键单击它，然后选择 **Inspect Element**。这将打开一个开发者工具面板，显示这段数据在整个文档树中的位置。每个\
  \ HTML 元素左侧的小箭头表示是否存在子节点。然后，您可以通过以编程方式在解析树中定位目标元素来决定如何继续，并可以制定计划将其与其他节点区分开来。由于此任务超出了本入门书籍的范围，我将把它留作读者的练习。\n\
  \n## 摘要\n\n在本章中，我们发现了一些 tried-and-true 技术来分离有趣数据与不需要的数据。当我们在厨师的厨房里做汤时，我们使用滤网来捕获我们不想要的骨头和蔬菜皮，同时允许我们\
  \ *do* 想要的美味液体通过筛子的孔流入我们的容器。相同的思想也适用于我们在数据科学厨房中从网页中提取数据时。我们希望制定一个清理计划，允许我们提取我们想要的内容，同时留下其余的\
  \ HTML。\n\n在此过程中，我们回顾了从 HTML 中提取数据时使用的两种主要思维模式，即逐行分隔符方法和解析树/节点模型。然后我们研究了三种可靠、经过验证的解析\
  \ HTML 页面以提取我们想要的数据的方法：正则表达式、BeautifulSoup 以及基于 Chrome 的点按式 Scraper 工具。最后，我们完成了一个项目，该项目从真实的电子邮件和\
  \ HTML 页面中收集并提取了有用的数据。\n\n电子邮件和 HTML 等文本数据最终证明并不难清理，但二进制文件呢？在下一章中，我们将探讨如何从一个更困难的目标中提取干净的数据：PDF\
  \ 文件。\n\n\n"
- '# 第6章：在 PDF 文件中清洗数据


  在上一章中，我们发现了多种从我们想要的数据中分离出不需要的数据的方法。我们设想数据清理过程有点像制作鸡汤，我们的目标是保留汤汁但滤掉骨头。但如果我们想要的数据并不那么容易与我们不想要的数据区分开来会怎样？


  考虑一瓶陈年较久、沉淀物较多的好酒。乍一看，我们可能无法看到液体中悬浮的沉淀物。但在酒在醒酒器中放置一段时间后，沉淀物会沉到底部，我们就能倒出更干净、更芳香的酒。在这种情况下，简单的滤网无法将酒与沉淀物分离——需要一种专用工具。


  在本章中，我们将尝试几种数据醒酒器，以提取隐藏在晦涩 PDF 文件中的所有好东西。我们将探讨以下主题：


  - PDF 文件的用途以及为什么难以从中提取数据

  - 如何从 PDF 文件中复制和粘贴，以及当此方法不工作时该怎么办

  - 如何通过只保存所需的页面来缩小 PDF 文件

  - 如何使用名为 **pdfMiner** 的 Python 包中的工具从 PDF 文件中提取文本和数字

  - 如何使用名为 **Tabula** 的基于浏览器的 Java 应用程序从 PDF 文件中提取表格数据

  - 如何使用完整的付费版 Adobe Acrobat 提取数据表


  ### 为什么清理 PDF 文件很困难？


  保存为 **便携式文档格式 (PDF)** 的文件比本书迄今为止所看过的文本文件要复杂一些。PDF 是一种二进制格式，由 Adobe Systems 发明，后来演变为开放标准，以便多个应用程序可以创建其文档的
  PDF 版本。PDF 文件的目的是提供一种查看文档中的文本和图形的方式，而与原始排版所使用的软件无关。


  在 20 世纪 90 年代桌面出版的鼎盛时期，每个图形设计软件包都有其自己的专有文件格式，而且这些软件包价格昂贵。在那个时代，要查看在 Word、Pagemaker
  或 Quark 中创建的文档，你必须使用创建该文档的相同软件打开它。这在网络早期尤其成问题，因为 HTML 中没有太多创建复杂布局的技术，但人们仍然希望相互分享文件。PDF
  旨在成为一种厂商中立的布局格式。Adobe 将其 Acrobat Reader 软件免费提供给任何人下载，随后 PDF 格式被广泛使用。


  ![](img/9aa003afabe05fdb07da46ad71325de6_158_0.png)


  > 关于 Acrobat Reader 早期的一个有趣事实。当 `click here` 输入到 Google 搜索引擎时，仍然会将 *Adobe Acrobat
  PDF Reader 下载网站* 作为第一个结果显示，并且多年来一直如此。这是因为许多网站分发 PDF 文件并附带类似“要查看此文件，您必须安装 Acrobat
  Reader。点击此处下载它。”的消息。由于 Google 的搜索算法使用链接文本来了解哪些网站与哪些关键词相关，因此关键词 click here 现在与 Adobe
  Acrobat 的下载站点相关联。


  PDF 仍用于制作厂商和应用程序中立的文件版本，这些文件的布局比纯文本所能实现的功能更复杂。例如，在各种版本的 Microsoft Word 中查看同一文档，有时仍会导致包含大量嵌入表格、样式、图像、表单和字体的文档在外观上有所不同。这可能是由于多种因素造成的，例如操作系统或已安装的
  Word 软件本身版本的差异。即使是旨在在软件包或版本之间兼容的应用程序，细微差异也可能导致不兼容。PDF 的创建是为了解决其中的一些问题。


  我们马上就能看出 PDF 比文本文件更难处理，因为它是一种二进制格式，并且具有嵌入字体、图像等。因此，我们可靠的数据清理工具箱中的大多数工具，例如文本编辑器和命令行工具（`less`）对
  PDF 文件来说几乎毫无用处。幸运的是，我们仍然有一些技巧可以从 PDF 文件中获取数据。


  ### 先尝试简单的解决方案 – 复制


  假设你在去醒你那瓶好红酒的路上，不小心把酒瓶打翻在地板上。你第一反应可能是这是一场彻底的灾难，你必须更换整个地毯。但在开始拆除整个地板之前，值得先尝试用一个老调酒师的技巧来清理这团乱：苏打水和湿布。本节概述了一些在进行昂贵的文件改造项目之前可以先尝试的事情。它们可能不起作用，但值得一试。


  ### 我们的实验文件


  让我们通过使用一个真实的 PDF 文件来练习清理 PDF 数据。我们也不希望这个实验太容易，所以让我们选择一个非常复杂的文件。假设我们有兴趣从我们在皮尤研究中心网站上找到的一个名为“Is
  College Worth It?” 的文件中提取数据。发表于 2011 年，这份 PDF 文件长达 159 页，包含大量数据表，展示了衡量在美国获得大学教育是否值得投资的各种方式。我们希望找到一种快速提取这些众多表格内数据的方法，以便我们可以对其进行一些额外的统计分析。例如，以下是报告中一个表格的示例：


  **Q.23/Q.24，基于总计**

  你认为以下哪一项是大学在社会中扮演的最重要角色？


  | 全部 | 回答 | 私立四年制 | 公立四年制 | 私立/公立两年制 | 盈利性 |

  |---|---|---|---|---|---|

  | 38 | 培养学生成为生产力成员 | 23 | 28 | 47 | 63 |

  | 27 | 培养年轻人成为负责任的公民 | 48 | 31 | 14 | 8 |

  | 21 | 确保所有合格的学生都能平等接受大学教育 | 16 | 24 | 25 | 20 |

  | 4 | 为其所在地区或地方的经济发展做出贡献 | 2 | 5 | 8 | 2 |

  | 4 | 进行研究以帮助解决医疗、科学、社会和其他国家问题 | 5 | 8 | 3 | 1 |

  | 2 | 为各年龄段的成年人提供继续教育 | 2 | 1 | 1 | 3 |

  | 3 | 没有一项“非常重要”/无回答 | 4 | 4 | 3 | 2 |


  这个表格相当复杂。它只有六列和八行，但其中几行占了两行，表头行文本只显示在五列上。


  > 完整的报告可以在 PewResearch 网站上的 http://www.pewsocialtrends.org/2011/05/15/is-college-worth-it/
  找到，我们使用的特定文件标记为 Complete Report：http://www.pewsocialtrends.org/files/2011/05/higher-ed-report.pdf。


  ### 第一步 – 尝试复制我们想要的数据


  我们在此示例中进行实验的数据位于 PDF 文件的第 149 页（他们文档中标记为第 143 页）。如果我们在 PDF 查看器中打开该文件，例如 Mac OSX
  上的 Preview，并尝试仅选择表格中的数据，我们已经看到一些奇怪的事情正在发生。例如，即使我们没有打算选择页码（143）；它也被选中了。这对我们的实验来说不是个好兆头，但让我们继续。复制数据，使用
  Command-C 或选择 Edit | Copy。


  ![](img/9aa003afabe05fdb07da46ad71325de6_160_0.png)


  在 Preview 中选中此 PDF 时文本的外观


  ### 第二步 – 尝试将复制的数据粘贴到文本编辑器中


  以下屏幕截图显示了复制的文本粘贴到 Text Wrangler 文本编辑器中的样子：


  ```

  1  38 Prepare students to be productive

  2  members of the workforce

  3  27 Prepare young people to be responsible

  4  citizens

  5  21 Ensure that all qualified students have

  6  4-year 4-year 2-year Private Public Private/Public

  7  23 28 47 48 31 14 16 24 25

  8  For profit

  9  63 8 20

  10 143

  11  equal access to a college education

  12 4 Contribute to the economic development 2582

  13 of their region or locality

  14 4 Conduct research to help solve medical, 5831

  15 scientific, social, and other national

  16 problems

  17 2 Provide continuing education for adults 2113

  18 of all ages

  19 3 None is "very important"/No answer 4432

  ```


  很明显，复制并粘贴后这些数据没有任何合理的顺序。页码被包含在内，数字是水平的而不是垂直的，列标题的顺序也不正确。甚至有些数字也被合并了；例如，最后一行包含数字
  4,4,3,2；但在粘贴版本中，这变成了一个单一数字 4432。此时手动清理这些数据可能需要比重新输入原始表格更长的时间。我们可以得出结论，对于这个特定的 PDF
  文件，我们将不得不采取更强有力的措施来清理它。


  ![](img/9aa003afabe05fdb07da46ad71325de6_161_0.png)


  > 我们应该在此指出，该 PDF 文件的其他区域清理得很好。例如，位于文件第 3 页的仅文本的前言部分，使用上述技术复制得非常好。对于此文件，只有实际的表格数据存在问题。在决定提取技术之前，你应该尝试
  PDF 文件的所有部分——包括文本和表格数据。




  ## 第三步 – 制作文件的缩小版本


  我们的复制和粘贴操作没有成功，所以我们不得不接受事实，我们需要为更具侵入性的措施做准备。也许如果我们对从这份 PDF 文件的全部 159 页中提取数据不感兴趣，我们可以只识别出我们想要操作的
  PDF 区域，并将该部分保存到单独的文件中。


  要在 MacOSX 上的 Preview 中执行此操作，启动“文件 | 打印...”对话框。在“页数”区域，我们将输入实际想要复制的页码范围。为本次实验的目的，我们只对第
  149 页感兴趣；因此，如以下屏幕截图所示，在“从：”和“到：”框中均输入 149。


  然后从底部的 PDF 下拉框中，选择“在 Preview 中打开 PDF”。你将在新窗口中看到单页 PDF。从这里，我们可以将其保存为新文件并赋予新名称，例如
  report149.pdf 或类似名称。


  ![](img/9aa003afabe05fdb07da46ad71325de6_162_0.png)


  ## 另一种尝试的技术 – pdfMiner


  现在我们有了更小的实验文件，让我们尝试一些编程解决方案来提取文本，看看效果是否更好。pdfMiner 是一个 Python 包，包含两个用于操作 PDF 文件的嵌入式工具。我们特别有兴趣尝试其中一个工具，一个名为
  pdf2txt 的命令行程序，旨在从 PDF 文档中提取文本。也许这可以帮助我们正确地从文件中提取出那些数字表格。


  ### 第一步 – 安装 pdfMiner


  启动 Canopy Python 环境。从 Canopy 终端窗口，运行以下命令：


  ```

  pip install pdfminer

  ```


  这将安装整个 pdfMiner 包及其所有相关命令行工具。


  ![](img/9aa003afabe05fdb07da46ad71325de6_163_0.png)


  > pdfMiner 及其随附的两个工具 pdf2txt 和 dumpPDF 的文档位于 http://www.unixuser.org/~euske/python/pdfminer/。


  ### 第二步 – 从 PDF 文件中提取文本


  我们可以使用名为 pdf2txt.py 的命令行工具从 PDF 文件中提取所有文本。要执行此操作，使用 Canopy 终端并导航到文件所在的目录。命令的基本格式是
  pdf2txt.py <filename>。如果您有一个包含多页的大文件（或您尚未将 PDF 分成更小的文件），您也可以运行 pdf2txt.py -p149
  <filename> 来指定您只想要第 149 页。


  就像之前的复制粘贴实验一样，我们将不仅在第 149 页的表格上尝试此技术，还将在第 3 页的序言上尝试。要仅提取第 3 页的文本，我们运行以下命令：


  ```

  pdf2txt.py -p3 pewReport.pdf

  ```


  运行此命令后，皮尤研究报告的提取序言出现在我们的命令行窗口中：


  ![](img/9aa003afabe05fdb07da46ad71325de6_164_0.png)


  要将此文本保存到名为 pewPreface.txt 的文件中，我们只需在命令行中添加重定向，如下所示：


  ```

  pdf2txt.py -p3 pewReport.pdf > pewPreface.txt

  ```


  但是那些位于第 149 页的麻烦数据表呢？当我们对它们使用 pdf2txt 时会发生什么？我们可以运行以下命令：


  ```

  pdf2txt.py pewReport149.pdf

  ```


  结果比复制粘贴好一点，但好得不多。实际的数据输出部分显示在以下屏幕截图中。列标题和数据混在一起，不同列的数据显示顺序也不正确。


  ![](img/9aa003afabe05fdb07da46ad71325de6_165_0.png)


  我们不得不宣布本次实验的表格数据提取部分失败，尽管 pdfMiner 在逐行纯文本提取方面效果相当不错。


  > 请记住，您对这些工具的成功程度可能会有所不同。很大程度上取决于原始 PDF 文件的特定特征。


  看起来我们为此示例选择了一个非常棘手的 PDF，但让我们不要灰心。相反，我们将继续使用另一个工具，看看效果如何。


  ## 第三选择 – Tabula


  Tabula 是一个基于 Java 的程序，用于从 PDF 文件中提取表格中的数据。我们将下载 Tabula 软件并将其用于我们第 149 页文件中的棘手表格。


  ### 第一步 – 下载 Tabula


  Tabula 可从其网站 http://tabula.technology/ 下载。该网站包含一些简单的下载说明。


  > 在 Mac OSX 版本 10.10.1 上，我必须先下载旧版 Java 6 应用程序，然后才能运行 Tabula。过程很直接，只需按照屏幕上的说明操作即可。


  ### 第二步 – 运行 Tabula


  从下载的 .zip 归档中启动 Tabula。在 Mac 上，Tabula 应用程序文件仅称为 Tabula.app。您可以将其复制到“应用程序”文件夹中，如果您愿意的话。


  当 Tabula 启动时，它会在默认网页浏览器中以地址 http://127.0.0.1:8080/ 启动一个标签或窗口。屏幕的初始操作部分如下所示：


  ![](img/9aa003afabe05fdb07da46ad71325de6_166_0.png)


  自动检测表格需要很长时间的警告是正确的。对于包含三个表格的单页 pewReport149.pdf 文件，表格自动检测花费了整整两分钟，并导致关于 PDF 文件格式不正确的错误消息。


  ### 第三步 – 指导 Tabula 提取数据


  一旦 Tabula 读取文件，就该指示它表格所在的位置了。使用鼠标光标选择您感兴趣的表格。我在整个第一个表格周围画了一个框。


  Tabula 花了大约 30 秒读取表格，结果如下所示：


  ![](img/9aa003afabe05fdb07da46ad71325de6_167_0.png)


  与使用复制粘贴和 pdf2txt 读取数据的方式相比，此数据看起来很棒。但如果您对 Tabula 读取表格的方式不满意，您可以通过清除选择并重新绘制矩形来重复此过程。


  ### 第四步 – 复制数据


  我们可以使用 Tabula 中的“下载数据”按钮将数据保存为更友好的文件格式，例如 CSV 或 TSV。正如我们在前几章的工作中所知，这些是可以根据需要在电子表格或文本编辑器中清理的格式。很及时，我们准备好进行下一步了。


  ### 第五步 – 进一步清理


  在 Excel 或文本编辑器中打开 CSV 文件并查看它。在此阶段，我们在提取此 PDF 数据方面遇到了很多失败，因此现在就放弃的诱惑非常大。然而，如果您已经读到关于数据清理的书籍的这一部分，您可能可以猜到这些数据还可以变得更干净。以下是我们从前几章就已经知道如何做的一些简单数据清理任务：


  - 1. 我们可以将所有两行文本单元格合并为单个单元格。例如，在列 B 中，许多短语占用了多行。准备学生成为生产力成员和劳动力成员应作为一个短语放在一个单元格中。行
  1 和行 2 中的标题也是如此（4-year 和 Private 应放在一个单元格中）。要在 Excel 中清理此内容，在列 B 和 C 之间创建一个新列。使用
  concatenate() 函数将 B3:B4、B5:B6 等连接起来。使用“选择性粘贴”将新的连接值添加到新列中。然后删除不再需要的两列。对行 1 和行 2
  执行相同的操作。

  - 2. 删除行之间的空白行。


  完成这些操作后，数据如下所示：


  | 行 | A | B | 私立四年制 | 公立四年制 | 私立/公立两年制 | 营利性 |

  |---|---|---|---|---|---|---|

  |1|全部||私立四年制|公立四年制|私立/公立两年制|营利性|

  |2||38 培养学生成为生产力的劳动力成员|23|28|47|63|

  |3||27 培养年轻人成为负责任的公民|48|31|14|8|

  |4||21 确保所有合格学生都能平等接受大学教育|16|24|25|20|

  |5||4 促进其所在地区或地方的经济发展|2|5|8|2|

  |6||4 进行研究以帮助解决医疗、科学、社会及其他国家问题|5|8|3|1|

  |7||2 为各年龄段成年人提供继续教育|2|1|1|3|

  |8||3 没有一项“非常重要”/无回答|4|4|3|2|


  ![](img/9aa003afabe05fdb07da46ad71325de6_168_0.png)


  > 与剪切粘贴数据或运行简单的命令行工具相比，Tabula 可能看起来工作量很大。那是真的，除非您的 PDF 文件像这个一样棘手。请记住，专业工具之所以存在是有原因的——但不要在您真的不需要它们时使用它们。先从简单的解决方案开始，只有在您真的需要时才继续使用更困难的工具。


  ## 当一切都失败时 – 第四种技术


  Adobe Systems 出售其 Acrobat 软件的付费商业版本，其功能远不止于允许您阅读 PDF 文件。使用完整的 Acrobat 版本，您可以创建复杂的
  PDF 文件并以各种方式操作现有文件。这里相关的一个功能是 Acrobat 中找到的“导出所选内容为...”选项。




  开始使用此功能，请启动 Acrobat 并使用 **文件打开** 对话框打开 PDF 文件。在文件中，导航到包含要导出数据的表格。以下屏幕截图显示了如何从我们一直在操作的第
  149 页 PDF 中选择数据。使用鼠标选择数据，然后右键单击并选择 **导出选区为...**


  ![](img/9aa003afabe05fdb07da46ad71325de6_169_0.png)


  此时，Acrobat 会询问您希望如何导出数据。CSV 是其中一个选项。如果您确定不想在文本编辑器中编辑文件，Excel 工作簿（.xlsx）也是一个不错的选择。由于我知道
  Excel 也能打开 CSV 文件，我决定以该格式保存文件，以便在 Excel 和文本编辑器之间编辑时具有最大的灵活性。


  ![](img/9aa003afabe05fdb07da46ad71325de6_169_1.png)


  选择文件格式后，我们将被提示输入文件名和保存文件的位置。当我们在文本编辑器或 Excel 中启动 resulting 文件时，可以看到它看起来很像我们在上一节中看到的
  Tabula 版本。以下是我们的 CSV 文件在 Excel 中打开时的样子：


  |   | A | B | C | D | E | F |

  |---|---|---|---|---|---|---|

  |1|全部||4年私立|4年公立|2年私立|营利性|

