  \ Zagade\n\n**封面工作**\nShantanu N. Zagade\n\n## 关于作者\n\n**Megan Squire** 是 Elon University\
  \ 计算科学教授。她在过去二十年里一直在收集和清理脏数据。她也是 `FLOSSmole.org` 的负责人，这是一个研究项目，旨在收集数据并分析数据，以了解自由、自由和开源软件是如何制作的。\n\
  \n## 关于审阅者\n\n**J. Benjamin Cook** 在内布拉斯加林肯大学学习社会学后，从哈佛大学应用计算科学研究所获得了计算科学与工程硕士学位。目前，他正在帮助构建体育软件公司\
  \ Hudl 的数据科学团队，该公司的使命是捕捉并为体育中的每一刻带来价值。当他不学习所有关于数据的事情时，Ben 会陪伴他的女儿们和他美丽的妻子 Renee。\n\
  \n**Richard A. Denman, Jr.** 是 Numb3rs 的高级顾问，拥有超过 30 年为主要公司提供数据分析、数据科学、优化、流程改进和信息技术服务方面的经验。他在\
  \ 25 年以上的时间里一直是计算机协会（ACM）和电气和电子工程师协会（IEEE）的成员。他也是运筹学和管理科学研究所（INFORMS）和美国质量学会（ASQ）的成员。\n\
  \n我要感谢我的妻子 Barbara、我的儿子 Ashford 和我的女儿 Addie 对本书出版的支持。\n\n**Oskar Jarczyk** 从波兰-日本信息技术学院毕业，获得计算机科学（主修数据库）工程硕士学位。在从事三年商业工作后，他重返学术界，成为社会信息学领域的博士生。\n\
  \n他的学术工作与网络智能类别的问题相关，尤其是在自由/自由开源软件（FLOSS）和协作创新网络（COINs）方面。他专门分析在 GitHub 门户上开发者的开源软件团队的工作质量。与\
  \ WikiTeams 研究团队的同事一起，他在创建 MongoDB 和 MySQL 数据集时每天都处理“干净数据”的问题。它们后来被成功用于 R 和 Python\
  \ 语言中的 FLOSS 科学分析。\n\n业余时间，Oskar 阅读大数据书籍并练习剑道。\n\n## www.PacktPub.com\n\n## 支持文件、电子书、折扣优惠等\n\
