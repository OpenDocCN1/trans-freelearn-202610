  将此过程迁移到完整（非测试）表 235\n摘要 236\n## 索引 239\n\n## 前言\n\n> \"请问，巴贝奇先生，如果你把错误的数字输入机器，正确的答案会出来吗？\"\
  \n> \n> – Charles Babbage (1864)\n\n> \"垃圾进，垃圾出\"\n> \n> – The United States Internal\
  \ Revenue Service (1963)\n\n> \"没有干净的数据集。\"\n> \n> – Josh Sullivan, Booz Allen VP\
  \ in Fortune (2015)\n\n在他 1864 年的论文集中，第一台计算机的发明者查尔斯·巴贝奇回忆起自己对那种“思想混乱”感到惊讶，这种混乱会让人假设计算机即使被输入错误数据也能算出正确答案。再向前推进\
  \ 100 年，税务官僚机构开始耐心解释“垃圾进，垃圾出”，以表达即使对于全能的税务征收者来说，计算机处理仍然依赖于输入的质量。再向前推进 50 年到 2015\
  \ 年：一个看似神奇的时代，机器学习、自动纠正、预测性界面和比我更了解我的推荐系统比比皆是。然而，所有这些有用的算法首先仍需要高质量的数据才能正确学习，我们感叹“没有干净的数据集”。\n\
  \n本书适合任何定期处理数据的人，无论是数据科学家、数据记者、软件开发者还是其他角色。目标是教授实用的策略，快速轻松地弥合我们想要的数据与我们拥有的数据之间的差距。我们想要高质量、完美的数据，但现实是，大多数情况下，我们的数据远远不够。无论是缺失数据、格式错误的数据、位置错误的数据，还是数据中的异常，结果往往如说唱歌手\
  \ Notorious B.I.G. 所说，“数据越多，问题越多”。\n\n在整本书中，我们将把数据清洗视为数据科学流程中一个重要且值得的步骤：易于改进，绝不忽视。我们的目标是将数据清洗重新定义为不再是令人畏惧、枯燥的任务，我们必须艰难地完成它才能进行真正的工作。相反，掌握几种经过验证的程序和工具后，我们将了解到，就像在厨房里一样，如果你先洗蔬菜，你的食物会看起来更好、味道更好、更有益健康。如果你学会一些正确的刀工技巧，你的肉会更多汁，你的蔬菜会更均匀地烹饪。就像一位优秀的厨师会有自己喜欢的刀具和烹饪传统一样，一位优秀的数据科学家希望在尽可能最好的条件下使用尽可能最好的数据。\n\
  \n## 本书涵盖内容\n\n第 1 章《为什么需要干净的数据？》通过展示数据清洗在整体数据科学流程中的核心作用来激发我们对干净数据的追求。我们随后用一个简单示例展示来自真实数据集的一些脏数据。我们权衡每种潜在清洗过程的利弊，然后描述如何向他人传达我们的清洗变更。\n\
  \n第 2 章《基础 – 格式、类型和编码》建立了一些关于文件格式、压缩和数据类型的基础知识，包括缺失和空数据以及字符编码。每个部分都有来自真实数据集的示例。本章很重要，因为我们将在整本书中依赖这些基本概念的知识。\n\
  \n第 3 章《干净数据的 workhorses – 电子表格和文本编辑器》描述了如何从两种常见工具——文本编辑器和电子表格中获得最大的数据清洗效用。我们将介绍常见问题的简单解决方案，包括如何使用函数、查找替换和正则表达式来纠正和转换数据。在本章结束时，我们将使用这两种工具来清洗一些关于大学的真实数据，以检验我们的技能。\n\
  \n\n\n*第4章，说通用语 – 数据转换，* 重点介绍将数据从一种格式转换为另一种格式。这是数据清理中最重要的任务之一，拥有多种工具来轻松完成此任务非常有用。我们首先逐步进行每种不同的转换，包括在常见格式之间相互转换，例如逗号分隔值（CSV）、JSON\
  \ 和 SQL。为了将我们新的数据转换技能付诸实践，我们完成了一个项目，其中我们下载了一个 Facebook 好友网络并将其转换为几种不同的格式，以便我们可视化其形状。\n\
  \n*第5章，从网络收集和清理数据，* 描述了三种在 HTML 页面中清理数据的方法。本章介绍了三种从标记文本中提取数据元素的流行工具，并提供了理解除此处所示特定工具之外的其他方法的概念基础。作为本章的项目，我们构建了一套清理程序，用于从基于网络的讨论论坛中提取数据。\n\
  \n*第6章，清理 PDF 文件中的数据，* 介绍了几种应对数据清理人员最顽固且最常见的挑战的方法：提取存储在 Adobe 便携式文档格式（PDF）文件中的数据。我们首先检查完成此任务的低成本工具，然后尝试一些入门门槛低的工具，最后，我们尝试\
  \ Adobe 付费软件本身。正如我们一直所做的那样，我们的实验使用真实数据，这为我们在遇到问题时学习如何解决提供了丰富的经验。\n\n*第7章，RDBMS 清理技术，*\
  \ 使用一个公开可用的推文数据集来演示清理存储在关系数据库中的数据的众多策略。所示数据库是 MySQL，但许多概念，包括基于正则表达式的文本提取和异常检测，也很容易适用于其他存储系统。\n\
  \n*第8章，共享干净数据的最佳实践，* 描述了一些策略，使你的辛苦工作尽可能易于他人使用。即使你从不打算与他人分享你的数据，本章中的策略也会帮助你在自己的工作中保持井然有序，从而在未来节省时间。本章介绍了如何以多种格式创建理想的数据包，如何记录你的数据，如何为你的数据选择并附加许可证，以及如何宣传你的数据，以便在你选择时它能够持续存在。\n\
  \n*第9章，Stack Overflow 项目，* 指导你使用真实数据集完成一个完整的项目。我们首先提出一组关于该数据集的真实问题。在回答这些问题时，我们将完成\
  \ *第1章，为什么需要干净的数据？* 中介绍的整个数据科学流程，并将实践在前几章中学到的许多清理流程。此外，由于该数据集非常庞大，我们将介绍一些处理测试数据集创建的新技术。\n\
  \n第10章，Twitter 项目， 是一个完整的项目，展示了如何执行目前最热门且变化最快的 数据收集和清理任务之一：挖掘 Twitter。我们将展示如何在遵守\
  \ Twitter 服务使用法律限制的同时，找到并收集有关现实世界当前事件的公开推文存档。我们将在学习如何从 JSON 中清理和提取数据时回答有关数据集的一个简单问题，JSON\
  \ 目前是使用 API 访问的网络数据中最流行的格式。最后，我们将设计一个简单的 数据模型，用于长期存储提取和清理后的数据，并展示如何生成一些简单的可视化。\n\
  \n## 本书所需\n\n要完成本书中的项目，你需要以下工具：\n\n- 一个网络浏览器、互联网访问和现代操作系统。浏览器和操作系统应该无关紧要，但能够访问命令行终端窗口是理想的（例如\
  \ OS X 中的终端应用程序）。在第5章，从网络收集和清理数据中，三项活动之一依赖于在 Chrome 浏览器中运行的基于浏览器的实用程序，因此如果你想完成此活动，请记住这一点。\n\
  - 一个文本编辑器，例如适用于 Mac OSX 的 Text Wrangler 或适用于 Windows 的 Notepad++。一些集成开发环境（IDE，例如\
  \ Eclipse）也可以用作文本编辑器，但它们通常具有许多你不需要的功能。\n- 一个电子表格应用程序，例如 Microsoft Excel 或 Google\
  \ 表格。在可能的情况下，提供了通用的示例，可以在这两种工具上使用，但在某些情况下，需要其中一种。\n- 一个 Python 开发环境以及安装 Python 库的能力。我推荐\
  \ Enthought Canopy Python 环境，可在此处获取：https://www.enthought.com/products/canopy/。\n\
  - 安装并运行的 MySQL 5.5+ 服务器。\n- 一个 Web 服务器（运行任何服务器软件）以及已安装的 PHP 5+。\n- 一个 MySQL 客户端界面，要么是命令行界面、MySQL\
  \ Workbench，要么是 phpMyAdmin（如果你已运行 PHP）。\n\n## 本书适合谁\n\n如果你正在阅读本书，我想你可能属于以下两类之一。一类是数据科学家群体，他们已经花费大量时间清理数据，但你希望做得更好。你可能对数据清理的繁琐感到沮丧，并正在寻找加快速度、提高效率或只是使用不同工具来完成工作的方法。在我们的厨房比喻中，你就是只需要磨练几项刀工技巧的厨师。\n\
  \n另一类是由从事数据科学工作但从未真正关心数据清理的人组成。但现在，你开始认为如果有清理流程，你的结果也许会更好。也许“垃圾进，垃圾出”这句老话开始显得过于真实。也许你有兴趣与他人分享你的数据，但你对自己生成的数据集的质量没有信心。凭借本书，你将获得足够的信心通过学习一些技巧并养成新习惯来“公开烹饪”，从而确保整洁干净的数据科学环境。\n\
  \n无论如何，本书将帮助你重新定义数据清理，使其不再是繁重工作的象征，而成为你质量、品味、风格和效率的标志。你应该具备一点编程背景，但不必精通。如同大多数数据科学项目一样，愿意学习和实验、健康的求知欲以及敏锐的细节关注度都非常重要且备受重视。\n\
  \n## 惯例\n\n在本书中，你会发现多种文本样式，用于区分不同类型的信息。以下是这些样式的一些示例及其含义说明。\n\n文本中的代码词、数据库表名、文件夹名、文件名、文件扩展名、路径名、虚拟\
  \ URL、用户输入和 Twitter 账号显示如下：“问题在于 open() 未准备好处理 UTF-8 字符。”\n\n代码块设置如下：\n\n```\nfor\
  \ tweet in stream:\n    encoded_tweet = tweet['text'].encode('ascii','ignore')\n\
  \    print counter, \"-\", encoded_tweet[0:10]\n    f.write(encoded_tweet)\n```\n\
  \n当我们希望引起你对代码块中特定部分的注意时，相关行或项目以粗体显示：\n\n```\nFirst name,birth date,favorite color,salary\n\
  \"Sally\",\"1971-09-16\",\"light blue\",129000\n\"Manu\",\"1984-11-03\",\"\",159960\n\
  \"Martin\",\"1978-12-10\",\"\",76888\n```\n\n任何命令行输入或输出都写成如下形式：\n\n```\ntar cvf\
  \ fileArchive.tar reallyBigFile.csv anotherBigFile.csv\ngzip fileArchive.tar\n```\n\
  \n新术语和重要词语以粗体显示。你在屏幕上看到的词语，例如在菜单或对话框中，会在文本中这样出现：“按住 Option 键并选择列中的文本。”\n\n![](img/9aa003afabe05fdb07da46ad71325de6_20_0.png)\n\
  \n警告或重要说明以如下框显示。\n\n![](img/9aa003afabe05fdb07da46ad71325de6_20_1.png)\n\n提示和技巧如下所示。\n\
