- pgno: 62
  md: "# Example two – converting a string into MySQL's date type\n\nFor this example,\
    \ let's look at a new table in the Enron schema: the table called `referenceinfo`.\
    \ This table shows the messages to which the other messages refer. For example,\
    \ the first entry in that table, with a `rfid` 2, contains the text of the e-mail\
    \ to which message 79 refers. The column is a string, and its data looks like\
    \ this (in part):\n\n```\n> From: Le Vine, Debi> Sent: Thursday, August 17, 2000\
    \ 6:29 PM> To: ISO Market Participants> Subject: Request for Bids - Contract for\
    \ Generation Under Gas> Curtailment Conditions>> Attached is a Request for Bids\
    \ to supply the California ISO with> Generation\n```\n\nThis is a very messy string!\
    \ Let's take on the job of extracting the date shown on the top line and converting\
    \ it into a MySQL date type, suitable for inserting into another table or for\
    \ performing some date math.\n\nTo do this, we will use the built-in `str_to_date()`\
    \ MySQL function. This function is a bit like `date_format()` that we saw earlier,\
    \ except that it's backwards. Here is a working example that will look for the\
    \ word `Sent:` and extract the following characters up to the `>` symbol and then\
    \ turn these characters into a real MySQL datetime data type:\n\n```\nSELECT\n\
    str_to_date(\n  substring_index(\n    substring_index(reference,' >',3),\n   \
    \ 'Sent: ',\n    -1\n  ),\n  '%W,%M %e, %Y %h:%i %p'\n)\nFROM referenceinfo\n\
    WHERE mid=79;\n```\n\nResult:\n\n```\n2000-08-17 18:29:00\n```\n\nNow we have\
    \ a datetime value that is ready for inserting into a new MySQL column or for\
    \ performing more date functions or calculations on it."
  merge: -1
  img_proc: true
- pgno: 63
  md: "# Example three – casting or converting MySQL string data to a decimal number\n\
    \nIn this example, let's consider how to convert numbers hiding inside a text\
    \ column into a format suitable for calculations.\n\nSuppose we were interested\
    \ in extracting the price for a barrel of oil (abbreviated bbl) from some e-mail\
    \ messages sent to Enron from a mailing list. We could write a query such that\
    \ every time we see the /bbl string in an e-mail message from a certain sender,\
    \ we look for the preceding dollar sign and extract the attached numeric value\
    \ as a decimal number.\n\nHere is a sample snippet from an e-mail message in the\
    \ Enron message table with a message ID (mid) of 270516, showing how the number\
    \ looks inside the string:\n\n```\nMarch had slipped by 51 cts at the same time\
    \ to trade at $18.47/bbl.\n```\n\nThe MySQL command to perform this string extraction\
    \ and conversion to a decimal is as follows:\n\n```\nSELECT convert(\n    substring_index(\n\
    \        substring(\n            body,\n            locate('$',body)+1\n     \
    \   ),\n        '/bbl',\n        1\n    ),\n    decimal(4,2)\n) as price\nFROM\
    \ message\nWHERE body LIKE \"%$%\" AND body LIKE \"%/bbl%\" AND sender =\n   \
    \ 'energybulletin@platts.com';\n```\n\nThe WHERE clause restrictions are added\
    \ so that we make sure we are only getting messages that have bbl oil prices in\
    \ them.\n\nThe convert() function is similar to cast() in MySQL. Most modern database\
    \ systems will have a way of converting data types into numbers like this."
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Type conversion at the file level


    In this section, we will show some common cases when data types will need to be
    manipulated at the file level.


    > This material really only applies to file types where there is an implicit typing
    structure, for example, spreadsheets and semi-structured data like JSON. We have
    no examples here that use delimited (text-only) flat files, as in a text file,
    all data is text data!


    # Example one – type detection and converting in Excel


    You may be familiar with type converting in Excel and similar spreadsheet applications
    via the cell formatting menu options. The typical procedure involves selecting
    the cells you want to change and using the drop-down menu located on the ribbon.


    ![](img/9aa003afabe05fdb07da46ad71325de6_64_0.png)


    Or, if that does not offer enough options, there is also the Format Cells dialogue,
    located in the format menu, which offers more granular control over the output
    of the conversion process.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/9aa003afabe05fdb07da46ad71325de6_65_0.png)


    The lesser-known istext() and isnumber() functions may also be useful in formatting
    data in Excel.


    ![](img/9aa003afabe05fdb07da46ad71325de6_65_1.png)


    These functions can be applied to any cell, and they return TRUE or FALSE depending
    on whether the data is text or not, or in the case of isnumber(), whether the
    number is really a number or not. Paired with a feature like conditional formatting,
    these two formulas can help you locate bad values or incorrectly typed values
    in small amounts of data.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Excel also has a few simple functions for manipulating strings into other data
    types, other than using the menus. The following figure shows the TEXT() function
    being used to convert a numeric date to a string version of that date in the yyyy-mm-dd
    format. In the formula bar, we type =TEXT(A4,"yyyy-mm-dd"), and the 36528 number
    is converted into 2000-01-03. The date string now appears in the format we specified.


    ![](img/9aa003afabe05fdb07da46ad71325de6_66_0.png)


    # Example two – type converting in JSON


    JSON, as a semi-structured text-based format, does not offer a lot of options
    in the way of formatting and data types. Recall from the JSON description earlier
    in this chapter that JSON objects are constructed as name-value pairs. The only
    options for formatting the value part of a name-value pair are a text string,
    a number, or a list. While it is possible to build JSON objects by hand—for example,
    by typing them out in a text editor—usually, we build JSON objects programmatically,
    either by exporting JSON from a database or by writing a small program to convert
    a flat text file into JSON.


    What happens if our program that is designed to generate JSON is flawed? Suppose
    the program gives us strings instead of numbers. This happens occasionally and
    it can have unintended consequences for any program designed to consume JSON.
    The following is an example showing some simple PHP code that is designed to generate
    JSON, which will later be read into D3 to build a graph.


    The PHP code to generate a JSON representation of a dataset from a database is
    straightforward. The sample code, as shown in the following example, connects
    to the Enron database, builds a query, runs the query, puts each part of the query
    result into an array, and then encodes the array values as JSON name-value pairs.
    Here is the code to build a list of dates and counts, just like the dates and
    counts we used in Chapter 1, Why Do You Need Clean Data?:


    ```

    <?php

    // connect to db

    $dbc = mysqli_connect(''localhost'',''username'',''password'',''enron'')

    ```'
  merge: -1
  img_proc: true
