    > Any advice for converting an existing database to UTF-8?

    > Because of the ubiquity of UTF-8 on the Web and its importance in accurately
    conveying information written in natural languages from around the world, we strongly
    recommend that you create new databases in a UTF-8 encoding scheme. It will be
    far easier to start off in a UTF-8 encoding than not.

    > However, if you have the tables already created in a non-UTF-8 encoding, but
    they are not yet populated with data, you will have to alter the table to a UTF-8
    encoding and change the character set of each column to a UTF-8 encoding. Then,
    you will be ready to insert UTF-8 data.

    > The hardest case is when you have a large amount of data already in a non-UTF-8
    encoding, and you want to convert it in place in the database. In this case, you
    have some planning to do. You''ll have to take a different approach depending
    on whether you can get away with running commands on a few tables and/or a few
    columns or whether you have a very long list of columns and tables to adjust.
    In planning this conversion, you should consult the documentation specific to
    your database system. For example, when performing MySQL conversions, there are
    solutions that use either the mysqldump utility or those that use a combination
    of SELECT, convert(), and INSERT. You will have to determine which of these is
    right for your database system.


    # Example three – handling UTF-8 encoding at the file level


    Sometimes, you will need to adjust your code to deal with UTF-8 data at file level.
    Imagine a simple program designed to collect and print web content. If the majority
    of web content is now UTF-8 encoded, then our program internals need to be ready
    to handle that. Unfortunately, many programming languages still need a little
    bit of coaxing in order to handle UTF-8 encoded data cleanly. Consider the following
    example of a Python 2.7 program designed to connect to Twitter using its API and
    write 10 tweets to a file:'
