    +   1234,Bugs_Bunny,male,en_US,296

    +   2456,Daffy_Duck,male,en_US,295

    +   3456,Minnie_Mouse,female,en_US,294

    +   ```

    +   5. Now, use find and replace to replace all the instances of a comma with
    a space. The result for the nodes section will be:

    +   ```

    +   *vertices 296

    +   1234 Bugs_Bunny male en_US 296

    +   2456 Daffy_Duck male en_US 295

    +   3456 Minnie_Mouse female en_US 294

    +   ```

    +   The result for the edges section will be:

    +   ```

    +   *edges

    +   1234 2456

    +   2456 9876

    +   2456 3456

    +   ```

    +   6. One last thing; use the find feature of the text editor to locate any of
    your Facebook friends who have an apostrophe in their name. Replace this apostrophe
    with nothing. Thus, Cap''n_Crunch becomes:

    +   ```

    +   1998988 Capn_Crunch male en_US 137

    +   ```

    +   This is now a fully cleaned, Pajek-formatted file.'
