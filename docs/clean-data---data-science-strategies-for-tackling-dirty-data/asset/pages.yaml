- pgno: 68
  md: "PHP includes similar functions for converting big integers to strings as well.\
    \ This can be useful when you have extremely large numbers but you need them to\
    \ be stored as string data for some reason, for example, when storing session\
    \ values or Facebook or Twitter user ID values.\n\nIf we do not control the PHP\
    \ code that is generating the JSON output—for example, if we are accessing the\
    \ JSON via an API and we don't have any control over its generation—then we'll\
    \ have to perform a conversion after the JSON has already been built. In this\
    \ case, we need to ask our D3 JavaScript code to coerce the strings into numbers\
    \ using a + operator on that data value. In this example, we have read the JSON\
    \ output and are preparing to build a graph. The numMsg value has been coerced\
    \ from a string to a number:\n\n```\nd3.json(\"counts.json\", function(d) {\n\
    \  return {\n    dateSent: d.dateSent,\n    numMsg: +d.numMsg\n  };\n}, function(error,\
    \ rows) {\n  console.log(rows);\n});\n```\n\n# If a null falls in a forest...\n\
    \nIn this section, we are going to dip our chef's ladle into the mysterious stew\
    \ of zeroes, empties, and nulls.\n\nWhat is the difference between these? Well,\
    \ as I mentioned stew, consider this illustration first. Imagine you have a top-of-the-line\
    \ stove in your fancy chef's kitchen, and on that stove, you are going to prepare\
    \ a pot of thick, hearty stew. Your sous chef asks you, \"How much stew is in\
    \ the pot?\". Take a look at these options:\n\n+   1. At the beginning of the\
    \ day, you observe that there is no pot on the stove. The question \"how much\
    \ stew is in the pot?\" is unanswerable. There is no pot! The answer is not a\
    \ positive value, it is not a zero value, and it is not even empty. The value\
    \ is NULL.\n+   2. A few hours later, after much cleaning and chopping, you look\
    \ in the pot and see three liters of delicious stew. Great; you now have an answer\
    \ to the question. In this case, our answer is a data value of 3."
