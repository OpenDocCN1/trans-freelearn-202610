- pgno: 181
  md: 'Depending on what we plan to do with the data, we might not want to leave out
    the ? character, for example, if we are performing word counting or text mining,
    it may be very important that we convert I?ll to I’ll and University?s to University''s.
    If we decide that this is important, then our job is to detect the tweets, where
    this error happened, and then devise a strategy to convert the question mark back
    to a single quote. The trick, of course, is that we cannot just replace every
    question mark in the tweet_text column with a single quote character, because
    some tweets have question marks in them that should be left alone.


    To locate the problem characters, we can run some SQL queries that attempts to
    locate the problems using a regular expression. We are interested in question
    marks that appear in odd places, such as with an alphabetic character immediately
    following them. Here is an initial pass at a regular SQL expression using the
    MySQL REGEXP feature. Running this will give us a rough idea of where the problem
    question marks might reside:


    ```

    SELECT id, tweet_text

    FROM sentiment140

    WHERE tweet_text

    REGEXP ''\\?[:alpha:]]+'' ;

    ```


    This SQL regular expression asks for any question mark characters that are immediately
    followed by one or more alphabetic characters. The SQL query yields six rows,
    four of which turn out to have odd question marks and two of which are **false
    positives**. False positives are tweets that matched our pattern but that should
    not actually be changed. The two false positives are tweets with IDs **234** and
    **2204**. These two included question marks as part of a legitimate URL. Tweets
    **139**, **224**, **613**, and **2086** are **true positives**, which means tweets
    that were correctly detected as anomalous and should be changed. All the results
    are shown in the following phpMyAdmin screenshot:


    | id | tweet_text |

    |---|---|

    | 139 | ?Obama Administration Must Stop Bonuses to AIG Ponzi Schemers ... http://bit.ly/2CUlg
    |

    | 224 | Life?s a bitch? and so is Dick Cheney. #p2 #bipart #lot #tcot #rhrs #GOP
    #DNC http://is.gd/DjyQ |

    | 234 | jQuery UI 1.6 Book Review - http://cfbloggers.org/?c=30631 |

    | 613 | Talk is Cheap: Bing that, I?ll stick with Google. http://bit.ly/XC3C8
    |

    | 2086 | Stanford University?s Facebook Profile is One of the Most Popular Official
    University Pages - http://tinyurl.com/p5b3fl |

    | 2204 | Learning jQuery 1.3 Book Review - http://cfbloggers.org/?c=30629 |'
  merge: -1
