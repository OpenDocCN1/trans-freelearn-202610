  md: "# Which paste sites are most popular?\n\nTo answer this first question, we\
    \ will generate a JSON representation of the paste site URLs and counts using\
    \ the clean_posts_urls and clean_comments_urls tables. This simple analysis will\
    \ help us find out which pastebin websites are popular in this Stack Overflow\
    \ data dump. The following PHP queries the database for the paste sites we have\
    \ prelisted in the $pastebins array and then performs a count of the matching\
    \ URLs from the posts and comments. It uses the test tables, so the numbers are\
    \ much smaller than they would be if we used the real tables:\n\n```\n<?php //\
    \ q1.php\n// connect to db\n$dbc = mysqli_connect('localhost', 'username', 'password',\n\
    \    'stackoverflow')\n    or die('Error connecting to database!' . mysqli_error());\n\
    $dbc->set_charset(\"utf8\");\n\n// these are the web urls we want to look for\
    \ and count\n$pastebins = array(\"pastebin\",\n    \"jsfiddle\",\n    \"gists\"\
    ,\n    \"jsbin\",\n    \"dpaste\",\n    \"pastie\");\n$pastebin_counts = array();\n\
    \nforeach ($pastebins as $pastebin)\n{\n    $url_query = \"SELECT count(id) AS\
    \ cp,\n        (SELECT count(id)\n        FROM clean_comments_urls\n        WHERE\
    \ url LIKE '%$pastebin%' ) AS cc\n        FROM clean_posts_urls\n        WHERE\
    \ url LIKE '%$pastebin%'\";\n    $query = mysqli_query($dbc, $url_query);\n  \
    \  if (!$query)\n        die (\"SELECT failed! [{$url_query}]\" . mysqli_error());\n\
    \    $result = mysqli_fetch_object($query);\n    $countp = $result->cp;\n    $countc\
    \ = $result->cc;\n    $sum = $countp + $countc;\n\n    array_push($pastebin_counts,\
    \ array('bin' => $pastebin,\n        'count' => $sum));\n}\n// sort the final\
    \ list before json encoding it\n// put them in order by count, high to low\nforeach\
    \ ($pastebin_counts as $key => $row)\n{\n```"
