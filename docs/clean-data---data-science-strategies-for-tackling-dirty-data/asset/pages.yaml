    # Which paste sites are popular in questions and which are popular in answers?


    Our second question was whether the pastebin URLs are more prevalent in question
    posts or answer posts. To start to develop this answer, we will run a series of
    SQL queries. The first query simply asks how many posts are in the clean_posts_urls
    table of each type, both questions and answers:


    ```

    ```sql

    SELECT tp.postTypeId, COUNT(cpu.id)

    FROM test_posts tp

    INNER JOIN clean_posts_urls cpu ON tp.Id = cpu.postid

    GROUP BY 1;

    ```

