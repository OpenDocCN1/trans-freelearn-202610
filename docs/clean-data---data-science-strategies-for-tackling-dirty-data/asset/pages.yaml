  md: "```\n$row[\"tweet_text\"],\n    $mentions\n))\n{\n    foreach ($mentions[0]\
    \ as $name)\n    {\n        $insert_query = \"INSERT into sentiment140_mentions\
    \ (id,\ntweet_id, mention) VALUES (NULL,\" . $row[\"id\"] . \",'$name')\";\n \
    \       echo \"<br />$insert_query\";\n        $insert_result = mysqli_query($dbc,\
    \ $insert_query);\n        // die if the query failed\n        if (!$insert_result)\n\
    \            die (\"INSERT failed! [$insert_query]\" .\nmysqli_error());\n   \
    \ }\n}\n?>\n```\n\nAfter running this little script on the sentiment140 table,\
    \ we see that 124 unique user mentions have been extracted out of the 498 original\
    \ tweets. A few interesting things about this script include that it will handle\
    \ Unicode characters in usernames, even though this dataset does not happen to\
    \ have any. We can test this by quickly inserting a test row at the end of the\
    \ sentiment140 table, for example:\n\n```\nINSERT INTO sentiment140 (id, tweet_text)\
    \ VALUES (99999, \"This is a @ тест\");\n```\n\nThen, run the script again; you\
    \ will see that a row has been added to the sentiment140_mentions table, with\
    \ the @тест Unicode user mention successfully extracted. In the next section,\
    \ we will build a similar script to extract hashtags.\n\n# Extract hashtags\n\n\
    Hashtags have their own rules, which are slightly different to user mentions.\
    \ Here is a list of some of the rules we can use to determine whether something\
    \ is a hashtag:\n\n+   - Hashtags start with the # sign\n+   - The hashtag is\
    \ the word that immediately follows the # sign\n+   - Hashtags can have underscores\
    \ in them but no spaces and no other punctuation"
  merge: -1
  img_proc: true
- pgno: 189
  md: "The PHP code to extract hashtags into their own table is mostly identical to\
    \ the user mentions code, with the exception of the regular expression in the\
    \ middle of the code. We can simply change the $mentions variable to $hashtags,\
    \ and then adjust the regular expression to look like this:\n\n```\nif (preg_match_all(\n\
    \    \"/(#\\pL+)/iu\",\n    $row[\"tweet_text\"],\n    $hashtags\n))\n```\n\n\
    This regular expression says that we are interested in matching case-insensitive\
    \ Unicode letter characters. Then, we need to change our INSERT line to use the\
    \ correct table and column names like this:\n\n```\n$insert_query = \"INSERT INTO\
    \ sentiment140_hashtags (id, tweet_id, hashtag) VALUES (NULL,\" . $row[\"id\"\
    ] . \",'$name')\";\n```\n\nWhen we successfully run this script, we see that 54\
    \ hashtags have been added to the sentiment140_hashtags table. Many more of the\
    \ tweets have multiple hashtags, even more than the tweets that had multiple user\
    \ mentions, for example, we can see right away that tweets 174 and 224 both have\
    \ several embedded hashtags.\n\nNext, we will use this same skeleton script and\
    \ modify it again to extract URLs.\n\n# Extract URLs\n\nPulling out the URLs from\
    \ the text can be as simple as looking for any string that starts with http://\
    \ or https://, or it could get a lot more complex depending on what types of URLs\
    \ the text string includes, for example, some strings might include file:// URLs\
    \ or torrent links, such as magnet URLs, or other types of unusual links. In the\
    \ case of our Twitter data, we have it somewhat easier, as the URLs that were\
    \ included in our dataset all start with HTTP. So, we could be lazy and just design\
    \ a simple regular expression to extract any string that follows http:// or https://.\
    \ This regular expression would just look like this:\n\n```\nif (preg_match_all(\n\
    \    \"!https?://\\S+!\",\n    $row[\"tweet_text\"],\n    $urls\n))\n```"
  merge: -1
  img_proc: true
- pgno: 190
  md: "However, if we do a bit of hunting on our favorite search engine, it turns\
    \ out that we can easily find some pretty impressive and useful generic URL matching\
    \ patterns that will handle more sophisticated link patterns. The reason that\
    \ this is useful is that if we write our URL extraction to handle more sophisticated\
    \ cases, then it will still work if our data changes in the future.\n\nA very\
    \ well-documented URL pattern matching routine is given on the http:// daringfireball.net/2010/07/improved_regex_for_matching_urls\
    \ website. The following code shows how to modify our PHP code to use this pattern\
    \ for URL extraction in the Sentiment140 dataset:\n\n```\n```php\n<?php\n// connect\
    \ to db\n$dbc = mysqli_connect('localhost', 'username', 'password',\n    'sentiment140')\n\
    \    or die('Error connecting to database!' . mysqli_error());\n$dbc->set_charset(\"\
    utf8\");\n\n// pull out the tweets\n$select_query = \"SELECT id, tweet_text FROM\
    \ sentiment140\";\n$select_result = mysqli_query($dbc, $select_query);\n\n// die\
    \ if the query failed\nif (!$select_result)\n    die (\"SELECT failed! [$select_query]\"\
    \ . mysqli_error());\n\n// pull out the URLS, if any\n$urls = array();\n$pattern\
    \ = '#\\b(([\\\\w-]+://?|www[.] )[^\\s()<>]+(?:\\:[\\\\w\\d]+\\)|[^[:punc\nt:]\\\
    \\s|/]))#';\n\nwhile($row = mysqli_fetch_array($select_result))\n{\n    echo \"\
    <br/>working on tweet id: \" . $row[\"id\"];\n    if (preg_match_all(\n      \
    \  $pattern,\n        $row[\"tweet_text\"],\n        $urls\n    ))\n    {\n  \
    \      foreach ($urls[0] as $name)\n        {\n            echo \"<br/>---url:\
    \ \".$name;\n            $insert_query = \"INSERT into sentiment140_urls (id,\n\
    \            tweet_id, url)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 191
  md: "```\nVALUES (NULL,\" . $row[\"id\"] . \",\" ,'$name')\";\necho \"<br />$insert_query\"\
    ;\n$insert_result = mysqli_query($dbc, $insert_query);\n// die if the query failed\n\
    if (!$insert_result)\n    die (\"INSERT failed! [$insert_query]\" .\n    mysqli_error());\n\
    }\n}\n?>\n```\n\nThis program is nearly identical to the mention extracting program\
    \ we wrote earlier, with two exceptions. First, we stored the regular expression\
    \ pattern in a variable called $pattern, as it was long and complicated. Second,\
    \ we made small changes to our database INSERT command, just as we did for the\
    \ hashtag extraction.\n\nA full line-by-line explanation of the regular expression\
    \ pattern is available on its original website, but the short explanation is that\
    \ the pattern shown will match any URL protocol, such as http:// or file://, and\
    \ it also attempts to match valid domain name patterns as well and directory/file\
    \ patterns a few levels deep. The source website provides its own test dataset\
    \ too if you want to see the variety of patterns that it will match and a few\
    \ known patterns that will definitely not match.\n\n# Step eight – cleaning for\
    \ lookup tables\n\nIn the Step seven – Separate user mentions, hashtags, and URLs\
    \ section, we created new tables to hold the extracted hashtags, user mentions,\
    \ and URLs, and then provided a way to link each row back to the original table\
    \ via the id column. We followed the rules of database normalization by creating\
    \ new tables that represent the one-to-many relationship between a tweet and user\
    \ mentions, between a tweet and hashtags, or between a tweet and URLs. In this\
    \ step, we will continue optimizing this table for performance and efficiency.\n\
    \nThe column we are concerned with now is the query_phrase column. Looking at\
    \ the column data, we can see that it contains the same phrases repeated over\
    \ and over. These were apparently the search phrases that were originally used\
    \ to locate and select the tweets that now exist in this dataset. Of the 498 tweets\
    \ in the sentiment140 table, how many of the query phrases are repeated over and\
    \ over? We can use the following SQL to detect this:\n\n```\nSELECT count(DISTINCT\
    \ query_phrase)\nFROM sentiment140;\n```"
