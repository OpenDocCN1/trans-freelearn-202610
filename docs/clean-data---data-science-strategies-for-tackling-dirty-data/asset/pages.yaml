    \ is the Python code that corresponds to the outline of what we want from the\
    \ parse tree:\n\n```\nfrom bs4 import BeautifulSoup\nimport io\n\ninfile = io.open('django13-sept-2014.html',\
    \ 'r', encoding='utf8')\noutfile = io.open('django13-sept-2014.csv', 'a+', encoding='utf8')\n\
