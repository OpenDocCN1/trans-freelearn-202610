- pgno: 192
  md: 'The query result shows that there are only 80 distinct query phrases, but these
    are used over and over in the 498 rows.


    This may not seem like a problem in a table of 498 rows, but if we had an extremely
    large table, such as with hundreds of millions of rows, we should be concerned
    with two things about this column. First, duplicating these strings over and over
    takes up unnecessary space in the database, and second, searching for distinct
    string values is very slow.


    To solve this problem, we will create a **lookup table** of query values. Each
    query string will exist only once in this new table, and we will also create an
    ID number for each one. Then, we will change the original table to use these new
    numeric values rather than the string values that it is using now. Our procedure
    to accomplish this is as follows:


    +   1. Create a new lookup table:

    +   ```sql

    +   CREATE TABLE sentiment140_queries (

    +       query_id int(11) NOT NULL AUTO_INCREMENT,

    +       query_phrase varchar(25) NOT NULL,

    +       PRIMARY KEY (query_id)

    +   ) ENGINE=MyISAM DEFAULT CHARSET=utf8 AUTO_INCREMENT=1;

    +   ```

    +   2. Populate the lookup table with the distinct query phrases and automatically
    give each one a query_id number:

    +   ```sql

    +   INSERT INTO sentiment140_queries (query_phrase)

    +   SELECT DISTINCT query_phrase FROM sentiment140;

    +   ```

    +   3. Create a new column in the original table to hold the query phrase number:

    +   ```sql

    +   ALTER TABLE sentiment140

    +   ADD query_id INT NOT NULL AFTER query_phrase;

    +   ```

    +   4. Make a backup of the sentiment140 table in case the next step goes wrong.
    Any time we perform UPDATE on a table, it is a good idea to make a backup. To
    create a copy of the sentiment140 table, we can use a tool like phpMyAdmin to
    copy the table easily (use the Operations tab). Alternately, we can recreate a
    copy of the table and then import into it the rows from the original table, as
    shown in the following SQL:

    +   ```sql

    +   CREATE TABLE sentiment140_backup(

    +       polarity int(1) DEFAULT NULL,

    +       id int(5) NOT NULL,

    +       date_of_tweet varchar(30) CHARACTER SET utf8 DEFAULT NULL

    +       ,

    +       date_clean datetime DEFAULT NULL COMMENT ''holds clean,

    +       formatted date_of_tweet'',

    +   ```'
  merge: -1
