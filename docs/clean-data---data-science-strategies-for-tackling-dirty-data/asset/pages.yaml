- pgno: 81
  md: '# 3

    Workhorses of Clean Data – Spreadsheets and Text Editors


    When designing a home kitchen, the typical layout invokes the classic work triangle,
    the points of which are the refrigerator, sink, and stove. In our Clean Data kitchen,
    we have a few indispensable devices as well. Two of these are the humble **spreadsheet**
    and the **text editor**. Although these unpretentious tools are often overlooked,
    full knowledge of their features can make many cleaning tasks quicker and easier.
    In *Chapter 2, Fundamentals – Formats, Types, and Encodings*, we briefly introduced
    these two tools in the context of learning about data types and file types, but
    in this chapter, we are ready to dig deeper into:


    +   - Useful functions in Excel and Google Spreadsheets that can help us manipulate
    data, including text to columns, splitting and concatenating strings, searching
    and formatting to find unusual values, sorting, importing spreadsheet data into
    MySQL, and even generating SQL using a spreadsheet

    +   - Typical features of a text editor that can automatically extract and manipulate
    data into a more useful format, including searching and replacing with regular
    expressions, altering line beginnings and endings, and column-based editing

    +   - A small project where we use features of both of these tools to clean some
    real-world data'
