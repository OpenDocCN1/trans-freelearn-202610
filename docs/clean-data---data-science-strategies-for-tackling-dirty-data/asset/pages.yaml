- pgno: 203
  md: 'If you anticipate that your users will be regularly collecting your data files,
    you should be consistent in your use of a comment character for the header. In
    the preceding example, I used the # character. The reason for this is that your
    users may write a program to automatically download and parse your data, perhaps
    loading it in a database or using it in a program. Your consistent use of a comment
    character will allow the user to skip the headers and not process them.


    # Data models and diagrams


    If you are distributing SQL files to build a database, or if you are providing
    live access to a database for querying, you might find that a visual diagram,
    such as an **entity-relationship diagram (ERD)**, will really help your users.


    In some of my own projects, I like to provide both a textual description of the
    tables, such as with the headers and README files previously described, but also
    a visual diagram of the tables and the relationships between them. Because the
    databases I distribute are extremely large, I also colorize my diagrams, and I
    annotate each part of the diagram to indicate what is inside that part of the
    database.


    The following screenshot shows a high-level overview of what one of my large diagrams
    looks like. It is zoomed out to show the size of the ERD:


    ![](img/9aa003afabe05fdb07da46ad71325de6_203_0.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'Since this ERD is a bit overwhelming and hard to read, even on a large monitor,
    I have colorized each separate section of the database and I have provided notes
    where needed. The following is a screenshot of a closer view of the orange section
    from the upper left of the big figure:


    ![](img/9aa003afabe05fdb07da46ad71325de6_204_0.png)


    A close-up view of one of the database sections, including notes describing the
    purpose of the tables.


    By reading this diagram, the user gets a nice overview of how the different sections
    of the database fit together. Importantly, high-level notes are shown directly
    on the diagram, and when the user wants more detailed information about a particular
    field, they can refer to the README file or the header inside that particular
    file.


    To create an ERD, you can use any number of RDBMS tools, including MySQL Workbench
    (this is the one I used to create the colorized version you see here). Other popular
    tools include Microsoft Visio, Sparx Enterprise Architect, and draw.io. Many of
    these tools will allow you to connect to your RDBMS and reverse-engineer a diagram
    from an existing database, or forward-engineer SQL statements from a drawing.
    In either case, the ERD will certainly help your users understand the data model
    better.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Documentation wiki or CMS


    Another way to keep all the documentation for a project organized is to publish
    it to a wiki or to a content management system (CMS). There are hundreds of CMS
    and wiki software packages available for this purpose, but popular options include
    MediaWiki, WordPress, Joomla!, and Drupal. GitHub also has a wiki service for
    projects hosted there, as do some of the other software hosting services, such
    as Sourceforge and Bitbucket.


    You can use a CMS or wiki to provide the download links to your files themselves,
    and you can use the CMS to post documentation and explanations. I have also used
    a CMS in my own work to host a blog of updates, visualizations showing example
    graphs, charts built with the data, and also a repository for scripts that my
    users might find helpful to work with my data.


    Here are some common sections that most data-oriented projects included in a documentation
    CMS or wiki:


    +   - **About the project** — This tells the users what the purpose of the data
    project is and how to contact the project leaders. This section may also include
    ideas for how to get involved, how to join a mailing list or discussion area,
    or how to contact the project principals.

    +   - **Getting the data** — This explains the different mechanisms to access
    the data. Common choices will include direct database access, file downloads,
    or an API. This section also explains any special signup or login procedures.

    +   - **Using the data** — This includes starter queries, usage examples, graphics
    built with the data, and diagrams and ERDs. It provides links to things other
    people have done with the data. This section also explains, again if necessary,
    your expectations for the citation of the data and any licensing policies.


    In this section, we discussed a variety of ways to document our data, including
    READMEs, file headers, ERDs, and web-based solutions. Throughout this discussion,
    we mentioned the concept of licensing the data and explaining your expectations
    to cite and share the data. In the next section, we delve deeper into the particulars
    of licensing your datasets.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Setting terms and licenses for your data


    An important part of any plan for data distribution is deciding the expectations
    you have for how your users will cite, share, or remix your data. The list of
    expectations for how you want users to work with your data is called the data''s
    **Terms of Use** (**ToU**). The ToU may also give the users specific rights, such
    as the ability to make changes or redistribute the data. This collection of rights
    that you grant to the users is called the **data license**. Users can choose to
    use your dataset—or not—based on whether they agree to abide by its ToU. They
    can also decide to use the data based on whether what they want to do with the
    data has been allowed by its license.


    In this section, we will outline a few choices you can make for how to set expectations
    for how users should interact with your data. We will also review some of the
    most common items you may wish to include in the ToU, as well as some of the more
    common pre-made licenses that can be applied to your datasets.


    # Common terms of use


    Not everyone has the same goals in sharing their data, for example, I am part
    of a project where the specific goal is to collect, clean, and redistribute data
    for the scientific community. Because I am a college professor, part of my work
    responsibility is to publish academic research papers, software, and datasets
    that are useful to others. Therefore, it is important to me that people cite my
    papers and published datasets when they are used. However, one of my other friends,
    who is not an academic, routinely publishes datasets completely anonymously, and
    with no expectation for citation or notification when that data is used.


    Here is a list of common considerations when setting expectations for the use
    of your data:


    +   - **Citations** – Do you want people who publish something based on your data
    to state clearly that they got the data from you? If so, what URL or reference
    should they use?

    +   - **Privacy** – Do you have any rules about protecting the privacy of your
    users or their information? Do you want your users to abide by any particular
    privacy guidelines or research guidelines? For example, some people ask that users
    follow similar procedures to those they followed with their own **Institutional
    Research Boards (IRB)** or other research ethics groups (for example, the **Association
    of Internet Researchers (AOIR)**).'
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   - **Appropriate uses for the data** – Do you suspect that your dataset
    could be misused in some way? Could the data be taken out of context? Could its
    contents be combined with other datasets in a harmful way? For some projects,
    it would be a very good idea to set expectations for your users for how they can
    use the data you are providing.

    +   - **Contact** – Do you have a particular way that you want the users of the
    data to notify you if they are using the data? Do they need to notify you at all?
    Guidelines for how and why to contact you, as the dataset provider, are helpful
    if you anticipate users having questions or concerns about the data.


    As we discussed earlier in the *Documenting your data* section of this chapter,
    the ToU for a dataset can be made available to the potential users inside a README
    file, inside file headers, or on a website. If you are providing live database
    access, you may also notify your potential users that, by accepting a username
    and password for the database system, they are agreeing to abide by your terms.
    A similar structure can be used for API access as well, where actively using an
    authentication token or access credentials indicates the user is in agreement
    with your ToU.


    Of course, all of these best practices are subject to the laws and policies of
    various international states and organizations. It can be very complicated to
    try to get all of this correct without a little help. To assist data providers
    in setting expectations for their users, a few generic licensing schemes have
    emerged over time. We will discuss two of these now:


    # Creative Commons


    **Creative Commons (CC)** licenses are prepackaged, generic sets of rules that
    providers of copyrighted, or copyrightable, materials can apply to their works.
    These licenses set out what the users of the works are allowed to do. By stating
    the license up front, the owner of the work can avoid having to grant individual
    licenses to every single person that wants to change or redistribute a particular
    work.


    The issue with CC—and this might not be an issue for you at all, depending on
    what you are doing with it—is that CC licenses are intended to be applied to copyrightable
    work. Is your database or dataset copyrightable? Are you interested in licensing
    the contents of the database, or the database itself? To help you answer that
    question, we will point you to the Creative Commons wiki, which addresses all
    the considerations for this question in greater detail than we can hope to do
    here. This page even has a frequently asked questions section specifically about
    data and databases: https://wiki.creativecommons.org/Data.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# ODbL and Open Data Commons


    Another good choice to license data is the **Open Database License (ODbL)**. This
    is a license that has been generically designed for databases. The **Open Knowledge
    Foundation (OKF)** has created a two-minute guide to deciding how to open your
    data, which you can find here: http://OpenDataCommons.org/guide/.


    If you want even more choice, the http://OpenDefinition.org website, also part
    of the OKF, gives a selection of even more prepackaged licenses that you can apply
    to your dataset. These range from very open public domain-style licenses, all
    the way to licenses that require attribution and sharing of derivative works.
    In addition, they provide an Open Data Handbook, which is extremely helpful at
    walking you through the process of thinking about the intellectual property in
    your database or dataset and what you want to do with it. You can download the
    Open Data Handbook or browse it online here: http://OpenDataHandbook.org.


    # Publicizing your data


    Once you have a complete data package, it is time to tell the world about it.
    Publicizing the existence of your data will ensure its use by the most people
    possible. If you already have a user community in mind for your data, publicizing
    it may be as simple as sending out a URL on a mailing list or to a specific research
    group. Sometimes, though, we create a dataset that we think might be interesting
    to a larger, more amorphous group.


    # Lists of datasets


    There are many lists of data collections available on the Web, most of which are
    organized around some kind of theme. The publishers of these types of meta-collections
    (collections of collections) are usually more than happy to list new sources of
    data that fit into their niche. Meta-collection themes can include:


    +   - Datasets related to the same topic, for example, music data, biological
    data, or collections of articles on news stories

    +   - Datasets related to solving the same type of problem, for example, datasets
    that can be used to develop recommender systems or datasets used to train machine
    learning classifiers

    +   - Datasets related to a particular technical issue, for example, datasets
    that are designed to benchmark or test a particular software or hardware design

    +   - Datasets designed for use in particular systems, for example, datasets that
    are optimized for learning a programming language such as R, a data visualization
    service such as Tableau, or a cloud-based platform such as Amazon Web Services'
  merge: -1
  img_proc: true
- pgno: 209
  md: '+   - Datasets that all have the same type of license, for example, by listing
    only sets of public domain data or only data that has been cleared for academic
    research


    If you find that your datasets are not well represented on any of these lists,
    or do not fit the requirements of the existing meta-collections, another option
    is to start your own data repository.


    # Open Data on Stack Exchange


    The Open Data area on Stack Exchange, found at http://opendata.stackexchange.com,
    is a collection of questions and answers relevant to open datasets. There have
    been many instances where I have found interesting datasets here, and other times
    I have been able to show other people how to answer a question using one of my
    own datasets. This Q&A website is also a great way to learn what kinds of questions
    people have, and what kind of formats they like for the data they want to use.


    Before advertising your data as a solution to someone''s problem on Stack Exchange,
    be sure that your access methods, documentation, and licenses are up to standard
    using the guidelines we discussed previously in this chapter. This is especially
    important on Stack Exchange, since both questions and answers can be down-voted
    by users. The last thing you want to do is try to publicize your data with a bunch
    of broken links and confusing documentation.


    # Hackathons


    Another fun way to get people involved with your data is to publicize it as a
    usable dataset for a hackathon. Data hackathons are usually day-long or multiday
    events where programmers and data scientists come together to practice different
    techniques on datasets, or to solve a particular class of problem using data.


    A simple search engine query for data hackathon will show you what the focus of
    the current crop of hackathons is. Some of them are sponsored by companies, and
    some are designed to respond to social problems. Most of them have a wiki or some
    other method to add your URL and a brief description of the data to the list of
    datasets that can be used on the day of the hackathon. I hesitate to recommend
    a particular one, since the very nature of a hackathon is to happen once and then
    morph and change into something else. They also tend to be held at irregular times
    and be organized by ad hoc groups.'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'If your dataset is designed with an academic purpose in mind, for example,
    if it is a research dataset, you might consider hosting your own hackathon during
    the workshops or poster sessions of an academic conference. This is an excellent
    way to get people engaged in manipulating your data, and at the very least, you
    may get some good feedback from the people at the conference for ways to improve
    your data, or what datasets they think you should build next.


    # Summary


    In this chapter, we looked at a wide variety of possibilities to share our cleaned
    data. We discussed various solutions and tradeoffs for different ways of packaging
    and distributing our data. We also reviewed the basics of providing documentation,
    including the most important things that your users need to know and how to communicate
    those items in a documentation file. We noticed that licenses and terms of use
    nearly always appear in documentation, but what do they mean and how should you
    choose one for your data? We reviewed some common terms of use for data projects,
    as well as the most common licensing schemes: Creative Commons, and ODbL. Finally,
    we brainstormed some ways for you to publicize your data, including data meta-collections,
    the Open Data Stack Exchange site, and data-centric hackathons.


    At this point in the book, you have seen a complete beginning-to-end overview
    of data cleaning. The next two chapters consist of longer, more detailed projects
    that will give you some more practical exposure to data cleaning tasks using the
    skills we learned earlier in the book.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 9


    # Stack Overflow Project


    This is the first of two full, chapter-length projects where we will put everything
    we have learned about data cleaning into practice. We can think of each project
    as a dinner party where we show off our best skills from our data science kitchen.
    To host a successful dinner party, we should of course have our menu and guest
    list planned in advance. However, the mark of a true expert is how we react when
    things do not go exactly according to plan. We have all had that moment when we
    forget to buy an important ingredient, despite our carefully prepared recipes
    and shopping lists. Will we be able to adjust our plan to meet the new challenges
    we meet along the way?


    In this chapter, we will tackle some data cleaning using the publicly-released
    Stack Overflow database dump. Stack Overflow is part of the Stack Exchange family
    of question-and-answer websites. On these sites, writing good questions and answers
    can earn a user points and badges that accumulate over time. To practice our data
    cleaning skills, we will use the same six-step method we introduced back in *Chapter
    1, Why Do You Need Clean Data?*.


    +   - Decide what kind of problem we are trying to solve — why are we looking
    at this data?

    +   - Collect and store our data, which consists of downloading and extracting
    the data dump provided by Stack Overflow, creating a MySQL database to hold the
    data, and writing scripts to import the data into the MySQL database. Because
    the Stack Overflow dataset is so massive, we will also create some smaller test
    tables, filled with randomly selected rows.

    +   - Perform some trial cleaning tasks on the test tables before attempting to
    clean the entire dataset.

    +   - Analyze the data. Do we need to perform any calculations? Should we write
    some aggregate functions to count or sum the data? Do we need to transform the
    data in some way?'
  merge: -1
  img_proc: true
- pgno: 212
  md: '+   - Provide visualizations of the data, if possible.

    +   - Resolve the problem we set out to investigate. Did our process work? Were
    we successful?


    That is a lot of work, but the more we prepare in advance and the earlier we start,
    the more likely we will be able to call our data science dinner party a success.


    # Step one – posing a question about Stack Overflow


    To start our project, we need to pose a reasonably interesting question that requires
    some simple data analysis to answer. Where should we begin? First, let''s review
    what we know about Stack Overflow. We know that it is a question-and-answer website
    for programmers, and we can assume that programmers probably use a lot of source
    code, error logs, and configuration files in the questions they are asking and
    answering. Furthermore, we know that sometimes posting these kinds of long text
    dumps on a web-based platform like Stack Overflow can be awkward because of line
    lengths, formatting, and other readability issues.


    Seeing so many questions and answers with frustratingly large amounts of text
    made me wonder whether programmers on Stack Overflow ever link to their code or
    log files through an external paste site such as Pastebin or JSFiddle, for example
    http://www.Pastebin.com is a website where you can paste in large amounts of text,
    such as source code or a log file, and the site gives you back a short URL that
    you can share with others. Most paste sites also allow for source code syntax
    highlighting, which Stack Overflow does not do by default.


    Using paste sites is very common on IRC and e-mail, but what about on Stack Overflow?
    On one hand, just like in IRC or e-mail, providing a link could make a question
    or an answer shorter, and therefore the rest of the question is much easier to
    read. But on the other hand, depending on the paste site being used, the URL is
    not guaranteed to be functional forever. This means that a question or an answer
    could lose its value over time due to link rot.


    Tools like JSFiddle complicate this issue in one additional way. On an interactive
    paste site like JSFiddle, not only can you paste in your source code and get a
    URL for it, but you can also allow others to edit and run the code right in the
    browser. This could be extremely helpful in a question-and-answer scenario on
    Stack Overflow, especially in a browser-based language like JavaScript. However,
    the issue of link rot still exists. Additionally, JSFiddle is a little trickier
    to use for beginners than a simple code dump site like Pastebin.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/9aa003afabe05fdb07da46ad71325de6_213_0.png)


    JSFiddle has four windows, one each for HTML, CSS, JavaScript, and the result.


    > In the community discussion area for Stack Overflow, there has been quite a
    bit of debate about whether paste sites should be used at all, and what the policy
    should be for questions or answers that include paste site links and no actual
    code. In general, even though people tend to agree that a paste site can be useful,
    they also recognize that it is important to protect the longevity and utility
    of Stack Overflow itself. The community has decided that posting questions or
    answers with only links and no code should be avoided. A good place to start if
    you want to recap that discussion is this link: http://meta.stackexchange.com/questions/149890/.


    For our purposes here, we do not need to choose sides in this debate. Instead,
    we can just ask some simple data-driven questions like:


    +   1. How frequently do people use tools like Pastebin and JSFiddle (and other
    similar paste sites) on Stack Overflow?

    +   2. Do they use paste sites more in questions or in answers?

    +   3. Do posts that reference a paste site URL tend to also include source code;
    if so, how much?


    We can use these questions for our motivation as we collect, store, and clean
    our Stack Overflow data. Even if it turns out that some of these questions are
    too hard or impossible to answer, remembering what our overall purpose is will
    help direct the type of cleaning we need to do. Keeping our questions in the forefront
    of our minds will stop us from getting too far off track or performing tasks that
    will turn out to be pointless or a waste of time.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Step two – collecting and storing the Stack Overflow data


    At the time of writing, Stack Exchange provides the data for their entire family
    of websites – including Stack Overflow – as XML files free for anyone to download.
    In this section, we will download the Stack Overflow files, and import the data
    into a database on our MySQL server. Finally, we will create a few smaller versions
    of these tables for testing purposes.


    # Downloading the Stack Overflow data dump


    All the data available from Stack Exchange can be downloaded at the Internet Archive.
    The September 2014 dump is the latest one available at the time of writing. Each
    Stack Exchange site has one or more files for it, each of which is linked to this
    details page: https://archive.org/details/stackexchange.


    We are only interested in the eight Stack Overflow files that appear alphabetically
    as shown in the following list:


    |  |  |

    |---|---|

    | stackoverflow.com-Badges.7z | 77.8 MB |

    | stackoverflow.com-Comments.7z | 1.8 GB |

    | stackoverflow.com-PostHistory.7z | 9.4 GB |

    | stackoverflow.com-PostLinks.7z | 26.4 MB |

    | stackoverflow.com-Posts.7z | 5.7 GB |

    | stackoverflow.com-Tags.7z | 508.1 KB |

    | stackoverflow.com-Users.7z | 100.5 MB |

    | stackoverflow.com-Votes.7z | 385.0 MB |


    Archive.org listing showing the eight Stack Overflow files we are interested in.


    For each file in the list, right-click the link and direct your browser to save
    the file to disk.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Unarchiving the files


    Notice that each file has a .7z extension. This is a compressed archive format.
    It can be uncompressed and unarchived using the matching 7-Zip software, or another
    compatible software package. 7-Zip was not one of the more common file archivers
    that we discussed in *Chapter 2, Fundamentals – Formats, Types, and Encodings*
    and you may not already have a compatible unarchiver installed on your computer,
    so we can consider this our first small wrinkle that we need to work around. Try
    double-clicking on the file to open it, but if you have no installed software
    associated with the .7z extension, you will need to install an appropriate 7-Zip
    unarchiver.


    +   - For Windows, you can download the 7-Zip software from their website:

    +     `http://www.7-zip.org`

    +   - For Mac OS X, you can download and install The Unarchiver, a no-cost utility
    available at `http://unarchiver.c3.cx`


    Once you have the software installed, unpack each file in turn. The uncompressed
    files are quite large, so make sure you have disk space that is large enough to
    hold them.


    > > On my system right now, comparing the compressed to uncompressed file sizes
    shows that the uncompressed versions are about ten times larger than the compressed
    versions. These files also take several minutes each to unarchive, depending on
    the specifications of the system you are working on, so set aside time for this
    step.


    # Creating MySQL tables and loading data


    We now have eight .xml files, each of which will map to one table in the database
    we are about to build. To create the database and tables, we could either point
    and click our way through it using phpMyAdmin or some other graphical tool, or
    we can run the following simple SQL written by Georgios Gousios and available
    at `https://gist.github.com/gousiosg/7600626`. This code includes `CREATE` and
    `LOAD INFILE` statements for the first six tables, but since this script was written,
    the database dump has had two additional tables added to it.


    To build the new table structure, we can run the `head` command in our Terminal
    window or shell in order to inspect the first few lines of this file. From Terminal,
    run it on the smallest of the XML files, `PostLinks.xml`, as follows:


    ```

    head PostLinks.xml

    ```'
  merge: -1
  img_proc: true
