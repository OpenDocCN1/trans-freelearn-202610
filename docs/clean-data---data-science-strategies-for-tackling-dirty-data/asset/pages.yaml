- pgno: 124
  md: '![](img/9aa003afabe05fdb07da46ad71325de6_124_0.png)


    > The word *pajek* means *spider* in Slovenian. A social network can be thought
    of as a web made up of nodes and the links between them.


    The format of our Facebook GDF file converted to a Pajek file looks like this:


    ```

    *vertices 296

    1234 Bugs_Bunny male en_US 296

    2456 Daffy_Duck male en_US 295

    9876 Minnie_Mouse female en_US 294

    *edges

    1234 2456

    2456 9876

    2456 3456

    ```


    Here are a few important things to notice right away about this Pajek file format:


    +   - It is space-delimited, not comma-delimited.

    +   - Just like in the GDF file, there are two main sections of data, and these
    are labeled, starting with an asterisk *. The two sections are the vertices (another
    word for nodes) and the edges.

    +   - There is a count of how many total vertices (nodes) there are in the file,
    and this count goes next to the word vertices on the top line.

    +   - Each person''s name has spaces removed and replaced with underscores.

    +   - The other columns are optional in the node section.


    To convert our GDF file into Pajek format, let''s use the text editor, as these
    changes are fairly straightforward and our file is not very large. We will perform
    the data cleaning tasks as follows:


    +   1. Save a copy of your GDF file as a new file and call it something like fbPajek.net
    (the .net extension is commonly used for Pajek network files).

    +   2. Replace the top line in your file. Currently, it looks like this:


    ```

    nodedef>name VARCHAR,label VARCHAR,sex VARCHAR,locale VARCHAR,agerank INT

    ```


    You will need to change it to something like this:


    ```

    *vertices 296

    ```


    Make sure the number of vertices matches the number you have in your actual file.
    This is the count of nodes. There should be one per line in your GDF file.'
  merge: -1
  img_proc: true
- pgno: 125
