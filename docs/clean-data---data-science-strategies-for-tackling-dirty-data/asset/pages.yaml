- pgno: 108
  md: "The process to export the results of a query is very similar, except that instead\
    \ of using the Export tab on the top of the screen, run the SQL query and then\
    \ use the Export option under Query results operations at the bottom of the page,\
    \ shown as follows:\n\n![](img/9aa003afabe05fdb07da46ad71325de6_108_0.png)\n\n\
    PhpMyAdmin can export the results of a query as well\n\nHere is a simple query\
    \ we can run on the employeelist table to test this process:\n\n```\n```sql\n\
    SELECT concat(firstName, \" \", lastName) as name, email_id\nFROM employeelist\n\
    ORDER BY lastName;\n```\n```\n\nWhen we export the results as JSON, phpMyAdmin\
    \ shows us 151 values formatted like this:\n\n```\n```json\n{\n  \"name\": \"\
    Lysa Akin\",\n  \"email_id\": \"lysa.akin@enron.com\"\n}\n```\n```\n\nThe phpMyAdmin\
    \ tool is a good one, and it is effective for converting moderate amounts of data\
    \ stored in MySQL, especially as the results of a query. If you are using a different\
    \ RDBMS, your SQL interface will likely have a few formatting options of its own\
    \ that you should explore.\n\nAnother strategy is to bypass phpMyAdmin entirely\
    \ and just use your MySQL command line to write out a CSV file that is formatted\
    \ the way you want:\n\n```\n```sql\nSELECT concat(firstName, \" \", lastName)\
    \ as name, email_id\nINTO OUTFILE 'enronEmployees.csv'\nFIELDS TERMINATED BY ','\
    \ OPTIONALLY ENCLOSED BY '\"'\nLINES TERMINATED BY '\\n'\nFROM employeelist;\n\
    ```\n```\n\nThis will write a comma-delimited file with the name specified (employees.csv).\
    \ It will be written into the current directory."
