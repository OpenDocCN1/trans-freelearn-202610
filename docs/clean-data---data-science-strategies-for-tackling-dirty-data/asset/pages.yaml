    \n    # access each user mentioned in tweet\n    userdict = tweetdict['entities']['user_mentions']\n\
    \    for mention in userdict:\n        tuserid = mention['id']\n        tscreen\
    \ = mention['screen_name']\n        tname   = mention['name']\n\n        try:\n\
    \            cursor.execute(u\"INSERT IGNORE INTO\n    ferguson_tweets_mentions(tid,\
    \ tuserid, tscreen, tname)\n    VALUES (%s, %s, %s, %s)\", (tid,tuserid,tscreen,tname))\n\
    \            db.commit()\n        except MySQLdb.Error as error:\n           \
    \ print(error)\n    # disconnect from server\n    db.close()\n```\n\nFor more\
    \ information on each of the fields provided in the JSON representation of a tweet,\
    \ the Twitter API documentation is very helpful. The sections on Users, Entities,\
    \ and Entities in Tweets are particularly instructive when planning which fields\
    \ to extract from the JSON tweet. You can get started with the documentation at\
    \ https://dev.twitter.com/overview/api/.\n\nOnce this script is run, the four\
    \ tables are populated with data. On my MySQL instance, after running the preceding\
    \ script against my ids_1000.txt file, I ended up with 893 rows in the tweets\
    \ table; 1,048 rows in the hashtags table; 896 rows in the user mentions table;\
    \ and 371 rows in the URLs table. If you have fewer rows here or there, check\
    \ to see whether it is because tweets have been deleted.\n\n# Step four – simple\
    \ data analysis\n\nSuppose we want to learn which web domains were linked the\
    \ most in the Ferguson dataset. We can answer this question by extracting just\
    \ the domain portion of the URL stored in the tdisplay column in our ferguson_tweets_urls\
    \ table. For our purposes, we will consider everything before the first slash\
    \ (/) as the interesting part of the URL."
  merge: -1
  img_proc: true
- pgno: 252
  md: "The following SQL query gives us the domain and count of posts that reference\
    \ that domain:\n\n```\nSELECT left(tdisplay,locate('/',tdisplay)-1) as url,\n\
    \    count(tid) as num\n    FROM ferguson_tweets_urls\n    GROUP BY 1 ORDER BY\
    \ 2 DESC;\n```\n\nThe result of this query is a dataset that looks something like\
    \ the following (run on the sample set of 1,000 rows):\n\n| url | num |\n|---|---|\n\
    | bit.ly | 47 |\n| wp.me | 32 |\n| dlvr.it | 18 |\n| huff.to | 13 |\n| usat.ly\
    \ | 9 |\n| ijreview.com | 8 |\n| latimes.com | 7 |\n| gu.com | 7 |\n| ift.tt |\
    \ 7 |\n\nThis snippet of the dataset shows just the first few rows, but we can\
    \ already see some of the more popular results are URL-shortening services, such\
    \ as bit.ly. We can also see that we are able to remove all those shortened URLs\
    \ created by Twitter's own shortener, t.co, simply by using the display column\
    \ rather than the main URL column.\n\nIn the next section, we can use these counts\
    \ to build a bar graph, in a similar manner to the way we built a simple graph\
    \ in Chapter 9, Stack Overflow Project.\n\n# Step five – visualizing the data\n\
    \nTo build a little D3-enabled graph, we could follow the same procedure we used\
    \ in Chapter 9, Stack Overflow Project, in which we made a PHP script that queries\
    \ the database, and then our JavaScript uses the results as the live input to\
    \ a bar graph. Alternatively, we could generate a CSV file with Python and let\
    \ D3 generate its graph from those results. Since we already performed the PHP\
    \ method in the previous chapter, let's use the CSV file method here, just for\
    \ variety. This is also a good excuse to continue on with Python in this chapter,\
    \ since this is already the language we have been using."
  merge: -1
  img_proc: true
- pgno: 253
  md: "The following script connects to the database, selects out the top 15 most-used\
    \ URLs and their counts, and writes the entire thing to a CSV file:\n\n```\nimport\
    \ csv\nimport MySQLdb\n\n# Open database connection\ndb = MySQLdb.connect(host=\"\
    localhost\",\n    user=\"username\",\n    passwd=\"password\",\n    db=\"ferguson\"\
    ,\n    use_unicode=True,\n    charset=\"utf8\")\ncursor = db.cursor()\n\ncursor.execute('SELECT\
    \ left(tdisplay, LOCATE(\\'\\/\\', tdisplay)-1) as url, COUNT(tid) as num\n  \
    \  FROM ferguson_tweets_urls\n    GROUP BY 1 ORDER BY 2 DESC LIMIT 15')\n\nwith\
    \ open('fergusonURLcounts.tsv', 'wb') as fout:\n    writer = csv.writer(fout)\n\
    \    writer.writerow([ i[0] for i in cursor.description ])\n    writer.writerows(cursor.fetchall())\n\
    ```\n\nOnce we have this CSV file, we can feed it into a stock D3 bar graph template,\
    \ just to see what it looks like. The following can be called buildBarGraph.html\
    \ or the like:\n\n![](img/9aa003afabe05fdb07da46ad71325de6_253_0.png)\n\n> Make\
    \ sure you have the D3 libraries in your local folder, just as you did in previous\
    \ chapters, along with the CSV file you just made.\n\n```\n<!DOCTYPE html>\n<meta\
    \ charset=\"utf-8\">\n<!--\nthis code is modeled on mbostock's\n\"Let's Make a\
    \ Bar Chart\" D3 tutorial\navailable at http://bl.ocks.org/mbostock/3885304\n\
    My modifications:\n* formatting for space\n* colors\n* y axis label moved\n* changed\
    \ variable names to match our data\n* loads data via CSV rather than TSV file\n\
    ```"
  merge: -1
  img_proc: true
