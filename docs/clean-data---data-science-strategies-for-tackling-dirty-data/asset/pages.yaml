- pgno: 193
  md: '```

    query_id int(11) NOT NULL,

    user varchar(25) CHARACTER SET utf8 DEFAULT NULL,

    tweet_text varchar(144) CHARACTER SET utf8 DEFAULT NULL ,

    PRIMARY KEY (id)) ENGINE=MyISAM DEFAULT CHARSET=utf8;


    SET SQL_MODE=''NO_AUTO_VALUE_ON_ZERO'';

    INSERT INTO sentiment140_backup SELECT * FROM sentiment140;

    ```


    5. Populate the new column with the correct number. To do this, we join the two
    tables together on their text column, then look up to the correct number value
    from the lookup table, and insert it into the sentiment140 table. In the following
    query, each table has been given an alias, s and sq:


    ```

    UPDATE sentiment140 s

    INNER JOIN sentiment140_queries sq

    ON s.query_phrase = sq.query_phrase

    SET s.query_id = sq.query_id;

    ```


    6. Remove the old query_phrase column in the sentiment140 table:


    ```

    ALTER TABLE sentiment140

    DROP query_phrase;

    ```


    At this point, we have an effective way to create a list of phrases, as follows.

    These are shown in the alphabetical order:


    ```

    SELECT query_phrase

    FROM sentiment140_queries

    ORDER BY 1;

    ```


    We can also find out the tweets with a given phrase (baseball) by performing a
    join between the two tables:


    ```

    SELECT s.id, s.tweet_text, sq.query_phrase

    FROM sentiment140 s

    INNER JOIN sentiment140_queries sq

    ON s.query_id = sq.query_id

    WHERE sq.query_phrase = ''baseball'';

    ```


    At this point, we have a cleaned sentiment140 table and four new tables to hold
    various extracted and cleaned values, including hashtags, user mentions, URLs,
    and query phrases. Our tweet_text and date_clean columns are clean, and we have
    a lookup table for query phrases.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# Step nine – document what you did


    With nine steps of cleaning and multiple languages and tools in use, there is
    no doubt there’ll be a point at which we will make a mistake and have to repeat
    a step. If we had to describe to someone else what we did, we will almost certainly
    have trouble remembering the exact steps and all the reasons why we did each thing.


    To save ourselves mistakes along the way, it is essential that we keep a log of
    our cleaning steps. At a minimum, the log should contain these in the order in
    which they were performed:


    +   - Every SQL statement

    +   - Every Excel function or text editor routine, including screenshots if necessary

    +   - Every script

    +   - Notes and comments about why you did each thing


    Another excellent idea is to create a backup of the tables at each stage, for
    example, we created a backup just before we performed UPDATE on the sentiment140
    table, and we discussed performing backups after we created the new date_clean
    column. Backups are easy to do and you can always drop the backed-up table later
    if you decide you do not need it.


    # Summary


    In this chapter, we used a sample dataset, a collection of tweets called Sentiment140,
    to learn how to clean and manipulate data in a relational database management
    system. We performed a few basic cleaning procedures in Excel, and then we reviewed
    how to get the data out of a CSV file and into the database. At this point, the
    rest of the cleaning procedures were performed inside the RDBMS itself. We learned
    how to manipulate strings into proper dates, and then we worked on extracting
    three kinds of data from within the tweet text, ultimately moving these extracted
    values to new, clean tables. Next, we learned how to create a lookup table of
    values that are currently stored inefficiently, thus allowing us to update the
    original table with efficient, numeric lookup values. Finally, because we performed
    a lot of steps and because there is always the potential for mistakes or miscommunication
    about what we did, we reviewed some strategies to document our cleaning procedures.


    In the next chapter, we will switch our perspective away from cleaning what has
    been given to us toward preparing cleaned data for others to use. We will learn
    some best practices to create datasets that require the least amount of cleaning
    by others.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 8


    # Best Practices for Sharing

    Your Clean Data


    So far in this book, we have learned many different ways to clean and organize
    our datasets. Perhaps now it is time to consider letting our cleaned data be used
    by others. The goal of this chapter is to present a few best practices for inviting
    some friends into your data science kitchen. Sharing your data could mean providing
    it to other people, other teams, or even just some future version of yourself.
    What is the best way to package your data for consumption by others? How should
    you tell people about the cleaned data you have? How can you ensure that all your
    hard work is attributed to you?


    In this chapter, we will learn:


    +   - How to present and package your cleaned data

    +   - How to provide clear documentation for what is included in your data

    +   - How to protect and extend your hard work by licensing your cleaned data

    +   - How to find and evaluate the options for publicizing your cleaned data


    One thing we should state clearly before we begin this chapter is that we should
    only clean and share data that we have the right to share. Perhaps that seems
    obvious, but it is worth repeating. This entire chapter assumes that you are only
    cleaning, and subsequently sharing, data that you actually have the right to work
    with in this way. If you are wondering about this, read the *Setting terms and
    licenses for your data* section of this chapter, and make sure you follow the
    same guidelines that you would ask your users to follow.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Preparing a clean data package


    In this section, we delve into the many important questions that need to be answered
    before you can release a data package for general consumption.


    How do you want people to access your data? If it is in a database, do you want
    users to be able to log in and run SQL commands on it? Or do you want to create
    downloadable flat text files for them to use? Do you need to create an API for
    the data? How much data do you have anyway, and do you want different levels of
    access for different parts of the data?


    The technical aspects of how you want to share your clean data are extremely important.
    In general, it is probably a good idea to start with the simple things and move
    to a more sophisticated distribution plan when and if you need to. The following
    are some options for distributing data, in the order of the least complicated
    to the most complicated. Of course, with greater sophistication comes greater
    benefits:


    +   - **Compressed plain text** – This is a very low-stakes distribution method.
    As we learned in Chapter 2, *Fundamentals – Formats, Types, and Encodings*, plain
    text can be compressed down to create very small file sizes. A simple CSV or JSON
    file is universally useful and can be converted to many other formats easily.
    Some considerations include:

    +     - How will you let users download the files? An open link on a web page
    is extremely easy and convenient, but it does not allow you to require credentials
    such as usernames and passwords to access the files. If that is important to you,
    then you will have to consider other methods to distribute files; for example,
    by using an FTP server with a username and password or by using the access controls
    on your web server.

    +     - How big are your files? How much traffic are you expecting? How much traffic
    will your hosting provider allow before they start charging extra?

    +   - **Compressed SQL files** – Distributing SQL files allows your users to recreate
    your database structure and data on their own system. Some considerations include:

    +     - Your user might be running a different database system than you are, so
    they will have to clean the data anyway. It may be more efficient just to give
    them plain text.

    +     - Your database system might have different server settings to theirs, so
    you will have to clarify these custom settings in advance.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   - You will also need to plan in advance for whether your datasets are designed
    to grow over time, for example, by deciding whether you will provide only `UPDATE`
    statements, or whether you will always provide enough `CREATE` and `INSERT` statements
    to recreate the entire database.

    +   - **Live database access** – Providing your users with direct access into
    your database is a very nice way to let them interact with your data at a low
    level. Some considerations include:

    +     - Providing live access does require that you set up an individual username
    and password for each user, which means keeping track of the users.

    +     - Because you have identifiable users, you will need to provide a way to
    correspond with them about support issues, including lost credentials and how
    to use the system.

    +     - It is probably not a good idea to allow generic usernames and passwords
    unless you have also built a secure frontend onto the database and taken basic
    precautions like limiting the number of queries a user can execute and limiting
    the length of time a query can take. An ill-formed `OUTER JOIN` on a table of
    half a dozen terabytes will likely bring your database to a halt and affect the
    rest of the users.

    +     - Do you want your users to be able to build programs that access your data,
    for example, through the ODBC or JDBC middleware layer? If so, you will need to
    take this into account when planning access permissions and when configuring the
    server.

    +   - **API** — Designing an **Application Programming Interface (API)** to your
    data will allow your end users to write their own programs that can access your
    data and receive result sets in a predictable way. The advantages of an API are
    that it will provide access over the Internet to your data in a known, limited
    way and your users do not have to parse data files or wrestle with translating
    data from one format to another. Some considerations include:

    +     - Building a good API is more expensive up front than the other choices
    listed here; however, if you have a lot of needy users and a very limited support
    staff, then building an API might actually save you money in the long run.

    +     - Using an API requires more technical knowledge on the part of your users
    than some of the other methods listed. You should be prepared to have plenty of
    documentation ready, with examples.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   - You will need a credentialing and security plan in place to keep track
    of who is allowed to access your data and what they can do with it. If you are
    planning multiple levels of access, for example, to monetize different layers
    of your data, things like users transitioning from one layer to another need to
    be clearly planned out in advance.

    +   - Just like with regular database access, overuse or misuse of the API by
    users is always a possibility. You will need to plan ahead and take precautions
    to spot and remove malicious or inattentive users who may — through willful or
    unintentional misuse — make the service inaccessible to everyone.


    Choosing a distribution method will have a lot to do with your budget, including
    money and time, as well as the expectations of your users. The best advice I can
    give you is that I have had good luck following the open source software motto,
    *Release Early and Often*. This works for me because I have a small user community,
    and a limited budget, and not a lot of spare cycles to devote to exotic packaging
    plans that may or may not work.


    # A word of caution – Using GitHub to distribute data


    GitHub is a cloud-based file repository designed for software developers to collaborate
    on software and host their code for others to download. It has exploded in popularity
    and currently hosts well over 16 million project repositories. For this reason,
    many data scientists I talk to immediately suggest storing their data on GitHub.


    Unfortunately, GitHub has some limitations in its ability to store non-code data,
    and despite its ubiquity among technical people and its ease-of-use, you should
    be aware of a few policies it has that might affect your data. These policies
    are covered in the Help guide, available at `https://help.github.com/articles/what-is-my-disk-quota`,
    but we have summarized the important ones here:


    +   - First, GitHub is a wrapper around the source code control system, Git, and
    that system is not designed to store SQL. The Help guide says, "Large SQL files
    do not play well with version control systems such as Git." I am not sure what
    "play well" means, but I am definitely sure I want to avoid learning that when
    my users'' happiness is at stake.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '+   - Second, GitHub has some serious file size limits. It lists 1GB per project
    (repository) as a limit and 100MB per file as a limit. Most of the data files
    I release are, as individuals, smaller than that limit, but since I release many
    of the time series files multiple times per year, I would have to create multiple
    repositories for them. Under this scheme, each time I released new files, I would
    have to assess whether I was bumping up against file size limits. This quickly
    becomes a big headache.


    In short, GitHub itself recommends a web hosting solution to distribute files,
    especially if they are large or if they are database-oriented. If you do decide
    to host on GitHub, be very conscious about posting files with user credentials
    in them. This includes posting your usernames and passwords for database systems,
    your authentication keys and secrets for Twitter, or any other personal details.
    Since GitHub is a Git repository at heart, the mistakes are there forever, unless
    the repository itself is deleted. If you find that you did make a mistake and
    post personal details to GitHub, you must immediately deauthenticate all current
    accounts and recreate all keys and passwords.


    # Documenting your data


    Once people have access to the data, and ideally even beforehand, they need to
    know what it is that they are getting. Documenting the data may feel like an afterthought
    to you, but it is extremely important for your users, since they are not as familiar
    with the data or all the things you did to it. In this section, we will review
    some of the things you can add to your data package to make it easier to understand.


    # README files


    The simple README file has a long history in computing. It is just a text file
    that is distributed with a software package, or that lives in a directory containing
    other files, and the idea is that the user should read the README file first,
    before getting started with the rest of the software package or files. The README
    file will tell the user important information about the package, such as who wrote
    it and why, installation instructions, known bugs, and other basic instructions
    to use the file.'
  merge: -1
  img_proc: true
- pgno: 200
