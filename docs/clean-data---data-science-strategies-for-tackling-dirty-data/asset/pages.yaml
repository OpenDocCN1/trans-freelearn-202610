- pgno: 237
  md: '# 10

    Twitter Project


    As with the project we completed in Chapter 9, Stack Overflow Project, our next
    full-length chapter dinner party is designed to show off our data cleaning skills
    in particular, while still completing each stage of the overall data science process.
    Our previous project used Stack Overflow data, a combination of MySQL and PHP
    to clean it, and JavaScript D3 to visualize it. In this chapter, we will use Twitter
    data, MySQL and Python to collect and clean it, and JavaScript and D3 to visualize
    it. As with our previous project, in this project, the data science process is
    still the same:


    +   1. Decide what kind of problem we are trying to solve — why do we need to
    examine this data?

    +   2. Collect and store our data, which consists of downloading and extracting
    a publicly-available set of tweet identification numbers, and then using a program
    to redownload the original tweets. This step also includes creating smaller sets
    of data for testing purposes.

    +   3. Clean data by extracting and storing only the parts that we need. In this
    step, we write a quick Python program to load in the data, pull out the fields
    we want, and write those to a small set of database tables.

    +   4. Analyze the data. Do we need to perform any calculations on the data? Should
    we write some aggregate functions to count or sum the data? Do we need to transform
    the data in some way?

    +   5. Provide visualizations of the data, if possible.

    +   6. Resolve the problem we set out to investigate. Did our process work? Were
    we successful?'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'As with our previous project, the bulk of the work will be in the collection,
    storage, and cleaning tasks. In this project, we will notice that we store different
    versions of our data several times, first as a text file, then as a hydrated JSON
    file, then as a MySQL database. Each of these different formats results from a
    different collection or cleaning process and feeds into the next. In this way,
    we start to see how the collection, storage, and cleaning steps can be **iterative**
    — feeding back to one another — rather than just linear.


    # Step one – posing a question about an archive of tweets


    Twitter is a popular **microblogging** platform used by millions of people around
    the world to share their thoughts or communicate about current events. Because
    of Twitter''s relative ease of access for both posting and reading, especially
    from mobile devices, it has emerged as an important platform for sharing information
    during public events, such as political crises and protests, or to track the emergence
    of an issue in the public consciousness. Saved tweets become a sort of time capsule,
    providing a wealth of insight into public sentiment at the time of the event.
    Frozen in time, the tweets themselves are unaffected by memory lapses or subsequent
    reversals in public opinion. Scholars and media experts can collect and study
    these topical **tweet archives** to attempt to learn more about what the public
    opinion was at the time, or about how information traveled, or even about what
    happened in an event, when it happened, and why.


    Many people have now started making their tweet collections public. Some of the
    tweet archives that are now available for public download include:


    +   - Tweets that are in reference to protest and unrest following events in Ferguson,
    Missouri, USA, between August 10 and August 27, 2014. These are available at https://archive.org/details/ferguson-tweet-ids.

    +   - Tweets from a number of countries during the Arab Spring events of 2011,
    including Libya, Bahrain, Egypt, and others. These are available at http://dfreelon.org/2012/02/11/arab-spring-twitter-data-now-available-sort-of/.

    +   - Tweets that mention **#YesAllWomen** hashtag and the related hashtag **#NotAllMen**,
    between May and June 2014. These are available at http://digital.library.unt.edu/ark:/67531/metadc304853/.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'In the next step, we will need to choose one of these to download and begin
    to work with. Since the Ferguson tweets are the newest and the most complete of
    those three example data sets, I have designed the rest of this chapter around
    it. However, no matter what set you use, the concepts and basic procedures here
    will apply.


    The basic question we want to ask in this chapter is quite simple: when people
    tweeted about Ferguson, which Internet domains did they tweet about most? Compared
    to our set of questions in Chapter 9, Stack Overflow Project, this is a very simple
    question, but the data collection process is somewhat different here, so a simple
    question is enough to motivate our data science dinner party.


    # Step two – collecting the data


    Unlike the small sentiment tweet archive that we studied in Chapter 7, RDBMS Cleaning
    Techniques, the newer tweet archives, like those mentioned, no longer contain
    the actual text of the tweets themselves. Twitter''s Terms of Service (ToS) have
    changed as of 2014, and distributing other people''s tweets is now a violation
    of this ToS. Instead, what you will find in a newer tweet archive is actually
    just the tweet identification (ID) numbers. Using these numbers, we will have
    to collect the actual tweets individually. At that point, we can store and analyze
    the tweets ourselves. Note that at any point during or after this process, we
    cannot redistribute the tweet text or their metadata, only the tweet identification
    numbers.


    ![](img/9aa003afabe05fdb07da46ad71325de6_239_0.png)


    > Even though it is inconvenient for the researcher who wants to collect the tweets,
    the stated reason for Twitter''s change to their ToS is to honor the notion of
    copyright by the original person who posted the tweet. This is especially important
    in terms of deleting a tweet. If a tweet has been copied and redistributed all
    around the Web and stored in data files by third parties, the tweet cannot really
    be deleted. By asking that researchers copy only the tweet ID, Twitter attempts
    to protect the user''s ability to delete his or her own content. A request for
    a deleted tweet ID will return no result.


    # Download and extract the Ferguson file


    The Ferguson-related tweets are available at the Internet Archive as a set of
    archived, compressed text files. Point your browser to https://archive.org/details/
    ferguson-tweet-ids and download the 147 MB ZIP file.


    We can extract the files as follows:


    ```

    unzip ferguson-tweet-ids.zip

    ```'
  merge: -1
  img_proc: true
