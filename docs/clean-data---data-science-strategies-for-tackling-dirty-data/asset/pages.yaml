- pgno: 183
  md: "# Step six – clean the dates\n\nIf we take a look at the date_of_tweet column,\
    \ we see that we created it as a simple variable character field, varchar(30).\
    \ What is so wrong with that? Well, suppose we want to put the tweets in order\
    \ from earliest to latest. Right now, we cannot use a simple SQL ORDER BY clause\
    \ and get the proper date order, because we will get an alphabetical order instead.\
    \ All Fridays will come before any Mondays, and May will always come after June.\
    \ We can test this with the following SQL query:\n\n```\nSELECT id, date_of_tweet\n\
    FROM sentiment140\nORDER BY date_of_tweet;\n```\n\nThe first few rows are in order\
    \ but down near row 28, we start to see a problem:\n\n```\n2018  Fri May 15 06:45:54\
    \ UTC 2009\n2544  Mon Jun 08 00:01:27 UTC 2009\n...\n3     Mon May 11 03:17:40\
    \ UTC 2009\n```\n\nMay 11 does not come after May 15 or June 8. To fix this, we\
    \ will need to create a new column that cleans these date strings and turns them\
    \ into proper MySQL datetime data types. We learned in the Converting between\
    \ data types section in Chapter 2, Fundamentals – Formats, Types, and Encodings,\
    \ that MySQL works best when dates and time are stored as native date, time, or\
    \ datetime types. The format to insert a datetime type looks like this: YYYY-MM-DD\
    \ HH:MM:SS. But this is not what our data looks like in the date_of_tweet column.\n\
    \nThere are numerous built-in MySQL functions that can help us format our messy\
    \ date string into the preferred format. By doing this, we will be able to take\
    \ advantage of MySQL's ability to perform math on the dates and time, for example,\
    \ finding the difference between two dates or times or sorting items properly\
    \ in the order of their dates or times.\n\nTo get our string into a MySQL-friendly\
    \ datetime type, we will perform the following procedure:\n\n+   1. Alter the\
    \ table to include a new column, the purpose of which is to hold the new datetime\
    \ information. We can call this new column date_of_tweet_new or date_clean or\
    \ some other name that clearly differentiates it from the original date_of_tweet\
    \ column. The SQL query to perform this task is as follows:\n+   \n+   ```\n+\
    \   ALTER TABLE sentiment140\n+   ADD date_clean DATETIME NULL\n+   AFTER date_of_tweet;\n\
    +   ```"
  merge: -1
  img_proc: true
- pgno: 184
  md: "2. Perform an update on each row, during which we format the old date string\
    \ into a properly formatted datetime type instead of a string and add the new\
    \ value into the newly created date_clean column. The SQL to perform this task\
    \ is as follows:\n\n```\nUPDATE sentiment140\nSET date_clean = str_to_date(date_of_tweet,\n\
    \  '%a %b %d %H:%i:%s UTC %Y');\n```\n\nAt this point, we have a new column that\
    \ has been populated with the clean datetime. Recall that the old date_of_tweet\
    \ column was flawed in that it was not sorting dates properly. To test whether\
    \ the dates are being sorted correctly now, we can select our data in the order\
    \ of the new column:\n\n```\nSELECT id, date_of_tweet\nFROM sentiment140\nORDER\
    \ BY date_clean;\n```\n\nWe see that the rows are now perfectly sorted, with the\
    \ May 11 date coming first, and no dates are out of order.\n\nShould we remove\
    \ the old date column? This is up to you. If you are worried that you may have\
    \ made a mistake or that you might need to have the original data for some reason,\
    \ then by all means, keep it. But if you feel like removing it, simply drop the\
    \ column, as shown:\n\n```\nALTER TABLE sentiment140\nDROP date_of_tweet;\n```\n\
    \nYou could also create a copy of the Sentiment140 table that has the original\
    \ columns in it as a backup.\n\n# Step seven – separate user mentions, hashtags,\
    \ and URLs\n\nAnother problem with this data right now is that there are lots\
    \ of interesting pieces of information hidden inside the tweet_text column, for\
    \ example, consider all the times that a person directs a tweet to the attention\
    \ of another person using the @ symbol before their username. This is called a\
    \ mention on Twitter. It might be interesting to count how many times a particular\
    \ person is mentioned or how many times they are mentioned in conjunction with\
    \ a particular keyword. Another interesting piece of data hidden in some of the\
    \ tweets is hashtags; for example, the tweet with ID 2165 discusses the concepts\
    \ of jobs and babysitting using the #jobs and #sittercity hashtags."
  merge: -1
  img_proc: true
- pgno: 185
  md: "This same tweet also includes an external, non-Twitter URL. We can extract\
    \ each of these mentions, hashtags, and URLs and save them separately in the database.\n\
    \nThis task will be similar to how we cleaned the dates, but with one important\
    \ difference. In the case of the dates, we only had one possible corrected version\
    \ of the date, so it was sufficient to add a single new column to hold the new,\
    \ cleaned version. With mentions, hashtags, and URLs, however, we may have zero\
    \ or more in a single tweet_text value, for example, the tweet we looked at earlier\
    \ (ID 2165) had two hashtags in it, as does this tweet (ID 2223):\n\n```\nHTML\
    \ 5 Demos! Lots of great stuff to come! Yes, I'm excited. :)\nhttp://htmlfive.appspot.com\
    \ #io2009 #googleio\n```\n\nThis tweet has zero mentions, one URL, and two hashtags.\
    \ Tweet 13078 includes three mentions but no hashtags or URLs:\n\n```\nMonday\
    \ already. Iran may implode. Kitchen is a disaster. @annagoss\nseems happy. @sebulous\
    \ had a nice weekend and @goldpanda is\ngreat. whoop.\n```\n\nWe will need to\
    \ change our database structure to hold these new pieces of information—hashtags,\
    \ URLs, and mentions—all the while keeping in mind that a given tweet can have\
    \ a lot of these in it.\n\n# Create some new tables\n\nFollowing relational database\
    \ theory, we should avoid creating columns that will store multivalve attributes,\
    \ for example, if a tweet has three hashtags, we should not just deposit all three\
    \ hashtags into a single column. The impact of this rule for us is that we cannot\
    \ just copy the ALTER procedure we used for the date cleaning problem earlier.\n\
    \nInstead, we need to create three new tables: sentiment140_mentions, sentiment140_urls,\
    \ and sentiment140_hashtags. The primary key for each new table will be a synthetic\
    \ ID column, and each table will include just two other columns: tweet_id, which\
    \ ties this new table back to the original sentiment140 table, and the actual\
    \ extracted text of the hashtag, mention, or URL. Here are three CREATE statements\
    \ to create the tables we need:\n\n```\nCREATE TABLE IF NOT EXISTS sentiment140_mentions\
    \ (\n  id int(11) NOT NULL AUTO_INCREMENT,\n  tweet_id int(11) NOT NULL,\n  mention\
    \ varchar(144) NOT NULL,\n  PRIMARY KEY (id)\n) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 186
  md: "```\nCREATE TABLE IF NOT EXISTS sentiment140_hashtags (\n  id int(11) NOT NULL\
    \ AUTO_INCREMENT,\n  tweet_id int(11) NOT NULL,\n  hashtag varchar(144) NOT NULL,\n\
    \  PRIMARY KEY (id)\n) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```\n\n```\nCREATE\
    \ TABLE IF NOT EXISTS sentiment140_urls (\n  id int(11) NOT NULL AUTO_INCREMENT,\n\
    \  tweet_id int(11) NOT NULL,\n  url varchar(144) NOT NULL,\n  PRIMARY KEY (id)\n\
    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```\n\n> These tables do not use foreign\
    \ keys back to the original sentiment140 tweet table. If you would like to add\
    \ these, that is certainly possible. For the purposes of learning how to clean\
    \ this dataset, however, it is not necessary.\n\nNow that our tables are created,\
    \ it is time to fill them with the data that we have carefully extracted from\
    \ tweet_text column. We will work on each extraction case separately, starting\
    \ with user mentions.\n\n# Extract user mentions\n\nTo design a procedure that\
    \ can handle the extraction of the user mentions, let's first review what we know\
    \ about mentions in tweets:\n\n+   - The user mention always starts with the @\
    \ sign\n+   - The user mention is the word that immediately follows the @ sign\n\
    +   - If there is a space after @, it is not a user mention\n+   - There are no\
    \ spaces inside the user mention itself\n+   - As e-mail addresses also use @,\
    \ we should be mindful of them\n\nUsing these rules, we can construct some valid\
    \ user mentions:\n\n+   - @foo\n+   - @foobar1\n+   - @_1foobar_"
  merge: -1
  img_proc: true
- pgno: 187
