    a Bar Graph tutorial by Mike Bostock, available at http://bl.ocks.org/mbostock/3885304.
    One of the ways that I extended this code was to make it read the JSON file we
    generated earlier in our q1.php script. Our JSON file printed really nicely, and
    was already sorted high to low, so building a little bar graph from that will
