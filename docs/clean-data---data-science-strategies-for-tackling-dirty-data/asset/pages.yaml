    \ space following the @ invalidates it)\n+   - foo@bar.com (bar.com is not recognized)\n\
    +   - @foo bar (only @foo will be recognized)\n+   - @foo.bar (only @foo will\
    \ be recognized)\n\n> In this example, we assume that we do not care about the\
    \ difference between a regular @mention and.@mention, sometimes called a dot-mention.\
    \ These are tweets with a period in front of the @ sign. They are designed to\
    \ push a tweet to all of the user's followers.\n\nAs this rule set is more complicated\
    \ than what we can execute efficiently in SQL, it is preferable to write a simple\
