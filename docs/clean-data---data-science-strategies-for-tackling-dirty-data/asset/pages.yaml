  md: '# About the Author


    **Megan Squire** is a professor of computing sciences at Elon University. She
    has been collecting and cleaning dirty data for two decades. She is also the leader
    of `FLOSSmole.org`, a research project to collect data and analyze it in order
    to learn how free, libre, and open source software is made.'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# About the Reviewers


    **J. Benjamin Cook**, after studying sociology at the University of Nebraska-Lincoln,
    earned his master''s in computational science and engineering from the Institute
    of Applied Computational Science at Harvard University. Currently, he is helping
    build the data science team at Hudl, a sports software company whose mission is
    to capture and bring value to every moment in sports. When he''s not learning
    about all things data, Ben spends time with his daughters and his beautiful wife,
    Renee.


    **Richard A. Denman, Jr.** is a senior consultant with Numb3rs and has over 30
    years of experience providing services to major companies in the areas of data
    analytics, data science, optimization, process improvement, and information technology.
    He has been a member of the Association for Computing Machinery (ACM) and the
    Institute of Electrical and Electronics Engineers (IEEE) for over 25 years. He
    is also a member of the Institute for Operations Research and the Management Sciences
    (INFORMS) and the American Society for Quality (ASQ).


    I would like to thank my wife, Barbara, my son, Ashford, and my daughter, Addie,
    for their support in producing this book.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '**Oskar Jarczyk** graduated from Polish-Japanese Academy of Information Technology
    with an MSc Eng. degree in computer science (major databases). After three years
    of commercial work, he returned to academia to become a PhD student in the field
    of social informatics.


    His academic work is connected with problems in the category of web intelligence,
    especially free/libre open-source software (FLOSS) and collaborative innovation
    networks (COINs). He specializes in analyzing the quality of work in open source
    software teams of developers that are on the GitHub portal. Together with colleagues
    from the WikiTeams research team, he coped with the problem of "clean data" on
    a daily basis while creating datasets in MongoDB and MySQL. They were later used
    with success for FLOSS scientific analyses in the R and Python language.


    In his spare time, Oskar reads books about big data and practices kendo.'
  merge: -1
  img_proc: true
