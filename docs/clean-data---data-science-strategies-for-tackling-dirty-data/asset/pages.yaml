- pgno: 168
  md: '# Step five – more cleaning


    Open the CSV file in Excel or a text editor and take a look at it. At this stage,
    we have had a lot of failures in getting this PDF data extracted, so it is very
    tempting to just quit now. However, if you have made it this far in a book about
    data cleaning, you can probably guess that this data could be made even cleaner.
    Here are some simple data cleaning tasks that we know how to do already from earlier
    chapters:


    +   1. We can combine all the two-line text cells into a single cell. For example,
    in column B, many of the phrases take up more than one row. Prepare students to
    be productive and members of the workforce should be in one cell as a single phrase.
    The same is true for the headers in Rows 1 and 2 (4-year and Private should be
    in a single cell). To clean this in Excel, create a new column between columns
    B and C. Use the concatenate() function to join B3:B4, B5:B6, and so on. Use Paste-Special
    to add the new concatenated values into a new column. Then remove the two columns
    you no longer need. Do the same for rows 1 and 2.

    +   2. Remove blank lines between rows.


    When these procedures are finished, the data looks like this:


    | Row | A | B | 4-year Private | 4-year Public | 2-year Private/Public | For profit
    |

    |---|---|---|---|---|---|---|

    |1|All||4-year Private|4-year Public|2-year Private/Public|For profit|

    |2||38 Prepare students to be productive members of the workforce|23|28|47|63|

    |3||27 Prepare young people to be responsible citizens|48|31|14|8|

    |4||21 Ensure that all qualified students have equal access to a college education|16|24|25|20|

    |5||4 Contribute to the economic development of their region or locality|2|5|8|2|

    |6||4 Conduct research to help solve medical, scientific, social, and other national
    problems|5|8|3|1|

    |7||2 Provide continuing education for adults of all ages|2|1|1|3|

    |8||3 None is "very important" /No answer|4|4|3|2|


    ![](img/9aa003afabe05fdb07da46ad71325de6_168_0.png)


    > Tabula might seem like a lot of work compared to cutting and pasting data or
    running a simple command-line tool. That is true, unless your PDF file turns out
    to be finicky like this one was. Remember that specialty tools are there for a
    reason—but do not use them unless you really need them. Start with a simple solution
    first and only proceed to a more difficult tool when you really need it.


    # When all else fails – the fourth technique


    Adobe Systems sells a paid, commercial version of their Acrobat software that
    has some additional features above and beyond just allowing you to read PDF files.
    With the full version of Acrobat, you can create complex PDF files and manipulate
    existing files in various ways. One of the features that is relevant here is the
    Export Selection As... option found within Acrobat.'
