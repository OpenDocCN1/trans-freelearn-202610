- pgno: 243
  md: 'There are a lot of numbers and secret codes on this screen, but there are four
    items that we need to pay particular attention to:


    +   - CONSUMER_KEY

    +   - CONSUMER_SECRET

    +   - ACCESS_TOKEN

    +   - ACCESS_TOKEN_SECRET


    No matter what kind of Twitter API programming you are doing, at least for the
    time being, you will always need these same four items. This is true whether you
    are using twarc or some other tool. These credentials are how Twitter authenticates
    you and makes sure that you have the access rights needed to see whatever it is
    that you are requesting.


    ![](img/9aa003afabe05fdb07da46ad71325de6_243_0.png)


    > These API credentials are also how Twitter limits how many requests you can
    send and how quickly you can make your requests. The twarc tool handles all of
    this on our behalf, so we do not have to worry too much about exceeding our rate
    limits. For more information on Twitter''s rate limits, check out their developer
    documentation at https://dev.twitter.com/rest/public/rate-limiting.


    # Installing twarc


    Now that we have access to our Twitter credentials, we can install twarc.


    The twarc download page is available on GitHub at https://github.com/edsu/twarc.
    On that page, there is documentation about how to use the tool and what options
    are available.


    To install twarc in your Canopy Python environment, start up Canopy and then choose
    Canopy Command Prompt from the Tools menu.


    At the command prompt, type in:


    ```

    pip install twarc

    ```


    This command will install twarc and make it available to be called as a command-line
    program, or from within your own Python programs.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# Running twarc


    We can now use twarc from the command line to hydrate the ids_1000.txt file that
    we created earlier. The command line for this is very long, since we have to pass
    in those four long secret tokens that we created earlier on the Twitter site.
    To save myself from making errors, I used my text editor, Text Wrangler, to create
    the command line first, and then I pasted it into my Command Prompt. Your final
    command line will look like the one that follows, except everywhere that it says
    abcd, you should instead fill in your appropriate secret token or secret key:


    ```

    twarc.py --consumer_key abcd --consumer_secret abcd --access_token abcd --access_token_secret
    abcd --hydrate ids_1000.txt > tweets_1000.json

    ```


