- pgno: 39
  md: '# Common formats for text files


    In this book, we are mostly concerned with text files rather than binary files.
    (Some special exceptions include compressed and archived files, which we will
    cover in the next section, and Excel and PDF files, each of which have their own
    chapters later in this book.)


    The three main types of text files we will be concerned with in this book are:


    +   - The delimited format (structured data)

    +   - The JSON format (semi-structured data)

    +   - The HTML format (unstructured data)


    These files differ in layout (they just look different when we read them), and
    also in terms of how predictable their structures are. In other words, how much
    of the file is organized and has structured data? And how much of the data in
    the file is irregular or unstructured? Here, we discuss each of these text file
    formats individually.


    # The delimited format


    Delimited files are extremely common as a way to share and transfer data. Delimited
    format files are just text files in which each data attribute (each column) and
    each instance of the data (each row) are separated by a consistent character symbol.
    We call the separator characters delimiters. The two most common delimiters are
    tabs and commas. These two common choices are reflected in the Tab Separated Values
    (TSV) and Comma Separated Values (CSV) file extensions, respectively. Sometimes,
    delimited files are also called record-oriented files, as the assumption is that
    each row represents a record.


    Below are three instances of some data (three rows describing people), with data
    values separated by commas. The first row lists the names of the columns. This
    first row is also called the header row, and it has been highlighted in the data
    to show it more clearly:


    ```

    First name,birth date,favorite color

    Sally,1970-09-09,blue

    Manu,1984-11-03,red

    Martin,1978-12-10,yellow

    ```'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'Notice that with this example of delimited data, there is no non-data information.
    Everything is either a row or a data value. And the data is highly structured.
    Yet, there are still some options that can differentiate one delimited format
    from another. The first differentiator is how each instance of the data (each
    row) is separated. Usually at the end of a line, a new line, or a carriage return,
    or both are used depending on the operating environment in use during the creation
    of the file.


    # Seeing invisible characters


    In the preceding example, the new line or carriage return is invisible. How do
    you see the invisible characters? We will read the same file in Text Wrangler
    on a Mac (similar full-featured editors such as Notepad++ are available for Windows),
    where we can use the Show invisibles option (located by navigating to View | Text
    Display).


    ![](img/9aa003afabe05fdb07da46ad71325de6_40_0.png)


    Another way to view the invisible characters is to use vi (a command-line text
    editor) on a Linux system or in the Terminal window on a Mac (this is not available
    on a Windows machine, by default). The process to view the invisible characters
    in a file using vi is as follows:


    +   1. First, use the command:

    +      `vi <filename>`

    +   2. Then, type : to enter the vi edit mode.

    +   3. Then, type set list and press Enter to view the invisible characters.


    The following screenshot shows the end-of-line characters that are revealed by
    set list in vi, showing line termination symbol $.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '```

    ```text

    First name,birth date,favorite color$

    Sally,1970-09-09,blue$

    Manu,1984-11-03,red$

    Martin,1978-12-10,yellow$

    ~

    ~

    ~

    ~

    ~

    ~

    ~

    ~

    ~

    ~

    ~

    ~

    ~

    ~

    :set list

    ```

    ```


    # Enclosing values to trap errant characters


    Another important option with delimited files is what character to use to enclose
    each value being separated. For example, comma-separated values are great unless
    you have numeric values with commas as the thousands separator. Consider the following
    example, where the salaries were given commas as their thousands separator, but
    commas are also the delimiter:


    ```

    ```text

    First name,birth date,favorite color,salary

    Sally,1971-09-16,light blue,129,000

    Manu,1984-11-03,red,159,960

    Martin,1978-12-10,yellow,76,888

    ```

    ```


    How can this be fixed at the point of file creation? Well, we have two options:


    +   - **Option 1:** The person creating the delimited file would need to remove
    the commas in the final column before creating this table (in other words, no
    commas in salary amounts)

    +   - **Option 2:** The person creating this file would need to use an additional
    symbol to enclose the data values themselves.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'If option 2 is chosen, typically, a double quote separator is then added to
    enclose data values. So, 129,000 on the first line would become "129,000".


    # Escaping characters


    What if the data itself has quotation marks in it? What if Sally''s favorite color
    were listed and shown as light "Carolina" blue? Take a look:


    ```

    First name,birth date,favorite color,salary

    "Sally","1971-09-16","light "Carolina" blue","129,000"

    "Manu","1984-11-03","red","159,960"

    "Martin","1978-12-10","yellow","76,888"

    ```


    Internal quotation marks will have to be escaped through the use of another special
    character, the backslash \:


    ```

    First name,birth date,favorite color,salary

    "Sally","1971-09-16","light \"Carolina\" blue","129,000"

    "Manu","1984-11-03","red","159,960"

    "Martin","1978-12-10","yellow","76,888"

    ```


    > Or, we could try encapsulating with a single quote instead of double quotes,
    but then we might have issues with possessives such as "it''s" or names such as
    O''Malley. There''s always something!


    Delimited files are very convenient in that they are easy to understand and easy
    to access in a simple text editor. However, as we have seen, they also require
    a bit of planning in advance in order to ensure that the data values are truly
    separated properly and everything is formatted the way it was intended.


    If you find yourself the unlucky recipient of a file with delimiting errors such
    as the preceding ones, we''ll give you some tricks and tips in Chapter 3, Workhorses
    of Clean Data – Spreadsheets and Text Editors, for how to clean them up.


    # The JSON format


    **JavaScript Object Notation (JSON)**, pronounced JAY-sahn, is one of the more
    popular formats for what is sometimes called semi-structured data. Contrary to
    the implications in its name, JSON is not dependent upon JavaScript to be useful.
    The name refers to the fact that it was designed to serialize JavaScript objects.'
  merge: -1
  img_proc: true
- pgno: 43
  md: "A collection of data can be called semi-structured when its data values are\
    \ labeled, but their order does not matter, and in fact, some of the data values\
    \ may even be missing. A JSON file is just a collection of attribute-value pairs,\
    \ such as this:\n\n```\n{\n  \"firstName\": \"Sally\",\n  \"birthDate\": \"1971-09-16\"\
    ,\n  \"faveColor\": \"light\\\"Carolina\\\" blue\",\n  \"salary\":129000\n}\n\
    ```\n\nThe attributes are on the left-hand side of the colon, and the values are\
    \ on the right-hand side. Each attribute is separated by a comma. The entire entity\
    \ is enclosed in curly braces.\n\nA few things about JSON are similar to delimited\
    \ files, and a few things are different. First, string values must be double-quoted,\
    \ and therefore, any double quotes internal to a string must be escaped with a\
    \ backslash. (The escape character \\, when used as a regular character, must\
    \ also be escaped!)\n\nIn JSON, commas cannot be included in numeric values unless\
    \ the values are treated as strings and properly quoted. (Be careful when stringifying\
    \ numbers, though – are you sure you want to do that? Then, refer to the Data\
    \ types section in this chapter, which can help you with these issues.)\n\n```\n\
    {\n  \"firstName\": \"Sally\",\n  \"birthDate\": \"1971-09-16\",\n  \"faveColor\"\
    : \"light\\\"Carolina\\\" blue\",\n  \"salary\": \"129,000\"\n}\n```\n\nMultivalue\
    \ attributes are acceptable, as are hierarchical values (neither of these are\
    \ available very easily with delimited files). Here is an example of a JSON file\
    \ with a multivalue attribute for pet and a hierarchy of data for jobTitle. Note\
    \ that we've moved the salary data inside this new job hierarchy:\n\n```\n{\n\
    \  \"firstName\": \"Sally\",\n  \"birthDate\": \"1971-09-16\",\n  \"faveColor\"\
    : \"light\\\"Carolina\\\" blue\",\n  \"pet\":\n  [\n    {\n      \"type\": \"\
    dog\",\n      \"name\": \"Fido\"\n\n```"
  merge: -1
  img_proc: true
- pgno: 44
  md: "```\n},\n{\n    \"type\": \"dog\",\n    \"name\": \"Lucky\"\n}\n],\n\"job\"\
    : {\n    \"jobTitle\": \"Data Scientist\",\n    \"company\": \"Data Wizards, Inc.\"\
    ,\n    \"salary\":129000\n}\n}\n```\n\n# Experimenting with JSON\n\nJSON is an\
    \ extremely popular choice of data exchange format because of its extensibility,\
    \ simplicity, and its support for multivalue attributes, missing attributes, and\
    \ nested attributes / hierarchies of attributes. The increasing popularity of\
    \ APIs for distributing datasets has also contributed to JSON's usefulness.\n\n\
    To see an example of how an API uses a search term to produce a dataset encoded\
    \ in JSON, we can experiment with the iTunes API. iTunes is a music service run\
    \ by Apple. Anyone can query the iTunes service for details about songs, artists,\
    \ and albums. Search terms can be appended onto the iTunes API URL as follows:\n\
    \n```\nhttps://itunes.apple.com/search?term=the+growlers\n```\n\nIn this URL,\
    \ everything after the = sign is a search term. In this case, I searched for a\
    \ band I like, called The Growlers. Note that there is a + sign to represent the\
    \ space character, as URLs do not allow spaces.\n\nThe iTunes API returns 50 results\
    \ from its music database for my search keywords. The entire set is formatted\
    \ as a JSON object. As with all JSON objects, it is formatted as a collection\
    \ of name-value pairs. The JSON returned in this example appears very long, because\
    \ there are 50 results returned, but each result is actually very simplistic –\
    \ there are no multivalue attributes or even any hierarchical data in the iTunes\
    \ data shown in this URL.\n\n![](img/9aa003afabe05fdb07da46ad71325de6_44_0.png)\n\
    \n> For more details on how to use the iTunes API, visit the Apple iTunes developer\
    \ documentation at https://www.apple.com/itunes/affiliates/resources/documentation/itunes-store-web-service-search-api.html."
  merge: -1
  img_proc: true
- pgno: 45
  md: '# The HTML format


    HTML files, or web page files, are another type of text file that often have a
    lot of juicy data in them. How many times have you seen an interesting table,
    or list of information on a website, and wanted to save the data? Sometimes, copying
    and pasting works to try to create a delimited file from the web page, but most
    of the time, copying and pasting does not work effectively. HTML files can be
    terribly messy and thus, are a potentially painful way to extract data. For this
    reason, sometimes, we refer to web files as unstructured data. Even though web
    pages may have some HTML tags that could be used to attempt a delimiting type
    of pattern-based organization of data, they don''t always. And there is also a
    lot of room for error in how these various HTML tags are applied, both across
    different websites and even within the same website.


    The following figure shows just a small portion of the `http://weather.com` website.
    Even though there are pictures and colors and other non-text things in this screenshot,
    at its base level, this web page is written in HTML, and if we want to pull text
    data out of this page, we can do that.


    ![](img/9aa003afabe05fdb07da46ad71325de6_45_0.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'If we view the HTML source for the web page, we can locate a few lines of the
    nearly 1,000 lines of HTML code that comprise the data and layout instructions
    for the browser to show that particular weather table:


    ```

    806 <div class="wx-temperature-label">FEELS LIKE

    807 <span itemprop="feels-like-temperature-fahrenheit">43</span>&deg;</div>

    808 </div>

    809 <div class="wx-data-part">

    810 <div class="wx-temperature">43<span class="wx-degrees">&deg;</span></div>

    811 <div class="wx-temperature-label">HIGH AT 1:25 PM</div>

    812 </div>

    813 <div class="wx-data-part">

    814 <div class="wx-temperature">28<span class="wx-degrees">&deg;</span></div>

    815 <div class="wx-temperature-label">LOW</div>

    816 </div>

    ```


    Unstructured indeed! Of course, it is technically possible to pull the data value
    43 (for the temperature in Fahrenheit) from this page, but it''s not going to
    be a fun process, and we have no guarantee that our method to do that will be
    the same tomorrow or the day after that, as http://weather.com could change the
    source code for the site at any moment. Nonetheless, there is a ton of data on
    the Web, so in Chapter 5, Collecting and Cleaning Data from the Web, we cover
    a few strategies to extract data from web-based, unstructured files.


    # Archiving and compression


    When is a text file also a binary file? When it''s been compressed or archived,
    of course. What are archiving and compression? In this section, we''ll learn what
    file archives and compressed files are, how archiving and compression work, and
    the various standards for each.


    This is an important section as a lot of real-world data (especially, delimited
    data) will be compressed when you find it out in the real world. What are the
    most common compression formats that you as a data scientist are likely to run
    into? We will definitely find the answer to this question. You might also want
    to compress your data when you share it with others. How can you figure out which
    compression method is the best choice?


    # Archive files


    An archive file is simply a single file that contains many files inside it. The
    files inside can be either text or binary or a mixture of both. Archive files
    are created by a special program that takes a list of files and changes them into
    a single file. Of course, the archive files are created in such a way that they
    can be expanded back into many files.'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# tar


    The most common archived files that you are likely to encounter when doing data
    science work are so-called Tape ARchive (TAR) files, created using the tar program
    and usually given a .tar extension. Their original purpose was to create archives
    of magnetic tapes.


    The tar program is available on Unix-like operating systems, and we can access
    it in the Mac OSX Terminal as well.


    To create a tar file, you simply instruct the tar program which files you want
    included and what the output file name should be. (Program option c is used to
    indicate that we''re creating a new archive file, and option v prints the filenames
    as they are extracted. The f option lets us specify the name of the output file.)


    ```

    tar cvf fileArchive.tar reallyBigFile.csv anotherBigFile.csv

    ```


    To "untar" a file (or expand it into the full listing of all the files), you just
    direct the tar program to the file you want expanded. The x letter in xvf stands
    for eXtract:


    ```

    tar xvf fileArchive.tar

    ```


    So, a .tar archive file includes multiple files, but how many and what are the
    files? You''ll want to make sure that before you start extracting files, you have
    enough available disk space and that the files are really what you wanted to begin
    with. The t option in the tar command will show a list of the files inside a tar
    file:


    ```

    tar -tf fileArchive.tar

    ```


    There are many more archive programs apart from tar, but some of the interesting
    ones (for example, the built-in archiving ZIP compressor on OSX and the various
    ZIP and RAR utilities on Windows) also perform compression on the files, in addition
    to archiving, so we should probably discuss this concept next.


    # Compressed files


    Compressed files are those files that have been made smaller so that they will
    take up less space. Smaller files mean less storage space on the disk and a faster
    transfer time if the file needs to be shared over the network. In the case of
    data files, like the ones we are interested in, the assumption is that the compressed
    file can be easily uncompressed back to the original.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# How to compress files


    There are numerous ways of creating compressed files, and which one you choose
    will depend on the operating system you are using and what compression software
    you have installed. On OSX, for example, any file or folder (or group) can easily
    be compressed by selecting it in Finder, right-clicking on it, and choosing Compress
    from the menu. This action will create a compressed (.zip extension) file in the
    same directory as the original file. This is shown in the following image:


    ![](img/9aa003afabe05fdb07da46ad71325de6_48_0.png)


    # How to uncompress files


    The collection step of the data science process will often include downloading
    compressed files. These might be delimited text files, such as the ones we described
    earlier in this chapter, or they might be files containing multiple types of data
    files, such as spreadsheets or SQL commands used to build a database.


    In any case, uncompressing a file returns the data to a state where we can use
    it to accomplish our goals. How do we know which program to use to uncompress
    the file? The first and biggest clue is the file''s extension. This is a key tip-off
    as to what compression program created the file. Knowing how to uncompress the
    file is dependent on knowing how it was compressed.


    In Windows, you can see the installed program that is associated with your file
    extension by right-clicking on the file and choosing Properties. Then, look for
    the Open With option to see which program Windows thinks will uncompress the file.


    The remainder of this section will outline how to use command-line programs on
    OSX or a Linux system.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Compression with zip, gzip, and bzip2


    zip, gzip and bzip2 are the most common compression programs. Their uncompression
    partners are called Unzip, Gunzip, and Bunzip2, respectively.


    The following table shows a sample command-line for compressing and uncompressing
    in each of these programs.


    | | Compress | Uncompress |

    |---|---|---|

    | Zip | `zip filename.csv filename.zip` | `unzip filename.zip` |

    | gzip | `gzip filename.csv filename.gz` | `gunzip filename.gz` |

    | bzip2 | `bzip2 filename.csv filename.bz2` | `bunzip2 filename.bz2` |


    Sometimes, you will see a file that includes both a .tar and a .gz extension or
    a .bz2 extension like this: somefile.tar.gz. Other combinations that are common
    include: .tgz and .tbz2, as in somefile.tgz. These are files that have been tarred
    (archived) first and then compressed using gzip or bzip2. The reason for this
    is that gzip and bzip2 are not archiving programs; they are only compressors.
    Therefore, they can only compress a single file (or file archive) at a time. As
    tar''s job is to make multiple files into single files, these programs are found
    together very often.


    The tar program even has a built-in option that will gzip or bzip2 a file immediately
    after tarring it. To gzip the newly created .tar file, we can simply add z to
    the preceding tar command, and modify the filename:


    ```

    tar cvzf fileArchive.tar.gz reallyBigFile.csv anotherBigFile.csv

    ```


    Or, you can do this in two steps:


    ```

    tar cvf fileArchive.tar reallyBigFile.csv anotherBigFile.csv

    ```


    ```

    gzip fileArchive.tar

    ```


    This sequence of commands will create the fileArchive.tar.gz file:


    To uncompress a tar.gz file, use two steps:


    ```

    gunzip fileArchive.tar.gz

    ```


    ```

    tar xvf fileArchive.tar

    ```


    These steps also work for bzip2 files:


    ```

    tar cvjf fileArchive.tar.bz2 reallyBigFile.csv anotherBigFile.csv

    ```'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'To uncompress a tar.bz2 file, use two steps:


    ```

    bunzip2 fileArchive.tar.bz

    ```


    ```

    tar xvf fileArchive.tar

    ```


    # Compression options


    When compressing and uncompressing, there are many other options you should take
    into consideration in order to make your data cleaning job easier:


    +   - Do you want to compress a file and also keep the original? By default, most
    compression and archiving programs will remove the original file. If you want
    to keep the original file and also create a compressed version of it, you can
    usually specify this.

    +   - Do you want to add new files to an existing compressed file? There are options
    for this in most archiving and compression programs. Sometimes, this is called
    **updating** or **replacing**.

    +   - Do you want to encrypt the compressed file and require a password to open
    it? Many compression programs provide an option for this.

    +   - When uncompressing, do you want to overwrite files in the directory with
    the same name? Look for a **force** option.


    Depending on which compression software you are using and what its options are,
    you can use many of these options to make the job of dealing with files easier.
    This is especially true with large files — either large in size or large in number!


    # Which compression program should I use?


    The concepts in this section on archiving and compression are widely applicable
    for any operating system and any type of compressed data files. Most of the time,
    we will be downloading compressed files from somewhere, and our main concern will
    be uncompressing these files efficiently.


    However, what if you are creating compressed files yourself? What if you need
    to uncompress a data file, clean it, then recompress it and send it to a coworker?
    Or what if you are given a choice of files to download, each in a different compression
    format: zip, bz2, or gz? Which format should you choose?


    Assuming that we are in an operating environment that allows you to work with
    multiple compression types, there are a few rules of thumb for what the various
    strengths and weaknesses of the different compression types are.'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Some of the factors we use when making a compression decision are:


    +   - The speed of compressing and uncompressing

    +   - The compression ratio (how much smaller did the file get?)

    +   - The interoperability of the compression solution (can my audience easily
    decompress this file?)


    # Rules of thumb


    Gzip is faster to compress and decompress, and it is readily available on every
    OSX and Linux machine. However, some Windows users will not have a gunzip program
    readily available.


    Bzip2 makes smaller files than gzip and zip, but it takes longer to do so. It
    is widespread on OSX and Linux. Windows users will probably struggle to handle
    bzip2 files if they have not already installed special software.


    Zip is readily available on Linux, OSX, and Windows, and its speed to compress
    and decompress is not terrible. However, it does not create very favorable compression
    ratios (other compressors make smaller files). Still, its ubiquity and relative
    speed (compared to bzip2, for example) are strong points in its favor.


    RAR is a widely available archiving and compression solution for Windows; however,
    its availability for OSX and Linux requires special software, and its compression
    speed is not as good as some of the other solutions.


    Ultimately, you will have to decide on a compression standard based on the particular
    project you are working on and the needs of your audience or user, whether that
    is yourself, a customer, or a client.


    # Data types, nulls, and encodings


    This section provides an overview of the most common data types that data scientists
    must deal with on a regular basis and some of the variations between these types.
    We also talk about converting between data types and how to safely convert without
    losing information (or at least understanding the risks beforehand).


    This section also covers the mysterious world of empties, nulls, and blanks. We
    explore the various types of missing data and describe how missing data can negatively
    affect results of data analysis. We will compare choices and trade-offs for handling
    the missing data and some of the pros and cons of each method.'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'As much of our data will be stored as strings, we will learn to identify different
    character encodings and some of the common formats you will encounter with real-world
    data. We will learn how to identify character encoding problems and how to determine
    the proper type of character encoding for a particular dataset. We will write
    some Python code to convert from one encoding scheme to another. We will also
    cover the limitations of this strategy.


    # Data types


    Whether we are cleaning data stored in a text file, a database system, or in some
    other format, we will start to recognize the same types of data make an appearance
    over and over: numbers of various kinds, dates, times, characters, strings of
    characters, and more. The upcoming sections describe a few of the most common
    data types, along with some examples of each.


    # Numeric data


    In this section, we will discover that there are many ways to store a number,
    and some of them are easier to clean and manage than others. Still, numbers are
    fairly straightforward compared to strings and dates, so we will start with these
    before moving on to trickier data types.


    # Integers


    Integers, or whole numbers, can be positive or negative, and just like the name
    implies, they do not have decimal points or fractions. Depending on what kind
    of storage system the integers are stored in, for example, in a **Database Management
    System (DBMS)**, we may also have additional information about how large an integer
    can be stored as well as whether it is allowed to be signed (positive or negative
    values) or only unsigned (all positive values).


    # Numbers with decimals


    In our data cleaning work, numbers with a fractional component—such as prices,
    averages, measurements, and the like—are typically expressed using a decimal point
    (rather than a numerator/denominator). Sometimes, the particular storage system
    in place also has rules specifying the number of digits that are allowed to come
    after the decimal point (**scale**) as well as the total number of digits allowed
    in the number (**precision**). For example, we say that the number 34.984 has
    a precision of 3 and a scale of 5.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'Different data storage systems will also allow for different types of decimal
    numbers. For example, a DBMS may allow us to declare whether we will be storing
    floating-point numbers, decimal numbers, and currency/money numbers at the time
    we set up our database. Each of these will act slightly differently – in math
    problems, for instance. We will need to read the guidance provided by the DBMS
    for each data type and stay on top of changes. Many times, the DBMS provider will
    change the specifications for a particular data type because of memory concerns
    or the like.


    Spreadsheet applications, on the other hand, unlike DBMS applications, are designed
    to display data in addition to just storing it. Therefore, we may actually be
    able to store a number in one format and display it in another. This can cause
    some confusion if formatting has been applied to data cells in a spreadsheet.
    The following figure shows an example of some decimal display properties being
    set for a cell. The formula bar shows the full number 34.984, but the cell shows
    that the number appears to have been rounded down.


    ![](img/9aa003afabe05fdb07da46ad71325de6_53_0.png)


    ![](img/9aa003afabe05fdb07da46ad71325de6_53_1.png)


    > In many locations around the world, the comma character separates the decimal
    from the nondecimal portion of a number rather than a dot or period character.
    This is a good reminder that it is always worth inspecting the localization settings
    of the system you are on and making sure that they match the expectations of the
    data you are working with. For example, in OSX, there is a **Language & Region**
    dialogue located in the **Systems Preferences** menu. From here, you can change
    your localization settings if you need to.


    Unlike in a DBMS, a raw text file has no options to specify the size or expectations
    of a number field, and unlike a spreadsheet, the text file has no display options
    for a given data value either. If a text file shows a value of 34.98, then that
    may be all we know about that number.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# When numbers are not numeric


    Numeric data is first and foremost comprised of sequences of digits 0-9 and, sometimes,
    a decimal point. But a key point about true numeric data is that it is primarily
    designed to have calculations performed on it. We should choose numeric storage
    for our data when we expect to be able to *do math* on a data value, when we expect
    to compare one value to another numerically, or when we want items to be sorted
    in numeric order. In these cases, the data values need to be stored as numbers.
    Consider the following list of numbers sorted by their number value, low to high:


    +   - 1

    +   - 10

    +   - 11

    +   - 123

    +   - 245

    +   - 1016


    Now, consider the same list sorted as if they are text values in an address field:


    +   - 1 Elm Lane

    +   - 10 Pine Cir.

    +   - 1016 Pine Cir.

    +   - 11 Front St.

    +   - 123 Main St.

    +   - 245 Oak Ave.


    Telephone numbers and postal codes (and house numbers in street addresses as in
    the previous example) are often comprised of numeric digits, but when we think
    of them as data values, do they have more in common with text or with numeric
    data? Do we plan to add them, subtract them, or take their averages or standard
    deviations? If not, they may more appropriately be stored as text values.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Dates and time


    You are probably familiar with many different ways of writing the same date, and
    you probably have some that you prefer over others. For instance, here are a few
    common ways of writing the same date:


    +   - 11-23-14

    +   - 11-23-2014

    +   - 23-11-2014

    +   - 2014-11-23

    +   - 23-Nov-14

    +   - November 23, 2014

    +   - 23 November 2014

    +   - Nov. 23, 2014


    Regardless of our preference for writing dates, a complete date is made up of
    three parts: month, day, and year. Any date should be able to be parsed into these
    component parts. Areas of confusion with dates are usually in two areas: lack
    of clarity about the month signifier and a day signifier for numbers below 12,
    and confusion about specifying years. For example, if we only see "11-23", we
    can assume November 23, as there is no month abbreviated "23", but what year is
    it? If we see a date of "11-12", is that the 12th of November or the 11th of December?
    And in what year? Does a year of 38 signify 1938 or 2038?


    Most DBMSes have a particular way you should import data if you have specified
    it as a date, and if you export data, you will get it back in that date format
    too. However, these systems also have many functions that you can apply to reformat
    dates or pull out just the pieces you want. For example, MySQL has many interesting
    date functions that allow us to pull out just the month or day, as well as more
    complicated functions that allow us to find out what week in the year a particular
    date falls in or what day of the week it was. For example, the following SQL counts
    the messages in the Enron dataset from Chapter 1, Why Do You Need Clean Data?,
    that were sent on May 12 each year, and it also prints the day of the week:


    ```

    SELECT YEAR(date) AS yr, DAYOFWEEK(date) AS day, COUNT(mid)

    FROM message WHERE MONTHNAME(date) = "May" AND DAY(date) = 12

    GROUP BY yr, day

    ORDER BY yr ASC;

    ```'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Some spreadsheet programs, such as Excel, internally store dates as numbers
    but then allow the user to display the values in any format that they like using
    either built-in or custom formats. Excel stores a given date value as a fractional
    number of days since Dec 31, 1899. You can see the internal representation of
    a date in Excel by entering a date and asking for General formatting, as shown
    in the following figure. Excel stores May 21, 1986 as 31553.


    ![](img/9aa003afabe05fdb07da46ad71325de6_56_0.png)


    So, when you convert back and forth between different formats, switching the slashes
    to dashes, or swapping the order of months and days, Excel is just applying a
    different look to the date as you see it, but underneath, its internal representation
    of the date value has not changed.


    Why does Excel need a fractional number to store the date since 1899? Isn''t the
    number of days a whole number? It turns out that the fraction part is the way
    Excel stores time.


    | E | F |

    |---|---|

    | formatted as a date and time | formatted as ''general'' |

    | 5/21/86 12:00 AM | 31553 |

    | 5/21/86 12:00 PM | 31553.5 |

    | 5/21/86 6:00 PM | 31553.75 |


    In the preceding figure, we can see how an internal date of 31553 is mapped to
    midnight, but 31553.5 (halfway through the day) is noon, and 31553.75 is 6 p.m.
    The greater precision we add to the decimal points, the greater time specificity
    we will get in the internal representation.


    But not all data storage systems store dates and time as fractions, and they do
    not all start at the same spot. Some systems store dates and time as a number
    of seconds since the Unix epoch (00:00:00, January 1, 1970, universal time), and
    a negative number is used to store time before the epoch.'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Both DBMS and spreadsheet applications allow for some date math, just like
    with numbers. In both types of systems, there are functions that allow dates to
    be subtracted to find a difference, or other calculations, such as adding a number
    of weeks to a day and getting a new day value.


    # Strings


    Strings represent sequences of any character data, including alphabetic letters,
    numbers, spaces and punctuation, characters in hundreds of languages, and all
    kinds of special purpose symbols. Strings are very flexible, and this makes them
    the most common way to store data. Plus, as they can store nearly any other type
    of data (not necessarily efficiently), strings become the lowest common denominator
    to communicate data or move it from one system to another.


    As with numeric data, the storage mechanism we are using at the moment may have
    some guidelines we are expected to use with strings. For example, a DBMS or spreadsheet
    may require that we state in advance what size we expect our strings to be or
    what types of characters we are expecting. Character encoding is an interesting
    and important area on its own, so we have a whole section on it coming up later
    in this chapter.


    Or, there may be guidelines for the size of the data we are allowed to work with
    in a particular environment. In the world of databases, there are fixed and variable
    width character columns, which are designed to hold shorter strings, and some
    DBMS vendors have designed a text type that is intended to hold longer strings.


    ![](img/9aa003afabe05fdb07da46ad71325de6_57_0.png)


    > Generically, many data scientists extend this terminology. As string data gets
    bigger and more unwieldy, it is referred to as text data, and its analysis becomes
    text analysis or text mining.


    String (or text) data can be found in any of the file formats we talked about
    earlier in the chapter (delimited files, JSON, or web pages) and can be stored
    in or accessed by many of the storage solutions we talked about (APIs, DBMS, spreadsheets,
    and flat files). But no matter what the storage and delivery mechanism, it seems
    as though strings are most often discussed in same breath as big, messy, unstructured
    data. An Excel expert will be unfazed if asked to parse out the pieces of a few
    hundred street addresses or sort a few thousand book titles into categories. No
    statistician or programmer is going to blink if asked to count the character frequency
    in a word list. But when string manipulation turns into "extract the source code
    found embedded in 90 million e-mail messages written in Russian" or "calculate
    the lexical diversity of the entire contents of the Stack Overflow website", things
    get a lot more interesting.'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Other data types


    Numbers, dates/times, and strings are the big three data types, but there are
    many other types of exotic data that we will run into depending on what environment
    we are working in. Here is a quick rundown of some of the more interesting ones:


    +   - **Sets/enums**: If your data seems to only have a few choices for possible
    data values, you may be looking at a set or enumerated (enum) type. An example
    of enumerated data might be the set of possible final grades in a college course:
    {A, A-, B+, B, B-, C+, C, C-, D+, D, D-, F, W}.

    +   - **Booleans**: If your data is limited to one of just two selections, and
    they evaluate to 0/1 or true/false, you may be looking at Boolean data. A database
    column called package_shipped might have values of either yes or no, indicating
    whether a package has been shipped out.

    +   - **Blobs (binary large objects)**: If your data is binary, for example, you
    are storing the actual bytes for a picture file (not just the link to it) or the
    actual bytes for an mp3 music file, then you are probably looking at blob data.


    # Converting between data types


    Conversions between data types are an inevitable part of the cleaning job. You
    may be given string data, but you know that you need to perform math on it, so
    you wish to store it as a number. You may be given a date string in one format
    but you want it in a different date format. Before we go any further, though,
    we need to discuss a potential problem with conversions.


    # Data loss


    There is a risk of losing data when converting from one data type to another.
    Usually, this happens when the target data type is not capable of storing as much
    detail as the original data type. Sometimes, we are not upset by data loss (in
    fact, there may even be times when a cleaning procedure will warrant some intentional
    loss), but if we are not expecting the data loss, it can be devastating. Risk
    factors include:


    +   - **Converting between different sizes of the same data type**: Suppose you
    have a string column that is 200 characters long and you decide to move the data
    to a column that is only 100 characters long. Any data that exceeds 100 characters
    might be chopped off or truncated. This can also happen when switching between
    different sizes of numeric columns, for example, when going from big integers
    to regular integers or from regular integers to tiny integers.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '+   - **Converting between different levels of precision:** Suppose you have
    a list of decimal numbers that are precise to four digits, and then you convert
    them to two digits of precision, or even worse, to integers. Each number will
    be rounded off or truncated, and you will lose the precision that you had.


    # Strategies for conversion


    There are many strategies to handle data type conversions, and which one you use
    depends on where the data is being stored at the moment. We are going to cover
    two of the most common ways in which we encounter data type conversions in the
    data science cleaning process.


    The first strategy, SQL-based manipulation, will apply if we have data in a database.
    We can use database functions, available in nearly every database system, to slice
    and dice the data into a different format, suitable for either exporting as a
    query result or for storing in another column.


    The second strategy, file-based manipulation, comes into play when we have been
    given a flat file of data – for example, a spreadsheet or JSON file – and we need
    to manipulate the data types in some way after reading them out of the file.


    # Type conversion at the SQL level


    Here, we will walk through a few common cases when SQL can be used to manipulate
    data types.


    # Example one – parsing MySQL date into a formatted string


    For this example, we will return to the Enron e-mail dataset we used in Chapter
    1, Why Do You Need Clean Data?. As with the previous example, we are going to
    look in the message table, where we have been using the date column, which is
    stored as a datetime MySQL data type. Suppose we want to print a full date with
    spelled-out months (as opposed to numbers) and even the day of the week and time
    of day. How can we best achieve this?


    For the record with the message ID (mid) of 52, we have:


    ```

    2000-01-21 04:51:00

    ```'
  merge: -1
  img_proc: true
- pgno: 60
