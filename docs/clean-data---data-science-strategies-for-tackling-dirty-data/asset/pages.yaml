    \  => $row['numMsg']));\n}\necho json_encode($counts);\n?>\n```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_67_0.png)\n\
    \nNote that the json_encode() function requires PHP version 5.3 or higher, and\
