  md: '# Method three – Chrome Scraper


    If you really do not want to write a program to parse out data, there are several
    browser-based tools that use a tree structure to allow you to identify and extract
    the data you are interested in. I think the easiest to use with minimum work is
    a Chrome extension called Scraper, created by a developer called mnmldave (real
    name: Dave Heaton).


    # Step one – install the Scraper Chrome extension


    Download the Chrome browser if you do not already have that running. Make sure
    that you get the correct Scraper extension; there are several extensions that
    have very similar names. I recommend using the developer''s own GitHub site for
    this product, available at http://mnmldave.github.io/scraper/. This way you will
    be able to have the correct scraper tool, rather than trying to search using the
    Chrome store. From the http://mnmldave.github.io/scraper site, click the link
    to install the extension from the Google Store, and restart your browser.


    # Step two – collect data from the website


