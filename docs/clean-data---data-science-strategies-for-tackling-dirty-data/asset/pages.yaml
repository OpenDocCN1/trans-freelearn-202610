    in open source tools


    +   1. Explore how to analyze your data in various innovative ways and turn them
    into insight.

    +   2. Learn to use the D3.js visualization tool for exploratory data analysis.

    +   3. Understand how to work with graphs and social data analysis.

    +   4. Discover how to perform advanced query techniques and run MapReduce on
    MongoDB.'
