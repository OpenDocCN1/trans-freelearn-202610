- pgno: 217
  md: "At this point, we have a fully functional MySQL database comprised of eight\
    \ tables, each of which is filled with data. However, these tables are very large.\
    \ There are over 190 million rows in only eight tables. One thing we will notice\
    \ as we start to clean the data and prepare it for analysis, is that if we make\
    \ a mistake on a very large table like posts, comments, votes, or post_history,\
    \ rebuilding the table will take a long time. In the next step, we learn how to\
    \ create test tables, so that we contain the damage if one of our programs or\
    \ queries goes awry.\n\n# Building test tables\n\nIn this section, we will build\
    \ eight smaller versions of our original tables, each randomly populated with\
    \ data from the original tables.\n\nOur first step is to re-run the CREATE statements,\
    \ but this time prefix each table name with test_ as shown with one table here:\n\
    \n```\n```sql\nDROP TABLE IF EXISTS test_post_links;\nCREATE TABLE test_post_links\
    \ (\n    Id INT NOT NULL PRIMARY KEY,\n    CreationDate INT,\n    PostId INT,\n\
    \    RelatedPostId INT,\n    LinkTypeId INT\n);\n```\n```\n\nOther than the addition\
    \ of test_ to the front of the table name, these eight test tables will be identical\
    \ to the others we made earlier.\n\nNext, we need to populate our new test tables\
    \ with data. We could simply select the first 1,000 rows from each table and load\
    \ those into our test tables. However, the downside of doing that is that the\
    \ rows are in order based on when they were inserted into the Stack Overflow database,\
    \ so we will not have a good sample of rows from different dates and time in our\
    \ subset if we just ask for the first 1,000 rows. We would like the rows we select\
    \ to be of a fairly random distribution. How can we select a set of rows randomly?\
    \ We have not had to tackle this question before in this book, so here is another\
    \ case where we have to be ready to try new things in order to have our data science\
    \ dinner party go off without a hitch."
  merge: -1
  img_proc: true
- pgno: 218
  md: "There are a few possibilities for selecting random rows, some of which are\
    \ more efficient than others. Efficiency will be important to us in this project,\
    \ since the tables we are working with are quite large. One thing that makes our\
    \ random row selection a little trickier than expected, is that while our tables\
    \ do have a numeric primary key as the Id column, these Id numbers are not sequential.\
    \ There are many holes, for example, in the post_links table, the first few values\
    \ in the Id column are 19, 37, 42, and 48.\n\nHoles in the data are problematic\
    \ because a simple randomizer operates like this:\n\n+   1. Construct a PHP script\
    \ that asks for the lowest and highest Id values in the table, like this:\n+ \
    \  \n+   ```sql\n+   SELECT min(Id) FROM post_links;\n+   SELECT max(Id) FROM\
    \ post_links;\n+   ```\n+   2. Then, still in the script, generate some random\
    \ number between the min and the max value, and request the row with that random\
    \ value:\n+   \n+   ```sql\n+   SELECT * FROM post_links WHERE Id = [random value];\n\
    +   ```\n+   3. Repeat step 2 for as many rows as you need.\n\nUnfortunately,\
    \ doing this in the Stack Overflow database tables, for example, on our post_links\
    \ table, will result in many failed queries, since our data has so many holes\
    \ in the Id column, for example, what if step 2 in the preceding example generated\
    \ the number 38? There is no Id of 38 in our post_links table. This means we will\
    \ need to detect this error and try again with a new random value.\n\n![](img/9aa003afabe05fdb07da46ad71325de6_218_0.png)\n\
    \n> > At this point, someone who knows a little SQL — but not a lot — will usually\
    \ suggest that we just ask MySQL to ORDER BY rand() on the column with the Id\
    \ in it, and then perform a LIMIT command to skim off the number of records we\
    \ want. The problem with this idea is that even if the column we are ordering\
    \ is an indexed column, ORDER BY rand() has to read every row in order to assign\
    \ a new random number to it. So, on a very large table, like the tables we have\
    \ in the Stack Overflow database, this does not scale at all. We will be waiting\
    \ way too long for an ORDER BY rand() query to finish. ORDER BY rand() is a tolerable\
    \ solution for small tables, but not for the sizes we are working with here.\n\
    \nThe following PHP script shows how our final random row selection process will\
    \ work to build eight test tables, each with exactly 1,000 rows. Each table will\
    \ be populated by row values that are selected as randomly as possible with as\
    \ little effort as possible, and without us over-engineering this simple problem:\n\
    \n```\n<?php //randomizer.php\n// how many rows should be in each of the test\
    \ tables?\n```"
  merge: -1
  img_proc: true
- pgno: 219
  md: "```\n$table_target_size = 1000;\n\n// connect to db, set up query, run the\
    \ query\n$dbc = mysqli_connect('localhost','username','password','stackoverflow')\n\
    \    or die('Error connecting to database!' . mysqli_error());\n$dbc->set_charset(\"\
    utf8\");\n\n$tables = array(\"badges\",\n    \"comments\",\n    \"posts\",\n \
    \   \"post_history\",\n    \"post_links\",\n    \"tags\",\n    \"users\",\n  \
    \  \"votes\");\n\nforeach ($tables as $table)\n{\n    echo \"\\n=== Now working\
    \ on $table ===\\n\";\n    $select_table_info = \"SELECT count(Id) as c, min(Id)\
    \ as mn,\n        max(Id) as mx FROM $table\";\n    $table_info = mysqli_query($dbc,\
    \ $select_table_info);\n    $table_stuff = mysqli_fetch_object($table_info);\n\
    \    $table_count = $table_stuff->c;\n    $table_min = $table_stuff->mn;\n   \
    \ $table_max = $table_stuff->mx;\n\n    // set up loop to grab a random row and\
    \ insert into new table\n    $i=0;\n    while($i < $table_target_size)\n    {\n\
    \        $r = rand($table_min, $table_max);\n        echo \"\\nIteration $i: $r\"\
    ;\n        $insert_rowx = \"INSERT IGNORE INTO test_$table (SELECT *\n       \
    \     FROM $table WHERE Id = $r)\";\n        $current_row = mysqli_query($dbc,\
    \ $insert_rowx);\n\n        $select_current_count = \"SELECT count(*) as rc FROM\n\
    \            test_$table\";\n        $current_count= mysqli_query($dbc, $select_current_count);\n\
    \        $row_count = mysqli_fetch_object($current_count)->rc;\n        $i = $row_count;\n\
    \    }\n}\n?>\n```"
  merge: -1
