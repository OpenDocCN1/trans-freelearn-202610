- pgno: 173
  md: '# 7


    # RDBMS Cleaning Techniques


    Home refrigerators all come with shelves and most have one or two drawers for
    vegetables. But if you ever visit a home organization store or talk to a professional
    organizer, you will learn that there are also numerous additional storage options,
    including egg containers, cheese boxes, soda can dispensers, wine bottle holders,
    labeling systems for leftovers, and stackable, color-coded bins in a variety of
    sizes. But do we really need all these extras? To answer this, ask yourself these
    questions, are my frequently used foods easy to find? Are food items taking up
    more space than they should? Are leftovers clearly labeled so I remember what
    they are and when I made them? If our answers are no, organization experts say
    that containers and labels can help us optimize storage, reduce waste, and make
    our lives easier.


    The same is true in our **Relational Database Management System (RDBMS)**. As
    the classic long-term data storage solution, RDBMS is a standard part of the modern
    data science toolkit. But all too often, we are guilty of just depositing data
    in the database, with little thought about the details. In this chapter, we will
    learn how to design an RDBMS that goes beyond *two shelves and a drawer*. We will
    learn a few techniques that will ensure our RDBMS is optimizing storage, reducing
    waste, and making our lives easier. Specifically, we will:


    +   - Learn how to find anomalies in our RDBMS data

    +   - Learn several strategies to clean different types of problematic data

    +   - Learn when and how to create new tables for your cleaned data, including
    creating both child tables and lookup tables

    +   - Learn how to document the rules governing the changes you made'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Getting ready


    To set up the examples in this chapter, we will be working with a popular dataset
    called **Sentiment140**. This dataset was created to help learn about the positive
    and negative sentiments in messages on Twitter. We are not really concerned with
    sentiment analysis in this book, but we are going to use this dataset to practice
    cleaning data after it has already been imported into a relational database.


    To get started with the Sentiment140 dataset, you will need a MySQL server set
    up and ready to go, just like in the earlier Enron examples.


    # Step one – download and examine Sentiment140


    The version of the Sentiment140 data that we want to use is the original set of
    two files available directly from the Sentiment140 project at `http://help.sentiment140.com/for-students`.
    This ZIP file of tweets and their positive and negative polarity (or sentiment,
    on a scale of 0, 2, or 4) was created by some graduate students at Stanford University.
    Since this file was made publicly available, the original Sentiment140 files have
    been added by other websites and made available as part of many larger collections
    of tweets. For this chapter, we will use the original Sentiment140 text file,
    which is either available as a link from the preceding site or by following the
    precise path to `http://cs.stanford.edu/people/alecmgo/trainingandtestdata.zip`.


    Download the ZIP file, extract it, and take a look at the two CSV files inside
    using your text editor. Right away, you will notice that one file has many more
    lines than the other, but both these files have the same number of columns in
    them. The data is comma-delimited, and each column has been enclosed in double
    quotes. The description of each column can be found on the `for-students` page
    linked in the preceding section.


    # Step two – clean for database import


    For our purposes—learning how to clean data—it will be sufficient to load the
    smaller of these files into a single MySQL database table. Everything we need
    to do to learn, we can accomplish with the smaller file, the one called `testdata.manual.2009.06.14.csv`.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'As we are looking at the data, we may notice a few areas that will trip us
    up if we try to import this file directly into MySQL. One of the trouble spots
    is located at line 28 in the file:


    ```

    "4","46","Thu May 14 02:58:07 UTC 2009","""booz allen""",

    ```


    Do you see the triple quotation marks """ right before the booz keyword and after
    the word allen? The same issue comes up later on line 41 with double quotation
    marks around the song title P.Y.T.:


    ```

    "4","131","Sun May 17 15:05:03 UTC 2009","Danny Gokey","VickyTigger","I''m listening
    to ""P.Y.T"" by Danny Gokey..."

    ```


    The problem with these extra quotation marks is that the MySQL import routine
    will use the quotation marks to delimit the column text. This will produce an
    error, as MySQL will think that the line has more columns than there really are.


    To fix this, in our text editor, we can use Find and Replace to replace all instances
    of """ with " (double quote) and all instances of " with '' (single quote).


    ![](img/9aa003afabe05fdb07da46ad71325de6_175_0.png)


    > These " could also probably be removed entirely with very little negative effect
    on this cleaning exercise. To do this, we would simply search for " and replace
    it with nothing. But if you want to stick close to the original intent of the
    tweet, a single quote (or even an escaped double quote like this \") is a safe
    choice for a replacement character.


    Save this cleaned file to a new filename, something like cleanedTestData.csv.
    We are now ready to import it into MySQL.


    # Step three – import the data into MySQL in a single table


    To load our somewhat cleaner data file into MySQL, we will need to revisit the
    CSV-to-SQL techniques from the Importing spreadsheet data into MySQL section in
    Chapter 3, Workhorses of Clean Data – Spreadsheets and Text Editors:


    +   1. From the command line, navigate to the directory where you have saved the
    file you created in step two. This is the file we are going to import into MySQL.

    +   2. Then, launch your MySQL client, and connect to your database server:


    ```

    user@machine:~/sentiment140$ mysql -hlocalhost -umsquire -p

    Enter password:

    ```'
  merge: -1
  img_proc: true
- pgno: 176
  md: '3. Enter your password, and after you are logged in, create a database within
    MySQL to hold the table, as follows:


    ```

    mysql> CREATE DATABASE sentiment140;

    mysql> USE sentiment140;

    ```


    4. Next, we need to create a table to hold the data. The data type and lengths
    for each column should represent our best attempt to match the data we have. Some
    of the columns will be varchars, and each of them will need a length. As we might
    not know what those lengths should be, we can use our cleaning tools to discern
    an appropriate range.


    5. If we open our CSV file in Excel (Google Spreadsheets will work just fine for
    this as well), we can run some simple functions to find the maximum lengths of
    some of our text fields. The len() function, for example, gives the length of
    a text string in characters, and the max() function can tell us the highest number
    in a range. With our CSV file open, we can apply these functions to see how long
    our varchar columns in MySQL should be.


    The following screenshot shows a method to use functions to solve this problem.
    It shows the length() function applied to column G, and the max() function used
    in column H but applied to column G.


    ![](img/9aa003afabe05fdb07da46ad71325de6_176_0.png)


    Columns G and H show how to get the length of a text column in Excel and then
    get the maximum value.


    6. To calculate these maximum lengths more quickly, we can also take an Excel
    shortcut. The following array formula can work to quickly combine the maximum
    value with the length of a text column in a single cell – just make sure you press
    Ctrl + Shift + Enter after typing this nested function rather than just Enter:


    ```

    =max(len(f1:f498))

    ```


    This nested function can be applied to any text column to get the maximum length
    of the text in that column, and it only uses a single cell to do this without
    requiring any intermediate length calculations.


    After we run these functions, it turns out that the maximum length for any of
    our tweets is 144 characters.'
  merge: -1
  img_proc: true
- pgno: 177
  md: "# Detecting and cleaning abnormalities\n\nYou might be wondering how a tweet\
    \ in this dataset could possibly be 144 characters long as Twitter limits all\
    \ tweets to a maximum length of 140 characters. It turns out that in the sentiment140\
    \ dataset, the & character was sometimes translated to the HTML equivalent code,\
    \ &amp;, but not always. Some other HTML code was used too, for instance, sometimes,\
    \ the < character became &lt; and > became &gt;. So, for a few very long tweets,\
    \ this addition of just a few more characters can easily push this tweet over\
    \ the length limit of 140. As we know that these HTML-coded characters were not\
    \ what the original person tweeted, and because we see that they happen sometimes\
    \ but not all the time, we call these data abnormalities.\n\nTo clean these, we\
    \ have two choices. We can either go ahead and import the messy data into the\
    \ database and try to clean it there, or we can attempt to clean it first in Excel\
    \ or a text editor. To show the difference in these two techniques, we will do\
    \ both here. First, we will use find and replace in our spreadsheet or text editor\
    \ to try to convert the characters shown in the following table. We can import\
    \ the CSV file into Excel and see how much cleaning we can do there:\n\n| HTML\
    \ code | Replace with | The count of instances | The Excel function used to find\
    \ count |\n|---|---|---|---|\n| &lt; | < | 6 | =COUNTIF(F1:F498,\"*&lt;*\") |\n\
    | &gt; | > | 5 | =COUNTIF(F1:F498,\"*&gt;*\") |\n| &amp; | & | 24 | =COUNTIF(F1:F498,\"\
    *&amp;*\") |\n\nThe first two character swaps work fine with Find and Replace\
    \ in Excel. The &lt; and &gt; HTML-encoded characters are changed. Take a look\
    \ at the text like this:\n\n```\nI'm listening to 'P.Y.T' by Danny Gokey &lt;3\
    \ &lt;3 &lt;3 Aww,\n    he's so amazing. I &lt;3 him so much :)\n```\n\nThe preceding\
    \ becomes text like this:\n\n```\nI'm listening to 'P.Y.T' by Danny Gokey <3 <3\
    \ <3 Aww, he's so\n    amazing. I <3 him so much :)\n```"
  merge: -1
  img_proc: true
- pgno: 178
  md: 'However, when we attempt to use Excel to find &amp; and replace it with &,
    you may run into an error, as shown:


    ![](img/9aa003afabe05fdb07da46ad71325de6_178_0.png)


    Some operating systems and versions of Excel have a problem with our selection
    of the & character as a replacement. At this point, if we run into this error,
    we could take a few different approaches:


    +   - We could use our search engine of choice to attempt to find an Excel solution
    to this error

    +   - We could move our CSV text data into a text editor and perform the find
    and replace function in there

    +   - We could forge ahead and throw the data into the database despite it having
    the weird &amp; characters in it and then attempt to clean it inside the database


    Normally, I would be in favor of not moving dirty data into the database if it
    is even remotely possible to clean it outside of the database. However, as this
    is a chapter about cleaning inside a database, let''s go ahead and import the
    half-cleaned data into the database, and we will work on cleaning the &amp; issue
    once the data is inside the table.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "# Creating our table\n\nTo move our half-cleaned data into the database, we\
    \ will first write our CREATE statement and then run it on our MySQL database.\
    \ The CREATE statement is shown as follows:\n\n```\nmysql> CREATE TABLE sentiment140\
    \ (\n    ->   polarity enum('0','2','4') DEFAULT NULL,\n    ->   id int(11) PRIMARY\
    \ KEY,\n    ->   date_of_tweet varchar(28) DEFAULT NULL,\n    ->   query_phrase\
    \ varchar(10) DEFAULT NULL,\n    ->   user varchar(10) DEFAULT NULL,\n    -> \
    \  tweet_text varchar(144) DEFAULT NULL\n    -> ) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n\
    ```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_179_0.png)\n\n> This statement\
    \ uses the simple and fast MyISAM engine as we do not anticipate needing any InnoDB\
    \ features such as row-level locking or transactions. For more on the difference\
    \ between MyISAM and InnoDB, there is a handy discussion of when to use each storage\
    \ engine located here: http://stackoverflow.com/questions/20148/myisam-versus-innod\
    \ b.\n\nYou might notice that the code still requires 144 for the length of the\
    \ tweet_text column. This is because we were unable to clean these columns with\
    \ the &amp; code in them. However, this does not bother me too much because I\
    \ know that varchar columns will not use their extra space unless they need it.\
    \ After all, this is why they are called varchar, or variable character, columns.\
    \ But if this extra length really bothers you, you can alter the table later to\
    \ only have 140 characters for that column.\n\nNext, we will use the MySQL command\
    \ line to run the following import statement from the location:\n\n```\nmysql>\
    \ LOAD DATA LOCAL INFILE 'cleanedTestData.csv'\n    ->   INTO TABLE sentiment140\n\
    \    ->   FIELDS TERMINATED BY ',' ENCLOSED BY '\"' ESCAPED BY '\\\\'\n    ->\
    \   (polarity, id, date_of_tweet, query_phrase, user,\n        tweet_text);\n\
    ```\n\nThis command loads the data from our cleaned CSV file into the new table\
    \ we created. A success message will look like this, indicating that all 498 rows\
    \ were loaded into the table:\n\n```\nQuery OK, 498 rows affected (0.00 sec)\n\
    Records: 498  Deleted: 0  Skipped: 0  Warnings: 0\n```"
  merge: -1
  img_proc: true
- pgno: 180
  md: 'If you have access to a browser-based interface such as phpMyAdmin (or a desktop
    application such as MySQL Workbench or Toad for MySQL), all of these SQL commands
    can be completed inside these tools very easily and without having to type on
    the command line, for example, in phpMyAdmin, you can use the Import tab and upload
    the CSV file there. Just make sure that the data file is cleaned following the
    procedures in Step two – clean for database import, or you may get errors about
    having too many columns in your file. This error is caused by quotation mark problems.


    ![](img/9aa003afabe05fdb07da46ad71325de6_180_0.png)


    # Step four – clean the &amp; character


    In the last step, we decided to postpone cleaning the &amp; character because
    Excel was giving a weird error about it. Now that we have finished Step three
    – import the data into MySQL in a single table and our data is imported into MySQL,
    we can very easily clean the data using an UPDATE statement and the replace()
    string function. Here is the SQL query needed to take all instances of &amp; and
    replace them with &:


    ```

    ```sql

    UPDATE sentiment140 SET tweet_text = replace(tweet_text,''&amp;'',

    ''&'');

    ```

    ```


    The replace() function works just like find and replace in Excel or in a text
    editor. We can see that tweet ID 594, which used to say #at&amp;t is complete
    fail, now reads #at&t is complete fail.


    # Step five – clean other mystery characters


    As we are perusing the tweet_text column, we may have noticed a few odd tweets,
    such as tweet IDs 613 and 2086:


    ```

    ```

    613, Talk is Cheap: Bing that, I?ll stick with Google

    2086, Stanford University?s Facebook Profile

    ```

    ```


    The ? character is what we should be concerned about. As with the HTML-encoded
    characters we saw earlier, this character issue is also very likely an artifact
    of a prior conversion between character sets. In this case, there was probably
    some kind of high-ASCII or Unicode apostrophe (sometimes called a smart quote)
    in the original tweet, but when the data was converted into a lower-order character
    set, such as plain ASCII, that particular flavor of apostrophe was simply changed
    to a ?.'
