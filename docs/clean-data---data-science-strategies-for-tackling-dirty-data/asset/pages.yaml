- pgno: 257
  md: '# Moving this process into full (non-test) tables


    Just like in *Chapter 9, Stack Overflow Project*, we made test tables so that
    we could develop our project in a stress-free environment with a manageable number
    of tweets to collect. When you are ready to collect the full list of tweets, be
    ready to spend some time doing so. Twitter''s rate limits will kick in, and twarc
    will take a long time to run. Ed Summers indicates on this blog post that it will
    take about one week to run the Ferguson tweets: http://inkdroid.org/journal/2014/11/18/on-forgetting/.
    Of course, if you are careful, you will only have to run it once.


    Another thing you could do to speed up the time it takes to hydrate the tweet
    IDs is to work as a team with someone else. You can divide the tweet ID file in
    half and each work on your portion of the tweets. During the data cleaning process,
    make sure you INSERT both into the same final database table.


    Here are the steps we will follow to change our project to collect the full set
    of tweets rather than the 1,000-tweet sample:


    +   1. Empty the `ferguson_tweets`, `ferguson_tweets_hashtags`, `ferguson_tweets_mentions`,
    and `ferguson_tweets_urls` tables as follows:

    +   ```sql

    +   TRUNCATE TABLE ferguson_tweets;

    +   TRUNCATE TABLE ferguson_tweets_hashtags;

    +   TRUNCATE TABLE ferguson_tweets_mentions;

    +   TRUNCATE TABLE ferguson_tweets_urls;

    +   ```

    +   2. Run twarc on the full `ids.txt` file rather than the `ids_1000.txt` file
    as follows:

    +   ```bash

    +   twarc.py --consumer_key abcd --consumer_secret abcd --access_token abcd --access_token_secret
    abcd --hydrate ids.txt > tweets.json

    +   ```

    +   3. Re-run the `jsonTweetCleaner.py` Python script.


    At this point, you will have a cleaned database full of tweets, hashtags, mentions,
    and URLs, ready for analysis and visualization. Since there are so many more rows
    now in each table, be aware that each of the visualization steps could take much
    longer to run, depending on what kind of queries you are running.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Summary


    In this project, we learned how to reconstruct a list of tweets based on their
    identification numbers. First, we located high-quality archived tweet data that
    conforms to Twitter''s latest ToS. We learned how to split it into a set small
    enough for testing purposes. Then, we learned how to hydrate each tweet into a
    full JSON representation of itself, using the Twitter API and the twarc command-line
    tool. Next, we learned how to extract pieces of the JSON entities in Python, saving
    the fields to a new set of tables in our MySQL database. We then ran some simple
    queries to count the most common URLs, and we drew a bar graph using D3.


    In this book, we have learned how to perform a variety of data cleaning tasks,
    both simple and complex. We used a variety of languages, tools, and techniques
    to get the job done, and along the way, I hope you were able to perfect your existing
    skills while learning many new ones.


    At this point, our final dinner party is complete, and you are now ready to begin
    your own cleaning projects in your fully stocked — and very clean — data science
    kitchen. Where should you begin?


    +   - Do you like contests and prizes? Kaggle hosts frequent data analysis competitions
    at their website, http://kaggle.com. You can work alone or as part of a team.
    Many teams need clean data, so that is a fantastic way to pitch in.

    +   - If you are more of a public service kind of person, may I suggest School
    of Data? Their website is at http://schoolofdata.org, and they host courses and
    Data Expeditions where experts and amateurs from around the world get together
    and solve real-world problems using data.

    +   - To extend your data cleaning practice, I highly recommend getting your hands
    dirty with some of the many publicly-available data sets out there. KDnuggets
    has a nice list of them here, including some lists of lists: http://www.kdnuggets.com/datasets/.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '+   - Did you like the Stack Overflow examples in *Chapter 9, Stack Overflow
    Project?* The *Meta* Stack Exchange, available at `http://meta.stackexchange.com`,
    is a site just for discussing the way StackExchange sites work. Users discuss
    hundreds of amazing ideas for how to query Stack Overflow data and what to do
    with what they find. Or, you can always contribute to the large body of questions
    on Stack Overflow itself that are related to data cleaning. Finally, there are
    several other Stack Exchange sites that are also related to data cleaning. One
    useful site is the Open Data Stack Exchange, available at `http://opendata.stackexchange.com`.

    +   - Twitter data is extremely popular right now. If you liked working with Twitter
    data, consider taking our *Chapter 10, Twitter Project*, project to the next level
    by asking and answering your own questions about one of those publicly-available
    tweet collections. Or, how about collecting and curating a new set of tweet IDs
    of your own? If you build clean collections of tweet IDs on some topic of interest,
    you can distribute those and researchers and other data scientists will be extremely
    grateful.


    Good luck in your data cleaning adventures, and *bon appetit*!'
  merge: -1
