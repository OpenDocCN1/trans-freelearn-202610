  md: 'But since this is a book about data cleaning, and since we still have not even
    visualized this data, I will restrain myself and not answer these for the time
    being. We still have one of our original three questions to answer, and then we
    will move on to visualizing some of our results.


    # Do posts contain both URLs to paste sites and source code?


    Answering our third question requires us to compare the amount of code in the
    Stack Overflow questions to the amount in the Stack Overflow answers, paying particular
    attention to the posts that include some sort of source code, delimited by the
    <code> tags. In the Step three – cleaning the data section, we extracted all code
    from the posts in our test tables, and created a new table to hold these code
    snippets. Now, a simple query to figure out how many code-containing posts there
    are is as follows:


    ```

    SELECT count(DISTINCT postid)

    FROM clean_posts_code;

    ```


    In my sample set, this yields 664 code-containing posts, out of the total 1,000
    test posts. Another way to put this is: 664 out of 1,000 posts contain at least
    one <code> tag.


    To figure out how many of these code-containing posts also contained any URL,
    we can run the following SQL query:


    ```

    SELECT count(DISTINCT cpc.postid)

    FROM clean_posts_code cpc

    INNER JOIN clean_posts_urls cpu

    ON cpu.postId = cpc.postId;

    ```


    My sample set yields 175 rows for this. We can interpret that by saying that 17.5
    percent of the original test set of 1,000 posts contains code and a URL.


    Now, to figure out how many of the code-containing posts also contained a paste
    site URL, we will narrow down the SQL query even further:


    ```

    SELECT count(DISTINCT cpc.postid)

    FROM clean_posts_code cpc

    INNER JOIN clean_posts_urls cpu

    ON cpu.postId = cpc.postId

    WHERE cpu.url LIKE ''%jsfiddle%''

    OR cpu.url LIKE ''%jsbin%''

    OR cpu.url LIKE ''%pastebin%''

    OR cpu.url LIKE ''%dpaste%''

    OR cpu.url LIKE ''%gist%''

    OR cpu.url LIKE ''%pastie%'';

    ```'
