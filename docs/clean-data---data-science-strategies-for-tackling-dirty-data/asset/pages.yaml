- pgno: 129
  md: '# 5

    Collecting and Cleaning Data

    from the Web


    One of the most common and useful kitchen tools is a strainer, also called a sieve,
    a colander, or chinois, the purpose of which is to separate solids from liquids
    during cooking. In this chapter, we will be building strainers for the data we
    find on the Web. We will learn how to create several types of programs that can
    help us find and keep the data we want, while discarding the parts we do not want.


    In this chapter, we will:


    +   - Understand two options to envision the structure of an HTML page, either
    (a) as a collection of lines that we can look for patterns in, or (b) as a tree
    structure containing nodes for which we can identify and collect values.

    +   - Try out three methods to parse web pages, one that uses the line-by-line
    approach (regular expressions-based HTML parsing), and two that use the tree structure
    approach (Python''s BeautifulSoup library and the Chrome browser tool called Scraper).

    +   - Implement all three of these techniques on some real-world data; we will
    practice scraping out the date and time from messages posted to a web forum.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Understanding the HTML page structure


    A web page is just a text file that contains some special markup **elements**
    (sometimes called HTML **tags**) intended to indicate to a web browser how the
    page should look when displayed to the user, for example, if we want a particular
    word to be displayed in a way that indicates emphasis, we can surround it with
    `<em>` tags like this:


    It is `<em>very important</em>` that you follow these instructions.


    All web pages have these same features; they are made up of text and the text
    may include tags. There are two main mental models we can employ to extract data
    from web pages. Both models have their useful aspects. In this section, we will
    describe the two structural models, and then in the next section, we will use
    three different tools for extracting data.


    # The line-by-line delimiter model


    In the simplest way of thinking about web pages, we concentrate on the fact that
    there are many dozens of HTML elements/tags that are used to organize and display
    pages on the Web. If we want to extract interesting data from web pages in this
    simple model, we can use the page text and the embedded HTML elements themselves
    as **delimiters**. For instance, in case of the preceding example, we may decide
    we want to collect everything inside the `<em>` tags, or maybe we want to collect
    everything before an `<em>` tag or after an `</em>` tag.


    In this model, we conceive the web page as a collection of largely unstructured
    text, and the HTML tags (or other features of the text, such as recurring words)
    help to provide structure which we can use to delimit the parts that we want.
    Once we have delimiters, we have the ability to strain out the interesting data
    from the junk.


    For example, here is an excerpt from a real-world HTML page, a chat log from the
    Django IRC channel. Let''s consider how we can use its HTML elements as delimiters
    to extract the interesting data:


    ```

    <div id="content">

    <h2>Sep 13, 2014</h2>


    <a href="/2014/sep/14/">← next day</a> Sep 13, 2014 <a href="/2014/sep/12/">previous
    day →</a>


    <ul id="ll">

    <li class="le" rel="petisnnake"><a href="#1574618" name="1574618">#</a> <span
    style="color:#b78a0f;8" class="username" rel="petisnnake">&lt;petisnnake&gt;</span>
    i didnt know that </li>

    ```'
  merge: -1
  img_proc: true
- pgno: 131
  md: '```

    ...

    </ul>

    ...

    </div>

    ```


    Given this example text, we could use the <h2></h2> tags as delimiters to extract
    the date of this particular chat log. We could use the <li></li> tags as delimiters
    for a line of text, and within that line, we can see that rel="" can be used to
    extract the username of the chatter. Finally, it appears that all the text extending
    from the end of </span> to the beginning of </li> is the actual line message sent
    to the chat channel by the user.


    > These chat logs are all available online at the Django IRC log website, http://django-irc-logs.com.
    This website also provides a keyword search interface to the logs. The ellipses
    (...) in the preceding code represent text that has been removed for brevity in
    this example.


    From this messy text, we are able to use the delimiter concept to extract three
    clean pieces of data (the date of log, user, and line message).


    # The tree structure model


    Another way to imagine the textual web page is as a tree structure made up of
    HTML elements/tags, each of which is related to the other tags on the page. Each
    tag is shown as a node, and a tree is made up of all the different nodes in a
    particular page. A tag that shows up within another tag in the HTML is considered
    a child, and the enclosing tag is the parent. In the previous example of IRC chat,
    the HTML excerpt can be shown in a tree diagram that looks like this:


    ![](img/9aa003afabe05fdb07da46ad71325de6_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'If we are able to envision our HTML text as a tree structure, we can use a
    programming language to build a tree for us. This allows us to pull out our desired
    text values based on their element name or position in the element list. For example:


    +   - We may want the value of a tag by name (give me the text from the <h2> node)

    +   - We may want all the nodes of a particular type (give me all the <li> nodes
    which are inside <ul> which are inside <div>)

    +   - We may want all the attributes of a given element (give me a list of rel
    attributes from the <li> elements)


    In the rest of the chapter, we will put both of these mental models—the line-by-line
    and the tree structure—into practice with some examples. We will walk through
    three different methods to extract and clean the data out of HTML pages.


    # Method one – Python and regular expressions


    In this section, we will use a simple method to extract the data we want from
    an HTML page. This method is based on the concept of identifying delimiters in
    the page and using pattern matching via regular expressions to pull out the data
    we want.


    You may remember that we experimented a little bit with regular expressions (regex)
    in Chapter 3, Workhorses of Clean Data – Spreadsheets and Text Editors, when we
    were learning about text editors. In this chapter, some of the concepts will be
    similar, except we will write a Python program to find matching text and extract
    it instead of using a text editor for replacements like we did in that chapter.


    One final note before we start the example, although this regex method is fairly
    easy to understand, it does have some limitations which could be significant,
    depending on your particular project. We will describe the limitations of this
    method in detail at the end of the section.'
  merge: -1
  img_proc: true
