- pgno: 241
  md: '# Create a test version of the file


    In this stage, we will create a small test file to work with for the remainder
    of this project. The reasons we want to do this are the same reasons why we worked
    with test tables in the Chapter 9, Stack Overflow Project. Because the original
    files are extremely large, we want to work with a subset of the data in case we
    make a mistake. We also want to be able to test our code without taking too long
    to complete each step.


    Unlike in previous exercises, it probably does not matter if we select our test
    data lines randomly in this case. Just by looking at the result of the head command
    we ran earlier, we can see that the lines are not really in low-to-high order.
    In fact, we have no information about what order the original set of lines are
    in. Therefore, let''s just grab the first 1,000 tweet IDs and save them to a file.
    This will become our test set:


    ```

    head -1000 ids.txt > ids_1000.txt

    ```


    # Hydrate the tweet IDs


    We will now use this test set of 1,000 tweet IDs to test our procedure for collecting
    the original tweets based on their identification number. This process is called
    hydrating the tweets. To do this, we will use a handy Python tool called twarc,
    which was written by Ed Summers, the same person who archived all the Ferguson
    tweets. It works by taking a list of tweet IDs and fetching each original tweet
    from the Twitter API one by one. To do anything with the Twitter API, we must
    have a Twitter developer account already set up. Let''s make our Twitter account
    first, and then we can install twarc and use it.


    # Setting up a Twitter developer account


    To set up a Twitter developer account, go to https://apps.twitter.com and log
    in with your Twitter account. If you do not already have a Twitter account, you
    will need to make one of those in order to complete the rest of these steps.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'Once you are logged in with your Twitter account, from the http://apps.twitter.com
    page, click on **Create New App**. Fill in the required details to create your
    application (give it a name, perhaps something like My Tweet Test; a short description;
    and a URL, which does not have to be permanent). My filled-in app creation form
    is shown here for your reference:


    ![](img/9aa003afabe05fdb07da46ad71325de6_242_0.png)


    Twitter''s Create New App form, filled in with sample data


    Click on the checkbox indicating that you agree to the developer agreement, and
    you will be returned to the screen listing all your Twitter apps, with your new
    app at the top of the list.


    Next, to use this app, we will need to get a few key pieces of information that
    are required for it to work. Click on the app you just created, and you will see
