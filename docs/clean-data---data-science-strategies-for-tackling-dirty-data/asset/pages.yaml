    \ so that it looks like this:\n\n```\necho json_encode($counts, JSON_NUMERIC_CHECK);\n\
    ```\n\nNow the JSON result includes actual numbers for numMsg:\n\n```\n[\n   \
    \ {\"dateSent\":\"0001-05-30\",\"numMsg\":2},\n    {\"dateSent\":\"0001-06-18\"\
    ,\"numMsg\":1}\n]\n```"
