- pgno: 113
  md: "# CSV to JSON using Python\n\nWe have found several ways to convert CSV files\
    \ to JSON using Python. The first of these uses the built-in csv and json libraries.\
    \ Suppose we have a CSV file that has rows like this (only the first three rows\
    \ shown):\n\n```\nname,email_id\n\"Lysa Akin\",lysa.akin@enron.com\n\"Phillip\
    \ Allen\",k..allen@enron.com\n\"Harry Arora\",harry.arora@enron.com\n```\n\nWe\
    \ can write a Python program to read these rows and convert them to JSON:\n\n\
    ```\nimport json\nimport csv\n\n# read in the CSV file\nwith open('enronEmail.csv')\
    \ as file:\n    file_csv = csv.DictReader(file)\n    output = '['\n    # process\
    \ each dictionary row\n    for row in file_csv:\n        # put a comma between\
    \ the entities\n        output += json.dumps(row) + ','\n    output = output.rstrip(',')\
    \ + ']'\n# write out a new file to disk\nf = open('enronEmailPy.json','w')\nf.write(output)\n\
    f.close()\n```\n\nThe resulting JSON will look like this (only the first two rows\
    \ are shown):\n\n```\n[{\"email_id\": \"lysa.akin@enron.com\", \"name\": \"Lysa\
    \ Akin\"},\n{\"email_id\": \"k..allen@enron.com\", \"name\": \"Phillip Allen\"\
    },...]\n```\n\nOne nice thing about using this method is that it does not require\
    \ any special installations of libraries or any command-line access, apart from\
    \ getting and putting the files you are reading (CSV) and writing (JSON)."
  merge: -1
  img_proc: true
- pgno: 114
  md: "# CSV to JSON using csvkit\n\nThe second method of changing CSV into JSON relies\
    \ on a very interesting Python toolkit called **csvkit**. To install csvkit using\
    \ Canopy, simply launch the Canopy terminal window (you can find it inside Canopy\
    \ by navigating to **Tools | Canopy Terminal**) and then run the `pip install\
    \ csvkit` command. All the dependencies for using csvkit will be installed for\
    \ you. At this point, you have the option of accessing csvkit via a Python program\
    \ as a library using `import csvkit` or via the command line, as we will do in\
    \ the following snippet:\n\n```\ncsvjson enronEmail.csv > enronEmail.json\n```\n\
    \nThis command takes a `enronEmail.csv` CSV file and transforms it to a JSON `enronEmail.csvkit.json`\
    \ file quickly and painlessly.\n\nThere are several other extremely useful command-line\
    \ programs that come with the csvkit package, including `csvcut`, which can extract\
    \ an arbitrary list of columns from a CSV file, and `csvformat`, which can perform\
    \ delimiter exchanges on CSV files or alter line endings or similar cleaning procedures.\
    \ The `csvcut` program is particularly helpful if you want to extract just a few\
    \ columns for processing. For any of these command-line tools, you can redirect\
    \ its output to a new file. The following command line takes a file called `bigFile.csv`,\
    \ cuts out the first and third column, and saves the result as a new CSV file:\n\
    \n```\ncsvcut bigFile.csv -c 1,3 > firstThirdCols.csv\n```\n\n![](img/9aa003afabe05fdb07da46ad71325de6_114_0.png)\n\
    \nAdditional information about csvkit, including full documentation, downloads,\
    \ and examples, is available at http://csvkit.rtfd.org/.\n\n# Python JSON to CSV\n\
    \nIt is quite straightforward to use Python to read in a JSON file and convert\
    \ it to CSV for processing:\n\n```\nimport json\nimport csv\n\nwith open('enronEmailPy.json',\
    \ 'r') as f:\n    dicts = json.load(f)\nout = open('enronEmailPy.csv', 'w')\n\
    writer = csv.DictWriter(out, dicts[0].keys())\nwriter.writeheader()\nwriter.writerows(dicts)\n\
    out.close()\n```"
  merge: -1
  img_proc: true
