    | 3 | # | #1574619 |

    | 4 | # | #1574620 |

    | 5 | # | #1574621 |

    | 6 | # | #1574622 |


    We are not interested in column A at all, nor are we interested in the leading
    # symbol. The username and line message data is similar — we want most of it,
    but we would like to remove some symbols and combine everything into a single
    Google Spreadsheet.


    Using our find-and-replace techniques from Chapter 3, Workhorses of Clean Data
    – Spreadsheets and Text Editors (namely removing the #, <, and > symbols and pasting
    the rows into a single sheet), we end up with a single clean dataset that looks
