- pgno: 15
  md: "# Preface\n\n> \"Pray, Mr. Babbage, if you put into the machine the wrong figures,\
    \ will the right answer come out?\"\n> \n> – Charles Babbage (1864)\n\n> \"Garbage\
    \ in, garbage out\"\n> \n> – The United States Internal Revenue Service (1963)\n\
    \n> \"There are no clean datasets.\"\n> \n> – Josh Sullivan, Booz Allen VP in\
    \ Fortune (2015)\n\nIn his 1864 collection of essays, Charles Babbage, the inventor\
    \ of the first calculating machine, recollects being dumbfounded at the \"confusion\
    \ of ideas\" that would prompt someone to assume that a computer could calculate\
    \ the correct answer despite being given the wrong input. Fast-forward another\
    \ 100 years, and the tax bureaucracy started patiently explaining \"garbage in,\
    \ garbage out\" to express the idea that even for the all-powerful tax collector,\
    \ computer processing is still dependent on the quality of its input. Fast-forward\
    \ another 50 years to 2015: a seemingly magical age of machine learning, autocorrect,\
    \ anticipatory interfaces, and recommendation systems that know me better than\
    \ I know myself. Yet, all of these helpful algorithms still require high-quality\
    \ data in order to learn properly in the first place, and we lament \"there are\
    \ no clean datasets\"."
  merge: -1
  img_proc: true
- pgno: 16
  md: 'This book is for anyone who works with data on a regular basis, whether as
    a data scientist, data journalist, software developer, or something else. The
    goal is to teach practical strategies to quickly and easily bridge the gap between
    the data we want and the data we have. We want high-quality, perfect data, but
    the reality is that most often, our data falls far short. Whether we are plagued
    with missing data, data in the wrong format, data in the wrong location, or anomalies
    in the data, the result is often, to paraphrase rapper Notorious B.I.G., "more
    data, more problems".


    Throughout the book, we will envision data cleaning as an important, worthwhile
    step in the data science process: easily improved, never ignored. Our goal is
    to reframe data cleaning away from being a dreaded, tedious task that we must
    slog through in order to get to the real work. Instead, armed with a few tried-and-true
    procedures and tools, we will learn that just like in a kitchen, if you wash your
    vegetables first, your food will look better, taste better, and be better for
    you. If you learn a few proper knife skills, your meat will be more succulent
    and your vegetables will be cooked more evenly. The same way that a great chef
    will have their favorite knives and culinary traditions, a great data scientist
    will want to work with the very best data possible and under the very best conditions.


    # What this book covers


    Chapter 1, Why Do You Need Clean Data? motivates our quest for clean data by showing
    the central role of data cleaning in the overall data science process. We follow
    with a simple example showing some dirty data from a real-world dataset. We weigh
    the pros and cons of each potential cleaning process, and then we describe how
    to communicate our cleaning changes to others.


    Chapter 2, Fundamentals – Formats, Types, and Encodings, sets up some foundational
    knowledge about file formats, compression, and data types, including missing and
    empty data and character encodings. Each section has its own examples taken from
    real-world datasets. This chapter is important because we will rely on knowledge
    of these basic concepts for the rest of the book.


    Chapter 3, Workhorses of Clean Data – Spreadsheets and Text Editors, describes
    how to get the most data cleaning utility out of two common tools: the text editor
    and the spreadsheet. We will cover simple solutions to common problems, including
    how to use functions, search and replace, and regular expressions to correct and
    transform data. At the end of the chapter, we will put our skills to test using
    both of these tools to clean some real-world data regarding universities.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '*Chapter 4, Speaking the Lingua Franca – Data Conversions,* focuses on converting
    data from one format to another. This is one of the most important data cleaning
    tasks, and it is useful to have a variety of tools at hand to easily complete
    this task. We first proceed through each of the different conversions step by
    step, including back and forth between common formats such as comma-separated
    values (CSV), JSON, and SQL. To put our new data conversion skills into practice,
    we complete a project where we download a Facebook friend network and convert
    it into a few different formats so that we can visualize its shape.


    *Chapter 5, Collecting and Cleaning Data from the Web,* describes three different
    ways to clean data found inside HTML pages. This chapter presents three popular
    tools to pull data elements from within marked-up text, and it also provides the
    conceptual foundation to understand other methods besides the specific tools shown
    here. As our project for this chapter, we build a set of cleaning procedures to
    pull data from web-based discussion forums.


    *Chapter 6, Cleaning Data in PDF Files,* introduces several ways to meet this
    most stubborn and all-too-common challenge for data cleaners: extracting data
    that has been stored in Adobe''s Portable Document Format (PDF) files. We first
    examine low-cost tools to accomplish this task, then we try a few low-barrier-to-entry
    tools, and finally, we experiment with the Adobe non-free software itself. As
    always, we use real-world data for our experiments, and this provides a wealth
    of experience as we learn to work through problems as they arise.


    *Chapter 7, RDBMS Cleaning Techniques,* uses a publicly available dataset of tweets
    to demonstrate numerous strategies to clean data stored in a relational database.
    The database shown is MySQL, but many of the concepts, including regular-expression
    based text extraction and anomaly detection, are readily applicable to other storage
    systems as well.


    *Chapter 8, Best Practices for Sharing Your Clean Data,* describes some strategies
    to make your hard work as easy for others to use as possible. Even if you never
    plan to share your data with anyone else, the strategies in this chapter will
    help you stay organized in your own work, saving you time in the future. This
    chapter describes how to create the ideal data package in a variety of formats,
    how to document your data, how to choose and attach a license to your data, and
    also how to publicize your data so that it can live on if you choose.


    *Chapter 9, Stack Overflow Project,* guides you through a full-length project
    using a real-world dataset. We start by posing a set of authentic questions that
    we can answer about that dataset. In answering this set of questions, we will
    complete the entire data science process introduced in *Chapter 1, Why Do You
    Need Clean Data?* and we will put into practice many of the cleaning processes
    we learned in the previous chapters. In addition, because this dataset is so large,
    we will introduce a few new techniques to deal with the creation of test datasets.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Chapter 10, Twitter Project, is a full-length project that shows how to perform
    one of the hottest and fastest-changing data collection and cleaning tasks out
    there right now: mining Twitter. We will show how to find and collect an existing
    archive of publicly available tweets on a real-world current event while adhering
    to legal restrictions on the usage of the Twitter service. We will answer a simple
    question about the dataset while learning how to clean and extract data from JSON,
    the most popular format in use right now with API-accessible web data. Finally,
    we will design a simple data model for long-term storage of the extracted and
    cleaned data and show how to generate some simple visualizations.


    # What you need for this book


    To complete the projects in this book, you will need the following tools:


    +   - A web browser, Internet access, and a modern operating system. The browser
    and operating system should not matter, but access to a command-line terminal
    window is ideal (for example, the Terminal application in OS X). In Chapter 5,
    Collecting and Cleaning Data from the Web, one of the three activities relies
    on a browser-based utility that runs in the Chrome browser, so keep this in mind
    if you would like to complete this activity.

    +   - A text editor, such as Text Wrangler for Mac OSX or Notepad++ for Windows.
    Some integrated development environments (IDEs, such as Eclipse) can also be used
    as a text editor, but they typically have many features you will not need.

    +   - A spreadsheet application, such as Microsoft Excel or Google Spreadsheets.
    When possible, generic examples are provided that can work on either of these
    tools, but in some cases, one or the other is required.

    +   - A Python development environment and the ability to install Python libraries.
    I recommend the Enthought Canopy Python environment, which is available here:
    https://www.enthought.com/products/canopy/.

    +   - A MySQL 5.5+ server installed and running.

    +   - A web server (running any server software) and PHP 5+ installed.

    +   - A MySQL client interface, either the command-line interface, MySQL Workbench,
    or phpMyAdmin (if you have PHP running).'
  merge: -1
  img_proc: true
- pgno: 19
  md: "# Who this book is for\n\nIf you are reading this book, I guess you are probably\
    \ in one of two groups. One group is the group of data scientists who already\
    \ spend a lot of time cleaning data, but you want to get better at it. You are\
    \ probably frustrated with the tedium of data cleaning, and you are looking for\
    \ ways to speed it up, become more efficient, or just use different tools to get\
    \ the job done. In our kitchen metaphor, you are the chef who just needs to brush\
    \ up on a few knife skills.\n\nThe other group is made up of people doing the\
    \ data science work but who never really cared about data cleaning before. But\
    \ now, you are starting to think that maybe your results might actually get better\
    \ if you had a cleaning process. Maybe the old adage \"garbage in, garbage out\"\
    \ is starting to feel a little too real. Maybe you are interested in sharing your\
    \ data with others, but you do not feel confident about the quality of the datasets\
    \ you are producing. With this book, you will gain enough confidence to \"cook\
    \ in public\" by learning a few tricks and creating new habits that will ensure\
    \ a tidy, clean data science environment.\n\nEither way, this book will help you\
    \ reframe data cleaning away from being a symbol of drudgery and toward being\
    \ your hallmark of quality, good taste, style, and efficiency. You should probably\
    \ have a bit of programming background, but you do not have to be great at it.\
    \ As with most data science projects, a willingness to learn and experiment as\
    \ well as a healthy sense of curiosity and a keen attention to detail are all\
    \ very important and valued.\n\n# Conventions\n\nIn this book, you will find a\
    \ number of text styles that distinguish between different kinds of information.\
    \ Here are some examples of these styles and an explanation of their meaning.\n\
    \nCode words in text, database table names, folder names, filenames, file extensions,\
    \ pathnames, dummy URLs, user input, and Twitter handles are shown as follows:\
    \ \"The issue is that open() is not prepared to handle UTF-8 characters.\"\n\n\
    A block of code is set as follows:\n\n```\nfor tweet in stream:\n    encoded_tweet\
    \ = tweet['text'].encode('ascii','ignore')\n    print counter, \"-\", encoded_tweet[0:10]\n\
    \    f.write(encoded_tweet)\n```"
  merge: -1
  img_proc: true
