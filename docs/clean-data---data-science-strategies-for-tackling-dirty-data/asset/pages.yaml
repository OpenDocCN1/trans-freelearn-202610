    # SQL to CSV or JSON using phpMyAdmin


    In this section, we''ll discuss two options for writing JSON and CSV directly
    from a database, MySQL in our case, without using any programming.


    First, phpMyAdmin is a very common web-based frontend for MySQL databases. If
    you are using a modern version of this tool, you will be able to export an entire
    table or the results of a query as a CSV or JSON file. Using the same enron database
    we first visited in Chapter 1, Why Do You Need Clean Data?, consider the following
    screenshot of the Export tab, with JSON selected as the target format for the
    entire employeelist table (CSV is also available in this select box):


    ![](img/9aa003afabe05fdb07da46ad71325de6_107_0.png)


    PhpMyAdmin JSON export for entire tables'
