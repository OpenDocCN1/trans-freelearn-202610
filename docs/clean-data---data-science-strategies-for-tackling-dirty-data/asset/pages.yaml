- pgno: 143
  md: '# Example project – Extracting data from e-mail and web forums


    The Django IRC logs project was pretty simple. It was designed to show you the
    differences between three solid techniques that are commonly used to extract clean
    data from within HTML pages. The data we extracted included the line number, the
    username, and the IRC chat message, all of which were easy to find and required
    almost no additional cleaning. In this new example project, we will consider a
    case that is conceptually similar, but that will require us to extend the idea
    of data extraction beyond HTML to two other types of semi-structured text found
    on the Web: e-mail messages hosted on the Web and web-based discussion forums.


    # The background of the project


    I was recently working on a research study about how social media can be used
    to provide software technical support. Specifically, I was trying to discover
    whether certain types of software development organizations that make APIs and
    frameworks should move their technical support for developers to Stack Overflow
    or whether they should continue to use older media, such as e-mail and web forums.
    To complete this study, I compared (among other things) how long it took developers
    to get an answer to their API question via Stack Overflow versus how long it took
    on older social media such as web forums and e-mail groups.


    In this project, we will work on a small piece of this question. We will download
    two types of raw data representing the older social media: HTML files from a web
    forum and e-mail messages from Google Groups. We will write Python code to extract
    the dates and time of the messages sent to these two support forums. We will then
    figure out which messages were sent in reply to the others and calculate some
    basic summary statistics about how long it took each message to get a reply.


    ![](img/9aa003afabe05fdb07da46ad71325de6_143_0.png)


    > If you are wondering why we aren''t extracting data for the Stack Overflow portion
    of the question in this example project, just wait until Chapter 9, Stack Overflow
    Project. That entire chapter is devoted to creating and cleaning a Stack Overflow
    database.


    This project will be divided into two parts. In Part one, we will extract data
    from the e-mail archive from a project hosted on Google Groups, and in Part two,
    we will extract our data from the HTML files of a different project.'
  merge: -1
  img_proc: true
- pgno: 144
  md: "# Part one – cleaning data from Google Groups e-mail\n\nMany software companies\
    \ have traditionally used e-mail mailing lists or hybrid e-mail-web forums to\
    \ provide technical support for their products. Google Groups is a popular choice\
    \ for this service. Users can either send e-mails to the group, or they can read\
    \ and search the messages in a web browser. However, some companies have moved\
    \ away from providing technical support to developers via Google Groups (including\
    \ Google products themselves), and are instead using Stack Overflow. The database\
    \ product Google BigQuery is one such group that now uses Stack Overflow.\n\n\
    # Step one – collect the Google Groups messages\n\nTo study the response times\
    \ for questions on the BigQuery Google Group, I first created a list of the URLs\
    \ for all the postings in that group. You can find my complete list of URLs on\
    \ my GitHub site: https://github.com/megansquire/stackpaper2015/blob/master/BigQueryGGurls.txt.\n\
    \nOnce we have a list of target URLs, we can write a Python program to download\
    \ all the e-mails residing in those URLs, and save them to disk. In the following\
    \ program, my list of URLs has been saved as the file called GGurls.txt. The time\
    \ library is included, so we can take a short sleep() method in between requests\
    \ to the Google Groups server:\n\n```\n```python\nimport urllib2\nimport time\n\
    \nwith open('GGurls.txt', 'r') as f:\n    urls = []\n    for url in f:\n     \
    \   urls.append(url.strip())\n\ncurrentFileNum = 1\nfor url in urls:\n    print(\"\
    Downloading: {0} Number: {1}\".format(url, currentFileNum))\n    time.sleep(2)\n\
    \    htmlFile = urllib2.urlopen(url)\n    urlFile = open(\"msg%d.txt\" %currentFileNum,'wb')\n\
    \    urlFile.write(htmlFile.read())\n    urlFile.close()\n    currentFileNum =\
    \ currentFileNum +1\n```\n```\n\nThis program results in 667 files being written\
    \ to disk."
