  md: 'Why did we decide to use regex here instead of a tree-based parser? There are
    two main reasons:


    +   1. Because the e-mails we downloaded are not HTML, they cannot easily be described
    as a tree of nodes with parents and children. Therefore, a parse tree-based solution
    such as BeautifulSoup is not the best choice.

    +   2. Because e-mail headers are structured and very predictable (especially
    the three headers we are looking for here), a regex solution is acceptable.


