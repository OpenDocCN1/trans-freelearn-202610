    # On Windows


    Windows has the `more` program available in its Command Prompt application as
    well. It works similarly to the `less` command described earlier (after all, *less
    is more*). You can access the Windows Command Prompt with `cmd` from the **Start**
    menu in Windows 7. In Windows 8, navigate to **Apps** | **Windows System** | **Command
    Prompt**. You can use `cd` and `pwd` to navigate to your file the same way as
