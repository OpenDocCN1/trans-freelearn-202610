- pgno: 78
  md: "This little program finds 10 recent tweets that use the keyword DataCleaning.\
    \ (I chose this keyword because I recently posted several tweets full of emojis\
    \ and UTF-8 characters using this hashtag, I was pretty sure it would quickly\
    \ generate some nice results characters within the first 10 tweets.) However,\
    \ asking Python to save these tweets to a file using this code results in the\
    \ following error message:\n\n```\nUnicodeEncodeError: 'ascii' codec can't encode\
    \ character u'\\u00c9' in position 72: ordinal not in range(128)\n```\n\nThe issue\
    \ is that open() is not prepared to handle UTF-8 characters. We have two choices\
    \ for a fix: strip out UTF-8 characters or change the way we write files.\n\n\
    # Option one – strip out the UTF-8 characters\n\nIf we take this route, we need\
    \ to understand that by stripping out characters, we have lost data that could\
    \ be meaningful. As we discussed earlier in this chapter, data loss is generally\
    \ an undesirable thing. Still, if we did want to strip these characters, we could\
    \ make the following changes to the original for loop:\n\n```\nfor tweet in stream:\n\
    \    encoded_tweet = tweet['text'].encode('ascii','ignore')\n    print counter,\
    \ \"-\", encoded_tweet[0:10]\n    f.write(encoded_tweet)\n```\n\nThis new code\
    \ changes an original tweet written in Icelandic like this:\n\n```\nÉg elska gögn\n\
    ```\n\nTo this:\n\n```\ng elska ggn\n```\n\nFor text analysis purposes, this sentence\
    \ no longer makes any sense as g and ggn are not words. This is probably not our\
    \ best option for cleaning the character encoding of these tweets.\n\n# Option\
    \ two – write the file in a way that can handle UTF-8 characters\n\nAnother option\
    \ is to just use the codecs or io libraries, which allow UTF-8 encoding to be\
    \ specified at the time the file is opened. Add an import codec line at the top\
    \ of the file, and then change the line where you open the file like this:\n\n\
    ```\nf = codecs.open('outfile.txt', 'a+', 'utf-8')\n```\n\nThe a+ parameter states\
    \ we want to append the data to the file if it has already been created."
