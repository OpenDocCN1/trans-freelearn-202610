    # Step three – data cleaning


    At this point, we are ready to begin cleaning the JSON file, extracting the details
    of each tweet that we want to keep in our long-term storage.


    # Creating database tables


    Since our motivating question only asks about URLs, we really only need to extract
    those, along with the tweet IDs. However, for the sake of practice in cleaning,
    and so that we can compare this exercise to what we did earlier in Chapter 7,
    RDBMS Cleaning Techniques, with the sentiment140 data set, let''s design a small
    set of database tables as follows:


    +   - A tweet table, which only holds information about the tweets

    +   - A hashtag table, which holds information about which tweets referenced which
    hashtags'
  merge: -1
  img_proc: true
- pgno: 248
  md: "+   - A `URL` table, which holds information about which tweets referenced\
    \ which URLs\n+   - A `mentions` table, which holds information about which tweets\
    \ mentioned which users\n\nThis is similar to the structure we designed in *Chapter\
    \ 7, RDBMS Cleaning Techniques*, except in that case we had to parse out our own\
    \ list of hashtags and URLs and user mentions from the tweet text. The twarc tool\
    \ has definitely saved us some effort as we complete this project in this chapter.\n\
    \nThe CREATE statements to make our four tables are as follows:\n\n```\nCREATE\
    \ TABLE IF NOT EXISTS ferguson_tweets (\n  tid bigint(20) NOT NULL,\n  ttext varchar(200)\
    \ DEFAULT NULL,\n  tcreated_at varchar(50) DEFAULT NULL,\n  tuser bigint(20) DEFAULT\
    \ NULL,\n  PRIMARY KEY (tid)\n) ENGINE=MyISAM DEFAULT CHARSET=utf8mb4;\n\nCREATE\
    \ TABLE IF NOT EXISTS ferguson_tweets_hashtags (\n  tid bigint(20) NOT NULL,\n\
    \  ttag varchar(200) NOT NULL,\n  PRIMARY KEY (tid, ttag)\n) ENGINE=MyISAM DEFAULT\
    \ CHARSET=utf8;\n\nCREATE TABLE IF NOT EXISTS ferguson_tweets_mentions (\n  tid\
    \ bigint(20) NOT NULL,\n  tuserid bigint(20) NOT NULL,\n  tscreen varchar(100)\
    \ DEFAULT NULL,\n  tname varchar(100) DEFAULT NULL,\n  PRIMARY KEY (tid,tuserid)\n\
    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n\nCREATE TABLE IF NOT EXISTS ferguson_tweets_urls\
    \ (\n  tid bigint(20) NOT NULL,\n  turl varchar(200) NOT NULL,\n  texpanded varchar(255)\
    \ DEFAULT NULL,\n  tdisplay varchar(200) DEFAULT NULL,\n  PRIMARY KEY (tid,turl)\n\
    ) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```"
  merge: -1
  img_proc: true
- pgno: 249
  md: "One thing to note about the tweets table is that it was created with the **utf8mb4**\
    \ collation. This is because the tweets themselves may include characters that\
    \ are very high in the UTF-8 range. In fact, some characters in these tweets will\
    \ require more space than the 3-byte limit that the native MySQL UTF-8 character\
    \ set can hold. Therefore, we designed the main tweet table to hold data in MySQL's\
    \ utf8mb4 collation, which is included in MySQL 5.5 or higher. If you are working\
    \ on a MySQL version older than that, or for some other reason, you do not have\
    \ access to the utf8mb4 collation, you can use MySQL's older UTF-8-general collation,\
    \ but be aware that you may generate encoding errors with an emoji here or there.\
    \ If you do run into this error, MySQL will likely yield a message about Error\
    \ 1366 and *incorrect string value* when you are trying to INSERT the record.\n\
    \nNow that each table is created, we can begin to select and load the data in.\n\
    \n# Populating the new tables in Python\n\nThe Python script that follows will\
    \ load in the JSON file, extract the values from the fields we are interested\
    \ in, and populate the four tables described previously. There are a few additional,\
    \ important notes about this script, which I will go through now.\n\nThis script\
    \ does require the MySQLdb Python modules to be installed. As a Canopy Python\
    \ user, these modules are easy to install through the package manager. Simply\
    \ run a search for MySQLdb in the Package Manager and click to install:\n\n```\n\
    #jsonTweetCleaner.py\nimport json\nimport MySQLdb\n\n# Open database connection\n\
    db = MySQLdb.connect(host=\"localhost\",\\\n    user=\"username\", \\\n    passwd=\"\
    password\", \\\n    db=\"ferguson\", \\\n    use_unicode=True, \\\n    charset=\"\
    utf8\")\ncursor = db.cursor()\ncursor.execute('SET NAMES utf8mb4')\ncursor.execute('SET\
    \ CHARACTER SET utf8mb4')\ncursor.execute('SET character_set_connection=utf8mb4')\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 250
  md: "```\n```python\n# open the file full of json-encoded tweets\nwith open('tweets_1000.json')\
    \ as f:\n    for line in f:\n        # read each tweet into a dictionary\n   \
    \     tweetdict = json.loads(line)\n\n        # access each tweet and write it\
    \ to our db table\n        tid     = int(tweetdict['id'])\n        ttext   = tweetdict['text']\n\
    \        uttext  = ttext.encode('utf8')\n        tcreated_at = tweetdict['created_at']\n\
    \        tuser   = int(tweetdict['user']['id'])\n\n        try:\n            cursor.execute(u\"\
    INSERT INTO ferguson_tweets(tid,\n            ttext, tcreated_at, tuser) VALUES\
    \ (%s, %s, %s, %s)\", \\\n            (tid,uttext,tcreated_at,tuser))\n      \
    \      db.commit() # with MySQLdb you must commit each change\n        except\
    \ MySQLdb.Error as error:\n            print(error)\n            db.rollback()\n\
    \n        # access each hashtag mentioned in tweet\n        hashdict = tweetdict['entities']['hashtags']\n\
    \        for hash in hashdict:\n            ttag = hash['text']\n            try:\n\
    \                cursor.execute(u\"INSERT IGNORE INTO\n                ferguson_tweets_hashtags(tid,\
    \ ttag) VALUES (%s, %s)\",(tid,ttag))\n                db.commit()\n         \
    \   except MySQLdb.Error as error:\n                print(error)\n           \
    \     db.rollback()\n\n        # access each URL mentioned in tweet\n        urldict\
