- pgno: 103
  md: '# 4

    Speaking the Lingua Franca – Data Conversions


    Last summer, I took a cheese-making class at a local cooking school. One of the
    first things we made was ricotta cheese. I was thrilled to learn that ricotta
    can be made in about an hour using just milk and buttermilk, and that buttermilk
    itself can be made from milk and lemon juice. In a kitchen, ingredients are constantly
    transformed into other ingredients, which will in turn be transformed into delicious
    meals. In our data science kitchen, we will routinely perform conversions from
    one data format to another. We might need to do this in order to perform various
    analyses, when we want to merge datasets together, or if we need to store a dataset
    in a new way.


    A lingua franca is a language that is adopted as a common standard in a conversation
    between speakers of different languages. In converting data, there are several
    data formats that can serve as a common standard. We covered some of these in
    Chapter 2, Fundamentals – Formats, Types, and Encodings. JSON and CSV are two
    of the most common. In this chapter, we will spend some time learning:


    +   - How to perform some quick conversions into JSON and CSV from software tools
    and languages (Excel, Google Spreadsheets, and phpMyAdmin).

    +   - How to write Python and PHP programs to generate different text formats
    and convert between them.

    +   - How to implement data conversions in order to accomplish a real-world task.
    In this project, we will download a friend network from Facebook using the netvizz
    software, and we will clean the data and convert it into the JSON format needed
    to build a visualization of your social network in D3. Then, we will clean the
    data in a different way, converting it into the Pajek format needed by the social
    network package called networkx.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Quick tool-based conversions


    One of the quickest and easiest ways to convert a small to medium amount of data
    is just to ask whatever software tool you are using to do it for you. Sometimes,
    the application you are using will already have the option to convert the data
    into the format you want. Just as with the tips and tricks in *Chapter 3, Workhorses
    of Clean Data – Spreadsheets and Text Editors*, we want to take advantage of these
    hidden features in our tools, if at all possible. If you have too much data for
    an application-based conversion, or if the particular conversion you want is not
    available, we will cover programmatic solutions in the upcoming sections, *Converting
    with PHP* and *Converting with Python.*


    # Spreadsheet to CSV


    Saving a spreadsheet as a delimited file is quite straightforward. Both Excel
    and Google spreadsheets have **File** menu options for **Save As**; in this option,
    select **CSV (MS DOS)**. Additionally, Google Spreadsheets has the options to
    save as an Excel file and save as a tab-delimited file. There are a few limitations
    with saving something as CSV:


    +   - In both Excel and Google Spreadsheets, when you use the **Save As** feature,
    only the current sheet will be saved. This is because, by nature, a CSV file describes
    only one set of data; therefore, it cannot have multiple sheets in it. If you
    have a multiple-sheet spreadsheet, you will need to save each sheet as a separate
    CSV file.

    +   - In both these tools, there are relatively few options for how to customize
    the CSV file, for example, Excel saves the data with commas as the separator (which
    makes sense as it is a CSV file) and gives no options to enclose data values in
    quotation marks or for different line terminators.


    # Spreadsheet to JSON


    JSON is a little trickier to contend with than CSV. Excel does not have an easy
    JSON converter, though there are several converter tools online that purport to
    convert CSV files for you into JSON.


    Google Spreadsheets, however, has a JSON converter available via a URL. There
    are a few downsides to this method, the first of which is that you have to publish
    your document to the Web (at least temporarily) in order to access the JSON version
    of it. You will also have to customize the URL with some very long numbers that
    identify your spreadsheet. It also produces a lot of information in the JSON dump—probably
    more than you will want or need. Nonetheless, here are some step-by-step instructions
    to convert a Google Spreadsheet into its JSON representation.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# Step one – publish Google spreadsheet to the Web


    After your Google spreadsheet is created and saved, select **Publish to the Web**
    from the **File** menu. Click through the subsequent dialogue boxes (I took all
    the default selections for mine). At this point, you will be ready to access the
    JSON for this file via a URL.


    # Step two – create the correct URL


    The URL pattern to create JSON from a published Google spreadsheet looks like
    this:


    ```

    http://spreadsheets.google.com/feeds/list/key/sheet/public/basic?alt=json

    ```


    There are three parts of this URL that you will need to alter to match your specific
    spreadsheet file:


    +   - **list**: (optional) You can change `list` to, say, cells if you would prefer
    to see each cell listed separately with its reference (A1, A2, and so on) in the
    JSON file. If you want each row as an entity, leave `list` in the URL.

    +   - **key**: Change `key` in this URL to match the long, unique number that
    Google internally uses to represent your file. In the URL of your spreadsheet,
    as you are looking at it in the browser, this key is shown as a long identifier
    between two slashes, just after the `/spreadsheets/d` portion of the URL, shown
    as follows:

    +   - **sheet**: Change the word sheet in the sample URL to `od6` to indicate
    that you are interested in converting the first sheet.


    ![](img/9aa003afabe05fdb07da46ad71325de6_105_0.png)


    > What does od6 mean? Google uses a code to represent each of the sheets. However,
    the codes are not strictly in numeric order. There is a lengthy discussion about
    the numbering scheme on the question on this Stack Overflow post and its answers:
    http://stackoverflow.com/questions/11290337/'
  merge: -1
  img_proc: true
