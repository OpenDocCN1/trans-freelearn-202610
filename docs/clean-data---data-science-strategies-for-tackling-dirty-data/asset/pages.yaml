  md: "# Step two – extract data from the Google Groups messages\n\nWe now have 667\
    \ e-mail messages in separate files. Our task is to write a program to read these\
    \ in one at a time and use one of the techniques from this chapter to extract\
    \ the pieces of information we need. If we peek inside one of the e-mail messages,\
    \ we see lots of **headers**, which store information about the e-mail, or its\
    \ **metadata**. We can quickly see the three headers that identify the metadata\
    \ elements that we need:\n\n```\nIn-Reply-To: <ab71b72a-ef9b-4484-b0cc-a72ecb2a3b85@r9g2000yqd.googlegroups.com>\n\
    Date: Mon, 30 Apr 2012 10:33:18 -0700\nMessage-ID: <CA+qSDkQ4JB+Cn7HNjmtLOqqkbJnyBu=Z1Ocs5-dTe5cN9UEPyA@mail.gmail.com>\n\
    ```\n\nAll messages have Message-ID and Date, but the In-Reply-To header will\
    \ only appear in a message that is a reply to another message. An In-Reply-To\
    \ value must be the Message-ID value of another message.\n\nThe following code\
    \ shows a regular expression-based solution to extract the Date, Message-ID, and\
    \ In-Reply-To (if available) values and to create some lists of original and reply\
    \ messages. Then, the code attempts to calculate the time differences between\
    \ a message and its replies:\n\n```\nimport os\nimport re\nimport email.utils\n\
    import time\nimport datetime\nimport numpy\n\noriginals = {}\nreplies = {}\ntimelist\
    \ = []\n\nfor filename in os.listdir(os.getcwd()):\n    if filename.endswith(\"\
    .txt\"):\n        f=open(filename, 'r')\n        i=''\n        m=''\n        d=''\n\
    \        for line in f:\n            irt = re.search('(In\\-Reply\\-To: <)(.+?)@',\
    \ line)\n            mid = re.search('(Message\\-ID: <)(.+?)@', line)\n```"
