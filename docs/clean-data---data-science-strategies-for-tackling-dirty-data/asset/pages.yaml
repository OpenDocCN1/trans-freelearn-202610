- pgno: 228
  md: 'Now, we would want to know the answer to this question: of those 677 URLs,
    divided by questions and answers, how many reference specifically one of the six
    pastebin URLs? We can run the following SQL code to find out:


    ```

    SELECT  tp.postTypeId, count(cpu.id)

    FROM test_posts tp

    INNER JOIN clean_posts_urls cpu ON tp.Id = cpu.postId

    WHERE cpu.url LIKE ''%jsfiddle%''

    OR cpu.url LIKE ''%jsbin%''

    OR cpu.url LIKE ''%pastebin%''

    OR cpu.url LIKE ''%dpaste%''

    OR cpu.url LIKE ''%gist%''

    OR cpu.url LIKE ''%pastie%''

    GROUP BY 1;

    ```


    The results look like the following table. A total of 18 questions reference one
    of the paste sites, whereas 24 answers reference one of the paste sites.


    ![](img/9aa003afabe05fdb07da46ad71325de6_228_0.png)


    phpMyAdmin shows the count of question and answer URLs referencing a pastebin.


    One thing to keep in mind about these queries is that they count individual URLs.
    So, if a particular postId referenced five URLs, those get counted five times.
    If I am interested in how many posts used a paste site URL once or more, I need
    to modify the first line of both queries as follows. This query counts distinct
    postings in the URLs table:


    ```

    SELECT tp.postTypeId, COUNT(DISTINCT cpu.postId)

    FROM test_posts tp

    INNER JOIN clean_posts_urls cpu ON tp.Id = cpu.postId

    GROUP BY 1;

    ```


    The following screenshot shows how many questions and answers include a URL:


    ![](img/9aa003afabe05fdb07da46ad71325de6_228_1.png)


    phpMyAdmin shows how many questions and answers include any URL.'
  merge: -1
  img_proc: true
