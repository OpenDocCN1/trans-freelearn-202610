    # Practical Data Science Cookbook


    ISBN: 978-1-78398-024-6      Paperback: 396 pages


    89 hands-on recipes to help you complete real-world data science projects in R
    and Python


    +   1. Learn about the data science pipeline and use it to acquire, clean, analyze,
    and visualize data.

    +   2. Understand critical concepts in data science in the context of multiple
    projects.

    +   3. Expand your numerical programming skills through step-by-step code examples
    and learn more about the robust features of R and Python.


    ![](img/9aa003afabe05fdb07da46ad71325de6_270_1.png)


