- pgno: 69
  md: "+   3. After the lunch rush, you look in the pot again and discover that there\
    \ is no more stew. Every last drop has been sold. You looked, you measured, and\
    \ you found the answer to \"how much stew is in the pot?\" is a **zero** value.\
    \ You send the pot to be washed at the sink.\n+   \n+   4. Just before the evening\
    \ meal, you grab the clean pot from the sink. As you walk across the kitchen,\
    \ the sous chef asks, \"What's in the pot?\" Currently, the pot is **empty**.\
    \ There is nothing in the pot. Note that the answer is not zero, because the question\
    \ he asked was not a numeric one. The answer is also not NULL because we *DO*\
    \ have a pot, and we *DID* look inside it, but there was just no answer.\n\nDifferent\
    \ data and programming environments (DBMS, storage systems, and programming languages)\
    \ treat these zero, empty, and NULL concepts slightly differently. Not all of\
    \ them clearly distinguish between all four cases. Therefore, this chapter is\
    \ written somewhat generically, and when examples are given, we try to point out\
    \ which environment we are applying them to. It is important to be aware of what\
    \ *you* mean in each environment when you say that something is null, empty, or\
    \ zero. And when you see these values in real-world datasets, it is important\
    \ to be clear about what you can (and cannot) assume about each.\n\n![](img/9aa003afabe05fdb07da46ad71325de6_69_0.png)\n\
    \n> A special caveat for those dealing with Oracle databases: empty, blank, and\
    \ NULL are different in Oracle when compared to many other systems. Proceed with\
    \ caution through this section and consult your database documentation for details\
    \ specific to Oracle.\n\n# Zero\n\nFirst things first. Of the zeroes, empties,\
    \ and NULLs, the easiest to deal with is the zero value. Zero is a measurable\
    \ quantity and has meaning in a numeric system. We can sort zeroes (they come\
    \ before 1, 2, 3...), and we can compare other numbers to zero using the handy\
    \ number line (-2, -1, 0, 1, 2, 3...). We can also perform math on zeroes (except\
    \ for division by zero, which is always awkward).\n\nAs a legitimate value, zero\
    \ works best as numeric data. A string value of zero does not make much sense\
    \ as it would end up just needing to be interpreted as 0, or the character of\
    \ 0, which is probably not really the spirit of what we intended."
  merge: -1
  img_proc: true
- pgno: 70
  md: "# Empties\n\nEmpties are a bit more tricky to work with than zeroes, but they\
    \ make a lot of sense in some cases, for instance, when working with strings.\
    \ For example, suppose we have an attribute called middle name. Well, I have no\
    \ middle name so I would always like to leave this field empty. (Fun fact: my\
    \ mother still tells the story of how my Kindergarten graduation certificate shows\
    \ a middle name that I made up on the spot, too shy to admit to my teacher that\
    \ I lacked a middle name.) Filling in a space or a hyphen (or making up something)\
    \ for a value that is truly empty does not make a lot of sense. Space is not the\
    \ same thing as empty. The correct value in the case of an empty string may, in\
    \ fact, be \"empty\".\n\nIn a CSV or delimited file, an empty value can look like\
    \ this—here, we have emptied out the favorite color values for the second two\
    \ records:\n\n```\nFirst name,birth date,favorite color,salary\n\"Sally\",\"1971-09-16\"\
    ,\"light blue\",129000\n\"Manu\",\"1984-11-03\",\"\",159960\n\"Martin\",\"1978-12-10\"\
    ,\"\",76888\n```\n\nIn an INSERT database, for example, to put the Manu record\
    \ into a MySQL system, we would use some code like this:\n\n```\nINSERT INTO people\
    \ (firstName, birthdate, faveoriteColor, salary)\nVALUES (\"Manu\",\"1984-11-03\"\
    ,\"\",159960);\n```\n\nSometimes, semi-structured data formats, such as JSON,\
    \ will allow a blank object and blank strings. Consider this example:\n\n```\n\
    {\n  \"firstName\": \"Sally\",\n  \"birthDate\": \"1971-09-16\",\n  \"faveColor\"\
    : \"\",\n  \"pet\": [],\n  \"job\": {\n    \"jobTitle\": \"Data Scientist\",\n\
    \    \"company\": \"Data Wizards, Inc.\",\n    \"salary\":129000\n  }\n}\n```\n\
    \nHere, we have taken away Sally's pets and made her favorite color an empty string."
  merge: -1
  img_proc: true
- pgno: 71
  md: "# Blanks\n\nBe aware that \" \" (two double quotes with a space in between,\
    \ sometimes called a blank but more appropriately called a **space**) is not necessarily\
    \ the same thing as \"\" (two double quotes right next to each other, sometimes\
    \ also called a blank but more appropriately called **empty**). Consider the difference\
    \ between these two MySQL INSERT statements:\n\n```\n-- this SQL has an empty\
    \ for Sally's favoriteColor and a space for Frank's\nINSERT INTO people (firstName,\
    \ birthdate, faveoriteColor, salary)\nVALUES (\"Sally\",\"1971-09-16\",\"\",129000),\n\
    \       (\"Frank\",\"1975-10-23\",\" \",76000);\n```\n\nIn addition to spaces,\
    \ other invisible characters that sometimes get accidentally interpreted as empty\
    \ or blank include tabs and carriage returns / line feeds. Be careful of these,\
    \ and when in doubt, use some of the tricks introduced earlier in this chapter\
    \ to uncover invisible characters.\n\n# Null\n\nI know that if you look up null\
    \ in the dictionary, it might say that it means zero. But do not be fooled. In\
    \ computing, we have a whole host of special definitions for NULL. To us, NULL\
    \ is not nothing; in fact, it is the absence of even nothing.\n\nHow is this different\
    \ than empty? First, empty can be equal to empty, as the length of the empty string\
    \ will be 0. So, we can imagine a value existing, against which we can perform\
    \ comparisons. However, NULL cannot be equal to NULL, and NOT NULL will not be\
    \ equal to NOT NULL either. I have heard it suggested that we should all repeat\
    \ as a mantra that *NULL is not equal to anything, even itself.*\n\nWe use NULL\
    \ when we legitimately want no entry of any kind for the data value. We do not\
    \ even want to put the pot on the stove!\n\n# Why is the middle name example \"\
    empty\" and not NULL?\n\nGood question. Recall from the stew pot analogy that\
    \ if we ask the question and the answer is empty, it is different from never getting\
    \ an answer (NULL). If you asked me what my middle name was and I told you I did\
    \ not have one, then the data value is empty. But if you just do not know whether\
    \ I have a middle name or not, then the data value is NULL."
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Is it ever useful to clean data using a zero instead of an empty or null?


    Maybe. Remember in the e-mail example from Chapter 1, Why Do You Need Clean Data?,
    when we discussed adding missing dates to our line graph and how the various spreadsheet
    programs automatically filled in a count of zero when creating a line graph with
    missing dates? Even though we had not counted the e-mails on those dates, our
    graphs interpolated the missing values as if they were zeroes. Are we OK with
    this? Well, it depends. If we can confirm the fact that the e-mail system was
    live and working on these dates, and we are confident that we have the full collection
    of e-mails sent, then the count for these dates could truly be inferred to be
    zero. However, in the case of the Enron e-mails we were using in Chapter 1, Why
    Do You Need Clean Data?, we were pretty sure that was not the case.


    Another case where it might be useful to store a zero-type data instead of empty
    is when we have a dummy date or only part of a date, for example, if you know
    the month and year, but not the day, and you have to insert data into a full date
    column. Filling in 2014-11-00 might be the way to go in that instance. But you
    should, of course, document this action (refer to the Communicating about data
    cleaning section in Chapter 1, Why Do You Need Clean Data?) because what you did
    and why is probably not going to be obvious to you looking at this data six months
    from now!


    # Character encodings


    In the olden days of computing, every string value had to be constructed from
    only 128 different symbols. This early encoding system, called American Standard
    Code for Information Exchange (ASCII), was largely based on the English alphabet,
    and it was set in stone. The 128 characters included a-z, A-Z, 0-9, some punctuation
    and spaces, as well as some now-useless Teletype codes. In our data science kitchen,
    using this type of encoding system today would be like cooking a frozen dinner.
    Yes, it is cheap, but it also lacks variety and nutrition, and you really cannot
    expect to serve it to a guest.


    In the early 1990s, a variable length encoding system, now called UTF-8, was proposed
    and standardized. This variable length scheme allows many more natural language
    symbols to be encoded properly as well as all the mathematical symbols and provides
    plenty of room to grow in the future. (The list of all these symbols is called
    Unicode. The encoding for the Unicode symbols is called UTF-8.) There is also
    now a UTF-16 encoding, where each character takes a minimum of two bytes to encode.
    At the time of writing this, UTF-8 is the predominant encoding for the Web.'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'For our purposes in this book, we are mostly concerned with what to do with
    data that exists in one encoding and must be cleaned by converting it to another
    encoding. Some example scenarios where this could be relevant include:


    +   - You have a MySQL database that has been created using a simple encoding
    (such as one of the 256-bit Latin-1 character sets that are the default on MySQL),
    and which stores UTF-8 data as Latin-1, but you would now like to convert the
    entire table to UTF-8.

    +   - You have a Python 2.7 program that uses functions designed for ASCII but
    must now handle UTF-8 files or strings.


    In this section, we will work through a few basic examples based on these scenarios.
    There are many more equally likely situations where you will encounter character
    encoding issues, but this will be a starting point.


    # Example one – finding multibyte characters in MySQL data


    Suppose we have a column of data and we are curious about how many values in that
    column actually have multibyte encoding. Characters that appear as a single character
    but take multiple bytes to encode can be discovered by comparing their length
    in bytes (using the length() function) to their length in characters (using the
    char_length() function).


    > The following example uses the MyISAM version of the MySQL World database that
    is available as part of the MySQL documentation at http://dev.mysql.com/doc/index-other.html


    By default, the MyISAM version of the MySQL World test database uses the latin1_swedish_ci
    character encoding. So, if we run a query on a country name that has a special
    character in it, we might see something like the following for Côte d''Ivoire:


    ```

    SELECT Name, length(Name)

    FROM Country

    WHERE Code=''CIV'';

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: "This shows the length of 15 for the country, and the name of the country Côte\
    \ d'Ivoire is encoded as CÂ™te dÃlvoire. There are several other entries in various\
    \ columns that are encoded strangely as well. To fix this, we can change the default\
    \ collation of the name column to utf8 with the following SQL command:\n\n```\n\
    ALTER TABLE Country\n  CHANGE Name `Name` CHAR(52)\n  CHARACTER SET utf8\n  COLLATE\
    \ utf8_general_ci\n  NOT NULL DEFAULT '';\n```\n\nNow we can empty the table and\
    \ insert the 239 Country rows again:\n\n```\nTRUNCATE Country;\n```\n\nNow we\
    \ have Country names that use UTF-8 encoding. We can test to see whether any of\
    \ the countries are using a multibyte character representation for their name\
    \ now by running the following SQL:\n\n```\nSELECT *\n  FROM Country\n  WHERE\
    \ length(Name) != char_length(Name);\n```\n\nIt shows that the Côte d'Ivoire and\
    \ the French island Réunion both have multibyte character representations.\n\n\
    Here is another example if you do not have access to the world dataset, or in\
    \ fact, any dataset at all. You can run a comparison of multibyte characters as\
    \ a MySQL select command:\n\n```\nSELECT length('私は、データを愛し'), char_length('私は、データを愛し');\n\
    ```\n\nIn this example, the Japanese characters have a length of 27 but a character\
    \ length of 9.\n\nThis technique is used when we want to test the character set\
    \ of our data — maybe you have too many rows to look one at a time, and you simply\
    \ want a SQL statement that can show you all the multibyte entries at once so\
    \ that you can make a plan for how to clean them. This command shows us the data\
    \ that currently has a multibyte format."
  merge: -1
  img_proc: true
- pgno: 75
  md: "# Example two – finding the UTF-8 and Latin-1 equivalents of Unicode characters\
    \ stored in MySQL\n\nThe following code will use the convert() function and the\
    \ RLIKE operator to print the UTF-8 equivalent of Unicode strings that have been\
    \ saved to MySQL using Latin-1. This is useful if you have multibyte data that\
    \ has been stored in Latin-1 encoded text columns in MySQL, an unfortunately common\
    \ occurrence as Latin-1 is still the default (as of MySQL 5).\n\nThis code uses\
    \ the publicly available and widely used Movielens database of movies and their\
    \ reviews. The entire movielens dataset is widely available on many websites,\
    \ including from the original project site: http://grouplens.org/datasets/movielens/.\
    \ Another SQL-friendly link is here: https://github.com/ankane/movielens.sql.\
    \ To make it easier to work through these examples, the CREATE and INSERT statements\
    \ for just a small subset of the relevant rows have been made available on the\
    \ author's GitHub site for this book: https://github.com/megansquire/datacleaning/blob/master/ch2movies.sql.\
    \ This way, if you prefer, you can simply create this one table using that code\
    \ and work through the following example.\n\n```\nSELECT convert(\n    convert(title\
    \ USING BINARY) USING latin1\n) AS 'latin1 version',\nconvert(\n    convert(title\
    \ USING BINARY) USING utf8\n) AS 'utf8 version'\nFROM movies\nWHERE convert(title\
    \ USING BINARY)\nRLIKE concat(\n    '[',\n    unhex('80'),\n    '-]',\n    unhex('FF'),\n\
    \    ']'\n);\n```"
  merge: -1
  img_proc: true
