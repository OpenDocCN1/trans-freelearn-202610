- pgno: 82
  md: '# Spreadsheet data cleaning


    The utility of the spreadsheet for data cleaning comes from two things: its ability
    to organize data into columns and rows and its suite of built-in functions. In
    this section, we will learn how to use the spreadsheet to its fullest in our quest
    for clean data.


    # Text to columns in Excel


    As spreadsheets are designed to hold data in columns and rows, one of the first
    cleaning tasks we might need to do is arrange our data accordingly. For instance,
    if you paste a large amount of data into Excel or Google Spreadsheets, the software
    will first try to look for a delimiter (such as a comma or tab) and divide the
    data into columns that way. (Refer to Chapter 2, Fundamentals – Formats, Types,
    and Encodings, for a review of delimited data.) Sometimes, the spreadsheet software
    will not find a delimiter, so we will have to provide it more guidance about how
    to divide the data into columns. Consider the following snippet of text from a
    list of several thousand Internet Relay Chat channel topics on Freenode:


    ```

    [2014-09-19 14:10:47] === #eurovision  4  Congratulations to

    Austria, winner of the Eurovision Song Contest 2014!

    [2014-09-19 14:10:47] === #tinkerforge  3

    [2014-09-19 14:10:47] === ##new  3  Welcome to ##NEW

    ```


    ![](img/9aa003afabe05fdb07da46ad71325de6_82_0.png)


    > To generate a list of channels and their topics in an IRC chat server, use the
    alis command, which can be sent as part of either /query or /msg, depending on
    your server''s settings. On Freenode, the /msg alis * command will generate a
    list of channels. More information on IRC chat can be found here: https://freenode.net/services.shtml


    We can see with our human eyes that the first chunk of data is a timestamp, followed
    by ===, # and a channel name, a number (the count of users on the channel at the
    moment the list was constructed), and a description of the channel. However, if
    we paste these lines into Excel or Google Spreadsheets, it is unable to automatically
    make the same observations about what columns should be. The rows are detected
    correctly by the spreadsheet, but the delimiting is too inconsistent for columns
    to be detected automatically. How the data looks when pasted into Google Spreadsheets
    is given in the following image. By highlighting cell A1, we can see that the
    entire line is shown in the formula bar, indicating that the entire row has been
    pasted into cell A1:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/9aa003afabe05fdb07da46ad71325de6_83_0.png)


    How can we easily create columns from this data in the spreadsheet? We would like
    each separate data item to be in its own column. By doing this, we will be able
    to, for example, take an average of the number of users on the channels or sort
    the data by the channel names. Right now, we cannot easily sort or use formulas
    on this data as it is all in one giant text string.


    One strategy will be to use Excel''s text-to-columns wizard to split the data
    into recognizable chunks; then, we can reassemble them and strip out extra characters
    if needed. This is shown in the steps mentioned as follows:


    +   1. Highlight column A, and launch the text-to-columns wizard (located in the
    Data menu). In step 1, choose a fixed width, and in step 2, double-click on all
    the lines that have been drawn to delimit the description field. The following
    figure shows you how the data should look after delimiting the first few columns
    and removing all the extra lines:


