- pgno: 157
  md: '# 6


    # Cleaning Data in PDF Files


    In the last chapter, we discovered different ways of separating the data we want
    from the data we do not want. We imagined that the data cleaning process was a
    little like making chicken stock, in which our goal was to keep the broth but
    strain out the bones. But what happens if the data we want is not so easily distinguishable
    from the data we do not want?


    Consider a fine, older wine with considerable sediment. At first glance, we might
    not be able to see the sediment suspended in the liquid. But after the wine spends
    some time in a decanter, the sediment falls to the bottom, and we are able to
    pour out a cleaner, more aromatic wine. A simple strainer would not have been
    able to separate the wine from the sediment in this case—a special-purpose tool
    would have been needed.


    In this chapter, we will experiment with several data decanters to extract all
    the good stuff hidden inside inscrutable PDF files. We will explore the following
    topics:


    +   - What PDF files are for and why it is difficult to extract data from them

    +   - How to copy and paste from PDF files, and what to do when this does not
    work

    +   - How to shrink a PDF file by saving only the pages that we need

    +   - How to extract text and numbers from a PDF file using the tools inside a
    Python package called **pdfMiner**

    +   - How to extract tabular data from within a PDF file using a browser-based
    Java application called **Tabula**

    +   - How to use the full, paid version of Adobe Acrobat to extract a table of
    data'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Why is cleaning PDF files difficult?


    Files saved in **Portable Document Format (PDF)** are a little more complicated
    than the text files we have looked at so far in this book. PDF is a binary format
    that was invented by Adobe Systems, which later evolved into an open standard
    so that multiple applications could create PDF versions of their documents. The
    purpose of a PDF file is to provide a way of viewing the text and graphics in
    a document independent of the software that did the original layout.


    In the early 1990s, the heyday of desktop publishing, each graphic design software
    package had a different proprietary format for its files, and the packages were
    quite expensive. In those days, in order to view a document created in Word, Pagemaker,
    or Quark, you would have to open the document using the same software that had
    created it. This was especially problematic in the early days of the Web, since
    there were not many available techniques in HTML to create sophisticated layouts,
    but people still wanted to share files with each other. PDF was meant to be a
    vendor-neutral layout format. Adobe made its Acrobat Reader software free for
    anyone to download, and subsequently the PDF format became widely used.


    ![](img/9aa003afabe05fdb07da46ad71325de6_158_0.png)


    > Here is a fun fact about the early days of Acrobat Reader. The words `click
    here` when entered into Google search engine still bring up *Adobe''s Acrobat
    PDF Reader download website* as the first result, and have done so for years.
    This is because so many websites distribute PDF files along with a message saying
    something like, "To view this file you must have Acrobat Reader installed. Click
    here to download it." Since Google''s search algorithm uses the link text to learn
    what sites go with what keywords, the keyword click here is now associated with
    Adobe Acrobat''s download site.


    PDF is still used to make vendor- and application-neutral versions of files that
    have layouts that are more complicated than what could be achieved with plain
    text. For example, viewing the same document in the various versions of Microsoft
    Word still sometimes causes documents with lots of embedded tables, styles, images,
    forms, and fonts to look different from one another. This can be due to a number
    of factors, such as differences in operating systems or versions of the installed
    Word software itself. Even with applications that are intended to be compatible
    between software packages or versions, subtle differences can result in incompatibilities.
    PDF was created to solve some of this.


    Right away we can tell that PDF is going to be more difficult to deal with than
    a text file, because it is a binary format, and because it has embedded fonts,
    images, and so on. So most of the tools in our trusty data cleaning toolbox, such
    as text editors and command-line tools (`less`) are largely useless with PDF files.
    Fortunately there are still a few tricks we can use to get the data out of a PDF
    file.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# Try simple solutions first – copying


    Suppose that on your way to decant your bottle of fine red wine, you spill the
    bottle on the floor. Your first thought might be that this is a complete disaster
    and you will have to replace the whole carpet. But before you start ripping out
    the entire floor, it is probably worth trying to clean the mess with an old bartender''s
    trick: club soda and a damp cloth. In this section, we outline a few things to
    try first, before getting involved in an expensive file renovation project. They
    might not work, but they are worth a try.


    # Our experimental file


    Let''s practice cleaning PDF data by using a real PDF file. We also do not want
    this experiment to be too easy, so let''s choose a very complicated file. Suppose
    we are interested in pulling the data out of a file we found on the Pew Research
    Center''s website called "Is College Worth It?". Published in 2011, this PDF file
    is 159 pages long and contains numerous data tables showing various ways of measuring
    if attaining a college education in the United States is worth the investment.
    We would like to find a way to quickly extract the data within these numerous
    tables so that we can run some additional statistics on it. For example, here
    is what one of the tables in the report looks like:


    **Q.23/Q.24, BASED ON TOTAL**

    Which of these would you say is the most important role colleges and universities
    play in society?


    | All | Response | 4-year Private | 4-year Public | 2-year Private/Public | For
    profit |

    |---|---|---|---|---|---|

    | 38 | Prepare students to be productive members of the workforce | 23 | 28 |
    47 | 63 |

    | 27 | Prepare young people to be responsible citizens | 48 | 31 | 14 | 8 |

    | 21 | Ensure that all qualified students have equal access to a college education
    | 16 | 24 | 25 | 20 |

    | 4 | Contribute to the economic development of their region or locality | 2 |
    5 | 8 | 2 |

    | 4 | Conduct research to help solve medical, scientific, social, and other national
    problems | 5 | 8 | 3 | 1 |

    | 2 | Provide continuing education for adults of all ages | 2 | 1 | 1 | 3 |

    | 3 | None is "very important"/No answer | 4 | 4 | 3 | 2 |'
