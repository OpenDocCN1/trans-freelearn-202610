    \ output a few interesting facts about the structure of my Facebook network:\n\
    \n```\nimport networkx as net\n\n# read in the file\ng = net.read_pajek('fb_pajek.net')\n\
    \n# how many nodes are in the graph?\n# print len(g)\n\n# create a degree map:\
    \ a set of name-value pairs linking nodes\n# to the number of edges in my network\n\
    deg = net.degree(g)\n# sort the degree map and print the top ten nodes with the\n\
    # highest degree (highest number of edges in the network)\nprint sorted(deg.iteritems(),\
    \ key=lambda(k,v): (-v,k))[0:9]\n```\n\nThe result for my network looks like the\
