  md: 'This query counts the particular posts in the URLs table that mention a paste
    site:


    ```

    SELECT  tp.postTypeId, count(DISTINCT cpu.postId)

    FROM test_posts tp

    INNER JOIN clean_posts_urls cpu ON tp.Id = cpu.postId

    WHERE cpu.url LIKE ''%jsfiddle%''

    OR cpu.url LIKE ''%jsbin%''

    OR cpu.url LIKE ''%pastebin%''

    OR cpu.url LIKE ''%dpaste%''

    OR cpu.url LIKE ''%gist%''

    OR cpu.url LIKE ''%pastie%''

    GROUP BY 1;

    ```


    The results for this paste site query are as follows, and, as expected, the numbers
    are smaller. In our test set, 11 questions used at least one pastebin URL, and
    so did 16 answers. Combined, 37 posts reference a pastebin URL at least once.


    | postTypeId | count(distinct cpu.postid) |

    |---|---|

    | 1 | 11 |

    | 2 | 16 |


    PhpMyAdmin shows how many questions and answers include any paste site URL.


    Even though these results seem to show that people reference paste site URLs more
    in answers than questions, we need to compare them in terms of the overall number
    of questions and answers. We should report our result values as a percentage of
    the total for that post type, question or answer. Taking the totals into account,
    we can now say something like this: "Considering only the questions and answers
    that used any kind of URL at least once, 11 questions out of 81 used at least
    one paste site URL (13.6 percent), and 16 answers out of 222 used at least one
    paste site URL (7.2 percent)." With that in mind, it appears that the questions
    actually outstripped answers in referencing a paste site, almost two to one.


    At this point in any data analysis project, you must have a flood of questions,
    like:


    +   - How has the usage of paste site URLs in questions and answers changed over
    time?

    +   - How do questions with paste site URLs fare on voting and favorites?

    +   - What are the characteristics of users who post questions with paste site
    URLs?'
