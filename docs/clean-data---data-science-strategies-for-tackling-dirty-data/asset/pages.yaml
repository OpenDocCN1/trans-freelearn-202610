    Note that the LOAD XML syntax is slightly changed, so that we can keep our files\
    \ locally. If your .xml files are on your local machine rather than on the database\
    \ server itself, simply add the word LOCAL to the LOAD XML statements, as shown\
    \ in the preceding code, and you can reference the full path to your file.\nMore\
    \ information about the MySQL LOAD XML syntax is described in the MySQL documentation\
