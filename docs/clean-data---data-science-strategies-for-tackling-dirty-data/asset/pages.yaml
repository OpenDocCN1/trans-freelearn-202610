    # The example project


    In this chapter, we have focused on converting data from one format to another,
    which is a common data cleaning task that will need to be done time and again
    before the rest of the data analysis project can be completed. We focused on some
    very common text formats (CSV and JSON) and common locations for data (files and
    SQL databases). Now, we are ready to extend our basic knowledge of data conversions
    with a sample project that will ask us to make conversions between some less standardized
    — but still text-based — data formats.


    In this project, we want to investigate our Facebook social network. We will:


    +   1. Download our Facebook social network (friends and relationships between
    them) using netvizz into a text-based file format called **Graph Description Format
    (GDF)**.

    +   2. Build a graphical representation of a Facebook social network showing the
    people in our network as nodes and their friendships as connecting lines (called
    *edges*) between these nodes. To do this, we will use the D3 JavaScript graphing
    library. This library expects a JSON representation of the data in the network.

    +   3. Calculate some metrics about the social network, such as the size of the
    network (known as the *degree* of the network) and the shortest path between two
    people our network. To do this, we will use the `networkx` package in Python.
    This package expects data in a text-based format, called the **Pajek** format.


    The primary goal of this project will be to show how to reconcile all these different
    expected formats (GDF, Pajek, and JSON) and perform conversions from one format
    to another. Our secondary goal will be to actually provide enough sample code
