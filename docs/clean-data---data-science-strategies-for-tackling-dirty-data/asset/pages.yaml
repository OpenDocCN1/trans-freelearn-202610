- pgno: 112
  md: "This code will create a CSV with each line in it, just like the previous example.\
    \ We should be aware that the file_get_contents() function reads the file into\
    \ the memory as a string, so you may find that for extremely large files, you\
    \ will need to use a combination of the fread(), fgets(), and fclose() PHP functions\
    \ instead.\n\n# CSV to JSON using PHP\n\nAnother common task is to read in a CSV\
    \ file and write it out as a JSON file. Most of the time, we have a CSV in which\
    \ the first row is a header row. The header row lists the column name for each\
    \ column in the file, and we would like each item in the header row to become\
    \ the keys for the JSON-formatted version of the file:\n\n```\n<?php\n$file =\
    \ fopen('enronEmail.csv', 'r');\n$headers = fgetcsv($file, 0, ',');\n$complete\
    \ = array();\n\nwhile ($row = fgetcsv($file, 0, ','))\n{\n    $complete[] = array_combine($headers,\
    \ $row);\n}\nfclose($file);\n$json_formatted = json_encode($complete);\nfile_put_contents('enronEmail.json',$json_formatted);\n\
    ?>\n```\n\nThe result of this code on the enronEmail.csv file created earlier,\
    \ with a header row, is as follows:\n\n```\n[{\"name\":\"Lysa Akin\",\"email_id\"\
    :\"lysa.akin@enron.com\"},\n{\"name\":\"Phillip Allen\",\"email_id\":\"k..allen@enron.com\"\
    },\n{\"name\":\"Harry Arora\",\"email_id\":\"harry.arora@enron.com\"},...]\n```\n\
    \nFor this example, of the 151 results in the actual CSV file, only the first\
    \ three rows are shown.\n\n# Converting with Python\n\nIn this section, we describe\
    \ a variety of ways to manipulate CSV into JSON, and vice versa, using Python.\
    \ In these examples, we will explore different ways to accomplish this goal, both\
    \ using specially installed libraries and using more plain-vanilla Python code."
