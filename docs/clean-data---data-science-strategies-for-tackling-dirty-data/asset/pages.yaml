  md: '# Another technique to try – pdfMiner


    Now that we have a smaller file to experiment with, let''s try some programmatic
    solutions to extract the text and see if we fare any better. pdfMiner is a Python
    package with two embedded tools to operate on PDF files. We are particularly interested
    in experimenting with one of these tools, a command-line program called pdf2txt
    that is designed to extract text from within a PDF document. Maybe this will be
    able to help us get those tables of numbers out of the file correctly.


    # Step one – install pdfMiner


    Launch the Canopy Python environment. From the Canopy Terminal Window, run the
    following command:


    ```

    pip install pdfminer

    ```


    This will install the entire pdfMiner package and all its associated command-line
    tools.


    ![](img/9aa003afabe05fdb07da46ad71325de6_163_0.png)


    > The documentation for pdfMiner and the two tools that come with it, pdf2txt
    and dumpPDF, is located at http://www.unixuser.org/~euske/python/pdfminer/.


    # Step two – pull text from the PDF file


    We can extract all text from a PDF file using the command-line tool called pdf2txt.py.
    To do this, use the Canopy Terminal and navigate to the directory where the file
    is located. The basic format of the command is pdf2txt.py <filename>. If you have
    a larger file that has multiple pages (or you did not already break the PDF into
    smaller ones), you can also run pdf2txt.py -p149 <filename> to specify that you
    only want page 149.


    Just as with the preceding copy-and-paste experiment, we will try this technique
    not only on the tables located on page 149, but also on the Preface on page 3.
    To extract just the text from page 3, we run the following command:


    ```

    pdf2txt.py -p3 pewReport.pdf

    ```'
  merge: -1
  img_proc: true
