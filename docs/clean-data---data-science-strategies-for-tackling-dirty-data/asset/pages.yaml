- pgno: 220
  md: 'After running that code, we can see we have a nice selection of eight test
    tables to work with if we need them. Testing with these smaller tables ensures
    that our cleaning exercises will go more smoothly and mistakes can be contained.
    If we find that we need more rows in our random tables, we can simply raise the
    `$table_target_size` command and run this again.


    Building test tables is a great habit to get into, once you know how easy it is
    to create them in a simple and useful way.


    # Step three – cleaning the data


    Remembering that our goal is to begin analyzing how frequently certain URLs are
    referenced in questions, answers, and comments, it makes sense to begin in the
    text of the Stack Overflow `posts` and `comments` tables. However, since those
    tables are so large, we will use the `test_posts` and `test_comments` tables that
    we just created instead. Then, once we are confident that the queries work perfectly,
    we can re-run them on the larger tables.


    This cleaning task is very similar to the way we stored the URLs extracted from
    tweets in *Chapter 7, RDBMS Cleaning Techniques*. However, this project has its
    own set of specific rules:


    +   - Since posts and comments are different entities to begin with, we should
    make separate tables for the URLs that come from posts (including questions and
    answers) and the URLs that come from comments.

    +   - Each question, answer, or comment can have multiple URLs inside it. We should
    store all of the URLs, and we should also track the unique identifier for which
    post or comment that URL came from.

    +   - Each question and answer can also have formatted source code in it. The
    `<code>` tag is used to delimit source code in the Stack Overflow posts. Separating
    code from posts will help us answer questions about the co-existence of paste
    site URLs and source code. How much code will typically accompany such a link,
    if any?


    ![](img/9aa003afabe05fdb07da46ad71325de6_220_0.png)


    > Technically, posts *can* be created without the `<code>` tags, but usually someone
    will quickly edit the errant post to include these useful tags, and will get the
    Stack Overflow points for doing so. For brevity''s sake, in this project, we will
    assume that code is included in the `<code>` tags.'
  merge: -1
  img_proc: true
- pgno: 221
  md: "+   - According to the Stack Overflow database dump documentation (available\
    \ at http://meta.stackexchange.com/questions/2677/), there are actually eight\
    \ types of posts, of which questions and answers are just two types. So, we will\
    \ need to limit our queries to posts that have `postTypeId=1` for questions and\
    \ `postTypeId=2` for answers.\n+   - To ensure that we are only extracting URLs\
    \ from comments made to questions or answers, and not other types of posts, we\
    \ will need to do a join back to the posts table and limit our results to `postTypeId=1`\
    \ or `postTypeId=2`.\n\n# Creating the new tables\n\nThe SQL query to create the\
    \ database tables we need to store these URLs is as follows:\n\n```\nCREATE TABLE\
    \ clean_comments_urls (\n    id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,\n   \
    \ commentId INT NOT NULL,\n    url VARCHAR(255) NOT NULL\n) ENGINE=MyISAM DEFAULT\
    \ CHARSET=utf8;\n```\n\n```\nCREATE TABLE IF NOT EXISTS clean_posts_urls (\n \
    \   id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,\n    postId INT NOT NULL,\n  \
    \  url VARCHAR(255) NOT NULL\n) ENGINE=MyISAM DEFAULT CHARSET=utf8;\n```\n\nWe\
    \ also need to create a table that can hold the code we stripped out of the posts:\n\
    \n```\nCREATE TABLE clean_posts_code (\n    id INT NOT NULL AUTO_INCREMENT PRIMARY\
    \ KEY,\n    postId INT NOT NULL,\n    code TEXT NOT NULL\n) ENGINE=MyISAM DEFAULT\
    \ CHARSET=utf8;\n```\n\nAt this point, we have three new tables that will store\
    \ our cleaned URLs and cleaned source code. In the next section, we will extract\
    \ URLs and code and fill up these new tables."
