- pgno: 34
  md: '# Why Do You Need Clean Data?


    Lucky for us, the shape of the data is similar, save for a shorter head and tail
    on the graph. Based on this comparison, and based on what we plan to do with the
    data (remember that all we wanted to do was create a simple line graph), we can
    feel good about our decision to move forward without specifically creating a dataset
    showing zero count days.


    When all is said and done, the line graphs reveal that Enron had several significant
    peaks in e-mail traffic. The largest peaks and heaviest traffic occurred in the
    October and November of 2001, when the scandal broke. The two smaller peaks occurred
    around June 26-27 of 2001 and December 12-13 of 2000, when similar newsworthy
    events involving Enron transpired (one involving the California energy crisis
    and another involving a leadership change at the company).


    If you get excited by data analysis, you probably have all sorts of cool ideas
    for what to do next with this data. And now that you have cleaned data, it will
    make your analysis tasks easier, hopefully!


    # Summary


    After all that work, it looks like The New York Times was right. As you can see
    from this simple exercise, data cleaning indeed comprises about 80 percent of
    the effort of answering even a tiny data-oriented question (in this case, talking
    through the rationale and choices for data cleaning took 700 words out of the
    900-word case study). Data cleaning really is a pivotal part of the data science
    process, and it involves understanding technical issues and also requires us to
    make some value judgments. As part of data cleaning, we even had to take into
    account the desired outcomes of both the analysis and visualization steps even
    though we had not really completed them yet.


    After considering the role of data cleaning as presented in this chapter, it becomes
    even more obvious how improvements in our cleaning effectiveness could quickly
    add up to substantial time savings.


    The next chapter will describe a few of the fundamentals that will be required
    for any "data chef" who wants to move into a bigger, better "kitchen", including
    file formats, data types, and character encodings.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 2

    Fundamentals – Formats, Types, and Encodings


    A few years ago, I received a very interesting present at my family''s annual
    holiday gift exchange. It was a *garde manger* kitchen toolset that included a
    bunch of different knives as well as peelers, scoops, and zesters used to prepare
    vegetables and fruits. I learned to use each of the tools, and over time, I developed
    a special fondness for the channel knife and the tomato shark. This chapter is
    like your introductory data cleaning toolset. We will review:


    +   - File formats, including compression standards

    +   - The fundamentals of data types (including different types of missing data)

    +   - Character encodings


    We will need all these fundamentals as we progress to later chapters. Some of
    the concepts that we''ll cover are so basic that you''ll encounter them nearly
    every day, such as compression and file formats. These are so common; they are
    like a chef''s knife. But some of these concepts, like character encodings, are
    more special-purpose and exotic, like a tomato shark!


    # File formats


    This section describes the different file formats any data scientist is likely
    to encounter when dealing with data found in the wild – in other words, the kind
    of data you will *not* find in those carefully constructed datasets that so many
    books rely on. Here, we encounter some strategies and limitations to interacting
    with the most common file formats, and then we review the various compression
    and archiving formats you are likely to run into.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# Text files versus binary files


    When collecting data from online sources, you are likely to encounter data in
    one of these ways:


    +   - The data will be downloadable in a file

    +   - The data will be available via an interactive frontend to a storage system,
    for example, via a database system with a query interface

    +   - The data will be available through a continuous stream

    +   - The data will be available through an **Application Programming Interface
    (API)**.


    In any case, you may find yourself needing to create data files later on in order
    to share with others. Therefore, a solid foundation of the various data formats
    and their strengths and weaknesses is important.


    First, we can think of computer files as belonging to two broad groups, commonly
    called **text files** and **binary files**. As all files consist of a sequence
    of bytes, one right after the other, strictly speaking, all files are binary.
    But if the bytes in the file are all text characters (for example, letters, numbers,
    and some control characters such as newlines, carriage returns, or tabs), then
    we say the file is a text file. In contrast, binary files are those files that
    contain bytes made up of mostly non-human-readable characters.


    # Opening and reading files


    Text files can be read and written by a program called a text editor. If you try
    to open a file in a text editor and you can read it successfully (even if you
    do not understand it), then it is probably a text file. However, if you open the
    file in a text editor and it just looks like a jumble of garbled characters and
    weird illegible symbols, then it is probably a binary file.


    Binary files are intended to be opened or edited with a particular application,
    not by a text editor. For example, a Microsoft Excel spreadsheet is intended to
    be opened and read by Microsoft Excel, and a photograph taken by a digital camera
    can be read by a graphics program, such as Photoshop or Preview. Sometimes, binary
    files can be read by multiple compatible software packages, for example, many
    different graphics programs can read and edit photos and even binary files designed
    for a proprietary format, such as Microsoft Excel or Microsoft Word files, can
    be read and edited by compatible software, such as Apache OpenOffice. There are
    also programs called binary editors, which will let you peek inside a binary file
    and edit it.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'Sometimes, text files are also intended to be read by an application, yet you
    can still read them in a text editor. For example, web pages and computer source
    code consist of only text characters and can easily be edited in a text editor,
    yet they are difficult to understand without some training in the particular format,
    or layout, of the text itself.


    It is usually possible to know what type of file you have even without opening
    it in an editor. For example, most people look for clues about the file, starting
    with the file''s own name. Three-letter and four-letter file extensions are a
    common way to indicate the type of file it is. Common extensions that many people
    know include:


    +   - `.xlsx` for Excel files, `.docx` for Word files, `.pptx` for Powerpoint
    files

    +   - `.png`, `.jpg`, and `.gif` for image files

    +   - `.mp3`, `.ogg`, `.wmv`, and `.mp4` for music and video files

    +   - `.txt` for text files


    There are also several websites that list file extensions and the programs that
    are affiliated with these particular extensions. One such popular site is fileinfo.com,
    and Wikipedia also has an alphabetical list of file extensions available at https://en.wikipedia.org/wiki/List_of_filename_extensions_(alphabetical).


    # Peeking inside files


    If you must open an unknown file to peek inside, there are several command-line
    options you can use to see the first few bytes of the file.


    # On OSX or Linux


    On an OSX Mac or in Linux, go to your terminal window (on Mac, you can find the
    standard terminal application available by navigating to Applications | Utilities
    | Terminal), navigate to the location of your file using a combination of the
    print working directory (pwd) and change directory (cd) commands, and then use
    the less command to view the file page by page. Here is what my commands to perform
    this task looked like:


    ```

    flossmole2:~ megan$ pwd

    /Users/megan

    flossmole2:~ megan$ cd Downloads

    flossmole2:Downloads megan$ less OlympicAthletes_0.xlsx

    "OlympicAthletes_0.xlsx" may be a binary file. See it anyway?

    ```'
  merge: -1
  img_proc: true
- pgno: 38
