  `50`，选择仅查看大于或等于 50 的值。

  5. 右键单击 `Index`，选择 `Edit Table Calculation`（编辑表计算）。选择 `Specific Dimensions`（特定维度）并勾选
  `Postal Code`：


  ![](img/B18435_05_07.png)


