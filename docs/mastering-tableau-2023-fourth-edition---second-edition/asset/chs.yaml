  ## 双维度的分区和寻址


  当对两个或更多维度进行分区和寻址时，会提供两个额外选项：`At the level`（按级别）和 `Restarting every`（每...重新开始）。您可以将此场景比作按大洲统计所有国家/地区的任务。在此场景中，`At
  the level` 将是国家/地区，因为您统计的不是街道或树木，而是国家/地区。`Restarting` 将是大洲。在完成一个大洲的国家/地区统计后，您将为下一个大洲重新从
  1 开始计数：


  ![](img/B18435_05_20.png)


  图 5.20：两个维度


  `At the level` 和 `Restarting every` 都允许作者从下拉菜单中选择维度。`At the level` 允许作者选择在哪个级别进行递增，顾名思义，`Restarting
  every` 允许作者选择在哪些维度上重新开始。此处的示例将为您的理解提供背景。


  请注意，`At the level` 还有一个额外选项：`Deepest`（最深）。在这种情况下，将 `At the level` 设置为 `Deepest`
  与选择 `Ship Mode` 相同。这引出了我们的下一条准则：


