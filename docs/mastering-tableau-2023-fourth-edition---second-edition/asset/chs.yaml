  \n\n\n# 精通 Tableau 2023，第四版\n\n本版最畅销的 Tableau 指南将教您如何在 BI 领域的各种范式中利用 Tableau 的最新功能和产品。本书更新了全新主题，涵盖\
  \ Tableau Server、Prep 和 Desktop 的最新功能，以及最新的示例和针对现实挑战的解决方案，将带您从掌握 Tableau 核心概念进阶到高级功能。此外还新增了一个关于数据治理的章节。\n\
  \n通读本书，您将学习如何使用各种文件和数据库连接到 Tableau Desktop 和 Prep Builder，轻松执行数据准备和处理；通过实用示例执行复杂的联接、空间联接、联合和数据混合任务。您还将掌握数据加密的执行，并探索其他专家级示例，帮助您使用\
  \ Tableau Exchange 进行计算、制图和可视化设计。\n\n后续章节将通过实操示例教您有关提升仪表板性能、连接 Tableau Server 以及理解数据可视化的所有知识。最后，您将涵盖自助式分析、时间序列分析和地理空间分析等高级用例，并将\
  \ Tableau 连接到 Python 和 R，以在 Tableau 中实现编程功能。\n\n最后，新增了一个全新章节，涵盖一个非常热门的主题：数据治理。您将探索\
  \ Tableau Server 重要功能的介绍，这些功能将助您做好准备，以符合 GDPR 和其他数据隐私及治理法规。\n\n读完这本 Tableau 书籍后，您将精通\
  \ Tableau 2023，并能够应对数据分析领域的常见和高级挑战。\n\n## 适读人群\n\n本书专为业务分析师、商业智能专业人士和数据分析师设计，旨在帮助他们精通\
  \ Tableau，以解决一系列数据科学和商业智能问题。如果您有 Tableau 使用经验，将能更快上手相关功能，但这并非先决条件。\n\n## 本书内容涵盖\n\
  \n- *第 1 章：回顾基础知识* — 带您了解开始所需的基本和核心 Tableau 概念。\n- *第 2 章：准备您的数据* — 这是一个以理论为导向的章节，将帮助您理解数据准备，从而更轻松地处理混乱数据。\n\
  - *第 3 章：使用 Tableau Prep Builder* — 讨论 Tableau Prep Builder，它是 Tableau Desktop 不那么“小”的提取-转换-加载\
  \ (ETL) 兄弟产品。\n- *第 4 章：了解联接、混合和数据结构* — 解答是使用关系、联接还是混合来组合数据的问题。\n- *第 5 章：表计算简介*\
  \ — 涵盖表计算这一特殊情况，它利用数据顺序分配排名等值。\n- *第 6 章：利用 OData、数据加密、大数据和 Google BigQuery* — 教您如何利用大数据解决方案和数据加密的概念。\n\
  - *第 7 章：实践详细级别计算* — 帮助您理解这一高级主题，它可以更改特定计算的数据聚合方式。\n- *第 8 章：超越基础* — 向您介绍高级可视化概念以及\
  \ Tableau Exchange、扩展程序、加速器和连接器。\n- *第 9 章：使用地图* — 涵盖 Tableau 内部及部分外部制图功能，使用自定义多边形、热力图和分层地图。\n\
  - *第 10 章：使用 Tableau 进行演示* — 展示使用 Tableau 进行演示的技巧和窍门。\n- *第 11 章：设计仪表板和可视化最佳实践*\
  \ — 带您了解不同的格式化技巧和设计规则，以最大化可视化的美感。\n- *第 12 章：利用高级分析* — 将通过三个可跟随实操的高级用例（自助式、时间序列和地理空间分析）帮助您将分析技能提升到新高度。\n\
  - *第 13 章：提升性能* — 针对性能的各个方面进行探讨，旨在赋能您创建快速加载的仪表板，以获得最佳用户体验。\n- *第 14 章：探索 Tableau\
  \ Server 和 Tableau Cloud* — 涵盖 Tableau Server 的不同产品和功能，包括 Ask Data 和 Data Details。\n\
  - *第 15 章：集成编程语言* — 展示如何将 R 和 Python 与 Tableau 集成，以启用（近乎）无限的分析能力。\n- *第 16 章：建立数据治理实践*\
  \ — 向您介绍数据治理这一广泛且重要的主题，以及如何利用 Tableau Server 实现合规。\n\n## 如何充分利用本书\n\n具备 Tableau\
  \ 基础知识将大有裨益，并且在 14 天免费试用期结束后，您将需要 Tableau 许可证。如果您希望充分利用 *第 15 章：集成编程语言*，具备 R 或 Python\
  \ 的基础知识也将有所帮助。当然，您也可以跟随步骤边学边练。\n\n其他有用的安装将在书中根据需要提及，均属于 Windows 或 Mac 上普通免费软件安装的范畴。\n\
