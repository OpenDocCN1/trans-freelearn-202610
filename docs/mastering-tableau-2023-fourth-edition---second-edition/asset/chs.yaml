  ### Lookup 和 Total


  以下工作表的目标是显示在 2013 年最后两天进行购买的客户，以及 12 月相关的绝对销售额和相对销售额。


  在下表中，`LOOKUP` 表现为定向，而 `TOTAL` 是非定向。这种行为在结果中很容易注意到。请按照以下步骤操作：


  1.  在与本章关联的工作簿中，导航至 `Lookup/Total` 工作表。

  2.  将 `Customer Name` 和 `Order Date` 拖至 `Rows` 货架。通过右键单击并选择 `Day` 以及 `Discrete`，将
  `Order Date` 设置为 `Month/Day/Year` 离散型。

  3.  将 `Order Date` 放置在 `Filters` 货架上，选择仅查看 2013 年 12 月，并选择 `Month/Year` 作为日期格式。

  4.  创建以下计算字段：


  | 名称 | 计算 |

  | --- | --- |

  | `Lookup Intervening Time` | `DATEDIFF(''day'', LOOKUP(MAX([Order Date]), 0), MAKEDATE(2013,12,31))`
  |

  | `% Total Sales` | `SUM([Sales])/TOTAL(SUM([Sales]))` |


  1.  右键单击 `% Total Sales`，选择 `Default Properties` | `Number format`，将数字格式设置为百分比，保留两位小数。

  2.  将 `Lookup Intervening Time` 放置在 `Filters` 货架上，并选择 0 到 1 的范围。

  3.  双击 `Sales` 和 `% Total Sales`，将这两个字段放置在视图上。

  4.  根据需要进行格式化：


  ![](img/B18435_05_02.png)


  图 5.2：总销售额


  让我们考虑一下前面的工作表是如何运作的：


  *   `Order Date` 上的筛选器确保返回给 Tableau 的数据集仅包含 2013 年 12 月的数据。

  *   `% Total Sales` `SUM([Sales])/TOTAL(SUM([Sales]))` 包含 `TOTAL(SUM([Sales]))`
  计算字段，它返回整个数据集的总销售额。用 `SUM([Sales])` 除以此总计可返回总计的百分比。

  *   `Lookup Intervening Time`：`DATEDIFF(''day'', LOOKUP(MAX([Order Date]), 0), MAKEDATE(2013,12,31))`
  将返回一个整数，反映 `LOOKUP` 函数返回的日期与 `12/31/2013` 之间的差异。请注意，`LOOKUP` 函数的偏移量为零。这导致每行返回与该行关联的日期。这与包含偏移量为
  -1 的 `LOOKUP` 函数的定向和非定向表计算不同，后者导致视图中的每行返回与前一行关联的数据。


  乍一看，您可能会认为可以通过从 `Filters` 货架中移除 `Lookup Intervening Time` 并调整 `[Order Date]` 上的筛选器以仅显示
  12 月的最后两天来简化此工作簿。然而，如果您这样做，`% Total Sales` 将在视图的所有行中加起来等于 100%，这将无法满足工作簿的目标。将 `Lookup
  Intervening Time` 视为不进行筛选，而是隐藏 12 月除最后两天之外的所有日期。这种隐藏确保了计算 `% Total Sales` 所需的数据位于缓存/分区的数据集中。


  真实场景：我使用 `Lookup` 的频率比 `Total` 高。两者在使用 Tableau 时都非常宝贵。我们已经看到，您可以使用 lookup 进行变化对比；您可以考虑月度利润对比、今天与去年同期的员工人数对比、每周每天的网站点击量差异等。




  对于表计算总计，每当您想要显示某事物的总数，同时仍在仪表板中显示一定程度的聚合时，都可以使用它。*图 5.2* 中 `Total` 的百分比实际上是完美的示例。


  ## Previous Value（前一个值）


  以下工作表的目标是返回每年的销售额聚合值，并设定明年的销售目标。请注意，提供了两种确定明年销售目标的选项，旨在演示 `PREVIOUS_VALUE` 与 `LOOKUP`
  的区别。此外，请注意 `PREVIOUS_VALUE` 的行为具有方向性。


  请看以下步骤：


  1. 在与本章关联的工作簿中，导航至 `Previous Value`（前一个值）工作表。


  2. 创建以下计算字段：


  | 名称 | 计算 |

  | --- | --- |

  | `Next Year Goal Prv_Val` | `PREVIOUS_VALUE(SUM([Sales])) * 1.05` |

  | `Next Year Goal Lkup` | `LOOKUP(SUM([Sales]), 0) * 1.05` |


  3. 将 `Order Date`（订单日期）放置在 `Rows`（行）货架上。


  4. 双击 `Sales`（销售额）和 `Next Year Goal Prv_Val`，将两者分别放置在视图中。


  5. 按需格式化，或参考以下屏幕截图（通过拖动 `Measure Values`（度量值）中的药丸，视图中的顺序会随之改变，如以下屏幕截图所示）：


  ![](img/B18435_05_03.png)


  图 5.3：明年


  让我们来分析前面工作表的运作方式：


  * `Next Year Goal Prv_Val`：此工作表中应用了 `PREVIOUS_VALUE(SUM([Sales])) * 1.05`，它检索每一前一行的结果并增加
  5%。换句话说，目标是所有年份每年 5% 的稳态增长率。


  * `Next Year Goal Lkup`：此工作表中也应用了 `LOOKUP(SUM([Sales]), 0) * 1.05`；此计算在今年的销售额基础上增加
  5%。换句话说，明年的目标是销售额比今年高 5%。不考虑以前的年份。


  为了更好地理解此练习，请参考前面屏幕截图中与 **2014** 关联的值。`Next Year Goal Prv_Val` 是通过 `2013 Next Year
  Goal Prv_Val` 计算得出的；即 `$560,577 * 1.05`。另一方面，`Next Year Goal Lkup` 是通过 **2014**
  年的销售额计算得出的；即 `$733,947 * 1.05`。


  真实场景：假设您想要推断一个数据点，并继续从该新值进行推断；为此，您可以使用 `Previous_Value`。一个例子是定期支付息票的债券。如果您的债券面值为
  100，并支付 4% 的半年息票，您可以使用 `Previous_Value` 计算债券的最终价值，就像我们在上一个练习中对 `Next Year Goal Prv_Val`
  所做的那样。


  ## Running（运行中/累计）


  以下工作表的目标是显示运行中最小利润、运行中平均利润和运行中最大利润，并将它们与数据集中每个月的 `SUM(Profit)` 进行比较。


  以下示例演示了 `Running` 函数如何按方向运作：


  1. 在与本章关联的工作簿中，导航至 `Running`（运行中）工作表。


  2. 创建以下计算字段：


  | 名称 | 计算 |

  | --- | --- |

  | `Running Min` | `RUNNING_MIN(SUM([Profit]))` |

  | `Running Max` | `RUNNING_MAX(SUM([Profit]))` |

  | `Running Avg` | `RUNNING_AVG(SUM([Profit]))` |


  3. 将 `Order Date`（订单日期）放置在 `Columns`（列）货架上，并将其设置为 `Month/Year`（月/年）连续型。将 `Measure
  Values`（度量值）放置在 `Rows`（行）货架上。


  4. 从 `Measure Values`（度量值）货架中移除所有度量实例，仅保留 `Running Min`、`Running Max`、`Running Avg`
  和 `Profit`。


  5. 将 `SUM(Profit)` 从 `Measure Values`（度量值）货架移至 `Rows`（行）货架。右键单击 `SUM(Profit)` 并选择
  `Dual Axis`（双轴）。


  6. 按需格式化。


  让我们来分析前面工作表的运作方式：


  * `Running Min`：前面的屏幕截图中显示了 `RUNNING_MIN(SUM([Profit]))`，它将当前 `SUM(Profit)` 与迄今为止记录的最小
  `SUM(Profit)` 进行比较。如果当前 `SUM(Profit)` 小于迄今为止记录的最小 `SUM(Profit)`，则当前 `SUM(Profit)`
  将取代该最小值。


  * `Running Max`：`RUNNING_MAX(SUM([Profit]))` 的运作方式与 `Running Min` 类似，当然区别在于它查找最大值。


  * `Running Avg`：`RUNNING_AVG(SUM([Profit]))` 根据截至当前月份的每个月计算平均 `SUM(Profit)`。


  真实场景：同样，此表计算有大量示例。考虑年初至今利润、基于出生人口数量（别忘了减去死亡人数）、当前未结支持工单数量等等。


  ## Window（窗口）


  以下工作表的目标是显示 `WINDOW` 函数的一个方向性实例和一个非方向性实例。


  请遵循以下步骤：


  1. 在与本章关联的工作簿中，导航至 `Window`（窗口）工作表。


  2. 创建以下计算字段：


  | 名称 | 计算 |

  | --- | --- |

  | `Win Avg Directional` | `WINDOW_AVG(SUM([Profit]), -2, 0)` |

  | `Win Avg Non-Directional` | `WINDOW_AVG(SUM([Profit]))` |


  3. 将 `Order Date`（订单日期）放置在 `Columns`（列）货架上，并将其设置为 `Month/Year`（月/年）连续型。将 `Measure
  Values`（度量值）放置在 `Rows`（行）货架上。


  4. 从 `Measure Values`（度量值）货架中移除所有度量实例，仅保留 `Win Avg Directional`、`Win Avg Non-Directional`
  和 `Profit`。


  5. 从 `Data`（数据）窗格中，将另一个 `Profit`（利润）实例拖至 `Rows`（行）货架。右键单击 `Rows`（行）货架上的 `Profit`（利润）实例，然后选择
  `Quick Table Calculation`（快速表计算）\| `Moving Average`（移动平均）。右键单击 `Rows`（行）货架上的 `Profit`（利润）实例，然后选择
  `Dual Axis`（双轴）。


  6. 右键单击标记为 `Moving Average of Profit`（利润移动平均）的轴，然后选择 `Synchronize Axis`（同步轴）。


  7. 按需格式化，或参考以下屏幕截图：


  ![](img/B18435_05_04.png)


  图 5.4：Window（窗口）


  让我们来分析前面工作表的运作方式：


  * `Win Avg Directional`：`WINDOW_AVG(SUM([Profit]), -2, 0)` 的起点为 -2，终点为 0，这意味着 Tableau
  将基于当前月份和前两个月计算出的 `SUM([Profit])` 平均值来创建一个点。将 `0` 改为 `2` 将导致每个点的平均值基于前 2 个月、当前月和后
  2 个月进行计算。双击 `Rows`（行）货架上的 `Profit`（利润）实例以查看底层代码。（这是通过右键单击并选择 `Quick Table Calculation`（快速表计算）\|
  `Moving Average`（移动平均）而转换为表计算的 `Profit` 实例。）请注意，该计算与为 `Win Avg Directional` 创建的代码完全相同。但是，如果您右键单击这两个药丸并选择
  `Edit Table Calculation`（编辑表计算），您会注意到生成的对话框有所不同。与 `Profit` 关联的对话框具有更多选项，包括更改前一个值和后一个值的功能。更改
  `Win Avg Directional` 的前一个值和后一个值需要调整计算字段。


  * `Win Avg Non-Directional`：`WINDOW_AVG(SUM([Profit]))` 与视图中的水平线相关联。请注意，它不依赖于方向。相反，它是缓存/分区中所有聚合
  `Profit` 值平均值生成的单个值，因此无论数据点的顺序如何，它都将保持相同。




  实际场景：为什么要使用窗口平均值？因为你想要平滑异常值，例如。窗口平均值提供了数据的稳定表现。单个高点或低点将被移除。如果你分析股票价格，你会注意到价格全年都可能不同！通过使用窗口平均值，或者更确切地说是窗口标准差作为预警指标，你将能更清晰地看到价格跳跃，并作为投资者采取行动。然而，稳定的增长或下降将落入移动带中。使用固定带无法实现这一点。


  ## 首项和末项


  以下工作表的目标是在 `Superstore` 数据集中显示最畅销商品的首项和末项实例。请注意以下示例如何演示 `FIRST()` 和 `LAST()` 函数的方向性行为。


  执行以下步骤：


  1. 在与本章关联的工作簿中，导航到 `First/Last` 工作表。

  2. 创建以下计算字段：


  | 名称 | 计算 |

  | --- | --- |

  | `First` | `FIRST()` |

  | `Last` | `LAST()` |

  | `First or Last` | `FIRST() = 0 OR LAST() = 0` |


  3. 将 `Product Name` 放到 `Filters`（筛选器）架上，选择 `Top`（前 N 项）选项卡，并按 `Sales`（销售额）的 `Sum`（求和）选择
  `Top` `1`，如下面的屏幕截图所示：


  ![](img/B18435_05_05.png)


  图 5.5：前 N 项筛选器


  4. 将 `First or Last` 放到 `Filters` 架上，并在生成的对话框中选择 `True`。

  5. 将 `Product Name`、`Order Date` 和 `Row ID` 拖到 `Rows`（行）架上。

  6. 将 `Order Date` 设置为 `Month/Day/Year`（月/日/年）离散型。

  7. 双击 `Sales`、`First` 和 `Last` 将它们分别放到视图中。

  8. 右键单击 `First`、`Last` 和 `First or Last`，然后选择 `Compute Using`（按以下方式计算）| `Table (down)`（表格（向下））。

  9. 按需设置格式：


  ![](img/B18435_05_06.png)


  图 5.6：首项和末项


  让我们来看看前面的工作表是如何运作的：


  * **首项**：`FIRST()` 从 `0` 开始，向下计数到缓存中数据集的最后一行。在前面的屏幕截图中，请注意 `Canon imageCLASS` 的首项实例出现在
  `05/24/13`。`FIRST()` 的范围从 `0` 到 `-4` 表明缓存中或窗口缓存内有五个 `Canon imageCLASS` 实例。

  * **末项**：`LAST()` 从缓存中数据集的最后一行开始，向下计数到 0。在前面的屏幕截图中，请注意 `Canon imageCLASS` 的末项实例出现在
  `11/18/14`。`LAST()` 的范围从 `4` 到 `0` 表明缓存中有五个 `Canon imageCLASS` 实例。

  * **首项或末项**：`FIRST() = 0 OR LAST() = 0` 放到 `Filters` 架上并设置为 `True` 时，会隐藏除首项和末项之外的所有匹配行实例。

  * `Row ID` 字段包含在视图中，以确保显示 `Canon imageCLASS` 的最早和最晚实例。否则，如果在首个或末个日期有多个 `Canon imageCLASS`
  实例，销售数字将反映多个值。为视图中的每个表计算将 `Compute Using` 设置为 `Table (down)` 非常重要。`Compute Using`
  与 `Addressing`（寻址）相同，将在 `Application of functions`（函数应用）部分详细讨论。


  实际场景：你可以使用这种计算来分析每季度最后 5 个订单之间的时间间隔，以查看订单间隔时间在一天中是增加还是减少。这随后有助于改进营销或更高效地安排服务台工时。


