- "# 第 13 章：提升性能\n\n一旦人们熟悉了 Tableau 的功能，很快就会遇到另一个类型的问题：性能。您可能都曾经历过盯着屏幕看着*正在加载数据*或*正在执行查询*的情况。但别担心，我们会帮您解决！如果设计得当，Tableau\
  \ 仪表板即使处理大量数据也能表现良好。\n\n本章将探讨性能的各个方面，旨在赋予您技术，创建加载快速、响应灵敏的工作簿，以应对最终用户的交互。\n\n在本章中，我们将讨论以下主题：\n\
  \n* 理解性能记录仪表板\n* 硬件和即时技术\n* 连接数据源\n* 使用提取数据\n* 明智地使用筛选器\n* 高效计算\n* 提升性能的其他方法\n\n\
  正如您所见，关于性能改进我们有许多主题要涵盖。因此，让我们不再浪费时间，直接深入。我们的第一个主题是性能记录，当您遇到性能下降时，这应该是您首先要查看的内容，因为它有助于您识别所有缓慢的根源。\n\
  \n## 理解性能记录仪表板\n\nTableau 将性能记录功能作为安装包的一部分，并以名为 `PerformanceRecording.twb` 的仪表板形式提供。该仪表板为\
  \ Tableau 作者提供了一种轻松理解和排查性能问题的方法。以下练习和相关讨论点将回顾性能记录仪表板的各个方面，包括如何生成它、如何用它提升性能，以及它是如何构建的。\n\
  \n执行以下步骤：\n\n1. 导航至 [`public.tableau.com/profile/marleen.meier`](https://public.tableau.com/profile/marleen.meier)\
  \ 以查找并下载与本章关联的工作簿。\n2. 导航至 `Types of Events` 工作表。\n3. 选择 `Help` | `Settings and\
  \ Performance` | `Start Performance Recording`。\n4. 在 Windows 上按 `F5` 或在 macOS 上按\
  \ `Command` + `R` 以刷新视图。\n5. 选择 `Help` | `Settings and Performance` | `Stop Performance\
  \ Recording`。将打开一个新仪表板：\n\n![](img/B18435_13_01.png)\n\n图 13.1：性能摘要\n\n有四个主要部分需要查看：\n\
  \n* **A) 性能摘要** 显示仪表板执行 *步骤 3*（开始性能记录）和 *步骤 5*（停止性能记录）之间发生的所有步骤所需的时间。滑块可用于筛选。\n\
  * **B) 时间线** 显示哪个步骤在何时发生以及耗时多久。\n* **C)** 步骤也按颜色编码，也可以在 **事件** 条形图中找到。\n* **D) 查询**\
  \ 仅在单击 (**B**) 或 (**C**) 中的任何事件时显示详细信息。\n\n让我们继续下一步：\n\n1. 将 (**A**) 中的 **事件** 时间线滑块拖至最左侧以显示所有事件。\n\
  2. 在 **按时间排序的事件** (**C**) 中，点击任何标题为 **执行查询** 的绿色条形。注意 **查询** 部分现在由高亮条形所属的 VizQL\
  \ 填充：\n\n![](img/B18435_13_02.png)\n\n图 13.2：事件\n\n1. 要查看完整查询，请导航到 **查询** 工作表并将适应设置为\
  \ **整个视图**（这里的 **查询** 是指 VizQL 查询）。请注意，特别长的查询可能不会完整记录。要查看此类查询的每一行，请参考位于 `My Tableau\
  \ Repository` 中的日志文件。\n\n前面的步骤旨在让您初步了解性能记录仪表板的用途。我通常用它来检查某个查询是否比其他查询耗时明显更长。然后我查看\
  \ **查询** 选项卡上的查询，通过阅读所用字段检查哪部分受影响，尝试更改它，然后再次运行性能仪表板以查看变化。现在，让我们看看更多细节。\n\n如果您从性能记录仪表板访问\
  \ `Events` 工作表，将看到不同的事件。我们现在将更详细地讨论这些事件及其对性能的影响：\n\n| **事件类型** | **性能考量** |\n| ---\
  \ | --- |\n| `Connecting to Data Source` | 连接数据源时性能不佳可能表明网络延迟或数据库问题，甚至是驱动程序过时。 |\n\
  \n\n\n\n\n| 生成提取 | 在提取前聚合数据并隐藏未使用的列可提高性能，因为这会分别减少总列数和行数。 |\n| 编译查询 | 编译查询性能问题可能表明存在数据库问题。\
  \ |\n| 执行查询 | 如果查询耗时过长，您可以通过筛选不需要的数据或隐藏未使用的字段来提高性能。有关详细信息，请参阅本章中的*明智地使用筛选器*一节。 |\n\
  | 排序数据 | 与排序问题相关的性能问题可能表明视图中标记过多。此排序问题也可能由依赖于视图中数据排序的表计算引起。 |\n| 地理编码 | 地理编码性能问题可能表明视图中标记过多、网络延迟问题、硬件配置不佳或显卡性能不足。\
  \ |\n| 数据混合 | 数据混合性能可通过减少底层数据量或进行筛选来改善。 |\n| 计算表计算 | 由于表计算通常在本地执行，复杂的计算可能会占用最终用户计算机的大量资源。\
  \ |\n| 计算总计 | 计算总计性能可通过减少底层数据量或进行筛选来改善。 |\n| 计算布局 | 计算布局性能问题可能表明仪表板包含过多工作表或元素（如图片）。\
  \ |\n\n在此概览之后（您随时可以返回查看），我们将深入探究，研究激活性能记录时会发生什么。请注意，以下内容假设作者正在使用 Tableau Desktop\
  \ 而非 Tableau Server。在*第 14 章* *探索 Tableau Server 和 Tableau Cloud* 中，我们将介绍 Tableau\
  \ Server 上的性能记录。\n\n记录性能时，Tableau 最初会在 `My Tableau Repository\\Logs` 中创建一个名为 `performance_[timestamp].tab`\
  \ 的文件。此外，Tableau 程序目录中还有一个名为 `PerformanceRecording_new.twb` 的文件，例如 `C:\\Program\
  \ Files\\Tableau\\Tableau.[version]\\Performance`。录制停止后，该文件会自动打开，从而允许作者浏览结果。\n\n\
  我们刚了解了如何记录性能指标，以及如何使用 Tableau Desktop 和 Tableau Server（如果由管理员启用）随附的相关仪表板。在接下来的章节中，我们将逐步指导您了解可考虑的不同选项，以提高整体性能。\n\
  \n# 硬件与即时技巧\n\n尽管 Tableau Desktop 对硬件要求不高，但公司台式机或笔记本电脑性能不足的情况仍时有发生，特别是如果您是所谓的业务用户，日常工作不需要编程工具或大量处理能力。\n\
  \n因此，在本节中，我们将讨论技术要求。根据 [www.tableau.com](http://www.tableau.com)，最新的技术要求如下：\n\n\
  ## Windows\n\n| 要求 | 详细信息 |\n|-------------|---------|\n| 操作系统 | Microsoft Windows\
  \ 8/8.1、Windows 10 (x64)、Windows 11 |\n| 内存 | 2 GB |\n| 磁盘空间 | 至少 1.5 GB 可用磁盘空间\
  \ |\n| CPU | CPU 必须支持 SSE4.2 和 POPCNT 指令集 |\n\n## Mac\n\n| 要求 | 详细信息 |\n|-------------|---------|\n\
  | 操作系统 | macOS Catalina 10.15、macOS Big Sur 11.4+、macOS Monterey 12.6+（适用于 Tableau\
  \ 2022.3+）和 macOS Ventura（适用于 Tableau 2022.3+） |\n| 处理器 | Intel 处理器或 Apple Silicon\
  \ 处理器（使用 Rosetta） |\n| 磁盘空间 | 至少 1.5 GB 可用磁盘空间 |\n\n现在我们已掌握基础知识，让我们来看看一项可能会无意中拖慢性能的功能，以及如何解决它。我们的第一个即时技巧称为自动更新。\n\
  \n自动更新可通过工具栏上的图标、**工作表** \\| **自动更新**，或使用快捷键 Windows 上的 `F10` 或 Mac 上的 `Option`\
  \ + `Command` + `0` 来访问。自动更新为作者提供了暂停/恢复工作表和/或筛选器自动更新的选项，如果您想对布局进行多项更改，但希望避免 Tableau\
  \ 在每次更改后都重新加载，这将非常有用，因为每次加载都意味着向底层数据源发送新查询并进行处理，这会消耗处理能力。您只需暂停更新，进行更改，然后再运行一次更新即可。\n\
  \n以下练习演示了其工作原理：\n\n1. 打开与本章关联的工作簿，并导航到 `Auto Updates` 工作表。\n2. 在**数据**窗格中，选择 `Superstore`\
  \ 数据集。\n3. 将**州**放置在**行**货架上。\n4. 通过工具栏取消选择**自动更新工作表**：\n\n![](img/B18435_13_03.png)\n\
  \n图 13.3：自动更新工作表\n\n5. 将**城市**放置在**行**货架上**州**的右侧。请注意视图不会更新。\n6. 通过工具栏启用**自动更新工作表**。视图现在会更新。\n\
  7. 右键单击**行**货架上的**州**，然后选择**显示筛选器**。\n8. 右键单击**行**货架上的**城市**，然后选择**显示筛选器**。\n9.\
  \ 在**城市**筛选器上，单击下拉菜单，然后选择**多个值** **(列表)** 和**仅相关值**：\n\n![](img/B18435_13_04.png)\n\
  \n图 13.4：仅相关值\n\n10. 如*图 13.3*所示，取消选择**自动更新筛选器**。\n11. 在**州**筛选器中，仅选择**阿拉巴马州**。请注意**城市**筛选器不会更新。\n\
  12. 通过工具栏启用**自动更新筛选器**。**城市**筛选器现在会更新。\n\n自动更新非常有用。作者可以暂停自动更新，进行多项更改，然后恢复自动更新，从而节省时间并间接提高性能。\n\
  \n作为旁注，级联筛选器（如**仅相关值**或**上下文中的所有值**）在使用暂停按钮或自动更新时可能不会填充数据，因为它们依赖于首先传递查询。\n\n## 运行更新功能\n\
  \n暂停/恢复自动更新选项右侧的**运行更新**图标旨在刷新一次，同时用户可以保持**自动更新**功能处于禁用状态。以下简短示例有助于阐明此选项：\n\n1.\
  \ 复制名为 `Auto Updates` 的**上一个**工作表，并将副本命名为 `Run Updates`。\n2. 单击**暂停自动更新**图标以暂停所有更新。\n\
  3. 在**州**筛选器中随机选择多个州。\n4. 单击**运行更新**图标（如*图 13.5*所示），然后选择**更新筛选器**或**更新工作表**。运行更新的快捷键是\
  \ Windows 上的 `F9`。macOS 上的快捷键是 `Shift` + `Command` + `0`：\n\n![](img/B18435_13_05.png)\n\
  \n图 13.5：运行更新\n\n5. 在**州**筛选器中随机选择更多州。请注意自动更新仍处于暂停状态。\n\n重申一下，**运行更新**允许 Tableau\
  \ 作者在保持自动更新暂停的同时间歇性地刷新视图。我们刚才讨论的这两个更新功能将使您作为仪表板开发者的生活更轻松，因为您可以在加载（从而等待刷新数据）之前进行多项更改，但如果您想从根本上解决性能问题，则需要更多工具。下一节将介绍提取，这是一个加快计算和渲染速度的绝佳功能。\n\
  \n## 小型提取\n\n虽然提取将在*使用提取*一节中详细讨论，但在创作时的性能考量背景下提及提取似乎很合适。即使在最佳条件下，处理大型数据源也可能很慢。如果创作时不需要持续访问整个数据集，请考虑创建一个小型的本地提取。尽可能多地创作工作簿，然后在真正需要所有底层数据时，再指向原始数据源。\n\
  \n以下步骤简要展示了此技术的实际操作：\n\n\n\n\n## 创建小型本地提取\n\n1. 在与本章关联的工作簿中，导航至 `Small Local Extract`\
  \ 工作表。\n2. 选择 `数据 | 新建数据源` 以选择所需的数据源。本练习假设使用 `Superstore.xls`（随 Tableau 安装），但您可以使用任何您喜欢的数据集。\n\
  3. 将任意字段拖放到 `文本` 货架上。在我的示例中，我使用了 `记录数`，这是一个仅包含数字 1 的计算字段。\n4. 右键单击数据源（对我而言是 `Superstore`）并选择\
  \ `提取数据…`：\n\n![](img/B18435_13_06.png)\n\n图 13.6：提取数据\n\n5. 在 `提取数据…` 对话框底部，选择\
  \ `前`、您的数据源，并选择 `1000`。在下图中，已选择 `订单`，它是超市连接的两个部分之一：\n\n![](img/B18435_13_07.png)\n\
  \n图 13.7：前 N 行\n\n6. 单击 `提取` 按钮，注意记录数现在显示为 `1000` 行。\n7. 在 `数据` 窗格中，右键单击 `Superstore`\
  \ 并取消选择 `使用提取`。注意 `记录数` 已恢复为其原始值。\n\n通过创建一个小型的本地提取，Tableau 作者缓解了两个性能瓶颈：网络延迟和数据集大小。\n\
  \n本节向您介绍了如何临时减小数据集以及如何恢复到原始大小的方法，且均无需离开 Tableau 界面。这是加快仪表板构建过程、避免长时间等待的绝佳方式。在下一节中，我们将讨论如何连接数据源以实现最佳性能。\n\
  \n# 连接数据源\n\nTableau 的优势之一在于您可以轻松地通过多种方式连接到许多不同的数据源。正如本书前面所述，Tableau 中定义了许多连接器，用于与各种数据源进行交互。此外，这种灵活性不仅限于连接单个表或文件。\n\
  \n尽管 Tableau 让连接各种数据源变得容易，但必须强调的是，Tableau **不是** `Extract, Transform, and Load (ETL)`（抽取、转换、加载）工具。如果需要复杂的连接和复杂的数据混合来生成有用的结果，建议在\
  \ Tableau 之外执行 ETL 工作，例如在 `Tableau Prep Builder` 中（有关此服务的更多信息，请参阅 `第 3 章` `使用 Tableau\
  \ Prep Builder`）。ETL 工作理想情况下将带来更好的数据建模，从而在 Tableau 中实现更轻松的创作和更快的性能。\n\nTableau 连接数据的四种方式如下：\n\
  \n*   Tableau 可以连接到单个表。这是理想的选择，因为它允许最大的功能性和最简单的故障排除，同时使 Tableau 能够发送最简单的查询，从而实现最佳性能。然而，并不总是能连接到单个表，尽管这很理想，但施加如此严格的限制是不合理的。数据源与报表工具之间的关系在不断变化。一个在数据连接方式上缺乏灵活性的报表工具不太可能成功，无论其最终结果多么优雅美观。\n\
  *   第二种选择是关系，这是一种更新、更灵活的组合两个或多个数据集的方式。详细程度将在每个工作表中定义，而不是在 `数据源` 选项卡中，这使得该功能非常强大。\n\
  *   Tableau 连接数据的第三种方式是通过连接。单个表可能无法提供所有必要数据，但通过连接两个或多个表，可能访问到所有所需数据。随着连接变得越来越复杂，性能可能会受到影响，故障排除也可能变得困难。幸运的是，Tableau\
  \ 可以假设参照完整性，因此即使面对复杂的连接也能相当高效地工作。更多信息请见此处：[`help.tableau.com/current/pro/desktop/en-us/joins_xbd_perf.htm`](https://help.tableau.com/current/pro/desktop/en-us/joins_xbd_perf.htm)。\n\
  *   最后，Tableau 可以利用数据混合。数据混合通常表现良好，前提是混合的数据源中**不超过一个**是大型数据源，且用于混合的维度成员相对较少。\n\n\
  只要可能，应优先选择关系而非连接，选择连接而非混合。混合多个大型数据源时，性能可能会受到严重影响。当在高基数维度上进行混合时，问题会进一步加剧。此外，数据混合限制了一些功能，例如无法使用来自辅助数据源的维度、行级计算或\
  \ LOD 表达式。\n\n然而，也存在例外，此处讨论其中两种：\n\n*   首先，当两个表之间没有共享的公共键时，数据混合具有优势（且通常是必要的）。\n\
  *   其次，在某些情况下，交叉连接将不起作用，需要数据混合。例如，当您处理两个具有不同粒度的数据集且关系不可行时，或跨数据库连接不可行时（例如连接到立方体或仅提取的连接），或当您拥有大型数据集且混合能提高性能时，请使用数据混合。\n\
  \n更多信息请见此处：[`help.tableau.com/current/pro/desktop/en-us/multiple_connections.htm`](https://help.tableau.com/current/pro/desktop/en-us/multiple_connections.htm)。\n\
  \n基于这些原因，请将其作为指导原则：如果存在连接选项，通常应避免数据混合。\n\n`第 4 章` `了解连接、混合和数据结构` 提供了关于连接和混合的详细信息。就本章而言，关于连接和混合的讨论将局限于性能考量。\n\
  \n## 高效处理大型数据源\n\n本节将介绍一些数据库调优的基础知识以及高效处理大型数据源的方法。由于该主题更侧重于数据源而非 Tableau，因此不包含练习。\n\
  \n如果您正在连接大型数据源并遇到性能问题，与 `数据库管理员 (DBA)` 交谈可能会有所帮助。\n\n清晰的沟通加上少量的数据库工作可以显著提高性能。谈话应包括数据库调优要点，例如显式定义主键和外键、将列定义为\
  \ `not null` 以及建立索引。下面将讨论每一点。\n\n### 定义主键和外键\n\n主键和外键对于连接表至关重要。主键由表中的一列或多列组成。主键应对每一行都是唯一的。在非唯一的行级键上进行连接可能会导致错误的结果，这一点在\
  \ `第 4 章` `了解连接、混合和数据结构` 中有所探讨。在数据库中显式定义主键有助于确保每个键值都是唯一的：\n\n![](img/B18435_13_08.png)\n\
  \n图 13.8：数据库键\n\n外键由表中的一列或多列组成，它们在另一张表中唯一标识行。这种唯一标识是由于一张表中的外键引用了另一张表中的主键而产生的。在数据库中显式定义外键使\
  \ Tableau 能够绕过许多完整性检查，从而提高性能。\n\n### 将列定义为 NOT NULL\n\nTableau 发布了多篇关于性能改进技巧的白皮书\
  \ ([`help.tableau.com/current/pro/desktop/en-us/performance_tips.htm`](https://help.tableau.com/current/pro/desktop/en-us/performance_tips.htm))，指出程序员和\
  \ Tableau Desktop 都不喜欢 `NULL` 数据。如果可能，请为表中的每一列定义显式的 `NOT NULL`。\n\n在实践中，数据库管理员对于何时适合将列定义为\
  \ `NOT NULL`、何时不适合存在争议；然而，有两点是明确的：\n\n\n\n主键或外键应定义为 `NOT NULL`。这显而易见，因为主键和外键根据定义必须是唯一的。\n\
  \n此外，任何要建立索引的列都应定义为 `NOT NULL`，否则索引可能无法使用。\n\n索引将在下一节详细讨论。\n\n## 索引\n\n让我们考虑关于索引的两个问题：\n\
  \n*   什么是索引？\n*   应该为什么建立索引？\n\n第一个问题对 DBA 来说很容易回答，但对于普通 Tableau 作者来说可能是未知领域。为了澄清，索引是数据库表中选定列的副本，经过优化以实现高效搜索。由于这些复制的列包含指向原始列的指针，因此可以快速访问它们以查找给定行并返回所需数据。\n\
  \n一个小例子可能会有所帮助。根据波音公司的数据，787 梦想客机约有 230 万个零件。想象一个在 `Part_Name` 列中列出所有这些零件的表。你的任务是搜索此列中以“fuse”字符串开头的每个零件。在非索引列上，这将需要检查数据库中的每一行数据。这种搜索可能非常缓慢。幸运的是，索引可用于减少搜索的行数，从而使过程快得多。用于索引的一种结构化数据类型是\
  \ `B-tree`。`B-tree` 数据结构是排序的。因此，当使用 `B-tree` 数据结构访问索引以搜索所有以 *fuse* 开头的零件时，不必考虑每一行。相反，数据库可以直接跳到\
  \ *fs* 并快速返回所需的行。\n\n现在让我们继续讨论索引的第二个问题。应该为什么建立索引？这个问题可以简明扼要地回答：理想情况下，数据源中用于连接或过滤的所有列都应该建立索引。\n\
  \n尽管在 Tableau 中创建更高效连接有一些基本性能考虑（例如，当左连接足够时避免使用外连接），但连接性能主要由 Tableau 外部决定。因此，为连接中使用的列建立索引通常比为过滤中使用的列建立索引更重要。\n\
  \n继续讨论操作数据源，下一节将介绍 Tableau 如何用于通过提取创建汇总数据集。\n\n# 使用提取\n\n本节将讨论什么是 Tableau 数据提取，以及如何高效构建提取。我的一位同事最近为一家相对较小的移动电话服务提供商提供咨询。尽管公司规模不大，但通话量可能超过\
  \ 100 万次/天。公司管理层坚持要求能够在 Tableau 工作簿中使用详细的可视化界面查看单个通话。工作簿的性能自然成了一个问题。这种低级别的详细信息真的有必要吗？较少的细节和更快的工作簿是否能带来更好的商业决策？\n\
  \n为了在业务需求与实际性能要求之间取得平衡，企业通常需要确定什么级别的详细信息对报告真正有帮助。通常，详细粒度并非必要。在这种情况下，汇总表可能提供足够的业务洞察，同时实现快速性能。对于移动电话服务提供商，每日通话量快照可能就足够了。即使是每小时快照也会大大减小表的大小并提高\
  \ Tableau 的性能。\n\n为了满足这一常见业务需求，提取是由 Tableau Desktop 创建的专有压缩数据源。自发布以来，提取的文件扩展名已从\
  \ `.tde` 更改为 `.hyper` 格式。因此，新格式利用了在《第 1 章 回顾基础知识》中讨论的 `Hyper` 引擎。提取可以存储在本地，并由 Tableau\
  \ 访问以渲染可视化。\n\n考虑以下使提取文件成为提高性能的绝佳选择的要点：\n\n*   提取可以在聚合级别快速生成。\n*   提取是列式存储，以列序列的形式记录数据。\n\
  *   关系型数据库通常使用 **行存储** 方法存储数据。\n\n在下面的示例中，请注意 **行存储** 非常适合返回单个行，而 **列存储** 更适合返回聚合数据。\n\
  \n这是一个示例表：\n\n| | **表** | | | |\n|---|---|---|---|---|\n| | **Instrument** | **Store**\
  \ | **Price** |\n| Row 1 | Selmer Trumpet | North | $3,500 |\n| Row 2 | Conn French\
  \ Horn | East | $4,500 |\n| Row 3 | Getzen Trombone | South | $2,500 |\n| Row 4\
  \ | Miraphone Tuba | West | $9,000 |\n\n这是数据库中的 **行存储** 表：\n\n| **Row 1** | Selmer\
  \ Trumpet |\n|---|---|\n| | North |\n| | $3,500 |\n| **Row 2** | Conn French Horn\
  \ |\n| | East |\n| | $4,500 |\n| **Row 3** | Getzen Trombone |\n| | South |\n| |\
  \ $2,500 |\n| **Row 4** | Miraphone Tuba |\n| | West |\n| | $9,000 |\n\n这是数据库中的\
  \ **列存储** 表：\n\n| **Instrument** | Selmer Trumpet |\n|---|---|\n| | Conn French\
  \ Horn |\n| | Getzen Trombone |\n| | Miraphone Tuba |\n| **Store** | North |\n|\
  \ | East |\n| | South |\n| | West |\n| **Price** | $3,500 |\n| | $4,500 |\n| | $2,500\
  \ |\n| | $9,000 |\n\n我希望你能看到，在 **列存储** 表中，某个属性的每第 *n* 行组成第一行。例如，`Instrument` 的第一行、`Store`\
  \ 的第一行和 `Price` 的第一行都与一个条目相关，而在 **行存储** 表中，属于同一条目的所有行都按连续顺序排列。\n\n总结一下本节迄今所学，提取使用压缩技术减小文件大小，同时保持性能，并利用内存和硬盘空间实现最佳性能。使用数据库实时连接时，这两点都无法实现——因此，当数据库无法满足性能要求时，提取可以提高仪表板的性能。\n\
  \n## 构建提取\n\n本节将从性能角度讨论提取。提取的其他方面（如计划和增量刷新）不在本节讨论范围内，更多信息请参阅：<https://help.tableau.com/current/pro/desktop/en-us/extracting_refresh.htm>。\n\
  \n正如我们在前面的“小型提取”节中讨论的，提取是通过 `Data` | `[Data Source]` | `Extract Data` 创建的。从生成的对话框中，我们可以执行以下操作：\n\
  \n*   **按需筛选提取**：有时需要精确反映数据源的提取，但通常筛选各种字段仍会用所需数据填充提取，同时缩小大小并提高性能。要添加筛选器，只需单击 `Add...`\
  \ 访问与工作表中使用的 `Filter` 对话框相同的对话框。\n\n*   **聚合到视图中表示的粒度级别**：聚合不仅减小文件大小，从安全角度也有帮助。如果不聚合，提取将使用行级数据构建。因此，Tableau\
  \ 作者应注意，如果在构建提取时未选择聚合，任何敏感的行级数据都可访问：\n\n![Figure 13.9: Aggregation](img/B18435_13_09.png)\n\
  \n*   **减少行数**：正如“小型提取”节所示，减少行数可让作者创建小型本地提取以快速构建工作簿，之后可访问原始数据源进行完整分析：\n\n![Figure\
  \ 13.10: Reducing rows](img/B18435_13_10.png)\n\n\n\n*   `Hide all unused fields`：此选项会从提取文件中排除工作簿中未使用的所有列。这可以显著减小提取文件的大小并提高性能：\n\
  \n![](img/B18435_13_11.png)\n\n图 13.11：隐藏字段\n\n采取这四项措施后，性能应立即得到改善。请随意使用 `performance-recording\
  \ tool`（性能记录工具）并创建同一数据源的不同提取文件来自行测试。稍后将讨论聚合和 `performance-recording actions`（性能记录操作）的使用。\n\
  \n## 聚合\n\n以下练习将使用来自单个数据源的两个聚合数据，一个位于 `State`（州）级别，另一个位于 `City`（城市）级别。这些聚合数据源将用于创建两个工作表。这些工作表将与第三个包含行级信息的工作表一起放置在一个仪表板上。最后，将创建筛选器操作以将这三个工作表关联起来。练习的目的是演示如何将小型提取文件与较大的数据集结合使用，以创建性能更佳的仪表板：\n\
  \n1.  打开与本章关联的工作簿，并导航至 `State Agg` 工作表。\n2.  在 `Data`（数据）窗格中，选择 `State Agg` 数据源。\n\
  3.  通过将 `State` 放置在 `Detail`（详细信息）货架上，并从 `Marks`（标记）卡中选择 `Filled Map`（填充地图），创建一个填充地图。\n\
  4.  右键单击 `State Agg` 数据源，然后选择 `Extract Data`（提取数据）。\n5.  请注意，Tableau 会显示一条错误消息，指出找不到引用的文件。您可以指向\
  \ Tableau 自带的 `Superstore` 实例，或使用通过 GitHub 链接提供的实例：`https://github.com/PacktPublishing/Mastering-Tableau-2023-Fourth-Edition/tree/main`。\n\
  6.  连接到数据源后，Tableau 将显示 `Extract Data`（提取数据）对话框。在该对话框中，选择 `Aggregate data for visible\
  \ dimensions`（聚合可见维度的数据）和 `All rows`（所有行）。单击 `Hide All Unused Fields`（隐藏所有未使用字段）按钮，然后单击\
  \ `Extract`（提取）：\n\n    ![](img/B18435_13_12.png)\n\n    图 13.12：提取数据\n\n    请注意，生成的提取文件仅包含\
  \ `State`。另请注意，数据已被聚合，因此无法获取底层数据。\n\n1.  导航至 `City Agg` 工作表。\n2.  在 `Data`（数据）窗格中，选择\
  \ `City Agg` 数据源。请注意，此数据源已被提取，因此仅包含 `State`、`City` 和 `Sales`。另请注意，数据已被聚合，因此无法获取底层数据。\n\
  3.  将 `City` 放置在 `Rows`（行）货架上，`Sales` 放置在 `Text`（文本）货架上，`State` 放置在 `Detail`（详细信息）货架上。别忘了包含\
  \ `State`，即使它不在视图中显示。必须使用它，以便练习结束时创建的仪表板能正常工作。\n4.  导航至 `Row Detail` 工作表并选择 `Superstore`\
  \ 数据集。\n5.  创建一个显示 `Customer Name`（客户名称）、`Order ID`（订单 ID）、`Row ID`（行 ID）、`Profit`（利润）和\
  \ `Sales`（销售额）的交叉表视图。快速创建此视图的一种方法是双击每个字段。\n6.  导航至 `Agg Dash` 仪表板，并将这三个工作表均放置在仪表板上。\n\
  7.  在 `Superstore` 和 `City Agg` 数据源之间，创建 `City` 和 `State` 的混合关系：\n\n![](img/B18435_13_13.png)\n\
  \n图 13.13：混合\n\n1.  通过 `Dashboard`（仪表板）| `Actions`（操作）| `Add Action`（添加操作）| `Filter`（筛选器）创建以下操作：\n\
  \n![](img/B18435_13_14.png)\n\n图 13.14：添加 City 到 Detail 操作\n\n1.  通过 `Dashboard`（仪表板）|\
  \ `Actions`（操作）| `Add Action`（添加操作）| `Filter`（筛选器）创建以下操作：\n\n![](img/B18435_13_15.png)\n\
  \n图 13.15：添加 State 到 City 操作\n\n1.  创建这两个操作后，在仪表板中，单击 `State` 字段。\n2.  然后，单击 `City`\
  \ 字段。\n3.  单击 `City Agg` 工作表的空白区域，以排除 `Row Detail` 上的所有值。\n4.  单击 `State Agg` 工作表的空白区域，以排除\
  \ `City Agg` 上的所有值。\n5.  按需格式化仪表板：\n\n![](img/B18435_13_16.png)\n\n图 13.16：仪表板上的操作\n\
  \n完成此练习后，请注意，生成的仪表板之所以性能良好，原因如下：\n\n*   用户首次打开仪表板时，仅显示 `State Agg`。这有两个性能优势。首先，打开仪表板时仅显示单个工作表（而不是每个工作表）会导致更少的初始查询和更少的渲染。其次，访问小型提取文件比访问较大的数据源更快。\n\
  *   由于 `City Agg` 工作表也在访问小型提取文件，因此当用户单击某个州时，`City Agg` 工作表将快速出现。\n*   当用户单击 `City`\
  \ 时，会向仅包含该城市信息的数据源发起调用。将提取相对较少的数据，因此即使对于较大的数据集，性能也应良好。\n\n除了使用聚合提取文件外，还应考虑良好性能实践的另一个方面。该仪表板不包含\
  \ `quick filters`（快速筛选器）。通常，在仪表板上使用 `quick filters` 是不必要的。如果仪表板上的工作表可用于筛选，这些工作表基本上可以起到双重作用。也就是说，工作表可以在提供有价值分析的同时，充当仪表板上其他工作表的筛选器。与使用\
  \ `quick filters` 相比，这代表了性能的提升，因为添加 `quick filters` 会导致向底层数据源发送额外的查询。\n\n在前面的仪表板中，每个工作表引用不同的数据源。因此，您可能会问，操作筛选器如何能跨不同数据源发挥作用？答案可以在筛选器操作对话框中找到。如\
  \ `图 13.14` 和 `图 13.15` 所示，所有字段均被视为 `Target Filters`（目标筛选器）。Tableau 只是简单地匹配每个数据源中同名的字段。提取文件可以经过优化以获得更好的性能结果。我们将在下一节介绍这一点。\n\
  \n## 优化提取文件\n\n优化通过在可能的情况下物化计算字段来加速性能。这意味着 Tableau 会在提取文件中为计算字段生成值，以便查找这些值而不是计算它们。如果您使用\
  \ `table calculations`（表计算），Tableau 每次更改视图时都必须计算这些值。\n\n请注意，并非所有计算字段都会被物化。不被物化的字段包括\
  \ `table calculations`（表计算）、可变或不稳定的函数（如 `NOW()` 和 `TODAY()`）以及使用 `parameters`（参数）的计算字段。\n\
  \n首次创建提取文件时，它会自动进行优化。换句话说，计算字段会在可能的情况下自动物化。然而，随着时间的推移，计算字段可能会被修改，导致提取文件丢失物化字段。此时，请打开\
  \ `Data`（数据）| `[Data Source]`（数据源）| `Extract`（提取），然后单击 `Compute Calculations Now`（立即计算计算字段）以重新生成物化字段：\n\
  \n![](img/B18435_13_17.png)\n\n图 13.17：计算计算字段\n\n如果提取文件设置为在 `Tableau Server` 上刷新，则每次刷新时都会自动优化提取文件。\n\
  \n最后，如果您在仪表板中使用了 `parameters`（参数），请检查是否可以消除它们并改用 `calculations`（计算字段）以提高性能。此外，如果\
  \ `calculations` 无法作为一个整体被物化，请对其进行拆分。将可物化的部分放在一个 `calculated field`（计算字段）中，将不可物化的部分放在另一个中。如果\
  \ `calculation` 的部分内容可以在提取文件创建期间计算，您将获得性能提升。\n\n使用提取文件的优势已详细讨论，现在让我们继续看看如何充分利用筛选器。\n\
  \n# 明智地使用筛选器\n\n\n\n\n# Tableau 筛选器与性能\n\n筛选器通常能提升 Tableau 的性能。例如，当使用维度筛选器仅查看西部地区时，查询会被传递给底层数据源，从而仅返回该地区的信息。通过减少返回的数据量，性能得以提升。这是因为数据变少意味着网络带宽负载降低、数据库处理需求减少，以及本地计算机处理需求减少。\n\
  \n筛选器也可能对 Tableau 的性能产生负面影响。例如，使用 `only relevant values`（仅相关值）会导致额外的查询被发送到底层数据源，从而拖慢响应时间。此外，从高基数维度创建快速筛选器也会损害性能。\n\
  \nTableau 的筛选器按特定顺序执行，使用时请牢记这一点。以下流程图连同一个时长一小时的演示链接，可能有助于您彻底掌握该概念：[`help.tableau.com/current/pro/desktop/en-us/order_of_operations.htm`](https://help.tableau.com/current/pro/desktop/en-us/order_of_operations.htm)：\n\
  \n![](img/B18435_13_18.png)\n\n图 13.18：筛选操作顺序\n\n本节其余内容将逐步遵循操作顺序。读完后，您将了解在何种情况下使用哪种筛选器，以使仪表板达到最佳性能。\n\
  \n## 提取筛选器\n\n提取筛选器从提取的数据源中移除数据。简单来说，数据不存在了。因此，通过减少数据总量来提升性能。由于提取的数据使用 Tableau 专有的列式数据集，性能也可能因此得到改善。\n\
  \n此外，提取始终是扁平化的，与使用联接连接数据集相比，这将具有性能优势。要创建提取筛选器，首先选择 `Data` | `Extract Data`（数据 |\
  \ 提取数据）。在生成的对话框中，选择添加筛选器。\n\n## 数据源筛选器\n\n数据源筛选器应用于整个工作簿。例如，如果您创建一个数据源筛选器，移除 `Country`（国家）维度除\
  \ USA 以外的所有成员，则 `Country` 维度将仅包含 USA，这适用于工作簿中的所有工作表。\n\n数据源筛选器提升性能的方式与维度和度量筛选器相同；即数据源筛选器会导致\
  \ Tableau 向底层数据源生成查询，从而限制返回的数据。返回的数据越少，通常处理和渲染速度越快。数据源筛选器提供的另一个优势是创作简便。例如，如果 Tableau\
  \ 作者预先知道整个工作簿将以 USA 为中心，创建数据源筛选器就省去了为使用该数据源的工作簿中的每个工作表应用维度筛选器的麻烦。\n\n另请注意，数据源筛选器在流程中发生得相当早。所有计算（包括在维度和度量筛选器触发前渲染的使用固定\
  \ LOD 表达式的计算）都遵守数据源筛选器。\n\n要创建数据源筛选器，请单击 `Tableau Desktop` 左下角的 `Data Source`（数据源）选项卡。然后，单击页面右上角的\
  \ `Add`（添加）链接：\n\n![](img/B18435_13_19.png)\n\n图 13.19：添加筛选器\n\n## 上下文筛选器\n\n上下文筛选器的创建方法很简单：右键单击\
  \ `Filter`（筛选器）架构上的字段，然后选择 `Add to Context`（添加到上下文）：\n\n![](img/B18435_13_20.png)\n\
  \n图 13.20：上下文筛选器\n\n维度筛选器和度量筛选器是相互独立的。每个筛选器独立查询数据源并返回结果。而上下文筛选器则会强制维度筛选器和度量筛选器依赖于它。在某些情况下，这种行为有助于（且必须）获得正确答案。例如，如果\
  \ Tableau 作者访问 `Superstore` 数据集，并对 `Product Names`（产品名称）使用筛选器以返回单个类别中销量前 10 的产品名称，则必须将\
  \ `Category`（类别）定义为上下文筛选器。否则，`Product Names` 筛选器将返回总体前 10 名。因此，上下文筛选器能提升性能。\n\n\
  ## 维度筛选器和度量筛选器\n\n维度筛选器和度量筛选器可以提升性能。由于无论是维度筛选器还是度量筛选器，都会导致 Tableau 向底层数据源生成查询，从而限制返回的数据，因此性能得以提升。简单来说，返回的数据集越小，性能越好。\n\
  \n然而，维度筛选器和度量筛选器也可能降低性能。因为 Tableau 不仅为了显示可视化而向底层数据源生成查询，还为了显示筛选器而生成查询，所以显示的筛选器越多，性能越慢。此外，高基数维度上显示的筛选器会抑制性能。（成员很多的维度称为高基数。）考虑一个显示数据集中每个客户的筛选器示例。此类筛选器的性能可能很慢，因为必须找到并返回底层数据集中的每个客户，然后\
  \ Tableau 必须在筛选器中渲染并显示每个客户。\n\n在视图中使用两个或多个维度或度量筛选器时，可以使用相关筛选器来限制显示的选项。例如，如果视图包含城市和邮政编码的筛选器，后者可以设置为显示\
  \ `Only Relevant Values`（仅相关值）：\n\n![](img/B18435_13_21.png)\n\n图 13.21：仅相关值\n\n\
  这对最终用户有利，因为它会调整显示的邮政编码数量，仅反映与第一个筛选器中所选城市相关的邮政编码。然而，使用相关筛选器会导致额外的查询被发送到数据源，从而可能降低性能。\n\
  \n## 表计算筛选器\n\n将表计算用作筛选器，其带来的性能提升与维度或度量筛选器不同。如前所述，维度和度量筛选器会减少返回的数据集，而表计算筛选器不会。在\
  \ Tableau 处理流程中，表计算要在数据从数据源返回*之后*才渲染。这意味着表计算无法用于生成查询以限制返回的数据。或者换个说法，表计算筛选器会导致返回与给定维度或度量相关的所有数据，随后\
  \ Tableau 在返回的数据集上执行筛选器。\n\n为演示这一点，请执行以下步骤：\n\n1.  打开本章关联的工作簿，并导航到 `Late Filter`（后置筛选器）工作表。\n\
  2.  在 `Data`（数据）窗格中，选择 `Superstore` 数据源。\n3.  创建一个名为 `Cust Name Tbl Calc` 的计算字段，代码如下：\n\
  \n    ```\n    LOOKUP( MAX( [Customer Name] ),0 )\n    ```\n\n4.  将 `Customer Name`\
  \ 放入 `Rows`（行）架构。\n5.  将 `Cust Name Tbl Calc` 放入 `Filters`（筛选器）架构，并限制为仅显示 `Aaron\
  \ Bergman`。\n6.  将 `Sales` 放入 `Text`（文本）架构。\n7.  右键单击 `Sales`，选择 `Quick Table Calculation`\
  \ | `Rank`（快速表计算 | 排名）。\n\n在此练习中，完整的客户列表被返回给 Tableau，随后 Tableau 部署筛选器。本质上，使用 `Cust\
  \ Name Tbl Calc` 作为筛选器仅仅是隐藏了底层数据。这很有用，因为返回的 `Aaron Bergman` 排名是正确的。仅按 `Customer\
  \ Name` 筛选会导致 `Aaron Bergman` 的排名为 `1`。遗憾的是，正确的结果伴随着性能损失。在此练习中运行性能记录器将显示表计算对性能产生负面影响。\n\
  \n\n\n\n\n幸运的是，随着 LOD 计算的出现，使用表计算作为筛选器通常已不再必要。LOD 是包含或排除当前视图之外数据的计算字段。更多信息请参阅*第\
  \ 5 章*，*介绍表计算*。\n\n## 使用操作代替筛选器\n\n提升性能的另一种方法可能是使用操作代替筛选器。您可以开发一个仪表板，首先显示高层概览，仅当用户选择某内容时才深入细节。其机制类似于我们在*聚合*部分展示的内容；不过，聚合是按工作表进行的，而非在数据源本身上进行。通过在高层概览中选择一个标记，将触发一个操作。用户可以深入查看详细信息，但详细程度将仅逐步增加。因此，一次加载的数据会更少。\n\
  \n关于此主题的精彩演示可在 [`youtu.be/veLlZ1btoms`](https://youtu.be/veLlZ1btoms) 找到。或者如果您有兴趣了解更多关于热-温-冷方法的信息，请随时阅读这篇文章：[`gemshare.org/2019/08/16/hot-warm-cold-data-architecture-best-practices/`](https://gemshare.org/2019/08/16/hot-warm-cold-data-architecture-best-practices/)。\n\
  \n接下来我们将讨论的主题涉及计算。如何以最高效、性能最佳的方式编写计算？\n\n# 高效计算\n\n计算的构建方式可能不同，却能实现相同的功能。请看以下示例，它展示了\
  \ `IF` 语句如何被更简单的代码替代：\n\n| 场景 I | 场景 II |\n| --- | --- |\n| 创建一个包含以下代码的计算字段：`IF\
  \ SUM (Profit) > 0 THEN 'Profitable' ELSE 'Unprofitable' END` 将该计算字段放置在 `Color`（颜色）卡架上。\
  \ | 创建一个包含以下代码的计算字段：`SUM (Profit) > 0` 将该计算字段放置在 `Color`（颜色）卡架上。在生成的图例中右键单击 `True`\
  \ 和 `False` 并将其重命名为 `Profitable` 和 `Unprofitable`。 |\n\n由于这两个场景都能返回期望的结果，应该使用哪一个？决定因素是性能。本节将探讨在创建计算字段时该做什么和避免什么，以最大化性能。\n\
  \n## 优先考虑代码值\n\n使用布尔值或数字的计算比使用日期的计算性能更高。反过来，使用日期的计算又比使用字符串的计算性能更高。这不仅适用于 Tableau，也适用于整个计算机科学领域。\n\
  \n基于此信息，上表中列出的**场景 II** 比**场景 I** 性能更高。**场景 I** 导致 Tableau 创建一个查询，要求数据源引擎处理字符串以报告盈利能力，而**场景\
  \ II** 仅发送 1 和 0 来确定盈利能力。**场景 II** 的第三步（即将 `True` 和 `False` 别名为 `Profitable` 和 `Unprofitable`）仅仅是聚合数据集从数据源返回后发生的标签更改，这对\
  \ Tableau 来说既快速又简单。\n\n## 详细级别计算或表计算\n\n在某些情况下，**详细级别** (`LOD`) 计算可能比表计算快，反之亦然。如果您不确定，请两者都试一试，看哪个性能更好。当然，您也可以运行性能记录。此外，如果它们并非真正需要，则两者都不使用。请参考下图，它解释了何时选择哪种计算：\n\
  \n![](img/B18435_13_22.png)\n\n图 13.22：选择计算类型\n\n此图以及关于选择计算类型的更多建议，可在 [`www.tableau.com/about/blog/2016/4/guide-choosing-right-calculation-your-question-53667`](https://www.tableau.com/about/blog/2016/4/guide-choosing-right-calculation-your-question-53667)\
  \ 访问。\n\n# 提升性能的其他方法\n\n为了结束本章，让我们考虑一下提升性能的其他几种可能性。\n\n## 避免仪表板过度拥挤\n\n通常，最终用户希望在仪表板上一次性看到所有内容。虽然这可能被认为是有益的，但往往并非如此。考虑在仪表板上包含一个大型交叉表。翻阅数页详细信息是否增加了仪表板的分析价值？答案可能是“否”。此外，仪表板上过多的信息可能会掩盖重要的洞察。委婉地主张精简仪表板，既可能带来更好的决策，也能提升性能。\n\
  \n## 固定仪表板尺寸\n\n仪表板可以设置为精确尺寸、`Range`（范围）或 `Automatic`（自动）。`Exact size`（精确尺寸）性能更快，因为一旦\
  \ Tableau Server 为一位最终用户渲染了视图，该渲染结果就会保留在缓存中，并可供访问该仪表板的下一位最终用户复用。另一方面，`Automatic`\
  \ 和 `Range` 会导致 Tableau Server 尝试确定每位最终用户使用的分辨率大小并相应地渲染仪表板。这意味着 Tableau Server 不会为下一位最终用户使用存储在缓存中的仪表板实例。这反过来又会影响性能。\n\
  \n## 使用 Tableau Prep Builder\n\n这之前提到过，但非常相关，所以我要重复一遍：**如果需要复杂的联接和复杂的数据混合来生成有用的结果，建议在\
  \ Tableau 之外执行 ETL 工作**，例如在 Tableau Prep Builder 中（有关此服务的更多信息，请参阅*第 3 章*，*使用 Tableau\
  \ Prep Builder*）。ETL 工作理想情况下将带来更好的数据建模、聚合数据，或包含您原本必须在 Tableau Desktop 中创建的额外列的数据，因此使用\
  \ Prep Builder 可实现更轻松的创作和更快的 Tableau 性能。\n\n## 设定预期\n\n如果最终用户期望近乎即时的性能，那么任何达不到此标准的表现都会令人失望。提前解释复杂的、面向细节的仪表板可能性能不佳，至少有两方面的帮助。首先，通过解释可能的性能问题，可能会达成妥协，从而创建一个不那么复杂但仍能提供有价值信息的仪表板。其次，如果仪表板必须复杂且面向细节，至少最终用户已被告知在与其交互时可能需要耐心等待。\n\
  \n## 工作簿优化器\n\n最后，对于我们这些“懒人”——或者可以说是“高效者”——Tableau 在不久前发布了一个极好的功能：工作簿优化器。它根据一组规则检查您的工作簿，并会以三类类别响应：采取行动、需审查和通过。因此，它利用广为人知的\
  \ RAG（红-黄-绿）或红绿灯系统为您完成性能检查。\n\n在撰写本文时，规则包括：计算长度、使用多数据源的计算、仪表板尺寸未固定、筛选器使用条件逻辑、筛选器使用“仅相关值”、实时数据连接、数据源中的多重连接、嵌套计算、非物化计算、数据源数量、筛选器数量、布局容器数量、LOD\
  \ 计算数量、仪表板中的视图数量、工作簿工作表数量、未使用的数据源、未使用的字段、使用数据混合、使用日期计算和使用分组。但我确信未来会有更多规则出现，拥有高性能仪表板将变得越来越容易。您可以通过选择\
  \ `Server | Run Optimizer`（服务器 | 运行优化器）来访问工作簿优化器功能：\n\n![](img/B18435_13_23.png)\n\
  \n图 13.23：运行优化器\n\n\n\n\n\n## 摘要\n\n我们本章开始时讨论了性能记录仪表板。这很重要，因为后续的许多练习都利用性能记录仪表板来检查底层查询。接下来，我们讨论了硬件和即时技术，旨在传达良好\
  \ Tableau 性能的硬件考量，以及在缺乏最佳硬件的情况下，从任何计算机中榨取最佳性能的技巧。\n\n随后，我们介绍了使用数据源，包括联接、混合以及高效使用数据源。接着讨论了如何尽可能高效地生成和使用提取。通过这三个部分聚焦数据源，我们了解了使用远程数据集或提取时的最佳实践和应避免的事项。下一节探讨了各类筛选器和计算的性能影响。最后，我们研究了其他性能考量，探讨了关于仪表板性能的更多想法以及设定预期。\n\
  \n在下一章中，我们将把注意力转向 Tableau Server。Tableau Server 是一个内容丰富的话题，足以单独成书；因此，我们的探索将仅限于从\
  \ Tableau Desktop 制作者角度出发的 Tableau Server。\n\n## 在 Discord 上了解更多\n\n要加入本书的 Discord\
  \ 社区——您可以在其中分享反馈、向作者提问并了解新版本——请扫描下方的二维码：\n\n[`packt.link/tableau`](https://packt.link/tableau)\n\
  \n![](img/QR_Code2044012316175764640.png)\n"
- "# 第 14 章：探索 Tableau Server 和 Tableau Cloud\n\nTableau Server 和 Tableau Cloud 是在\
  \ Tableau Desktop 和/或 Tableau Public 中创建的内容的共享、分发和协作在线解决方案。其优势包括提供一个环境，让最终用户可以安全地查看、探索和刷新实时及计划的数据可视化。Tableau\
  \ Server 和 Tableau Cloud 的主要区别在于 Tableau Server 需要您自行维护，而 Tableau Cloud 由 Tableau\
  \ 完全托管在云端，并由 Amazon Web Services 基础设施提供支持。为便于阅读，我们将统称两者为 Tableau Server。\n\n本章范围仅限于\
  \ Tableau Desktop 制作者与 Tableau Server 的交互。安装和升级、身份验证和访问、安全配置以及命令行实用程序等主题与 Tableau\
  \ Desktop 制作者与 Tableau Server 的交互无关，因此本章不包含这些内容。不过，帮助文档相当详尽。也可以考虑观看 Tableau Software\
  \ 关于 Tableau Server 的一些视频（例如 `https://www.youtube.com/c/tableausoftware/search?query=Tableau%20Server`）。如果您对此处列出的任何主题或任何其他\
  \ Tableau Server 主题有疑问，请务必访问在线帮助网站 `https://www.tableau.com/support/help`。\n\n本章将探讨以下主题：\n\
  \n*   将数据源发布到 Tableau Server\n*   Web 制作\n*   在 Tableau Server 上维护工作簿\n*   更多 Tableau\
  \ Server 设置和功能\n\nTableau Server 是将贵公司的 Tableau 采用提升到新高度的绝佳方式。您脑海中最重要的问题可能是：如何将\
  \ Tableau 仪表板从 Desktop 带到 Server？这正是我们将在第一节中向您展示的内容。\n\n## 将数据源发布到 Tableau Server\n\
  \n因此，您购买了 Tableau Desktop，成为了一名专业的仪表板开发人员，现在想与同事分享您的工作。他们都需要 Tableau Desktop 许可证和安装才能查看您的可视化吗？幸运的是，答案是：不需要！共享\
  \ Tableau 仪表板的最佳方式是在 Tableau Server 上。这样，您的同事只需一个 Tableau Server 查看者许可证，这比开发者许可证便宜得多，并且他们可以充分与您构建并上传到\
  \ Server 的仪表板进行交互。Tableau Server 许可证模型中不同角色的详细说明请见此处：`https://help.tableau.com/current/server/en-us/license_manage.htm`。\n\
  \n本章假设读者拥有具有足够权限的 Tableau Server 访问权限，可发布数据源并在 Web 制作环境中编辑。如果您没有 Tableau Server\
  \ 访问权限，但想完成本章练习，请考虑下载试用版，截至撰写时，它提供为期两周的完整功能。\n\n但如何将仪表板从 Desktop 上传到 Server？让我们看看以下步骤，了解如何将数据源发布到\
  \ Tableau Server：\n\n1.  导航至 `https://public.tableau.com/profile/marleen.meier`\
  \ 以查找并下载与本章关联的工作簿。\n2.  导航至 `Publish` 工作表。\n3.  确保数据源为 `My Superstore`。\n4.  如果尚未登录，请单击\
  \ `Server | Sign In…` 登录到您的 **Tableau Server** 实例：\n\n    ![](img/B18435_14_01.png)\n\
  \n    **图 14.1：** 服务器—登录…\n\n5.  在 `数据` 窗格中，选择 `My Superstore` 数据源。\n6.  选择 `Server\
  \ | Publish Data Source | My Superstore`：\n\n    ![](img/B18435_14_02.png)\n\n \
  \   **图 14.2：** 服务器—发布数据源\n\n7.  在生成的对话框中，输入您所需的设置。\n\n如果您的 Tableau Server 上有不同的项目，可以选择将数据源发布到哪个项目。如果您愿意，也可以更改名称或添加描述，这非常方便，特别是当您有许多不同的数据源并希望允许用户查找他们需要的数据源时。通过添加标签，您将添加一个元数据层，允许\
  \ Tableau Server 用户根据标签搜索给定的数据源。您还可以更改权限。您的设置可能是不同用户属于不同组，因此您可以在此选择允许哪个组拥有哪些权限。最后，您可以立即连同数据源一起上传工作簿，使两者都可在\
  \ Tableau Server 上使用。\n\n### Tableau 文件类型\n\n我们将通过考虑各种 Tableau 文件类型来继续讨论 Tableau\
  \ Server。这似乎是一个令人惊讶的切入点，但随着阅读的深入，您会发现，清晰理解文件类型为 Tableau Desktop 制作者高效、有效地与 Tableau\
  \ Server 交互提供了基础知识。\n\n之前讨论的与理解如何与 Tableau Server 交互相关的文件类型将被深入探讨。与理解 Tableau Server\
  \ 无关的文件类型将仅简要介绍。某些文件类型（例如与许可证激活相关的类型）将不予考虑。\n\n#### Tableau 数据源\n\n现在让我们看看 Tableau\
  \ 中可用的各种数据源。请看下面的 Tableau 数据文件：\n\n\n\n\n\n## Tableau 数据源 (.tds)\n\n*   **文件格式类型**：XML。\n\
  *   **包含内容**：元数据。\n*   **有用原因**：`.tds` 文件很重要，因为它允许 Tableau 作者定义默认格式和聚合、计算字段、数据类型、字段类型等。此外，`.tds`\
  \ 文件可以发布到 **Tableau Server**，从而供环境中的其他作者访问。这实际上使 `.tds` 文件成为一本指南，确保整个组织的一致性。这一重要功能将在\
  \ *Tableau Server 架构* 部分进行更全面的探讨。\n*   **生成方式**：可以通过在 **数据** 窗格中右键单击数据源并选择 `添加到已保存的数据源...`，然后在生成的对话框中选择\
  \ `Tableau 数据源` 来生成 `.tds` 文件。通过 `服务器 | 发布数据源 | [数据源]` 发布到 Tableau Server 时，也可以生成\
  \ `.tds` 文件。*将数据源发布到 Tableau Server* 部分演示了如何发布 `.tds` 文件和 `.tdsx` 文件。\n*   **访问方式**：通常在两个位置之一访问\
  \ `.tds` 文件类型。首先，它可以存储在 `我的 Tableau 资源库 | 数据源` 中。存储在此目录中时，`.tds` 文件将显示在 **开始** 页面左侧的\
  \ **已保存的数据源** 部分下。`.tds` 文件常存储的第二个位置是 **Tableau Server**。导航到 `数据 | 新建数据源` 并选择 **Tableau\
  \ Server**，允许 Tableau 作者指向已发布到 Tableau Server 的 `.tds` 和 `.tdsx` 文件。\n\n## Tableau\
  \ 打包数据源 (.tdsx)\n\n*   **文件格式类型**：压缩。\n*   **包含内容**：元数据和数据提取。\n*   **有用原因**：`.tdsx`\
  \ 文件很有用，因为它可以同时访问元数据和数据。Tableau 作者可以将位于 **Tableau Server** 上的 `.tdsx` 文件作为数据源进行访问，从而无需工作簿直接连接到外部数据源。已发布的\
  \ `.tdsx` 文件可以放入计划中，以便定期从底层数据源更新。\n*   **生成方式**：可以通过在 **数据** 窗格中右键单击数据源并选择 `添加到已保存的数据源...`，然后在生成的对话框中选择\
  \ `Tableau 打包数据源` 来生成 `.tdsx` 文件。与 `.tds` 文件一样，通过 `服务器 | 发布数据源 | [数据源]` 发布到 Tableau\
  \ Server 时，也可以生成 `.tdsx` 文件。详见下一练习部分。\n*   **访问方式**：访问 `.tdsx` 文件的方式与 `.tds` 文件相同。首先，它可以存储在\
  \ `我的 Tableau 资源库 | 数据源` 中。存储在此目录中时，`.tdsx` 文件将显示在 **开始页面** 左侧的 **已保存的数据源** 部分下。`.tdsx`\
  \ 文件常存储的第二个位置是 **Tableau Server**。选择 `数据 | 新建数据源` 并选择 **Tableau Server**，允许 Tableau\
  \ 作者指向已发布到给定 **Tableau Server** 实例的 `.tds` 和 `.tdsx` 文件。\n\n## Tableau 工作簿 (.twb)\n\
  \n*   **文件格式类型**：XML。\n*   **包含内容**：元数据和架构。架构定义了工作簿中的可视化图表。请注意，在此上下文中，架构是指定义工作簿视觉组件的\
  \ XML，包括工作表上显示的可视化图表以及仪表板和故事的布局。\n*   **有用原因**：`.twb` 文件类型是 Tableau 作者最常使用的文件类型。创建指向实时数据集的可视化图表需要它。因此，实时解决方案将使用此文件类型。\n\
  *   **生成方式**：通过 `文件 | 另存为` 创建 `.twb` 文件，然后在生成的对话框中选择 `.twb` 文件类型。\n*   **访问方式**：可以通过\
  \ **Tableau Desktop** 打开 `.twb` 文件，或通过指向 **Tableau Server** 实例的浏览器访问。由于 `.twb` 文件是\
  \ XML 格式，因此可以通过文本编辑器打开、查看和更新。\n\n## Tableau 打包工作簿 (.twbx)\n\n*   **文件格式类型**：压缩。\n\
  *   **包含内容**：元数据、架构，以及可选的一个或多个数据提取。\n*   **有用原因**：使用 **Tableau Reader** 需要 `.twbx`\
  \ 文件类型。当访问 **Tableau Server** 不直接连接的数据源（如平面文件、Microsoft Excel 和 Access 文件）时，也可以在\
  \ **Tableau Server** 中有效地使用它。`.twbx` 文件的缺点将在下文讨论。\n*   **生成方式**：通过 `文件 | 另存为` 创建\
  \ `.twbx` 文件，然后在生成的对话框中选择 `.twbx` 文件类型。\n*   **访问方式**：可以通过 **Tableau Desktop** 打开\
  \ `.twbx` 文件，或通过指向 **Tableau Server** 实例的浏览器访问。由于 `.twbx` 文件是压缩文件，因此也可以通过压缩工具（如\
  \ WinZip 或 7-Zip）解压。\n\n## 其他文件类型\n\n您应该熟悉的其余文件类型与 **Tableau Server** 没有特别关系，因此将在此简要讨论。**Tableau\
  \ Desktop** 提取与 **Tableau Server** 版本之间可能存在一些兼容性问题。完整的兼容性场景列表可参见 <https://help.tableau.com/current/desktopdeploy/en-us/desktop_deploy_compatibility.htm>。\n\
  \n让我们看看以下其他文件类型：\n\n*   **Tableau 数据提取**：可以通过以下方式生成 `.hyper` 文件：如果在 **Tableau Desktop**\
  \ 中打开 `.twb` 文件，则可以通过在 **数据** 窗格中右键单击数据源并选择 `提取数据` 来创建 `.hyper` 文件。选择所需选项后，Tableau\
  \ 将提供一个对话框供作者将文件保存到指定位置。提取文件可用于创建数据源的本地快照，以获得更快的创作体验。同一个本地快照也是可移植的，因此可用于脱机环境。\n\
  *   **Tableau 书签**：可以通过 `窗口 | 书签 | 创建书签` 生成 `.tbm` 文件。它可用于跨多个工作簿复制工作表，也可用于跨多个工作簿共享格式。\n\
  *   **Tableau 地图源**：在第 9 章 *使用地图* 中，我们讨论了 Mapbox 和 WMS 的用法；如果您想保存这些仪表板，可以采用 `.tms`\
  \ 格式。\n*   **Tableau 首选项源**：`.tps` 文件可用于创建自定义调色板。当组织希望在 Tableau 工作簿中使用其配色方案时，这会很有帮助。Tableau\
  \ 使用的 `.tps` 文件称为 `Preferences.tps`，位于 `我的 Tableau 资源库` 中。因为它是 XML 格式，所以可以通过文本编辑器进行修改。Matt\
  \ Francis 在 <https://wannabedatarockstar.blogspot.com/> 发布了一篇有用的博客，清楚地解释了如何调整此文件。您也可以参考\
  \ Tableau 帮助页面。\n\n既然我们已经讨论了不同的文件类型，接下来让我们谈谈 Web 创作。\n\n# Web 创作\n\n\n\n\n# Tableau\
  \ Server 上的 Web 制作\n\n将仪表板发布到 Tableau Server 后，该如何对其进行编辑？Tableau 提供了两种选项。第一种选项下，拥有访问权限和下载权限的你和其他所有人都可以下载仪表板，在\
  \ Tableau Desktop 中编辑，然后通过新上传覆盖 Tableau Server 上的最新版本。另一种选项是在 Server 上实时编辑仪表板。此功能称为\
  \ **Web 制作**。Web 制作是 Tableau Server 的一项功能，它提供了一个类似于 Tableau Desktop 的创作界面。最初，Web\
  \ 制作界面功能有限，但每个版本都会引入更多功能。因此，Tableau Server Web 制作环境与 Tableau Desktop 之间的功能差距已缩小。Web\
  \ 制作环境为创建和应用表计算提供了强大的功能，并提供了创建仪表板的功能。\n\n截至撰写时，Tableau Server Web 制作环境中仍完全缺少某些功能，但以下链接将为您提供现有功能的概览，对比\
  \ Tableau Desktop 和 Tableau Server Web 制作功能：[`help.tableau.com/current/pro/desktop/en-us/server_desktop_web_edit_differences.htm`](https://help.tableau.com/current/pro/desktop/en-us/server_desktop_web_edit_differences.htm)。\n\
  \n接下来，两个简短的练习将演示如何访问 Tableau Server 中的创作环境。请记住，Tableau Server 管理员需要向用户授予相应的权限才能执行此操作。\n\
  \n## 使用 Web 制作编辑现有工作簿\n\n让我们执行以下步骤，在 Tableau Server 上编辑现有工作簿：\n\n1. 登录 Tableau Server\
  \ 实例。\n2. 选择我们在“将数据源发布到 Tableau Server”部分上传的 `My Superstore` 数据源。\n3. 选择 `New, Workbook`（新建，工作簿），基于已发布的数据源创建工作簿：\n\
  \n   ![](img/B18435_14_03.png)\n\n   图 14.3：已发布的数据源\n\n4. 将 `Category` 拖到 `Columns`（列），将\
  \ `Profit` 拖到 `Rows`（行）。\n5. 现在点击 `File | Publish As…`（文件 | 另存为发布…），在弹出窗口中为工作簿选择一个名称（我命名为\
  \ `Test`），然后点击 `Publish`（发布）：\n\n   ![](img/B18435_14_04.png)\n\n   图 14.4：发布工作簿\n\
  \n6. 如果现在返回 Tableau Server 的默认文件夹，你将看到一个名为 `Test` 的额外工作簿，位于 `My Superstore` 已发布数据源旁边：\n\
  \n   ![](img/B18435_14_05.png)\n\n   图 14.5：工作簿视图\n\n7. 如果你想继续编辑 `Test` 工作簿，只需在\
  \ Tableau Server 上打开它并选择 `Edit`（编辑）按钮：\n\n   ![](img/B18435_14_06.png)\n\n   图 14.6：Web\
  \ 制作\n\n就这么简单。\n\n到目前为止，我们已发布数据集，在 Tableau Server 上基于该数据集构建了工作簿，你或许甚至已经编辑了该工作簿。如果还没编辑，别担心，我们将在下一个练习中进行。\n\
  \n## 了解 Tableau Server Web 制作环境\n\n让我们执行以下步骤，了解 Tableau Server Web 制作环境：\n\n1. 访问与本章关联的工作簿，并注意\
  \ `Sales & Quota` 工作表：\n\n   ![](img/B18435_14_07.png)\n\n   图 14.7：Web 制作 II\n\n\
  2. 通过点击 `Server | Publish Workbook`（服务器 | 发布工作簿）将工作表发布到 Tableau Server 实例。在出现的窗口中，将工作簿重命名为\
  \ `Sales & Quota`，并确保仅上传 `Sales & Quota` 工作表：\n\n   ![](img/B18435_14_08.png)\n\n\
  \   图 14.8：发布工作簿\n\n3. 将出现以下弹出窗口：\n\n   ![](img/B18435_14_09.png)\n\n   图 14.9：发布工作簿\
  \ II\n\n4. 通过点击 `Sales & Quota` 已发布视图在 Tableau Server 上打开工作表，然后点击 `Edit`（编辑）以访问\
  \ Web 制作：\n\n   ![](img/B18435_14_10.png)\n\n   图 14.10：访问 Web 制作\n\n5. 从这里开始，你应该会看到一个类似于你在\
  \ Tableau Desktop 中习惯使用的界面。这就是 Web 制作的全部意义——你拥有大部分 Tableau Desktop 的在线功能，甚至不需要打开\
  \ Tableau Desktop，只要你的工作簿已发布到 Tableau Server。让我们试一试！\n\n6. 你可能注意到的第一件事是，即使我们没有发布\
  \ `Cover` 或 `Publish` 工作表，它们在 Web 制作视图中也是可见的。你可以右键点击其中任何一个，通过选择 `Publish`（发布）使该工作表对没有\
  \ Web 制作访问权限的 Tableau Server 用户可用：\n\n   ![](img/B18435_14_11.png)\n\n   图 14.11：Web\
  \ 制作\n\n7. 接下来，在 `Sales & Quota` 选项卡上，按住键盘上的 `Ctrl` (Windows) 或 `Command` (macOS)\
  \ 键，同时将 `Quota Met?` 字段拖到 `Rows`（行）货架上：\n\n   ![](img/B18435_14_12.png)\n\n   图\
  \ 14.12：Web 制作 II\n\n8. 你将看到视图中出现叉号和勾号。这表明我们不仅可以用颜色指示是否达标，还可以用这个简单的计算字段在视图中用标记指示：\n\
  \n   ```\n   IF SUM([Sales]) >= [Quota] THEN \"✗\" ELSE \"✓\" END\n   ```\n\n  \
  \ 请随意尝试你在 Tableau Desktop 中习惯轻松处理的其他操作，包括以下内容：\n\n   * 创建计算字段\n   * 添加筛选器\n   *\
  \ 调整工具提示\n   * 创建新工作表\n   * 创建仪表板\n\n编辑完成后，尝试点击右上角的叉号。你将看到你的更改在仪表板中不可见。再次点击 `Edit`（编辑）返回\
  \ Web 制作模式，瞧！`Quota Met?` 仍然显示在 `Rows`（行）货架上。根据你的服务器设置，Tableau 会自动保存，但你必须使用 `Publish`（发布）按钮才能让更改对查看者在\
  \ Server 上可见。\n\n# 在 Tableau Server 上维护工作簿\n\n我们讨论了仪表板编辑选项和自动保存，但尚未讨论如何跟踪更改，并确保在生成新信息的过程中不会丢失重要信息。本节将提供关于如何在\
  \ Tableau Server 上维护工作簿的帮助，从修订历史开始。\n\n## 修订历史\n\n作为 Tableau 仪表板开发人员甚至 Tableau Server\
  \ 管理员，你希望确保用户始终查看正确的数据。但有时会发生这种情况：你编辑了一个仪表板，编辑后仪表板显示错误信息。用户打电话给你，要求立即恢复旧仪表板。该怎么办？使用修订历史！\n\
  \nTableau Server 自带修订历史功能，确保每个工作簿和数据源的过去 25 个版本均可检索。Tableau Server 管理员可以启用或禁用此设置。在\
  \ Tableau Desktop 中，如果你尝试上传一个与之前上传的文件同名的工作簿或数据源，Tableau Desktop 将显示警告，如 `Workbook\
  \ name is already in use`（工作簿名称已被使用）：\n\n![](img/B18435_14_13.png)\n\n图 14.13：覆盖数据源\n\
  \n发布将覆盖现有数据源。如果你继续上传，修订控制将被激活，文件的先前版本将作为修订版保留并可访问。要在 Tableau Server 中访问单个工作簿和数据源的修订历史，只需选择你上传的任何数据源或工作簿，然后点击右下角的三个点。在弹出菜单中，选择\
  \ `Revision History...`（修订历史...）：\n\n![](img/B18435_14_14.png)\n\n图 14.14：修订历史...\n\
  \n这将打开一个对话框，你可以在其中选择要恢复的先前版本：\n\n![](img/B18435_14_15.png)\n\n图 14.15：修订历史 II\n\n\
  \n\n修订历史记录非常有用！我希望你不必经常用到它们，但拥有这些选项总是好的。许多组织接下来的问题是，如何确保用户只能看到他们应该看到的内容，而不仅仅是发布到\
  \ Tableau Server 上的所有内容？一种解决方案是用户筛选器。我们接下来将讨论这个主题！\n\n## 用户筛选器\n\n学生们经常问我类似以下的问题：我有负责不同区域的销售经理。重要的是销售经理只能看到他们自己的指标；也就是说，不能看到其他销售经理的指标。为了实现这一点，我是否必须为每个销售经理创建单独的工作簿？\n\
  \n幸运的是，答案是否定的。Tableau 提供了用户筛选器，允许 Tableau 制作者确保每个销售经理只能看到他们有权查看的信息。为了演示这一点，请执行以下步骤：\n\
  \n1.  此练习需要 Tableau Server 上有不止一个用户。因此，请继续在 Tableau Server 上通过点击 `Users | Add Users`\
  \ 创建至少一个额外用户。我使用了我拥有的第二个电子邮件地址来完成此操作：\n    ![](img/B18435_14_16.png)\n    图 14.16：添加用户\n\
  2.  作为一个可选步骤，你可以更改帐户的显示名称。要更改帐户的显示名称，请登录 [`www.tableau.com/`](https://www.tableau.com/)，点击\
  \ `User | Edit Account`，并对名和姓条目进行所需的更改。\n3.  作为第二个可选步骤，你可以将用户组分配给筛选器，而不仅仅是分配单个用户。为此，你可以创建不同的组，如下所示：\n\
  \    ![](img/B18435_14_17.png)\n    图 14.17：添加组\n4.  然后，你可以通过选择一个用户，然后在 `Actions`\
  \ 下选择 `Group Membership…`，将 Tableau Server 实例上的用户划分为 `Central`、`East`、`South` 和\
  \ `West` 区域：\n    ![](img/B18435_14_18.png)\n    图 14.18：添加组 II\n5.  现在，访问与本章关联的工作簿并导航到\
  \ `View Level User Filter` 工作表。请注意，该视图是美国的字段地图，`State` 在 `Detail` 卡架上，`Region` 在\
  \ `Color` 卡架上，`Sales` 在 `Label` 卡架上。\n6.  通过 `Server | Sign In from Tableau Desktop`\
  \ 登录到 Tableau Server 实例。\n7.  选择 `Server | Create User Filter | Region...`（仅可从 Tableau\
  \ Desktop 访问）：\n    ![](img/B18435_14_19.png)\n    图 14.19：创建用户筛选器\n8.  在生成的 `User\
  \ Filter` 对话框中，你现在可以将单个用户或组分配给一个区域。将用户筛选器命名为 `Sales Region` 并点击 `OK`：\n    ![](img/B18435_14_20.png)\n\
  \    图 14.20：用户筛选器\n9.  请注意，`Sales Region` 现在实际上已添加到 `Data` 窗格的 `Sets` 部分：\n   \
  \ ![](img/B18435_14_21.png)\n    图 14.21：添加的集合\n10. 将 `Sales Region` 放置在 `Filters`\
  \ 卡架上。\n11. 在状态栏的右侧部分，点击下拉菜单以访问用户筛选器：\n    ![](img/B18435_14_22.png)\n    图 14.22：在筛选器间切换\n\
  12. 选择不同的组或用户，并注意显示的结果会根据图 14.20 的设置而变化。\n\n一旦工作簿发布到 Tableau Server，访问该工作簿的用户将只能看到筛选器允许的信息。这也可以应用于数据源级别的已保存数据源。\n\
  \n有一个重要事项需要注意：与仅向 `Filters` 卡架添加维度筛选器相反，你可能需要考虑将 `Sales Region` 添加到 `Data Source`\
  \ 筛选器。这很重要，因为任何拥有 Web 制作权限的用户都可以直接从 `Filters` 卡架中移除筛选器。在本练习中，该用户随后将能够查看每个区域的指标。然而，数据源筛选器无法通过\
  \ Web 制作环境移除，因此更安全。此外，数据源筛选器适用于整个工作簿，这进一步保护了数据。但是，如果你未启用 Web 制作功能，`Filters` 卡架也能实现其目的。\n\
  \n有关筛选器和 Tableau 操作顺序的更多详细信息，请查看*第 13 章* *提升性能*。\n\n# 更多 Tableau Server 设置和功能\n\n\
  仪表板发布后，用户可以设置警报、认证数据源、订阅、向仪表板添加评论等，具体取决于他们的权限。本节将在两个不同地方解决不同的功能：在工作表上和在视图上。除此之外，Tableau\
  \ Server 还有许多其他功能，特别是站点管理员的设置，这些——遗憾的是——不在本书范围内。\n\n## 工作表级别的功能\n\n*工作表级别的功能*是指选择一个项目和特定工作表后可用的设置，如下所示：\n\
  ![](img/B18435_14_23.png)\n图 14.23：Tableau Server\n\n在此级别，我们看到八个不同的选项卡，我们将在接下来的几页中讨论它们。\n\
  \n### 视图\n\n视图显示在一个工作簿中发布的所有工作表或仪表板的缩略图。将工作簿上传到 Tableau Server 时，你可以选择应显示在此处的所有视图：\n\
  ![](img/B18435_14_24.png)\n图 14.24：发布工作簿\n\n通过点击视图旁边的三个点，将显示更多选项，如下截图所示：\n![](img/B18435_14_25.png)\n\
  图 14.25：选项\n\n不同的选项不言自明：你可以编辑视图（也称为 Web 制作，我们在本章前面讨论过），你可以与其他用户共享视图，Tableau 将发送一封包含图像和超链接的电子邮件给你共享视图的用户。你还可以添加标签，这将帮助其他用户找到该视图，你可以检查哪个用户或组有权打开该视图以及谁查看过此视图，最后，你可以删除它。显示哪些选项取决于\
  \ Tableau Server 中的配置，因此你的管理员可以启用或禁用不同的功能以显示，否则它们可能会变灰。\n\n### 数据源\n\n下一个选项卡是**数据源**。它将提供创建此工作簿所用数据源的概览：\n\
  ![](img/B18435_14_26.png)\n图 14.26：数据源\n\n你将能够看到使用了哪种类型的数据源；例如，实时连接的提取，通过点击每个源旁边的三个点，你将再次看到更多设置，具体取决于你的\
  \ Tableau Server 设置：\n![](img/B18435_14_27.png)\n图 14.27：数据源 II\n\n### 关联指标\n\n\
  接下来是关联指标。这是一个相对较新的功能。要查看指标，你首先必须在视图中设置它们。我们将在本节的第二部分介绍这一点，但基本上，它允许你选择不同仪表板和视图的片段，并将这些数据点作为指标组合起来以监控你的数据。指标利用视图中的特定数据标记。因此，你可能需要调整视图以显示你想要使用的那个标记。\n\
  \n例如，如果你有一个包含过去一年每日利润的仪表板，但你的指标应仅显示最后一个利润数据点，你将不得不创建一个新视图，以便在指标中使用明确的最后一个利润，即使该数据已经是初始视图的一部分。然而，一个巨大的优势是你不需要连接到不同的数据源，因为不同工作簿中已设置的连接将被利用。\n\
  \n有关指标的更多详细信息，请访问：[`www.tableau.com/about/blog/2020/5/introducing-metrics-headlines-your-data`](https://www.tableau.com/about/blog/2020/5/introducing-metrics-headlines-your-data)。\n\
  \n\n\n\n## 提取刷新\n\n当使用提取作为数据源时，您可以在将工作簿上传到 Tableau Server 时定义刷新计划，甚至在发布工作簿后也可以定义。不同的计划可以由您的服务器管理员设置。例如，如果您将提取刷新设置为每天上午\
  \ 7 点运行，Tableau Server 将在上午 7 点访问数据源（可能是 SQL 数据库），加载数据，作为回报，您将在 Tableau 仪表板中看到最新数据。根据数据量和数据源类型，使用提取的性能往往优于实时连接，但请注意，仪表板中的数据永远只能与您最新的提取一样新。\n\
  \n## 订阅\n\n订阅可以在视图级别设置；我们将在下一节介绍这一点。但在工作簿级别，您将能够查看特定工作簿的所有活动订阅。\n\n## 血缘\n\n血缘是\
  \ Tableau Server 上另一个相对较新的功能。它仅通过 Data Management（数据管理）附加组件提供，需额外付费，并将向您显示数据源的依赖关系。\n\
  \n有关血缘的更多信息，请查看 <https://help.tableau.com/current/server/en-us/dm_lineage.htm>。\n\
  \n## 使用情况\n\n**使用情况** 选项卡可让您深入了解有多少人查看了您的仪表板，以及有多少其他用户将您的仪表板添加为收藏夹。\n\n使用情况数据也可以从\
  \ Tableau 数据库访问，因此可用于进一步分析。\n\n最后，请注意工作簿页面上的三个点，其中包含更多选项以及我们之前见过的选项：\n\n![](img/B18435_14_28.png)\n\
  \n图 14.28：选项\n\n同样，您能使用哪些选项取决于 Tableau Server 管理员授予您的权限。\n\n当选择基于已发布数据源时（如本章开头我们发布到\
  \ Tableau Server 的 `My Superstore` 数据源），可用选项看起来会略有不同：\n\n![](img/B18435_14_29.png)\n\
  \n图 14.29：选项 II\n\n大多数项目不言自明，但我想指出 **质量警告**，它在 Data Management 附加组件中可用，需额外付费。此功能将允许您提醒数据的每个用户或任何基于该数据的工作簿在使用时格外小心。\n\
  \n根据设置，Tableau Server 将显示各种类型的警告，例如 **已弃用**、**数据过时**、**维护中** 和 **敏感数据**，这些可从下拉菜单中选择。\n\
  \n您还可以决定是仅在数据源上显示类型，还是也在相关工作簿上显示。以下是仅在数据源上显示的示例：\n\n![](img/B18435_14_30.png)\n\n\
  图 14.30：数据质量警告\n\n这是在工作簿级别警告外观的示例：\n\n![](img/B18435_14_31.png)\n\n图 14.31：数据质量警告\
  \ II\n\n甚至在打开视图时也是如此：\n\n![](img/B18435_14_32.png)\n\n图 14.32：数据质量警告 III\n\n这是一个非常强大的功能，展示了\
  \ Tableau 如何随着每个版本发布变得更加成熟。数据质量是许多数据战略的焦点，也是所有分析的基础。Tableau Server 适应了这一点，并为您提供了将随着您的数据战略和质量措施一起成长的功能。\n\
  \n## Ask Data\n\n在我们继续介绍视图级别之前，最后一项是 **Ask Data**，它仅适用于 Tableau Server。要访问 **Ask\
  \ Data**，请选择一个已发布的数据源并点击第一个选项卡。现在有趣的部分开始了，Tableau Server 将帮助您基于 **自然语言处理** (**NLP**)\
  \ 构建可视化：\n\n![](img/B18435_14_33.png)\n\n图 14.33：Ask Data\n\n在左侧，您可以看到所有可用字段，在中间，您可以创建一个所谓的\
  \ **镜头**。镜头可以是用户或组特定的，其目的是让用户更容易提出正确的问题，从而使用 NLP 在数据源上检索正确的信息。因此，这是一种更结构化、更受管控的\
