  \ 视图类型会激活域补全。\n\n## 域补全的实用性\n\n域补全在许多场景下很有用——例如，想使用参数时，或进行解释性分析时，无需手动填补缺失值。事实上，你可能已从前几个练习（虽仅为演示）中领悟到一些用法。下面的练习演示如何利用域补全，在稀疏填充的视图中为无值单元格显示“无数据”。\n\
  \n### 标记空值\n\n按以下步骤开始练习：\n\n1.  复制上一练习的工作表 `DC – View Types`，将新工作表命名为 `DC – Labeling\
