- "## 7. 练习详细级别计算\n\n\n\n当我们在 Tableau 中谈论 `Level of Detail` (`LOD`) 计算时，指的是三种表达式：`FIXED`、`INCLUDE`\
  \ 和 `EXCLUDE`。这三种表达式通过提供创建以特定粒度级别为目标的计算的能力，开启了一个全新的选项世界。在旧版本的 Tableau 中，工作表的数据粒度由视图中的维度决定。如果视图包含例如\
  \ `Region`、`State` 和 `Postal Code` 等维度，但作者想要创建一个 `City` 级别的计算，则必须在视图中包含 `City` 维度。此外，没有机制在视图上排除或忽略给定的\
  \ `dimension`。诚然，通常可以通过一些复杂且有时曲折的表计算、数据混合等用法来获得期望的结果。幸运的是，LOD 极大地简化了这些用例场景，并在某些情况下实现了以前不可能的功能。\n\
  \n在本章中，我们将讨论以下主题：\n\n- Introducing LODs（LOD 简介）\n- `FIXED` 和 `EXCLUDE`\n- `INCLUDE`\n\
  - Building practical applications with LODs（使用 LOD 构建实用应用）\n\n本章前几节更多地基于理论，但请别担心——您将在\
  \ *Building practical applications with LODs* 一节中以实用的方式探索这些概念。让我们从介绍 LOD 及其用法开始。\n\
  \n## Introducing LODs（LOD 简介）\n\nTableau 的默认行为是根据视图中也存在的维度来显示度量。如果您有一个包含 `Sales`\
  \ 数据和 `State`、`City` 等维度的仪表板，并将 `State` 和 `Sales` 数据拖到视图上，`Sales` 数据将按 `State` 划分，显示每个\
  \ `State` 的 `Sales`。如果您想将 `Sales` 数据进一步细分为更小的块，可以添加 `City` 字段，从而得到按 `State` 划分的每个\
  \ `City` 的 `Sales` 数据。LOD 可以操控这种默认行为。\n\n完成本章后，您将能够按视图中不存在的维度来划分或分区度量，并使用比视图中可见维度更少的维度来显示度量。\n\
  \n为此，我们将构建并使用两个 `playgrounds`（演练环境）。根据工作职责交付报告可能会导致对有限功能集的透彻了解；即理解深但面窄。很难抽出时间（并证明该时间合理）去探索\
  \ Tableau 那些表面上似乎与工作职责没有直接关联的功能。演练环境可以通过提供高效的探索途径来帮助克服这些困难和异议。在本章中，我们将专门为 LOD 构建两个演练环境，通过提供高效的探索和理解途径，使深度和广度理解的任务变得更容易。您随时可以回到随本章附带的工作簿，测试与\
  \ LOD 相关的功能。\n\n# FIXED and EXCLUDE（FIXED 和 EXCLUDE）\n\n我们将构建的第一个演练环境旨在探索三个 LOD\
  \ 函数中的两个：`FIXED` 和 `EXCLUDE`。我们将使用一组参数和相关的计算字段来高效地探索这些函数的工作原理。\n\n## Setting up\
  \ the workbook（设置工作簿）\n\n本练习的大部分基础工作已在随本章附带的工作簿中完成。以下步骤只需您打开不同的计算和参数，查看它们是如何设置的以及为什么这样设置。沿途会给出解释。如果您无法直接访问该工作簿，应能通过参考以下步骤构建一个类似的工作簿。\n\
  \n要完成工作表的初始设置，请执行以下步骤：\n\n1. 导航至 [Tableau Public 上的 Marleen Meier 个人资料](https://public.tableau.com/profile/marleen.meier)\
