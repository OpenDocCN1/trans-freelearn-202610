- "# 准备您的数据\n\n您是否曾自问：我的数据是否足够干净以进行分析？凡是处理数据的人很可能都有过这个疑问，因此本章专门讲解如何为分析准备数据，也就是数据清洗。\n\
  \n本章的第一部分侧重理论，不包含练习。建议仔细阅读这些信息，因为它们为深入理解奠定了基础。本章后半部分提供了各种专门针对数据准备的练习。\n\n现在，让我们怀着丰富理解、成为更优秀的数据管家的目标，深入探讨这个迷人的主题。\n\
  \n在本章中，我们将讨论以下主题：\n\n*   了解 Hyper\n*   专注于数据准备\n*   勘察数据\n*   清理混乱数据\n\n由于 Tableau\
  \ Desktop 10.5 已上市一段时间，您可能已经听说过 Hyper。无论您是否听说过，请继续阅读以了解该功能的入门知识！\n\n## 了解 Hyper\n\
  \n在本节中，我们将探索 Tableau 的数据处理引擎，以及它如何在企业中实现结构化且有机的数据挖掘过程。自 Tableau 10.5 发布以来，我们可以使用\
  \ Hyper——一种高性能数据库，让我们能比以往更快地查询源数据。即使是高级开发人员，通常也不太了解 Hyper，因为它不是日常活动中显而易见的一部分；然而，如果您想真正掌握如何为\
  \ Tableau 准备数据，这种理解至关重要。\n\nHyper 最初于 2008 年在慕尼黑大学作为一个研究项目启动。2016 年，Tableau 收购了它，并将其设立为\
  \ Tableau 专门的数据引擎团队，保留其在慕尼黑的基地和员工。最初在 Tableau 10.5 中，Hyper 仅针对提取替换了早期的数据处理引擎。实时连接仍不受\
  \ Hyper 影响，但 Tableau Prep Builder 现在也运行在 Hyper 引擎上，未来将有更多用例。正如 [tableau.com](http://tableau.com)\
  \ 所述：“*Hyper 可在几秒内对海量数据进行切片和剖析，您将看到查询速度最高提升 5 倍，提取创建速度最高提升 3 倍*。”如果您还想了解更多，还可以通过\
  \ API 调用在您偏好的编程语言中使用 Hyper：[`help.tableau.com/current/api/hyper_api/en-us/docs/hyper_api_reference.html`](https://help.tableau.com/current/api/hyper_api/en-us/docs/hyper_api_reference.html)。\n\
  \n但是什么让 Hyper 如此之快？让我们揭开它的面纱一探究竟！\n\n### Tableau 数据处理引擎\n\nHyper 创始人的共同愿景是创建一个高性能的下一代数据库——一个系统、一种状态、无妥协、无延迟。他们做到了——如今，Hyper\
  \ 可以同时服务于通用数据库用途、数据摄取和分析。\n\n内存价格呈指数级下降。CPU 也是如此；晶体管数量遵循摩尔定律增长，而其他特性却停滞不前。内存变得便宜，但处理能力仍需提升。\n\
  \n摩尔定律是英特尔联合创始人戈登·摩尔提出的观察：芯片上的晶体管数量每两年翻一番，而成本减半。关于摩尔定律的信息可在 Investopedia 上找到：[`www.investopedia.com/terms/m/mooreslaw.asp`](https://www.investopedia.com/terms/m/mooreslaw.asp)。\n\
  \n在试验 Hyper 时，创始人发现手写的 C 代码比任何现有的数据库引擎都快，因此他们想到将 Tableau 查询转换为 C 代码并同时优化，所有这些都在后台完成，Tableau\
  \ 用户不会察觉。这种转换和优化是有代价的；传统数据库引擎可以立即开始执行代码。Tableau 需要先将查询转换为代码，优化代码，再编译为机器代码，然后才能执行。关键问题是：它仍然更快吗？正如\
  \ Tableau Public 和其他工作簿上的许多测试所证明的，答案是肯定的！\n\n此外，如果预估某查询在不编译为机器代码的情况下执行会更快，Tableau\
  \ 拥有自己的**虚拟机**（**VM**），查询将在其上立即执行。除此之外，Hyper 可利用 99% 的可用 CPU 算力，而其他并行进程只能利用 29%\
  \ 的可用 CPU 算力。这归功于独特创新的碎片驱动并行化技术。\n\n想了解更多关于碎片驱动并行化信息的读者，可以在 [`15721.courses.cs.cmu.edu/spring2016/papers/p743-leis.pdf`](https://15721.courses.cs.cmu.edu/spring2016/papers/p743-leis.pdf)\
  \ 找到一篇论文，该论文后来成为 Hyper 引擎的基础。\n\n如果您想了解更多关于 Hyper 引擎的信息，我强烈推荐观看以下视频：[`youtu.be/h2av4CX0k6s`](https://youtu.be/h2av4CX0k6s)。\n\
  \nHyper 将传统数据仓库操作的三个步骤并行化：\n\n*   事务和**持续数据摄取**（**联机事务处理**，或 **OLTP**）\n*   **分析**（**联机分析处理**，或\
  \ **OLAP**）\n*   **超越关系**（**联机超关系处理**，或 **OBRP**）\n\n同时执行这些步骤使 Hyper 更高效、性能更强，这与传统系统将这三个步骤分离并依次执行形成对比。\n\
  \n\n\n\n# Hyper 要点总结\n\n总而言之，`Hyper` 是一个高度专业化的数据库引擎，让我们作为用户能从查询中获得最佳性能。如果你还记得，在\
  \ `第 1 章` `回顾基础知识` 中，我们已经看到工作表或仪表板上的每一次更改，包括拖放药丸、筛选器和计算字段等，都会被转化为查询。这些查询非常像 `SQL`；然而，在\
  \ Tableau 中，我们称查询引擎为 `VizQL`。\n\n`VizQL` 是 Tableau Desktop 中的另一颗隐藏宝石，负责以图表格式可视化数据，并完全在内存中执行。优势在于数据库端不需要额外的空间。当用户将字段放置在货架上时，会生成\
  \ `VizQL`。然后 `VizQL` 被翻译成 `SQL`、`MDX` 或 `Tableau 查询语言` (`TQL`)，并通过驱动程序传递给后端数据源。\n\
  \n## 专注于数据准备\n\nTableau 可以有效地用于各个数据准备阶段。遗憾的是，单个章节不足以深入探讨 Tableau 如何在每个阶段中使用。确实，这种深入探讨可能值得写成一整本书！因此，我们的重点将放在数据准备上，因为从历史上看，该阶段占据了高达\
  \ 60% 的数据挖掘工作量。我们的目标是学习如何使用 Tableau 来简化这项工作。\n\n### 勘察数据\n\nTableau 可以成为简单勘察数据的非常有效的工具。有时在勘察过程中，你可能会发现清理数据或根据现有字段填补不完整数据的方法。有时，遗憾的是，拼图碎片根本不足以拼凑出完整的数据集。在这种情况下，Tableau\
  \ 可用于准确传达缺口所在，这反过来可能会激励组织更完整地填充底层数据。\n\n在本练习中，我们将探索如何使用 Tableau 快速发现数据集中每个字段的空值百分比。接下来，我们将探索如何从现有字段推断数据以填补空白。\n\
  \n#### 确定空值\n\n以下是勘察数据的步骤：\n\n1.  如果你尚未这样做，请导航至 `https://public.tableau.com/profile/marleen.meier`\
  \ 以查找并下载与本章关联的工作簿。\n2.  导航至名为 `勘察` `&` `探索` `数据` 的工作表，并选择 `幸福报告` 数据源。\n3.  将 `区域`\
  \ 和 `国家` 拖至 `行` 货架。观察在某些情况下，`区域` 字段对于某些国家显示 `Null` 值：\n    ![](img/B18435_02_01.png)\n\
  \    图 2.1：空值区域\n4.  右键单击并 `编辑` 名为 `选择字段` 的参数。注意 `数据类型` 设置为 `整数`，我们可以观察到一个包含数据集中每个字段名称条目的列表：\n\
  \    ![](img/B18435_02_02.png)\n    图 2.2：编辑参数\n5.  在 `数据` 窗格中，右键单击刚创建的参数并选择 `显示参数控件`。\n\
  6.  创建一个名为 `% 已填充` 的计算字段并编写以下计算：\n    ```\n    SUM([Number of Records]) / TOTAL(SUM([Number\
  \ of Records]))\n    ```\n7.  在 `数据` 窗格中，右键单击 `% 已填充` 并选择 `默认属性` | `数字格式…`：\n  \
  \  ![](img/B18435_02_03.png)\n    图 2.3：调整默认属性\n8.  在生成的对话框中，选择 `百分比`。\n9.  创建一个名为\
  \ `空值与已填充` 的计算字段并添加以下代码。注意完整的 CASE 语句相当冗长但也重复。\n    在需要冗长但重复计算的情况下，考虑使用 Excel 更快、更准确地编写代码。通过使用\
  \ Excel 的 `CONCATENATE` 函数，你可能能够节省时间并避免拼写错误。\n    在下面的代码块中，代码行仅占总量的一部分，但应足以让你生成完整的代码块：\n\
  \    ```\n    CASE [Select Field]\n    WHEN 1 THEN IF ISNULL ([Country]) THEN 'Null\
  \ Values' ELSE 'Populated Values' END\n    WHEN 2 THEN IF ISNULL ([Region]) THEN\
  \ 'Null Values' ELSE 'Populated Values' END\n    WHEN 3 THEN IF ISNULL ([Economy\
  \ (GDP per Capita)]) THEN 'Null Values' ELSE 'Populated Values' END\n    WHEN 4\
  \ THEN IF ISNULL ([Family]) THEN 'Null Values' ELSE 'Populated Values' END\n   \
  \ WHEN 5 THEN IF ISNULL ([Freedom]) THEN 'Null Values' ELSE 'Populated Values' END\n\
  \    WHEN 6 THEN IF ISNULL ([Happiness Rank]) THEN 'Null Values' ELSE 'Populated\
  \ Values' END\n    WHEN 7 THEN IF ISNULL ([Happiness Score]) THEN 'Null Values'\
  \ ELSE 'Populated Values' END\n    WHEN 8 THEN IF ISNULL ([Health (Life Expectancy)])\
  \ THEN 'Null Values' ELSE 'Populated Values' END\n    WHEN 9 THEN IF ISNULL ([Standard\
  \ Error]) THEN 'Null Values' ELSE 'Populated Values' END\n    END\n    ```\n10.\
  \ 从 `行` 货架中移除 `区域` 和 `国家`。\n11. 将 `空值与已填充` 放置在 `行` 和 `颜色` 货架上，将 `% 已填充` 放置在 `列`\
  \ 和 `标签` 货架上：\n    ![](img/B18435_02_04.png)\n    图 2.4：已填充值\n12. 如果需要，将 `空值` 的颜色改为红色，`已填充值`\
  \ 的颜色改为绿色。你可以通过单击 `标记` 卡中的 `颜色` 并选择 `编辑颜色` 来实现。\n13. 单击工作表上 `选择字段` 参数右上角的箭头，并选择\
  \ `单值列表`。\n14. 在 `选择字段` 参数中选择不同的选项，并注意某些字段具有较高的空值百分比。例如，在下图中，`32.98%` 的记录没有 `区域`\
  \ 的值：\n    ![](img/B18435_02_05.png)\n    图 2.5：比较空值和已填充值\n\n基于此练习，让我们探索如何使用相同的数据集清理并从现有数据推断数据。\n\
  \n#### 推断数据\n\n本练习将在上一个练习的基础上进行扩展，通过清理现有数据并利用已知信息填补部分缺失数据。我们将假设我们知道哪个国家属于哪个区域。我们将利用该知识来修复\
  \ `区域` 字段中的错误，并使用 Tableau 填补空白：\n\n1.  从上一个练习结束的地方开始，创建一个名为 `区域推断` 的计算字段，包含以下代码块：\n\
  \    ```\n    CASE [Country]\n    WHEN 'Afghanistan' THEN 'Southern Asia'\n    WHEN\
  \ 'Albania' THEN 'Central and Eastern Europe'\n    WHEN 'Algeria' THEN 'Middle East\
  \ and Northern Africa'\n    WHEN 'Angola' THEN 'Sub-Saharan Africa'\n    WHEN 'Argentina'\
  \ THEN 'Latin America and Caribbean'\n    WHEN 'Armenia' THEN 'Central and Eastern\
  \ Europe'\n    WHEN 'Australia' THEN 'Australia and New Zealand'\n    WHEN 'Austria'\
  \ THEN 'Western Europe'\n    //用数据集中剩余的字段完成 case 语句\n    END\n    ```\n    作为 `CASE`\
  \ 语句的替代方案，你可以使用 `IF` 语句，如下所示：\n    ```\n    If [Country] = 'Afghanistan' then 'Southern\
  \ Asia' \n    ELSEIF [Country] = 'Albania' then …\n    END\n    ```\n    为了加快创建冗长计算字段的繁琐过程，你可以将数据下载到\
  \ Excel 文件中，通过连接各个部分来创建计算字段，如下所示：\n    ![](img/B18435_02_06.png)\n    图 2.6：在 Excel\
  \ 中编译计算\n\n\n\n\n# 清理混乱数据\n\n美国政府为各种官僚流程提供了有用的文档。例如，**卫生与公众服务部**（**HSS**）提供 ICD-9\
  \ 代码列表，即疾病和相关健康问题国际统计分类代码。不幸的是，这些代码并不总是采用易于访问的格式。\n\n以此为例，让我们看看一份名为 `R756OTN` 的实际\
  \ HHS 文档，可在 <https://www.cms.gov/Regulations-and-Guidance/Guidance/Transmittals/downloads/R756OTN.pdf>\
  \ 找到。\n\n## 清理数据\n\n导航到随本章提供的工作簿中的 `Cleaning the Data` 工作表，并执行以下步骤：\n\n1. 在 **数据**\
  \ 窗格中，选择 **R756OTN Raw** 数据源：\n\n   ![](img/B18435_02_09.png)\n\n   图 2.9：选择原始文件\n\
  \n2. 将 **Diagnosis** 拖至 **行** 货架，然后选择 **添加所有成员**。点击 **AZ** 图标对 **Diagnosis** 列进行排序。注意某些行中出现的垃圾数据：\n\
  \n   ![](img/B18435_02_10.png)\n\n   图 2.10：将 Diagnosis 添加到行\n\n3. 创建一个名为 `DX` 的计算字段，包含以下代码：\n\
  \n   ```\n   SPLIT([Diagnosis], \" \", 1)\n   ```\n\n4. 创建一个名为 `Null Hunting` 的计算字段，包含以下代码：\n\
  \n   ```\n   INT(MID([DX],2,1))\n   ```\n\n5. 在 **数据** 窗格中，将 `Null Hunting` 从 **度量**\
  \ 拖至 **维度**。\n\n6. 将 **Diagnosis**、**DX** 和 `Null Hunting` 拖至 **行** 货架。观察当 **Diagnosis**\
  \ 字段的第二个字符不是数字时，返回 **Null**：\n\n   ![](img/B18435_02_11.png)\n\n   图 2.11：在行上排序字段\n\
  \n7. 创建一个名为 `Exclude from ICD codes` 的计算字段，包含以下代码：\n\n   ```\n   ISNULL([Null Hunting])\n\
  \   ```\n\n8. 清除工作表中的所有字段，如 *第 1 章*、*回顾基础知识* 中所示，并将 **标记** 卡设置为 **形状**。\n\n9. 将\
  \ `Exclude from ICD Codes` 放在 **颜色** 和 **形状** 货架上，然后将 `DX` 放在 **行** 货架上。观察标记为 **True**\
  \ 的行：\n\n   ![](img/B18435_02_12.png)\n\n   图 2.12：排除垃圾数据\n\n10. 为了排除垃圾数据（即 `Exclude\
  \ from ICD Codes` 等于 `True` 的那些行），将 `Exclude from ICD Codes` 放在 **筛选器** 货架上并取消选择\
  \ **True**。\n\n11. 创建一个名为 `Diagnosis Text` 的计算字段，包含以下代码：\n\n    ```\n    REPLACE([Diagnosis],[DX]\
  \ + \"\",\"\")\n    ```\n\n12. 将 **Diagnosis Text** 放在 **行** 货架上 `DX` 之后。此外，从 **行**\
  \ 货架和 **标记** 卡中移除 `Exclude from ICD Codes`，并将标记类型设置为 **自动**：\n\n    ![](img/B18435_02_13.png)\n\
  \n    图 2.13：观察清理后的数据\n\n现在我们已经完成了练习，让我们花点时间来考虑一下我们使用的代码：\n\n- `SPLIT` 函数是在 Tableau\
  \ 9.0 中引入的：\n\n  ```\n  SPLIT([Diagnosis], \" \", 1)\n  ```\n\n- 正如 Tableau 帮助文档中关于该函数的描述，该函数执行以下操作：\n\
  \n  *根据分隔符从字符串中返回子字符串，从字符串的开头或结尾提取字符*。\n\n- 单击列标题并选择 **拆分** 时，也可以直接在 **数据源** 选项卡中调用此函数。要从字符串末尾提取字符，标记编号（即函数末尾的数字）必须为负数。\n\
  \n- 请看下面的代码，我们用它来创建 `Null Hunting` 字段：\n\n  ```\n  INT(MID([DX],2,1))\n  ```\n\n\
  - `MID` 的用法非常直接，与 Excel 中对应的函数非常相似。然而，此处 `INT` 的用法可能会令人困惑。使用 `INT` 函数转换字母字符将导致 Tableau\
  \ 返回 `Null`。这完全满足了我们的目的，因为我们只需通过定位空值来发现那些不以整数开头的行。\n\n- `ISNULL` 是一个布尔函数，在 `Null`\
  \ 的情况下只返回 `TRUE`：\n\n  ```\n  ISNULL([Null Hunting])\n  ```\n\n- 创建 `Diagnosis Text`\
  \ 字段时使用了 `REPLACE` 函数：\n\n\n\n```\nREPLACE([Diagnosis],[DX] + \"\",\"\")\n```\n\n\
  3. 此计算字段使用在 `DX` 中隔离的 ICD-9 代码从 `Diagnosis` 字段中移除这些相同代码，从而提供一个相当干净的描述。注意 *fairly\
  \ clean* 这一短语。被移除的行最初与较长的描述相关联，因此包含回车符。生成的额外行就是我们在本练习中移除的内容。因此，较长的描述在此解决方案中通过 `replace`\
  \ 计算被截断。\n\n本练习的最终输出可以是从 Tableau 导出数据作为额外的数据源。然后该数据可供 Tableau 和其他工具用于未来的报告需求。例如，`DX`\
  \ 字段可用于数据混合。\n\nTableau 是否提供了一种更好的方法来解决前一个解决方案相关的数据截断问题？有的！让我们把注意力转移到下一个练习，我们将探讨正则表达式函数。\n\
  \n## 提取数据\n\n虽然如前一个练习 *Cleaning the data* 所示，`SPLIT` 函数可用于清洗干净的数据，但正则表达式函数功能强大得多，这代表了\
  \ Tableau 传统上专注于可视化和分析的范围扩大，也包含了数据清洗功能。\n\n让我们看一个需要在 Tableau 中处理一些非常混乱数据的示例。我们的目标是提取电话号码。\n\
  \n以下是步骤：\n\n1. 如果您尚未下载，请从 [`public.tableau.com/profile/marleen.meier`](https://public.tableau.com/profile/marleen.meier)\
  \ 下载工作簿并在 Tableau 中打开它。\n2. 选择 `Extracting the Data` 选项卡。\n3. 在 **数据** 窗格中，选择 **String\
  \ of Data** 数据源并将 **String of Data** 字段拖到 **行** 架上。观察提取电话号码相关的挑战：\n\n![](img/B18435_02_14.png)\n\
  \n图 2.14：从混乱的数据格式中提取数据\n\n4. 单击 **查看数据** 按钮并复制几行来访问底层数据：\n\n![](img/B18435_02_15.png)\n\
  \n图 2.15：访问底层数据\n\n5. 导航到 [`regexpal.com/`](http://regexpal.com/) 并将数据粘贴到标记为 **Test\
  \ String** 的窗格中——即第二个窗格：\n\n![](img/B18435_02_16.png)\n\n图 2.16：Regexpal\n\n6. 在第一个窗格（标记为\
  \ **Regular Expression** 的那个）中，输入以下内容：\n\n```\n\\([0-9]{3}\\)-[0-9]{3}-[0-9]{4}\n\
  ```\n\n7. 返回 Tableau 并创建一个名为 `Phone Number` 的计算字段，使用以下代码块。注意计算字段中嵌套的正则表达式：\n\n```\n\
  REGEXP_EXTRACT([String of Data (String of Data)],'(\\([0-9]{3}\\)-[0-9]{3}-[0-9]{4})')\n\
  ```\n\n8. 将 **Phone Number** 放在 **行** 架上，并观察结果：\n\n![](img/B18435_02_17.png)\n\n\
  图 2.17：提取数据最终视图\n\n现在让我们更详细地考虑前一个练习的一些细节：\n\n* 考虑以下代码块：\n\n```\nREGEXP_EXTRACT([String\
  \ of Data],'()')\n```\n\n* 此处有意排除表达式模式，因为稍后将详细介绍。‘`()`' 代码充当表达式模式的占位符。本示例中使用的 `REGEXP_EXTRACT`\
  \ 函数在 Tableau 的帮助文档中描述如下：\n\n> *返回给定字符串中与正则表达式模式内捕获组匹配的子字符串。*\n\n* 请注意，截至撰写时，Tableau\
  \ 文档未说明如何确保函数的模式输入部分正确分隔。对于此示例，请务必在模式输入部分周围包含 ‘`()`' 以避免空输出。\n\n* 在计算字段中嵌套，而该计算字段本身嵌套在\
  \ `VizQL` 查询中，可能会影响性能（如果嵌套/聚合层级过多）。\n\n* 有许多正则表达式网站允许您输入自己的代码，并通过基于您提供的示例数据提供即时反馈来帮助您。[`regexpal.com/`](http://regexpal.com/)\
  \ 只是其中之一，请根据需要搜索以找到适合您的网站！\n\n* 现在，考虑以下表达式：\n\n```\n\\([0-9]{3}\\)-[0-9]{3}-[0-9]{4}\n\
  ```\n\n在此上下文中，`\\` 表示下一个字符不应被视为特殊字符，而应视为字面字符。在我们的示例中，我们字面上是在寻找一个左括号。`[0-9]` 只是声明我们在寻找一个或多个数字。或者，考虑使用\
  \ `\\d` 以达到相同结果。`{3}` 指定我们要寻找三个连续数字。\n\n与模式开头的左括号一样，`\\` 字符将右括号指定为字面字符。`-` 是一个字面字符，专门寻找连字符。根据前面的信息，表达式模式的其余部分应该可以理解。\n\
  \n回顾此练习后，您可能会好奇如何仅返回电子邮件地址。根据 [`www.regular-expressions.info/email.html`](http://www.regular-expressions.info/email.html)，符合\
  \ RFC 5322 标准的电子邮件地址的正则表达式如下：\n\n```\n(?:[a-z0-9!#$%&'*+/=?^_'{|}~-]+(?:\\.[a-z0-9!#$%&'*+/=?^_'{|}~-\n\
  ]+)*|\"(?:[\\x01-\\x08\\x0b\\x0c\\x0e-\\x1f\\x21\\x23-\\x5b\\x5d-\n\\x7f]|\\\\[\\\
  x01-\\x09\\x0b\\x0c\\x0e-\\x7f])*\")@(?:(?:a-z0-9?\\.)+a-z0-9?|\\[(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\\\
  .){3}(?:25[0-\n5]|2[0-4][0-9]|[01]?[0-9][0-9]?|[a-z0-9-]*[a-z0-9]:(?:[\\x01-\n\\\
  x08\\x0b\\x0c\\x0e-\\x1f\\x21-\\x5a\\x53-\\x7f]|\\\\[\\x01-\\x09\\x0b\\x0c\\x0e-\n\
  \\x7f])+)\\])\n```\n\n电子邮件并不总是遵循 RFC 5322 标准，因此可能需要额外的工作才能真正清洗电子邮件地址数据。\n\n虽然我不会尝试详细解释此代码，但您可以在\
  \ [`www.regular-expressions.info/email.html`](http://www.regular-expressions.info/email.html)\
  \ 阅读所有相关内容，这是一个学习更多正则表达式知识的绝佳资源。此外，YouTube 上还有几个有用的正则表达式教程。\n\n本练习的最终输出可能应该用于增强现有源数据。像此示例这样的\
  \ **数据转储** 不属于数据仓库；然而，即使重要且必要的数据也可能隐藏在这样的转储中，Tableau 可以有效地用于提取它。\n\n## 摘要\n\n我们本章开始时讨论了\
  \ Tableau 数据处理引擎。这说明了 Tableau 在处理数据时提供的灵活性。了解数据处理引擎对于确保您的数据挖掘工作聪明地聚焦非常重要。否则，您的精力可能会浪费在与\
  \ Tableau 无关的活动上。\n\n接下来，我们专注于数据准备。我们考虑了使用 Tableau 来调查和清洗数据。由正则表达式函数代表的数据清洗功能特别引人入胜，值得进一步研究。\n\
  \n完成我们第一次以数据为中心的讨论后，我们将继续 *第 3 章*、*使用 Tableau Prep Builder*，探讨 Tableau 推向市场的较新功能之一。Tableau\
  \ Prep Builder 是一个专用的数据预处理界面，能够大大减少您进行预处理所需的时间。我们将了解清洗、合并、筛选、连接以及 Tableau Prep Builder\
  \ 提供的其他功能。\n\n## 在 Discord 上了解更多\n\n要加入本书的 Discord 社区——您可以在其中分享反馈、向作者提问并了解新版本——请扫描下方的二维码：\n\
  \n[`packt.link/tableau`](https://packt.link/tableau)\n\n![](img/QR_Code2044012316175764640.png)\n"
- "# 使用 Tableau Prep Builder\n\n\n\n## Tableau Prep Builder 概览\n\nTableau Prep Builder\
  \ 随 Tableau Desktop 2018.1 版本推出，但我们可以用 Tableau Prep Builder（本章以下简称 *Prep*）做什么呢？该工具的核心用途是数据准备。好消息是，*Prep*\
  \ 与 Tableau Desktop 完全兼容，也与 Tableau Server 兼容。这意味着您可以在 *Prep* 中单击一下按钮即可执行作业来清理数据。此外，*Prep*\
  \ 与其“大哥” Tableau Desktop 一样可视化，这意味着您可以以完全可视化的格式查看数据准备的每一步。\n\n因此，让我们深入了解**图形用户界面**（**GUI**），并对这款高端产品感到惊叹，它将帮助您获得初步的数据洞察，从而更快地决定您的数据集是否值得分析。*Prep*\
  \ 将为更顺畅的 Tableau Desktop 体验铺平道路。\n\n在本章中，将讨论以下主题：\n\n*   连接数据\n*   Prep GUI\n* \
  \  数据质量\n*   Prep 的其他选项\n*   导出数据\n\n为了开始，我们需要加载数据。如何在 *Prep* 中执行此操作将在下一节中介绍。\n\n\
  ## 连接数据\n\n如果您熟悉 Tableau Desktop，*Prep* 对您来说将易如反掌。操作方式和界面非常相似，而且连接数据（如果连接器在 *Prep*\
  \ 中可用）的方式也相同，无论是文本文件、数据库还是提取文件。乍一看，您甚至可能注意不到 *Prep* 和 Tableau Desktop GUI 之间的区别，这提供了一个方便的优势：您可以立即开始准备数据。\n\
  \n要开始，请打开 *Prep* 并单击 **+** 以打开文件。将出现以下屏幕：\n\n![](img/B18435_03_01.png)\n\n图 3.1：连接数据\n\
  \n从前面的屏幕截图中，我们可以看到您可以在搜索栏中选择要连接的数据类型。正如在 Tableau 中一样，*Prep* 的功能列表包含多种数据库。\n\n现在，让我们通过一个实践练习来连接数据集。此练习需要以下数据集：[`www.kaggle.com/airbnb/boston`](https://www.kaggle.com/airbnb/boston)。请下载\
  \ `calendar.csv`、`listings.csv` 和 `reviews.csv`。或者，从 Tableau Public 上与本章关联的存储库下载：[`github.com/PacktPublishing/Mastering-Tableau-2023-Fourth-Edition/tree/main/Chapter03`](https://github.com/PacktPublishing/Mastering-Tableau-2023-Fourth-Edition/tree/main/Chapter03)。\n\
  \n首先，我们将从 `calendar.csv` 文件开始。通过建立文本文件连接，然后选择您的 `.csv` 文件，将其添加到空白的 *Prep* 画布中。您现在将看到以下屏幕：\n\
  \n![](img/B18435_03_02.png)\n\n图 3.2：输入数据\n\n恭喜——您刚刚建立了第一个 *Prep* 连接。在这里，您可以根据需要操作和可视化您连接的数据集！\n\
  \n在下一节中，我将更详细地描述 GUI。\n\n## Prep GUI\n\n用户体验是一个重要话题，不仅在您构建仪表板时，而且在您使用 Tableau 的其他方面时也是如此。Tableau\
  \ 最大的卖点之一一直是 GUI 的易用性，这只是 Tableau 备受客户喜爱的原因之一。\n\nPrep GUI 有两个重要的画布供您查看。连接数据到 *Prep*\
  \ 后，工作区将分成几个部分：\n\n![](img/B18435_03_03.png)\n\n图 3.3：Prep 工作区部分\n\n让我们看看从前面的屏幕截图中可以看到什么：\n\
  \n**A**：连接窗格，显示所选位置可用的输入文件。\n\n**B**：流程窗格，显示您当前的 *Prep* 流程。这总是从输入步骤开始。\n\n**C**：输入窗格设置，为您提供多个配置输入的选项。\n\
  \n**D**：输入窗格样本，显示您移至连接窗格的字段，包括样本值。\n\n在输入窗格（**C**）中，您可以使用通配符联合（多个文件）功能从同一目录添加多个文件。此外，您可以限制\
  \ *Prep* 将打印的样本集以提高性能。在输入窗格样本（**D**）中，您可以选择和取消选择要导入的字段并更改其数据类型。数据类型选项包括字符串、日期或数字等。\n\
  \n第二个 GUI 是配置文件窗格。选择所需的输入数据后，单击流程窗格中的 **+** 并选择 **添加：清理步骤**。现在配置文件窗格将显示数据网格：\n\n\
  ![](img/B18435_03_04.png)\n\n图 3.4：清理数据\n\n在前面的屏幕截图中，配置文件窗格分两部分显示来自数据源的每一列。上半部分显示聚合信息。例如，第\
  \ 2 列 `date` 在一个小型直方图中显示每个日期的行数。所有列都可以通过单击列名旁边的排序图标（当鼠标悬停在列上时出现的迷你条形图）并选择一项来排序。以\
  \ `available`（第 3 列）中的 `True` 为例。所有相关特征将被高亮显示：\n\n![](img/B18435_03_05.png)\n\n\
  图 3.5：可视化筛选\n\n这让您有机会在开始清理数据之前就对数据获得一些洞察。在下面的屏幕截图中，配置文件窗格的下半部分将按数据源中的原样显示每一行：\n\n\
  ![](img/B18435_03_06.png)\n\n图 3.6：数据概览\n\n到目前为止，我们已经看到，在 *Prep* 中加载数据后，可以通过单击列中的字段或条形来应用可视化筛选器。下半窗格将始终显示在行级别所做选择的数据源。接下来，我们将通过添加更多数据源继续。\n\
  \n### 了解 Prep\n\n让我们从一个实际示例开始：\n\n除了 `calendar.csv` 文件外，连接到以下文件：\n\n*   `listings.csv`\n\
  *   `reviews.csv`\n\n现在，将它们拖到流程窗格中：\n\n![](img/B18435_03_07.png)\n\n图 3.7：多表输入\n\
  \n您能回答以下问题吗？\n\n*   有多少房源在其描述中使用了“beach”一词？\n*   标记为“精确位置”的公寓占比是多少？\n*   哪一天录入的评论最多？\n\
  \n没有像 *Prep* 这样的工具，要找到这类问题的答案要困难得多。*Prep* 让我们的数据分析之旅更快、更轻松，这正是我鼓励您花额外时间学习 *Prep*\
  \ 以及 Tableau Desktop 的原因！\n\n解决方案可在与本章关联的工作簿中找到，链接如下：[`public.tableau.com/profile/marleen.meier`](https://public.tableau.com/profile/marleen.meier)。\n\
  \n在这里您可以看到，作为示例，我对 `date` 使用了 `sort()` 函数来回答第三个问题：*哪一天录入的评论最多？*\n\n![](img/B18435_03_08.png)\n\
  \n图 3.8：按日期排序\n\n正如您所见，对该字段排序后，日期按条目数排序，从而非常简单地回答了*哪一天录入的评论最多？*这个问题。经过前几次点击后，它已经开始让人感觉很自然，不是吗？\n\
  \n您对数据集所做的所有更改都可以在配置文件窗格的左侧追溯。但别忘了为每个步骤添加合适的名称：这将使他人和您自己更容易理解您的流程。\n\n那么，让我们继续了解\
  \ *Prep* 的数据质量功能。\n\n## 数据质量\n\n\n\nPrep 自带许多不同的功能。有时，你可能需要使用多种不同的工具来准备数据集，以使其达到你想要的形态。其他时候，你可能只需运行一次聚合（一个功能）就完成了。这实际上取决于数据集本身和预期的输出。事实是，Prep\
  \ 的输出数据越接近你在 Tableau Desktop 中进行可视化所需的数据，VizQL 在 Tableau Desktop 上运行的效率就越高。Tableau\
  \ Desktop 中的查询越少，意味着仪表板生成速度越快。\n\n对我来说，Prep 最好的地方在于它能处理海量数据。有时，我甚至会将其用于那些我不打算在 Tableau\
  \ Desktop 中可视化的数据集，只是为了快速了解概况，例如：有多少行包含特定单词、需要多少列、如果我筛选特定值日期范围会发生什么变化，等等！在短短几分钟内，我就能获得洞察，而如果用数据库查询或\
  \ Excel 函数则需要花费更多时间。希望在本章结束时，你能将数据准备所花的时间至少减半。我们将准备功能分为五个子类别：清洗、联合与连接、聚合、透视和脚本。让我们从清洗数据开始吧！\n\
  \n## 清洗数据\n\n我们之前在 *The Prep GUI* 部分已经见过以下画布。要创建清洗步骤，用户只需点击输入节点旁边的 `+` 并选择 `Add:\
  \ Clean Step`。在清洗步骤中，可以执行多种操作，例如筛选或创建计算字段。还要注意 Prep 给出的建议：\n\n![](img/B18435_03_09.png)\n\
  \nFigure 3.9: 建议\n\nPrep 会分析列内容并提出可能适合该数据的更改。例如，`listing_url` 列被识别为网页，因此 Prep 建议你将其更改为\
  \ URL 数据角色。`listing_url` 之后的第二、第三以及更多建议是移除某些列。这可能是因为该列不包含任何数据，或仅包含少量数据。列表还在继续。\n\
  \n此功能非常有用，特别是对于不熟悉的数据集。我的工作方式是查看建议，检查它们是否合理，然后执行更改——或者不执行。不要盲目相信这些建议，但它们可以指出你可能忽略的数据缺陷。\n\
  \n数据通常很混乱，涉及空值、手工录入的拼写错误、不同的格式、其他系统的变更等。因此，在能从分析或仪表板获得可靠结果之前，你必须先理清这团乱麻。本节将向你展示如何在列级别清洗数据。\n\
  \n一旦在清洗步骤中选中某个值，你就可以选择 `Keep Only`（仅保留）、`Exclude`（排除）、`Edit Value`（编辑值）或 `Replace\
  \ with Null`（替换为空值）：\n\n![](img/B18435_03_10.png)\n\nFigure 3.10: 快速访问\n\n这些更改都不会改变数据源本身。Prep\
  \ 就像一个中间步骤，或原始数据源与 Tableau Desktop 之间的一个过滤器。使用图 3.10 中所示的选项排除某个值，只会将其从 Prep 中移除。然而，如果稍后将其作为\
  \ Tableau Desktop 的输入，将没有选项将该特定值加回去。此选项仅保留在 Prep 中。\n\n另一个稍微隐藏的选项是点击列标题旁边的省略号 `...`（如\
  \ *Figure 3.11* 所示）并选择 `Clean`：\n\n![](img/B18435_03_11.png)\n\nFigure 3.11: 更多选项\n\
  \n此 `Clean` 功能基于列的数据类型运行。在前面的屏幕截图中，数据类型为字符串（由 `Abc` 图标指示）。对于其他数据类型，该选项将置灰，因为 `Clean`\
  \ 仅适用于字符串。该选项允许你使用八项更多清洗功能：\n\n*   Make Uppercase（转大写）\n*   Make Lowercase（转小写）\n\
  *   Remove Letters（移除字母）\n*   Remove Numbers（移除数字）\n*   Remove Punctuation（移除标点）\n\
  *   Trim Spaces（修剪空格）\n*   Remove Extra Spaces（移除多余空格）\n*   Remove All Spaces（移除所有空格）\n\
  \n数据类型可以在每个列标题正上方更改；你会在列名上方找到一个符号，点击它即可更改，就像在 Tableau Desktop 中一样：\n\n![](img/B18435_03_12.png)\n\
  \nFigure 3.12: 更改数据类型\n\n如果 Prep 错误解读了列的数据类型，这非常方便。错误分配的数据类型会影响你对其执行的计算，以及 Tableau\
  \ Desktop 如何可视化该列。\n\n在接下来的章节中，我们将练习合并多个数据集。例如，你可能想要将订单数据与发货数据合并（使用连接），或将 2020 年销售数据追加到\
  \ 2019 年销售数据集中（使用联合）。想知道如何操作，请继续阅读！\n\n## 联合与连接\n\n我们现在将连接这三个数据集，以便能够一起分析和可视化它们。这三个数据集（`listings.csv`、`reviews.csv`\
  \ 和 `calendar.csv`）的性质要求进行连接而非联合。不过，我仍将引导你完成联合的步骤，以便你知道何时需要它！\n\n### 添加联合\n\nTableau\
  \ 中的联合是将数据追加到现有数据集中。想象一下，你有两个 Excel 文件。两者具有完全相同的表头，但一个包含 2019 年的数据，另一个包含 2020 年的数据。如果你将\
  \ 2020 年数据联合到 2019 年数据，就是将 2020 年文件的行追加到 2019 年文件的行下方。要执行联合，两个数据集需要具有几乎相同的布局/表头。为什么说“几乎”？你将在以下练习中看到：\n\
  \n1.  开始此练习时，你的 Prep 流程窗格应如下所示：\n\n    ![](img/B18435_03_13.png)\n\n    Figure 3.13:\
  \ 流程窗格\n\n2.  点击 `listings` 数据集旁边的 `+` 添加一个清洗步骤。\n\n    你可以通过右键点击某个步骤并选择 `Edit Color`，根据喜好更改每个步骤的颜色。\n\
  \n3.  选择 `host_identity_verified` 列并筛选 `True`：\n\n    ![](img/B18435_03_14.png)\n\
  \n    Figure 3.14: 筛选 True\n\n4.  现在，创建一个名为 `DatasetA_ID` 的计算字段，仅包含一个字符串 `'A'`：\n\
  \n    ![](img/B18435_03_15.png)\n\n    Figure 3.15: 创建计算字段\n\n5.  从同一个 listings\
  \ 数据创建第二个清洗步骤，这次在 `host_identity_verified` 列上筛选 `True`：\n\n    ![](img/B18435_03_16.png)\n\
  \n    Figure 3.16: 筛选 True\n\n6.  使用 *Figure 3.15* 中所示的相同过程，创建一个计算字段 `DatasetB_ID`，仅包含字符串\
  \ `'B'`。通过右键点击并选择 `Rename` 重命名步骤，有助于跟踪应用的更改。你的流程应如下所示：\n\n    ![](img/B18435_03_17.png)\n\
  \n    Figure 3.17: 可视化流程\n\n7.  你现在已经创建了两个可以使用联合合并的数据集，且未更改原始数据。通过点击 `Dataset A`\
  \ 旁边的 `+` 并选择 `Union`，或将一个步骤拖拽到另一个步骤上（`Dataset B` 拖到 `Dataset A` 上，或反之），对两者进行联合：\n\
  \n    ![](img/B18435_03_18.png)\n\n    Figure 3.18: 联合\n\n8.  通过点击 `Union 1` 并查看屏幕左下角的输入详细信息，检查所有字段是否匹配：\n\
  \n    ![](img/B18435_03_19.png)\n\n    Figure 3.19: 可视化检查\n\n在前面的屏幕截图中，你可以看到左侧有关于联合的信息。从上到下：`Inputs`\
  \ 及其各自的颜色（这些与流程窗格中的相同）、`Resulting Fields`（显示 2 个不匹配的字段），最后是 `Mismatched Fields`\
  \ 本身：`DatasetA_ID` 和 `DatasetB_ID`。每个不匹配字段旁边的颜色表明，我们的 `DatasetB_ID` 字段在 `DatasetA`\
  \ 中不存在，而 `DatasetA_ID` 字段在 `DatasetB` 中不存在。\n\n\n\n\n2. 在此情况下，我们知道即使命名约定不同，这些列也可以追加。这两个字段更好的名称应该是\
  \ `Dataset_ID`（你可以回退几步尝试一下）。这样 Prep 就不会显示任何不匹配项。但对于我们这里的情况，我们可以继续将一个字段拖放到另一个字段上方以合并它们，从而授予\
  \ Prep 将它们视为一列的权限：\n\n![](img/B18435_03_20.png)\n\n图 3.20：合并\n\n1. 请看 `Resulting\
  \ Fields`（生成的字段）现在显示 0 个不匹配项，以及两个数据集的颜色现在都显示在列标题下方的条形中：\n\n![](img/B18435_03_21.png)\n\
  \n图 3.21：颜色编码\n\n1. 通过选择并右键单击联合步骤将其从 `Union 1` 重命名为 `listings2`，如果愿意，还可以通过选择并右键单击联合步骤并点击\
  \ `Add Description`（添加说明）来添加描述——你现在付出的所有额外努力稍后都将有助于复制、文档编写和解释。\n\n恭喜；你的第一次联合操作成功了。我们首先将原始\
  \ listings 数据集拆分为两个，然后再将它们合并回一个。将布局相同的数据垂直堆叠在一起，正如我们在这里所做的，是联合的典型任务。\n\n### 通配符联合\n\
  \n除了像上一节那样将一个数据输入拖放到另一个数据输入之上，你还可以告诉 Prep 从预定义目录中联合哪些文件。通常，部门会有一个共享位置，用于存储例如命名为\
  \ `Jan2023Revenue`、`Feb2023Revenue`、`Mar2023Revenue` 等的 Excel 文件。如果你遇到这种情况，可以执行以下操作：\n\
  \n1. 将 Prep 连接到任意一个你想要使用的文件。\n\n2. 点击输入数据图标并选择 `Tables`（表）选项卡。你现在可以看到，可以根据特定条件创建联合：\n\
  \n![](img/B18435_03_22.png)\n\n图 3.22：表菜单视图\n\n1. 我将选择同一目录中所有以某内容（`*`）开头并以 `2023Revenue.xlsx`\
  \ 结尾的匹配文件名，正如你所见，Jan、Feb 和 March 都将被包含在内，你甚至可以通过使用 `File`（文件）和 `Worksheet`（工作表）筛选器进行筛选，完成后点击\
  \ `Apply`（应用）：\n\n![](img/B18435_03_23.png)\n\n图 3.23：筛选联合\n\n这就是 `wildcard union`（通配符联合）功能。它非常强大！亲自试一试吧。\n\
  \n### 添加联接\n\n现在，我们将继续在同一个流程窗格中工作，重点关注联接。简要回顾一下，联接是水平追加数据。根据经验法则，联合增加行数，而联接改变列数：\n\
  \n1. 将 `listings2` 拖到 `reviews` 上，直到出现 `Join`（联接）选项。\n\n![](img/B18435_03_24.png)\n\
  \n图 3.24：联接\n\n1. 为联接选择 `reviews` 中的 `listing_id` 和 `listings2` 中的 `id`。请注意，你可以通过点击\
  \ `Join Type`（联接类型）下方的文氏图来更改联接类型：\n\n![](img/B18435_03_25.png)\n\n图 3.25：可视化检查联接\n\
  \n前面的概览告诉我们，`reviews` 数据集的所有 `68,275` 行都匹配到了 `listing2` 数据集中的一行。然而，我们确实有来自 `listing2`\
  \ 数据集的 `756` 个不匹配项。因此，我们的总 `Join Result`（联接结果）为 `68,275` 行。但并非所有房源都有评论，这很正常，因此我们可以放心地假设联接按预期工作。\n\
  \n1. 另一种检查方法是将联接更改为 `full outer join`（全外联接），稍后在 Tableau Desktop 中深入分析数据。要获得 `full\
  \ outer join`，只需点击两个圆圈的外边缘：\n\n![](img/B18435_03_26.png)\n\n图 3.26：全联接\n\n1. 如果你想检查即时结果，只需右键单击例如联接符号（由文氏图图标表示，如下截图所示），然后选择\
  \ `Preview in Tableau Desktop`（在 Tableau Desktop 中预览），即可在 Tableau Desktop 中查看数据：\n\
  \n![](img/B18435_03_27.png)\n\n图 3.27：预览\n\n1. 我们也可以重命名步骤；让我们将联接的名称改为 `lis&rev`。\n\
  \n到目前为止，我们已经了解了如何清理数据，以及如何使用联合和联接。联合部分教会了我们如何垂直追加数据或将数据堆叠在一起。联接部分让我们能够水平合并数据或将数据并排放置。更具体地说，我们能够将房源与其各自的评论相结合。我们不再拥有两个数据集，而是创建了一个数据集，它允许我们查找房源评论，并在同一行中查看关于房源本身的所有数据，如房源类型、卧室数量、是否有海景等。\n\
  \n接下来让我们继续聚合步骤。\n\n## 聚合\n\n当你想要更改数据粒度时，会用到聚合。在我们的数据集中，每条评论占一行。然而，我们想看看在波士顿从事 Airbnb\
  \ 业务时间较长的房东，相比于近期才开始的房东，是否拥有更多评论。为此，我们需要获取房东开始提供房源每年的聚合评论数。`host_since` 字段将提供有用信息，`reviewer_id`\
  \ 字段也是如此。对于后者，我们将统计留下评论的不同评论者数量。开始吧！\n\n我们当前的流程窗格如下所示：\n\n![](img/B18435_03_28.png)\n\
  \n图 3.28：流程窗格\n\n要聚合评论数量，请执行以下步骤：\n\n1. 首先，点击 `lis&rev` 旁边的 `+` 号并选择 `Aggregate`（聚合）：\n\
  \n![](img/B18435_03_29.png)\n\n图 3.29：聚合\n\n1. 这将打开一个名为 `Aggregate 1` 的窗口。我们的目标是查看从房东开始提供房源以来，每年有多少人评价了住宿；因此，请执行以下操作。\n\
  \n    1. 使用 `Additional Fields`（其他字段）窗格中的搜索字段（如图 3.30 左侧所示），通过拖放将 `host_since` 字段添加到\
  \ `Grouped Fields`（分组字段）中。\n\n    2. 同样通过拖放将 `reviewer_id` 添加到 `Aggregated Fields`（聚合字段）中。注意默认聚合为\
  \ `SUM`，如右侧箭头所示：\n\n![](img/B18435_03_30.png)\n\n图 3.30：聚合字段\n\n2. 通过点击 `Aggregated\
  \ Fields` 下的 `SUM` 来更改 `reviewer_id` 的聚合方式，并将其改为 `Count Distinct`（去重计数）：\n\n![](img/B18435_03_31.png)\n\
  \n图 3.31：去重计数\n\n1. 这将把默认聚合 `Sum`（计算每条评论）更改为 `Count Distinct`，后者统计不同的评论者 ID 聚合。这将使我们能够关注有多少不同的评论者留下了评论。这只是一个任意选择；请随意尝试其他聚合方式，看看数据如何变化。\n\
  \n让我们通过右键单击流程窗格上的 `Aggregate` 步骤并选择 `Preview in Tableau Desktop` 来查看 Tableau Desktop\
  \ 预览：\n\n![](img/B18435_03_32.png)\n\n图 3.32：房东图表\n\n在前面的屏幕截图中，我们可以看到按 `host_since`\
  \ 日期统计的评论去重计数。当然，在这个特定示例中，如果这些是拖到视图上的唯一字段，即使没有 Prep 的帮助，Tableau Desktop 也能按 `host_since`\
  \ 日期统计评论。但在将数据导入 Tableau Desktop 之前进行聚合的一个好处是，你需要导入的数据更少；因此，可以实现更好的性能。如果你想继续在 Prep\
  \ 或 Tableau Desktop 中分析数据集，现在可以提出进一步的问题，例如：\n\n* 哪种住宿类型住一周比住一天的折扣最大？\n* 住宿大小与月价之间是否存在相关性？\n\
  * 拥有多个房源的房东占比是多少？\n\n祝你好运，愉快地构建仪表板吧！\n\n\n\n\n\n我们将在此结束本节，并回顾一个仅包含 9 个数据点的图表，该图表是通过按房东开始提供房源的年份聚合近\
  \ 64,000 行 `reviewer_id` 数据而创建的。该图表讲述了一个故事；而 64,000 行单独的数据则不能。这就是为什么始终要减少数据量，并在可能的情况下对其进行聚合的原因。在下一节中，我们将讨论另一个重要功能：透视。\n\
  \n## 透视\n\n你是否遇到过这样的情况：将字段拖放到 Tableau Desktop 的行货架和列货架上，但可视化效果不知为何无法按预期工作？很有可能你需要转换数据，或者更准确地说，对其进行透视。如果你预期位于同一列中的数据分散在多行中，却出现在多列中，这就是一个需要透视的场景。以下示例将展示透视的必要性。\n\
  \n对于我们的透视示例，我们将使用另一个数据集。你可以在 [`github.com/PacktPublishing/Mastering-Tableau-2023-Fourth-Edition/blob/main/Chapter03/Excel_Pivot.xlsx`](https://github.com/PacktPublishing/Mastering-Tableau-2023-Fourth-Edition/blob/main/Chapter03/Excel_Pivot.xlsx)\
  \ 找到它。该数据集非常简单，如下所示：\n\n![](img/B18435_03_33.png)\n\n图 3.33：Excel 输入\n\n它包含在五个不同日期观察到\
  \ `x` 次的三种不同颜色。这些数据是透视有助于整理数据的典型示例，因为多个列具有相同的用途——`B`、`C` 和 `D` 都是观察值。如果你想可视化此表，它可能如下所示：\n\
  \n![](img/B18435_03_34.png)\n\n图 3.34：透视 I\n\n但你可能会想，既然配色方案已经指示了观察到哪种颜色，将所有三条线放在一张图表中不是更好吗？在一张折线图中，按颜色分别显示单独的线条？让我们来实现这一点！\n\
  \n首先将 `PivotDataSet` 连接到 Prep，然后按照以下步骤透视数据：\n\n1. 从 Prep 连接到我们刚创建的 Excel 文件，并将 `PivotDataSet`\
  \ 添加到流程窗格，点击输入数据步骤旁边的 `+`，然后选择 `Pivot`。一个名为 `Pivot 1` 的新步骤将会出现：\n\n![](img/B18435_03_35.png)\n\
  \n图 3.35：添加透视步骤\n\n2. 在流程窗格中点击 `Pivot 1` 步骤，`图 3.36` 将出现在 Prep 窗口底部。选择 `字段` 窗格中显示的所有三种颜色（如\
  \ `步骤 I` 所示），并将它们拖动到 `透视字段` 窗格中（如 `步骤 II` 所示）：\n\n![](img/B18435_03_36.png)\n\n\
  图 3.36：透视步骤\n\n3. 现在，查看 `透视结果` 窗格（如上一张截图的 `步骤 III` 所示），通过右键点击并选择 `重命名`，将 `Pivot1\
  \ Names` 重命名为 `Colors`，将 `Pivot1 Values` 重命名为 `Observations`。现在点击 `Pivot 1` 旁边的\
  \ `+`，瞧，我们现在有了一个整洁的表，称为 `Clean 1`：\n\n![](img/B18435_03_37.png)\n\n图 3.37：透视结果\n\
  \n4. 还记得我们开头提到的问题吗？现在我们的折线图可以用另一种方式创建，如 `图 3.38` 所示。请注意，`Colors` 现在是一个维度，而 `Observations`\
  \ 是它们自己的字段，而在此之前，它们位于每种颜色的列标题下：\n\n![](img/B18435_03_38.png)\n\n图 3.38：透视后的折线图\n\
  \n这是一个透视的简单用例，但此处的技术可以迁移到任何其他数据集。Prep 具有内置的推荐功能。每当你看到列右上角有一个灯泡图标时，请查看一下，看看该推荐是否适用于你的需求。\n\
  \n![](img/B18435_03_39.png)\n\n图 3.39：修剪空格\n\n在这种情况下，Tableau 建议我们删除所有前导和尾随空格，这正是我们所需要的！正如这里演示的，检查推荐总是值得的。\n\
  \n很好；你已经掌握了主要的 Prep 功能。不过，你可能想知道如果需要进一步准备该怎么办。没问题；Prep 为你提供了支持。脚本是 Prep 最新增添的功能，也是最强大的功能；它几乎是无限的！继续阅读以探索\
  \ Prep 的脚本功能。\n\n## 脚本\n\n我们接下来要讨论的脚本功能是最近添加到 Tableau 中的功能之一。我们将其放在后面讨论，因为像 `Python`\
  \ 或 `R` 这样的编程语言能给你带来无限的灵活性。如果你遇到了 Prep 功能的边界，你可以回退到脚本编写，编写自己的代码来精确实现你想要的功能。\n\n\
  为了使用它，你必须首先在 Tableau 之外连接到 Python（或 R）。以下步骤基于 [`help.tableau.com/current/prep/en-us/prep_scripts_TabPy.htm`](https://help.tableau.com/current/prep/en-us/prep_scripts_TabPy.htm)\
  \ 中针对 Python 的说明，或 [`help.tableau.com/current/prep/en-us/prep_scripts._R.htm`](https://help.tableau.com/current/prep/en-us/prep_scripts._R.htm)\
  \ 中针对 R 的说明。\n\n对于此练习，我们将使用波士顿 Airbnb 数据集，更具体地说是 `calendar` 表。从 [`www.kaggle.com/airbnb/boston`](https://www.kaggle.com/airbnb/boston)\
  \ 下载此数据集，并在 Prep 中连接到 `calendar` 表：\n\n![](img/B18435_03_40.png)\n\n图 3.40：Calendar\
  \ 数据集\n\n现在，让我们退一步，将 Python 连接到 Prep：\n\n1. 从 [python.org](http://python.org) 下载并安装\
  \ `Python`（或从 [`www.r-project.org/`](https://www.r-project.org/) 下载并安装 `R`）。\n\n\
  2. 通过在终端或命令行中执行以下命令来下载并安装 `TabPy`：\n\n```\npip install tabpy\n```\n\n3. 或者，如果使用\
  \ `R`，打开 `R` 并执行：\n\n```\ninstall.packages(\"Rserve\", , \"http://rforge.net\")\n\
  ```\n\n4. 通过在命令行/终端中输入以下命令来打开 `TabPy`：\n\n```\ntabpy\n```\n\n或者，在 R GUI 中，输入：\n\n\
  ```\nlibrary(Rserve)\nRserve()\n```\n\n1. 回到 Prep，点击 calendar 表右侧的 `+` 并添加一个 `清理步骤`。\n\
  \n2. 添加一个名为 `PythonTest` 的计算字段（如果你选择尝试 `R`，则使用 `RTest`），字符串值为 `Test`：\n\n![](img/B18435_03_41.png)\n\
  \n图 3.41：PythonTest\n\n3. 现在，点击 `Clean 1` 步骤右侧的 `+` 并添加 `脚本`。\n\n4. 通过选择 `脚本` 步骤，底部的\
  \ `设置` 窗格（见 `图 3.42`）将给你一个连接到 `Rserve` 或 `TabPy` 的选项。`Rserve` 是 `R` 的 Tableau 服务器，`TabPy`\
  \ 是 Python 的 Tableau 服务器。\n\n5. 通过选择 `Rserve` 或 `Tableau Python (TabPy) Server`\
  \ 来选择你的连接类型。然后打开 `帮助 | 设置和性能 | 管理分析扩展连接`。在弹出的窗口中，使用 `localhost` 和 `端口 9004` 将 Prep\
  \ 连接到 `TabPy`（如果使用 R，则通过在同一弹出窗口中 `连接类型` 下选择 `Rserve` 并使用 `localhost` 和 `端口 6311`\
  \ 连接到 Rserve），然后点击 `登录`：\n\n* 如果使用启用了 SSL 加密的 Rserve 服务器，`端口 4912` 是默认端口。\n\n![](img/B18435_03_42.png)\n\
  \n图 3.42：TabPy 服务器\n\n6. 接下来，如果尝试 Python，创建一个包含以下代码的 `.py` 文件，并确保缩进完全相同：\n\n![](img/B18435_03_43.png)\n\
  \n图 3.43：.py 文件\n\n或者，创建一个包含以下代码的 `.R` 文件：\n\n```\nGet ChangeString<- add_column(\n\
  .data, \n.before = 'Test'\n.after = 'R') {\nReturn (data.frame ())\n}\n```\n\n7.\
  \ 我们刚创建的脚本旨在更改 Prep 中的现有列，并根据你选择的语言，将每一行从 `Test` 重命名为 `Python` 或 `R`。\n\n\n\n\n\n\
  2. 我们将继续使用 Python 脚本。回到 Prep 中，浏览找到刚才创建的 `.py` 文件，并将函数名称添加到 Prep 界面。我将该文件命名为 `PrepTableau.py`，函数名称为\
  \ `ChangeString`，正如前一步所定义的：\n\n![](img/B18435_03_44.png)\n\n图 3.44：添加函数\n\n1. 观察到\
  \ `PythonTest` 列已从 `Test` 变为 `Python`：\n\n![](img/B18435_03_45.png)\n\n图 3.45：PythonTest\n\
  \n我们的小实验成功了！尽管我们使用了一个非常简单的例子，但它证明了脚本功能有效，你可以发挥创造力，利用脚本实现更多功能。例如包括从计算反向正态分布到使用情感分析或聚类进行机器学习等各种场景。\n\
  \n你可能注意到，我们并未在脚本本身中导入 `pandas`，但仍然使用了 `pandas` DataFrame。这是因为 `pandas` 的导入随 `TabPy`\
  \ 一起提供。你可以在打开 `TabPy` 后的命令行/终端中看到这一点：\n\n![](img/B18435_03_46.png)\n\n图 3.46：命令行中导入\
  \ pandas\n\n如果你想在脚本中使用其他库，可以在命令行/终端上使用 `pip install` 来安装它们。之后只需重启 `TabPy`，你就能使用它们了。请记住，始终先在终端/命令行中打开\
  \ `TabPy`，否则 Prep 无法执行脚本。\n\n在撰写本文时，Prep 尚不支持将脚本作为输入——不过，你可以使用一个虚拟的 `.csv` 文件作为变通方法，并在其后立即向流程中添加脚本。\n\
  \n# Prep 的其他选项\n\n本节将讨论一些独立的、非常强大且新的 Prep 功能。你们中的一些人可能从最初的版本就开始使用 Prep 了。随着每个版本的发布、每一位新用户的加入以及每一条反馈的收集，Tableau\
  \ 能够创建一个优先级列表，列出利益相关者（像你我这样的人）真正希望看到的功能。即将讨论的主题就是其中最好的例子。这些功能在最初的版本中均不存在，但它们让产品变得更好、更有价值、更完善。现在你可以保存流程的一部分并重复使用，将数据写回外部数据库，刷新数据集的部分内容，并使用\
  \ Tableau Data Management 插件调度流程。让我们仔细看看，从“插入流程”功能开始。\n\n## 插入流程\n\nPrep 中的一个选项是将现有流程添加到你自己的流程中。例如，假设有人已经处理了波士顿\
  \ Airbnb 数据集，并创建了一个仅包含高亮步骤的流程：\n\n![](img/B18435_03_47.png)\n\n图 3.47：保存到文件\n\n\
  你可以通过右键单击并选择 `保存到文件` 来保存想要插入流程的步骤，如*图 3.47*所示。然后，通过在画布上右键单击，选择 `插入流程`，并浏览 `.tfl`\
  \ 文件以找到之前下载的文件，即可将这些步骤插回到你的流程中：\n\n![](img/B18435_03_48.png)\n\n图 3.48：插入流程\n\n\
  此功能对于共享工作和重复使用已创建的步骤非常方便。接下来，我们将探讨另一个功能，它将允许你刷新 Prep 流程中使用的数据：增量刷新。\n\n## 增量刷新\n\
  \nPrep 2020.2 引入了增量刷新功能。完成流程并添加 `输出` 步骤后，你可以决定是想要完全刷新还是增量刷新，以及想要使用哪个字段作为指标。想象一下，你拥有某种疾病每天感染人数的数据集。每天结束时，你都想将来自卫生部门数据库的新数据添加到你的数据集中。那么，你该怎么做？\n\
  \n通常，你会在最新数据点添加后加载整个数据集，所有数据。但比那一天早的数据点没有任何变化；它们将保持不变，而且你之前已经加载过它们了。因此，重新加载整个数据集是对资源的浪费。增量刷新将仅加载新数据点并将它们添加到现有数据中，这些现有数据是在许多天里累积起来的。你可以想象这将节省多少时间和精力。与完全刷新相比，这是一种更可持续的方式来保持数据的最新状态。\n\
  \n我们将在以下工作流中查看一个示例。重要的是流程中包含一个 `输出` 步骤：\n\n![](img/B18435_03_49.png)\n\n图 3.49：增量刷新\n\
  \n要添加增量刷新，请执行以下步骤：\n\n1. 单击数据输入步骤，向下滚动 `设置` 选项卡，直到看到 `增量刷新` 选项。然后，勾选 `启用增量刷新` 复选框：\n\
  \n![](img/B18435_03_50.png)\n\n图 3.50：设置增量刷新\n\n1. 单击 `启用增量刷新` 复选框后，将出现一个下拉菜单。此下拉菜单包含\
  \ Prep 认为可用作数据刷新指标的所有字段。例如，选择 `date` 字段。这是完美的字段，因为一旦原始数据源中添加了新日期，刷新就会开始。\n\n2. Prep\
  \ 还会要求你提供输出中代表 `date` 列的输出字段。在我们的例子中，它仍然是 `date`：\n\n![](img/B18435_03_51.png)\n\
  \n图 3.51：选择输出字段\n\n1. 完成所有设置后，再次单击 `输出` 步骤，注意现在你可以通过单击 `运行流程` 选项上的下拉菜单，选择你希望用于此流程的刷新类型（完全或增量）：\n\
  \n![](img/B18435_03_52.png)\n\n图 3.52：刷新选项\n\n你刚刚学会了如何设置数据刷新——完全刷新和增量刷新。这将帮助你可持续地使用计算资源，并始终保持数据的最新状态。接下来，我们将介绍另一个值得探究的\
  \ Tableau 功能——批量重命名。\n\n## 批量重命名\n\n此功能真是个节省时间的利器！只需选择任意数量的要重命名的列，右键单击，然后选择 `重命名字段`。将打开一个新视图，允许你为每个选定的列添加前缀或后缀，或者替换其中每个列中的特定文本：\n\
  \n![](img/B18435_03_53.png)\n\n图 3.53：批量重命名演示\n\n然后你还可以利用 `查找文本` 功能，或自动重命名稍后可能新增的所有字段，例如，因为\
  \ IT 部门向你的数据集添加了一个额外的列。\n\n## Tableau Prep Conductor\n\n借助 `Tableau Prep Conductor`，你可以将\
  \ Prep 流程发布到 Tableau Server，安排它们在特定时间运行，并始终拥有刷新后的数据。Conductor 可在 Tableau Data Management\
  \ 插件中获得，不随 Tableau Desktop 或 Prep 一起提供。\n\n有关更多信息，请查看 [`www.tableau.com/products/add-ons/data-management`](https://www.tableau.com/products/add-ons/data-management)。\n\
  \n# 导出数据\n\n最后但同样重要的是，我们可能想要导出数据。我们之前看到过，在流程窗格中右键单击符号可以预览 Tableau Desktop 中的数据：\n\
  \n1. 如果你想按计划运行流程或将其保存到某个位置，最好使用 `添加` | `输出`。\n\n2. 执行此操作后，将出现以下屏幕：\n\n![](img/B18435_03_54.png)\n\
  \n图 3.54：保存到文件\n\n1. 用户现在可以选择将数据保存到文件，也可以将其保存为 Hyper 文件格式 `.hyper`、`.xlsx`（Tableau\
  \ 2021.1 新增）或 `.csv` 文件。\n\n2. 另一个选项是将新生成的数据源直接发布到 Tableau Server，使其可供其他用户使用。对于此选项，请从下拉菜单中选择\
  \ `作为数据源发布` 而不是 `保存到文件`。\n\n\n\n\n\n## 将输出保存到外部数据库\n\n3. Tableau 2020.3 新增了保存 Prep\
  \ 输出的第三种选项：将结果数据写入外部数据库。如果您想这样做，请从下拉菜单中选择 `Database` 表选项。撰写本文时，有七种数据库兼容写回功能，但将根据用户需求增加更多：\n\
  \n![](img/B18435_03_55.png)\n\n图 3.55：保存到外部数据库\n\n自 Tableau 2022.3 版本起，您也可以写回 CRM\
  \ Analytics。为此，您需要一个 Salesforce 账户和相应的许可证。因此，我们将不再深入讨论此选项，但如果您是 Salesforce Analytics\
  \ 用户，请去了解一下！\n\n本节向我们展示了如何保存工作，更重要的是如何保存 Prep 流的输出。在我看来，将输出保存到外部数据库是最好的新功能，因为它是以结构化和有组织的方式与他人共享输出的最简单方法。这样不仅我，其他用户也可以使用预处理好的数据，节省额外的工作。该流随后不仅可以由我复用，也可以由任何人复用。\n\
  \n## 总结\n\n我们本章从 Prep 简介开始。我们查看了 GUI 以及如何将数据连接到其中。之后，我们进行了一些关于数据准备的练习。这可以分为五个部分：数据清洗、联合与连接、聚合、透视和脚本。我们还考虑了其他几个提高数据实用性的选项，包括从其他流插入步骤，以及增量刷新。为了完成本章关于\
  \ Prep 的内容，我们研究了导出数据。在这里，我们看到新数据集可以保存为文件或数据提取，写回外部数据库，或直接推送到 Tableau Server。\n\n\
  正如 Tableau Desktop 一样，Prep 非常直观且高度可视化。颜色、符号和高亮使得这款提取、转换和加载 (ETL) 工具易于上手，它在您于主 Tableau\
  \ 界面操作数据之前准备数据时非常宝贵！\n\n在下一章中，我们将继续探索 Tableau 中的数据。我们将通过查看连接、混合和数据结构，来探讨如何为 Tableau\
  \ 准备数据。\n\n## 在 Discord 上了解更多\n\n要加入本书的 Discord 社区——您可以在其中分享反馈、向作者提问并了解新版本——请扫描下方的二维码：\n\
  \n[`packt.link/tableau`](https://packt.link/tableau)\n\n![](img/QR_Code2044012316175764640.png)\n"
- "# 第 4 章：了解连接、混合和数据结构\n\n## 简介\n\n将 Tableau 连接到数据通常不仅意味着连接到单个数据 `source` 中的单个表。您可能需要使用\
  \ Tableau 连接来自单个数据源的多个表。为此，我们可以使用连接，如果给定的键值匹配，连接会将一个数据集的行与另一个数据集的行结合起来。您也可以连接来自不同数据源的表，或联合具有相似元数据结构的数据。\n\
  \n有时，您可能需要合并不共享公共行级键的数据，这意味着如果您像在连接中那样尝试在行级别匹配两个数据集，您将会复制数据，因为一个数据集中的行数据详细程度要高得多（例如城市），而另一个数据集可能只包含国家。在这种情况下，您将需要混合数据。此功能允许您，例如，在不将城市数据集更改为国家级别的情况下，显示每个国家的城市数量。\n\
  \n此外，您可能会遇到需要创建多个到单个数据源的连接，以便以不同方式透视数据的情况。这可以通过操作数据结构来实现，它可以帮助您使用同一个数据集从不同角度进行数据分析。这可能是为了发现那些用单一数据结构难以或根本无法回答的问题的答案。\n\
  \n在本章中，我们将讨论以下主题：\n\n*   关系\n*   连接\n*   联合\n*   混合\n*   理解数据结构\n\n在 2020.2 版本中，Tableau\
  \ 增加了功能，允许您在不指定上述两种方法（连接或混合）的情况下进行连接或混合。它被称为 `relationships`。我们将首先解释这一新功能，然后再深入研究连接、混合等的细节。\n\
  \n## 关系\n\n虽然本章将主要关注连接、混合和数据结构操作，但让我们首先介绍 `relationships`：这是 Tableau 2020.2 起可用的新功能，也是\
  \ Tableau 社区期盼已久的功能。它是数据画布中的新默认选项；因此，我们将首先研究属于数据模型 `logical layer`（逻辑层）的 `relationships`，然后再深入探讨在\
  \ `physical layer`（物理层）上运行的连接和联合功能。\n\n要阅读有关 Tableau 数据模型的物理层和逻辑层的所有内容，请访问 Tableau\
  \ 帮助页面：[`help.tableau.com/current/online/en-us/datasource_datamodel.htm`](https://help.tableau.com/current/online/en-us/datasource_datamodel.htm)。\n\
  \n目前，您可以将逻辑层理解为能够“更聪明地计数”。想象一个包含唯一客户名称的客户表，和一个包含数百个记录订单的订单表。在逻辑层中，拥有多个订单的客户名称（因此在订单表中有多行订单和客户\
  \ ID）将被计为一位客户，因为逻辑层很智能，它能识别客户名称；而物理层会为每个订单计数一位客户，因此如果同一客户下了多个订单，物理层会将其计为多位客户。只有通过计算非重复值才能解决此问题（使用逻辑层时无需此操作）。\n\
  \n在下面的屏幕截图中，您可以看到数据源画布，左侧是两个数据集通过关系结合，右侧是相同数据集通过 `join` 结合。请注意，关系仅在表之间显示一条线（`Orders`、`People`\
  \ 和 `Returns`），而连接则通过两个圆圈指示连接类型：\n\n![](img/B18435_04_01.png)\n\n图 4.1：数据源画布上的关系和连接\n\
  \n一个关键区别是，底部的数据预览在关系中将仅显示所选表的数据，而使用连接时显示所有数据。这是合理的，因为关系中的数据粒度会根据您在仪表板中使用的字段而变化。然而，连接具有固定的粒度级别，由您选择的连接类型和连接子句定义。\n\
  \n关系是 Tableau Desktop 2020.2 及更高版本的默认设置。但是，如果您仍想使用连接功能，可以将数据集拖入数据源画布，点击下拉箭头，然后选择\
  \ `Open…`：\n\n![](img/B18435_04_02.png)\n\n图 4.2：从关系画布到连接画布\n\n这将像在 2020.2 版本之前的\
  \ Tableau 数据窗格中那样打开数据集，您将能够以旧方式使用连接，正如我们将在 `Joins` 部分所述。\n\n关系中两个数据集之间的线（基于逻辑层）被称为\
  \ `noodle`，因为它看起来像 al dente 意大利面——美味！只要您将第二个数据源拖入数据源画布，Tableau 就会检测到关系，但您可以通过点击\
  \ noodle 本身来添加更多键列，或删除和调整它们：\n\n![](img/B18435_04_03.png)\n\n图 4.3：关系键\n\n如果您在 Tableau\
  \ 2020.2 或更高版本中打开旧版仪表板，您将看到连接的数据显示为 `Migrated`（已迁移）。这是有意为之。只需点击已迁移的数据源，Tableau 就会从逻辑层切换到物理层，这意味着您将看到基于连接的数据源画布，而不是关系画布。\n\
  \n\n\n\n查看工作表，你也会注意到一些差异。你会发现，在新的关系布局中，列首先按表名划分，然后按数据源拆分为 `Dimensions`（维度）和 `Measures`（度量），而在联接中，列则被划分为\
  \ `Dimensions` 和 `Measures`，并按表名拆分。\n\n总而言之，新的数据源布局让合并数据集变得容易得多，你无需预先决定是要联接还是混合。习惯了旧版数据源窗格的用户可能需要一点时间来适应这种新的灵活性，但对于\
  \ Tableau 新用户来说，从一开始处理不同的数据集将容易得多。尽管如此，我们接下来仍将介绍联接，特别是因为该功能仍作为物理层的一部分保留在 Tableau\
  \ 中。\n\n## 联接\n\n本书假设读者具备联接的基础知识，特别是内联接、左外联接、右外联接和全外联接。如果你不熟悉联接的基础知识，建议学习 W3Schools\
  \ 的 SQL 教程：[`www.w3schools.com/sql/default.asp`](https://www.w3schools.com/sql/default.asp)。基础知识并不难，所以你不会花太长时间就能上手。\n\
  \n下面的屏幕截图显示了三个相关的数据集：\n\n![](img/B18435_04_04.png)\n\n图 4.4：相关数据集\n\n## 联接查询\n\n\
  下面的屏幕截图展示了图 4.4 中已联接数据集的表示：\n\n![](img/B18435_04_05.png)\n\n图 4.5：联接剪裁\n\n上述屏幕截图表示\
  \ `Orders` 表和 `Returns` 表之间的内联接，通过公共键 `Order ID` 进行内联接。`Orders` 和 `People` 通过公共键\
  \ `Region` 进行联接。\n\n为了更好地理解刚才的描述，我们将继续进行一个联接剪裁练习。我们将查看在使用这两个表构建简单视图时 Tableau 生成的\
  \ SQL 查询，这将向我们展示当我们仅仅进行拖放操作时，Tableau 在后台做了什么。\n\n请遵循以下步骤：\n\n1.  从 [`public.tableau.com/profile/marleen.meier/`](https://public.tableau.com/profile/marleen.meier/)\
  \ 找到并下载与本章关联的工作簿。\n2.  选择 `Join Culling` 工作表，然后点击 `Sample - EU Superstore Join`\
  \ 数据源。\n3.  从菜单中选择 `Help`（帮助），然后选择 `Settings and Performance`（设置和性能），最后选择 `Start\
  \ Performance Recording`（开始性能记录）：\n\n![](img/B18435_04_06.png)\n\n图 4.6：开始性能记录\n\
  \n4.  将 `People` 拖到 `Rows`（行）架上，将 `Sales` 放在 `Text`（文本）架上：\n\n![](img/B18435_04_07.png)\n\
  \n图 4.7：拖放操作\n\n5.  通过 `Help`、`Settings and Performance`，最后选择 `Stop Performance\
  \ Recording` 停止记录。\n6.  在生成的 `Performance Summary`（性能摘要）仪表板中，将时间滑块拖到 `0.0000`，并选择两个绿色条形：`Executing\
  \ Query`（执行查询）。现在你可以看到 Tableau 生成的两条 SQL 查询：\n\n![](img/B18435_04_08.png)\n\n图 4.8：性能记录\n\
  \n到目前为止，我们已将 Tableau 连接到数据集，然后创建了一个非常简单的工作表，显示人员的销售数量。但是，为了显示人员姓名和销售金额，Tableau 需要从两个不同的表中获取数据：`Orders`\
  \ 和 `People`。图 4.8 中的性能记录显示了构建仪表板每个步骤所花费的时间以及发送到数据库的查询。因为我们先拖入一个 `dimension`（维度），然后拖入一个\
  \ `measure`（度量）到工作表中，所以看到了两条查询。第二条查询结合了两个拖入的字段；因此，我们将重点关注后者。让我们详细看一下：\n\n```sql\n\
  \"SELECT \"\"People\"\".\"\"People\"\" AS \"\"People\"\",\n  SUM(\"\"Orders\"\"\
  .\"\"Sales\"\") AS \"\"sum:Sales:ok\"\"\nFROM \"\"TableauTemp\"\".\"\"Orders$\"\"\
  \ \"\"Orders\"\"\n  INNER JOIN \"\"TableauTemp\"\".\"\"People$\"\" \"\"People\"\"\
  \ ON (\"\"Orders\"\".\"\"Region\"\" = \"\"People\"\".\"\"Region\"\")\n  INNER JOIN\
  \ \"\"TableauTemp\"\".\"\"Returns$\"\" \"\"Returns\"\" ON (\"\"Orders\"\".\"\"Order\
  \ ID\"\" = \"\"Returns\"\".\"\"Order ID\"\")\nGROUP BY 1\"\n```\n\n请注意，表之间生成了内联接。这是\
  \ Tableau 联接功能的后台视图。\n\n现在技术细节已经讨论过了，让我们看看仪表板本身中的联接。\n\n## 联接计算\n\n在 Tableau 中，可以基于计算联接两个文件。你可以使用此功能来解决两个数据源之间的不匹配问题。计算联接可以在每个联接的下拉菜单中访问。\n\
  \n请看下面的屏幕截图：\n\n![](img/B18435_04_09.png)\n\n图 4.9：创建联接计算……\n\n举个例子，假设一个数据集包含一列\
  \ `First Name`（名）和另一列 `Last Name`（姓）。你想将其联接到第二个数据集，该数据集有一列名为 `Name`，包含名和姓。在第一个数据集中创建如下\
  \ `Join Calculation`（联接计算）是联接这两个数据集的一种选择：\n\n```\n[First Name] + ' ' + [Last Name]\n\
  ```\n\n现在，在第二个数据集中选择 `Name` 列，你的键应该就匹配了！\n\n如果你想了解更多关于计算联接的信息，请查看 Tableau 帮助页面：[`help.tableau.com/current/pro/desktop/en-us/joining_tables.htm#use-calculations-to-resolve-mismatches-between-fields-in-a-join`](https://help.tableau.com/current/pro/desktop/en-us/joining_tables.htm#use-calculations-to-resolve-mismatches-between-fields-in-a-join)。\n\
  \n## 空间联接\n\n在 Tableau 2018.2 中，增加了 `spatial joins`（空间联接）。这意味着你可以联接来自 MapInfo 表以及\
  \ Shape、Esri、KML、TopoJSON 和 GeoJSON 文件的空间字段。你也可以使用 CSV 或 Excel 文件，并通过 Tableau 的\
  \ `MAKEPOINT` 函数将数据转换为空间数据（请参见第 12 章，利用高级分析）。在实践中，想象一下两个数据集，一个关于流域的位置，由空间字段指示；第二个数据集包含水禽目击位置，也在空间列中。Tableau\
  \ 允许你联接这两个数据集，否则这很难实现，因为大多数程序不支持空间数据。\n\n要在空间列上联接，必须从 `Join`（联接）下拉菜单中选择 `Intersects`（相交）字段，该字段仅在处理空间数据时可见。\n\
  \n有关在 Tableau 中联接空间文件的更多信息，请阅读 Tableau 提供的以下资源：\n\n*   [`help.tableau.com/current/pro/desktop/en-us/maps_spatial_join.htm`](https://help.tableau.com/current/pro/desktop/en-us/maps_spatial_join.htm)\n\
  *   [`www.tableau.com/about/blog/2018/8/perform-advanced-spatial-analysis-spatial-join-now-available-tableau-92166`](https://www.tableau.com/about/blog/2018/8/perform-advanced-spatial-analysis-spatial-join-now-available-tableau-92166)\n\
  *   [`help.tableau.com/current/pro/desktop/en-us/maps_spatial_join.htm`](https://help.tableau.com/current/pro/desktop/en-us/maps_spatial_join.htm)\n\
  *   [`help.tableau.com/current/pro/desktop/en-us/examples_spatial_files.htm`](https://help.tableau.com/current/pro/desktop/en-us/examples_spatial_files.htm)\n\
  \n作为水平联接的替代，你可能需要垂直联接，也称为 `union`（联合）。典型的 `union` 用例是可视化存储在多个文件或表中随时间变化的数据。你可能有一份日报，其列结构相同，但每天作为一个新文件收集，存储在月度或年度文件夹中。\n\
  \n合并这些文件比逐个查看它们能提供更多洞察！你将能够分析趋势和每日或每年的变化，或执行年初至今分析。因此，接下来我们将继续深入解释 Tableau 中的 `unions`。\n\
  \n## 联合\n\n\n\n\n## 联合 (重复条目)\n\n有时您可能想要分析存储在不同文件中但具有相同元数据结构的数据——例如，来自多个年份、不同月份或不同国家的销售数据。您可以对数据进行联合，而不必复制和粘贴。我们已经在*第\
  \ 3 章* *使用 Tableau Prep Builder* 中涉及过此主题，但联合基本上是 Tableau 将新数据行追加到具有相同标题的现有列中。在以下练习中，我们将使用\
  \ FIFA 数据（来自 PlayStation 游戏，而非世界杯）。数据来自 Kaggle（`https://www.kaggle.com/datasets/stefanoleone992/fifa-22-complete-player-dataset?resource=download`），并以多个\
  \ `CSV` 文件的形式提供；每个 `CSV` 包含一年的数据，男性和女性数据也被分开存放。\n\n为了进行分析，我们希望将所有文件合并为一个。因此，我们需要进行联合，步骤如下：\n\
  \n1.  从 GitHub（`https://github.com/PacktPublishing/Mastering-Tableau-2023-Fourth-Edition/tree/main/Chapter04`）或\
  \ Kaggle（`https://www.kaggle.com/datasets/stefanoleone992/fifa-22-complete-player-dataset?resource=download`）下载\
  \ `CSV` 文件。\n2.  在属于本章的仪表板中，打开 `连接到数据` 窗格，然后点击 `文本文件`：\n\n![](img/B18435_04_10.png)\n\
  \n图 4.10：文本文件\n\n3.  在您的计算机上找到下载的 FIFA 数据并连接到其中任意一个文件。\n4.  通过将左侧窗格中的第二个文件拖放到初始文件顶部来创建联合，直到出现\
  \ `联合` 字样，这表示现在放置数据将用于联合：\n\n![](img/B18435_04_11.png)\n\n图 4.11：联合\n\n5.  或者，点击主数据集的箭头并选择\
  \ `转换为联合...`：\n\n![](img/B18435_04_12.png)\n\n图 4.12：转换为联合...\n\n6.  在以下弹出窗口中（*图\
  \ 4.13*），用户可以通过拖放或使用 `通配符` 联合单独选择应作为联合一部分的所有数据表，后者将根据命名约定包含某个目录中的所有表——`*` 代表任意字符。`players*`\
  \ 将包含所有以 `players` 开头的文件。同理，`female*` 将包含所有以 `female` 开头的文件，而 `*` 将包含所有文件：\n\n![](img/B18435_04_13.png)\n\
  \n图 4.13：编辑联合...\n\n联合用于合并相似的数据，并将它们追加在彼此下方。它们最常用于多个数据文件的场景，其中每个文件具有不同的日期戳、不同的地区、不同的经理等。通过使用联合，您希望使数据集更完整。我们看到\
  \ Tableau 允许通过拖放以及右键单击初始数据源来进行联合。我们还讨论了使用拖放或通配符将一个或多个其他数据集合并的联合。*图 4.14* 展示了一个典型的联合示例：\n\
  \n![](img/B18435_04_14.png)\n\n图 4.14：联合\n\n让我们看看需要记住的几个方面：\n\n*   联合通过创建额外的行来追加数据。\n\
  *   联合应包含具有许多公共列的数据集。\n*   联合应仅用于存储在多个数据源中的结构相同的数据。\n*   使用联合时请留意性能。联合中的每个额外数据集都会增加\
  \ Tableau `VizQL` 的复杂性。\n\n既然您刚成为联合专家，是时候继续了解 Tableau 提供的下一项功能了：`混合`！混合可帮助您合并具有不同粒度级别的数据集。请考虑数据集之间的\
  \ `一对多` 关系。一个数据集每行有一个唯一键；另一个数据集每个键有多行。为了避免在第一个数据集中复制行，Tableau 部署了混合功能，这远在关系成为软件包一部分之前。\n\
  \n## 混合\n\n关系使得数据混合的必要性稍微降低，且可被视为遗留功能。但为了完整性以及针对较旧的 Tableau 版本（2020.2 以下），让我们在以下部分总结数据混合。简而言之，数据混合允许您将多个不同的数据源合并到单个视图中。理解以下四点将让您掌握数据混合的要点：\n\
  \n*   数据混合通常用于合并来自多个数据源的数据。尽管从 Tableau 10 开始，多个数据源之间可以进行联接，但在某些情况下，数据混合仍然是合并来自两个或更多来源数据的唯一可行选项。在以下部分中，我们将看到一个演示此类情况的实际示例。\n\
  *   数据混合需要一个共享维度。日期维度通常是混合多数据源的可行候选者。\n*   数据混合先聚合后匹配。另一方面，联接先匹配后聚合。\n*   数据混合不支持来自辅助数据源的维度。尝试使用辅助数据源的维度将导致视图中出现\
  \ `*` 或 `null`。此规则有一个例外，我们将稍后在 *添加辅助维度* 部分讨论。\n\n既然我们已经介绍了关系、联接和联合，我想稍微将您的关注点转移到工作簿内的数据结构上。您可能设置了完美的联接或联合，开始将字段拖放到工作簿画布上，使用了筛选器，使用了计算字段，却得到了一些意外的结果。Tableau\
  \ 的表现是正常的，只是不符合您的预期。为什么会这样？！操作顺序在这里至关重要。必须了解何时应用哪个筛选器以及这如何影响您的数据。因此，接下来的内容是：操作顺序。\n\
  \n## 探索操作顺序\n\n数据混合不就是 `左联接` 吗？这是新 Tableau 制作者经常问的问题。答案当然是否定的，但让我们探讨一下它们的区别。以下示例很简单，甚至有点轻松，但确实演示了因错误联接导致的错误聚合可能产生的深远后果。\n\
  \n我们将探索 Tableau 中聚合发生的顺序。这将帮助您更有效地使用混合和联接。\n\n对于此示例，我们将使用以下数据：\n\n![](img/B18435_04_15.png)\n\
  \n图 4.15：裤子和衬衫销售\n\n在这些表中，列出了两个人：`Tanya` 和 `Zhang`。在一个表中，这些人是 `销售人员` 维度的成员，在另一个表中，他们是\
  \ `销售助理` 维度的成员。此外，`Tanya` 和 `Zhang` 都卖出了 200 美元的裤子和 100 美元的衬衫。让我们探索 Tableau 连接这些数据的新方式，以更好地理解联接和数据混合。\n\
  \n当您查看与此练习关联的电子表格时，会注意到额外的列。这些列将在后续练习中使用。\n\n请执行以下步骤：\n\n1.  在属于本章的工作簿中，右键单击 `裤子`\
  \ 数据源，然后单击 `查看数据` 来查看数据。对 `衬衫` 数据源执行相同操作。\n2.  通过右键单击 `联接` 数据源并选择 `编辑数据源` 来打开它，并观察\
  \ `裤子` 和 `衬衫` 表之间使用 `销售人员/销售助理` 作为公共键的联接：\n\n![](img/B18435_04_16.png)\n\n图 4.16：联接\n\
  \n3.  在 `裤子` 工作表上，选择 `裤子` 数据源，将 `销售人员` 放在 `行` 货架上，将 `裤子金额` 放在 `文本` 货架上：\n\n![](img/B18435_04_17.png)\n\
  \n图 4.17：设置工作表\n\n\n\n\n\n## 对比联接与混合\n\n1. 在 `Shirts` 工作表中，选择 `Shirts` 数据源，将 `Sales\
  \ Associate` 放入 `Rows`（行）功能区，将 `Shirt Amount` 放入 `Text`（文本）功能区：\n\n![](img/B18435_04_18.png)\n\
  \n图 4.18：`Shirts`\n\n2. 在 `Join` 工作表中，选择 `Join` 数据源，将 `Salesperson` 放入 `Rows`（行）功能区。接着，双击\
  \ `Pants Amount` 和 `Shirt Amount` 将两者都放入视图：\n\n![](img/B18435_04_19.png)\n\n图 4.19：`Join`\n\
  \n3. 在 `Blend – Pants Primary` 工作表中，选择 `Pants` 数据源，将 `Salesperson` 放入 `Rows`（行）功能区，将\
  \ `Pants Amount` 放入 `Text`（文本）功能区：\n\n![](img/B18435_04_20.png)\n\n图 4.20：`Blend\
  \ – Pants Primary`\n\n4. 保持在同一工作表，从左侧数据源面板中选择 `Shirts` 数据源，然后双击 `Shirt Amount`。如果弹出错误消息，请点击\
  \ `OK`。\n\n5. 从菜单栏中选择 `Data`（数据），然后选择 `Edit Blend Relationships…`（编辑混合关系……）：\n\n\
  ![](img/B18435_04_21.png)\n\n图 4.21：`Edit Blend Relationships...`\n\n6. 在弹出的对话框中，将\
  \ `Pants` 选为 `Primary data source`（主数据源），将 `Shirts` 选为 `Secondary data source`（辅助数据源），然后点击\
  \ `Custom`（自定义）单选按钮，如图 4.22 所示，接着点击 `Add…`（添加……）。\n\n7. 在左侧列中选择 `Salesperson`，在右侧列中选择\
  \ `Sales Associate`。左侧列代表来自 `Primary data source`（主数据源）的数据，右侧列代表 `Secondary data\
  \ source`（辅助数据源）中所有可用的数据。\n\n8. 如果有其他链接，请全部移除，然后点击 `OK`。对话框中的结果应与下面截图中显示的内容一致：\n\
  \n![](img/B18435_04_22.png)\n\n图 4.22：`Blend Relationships`\n\n简要回顾一下我们迄今为止所做的工作：我们正在使用三个数据源：`Pants`、`Shirts`\
  \ 和 `Join`，其中 `Join` 由 `Pants` 和 `Shirts` 组成。我们还创建了一个以 `Pants` 为主数据源的混合，并使用 `Salesperson`\
  \ 和 `Sales Associate` 作为键将它们连接起来。\n\n不要被名称 `Blend Relationships`（混合关系）搞混。这与逻辑层关系无关。它只是弹出窗口的名称。\n\
  \n回到练习，继续以下步骤：\n\n9. 在 `Blend – Shirts Primary` 工作表中，选择 `Shirts` 数据源，将 `Sales Associate`\
  \ 放入 `Rows`（行）功能区，将 `Shirt Amount` 放入 `Text`（文本）功能区：\n\n![](img/B18435_04_23.png)\n\
  \n图 4.23：`Blend – Shirts Primary`\n\n10. 在同一工作簿中，选择 `Pants` 数据源，确保 `Salesperson`\
  \ 旁边的链接图标处于连接/红色状态，然后双击 `Pants Amount` 将其添加到视图中：\n\n![](img/B18435_04_24.png)\n\n\
  图 4.24：`Finalizing the worksheet`\n\n11. 将所有五个工作表放入一个仪表板中。根据需要进行格式化和排列。现在让我们在下面的截图中对比这五个工作表的结果：\n\
  \n![](img/B18435_04_25.png)\n\n图 4.25：`Comparison`\n\n在上面的截图中，`Join` 工作表的结果是预期值的两倍。为什么？因为联接首先匹配公共键（在本例中为\
  \ `Salesperson`/`Sales Associate`），然后聚合结果。在公共键上找到的匹配项越多，问题就越严重。如果在公共键上找到多个匹配项，结果将呈指数级增长。两个匹配项会导致平方结果，三个会导致立方结果，以此类推。这种指数效应在下面的截图中以图形方式表示：\n\
  \n![](img/B18435_04_26.png)\n\n图 4.26：`Join`\n\n另一方面，混合功能运行得更高效，但在混合能正常工作之前，我们必须编辑数据关系，以便\
  \ Tableau 能够使用 `Salesperson` 和 `Sales Associate` 字段连接这两个数据源。如果这两个字段名称相同（例如均为 `Salesperson`），Tableau\
  \ 会自动提供一个选项，使用这些字段在数据源之间进行混合。\n\n`Blend – Pants Primary` 和 `Blend – Shirts Primary`\
  \ 工作表的结果是正确的。不存在指数效应。为什么？因为数据混合**先**聚合两个数据源的结果，**再**在公共维度上匹配结果。\n\n在本例中，该公共维度即为\
  \ `Salesperson`/`Sales Associate`，如下截图所示：\n\n![](img/B18435_04_27.png)\n\n图 4.27：`Blending\
  \ results`\n\n在本练习中我们看到，联接可能会改变数据结构，因此使用时要小心，且必须非常清楚哪些列适合作为键。此外，在联接数据前后都要进行检查，这可以简单到统计行数并检查是否为预期结果。\n\
  \n混合有优点也有缺点；例如，添加维度就不是那么简单直接。但在下一节中，我们将探讨更多关于辅助维度的细节。\n\n## 添加辅助维度\n\n数据混合虽然对于连接不同的数据源特别有用，但也有局限性。最重要的局限性是：**数据混合不支持来自辅助数据源的维度**。此限制有一个例外；也就是说，**有一种方法可以添加来自辅助数据源的维度**。让我们进一步探讨这一点。\n\
  \n除了 `Salesperson`/`Sales Associate` 和 `Shirt Amount`/`Pants Amount` 之外，数据源中还有其他字段。我们将在本练习中引用这些字段：\n\
  \n1. 在本章关联的工作簿中，选择 `Adding Secondary Dimensions` 工作表。\n\n2. 选择 `Shirts` 数据源。\n\n\
  3. 为 `Material Type` 在 `Shirts` 和 `Pants` 数据源之间添加关系，执行以下步骤：\n\n    1. 选择 `Data`（数据），然后选择\
  \ `Edit Relationships`（编辑关系）。\n    2. 确保 `Shirts` 是主数据源，`Pants` 是辅助数据源。\n    3.\
  \ 选择 `Custom`（自定义）单选按钮。\n    4. 点击 `Add…`（添加……）。\n    5. 在左、右两列中均选择 `Material Type`：\n\
  \n![](img/B18435_04_28.png)\n\n图 4.28：`Custom` 混合关系\n\n    6. 点击 `OK` 返回视图。\n\n\
  4. 将 `Material Type` 放入 `Rows`（行）功能区。\n\n5. 选择 `Pants` 数据源，确保 `Data`（数据）面板中 `Material\
  \ Type` 旁边的链接图标处于激活状态，而 `Salesperson` 旁边的链接图标处于非激活状态。如果图标是灰色的断开链接，则未激活；如果是橙色的连接链接，则已激活：\n\
  \n![](img/B18435_04_29.png)\n\n图 4.29：`Shirts` 和 `Pants`\n\n6. 将 `Material Cat`\
  \ 放在 `Material Type` 之前，将 `Fastener` 放在 `Material Type` 之后，均置于 `Rows`（行）功能区，如下所示：\n\
  \n![](img/B18435_04_30.png)\n\n图 4.30：`Secondary dimensions`\n\n`Material Cat` 是来自辅助数据源的维度。数据混合不支持来自辅助数据源的维度。为什么在这种情况下它却生效了？有几个原因：\n\
  \n* `Material Cat` 和 `Material Type` 之间存在一对多关系；即 `Material Type` 维度的每个成员都**仅**与\
  \ `Material Cat` 维度的**一个**成员匹配。\n* 视图是基于 `Material Type` 而非 `Material Cat` 进行混合的。这一点很重要，因为\
  \ `Material Type` 的粒度低于 `Material Cat`。尝试基于 `Material Cat` 混合视图将无法启用 `Material Type`\
  \ 作为辅助维度。\n* 主数据源中 `Material Type` 维度的每个成员在辅助数据源中也都存在。\n\n\n\n\n\n`Fastener` 也是来自辅助数据源的一个维度。在*图\
  \ 4.35* 中，它在一个单元格中显示 `\\*`，从而表明 `Fastener` 没有按维度应有的方式工作；也就是说，它没有对数据进行切片，正如*第 1 章*、*回顾基础知识*中所讨论的。显示星号的原因是有多种\
  \ `Fastener` 类型与 `Wool` 相关联。`Button` 和 `Velcro` 之所以显示，是因为 `Acrylic` 和 `Polyester`\
  \ 在底层数据中各自只有一种 `Fastener` 类型。\n\n如果您使用混合，请确保您的主要原因是为了组合度量，并且您不需要在详细级别上使用维度。在创建仪表板之前了解这一点尤其有用，以便做好相应的准备。您的数据需要额外的准备（请查看*第\
  \ 3 章*、*使用 Tableau Prep Builder*），因为无论是联接还是混合都无法为您带来预期的数据结构。或者您可以利用搭建（scaffolding）技术，这是一种使用辅助数据源的技术——我们将在下一节讨论这一点。\n\
  \n## 介绍搭建技术\n\n搭建是一种通过混合引入第二个数据源，以重塑和/或扩展初始数据源的技术。搭建启用了一些功能，可扩展 Tableau 以满足原本极难甚至完全无法实现的可视化和分析需求。搭建技术在\
  \ Tableau 中的先驱 Joe Mako 讲述了一个故事，他在其中使用该技术仅用四个工作表就重建了一个仪表板。原来的仪表板未使用搭建技术，需要 80 个工作表，并需费力地逐像素对齐。\n\
  \n搭建技术所实现的众多可能性中，包括扩展 Tableau 的预测功能。Tableau 原生的预测功能有时因缺乏复杂性而受到批评。搭建技术可用于解决这一批评。\n\
  \n以下是步骤：\n\n1. 在与本章关联的工作簿中，选择 `Scaffolding` 工作表并连接到 `World Indicators` 数据源。\n2.\
  \ 使用 Excel 或文本编辑器，创建一个 `Records` 数据集。下面的两行表格代表了 `Records` 数据集的全部内容：\n   ![](img/B18435_04_31.png)\n\
  \   *图 4.31：Excel 文件*\n3. 将 Tableau 连接到该数据集。\n4. 为方便起见，可考虑使用 `Ctrl` + `C` 直接从 Excel\
  \ 复制数据集，并使用 `Ctrl` + `V` 直接粘贴到 Tableau 中。\n5. 在 Tableau 中创建一个 `Start Date` 参数，设置如下面屏幕截图所示。请注意屏幕截图中高亮显示的部分，您可以通过它们设置所需的显示格式：\n\
  \   ![](img/B18435_04_32.png)\n   *图 4.32：显示格式*\n6. 创建另一个名为 `End Date` 的参数，设置相同。\n\
  7. 在 `数据` 窗格中，右键单击刚创建的 `Start Date` 和 `End Date` 参数，然后选择 `显示参数`：\n   ![](img/B18435_04_33.png)\n\
  \   *图 4.33：显示参数*\n8. 根据需要设置开始和结束日期，例如 `2000` – `2027`：\n   ![](img/B18435_04_34.png)\n\
  \   *图 4.34：开始和结束日期*\n9. 选择 `Records` 数据源，并创建一个名为 `Date` 的计算字段，代码如下：\n   ```\n \
  \  IIF([Records]=1,[Start Date],[End Date])\n   ```\n10. 将 `Date` 字段放置在 `行` 货架上。\n\
  11. 右键单击 `行` 货架上的 `Date` 字段，然后选择 `显示缺失值`。请注意，现在显示了开始和结束日期设置之间的所有日期：\n    ![](img/B18435_04_35.png)\n\
  \    *图 4.35：显示缺失值*\n12. 创建一个名为 `Select Country A` 的参数，设置如下面屏幕截图所示。请注意，国家列表是通过 `从字段添加值`\
  \ 按钮添加的：\n    ![](img/B18435_04_36.png)\n    *图 4.36：从字段添加*\n13. 创建另一个名为 `Select\
  \ Country B` 的参数，设置相同。\n14. 创建一个名为 `Select Country A Forecast` 的参数，设置如下面屏幕截图所示：\n\
  \    ![](img/B18435_04_37.png)\n    *图 4.37：编辑参数*\n15. 创建另一个名为 `Select Country B\
  \ Forecast` 的参数，设置相同。\n16. 在 `数据` 窗格中，右键单击刚创建的四个参数（`Select Country A`、`Select Country\
  \ B`、`Select Country A Forecast` 和 `Select Country B Forecast`），然后选择 `显示参数`：\n \
  \   ![](img/B18435_04_38.png)\n    *图 4.38：显示参数*\n17. 确保 `World Indicators` 数据源中的\
  \ `Date` 字段显示了橙色的链接图标。这表明它被用作链接字段：\n    ![](img/B18435_04_39.png)\n    *图 4.39：链接*\n\
  18. 在 `World Indicators` 数据集中，创建以下计算字段：\n    | **计算字段名称** | **计算字段代码** |\n    |\
  \ --- | --- |\n    | `Country A Population` | \n    ```\n    IIF([Country] = [Select\
  \ Country A],[Population Total],NULL)\n    ```\n    |\n    | `Country B Population`\
  \ | \n    ```\n    IIF([Country] = [Select Country B],[Population Total],NULL)\n\
  \    ```\n    |\n19. 在 `Records` 数据集中，创建以下计算字段：\n    | **计算字段名称** | **计算字段代码** |\n\
  \    | --- | --- |\n    | `Actual/Forecast` | \n    ```\n    IIF(ISNULL(AVG([World\
  \ Indicators].[Population Total])),\"Forecast\",\"Actual\")\n    ```\n    |\n  \
  \  | `Country A Population` | \n    ```\n    IF [Actual/Forecast] = \"Actual\" THEN\
  \ SUM([World Indicators].[Country A Population]) ELSE PREVIOUS_VALUE(0)\n    *[Select\
  \ Country A Forecast] + PREVIOUS_VALUE(0)\n    END\n    ```\n    |\n    | `Country\
  \ A YOY Change` | \n    ```\n    ([Country A Population] - LOOKUP([Country A Population],\
  \ -1)) /\n    ABS(LOOKUP([Country A Population], -1))\n    ```\n    |\n    | `Country\
  \ B Population` | \n    ```\n    IF [Actual/Forecast] = \"Actual\" THEN SUM([World\
  \ Indicators].[Country B Population]) ELSE PREVIOUS_VALUE(0)\n    *[Select Country\
  \ B Forecast] + PREVIOUS_VALUE(0)\n    END\n    ```\n    |\n    | `Country B YOY\
  \ Change` | \n    ```\n    ([Country B Population] - LOOKUP([Country B Population],\
  \ -1)) /\n    ABS(LOOKUP([Country B Population], -1))\n    ```\n    |\n    | `Country\
  \ A-B Diff` | \n    ```\n    [Country A Population] - [Country B Population]\n \
  \   ```\n    |\n    | `Country A-B % Diff` | \n    ```\n    [Country A-B Diff]/[Country\
  \ A Population]\n    ```\n    |\n20. 在 `数据` 窗格中，右键单击 `Country A YOY Change`、`Country\
  \ B YOY Change` 和 `Country A-B % Diff`，然后选择 `默认属性` | `数字格式…` 以将默认数字格式更改为 `百分比`：\n\
  \    ![](img/B18435_04_40.png)\n    *图 4.40：默认属性*\n21. 选中 `Records` 数据源，将 `Actual/Forecast`、`度量值`\
  \ 和 `度量名称` 字段分别放置在 `颜色`、`文本` 和 `列` 货架上：\n    ![](img/B18435_04_41.png)\n    *图 4.41：预测设置*\n\
  22. 调整 `度量值` 货架，使显示的字段与下面的屏幕截图完全一致。此外，确保这些字段中的每一个的 `计算使用` 都设置为 `表格(向下)`：\n    ![](img/B18435_04_42.png)\n\
  \    *图 4.42：计算使用*\n\n那么，我们迄今为止实现了什么？我们创建了一个重复的数据结构，使我们能够在两个单独的列中比较两个国家，即使原始数据集中的数据在一列中。此设置允许我们提出更高级的问题。\n\
  \n\n\n\n# 预测人口增长\n\n为了演示这一点，让我们问一个问题：“印度人口何时将超过中国？”您可以根据需要设置参数——我选择了 0.45% 和 1.20%\
  \ 作为平均年增长率，但您可以随意选择认为最适合某个国家的任何参数。在*图 4.48*中，您可以看到，中国和印度的增长率分别为 0.45% 和 1.20% 时，到\
  \ 2024 年印度将拥有比中国更多的人口。您可以通过查看 `Country A Population` 和 `Country B Population` 列来观察这一点。橙色部分为预测数据，蓝色部分为我们数据集中的实际数据：\n\
  \n![](img/B18435_04_43.png)\n\n**图 4.43：预测仪表板**\n\n我们显然已经领先很多年了；如果我告诉您 2020 年中国人口为\
  \ 1,439,323,776，印度人口为 1,380,004,385，您能使用此仪表板算出 2012 年至 2020 年中国和印度的实际平均增长率吗？请在 Tableau\
  \ Public 上分享您的结果，并添加标签 `#MasteringTableau`！\n\n## 数据搭建\n\n本练习的一个关键在于数据搭建。数据搭建会生成数据源中不存在的数据。`World\
  \ Indicators` 数据集仅包含 2000 年至 2012 年的日期，显然 `Records` 数据集不包含任何日期。通过使用 `Start Date`\
  \ 和 `End Date` 参数并结合计算字段 `Date`，我们能够生成所需的任何日期集合。我们必须混合数据，而不是连接或联合，以保持原始数据源完好无损，并在\
  \ `World Indicators` 本身之外创建所有额外数据。\n\n实际的数据搭建发生在将 `Date` 字段放置在 `Rows` 架构上后，从其下拉菜单中选择\
  \ `Show Missing Values`（显示缺失值）时。这使得 `Start Date` 和 `End Date` 之间的每一年都能显示出来，即使底层数据中没有匹配的年份。*第\
  \ 6 章* *利用 OData、数据密化、大数据和 Google BigQuery* 将更详细地探讨与数据搭建非常相似的数据密化。\n\n## 计算字段深度解析\n\
  \n让我们更深入地了解一些计算字段，以更好地理解本练习中预测的工作原理：\n\n### 计算字段：`Actual/Forecast`\n\n```\nIIF(ISNULL(AVG([World\
  \ Indicators].[Population Total])),\"Forecast\",\"Actual\")\n```\n\n前面的代码用于确定 `World\
  \ Indicators` 数据集中是否存在数据。如果日期在 2012 年之后，则不存在数据，因此返回 `Forecast`。\n\n### 计算字段：`Country\
  \ A Population`\n\n```\nIF [Actual/Forecast] = \"Actual\" THEN SUM([World Indicators].[Country\
  \ A Population]) ELSE PREVIOUS_VALUE(0)\n*[Select Country A Forecast] + PREVIOUS_VALUE(0)\
  \ END\n```\n\n如果需要预测来确定值（即日期在 2012 年之后），则会执行这段代码的 `ELSE` 部分。`PREVIOUS_VALUE` 函数返回上一行的值，并将结果乘以预测值，然后加上上一行的值。\n\
  \n让我们看一下下表中的示例：\n\n| `Previous Row Value (PRV)` | | 1,000 |\n| --- | --- | --- |\n\
  | `Forecast (F)` | | 0.01 |\n| `PRV * F` | | 10 |\n| `Current Row Value` | | 1,010\
  \ |\n\n在 `Country A Population` 计算字段中，有一点很重要：预测方法非常简单：将上一期人口乘以给定的预测数字，然后汇总结果。在不改变逻辑整体结构的前提下，这段代码可以修改为更复杂的预测方法。\n\
  \n这些练习表明，通过一些其他技巧和方法，混合数据可以在您的数据项目中发挥巨大作用。最后，我们将总体讨论数据结构，以便您更好地理解 Tableau 为什么要这样做，以及如何实现您的可视化目标。\n\
  \n# 理解数据结构\n\n正确的数据结构不易定义。确实有一些基本规则。例如，长表数据通常优于宽表数据。包含许多列的宽数据集可能难以处理，而相同的数据如果采用长格式结构（列较少但行较多），通常更易于处理。\n\
  \n但情况并非总是如此！某些业务问题使用宽数据结构更容易回答。这才是关键所在。业务问题决定了正确的数据结构。如果一种结构能回答所有问题，那固然很好！不过，您的问题可能需要多种数据结构。Tableau\
