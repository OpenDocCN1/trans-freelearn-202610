  \n现在我们已经完成了数据连接的所有设置，可以继续进行关于数据加密的第一个真正练习。了解数据加密将帮助您在仪表板中看到意外的数据输出时进行故障排除，并将帮助您以正确的方式设置可视化以实现目标，而无需进行任何故障排除。\n\
  \n## 数据加密简介\n\n数据加密是 Tableau 中一个很大程度上未被记录的方面，在许多情况下非常有用，但如果意外遇到也会令人困惑。本节将提供关于数据加密的信息，旨在消除困惑，并为\
  \ Tableau 作者提供足够的知识，以便利用此功能。从最简单的形式来看，数据加密是在底层数据集中不存在的视图中添加数据点。这个主题乍一看可能有点令人困惑。\n\
  \n如果您想了解更多相关信息，请查看以下文章：[`towardsdatascience.com/data-densification-in-tableau-93c0a6bfcc5f`](https://towardsdatascience.com/data-densification-in-tableau-93c0a6bfcc5f)\n\
  \n为了开始理解数据加密，应定义四个术语：数据加密、稀疏数据、域补全和域填充。除了定义之外，每个术语都将通过示例进行详细讨论，以帮助加深理解：\n\n* **数据加密**：显示没有相应底层数据的数据点（例如，通过使用域补全或域填充）\n\
  * **稀疏数据**：缺少多个数据点的数据集（可想象成瑞士奶酪）\n* **域补全**：使稀疏数据变稠密——域补全是一种数据加密方法，它使用表计算来填补缺失的空白，当视图中有两个或更多维度时在\
  \ Tableau 中可用\n* **域填充**：向稀疏数据集添加数据点——域填充是一种数据加密方法，可通过区域分区（例如日期和存储桶维度）中的 **Show\
  \ Missing Values（显示缺失值）** 功能获得\n\n定义应该很清晰了；让我们继续进行实操练习。\n\n## 域补全\n\n数据加密有两种类型：域补全和域填充。**域补全**\
  \ 是两者中更复杂的一种，可以巧妙地部署以解决稀疏数据问题，但也可能意外出现并成为一个难以解决的挑战。\n\n掌握域补全需要对 **dimensions（维度）**\
  \ 和 **measures（度量）**——离散和连续——以及表计算中的 **partitioning（分区）** 和 **addressing（寻址）** 有很好的理解。如果您需要复习这些主题，请在继续下一个练习之前，查阅\
  \ *Chapter 1（第 1 章）* *Reviewing the Basics（回顾基础知识）* （关于 **dimensions** 和 **measures**）以及\
  \ *Chapter 5（第 5 章）* *Introducing Table Calculations（表计算简介）* （关于 **partitioning**\
  \ 和 **addressing**）。\n\n现在，让我们考虑如何部署域补全，何时有用，以及何时可能成为问题。\n\n### 部署域补全\n\n域补全可以通过多种方式激活，有时令人惊讶且困惑。调整货架上药丸的排列、在离散和连续之间切换维度、在\
  \ **Marks（标记）** 卡上切换视图类型、调整分区、寻址和其他更改都可能影响域补全的激活。虽然本书不会涵盖每种激活可能性的示例，但回顾典型的域补全场景应该会有所帮助。\n\
  \n#### 在交叉表中激活域补全\n\n以下步骤将引导您完成一个域补全的示例。\n\n导航至 [`public.tableau.com/profile/marleen.meier`](https://public.tableau.com/profile/marleen.meier)\
