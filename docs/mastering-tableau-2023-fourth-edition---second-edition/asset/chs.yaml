  \n## Tableau 与大数据\n\n也许大数据的第一个挑战是给它一个恰当的定义。这是一个被广泛使用以至于几乎失去意义的术语。例如，有些人可能将超过 1,048,576\
  \ 行的数据称为大数据（这是 Microsoft 365、Excel 2019、Excel 2016、Excel 2013、Excel 2010 和 Excel\
  \ 2007 的行限制），而另一些人则仅将该术语应用于 PB 级的数据集。维基百科上找到的定义（[`en.wikipedia.org/wiki/Big\\_data`](https://en.wikipedia.org/wiki/Big_data)）非常宽泛，足以涵盖这两个例子。\n\
  \n确实，将仅超过 Excel 行限制的数据视为大数据可能过于简单化；不过，从将 Excel 作为传统数据处理应用程序的个人角度来看，上述定义是合适的。\n\n\
  谈论大数据离不开并行处理。对于 Tableau 和处理大数据而言，了解 IT 团队为并行处理设置的分区非常重要。例如，可能是 `YEAR`、`MONTH` 和\
  \ `DAY` 列。如果你使用那些在数据库中也用作分区的列，你的 Tableau 仪表板性能将比在数据集中查询随机字段好得多。因此，首先设置筛选器——最好是分区。然后，在数据子集上构建仪表板。完成后，加载你需要的数据并再次检查性能。关于性能的更多信息见*第\
  \ 13 章*、*提升性能*。\n\n许多组织选择基于云的解决方案，如 AWS、Azure 或 GCP。在 **Google Cloud Platform**\
  \ (**GCP**) 中，你将找到 BigQuery，我们将在下一个练习中使用它。\n\n## 使用 Google BigQuery 构建可视化\n\n一种大数据解决方案是来自\
  \ Google 的 BigQuery，此外还有来自 Amazon、阿里云、Azure、IBM 等提供商的许多其他方案。对于本书的这一部分，我们随机选择了 BigQuery，如果你有\
  \ Gmail 账号，可以免费试用。其他提供商也提供免费层级账户。既然我们在云端工作，就不需要安装任何东西，这使得 Google Cloud 成为本书练习的良好平台。\n\
  \n要使用 Google BigQuery 构建可视化，你首先需要设置对 BigQuery 的访问权限。以下练习将指引你走向正确的方向。一旦你设置了对 BigQuery\
  \ 的访问权限，就能连接到 BigQuery 示例数据集。在练习的剩余部分，你将在连接到 BigQuery 的情况下构建可视化。\n\n假设你有良好的网络连接，性能可能会超过你使用同等大小的提取数据源本地副本时的体验。\n\
  \n让我们看看如何在 Tableau 仪表板中使用 Google BigQuery：\n\n1.  登录你的 Google 账号，导航到 [`cloud.google.com/bigquery/`](https://cloud.google.com/bigquery/)，并按照提供的说明免费试用\
  \ `BigQuery`。\n\n2.  在与本章关联的工作簿中，导航到 `BigQuery` 工作表。\n\n3.  按 `Ctrl` + `D` 连接到数据源。在弹出的窗口中，选择\
  \ `Google BigQuery`，并在提示时提供你的 Gmail 登录信息。\n\n4.  在**数据源**页面，选择你在 GCP 注册时设置的任何计费项目。在我的例子中，它叫\
  \ `BigDataProject`。\n\n5.  然后选择 `publicdata` 项目、`samples` 数据集和 `natality` 表。此数据对所有人公开，因此你也应该能看到它。\n\
  \n6.  `natality` 表提供了 1969 年至 2008 年美国的出生人口统计数据：\n\n![](img/B18435_06_29.png)\n\n\
  图 6.29：BigQuery\n\n7.  在**数据**窗格中，双击 `natality(Count)`。\n\n8.  从**数据**窗格中，将 `Month`\
  \ 拖到**列**货架上，并将其设置为**离散型**。\n\n9.  右键单击 *y* 轴 `Count of natality`，选择**编辑轴**。取消勾选**包含零**。\n\
  \n10. 按需格式化。此可视化显示了 1969 年至 2008 年每个月出生的婴儿数量：\n\n![](img/B18435_06_30.png)\n\n图\
  \ 6.30：BigQuery 可视化\n\n了解大数据引擎所依据的分区字段将在面对性能问题时提供很大帮助。例如，如果你的数据按 `Year` 分区，请始终尝试在筛选器和计算中利用此字段。*第\
  \ 13 章*、*提升性能*包含有关此主题的更多信息。\n\n正如你所见，BigQuery 让我们能够快速轻松地可视化包含数百万条记录的数据集。\n\n# 摘要\n\
  \n我们本章开始时讨论了数据补全，并发现了两种类型的数据补全：域补全和域填充。在回顾这两种类型的数据补全时，我们了解了如何部署每一种、何时有用以及何时可能有问题。接下来，我们通过一个示例演练探索了大数据，展示了如何使用\
  \ Tableau 连接到 Google BigQuery。\n\n在下一章中，我们将探索另一种功能：详细级别计算。虽然表计算仍然是日常 Tableau 使用的重要组成部分，但我们将发现详细级别计算如何轻松完成以前只能通过复杂的表计算才能实现的任务。\n\
