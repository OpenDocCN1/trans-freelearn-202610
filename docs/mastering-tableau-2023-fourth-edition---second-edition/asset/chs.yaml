  \n## 部署域填充\n\n您可能还记得，部署域补全的方法之一是 `Analysis` | `Table Layout` | `Show Empty Rows`/`Columns`（分析\
  \ | 表格布局 | 显示空行/列）。域填充也是如此，如下面的练习所示。本练习演示了如何开启和关闭域填充：\n\n1.  在与本章关联的工作簿中，选择 `Data`\
  \ | `New Data Source`（数据 | 新建数据源），并连接到随 Tableau 附带的 `Sample` `Superstore`（示例超市）Excel\
  \ 工作簿。它位于 `My Tableau Repository` | `Datasources+` 中。\n\n2.  在生成的 `Data Source`（数据源）页面实例中，双击\
  \ `Orders and Returns`（订单和退货）。这将在 `Order ID`（订单 ID）字段上创建一段关系。\n\n3.  将数据源命名为 `Superstore\
  \ – Returns`（超市 - 退货）。\n\n4.  导航到名为 `DP` `–` `Show` `Missing` `Values` 的工作表，并选择刚刚创建的\
  \ `Superstore –` `Returns` 数据源。\n\n5.  将 `Ship Mode`（发货方式）和 `State`（州）放置在 `Rows`（行）功能区上。接下来，将\
  \ `Region`（区域）放置在 `Filters`（筛选器）功能区上并选择 `West`（西部）。最后，将 `SUM(Sales)`（销售额总和）放置在 `Text`（文本）功能区上。请注意，例如，`Wyoming`（怀俄明州）仅出现在\
  \ `Standard Class`（标准类）发货方式下：\n\n![](img/B18435_06_19.png)\n\n图 6.19：显示缺失值\n\n1.\
  \  选择 `Analysis` | `Table Layout` | `Show Empty Rows`（分析 | 表格布局 | 显示空行）：\n\n![](img/B18435_06_20.png)\n\
  \n图 6.20：显示缺失值 II\n\n此时您可以看到域填充的实际效果。所有在某个年份或某个区域拥有值的州现在都显示出来了，即使是那些被 `Region: West`（区域：西部）筛选掉的州。现在，筛选器仅移除\
  \ `Sales`（销售额）数值，但会显示所有可能的州。\n\n之所以必须指向实时数据源（例如随 Tableau 附带的 `Superstore` 实例），是因为在这种情况下使用提取不会激活域填充，即使选择了\
  \ `Analysis` | `Table Layout` | `Show Empty Rows`。一旦您激活提取，该功能就会丢失。\n\n## 域填充的实用性\n\
  \n在处理存在间隙的日期时，域填充通常很有用。当某些日期有关联值而其他日期没有时，就会出现这种间隙。正如下面的示例所示，在 `Superstore` 数据集中，退货并非每天都会发生。由于显示带有间隙日期的可视化可能会令人困惑，因此填补这些间隙可能会有所帮助。\n\
  \n### 使用域填充填补日期间隙\n\n我们现在将尝试填补日期间隙：\n\n1.  在与本章关联的工作簿中，导航到名为 `DP – Filling Date\
  \ Gaps` 的工作表。\n\n2.  选择在上一个练习中创建的 `Superstore – Returns` 数据源。\n\n3.  将 `MDY(Order\
  \ Date)`（月/日/年(订单日期)）的离散实例放置在 `Columns`（列）功能区上，并将 `Sales`（销售额）放置在 `Rows`（行）功能区上。请注意，视图中的每个标记间距相等，无论日期之间的时间跨度有多长：\n\
  \n![](img/B18435_06_21.png)\n\n图 6.21：填补日期间隙\n\n1.  右键单击 `MDY`(`Order Date`)，然后选择\
  \ `Show Missing Values`（显示缺失值）。\n\n2.  右键单击 `Rows` 功能区上的 `SUM(Sales)`，然后选择 `Format`（格式）。在生成的\
  \ `Format` 窗口中，选择 `Pane`（窗格）选项卡，并选择 `Marks: Show at Default Value`（标记：按默认值显示）：\n\
  \n![](img/B18435_06_22.png)\n\n图 6.22：填补日期间隙 II\n\n请注意，标记之间的距离现在基于日期之间的时间长度。所有没有值的日期均显示\
  \ `Sales` 值为零。\n\n## 域填充的问题\n\n由于域填充可以通过 Tableau 中的特定命令（即 `Show Missing Values`\
