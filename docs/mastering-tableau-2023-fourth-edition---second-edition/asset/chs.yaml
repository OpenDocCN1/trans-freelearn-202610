  ## 结语


  这是 Tableau 数据治理领域的最后一个示例。这是一个巨大的主题，远远超出了 Tableau 的范围，因此我们只是通过了解 GDPR（众多数据法规之一）、Tableau
  中的数据治理功能，最后一些实际应用，仅仅触及了表面。这个主题真值得单独写一本书，但我简要地在这里提及它，是为了分担责任，因为即使您作为一名 Tableau 开发人员，也有责任并能在保护数据安全方面发挥作用。希望最后一章能给您足够的思考素材，让您在开发精美仪表板时开始更多地关注数据治理。


  现在我们已经读完了这本书，回顾一下我们的旅程：从将数据加载到 Tableau、创建第一个可视化、执行第一个函数开始。我们接着熟悉了详细级别和表计算，了解了 Tableau
  Prep Builder、Tableau Server 和通用可视化最佳实践，最后一轮我们学习了高级分析并利用 Tableau 编程工具集成的力量。


  这留给我只有一个问题：您的下一个 Tableau 项目会是什么？欢迎在 Tableau Public 上分享，别忘了添加标签 `#MasteringTableau`。我想祝贺大家参与并投入到这个学习过程中！无论您有更多问题、意见或反馈，欢迎联系我或
  Tableau 社区。祝您在个人 Tableau 职业生涯中取得巨大成功。


  愉快地使用 Tableau！


