- '# 表计算简介


  Tableau 中表计算这一主题极其丰富且深奥，仅此一项就足以成为一整本书的主题。探索每个表计算函数可用的各种选项以及应用表计算的各种方式，是一项有趣且收获颇丰的工作。当你回顾本章中的示例时，你无疑会遇到可应用于日常工作中的技术；然而，你可能难以理解为什么其中一些技术有效。编写本章旨在提供关于表计算的思维方式，这将有助于你掌握这个迷人主题的旅程。在此过程中，也将探讨一些实际示例。


  在为本章审查的数十篇博客、论坛帖子、会议演讲、文章和白皮书中，Jonathan Drummy 的博客文章（[`drawingwithnumbers.artisart.org/at-the-level-unlocking-the-mystery-part-1-ordinal-cals/`](http://drawingwithnumbers.artisart.org/at-the-level-unlocking-the-mystery-part-1-ordinal-cals/)），《At
  the Level – Unlocking the Mystery Part 1: Ordinal Calcs》（在层级上——解开谜团第 1 部分：序数计算），对于理解分区和寻址的各种细微差别——表计算的
  DNA——最为清晰且富有洞见。在本章中，我们将讨论以下主题：


  * 分区和寻址方向

  * 定向和非定向寻址

  * 探索每个独特的表计算函数

  * 函数的应用


  让我们深入细节，从表计算的一般定义和两个随之而来的问题开始本章，我们将在本章结束时回答这些问题。


  ## 分区和寻址方向


  正如*第 1 章* *回顾基础知识*中所讨论的，计算字段可分为行级、聚合级或表级。对于行级和聚合级计算，底层数据源引擎会完成大部分（如果不是全部）计算工作，Tableau
  仅负责可视化结果。对于表计算，Tableau 同样依赖底层数据源引擎和机器上的可用 RAM 来执行计算任务；然而，在该工作完成并返回数据集后，Tableau 会在渲染结果前执行额外的处理。


  让我们看一下表计算的定义，如下所示：


  表计算是在缓存数据集上执行的函数，该数据集是 Tableau 向数据源发起查询的结果生成的。


  让我们考虑一下关于上述定义中提到的缓存中的数据集的几点。


  此缓存不仅仅是查询返回的结果。Tableau 可能会调整返回的结果。我们将在*第 6 章* *利用 OData、数据填充、大数据和 Google BigQuery*
  中探讨这一点；Tableau 可能会通过数据填充来扩展缓存，但通常这是用户驱动的。在表计算术语中，缓存称为**分区**。


  考虑缓存的结构非常重要。缓存中的数据集是你工作表中使用的表，和所有表一样，由行和列组成。这对表计算尤为重要，因为表计算可能会在沿缓存移动时进行计算。每当缓存结构发生变化时，`previous_value()`
  表计算都会改变，因为它会检索当前值之前的值，而这具有很强的主观性。是按日期、数值还是字母顺序的“之前”？这取决于你通过寻址和分区来告诉 Tableau 如何构建缓存。


  大多数表计算都需要考虑缓存结构。这种表计算称为**定向**计算。或者，表计算可能基于整个缓存进行计算，而不考虑寻址和分区。例如，表计算 `total()` 将计算总值，该值不会随缓存顺序的改变而改变。另一个是
  `size()`、`script_` 和 `model` 函数。这种类型的表计算称为**非定向**计算。




  请注意，在 Tableau 文档中，缓存中的数据集通常被称为分区。本章的结构旨在提供一个简单的模式，以便理解表计算。


  *函数介绍* 部分探讨每个独特的表计算函数。*函数应用* 部分探讨表计算如何通过分区和寻址维度应用到视图中。


  # 定向和非定向寻址


  我们将首先列出不同的表计算函数来开始本节。


  Tableau 提供了广泛的表计算，但如果我们将考虑范围缩小到表计算函数的独特组别，我们会发现只有 11 个：


  | 表计算 |

  | --- |

  | `LOOKUP` |

  | `PREVIOUS VALUE` |

  | `RUNNING` |

  | `WINDOW` |

  | `FIRST` |

  | `INDEX` |

  | `LAST` |

  | `RANK` |

  | `SIZE` |

  | `TOTAL` |

  | `SCRIPT & MODEL` |


  正如*分区和寻址方向*中所述，表计算函数作用于缓存，因此根据表计算的类型（定向或非定向），如果缓存数据发生变化，结果可能会改变。在以下练习中，我们将看到定向和非定向表计算函数的实际运作。


  让我们更仔细地看看定向和非定向表计算：


