  \ 中的以下内容：\n\n\n\n\n定义计算分组方式的维度（即定义计算所针对的数据范围）称为**分区字段**（`partitioning fields`）。表计算会在每个分区内单独执行。剩余的维度（即表计算所依据的维度）称为**寻址字段**（`addressing\
