  \n图 7.11：最终演练场\n\n通过遵循前面的步骤，我们现在可以构建各种表格来比较不同的 LOD，因为参数将允许我们选择不同的维度以及包含 Tableau\
  \ `FIXED` 和 `EXCLUDE` 函数的计算字段。我们现在将继续使用演练场，并解释 LOD 如何更改计算字段。\n\n## 理解 FIXED\n\n\
  现在演练场环境已准备就绪，让我们构建场景以更好地理解 `FIXED` 和 `EXCLUDE` 函数。我们将从 `FIXED` 开始。`FIXED` LOD 仅考虑其指向的维度。因此，当固定在某个维度上时，视图中的所有其他维度（如果有）都将被忽略。当\
  \ `FIXED` LOD 在未定义任何维度的情况下使用时，结果将是一个忽略视图中所有维度（如果有）的计算。\n\n让我们直接进入练习亲自验证一下：\n\n1.\
  \ 使用前面描述的工作表，按如下所示设置参数：\n\n![](img/B18435_07_12.png)\n\n图 7.12：第一个示例\n\n我们通过不同参数实现的效果是：显示每个\
