  ## 示例 1、4 和 8 的分析


  现在，让我们更详细地考虑一下此处提出的一些可能性。某些选项是相同的。事实上，在九个选项中，只有四个是唯一的。让我们来看看示例 1、4 和 8，它们都有相同的最终结果。这是否意味着它们完全相同？选项
  1 和 4 是相同的。然而，选项 8 略有不同。要理解这一点，请注意选项 8 的表计算对话框中的说明：


  ![](img/B18435_05_29.png)


  图 5.29：索引


  示例 8 中的说明显示为 `Results are computed along Ship Mode, Category`（请参阅 `Figure 5.29`）。示例
  1 说明框中的文本与示例 4 相同：`Results are computed along Ship Mode for Category`，这可以翻译为分区 `Category`
  和寻址 `Ship Mode`。这种翻译与示例 1 中实际完成的分区/寻址设置相同。因此，示例 1 和 4 是相同的。但示例 8 的细微差别是否意味着存在实际差异？没有！


  ## 示例 6 详细分析


  示例 6 乍看之下可能令人困惑。为什么会出现这种奇怪的编号序列？因为寻址维度的顺序与 `Rows` 架上的维度顺序不同。寻址顺序是 `Ship Mode`、`Category`。`Rows`
  架上的顺序是 `Category`、`Ship Mode`。只需交换 `Rows` 架上 `Category` 和 `Ship Mode` 的位置，并观察编号序列的变化，即可消除任何困惑：


  ![](img/B18435_05_30.png)


  图 5.30：切换维度


  示例 6 有实际用途吗？有的。有时可能需要按与架上列出的顺序不同的顺序来寻址维度。但这通常不是这种情况。这引出了我们的下一条准则：


  > 当为表计算寻址多个维度时，寻址顺序通常将反映 `Rows` 和/或 `Columns` 架上维度的顺序。


