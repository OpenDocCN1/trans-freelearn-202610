- '# Tableau 2023 精通指南（第 4 版 - 第 2 版）



  '
- "# 序言\n\n## Christina Stathopoulos 作序\n\n在历史的大部分时期，我们都因缺乏信息或数据而苦恼，无法借此理解我们的世界。即使随着计算机和互联网的出现，很长一段时间里，我们仍依赖抽样和小数据集来估算大趋势。但此类估算伴随着风险，首当其冲的就是高度的不确定性。如今，形势逆转，情况恰恰相反——我们拥有过多的信息、过多的数据，正淹没在数字内容的汪洋大海中。大数据集意味着不再需要估算。我们触手可及地掌握了对实际总体趋势的深入理解，但当试图从过剩的数据中挖掘有意义的模式和洞见时，这可能会让人不知所措。由于技术进步和社会变革的交汇，特别是互联网和智能手机使用的全球增长，我们掌握的数据比我们懂得如何处理的还要多。随着世界变得日益互联，线上世界与线下世界的融合程度加深，这种数据激增预计将进一步加速。在这些变化中，企业发现自己被迫理解手头的所有数据，努力学习如何将数据作为其差异化因素，但我们反复自问的问题是：“*怎么做？*”\n\
  \n恰当的商业智能和分析技术就是答案。如果做得正确，数据可以逐步被提炼为有价值的趋势和洞见。Tableau 是我所谓的“数据解谜”领域的市场领导者。凭借其直观的界面和强大的功能，Tableau\
  \ 让个人和组织都能将复杂的数据集转化为可执行的智能。在《精通 Tableau 2023》中，作者兼知名 Tableau 专家 Marleen Meier 将带您了解实施\
  \ Tableau 高级功能所需的一切知识。\n\n我最近在她目前的居住地新加坡与 Marleen 共度时光，除其他数据话题外，我们还讨论了她关于《精通 Tableau》最新版的工作。我对她对该工具的热情以及她致力于让出版物紧跟最新功能和能力的决心印象深刻。考虑到数据领域持续快速变化，而\
  \ Tableau 也随之调整和扩展以满足市场需求，这绝非易事。本书在商业智能领域出色地应对了最新的 Tableau 产品。从封面到封底，浓缩在 16 章中，您将通过可视化解释和动手实践的真实案例，掌握\
  \ Tableau 的基础主题。您将被引导使用 Tableau Server、Prep 和 Desktop 中的全新功能，并通过 Python 和 R 集成、地理空间分析（这是我个人最喜欢的，因为我曾在\
  \ Waze 从事这方面的工作！）、时间序列分析等高级功能接受挑战。\n\n作为一名同行数据专业人士、讲师和该领域的领军声音，分析，尤其是可视化分析，对我而言至关重要。亲身体验低代码和无代码工具普及数据使用的进程，令人着迷。仅需几次点击或简单的拖放操作，您今天就能用\
  \ Tableau 完成令人难以置信的事情，而这些任务在过去需要大量代码和一个开发团队。我想不出比这本书更好的掌握 Tableau 的方式了。正如您即将发现的，作者\
  \ Marleen Meier 通过详细阐述每个概念——从基础仪表板到高级机器学习技术——帮助简化了一个人充分利用 Tableau 潜力的能力。在接下来的页面中，您将作为高级用户更自如地驾驭\
  \ Tableau。希望您像我一样享受这本书，并在未来创建和开发自己的 Tableau 项目时，将这宝贵的资源留在身边。\n\n*Christina Stathopoulos*\n\
  \n*Dare to Data 创始人*\n\n## [Author Name] 作序\n\n我想知道您通往这本书、通往 Tableau 的旅程是怎样的？您是否被要求用数据做些什么？构建仪表板？设计信息图表？访问工作中的数据库？监控业务\
  \ KPI？发掘多个数据集及其变量之间的联系？也许您是一名想了解如何做到以上所有的学生，正在通往资格认证的道路上，又或许您是正在寻找新工作或新职业的个人？\n\n\
  更多地了解数据是许多新旧职业机会的基石。而且这不仅关乎工作：通过数据收集和连接人一直很重要。甚至在算盘、纸张，随后是计算机接管从应用 A 到应用 B 的流程管理（这对商业、体育、社交以及实际上整个现代生活都至关重要）很久以前，我们的石器时代祖先就已在使用计数棒来记录和共享信息。\n\
  \n移动数据（及其所代表的信息）只是问题的一半。以有益于他人的方式共享数据是另一半。获益通常需要丰富其应用所在的人文背景。面对不断变化的现代数据基础设施，寻找背景并务实地交付价值，在我看来，是人们转向\
  \ Tableau 的最大原因。\n\n我自己的数据之旅始于 AI 和机器学习，随后是跨数百个网站改善客户体验。在那些 Dotcom 年代，我花费大量时间处理业务问题，将其转化为数据问题，然后寻找针对不同企业的不同解决方案。这意味着在直接根据这些发现采取行动，或以鼓励他人采取行动的方式呈现它们之前，先熟悉数据、数据结构和流程，以及用户界面和体验。\n\
  \n\n\n\n# 序言\n\n初次使用 Tableau 时，显而易见，它的设计初衷是“帮助人们查看和理解数据”，这正是 Tableau 的企业座右铭。它不仅仅是数据流向的可视化终点（正如许多认为\
  \ Tableau “只是另一个仪表板工具”的人所理解的那样）。它的设计旨在鼓励与数据交互，并让人们找到新问题的答案，而不仅仅是作为一个供观察的静态表格可视化。它利用了许多视觉感知原理，鼓励人们发现自己的模式、观察自己的异常值，并用自己的眼睛查看存储在任何位置的底层数据，而无需了解编码或现代数据库管理知识。\n\
  \n不久后，我认识了本书作者 Marleen。Marleen 正在弥合深耕数据/数据科学的人员与其业务合作伙伴之间的鸿沟。面临的几个挑战是：“如何让业务团队更贴近数据科学团队，并最终贴近业务数据？如何以业务合作伙伴能够理解和应用的方式提供\
  \ AI 结果和模型的背景？”显然，Marleen 能够胜任弥合这一鸿沟的任务，而借助 Tableau，她找到了一款能够实现这一目标的工具。\n\n现在，我们有了这本书可以共同阅读，并在未来作为参考。无论你打算如何使用它，无论你希望达成什么成果，这本书都将帮助你掌握\
  \ Tableau，更重要的是，掌握让任何数字数据对我们这些“模拟人类”更加有效的艺术。本书提供了关于数据访问和处理等线性任务的建议，并延伸至极其非线性的问题解决过程，以及如何有效地与他人沟通数据。\n\
  \n面对新问题时，往往不清楚从何入手。我应该采取的第一步是什么？首先定义问题总是最好的，紧接着会问：“但数据表明了什么？”随着你从现有数据所展示的世界中了解更多，最初的问题陈述往往会发生变化。本书中的方法无论你使用什么工具都将对你大有裨益，而在使用\
  \ Tableau 时，你会体会到在解决问题和数据沟通中所需的敏捷性。\n\n通过阅读本书，我期望你将重新认识如何发掘解决方案，以新获得的信心逐步攻克数据任务，并准备好以同事、朋友和家人能够理解的可视化方式展示你的发现。欢迎阅读\
  \ *《精通 Tableau》*。\n\n*David Sigerson*\n\n*Tableau 区域现场首席技术官*\n\n# 贡献者\n\n# 关于作者\n\
  \nMarleen Meier 是一位成就卓著的分析师和作家，对统计学和数据充满热情。Marleen 运用传统方法论和机器学习、AI 等更现代的方法，致力于挖掘有意义的洞见。\n\
  \n目前担任 ABN AMRO Clearing 的亚太区数据卓越中心负责人，Marleen 处于创新前沿，在全球金融环境中实施数据驱动策略。Marleen 专注于风险分析、数据可视化、数据质量和数据管控，不断挑战现状，重新定义最佳实践。她曾在德国、荷兰、美国和新加坡等多个国家生活和工作，这使她能为工作带来多元化和全球化的视角。\n\
  \nMarleen 的奉献精神、专业知识和拓展数据分析边界的承诺，使她成为该领域的权威专家。通过写作和演讲，她旨在赋能个人和组织，释放其数据资产的全部潜力。\n\
  \n纪念 Leo。我们非常想念你。\n\n# 关于审阅者\n\nRuchi Arora 是一位技术和数据高管，拥有转型和扩展业务的丰富经验。她拥有独特的问题解决能力，并在\
  \ AI/ML、分析和数据产品工作方面经验丰富，持续实现营收增长、提高运营效率并让客户满意。\n\nRuchi 以软件开发人员身份起步，后转向 AI 数据管理和分析领域。她曾担任多家科技巨头和财富\
  \ 500 强企业的数据负责人。Ruchi 也是一位知名演讲者。她以解决复杂业务问题和协助行业完成数字化转型、RPA 和云迁移为荣。\n\n此外，Ruchi 是多元化、公平性与包容性的倡导者，也是众多科技和数据领域女性社区的活跃成员。\n\
  \nRuchi 是 Women in Data 的志愿者，负责西雅图分会，同时也是 Bellevue Children’s Academy 家长协会董事会主席。\n\
  \nRuchi 毕业于哈佛商学院领导力与综合管理项目，并拥有计算机应用硕士学位。\n\nJayen Thakker 在分析领域拥有 18 年经验，是 Tableau\
  \ 和 Cognos Analytics 的资深专家。他亲自为客户和内部团队举办了近 100 场关于这些平台的培训，展示了其专业知识，进一步巩固了其作为行业受信任领导者的地位。Jayen\
  \ 擅长获取新客户和推动追加销售，同时担任企业解决方案架构师，为企业打造高效的分析解决方案。作为 BI 实践经理，他领导一个由 80 多名专业人士组成的精干团队，在\
  \ BI 和数据仓库领域成功交付了数百万美元的项目。凭借对卓越的追求、对创新的热情和对知识分享的承诺，Jayen 持续在分析行业产生重大影响。\n\n我想借此机会感谢我挚爱的家人在我审阅本书期间（以及其他时候）给予我的支持。他们是我力量和耐心的源泉。谢谢你们，亲爱的家人。\n\
  \n还有一位相信我能胜任本书审阅工作的人是 Muthukumar S M，他引荐我获得此机会，并从一开始就相信我。非常感谢你，Muthu。\n\n# 在 Discord\
