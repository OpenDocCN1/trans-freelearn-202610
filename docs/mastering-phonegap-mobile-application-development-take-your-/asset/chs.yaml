  *   <http://blog.placeit.net/make-google-play-screenshots/>\n\n## 结语\n\n恭喜！在本章中，我们涵盖了大量信息，从创建开发者账户到为发布签名应用并将其提交到各个应用商店。希望您的应用现在能让用户享受，并获得好评。\n\
