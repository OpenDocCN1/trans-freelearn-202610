  - PhoneGap: <http://phonegap.com>\n- Git: <http://git-scm.com/downloads>\n\n## 谁应该阅读本书\n\
  \n如果您是使用 Cordova 创建混合移动应用的开发者，并希望通过包含以下任何功能将应用提升到新的水平，那么本书适合您：\n\n- 自动化代码转换、语法检查和构建步骤\n\
  - 更高效地打包代码，并使用 `npm` 包加速开发\n\n\n\n# 前言\n\n## 您将学到什么\n\n*   使用响应式设计技术，以便您的应用能适当响应不同的外形规格和方向\n\
