- "# PhoneGap 移动应用开发高级指南：将您的 PhoneGap 体验提升到新高度，构建引人入胜的真实世界应用\n\n\n![封面](img/cover.jpg)\n\
  \n# 作者简介\n\n## 凯里·肖茨\n\n**凯里·肖茨** 从事计算机工作已近 25 年。她对技术和编程的热爱始于接触第一台电脑：Commodore 64。她在大学期间获得了计算机科学学位，随后成为一名软件测试工程师。此后，她担任了数年的\
  \ Oracle 数据库管理员。现在，她作为一名技术顾问工作，为客户创建、实施和维护定制应用程序（包括桌面和移动端）、网站、图形和标志等。您可以在她的网站 (`http://www.photokandy.com/`)\
  \ 上找到她的博客文章，她也在 PhoneGap 的 Google Groups 中活跃。工作之余，她喜欢摄影、音乐和养鱼。她是 Packt Publishing\
  \ 出版的多本书籍的作者。\n\n首先感谢我的家人给予的巨大支持，即使是在深夜敲击键盘的时候。也感谢那些让 PhoneGap 和 Cordova 成为如此优秀工具的人们，以及在论坛上支持它们的人们。特别感谢本书的技术审阅者——你们太棒了！最后，感谢\
  \ Packt Publishing 及其编辑团队，确保一切完美呈现。\n\n## 罗里·斯坦利\n\n**罗里·斯坦利** 是来自英国斯塔福德郡的资深 Web\
  \ 开发者，白天为客户构建企业应用，业余时间则从事有趣的项目 (`http://www.rstandley.co.uk`)。Rory 从 PhoneGap 1\
  \ 版本就开始使用，在 iOS 和 Android 上创建电子商务应用，并乐见 PhoneGap 发展至今。\n\n## 埃迪·维布鲁根\n\n**埃迪·维布鲁根**\
  \ 是许多 PhoneGap 插件的作者。过去几年里，他创建了 SocialSharing、Calendar 和 Toast 等流行插件。最初作为开源爱好的项目，最终促使他与\
  \ Telerik 合作，旨在提升 Cordova 插件生态系统的质量。如今，Eddy 是 Telerik 验证插件市场 (`http://plugins.telerik.com`)\
  \ 的维护者。最近，Eddy 参与了多个 PhoneGap 应用的开发。其中最具雄心的是一家中型荷兰银行的在线银行应用。该应用在三个不同平台上每月拥有超过一百万次会话，证明了\
  \ PhoneGap 可以成为创建高性能、优秀用户体验应用的有力工具。当 Eddy 不在钻研 Cordova 或 NativeScript 插件时，他担任 Combidesk\
  \ 的联合创始人，这是一家荷兰初创公司，旨在让连接云 API 变得如此简单，甚至你妈妈都能做到。\n\n# PacktPub 资源\n\n如需获取与本书相关的支持文件和下载，请访问\
  \ `www.PacktPub.com`。\n\n您知道吗？Packt 为每本出版的书籍提供电子书版本，包含 PDF 和 ePub 格式。您可以在 `www.PacktPub.com`\
  \ 升级到电子书版本，作为纸质书客户，您有权享受电子书折扣。如需更多详情，请联系 ``service@packtpub.com``。\n\n在 `www.PacktPub.com`，您还可以阅读免费技术文章集锦、订阅免费新闻通讯，并获得\
  \ Packt 图书和电子书的独家折扣和优惠。\n\n![支持文件、电子书、折扣优惠等](img/PacktLibLogo.jpg)\n\n`https://www2.packtpub.com/books/subscription/packtlib`\n\
  \n您需要即时解决 IT 问题吗？PacktLib 是 Packt 的在线数字图书库。在这里，您可以搜索、访问并阅读 Packt 的全部图书。\n\n## 为什么要订阅？\n\
  \n- 可在 Packt 出版的每本书中全文搜索\n- 复制粘贴、打印和书签内容\n- 按需访问，可通过网页浏览器访问\n\n## Packt 账户持有者免费访问\n\
  \n如果您在 `www.PacktPub.com` 拥有 Packt 账户，即可使用该账户访问 PacktLib，并阅读 9 本完全免费的书籍。只需使用您的登录凭据即可立即访问。\n\
  \n# 简介\n\nPhoneGap/Cordova 作为一种创建混合移动应用的技术，严重依赖 JavaScript、HTML 和 CSS 来向用户展示应用。这在许多方面都是理想的，特别是因为您可以利用现有的\
  \ Web 技术知识来创建跨平台移动应用。能够基于现有知识构建应用是推荐 Cordova 的一大优势，通常使用 Cordova 构建第一个简单应用非常容易。但当涉及构建更大、更复杂的应用时，探索各种技术和工具以更高效地开发移动应用就显得很有用。本书前几章正是专注于这一需求。我们将介绍\
  \ Gulp 等任务运行器、Browserify 等打包工具，以及使用 Sassy CSS 编写更易维护 CSS 的方法。\n\n在本书中，我们通常将 PhoneGap\
  \ 和 Cordova 统称为 Cordova——PhoneGap 本身是 Cordova 的一个发行版，并提供额外的功能和实用程序。如果有特定差异需要提及，我们将在适当的时候说明。\n\
  \n大型复杂应用的一个显著特征是需要高效存储复杂数据的方法。当使用 Local Storage 和 File API 变得笨重难用时，了解其他数据存储方法就变得很重要，例如\
  \ IndexedDB 和 Web SQL Database。通常，应用也需要在设备和外部服务器之间传输大量数据。您可以想象，社交摄影应用可能需要上传图片，电子书应用则需要下载代表书籍的文件。我们也将专门用一章来探讨这一主题。\n\
  \n\n\n# 前言\n\n当然，大多数开发者都希望让他们的应用进入尽可能多用户的设备中。这就是为什么创建无障碍应用很重要。并非每个用户都拥有完美的视力。一些用户可能难以阅读小字体或低对比度的文本。其他用户可能难以辨别各种色调。还有一些用户可能听不清您应用的声音。借助许多移动平台上的辅助技术，构建应用以便尽可能多的用户能有效地使用它们是一个非常好的主意。\n\
  \n部署最终是我们的目标，因此本书的后半部分将专门讨论这一点：如何为应用创建启动画面和图标，如何创建发布版本，以及最终如何将应用部署到各个应用商店。\n\n在此过程中，我们还将涉及其他概念，例如可用于使应用的用户界面适当响应其运行所在的各种设备形态的技巧。您还将找到可以验证应用是否按预期工作的工具，以及关于如何查找和修复性能问题的技巧。\n\
  \n读完本书后，您希望能具备必要的知识，以应对大型、更复杂且无障碍、高性能、响应式的应用开发。\n\n在本书中，我们将重点关注 iOS 和 Android 平台。然而，Cordova\
  \ 支持许多其他平台。一般来说，本书涵盖的大部分内容也适用于这些其他平台。不过，书中使用了一些第三方插件。如果您确实想支持另一个平台，您需要验证是否有相同或类似的插件可用。\n\
  \n## 章节概览\n\n- 第 1 章，*任务自动化*，向您介绍自动化常见开发任务的过程，包括将文件以各种方式复制和转换作为构建步骤的一部分。各节具体涉及创建一个可扩展的构建系统，该系统可以转译\
  \ JavaScript、自动压缩代码、执行 `cordova` CLI 任务，并对代码进行 lint 检查以捕获语法错误。\n\n- 第 2 章，*ECMAScript\
  \ 2015 和 Browserify*，简要介绍了 ECMAScript 2015 及更高版本中的许多新特性，包括字符串插值、对象解构、命名参数和默认参数、词法绑定函数等。本章还介绍了\
  \ Browserify 作为一种打包您自己的代码并复用其他 JavaScript 开发者优秀代码模块的方式。\n\n- 第 3 章，*Sassy CSS*，向您介绍\
  \ CSS 转译器的世界，特别是 Sassy CSS 语言。具体而言，本章涵盖变量、嵌套和混入，所有这些都使编写可读且可维护的 CSS 代码变得更加容易。\n\n\
  - 第 4 章，*更多响应式设计*，重点介绍可用于创建能适当响应各种设备形态的混合应用的步骤和特性。本章探讨逻辑像素和物理像素、重要的 CSS 单位、媒体查询、图像尺寸调整，以及使用弹性盒模型设计复杂但响应式的用户界面。\n\
  \n- 第 5 章，*混合应用无障碍*，探讨您作为开发者可以使用的各种方法，使您的应用对可能需要帮助查看、听取或使用应用内内容的用户具有无障碍性。\n\n- 第\
  \ 6 章，*测试与 UI 自动化*，解决了确保我们构建的应用实际功能正确的切实需求。本章向您介绍测试概念以及各种自动化测试工具。最后，本章探讨如何自动化用户界面，作为在真实设备上测试的另一种方法。\n\
  \n- 第 7 章，*IndexedDB*，向您介绍一种除 Local Storage 或 File API 之外的持久化存储方法。本章涵盖如何创建新的对象存储、保存、检索和搜索数据等内容。\n\
  \n- 第 8 章，*Web SQL 数据库*，向您介绍关系型数据库以及如何在 Cordova 中使用第三方插件来使用它们。本章重点介绍如何使用 SQL 存储和检索数据。\n\
  \n- 第 9 章，*传输文件*，涵盖如何从外部服务器将内容下载到您的应用，以及如何从您的应用上传内容并将其传输到外部服务器。\n\n- 第 10 章，*性能*，讨论您可以用来检查应用在真实设备上运行情况的方法，并提供可用于在必要时提高性能的技巧。\n\
  \n- 第 11 章，*图形资源*，讨论如何为您的应用创建启动画面和图标。本章提供关于如何创建令人难忘的图标和良好的启动画面的技巧。\n\n- 第 12 章，*部署*，逐步向您展示如何为\
  \ Google Play 市场和 Apple App Store 创建开发者账户，以便您将应用部署到全球。创建账户后，本章将指导您完成上传应用图形资源、定义元数据，最后上传应用本身的过程。\n\
