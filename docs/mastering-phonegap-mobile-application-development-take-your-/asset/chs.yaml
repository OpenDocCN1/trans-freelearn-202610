- "## 任务自动化\n\n在开发应用时，通常有许多任务需要定期执行。虽然这些任务很少困难或极其耗时，但随着时间的推移，精力累积起来，很快就会变得枯燥且容易出错。\n\
  \n任务自动化简化了这些繁琐的例行工作。自动化让您定义频繁执行的任务步骤（甚至那些 *不常执行* 的任务，这可能甚至更有用）。在某种程度上，您可以将任务自动化视为类似于您可能使用的其他生产力应用程序（如\
  \ Microsoft Word）中的宏。\n\n单个任务也可以依赖于其他任务，因此您可以将手动流程简化为一两个易于记忆和输入的命令。此外，大多数任务自动化工具都提供了一种机制来监视项目的变更，在检测到任何变更时自动执行各种任务。\n\
  \n从技术上讲，开发 PhoneGap/Cordova 应用并不需要任务自动化；但随着应用变得更大、更复杂，它变得越来越有益。当然，这有一些初始开销，这通常是小项目从未实施任务自动化的原因。但当一个应用拥有多个视图、大量模块和相当数量的依赖项时，初始开销很快就会得到回报。\n\
  \n### 注意\n\n尽管本书标题为 *Mastering PhoneGap Mobile Application Development*（精通 PhoneGap\
  \ 移动应用开发），但我们将使用 *Cordova* 来指代 PhoneGap 和 Cordova。PhoneGap 源自 Cordova，我们使用 Cordova\
  \ 所做的一切也适用于 PhoneGap。如果不适用，我们会明确提及。\n\n此外，当我们提到 Cordova 和 PhoneGap 时，指的是命令行工具。有一个可用的\
  \ PhoneGap Build 服务可在云端执行编译和打包；但如果您想使用它，需要适当调整本书的内容。如果想了解更多，请参阅本书代码包中的 `README.md`\
  \ 文件。\n\n\n\n\n# 使用 Gulp 进行任务自动化\n\n## 本章内容\n\n*   Logology，演示应用\n*   为何使用 Gulp\
  \ 进行任务自动化\n*   设置应用的目录结构\n*   安装 Gulp\n*   创建首个 Gulp 配置文件\n*   创建模块化 Gulp 配置\n*\
  \   复制资源文件\n*   执行替换操作\n*   执行各种 Cordova 任务\n*   管理版本号\n*   支持 ES2015\n*   代码检查\n\
  *   压缩/混淆代码\n\n## 先决条件\n\n本书附带一个代码包，可在 https://github.com/kerrishotts/Mastering-PhoneGap-Code-Package\
  \ 获取。如果您尚未下载，我强烈建议您这样做。它包含每一章的所有代码，以及大量演示大多数章节中示例的代码片段。此外，本书各章主要侧重于代码片段——若要在实际应用中查看这些主题的应用，您一定想看看演示应用的代码。\n\
  \n在继续本章之前，请确保您满足本书前言中列出的先决条件。软件和硬件要求也列在本书代码包的 `README.md` 文件中。\n\n## 构建演示应用\n\n\
  如果您想从代码包构建并部署演示应用程序，则需要安装前面提到的工具。由于 Cordova 项目和特定平台文件被视为构建产物，您需要在每一章的目录中执行以下命令，以构建应用的每个版本：\n\
  \n```\n## 在 Linux / Mac OS X 上（使用 Bash shell）\n$ npm install && gulp init\n\n% 在\
  \ Windows 上\n> npm install\n> gulp init\n```\n\n## 演示应用：Logology\n\n在进一步深入之前，让我们描述一下将在本书过程中构建的演示应用。\n\
  \n我称之为 **Logology**。如果您熟悉任何希腊单词，可能已经猜到该应用是什么了：一本词典。现在，我理解这不一定是最惊人的应用，但它足以满足我们的目的。它将帮助您了解高级移动开发是如何进行的。\n\
  \n## 功能\n\n到本书结束时，该应用将具备以下功能：\n\n*   **搜索**：用户将能够搜索术语\n*   **响应式设计**：应用将适当调整大小以适应任何显示尺寸\n\
  *   **无障碍访问**：即使用户有视觉障碍，也能使用该应用\n*   **持久化存储**：应用将持久化设置和其他用户生成的信息\n\n## 为何要任务自动化？\n\
  \n尽管该应用听起来相对简单，但它足够复杂，可以从任务自动化中受益。既然从一开始就建立任务自动化很有用，在本章中我们将安装 Gulp，并首先通过一些简单的文件验证其是否正常工作。因此，第一章代码包中的应用非常简单；它仅用于验证我们的任务是否正常工作。\n\
  \n您可能会认为配置任务自动化非常耗时，但从长远来看这是值得的。一旦您拥有了喜欢的工作流，就可以将其应用到未来可能构建的任何其他应用中。这意味着未来的应用几乎可以立即启动（只需从之前的应用复制配置）。即使您不编写其他应用，拥有任务运行器节省的时间也将超过初始设置时间。\n\
  \n## 介绍 Gulp\n\nGulp (http://gulpjs.com) 是一个基于 `Node.js` 平台的任务自动化工具。与其他一些任务运行器不同，Gulp\
  \ 通过编写 JavaScript 代码进行配置。Gulp 的配置就像任何其他 JavaScript 文件一样，这意味着如果您懂 JavaScript，就可以快速开始定义自动化任务。\n\
  \nGulp 还使用了 `Node.js` 中的 `streams`（流）概念。虽然您可以将流视为文件，但流实际上更强大。插件可以插入到流处理中，以执行许多不同的转换，包括美化或丑化、转译（例如，ECMAScript\
  \ 6 转 ECMAScript 2015）、合并、打包等。\n\n### 提示\n\n如果您在命令行上执行过任何类型的管道操作，Gulp 应该会让您感到熟悉，因为它基于类似的概念运行。一个进程的输出被传递给下一个进程，后者执行任意数量的转换，依此类推，直到最终输出被写入另一个位置。\n\
  \n## Gulp 的并行执行\n\nGulp 还尝试并行运行尽可能多的依赖任务。理想情况下，这使得 Gulp 任务运行得更快，尽管这实际上取决于您的任务结构。其他任务运行器（如\
  \ Grunt）按顺序执行任务步骤，这可能导致输出较慢，尽管按顺序执行时，从输入到输出的步骤可能更容易跟踪。\n\n这并不是说 Gulp 是最好的任务运行器——有很多都很不错，您可能会发现更喜欢其中的一个。您在本书中学到的技能可以轻松迁移到其他任务自动化工具中。\n\
  \n## 其他任务运行器\n\n以下是一些其他有用的任务运行器：\n\n*   **Grunt** (http://www.gruntjs.com)：配置通过设置指定，而非代码。任务按顺序执行。\n\
  *   **Cake** (http://coffeescript.org/documentation/docs/cake.html)：它使用 CoffeeScript，配置通过代码指定，正如在\
  \ Gulp 中所见。如果您喜欢使用 CoffeeScript，可能会比 Gulp 更喜欢它。\n*   **Broccoli** (https://github.com/broccolijs/broccoli)：它也通过代码进行配置。\n\
  \n## 设置目录结构\n\n在安装 Gulp 之前，我们应该为应用创建目录结构。请记住，没有单一的正确方式来构建应用程序结构，随着经验的积累，您对应用结构的看法可能会改变。话虽如此，本节将向您展示我喜欢如何构建我的项目。\n\
  \n我典型的结构从项目的根目录开始。如果您查看本书的代码包，会注意到项目的根目录称为 `logology-v01/`。\n\n### 注意\n\n我通常不会在项目上附加版本号——那是版本控制系统的工作。然而，既然重要的是您能看到版本之间的变化，代码包按章节分割这些变化——因此有了版本号。\n\
  \n## 项目目录\n\n在项目的根目录中有一些额外的目录：\n\n*   `config/`：任务期间所需的配置文件存储在此目录中。\n*   `src/`：所有应用的源代码和图像资源存储在此目录中。这是我们提供给\
  \ Gulp 的*源代码*。Gulp 随后转换源代码并将其存储在我们选择的目录中（通常是 `build` 目录）。\n*   `build/`：此目录包含转换后的\
  \ HTML、CSS 和 JavaScript 代码，以及 Cordova 项目的原生部分。\n\n### 注意\n\n`build/` 目录不会出现在本书的代码包中。它被视为构建产物，因此您始终可以重新生成它。\n\
  \n## 源代码目录结构\n\n在 `src/` 目录中存放着我们应用的源代码。我喜欢按如下方式构建代码和资源：\n\n\n\n\n```\nproject-root/\n\
  \  src/\n    config.xml            # 我们 Cordova 应用配置的\n                        \
  \  # 模板文件\n    res/                  # 图标和启动画面（第 11 章介绍）\n    www/             \
  \     # HTML、JavaScript 和 CSS 以及其他\n                          # Web 资源\n      index.html\
  \          # 初始 HTML 文件（在 config.xml 中指定）\n      html/               # 其他 HTML 文件（如有）\n\
  \      img/                # 图片文件（如需要）\n      scss/               # Sassy CSS 文件（见第\
  \ 3 章）\n        lib/              # 实用函数\n        themes/           # 主题（应用的外观）\n\
  \        views/            # 我们应用中特定视图的样式\n      js/                 # JavaScript\n\
  \        lib/              # 第三方库代码和支持\n                          # 代码\n       \
  \ app/              # 我们的应用代码\n          index.js        # 我们应用的入口点\n          controllers/\
  \    # 视图控制器放在这里\n          lib/            # 特定于应用的实用文件\n          localization/\
  \   # 语言翻译\n          models/         # 数据模型放在这里\n          views/          # 视图和模板放在这里\n\
  ```\n\n如果你查看代码包中本章的目录结构，你会注意到其中缺少了很多内容。这是因为目前还不需要这些内容；我们将在后续章节中完善它们。\n\n如果你在想 Cordova\
  \ 文件在哪里，说明你很细心。这里并没有。*暂时没有*。这是因为它们被视为 **构建产物**。构建产物是指编译应用时创建的文件。如果这让你感觉既有点陌生又有点熟悉，那是有充分理由的：Cordova\
  \ 项目本身已经有部分被视为构建产物。陌生的部分在于，你可能习惯于编辑 Cordova 项目中的 `www/` 文件夹，并执行 `cordova build`\
  \ 来创建其余的构建产物（即原生包装器，通常在 `platforms/` 中）。\n\n然而在本书中，我们将采用更高层级的方法，将 *整个 Cordova 项目*\
  \ 视为构建产物。为什么？因为 Cordova 已被其他几个项目扩展（例如 Steroids：[`www.appgyver.com/steroids`](http://www.appgyver.com/steroids)），它们通常有自己的项目格式和构建步骤。如果你想以这些平台为目标，你可以轻松做到，因为你的代码不存在于\
  \ Cordova 项目中。此外，你可能会发现想要以完全不同的技术为目标，例如 Electron ([`electron.atom.io`](http://electron.atom.io))，它使用适合桌面执行的\
  \ Chromium webview 封装你的代码。Electron 的构建步骤和项目结构与你对 Cordova 项目的预期不同。简而言之，这是一种避免束缚自己的方式。\n\
  \n总而言之，当我们完成本章时，你将拥有一个填充了你源代码的 Cordova 应用。该项目将位于 `build/` 目录中。\n\n### Tip\n\n如果你需要在\
  \ Gulp 之外执行 Cordova 命令，你首先需要切换到 `build/` 目录，否则命令将会失败。这是因为 Cordova CLI 期望在 Cordova\
  \ 项目内运行，而我们应用的根目录不是一个 Cordova 项目。只有 `build/` 包含一个有效的 Cordova 项目。\n\n我们工作流程中至关重要的一部分是项目的\
  \ `package.json` 文件。该文件将包含应用的版本信息、Cordova 配置等。如果你是从头开始，你需要通过切换到项目根目录并执行 `npm init`\
  \ 来自行创建此文件：\n\n### Note\n\n如果你使用的是本章的代码包，`package.json` 文件已经为你构建好了。\n\n```\n###\
  \ （在你的项目根目录中）\n$ npm init [ENTER]\nThis utility will walk you through creating a\
  \ package.json file.\nIt only covers the most common items, and tries to guess sane\n\
  defaults.\n…\n\nname: (logology-v01) Logology [ENTER]\nversion: (1.0.0) [ENTER]\n\
  description: Logology and PhoneGap demonstration app [ENTER]\nentry point: (index.js)\
  \ [ENTER]\ntest command: [ENTER]\ngit repository: [ENTER]\nkeywords: dictionary\
  \ word study phonegapcordova html5 javascript\ncss [ENTER]\nauthor: Kerri Shotts<kerrishotts@gmail.com>\
  \ [ENTER]\nlicense: (ISC) MIT [ENTER]\nAbout to write to .../logology-v01/package.json:\n\
  \nIs this ok? (yes) [ENTER]\n```\n\n此时，`package.json` 文件已创建，但还需要一些额外的编辑。在你喜欢的编辑器中打开\
  \ `package.json` 文件并移除 `scripts` 部分。然后，添加以下内容（有关该文件的完整内容，可参考代码包）：\n\n```json\n{\
  \ ...,\n\"cordova\": {\n  \"name\": \"Logology\",\n  \"id\": \"com.packtpub.logologyv1\"\
  ,\n  \"description\": \"Dictionary application\",\n  \"author\": {\n    \"name\"\
  : \"Kerri Shotts\",\n    \"email\": \"kerrishotts@gmail.com\",\n    \"site\": \"\
  http://www.photokandy.com\"\n  },\n  \"template\": \"../blank\",\n  \"platforms\"\
  : [ \"ios\", \"android\" ],\n  \"preferences\": {\n    \"permissions\": \"none\"\
  ,\n    \"fullscreen\": \"false\",\n    \"orientation\": \"default\",\n    \"stay-in-webview\"\
  : \"false\",\n    \"ShowSplashScreenSpinner\": \"false\",\n    \"AutoHideSplashScreen\"\
  : \"false\",\n    \"disable-cursor\": \"false\",\n    \"KeyboardDisplayRequiresUserAction\"\
  : \"false\",\n    \"target-device\": \"universal\",\n    \"prerendered-icon\": \"\
  true\",\n    \"webviewbounce\": \"false\",\n    \"DisallowOverscroll\": \"true\"\
  ,\n    \"exit-on-suspend\": \"false\",\n    \"deployment-target\": \"7.0\",\n  \
  \  \"detect-data-types\": \"false\",\n    \"SupressesIncrementalRendering\": \"\
  true\",\n    \"android-minSdkVersion\": \"14\",\n    \"android-installLocation\"\
  : \"auto\",\n    \"android-windowSoftInputMode\": \"adjustResize\",\n  },\n  \"\
  plugins\": [\n    \"cordova-plugin-device@1.1.0\",\n    \"cordova-plugin-network-information@1.1.0\"\
  ,\n    \"cordova-plugin-globalization@1.0.2\",\n    \"cordova-plugin-whitelist@1.1.0\"\
  ,\n    \"ionic-plugin-keyboard@1.0.8\",\n    \"cordova-plugin-inappbrowser@1.0.1\"\
  \n    ]\n  }\n}\n```\n\n前面的代码应该很容易理解。通过它，我们本质上是在复制 Cordova 的 `config.xml` 文件的内容。因为\
  \ Cordova 项目本身被视为构建产物，所以在别处管理插件、平台和首选项是合理的，而且因为 `package.json` 处理我们项目的其他配置方面，所以将这些配置设置包含在此处也是合理的。\n\
  \n### Note\n\n这并不意味着不需要 `config.xml` 文件。我们稍后在本章中将介绍这一点。\n\n此时，我们准备好安装 Gulp 以及我们项目可能需要的任何其他依赖。\n\
  \n安装 Gulp 很简单，但实际上是一个两步过程。第一步是全局安装 Gulp。这会安装命令行工具；但如果不在我们的项目中 *本地* 安装 Gulp，它将无法工作。如果你不熟悉\
  \ Node.js，包可以本地和/或全局安装。本地安装的包位于项目根目录，而全局安装的包特定于开发者的机器。项目依赖在 `package.json` 中跟踪，这使得在另一台机器上复制开发环境变得容易。\n\
  \n假设你已安装 Node.js 并在项目目录中创建了 `package.json`，Gulp 的安装将非常容易。确保你位于项目根目录，然后执行以下命令：\n\n\
  ```\n$ npm install -g gulp@3.9.0\n$ npm install --save-dev gulp@3.9.0\n```\n\n###\
  \ Note\n\n如果你在 OS X 上运行这些命令时收到错误，可能需要使用 `sudo` 运行它们。例如：`sudo install -g gulp`。\n\
  \n通常可以忽略任何 `WARN` 消息。\n\n\n\n请注意，我们在这里指定了版本号——这些是我在编写本书代码时使用的版本。如果你愿意，可以尝试更新的版本，只要它们是次要修订版即可。主要修订版可能也能工作，但你可能也需要对本书中的代码进行修改以支持它们。\n\
  \n### 提示\n\n每当你执行 `npm` 或 `gulp` 命令时，最好都定位在项目的根目录下。在 Linux 和 OS X 上，这些命令通常会自动定位项目的根目录；但这在所有平台上都无法保证，所以小心驶得万年船。\n\
  \n就是这样！Gulp 本身非常容易安装，但大多数工作流需要与 Gulp 配合工作的额外插件。此外，我们还将为该项目安装 Cordova 依赖。\n\n###\
  \ 注意\n\n如果你正在使用本章的代码包，可以通过执行 `npm install` 来安装以下所有依赖。\n\n首先，让我们安装 Cordova 依赖：\n\n\
  ```\n$ npm install --save-dev cordova-lib@5.4.1 cordova-ios@3.9.2 cordova-android@4.1.1\n\
  ```\n\n`cordova-lib` 允许我们以编程方式与 Cordova 交互。我们可以创建项目、构建它们并模拟它们——我们在 Cordova 命令行中所做的一切都可以用\
  \ `cordova-lib` 完成。`cordova-ios` 和 `cordova-android` 指的是 `cordova platform add ios\
  \ android` 会添加的 iOS 和 Android 平台。我们已将它们作为项目的依赖，以便我们可以轻松控制将使用哪个版本进行构建。\n\n### 提示\n\
  \n在开始一个新项目时，明智的做法是从最新版本的 Cordova 和所需的平台开始。一旦开始，通常最好坚持使用特定的平台版本，除非存在严重的错误或安全问题，需要更新到更新的平台版本。\n\
  \n接下来，让我们安装所需的 Gulp 插件：\n\n```\n$ npm install --save-dev babel-eslint@4.1.1 cordova-tasks@0.2.0\
  \ gulp-babel@5.2.1 gulp-bump@0.3.1 gulp-concat@2.6.0 gulp-eslint@1.0.0 gulp-jscs@3.0.2\
  \ gulp-notify@2.2.0 gulp-rename@1.2.0 gulp-replace-task@0.10.1 gulp-sourcemaps@1.3.0\
  \ gulp-uglify@1.4.0 gulp-util@3.0.6 merge-stream@1.0.0 require-all@1.1.0 rimraf@2.4.3\n\
  ```\n\n这些安装需要片刻时间；完成后，请查看 `package.json`。请注意，我们添加的所有依赖也被添加到了文件的 `devDependencies`\
  \ 部分。这使得稍后（比如在一台新机器上）只需执行 `npm install` 即可轻松安装项目的所有依赖。\n\n在继续之前，让我们快速浏览一下前面提到的每个实用程序的作用。随着本章剩余部分的推进，我们将更详细地介绍它们：\n\
  \n*   `gulp-babel`：将 ES2015 JavaScript 转换为 ES5。如果你不熟悉 ES2015，它有几个新特性和改进的语法，使编写移动应用更容易。不幸的是，因为大多数浏览器还不原生支持\
  \ ES2015 的特性和语法，所以必须将其转译为 ES5 语法。当然，如果你更喜欢其他可以编译为 ES5 JavaScript 的语言，你也可以使用它们（包括\
  \ CoffeeScript 等）。\n*   `gulp-bump`：这个小工具管理 `package.json` 中的版本号。\n*   `gulp-concat`：这将流连接在一起。我们可以用它将文件打包在一起。\n\
  *   `gulp-jscs`：这对你的代码执行 JavaScript 代码风格检查。它支持 ES2015。\n*   `gulp-eslint`：这会检查你的\
  \ JavaScript 代码。它支持 ES2015。\n*   `babel-eslint`：这为 `gulp-eslint` 提供 ES2015 支持。\n\
  *   `gulp-notify`：这是一个可选插件，但非常方便，特别是当你的某些任务需要运行几秒钟时。当发生重要事件时——可能是错误或完成消息——此插件会向计算机的通知面板发送通知。如果插件无法发送到通知面板，它将记录到控制台。\n\
  *   `gulp-rename`：这会重命名流。\n*   `gulp-replace-task`：这在流中执行文本搜索和替换。\n*   `gulp-sourcemaps`：在将\
  \ ES2015 转译为 ES5 时，拥有原始源代码和转译后源代码之间的映射会很有帮助。此插件会自动为你创建它们。\n*   `gulp-uglify`：这会压缩/混淆你的代码。虽然对于代码混淆很有用，但它也能减小代码体积。\n\
  *   `gulp-util`：这为 Gulp 提供额外的实用程序，例如日志记录。\n*   `merge-stream`：这合并多个任务。\n*   `require-all`：这让我们可以一次性将整个代码目录导入到一个对象中。\n\
  *   `rimraf`：轻松删除文件。类似于命令行上的 `rm`。\n\nGulp 任务由项目 `gulpfile.js` 文件的内容定义。这是一个 JavaScript\
  \ 程序，因此你拥有的 JavaScript 技能同样适用于此处。此外，它由 Node.js 执行，所以如果你有任何 Node.js 知识，你可以利用它。\n\n\
  ### 提示\n\n此文件应放置在项目的根目录中，且必须命名为 `gulpfile.js`。\n\nGulp 配置文件的前几行将 `require` 完成任务所需的\
  \ Gulp 插件。以下几行将指定如何执行各种任务。例如，一个非常简单的配置可能如下所示：\n\n```\nvar gulp = require(\"gulp\"\
  );\ngulp.task(\"copy-files\", function () {\n  gulp.src([\"./src/**/*\"])\n    \
  \  .pipe(gulp.dest(\"./build\"));\n});\n```\n\n此配置仅执行一项任务：它将 `src/` 中包含的所有文件移动到\
  \ `build/`。在许多方面，这是构建工作流最简单的形式，但对于我们的目的来说，它有点过于简单了。\n\n### 提示\n\n请注意我们用于匹配所有文件的模式。如果你需要查看支持哪些模式的文档，请参阅\
  \ [`www.npmjs.com/package/glob`](https://www.npmjs.com/package/glob)。\n\n要执行该任务，可以执行\
  \ `gulp copy-files`。Gulp 将执行该任务并将所有文件从 `src/` 复制到 `build/`。\n\nGulp 之所以强大，在于任务组合的概念。任务可以依赖任意数量的其他任务，而那些任务又可以依赖更多的任务。这使得从更简单的部分创建复杂的工作流变得容易。此外，每个任务都是异步的，因此许多没有共享依赖的任务可以并行运行。\n\
  \n正如你在前面的代码中所见，每个任务由一系列源文件的选择（`src()`）、可选地对每个文件执行一些额外处理（通过 `pipe()`），然后将这些文件写入目标路径（`dest()`）组成。如果未指定额外处理（如前面的示例），Gulp\
  \ 将简单地复制匹配通配符模式的文件。然而，流的美妙之处在于，可以在最终数据保存之前执行任意数量的转换。因此，工作流可以变得非常复杂。\n\n现在你已经看到了一个简单的任务，让我们在下一节深入了解一些更复杂的任务。\n\
  \n虽然你可以将所有想要运行的任务添加到单个配置文件中，但随着你向环境中添加更多任务，这很快就会变得难以驾驭。为了保持配置维护简单，最好将所有内容拆分到单独的文件中。\n\
  \n这意味着除了项目的目录结构外，我们的 Gulp 配置也有自己的结构。以下展示了我喜欢如何构建我的配置：\n\n\n\n\n## 项目结构概览\n\n```\n\
  project-root/\n  gulpfile.js            # Stub (loads in everything else)\n  gulp/\n\
  \    config.js            # Configuration – files to copy,\n                   \
  \      # output paths, etc.\n    settings.js          # values of command-line flags\n\
  \    tasks.js             # Stub (loads in all the tasks)\n    tasks/          \
  \     # Contains each task, in its own\n      some-task.js       # JavaScript file\n\
  \      another-task.js\n    utils/               # Utility functions all tasks share\n\
  \      paths.js           # path manipulation methods\n```\n\n## `gulp/config.js`\
  \ 详解\n\n首先，让我们看一个简化的 `gulp/config.js` 文件，它存储了基础路径，以及项目的源路径和目标路径：\n\n```\nvar config\
  \ = {\n    paths: {\n        base: process.cwd(), // [1]\n        dest: \"build\"\
  ,       // [2]\n        src: \"src\",          // [3]\n        config: \"config\"\
  \     // [4]\n    },\n    assets: { // [5]\n        copy: [ // [6]\n           \
  \     {src:  \"www/*.*\",         dest: \"www\"},\n                {src:  \"www/html/**/*\"\
  ,   dest: \"www/html\"},\n                {src:  \"www/img/**/*\",    dest: \"www/img\"\
  },\n                {src:  \"www/js/lib/**/*\", dest: \"www/js/lib\"},\n       \
  \         {src:  \"res/**/*\",        dest: \"res\"}\n              ]\n    }\n}\n\
  module.exports = config; // [7]\n```\n\n这是一个相当简单的配置文件——随着书籍的深入，我们会向其中添加更多内容。\n\n\
  第一部分定义了 Gulp 需要了解的各种路径，以便复制项目文件以及转换代码所需的路径。`base` 路径（`[1]`）用作其他所有路径的基础，因此你将看到的所有其他路径都是相对路径，而非绝对路径。\n\
  \n输出目录在 `[2]` 中指定，源目录在 `[3]` 中指定。代码转换和风格检查可能需要的配置文件在 `[4]` 中指定。每一个都相对于 `base` 路径。\n\
  \n每个项目都有一组资源，我们的项目也不例外——这些在 `[5]` 部分指定。在本例中，资源不多，但即便如此，也需要指定它们，以便任务知道需要处理哪些文件。我们可能有许多不同的资源，其中一些可能需要不同的处理，因此我们可以根据需要添加到此部分。目前，我们只需要复制一些文件，因此将它们添加到\
  \ `copy` 部分（`[6]`）。注意，我们通过源通配符字符串和目标路径来指定它们。这些将自动相对于 `src`（`[3]`）和 `dest`（`[2]`）路径。\n\
  \n最后一行（`[7]`）用于导出该文件的信息。稍后我们可以在另一个文件中 `require` 该文件（我们的大多数任务等都会这样做）。这意味着我们的资源和路径配置只需在一个地方维护。\n\
  \n## `gulp/settings.js` 详解\n\nGulp 可以接受自定义命令行参数，这些参数可用于控制各种任务的操作方式。典型的参数可能指定生成的日志量。所有这些都由\
  \ `gulp/settings.js` 文件处理。让我们来看一下：\n\n```\nvar gutil = require(\"gulp-util\");\n\
  var settings = {\n    VERBOSE: gutil.env.verbose ? (gutil.env.verbose === \"yes\"\
  ) \n                               : false\n}\nmodule.exports = settings;\n```\n\
  \n目前，此文件中没有太多内容，因为我们确实没有需要使用命令行参数配置的任务。但随着书籍的深入，我们会向该文件添加内容。\n\n单独来看，此文件作用不大。它只是使用\
  \ `gutil.env` 读取命令行传递的参数。在本例中，它检查是否在命令行传递了 `verbose`。如果传递了，且值为 `yes`，则 `settings.VERBOSE`\
  \ 设为 `true`。如果未传递（或传递了但值为 `no`），则 `settings.VERBOSE` 设为 `false`。如果我们想在稍后的任务中利用此设置，可以直接使用。\n\
  \n## `gulp/tasks.js` 详解\n\n`gulp/` 目录下还有一个文件，让我们看看 `gulp/tasks.js`：\n\n```\nvar\
  \ path = require(\"path\");\nvar tasks = require(\"require-all\")(path.join(__dirname,\
  \ \"tasks\"));\nmodule.exports = tasks;\n```\n\n正如你所见，这是一个非常短的文件。它所做的就是找到 `gulp/tasks/`\
  \ 中的所有任务并将它们加载到 `tasks` 对象中。目前这将返回一个空对象，但到本章结束时，`tasks` 对象将包含 Gulp 可用的多个方法。我们使用\
  \ `require-all` 包来简化工作——这样我们就不必单独 `require` 每一个任务。稍后，当我们向 Gulp 配置添加更多任务时，这意味着我们不必再回来编辑此文件。\n\
  \n## `gulp/utils/paths.js` 详解\n\n接下来，让我们看看 `gulp/utils/paths.js`：\n\n```\nvar path\
  \ = require(\"path\"),\n    config = require(\"../config\"); // [1]\nfunction makeFullPath(filepath,\
  \ relativeTo) {\n    var pathComponents = [config.paths.base];\n    if (relativeTo)\
  \ {\n        pathComponents.push(config.paths[relativeTo]);\n    }\n    pathComponents\
  \ = pathComponents.concat(filepath.split(\"/\"));\n    return path.join.apply(path,\
  \ pathComponents);\n}\nmodule.exports = {\n    SRC: \"src\",\n    DEST: \"dest\"\
  ,\n    CONFIG: \"config\",\n    makeFullPath: makeFullPath\n};\n```\n\n此工具文件提供了一种机制，供任务用来构建相对于项目中源、目标、配置和基础路径的路径。它大量使用了\
  \ Node.js 的 `path` 库，以便我们的 Gulp 任务能在不同平台上工作。\n\n## `gulpfile.js` 详解\n\n最后，我们需要创建实际的\
  \ `gulpfile.js` 文件来启动一切。它本身不做太多事；相反，它加载其他所有内容并使用 Gulp 配置任何可用的任务：\n\n```\nrequire\
  \ (\"babel/register\"); // [1]\nvar gulp = require(\"gulp\"),\n    tasks = require(\"\
  ./gulp/tasks\"); // [2]\nObject.keys(tasks).forEach(function(taskName) { // [3]\n\
  \    var taskOpts = tasks[taskName];\n    if (typeof taskOpts === \"function\")\
  \ {\n        gulp.task(taskName, taskOpts); // [4]\n    } else {\n        gulp.task(taskName,\
  \ taskOpts.deps, taskOpts.task); // [5]\n    }\n});\n```\n\n第一行（`[1]`）导入 Babel，以便我们可以在任务中使用\
  \ ES2015 代码（如果选择的话）。第三行（`[2]`）导入所有可用的任务。目前这将是一个空对象，但随着我们添加任务，它将包含越来越多的函数，供 Gulp\
  \ 用来复制和转换文件。\n\n从 `[3]` 开始的代码只是获取所有可用任务并创建相应的 Gulp 任务。每个任务可以是一个函数，也可以是一个指定依赖项（及更多）的对象，因此在\
  \ `[4]` 和 `[5]` 处有两种不同的方法调用。\n\n## 创建第一个任务：复制资源\n\n现在我们已经创建了基本的 Gulp 配置结构，让我们创建第一个任务，将应用的资源从源路径复制到目标路径。\n\
  \n我们可以将此文件命名为 `gulp/tasks/copy-assets.js`，内容如下：\n\n```\nvar merge = require(\"merge-stream\"\
  ),\n    gulp = require(\"gulp\"),\n    config = require(\"../config\"),\n    paths\
  \ = require(\"../utils/paths\");\n\nfunction copyAssets() {\n  return merge.apply(merge,\
  \ config.assets.copy.map(function(asset) \n  {\n    var fqSourcePath = paths.makeFullPath(asset.src,\
  \ paths.SRC);\n    var fqTargetPath = paths.makeFullPath(asset.dest, paths.DEST);\n\
  \    return gulp.src([fqSourcePath])\n      .pipe(gulp.dest(fqTargetPath));\n  });\n\
  }\n\nmodule.exports = {\n  task: copyAssets\n}\n```\n\n`copyAssets` 方法只是根据 `gulp/config.js`\
  \ 中指定的项目文件结构复制大量文件。这里的代码本可以更简单，但你可能会发现稍后需要更改哪些文件需要替换、哪些不需要。因此，我们使其可配置。你只需更改 `gulp/config.js`\
  \ 中 `config.assets.copy` 内的文件和目标，此任务就会做出相应反应。\n\n让我们来看看这个任务到底在做什么：\n\n\n\n\n我们使用工具方法\
  \ `paths.makeFullPath`（它使用 `path.join`）来确保配置在多个平台上都能工作。在类 Unix 系统中，路径分隔符是 `/`；但在\
  \ Windows 系统中，路径分隔符实际上是 `\\`。为了简化配置，我们在 `config.assets.copy` 中使用 `/`。`makeFullPathsplits`\
  \ 将每个字符串按 `/` 分割成数组，并使用 `path.join`（它知道正确的路径分隔符）来创建最终路径。\n\n`map` 遍历数组并使用给定的转换返回一个新数组。例如，`[1,\
  \ 2, 3].map(function(x) {return x*2;})` 将返回一个新数组 `[2, 4, 6]`。在我们的例子中，我们返回一个 `gulp.src(…).pipe(gulp.dest(…))`\
  \ 链的数组。然后我们可以将该数组 `apply` 给 `merge` 以将所有任务组合在一起。\n\n`apply` 是一种使用数组而不是多个参数来调用函数的方式。例如，`console.log.apply(console,[1,2,3])`\
  \ 将记录 `1 2 3`。这不同于 `console.log([1,2,3])`，后者将记录 `[1, 2, 3]`。\n\n此时，你可以在命令行输入以下内容，将项目资源从源位置复制到目标位置：\n\
  \n```\n$ gulp copy-assets\n```\n\n很多时候，我们需要将 Gulp 流中的某些关键字转换为其他值。一个简单的例子是将 `{{{VERSION}}}`\
  \ 转换为应用的版本号——例如 `1.23.4456`。这样做非常简单，但它开启了大量的可能性。\n\n为此，我们将使用 `gulp-replace-task`\
  \ 插件。该插件将特定正则表达式的所有实例替换为替换值。这些表达式可以变得非常复杂；但在我们的例子中，我们将保持简单。\n\n我们只需要支持代码文件中的替换，所以让我们创建一个新任务，专门用于复制代码文件并在过程中应用任何必要的替换。我们将其命名为\
  \ `gulp/tasks/copy-code.js`。该文件应以如下内容开始：\n\n```\nvar gulp = require(\"gulp\"),\n\
  \    replace = require(\"gulp-replace-task\"),\n    concat = require(\"gulp-concat\"\
  ),\n    pkg = require(\"../../package.json\"),\n    config = require(\"../config\"\
  ),\n    paths = require(\"../utils/paths\");\n```\n\n接下来，我们需要定义一个方法，用于对输入流执行替换。记住，这些将是由提供给\
  \ `gulp.src()` 的模式匹配的文件：\n\n```\nfunction performSubstitutions() {\n  return replace({\n\
  \    patterns: [\n      {\n        match: /{{{VERSION}}}/g,\n        replacement:\
  \ pkg.version\n      }\n    ]\n  });\n}\n```\n\n接下来，让我们定义另一个配置设置，指定需要替换的代码文件及其存储位置。在\
  \ `gulp/config.js` 中，向 `config.assets` 对象添加一个 `code` 部分，如下所示：\n\n```\nassets: {\n\
  \  copy: [ … ],\n  code: {src: \"www/js/app/**/*.js\", dest: \"www/js/app\"}\n},\
  \ …\n```\n\n接下来，我们需要定义将 `config.assets.code` 指定的文件复制到适当目标位置的代码。这将添加到 `gulp/tasks/copy-code.js`\
  \ 中，如下所示：\n\n```\nfunction copyCode() {\n  return gulp.src([paths.makeFullPath(config.assets.code.src,\
  \ \n                     paths.SRC)])\n             .pipe(performSubstitutions())\n\
  \             .pipe(concat(\"app.js\"))\n             .pipe(gulp.dest(paths.makeFullPath(\n\
  \                    config.assets.code.dest, paths.DEST)));\n}\nmodule.exports\
  \ = {\n    task: copyCode\n}\n```\n\n`copyCode` 方法很容易理解。首先，使用我们指定的配置定位所有 JavaScript\
  \ 文件。这些文件都通过 `performSubstitutions()` 进行处理。替换结果随后通过 `concat` 打包在一起。因此，即使我们有多个 JavaScript\
  \ 文件，它们也会被打包成单个文件（`app.js`）。\n\n### 注意\n\n你不*必须*连接文件，如果你不想的话。然而，当你有多个 JavaScript\
  \ 文件时，这意味着你必须在 `index.html` 文件中包含每一个。而如果你将它们打包成单个文件，就可以减少 `index.html` 文件中的 `script`\
  \ 标签数量。\n\n为了测试这些任务，我们可以创建两个简单的文件。第一个应放在 `src/www/` 中并命名为 `index.html`：\n\n```\n\
  <!DOCTYPE html>\n<html>\n  <head>\n    <script src=\"cordova.js\" type=\"text/javascript\"\
  ></script>\n    <script src=\"js/app/app.js\" type=\"text/javascript\"></script>\n\
  \  </head>\n  <body>\n    <p>Hello!</p>\n    <div id=\"demo\"></div>\n  </body>\n\
  </html>\n```\n\n第二个文件应放在 `src/www/js/app/` 中并命名为 `index.js`：\n\n```\ndocument.getElementById(\"\
  demo\").textContent = \"{{{VERSION}}}\";\n```\n\nJavaScript 文件本身显然非常简单。其目的仅仅是证明我们的\
  \ Gulp 任务有效。如果你执行 `gulp copy-assets`，你会发现 `index.html` 已从 `src/www/` 复制到 `build/www/`。同样，如果你执行\
  \ `gulp copy-code`，你会发现 `index.js` 已从 `src/www/js/app/` 复制到 `build/www/js/app/`\
  \ 并重命名为 `app.js`。如果你在编辑器中打开后者，你还会看到 `{{{VERSION}}}` 已被替换为 `1.0.0`（来自 `package.json`）。\n\
  \n正如你可能记得的，我们在本章前面提到过我们仍然需要一个 `config.xml` 文件。这是真的，但我们已在 `package.json` 中指定了所需的一切。如果能从模板生成有效的\
  \ `config.xml` 文件不是很好吗？这意味着我们需要更多的替换和一个合适的模板。\n\n让我们先定义模板。这应该在 `src/config.xml`\
  \ 中（完整文件见代码包）：\n\n```\n<?xml version='1.0' encoding='utf-8'?>\n<widget id=\"{{{ID}}}\"\
  \ version=\"{{{VERSION}}}\"\n        xmlns=\"http://www.w3.org/ns/widgets\"\n  \
  \      xmlns:cdv=\"http://cordova.apache.org/ns/1.0\"\n        xmlns:gap=\"http://phonegap.com/ns/1.0\"\
  >\n    <name>{{{NAME}}}</name>\n    <description>\n      {{{DESCRIPTION}}}\n   \
  \ </description>\n    <author email=\"{{{AUTHOR.EMAIL}}}\"href=\"{{{AUTHOR.SITE}}}\"\
  >\n      {{{AUTHOR.NAME}}}\n    </author>\n    <content src=\"index.html\" />\n\
  \      {{{PREFS}}}\n    <access origin=\"*\" />\n…\n</widget>\n```\n\n注意前面的代码中有很多替换变量。大多数都很简单：`{{{ID}}}`、`{{{NAME}}}`\
  \ 等。其中一个稍微复杂一些：`{{{PREFS}}}`。这需要将 `package.json` 中的简单首选项列表渲染为 Cordova 所需的 XML 格式。\n\
  \n让我们创建一个名为 `gulp/utils/performSubstitutions.js` 的新工具文件，其中包含 `performSubstitutions`\
  \ 方法的新版本。我们将在两个任务中需要这个新版本，因此需要将其拆分到单独的文件中。新文件应如下所示：\n\n\n\n\n## 创建 `performSubstitutions`\
  \ 工具函数\n\n```javascript\nvar pkg = require(\"../../package.json\"),\n    replace\
  \ = require(\"gulp-replace-task\");\n\nfunction performSubstitutions() {\n  function\
  \ transformCordovaPrefs() {\n    var template = '<preference name=\"{{{NAME}}}\"\
  \ ' + \n                   'value=\"{{{VALUE}}}\" />';\n    if (pkg.cordova &&\n\
  \      pkg.cordova.preferences instanceof Object) {\n      return Object.keys(pkg.cordova.preferences).map(\n\
  \        function(prefName) {\n          var str = template.replace(/{{{NAME}}}/g,\n\
  \            prefName)\n            .replace(/{{{VALUE}}}/g,\n              pkg.cordova.preferences[prefName]);\n\
  \          return str;\n        }).join(\"\\n  \");\n    }\n  }\n\n  return replace({\n\
  \    patterns: [\n      {\n        match: /{{{VERSION}}}/g,\n        replacement:\
  \ pkg.version\n      },\n      {\n        match: /{{{ID}}}/g,\n        replacement:\
  \ pkg.cordova.id\n      },\n      {\n        match: /{{{NAME}}}/g,\n        replacement:\
  \ pkg.cordova.name\n      },\n      {\n        match: /{{{DESCRIPTION}}}/g,\n  \
  \      replacement: pkg.cordova.description\n      },\n      {\n        match: /{{{AUTHOR.NAME}}}/g,\n\
  \        replacement: pkg.cordova.author.name\n      },\n      {\n        match:\
  \ /{{{AUTHOR.EMAIL}}}/g,\n        replacement: pkg.cordova.author.email\n      },\n\
  \      {\n        match: /{{{AUTHOR.SITE}}}/g,\n        replacement: pkg.cordova.author.site\n\
  \      },\n      {\n        match: /{{{PREFS}}}/g,\n        replacement: transformCordovaPrefs\n\
  \      }\n    ]\n  });\n}\n\nmodule.exports = performSubstitutions;\n```\n\n## 更新\
  \ `gulp/copy-code.js`\n\n接下来，我们需要编辑 `gulp/copy-code.js` 以包含这个新版本。首先从该文件中移除 `performSubstitutions`\
  \ 方法，然后在文件顶部添加以下 `require` 语句：\n\n```javascript\nvar …,\n  performSubstitutions\
  \ = require(\"../utils/performSubstitutions\");\n```\n\n## 创建 `copy-config.js` 任务\n\
  \n最后，让我们添加另一个任务来复制配置文件。我们将其命名为 `gulp/tasks/copy-config.js`，内容如下：\n\n```javascript\n\
  var gulp = require(\"gulp\"),\n    performSubstitutions = \n      require(\"../utils/performSubstitutions\"\
  ),\n    config = require(\"../config\"),\n    paths = require(\"../utils/paths\"\
  );\n\nfunction copyConfig() {\n  return gulp.src([paths.makeFullPath(\"config.xml\"\
  , paths.SRC)])\n             .pipe(performSubstitutions())\n             .pipe(gulp.dest(paths.makeFullPath(\"\
  .\", \n               paths.DEST)));\n}\n\nmodule.exports = {\n    task: copyConfig\n\
  }\n```\n\n## 创建聚合任务 `copy.js`\n\n当然，我们不想运行大量单独的任务仅仅为了复制文件。所以让我们创建一个依赖这三个任务的简单任务。这样做，Gulp\
  \ 将通过单个命令运行所有这些任务。\n\n让我们创建名为 `gulp/tasks/copy.js` 的新任务。文件应包含以下内容：\n\n```javascript\n\
  module.exports = {\n    deps: [\"copy-assets\", \"copy-config\", \"copy-code\"],\n\
  }\n```\n\n这是迄今为止最短的任务。它所做的只是将其他三个任务列为依赖。这意味着它们将在 `copy` 之前执行。由于 `copy` 不包含任何额外代码，它只是同时执行多个任务的一种简单方式。如果你执行\
  \ `gulp copy`，你会发现在 `build` 目录下有一个新的 `config.xml` 文件。它应该看起来很像下面这样：\n\n```xml\n<?xml\
  \ version='1.0' encoding='utf-8'?>\n<widget id=\"com.packtpub.logologyv1\" version=\"\
  1.0.0\"\n        xmlns=\"http://www.w3.org/ns/widgets\"\n        xmlns:cdv=\"http://cordova.apache.org/ns/1.0\"\
  \n        xmlns:gap=\"http://phonegap.com/ns/1.0\">\n  <name>Logology</name>\n \
  \ <description>\n    Dictionary application for Mastering PhoneGap book\n  </description>\n\
  \  <author email=\"kerrishotts@gmail.com\"\n   href=\"http://www.photokandy.com\"\
  >\n    Kerri Shotts\n  </author>\n  <content src=\"index.html\" />\n\n  <preference\
  \ name=\"permissions\" value=\"none\" />\n  <preference name=\"fullscreen\" value=\"\
  false\" />\n  <preference name=\"orientation\" value=\"default\" />\n  …\n  <access\
  \ origin=\"*\" />\n</widget>\n```\n\n现在你已经掌握了执行替换的方法，在下一节中你将学习如何以编程方式与 Cordova 交互。\n\
  \n直接使用 Cordova 命令行界面很诱人，但这有一个问题：没有很好的方法来确保你编写的内容跨多个平台都能工作。如果你确定只会使用特定平台，可以继续执行 shell\
  \ 命令；但我们要做的方法更灵活一些。\n\n## 注意\n\n本节代码受 [`github.com/kamrik/CordovaGulpTemplate`](https://github.com/kamrik/CordovaGulpTemplate)\
  \ 启发。\n\nCordova CLI 实际上只是 `cordova-lib` 项目的一个薄包装器。Cordova CLI 能做的一切，`cordova-lib`\
  \ 也能做。\n\n因为 Cordova 项目将是一个构建产物，我们需要能够创建 Cordova 项目，除了构建项目之外。我们还需要模拟和运行应用。为了实现这一点，我们需要创建一个名为\
  \ `gulp/utils/cordova-tasks.js` 的新工具文件。在顶部我们需要引入 `cordova-lib` 和其他所需的包：\n\n```javascript\n\
  var cordovaLib = require(\"cordova-lib\"),\n    pkg = require(\"../../package.json\"\
  ),\n    config = require(\"../config\"),\n    path = require(\"path\"),\n    settings\
  \ = require(\"../settings\"),\n    paths = require(\"../utils/paths\");\n\nvar cordova\
  \ = cordovaLib.cordova.raw;\n```\n\n接下来，让我们创建在 `build` 目录中创建新 Cordova 项目的代码：\n\n\
  ```javascript\nvar cordovaTasks = {\n  // CLI: cordova create ./build com.example.app\
  \ app_name\n  //              --copy-from template_path\n  create: function create()\
  \ {\n    return cordova.create(paths.makeFullPath(\".\", paths.DEST), \n      pkg.cordova.id,\
  \ pkg.cordova.name,\n      {\n        lib: {\n          www: {\n            url:\
  \ path.join(process.cwd(), pkg.cordova.template),\n            link: false\n   \
  \       }\n        }\n      });\n  }\n}\n\nmodule.exports = cordovaTasks;\n```\n\
  \n虽然这比命令行上的 `cordova create` 稍微复杂一些，但你应该能看到它们的相似之处。`lib` 对象被传递仅仅是为了给项目提供一个模板（相当于命令行上的\
  \ `--copy-from`）。在我们的例子中，`package.json` 指定这应该来自本书代码包中的 `blank/` 目录。如果我们不这样做，所有的应用都会使用\
  \ Cordova 默认安装的示例 Hello World 应用来创建。\n\n## 注意\n\n我们的空白项目模板位于相对于项目根目录的 `../blank`。你的可能位于其他地方（因为你可能会重用同一个模板），所以\
  \ `package.json` 可以使用你需要的任何路径。或者，你可能希望模板在你的项目根目录内；在这种情况下，`package.json` 应该使用项目根目录内的路径。\n\
  \n我们暂时不会创建任务来使用它。我们需要定义其他几个方法来构建和模拟 Cordova 应用。首先，我们需要向 `gulp/settings.js` 添加一些额外的设置：\n\
  \n```javascript\nvar settings = { …,\n  PLATFORM = gutil.env.platform ? gutil.env.platform\
  \ : \"ios\",\n  BUILD_MODE = gutil.env.mode ? gutil.env.mode : \"debug\",\n  BUILD_PLATFORMS\
  \ = (gutil.env.for ? gutil.env.for\n                                   : \"ios,android\"\
  ).split(\",\"),\n  TARGET_DEVICE = gutil.env.target ? \"--target=\" +\n        \
  \          gutil.env.target : \"\"\n}\n```\n\n接下来，让我们继续向 `cordovaTasks` 对象添加我们需要的其他方法：\n\
  \n\n\n\n# Cordova 任务配置\n\n```javascript\nvar cordovaTasks = {\n  create: function\
  \ create() {\n    /* as above */\n  },\n  cdProject: function cdProject() {\n  \
  \  process.chdir(paths.makeFullPath(\"www\", paths.DEST));\n  },\n  cdUp: function\
  \ cdUp() {\n    process.chdir(\"..\");\n  },\n  // cordova plugin add ...\n  addPlugins:\
  \ function addPlugins() {\n    cordovaTasks.cdProject();\n    return cordova.plugins(\"\
  add\", pkg.cordova.plugins)\n      .then(cordovaTasks.cdUp);\n  },\n  // cordova\
  \ platform add ...\n  addPlatforms: function addPlatforms() {\n    cordovaTasks.cdProject();\n\
  \    function transformPlatform(platform) {\n      return path.join(process.cwd(),\
  \ \"node_modules\",\n        \"cordova-\" + platform);\n    }\n    return cordova.platforms(\"\
  add\",\n      pkg.cordova.platforms.map(transformPlatform))\n      .then(cordovaTasks.cdUp);\n\
  \  },\n  // cordova build <platforms> --release|debug\n  //                    \
  \       --target=...|--device\n  build: function build() {\n    var target = settings.TARGET_DEVICE;\n\
  \    cordovaTasks.cdProject();\n    if (!target || target === \"\" ||\n      target\
  \ === \"--target=device\") {\n      target = \"--device\";\n    }\n    return cordova.build({\n\
  \      platforms: settings.BUILD_PLATFORMS,\n      options: [\"--\" + settings.BUILD_MODE,\
  \ target]\n    }).then(cordovaTasks.cdUp);\n  },\n  // cordova emulate ios|android\
  \ --release|debug\n  emulate: function emulate() {\n    cordovaTasks.cdProject();\n\
  \    return cordova.emulate({\n      platforms: [settings.PLATFORM],\n      options:\
  \ [\"--\" + settings.BUILD_MODE, \n        settings.TARGET_DEVICE]\n    }).then(cordovaTasks.cdUp);\n\
  \  },\n  // cordova run ios|android --release|debug\n  run: function run() {\n \
  \   cordovaTasks.cdProject();\n    return cordova.run({\n      platforms: [settings.PLATFORM],\n\
  \      options: [\"--\" + settings.BUILD_MODE, \"--device\",\n        settings.TARGET_DEVICE]\n\
  \    }).then(cordovaTasks.cdUp);\n  },\n  init: function() {\n    return cordovaTasks.create()\n\
  \      .then(cordovaTasks.copyConfig)\n      .then(cordovaTasks.addPlugins)\n  \
  \    .then(cordovaTasks.addPlatforms);\n  }\n};\n```\n\n## 注意\n\n如果你不熟悉 Promise，可能想进一步了解它们。[`www.html5rocks.com/en/tutorials/es6/promises/`](http://www.html5rocks.com/en/tutorials/es6/promises/)\
  \ 是一个极好的资源。\n\n大多数前面的任务应该相当不言自明；它们直接对应各自的 Cordova CLI 命令。然而，有几个任务需要更多解释：\n\n###\
  \ `cdProject` / `cdUp`\n\n这些函数会更改当前工作目录。`create` 之后的所有 `cordova-lib` 命令都需要在 Cordova\
  \ 项目目录中执行，而不是在我们项目的根目录中。你应该会在多个任务中注意到它们。\n\n### `addPlatforms`\n\n平台是直接从我们项目的依赖中添加的，而不是从\
  \ Cordova CLI。这使我们能够控制所使用的平台版本。因此，`addPlatforms` 需要做一些额外工作来指定每个平台的实际目录名称。\n\n###\
  \ `build`\n\n这将执行 `cordova build` 命令。默认情况下，CLI 会构建每个平台。既然我们想要控制要构建的平台，因此可以使用 `BUILD_PLATFORMS`\
  \ 来控制此行为。在 iOS 上，为模拟器构建与为物理设备构建是不同的。所以我们也需要一种方式来指定这一点，这就是 `TARGET_DEVICE` 的作用。它将查找为\
  \ `TARGET_DEVICE` 指定名称的模拟器。但我们可能想为物理设备构建；在这种情况下，我们将查找 `device`（或根本不指定目标），并切换到 `--device`\
  \ 标志，这会强制 Cordova 为物理设备构建。\n\n### `init`\n\n这完成了创建 Cordova 项目、复制配置文件（并执行替换）、向 Cordova\
  \ 项目添加插件，然后添加平台的繁重工作。\n\n## Gulp 命令行开关\n\n现在也是提及我们可以通过 Gulp 命令行开关指定各种设置的好时机。在前面的代码片段中，我们支持使用\
  \ `--platform` 指定要模拟或运行的平台，`--mode` 指定构建模式（`debug` 或 `release`），`--for` 确定 Cordova\
  \ 将为哪些平台构建，以及 `--target` 指定目标设备。如果未指定这些开关，代码会指定合理的默认值；但它们也允许开发者对工作流程有额外的控制，这非常有用。例如，我们将能够使用如下命令：\n\
  \n```\n$ gulp build --for ios,android --target device\n$ gulp emulate --platform\
  \ ios --target iPhone-6s\n$ gulp run --platform ios --mode release\n```\n\n## Gulp\
  \ 任务文件\n\n接下来，让我们编写实际执行各种 Cordova 任务的代码。这并不难，但我们需要创建许多文件。下面代码中的每个文件名都在注释中：\n\n###\
  \ `gulp/tasks/clean.js`\n\n```javascript\nvar paths = require(\"../utils/paths\"\
  ),\n    config = require(\"../config\"),\n    rimraf = require(\"rimraf\");\nfunction\
  \ clean(cb) {\n    var BUILD_PATH = paths.makeFullPath(\".\", paths.DEST);\n   \
  \ rimraf(BUILD_PATH, cb);\n}\nmodule.exports = {\n    task: clean\n}\n```\n\n###\
  \ `gulp/tasks/init.js`\n\n```javascript\nvar cordovaTasks = require(\"../utils/cordova-tasks\"\
  );\nmodule.exports = {\n  deps: [\"clean\"],\n  task: cordovaTasks.init\n};\n```\n\
  \n### `gulp/tasks/build.js`\n\n```javascript\nvar cordovaTasks = require(\"../utils/cordova-tasks\"\
  );\nmodule.exports = {\n  deps: [\"copy\"],\n  task: cordovaTasks.build\n};\n```\n\
  \n### `gulp/tasks/emulate.js`\n\n```javascript\nvar cordovaTasks = require(\"../utils/cordova-tasks\"\
  );\nmodule.exports = {\n  deps: [\"copy\"],\n  task: cordovaTasks.emulate\n};\n\
  ```\n\n### `gulp/tasks/run.js`\n\n```javascript\nvar cordovaTasks = require(\"../utils/cordova-tasks\"\
  );\nmodule.exports = {\n  deps: [\"copy\"],\n  task: cordovaTasks.run\n};\n```\n\
  \n## 任务依赖\n\n`init` 任务有个陷阱：如果 `build/` 目录中已有任何内容，它将会失败。正如你所料，这很容易发生；所以我们还创建了一个 `clean`\
  \ 任务。它使用 `rimraf` 删除指定目录，相当于使用 `rm -rf build`。然后我们确保 `init` 依赖于 `clean`。因此，每当我们执行\
  \ `gulp init` 时，旧的 Cordova 项目会被移除，并为我们创建一个新的项目。\n\n最后，请注意所有的 `build`（和其他）任务都依赖于\
  \ `copy`。这意味着在执行所需的 Cordova 命令之前，我们 `src/` 中的所有文件都将被复制（并在必要时转换）到 `build/` 中。正如你所见，我们的任务已经变得非常复杂，但单独来看仍然易于理解。\n\
  \n## 可用的 Gulp 命令\n\n这意味着我们现在可以在 Gulp 中使用以下任务：\n\n```\n$ gulp init              \
  \     # 创建 cordova 项目；\n                              # 如果需要先清理\n$ gulp clean  \
  \                # 移除 cordova 项目\n$ gulp build                  # 复制 src 到 build；应用\n\
  \                              # 转换；cordova build\n$ gulp build --mode release \
  \  # 执行上述操作，但以\n                              # release 模式构建\n$ gulp build --for\
  \ ios        # 仅为 iOS 构建\n$ gulp build --target=device  # 构建设备版本而不是\n          \
  \                    # 模拟器版本\n$ gulp emulate --platform ios # 复制 src 到 build；应用\n\
  \                              # 转换；\n                              # cordova emulate\
  \ ios\n$ gulp emulate --platform ios --target iPhone-6\n                       \
  \       # 同上，但打开\n                              # iPhone 6 模拟器\n$ gulp run --platform\
  \ ios     # 复制 src 到 build；\n                              # 应用转换；\n           \
  \                   # cordova run ios --device\n```\n\n\n\n\n## 使用 `cordova-tasks`\
  \ 包简化 Gulp 配置\n\n现在，你可以继续使用之前的代码，也可以使用一个 NPM 包来处理 `cordovaTasks` 部分。这样做的好处是能大幅简化你的\
  \ Gulp 配置。我们已经在 `package.json` 文件和 Gulp 配置中包含了这个包。它名为 `cordova-tasks`，由作者创建。它与之前的代码有很多相似之处。要了解它的工作原理（以及任务变得多么简单），请参阅代码包中的\
  \ `logology-v01/gulp`。\n\n这是一个比较复杂的部分；如果你已经读到这里，不妨喝杯咖啡休息一下。接下来，我们将担心如何管理应用版本号。\n\
  \n## 使用 `gulp-bump` 管理应用版本号\n\n虽然我们已经设置了 `copy-config` 和 `copy-code` 任务，在遇到 `{{{VERSION}}}`\
  \ 时替换版本号，但我们没有任何任务真正去修改版本。我们当然可以直接编辑 `package.json`。但这很繁琐，而且无法自动包含在其他 Gulp 任务中。相反，让我们使用\
  \ `gulp-bump` 插件来处理这件事。\n\n`gulp-bump` 是一个非常简单的插件：它旨在获取 `package.json`（或类似）文件，并根据特定命令编辑\
  \ `version` 属性。大多数版本采用 `major.minor.patch` 形式，我们可以要求它将任一部分加一。如果你愿意，可以增加版本的 `patch`\
  \ 部分以自动跟踪构建号。\n\n操作非常简单。首先，让我们创建另一个工具文件，这次叫作 `gulp/utils/bump.js`：\n\n```\nvar gulp\
  \ = require(\"gulp\");\nvar bump = require(\"gulp-bump\");\n\nmodule.exports = function\
  \ bump(importance) {\n  return gulp.src([path.join(process.cwd(), \"package.json\"\
  )])\n             .pipe(bump({type: importance}))\n             .pipe(gulp.dest(process.cwd()));\n\
  }\n```\n\n`importance` 变量可以是以下字符串之一：`major`、`minor` 或 `patch`。接下来，让我们创建三个任务，以便直接调用此方法（同样，它们位于三个单独的文件中，在注释中指明）：\n\
  \n```\n// gulp/tasks/version-bump-patch.js\nvar bump = require(\"../utils/bump\"\
  );\nmodule.exports = {\n    task: bump.bind(null, \"patch\")\n}\n\n// gulp/tasks/version-bump-minor.js\n\
  var bump = require(\"../utils/bump\");\nmodule.exports = {\n    task: bump.bind(null,\
  \ \"minor\")\n}\n\n// gulp/tasks/version-bump-major.js\nvar bump = require(\"../utils/bump\"\
  );\nmodule.exports = {\n    task: bump.bind(null, \"major\")\n}\n```\n\n现在你可以通过执行\
  \ `gulp version-bump-patch` 直接增加版本号。不过，这只会编辑 `package.json`。如果你想让 `build/` 中的文件反映此更改，还需要执行\
  \ `gulp copy`（或 `build` 等）。\n\n## 使用 Babel 转译 ES2015\n\n我们在本章中已经提到了 ES2015（或 EcmaScript\
  \ 2015）。现在是开始使用它的时候了。不过首先，我们需要修改 `copy-code` 任务，将 ES2015 转译为 ES5，否则我们的代码将无法在任何不支持新语法的浏览器上运行（目前仍有不少移动平台不支持）。\n\
  \n有几种转译器可用。我倾向于使用 Babel（[`babeljs.io`](https://babeljs.io)）。\n\n### Tip\n\n我们使用的是\
  \ Babel 5.x。虽然 Babel 6 最近已发布，但截至本书撰写时，演示应用和相应的 Gulp 配置尚未更新到 Babel 6.x。\n\n我们可以使用一个\
  \ Gulp 插件，使这种转译变换变得极其简单。为此，我们需要在 `gulp/tasks/copy-code.js` 顶部添加以下内容：\n\n```\nvar\
  \ …,\n    babel = require(\"gulp-babel\"),\n    sourcemaps = require(\"gulp-sourcemaps\"\
  ),\n    gutil = require(\"gulp-utils\");\n```\n\n### Tip\n\nSource maps 是调试拼图中重要的一块。当我们的代码在设备上运行时已被转换，调试可能会变得更困难，因为行号等不匹配。Sourcemaps\
  \ 为浏览器提供了 ES2015 代码与最终结果之间的映射，使调试容易得多。\n\n接下来，让我们修改 `projectTasks.copyCode` 方法：\n\
  \n```\nfunction copyCode() {\n    var isRelease = (settings.BUILD_MODE === \"release\"\
  );\n    return gulp.src([paths.makeFullPath(config.assets.code.src, \n      paths.SRC)])\n\
  \               .pipe(cordovaTasks.performSubstitutions())\n               .pipe(settings.BUILD_MODE\
  \ === \"debug\" ? \n                 sourcemaps.init() : gutil.noop())\n       \
  \        .pipe(babel())\n               .pipe(concat(\"app.js\"))\n            \
  \   .pipe(settings.BUILD_MODE === \"debug\" ? \n                 sourcemaps.write()\
  \ : gutil.noop())\n               .pipe(gulp.dest(paths.makeFullPath(\n        \
  \         config.assets.code.dest, paths.DEST)));\n}\n```\n\n我们的任务现在稍微复杂一些；但这只是因为我们想控制何时生成\
  \ source maps。调用 `babel()` 时，它会将 ES2015 代码转换为 ES5，并生成变更的 sourcemap。这使调试更容易，但也会增加文件大小（有时增加不少）。因此，在发布模式下构建时，我们不想包含\
  \ sourcemaps。所以我们将调用 `gutil.noop`，它什么都不做。\n\nSourcemap 功能要求我们在任何可能生成 sourcemaps\
  \ 的 Gulp 插件之前调用 `sourcemaps.init`。在创建 sourcemaps 的插件执行后，我们还必须调用 `sourcemaps.write`\
  \ 将 sourcemap 保存回流中。我们也可以通过调用 `sourcemaps.write(\".\")` 将 sourcemap 写入单独的 `.map`\
  \ 文件。但在创建发布构建时，你需要小心清理该文件。\n\n`babel` 完成将 ES2015 代码转换为 ES5 的实际繁重工作。但它需要一个小型支持库的帮助。我们将通过从\
  \ `gulp-babel` 模块复制，将此库添加到 `src/www/js/lib/`：\n\n```\n$ cp node_modules/babel-core/browser-polyfill.js\
  \ src/www/js/lib\n```\n\n### Note\n\n如果你还没有 `src/www/js/lib/` 目录，需要在执行上述命令前创建它。\n\
  \n接下来，我们需要编辑 `src/www/index.html` 以包含此脚本。顺便再做一些其他更改：\n\n```\n<!DOCTYPE html>\n<html>\n\
  \  <head>\n    <script src=\"cordova.js\" type=\"text/javascript\"></script>\n \
  \   <script src=\"./js/lib/browser-polyfill.js\"\n            type=\"text/javascript\"\
  ></script>\n    <script src=\"./js/app/app.js\"\n            type=\"text/javascript\"\
  ></script>\n  </head>\n  <body>\n    <p>This is static content...,\n       but below\
  \ is dynamic content.</p>\n    <div id=\"demo\"></div>\n  </body>\n</html>\n```\n\
  \n最后，让我们在 `src/www/js/app/index.js` 中编写一些 ES2015 代码：\n\n```\nfunction h(elType,\
  \ ...children) {\n  let el = document.createElement(elType);\n  for (let child of\
  \ children) {\n    if (typeof child !== \"object\") {\n      el.textContent = child;\n\
  \    } else if (child instanceof Array) {\n      child.forEach(el.appendChild.bind(el));\n\
  \    } else {\n      el.appendChild(child);\n    }\n  }\n  return el;\n}\n\nfunction\
  \ startApp() {\n  document.querySelector(\"#demo\").appendChild(\n    h(\"div\"\
  ,\n      h(\"ul\", h(\"li\", \"Some information about this app...\"),\n        h(\"\
  li\", \"App name: {{{NAME}}}\"),\n        h(\"li\", \"App version: {{{VERSION}}}\"\
  )\n      )\n    )\n  );\n}\n\ndocument.addEventListener(\"deviceready\", startApp,\
  \ false);\n```\n\n本章不是关于*如何*编写 ES2015 代码，所以我不会用所有细节让你感到厌烦。我们将在下一章介绍。简而言之，前面的代码在应用运行时使用一种非常简单的\
  \ DOM 模板形式生成几个列表项。但它使用了 `…`（spread）语法处理可变参数、`for … of` 循环以及 `let` 代替 `var`。虽然它看起来很像\
  \ JavaScript，但 ES2015 差异足够大，需要一些时间来学习如何最好地使用新特性。\n\n\n\n\n\n## 添加代码检查与代码风格检查\n\n\
  你现在可以执行 `gulp emulate --platform ios`（或 `android`）；应用应该能正常运行。但我们如何知道代码构建后是否能工作？更进一步说——如果代码无效，如何*阻止*构建？\n\
  \n我们通过向 `Gulp` 配置添加 `lint` 任务来实现这一点。代码检查很像编译；检查器会检查代码中的明显错误，如果发现任何错误则中止。有各种检查器可用（有些比其他的好），但并非所有都支持\
  \ `ES2015` 语法。目前支持得最好的是 `ESLint` ([`www.eslint.org`](http://www.eslint.org))。幸运的是，有一个非常简单的\
  \ `Gulp` 插件可以使用它。\n\n我们本可以只做代码检查就结束了，但代码风格也很重要，也能捕捉潜在的严重问题。因此，我们还将使用 JavaScript\
  \ 代码风格检查器，即 `JSCS` ([`github.com/jscs-dev/node-jscs`](https://github.com/jscs-dev/node-jscs))。\n\
  \n### 配置代码检查与代码风格路径\n\n让我们创建任务来检查代码和代码风格。首先，我们需要向 `gulp/config.js` 添加一些额外配置：\n\n\
  ```\nvar config = { …,\n    lint: \"src/www/js/app/**/*.js\",\n    \"code-style\"\
  : \"src/www/js/app/**/*.js\"\n}\n```\n\n### 创建代码检查任务\n\n现在，让我们创建关联的任务。从代码检查开始——它将位于\
  \ `gulp/tasks/link.js` 文件中：\n\n```\nvar gulp = require(\"gulp\"),\n    eslint =\
  \ require(\"gulp-eslint\"),\n    config = require (\"../config\"),\n    settings\
  \ = require(\"../settings\"),\n    paths = require(\"../utils/paths\");\nfunction\
  \ lintCode() {\n    return gulp.src(paths.makeFullPath(config.lint))\n        .pipe(eslint(paths.makeFullPath(\"\
  eslint.json\", \n          paths.CONFIG)))\n        .pipe(eslint.format());\n}\n\
  module.exports = {\n    task: lintCode\n}\n```\n\n### 创建代码风格任务\n\n用于检查代码风格的任务将命名为\
  \ `gulp/tasks/code-style.js`。它应包含以下代码：\n\n```\nvar gulp = require(\"gulp\"),\n \
  \   jscs = require(\"gulp-jscs\"),\n    config = require (\"../config\"),\n    settings\
  \ = require(\"../settings\"),\n    paths = require(\"../utils/paths\");\nfunction\
  \ checkCodeStyle() {\n    return gulp.src(paths.makeFullPath(config[\"code-style\"\
  ]))\n        .pipe(jscs({\n            configPath: paths.makeFullPath(\"jscs.json\"\
  , \n                          paths.CONFIG),\n            esnext: true\n       \
  \ }))\n        .pipe(jscs.reporter())\n        .pipe(jscs.reporter('fail'));\n}\n\
  module.exports = {\n    task: checkCodeStyle\n}\n```\n\n### 配置文件\n\n现在，在运行任一任务之前，你需要两个配置文件来告诉每个任务什么应该是错误，什么不应该是。我们建议暂时使用本章代码包中的文件（你可以在\
  \ `logology-v01/config` 目录中找到它们）。如果你想更改设置，可以自行修改；`ESLint` 和 `JSCS` 的网站上都有关于如何修改配置文件的信息。\n\
  \n### 提示\n\n`config/eslint.json` 必须包含 `\"parser\": \"babel-eslint\"` 以强制其使用 `ES2015`\
  \ 语法。不过，这在 `Gulp` 配置中是为 `JSCS` 设置的。\n\n`config/jscs.json` 必须存在且不能为空。如果你不需要指定任何规则，请使用空的\
  \ JSON 对象（`{}`）。\n\n现在，如果你执行 `gulp lint` 而源代码有语法错误，你会收到错误消息。代码风格同理；如果 `gulp code-style`\
  \ 不喜欢代码的外观，就会生成错误。\n\n### 注意\n\n代码检查和风格检查**不能**保证你的代码在*逻辑上*工作。它只确保没有语法或风格错误。如果你的程序对手势响应不正确或错误处理某些数据，检查器不一定能捕捉到这些问题。\n\
  \n## 集成到构建流程\n\n接下来，你应该将这两个任务添加到我们的构建、模拟和运行任务中。以下是添加后 `gulp/tasks/build.js` 的 `module.exports`\
  \ 样子：\n\n```\nmodule.exports = {\n    deps: [\"copy\", \"lint\", \"code-style\"\
  ],\n    task: …\n}\n```\n\n现在，如果你执行 `gulp build` 且存在代码检查或代码风格错误，构建将失败并报错。这在分发或运行代码前，能稍微增加一些代码至少在语法上有效的保证。\n\
  \n## 代码丑化（压缩）\n\n代码丑化或压缩听起来有点痛苦，但这是我们可以添加到工作流中的一个非常简单的步骤。它会在我们以发布模式构建时减小应用程序的体积。丑化也倾向于稍微混淆代码，但不要依赖这一点来保证安全——混淆很容易被逆向。\n\
  \n要添加代码丑化，请将以下代码行添加到 `gulp/tasks/copy-code.js` 文件的顶部：\n\n```\nvar …,\n    uglify\
  \ = require(\"gulp-uglify\");\n```\n\n然后我们可以通过在 `projectTasks.copyCode` 方法中 `.pipe(concat(\"\
  app.js\"))` 后立即添加以下代码来丑化代码：\n\n```\n.pipe(isRelease ? uglify({preserveComments:\
  \ \"some\"}) :\ngutil.noop())\n```\n\n注意，我们仅在构建模式为 `release` 时添加了 `uglify` 方法。这意味着只有当我们执行\
  \ `gulp build --mode release` 时才会触发它。\n\n当然，你可以指定其他选项。如果想查看所有文档，请访问 [`github.com/mishoo/UglifyJS2/`](https://github.com/mishoo/UglifyJS2/)。我们的选项包括保留某些注释（很可能是与许可证相关的），同时剥离所有其他注释。\n\
  \n## 默认任务\n\n你已经完成了不少工作，但还有一件事要提：`default` 任务。如果 `gulp` 在没有参数的情况下运行，它会寻找要执行的默认任务。这可以是你想要的任何东西。\n\
  \n要指定它，只需在 `gulp/tasks/default.js` 添加以下任务：\n\n```\nmodule.exports = {\n    deps:\
  \ [\"build\"]\n}\n```\n\n现在，如果你不带特定任务执行 `gulp`，实际上会启动 `build` 任务。你想用作默认任务的内容很大程度上取决于你的偏好。\n\
  \n## 总结\n\n你的 `Gulp` 配置现在已经相当庞大和复杂。我们在代码包中添加了一些额外功能，所以查看本书代码包中的最终版本是个好主意。我们还向配置中添加了其他一些功能，你可能想进一步研究。它们如下：\n\
  \n*   用于快速迭代和测试的 `BrowserSync`\n*   控制错误是否阻止后续任务执行的能力\n*   帮助文本\n\n在本章中，你学习了为什么任务运行器很有用，以及如何安装\
  \ `Gulp` 并创建不同复杂度的任务来自动化项目的构建过程和其他有用任务。我们还没玩完 `Gulp`。在下一章，我们将讨论使用 `Browserify` 进行模块化，以及如何将其集成到我们的构建任务中。\n"
- "## ES2015 和 Browserify\n\n`JavaScript` 迅速成为 Web 的*通用语言*，其语法和语义早就需要改进。`ECMAScript\
  \ 2015` 引入了大量语法糖，使编写 `JavaScript` 更容易。它还提供了许多新的有用概念，简化了应用程序开发。我们在上一章简要介绍了 `ES2015`。我们将深入探讨\
  \ `ES2015`，因为熟悉新语法的样子很重要。\n\n此外，重用自己的工作和他人的工作非常有用。但这需要你管理依赖关系并确保包含适当的库。手动做这件事很痛苦；但你可以利用\
  \ `Browserify` 等工具来协助。`Browserify` 不仅打包你的 `JavaScript` 文件及其依赖，还为浏览器提供类 `Node.js`\
  \ 的环境。这意味着你可以重用 `Node.js` 使用的庞大 `JavaScript` 仓库的大部分。毕竟，如果别人已经完成了艰苦的工作，为什么要重复造轮子？\n\
  \n在本章中，我们将涵盖：\n\n*   新的 `ES2015` 语法\n*   使用 `Browserify`\n\n\n\n\n本章中的多个代码片段也可以通过随本书代码包附带的交互式代码片段演练场来使用。启动演练场的说明在代码包中的\
  \ `README.md` 文件里。启动后，选择 `2: ES2015 and Browerify`，然后浏览并尝试相邻下拉菜单中的示例。如果适用，每个章节和代码片段都会指示你应该选择哪个示例。\n\
  \n虽然我们在上一章简要涉及了 `ES2015` (`ECMAScript 2015`)，但你可能还不太熟悉它。大多数浏览器（尤其是移动端）对 `ES2015`\
  \ 要么完全支持，要么完全不支持。这很遗憾，因为语法和语义方面有巨大的改进，使得创建复杂的移动应用变得更容易。\n\n所幸的是，正如你在上一章所见，有一些工具可以将这些功能转换回\
  \ `ES5`，而 `ES5` 在现代浏览器中得到了*非常好*的支持。这些工具将 `ES2015` 的语法和语义转换为其 `ES5` 的等价形式（在可能的情况下）。在无法完美等价的情况下，转换会尽可能接近，这仍然会给我们带来巨大的好处。\n\
  \n我们无法在本书中涵盖 `ES2015` 中的*每一项*新变化；但我们确实需要过一遍一些常见示例，特别是如果你不熟悉该语法的话。\n\n### 注意\n\n\
  如果你是为旧设备开发，且打算使用 `ES2015` 代码，你将需要特别关注应用的性能特征。`ES2015` 代码不一定比 `ES5` 快，尤其是在经过转译时。遗憾的是，即使是\
  \ `ES2015` 的原生实现也不总是更快，因此你必须在开发效率和代码可读性的收益与应用的实际性能之间取得平衡。\n\n## 块级作用域\n\n正确理解变量作用域是\
  \ `ES5` 中开发者遇到的一个非常常见的陷阱。变量不是 `block-scoped`（块级作用域，这是大多数具有块概念的语言的典型特征），而是 `function-scoped`（函数级作用域）。变量定义会被提升到函数定义的顶部，这意味着很容易在变量实际赋值前就使用它们，也很容易重新定义变量（这在\
  \ `for` 循环中很典型）。因为这种提升从源代码中并不明显，所以很容易导致意外的惊喜。\n\n另一方面，块级作用域变量允许我们指明变量仅在函数的特定部分有效。我们可以在需要时重用变量名（这对\
  \ `for` 循环有益），而无需担心不必要的副作用或意外。让我们看看它们在定义和赋值方面的区别：\n\n| ES5 | ES2015 | 说明 |\n| ---\
  \ | --- | --- |\n| `var x;` | `let x;` | `x` 已定义，但无值 |\n| `var y = 5;` | `let y\
  \ = 5;` | `y` 已定义且值为 `5` |\n| N/A | `const z = 5;` | `z` 永远不能重新赋值 |\n| `for(var\
  \ i=0,l=5;i<l;i++)` | `for(let i=0,l=5;i<l;i++)` | 迭代 `5` 次 |\n\n### 注意\n\n本节的代码片段位于本书代码包中的\
  \ `snippets/02/ex1-block-scope/a` 和 `snippets/02/ex1-block-scope/b`。使用交互式代码片段演练场，在第一个下拉菜单中选择\
  \ `2: ES2015 and Browserify`，在第二个中选择示例 `1a` 和 `1b`。\n\n```\n// Snippet Example 1a\n\
  // Snippet Example 1a\nvar i = 10, // [1]\n    x = 0;\nconsole.log(i); // 10\nfor\
  \ (var i = 0, l = 5; i < l; i++) { // [2]\n  x += i;\n}\nconsole.log(x); // 10 (0+1+2+3+4)\n\
  console.log(i); // 5 [3]\nconsole.log(l); // 5\n```\n\n注意，在 `[1]` 中定义的 `i` 的值被 `[2]`\
  \ 中的 `for` 循环覆盖了（正如你在 `[3]` 中看到的）。根据代码的编写方式，这是一个惊喜，特别是对于不理解变量是函数级作用域的人来说。现在，让我们看看\
  \ `ES2015` 中的代码：\n\n```\n// Snippet Example 1b\nlet i = 10,\n    x = 0;\nconsole.log(i);\
  \ // 10\nfor (let i = 0, l = 5; i < l; i++) {\n  x += i;\n}\nconsole.log(x); //\
  \ 10 (0+1+2+3+4)\nconsole.log(i); // 10\nconsole.log(l); // Error: Can't find variable:\
  \ l\n```\n\n注意 `i` 不再被覆盖了——为循环的持续时间创建了一个新变量。此外，注意 `l` *完全*不可用；循环结束时它就超出了作用域。\n\n\
  防止变量多次定义是 `let` 和 `const` 的另一个重要特性。`ES5` 在变量被定义多次时不会报错，这导致了前面示例中的意外惊喜。而 `ES2015`\
  \ 如果你尝试在同一作用域内重新定义变量，*会*报错。例如：\n\n```\nlet i = 10;\nlet i = 20; // Error: Duplicate\
  \ definition \"i\"\n```\n\n### 提示\n\n重要的是要认识到 `var` 并没有消失；使用 `var` 定义变量完全有效。但是，如果你这样做，你需要知道这些变量按\
  \ `function-scope`（函数作用域）运行，且不继承任何 `ES2015` 行为。\n\n## 箭头函数\n\nJavaScript 一直严重依赖\
  \ `function` 关键字，这往往导致一些难以阅读且包含大量样板代码的代码。请看这个 `ES5` 片段：\n\n```\n// Snippet Example\
  \ 2a\n[1, 2, 3].map(function(val) {\n  return val * 2;\n}).forEach(function(val)\
  \ {\n  console.log(val);\n});\n// console displays:\n// 2\n// 4\n// 6\n```\n\n###\
  \ 注意\n\n本节的代码片段位于本书代码包中的 `snippets/02/ex2-fat-arrow-functions/a` 和 `snippets/02/ex2-fat-arrow-functions/e`。使用交互式代码片段演练场，在第一个下拉菜单中选择\
  \ `2: ES2015 and Browserify`，在第二个下拉菜单中选择示例 `2a-2e`。\n\n虽然这个片段很容易理解，但一直输入 `function`\
  \ 和 `return` 有点烦人。使用 `ES2015`，我们可以改用以下箭头语法：\n\n```\n// Snippet Example 2b\n[1, 2,\
  \ 3].map(val => val * 2)\n  .forEach(val => console.log(val));\n// console displays\
  \ the same output as before\n```\n\n这些箭头函数的形式根据所需参数的数量而不同。以下是一些示例：\n\n```\n// no\
  \ parameters; note the empty parentheses\n[1, 2, 3].map(() => 2); // [2, 2, 2]\n\
  ```\n\n```\n// one parameter; no parentheses required\n[1, 2, 3].map(val => val\
  \ * 2); // [2, 4, 6]\n```\n\n```\n// multiple parameters; parentheses required\n\
  [1, 2, 3].map((val, idx) => val * idx); // [0, 2, 6]\n```\n\n注意没有任何 `return` 关键字；箭头后面表达式的结果被假定为返回值。隐式\
  \ `return` 仅对单个表达式有效；如果你需要多条语句，必须使用大括号并提供 `return`，如下所示：\n\n```\n[1, 2, 3].map((val,\
  \ idx) => {\n  console.log(val);\n  return val * idx;\n});\n```\n\n箭头函数还具有*词法* `this`\
  \ 值的概念。JavaScript 中 `this` 在任何时间点到底指向什么一直有点难以理解，尤其是在学习语言时。它仍然经常让经验丰富的开发者绊倒。当你做类似以下事情时，问题就出现了：\n\
  \n```\n// Snippet Example 2c\nvar o = {\n  a: [1, 2, 3],\n  b: 5,\n  doMul: function()\
  \ {\n    return this.a.map(function(val) {\n      return val * this.b;\n    });\n\
  \  }\n}\nconsole.log(o.doMul());\n```\n\n虽然这看起来像一段完全无害的代码（我们期望控制台输出 `[5, 10, 15]`），但它实际上会抛出一个错误：`undefined\
  \ is not an object (evaluating this.b)`。`doMul` 内部的 `this` 引用指向对象 `o`，但当 `this`\
  \ 在映射函数内部使用时，它不指向 `o`。我们可以通过稍微修改代码来解决这个问题，如下所示：\n\n\n\n# ES2015 特性：箭头函数、对象简写、默认参数、剩余参数和解构赋值\n\
  \n## 箭头函数与词法 `this`\n\n```javascript\n// Snippet Example 2d\nvar o = {\n  ...,\n\
  \  doMul: function() {\n    return this.a.map(function(val) {\n      return val\
  \ * this.b;\n    }, this); // map accepts a this parameter to apply to the callback\n\
  \  }\n}\n```\n\n对于不接受 `this` 参数的任何方法，我们也可以使用 `bind` 及其相关方法。但如果我们根本不需要担心这个问题呢？在 ES2015\
  \ 中，我们可以这样写：\n\n```javascript\n// Snippet Example 2e\nlet o = {\n  a: [1, 2, 3],\n\
  \  b: 5,\n  doMul() {\n    return this.a.map(val => val * this.b);\n  }\n}\n```\n\
  \n### 注意\n\nES2015 并没有消除 `this` 的各种怪癖，所以你仍然需要留意自己代码中 `this` 的任何误用。但词法 `this` 值确实有助于缓解这一特定痛点。\n\
  \n然而，因为箭头函数拥有自己的词法上下文，所以你不能在所有可能使用普通函数的地方都使用它们。如果函数需要通过 `bind`（或类似方式）提供许多不同的上下文，你最好改用普通函数。\n\
  \n## 更简洁的对象定义\n\nJavaScript 中的对象定义相当冗长。例如，请看下面的代码片段：\n\n```javascript\n// Snippet\
  \ Example 3a\nfunction makePoint(x, y) {\n  return {\n    x: x,\n    y: y\n  };\n\
  }\nconsole.log(makePoint(5, 10)); // {x: 5, y: 10}\n```\n\n### 注意\n\n本节的代码片段位于本书代码包中的\
  \ `snippets/02/ex3-object-definitions/a` 和 `snippets/02/ex3-object-definitions/b`。使用交互式代码片段演练场，在第一个下拉菜单中选择\
  \ **2: ES2015 and Browserify**，在第二个下拉菜单中选择示例 **3a** 和 **3b**。\n\n在前面的例子中，似乎有点多余地指定了两次\
  \ `x` 和 `y`，不是吗？虽然在这个例子中这并不算特别繁琐，但在 ES2015 中，我们可以写成如下形式，简洁得多：\n\n```javascript\n\
  // Snippet Example 3b\nfunction makePoint (x, y) {\n  return {x, y};\n}\nconsole.log(makePoint(5,10));\
  \ // {x: 5, y: 10}\n```\n\n在 ES2015 中，键名是可选的。如果未提供，ES2015 会假定键名应与变量名匹配。在前面的例子中，生成的对象将有两个键，即\
  \ `x` 和 `y`，它们将拥有传递给该函数的值。\n\n函数也可以使用这种简写来指定，正如你在上一节所见。不必输入 `myFunction: function()\
  \ {…}`，ES2015 允许你指定 `myFunction() {…}`。\n\n## 默认参数\n\n编写带有可选参数的函数非常常见。当这些参数未提供时，会改用默认值。不幸的是，这种实现方式往往充满了问题和潜在的惊喜，并导致了许多\
  \ bug。在 ES5 中，默认参数通常按如下方式处理：\n\n```javascript\n// Snippet Example 4a\nfunction mul(a,\
  \ b, log) {\n  var ans = a * b;\n  if (log === true) {\n    console.log(a, b, ans);\n\
  \  }\n}\nmul(2, 4); // doesn't log anything\nmul(4, 8, true); // logs 4 8 32\n```\n\
  \n### 注意\n\n本节的代码片段位于本书代码包中的 `snippets/02/ex4-default-arguments/a` 和 `snippets/02/ex4-default-arguments/b`。使用交互式代码片段演练场，在第一个下拉菜单中选择\
  \ **2: ES2015 and Browserify**，在第二个下拉菜单中选择示例 **4a** 和 **4b**。\n\n虽然这在*技术上*可行，但远非理想，因为从代码快速阅读中并不明显\
  \ `log` 实际上是可选的。此外，如果变量检查不正确，很容易陷入令人惊讶的情况（例如，`if (log)` *不等同于* `if (log===true)`）。\n\
  \n### 注意\n\n也经常看到以下模式：\n\n```javascript\nfunction repeat (a, times) {\n  for (var\
  \ i = 0; i < (times || 1) /*[1]*/; i++) {\n    console.log(a);\n  }\n}\n```\n\n\
  遗憾的是，如果我们用 `times` 设为零来调用此方法，这将导致错误行为。因为零是假值，[1] 处的表达式实际上会求值为 1，而不是 0。\n\n如果能完全避免这团糟就好了。ES2015\
  \ 让我们可以用以下方式编写前面的代码：\n\n```javascript\n// Snippet Example 4b\nfunction mul(a, b,\
  \ log = false) {\n  var ans = a * b;\n  if (log === true) { // [1]\n    console.log(a,\
  \ b, ans);\n  }\n}\n```\n\n这对 JavaScript 的真值概念没有任何作用（所以，我们仍应保留 `[1]` 处的检查）。然而，它确实让读者一眼就能看出\
  \ `log` 是可选的，以及如果未提供时将接收什么值。\n\n## 可变参数（剩余参数）\n\nJavaScript 中另一种常见模式是编写接受可变数量参数的方法。常见的例子是\
  \ `console.log` 方法——它接受多个值并将每个值记录到控制台。我们可以仿照它的例子编写一个简单的 `sum` 方法。首先让我们看看 ES5 中的写法：\n\
  \n```javascript\n// Snippet Example 5a\nfunction sum() {\n  var args = [].slice.call(arguments);\n\
  \  return args.reduce(\n    function(prev, cur) {\n      return prev + cur;\n  \
  \  }, 0);\n}\nconsole.log(sum(1, 2, 3, 4, 5)); // 15\n```\n\n### 注意\n\n本节的代码片段位于本书代码包中的\
  \ `snippets/02/ex5-variable-arguments/a`...`d`。使用交互式代码片段演练场，在第一个下拉菜单中选择 **2: ES2015\
  \ and Browserify**，在第二个下拉菜单中选择示例 **5a…5d**。\n\n当然，这并不理想——并不能立即看出该方法可以接受任意数量的参数。ES2015\
  \ 让我们可以通过以下方式显式地表明这一点：\n\n```javascript\n// Snippet Example 5b\nfunction sum(...items)\
  \ {\n  return items.reduce((prev, cur) => (prev + cur), 0);\n}\n```\n\n差别不大，所以让我们看一个稍微复杂点的例子，还是先看\
  \ ES5 版本：\n\n```javascript\n// Snippet Example 5c\nfunction interpolate(str) {\n\
  \  var args = [].slice.call(arguments, 1 /*[1]*/);\n  return args.reduce(function(prev,\
  \ cur, idx) {\n    return prev.replace(new RegExp(\":\" + (idx + 1), \"g\"), cur);\n\
  \  }, str);\n}\nconsole.log(interpolate(\"My name is :1 and I say :2\",\n  \"Bob\"\
  , \"Hello\"));\n  // My name is Bob and I say Hello\n```\n\n和之前一样，这个函数签名没有表明 `interpolate`\
  \ 接受多个参数。此外，我们不得不稍微修改解析所有额外参数的代码——注意我们在 `[1]` 处调用 `slice` 时加了 `1`。这是因为我们在执行插值时需要避免包含第一个命名参数。\n\
  \n在 ES2015 中，我们可以改写如下：\n\n```javascript\n// Snippet Example 5d\nfunction interpolate(str,\
  \ ...items) {\n  return items.reduce((prev, cur, idx) => prev.replace(\n    new\
  \ RegExp(\":\" + (idx + 1), \"g\"), cur), str);\n}\n```\n\n`…` 操作符在 ES2015 中还可以以另一种形式使用，通过这样调用\
  \ `interpolate`：\n\n```javascript\nconsole.log(interpolate(\"My name is :1 and I\
  \ say :2\", ...[\"Bob\", \"Hello\"]));\n```\n\n诚然，当我们硬编码数组时看起来有点傻。但如果我们要在 ES5 中写这个，不得不使用\
  \ `interpolate.apply(null, [\"...\", \"Bob\", \"Hello\"])` 来实现相同功能。当数组被传递给你时，这证明非常有用；你可以轻松调用一个接受可变数量参数的函数。\n\
  \n## 解构赋值与命名参数\n\nJavaScript 中一种相当典型的模式是从对象中提取值。例如，经常看到函数接受一个修改函数行为的 `options` 对象。在\
  \ ES5 中，这需要相当多的工作。请看下面的片段——它在 **DOM**（**文档对象模型**）中搜索匹配给定查询的任何元素：\n\n\n\n## ES2015\
  \ 特性\n\n## 解构赋值\n\n```\n// Snippet Example 6b\nfunction findElements(options) {\n\
  \  var first = false,\n      query,\n      els;\n  if (options !== undefined &&\
  \ typeof options === \"object\") {\n    if (options.first !== undefined) {\n   \
  \   first = options.first;\n    }\n    if (options.query !== undefined) {\n    \
  \  query = options.query;\n    }\n  }\n  els = [].slice.call(document.querySelectorAll(query));\n\
  \  if (first === true) {\n    els = [els[0]];\n  }\n  return els;\n}\nconsole.log(findElements({\n\
  \  query: \"a\",\n  first: true\n}).map(function(o) {\n    return o.textContent;\n\
  \  }));\n```\n\n### 注意\n\n本节的代码片段位于本书代码包中的 `snippets/02/ex6-destructuring/a`...`d`。使用交互式代码片段演练场，在第一个下拉菜单中选择\
  \ `2: ES2015 and Browserify`，在第二个下拉菜单中选择示例 `6a … 6d`。\n\n前几行专门用于提供适当的默认值并从 `options`\
  \ 对象中提取值。这主要是样板代码；但如果不正确，就会产生 bug。如果我们能完全避免这些代码，那就好多了。\n\n在 ES2015 中，我们可以使用一个称为\
  \ `destructuring`（解构）的新特性轻松提取这些值。它让我们能够编写如下代码：\n\n```\n// Snippet Example 6a\nlet\
  \ {a, b} = {\n  a: 5,\n  b: 10\t\n};\nconsole.log(a, b); // 5 10\n```\n\n我们可以安全地这样做，即使对象不包含我们请求的键之一——值将直接是\
  \ `undefined`。或者，我们可以指定默认值：\n\n```\nlet {a, b = 10} = {\n  a: 5\n}; // a = 5, b\
  \ = 10\n```\n\n我们还可以深入对象内部，如下所示：\n\n```\nlet {a: {b, c=10}} = {\n  a: {\n    b:\
  \ 5\n  }\n};\nconsole.log(b, c); // 5, 10, a is undefined\n```\n\n同样的情况也适用于数组，如下面的片段所示：\n\
  \n```\nlet [state, capitol] = [\"Illinois\", \"Springfield\"];\n```\n\n如果项目数量超出你的关注范围，你可以跳过它们：\n\
  \n```\nlet [a, , c] = [1, 2, 3];\nconsole.log (a, c); // 1 3\n```\n\n如果你想收集所有剩余的值，也可以使用\
  \ `...` 运算符：\n\n```\nlet [a, ...b] = [1, 2, 3];\nconsole.log(a, b); // 1, [2, 3]\n\
  \nlet {c, ...d} = {\n  c: 5,\n  d: 10,\n  e: 15\n}\nconsole.log(c, d); // 5, {d:\
  \ 10, e: 15}\n```\n\n将所有这些结合起来，我们可以用 ES2015 重写原来的代码片段，如下所示：\n\n```\n// Snippet Example\
  \ 6c\nfunction findElements({query, first = false}) {\n  let els = [].slice.call(document.querySelectorAll(query));\n\
  \  if (first === true) {\n    els = [els[0]];\n  }\n  return els;\n}\nconsole.log(findElements({\n\
  \  query: \"a\",\n  first: true\n}).map(o => o.textContent));\n```\n\n虽然这可能不是显而易见的，但这也给我们带来了另一个特性：命名参数。它不如其他支持命名参数的语言那样完美，但已经足够好了。这也意味着我们的代码更加自文档化了。\n\
  \n我们也可以利用这一点来模拟多返回值：\n\n```\n// Snippet Example 6d\nfunction doSomethingThatErrors()\
  \ {\n  let error = 5,\n    message = \"Element could not be found\";\n  return {\n\
  \    error,\n    message\n  };\n}\nlet {error, message} = doSomethingThatErrors();\n\
  console.log(error, message); // 5 Element could not be found\n```\n\n## 字符串插值\n\n\
  已经为 JavaScript 开发了许多模板和插值库，但 ES2015 现在提供了内置的字符串插值。\n\n### 注意\n\n本节的代码片段位于本书代码包中的\
  \ `snippets/02/ex7-string-interpolation/a`。使用交互式代码片段演练场，在第一个下拉菜单中选择 `2: ES2015 and\
  \ Browserify`，在第二个下拉菜单中选择示例 `7`。\n\n如果你还记得，我们已经在 `Variable Arguments`（可变参数）一节中编写了一个名为\
  \ `interpolate` 的插值方法。例如，`interpolate(\"My name is :1\", \"Bob\")` 将返回 `My name\
  \ is Bob`。在 ES2015 中，我们可以通过以下方式实现相同的功能：\n\n```\nlet name = \"Bob\",\n    str = `My\
  \ name is ${name}`;\n```\n\n对于大多数插值库来说，功能到此为止。但 ES2015 允许我们计算任意表达式：\n\n```\nlet\
  \ x = 2,\n    y = 4,\n    str = `X=${x},Y=${y},X+Y=${x + y}`; // X=2,Y=4,X+Y=6\n\
  ```\n\n### 注意\n\n`Anything` 只要是表达式就会生效，包括访问对象属性和方法。\n\n作为额外的福利，这种新语法还允许多行字符串：\n\n\
  ```\nlet str = `SELECT * FROM\n             FROM aTable`;\n```\n\n当然，所有空白字符都会被包含在内，这意味着字符串实际上变成了\
  \ `\"SELECT *\\n FROM aTable\"`。如果间距很重要，你需要采取必要的步骤来去除空白字符。\n\n你还可以定义自己的 `interpolations`（插值处理器），这非常有用。让我们考虑一个常见的安全问题——SQL\
  \ 注入。例如，一些开发人员在构建 SQL 语句时有点马虎，如下例所示：\n\n```\nvar sql = \"SELECT * FROM customers\
  \ WHERE customer_name = \\\"\" + name + \"\\\"\";\n```\n\n不幸的是，通过提供精心设计的客户名称，可以向该语句中注入任意\
  \ SQL 代码。现在，在你认为 ES2015 插值已将你从安全问题中拯救出来之前，请小心。以下结构同样不安全：\n\n```\nlet sql = `SELECT\
  \ * FROM customers WHERE customer_name = ${name}`;\n```\n\n### 提示\n\n`永远不要编写像前面那样的代码！永远不要！`\n\
  \n相反，大多数处理 SQL 命令的库允许你编写 `prepared statements`（预处理语句）。这些语句由两部分组成：一个 SQL 模板和一个变量数组，这些变量被插入到模板中的适当位置。这听起来很像插值，确实如此。区别在于这些库使用数据库自己的代码来正确处理值，从而使\
  \ SQL 注入成为不可能。\n\n在实践中，它看起来像下面这样：\n\n```\nvar preparedStatement = {\n  sql = \"\
  SELECT * FROM customers WHERE customer_name = ?\",\n  binds: [\"Bob\"]\n};\n```\n\
  \n以这种方式编写 SQL 语句并不太难；但有了 ES2015，我们 `can` 编写自己的插值处理器，使编写预处理语句变得更加容易：\n\n```\nfunction\
  \ sql(s, ...binds) {\n  let len = binds.length;\n  return {\n    sql: s.map((val,\
  \ idx) => (`${val}${idx < len ? \"?\" : \"\"}`))\n      .join(\"\"),\n    binds\n\
  \  };\n}\n\nlet name = \"Bob\";\nlet preparedStatement = /*[1]*/ sql`SELECT * FROM\
  \ customers WHERE customer_name = ${name}`;\nconsole.log(JSON.stringify(preparedStatement,\
  \ null, 2));\n// Console outputs\n// {\n//   sql: SELECT * FROM customers WHERE\
  \ customer_name= ?\n//   binds: [\"Bob\"]\n// }\n```\n\n请看前面代码中的 `[1]`。这是 ES2015\
  \ 指示调用 `sql` 方法以插值字符串的方式。在内部，这会转换为 `sql([\"SELECT * FROM CUSTOMERS W` `HERE customer_name\
  \ = \", \"\"], [\"Bob\"]);`。\n\n## Promise 与 ES2016 初体验\n\n在 JavaScript 中，人们经常需要编写异步代码，`especially`\
  \ 是在使用 Cordova 插件时，或者需要发起 `XMLHttpRequest` 时。这意味着你通常最终会编写如下代码：\n\n```\n// Snippet\
  \ Example 8a\nfunction slowDiv(a, b, callback) {\n  setTimeout(function() {\n  \
  \  if (b === 0) {\n      callback(\"Can't divide by zero\");\n    } else {\n   \
  \   callback(undefined, a / b);\n    }\n  }, 2500 + Math.random() * 10000);\n}\n\
  slowDiv(10, 5, function(err, result) {\n  if (err !== undefined) {\n    console.log(err);\n\
  \    return;\n  }\n  console.log(result);\n});\n```\n\n### 注意\n\n本节的代码片段位于本书代码包中的\
  \ `snippets/02/ex8-promises/a` 和 `snippets/02/ex8-promises/d`。使用交互式代码片段演练场，在第一个下拉菜单中选择\
  \ `2: ES2015 and Browserify`，在第二个下拉菜单中选择示例 `8a-8d`。\n\n前面的示例实现了一个名为 `slowDiv` 的非常简单的异步方法，它在一段随机的短时间后返回除法运算的结果。如果除数为零，则返回错误。\n\
  \n\n\n\n回调函数接受 `err` 和 `result` 两个参数。如果 `err` 的值不是 `undefined`，则表示发生了错误，我们可以适当处理。否则，我们可以记录操作的结果。\n\
  \n### Note\n\n`(err, result)` 模式是 Node.js 应用程序中的典型模式。\n\n另一种类似的回调模式如下所示——这是使用 Cordova\
  \ 插件时常见的模式：\n\n```\nfunction slowDiv(a, b, success, failure) {\n  setTimeout(function()\
  \ {\n    if (b === 0) {\n      failure(\"Can't divide by zero\");\n    } else {\n\
  \      success(a / b);\n    }\n  }, 2500 + Math.random() * 10000);\n}\nslowDiv(10,\
  \ 5, function success(result) {\n  console.log(result);\n}, function failure(err)\
  \ {\n  if (err !== undefined) {\n    console.log(err);\n    return;\n  }\n});\n\
  ```\n\n前两个代码片段的功能完全相同——它们都非常缓慢地返回除法结果。只要只需要执行一次，这看起来还不错。但如果需要将多个除法串联起来，生成的代码很快会变得非常丑陋。\n\
  \n为了对抗“厄运金字塔”以及随之而来的代码理解困难，**Promise** 被开发出来。它允许你编写一个函数，承诺在未来的某个时刻返回结果。通过在生成的 Promise\
  \ 上调用 `then` 方法，Promise 也可以被串联。通过提供 `catch` 处理程序，也可以捕获错误。\n\n已经有许多库为 JavaScript\
  \ 提供了 Promise。然而，ES2015 将 Promise 纳入了语言标准。这并不一定消除了对其他库的需求（它们可能提供其他有趣的功能），但这意味着你可以在不依赖库的情况下使用\
  \ Promise。\n\n### Note\n\nPromise 的完整入门指南超出了本章范围。如果你想了解更多关于 Promise 的信息，请参阅 [`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Promise)\
  \ 和 [`www.promisejs.org`](https://www.promisejs.org)。\n\n借助 Promise 和其他 ES2015 语法，我们可以重写之前的代码如下：\n\
  \n```\nfunction slowDiv(a, b) {\n  let p = new Promise((resolve, reject) => {\n\
  \    setTimeout(() => {\n      if (b === 0) {\n        reject(\"Can't divide by\
  \ zero\");\n      } else {\n        resolve(a / b);\n      }\n    }, 2500 + (Math.random()\
  \ * 10000));\n  });\n  return p;\n}\nslowDiv(10, 5)\n  .then(result => console.log(result))\n\
  \  .catch(err => console.log(\"error\", err));\n```\n\n这比回调示例更好；当我们将两个慢速除法串联在一起时，改进的程度将变得显而易见，如下所示：\n\
  \n```\nslowDiv(10, 5)\n  .then(result => slowDiv(20, result))\n  .then(result =>\
  \ console.log(result)) // 20 / ( 10 / 5 ) = 10\n  .catch(err => console.log(\"error\"\
  , err));\n```\n\n尽管这很棒（并且已被许多 JavaScript 开发者广泛采用），但它仍然不像自然代码。如果我们能像编写同步代码一样编写异步代码，那就太好了。\n\
  \n在 ES2015 中，我们做不到。我们可以通过生成器和生成器运行器的组合来接近，但这仍然不够自然。然而，下一个版本的 ECMAScript (ES2016)\
  \ 给了我们一种几乎完全实现我们想要的方法：`await` 和 `async` 关键字。\n\n### Note\n\n如果你想了解如何在 ES2015 中模拟\
  \ `await`，请参阅 [`davidwalsh.name/async-generators`](http://davidwalsh.name/async-generators)。\n\
  \n有了这两个关键字，我们现在可以按如下方式编写串联除法：\n\n```\nasync function doCalculation_a() {\n  try\
  \ {\n    let result1 = await slowDiv(10, 5);       // 2, eventually\n    let result2\
  \ = await slowDiv(20, result1); // 10, eventually\n    console.log(result2);\n \
  \ } catch (err) {\n    console.log(\"error\", error);\n  }\n}\n```\n\n在前面的示例中有几点需要注意。首先，有一个新的\
  \ `async` 关键字（见 `[1]`）——它标记任何返回异步结果的函数。其次，`await` 用于标记我们的异步函数正在等待来自 Promise 的值（见\
  \ `[2]`）。最后，它看起来几乎与等效的同步代码完全相同！这意味着我们可以更轻松地推断代码的工作原理。\n\n只有一个问题：`await` 必须存在于 `async`\
  \ 函数中，这意味着任何调用函数也必须正确处理异步性。因此，如果不做计划，你不能随心所欲地在任何地方使用它。即使有这个警告，它也非常有用。\n\n### Tip\n\
  \n`await` 和 `async` 的语法尚未最终确定。与已被标准机构接受的 ES2015 不同，此功能的语法（甚至语义）在未来可能会发生变化。因此，在生产代码中使用\
  \ `await` 和 `async` 时要小心。\n\n你也可以在表达式中使用 `await`。因此，我们可以按如下方式编写 `doCalculation`\
  \ 方法：\n\n```\nasync function doCalculation() {\n  try {\n    // 10, eventually\n\
  \    console.log( await slowDiv(20, await slowDiv(10, 5)));\n  } catch (err) {\n\
  \    console.log(\"error\", error);\n  }\n}\n```\n\n如何使用 `await` 很大程度上取决于你；第二个示例稍微难读一些，但功能相同。\n\
  \n### Note\n\n使用 ES2016 特性被认为是实验性的。因此，Babel 默认不会识别它。我们将在本章后面的*修改 Gulp 配置*部分解决这个问题。\n\
  \n## 类\n\n类可能是 ES2015 中最具争议的特性之一。但事实上，它们只是 JavaScript 现有原型本质的语法糖。如果你不想使用 ES2015\
  \ 类，你不必使用——你仍然可以像以前一样创建对象。然而，从可读性的角度来看，有一些明确的好处。\n\n### Note\n\n本节中的代码片段位于代码包的 `snippets/02/ex9-classes/a`\
  \ 中。使用交互式代码片段演练场，在第一个下拉菜单中选择 **2: ES2015 and Browserify**，在第二个下拉菜单中选择示例 **9**。\n\
  \n让我们快速看一下新语法。在下面的片段中，我们定义了一个简单的 `Point` 类，表示二维平面上的 x 和 y 坐标：\n\n```\nclass Point\
  \ {\n  constructor(x = 0, y = 0) { // [1]\n    [this._x, this._y] = [x, y];\n  }\n\
  \n  get x() { // [2]\n    return this._x;\n  }\n  set x(x) { // [3]\n    this._x\
  \ = x;\n  }\n  get y() {\n    return this._y;\n  }\n  set y(y) {\n    this._y =\
  \ y;\n  }\n\n  toString() {\n    return `(${this.x}, ${this.y})`;\n  }\n  copy()\
  \ {\n    return new Point(this.x, this.y);\n  }\n  equal(p) {\n    return (p.x ===\
  \ this.x) && (p.y === this.y);\n  }\n}\n```\n\n请注意，我们使用 `constructor` 关键字定义了构造函数（`[1]`）。属性的\
  \ getter 和 setter 分别使用 `get`（`[2]`）和 `set`（`[3]`）定义。现在，假设我们要创建一个矩形。我们可以简单地指定左上角和右下角的点；让我们允许开发者指定*大小*。虽然我们可以将大小设为\
  \ `Point`，但使用 `w` 和 `h` 代替 `x` 和 `y` 会更方便。这很容易实现，如下片段所示：\n\n```\nclass Size extends\
  \ Point { // [1]\n  constructor(w = 0, h = 0) {\n    super(w, h);\n  }\n  get w()\
  \ {\n    return this.x;\n  }\n  set w(w) {\n    this.x = w;\n  }\n  get h() {\n\
  \    return this.y;\n  }\n  set h(h) {\n    this.h = h;\n  }\n  copy() {\n    return\
  \ new Size(this.w, this.h);\n  }\n}\n```\n\n请注意新的 `extends` 关键字（`[1]`）——它允许你指明一个类基于另一个类。新类会自动获得所有先前的属性和方法。更棒的是，子类可以使用\
  \ `super` 调用其父类的方法。\n\n现在我们可以创建一个 `Rectangle` 类：\n\n\n\n\n# 模块\n\n本节我们将介绍的最后一个 ES2015\
  \ 新特性是模块。在 JavaScript 中实现模块化的方法有很多，但 ES2015 将模块化直接引入了语言本身。语法非常简单；但如果你不熟悉模块，可能需要一段时间才能完全消化吸收。\n\
  \n在 ES2015 中，模块是一个独立的 JavaScript 文件，其中有一个或多个方法或变量标记了 `export`。这是一个新关键字，允许你指明某个值或方法应当可供程序的其他部分使用。你可以选择使用\
  \ `export default` 提供默认导出。\n\n相应地，你的代码通过 `import` 来使用模块。你可以选择用 `import *` 导入模块导出的所有内容，也可以按需导入特定部分。\n\
  \n让我们看一个例子。首先，定义一个简单的模块：\n\n```\n// math.js\nexport function add(a, b) {\n  return\
  \ a + b;\n}\nexport function sub(a, b) {\n  return a - b;\n}\n```\n\n我们可以在另一个 JavaScript\
  \ 文件中使用该模块，如下所示：\n\n```\n// another.js\nimport * from \"math.js\";\n// 上面这行等同于下面这行\n\
  // import {add, sub} from \"math.js\"\nconsole.log(add(2, 5));\n```\n\n现在，假设我们想创建一个高级数学库，但希望将简单的方法直接暴露给使用者。我们可以直接从另一个文件导出方法和值，如下所示：\n\
  \n```\n// advancedMath.js\nexport * from \"math.js\"\nexport function mul(a, b)\
  \ {\n  return a * b;\n}\n`\n\n这些内容并没有什么惊天动地的——大多数开发者都在使用类似的模式，但将其内置到语言中确实很不错。此外，它确实提供了更多灵活性，因为你可以按需选择要导入和导出的内容。\n\
  \n遗憾的是，你需要一个提供该特性支持的打包工具——Babel 默认不支持。我们将在本章后面的 *使用 Browserify* 一节中介绍这一点。\n\n##\
  \ 更多信息\n\n你已经阅读了大量信息，但这些对于理解本书其余部分的代码至关重要。请花些时间熟悉本章提供的信息。然后，我建议你阅读一些我们未涉及的其他特性。以下网站提供了良好的切入点：\n\
  \n*   [`www.2ality.com`](http://www.2ality.com)\n*   [`babeljs.io/docs/learn-es2015/`](https://babeljs.io/docs/learn-es2015/)\n\
  \n### 提示\n\n并非每个 ES2015 特性都被我们使用的转译器（即 Babel）支持。关于 Babel 支持哪些特性的具体信息，请参阅 [`kangax.github.io/compat-table/es6/`](http://kangax.github.io/compat-table/es6/)。\n\
  \n为了测试你对所有 ES2015 特性的理解，或者如果你只是想尝试一下，Babel 提供了一个优秀的沙箱，你可以在其中编写 ES2015 代码，查看转译结果，并验证代码是否正常工作。你可以在线访问\
  \ [`babeljs.io/repl/`](https://babeljs.io/repl/)。\n\n极少有应用程序需要完全自定义的代码。大多数应用程序都能从模块化和代码复用中受益，重要的是要善用模块化，以便更高效地构建应用。\n\
  \n许多开发者（甚至一些公司）都患有一种常见的综合症：非我发明综合症。患者极其犹豫使用自己未创建的代码、算法或任何其他资产。这种综合症的成因显而易见——它确保了一个人不会因第三方代码而承担责任，不会因不当授权资产而被起诉，等等；但这也意味着必须不断重复造轮子。这不可避免地导致算法更多漏洞、安全性更低，因为每个人都在尝试完全从零开始构建应用。\n\
  \n如果你读过其他关于移动应用开发的书籍，很可能已经接触过模块化自己的代码。与其拥有一个包含*所有内容*的大型单体 JavaScript 文件，不如分离代码，使其更易于理解（并使每个关注点清晰分离）。\n\
  \n然而，将这一理念扩展到更广泛的 JavaScript 世界极其有用；那里有大量采用宽松许可证的开源模块，可供你作为应用程序的基础。这意味着必须担心妥善遵守许可要求，但也使你能够组装经过充分测试的构建模块，以此作为应用程序的基石。\n\
  \nBrowserify ([`browserify.org`](http://browserify.org)) 是一个工具，允许你使用庞大的 Node.js\
  \ 包仓库。许多包原样即可在浏览器中正常工作，但 Node.js 拥有不同的全局环境。Browserify 将这个 Node.js 环境垫片化到浏览器中，这意味着几乎任何\
  \ Node.js 包都可以在浏览器环境中工作。大多数包会在文档中说明如果不支持浏览器。\n\n### 注意\n\nBrowserify 还用于将应用的所有依赖打包成一个或多个大文件。这在生产环境中很有用，此时你可能想提供一个包含所有代码的压缩文件。\n\
  \n此外，既然我们可以使用 Node.js 包，不妨也使用 Node.js 包管理器 `npm`。我们已经在用它安装开发依赖，如 Cordova、Gulp 等。但我们也可以用\
  \ `npm` 来管理应用程序的依赖。\n\n你应该花点时间浏览 [`www.npmjs.com`](https://www.npmjs.com)。应该很明显，那里有*海量*资源。利用\
  \ `npm` 作为资源能极大地加速你自己的开发。\n\n## 修改我们的 Gulp 配置\n\n遗憾的是，要想将 Browserify 和 ES2015 结合使用，我们需要修改\
  \ Gulp 配置。以前我们直接调用 `babel` 来转换代码，现在得稍微花点心思；必须调用 `browserify`，然后由 `browserify` 自行调用\
  \ `babel`。这是一个微妙的区别，但很重要。\n\n首先，安装新的开发依赖：\n\n```\n$ npm --save-dev install vinyl-source-stream@1.1.0\
  \ vinyl-buffer@1.1.0 browserify@11.2.0 babelify@6.3.0\n$ npm --save install babel@5.8.23\n\
  $ npm --save-dev uninstall gulp-babel\n```\n\n### 注意\n\n我们安装的前两个模块将允许我们将 `browserify`\
  \ 的输出转换为 Gulp 可处理的格式。\n\n然后，我们需要在配置文件 (`gulp/config.js`) 顶部添加一些配置：\n\n```\nassets:\
  \ { ...,   \n     code: {src: \"www/js/app/index.js\", dest: \"www/js/app\"}\n}\n\
  ```\n\n接下来，我们需要修改 `gulp/tasks/copy-code.js` 文件。首先，在顶部添加额外的 require 语句：\n\n```\n\
  var ...,\n    babelify = require(\"babelify\"),\n    browserify = require(\"browserify\"\
  ),\n    buffer = require(\"vinyl-buffer\"),\n    source = require(\"vinyl-source-stream\"\
  );\n```\n\n然后，修改 copyCode 使其如下所示：\n\n\n\n\n# Browserify 和 ES2015 集成\n\n```javascript\n\
  function copyCode() {\n  var isRelease = (settings.BUILD_MODE === \"release\");\n\
  \  return browserify(paths.makeFullPath(config.assets.code.src,\n              \
  \      paths.SRC), { // [1]\n    debug: !isRelease, // [2]\n    standalone: \"app\"\
  \n  }).transform(babelify.configure({ // [3]\n      stage: 0, // 允许实验性功能 // [4]\n\
  \    }))\n    .bundle()\n    .on(\"error\", function(error) {\n      this.emit(\"\
  end\"); // [5]\n    }).on(\"error\", notify.onError(function(error) {\n      return\
  \ \"BABEL: \" + error.message; // [6]\n    }))\n    .pipe(source(\"app.js\")) //\
  \ [7]\n    .pipe(buffer()) // [8]\n    .pipe(cordovaTasks.performSubstitutions())\n\
  \    .pipe(isRelease ? gutil.noop() : sourcemaps.init({\n      loadMaps: true\n\
  \    })) // 从 browserify 文件加载 map\n    .pipe(isRelease ? uglify({\n      preserveComments:\
  \ \"some\"\n    }) : gutil.noop())\n    .pipe(isRelease ? gutil.noop() : sourcemaps.write())\n\
  \    .pipe(gulp.dest(paths.makeFullPath(config.assets.code.dest, \n          paths.DEST)))\n\
  \    .pipe(browserSync.stream());\n}\n```\n\n前面代码的后半部分看起来应该很熟悉——这就是上一章的内容，但上半部分是全新的。让我们更详细地了解一下。\n\
  \n首先，我们没有使用 `gulp.src`，而是直接调用了 `browserify`（`[1]`）。在上一章中，我们让 Gulp 将所有 JavaScript\
  \ 文件合并成一个文件。而 `browserify` 会通过从主文件开始跟踪依赖树，自动发现所有需要打包在一起的文件。那些不是依赖的文件会自动被排除在最终输出之外。仅这一特性就非常不错。\n\
  \n在调用 `browserify` 时，我们通过设置 `debug` 属性（`[2]`）让它创建 sourcemap。我们只在开发时需要这样做，所以这取决于我们传递给\
  \ Gulp 的 `--mode` 设置。\n\n我们还希望在测试时能全局访问应用程序的状态。默认情况下，`browserify` 会将所有内容打包成一个整齐的包，但我们无法直接访问应用程序可能创建的对象。向\
  \ `browserify` 传递 `standalone:\"app\"` 允许我们指定一个全局变量（`app`），通过它可以访问整个应用。这对生产代码不是必需的；但在开发调试时绝对有帮助。\n\
  \n接下来，我们使用 `babelify`（`[3]`）转换代码。`browserify` 会自动为我们调用 `babel`。我们还传递了 `stage: 0`（`[4]`），以便使用\
  \ `await` 和 `async` 等 ES2016 特性。\n\n还添加了几个错误处理器，以便在 `browserify` 转换代码时遇到问题能收到通知。第一个（`[5]`）结束流（如果你想让\
  \ Gulp 监视代码，这很重要），第二个（`[6]`）生成错误消息。\n\n最后，我们进入了 Gulp 的领域——前两个 `pipe` 方法是我们将 Gulp\
  \ 引入的地方（`[7],[8]`）。因为我们没有让 Gulp 查找特定文件，所以使用了之前安装的两个 `vinyl` 模块，将 `browserify` 的输出转换为\
  \ Gulp 可处理的形式。从这一点开始，我们的代码与第 1 章《任务自动化》中的代码完全相同。\n\n## 引入 Node.js 包\n\n引入 Node.js\
  \ 包非常简单。首先，你需要从 `npm` 找到一个喜欢的包。在示例中，我们将添加一个名为 `yasmf-h` 的模块。它不是一个复杂的包，本质上是第 1 章《任务自动化》中\
  \ `index.js` 里那个小模板方法的增强版。\n\n要安装该包，请输入以下命令：\n\n```bash\n$ npm --save install yasmf-h\n\
  ```\n\n接下来，我们需要修改 `src/www/js/app/index.js` 以便使用该包：\n\n```javascript\nimport 'babel/polyfill';\
  \ // [1]\nimport h from 'yasmf-h'; // [2]\n\nexport var app = {\n  start() {\n \
  \   var n = h.el(\"div\",\n      h.el(\"ul\",\n        h.el(\"li\", \"Some information\
  \ about this app...\"),\n        h.el(\"li\", \"App name: {{{NAME}}}\"),\n     \
  \   h.el(\"li\", \"App version: {{{VERSION}}}\")\n      )\n    );\n    h.renderTo(n,\
  \ document.querySelector(\"#demo\"));\n  }\n};\n\ndocument.addEventListener(\"deviceready\"\
  , app.start, false);\n```\n\n这与第 1 章《任务自动化》中的内容没有本质区别。注意这两条 `import` 语句。第一行代码（`[1]`）导入支持\
  \ Babel 所需的 `polyfill`，Babel 是我们一直在使用的 ES2015 转译器。第二行（`[2]`）导入我们安装的 `npm` 模块的代码，并将其赋值给变量\
  \ `h`。\n\n我们还需要稍微修改 `src/www/index.html` 文件，即删除一行。请看下面的内容：\n\n```html\n<!DOCTYPE\
  \ html>\n<html>\n  <head>\n    <script src=\"cordova.js\" type=\"text/javascript\"\
  ></script>\n    <script src=\"./js/app/app.js\" type=\"text/javascript\"></script>\n\
  \  </head>\n  <body>\n    <p>This is static content..., but below is dynamic content.</p>\n\
  \    <div id=\"demo\"></div>\n  </body>\n</html>\n```\n\n一切都一样，只是我们删除了以下行：\n\n```html\n\
  <script src=\"./js/lib/browser-polyfill.js\" type=\"text/javascript\"></script>\n\
  ```\n\n我们不再需要在 `index.html` 中引入 ES2015 polyfill，因为已经在 `index.js` 中导入了它。`index.html`\
  \ 中引入的脚本越少越好。\n\n此时，你可以使用 `gulp build` 重新构建项目以应用新更改。它将完全像以前一样运行，但现在你正在使用一个*你没写的*第三方模块！\n\
  \n当然，在使用你没写的模块时，有几件事非常重要：\n\n*   始终检查许可证。`npm` 包通常相当宽松，但最好复查一下。我们引入的包采用 MIT 许可证，要求仅在输出中某处包含原始版权。因为许可证包含在包的代码中，所以会被传递到我们的输出代码中。但确保正确授权项目中包含的任何代码取决于你。你还应该在应用的显眼部分（如\
  \ **关于** 或 **设置** 部分）列出你使用的包。\n\n*   安装前审查包。查看代码或文档，看看是否有无法绕过的重大问题。如果包有测试，更好——你可以验证包是否真正工作。\n\
  \n本章涵盖了相当多的内容——大多与 ES2015 带来的新语法和特性相关。此外，我们还介绍了如何导入 `npm` 模块并在自己的代码中使用它们。\n\n在下一章中，我们将致力于使用\
  \ Sass 构建模块化 CSS 文件。我们还将看到如何将其集成到构建过程中。\n\n虽然 JavaScript 对应用程序功能至关重要，但 CSS 对应用程序外观至关重要。虽然\
  \ CSS 非常强大，但大多数移动浏览器支持的版本（CSS3）缺少许多能让开发更轻松的特性。CSS 也往往冗长；很容易最终得到又长又乱、难以理解和维护的样式表。\n\
  \nSass（语法上很棒的样式表）旨在改进 CSS3，使其更易于编写和维护。它增加了变量、插值、计算、混入、模块化等特性。我们可以利用 Sass 让 CSS 更易读、更易写。\n\
  \n### 注意\n\n你可以访问 `http://sass-lang.com` 了解更多关于 Sass 的信息。\n\n在本章中，我们将重点关注以下内容：\n\
  \n*   学习 Sass\n*   将 Sass 与 Gulp 集成\n\n\n\n"
- "# Sassy CSS\n\n本章中的几个代码片段也可以通过随书代码包附带的交互式代码片段演练场来使用。启动演练场的说明位于代码包中的 `README.md`\
  \ 文件中。启动后，选择 **3: Sassy CSS**，然后浏览并尝试这些示例。在适用的情况下，每个小节和代码片段都会指示你应选择哪个章节和示例。\n\n\
  我们已经简要提及了 Sass 的优势，但学习如何使用它需要一点努力。话虽如此，认识到关于 Sass 的一个非常重要的事实至关重要，这会让学习变得更容易：每个 CSS\
  \ 文件都是一个有效的 SCSS 文件。Sass 本身支持两种格式；但我们将使用的格式类似于 CSS 语法，并使用 `.scss` 扩展名。这意味着你可以编写纯\
  \ CSS，Sass 将能毫无问题地识别它。这让你可以按照自己的节奏学习特性，而不会损失生产力。在你不了解某个 Sass 特性的情况下，你可以编写常规 CSS。稍后，当你学得更多时，可以使用\
  \ Sass 重写该 CSS。\n\n## Note\n\nSass 支持的另一种格式使用缩进而非括号来定义文件结构。这些文件使用 `.sass` 扩展名。\n\
  \n在深入探讨 Sass 的优势之前，重要的是要记住浏览器不支持 SCSS 语法。这意味着我们必须使用工具将 SCSS 文件转换为浏览器能理解的 CSS 文件。你已经熟悉将\
  \ ES2015 代码转换为 ES5 的过程，这一过程与此非常相似。\n\nSass 高度基于 DRY 概念——即不要重复自己。另一方面，CSS 往往充满了重复，因此\
  \ Sass 代码可以比等效的 CSS 更加模块化和紧凑。在编写 Sass 代码时，应寻找减少重复和鼓励代码复用的机会。\n\nSass 包含命令式控制结构，如控制流和循环，以及外观和行为类似函数的构造。这意味着\
  \ Sass 代码有时读起来更像是一个程序，而不是一个样式表。因此，很容易将大量复杂的功能抽象到可复用的模块中；但这也意味着必须熟悉 Sass 的工作原理。话虽如此，如果有任何困惑，查阅生成的\
  \ CSS 文件通常有助于理清头绪。\n\n我们无法涵盖 Sass 提供的每一项特性。相反，我们将介绍本书代码中倾向于使用的特性。如果你愿意，可以随时通过浏览\
  \ Sass 文档 (`http://sass-lang.com/documentation/file.SASS_REFERENCE.html`) 了解更多。\n\
  \n## Comments\n\nCSS 允许采用 `/* … */` 形式的注释。这种类型的注释适用于许可证和其他应由客户端下载的文本。但通常，开发人员会在生产环境的\
  \ CSS 文件中剥离除许可证外的任何注释，以减小文件体积。Sass 通过提供单行注释功能来解决这个问题。这种单行注释永远不会被渲染到输出的 CSS 文件中，因此你可以随意使用它，而无需担心输出文件的大小。单行注释以双正斜杠\
  \ (`//`) 开头。Sass 将继续渲染 `/* … */` 注释，因此这也是一种控制哪些注释保留在最终输出中的有用方法。\n\nSass 也可以配置为消除所有注释。如果你使用此功能，仍可通过使用\
  \ `/! … */` 强制某些注释包含在最终输出中。如果你需要在最终输出中包含许可证，这可能会很有用。\n\n## Calculation\n\nCSS 长期以来一直饱受\
  \ *magic* numbers（魔数） 的困扰——这些值的含义或开发人员如何得出这些值相当晦涩。请看下面的例子：\n\n```\n.some-element\
  \ {\n    width: 560px;\n}\n```\n\n除了知道某物宽 `560px` 之外，这个片段并没有告诉你宽度是如何确定的。这意味着稍后回来适当修改该值很困难。它可能是图像的宽度，也可能是一系列数学运算的结果。\n\
  \n借助 CSS3，我们可以执行运行时计算，这非常有用。因此，我们可以编写如下代码：\n\n```\n.some-element {\n    width: calc((960px\
  \ / 12) * 7);\n}\n```\n\n这开始提供一些上下文——我们有一个 `960px` 的网格，包含 `12` 列，该元素应宽 `7` 列。因此，当我们稍后回来修改它时，就会知道最初的意图。\n\
  \n尽管大多数现代移动浏览器支持此功能，但以这种方式使用 `calc` 是不明智的，因为它会带来性能损耗，因为必须持续对其求值。因为这个数值永远不会改变，如果计算结果能只确定一次并插入输出\
  \ CSS 中，速度会更快。\n\nSass 允许我们在样式中内联指定计算来实现这一点。请看下面的例子：\n\n```\n.some-element {\n \
  \ width: (960px / 12) * 7;\n}\n```\n\n当 Sass 生成 CSS 文件时，它会写入 `560px`，这意味着浏览器不必担心重新计算这个值。但当我们查看自己的代码时，更容易阅读和理解为什么\
  \ `560px` 是最终结果。\n\n### Note\n\n本节中的代码片段位于本书代码包的 `snippets/03/ex1-calculation/`\
  \ 中。使用交互式代码片段演练场时，选择 **3: Sassy CSS** 和 **Example 1: Calculation**。\n\n预期的数学运算符均可用，包括加法\
  \ (`+`)、减法 (`-`)、乘法 (`*`) 和除法 (`/`)。取模 (`%`) 也受支持。如果任何操作数缺少单位，则根据前面的操作数推断单位。这意味着\
  \ `5px + 3` 变为 `8px`，而 `10px * 3` 计算为 `30px`。\n\n应当注意，Sass 不执行混合单位计算。例如，不能将 `em`\
  \ 单位加到 `px` 单位上。这会导致错误。如果你需要进行此类计算，CSS3 的 `calc` 是你唯一的选择。\n\n然而，你可以将比率转换为百分比。例如：\n\
  \n```\n.some-element {\n    width: ((960px / 12) * 7) / 960px * 100%;\n}\n```\n\n\
  在前面的例子中，我们试图从 `960px` 网格转换为基于百分比的布局，同时保持相同的比率。前面计算的结果将是 `58.3333%`。乘以 `100%` 将我们的计算转换为百分比。\n\
  \n除法运算符有些特殊——该符号在 CSS 中也经常使用。以下代码的结果应该是什么？\n\n```\n.some-element {\n    width: 500px\
  \ / 20;\n}\n```\n\n在前面的例子中，Sass 将输出 `500px / 20`，而不是 `25px`。这是因为 CSS 简写也使用正斜杠来分隔某些值。例如，`font`\
  \ 接受字号和行高（例如，`20px/50px` 指定 `20px` 字号和 `50px` 行高）。因为每个 CSS 文件也是一个有效的 Sass 文件，且期望生成的输出与原始\
  \ CSS 文件匹配，所以 Sass 在这种情况下无法执行任何除法。为了在这种情况下强制执行除法，我们可以用括号将表达式括起来，如下所示：\n\n```\n.some-element\
  \ {\n    width: (500px / 20);\n}\n```\n\n我们还可以使用各种函数对数字进行操作。`round(1000px / 3)`\
  \ 将被转换为 `333px`，而不是 `333.3333px`。有关所有可用函数的列表，请参阅 `http://sass-lang.com/documentation/Sass/Script/Functions.html`。\n\
  \n计算也可以在颜色上执行；但使用颜色函数（列在前面的链接中）比使用计算来达到预期结果更容易。\n\n如果你需要执行字符串连接，可以使用加法运算符。\n\n\n\
  \n\n\n# 变量\n\n有关 Sass 计算的更多信息，请参阅 [`sass-lang.com/documentation/file.SASS_REFERENCE.html#ope`](http://sass-lang.com/documentation/file.SASS_REFERENCE.html#ope)。\n\
  \n原生 CSS 最明显的问题之一是缺乏变量。CSS 往往反复指定相同的颜色、尺寸和图片。虽然可以利用 CSS 的层叠特性来缓解此问题，但并非所有人都会这么做。让我们看几个例子。每个示例将复制以下简单布局：\n\
  \n![Variables](img/9781OS_03_01.jpg)\n\n我们在每个示例中使用的 HTML 如下（后续代码片段均不改变此 HTML）：\n\
  \n```html\n<div class=\"ui-view-container\">\n  <div class=\"ui-navigation-bar\"\
  >\n    Hello, world!\n  </div>\n  <div class=\"ui-scroll-container\">\n    <p>...</p>\
  \ ...\n  </div>\n  <div class=\"ui-tool-bar\">\n    <a href=\"#\">Add</a> | <a href=\"\
  #\">Remove</a>\n  </div>\n</div>\n```\n\n### 注意\n\n本节中的代码片段位于本书代码包的 `snippets/03/ex2-variables/a…c`\
  \ 目录下。使用交互式代码片段演练场时，请选择 **3: Sassy CSS** 以及示例 **2a** 到 **2c**。\n\n尽管此布局看起来相当简单，但很容易看出生成的\
  \ CSS 如何迅速变得难以控制。请看下面的示例：\n\n```css\n// 代码片段示例 2a\n.ui-view-container {\n    position:\
  \ absolute;\n    padding: 10px; margin: 10px;\n    border: 1px solid black;\n  \
  \  background-color: #EEE;\n    top: 0; left: 0;\n    bottom: 0; right: 0;\n   \
  \ box-sizing: border-box;\n    font: 16px \"Helvetica Neue\", Helvetica, Arial,\
  \ sans-serif;\n}\n.ui-navigation-bar {\n    position: absolute;\n    height: 50px;\
  \ line-height: 50px;\n    top: 0;\n    left: 0; right: 0;\n    border-bottom: 1px\
  \ solid black;\n    background-color: rgba(255,255,255,.95);\n    color: #333;\n\
  \    box-sizing: border-box;\n    text-align: center;\n    font-size: 20px;\n  \
  \  font-weight: bold;\n    z-index:1;\n}\n.ui-scroll-container {\n    position:\
  \ absolute;\n    top: 0; left: 0;\n    right: 0; bottom: 0;\n    padding: 50px 10px;\n\
  \    overflow: auto;\n}\n.ui-tool-bar {\n    position: absolute;\n    bottom: 0;\n\
  \    left: 0; right: 0;\n    padding: 0 10px;\n    line-height: 50px; height: 50px;\n\
  \    box-sizing: border-box;\n    background-color: rgba(255,255,255,.95);\n   \
  \ color: #333;\n    border-top: 1px solid black;\n    z-index:1;\n}\n\n.ui-tool-bar\
  \ a {\n    color: #369;\n    text-decoration: none;\n    display: inline-block;\n\
  \    line-height: 50px;\n}\n```\n\n这并非良好的 CSS —— 它非常重复，且未利用 CSS 的层叠特性。因此，让我们重写它，使其减少重复且更易维护：\n\
  \n```css\n//代码片段示例 2b\n.ui-view-container, .ui-navigation-bar, .ui-tool-bar, \n\
  .ui-scroll-container {\n    box-sizing: border-box;\n    position: absolute;\n}\n\
  .ui-view-container, .ui-scroll-container {\n    top: 0; left: 0;\n    bottom: 0;\
  \ right: 0;\n}\n.ui-navigation-bar, .ui-tool-bar {\n    background-color: rgba(255,255,255,.95);\n\
  \    color: #333;\n    height: 50px;\n    left: 0; right: 0;\n    padding: 0 10px;\n\
  \    z-index: 1;\n}\n.ui-navigation-bar, .ui-tool-bar, .ui-tool-bar a {\n    line-height:\
  \ 50px;\n}\n.ui-view-container {\n    border: 1px solid black;\n    background-color:\
  \ #EEE;\n    font: 16px \"Helvetica Neue\", Helvetica, Arial, sans-serif;\n    margin:\
  \ 10px;\n    padding: 10px;\n}\n.ui-navigation-bar {\n    border-bottom: 1px solid\
  \ black;\n    font-size: 20px;\n    font-weight: bold;\n    text-align: center;\n\
  \    top: 0;\n}\n.ui-scroll-container {\n    overflow: auto;\n    padding: 50px\
  \ 10px;\n}\n.ui-tool-bar {\n    border-top: 1px solid black;\n    bottom: 0;\n}\n\
  .ui-tool-bar a {\n    color: #369;\n    display: inline-block;\n    text-decoration:\
  \ none;\n}\n```\n\n上述代码有所改进，但仍不够清晰，且包含大量含义不明显的**魔术数字**（在更大的样式表中情况会更糟）。通过变量，我们可以开始消除这些魔术数字，提高代码的可读性。我们还可以通过在单一位置修改变量，而非在样式表中到处搜索特定值并替换，从而轻松调整应用的外观。\n\
  \nSass 定义变量的方式如下：\n\n`$variable: value;`\n\n有了这个知识，我们现在可以仅用少量变量编写一个可换肤的 CSS 版本：\n\
  \n```css\n//代码片段示例 2c\n$text-color: #333;\n$font: \"Helvetica Neue\", Helvetica,\
  \ Arial, sans-serif;\n$text-font: 16px $font;\n$text-title-size: 20px;\n$text-title-weight:\
  \ bold;\n$tint-color: #369;\n$bar-background-color: rgba(255,255,255,.95);\n$view-background-color:\
  \ #EEE;\n$separation-border: 1px solid black;\n$separation-size: 10px;\n$bar-height:\
  \ 50px;\n\n.ui-view-container, .ui-navigation-bar, .ui-tool-bar, \n.ui-scroll-container\
  \ {\n    box-sizing: border-box;\n    position: absolute;\n}\n.ui-view-container,\
  \ .ui-scroll-container {\n    top: 0; left: 0;\n    bottom: 0; right: 0;\n}\n.ui-navigation-bar,\
  \ .ui-tool-bar {\n    background-color: $bar-background-color;\n    color: $text-color;\n\
  \    height: $bar-height;\n    left: 0; right: 0;\n    padding: 0 $separation-size;\n\
  \    z-index: 1;\n}\n.ui-navigation-bar, .ui-tool-bar, .ui-tool-bar a {\n    line-height:\
  \ $bar-height;\n}\n.ui-view-container {\n    border: $separation-border;\n    background-color:\
  \ $view-background-color;\n    font: $text-font;\n    margin: $separation-size;\n\
  \    padding: $separation-size;\n}\n.ui-navigation-bar {\n    border-bottom: $separation-border;\n\
  \    font-size: $text-title-size;\n    font-weight: $text-title-weight;\n    text-align:\
  \ center;\n    top: 0;\n}\n.ui-scroll-container {\n    overflow: auto;\n    padding:\
  \ $bar-height $separation-size;\n}\n.ui-tool-bar {\n    border-top: $separation-border;\n\
  \    bottom: 0;\n}\n.ui-tool-bar a {\n    color: $tint-color;\n    display: inline-block;\n\
  \    text-decoration: none;\n}\n```\n\n如果你数一下行数，可能会注意到这个示例实际上比之前的示例更长。因此，乍一看，这似乎没有多大好处。然而，一旦你研究代码，就会发现几项改进，包括以下几点：\n\
  \n*   代码**更具可读性和可理解性**。我们无需猜测 `50px` 可能代表什么 —— 代码明确指出它是栏组件的高度。\n*   代码**减少了魔术数字**。几乎每个值（零或一除外）都由变量表示，而不是晦涩的数字。这并非说\
  \ Sass 中的每个值都应是变量；但当你发现自己在相似上下文中反复输入相同值时，可能就是使用变量的好时机。\n*   **易于更改外观**。我们只需修改前几行代码中的值即可。如果我们想让栏高\
  \ `44px` 而不是 `50px`，这将是一个简单的更改。在第二个片段中，虽然仍然容易，但我们必须在多处进行更改。如果我们执行搜索替换，就必须做出一个站不住脚的断言：即每个\
  \ `50px` 实例都应被更改。在我们的特定案例中这很安全，但在大型文件中，正确性就不太可能得到保证。\n\n### 注意\n\nSass 变量的作用域限于声明它们的选择器内。因此，如果变量在\
  \ `.ui-tool-bar` 中声明，其他选择器将无法访问。你可以通过追加 `!global` 强制将此类变量设为全局。但如果你发现自己需要这样做，不如直接将变量本身移出选择器。\n\
  \n在使用变量时，你可能还会发现插值很有用。请看下面的片段：\n\n```css\n.ui-navigation-bar {\n    font: $text-title-weight\
  \ #{$text-title-size}/#{$bar-height} \n          $font;\n  //font: bold 20px/50px\"\
  Helvetica Neue\", Helvetica, Arial, \n          sans-serif;\n}\n```\n\n\n\n\n\n\
  # 插值\n\n前面的插值（用 `#{$variable-name}` 标识）有助于避免解析问题。在前面的示例中，正斜杠可能会被以多种不同方式解释（包括除法）。为避免歧义（以及可能的错误结果），我们可以使用插值。\n\
  \n我们也可以在其他地方使用插值。请看下面的示例：\n\n```\n$button-class: button;\na.#{$button-class} {\n\
  \  ...\n}\n```\n\n这将编译为以下 CSS：\n\n```\na.button {\n  ...\n}\n```\n\n在前面的示例中，我们必须使用插值；使用\
  \ `a.$button-class` 会导致错误。\n\n# 嵌套\n\n阅读 HTML 时，很明显存在层级和嵌套结构。但在大多数 CSS 代码中，这种结构很快就会丢失。这会导致难以理解\
  \ CSS 是如何实现最终外观的。我们可以使用 Sass 的嵌套功能，让代码更易编写和理解。\n\n## 注意\n\n本节的代码片段位于代码包的 `snippets/03/ex3-nesting/`\
  \ 目录下。使用交互式片段演练场时，选择 **3: Sassy CSS** 和示例 **3**。\n\n让我们继续使用上一节讨论的布局。工具栏中有两个锚点。虽然锚点明显嵌套在\
  \ `div` 工具栏内，但阅读 CSS 时并不那么明显。不过，我们可以这样编写 Sass：\n\n```\n.ui-tool-bar {\n    border-top:\
  \ $separation-border;\n    bottom: 0;\n    a {\n      color: $tint-color;\n    \
  \  display: inline-block;\n      text-decoration: none;\n    }\n}\n```\n\n现在，很明显我们在为工具栏内的锚点定义样式。生成的\
  \ CSS 会从这种嵌套中创建两条规则：`.ui-tool-bar` 和 `.ui-tool-bar a`。\n\n嵌套时，有一个特殊的占位符可用：`&`（ampersand）。当我们需要使用伪元素（如\
  \ `:hover` 等）时，这很有用。这让我们可以编写如下规则：\n\n```\n.ui-tool-bar {\n    ...\n    a {\n   \
  \     ...\n        &:hover {\n            text-decoration: underline;\n        }\n\
  \    }\n}\n```\n\nSass 还提供另一种形式的嵌套。CSS 经常将属性分组。例如，`font-family`、`font-size` 和 `font-weight`\
  \ 都与元素的字体相关。在 CSS 中，我们必须单独指定每个属性（或使用 CSS 简写）。但在 Sass 中，我们可以这样做：\n\n```\n.some-element\
  \ {\n    font: {\n        family: sans-serif;\n        size: 16px;\n        weight:\
  \ bold;\n    }\n}\n```\n\n# Mixin 和函数\n\n如前所述，Sass 旨在减少重复并增加抽象。Sass 提供了 `@mixin`\
  \ 和 `@function` 指令，让我们创建可复用的组件，稍后可插入样式中。\n\n## 注意\n\n本节的代码片段位于代码包的 `snippets/03/ex4-mixins/a…d`\
  \ 目录下。使用交互式片段演练场时，选择 **3: Sassy CSS** 和示例 **4a** 到 **4d**。\n\n支持供应商前缀是个很好的例子。在许多样式表中，常见如下代码：\n\
  \n```\n.some-element {\n  -webkit-box-sizing: border-box;\n  -moz-box-sizing: border-box;\n\
  \  -ms-box-sizing: border-box;\n  -o-box-sizing: border-box;\n  box-sizing: border-box;\n\
  }\n```\n\n这不仅难看，而且极其重复。使用 Sass，我们可以编写一个 mixin 来完成这项工作。首先，定义 mixin：\n\n```\n// Snippet\
  \ Example 4a\n@mixin box-sizing($value) {\n  -webkit-box-sizing: $value;\n  -moz-box-sizing:\
  \ $value;\n  -ms-box-sizing: $value;\n  -o-box-sizing: $value;\n  box-sizing: $value;\n\
  }\n```\n\n这看起来很像前面的片段。记住，mixin 本质上是一个宏或模板，可在别处引入。使用时，可以创建如下规则：\n\n```\n.some-element\
  \ {\n  @include box-sizing(border-box);\n}\n```\n\n当然，结合变量插值，我们可以更进一步，使其更抽象，如下片段所示：\n\
  \n```\n// Snippet Example 4b\n@mixin prefix($property, $value...) {\n  -webkit-#{$property}:\
  \ $value;\n  -moz-#{$property}: $value;\n  -ms-#{$property}: $value;\n  -o-#{$property}:\
  \ $value;\n  #{$property}: $value;\n}\n\n@mixin box-sizing($value) {\n  @include\
  \ prefix(box-sizing, $value);\n}\n```\n\n### 注意\n\n前面示例中的 `…` 标记表示该参数可接受多个参数。这类似于\
  \ ES6 中的 `…` 运算符。\n\n最后，我们可以再进一步抽象：\n\n```\n// Snippet Example 4c\n$prefixes: \"\
  -webkit-\",\"-moz-\",\"-ms-\",\"-o-\",\"\";\n@mixin prefix($property, $value...)\
  \ {\n  @each $prefix in $prefixes {\n    #{$prefix}#{$property}: $value;\n  }\n\
  }\n```\n\n这是 Sass 提供的控制流和循环示例。但请记住，没有运行时性能影响——Sass 在转换为 CSS 时会展开循环。\n\n### 注意\n\n\
  此 `prefix` mixin 无法处理所有使用供应商前缀的情况；但对于我们的示例已足够。我们的 mixin 未处理的一种情况是属性值中的供应商前缀。\n\n\
  如果你发现自己反复重用同一计算，`@function` 指令会很有用。例如，假设我们要使用 `960px` 网格，但不想在代码中散布大量计算。我们可以编写如下函数：\n\
  \n```\n// Snippet Example 4d\n$grid-width: 960px;\n$grid-columns: 12;\n@function\
  \ grid-size($columns) {\n  @return ($grid-width / $grid-columns) * $columns;\n}\n\
  ```\n\n使用方式如下：\n\n```\n.some-element {\n  width: grid-size(5);\n}\n```\n\n### 注意\n\
  \n你也可以按名称向 mixin 和函数传递参数。例如，`grid-size($columns: 5)`。\n\n# 面向对象 CSS\n\n虽然 mixin\
  \ 提供了很好的代码复用方式，但还有另一种方式可减少重复并鼓励抽象。Sass 提供了 `@extend` 指令机制。\n\n让我们看一个简单的 CSS 示例：\n\
  \n```\n.button {\n  ...\n}\n.shiny-button {\n  ...\n}\n```\n\n如果要创建一个闪亮按钮，元素需要附加两个类（`button\
  \ shiny-button`）。这容易出错，因为我们必须记住包含两个类；也会导致冗长的类列表。Sass 的 `@extend` 关键字可简化此问题。请看下面的版本：\n\
  \n```\n.button {\n  ...\n}\n.shiny-button {\n  @extend .button\n  ...\n}\n```\n\n\
  当我们创建一个类为 `shiny-button` 的 HTML 元素时，它将自动获得赋予 `button` 的所有规则，而无需在类列表中显式列出它。\n\n但有时，我们可能想复用样式而不弄乱\
  \ CSS。如果基类永远不会单独使用，则没有理由为它生成类名。在这种情况下，Sass 有占位符的概念。请看下面的示例：\n\n```\n%button {\n\
  \  ...\n}\n.shiny-button {\n  @extend %button\n  ...\n}\n```\n\n现在，我们可以像前面那样创建一个类为\
  \ `shiny-button` 的 HTML 元素，但无法创建仅类为 `button` 的元素，因为该类不存在。\n\n## 注意\n\n有一种称为 OOCSS\
  \ 的面向对象 CSS 形式。想了解更多，请参阅 [`appendto.com/2014/04/oocss/`](http://appendto.com/2014/04/oocss/)。本节标题使用“面向对象”仅因为它是描述\
  \ Sass 使用 `@extend` 时行为的最佳方式。\n\n# 模块和分部\n\nCSS 允许从其他样式表导入样式，Sass 进一步扩展了这一点，允许 Sass\
  \ 文件导入其他 Sass 文件。语法与 CSS 基本相同，只是省略了文件扩展名。请看下面的示例：\n\n```\n@import \"utils\", \"\
  grid\";\n```\n\n上述命令会在同一目录下查找 `util.scss` 和 `grid.scss` 文件并导入其规则。如果需要导入 CSS 文件，可以：\n\
  \n```\n@import \"vanilla.css\";\n```\n\n\n\n\n# Sass 部分文件\n\n导入的 Sass 文件可能不是你希望单独编译为\
  \ CSS 的文件。如果是这种情况，你可以在文件系统中给文件名前加上下划线。例如，沿用前面的示例，我们可以使用 `_util.scss` 文件代替 `util.scss`。`@import`\
  \ 的外观和工作方式相同，但 Sass 永远不会尝试创建 `_util.css` 文件（如果没有下划线，它会尝试创建 `util.css` 文件）。使用哪种方式主要取决于你是否希望生成相应的\
  \ CSS 文件。\n\n# 使用 Gulp 设置 Sass\n\n在使用 Sass 之前，我们需要在项目中安装它，然后向 `gulpfile.js` 添加一些额外的代码。值得庆幸的是，所有步骤都相当简单。步骤如下：\n\
  \n## 安装 Sass\n\n1. 通过执行以下命令安装 Gulp 可用的 Sass 版本：\n\n```bash\n$ npm install --save-dev\
  \ gulp-sass@2.0.4\n```\n\n## 配置 Gulp 路径\n\n2. 接下来，修改 `gulp/config.js` 以定义 SCSS 文件的位置以及输出应放置的位置：\n\
  \n```javascript\nassets: {\n    copy: […],\n    code: {…},\n    styles: {\n    \
  \    src:  \"www/scss/app.scss\",\n        dest: \"www/css\"\n    }\n}\n```\n\n\
  ## 创建 Sass 编译任务\n\n3. 现在，创建 `gulp/tasks/copy-scss.js`：\n\n```javascript\nvar gulp\
  \ = require(\"gulp\"),\n    sass = require(\"gulp-sass\"),\n    notify = require(\"\
  gulp-notify\"),\n    sourcemaps = require(\"gulp-sourcemaps\"),\n    gutil = require(\"\
  gulp-util\"),\n    config = require(\"../config\"),\n    settings = require(\"../settings\"\
  ),\n    paths = require(\"../utils/paths\");\n\nfunction copySCSS() {\n  var isRelease\
  \ = (settings.BUILD_MODE === \"release\");\n  var includePaths = []; // [1]\n  var\
  \ includeModules = config.sass &&\n        config.sass.includeModules;\n  if (includeModules\
  \ instanceof Array) {\n    includePaths = includePaths.concat(\n      includeModules.map(function(moduleName)\
  \ {\n        var module = require(moduleName);\n        return module.includePath;\n\
  \      }));\n  }\n  var moreIncludePaths = config.sass &&\n      config.sass.includePaths;\n\
  \  if (moreIncludePaths instanceof Array) {\n    includePaths = includePaths.concat(moreIncludePaths);\n\
  \  }\n  return gulp.src(paths.makeFullPath(\n                  config.assets.styles.src,\n\
  \                  paths.SRC)) //[2]\n    .pipe(isRelease ? gutil.noop() : sourcemaps.init())\
  \ //[3]\n    .pipe(sass({\n      includePaths: includePaths, //[4]\n      outputStyle:\
  \ (isRelease ? \"compressed\" : \"nested\") //[5]\n    }))\n    .on(\"error\", function(error)\
  \ {\n      this.emit(\"end\");\n    })\n    .on(\"error\", notify.onError(function(error)\
  \ {\n      return \"SASS: \" + error.message;\n    }))\n    .pipe(isRelease ? gutil.noop()\
  \ : sourcemaps.write()) //[3]\n    .pipe(gulp.dest(paths.makeFullPath(\n       \
  \   config.assets.styles.dest, paths.DEST)));\n}\nmodule.exports = {\n  task: copySCSS\n\
  }\n```\n\n## 理解 Sass 任务\n\n这看起来应该有点眼熟——这里有几行代码与我们在上一章中处理的 `copy-code.js` 任务非常相似。话虽如此，让我们来看看一些细节：\n\
  \n*   在文件开头附近（`[1]`），我们检查配置文件，看是否有希望 Sass 在执行 `@import` 时搜索的目录。我们可以将这些路径作为数组指定在\
  \ `sass.includePaths` 中，或者通过在 `sass.includeModules` 数组中列出它们，指定各种暴露了 `includePath`\
  \ 的 `npm` 模块。我们稍后将介绍一个示例。这些路径实际上在 `[3]` 中被使用。\n\n*   注意，我们只向 `gulp.src()` 传递了一个文件（`[4]`）。就像上一章中的\
  \ `babelify` 一样，我们只需要传递顶层 Sass 文件。Sass 将根据顶层文件中包含的导入语句发现需要处理的其他文件。然后，我们只需在 `index.html`\
  \ 文件中包含一个样式表。话虽如此，如果你想处理多个 Sass 文件，没有什么能阻止你包含多个文件。\n\n*   就像上一章一样，只有当我们不为生产环境构建时（`[3]`），才会渲染源映射。拥有源映射对于调试非常有用，但它们占用空间，而我们不需要将这些空间传递给用户。\n\
  \n*   当我们在发布模式下构建时（`[5]`），`outputStyle` 会被压缩。生成的输出不打算让人阅读，但浏览器仍然能很好地理解它。这有助于节省最终用户设备上的空间。\n\
  \n## 更新复制任务\n\n在实际使用此方法之前，我们需要修改 `gulp/tasks/copy` 任务，使其如下所示：\n\n```javascript\n\
  module.exports = {\n  deps: [\"copy-assets\", \"copy-scss\", \"copy-code\"]\n}\n\
  ```\n\n## 运行构建\n\n此时，我们可以执行 `gulp copy`，它将处理 `src/www/scss/` 文件夹中的 `app.scss`。完成后，`build/www/css/`\
  \ 中将会有一个 `app.css` 文件。此时，你可以通过在 `head` 部分添加以下行来修改 `src/www/index.html` 以包含样式表：\n\
  \n```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"./css/app.css\">\n\
  ```\n\n# 包含通过 npm 安装的样式表\n\n`npm` 不仅仅用于 JavaScript——有几个模块包含我们可以利用的 Sass 样式表。让我们用一个样式表“重置”（它清除浏览器应用于各种元素的各种样式）作为一个简单的例子。这种“重置”对于在不同浏览器和渲染引擎之间获得视觉一致性很有用，因为不同浏览器可能对元素有不同的默认样式。\n\
  \n### 注意\n\n注意：你可能更倾向于规范化元素样式而不是清除它们。如果是这种情况，请查看 [`www.npmjs.com/package/normalize-scss`](https://www.npmjs.com/package/normalize-scss)。\n\
  \n首先，执行以下命令：\n\n```bash\n$ npm install --save node-reset-scss@1.0.1\n```\n\n接下来，让我们向\
  \ `gulp/config.js` 添加以下对象：\n\n```javascript\n\"sass\": {\n  \"includeModules\":\
  \ [\n    \"node-reset-scss\"\n  ]\n}\n```\n\n此时，我们可以在 Sass 文件顶部使用 `@import \"reset\"\
  ;`。如果我们在 Gulp 配置中没有使用 `includePaths`，我们将需要使用 `@import \"../../../node_modules/node-reset-scss/scss/reset\"\
  ;`。就我个人而言，我会选择前者——它容易输入得多！\n\n不过，不能保证模块会通过 `includePath` 暴露其样式表的位置。如果没有，我们可以直接指定路径，如下所示：\n\
  \n```javascript\n\"sass\": {\n  \"includePaths\": [\n    \"./node_modules/node-reset-scss/scss\"\
  \n  ]\n}\n```\n\n# 总结和后续步骤\n\n在本章中，你了解了 Sass——一种允许我们编写模块化且减少重复 CSS 的语言。你还将 Sass\
  \ 集成到了构建过程中。此时，你已完成构建过程的设置。\n\n在下一章中，我们将介绍一些高级响应式设计，这将帮助我们创建应用程序的外观和感觉。\n"
- "# 响应式设计考量\n\n关于 `Cordova` 和 `PhoneGap` 一个非常常见的问题是 *如何正确处理不同的屏幕尺寸？* 不幸的是，这个问题通常在开发过程已经非常晚期时才被提出，此时将适当的修复引入代码已变得困难。开发人员使用硬编码尺寸构建了应用，通常忽略了宽高比差异，现在任何修复实施起来都很昂贵。因此，从应用开发的一开始，就至关重要的是要实现你的应用，使其能响应用户设备的尺寸。\n\
  \n`HTML` 天生是响应式的，但如果你使用基于像素的原点和尺寸，很容易破坏这种自然的响应性。只要尽可能避免这些陷阱，并使用百分比以及绝对和相对定位，你的应用将自然缩放以适应其所在的任何屏幕。结果可能不是你想要的（空白太多或太拥挤），但这些可以使用\
  \ `CSS` 轻松解决。\n\n\n\n# 响应式设计与像素密度\n\n处理图标时图片还比较简单——图标在任何设备上往往具有相同的尺寸和形状；但处理背景图片或填满屏幕宽高的图片时，情况则截然不同。图片对宽高比非常敏感，当图片的宽高比不正确时，观看者通常能立刻察觉。CSS3\
  \ 为此提供了相应的机制来帮助我们解决这些问题。\n\n## 本章概览\n\n在本章中，我们将涵盖以下内容：\n\n*   像素密度\n*   CSS3 单位，包括\
  \ `rem` 和视口单位\n*   媒体查询\n*   图片尺寸调整\n*   Flex-box 布局\n\n## 代码示例与资源\n\n本章中的多个代码片段也可通过随书代码包附带的交互式片段演练场使用。启动演练场的说明位于代码包中的\
  \ `README.md` 文件中。启动后，选择 **4: Responsive design**，然后浏览并尝试相关示例。在适用的情况下，每个章节和片段都会指明应选择哪个章节和示例。\n\
  \n虽然本书的演示应用仅专注于构建过程，但使用本章技术的完整代码位于代码包中的 `/logology-v04/` 目录下。建议阅读 `logology-readme.md`\
  \ 文件，以更好地了解底层代码和结构。您可以按照代码包中 `readme.md` 文件的说明，在设备上构建并运行该应用。\n\n## 设备屏幕的多样性\n\n\
  各种屏幕尺寸的设备主导着当今的移动市场。有些屏幕较小，为 4.5 英寸；有些则较大，达到 6 英寸。平板电脑当然更大，有 7 英寸、8.9 英寸、10 英寸等（最新发布的\
  \ iPad Pro 为 12.9 英寸）。\n\n更复杂的是，这些屏幕的分辨率也大不相同。屏幕的物理尺寸很难说明其包含多少像素——4.5 英寸屏幕的分辨率可能是\
  \ 320 x 480 像素，也可能是 640 x 960，或 1280 x 800。稍大一点的屏幕可能拥有显著更多的像素——6 英寸手机的分辨率可能高达 2560\
  \ x 1600。\n\n大多数开发者习惯将像素视为可直接控制的离散单位。换句话说，开发者认为可以单独确定屏幕上每个像素的颜色和亮度。虽然确实可以单独控制每个像素，但在渲染\
  \ Web 内容时，很快会遇到文本和其他元素尺寸方面的问题。只要设备使用大像素（对应低像素密度），就没有任何问题。但高密度显示屏普及的那一刻，Web 浏览器就面临了真正的问题。如果浏览器强制执行\
  \ 1:1 的像素映射，那么在分辨率为 1440 x 900 像素的桌面显示器上易于阅读的内容，在像素密度高得多的较小移动设备上就会变得极其微小。这对视力极好的年轻人可能不算什么，但无论渲染多么清晰锐利，大多数人长时间阅读极小字号的大量文本都很困难。\n\
  \n移动浏览器面临两难境地：要么要求用户将网页缩放到舒适的大小，要么由浏览器自动缩放网站。移动浏览器厂商选择了后者。为了确保网站仍能以相同的布局渲染，移动浏览器还会“欺骗”网站，报告的屏幕像素数少于实际像素数。报告像素与实际像素的比率称为**缩放因子**（`scaling\
  \ factor`）。大多数设备报告整数缩放因子，通常为 2:1。较新的设备拥有如此高密度的显示屏，以至于报告 3:1。\n\n这个缩放因子或缩放比率表示每个逻辑像素包含的物理像素数量。**逻辑像素**（`logical\
  \ pixel`）就是一组组合在一起形成一个可寻址单元的物理像素。开发者不一定能控制组内的每个像素——这是设备的责任。这使得具有不同缩放因子的新设备能够合理地按照设计师的意图渲染内容。文本和矢量图形可以自动受益于更高密度的屏幕，保持锐利。在最坏的情况下，图片会显得稍微模糊一些（因为设备必须对图片进行上采样以适应更多像素）。一旦某种像素密度足够普及，设计师就可以为这些特定设备生成更高分辨率的图片。\n\
  \n理论够多了。我们中有些人是视觉型学习者，下面通过一张图来展示其工作原理：\n\n![像素密度](img/9781OS_04_01.jpg)\n\n请注意，顶部展示了由缩放因子表示的三种不同像素密度。**@3x**（或\
  \ 3:1）表示 9 个物理像素对应 1 个逻辑像素（3 x 3）。**@2x**（2:1）将 4 个物理像素映射到 1 个逻辑像素（2 x 2）。最后，**@1x**（1:1）表示物理像素与逻辑像素之间存在直接的一对一映射。\n\
  \n在使用 CSS 和 HTML 时，几乎所有情况下我们处理的都是逻辑像素，而非物理像素。只有在处理图片或使用 HTML5 `canvas` 时，这才不完全适用。本书不讨论\
  \ HTML5 `canvas`，但我们必须在具有多种不同像素密度的屏幕上渲染清晰的图片。\n\n不幸的是，并非所有缩放因子都是整数。这意味着一个逻辑像素并不总能完全与离散的物理像素对齐。请看下图：\n\
  \n![像素密度](img/9781OS_04_02.jpg)\n\n注意物理像素如何无法完全容纳在逻辑像素内？这意味着无法确保像素级完美；总会存在一定程度的混合，即一个物理像素混合了两个逻辑像素的颜色。在高密度显示屏（如\
  \ iPhone 6s+）上，这不太明显，因为物理像素本身非常小。但在其他显示屏（如 2012 年的 Nexus 7）上，由于物理像素尺寸较大，这变得非常明显。此时你应该认识到，实现真正像素完美的希望已破灭，应放弃这一幻想。HTML\
  \ 本来就不是关于像素完美的。\n\n### Note\n\n这并不是说无法寻址每一个物理像素——是有办法的。但这通常需要大量艰苦的工作。值得注意的是，即使是\
  \ Apple 的 iPhone 6s+ 在使用原生用户界面控件时，也不渲染像素完美。在这个特定示例中，你必须回退到 `OpenGL`。\n\n上图并非设备将逻辑像素混合为物理像素的完美呈现。这取决于设备和所寻址的逻辑像素。因此，有时某条线或边框似乎未被混合，而另一条则会。这仅取决于逻辑像素恰好落在物理像素网格的何处。请看下图——虽然每条线都用单像素笔画绘制，但根据绘制位置的不同，会使用不同的物理像素来渲染最终结果。如果像素较大，这非常明显。\n\
  \n![像素密度](img/9781OS_04_18.jpg)\n\n您可能熟悉典型的 CSS 单位，如 `px`（像素）、`pt`（点）和 `em`（字体大小）。还有一些在印刷场景中更常用，如\
  \ `in`（英寸）和 `cm`（厘米）。您也应该熟悉指定百分比，以便内容能适当调整大小。\n\n\n\n\n## CSS3 单位\n\n不幸的是，这些单位虽然支持良好，但不如现代应用开发所需的灵活。值得庆幸的是，CSS3\
  \ 新增了几个新单位供我们利用，它们在移动平台上的支持也日趋完善。\n\n`em` 单位表示特定元素的 `font-size`。若元素的 `font-size`\
  \ 为 `20px`，则 `1em` 同样为 `20px`。这在过去很有用，因为它便于基于字体大小调整元素尺寸。`rem` 单位是该单位的扩展。`rem` 代表\
  \ `root em`，它允许我们指定一个在整个文档中一致的 `root em` 大小。也就是说，若我们在 `html` 元素上指定 `font-size: 16px`，则可在文档任意处使用\
  \ `1rem`，其将计算为 `16px`，无论该元素可能继承的任何 `font-size`。\n\n![The CSS3 units](img/9781OS_04_04.jpg)\n\
  \n上图有助于理清这种关系。请注意，`em` 单位代表的像素数随元素（或其父元素）的 `font-size` 而变化。但 `rem` 单位始终一致：它始终等于\
  \ `html` 元素的 `font-size`。\n\n### 视口单位\n\n其他有用的单位是视口单位，共有四种：\n\n*   `vw`：等于视口宽度的\
  \ 1%\n*   `vh`：等于视口高度的 1%\n*   `vmin`：等于视口最短边的 1%\n*   `vmax`：等于视口最长边的 1%\n\n从技术上讲，若最近的定位元素填满整个浏览器视口，前两个单位等同于使用百分比。当然，若元素未填满视口，百分比无法达到相同效果，这正是这些新单位如此有用的原因。\n\
  \n![The CSS3 units](img/9781OS_04_05.jpg)\n\n上图清晰地展示了这些单位的工作原理：`vw` 和 `vh` 单位始终分别代表视口宽度和高度的\
  \ 1/100。而 `vmin` 和 `vmax` 单位仅基于最短和最长轴。\n\n### `calc` 单位\n\n还有一个单位值得简要提及，虽然你可能不会立即将其视为单位：`calc`。如果你还记得，在\
  \ 第 3 章 *Sassy CSS* 中，我们讨论了如何使用 Sass 为我们执行计算。我们提到操作数必须具有相同单位。然而，CSS3 `calc` 表达式可处理混合单位，允许我们编写\
  \ `calc(25% + 25rem)` 或 `calc(25rem + 2vw)`，或几乎任何我们想要的表达式。下图直观展示了这一点：\n\n![The CSS3\
  \ units](img/9781OS_04_06.jpg)\n\n### 浏览器兼容性\n\n一切都很美好，直到我们谈论浏览器兼容性。桌面浏览器对这些单位支持良好，令人惊讶的是，许多现代移动浏览器也是如此。但有一些注意事项：\n\
  \n*   **视口单位**：iOS 6.1+ 和 Android 4.4+ 支持（参见 [caniuse.com](http://caniuse.com/#feat=viewport-units)）。遗憾的是，iOS\
  \ 6 和 7 对视口单位处理异常。网上有一个 buggyfill 可解决此问题：[viewport-units-buggyfill](https://github.com/rodneyrehm/viewport-units-buggyfill)。不幸的是，Android\
  \ 4.3 或更低版本无法支持，因此若以这些 Android 版本为目标，必须提供回退方案。\n*   **Root EM 单位**：iOS 4.1+ 和 Android\
  \ 2.1+ 支持良好（参见 [caniuse.com](http://caniuse.com/#feat=rem)）。可放心大量使用。但链接页面指出，某些 Android\
  \ 设备可能存在问题。\n*   **动态计算**：iOS 6+ 支持，但 iOS 6 需要 `-webkit-` 前缀。Android 支持不足。Android\
  \ 4.4 起部分支持加减法，直到 Android 浏览器版本 37 才完全支持。这意味着你可能应仅使用加减法，且对于运行 Android 4.3 或更低版本的设备，绝对需要回退方案。若可能，考虑改用\
  \ Sass 的 `calc` 函数，因为它在所有浏览器均可工作。\n\n若以非常新的现代平台为目标，你可能无需担心回退方案。例如，截至撰写时，仅以 iOS 8\
  \ 为目标即可覆盖 92% 的 iOS 市场，且无需视口 buggyfill。另一方面，仅 Android 4.4+ 以任何形式支持 CSS3 `calc` 函数，遗憾的是，截至撰写时，仅\
  \ 67% 的安装基数运行 4.4 或更高版本。\n\n### Tip\n\n可通过访问 [Android 版本分布仪表盘](https://developer.android.com/about/dashboards/index.html)\
  \ 确定任意 Android 版本的安装基数。iOS 请访问 [Apple App Store 支持](https://developer.apple.com/support/appstore/)。基于单个应用统计的替代视图见\
  \ [iOS Version Stats](http://david-smith.org/iosversionstats/)。\n\n本书代码包中有一个简短示例演示这些单位，位于\
  \ `snippets/04/ex1-css3-units/`。你可在浏览器或设备上运行。若使用交互式片段演练场，请选择 **4: Responsive Design**，**Example\
  \ 1**。\n\n## 媒体查询\n\n媒体查询是极其强大的构造，允许我们根据运行代码的设备属性构建响应式布局。例如，我们可根据屏幕宽度、高度或像素密度更改各元素的样式。或者，我们可检测各种设备能力，如色深，或判断是屏幕还是打印机。本节将重点介绍如何检测屏幕尺寸和像素密度。\n\
  \n媒体查询可使用 CSS `@import` 规则、样式表链接和 `@media` 规则定义。我们将聚焦于后者，因为它是典型形式。\n\n媒体查询通常如下所示：\n\
  \n```\n@media only screen and (max-width: 768px) and \n(max-resolution: 2dppx) {\n\
  \  /* some CSS rules that apply when this query is true */\n}\n```\n\n语法相当灵活，你可能已猜出上述规则的作用。但让我们梳理如何编写媒体查询：\n\
  \n*   `only`：用于阻止理解媒体类型但不理解媒体查询的旧版浏览器应用样式。\n*   `screen`：指定此查询仅适用于屏幕，而非纸张或其他设备。既然本书以移动设备为目标，`screen`\
  \ 最合理（我们通常不打印内容）。注意媒体类型（如 `screen`）不使用括号指定。\n*   `and`：连接过滤器。所有过滤器必须匹配查询才匹配。等同于\
  \ JavaScript 的 `&&` 运算符。\n*   逗号 (`,`)：连接过滤器，但仅需一个过滤器匹配查询即匹配。等同于 JavaScript 的 `||`\
  \ 运算符。\n*   `not`：否定查询。若使用 `and` 连接过滤器，则应用于整个查询；若使用逗号连接，则仅应用于单个过滤器。\n*   过滤器用括号括起，形式为\
  \ `media-feature:value`。\n*   媒体查询内的样式仅在整个查询匹配时应用。\n\nSass 为媒体查询增加了一项功能：可在选择器内部指定媒体查询。这使我们能将可能影响布局或样式的媒体查询保持在被修改项附近，如下例所示：\n\
  \n\n\n\n\n```css\n.someElement {\n    width: 100%;\n    min-width: 320px;\n    @media\
  \ only screen and (max-width: 320px) {\n        display: none; // hide this element\
  \ on screens that\n                       // aren't wide enough to show it.\n  \
  \  }\n}\n```\n\n## 媒体查询特性\n\n有许多特性可供我们筛选。让我们浏览一些常见的特性：\n\n*   `width` 筛选器基于视口的宽度。`min-width`\
  \ 设定宽度的下限，而 `max-width` 设定宽度的上限。例如，筛选器 `max-width: 320px` 将匹配宽度为 0 到 320 逻辑像素的任何视口，但不会匹配宽度为\
  \ 400 像素的视口。另一方面，`min-width: 320px` 将匹配宽度为 320 逻辑像素或更大的所有视口。如果使用 `width`（不带 `min-`\
  \ 或 `max-` 前缀），仅当视口宽度与指定宽度完全匹配时才会匹配。\n\n*   `height` 筛选器基于视口的高度。例如，`width`、`min-height`\
  \ 和 `max-height` 都可以使用，它们的工作方式与前一点相同（只是使用高度代替宽度）。\n\n*   `aspect-ratio` 筛选器基于视口的宽高比。宽高比是视口宽度与高度的比率。支持\
  \ `aspect-ratio`、`min-aspect-ratio` 和 `max-aspect-ratio`。\n\n*   `orientation` 筛选器基于视口是处于横向还是纵向。注意，这不一定表示设备的方向。就此特性而言，当视口宽度大于高度时匹配\
  \ `landscape`（横向），`portrait`（纵向）则相反。因此，在移动设备上，当设备物理上处于纵向时显示软键盘，可能会触发该值的变化，导致视口变得比高度更宽，这将被视为此筛选器的\
  \ `landscape`。\n\n*   `device-pixel-ratio` 筛选器基于物理像素与逻辑像素的比率。例如，1:1 的显示器比率为 `1`。2:1\
  \ 的显示器比率为 `2`。此特性不再是检测设备像素密度的首选方式，但 iOS 和 Android 4.4 以下版本仍常用。这些平台也都使用 `-webkit-`\
  \ 前缀。它们也支持 `min-device-pixel-ratio` 和 `max-device-pixel-ratio`。\n\n*   `resolution`\
  \ 筛选器基于设备的分辨率。最常用的两个单位是 `dpi` 和 `dppx`。前者基于每英寸的像素数进行匹配，而后者本质上等同于 `device-pixel-ratio`。由于浏览器支持原因，你需要在查询中同时处理这两个单位。`min-resolution`\
  \ 和 `max-resolution` 也受支持。\n\n### 注意\n\n如果你对媒体查询稍有了解，可能会认为我们这里遗漏了一些显而易见的特性。你说得对——我们没有列出\
  \ `-device-` 特性。这些特性不是基于实际视口，而是基于设备本身。许多开发者使用它们来检测正在渲染的设备；但随着新设备发布，屏幕尺寸和分辨率不断变化，这变成了一场永无止境的战斗。此外，如果你基于这些特性修改布局，可能得不到预期结果，因为浏览器视口不一定填满整个屏幕，尤其是同时运行多个应用时。依我之见，最好避免使用这些特性，仅依赖视口特定特性进行布局。\n\
  \n还有更多可用于检测的特性。全面讨论媒体查询超出了本书范围。如果你想深入了解媒体查询，请参阅 [MDN 媒体查询指南](https://developer.mozilla.org/en-US/docs/Web/Guide/CSS/Media_queries)。\n\
  \n## 特性检测的优势\n\n这种特性检测的优势在于，我们可以创建不仅仅是随视口大小简单缩放的布局。我们可以根据视口大小实际修改应用的整个布局。例如，在 iOS\
  \ 上，如果应用运行在 iPad 或 iPhone 6s+ 上，可能意味着并排显示两个视图，但在较小设备上，应用只会渲染单个视图。这让我们在不编写大量 JavaScript\
  \ 代码的情况下，就能极大程度地控制用户界面的外观。\n\n能够检测像素密度也至关重要。这主要不是为了布局，因为布局使用逻辑像素，而是为了图像和图标，它们混合使用逻辑和物理像素。\n\
  \n大多数 HTML 元素默认是响应式的，假设我们不针对其位置或大小使用基于像素的单位。位图（或栅格图像）则不同；它们在不丢失信息的情况下无法调整大小，所以我们必须单独处理它们。\n\
  \n## 图像渲染场景\n\n关于图像，有三种场景：\n\n*   渲染特定尺寸的图像，如图标或缩略图\n*   渲染需要自动调整大小以适应视口宽度的图像，如页头图像\n\
  *   渲染需要填满视口的背景图像\n\n在所有这些情况下，我们都希望图像尽可能清晰，且尽可能少地进行上采样，因为这会导致图像模糊。如果我们渲染图标，也应尽量避免下采样，因为这也会导致图标渲染不佳。\n\
  \n## 像素密度与图像清晰度\n\n在描述 1:1 像素映射（也称为低密度、loDPI 或非视网膜）显示器上的渲染，与同一图像在 2:1 像素映射（通常称为高密度、hiDPI\
  \ 或视网膜）显示器上的渲染之间的差异时，实际查看一些像素会有所帮助。让我们看一个图标，其内容清晰度很重要，因为任何模糊对查看者都显而易见：\n\n![图像尺寸](img/9781OS_04_03.jpg)\n\
  \n图像上半部分是 1:1 显示器的截图。下半部分来自 2:1 显示器。左侧是在我们包含一个没有 `width` 或 `height` 属性的 `img` 标签时渲染的。因为低密度版本是\
  \ `32 x 32 pixels`，高密度版本是 `64 x 64 pixels`，它们以两种不同的尺寸渲染。在右侧，渲染的是相同的图标，但每个都指定了 `width`\
  \ 和 `height` 为 `32px`。我们还应指出，渲染的两个图标并不相同：`@1x` 版本针对低密度显示器优化，使用 `32 x 32 pixels`；`@2x`\
  \ 版本针对高密度显示器优化，使用 `64 x 64 pixels`。*原因* 显而易见：我们希望图标在尽可能多的屏幕密度上看起来都尽可能清晰。\n\n现在应该很清楚为什么我们要关心上采样和下采样了。图像左上角的两张图清晰锐利，但左下角的两张图却模糊不清。这是因为浏览器正在对这些图像进行上采样，使它们无论屏幕分辨率如何，看起来大小大致相同。不幸的是，这种上采样必然会丢失信息，为了补偿，浏览器会对图像应用一些数学变换以避免像素化。这远非完美，而且也需要处理时间。因此，我们希望尽可能避免这种情况。\n\
  \n\n\n\n\n# 响应式图标和图片\n\n右上角的图标是一个很好的例子，说明了为什么最好避免将所有内容都从高密度版本进行下采样：在 1:1 显示器上，它远不如低密度版本清晰。这是因为浏览器现在必须将四倍数量的像素塞进四分之一的空间里，因此一些信息必然会*丢失*。有时这效果还可以——例如图标中的某些线条依然清晰——但其他时候，这会产生模糊的线条。\n\
  \n右下角的两个图标代表同一张图片，但在 2:1 显示器上。第二个图标清晰锐利。而第一个图标则再次变得非常模糊。这是因为低密度版本必须上采样到 2:1 显示器，以便显示为相同的尺寸。\n\
  \n此时，应该很明显，每个图标的实际分辨率与我们在告诉 HTML 或 CSS 图片大小时所用的尺寸之间存在脱节。低密度版本是 `32 x 32 pixels`，高密度版本是\
  \ `64 x 64 pixels`。但在两种情况下，我们都需要告诉浏览器图标是 `32 x 32 pixels`。但这确实意味着，为了获得最佳效果，我们需要向浏览器提供正确版本的图标，否则会得到不理想的结果。这也意味着我们需要创建针对图标将要显示的密度进行优化的版本——仅在\
  \ Photoshop 中进行上采样或下采样会产生相同或类似的次优结果。\n\n## 提示：使用矢量图形\n\n基于这个原因，建议您使用矢量图形而非位图来设计素材。矢量图形可以根据需要轻松调整大小和微调以获得所需输出，但位图只能缩放，这可能导致模糊的结果。\n\
  \n您可以使用各种机制来确保浏览器显示合适的图标版本，但具体使用哪一种通常取决于上下文。\n\n### 结合 `srcset` 使用 `img`\n\n如果您使用\
  \ `img` 标签，可以使用 `srcset` 属性请求合适的版本。使用此属性有不同的方式，但我们关注的是像素密度。以下代码可处理 1:1、2:1 和 3:1\
  \ 密度的显示器：\n\n```html\n<img src=\"calendar.png\" srcset=\"calendar.png 1x, \ncalendar@2x.png\
  \ 2x, calendar@3x.png 3x\" />\n```\n\n您可以根据需要包含任意数量的图标版本；浏览器将尝试选择最佳选项。当然，为了获得最佳显示效果，最好提供针对您的应用可能运行的每种显示密度的版本。\n\
  \n### 结合媒体查询使用 `background-image`\n\n如果您在 CSS 中使用 `background-image`，则需要不同的机制：媒体查询。请看下面的例子：\n\
  \n```css\n.icon {\n    width: 32px; height: 32px;\n    background: url('./calendar.png')\
  \ no-repeat center center\n                / 32px 32px;\n}\n@media only screen and\
  \ (-webkit-min-device-pixel-ratio: 1.01),\n  only screen and (min-resolution: 1.01dppx),\n\
  \  only screen and (min-resolution: 193dpi) {\n    .icon {\n        background-image:\
  \ url('./calendar@2x.png');\n    }\n}\n@media only screen and (-webkit-min-device-pixel-ratio:\
  \ 2.01),\n  only screen and (min-resolution: 2.01dppx),\n  only screen and (min-resolution:\
  \ 289dpi) {\n    .icon {\n        background-image: url('./calendar@3x.png');\n\
  \    }\n}\n```\n\n在前面的例子中，您可能会想知道为什么我们要对像素比使用小数边界。如果我们指定 `min-resolution: 1dppx`，我们就是在告诉浏览器在\
  \ 1:1 显示器上渲染 2:1 版本。这是我们要避免的。然而，如果我们指定 `min-resolution: 2dppx`，介于 1:1 和 2:1 之间的任何显示器最终都会*上采样*\
  \ 1:1 版本，而不是*下采样* 2:1 版本。虽然两者都不理想，但 2:1 版本在这类显示器上的渲染效果会比 1:1 版本好。从技术上讲，这就是为什么 `dpi`\
  \ 版本好得多的原因；我们不必担心小数。\n\n## 注意：为什么是 193dpi？\n\n那么，为什么是 `193dpi`？它是与 `1.01dppx` 匹配的最接近的模拟值。`289dpi`\
  \ 同理——它与 `2.01dppx` 非常接近。\n\n如果您想偷懒，可以直接让浏览器下采样您拥有的最密集版本的图标。这*行得通*，但并不完美。首先，最佳效果只会出现在密度是最高版本一半（或四分之一，依此类推）的显示器上。其次，浏览器被迫做不必要的更多工作。如果经常这样做，您应用的渲染性能可能会受损。\n\
  \n如果您查看本书的代码包，有一个示例可以在您自己的浏览器或设备上运行，演示了这些不同的技术。它位于 `snippets/04/ex2-responsive-icons/index.html`。如果您使用交互式代码片段演练场，请选择\
  \ **4: Responsive Design**（响应式设计）和 **Example 2**（示例 2）。\n\n## 提示：为不同密度设计图标\n\n图标通常需要修改才能在不同像素密度的显示器上呈现最佳效果。例如，某些图标需要在其\
  \ 1:1 版本中简化，而 3:1 版本可能需要细微调整才能在高密度显示器上看起来最好。设计图标时，最好始终在矢量编辑器中进行。先为高密度显示器设计；然后为任何低密度显示器做出相应调整。\n\
  \n代表照片的图片比图标表现好得多，但我们没有理由在高密度显示器上显示模糊的照片。幸运的是，在 1:1 显示器上对高密度图片进行下采样，比对图标进行下采样要不明显得多。这仍不理想，因为浏览器必须做额外的工作在低密度显示器上渲染高密度图片。因此，最好使用图片编辑器对图片进行下采样，并向浏览器提供正确的图片。\n\
  \n当我们知道图片在屏幕上的尺寸时，为许多不同的显示密度提供优化版本很容易。然而，有时我们无法适应每一种可能的尺寸变化。这通常发生在我们希望图片填满视口宽度但保持正确宽高比时。其他时候，我们可能希望图片作为背景（甚至前景）图片填满视口。同样，我们希望保持宽高比。由于屏幕密度和分辨率的数量众多，我们无法为可能遇到的所有变化创建图片的最佳版本。\n\
  \n一种常见模式是在标题中渲染一张填满设备宽度的图片。这种模式看起来类似于下图：\n\n![图片尺寸调整](img/9781OS_04_07.jpg`)\n\n\
  通常，图片高度有一个上限，这样图片下方的文字始终清晰可见。在这种情况下，人们也会想偷懒，直接缩小最密集的图片。但正如我们已经提到的，这会对性能产生负面影响。最好能确定图片中的所有像素是否都能被渲染；如果不能，您可以使用密度较低的图片。\n\
  \n这种模式很容易实现——CSS 实际上非常简短：\n\n```css\n.fancy-heading {\n    background: #789 url('./header-1024.jpg')\
  \ no-repeat right 33% \n                / cover;\n    width: 100%;\n    height:\
  \ 25vw; min-height: 250px;\n    position: relative;\n}\n@media only screen and (min-width:\
  \ 1025px),\n  only screen and (min-width: 513px) \n  and (-webkit-min-device-pixel-ratio:\
  \ 1.5) {\n    .fancy-heading {\n        background-image: url('./header-2000.jpg');\n\
  \    }\n}\n```\n\n\n\n\n尽管 CSS 代码很短，但这里发生了不少事情。如果你在浏览器中打开代码包中的 `snippets/04/ex3-responsive-header-images/index.html`\
  \ 并调整浏览器宽度，就能看到这一点。标题会根据尺寸调整大小，且图片始终填满标题区域。同样，你会注意到标题文本的大小也会根据浏览器窗口或设备的宽度而改变，尽管前面的\
  \ CSS 中未展示这一点。\n\n## 注释\n\n如果你愿意，也可以使用交互式代码片段演练场查看该示例。选择 **4: Responsive Design**（4：响应式设计），**Example\
  \ 3**（示例 3）。\n\n这段 CSS 有几个有趣的特性：\n\n*   `background-size` 的值设为 `cover`（如 `background`\
  \ 属性简写中斜杠后所示）。这指示浏览器调整图片大小以覆盖整个区域。浏览器也会保持图片的宽高比。\n*   `background-position` 的值设为\
  \ `right 33%`。我们可以指定所需的任何位置；这仅取决于我们使用的图片，以及是否有重要内容需要尝试保持可见。\n*   `height` 值为 `25vw`。这确保标题始终为视口宽度的\
  \ 25%。我们还设置了 `min-height`，只是为了防止高度变得太小。\n*   默认情况下，我们使用的图片宽 `1024 x 512 px`。这是从原始图片（宽\
  \ `2000 x 1000`）降采样而来的。如果浏览器宽度大于 `1024 逻辑像素`，我们不妨自动切换到更大的图片。否则，浏览器将不得不上采样较小的图片。\n\
  *   对于 `1.5:1` 或更高的像素密度，当逻辑像素宽度超过 `512 px` 时，我们显示一张更大的图片。我们本可以指定 `2:1` 密度；但如果像素密度大于\
  \ `1:1`，最好进行降采样而不是上采样。我们在这里选择的比例相当随意。\n\n覆盖在该图片上的文本也是响应式的——大小根据浏览器宽度变化。然而，在某些情况下，我们可能想要限制字体大小。此外，既然此示例在任意图片上有文本，添加额外属性以使文本更易读会很有帮助。以下是\
  \ CSS：\n\n```css\n.fancy-heading h1 {\n    box-sizing: border-box;\n    font: normal\
  \ 10vw Helvetica, sans-serif;\n    text-align: right;\n    color: white;\n    text-shadow:\
  \ 0 5px 5px black;\n    background-image: linear-gradient(180deg, rgba(0, 0, 0,\
  \ 0), \n        rgba(0, 0, 0, 0.75));\n    position: absolute;\n    bottom: 0px;\n\
  \    left: 0; right: 0;\n    padding: 10px; margin: 0;\n}\n@media only screen and\
  \ (min-width: 1024px) {\n    .fancy-heading h1 {\n        font-size: 77pt;\n   \
  \ }\n}\n```\n\n让我们回顾一下前面代码中有趣的部分：\n\n*   `text-shadow` 属性用于通过在文本周围渲染阴影，将文本与其背景分离。如果背景图片有接近白色的区域，这特别有用。\n\
  *   `background-image` 属性指定了一个渐变，使文本后方的区域变暗。同样，这是为了提高可读性。\n*   `font-size` 值为 `10vw`，即视口宽度的\
  \ 10%。然而，如果尺寸变得太大，我们将其限制在 `77pt`。注意这具有随意性——取决于你认为什么看起来最好。\n\n请注意，阴影和渐变对性能影响较大；浏览器必须计算阴影和渐变的外观，这需要额外时间。不要过度使用这些效果，否则你的应用可能会开始变得迟缓。\n\
  \n另一种典型模式是全屏图片。借助视口单位，这可以通过仅对前面的代码进行微小变化来实现：\n\n```css\n.fancy-heading {\n    ...\n\
  \    width: 100vw;\n    height: 100vh;\n}\n```\n\n如果你不想使用视口单位，通过绝对定位图片并将 `top`、`left`、`right`\
  \ 和 `bottom` 属性设为 `0`，也能实现相同效果。\n\n## 注释\n\n此示例位于本书代码包的 `snippets/04/ex4-responsive-fullscreen-images`\
  \ 中。如果你愿意，也可以使用交互式代码片段演练场查看该示例。选择 **4: Responsive Design**（4：响应式设计），**Example 4**（示例\
  \ 4）。\n\n到目前为止，我们一直在使用 `cover`，这很棒，除非你想确保整个图片始终可见。如果你需要后者，请改用 `contain`。不过你需要一个合适的\
  \ `background-color` 值，因为图片可能不会完全填满元素。相反，浏览器会将图片适配在元素区域内，并找到能在不裁剪的情况下使用的最大尺寸。\n\n\
  CSS 中的复杂布局常常是挫败感的来源。有时，可以使用 `display: table-*` 变体来达到预期效果；但这些对于非表格数据远非理想。\n\n**Flexbox\
  \ 布局模块**为我们提供了控制元素布局的机制，即使父元素或视口的尺寸未知。这使其成为响应式移动应用的理想选择。Flexbox 在现代浏览器中拥有相当好的支持（参见\
  \ `http://caniuse.com/#feat=flexbox`）。不幸的是，规范经历了多次迭代，旧版浏览器在那些阶段实现了规范。低于 `iOS 6.1`\
  \ 和 `Android 4.4` 的版本使用旧版语法。因此，如果你打算支持其中任何一个，就必须支持规范的多个版本。通常这不难；但旧版本并不总是支持相同的功能。在大多数浏览器中，你还必须使用适当的前缀，如\
  \ `-webkit-`。\n\n在本节中，我们将使用现代 Flexbox 语法。不过，还有许多其他工具可用于自动提供前缀，包括 `Autoprefixer`\
  \ (`https://github.com/postcss/autoprefixer`)，甚至可以开发 `Sass` mixin 来做同样的事。\n\n首先，我们需要理清一些术语。Flexbox\
  \ 的布局规则可影响两种不同类型的元素：容器和项目。这显而易见；但当我们处理 HTML 时，我们通常从父子关系的角度考虑元素。在 Flexbox 布局中，容器本质上是父元素，而项目是直接后代。从视觉上看，关系如下图所示：\n\
  \n![Using flex-box layout](img/9781OS_04_08.jpg)\n\n注意容器元素接收 `display: flex` 样式规则。这指示容器以灵活的方式布局其项目。相对于其父元素，容器本身的布局表现得就像设置了\
  \ `display: block` 样式一样。如果需要，还有一个 `inline-flex` 选项（等同于 `inline-block`）。\n\n内部的项目将自动以灵活方式布局；但你几乎肯定想指定这些项目如何增长或收缩。有三条规则可实现这一点：\n\
  \n*   `flex-grow`：确定元素是否可以增长，以及相对于其他项目能增长多少。默认情况下禁用增长，但将此属性设为零也将禁用增长。\n*   `flex-shrink`：确定元素是否可以收缩。默认情况下允许收缩，但将此属性设为零也将禁用收缩。\n\
  *   `flex-basis`：确定元素在增长或收缩前的默认尺寸。如果指定 `auto`，浏览器会根据 `flex-grow` 调整尺寸。\n\n有一个名为\
  \ `flex` 的简写属性，这就是你在前面的图片中看到的每个项目的属性。顺序为 `flex: <flex-grow> <flex-shrink> <flex-basis>`。后两个数字不是必需的；如果未指定，浏览器会智能地计算它们。\n\
  \n\n\n在前面的示例中，你可以看到我们阻止了最左侧两个元素的增长。然而，最右侧的元素可以自由填充剩余空间，并且它确实这样做了。\n\n`flex-grow`\
  \ 不仅仅是一个启用或禁用增长的开关。它还可以用来确定项目之间的相对增长。如果除中间项目外的所有项目都获得 `flex-grow: 1`，而中间项目获得 `flex-grow:\
  \ 2`，正如你在下图所见，它的宽度将是其他项目的两倍：\n\n![Using flex-box layout](img/9781OS_04_09.jpg)\n\
  \nFlexbox 还可以使用 `flex-wrap` 来换行那些可能无法适应容器的项目。你可以为该属性提供的值有 `nowrap`、`wrap` 和 `wrap-reverse`。前两个应该很容易理解，但最后一个很有趣；它允许你反转布局的顺序。\n\
  \n从视觉上看，换行效果如下图所示：\n\n![Using flex-box layout](img/9781OS_04_10.jpg)\n\n### Tip\n\
  \n不幸的是，使用旧版 Flexbox 语法的设备将无法处理此功能——它们不支持换行。遗憾的是，这消除了该模块的大量灵活性，且没有很好的变通方法。就我们的目的而言，我们假设你使用的是拥有相当现代浏览器的设备（iOS\
  \ 6.1+ 或 Android 4.4+）。\n\nFlexbox 还允许我们通过一个名为 `justify-content` 的属性来确定元素间间距的应用方式。允许以下几个值：\n\
  \n*   `flex-start`：这将项目对齐到容器的开始位置\n*   `flex-end`：这将项目对齐到容器的结束位置\n*   `center`：这将项目对齐到容器的中心位置\n\
  *   `space-between`：这会在项目之间根据需要添加空间，但在开始或结束位置不添加空间\n*   `space-around`：这会在项目周围根据需要添加空间，包括开始或结束位置的项目\n\
  \n下图演示了 `space-between`：\n\n![Using flex-box layout](img/9781OS_04_11.jpg)\n\n你可能已经注意到，我们试图避免在涉及这些属性时提及宽度、左侧或右侧。这是有充分理由的：Flexbox\
  \ 既允许水平布局（`row`），也允许垂直布局（`column`）。相同的属性可用于每种方向，因此用容器的开始或结束来描述比用容器的左侧或右侧更合理。\n\n\
  要改变布局方向，可以使用 `flex-direction` 属性。它接受四个值：\n\n*   `row`：这会水平排列项目，就像文本一样（从左到右或从右到左，取决于语言）。这是默认值。\n\
  *   `row-reverse`：这会水平排列项目，但顺序相反。\n*   `column`：这会垂直排列项目。\n*   `column-reverse`：这会垂直排列项目，但顺序相反。\n\
  \n让我们看一个垂直布局的示例：\n\n![Using flex-box layout](img/9781OS_04_12.jpg)\n\n正如你所见，在布局方面，Flexbox\
  \ 给了我们很多选择。还有许多其他属性可供使用。遗憾的是，我们无法在本章涵盖所有内容。一个很棒的参考资料在 [`css-tricks.com/snippets/css/a-guide-to-flexbox/`](https://css-tricks.com/snippets/css/a-guide-to-flexbox/)\
  \ 。请将其加入书签；在使用此布局模块时你很可能会需要它（我确实需要！）。\n\n那么，我们如何将所有这些结合起来以创建复杂布局呢？比如说，像下面这个？\n\n\
  ![Using flex-box layout](img/9781OS_04_13.jpg)\n\n前面的布局包含相当多的内容。在左侧，你可以看到宽屏设备上的布局效果。在右侧，是窄屏设备上的布局。事实上，如果设备更窄，导航栏的高度会根据需要增长，以避免截断搜索组件。\n\
  \n我们可以非常轻松地实现此布局。我们将省略颜色、字体等，仅专注于我们使用的 Flexbox 属性。下图展示了如何实现此布局：\n\n![Using flex-box\
  \ layout](img/9781OS_04_14.jpg)\n\n### Note\n\n如果你想查看一个功能示例，请访问本书代码包中的 `snippets/04/ex5-flexbox-ui/index.html`。如果你正在使用交互式片段演练场，请选择\
  \ `4: Responsive Design` 和 `Example 5`。\n\n现在，那里发生了相当多的事情，它展示了如何使用 Flexbox 模块实现复杂布局。让我们回顾一些更有趣的细节：\n\
  \n*   值得注意的是，在本例中 `y-container` 是绝对定位的，并锚定在视口的四个角。\n*   外层容器 `y-container` 使用 `flex-direction:\
  \ column` 进行垂直定向。这让我们能够包含一个非绝对定位的导航栏。虽然绝对定位导航栏没有错，但如果栏可以增长，就很难确保它不会遮挡其他可能无法移开的内容。当然，你可以要求导航栏始终保持特定高度，但这并不总是理想的。在我们的示例中，如果项目不全都适合，我们允许导航栏扩展。如果我们使用绝对定位，这肯定会覆盖它下方的项目。\n\
  *   导航栏 `y-nav` 通过 `flex: 0 0 auto` 被禁止伸缩。这是因为我们不希望导航栏占用比它真正需要的更多（或更少）的空间。\n*  \
  \ 另一方面，滚动容器 `y-scroll-container` 通过 `flex: 1` 被允许伸缩。它将填满导航栏剩下的任何空间。\n*   在导航栏内部，有三个\
  \ `y-widget-group` 元素。除了中间的项目，这些都不允许伸缩。然而，中间的项目可以占用剩余空间。在我们的示例代码中，最右侧的项目实际上设置了 `width:\
  \ 25vw`。因此，该元素确实会调整大小，但依据的是视口宽度，而非 Flexbox 容器。\n*   导航栏还允许换行。如果导航栏太窄，每个组件组都可以换行到下一行。这使得每个项目都能保持可见和可用，而无需求助于截断或隐藏。\n\
  *   在滚动容器内部，我们有一个列表 `y-list`。正如你从示例图中所见，该列表可以根据需要将自身分割成多列。这是通过在 `y-list` 元素上放置 `flex-wrap:\
  \ wrap`，然后在项目上放置 `flex: 1 1 20rem` 来实现的。这将 `flex-basis` 设置为 `20rem`，这意味着浏览器将基于此值而非其内在尺寸（那会小得多）来确定每个项目的大小。这也意味着浏览器会增长元素的尺寸，直到能在同一行容纳两个（或更多）\
  \ `20rem` 的元素。这意味着我们的列表项通常将是 `20rem` 或更宽。然而，我们也允许它们收缩（`flex-shrink: 1`）。因此，如果浏览器可用空间较少，它会根据需要减小项目的宽度。\n\
  \n一旦你开始从 Flexbox 模块的角度思考布局，许多复杂的布局就变得可能甚至简单了。虽然我们以前总能生成相当复杂的布局，但这通常需要跳出框框的思维和绝对定位。有时，这些方法非常脆弱；一个过大的元素可能会破坏整个布局。\n\
  \n所有这些灵活性确实是有代价的：浏览器必须做更多的工作来计算所有元素的位置。这意味着你必须决定增加的灵活性是否值得性能的下降。如果你有大量项目使用 Flexbox，可能会注意到用户界面有些迟缓。因此，你需要仅在适当的时候使用它。\n\
  \n\n\n"
- "# 无障碍访问\n\n正如我们之前提到的，你还需要知道，只有使用相当现代的浏览器引擎的设备才能很好地支持这种布局类型。我们的示例假设运行 iOS 6.1 或更高版本以及\
  \ Android 4.4 或更高版本。支持旧版 Flexbox 语法的旧浏览器仍可参与，但不支持换行特性，这会严重阻碍复杂布局。如果你足够努力，通常可以为这些浏览器提供降级方案或其他变通办法。但只有你自己能决定这是否值得你投入时间和精力。\n\
  \n在本章中，我们涵盖了大量内容，全部与响应式设计有关。我们永远不知道我们的应用可能面临什么设备尺寸，我们希望确保它在几乎任何环境中都能呈现出最佳效果。在本章中，我们介绍了逻辑像素与物理像素的区别、如何响应式地渲染图像，以及如何使用\
  \ Flexbox 模块构建复杂的用户界面。\n\n在下一章中，你将学习如何使我们的应用对可能有视力障碍的用户可访问。\n\n无障碍访问对于你的移动应用至关重要，尽管它经常被忽视。它的重要性不亚于本地化和全球化（甚至可能更重要），特别是因为实现应用无障碍并不要求精通多种语言，也不需要支付他人进行翻译。\n\
  \n然而，应用无障碍访问往往被忽视，即使是在原生应用中也是如此。这很遗憾，特别是对于原生应用，因为使用原生 SDK 添加无障碍功能非常容易。\n\n混合应用在现代设备上也对无障碍功能有良好的支持。因此，混合应用开发者没有理由不在他们的应用中实现无障碍功能。\n\
  \n如果你不需要任何无障碍功能，很容易忽略这一点。如果你的视力是 20/20（视力表标准视力），听力极佳，或者你没有任何灵活性障碍，很容易忘记其他想使用你应用的人可能无法以同样的方式使用你的应用。\n\
  \n在本章中，我们将介绍一些创建可供用户无障碍访问的应用的方法。以下是本章将涵盖的内容：\n\n*   无障碍功能的类型\n*   免费获得的无障碍支持\n*\
  \   什么是 WAI-ARIA？\n*   WAI-ARIA 角色\n*   无障碍示例\n    *   表现与内容的分离\n    *   可访问的图标按钮\n\
  \    *   可访问的导航\n    *   可访问的列表\n    *   可访问的警报和对话框\n*   与原生无障碍功能融合\n    *   安装\
  \ PhoneGap 移动无障碍插件\n    *   检测用户首选的文本大小\n    *   检测屏幕阅读器\n    *   朗读自定义文本\n    *\
  \   实用工具\n\n本章中的几个示例也可以通过随本书代码包附带的交互式代码片段演练场来体验。启动演练场的说明在代码包中的 `README.md` 文件里。启动后，选择\
  \ **5: Accessibility**（5: 无障碍访问），然后选择第一个示例。\n\n在使你的应用无障碍时，你可能需要考虑许多不同类别的无障碍功能。当然，你需要考虑你的应用是否真的需要考虑这些类别。但了解用户可能拥有的各种需求很重要。让我们来回顾一下各种形式。\n\
  \n你可以查看 [`webaim.org/articles/`](http://webaim.org/articles/)，那里有关于各种残疾类型以及如何最好地帮助用户的大量信息。我们在以下部分总结了这个极佳资源中的一些信息，但你真的应该完整地浏览该网站。\n\
  \n## 色觉缺陷\n\n你的许多用户可能有色觉缺陷（也称为*色盲）。请参阅 [`en.m.wikipedia.org/wiki/Color_blindness`](https://en.m.wikipedia.org/wiki/Color_blindness)\
  \ 了解一些患病率统计数据。\n\n“色盲”这个词用得不太准确；并不是受影响的人完全看不见颜色——他们中的许多人能看见。只是他们可能难以将某些颜色与其他颜色区分开来。全色盲（完全看不见颜色）*极其*罕见；大多数人确实能看见许多不同的颜色。\n\
  \n有几种不同的缺陷类型：红色弱、绿色弱、蓝色弱和全色盲。这种缺陷是由于个体眼睛中的视锥细胞对特定波长的光不敏感所致。例如，红色弱个体的眼睛中的视锥细胞对红光不太敏感。\n\
  \n有一个简单的方法可以帮助任何有色觉缺陷的用户：不要仅依靠颜色来传达信息。例如，如果你的应用用红色标识错误状态，用绿色标识正常状态，红色弱用户可能无法分辨两者的区别。\n\
  \n### 提示\n\n你应该避免使用颜色传达信息的另一个原因是：颜色可能因用户所在的位置不同而含义不同。绿色不总是意味着*通行*，红色不总是意味着*停止*。\n\
  \n对于许多应用来说，色觉缺陷通常影响不大。话虽如此，任何依赖用户将颜色与其他颜色区分开来的应用（也许是一个泡泡消除游戏或绘图应用）都应该提供一些替代方式来传达重要的颜色信息（也许可以通过使用其他图标）。\n\
  \n## 低视力\n\n低视力是指无法通过眼镜或隐形眼镜矫正的视力缺陷。低视力有很多种，如黄斑变性、青光眼、白内障等。但总体而言，低视力用户很难分辨非常小或对比度低的任何东西。\n\
  \n这种残疾绝对会影响应用的用户界面设计。网站和应用使用非常小的字号以及前景色和背景色对比度低的情况非常常见。这些内容有时即使对于视力完美的人也难以阅读，但低视力个体肯定会在这种类型的内容上遇到很大问题。\n\
  \n有几种方法可以帮助这些用户，如下所示：\n\n*   增大字体大小\n*   增加对比度\n\n这并不一定意味着你的应用必须默认两者都做。也许你喜欢某种低对比度的配色方案。你可以随时提供一个设置，允许用户在需要时切换到高对比度配色方案。字体大小也是如此；允许用户将字体大小更改为舒适的大小，可能比*以防万一*一开始就设置大字号更可取。\n\
  \n### 注意\n\n值得注意的是，iOS 和 Android 都支持在各自平台的“设置”应用中设置更大的字体大小。不幸的是，混合应用不会自动继承此设置，但有一个可用的插件可以为我们处理这个问题。我们将在本章后面讨论这个插件。\n\
  \n## 失明\n\n直到这一节，我们还能依赖用户能够感知某些视觉线索。例如，用户可能无法分辨某些颜色，但他们可以看到信息是如何分组在一起的。\n\n然而，对于盲人用户，我们不能依赖*任何*视觉线索来帮助用户浏览我们的应用。这意味着我们对用户能够点击按钮或滚动长文本的典型预期完全落空了。\n\
  \n\n\n\n# Web 应用程序的无障碍注意事项\n\n值得庆幸的是，有许多软件可以将 Web 内容转换为盲人用户更易用的形式。此外，移动设备在操作系统中内置了广泛的无障碍功能，为盲人提供帮助。应用程序可以免费获得其中一些功能，但我们的应用程序也可以通过提供更具体的提示来改善体验，以便辅助技术能更好地理解我们应用程序的意图。\n\
  \n在使应用程序对盲人无障碍时，重要的是要认识到以下几个关键点：\n\n*   **图像不可用**。只要可能，请提供文本表示。请记住，这些替代表示不必是字面上的。如果您有一个代表停车标志的图像，当显著信息仅仅是*停止*时，您不一定需要将其描述为一个涂有红漆并带有白色字母的八边形物体等。\n\
  *   **上下文很重要**。视力好的人可以从视觉上推断出大量上下文。对于视力不好的人来说，唯一的上下文就是刚刚传达的信息。项目呈现给用户的顺序通常是源代码或\
  \ DOM 顺序。因此，如果您的 DOM 顺序混乱，您的应用程序将毫无意义。\n*   **导航从链接到链接进行**。用户不是通过滚动并直接点击想去的地方，而是按顺序导航链接。这意味着如果您的可导航项目顺序混乱，用户可能会感到困惑。\n\
  *   应用程序应提供跳过重复、冗长或繁琐内容的方式。\n*   屏幕上的内容不会立即*完全可见*。用户需要等待，直到他们的辅助技术将信息提供给他们。根据辅助技术和内容的不同，这可能需要相当长的时间。\n\
  \n## 听觉障碍\n\n不产生声音的应用程序无需担心听觉障碍。但如果您的应用程序播放视频或音乐，或者您的应用程序是一款播放音效等的游戏，您绝对应该为用户提供无障碍功能。\n\
  \n我们不会详述各种类型的听力障碍，因为解决方案是一样的：为音频材料提供字幕和文字记录。对于游戏，您可以在游戏内实体发出声音时，提供该声音的屏幕表示。\n\n\
  ## 运动障碍\n\n运动障碍意味着您的用户可能无法像手指完全正常的人那样与设备交互。用户可能无法直接触摸屏幕，或者在执行手势（如捏合缩放）时有困难。在这些场景中，为手势提供备选方法是明智之举。对于那些需要按顺序与您的应用程序交互的人来说，提供跳过冗长或繁琐材料的方法也很重要。这也意味着您的内容需要按合乎逻辑的顺序排列，并提供正确的上下文。\n\
  \n## 阅读障碍\n\n阅读障碍是一种极其常见的认知障碍，会损害语言或视觉处理能力。对于长段文本，一些阅读障碍患者发现特制字体会有所帮助。其中一种字体是 OpenDyslexic。可在\
  \ `http://opendyslexic.org` 获取。虽然这不一定应该成为您应用程序的默认字体，但如果您的应用程序显示大量文本（例如电子书应用），您可能需要考虑将其作为一项可供阅读障碍用户启用的选项。\n\
  \n## 癫痫发作\n\n对于大多数生产力或企业应用程序来说，这不是什么大问题；但了解这一点很重要，特别是如果您正在开发游戏，或者想通过快速闪烁某些东西来吸引用户注意力。\n\
  \n简而言之，除非您提供适当的警告和禁用该功能的机制，否则不要快速频闪或闪烁项目。这些会导致用户感到恶心和头晕；更糟糕的是，一些用户可能会经历癫痫发作。\n\n\
  游戏显然是可能无法避免这种情况的地方；游戏可能依赖于此。《Super Hexagon》就是一个典型例子；游戏的难度取决于闪烁、频闪和旋转的游戏区域。在这些情况下，明智的做法是放置一条警告，提醒那些容易因屏幕内容而感到头晕、恶心和/或癫痫发作的用户避免使用该应用。\n\
  \n## HTML 与无障碍历史\n\n在上一章中，我们提到 HTML 和 CSS 在设计上主要是响应式的。实际上，阻止 HTML 响应式需要一些工作。\n\n\
  无障碍方面也多少如此。这并非因为 HTML 最初真正是考虑到无障碍而构建的（并非如此），而是因为许多已开发的辅助技术必须应对不可访问的 Web 内容。在这些情况下，辅助技术必须从标记中获取尽可能多的信息。一些\
  \ HTML 元素，如 `a`、`input`、`select`、`option` 等，提供了大量有用信息。多年来，屏幕阅读器已经形成了对这些元素常用方式及交互方式的理解。\n\
  \nHTML 2.0 引入了著名的 `alt` 属性。这是 Web 无障碍的第一丝曙光，但它并非仅为无障碍而添加。`alt` 属性旨在在原始内容无法渲染时进行渲染。此后，它被用作在图像无法被屏幕阅读器或盲文设备渲染时描述图像的简单方法。\n\
  \n然而，HTML 4.0 真正开始重视无障碍。除了要求所有 `img` 标签必须有 `alt` 属性外，它还允许在所有标签上使用 `title` 和 `lang`\
  \ 属性。此外，HTML 4.0 鼓励将表现样式与内容分离。这使得辅助技术更容易以用户可理解的形式渲染 Web。\n\n随着 HTML 中对这些的支持，W3C（万维网联盟）发布了\
  \ WCAG（Web 内容无障碍指南），这是一套 Web 开发人员应遵循的指南，以确保无障碍设计。这些指南的第二个版本于 2008 年发布，可在 `http://www.w3.org/WAI/intro/wcag.php`\
  \ 查看。\n\n所有这些并不意味着我们的应用程序可以完全免费地变得无障碍——远非如此，但这确实意味着如果某个 HTML 元素或属性满足我们的需求，我们应该使用它。反之，这意味着我们不应挪用\
  \ HTML 元素并以意想不到的方式使用它。\n\n让我们看几个简单的例子，通过简单地使用 HTML 元素和属性，我们可以几乎免费地获得无障碍性。考虑以下代码片段：\n\
  \n```html\n<img src=\"dog.jpg\" />\n```\n\n花点时间考虑一下，各种残疾用户在浏览器中渲染上述内容时可能会遇到什么困难。从源代码来看，这显然将是一张狗的图片。但您的用户无法立即访问源代码，且文件名不保证具有如此描述性。\n\
  \n我们可以通过以下方式立即提高此图像的可用性和无障碍性：\n\n```html\n<img src=\"dog.jpg\" alt=\"Image of my\
  \ dog, Shelley.\" />\n```\n\n我们立刻可以看到，辅助技术将能够向最终用户描述该图像。这对任何弱视或无视力用户都很重要。\n\n###\
  \ 注意\n\n`alt` 属性实际上并非无障碍功能，尽管我们可以像无障碍功能那样使用它。如果浏览器无法加载图像或无法渲染它（例如纯文本 Web 浏览器），`alt`\
  \ 属性的内容也会显示出来。\n\n`alt` 属性仅允许用于 `img` 和 `area` 元素。对于其他元素，应改用 `title` 属性。`title`\
  \ 属性通常在桌面端渲染为工具提示；但它们也会被屏幕阅读器朗读，通常在最初导航到该项目几秒钟后。例如：\n\n```html\n<button title=\"\
  Share this page with your friends\">Share</button>\n```\n\n\n\n\n某些辅助技术在用户导航到该元素时，最初会将其渲染为“共享，按钮”。如果读者再等待几秒钟，`title`\
  \ 属性通常也会被渲染出来。其他技术可能会同时渲染两者。无论哪种方式，拥有 `title` 属性肯定能为您的用户提供额外且有用的上下文。\n\n大多数辅助技术会从您的应用对\
  \ HTML 元素的使用中推断出大量信息。在前面的示例中，使用 `button` 标签提供了额外信息，可用于向用户提供额外信息。当然，我们本可以使用 `div`\
  \ 标签。如果样式得当，这在视觉上也能正常工作。但 `div` 无法向辅助技术提供任何额外信息，因此在存在替代方案时应避免使用。\n\n这意味着，每当有 HTML\
  \ 元素与我们应用的语义相匹配时，我们就应该使用它。例如，在有可点击元素的地方，我们应该使用 `button` 或 `<input type=\"button|submit|reset\"\
  \ />`，而不是 `div`。\n\n相反，使用语义与我们应用意图不符的 HTML 元素是非常不明智的。例如：\n\n```\n<h1 onclick=\"\
  doSomething();\">Add Item</h1>\n```\n\n虽然这个例子极其牵强，但它会让最终用户感到困惑，因为屏幕阅读器已经对 `h1` 是什么以及如何呈现它（顶级标题）有了相当清晰的概念。如果我们的应用决定它其实是一个按钮，屏幕阅读器将无法知晓这一点，从而误导用户。\n\
  \nHTML5 引入了许多具有新语义的新元素。我们可以用 `nav` 代替 `<div class=\"navigation\">`，用 `aside` 代替\
  \ `<div class=\"sidebar\">`。理解 HTML5 的辅助技术可以利用这些新元素为用户提供额外的上下文。\n\n即使 HTML 元素具有内置的无障碍功能，且存在一些无障碍特性（如\
  \ `alt` 和 `title`），显然 Web 应用仍需向辅助技术传达更多信息。混合应用经常会渲染没有 HTML 等价物的元素。此外，Web 应用的语义并不总是与网站现有的无障碍特性完美契合。此时，WAI-ARIA\
  \ 规范应运而生。\n\n### 注释\n\n**WAI-ARIA** 是 **Web Accessibility Initiative**（Web 无障碍倡议组织）在\
  \ W3C 发布的 **Accessible Rich Internet Applications**（无障碍富互联网应用）规范的简称。\n\n该规范允许您为\
  \ HTML 元素指定额外的语义，以便更清晰地指示元素的功能。语义主要分为两大类：\n\n*   **角色**：这表示元素在应用中执行的语义角色。例如，导航栏会被赋予\
  \ `role=\"navigation\"` HTML 属性。角色通常分为两类：`landmark`（地标）和 `widget`（部件）。地标角色标记页面的区域：横幅、组、内容、侧边栏等，而部件角色标记特定的用户界面控件。\n\
  \n*   **属性**：这些是元素上以 `aria-` 为前缀的属性，代表数据值或其他状态。WAI-ARIA 区分 `states`（状态）和 `properties`（属性）。状态通常更具动态性（即变化更频繁），但将这些统称为属性在实践中更为简单。\n\
  \n正如上一节末尾提到的，WAI-ARIA 与 HTML5 确实存在一些重叠。例如，`nav` 元素会自动获得 `role=\"navigation\"`。如果可能，您应该优先使用\
  \ HTML5 元素，这样就不必为 WAI-ARIA 角色和属性编写大量支持代码。如果您的目标浏览器*不*理解 HTML5，为了最大兼容性，您需要两者都包含（例如，`<nav\
  \ role=\"navigation\">`）。\n\n### 注释\n\nWAI-ARIA 角色和属性不会改变相关元素的功能，也不会改变其外观。它们仅作为辅助技术的提示使用。\n\
  \n所有现代移动浏览器（Blackberry 除外）都支持 WAI-ARIA。然而，某些平台的支持是近期才加入的。例如，Android 从 Android 4.4\
  \ 开始才支持 WAI-ARIA。此外，除 Mobile IE 外，支持 WAI-ARIA 的其余浏览器往往只提供部分支持。换句话说，如果您必须面向旧平台，不应仅依赖\
  \ WAI-ARIA 来创建无障碍应用——也就是说，除非没有其他方法实现您的需求，否则不要大量使用带有 `role` 和 `aria-` 属性的 `div` 元素。\n\
  \n网上有许多有用的文章讨论 WAI-ARIA。遗憾的是，完整涵盖这一主题超出了本章的范围。这不一定是个问题，因为在许多情况下，使用 HTML5 的新元素（如\
  \ `nav`）就能免费获得更好的无障碍体验。即便如此，为了未来着想，阅读了解 WAI-ARIA 也是明智之举。以下链接非常有用：\n\n*   [`developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA`](https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA)\n\
  *   [`caniuse.com/#feat=wai-aria`](http://caniuse.com/#feat=wai-aria)\n*   [`www.html5accessibility.com`](http://www.html5accessibility.com)\n\
  *   [`w3c.github.io/aria-in-html/`](http://w3c.github.io/aria-in-html/)\n*   [`oaa-accessibility.org/examples/`](http://oaa-accessibility.org/examples/)\n\
  *   [`www.marcozehe.de/2014/03/27/what-is-wai-aria-what-does-it-do-for-me-and-what-not/`](https://www.marcozehe.de/2014/03/27/what-is-wai-aria-what-does-it-do-for-me-and-what-not/)\n\
  *   [`www.w3.org/TR/wai-aria-practices/`](http://www.w3.org/TR/wai-aria-practices/)\n\
  \n## WAI-ARIA 角色\n\n虽然我们无法涵盖 WAI-ARIA 的所有内容，但可以快速浏览一下适合在混合应用中使用的地标角色和部件角色。还有更多可用的角色，但它们通常不是大多数应用所需的角色。\n\
  \n### 注释\n\n当 HTML5 元素具有相同语义时，我们在括号中列出了它们。除非您面向的设备对 HTML5 或 WAI-ARIA 支持不佳，否则您应该优先使用这些元素，而不是\
  \ WAI-ARIA 角色。\n\n一个有用的参考资料位于 [`www.karlgroves-sandbox.com/CheatSheets/ ARIA-Cheatsheet.html`](http://www.karlgroves-sandbox.com/CheatSheets/%20ARIA-Cheatsheet.html)，以下参考也以此为基础。\n\
  \n*   `article` (`<article>`)：内容（如博客文章等）。\n*   `banner` (`<header>`)：通常用于标记网站的标题。\n\
  *   `complementary` (`<aside>`)：用于标记可与主要内容分离的相关内容。例如，*另请参阅* 或 *更多关于……* 部分。\n*  \
  \ `contentinfo` (`<footer>`)：包含文档信息的容器；通常是页脚。\n*   `form` (`<form>`)：表示一组标签及其对应的输入元素。\n\
  *   `main` (`<main>`)：文档的主要内容。\n*   `navigation` (`<nav>`)：包含指向其他文档链接的导航元素。\n* \
  \  `search`：允许用户执行搜索操作的一组元素。\n\n有大量的部件角色，几乎涵盖您所需的任何用户界面元素。我们不会列出所有可用的部件角色；只会按类别列出您更可能用到的那些。请注意那些有\
  \ HTML5 等价物的角色。如果可以，您应该优先使用这些 HTML5 元素，而不是 WAI-ARIA 角色：\n\n*   内容相关：文本、图像等\n   \
  \ *   `heading` (`<h#>`)：文本标题\n    *   `img` (`<img>`)：图像\n    *   `link` (`<a href=\"\
  …\">`)：指向其他资源的链接\n    *   `separator` (`<hr>`)：分隔项目组\n*   通用\n    *   `group` (`<div>`,\
  \ `<optgroup>`, `<fieldset>`)：用于对部件进行分组\n\n\n\n\n\n## WAI-ARIA 角色\n\n### Presentation（呈现）\n\
  \n- `presentation`：辅助技术不会尝试与该元素进行交互\n\n### Messages（消息）\n\n- `alert` (`alert()`)：一条通常有时效性的重要消息\n\
  - `log`：一个接收信息更新的元素，可能会移除旧的更新\n- `marquee`：一个信息频繁更新的区域，但该信息并非关键\n- `status` (`<output>`)：一条包含提示信息的消息（但可能不代表严重错误）\n\
  \n### Dialogs and Alerts（对话框和警告）\n\n- `alertdialog`：一个包含 `alert` 消息的对话框\n- `dialog`：这表示应用程序为接收用户的额外输入而显示的一个对话框\n\
  - `toolbar`：一个动作的精简列表，通常是水平的\n\n### Form Elements（表单元素）\n\n- `button` (`<button>`,\
  \ `<input type=\"button|submit|reset\">`)：一个可点击的按钮\n- `checkbox` (`<input type=\"\
  checkbox\">`)：一个复选框\n- `radio` (`<input type=\"radio\"`)：一个单独的单选项；属于一组，一次只能选中一个\n\
  - `radiogroup`：一组 `radio` 元素\n- `slider` (`<input type=\"range\"`)：一个允许用户通过滑块从一系列值中选择的控件\n\
  - `textbox` (`<input type=\"text|…`\", `<textarea>`)：这描述了一个文本输入元素\n\n### Select\
  \ Lists（选择列表）\n\n- `combobox` (`<select>`)：这通常用于表示一个用户可通过输入来选择信息的控件\n- `listbox`\
  \ (`<select>`, `<datalist>`)：一个允许用户从列表中选择项目的控件\n- `option` (`<option>`)：选择列表或数据列表中的一个项目\n\
  \n### Grids and Tables（网格和表格）\n\n- `columnheader` (`<th scope=\"col\">`)：表格或网格中的列标题\n\
  - `grid` (`<table>`)：一个表格或网格\n- `gridcell` (`<td>`)：表格或网格中的一个单元格\n- `row` (`<tr>`)：网格或表格中的一行单元格\n\
  - `rowgroup` (`<thead>`, `<tfoot>`, `<tbody>`)：网格或表格中的一组行\n\n### Lists（列表）\n\n-\
  \ `list` (`<ul>`, `<ol>`)：一个静态列表\n- `listitem` (`<li>`)：列表或目录中的一个项目\n\n### Menus（菜单）\n\
  \n- `menu` (`<menu>`)：一个用户可从中选择的项目列表\n- `menubar`：这通常代表一个水平的、持久的菜单，包含下拉菜单\n- `menuitem`：菜单或菜单栏中的一个项目\n\
  - `menuitemcheckbox`：一个作为复选框的菜单项\n- `menuitemradio`：一个作为一组项目中一项的菜单项，该组中只能选择一项\n\n\
  ### Trees（树）\n\n- `tree`：一个允许折叠或展开子树的分层列表\n- `treegrid`：一个允许折叠和展开其行的网格（类似树）\n- `treeitem`：树中的一个项目\n\
  \n关于使用 WAI-ARIA 和 HTML 无障碍特性的例子有很多，但专门针对移动端混合应用的却不多。在本节中，我们将介绍几个例子，应该能让你很好地了解如何在你的应用中创建无障碍控件。\n\
  \n## Separation of presentation and content（表现与内容的分离）\n\n如果你对这个概念还不熟悉，现在是时候非常熟悉地掌握分离应用的表现与内容了。这将使辅助技术更容易正确地向最终用户呈现你的应用。当然，凭借我们拥有的\
  \ Web 技术，这实际上非常容易实现；*视觉* 表现应位于你的 CSS（或 Sass）中，而内容应位于你的 HTML 中。如果你现在正说“嗯，当然！”，你可能会想知道我为什么还要提这事——这看起来显而易见。但有时，什么构成*内容*，什么构成*表现*，并不总是立刻显而易见的。\n\
  \n### Note（注意）\n\n对于动态生成的内容，同样适用：你的代码应为*内容*生成 HTML 元素，并为*表现*使用现有的 CSS 类。\n\n例如，我们可以制定一个非常简单（但错误）的规则：所有图片都应包含在\
  \ HTML 中，因为图片是内容。然而，如果你思考几秒钟，就会迅速意识到这并不正确：按钮上的图标是图片，但它们不是内容，特别是对于看不见它们的用户。相反，他们更关心按钮应该做什么；他们不太可能关心你为视力正常者使用了什么图标。\n\
  \n什么是内容、什么是表现，很大程度上取决于你的应用，所以我们没有一条铁律来判断哪是哪。一般来说，分界线在于构成应用*外壳*的元素（导航栏、工具栏等）与应用显示或操作的数据之间。前者通常是表现，后者是内容。\n\
  \n## Accessible icon buttons（无障碍图标按钮）\n\n既然我们在上一节提到了图标按钮，让我们来看看如何创建一个无障碍的图标按钮。因为我们需要将表现与内容分离，所以需要使用\
  \ CSS 和 HTML 来实现：\n\n```\n<button class=\"icon-bookmark\" \ntitle=\"Bookmark this\
  \ word\">Bookmark</button>\n```\n\n到目前为止，这还不算太令人兴奋。但它已经非常无障碍了；屏幕阅读器可能会将这个 `Bookmark`\
  \ 按钮读作“Bookmark this word”。对于视力良好的用户，让我们为它添加适当的样式：\n\n```\n.icon-bookmark {\n  -webkit-appearance:\
  \ none;\n  -moz-appearance: none;\n  border: 0;\n  margin: 0; padding: 0;\n  background:\
  \ transparent url('bookmark.png') no-repeat \n              center center / 32px\
  \ 32px;\n  width: 32px; height: 32px;\n  color: currentColor;\n}\n/* 别忘了使用媒体查询来处理\
  \ \n高分辨率显示器！ */\n```\n\n在大多数应用中，你可能想为此图标添加更多样式，但前面提到的样式足以说明问题。图标的视觉外观不是内容，而是表现，所以它属于我们的\
  \ CSS。对于不关心表现的用户，他们无需担心样式。通过将图标图片分离到 CSS 中，辅助技术不会错误地向最终用户指示存在一张图片。\n\n另请注意，我们在前面的\
  \ HTML 代码中不需要使用任何 WAI-ARIA 属性。这是因为理解 HTML5 和 WAI-ARIA 的辅助技术会自动为该元素分配 `button` 角色。然而，如果你的目标平台是较旧的、可能不会自动执行此操作的平台，你可以改用以下代码：\n\
  \n```\n<button role=\"button\" class=\"icon-bookmark\" \ntitle=\"Bookmark this word\"\
  >Bookmark</button>\n```\n\n如果你想渲染一个无文本的图标但仍保持无障碍，应用 `font-size: 0` 样式是最简单的方法。这可以防止文本在屏幕上渲染，但辅助技术仍可将按钮的文本呈现给最终用户。\n\
  \n## Accessible navigation（无障碍导航）\n\n移动应用中的大多数视图都有顶部导航栏的概念。这些栏可以从仅包含视图标题的简单栏，到包含按钮和输入元素的复杂栏。\n\
  \n一般来说，这些并不难实现无障碍。请看下面的例子：\n\n```\n<nav class=\"y-nav\" >\n  <div class=\"y-widget-group\"\
  >\n    <button class=\"y-menu-glyph\" \n            title=\"Tap to open sidebar\"\
  >Menu</button>\n  </div>\n  <div class=\"y-widget-group y-flex\">\n    <h1 class=\"\
  y-title\">Logology</h1>\n  </div>\n  <div class=\"y-widget-group y-group-align-right\"\
  >\n    <form method=\"POST\">\n      <label role=\"search\">\n        <div role=\"\
  presentation\" \n             class=\"y-search-glyph\">Search</div>\n        <input\
  \ type=\"text\" />\n      </label>\n    </form>\n  </div>\n</nav>\n```\n\n### Note（注意）\n\
  \n\n\n\n# 无障碍示例\n\n## 导航和屏幕阅读器\n\n我们不必担心在这些（或大多数）示例中的表现，因为从任何辅助技术的角度来看，这其实并不重要。这并不是说辅助技术完全忽略\
  \ CSS；它们通常会检测 `display:none` 并忽略那些元素，但会忽略大多数其他样式。\n\n请注意，我们在这个示例中并没有摆脱 `div` 元素。但在语义上，它们是最贴切的匹配（尽管你也可以为\
  \ `span` 找到充分的理由）。即使没有类名，我们也能大致了解 `div` 元素主要是为了将导航栏中的相关项目分组。\n\n那么，屏幕阅读器将如何渲染呢？`nav`\
  \ 元素会自动获得 `navigation` 角色，因此用户会知道他们正处于导航栏中。如果用户使用辅助技术选择 `Menu` 按钮，他们将听到“Menu，button（较长停顿）Tap\
  \ to open sidebar”。如果他们浏览导航栏，他们将听到应用程序的名称（`Logology`），然后听到他们聚焦在一个输入元素上（“Search，text\
  \ field… double tap to edit\"）。\n\n此例还说明了代码顺序如何影响结果的重要性。如果我们将标题置于 `Menu` 按钮之前，用户将按该顺序听取信息。在这个例子中，这不是什么大问题；上下文很容易推断。但对于其他元素，确保顺序正确至关重要。请记住，您的用户可能无法看到您应用程序的视觉层级，从而无法推断上下文。\n\
  \n此外，请注意，这里只出现了两个 WAI-ARIA 角色实例，而且只是为了正确处理搜索控件。首先，包裹图标和相关输入元素的 `label` 元素获得 `search`\
  \ 角色；图标本身也被标记为 `presentation` 角色。这种角色告诉屏幕阅读器为了无障碀目的完全忽略该元素，这完全没问题；图标实际上没有除视觉提示之外的任何真实用途。一般来说，如果我们不提供这个第二个角色，也不会发生什么坏事：`div`\
  \ 元素通常会被辅助技术忽略，除非指定了角色。\n\n如果您担心兼容性，以下版本将详细列出 WA-ARIA 角色：\n\n```html\n<nav role=\"\
  navigation\" class=\"y-nav\" >\n  <div role=\"group\" class=\"y-widget-group\">\n\
  \    <button role=\"button\" class=\"y-menu-glyph\" \n            title=\"Tap to\
  \ open sidebar\">Menu</button>\n  </div>\n  <div role=\"group\" class=\"y-widget-group\
  \ y-flex\">\n    <h1 role=\"heading\" aria-level=\"1\" \n        class=\"y-title\"\
  >Logology</h1>\n  </div>\n  <div role=\"group\" class=\"y-widget-group y-group-align-right\"\
  >\n    <form method=\"POST\" role=\"form\">\n      <label role=\"search\">\n   \
  \     <div role=\"presentation\" \n             class=\"y-search-glyph\">Search</div>\n\
  \        <input role=\"textbox\" type=\"text\" />\n      </label>\n    </form>\n\
  \  </div>\n</nav>\n```\n\n## 无障碀列表\n\n移动应用程序中常见的设计模式是列表视图。每个列表项均可选择以深入查看并获取更多信息。这通常用视觉上的箭头或其他图标标记。通常，这些都能很好地映射到现有的\
  \ HTML 标签，如 `ul` 和 `li`。让我们看一个示例：\n\n```html\n<ul class=\"y-list\" >\n  <li class=\"\
  y-list-item\">\n    <button class=\"y-list-contents\">\n      <div>1.</div>\n  \
  \    <div class=\"y-flex\">A list item.</div>\n      <div class=\"y-indicator\"\
  ></div>\n    </button>\n    <div class=\"y-list-actions\" >\n      <button class=\"\
  y-fav-glyph\" \n              title=\"Save this item as a favorite.\">\n       \
  \       Favorite</button>\n      <button class=\"y-share-glyph\" \n            \
  \  title=\"Share this item with a friend.\">\n              Share</button>\n   \
  \ </div>\n  </li>\n    ...\n</ul>\n```\n\n同样，这里的样式其实并不重要，除了一个重要细节：在前面的示例中，我们还包含了列表操作。在某些平台上，这些操作可能通过在列表项上滑动来触发；在其他平台上，它们可能显示在列表项旁边。滑动是一个潜在的问题手势，因此您应确保有其他方式访问这些功能，前提是这些项目并非始终可见。此外，如果它们不在屏幕上可见，则应标记\
  \ `aria-hidden=\"true\"` HTML 属性，否则它们仍可能被辅助技术选中。\n\n### 注意\n\n如果您尝试使用 `VoiceOver`\
  \ 或类似技术，您可能会发现这并不像原生那样反应。在 `iOS` 上，具有附加操作的列表项会收到类似“swipe up or down to select a\
  \ custom action, then double tap to activate（向上或向下滑动以选择自定义操作，然后双击激活）\"的额外提示。不幸的是，无法使用\
  \ `WAI-ARIA` 精确模拟这一点。\n\n请注意，我们用 `button` 包裹了列表内容。这是因为整个列表项是可选的（不仅仅是列表项内部的元素），我们需要向最终用户传达这一点。\n\
  \n## 无障碀警报和对话框\n\n大多数应用程序在运行过程中都需要向用户显示警报或对话框。虽然您可以通过适当修改 `DOM` 和样式来实现，但这不会通知任何辅助技术有什么重要事情发生。一个简单的警报结构可能如下：\n\
  \n```html\n<div class=\"y-alert-container\">\n <div class=\"y-alert-dialog\">\n\
  \  <h1>Important!</h1>\n  <p>An important message!</p>\n  <button>OK</button>\n\
  \ </div>\n</div>\n```\n\n### 注意\n\n此结构仅具代表性；通常，当需要显示警报对话框时，这将以编程方式添加。\n\n为了提醒用户有新的警报对话框，我们需要添加一些属性：\n\
  \n```html\n<div class=\"y-alert-container\">\n <div class=\"y-alert-dialog\" role=\"\
  alertdialog\">\n  <h1>Important!</h1>\n  <p role=\"alert\">An important message!</p>\n\
  \  <button>OK</button>\n </div>\n</div>\n```\n\n请注意这两个新的 `role` 属性。`alertdialog`\
  \ 角色标记包含消息的容器，而 `alert` 角色指示包含消息本身的元素。\n\n这将生效，除了底层内容仍然对辅助技术可见。大多数警报对话框不会填满整个屏幕，但*是*模态的。所以，我们不希望用户对哪些控件可用、哪些不可用感到困惑。要修复此问题，我们可以向需要向辅助技术隐藏的内容添加\
  \ `aria-hidden=\"true\"`，然后在对话框关闭时移除该属性。\n\n还有一点：对话框显示后，需要以编程方式将焦点设置在第一个按钮上。如果我们不将焦点放在警报内的元素上，辅助技术仍会认为用户停留在先前选定的项目上。\n\
  \n通常，所有这些都是通过 `JavaScript` 实现的。这是一个示例：请注意，我们假设应用程序的主内容包含在一个具有 `mainWindow` 作为 `id`\
  \ 属性的元素中：\n\n\n\n# 混合应用无障碍访问\n\n## 示例：简单警报对话框\n\n```javascript\nfunction simpleAlert()\
  \ {\n    let outerDiv = document.createElement(\"div\"),\n        innerDiv = document.createElement(\"\
  div\"),\n        titleEl  = document.createElement(\"h1\"),\n        messageEl =\
  \  document.createElement(\"p\"),\n        buttonEl = document.createElement(\"\
  button\"),\n        mainWindow = document.getElementById(\"mainWindow\");\n\n  \
  \  outerDiv.className = \"y-alert-container\";\n    innerDiv.className = \"y-alert-dialog\"\
  ;\n\n    //content\n    titleEl.textContent = \"Important!\";\n    messageEl.textContent\
  \ = \"This is an important message.\";\n    buttonEl.textContent = \"OK\";\n\n \
  \   // accessibility\n    innerDiv.setAttribute(\"role\", \"alertdialog\");\n  \
  \  messageEl.setAttribute(\"role\", \"alert\");\n\n    // create the dom structure\n\
  \    outerDiv.appendChild(innerDiv);\n    innerDiv.appendChild(titleEl);\n    innerDiv.appendChild(messageEl);\n\
  \    innerDiv.appendChild(buttonEl);\n\n    document.body.appendChild(outerDiv);\n\
  \    setTimeout(function () {\n      // show the dialog visually; \n      // inside\
  \ a setTimeout for animations\n      outerDiv.classList.add(\"visible\");\n    \
  \  // hide the underlying content from the Accessibility API\n      mainWindow.setAttribute(\"\
  aria-hidden\", true);\n      // focus the button\n      buttonEl.focus();\n    },\
  \ 0);\n\n    buttonEl.addEventListener(\"click\", function() {\n        // hide\
  \ the dialog visually\n        outerDiv.classList.remove(\"visible\");\n       \
  \ // wait for animations to finish before removing it form \n        // the DOM\n\
  \        setTimeout(function() {\n          // let the underlying content become\
  \ visible to \n          // assistive technologies\n          mainWindow.removeAttribute(\"\
  aria-hidden\");\n          document.body.removeChild(outerDiv);\n        }, 400);\n\
  \    }, false);\n}\n```\n\n## 概述\n\n混合应用的一个问题在于难以适配用户的无障碍设置。iOS 和 Android 都提供了大量提供无障碍辅助的设置。原生\
  \ SDK 通常几乎默认就会响应这些设置——也就是说，原生应用几乎无需额外成本即可响应用户的设置。即使原生应用需要做一些工作，通常也只需读取一个偏好设置并做出相应响应（例如，增大字体大小）。\n\
  \n混合应用不会自动获得这些优势，这意味着它们往往在真空环境中运行，无法响应用户的无障碍设置。当用户的大多数原生应用都能响应文本大小、字幕等设置的更改，而你的混合应用却不能时，这显然标志着该应用*表现不佳*。\n\
  \n从技术上讲，得益于 Cordova 使用插件的能力，所有这些设置都可以呈现给我们的混合应用。有一个插件能实现其中的大部分功能，尽管它并不暴露*所有*可能的设置。然而，对于大多数应用而言，该插件暴露的设置已足以满足大部分需求。\n\
  \n该插件（称为移动无障碍插件）可在 [`github.com/phonegap/phonegap-mobile-accessibility`](https://github.com/phonegap/phonegap-mobile-accessibility)\
  \ 获取，并拥有完善的文档。它暴露了某些无障碍功能是启用还是禁用，同时也暴露了用户的首选文本大小。此插件使我们的应用能立即适应用户的偏好，而不显得格格不入。\n\
  \n## 安装移动无障碍插件\n\n如果你使用 Cordova CLI，安装插件非常简单：\n\n```bash\ncordova plugin add https://github.com/phonegap/phonegap-mobile-accessibility\n\
  ```\n\n如果你使用 Gulp 工作流，添加插件也非常容易，但需要将插件添加到我们的 `package.json` 文件中。找到 `cordova.plugins`\
  \ 数组并将仓库地址添加进去，如下所示：\n\n```json\n{\n  \"cordova\": {\n    \"...\": \"\",\n    \"\
  plugins\": [\n      \"...\",\n      \"https://github.com/phonegap/phonegap-mobile-accessibility\"\
  \n    ]\n  },...\n}\n```\n\n添加完成后，可以通过执行以下命令重新初始化构建产物：\n\n```bash\n$ gulp init\n\
  $ gulp copy\n```\n\n## 检测用户首选文本大小\n\niOS 和 Android 都允许用户覆盖正文中使用的默认文本大小，改为更舒适的大小。我们可以接入此设置并相应地缩放用户界面。\n\
  \n安装插件后，实现这一点非常简单。在接收到 `deviceready` 事件后，我们可以执行以下代码：\n\n```javascript\nMobileAccessibility.usePreferredTextZoom(true);\n\
  ```\n\n这将导致插件确定用户的首选字体大小，并相应地调整文本大小（但不调整图片或图标）。这过程非常快；虽然如果你的布局复杂，可能会在极短时间内被注意到。如果这造成干扰，你可能希望在浏览器完成内容调整前，短暂地保持应用的启动画面可见。\n\
  \n从技术上讲，你不必每次都调用此方法；该设置实际上存储在 `localStorage` 中，应用将继续调整应用的文本大小。这使得该方法在设置视图中很有用，你可能希望允许用户切换应用是否遵循系统的字体大小设置。\n\
  \n如果传入 `false`，插件将不再管理字体缩放。\n\n### 注意\n\n在 iOS 上，有一种替代方案可以在不使用此插件的情况下管理字体大小。你可以在\
  \ [`mir.aculo.us/2013/09/16/how-to-create-a-web-app-that-looks-like-a-ios7-native-app-part-1/`](http://mir.aculo.us/2013/09/16/how-to-create-a-web-app-that-looks-like-a-ios7-native-app-part-1/)\
  \ 了解更多，但请注意这不具备跨平台兼容性。\n\n## 检测屏幕阅读器\n\n理想情况下，我们的应用不应关心屏幕阅读器是否处于激活状态。但有时了解这一点很有用，因为应用可能希望改变处理手势的方式或渲染视图的方式。要检测屏幕阅读器是否处于激活状态，可以执行以下操作：\n\
  \n```javascript\nMobileAccessibility.isScreenReaderRunning(isActive => console.log(`Screen\
  \ reader is active? ${isActive ? \"yes\": \"no\"}.`));\n```\n\n如果你的应用确实关心屏幕阅读器是否激活，那么你很可能也希望在状态改变时收到通知。为此，我们需要监听一个特殊事件，每当屏幕阅读器开启或关闭时就会触发该事件：\n\
  \n```javascript\nfunction screenReaderHandler(features) {\n  if (features !== undefined\
  \ &&\n      features.isScreenReaderRunning !== undefined) {\n    if (features.isScreenReaderRunning)\
  \ {\n      // screen reader is running, act accordingly\n    } else {\n      //\
  \ screen reader isn't running, act accordingly\n    }\n  }\n}\nwindow.addEventListener(\n\
  \  MobileAccessibilityNotifications.SCREEN_READER_STATUS_CHANGED,\n  screenReaderHandler,\n\
  \  false\n);\n```\n\n这两种方法都是通用的：在 iOS 上，它们将检查 VoiceOver 是否激活；在 Android 上，它们将检查 TalkBack\
  \ 是否启用。也有专门检查这些特定功能的方法。如果你想这样做，请查阅插件文档。\n\n## 朗读自定义文本\n\n有时，以编程方式向用户朗读文本会很方便。此插件提供了两个方法，专门用于通过屏幕阅读器控制语音输出。\n\
  \n要朗读自定义文本，可以执行以下操作：\n\n```javascript\nMobileAccessibility.speak(\"Word added to\
  \ your favorites.\");\n```\n\n如果需要停止朗读，可以执行以下操作：\n\n```javascript\nMobileAccessibility.stop();\n\
  ```\n\n## 无障碍测试工具\n\n有许多不同的工具可用于帮助检查应用的无障碍性。有些可以在浏览器中运行，而其他的则需要在模拟器或真机上使用：\n\n-\
  \ Accessibility Inspector（无障碍检查器），可在 OS X 和 iOS 上使用\n- VoiceOver，可在 OS X 和 iOS 上使用\n\
  - TalkBack，可在 Android 上使用\n\n\n\n\n# 测试与 UI 自动化\n\n## 无障碍测试工具\n\n*   Chrome 无障碍开发者工具，网址：<https://chrome.google.com/webstore/detail/accessibility-developer-t/fpkknkljclfencbdbgkenhalefipecmb>\n\
  *   Safari/WebKit 中的无障碍面板（右键点击 `An Element`，然后选择 `Inspect Element`。它将在侧边栏显示节点详情。然后，你需要展开\
  \ `Accessibility` 面板）\n\n### 提示\n\n虽然前面提到的工具对测试应用的无障碍性非常有用，但你的用户将是关于应用可用性信息的**最佳来源**。始终与用户一起测试你的应用，以了解无障碍功能在真实场景中的表现。\n\
  \n本章我们涵盖了相当多的内容。如果你真的想好地服务于无障碍用户，你会想要阅读本章链接的所有内容。如果这看起来**令人生畏**，那是因为它确实如此。这不是你能在几个小时内就掌握的东西。你需要与用户一起测试应用，看看它在真实环境中如何被使用，然后据此进行迭代。\n\
  \n在下一章中，我们将介绍可用于测试应用功能的方法，既包括代码视角，也包括用户界面自动化视角。\n\n## 测试的重要性\n\n确保应用按预期运行绝对**至关重要**。当应用很小时，很容易将测试作为**事后考虑**。毕竟，这是一个小应用，手动测试起来相当容易，对吧？不幸的是，即使是面向多个设备的小应用，测试起来也极其复杂，仅仅因为你无法获得所有可用于测试的设备。此外，在每个平台上每次更改后手动测试应用**极其枯燥**；这样做你会犯**错误**。幸运的是，有更好的方法。\n\
  \n测试常被作为**事后考虑**，这很遗憾，因为它是开发过程中**重要**的组成部分。不幸的是，当你刚开始学习一门语言时，很容易**忽视**它，因为通常假设你处理的是小型、易于验证的代码片段，而不是大型的数万行代码库。一个简单的二十行程序可以轻松证明是正确的，为什么还要写测试，对吧？然而，500\
  \ 行的程序就没那么容易测试了。5,000 行的程序更糟，而 100,000 行的程序如果没有大量的**协助**或**自动化**则根本不可能测试。\n\n自动化测试**显著地**简化了我们的测试流程。我们不必运行大量手动测试，而是可以告诉自动化工具如何为我们运行测试，以及如果一切正常测试应产生什么结果。然后自动化工具可以为许多不同的平台执行我们所有定义的测试，并且比我们自己执行测试快得多，这意味着它更有可能在每次代码更改后执行。这让我们相当有信心我们的应用按设计工作——前提是我们为自动化工具提供了足够的测试用例。如果不向工具提供足够的测试用例，自动化工具就无法捕捉所有问题。当然，你仍然需要让真实用户测试你的应用；你不太可能想到每一种可能的场景。一旦测试人员发现潜在问题，你可以编写一个测试，确保它在未来持续被检查。\n\
  \n## 本章内容\n\n本章将涵盖以下内容：\n\n*   断言简介\n*   使用 `Chai` 编写测试\n*   使用 `Mocha` 运行测试套件\n\
  *   编写 UI 自动化测试\n*   使用 `Appium` 和 `Mocha` 运行 UI 自动化测试\n*   将测试与 `Gulp` 集成\n\n本章中的一些代码片段可通过随本书代码包附带的交互式代码片段演练场使用。启动演练场的说明在代码包中的\
  \ `README.md` 文件中。启动后，选择 `6: Testing and UI Automation`，然后浏览并尝试示例。在适用的情况下，每个章节和片段都会指示你应选择哪个章节和示例。\n\
  \n## 自动化测试与断言\n\n自动化测试依赖于断言的概念。断言本身非常简单：它们只是一个事实陈述。如果陈述在事实上为真，测试将通过（或继续下一步）；但如果陈述为假，测试将失败并报告错误。\n\
  \n### 注意\n\n本节的代码片段位于本书代码包中的 `snippets/06/ex1-basic-assertions/a`。使用交互式代码片段演练场时，选择\
  \ `6: Testing and UI Automation` 和示例 `1a`。\n\n考虑以下简短片段：\n\n```\nlet x = 5;\nlet\
  \ y = x * 2;\n```\n\n代码执行后，我们可以对其做出几个断言：\n\n*   `x` 将包含值 `5`\n*   `y` 将包含值 `10`\n\
  \n手动测试这一点并不太难。我们可以打开 JavaScript REPL 或浏览器的调试控制台，很容易判断这些断言的真假。然而，持续这样做很繁琐。我们可以做得更好。让我们在片段中添加一些代码：\n\
  \n```\nif (x !== 5) {\n    throw new Error(\"x is not 5!\");\n}\nif (y !== 10) {\n\
  \    throw new Error(\"y is not 10!\");\n}\n```\n\n然而，显然这段代码有一些样板代码。此外，最好将断言写为正面陈述，而不是负面陈述。让我们写一个简单的方法来帮助我们：\n\
  \n```\n/**\n* Throws an error with `msg` if `expr` is false.\n*/\nfunction assert(expr,\
  \ msg) {\n  if (!expr) {\n    throw new Error (msg);\n  }\n}\n```\n\n现在，让我们考虑以下示例：\n\
  \n```\nlet x = 5;\nassert (x === 5);                  // [1]\nx = 4;\nassert (x\
  \ === 5);                  // [2]\nassert (x === 5, \"X isn't 5\")      // [3]\n\
  ```\n\n第一个断言 `[1]` 什么也不做；断言实际上是真的。然而，如果我们重新定义 `x` 的值并再次尝试，将在断言 `[2]` 处抛出错误。这个错误不会太有用；它将是一个通用错误，所以明智的做法是改用\
  \ `[3]` 的形式。这将抛出一个带有消息 `X isn't 5` 的错误。\n\n实际的断言库通常提供更多功能，例如测试特定值（而非简单的真假检查）、属性检查、代码块是否抛出错误等。然而，它们都建立在一个非常简单的概念之上：如果事实不为真，则抛出错误。\n\
  \n### Chai 断言库\n\n`Chai` 是一个断言库。我们不需要编写多个 `assert` 变体，`Chai` 提供了多种不同的方法供我们创建易于阅读的测试。`Chai`\
  \ 还使用方法链来创建更接近英语的测试版本，使它们既易读又易写。\n\n### 注意\n\n关于 `Chai` 的更多信息，请访问 <http://www.chaijs.com>。\n\
  \n`Chai` 很有用，因为它允许我们在不费太大力气的情况下编写表达性强的测试。它还通过让你选择几种提供的接口之一来满足你这位开发者的需求。共有三种：\n\n\
  *   `assert`：测试使用 assert 风格的接口，类似于我们在上一节中使用的。有许多实用方法可供使用，例如 `assert.typeOf()`、`assert.equal()`\
  \ 等。也可以像上一节那样直接使用 `assert(expression, message)`。\n*   `expect`：测试使用 `expect()` 和方法链来形成类英语语句。例如，`expect(x).to.equal(5)`\
  \ 或 `expect(a).to.have.property('b')`。\n*   `should`：测试使用对象上的 `should` 属性和方法链来形成类英语语句。例如，`x.should.equal(5)`\
  \ 或 `a.should.have.property('b')`。如果被测表达式有可能评估为 `null` 或 `undefined`，请改用 `expect`\
  \ 接口。\n\n\n\n# Chai 断言库\n\n这完全取决于你偏好哪种接口；这里没有对错之分。就我个人而言，我偏好 `should`，但你可以使用其中任何一种，并创建完美的测试套件。\n\
  \n### 提示\n\n关于各种接口之间差异的更多信息，请参阅 [`chaijs.com/guide/styles/`](http://chaijs.com/guide/styles/)。\n\
  \n## 安装 Chai\n\n为了使用 Chai，你需要将其作为开发依赖安装在你的项目中：\n\n```\nnpm install --save-dev chai@3.2.0\n\
  ```\n\n## 设置 Chai 接口\n\n在使用 Chai 方法之前，我们的测试需要引入该模块并请求所需的接口，如下所示：\n\n```\nlet assert\
  \ = require(\"chai\").assert;    // assert 接口，或\nlet expect = require(\"chai\").expect;\
  \    // expect 接口，或\nlet should = require(\"chai\").should();  // should 接口\n```\n\
  \n## 使用插件\n\nChai 还具有使用插件的能力，这可以扩展 Chai 本身的功能。大量 Cordova 代码是异步的，通常我们会使用 Promise\
  \ 来抽象它。要在 Chai 中使用 Promise，我们需要添加一个名为 `chai-as-promised` 的插件（可在 [`chaijs.com/plugins/chai-as-promised`](http://chaijs.com/plugins/chai-as-promised)\
  \ 获取）：\n\n```\nnpm install --save-dev chai-as-promised@5.1.0\n```\n\n使用该插件需要略微不同的样板代码。因此，代码看起来不再是使用\
  \ `require`，而更像下面这样：\n\n```\nlet chai = require(\"chai\");\nchai.use(require(\"\
  chai-as-promised\"));\nlet should = chai.should();              // 或 .expect 或 .assert\n\
  ```\n\n现在，在使用 Promise 时，我们可以编写像 `promise.should.eventually.equal(5)` 这样的测试。`Chai-as-promised`\
  \ 会自行处理 Promise 的异步特性。\n\n## 组织测试文件\n\n在使用任何断言库编写测试时，还有一个细节。没人希望测试代码和应用代码在同一个文件中。如果我们的测试代码与应用代码内联在一起，最终会在生产应用中生成测试代码，这会拖慢速度。这也会使测试不同场景变得困难。相反，测试总是写在独立于被测试代码的文件中。\n\
  \n就简单的代码测试而言，它们通常放在 `test` 子目录中。这就是你在本书的代码包中找到代码测试的地方。如果你是手动构建的项目目录，现在应该添加这个文件夹：\n\
  \n```\ncd /your/project/directory/root\nmkdir test\ncd test\n```\n\n通常，你会在这个目录下有许多文件，每个文件测试特定的功能。因此，我们不想编写大量样板代码。相反，最好创建一些辅助工具，这样我们就不需要编写大量样板代码了。让我们在\
  \ `test` 目录下创建一个 `helper` 目录，我们将用它来构建辅助工具：\n\n```\nmkdir helper\ncd helper\n```\n\
  \n## 创建辅助工具\n\n现在，我们将创建一个名为 `setup.js` 的文件。它应该如下所示：\n\n```\n\"use strict\";\n\n\
  var chai = require(\"chai\");\nvar chaiAsPromised = require(\"chai-as-promised\"\
  );\nchai.use(chaiAsPromised);\n\nvar should = chai.should();\nexports.should = should;\
  \    // 或 assert 或 expect\n```\n\n## 编写测试代码\n\n有了样板代码，我们如何将代码与测试分离呢？让我们从编写一些对对象进行操作的代码开始。我们将其命名为\
  \ `code.js`（务必将其放在 `test` 目录中），内容如下：\n\n```\n\"use strict\";\n\nexports.doSomething\
  \ = function (obj) {\n    obj.x = 5;\n}\n\nexports.doSomethingElse = function (obj)\
  \ {\n    obj.x = 4;\n}\n```\n\n注意这并没有做任何有用的事情；但请记住，这可能是我们项目中执行某些功能的任何文件。你通常需要返回一个对象或函数，以便测试代码可以驱动它。但你的应用通常有相同的要求，所以这并不难。\n\
  \n现在，让我们编写一个名为 `test.js` 的测试文件：\n\n```\n\"use strict\";\n\nlet should = require(\"\
  ./helpers/setup\").should;\nlet code = require(\"./code.js\");\n\nlet anObject =\
  \ {\n    x:0\n}\n\ncode.doSomething(anObject);\nanObject.x.should.be.equal(5); \
  \             // [1]\n\ncode.doSomethingElse(anObject);\nanObject.x.should.be.equal(5);\
  \              // [2]\n```\n\n注意我们是如何通过 `setup.js` 文件引入 `should` 的。因为我们这样使用 `setup.js`\
  \ 文件，所以我们也可以编写基于 Promise 的测试（尽管这个例子不需要 Promise）。简而言之，任何你为设置断言库而重复的样板代码都可以放入 `setup.js`，因为它将应用于所有测试。\n\
  \n花点时间弄清楚测试结果会是什么，然后再继续阅读本节。\n\n### 注意\n\n本节中类似的代码片段位于本书代码包中的 `snippets/06/ex1-basic-assertions/b`。使用交互式代码片段演练场时，选择\
  \ `06` 和示例 `1b`。\n\n上面代码中的断言 `[1]` 将会通过，因为 `anObject.x` 将被设置为 `5`。然而，断言 `[2]` 将会失败；`anObject.x`\
  \ 将被设置为 `4`，这不等于 `5`。仅从代码中很容易看出这一点，但我们需要一种实际运行测试的方法。\n\n## 使用 Babel 运行测试\n\n我们可以很容易地做到这一点：直接使用\
  \ `node`。不幸的是，直到 `node` 能够理解 Babel 所用的相同 ES2015 之前，我们实际上需要使用一个名为 `babel-node` 的\
  \ `node` 包装器。它很容易安装；虽然在本节中我们不会长期使用它，但安装它还是个好主意。它对于尝试 ES2015 语法非常有用：\n\n```\nnpm\
  \ install -g babel-node\n```\n\n现在我们可以运行测试了：\n\n```\nbabel-node test.js\n```\n\n\
  最初，你可能会认为事情搞砸了。但花点时间看看输出。它应该看起来像下面这样：\n\n```\nlogology-v06/node_modules/chai/lib/chai/assertion.js:107\n\
  \      throw new AssertionError(msg, {   [1]\n            ^\nAssertionError: expected\
  \ 4 to equal 5   [2]\n    at Object.<anonymous> (logology-v06/test/test.js:15:22)\
  \  [3]\n    at Module._compile (module.js:460:26)\n    at normalLoader (/usr/local/lib/node_modules/babel/node_modules/babel-core/lib/api/register/node.js:199:5)\n\
  \    at Object.require.extensions.(anonymous function) [as .js] (/usr/local/lib/node_modules/babel/node_modules/babel-core/lib/api/register/node.js:216:7)\n\
  \    at Module.load (module.js:355:32)\n    at Function.Module._load (module.js:310:12)\n\
  \    at Function.Module.runMain (module.js:501:10)\n    at Object.<anonymous> (/usr/local/lib/node_modules/babel/lib/_babel-node.js:144:25)\n\
  \    at Module._compile (module.js:460:26)\n    at Object.Module._extensions..js\
  \ (module.js:478:10)\n```\n\n如果你看不到类似的错误，说明确实出错了；你可能把路径搞混了。但如果你看到了，说明你做对了。\n\n那么错误告诉我们什么？\n\
  \n1. 断言失败（错误类型是 `AssertionError`）。\n2. 失败的断言是 `4 === 5`。请注意 `[3]` 处的行号是不正确的，因为 Babel\
  \ 正在转译我们的 ES2015 代码并将其传递给 Node.js。\n\n当然，这些都不美观。很难准确判断到底哪个断言失败了（是第一个还是第二个？），也很难从这一堆混乱信息中提取重要信息。此外，还有一个困难：一次运行多个测试。谢天谢地，有一种更好的方法，叫做测试运行器，我们稍后会介绍。\n\
  \n使用 Chai 编写测试非常简单，但本章篇幅不足以完整记录你能做的一切。相反，让我们看看一些常见示例。如果想了解更多，请参阅 [`chaijs.com/api/`](http://chaijs.com/api/)\
  \ 的文档。另请注意，我们在以下所有示例中都使用 `should` 接口。`expect` 接口是相同的（除了 `expect()` 部分），但 `assert`\
  \ 接口使用不同的方法。\n\n## 语言链\n\n\n\n\n# 语言链\n\n语言链使得用典型的英语编写测试用例变得容易。你已经见过一个例子：`be`。单独使用时，`be`\
  \ 不做任何事情；它只是为了可读性而存在。`x.should.be.equal(5)` 等同于 `x.should.equal(5)`，也等同于 `x.should.be.be.be.be.equal(5)`。你不太可能写出后者，但链接某些单词的能力使测试用例非常具有表现力。\n\
  \n### 注意\n\n本节示例位于本书代码包的 `snippets/06/ex2-language-chains` 中。使用交互式代码片段演练场时，请选择 **6:\
  \ Testing and UI Automation**（6：测试与 UI 自动化）和示例 **2**。\n\n并非每个单词都有效，因此你需要知道可以链接哪些单词：`to`、`be`、`been`、`is`、`that`、`which`、`and`、`has`、`have`、`with`、`at`、`of`\
  \ 和 `same` 都是可链接的。`a` 和 `an` 也可链接，但它们还有另一个功能：类型检查，我们稍后会介绍。\n\n这意味着你可以编写像 `x.should.have.property(\"\
  apple\").which.is.equal(5)` 这样的短语，Chai 就能明白你的意思（`x.apple===5`）。\n\n## 逻辑词\n\n这些是用于测试逻辑条件的单词：\n\
  \n### 注意\n\n本节示例位于本书代码包的 `snippets/06/ex3-logical-words` 中。使用交互式代码片段演练场时，请选择 **6:\
  \ Testing and UI Automation** 和示例 **3**。\n\n*   `not`：这会否定断言；等同于 `!`。\n*   `true`：这断言值为\
  \ `true`。例如，`(1===1).should.be.true`。\n*   `false`：这断言值为 `false`。例如，`(1===2).should.be.false`。\n\
  *   `ok`：这断言值为真值。例如，`(1).should.be.ok`、`\"hello\".should.be.ok`，但 `(false).should.not.be.ok`。\n\
  \n## 测试存在性和类型\n\n以下内容让你可以测试变量的存在性及其类型：\n\n### 注意\n\n本节示例位于本书代码包的 `snippets/06/ex4-testing-existence-types`\
  \ 中。使用交互式代码片段演练场时，请选择 **6: Testing and UI Automation** 和示例 **4**。\n\n*   `null`：这断言值为\
  \ `null`。例如，`expect(x).to.be.null` 或 `expect(x).to.not.be.null`。注意它仅适用于 `expect`\
  \ 或 `assert`。\n*   `undefined`：这断言值为未定义。例如，`expect(x).to.be.undefined`。注意它仅适用于 `expect`\
  \ 或 `assert`。\n*   `exist`：这断言值既不是 `null` 也不是 `undefined`。例如，`let x=5; x.should.exist;`\
  \ 是一个真命题，但你真的应该使用 `expect(x).to.exist` 这种形式，以防 x 是 `null` 或 `undefined`。\n*   `a`、`an`、`instanceOf`：这断言值为指定类型。例如，`\"\
  hello\".should.be.a(\"string\")`。务必先检查你正在测试的项目是否存在。\n\n## 测试相等性\n\n你已经看到了一种检查相等性的方法：`equal`。然而，根据上下文，还有其他几种方法可供使用，如下所示。\n\
  \n### 注意\n\n本节示例位于本书代码包的 `snippets/06/ex5-testing-equality` 中。使用交互式代码片段演练场时，请选择\
  \ **6: Testing and UI Automation** 和示例 **5**。\n\n*   `equal`、`equals`、`eq`：这测试严格相等；等同于\
  \ `===` 运算符。例如，`(5).should.equal(5)` 为真，但 `[1].should.equal([1])` 不为真，即使从视觉上看似乎是真的。然而从\
  \ JavaScript 角度来看，每个数组都是一个单独的实例，所以它们不严格相等。为了避免这种情况，你可以结合 `deep` 使用 `equal`：`[1].should.deep.equal([1])`\
  \ 为真。注意，如果你测试的项目有可能是 `null` 或 `undefined`，请使用 `should.equal(x,5)` 或 `expect(x).to.be.equal(5)`\
  \ 这种形式。\n*   `eql`、`eqls`：这是 `.deep.equal` 的别名。\n*   `above`、`gt`、`greaterThan`：这断言值高于提供的阈值；等同于\
  \ `>` 运算符。例如，`[1,2,3].should.have.length.above(1)` 和 `(5).should.be.above(4)`。\n\
  *   `below`、`lt`、`lessThan`：这断言值低于提供的阈值；等同于 `<` 运算符。例如，`[1,2,3].should.have.length.below(4)`。\n\
  *   `least`、`gte`：这断言值高于提供的阈值或等于它；等同于 `>=` 运算符。例如，`[1,2,3].should.have.length.at.least(3)`\
  \ 和 `(10).should.be.gte(5)`。\n*   `most`、`lte`：这断言值低于提供的阈值或等于它；等同于 `<=` 运算符。例如，`[1,2,3].should.have.length.at.most(3)`。\n\
  *   `within`：这断言值在两个提供的值之间。例如，`\"hello\".should.have.length.within(4,6)`。\n*   `closeTo`：这断言值在提供的精度范围内接近提供的值。例如，`(5.75).should.be.closeTo(6,\
  \ 0.5)`。\n*   `match`：这断言字符串匹配给定的正则表达式。例如，`\"hello\".should.match(/.*/)`。\n*   `string`：这断言字符串包含给定的子字符串。例如，`\"\
  hello\".should.have.string(\"lo\")`。\n\n## 测试集合\n\n当涉及到测试数组、对象或字符串可能包含的内容时，也有几个非常有用的方法，如下所示：\n\
  \n### 注意\n\n本节示例位于本书代码包的 `snippets/06/ex5-testing-collections` 中。使用交互式代码片段演练场时，请选择\
  \ **6: Testing and UI Automation** 和示例 **6**。\n\n*   `length`、`lengthOf`：这断言数组或字符串具有指定的长度。例如，`[1,\
  \ 2].should.be.length(2)`。\n*   `contain`、`contains`、`include`、`includes`：这断言数组或字符串包含提供的项目。等同于\
  \ `indexOf`。例如：`\"hello\".should.contain(\"lo\")` 和 `[1, 2, 3].should.contain(2)`。\n\
  *   `empty`：这断言集合为空。对字符串和数组检查 `length === 0`。如果对象没有可枚举属性，则被视为空。\n*   `property`：这断言项目具有指定的属性，以及可选的指定值。如果结合\
  \ `deep` 使用，可以使用点号和括号表示法深入探测对象。例如，`({x:5}).should.have.property(\"x\")` 和 `({x:{y:2}}).should.have.deep.property(\"\
  x.y\", 2)`。数组也适用：`({x:[1,2]}).should.have.deep.property(\"x[0]\", 1)`。\n*   `ownProperty`、`haveOwnProperty`：这断言项目具有指定属性，且该属性是项目自身的——即不是通过原型链继承的。\n\
  *   `respondTo`：这断言项目具有指定的方法。例如，`x.should.respondTo(\"aMethodName\")`。\n*   `key`、`keys`：这断言项目具有指定的键。对象是否应包含所有提供的键，取决于前面语言链中的各种修饰符。\n\
  \    *   `any`：如果在链中使用了此项，则项目只需拥有提供的键中的一个，断言即为真。例如，`({x:5,y:10}).should.contain.any.keys(\"\
  a\", \"b\", \"x\")` 通过，因为对象包含 `x` 作为键。\n    *   `all`：如果在链中使用了此项，则项目需要包含所有提供的键，断言才为真。项目是否可以拥有更多键，取决于语言链中使用的是\
  \ `have` 还是 `contain`。例如，`({x:5,y:10,z:20}).should.contain.all.keys(\"x\", \"y\"\
  )` 通过，因为它拥有所有指定的键。`({x:5,y:10,z:20}).should.have.all.keys(\"x\", \"y\")` 失败，因为它拥有比指定更多的键。\n\
  \n\n\n\n\n# 使用 Mocha 进行测试聚合\n\n由于我们必须快速识别哪些测试失败了，因此我们需要一个实用程序来聚合所有测试，并以可读的格式呈现结果。市面上有很多优秀的测试运行器（Karma、Chutzpah、Jasmine\
  \ 等）。但在本节中，我们将使用 `Mocha`。`Mocha` 非常简单：它会执行我们提供的每个测试，识别通过的测试，然后以显而易见的方式报告任何错误。\n\n\
  ### 注意\n\n您可以在 [`mochajs.org`](http://mochajs.org) 找到更多关于 `Mocha` 的文档。\n\n## 安装\
  \ Mocha\n\n首先，我们需要安装 `Mocha`：\n\n```\nnpm install -g mocha\n```\n\n## 编写测试套件\n\n\
  接下来，我们需要编写一些 `Mocha` 能够理解的测试套件。请继续删除我们之前创建的 `code.js` 和 `test.js` 文件。现在是进行真正测试的时候了！事实上，让我们来测试一下我们应用的\
  \ `AbstractDictionary` 类。\n\n下面是一个非常简单的测试，我编写它是为了验证字典确实能够创建一个新的 `Dictionary` 对象：\n\
  \n```\n\"use strict\";\nlet should = require(\"./helpers/setup\").should;\nimport\
  \ Dictionary from \"../src/www/js/app/models/Dictionary\";\n\ndescribe(\"Dictionary\
  \ Tests\", () => {\n    let dictionary = new Dictionary();\n    it(\"should be able\
  \ to create a new instance\", () => {\n        return dictionary.should.exist;\n\
  \    });\n});\n```\n\n请注意，除了导入我们的 `Dictionary` 对象之外，前导代码与我们之前测试文件中使用的相同。新的部分是以 `describe`\
  \ 开头的部分。\n\n`describe()` 仅用于将一个或多个测试分组在一起。`describe()` 可以根据需要嵌套任意层级（虽然如果嵌套很深，你可能应该将测试套件拆分到单独的文件中）。在输出中，组内执行的测试会显示一个漂亮的标题，以便于引用。\n\
  \n测试用例是使用 `it()` 方法定义的。为了充分测试你的代码，可以根据需要定义任意数量的 `it()`。事实上，当你想到测试点时，应该将待定测试放入测试套件中；这些测试被定义为没有函数体的\
  \ `it()` 方法：\n\n```\nit(\"should be able to jump up and down\");     \n// 在输出中将标记为\
  \ PENDING（待定）\n```\n\n这让你稍后可以回来定义实际的测试，同时也能跟踪仍需实际实现的测试。\n\n每个测试可以是完全独立的，也可以依赖于之前的执行结果。这完全取决于你和你正在测试的代码。在我们的例子中，我们希望每个测试都建立在先前的结果之上，以减少代码重复。例如，下面是我们如何验证新创建的字典确实是空的（并且在搜索空字典时不会抛出错误）：\n\
  \n```\ndescribe(\"Dictionary Tests\", () => {\n    let dictionary = new Dictionary();\n\
  \    describe (\"#Create\", () => {\n        it(\"should be able to create a new\
  \ instance\", () => {\n            return dictionary.should.exist;\n        });\n\
  \    });\n    describe (\"#Empty\", () => {\n        it(\"should return an empty\
  \ sorted index\", () => {\n            return dictionary.sortedIndex.should.have.lengthOf(0);\n\
  \        });\n        describe (\"#find\", () => {\n            it(\"searching on\
  \ an empty dictionary by \n              lemma should not error\", () => {\n   \
  \             return dictionary.getEntries({lemma:\"cat\"}).\n                 \
  \ should.eventually.have.lengthOf(0);\n            });\n            it(\"searching\
  \ on an empty dictionary by wordnetref \n              should not error\", () =>\
  \ {\n                return dictionary.getEntries({wordNetRef:0}).\n           \
  \       should.eventually.have.lengthOf(0);\n            });\n        });\n    });\n\
  });\n```\n\n因为现在有了多个测试，我们引入了额外的 `describe()` 语句。这使我们能够对测试进行分类。第一个测试仅验证我们能否创建一个新字典，因此它归入\
  \ `#Create` 类别。接下来的几个测试验证该字典的空性，因此它们共同归入 `#Empty` 类别。然而，最后两个测试在字典内部进行搜索，所以我们给它们一个\
  \ `#find` 子类别。在 `Mocha` 的输出中，每个 `describe()` 语句都会创建一个新的缩进层级，因此每个测试的类别都清晰可见。\n\n\
  ### 注意\n\n注意前面代码中的 `eventually`？这是 `chai-as-promised` 等待 Promise resolve 的方式。\n\n\
  到目前为止，这些测试都很简单。让我们看一个包含更复杂测试的例子：\n\n```\ndescribe (\"#AddApple\", () => {\n    it(\"\
  should be able to add an entry.\", () => {\n        let definition = new Definition({\n\
  \            wordNetRef: 1,\n            lemmas: [\"apple\"],\n            partOfSpeech:\
  \ \"noun\",\n            gloss: \"A tasty fruit\"\n        });\n        return dictionary._addDefinition(definition).should.exist;\n\
  \    });\n    it(\"should now return a single sorted index\", () => {\n        return\
  \ dictionary.sortedIndex.should.have.lengthOf(1);\n    });\n    it(\"... that contains\
  \ the word Apple\", () => {\n        return dictionary.sortedIndex.\n          should.deep.equal([\"\
  apple\"]);\n    });\n    describe (\"#find\", () => {\n        it(\"should be able\
  \ to find the entry for Apple via lemma\", () => {\n            return dictionary.getEntries({lemma:\"\
  apple\"}).should.\n                    eventually.have.lengthOf(1).and.\n      \
  \              deep.property(\"[0].gloss\",\"A tasty fruit\");\n        });\n  \
  \      it(\"should be able to find the entry for Apple via wordnetref\", () => {\n\
  \            return dictionary.getEntries({wordNetRef:1}).should.\n            \
  \        eventually.have.lengthOf(1).and.\n                    deep.property(\"\
  [0].gloss\",\"A tasty fruit\");\n        });\n    });\n});\n```\n\n所有这些测试应该都很容易理解。最复杂的测试在\
  \ `#find` 类别中。在这些测试中，我们测试 `lengthOf()`（以确保返回结果只包含一项），并确保我们收到了正确的定义。\n\n## 运行测试\n\
  \n定义了一些测试后，我们可以使用 `Mocha` 来运行它们：\n\n```\nmocha --require \"babel/register\" .\n\
  ```\n\n### 注意\n\n如果你不使用 ES2015，则不需要 `--require \"babel/register\"` 部分。\n\n该点号指示\
  \ `Mocha` 在当前工作目录中运行它能找到的所有测试。你可以指定想要运行的文件，甚至是多个路径和文件。不过，通常人们会希望运行特定目录下的所有测试。\n\n\
  ## 解读输出\n\n输出应如下所示：\n\n```\n  Dictionary Tests\n    #Create\n    √ should be able\
  \ to create a new instance\n    #Empty\n    √ should return an empty sorted index\n\
  \      #find\n      √ searching on an empty dictionary by lemma should not error\n\
  \      √ searching on an empty dictionary by wordnetref should not error\n    #AddApple\n\
  \    √ should be able to add an entry.\n    √ should now return a single sorted\
  \ index\n    √ ... that contains the word Apple\n      #find\n      √ should be\
  \ able to find the entry for Apple via lemma\n      √ should be able to find the\
  \ entry for Apple via \nwordnetref\n... [snip] ...\n\n  27 passing (47ms)\n```\n\
  \n前面的结果通常是你所期望的：列出的每个测试都已通过（由对勾标记表示），且没有任何错误。虽然这是件好事，但仍然重要的是要记住，这并不能确保你的代码一定没有 Bug：`Mocha`\
  \ 只能测试你显式定义的情况。\n\n然而，你经常会看到类似以下的输出：\n\n```\n  Dictionary Tests\n\n... [snip] ...\n\
  \n    #AddRock/Stone\n    √ should be able to add a fourth entry with two lemmas.\n\
  \    √ should return a sorted index of length 4\n      1) ... that is [apple, cat,\
  \ rock, stone]\n\n... [snip] ...\n\n  26 passing (61ms)\n  1 failing\n\n  1) Dictionary\
  \ Tests #AddRock/Stone ... that is \n[apple, cat, rock, stone] :\n\n      AssertionError:\
  \ expected ['apple', 'cat', 'rock', 'stone' ] \nto deeply equal ['apple', 'cat',\
  \ 'rock', 'stones' ]\n      + expected - actual\n      [\n        \"apple\"\n  \
  \      \"cat\"\n        \"rock\"\n      -  \"stone\"\n      +  \"stones\"\n    \
  \  ]\n\n... [snipped out stack trace] ...\n```\n\n\n\n\n首先，请注意，错误最初是与通过的测试一起列出的。它们不是用对勾标记，而是用数字列出。这个数字类似于脚注；可用于引用稍后列出的实际错误。这也意味着错误消息本身（通常很长且冗长）不会弄乱测试列表，因此仍然很容易判断哪些测试通过、哪些测试失败。\n\
  \n错误本身位于末尾。它们带有与测试列表中显示的相同编号，并且还包含每一个 `describe` 和 `it` 的描述，以便在代码中轻松定位测试。消息指示失败的断言，然后继续指示差异。这非常有用，因为它能让你看清结果的哪些部分是正确的，哪些部分不是。最后，列出了堆栈跟踪。它通常会直接指向代码中的错误，只不过对于\
  \ ES2015 转译后的代码，行号几乎总是不正确（这就是为什么我在前面的示例中将其裁剪掉的原因）。你应该确保测试用例标记清晰，以便在不依赖行号的情况下轻松定位问题。\n\
  \n### 提示\n\n有时，测试用例失败仅仅是因为拼写错误，或者对结果应有的样子存在误解。在前面的案例中，测试用例中有个拼写错误。因此，不要假设测试失败就意味着代码有\
  \ Bug。这可能意味着你的 `测试用例` 有 Bug。务必测试你的测试用例，并确保它们本身是准确的。\n\n关于代码测试 Cordova 应用，有几件重要的事情你应该了解：\n\
  \n*   代码测试发生在 Node JavaScript 环境中，而非浏览器或设备上。\n*   如果你需要验证应用是否正确创建了 DOM 元素，可以使用各种模块模拟特定方面，例如\
  \ jsdom ([`www.npmjs.com/package/jsdom`](https://www.npmjs.com/package/jsdom))。\n\
  *   代码测试无法验证插件行为。最好提供能模拟插件行为的替代方案，以便测试应用的其他方面。\n\n当然，在验证应用正确性方面，这些限制极大。因此，我们需要一些额外的工具来在设备上测试应用。\n\
  \n要在物理设备上验证应用的正确性，我们需要深入研究用户界面自动化。这些测试更侧重于与应用的交互及正确结果的验证，而非验证应用的内部逻辑。测试看起来更像是一系列与应用控件的交互集合，而不是直接处理模型、视图、控制器等。检查正确结果更像是确保特定控件显示在屏幕上，而不是检查对象是否具有特定属性。\n\
  \n虽然自动化测试的目标与代码测试相同，但你必须从不同的角度来处理测试。直接测试代码时，你可以访问代码创建的对象并轻松与它们交互。通过自动化测试应用时，你必须从用户的角度来审视应用：应该按哪些按钮，视觉结果应该是什么？在某种程度上，可以将内部代码测试视为白盒测试，将应用测试视为黑盒测试。\n\
  \n这个类比并不完美，因为黑盒测试通常意味着你不知道或无法访问应用的内部结构。大多数自动化工具都会提供一定级别的应用内省能力；因此，通常可以验证内部状态，这在某些方面违背了黑盒的类比。即便如此，这也是一种很好的思考方式：黑盒迫使你与可见界面交互，而不是与内部代码交互。\n\
  \n有许多不同的工具执行用户界面自动化，但必须验证这些工具能否以移动设备为目标。此外，虽然自动化工具可能支持原生代码，但我们也需要一个允许我们使用跨平台代码的工具。毕竟，除非绝对必要（确实存在必须这样做的情况），否则我们不想为每个目标平台编写多个版本的测试。\n\
  \n不幸的是，满足所有这些要求的工具非常少。就目前撰写本文而言，最好的工具（就可靠性、稳定性和社区支持而言）是 Appium。Appium 可以在 iOS 和\
  \ Android 设备上运行自动化测试，也支持 iOS 模拟器和 Android 模拟器。Appium 使用 JavaScript 定义测试用例，并与我们已经熟悉的测试运行器\
  \ Mocha 良好集成。因此，它是满足我们需求的绝佳选择。\n\n### 注意\n\n测试 iOS 应用需要一台 Mac。测试 Android 应用可以使用\
  \ Windows、Linux 或 Mac OS X。\n\n## 安装 Appium\n\n安装 Appium 非常简单：\n\n```\nnpm install\
  \ -g appium@1.4.16\n```\n\n这会安装一个名为 `appium` 的全局工具。该工具充当自动化测试与设备之间的桥梁。因此，在运行任何使用它的自动化测试之前，它需要处于运行状态。我们稍后将介绍如何启动它。\n\
  \n现在，确保你的环境已正确设置以供 Appium 使用：\n\n```\n$ appium-doctor\n```\n\n如果 Appium 所需的一切都设置正确，你应该会看到以下通知：\n\
  \n```\n√ All Checks were successful\n```\n\n然而，如果我们要测试 iOS 应用，还需要安装其他几个工具。这是由于 iOS\
  \ 处理远程调试的方式所致。Android 宽松得多，不需要那么多初始设置。\n\n首先，对于 iOS，我们需要安装一个协助 Appium 将应用部署到设备的工具。虽然\
  \ Cordova 使用名为 `ios-deploy` 的工具，但 Appium 使用另一个名为 `ideviceinstaller` 的工具。假设你已经安装了\
  \ `brew` 包管理器，该工具很容易安装：\n\n```\nbrew install --HEAD ideviceinstaller\n```\n\n接下来，我们需要安装一个代理，允许\
  \ Appium 与物理设备上的应用交互：\n\n```\nbrew install ios-webkit-debug-proxy\n```\n\n当我们在物理\
  \ iOS 设备上测试应用时，此代理也需要运行。我们稍后将介绍如何启动此代理。\n\n### 注意\n\n在 iOS 模拟器上运行应用时，不需要该代理。\n\n\
  要与应用中的 Web 组件交互，我们还需要安装一个工具。此步骤适用于 iOS 和 Android：\n\n```\nnpm install --save-dev\
  \ wd@0.3.12\n```\n\n`wd` 是 Web Driver。它允许 Appium 与 Cordova 使用的系统 WebView 交互。我们的应用本身不会使用此驱动，但我们的测试用例会；因此使用\
  \ `--save-dev` 标志。\n\n从技术上讲，你不需要再安装其他东西，但还有一样东西你应该安装：Appium 桌面应用。运行应用测试并不需要它，但在编写测试时探索应用却是无价之宝。这是因为你不会仅使用\
  \ Web 技术与应用交互。相反，你必须了解应用从自动化角度是如何呈现的，以便定位你想要交互的控件。能够在应用中点击并发现内部结构，比猜测要简单快捷得多。\n\n\
  为此，你可以在 [`appium.io`](http://appium.io) 下载桌面应用。只需点击 `Download Now` 按钮，然后安装应用程序。\n\
  \n## 使用 Appium 探索你的应用\n\n现在我们已经安装了一切，让我们探索一下应用在 Appium 中的呈现方式。启动我们刚下载的 Appium 桌面应用。它应该如下所示：\n\
  \n\n\n\n# 使用 Appium 探索你的应用\n\n![使用 Appium 探索你的应用](img/9781OS_06_01.jpg)\n\n## 应用区域\n\
  \n让我们浏览一下应用的各个区域：\n\n### 配置文件管理\n*   **打开配置文件** 将打开一个之前保存的 Appium 配置文件\n*   **保存配置文件**\
  \ 将当前设置另存为一个新的 Appium 配置文件\n*   **诊断** 将为你运行 `appium-doctor`，以验证你的环境是否已正确配置\n* \
  \  **检查应用** 将打开 **Appium 应用检查器** 对话框。我们稍后将更详细地介绍此窗口\n\n### 平台配置与选择\n*   **Android**\
  \ 按钮将显示一个配置对话框，允许你指定 Android SDK 的位置、应用包的位置以及它提供的其他设置。Android 图标下方的单选按钮指示当你点击 **启动**\
  \ 时将使用哪个平台。\n*   **iOS** 按钮将显示一个配置对话框，允许你指定应用包的位置、Appium 应使用的 iOS 版本等。Apple 图标下方的单选按钮指示当你点击\
  \ **启动** 时将使用哪个平台。\n\n### 设置\n*   **常规设置** 包含通用配置选项。这些设置不是特定于平台的，这与 Android 和 iOS\
  \ 设置不同。\n*   **开发者设置** 包含额外的开发者设置。我们在本章中不会用到它，但你可能希望自行探索这些设置。\n\n### 启动\n*   **启动**\
  \ 将在选定平台上启动你的应用。当应用正在运行时，此按钮将显示为 **停止**。再次点击它将停止应用。\n\n### 日志输出\n*   **日志输出** 区域将显示应用运行时\
  \ Appium 的输出。这通常非常冗长，但当你想要探索底层结果时非常有用。\n\n## 配置常规设置\n\n在我们实际探索应用之前，需要配置一些设置。点击 **常规设置**\
  \ 按钮以显示全局配置设置。以下是我们的配置：\n\n![使用 Appium 探索你的应用](img/9781OS_06_02.jpg)\n\n你的设置不必完全一致。以下是我们发现有用的一些设置：\n\
  \n1.  **服务器地址** 和 **端口**：通常你不需要更改这些。但如果你有其他服务正在此端口上运行，你将需要将其更改为未使用的端口。\n2.  **预启动应用**：这确保应用会在设备或模拟器上自动启动。\n\
  3.  **启动前终止占用服务器端口的进程**：这确保在启动应用之前终止任何先前存在的进程。\n4.  **使用颜色**：这只是让日志文件更具可读性。\n5.\
  \  **强制滚动日志到底部**：这也使日志文件更易于跟踪。当记录新项目时，日志文件本身将自动滚动到新信息处。\n\n## 构建应用包\n\n为了测试我们的应用，我们需要知道应用包的位置。你应该已经拥有可在模拟器上运行的版本，但你可能没有构建可在真实设备上运行的版本。让我们继续构建：\n\
  \n```\n# 使用 Gulp\n  gulp build --for ios --mode debug --target device\n  gulp build\
  \ --for android --mode debug --target device\n\n# 使用 Cordova\n  cordova build ios\
  \ --device\n  cordova build android --device\n```\n\n### 注意\n\n你可以用 `emulator` 代替\
  \ `device` 来为模拟器构建，尽管模拟器/仿真器目标是默认的构建目标。\n\n## 定位应用包\n\n接下来，我们需要确定应用包的位置。Cordova\
  \ 遵循一种模式，所以弄清楚这一点并不难，值得庆幸。路径如下：\n\n*   iOS 真机构建：`<project root>/build/platforms/ios/device/<app-name>.ipa`\n\
  *   iOS 模拟器构建：`<project root>/build/platforms/ios/emulator/<app-name>.app`\n*  \
  \ Android（真机和模拟器）：`<project root>/build/platforms/android/build/outputs/apk/android-debug.apk`\n\
  \n这些路径很重要，因为 Appium 使用它们来部署和启动我们的应用程序。现在，点击 Appium 应用中的 Android 机器人图标或 iOS Apple\
  \ 图标。这将允许你指定应用在计算机上的位置以及应使用的设备设置。\n\n## 配置 iOS\n\n对于 iOS，我们的配置如下所示：\n\n![使用 Appium\
  \ 探索你的应用](img/9781OS_06_03.jpg)\n\n### iOS 设置\n\n让我们浏览一下各项设置：\n\n1.  **应用路径**：这指定了我们应用包的位置。在我们的示例中，我们使用的是\
  \ iOS 模拟器，所以我们将使用 iOS 模拟器构建版本。\n2.  **强制设备**：这让我们确定将启动哪个设备模拟器。\n3.  **平台版本**：这让我们使用特定的\
  \ iOS 版本启动设备模拟器。在真机测试时，这应与物理设备的 iOS 版本匹配。\n4.  **UDID**：要在真机上测试，Appium 需要知道设备的 UDID。使用模拟器时，你可以留空此项。\n\
  \n### 提示\n\n如果你想在真机上测试，需要知道设备的 UDID。你可以通过执行 `xcrun instruments -s devices` 来找到它。假设你的设备已连接到电脑，它应该会与你安装的所有模拟器一起出现。你的设备\
  \ UDID 列在括号中。你还需要运行 webkit 调试代理，如下所示：`ios_webkit_debug_proxy -u <your device UDID>:27753\
  \ -d &`。\n\n## 配置 Android\n\n对于 Android，我们的配置如下所示：\n\n![使用 Appium 探索你的应用](img/9781OS_06_04.jpg)\n\
  \n### Android 设置\n\n这些设置如下：\n\n1.  **应用路径**：这指定了我们应用包的位置。无论我们使用的是模拟器还是真机，Android\
  \ 都不在意，所以这通常不需要更改，除非你在不同芯片组的设备上测试（例如 Intel 与 ARM）。\n2.  **启动 AVD**：如果勾选，Appium 将启动指定的模拟器。列出的模拟器来自\
  \ `android avd` 命令。如果你安装了 Genymotion，可能会看到其他列出的模拟器，但你无法使用此工具启动 Genymotion。如果你想使用\
  \ Genymotion，必须在任何测试之前启动虚拟设备，并取消勾选此设置。\n3.  **平台名称**：你需要为此设置选择 **Android**。\n4.\
  \  **平台版本**：你需要将其与物理或模拟设备上运行的 Android 版本相匹配。\n\n### 高级设置\n\n你还需要指定 Android SDK 的位置；点击\
  \ **高级** 选项卡并在 **2** 中输入 SDK 的路径：\n\n![使用 Appium 探索你的应用](img/9781OS_06_05.jpg)\n\
  \n### 注意\n\n对于 Android 和 iOS，你都需要将配置与你正在使用的模拟器/设备相匹配。例如，如果你的设备运行 Android 5.1，你应该确保\
  \ Android 设置指向 Android 5.1。如果你的 iOS 设备运行 8.4，请确保 iOS 配置的版本设置为 8.4。\n\n## 启动应用\n\n\
  要启动你的应用，你可以通过点击 Android 或 Apple 图标下方的单选按钮来选择要使用的平台，然后点击 **启动** 按钮。\n\n### 提示\n\n\
  如果你在真机上测试，请务必在使用 Appium 启动应用之前将设备插入电脑。如果你使用 Genymotion，请在使用 Appium 启动应用之前启动你的虚拟设备。\n\
  \n## 检查应用\n\n你的应用应该会在模拟器中启动或在连接的设备上启动，并且大量信息应该会显示在日志窗口中。一旦应用启动，点击 **检查应用** 按钮（它有一个放大镜图标）。你应该会看到类似于以下屏幕截图的内容：\n\
  \n![使用 Appium 探索你的应用](img/9781OS_06_06.jpg)\n\n此屏幕上有几个感兴趣的区域，但我们最感兴趣的是其中四个。这些区域为我们编写适合应用的正确测试提供了一切所需，如下所示：\n\
  \n\n\n\n# 使用 Appium 探索您的应用\n\n## Appium Inspector 界面\n\n1.  `Widget Hierarchy`（控件层级）显示在对话框中间的多栏区域中。当您点击控件时，该控件的子控件将显示在相邻的列中。\n\
  \n2.  `App Preview`（应用预览）显示在对话框最右侧。选中的控件应在预览中显示为红色边框。\n\n3.  `Widget Attributes`（控件属性）区域显示所选控件的信息。这些属性可用于以编程方式搜索控件。\n\
  \n4.  左下角的 `Widget Search`（控件搜索）选项卡页在将搜索字符串固化到测试用例之前测试它们时非常有用。它默认不显示，因此您必须手动显示它。\n\
  \n### 注意\n\n当您在模拟器或物理设备上与应用交互时，预览不会自动刷新。要获取最新预览，请点击 `Refresh`（刷新）按钮。\n\n如果您测试的应用仅使用原生组件，则可以很轻松地开始查找元素。由于我们的应用是混合应用，我们首先需要找到对应于我们\
  \ Cordova 应用的 Web 视图。您可以通过控件类来识别它。在 iOS 上，它标记为 `UIAWebView`；在 Android 上，它是标记为 `android.webkit.WebView`\
  \ 的第二个控件（由于某种原因有两个）。\n\n一旦您定位到 Cordova Web 视图，就可以继续深入控件层级。您应该开始识别出您自己应用的元素。我们应用的某个视图的层级和属性类似于以下屏幕截图：\n\
  \n![使用 Appium 探索您的应用](img/9781OS_06_07.jpg)\n\n### 提示\n\n层级中括号内的文本是 `Widget Class`（控件类）。这描述了控件的类型。它可用于以编程方式定位控件，但它是特定于平台的；因此，您应仅将其作为最后的手段使用。\n\
  \n您可能会注意到，层级结构仅隐约类似于您应用的 DOM 结构。iOS 和 Android 在这方面都有各自的处理方式，且两者使用不同的层级结构。因此，在构建测试时，您需要在两个平台上查看您的应用，以便了解您需要处理的元素实际位于何处。为了编写良好的跨平台测试用例，您随后需要寻找在\
  \ iOS 和 Android 上都适用的共性，以便仍能创建一个在两个平台上都能工作的简单测试用例。\n\n让我们看看在 iOS 上滑动一行以显示某些操作后，我们应用的层级结构：\n\
  \n![使用 Appium 探索您的应用](img/9781OS_06_09.jpg)\n\n如果您将此层级结构与之前的屏幕截图进行比较，可以看到元素几乎没有显示任何结构。我们对它们进行了漂亮的排列，使它们在视觉上与应用预览相对应。但就\
  \ Appium 而言，它们只是一个控件的线性列表。\n\n我们提到过层级结构因平台而异。让我们看看 Android 上的相同布局：\n\n![使用 Appium\
  \ 探索您的应用](img/9781OS_06_10.jpg)\n\n在某些方面，Android 的层级结构更接近我们的 DOM 布局。例如，导航栏有自己的容器，搜索控件也有一个容器。然而，在其他方面，它类似于\
  \ iOS 的层级结构。也就是说，列表本身没有深度，尽管它在 DOM 中确实有深度。\n\n当您探索应用的层级结构时，可能会注意到一件重要的事：层级结构和属性类似于您的应用呈现的\
  \ `accessibility`（无障碍）层级结构。简而言之，您为使应用对最终用户无障碍所付出的所有努力，在测试中也会获得回报，因为您可以使用相同的信息来测试您的应用！\n\
  \n假设我们想点击汉堡菜单图标以显示侧边栏。我们在两个图中都将其标记为 **(1)**。我们不能只写类似 `tap({x:50, y:50})` 这样的代码，其中\
  \ `x` 和 `y` 是坐标，仅仅因为该位置的控件可能因设备、平台、方向等而截然不同。因此，我们需要通过其他方式定位控件。我们将使用 `Location Strategies`（定位策略）来实现。通常，我们会使用\
  \ `XPath` 策略，这是一种搜索 XML 文档的方法。Appium 可以将应用的控件层级转换为 XML，并且 XPath 可跨多个平台工作，这使其成为一个不错的选择。\n\
  \n### 基本 XPath 语法\n\n首先，让我们回顾一些基本的 XPath 语法。假设我们有如下形式的 XML 文档：\n\n```\n<UIAWebView\
  \ id=\"w1\">\n  <UIAButton id=\"btn1\" name=\"button 1\" />\n  <UIAButton id=\"\
  btn2\" name=\"button 2\" />\n  <UIAList id=\"lst1\">\n    <UIAButton id=\"btn3\"\
  \ name=\"button 3\" />\n  </UIAList>\n</UIAWebView>\n```\n\n要直接引用特定节点，例如 `button\
  \ 3`，我们可以使用以下 XPath 查询：\n\n```\n/UIAWebView/UIAList/UIAButton\n```\n\n现在，这看起来很像文件或\
  \ URI 路径，对吧？这是设计使然：XPath 使用了一些您已经熟悉的约定，并对其进行扩展，以便在树中进行更复杂的搜索。\n\n让我们看更多示例。在继续之前，请尝试推断它们匹配的内容：\n\
  \n```\n1. /UIAWebView/UIAButton\n2. /UIAWebView/UIAButton[2]\n3. /UIAWebView/*\n\
  4. //UIAButton\n5. //UIAButton[3]\n6. //*[@name=\"button 3\"]\n7. //*[@name=\"button\
  \ 2\" or @name=\"button3\"]\n8. //*[@name|@id=\"button 1\"]\n```\n\n因此，大多数都应该很简单；但有几个答案可能会让您感到惊讶。让我们看看这些\
  \ XPath 匹配哪些节点：\n\n1.  匹配 `#btn1` 和 `#btn2`，因为它们是 `UIAWebView`（根元素）的直接后代。\n\n2.\
  \  匹配 `#btn2`。它是 `UIAWebView` 的第二个直接后代 `UIAButton`。\n\n3.  匹配 `#btn1`、`#btn2` 和\
  \ `lst1`。`*` 可用作通配符以匹配任何元素类型。\n\n4.  匹配 `#btn1`、`#btn2` 和 `#btn3`。通过使用 `//`，搜索不再固定于根元素。\n\
  \n5.  什么都不匹配。惊讶吗？事实上，尽管 #4 返回了三个元素，但 `[3]` 不像数组索引。相反，它匹配相对于其父级为第三个的任何 `UIAButton`，而我们没有这样的元素。\n\
  \n6.  匹配 `#btn3`。我们使用的是属性搜索（`@name`）。值区分大小写。\n\n7.  匹配 `#btn2` 和 `#btn3`。我们可以使用\
  \ `or` 和 `and` 来创建更复杂的搜索字符串。\n\n8.  匹配 `@btn1`。`|` 运算符是并集：它将查看两个属性，`name` 和 `id`。\n\
  \n### 在 XPath 中使用函数\n\n我们还可以使用函数，这样就不必搜索确切的文本。例如，让我们看看可以通过编程方式找到我们汉堡菜单图标的搜索字符串：\n\
  \n![使用 Appium 探索您的应用](img/9781OS_06_08.jpg)\n\n要查看此特定选项卡页，您需要先点击 `Locator`（定位器）选项卡。`Strategy`（策略）应已设置为\
  \ `xpath`；如果没有，请相应地更改它。接下来，您需要将搜索字符串输入 `Value`（值）字段，然后点击 `Search`（搜索）。\n\n我们构建的完整搜索字符串是\
  \ `//*[contains(@name|@content-desc,\"sidebar\")]`。如果您点击 `Search`（搜索）按钮，显示侧边栏的汉堡菜单图标应会以红色高亮显示。\n\
  \n### 提示\n\n如果找不到项目或找到多个项目，Appium 将通过警告对话框通知您。\n\n此搜索字符串查找包含文本 \"sidebar\" 的任何控件。如果侧边栏是打开的，此搜索实际上会太模糊；它会找到两个按钮。但如果侧边栏不可见，搜索将按我们期望的找到汉堡菜单图标。在这种情况下，我们实际上想搜索与“点击以显示侧边栏”完全匹配的内容。\n\
  \n让我们尝试一个更复杂的例子。假设我们想定位层级结构中标记为 **(2)** 的 `Favorite`（收藏）图标。此按钮会将 `ant bear`（食蚁兽）添加到用户的收藏定义中。\n\
  \n我们当然可以非常具体（它是 `name|content-desc` 并集中包含 `Save this item as a favorite`（将此项保存为收藏）的第三个按钮）：\n\
  \n```\n//*[@content-desc|@name=\"Save this item as a favorite\"][3]\n```\n\n\n\n\
  然而，我们通常需要更通用的方法。毕竟，如果行数更多或行的排列顺序不同，按钮的位置就会改变。为此，我们首先需要定位到我们需要的那一特定行：\n\n```\n//*[@content-desc|@name=\"\
  ant bear\"]\n```\n\n一旦找到该行，我们需要深入其中并找到关联的 `Favorite` 按钮。同样，我们可以相当具体地定位；碰巧该按钮是该定义的紧邻同级元素：\n\
  \n```\n//*[@content-desc|@name=\"ant bear\"]/following-sibling::*[1]\n```\n\n如果我们应用的\
  \ DOM 结构发生变化，此测试将停止工作。因此，我们需要查找特定内容；在本例中为 `Save this item as a favorite`：\n\n```\n\
  //*[@content-desc|@name=\"ant bear\"]/following-sibling::*[@content-desc|@name=\"\
  Save this item as a favorite\"]\n```\n\n如果你执行此操作，会发现搜索实际上定位了更多项目；即所有位于我们收藏定义之后的\
  \ `Favorite` 按钮。因此，我们需要将返回集限制为第一个项目。最终查询如下所示：\n\n```\n//*[@content-desc|@name=\"\
  ant bear\"]/following-sibling::*[@content-desc|@name=\"Save this item as a favorite\"\
  ][5]\n```\n\n遗憾的是，完整描述 XPath 超出了本章的范围。你可以查看本书代码包中的示例（我们的测试位于 `logology-v06/test-ui`\
  \ 目录下）。你也可以在网上找到许多优秀资源，例如：\n\n*   [`en.wikipedia.org/wiki/XPath`](https://en.wikipedia.org/wiki/XPath)\n\
  *   [`developer.mozilla.org/en-US/docs/Web/XPath`](https://developer.mozilla.org/en-US/docs/Web/XPath)\n\
  *   [`msdn.microsoft.com/en-us/library/ms256086(v=vs.110).aspx`](https://msdn.microsoft.com/en-us/library/ms256086\\\
  (v=vs.110\\).aspx)\n*   [`www.w3.org/TR/xpath20/`](http://www.w3.org/TR/xpath20/)\
  \ （规范）\n*   [`chris.photobooks.com/xml/`](http://chris.photobooks.com/xml/) 是一个出色的\
  \ XPath 测试工具，可高亮显示匹配的节点。请务必选择左上角的 `XPath`。然后你可以输入 XML 文档和 XPath 搜索语句，点击 `Render`\
  \ 即可高亮显示匹配的节点。\n\n现在 Appium 桌面应用的优势应该很清晰了：它是在探索应用层级在 Appium 中如何呈现的同时，针对应用本身测试 XPath\
  \ 搜索字符串的绝佳方式。\n\n## 创建测试用例\n\n对于本章的这一节，你需要查看本书代码包中的 `logology-v06/test-ui` 目录以简化测试设置。如果你不想使用它也可以，但那样你就需要手动进行\
  \ Appium 配置。\n\n在 `test-ui/helpers` 中，我们有以下几项内容：\n\n*   `servers/`：该目录包含两个脚本，用于定义\
  \ Appium 服务器的运行位置。SauceLabs 提供了一种远程运行测试的机制；如果你想使用它，可以更新该目录下的 `sauce.js` 并填入你的访问信息。我们将使用\
  \ `local.js` 服务器设置，其默认为 `localhost:4723`（注意，如果你需要更改 Appium 运行的端口号，必须更新此文件）。\n* \
  \  `profiles/`：Appium 根据指定的能力（capabilities）决定使用哪个设备。当你只连接了一台物理设备时，测试目标显而易见；但通常你会同时有多个模拟器和多个平台可用。因此，Appium\
  \ 需要能够确定使用哪一个。指定的设置与我们在 Appium 桌面应用中使用的相匹配。我们在该目录下定义了多个配置文件，但你需要根据自己的环境进行调整。配置文件如下所示：\n\
  \n```\nexports.profile = {\n    browserName: \"\",\n    platformName: \"Android\"\
  ,\n    platformVersion: \"5.1.1\",\n    deviceName: \"Android Emulator\",\n    app:\
  \ __dirname + \"/../../../build/platforms/android/build/outputs/apk/android-debug.apk\"\
  \n}\n```\n\n*   `util.js`：包含工具函数和初始化代码。它包含用于根据环境变量选择适当能力的样板代码。它还返回一个我们可以用来*驱动*应用的\
  \ WebDriver 实例。\n*   `should.js`：引入 `chai` 和 `chai-as-promised`。它包含与我们代码测试非常相似的样板代码。\n\
  \n让我们看一个简单的测试用例：\n\n```\n\"use strict\";\n\nvar util = require(\"./helpers/util\"\
  );\nvar should = util.should;\n\ndescribe(\"Test\", function() {\n    this.timeout(300000);\n\
  \    it(\"should have a rootContainer\", () => {\n        return util.driver.elementByCss(\"\
  #rootContainer\")\n                          .should.eventually.exist;\n    });\n\
  })\n```\n\n测试本身应该很简单。我们正在检查特定 DOM 元素是否存在。因为启动需要一段时间，我们添加了 `timeout`，并使用了 `eventually.exist`，因为\
  \ `elementByCss` 返回一个 Promise。\n\n*等等！* 我听到你说：我们可以使用 CSS 选择器来定位应用中的元素？为什么我们刚才还要讲那个复杂的\
  \ XPath？\n\n悲伤的答案是：虽然你确实可以确定某些 DOM 元素是否存在于 DOM 中以及更多操作（你可以验证它们的内容等），但有一件关键事情你*做不到*：**触摸**它们。\n\
  \n哦，很多文档会告诉你可以，你也欢迎*尝试*。通常大概如下所示：\n\n```\nreturn util.driver.waitForElementByCss\n\
  (\"main.SearchViewController nav button.menu-icon\") \n.click();\n```\n\n不幸的是，**什么也不会发生**。如果你通过检查另一个元素的可见性来验证\
  \ `click` 是否真正生效，测试最终会失败，因为 `click` 从未发生。如果你运气更好，恭喜你！但对我而言，唯一可靠的交互方法是切换到原生上下文并通过\
  \ XPath 查找目标元素，如下所示：\n\n```\nutil.switchToNativeContext()\n    .waitForElementByXPath\n\
  \    (\"//*[@content-desc|@name='Tap to reveal the sidebar']\")\n    .click()\n\
  \    .then(util.switchToWebViewContext)\n    .waitForElementByCss\n    (\"main.MenuViewController.default-displayed\"\
  , 2000)\n    .isDisplayed().should.eventually.equal(true);\n```\n\n### 注意\n\n如果你只想模拟点击，可以使用\
  \ `.safeExecute()` 在我们应用的上下文中执行任意 JavaScript 代码。例如，我们可以发送一个打开侧边栏的通知。虽然这行得通，但这绝对与用户与设备交互的方式相去甚远：用户不会发送通知，他们会触摸按钮。\n\
  \n混合应用中有两种上下文，每种上下文提供不同的搜索机制。上下文如下：\n\n*   **原生上下文**将应用视为原生应用程序。这意味着我们必须使用 XPath\
  \ 搜索可见层级；但这也意味着我们可以与其他原生控件交互。如果我们测试的插件呈现了原生用户界面，我们也需要为其切换到原生上下文。\n*   另一方面，**Web\
  \ 上下文**指的是 Cordova 用于包装我们应用代码的 WebView。在 Web 上下文中，我们可以通过 CSS 选择器查找元素、执行任意 JavaScript\
  \ 代码等。但我们无法真正*触摸*任何东西。\n\n### 提示\n\n有一种复杂的方法仅使用 CSS 来定位元素并模拟点击；具体细节请查看代码包。不幸的是，在\
  \ iOS 上这会导致测试运行非常缓慢。\n\n我们无法详细介绍可用于自动化的每一种可用方法，但以下是一些你可以在驱动程序或驱动程序找到的元素上执行的非常有用的命令：\n\
  \n*   使用上下文\n\n\n\n\n# Appium API 参考\n\n## 上下文管理\n\n*   `contexts()` 返回一个包含所有可用上下文的数组。原生上下文将包含子字符串\
  \ `NATIVE`，而 WebView 上下文将包含 `WEBVIEW`。除这些之外，完整字符串可以是任何内容，但通常会包含下划线和数字。\n*   `currentContext()`\
  \ 返回一个包含当前上下文的字符串。\n*   `context(someContext)` 切换到指定的上下文，如果未提供值则切换到默认上下文。\n\n##\
  \ 查找元素\n\n*   `elementByXPath(xpath)` 通过指定的 XPath 搜索字符串查找元素。如果需要获取多个元素，请使用复数形式（`elementsByXPath`）。您可以使用\
  \ `hasElementByXPath` 检查元素是否存在。如果您想在元素存在时获取该元素，不存在时获取 `undefined`，可以使用 `elementByXPathIfExists`。\n\
  *   `elementByCss(selector)` 使用指定的 CSS 选择器字符串查找元素。仅当您处于 Web 上下文时有效。如前所述，存在多种变体：`elementsByCss`、`hasElementByCss`\
  \ 和 `elementByCssIfExists`。\n*   `elementByAccessibilityId(id)` 使用指定的辅助功能 ID 查找元素。这在\
  \ Web 上下文中效果不佳，因为我们无法直接设置此值。但当您使用原生控件（例如插件中可能包含的控件）时，它会非常方便。\n\n## 元素属性\n\n*   `clear()`\
  \ 将清除 `textarea` 或 `input` 元素的值。\n*   `isSelected()` 指示元素是否被选中。这用于 `option` 元素或复选框和单选按钮。\n\
  *   `isEnabled()` 指示元素是否已启用。\n*   `isDisplayed()` 指示项目是否显示在屏幕上。\n*   `getComputedCss(property)`\
  \ 返回元素的计算 CSS 属性。\n\n## 浏览器历史记录导航\n\n*   `back()` 将导航到历史记录中的上一页。在测试路由时很有用。\n*  \
  \ `forward()` 将导航到历史记录中的下一页。\n*   `refresh()` 将重新加载当前页面。\n\n## 执行代码\n\n*   `safeExecute(javascriptCode)`\
  \ 在您的应用内执行任意代码。您可以使用它来检查应用的状态，就像您可能在浏览器控制台中手动操作的那样。\n*   `safeEval(expression)`\
  \ 在您的应用内评估任意 JavaScript 表达式并返回结果。\n\n## 触摸交互\n\n*   `shake()` 将模拟设备摇晃。例如，在 iOS 上，这可能用于触发撤销操作。\n\
  *   `click()` 将在元素定位后模拟单击该元素一次。\n*   `scroll(xOffset, yOffset)` 将在指定方向模拟滚动手势。\n\n\
  ## 键盘交互\n\n*   `deviceKeyEvent(keyCodeToSend)` 模拟按下指定的键。您可以使用 `util.wd.SPECIAL_KEYS`\
  \ 来表示特殊键，如 Home 等。完整列表请见 [`github.com/admc/wd/blob/master/lib/special-keys.js`](https://github.com/admc/wd/blob/master/lib/special-keys.js)。\n\
  *   `hideKeyboard()` 隐藏软键盘。\n*   `submit()` 将提交与该元素关联的表单。\n\n## 杂项\n\n*   `setImplicitWaitTimeout(ms)`\
  \ 定义 Appium 在搜索元素时等待的时长\n*   `lock()` 将锁定设备屏幕\n*   `backgroundApp()` 将应用发送到后台\n\
  *   `startActivity({appPackage:, appActivity:})` 可用于在 Android 设备上启动一个 Activity\n\
  *   `openNotifications()` 将打开通知栏，仅限 Android\n*   `takeScreenshot()` 将截取屏幕截图\n\n\
  ## 进阶文档\n\n欲获取更多文档，请参考以下网站：\n\n*   [`appium.io/slate/en/master/?javascript`](http://appium.io/slate/en/master/?javascript)\n\
  *   [`github.com/admc/wd/blob/master/doc/api.md`](https://github.com/admc/wd/blob/master/doc/api.md)\n\
  \n有关自动化测试的更多示例，请参阅本章的代码包。\n\n# 运行测试\n\n现在我们已经定义了测试，如何启动它们？首先，我们需要确保 Appium 正在运行。您应该在一个单独的会话中执行此操作，因为一旦启动，除非您停止服务器，否则无法做其他任何事情：\n\
  \n```\nappium\n```\n\n### 提示\n\n您可以运行 `appium &` 以在 Linux 和 Mac OS X 上将 Appium 放入后台运行。输出仍会在屏幕上生成，因此如果您将其放入后台，可能需要记录输出，如下所示：`appium\
  \ > output.log & 2>&1`。\n\nAppium 启动后，将等待运行自动化测试。如果我们使用模拟器或物理 Android 设备，现在就可以开始这些测试。但是，对于\
  \ iOS，如果在物理设备上测试，我们需要启动 WebKit Proxy（同样，在另一个会话中）：\n\n```\nios_webkit_debug_proxy\
  \ -u <your device's UDID>:27753 -d\n```\n\n对于我们的代码测试，我们将使用 Mocha 来运行测试本身。但是，我们首先需要设置一些环境变量：\n\
  \n```\n### 如果使用 sh 或 bash\nUIA_PROFILE=device-profile UIA_UDID=device-udid UIA_LOGGING=enabled\
  \ UIA_SERVER=local mocha . --require \"babel/register\"\n### 如果使用 fish\nenv UIA_PROFILE=device-profile\
  \ UIA_UDID=device-udid UIA_LOGGING=enabled UIA_SERVER=local mocha . --require \"\
  babel/register\"\n% 在 Windows 上\nset UIA_PROFILE=device-profile\nset UIA_LOGGING=enabled\n\
  set UIA_SERVER=local\nmocha . --require \"babel/register\"\n```\n\n### 提示\n\n这些环境变量是任意的；它们只是我们在\
  \ `test-ui/helpers/util.js` 中使用的变量。\n\n在所有这些环境变量中，只有 `UIA_PROFILE` 是必需的。如果省略 `UIA_LOGGING`，我们的测试脚本将假设不应生成详细日志。如果省略\
  \ `UIA_SERVER`，将假定为 `local`。`UIA_UDID` 仅用于在真实 iOS 设备上测试；否则也可以省略。\n\n因此，如果我们想使用 Android\
  \ 模拟器启动测试，可能会输入以下命令：\n\n```\nUIA_PROFILE=android-5-1-1 UIA_LOGGING=enabled mocha\
  \ ./test-ui/test.js --require \"babel/register\"\n```\n\n如果您开启了日志记录，可能会很快被生成的输出淹没。这对于验证测试的准确性很有用。但是，一旦您确定测试按预期工作，可以禁用日志记录，您将回到典型的\
  \ Mocha 输出：测试列表及其通过或失败的状态。\n\n到目前为止，我们一直使用环境变量和 `mocha` 手动执行测试。如果我们能改用 `gulp` 来执行测试，那不是很好吗？\n\
  \n幸运的是，这真的非常简单。首先，我们需要安装一个集成 Gulp 和 Mocha 的插件：\n\n```\nnpm install --save-dev gulp-mocha@2.1.3\n\
  ```\n\n然后，我们需要在 `gulpfile.js` 顶部添加一行（如果您还没有这样做）：\n\n```\nrequire(\"babel/register\"\
  ); // 在测试中启用 ES2015\n```\n\n我们还需要在 `gulp/config.js` 的 `config` 对象中添加一些配置设置：\n\n\
  ```\nvar config = {\n    …\n    test: {\n        code: \"test/*.js\",\n        ui:\
  \ \"test-ui/*.js\"\n    },\n}\n```\n\n这些配置设置将在我们的测试任务中使用，以指示应将哪些 JavaScript 文件视为测试。请注意，我们的代码测试和\
  \ UI 自动化测试位于不同的目录中。\n\n接下来，我们需要添加一个执行代码测试的新任务。我们称之为 `gulp/tasks/test.js`：\n\n\n\n\
  \n# 使用 Gulp 和 Mocha 进行测试\n\n## 单元测试\n\n```\n\"use strict\";\n\nvar gulp = require(\"\
  gulp\"),\n    notify = require(\"gulp-notify\"),\n    config = require(\"../config\"\
  ),\n    paths = require(\"../utils/paths\"),\n    mocha = require(\"gulp-mocha\"\
  );\n\nfunction test() {\n    return gulp.src(paths.makeFullPath(config.test.code),\
  \ \n                    {read: false})\n               .pipe(mocha({reporter: \"\
  spec\"}))\n               .once(\"error\", notify.onError(\n               \"TEST:\
  \ <%= error.message %>\\n <%= error.stack %>\"))\n               .once(\"error\"\
  , function () {\n                   process.exit(1);\n               })\n      \
  \         .once(\"end\", function () {\n                   process.exit();\n   \
  \            });\n}\n\nmodule.exports = {\n    task: test\n}\n```\n\n这应该相当简单；大部分是错误处理和通知。事实上，`process.exit`\
  \ 方法是为了确保测试能干净地退出。否则，这等同于执行 `mocha . --reporter=spec`。因为我们在 `gulpfile.js` 顶部引入了\
  \ `Babel`，所以所有测试都会自动被 `Babel` 转译。\n\n## UI 自动化测试\n\n我们的自动化测试并不更复杂。唯一的额外代码在于处理环境变量：\n\
  \n```\n\"use strict\";\n\nvar gulp = require(\"gulp\"),\n    gutil = require(\"\
  gulp-util\"),\n    notify = require(\"gulp-notify\"),\n    config = require(\"../config\"\
  ),\n    settings = require(\"../settings\"),\n    paths = require(\"../utils/paths\"\
  ),\n    mocha = require(\"gulp-mocha\");\n\nfunction testUI() {\n    var iosUDID\
  \ = gutil.env.udid;\n    var profile = gutil.env.profile;\n    var server = gutil.env.server\
  \ || \"local\";\n\n    process.env[\"UIA_PROFILE\"] = profile;\n    process.env[\"\
  UIA_SERVER\"] = server;\n    if (settings.VERBOSE) {\n        process.env[\"UIA_LOGGING\"\
  ] = \"enabled\";\n    }\n    if (iosUDID) {\n        process.env[\"UIA_UDID\"] =\
  \ iosUDID;\n    }\n\n    return gulp.src(paths.makeFullPath(config.test.ui), \n\
  \                    {read: false})\n               .pipe(mocha({reporter: \"spec\"\
  }))\n               .on(\"error\", notify.onError(\n                   \"TEST-UI:\
  \ <%= error.message %>\"))\n               .once(\"error\", function () {\n    \
  \               process.exit(1);\n               })\n               .once(\"end\"\
  , function () {\n                   process.exit();\n               });\n}\n\nmodule.exports\
  \ = {\n    deps: [\"build\"],\n    task: testUI,\n}\n```\n\n除了处理环境变量的部分外，唯一的其他变化是使用\
  \ `config.test.ui` 作为指示测试存储位置的配置设置。\n\n### 注意\n\n另请注意，`test-ui` 依赖于 `build` 步骤。我们将其设为依赖，因为测试需要构建好的应用包。如果你想，可以移除该依赖；但你需要记住每次更改时手动重新构建应用。\n\
  \n或者，你可以创建一个设置，允许你在需要时跳过构建步骤（当你只是修改测试代码时这可能很有用）。请查看本书的代码包以获取示例。注意，实际的更改是在 `gulp/tasks/cordova-build.js`\
  \ 中，而不是 `test-ui.js`。\n\n## 运行测试\n\n现在，要运行代码测试，你只需执行以下命令：\n\n```\ngulp test\n```\n\
  \n要运行自动化测试，命令会稍微复杂一些，但也不算太复杂：\n\n```\ngulp test-ui --target=device|emulator --profile=appium-profile\
  \ --udid=ios-udid --verbose=yes|no --server=local|sauce\n```\n\n你的目标应与用于测试的配置文件相匹配。如果你在模拟器上测试，请为目标指定\
  \ `emulator`。如果你在真机上测试，请指定 `device`。`udid` 开关仅在测试物理 iOS 设备时才需要。日志由 `verbose` 控制；如果省略，则不记录日志。`server`\
  \ 也是可选的；如果省略，将默认为 `local`。\n\n没有理由不将这些命令串联起来，让一个 `Gulp` 命令启动所有测试，但我们将其留作练习供你完成。\n\
  \n哇！本章我们处理了很多复杂的内容。我们安装了 `Mocha` 和 `Appium`。我们还介绍了创建代码测试和用户界面自动化测试。最后，我们将流程集成到了\
  \ `Gulp` 中。\n\n在下一章中，我们将深入探讨 `IndexedDB`，它是一个持久化对象存储。我们将用它来存储应用数据。\n"
- "# IndexedDB 概览\n\n## 存储选项\n\n`Cordova` 应用可以使用多种不同类型的持久化存储。你使用哪种存储机制主要取决于应用的存储需求。此外，你的应用不限于单一类型的存储。将用户偏好存储在\
  \ `localStorage` 中，而将较大文件使用 `File API` 存储，这可能最合理。另一方面，`localStorage` 和 `File API`\
  \ 都没有提供存储、检索和搜索结构化数据的简单机制。当然你可以将它们用于这些目的，但你必须自己完成大部分艰苦工作。\n\n两种存储机制来拯救我们，使我们不必重复造轮子。较旧（现已弃用）的标准\
  \ `Web SQL Database` 使用关系数据模型，这类似于 `Oracle`、`PostgreSQL`、`Microsoft SQL` 等数据库。一种名为\
  \ `IndexedDB`（Indexed Database 的缩写）的较新标准使用键-对象存储。这对 `JavaScript` 特别有用，因为我们最常处理对象。因此，持久化这些对象变得非常简单。\n\
  \n`IndexedDB` 和 `Web SQL Database` 都不特定于 `Cordova`；你也可以在桌面浏览器中使用它们。这是一个很好的特性，因为你可以在桌面浏览器上测试应用的存储，从而实现更快的迭代和更容易的调试。如果你为桌面编写过网站应用，也可能重用你的存储代码（以及可能的许多其他代码）。不过有个坑（总是有的！）：`IndexedDB`\
  \ 的支持情况参差不齐；要在不遇到许多痛苦问题的情况下使用它，你可能需要使用 polyfill 或其他封装器。值得庆幸的是，有几个优秀的可用方案。\n\n##\
  \ 章节内容\n\n在本章中，我们将涵盖以下内容：\n\n*   `IndexedDB` 支持和 polyfill\n*   关系型存储与键-对象存储的区别\n\
  *   创建数据库\n*   在数据库中创建对象存储\n*   处理数据库升级\n*   事务\n*   存储对象\n*   获取对象\n*   删除对象\n\
  *   使用游标和索引\n*   关闭数据库\n\n本章主要关注使用 `IndexedDB` 的基础知识。如果你想看真实示例，我们已在本书代码包 `logology-v07/`\
  \ 中的演示应用中实现了 `IndexedDB`。\n\n本章中的几个代码片段也可以通过随书代码包附带的交互式片段演练场使用。启动演练场的说明在代码包中的 `README.md`\
  \ 文件里。启动后，选择 **7: IndexedDB**，然后浏览和尝试示例。在适用的情况下，每个章节和片段都会指示你应选择哪个章节和示例。\n\n## 浏览器支持\n\
  \n在继续之前，讨论 `IndexedDB` 的支持情况很重要。因为它比 `Web SQL Database` 规范更新，所以支持较少。在某些支持它的平台上，它也可能极其受限和/或充满\
  \ bug。\n\n### 注意\n\n有关最新的浏览器支持，请参阅 [`caniuse.com/#feat=indexeddb`](http://caniuse.com/#feat=indexeddb)。\n\
  \n截至撰写时，`IndexedDB` 具有以下移动浏览器支持：\n\n*   **iOS**：iOS 7.x 不支持；iOS 8.x 和 iOS 9.x 行为极其\
  \ buggy\n*   **Android**：4.4 以下版本不支持；Android 4.4 及更高版本完全支持\n\n\n\n\n\n# 桌面端支持与 Polyfill\n\
  \n## 浏览器支持\n\n桌面端的支持情况要好得多；Chrome 和 Firefox 已经支持完整的 `IndexedDB` 实现多个版本了，而 OS X 上的\
  \ Safari 实现存在 Bug（考虑到 iOS 也有 Bug 实现，这不足为奇）。在桌面端，Internet Explorer 自版本 10 起就拥有部分实现。\n\
  \n所有这些意味着，如果你打算支持不同的平台和操作系统版本，你几乎肯定需要一个 polyfill 或封装库，来解决你可能遇到的各种问题。\n\n## 可用的 Polyfill\
  \ 和封装库\n\n有许多不同的选项可供选择：\n\n*   **`IndexedDBShim`** ([`github.com/axemclion/IndexedDBShim`](https://github.com/axemclion/IndexedDBShim))：如果\
  \ `IndexedDB` 不可用，它会使用 `Web SQL Storage`。\n*   **`Cordova-IndexedDB`** ([`github.com/DickvdBrink/cordova-indexeddb`](https://github.com/DickvdBrink/cordova-indexeddb))：它将\
  \ `IndexedDBShim` 封装在一个 Cordova 插件中，以便更简单地安装。\n*   **`Cordova-Plugin-IndexedDB`**\
  \ ([`github.com/MSOpenTech/cordova-plugin-indexedDB`](https://github.com/MSOpenTech/cordova-plugin-indexedDB))：这是另一个封装了\
  \ `IndexedDBShim` 的 Cordova 插件。\n*   **`Treo`** ([`github.com/treojs/treo/`](https://github.com/treojs/treo/))：该模块采用了另一种方法，提供了一个围绕\
  \ `IndexedDB` 的轻量级封装，使用起来稍微容易一些（它支持 Promise、轻松的版本变更等）。如果平台不原生支持 `IndexedDB`，它还可以通过\
  \ `IndexedDBShim` 回退到 `Web SQL Database`。\n\n以上所有选项对于应用程序来说都是完全可行且可接受的（毫无疑问还有其他库也能工作）。前三个完全遵循规范，因此你现有的\
  \ `IndexedDB` 代码无需更改。`Treo` 是规范的一个封装，旨在提供更简单的语法，因此需要少量的代码更改。但正如你将在本章中看到的，为了获得更具可读性的代码，这是值得的。\n\
  \n# 关系型与键-对象存储模型\n\n让我们介绍一下关系型存储模型和键-对象存储模型之间的一些差异，因为虽然这两种存储模型乍看之下似乎相似，但实际上它们截然不同。因此，如果你的部分数据更适合使用关系型模型进行存储和查询，而另一些数据更贴合键-对象模型，你可以选择在应用程序中同时使用两者。\n\
  \n## 关系型存储模型\n\n关系型存储模型简单地描述了在模式层面定义的数据之间的关系。**模式** 描述了数据结构中的字段。在关系型存储模型中，模式通常也被称为表。\n\
  \n表将数据存储为一系列行和列，有点像电子表格，只不过行和列的编号方式不同（例如，电子表格通常用顺序字母命名列，用顺序数字命名行）。关系组件本身描述了一个表中的数据如何与另一个表中的数据相关联。\n\
  \n这类数据库擅长存储高度结构化且与其他数据有大量关系的数据。这些数据库通常还使用 **SQL**（**结构化查询语言**）作为操作和检索数据的语言。你在开发经历中很有可能在某个时刻见过一些\
  \ SQL 代码。话虽如此，既然我们将在下一章更多地介绍关系型存储模型，这里就不深入细节了。\n\n## 键-对象存储模型\n\n键-对象存储模型是另一种存储结构的方式，不过在这里，数据结构本身往往更灵活。每个对象都被存储，并稍后通过唯一标识符进行引用。这个唯一\
  \ ID 可能是自动生成的，也可能是给定对象上一个保证唯一的属性。对象也可以通过其他属性（可能唯一，也可能不唯一）建立索引，以便更轻松地查找对象。\n\n这与关系型模型的关键区别在于，对象存储之间没有描述的关系。从技术上讲，仍然存在\
  \ **模式**（尽管比关系型模型更灵活），因为通常有一些属性是人们期望存在于所有持久化对象上的。除此之外，然而，两个存储之间没有指定的关系。\n\n## 关系处理差异\n\
  \n例如，在关系型存储模型中，`order` 和 `customer` 模式之间的关系直接在数据库中描述。例如，`order` 模式可能有一个 `customer_id`\
  \ 字段，而关系指定该 `customer_id` 字段直接关联到 `customer` 模式（通过 `customer_id` 字段）。这为查询优化和数据一致性提供了强大的机制，并且可以在数据库层面强制执行。\n\
  \n直观上，这种关系型存储模型可能如下所示：\n\n![关系型与键-对象存储的差异](img/9781OS_07_01.jpg`)\n\n显而易见，关系型存储模型虽然高度结构化，但并不总是能随时处理可能到来的任何类型的数据。很多时候，人们会向表中添加“用户”或自定义字段（如上文订单表中所用），以便为特定对象提供自定义数据。当然，随着时间的推移，这会变成开发和管理的噩梦。令人震惊的是，我见过有两百多个字段的数据库，字段名仅用通用列名加数字标记。基于这些数据进行开发和报表几乎是不可能的。\n\
  \n在键-对象存储模型中，关系本身仍然存在：如果我们想根据订单获取客户信息，我们需要根据客户 ID 查找客户。然而，无法在数据库本身中描述这些关系，也没有机制在数据库层面提供查询优化或数据一致性。相反，这些必须在应用层面进行管理。\n\
  \n直观上，键-对象存储模型可能如下所示：\n\n![关系型与键-对象存储的差异](img/9781OS_07_02.jpg`)\n\n## 灵活性与权衡\n\n\
  正如你所见，结构化数据仍在被存储，但存储本身对于接受什么数据可以更灵活。这并不是说关系消失了——完全不是；它们只是现在存在于你的代码中。额外的自定义数据也不会由应用程序自动处理。应用程序必须构建为预期额外数据，并在看到它时理解如何处理。即便如此，存储本身也不会因最初未预料到的额外字段而退缩。\n\
  \n在许多方面，键-对象存储模型比关系型模型简单得多。假设你有一个键或索引，你可以非常快速地找到一个对象。你也可以争辩说，你随后获取相关数据的速度可能比关系型数据库更快，仅仅因为你不必担心复杂的\
  \ SQL 解析，以及大多数关系型数据库为生成高性能查询而进行的各种查询优化。另一方面，你也可以争辩说关系型模型承担的心智和开发成本更低。关系型模型使一次性获取所有相关数据变得非常简单（而不是分一系列步骤），并且大多数关系型数据库都能很好地优化查询（代价是更复杂的内部代码）。\n\
  \n## 选择存储模型\n\n你站在哪一边会因情况而异。两种存储模型都有各自的优缺点。如果你需要高度灵活的数据，关系型数据库可能不是最佳选择，因为你很可能最终不得不将数据存储在大量的二进制或字符大对象中，而查询这些数据很少是件愉快的事。如果你需要编写依赖大量相关数据的非常复杂的查询，你可能会发现关系型模型要简单得多。这实际上取决于你的数据结构。\n\
  \n\n\n\n在我们能够将任何对象存储到数据库之前，首先需要创建数据库。这并不像 `createDatabase` 甚至 `openDatabase` 操作那样简单。由于\
  \ `IndexedDB` 的异步特性，以及各种浏览器和平台都使用过 `IndexedDB` 的带前缀版本，这一过程实际上稍微复杂一些。\n\n### 注意\n\
  \n本节中的代码片段位于本书代码包的 `snippets/07/ex1-create-database/*` 中。使用交互式代码片段演练场时，请选择 **7:\
  \ IndexedDB** 以及从 **1a** 到 **1c** 的示例。\n\n这是一个示例：\n\n```\n// Example Snippet 1a\n\
  // IndexedDB has been prefixed, so we need to get the prefixed \n// version if the\
  \ non-prefixed version is not available. from: \n// https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB\n\
  let indexedDB = window.indexedDB || window.mozIndexedDB ||  \n    window.webkitIndexedDB\
  \ || window.msIndexedDB;  //[1]\n\nfunction openDatabase({name, version, onopen,\
  \ onerror} = {}) { \n  //[2]\n  let req = indexedDB.open(name, version);\n  req.onerror\
  \ = function(evt) {\n    console.log(\"[DB] Encountered an error opening the database:\"\
  , \n                evt.target.error);\n  };\n  req.onsuccess = function(evt) {\n\
  \    let db = this.result; //[3]\n    db.onerror = onerror || function(dbEvent)\
  \ { //[4]\n        console.log(\"[DB] Encountered a database error:\", \n      \
  \              dbEvent.target.error);\n    };\n    onopen(db); //[5]\n  };\n}\n\n\
  function gotADatabase(db) { //[6]\n  console.log(db);\n}\n\nopenDatabase({ //[7]\n\
  \  name: \"StarterDictionary\",\n  version: 1,\n  onopen: gotADatabase});\n```\n\
  \n如果这看起来有点吓人，别担心；它其实没看起来那么糟。部分复杂性仅仅是因为 `IndexedDB` 的所有操作都是异步的，并使用事件来传达每个请求的状态。它有点像没有\
  \ Promise 的 `XMLHttpRequest` 或 File API。\n\n因为浏览器使用过带前缀的版本，我们必须确定浏览器使用哪个属性来表示 `IndexedDB`\
  \ 的接口。这就是我们在前一个示例第一行的 `[1]` 处所做的。值得庆幸的是，如果你使用 `IndexedDBShim`，这个问题就不存在了，这样你就可以始终引用\
  \ `indexedDB`。\n\n`openDatabase` 函数 (`[2]`) 完成了打开数据库的繁重工作。首先，它调用 `indexedDB.open`，这看起来相当不言自明。第一个参数\
  \ `name` 指定数据库名称，`version` 指定版本号。版本号稍后会派上用场。\n\n### 注意\n\n版本必须是非浮点数。`1.3` 或 `\"\
  one\"` 都不行。\n\n`open` 方法返回一个请求对象；在示例中我们称之为 `req`。当请求遇到错误或成功完成时，它会触发相应的事件，所以我们必须为请求附加事件处理程序（分别是\
  \ `onerror` 和 `onsuccess`）。因为 `open` 操作是异步的，我们可以在发出打开数据库的实际请求*之后*分配事件处理程序，因为请求不会立即执行。\n\
  \n当数据库成功打开时，你可以通过将 `this.result` 中的值复制到一个更具描述性的变量名（如 `db`）中来获取对数据库本身的引用，如 `[3]`\
  \ 所示。在示例中，我们紧接着做的下一件事 (`[4]`) 是分配一个全局错误处理程序，它只是将发生的任何错误记录到控制台。（生产应用程序在这里需要更健壮的处理。）一旦我们这样做，就会将数据库引用发送给回调函数\
  \ (`[5]`)。\n\n示例的最后一部分 (`[7]`) 实际演示了 `openDatabase` 函数的用法。我们想要打开或创建一个名为 `StarterDictionary`\
  \ 的数据库；它处于版本 `1`。打开后，它会带着引用调用 `gotADatabase` (`[6]`)。这个函数非常简单；它只是在那一刻将数据库记录到控制台。\n\
  \n这可能不是你想要创建或打开数据库的方式。所以，我们将把它转换为使用 Promise，如下例所示：\n\n```\n// Example Snippet 1b\n\
  let indexedDB = window.indexedDB || window.mozIndexedDB ||\n    window.webkitIndexedDB\
  \ || window.msIndexedDB;\n\nfunction openDatabase({name, version, onerror}) {\n\
  \  return new Promise((resolve, reject) => {\n    let req = indexedDB.open(name,\
  \ version);\n    req.onerror = function(evt) {\n      reject(evt.target.error);\n\
  \    };\n    req.onsuccess = function() {\n      let db = this.result;\n      db.onerror\
  \ = onerror || function(dbEvent) {\n          console.log(\"[DB] Encountered a database\
  \ error:\",\n                      dbEvent.target.error);\n      };\n      resolve(db);\n\
  \    };\n  });\n}\n\nopenDatabase({\n  name: \"StarterDictionary\",\n  version:\
  \ 1\n}).then(db => console.log(db))\n  .catch(err => console.log(\n         \"Encountered\
  \ an error opening the database:\", err));\n```\n\n啊，这好多了。但它远非完美，因为你需要负责用 Promise\
  \ 包装 `IndexedDB`。如果有个库能帮我们做这件事呢？结果真有，它叫 `Treo`。\n\n我们已经提到过 `Treo`，所以你可能想看看我们之前提到的网站。如果我们想把它加到项目中，并添加一个回退到\
  \ Web SQL Database 的方案（以防浏览器不原生支持 `IndexedDB`），我们可以很简单地做到：\n\n```\n$ npm install\
  \ --save treo treo-websql\n```\n\n一旦我们在项目中安装了它，打开或创建数据库就很容易了（尽管我们目前还做不了什么，因为我们没有模式）：\n\
  \n```\n// Example Snippet 1c\nlet treo = require(\"treo\"),\n    promise = require(\"\
  treo/plugins/treo-promise\"),\n    webSQL = require(\"treo-websql\");\n\nlet schema\
  \ = treo.schema()\n                 .version(1);\n\nlet db = treo(\"StarterDictionary\"\
  , schema);\ndb.use(webSQL());  //[1]\n\ndb.use(promise());     //[2]\n\nconsole.log(db);\n\
  ```\n\n这里有几点注意事项：`[1]` 和 `[2]` 处的 `db.use` 命令启用 `Treo` 插件。第一个启用 Web SQL Database\
  \ 作为回退，以防 `IndexedDB` 不被原生支持。第二个启用 Promise 的使用。\n\n### 注意\n\n这两个命令的顺序**非常重要**。自行调换顺序后果自负。\n\
  \n我不知道你怎么想，但我更喜欢这种代码！因此，在本章的其余部分，我们将展示不使用 Promise 或 `Treo` 的*原生*代码，然后展示 `Treo` 版本。如果你想自己在\
  \ `IndexedDB` 周围包装一个 Promise，我就留给你作为练习了。\n\n### 注意\n\n如果你查看代码包中的片段代码，会注意到它不使用 `require`。相反，片段使用这些文件的浏览器版本。你可以用任一方式使用\
  \ `Treo`，但我尽可能喜欢使用 `require` 和 NPM。\n\n到目前为止，我们的数据库什么有用的事也做不了。我们还没有定义任何用于存储对象的模式。让我们在下一节看看如何做到这一点。\n\
  \n到目前为止，我们的数据库无法存储任何东西，因为我们还没有创建对象存储空间。如果你熟悉关系型数据库中的表或模式，这些有些相似。当然，在我们能够将任何对象存储在其中之前，我们必须首先创建一个存放它们的地方。\n\
  \n修改数据库结构的唯一时机是在 `onupgradeneeded` 处理程序中。每当数据库需要升级时就会调用此处理程序，这讲得通，但它在数据库全新时也会被调用。\n\
  \n为了创建对象存储空间，我们需要确定大多数对象预期将拥有的至少一些属性。虽然你可以存储任何种类的、具有任意数量属性的对象，但确实需要一种方法来查找存储空间中的对象，而不必遍历每个存储的对象。\n\
  \n\n\n# 主要查找机制：键\n\n查找对象的主要机制是对象的**键**（`key`）。该键可以是将要存储的所有对象上都存在且在集合中唯一的属性，也可以由数据库本身自动生成。选择哪种方法很重要：没有简单的方法可以切换到另一种方法。\n\
  \n# 索引\n\n对象很少仅通过其键来定位，因此需要其他方式来定位对象。在 IndexedDB 中，这些被称为**索引**（`index`）。索引是对一个或多个对象位置的引用——非常像邮寄地址或定位器。这些索引不必唯一，也不必作为属性存在于存储区中的所有对象上（这些对象只是不会出现在索引中）。对象的键和各种索引相结合，提供了一种快速访问数据的方式，同时保持了极大的灵活性。\n\
  \n# 创建对象存储区\n\n通过在数据库句柄上调用 `createObjectStore` 来创建对象存储区。它至少需要一个参数，但通常你会传递两个：存储区的名称（或模式、表）以及该存储区是将使用特定属性作为键还是使用自动生成的\
  \ ID。\n\n一旦创建了存储区，通过在生成的对象存储区上调用 `createIndex` 来创建额外的索引。这里通常使用三个参数：索引的名称、要索引的对象属性以及任何额外选项（例如值是否必须在索引中唯一）。\n\
  \n除了用于定位对象的键之外，所有索引对于存储的任何对象在技术上都是可选的。此外，对象可以拥有任意数量的额外属性，因此存储区的模式是开放式的。这与典型的关系型数据库截然不同，但这也为存储\
  \ JavaScript 对象提供了强大的功能和灵活性。\n\n# 演示应用 Logology 的对象存储区设想\n\n让我们为演示应用 Logology 想象一个对象存储区。我们需要以一种可以快速检索的方式存储定义。考虑以下模式：\n\
  \n![在数据库中创建对象存储区](img/9781OS_07_03.jpg)\n\n该模式不一定描述定义可能伴随的每个属性，但它代表了我们通常期望在 `definition`\
  \ 对象中找到的内容。第一个字段 `wordNetRef` 标记为 `K`，这只是我们表示该属性是对象存储区键的方式。\n\n## 注\n\n如果你不熟悉 WordNet，它是普林斯顿大学发布的免费英语词典（更多信息请访问\
  \ <http://wordnet.princeton.edu/>）。\n\n每个 WordNet 定义都有一个数据库位置。由于这是唯一的，因此将其用于我们的定义也很合理（我们将从他们的词典获取定义。毕竟是免费的，假设遵守其许可证）。\n\
  \n下一个字段 `lemmas` 是一个数组，表示该定义所适用的单词的基本形式（即非复数化或以其他方式变形或变位）。一个定义可能适用于许多不同的词元；从这个意义上说，这些词元彼此是同义词（考虑\
  \ pop 与 soda）。同样，一个词元可能适用于多个定义（考虑 pop：它是指苏打水、声音，还是可能指某人的父亲？）。\n\n`gloss` 就是定义本身。WordNet\
  \ 的定义非常简短且稀疏，但足以满足我们的目的。人们可以自己编写额外内容或授权其他词典内容。\n\n最后，`partOfSpeech` 表示该词是名词、动词等。\n\
  \n当然，可以想象各种其他属性；例如反义词列表，或者如果定义是关于对象的，则指向图像的链接。关键在于这些不必在对象存储区的模式中指定。\n\n## 注\n\n\
  本节的代码片段位于代码包的 `snippets/07/ex2-create-store/*` 中。使用交互式片段演练场时，选择 **7: IndexedDB**\
  \ 和示例 **2a** 和 **2b**。\n\n考虑到这一点，让我们看一个使用 IndexedDB 创建此存储区的简单示例：\n\n```javascript\n\
  // Example Snippet 2a\nfunction openDatabase({name, version, onopen, onerror, onupgrade}\
  \ \n                      = {}) {\n    let req = indexedDB.open(name, version);\n\
  \    ...\n    req.onupgradeneeded = function(evt) {\n        onupgrade(evt.target.result);\n\
  \    };\n}\n...\nfunction schemaV1(db) {\n    // schema definition has a primary\
  \ key based on property \n    // wordNetRef\n    let definitionStore = db.createObjectStore(\"\
  definition\", \n                             {keyPath: \"wordNetRef\"});\n    definitionStore.createIndex(\"\
  lemmas\", \"lemmas\", \n                               {unique: false, multiEntry:\
  \ true});\n}\n\nopenDatabase({name: \"StarterDictionary\", version: 1,\n       \
  \       onopen: gotADatababase, onupgrade: schemaV1});\n```\n\n请注意，我们没有列出可能存在的每个字段。你只需要包含稍后可能用于访问对象的字段。在我们的例子中，`wordNetRef`\
  \ 和 `lemmas` 属性是查找单词的唯一途径。\n\n## 注\n\n索引可以是唯一的（`unique: true`）或非唯一的（`unique: false`）。此外，如果传递\
  \ `multiEntry: true`，则对应对象属性中的所有项都将添加到索引中。例如，在前面的图片中，`cat` 和 `true cat` 都将在指向同一定义的索引中。\n\
  \n而在 Treo 中，这完全不同（且更容易理解）：\n\n```javascript\n// Example Snippet 2b\nlet schema =\
  \ treo.schema1()\n                 .version(1)\n                 .addStore(\"definition\"\
  , {key: \"wordNetRef\"})\n                 .addIndex(\"lemmas\", \"lemmas\", \n\
  \                           {unique: false, multiEntry:true});\n\nlet db = treo(\"\
  StarterDictionary\", schema);\ndb.use(webSQL());\ndb.use(promise());\n```\n\n正如可能已经显而易见的，IndexedDB\
  \ 数据库带有版本号。每当应用请求的数据库版本比用户实际拥有的版本更新时，将调用 `onupgradeneeded`，以便应用有机会修改数据库。\n\n## 注\n\
  \n本节的代码片段位于代码包的 `snippets/07/ex3-upgrade-database/*` 中。使用交互式片段演练场时，选择 **7: IndexedDB**\
  \ 和示例 **3a** 到 **3b**。\n\n值得庆幸的是，`onupgradeneeded` 会提供数据库的旧版本号和期望的版本号，否则我们将难以决定需要更改什么。有了这些信息，我们可以非常简单地升级数据库。首先，让我们稍微修改\
  \ `openDatabase` 函数如下：\n\n```javascript\n// Example Snippet 3a\nfunction openDatabase({name,\
  \ version, onopen, onerror, onupgrade}) {\n    let req = indexedDB.open(name, version);\n\
  \    req.onerror = function(evt) {\n        console.log(\"[DB] Encountered an error\
  \ opening the database:\" + evt.target.error);\n    };\n    req.onsuccess = function()\
  \ {\n        let db = this.result;\n        db.onerror = onerror || function(dbEvent)\
  \ {\n            console.log(\"[DB] Encountered a database error:\" + dbEvent.target.error);\n\
  \        };\n        onopen(db);\n    };\n    req.onupgradeneeded = function(evt)\
  \ {\n        let oldVersion = evt.oldVersion;\n        // Safari returns a really\
  \ silly value for newly created databases.\n        // From https://github.com/treojs/idb-schema/blob/master/lib/index.js\n\
  \        onupgrade(evt.target.result, oldVersion > 4294967295 ? 0 : oldVersion);\n\
  \    };\n}\n```\n\n我们所做的只是修改 `onupgradeneeded` 事件处理程序以存储旧版本（附加在 `evt` 上），然后将其传递给我们的升级处理程序（在调用\
  \ `openDatabase` 时指定）。如果你想知道 `[1]` 中与那个大数字的比较，是因为 Safari 在数据库刚创建时返回一个荒谬的高数字，而不是像其他浏览器那样返回更合理的\
  \ `0`。\n\n\n\n\n\n# 构建升级函数\n\n现在我们可以构建一个升级函数：\n\n```\n// Example Snippet 3a, continued\n\
  function upgradeDatabase(db, oldVersion) {\n  for (let curVersion = oldVersion;\
  \ curVersion < db.version;\n           curVersion++) {\n    switch (curVersion)\
  \ {\n      case 0:\n        let definitionStore = db.createObjectStore(\"definition\"\
  , {\n            keyPath: \"wordNetRef\"\n          });\n        definitionStore.createIndex(\"\
  lemmas\", \"lemmas\", {\n            unique: false,\n            multiEntry: true\n\
  \          });\n        break;\n      case 1:\n        db.createObjectStore(\"notes\"\
  , {\n            autoIncrement: true\n          });\n        db.createObjectStore(\"\
  favorites\", {\n            autoIncrement: true\n          });\n        break;\n\
  \      default:\n        console.log(\"No upgrade steps available\");\n    }\n \
  \ }\n}\n```\n\n现在，假设我们的应用想要打开数据库的版本 2。如果数据库是新创建的，`oldVersion` 将等于零。因此，`case 0` 和\
  \ `case 1` 都会被执行。如果数据库已经处于第一个版本，则只会执行 `case 1`（因为它是从版本 1 升级到版本 2）。\n\n## Treo 方式\n\
  \n现在，让我们看看 Treo 的方式。到目前为止，你可能已经猜到它要简单得多，确实如此：\n\n```\n// Example Snippet 3b\nlet\
  \ schema = treo.schema()\n                 .version(1)\n                   .addStore(\"\
  definition\", {key: \"wordNetRef\"})\n                   .addIndex(\"lemmas\", \"\
  lemmas\", \n                             {unique: false, multiEntry:true})\n   \
  \             .version(2)\n                  .addStore(\"favorites\", {autoIncrement:\
  \ true})\n                  .addStore(\"notes\", {autoIncrement: true});\nlet db\
  \ = treo(\"StarterDictionary\", schema);\ndb.use(webSQL());\ndb.use(promise());\n\
  ```\n\n如果你留意细节，或者过去做过哪怕简单的版本迁移，你就会知道数据库模式升级很少如此简单。如果你只需要删除一些存储或索引，这相当简单。你可以调用 `deleteObjectStore`\
  \ 和 `deleteIndex`（原生 API）或调用 `dropStore` 和 `dropIndex`（Treo）。另一方面，你的数据可能也需要重组。不幸的是，没有简单的方法可以做到这一点。你需要复制存储中的数据，将其更改到临时存储中，删除并重新创建存储，然后将数据从临时存储复制回去。\n\
  \n# 事务\n\n所有读取或写入对象存储的交互都必须在事务的上下文中执行，事务是一种确保数据一致性的机制。如果事务的任何部分失败，事务期间发生的所有操作都将被恢复。\n\
  \n你可以按如下方式从数据库请求事务：\n\n```\nlet transaction = db.transaction([\"store\", ...], mode);\n\
  ```\n\n`transaction` 的第一个参数是你将在事务中使用的存储列表。你必须预先指定这些存储，才能实际查询或修改其中的数据。\n\n第二个参数是可选的。它指定事务是仅读取数据（`readonly`）还是需要写入数据（`readwrite`）。还有一种\
  \ `versionchange` 模式，可用于更改存储模式，但你应该只在数据库升级期间进行此类操作。如果未提供此参数，将假定为 `readonly`。\n\n\
  事务会生成事件，因此你可以跟踪事务的进展情况。事务可能生成三种事件类型：\n\n*   `error`：事务期间发生错误。除非你采取措施避免，否则事务内的数据更改将自动回滚。你可以通过首先在错误上调用\
  \ `preventDefault`，然后适当处理错误来以不同方式处理错误。\n*   `abort`：事务将被中止，所有更改将被回滚。\n*   `complete`：事务将完成，所有更改将被持久化。\n\
  \n### Tip\n\n非常重要的是要认识到，当你收到 `complete` 事件时，无法保证你保存的任何数据实际上已被持久化。事实上，没有真正的机制可以确保数据已被持久化到存储中。因此，如果数据极其关键，你可能不想使用\
  \ IndexedDB。\n\n一旦你有了事务，就可以通过调用 `objectStore` 并传入存储名称，来获得创建事务时指定的对象存储的访问权限。\n\n\
  如果出于任何原因你需要终止事务，可以调用 `abort()`。但你将丢失事务期间所做的任何更改，因为它们将被回滚。\n\n### Note\n\n事务仅在事务中有待处理的请求时保持活动状态。一旦没有更多请求，事务将变为非活动状态，无法再用于生成请求。\n\
  \n那么，Treo 如何处理事务？非常、非常不同。事实上，如果你只需要获取或存储单个项目，Treo 会自动为你处理事务。如果你需要在单个事务中执行多个操作，Treo\
  \ 提供了一个 `batch` 方法，将在单个事务中执行这些操作。我们稍后会回到这个方法。\n\n# 存储对象\n\n假设你在数据库和事务级别有适当的错误处理程序，存储对象非常简单。你可以跟踪存储的每个对象的事件；但如果你存储大量数据，这很快会让你不堪重负。\n\
  \n### Note\n\n本节中的代码片段位于代码包的 `snippets/07/ex4-store-objects/*` 中。使用交互式代码片段演练场时，选择\
  \ **7: IndexedDB** 和从 **4a** 到 **4b** 的示例。\n\n有两种方法可以存储对象：你可以添加它，也可以放入它。以下是这两种方法的区别：\n\
  \n*   `add`：这将存储一个对象。该对象不得已存在于存储中。该对象必须满足任何唯一键和索引，否则将生成错误。\n*   `put`：如果对象不存在，这将存储该对象；如果对象已存在于存储中，这将更新该对象。该对象必须满足任何唯一键和索引，否则将生成错误。\n\
  \n一旦你有了 `readwrite` 事务，就可以使用上述任一方法来存储对象。让我们看一个例子：\n\n```\n// Example Snippet 4a\n\
  function gotADatabase(db) {\n  // Definitions from WordNet. See wordnet/LICENSE-WordNet.md\
  \ in \n  // code package.\n  let definitions = [\n    {\n      wordNetRef: \"02124272\"\
  ,\n      lemmas: [\"cat\", \"true cat\"],\n      partOfSpeech: \"noun\",\n     \
  \ gloss: \"feline mammal usually having thick soft fur and no ability to roar: domestic\
  \ cats; wildcats\"\n    },\n    {\n      wordNetRef: \"02130460\",\n      lemmas:\
  \ [\"cat\", \"big cat\"],\n      partOfSpeech: \"noun\",\n      gloss: \"any of\
  \ several large cats typically able to roar and living in the wild\"\n    },\n \
  \   {\n      wordNetRef: \"02085443\",\n      lemmas: [\"aardvark\", \"ant bear\"\
  ,\n               \"anteater\", \"Orycteropus afer\"],\n      partOfSpeech: \"noun\"\
  ,\n      gloss: \"nocturnal burrowing mammal of the grasslands of Africa that feeds\
  \ on termites; sole extant representative of the order Tubulidentata\"\n    }\n\
  \  ];\n  let transaction = db.transaction([\"definition\"], \"readwrite\");\n  transaction.onerror\
  \ = function(evt) {\n    console.log(\"[DB] Transaction got an error: \" +\n   \
  \   evt.target.error);\n  };\n  transaction.oncomplete = function() {\n    console.log(\"\
  [DB] All entries added.\");\n  };\n  let definitionStore = transaction.objectStore(\"\
  definition\");\n  definitions.forEach(definition => definitionStore.put(definition));\n\
  }\n```\n\n请注意，即使 IndexedDB 的所有操作都是异步的，我们仍然可以将大量数据作为大部分同步的操作持久化到存储中。它并不是真正的同步。每个存储数据的请求只会被排队，直到可以被处理。数据直到\
  \ `complete` 事件触发后才能真正被检索。\n\n\n\n\n\n## 使用 Treo 添加数据\n\nTreo 也支持添加数据，但仅提供 `put`\
  \ 方法，因为如果试图创建一个已存在的对象，通常不希望报错——相反，大多数开发者希望对象被更新。对于多个对象或操作，Treo 也支持 `batch` 方法。\n\
  \n但首先，需要获取对象存储。这是通过使用对象存储名称调用 `store` 来完成的。然后可以根据需要调用 `put` 或 `batch`。让我们看一个例子：\n\
  \n```javascript\n// 示例代码片段 4b\n// 假设定义与前一个示例相同\nlet definitionStore = db.store(\"\
  definition\");\ndefinitionStore.batch(definitions)\n  .then(() => console.log(\"\
  All entries added\"))\n  .catch((err) => console.log(\"[DB] An error was encountered\
  \ \" + err));\n```\n\n此时，代码量没有实质性的不同，不同之处在于 Treo 允许我们在这种情况下使用 Promise，而不是原生示例中的事件处理机制。\n\
  \n检索之前存储的对象非常容易，前提是你知道键。如果你只知道来自索引的值，事情会变得稍微难一点（虽然也不算太难）。我们稍后会讨论后一种情况。\n\n### 注意\n\
  \n本节中的代码片段位于本书代码包的 `snippets/07/ex5-get-objects/*` 中。使用交互式代码片段演练场时，请选择 **7: IndexedDB**\
  \ 和示例 **5a** 与 **5b**。\n\n## 检索对象\n\n与存储对象一样，你首先需要获取一个事务。然而，因为我们只需要一个只读事务，所以这变得容易得多。请看下面的例子：\n\
  \n```javascript\n// 示例代码片段 5a\nlet req = db.transaction([\"definition\"]).objectStore(\"\
  definition\")\n            .get(\"02124272\");\n```\n\n传递给 `get` 的值是 `wordNetRef`\
  \ 编号，它是对象的键。如果你使用的是自动生成的键，你需要指定它们（当然，你可能不会随手就知道键是什么）。\n\n一旦找到对象，将调用 `success` 事件。事实上，如果指定键不存在对象，也会调用此事件，因此这是一个你需要自行检查的条件。如果发生其他错误，将触发\
  \ `error`。\n\n让我们完成这个例子：\n\n```javascript\n// 示例代码片段 5a，续\nreq.onerror = function\
  \ (evt) {\n  console.log(\"[DB] An error occurred: \", evt.target.error);\n};\n\
  req.onsuccess = function (evt) {\n  let definition = evt.target.result;\n  if (!definition)\
  \ {\n    console.log(\"Couldn't find the desired entry.\");\n  } else {\n    console.log(JSON.stringify(definition,\
  \ null, 2));\n}\n};\n```\n\n当触发 `success` 时，实际对象存储在 `evt.target.result` 中。如果这是 `undefined`，则\
  \ IndexedDB 无法为请求的键找到对象。如果不是 `undefined`，则你可以继续对对象进行任何所需操作，例如将其显示给用户或执行额外计算。\n\n\
  在 Treo 中，过程非常相似：\n\n```javascript\n// 示例代码片段 5b\nlet definitionStore = db.store(\"\
  definition\");\ndefinitionStore.get(\"02124272\")\n  .then((result) => \n    console.log(result\
  \ ? JSON.stringify(result, null, 2)\n                       : \"Couldn't find entry.\"\
  ))\n  .catch((err) => {\n    console.log(\"[DB] An error was encountered \"+ err);\n\
  });\n```\n\n同样，就像原生版本一样，`undefined` 结果意味着找不到该对象。\n\n## 删除对象\n\n删除对象与使用 `get` 检索它们非常相似，只是我们使用\
  \ `delete` 代替。\n\n### 注意\n\n本节中的代码片段位于本书代码包的 `snippets/07/ex6-delete-objects/*`\
  \ 中。使用交互式代码片段演练场时，请选择 **7: IndexedDB** 和示例 **6a** 与 **6b**。\n\n让我们看一个例子：\n\n```javascript\n\
  // 示例代码片段 6a\nlet req = db.transaction([\"definition\"],\"readwrite\").objectStore(\"\
  definition\").delete(\"02124272\");\nreq.onerror = function (evt) {\n  console.log(\"\
  [DB] An error occurred: \", evt.target.error);\n};\nreq.onsuccess = function ()\
  \ {\n  console.log(\"Deleted the entry.\");\n};\n```\n\n重要的是要注意，即使找不到要删除的对象，也会调用\
  \ `success` 事件。如果发生其他错误，将触发 `error`。\n\n让我们看看 Treo 的版本：\n\n```javascript\n// 示例代码片段\
  \ 6b\nlet definitionStore = db.store(\"definition\");\ndefinitionStore.del(\"02124272\"\
  )\n  .then(() => console.log(\"Entry deleted.\"))\n  .catch((err) => {\n    console.log(\"\
  [DB] An error was encountered \"+ err);\n});\n```\n\nTreo 使用 `del` 而不是 `delete`\
  \ 来删除条目，除此之外，它与检索对象非常相似。\n\n## 使用游标和索引\n\n到目前为止，我们只使用存储时的唯一键来检索数据。但我们也可以使用创建的索引来定位对象，而无需知道对象的唯一键。\n\
  \n### 注意\n\n本节中的代码片段位于本书代码包的 `snippets/07/ex7-cursors-indexes/*` 中。使用交互式代码片段演练场时，请选择\
  \ **7: IndexedDB** 和示例 **7a** 与 **7b**。\n\n为此，我们在创建事务后从对象存储请求一个 `index`。一旦拥有索引，我们就可以调用\
  \ `get` 来检索索引中的对象。让我们看一个例子：\n\n```javascript\n// 示例代码片段 7a\nlet req = db.transaction([\"\
  definition\"]).objectStore(\"definition\")\n            .index(\"lemmas\").get(\"\
  cat\");\nreq.onerror = ...;\nreq.onsuccess = function (evt) {\n  let definition\
  \ = evt.target.result;\n  if (definition) {\n    console.log(JSON.stringify(definition,\
  \ null, 2));\n  } else {\n    console.log(\"Couldn't find entry.\");\n  }\n};\n\
  ```\n\n如果你查看几节前的 `definitions` 数组，你会发现一个问题：如果一个索引值对应多个对象怎么办？答案是 `get` 不在乎：它返回找到的第一个。只要索引是唯一的，这没问题；但如果索引不唯一，你将难以检索所有对象。游标是解决此问题的一种方式。它们允许你迭代多个值。你可以通过在索引或对象存储上调用\
  \ `getCursor` 来获取游标。只要你的 `success` 处理程序在游标上调用 `continue`，游标就会为索引或对象存储中的每个项目调用 `success`。例如：\n\
  \n```javascript\n// 示例代码片段 7a，续\nlet req = db.transaction([\"definition\"]).objectStore(\"\
  definition\")\n            .index(\"lemmas\").openCursor();\nreq.onerror = ...;\n\
  req.onsuccess = function (evt) {\n  let cursor = evt.target.result;\n  if (cursor)\
  \ {\n    console.log(`key: ${cursor.key}, value: \n                ${JSON.stringify(cursor.value,\
  \ null, 2)}`);\n    cursor.continue(); // 获取下一个对象\n  } else {\n    console.log(\"\
  No more entries.\");\n  }\n};\n```\n\n前面的示例现在将列出 `lemmas` 索引中每个对象的每个定义。只要有匹配的对象，`cursor`\
  \ 就会被定义。键和值可以通过分别引用 `key` 和 `value` 属性来获取。一旦没有更多项目，`cursor` 将变为 `undefined`。这也意味着如果索引中没有任何条目，`cursor`\
  \ 最初就会是 `undefined`。\n\n虽然迭代索引或存储中的每个项目很有用，但通常这并不是我们想要的。通常，我们需要过滤结果。为此，我们需要创建一个范围来限制结果。\n\
  \n`IDBKeyRange` 提供了几种可用于创建范围的方法。根据你的需求，有几个选项可用：\n\n*   `only(key)`：游标将仅返回与键完全匹配的值。\n\
  *   `lowerBound(key [,exclusive=false])`：游标将返回包括键在内及键之后的所有值。如果 `exclusive` 为 `true`，则键本身将被排除。\n\
  *   `upperBound(key [,exclusive=false])`：游标将返回键及键之前的所有值。如果 `exclusive` 为 `true`，则键本身将被排除。\n\
  *   `bound(lowerKey, upperKey[,lowerExclusive=false [,upperExclusive=false]])`：这是\
  \ `lowerBound` 和 `upperBound` 的组合。\n\n\n\n\n# IndexedDB 游标和 Treo 封装库\n\n## 将 `IDBKeyRange`\
  \ 与 `openCursor` 配合使用\n\n然后可以将返回的范围传递给 `openCursor` 方法，如下所示：\n\n```\nlet IDBKeyRange\
  \ = window.IDBKeyRange || window.webkitIDBKeyRange \n                          \
  \                   || window.msIDBKeyRange;\nlet range = IDBKeyRange.only(\"cat\"\
  );\nlet req = db.transaction([\"definition\"]).objectStore(\"definition\")\n   \
  \               .index(\"lemmas\").openCursor(range);\n```\n\n## 更改游标方向\n\n游标默认按升序迭代。如果你想改变该顺序，也可以做到。例如，以下代码将按降序迭代：\n\
  \n```\nlet req = db.transaction([\"definition\"]).objectStore(\"definition\")\n\
  \            .index(\"lemmas\").openCursor(range, \"prev\");\n```\n\n## Treo 的简化\
  \ API\n\nTreo 完全摒弃了游标的概念，只做你最可能想要的事：返回所有匹配的项。让我们看一个例子：\n\n```\nlet definitionStore\
  \ = db.store(\"definition\");\ndefinitionStore.index(\"lemmas\").get(\"cat\")\n\
  \  .then((result) => \n          console.log(result ? JSON.stringify(result, null,\
  \ 2) \n                             : \"Couldn't find entry.\"))\n  .catch((err)\
  \ => {\n    console.log(\"[DB] An error was encountered \"+ err);\n});\n```\n\n\
  除非索引是唯一的（意味着只能返回一个值），否则将传入一个数组给 `result`。该数组包含索引中所有与 `get` 指定的键匹配的项。\n\n如果你想使用原生\
  \ `IDBKeyRange` 范围，Treo 也支持，但它还支持一种更具表现力且更易读的版本。例如：\n\n```\ndefinitionStore.index(\"\
  lemmas\").get({gte: \"cat\", lt:\"dog\"})...;\n```\n\n这与 `IDBKeyRange.bound(\"cat\"\
  , \"dog\", false, true)` 效果相同。所有匹配 `cat` 及之后的对象都会被返回，但仅限于 `dog` 之前（不包括 `dog`）。\n\
  \n## 关闭数据库\n\n每当应用程序关闭或终止时，数据库会自动为你关闭。如果你对数据库的需求是短暂的，你可能认真考虑手动关闭数据库。如果你发现自己需要为短暂的事务打开大量数据库，也可能需要考虑手动关闭数据库。\n\
  \n你可以通过调用 `close` 来实现。从技术上讲，你可以通过检查返回的请求对象来监控 `close` 操作的状态。但通常没必要这样做。请注意，数据库不会立即关闭；该操作本身仍然是异步的，因此如果你需要立即重新打开数据库，你肯定得添加一个\
  \ `success` 处理程序（或者在使用带有 Promise 的 Treo 时添加 `then` 处理程序）。\n\n# 资源\n\n使用 IndexedDB\
  \ 可以做很多事。本章无法涵盖所有内容。你可能会发现以下资源有用：\n\n*   Mozilla (MDN) 文档（注：它们使用 `errorCode` 和 `stopPropagation`，这是不正确的）\n\
  \    *   [`developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB`](https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB)\n\
  \    *   [`developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API`](https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API)\n\
  *   Microsoft 文档：[`msdn.microsoft.com/en-us/library/ie/hh673548(v=vs.85).aspx`](https://msdn.microsoft.com/en-us/library/ie/hh673548\\\
  (v=vs.85\\).aspx)\n*   W3C 规范：[`www.w3.org/TR/IndexedDB/`](http://www.w3.org/TR/IndexedDB/)\n\
  *   Treo 仓库：[`github.com/alekseykulikov/treo`](https://github.com/alekseykulikov/treo)\n\
  *   浏览器支持：[`caniuse.com/indexeddb`](http://caniuse.com/indexeddb)\n*   另一个封装库（类似\
  \ Treo）叫 Dexie：[`www.dexie.org`](http://www.dexie.org)\n\n# 章节总结与过渡到 Web SQL Database\n\
  \n在本章中，我们介绍了如何创建 IndexedDB 数据库、如何存储和检索对象，以及关系存储机制与键-对象存储机制的区别。在下一章，我们将使用 Web SQL\
  \ Database 探索存储方程的关系方面。\n\n键-对象存储非常有用，但有时我们需要更强大的功能。Web SQL Database 让我们利用 `SQL`（结构化查询语言）以简单高效的方式处理结构化和关系型数据，而\
  \ IndexedDB 通常需要大量编程来合并多个表的结果或执行全文搜索。SQL 只需几行简短的代码就能非常简单地完成这些任务。\n\n正如上一章所述，Web\
  \ SQL Database 使用一种关系数据模型，这类似于 Oracle、PostgreSQL、Microsoft SQL 等数据库。这种关系模型非常适合高度结构化的数据，但不太适合结构灵活的数据。后者不会在数据库模式本身中表达关系，而前者会，因此它还可以在数据库层面而非代码层面强制执行数据完整性。\n\
  \n使用 Web SQL Database 有一个缺点：标准机构基本上已经废弃了该规范。实现 Web SQL Database 的浏览器使用了单一实现：SQLite。标准机构不想将\
  \ SQLite 的 SQL 方言编入规范。也就是说，所有现代 WebKit 浏览器都支持 Web SQL Database，这在桌面端和移动端都是如此。现在有太多网站依赖它，因此尽管它本质上是一个死规范，但短期内不太可能被移除。\n\
  \n既然我们使用 Cordova 构建应用，我们就可以访问平台浏览器对 Web SQL Database 的实现。这确实带来了一些显著限制（特别是存储空间）。因此，我们将使用一个第三方插件，它使用相同的\
  \ API，但使用独立的 SQLite 数据库。这也意味着即使浏览器开始移除其 Web SQL Database 实现，Cordova 依然安全，因为随时可以添加插件来恢复功能。\n\
  \n### 关于 SQLite 的说明\n\nWeb SQL Database 本质上是 SQLite 的一个封装。SQLite 是一种轻量快速的关系数据库实现，在移动设备上有极佳的支持。要了解更多关于\
  \ SQLite 的信息，你可以访问其网站：[`www.sqlite.org`](http://www.sqlite.org)。\n\n# 本章涵盖内容\n\n\
  在本章中，我们将涵盖以下内容：\n\n*   Web SQL Database 支持\n*   Cordova SQLite 插件\n*   创建和打开数据库\n\
  *   使用事务\n*   创建表\n*   插入数据和绑定值\n*   查询数据\n*   删除数据\n*   SQLite 实用工具\n\n# 代码包参考\n\
  \n本章主要关注使用 Web SQL Database 的基础知识。如果你想看真实案例，我们已在本书代码包 `logology-v08/` 中的演示应用里实现了\
  \ Web SQL Database。\n\n本章中的几个代码片段也可通过随书代码包附带的交互式片段演练场使用。启动演练场的说明在代码包的 `README.md`\
  \ 文件中。启动后，选择 `8: Web SQL Database`，然后浏览和尝试示例。适用时，每个章节和片段会指示你应选择哪个章节和示例。\n\n# 浏览器支持\n\
  \n所有现代 WebKit 浏览器都支持 Web SQL Database。这包括 Android 设备上的 Chrome 和 iOS 设备上的 Mobile\
  \ Safari。Android 支持可追溯至 Android 2.1，iOS 支持可追溯至 iOS 3.2。在桌面浏览器上，支持时间甚至更长。\n\n值得注意的是，Internet\
  \ Explorer 和 Firefox 不在支持列表中。这些浏览器仅支持 IndexedDB（IE 仅部分支持）。在它们的桌面版或移动版中均找不到对 Web\
  \ SQL Database 的支持。如果你最终决定以 Windows Phone 或 Firefox OS 为目标平台，你可能需要注意这一点并相应规划。\n\n\
  \n\n# Web SQL 数据库和 Cordova SQLite 存储插件\n\n## 存储限制\n\n当使用浏览器提供的 Web SQL 数据库支持时，我们会受到存储限制的约束。为了确保网站或应用不会占用计算机上的所有空间，浏览器会强制执行数据库大小的配额限制。这通常从\
  \ `5 MB` 开始。大多数浏览器允许扩展至 `50 MB`。\n\n浏览器对 Web SQL 数据库实施的存储限制对移动应用来说是个问题，因为 `5` 甚至\
  \ `50 MB` 可能不足以满足应用的需求。值得庆幸的是，有一种方法可以绕过这一限制，也能绕过该标准已废弃且未来可能从浏览器中移除的事实：使用第三方插件。\n\
  \n## 第三方插件\n\n有几个与 SQLite 交互的第三方插件可用，但我们将使用的这个插件旨在实现与所用规范相同的 API。这意味着，通常情况下，你可以在桌面浏览器和移动浏览器上使用相同的代码。其他一些插件提供截然不同的\
  \ API，这也可以，但不利于跨平台的代码复用。\n\n我们将使用的插件名为 `Cordova SQLite Storage`，可从 <https://github.com/litehelpers/Cordova-sqlite-storage>\
  \ 获取。你可以使用以下命令将其添加到 Cordova 项目中：\n\n```\n$ cordova plugin add io.litehelpers.cordova.sqlite\n\
  ```\n\n### 注意\n\n如果你需要分发预填充的数据库，可以使用该插件的另一个版本，地址为 <https://github.com/litehelpers/cordova-sqlite-ext>。\n\
  \n## 创建和打开数据库\n\n使用 Web SQL 数据库或 Cordova SQLite 存储插件创建和打开数据库很简单，但两者之间有几个差异是你需要注意的。在介绍这些差异之前，让我们先了解一下基础知识。\n\
  \n### 注意\n\n本节的代码片段位于本书代码包中的 `snippets/08/ex1-create-database/`。使用交互式代码片段演练场时，选择\
  \ `8: Web SQL Database` 和示例 `1`。\n\n### Web SQL 数据库语法\n\n使用 Web SQL 数据库时，你可以通过以下方式打开数据库：\n\
  \n```\nlet db = window.openDatabase(name, version, description, quota);\n```\n\n\
  让我们逐一了解这些参数：\n\n*   `name`：这是数据库的文件名。通常以 `.db` 扩展名结尾。此参数为必填。\n*   `version`：Web\
  \ SQL 数据库支持版本化数据库。从技术上讲这是一个字符串参数，所以你可以使用 `1.0` 甚至 `\"one\"`。不过，我的建议是始终使用 `1`，稍后我们会说明原因。\n\
  *   `description`：这是数据库的简短描述，但主要供你自己参考。\n*   `quota`：此参数指定你认为数据库需要多大，单位为字节。通常请求\
  \ `1`、`2` 或 `5` 兆字节。如果以后需要扩大容量，使用更大的 quota 打开数据库将请求额外空间。请记住，quota 只是一个*请求*，而非保证；用户完全可以不授予任何存储权限。\n\
  \n### Cordova SQLite 存储插件语法\n\n使用 Cordova SQLite 存储插件时，首选语法略有不同：\n\n```\nwindow.sqlitePlugin.openDatabase(\n\
  \    {name, location, createFromLocation,\n     androidDatabaseImplementation, androidLockWorkaround});\n\
  ```\n\n差别不小，对吧？*从技术上讲*，你也可以使用第一种语法（只需添加 `sqlitePlugin`），但这已不再是该插件的首选语法。这是因为首选语法支持更多额外功能，而且\
  \ version、description 和 quota 实际上并不受支持，这意味着在使用浏览器实现时，没有理由使用除 `1` 以外的任何值作为数据库版本。\n\
  \n大多数参数都是可选的，但让我们快速过一遍所有参数：\n\n*   `name`：与另一个版本一样，这是数据库的名称。\n*   `location`：这是一个可选参数，指定数据库实际存储的位置。这仅影响\
  \ iOS。位置如下：\n    *   `0`：将数据库存储在 `Documents/` 中；iTunes 可见，且由 iCloud 备份。这也是默认位置。\n\
  \    *   `1`：将数据库存储在 `Library/` 中。由 iCloud 备份，但 iTunes 不可见。\n    *   `2`：将数据库存储在\
  \ `Library/LocalDatabase/` 中。不由 iCloud 备份，iTunes 也不可见。\n*   `createFromLocation`：这允许你随应用分发预填充的数据库。你的\
  \ `www` 文件夹中与之同名的数据库将被复制到最终位置。如果该位置已存在数据库，则不会再次复制。这仅在使用 <https://github.com/litehelpers/cordova-sqlite-ext>\
  \ 处的插件时有效。\n    *   `0`：不使用预填充数据库；创建的数据库将为空\n    *   `1`：使用预填充数据库创建数据库\n*   `androidDatabaseImplementation`：指定\
  \ Android 上应使用哪种 SQLite 实现。默认情况下，插件使用自己的实现而非系统提供的实现，但这偶尔会遇到问题（特别是在使用 Crosswalk 项目或\
  \ Ionic 时）。\n    *   `2`：数据库使用系统 SQLite 实现而非插件自己的实现。为获得最佳兼容性，请使用此设置。\n*   `androidLockWorkaround`：默认情况下未启用，但某些\
  \ Android 版本在意外关闭应用时会出现数据库锁定或数据丢失问题。这仅在 `androidDatabaseImplementation` 为 `2` 时才会发生。\n\
  \    *   `1`：每次事务后关闭数据库。这以性能为代价修复了锁定和数据丢失问题。如果你将 `androidDatabaseImplementation`\
  \ 设为 `2`，最好也包含此设置。\n\n## 抽象差异：WebSQLDB 类\n\n由于标准和插件之间的差异，通常最好将这些差异抽象化。让我们创建一个类来实现这一点：\n\
  \n```\n// 示例片段 \"WebSQLDB 类\"；位于\n// snippets/08/WebSQL/index.js\nclass WebSQLDB\
  \ {\n    constructor({name, version = \"1\", description, \n                 quota\
  \ = (5 * 1024 * 1024),\n                 location = 0, createFromLocation = 0,\n\
  \                 androidDatabaseImplementation = 2,  \n                 androidLockWorkaround\
  \ = 1} = {}) {\n        this.db = null;\n        this.name = name;\n        this.version\
  \ = version;\n        this.description = description;\n        this.quota = quota;\n\
  \        this.plugin = false;\n        this.supportsReadOnlyTransactions = false;\n\
  \n        if (window.sqlitePlugin) {\n            this.plugin = true;\n        \
  \    this.db = window.sqlitePlugin.openDatabase(\n                {name, location,\
  \ createFromLocation,\n                 androidDatabaseImplementation,\n       \
  \          androidLockWorkaround});\n        } else {\n            this.db = window.openDatabase(name,\
  \ version, \n                description, quota);\n        }\n\n        if (!this.db)\
  \ { // [1]\n            throw new Error(\"Could not instantiate a database.\");\n\
  \        }\n\n        if (this.db.readTransaction) { // [2]\n            this.supportsReadOnlyTransactions\
  \ = true;\n        }\n    }\n}\n```\n\n请注意，前面的代码使用了大量默认参数。这些是建议的典型值，将它们设为默认值是合理的。如果你的应用需要不同的默认值，你随时可以将那些值设为默认值。\n\
  \n另外，请注意，我们只需检查返回值 `[1]` 即可判断打开数据库是否成功。如果它未设置为对象，则表示操作失败，我们可以适当地报错。最后几行 `[2]` 只是检查环境是否支持只读事务，我们将在下一节中深入探讨。\n\
  \n### 注意\n\n\n\n\n# Web SQL 数据库：事务与表创建\n\n## 打开数据库\n\n当然，仅仅为了打开数据库而创建一个类有点大材小用。但随着本章的深入，我们将不断增强这个类。\n\
  \n要使用该类打开数据库，可以按如下方式操作：\n\n```\nlet db = new `WebSQLDB`({name: \"test.db\"});\n\
  ```\n\n有了这一个类，我们就抽象掉了标准 Web SQL 数据库和插件版本之间的差异。现在我们有了一个打开的数据库，让我们看看如何与数据库进行交互。\n\n\
  ## 理解事务\n\n在进一步深入之前，我们需要了解 Web SQL 数据库是如何处理事务的。你*可以*在不使用事务的情况下针对数据库执行 SQL 命令，但这并不推荐。使用事务使你有机会在发生错误时回滚你添加、删除或更改的任何数据。通过这种方式，事务有助于维护数据库的一致性。\n\
  \n### 注意\n\n本节中的代码片段位于本书代码包的 `snippets/08/ex2-transactions/` 中。使用交互式代码片段演练场时，请选择\
  \ **8: Web SQL Database** 和示例 **2**。\n\n### 事务方法\n\n通过在数据库对象上调用 `transaction` 即可轻松启动事务，如下所示：\n\
  \n```\ndb.transaction( transactionCallback, error, success )\n```\n\n### 注意\n\n\
  尽管由于使用了回调，乍一看 Web SQL 数据库似乎是异步的，但事实并非如此。IndexedDB 是唯一真正异步的本地存储解决方案。\n\n### 事务参数\n\
  \n从技术上讲，`transaction` 的最后两个参数是可选的；你在网上找到的大多数示例都不会使用它们。即便如此，了解它们的用途也很重要，因此我们将逐一介绍每个参数：\n\
  \n*   `transactionCallback`：这*是*（且*必须是*）一个接受单个参数的回调函数。该参数是一个代表事务的对象。该事务仅在当前 JavaScript\
  \ 执行运行循环中有效。这意味着它在 `setTimeout` 或类似函数中将无效。\n*   `error`：如果在事务处理过程中发生错误，将调用此函数。此时，事务中的任何更改都将被回滚。此参数*不是*必需的。\n\
  *   `success`：当事务成功完成时，将调用此函数。这是可选的，且在大多数示例中很少提供，但它非常重要。只有调用此函数时，我们才能确定事务已成功完成。\n\
  \n最重要的参数是 `transactionCallback`。这必须是一个函数，负责实际执行事务，无论是创建表、添加数据还是查询数据。该函数可以以同步方式针对事务执行任意数量的命令。如果在任何时刻发生错误，更改将被回滚。\n\
  \n默认情况下，`transaction` 方法将假定你正在对数据库进行更改。如果你只是执行 `SELECT` 查询，可以改用 `readTransaction`\
  \ 方法，这将带来更好的性能。虽然大多数浏览器都支持它，但检查该函数是否存在很重要，因为并非所有环境都支持它。\n\n### 事务示例\n\n让我们看一个所有这些如何协同工作的示例：\n\
  \n```\ndb.transaction(\n    (tx) => {\n        console.log(\"in transaction\");\n\
  \        // do queries, etc.\n    },\n    (err) => console.log(`Transaction error:\
  \ ${err}`),\n    () => console.log(\"Transaction completed successfully.\")\n);\n\
  ```\n\n一旦进入 `transactionCallback` 方法，事务就可用于针对数据库运行查询和执行命令。在我们的示例中，我们使用 `tx` 来指代该事务，仅仅是因为它是一个简短的缩写，且更易于输入。\n\
  \n### 提示\n\n如果你熟悉典型的 `success, error` 回调方法模式，请注意此方法将它们的顺序颠倒了。\n\n### Promise 化事务\n\
  \n这还不够理想；如果能配合 Promise 使用该多好？虽然确实可以将 Promise 与 Web SQL 数据库结合使用，但必须在事务本身施加的限制内进行：即它仅在当前特定的\
  \ JavaScript 运行循环中有效。\n\n即便如此，让我们向我们的类添加一个事务方法。它将如下所示：\n\n```\ntransaction(cb, {readOnly\
  \ = false} = {}) {\n    return new Promise((resolve, reject) => {\n        let r;\n\
  \        this.db(readOnly && this.supportsReadOnlyTransactions)\n          ? \"\
  readTransaction\" : \"transaction\" => {\n            try {\n                r =\
  \ cb(transaction);\n            } catch (err) {\n                reject(err);\n\
  \            }\n        }, (err) => reject(err),\n          () => resolve(r));\n\
  \    });\n}\n```\n\n特别重要的是，*Promise 化*版本仍然直接使用事务对象调用事务回调。这是由于 Promise 异步工作，等到下一个\
  \ JavaScript 运行循环到来时，事务将已失效。相反，我们必须立即执行回调，并在事务成功完成时 resolve。这意味着我们的 Promise 化版本并不完美，但它仍然让我们能够编写如下代码：\n\
  \n```\ndb.transaction((tx) => {\n    console.log(\"in promised transaction\");\n\
  \    // do queries, etc...\n}).then(() => console.log(\n              \"Promise\
  \ transaction completed successfully.\"))\n  .catch((err) => console.log(`Promise\
  \ transaction error: \n                               ${err}`));\n```\n\n## 创建表\n\
  \n请注意，我们尚未针对数据库执行任何查询。让我们通过创建一些表来存储有用的数据来纠正这一点。\n\n顾名思义，Web SQL 数据库依赖 SQL 来创建表、存储数据和检索数据。这意味着你基本上需要掌握一门额外的语言才能使用\
  \ Web SQL 数据库；仅靠 JavaScript 是不够的。话虽如此，SQL 很容易上手。即便如此，全面讲解该语言超出了本章的范围。对于 SQLite 版本的\
  \ SQL，[`www.sqlite.org/lang.html`](http://www.sqlite.org/lang.html) 是一个很好的资源。\n\n\
  ### 注意\n\n本节中的代码片段位于本书代码包的 `snippets/08/ex3-create-table/` 中。使用交互式代码片段演练场时，请选择 **8:\
  \ Web SQL Database** 和示例 **3**。\n\n### SQL 语法\n\n创建表相当简单。首先，让我们看看用于创建表的 SQL 语法，然后我们将转到使用\
  \ Web SQL 数据库的 JavaScript 版本。请注意，在我们所有的 SQL 示例中，我们使用的是 SQLite 版本的 SQL：\n\n```\n\
  CREATE TABLE [IF NOT EXISTS] tableName (\n    columnName <TYPE> [<CONSTRAINT>] [,\
  \ ...]\n    [<TABLE CONSTRAINTS>]\n)\n```\n\n### 注意\n\nSQL 关键字不区分大小写。在我们的示例中，关键字通常大写，但没有强制要求必须大写。\n\
  \n### SQLite 类型亲和性\n\n所有 Web SQL 数据库实现所使用的数据库 SQLite，不像大多数 SQL 数据库那样类型是静态的，而是更具动态性（实际上有点像\
  \ JavaScript）。这通常不影响我们编写 SQL 的方式，但认识到这一点很重要，因为这确实意味着 SQLite 在可存储内容方面实际上更灵活。以下是你在\
  \ SQL 中可能看到的各种类型在 SQLite 中将如何处理：\n\n| 常见 SQL 类型 || SQLite 类型亲和性 || 说明 |\n| --- |\
  \ --- | --- | --- |\n| `CHAR, CHARACTER, VARCHAR, VARCHAR2, NCHAR, NVARCHAR, TEXT,\
  \ CLOB` || TEXT || 该列将以文本形式存储数据。数值数据在存储前会被转换为文本表示形式。 |\n| --- | --- | --- | ---\
  \ |\n| `BLOB` || None || 用于存储二进制大对象。由于数据是二进制的，因此分配类型亲和性没有意义。 |\n\n\n\n\n\n## SQLite\
  \ 类型亲和性\n\n| 类型名称 | 亲和性 | 说明 |\n|----------|--------|------|\n| `INT, INTEGER, TINYINT,\
  \ SMALLINT, MEDIUMINT, BIGINT` | `INTEGER` | 如果可能，数值数据将使用整数而非浮点数存储。如果存储的数字超出有符号\
  \ 64 位范围，将使用浮点数表示。 |\n| `REAL, DOUBLE, FLOAT` | `REAL` | 如果可能，数值数据将使用浮点表示。如果数字可用整数存储且这样能节省空间，则会作为整数存储。\
  \ |\n| `NUMERIC, DECIMAL, BOOLEAN, DATE, DATETIME` | `NUMERIC` | 用于存储数值数据。如果插入文本，会先尝试将文本转换为数字。若转换失败，则作为文本存储。\
  \ |\n\n正如你所见，SQLite 在类型存储方面非常灵活。因此，除非纯粹为了自文档化目的，否则*过度显式*地指定预期数据类型意义不大。\n\n## 模式定义\n\
  \n![Creating tables](img/B02066_08_01.jpg)\n\n这里多了一些细节：即每列现在都有类型亲和性。我们还标明哪些字段是主键（`PK`）和哪些是外键（`FK`）。两表之间的连线定义了关系；这里表示一个\
  \ `definition` 可以有多个关联的 `lemmas`。\n\n## 创建 definition 表\n\n以下是定义 `definition` 表的方式：\n\
  \n```\nCREATE TABLE IF NOT EXISTS definition (\n    wordNetRef INTEGER PRIMARY KEY,\n\
  \    partOfSpeech TEXT,\n    gloss TEXT\n)\n```\n\n在此定义中，我们将 `wordNetRef` 字段标记为\
  \ `INTEGER PRIMARY KEY`。这意味着该字段存储的数据为整数（WordNet 引用是整数），且这些值也是表的主键。键只是引用表中数据的一种方式。表的主键为此目的进行了优化；它是你访问数据的*主要*方式。它自动要求在表的所有数据中唯一，并自动创建索引，使使用它的查询非常快。\n\
  \n表的其余部分使用 `TEXT` 类型亲和性。你在 SQL 中常会看到 `VARCHAR2` 或其他字符类型；它们能实现相同的功能。此外，你还常会看到长度规格（如\
  \ `VARCHAR2(255)`）。SQLite 会完全忽略这些。如果你确实有文本长度限制，在表定义中包含这些限制也可以，但 SQLite 实际上不会强制执行此类长度限制。\n\
  \n## 创建 lemmas 表\n\n我们的 `lemmas` 表稍微复杂一些。两个字段被标记为 `PRIMARY KEY`，意味着它们的组合值在表中必须唯一。此外，`wordNetRef`\
  \ 被标记为 `FOREIGN KEY`。外键引用其他表上的键（因此得名），可用于强制执行这些关系。话虽如此，SQLite 默认不强制执行这些关系，但它们从文档角度来看仍然非常有用。\n\
  \n创建此表的语句如下：\n\n```\nCREATE TABLE IF NOT EXISTS lemmas (\n    wordNetRef INTEGER,\n\
  \    lemma TEXT,\n    PRIMARY KEY (wordNetRef, lemma),\n    FOREIGN KEY (wordNetRef)\
  \ REFERENCES definition (wordNetRef)\n)\n```\n\n## `IF NOT EXISTS` 子句\n\n在 SQL 中，尝试创建已存在的表会报错。这有时很有用；也许已存在的表是旧版本，需要重建。但更多时候，我们只希望表不存在时才创建，这正是我们一直在用的\
  \ `IF NOT EXISTS` 子句的作用。有了这个子句，如果表已存在，什么也不会发生，也不会抛出错误；如果表不存在，它们会正常创建。\n\n## `DROP\
  \ TABLE` 命令\n\n这引出了另一面：如果能创建表，如何销毁它们？我们可以使用 `DROP` 命令：\n\n```\nDROP TABLE [IF EXISTS]\
  \ tableName\n```\n\n事实上，只要数据总能重建，你就可以将 `DROP TABLE IF EXISTS` 和 `CREATE TABLE` 语句结合起来，极大地简化事务。当然，如果你需要转换已保存的数据，这远非理想，这也是为什么\
  \ `DROP TABLE` 和 `CREATE TABLE` 在需要时也能产生错误的原因。\n\n## 在应用中使用 `executeSql`\n\n要在应用中使用这些\
  \ SQL 语句，我们需要在事务对象上调用 `executeSql`。该方法接受要使用的 SQL 命令、任何额外的绑定值（稍后介绍）、成功和错误回调，如下所示：\n\
  \n```\ntx.executeSql(sqlStatement, bindVariables, success, error);\n```\n\n除第一个参数外都是可选的，所以当我们不关心从查询获取结果或判断命令是否失败（因为事务错误处理程序会被调用）时，可以用以下方式创建表：\n\
  \n```\ndb.transaction((tx) => {\n    tx.executeSql(\"DROP TABLE IF EXISTS definition\"\
  );\n    tx.executeSql(\"DROP TABLE IF EXISTS lemmas\");\n    tx.executeSql(\"CREATE\
  \ TABLE definition ( wordNetRef INTEGER \n        PRIMARY KEY, partOfSpeech TEXT,\
  \ gloss TEXT)\");\n    tx.executeSql(\"CREATE TABLE lemmas ( wordNetRef INTEGER,\
  \ lemma \n        TEXT, PRIMARY KEY(wordNetRef, lemma) FOREIGN KEY \n        (wordNetRef)\
  \ REFERENCES definition (wordNetRef))\");\n}).then(() => console.log(\"Tables created\
  \ successfully.\"))\n  .catch((err) => console.log(`Error: ${err.message}`));\n\
  ```\n\n### Note\n\n如果事务中有大量语句要执行，最好将它们放入数组并迭代。这样就不用输入一百万次 `tx.executeSql` 了。\n\n\
  ## 封装工具函数 `exec`\n\n如果你或你的团队非常精通 SQL，这很好；但如果你想让代码更像 JavaScript，可能想用一些工具函数包装这些命令。此外，有时直接执行这些命令而不必持续定义事务也很有用（但这仅在整个事务仅为单条命令时才合理）。为此，我们可以在类上定义一个名为\
  \ `exec` 的方法，如下所示：\n\n```\nexec({transaction, sql, binds, readOnly = false} = {})\
  \ {\n    if (!transaction) {\n        return this.transaction((transaction) => {\n\
  \            return this.exec({transaction, sql, binds, readOnly});\n        },\
  \ {readOnly});\n    } else {\n        return transaction.executeSql(sql, binds);\n\
  \    }\n}\n```\n\n这还不是我们使用的完整方法；查询数据时我们会添加更多内容。但现阶段已足够。\n\n此方法实际上是二合一：如果在未建立 `transaction`\
  \ 的情况下调用（未传入 `transaction` 参数），它会自行实例化一个 `transaction` 并返回 Promise。如果已建立并传入了 `transaction`，命令将直接执行。注意，后一种情况下没有\
  \ `success` 或 `error` 处理程序。此时没有 `success` 处理程序，因为我们目前对结果不感兴趣（结果仅在查询时有意义）；没有 `error`\
  \ 处理程序，因为我们将让 `transaction` 错误处理程序处理任何出现的问题。\n\n### Note\n\n你可以指定一个错误处理程序，但该处理程序旨在作为恢复方法。即该方法必须尝试以某种方式纠正遇到的错误，且*必须*返回\
  \ `false`。否则，实际上会再次抛出错误，指示 `error` 处理程序未按预期返回 `false`。\n\n## 添加 `DROP TABLE` 和 `CREATE\
  \ TABLE` 封装\n\n有了这个方法，我们就可以在 `DROP TABLE` 和 `CREATE TABLE SQL` 语句周围添加一些包装器：\n\n\n\
  \n\n\n## 创建和删除表\n\n```javascript\ncreateTable({name, fields = [], constraints =\
  \ [], \n             ifNotExists = true, transaction} = {}) {\n    let fieldSql\
  \ = fields.map((field = []) => \n                               field.join(\" \"\
  )).join(\", \"),\n        constraintSQL = constraints.join(\" \");\n    let sql\
  \ = `CREATE TABLE ${ifNotExists ? \"IF NOT EXISTS\" : \"\"} \n              ${name}\
  \ (${fieldSql} \n              ${constraintSQL!==\"\" ? `, ${constraintSQL}` : \"\
  \"})`;\n    return this.exec({transaction, sql});\n}\n\ndropTable({name, ifExists\
  \ = false, transaction} = {}) {\n    let sql = `DROP TABLE ${ifExists ? \"IF EXISTS\"\
  \ : \"\"} ${name}`;\n    return this.exec({transaction, sql});\n}\n```\n\n此时，我们可以直接调用\
  \ `createTable` 而不传 `transaction` 来创建一个简单的表，也可以先创建一个 `transaction`，然后连续创建多个表，如下所示：\n\
  \n```javascript\ndb.transaction((tx) => {\n  db.dropTable({name: \"definition\"\
  , ifExists: true, \n                transaction: tx});\n  db.dropTable({name: \"\
  lemmas\", ifExists: true, \n                transaction: tx});\n  db.createTable({name:\
  \ \"definition\", ifNotExists: true, \n                  transaction: tx,\n    \
  \              fields: [[\"wordNetRef\",\"INTEGER PRIMARY KEY\"],\n            \
  \               [\"partOfSpeech\", \"TEXT\"],\n                           [\"gloss\"\
  , \"TEXT\"]]});\n  db.createTable({name: \"lemmas\", ifNotExists: true, \n     \
  \             transaction: tx,\n                  fields: [[\"wordNetRef\", \"INTEGER\"\
  ],\n                           [\"lemma\", \"TEXT\"]],\n                  constraints:\
  \ [\"PRIMARY KEY (wordNetRef, lemma)\",\n                                \"FOREIGN\
  \ KEY (wordNetRef) \n                           REFERENCES definition (wordNetRef)\"\
  ]});\n  }).then(() => console.log(\n                    \"Promise Tables created\
  \ successfully.\"))\n  .catch((err) => console.log(`Promise Error: ${err}`));\n\
  ```\n\n注意，这并不一定更短；关键不在于*更短*，而在于更清晰、更易于理解。它仍然需要一些 SQLite 知识（特别是关于主键和外键），但你也不必在代码中嵌入大量冗长的\
  \ SQL 字符串。\n\n现在我们已经创建了一些表，让我们开始在这些表中实际存储一些数据。\n\n在 SQL 中，我们通常使用两条语句来存储数据：`INSERT\
  \ INTO` 和 `UPDATE`。前者用于向表中添加数据，后者用于更新已存在的数据。还有一种变体允许合并数据：不存在的数据会被添加，已存在的数据会被更新。不同的\
  \ SQL 数据库服务器处理方式不同，但 SQLite 使用 `INSERT` OR `REPLACE INTO`。\n\n### Note\n\n本节的代码片段位于代码包的\
  \ `snippets/08/ex4-insert-data/` 目录下。使用交互式代码片段演练场时，选择 **8: Web SQL Database** 和\
  \ Example **4**。\n\n`INSERT INTO` 语句如下所示：\n\n```sql\nINSERT [OR REPLACE] INTO tableName\
  \ (\n    fieldName [, ...]\n    ) VALUES (\n    values [, ...]\n    )\n```\n\n`UPDATE`\
  \ 语句如下所示：\n\n```sql\nUPDATE tableName\n  SET fieldName = value\nWHERE condition\n\
  ```\n\n从很多方面来看，`UPDATE` 语句比 `INSERT INTO` 语句更具可读性，主要是因为后者强制你在脑海中将值映射到字段名。如果像我们一直在做的那样创建一个包装器，这就不会那么痛苦了，所以这是我们建议的路径。否则，冗长的\
  \ `INSERT INTO` 语句会变得非常难以理解。\n\n此外，还有件事你应该注意。如果你要将用户提供的数据插入数据库，必须注意一个称为 SQL 注入的安全问题。\n\
  \nSQL 命令是由字符串构建的，你在我们的包装器中已经看到了不少这方面的内容。如果我们允许不受信任的数据进入这些命令，恶意用户就可能篡改我们的命令，从而更改或破坏数据库。虽然本地数据库不如远程数据库那么关键，但只要有可能，你的代码仍应防范此类攻击。\n\
  \n为此，Web SQL Database 引入了**绑定值**的概念。这些值允许你在 SQL 命令中指定占位符（类似于 ES2015 模板字符串），然后稍后再指定值。这些值永远不会作为\
  \ SQL 命令的一部分被解析，因此它们无法更改命令，也无法更改或删除数据。\n\n让我们快速看看使用绑定值时我们的语句是什么样子的：\n\n```sql\n\
  INSERT INTO definition ( wordNetRef, partOfSpeech, gloss ) \nVALUES ( ?, ?, ? );\n\
  \nUPDATE definition \n   SET partOfSpeech = ? \n WHERE wordNetRef = ?;\n```\n\n\
  上述代码中的问号表示占位符。然后，当我们真正请求数据库执行命令时，也会同时传递这些值。这确保了如果 `gloss` 包含 `;` `DROP TABLE definition`，插入数据时不会真正删除我们的表。\n\
  \n那么，你可能会想，为什么我们在包装器中一直构建字符串而不是使用绑定值呢？原因很简单：绑定值在定义数据库结构的语句中不受支持（这些称为 **DDL** 或数据定义语言语句），所以别无选择，只能构建字符串而不是使用绑定值。为了更安全，应该添加额外的转义方法；但希望你永远不会基于不受信任的数据来构建数据结构。\n\
  \n### Tip\n\n插入、更改或查询数据的语句统称为 **DML** 或数据操作语言语句。所有 DML 语句都接受绑定值。\n\n现在我们有了 SQL 语句，可以使用上一节中使用的相同\
  \ `executeSql` 方法来实际执行它们。这就是我们提供绑定值的时候。例如：\n\n```javascript\nlet definitions = [\n\
  \    {wordNetRef: \"02124272\", partOfSpeech: \"noun\",\n     gloss: \"feline mammal\
  \ usually having thick soft fur and no \n             ability to roar: domestic\
  \ cats; wildcats\"},\n    {wordNetRef: \"02130460\", partOfSpeech: \"noun\",\n \
  \    gloss: \"any of several large cats typically able to roar and \n          \
  \   living in the wild\"},\n    {wordNetRef: \"02085443\", partOfSpeech: \"noun\"\
  ,\n     gloss: \"nocturnal burrowing mammal of the grasslands of \n            \
  \ Africa that feeds on termites; sole extant \n             representative of the\
  \ order Tubulidentata\"}\n];\n\nlet lemmas = [\n    {wordNetRef: \"02124272\", lemma:\
  \ \"cat\"},\n    {wordNetRef: \"02124272\", lemma: \"true cat\"},\n    {wordNetRef:\
  \ \"02130460\", lemma: \"cat\"},\n    {wordNetRef: \"02130460\", lemma: \"big cat\"\
  },\n    {wordNetRef: \"02085443\", lemma: \"aardvark\"},\n    {wordNetRef: \"02085443\"\
  , lemma: \"ant bear\"},\n    {wordNetRef: \"02085443\", lemma: \"anteater\"},\n\
  \    {wordNetRef: \"02085443\", lemma: \"Orycteropus afer\"}\n];\n\ndb.transaction((tx)\
  \ => {\n      let definitionSql = \"INSERT INTO definition ( wordNetRef,       \
  \ \n                        partOfSpeech, gloss ) VALUES ( ?, ?, ? )\";\n      let\
  \ lemmaSql = \"INSERT INTO lemmas ( wordNetRef, lemma ) \n                     \
  \ VALUES ( ?, ? )\";\n      definitions.forEach(({wordNetRef, partOfSpeech, gloss})\
  \ =>\n                          tx.executeSql(definitionSql, \n                \
  \          [wordNetRef, partOfSpeech, gloss]) );\n      lemmas.forEach(({wordNetRef,\
  \ lemma}) => \n          tx.executeSql(lemmaSql, [wordNetRef, lemma]));\n}).then(()\
  \ => console.log(\"Data inserted successfully.\"))\n  .catch((err) => console.log(`Error:\
  \ ${err.message}`));\n```\n\n注意，在前面的代码中，绑定值是以数组形式提供的。与 ES2015 模板字符串不同，绑定值不是按名称指定的，而是按位置指定的。这意味着第一个问号由数组中的第一个值替换，依此类推。\n\
  \n让我们为工具类创建一个该语句的包装器：\n\n\n\n\n\n## `insert` 封装函数\n\n```javascript\ninsert({intoTable,\
  \ data = {}, replace = false, transaction, \n    template = false} = {}) {\n   \
  \ let fieldKeys = Object.keys(data);\n    let fieldNames = fieldKeys.join(\", \"\
  );\n    let fieldBinds = fieldKeys.map(() => \"?\").join(\", \");\n    let binds\
  \ = Object.values(data);\n    let sql = `INSERT ${replace ? \"OR REPLACE\" : \"\"\
  } \n       INTO ${intoTable} (${fieldNames}) VALUES (${fieldBinds})`;\n    return\
  \ template ? sql : this.exec({transaction, sql, binds});\n}\n```\n\n从本质上讲，前一个函数将根据\
  \ `data` 中的属性创建语句的主体。例如，如果我们传递一个 `definition` 对象，字段名将被提取为 `wordNetRef`、`partOfSpeech`\
  \ 和 `gloss`。如果 `template` 为 `false`，SQL 语句和生成的绑定值（从每个属性的值中提取）将被执行。另一方面，如果 `template`\
  \ 为 `true`，它将只返回一个我们可以复用的 SQL 语句。\n\n这是绑定值的另一个好处：我们可以复用 SQL 语句，仅仅是因为我们没有在每条语句中对值进行编码。这对我们的代码和\
  \ SQL 解析器都有巨大的性能提升。我们不必每次都构建 SQL 语句，SQL 解析器也不必每次都对其进行解码。\n\n## 使用封装器\n\n现在我们有了这个封装方法，可以按如下方式重写代码：\n\
  \n```javascript\n[ [\"definition\", definitions],\n  [\"lemmas\", lemmas] ].forEach(\
  \ ([ table, data]) => {\n    let sql;\n    data.forEach((item) => {\n        if\
  \ (!sql) { \n            sql = db.insert({intoTable: table, data: item, \n     \
  \                        template: true}); \n        }\n        db.exec({sql, binds:\
  \ Object.values(item), \n                 transaction: tx});\n    });\n  });\n```\n\
  \n我们将编写处理 `UPDATE` 的封装器留给你，但它不会与 `INSERT INTO` 封装器有太大不同。\n\n## 使用 `SELECT` 检索数据\n\
  \n现在数据已经存入数据库，我们需要一种方法将数据取出。在 SQL 中，这是通过使用 `SELECT` 语句完成的。这是一个非常通用的命令，因此不可能在单个章节中完全涵盖。相反，我们将介绍一些简单的命令，你可以自行进一步探索。\n\
  \n### 注意\n\n本节的代码片段位于本书代码包的 `snippets/08/ex5-select-data/` 中。使用交互式代码片段演练场时，请选择 **8:\
  \ Web SQL Database** 和示例 **5**。\n\n### 提示\n\n`SELECT` 语句的功能远不止这些，但目前这些已足够使用。\n\n\
  ### 基本 `SELECT` 语法\n\n在最简单的情况下，`SELECT` 语句如下所示：\n\n```sql\nSELECT fieldName[, ...]\n\
  \  FROM tableName[, ...]\n[WHERE condition[ ...]]\n[ORDER BY field [direction],\
  \ ...]\n```\n\n如果我们想选择所有定义，可以编写以下命令：\n\n```sql\nSELECT wordNetRef, partOfSpeech,\
  \ gloss\n  FROM definition\n```\n\n正如你所见，`WHERE` 和 `ORDER BY` 完全是可选的。`WHERE` 子句允许我们过滤数据。例如：\n\
  \n```sql\nSELECT wordNetRef, partOfSpeech, gloss\n  FROM definition\nWHERE partOfSpeech\
  \ = ?\n```\n\n如果我们将 `noun` 作为绑定值传递，将只获取名词的定义。你可以在表达式中使用许多运算符。以下是其中一些：\n\n### 运算符\n\
  \n*   `<`, `<=`, `=`, `>=`, `>`, `<>`：这些运算符的行为正如你所期望的那样。如果你倾向于使用 `==` 和 `!=` 分别表示相等和不相等，也是可以的。SQLite\
  \ 以相同方式处理这些运算符。只有一个注意事项：`NULL` 不能使用这些运算符进行比较。\n*   `IS`：要比较 `NULL`，可以使用 `IS`。完整形式为\
  \ `IS NULL` 或 `IS NOT NULL`。\n*   `AND`, `OR`：这些用于将表达式和子句连接在一起。\n*   `NOT`：作为一元\
  \ `NOT` 运算，对后续表达式的结果取反。\n*   `BETWEEN a AND b`：这是 `value >= a AND value <= b` 的一种更简便的写法。\n\
  *   `LIKE`：此运算符充当通配符匹配。`%` 可用于匹配任意数量的字符，下划线可用于匹配单个字符。这些类似于正则表达式，但简单得多。默认情况下，`LIKE`\
  \ 不区分大小写，但仅限于 ASCII 字符集。\n*   `IN (a, b, c, …)`：此运算符将一个值与一组值列表进行比较。\n\n还有许多其他可用的运算符。如需完整说明，请参阅\
  \ [`www.sqlite.org/lang_expr.html`](http://www.sqlite.org/lang_expr.html)。\n\n###\
  \ 使用 `ORDER BY` 排序\n\n指定 `ORDER BY` 子句时，允许我们指定结果集的顺序。你可以指定先按哪些字段排序以及排序方向。例如，`ORDER\
  \ BY wordNetRef ASC` 将按 `wordNetRef` 字段**升序**排列结果。当字段具有数字亲和性时，`ASC` 将按数字升序排序，`DESC`\
  \ 将按数字降序排序。当字段具有文本亲和性时，同样应用这些顺序，但将使用字母顺序。如果未指定排序顺序，则默认为升序。\n\n### 连接表\n\n`SELECT`\
  \ 语句不必仅操作单个表，这可能是 `IndexedDB` 和 `Web SQL Database` 之间最大的区别之一。在 `IndexedDB` 中，由你的\
  \ JavaScript 代码负责合并来自多个模式的结果。在 `Web SQL Database` 中，SQL 本身可以在无需额外 JavaScript 代码的情况下合并值。\n\
  \n在连接多个表时，必须小心。如果我们只是执行 `SELECT * FROM definition, lemmas`，得到的结果会比预期多得多，因为 SQL 并不假设我们想根据主键连接它们。相反，它返回笛卡尔积。一个表中的每一行都将与另一个表中的每一行组合。即使是示例中简短的定义列表，最终也会产生相当多的行。\n\
  \n### 关于选择所有列的注意事项\n\n`*` 可用于 `SELECT` 语句以返回所有字段。通常，你应该避免使用它，而应明确请求你具体需要的数据。这将带来更快的性能。\n\
  \n相反，必须始终指定表如何链接。如果我们想将 `definition` 和 `lemmas` 连接在一起，应编写如下语句：\n\n```sql\nSELECT\
  \ definition.wordNetRef, lemma, partOfSpeech, gloss\n  FROM definition, lemmas\n\
  WHERE definition.wordNetRef = lemmas.wordNetRef\nORDER BY lemma\n```\n\n当列名重复时，SQL\
  \ 要求我们指定列来自哪个表。在前面的例子中，`wordNetRef` 同时存在于 `definition` 和 `lemmas` 中，因此我们可以使用 `definition.wordNetRef`\
  \ 和 `lemmas.wordNetRef` 来指定表。\n\n### 执行 `SELECT` 语句\n\n现在我们有了 SQL 语句，如何实际执行它？同样，我们可以使用\
  \ `executeSql`。但这一次，我们绝对需要一个成功处理程序来检索结果。让我们看看它的样子：\n\n```javascript\nreturn db.transaction((tx)\
  \ => {\n  tx.executeSql(\"SELECT definition.wordNetRef, lemma,\" + \n          \
  \      \"partOfSpeech, gloss FROM definition,\" +\n                \"lemmas WHERE\
  \ definition.wordNetRef = \" +\n                \"lemmas.wordNetRef ORDER BY lemma\"\
  , null,\n  (tx, results) => {\n      let rows = [];\n      for (let i = 0, l = results.rows.length;\
  \ i < l; i++) {\n          rows.push(results.rows.item(i));\n      }\n  })\n});\n\
  ```\n\n大部分看起来很简单，但你可能会想知道为什么我们要获取结果并将它们推入数组。奇怪的是，`Web SQL Database` 的结果并不是以数组形式返回的。相反，必须通过调用\
  \ `rows.item()` 来访问每一行。这可能出于性能原因，但确实使事情变得有点复杂。为了避免我们不断重复此操作，我们可以将此功能添加到我们的 `exec`\
  \ 方法中。让我们按如下方式重写它：\n\n\n\n\n## `exec` 函数\n\n```javascript\nexec({transaction, sql,\
  \ binds, readOnly = false} = {}) {\n    if (!transaction) {\n        return this.transaction((transaction)\
  \ => {\n            return this.exec({transaction, sql, binds, readOnly});\n   \
  \     }, {readOnly});\n    } else {\n        let returnResults = {};\n        transaction.executeSql(sql,\
  \ binds,\n            (transaction, results) => {\n                returnResults.rowsAffected\
  \ = results.rowsAffected;\n                returnResults.rows = [];\n          \
  \      if (results.rows && results.rows.length > 0) {\n                    for (let\
  \ i = 0, l = results.rows.length; \n                         i < l; i++) {\n   \
  \                     returnResults.rows.push(\n                            results.rows.item(i));\n\
  \                    }\n                }\n            });\n        return returnResults;\n\
  \    }\n}\n```\n\n## 简化查询示例\n\n完成此操作后，我们可以将代码简化为如下所示：\n\n```javascript\ndb.exec({sql:\
  \ \"SELECT definition.wordNetRef, lemma, partOfSpeech,\" + \n            \"gloss\
  \ FROM definition, lemmas \" +\n            \"WHERE definition.wordNetRef = lemmas.wordNetRef\
  \ \" +\n            \"ORDER BY lemma\"})\n  .then((r) => { console.log(r); })\n\
  \  .catch((err) => console.log(`Promise Error: ${err.message}`));\n```\n\n## 访问结果集行\n\
  \n结果集中的一行实际上是一个只读的 JavaScript 对象。查询中的每个字段都作为一个属性存在于生成的对象中。如果我们想引用第二行的 `lemma` 字段值，可以使用\
  \ `results.rows.item(2).lemma`（假设不将结果推入数组），或者 `r.rows[2].lemma`（假设将结果推入数组）。如果字段名不是有效的\
  \ JavaScript 属性名，可以使用括号表示法：`r.rows[2][\"lemma\"]`。\n\n## 使用绑定值过滤结果\n\n在进入下一节之前，让我们快速展示一个如何使用绑定值过滤结果的示例：\n\
  \n```javascript\ntx.executeSql(\"SELECT definition.wordNetRef,lemma,partOfSpeech,\"\
  \ +    \n              \"gloss FROM definition, lemmas \" +\n              \"WHERE\
  \ definition.wordNetRef = lemmas.wordNetRef \" +\n              \"AND lemma = ?\
  \ ORDER BY lemma\", [\"cat\"],\n              (tx, results) => { ... });\n// 或者\n\
  db.exec({sql: \"SELECT definition.wordNetRef,lemma,partOfSpeech,\" + \n        \
  \     \"gloss FROM definition, lemmas \" +\n             \"WHERE definition.wordNetRef\
  \ = lemmas.wordNetRef \" + \n             \"ORDER BY lemma\", binds: [\"cat\"]})\n\
  \  .then((r) => { console.log(r); })\n  .catch((err) => console.log(`Promise Error:\
  \ ${err.message}`));\n```\n\n### 注意\n\n我们不会深入讲解我们的 `SELECT` 封装方法的代码。如果你想查看我们的版本，可以通过本书代码包中的片段工具查看该库。\n\
  \n## 删除数据\n\n现在我们已经有了数据并可以查询它，如果我们需要删除它该怎么办？\n\n删除操作其实非常简单。SQL 语句如下：\n\n```sql\n\
  DELETE\n  FROM tableName\n[WHERE condition ...]\n```\n\n这将删除与你提供的条件匹配的所有行，并保留其余行。如果未提供条件，则会删除所有行。\n\
  \n我们不会讲解如何在 JavaScript 中使用此命令；它使用的是你已经熟悉的同一个 `executeSql` 方法。如果你确实想看一些代码，可以查看本书代码包中的示例片段。\n\
  \n## SQLite 数据库工具\n\nSQLite 被用于多个生态系统。因此，有许多优秀的实用程序可用于与 SQLite 数据库交互。其中一些如下：\n\n\
  ### 桌面浏览器工具\n\n*   Chrome 和 Safari 为 Web SQL 数据库提供远程和本地调试支持。功能极其有限，但你可以对数据库执行查询和其他命令。如果你正在远程调试设备，请注意你将无法看到由应用创建的数据库。你必须将其下载到计算机，或者禁用插件并使用平台默认的\
  \ Web SQL 数据库支持。要访问数据库，请打开 **Web Inspector** 并导航到 **Resources** 面板。你应该会看到一个 **Databases**\
  \ 部分，展开它可显示数据库中的表。如果你选择数据库而不是表，也可以对数据库执行命令。\n\n### 跨平台桌面客户端\n\n跨平台桌面客户端可用于检查从设备复制的数据库，或用于创建预填充数据库。\n\
  \n*   DB Browser for SQLite（开源）：<http://sqlitebrowser.org>\n*   SQLite Studio（免费）：<http://sqlitestudio.pl/?act=about>\n\
  *   RazorSQL（商业）：<http://razorsql.com/features/sqlite_gui.html>\n*   Navicat for\
  \ SQLite（商业）：<http://www.navicat.com/products/navicat-for-sqlite>\n*   Valentina\
  \ Studio（免费）：<https://www.valentina-db.com/en/studio-for-sqlite>\n\n## 本章小结\n\n\
  本章涵盖了大量内容。你学习了如何创建和打开数据库、使用事务、创建表、插入和查询数据以及删除数据。\n\n## 下一章：传输文件\n\n在下一章中，我们将学习向远程服务器传输文件以及从远程服务器传输文件。\n\
  \n许多应用不可避免地需要向服务器传输文件或从服务器传输文件。将照片存储在云端的应用需要从用户的应用上传文件。如果用户需要编辑这些文件，则需要再次将它们下载到客户端。虽然可以使用\
  \ `XMLHttpRequest` 或 `Web Sockets` 来实现这一点，但 Cordova 提供了一个专门用于大文件传输的核心插件：“file transfer”插件。\n\
  \n## 本章主题\n\n在本章中，我们将介绍以下内容：\n\n*   配置白名单\n*   从服务器下载文件\n*   在服务器上使用 PHP 接收文件\n\
  *   向服务器上传文件\n*   监控进度\n*   中止传输\n*   安全顾虑\n\n## 使用交互式片段演练场\n\n本章中的几个片段可通过随本书代码包提供的交互式片段演练场使用。启动演练场的说明在代码包中的\
  \ `README.md` 文件中。启动后，选择 **9: Transferring Files**，然后浏览并尝试这些示例。在适用的情况下，每个小节和片段都会指示你应选择哪个章节和示例。\n\
  \n## 配置网络白名单\n\n因为我们将通过网络连接发送和接收数据，所以需要配置网络白名单。通常，Cordova 的示例应用允许与任何主机通信。但通常情况下，除非你有充分的理由允许不受限制的通信（例如，你的应用是一个浏览器），否则你应该主动限制应用可以通信的主机。\n\
  \n## 添加白名单插件\n\n首先你需要的是白名单插件。要使用 Cordova CLI 添加它，可以执行以下操作：\n\n```bash\ncordova plugin\
  \ add cordova-plugin-whitelist\n```\n\n另一方面，既然我们在应用的 `package.json` 中管理插件，我们可以将其添加到\
  \ `plugins` 部分，如下所示：\n\n```json\n...,\n\"plugins\": {\n    ...,\n    \"cordova-plugin-whitelist\"\
  \n}, ...\n```\n\n完成后，我们可以运行 `gulp init` 以使用必要的插件重建 Cordova 项目。\n\n### 提示\n\n从 Cordova\
  \ iOS 和 Cordova Android 的 4.0 版本开始，除非添加了白名单插件，否则所有网络访问都会被拒绝。这与早期版本的每个 Cordova 平台默认授予网络访问权限相比，是一个重大变更。\n\
  \n## 在 `config.xml` 中配置白名单\n\n现在白名单已添加，我们需要对其进行配置。这在我们项目的 `config.xml` 文件中完成（在我们的例子中，它位于\
  \ `src/config.xml` 下）。如果你想授予对任何或所有主机的无限制访问权限，以下片段将实现这一点：\n\n\n\n# Cordova 白名单配置与文件传输插件\n\
  \n## 白名单配置示例\n\n```xml\n<access origin=\"*\" />\n<allow-intent href=\"http://*/*\"\
  \ />\n<allow-intent href=\"https://*/*\" />\n<allow-intent href=\"tel:*\" />\n<allow-intent\
  \ href=\"sms:*\" />\n<allow-intent href=\"mailto:*\" />\n<allow-intent href=\"geo:*\"\
  \ />\n<platform name=\"android\">\n  <allow-intent href=\"market:*\" />\n</platform>\n\
  <platform name=\"ios\">\n  <allow-intent href=\"itms:*\" />\n  <allow-intent href=\"\
  itms-apps:*\" />\n</platform>\n```\n\n## 理解白名单插件\n\n这里实际上有很多内容，特别是如果你不熟悉新的白名单插件的话。让我们来看看其中一些有趣的部分：\n\
  \n*   **`<access>`** 指定我们的应用被允许与之通信的主机。可以有任意数量的此类标签，因此你可以尽可能具体地指定。通配符也可用；在本例中，`*`\
  \ 允许与所有主机通信。\n\n*   **`<allow-intent>`** 指定你的应用被允许触发的意图。意图是一个 URL，它会在用户设备上安装的另一个应用中打开一个\
  \ URL。例如，`http(s)://` 会在用户的网页浏览器中打开，而 `tel://` 会在可用时打开电话拨号器。本节列出的意图相当通用，涵盖了广泛的用例。如果你的应用不需要特定的意图，你应该将其移除。\n\
  \n*   **`<platform>`** 允许我们指示某些设置仅适用于特定平台。例如，`market://` URL 方案仅在 Android 设备上有效，而\
  \ `itms://` 和 `itms-apps://` URL 方案仅在 iOS 设备上有效（这些会打开应用商店）。\n\n## 配置对特定主机的访问\n\n\
  在我们的例子中，假设我们需要通信的服务器是 `www.example.com`。我们可以使用 `<access>` 标签：\n\n```xml\n<access\
  \ origin=\"http://www.example.com\" />\n```\n\n### 注意：安全 HTTP\n\n我们的示例假设通过 HTTP\
  \ 进行数据传输，这并不安全。如果你想使用安全的 HTTP 连接，应该改为指定 `https://`。\n\n如果你可能需要访问该主机的任何子域名，可以按如下方式使用通配符：\n\
  \n```xml\n<access origin=\"http://*.example.com\" />\n```\n\n## 白名单的其他功能\n\n白名单还控制着其他几个功能，你可能会感兴趣（取决于你的需求）。更多信息请参阅\
  \ [`github.com/apache/cordova-plugin-whitelist#network-request-whitelis`](https://github.com/apache/cordova-plugin-whitelist#network-request-whitelis)。\n\
  \n## 文件传输插件与 XHR\n\n一直以来都可以利用 `XMLHttpRequest` 从外部服务器发送和接收内容，这意味着*从技术上讲*你可以完全弃用文件传输插件而改用\
  \ XHR，即使对于大文件也是如此。\n\n虽然可行，但由于以下几个原因，这并不理想：\n\n*   你会受到跨域限制的约束，这可能意味着需要为目标服务器添加\
  \ `CORS` 支持。\n*   接收到的数据实际上并未存储在任何地方；你仍需负责将其写入文件。\n*   除非你使用抽象层，否则需要编写大量样板代码。\n\n\
  另一方面，文件传输插件具有以下优势：\n\n*   它无需你编写额外代码即可从原生文件系统读取和写入。\n*   它不受跨域限制约束；请求由原生代码发起。\n\
  *   操作可以在应用进入后台时完成（注意 iOS 对后台操作持续时间有限制：大约十分钟）。\n\n### 何时使用哪种\n\n那么，何时应该使用文件传输插件而不是\
  \ XHR？这实际上取决于你打算如何处理数据。\n\n*   **使用 XHR** 如果你要下载一个大型 JSON 文件并打算立即解析：你会立即获得数据，而不必编写代码去从文件系统读取文件。\n\
  *   **使用文件传输插件** 如果文件是 SQLite 文件之类。虽然你可以使用 XHR 将响应以二进制格式写入文件系统，但使用文件传输插件要容易得多，也更不容易出错。\n\
  \n简而言之，如果你希望文件以*文件形式*存在于用户设备上，请使用文件传输插件。如果你只需要解析响应中的数据，请使用 XHR。\n\n上传同理：\n*   如果你上传的数据是代码中动态创建的，可以使用\
  \ XHR 将此数据提交给服务器。\n*   如果你需要传输的数据位于文件系统中的文件里，请改用文件传输插件。同样，你可以使用 File 插件读取文件内容然后通过\
  \ XHR 发送，但文件传输插件更简单且不易出错。\n\n### 协议限制\n\n重要的是要注意，文件传输插件仅使用 HTTP(S) 传输数据。也就是说，该插件不会尝试进行\
  \ FTP 或 SFTP 文件传输（或任何其他协议）。有些插件支持此功能，但超出了本章范围。\n\n## 安装文件传输插件\n\n在使用文件传输插件之前，我们需要先安装它。\n\
  \n### 使用 Cordova CLI\n\n```bash\ncordova plugin add cordova-plugin-file-transfer\n\
  ```\n\n### 使用 `package.json`\n\n```json\n...,\n\"plugins\": {\n    ...,\n    \"\
  cordova-plugin-file-transfer\"\n}, ...\n```\n\n然后，我们需要执行 `gulp init` 以使用新插件重新创建\
  \ Cordova 项目。\n\n### 注意：代码片段\n\n本节的代码片段位于本书代码包中的 `snippets/09/ex1-downloading-files`。使用交互式片段演练场时，选择\
  \ **9: Transferring Files** 和示例 **1**。\n\n## 使用文件传输插件\n\n该插件提供了一个 `FileTransfer`\
  \ 类，封装了下载和上传功能。在下载或上传任何文件之前，我们必须创建该类的一个新实例：\n\n```javascript\nlet fileTransfer =\
  \ new FileTransfer();\n```\n\n### 注意：`deviceready` 事件\n\n请记住，直到 `deviceready` 事件触发之前，你无法真正使用\
  \ `FileTransfer`。\n\n获得实例后，你可以调用它提供的 `download` 方法。它接受几个参数：\n\n*   **`url`**：你想要下载的文件的\
  \ URL。你应该使用 `encodeURI` 确保特殊字符被正确编码，否则可能会遇到错误。\n*   **`downloadLocation`**：这是你想要保存文件的位置。这应该是一个\
  \ `cdvfile://` 位置，但也可以是绝对路径。\n    *   如果文件仅临时保存，请保存到 `cdvfile://localhost/temporary`。\n\
  \    *   如果文件永久保存，请保存到 `cdvfile://localhost/persistent`。注意，后者在 iOS 上可能会被 iCloud\
  \ 备份。\n*   **`downloadSuccess`**：文件下载成功时调用此函数。它会传递文件存储位置和生成的 HTTP 响应信息。\n*   **`downloadError`**：下载过程中发生错误时调用此函数。它会传递一个错误对象，指示下载失败的原因（如果可用）。\n\
  *   **`trustAllHosts`**：当为 `true` 时禁用 SSL 证书检查。默认为 `false`，除非有充分理由，否则应避免更改此设置。在生产代码中绝对不要使用\
  \ `true`。\n*   **`options`**：这允许你指定额外选项，例如授权头。\n\n### 下载示例\n\n```javascript\nfunction\
  \ downloadError(err) {\n  console.log(`Encountered a download error: ${JSON.stringify(err,\
  \ null, 2)}`);\n}\n\nfunction downloadSuccess(entry) {\n  console.log(`Download\
  \ completed successfully: ${JSON.stringify(entry, null, 2)}`);\n}\n\nfunction go()\
  \ {\n    let assetURL = encodeURI(\"http://kerrishotts.github.io/Mastering-PhoneGap-Code-Package/index.html\"\
  );\n    let downloadLocation = \"cdvfile://localhost/persistent/index.html\";\n\n\
  \    let fileTransfer = new FileTransfer();\n    fileTransfer.download(assetURL,\
  \ downloadLocation, downloadSuccess, downloadError);\n}\n\ndocument.addEventListener(\"\
  deviceready\", go);\n```\n\n\n\n\n这个例子非常简单：它从 GitHub 下载一个文件（实际上是本书代码包的 HTML 页面），并将其保存到设备的本地文件系统中，文件名为\
  \ `index.html`。文件名可以是你喜欢的任何名称；它不必与原始名称匹配（尽管你应该努力保持相同的扩展名）。此外，它可以保存到子目录中；如果该目录不存在，将会自动创建。\n\
  \n如果发生错误，将调用 `downloadError` 函数。我们的错误处理非常简单；它只是记录 `error` 对象。在生产环境中，你需要做更多的工作来弄清楚问题所在，以及是否有办法绕过它（或向用户显示友好的错误消息）。传入的\
  \ `err` 对象包含以下可能对你有用的信息：\n\n*   `code` 表示错误代码。它可以是以下之一：\n\n    *   `FileTransferError.FILE_NOT_FOUND_ERR`：无法在该下载位置保存文件。\n\
  \    *   `FileTransferError.INVALID_URL_ERR`：源 URL 无效（你是否忘记使用 `encodeURI`？）。\n \
  \   *   `FileTransferError.CONNECTION_ERR`：无法建立连接。有网络连接吗？主机可达吗？如果你使用 SSL，请确保证书未过期，且由受信任的证书颁发机构签名。\n\
  \    *   `FileTransferError.ABORT_ERR`：传输被应用中止。\n    *   `FileTransferError.NOT_MODIFIED_ERR`：自上次请求以来源文件未被修改。如果请求返回\
  \ HTTP 304 代码，就会发生这种情况。\n\n*   `source` 是插件尝试下载的源 URL。\n*   `target` 是下载目标位置。\n\
  *   `http_status` 表示来自服务器的响应代码。这可能是各种代码。但通常以下是典型代码：\n\n    *   `200` (`OK`)：请求成功完成。此时，错误发生在保存文件时，而非服务器端。\n\
  \    *   `304` (`Not Modified`)：请求成功完成，但自上次请求以来文档未更改。\n    *   `401` (`Not Authorized`)：请求未能完成，可能是因为你未通过服务器认证。\n\
  \    *   `403` (`Forbidden`)：请求失败，因为你无权访问该资源。你可能需要请求用户提供凭据。\n    *   `404` (`Not\
  \ Found`)：请求失败，因为未找到资源。\n    *   `500` (`Internal Server Error`)：服务器端出现严重错误。错误消息可能包含额外的有用信息，也可能不包含。\n\
  \n*   `body` 是来自服务器的响应。如果你收到的状态码不是 200，你可能想在这里检查更多信息。\n\n正如你所见，这里有很多错误处理的机会。至少，你会想向用户显示一条无法下载文件的通知；但你可以利用传入的\
  \ `error` 对象中提供的信息，为用户定制消息。\n\n如果下载成功完成，将调用 `downloadSuccess` 函数。同样，我们的处理程序非常简单；它只是记录\
  \ `file` 条目（表示文件在文件系统中的存储位置）。在生产应用中，此时你将继续处理该文件；调用此方法时，你可以确信文件已存在于文件系统中。如果你需要使用\
  \ File API 进行额外处理，可以通过传入的 `file` 条目来实现。\n\n如果你需要为受保护的资源提供凭据，可以按如下方式操作：\n\n```javascript\n\
  let fileTransfer = new FileTransfer();\nlet username = \"testuser\";\nlet password\
  \ = \"password\";\nlet options = {\n    headers: {\n        \"Authorization\": `Basic\
  \ ${btoa(`${username}:${password}`)}`\n    }\n}\nfileTransfer.download(assetURL,\
  \ downloadLocation, downloadSuccess, downloadError, false, options);\n```\n\n###\
  \ 提示\n\n如果你要发送凭据，请确保使用 SSL 来保护通信安全。\n\n## 上传文件\n\n在将文件上传到服务器之前，我们需要服务器上有能够接收和处理文件的程序。至少，此过程会将文件写入服务器上的特定位置，但通常还有更多工作要做。通常，会检查请求以确保没有可疑行为（例如文件过大或类型错误）。然后，文件几乎总是会被重命名以防止命名冲突。之后，就由你决定了：你可以对文件运行病毒扫描、调整大小（如果是图片）、上传到后端数据库、发送到另一台服务器，等等。\n\
  \n### 注意\n\n本节的代码片段位于本书代码包的 `snippets/09/ex2-uploading-files` 中。使用交互式代码片段演练场时，请选择\
  \ **9: Transferring Files** 和示例 **2**。\n\n我们迄今为止使用的 File Transfer 插件使用 multipart\
  \ HTTP `POST` 请求上传数据，这非常有用。这意味着我们可以使用与从网站用户请求文件相同的方法，这通常涉及 HTML 表单上的 `<input type=\"\
  file\" />` 控件和一个处理结果的 PHP 脚本。在我们的例子中，我们不需要 HTML 表单；是我们的应用在执行上传，而不是用户，所以我们可以直接调用\
  \ PHP 脚本。\n\n### 注意\n\n如果你已经有了这样的系统，可以跳过本节。另外请注意，虽然本节使用 PHP，但这些概念适用于任何服务端语言。\n\n\
  让我们开始构建 PHP 脚本。我们将其命名为 `upload.php`。在顶部，我们将放置稍后要用到的一些配置设置：\n\n```php\n<?php\n$maximumFileSize\
  \ = 5 * 1024 * 1024;\n$uploadLocation = \"../upload/\";\n$validMimeTypes = array(\"\
  text/plain\", \"text/html\", \"image/png\", \"image/jpeg\");\n```\n\n虽然你可以在 `php.ini`\
  \ 设置中限制服务器上的最大文件大小，但最好不要假设这些设置就是你想要的。因此，在上传脚本中检查文件大小也是个好主意。但要记住，这里在 `$maximumFileSize`\
  \ 中指定的任何大小都不会覆盖你的 `php.ini` 设置，所以你需要确保 `post_max_size` 和 `upload_max_filesize` 设置足够大，能够接受\
  \ `$maximumFileSize` 字节的文件。\n\n上传位置完全取决于你和你的服务器配置。有效的 MIME 类型也由你决定；这些将允许你过滤掉非预期格式的文件。当然，既然我们的应用将是上传文件的客户端，理想情况下应用永远不会发送错误类型的文件，但多检查一下总无妨。此外，你的应用可能不是上传脚本的唯一客户端，所以你需要处理应用可能不是发送数据的一方的情况。\n\
  \nPHP 自动将有关正在上传文件的信息放入一个名为 `$_FILES` 的全局变量中。我们可以使用它来提取所需信息：\n\n```php\n$uploadedFile\
  \ = $_FILES['file'];\n$uploadedFileError = $uploadedFile['error'];\n$uploadedFileSize\
  \ = $uploadedFile['size'];\n$uploadedFileType = $uploadedFile['type'];\n$uploadedFilePath\
  \ = $uploadedFile['tmp_name'];\n```\n\n一个重要的注意事项是，`$_FILES` 上的 `file` 索引是文件键。如果你有一个\
  \ HTML 表单，它将匹配你的文件输入元素的 `name`。我们将其称为“文件键”：\n\n```html\n<form enctype=\"multipart/form-data\"\
  \ method=\"POST\">\n    <input type=\"file\" name=\"file\" />\n</form>\n```\n\n\
  接下来，我们将用 `try…catch` 语句包装我们所做的一切。如果出现问题，这将让我们返回适当的错误（否则我们可能会在错误条件下返回 200）：\n\n\n\
  \n\n```\ntry {\n    // everything else we do in this section will be in this\n \
  \   // try section\n} catch (RuntimeException $err) {\n    // generate a 500 server\
  \ error\n    http_response_code(500);\n    // and give some error information\n\
  \    echo $err->getMessage();\n}\n?>\n```\n\n所有这些代码的作用是确保遇到错误时返回 500 错误代码。我们还会返回错误原因，以便客户端理解上传请求失败的原因。\n\
  \n有了这个基础，我们需要开始检查错误条件。拒绝文件上传有几个原因：\n\n*   请求畸形或损坏\n*   未提供文件或提供了过多文件（此脚本一次只处理一个文件）\n\
  *   文件过大\n*   上传耗时过长\n*   文件类型错误\n*   服务器保存文件时遇到问题（空间不足、上传路径无效等）\n\n### 注意\n\n本节错误检查代码基于\
  \ [`php.net/manual/en/features.file-upload.php#114004`](http://php.net/manual/en/features.file-upload.php#114004)。\n\
  \n考虑到这一点，让我们开始检查这些错误条件。我们可以按如下方式检查请求是否畸形或提供了过多文件：\n\n```\nif(!isset($uploadedFileError)\
  \ || is_array($uploadedFileError)) {\n    throw new RuntimeException(\"Invalid arguments\"\
  );\n}\n```\n\n在 PHP 中，所有文件上传都会设置错误条件，*即使文件已成功上传*。我们可以检查该条件是否存在，以验证是否有人试图发送畸形或损坏的请求。如果错误条件不存在，我们可以立即停止处理。如果有多个错误条件（是一个数组），则说明发送了多个文件；我们也可以报错。\n\
  \n接下来，我们检查错误条件本身。它会告诉我们文件是否上传正确、是否未发送文件，或文件是否大于服务器设置允许的大小：\n\n```\nswitch($uploadedFileError)\
  \ {\n    case UPLOAD_ERR_OK:\n        break;\n    case UPLOAD_ERR_NO_FILE:\n   \
  \     throw new RuntimeException(\"No file sent\");\n        break;\n    case UPLOAD_ERR_INI_SIZE:\n\
  \    case UPLOAD_ERR_FORM_SIZE:\n        throw new RuntimeException(\"File too large\"\
  );\n        break;\n    default:\n        throw new RuntimeException(\"Unknown error\"\
  );\n}\n```\n\n注意，除了错误为 `UPLOAD_ERR_OK` 的情况外，每个 `case` 都会抛出 `RuntimeException`。后一种情况意味着服务器正确接收了文件，我们可以继续处理。对于任何其他情况，我们都应立即停止并报错。\n\
  \n仅因为我们已根据服务器设置检查了文件大小，并不意味着它不大于我们实际想要接受的大小。此代码片段将上传文件的大小与 `$maximumFileSize` 进行对比：\n\
  \n```\nif ($uploadedFileSize > $maximumFileSize) {\n    throw new RuntimeException(\"\
  File too large\");\n}\n```\n\n除非你运行的服务器可以接受所有类型的文件，否则你很可能想要检查文件类型。我们可以只检查 `$uploadedFileType`，但这是客户端发送的信息，可能不准确或不正确。相反，我们还应根据文件系统的信息检查文件类型。此代码片段正是如此：\n\
  \n```\n$finfo = finfo_open(FILEINFO_MIME_TYPE);\n$actualFileType = finfo_file($finfo,\
  \ $uploadedFilePath);\n\nif (!in_array($uploadedFileType, $validMimeTypes) ||\n\
  \    !in_array($actualFileType, $validMimeTypes)) {\n    throw new RuntimeException(\"\
  File format isn't valid\");\n}\n```\n\n前面的代码片段将检查客户端指定的文件类型和服务器认为的文件类型是否在 `$validMimeTypes`\
  \ 列表中。如果不在，脚本将报错并拒绝保存文件。\n\n这满足了前面提到的大多数错误条件。现在，是时候将文件保存到所需的上传位置了。但首先，我们应该重命名文件使其具有唯一名称，否则可能会覆盖他人上传的文件：\n\
  \n```\n$newFileName = \"upload_\" . uniqid();\n```\n\n`uniqid` 是 PHP 中的一个函数，根据当前时间返回字符串。这意味着名称实际上可能不唯一；但假设服务器时间从不更改，这对我们的目的已足够。当然，你可以使用任何重命名方案（关于\
  \ `uniqid` 的唯一性详见 [`stackoverflow.com/questions/4070110/how-unique-is-uniqid`](http://stackoverflow.com/questions/4070110/how-unique-is-uniqid)）。\n\
  \n现在我们有了唯一的文件名，可以尝试保存文件：\n\n```\nif (move_uploaded_file($uploadedFilePath, $uploadLocation\
  \ . $newFileName)) {\n    echo \"File uploaded successfully!\";\n} else {\n    throw\
  \ new RuntimeException(\"File failed to upload (\" . error_get_last() . \")\");\n\
  }\n```\n\n敏锐的读者会注意到，从技术上讲，如果我们执行到这一步，服务器已经接受了文件；它只是位于 `$uploadedFilePath` 指示的临时位置。`move_uploaded_file`\
  \ 是 PHP 函数，只是将文件从临时位置移动到更永久的位置。\n\n如果移动失败，我们将抛出另一个错误及失败原因。此时可能是严重问题。也许接受上传的卷空间不足，或我们尝试存储文件的位置不存在。\n\
  \n如果移动成功，我们将返回成功消息。PHP 默认也会返回 200 状态代码。\n\n仅有脚本还不够。你需要一台能运行 PHP 脚本的服务器。这超出了本书范围，但如果你想要一个非常简单的测试环境来测试\
  \ PHP 脚本，可以使用 Cloud9 ([`c9.io`](https://c9.io))，它提供云端完整开发环境并支持 PHP。事实上，你可以在我的公共工作区查看此示例（假设你有\
  \ Cloud9 账户）：[`ide.c9.io/kerrishotts/mastering-phonegap-ch8-server`](https://ide.c9.io/kerrishotts/mastering-phonegap-ch8-server)。Cloud9\
  \ 不适用于持续运行的服务器，但非常适合开发用途，特别是公共项目可免费使用（最多一个私有项目也免费）。\n\n现在我们有了一个在服务器上等待上传内容的脚本，可以使用\
  \ File Transfer 插件进行上传。正如你所料，我们将调用 `upload` 而不是 `download`。这需要设置一些选项，所以不像调用 `download`\
  \ 那么简单。\n\n`upload` 接受以下参数：\n\n*   `fileToUpload`：指示存储在本地设备上要上传的文件。使用 `cdvfile://`\
  \ 文件路径。\n*   `uploadURL`：上传脚本的 URL。应通过 `encodeURI` 传递。\n*   `uploadSuccess`：上传成功时调用。\n\
  *   `uploadError`：上传未成功完成时调用。\n*   `options`：至少指定文件键、名称和 MIME 类型。还可提供参数、标头和其他有用设置。这是\
  \ `FileUploadOptions` 的实例。\n\n### 注意\n\n本节代码片段位于代码包的 `snippets/09/ex2-uploading-files`\
  \ 中。使用交互式代码片段演练场时，选择 **9: Transferring Files** 和示例 **2**。\n\n让我们看一个示例：\n\n\n\n\n\
  ## 文件上传基础示例\n\n```\nfunction uploadError(err) {\n    console.log(`Encountered an\
  \ upload error: ${JSON.stringify(err, null, 2)}`);\n}\n\nfunction uploadSuccess(r)\
  \ {\n    console.log(`Upload completed successfully: ${JSON.stringify(r, null, 2)}`);\n\
  }\n\nfunction doUpload() {\n    let fileToUpload = \n                    \"cdvfile://localhost/persistent/index.html\"\
  ;\n    let uploadURL = encodeURI(\n                            \"https://your.server.com/upload.php\"\
  );\n\n    let options = new FileUploadOptions();\n    options.fileKey = \"file\"\
  ;\n    options.fileName = \"index.html\";\n    options.mimeType = \"text/html\"\
  ;\n\n    let fileTransfer = new FileTransfer();\n    fileTransfer.upload(fileToUpload,\
  \ uploadURL, uploadSuccess, \n                        uploadError, options);\n}\n\
  ```\n\n这里指定的 `options` 是最低要求。我们必须指定文件键、文件名和文件类型。后两者更接近建议：我们的脚本无论如何都会重命名文件（以确保没有命名冲突），也不假设我们关于\
  \ MIME 类型的陈述是真实的。\n\n注意我们为 `options.fileKey` 指定了文件。这与我们设想的输入元素上的 `name=\"file\"\
  ` 属性匹配，也是 PHP 脚本用来索引 `$_FILES` 的方式。如果这不正确，上传将会失败。\n\n如果上传遇到错误，将调用 `uploadError`。它将具有与传递给\
  \ `downloadError` 的错误对象相同的结构。\n\n如果上传成功完成，将调用 `uploadSuccess`，并传入一个包含上传数据的对象。你不必对它做太多处理；它只是让你检查服务器发送的响应。在\
  \ Android 上，你还可以检查发送的字节数，但 iOS 不支持此功能，因此你无法用它来判断浏览器是否发送了你预期的字节数。\n\n你可以指定其他有用的选项：\n\
  \n*   `httpMethod`：更改上传文件所用的方法。默认为 `POST`，但如果需要可以改为 `PUT`。\n*   `chunkedMode`：默认情况下，文件分块上传，这允许原生代码优化文件传输方式（尤其是大文件）。如果需要禁用分块上传，将其设为\
  \ `false`。\n*   `headers`：你可能需要发送认证信息或其他头部。可以通过在 `headers` 对象中发送该信息来实现。\n\n下面是一个稍微复杂的示例，使用了前面提到的选项：\n\
  \n```\nlet options = new FileUploadOptions();\noptions.fileKey = \"file\";\noptions.fileName\
  \ = \"index.html\";\noptions.mimeType = \"text/html\";\noptions.chunkedMode = false;\n\
  options.httpMethod = \"PUT\";\noptions.headers = {\n    \"Authorization\": `Basic\
  \ ${btoa(`${username}:${password}`)}`\n}\n\nlet fileTransfer = new FileTransfer();\n\
  fileTransfer.upload(fileToUpload, uploadURL, uploadSuccess, \n                 \
  \   uploadError, options);\n```\n\n### 注意\n\n从技术上讲，`upload` 支持 `trustAllHosts` 作为第六个参数。其工作方式与下载时的\
  \ `trustAllHosts` 相同，但除非你真的必须接受自签名证书，否则应避免将其设为 `true`。在生产代码中绝不应这样做。\n\n## 上传/下载进度监听\n\
  \n只要下载或上传的是小文件，用户不太可能注意到操作耗时。但一旦传输中等大小的文件，耗时就会变得明显。因此，你需要一种方式向用户传达进度。\n\n*如何* 实现完全取决于你。你可以只显示一个加载指示器，也可以显示某种进度条。但在此之前，我们必须监听操作的进度更新。\n\
  \n### 注意\n\n本节代码片段位于代码包的 `snippets/09/ex3-progress`。使用交互式片段演练场时，选择 **9: Transferring\
  \ Files** 和示例 **3**。\n\n注册接收进度更新非常简单。创建 `FileTransfer` 实例后，可以为 `onprogress` 属性分配一个处理程序，如下所示：\n\
  \n```\nfunction reportProgress(progressEvent) {\n  // 我们将在下面添加此函数的内容。\n}\n\nlet\
  \ fileTransfer = new FileTransfer();\nfileTransfer.onprogress = reportProgress;\n\
  ```\n\n`reportProgress` 接收的 `progressEvent` 有一些有用的属性：\n\n*   `lengthComputable`：如果为\
  \ `true`，则可以计算操作的长度。并非所有服务器都返回下载大小，所以这不总是可用。\n*   `total`：如果可以计算长度，这是操作的总大小。\n*\
  \   `loaded`：已下载（或上传）的数据量。\n\n如果 `lengthComputable` 为 true，则可以通过用 `loaded` 除以 `total`\
  \ 来确定操作完成的百分比：\n\n```\nlet pctComplete;\nif (progressEvent.lengthComputable) {\n\
  \    pctComplete = progressEvent.loaded / progressEvent.total;\n}\n```\n\n### 注意\n\
  \n此时，`pctComplete` 是 0 到 1 之间的数字。如果想要典型的 0-100 范围，可以乘以 100。\n\n假设 DOM 中有一个 `progress`\
  \ 元素，在现代设备上会渲染进度条。我们可以按如下方式更新它：\n\n```\nif (progressEvent.lengthComputable) {\n\
  \    document.getElementById(\"progressBar\").setAttribute(\"value\",\n        (progressEvent.loaded\
  \ / progressEvent.total));\n}\n```\n\n如果无法计算操作的完成百分比，由你决定做什么。你可以显示一个不确定进度条（虽然 iOS\
  \ 7 不支持 `progress` 元素的不确定性）。你可以显示额外信息告诉用户已下载了多少数据；虽然这可能给不了他们太多信息，因为他们也不太可能知道应该传输多少数据。总之，目标是让他们确信操作正在进行，即使不知道还要多久。你可以随时间缓慢增加进度条（Web\
  \ 浏览器等待服务器响应时常这样做），或显示安抚性消息，如“请稍候——我们仍在下载数据”。\n\n但你不能保证一定会收到进度更新，所以不要围绕它构建关键逻辑。如果文件已在浏览器缓存中、传输极快或发生错误，可能没有时间发送进度事件。\n\
  \n## 终止文件传输\n\n只要可能，用户都应能终止文件传输，即使你不认为传输会花很长时间。你不知道他们的网络状况，即使是很短的文件，在网络条件极差时也可能比任何人预期的都要长。话虽如此，你不必立即提供选项；你可能想等待几秒钟，给传输留出完成时间，然后再提供中止操作的方法，以确保用户不会不小心按下屏幕上出现的任何按钮。\n\
  \n中止传输很简单：`FileTransfer` 的任何实例都有一个 `abort` 方法，它将停止操作并调用错误处理程序。错误代码始终为 `FileTransferError.ABORT_ERR`，因此你的错误处理程序可以正确通知应用的其他部分关于终止的情况。\n\
  \n### 注意\n\n本节代码片段位于代码包的 `snippets/09/ex4-abort`。使用交互式片段演练场时，选择 **9: Transferring\
  \ Files** 和示例 **4**。\n\n下面是一个示例。在这种情况下，DOM 中有 `<button id=\"cancelDownload\">`。点击时，传输被中止：\n\
  \n\n\n\n```\nfunction go() {\n    let assetURL = \"https://github.com/kerrishotts/Mastering-PhoneGap-Code-Package/zipball/master\"\
  ;\n    let downloadLocation = \n                        \"cdvfile://localhost/temporary/index.zip\"\
  ;\n\n    let fileTransfer = new FileTransfer();\n\n    document.getElementById(\"\
  cancelDownload\")\n            .addEventListener(\"click\", () => {\n          \
  \      fileTransfer.abort();\n            });\n    fileTransfer.download(assetURL,\
  \ downloadLocation, \n                          downloadSuccess, downloadError);\n\
  }\n```\n\n# 文件传输安全注意事项\n\n既然我们已经介绍了文件传输，那么回顾一些重要的安全顾虑就显得尤为重要，因为你的应用不再是一个与互联网其他部分断开连接的孤岛。\n\
  \n*   你的应用**不应**自动信任从服务器接收到的内容。服务器可能已被攻陷，或者中间人攻击可能会篡改内容。\n\n*   你的服务器**绝对不应**自动信任从你的应用（或其他任何地方）接收到的内容。你最好的选择是使用病毒扫描器扫描每一个上传的文件；但这当然不是绝对的保证。\n\
  \n*   如果可能，你应该倾向于使用 SSL 连接（HTTPS），而不是未加密的通信。\n\n*   在使用 SSL 连接时，自签名证书和由设备不信任的证书颁发机构签名的证书将被拒绝。与其将\
  \ `trustAllHosts` 设置为 `true`，不如努力在你控制的服务器上提供受信任的证书。\n\n*   如果你要发送认证信息，*务必*使用 SSL。\n\
  \n*   如果你要显示从服务器下载的任何数据，请务必以一种不易受注入攻击的方式进行。要么对数据进行转义，使危险的 HTML 和 JavaScript 无法被提供，要么使用\
  \ `textContent`（而不是 `innerHTML` 或其变体）。请注意，`textContent` *不* 解析 HTML，因此如果内容本身是 HTML，你将需要对其进行转义，否则用户将只看到\
  \ HTML 源代码（而非期望的输出）。\n\n## 本章小结\n\n在本章中，你学习了如何从服务器下载文件。你还了解了如何使用服务器上的 PHP 脚本上传文件。我们讨论了一些关于信任从服务器下载或上传到服务器的内容的安全顾虑。\n"
- "# 性能优化\n\n在下一章中，我们将讨论你的应用可能遇到的各种性能问题，以及如何解决这些问题，以便你的用户在使用你的应用时拥有极佳的体验。\n\n在开发应用时，由于多种原因，我们往往很容易忽视应用在物理设备上的性能表现。其中一个原因可能是在桌面浏览器（如\
  \ Google Chrome 或 Safari）中测试大量功能，尤其是在快速迭代时。对于插件测试，开发者可能大部分时间选择使用模拟器，特别是如果他们需要快速跨多平台测试时。尽管这种策略很有用，但它在一个关键领域失效了：它无法告诉我们应用在真实设备上的性能表现。\n\
  \n在本章中，我们将涵盖以下主题：\n\n## 涵盖主题\n\n*   定义性能\n*   桌面端、模拟器和物理设备之间的性能差异\n*   对应用进行性能分析\n\
  *   修正输入延迟\n*   修正视觉卡顿\n*   修正内存问题\n*   拆分并委派长时间运行的计算\n\n## 先决条件\n\n本章假设你拥有一台可用于测试应用性能的物理设备。我们还假设你可以将此设备连接到开发机器，并使用\
  \ Google Chrome（针对 Android）或 Safari（针对 iOS）远程调试应用。\n\n## 远程调试资源\n\n如果你尚未配置设备和开发机器以进行远程调试，以下文章可能会有所帮助：\n\
  \n*   [`blog.idrsolutions.com/2015/02/remote-debugging-ios-safari-on-os-x-windows-and-linux/`](https://blog.idrsolutions.com/2015/02/remote-debugging-ios-safari-on-os-x-windows-and-linux/)\n\
  *   [`developer.chrome.com/devtools/docs/remote-debugging`](https://developer.chrome.com/devtools/docs/remote-debugging)\n\
  \n## 性能定义\n\n虽然乍一看“性能”是什么似乎显而易见，但实际上它是一个相当模糊的词，包含许多内涵。例如，使用这个词是指速度？是指每秒帧数？还是指内存使用量？\n\
  \n由于该词本身可能存在歧义，让我们建立一些术语和定义：\n\n*   **图形性能**：合成 DOM 中的元素、将它们发送给 GPU 并在屏幕上渲染它们所需的时间长度。\n\
  *   **计算性能**：一个方法完成其任务所需的时间长度。\n*   **每秒帧数**：这与图形和计算性能均相关。这是我们每秒可以执行的屏幕渲染次数。理想情况下，应用应以每秒六十帧为目标。\n\
  *   **输入性能**：从输入（如触摸）到视觉确认动作被理解所需的时间长度。这并不意味着动作已完成，只是设备识别了该输入。\n*   **内存利用率**：应用消耗的内存量。这需要在一段时间内测量，以便很好地了解应用在典型会话中使用了多少内存。\n\
  *   **存储性能**：读取和/或写入数据到设备持久化存储所需的时间长度。\n*   **存储利用率**：应用持久化存储的数据量。\n\n## 桌面端与移动端性能对比\n\
  \n虽然我们正在构建移动应用，但在桌面浏览器或模拟器中运行应用是很常见的，尤其是在代码快速迭代时。除非有直接需要物理设备的功能（例如加速度计），否则许多开发工作可以在应用从未见过物理设备之前就顺利完成。\n\
  \n虽然这种开发方式在前期节省了大量时间，但这也意味着性能问题往往会被忽视，直到为时已晚。因此，定期在代表目标市场的物理设备上运行你的应用，以确保性能保持在可接受范围内，是个好主意。\n\
  \n让我们回顾一下你在桌面浏览器、模拟器和物理设备之间将遇到的典型差异。\n\n### 桌面浏览器性能差异\n\n虽然移动设备的计算和图形性能正在提升，但大多数开发机器在大多数任务上都能轻松超越即使是旗舰级的移动设备。这有几个原因，但归根结底是组件的功耗、组件的尺寸、散热和成本。所有这些因素往往相互制约；例如，可以找到速度极快的\
  \ GPU，但它们比速度较慢的同类产品成本更高，且往往需要更多电力并散发更多热量。\n\n### 电源可用性与消耗\n\n\n\n# 设备约束：桌面端与移动端的差异\n\
  \n桌面设备在电源可用性和消耗方面受到的限制远少于移动设备。笔记本电脑介于两者之间，因为它们使用电池供电（类似移动设备），但这些电池提供的功率也比移动设备大（更接近桌面设备，但程度不及）。因此，桌面级\
  \ CPU 和 GPU 在重负载下可消耗大量功率，而移动设备没有这种奢侈：它们受限于小电池的体积和输出功率。散热也成了问题。桌面和笔记本电脑通常有一个或多个风扇，在内部温度过高时启动，内部组件之间也有更多空间让空气高效流动。如果内部散热无法完全补偿，CPU\
  \ 或 GPU 会降低性能以避免过热损坏。移动设备也是如此，但它们没有风扇来散热。它们依赖散热片和外壳向外辐射热量，但这显然远不如风扇高效。此外，如果设备烫手，会严重限制用户与其交互的能力。\n\
  \n所有这些意味着，桌面级设备能以更快的速度和更高的功耗运行更长时间。这对计算密集型和图形密集型应用影响巨大，因为桌面端可能按预期运行，但移动端可能因负载过重而无法胜任。请记住，您的开发机器很可能比即使是较新的移动设备也至少快一个数量级，甚至更多。\n\
  \n## 电池续航\n\n除了功耗，还有电池续航。桌面设备当然不太需要担心电池消耗，因为它接入市电（当然，停电会让桌面设备也瘫痪）。因此，我们可能需要让应用根据剩余电量改变行为，这一点可能不会立刻显现。如果您用笔记本电脑开发，这会更明显一些，因为您开发时就要管理电池。但大多数笔记本电脑的电池容量大得多，放电模式也与移动设备不同。因此，仍值得思考您的应用如何消耗电池，以及在低电量情况下如何表现。\n\
  \n## 浏览器影响\n\n鉴于上述所有因素，桌面浏览器也比移动端同类产品快几个数量级。因为 Cordova 应用是利用系统 WebView 的混合应用，同样的情况也适用于我们的应用。因此，桌面端\
  \ 5 ms 完成的计算，移动端可能需要 50 ms。桌面端强大 GPU 几毫秒就能绘制的画面，移动端可能耗时更长。\n\n## 内存\n\n除了上述因素，桌面通常拥有更多可用内存。开发机器拥有\
  \ 8 到 32 GB（甚至更多）内存并不罕见，而移动设备可能只有 1 到 4 GB（旧设备更少）。这意味着移动设备在允许任务消耗内存（尤其是后台）方面必须严格得多，内存不足时更倾向于终止后台应用。这对混合应用是个潜在问题，因为\
  \ WebView 本身仅生成屏幕上的 DOM 内容就需要大量内存。在内存充足的桌面端这往往被忽略；但在移动端，渲染复杂布局可能导致应用被移动操作系统终止。\n\
  \n## 存储\n\n存储情况也大不相同。桌面或笔记本电脑通常有 256 GB 到数 TB 的可用存储，而移动设备的持久化存储通常上限为 128 GB。当然，运行您应用的大多数设备实际存储甚至更少，留给应用的可用存储可能很少（或没有）。简而言之，我们的混合应用必须妥善处理低存储或无存储的情况，而不能直接崩溃。\n\
  \n存储读写速度也差异巨大。您的开发机器可能有速度极快的固态硬盘，也可能有相对较慢的机械硬盘。移动设备虽用固态存储，但其运行速度远低于桌面级固态硬盘。处理小文件时这不是大问题，但读写超大文件时肯定会暴露问题。\n\
  \n## 延迟\n\n还有一个领域需要关注，即输入（如鼠标）与屏幕输出之间的延迟。这取决于设备的潜在性能及其当前任务，但总有一定的最小处理时间。这称为**延迟**，必须将其控制在绝对最小，以免被用户察觉。\n\
  \n与物理世界交互时，延迟极低。即便如此，虽然我们的大脑感觉动作与对动作的感知是同时发生的，但实际上从产生动作冲动到大脑视觉识别其后果，存在少量延迟。之所以感觉即时，是因为大脑使用了一种缓冲机制。如果事件在短时间内到达，会被视为同时发生；超出该时间框架，则不再视为同时。\n\
  \n观看人物说话的视频即可看到此效应。通常视频经过剪辑，音频看似同步。但偶尔会遇到音频**未**正确同步的视频，效果至少令人不适，最糟让人烦躁以致停止观看。然而若查看实际视频帧和音频，会发现完美同步音视频非常困难（尤其是音视频来自不同来源时）。得益于大脑缓冲，我们能容忍少量错位，约\
  \ ±20 ms（因人而异）。对某些人，100 ms 以上的延迟也不会造成问题。\n\n这对设备交互影响深远。想象您在电脑屏幕上移动鼠标指针。有多个过程在发生，都需有限时间完成。大脑决定指针去向，计算肌肉指令并发送给肌肉。此时计算机收到鼠标移动通知，根据位置差和加速度计算指针终点，合成新位置的指针画面，发送给\
  \ GPU 渲染。大脑处理屏幕画面，根据刚才发生的情况进一步移动和调整。这是一个大反馈回路；只要全在几毫秒内完成，就会感觉同时。但如果过程过长（如超过 50 ms），人们必定会察觉。\n\
  \n\n\n\n# 移动端与桌面端的输入输出延迟差异\n\n如果你曾将显示器镜像到电视或其他远程设备，你很可能经历过上述现象。或者，如果你曾通过糟糕的网络连接登录到远程机器，你可能也经历过这种情况。由于通过空气或糟糕的网络连接传输信息涉及额外的延迟，你的输入与最终输出之间的延迟会比正常情况增加。因此，人们开始感觉与输出脱节，并且难以预判我们行动的结果。当你在鼠标移动中引入延迟时，这最为明显。我们的大脑倾向于过度补偿而偏离目标，这非常令人沮丧。当然，我们最终可以适应这种延迟，但这远非理想。\n\
  \n我之所以提到所有这些，原因如下：桌面端的输入与输出之间的延迟与移动设备上的延迟是*不同*的；如果响应时间*过高*，用户会感到沮丧。只要有进度指示器，用户可以容忍长时间运行的计算，但用户不喜欢用户界面在其触摸操作后大幅滞后。正如滞后的鼠标指针是个问题一样，滚动不跟随用户手指同样成问题。点击鼠标按钮能给我们相当即时的反馈，即是的，我们确实*点击*了按钮（即使计算机识别得很慢），但移动设备响应触摸时没有那个中间的物理点击过程。如果设备响应缓慢，用户往往会重复操作，以为自己按得不够用力或设备未记录他们的触摸。如果不了解这一点，个人可能会无意中触发不需要的操作，甚至导致数据丢失。\n\
  \n重要的是要认识到，你无法消除输入和输出之间的所有延迟，但你可以尝试将其最小化。即使经过最小化处理，你也会发现很难产生比 `33 ms`（`60 fps` 下的两帧屏幕刷新）更快的响应。如果你发现应用程序延迟超过\
  \ `50` 到 `100 ms`，你的应用程序肯定会让用户感到沮丧。\n\n这种延迟并不意味着用户发起的操作也必须在短时间内完成。重要的是设备能尽快让用户知道“是的，我听到了”。用户不会指望视频在几毫秒内编码完成，但他们确实期望用户界面在那个时间范围内*做点什么*，以便他们知道自己的触摸被理解了。\n\
  \n因为桌面或笔记本电脑上的延迟与移动设备上的延迟*不同*，所以不应该认为：仅仅因为事情在桌面上立即发生，在移动设备上也是如此。鼠标点击在桌面上通常感觉相当即时，但如果我们在代码中使用相同的\
  \ JavaScript 事件，我们的应用程序会感觉非常慢，因为它通常必须等待约 `300 ms` 以确保没有双击即将到来。桌面也必须等待双击，但延迟*短得多*，所以感觉会即时得多。\n\
  \n还有一件事我需要提到：显然，桌面浏览器虽然与其移动端表亲有关，但*不*相同。它们针对桌面级 `CPU` 进行了优化，支持不同的操作系统，并支持不同的功能集。通常，它们的更新频率比移动端对应产品高得多（尽管这在\
  \ Android 上正在改变）。因此，仅仅因为你的应用程序在桌面浏览器上运行，并*不*意味着它能在移动浏览器上运行。测试应用程序的绝对最佳方式始终是在物理设备上进行，但如果你想验证你的\
  \ `HTML`、`JavaScript` 和 `CSS` 代码是否在移动设备上运行，你也可以启动模拟器。\n\n# 模拟器性能差异\n\n作为开发人员，你通常会在应用程序的开发和测试过程中频繁使用模拟器。虽然这些模拟器在技术上处于桌面级别，但它们有自己的怪癖，使得判断性能变得困难。\n\
  \n首先，提醒一下：没有 iOS *模拟器*（Emulator），只有 iOS *模拟器*（Simulator）。这是关键，因为模拟器和仿真器之间有很大区别。在实践中，这意味着\
  \ iOS 模拟器往往比物理设备快得多，而 Android 模拟器可能较慢或较快，具体取决于用于仿真的架构。\n\niOS 设备使用 `ARM` 架构，因此当应用程序编译时，代码的原生部分将被转换为\
  \ `ARM CPU` 可识别的指令。另一方面，开发机器大多是基于 `x86` 的机器（Intel/AMD），无法原生理解这些指令。有两种方法来处理这个问题：要么将应用程序重新编译为\
  \ `x86` 代码，要么模拟 `ARM CPU`。\n\n当然，应用程序运行需要大量的支持框架和库。这在很大程度上就是 iOS 模拟器和 Android 模拟器之间差异所在。Android\
  \ 一段时间以来一直能够同时针对 `ARM` 和 `x86` 架构（事实上，有一些搭载 `x86 CPU` 的 Android 设备）。因此，在这一点上，模拟器和仿真器所做的事情没有根本性的区别。\n\
  \niOS 模拟器和 Android 模拟器之间的真正区别在于：iOS 模拟器将你的应用程序作为原生 Mac OS X 应用程序运行，而 Android 模拟器将在完全虚拟化的环境中运行你的应用程序。这通常不会产生*太大*的差异，但它会改变你访问网络或存储等资源的方式。例如，在使用\
  \ iOS 模拟器时，`localhost` 指的是你的开发机器，就像在任何其他进程中一样。而在使用 Android 模拟器时，`localhost` 指的是虚拟化设备。你可以通过简单地引用机器在网络上的实际\
  \ `IP` 地址（或主机名）来忽略这一差异。但这说明了区别：被模拟的 iOS 应用程序与你所有的其他进程一起运行，而 Android 应用程序则在虚拟化容器内运行。\n\
  \n那么，这对我们应用程序的性能意味着什么？归根结底就是：不要信任你的模拟器。不是因为它想欺骗你，而是因为它无法准确复制物理设备的性能配置文件。以下是一些不同之处：\n\
  \n*   图形性能通常会降低，往往幅度很大。现代 Android 模拟器可以访问主机 `GPU`，这方面已有所改进。但 iOS 模拟器和 Android 模拟器都无法准确反映物理设备的\
  \ `GPU` 性能。根据我的经验，你可能达到约 `80%` 的性能，但你不太可能始终看到完美流畅、以 `60 fps` 运行的界面。\n*   计算性能可能差异很大。如果像\
  \ iOS 模拟器那样在 `x86` 架构上运行，某些 Android 模拟器也可以做到，那么性能很可能会超过物理设备，因为它以与桌面 `CPU` 相同的速度（或稍慢）运行。另一方面，如果你的\
  \ `CPU` 正在模拟 `ARM` 架构，则性能会惨不忍睹，比物理设备慢得多。\n*   可用内存可能差异很大，如下所示：\n    *   在模拟 iOS\
  \ 应用程序时，应用程序实际上可以访问开发机器上所有可用的内存，这几乎可以保证它永远不会内存不足。此外，你的开发机器拥有支持交换文件的操作系统；因此，它还可以将持久存储上所有剩余空间用于应用程序的内存需求。iOS\
  \ 模拟器中有一个实用程序可以*模拟*低内存状况，但仅此而已。\n\n\n\n\n\n# 性能测试与性能分析\n\n## 模拟器的局限性\n\n- 当你创建一个\
  \ Android 虚拟设备或使用 GenyMotion 设备时，会为虚拟设备分配一定量的内存。这更接近物理设备的情况，因为 Android 操作系统、WebView\
  \ 以及你的 Web 代码必须共存于一个更受限的空间内。遗憾的是，这些模拟器无法反映真实设备的使用情况（通常其他应用也会与你的应用一起驻留在内存中），因此它并非完美的替代品。\n\
  \n- 可用存储空间可能差异巨大，但关于存储读/写速度的警示与前一节相同：\n\n    - 同样，在模拟 iOS 应用时，该应用对持久化存储的访问权限与设备上的其他应用相同。这意味着\
  \ iOS 应用可能会填满你的硬盘，尽管它不应能逃逸 Mac OS X 提供的沙箱，因此无法损害你的其他文件。这意味着在大多数开发机器的规格下，你的应用不太可能遇到存储空间不足或耗尽的情况。\n\
  \n    - Android 设备也会被提供具有最大容量限制的虚拟化持久化存储。这更准确地反映了物理设备上的情况；但同样，它并不完全代表真实世界。大多数用户会在设备中塞满应用，从而减少你自己的应用可用的存储空间，而模拟器通常相当“简陋”（存储空间充足）。\n\
  \n- 延迟也可能是一个大问题，主要是作为模拟器计算和图形性能的副作用，但也因为人们经常用鼠标代替触摸手势。这已经完全破坏了应用在真实设备上的真实手感；但这也意味着你不仅要承受开发机器操作系统自带的延迟，还要承受模拟器的延迟。加上较慢的图形性能，延迟会变得很严重。简而言之，如果模拟器上的延迟很严重，不要惊慌。在真机上测试一下再决定是否惊慌！\n\
  \n- 虽然这与性能没有直接关系，但也很重要：模拟器并不总能提供与物理设备相同的功能。GPS 支持可能是模拟的，但它与物理设备的 GPS 报告能力不同。如果你正在开发一款使用加速度计的游戏，在物理设备之外你几乎肯定无法进行测试，不仅因为模拟器不支持加速度计，还因为其他性能和延迟的差异。\n\
  \n那么，模拟器的意义何在？它让我们能够验证混合应用是否能与我们针对的系统 WebView 协同工作。它还能让我们测试许多插件，这是在桌面浏览器上无法做到的。但别忘了，模拟器永远无法替代真机。\n\
  \n## 识别性能问题\n\n现在我们希望已经说服你在物理设备上验证性能，那么如何识别性能是否正在成为问题呢？有几种方法：\n\n- **物理测试** 涉及在设备上与你的应用进行实际交互。当你测试应用时，可能会遇到视觉卡顿、延迟、滞后或更糟的情况。在尽可能多的不同类别设备上进行测试也很重要，因为每种类型和型号的性能往往差异很大。这可能会迅速变得昂贵，但通过大规模的\
  \ Beta 测试和大量人工测试人员，可以在一定程度上缓解这一问题。\n\n- **性能分析** 通过查看多个不同指标来识别潜在问题所在。内存是最明显的指标；你可以在交互过程中记录应用的内存使用情况，以识别潜在的内存问题。你也可以确定应用中可能导致视觉卡顿的长时间运行进程。性能分析不可避免地会引入自身的性能影响（总是会变慢），因此不要仅依赖性能分析作为性能的唯一衡量标准。将设备从开发机器上拔下，在没有任何调试器附加的情况下使用你的应用，以获得应用真实手感的真实体验。\n\
  \n第一种方法不言自明：拿起你的设备玩转你的应用。确保应用已与调试器断开连接，因为调试器会对应用性能产生负面影响。如果你注意到任何卡顿、滞后或延迟，就知道有问题了。此时，你可以使用第二种方法：性能分析来诊断问题。\n\
  \n性能分析依赖于特定平台的工具。对于 Android，你可以使用 Google Chrome 的远程 Web 检查器工具来分析你的应用。对于 iOS，你需要使用\
  \ Safari 浏览器的最新版本进行移动端调试，同时也需要使用 Instruments 来检查内存使用情况。\n\n## Android 上的性能分析\n\n\
  假设你的设备或模拟器运行 Android 4.4 或更高版本，分析你的应用非常简单。假设你已配置设备进行远程调试，应用已安装并运行，设备已连接到开发机器，你应该能在\
  \ Chrome 中导航到 `chrome://inspect` 并看到列出的设备和应用。\n\n点击你想要调试的设备和应用后，你应该会看到熟悉的 Web Inspector\
  \ 工具，Google Chrome 允许你用它来调试和检查常规网页。在检查器中，应该有一个 `Timeline` 标签页可供点击。最初这将是空白的；但你可以点击左上角的\
  \ `Record` 图标，Google Chrome 将开始记录应用的内存使用、CPU 利用率、每秒帧数等。完成与应用的交互后，点击 `Stop` 图标以结束录制。\n\
  \n示例性能分析如下截图所示：\n\n![Android 上的性能分析](img/9781OS_10_01.jpg)\n\n有许多不同的区域，你可以根据关注点调整大小。标签页上方的工具栏允许你更改数据可视化方式。前面的截图是应用性能（包括图形和计算）及内存使用的高度压缩时间线。你可以选择时间线的一部分以查看更多详细信息，这些信息显示在\
  \ `Timeline Details` 部分。在此下方是同一选定时段的内存利用率，细分为几个不同类别。截图底部是一个饼图，表示选定时间中花费在渲染、绘制、执行脚本等方面的比例。\n\
  \n此特定视图对于跟踪内存利用率特别有用。注意时间线上的蓝色图表？那是应用内存分配的压缩表示。`Memory Details` 部分给出了时间线中选定区域的特写。图例指示了哪些线条颜色代表哪些类别；其中\
  \ `Used JS Heap` 至关重要，它代表分配的总内存。`Nodes` 和 `Listeners` 也很有用，分别代表文档中的节点数和事件监听器数量。\n\
  \n如果你切换视图（通过点击工具栏中 `View` 正右侧的图标），你应该会看到类似这样的内容：\n\n![Android 上的性能分析](img/9781OS_10_02.jpg)\n\
  \n在该截图中，顶部的图表仍然是应用的时间线，但它代表设备绘制每一帧所需的时间。这很有用，因为它指示了应用在何处因无法足够快地生成帧而导致视觉卡顿。在截图底部，你可以看到展开的详细信息，显示你的代码中哪些部分执行时间过长。\n\
  \n## iOS 上的性能分析\n\n不幸的是，Safari 的检查器工具不如 Chrome 先进；因此，有必要使用两个工具。我们可以使用 Safari 9 或更高版本来分析每秒帧数。要分析应用的内存，你需要使用\
  \ Xcode 的 Instruments 工具。\n\n\n\n\n\n# iOS 混合应用的性能分析与优化\n\n## 使用 Safari Web Inspector\
  \ 进行远程调试\n\n首先，如果你已将设备配置为远程调试模式，并且应用已安装且正在设备上运行，你应该能够将设备插入开发机器。然后，你需要启动 `Safari`\
  \ 并导航至 `Develop` | `Your Device` | `Your App` 以打开 Safari 的检查器。\n\n你应该会看到一个 `Web\
  \ Inspector` 窗口。在顶部，工具栏下方，应该有一系列标签页。点击 `Timelines`，然后点击 `Rendering Frames`。你应该会看到类似下图的内容，尽管此时没有数据：\n\
  \n![Profiling on iOS](img/9781OS_10_06.jpg)\n\n要开始记录设备性能，请点击标记为 `2` 的 `Record` 图标，然后与设备进行交互。当你完成与应用的交互后，再次点击该图标；检查器将填充大量有用信息。\n\
  \n顶部是一条时间轴，代表应用的图形渲染性能；例如，绘制每一帧所需的时间。当我们想要避免视觉卡顿时，这非常有用。你可以选择一系列帧，甚至单个帧，然后深入查看每一帧所耗费的时间。\n\
  \n## 使用 Xcode Instruments 进行内存分析\n\n然而，要分析应用的内存，必须放弃 `Safari` 而改用 `Xcode` 的 `Instruments`\
  \ 工具。此外，两者不能同时分析同一个应用；因此，你需要在启动 `Instruments` 之前关闭 Safari 的检查器。\n\n虽然你可以分析正在运行的应用的内存使用情况，但从应用启动之初就获取内存消耗趋势是明智之举。为此，你需要重启应用；但你不必手动操作——`Instruments`\
  \ 可以为你启动它。\n\n### 启动 Instruments\n\n要启动 `Instruments`，可以执行以下任一步骤：\n\n1.  打开 `Xcode`，然后导航至\
  \ `Xcode` | `Open Developer Tool…` | `Instruments`\n2.  使用 `Spotlight` 搜索 `Instruments`\n\
  \n任一方法均可。你应该会看到如下截图所示的对话框：\n\n![Profiling on iOS](img/9781OS_10_03.jpg)\n\n### 配置分析会话\n\
  \n首先要做的是选择你的设备。如果运气好，它已经被选中。如果没有，点击 `1` 以显示可用设备。然后，你需要选择要分析的应用；点击 `2` 以显示已安装和正在运行的应用。你应该选择一个已安装的应用，以便我们在应用初始化时捕获内存利用情况。\n\
  \n接下来，选择要分析的内容。你可能想要使用 `Allocations` `3`，但其他选项也非常有用。选定后，点击 `Choose`，你应该会看到类似下图所示的界面：\n\
  \n![Profiling on iOS](img/9781OS_10_04.jpg)\n\n### 记录内存分配\n\n目前，视图看起来并不丰富，那只是因为\
  \ `Instruments` 正在等待你开始分析。点击 `Record` 图标并与应用交互。完成交互后点击 `Stop` 图标。你应该会看到类似下图所示的内容：\n\
  \n![Profiling on iOS](img/9781OS_10_05.jpg)\n\n如你所见，此次分析运行仅关注内存利用率。你可以在时间轴中选择一个范围。详细信息显示在时间轴下方的区域中。\n\
  \n## 注意事项\n\n有个重要细节你需要知道：点击分析会降低应用性能，这在某种程度上是个两难困境。简而言之，如果在正常使用应用时未发现卡顿，但在分析时*确实*出现了卡顿，请别担心：是分析器干扰了运行。如果你在检查内存问题，不要认为看到的图形性能具有代表性。应用真实图形运行表现的*唯一*真实体现，是设备未连接开发机时的状态。\n\
  \n显而易见，我们无法消除*所有*输入延迟。总会存在一些延迟。但我们*可以*消除那些令人沮丧的时刻——即设备似乎没有立即理解我们意图的时候。\n\n## 处理触摸事件与点击延迟\n\
  \n因为移动设备依赖触摸且屏幕通常较小，手势是主要输入机制。此外，因为我们喜欢对屏幕上的数据执行许多操作，应用往往需要识别多种手势。点击是显而易见的手势，但在浏览网页时，双击缩放手势也常被使用。因为我们的混合应用运行在\
  \ WebView 中，它继承了相同的双击缩放手势，这通常是有问题的。你见过多少应用允许你缩放其 UI 元素？极少，甚至没有。\n\n### 300ms 延迟问题\n\
  \n双击缩放手势带来了一个问题：乍看之下，它与屏幕上的单次点击没什么两样。这意味着 WebView 必须等待一小段时间，以判断是否发生了足够快的第二次点击从而将其计为双击。对于大多数\
  \ WebView，这段时间是 300 ms，即近三分之一秒。在这段时间结束前，单击事件无法发送。这导致了巨大的输入延迟。\n\n较新版本的 Android 已认识到此问题，并提供了各种属性以避免此延迟。而截至撰写本文时，iOS\
  \ 并未提供任何完全禁用该手势的方法。相反，我们必须想办法绕过它。\n\nAndroid 和 iOS WebView 都会生成 `mouse` 和 `touch`\
  \ 事件。鼠标事件的存在是为了兼容可能不支持触摸的现有网页。这些事件包括具有 300 ms 延迟的 `click` 事件。然而，触摸事件完全避免了这个问题，因为它们更类似于\
  \ `mouseup`/`mousedown` 而非 `click`，所以可以立即触发。避免 `click` 300 ms 延迟的一种方法是直接使用 `touchend`\
  \ 事件，只不过 `touchend` 实际上并非 `click`。各种怪癖可能会出现，这使得引入一个抽象所有痛苦的支持库要简单得多。这也是我们在本节中将采取的策略。\n\
  \n### 解决方案：FastClick 与手势库\n\n如果你的应用严重依赖 `click` 事件，解决该问题最简单的方法是引入 `FastClick` 库\
  \ ([`https://github.com/ftlabs/fastclick`](https://github.com/ftlabs/fastclick))。它已部署在相当数量的混合应用中，且可在大量平台上运行。它监听触摸事件，并在手指离开屏幕时生成一个合成的\
  \ `click` 事件。然后它会抑制浏览器原本会生成的 `click` 事件。虽然听起来很简单，但带注释的代码多达 841 行。不必多说，事情很少像表面看起来那么简单。\n\
  \n就我个人而言，我选择避免使用 `click`，转而构建响应手势的应用。因此，我的代码不监听 `click`（一种鼠标事件），而是监听 `tap` 和 `swipe`\
  \ 等手势。有许多不同的库提供手势支持，但我个人最喜欢的是 `Hammer.js` ([`https://github.com/hammerjs/hammer.js`](https://github.com/hammerjs/hammer.js))。它不像\
  \ `FastClick` 那样容易设置，但它支持除点击之外的更多手势。为了灵活性，人们牺牲了简洁性。\n\n如果你的应用不需要除单击之外的手势支持，那么 `FastClick`\
  \ 可能是你最好且最简单的选择。但如果你需要响应滑动、捏合等更多手势，你将需要考虑手势库。\n\n### 推荐的手势库\n\n以下是一些有用的手势库列表：\n\n\
  *   `Event.js` ([`https://github.com/mudcube/Event.js`](https://github.com/mudcube/Event.js))：支持多种不同事件，包括\
  \ `taps`、`long presses`、`swipes` 等。\n*   `Hammer.js` ([`https://github.com/hammerjs/hammer.js`](https://github.com/hammerjs/hammer.js))：支持不同事件，如\
  \ `tap`、`long presses` 和 `swipes`。\n\n\n\n\n\n- `Interact` ([`github.com/taye/interact.js`](https://github.com/taye/interact.js))：支持拖放、调整大小等功能，并带有惯性效果。\n\
  - `Zepto` ([`zeptojs.com/#Touch%20events`](http://zeptojs.com/#Touch%20events))：这是一个轻量级的\
  \ jQuery 替代品，但它支持简单的手势，如滑动和点击。\n- `tap.js` ([`github.com/alexgibson/tap.js`](https://github.com/alexgibson/tap.js))：这与\
  \ `FastClick` 类似，但它使用 tap 事件，而不是覆盖 `click` 事件。\n\n虽然上述方法在减少感知延迟方面已大有裨益，但我们仍可做得更多。通常，前面列出的库适用于在事件结束后做出响应，但如果事件正在进行中该怎么办？例如，应用通常不会等到用户抬起手指才记录屏幕按钮已被按下；相反，它们通常会在手指按在屏幕上时显示按下状态的按钮（或其他状态）。这减少了延迟感，并提升了性能感知，因为现在我们可以看到应用直接响应我们的触摸，而不仅仅是响应手势的完成。\n\
  \n实现这一点最简单的方法就是直接使用 CSS 已经为我们提供的各种状态，即 `:active` 和 `:focus` 状态。虽然移动端 WebView 支持\
  \ `:hover`，但其行为怪异，最好避免使用。\n\n## 注意\n\n`:hover` 当然在触摸环境中没有真正的对应物，因为设备无法识别手指何时真正悬停在屏幕上方。因此，浏览器采取了不同的策略：对元素的一次点击会将其过渡到\
  \ `:hover` 状态，然后再一次点击会触发 `click` 事件。虽然我理解其中的理由，但当我在网页上遇到这种情况时，会感到非常沮丧，因为这意味着我必须开始对所有东西点击两次。所以，请不要在你的应用中使用它！\n\
  \n当元素获得输入焦点时，会发生 `:focus` 状态。这仅对 `input`、`textarea`、`select` 和其他类似元素有效。通过改变元素的视觉状态（即使很微妙），用户可以确信应用聚焦在了合适的元素上。如果用户配对了硬件键盘，这也有好处，因为他们可以像在桌面浏览器中一样通过\
  \ `Tab` 键在元素间切换。\n\n当元素接收到触摸时，会发生 `:active` 状态。这可能是最关键的实现状态，因为它能在*完全不需要任何 JavaScript\
  \ 代码*的情况下，给用户近乎即时的反馈。这意味着它产生的延迟也最小。在切换到 `:active` 状态时，你不应尝试做任何*过于*花哨的事情，因为你不想强迫浏览器重新计算每个元素的位置；但改变文本颜色（即使很微妙）通常就足够了，且速度极快。\n\
  \n当你看到滚动时或动画播放时出现视觉卡顿，这个特定问题就最明显。卡顿发生的原因是设备无法执行足够快的所有必要计算来渲染屏幕，以满足目标 `60 fps`。为了达到这个目标，设备必须在大约\
  \ `16 ms` 内执行*你的*代码、布局 `DOM`、合成各种元素，并将结果发送给 `GPU`。如果听起来时间非常短，那是因为它确实很短。对于计算机来说，当然这是合理的时间。但在处理计算相互关联的\
  \ `DOM` 元素的位置和大小、将透明和半透明元素相互合成、然后将所有数据推送到 `GPU` 时，这些毫秒会迅速消失。\n\n如果你遇到这个特定问题，我们之前提到的性能分析工具应该能帮助指出潜在问题所在。这是因为分析器会记录生成每一帧所需的时间。请看下面的例子：\n\
  \n![纠正视觉卡顿](img/9781OS_10_09.jpg)\n\n此图代表了你在 Google Chrome 和 Safari 中可以看到的内容。每个柱状条的高度表示渲染该帧所需的时间，各个片段表示时间花在了哪里。\n\
  \n正如你在前面的图表中所见，只有当柱状条的高度低于 `60fps` 线时，我们的应用才能达到 `60 fps`。Google Chrome 和 Safari\
  \ 都会指示 `60fps` 线。如果必要，它们也会显示 `30fps` 线。\n\n一旦我们的帧渲染时间超过 `16.67 ms`，我们就无法维持 `60 fps`。如果慢于\
  \ `33.33 ms`，我们就无法维持 `30 fps`。如果这种情况不常发生，倒不是什么大问题，因为你永远无法*完全*控制设备（操作系统可能正在安装更新，浏览器可能正在垃圾回收，等等）。但如果持续发生，就会以视觉卡顿的形式表现出来。\n\
  \n## 达到 60 fps\n\n那么，如何驯服每秒帧数这头野兽？这里有一些建议：\n\n- 保持 `DOM` 简单。如果一个元素不需要属于 `DOM`，就不要添加它。\n\
  - 避免 `DOM` 中嵌套过深的元素。对子元素的更改将不可避免地强制父元素重新计算其位置和大小，这可能是一项昂贵的计算。\n- 避免冗长的 `DOM` 元素列表。滚动浏览长列表会迅速变得卡顿和缓慢，因此最好限制可呈现的元素数量。你可以非常简单地使用分页来实现这一点，也可以使用无限滚动的变体，这更接近原生\
  \ `SDK` 的用法。然而，后者要复杂得多。一些无限滚动库如下：\n  - `Infinity` ([`airbnb.io/infinity/`](http://airbnb.io/infinity/))\n\
  \  - `iScroll` ([`iscrolljs.com`](http://iscrolljs.com))\n- 缓存 `DOM` 元素引用。通常，你需要使用某种\
  \ `CSS` 选择器规则来定位所需的 `DOM` 元素。这可能很昂贵，特别是当 `DOM` 嵌套到一定程度时。通过 `ID` 查找元素是最快的选择，但你并不总是有这个选项。因此，当你不需要时，不要反复搜索\
  \ `DOM`，而是缓存结果。\n- 避免不必要的 `DOM` 回流。每当浏览器需要计算元素的位置、大小和样式时，就会发生这种情况，通常是响应对特定属性的查询（如\
  \ `window.getComputedStyle(element).width`），或当各种样式发生变化时（如 `element.style.width=\"\
  100%\"`）。向节点添加元素也会导致 `DOM` 回流，这意味着如果 `parentElement` 在 `DOM` 中，你应该避免在循环中使用 `parentElement.appendChild(element)`（为此请使用\
  \ `document fragments`）。移除元素时也会发生回流，因此隐藏元素（`visibility: hidden`）通常比移除它更快，特别是当你知道将来还需要该元素时（如侧边栏菜单的情况）。\n\
  - 保持 `CSS` 精简。你的 `CSS` 越复杂，计算 `DOM` 元素上的各种属性就越复杂。移除不需要的规则并避免复杂的选择器。\n- 保持 `CSS`\
  \ 布局简单。重要的是要记住，浏览器实际上正在求解一些非常复杂的方程，以满足你的布局要求，这些计算会迅速累积。例如，`Flexbox` 虽然易于使用，但也难以计算。你可以通过绝对定位元素或使用\
  \ `CSS transforms` 来避免一些计算，但这也可能消除 `HTML` 和 `CSS` 的优势：响应视口大小的应用。如果你将所有东西都绝对定位，重新计算每个元素的位置就成了你自己代码的责任。取决于你的应用结构，这实际上可能比让浏览器处理这项责任更耗时。\n\
  \n\n\n\n\n# 性能优化建议\n\n## CSS 与渲染优化\n\n*   **避免花哨的 CSS 样式。** 这包括各种情况，但核心原则是：最小化透明度、半透明度、阴影和渐变的使用。这意味着你应该尽量减少\
  \ `box-shadow` 和 `opacity` 的使用，同时也应避免过度使用 `border-radius`（它需要半透明支持）。渐变和阴影的图片比等效的\
  \ CSS 样式性能更好。这并非说你必须完全消除这些图形修饰，而是说应避免过度使用。如果发现某些低端设备无法流畅运行这些效果，你可能需要添加一个设置让用户降低图形质量（或自动检测）。\n\
  \n*   **使用 CSS 3D 变换，但勿过度。** 这些 3D 变换会强制 GPU 渲染受影响的 DOM 元素，从而提升性能。但需谨慎，过度使用会产生反效果，且会消耗大量内存。此外，每次使用时应避免嵌套过深的变换。GPU\
  \ 需要介入，而这些内存传输并非无成本。\n\n*   **结合 CSS 动画或 `requestAnimationFrame` 使用 CSS 变换。** 始终避免对典型定位样式（`top`、`left`\
  \ 等）制作动画，而应使用 CSS 3D 变换。当动画过程中无需用户交互时可使用 CSS 动画，或使用 `requestAnimationFrame` 通过 CSS\
  \ 变换平滑地实现用户交互动画。\n\n*   **减少绑定在 DOM 元素上的事件监听器数量。** 理想情况下，使用事件委托（我们的演示应用从一开始就采用了此方式）。当用户触摸屏幕时，DOM\
  \ 需要确定所有能响应该特定触摸的元素。事件处理程序越多，列表越长。事件委托通过减少事件处理程序数量来加速此过程，因为只需在视图根层级添加一个处理程序。这些处理程序可能仍会嵌套（例如视图内的视图），但最终数量将远少于为长列表中的每个列表项单独添加事件处理程序。\n\
  \n## 实用性能资源\n\n以下网站提供了非常有用的性能信息：\n\n*   PhoneGap 应用的 10 大性能技巧：[`coenraets.org/keypoint/phonegap-performance/`](http://coenraets.org/keypoint/phonegap-performance/)\n\
  *   最小化浏览器重排：[`developers.google.com/speed/articles/reflow`](https://developers.google.com/speed/articles/reflow)\n\
  *   成功 PhoneGap 应用的性能与 UX 考量：[`www.tricedesigns.com/2013/03/`](http://www.tricedesigns.com/2013/03/)\n\
  \n# 内存管理\n\n## 内存泄漏分析\n\n如果你的应用快速分配大量内存却不释放回操作系统，应用会迅速被终止。另一方面，缓慢的内存泄漏可能要等到应用会话持续数小时甚至数天后才会显现。\n\
  \n如果你怀疑存在内存泄漏，性能分析会有所帮助，但无论如何最好对应用进行性能分析，以确定其是否总体上占用了过多内存。毕竟，并非所有内存问题都是泄漏。\n\n那么，内存泄漏是什么样的？在性能分析器图表中，它表现为一条持续上升的线，如下所示：\n\
  \n![修正内存问题](img/9781OS_10_07.jpg)\n\n此处的时间范围很重要；这是在相当长的一段时间内，而非仅几秒钟。由于浏览器管理内存的方式，总会有一小段时间内看到图表持续上升。关键在于，在此例中，内存从未被释放。因此，图表会持续上升数分钟甚至更久，直到操作系统因内存压力终止应用。\n\
  \n## 理想内存模式\n\n图表理想情况下应呈现锯齿状，如下图所示：\n\n![修正内存问题](img/9781OS_10_08.jpg)\n\n## 垃圾回收与引用释放\n\
  \n你可能已经知道，WebView 是垃圾回收环境。垃圾回收在应用生命周期内周期性发生，旨在在内存不再需要时将其释放回操作系统。关键在于，没有显式机制告诉垃圾回收器某对象不再需要；它会自行判断。如果对象没有其他引用，垃圾回收器会释放它。但如果对象哪怕只有一个引用，回收器也会保留它。\n\
  \n基于这一事实，避免不必要地持有对象的最佳做法是：在不再需要时将其设为 `null`。\n\n## 闭包与内存压力\n\n闭包也会导致内存压力。当函数继承其周围的词法环境时就会发生这种情况。例如，假设有如下代码：\n\
  \n```javascript\nfunction a() {\n  var anArray = [1,2,3];\n  function b() {\n  \
  \  console.log(anArray);\n  }\n  b();\n}\n```\n\n调用 `b` 时，你期望控制台输出 `[1, 2, 3]`。虽然这讲得通，但也意味着\
  \ `b` 持有对 `a` 存储数据的引用。在 JavaScript 中，特别是涉及事件处理和异步方法时，很容易捕获大量数据，因为我们经常在函数内部创建函数。每个函数都能访问其父级的词法环境；这会迅速累积。\n\
  \n通常这不是**巨大**问题，因为当父级不再被引用时，这些函数就会被删除。然而，当我们开始将事件监听器绑定到 DOM 元素时，情况就变得棘手了，因为此时父函数及其所有数据无法被释放，直到\
  \ DOM 元素也被移除且不再被任何其他事物引用。\n\n## 事件监听器清理\n\n在处理事件监听器时，必须始终做的一件事是：完成使用后从元素上移除处理程序。简而言之，每个\
  \ `addEventListener`（或类似方法）都应有对应的 `removeEventListener`。每个 `on` 都应有 `off`。这不仅减少了应用中意外行为的可能性，还允许浏览器释放监听器保留的所有内存。\n\
  \n## 释放不需要的变量\n\n有时问题不在于持有内存时间过长，而在于持有的内存过多。浏览器在优化此方面正变得更好，它们会保留方法实际引用的词法作用域中的变量；但这远非完美。因此，如果词法作用域中有**方法不需要的**大型对象，应将其设为\
  \ `null` 以释放内存。\n\n## 进阶阅读\n\n有许多文章值得深入研读：\n\n*   JavaScript 内存性能分析：[`developer.chrome.com/devtools/docs/javascript-memory-profiling`](https://developer.chrome.com/devtools/docs/javascript-memory-profiling)\n\
  *   内存管理：[`developer.mozilla.org/en-US/docs/Web/JavaScript/Memory_Management`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Memory_Management)\n\
  *   修复 AngularJS 和其他 JavaScript 应用中的内存泄漏：[`www.codeproject.com/Articles/882966/Fixing-Memory-Leaks-in-AngularJS-and-other-JavaScr`](http://www.codeproject.com/Articles/882966/Fixing-Memory-Leaks-in-AngularJS-and-other-JavaScr)\n\
  *   高性能、垃圾回收器友好的代码：[`buildnewgames.com/garbage-collector-friendly-code/`](http://buildnewgames.com/garbage-collector-friendly-code/)\n\
  \n# 长时间计算处理\n\n大量数据录入和生产力类应用通常是在等待用户操作，而非相反。然而，如果你的应用执行长时间计算（无论何种），你很可能会遇到令人恐惧的应用冻结现象。\n\
  \n\n\n\n# JavaScript 性能与运行循环\n\n## JavaScript 的单线程本质\n\nJavaScript 本身是单线程的。这意味着你的代码一直拥有控制权，直到它将控制权交还给浏览器，此时浏览器才能开始渲染\
  \ DOM 和检测事件。这些事件通常会触发更多的代码，循环往复。\n\n## 运行循环问题\n\n通常，你的代码执行得足够快，用户不会察觉。也就是说，他们会在你的应用中滚动、切换视图或点击按钮。希望他们不会注意到你的代码何时在运行。但如果你需要进行一个耗时超过\
  \ 16.67 毫秒的复杂计算，他们就会开始注意到，因为你会再次看到视觉上的卡顿。\n\n问题在于 JavaScript 使用的运行循环。当你的代码拥有控制权时，浏览器无法响应任何用户输入，也无法渲染任何\
  \ DOM 元素。如果你的应用正在运行一个耗时不长的短计算，这只会看起来像一个小的视觉故障。但如果是长时间计算，用户会认为你的应用已冻结。虽然你的应用*并没有*冻结，但用户无法分辨，因为所有的输入和输出都已停止。\n\
  \n## 长时间计算的性能分析\n\n性能分析再次变得有用，它显示的方式与渲染缓慢非常相似。但你将处于更有利的位置来区分二者，因为你刚刚执行了一个导致长时间计算的操作。例如，如果你点击一个名为“计算大素数”的按钮，你会知道如果设备随后暂停几秒钟，很可能是因为它在执行你要求的操作，而不是因为你的\
  \ DOM 过于复杂，或者你使用的 CSS 样式过度占用了 GPU。不过，你可以在此期间使用性能分析器来确定各个方法的持续时间，这为你提供了优化目标。\n\n\
  ## 优化策略\n\n优化高度依赖于你的代码，因此我们无法给出具体的指导方向。不过，还有几件事你可以做来帮助解决这个问题：\n\n*   将任务拆分成可在短时间内执行的离散任务（使用\
  \ `setInterval` 或 `requestAnimationFrame`）。\n*   使用 `Web Workers`。遗憾的是这超出了本章的范围，但以下网站有大量优秀信息：\n\
  \    *   使用 Web Workers：`https://developer.mozilla.org/en-US/docs/Web/API/Web_Workers_API/Using_web_workers`\n\
  \    *   Web Workers 基础：`http://www.html5rocks.com/en/tutorials/workers/basics/`\n\
  \n`Web Workers` 在大多数现代设备上受支持，因此建议将长时间运行的计算放在 worker 中。这模拟了多线程，因为 worker 拥有自己的运行循环。这样浏览器的循环就能保持对用户输入的响应。\n\
  \n### 将任务拆分为离散单元\n\n将任务拆分可以达到类似的效果，尽管这要求任务可以拆分成离散的部分。考虑一个简单的例子：\n\n```javascript\n\
  function countToX(x) {\n  var i = 0;\n  while (i < x) {\n    i++;\n  }\n  console.log(\"\
  done!\");\n}\n```\n\n这个例子不做任何*有用*的事情，但它很好地说明了问题。如果我们用一个小值调用此方法，用户不会注意到任何东西，因为计算机可以非常快地向上计数。然而，如果我们用一个足够大的值调用它（而且需要相当大），用户会注意到设备在任务进行期间冻结了。\n\
  \n然而，我们可以将其拆分成小任务：\n\n```javascript\nfunction countToX(x) {\n  var i = 0;\n  var\
  \ intervalId;\n  function countALittleBit() {\n    var j = 0;\n    while (j < 10)\
  \ {\n      if (i < x) {\n        i++;\n        j++;\n      } else {\n        console.log(\"\
  done\");\n        clearInterval(intervalId);\n        j = 10;\n      }\n    }\n\
  \  }\n  intervalId = setInterval(countALittleBit, 0);\n}\n```\n\n现在，无论我们传递给 `countToX`\
  \ 的数字有多大，浏览器将始终保持对用户的响应。任务本身将花费更长时间，也许长得多，但用户仍然可以与应用交互。\n\n本质上，重要的是：保持方法的运行时间短。不要在代码中执行*过于*冗长的计算，除非将其拆分成单独的部分或使用\
  \ `Web Workers`。\n\n## 本章小结\n\n本章涵盖了大量内容，从阐明我们使用“性能”一词的含义，到桌面设备、模拟器和真机之间的各种差异。我们还涉及了如何对应用进行性能分析，并概述了一些常见问题及其解决方法。\n\
  \n在下一章中，我们将开始通过创建应用图标和启动画面资源，为将应用提交到 Apple App Store 和 Google Play 商店做准备。\n"
- "# 应用图标和启动画面\n\n## 概述\n\n毫无疑问，你已经看过 Cordova/PhoneGap 项目使用的默认启动画面和图标。这些在开发期间已足够；但当你准备向大众发布应用时，你需要合适的图形资源。这些资源分为三类：应用图标、启动画面和应用内图形。我们已经在\
  \ 第 4 章 *更响应式的设计* 中一定程度上讨论了如何使你的应用内图形响应用户的设备。我们讨论的一些内容也适用于你应用的图标和启动画面。然而，这些特定资源需要特殊配置，以确保\
  \ Cordova/PhoneGap 正确使用它们。\n\n## 本章主题\n\n在本章中，我们将涵盖以下主题：\n\n*   应用图标要求\n*   创建应用图标\n\
  *   启动画面要求\n*   创建启动画面\n*   配置你的应用\n*   实用资源\n\n## 设计工具考量\n\n本章假设你有一定的图形设计应用经验，如\
  \ Adobe Photoshop、Adobe Illustrator、GIMP、Sketch 等。如果你还不熟悉此类应用，你应该考虑找一个支持*矢量*插图的应用。有许多应用是*位图*基础的，即你控制结果图像中的每个像素。由于移动设备屏幕尺寸和分辨率变化迅速，以分辨率无关的方式开发图像更安全，这样你可以在特定分辨率下生成新图像而不损失细节。\n\
  \n### 注意\n\n如果你听说过*位图*图像，重要的是要知道这些是光栅图像。\n\nAdobe Photoshop 常用于此任务，尽管它不是纯矢量图形编辑器。Photoshop\
  \ 的大多数功能针对光栅图像，但 Photoshop 内置了足够的矢量支持，能够创建分辨率无关的图像。在创建应用图标和启动画面时，也有大量可用的 Photoshop\
  \ 资源，这进一步简化了它们的开发。\n\n从技术上讲，*任何*图形编辑器当然都可以创建图标和启动画面。因此，你不必在本章中使用 Adobe Photoshop。虽然我们的示例将使用\
  \ Photoshop，但大多数图形编辑器都有我们将使用的工具的对应物。如果你需要寻找矢量编辑器，请查看本章末尾的*实用资源*部分。\n\n## 应用图标的重要性\n\
  \n你的应用图标是一个非常重要的图形资产。它通常是用户在移动设备上启动你的应用的方式。因此，它必须很容易从用户屏幕上的其他图标中区分出来。对于游戏或高度图形化的应用，图标可能是应用本身的更直观表现。但对于许多其他应用，图标是一种抽象表现。如果你的应用有一个可识别的品牌，图标可以是品牌的变体，如\
  \ Facebook、Twitter 等的应用图标。\n\n\n\n# 应用图标设计指南\n\n## 跨平台考量\n\n您的应用所支持的每个平台对图标都有不同的*物理*要求。但在大多数情况下，各平台的审美大体相同，唯一的区别在于尺寸以及是否有圆角（以及圆角的程度）。在许多方面，这使得设计跨平台图标变得相当容易。只要避开圆角，针对各种不同尺寸进行设计并不困难。这并不是说您的图标在各平台上必须完全一致。在某些情况下，您可能需要为每个平台微调图标（一个在略微方正的圆角下看起来不错的图标，在圆角下可能就不那么好看了）。\n\
  \n## iOS 图标要求\n\n在介绍如何创建图标之前，我们首先需要解决关于物理尺寸的各种要求。每个平台都要求我们为各种系统用途生成不同尺寸的图标。让我们逐一了解，从\
  \ iOS 开始：\n\n| 类别 | 尺寸 (dpi) |\n| --- | --- |\n| 在设置应用中使用的图标 | 29 × 29 (@1x), 58\
  \ × 58 (@2x), 87 × 87 (@3x) |\n| 在 Spotlight 搜索中显示 | 40 × 40 (@1x), 80 × 80 (@2x),\
  \ 120 × 120 (@3x) |\n| 在主屏幕上显示 | 76 × 76 (@1x iPad), 152 × 152 (@2x iPad), 120 ×\
  \ 120 (@2x iPhone), 180 × 180 (@3x iPhone) |\n| 向后兼容性 (<= iOS 6.1) | 57 × 57 (@1x\
  \ iPhone), 114 × 114 (@2x iPhone), 72 × 72 (@1x iPad), 144 × 144 (@2x iPad), 100\
  \ × 100 (@2x iPad, 设置应用) |\n| App Store | 1024 × 1024 |\n\n并非每个图标都是必需的。从技术上讲，如果您以\
  \ iOS 6.2 或更高版本为目标，只需向 App Store 提供 `1024 × 1024` dpi 图标，向应用提供 `120 × 120` dpi 图标即可；如果以\
  \ iOS 6.1 或更低版本为目标，则需提供 `57 × 57` dpi 图标。但其他图标都标记为推荐，尽管它们是可选的，且 `Cordova/PhoneGap`\
  \ 应用模板已经为您定义了好几个。您要么需要移除所有未使用的图标，以确保默认图标不会在意外的位置显示，要么应该覆盖所有图标。我倾向于后者，即使生成多个版本的图标稍微麻烦一些。\n\
  \n## Android 图标要求\n\n对于 Android，情况类似，但变体没有那么多。从技术上讲，Android 也只需要一个图标。但为了获得最佳效果，您应该提供以下尺寸的图标：\n\
  \n| DPI | 分辨率 |\n| --- | --- |\n| mdpi | 48 × 48 |\n| hdpi | 72 × 72 |\n| xxdpi\
  \ | 96 × 96 |\n| xxxhdpi | 144 × 144 |\n| xxxxhdpi | 192 × 192 |\n| Google Play\
  \ 商店 | 512 × 512 |\n\n与 Apple 类似，您还需要为 Google Play 商店创建一个应用版本图标。该图标尺寸应为 `512 × 512`。\n\
  \n## 为何多种尺寸很重要\n\n您可能会问，为什么我们要担心这么多不同的尺寸。在大多数情况下，将图标从大尺寸源分辨率缩小到小尺寸会生成一个可用的图标，但不可避免会丢失细节。当然，我们通常会为此做计划，并在设计大尺寸图标时预期它们稍后会被缩小。这在一定程度上行得通，直到遇到这些极小图标的问题。如果在\
  \ `72 × 72` 的图标中渲染了大量细节，这些细节在 `48 × 48` 或 `29 × 29` 像素的图标中会模糊在一起。因此，两个平台都允许您根据需要对这些较小的图标进行微调。从技术上讲，反向操作也可行。您可以为高分辨率图标添加更多细节，尽管这里存在视觉极限。较大尺寸的图标通常显示在大致相同的物理空间内，而眼睛所能感知的细节是有限的。\n\
  \n## 自动化工具\n\n幸运的是，在大多数情况下，我们可以自动化创建各尺寸图标的过程，然后根据需要进行微调。本章末尾的*实用资源*部分提供了一些有用的 `Photoshop`\
  \ 动作（本质上是宏）和其他实用工具。\n\n## 优秀应用图标的原则\n\n创建一个脱颖而出的应用图标不一定容易，而且我们在本章中无法真正涵盖*如何*做到这一点。这需要创造力，并没有一套能保证产生创意结果的步骤。但有一些通用的理念可供您用来创建适合您应用的图标。\n\
  \n以下是您通常在优秀应用图标中能发现的特质：\n\n*   **图标呼应品牌或徽标。** 请注意，这并不等同于说图标*就是*您的品牌或徽标（例如，您的品牌或徽标可能无法在不修改的情况下适应图标的尺寸）。此外，这仅在品牌或徽标广为人知时才有效（如\
  \ Facebook、Twitter 等）。\n\n*   **图标具有辨识度。** 也就是说，图标不应看起来太像用户设备上可能安装的其他应用。这通常意味着您不应制作一个颜色和字体与\
  \ Facebook 图标过于相似的图标。不是因为您*不能*这么做，而是因为用户可能会轻易搞不清他们要启动的是哪个应用。\n\n*   **图标符合平台审美。**\
  \ 当前的设计趋势多为扁平化（尽管阴影和图层效果依然存在）。高度拟物化的设计已过时，在其他图标通常为扁平化的平台上，它们会显得格格不入。虽然使用拟真图标可能让您的应用图标脱颖而出，但也可能给用户留下负面印象，认为该应用过时且追随旧设计潮流。\n\
  \n*   **图标清晰可辨。** 您的图标将在设备上以多种不同尺寸显示，并且必须在所有这些尺寸下保持清晰可辨且易于识别。例如在 iPhone 上，您的图标在设置应用中可能只占小指指甲大小的空间，而在主屏幕上可能占大拇指指甲大小的空间。在\
  \ App Store 等其他地方，它可能以更大的尺寸渲染。因此，您的图标需要在各种比例下都易于识别。\n\n*   **图标引人入胜。** 除非您的应用与黑白照片处理有关，或是一款以单色为主的游戏，否则您的应用图标最好包含一些颜色。从您应用本身使用的颜色中汲取灵感是个好的开始。\n\
  \n*   **图标代表您的应用。** 您的图标应以一种切实、有意义的方式与您的应用建立联系。不要总是选择最显而易见的方案；例如，相机应用并不*总是*需要用相机作为应用图标，但用户必须能看到图标并将其与您的应用联系起来。这就是为什么使用品牌或徽标仅在它们广为人知时效果才好；用户已经建立了固有的联系。大多数应用没有这种奢侈条件。\n\
  \n*   **图标专业。** 这当然有主观性，且很难用文字描述清楚，因为没有一套步骤能保证结果。简而言之，图标看起来必须像是经过精心设计的。元素应适当对齐，文本应调整字距，图像和形状应按正确的宽高比渲染，等等。我们不是每个人都是杰出的艺术家，但仅将事物在网格上对齐并确保文本正确渲染，就能在很大程度上改善用户感知。\n\
  \n## 图标示例\n\n让我们看看一些符合上述标准的优秀图标，以及一些还有改进空间的图标：\n\n![创建应用图标](img/9781OS_11_01.jpg`)\n\
  \n\n\n这些图标都不算不专业。它们看起来都不错，但有些在与其代表的应用建立联系方面做得比其他的好。第一行中的图标是极好的例子，它们非常出色地代表了各自的应用。它们令人难忘、不过度拟物化、在各种尺寸下都易于辨识、引人入胜，且能代表应用及其关联品牌。**Tweetbot**\
  \ 图标很容易被拟人化，这让联系变得更加容易。另一方面，**Flipboard** 则利用了他们的品牌形象。注意它不是一个简单的 *F*，而是一个风格化的版本，也暗合了文章在应用内呈现的方式。最后，虽然\
  \ **Slack** 的图标确实用了一个 *S*，但其颜色与他们的品牌和应用体验相匹配。\n\n然而，第二行中的图标虽然专业，但还有改进空间。我打赌你猜不出第一个图标应该代表什么。我最初猜测是待办事项或任务列表应用。不过我猜错了。该应用实际上是关于求职的。从应用标题来看稍微明显一点，但即便如此；打勾标记并不能自动造就一个好图标。中间的图标代表一个基于云的服务，这没问题，但云服务有很多。此外，还有很多其他应用使用云作为符号，这意味着这个特定的图标与该应用的关联性非常小。最后，我们看看右侧的图标。虽然它符合应用的配色方案，但除了告诉用户标题以\
  \ *S* 开头外，它没有传达任何关于应用的信息。字形没有经过高度风格化处理以使其成为标志性图标。因此，用户将很难记住这个图标会启动 **Stripe Dashboard**\
  \ 应用。\n\n最后，第三行是一些游戏应用的优秀图标。制作一个糟糕的游戏图标并非不可能，但游戏通常很容易就能产出好的图标。在每个例子中，图标都准确地代表了游戏世界本身，它们都令人难忘，且让人很容易与每个游戏建立联系。\n\
  \n既然我们稍微聊了聊什么构成了好的应用图标，现在让我们看看我为本书代码包中的演示应用 Logology 所用的一个小设计流程。我最初的设计不会完美——它们是概念验证。一旦我找到喜欢的设计，我总能进一步完善图标。\n\
  \n你的概念验证不需要在用于创建最终版本图标的同一个编辑器中完成。许多设计师喜欢先在纸上草拟想法，或使用其他能让用户快速摆弄形状和颜色的应用。就我个人而言，在这个阶段我同时使用\
  \ Omnigraffle（类似于 Microsoft Visio）和 Adobe Photoshop，偶尔也会在纸上草拟。让我们看看一些初步尝试：\n\n![创建应用图标](img/9781OS_11_02.jpg)\n\
  \n这里有些想法很有前景，也有些则不然。有一件事你永远不必害怕，就是把你的想法记在纸上，甚至包括那些你不喜欢的。有时，在脑海中构想行得通的东西，在纸上却行不通，*反之亦然*。允许自己摆弄各种想法，即使你最初认为它们不会有什么结果。你可能会让自己大吃一惊。\n\
  \n即使你已经确定了自认为最好的想法，你最好还是同时开发至少两个图标。这能让你稍后进行 A–B 测试，看看你的 Beta 测试员对你的图标有何看法。他们可能更喜欢与你不同的东西。虽然选项太多会让人无从下手，但少数几个选项（比如两三个）无妨。\n\
  \n既然我们有了一些想法，是时候在支持矢量编辑的编辑器中开始设计图标了。无论你的应用面向哪个平台，你都应该从一个*正方形*画布开始。你可能会发现，在正方形上叠加各种网格有助于布局。我们将在本章的*实用资源*部分提到其中一些。\n\
  \n![创建应用图标](img/9781OS_11_03.jpg)\n\n上图展示了我们创建这个特定图标所采取的大致步骤。让我们快速过一遍这些步骤：\n\n1.\
  \  第一张图（左上角）显示了正方形画布上的空白网格。在我们的例子中，正方形是 1024 × 1024 像素。从技术上讲，几乎所有工作都将使用矢量完成，所以你使用什么分辨率其实无关紧要，只要它是正方形即可。\n\
  2.  下一步（上中）显示了应用于背景的色彩渲染。在我们的例子中，我们使用了一种纯色，比我们应用的导航栏稍亮一些。许多图标会对背景使用渐变，但在我们的例子中纯色效果最好。\n\
  3.  接下来，我们开始应用符号。在本例中，我们添加了代表名词的 *n*。这有点抽象，但 *l* 就词典定义而言并不真正代表任何含义。\n4.  在中间行的开头，你可以看到我们应用了重音符号。我们用爱心代替了在词典中缩写名词后通常会有的句号。\n\
  5.  结果仍然有点平淡，所以为了稍微改善一下，我们添加了一些长阴影，正如你在中间图片中看到的那样。\n6.  随着流程完成，我们移除了网格线，从而获得了无遮挡的视图。\n\
  \n你可以在左下角看到 iOS 图标，在右下角看到 Android 图标。两者有一些差异，主要包括：\n\n*   iOS 图标填满整个画布，且具有非常圆的角。圆角效果实际上是由操作系统生成的，所以我们实际上是将*正方形*图标与应用打包在一起，而不是带圆角的图标。\n\
  *   Android 图标不填满整个画布，与 iOS 相比具有相对较尖的角。Android 期望我们提供在设备上显示的最终样子，所以我们必须提供圆角和间距。\n\
  \n### 提示\n\niOS 强制主屏幕上的网格元素之间保持分离，且不允许应用图标有透明度。因此，你有责任填满整个图标画布。然而，Android 期望你在画布内应用一些间距，以便你的图标与其他图标有所分离。由于\
  \ Android 支持将透明度作为应用图标的一部分，这让你可以在图标形状上发挥极大的创意。\n\n现在我们有了图标，需要将其打包进应用。不幸的是，iOS 和\
  \ Android 都需要生成许多不同版本的图标。手动操作很痛苦，所以我们可以利用各种 Photoshop 动作（你的工具可能称之为“宏”）来为我们生成所有图标尺寸。你可以在本章末尾的*实用资源*部分看到我们使用的各种动作。\n\
  \n与应用图标不同，启动屏幕仅在应用实际加载到设备内存时短暂出现。这意味着它可见的时间不长。如果显示时间太长，你就已经有麻烦了。因此，启动屏幕可能*不是*展示过于复杂或花哨内容的最佳位置。启动屏幕的全部意义在于掩盖启动应用所需的时间，并在\
  \ iOS 上给人一种应用加载速度比实际快得多的印象。在 Android 上，许多应用完全不使用启动屏幕。但由于 Cordova/PhoneGap 应用初始化底层\
  \ Web 视图的方式，启动屏幕仍然是你想要使用的东西。\n\n### 注意\n\n在 Android 上，应用的系统 Web 视图往往需要片刻来初始化。在此期间，你的应用可能会呈现不理想的显示（类似于使用某些网站时有时出现的无样式内容闪烁）。因此，强烈建议使用启动屏幕，以免最终用户看到任何闪烁或渲染错误的内容。\n\
  \n\n\n\n从技术上讲，你的启动画面可以只是一个简单的黑色背景，这也能工作。如果你的应用背景颜色是黑色，你确实可以这样做。如果你的应用有白色背景，黑色的启动画面会有点分散注意力，所以你应该努力让启动画面与你的应用界面相匹配。\n\
  \n苹果的想法是，你的启动画面应该看起来像应用已经加载进内存，但尚未填充数据。这给人一种应用加载很快的印象，但这其实是个把戏；此时你的应用仍然无响应。就我个人而言，从最终用户的角度来看，这有点令人沮丧，因为它似乎让应用的加载时间感觉比原本更慢。我倾向于比应用预期的更早地开始与采用这种方式的应用进行交互，所以当应用最终初始化完成时，我不得不重复我的操作。\n\
  \n### 提示\n\n大多数设备都有一个**看门狗**，确保你的应用在一定时间内启动。例如，在 iOS 上，如果你的应用在十秒内未完成启动，你的应用将被自动终止。操作系统判定如果应用在该时间段内保持无响应则已崩溃，为了防止用户不得不手动终止应用，操作系统会替他们做这件事。\n\
  \n大多数应用开发者会转而创建一些稍微抽象但仍能代表其应用的东西。应用使用的颜色会出现在启动画面上，但启动画面的其余部分可能无法准确反映应用的实际外观。虽然苹果不赞成这种启动画面，但大多数应用都属于这一类，所以显然苹果并不太在意你是否遵循他们关于此问题的指南。\n\
  \n其他应用会将启动画面作为一个机会来大展身手。这在游戏中最为常见，但启动画面其实并非为了*延迟*用户与应用的交互，它纯粹是为了掩盖加载时间。因此，如果你的应用加载很快，你的用户可能永远无法注意到你艺术设计的精细细节。简而言之：保持简单，而非复杂。此外，游戏通常会快速连续渲染*多个*启动画面。例如，发行商可能独占一个画面，而开发公司可能获得另一个。实际的游戏画面可能会在启动菜单之前显示。这种特定的启动画面用法应由你的应用处理，*而非*操作系统。因此，你最好使用一个非常简单的启动画面（也许只是像许多任天堂游戏中看到的“Your\
  \ Publisher presents”信息）。\n\n这转化为几种不同风格的启动画面。让我们看看其中几种：\n\n![启动画面要求](img/9781OS_11_04.jpg)\n\
  \n正如你所见，第一个启动画面（左上）非常平淡。它是纯色，仅此而已。在这种情况下，如果我们的演示应用没有数据，它将与应用的背景颜色匹配。这不那么是为了展示我们一直在谈论的未填充用户界面；它只是试图防止从一种颜色到另一种颜色的突兀过渡。如果我用了黑色，从启动画面到应用的过渡将极其明显。\n\
  \n第二个启动画面（右上）更进一步。在这种情况下，我添加了应用名称和一句标语。这些从未以这种特定形式出现在应用中，但它告诉用户：*是的，应用正在加载，顺便说一句，你启动的是正确的应用*。\n\
  \n第三个启动画面（左下）开始基于未填充用户界面的隐喻工作。顶部有一个橙色条，正好位于应用中导航栏的位置。过渡到应用将是几乎无缝的，除了应用标题和标语的消失。\n\
  \n最后一个启动画面（右下）开始变得更抽象一些。颜色仍然相同，但我放弃了导航栏的概念。取而代之的是两种不同颜色以某种方式分割屏幕（像一本书），应用标题强加在这两种颜色的分界线上，产生一种反相效果。这*绝对不是*我们的应用在无数据时的样子，但启动画面依然有效。\n\
  \n就像你的应用图标一样，你的启动画面需要以各种分辨率渲染。对于每个平台，这意味着创建一个与你的应用所针对的各种屏幕尺寸和方向相匹配的启动画面。在 iOS 上，这加起来有相当多的版本。你在\
  \ Android 上也会遵循相同的示例，但你也可以使用九宫格图片。\n\n### 提示\n\n九宫格图片是*可调整大小*的光栅图片。你可以通过它们的扩展名识别它们：`.9.png`。它们是\
  \ PNG 文件，所以从技术上讲你可以在任何编辑器中创建它们。边框周围是一系列黑白像素。这些像素告诉 Android 图片的哪些部分可以缩放，哪些部分应始终保持相同大小。这允许你创建一个完全填充任何设备屏幕的启动画面，同时不会拉伸重要内容（如徽标或其他用户界面元素）。我们将在本章后面介绍创建这些图片。\n\
  \n此时应该很明显，为每种不同的分辨率创建大量版本的启动画面可能非常耗时。如果你将重要内容保持在画布中心附近，你可能能够使用一些工具为你创建这些图片（我在章节末尾列出了一些）。但如果你的内容靠近边缘（如导航栏），你将不得不自己做这项艰苦的工作。在前面的示例中，这使得第三个启动画面最难导出。\n\
  \n让我们快速浏览一下 iOS 所需的分辨率：\n\n| 设备 || 竖屏 || 横屏 |\n| --- | --- | --- |\n| iPhone (@1x)\
  \ || 320 × 480 || 不适用 |\n| iPhone 4, 4s (@2x) || 640 × 960 || 不适用 |\n| iPhone 5,\
  \ 5s (@2x) || 640 × 1136 || 不适用 |\n| iPhone 6, 6s (@2x) || 750 × 1334 || 1334 ×\
  \ 750 |\n| iPhone 6+, 6s+ (@3x) || 1242 × 2208 || 2208 × 1242 |\n| iPad (@1x) ||\
  \ 768 × 1024 || 1024 × 768 |\n| iPad (@2x) || 1536 × 2048 || 2048 × 1536 |\n| iPad\
  \ Pro (@2x) || 2048 × 2732 || 2732 × 2048 |\n\nAndroid 也有几个不同的建议启动画面分辨率，如下所示：\n\n\
  | DPI || 竖屏 || 横屏 |\n| --- | --- | --- |\n| ldpi || 200 × 320 || 320 × 200 |\n|\
  \ mdpi || 320 × 480 || 480 × 320 |\n| hdpi || 480 × 800 || 800 × 480 |\n| xhdpi\
  \ || 720 × 1280 || 1280 × 720 |\n\n这些尺寸不是铁律。Android 设备有许多不同的屏幕尺寸和像素密度。这就是为什么我们要使用九宫格图片：它们可以缩放以适应任何设备尺寸，而不会扭曲内容。\n\
  \n正如我们提到的，iOS 和 Android 对于启动画面应该是什么、甚至是否需要启动画面都有不同的看法。真正重要的是要知道，无论是苹果还是谷歌，在启动画面方面都*不*特别*要求*你遵守他们的指南。对苹果来说尤其如此，重要的是启动画面存在即可。他们*不会*检查它是否与你的用户界面在无数据时的样子相匹配。\n\
  \n对于我们的应用，我们将采用稍微抽象的启动画面方法（前一节中的第四个启动画面）。这让我们可以通过使用自动化工具而不是全手动来简化所有各种分辨率启动画面的导出。\n\
  \n我们无法涵盖创建初始启动画面所涉及的*所有*步骤，因为它们会根据你的用例、你的应用用户界面和你的图形编辑器而有所不同，但我们可以从高层面介绍你必须做的事情。你应该能够查看我的源图片和输出图片，以了解我的效果如何。\n\
  \n\n\n\n# 创建启动画面和应用图标\n\n## 设计启动画面\n\n1. 我做的第一件事是创建一个 3072 x 3072 像素的正方形空白画布。这让我能够适配市场上现有的\
  \ `@3x` 设备。与图标一样，画布有多大其实并不重要，只要它是正方形即可，因为你应该尽可能多地使用基于矢量的形状来设计启动画面。\n\n2. 接着，我添加了一个新图层，用纯背景色填满整个画布。我使用了与应用相同的背景色，以便从启动画面过渡到实际应用时不会显得突兀。\n\
  \n3. 然后，我添加了一个矢量形状填满画布的上半部分，并用应用的导航栏颜色填充它。\n\n4. 然后，我将应用标题放在画布中心。我用刚创建的形状的副本（以及其反选区）对其进行遮罩，以便在文本上创建反相效果。根据你的颜色搭配，你也可以直接使用混合模式来获得相同（或相似）的效果。\n\
  \n5. 在应用标题下方，我添加了一行标语。\n\n此时，我们已准备好导出启动画面。我使用了 **Ape Tools—Image Gorilla**（链接见章节末尾）来创建启动画面的各种尺寸。之所以能这么做，仅仅是因为内容位于启动画面的正中央。\n\
  \n这在 iOS 上效果很好，因为你确切知道应用可能会遇到哪些屏幕分辨率。而在 Android 上，你根本不知道会遇到什么屏幕分辨率。你可以以典型尺寸为目标（这也是自动化工具所做的），但如果启动画面显示在不符合这些尺寸的设备上，你可能会看到黑边，或者启动画面的一部分被裁剪。这就是\
  \ **九宫格图片** 派上用场的地方。\n\n## Android 的九宫格图片\n\n要创建九宫格图片，你需要给 `PNG` 文件添加一个单像素的透明边框。在右侧和底部，你可以绘制一行黑色像素，同时保持角落像素透明。这是\
  \ **填充区域**，即 Android 在填充屏幕时会使用的图片部分。在顶部和左侧，你各绘制两行黑色像素，每一行覆盖图片中不可缩放的内容。这被称为 **缩放区域**。Android\
  \ 会自由缩放这些线相交区域的内容以填满整个屏幕。剩余的透明区域不会被缩放，因此内容不会变形。\n\n谈到九宫格图片，有个可视化参考总是有帮助的。下图展示了演示应用启动画面的单像素边框样子（此处边框已放大，以便你更清晰地查看）：\n\
  \n![Creating a Launch Screen](img/9781OS_11_05.jpg)\n\n### 注意\n\n输出图片中边框的白色部分应为*透明*，而非白色。\n\
  \n保存九宫格图片时，应使用 `.9.png` 扩展名，以便 Android 知道该图片可缩放。此外，边框*必须*宽一像素，否则它会开始在屏幕上渗漏到图片中。\n\
  \n虽然你可以在任何光栅编辑器（如 Adobe Photoshop、GIMP 等）中创建九宫格图片，但也有一些专门的工具可协助创建此类图片。我在本章末尾列出了一些。\n\
  \n## 项目目录结构\n\n现在我们已经创建了应用的图标和启动图片，需要配置应用以使用它们。这两种情况都需要将导出的文件重命名为特定名称，并移入特定目录。然后，我们将编辑配置文件以指向这些文件。\n\
  \n如果你下载了本书的代码包，或者使用典型的 Cordova/PhoneGap 模板创建了应用，那么你很可能已经拥有配置应用所需的目录结构。如果没有，结构应如下所示：\n\
  \n```\n<project root>\n`-- src\n    |-- config.xml\n    |-- res\n    |   |-- icon\n\
  \    |   |   |-- android\n    |   |   `-- ios\n    |   `-- splash\n    |       |--\
  \ android\n    |       `-- ios\n    `-- www\n```\n\n### 提示\n\n如果你打算使用 PhoneGap Build，还应在\
  \ `www` 目录中创建符号链接指向 `src/res`。这将允许 PhoneGap Build 访问图片文件。\n\n## 配置图标和启动画面\n\n如果你使用的是我们应用的代码，可能还记得我们大量使用\
  \ `package.json` 文件进行配置。这比折腾 XML 要简单一些。为了使用我们创建的图片，我们有如下代码片段（完整版本在本书的代码包中）：\n\n\
  ```json\n{\n    \"cordova\": {\n        \"icon\": {\n          \"ios\": [\n    \
  \        { \"src\": \"res/icon/ios/icon-60.png\", \n                \"w\": 60, \"\
  h\": 60 },\n            { \"src\": \"res/icon/ios/icon-60@2x.png\", \n         \
  \       \"w\": 120, \"h\": 120 },\n            { \"src\": \"res/icon/ios/icon-60@3x.png\"\
  , \n                \"w\": 180, \"h\": 180 },\n            ...\n          ],\n \
  \         \"android\": [\n            { \"src\": \"res/icon/android/ldpi.png\",\
  \ \"d\": \"ldpi\" },\n            { \"src\": \"res/icon/android/mdpi.png\", \"d\"\
  : \"mdpi\" },\n            ...\n          ]\n        },\n        \"splash\": {\n\
  \          \"ios\": [\n            { \"src\": \"res/splash/ios/Default~iphone.png\"\
  , \n                \"w\": 320, \"h\": 480 },\n            { \"src\": \"res/splash/ios/Default@2x~iphone.png\"\
  , \n                \"w\": 640, \"h\": 960 },\n            { \"src\": \"res/splash/ios/Default-Portrait~ipad.png\"\
  , \n                \"w\": 768, \"h\": 1024 },\n            ...\n          ],\n\
  \          \"android\": [\n            { \"src\": \"res/splash/android/splash-land-ldpi.9.png\"\
  , \n              \"d\": \"land-ldpi\" },\n            { \"src\": \"res/splash/android/splash-land-mdpi.9.png\"\
  , \n              \"d\": \"land-mdpi\" },\n            { \"src\": \"res/splash/android/splash-land-hdpi.9.png\"\
  , \n              \"d\": \"land-hdpi\" },\n            ...\n          ]\n      \
  \  }, ...\n    }\n}\n```\n\n另一方面，如果你使用 `config.xml`，可以用以下方式实现相同功能：\n\n```xml\n<icon\
  \ src=\"res/icon/ios/icon-60.png\" platform=\"ios\" \n width=\"60\" height=\"60\"\
  \ />\n<icon src=\"res/icon/ios/icon-60@2x.png\" platform=\"ios\" \n width=\"120\"\
  \ height=\"120\" />\n<icon src=\"res/icon/ios/icon-60@3x.png\" platform=\"ios\"\
  \ \n width=\"180\" height=\"180\" />\n...\n<icon src=\"res/icon/android/ldpi.png\"\
  \ platform=\"android\" \n density=\"ldpi\" />\n<icon src=\"res/icon/android/mdpi.png\"\
  \ platform=\"android\" \n density=\"mdpi\" />\n...\n<splash src=\"res/splash/ios/Default~iphone.png\"\
  \ platform=\"ios\" \n width=\"320\" height=\"480\" />\n<splash src=\"res/splash/ios/Default@2x~iphone.png\"\
  \ platform=\"ios\" \n width=\"640\" height=\"960\" />\n<splash src=\"res/splash/ios/Default-Portrait~ipad.png\"\
  \ \n platform=\"ios\" width=\"768\" height=\"1024\" />\n...\n<splash src=\"res/splash/android/splash-land-ldpi.9.png\"\
  \ \n platform=\"android\" density=\"land-ldpi\" />\n<splash src=\"res/splash/android/splash-land-mdpi.9.png\"\
  \ \n platform=\"android\" density=\"land-mdpi\" />\n<splash src=\"res/splash/android/splash-land-hdpi.9.png\"\
  \ \n platform=\"android\" density=\"land-hdpi\" />\n...\n```\n\n### 提示\n\n如果你使用\
  \ PhoneGap Build，XML 源代码会略有不同。请参阅本书代码包中的示例，或访问 [`docs.build.phonegap.com/en_US/configuring_icons_and_splash.md.html`](http://docs.build.phonegap.com/en_US/configuring_icons_and_splash.md.html)。\n\
  \n对于 Android，文件名本身并不重要。明智的做法是使用像素密度命名，以便区分不同文件。\n\niOS 则另当别论。每个图片的名称也非常重要。最好将文件重命名为以下名称：\n\
  \n## iOS 图标命名约定\n\n| 类型 | 分辨率 | 文件名 |\n|------|------------|----------|\n| 图标 |\
  \ 60 × 60 | `icon-60.png` |\n|      | 120 × 120 | `icon-60@2x.png` |\n|      | 180\
  \ × 180 | `icon-60@3x.png` |\n|      | 76 × 76 | `icon-76.png` |\n|      | 152 ×\
  \ 152 | `icon-76@2x.png` |\n|      | 40 × 40 | `icon-40.png` |\n|      | 80 × 80\
  \ | `icon-40@2x.png` |\n|      | 57 × 57 | `icon.png` |\n|      | 114 × 114 | `icon@2x.png`\
  \ |\n|      | 72 × 72 | `icon-72.png` |\n|      | 144 × 144 | `icon-72@2x.png` |\n\
  \n\n\n\n# 图标与启动画面规范\n\n| 设备/用途 | 尺寸 (像素) | 文件名 |\n| :--- | :--- | :--- |\n| 图标 |\
  \ 50 × 50 | `icon-50.png` |\n| 图标 | 100 × 100 | `icon-50@2x.png` |\n| 启动画面 | 320\
  \ × 480 | `Default~iphone.png` |\n| 启动画面 | 640 × 960 | `Default~iphone@2x.png` |\n\
  | 启动画面 | 768 × 1024 | `Default-Portrait~ipad.png` |\n| 启动画面 | 1536 × 2048 | `Default-Portrait~ipad@2x.png`\
  \ |\n| 启动画面 | 1024 × 768 | `Default-Landscape~ipad.png` |\n| 启动画面 | 2048 × 1536\
  \ | `Default-Landscape~ipad@2x.png` |\n| 启动画面 | 640 × 1136 | `Default-568h@2x~iphone.png`\
  \ |\n| 启动画面 | 750 × 1334 | `Default-667h.png` |\n| 启动画面 | 1334 × 750 | `Default-Landscape-667h.png`\
  \ |\n| 启动画面 | 1242 × 2208 | `Default-736h.png` |\n| 启动画面 | 2208 × 1242 | `Default-Landscape-736h.png`\
  \ |\n\n## 命名约定\n\n较新版本的 `iOS` 对图标和启动画面文件的命名宽容度大大提高，但早期版本并非如此。因此，遵循 `Apple` 建议的命名约定是一种良好的实践。\n\
  \n> **注意**\n>\n> `iPad Pro` 不支持光栅化启动画面，必须使用 `Storyboard` 启动画面。如果你想使用 `iOS 9` 的多任务处理功能，情况也是如此。遗憾的是，在撰写本书时，`Cordova`\
  \ 尚不支持 `Storyboard` 启动画面。\n\n## 常用设计工具\n\n几乎有太多支持矢量绘图的编辑器了，以下列出一些最流行的：\n\n### 纯矢量编辑器\n\
  \n*   **Adobe Illustrator** — <http://www.adobe.com/products/illustrator.html> (订阅制,\
  \ Windows 和 Mac OS X)\n*   **Affinity** — <https://affinity.serif.com/en-us/> (商业软件,\
  \ Mac OS X)\n*   **CorelDRAW** — <http://www.coreldraw.com/us/product/graphic-design-software/>\
  \ (商业软件, Windows)\n*   **DrawPlus** — <http://www.serif.com/drawplus/> (免费入门版和商业版,\
  \ Windows)\n*   **Inkscape** — <https://inkscape.org/en/> (免费, 跨平台)\n*   **Sketch**\
  \ — <http://bohemiancoding.com/sketch/> (商业软件, Mac OS X)\n\n### 支持矢量的位图编辑器\n\n*\
  \   **Adobe Photoshop** — <http://www.adobe.com/products/photoshop.html> (订阅制, Windows\
  \ 和 Mac OS X)\n*   **GIMP** — <http://www.gimp.org> (免费, 跨平台)\n*   **Photoline**\
  \ — <http://www.pl32.com> (商业软件, Windows 和 Mac OS X)\n\n### Photoshop 动作与模板\n\n\
  *   iOS 网格图标: <https://www.brownbagmarketing.com/ios-7-and-the-golden-ratio/>\n\
  *   长阴影动作: <https://dribbble.com/shots/1205511-Free-Long-Shadow-Photoshop-Action>\n\
  *   iOS App 图标模板 (含动作): <http://appicontemplate.com/ios8>\n*   Android App 图标模板\
  \ (含动作): <http://appicontemplate.com/android>\n\n### 九宫格编辑器\n\n*   **Draw 9-patch**\
  \ (随 Android SDK 提供) — <http://developer.android.com/tools/help/draw9patch.html>\n\
  *   **Simple nine-patch generator** (在线工具) — <https://romannurik.github.io/AndroidAssetStudio/nine-patches.html>\n\
  *   **Nine-patch editor** (Java) — <https://github.com/mgarin/weblaf/releases> (下载并运行\
  \ `ninepatch-editor-1.28.jar`)\n\n### 自动化工具\n\n*   **MakeAppIcon** — <http://makeappicon.com/>\
  \ (仅限 App 图标)\n*   **Icon Generator** — <http://icon.angrymarmot.org> (仅限 App 图标)\n\
  *   **Ape Tools** — <http://apetools.webprofusion.com/tools/imagegorilla> (App 图标和启动画面)\n\
  \n### 灵感来源\n\n*   <http://www.iconsfeed.com>\n*   <http://iosicongallery.com>\n\
  *   <http://www.iospirations.com>\n\n## 本章小结\n\n在本章中，我们讨论了如何创建 App 图标和启动画面，涵盖了导出图片所需的各种分辨率，最后介绍了如何配置\
  \ App 使用这些图片。\n\n## 下一章预告\n\n在下一章中，我们将通过分步说明，处理将 App 提交到 `Apple App Store` 和 `Google\
  \ Play Store` 的实际流程。完成后，你将拥有一个可在应用商店下载的 App！\n\n---\n"
- "# 部署与发布\n\n一旦你的 App 基本完善，你不太可能希望自己成为唯一的用户；因此，你可以开始考虑各种部署途径。部署有多种形式，我们将在本章涵盖大部分内容。你将被引导完成注册开发者账号的过程。\n\
  \n## 本章主题\n\n*   构建模式\n*   分发方式\n*   注册开发者账号\n*   生成签名的发布版构建\n*   部署 Ad Hoc 版本\n\
  *   部署应用商店版本\n\n> **企业版构建说明**\n>\n> 我们不会在本章讨论 *企业版* 构建：这类部署供公司内部使用（通常供其员工）。这通常需要环境内的专用配置，因此超出了本书范围。\n\
  \n## 构建模式详解\n\n在深入探讨之前，我们需要定义构建 App 进行部署时的相关术语。存在几种变体，充分理解它们非常重要。\n\n通常有两种构建模式：`debug`\
  \ 和 `release`。根据需求，你可能会有更多模式，但本章仅聚焦这两种。让我们了解它们的用途和区别。\n\n### `debug` 模式\n\n`debug`\
  \ 构建是 `Cordova` 生成的 *默认* 构建。它包含大量调试信息（因此得名），在开发和调试阶段极其有用。你的 App 可能还有额外的调试辅助工具。例如，可能有一个查询本地数据库的简单工具。输出可能不美观，但在调试时这不重要。\n\
  \n`debug` 构建 **绝不** 面向普通最终用户。这意味着你绝不应将调试代码部署到应用商店（否则 App 可能被拒）。虽然这听起来显而易见，但调试代码进入生产代码的频率令人担忧。虽然生成大量日志数据不一定是最坏的情况，但至少会导致性能下降。在另一极端，调试代码很少是最安全的代码。\n\
  \n### `release` 模式\n\n`release` 构建就是适合发布给最终用户的构建。`Cordova` 会生成剥离了调试信息的原生代码，并阻止远程调试连接。发布版构建在安全验证上通常更严格。例如，Android\
  \ `debug` 构建不一定检查 SSL 证书是否由受信任的证书颁发机构签名，但 `release` 构建一定会检查。\n\n你也可以利用发布版构建流程，通过压缩和混淆资源来优化。并非所有用户设备空间充足，减小\
  \ App 体积能改善用户体验。移除 Source Maps 在这方面效果显著，因为它们可能占用大量存储空间。App 中的任何其他调试辅助工具都应被移除，或打磨成可用于支持最终用户的功能。\n\
  \n\n\n\n拥有构建产物后，显然需要对其进行分发。但这里存在一个问题：设备（以及最终用户）如何*信任*他们下载的代码就是你发布的代码？答案很简单：代码签名。\n\
  \n签名构建产物就是使用特定签名身份对构建产物进行*签名*。此签名实质上是一对公钥/私钥，它将签名后的构建产物与你作为开发者的身份关联起来。对构建产物本身的任何未经授权的修改都将导致签名不匹配，因此用户可以合理地确信代码确实来自你。对于典型的\
  \ Android 用户，他们安装的应用确实将由你签名。对于 iOS 用户，他们安装的应用最初将由你签名，但 Apple 会使用其自己的身份对其重新签名。\n\n\
  ### 注意\n\n当然，你应该意识到，如果 Apple 可以使用其自己的签名身份重新签名你的应用，那么几乎任何其他人也可以做到。对于 iOS 来说，这不是一个大问题，因为设备通常只信任\
  \ Apple 签名的代码。然而对于 Android，这确实意味着其他人可以重新签名你的应用，而设备不会提出异议。不过，他们无法为你的应用发布版本更新；重新签名的应用始终会作为一个新应用安装，而不是作为升级。\n\
  \n在 Android 上，构建产物可以是签名的，也可以是未签名的。未签名的构建产物要求最终用户执行额外步骤以允许安装。因此，不应依赖这种方式作为可靠的分发模型。在\
  \ iOS 上，*所有*构建产物均已签名，且用户无法允许安装来自不受信任来源的已签名应用。这实际上意味着，虽然可以在 Android 上旁加载应用，但 iOS\
  \ 完全阻止了此功能（除非用户是开发者）。\n\n签名构建产物是确保用户拥有的代码位（bits）正是你作为开发者认为他们应该拥有的代码的一种方式。无论好坏，它也是控制分发渠道的一个好方法。请注意，我们已经提到\
  \ iOS 不允许旁加载或安装未签名的应用。Apple 在安全模型方面大肆宣传，但同时也想控制分发渠道。因此，如果你想在 Android 上部署应用，将有大量分发渠道可用；但在\
  \ iOS 上，这些渠道非常有限。\n\n## 分发方法\n\n谈到实际部署构建产物时，有几种不同的分发方法：\n\n*   **临时分发**：部署无需真正的基础设施。你可以通过电子邮件或网站发送构建产物。这些构建产物通常面向特定用户（尤其是在\
  \ iOS 上）。它们通常不打算作为最终用户安装应用的主要方式。\n\n*   **Beta 测试分发**：这类似于临时分发，但有以下关键区别：你的应用已超越初始开发阶段，你正请求一小群用户尝试以他们能想到的任何方式“破坏”你的应用。这很有用，因为单个开发者无法捕获自己代码中的所有\
  \ Bug（原因多种多样）。此类部署可以没有后台基础设施，也可以使用协助测试过程的工具（如 TestFlight 和 HockeyApp）。通常会添加额外的支持库，以便在应用崩溃时通知你，并查看用户执行了什么操作导致了崩溃。\n\
  \n*   **企业分发**：如果你曾在企业工作，你可能已经熟悉这样一个事实：这些企业通常对可使用的技术、安装位置和方式有着相当严格的控制。因此，企业倾向于通过各种自动化解决方案控制应用部署，所有这些在技术上均超出了本章的范围。\n\
  \n*   **应用商店**：对大多数个人和公司而言，这是目标：你的应用上架 Apple App Store 或 Google Play。这让你的目标受众能像搜索、购买、下载和安装任何其他应用一样对待你的应用。这种一致性降低了用户掏钱包的门槛，但也降低了用户接触你应用的门槛。商店通常拥有大量自己的基础设施来托管你的内容，这就是为什么它们都会抽取应用成本的一部分作为分成。另一方面，你不必担心在自己的基础设施上托管应用副本。应用商店发布*始终*是发布版本构建。\n\
  \n### 注意\n\n在上述所有情况中，iOS 都要求你拥有一个有效的开发者账号，即使是临时分发也不例外。Android 在这方面稍宽松一些：你只需一个 Google\
  \ Play 市场开发者账号即可提交到 Google Play 市场。\n\n在将任何应用部署到除你自己以外的物理 iOS 设备之前，你需要成为一名注册的 Apple\
  \ 开发者。过去，Apple 要求你每年支付 99 美元才能在自己的物理设备上测试应用，但自 iOS 9 发布以来，这一要求已被取消。虽然这有助于你自己的测试，但你仍需支付订阅费才能将应用部署到你不拥有的设备上，这通常是最终目的。\n\
  \nGoogle 仅在你打算将 Android 应用提交到 Google Play 市场时才要求账号。在此之前，你不需要账号。截至撰写本文时，这需要一次性支付\
  \ 25 美元。然而，为了保持一致性，我们将在第一部分介绍在两个平台上注册自己的流程。\n\n### 注意\n\n虽然我们将只关注 iOS 和 Android，但其他平台的说明大体相似。\n\
  \n## 成为 Apple iOS 开发者\n\n要将应用程序部署到除你自己以外的设备，你需要注册 Apple 的开发者计划。要开始该流程，你应该访问 `https://developer.apple.com/programs/enroll/`。你会立即面临一个选择：你可以选择作为个人注册，也可以作为公司注册。你应该使用哪一种取决于你的具体情况，本书无法涵盖所有各种场景。\n\
  \n然而，如果你是一名独立开发者，不为其他公司工作，注册个人账号应该是稳妥的。如果由于某种原因，你需要将账号转为公司开发者账号，稍后可以进行转换。你通常也可以将你的应用转移到另一个账号。\n\
  \n如果你是*在*一家公司工作的开发者，你可能应该创建一个公司账号。这更复杂，因为 Apple 需要验证你是否有权代表公司签订合同协议。你的公司还需要一个 D-U-N-S\
  \ 编号，它能唯一标识你的公司。除非你的公司非常小或刚成立，否则你很有可能已经拥有一个。如果没有，获取该编号的过程虽然免费，但可能需要几天时间；尽管在某些地区，该过程耗时要少得多。\n\
  \n在开始注册流程之前，你*还将*需要一个 Apple ID。如果你还没有，你需要先设置一个。事实上，即使你*已经*有了一个，你可能也应该创建一个单独的 Apple\
  \ ID 来管理你的部署。如果 Apple 出于某种原因禁用了你的账号，你将同时失去对个人应用和已部署到商店应用的访问权限：谨慎总比后悔好。\n\n我们假设此时你还没有\
  \ Apple ID。那么，让我们来完成创建一个的过程：\n\n1.  访问 `https://appleid.apple.com`。\n\n2.  你应该会看到一个类似于下图的屏幕：![成为\
  \ Apple iOS 开发者](img/9781OS_12_01.jpg`)\n\n3.  点击**创建 Apple ID**。\n\n4.  系统将显示一个空白注册表单。填写你的*法定*姓名、电子邮件地址，并选择密码。结果应类似于下图所示的表单：![成为\
  \ Apple iOS 开发者](img/9781OS_12_02.jpg`)\n\n\n\n\n###### 成为 Apple iOS 开发者\n\n5. 向下滚动并回答安全问题，输入您的出生日期。表单应类似于以下屏幕截图所示的表单：![成为\
  \ Apple iOS 开发者](img/9781OS_12_03.jpg)\n\n6. 接下来，您需要再向下滚动一点并输入您的邮寄地址（至少）。如果您有备用电子邮件地址，建议设置一个。您的表单应类似于下图（我们省略了备用地址）：![成为\
  \ Apple iOS 开发者](img/9781OS_12_04.jpg)\n\n7. 再向下滚动一点并选择您首选的语言和电子邮件偏好设置。如果您已有 Apple\
  \ ID，大概可以取消勾选 **Email Preferences（电子邮件偏好设置）** 下的两个复选框。如果您想随时了解 Apple 的新闻和公告，可能只想保留第一个复选框的勾选。无论哪种方式，您的表单看起来应该如下所示：![成为\
  \ Apple iOS 开发者](img/9781OS_12_05.jpg)\n\n8. 最后，点击 **Create Apple ID（创建 Apple ID）**，系统将提示您验证电子邮件地址。Apple\
  \ 会向您提供的地址发送一封电子邮件，其中包含一个验证链接。点击该链接，即可让 Apple 知道您可以通过所提供的地址联系到。系统将提示您使用刚刚设置的用户名和密码再次登录。屏幕如下所示：![成为\
  \ Apple iOS 开发者](img/9781OS_12_07.jpg)\n\n9. 点击 **Verify Address（验证地址）** 后，您应该会看到以下屏幕截图，表明电子邮件地址已验证：![成为\
  \ Apple iOS 开发者](img/9781OS_12_08.jpg)\n\n### Tip（提示）\n\n您几乎肯定想为您的账户启用双因素认证以提高安全性，但这超出了本章的范围。\n\
  \n如果您设置了备用电子邮件地址，也需要验证该地址。备用电子邮件地址的验证邮件是单独发送的。\n\n现在您有了 Apple ID，我们可以开始开发者注册流程。返回\
  \ `https://developer.apple.com/programs/enroll/` 并点击 **Start Your Enrollment（开始注册）**\
  \ 按钮，如下所示：\n\n![成为 Apple iOS 开发者](img/9781OS_12_06.jpg)\n\n接下来，请按照以下步骤注册开发者计划：\n\
  \n1. 系统将提示您使用刚创建的 Apple ID 登录。完成后，系统将提示您查看并同意 **Apple Developer Agreement（Apple\
  \ 开发者协议）**，如下截图所示：![成为 Apple iOS 开发者](img/9781OS_12_09.jpg)\n\n2. 勾选确认您已阅读并同意条款\
  \ (1)。理想情况下，您还应勾选希望随时了解 Apple Developer 新闻 (2)，除非您有另一个已接收此信息的开发者账户。然后，点击 **Submit（提交）**，系统将提示您验证您正在使用的\
  \ Apple ID 是否为您真正想要使用的那个。随后系统会询问您是想以个人开发者还是公司身份继续，如下所示：![成为 Apple iOS 开发者](img/9781OS_12_10.jpg)\n\
  \n    ### Note（注意）\n\n    我是以个人身份进行的，所以如果您以公司身份注册，步骤会有所不同。Apple 还会验证您是否有权参与法律协议，因此他们会核实您提供的信息。这可能需要几天时间。\n\
  \n3. 点击 **Continue（继续）** 后，系统将要求您提供联系信息以及地址。请注意，您的姓名不可编辑，因此您的 Apple ID 也必须使用您的法定姓名。表单应如下所示：![成为\
  \ Apple iOS 开发者](img/9781OS_12_11.jpg)\n\n4. 向下滚动一点，阅读并接受呈现的协议，如下截图所示。然后，点击 **Continue（继续）**。![成为\
  \ Apple iOS 开发者](img/9781OS_12_12.jpg)\n\n5. 此时，将出现一个验证屏幕。确保您提供的信息正确无误，然后点击 **Continue（继续）**。\n\
  \n6. 现在系统将要求您完成购买，如下截图所示。如果您愿意，可以通过勾选 (**1**) 所示的复选框，让 Apple 自动续订您的协议。无论哪种方式，点击\
  \ **Purchase（购买）** 以继续。![成为 Apple iOS 开发者](img/9781OS_12_13.jpg)\n\n7. 您将被重定向到 Apple\
  \ Store，系统将再次提示您输入用户名和密码。输入后点击 **Sign In（登录）**。\n\n8. 您应该会看到类似于下图的订单屏幕。输入您的地址、联系信息和信用卡信息，然后点击\
  \ **Continue（继续）**。![成为 Apple iOS 开发者](img/9781OS_12_14.jpg)\n\n9. 此时，您需要再次验证您的信息，然后点击\
  \ **Place Your Order（下单）**。您还将收到一条确认消息和电子邮件。\n\n恭喜，您现在正式成为一名 Apple 开发者了！请注意，处理个人开发者账户可能需要长达二十四小时，而公司账户可能需要更长的时间，具体取决于验证流程完成的速度。\n\
  \n## 成为 Google Play Store 开发者\n\nGoogle 并不要求您必须是 Google Play 市场开发者才能将应用部署到本地设备，也不要求在您临时分发应用之前必须注册。但是，如果您想在\
  \ Google Play 市场上架，则*确实*需要一个账户。您需要准备一些东西，我们将在本节中全部设置：\n\n*   一个 Google 账户\n*   一个\
  \ Google Wallet 账户\n*   一份 Google 商家协议\n\n与 Apple 开发者账户一样，我们建议您为应用分发目的创建一个完全独立的身份，这样如果账户出现任何问题，不会影响您的个人账户。\n\
  \n1. 导航至 `https://play.google.com/apps/publish/`。如果您想使用现有账户，系统将提示您登录。您也可以通过点击 **Create\
  \ Account（创建账户）** 来创建新账户，如下截图所示：![成为 Google Play Store 开发者](img/9781OS_12_15.jpg)\n\
  \n2. 您将被带到一个典型的注册屏幕，系统会询问您的姓名、密码和其他信息。默认情况下，Google 假设您也想要一个单独的电子邮件地址。但如果您点击 **I\
  \ prefer to use my current email address（我更倾向于使用我当前的电子邮件地址）**，则可以改用您当前的电子邮件地址。下截图显示了一个示例：![成为\
  \ Google Play Store 开发者](img/9781OS_12_16.jpg)\n\n3. 无论您以哪种方式继续，都需要填写您的姓名、密码等信息，如下截图所示：![成为\
  \ Google Play Store 开发者](img/9781OS_12_17.jpg)\n\n    ### Note（注意）\n\n    如果您创建一个新的电子邮件账户，Google\
  \ 也会要求提供一个现有的电子邮件账户。这类似于 Apple 的备用电子邮件地址。\n\n4. 假设您输入了所有必填信息并正确响应了验证码，Google 将显示如下内容：![成为\
  \ Google Play Store 开发者](img/9781OS_12_18.jpg)\n\n    ### Note（注意）\n\n    您还将收到一封包含相同信息的电子邮件。\n\
  \n5. 此时，您可以点击 **Back to Google Play Developer Console（返回 Google Play 开发者控制台）**，应该会看到下面的屏幕。请务必阅读分发协议\
  \ (**1**) 并勾选 **I agree…（我同意……）** (**2**)，然后再点击 **Continue to payment（继续付款）**。![成为\
  \ Google Play Store 开发者](img/9781OS_12_19.jpg)\n\n6. Google 现在将提示您设置 Google Wallet，如下截图所示。输入您的付款信息，取消勾选第二个复选框\
  \ (**8**)（否则您会收到发送到您电子邮件的特别优惠），然后点击 **Accept and continue（接受并继续）**。![成为 Google Play\
  \ Store 开发者](img/9781OS_12_20.jpg)\n\n\n\n\n7. Google 将显示费用，撰写本文时为 25 美元。点击 `Buy`\
  \ 完成交易。\n\n8. Google 可能会要求您更新账单信息。输入与您的付款方式相同的地址和电话号码。然后，点击 `Buy`。\n\n9. 当您的付款被处理后，您应该会收到以下通知；点击\
  \ `Continue registration`：![成为 Google Play 商店开发者](img/9781OS_12_21.jpg)\n\n10. 离成功不远了：下一步将询问您的开发者姓名、电子邮件、网站和其他联系信息。这是您的用户将看到的信息，它不需要与您在\
  \ Google 账户设置中已提供的信息相匹配。例如，您可能希望在开发者姓名字段中输入公司名称而不是个人姓名。（如果您这样做，请确保您有权这样做。）输入完成后，点击\
  \ `Complete registration`，如下面的屏幕截图所示：![成为 Google Play 商店开发者](img/9781OS_12_22.jpg)\n\
  \n11. 如果您的意图仅是免费提供应用，那么到此就完成了。但如果您想销售应用或添加应用内购买，则需要设置商家账户。点击 `set up a merchant\
  \ account`，如下所示：![成为 Google Play 商店开发者](img/9781OS_12_23.jpg)\n\n12. 您将看到另一份注册表单。顶部部分现在应该已经很熟悉了。它询问您的姓名、地址等。请注意，Google\
  \ 现在要求您提供 `legal business information`。输入后向下滚动一点。\n\n13. 向下滚动时，您应该会看到类似下面的屏幕截图。在这里，您将提供面向客户的信息，例如您的网站、您销售的产品（如果您销售应用，应选择\
  \ `Computer Software`），以及最终用户信用卡账单上应显示的内容（请注意信用卡账单字段较短；您可能需要缩写）。阅读服务条款后，点击 `Submit`。![成为\
  \ Google Play 商店开发者](img/9781OS_12_24.jpg)\n\n14. 假设一切顺利，Google 应该会返回以下内容，表明您的商家账户已获批准：![成为\
  \ Google Play 商店开发者](img/9781OS_12_25.jpg)\n\n恭喜！此时，您已成为 Google Play 市场开发者，可以将您的应用提交到商店！\n\
  \n如果您曾在模拟器甚至真机上运行过该应用，那么您很有可能已经生成了一个调试版本；这是 Cordova 应用的默认设置。要生成发布版本，您必须显式请求。要生成适合部署的发布版本，您还需要对其进行签名。通过为应用签名，您将允许其他设备确保该应用确实来自您，并降低他人篡改您应用的可能性。\n\
  \n在本节中，我们将介绍如何创建构建并对其进行签名。由于每个平台的签名步骤不同，我们将在单独的小节中介绍它们。\n\n## 管理 iOS 签名身份\n\n为了给您的代码签名（无论是调试版还是发布版），您需要一个签名身份。在\
  \ iOS 上（所有构建都会被签名，无论其调试状态如何），您至少拥有两个身份：一个 `development` 身份和一个 `distribution` 身份。这些身份唯一地标识您作为开发者的身份。`development`\
  \ 身份仅用于调试构建，而 `distribution` 身份用于部署发布构建。\n\n在 iOS 上，通常使用 `Xcode` 来管理您的签名身份。如果 `Xcode`\
  \ 发现某些设置不正确，它通常会自行纠正。但是，您确实需要让 `Xcode` 知道您的 `Apple ID` 账户信息，以便它能为您妥善管理这些身份。\n\n\
  为此，请遵循以下说明：\n\n1. 启动 `Xcode`。\n\n2. 打开 `Xcode` 应用程序菜单，然后点击 `Preferences…`。\n\n3.\
  \ 点击 `Accounts` 标签页，如下一个屏幕截图所示：![管理 iOS 签名身份](img/9781OS_12_26.jpg)\n\n4. 点击工作表左下角的\
  \ `+` 按钮。您应该会看到一个类似于下面的下拉菜单：![管理 iOS 签名身份](img/9781OS_12_27.jpg)\n\n5. 点击 `Apple\
  \ ID…`。您应该会看到一个对话框，提示您输入 `Apple ID` 登录凭据：![管理 iOS 签名身份](img/9781OS_12_28.jpg)\n\n\
  6. 输入您的账户信息并点击 `Add`。稍等片刻，让 `Xcode` 检索您的信息。随后您应该会在 `Accounts` 工作表左侧的列表中看到已添加的账户。\n\
  \n7. 点击新添加的账户。账户信息随后将显示在工作表的右侧。点击工作表右下角的 `View Details…`。\n\n8. 此时，`Xcode` 将显示您安装的签名身份，列表可能为空。如果是这种情况，您可以点击对话框左下角的刷新图标，这将提示\
  \ `Xcode` 询问您是否允许它为您创建几个证书（这些就是您的签名身份）。允许其创建，您最终将得到一个看起来部分类似这样的列表：![管理 iOS 签名身份](img/9781OS_12_29.jpg)\n\
  \n9. 点击 `Done` 按钮关闭对话框。如果您愿意，此时可以关闭 `Xcode`，但几分钟后您还需要用到它，所以您可能想暂时保持其运行。\n\n### 注意\n\
  \n`Xcode` 可能不会自动获取您的签名身份。如果出现这种情况，请点击对话框中间的 `+` 按钮，然后点击 `iOS Development` 以添加您的\
  \ `development` 身份。重复这些步骤，但随后选择 `iOS Distribution` 以添加您的 `distribution` 身份。以下屏幕截图应该会有所帮助：\n\
  ![管理 iOS 签名身份](img/9781OS_12_30.jpg)\n\n## 管理 iOS App ID\n\nApple 提供了通配符应用程序 ID，但建议您为每个打算分发的应用创建一个特定的\
  \ ID。如果您的应用可以接收推送通知或处理应用内购买，这一点尤为重要，因为这些设置非常细粒度，必须针对单个应用，而不能针对一系列应用。\n\n要创建 iOS\
  \ App ID，请遵循以下步骤：\n\n1. 登录开发者会员中心 (`https://developer.apple.com/membercenter`)。您应该会看到一个标题为\
  \ `Certificates, Identifiers & Profiles` 的链接。点击该链接后，您应该会看到类似于下图的内容：![管理 iOS App\
  \ ID](img/9781OS_12_31.jpg)\n\n2. 点击如前一个屏幕截图所示的 `Identifiers` 链接，您可能只会看到一个已定义的 App\
  \ ID：`Xcode: iOS Wildcard Apple ID`。\n\n3. 列表上方有一个 `+` 按钮；点击它。您将被带到一个如下所示的表单：![管理\
  \ iOS App ID](img/9781OS_12_32.jpg)\n\n4. 在 `App ID Description` 字段中，输入您的应用名称。这仅供您参考，所以只需对您自己有意义即可。\n\
  \n5. 如果您向下滚动，应该会看到一个 `App ID Suffix` 部分，如下所示：![管理 iOS App ID](img/9781OS_12_33.jpg)\n\
  \n6. 输入您创建 Cordova 应用时使用的相同值。这在 `config.xml` 文件中。如果您使用的是与我们相同的构建系统，它也存在于 `package.json`\
  \ 文件中。对于我们的演示应用，我使用了 `com.packtpub.logology`。\n\n7. 如果您再向下滚动一点，应该会看到一个标题为 `App Services`\
  \ 的部分，如下所示：![管理 iOS App ID](img/9781OS_12_34.jpg)\n\n\n\n8. 进行您认为需要的任何选择。如果您的应用使用推送通知，您将需要启用此功能。如果您不确定，稍后随时可以更改，所以不要过于纠结于这个问题。请注意，`Game\
  \ Center` 和 `In-App Purchase` 已经被勾选。所有非通配符 App ID 都将启用这些功能。如果您想使用这些功能，仍然需要向您的应用添加相应的代码。\n\
  \n9. 点击 `Continue`。您将看到一个确认屏幕。点击 `Submit`。然后，在确认屏幕上点击 `Done` 以返回 App ID 列表。\n\n\
  ### 注意\n\n如果您需要编辑现有的 App ID，请在列表中点击该 App ID，然后点击 `Edit`。您可能需要稍微向下滚动，因为点击行后出现的功能信息可能会填满您的屏幕。您也可以使用同样的方法删除现有的\
  \ App ID。点击 `Edit` 后出现的表单上有一个 `Delete` 按钮。\n\nApp ID 本身作用不大，但它是真正重要部分的关键：您应用的配置文件。\n\
  \n## 管理 iOS 设备\n\n为了以临时分发或开发的方式部署您的应用，您需要让 Apple 知道该应用应在哪些设备上运行。幸运的是，这非常简单。但一年内您*可以*定位的设备数量*是有限制*的。这是为了确保您不会试图绕过\
  \ Apple 的分发渠道。除非您拥有大量设备或经营大型公司，否则您可能不会超出限制。\n\n### 注意\n\n当您首次将应用部署到设备上时，`Xcode`\
  \ 通常非常擅长自动注册您连接的设备。但您可能想要注册一台您无法亲自接触的设备，例如远程团队成员的设备。\n\n要添加设备，您首先需要知道设备的 `UDID`（通用设备标识符）。您可以通过以下步骤确定它：\n\
  \n1. 将您的设备连接到计算机。\n2. 启动 `Xcode`。\n3. 打开 `Window` 菜单并点击 `Devices`。\n4. 您应该会看到如下所示的屏幕：![Managing\
  \ iOS devices](img/9781OS_12_37.jpg)\n\n现在您知道了 `UDID`，可以按照以下步骤将设备添加到您的开发者账户：\n\n\
  1. 登录开发者会员中心（`https://developer.apple.com/membercenter`）。您应该会看到一个标题为 `Certificates,\
  \ Identifiers & Profiles` 的链接。点击该链接。如果您已经登录，请跳至第 2 步。\n2. 点击 `Devices`。\n3. 页面右上角有一个\
  \ `+` 按钮。点击它以添加新设备。\n4. 在 `Name` 字段中输入一个您能识别该设备的名称，在 `UDID` 字段中输入 `UDID`。点击 `Continue`。\n\
  5. 您将被提示查看您的信息。如果一切正确，请点击 `Register`。\n\n## 管理 iOS 配置文件\n\n配置文件是 iOS 验证设备是否有权运行您的应用的方式。共有三种：开发、临时分发和\
  \ App Store 分发。开发显而易见：用于调试或测试构建。后两者用于发布构建——要么用于临时分发，要么最终用于 App Store 分发。您的应用可以拥有任意数量的这些配置文件。\n\
  \n要创建配置文件，请按以下步骤操作：\n\n1. 登录开发者会员中心（`https://developer.apple.com/membercenter`）。您应该会看到一个标题为\
  \ `Certificates, Identifiers & Profiles` 的链接。点击该链接。如果您已经登录，请跳至第 2 步。\n2. 点击 `Provisioning\
  \ Profiles`。\n3. 您应该会看到一个相当短的配置文件列表；可能一个都没有。\n4. 右上角有一个 `+` 按钮。点击它以添加新配置文件。\n5.\
  \ 您应该会看到如下所示的表单：![Managing the iOS provisioning profiles](img/9781OS_12_35.jpg)\n\
  6. 选择您需要的选项。这当然取决于您正在创建哪种构建以及打算如何部署它。如果构建用于您自己的设备，请选择 `iOS App Development`。如果构建将在临时分发的基础上在\
  \ App Store 之外分发（给有限数量的设备），请选择 `Ad Hoc`。如果构建将提交给 App Store，请选择 `App Store`。如果您选择错误，随时可以删除该配置文件并创建另一个。\n\
  7. 点击 `Continue`。\n8. 现在系统会询问您要将哪个 `App ID` 与此配置文件关联。从下拉列表中选择您在上一节中创建的那个，然后点击 `Continue`。\n\
  9. 接下来，系统会询问您要在配置文件中包含哪些证书。这些就是您之前创建的签名标识。可见的证书取决于您是创建开发配置文件还是分发配置文件。选择您想使用的那个，然后点击\
  \ `Continue`。\n10. 如果您选择了临时分发或开发配置文件，系统会询问您要包含哪些设备。选择应该能够运行该应用的设备，然后点击 `Continue`。如果您选择了\
  \ App Store 配置文件，请跳至下一步。\n11. 在 `Profile Name` 字段中输入一个您可以用来识别此配置文件的名称，如下所示。然后，点击\
  \ `Generate`：![Managing the iOS provisioning profiles](img/9781OS_12_36.jpg)\n12.\
  \ 配置文件生成后，您将看到一条消息，指示该配置文件已准备好下载和安装。如果您愿意可以这样做，但我们将在下一步让 `Xcode` 为我们管理它们。\n13. 返回\
  \ `Xcode`（如果已关闭则打开它）。导航至 `Xcode` | `Preferences`，然后选择 `Accounts` 标签页。在左侧边栏中选择您的\
  \ `Apple ID`，然后点击右下角的 `View Details`。\n14. 点击生成的对话框左下角的刷新图标并稍等片刻。几秒钟后，`Xcode` 应该会将新的配置文件添加到对话框底部列表的下半部分。\n\
  \n此时，您可以使用此配置文件为您的构建签名。然而，为了将来参考，我们还需要一件事，那就是配置文件的 UUID。要获取它，请按以下步骤操作：\n\n1. 在列出配置文件的底部列表中，找到新添加的配置文件。\n\
  2. 右键点击该配置文件。应会出现一个菜单，其中包含 `Show in Finder` 选项。\n3. 点击 `Show in Finder`。`Finder`\
  \ 现在应会打开一个文件夹，其中标识了该配置文件。\n4. 记下文件名；配置文件的 UUID 就是去掉扩展名后的文件名。\n5. 对您需要用来构建的所有已添加配置文件重复步骤\
  \ 1 到 4。\n6. 完成后，点击 `Done` 并退出偏好设置面板。\n\n## 创建 Android 密钥库\n\n虽然 iOS 为您管理签名标识，但\
  \ Android 要求您自行处理这一方面。Android 将您的签名标识（实际上是一个私钥）存储在所谓的 `keystore` 中，该密钥库通常专用于您的应用。\n\
  \n### 注意\n\n在本节中，我们假设您正在使用命令行来构建应用。如果您使用 `Android Studio`、`Eclipse` 或任何其他负责创建 Android\
  \ 应用的 IDE，它们可能会为您处理这方面的工作（请参阅本章末尾的 `Resources` 部分）。\n\n为了创建私钥，您可以在命令提示符下执行以下命令，将\
  \ `app_name` 替换为您的应用名称：\n\n```\nkeytool -genkey -v -keystore .release.keystore -alias\
  \ app_name -keyalg RSA -keysize 2048 -validity 10000\n```\n\n### 注意\n\n您的开发机器上必须安装\
  \ `Java` 才能使用 `keytool` 实用程序。\n\n\n\n\n`validity` 后面的数字以天为单位，你应该确保这是一个相当大的数字！在本例中，密钥的有效期略超过\
  \ 27 年。\n\n该工具现在将提出一系列问题，如下所示：\n\n```\nEnter keystore password: (1)\nRe-enter new\
  \ password:\nWhat is your first and last name? (2)\n[Unknown]:  Johnny Appleseed\n\
  What is the name of your organizational unit? (3)\n[Unknown]:  Department\nWhat\
  \ is the name of your organization? (4)\n[Unknown]:  Company\nWhat is the name of\
  \ your City or Locality? (5)\n[Unknown]:  Anytown\nWhat is the name of your State\
  \ or Province? (6)\n[Unknown]:  CA\nWhat is the two-letter country code for this\
  \ unit? (7)\n[Unknown]:  US\nIs CN=Johnny Appleseed, OU=Department, O=Company, L=Anytown,\
  \ ST=CA, C=US correct? (8)\n[no]:  yes\n\nGenerating 2,048 bit RSA key pair and\
  \ self-signed certificate (SHA256withRSA) with a validity of 10,000 days\nfor: CN=Johnny\
  \ Appleseed, OU=Department, O=Company, L=Anytown, ST=CA, C=US\nEnter key password\
  \ for <app_name> (9)\n(RETURN if same as keystore password):\nRe-enter new password:\n\
  [Storing .release.keystore]\n```\n\n让我们逐一了解在每个步骤中你需要提供的内容：\n\n1.  `Keystore password`（密钥库密码）：此密码用于保护你的\
  \ `keystore` 本身。从技术上讲，`keystore` 可以存储许多不同的 `private keys`（私钥），尽管这可能不适用于你的情况。请务必使用强密码；如果攻击者持有你的\
  \ `keystore` 并能猜出密码，他们就离危害你的用户更近了一步。\n\n2.  `First and last name`（名和姓）：你的名和姓。对此并没有真正的检查，所以请使用适合你特定情况的任何内容。\n\
  \n3.  `Organization unit`（组织单位）：`keytool` 假设你在组织层级内操作。如果你为公司创建应用，你的组织单位可能是信息技术部或应用开发部。你可以留空，但工具会假设为\
  \ `Unknown`。所以，你最好想一个讲得通的内容。如果你是个人开发者，可以直接指定 `Developer`（开发者）。\n\n4.  `Name of your\
  \ organization`（组织名称）：如果你在公司工作，这显而易见。如果你是拥有注册公司名称的个人开发者，可以使用公司名称。如果没有，就再次使用你的名字。\n\
  \n5.  `Name of your City or Locality`（城市或地区名称）：你或你公司的所在地。\n\n6.  `Name of your State\
  \ or Province`（州或省名称）：你或你公司所在的州或省。\n\n7.  `Two-letter country code`（两位字母国家代码）：你或你公司所在国家的两位字母标识符。如果你不确定该为你的国家使用什么代码，请参阅\
  \ [`en.wikipedia.org/wiki/ISO_3166-1_alpha-2`](https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2)。\n\
  \n8.  `Is … correct?`（……是否正确？）：如果显示的信息正确，请回答 `yes`。如果你指定 `no`，工具将再次提问，允许你编辑答案。\n\
  \n9.  `Key password for…`（……的密钥密码）：因为 `keystore` 可能包含多个 `private keys`（私钥），你需要为此特定的\
  \ `private key`（或 `alias` 别名）指定一个密码。你可以使用与 `keystore` 相同的密码，但要明白如果攻击者猜到了 `keystore`\
  \ 密码，他们将能访问你的 `private key`，并能为你的最终用户生成应用更新。最好使用两个独立的强密码。\n\n此时，你的当前目录下应该有一个名为 `.release.keystore`\
  \ 的新文件。务必妥善保管此文件；它包含为你的应用签名（以及交付任何未来更新）所需的数据。如果丢失，你可能会失去生成应用更新的能力。如果其他人获得了访问权限，他们可以像你一样发布应用更新；这可不是好事。\n\
  \n**不要让此文件进入任何源代码仓库！** 立即告诉 `Git`（或你使用的任何源代码仓库）忽略该文件。\n\n对于 `Git`，我们需要将以下内容添加到 `.gitignore`\
  \ 文件中：\n\n```\n.release.keystore\n```\n\n### Tip（提示）\n\n将你的 `keystore` 备份在安全的地方。如果你丢失了它，将无法发布应用更新！\n\
  \n## 对发布版本进行签名\n\n在 第 1 章 *任务自动化* 中，我们介绍了如何构建一个包含去除源映射的压缩代码的发布版本。我们还介绍了如何使用我们的 `Gulp`\
  \ 配置创建此类构建：\n\n```\ngulp build --mode release [--for platform-list]\n```\n\n这将创建一个发布版本，但它还不具备部署条件。在获得可部署的结果之前，我们需要对项目结构和\
  \ `Gulp` 配置进行更多更改。\n\n首先，无论你是使用 `gulp` 还是其他构建工具，都需要创建一个 `build.json` 文件。该文件包含为应用签名的信息。它位于项目的根目录中。格式如下：\n\
  \n```\n{\n  \"android\": {\n    \"release\": {\n      \"keystore\": \"../.release.keystore\"\
  ,\n      \"alias\": \"app_name\"\n    }\n  },\n  \"ios\": {\n    \"debug\": {\n\
  \      \"codeSignIdentity\": \"iPhone Developer\",\n      \"provisioningProfile\"\
  : \"<UUID>\"\n    },\n    \"release\": {\n      \"codeSignIdentity\": \"iPhone Distribution\"\
  ,\n      \"provisioningProfile\": \"<UUID>\"\n    }\n  }\n}\n```\n\n### Note（注意）\n\
  \n`Android` 不要求你对 `debug`（调试）构建进行签名。如果你想签名，可以添加一个复制 `release` 部分的 `debug` 部分，只不过你需要创建一个\
  \ `debug` `keystore` 并使用它代替。\n\n请注意，这里有一个用于 `iOS` `provisioning profile`（配置文件） `UUID`\
  \ 的部分。如果你还记得 *Managing iOS Provisioning Profiles*（管理 iOS 配置文件）中的内容，`Xcode` 可以显示这些\
  \ `UUID` 是什么。遵循本节末尾的步骤，你应该能够确定要使用哪些 `UUID`。\n\n如果你使用 `Cordova CLI` 构建应用，可以使用以下配置进行构建：\n\
  \n```\ncordova build [platforms] --release --device --buildConfig=build.json\n```\n\
  \n如果你使用 `gulp` 和我们的 `Gulp` 配置，需要进行以下更改：\n\n1.  在实际执行构建步骤之前，`build.json` 文件需要被复制到\
  \ `build` 目录。这可以通过在 `gulp/config.js` 中向 `config.assets.copy` 对象添加以下内容来完成：\n\n  \
  \  ```\n    var config = {\n        …\n        assets: {\n            copy: [\n\
  \                    {src: \"../build.json\", dest: \".\"},\n                  \
  \  …\n            ], …\n        }, …\n    }\n    ```\n\n2.  `cordova-build.js` 任务中的\
  \ `buildCordova` 函数需要修改，以便将 `--device` 和 `--buildConfig` 标志传递给 `Cordova`：\n\n  \
  \  ```\n    function buildCordova() {\n        var target = settings.TARGET_DEVICE;\n\
  \        if (!target || target === \"\" || \n             target === \"--target=device\"\
  ) {\n            target = \"--device\";\n        }\n        return cordovaTasks.build({\n\
  \            buildMode: settings.BUILD_MODE,\n            platforms: settings.BUILD_PLATFORMS,\n\
  \            options: [target, \"--buildConfig=build.json\"]});\n    }\n    ```\n\
  \n现在你可以使用以下命令构建项目：\n\n```\ngulp build --mode release [--for platform-list]\n```\n\
  \n无论你使用 `Cordova` 构建发布版本还是使用 `gulp`，发布构建的过程应与之前的 `debug` 构建类似。构建 `Android` 发布版本时有一个区别：你会被提示两次输入密码。第一次输入\
  \ `keystore` 的密码。第二次输入 `alias` 的密码。虽然你可以在 `build.json` 文件中指定密码，但强烈不建议这样做，因为这会造成安全风险。\n\
  \n现在你已经构建了发布版本，可以在以下位置访问相应的文件：\n\n*   `Android`：`[build/]platforms/android/build/outputs/apk/android-release.apk`。\n\
  \n\n\n\n\n### iOS 构建生成\n\n**iOS**：Cordova 生成的格式无法直接分发。您可以使用 Xcode，也可以使用以下命令行步骤（从项目根目录运行），将\
  \ `app_name` 替换为您的应用名称：\n\n如果您使用的是我们的项目格式：\n\n```\nxcrun -sdk iphoneos PackageApplication\
  \ \"$(PWD)/build/platforms/ios/build/device/app_name.app\" -o \"$(PWD)/app_name.ipa\"\
  \n```\n\n如果您直接使用 Cordova CLI：\n\n```\nxcrun -sdk iphoneos PackageApplication \"\
  $(PWD)/platforms/ios/build/device/app_name.app\" -o \"$(PWD)/app_name.ipa\"\n```\n\
  \n将生成的 `.ipa` 文件移动到所需位置。\n\n### 注意事项\n\n您可能希望自动将 `.apk` 和 `.ipa` 文件移动到其他位置，例如项目中的\
  \ `dist` 文件夹。我们将此作为读者的练习，但自动化此过程并不困难。\n\n一旦生成了签名构建，部署 Ad Hoc 版本就非常简单。生成的 `.apk`\
  \ 和 `.ipa` 文件可通过电子邮件传输或通过网站下载，因此传输它们并不困难。有各种工具可以让这种部署方式变得简单。\n\n## 通过电子邮件部署\n\n\
  要通过电子邮件部署，请按以下步骤操作：\n\n1.  在您的电子邮件应用程序中创建一条新消息。\n2.  将 `.apk` 或 `.ipa` 文件作为附件添加到电子邮件中。注意发送/接收大小限制。如果您的应用很大，您可能想用其他方式部署。\n\
  3.  发送给接收者。\n\n一旦接收者收到构建版本，他们可以使用以下步骤进行安装：\n\n**对于 Android**，请使用以下步骤：\n\n1.  用户应移除该应用的任何先前版本，特别是如果它们是从\
  \ Google Play 市场或任何其他商店下载的。\n2.  下载附件。\n3.  点击以打开附件。\n4.  Android 将询问用户是否希望安装该应用，以及该应用所需的任何权限。\n\
  5.  用户应点击**安装**。\n6.  该应用将安装在他们的设备上。\n7.  如果发生错误，用户应在再次尝试前从设备中移除该应用。\n\n**对于 iOS**，请使用以下步骤（iOS\
  \ 要求用户能够访问 iTunes 并将设备连接到计算机）：\n\n1.  这些说明的副本可在 [`developer.apple.com/library/ios/documentation/IDEs/Conceptual/AppDistributionGuide/TestingYouriOSApp/TestingYouriOSApp.html#//apple_ref/doc/uid/TP40012582-CH8-SW6`](https://developer.apple.com/library/ios/documentation/IDEs/Conceptual/AppDistributionGuide/TestingYouriOSApp/TestingYouriOSApp.html#//apple_ref/doc/uid/TP40012582-CH8-SW6)\
  \ 获取。\n2.  用户应移除该应用的任何先前版本，特别是如果它们是从 App Store 下载的。\n3.  在他们的计算机上下载 `.ipa`。\n4.\
  \  将设备连接到计算机。\n5.  双击 `.ipa` 文件。\n6.  在 iTunes 中，导航到**设备**标签页（在侧边栏或左上角）。\n7.  点击侧边栏中的**应用程序**。新应用应出现在应用程序列表中。如果没有立即显示，请使用搜索字段查找它。\n\
  8.  点击新应用旁边的**安装**。文本将变为**将安装**。\n9.  点击**同步**或**应用**。应用现在将部署到设备上。\n10. 如果应用部署失败，请在再次尝试前从设备中删除该应用（如果可见）。\n\
  \n## 通过 URL 部署\n\n如果您的应用存储在 Dropbox 账户（或类似服务）中，或者您已将构建版本上传到 Web 服务器，则可以改为与用户共享链接。Android\
  \ 用户可以直接安装应用，就像上一节一样。iOS 用户仍然需要访问安装了 iTunes 的机器，以便插入设备来安装构建版本。\n\n## 通过 Diawi 部署\n\
  \n如果您想避免 iOS 繁琐的安装步骤，可以让用户从一个特殊网站安装您的应用：[`www.diawi.com`](http://www.diawi.com)。该网站接收您的\
  \ `.ipa` 文件并返回一个缩短的链接，您可以将其发送给所有用户。他们可以通过点击链接来安装。\n\n如果您愿意，也可以在不使用 Diawi 的情况下在线完成此操作。只需遵循以下网站上的说明即可：\n\
  \n*   [`3qilabs.com/how-to-ad-hoc-distribute-your-ios-app-via-a-website-and-ota/`](http://3qilabs.com/how-to-ad-hoc-distribute-your-ios-app-via-a-website-and-ota/)\n\
  *   [`gknops.github.io/adHocGenerate/`](http://gknops.github.io/adHocGenerate/)\n\
  *   [`aaronparecki.com/articles/2011/01/21/1/how-to-distribute-your-ios-apps-over-the-air`](http://aaronparecki.com/articles/2011/01/21/1/how-to-distribute-your-ios-apps-over-the-air)\n\
  \n一旦您的应用经过测试，您就可以准备将应用部署到相应的商店。每个商店使用不同的流程，因此我们将分别详述每个平台的步骤。\n\n## 部署到 Apple App\
  \ Store\n\n请按照以下步骤将您的应用部署到 Apple App Store：\n\n1.  导航至 [`itunesconnect.apple.com`](https://itunesconnect.apple.com)。\n\
  2.  使用您的 Apple ID 登录。 ![部署到 Apple App Store](img/9781OS_12_38.jpg)\n3.  您应该会看到一个各种图标的网格，如下所示：\n\
  4.  点击**应用程序**。\n5.  点击页面左上角的 **+** 按钮。将出现一个下拉菜单。点击**新 iOS 应用程序**。\n6.  将出现一个如下所示的新表单：\
  \ ![部署到 Apple App Store](img/9781OS_12_39.jpg)\n7.  在**名称**字段中提供您的应用名称。这对最终用户可见。\n\
  8.  从下拉列表中为应用选择**主要语言**。\n9.  从下拉列表中为您的应用选择**包 ID**。这将与您在*管理 App ID* 部分创建的 App ID\
  \ 匹配。\n10. 在**版本**字段中输入您应用的版本。这应与您应用的 `config.xml` 和 `package.json` 文件中的版本匹配。\n\
  11. 为您应用的 **SKU** 选择一个唯一 ID。这对最终用户不可见，仅供您自己使用。\n12. 点击**创建**。\n13. 您将被带到一个包含多个部分的屏幕，包括**版本信息**、**通用应用信息**等。\n\
  14. 在字段名称**应用视频预览和屏幕截图**下方的表单顶部将有一个大的空白区域，后面跟着一个列出多种屏幕尺寸的选择器。这是您提供应用屏幕截图的地方，以便最终用户能对您的应用有良好的直观感受。您的应用支持的所有设备至少需要一张截图，但您每种设备规格最多可以有五张截图。我们在这里不介绍这些截图的创建，但在*资源*部分有几个可用的链接。\n\
  15. 向下滚动到屏幕截图部分下方。您应该会看到一个请求应用名称、描述和其他信息的表单。您的应用名称应该已经填好。\n16. 在**描述**字段中输入您应用的描述。空白字符会被保留，因此您可以（也应该）使用段落和间距使描述清晰明了。\n\
  17. 在**关键词**字段中输入一些关键词，用逗号分隔。您最多可以使用 100 个字符。使用您认为潜在用户在搜索您的应用时会使用的术语。\n18. 在**支持\
  \ URL** 字段中输入一个有效的 URL。此链接对最终用户可见，应为他们提供获取应用支持的途径。\n19. 如果您的应用有营销网页，可以将该 URL 输入**营销\
  \ URL**。这将对最终用户可见。\n20. 如果您的应用或公司有隐私政策（应该有！）且在网站上可用，请将该 URL 输入**隐私政策 URL** 字段。\n\
  21. 向下滚动到**通用应用信息**。\n22. 点击**应用图标**字段标题下方的**选择文件**。选择您在上一章创建的 `iTunesArtwork@2x.png`\
  \ 文件。此图标对浏览 App Store 的用户可见。\n\n\n\n\n\n### 部署到 Apple App Store\n\n## 应用元数据配置\n\n\
  23. 使用 **Category** 部分为您的应用选择主要和次要类别。如果您的应用仅适合一个类别，则无需提供次要类别。请确保所选类别以某种形式适用于您的应用，因为这也有助于用户找到您的应用。\n\
  \n24. 在 **Rating** 字段旁边，点击 **Edit** 链接。将出现一个如下所示的表单：\n![部署到 Apple App Store](img/9781OS_12_40.jpg)\n\
  \n25. 为每个类别选择合适的项目。为每一行做出选择后，Apple 将显示最终评级。如果应用符合 **Made for Kids** 类别资格，Apple 将其显示为一个选项，如果应用面向儿童，您可以勾选它。完成后，点击\
  \ **Done**。\n\n26. 在 **Copyright** 字段中输入您应用的版权信息。\n\n27. 向下滚动到 **App Review Information**\
  \ 部分。\n\n28. 在提供的字段中输入您的联系信息。如果 Apple 审核团队对您的应用有任何疑问，他们将使用您提供的信息与您联系。如果您希望 Apple\
  \ 联系其他人，请改为输入他们的信息。\n\n29. 如果您的应用需要凭据才能工作，Apple 将要求提供演示账户。分别在 **Username** 和 **Password**\
  \ 字段中输入用户名和密码。\n\n30. 在 **Notes** 区域输入您认为应用审核团队需要了解的任何备注。\n\n31. 向下滚动到 **Version\
  \ Release** 部分。\n\n32. 您可以选择 **Automatically release this version**（当应用团队接受您的提交时自动发布此版本），或选择\
  \ **Manually release this version**（手动发布此版本）。后者允许您在应用发布到 App Store 时拥有更精细的控制权。如果您同时发布\
  \ iOS 和 Android 应用，这会很有用。或者，如果您的市场部门在营销材料中指定了应用上线的具体日期，您可以等到该日期再将应用发布到市场。\n\n33.\
  \ 点击右上角的 **Save** 保存更改。\n\n34. 点击网页顶部的 **Pricing** 链接。\n\n35. 选择您应用的预计上架日期。无需精确到具体时间。\n\
  \n36. 选择价格等级。如果您的应用免费，请选择 **Free**。\n\n37. 通过勾选或取消勾选 **Discount for Educational\
  \ Institutions** 字段，选择教育机构是否应获得折扣。此项默认勾选。\n\n38. 保持 **Custom B2B app** 未勾选，除非您参与了该开发者计划并交付\
  \ B2B 应用。\n\n39. 点击 **Save**。\n\n40. 页面将重新加载，现在您可以选择价格生效的生效日期，以及（可选）结束日期。这对于临时降价很有用。\n\
  \n41. 点击 **Save**。\n\n42. 要返回应用列表，请点击 **Cancel**。\n\n## 上传应用构建版本\n\n这完成了应用元数据的配置，但我们还需要上传应用。您可以使用以下两种方法之一：通过\
  \ Xcode 或 Application Loader。如果您已有 `.ipa` 文件，Application Loader 效果很好，这正是我们拥有的。要提交它，请使用以下步骤：\n\
  \n1. 在 Mac 上打开 **Application Loader**。\n\n2. 如果提示同意许可协议，请阅读并同意。\n\n3. 使用您的 Apple\
  \ ID 登录。\n\n4. 点击 **Deliver Your App** 按钮。点击 **Choose**。\n\n5. 系统将提示您提供 `.ipa` 文件的位置。导航到该位置并点击\
  \ **Open**。\n\n6. 查看此时屏幕上的信息。它应列出应用标题、SKU 和版本号等内容。\n\n7. 点击 **Next**。\n\n8. **Application\
  \ Loader** 将开始工作。它会将您的应用上传到 Apple，验证其未使用任何私有 API 等。\n\n9. 过程完成后，您将看到一个大大的绿色对勾。点击\
  \ **Next**。\n\n10. 点击出现的最终屏幕上的 **Done**。\n\n11. 等待片刻，然后在浏览器中刷新应用详情。向下滚动到 **Build**\
  \ 部分。您应该看到下图所示内容。如果没有，再等待片刻并再次刷新。\n![部署到 Apple App Store](img/9781OS_12_41.jpg)\n\
  \n12. 点击 **+** 按钮。\n\n13. 从弹出对话框中选择新上传的构建版本，然后点击 **Done**。\n\n14. 构建版本现在显示在 **Build**\
  \ 标题下方。\n\n15. 点击 **Save**。\n\n16. 查看应用信息。确认无误后，点击 **Submit for Review**。\n\n17.\
  \ 假设您的描述没有错误，您将被带到另一个屏幕，在那里您将被问及一系列关于应用出口合规性和合法性的问题。请如实回答，否则您的应用将被拒绝（或稍后被下架）。点击\
  \ **Submit**。\n\n18. 等待。应用审核通常需要一周或更长时间（查看典型审核时间的有用网站是 [`appreviewtimes.com/`](http://appreviewtimes.com/)）。如果您第一次（甚至第二次）被拒，不要气馁。解决审核员指出的问题，然后重新提交应用。\n\
  \n19. 如果您选择手动发布应用，您的应用不会自动发布到 App Store。返回 iTunes Connect 中的应用页面，然后点击右上角的 **Release**\
  \ 按钮。\n\n20. 完成！老实说，最难的部分是创建截图和描述文本。如果您不太确定如何创建截图，请查看 *Resources* 部分。我们为您提供了一些链接。\n\
  \n# 部署到 Google Play Store\n\n要将应用部署到 Google Play 市场，请执行以下步骤：\n\n1. 在浏览器中访问 [`play.google.com/apps/publish/`](https://play.google.com/apps/publish/)。\n\
  \n2. 使用您的 Google 账户登录。\n\n3. 点击 **Publish an Android App on Google Play**。您将看到如下所示的表单：\n\
  ![部署到 Google Play Store](img/9781OS_12_42.jpg)\n\n4. 如有必要，选择应用的默认语言。\n\n5. 在 **Title**\
  \ 字段中输入应用名称。\n\n6. 点击 **Prepare Store Listing**。\n\n7. 您将进入一个长表单，可以在其中输入应用信息、上传截图等。应用标题应已自动填入。\n\
  \n8. 在 **Short Description** 文本区域输入简短描述。您只有 80 个字符，所以要简洁且引人入胜。\n\n9. 在 **Full Description**\
  \ 文本区域输入应用的完整描述。空白和换行会被保留，所以利用段落和间距使描述易于阅读。\n\n10. 向下滚动到 **Graphic Assets**。\n\n\
  11. 上传应用的截图。您至少需要两张，但每个类别最多可提供八张。仅为您的应用支持的设备规格提供截图。与 Apple 不同，您*不*需要为应用支持的*每个*设备规格提交截图。\n\
  \n12. 上传完截图后，向下滚动并上传应用图标。您在上一章中已创建它。\n\n13. **Feature Graphic** 也是必需的；这些图片显示在应用的列表页面上。**Promo\
  \ Graphic** 和 **TV Banner** 则是可选的。\n\n14. 向下滚动到 **Categorization**。\n\n15. 使用 **Application\
  \ type** 下拉列表指示您的应用是游戏还是应用程序。\n\n16. 从 **Category** 下拉列表中选择您的应用所属类别。\n\n17. 使用 **Content\
  \ Rating** 下拉列表指示内容分级。您需要在提交前填写分级问卷，但我们稍后会回到它。\n\n18. 向下滚动到 **Contact Details**。\n\
  \n19. 如果您有网站，请在 **Website** 字段中输入网站 URL。\n\n20. 在 **Email** 字段中输入公开可用的电子邮件地址。这将对使用您应用的用户可见。\n\
  \n21. 向下滚动到 **Privacy Policy**。\n\n\n\n\n# 发布到 Google Play 商店\n\n## 隐私政策与价格分发\n\n\
  22. 如果您有隐私政策，请将其 URL 输入到 `Privacy Policy` 字段。\n\n23. 如果没有隐私政策，请勾选 `Not submitting\
  \ a privacy policy URL at this time`。\n\n24. 滚动到页面顶部，点击 `Save Draft`。\n\n25. 在左侧边栏中导航到\
  \ `Pricing & Distribution`。\n\n26. 如果应用免费，点击 `Free`；如果应用付费，点击 `Paid`。请注意，一旦将应用作为免费应用发布，后续无法将其改为付费。\n\
  \n27. 如果应用付费，请在 `Default Price` 字段中输入价格。\n\n28. 点击 `Auto-convert prices now`，确保您的价格在应用将要上架的所有地区都已更新。\n\
  \n29. 向下滚动到 `Distribute in these countries`。\n\n30. 如果想在全球分发，请勾选 `SELECT ALL COUNTRIES`。\n\
  \n## 上传构建版本\n\n您现在可以将构建版本上传到应用商店。请按以下步骤将构建版本上传到应用商店：\n\n1. 点击左侧的 `APK`。\n\n2. 点击\
  \ `Upload your first APK to Production`。\n\n3. 在弹出的对话框中点击 `Browse files`。\n\n4.\
  \ 选择您生成的 `.apk` 文件。该文件必须是签名的发布版本。选择文件后，它将开始上传到 Google Play。\n\n5. 上传完成后，对话框将消失并显示\
  \ APK 信息。请注意 `Draft in Prod` 标识；应用尚未上架。\n\n## 设置内容分级\n\n现在我们已上传 `.apk`，可以通过以下步骤设置内容分级：\n\
  \n1. 在左侧边栏点击 `Content Rating`。\n\n2. 点击 `Continue`。\n\n3. 在 `Email address` 字段中输入您的电子邮件地址。\n\
  \n4. 向下滚动并选择您的应用类别。\n\n5. Google 将根据类别提问。问题将分节呈现；回答每节的问题后，下一节将出现。\n\n6. 完成后，点击 `Save\
  \ Questionnaire`。\n\n7. 点击 `Calculate Rating`。\n\n8. 您的分级将显示出来。向下滚动并点击 `Apply Rating`。\n\
  \n## 发布应用\n\n您现在可以发布应用了。点击 `Publish App` 按钮。系统将要求您查看信息和合格设备。如果一切看起来正确，请发布应用。应用将在几小时内在应用商店上架。\n\
  \n### 注意\n\n如果发布按钮被禁用，请点击 `Why can't I publish` 链接，查看需要填写哪些字段。\n\n## 实用链接\n\n以下链接在处理创建签名构建版本时可能会有用：\n\
