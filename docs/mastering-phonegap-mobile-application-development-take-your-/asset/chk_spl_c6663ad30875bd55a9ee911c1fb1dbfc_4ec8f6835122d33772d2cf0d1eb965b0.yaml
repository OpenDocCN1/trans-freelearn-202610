  - 上一行（第6540行）为“# 章节总结与过渡到 Web SQL Database”，明确标识前一章（IndexedDB）结束并过渡，新章（Web SQL）尚未出现显式标题，导致该概览小节被误判。
  - 本章后续仍有多个一级标题（如第6570行“# 代码包参考”、第6584行“# Web SQL 数据库和 Cordova SQLite 存储插件”），证明一级标题在本书中常用于章内大节，非唯一章标题标识。
