  \ Enterprise Search 节点\n\n+   2. 如果没有，则需要编辑您的部署以添加一个。点击左侧的 Edit 按钮：\n\n![](img/21c3d4250a746422a7489bc2647611d8_210_1.png)\n\
  \n图 10.4：Elastic Cloud 控制台中的侧边菜单\n\n3. 向下滚动并使用以下设置添加一个 Enterprise Search 实例：\n\n\
