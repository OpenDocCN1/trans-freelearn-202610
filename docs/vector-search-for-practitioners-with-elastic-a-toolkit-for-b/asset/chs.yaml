  \n在不断演变的网络安全威胁面前，信息不断涌入，需要创新的工具和方法来筛选庞大的数据集。当需要确定文本背后的细微差别和意图时，这一挑战变得尤为艰巨。\n\n例如，随着网络钓鱼攻击变得越来越复杂，我们如何区分恶意内容和良性内容，尤其是在它们看起来如此相似时？这时\
  \ Elastic Learned Sparse EncodeR（ELSER）登场：这是一种强大的工具，旨在从语义层面理解文本，并辨别表面之下的模式和意图。\n\
  \n本章将深入探讨 ELSER，这是由 Elastic 提供的预训练模型，它利用了向量的力量，而无需让用户承受其复杂性。我们将讨论以下关键主题：\n\n- ELSER\
  \ 概述，我们将深入探讨其本质和在语义搜索中的作用\n- 使用 ELSER 处理数据，包括上传、可视化和处理数据的步骤\n- 利用 ELSER 识别潜在的网络钓鱼威胁\n\
  \n在本章结束时，你不仅将掌握 ELSER 的巨大潜力，还将能够将其集成到各种应用中，而不仅仅是网络安全。\n\n## 技术要求\n\n在本章中，你将设置 Elastic\
  \ 环境以使用 ELSER。为此，你需要在 https://cloud.elastic.co/registration 创建一个 Elastic Cloud 账户。\n\
  \nELSER 是白金许可证下的商业功能。好消息是 Elastic 提供了试用期来测试它。在试用期间，你可以通过聊天机器人向 Customer Engineers\
  \ 团队提问，他们会指导你完成体验。\n\n## 理解电子邮件钓鱼检测的重要性\n\n在深入了解 ELSER 及其在网络安全中的应用之前，我们将彻底了解网络钓鱼，然后再转向语义搜索的更高级技术。\n\
  \n### 什么是网络钓鱼？\n\n**网络钓鱼** 是一种常见的网络攻击类型，涉及在电子通信中伪装成可靠实体以获取敏感信息，例如凭据，如用户名和密码，以及付款信息，如信用卡号或社会安全号码。\n\
  \n**电子邮件欺骗** 是用于网络钓鱼的主要方法。随着通信应用的增加，网络钓鱼也发生在提供即时消息的平台上，并且经常引导用户在与合法网站外观和感觉相匹配的假网站上输入个人信息。\n\
  \n网络钓鱼每天直接影响数千人。网络犯罪分子使用社会工程技术欺骗毫无戒心的个人和组织泄露敏感信息或向犯罪分子控制的账户进行交易。\n\n“网络钓鱼”一词是对“钓鱼”一词的戏仿，因为这些诈骗涉及诱饵受害者并将他们钓上来，就像钓鱼运动一样。“ph”\
  \ 是黑客对 “f” 的常见替换，也是对最初称为 “phreaking” 的黑客形式的致敬。\n\n网络钓鱼攻击的范围从简单和通用到高度复杂和有针对性。最危险的类型，如\
  \ spear phishing 和 whaling，专门针对个人或组织，并经过精心策划以获得攻击者高回报。\n\n我们建议你阅读 Wikipedia 上关于网络钓鱼的广泛内容：https://en.wikipedia.org/wiki/Phishing。\n\
  \n现在，让我们来看一下网络钓鱼的不同类型。\n\n## 不同类型的网络钓鱼攻击\n\n让我们根据上下文或其针对的人物来看一下网络钓鱼的不同形式：\n\n- **Spear\
  \ phishing：** 这是一种有针对性的网络钓鱼形式，攻击者已经做了功课。他们会用目标的姓名、职位、公司、工作电话号码和其他信息个性化他们的电子邮件，以使电子邮件看起来不那么可疑。目标是欺骗收件人相信他们与攻击者有联系。\n\
  - **Whaling：** 这是一种针对高层员工，如首席执行官或首席财务官的网络钓鱼攻击，以窃取公司的敏感信息，因为这些个人通常可以完全访问敏感公司数据。\n\
  - **Clone phishing：** 这种类型的网络钓鱼攻击涉及获取先前发送的电子邮件及其内容和收件人地址，并创建几乎相同或克隆的电子邮件。电子邮件中的原始附件或链接被恶意版本替换，然后从伪装成来自原始发送者的电子邮件地址发送。\n\
  - **Pharming：** Pharming 是一种更复杂的网络钓鱼方法，涉及恶意代码和欺诈性网站。攻击者在用户计算机或服务器上安装恶意代码，该代码会在用户不知情或未经同意的情况下将用户在网络浏览器中点击的内容重定向到欺诈性网站。\n\
  - **Smishing 和 vishing：** 这些术语用于描述通过短信 (**smishing**) 和语音电话 (**vishing**) 发生的网络钓鱼攻击。\n\
  - **商务电子邮件泄露 (BEC)：** 这是一种针对与外国供应商合作和/或定期进行电汇付款的企业的复杂诈骗。该诈骗通过社会工程或计算机入侵技术入侵合法的企业电子邮件账户来进行，从而进行未经授权的资金转移。\n\
  \n这些类型的网络钓鱼攻击各有其独特特征，但它们都有相同的目标：欺骗受害者泄露敏感信息。\n\n虽然网络钓鱼可以通过不同方式进行，但本章将特别关注电子邮件钓鱼，这是网络钓鱼攻击最常见和最普遍的媒介。\n\
  \n电子邮件钓鱼之所以构成重大威胁，是因为它能够一次性覆盖大量潜在受害者。许多网络犯罪分子青睐这种方法，因为它简单有效。攻击者只需点击一下即可发送数千封欺诈性电子邮件，而只需要一个毫无戒心的收件人上钩，攻击就会成功。\n\
  \n我们将探讨它们的构建方式、为什么有效，以及最重要的是，我们如何使用 Elastic 等工具，如 ELSER 来检测和防止它们。我们将使用一个真实世界的电子邮件数据集，标记为\
  \ **ham**（合法）或 **spam**（网络钓鱼），来演示这些工具如何在实践中应用。\n\n通过专注于电子邮件钓鱼，我们旨在让你深入了解这种特定威胁，并为你提供有效打击它的知识和工具。这种关注尤其相关，因为个人和专业环境中对数字通信的依赖日益增加，这伴随着电子邮件钓鱼尝试的增加。\n\
  \n## 网络钓鱼攻击频率的统计数据\n\n在深入技术考虑之前，我认为了解网络钓鱼在我们社会中造成的挑战及其影响很重要。当然，攻击者总会有方法创新其网络钓鱼方法。然而，公司可以部署强大的防御措施，包括基于文本语义的更智能检测，这将有助于最大程度地减少挑战。以下是有关网络钓鱼攻击频率的一些全球统计数据：\n\
  \n- 估计每天发送 34 亿封网络钓鱼电子邮件\n- 约 90% 的数据泄露是由于网络钓鱼造成的\n- 83% 的组织在过去一年中经历过网络钓鱼攻击\n- 处理一次网络钓鱼攻击的平均成本为\
  \ 180 万美元\n- 最常见的网络钓鱼诈骗策略如下：\n  - 看起来来自合法公司（如你的银行或信用卡公司）的电子邮件。这些电子邮件通常要求你点击链接或提供个人信息，如密码或信用卡号。\n\
  \  - 包含感染恶意软件的附件的电子邮件。当你打开这些附件时，恶意软件可能会感染你的计算机并窃取你的个人信息。\n  - 看起来来自合法公司（如你的货运公司）的短信。这些短信通常要求你点击链接或提供个人信息，如跟踪号码。\n\
  \n以下是一些网络钓鱼攻击及其影响的著名例子：\n\n- **Facebook 和 Google 诈骗：** 2013 年，一起 spear phishing\
  \ 诈骗发送给数百万 Facebook 用户。电子邮件看起来来自 Facebook，并要求用户点击链接以更新其账户信息。当用户点击链接时，他们被带到一个假的 Facebook\
  \ 网站，该网站旨在窃取他们的登录凭据。\n- **NotPetya 恶意软件攻击：** 2017 年，一起 clone phishing 攻击被用来投递 *NotPetya*\
  \ 恶意软件。该恶意软件伪装成货运公司的发票，并发送给 Maersk 和 FedEx 等多家大型公司的员工。当员工打开附件时，恶意软件感染了他们的计算机并传播到网络上的其他计算机。该攻击造成数十亿美元的损失。\n\
  \n\n\n\n\n- **乌克兰电网攻击：** 2015年，一次 spear phishing 攻击被用于获取对乌克兰电网的访问权限。该攻击由一个名为 *Sandworm*\
  \ 的黑客组织实施。黑客使用钓鱼邮件诱骗员工点击链接，导致其电脑感染恶意软件。该恶意软件使黑客能够控制电网并切断乌克兰部分地区的电力供应。\n- **Ubiquity\
  \ Networks 社会工程攻击：** 2018年，一次社会工程攻击被用于窃取 Ubiquity Networks 的数据，该组织为家庭和企业销售无线和有线产品。\
  \ spear phishing 攻击由一个名为 *Cobalt Strike* 的黑客组织实施。黑客冒充合法公司向 Ubiquity Networks 的员工发送钓鱼邮件。邮件包含链接，导致员工电脑感染恶意软件。该恶意软件使黑客能够访问公司网络并窃取数据。\n\
  - **FACC BEC 攻击：** 2019年，一次 whaling/BEC 攻击从 FACC 窃取了 1 亿美元。该攻击由一群冒充 FACC 首席执行官在系列邮件中实施的黑客实施。邮件指示员工将资金汇至欺诈性银行账户。员工遵守指示，黑客得以窃取资金。\n\
  \n电子邮件钓鱼的影响涵盖财务损失、数据泄露、声誉受损、运营中断以及法律和监管后果。\n\n现在我们了解了各种类型的钓鱼攻击和一些真实案例，让我们分析检测钓鱼邮件的挑战。\n\
  \n## 检测钓鱼邮件的挑战\n\n检测钓鱼邮件就像在大海捞针，随着现代攻击手段的日益复杂，这一任务变得越来越困难。\n\n例如，一封钓鱼邮件可能会完美复制知名银行邮件的品牌、风格和语气。它甚至可能看起来来自官方电子邮件地址，这得益于电子邮件伪造等技术。该邮件可能包含指向一个几乎与银行官方网站完全相同的网站的链接，诱骗收件人输入其登录信息。\n\
  \n此外，检测钓鱼邮件的挑战不仅仅是技术问题；它还关乎人性。即使是最先进的电子邮件过滤系统也无法完全防止人为错误。人们天生倾向于信任并回应紧急请求，尤其当它们似乎来自权威来源时。一封精心制作的钓鱼邮件可以利用这些倾向，诱骗即使最警惕的人点击恶意链接或下载感染的附件。\n\
  \n例如，一名员工可能会收到一封看似来自其公司 IT 部门的邮件，敦促其立即更新密码，因为怀疑存在安全漏洞。担心保护其账户，员工点击了邮件中的链接，不知不觉中落入了钓鱼者的陷阱。\n\
  \n这些挑战凸显了需要先进的检测方法，以跟上网络犯罪分子的不断演变策略，以及持续的教育来帮助个人识别和避免钓鱼尝试。\n\n让我们来看看传统自动化检测——它如何捕获看似钓鱼攻击的事件以及其局限性。\n\
  \n## 自动化检测的作用\n\n面对钓鱼带来的挑战，自动化检测发挥着至关重要的作用，就像一只永不睡觉的警惕看门狗，不断监控入侵迹象。\n\n传统的安保措施，如防火墙和防病毒软件至关重要，但它们并不总是足以捕获钓鱼邮件。这些方法通常依赖于检测已知威胁，例如特定的恶意软件签名。然而，钓鱼邮件可以通过使用社会工程技术而非已知恶意软件来绕过这些防御。这就像试图抓住一只变色龙：威胁不断改变外观以融入周围环境。\n\
  \n这就是自动化检测发挥作用的地方。通过使用机器学习和自然语言处理等先进技术，自动化系统可以分析电子邮件的内容和上下文以检测钓鱼迹象。它们可以寻找人类肉眼看不见的细微线索，例如电子邮件地址的细微差异或邮件文本中不寻常的模式。\n\
  \n例如，自动化系统可能会注意到一封声称来自主要银行的邮件实际上来自与银行官方电子邮件地址略有不同的地址，或者它可能检测到邮件中的语言异常紧迫或威胁，这是钓鱼邮件中的常见策略。\n\
  \n此外，自动化系统可以高速处理大量数据，使其能够在钓鱼邮件到达收件人收件箱之前将其拦截。\n\n然而，需要注意的是，没有任何系统是完美的。自动化检测可以显著降低钓鱼风险，但无法完全消除它。这就是为什么将自动化检测与用户教育相结合至关重要，以确保个人知道如何识别和应对任何溜网而过的钓鱼尝试。\n\
  \n邮件的内容、其语义以及背后的意图都是钓鱼攻击的关键方面。事实上，正是这些元素的操纵使得钓鱼攻击如此具有欺骗性和有效性。\n\n想象钓鱼邮件是一只披着羊皮的狼。这只狼不仅仅穿着羊毛；它还学会了像羊一样行为并像羊一样咩叫。它模仿羊的行为和交流以融入其中。同样，钓鱼邮件不仅仅看起来像合法邮件；它还试图听起来像合法邮件。它使用模仿收件人习惯接收的合法邮件的语言、语气和内容。\n\
  \n这就是语义理解的强大之处所在。通过理解邮件的语义，自动化检测系统可以分析的不仅是邮件的表面特征，还有其潜在意图。它可以识别出看起来像例行密码更新请求的邮件实际上是钓鱼尝试。它可以检测出看似来自同事的邮件实际上是巧妙伪装的攻击。\n\
  \n这就是为什么 Elastic 的 ELSER 等技术在打击钓鱼方面如此宝贵，因为它们旨在理解文本的语义。通过理解邮件的内容和意图，这些系统可以增强检测能力并提供更强大的钓鱼防御。\n\
  \n## 用自然语言处理增强现有技术\n\n当我们在这个复杂领域中航行时，我们的下一个路标是对 ELSER 的探索，ELSer 是 Elastic 开发的预训练模型，它将嵌入和语义理解的力量结合起来以应对钓鱼检测问题。在接下来的部分中，我们将深入探讨\
  \ ELSER 是什么，它如何工作，最重要的是，它如何被利用来增强我们检测和挫败钓鱼攻击的能力。通过理解文本的语义，ELSer 提供了一种新的方式来看穿钓鱼邮件的伪装，为这种普遍威胁提供更强、更细致的防御。那么，让我们踏上这段发现之旅，看看\
  \ ELSER 如何在打击电子邮件钓鱼的斗争中赋能我们。\n\n## 介绍 ELSER\n\nELSER 是一款突破性的工具，它将机器学习的力量带入语义搜索。它能够辨别文本的底层含义和意图。这在电子邮件钓鱼检测等任务中尤其有价值，因为理解邮件内容对于识别威胁至关重要。\n\
  \n想象尝试理解一个文本语料库。传统方法可能涉及 painstakingly 分析每个句子，查找不熟悉的单词，并尝试拼凑整体含义。这可能是一个缓慢而繁琐的过程。另一方面，ELSer\
  \ 可以立即提供文本的详细分析，突出关键主题并解释细微差别。ELSer 独特之处在于执行文本扩展，创建一组构成语义空间的标记，从而允许对处理的任何文本字段进行更丰富的理解。\n\
  \nELSer 的突出特点之一是其用户友好性。ELSer 提供即开即用的解决方案，用户可以将数据推送到 Elasticsearch 并立即受益于语义搜索功能，这显著缩短了价值实现时间。然而，ELSer\
  \ 不仅仅关乎速度；它还关乎灵活性和可扩展性。作为 Elastic 平台的一部分，它可以轻松扩展以处理大量数据，使其适用于从小型项目到企业级应用的一切。它就像一辆高性能跑车，可以在城市街道巡航和在专业赛道上比赛之间轻松切换。\n\
  \n\n\n\n\n然而，需要注意的是，ELSER 目前处于技术预览阶段，这意味着它仍在不断完善和改进中。尽管如此，即使在当前状态下，ELSER 也代表了语义搜索领域的一项重大进步。\n\
  \n在接下来的章节中，我们将深入探讨 ELSER 如何应用于电子邮件钓鱼检测任务。我们将看到这种创新工具凭借其速度、灵活性和强大功能如何增强网络安全工作，并为抵御钓鱼攻击提供强有力的防御。\n\
  \n## ELSER 在 GenAI 中的作用\n\nELSER 不仅仅是一个孤立的工具；它是科技行业更广泛运动的一部分，该运动旨在普及诸如向量搜索、**大型语言模型\
  \ (LLMs)** 和 **生成式人工智能 (GenAI)** 等先进技术。这有点像 1980 年代个人电脑的出现，它将计算能力带入了普通用户的手中，引发了我们工作、交流和娱乐方式的革命。\n\
  \n像 ELSER 这样的工具使更广泛的用户能够使用先进的 AI 能力。向量搜索涉及将文本转换为高维向量并搜索相似向量，这曾经是一个需要专业知识和资源才能完成的复杂过程。现在，有了\
  \ ELSER，用户可以在无需理解底层复杂性的情况下利用向量搜索的强大功能。\n\nLLMs 如 GPT 因其生成类人文本的能力而成为头条新闻，但其使用主要局限于研究人员和大型科技公司。像\
  \ ELSER 这样的工具正在帮助普及这些模型，使其功能可供更广泛的用户使用。\n\n这种普及是 GenAI 运动的一部分，该运动旨在使 GenAI 对所有人可访问并有益。通过将先进的\
  \ AI 能力带给大众，像 ELSER 这样的工具正在推动这场革命，打破壁垒，为个人和企业 alike 开辟新的可能性。随着我们探索 ELSER 如何应用于电子邮件钓鱼检测，我们将看到\
  \ AI 民主化如何产生现实世界的影响，增强网络安全并帮助抵御威胁。\n\n在我们对 ELSER 的探索中，我们看到了这种创新工具如何利用 ML 的强大功能为语义搜索带来新的理解水平。就像一位语言大师一样，ELSER\
  \ 解释数据的细微语言，对文档的前几百个词进行编码以提供自动语义丰富。尽管存在当前局限性，例如仅关注英文文本并仅考虑文档的第一部分，ELSER 仍代表了文本分析领域的重大进步。它就像一台高功率显微镜，让我们能够看到文本的复杂细节，增强我们检测模式、理解意图并最终识别钓鱼邮件等威胁的能力。\n\
  \n展望未来，我们将把这些见解应用于一个现实世界的挑战：电子邮件钓鱼检测。在下一节中，我们将介绍我们将用于此任务的数据集——Enron 电子邮件数据集，该数据集已被标记为\
  \ ham（合法）或 spam（钓鱼）。该数据集将作为我们的试验场，让我们看到 ELSER 的实际应用，并探索其语义理解能力如何增强我们检测钓鱼邮件的能力。那么，让我们深入挖掘，看看该数据集包含哪些见解。\n\
  \n## Enron 电子邮件数据集简介（ham 或 spam）\n\nEnron 数据集是一个庞大的电子邮件数据集合，已成为文本分析和机器学习领域的核心。它就像一个庞大的图书馆，充满了多样化的文本，为懂得如何解读的人提供了丰富的见解。\n\
  \n该数据集最初是在对 Enron Corporation 的法律调查期间公开的，Enron Corporation 是一家在 2001 年因广泛的企业欺诈而倒闭的美国能源公司。该数据集包含约\
  \ 150 名用户、主要是 Enron 高级管理人员的超过 600,000 封电子邮件，使其成为同等规模的真实电子邮件公开可用集合之一。\n\n就我们的目的而言，Enron\
  \ 数据集中包含的电子邮件已被标记为 ham（合法）或 spam（钓鱼）。这种标记提供了宝贵的真实基准，使我们能够训练和测试钓鱼检测模型。标记告诉我们哪些电子邮件是安全的，哪些是危险的，有助于我们了解钓鱼邮件的特征并改进检测方法。\n\
  \n然而，需要注意的是，Enron 数据集像任何数据集一样存在局限性。数据集中的电子邮件来自 2000 年代初期，反映了当时的沟通风格和安全威胁。虽然钓鱼的许多原则保持不变，但钓鱼者使用的具体策略和技术随着时间的推移而演变。因此，虽然\
  \ Enron 数据集为我们本书理解和检测钓鱼邮件提供了宝贵的资源和示例，但重要的是用更近期的示例和持续学习来补充这些数据。\n\n在本書中，我们将使用托管在以下\
  \ GitHub 仓库中的 Enron 数据集版本：https://github.com/MWiechmann/enron_spam_data。\n\n我们将使用的\
  \ Enron 数据集的结构为 CSV 文件，其中每一行代表一封电子邮件，每一列代表该电子邮件的特定属性。\n\n数据集包含五列：\n\n- Message ID：这是每封电子邮件的唯一标识符，就像序列号一样。它帮助我们跟踪单独的电子邮件并在需要时引用它们。\n\
  - Subject：这是电子邮件的主题行。它就像一本书的标题，简要概述了电子邮件的内容。\n- Message：这是电子邮件的正文。这是主要内容，发件人通过它向收件人传达信息。\n\
  - Spam/Ham：这是分配给每封电子邮件的标签，指示它是 spam（钓鱼邮件）还是 ham（合法邮件）。它就像一个交通灯，指示电子邮件是否安全（绿色）或可能危险（红色）。\n\
  - Date：这是电子邮件发送的日期。它为每封电子邮件提供了时间上下文，有助于我们了解通信发生的时间。\n\n下面是 CSV 中的一条消息示例：\n\n```\n\
  Message ID: 3675\nSubject: await your response\nMessage: \" dear partner , we are\
  \ a team of government officials (...) john adams ( chairman senate committee on\
  \ banks and currency ) call number : 234 - 802 - 306 - 8507\"\nSpam/Ham: spam\n\
  Date: 2003-12-18\n```\n\n该电子邮件被标记为 spam，表明它是一封钓鱼邮件。主题和消息提供了电子邮件的内容，而日期告诉我们发送时间。Message\
  \ ID 允许我们在数据集中唯一标识这封电子邮件。\n\n在接下来的章节中，我们将探讨如何使用该数据集结合 ELSER 来增强我们检测钓鱼邮件的能力。\n\n\
  另一种方法是加载 Elasticsearch 中的数据集并使用 Kibana 中的数据可视化器。为此，首先连接到你的 Kibana 实例并前往 Machine\
