  \ Search 添加数据助手\n\n5. 点击此按钮并从出现的选项中选择 Use a web crawler（已知问题链接：https://www.elastic.co/guide/en/enterprise-search/current/crawler-known-issues.html）：\n\
  \n## Select an ingestion method\n\nCreate a search optimized Elasticsearch index\
  \ to store your content. Start by selecting an ingestion method.\n\n图 10.7：摄取方法选择\n\
  \n6. 为您的索引命名——这里，我使用了名称 packt-cdl-source：\n\n## Web crawler search index\n\nUse\
  \ the web crawler to programmatically discover, extract, and index searchable content\
  \ from websites and knowledge bases.\n\n## Create an Elasticsearch index\n\nThis\
  \ index will hold your data source content, and is optimized with default field\
  \ mappings for relevant search experiences. Give your index a unique name and optionally\
  \ set a default language analyzer for the index.\n\n图 10.8：网页爬虫搜索索引创建\n\n7. 在 Domain\
  \ URL 字段中，添加 https://www.elastic.co，因为这是我们想要爬取的：\n\n## search-packt-cdl-source\n\
  \n## Add a domain to your index\n\nConfigure the domains you'd like to crawl, and\
  \ when ready trigger your first crawl.\n\nDomain URL\n\nhttps://www.elastic.co\n\
  \nDomain URLs require a protocol and cannot contain any paths.\n\nWeb Crawler entry\
  \ point has been set as /guide\n\nInitial validation\n\nNetwork connectivity\n\n\
  Indexing restrictions\n\nFound a robots.txt file at https://www.elastic.co/robots.txt\
  \ and it allows us access to the domain with some restrictions that may affect content\
  \ indexing.\n\nContent verification\n\n图 10.9：爬虫域名验证\n\n8. 由于我们只想爬取文档，请添加 /guide\
  \ 入口点：\n\n## Manage https://www.elastic.co\n\n## Entry points\n\nInclude the most\
