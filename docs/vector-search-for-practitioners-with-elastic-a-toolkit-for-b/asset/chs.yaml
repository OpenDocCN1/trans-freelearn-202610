  \ es_api_key))\n```\n\n```\n)\nes.info() # should return cluster info\n\n### Download\
  \ the model from Hugging Face and load it into Elasticsearch:\nhf_model_id='dslim/bert-base-NER'\n\
  tm = TransformerModel(model_id=hf_model_id, task_type=\"ner\")\n\nes_model_id =\
  \ tm.elasticsearch_model_id()\nes_model_id\n\n### Load the model into Elastic Cluster\n\
  ### <Load the model using the provided Python code from the GitHub repository>\n\
  ```\n\n- 5. 配置 inference processor 以使用 NER 模式 ID。\n\ninference processor 负责在摄取的数据上运行\
  \ NER 模型。你需要配置处理器以使用你在上一步中加载的 NER 模型的 model_id。在 ingest pipeline 的 JSON 示例中，你会找到以下部分：\n\
  \n```\n{\n  \"inference\": {\n    \"model_id\": \"dslim__bert-base-ner\",\n    \"\
  field_map\": {\n      \"message\": \"text_field\"\n    }\n  }\n}\n```\n\n将 model_id\
  \ 值（\"dslim__bert-base-ner\"）替换为你已加载到 Elasticsearch 中的 NER 模型的实际 model_id。\n\n-\
  \ 6. 在设置好管道和 NER 模型后，你需要确保摄取到 Elasticsearch 索引中的数据首先经过管道。你可以通过将管道指定为索引的一部分来实现这一点。配置数据源或索引设置，以便进入索引的数据首先经过管道。请查阅文档以了解如何将\
  \ ingest pipeline 添加到索引请求中的示例（https://www.elastic.co/guide/en/elasticsearch/reference/current/ingest.html#add-pipeline-to-indexing-request）。\n\
  \n在配置了 ingest pipeline 并加载了 NER 模型后，我们最终将配置索引模板。模板定义了字段数据类型，并配置写入索引的数据通过脱敏管道。\n\n\
  随附的 Python 笔记本包含完整的 Python 代码。我们使用以下设置定义管道：\n\n```\n\"index.default_pipeline\":\
  \ \"pii_redaction_pipeline_book\"\n```\n\n最后一步是使用 Elasticsearch bulk index API 索引虚假数据并确认敏感数据已被脱敏。\n\
  \n完成此步骤后，输出文档应类似于以下示例：\n\n```\n{'_source':\n  {\n  'redacted': '<PER> called in\
  \ from 001-<PHONE>x1311. Their account\n  number is <SSN>'\n  'status': 'active'\n\
  \  }\n```\n\n你会注意到个人的姓名、电话号码和社会安全号码（SSN）已被脱敏。\n\n## 预期结果\n\n一旦在 Elasticsearch 中配置并设置了\
  \ PII 脱敏管道，预期结果如下：\n\n- 当 NER 模型识别出一个实体时，该实体将被替换为用尖括号括起来的对应实体类型。例如，如果 NER 模型识别出一个人的姓名，它将被替换为\
  \ <PERSON>。\n- 当正则表达式模式匹配一个值时，该值将被 <redacted> 术语替换。这确保了敏感信息，例如电话号码和 SSN，在处理后的数据中永远不可见。\n\
  \n在设置了示例 PII 脱敏管道后，让我们看看如何进一步自定义它以满足组织的特定需求。\n\n\n\n\n\n## 在 Elasticsearch 中扩展和自定义\
  \ PII 脱敏管道的选项\n\nElasticsearch 中的 Ingest 处理器提供了一种强大且灵活的方式来自定义数据处理和操作，可以根据公司特定的 PII\
  \ 数据脱敏需求进行定制。在本节中，我们将讨论几种扩展和增强默认 PII 脱敏管道的选项，以更好地满足特定的用例和需求。\n\n## 自定义默认 PII 示例\n\
  \n示例中提供的默认 PII 脱敏管道可以轻松自定义，以更好地适应您组织的数据和需求。一些可能的自定义包括以下内容：\n\n- **用任何其他 Elastic\
  \ 兼容的 NER 模型替换示例 NER 模型**：默认管道使用来自 Hugging Face 的 dslim/bert-base-NER 模型，但您可以将其替换为更符合您特定需求的任何其他\
  \ Elastic 兼容的 NER 模型。\n- **如果不需要这种形式的识别，则移除 NER 模型**：如果您的数据不需要基于 NER 的识别，您可以从管道中移除\
  \ NER 模型，从而简化管道并可能提高性能。\n- **轻松修改 regex/grok 模式步骤**：管道使用 regex/grok 模式来识别和脱敏数据中的特定模式，例如社会安全号码和电话号码。您可以轻松按如下方式修改此步骤：\n\
  - **在发现或识别新的 PII 来源时添加新模式**：随着新的 PII 来源被发现或数据发生变化，您可以向管道添加新的 regex/grok 模式，以确保新的\
  \ PII 得到正确脱敏。\n- **修改现有模式以匹配可能通过或被错误匹配的模式**：如果现有模式未按预期工作，您可以修改它们以更好地匹配数据并改进脱敏过程。\n\
  - **在不再需要或未按预期工作时移除模式**：如果某些模式不再相关或导致问题，您可以将其从管道中移除以提高性能并降低误报的可能性。\n\n## 克隆管道以创建不同数据流的不同版本\n\
  \n根据您组织的数据处理需求，您可能需要为不同的数据流提供不同的脱敏管道。通过克隆和自定义默认 PII 脱敏管道，您可以创建针对特定数据源或类型的多个管道版本，确保每个数据流的脱敏过程准确高效。\n\
  \n## 为特定数据集微调 NER 模型\n\n示例中提供的默认 NER 模型可能不适合每个数据集或用例。对 NER 模型进行微调可以提高模型对您特定数据的性能和准确性：\n\
  \n- **识别您数据中特定的 PII 实体**：默认 NER 模型旨在识别常见的实体，例如姓名、组织和位置。然而，您的数据可能包含默认模型无法识别的独特或行业特定的\
  \ PII 实体。通过在您的数据上微调模型，您可以提高其识别和脱敏这些特定 PII 实体的能力。\n- 此类实体的示例可能包括医疗记录号、客户 ID 或您组织或行业特有的其他敏感标识符。\n\
  - **微调的总体概述**：微调是指取一个预训练的 NER 模型并在您特定数据上进一步训练它。这可以产生更适合您的数据且更准确地识别和脱敏 PII 的模型。\n\
  \n微调 NER 模型的高级过程通常涉及以下步骤：\n\n- I. 收集并预处理包含您希望模型识别的 PII 实体的示例的标注数据集。\n- II. 将标注数据集拆分为训练集和验证集，确保两个集合都包含您希望模型识别的\
  \ PII 实体的代表性样本。\n- III. 在训练集上微调预训练的 NER 模型，根据需要调整模型参数和超参数以实现最佳性能。\n- IV. 在微调过程中定期在验证集上评估模型的性能，以防止过拟合并确保模型能很好地推广到未见数据。\n\
  - V. 微调过程完成后，在测试集上评估模型的性能，以确认其满足您组织对 PII 脱敏准确性和性能的要求。\n- VI. 将微调后的模型集成到您的 Elasticsearch\
  \ PII 脱敏管道中，替换默认的 NER 模型。\n\nPII 脱敏中的上下文感知允许更细致的数据保护。不是一刀切的脱敏，Elasticsearch PII\
  \ 脱敏管道可以根据其周围内容定制移除数据。这确保了有意义的隐私措施，同时避免不必要的数据丢失。\n\n## 上下文感知的逻辑\n\n在某些情况下，您可能只想在信息出现在特定上下文中或被某些单词或短语包围时才进行脱敏。例如，一些组织可能不需要仅仅因为电话号码出现在日志消息中就脱敏它，而只在电话号码所有者的姓名出现在同一条日志消息中时才脱敏，从而将电话号码与某个人联系起来。通过向\
  \ PII 脱敏管道添加自定义逻辑，您可以确保管道仅在这些特定条件下触发脱敏。\n\n要在 PII 脱敏管道中实现上下文感知，请考虑以下步骤：\n\n- 1.\
  \ 分析您的数据并识别应触发 PII 脱敏的上下文或周围单词。这些上下文可能包括特定的关键词、短语或指示敏感信息的模式。\n- 2. 修改管道以包含分析数据以查找这些上下文触发器的自定义脚本处理器。脚本处理器可以使用\
  \ Painless 编写，Painless 是 Elasticsearch 的脚本语言。\n- 3. 在自定义脚本处理器中，实现检查数据中是否存在已识别上下文触发器的逻辑。如果发现触发器，脚本处理器应修改数据以标记相关\
  \ PII 以便脱敏。\n- 4. 更新管道中的 NER 和 regex/grok 模式步骤，仅在被自定义脚本处理器标记后才脱敏 PII。\n\n通过实施这些扩展和增强选项，您可以创建一个定制化的\
  \ PII 脱敏管道，该管道针对您组织特定的数据和需求量身定制。这确保了您的管道既准确又高效，使您能够有效保护敏感信息，同时最大限度地降低误报或脱敏不完整的风险。\n\
  \n实施 PII 脱敏管道，或事实上任何 ingest 管道时需要考虑的一个最后但至关重要的方面是它可能给数据摄取过程带来的潜在延迟。摄取过程中纳入的每个步骤本质上都会导致延迟。然而，可以认为可接受的延迟程度在很大程度上是个别或业务判断的问题。\n\
  \n用户必须了解此上下文中几个关键点的后果。首先，在数据变得可搜索之前，必须衡量脱敏管道引入的延迟量。这对于在数据保护和运营效率之间保持平衡至关重要。\n\n\
  其次，应评估管道配置的每种数据类型脱敏的重要性。这将涉及对每种数据类型敏感性的透彻理解及其对隐私和合规问题的潜在影响。\n\n第三点是确定是否需要扫描每条消息，或者抽样子集是否足够。如果选择后一种方法，组织必须随后决定未抽样的包含\
  \ PII 的数据是否需要清理，以及以后是否可以轻松清理或删除。\n\n\n\n\n\n虽然在 *第 4 章、性能调优——处理数据* 中已详细介绍了集群基准测试，但这里仍值得提及一些高层次的方法：\n\
  \n- 使用 Elasticsearch 的 Rally 工具来比较有和没有 PII 脱敏管道时的数据摄取情况。\n\n> **注意**\n> 你应确保日志中包含一些虚假的\
  \ PII，以模拟脱敏信息的处理时间，而不仅仅是扫描数据。参见本章前面关于 Faker 的部分，了解生成虚假 PII 的示例。\n\n- 使用自定义脚本或其他你可能已搭建好的性能工具。\n\
  \n- 使用 Metricbeat 中 Elasticsearch 模块的 `ingest_pipeline` 指标集来收集处理器计时信息。然后你可以同时监控测试数据以及处理器和整个管道的持续和实时生产计时数据。\n\
  \n在实施 PII 脱敏管道时牢记这些注意事项，可以确保在不影响运营效率的前提下维护数据隐私。\n\n## 摘要\n\n在本章中，我们深入探讨了在 Elasticsearch\
  \ 中创建、配置和自定义 PII 脱敏管道的过程，这是当今数据驱动世界中保护敏感信息的重要工具。你现在应该全面了解如何设置默认管道、根据组织独特需求对其进行自定义，并通过微调\
  \ NER 模型或加入上下文感知能力进一步增强它。掌握这些知识后，你已做好充分准备来应对数据隐私和安全方面的挑战，确保你的组织符合法规要求，并在有效保护其个人信息的同时保持用户信任。\n\
  \n在下一章中，我们将探讨如何将向量搜索用例与 Elastic 平台中的可观测性解决方案相结合。\n\n## 由向量驱动的可观测性新一代\n\n随着我们继续在不同用例中应用向量的旅程，我们将在本章中看到如何将其与可观测性相结合。该领域是\
  \ Elastic 平台提供的解决方案的一部分。可观测性涵盖了诸如日志分析、指标分析和应用性能监控（APM）等概念，其共同目的是建立对系统健康状况的认知，并帮助运维团队在发生时诊断和修复事件的根本原因。\n\
  \n随着系统变得越来越复杂，这些系统的管理对运维团队来说也变得同样复杂。这些系统产生的数据量不断增加，变得难以甚至不可能由人类跟踪，而且变得越来越不稳定和分布式。任何事件管理工作流的一个主要方面都是与数据的交互，无论是通过查询、仪表板还是警报。所有这些操作最终都归结为一个或多个搜索查询。市场上每个解决方案都有自己的查询数据方式，事实上，公司很少为其需要管理的多个信号（日志、指标等）使用单一解决方案。他们甚至可能为指标、日志、APM\
  \ 等分别使用不同的解决方案，这最终只会增加工作流的复杂性。\n\n有了向量、嵌入和语义搜索，就有显著的机会通过规范化查询语言来降低上述复杂性——本质上是在任何可观测性场景中使用\
  \ NLP 与数据交互。然而，要实现这一点，运维团队需要一个足够多功能的平台来提供可观测性、传统搜索和语义搜索的功能。这正是 Elastic 在市场上具有显著优势的地方，因为它将所有这些基本功能集中在一起。\n\
  \n在本章中，我们将重点关注日志，因为它们是可观测性中最常见的元素。我们将涵盖以下主题：\n\n- 可观测性的基础概念\n- 为运维团队的日志提供语义搜索功能的两种方法\n\
  - 使用 Elastic 实现该工作流的端到端实现\n\n## 可观测性及其在现代软件系统中的重要性简介\n\n在将向量应用于可观测性之前，花时间了解可观测性本身的高层次概念很重要。\n\
  \n可观测性是指基于其外部输出来理解构成系统的任何层内部状态的能力。当这些系统是具有多层但产生集中日志输出来描述该“黑盒”行为的单体时，这相对容易。然而，随着公司采用微服务等去中心化云原生架构，该过程变得越来越复杂。这里的可观测性输出变得去相关、分布式，并由多个信号组成，例如日志、指标和追踪等。包括\
  \ Elastic 在内的大多数厂商都通过努力提供集成化的可观测性体验来应对这一挑战，其主要目标是降低平均解决时间（MTTR）指标。\n\n该领域经历了快速发展，许多参与者提供出色的解决方案，帮助客户更轻松地观察软件系统。\n\
  \n让我们来看看构成可观测性主要支柱的信号。\n\n## 可观测性——主要支柱\n\n信号是用于观察 IT 系统健康状况的数据源。信号报告事件，这些事件可以分解为结构化和非结构化事件（就其而言，有些非常标准，如\
  \ Apache 日志，而另一些则高度定制，如来自自定义 Java 应用的日志）。为了使运维团队能够观察其生产运行并了解正在发生的事情，他们需要能够收集、聚合和关联多个信号并为其创建警报。虽然随着\
  \ IT 系统的演进会出现新的信号，但基本且不可避免的信号如下：\n\n- **日志：** 日志是系统中发生的事件的时间戳记录。它们由基础设施、应用程序、操作系统、网络设备以及系统中任何数量的其他组件生成。它们可以携带从简单的状态更新和用户操作到错误和中断的广泛信息。日志通常是非结构化的；事实上，大多数日志都是自定义日志。即使这些日志来自某种标准化系统（例如\
  \ Apache 服务器），通常也存在一定程度的定制，使它们在一次部署与另一次部署之间有所不同。\n\n- **指标**：指标是表示系统在特定时间点的状态或性能的数值测量。常见指标包括\
  \ CPU 使用率、内存消耗、响应时间、存储容量、错误率和吞吐量。指标是系统化的，通常经过汇总，非常结构化，并在固定间隔收集。指标之间的差异在于它们所携带的标签基数。例如，在\
  \ Kubernetes 集群中，其本身就很复杂，尽管规模很小，指标的基数会随着 Kubernetes 集群中定义的命名空间数量增加而增加。\n\n- **追踪**：APM\
  \ 中涉及的追踪是指与业务应用程序中发生的事务直接相关的<|message|> 高级信号。为了更好地理解这一点，请将日志视为显示在电话账单上的电话通话，而追踪则是实际对话的内容。值得注意的是，追踪是日志和指标的组合。这里的复杂性在于能够在分布式去中心化系统中关联同一整体事务中涉及的不同追踪。\n\
  \n正如你到目前为止可能已经意识到的那样，通过结合日志、指标和 APM 数据，我们可以提供对系统状态和行为的全面视图。基于此，运维团队可以接收通知、调查和诊断问题，并识别事件的根本原因。\n\
  \n现在，让我们深入研究日志分析，因为我们将在本章中尝试使用向量改进日志管理流程。\n\n## 日志分析及其在可观测性中的作用\n\n为给定系统实施日志分析的过程已有数十年历史，并随着时间的推移以不同的方式演变，但该过程的核心仍然相同。传统的日志分析方法主要是运维团队连接到有问题的主机，浏览日志文件，使用\
  \ grep 过滤内容，然后希望一切顺利。虽然这种流程对于非常小的部署可能有效，但当日志量和主机数量增长时，它很快就会成为一个头痛问题。鉴于此，已创建了解决方案来将来自不同来源的日志传输到集中位置、解析它们并使其可用于分析。\n\
  \n大多数现有解决方案使用以下流程来实现此目的：\n\n1. 在机器上部署代理。\n2. 代理有时会通过丰富日志源或应用简单的数据转换来执行一定程度的处理。\n\
  3. 代理将日志传输到中央服务器，在那里进行额外的处理。\n4. 用户连接到 UI 并开始使用查询语言搜索、过滤和聚合日志并构建仪表板。\n\n日志不会消失；事实上，当我们查看可观测性时，即使行业试图将信号归入各自的类别，每个信号最终都是一种日志形式。\n\
  \n\n\n\n\n我们认为行业应专注于抽象信号并提出利用数据并为给定用户画像生成情境化用户体验的解决方案……但那是另一本书的内容。虽然日志是最流行且最直接的观察系统的方式，但与之相关存在各种挑战，包括以下几点：\n\
  \n- 日志量庞大，需要一个可扩展的解决方案，在终端用户分析时提供不错的性能。\n- 随着日志量的增长，支持可观测性平台所需的基础设施也会增加，进而导致处理和存储成本上升。\n\
  - 日志量可能变得难以承受，而从所有 surrounding 噪音中提取重要信息并非易事。传统上这是手动完成的，这一过程现在受益于机器学习技术（如无监督学习和异常检测）带来的加速。\n\
  - 搜索日志并减少响应时间需要对日志进行结构化。如果日志保持非结构化，搜索和分析性能会很差。然而，对非技术用户而言，结构化日志的过程本身也可能令人难以承受。\n\
  \n这里列出的挑战都有特定的解决方案。我们将专注于运维团队分析师的体验，更具体地说，如何通过 NLP 增强该体验。\n\n## 一种新方法——将向量和嵌入应用于日志分析\n\
  \n正如你在第 1 章《向量和嵌入简介》中所学，向量和嵌入可用于描述各种概念和思想，我们可以构建代表给定领域的向量空间。谈到日志向量化，有几种方法可用。在以下章节中，我们将回顾我们认为最常见的两种方法：为日志训练或微调现有模型，以及生成人类可理解的描述并对这些描述进行向量化。\n\
  \n## 方法 1——为日志训练或微调现有模型\n\n在此方法中，现有语言模型，例如 word2vec、BERT 或 GPT，会针对日志数据进行训练或微调。这意味着使用原始日志数据集来调整模型的<|message|>\
  \ 参数，使其能够有效捕捉日志数据中独特的特征和模式。训练或微调后的模型随后可用于对原始日志进行向量化，生成代表日志语义内容的嵌入。\n\n![](img/21c3d4250a746422a7489bc2647611d8_145_0.png)\n\
  \n图 7.1：日志直接向量化\n\n让我们来看一下这种方法的优缺点。\n\n### 优点\n\n- **高准确性**：在日志上训练或微调模型时，模型会专门化以理解这些日志及其结构。因此，模型生成的日志嵌入更加准确，更接近给定日志的真实含义。\n\
  - **直接向量化**：使用专用模型时，不会有任何中间过程。原始日志可直接向量化，无需额外处理或人工干预，使过程更高效且可扩展。\n- **可定制性**：模型可针对特定类型的日志（例如服务器日志或应用日志）或特定日志格式进行定制，这可根据其应用的用例提供一定程度的灵活性。\n\
  \n### 缺点\n\n- **需要标注数据**：这种方法的主要不足之一是训练过程本身。在日志上训练模型需要一个大型代表性数据集，而且还需要标注数据。这本身就是一个高耗能项目；并非不可能，只是需要大量工作且构成昂贵的过程。\n\
  - **训练复杂性**：这并非要阻止你进行此过程，但请注意，训练数据集在机器学习领域仍然是一个高门槛。它计算密集，需要特定技能，且缺乏民主化的方法。\n- **对日志格式敏感**：这种方法的主要缺点之一是日志结构可能非常不稳定，无论是不同来源之间，还是同一来源在不同部署中。模型需要在面对日志结构变化时表现出一定程度的弹性。这让我们回到第一个缺点，即数据集需要足够多样化以使模型具有弹性。\n\
  \n## 方法 2——生成人类可理解的描述并对这些描述进行向量化\n\n在此方法中，使用模型生成原始日志的人类可理解描述。然后使用通用语言模型（例如 BERT\
  \ 或 GPT）对这些描述进行向量化，该模型已在大规模通用文本语料库上训练。 resulting 嵌入捕捉从原始日志派生的描述的语义内容。我们可以在图 7.2\
  \ 中看到此过程的描述。\n\n![](img/21c3d4250a746422a7489bc2647611d8_146_0.png)\n\n图 7.2：日志解释后向量化\n\
  \n现在，让我们来看一下这种方法的优缺点。\n\n### 优点\n\n- **可解释性**：通过生成人类可理解的描述，这种方法提供了一定程度的可解释性，有助于理解和解释日志内容。\n\
  - **灵活性**：这种方法可应用于不同类型的日志和日志格式，因为模型生成的描述独立于原始日志结构。\n- **利用预训练模型**：从在大规模文本语料库上训练的预训练模型开始，可节省你从头训练模型的时间，并立即带来价值。在某些情况下，你可能会损失准确性，但你仍有微调模型的能力。\n\
  \n### 缺点\n\n- **信息丢失**：从原始日志生成描述时，你可能会在保真度上有所损失，尤其是在描述被简化或抽象化的情况下。\n- **额外处理**：添加描述的需求会增加数据收集管道的开销，可能导致性能不佳。因此，我们需要考虑日志描述生成过程应在日志存储时进行还是在读取时进行。\n\
  - **描述质量**：嵌入的质量取决于生成描述的质量。如果描述不准确或未捕捉到日志中的关键信息，嵌入可能就没那么有用。\n\n这种第二方法非常有趣的地方在于，日志被扩展并翻译成人类可读的描述。这使我们能够避免通过为其训练模型来为原始日志创建特定的向量空间，因为使用\
  \ OpenAI 的扩展将日志规范化为可向量化的版本。总结来说，对扩展后的日志进行向量化本质上使我们能够在不创建第一个向量空间的情况下将一个向量空间转置到另一个向量空间。\n\
  \n这里的另一个好处是，原始日志中的内容现在被向量化了。这些向量由有意义的嵌入组成，可以轻松地与空间中的其他日志进行语义关联。\n\n在下一节中，我们将介绍扩展和向量化日志以使其准备好进行语义搜索的过程，使用向量搜索。\n\
  \n## 日志向量化\n\n日志向量化是将日志转换为嵌入的过程。此过程需要几个步骤，例如为测试生成日志、扩展并使用通用模型生成向量。\n\n此外，我们在此处做出了在\
  \ Python 中完成所有事情的任意选择，这使你能够出于教育目的在 Google Colab 笔记本中重新执行相同的示例。\n\n本章的所有代码都可在本书 GitHub\
  \ 仓库的 chapter 7 文件夹中获得：https://github.com/PacktPublishing/Vector-Search-for-Practitioners-with-Elastic/tree/main/chapter7。\n\
  \n\n\n\n\n注意，我们将不采用第一种方法直接从日志生成向量，而是采用先将其扩展为人类可读描述的策略，从而避免模型训练的密集过程。\n\n我们现在将学习如何生成合成日志。\n\
  \n## 合成日志\n\n通过合成日志，我们能够在无需生成日志的情况下测试整个管道。合成日志可以被视为任何开发项目中使用的模拟数据。\n\n为了能够在本书中用于测试目的运行该流程，我们准备了一段代码块，可帮助生成合成日志。以下代码块分别通过大量使用\
  \ Faker 库生成 Apache HTTP 访问日志、nginx、Syslog、AWS CloudTrail、Microsoft 事件日志、Linux 审计日志等。\n\
  \n### *Apache HTTP server (common log format)*\n\n以下代码生成 Apache HTTP Server 日志，我们随后将看到如何对所有其他日志格式使用相同的代码结构：\n\
  \n```\nfake = Faker() #we use a single instance for the rest of the code\ndef generate_apache_log():\n\
  \    return\n        '{RemoteHost} - - [{Timestamp}]\n        \"{RequestMethod}{RequestURI}\
  \ {Protocol}\" {StatusCode}\n        {ResponseSize}'.format(RemoteHost=fake.ipv4(),\n\
  \            Timestamp=fake.date_time_this_year()\n                .strftime('%d/%b/%Y:%H:%M:%S\
  \ %z'),\n            RequestMethod=fake.http_method(),\n            RequestURI=fake.uri(),\n\
  \            Protocol='HTTP/1.1',\n            StatusCode=random.choice([200, 404,\
  \ 500]),\n            ResponseSize=random.randint(100, 10000))\n```\n\n### *nginx\
  \ (combined log format)*\n\n```\ndef generate_nginx_log():\nreturn '{RemoteAddress}\
  \ - {RemoteUser} [{Timestamp}] \"{RequestMethod} {RequestURI} {Protocol}\" {StatusCode}\
  \ {ResponseSize} \"{Referer}\" \"{UserAgent}\"'.format(\nRemoteAddress=fake.ipv4(),\n\
  RemoteUser='-',\nTimestamp=fake.date_time_this_year().strftime('%d/%b/%Y:%H:%M:%S\
  \ %z'),\nRequestMethod=fake.http_method(),\nRequestURI=fake.uri(),\nProtocol='HTTP/1.1',\n\
  StatusCode=random.choice([200, 404, 500]),\nResponseSize=random.randint(100, 10000),\n\
  Referer=fake.uri(),\nUserAgent=fake.user_agent()\n)\n```\n\n### Syslog (RFC 5424)\n\
  \n```\ndef generate_syslog():\nreturn '<{Priority}>{Version} {Timestamp} {Hostname}\
  \ {AppName} {ProcID} {MsgID} {StructuredData} {Message}'.format(\nPriority=random.randint(1,\
  \ 191),\nVersion=1,\nTimestamp=fake.date_time_this_year().isoformat(),\nHostname=fake.hostname(),\n\
  AppName=fake.word(),\nProcID=random.randint(1000, 9999),\nMsgID=random.randint(1000,\
  \ 9999),\nStructuredData='-',\nMessage=fake.sentence()\n)\n```\n\n### AWS CloudTrail\n\
  \n```\ndef generate_aws_cloudtrail_log():\nreturn '{\"eventVersion\": \"{EventVersion}\"\
  , \"userIdentity\": {{\"type\": \"IAMUser\", \"userName\": \"{UserName}\"}}, \"\
  eventTime\": \"{Timestamp}\", \"eventSource\": \"{EventSource}\", \"eventName\"\
  : \"{EventName}\", \"awsRegion\": \"{AwsRegion}\", \"sourceIPAddress\": \"{SourceIPAddress}\"\
  , \"userAgent\": \"{UserAgent}\", \"requestParameters\": {{\"key\": \"value\"}},\
  \ \"responseElements\": {{\"key\": \"value\"}}, \"requestID\": \"{RequestId}\",\
  \ \"eventID\": \"{EventId}\", \"eventType\": \"AwsApiCall\", \"recipientAccountId\"\
  : \"{RecipientAccountId}\"}' .format(\nEventVersion='1.08',\nUserName=fake.user_name(),\n\
  Timestamp=fake.date_time_this_year().isoformat(),\nEventSource='s3.amazonaws.com',\n\
  EventName='GetObject',\nAwsRegion='us-east-1',\nSourceIPAddress=fake.ipv4(),\nUserAgent=fake.user_agent(),\n\
  RequestId=fake.uuid4(),\nEventId=fake.uuid4(),\nRecipientAccountId=fake.random_number(digits=12)\n\
  )\n```\n\n### Microsoft Windows event log\n\n```\ndef generate_windows_event_log():\n\
  return '<Event xmlns=\"http://schemas.microsoft.com/win/2004/08/events/event\"><System><Provider\
  \ Name=\"{ProviderName}\"/><EventID>{EventID}</EventID><Level>{Level}</Level><TimeCreated\
  \ SystemTime=\"{Timestamp}\"/><SourceName>{SourceName}</SourceName><Computer>{Computer}</Computer></System><EventData>{Message}</EventData></Event>'.format(\n\
  ProviderName=fake.word(),\nEventID=random.randint(1000, 9999),\nLevel=random.randint(1,\
  \ 5),\nTimestamp=fake.date_time_this_year().isoformat(),\nSourceName=fake.word(),\n\
  Computer=fake.hostname(),\nMessage=fake.sentence()\n)\n```\n\n### Linux audit log\n\
  \n```\ndef generate_linux_audit_log():\nreturn 'type={AuditType} msg=audit({Timestamp}):\
  \ {Message}'.format(\nAuditType=fake.word(),\nTimestamp=fake.date_time_this_year().isoformat(),\n\
  Message=fake.sentence()\n)\n```\n\n### Elasticsearch\n\n```\ndef generate_elasticsearch_log():\n\
  return '{\"timestamp\": \"{Timestamp}\", \"level\": \"{LogLevel}\", \"component\"\
  : \"{Component}\", \"cluster.name\": \"{ClusterName}\", \"node.name\": \"{NodeName}\"\
  , \"message\": \"{Message}\", \"cluster.uuid\": \"{ClusterUuid}\", \"node.id\":\
  \ \"{NodeId}\"}'.format(\nTimestamp=fake.date_time_this_year().isoformat(),\nLogLevel=random.choice(['INFO',\
  \ 'WARN', 'ERROR']),\nComponent=fake.word(),\nClusterName=fake.word(),\nNodeName=fake.word(),\n\
  Message=fake.sentence(),\nClusterUuid=fake.uuid4(),\nNodeId=fake.uuid4()\n)\n```\n\
  \n### MySQL (general query log)\n\n```\ndef generate_mysql_log():\nreturn '{Timestamp}\
  \ {ThreadID} {CommandType}      {CommandText}'.format(\nTimestamp=fake.date_time_this_year().isoformat(),\n\
  ThreadID=random.randint(1000, 9999),\nCommandType=fake.word(),\nCommandText=fake.sentence()\n\
  )\n```\n\n### MongoDB (log format)\n\n```\ndef generate_mongodb_log():\nreturn '{Timestamp}\
  \ {Severity} {Component} [{Context}] {Message}'.format(\nTimestamp=fake.date_time_this_year().isoformat(),\n\
  Severity=random.choice(['I', 'W', 'E']),\nComponent=fake.word(),\nContext=fake.word(),\n\
  Message=fake.sentence()\n)\n```\n\n### Kafka (server log)\n\n```\ndef generate_kafka_log():\n\
  return '[{Timestamp}] {LogLevel} {Component} ({ThreadName}) - {Message}'.format(\n\
  Timestamp=fake.date_time_this_year().isoformat(),\nLogLevel=random.choice(['INFO',\
  \ 'WARN', 'ERROR']),\nComponent=fake.word(),\nThreadName=fake.word(),\nMessage=fake.sentence())\n\
  ```\n\n现在我们已经准备好日志生成基础设施来模拟由我们的应用程序发送的日志，我们将处理日志扩展。\n\n## 使用 OpenAI 在写入时扩展日志\n\n\
  我们现在有一组准备好进行扩展的日志。这里，“扩展”是指我们将使用 OpenAI 模型来解释日志，这将相应地扩大其大小。以下代码位于本书 GitHub 仓库的第\
  \ 7 章文件夹中，说明了如何运行之前的函数。\n\n在此示例中，我们决定生成 Apache 访问日志：\n\n```\n### Example usage\n\
  sources_to_use = ['apache']\ntotal_logs_to_generate = 15\nrandom_logs_per_source\
  \ = True\nlogs = generate_logs(sources_to_use, total_logs_to_generate, random_logs_per_source)\n\
  stringifiedPromptsArray = json.dumps(logs)\nprompts = [{\n\"role\": \"user\",\n\"\
  content\": stringifiedPromptsArray\n}]\n\nbatchInstruction = {\n\"role\": \"system\"\
  ,\n\"content\": \"Explain what happened for each log line of the array. Return a\
  \ python array of the explanation. Only the array, no text around it or any extra\
  \ comment, nothing else than the array should be in the answer. Don't forget in\
  \ your completion to give the day, date and year of the log. Interpret some of the\
  \ log content if you can, for example you have to translate what an error code 500\
  \ is.\"\n}\nprompts.append(batchInstruction)\n### Define the OpenAI API key and\
  \ Elasticsearch connection details\nopenai_api_key = \"YOUR_OPEN_AI_KEY\"\n\n###\
  \ Initialize the OpenAI API client\nopenai.api_key = openai_api_key\nstringifiedBatchCompletion\
  \ = openai.ChatCompletion.create(model=\"gpt-3.5-turbo\",\nmessages=prompts,\nmax_tokens=1000)\n\
  print(stringifiedBatchCompletion.choices[0].message.content)\nbatchCompletion =\
  \ ast.literal_eval(stringifiedBatchCompletion.choices[0].message.content)\n```\n\
  \n请注意，提示是通过用逗号分隔符连接所有日志构建的。这是因为 OpenAI API 不提供批量查询的选项。OpenAI 将一次运行一个提示。\n\n来自日志生成函数的输入将如下所示：\n\
  \n```\n['200.19.87.161 - - [23/Mar/2023:23:03:39 ] \"PATCH http://www.obrien-arias.com/category/login.php\
  \ HTTP/1.1\" 200 9727', '202.90.114.96 - - [11/Mar/2023:22:11:23 ] \"CONNECT http://clark.com/terms/\
  \ HTTP/1.1\" 200 7022', '198.55.207.252 - - [06/Apr/2023:05:43:19 ] \"HEAD https://\n\
  ```\n\n\n\n\nwww.ward.com/index.htm HTTP/1.1\" 200 3016', '3.178.238.218 - - [21/\n\
  Jan/2023:12:08:38 ] \"PUT http://www.hobbs.com/ HTTP/1.1\" 500 8772',\n'110.184.88.144\
  \ - - [09/Jan/2023:20:20:37 ] \"DELETE https://robertson.\ncom/tag/author/ HTTP/1.1\"\
  \ 404 3548'\n\nThe expanded logs become the following:\n\n```\n[\"On March 23rd,\
  \ 2023 at 11:03:39 PM, a PATCH HTTP request was sent to http://www.obrien-arias.com/category/login.php\
  \ and received a 200 response code with a payload size of 9727.\",\n\"On March 11th,\
  \ 2023 at 10:11:23 PM, a CONNECT HTTP request was sent to http://clark.com/terms/\
  \ and received a 200 response code with a payload size of 7022.\",\n\"On April 6th,\
  \ 2023 at 05:43:19 AM, a HEAD HTTP request was sent to https://www.ward.com/index.htm\
  \ and received a 200 response code with a payload size of 3016.\",\n\"On January\
  \ 21st, 2023 at 12:08:38 PM, a PUT HTTP request was sent to http://www.hobbs.com/\
  \ and received a 500 response code indicating an internal server error, with a payload\
  \ size of 8772.\",\n\"On January 9th, 2023 at 08:20:37 PM, a DELETE HTTP request\
  \ was sent to https://robertson.com/tag/author/ and received a 404 response indicating\
  \ the page was not found, with a payload size of 3548.\"]\n```\n\nExpanding the\
  \ logs makes it easier to find a general model to apply to the logs to vectorize\
  \ them, which is what we are going to do in the next part.\n\n## Semantic search\
  \ on our logs\n\nIn this section, we will focus on transforming the expanded logs\
  \ into vectors in Elasticsearch and then implementing a semantic search functionality\
  \ on top of the vectorized content. We do this because—remember—our logs are now\
  \ stored in human-readable language, so we can apply to them the principles of NLP\
  \ and semantic search we saw earlier.\n\n### Building a query using log vectorization\n\
  \nThe following code takes the sequence of expanded logs to build a bulk indexing\
  \ query for Elasticsearch:\n\n```\n#### Generate the sequence of JSON documents\
  \ for a bulk index operation\nbulk_index_body = []\nfor index, log in enumerate(batchCompletion):\n\
  document = {\n    \"_index\": \"logs\",\n    \"pipeline\": \"vectorize-log\",\n\
  \    \"_source\": {\n        \"text_field\": log, \"log\": logs[index]\n    }\n\
  }\nbulk_index_body.append(document)\n```\n\nThe code then executes the bulk indexing\
  \ operation using a Python helper. Note that we do not apply vectorization in the\
  \ Python code; instead, we have loaded a model in Elasticsearch using Eland:\n\n\
  ```\ntry:\n    response = helpers.bulk(es, bulk_index_body)\n    print (\"\\nRESPONSE:\"\
  , response)\nexcept Exception as e:\n    print(\"\\nERROR:\", e)\n```\n\n### Loading\
  \ a model\n\nTo learn more about loading models in Elasticsearch, I recommend you\
  \ read this blog post from Jeff on the Elastic website: https://www.elastic.co/blog/chatgpt-elasticsearch-openai-meets-private-data.\n\
  \nAlso see the following link demonstrating an example of loading a model using\
  \ Eland: https://github.com/jeffvestal/ElasticDocs_GPT/blob/main/load_embedding_model.ipynb.\n\
  \nThe example shows how you can download a model from Hugging Face and load it into\
  \ Elasticsearch using a couple of lines of Python code:\n\n```\n#### Set the model\
  \ name from Hugging Face and task type hf_model_id='sentence-transformers/all-distilroberta-v1'\n\
  tm = TransformerModel(hf_model_id, \"text_embedding\")\n\n#set the modelID as it\
  \ is named in Elasticsearch es_model_id = tm.elasticsearch_model_id()\n\n#### Download\
  \ the model from Hugging Face\ntmp_path = \"models\"\nPath(tmp_path).mkdir(parents=True,\
  \ exist_ok=True) model_path, config, vocab_path = tm.save(tmp_path)\n\n#### Load\
  \ the model into Elasticsearch ptm = PyTorchModel(es, es_model_id) ptm.import_model(model_path=model_path,\
  \ config_path=None, vocab_path=vocab_path, config=config)\n```\n\nUltimately, in\
  \ Kibana | Machine Learning | Model Management | Trained Models, you should see\
  \ the model has been loaded:\n\n![](img/21c3d4250a746422a7489bc2647611d8_155_0.png)\n\
  \nFigure 7.3: Loaded trained model in Kibana\n\n### Ingest pipeline\n\nNow, you\
  \ might have noticed in the previous bulk indexing code that we reference a pipeline\
  \ called vectorize-log. This pipeline is intended to use the model that we loaded\
  \ to generate vectors from the expanded logs. To define a pipeline, you can go to\
  \ Kibana | Stack Management | Ingest Pipelines or try my preferred technique, which\
  \ is to push a pipeline via the create pipeline API (https://www.elastic.co/guide/en/elasticsearch/reference/current/put-pipeline-api.html).\n\
  \nHere is the definition of our pipeline:\n\n```\n[\n  {\n    \"inference\": {\n\
  \      \"model_id\": \"sentence-transformers__all-distilroberta-v1\",\n      \"\
  target_field\": \"description_vectorized\"\n    }\n  },\n  {\n    \"set\": {\n \
  \     \"field\": \"description_vectorized\",\n\n```\n\n```\n\"copy_from\": \"description_vectorized.predicted_value\"\
  \n}\n},\n{\n\"grok\": {\n\"field\": \"log\",\n\"patterns\": [\n\"%{IP:source.ip}\
  \ - - \\\\[%{DATE_YMD:@timestamp}\\\\]\\n\\\"%{WORD:http.request.method} %{DATA:url.original}\
  \ HTTP/%{NUMBER:http.version}\\\" %{NUMBER:http.response.status_code:int}\"\n],\n\
  \"pattern_definitions\": {\n\"DATE_YMD\":\n\"%{MONTHDAY}/%{MONTH}/%{YEAR}%{SPACE}%{HOUR}:%{MINUTE}:\
  \ \\\n?%{SECOND}%{SPACE}\"\n}\n}\n]\n```\n\nEach JSON object in this JSON array\
  \ is a processor. We have three of them in total:\n\n- **Inference**: The first\
  \ one references the ID of the model we loaded. This is done to vectorize the content\
  \ of the field with the name `text_field` to a field called `description_vectorized`.\n\
  - **Set**: The second processor is used to format the output JSON. You will see\
  \ that if you don’t have this processor, the `description_vectorized` output field\
  \ will have a subfield called `predicted_value` in which the vector is stored, but\
  \ that’s not what we want. Our aim is to store the vector directly in our `description_vectorized`\
  \ dense vector field without any unnecessary subfields being introduced.\n- **Grok**:\
  \ Lastly, with the Grok processor, we parse the log to be more structured. The eventual\
  \ goal here is to use the structured log for aggregation and analytics.\n\nBy this\
  \ point, you now have a grasp on how to model your data in a way that enables you\
  \ to keep the source log, benefit from a structured data model, and have vectorized\
  \ content with which you can initiate a semantic search.\n\n### Semantic search\n\
  \nWe are now going to build a function that calls the kNN API to do two things:\n\
  \n- Make a query to filter documents for those where the `description_vectorized`\
  \ field exists\n- Run the actual vector search\n\nHere is the ESSearch function\
  \ implementation:\n\n```\ndef ESSearch(query_text):\n#### Elasticsearch query (BM25)\
  \ and kNN configuration for hybrid search\nquery = {\n\"bool\": {\n\"filter\": [{\n\
  \"exists\": {\n\"field\": \"description_vectorized\"\n}\n}]\n}\n}\n\nknn = {\n\"\
  field\": \"description_vectorized\",\n\"k\": 1,\n\"num_candidates\": 20,\n\"query_vector_builder\"\
  : {\n\"text_embedding\": {\n\"model_id\": \"sentence-transformers__all-distilroberta-v1\"\
  ,\n\"model_text\": query_text\n}\n},\n\"boost\": 24\n}\n\nfields = [\"text_field\"\
  ]\nindex = 'logs'\nresp = es.search(index=index, query=query, knn=knn, fields=fields,\
  \ size=1, source=False)\nprint(resp['hits']['hits'][0]['fields']['text_field'][0])\n\
  return resp['hits']['hits'][0]['fields']['text_field'][0]\n```\n\nAn interesting\
  \ aspect of this code is the use of the semantic search feature (https://www.elastic.co/guide/en/elasticsearch/reference/master/knn-search.html#semantic-search),\
  \ which essentially spares the user from vectorizing the query and passing the vector\
  \ as an argument to the kNN search. The semantic search query allows users to directly\
  \ pass the text version of the query and the model that has been used to vectorize\
  \ the indexed document. As a result, the query and the document are vectorized in\
  \ the same vector space.\n\nTo use the function, simply call the function with the\
  \ query you want to submit to Elastic:\n\n```\nESSearch(\"Were there any errors?\"\
  )\n```\n\nThe result should look like this:\n\n```\nOn March 8th, 2023 at 09:27:46\
  \ AM, a GET HTTP request was sent to https://www.pratt.com/faq.htm and received\
  \ a 404 response indicating the page was not found, with a payload size of 3510.\n\
  ```\n\nThe simplicity of a semantic search implementation with Elasticsearch is\
  \ so disconcerting that we forget the significant value it delivers for **site reliability\
  \ engineering (SRE)** in terms of our understanding of what’s happening in our system\
  \ based on our logs. Operations teams can simply query the system with natural language\
  \ and get the most relevant pieces of information to guide them through their investigation.\n\
  \nThe expansion of logs is a substantial improvement in the incident management\
  \ process, taking all the complexity of log management away from the operations\
  \ team, who no longer need to learn a specific language for the given observability\
  \ solution to interact with their data. Instead, operations teams can now come up\
  \ with their own language.\n\nThe learning curve is thus significantly reduced,\
  \ not only for querying data but also for automation, as the same semantic search\
  \ queries can be used to define alerts. This can also be taken further, with the\
  \ results of the alerts expanded into a ticket with a recommended solution. There\
  \ is a lot of potential in leveraging vectors to automate manual effort in our current\
  \ workflows, reducing the MTTR and increasing our application’s users’ satisfaction.\n\
  \n## Summary\n\nIn this chapter, you hopefully have learned the end-to-end process\
  \ of setting up log vectorization for your log analysis workload based on Elastic.\
  \ One important point for you to decide on while doing this is whether you expand\
  \ the log on write or on read, meaning preparing the data while ingesting it or\
  \ expanding to the meaning of the raw log only when querying it. As you can appreciate,\
  \ this is still an exploratory domain where applying vector search, or GenAI, to\
  \ accelerate observability incident management workflow is just beginning to murmur.\
  \ But you are now prepared with the necessary guidance to implement it as it grows.\n\
  \nIn the next chapter, we will address another domain of application for vectors\
  \ and semantic search—cybersecurity, where the requirements are pretty similar to\
  \ observability in terms of data, but the workflow is quite different.\n\n\n\n\n\
  \n## 向量和嵌入在增强网络安全中的力量\n\n在不断演变的网络安全威胁面前，信息不断涌入，需要创新的工具和方法来筛选庞大的数据集。当需要确定文本背后的细微差别和意图时，这一挑战变得尤为艰巨。\n\
  \n例如，随着网络钓鱼攻击变得越来越复杂，我们如何区分恶意内容和良性内容，尤其是在它们看起来如此相似时？这时 Elastic Learned Sparse EncodeR（ELSER）登场：这是一种强大的工具，旨在从语义层面理解文本，并辨别表面之下的模式和意图。\n\
  \n本章将深入探讨 ELSER，这是由 Elastic 提供的预训练模型，它利用了向量的力量，而无需让用户承受其复杂性。我们将讨论以下关键主题：\n\n- ELSER\
  \ 概述，我们将深入探讨其本质和在语义搜索中的作用\n- 使用 ELSER 处理数据，包括上传、[content]\n\n## 向量和嵌入在增强网络安全中的力量\n\
