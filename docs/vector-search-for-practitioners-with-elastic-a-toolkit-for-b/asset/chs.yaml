- "## Image Search\n\nIn this chapter, we will explore the techniques involved in\
  \ similarity search with images. We will discuss the evolution of image search over\
  \ recent years and delve into the mechanism behind image search. As similarity search\
  \ continues to expand in the world of search today, it is becoming an integral part\
  \ of what users come to expect.\n\nWe will cover the following concepts:\n\n- An\
  \ overview of image search\n- The role of vector search with images\n- Creating\
  \ a vector representation of an image, storing it in Elasticsearch, and performing\
  \ a kNN search using a source image\n- Practical use cases for image and multimedia\
  \ search today\n\n### Overview of image search\n\nImage search is a specialized\
  \ data retrieval methodology that focuses on finding images through the analysis\
  \ and comparison of their visual content. The demand for effective image search\
  \ technology has grown exponentially over the last few years due to an explosion\
  \ in digital imagery across the internet, social media, and other digital platforms.\n\
  \n### The evolution of image search\n\nThe origins of image search can be traced\
  \ back to the early days of the internet when search engines could only analyze\
  \ text associated with an image, such as filenames, alt text, or surrounding textual\
  \ content, to match search queries. However, these methods had their limitations,\
  \ as the actual content of images remained largely ignored.\n\nWith advancements\
  \ in **artificial intelligence (AI)** and **machine learning (ML)**, the capabilities\
  \ of image search have greatly expanded. Now, modern image search technology can\
  \ analyze the actual visual content of images, thanks to the development of techniques\
  \ such as **Convolutional Neural Networks (CNNs)**, image feature extraction, **Vision\
  \ Transformers (ViT)**, and vector similarity search.\n\n### The mechanism behind\
  \ image search\n\nIn the context of machine learning, an image can be understood\
  \ as a matrix of pixel values, and these values can be used as features for machine\
  \ learning models. To make this data manageable, techniques such as **dimensionality\
  \ reduction** (covered in *Chapter 3, Model Management and Vector Considerations\
  \ in Elastic*) and **feature extraction** are employed.\n\nDimensionality reduction\
  \ refers to techniques that transform high-dimensional image data into lower-dimensional\
  \ image data—preserving the most significant patterns or structures, to facilitate\
  \ more efficient processing and analysis. Ideally, without a substantial loss of\
  \ information. The goal of dimensionality reduction is faster computations and improving\
  \ overall model performance.\n\nFeature extraction involves processing an image\
  \ to identify and describe distinct characteristics, such as edges, colors, or shapes.\
  \ These features can then be used as input for machine learning algorithms.\n\n\
  One popular method for feature extraction in image search is the use of deep learning\
  \ models, specifically CNNs. These models are designed to automatically and adaptively\
  \ learn spatial hierarchies of features from images, which has proven highly effective\
  \ in tasks such as image classification and object detection.\n\nOnce features are\
  \ extracted from images, they are typically transformed into a vector representation\
  \ that can be easily compared for similarity. This process is often referred to\
  \ as **vectorization**. Each vector represents a point in a multi-dimensional space,\
  \ and the “distance” between these points can be calculated to determine the similarity\
  \ between images. The shorter the distance, the more similar the images are.\n\n\
  By understanding the essence of each image through vector representation, systems\
  \ can rapidly sift through vast databases to pinpoint the most similar matches to\
  \ a query. In essence, vector similarity search is the mechanism that empowers robust\
  \ and efficient image-based search experiences.\n\n### The role of vector similarity\
  \ search\n\n**Vector similarity search** plays a crucial role in image search. After\
  \ images are transformed into vectors, a search query (also represented as a vector)\
  \ is compared against the database of image vectors to find the most similar matches.\
  \ This process is known as **k-Nearest Neighbor (kNN)** search, where “k” represents\
  \ the number of similar items to retrieve.\n\nSeveral algorithms can be used for\
  \ kNN search, including **brute-force search** and more efficient methods such as\
  \ the **Hierarchical Navigable Small World (HNSW)** algorithm (see *Chapter 7, Next\
  \ Generation of Observability Powered by Vectors* for a more in-depth discussion\
  \ on HNSW). Brute-force search involves comparing the query vector with every vector\
  \ in the database, which can be computationally expensive for large databases. On\
  \ the other hand, HNSW is an optimized algorithm that can quickly find the nearest\
  \ neighbors in a large-scale database, making it particularly useful for vector\
  \ similarity search in image search systems.\n\nThe tangible benefits of image search\
  \ are observed across industries. Its flexibility and adaptability make it a tool\
  \ of choice for enhancing user experiences, ensuring digital security, or even revolutionizing\
  \ digital content interactions.\n\n### Image search in practice\n\nApplications\
  \ of image search are varied and far-reaching. In e-commerce, for example, reverse\
  \ image search allows customers to upload a photo of a product and find similar\
  \ items for sale. In the field of digital forensics, image search can be used to\
  \ find visually similar images across a database to detect illicit content. It is\
  \ also used in the realm of social media for face recognition, image tagging, and\
  \ content recommendation.\n\nAs we continue to generate and share more visual content,\
  \ the need for effective and efficient image search technology will only grow. The\
  \ combination of artificial intelligence, machine learning, and vector similarity\
  \ search provides a powerful toolkit to meet this demand, powering a new generation\
  \ of image search capabilities that can analyze and understand visual content.\n\
  \nTraditionally, image search engines use text-based metadata associated with images,\
  \ such as the image’s filename, alt text, and surrounding text context, to understand\
  \ the content of an image. This approach, however, is limited by the accuracy and\
  \ completeness of the metadata, and it fails to analyze the actual visual content\
  \ of the image itself.\n\nOver time, with advancements in artificial intelligence\
  \ and machine learning, more sophisticated methods of image search have been developed\
  \ that can analyze the visual content of images directly. This technique, known\
  \ as **content-based image retrieval (CBIR)**, involves extracting **feature vectors**\
  \ from images and using these vectors to find visually similar images.\n\nFeature\
  \ vectors are a numerical representation of an image’s visual content. They are\
  \ generated by applying a feature extraction algorithm to the image. The specifics\
  \ of the feature extraction process can vary, but in general, it involves analyzing\
  \ the image’s colors, textures, and shapes. In recent years, CNNs have become a\
  \ popular tool for feature extraction due to their ability to capture complex patterns\
  \ in image data.\n\nOnce feature vectors have been extracted from a set of images,\
  \ these vectors can be indexed in a database. When a new query image is submitted,\
  \ its feature vector is compared to the indexed vectors, and the images with the\
  \ most similar vectors are returned as the search results. The similarity between\
  \ vectors is typically measured using distance metrics such as **Euclidean distance**\
  \ or **cosine similarity**.\n\nDespite the impressive capabilities of CBIR systems,\
  \ there are several challenges in implementing them. For instance, interpreting\
  \ and understanding the semantic meaning of images is a complex task due to the\
  \ subjective nature of visual perception. Furthermore, the high dimensionality of\
  \ image data can make the search process computationally expensive, particularly\
  \ for large databases.\n\n\n\n\n\n为应对这些挑战，**近似最近邻 (ANN)** 搜索算法，例如 HNSW 图，通常被用于优化搜索过程。这些算法以少量精度的损失换取显著的搜索速度提升，使其成为大规模图像搜索应用的实用选择。\n\
  \n随着 Elasticsearch 密集向量字段类型的出现，现在可以在 Elasticsearch 集群内直接索引和搜索高维向量。这种功能结合适当的特征提取模型，为构建高效且可扩展的图像搜索系统提供了强大的工具集。\n\
  \n在以下章节中，我们将深入探讨图像特征提取、向量索引和搜索技术的细节。我们还将演示如何使用 Elasticsearch 和预训练的 CNN 模型进行特征提取来实现图像搜索系统。总体目标是提供一份全面的指南，指导使用最先进技术构建和优化图像搜索系统。\n\
  \n## 使用图像的向量搜索\n\n向量搜索是 Elasticsearch 和其他向量存储的变革性功能，它能够在图像等复杂数据类型中执行搜索。通过这种方法，图像被转换为可以被索引、搜索并相互比较的向量，从而彻底改变了我们检索和分析图像数据的方式。这种产生嵌入的固有特性同样适用于其他媒体类型。本节提供了使用图像的向量搜索过程的深入概述，包括图像向量化、Elasticsearch\
  \ 中的向量索引、kNN 搜索、向量相似度度量以及 kNN 算法的微调。\n\n## 图像向量化\n\n向量搜索过程的第一阶段是将图像数据转换为向量，这一过程称为图像向量化。深度学习模型，特别是\
  \ CNN，通常用于此任务。CNN 设计用于理解和捕捉图像的复杂特征，例如颜色分布、形状、纹理和模式。通过将图像处理为卷积、池化和全连接节点的层，CNN 可以将图像表示为高维向量。该向量封装了图像的关键特征，作为其数值表示。\n\
  \n预训练 CNN 的输出层（通常称为嵌入或特征向量）通常用于此目的。该向量中的每个维度代表从图像中学习到的某个特征。例如，一个维度可能对应于特定颜色或纹理模式的存在。向量中的值量化了这些特征在图像中存在的程度。\n\
  \n![](img/21c3d4250a746422a7489bc2647611d8_115_0.png)\n\n图 5.1：CNN 模型的层\n\n如前图所示，这些是\
  \ CNN 模型的层：\n\n- 1. 接受图像的原始像素值作为输入。\n- 2. 每一层提取特定的特征，如边缘、角点、纹理等。\n- 3. 引入非线性，从错误中学习，并近似更复杂的功能。\n\
  - 4. 通过下采样降低特征图的维度以减少计算复杂度。\n- 5. 由前几层的权重和偏置组成，用于进行分类过程。\n- 6. 输出类别上的概率分布。\n\n##\
  \ 在 Elasticsearch 中索引图像向量\n\n一旦获得图像向量，下一步就是将这些向量索引到 Elasticsearch 中以供将来搜索。Elasticsearch\
  \ 提供了一种特殊的字段类型，dense_vector 字段，用于处理这些高维向量的存储。\n\ndense_vector 字段被定义为数值数组，通常是浮点数，具有指定的维度数（dims）。目前允许索引向量的最大维度数为\
  \ 2,048，未来可能会进一步增加。需要注意的是，每个 dense_vector 字段是单值的，这意味着不可能在一个这样的字段中存储多个值。\n\n在图像搜索的上下文中，每个图像（现在表示为向量）都被索引到\
  \ Elasticsearch 文档中。该向量可以是每个文档一个或每个文档多个向量。表示图像的向量存储在文档中的 dense_vector 字段内。此外，关于图像的其他相关信息或元数据可以存储在同一文档中的其他字段中。\n\
  \n完整示例代码可以在本书 GitHub 仓库的 chapter 5 文件夹中的 Jupyter Notebook 中找到，地址为 https://github.com/PacktPublishing/Vector-Search-for-Practitioners-with-Elastic/tree/main/chapter5，但我们将在此处讨论相关部分。\n\
  \n首先，我们将使用 SentenceTransformer 库初始化一个预训练模型。\n\nclip-ViT-B-32-multilingual-v1 模型将在本章后面详细讨论：\n\
  \n```\nmodel = SentenceTransformer('clip-ViT-B-32-multilingual-v1')\n```\n\n接下来，我们将准备图像转换函数：\n\
  \n```\ntransform = transforms.Compose([\n    transforms.Resize(224),\n    transforms.CenterCrop(224),\n\
  \    lambda image: image.convert(\"RGB\"),\n    transforms.ToTensor(),\n    transforms.Normalize((0.5,\
  \ 0.5, 0.5), (0.5, 0.5, 0.5)),\n])\n```\n\nTransforms.Compose() 组合了以下所有转换：\n\n-\
  \ transforms.Resize(224)：在保持宽高比的同时将图像的较短边调整为 224 像素。\n- transforms.CenterCrop(224)：裁剪图像中心，使结果图像的尺寸为\
  \ 224x224 像素。\n- lambda image: image.convert(\"RGB\")：这是一个将图像转换为 RGB 格式的转换。这对于灰度图像或带\
  \ alpha 通道的图像很有用，因为深度学习模型通常期望 RGB 输入。\n- transforms.ToTensor()：将图像（PIL 图像格式）转换为\
  \ PyTorch 张量。这会将数据从 PIL 图像格式的 [0, 255] 范围更改为 [0.0, 1.0] 范围的浮点数。\n- transforms.Normalize((0.5,\
  \ 0.5, 0.5), (0.5, 0.5, 0.5))：使用给定的均值和标准差对每个通道的张量图像进行归一化。在这种情况下，所有三个通道（R、G、B）的均值和标准差均为\
  \ 0.5。这种归一化会将数据范围从 [0.0, 1.0] 转换为 [-1.0, 1.0]。\n\n我们可以使用以下代码对图像文件应用转换，然后使用模型生成图像向量。有关针对实际图像文件运行的示例，请参阅本章的\
  \ Python 笔记本：\n\n```\nfrom PIL import Image\nimg = Image.open(\"image_file.jpg\"\
  )\nimage = transform(img).unsqueeze(0)\nimage_vector = model.encode(image)\n```\n\
  \n然后可以将向量和其他相关数据索引到 Elasticsearch 中以用于 kNN 搜索：\n\n```\n### Create document\ndocument\
  \ = {'_index': index_name,\n'_source': {\"filename\": filename,\n\"image_vector\"\
  : vector\n```\n\n请参阅本书 GitHub 仓库的 chapter 5 文件夹中的完整代码。\n\n在向量生成并索引到 Elasticsearch\
  \ 后，我们可以继续进行相似图像搜索。\n\n## k-最近邻 (kNN) 搜索\n\n向量现在已索引到 Elasticsearch 中，下一步是使用 kNN\
  \ 搜索。你可以参考第 2 章《Getting Started with Vector Search in Elastic》，以了解有关 kNN 和 HNSW\
  \ 搜索的完整讨论。\n\n与基于文本的向量搜索一样，在使用图像进行向量搜索时，我们首先需要将查询图像转换为向量。该过程与我们在索引时将图像转换为向量的过程相同。\n\
  \n我们将图像转换为向量并将其包含在 knn 搜索函数的 query_vector 参数中：\n\n```\nknn = {\n\"field\": \"image_vector\"\
  ,\n\"query_vector\": search_image_vector[0],\n\"k\": 1,\n\"num_candidates\": 10\n\
  }\n```\n\n在这里，我们指定了以下内容：\n\n- field：索引中包含我们要搜索的图像向量表示的字段\n- query_vector：我们查询图像的向量表示\n\
  - k：我们只想要一个最接近的图像\n- num_candidates：每个分片上要搜索的近似最近邻候选数量\n\n\n\n\n\n在了解了如何将图像转换为向量表示并执行近似最近邻搜索之后，让我们讨论一些挑战。\n\
  \n## 图像搜索的挑战与局限性\n\n虽然使用图像的向量搜索为图像检索提供了强大的功能，但它也伴随着一定的挑战和局限性。其中一个主要挑战是图像向量的高维度，这可能导致计算效率低下，以及在可视化和解释数据时遇到困难。\n\
  \n此外，虽然用于特征提取的预训练模型可以捕捉到广泛的特征，但它们可能并不总是与特定用例相关的特征保持一致。这可能导致搜索结果不理想。一个潜在的解决方案，不仅限于图像搜索，是使用迁移学习在特定任务上微调特征提取模型，尽管这需要额外的数据和计算资源。\n\
  \n## 用于向量搜索的多模态模型\n\n结合文本和图像分类可以更全面地理解多种类型数据之间的关系。我们已经为图像生成了向量并学会了如何搜索相似图像，所以让我们探索什么是多模态向量搜索以及它的一些实际用例。\n\
  \n## 引言与 rationale\n\n多模态模型的出现引发了我们对数据分析和表示理解的地震式转变。三个可以利用这一创新技术的例子包括新闻机构、电子商务网站和社交媒体平台。这些行业中的每一个都可以从多媒体搜索的多功能性和适应性中显著受益，提升用户体验并推动其增长。\n\
  \n在核心上，多模态模型寻求整合和解释不同类型的数据信息，例如文本和图像。这种整合方法使这些模型能够捕捉各种数据类型之间细微的交互，通常产生的结果大于各部分之和。一个强大的协同作用示例是在同一向量空间中结合文本描述和图像分类。\n\
  \n这种方法的好处是多方面的。首先，它极大地增强了搜索能力，因为查询现在可以根据文本和视觉信息检索结果。例如，关于“绿色苹果”的查询可以返回绿色苹果的图像、绿色苹果的文本描述，或两者的组合。\n\
  \n其次，这种方法可以显著提高搜索结果的相关性。由于模型同时考虑文本和视觉信息，它对查询概念有更广阔、更丰富的理解。这种更丰富的理解可以帮助过滤掉无关结果，并优先考虑从不同角度最匹配查询的结果。\n\
  \n最后，这种方法促进了跨模态搜索，例如文本到图像和图像到文本搜索。例如，用户可以输入文本查询并接收图像结果，或反之亦然。这扩展了搜索系统的可用性，使其更灵活、更用户友好。\n\
  \n## 理解多模态模型中向量空间的概念\n\n多模态模型的操作及其后续能力的基石在于其向量空间，通常表示为“共享”或“共同”向量空间。这个概念借鉴自线性代数，构成了多模态模型如何运作的基础，为不同类型的数据提供了可以和谐表示和处理的平台。\n\
  \n在这个共享向量空间中，向量——具有大小和方向的参数化数学实体——用于表示不同的数据模态。这可能包括模型正在处理文本描述和图像。每种向量然后代表多维空间中的一个点，对应于一个单独的文本描述或图像。这种表示既优雅又实用，因为两个向量之间的几何接近度或距离可用于表示两个对应实体之间的相似性或不相似性。\n\
  \n这里的几何接近度概念并非随意；它植根于度量空间理论，其中距离函数或度量量化空间内任意两个对象之间的不相似性。在多模态向量空间中，余弦相似度或欧几里得距离通常用作度量。距离越低或余弦相似度越高，两个向量——从而两个对应实体——就越相似。\n\
  \n为了实现这一想法，模型采用了本章前面讨论过的向量化。在向量化期间，模型使用两种不同的编码器——一个用于文本，另一个用于图像——将文本描述和图像转换为向量。这种转换类似于翻译过程，其中文本描述和图像的复杂性和特征被提炼成向量的语言，这是模型可以更轻松地理解、分析和学习的一种语言。\n\
  \n与需要标记图像数据集的传统计算机视觉模型不同，CLIP 利用在线上可用的大量文本-图像对来以灵活的方式理解和分类图像。这种独特的方法使 CLIP 能够在无需任务特定微调的情况下推广到广泛的任务，突出了多模态模型在弥合视觉与语言之间差距的强大潜力和潜力。\n\
  \n## OpenAI clip-ViT-B-32-multilingual-v1 模型的介绍\n\n**OpenAI clip-ViT-B-32-multilingual-v1\
  \ 模型**，通常简称为 **CLIP**，是多模态模型的典范。CLIP 于 2021 年 1 月 5 日推出，通过从自然语言监督中高效学习视觉概念，彻底改变了计算机视觉领域（openai.com/research/clip）。换句话说，它是根据互联网上发现的各种文本描述来识别各种图像进行训练的。\n\
  \n与在手动标记数据集上训练的大多数计算机视觉模型不同，CLIP 是在互联网上 readily 可用的文本-图像对上训练的。这种训练方法使 CLIP 能够学习各种视觉概念及其相关名称，使其能够执行各种分类任务。然而，CLIP\
  \ 的能力并非没有局限性。它的性能取决于训练数据的质量和多样性，并且在需要理解训练数据中未充分捕捉的细微视觉细节或上下文的任务上可能表现不佳。\n\n在了解了机制之后，让我们探索图像向量搜索的一些实际用例。\n\
  \n## 为多样化媒体类型实现向量搜索\n\n现在我们已经了解了多模态或多媒体搜索的基础知识，让我们深入探讨一下它如何应用于各种类型的内容：\n\n- **Text**:\
  \ 向量搜索可用于查找相关文档、文章或文本片段。每个文档使用诸如 TF-IDF 或词、句子或文档嵌入等技术转换为向量。当用户输入搜索查询时，系统会找到最接近查询向量的文本向量。\n\
  - **Images**: 图像可以使用深度学习模型进行分析以提取特征向量。这些向量捕捉图像的视觉内容。如果用户使用图像查询进行搜索，系统会找到与查询图像向量最相似的图像向量。\n\
  - **Videos**: 视频稍微复杂一些，因为它们包含视觉和音频信息。然而，类似的技术可用于从视频和音频内容中提取特征向量。系统然后使用这些向量来查找响应用户查询的相关视频。\n\
  \n多媒体搜索的强大功能和潜力在实际场景中实施时真正闪耀。\n\n## 新闻机构\n\n在新闻机构的世界里，多媒体搜索是增强内容发现和提供全面新闻体验的强大工具。例如，记者可以从这项技术中显著受益。如果他们正在撰写关于气候变化的文章，多媒体搜索可以帮助他们访问文章的相关内容。不仅仅是相关文章，还有展示气候变化影响的图像、专家访谈的视频片段、说明气候趋势的信息图表，甚至气候活动人士演讲的音频片段。这种广泛的多媒体内容可以增强报道的深度和丰富性。此外，从消费者的角度来看，多媒体搜索可以为读者策划多媒体故事板，其中相关视频、信息图表、照片集和播客与文本文章一起呈现，提供更丰富、更身临其境的体验。\n\
  \n\n\n\n## 电子商务平台\n\n电子商务平台可以利用多媒体搜索的力量，将其产品推荐提升到新的水平。通过分析产品描述和客户评论等文本数据，以及通过图像识别分析产品的视觉特征，它们可以提供更精确、更个性化的推荐。例如，如果用户一直在浏览古董手表，多媒体搜索算法可以分析所查看手表的图像，理解吸引用户的特定视觉元素。然后，该分析可用于推荐其他具有相同视觉特征的产品。这不仅提高了推荐的准确性，还增强了整体用户体验，有可能提高销售额和客户留存率。\n\
  \n## 社交媒体平台\n\n社交媒体平台充斥着多媒体内容，可以显著受益于多媒体搜索，以改进内容发现和用户参与度。假设某个用户发布了一张自制披萨的照片。在这种情况下，多媒体搜索可以分析这张图片，识别出它是披萨，然后推荐其他相关内容——例如披萨制作视频教程、披萨食谱博客文章，或其他用户分享的自制披萨帖子。这不仅创造了更具吸引力和个性化的社交媒体体验，还加强了内容审核工作。通过分析文本、图像和视频内容，平台可以更好地检测和过滤不当或有害内容，提高平台的整体质量和安全性。\n\
  \n这些综合示例展示了多媒体搜索从新闻机构、电子商务平台到社交媒体网络等多个领域的变革潜力。通过提高用户参与度、增强内容发现和个性化，多媒体搜索提供了显著的好处，可以彻底改变我们与数字内容互动的方式。\n\
  \n这些示例只是图像和多媒体向量搜索潜在用例的冰山一角。随着模型不断进步，新行业开始探索各种可能性，新的用例每天都在涌现。\n\n## 总结\n\n在本章中，我们探索了图像相似性搜索的世界，了解了它的演变过程和实际工作机制。我们讨论了基于向量的图像搜索在当今快节奏数字环境中的变革性力量。我们获得了创建图像向量表示并将其集成到\
  \ Elasticsearch 中的能力。我们了解了利用 kNN 搜索的力量如何为提升用户体验带来无数可能。我们还看到了图像和多媒体搜索的应用如何跨越众多领域，巩固了其在现代数字时代的重要性。\n\
  \n在下一章中，我们将讨论如何利用 NLP 模型以及其他 Elasticsearch 功能，在个人身份信息被摄入 Elasticsearch 之前对其进行脱敏处理。\n"
- "## 使用 Elasticsearch 脱敏个人身份信息\n\n在本章中，我们将探索如何在 Elasticsearch 中创建和配置 **个人身份信息（PII）**\
  \ 脱敏管道，以有效识别和脱敏数据中的敏感信息。随着数据隐私和安全性变得越来越重要，保护个人信息的能力对组织来说至关重要。\n\n我们将介绍以下内容：\n\n\
  - 如何使用 Elasticsearch 的摄取处理器安装和定制 PII 脱敏管道\n- 扩展和增强管道，以满足贵组织的特定数据脱敏需求\n\n这个过程将使你能够创建一个稳健、准确、高效的解决方案，以保护敏感信息并确保符合数据隐私法规。\n\
  \n## PII 与脱敏概述\n\nPII 指任何可用于识别个人身份的数据，无论是直接识别，还是与其他信息结合后间接识别。PII 包括姓名、地址、电话号码、电子邮件地址、社会安全号码、驾驶证号码和信用卡号等数据。由于隐私问题，以及规定公司应如何管理和保护此类数据的法律和监管要求，保护\
  \ PII 至关重要。\n\n在数据隐私的背景下，**脱敏**是从文档、日志和其他数据源中移除或隐藏敏感信息的过程，以便剩余数据可以在不暴露 PII 的情况下共享或分析。这涉及**掩蔽**、**假名化**或**加密**等技术，具体取决于环境和要求。脱敏的目标是在保持数据实用性和维护相关个人隐私之间取得平衡。\n\
  \n## 可能包含 PII 的数据类型\n\n可能包含 PII 的数据类型多种多样，了解敏感信息可能存在于公司系统的哪些位置至关重要。最常见的四种数据类型如下：\n\
  \n- **日志**：应用程序、服务器和其他系统生成的日志通常包含 PII。这可能包括用户身份验证数据、IP 地址、用户生成的内容，或可能无意中包含敏感信息的错误消息。日志对于故障排除、监控和分析系统性能至关重要，但若管理不当也可能带来风险。\n\
  - **应用程序性能监控（APM）数据**：APM 工具通常通过捕获用户交互、系统性能和错误数据，帮助企业监控和管理应用程序的性能。如果未妥善净化，这些数据可能无意中包含\
  \ PII，如用户名、电子邮件地址，甚至支付信息。\n- **数据库和数据存储**：公司在数据库和其他数据存储中存储大量信息，包括客户信息、员工记录和交易数据。这些存储库通常保存大量\
  \ PII，因此受严格数据保护法规的约束。\n- **非结构化数据**：PII 也可能出现在非结构化数据源中，例如电子邮件、文档、图像等。这可能使识别和脱敏 PII\
  \ 变得更加困难，因为需要更高级的技术（如自然语言处理）来解析和理解内容。\n\n在强调 PII 可能存在的主要领域之后，必须更深入地探讨处理此类敏感信息不当所带来的潜在危害。具体而言，在日志中，PII\
  \ 往往容易被忽视，因此理解其中的风险至关重要。现在，我们将讨论无意在日志中存储 PII 所带来的复杂问题和后果。\n\n## 在日志中存储 PII 的风险\n\
  \n在日志、APM 数据和其他数据源中存储 PII，如果未妥善管理和保护，可能对企业和个人都产生严重后果。风险包括（但不限于）以下几点：\n\n- **财务罚款和处罚**：未能遵守数据保护法规（如\
  \ **通用数据保护条例（GDPR）** 或 **加州消费者隐私法案（CCPA）**）的公司可能面临严厉的罚款和处罚。根据违规严重程度和公司规模，这些罚款可能高达数百万美元。\n\
  - **声誉损害**：数据泄露和隐私违规行为会损害公司声誉并削弱客户信任。在某些情况下，此类事件的后果可能导致业务损失、股价下跌，甚至破产。\n- **法律和监管后果：**\
  \ 未能保护 PII 的公司可能面临诉讼、监管行动和其他法律后果。这些可能代价高昂且耗时，在某些情况下甚至可能导致公司高管面临刑事指控。\n- **对个人的风险：**\
  \ 当 PII 泄露或丢失时，会对受影响的个人造成严重后果。他们可能面临身份盗窃、财务损失或其他形式的伤害，并可能需要采取措施保护自己和自身财产。\n\n既然我们了解了\
  \ PII 的类型以及存储 PII 的风险，下面我们来探讨 PII 数据通常是如何丢失或暴露的。\n\n## PII 是如何泄露或丢失的\n\nPII 可能通过各种方式泄露或丢失，其中有些是无意的，而另一些则可能是恶意活动的结果。了解这些潜在的数据泄露来源，对于公司预防和减轻\
  \ PII 暴露至关重要。PII 泄露或丢失的一些常见方式包括：\n\n- **人为错误：** 员工或其他个人的失误可能导致 PII 被无意暴露。这可能包括意外共享敏感数据、错误配置安全设置，或使用容易被破解的弱密码。\n\
  - **内部威胁：** 怀有恶意的员工或承包商可能故意泄露 PII，通常是为了个人利益或对公司造成损害。这可能涉及窃取敏感数据或破坏系统以暴露 PII。\n-\
  \ **外部攻击：** 网络罪犯和黑客经常以公司为目标窃取 PII，然后可能在暗网上出售，或用于身份盗窃或其他不法目的。这些攻击可能以网络钓鱼诈骗、勒索软件或利用公司系统漏洞的形式出现。\n\
  - **不安全的存储和传输：** 以未加密或其他不安全格式存储 PII 会增加数据泄露的风险。同样，通过不安全的渠道传输敏感数据可能会使 PII 被恶意行为者截获。\n\
  - **第三方泄露：** 公司经常与供应商、合作伙伴或其他第三方共享 PII。如果这些组织遭遇数据泄露，公司提供的 PII 可能会暴露，即使公司本身已采取适当的安全措施。\n\
  \n通过了解这些 PII 泄露和丢失的潜在来源，公司可以采取措施保护敏感数据、实施适当的安全措施，并尽量降低与存储和处理 PII 相关的风险。这包括实施访问控制、加密静态和传输中的数据、定期进行安全审计和漏洞评估，并为员工提供有关数据隐私和安全最佳实践的培训。\n\
  \n\n\n\n现在我们已经掌握了识别 PII 来源的重要性以及实施严格安全措施的重要性，下一步的逻辑步骤是讨论用于涂抹此类敏感信息的实用技术。在数字时代，结构化和非结构化数据经常混杂在一起，使用\
  \ NER 模型和正则表达式模式的混合方法成为一种强大的解决方案。让我们探讨如何有效地利用这些工具来保护 PII。\n\n## 使用 NER 模型和正则表达式模式涂抹\
  \ PII\n\n涂抹 PII 的过程通常需要多方面的方法，以确保敏感数据能够从各种数据源中准确识别并移除。用于涂抹 PII 的两种关键技术是 **命名实体识别\
  \ (NER)** 模型和 **正则表达式 (regex)** 模式。结合这些方法可以帮助识别广泛的 PII 类型并确保全面的数据保护。\n\n## NER 模型\n\
  \nNER 是一种 **自然语言处理 (NLP)** 技术，用于识别和分类文本数据中的命名实体，例如人名、地点、组织和其他特定信息。NER 模型在涂抹 PII\
  \ 时特别有用，因为它们可以识别不遵循通用模式或结构的实体。这使得能够检测和涂抹不太可预测的 PII 类型，而这些类型仅使用正则表达式模式可能更难以识别。\n\n\
  诸如基于 **BERT (Bidirectional Encoder Representations from Transformers)** 的机器学习模型在\
  \ NER 任务中已显示出显著的成功。其中一个模型是来自 Hugging Face 的 **dslim/bert-base-NER**，它已被训练用于识别各种命名实体。通过利用此类\
  \ NER 模型，组织可以高效地识别并涂抹存在于非结构化文本数据中的 PII，例如电子邮件、文档和日志。\n\n## 正则表达式模式\n\nRegex 是在文本数据中进行模式匹配和操作的有力工具。正则表达式模式对于识别和涂抹遵循标准模式或结构的\
  \ PII 特别有用。通过设计正则表达式模式来匹配这些常见结构，组织可以快速、准确地从各种数据源中检测并移除 PII。\n\n**Grok 模式** 为文本数据中的模式匹配提供了比正则表达式更用户友好的替代方案。Grok\
  \ 模式本质上是一组预定义的正则表达式模式，可以组合和重用以更轻松地创建更复杂的表达式。这种方法简化了编写和维护模式匹配规则的过程，使其对不熟悉正则表达式语法的用户更易于访问。\n\
  \n对于 Elasticsearch 中的涂抹管道，我们将使用一个名为 **redact processor** 的新处理器。该处理器使用 Grok 模式而非传统的正则表达式进行模式匹配。在以下部分，我们将更详细地讨论\
  \ redact processor 的实现和使用情况，概述它如何利用 Grok 模式来识别并从数据源中涂抹 PII。\n\n可使用正则表达式/grok 模式识别的\
  \ PII 类型示例包括以下内容：\n\n- **信用卡号码**：信用卡号码通常遵循特定模式，具有固定数量的数字和可识别的格式。可以设计正则表达式模式来识别并涂抹这些号码，而与发卡机构无关。\n\
  - **社会安全号码**：美国的社会安全号码由九位数字组成，以连字符分隔为三组（例如，123-45-6789）。这种标准格式使得创建正则表达式模式来识别和涂抹这些号码变得简单。\n\
  - **银行账号**：虽然银行账号的长度和格式可能因金融机构而异，但许多银行遵循可使用正则表达式模式识别的通用模式。此外，特定关键词的存在，例如“account\
  \ number”或“routing number”，可以帮助细化正则表达式模式以准确识别和涂抹此信息。\n- **电子邮件地址**：电子邮件地址遵循标准格式，包括本地部分、“@”符号和域名。可以设计正则表达式模式来识别并涂抹电子邮件地址，有助于保护个人隐私并防止潜在的数据泄露。\n\
  - **电话号码**：电话号码通常遵循可识别的模式，具有固定数量的数字和标准格式（例如，(123) 456-7890 或 +1 123 456 7890）。正则表达式模式可用于从各种数据源中识别和涂抹电话号码，确保联系信息保持私密。\n\
  \n虽然 grok 模式擅长识别信用卡号码或电子邮件地址等结构化数据形式，但在非结构化数据中仍存在可能逃避它们的细微差别。这正是将 grok 与 NER 模型合并的价值所在。通过将\
  \ Grok 的精确性与 NER 的上下文深度相结合，我们旨在创建更全面的涂抹策略，显著降低 PII 未被注意的机会。让我们探索这种组合方法以实现更强大的数据保护。\n\
  \n## 结合 NER 模型和正则表达式（或 grok）模式进行 PII 涂抹\n\n为了最大化 PII 涂抹的有效性，组织应考虑使用 NER 模型和正则表达式模式的组合。这种两阶段方法确保结构化和非结构化\
  \ PII 都能从数据源中准确识别并移除。\n\n在第一阶段，可以将 NER 模型应用于文本数据以识别可能包含 PII 的命名实体。然后可以利用 NER 模型的输出来涂抹或屏蔽文本中已识别的实体。\n\
  \n在讨论了 NER 模型与正则表达式在发现 PII 方面的协同作用后，让我们讨论如何在 Elasticsearch 中操作化 PII 涂抹管道。Elasticsearch\
  \ 平台提供了一个强大的解决方案，即 ingest pipelines，旨在在数据摄取时清理数据。将 grok 模式的精确性与我们讨论的技术相结合，为敏感数据处理提供了更整体的方法。\n\
  \n## Elasticsearch 中的 PII 涂抹管道\n\nElasticsearch 中的 PII 涂抹管道旨在在数据被摄取到 Elasticsearch\
  \ 集群时自动涂抹敏感信息。此过程确保敏感数据得到保护，这在处理可用于识别个人的个人信息时尤其重要，例如姓名、地址、电话号码和社会安全号码。\n\n在本节中，我们将讨论用户可以采取的步骤来配置\
  \ Elasticsearch 中的 PII 涂抹管道。\n\n要查看完整代码，请打开本书 GitHub 仓库 chapter 6 文件夹中的 Jupyter\
  \ Notebook：https://github.com/PacktPublishing/Vector-Search-for-Practitioners-with-Elastic/tree/main/chapter6。\n\
  \n我们将回顾管道的关键要点。\n\n## 生成合成 PII\n\n要运行我们的管道，我们需要一个数据集。幸运的是我们有 faker，即用于生成给定类型假数据的\
  \ Python 库。我们在此的任务涉及两个步骤：\n\n- 使用 faker 生成数据\n- 批量将数据索引到 Elasticsearch\n\n以下是生成数据的代码（如果尚未安装，可使用\
  \ pip install 命令安装 Faker）：\n\n```\nfrom faker import Faker\nimport json\nfrom pprint\
  \ import pprint\n\n### Create an instance of the Faker class\nfake = Faker()\n\n\
  ### Define a function to generate fake personal identification information\ndef\
  \ generate_fake_pii(num_records):\n\nfake_data = []\n\nfor x in range(num_records):\n\
  ### Generate fake personal identification information\nfn = fake.first_name()\n\
  ln = fake.last_name()\npn = fake.phone_number()\n```\n\n```\nsn = fake.ssn()\nai\
  \ = fake.random_element(elements=('active', 'inactive'))\n\ncall_log = {\n'message'\
  \ : f'{fn} {ln} called in from {pn}. Their account number is {sn}',\n'status' :\
  \ ai\n}\n\nfake_data.append(call_log)\nreturn fake_data\n\n### Generate fake personal\
  \ identification information for N individuals\nnum_records = 10 # Set the desired\
  \ number of records\nfake_pii_data = generate_fake_pii(num_records)\n\npprint(fake_pii_data)\n\
  ```\n\n这将输出如下所示的记录：\n\n```\n{\n'message': 'Stephen Gomez called in from 9162417050.\
  \ Their account number is ' '275-51-8055',\n'status': 'inactive'\n},\n### Import\
  \ the required libraries\nfrom faker import Faker\nimport json\n### Create an instance\
  \ of the Faker class\nfake = Faker()\n### Define a function to generate fake personal\
  \ identification information\ndef generate_fake_pii(num_records):\n### Create an\
  \ empty list to store the fake data\nfake_data = []\n### Generate the specified\
  \ number of fake records\nfor _ in range(num_records):\n### Generate fake personal\
  \ identification information\nperson = {\n'first_name': fake.first_name(),\n'last_name':\
  \ fake.last_name(),\n'email': fake.email(),\n'phone_number': fake.phone_number(),\n\
  ```\n\n\n\n\n\n```\n'address': fake.address(),\n    'ssn': fake.ssn(),\n    'birthdate':\
  \ fake.date_of_birth(tzinfo=None, minimum_age=18, maximum_age=90).strftime('%Y-%m-%d'),\n\
  \    'gender': fake.random_element(elements=('M', 'F'))\n}\n### Append the fake\
  \ data to the list\nfake_data.append(person)\nreturn fake_data\n\n### Generate fake\
  \ personal identification information for N individuals\nnum_records = 10 # Set\
  \ the desired number of records here\nfake_pii_data = generate_fake_pii(num_records)\n\
  print(fake_pii_data)\n```\n\n前面的代码允许你设置要生成的文档数量。该数据集应具有足够的（虚假）PII，供你测试脱敏管道。\n\n\
  一旦这些测试文档生成后，你可以执行第二步，将文档批量索引到 Elasticsearch 中：\n\n```\nfrom elasticsearch import\
  \ Elasticsearch, helpers\n## Bulk Indexer\n### Define a function to generate an\
  \ array of documents for Elasticsearch\ndef generate_documents_array(fake_data,\
  \ index_name):\n### Create an empty list to store the documents\n    documents =\
  \ []\n### Iterate over the fake data and format it as documents\n    for person\
  \ in fake_data:\n### Create a document with the _index and _source keys\n    document\
  \ = {\n        '_index': index_name,\n        '_source': person\n    }\n### Append\
  \ the document to the list of documents\n    documents.append(document)\nreturn\
  \ documents\n### Generate the array of documents for Elasticsearch\nindex_name =\
  \ 'pii' # Set the desired index name here\ndocuments_array = generate_documents_array(fake_pii_data,\
  \ index_name)\n\n### Initialize the Elasticsearch client\nes = Elasticsearch(['HOSTNAME:PORT'],basic_auth=('USERNAME',\
  \ 'PASSWORD'),verify_certs=False)\n```\n\n```\n### Convert the bulk index body to\
  \ a single string with newline separators\nprint(\"Bulk request: \")\nprint(documents_array)\n\
  \ntry:\n    response = helpers.bulk(es, documents_array)\n    print (\"\\nRESPONSE:\"\
  , response)\nexcept Exception as e:\n    print(\"\\nERROR:\", e)\nAfter running\
  \ this code, you should see the following type of document in the \"pii\" index\
  \ in your Elasticsearch cluster:\n{\n    \"_index\": \"pii\",\n    \"_id\": \"Hzge9IcBeW7_RVqxfOJf\"\
  ,\n    \"_score\": 1,\n    \"_source\": {\n        \"first_name\": \"Jessica\",\n\
  \        \"last_name\": \"Baker\",\n        \"email\": zrojas@example.com,\n   \
  \     \"phone_number\": \"+1-537-947-4261\",\n        \"address\": \"\\\"96702 Cannon\
  \ Mall Serranofurt, KS 41609\\\"\",\n        \"ssn\": \"811-48-4463\",\n       \
  \ \"birthdate\": \"1977-10-30\",\n        \"gender\": \"M\"\n    }\n}\n```\n\n在生成并索引了虚假数据后，我们需要配置默认的\
  \ ingest 管道和索引模板，并加载 NER 模型。\n\n## 安装默认管道\n\n要在 Elasticsearch 中设置 PII 脱敏管道，我们需要安装默认管道并将其配置为使用来自\
  \ Hugging Face 的提供的 NER 模型。步骤如下：\n\n- 1. ingest pipeline 是一系列处理器，用于在数据被索引到 Elasticsearch\
  \ 之前修改或丰富数据。在 PII 脱敏管道的上下文中，管道将用于从数据中删除敏感信息。要安装管道，你需要从 GitHub 仓库复制提供的 JSON 示例，并在\
  \ Elasticsearch 中使用此配置创建一个新管道。\n\n你可以使用 Elasticsearch 的 REST API 按如下方式创建管道：\n\n\
  ```\nPUT _ingest/pipeline/pii_redaction_pipeline\n{\n  \"description\": \"PII redacting\
  \ ingest pipeline\",\n  \"processors\": [\n    {\n      \"set\": {\n        \"field\"\
  : \"redacted\",\n        \"value\": \"{{message}}\"\n      }\n    },\n    {\n  \
  \    \"inference\": {\n        \"model_id\": \"dslim__bert-base-ner\",\n       \
  \ \"field_map\": {\n          \"message\": \"text_field\"\n        }\n      }\n\
  \    },\n    {\n      \"script\": {\n        \"lang\": \"painless\",\n        \"\
  source\": \"\"\"String msg = ctx['message'];\n        for (item in ctx['ml']['inference']['entities'])\
  \ {\n          msg = msg.replace(item['entity'], '<' + item['class_name'] + '>')\n\
  \        }\n        ctx['redacted']=msg\"\"\",\n        \"if\": \"return ctx['ml']['inference']['entities'].isEmpty()\
  \ == false\",\n        \"tag\": \"ner_redact\",\n        \"description\": \"Redact\
  \ NER entities\"\n      }\n    },\n    {\n      \"redact\": {\n        \"field\"\
  : \"redacted\",\n        \"patterns\": [\n          \"%{PHONE:PHONE}\",\n      \
  \    \"%{SSN:SSN}\"\n        ],\n        \"pattern_definitions\": {\n          \"\
  SSN\": \"\"\"\\d{3}-?\\d{2}-?\\d{4}\"\"\",\n          \"PHONE\": \"\"\"\\d{3}-?\\\
  d{3}-?\\d{4}\"\"\"\n        }\n      }\n    }\n  ]\n}\n```\n\n```\n}\n    }\n},\n\
  {\n    \"remove\": {\n        \"field\": [\n            \"message\",\n         \
  \   \"ml\"\n        ]\n    }\n}\n],\n\"on_failure\": [\n    {\n        \"set\":\
  \ {\n            \"field\": \"failure\",\n            \"value\": \"pii_script-redact\"\
  \n        }\n    }\n]\n}\n```\n\n- 2. 从 Hugging Face 加载并启动 NER 模型。\n\n- 3. 你需要使用\
  \ Python 中的 eland 库从 Hugging Face Model Hub 加载一个兼容的 NER 模型。示例中使用的模型是 dslim/bert-base-NER，但你可以使用任何\
  \ Elastic 兼容的 NER 模型。\n\n- 4. 要加载并启动模型，你可以按照以下步骤操作：\n\n```\n### Install the necessary\
  \ Python packages:\npip install eland elasticsearch transformers sentence_transformers\
