  \ 10.11：爬虫操作\n\n9. 您可以通过在 Dev Tools 中运行 GET search_packt_cdl_source/_search 查询来验证文档是否正在进入。\n\
  \n好消息是我们不必对这些文档进行任何转换或数据处理即可与 Embedchain 一起使用。相反，我们将专注于这些文档的 URL 字段，因为这是构建我们的可插拔\
  \ DCL 的关键。\n\n## Elevating data with Embedchain\n\n在本节中，我们深入探讨 Embedchain（https://github.com/embedchain/embedchain）的机制，Embedchain\
  \ 是一个开源数据平台，旨在利用 LLM 功能增强数据集。我们将探讨它如何无缝集成 Elasticsearch，使 ChatGPT 能够基于数据集增强的语义上下文进行理解和响应。本节提供了利用\
  \ Embedchain 在原始数据和有意义交互之间架起桥梁的如何以及为何。\n\n我们喜欢将 Embedchain 视为 LangChain、向量数据库和 LLM\
  \ 之上的另一个抽象层。它提供更高级别的控制，并专门用于从不同类型的数据源向 LLM 加载上下文。我能想到的最接近的例子是在电影《黑客帝国》中，Trinity\
  \ 请求一个直升机训练程序，Tank 将其加载到她的脑海中。Embedchain 基本上以同样的简易程度工作。以下是一个示例：\n\n```\nelastic_bot.add(\"\
  \ https://jobs.elastic.co/jobs/csm/san-francisco-ca/customer-architect/5112073?gh_jid=5112073#/\"\
  \ )\n```\n\n这将加载包含职位描述的页面到名为 elastic_bot 的 Embedchain 应用中，这样当用户提交有关此职位的提问时，elastic_bot\
  \ 应用将拥有上下文：\n\n```\nelastic_bot.query(\"Tell me about  the Customer Architect role\
  \ at Elastic\")\n```\n\n这是此示例的 Embedchain 机器人输出：\n\n```\nelastic_bot.query(\"Tell\
  \ me about the Customer Architect role at Elastic\")\n```\n\n'The Customer Architect\
  \ role at Elastic is a position within the Customer Success Group. Customer Architects\
  \ at Elastic are responsible for working with customers to understand their needs\
  \ and requirements, and then designing and implementing solutions using Elastic's\
  \ technology stack. They help customers optimize their use of Elastic's products\
  \ for search, observability, and security purposes. Customer Architects also provide\
  \ technical guidance and support to customers throughout the implementation process.'\n\
  \n图 10.12：Embedchain 输出\n\n就这么简单！那么，让我们将其置于我们的目标背景下。我们希望用户通过 ChatGPT 与我们的插件交互，该插件会响应提示，通过\
  \ Embedchain 加载正确的文档页面。当 Embedchain 应用添加内容时，它实际上将其存储在底层向量数据库中。它使用 OpenAI 的 Ada 嵌入模型从其抓取的数据块创建嵌入。所有的数据分块和水合处理均由\
  \ Embedchain 完成。\n\n在此示例中，我们将使用 Elasticsearch 作为向量数据库。以下代码块显示了当添加链接时 Embedchain\
  \ 索引的文档结构：\n\n```\n{\n    \"_index\": \"embedchain_store_1536\",\n    \"_id\": \"\
  635ef64b5a99725d3b2cdf1cca86d5570a70388aa4d8d328cb2a02dd74b232c8\",\n    \"_score\"\
  : 1,\n    \"_source\": {\n        \"text\": \"Aligning with customer business goals,\
  \ you'll also guide them through onboarding, ensure they adopt our solutions, and\
  \ aid in their growth. As a Customer Architect, you'll stand as the Go-to Technical\
  \ Counsel, collaborating closely with the customer and partnering with teams like\
  \ Field and Services. Your role ensures that Elastic's offerings consistently surpass\
  \ customer hopes. Leveraging your technical knowledge, business acumen, and commitment\
  \ to value, you'll enhance and elevate the customer journey.\",\n        \"metadata\"\
  : {\n            \"url\": \"https://jobs.elastic.co/jobs/csm/united-states/customer-architect/5112021?gh_jid=5112021#\"\
  ,\n            \"data_type\": \"web_page\",\n            \"hash\": \"832c08a036185237195ac37a6133db16\"\
  \n        },\n        \"embeddings\": [...] \n    }\n}\n```\n\n\n\n\n\n前面的代码展示了一个由\
  \ Embedchain 提取的文档块以及使用 OpenAI 的 embeddings 数组。因此，最终在我们的文档用例中，我们希望数据源的结构与在 Elastic\
  \ 中的结构保持一致。如果用户输入“告诉我 Elastic 的 Customer Architect 职位的职责是什么”，该问题会通过插件从 ChatGPT 传递给\
  \ Embedchain。插件首先查询 Elasticsearch 以从已抓取的内容中获取最合适的 URL，然后 Embedchain 会动态地将该 URL 添加到上下文中以使用\
  \ GPT 生成响应。\n\n在以 Elasticsearch 和嵌入技术奠定基础之后，我们现在将焦点转向对话的核心：ChatGPT。我们如何确保我们的强大搜索引擎能够与这位对话者无缝通信？让我们深入探讨集成过程。\n\
  \n## 集成 ChatGPT——创建实时对话者\n\n在本节中，我们将探讨将 ChatGPT 与我们丰富的 Elasticsearch 数据集融合的机制。通过桥接这些技术，我们旨在创建一个不仅具有反应性，而且还能深刻地以我们构建的动态上下文为依据的机器人。我们将逐步介绍集成步骤，确保\
  \ ChatGPT 能够流畅地访问并解释存储在 Elasticsearch 中的大量信息。\n\n## 处理 Elasticsearch 与 ChatGPT 之间的实时数据流\n\
  \n让我们先退一步，提醒自己期望的组件和流程：\n\n- 1. 用户仅与 ChatGPT 交互。\n- 2. 用户已激活插件。\n- 3. 当用户就 Elastic\
  \ 文档中的最新信息提问时，用户提示会传递给插件。\n- 4. 插件分析提示，然后查询包含已抓取文档的索引。\n- 5. Elasticsearch 返回一个或多个\
  \ URL。\n- 6. 这些 URL 由 Embedchain 添加到上下文中。\n- 7. Embedchain 生成响应。\n- 8. 插件将 Embedchain\
  \ 返回的响应打印到 ChatGPT 中供用户查看。\n\n到目前为止，我们已经有了包含文档的索引——现在，我们必须构建 ChatGPT 插件。请参考 OpenAI\
  \ 的文档了解插件框架的基础知识（https://platform.openai.com/docs/plugins/introduction）。我们将假设你已阅读文档并理解创建插件所需的基础知识。\n\
  \n## 插件代码\n\n插件必须符合 OpenAI 文档的要求才能在 ChatGPT 中通过验证并安装。我们将首先查看存储库结构，然后继续创建一些必要的文件以及实现代码以实现我们的目标。\n\
  \n## 存储库结构\n\n存储库结构很简单，如下图所示：\n\n![](img/21c3d4250a746422a7489bc2647611d8_217_0.png)\n\
  \n图 10.13：ChatGPT 插件存储库结构\n\n让我们分解结构：\n\n- - 主要服务代码在 app.py 中\n- - 插件的 logo（logo.png）将在\
  \ ChatGPT 插件商店中显示\n- - 插件清单存储在 .well-known 目录下的 ai-plugin.json 文件中\n- - OpenAPI\
  \ 描述符包含在 openapi.yaml 文件中\n\n请注意，我们在此使用 Dockerfile 作为部署插件的资源。插件部署平台可以根据你可用的资源而有所不同；我使用的是\
  \ Google Cloud Compute。你需要选择你喜欢的部署平台或云提供商。插件代码部署超出了本书的范围。现在，让我们看看公开我们 API 的代码。\n\
  \n## 服务代码\n\n服务代码由 ChatGPT 为验证插件和运行代码而期望的四个 REST API 端点组成：\n\n```\n...\n@app.get(\"\
  /search\")\n...\n\n@app.get(\"/logo.png\")\n```\n\n```\nasync def plugin_logo():\n\
  \    filename = 'logo.png'\n    return await quart.send_file(filename, mimetype='image/png')\n\
  \n@app.get(\"./.well-known/ai-plugin.json\")\nasync def plugin_manifest():\n   \
  \ host = request.headers['Host']\n    with open(\"./.well-known/ai-plugin.json\"\
  ) as f:\n        text = f.read()\n    text = text.replace(\"PLUGIN_HOSTNAME\", f\"\
  https://{host}\")\n    return quart.Response(text, mimetype=\"text/json\")\n\n@app.get(\"\
  /openapi.yaml\")\nasync def openapi_spec():\n    host = request.headers['Host']\n\
  \    with open(\"openapi.yaml\") as f:\n        text = f.read()\n    text = text.replace(\"\
  PLUGIN_HOSTNAME\", f\"https://{host}\")\n    return quart.Response(text, mimetype=\"\
  text/yaml\")\n...\n```\n\n第一个 /search API 是实现的核心。其余部分按出现顺序返回 logo、清单和 OpenAPI 定义。\n\
  \n/search API 是魔法的发生地。以下是实现的分解：\n\n```\nasync def search():\n    query = request.args.get(\"\
  query\")\n    url = ESSearch(query)\n    return quart.Response(url)\n```\n\nESSearch\
  \ 函数是最重要的一部分，因为它在 Elasticsearch 中搜索最相关的文档并将它们的链接传递给 Embedchain 以构建上下文。请注意，我们在此使用简单的\
  \ BM25 Elasticsearch 查询，因为我们使用 Embedchain 为我们抽象上下文构建过程。这意味着 Embedchain 会根据我们提供的链接生成嵌入并返回生成的答案：\n\
  \n```\ndef ESSearch(query_text):\n    cloud_url = os.environ['cloud_url']\n    cid\
  \ = os.environ['cloud_id']\n    cp = os.environ['cloud_pass']\n    cu = os.environ['cloud_user']\n\
  \    es = es_connect(cid, cu, cp)\n    # Elasticsearch query (BM25)\n    query =\
  \ {\n```\n\n```\n\"bool\": {\n    \"filter\": [\n        {\n            \"prefix\"\
  : {\n                \"url\": \"https://www.elastic.co/guide\"\n            }\n\
  \        }\n    ],\n    \"must\": [{\n        \"match\": {\n            \"title\"\
  : {\n                \"query\": query_text,\n                \"boost\": 1\n    \
  \        }\n        }\n    }]\n}\n\nfields = [\"title\", \"body_content\", \"url\"\
  ]\nindex = 'search-elastic-doc'\nresp = es.search(index=index,\n               \
  \ query=query,\n                fields=fields,\n                size=10,\n     \
  \           source=False)\n\nbody = resp['hits']['hits'][0]['fields']['body_content'][0]\n\
  url = resp['hits']['hits'][0]['fields']['url'][0]\nelastic_bot = App()\n### Assuming\
  \ 'resp' is the response object you've mentioned\nfor hit in resp['hits']['hits']:\n\
  \    for url in hit['fields']['url']:\n        print(url)\n        #es_app.add(url)\n\
  \        elastic_bot.add(url)\n\nreturn elastic_bot.query(\"What can you tell me\
  \ about \" + query_text)\n```\n\n请注意，我们通过在用户输入前加上“what can you tell me about”来保持提示的宽泛性。\n\
  \n测试代码应会在 URL http://0.0.0:5001 上公开一个端点。打开你选择的测试工具并传递类似以下的查询：\n\n```\nhttp://0.0.0:5001/search?query=detections\n\
  ```\n\n此查询要求机器人构建关于 Elastic Security detections 的上下文。如果你在控制台中打印 URL，你会看到 Embedchain\
  \ 正在向上下文中添加内容：\n\n```\nhttps://www.elastic.co/guide/en/siem/guide/current/detection-engine-overview.html\n\
  Successfully saved https://www.elastic.co/guide/en/siem/guide/current/detection-engine-overview.html\
  \ (DataType.WEB_PAGE). New chunks count: 15\nhttps://www.elastic.co/guide/en/siem/guide/current/rule-api-overview.html\n\
  Successfully saved https://www.elastic.co/guide/en/siem/guide/current/rule-api-overview.html\
  \ (DataType.WEB_PAGE). New chunks count: 5\nhttps://www.elastic.co/guide/en/security/current/detection-engine-overview.html\n\
  Successfully saved https://www.elastic.co/guide/en/security/current/detection-engine-overview.html\
  \ (DataType.WEB_PAGE). New chunks count: 17\nhttps://www.elastic.co/guide/en/security/8.9/detection-engine-overview.html\n\
  Successfully saved https://www.elastic.co/guide/en/security/8.9/detection-engine-overview.html\
  \ (DataType.WEB_PAGE). New chunks count: 17\nhttps://www.elastic.co/guide/en/security/current/rule-api-overview.html\n\
  Successfully saved https://www.elastic.co/guide/en/security/current/rule-api-overview.html\
  \ (DataType.WEB_PAGE). New chunks count: 5\nhttps://www.elastic.co/guide/en/security/current/detections-permissions-section.html\n\
  Successfully saved https://www.elastic.co/guide/en/security/current/detections-permissions-section.html\
  \ (DataType.WEB_PAGE). New chunks count: 18\n```\n\n再次说明，为本示例的目的，我们保持 Elasticsearch\
  \ 查询相当宽泛，以避免过度缩小结果范围，但 SoC 在这里确实会受到影响，因为准确性可能会下降。因此，根据你的需求，你可能需要微调查询以产生更少或更多结果。\n\
  \nREST 调用应返回有关 Elastic detections 的内容：\n\n```\nDetections are alerts that are created\
  \ based on rules in the Elastic Security Solution. These alerts are generated automatically\
  \ when events and external alerts are sent to Elastic Security. They are displayed\
  \ on the Detections page, and provide information about potential security threats\
  \ or suspicious activities. For more detailed information about the differences\
  \ between events, external alerts, and detection alerts, you can refer to the Elastic\
  \ Glossary.\n```\n\n\n\n\n\nAt this stage, we have validated that the endpoint is\
  \ functional. We now need to describe our plugin for OpenAI.\n\n## Manifest\n\n\
  The manifest describes what your plugin is going to achieve and gives a direction\
  \ to the model that tells when to trigger the plugin depending on the prompt that\
  \ is submitted by the user. Here is the JSON content:\n\n```\n{\n\"schema_version\"\
  : \"v1\",\n\"name_for_human\": \"PacktGPT_Plugin\",\n\"name_for_model\": \"PacktGPT_Plugin\"\
  ,\n\"description_for_human\": \"An Assistant, you know, for searching in the Elastic\
  \ documentation\",\n\"description_for_model\": \"Get most recent elastic documentation\
  \ post 2021 release, anything after release 7.15\",\n\"auth\": {\n\"type\": \"none\"\
  \n},\n\"api\": {\n\"type\": \"openapi\",\n\"url\": \"PLUGIN_HOSTNAME/openapi.yaml\"\
  ,\n\"is_user_authenticated\": false\n},\n\"logo_url\": \"PLUGIN_HOSTNAME/logo.png\"\
  ,\n\"contact_email\": \"info@info.co\",\n\"legal_info_url\": \"http://www.example.com/legal\"\
  \n}\n```\n\nAll the preceding fields help describe in detail the plugin we are publishing\
  \ in ChatGPT, such as the name of the plugin or the URL to get the description of\
  \ the API, or even the email to contact the developer. The most notable one is description_for_model,\
  \ as this is the one the ChatGPT framework uses to guide the model in terms of what\
  \ is expected from it.\n\nThe plugin description helps ChatGPT to understand what\
  \ the plugin is providing and to set the behavior of the model. We now have to describe\
  \ what the exposed APIs are in the plugin.\n\n## OpenAPI definition\n\nThe OpenAPI\
  \ definition is a standard representation of the API exposed by the plugin, including\
  \ the paths, HTTP verb, and relative parameters, as you can see in the following\
  \ snippet:\n\n```\nopenapi: 3.0.1\ninfo:\ntitle: PacktGPT_Plugin\n```\n\n```\ndescription:\
  \ Retrieve information from the most recent Elastic documentation\nversion: 'v1'\n\
  servers:\n- url: PLUGIN_HOSTNAME\npaths:\n/search:\nget:\noperationId: search\n\
  summary: retrieves the document matching the query\nparameters:\n- in: query\nname:\
  \ query\nschema:\ntype: string\ndescription: use to filter relevant part of the\
  \ elasticsearch documentations\nresponses:\n\"200\":\ndescription: OK\n```\n\nHaving\
  \ established a seamless integration between ChatGPT and Elasticsearch, our next\
  \ step is to look at how this solution is rolled out in real-world scenarios. As\
  \ we transition to the topics of deployment and extensions, we'll discuss strategies\
  \ for deploying our dynamic conversationalist and also brainstorm ways to further\
  \ enhance its capabilities.\n\n## Deployment\n\nAs we near the completion of publishing\
  \ our plugin in ChatGPT, our next move involves setting our solution live. This\
  \ section dives into deploying our plugin in ChatGPT. This is a very simple process\
  \ on the ChatGPT side, but you have to deploy your code on a public endpoint so\
  \ that ChatGPT can call the different endpoints exposed by your code not only to\
  \ run the code but also to verify whether the plugin is compliant.\n\nYou can follow\
  \ this guide I have written on how to deploy the plugin on GCP: https://www.elastic.co/blog/chatgpt-elasticsearch-plugin-elastic-data.\n\
  \nThere are plenty of other options, including using Replit (https://replit.com/)—a\
  \ browser-based IDE that can run the code and expose public API—or deploying the\
  \ code in a cloud provider of your choice (Azure, GCP, AWS). I leave it to you to\
  \ choose what you are comfortable with.\n\nFor what concerns ChatGPT, just go to\
  \ https://chat.openai.com/, click on the Plugin dropdown, and scroll down to Plugin\
  \ store:\n\nFigure 10.14: ChatGPT Plugin dropdown\n\nClick on Plugin store, as shown\
  \ in the previous screenshot, and in the window that appears, locate and click on\
  \ Develop your own plugin in the bottom-right of the screen:\n\nFigure 10.15: ChatGPT\
  \ Plugin store\n\nIn the window that appears, copy the URL exposed by your plugin,\
  \ paste it into the text field, and click on Find manifest file:\n\n### Enter your\
  \ website domain\n\nVisit our documentation to learn how to build a plugin.\n\n\
  > If your plugin has been approved to be in the ChatGPT plugin store, and you have\
  \ made changes to your plugin's manifest, your plugin will be removed from the store,\
  \ and you will need to resubmit it for review.\n\nDomain\n\nCancel\n\nFind manifest\
  \ file\n\nFigure 10.16: ChatGPT Plugin manifest finder\n\nYour plugin should be\
  \ validated, as shown in the following screenshot. Click Next to continue the installation\
  \ steps:\n\n### Found plugin\n\n+ Validated manifest\n+ Validated OpenAPI spec\n\
  \nPacktGPT_Plugin\n\nAn Assistant, you know, for searching in the Elastic documentation\n\
  \nNext\n\nFigure 10.17: ChatGPT Plugin retrieval confirmation\n\nGo through the\
  \ plugin installation until the plugin is installed and appears in the list. Make\
  \ sure the plugin is checked to enable it:\n\n![](img/21c3d4250a746422a7489bc2647611d8_225_0.png)\n\
  \nFigure 10.18: ChatGPT plugin installed and available in the list\n\nYou can now\
  \ enjoy the power of a dynamic layer in ChatGPT through your new plugin, allowing\
  \ you to simply prompt ChatGPT for the most recent Elastic documentation of your\
  \ choice. It should trigger your plugin and give you an answer in return. An example\
  \ is shown in the following screenshot:\n\nPlugins • Enabled plugins:\n\n![](img/21c3d4250a746422a7489bc2647611d8_225_1.png)\n\
  \nFigure 10.19: PacktGPT plugin test\n\nYou now have control over the context ChatGPT\
  \ is learning from thanks to the combination of Elastic and Embedchain!\n\n## Summary\n\
  \nAs we close this chapter on integrating dynamic context into ChatGPT, it’s fitting\
  \ to reflect on the broader themes we’ve tackled throughout this book. We embarked\
  \ on a journey that weaved through the intricacies of large language models, the\
  \ immense potential of Elasticsearch, and the power of contextual information to\
  \ enhance user experiences.\n\nOur venture into creating a ChatGPT plugin to dynamically\
  \ pull the latest Elastic documentation represents the pinnacle of the union between\
  \ static knowledge and live data. The ability to access, understand, and respond\
  \ using the most recent information changes the essence of the dynamics of user-chatbot\
  \ interactions, making them more timely, relevant, and impactful.\n\nBut this final\
  \ chapter is merely one application in a vast landscape of possibilities. With tools\
  \ such as Embedchain, the doors have been opened wide for developers and enthusiasts\
  \ alike to innovate, experiment, and push the boundaries of what conversational\
  \ AI can achieve when integrated with real-time data sources.\n\nWhile we’ve covered\
  \ vast ground, remember that technology is ever-evolving. The landscape we see today\
  \ will be transformed tomorrow. The tools, techniques, and best practices will continue\
  \ to evolve. Yet, integrating a depth of knowledge with the agility of real-time\
  \ adaptability will always be at the heart of next-generation conversational AI.\n\
