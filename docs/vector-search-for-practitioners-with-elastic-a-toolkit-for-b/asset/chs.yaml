  \ ELSER 是多么容易，并且开箱即用即可看到显著的结果。第一部分将介绍所需的硬件。然后，我们将查看准备索引；最后，我们将执行几个查询来说明 ELSER 的强大功能。\n\
  \n### 硬件考虑\n\nELSER 文档（https://www.elastic.co/guide/en/machine-learning/current/ml-nlp-elser.html#elser-hw-benchmarks）介绍了代表性数据中的基准测试，其中突出了推理、索引、查询和延迟等\
  \ KPI。\n\n你会看到，硬件配置对 ELSER 的性能有显著影响。以下是为你的基础设施进行容量规划时需要考虑的一些关键要点：\n\n- **CPU 和内存**：ML\
  \ 节点（在 CPU 和内存方面）越强大，性能越好。例如，内存为 16 GB 且 vCPU 为 8 的 ML 节点表现优于内存为 4 GB 且 vCPU 为 2\
  \ 的节点。这在推理时间和索引速度方面都很明显。\n- **线程分配**：线程的分配方式也很重要。例如，在 16 GB、8 vCPU 的 ML 节点上进行单次分配并使用多个线程（本例中为\
  \ 8 个），与多次分配每个单线程相比，可显著改善推理时间并降低查询延迟。\n- **数据集特征**：数据集的特征，例如文档和查询的长度，会影响性能。更长的文档和查询可能会增加推理时间和查询延迟。\n\
  \n总之，为了获得最佳的 ELSER 性能，结果建议使用强大的 ML 节点（高内存和高 CPU）并将多个线程分配给单个分配。这将增加单个推理由多个线程处理的速率。然而，这些是通用指南，因此建议始终针对你的数据集和可用硬件进行测试。\n\
