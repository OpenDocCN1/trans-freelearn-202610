- "## 使用 Elastic 进行检索增强生成\n\n在本章中，我们将继续在 Elasticsearch 世界中的旅程，并深入探讨 Elastic 提供的最先进和令人兴奋的功能之一：**检索增强生成\
  \ (RAG)** 搜索体验。如果你跟随我们之前的章节，你将熟悉 **Elastic Learned Sparse EncodeR (ELSER)** 预训练模型以及向量搜索的概念，它为搜索结果提供了语义理解的便利。你还了解了\
  \ **互惠排序融合 (RRF)** 在结合词汇搜索和向量搜索优势方面的强大功能。\n\n在本章中，我们将更进一步，将这些概念集成到一个全面的管道中，最终实现通过\
  \ RAG 扩展 **大型语言模型 (LLM)**。这里的目标是结合词汇、向量和上下文搜索的优势，提供最相关的搜索结果，从而增强用户体验。\n\n我们将介绍以下主题：\n\
  \n- 构成 RAG 的基本概念\n- 如何通过 RRF 将 ELSER 与 BM25 结合\n- 通过 RAG 扩展我们的 LLM 知识\n- 探索一个真实案例研究\
  \ – CookBot，我们的烹饪聊天机器人助手\n\n到本章结束时，你将具备基于 Elasticsearch 构建 RAG 应用的能力。\n\n## 为 RAG\
  \ 增强搜索做准备，使用 ELSER 和 RRF\n\n在我们继续讨论语义搜索及其各个方面时，我们现在将注意力转向 RAG 增强搜索与 ELSER 和 RRF\
  \ 的集成。\n\n在深入探讨 RAG、ELSER 和 RRF 集成的细节之前，了解将我们带到这里的搜索方法论的历程和演变至关重要。\n\n\n\n\n\n旅程始于词法搜索。这种简单却强大的方法论涉及匹配精确术语，已被广泛采用并能够提供可靠的结果。它为即将发生的事情奠定了基础。\n\
  \n下一步的飞跃来自于向量搜索的引入，为我们对搜索查询的理解增添了新的维度。这种技术使系统能够理解查询背后的“含义”或语义内容，远远超出了基础词法搜索的能力。\n\
  \nElastic RRF 进一步提升了结果的相关性。这种技术巧妙地融合了词法搜索和向量搜索的优势，将两者之长结合起来，进一步优化了搜索输出的质量。\n\n最后，最近最令人兴奋的发展是\
  \ LLM 集成到这一框架中。以 RRF 的输出为基础，这些模型实现了 RAG。这种巧妙的技术利用了 LLM 的上下文感知能力，使其能够基于搜索结果生成精确、相关的内容。\n\
  \n图 9.1 总结了上述信息：\n\n![](img/21c3d4250a746422a7489bc2647611d8_186_0.png)\n\n图 9.1：RAG\
  \ 之旅\n\n这一旅程中的每一步都代表了搜索技术的重要演进。这种渐进式增强持续改善了 Elastic 提供日益智能、以用户为中心的搜索体验的能力。\n\n现在，在了解了这一演进背景之后，让我们深入探讨\
  \ RAG、ELSER 和 RRF 如何协同工作以进一步提升我们的搜索能力。\n\n## 使用 ELSER 进行语义搜索\n\n正如我们之前讨论的，语义搜索改变了我们理解和响应用户查询的方式。ELSER\
  \ 是这一领域中的有价值工具，提供了一种独特的方式来表示和理解用户查询的内容和上下文，使其更加深入。\n\n我们之前研究过 ELSER 如何将大量内容纳入高维\
  \ token 空间，创建某种语义地图，从而产生更具上下文准确性的结果。然而，当我们引入 RAG 和 RRF 等元素时，ELSER 如何发挥作用呢？让我们来了解一下。\n\
  \n## RAG 的关键注意事项回顾\n\n要在任何搜索系统中成功实现 RAG，我们必须考虑三个关键组件：文档存储、检索器和生成器。这些元素相互作用，形成有效\
  \ RAG 增强搜索系统的支柱。\n\n## 文档存储\n\nElasticsearch 在我们的搜索系统中充当文档存储，提供所有可搜索数据驻留的平台。这些数据必须全面且多样化，以适应查询可能收到的广泛信息范围。Elasticsearch\
  \ 以其快速高效地处理多样化数据类型而闻名，使其成为这一角色的理想选择。\n\nElasticsearch 不仅充当被动存储库，还在提供成功的搜索体验中发挥积极作用。凭借其强大的全文搜索功能、高效的索引以及处理大量数据的可扩展性，Elasticsearch\
  \ 构成了部署成功 RAG 增强搜索系统的坚实基础。\n\n## 检索器\n\n在此上下文中，检索器在用户查询和 Elasticsearch 之间运行，我们的文档存储。在这里，预训练模型\
  \ ELSER 发挥了关键作用。\n\nELSER 通过扩展 Elasticsearch 中索引的文档语料库的 token 来发挥作用，增强其根据用户查询理解和定位语义相关信息的能力。它与\
  \ RRF 协同工作，RRF 是一种融合词法搜索和基于 ELSER 的搜索的技术。\n\nRRF 通过创建子查询来实现这一点，有助于将词法搜索精确的术语匹配与\
  \ ELSER 提供的丰富语义理解相结合。这两种技术的整合使得检索过程更加全面和有效，显著提升了我们 RAG 系统中搜索结果的相关性和精确度。\n\n## 生成器\n\
  \n在由 ELSER 和 RRF 驱动的检索器识别出 Elasticsearch 中最相关的文档后，就轮到生成器大放异彩了。在我们的设置中，生成器由 OpenAI\
  \ 的 GPT-4 提供支持，这是截至撰写时最先进的语言模型之一。\n\nGPT-4 使用检索器的输出生成详细、连贯且上下文相关的文本片段。利用这些先进 LLM\
  \ 的能力，生成器可以生成直接回答用户查询或提供与其相关的有价值信息的文本。\n\n随着 GPT-4 的引入，文本生成过程变得更加动态和准确，将语义搜索体验提升到全新水平。通过将\
  \ GPT-4 纳入我们的 RAG 系统，我们确保生成的响应不仅在上下文上与用户查询保持一致，而且保持高标准的一致性和相关性。\n\n请记住，虽然检索器使用 Elasticsearch\
  \ 识别相关的“信息块”，但由 GPT-4 支持的生成器会将这些信息块综合成全面且用户友好的响应。这些组件共同构成了一个强大、智能且有效的 RAG 增强搜索系统，如下图所示：\n\
  \n![](img/21c3d4250a746422a7489bc2647611d8_188_0.png)\n\n图 9.2：RAG 搜索系统\n\n正是这些组件之间的交互和和谐，才造就了既相关又上下文丰富的搜索体验。\n\
  \n现在我们已经重申了 RAG 的关键注意事项，我们可以继续探讨 ELSER 如何在这一框架中发挥重要作用。\n\n## 将 ELSER 与 RRF 集成\n\n\
  在 Elastic 8.9 更新中，引入了子搜索功能，为搜索操作开启了新的可能性。该功能对于将 ELSER 与 RRF 集成至关重要。\n\n子搜索使多个不同的搜索查询能够在单个搜索请求中执行。该功能显著提高了组合不同搜索方法的能力。\n\
  \n将 ELSER 与 RRF 集成时，过程涉及两个子搜索和一个融合步骤。\n\n### BM25 子搜索\n\n最初执行 BM25 子搜索。此子查询专注于搜索用户查询中的精确或密切相关术语。\n\
  \n### ELSER 子搜索\n\n同时执行 ELSER 子搜索。此子搜索捕获词法搜索中可能遗漏的上下文细微差别。\n\n### RRF 融合\n\n随后，使用\
  \ RRF 融合 BM25 和 ELSER 子搜索的结果。此方法创建了一个统一的列表，优先考虑被两个子搜索都识别为相关的文档。\n\n这种整合方法使 Elastic\
  \ 能够提供更先进的搜索体验，不仅识别匹配搜索词的文档，还能理解用户意图和查询上下文。\n\n通过子搜索将 ELSER 集成到 RRF 中，Elastic 的搜索能力已为下一步发展做好准备：RAG\
  \ 增强搜索。在此场景中，由 ELSER 和 RRF 共同努力产生的排序文档列表被用作 GPT-4 等复杂语言模型的基础上下文，提供更准确、更直观的搜索结果。\n\
  \n您也可以在以下博客文章中找到有关实际相关性性能的更多信息：\n\n```\nhttps://www.elastic.co/blog/improving-information-retrieval-elastic-stack-hybrid\n\
  ```\n\n## 语言模型和 RAG\n\n截至撰写时，已有多种 LLM 选项可用，无论是付费软件，如 OpenAI，还是开源软件，如 Meta 最新发布的\
  \ Llama 2 (https://ai.meta.com/llama/) 和 Amazon Bedrock (https://aws.amazon.com/bedrock/)，均提供免费和付费选项。为本章目的，我们将使用\
  \ OpenAI 的 GPT-4。\n\n## 预训练 LLM\n\n预训练 LLM，如 OpenAI 的 GPT-4，在自然语言处理领域具有变革性。这些模型在庞大的文本语料库上训练，通过这一过程，它们学习语言的复杂模式，从基本语法到复杂的语义关系。因此，它们能够针对给定提示生成高质量、上下文相关的文本，使其成为改善搜索结果的优秀工具。\n\
  \n## RAG 如何扩展 LLM\n\nLLM 的强大功能在 RAG 框架中通过在生成阶段使用它们来发挥作用。一旦检索器（在我们的例子中是 ELSER 和 RRF\
  \ 的组合）选择了相关文档，这些文档就会作为上下文提供给 LLM。然后 LLM 会根据用户查询生成响应，该响应不仅与查询相关，而且基于检索到的文档中的信息。\n\
  \n## 向 LLM 提供语义索引数据\n\n为了最大化 LLM 在 RAG 上下文中的有效性，至关重要的是向其提供语义索引数据。这涉及使用 ELSER 丰富索引文档并添加语义\
  \ token，以增强文档的上下文理解。\n\n随着 RRF 和 ELSER 的纳入，Elasticsearch 可以基于词法搜索和语义搜索检索最相关的文档。当这些文档提供给\
  \ LLM 时，它会同时考虑用户查询和检索到的文档，生成与搜索意图准确一致的响应。RRF、ELSER 和 LLM 之间的这种交互产生了全面、上下文感知且更精确的搜索体验，这是\
  \ RAG 增强搜索的核心。\n\n## 深入案例研究——实现 RAG 增强的 CookBot\n\n人人都知道这个古老的烹饪难题：“我手头的食材能做什么菜？”\
  \ 许多人在面对各种食材却缺乏灵感或知识来烹饪一道菜时需要帮助。这个日常问题正是我们想法的火花——CookBot。\n\n\n\n\n\nCookBot 不仅仅是普通的\
  \ AI。它被构想为一个先进的烹饪助手，不仅可以根据现有食材推荐食谱，还能理解用户查询的细微差别，适应个人的饮食偏好和限制，并生成富有洞察力的烹饪建议。\n\n\
  我们的目标是将 RAG、ELSER 和 RRF 技术融入 CookBot。这些技术旨在增强查询的语义理解，优化信息检索，并生成相关、个性化的响应。通过利用这些先进工具的能力，我们希望\
  \ CookBot 能够为每个用户的独特需求提供无缝、上下文感知的烹饪帮助。\n\n![](img/21c3d4250a746422a7489bc2647611d8_191_0.png)\n\
  \n图 9.3：由 Elastic 驱动的 CookBot\n\n## 数据集概览 – Allrecipes.com 数据集简介\n\nAllrecipes.com\
  \ 数据集以原始 CSV 格式存在，是一个充满多样化和详细烹饪信息的宝库。因此，它是训练我们的 CookBot 的完美基础。它收录了大量食谱，每条食谱都以一个独特的条目呈现，包含丰富的信息。\n\
  \n你可以在这里找到并下载该数据集，后续章节会用到：\n\nhttps://www.kaggle.com/datasets/nguyentuongquang/all-recipes\n\
  \n为了说明该数据集的丰富性，让我们来看一个条目：\n\n```\n\"group\",\"name\",\"rating\",\"n_rater\",\"n_reviewer\"\
  ,\"summary\",\"process\",\"ingredient\"\n\"breakfast-and-brunch.eggs.breakfast-burritos\"\
  ,\"Ham and Cheese Breakfast Tortillas\",0,0,44,\"This is great for a special brunch\
  \ or even a quick and easy dinner. Other breakfast meats can be used, but the deli\
  \ ham is the easiest since it is already fully cooked.\",\"prep: 30 mins,total:\
  \ 30 mins,Servings: 4,Yield: 4 servings\",\"12 eggs + <U+2153> cup milk + 3 slices\
  \ cooked ham, diced + 2 green onions, minced + salt and pepper to taste + 4 ounces\
  \ Cheddar cheese, shredded + 4 (10 inch) flour tortillas + cup salsa\"\n```\n\n\
  数据集中每个条目代表一个独特的食谱，并包含各个字段：\n\n- `group`：这是食谱的分类。它提供了关于菜品类型和性质的总体概念。\n- `name`：这是食谱的标题或名称。该字段直接告诉我们菜品是什么。\n\
  - `rating` 和 `n_rater`：这些字段表示菜品在用户中的受欢迎程度和认可度。\n- `n_reviewer`：这是对该食谱进行过评论的用户数量。\n\
  - `summary`：这是菜品的简要概述或描述，通常提供有关其口味、用途或制作方法的宝贵背景信息。\n- `process`：该字段概述了准备时间、总烹饪时间、份量和产量等关键细节。\n\
  - `ingredient`：这是制作食谱所需的所有配料的全面清单，包括其用量。\n\n每个字段提供的详细信息为我们提供了广阔而多样的信息空间，有助于检索器在数据中导航，并确保生成器能够准确响应各种烹饪查询。随着我们继续推进，我们将讨论如何使用\
  \ Elasticsearch 对该数据集进行索引，ELSER 和 RRF 在有效检索数据中的作用，以及 GPT-4 模型如何基于检索到的数据生成相关、个性化的响应。\n\
  \n## 为 RAG 增强搜索准备数据\n\n要将 Allrecipes.com 数据转换为可搜索的数据库，我们首先需要解析 CSV 文件，随后创建一个 Elasticsearch\
  \ 索引来存储和查询数据。让我们逐步了解作为 Python 代码一部分实现的过程。\n\n### 连接到 Elasticsearch\n\n首先，我们需要与 Elasticsearch\
  \ 实例建立连接。此连接由 Elasticsearch Python 模块中的 Elasticsearch 对象处理：\n\n```\nfrom elasticsearch\
  \ import Elasticsearch\nes = Elasticsearch()\n```\n\n在此情况下，我们假设 Elasticsearch 实例在本地以默认设置运行。如果不是这样，我们需要向\
  \ Elasticsearch 类提供适当的 host 和 port 信息。\n\n### 定义索引\n\n下一步是定义一个用于存储食谱的索引。Elasticsearch\
  \ 中的索引类似于传统数据库系统中的数据库。在此，我们将索引命名为 recipes：\n\n```\nindex_name = 'recipes'\n```\n\
  \n### 创建映射\n\n现在，我们需要为索引创建映射。映射类似于 SQL 数据库中的模式，定义了将存储在索引中的文档中每个字段的类型。我们将映射定义为 Python\
  \ 字典：\n\n```\nmapping = {\n    \"mappings\": {\n        \"properties\": {\n    \
  \        \"group\": { \"type\": \"text\" },\n            \"name\": { \"type\": \"\
  text\" },\n            \"rating\": { \"type\": \"text\" },\n            \"n_rater\"\
  : { \"type\": \"text\" },\n            \"n_reviewer\": { \"type\": \"text\" },\n\
  \            \"summary\": {\n                \"type\": \"text\",\n             \
  \   \"analyzer\": \"english\"\n            },\n            \"process\": { \"type\"\
  : \"text\" },\n            \"ingredient\": {\n                \"type\": \"text\"\
  ,\n            },\n            \"ml.tokens\": {\n                \"type\": \"rank_features\"\
  \n            }\n        }\n    }\n}\n```\n\n这里，所有字段都定义为 text，这意味着它们是全文可搜索的。我们还指定\
  \ summary 字段应使用 English 分析器进行分析，这将有助于优化英语文本的搜索，考虑到词干提取和停用词等因素。最后，我们创建 ELSER 用于创建\
  \ token 集合的字段，该集合是基于传递给 ELSER 的术语进行扩展的结果。\n\n### 创建索引\n\n定义映射后，我们可以使用以下命令在 Elasticsearch\
  \ 中创建索引：\n\n```\nes.indices.create(index=index_name, body=mapping)\n```\n\n这会向 Elasticsearch\
  \ 发送请求，以指定名称和映射创建索引。\n\n### 读取 CSV 文件\n\n索引准备就绪后，我们现在可以从 CSV 文件读取数据集。我们将使用 pandas，一个强大的\
  \ Python 数据处理库，来完成此操作：\n\n```\nimport pandas as pd\nwith open('recipe_dataset.csv',\
  \ 'r', encoding='utf-8',\nerrors='ignore') as file:\n    df = pd.read_csv(file)\n\
  ```\n\n此代码打开 CSV 文件并将其读入 pandas dataframe，这是一个完美的二维表格数据结构，用于操作结构化数据。\n\n### 转换为字典\n\
  \n为了将数据编入 Elasticsearch 索引，我们需要将 dataframe 转换为字典列表，其中每个字典对应 dataframe 中的一行（即文档或食谱）：\n\
  \n```\nrecipes = df.to_dict('records')\nprint(f\"Number of documents: {len(recipes)}\"\
  )\n```\n\n此时，我们的数据集已准备好在 Elasticsearch 中进行索引。然而，考虑到数据集的大小，建议使用批量索引功能以实现高效的数据摄取。这将在下一节中介绍。\n\
  \n## 批量索引数据\n\n让我们深入了解在 Elasticsearch 中批量索引数据集的逐步过程。\n\n### 定义预处理管道\n\n在进行批量索引之前，我们需要设置一个管道来预处理文档。在此，我们将使用\
  \ elser-v1-recipes 管道，该管道利用 ELSER 模型进行语义索引。管道定义如下：\n\n```\n[\n  {\n    \"inference\"\
  : {\n      \"model_id\": \".elser_model_1\",\n```\n\n```\n\"target_field\": \"ml\"\
  ,\n\"field_map\": {\n  \"ingredient\": \"text_field\"\n},\n\"inference_config\"\
  : {\n  \"text_expansion\": {\n    \"results_field\": \"tokens\"\n  }\n}\n}\n]\n\
  ```\n\n该管道包含一个推理处理器，使用 ELSER 预训练模型执行语义索引。它将食谱数据中的 ingredient 字段映射到 ELSER 模型的 text_field\
  \ 对象。输出（ELSER 模型的扩展 token）存储在文档的 ml 字段下的 tokens 字段中。\n\n### 创建批量索引序列\n\n鉴于 Allrecipes.com\
  \ 数据集的大小，逐个索引每个文档是不切实际的。相反，我们可以利用 Elasticsearch 的 bulk API，它允许我们在一个请求中索引多个文档。首先，我们需要生成一个字典列表，其中每个字典对应一个批量索引操作：\n\
  \n```\nbulk_index_body = []\nfor index, recipe in enumerate(recipes):\n    document\
  \ = {\n        \"_index\": \"recipes\",\n        \"pipeline\": \"elser-v1-recipes\"\
  ,\n        \"_source\": recipe\n    }\n    bulk_index_body.append(document)\n```\n\
  \n在此循环中，我们遍历 recipes 列表中的每个食谱（一个字典），然后构建一个包含批量索引操作所需信息的新字典。此字典指定文档将存储的索引名称（recipes）、用于处理文档的\
  \ ingest 管道（elser-v1-recipes）以及文档源本身（recipe）。\n\n\n\n\n#### 执行批量索引操作\n\n在准备好 `bulk_index_body`\
  \ 数组后，我们现在可以执行批量索引操作：\n\n```\ntry:\n    response = helpers.bulk(es, bulk_index_body,\
  \ chunk_size=500,\n    request_timeout=60*3)\n    print (\"\\nRESPONSE:\", response)\n\
  except BulkIndexError as e:\n    for error in e.errors:\n        print(f\"Document\
  \ ID: {error['index']['_id']}\")\n        print(f\"Error Type: {error['index']['error']['type']}\"\
  )\n        print(f\"Error Reason: {error['index']['error']['reason']}\")\n```\n\n\
  我们使用 Elasticsearch 库中的 `helpers.bulk()` 函数，将我们的 Elasticsearch 连接（`es`）和我们刚刚创建的 `bulk_index_body`\
  \ 数组传入，并设置 `chunk_size` 值为 500（表示我们希望每个请求发送 500 个文档）以及 `request_timeout` 值为 180\
  \ 秒，这意味着我们允许每个请求最多耗时 3 分钟才超时，因为在使用 ELSER 的情况下，索引过程可能需要较长时间。\n\n`helpers.bulk()`\
  \ 函数将返回一个响应，指示尝试的操作数量和错误数量（如果有的话）。\n\n如果在批量索引操作过程中发生任何错误，这些错误将作为 `BulkIndexError`\
  \ 抛出。我们可以捕获该异常，并遍历其 `errors` 属性以获取每个单独错误的信息，包括导致错误的文档 ID、错误类型及其原因。\n\n在这个过程的结束时，你将成功地在\
  \ Elasticsearch 中索引了整个 Allrecipes.com 数据集，使其准备好被你的 RAG 增强版 CookBot 检索和处理。\n\n##\
  \ 构建检索器——带有 ELSER 的 RRF\n\n在我们的食谱检索任务背景下，我们的目标是根据用户查询最大化返回食谱的相关性。我们将利用经典全文搜索（通过\
  \ BM25）、语义搜索（使用 ELSER）以及一种强大的排名融合方法（RRF）的组合。这种组合使我们能够处理更复杂的查询，并返回与用户意图高度契合的结果。\n\
  \n让我们考虑以下查询：\n\n```\nGET recipes/_search\n{\n  \"_source\": { \"includes\": [ \"\
  name\", \"ingredient\" ] },\n  \"sub_searches\": [\n    {\n      \"query\": {\n\
  \        \"bool\": {\n```\n\n```\n\"must\": { \"match\": { \"ingredient\": \"carrot\
  \ beef\" } },\n\"must_not\": { \"match\": { \"ingredient\": \"onion\" } }\n},\n\
  { \"query\": { \"text_expansion\": { \"ml.tokens\": { \"model_id\": \".elser_model_1\"\
  , \"model_text\": \"I want a recipe from the US west coast with beef\" } } } },\n\
  \"rank\": { \"rrf\": { \"window_size\": 50, \"rank_constant\": 20 } }\n```\n\n此查询包含两种类型的搜索。第一种使用经典的\
  \ Elasticsearch 布尔搜索，以找到同时包含胡萝卜和牛肉作为成分的食谱，并排除含有洋葱的食谱。这种传统方法确保了满足用户最基础的约束条件。\n\n\
  第二种 `sub_search` 使用 ELSER 对查询 \"I want a recipe from the US west coast with beef\"\
  （我想要一个来自美国西海岸且含有牛肉的食谱）进行语义扩展。ELSER 基于其对语言的理解来解释此请求，使系统能够匹配那些可能不包含确切短语但在上下文相关的文档。这使得系统能够考虑用户更细致的偏好。\n\
  \n然后，该查询采用 RRF 来结合两个 `sub_search` 的结果。`window_size` 参数设置为 50，意味着考虑每个子搜索的前 50 个结果。`rank_constant`\
  \ 参数设置为 20，引导 RRF 算法融合两个 `sub_search` 的分数。\n\n因此，此查询展示了 BM25、ELSER 和 RRF 的有效组合。利用各自的优势，CookBot\
  \ 可以超越简单的关键词匹配，提供更具上下文相关性的食谱，从而改善用户体验并提高系统的整体实用性。\n\n## 利用检索器并实现生成器\n\n既然我们已经设置好\
  \ Elasticsearch 检索器并准备就绪，让我们继续 RAG 系统的最后一部分：生成器。在我们的应用程序背景下，我们将使用 GPT-4 模型作为生成器。我们将在\
  \ `recipe_generator.py` 模块中实现生成器，然后将其集成到我们的 Streamlit 应用程序中。\n\n### 构建生成器\n\n我们将首先创建一个\
  \ `RecipeGenerator` 类。该类使用 OpenAI API 密钥进行初始化（关于如何获取 OpenAI 密钥，请参阅 https://help.openai.com/en/articles/4936850-where-do-i-find-my-secret-api-key），用于对\
  \ GPT-4 模型的请求进行身份验证：\n\n```\nimport openai\nimport json\nfrom config import OPENAI_API_KEY\n\
  \nclass RecipeGenerator:\n    def __init__(self, api_key):\n        self.api_key\
  \ = api_key\n        openai.api_key = self.api_key\n```\n\n接下来，我们在 `RecipeGenerator`\
  \ 类中定义 `generate` 函数。\n此函数接收一个食谱作为输入，并将其作为提示发送给\nGPT-4 模型，要求它生成一份详细的分步指南。\n\n```\n\
  def generate(self, recipe):\n    prompts = [{\"role\": \"user\", \"content\": json.dumps(recipe)}]\n\
  \    instruction = {\n        \"role\": \"system\",\n        \"content\": \"Take\
  \ the recipes information and generate a recipe with a mouthwatering intro and a\
  \ step by step guide.\"\n    }\n    prompts.append(instruction)\n\n    generated_content\
  \ = openai.ChatCompletion.create(\n        model=\"gpt-4\",\n        messages=prompts,\n\
  \        max_tokens=1000\n    )\n    return generated_content.choices[0].message.content\n\
  ```\n\n提示格式符合 OpenAI API 的要求，`max_tokens` 参数设置为 1000 以限制生成文本的长度。然后，生成的食谱由该函数返回。\n\
  \n## 将生成器集成到 Streamlit 应用程序\n\n有了我们的 `RecipeGenerator` 类，我们现在可以将其集成到 `main.py` 中的\
  \ Streamlit 应用程序中。在导入必要的模块并初始化 `RecipeGenerator` 类后，我们将设置带有文本输入字段的用户界面：\n\n```\n\
  from recipe_generator import RecipeGenerator\nfrom config import OPENAI_API_KEY\n\
  generator = RecipeGenerator(OPENAI_API_KEY)\ninput_text = st.text_input(\" \", placeholder=\"\
  Ask me anything about cooking\")\n```\n\n当用户输入查询时，我们将使用 Elasticsearch 检索器获取相关食谱。然后，我们将此食谱传递给\
  \ `RecipeGenerator` 的 `generate` 函数，生成的文本将在 Streamlit 应用程序中显示（示例视频见 https://www.linkedin.com/posts/bahaaldine_genai-gpt4-elasticsearch-activity-7091802199315394560-TkPY）：\n\
  \n```\nif input_text:\n    query = {\n        \"sub_searches\": [\n            {\n\
  \                \"query\": {\n                    \"bool\": {\n               \
  \         \"must_not\": [\n                            {\n                     \
  \           \"match\": {\n                                    \"ingredient\": \"\
  onion\"\n                                }\n                            }\n    \
  \                    ]\n                    }\n                }\n            },\n\
  \            {\n                \"query\": {\n                    \"text_expansion\"\
  : {\n                        \"ml.tokens\": {\n                            \"model_id\"\
  : \".elser_model_1\",\n                            \"model_text\": input_text\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        ],\n        \"rank\": {\n            \"rrf\": {\n```\n\n```\n\"window_size\"\
  : 50,\n\"rank_constant\": 20\n    }\n}\nrecipe = elasticsearch_query(query)\nst.write(recipe)\n\
  st.write(generator.generate(recipe))\n```\n\n生成器因此与检索器协同工作，根据用户的查询提供详细的分步食谱。这完成了我们在\
  \ Streamlit 应用程序中 RAG 系统的实现，填补了检索相关信息与生成连贯、有意义响应之间的差距。\n\n## 总结\n\n在深入探讨了构建 CookBot\
  \ 所涉及的众多技术细节和高级方法后，我们可以得出结论：RAG、ELSER、BM25 和 RRF 的应用极大地增强了 CookBot 以更高的精确度和深度回答烹饪查询的独特能力。\n\
  \n在这一章的过程中，我们发现了 RAG 作为检索相关文档的检索器和制作详细响应的生成器的潜力。通过结合 ELSER 和 BM25，检索组件获得了语义背景和关键词效率的优势。这些检索方法与\
  \ RRF 的融合导致生成了高度相关的食谱集合，即使面对复杂或模糊的查询也是如此。\n\n将 RAG 集成到 CookBot 的架构中进一步增强了其能力，展示了一种迭代方法的价值，即知识在多步过程中得到精炼。通过在\
  \ RAG 设置中使用 GPT-4 作为生成器，CookBot 能够产生多样化、丰富且上下文准确的响应。\n\n通过利用 Allrecipes.com 数据集作为基础，并协调使用\
  \ RAG、ELSER、BM25 和 RRF，我们成功创建了 CookBot，一个能够熟练导航烹饪领域并提供个性化帮助的机器人。此模型说明了如何将最先进的检索方法与强大的语言模型相结合，从而为各种领域产生实用且高效的解决方案。\n\
  \n展望未来，我们可以预见 CookBot 将得到进一步的增强和完善，展示了 AI 驱动烹饪协助领域的无限可能性。这次探索为我们深入更先进的技术和策略奠定了基调，这些技术和策略可用于创建强大的对话式\
  \ AI 系统。\n\n我们希望你已经对这些关键概念及其应用有了全面的理解，从而更深入地欣赏人工智能这一迷人领域。在下一章，我们将探讨 ChatGPT 插件框架，并将我们获得的关于\
  \ RAG 的知识扩展到直接集成到 ChatGPT 体验中。\n\n\n\n\n\n## 10"
- "为 ChatGPT 构建一个 Elastic 插件\n\n上下文是理解的支柱。对于 ChatGPT 等对话式 AI 系统而言，保持最新信息至关重要，以便在瞬息万变的科技环境中保持相关性。虽然静态知识库可以应对各种问题，但当系统理解当前上下文时，答案的精确性和相关性可以得到显著提升。\n\
  \n动态上下文层（DCL）提供了一种解决方案。通过持续用最新数据更新模型的知识，DCL 确保 AI 的响应不仅准确，而且及时且具有上下文感知能力。本章重点介绍如何利用\
  \ Elasticsearch 的向量功能结合 Embedchain 为 ChatGPT 创建这样的层，Embedchain 是一个旨在轻松构建可在任何数据集上运行的\
  \ LLM 驱动型机器人的框架。我们的主要目标是使 ChatGPT 能够提取并理解最新的领域特定信息，确保其为用户查询提供最及时的答案。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 大语言模型中上下文的重要性\n- 上下文重要性概念\n- Embedchain 作为在不同数据集上创建 LLM 驱动型机器人的框架\n- 如何为 Elasticsearch\
  \ 构建 ChatGPT 插件\n\n随着我们的推进，我们将评估系统。配备最新 Elastic 上下文的 ChatGPT 如何响应用户查询？动态、最新的数据集会带来什么不同？\n\
  \n到本章结束时，你不仅会理解构建 DCL 背后的机制，还会认识到为你的对话式 AI 提供实时、不断更新的数据源的价值。\n\n## 上下文基础\n\n上下文基础为我们的旅程奠定了基础，我们将重温\
  \ **上下文** 在 **大语言模型（LLMs）** 领域中的重要性。在本简短部分中，我们将了解为什么保持相关且动态的上下文对于有意义的交互至关重要，尤其是在内容不断演变的应用程序中。这种基础知识将为我们在后续部分中探索的创新提供基础。\n\
  \n### 动态上下文范式\n\n在任何对话中，响应的丰富性和相关性往往取决于其所处的上下文。随着我们阅读本书，我们已经领略到 GPT 等 LLM 所依赖的庞大知识库。但当我们希望模型把握新鲜数据的细微差别时会发生什么？本节介绍动态上下文的概念——其意义、挑战，以及它为现代聊天机器人带来的潜力。我们将深入探讨为何要使用最新数据动态增强\
  \ ChatGPT 响应的原因，为后续更深入的技术探索奠定基础。\n\n### 大语言模型中上下文重要性的演变\n\n当我们讨论大语言模型如 ChatGPT 的上下文时，我们不仅仅指的是用户的即时输入。上下文是塑造模型输出的隐式和显式信号的组合，确保其响应与整体对话的主题和具体细微差别保持一致。\n\
  \nGPT-4 等 LLM 通过在广泛的数据集上进行大量训练，发展出了对上下文的本能理解。这些庞大的训练使它们能够生成受训练期间辨识模式启发的人类般文本。简单来说，它们通过研究无数对话学会了模仿人类交谈的方式。\n\
  \nChatGPT 的一个显著特征是其在滚动上下文窗口上运行。通过优先考虑最近的交互来为其下一个响应提供信息，它们确保对话的连贯性。如果用户突然转换话题或回到之前提到的点，LLM\
  \ 会由于该上下文窗口而做出适当响应。这使得与 ChatGPT 或类似模型的对话感觉连贯而不是支离破碎。\n\n### 为什么静态知识不够——动态上下文的优势\n\
  \n当我们与人类交谈时，我们很大程度上依赖于我们可获得的最新的相关信息。我们的决策、见解和讨论不仅仅基于多年前的记忆；它们还融入了最新新闻、最近的经历和更新的知识。LLM\
  \ 本质上应努力模仿人类对话的这一方面。然而，当受限于静态知识时，其潜力就会受到限制。\n\n让我们看看原因：\n\n- **过时信息**：静态知识是时间上的一个快照。无论这个快照多么庞大或详细，它最终都会过时。例如，静态模型可能精通软件应用程序在其最后更新时的功能。但之后添加的新功能或修改呢？寻求最新信息的用户会发现静态知识不完整，甚至更糟——具有误导性。\n\
  - **相关性丧失**：几年前、几个月前甚至几周前被认为相关或必不可少的信息，今天可能不再具有同样的意义。趋势在演变，全球形势在变化，用户兴趣也在转移。动态上下文确保所访问的数据与当前情况保持一致，从而保持其对用户的相关性。\n\
  - **无法应对最新发展**：从技术进步到全球事件，世界处于不断变化的状态。如果没有利用动态上下文的能力，LLM 对这些发展一无所知，无法回答或涉及近期事件的问题或主题。\n\
  - **静态数据库的深度**：虽然静态数据库可以非常庞大，但它们不会实时增长或演变。它们可能对特定主题有深入的知识，但缺乏应对更新的跨学科主题所需的广度。\n\n\
  ### 动态上下文的力量\n\n与静态知识的局限性相反，动态上下文提供了一个不断演进的知识库。让我们现在看看动态上下文的优势：\n\n- **实时更新**：通过连接到实时数据源或当前数据库，所提供的信息始终保持更新。用户获得反映给定主题最新知识状态的答案。\n\
  - **提高相关性**：动态上下文使 LLM 能够利用当前趋势、讨论和全球动态。这确保所提供的答案与当下相关的内容密切契合。\n- **可扩展性**：随着世界的成长和演变，动态上下文也在增长。它随新数据的涌入而扩展，确保知识库持续扩展。\n\
  - **交互性**：通过与当前上下文保持同步，LLM 可以提供更具交互性和吸引力的对话。它们可以响应实时事件，提供正在进行情况的更新，甚至对新趋势做出反应，就像一位见多识广的人类一样。\n\
  \n本质上，虽然静态知识提供了坚实的基础，但正是动态上下文为 LLM 注入了活力，将其从单纯的信息存储库转变为能够进行有意义、当前和互动对话的实体。\n\n##\
  \ 上下文的重要性\n\n为了介绍上下文重要性（SoC）的概念，请考虑以下类比，该类比利用了我们在第 9 章《使用 Elastic 的检索增强生成》中构建的示例。\n\
  \n想象使用一个食谱应用来准备晚餐。最初，你只能访问来自一本过时食谱书的食谱。虽然这些食谱提供了基本基础，但它们可能无法满足当今的饮食偏好或使用你橱柜中现有的食材。\n\
  \n一周后，该应用进行了升级。现在，它不仅包含来自多个来源的食谱，还可以根据用户评论、食材季节性和你的个人饮食限制进行调整。此外，每次使用时，应用都会从你的选择中学习，并开始建议更符合你口味的食谱。\n\
  \n让我们将此与上下文重要性的因素联系起来：\n\n- **相关性（R）**：最初的广泛食谱范围具有一般相关性，但在学习了你的特定偏好后，应用的建议变得与你的口味高度相关。借助个性化，你获得了增强的用户体验。\n\
  - **连续性（C）**：随着你不断向应用提供饮食偏好的反馈，你看到的食谱类型保持一致，提供持续的定制化建议流。\n- **及时性（T）**：应用还考虑季节和最新的烹饪趋势。通过这样做，它确保所建议的食谱是及时的，使用季节性食材并与当前烹饪趋势保持一致。\n\
  - **准确性（A）**：通过与经过验证的烹饪来源同步并整合用户评论，应用确保其食谱建议不仅受欢迎，而且在食材、比例和烹饪方法方面也是准确的。LLM 与上下文的结合将有助于最大限度地减少\
  \ LLM 幻觉。LLM 幻觉是指 LLM 由于对信息的误解或训练数据集中存在偏见信息而呈现虚假、捏造或无意义的信息。\n\n正如我们在 ChatGPT 中为\
  \ Elastic 文档构建 DCL 的目标一样，我们旨在确保所提供的信息不仅准确，而且对用户的需求高度相关、连续且及时。\n\nSoC 类似于搜索引擎中的相关性评分，可以作为量化评估语言模型上下文感知效率和准确性的衡量标准。在本书中，我们希望尝试为\
  \ SoC 创建一个数学表示。鉴于上述因素，这里是一个可能的表示：\n\nSoC = 1 / (1 + e^(-k(w_R R + w_C C + w_T T\
  \ + w_A - threshold)))\n\n\n\n\n\n在前面的公式中，权重如下：\n\n- w_R = 相关性的权重\n- w_C = 连续性的权重\n\
  - w_T = 时效性的权重\n- w_A = 准确性的权重\n\n在此上下文中，*threshold* 将是调整后的值（通常是权重的总和），它确保 sigmoid\
  \ 函数的中点与参数的期望平衡点对齐。sigmoid 函数用于将 SoC 限制在 0 到 1 之间，确保其代表上下文重要性的百分比或类似概率的度量。\n\n例如，在实时新闻机器人中，时效性可能具有更大的权重，而对于技术支持机器人，相关性和准确性可能更为重要。\n\
  \n为了使其具有可操作性，每个分数（R、C、T 和 A）理想情况下应在 0 到 1 之间，其中 1 为最佳可能分数。\n\n这些分数的数据可通过用户反馈、直接评估或其他指标获得，例如后续问题的耗时（表明可能存在困惑或缺乏清晰度）。\n\
  \n随着时间的推移，随着更多数据的收集，权重可以进行调整以更好地反映用户需求和偏好。\n\n## sigmoid 函数中 k 的作用\n\n*k* 决定 sigmoid\
  \ 曲线的陡峭程度。\n\n增加 *k* 会使 sigmoid 函数变得更陡，这意味着 SoC 对平均表现的敏感度降低，而对 exceptional 表现的辨别力增强。\n\
  \n减小 *k* 会使曲线变平缓，使得输入分数的微小变化也能明显影响 SoC。\n\n通过评估 SoC，不仅可以评估语言模型的性能，还可以识别改进领域。它还提供了一种可操作的方法来迭代增强模型。在探讨了动态上下文的重要性和必要性之后，让我们深入了解如何实现它。接下来，我们将研究\
  \ DCL 插件的架构和流程，说明理论与应用之间的桥梁。\n\n## 示例\n\n让我们尝试看看为什么拥有一个数据存储——也就是说，不仅是一个向量数据库，而且是一个能够提供最相关搜索结果的搜索引擎——很重要。以下代码展示了如何在相关性驱动\
  \ SoC 时绘制 SoC：\n\n```\n### Import necessary libraries\nimport numpy as np\nimport\
  \ matplotlib.pyplot as plt\n### Define the SoC function using sigmoid\ndef soc_function(R,\
  \ C, T, A, k=1, threshold=2):\nreturn 1 / (1 + np.exp(-k*(R + C + T + A - threshold)))\n\
  ### Sample R, C, T, A values\nR_values = np.linspace(0.8, 1, 50)\nC_values = np.linspace(0.8,\
  \ 1, 50)\nT_values = np.linspace(0.8, 1, 50)\nA_values = np.linspace(0.8, 1, 50)\n\
  ### Compute SoC values for the sample R, C, T, A values\nsoc_values = soc_function(R_values,\
  \ C_values, T_values, A_values)\n\n### Plotting the function\nplt.figure(figsize=(10,\
  \ 6))\nplt.plot(R_values, soc_values, label=\"SoC values\", color='blue')\nplt.axhline(y=0.5,\
  \ color='r', linestyle='--', label=\"Midpoint\")\nplt.title(\"Significance of Context\
  \ (SoC) vs. R (with C, T, A held constant)\")\nplt.xlabel(\"Relevance (R)\")\nplt.ylabel(\"\
  SoC Value\")\nplt.legend()\nplt.grid(True)\nplt.show()\n```\n\n前面的代码将绘制以下内容：\n\n\
  ![](img/21c3d4250a746422a7489bc2647611d8_207_0.png)\n\n图 10.1：相关性为函数、 C、T 和 A 保持恒定的上下文重要性度量\n\
  \nElasticsearch 具有显著的优势，即它使用户能够微调相关性。 该图显示，尽管除了相关性之外还有三个因素构成 SoC，但数据存储对相关性的控制越多，动态上下文的重要性就越高。\n\
  \n## 动态上下文层插件愿景——架构和流程\n\n在本节中，我们将深入项目的核心：DCL 插件的设计和流程。我们将概述其结构，解释 ChatGPT、Embedchain\
  \ 和 Elasticsearch 如何协同工作。通过了解底层架构和数据流的步骤，您将了解如何将实时数据集成到聊天机器人的响应中。我们将讨论为什么做出某些设计选择以及它们对系统功能的影响。\n\
  \n在任何高级系统中，结构和功能的清晰度至关重要。DCL 也不例外。为了了解 ChatGPT 如何通过 Embedchain 与 Elasticsearch 交互的机制，我们必须首先熟悉实现这种集成的基础组件。每个组件都有其独特的目的，共同使我们的聊天机器人能够动态检索、理解和传递当前信息。\n\
  \nDCL 的核心是三个主要组件：**向量搜索引擎（VSE）**、**语义嵌入生成器（SEG）** 和 **对话引擎（CE）**。这些组件远非孤立的单元，它们紧密相连，确保我们的聊天机器人的见解不仅准确，而且及时且上下文相关。\n\
  \n随着我们深入本章，这些组件将作为我们的导航灯塔，引导我们了解 DCL 系统的架构和流程。让我们首先了解这些基础支柱中的每一个，开始这段旅程。\n\n下图是\
  \ DCL 系统的视觉表示，展示了每个核心组件如何交互以提供无缝且动态的对话体验：\n\n![](img/21c3d4250a746422a7489bc2647611d8_208_0.png)\n\
  \n图 10.2：动态上下文层的系统架构\n\n**动态上下文接口（DCI）**充当中央枢纽，协调聊天机器人与 VSE 之间信息和交互的流转。它是一个多功能的接口，旨在理解、解释并在对话引擎和底层数据存储库之间转换请求和响应。另一方面，实时上下文提取器（RCF）体现了整个系统的动态方面。顾名思义，RCF\
  \ 负责从 VSE 中主动检索最新和最相关信息。无论是提取最新的文档更新还是提取向量嵌入的见解，RCF 都确保提供给聊天机器人的数据始终是最新的，使对话尽可能相关和知情。DCI\
  \ 和 RCF 共同构成了连接数据和对话的静态世界与动态世界的活跃纽带。\n\n在建立了对 DCL 插件架构的清晰理解之后，是时候从蓝图过渡到建设阶段了。在下一节中，我们将详细介绍构建动态层的步骤和注意事项，确保我们的\
  \ ChatGPT 能够有效地利用 Elasticsearch 和 Embedchain 进行实时上下文适配。\n\n## 构建 DCL\n\n在本节中，我们将着手构建我们设想的工具的具体步骤。我们将深入探讨将\
  \ Elasticsearch 的功能与 Embedchain 合并的技术细节，重点关注与 ChatGPT 集成和优化的实际方面。到本节结束时，您将全面了解如何使此\
  \ DCL 投入运行以及如何微调其性能以获得最佳用户体验。\n\n## 从 Elastic 文档获取最新信息\n\n让我们现在深入探索的实际方面。在这里，我们将讨论如何从\
  \ Elastic 获取最新的文档，这是确保我们的动态上下文保持最新状态的关键步骤。此过程作为填充上下文的相关且及时数据的初始步骤，为 ChatGPT 以上下文感知的方式进行交互奠定了基础。\n\
  \n数据提取是我们创建 DCL 的基础步骤。在 Elastic 中有不同的数据上板选项；在这里我们将使用 Elastic 网页爬虫。爬虫使用户只需一个 URL\
  \ 即可开始从网站摄取数据。通过 Elastic 网页爬虫，我们有一种简化和直接的方式来获取必要的数据。网页爬虫的优点如下：\n\n- **简单设置**：无需构建复杂的\
  \ 数据集成管道或处理各种内容来源，Elastic 网页爬虫只需一个 URL 即可开始其提取过程。\n- **与 Elasticsearch 直接集成**：激活后，爬虫直接获取数据并将其馈送到\
  \ Elasticsearch 索引中。这种无缝流程确保数据可随时用于后续阶段，无需延迟。\n- **可配置性**：该工具用途广泛。虽然默认配置适用于许多场景，但可以自定义爬取，例如专注于网站的特定部分或调整检查新内容的频率。\n\
  \n\n\n\n\n针对我们的特定需求，从 https://www.elastic.co/guide 获取 Elastic 文档用例，Elastic 网页爬虫至关重要。它系统地扫描指南，确保全面捕获最新的文档。此数据一旦编入\
  \ Elasticsearch 索引，即可为语义嵌入和后续与 ChatGPT 的交互做好准备。\n\n借助 Elastic 网页爬虫等工具，我们可以少担心如何收集数据，而更专注于如何有效利用这些数据来提升聊天机器人的性能。\n\
  \n让我们首先确保您在 Elastic Cloud 部署中运行着一个 Enterprise Search 节点：\n\n+   1. 打开您的部署并检查是否看到如下截图中所示的节点：\n\
