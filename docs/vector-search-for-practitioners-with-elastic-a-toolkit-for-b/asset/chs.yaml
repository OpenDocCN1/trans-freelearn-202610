- "## Elastic 中的模型管理与向量考量\n\n在本章中，我们将概述 Hugging Face 生态系统、Elasticsearch 的 Eland Python\
  \ 库，以及在 Elasticsearch 中使用嵌入模型的实用策略。\n\n我们将首先探索 Hugging Face 平台，讨论如何入门、选择合适的模型，以及利用其庞大的数据集集合。我们还将深入探讨\
  \ Hugging Face Spaces 的功能以及如何有效使用它们。\n\n然后，我们将介绍由 Elastic 创建的 Eland Python 库，并通过\
  \ Jupyter Notebook 示例演示其用法。\n\n本章将涵盖以下主题：\n\n- 由 Elastic 创建的 Eland Python 库\n- 索引映射\n\
  - **机器学习 (ML)** 节点\n- 将 ML 模型集成到 Elasticsearch\n- 规划集群容量的关键方面\n- 存储效率策略，可帮助优化 Elasticsearch\
  \ 集群的性能和资源利用率\n\n## 技术要求\n\n为了实现本章涵盖的概念，您需要以下内容：\n\n- Elasticsearch 8.6 或更高版本：https://www.elastic.co/downloads/elasticsearch\n\
  - Eland 8.6 或更高版本：https://eland.readthedocs.io/en/latest/index.html\n- Python 3.7\
  \ 或更高版本：https://www.python.org/downloads/\n- pandas 1.3 或更高版本：https://pandas.pydata.org/docs/getting_started/install.html\n\
  \n## Hugging Face\n\n如介绍中简要讨论的那样，Hugging Face 的主要目标是民主化对最先进 NLP 技术的访问并促进其在各个行业和应用中的采用。通过提供大量预训练模型库（截至本文撰写时超过\
  \ 120,000 个）、用户友好的 API，以及用于模型共享和微调的协作环境，Hugging Face 使开发人员和研究人员能够轻松创建先进的语言处理应用。\n\
  \n在此基础上，Hugging Face 不仅提供庞大的库，还确保流畅的访问和有效的应用管理。其突出功能之一是 Model Hub。\n\n## Model Hub\n\
  \nHugging Face 提供面向研究人员和企业的资源和服务。其中包括 Model Hub，它作为预训练模型的中央存储库，包括推理 API，可轻松访问这些模型。\n\
  \n模型可以通过名称或任务进行搜索，并可按任务类型架构等轻松筛选，以找到适合您用例的模型。在图 3.1 中，您可以看到我们在搜索术语 bert 时可用的模型列表：\n\
  \n![](img/21c3d4250a746422a7489bc2647611d8_70_0.png)\n\n图 3.1：Hugging Face 模型搜索结果页面\n\
  \n选择模型后，您将获得有关该模型的信息。在顶部，您将看到任务类型、可用架构、使用的库、语言、许可证等。在图 3.2 中，我们看到有关 bert-base-uncased\
  \ 模型的信息：\n\n![](img/21c3d4250a746422a7489bc2647611d8_71_0.png)\n\n图 3.2：Hugging\
  \ Face Model Card 摘要信息\n\n大多数模型，尤其是更受欢迎的模型，都有 Model Card。Model Card 包含开发者提供的信息，例如模型训练方式、详细描述、模型变体、相关模型、预期用途和限制、运行代码示例、已知偏差以及训练信息。在图\
  \ 3.3 中，我们看到有关 BERT 模型训练方式的信息：\n\n![](img/21c3d4250a746422a7489bc2647611d8_71_1.png)\n\
  \n图 3.3：模型训练和描述信息\n\n在图 3.4 中，我们可以看到上个月的下载次数，以及通常最有用的、托管推理 API 的实时界面。托管推理 API 允许以编程方式访问在\
  \ Hugging Face 共享基础设施上运行的模型，该模型将接受输入，通过模型处理并返回输出。此 API UI 允许您通过提供输入并查看输出来测试模型。\n\
  \n![](img/21c3d4250a746422a7489bc2647611d8_72_0.png)\n\n图 3.4：模型下载次数和测试推理 API\n\n\
  在讨论了 Model Hub 的相关性和其各种功能之后，同样重要的是要阐明为这些模型提供动力的底层数据。进入 Hugging Face Datasets，它是\
  \ NLP 和 ML 数据工具领域中的基石。\n\n## Datasets\n\nHugging Face Datasets 是一个旨在简化下载、预处理和利用多样化数据集用于各种\
  \ NLP 和 ML 任务的过程的库。该库提供对大量数据集的访问，涵盖广泛的主题和语言，并适用于情感分析、翻译和摘要等多种用例。数据集来源于研究论文、网络抓取或用户贡献，并以标准化格式提供给社区。Hugging\
  \ Face Datasets 的关键特性之一是其与 Transformers 库的直接集成，使用户能够轻松将这些数据集与 NLP 模型结合用于训练、评估和部署。\n\
  \n使用 Hugging Face Datasets 很简单。\n\n首先，您需要使用 pip install datasets 安装库。安装库后，您可以通过导入库并使用\
  \ load_dataset() 函数来加载数据集。例如，如果您想加载 IMDb 电影评论数据集用于情感分析，可以使用以下代码：\n\n```\nfrom datasets\
  \ import load_dataset\nimdb_dataset = load_dataset(\"imdb\")\n```\n\nHugging Face\
  \ Datasets 还提供用于数据集预处理和操作的有用功能，包括过滤、映射和洗牌。这些功能使用户能够轻松准备数据以供其模型使用。在此示例中，我们将使用 Transformers\
  \ 库中的预训练分词器对 IMDb 数据集进行分词：\n\n```\nfrom datasets import load_dataset\nfrom transformers\
  \ import AutoTokenizer\n\n#### Load a small portion of the IMDB dataset (100 samples)\n\
  imdb_dataset = load_dataset(\"imdb\", split=\"train[:100]\")\n\n#### Initialize\
  \ the tokenizer\ntokenizer = AutoTokenizer.from_pretrained(\"bert-base-uncased\"\
  )\n\n#### Tokenize the IMDB dataset with truncation and padding\ntokenized_imdb_dataset\
  \ = imdb_dataset.map(\nlambda x: tokenizer(x[\"text\"], truncation=True, padding=\"\
  max_length\")\n)\n\nprint(tokenized_imdb_dataset)\n#### This prints out:\nDataset({\n\
  \    features: ['text', 'label', 'input_ids', 'token_type_ids',\n    'attention_mask'],\n\
  \    num_rows: 100\n})\n\n#### Get the first row of tokens\nfirst_row_tokens = tokenized_imdb_dataset[0][\"\
  input_ids\"]\n\n#### Print the first 10 tokens and their corresponding words\nfor\
  \ token in first_row_tokens[:10]:\nprint(f\"Token: {token}, Word: {tokenizer.decode([token])}\"\
  )\n```\n\n这会打印出以下内容：\n\n```\nToken: 101, Word: [CLS]\nToken: 1045, Word: i\nToken:\
  \ 12524, Word: rented\nToken: 1045, Word: i\nToken: 2572, Word: am\nToken: 8025,\
  \ Word: curious\nToken: 1011, Word: -\nToken: 3756, Word: yellow\nToken: 2013, Word:\
  \ from\nToken: 2026, Word: my\n```\n\n在输出中，我们可以看到当我们运行 imdb_dataset['text'][0] 时，我们得到第一行的前\
  \ 10 个标记和对应的词。\n\n## Spaces\n\nHugging Face Spaces 是一个平台，旨在促进 ML 模型的部署、共享和协作，特别是专注于\
  \ NLP 的模型。借助 Spaces，用户可以轻松地将模型部署为交互式 Web 应用，由 Gradio 或 Streamlit 提供支持，无需额外的基础设施或复杂配置。Spaces\
  \ 允许用户展示其工作成果、收集反馈并与社区中的其他人协作，使其成为 ML 和 NLP 领域经验丰富的从业者和初学者的宝贵工具。\n\nHugging Face\
  \ Spaces 的关键特性之一是其与 Hugging Face 生态系统的无缝集成，包括 Transformers 库和 Hugging Face Hub。这种集成使用户能够快速将预训练或微调模型部署为交互式应用，使其他人能够测试模型并深入了解其功能。要开始使用\
  \ Spaces，用户需要在 Hugging Face 网站上创建账户并遵循部署新 Space 的指南。该过程通常涉及编写利用 Gradio 或 Streamlit\
  \ 框架的 Python 脚本，从 Hugging Face Hub 导入所需模型，并为与模型交互定义用户界面组件。\n\n\n\n\n\n让我们来看一下可以让你设置一个简单的\
  \ Gradio 界面的代码：\n\n```\nimport gradio as gr\nfrom transformers import pipeline\n\
  sentiment_pipeline = pipeline(\"sentiment-analysis\")\n\ndef sentiment_analysis(text):\n\
  \    result = sentiment_pipeline(text)\n    return result[0][\"label\"]\n\niface\
  \ = gr.Interface(fn=sentiment_analysis, inputs=\"text\",\noutputs=\"text\")\niface.launch()\n\
  ```\n\n在这个示例中，使用 Hugging Face Transformers 库创建了一个情感分析 pipeline，并定义了一个 Gradio 接口来接受文本输入并将情感标签作为输出显示。一旦代码上传到\
  \ Hugging Face Space，用户就可以通过网络浏览器与应用程序交互，使用自己的文本输入测试情感分析模型。Spaces 提供了一种简单而强大的方式来展示\
  \ ML 模型并促进社区内的协作。\n\n![](img/21c3d4250a746422a7489bc2647611d8_75_0.png)\n\n图 3.5：测试情感分析模型的一个简单示例\n\
  \n虽然 Hugging Face Spaces 为 NLP 应用提供了卓越的平台，但 Hugging Face 并不是我们唯一可用的资源。让我们通过将重点转移到\
  \ Eland 及其在 Elasticsearch 与传统数据处理框架（如 pandas）之间架起桥梁的作用上来丰富我们的工具箱。\n\n## Eland\n\n\
  Eland 是 Elastic 开发的 Python 库，允许用户无缝地与 Elasticsearch 接口进行数据操作和分析。该库构建在官方 Elasticsearch\
  \ Python 客户端之上，并扩展了 pandas API 到 Elasticsearch。这使得用户能够使用熟悉的 pandas 语法和约定与 Elasticsearch\
  \ 数据交互，从而更轻松地将 Elasticsearch 与现有的数据分析工作流程和工具集成。\n\nEland 对于处理无法放入内存且需要分布式处理的大型数据集特别有用。Elasticsearch\
  \ 可以通过将数据分布到集群中的多个节点来水平扩展。这使用户能够高效地处理比在笔记本电脑上可能处理的更大得多的<|message|> 集合。让我们来看一下 Eland\
  \ 的一些功能：\n\n- Eland 的一个关键用例是查询存储在 Elasticsearch 中的数据。用户无需编写原始 Elasticsearch 查询，而是可以编写类似于\
  \ pandas 语法的 Python 代码来过滤、排序和聚合数据。例如，你可以按如下方式从 Elasticsearch 索引中获取数据：\n```\nimport\
  \ eland as ed\n\ndf = ed.DataFrame(\"http://localhost:9200\", \"my_index\")\nfiltered_df\
  \ = df[df['some_field'] > 100]\n```\n- 除了数据查询和转换之外，Eland 还支持聚合，使用户能够生成汇总统计信息或对 Elasticsearch\
  \ 数据计算复杂聚合。这对于理解大型数据集的分布和特征很有用。以下是如何计算特定字段平均值的示例：\n```\naverage_value = df['some_field'].mean()\n\
  ```\n- Eland 还可用于数据可视化，因为它可与 Matplotlib 和 Seaborn 等流行的 Python 可视化库无缝集成。一旦使用 Eland\
  \ 获取和操作数据，你就可以轻松地将结果转换为 pandas DataFrame 并创建可视化。以下是一个示例：\n```\nimport seaborn as\
  \ sns\nimport pandas as pd\n\nfiltered_df = df[df['some_field'] > 100]\npandas_df\
  \ = filtered_df.to_pandas()\nsns.boxplot(x='category', y='value', data=pandas_df)\n\
  ```\n\n最近，Eland 已扩展为将 NLP transformers 模型导入 Elasticsearch。Elasticsearch 目前支持在 PyTorch\
  \ 中训练并符合标准 BERT 模型接口的一组选定架构。这允许 Elasticsearch 原生运行命名实体识别、零样本分类、问答等 NLP 任务。当前支持的任务列表可在文档中查看：https://www.elastic.co/guide/en/machine-learning/current/ml-nlp-model-ref.html。\n\
  \n与本书最相关的是对文本嵌入模型的原生支持。Eland 用于加载本地存储的模型，或更常见的是，直接从 Hugging Face 加载模型到 Elasticsearch。模型被下载然后分块，以便可以加载到\
  \ Elasticsearch 中。\n\n现在我们将逐步介绍一个 Jupyter notebook，其中我们将配置 Elasticsearch 连接，从 Hugging\
  \ Face 加载模型，部署（启动）模型，并生成测试向量。\n\n完整代码可在本书 GitHub 仓库 chapter 3 文件夹中的 Jupyter Notebook\
  \ 中查看：https://github.com/PacktPublishing/Vector-Search-for-Practitioners-with-Elastic/tree/main/chapter3。\n\
  \n在对 Eland 如何促进 Hugging Face 模型与 Elasticsearch 集成有了基础理解之后，让我们深入探讨使用代码的实际方面。接下来，我们将逐步了解如何将\
  \ Sentence Transformer 从 Hugging Face 高效加载到 Elasticsearch 中，阐明希望利用这些平台组合强大功能的人员的过程。\n\
  \n## 从 Hugging Face 加载 Sentence Transformer 到 Elasticsearch\n\n此代码将向你展示如何将受支持的嵌入模型从\
  \ Hugging Face 加载到 Elastic Cloud 中的 Elasticsearch 集群：https://cloud.elastic.co/。\n\
  \n在这里，我们将安装并导入所需的 Python 库：\n\n- eland\n- elasticsearch\n- transformers\n- sentence_transformers\n\
  - torch==1.11\n\nElastic 使用 Eland 库从 Hugging Face Hub 下载模型并将它们加载到 Elasticsearch：\n\
  \n```\npip -q install eland elasticsearch transformers sentence_transformers torch==1.13\n\
  from pathlib import Path\nfrom eland.ml.pytorch import PyTorchModel\nfrom eland.ml.pytorch.transformers\
  \ import TransformerModel\nfrom elasticsearch import Elasticsearch\nfrom elasticsearch.client\
  \ import MlClient\n```\n\n### 配置 Elasticsearch 身份验证\n\n推荐的身份验证方法使用 Elastic Cloud\
  \ ID（https://www.elastic.co/guide/en/cloud/current/ec-cloud-id.html）和集群级 API 密钥（https://www.elastic.co/guide/en/kibana/current/api-keys.html）。\n\
  \n你可以使用任何你希望的方法来设置所需凭据。在此示例中，我们使用 getpass 来提示输入凭据以避免将它们存储在 GitHub 中：\n\n```\nimport\
  \ getpass\nes_cloud_id = getpass.getpass('Enter Elastic Cloud ID: ')\nes_api_id\
  \ = getpass.getpass('Enter cluster API key ID: ')\nes_api_key = getpass.getpass('Enter\
  \ cluster API key: ')\n#### Connect to Elastic Cloud\nes = Elasticsearch(cloud_id=es_cloud_id,\
  \ api_key=(es_api_id, es_api_key))\nes.info() # should return cluster info\n```\n\
  \n### 从 Hugging Face Hub 加载模型\n\nElastic Stack ML 功能支持符合标准 BERT 模型接口并使用 WordPiece\
  \ 分词算法的 transformer 模型。\n\n有关 WordPiece 分词的深入解释，请查看 Hugging Face NLP 课程的这一部分：https://huggingface.co/learn/nlp-course/chapter6/6?fw=pt。\n\
  \n使用如图 3.6 所示的复制链接从 Hugging Face 下载嵌入模型。\n\n对于此示例，我们将使用 sentence-transformers/msmarco-MiniLM-L-12-v3\
  \ 模型：https://huggingface.co/sentence-transformers/msmarco-MiniLM-L-12-v3。\n\n###\
  \ 下载模型\n\n在这里，我们指定来自 Hugging Face 的模型 ID。获取此 ID 的最简单方法是单击复制模型名称的图标，该图标位于模型页面上名称旁边。\n\
  \n![](img/21c3d4250a746422a7489bc2647611d8_78_0.png)\n\n图 3.6：model_id 的复制位置\n\n\
  调用 TransformerModel 时，你指定 Hugging Face 模型的 ID 和任务类型。你可以尝试指定 auto，Eland 将尝试根据模型配置中的信息确定正确的类型。这并不总是可能的，因此可以设置特定\
  \ task_type 的列表：\n\n```\nhf_model_id='sentence-transformers/msmarco-MiniLM-L-12-v3'\n\
  tm = TransformerModel( model_id=hf_model_id, task_type=\"text_embedding\")\n```\n\
  \n\n\n接下来，我们设置并确认模型 ID。为了使名称与 Elasticsearch 兼容，/ 被替换为 __（双下划线）：\n\n```\nes_model_id\
  \ = tm.elasticsearch_model_id()\n```\n\n以 TorchScript 形式导出模型，这是 Elasticsearch 使用的格式：\n\
  \n```\ntmp_path = \"models\"\nPath(tmp_path).mkdir(parents=True, exist_ok=True)\n\
  model_path, config, vocab_path = tm.save(tmp_path)\n```\n\n## 将模型加载到 Elasticsearch\n\
  \n在此，模型将被序列化并加载到 Elasticsearch，以便随后在 ML 节点上启动：\n\n```\nptm = PyTorchModel(es, es_model_id)\n\
  ptm.import_model(model_path=model_path, config_path=None, vocab_path=vocab_path,\
  \ config=config)\n```\n\n## 启动模型\n\n此步骤将输出有关模型的信息，例如名称和状态：\n\n```\n#### List the\
  \ in Elasticsearch\nm = MLClient.get_trained_models(es, model_id=es_model_id)\n\
  ```\n\n## 部署模型\n\n以下代码将在 ML 节点上加载模型并启动使其可用于 NLP 任务的过程：\n\n```\ns = MLClient.start_trained_model_deployment(es,\
  \ model_id=es_model_id)\n```\n\n接下来，我们将验证模型是否已无问题启动：\n\n```\nstats = MLClient.get_trained_models_stats(es,\
  \ model_id=es_model_id)\nstats.body['trained_model_stats'][0]['deployment_stats']['nodes'][0]['routing_state']\n\
  ```\n\n你应该会看到以下输出，表明模型已部署到 ML 节点：\n\n```\n{'routing_state': 'started'}\n```\n\n\
  ## 为查询生成向量\n\n在运行 kNN 查询之前，我们需要将查询字符串转换为向量。\n\n接下来，我们将创建一个示例查询句子以验证一切是否已正确设置：\n\n\
  ```\ndocs = [\n    {\n        \"text_field\": \"Last week I upgraded my iOS version\
  \ and ever since then my phone has been overheating whenever I use your app.\"\n\
  \    }\n]\n```\n\n我们调用 _infer 端点，它提供 model_id 和我们想要向量化的文档：\n\n```\nz = MLClient.infer_trained_model(es,\
  \ model_id=es_model_id, docs=docs, )\n```\n\n第一个文档的向量可以在响应字典中访问，如下所示：\n\n```\ndoc_0_vector\
  \ = z['inference_results'][0]['predicted_value']\ndoc_0_vector\n```\n\n在加载并成功测试嵌入模型后，我们现在可以在生产环境中使用它。\n\
  \n## 在 Elasticsearch 中生成向量\n\n向量可以在摄取期间在文档被索引（写入）到 Elasticsearch 之前使用摄取管道生成。摄取管道中的每个处理器执行不同的任务，例如丰富、修改或删除数据。该管道中的关键处理器是推理处理器，它将文本传递给嵌入模型，接收向量表示，然后在将文档传递以存储到索引之前将向量添加到原始文档负载中。这确保了文档的向量表示在摄取后立即可用于索引和搜索。\n\
  \n接下来是一个 Elasticsearch 摄取管道配置示例，它使用推理处理器与我们之前加载的 sentence-transformers/msmarco-MiniLM-L-12-v3\
  \ 模型。管道从输入文档中获取名为 summary 的字段，使用嵌入模型对其进行处理以生成嵌入，并将生成的向量存储在名为 vector 的字段中。\n\n这里，我们使用\
  \ HTTP 调用而不是 Python 代码来演示另一种方法。请注意，假设模型已在集群中加载，因为我们在之前的示例中已完成此操作：\n\n```\nPUT _ingest/pipeline/embedding_book_pipeline\n\
  {\n  \"description\": \"Ingest pipeline using bert-base-uncased model\",\n  \"processors\"\
  : [\n    {\n        \"inference\": {\n            \"target_field\": \"vector\",\n\
  \            \"model_id\": \"sentence-transformers__msmarco-minilm-l-12-v3\",\n\
  \            \"field_map\": {\n                \"summary\": \"text_field\"\n   \
  \         }\n        }\n    }\n]\n```\n\n要在索引文档时使用此摄取管道，请在索引请求中包含 pipeline 参数：\n\
  \n```\nPUT my_index/_doc/1?pipeline=embedding_book_pipeline\n{\n    \"summary\"\
  : \"This is an example text for the embedding model.\"\n}\n```\n\n此请求将索引一个文档，其中包含提供的文本字段和一个额外的向量字段，其中包含由\
  \ bert-base-uncased 模型生成的嵌入。\n\n也可以直接调用 _infer 端点以在查询时（请参阅下一节）或出于任何其他临时原因生成向量：\n\
  \n```\nPOST _ml/trained_models/sentence-transformers__msmarco-minilm-l-12-v3/_infer\n\
  {\n    \"docs\": [\n    {\"text_field\": \"How do I load an NLP model from Hugging\
  \ Face\"}\n    ]\n}\n```\n\n这将返回 200 响应代码和提交文本的向量表示：\n\n```\n{\n    \"inference_results\"\
  : [\n        {\n            \"predicted_value\": [\n                0.012806695885956287,\n\
  \                -0.045506563037633896,\n                0.014663844363951864,\n\
  \                ...\n                0.002125605707988143,\n                0.06371472030878067\n\
  \    ]\n    }\n]\n}\n```\n\n在搜索时，可以调用 _infer 端点从输入文本生成向量，然后将其用作向量搜索查询的一部分。在这里，我们将使用之前生成的向量作为\
  \ kNN 查询的一部分：\n\n```\nGET search-elastic-docs-vectorized/_search\n{\n  \"knn\":\
  \ {\n    \"field\": \"body_content-vector\",\n    \"k\": 1,\n    \"num_candidates\"\
  : 20,\n    \"query_vector\": [\n      0.012806695885956287,\n      -0.045506563037633896,\n\
  \      0.014663844369351864,\n      ...\n      0.002125605707988143,\n      0.06371472030878067\n\
  \    ]\n  },\n  \"fields\": [ \"body_content\", \"headings\" ],\n  \"_source\":\
  \ false\n}\n```\n\n或者，可以在 _knn 查询中指定嵌入模型（Elasticsearch 8.7 之后），Elasticsearch 将在运行其余\
  \ _knn 查询之前处理生成查询向量。这允许更简化的向量搜索功能集成并简化 kNN 搜索过程：\n\n```\nGET search-elastic-docs-vectorized/_search\n\
  {\n  \"knn\": {\n    \"field\": \"dense-vector-field\",\n    \"k\": 10,\n    \"\
  num_candidates\": 100,\n    \"query_vector_builder\": {\n      \"text_embedding\"\
  : {\n        \"model_id\": \"my-text-embedding-model\",\n        \"model_text\"\
  : \"The opposite of blue\"\n}\n}\n}\n}\n```\n\n让我们看看如何在生产环境中规划集群容量和资源。\n\n## 规划集群容量和资源\n\
  \n规划足够的集群容量和资源对于任何生产环境都至关重要，尤其是在实施相当规模的向量搜索用例时。为了确保最佳性能和效率，必须进行仔细的考虑、规划和测试。\n\n\
  在下一章中，我们将深入探讨负载测试，这是微调和优化 Elasticsearch 部署的重要部分。但在此之前，我们将探讨在 Elasticsearch 的 ML\
  \ 节点上运行嵌入模型所需的条件，概述需要考虑的关键因素，以便在性能和资源利用之间取得正确的平衡。在本节中，我们将讨论 CPU、RAM 和磁盘需求的关键方面，为全面了解\
  \ Elasticsearch 中的资源管理奠定基础。\n\n## CPU 和内存需求\n\nElasticsearch 中向量搜索的 CPU 需求与传统搜索没有太大区别。主要区别在于向量数据在\
  \ **近似 kNN**（为简单起见，我们在此称之为 **kNN**）查询期间如何被访问。\n\n在传统搜索和暴力/精确匹配向量搜索中，随着更多文档的添加，磁盘空间会扩展，CPU\
  \ 会扩展以适应增加的吞吐量。\n\n在 Elasticsearch 中的 kNN 搜索中也是如此；然而，为了获得最快的响应时间，我们希望有足够的非堆 RAM\
  \ 可用以将所有向量嵌入加载到内存中。当 Elasticsearch JVM 之外的 RAM 不足以容纳嵌入时，Elasticsearch 将不得不从磁盘读取，从而导致响应时间变慢，尤其是在频繁发生时。这种数据访问方式的转变可以提高性能，因为观察到当向量必须从磁盘而不是直接从内存读取时，更有可能出现热线程。通过直接从非堆\
  \ RAM 访问数据，向量搜索减少了这些热线程的影响并提供更高效的查询过程。\n\n> **注意**\n> `hot_threads` 是一个诊断 API，提供有关\
  \ Elasticsearch 节点中当前运行的最繁忙内部任务的见解。它通过突出显示消耗异常高 CPU 资源线程来帮助识别性能瓶颈。\n\n\n\n\n\n鉴于\
  \ kNN 搜索对 page-cache 内存需求尤为重要，用户需要留意有多少个向量能放入节点的可用 page-cache RAM 中。假设使用分层可导航小世界\
  \ Hierarchical Navigable Small World (HNSW) 的默认配置，所需字节数的粗略计算如下：\n\n```\nnum_vectors\
  \ * 4 * (num_dimensions + 12) = total RAM in bytes\n```\n\n举例来说，如果你使用的是输出 512 维向量的模型，并且预计要将\
  \ 2000 万个向量加载到 Elasticsearch 中，公式如下：\n\n```\n20,000,000 * 4 * (512 + 12) = 41,920,000,000\
  \ bytes\n41,920,000,000 / 1024 ~= 39 GB RAM\n```\n\n2000 万个 embedding 字段大致估算需要约\
  \ 39 GB 的 off-heap RAM 才能使 kNN 搜索性能最佳。如果将 Elasticsearch 中的一个完整节点视为 64 GB——其中一半分配给\
  \ Elasticsearch JVM，几 GB 分配给操作系统和其他进程——那么初步估算需要 2 个数据节点来处理这些向量。此外，请注意这尚未考虑副本。\n\n\
  这只是一个初步估算，是开始测试时一个不错的起点。它并非精确的 RAM 需求。后续章节中将介绍的测试将在投入生产前为你提供最佳数值。\n\n在明确了 RAM 使用的要求和影响后，我们将注意力转向生态系统中的另一个关键资源：存储。\n\
  \n## 磁盘需求\n\n正如我们所见，kNN 搜索性能的首要考虑因素之一是确保有足够的 off-heap RAM 可用于存储向量。然而，需要注意的是，这些向量仍然是在磁盘上生成和存储的。因此，用户必须确保有足够的存储空间可用。不过，由于磁盘大小相对于\
  \ RAM 大小，磁盘容量在规划集群容量时通常不是限制因素。\n\n上一节中提到的估算所需 RAM 的公式与向量数据的磁盘容量计算相同，但你还需要考虑与向量一起存储的任何其他字段，例如向量的文本、其他文本字段和元数据。\n\
  \n磁盘容量的粗略初始估算如下：\n\n```\nsize of a single document * number of documents * number\
  \ of replicas * 1.2\n```\n\n这里，1.2 是 JSON 扩展与磁盘压缩之间的净乘数。请注意，这是一个非常粗略的估算。\n\n然而，了解你的数据在\
  \ Elasticsearch 中的表现的唯一真实方法就是加载一个样本数据集。你可以轻松使用 Elastic Cloud 的免费试用版来启动一个小型集群并加载一个小型的代表性数据集。开始试用非常快速，只需在\
  \ https://cloud.elastic.co/registration 提供一个电子邮件地址即可。\n\n你将获得一个小型、功能齐全的 Elasticsearch\
  \ 集群，包括一个 ML 节点和所有企业功能。https://www.elastic.co/getting-started 上的入门指南可以帮助你快速上手。\n\
  \n加载数据后，你将能够看到数据实际扩展后的确切大小，这是规划生产需求的唯一真实方法。即使在免费试用期结束后，你也可以根据需要逐步扩展集群，采用灵活的按月付费方式。\n\
  \n你可以使用下一节介绍的磁盘使用 API 来查看磁盘使用情况，我们将在下一章介绍集群调优、负载测试和完整扩容测试。\n\n既然我们已经讨论了了解数据大小和扩展影响的重要性，那么拥有能够提供这些资源实际使用情况精确洞察的工具就至关重要。Elasticsearch\
  \ 套件中这样一个关键工具就是 analyze disk usage API。让我们探讨其功能以及它如何帮助了解磁盘空间消耗。\n\n## Analyze Index\
  \ Disk Usage API\n\n一旦向量和其他数据被加载到 Elasticsearch 中，你可以使用 **analyze index disk usage\
  \ API** 来计算占用的磁盘空间。对于 analyze disk usage API 的更多信息，请访问文档页面 https://www.elastic.co/guide/en/elasticsearch/reference/current/indices-disk-usage.html。\n\
  \nsearch-elastic-docs 索引包含多个数据量相对较小的向量字段，其中之一是 title-vector：\n\n```\nPOST /search-elastic-docs/_disk_usage?run_expensive_tasks=true&pretty\n\
  ```\n\n这会给出以下响应（API 调用的完整响应非常长，这里仅显示包含相关部分的截断输出）：\n\n```\n{\n  \"_shards\": {\n\
  \    \"total\": 2,\n    \"successful\": 2,\n    \"failed\": 0\n  },\n  \"search-elastic-docs\"\
  : {\n    \"store_size\": \"989.5mb\",\n    \"store_size_in_bytes\": 1037592858,\n\
  \n```\n\n```\n\"all_fields\": {\n    \"total\": \"987.6mb\",\n    \"total_in_bytes\"\
  : 1035596641,\n    \"inverted_index\": {\n        \"total\": \"69.8mb\",\n     \
  \   \"total_in_bytes\": 73269048\n    },\n...\n    \"knn_vectors\": \"83.4mb\",\n\
  \    \"knn_vectors_in_bytes\": 87462952\n},\n\"fields\": {\n...\n    \"title-vector\"\
  : {\n        \"total\": \"40mb\",\n        \"total_in_bytes\": 42046916,\n     \
  \   \"inverted_index\": {\n            \"total\": \"0b\",\n            \"total_in_bytes\"\
  : 0\n        },\n...\n        \"knn_vectors\": \"40mb\",\n        \"knn_vectors_in_bytes\"\
  : 42046916\n    },\n...\n```\n\n我们可以看到向量占用了 83.4 MB。分析完磁盘使用情况后，我们可以将注意力转向 ML 节点容量规划。\n\
  \n## ML 节点容量\n\n对于在 Elasticsearch 的 ML 节点上运行的 embedding 模型，你需要规划以确保节点在推理时有足够的容量来运行模型。Elastic\
  \ Cloud 允许根据 CPU 需求自动扩展 ML 节点，这使得它们在计算需求增加时能够扩展，并在需求降低时缩减。\n\n我们将在下一章更详细地介绍为推理调优\
  \ ML 节点，但至少，你需要一个具有足够 RAM 来加载至少一个 embedding 模型实例的 ML 节点。随着性能需求的增加，你也可以增加单个模型的分配数量以及每个分配分配的线程数。\n\
  \n要检查模型的大小以及加载模型所需的内存量，你可以运行 get trained models statistics API（有关此 API 的更多信息，请访问文档页面\
  \ https://www.elastic.co/guide/en/elasticsearch/reference/current/get-trained-models-stats.html#get-trained-models-stats）：\n\
  \n```\nGET _ml/trained_models/dslim__bert-base-ner-uncased/_stats?human\n```\n\n\
  这将返回各种统计信息，包括模型大小和内存需求：\n\n```\n{\n  \"model_id\": \"dslim__bert-base-ner-uncased\"\
  ,\n  \"model_size_stats\": {\n    \"model_size\": \"415.4mb\",\n    \"model_size_bytes\"\
  : 435663717,\n    \"required_native_memory\": \"1gb\",\n    \"required_native_memory_bytes\"\
  : 1122985674\n  },\n}\n```\n\n当模型运行时，你也可以在 Kibana UI 中通过进入 Machine Learning > Model\
  \ Management > Trained Models 并展开模型 ID 来获取其统计信息。\n\n在规划 ML 节点容量时，需要考虑两种不同的情况：\n\n\
  - 索引时：通常，会有大量文档的初始批量加载到 Elasticsearch 索引中，这需要生成向量。这会对 ML 节点产生很大的需求，要求它们尽可能快地运行推理。这就是能够轻松扩展\
  \ ML 节点并动态增加模型分配数量的能力非常有用的地方。你可以在初始批量加载运行时扩展模型分配，然后在加载完成后减少分配。\n\n- 搜索时推理：当用户发送搜索查询时，你需要使用与生成文档向量相同的\
  \ embedding 模型来生成查询向量。跟上平均查询负载将有助于你规划正常运行规模。如果预计查询负载会出现计划性峰值，例如电子商务中的繁忙购物周末，你可以主动增加模型分配数量，从而扩展\
  \ ML 节点。\n\n测试这两种条件的唯一真实方法是对实际数据进行负载测试和性能调优，我们将在下一章更深入地介绍。\n\n\n\n\n\n## 存储效率策略\n\
  \n随着用于向量搜索的生产数据集规模不断增长，用于存储这些向量以及及时搜索它们所需的资源也在增加。在本节中，我们讨论了用户可以采取的几种策略来减少这些资源。每种策略都有其权衡，在投入生产之前应仔细考虑并彻底测试。\n\
  \n### 降低维度\n\n降低维度是指将高维数据转换为低维表示的过程。该过程通常用于缓解处理高维数据时出现的问题，例如维度灾难（https://en.wikipedia.org/wiki/Curse_of_dimensionality）。降维技术，如主成分分析（PCA）和\
  \ t-分布随机邻域嵌入（t-SNE），可以帮助提高 kNN 向量搜索的效率和有效性。然而，降低维度也存在优点和缺点。\n\n降低维度的一个显著优点是存储、内存和计算需求的减少。高维向量数据可能消耗大量\
  \ RAM 和 CPU 资源，使其在 Elasticsearch 中难以处理。通过将数据转换为低维表示，所需的堆外 RAM 和计算量减少，从而可能提高 kNN\
  \ 向量搜索算法的效率，并使其能够在资源受限的环境中应用。\n\n降低维度的另一个优点是它可以帮助缓解维度灾难现象，该现象在维度数量增加且数据点变得越来越稀疏时出现。这种稀疏性可能导致基于距离的算法性能不佳，因为高维空间中数据点之间的距离变得不那么有意义。降低维度可以通过在低维空间中有效捕获最相关信息来缓解此问题，使基于距离的搜索算法更有效。\n\
  \n然而，降低维度也有一些缺点。其中一个主要缺点是信息可能丢失。降维技术通常涉及某种程度的近似或压缩，这可能导致数据中微妙关系或细微差别的丢失。这种信息丢失会影响\
  \ kNN 向量搜索的准确性和有效性，因为降维表示可能无法完全捕获原始高维空间中数据点之间的关系。\n\n另一个缺点是降维过程带来的额外复杂性和计算开销。应用降维技术通常需要额外的计算和资源，这可能会抵消从降低数据维度中获得的部分收益。此外，选择合适的降维技术并调整其参数可能具有挑战性，因为最佳选择通常取决于数据的特定特征和问题领域。\n\
  \n以下是使用 Iris 数据集的示例，该数据集有四个维度，并使用 PCA 将其降维到两个：\n\n```\nimport numpy as np\nimport\
  \ matplotlib.pyplot as plt\nfrom sklearn import datasets\nfrom sklearn.decomposition\
  \ import PCA\n\n#### Load the Iris dataset\niris = datasets.load_iris()\nX = iris.data\n\
  y = iris.target\n\n#### Apply PCA for dimensionality reduction\npca = PCA(n_components=2)\n\
  X_reduced = pca.fit_transform(X)\n\n#### Visualize the original data\nplt.scatter(X[:,\
  \ 0], X[:, 1], c=y, cmap=plt.cm.Set1, edgecolor='k')\nplt.xlabel('Sepal length')\n\
  plt.ylabel('Sepal width')\nplt.title('Original Iris dataset')\nplt.show()\n\n####\
  \ Visualize the reduced data\nplt.scatter(X_reduced[:, 0], X_reduced[:, 1], c=y,\
  \ cmap=plt.cm.Set1, edgecolor='k')\nplt.xlabel('First Principal Component')\nplt.ylabel('Second\
  \ Principal Component')\nplt.title('Iris dataset after PCA')\nplt.show()\n```\n\n\
  图 3.7 中的散点图显示了原始数据和降维后数据的分布。降低维度会导致一些信息丢失，但它也可以使数据更易于管理并提高基于距离的算法（如 kNN 搜索）的性能。\n\
  \n![](img/21c3d4250a746422a7489bc2647611d8_90_0.png)\n\n![](img/21c3d4250a746422a7489bc2647611d8_90_1.png)\n\
  \n图 3.7：在 PCA 之前和之后可视化 Iris 数据集\n\n另外，一些预训练模型会发布不同维度的大小。如果您从具有这些选项的预训练模型开始，在尝试自行进行降维之前，测试其中较小的维度选项是值得的。\n\
  \n### 量化\n\n量化是向量搜索中用于减少高维数据的大小和复杂性，同时保持执行有意义搜索操作的能力的技术。量化过程涉及将连续向量值，通常表示为浮点数，转换为更小且更紧凑的表示形式，例如整数。这种转换减少了与高维数据相关的存储和计算需求，从而实现更高效的搜索和检索操作。\n\
  \n从浮点表示转换为 8 位向量会对数据的大小和存储需求产生重大影响。浮点数通常需要 32 或 64 位来表示单个值，而 8 位向量每个值仅使用 8 位。这种尺寸的减少可以带来存储和内存需求的实质性节省，从而能够高效处理大规模向量搜索应用。然而，这种压缩可能会以降低精度和准确性为代价，因为量化过程涉及用较少离散级别近似原始浮点值。这种精度损失可能会影响搜索结果的相关性，因为量化向量之间的距离可能无法完美反映原始高维空间中数据点之间的关系。\n\
  \n为了演示量化过程，让我们使用 scikit-learn 库中可用的 Public Digits 数据集，它是 MNIST 数据集的较小版本，包含 8x8 像素的手写数字图像。该数据集足够小，可以在笔记本电脑上运行，而无需太多内存或计算能力。我们将使用\
  \ PCA 方法进行降维，然后对降维后的向量应用量化：\n\n```\nimport numpy as np\nfrom sklearn import datasets\n\
  from sklearn.decomposition import PCA\nfrom sklearn.preprocessing import MinMaxScaler,\
  \ QuantileTransformer\n\n#### Load the digits dataset\ndigits = datasets.load_digits()\n\
  X = digits.data\n\n#### Print the first example from the original dataset\nprint(\"\
  Original dataset (first example):\\n\", X[0])\n\n#### Apply PCA for dimensionality\
  \ reduction\npca = PCA(n_components=10)\nX_reduced = pca.fit_transform(X)\n\n####\
  \ Print the first example after PCA\nprint(\"\\nReduced dataset after PCA (first\
  \ example):\\n\", X_reduced[0])\n\n#### Normalize the reduced vectors to the range\
  \ [0, 255]\nscaler = MinMaxScaler((0, 255))\nX_scaled = scaler.fit_transform(X_reduced)\n\
  \n#### Print the first example after normalization\nprint(\"\\nScaled dataset after\
  \ normalization (first example):\\n\", X_scaled[0])\n\n#### Quantize the scaled\
  \ vectors to 8-bit integers\nX_quantized = np.round(X_scaled).astype(np.uint8)\n\
  \n#### Print the first example after quantization\nprint(\"\\nQuantized dataset\
  \ (first example):\\n\", X_quantized[0])\n```\n\n这将输出以下内容：\n\n```\nOriginal dataset\
  \ (first example): [ 0. 0. 5. 13. 9. 1. 0. 0. 0. 0. 13. 15. 10. 15. 5. 0. 0. 3.\
  \ 15. 2. 0. 11. 8. 0. 0. 4. 12. 0. 0. 8. 8. 0. 0. 5. 8. 0. 0. 9. 8. 0. 0. 4. 11.\
  \ 0. 1. 12. 7. 0. 0. 2. 14. 5. 10. 12. 0. 0. 0. 0. 6. 13. 10. 0. 0. 0.]\nReduced\
  \ dataset after PCA (first example): [-1.25943119 21.27487713 -9.4630716 13.01409073\
  \ -7.12874004 -7.44073278 3.25357601 2.55756705 -0.58760376 3.63146582]\nScaled\
  \ dataset after normalization (first example): [121.31621096 215.95604417 81.58062648\
  \ 168.0966397 77.88288852 73.75078201 132.99089292 135.63851202 121.03524697 151.29258751]\n\
  Quantized dataset (first example): [121 216 82 168 78 74 133 136 121 151]\n```\n\
  \n如前所述，虽然此过程可以带来显著的存储和性能改进，但也可能导致精度和搜索相关性降低。在考虑量化时，用户应在量化前后测试搜索结果的相关性，以查看降低是否可接受，然后再投入生产。\n\
  \n降低维度和量化是用于优化嵌入模型和向量表示的两种技术，但它们服务于不同的目的并解决数据的不同方面。降低维度针对向量表示中的维度数量，而量化则侧重于减少向量中每个元素的精度。这两种技术都可以提高效率并减少内存需求，但也可能引入一些信息或精度的损失，这可能会影响搜索结果的准确性和质量。\n\
  \n在讨论了优化向量表示的细微差别之后，重要的是要注意，系统的效率不仅取决于数据本身，还取决于数据的存储和检索方式。对于 Elasticsearch 和向量搜索，_source\
  \ 字段发挥着关键作用，尤其是在处理高维数据时。让我们讨论 dense_vector 在 _source 字段中的含义及其对搜索性能的潜在影响。\n\n\n\n\
  \n\n## 从 _source 中排除 dense_vector\n\nElasticsearch 在索引时将原始 JSON 文档存储在 _source 字段中。默认情况下，搜索结果中的每个匹配项都包含完整文档。然而，当文档包含高维\
  \ dense_vector 字段时，_source 字段可能会变得相当大，导致加载数据时产生大量开销。因此，kNN 搜索的速度可能会显著降低，因为处理这些更大的\
  \ _source 字段需要额外的时间。\n\n为缓解此问题，您可以使用 excludes 映射参数禁用在 _source 中存储 dense_vector 字段。这种方法可防止在搜索操作期间加载和返回大型向量，从而减少处理开销和索引大小。尽管被从\
  \ _source 中省略，向量仍可用于 kNN 搜索，因为搜索过程依赖于单独的数据结构以高效执行搜索。\n\n在应用 excludes 参数之前，了解从 _source\
  \ 中省略字段的潜在缺点非常重要。这样做可能会限制检索文档或执行需要访问原始字段值的某些更新操作的能力。\n\n映射中此设置的示例如下：\n\n```\nPUT\
  \ my_index\n{\n  \"mappings\": {\n    \"_source\": {\n      \"excludes\": [\n  \
  \      \"vector_field\"\n      ]\n    },\n    \"properties\": {\n      \"vector_field\"\
  : {\n        \"type\": \"dense_vector\",\n        \"dims\": 384,\n        \"index\"\
  \ : True,\n        \"similarity\" : \"dot_product\"\n      },\n      \"text_field\"\
  : {\n        \"type\": \"text\"\n      }\n    }\n  }\n}\n```\n\n除非您计划在某时重新索引该字段，否则对于任何包含\
  \ `dense_vector` 字段的索引，用户都应考虑设置此项，因为它将节省空间并提高 kNN 搜索速度。\n\n在 Elasticsearch 中从 `_source`\
  \ 中排除 `dense_vector` 字段可以实现高效的 kNN 搜索速度并减少索引大小。然而，用户应权衡其优点与潜在的重新索引需求，确保为其特定用例提供优化且有效的存储方法。\n\
  \n## 摘要\n\n在本章中，我们深入探讨了 Hugging Face 生态系统的复杂性以及 Elasticsearch 的 Eland Python 库的功能，并提供了在\
  \ Elasticsearch 中使用嵌入模型的实用示例。我们探索了 Hugging Face 平台，强调了其数据集、模型选择以及其 Spaces 的潜力。此外，我们提供了对\
  \ Eland 库的实践方法，说明了其功能并解决了映射、ML 节点和模型集成等关键考虑因素。我们还触及了集群容量规划的细微差别，强调了 RAM、磁盘大小和 CPU\
  \ 的考虑。最后，我们强调了多种存储效率策略，重点关注降维、量化以及映射设置，以确保您的 Elasticsearch 集群获得最佳性能和资源节约。\n\n在下一章中，我们将深入数据工作的运营阶段，并学习如何为推理和查询调优性能。\n"
- "## 性能调优 – 处理数据\n\n在上一章中，我们介绍了如何将 Elasticsearch 与 **机器学习 (ML)** 模型集成。在本章中，我们将重点关注优化\
  \ Elasticsearch 中的向量搜索性能。\n\n我们将涵盖以下主题：\n\n- ML 模型部署调优技术\n- 估算 Elasticsearch 节点的向量容量\n\
  - 使用 Elastic 的性能工具 Rally 进行负载测试\n- 排查缓慢的 **k-最近邻 (kNN)** 搜索响应时间\n\n到本章结束时，您将了解如何估算用例所需的\
  \ Elasticsearch 节点数量，如何使用性能基准测试确保这些估算符合您的要求，以及识别缓慢 kNN 搜索响应时间的潜在原因。\n\n让我们开始部署一个\
  \ **自然语言处理 (NLP)** 模型。\n\n## 部署 NLP 模型\n\n部署 NLP 模型需要选择一种部署方法，该方法能够在生产高峰期间处理预期的推理负载，同时高效且安全。在测试阶段，如果模型足够小，通常可以在本地运行。然而，生产用例需要生产部署策略。模型可以部署在虚拟机上，通过云提供商服务部署，在\
  \ Hugging Face 等专用模型托管服务上部署，或在可能的情况下部署在向量将被使用的同一服务中，例如 Elasticsearch。每种方法在效率、延迟、扩展和管理之间都有权衡。\n\
  \n与外部部署方法的交互通常涉及使用 API 发送文本输入并接收向量作为输出。无论向量如何生成，它们都会发送到数据存储以进行存储，并且以后可以使用精确匹配或近似最近邻搜索进行搜索。查询时生成的向量用于搜索之前存储的向量。\n\
  \n为获得最佳性能和效率而调优已部署模型可能涉及对硬件资源、软件配置和模型参数等因素进行调整。然而，具体的调优指南超出了本书的范围。\n\n在 Elasticsearch\
  \ 中部署嵌入模型时，模型在 Elasticsearch 集群内的专用 ML 节点上运行。这使得模型与 Elasticsearch 的搜索和索引功能无缝集成。我们接下来将介绍一些部署调优设置。\n\
  \n## 将模型加载到 Elasticsearch\n\nElasticsearch 版本 8.0+ 原生支持 libtorch，即 pytorch 中使用的\
  \ C++ 库。这使其能够在堆栈内运行基于 PyTorch 的模型并生成嵌入。\n\n要将模型加载到 Elasticsearch，我们将使用上一章中讨论的 Eland\
  \ Python 库。Eland 支持从本地驱动器加载模型或受支持的架构，但最简单的方法是从 Hugging Face 加载模型。文档涵盖了当前受支持的模型类型：https://www.elastic.co/guide/en/machine-learning/current/ml-nlp-model-ref.html。\n\
  \n在以下示例中，我们将直接从 Hugging Face 使用 Eland 加载 sentence-transformers/msmarco-MiniLM-L-12-v3\
  \ (https://huggingface.co/sentence-transformers/msmarco-MiniLM-L-12-v3) 模型。Eland\
  \ 将下载模型并将其分块以加载到 Elasticsearch。\n\n在上一章中，我们介绍了如何使用 Python 将 NLP 模型加载到 Jupyter Notebook\
  \ 中。作为提醒，您可以在本书 GitHub 仓库的 chapter 3 文件夹中查看使用 Eland 的 Python 代码：https://github.com/PacktPublishing/Vector-Search-for-Practitioners-with-Elastic/tree/main/chapter3。\n\
  \n或者，如果您只需要使用它来加载模型，也可以将 Eland 与 Docker 一起使用。Docker 是一个开源平台，可在轻量级且可移植的容器内自动化应用程序的部署。它确保软件在从一个计算环境移动到另一个环境时可靠运行。它通过使用容器来简化开发流程，容器允许开发人员将应用程序及其所有依赖项打包到软件开发的标准单元中。有关安装和使用\
  \ Docker 的更多信息，请访问 www.docker.com。\n\nEland Docker 容器（一个标准化的、封装的环境，可在底层系统和其他容器之外隔离运行应用程序及其依赖项）可以从\
  \ Eland GitHub 仓库下载：https://github.com/elastic/eland。\n\n要使用 Docker 从 Hugging Face\
  \ 安装模型，您可以运行以下命令：\n\n```\n$ docker run -it --rm --network host \\\n  elastic/eland\
  \ \\\n  eland_import_hub_model \\\n  --url http://host.docker.internal:9200/ \\\n\
  \  --hub-model-id sentence-transformers/msmarco-MiniLM-L-12-v3\\\n  --task-type\
  \ ner\n```\n\n模型加载后，让我们看看如何部署它，以及我们有哪些配置选项。\n\n## 模型部署配置\n\n一旦模型加载到 Elasticsearch\
  \ 中，它必须被部署或启动。模型在 ml 节点类型的节点上运行，就像在 Elastic Cloud 中部署时一样。\n\nNLP 模型，例如嵌入模型，可以通过配置分配数和每个分配的线程数来扩展以处理所需生产推理负载：\n\
  \n- **分配数**: 在启动模型时增加分配数设置会增加模型在所有可用 ML 节点上的分配量。增加分配数通常会提高整体吞吐量。此设置即使在模型已启动后也可以增加或减少。\n\
  - **每个分配的线程数**: 增加每个分配的线程数会影响每个模型实例使用的 CPU 线程数。增加此数字通常会改善每个请求的推理时间。此值只能在模型部署时更改。\n\
  \n这两个设置的组合不得超过所有可用 ML 节点上可用的线程总数。增加这些数字时会出现收益递减点。您应使用特定工作负载进行测试以找到最佳设置：\n\n\n\n\
  Figure 4.1: Model deployment settings\n\nLoading the model will allow us to begin\
  \ using it in performance testing before we move to a production setting. Let’s\
  \ look at the tool we have available to accomplish this.\n\n## Load testing\n\n\
  Benchmarking ingest and queries in Elasticsearch plays a crucial role in optimizing\
  \ the performance of search and analytics operations. With Elasticsearch being widely\
  \ used for handling large volumes of data, it is essential to ensure that both ingestion\
  \ and query performance are as efficient as possible. To achieve this, it is necessary\
  \ to identify bottlenecks and areas for improvement within the system. This can\
  \ be done through a thorough process of benchmarking and performance testing, allowing\
  \ users to identify and resolve any performance issues before they become critical.\n\
  \n## Rally\n\nRally is a free benchmarking tool developed by Elastic that allows\
  \ users to measure and optimize Elasticsearch performance. Rally can be used to\
  \ benchmark various Elasticsearch operations, such as indexing, searching, and aggregating\
  \ data. It is designed to support a wide range of scenarios and workloads, making\
  \ it an ideal choice for users who want to ensure that their Elasticsearch clusters\
  \ are running at peak performance. In this chapter, we will be focusing on using\
  \ Rally to benchmark the performance of vector search in Elasticsearch, an essential\
  \ aspect of many advanced search use cases.\n\nRally provides a set of tracks and\
  \ datasets that represent various types of data, such as logging, metrics, security,\
  \ and vectors. Users can use these provided tracks to benchmark a cluster as they\
  \ make changes to configurations and/or version upgrades.\n\nWhile there are many\
  \ components to the Rally framework, the three main components we will be working\
  \ with are as follows:\n\n- **Track:** A track in Rally represents a series of benchmarks\
  \ and workloads that simulate different operations (such as indexing or querying)\
  \ against Elasticsearch\n- **Race:** A race in Rally is an execution of a track,\
  \ where the performance of Elasticsearch operations is measured under specific conditions\n\
  - **Challenge:** A challenge within Rally is a specific set of operations or tasks\
  \ within a track, designed to test different aspects of Elasticsearch's performance\
  \ under varying configurations and loads.\n\nIn Rally, a track defines the operations\
  \ to be benchmarked, a challenge specifies the particular tasks and conditions under\
  \ which the track is executed, and a race is the actual run of the challenge on\
  \ the track to measure Elasticsearch's performance.\n\nUsers will get the most benefits\
  \ when they take the time to create custom tracks with their data and configure\
  \ Rally to use queries that are of the same structure so that they can used in production.\
  \ One of the largest benefits provided by Rally is the ability to run repeatable\
  \ tests as the user changes their data. This is especially useful early in the data\
  \ cluster architecting phase to test how settings such as the number of shards and\
  \ replicas and the number of docs on a single node will affect indexing speed and\
  \ query response times.\n\nFollow the download instructions for your environment,\
  \ as outlined in the documentation at https://esrally.readthedocs.io/en/stable/install.html.\n\
  \nWe will be using a vector track from Rally that's been specifically designed to\
  \ benchmark advanced searches on dense vector fields. This track, known as the StackOverflow\
  \ vector track, is derived from a dataset of StackOverflow posts and contains a\
  \ variety of fields, including dense vectors, to support advanced search features\
  \ such as ANN with filtering and hybrid search. By using this vector track, we will\
  \ be able to measure and optimize the performance of vector search in Elasticsearch\
  \ and gain insights into the best practices for managing Elasticsearch clusters\
  \ that handle high-dimensional vector data.\n\n> **Note**\n> By default, Rally will\
  \ output a large set of metrics to a log file, but an Elasticsearch cluster can\
  \ be configured to collect these results. The results can then be searched and visualized\
  \ on a Kibana dashboard so that you can compare tests.\n\nNow that we know what\
  \ Rally does, let's learn how to run it.\n\n## Setting up our Python environment\
  \ to run Rally\n\nIn this section, we will provide code snippets and descriptions\
  \ that you can use as examples. You can copy and run these examples to follow along\
  \ with the benchmarking process:\n\n- 1. Create a Python virtual environment:\n\
  ```\nsudo apt-get install python3-venv\npython3 -m venv rally_testing\nsource rally_testing/bin/activate\n\
  pip install --upgrade pip\n```\n- 2. Install the necessary dependencies and packages:\n\
  ```\nsudo apt-get install gcc libffi-dev python3-dev\npip install elasticsearch\n\
  ```\n- 3. Install Rally and the StackOverflow track:\n```\npip install esrally\n\
  esrally --version\nesrally list tracks\n```\n\nNow that we’ve set up our Python\
  \ environment to run Rally, let’s see how to configure Rally.\n\n## Configuring\
  \ Rally\n\nNext up, we will configure Rally to send metrics to an Elasticsearch\
  \ cluster. The best practice is to send metrics to a separate cluster from the one\
  \ you are benchmarking.\n\nAll the available options for reporting can be found\
  \ in the documentation: https://esrally.readthedocs.io/en/stable/configuration.html?highlight=reporting#reporting.\n\
  \nOpen the rally.ini file in a text editor of choice and modify the [reporting]\
  \ section. When you are done editing, the .ini file should look as follows. This\
  \ example is connecting to a dedicated monitoring cluster in Elastic Cloud. A monitoring\
  \ cluster allows you to collect reporting metrics over time:\n\n```\nvim ~/.rally/rally.ini\n\
  [reporting]\ndatastore.type = elasticsearch\ndatastore.host = my_monitoring_cluster.es.us-central1.gcp.cloud.es.io\n\
  datastore.port = 9243\ndatastore.secure = true\ndatastore.user = rally\ndatastore.password\
  \ = rally_password\n```\n\nWith Rally configured, let’s move on to benchmarking\
  \ our Elasticsearch cluster.\n\n## Running a race on an existing cluster\n\nWe will\
  \ be benchmarking an existing Elasticsearch test cluster to ensure our test Elasticsearch\
  \ cluster is configured the way we need it for the test. We will pass the track\
  \ information and test cluster information on the command line.\n\n> **Warning**\n\
  > Do not benchmark a production cluster! Benchmarking is designed to find the limits\
  \ of performance and can cause slowdowns in normal operations. This is expected\
  \ when testing but it can affect the performance of a production environment where\
  \ performance is critical to business operations.\n\nMore information can be found\
  \ in the Rally docs: https://esrally.readthedocs.io/en/stable/recipes.html#benchmarking-an-existing-cluster.\n\
  \nLet’s break down the arguments for esrally:\n\n- `race`: This tells esrally we\
  \ will run a race\n- `--track`: This defines the track we will use\n- `--target-hosts`:\
  \ This specifies which hosts we will run against – in this case, a test cluster\
  \ in Elastic Cloud\n- `--pipeline=benchmark-only`: This tells esrally not to create\
  \ a new cluster and to use an existing one\n- `--client-options`: This specifies\
  \ the required options when security is enabled\n\nExecuting all these arguments\
  \ with esrally looks like this:\n\n```\nesrally race --track=so_vector --target-hosts=deployment_name.es.us-central1.gcp.cloud.es.io:9243\
  \ --pipeline=benchmark-only --track-params ingest_percentage:100 --client-options=\"\
  use_ssl:true,verify_certs:true,basic_auth_user:'elastic',basic_auth_password:'elastic_password'\"\
  \n```\n\nPlease note that the so_vector track is over 32 GB in size.\n\nRally will\
  \ start to run. It will download the track data if it has not been downloaded already.\n\
  \nNow that we understand how to run Rally, the next step is to get an Elasticsearch\
  \ node ready for testing. To do that, we need to estimate how many vectors will\
  \ “fit” on a single node.\n\n## RAM estimation\n\nFor kNN search to be performant,\
  \ vectors need to “fit” in off-heap RAM on the data nodes. See the kNN performance\
  \ tuning documentation for more information: https://www.elastic.co/guide/en/elasticsearch/reference/current/tune-knn-search.html#ensure_data_nodes_have_enough_memory.\n\
  \nAs of Elasticsearch version 8.7+, the rough estimate required for vectors is as\
  \ follows:\n\n```\nnum_vectors * 4 * (num_dimensions + 12)\n```\n\nLet's take a\
  \ closer look:\n\n- num_vectors: This is the count of individual vector fields.\
  \ If you have 9 million documents and 1 vector per doc, the count would be 9 million.\
  \ If you have 1 replica, then the count would be 18 million.\n- num_dimensions:\
  \ This is the number of dimensions the embedding model generates.\n\nNote that this\
  \ formula applies to float-type vectors only.\n\nAs an example, with 9 million vector\
  \ fields, one per document, we would have the following:\n\n```\n9000000*4*(768\
  \ +12) =~ 26.2GB of RAM\n```\n\nThis gives us a starting estimate of 26 GB of RAM\
  \ (off-heap from the Elasticsearch JVM) required across the data nodes for performant\
  \ kNN search. Note that each replica that's added requires the same amount of additional\
  \ RAM. A standard Elasticsearch node is set up with the JVM taking half the available\
  \ RAM. So, we are estimating that a standard 64 GB Elastic Cloud data node should\
  \ be able to handle keeping 9 million 768 dimension vectors in cache. But we need\
  \ to test this to confirm that this is the case!\n\nWith our estimate in place,\
  \ we can begin the benchmarking process.\n\n## Benchmarking vector search\n\nAs\
  \ mentioned previously, Rally is a full-performance benchmarking tool with many\
  \ uses and advanced configurations. Covering them all would take a book of its own,\
  \ so we will just provide a high-level overview here. Rally has extensive documentation\
  \ at https://esrally.readthedocs.io.\n\nWhen using Rally to benchmark vector search,\
  \ especially kNN search, the approach is fairly straightforward but intentionally\
  \ methodical:\n\n- 1. Start with a single full-sized node, such as a VM of 60 GB\
  \ or 64 GB or RAM. By default, the Elasticsearch JVM will take half, but you can\
  \ also experiment by configuring 16 GB JVM heaps.\n- 2. Configure a test index to\
  \ have a single primary shard and zero replicas.\n\n\n\n\n\n+   3. 使用前面讨论的 RAM 计算，将估计向量的\
  \ 60% 索引到单节点中。\n+   4. 使用仅配置为搜索查询的自定义 track 运行 Rally。\n+   5. 分析结果，同时注意 **service\
  \ time** 和 **latency**：\n+      - Service time 是在 Elasticsearch 中实际运行查询所需的时间。\n\
  +      - Latency 是从 Rally 将查询排队到任务完成的总时间。你通常希望延迟尽可能低。\n+   6. 再向集群加载额外的 10% 文档。\n\
  +   7. 重复 Rally 测试并分析结果。\n+   8. 如果时间保持一致，继续缓慢加载文档并重新运行 Rally，直到指标急剧增加。\n+   9.\
  \ 当响应时间飙升时，可以认为上一次“良好”运行的文档数量接近单节点在 RAM 中保存向量的容量。\n+   10. 你可以通过运行 GET `/_nodes/hot_threads`\
  \ 来确认这一点（本章后面会讨论）。\n\n你需要使用这种方法来测试，以确定可以“容纳”在非堆 RAM 中的最大向量数量。然而，需要记住的是，标准的 Elasticsearch\
  \ 每分片 10 至 50 GB 的指导原则仍然适用，因为在撰写本文时，搜索单个分片仍然是单线程的。\n\n更多的主分片有可能通过将传入的文档分散到更多的数据节点（如果存在）来改善索引时间。对于快速搜索响应时间要求而言，目标通常是分片大小建议的较低端，这通常能获得最佳性能。\n\
  \n## Evaluating results\n\n在本节中，我们将查看一些示例测试运行，使用以下值：\n\n- 使用默认设置的 cohere_vector\
  \ rally track：`github.com/elastic/rally-tracks/tree/master/cohere_vector`\n- 向量为\
  \ 768 维 `float32`\n- 一个热节点，RAM 为 64 GB，使用 DATAHOT.N2.68X10X45 Elastic Cloud 配置\n\
  - 根据粗略计算，1100 万个向量在 8.10.3 Elasticsearch 中大约占用 32 GB RAM\n\n每个用例都有其自身的一组要求。“可接受”的响应时间也必须通过考虑以下因素来决定：\n\
  \n- 数据的使用方式 – 外部用户、内部用户、程序化查询\n- 要查询的数据大小\n- 预算\n\n这些只是几个例子。当你决定项目必须达到的响应时间时，所有这些因素都会发挥作用。\n\
  \n对于我们的测试示例，我们的目标响应时间小于 300 毫秒。该测试旨在帮助你了解单节点的性能，然后我们再扩展到多节点生产集群。\n\n## Testing with\
  \ 7.2 million vectors\n\n此处的响应时间被认为是可以接受的：\n\n| 50th percentile service time | standalone-knn-search-100-1000-single-client\
  \ | 63.2092 | ms |\n| 90th percentile service time | standalone-knn-search-100-1000-single-client\
  \ | 70.9459 | ms |\n| 100th percentile service time | standalone-knn-search-100-1000-single-client\
  \ | 204.182 | ms |\n\n## Testing with 9 million vectors\n\n此处的响应时间仍然被认为是可以接受的：\n\
  \n| 50th percentile service time | standalone-knn-search-100-1000-single-client\
  \ | 63.3707 | ms |\n| 90th percentile service time | standalone-knn-search-100-1000-single-client\
  \ | 71.7568 | ms |\n| 100th percentile service time | standalone-knn-search-100-1000-single-client\
  \ | 303.927 | ms |\n\n## Testing with 13.8 million vectors\n\n在这里，我们可以看到服务时间飙升至超出示例用例的可接受值。这很可能是由于向量大小超过了可用的非堆\
  \ RAM 导致 kNN 搜索响应时间显著增加：\n\n| 50th percentile service time | standalone-knn-search-100-1000-single-client\
  \ | 763.32 | ms |\n| 90th percentile service time | standalone-knn-search-100-1000-single-client\
  \ | 1045.13 | ms |\n| 100th percentile service time | standalone-knn-search-100-1000-single-client\
  \ | 1655.94 | ms |\n\n在这种情况下，我们会说单节点的密集向量容量（用于 kNN 搜索）约为 1000 万。\n\n以此数字为基础，我们可以开始扩展节点数量并根据需要添加额外的副本。\n\
  \n## Troubleshooting slowdown\n\n我们已经确定了单节点缓存和运行向量的近似容量，但查看其他指标以检查或确认减速原因会很有帮助。\n\
  \n当 kNN 搜索出现减速时，通常与非堆 RAM 不足有关。让我们看看可以帮助我们诊断问题的其他方法。\n\n## Hot Threads API\n\nElasticsearch\
  \ 中的 Hot Threads API 通过提供集群中所有节点或特定节点的繁忙线程信息来帮助识别性能较差的组件。分析 Hot Threads API 的输出可以帮助诊断性能瓶颈和减速。让我们学习如何分析\
  \ Hot Threads API 的输出。\n\n使用 Hot Threads API 获取最繁忙线程的详细信息。可以通过以下端点访问该 API：\n\n```\n\
  GET /_nodes/hot_threads\n```\n\n你也可以通过指定附加参数来定位特定节点或自定义输出，例如要返回的线程数或快照之间的间隔：\n\n\
  ```\nGET /_nodes/{nodeId}/hot_threads?threads=3&interval=500ms&snapshots=5\n```\n\
  \nAPI 的输出由最繁忙线程的堆栈跟踪组成。通常，你首先查看这些堆栈跟踪中的模式或反复出现的主题，以识别减速的来源。常见问题可能包括繁重的垃圾回收、缓慢或复杂的查询、分片重新平衡或资源密集型的聚合。\n\
  \n在专门排查 kNN 搜索减速时，我们首先查找与分层可导航小世界（HNSW）相关的线程。以下是其中一个线程的示例（部分）：\n\n```\n100.0% [cpu=4.7%,\
  \ other=95.3%] (500ms out of 500ms) cpu usage by\nthread 'elasticsearch[instance-0000000020][search][T#8]'\n\
  \    2/10 snapshots sharing following 33 elements\n        app//org.apache.lucene.codecs.lucene91.\n\
  Lucene91HnswVectorsReader$OffHeapVectorValues.\nvectorValue (Lucene91HnswVectorsReader.java:499)\n\
  \        app//org.apache.lucene.util.hnsw.HnswGraphSearcher.\nsearchLevel (HnswGraphSearcher.java:182)\n\
  ```\n\n在该堆栈跟踪中，我们可以看到以下内容：\n\n- 大部分时间花费在 other（95.3%）而不是 cpu（4.7%）上\n- 当我们查看正在运行的代码时，我们看到\
  \ Lucene91HnswVectorsReader$OffHeapVectorValues\n\n这两个信息强烈表明减速至少部分是由 Lucene 必须从磁盘而不是从页面缓存中检索向量引起的。关键点在于，低\
  \ cpu 百分比和高 other 百分比表明它在等待从磁盘读取向量。\n\n然而，请注意，如果大部分或全部百分比都在 cpu 中而不是 other 中，那很可能是预期的。\n\
  \n另一个值得关注的优秀指标是主要页面错误。\n\n## Major page faults\n\n监控主要页面错误指标可以帮助表明 Elasticsearch\
  \ 必须从磁盘读取向量。\n\n在 Linux 中，主要页面错误发生在操作系统需要从磁盘获取数据以满足程序对内存访问请求时。这发生在请求的内存页当前未加载到系统\
  \ RAM 中时。\n\n由于磁盘访问比内存访问慢得多，主要页面错误被称为主要页面错误，因为它比次要页面错误花费的时间更长，在次要页面错误中，请求的数据已存在于内存中但尚未映射到程序的地址空间。主要页面错误会负面影响程序的性能。\n\
  \nElastic 的 Metricbeat 是一个轻量级 shipper，你可以将其安装在服务器上，以定期从服务器上运行的操作系统和服务收集指标。其系统模块可以收集主要页面错误值（https://www.elastic.co/guide/en/beats/metricbeat/current/metricbeat-metricset-system-process.html）。\n\
  \n这些数据可以在 Kibana 中绘制图表，Kibana 是 Elasticsearch 的可视化应用程序。kNN 搜索期间的主要页面错误表明其中一些向量无法存储在页面缓存中，而必须从磁盘加载。监控此指标以及\
  \ hot_threads 可以最好地表明需要更多非堆 RAM 才能进行高效的 kNN 搜索：\n\n![](img/21c3d4250a746422a7489bc2647611d8_106_0.png)\n\
  \nFigure 4.2: Major page faults per Elasticsearch node in 3-hour buckets\n\n（上图中文本细节已最小化，且与图形显示的直接相关性不大。请参阅\
  \ Free eBook 下载以访问图形中的详细信息。）\n\n\n\n\n\nZooming in on the largest spike, we can\
  \ see that the page faults for instance 3 are above 4,592 for 4 hours. This is much\
  \ higher than what we would normally want to see:\n\n![](img/21c3d4250a746422a7489bc2647611d8_107_0.png)\n\
  \nFigure 4.3: A zoomed-in view of the major page faults chart\n\nHot Threads and\
  \ Major Page Faults are helpful tools for diagnosing search slowdowns. At indexing\
  \ time, there are a few items to consider.\n\n## Indexing considerations\n\nThe\
  \ following are some aspects you should consider:\n\n- Concurrent searches are supported,\
  \ but heavy indexing can make searches slower. This is because indexing can steal\
  \ computing resources from search. It can also cause many small segments to be created,\
  \ which is not good for search performance.\n- In general, we recommend separating\
  \ active indexing/updates from search as much as possible. So, if you need to reindex\
  \ to update the vector embedding, that should be done in a separate index (or better\
  \ yet, a separate cluster) rather than in-place. Alternatively, you could reindex\
  \ at off-peak hours, such as overnight (assuming there are off-peak hours).\n- Prefer\
  \ fewer bulk requests but with more vectors in them.\n- Make fewer requests to the\
  \ server.\n- Start with 10 MB bulk and tune from there.\n\n## Summary\n\nIn this\
  \ chapter, you delved into the nuances of optimizing vector search performance in\
  \ Elasticsearch. We explored various tuning techniques, highlighting the intricacies\
  \ of ML model deployment, node scaling, and configuration tuning. Tools such as\
  \ Rally were introduced to aid in load testing specific use cases. Moreover, the\
  \ focus on troubleshooting – bolstered by insights into monitoring cluster metrics\
  \ and the hot threads API – has empowered you with the skills to tackle slow queries\
  \ effectively.\n\nIn the next chapter, we will shift from text-focused semantic\
  \ search to image-focused semantic search and explore the history and practical\
  \ uses for these models, expanding our vector search capabilities.\n"
- '# Part 3:

  Specialized Use Cases


  This section delves into the specialized applications of vector search across various
  domains. From image search to the intricacies of cybersecurity, it explores how
  vector search is uniquely adapted to different contexts. These chapters provide
  a detailed perspective on the versatility of vector search, demonstrating its wide-ranging
  impact and utility in addressing specific, industry-related challenges.


  This part has the following chapters:


  - Chapter 5, Image Search

  - Chapter 6, Redacting Personal Identifiable Information Using Elasticsearch

  - Chapter 7, Next Generation of Observability Powered by Vectors

  - Chapter 8, The Power of Vectors and Embedding in Bolstering Cybersecurity

