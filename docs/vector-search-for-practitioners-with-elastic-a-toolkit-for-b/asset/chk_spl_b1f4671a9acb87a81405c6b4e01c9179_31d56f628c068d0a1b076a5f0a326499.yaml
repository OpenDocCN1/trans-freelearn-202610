- 'no': 6026
  overturn_probability: 0.95
  alternative: 出版社营销广告的小标题
  counter_evidence:
  - 该行位于索引结束后的出版社推广区域（前文有Packt网站链接，后文有“为什么订阅？”、“其他图书推荐”等营销内容）。
  - 这些内容属于书籍末尾的附录性质（广告、推荐、反馈），不属于书籍的正文知识体系。
  - 根据规则，虽然“前言、序言...统一划分为一章”，但末尾的广告和营销信息通常也不作为独立的“章节”处理，尤其是当它们缺乏正文的编号（如第X章）和统领性语义时。即使需要划分，也应是作为“附录”或“其他”部分，而非由营销小标题触发分章。但鉴于`chapter_starts`为空集，且这些标题极小（二级标题`##`），它们显然不是最高层级的章标题。
  keep_split: false
- 'no': 6038
  overturn_probability: 0.95
  alternative: 出版社营销广告的小标题
  counter_evidence:
  - 内容为“## 其他您可能喜欢的图书”，是典型的出版社交叉销售（Cross-promotion）版块标题。
  - 后续内容是具体的图书推荐（如“使用 PyTorch...”，“图机器学习”），这些是独立的书目介绍，不是当前书籍正文的结构部分。
  - 二级标题（`##`）在正文中通常对应“节”而非“章”，在营销页面上更是非结构性元素，不满足“全书最高层级大章”的标准。
  keep_split: false
