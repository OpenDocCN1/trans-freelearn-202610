  \ 函数的工作过程\n\n## 图 3.15：decrementNumber 函数的工作过程\n\n## 编写循环\n\n当我们需要重复执行某段代码一定次数时，循环非常有用。与其复制粘贴相同的代码行、让代码块变得更长，不如使用这种编程结构来让代码更简洁。循环可以是有限次的，也可以是无限次的。对于无限循环，我们通常会提供一条\
  \ break 语句来跳出循环。\n\n*图 3.16* 中的智能合约使用有限循环来计算有限个整数的总和：\n\n```solidity\npragma solidity\
  \ ^0.4.11;\n\ncontract numberLoop {\n    uint number; // unsigned integer is positive\
  \ integer\n    //constructor function with default value\n    function numberLoop()\
  \ public {\n        number = 100;\n    }\n    function myFirstLoop() public returns\
  \ (uint) {\n        for (uint i = 1; i < 10; i++) {\n            number = number\
  \ + i;\n        }\n        return number;\n    }\n}\n```\n\n图 3.16：Solidity 智能合约中的循环\n\
  \nremix IDE 中的输出如*图 3.17* 所示。如前所述，请注意每次调用 `myFirstLoop` 函数时，Account（账户）标签页中以太币数量的减少：\n\
  \n```\npragma solidity ^0.4.11;\n\ncontract numberLoop {\n    uint number; // unsigned\
  \ integer is positive integer\n    //constructor function with default value\n \
  \   function numberLoop() public {\n        number = 100;\n    }\n    function myFirstLoop()\
  \ public returns (uint) {\n        for (uint i = 1; i < 10; i++) {\n           \
  \ number = number + i;\n        }\n        return number;\n    }\n}\n```\n\n图 3.18：调试模式以识别执行状态\n\
