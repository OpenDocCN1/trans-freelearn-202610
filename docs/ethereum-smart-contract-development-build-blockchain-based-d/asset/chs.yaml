  \n## 在私有区块链上部署智能合约\n\n现在让我们做一些更专业的事情吧。是的，我们仍然不打算花法定货币购买以太币来在区块链上编写代码。相反，我们将做以下事情：\n\
  \n- 1. 为私有区块链编写一个创世区块文件。\n- 2. 使用 geth 命令创建私有区块链。\n- 3. 将私有区块链与 MIST 浏览器连接。\n- 4.\
  \ 挖矿生成我们自己的以太币作为奖励。\n- 5. 使用这些以太币在我们自己的私有区块链上部署智能合约。\n\n需要预先安装的工具如下：\n\n- Windows\
  \ 7（64 位）（说明针对 Windows 用户，Ubuntu/Mac 用户请参考附录）\n- Cygwin setup-x86_64（用于 Windows\
  \ 7 上的 Bash-Shell）（https://cygwin.com/install.html）\n- geth-windows-amd64-1.6.7-ab5646c5（https://geth.ethereum.org/downloads/）\n\
  - Mist-win64-0-9-0（https://github.com/ethereum/mist/releases）\n- Node.js（node-v6.11.2-x64）（https://nodejs.org/en/download/）\n\
  - .NET framework 4.5（https://www.microsoft.com/en-in/download/details.）\n\n我不打算详细介绍安装过程。安装过程非常直接，包括条款和条件页面（我们从不阅读），然后盲目地点击“Next”和“I\
  \ Agree”按钮，在安装进行的同时，看一些随机的 YouTube 视频或单口相声来娱乐自己。\n\n至于故障排除，Google 和 Stack Exchange\
  \ 永远是你最好的朋友。*图 3.21*、*图 3.22*、*图 3.23*、*图 3.24*、*图 3.25* 和 *图 3.26* 供你参考，用来检查安装过程中（尤其是\
  \ MIST、geth、Cygwin 和 Node.js）你是否在正确的轨道上。唯一的建议是，尽量将所有安装（.NET framework 除外）放在另一个驱动器的一个单独文件夹中，这样它们就不会弄乱你的主程序文件。我的下载和安装都在\
