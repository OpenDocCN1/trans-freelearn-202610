  ## Understanding Ethereum


  以太坊对我们到底意味着什么？它只是另一种模仿比特币的加密货币，还是一个可以运行各种应用程序在公共区块链上的分布式软件平台？作为一名软件开发者，我可以向你保证，以太坊远比它在标准维基百科文章中目前的定义要大得多。


  花点时间阅读以下定义。暂停，闭上眼睛，思考一下。下面的定义传达了一个微妙但非常有力的信息。它告诉我们：


  这是一个 24/7 的计算系统，你可以零前期成本拥有它。你可以复制它，使用它，模仿它，摆弄它，玩弄它，并根据你的需求调整它。不仅如此，你还可以用它发明自己的个性化货币，并提供给愿意拥有它的人。作为回报，你将通过公共账本上的合约永久定义地为他们提供某种服务，因此你和你的客户都无法作弊。取决于你的服务，你的价值会增长，你的货币的价值也会增长。你将与你的客户群体一起创建一个微型生态系统，其拥有独立于任何中央控制当局的个性化经济。效率将被奖励，而自满将被惩罚。那么，你准备好了吗？


  前述的解读听起来可能非常大胆和雄心勃勃，但实际上，这比在 1990 年代坐着思考互联网将如何颠覆出租车行业要现实得多，而 Uber 和 Ola 等应用在二十年后就把这一幕展示在我们面前，如
  *Figure 2.1* 所幽默展示的那样：


  ### 1998:


  - 不要坐陌生人的车

  - 不要与互联网上的人见面


  ### 2017:


  字面意思是从互联网上召唤陌生人，让他们载你一程


  Figure 2.1: Meme, Source: StareCat.com


  因此，与其反对这种颠覆性范式，我们需要拥抱这些变化。迈向这一目标的积极一步就是理解去中心化的概念以及它如何适用于以太坊，我们将在下一节中探讨这个问题。


  ## The notion of decentralization


  为什么我们需要构建一个本质上是去中心化的东西呢？


  为了理解这一点，让我带你走过一个基于中央控制的集中式经济的现实用例。


  索菲亚是英国卡迪夫一家酒吧的老板。为了渗透酒类市场，她决定允许她的忠实消费者——其中大多数是重度饮酒者——**先喝后付（DNPL）**。她在一本账本上记录所消费的品脱。索菲亚的
  DNPL 商业模式获得了客户的热烈好评，新消费者纷纷涌入索菲亚的酒吧，很快她就拥有了卡迪夫任何一家酒吧中最大的销售额。


  通过让客户免于立即付款，索菲亚在威士忌和朗姆酒——最畅销的饮料——的价格上大幅上涨时几乎没有遇到阻力。她的销售额、销量大幅增长。


  当地银行的一位年轻而充满活力的副总裁将这些客户债务视为有价值的未来资产，并提高了索菲亚的借款额度。他看不出有过度担忧的理由，因为他拥有顾客的债务作为抵押。在银行总部，量化交易员将这些酒类贷款转化为
  **neatbonds**、**pintbonds** 和 **hangoverbonds**。这些证券随后在全球证券市场上交易。菜鸟投资者并没有真正理解，他们被当作
  AAA 级债券出售的证券实际上是无收入的重度饮酒者的债务贷款。尽管如此，债券价格持续上涨，这些证券成为一些国家领先的经纪公司最畅销的商品。


  有一天，尽管债券价格仍在上涨，当地银行的一位风险经理决定是时候要求索菲亚酒吧顾客所欠债务的付款了。索菲亚向她的顾客要求付款，但由于他们失业，无法偿还饮酒债务。因此，索菲亚无法履行她的贷款义务并申请破产。Neatbonds
  和 pintbonds 的价格下跌了 95%。Hangoverbonds 表现更好，价格在下跌 75% 后稳定下来。债券资产价值的下降破坏了当地银行的流动性，并阻止其发放新贷款。索菲亚酒吧的供应商，由于给予她慷慨的付款延期并投资于这些证券，面临着注销她的债务并在她的债券上损失超过
  80% 的情况。她的威士忌供应商申请破产，她的朗姆酒供应商被竞争对手收购，后者立即关闭了当地工厂并裁员 40 人。银行和经纪公司在两大主要政党领导人进行全天候的戏剧性谈判后被政府拯救。为此次救助所需的资金是通过对受雇的中产阶级非饮酒者征收新的社会福利税获得的，或者是通过通过修正案或新法案向经济注入新资金，从而增加由货币供应造成的通胀，导致货币贬值。


  请注意，如果索菲亚最初没有被当地银行的副总裁接触到，她的商业模式会因资金不足而更早失败，影响要小得多，而不是由于无价值的资金注入而导致灾难性程度。我们还观察到，在这种集中式经济中，由于其自由裁量权，中介机构和中央当局没有什么可失去的，而真正的负担则转嫁给了普通工薪阶层。这是去中心化概念诞生的主要原因之一。


  理想情况下，我们可以拥有一个完全集中的系统，通常由星型拓扑表示，也称为客户端服务器架构，或者我们可以拥有一个完全分布式的系统，由网状或网格拓扑表示。然而，在现实世界中，由于物流和财务障碍等各种实际限制，我们最终处于两者之间，拥有一个部分集中、部分分布的网络。它就像一个由多个星型组成的网格拓扑，我们称之为去中心化系统。Paul
  Baran 在其关于分布式通信网络的经典著作（1964 年 8 月）中区分了这三种架构，即




  适用于如图 *图2.2* 所描绘的通信网络：


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_62_0.png)


  (a) 中心化。


  (b) 去中心化。


  (c) 分布式网络。


  **图 2.2：** 中心化、去中心化和分布式架构


  现在，我们需要讨论以太坊是否去中心化。你可能听一些人说过，以太坊并不是去中心化的。他们可能只说对了一部分。甚至以太坊的创始人之一维塔利克·布特林（Vitalik
  Buterin）也这样认为。你可能会觉得这完全是天方夜谭。以太坊当然应该是去中心化的。它是一项区块链技术，而区块链技术的核心理念就是去中心化。


  然而，对于这个问题的回答并不是简单的“是”或“否”，而是比这更复杂一些。维塔利克·布特林分析了去中心化的这个概念，我们现在就来讨论一下。


  去中心化至少包含三个重要维度：架构维度、政治维度和逻辑维度。像以太坊这样的系统，在这三个正交维度上，可以表现为中心化，也可以表现为去中心化。有时，我们也很难划清界限，断言某个系统总体上就是中心化或者去中心化的。在实践中，这确实很难判定。


  我们先从架构维度说起。如果一个系统在架构维度上是中心化的，那么当我从这个系统中移除几个节点/计算终端时，它就会崩溃。相反，在一个架构维度上去中心化的系统中，即使我移除大多数节点/计算终端，系统仍然可以按照预期运行。从这个意义上说，以太坊在架构维度上是去中心化的，因为我们可以从系统中移除许多计算节点，但整个网络仍然可以正常工作。然而，如果你将一个网站托管在一个服务器或一个服务器网络上，其中每个服务器都依赖其他所有服务器，那么当你移除一个服务器时，这些服务器和网站显然将无法再正常工作，因为这在架构维度上是一个中心化系统。


  我们继续。第二个维度是政治维度。


  例如，在政治维度上中心化的系统可能是一个公司或企业，我们有一个首席执行官，也许还有一个董事会，他们决定公司的发展方向。然而，以太坊在政治维度上是去中心化的，因为即使是以太坊基金会也无法强制每个人都使用他们的客户端，或者强制每个人都遵循某个协议。


  现在，要讨论的最后一个维度是逻辑维度。一个在逻辑维度上中心化的系统就像一个单一实体，像一个单体对象一样运作；而一个在逻辑维度上去中心化的系统则可以被分割成多个部分，并且每个部分都可以按照预期的方式表现和运行。


  例如，BitTorrent 协议和 BitTorrent 系统在逻辑维度上是去中心化的，因为我们可以将系统分成几个部分，这些被分离部分中的计算机仍然可以按照预期使用
  BitTorrent 协议。然而，这正是以太坊不去中心化的地方。实际上，在逻辑维度上，以太坊是中心化的，因为以太坊充当一台单一计算机。你在以太坊上执行合约，就像在这台运行在区块链上的巨大计算机上执行一样。所以，从这个意义上说，以太坊是中心化的。如果我们把以太坊分成两个不同的部分，那么它们将无法按照预期运行，因为以太坊的核心思想就是它应该是一台单一的计算机——它应该像一台单一的计算机那样运行。在这方面，以太坊在逻辑维度上是中心化的。


  *图 2.3* 展示了以太坊在去中心化所有三个维度上的情况：


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_64_0.png)


  | 维度 | 去中心化 | 中心化 |

  | --- | --- | --- |

  | 架构 | 是 | 否 |

  | 政治 | 是 | 否 |

  | 逻辑 | 否 | 是 |


  图 2.3：以太坊的去中心化概念


  问题依然存在：作为分布式计算平台，以太坊是如何在拥有完全去中心化架构的同时，实现如此水平的中心化逻辑抽象的呢？为了回答这个问题，我们需要熟悉以太坊生态系统的各个组成部分，并尝试构建其技术栈。下一节就会介绍这个。那么，让我们开始吧。


