  :\"string\"},{\"name\":\"fileHash\",\"type\":\"string\"}],\"name\":\"set\",\"outputs\"\
  :[],\"payable\":false,\"stateMutability\":\"nonpayable\",\"type\":\"function\"},{\"\
  anonymous\":false,\"inputs\":[{\"indexed\":false,\"name\":\"status\",\"type\":\"\
  bool\"},{\"indexed\":false,\"name\":\"timestamp\",\"type\":\"uint256\"},{\"indexed\"\
  :false,\"name\":\"owner\",\"type\":\"string\"},{\"indexed\":false,\"name\":\"fileHash\"\
  ,\"type\":\"string\"}],\"name\":\"FileLogStatus\",\"type\":\"event\"}]);\nvar browser_untitled_sol_ownershipcontract\
  \ = browser_untitled_sol_ownershipcontractcontract.new(\n  from: web3.eth.accounts[0],\n\
  ...\n```\n\n## 图 7.12：Solidity 合约对应的 Web3.js 代码\n\n\n\n\n\n正如你所见，我们并未深入探讨如何在 JavaScript\
  \ 代码中实现这个 Web3.js 版的所有权合约的细节来开发前端应用。\n\n在 _第 8 章，从零开始开发加密货币_ 中，我们将更仔细地审视实现方式，在其中我们将从零开始开发一种加密货币代币。\n\
  \n## Summary\n\n本章首先明确区分了 geth、Mist 和 Web3.js，以及它们如何通过 IPC 和 HTTP 在以太坊区块链上协同运行。两者都被看到使用了\
  \ JSON-RPC 协议。然后我们继续将 Web3.js 库划分为四个主要模块，即 eth、shh、bzz 和 utils。我们还看到了如何在使用纯 JavaScript\
  \ 调用 Web3.js 库来在私有区块链上运行智能合约。我们学习了如何探索 Web3.js 库的各种 API 子模块和函数。本章以一个所有权合约的 Solidity\
  \ 实现及其 Web3.js 等效代码生成作为结尾。\n\n在第 8 章，*从零开始开发加密货币* 中，我们将从零开始开发一种加密货币代币并学习有关 **首次代币发行\
  \ (ICO)** 的知识。\n"
- "## Developing a Cryptocurrency from Scratch\n\n在本章中，我们将讨论以太坊的广泛应用之一，即加密代币。我们将从对\
  \ Truffle 框架的简短介绍开始，并使用它创建一个 ERC20 兼容的代币。然后，我们将讨论 **首次代币发行 (ICO)** 以及它们如何被识别为诈骗、庞氏骗局、类似水龙头的或合法的。我们将随后介绍相对于加密货币的套利概念。我们还将学习有关\
  \ **法币兑换加密货币 (F2C)** 和 **加密货币兑换加密货币 (C2C)** 的知识。然后，我们以另一个 Parity 黑客案例研究作为本章的结尾。\n\
  \n学习本章后，你将能够：\n\n- 使用 Truffle 开发 ERC20 兼容代币\n- 识别庞氏骗局、诈骗、水龙头和合法的 ICO\n- 理解使用加密货币的套利交易。\n\
  - 了解法币兑换加密货币和加密货币兑换加密货币交易\n- 案例研究另一个 Parity 黑客并学习代币保管的重要性\n\n## Token versus coin\n\
  \n本章的标题具有误导性。它是有意被误导的。这是为了让你意识到从以太坊的角度来看加密货币和代币之间的细微差别。当你探索网络以获取有关加密货币的知识时，你会发现加密货币、币和代币这些术语经常被互换使用。\n\
  \n图 8.1 表示一种分类，突出了它们之间的细微差别：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_246_0.png)\n\
  \n图 8.1：代币与币\n\n简单来说，以下四点总结了币和代币之间的区别：\n\n- 币是其自身区块链上的独立货币，而代币主要基于单一区块链变体。\n- 币通常具有有限的功能，价值存储，而代币可以存储复杂、多方面的价值。\n\
  - 币大多是通过挖矿区块链生成的，而代币是通过在区块链上执行智能合约生成的。\n- 因此，当我们在本章中说加密货币时，我们实际上指的是代币，因为本书是关于以太坊智能合约的。凭借这一微小却至关重要的信息，我们将探索下一节，了解如何通过遵循\
  \ ERC20 兼容性从零开始开发以太坊代币。\n\n## ERC20 token development using Truffle\n\nTruffle 是用于以太坊的开发、测试和资产流水线的框架。它还具有使用\
  \ ERC190 标准集成的包规范。ERC190 是一份评论请求，规定了以太坊智能合约包规范的一套规则。\n\n以太坊的资产流水线是一个概念，借鉴自 Ruby\
  \ on Rails。这是一个提供框架来按所需执行顺序连接、压缩或压缩 JavaScript、Solidity 和 CSS 资产的功能。此功能帮助开发人员创建压缩和预处理的类似库的模块，可以被其他编码模块重用，这有助于提高生产力。\n\
  \n让我们开始安装 Truffle 框架。安装非常简单，可以在 Git Bash 窗口中使用以下命令完成，如图 8.2 所示：\n\n```\n$ npm install\
  \ -g truffle\n```\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_249_0.png)\n\n图 8.2：在名为\
  \ Truffle 的新文件夹中安装\n\n安装后，我们需要启动框架，可以按如图 8.3 所示进行操作。如果在安装或启动过程中遇到任何问题，请参阅 Ethereum\
  \ Stack Exchange 或 Truffle 文档以了解已知的故障排除问题。\n\n> 需要注意的是，为了为新项目启动 Truffle，我们必须始终在具有自定义项目名称的新文件夹中使用\
  \ Truffle init 命令。我们不能在已启动 Truffle 框架的项目文件夹中启动 Truffle，因为这会抛出异常。\n\n它是如何工作的：\n\n\
  ![](img/8c91673d39176d2e910ac52c4bc35d8b_250_0.png)\n\n图 8.3：Truffle 框架的启动\n\n现在让我们创建一个简单的\
  \ ERC20 兼容代币。为此，我们在 private-truffle-project 文件夹内创建一个新文件夹 ERC20_token，并在其中编写一个 solidity\
  \ 文件 ScratchToken.sol。\n\n我们将此 solidity 文件连同 Migration.sol 文件一起放在 contract 文件夹中。\n\
  \n现在，我们打开另一个 Git Bash 窗口并输入 testrpc 以启动测试网，如图 8.4 所示：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_250_1.png)\n\
  \n图 8.4：启动 testrpc\n\n在旧的 Git Bash 窗口中，我们更改 truffle.js 文件以指向我们的本地主机，如图 8.5 所示：\n\
  \n```\nmodule.exports = {\n  networks: {\n    development: {\n      host: \"localhost\"\
  ,\n      port: 8545,\n      network_id: \"*\" // Match any network id\n    }\n \
  \ }\n};\n```\n\n图 8.5：Truffle.js 配置更改\n\n然后，我们编译 .sol 文件，如图 8.6 所示；它们现在可以使用命令 truffle.cmd\
  \ deploy 在测试网上部署：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_251_0.png)\n\n图 8.6：编译\
  \ ScratchToken.sol\n\n这就是我们如何使用 Truffle 框架部署一个基本的 ERC20 合规代币。我们可以添加更多功能以纳入其他 ERC20\
  \ 合规功能，这些功能对于具有安全增强功能的完整代币是必需的。\n\n在智能合约章节中，我们讨论了为什么我们需要像 ERC20 这样的合规性，并承诺列出 ERC20\
  \ 代币中强制要求的各种函数。\n\n一个 ERC20 合规代币必须具有以下具有相同命名约定的函数列表：\n\n```\ntotalSupply ()\n```\n\
  \n此函数没有参数，并返回流通中的代币总供应量。\n\n例如，如果我们创建一个模仿比特币理念的 ERC20 代币，那么 `totalSupply()` 将获取\
  \ 2100 万作为数字：\n\n```\nbalanceOf (owner)\n```\n\n前述函数在括号内有一个参数，即所有者的地址。因此，此 `balanceOf`\
  \ 函数需要所有者的地址来返回余额值。\n\n```\ntransfer (to,value)\n```\n\n前述函数有两个参数，即 to 的地址，即接收者地址，以及需要发送到该地址的代币数量的值。\n\
  \n```\ntransferFrom (from,to,value)\n```\n\n前述函数有三个参数，即发送者地址、接收者地址以及需要转移的代币价值。\n\
  \n```\napprove (spender,value)\n```\n\n前述函数使所有者能够批准第三方实体在指定最大值范围内花费代币。\n\n```\n\
  allowance (owner, spender)\n```\n\n\n\n## 加密货币套利交易\n\n阿贾伊是个孤儿。我们是高中同学。为了支持学业，他常做零工。清晨，他卖蔬菜；夜晚，他卖手镯。由于通勤时间过长，他没能完成学业并毕业。20年后：他经营着一家活动管理公司，拥有两栋别墅和三辆轿车，全部出租用于活动用途。他仍住在童年时期的那栋一层公寓里。他不再支付租金，因为他已从房主手中现金买下了它。\n\
  \n几天前我们在一栋他的别墅里见面，当时有第三方在那里举办晚宴。我随口问他是什么让他如此成功。他告诉我，首先，他从未借过任何贷款。即便现在，他也没有信用卡。其次，是铁路轨道。\n\
  \n你看，我们的房子离火车站非常近。我们几乎每晚都能听到火车的汽笛声。阿贾伊告诉我，他在上学期间赚到了大部分钱。车站有双向铁轨，本地列车每半小时从市中心枢纽往返于偏远村庄。\n\
  \n他习惯从坐在右站台的火车小贩那里买蔬菜，然后卖给左站台的晨练者和慢跑者。\n\n我们的学校在左边。当放学铃响时，他会去买手镯然后回家。一旦黄昏开始降临，他便带着手镯来到右站台旁的寺庙附近。\n\
  \n阿贾伊没有任何正规的商业培训，却清楚地知道套利\n\n## ICO 故事\n\nYouTube 上存在一段视频日志，链接如下：\n\nhttps://www.youtube.com/watch?v=4bf4xZg_4U&feature=youtu.be&t=4m19s\n\
  \n截至撰写时，它仅获得了 285 次观看。这是 2013 年在圣何塞举行的比特币大会的片段。在视频的 4 分 19 秒处，一位 panelist 提出了他关于在比特币区块链协议之上开发一个新协议的想法，该协议具有一些新的\
  \ X、Y 和 Z 功能，并由一组值得信赖的软件开发者来构建。他还强调，他希望在不去任何风险投资公司的情况下创建这家初创公司。相反，他将发行一些代币供大众购买作为投资，这将作为启动资金。这些代币的价值将随着初创公司的成长而增加，这反过来会奖励此类代币的早期采用者。\n\
  \n“我要了，”有人喊道，视频就此结束。\n\n视频中的这个人是 J.R. Willet，而他在本视频中开创的想法就是**首次代币发行（ICO）**的概念。可惜，这个想法在比特币区块链上从未起飞，因为没有早期采用者。几年后，Vitalik\
  \ Buterin 利用这一概念在以太坊区块链上推广 ICO，并在 2017 年前九个月内筹集了约 20 亿美元的以太币资金。\n\nICO 是一种不受监管的方式，通过智能合约向投资者提供新加密货币或加密代币的单位，以市场已建立的加密货币，如比特币和以太坊进行交换。\n\
  \n好消息是，像以太坊、Augur 和 Golem 这样合法的 ICO，是众筹模式和**首次公开募股（IPO）**的结合体。坏消息是，如今市场上大多数 ICO\
  \ 出来时根本没有概念验证，而这是任何众筹模式的核心，而且它们也没有受到美国证券交易委员会的监管，而这是所有 IPO 中证券发行的支柱。*图 8.7* 体现了这一困境。这样的困境催生了我们需要识别的诈骗、庞氏骗局和水龙头。\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_257_0.png)\n\n图 8.7：ICO 困境\n\n现在，你可能会想知道，为什么在过去几个月发生了这么多黑客攻击后，我仍会将以太坊视为合法的\
  \ ICO。要回答这个问题，我们需要明白，以太坊上发生的所有黑客攻击都是由于智能合约上的糟糕编码实践，而不是基础设施本身，即以太坊区块链或以太坊虚拟机和 solidity。\n\
  \n最重要的是，就 ICO 而言，出售的代币是以太币，它们是用于在以太坊区块链上通过 gas 运行智能合约的代币。\n\n这就引出了我们可以识别诈骗 ICO 的一点。诈骗\
  \ ICO 的重要特征是，运行在区块链上的智能合约不会使用 ICO 上的代币。\n\n想象一下：你会买或投资一家声称自己是钻石商人但却给你烤杏仁作为投资代币或收据的公司吗？要么它为你在代币上投资的金额提供等价的法律纸质合同，要么提供某种有价值的石头。\n\
  \n庞氏 ICO 是一种不同类型的金融欺诈。事实上，庞氏骗局的概念 150 年前就已在离线世界中出现，投资者被承诺只要能诱骗其他投资者参与该计划，就能连本带息收回投资。没有产品的附属业务也是一种庞氏业务。以太坊世界不幸地已成为新型庞氏\
  \ ICO 的温床。\n\n图 8.8 表示了由意大利撒丁岛卡利亚里大学数学与信息学系的 Massimo Bartoletti 等人识别的基于以太坊的庞氏骗局分类（arXiv:1703.03779v5）：\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_258_0.png)\n\n图 8.8：基于以太坊的庞氏智能合约\n\n\
  水龙头与 ICO 无关。它们基本上是用户必须完成某些繁琐任务才能赚取以太币的网站。任务可以简单到点击网页、参与调查、玩游戏、撰写评论，或简单地复制粘贴附属链接。每项任务赚取的以太币极低，而从水龙头向用户钱包转账以太币的门槛可能极高或需要花费大量时间。水龙头是欺诈的边缘案例，因为有些确实会向因附属关系和坚持而成长的用户付款。然而，这些并不是合法的矿工在挖以太坊；相反，他们是被免费以太币诱惑而沦为用户奴隶的人。\n\
  \n## Fiat2Crypto 和 Crypto2Crypto 交易所\n\n加密货币尚未成为支付日常购买的理想金融工具。\n\n例如，要使用比特币钱包买一杯咖啡，我们必须将\
  \ BTC 发送到交易所进行兑换，等待确认处理完成，以大幅亏损的价格出售比特币，然后将法币资金转到我们的卡上。在某些情况下，我们的资金流动将由一名实际的人作为快递员负责。对于以太坊来说，这甚至更加繁琐。\n\
  \n有很多如雨后春笋般出现的交易所门户，但这些风险很高。几个经时间考验的交易所是 poloniex.com 和 cex.io。\n\n爱沙尼亚张开双臂拥抱加密货币。该国计划在\
  \ 2018 年开设一家名为 Crypterium 的加密银行。\n\n图 8.9 描绘了 Crypterium 的 ICO 销售。加密银行 Crypterium\
  \ 将是一个基础的 DApp，具有以下兑换设施：\n\n- **Fiat2Crypto**：DApp 从用户提取法币资金并将加密货币存入用户账户\n- **Crypto2Crypto**：DApp\
  \ 从另一用户的钱包提取加密货币，并将相同或不同类型的加密货币发送到用户账户（例如，BTC/ETH、ETH/BTC、BCH/BTC）\n- **Crypto2Fiat**：DApp\
  \ 从用户的钱包或账户提取加密货币，并将等值的法币货币（USD/EUR/GBP 等）发送到用户的银行账户。\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_261_0.png)\n\
  \n图 8.9：Crypterium ICO 销售\n\n\n\n\n\n## Parity 漏洞重现\n\n在上一章关于 Solidity 的内容中，我们讨论了由库合约中的多签钱包引发的\
  \ Parity 漏洞。发生该漏洞后，Parity 团队对库合约进行了必要的修复。然而，在此过程中，他们忘记了审计库智能合约的其他部分，而这些部分存在新的漏洞。\n\
  \n图 8.10 显示了可供外部用户访问的自毁代码片段。一个化名为 devops199 的新手开发者访问了此函数并意外执行了它。因此，整个库合约被自毁并从区块链上移除。\n\
  \n影响在很久之后才被意识到，当时调用该库的钱包变得毫无意义，而价值数百万美元的代币永远被困在这些悬空的钱包合约中。这样的黑客故事让我们认识到对任何开源代码进行同行评审的重要性，并说明了我们为何应使用冷钱包而非热钱包。\n\
  \n```solidity\n// kills the contract sending everything to `_to`.\nfunction kill(address\
  \ _to) onlymanyowners(sha3(msg.data)) external {\n    suicide(_to);\n}\n```\n\n\
  图 8.10：Parity 钱包库智能合约的自杀函数\n\n## 总结\n\n本章伊始，我们明确区分了代币与币种。然后，我们讨论了如何使用 Truffle 框架开发符合\
  \ ERC20 的代币。随后，我们探讨了加密货币套利交易的概念，以及如何区分合法的 ICO 与诈骗和庞氏骗局。\n\n我们谈到了 Cryptereum ICO\
  \ 以及它如何革新 C2C 和 F2C 交易所。我们以分析又一起导致数百万美元以太币永远冻结在自杀式智能合约库中的 Parity 漏洞作为本章的结尾。\n\n\
  在第 9 章《企业用例》中，我们将研究以太坊智能合约的一些企业用例。\n"
- "## 企业用例\n\n本章重点介绍区块链和智能合约如何渗透到行业中。我们首先介绍互联网货币的概念，并探讨智能合约如何开始在各个行业影响技术、社会和经济。具体来说，我们将探索\
  \ 18 个区块链用例和 12 个智能合约用例。我们以设计命令行界面为基础的去中心化微型博客平台的各个模块并将其部署在私有区块链上作为本章的结尾。\n\n学习完本章后，你将能够：\n\
  \n- 欣赏互联网货币的概念\n- 了解智能合约和区块链的各种用例\n- 理解微型博客 DApp 的构建模块\n- 探索 DApp 的安全性和管理属性\n\n\
  > “What you seek is seeking you”\n> — Rumi\n\n在开始本章之前，我想请你退一步，思考一下前面这句引言，这句话出自著名的\
  \ 13 世纪波斯逊尼派穆斯林诗人贾拉勒·阿丁·穆罕默德·鲁米之口。这句臭名昭著的六个词的引言蕴含着神秘而深刻的哲学。\n\n例如，如果你在寻找生活伴侣，那么在这个世界上就有人在寻找一个像你这样的人。\n\
  \n现在让我们举一个最简单的技术例子。我们都在网上搜索，对吧？我们通常会用 Google 搜索（从没听过有人说，让我们用 Bing 搜索，或让我们用 DuckDuckGo\
  \ 搜索，虽然这也很正常），而且这还是免费的。但在这个网络经济中，当我们免费获得某样东西时，我们必须明白我们本身就是产品。你可能会问，为谁？为广告商、市场研究人员、产品设计师——对他们来说，我们就是产品。我们点击的链接、我们查看的产品、我们进行的交易、我们喜欢的语录、我们听的歌曲——我们在网上做的几乎每一个动作都被记录下来。甚至我们在最喜欢的聊天应用中输入给朋友发送的最小的信息，然后删除以发送更正式的信息，那也被记录下来。这些信息被卖给公司、数据巨头和产品制造商，他们得以窥见我们真正私密的心理。他们利用我们的心理作为产品来创造产品或这些产品的广告，而我们最终会点击它们并为搜索引擎公司创造收入。所以，我们在网上寻求得越多，它就越寻求我们。\n\
  \n对于一个注重隐私的人来说，这无疑令人担忧。我们脑中会自然产生一个显而易见的问题，*\"为什么我的个性会让别人而不是我自己获利？\"* 当然，我们从平台那里获得了服务，但这不应该以牺牲我们的个性和隐私为代价。这正是去中心化和去中心化应用的种子萌芽的想法，在那里我们的个性是我们自己的责任，没有中间人/机器应该在未经我们明确许可的情况下从中获利。\n\
  \n寻求爱情和知识是可以的，但我们内心还有一个更大的怪物需要喂养。那就是渴望被认可、渴望在社会中受人尊重、渴望成为有权势和掌控我们所处社会内部运作的人。 somehow，在人类文明的世代传承中，寻求和赚取金钱给我们带来了这种认可。虽然另外两种，知识和爱情，可以积累并提供更多认可，但大多数普通人觉得金钱可以在我们有生之年带来名声。因此我们与银行的共生关系开始了，因为某种程度上它让我们相信我们的钱在它们那里是安全的，如果我们长期存放，还会增值。然后出现了股市，一种合法化且受监管的赌博，有时可以使我们的钱翻倍，前提是我们愿意冒一切风险。然后出现了衍生品、债券、期货，以及法规和合规；金融警察会保护我们免受众多诱人却有风险的诱惑的侵害。\n\
  \n但在 2008 年 9 月 15 日这个不幸的日子，当一家拥有 150 年历史的投资银行雷曼兄弟申请破产时，全世界都意识到银行并不像它们声称的那样安全。然而，人们仍然需要钱，银行必须继续存在。2009\
  \ 年 1 月 3 日，一个匿名实体中本聪引入了比特币的概念，这引发了普通民众与所谓受监管金融机构之间的权力斗争。\n\n这些金融机构最初认为，如果只是忽视这场革命，这场加密经济很快就会自然死亡。像乌龟缩回壳中一样，金融世界开始忽视这场正在进行的革命。但加密货币在过去八年中不断发展。区块链技术不仅将货币带到了互联网，而且智能合约的引入使货币变得可编程。\n\
  \n我们对金钱的寻求把我们带到了一个新范式，互联网货币。在这里，金钱不仅仅是交换媒介，也是表达媒介。在上一章中，我们讨论了 ICO，它本质上是将人类思想转化为加密货币代币。我们正处于一个技术十字路口，金钱正在寻求我们。它通过将我们的想法转变为人们可以购买的代币来寻求我们。如果我们的想法取得成功，我们的代币也会成功。\n\
  \n互联网货币中这种新获得的自由，缺乏任何广泛接受的框架或指导，导致了科技行业非常动荡的局面。可编程货币并不等同于某个新的网络应用或软件。区块链上不可变性的概念本身就使互联网货币的设计成为企业架构师的噩梦。他们不能再像数据科学家或软件开发者那样思考。他们必须更像固件开发者或建筑工人那样思考。这就像为活人打造定制住宅。我们可以在平面规划阶段提出任何想要的更改，但一旦批准并建成房屋后，在不更改原始平面图的情况下修改一个房间就极其困难。\n\
  \n同样，如果原始平面图存在一些薄弱点和脆弱的盲点，小偷就可以闯入并偷走所有贵重物品，就像我们在以太坊 DAO 和 Parity 黑客事件中所看到的那样。对于这项技术，我们需要退一步，鼓励单体架构，而非模块化架构，因为前者更紧凑，对黑客攻击的脆弱性更小：\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_267_0.png)\n\n图 9.1：区块链用例\n\n\n\n\n\n\
  ## 银行与支付\n\n区块链将以互联网颠覆媒体行业的方式颠覆银行业。它正在摧毁因国界而产生的监管和合规问题，因为比特币和以太坊等加密货币能够在几秒钟内完成跨境交易，且转账费用大幅降低。这将发达国家的投资者与发展中国家的创新者连接起来。巴克莱等银行正在实施区块链以加强其运营能力。银行也在为基于区块链的初创企业提供种子资金并进行投资。\n\
  \n## 保险\n\n全球保险市场建立在信任之上。区块链是管理信任的一种新方式。它可用于验证被保险人的身份，并使用 oraclize 等框架与实时数据交互，在赔付期间对保额进行调整。用于汽车和农作物保险的智能合约在确定赔付方面可以发挥强大作用，而无需任何显著的人为干预。\n\
  \nFizzy.axa 是法国保险巨头 AXA 推出的基于以太坊的保险产品。这些是智能合约，可在航班延误超过两小时时自动触发赔付。\n\n## 预测与预测市场\n\
  \n区块链即将革新预测行业。我们可以使用智能合约下注，中奖金额将自动转入我们的账户。任何具有挑战性的事件，如选举结果、超级碗比赛结果和世界杯决赛选手预测，都可以转化为一种自动化且合法化的赌博游戏。\n\
  \nApp.Augur.net 是一个基于以太坊的预测市场平台，我们可以在此下注并以以太币进行货币交易。它是完全去中心化的。\n\n## 慈善\n\n由于中间人和托管的低效而导致的腐败是慈善领域常见的难题。这些问题阻碍了资金到达真正需要的人手中。区块链通过提供捐赠追踪功能来颠覆慈善领域，确保我们的资金到达正确的人手中。\n\
  \n在以太坊生态系统中，giveth.io 引入了一种名为流动承诺的概念，本质上是一个智能合约，可以直接将以太币资金转移给某人，或通过自动化代理承诺转移资金，并在分布式账本上进行透明追踪。每当资金被移动时，捐赠者都会收到通知并可以否决任何操作。\n\
  \n它还提供了一个平台来发展去中心化的利他主义社区，可以将资金分配给活动并追踪捐赠是否实现了预定义目标。\n\n其源代码和开发状态可在以下 GitHub 链接进行追踪：`https://github.com/Giveth`。\n\
  \n## 公共福利\n\n区块链是透明分配社会福利资金的良好框架。养老金、军队福利、奖学金和失业救济金可以在不遭受缓慢、腐败和官僚主义的情况下进行发放。\n\n\
  GovCoin Systems Limited 已与巴克莱银行和伦敦大学学院合作，利用区块链和智能合约开发社会福利分配系统，该系统将由英国政府就业与养老金部进行试点。\n\
  \n## 能源管理\n\n电网和公用事业行业高度集中化。要购买天然气、燃料和电力，我们必须通过公共电网或授权的私人公司。即使是生产商也必须通过高度监管的渠道出售基本公用事业。区块链也可以通过引入点对点公用事业共享框架来打破这种垄断。\n\
  \n德国电力公司 RWE 已与基于以太坊的区块链初创公司 Slock.it 合作，开发用于电动汽车的去中心化汽车充电站。\n\n## 艺术与音乐\n\n非法艺术拍卖和音乐盗版一直是娱乐行业的挑战。加上经纪人和唱片公司的佣金，艺术家被窃取的资金比例相当严重。区块链提供了一个透明的系统，可直接从消费者向艺术家付款，并使用唯一签名存储艺术品的身份。\n\
  \nMaecenas 是一个开放的区块链平台，用于以去中心化的方式访问和拍卖美术作品。Mycelia 是一个在线音乐平台，可直接从消费者向艺术家付款。\n\n\
  ## 零售\n\n当我们从 Spencers 或食品集市购买每月必需品时，我们信任零售系统会向商品的实际生产者付款。区块链可以在没有中间实体的情况下连接生产者与消费者。这可能导致零售价格大幅下降。\n\
  \nhttps://www.openbazaar.org/ 是一个基于比特币、区块链的在线点对点商店，允许每个人开设自己的 eShop 并在没有任何中间实体佣金的情况下销售产品。该平台接受比特币交易。\n\
  \n## 房地产\n\n买卖房地产可能涉及缺乏透明度、官僚主义、公共记录错误和欺诈。区块链可以减少基于纸质的记录保存并加快交易速度。\n\n智能合约可以帮助自动化追踪、转让产权、验证所有权并确保文件准确性。\n\
  \n印度安得拉邦州政府已与瑞典初创公司 ChromaWay 合作，构建基于区块链的土地登记解决方案。据估计，印度各地支付给土地登记员的贿赂总额达 7 亿美元。\n\
  \n## 网络安全\n\n网络安全与区块链具有共生关系。两者都需要彼此成长并相互颠覆。区块链的基本基础建立在密码学哈希函数之上，而区块链仍处于起步阶段，因此网络安全至关重要。\n\
  \n量子计算是对现代非对称密码学的真正威胁。Iota.org 是一种下一代、基于图谱的分布式账本技术，声称可以克服这一量子威胁并增强 DLT 的安全性。\n\n\
  ## 群众募资\n\n区块链通过引入首次代币发行概念将众筹提升到全新水平。正如我们在引言和前一章中所讨论的，我们在建立一个具有适当审计的共识监管的 ICO 框架方面还有很长的路要走。目前，ICO\
  \ 领域可以被视为加密股权代币的“狂野西部”情况。\n\n## 网络与物联网\n\n区块链可以实现机器之间无需人工干预的通信和微支付。机器经济是一个新兴领域，将在推动自动化创新方面发挥关键作用。\n\
  \nProject Oaken 是一个获奖的、基于以太坊的智能合约项目，利用物联网为自动驾驶和手动汽车支付自动过路费给收费站。该原型使用特斯拉成功测试，并在迪拜区块链黑客松中赢得\
  \ 10 万美元。目前，Oaken Innovations 已与丰田研究和麻省理工学院媒体实验室合作，研究此类原型以实现自主驾驶未来。\n\n## 投票\n\n\
  > “人民知道有选举就足够了。投票的人决定不了任何事。计票的人决定一切。”\n> \n> - 约瑟夫·斯大林\n\n根据《哈佛商业评论》，数据科学家可能是最性感的工作，但它在预测\
  \ 2016 年美国大选方面惨遭失败。操纵投票系统可能是为了转移对主要数据科学失败的注意力而提出的阴谋论，但也不能完全排除。区块链技术由于其不可变性，可以为此类民主进程带来奇迹。\n\
  \nhttps://www.democracy.earth/ 和 https://followmyvote.com/ 是由风险投资公司资助的基于区块链的投票应用。它们也有计划和路线图在不久的将来纳入智能合约。\n\
  \n\n\n\n\n## 政府\n\n政府系统往往容易滋生腐败、效率低下且不够透明。实施基于区块链的系统可以显著提高安全性、透明度和效率，通过减少政府运作中的官僚开支。\n\
  \n爱沙尼亚正计划开设加密银行。迪拜的目标是到2020年将政府文件上传到区块链上。\n\n## 私人交通与拼车\n\n事实上，Uber 和 Ola 已经颠覆了出租车和公共交通行业。区块链可以通过提供去中心化的点对点共享模式，将这一进程再推进一步。这将帮助司机群体在没有不必要的中介佣金的情况下赚取更多收入。\n\
  \nOaken Innovations 和 MIT Media Lab 已与丰田合作开展另一个关于收费的项目，用于开发点对点拼车 DApp。位于以色列特拉维夫的\
  \ Lazooz.org 已推出一个由社区拥有的去中心化交通系统，并提供拼车服务。\n\n## 云存储\n\n区块链允许云存储被加密且高度分散，使其对攻击更具鲁棒性。集中式服务器上的数据容易受到数据丢失、黑客攻击和人为错误的影响。\n\
  \nStorj.io 是一个使用区块链的加密云存储网络。但存储和检索的定价仍然是一个挑战。Swarm 和 IPFS 也有潜力在费用结构最低的情况下发展成成熟的云存储。\n\
  \n## 医疗保健\n\n区块链等技术对于健康记录行业来说可能是一大福音，可用于防篡改的个人健康记录，而这一领域在很大程度上依赖政府机构和传统存储系统。它可以让公众有能力对抗无意义的政治操弄。账本向公众开放，包含匿名的患者数据，从入院到出院全程记录。不允许任何修改，不允许任何篡改。\n\
  \nMedRec 就是这样一个在 MIT Media Lab 内孵化的项目，它开发了一个基于以太坊私有链的医疗记录原型系统。这个去中心化应用可以将患者记录与外部数据源连接起来，例如\
  \ Fitbit（使用物联网的实时身体活动追踪应用）和 23andMe（通过唾液样本进行 DNA 性状检测的应用）。MedRec 还允许患者安全地授权不同的医生、医疗服务提供者、研究人员，甚至患者的子孙后代访问他们的个人健康信息。\n\
  \n## 智能合约用例\n\n在本节中，我们将讨论智能合约作为一种技术如何颠覆社会及其经济的方方面面。\n\n图9.2展示了智能合约的12个用例：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_286_0.png)\n\
  \n图9.2：智能合约用例\n\n### 保险\n\n大多数保险流程本质上是分离的，且涉及许多人工干预。智能合约与物联网相结合，可以做出具有自我意识的决策，实现自动化保险赔付。\n\
  \n通过减少验证报告和保单中的重复工作，它增加了节省。\n\n### 贸易金融\n\n智能合约促进了更快的信用证和付款发起，从而简化了国际转账。这提高了资产的流动性，提高了创建合同协议的效率，并促进了更快的付款审批。\n\
  \n### 衍生品\n\n智能合约通过简化交易后流程，消除了交易生命周期中的重复过程。它支持头寸的实时估值、自动化外部事件处理以及自动化结算义务，同时处理触发的交易事件。\n\
  \n### 证券\n\n智能合约可以促进自动化的股息支付、股票分割和负债管理。\n\n它还通过绕开中介机构和管理资本化来降低运营风险。\n\n由于证券基于分布式账本，它提供了数字化、透明且可追溯的端到端工作流程。\n\
  \n### 账户\n\n使用智能合约进行去中心化的财务记录可以提高透明度和数据完整性，从而带来市场稳定。由于金融数据的可访问性增强，对资本金额的洞察力也得到了改善。\n\
  \n### 数字身份\n\n智能合约可以使个人控制并拥有自己的数字身份。然后，每个人都可以选择将哪些个人数据作为 KYC 信息暴露给第三方。\n\n这将降低交易对手方的数据泄露，并提高合规性和互操作性。\n\
  \n### 记录保持\n\n自动合规、自动续约、自动释放和自动化商业代码备案是智能合约的一些主要优势。\n\n这反过来又可以减少法律费用，跟踪贷款和抵押品价值，并自动归档。\n\
  \n### 贷款和抵押贷款\n\n目前，抵押贷款是一个非常混乱且需要人工操作的过程。智能合约可以通过连接抵押交易中的不同参与方来使这一过程自动化，从而减少出错的可能性。\n\
  \n它提高了服务记录的可见性，并在抵押财产还清后自动释放对该财产的控制权。\n\n### 法律\n\n使用智能合约，诸如财产转让之类的法律服务可以做到无欺诈且无缝。交易高效且透明。审计和保证成本也得以降低。\n\
  \n### 供应链\n\n智能合约简化了复杂的多方交付系统，并在产品跟踪方面实现了精细化；可追溯性和验证得到增强，从而减少了欺诈和盗窃。预言机在供应链中扮演着重要角色，为智能合约提供外部数据。\n\
  \n### 临床试验\n\n智能合约提高了跨机构的可见性，打破了地理边界，这可以为临床试验带来巨大好处。它能够对患者数据进行同意跟踪，提高数据隐私性，简化试验流程，并通过提高独立研究人员对试验结果的可复现性来优化试验设置。\n\
  \n### 绝症研究\n\n癌症等绝症在协作研究方面有其自身的挑战，原因在于数据隐私问题和激励不一致。智能合约可以通过在许多部门之间提供高效数据共享来释放数据的力量，同时保护患者隐私。它还有助于实时可见性和政策执行，同时满足监管要求和患者同意。\n\
  \n## 去中心化微博\n\n在本节中，我们将探讨一个基于以太坊的基础微博平台的设计。使用这些平台，新用户可以注册获得个人微博账户，他们可以用该账户在去中心化的以太坊私有链上发布匿名推文，默认情况下禁用评论。\n\
  \n但为什么我们需要去中心化的区块链来发推文，更重要的是为什么用户是匿名的？要回答这个问题，我们需要了解正常集中式微博平台的行政和安全约束，我们将在下一节中讨论。\n\
  \n### 行政与安全约束\n\n流行的微博平台，如 Twitter、Tumblr 和微博（中国的微博变体，由新浪和腾讯主导），本质上都是集中式社交网络服务，容易出现问题。\n\
  \n这些问题主要存在于两个不同的维度。一个是技术性的，另一个是社会性的。在技术维度上，这类服务的迅速普及导致基础设施管理成本不断增加。这在生产环境中进行可扩展性部署时引发了许多行政问题。\n\
  \n例如，最近美国总统特朗普的 Twitter 账号 @POTUS 由于技术故障自动屏蔽了许多关注者。这类故障可能相当严重，因为自动化交易机器人会不断监控推文情绪，并决定全球证券交易所的各种股票价格，这可能导致市值在眨眼间蒸发数十亿美元。\n\
  \n在社会维度上，我们看到针对合法微博账户的网络喷子和在线虐待行为在增长。曾有案例显示，人们因为自己的种族、性别或宗教而失业、政治家被迫辞职、名人被罚款。\n\n\
  即使在我们的生活中，如果我们的直接上司或人力资源部门的人在关注我们的微博账号，我们也会感到在公开场合发微博有很大的压力。因此，在社会维度上，个人自由和安全成为一个重大问题。\n\
  \n去中心化微博平台可以通过提供一个去中心化的平台以及\n\n\n\nanonymity respectively. However, it is important\
  \ to note that anonymity is a choice rather than a mandate while using decentralized\
  \ technologies like a blockchain. In simple terms, using a blockchain does not make\
  \ us anonymous automatically; rather, it is an add-on feature that needs to be separately\
  \ implemented on top of a blockchain.\n\nThe idea of this decentralized platform\
  \ under discussion was originally conceived by a software developer named **Jahn\
  \ Bertsch**. The entire functional logic was implemented in the Solidity programming\
  \ language. It has two main smart contracts. An account related smart contract (`TwtAccount.sol`)\
  \ and a user-registration related smart contract (`TwtRegistry.sol`). When these\
  \ two smart contracts are deployed on the private blockchain, they interact with\
  \ each other to form a command-line interface-based, decentralized, microblogging\
  \ platform.\n\nIn the subsequent sections, we will dive into the individual Solidity\
  \ file, set up the service on the private blockchain, and check how these smart\
  \ contracts perform in CLI and remix browser mode.\n\n## TwtAccount.sol\n\nThis\
  \ solidity file models a single Twitter account on a blockchain. *Figure 9.3* summarizes\
  \ the important functions present in this twitter account contract:\n\n```\ncontract\
  \ TwtAccount{\n\n    function TwtAccount()\n\n    function getOwnerAddress() constant\
  \ returns(address adminAddress)\n    function adminDeleteAccount()\n    function\
  \ adminRetrieveDonations(address receiver)\n\n    function getLatestTweet() constant\n\
  \    returns(string tweetString,uint256 timestamp,uint256 numberOfTweets)\n\n  \
  \  function isAdmin() constant returns(bool isAdmin)\n\n    function getTweet(uint256\
  \ tweetId) constant\n    returns(string tweetString,uint256 timestamp)\n\n    function\
  \ getNumberOfTweets() constant returns(uint256 numberOfTweets)\n    function tweet(string\
  \ tweetString) constant returns(int256 result)\n}\n```\n\nFigure 9.3: TwtAccount\
  \ contract summary\n\nNow, let us understand explicitly what each function in this\
  \ smart contract does. *Figure 9.4* denotes the start of the account contract where\
  \ `TwtAccount()` is a constructor function. Tweet denotes the data structure of\
  \ a single tweet. The mapping denotes an array of all tweets to a particular tweet,\
  \ account, which helps in retrieving each tweet by their `tweetID`. The other two\
  \ variables denote the owner of the account and the total count of tweets by the\
  \ particular owner:\n\n```\npragma solidity ^0.4.0;\ncontract TwtAccount {\n\n \
  \   struct Tweet {\n        uint timestamp;\n        string tweetString;\n    }\n\
  \    mapping (uint => Tweet) _tweets;\n    uint _numberOfTweets;\n    address _adminAddress;\n\
  \n    function TwtAccount() {\n        _numberOfTweets = 0;\n        _adminAddress\
  \ = msg.sender;\n    }\n}\n```\n\n```\nfunction getTweet(uint tweetId) constant\
  \ returns (string tweetString, uint timestamp) {\n    // returns two values\n  \
  \  tweetString = _tweets[tweetId].tweetString;\n    timestamp = _tweets[tweetId].timestamp;\n\
  }\n\nfunction getLatestTweet() constant returns (string tweetString, uint timestamp,\
  \ uint numberOfTweets)\n{\n    // returns three values\n    tweetString = _tweets[_numberOfTweets\
  \ - 1].tweetString;\n    timestamp = _tweets[_numberOfTweets - 1].timestamp;\n \
  \   numberOfTweets = _numberOfTweets;\n}\n```\n\nFigure 9.7: Important tweet retrieval\
  \ functions\n\nThe following Figure 9.8 summarizes the remaining functions of the\
  \ account contract. getNumberOfTweets() returns the count of tweets by the account\
  \ owner. getOwnerAddress() returns the account owner's blockchain address. The function\
  \ adminRetrieveDonations() can be further developed to allow the account owner to\
  \ retrieve any donations they have received from other users. So, this contract\
  \ can then behave as a donation wallet that can tweet messages. We have muted this\
  \ functionality to keep the contract simple. The function adminDeleteAccount() kills\
  \ his tweeter account and retrieves all donations received:\n\n```\nfunction getNumberOfTweets()\
  \ constant returns (uint numberOfTweets) {\n    return _numberOfTweets;\n}\n\nfunction\
  \ getOwnerAddress() constant returns (address adminAddress) {\n    return _adminAddress;\n\
  }\n\nfunction adminRetrieveDonations(address receiver) {\n    if (isAdmin()) {\n\
  \        receiver.transfer(this.balance);\n    }\n}\n\nfunction adminDeleteAccount()\
  \ {\n    if (isAdmin()) {\n        selfdestruct(_adminAddress);\n    }\n}\n```\n\
  \nFigure 9.8: Miscellaneous functions\n\nBut to have a new tweeter account, we need\
  \ user registration. This action is achieved by the TwtRegistry smart contract that\
  \ is described in the next section.\n\n## TwtRegistry.sol\n\nThis contract is used\
  \ to register a new user with a tweeter account. Figure 9.9 summarizes the functions\
  \ available in this registry contract:\n\n```\ncontract TwtRegistry{\nfunction TwtRegistry()\n\
  function adminUnregister(string name)\nfunction register(string name,address accountAddress)returns(int256\
  \ result)\nfunction getNumberOfAccounts()constant returns(uint256 numberOfAccounts)\n\
  function adminRetrieveDonations()\nfunction getAddressOfName(string name)constant\
  \ returns(address addr)\nfunction adminDeleteRegistry()\nfunction adminSetAccountAdministrator(address\
  \ accountAdmin)\nfunction adminSetRegistrationDisabled(bool registrationDisabled)\n\
  function getNameOfAddress(address addr)constant returns(string name)\nfunction unregister()returns(string\
  \ unregisteredAccountName)\nfunction getAddressOfId(uint256 id)constant returns(address\
  \ addr)\n}\n```\n\nFigure 9.9: TwtRegistry contract summary\n\nSimilar to an account\
  \ contract, TwtRegistry() is a constructor function, and different variables and\
  \ mappings have been used to see the number of users, force them to use a newer\
  \ version of registration updates, and administrate accounts using bool _registrationDisabled\
  \ as shown in Figure 9.10:\n\n```\npragma solidity ^0.4.0;\ncontract TwtRegistry\
  \ {\n    mapping (address => string) _addressToAccountName;\n    mapping (uint =>\
  \ address) _accountIdToAccountAddress;\n    mapping (string => address) _accountNameToAddress;\n\
  \    uint _numberOfAccounts;\n    address _registryAdmin;\n    address _accountAdmin;\n\
  \    bool _registrationDisabled;\n    function TwtRegistry() {\n        _registryAdmin\
  \ = msg.sender;\n        _accountAdmin = msg.sender;\n        _numberOfAccounts\
  \ = 0;\n        _registrationDisabled = false;\n    }\n```\n\nFigure 9.10: Constructor,\
  \ variables, and mapping\n\nThe register() function, as shown in Figure 9.11, is\
  \ used to create new\n\n```\nfunction unregister() returns (string unregisteredAccountName)\
  \ {\n    unregisteredAccountName = _addressToAccountName[msg.sender];\n    _addressToAccountName[msg.sender]\
  \ = \"\";\n    _accountNameToAddress[unregisteredAccountName] = address(0);\n  \
  \  // _accountIdToAccountAddress is never deleted on purpose\n}\n\nfunction adminUnregister(string\
  \ name) {\n    if (msg.sender == _registryAdmin || msg.sender == _accountAdmin)\
  \ {\n        address addr = _accountNameToAddress[name];\n        _addressToAccountName[addr]\
  \ = \"\";\n        _accountNameToAddress[name] = address(0);\n        // _accountIdToAccountAddress\
  \ is never deleted on purpose\n    }\n}\n\nfunction adminSetRegistrationDisabled(bool\
  \ registrationDisabled) {\n    // currently, the code of the registry can not be\
  \ updated once it is\n    // deployed. if a newer version of the registry is available,\
  \ account\n    // registration can be disabled\n    if (msg.sender == _registryAdmin)\
  \ {\n        _registrationDisabled = registrationDisabled;\n    }\n}\n```\n\nFigure\
  \ 9.13: Registration related functions\n\nLastly, we have the miscellaneous functions\
  \ similar to those discussed in the accounts smart contracts, as shown in Figure\
  \ 9.14:\n\n```\nfunction adminSetAccountAdministrator(address accountAdmin) {\n\
  \    if (msg.sender == _registryAdmin) {\n        _accountAdmin = accountAdmin;\n\
  \    }\n}\n\nfunction adminRetrieveDonations() {\n    if (msg.sender == _registryAdmin)\
  \ {\n        _registryAdmin.transfer(this.balance);\n    }\n}\n\nfunction adminDeleteRegistry()\
  \ {\n    if (msg.sender == _registryAdmin) {\n        selfdestruct(_registryAdmin);\n\
  \    }\n}\n```\n\nFigure 9.14: Misc functions of TwtRegistry contract\n\n\n\n\n\n\
  ## 私有区块链上的服务设置\n\n在我们的私有区块链上设置推文服务非常简单。首先，我们需要在项目文件夹中使用 geth 命令行启动我们的 **进程间通信 (IPC)**，如\
