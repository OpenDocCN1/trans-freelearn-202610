  ## Swarm


  到目前为止，我们一直将 Swarm、Whisper 和 EVM 这三个模块视为黑盒，只关心它们之间如何交互，而不关心其内部的真实工作方式。然而，为了给智能合约开发打下坚实的基础——我们最终将在*第3章，以太坊智能合约的Hello
  World*中对其进行定义并展开讨论——我们需要了解这些模块最基本的内部运作机制。这将帮助我们调整智能合约代码，使其在以太坊区块链上运行时获得更好的性能。


  那么，我们如何衡量代码的性能呢？遗憾的是，答案并不简单，而是要沿着多个维度进行评估。性能是围绕资源消耗来衡量的，而代码会消耗多种资源。超过某个程度后，就需要在各种资源之间进行权衡取舍。为了在现实世界中让代码真正高性能，我们会多消耗一种资源，少消耗另一种资源。


  现在让我们来看衡量代码性能的三个重要资源，它们是：时间、空间和网络。时间资源是指代码在给定输入上完整处理一组操作并生成输出所需的运行时间。


  > > 请注意，这不是以秒或分钟来衡量的，而是以输入的数量来衡量，也就是所谓的 **大O记号 O( )**。例如，如果一段代码对1个输入运行1秒，对2个输入运行2秒，对100个输入运行100秒，那么这段代码在时间上就是线性性能的，即时间复杂度为
  O(n)。空间资源，也叫**存储**，是指代码在执行期间占用多少内存或磁盘空间。换句话说，就是代码为执行计算需要多少额外空间。网络资源，也叫**带宽**，是指代码


  *在执行过程中通过网络传输的数据量。*


  Swarm 的主要目标是让 DApp 能够高效地共享数据的存储和带宽资源，从而为终端用户提供必要的服务。这是通过 Swarm 中实现的三个关键思想来完成的：


  +   - **数据块：** 这是 Swarm 中存储和检索的基本单元，最大大小为 4 KB

  +   - **哈希：** 这是数据块的加密哈希，具有唯一的标识符和地址

  +   - **清单：** 这是用于检索哈希内容的路径指定器


  当任何数据块（称为内容）上传到 Swarm 时，它会被切分成若干称为**数据块**的数据片段。每个数据块都会生成一个单向的 Swarm 哈希，并带有用于访问的标识符和地址。这些哈希地址本质上是不可变的。简单来说，修改内容会改变每个数据块的哈希地址。这些数据块的哈希本身又被捆绑到另一个数据块中，而该数据块又有自己的哈希。通过这种方式，内容被映射到一个数据块树，这基本上就是一个
  Merkle 树。即使是大型内容文件（如流媒体视频），分层的 Swarm 哈希也能防止任何数据完整性损失，并允许受保护的随机访问。


  要访问 Swarm 内容，我们需要清单。该文件描述了文档集合。文档可以是文件系统目录、虚拟服务器或数据库索引。清单就像一本书的目录，给出了内容是什么以及在哪里找到内容的要点。它是一种元数据，通过指定路径和对应的内容哈希，允许基于**统一资源定位符（URL）**的内容检索。


  Swarm 节点地址定义了与数据相同的地址空间中的位置。参与网络的 Swarm 节点有自己的基础地址，称为 **bzzkey**。这个 bzzkey 基本上是以太坊地址的哈希，即所谓的节点
  Swarm 基础账户。Swarm 中没有删除或移除的概念。一旦内容被上传，我们就无法让 Swarm 撤销它。在 Swarm 发布之前，以太坊使用的是**星际文件系统（IPFS）**。


  ## Whisper


  现代黑客和监控技术已经发展到如此程度，以至于黑客甚至不需要在消息通过安全通道时截获实际消息。他们只需研究消息的影子就能猜出消息携带的信息。所谓消息的影子，指的是消息在通过通道传输时留下的元数据日志和审计跟踪。


  为了更好地理解这类攻击，想象一下你住在一个租金很高的大城市。于是你在市中心找到一位老房东，他愿意以你预算内的价格租给你一间房间。唯一的问题是铁轨离你的墙太近了。每天晚上，任何火车经过时，你都能感觉到摇摇晃晃的床在震动。如果你是一个敏锐的观察者，并且像黑客一样思考，那么你只需要知道特定的火车经过时你那吱嘎作响的床震颤了多长时间，就能轻松熟悉每晚经过的每种火车。床震颤的时间段就成了特定火车的签名。你甚至可能以一定的准确度预测出，某个时间点经过的火车与昨晚经过的是同一列还是不同的，只需观察这个签名特征。如果铁路公司意识到了这一点，用厚重的混凝土隧道封闭轨道周围，吸收火车带来的所有冲击和震动呢？到那时你还能识别出签名吗？想想看，因为光在受阻时会被揭示出影子，而黑暗不会。


  当 Gavin Wood 在他的 GitHub 白皮书（[https://goo.gl/bR5bZ](https://goo.gl/bR5bZ)）中为 Whisper
  制定作为点对点通信协议的规范时，他设计了密码学领域最有趣的技术之一。以相当大的带宽和延迟成本为代价，Whisper 能够提供 100% 的黑暗操作。所谓完全黑暗操作，是指点对点通信期间元数据零泄漏。


  从技术定义上讲，Whisper 是一个具有多**分布式哈希表（DHT）**的消息系统，路由隐私作为以太坊区块链的伴随协议。任何正常的通信协议都有一个基本目标：最大化带宽并最小化延迟。然而，Whisper
  作为通信协议只有一个目标：消除元数据泄漏，实现真正的黑暗，使两个对等方通信时没有任何第三方能够窃听。为此，Whisper 愿意放弃带宽和延迟方面的约束。Whisper
  以用户可配置的方式运行，涉及通信节点愿意泄漏多少关于去中心化应用内容的信息，而这些内容最终会追踪用户活动。


  Whisper 基于两个关键概念：消息和信封。如果将 Whisper 视为数据报消息服务，那么信封代表一种未加密的数据格式，节点可以理解，其内部携带加密的消息数据报。信封包含原始的**生存时间（TTL**，以秒为单位）、绝对到期时间（UNIX
  系统时间）、加密的消息数据字段（即实际有效载荷）、主题（加密安全、概率性的消息部分分类）以及随机数 nonce。这个 nonce 用于工作量证明（PoW），以判断对等方的努力程度。消息具有一个用于签名的二进制标志，并带有不固定的有效载荷。


  *图2.9 进一步说明了这两个概念：*


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_77_0.png)


  图2.9：信封内的 Whisper 消息


  ## EVM


  EVM 是一个基于栈的解释器，拥有内存字节数组和键值存储。为了形象地理解栈，让我们回到早午餐自助餐的类比，想想干净的盘子是如何一个叠一个放置的。


  图2.10 展示了这样一个栈，作为后进先出（LIFO）过程，并带有 pop 和 push 等关键操作：


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_78_0.png)


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_78_1.png)


  图2.10：简而言之的栈操作


  EVM 栈上的元素长度为 32 字节，所有键值存储也都是 32 字节。以高级语言编写的智能合约通过 EVM 在区块链上运行，EVM 在运行时生成机器级操作码（opcodes）。这些操作码具有




  EVM 设计为允许不受信任的代码在基于全球公共区块链的操作系统上运行。


  为了实现这一点，施加了以下安全限制：


  -   程序执行的每一步计算都必须预先付费，这反过来可以防止拒绝服务攻击。

  -   程序只能通过传输单个任意长度的字节数组相互交互。程序无法访问彼此的执行状态。

  -   程序执行是隔离的。虚拟机程序只能访问和修改其自身内部状态，并且可以在 EVM 上触发其他程序的执行。

  -   代码执行本质上是完全确定性的，并且对于任何符合规范的实现，只要初始状态相同，就会产生相同的状态转换。


  EVM 代码的形式化执行模型出奇地简单。在 EVM 运行期间，其完整的计算状态可以由元组 (block_state, message, code, memory,
  transaction, stack, gas, and pc) 定义，其中 block_state 是全局状态，包含所有具有余额和存储的账户。


  在每次执行轮次开始时，当前指令是通过获取程序计数器 (pc) 处的代码字节找到的，并且每个指令都有自己的定义，说明它如何影响该元组。


  例如，ADD 操作会从栈顶弹出两项并将它们的和压入栈，减少 1 的 gas，并将 pc 增加 1；而 SSTORE 则从栈中弹出前两项，并将第二项插入到合约的存储中，索引为第一项。即使有许多方法可以通过即时编译来优化
  EVM 执行，一个基本的以太坊实现也可以用几百行代码完成。


  ## 硬件客户端和互联网


  在我们结束对 Swarm、Whisper 和 EVM 的底层介绍之后，让我们继续介绍以太坊技术栈的剩余要素，即硬件客户端和互联网。硬件客户端将在以太坊挖矿部分中更详细地介绍。目前，知道像
  CPU 和 GPU 这样的普通商品硬件被用作以太坊的硬件客户端就足够了。


  现在让我们讨论以太坊技术栈的互联网层，这基本上就是以太坊区块链。正如我们在第 1 章《区块链基础》中已经讨论过以太坊的区块链结构一样，这里我们只介绍以太坊区块链在表层网络上的逻辑位置。


  我们将在本章后面讨论以太坊区块架构时重新审视区块链结构。


  我们所知的互联网主要是表层网络。还有深网和暗网，我们将在后面的章节中讨论。表层网络由许多逻辑层组成，消息或数据必须通过这些层才能从 A 点到达 B 点，而 A
  点和 B 点在地理和物理上可能是分离的。每个逻辑层都有某种标准协议，正在传输的消息必须遵循，否则将被禁止在网络上传输。这些协议就像个人从一个国家旅行到另一个国家时需要遵守的护照和签证规则。互联网工程任务组
  (IETF) 是一个开放社区，以完全自愿的方式推荐表层网络上的共同通信基础，通过提出传输控制协议/互联网协议套件。


