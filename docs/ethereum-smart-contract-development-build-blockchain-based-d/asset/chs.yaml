  图10.10：获取个人资料模块\n\n一旦整个合约编译完成，Remix 的输出结果如图10.11所示：\n\n图10.11：cvContract\n\n上述截图中的蓝色图标用于获取数据，粉色图标用于输入数据。\n\
  \n我们可以添加多个个人资料以及其他属性，如出版物和技能，如图10.12所示：\n\n图10.12：设置/获取技能\n\n此外，我们可以将此智能合约的代码提交到\
