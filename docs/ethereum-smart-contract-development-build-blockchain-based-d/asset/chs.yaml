  \ to 101 (similarly, we try the other operations)\n\n# Figure 3.47: Log of all the\
  \ operations executed after smart contract creation\n\n## Summary\n\n本章更像是一个以最小理论支持为主的实验练习。我们从\
  \ remix IDE 上使用网络浏览器上的一个简单的 hello world 智能合约开始。我们还探索了使用合约的增量和减量操作。然后我们进入 Solidity\
