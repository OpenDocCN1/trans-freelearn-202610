  \ Hello World 智能合约的 368 字节 [000 to 367] 机器代码\n\n## Remix in a nutshell\n\n那么，这个\
  \ remix 是什么？简单来说，它是一个基于浏览器的 **Integrated Development Environment (IDE)**，用于编写 Solidity\
  \ 智能合约。它具有集成编译器、无服务器端组件的运行时虚拟环境、集成调试器、集成测试环境和静态代码分析工具。以前，它被称为 **Browser-Solidity**。它不仅可以模拟区块链，还可以突出显示语法和错误，托管多个\
  \ Solidity 文件，并部署合约以及可见的字节码和 **application binary interface (ABI)**，其详细信息可在后面的章节中找到。\n\
  \n然而，我在本章承诺理论少而动手多。所以，让我们现在进入一个增量和减量合约。请注意，使用 geth 和 Mist 部署合约有更专业的方法，我们将在最后一节详细讨论。现在，我们将更多地集中在\
  \ Remix 上使用 Solidity 进行一些快速而粗糙的基础智能合约。\n\n### Increment and decrement operations\
  \ using Solidity\n\n*Figure 3.10* 显示了 Solidity 中增量和减量操作的代码。它还具有一个接收输入的函数，以及一个在合约执行后获取此数字的函数：\n\
  \n```\npragma solidity ^0.4.11;\n// define new contract\ncontract ArithValue{\n\
  \    uint number;\n    function ArithValue() public {  //constructor function with\
  \ default value\n        number = 100;\n    }\n    // constructor function to set\
  \ new value\n    function setNumber(uint theValue) public {\n        number = theValue;\n\
  \    }\n    // constructor function to fetch the new value\n    function fetchNumber()\
  \ public constant returns (uint) {\n        return number;\n    }\n    // constructor\
  \ function to increment by one\n    function incrementNumber() public {\n      \
  \  number=number + 1;\n    }\n    // constructor function to decrement by one\n\
  \    function decrementNumber() public {\n        number=number - 1;\n    }\n}\n\
  ```\n\nFigure 3.10: 使用 Solidity 进行增量和减量操作 (ArithValue.sol)\n\n这段代码比 hello world\
  \ 合约不是复杂一点吗？让我带你走一遍这段代码。第一行以 `pragma` 开始。正如你已经意识到的那样，它只是说明我们将使用哪个版本的 Solidity。在我们的例子中，我们使用的是版本\
  \ `0.4.11`。当我输入时，Remix IDE 支持最高到 0.4.16 的版本。\n\n为了理解 pragma，让我们回到第 2 章 *Grokking\
  \ Ethereum* 中自助餐的类比。如果我在自助餐预订时指定我是一个严格的素食主义者，我就是在提前给自助餐组织者某种指示，即我不吃肉、鱼、家禽或鸡蛋等非素食菜肴。因此，在盛大的自助餐开始时，我只会被介绍到提供素食菜肴的柜台。最明显的是，如果我被错误地端上羊肉烤肉串代替西兰花咖喱，我会感到恼火并向组织者指出。然后，我会在触碰或吃食物之前就把盘子换掉，不问任何问题。\n\
  \n以类似的方式，pragma 是一种语言构造，它向编译器提供某种指令，说明如何处理其输入。通常，预处理器处理此类语言构造并指定编译器行为。在我们的例子中，我们的指令是让编译器表现得好像它正在\
  \ Solidity 版本 0.4.11 或更低版本上运行智能合约一样。\n\n如果我们不写这一行会怎样？好吧，没有坏事发生。会抛出一个警告，如 Figure\
  \ 3.11 所示，代码编译得很好。然而，它现在使用默认的 Solidity 版本，我们的情况是 0.4.16。按类比，如果我忘记告诉他们我是素食主义者，就不能怪自助餐组织者给我羊肉烤肉串。然后，我设法吃掉给我端上的食物，通过避免非素食部分来避免进一步的尴尬。\n\
