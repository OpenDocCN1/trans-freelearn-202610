  \ 时可以做些什么。\n\n## 在 GitHub 上提交 issue\n\n当你遇到代码 bug 时，在 GitHub 上提交任何 issue 之前，请先查阅以太坊的文档，这些文档可以通过任何搜索引擎免费获取。然后，在以太坊的\
  \ Stack Exchange 上提出相同的问题。在大多数情况下，你不会是唯一遇到该 bug 的人。因此，你的问题的解决方案可能已经在网上存在了。最后的手段才是去\
