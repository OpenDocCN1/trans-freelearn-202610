  \ MIST 浏览器中部署和执行智能合约结束了本章。\n\n在第 4 章 *A Noob's Guide to DApps and DAO* 中，我们将讨论去中心化应用和\
  \ DAO 的主题。\n"
- "## A Noob's Guide to DApps and DAO\n\n本章从开发者的角度发展我们对去中心化应用的理解。我们将介绍开发去中心化应用的高级步骤。然后我们将探索一个独特的市场\
  \ ethercast，它充当多个 DApps 的聚合器。然后我们将继续设计一个 **Decentralized Autonomous Organization\
  \ (DAO)**。我们将通过从纯技术角度回顾臭名昭著的 DAO 黑客攻击，该攻击导致 ETH/ETC 分叉，来结束本章。\n\n学习本章后，你将能够：\n\n\
  +   - Identify the generic steps to develop DApps\n+   - Understand DApp architecture\n\
  +   - Achieve basic knowledge about ethercast\n+   - Design a simple DAO from scratch\n\
  +   - Understand the DAO hack\n\n## Understanding DApps\n\n创造新生命总是让我们着迷，尤其是当我们参与其中时。例如，考虑一个合子细胞。它比一粒细沙还小，却有能力成长为一个复杂的生物实体，为新生婴儿注入生命。\n\
  \n但为什么我们在谈论合子而不是 DApps 呢？好吧，合子标志着一个生物细胞世代结束和下一个世代开始的那个关头。它适应，响应外部世界而没有任何基因变化。合子无法被调节，因为它被困在自己的基因中。它只能递归地生长。合子也是自主的。这是因为它仍然是一个细胞；它的形成在裂解阶段迅速分布，并且被授权作为一个单一实体行事，独立于其他细胞。事实上，合子是去中心化应用的完美隐喻。\n\
  \n一个应用如果满足以下四个标准，则被归类为 DApp（发音为 Dee App，类似于 e-book）：\n\n+   - 应用必须是开源的，即源代码可自由向公众提供。此外，应用必须自主运行，没有主要实体控制其代币，即应用的协议将完全由用户共识进行监管。\n\
  +   - 应用必须没有单点故障，所有数据和操作日志都以加密方式存储在公共区块链中。\n+   - 应用必须使用某种类型的原生代币用于各种\n\n\n流程与访问，任何有价值的贡献都必须以这类代币作为奖励。\n\
  \n- 应用应使用某种标准且被广泛接受的加密算法，作为节点贡献价值的证明来生成代币。\n\n2014 年，Factom 公司首席执行官 David Johnston\
  \ 提出了适用于 DApp 的约翰斯顿定律：\n\n> “一切可以被去中心化的事物，都将被去中心化。”\n\n从学术角度看，这条定律是墨菲定律在摩尔定律之上的一个变体。摩尔定律是适用于任何创新技术的经验法则，它指出在可预见的未来，每天发生在区块链上的条目数量每两年将翻一番。\n\
  \n墨菲定律由美国空军提出，它指出任何可能出错的事都会出错。在英国，存在一条等价的索德定律（Sod's law），它指出任何可能出错的事都会以最坏的结果出错。\n\
  \n他还基于 DApp 所在的区块链，提出了一种有趣的去中心化应用分类，分为三种类型：\n\n- **类型 I**：DApp 拥有自己的区块链。比特币是类型 I\
  \ 去中心化应用最著名的例子，但以太坊和其他“山寨币”也属于同一类型。\n- **类型 II**：DApp 使用类型 I 去中心化应用的区块链。类型 II 去中心化应用是协议，并拥有对其功能至关重要的代币。\n\
  - **类型 III**：DApp 使用类型 II 去中心化应用的协议。类型 III 去中心化应用是协议，并拥有对其功能至关重要的代币。\n\n## DApp\
  \ 的架构\n\n*图 4.1 从高层展示了一个以太坊 DApp。如果你留意一下，会发现每个客户端浏览器都与其应用实例通信。不存在所有客户端都连接的中央服务器。这意味着，每个想要与去中心化应用交互的人，都需要在自己的电脑/手机等设备上运行一份完整的区块链副本。也就是说，在我们可以使用应用之前，必须先下载整个区块链，然后才能开始使用。这乍听起来可能有些荒谬，但它的优点是不依赖单一中央服务器——这种服务器明天可能会消失，或者开始向我们收取第三方佣金。*\n\
  \n为了构建基于 Web 的 DApp，以太坊提供了一个方便的 JavaScript 库，名为 web3.js，它使用**远程过程调用（RPC）**来连接我们的区块链节点。因此，我们只需把这个库引入自己喜欢的\
  \ JavaScript 框架（如 ReactJS 或 AngularJS），就可以开始开发 DApp：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_148_0.png)\n\
  \n图 4.1：DApp 高层架构，来源：Mahesh Murthy，medium.com\n\n在第 2 章*深入理解以太坊*中，我们讨论了 DApp 如何与\
  \ Swarm、Whisper 和 EVM 交互。这描述了 DApp 典型的后端交互。这里，在*图 4.2*中，我们展示了 DApp 的前端在首次创建智能合约（步骤\
  \ 1-5）以及合约部署到区块链后的函数调用交易（步骤 6+）时的交互方式：\n\n## 什么是 ethercast？\n\n如果你还记得第 2 章*深入理解以太坊*中的自助餐类比，那么\
  \ ethercast 就类似于自助餐台。它是一个网站，作为一个平台，可以免费注册处于开发生命周期不同状态的 DApp，如图 *4.3* 所示。一旦注册，就可以随着开发进度的推进跟踪\
  \ DApp 的生命周期状态。它是一个基于 Web 2.0 的应用商店，将我们连接到基于 Web 3.0 的 DApp 的进度状态。\n\n这个应用商店（https://dapps.ethercasts.com/）由\
  \ Joris Bontje 创建。该网站正在进行改版，可通过以下网址访问：https://www.stateofthedapps.com/。\n\nDApp\
  \ 的生命周期状态根据*图 4.3*中提到的图例进行颜色编码。如果我们点击任何 DApp 磁贴，会显示详细信息和网页链接，以方便用户，如*图 4.4*所示。这个应用商店可以成为以太坊\
  \ DApp 开发新手的一站式指南：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_150_0.png)\n\n图 4.3：以太坊上\
  \ DApp 的状态\n\n现在让我们来看看以太坊上三个潜力巨大的 DApp。\n\n## btcrelay.org\n\n这是一个由 Joris Bontje\
  \ 推荐的项目。它由 Joseph Chow 开发，在 ethercast 上处于在线状态。它实际上是比特币的第一条可运行的侧链。\n\n这个 DApp 作为一个构建模块，允许基于以太坊的智能合约安全地、无需任何中介地验证比特币交易。它存储比特币区块头，进而用于构建比特币区块链的迷你版本。简单来说，用户可以用比特币支付来使用以太坊\
  \ DApp。\n\n## oraclize.it\n\n这是一个 DApp，它使智能合约能够基于外部数据的实时馈送来构建其业务逻辑。\n\n它充当 API 和\
  \ DApp 之间的数据载体。它由 Thomas Bertani 创立，在 ethercast 上处于在线状态。在后续关于智能合约的章节中，我们将更深入地探讨\
  \ oraclize。\n\n## the-pitts-circus.com\n\n这是第一部由以太坊资助的电影。该网站表示，购买每张门票都会附赠一个包含五个代币的纸钱包，用户可以在未来\
  \ 20 年内从利润中兑现这些代币。故事围绕一个恰巧经营马戏团的澳大利亚家庭展开。这是一项独特的尝试，为娱乐产业带来了全新的视角。\n\n作者是 Ken Evil，如*图\
  \ 4.4*所示：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_154_0.png)\n\n图 4.4：作为 ethercast\
  \ 上 DApp 的以太坊资助电影\n\n## 理解 DAO 的设计\n\nDAO 是智能合约吗？DAO 是 DApp 吗？Vitalik Buterin 将去中心化自治组织描述为一个存在于万维网上并拥有自己一套规则的实体。DAO\
  \ 还在很大程度上依赖于雇佣个人来执行自动化本身无法完成的某些任务。\n\n理解 DAO 的概念可能有点棘手。从软件开发者的角度来看，DAO 只是一段代码，具体来说是一个复杂的智能合约，或者一个由许多简单智能合约组成的交互模块，被抽象为一个组织。从交易者的角度来看，DAO\
  \ 最贴切的类比是**有限责任公司（LLC）**。让我们试着稍微了解一下 LLC。假设 Susan 有一个很好的商业想法，想用她的毕生积蓄开办一家初创公司。她没有通过风险投资家路线来为业务所需的其余资金融资，而是选择了\
  \ LLC 路线。这样，她邀请股东拥有公司的一部分股权；任何愿意出资的人都可以参与。同时，作为 LLC，Susan 可以免于为 LLC 产生的任何利润缴纳个人税，因为\
  \ LLC 基本上是一个独立实体，属于商业税的管辖范围。万一 Susan 的业务没有起飞并遭受损失，她同样可以通过申请破产获得豁免，并且她不会因为损失所有股东的钱而承担责任，因为这是一个\
  \ LLC。所以，LLC 基本上是一个 CAO，即中心化自治组织。因此，DAO 是去中心化网络上的 LLC。\n\n现在让我们试着解读 autonomous 的含义。“autonomous”这个词让人想起阿诺德·施瓦辛格的《终结者》和天网。是的，机器人自主性确实很令人兴奋，但在这里我要直言不讳。DAO\
  \ 是自治的，但只是在反应式意义上。目前，DAO 的编码逻辑如果不使用定时器和外部预言机，就无法自行启动。理解 DAO 自治性的更好方式是：它是一组规则的编程实现，这些规则由智能合约代码在基于以太坊的公有区块链上实例化。\n\
  \n理解 DAO 的最佳方式就是从零开始创建一个简单的 DAO。它将为我们实现双重目的：既展示如何创建一个像 DAO 这样的复杂 DApp，又让我们意识到代码逻辑中可能存在的漏洞——这些漏洞我们很容易忽视，从而导致灾难和资金损失：\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_156_0.png)\n\n图 4.5：示例 DAO 募资合约及典型钱包\n\
  \n现在让我们编写我们的合约，它基本上是一个募资合约，是 DAO 的主要组成部分，因为它基本上是一个去中心化投资基金。我们还将编写一个钱包的代码，通过它我们可以存入和提取资金。例如，如果我向募资\
  \ DAO 投入了 10 个以太币，那么我就可以在需要时随时提取我的 10 个以太币。图 4.6 展示了募资 DAO 的基本设计，以及一个使用 Solidity\
  \ 代码以 wei 为单位存入和取回以太币的典型钱包：\n\n\n图 4.6：输入值 10 ETH，然后按下 fallback，再点击 get balance，即可获得以\
  \ wei 为单位的金额（10 * 10^18）\n\n正如我们在代码中所见，DAOFundraiser 合约基本上可以做三件事：\n\n- contribute()\
  \ 函数：当有人使用钱包向此合约提供以太币时，向基金捐款\n- withdrawalALLmycoins() 函数：如果用户提出请求，将所有资金提取回我的钱包\n\
  - getBalance() 函数：返回募资方中的最终余额：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_157_0.png)\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_158_0.png)\n\n图 4.7 使用 fallback 获取以 wei\
  \ 为单位的 5 ETH，以充实钱包\n\n现在我们用图 4.6、图 4.7、图 4.8 和图 4.9 以图示方式展示这个简单 DAO 的工作原理。我们将使用与编写\
  \ Hello World 时相同的 remix 在线 IDE：\n\n图 4.8 从钱包（金额减少）向 DAOFundraiser（金额增加）贡献 50 wei\n\
  \n我需要提到一个小细节：当我们将 DAO 地址复制到钱包合约中时，如图 4.9 所示，请将该地址用双引号括起来，以避免在创建 DAO 募资合约后立即创建钱包合约时出现运行时错误：\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_160_0.png)\n\n图 4.9：在钱包合约中按下 withdraw，以提取钱包向\
  \ DAO 贡献的所有资金\n\n就这样，我们从零开始创建了一个简单的 DAO，并且它按预期工作了。感觉很棒，对吧？但如果你是眼光敏锐的软件开发人员，你可能会注意到\
  \ DAOFundraiser 的逻辑有一个重大缺陷，只需对钱包逻辑稍作修改，就可以利用这个缺陷从我的钱包中取走资金。这就是价值 5000 万美元的以太币攻击事件的作案方式，我们将在最后一节中进行分析。\n\
  \n## DAO 的兴衰\n\n最初有漏洞的 DAO 包含许多复杂合约，但其本质与我们在上一节创建的简单 DAO 相同。2016 年 5 月，DAO 通过大规模众筹资金成立，利益相关者购买了价值超过\
  \ 1.5 亿美元的首次代币发行（ICO）。但在接下来的一个月，即 2016 年 6 月，一名黑客（其中一个用户）利用该漏洞向其自己的钱包抽走了大约 5000\
  \ 万美元。这笔资金后来通过区块链重组被追回，但导致了 ETH/ETC 的硬分叉。从技术上讲，将这次事件称为\"黑客攻击\"是用词不当，因为并没有对募资方进行强行闯入式的侵犯。它只是通过更改钱包逻辑，利用了\
  \ DAOFundraiser 合约中一行易受攻击的代码逻辑。\n\n这是完全可能的，因为钱包通常是独立的模块，可以拥有任意自定义逻辑和接口。图 4.10 展示了容易受到攻击的函数块。请注意，除了注释行之外，我们没有对\
  \ DAO 合约做任何更改：\n\n```\nfunction withdrawAllMyCoins(){\n    uint withdrawAmount =\
  \ balances[msg.sender];\n    TypicalWallet wallet = TypicalWallet(msg.sender);\n\
  \    wallet.payout.value(withdrawAmount)();\n    //vulnerable\n    balances[msg.sender]\
  \ = 0;\n}\n```\n\n图 4.10：简单 DAO 中的漏洞\n\n现在让我们编写一个恶意钱包，它基本上就是旧的 TypicalWallet 内部的利用逻辑。图\
  \ 4.11 展示了代码逻辑：\n\n```\n```solidity\ncontract TypicalWallet{\n    DAOFundraiser\
  \ fundraiser;\n    uint r = 10;\n\n    function TypicalWallet(address fundraiserAddress){\n\
  \        fundraiser = DAOFundraiser(fundraiserAddress);\n    }\n\n    function contribute(uint\
  \ amount){\n        fundraiser.contribute.value(amount)();\n    }\n\n    function\
  \ withdraw(){\n        fundraiser.withdrawAllMyCoins();\n    }\n\n    function getBalance()\
  \ constant returns (uint){\n        return this.balance;\n    }\n\n    function\
  \ payout() payable{\n        // exploit\n        if(r>0){\n            r--;\n  \
  \          fundraiser.withdrawAllMyCoins();\n        }\n        // receive payment\n\
  \        // log or do other activity\n        // complex codes\n    }\n\n    function()\
  \ payable{\n    }\n}\n```\n```\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_162_0.png)\n\
  \n这个利用究竟做了什么？该利用会递归调用 payout 函数，直到循环结束并到达 `balance[msg.sender]=0`。因此，钱包最终会将更多代币吸回到自己的钱包。在这种情况下，大约是\
  \ 10 倍的金额。*图 4.12* 和 *图 4.13* 展示了这种利用：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_164_0.png)\n\
  \n图 4.13：对于同样的 10 wei，当我们提取时，我们会从 DAO 收到 100 wei 到钱包中\n\n现在，即使钱包中存在恶意逻辑，这段代码也无法从\
  \ DApp 中抽取以太币。这是因为递归路径已被修改，并且在递归代码再次调用自身之前，计数器已被设为零：\n\n```\n```solidity\nfunction\
  \ withdrawAllMyCoins(){\n    uint withdrawAmount = balances[msg.sender];\n    //not\
  \ vulnerable anymore\n    balances[msg.sender] = 0;\n    TypicalWallet wallet =\
  \ TypicalWallet(msg.sender);\n    wallet.payout.value(withdrawAmount)();\n}\n```\n\
  ```\n\n图 4.14. DAO 的代码修复\n\n我们看到了单行代码如何引发金融灾难。我们真的需要摆脱那种错觉，即区块链编码只是有趣的应用程序开发或一般的\
  \ Web 编程。在这里，我们处理的是他人的资金，任何错误的后果都不好受。\n\n## 总结\n\n本章开头，我们定义了 DApp 的四条基本规则：开源、无单点故障、拥有原生代币，以及价值证明算法。我们讨论了适用于\
  \ DApp 的 Johnston 定律以及 DApp 的三大类型。然后我们逐步完成了开发 DApp 的步骤。我们讨论了 DApp 的前端架构，接着转向 ethercast\
  \ 及其各种状态-颜色映射。然后我们了解了 DAO 作为区块链上的有限责任公司的概念。我们甚至从零开始编写了一个简单的 DAO，并从钱包转移了代币。最后，我们详细分析了递归步骤利用漏洞，该漏洞导致了\
  \ 5000 万美元的 DAO 攻击。在第 5 章\"深入智能合约\"中，我们将深入探讨智能合约，学习如何构建健壮且可扩展的代码。\n"
- "## 深入智能合约\n\n在本章中，我们将深入探讨智能合约的设计。我们首先理解智能合约的教科书式定义。然后，我们继续理解不同的智能合约模型以及代码在智能合约中的作用。接着，我们了解智能合约的基本结构，并看看智能合约是如何工作的。然后，我们将重点转向一些高级主题，例如智能合约优化、审计和\
  \ ERC20 合规性。最后，我们通过构建投票 DApp 的动手练习来结束本章。\n\n学完本章后，你将能够：\n\n- 定义智能合约并理解各种设计模型\n-\
  \ 领会代码在智能合约中的作用\n- 形象化理解智能合约的基本结构\n- 理解智能合约的优化、审计和合规性\n- 理解使用智能合约的投票 DApp 的设计\n\n\
  ## 是什么让合约变得\"智能\"？\n\n早在区块链和互联网出现之前很久的模拟时代，我们就已经拥有了基本上可以执行智能合约的机械设备，那就是自动售货机，如*图\
  \ 5.1* 所示。当你以某种货币支付一定金额后，你就可以选择产品代码。一旦代码被确认，产品就会从机器中出来。如果你不付款，产品就不会出来。如果你在付款后延迟超过等待时间阈值，或出现任何机械故障导致你的会话过期，产品也不会出来。\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_167_0.png)\n\n图 5.1：自动售货机\n\n我们可以看到，智能合约的概念早在区块链和互联网之前就已经存在了。因此，即使在定义智能合约之前，我们也必须先澄清围绕它的种种误解。排在首位的一个误解是：智能合约是否具有智能。答案是否定的，它既聪明又愚笨，但并不具有智能。为了理解这个微妙的概念，让我们用智能手机来类比。你的手机会在你想到拨号之前就替你拨打电话吗？例如，你正身处一场骚乱之中；设备是否会利用\
  \ GPS 或其他内置应用感知到类似骚乱的情况，并代表你拨打 911 或当地报警电话？不会，对吧？（理想情况下，它不应触发此类电话，因为这非常依赖上下文。你也许实际上正待在一个安全屋里，而误报可能会造成麻烦。）然而，智能手机可能会智能地处理信息，并闪烁显示一条建议。它如何以特定方式处理信息，取决于某个特定应用给出的指令（以代码形式存储）。因此，智能手机上那些能够以某种期望方式处理信息的应用，使得智能手机变得智能。另一个误解是：智能合约就是几行计算机代码。为了理解这一点，让我们来看看下一节中给出的智能合约的定义和设计。\n\
  \n\n\n\n\n## 定义与设计\n\n智能合约最初由尼克·萨博（Nick Szabo）在其 1996 年发表的论文《*智能合约：数字市场的构建模块*》中正式定义。他将其描述如下：\n\
  \n> “智能合约是一组以数字形式规定的承诺，包括各方在其中履行这些承诺的协议。”\n\n没错，就是这样。这就是定义。呃！这有什么好激动的呢？让我们稍微加点料。如果仔细观察这个定义，我们会发现它由四个具体要素组成：\n\
  \n- **一组承诺：** 这些基本上就是商业条件。例如，朱迪（Judy）和阿什利（Ashley）是共同拥有一家拍卖公司的商业伙伴。一个简单的商业条件可以如下：\n\
  \  - `IF` 拍卖销售产生利润 `THEN` 按 60:40 的比例分配利润金额\n  - `ELSE IF` 拍卖销售刚好收支平衡 `THEN` 各向福利基金捐赠\
  \ 100 英镑\n  - `ELSE IF` 拍卖销售出现亏损 `THEN` 按 70:30 的比例收回亏损金额\n\n此类商业条件可以采用由合作伙伴签署的合同形式，也可以通过应用于各自商业账户的基于规则的操作来实施。\n\
  \n- **以数字形式规定：** 智能合约由人类可读的代码行，以及将其条件和结果规定并转换为由 1 和 0 组成的机器级二进制代码的软件组成。合同条款或基于规则的查找以代码形式嵌入软件中。\n\
  - **协议：** 一套规定各方应如何处理与智能合约相关数据的规则。这些规则集通常通过计算机算法实现，是基于技术的、规则驱动的操作，可实现诸如支付释放等操作。\n\
  - **各方在其中履行：** 这是智能合约定义中最棘手的要素。一旦智能合约部署在区块链上，它便不可撤销。已编码的智能合约通常无法被阻止执行。自动执行是智能合约的灵魂。\n\
  \n然而代码可能存在缺陷，如果合约本质上遇到了未满足的条件，合约就可能停止执行。这就是为什么在将智能合约部署到公共或活跃区块链之前，我们需要对其进行审计。在此之前，我们需要了解智能合约的各种设计模型。\n\
  \n从区块链的角度来看，智能合约是位于“区块”内的一段代码。一旦部署，它就成为网络共识状态的一部分。区块充当一个软件生成的容器，用于打包智能合约的消息。这些消息可以是输入、输出或指向其他计算机代码的指针。无论智能合约如何设计，它们都涉及代码。但这引出了一个常见的误解，即智能合约仅由代码组成。\n\
  \n事实上，智能合约设计模型构成一个完整的谱系，如图 5.2 所示：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_171_0.png)\n\
  \n图 5.2：智能合约分布在一个谱系上，来源：数字商会，2016 年 11 月\n\n随着我们在开发更多基于智能合约的去中心化应用（DApps）方面不断深入，可能会出现更多变体。因此，研究代码的作用变得非常重要，因为代码在任何智能合约中都占据相当大的比例。\n\
  \n## 代码在智能合约中的作用\n\n所有智能合约都涉及代码，而所有代码都有缺陷。即使没有，它们最终也会出现缺陷。今天的需求可能成为明天的缺陷。在进入 21\
  \ 世纪之前，许多计算和数据库系统中的年份格式用 YY 而不是 YYYY 表示。那是为了节省额外字节的要求。\n\n在接近 20 世纪 90 年代末时，程序员意识到这将会变得多么混乱，因为一旦过了\
  \ 2000 年，YY 年份格式就会变得有歧义。19-11-17 会被理解为 1917 年 11 月 19 日，还是 2017 年 11 月 19 日？有些人自作聪明，他们拥有\
  \ YYYY 格式的奢侈条件，但算法却只是将日期回滚到了 1900 年。历史书籍将这一事件记录为千禧年缺陷，即 Y2K 缺陷。\n\n尽管世界各地的组织都对其计算机系统进行了检查、修复和升级以应对这一预期问题，但不知道有多少问题未被记录。关键在于，代码并不总是按照实施它的各方所期望的方式运行。消息会延迟，口令会被转储，数据在传输过程中可能会损坏。在智能合约上链之前，需要考虑此类事件的责任影响。这些事件需要成为合约整体计划的一部分。否则，它就只是有风险的合约，而不是智能合约。\n\
  \n因此，代码的作用不仅仅止于审计，随着时间推移，还需要考虑合约的法律层面。一旦智能合约上链，它就被视为法律。但任何理性的人都会争辩说，我们日后总是可以修改法律。为什么智能合约就不能这样做呢？当然可以，而且是通过预言机（oracles）来实现的。我们\n\
  \n对智能合约进行预言机化（oraclize），使其能够通过接收来自可靠来源的外部数据来自我修订，如图 5.3 所示，这里使用了一个简单的保险合约。这样的预言机引擎在提供数据馈送的同时会附带一个真实性证明，从而使馈送防篡改，并独立于第三方馈送\
  \ API 以及区块链协议上的预言机服务引擎。一个类似的类比是，在本地珠宝店购买一颗经过认证的钻石。如果一颗钻石拥有外部真实性认证，例如 GIA 或 AGSL，该认证规定了其\
  \ 4C（克拉、切工、净度和颜色），并且保证无冲突。那么它的转售价值就与我们所购买的商店无关：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_173_0.png)\n\
  \n图 5.3：预言机化的保险合约，来源：数字商会，2016 年 11 月\n\n我们将在“优化与审计”一节中更多地探讨智能合约的预言机层面。在此之前，我们需要了解智能合约的基本结构；否则，我们可能无法对预言机引擎及其如何融入整体架构有一个清晰的认知。\n\
  \n## 智能合约设计的基本结构\n\n区块链技术已成为推动智能合约概念在商业交易世界中发展的喷气燃料。大型企业机构正迅速采用这一概念，以保持对竞争对手的领先优势。这促成了行业范围内的一项倡议，即对智能合约设计框架进行形式化。四大审计公司之一的德勤（Deloitte）与数字商会咨询委员会合作，提出了一个六点式结构来形式化智能合约设计，如图\
  \ 5.4 所示：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_174_0.png)\n\n图 5.4：智能合约设计的六点结构，来源：数字商会，2016\
  \ 年 11 月\n\n## 智能合约优化\n\n在第 2 章《Grokking Ethereum》中，我们讨论了以太币和 gas 的概念（回想一下自助餐和汽车燃料的类比）。优化不足的智能合约会消耗超出必要的\
  \ gas。此类智能合约的创建者和用户在区块链上部署和运行它们时，总是会被多收费。Xiapu Luo 等人（来自香港理工大学和中国电子科技大学的一组区块链研究者）已经识别出七种此类高\
  \ gas 消耗的编程模式，这些模式分为两类，如图 5.5 所示。第一类是无用代码模式（useless code pattern），由于部署期间字节码大小的增加以及运行时字节码的移除，会带来额外的\
  \ gas 成本。第二类涉及使用循环的高成本操作：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_175_0.png)\n\
  \n图 5.5：高 gas 消耗的编程模式\n\n图 5.6 展示了表示这些完全未优化代码模式的伪代码。理想情况下，这需要用字节码来描绘，但\n\n\n\npseudo-code\
  \ has been used for ease of understanding. Pattern 1 is an example of dead code\
  \ because we will never reach the print statement in line 4 due to the `inner-if`\
  \ condition at line 3 stating `y*y <20`. If you are still wondering what just happened,\
  \ then go upward toward the `outer-if` condition at line 2 which states `y >5`.\
  \ This means y, which is an unsigned integer, can only have values greater than\
  \ 5, that is 6 and higher. Hence `y*y` always returns an integer equal or greater\
  \ than 36. In other words `(36 or more) < 20` always return a `false` condition,\
  \ so we always ignore any statement that occurs inside this `inner-if` condition.\n\
  \nInterestingly, when the solidity compiler generates the bytecode of this logic,\
  \ it never removes lines 3 and 4, which are practically ignored at runtime, and\
  \ this wastes money in terms of gas consumption. Opaque predicate outcomes are identified\
  \ without any execution. If we look into the pseudo-code of pattern 2, line 3, `y>2`\
  \ is `true` by default; hence it is redundant. It can be removed to save gas. In\
  \ the second category, we see that moving expensive operations out of the loop can\
  \ save gas. For example, in the pseudo-code of pattern 3, since the variable `sumout`\
  \ is stored in the storage, line 4 calls `SLOAD` to load `sumout` on the stack and\
  \ a `SSTORE` to save the outcome of the `ADD` operation to the storage. Normally,\
  \ the storage-related operations consume a lot of gas, and hence, are very expensive.\
  \ An optimized compiler generally assigns `sumout` to a local variable `temp` that\
  \ resides in the stack, then adds `j` to `temp` inside the loop, and finally assigns\
  \ `temp` to `sumout` after the loop.\n\nSuch optimization reduces the storage-related\
  \ operations from 2x to just 2, that is, one `SLOAD` and one `SSTORE`:\n\n```\n\
  pattern #1 dead code\nfunction q1 (uint y) {\nif ( y > 5)\n  if ( y*y < 20)\n  \
  \  print(\"you can't reach me!\");\n}\n```\n\n```\npattern #2 opaque predicate\n\
  function q2 (uint y) {\nif ( y > 5)\n  if ( y > 2)\n    print(\"think out-of-the-case!\"\
  );\n}\n```\n\n```\npattern #3\nexpensive operations of a loop\nuint sumout = 0;\n\
  function q3 (uint y){\nfor ( uint j = 0; j < y; j++)\n  sumout += j;\n}\n```\n\n\
  ```\npattern #4\nconstant outcome of a loop\nfunction q4 () returns (uint){\nuint\
  \ sumout = 0;\nfor ( uint j = 1; j <= 100 ; j++)\n  sumout += j;\nreturn sumout;\n\
  }\n```\n\n```\npattern #7\ncomparison with unilateral outcome in a loop\nfunction\
  \ q7 (uint z , uint x)\nreturns (uint){\nfor ( int i = 0; i < 100 ; i++)\n  if (z\
  \ > 0)\n    x+=z;\nreturn x;\n}\n```\n\n```\npattern #6\nrepeated computations in\
  \ loop\nuint y = 1;\nuint z = 2;\nfunction q8 (uint j){\nuint sumout = 0;\nfor (\
  \ uint k = 1; k <= j ; k++)\n  sumout = sumout + y + z;\n}\n```\n\n```\npattern\
  \ #5\nloop fusion\nfunction q5 (uint y){\nuint n = 0;\nuint w = 0;\nfor ( uint j\
  \ = 0; j < y; j++)\n  n += j;\nfor ( uint k = 0; k < y; k++)\n  w -= k;\n}\n```\n\
  \n## Figure 5.6: Pseudo-code of gas-costly pattern\n\nIn pattern 4, the outcome\
  \ of the loop is a constant value and deterministic in nature. Rather than using\
  \ a loop, we can just use a statement, such as return 5050, and assign it to sumout,\
  \ minimizing gas usage. Pattern 5 illustrates the need for a loop fusion where we\
  \ combine several loops into one to minimize gas usage. We can combine the summation\
  \ and subtraction step of n and w inside a single loop rather than running them\
  \ in sequential separate loops. Pattern 6 depicts repeated computation in a loop.\
  \ The summation of y+z is very expensive due to the use of a SLOAD operation before\
  \ ADD. This can be avoided by summing up y+z outside the loop and then reusing the\
  \ result inside the loop.\n\nAnd, lastly, pattern 7 shows unilateral redundant comparison\
  \ inside a loop. In simple words, z>0 can safely go outside the loop without loss\
  \ of functionality and in turn minimize gas cost as we are preventing the same comparison\
  \ from occurring 100 times, which gives the same result anyway. It is noteworthy,\
  \ that as we increase the loop counters, the gas cost keeps on multiplying, which\
  \ can make a smart contract quite expensive to operate.\n\nApart from changes to\
  \ the programming pattern, optimization can be achieved at runtime by tinkering\
  \ with the Ethereum virtual machine. We already saw in *Chapter 2, Grokking Ethereum*,\
  \ how EVM interacts with swarm and whisper to run DApps on a blockchain using smart\
  \ contracts. EVM basically allows us to execute arbitrary code in a trustless environment\
  \ in which the outcome is fully deterministic. EVM operates on 256 bit integers\
  \ and requires 256 bit arithmetic. Because of the 256 bit nature of the EVM, the\
  \ gas can theoretically be 2^256-1 but actually never will because the cost incurred\
  \ by such an execution would be way too much. Instead, there is a cap of using up\
  \ to 2^64, which present processors have native support for and can generally be\
  \ optimized. Even though 2^64 is still \"too costly\", it is a very nice constraint\
  \ to have and allows us to hard-cap the gas on something the computer can natively\
  \ understand. The EVM natively uses a quadratic-memory gas calculation, where for\
  \ each word of 32 bytes there is a cost associated with memory expansion. This capping\
  \ of 64 bit has also put a limit on the expansion of associated memory with the\
  \ expansion never going beyond 2^64-1.\n\nLastly, the performance at blockchain\
  \ level can be optimized by a process called **sharding**. Currently, all the transactions\
  \ and calculations that are performed on an Ethereum blockchain need to be run by\
  \ all of the nodes. So, each node has to perform every calculation. And that is\
  \ of course inefficient if scaled. That is not a characteristic that is desirable\
  \ worldwide. If we want to make complex decentralized applications run efficiently\
  \ on the public blockchain, we need to speed up the execution process compared to\
  \ the present day's runtimes. What Ethereum performs today in terms of execution\
  \ speed is comparable to that of what happened in the late 1980's computers. Roughly,\
  \ this is about 7-15 transactions per second. So it is really too low for practical\
  \ purposes. Sharding is one of the main proposals for how we can increase in terms\
  \ of performance at scale, the other two being using different altcoins and increasing\
  \ the block size. The problem with increasing the block size is that even though\
  \ we could accomplish more transactions or operations in one go, it will become\
  \ increasingly difficult for normal computers to act as nodes due to the heavy blocks\
  \ on the entire chain. General purpose computer hardware wouldn't be enough to act\
  \ as a node, and the entire ecosystem will tend towards centralization and monopolistic\
  \ cartel-like behavior, because only those operators that have massive hardware\
  \ support will be able to act as nodes by downloading the complete blockchain on\
  \ their machines.\n\nThe idea of using different altcoins is not to make the public\
  \ blockchain overloaded, and use separate blockchains to execute different operations.\
  \ This is sometimes called **merge-mining** on sidechains. This is good performance-wise,\
  \ but overall security is low when we have a segregated consensus acting on isolated\
  \ blockchains, which eventually makes the 51% attack more likely.\n\nComing back\
  \ now to the main proposal of sharding. Sharding is a philosophy where we give away\
  \ the notion of sequential executions of processes on each node of a blockchain.\
  \ Rather, we split up the entire execution into sizable chunks called shards and\
  \ many nodes process such shards in parallel. Users of one node computing one shard\
  \ are not able to communicate with users of another node who are computing another\
  \ shard. This is one of the main challenges while implementing sharding. For example,\
  \ consider you live in Dublin but you have to attend an urgent business conference\
  \ in London. And no, you cannot Skype talk as the session might turn out to be a\
  \ solid deal. To top it off, the meet-up session might stretch to the entire day.\
  \ Hence, you have to book a flight and reserve a hotel yet still want to make sure\
  \ both operations are atomic—either both succeed or neither do. Now, if the flight\
  \ ticket application and hotel room booking applications are on the same shard,\
  \ they will be done in a sequential manner, and if one of the bookings fails, the\
  \ other rolls back before committing. But if these are on different shards, unless\
  \ we have cross-shard communication, this can land us in a big mess, the worst being\
  \ that the hotel gets booked but the flight remains unreserved. One way to solve\
  \ it is by using asynchronous, cross-shard communication. In simple words, one shard\
  \ books the flight, and another shard books the hotel room. Then the shards message\
  \ each other to acknowledge each other. Finally, the shards send us a confirmation.\
  \ This is what we discussed in Chapter 1, *Blockchain Basics*, as eventual consistency\
  \ (recall the CAP theorem). Vitalik Buterin and other co-founders of Ethereum\n\n\
  \n\n拥有更好的分片计划。这是为了将整个分片活动从智能合约和 DApp 开发者中抽象出来，并在运行时内部处理。这在某种程度上类似于大数据行业中为 HIVE QL\
  \ 开发者提供的构建在 HDFS 之上的 map-reduce 框架。这将使开发者能够更专注于 DApp 和智能合约功能，而非性能层面的分片操作。想象一下拥有一张附带机票的优惠券，其中包含预订好的酒店房间。分片是一个非常困难，如果不是不可能的话，要在区块链社区中解决的任务，而区块链社区仍在开发中。如此复杂的机制要经受住时间的考验，需要强有力的审计和严格的合规性，这将是我们下一个讨论的话题。\n\
  \n## 智能合约审计与合规\n\n目前，智能合约的审计仅限于由高级开发者进行同行评审。虽然区块链社区中尚未出现用于审计智能合约代码的完善文档框架，但在研究社区中已经取得了许多值得注意的实质性进展：\n\
  \n- Xiapu Luo 等人推出了一款名为 **GAS-costly pattern checker (GASPER)** 的专有工具，利用该工具他们已识别出具有本节前面讨论的多种类型的\
  \ gas 昂贵模式的公开智能合约\n- Juels 等人诊断出智能合约可以促进犯罪，并展示了犯罪智能合约如何被促成以泄露机密信息、窃取加密密钥以及各种现实世界犯罪\n\
  - Atzei 等人研究了一系列利用合约漏洞来窃取或篡改资产的攻击\n- Zhang 等人开发了 TOWN CRIER，其旨在为智能合约提供可信数据，因为许多智能合约的应用需要来自区块链外部的数据\n\
  - Kosba 等人开发了 HAWK，这是一个去中心化的智能合约系统，使开发者能够编写隐私保留的智能合约\n- Luu 等人开发了 Oyente，这是一种新颖的基于符号执行的工具，可发现以太坊智能合约中的安全漏洞\n\
  - Bhargavan 等人使用形式化验证来分析智能合约\n\n让我们现在回到 Oraclize 引擎，它类似于 TOWN CRIER。在 Solidity 中，继承\
  \ Oraclize 合约非常简单。这为我们提供了诸如 `oraclize_query` 等函数，可直接利用该技术。Oraclize 原生集成于最广泛使用的公共区块链协议，例如以太坊和比特币。私下里，以太坊链目前可以通过使用\
  \ Ethereum-bridge 与 Oraclize 集成。对 Oraclize 的有效数据请求，无论是通过原生区块链集成还是通过 HTTP API 进行，都应指定以下参数，如\
  \ Oraclize 文档中所述：\n\n- **一种数据源类型：** 数据源是数据的可信提供者。它可以是一个网站或网络 API，例如 Reuters、Weather.com、BBC.com，或运行在硬件强制的\
  \ **trusted execution environment (TEE)** 中的安全应用程序，或在云提供商中运行的可审计的锁定虚拟机实例。\n- **一个查询：**\
  \ 查询是一组需要被评估的参数，以便完成特定数据源类型请求。查询的中间结果可能需要被解析。\n- **一种真实性证明类型（可选）：** Oraclize 设计为充当不可信的中介。可选地，对\
  \ Oraclize 的请求可以指定一个真实性证明。并非所有证明都与所有数据源类型兼容。\n\nOraclize 与以太坊智能合约之间的交互是异步的。如 *Figure\
  \ 5.7* 所示，任何数据请求都由两个步骤组成，如 Oraclize 文档中所述：\n\n1. 首先，在最常见的情况下，由用户广播执行智能合约函数的交易。该函数包含一个特殊指令，使其对\
  \ Oraclize 可见，而 Oraclize 不断监控以太坊区块链以寻找此类指令和数据请求。\n2. 其次，根据此类请求的<|message|>\n\n分配了特定的地址。在我们的示例输入中，我们使用了三位候选人\
  \ [Tom、Dick 和 Harry]。\n\n这个 DApp 更有趣的地方在于，当我们将其部署到区块链上时，构造函数只能被调用一次。与普通的 Web 应用程序不同——在普通\
  \ Web 应用中，每次同名的新部署都会覆盖旧代码——区块链上部署的代码是不可变的。也就是说，如果我们修改合约并重新部署，旧合约仍将原封不动地存留在区块链上，连同所有存储数据一起。新的部署只会创建一个独立的新合约实例。\n\
  \n代码档案中还提供了一个企业版的投票应用，名为 `corporateVotingDapp.sol`，其中包含对每个函数的详细注释。该版本将 DAO 的购币能力与投票功能结合在一起。在这个智能合约中，除了候选人名称数组之外，我们还传递了两个额外的参数。这两个参数分别是可供选民使用的代币总量，以及每个代币对应的以太币单位。\n\
  \n例如，输入 `10000,1, [Tom、Dick 和 Harry]` 意味着我们有一个投票合约，其中最多有 10,000 个代币可供选民使用，每个代币价值\
  \ 1 个以太币，选民可以为三位候选人投票。如果某位选民使用 100 个代币投给了 Tom，那么其他选民可以使用剩余的 9,900 个代币投票给这三位候选人中的任意一位。\n\
  \n*图 5.8* 展示了带有必要注释的投票 DApp 的 Solidity 智能合约。*图 5.9、图 5.10、图 5.11、图 5.12 和图 5.13*\
  \ 展示了私有区块链上的投票 DApp。*图 5.14 和图 5.15* 展示了 Remix 浏览器中简单版和企业版投票 DApp 的候选人得票数输出：\n\n\
  ```solidity\npragma solidity ^0.4.11;\ncontract simpleVotingDapp {\n    /*\n   \
  \ The key of the mapping is candidate name stored as type bytes32 and value is\n\
  \    an unsigned integer to store the vote count\n    */\n    mapping (bytes32 =>\
  \ uint8) public votesReceived;\n    /*\n    We use an array of bytes32 instead to\
  \ store the list of candidates\n    */\n    bytes32[] public candidateList;\n  \
  \  /* This is the constructor which will be called once when we\n    deploy the\
  \ contract to the blockchain. When we deploy the contract,\n    we will pass an\
  \ array of candidates who will be contesting in the election\n    e.g.[\"Tom\",\"\
  Dick\",\"Harry\"]\n    */\n\n    function simpleVotingDapp(bytes32[] candidateNames)\
  \ {\n        candidateList = candidateNames;\n    }\n\n    // This function returns\
  \ the total votes a candidate has received so far\n    function totalVotesFor(bytes32\
  \ candidate) returns (uint8) {\n        if (validCandidate(candidate) == false)\
  \ revert();\n        return votesReceived[candidate];\n    }\n\n    // This function\
  \ increments the vote count for the specified candidate. This\n    // is equivalent\
  \ to casting a vote\n    function voteForCandidate(bytes32 candidate) {\n      \
  \  if (validCandidate(candidate) == false) revert();\n        votesReceived[candidate]\
  \ += 1;\n    }\n\n    function validCandidate(bytes32 candidate) returns (bool)\
  \ {\n        for(uint i = 0; i < candidateList.length; i++) {\n            if (candidateList[i]\
  \ == candidate) {\n                return true;\n            }\n        }\n    \
  \    return false;\n    }\n}\n```\n\n图 5.8：简单的 votingDapp.sol\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_187_0.png)\n\
  \n图 5.9：私有区块链上以候选人数组作为构造函数参数的 VotingDapp\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_188_0.png)\n\
  \n图 5.10：矿工在私有区块链上部署合约\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_188_1.png)\n\n\
  图 5.11：为候选人 2 投票\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_189_0.png)\n\n图 5.12：候选人\
  \ 2 的投票交易已完成\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_189_1.png)\n\n图 5.13：候选人\
  \ 2 投票交易成功后，得票数从 0 变为 1\n\n图 5.14：Remix 浏览器上的 VotingDapp\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_191_0.png)\n\
  \n图 5.15：Remix 浏览器上的企业版 votingDapp\n\n至此，本章即将结束。话虽如此，智能合约仍然是一个快速发展的主题。在第 6 章《Solidity\
  \ 深入》中，我们将讨论 Solidity 编程语言，以及它如何帮助创建复杂的智能合约。\n\n# 总结\n\n在本章开始时，我们破除了关于智能合约的迷思。我们意识到，智能合约无法自行做出决策，需要算法触发才能实现这样的功能。我们还研究了智能合约的原始定义，并认识到智能合约模型位于一个从编码自然语言到完全自动化的频谱上。我们了解到，代码在智能合约中的作用包括优化、审计和遵守合规要求的明智组合。我们讨论了\
  \ Solidity 编译器未能优化的高 Gas 成本代码模式，并将其归类为无用代码和昂贵循环。然后，我们简要了解了如何使用预言机化来提供真实数据，以及 GitHub\
  \ 归档上的一个问题如何催生了 ERC20 标准。最后，我们在私有区块链上部署了一个去中心化投票应用，以此结束本章。在第 6 章《Solidity 深入》中，我们将深入探讨图灵完备的\
  \ Solidity 编程语言。\n"
- "# Solidity 深入\n\n本章将全面介绍以太坊区块链上图灵完备的 Solidity 语言。我们将首先一窥其设计决策，以及我们究竟为什么需要一门像 Solidity\
  \ 这样的新语言。接下来的部分将涵盖 Solidity 语言的细微差别及其使用的基本语法。具体来说，我们将涵盖面向合约的特性、函数、事件、继承、库、表达式、控制结构、单位和变量。然后，我们将一窥优化器和调试选项。最后，我们将分析导致近期以太坊区块链\
  \ Parity 钱包被黑客攻击的代码缺陷，该攻击盗取了价值约 3000 万美元的以太币。\n\n学习完本章后，你将能够：\n\n+   - 认识到 Solidity\
  \ 相对于其他高级语言的必要性\n+   - 理解 Solidity 的细微差别、语法和特性\n+   - 一窥 Solidity 优化器和调试选项\n+  \
  \ - 分析 3000 万美元 Parity 钱包攻击事件背后的缺陷\n\n# 对 Solidity 的需求\n\n让我告诉你们一个关于程序员的肮脏秘密。在整个工程界中，我们是最懒惰的一群技术人员。我们非常努力地工作，就是为了保持懒惰。我们恪守这样一句誓言：\n\
  \n> “如果说需要是发明之母，那么懒惰就是发明之父。”\n\n难怪我们如此热爱开源运动。重用另一个懒惰程序员的代码正是我们所梦寐以求的。而为了增添一点虚伪的色彩，我们也从不忘记抱怨或批评原始代码有多么混乱，以及我们是多么英勇地驱赶了那些\
  \ bug，并将其整理成文档，使之成为 2.0 或更高版本。这就是我们的天性。\n\n但是，有时在这片懒惰极客的土地上，会出现一个异类，他完全从头开始编写一些全新的东西。整个懒惰社区随后会嘲笑这些粗糙的代码。渐渐地，这个异类消除了新东西中的\
  \ bug，并开始获得关注。尽管如此，我们仍然无视它。此时，这个异类已经继续去做另一件新事物了，而他在获得关注期间的一些狂热追随者正在核心代码之上进行构建。然后，我们懒惰的社区开始与之对抗。批评者发起了著名的\
  \ X 与 Y 之争，在在线论坛上提问：“作为一个刚辍学、没有工作的新鲜人，我应该选择哪种语言？是应该选 X——我祖母在大学时用过的那种，还是应该选 Y——我误以为我的孙子会用的那种？”到这个时候，五年已经过去了，这个新事物在\
  \ IEEE 最受欢迎编程语言排行榜上高歌猛进，世界一流大学鼓励我们学习它，业界也在尝试围绕它的使用制定事实标准和框架。而我们这些懒惰的领主们，却在疯狂地寻找它的免费副本，以便安装并“掌握”它。\n\
  \n而且，不，它不是 Python（尽管你的猜测已经足够接近了），我指的是……\n\n\nreferring to, in our chapters context.\
  \ It is good old JavaScript (with the de facto standard as ECMAScript) and the outlier\
  \ is Brendan Eich.\n\nA programming language design is done with a particular operating\
  \ environment in mind and a list of target tasks it needs to complete. All design\
  \ decisions, features that are to be supported, and ones that need to be dropped,\
  \ are driven by these two distinct factors. In the case of Ethereum, the operating\
  \ environment was the **Ethereum virtual machine (EVM)**, which would take care\
  \ of the second factor, to perform the entire assigned task over the Ethereum blockchain.\n\
  \nBut who would pass the instructions to the EVM? We need some sort of human machine\
  \ interface. Hence, the **application binary interface (ABI)** was introduced. The\
  \ sole aim of this interface was to make machine code portable across the blockchain.\
  \ It is analogous to an **application programming interface (API)**, where we make\
  \ the source code portable across various high-level languages.\n\nBut the ABI was\
  \ not enough to make complex abstractions such as a wallet or an oracle. The ABI\
  \ is static, strongly typed, and known at compilation time. The need for a Turing-complete\
  \ programming language that could totally adapt with the EVM and seamlessly couple\
  \ with the ABI was obvious. It needed to have the user-rich features of JavaScript\
  \ bundled with the assembly level, high performance of C++. Gavin Wood proposed\
  \ a design of such a language and code-named it solidity. This language, along with\
  \ the capability of writing a smart contract, also included properties such as safe\
  \ language subsets, static analysis, in-built test-generations, executing environments,\
  \ named components, contracts as class entities, and the ability of a contract to\
  \ map segment information to storage.\n\nThe EVM is just a very different beast.\
  \ The decision to make a language specifically tailored to the EVM execution environment\
  \ has helped the Ethereum community to prevent the problem of highly sub-optimal\
  \ code execution. But a new language comes with its own set of grammar rules and\
  \ features, which we will be discussing in the next section.\n\n## Nuances, syntax,\
  \ and features of solidity\n\nThe most striking feature of solidity lies in its\
  \ resemblance to ECMA Script standards (ES6 Harmony). To begin with, a solidity\
  \ source file layout contains an arbitrary number of contract definitions along\
  \ with pragma directives and optional imports at a global scope along with comments.\n\
  \n### Pragma, import, and comments\n\nA pragma directive of solidity always has\
  \ versions in the form 0.x.0 or x.0.0, as shown in *Figure 6.1*. This ensures that\
  \ any future version of the solidity compiler is ignored that might introduce incompatibility:\n\
  \n```\npragma solidity ^0.4.0;\n```\n\nFigure 6.1: Pragma directives\n\nAlthough\
  \ solidity does not have the ability to export or spool-out results yet, it supports\
  \ import statements, which are very similar to JavaScript. This keyword is used\
  \ at contract compile time in our local build environment. Once a contract gets\
  \ deployed on a blockchain using EVM, it can neither read nor write files. *Figure\
  \ 6.2*, lists down a few uses of the import statement at the global scope:\n\n```\n\
  import \"filename\";\nimport * as symbolName from \"filename\";\nimport {symbol1\
  \ as alias, symbol2} from \"filename\";\nimport \"github.com/ethereum/dapp-bin/library/iterable_mapping.sol\"\
  \ as it_mapping\n```\n\nFigure 6.2: Import syntax with global scope\n\nComments\
  \ in solidity are of three types. These are single-line comments, multi-line comments,\
  \ and the undocumented `natspec` comment, as depicted in *Figure 6.3*. Natspec comments\
  \ are used directly above a function definition and the `@` tags provide a confirmation\
  \ to the user during static code analysis of whether a variable described in the\
  \ comment is actually used in the code or not:\n\n```\n// This is a single-line\
  \ comment.\n/*\nThis is\nmulti-line comment.\n*/\n/** @title natspec comments */\n\
  ```\n\nFigure 6.3: Comments in solidity\n\n### Class properties of a contract\n\n\
  Solidity is often called a contract-oriented language, as every operation that can\
  \ occur on the blockchain must reside inside the scope of a contract. A contract\
  \ serves as a template definition for the functions and variables, very similar\
  \ to the definition inside a class for an object-oriented language. Like a class,\
  \ contracts can inherit from other contracts.\n\nA contract can contain declarations\
  \ ranging from functions and function modifiers, state variables, events, enum,\
  \ and struct types. *Figure 6.4* summarizes these declarations in a tabular representation.\n\
  \nFor further details and nuances, solidity has a freely available public documentation\
  \ site. The document is generated using the sphinx package of the Python language\
  \ and can be accessed at http://solidity.readthedocs.io/en/develop/index.html:\n\
  \n| Declaration | Description | Example |\n|---|---|---|\n| State Variables | Permanently\
  \ stored values in contract storage | `uint32,bool, ufixed,address` |\n| Functions\
  \ | Executable code units inside a contract | ```solidity\ncontract SampleContract\
  \ {\n    function newfunction() payable { // Function\n        // code\n    }\n\
  }\n``` |\n| Function Modifiers | Used as a declarative way of amending semantics\
  \ of functions | ```solidity\ncontract newContract {\n    address public bidder;\n\
  \n    modifier onlyBidder() { // Modifier\n        require(msg.sender == bidder);\n\
  \        _;\n    }\n\n    function abort() onlyBidder { // Modifier usage\n    \
  \    // code\n    }\n}\n``` |\n| Events | Used for EVM logging facility and Convenience\
  \ Interface | ```solidity\ncontract newAuction {\n    event HighBidIncrease(address\
  \ bidder, uint amount); // Event\n\n    function bid() payable {\n        // code\n\
  \        HighBidIncrease(msg.sender, msg.value); // Triggering event\n    }\n}\n\
  ``` |\n| Structs Types | Customized type to group several variables | ```solidity\n\
  contract VotApp {\n    struct Electorate { // Struct\n        uint identity;\n \
  \       bool voted;\n        address delegate;\n        uint vote;\n    }\n}\n```\
  \ |\n| Enum Types | Customized type with a finite set of values | ```solidity\n\
  contract Volcano {\n    enum State { Active, Extinct, Dormant } // Enum\n}\n```\
  \ |\n\nFigure 6.4: Summarized declarations of solidity\n\n### Functions\n\nSolidity\
  \ has basically two types of function calls. One is the internal, also called a\
  \ message call, which does not make an actual call to the EVM. Another is the external\
  \ function call, which is part of the contract interface and can be called from\
  \ other contracts via transactions. These functions are mostly efficient when the\
  \ contract is receiving large arrays of data. An external function cannot make internal\
  \ calls.\n\nFunction visibility has classified solidity into four types, namely\
  \ `external`, `internal`, `public`, and `private`. The private visibility only prevents\
  \ other contracts from accessing or modifying information residing in the contract,\
  \ but it is still visible to the whole world on the live public blockchain.\n\n\
  During this entire book, we have been trying to build contracts and deploy them\
  \ over a blockchain. A contract, once deployed on the blockchain, continues to run\
  \ forever. But real life has some constraints; we might not want certain contracts\
  \ to continue after a certain period of time. For example, we might not want to\
  \ renew our car insurance contract as we plan to sell the car. That is why we need\
  \ some mechanism to terminate or kill a contract.\n\n*Figure 6.5* represents a killer\
  \ contract that has a function, which when executed, kills a live contract, and\
  \ takes it off the blockchain. Actually it is done by an in-built EVM operation,\
  \ `selfdestruct`. It needs an input parameter in terms of the address to send the\
  \ remaining ethers and the killing occurs, which takes away the contract from the\
  \ blockchain:\n\n```\npragma solidity ^0.4.11;\n\ncontract MyKillerContract {\n\
  \    address owner;\n\n    function MyKillerContract() public {\n        owner =\
  \ msg.sender;\n    }\n\n    function getCreator() public constant returns(address)\
  \ {\n        return owner;\n    }\n\n    function kill() public {\n        if(msg.sender\
  \ == owner) {\n            selfdestruct(msg.sender);\n        }\n    }\n}\n```\n\
  \nFigure 6.5: Killer contract using selfdestruct operation\n\nApart from `selfdestruct`,\
  \ a function can be declared as a `view`, `pure`, `getter`, and `fallback` function.\
  \ A `view` declaration ensures that the state of a function is not modified. A `pure`\
  \ declaration ensures the function is not read and does not modify the state of\
  \ a function. The compiler automatically creates a `getter` function for all state\
  \ variables, hence they have external visibility. Fallbacks are basically nameless\
  \ functions that generally do not have arguments and cannot return anything. This\
  \ chapter's last section on Parity hack will discuss fallback function in greater\
  \ details.\n\n\n\n\n## 事件\n\n智能合约可以通过事件方便地使用 EVM 的日志记录功能。那么如何通过事件来实现这一点呢？嗯，JavaScript\
  \ 在这里可以派上用场。在开发 DApp 时，前端几乎总是 JavaScript 页面，大多使用 Node.js 或 web3.js。这些页面会监听事件，并在\
  \ DApp 的用户界面中发起 JavaScript 调用。\n\n当此类事件调用发生时，参数会被存储到交易日志中。这些日志是区块链中的一种特殊数据结构，并且与合约的地址相关联。只要区块可访问，这些日志就会一直存在。我们无法在合约内部访问事件或日志数据，这需要\
  \ PoW。事件是可继承的，也是调试智能合约的绝佳工具。\n\n## 继承\n\n在继承方面，Solidity 模仿了 Python 语言。它支持一般继承、多重继承和多态。简单来说，继承是指合约从父合约复制属性的特性。在多重继承的情况下，合约会从多个合约复制属性。多态指的是一种通用合约，可以被许多其他合约复用。\n\
  \n例如，一个 `eat()` 合约可以被 `human()` 合约、`birds()` 合约以及 `animal()` 合约使用。在 Solidity 中，`is`\
  \ 是用于合约继承的关键字。\n\n多重继承有时会导致死锁问题。图 6.6 以 Solidity 为例说明了这个问题，它会给出一个特殊的错误：`Linearization\
  \ of inheritance graph impossible`（继承图线性化不可能）。这是因为 `c` 请求 `Y` 覆盖 `D`。这是通过在第 6 行按\
  \ `D, Y` 的顺序指定 `D` 和 `Y` 来实现的。但 `D` 本身在第 5 行已经请求覆盖 `Y`。这就产生了无法解决的矛盾。因此，Solidity\
  \ 遵循 Python 的标准，强制只能遵循特定的顺序，否则就会引发这样的错误：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_204_0.png)\n\
  \n图 6.6：Solidity 中的死锁问题\n\n关于库调用的更多陷阱，请参阅本章末尾的“Parity 黑客攻击”一节。在此之前，请耐心等待。\n\n##\
  \ 表达式与控制结构\n\n表达式和控制结构总结为以下 10 个要点。如需了解更多细节，请查阅 Solidity 文档，或在 Ethereum Stack Exchange\
  \ 论坛上提问：\n\n- 合约的输入参数与变量的声明方式相同。输出参数在 `return` 关键字之后，以类似于输入参数的方式声明。两者都可以在函数体中用作表达式。函数可以返回多个输出，但输出的数量必须与输出参数的数量一致。\n\
  - 与 JavaScript 一样，Solidity 拥有大多数常见的控制结构，但没有 `go to` 和 `switch`。与 C 和 JavaScript\
  \ 不同，Solidity 目前还没有非布尔类型到布尔类型的转换。\n- Solidity 允许在内部进行递归函数调用，即函数调用自身。这些调用在 EVM 中会被转换为单个\
  \ `JUMP` 操作。使用此关键字还可以调用外部合约，但由于它能够改变其他合约的内部函数状态，可能导致黑客攻击，因此具有潜在的高度危险性。所以，必须仔细编写代码并测试漏洞。\n\
  - 合约可以使用 `new` 关键字创建新合约。但使用 `new` 进行递归调用是不可能的，因为在创建之前需要预先知道新合约的主体。（在想区块链蠕虫恶意软件会如何利用递归吗？真是邪恶的想法！！）\n\
  - Solidity 中表达式求值的优先级顺序尚未正式确定，但采用 JavaScript 的默认优先级是安全的，而且根据文档，这是最安全的（http://Solidity.readthedocs.io/en/develop/miscellaneous.html#order）。\n\
  - 有趣的是，使用 `uint8` 比使用 `uint32` 消耗更多的 gas。这是因为状态变量需要为 `uint8` 做额外的填充操作。因此，为了使用未被充分利用的变量，建议使用\
  \ `struct` 类型，这样可以高效地利用空间，从而降低 gas 消耗。\n- 无论状态如何，变量的默认值通常都是零状态。对于 `bool` 类型，为 `false`。对于无符号整数，如\
  \ `uint`、`uint8` 和 `uint32`，为 0。对于静态声明的数组，默认情况下所有数组元素都持有该类型的零状态值。对于动态声明的数组（如 `bytes`\
  \ 和 `string`），字段为空。\n- Solidity 继承了 JavaScript 的作用域规则。因此，在函数内声明的变量无论声明位置在哪里，都会保留在整个函数的作用域内。\n\
  - 自 Solidity 0.4.13 版本起，`throw` 关键字已被弃用。对于异常处理和触发异常，使用 `revert ()`。可以使用 `assert`\
  \ 和 `require` 关键字来检查条件。Solidity 目前还无法捕获异常。\n- 低级汇编操作码，如 `call`、`delegatecall` 和\
  \ `callcode`，在调用账户不存在时会返回 `success`。开发人员有责任在使用这些操作进行调用之前检查合约是否存在。\n\n## 单位与变量\n\n\
  *图 6.7* 展示了全局工作区中可用的单位和变量的类别。这些参数基本上用于定义嵌入到智能合约中的区块链的各种属性：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_210_0.png)\n\
  \n图 6.7：Solidity 的单位和全局可用变量分类\n\n## 优化器与调试选项\n\n在上一章中，我们研究了在智能合约优化方面，高 gas 成本的编码模式如何被分为两类。在本节中，我们将尝试理解\
  \ Solidity 编译器的内部优化器是如何工作的。该优化器的唯一目标是生成汇编操作码，并随后从高级编程结构生成机器码，从而降低运行时的 gas 成本。\n\n\
  我们将以高层视角审视优化器，以一个简单的合约为对象，观察在有优化器和没有优化器的情况下，汇编操作码是如何生成的。这也可以作为调试 Solidity 智能合约、在\
  \ gas 成本方面获得更好性能的一种选择。\n\n那么，当 Solidity 优化器被输入一段代码时，会发生什么呢？它基本上会在 JUMPS 和 JUMPDESTS\
  \ 操作码处将指令序列拆分为原子指令块。它作用于汇编代码，因此也可以被其他语言使用。\n\n在这些原子指令块内部究竟会发生什么呢？这些块会被分析，对内存、栈或存储的每一次修改都会被记录为一个表达式。这些表达式由一个指令和一个参数列表组成，这些参数本质上是指向另一个表达式的指针。\n\
  \n其主要动机是找到等价表达式，并将它们归并到一个表达式类中。这是一个递归过程，在此过程结束时，我们便知道哪个表达式必须位于 EVM 栈上，并拥有一份存储和内存修改的列表。关于指令块的这份元数据会与连接这些块的原子块存储在一起。\n\
  \n除此之外，有关内存、存储和栈配置的信息会被转发到下一个块。如果我们知道所有 `JUMP` 和 `JUMPI` 指令的目标，甚至可以构建整个程序的**控制流图（CFG）**。\n\
  \n最后，每个块中的代码会被完全重新生成，并基于这些表达式构建依赖图。然后，这些表达式会被放置在块末尾的栈上。任何不属于该依赖图的操作都会被移除。现在，代码按照它们在原始\
  \ Solidity 代码中出现的顺序生成，这也同样适用于内存和存储的修改。最后，所有这些生成的值都需要正确地位于栈上。*图 6.8* 展示了在后台完成上述所有步骤以降低运行时整体\
  \ gas 成本后，优化器输出到 EVM 的结果：\n\n```\n// code snippet fed to optimizer\nvar x = 8;\n\
  data[8] = 10;\nif (data[x] != x + 2)  // data[8] != 6+2 is false condition\n   \
  \ return 3;\nelse\n    return 1;\n\n// optimizer returns to assembly to reduce gas-cost\n\
  data[8] = 10;\nreturn 1;\n```\n\n图 6.8：Solidity 优化器输出到 EVM 的示意图\n\n现在，我们已经从高层了解了\
  \ Solidity 优化器在输入一段 Solidity 代码片段时是如何工作的，接下来让我们看看在有代码优化器和没有代码优化器的情况下生成的汇编指令。*图 6.9*\
  \ 展示了 Solidity 合约以及正在生成的汇编操作码。如你所见，由于 `optimizer-off`，汇编操作码会发生许多变化。除了上一节描述的事件之外，这也是一个有效的调试选项：\n\
  \n\n```solidity\npragma solidity ^0.4.0;\n\ncontract dummy\n{\n    uint32 value\
  \ = 10;\n}\n```\n\n```text\n//Optimizer on\nPUSH1 0x60\nPUSH1 0x40\nMSTORE\nPUSH1\
  \ 0x0\nDUP1\nSLOAD\nPUSH4 0xffffffff\nNOT\nAND\nPUSH1 0xa\nOR\nSWAP1\nSSTORE\nCALLVALUE\n\
  PUSH1 0x0\nJUMPI\n```\n\n```text\n//Optimizer off\nPUSH1 0x60\nPUSH1 0x40\nMSTORE\n\
  PUSH1 0xa\nPUSH1 0x0\nPUSH1 0x100\nEXP\nDUP2\nSLOAD\nDUP2\nPUSH4 0xffffffff\nMUL\n\
  NOT\nAND\nSWAP1\nDUP4\nPUSH4 0xffffffff\nAND\nMUL\nOR\nSWAP1\nSSTORE\nPOP\n```\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_213_0.png)\n\nFigure 6.9: Opcode generation\
  \ with and without optimizer\n\n## Parity hack demystified\n\nParity (https://parity.io/)\
  \ is a UK-based, venture capitalist-funded, tech start-up company. They provide\
  \ an Ethereum client, also called Parity, which has an extensive Ethereum wallet\
  \ and DApp environment for contract deployment. The entire application is written\
  \ and compiled in the RUST language. The wallets are multi-sig. Multi-sig wallets,\
  \ in simple words, are wallets that require at least two separate agreements to\
  \ spend a token from the wallet. These wallets are supposed to be more secure than\
  \ normal single-sig wallets.\n\nUnfortunately, on July 19, 2017, three multi-sig\
  \ wallets were exploited from a total of 596 wallets with similar vulnerabilities.\
  \ Figure 6.10 shows these compromised accounts in Etherscan, the public Ethereum\
  \ block explorer. When the Parity team got alerted of this hack, they tackled this\
  \ situation by forming a \"White Hat Group\" and used the same vulnerability to\
  \ siphon all the tokens from the remaining 593 wallets into a safe repository so\
  \ that the hacker could not lay their hands on these wallets. Even then, the damage\
  \ done by exploiting the three wallets was around 83,017 ETH (~ $30 million on July\
  \ 2017):\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_215_0.png)\n\nFigure 6.10:\
  \ Parity Multi-Sig Hacker account on Etherscan (https://goo.gl/CZCEji)\n\nTo become\
  \ a professional smart contract developer, especially in solidity, it is very important\
  \ to learn from the previous mistakes of senior developers. So let us walk through\
  \ the solidity code snippet of the Parity wallet to understand the vulnerability\
  \ that led to this hack. We are going to learn what actually happened in the source\
  \ code, step-by-step, and at the end we will see how the Parity team fixed this\
  \ issue. We will refer to the original source file present in the GitHub archives\
  \ and take a look at the fixes that were made in the code in order to prevent such\
  \ hacks in the future. And we will study that by looking at the history of GitHub\
  \ commits to this project. Sounds like a post-mortem analysis from a Sherlock Holmes'\
  \ crime scene, doesn't it? Bring on the magnifying glass, my dear Watson!!\n\nFirst\
  \ of all, we need to understand how this hack happened because this hack was not\
  \ a flaw in the Ethereum blockchain or Ethereum virtual machine. This hack did not\
  \ happen because Ethereum itself had some technical loophole or vulnerability. Neither\
  \ was the hack due to a flaw in the solidity language. The Parity client did not\
  \ have any vulnerabilities either. (Now you might be thinking, \"Then who let the\
  \ dogs out!? Who? Who? Who?!’). My dear Watson, the flaw was actually in the piece\
  \ of source code the Parity team gave to the users who wanted to create their own\
  \ multi-sig wallet smart contracts. Being open source software, they are bound to\
  \ give such source code to anyone under the creative commons license of the open\
  \ source coding practice.\n\nFor example, I want to use the Parity client but I\
  \ want to use my own multi-sig wallet. Then, the Parity team would give me a snippet\
  \ or rather a template of source code with some pre-defined function calls and library\
  \ calls already written inside the code template in which I can code my own logic\
  \ of multi-sig functionality, yet remain compatible to interact with the Parity\
  \ client over the Ethereum blockchain to transfer and store ethers. The flaw was\
  \ in that snippet of source code. A villainous hacker could manipulate it to exploit\
  \ the main Parity client deployed over the live Ethereum blockchain.\n\nFor instance,\
  \ imagine you have installed CCTV cameras in each of your rooms for extra security.\
  \ You lock every door and gate, and keep the duplicate keys under your favorite\
  \ flowerpot in case of an emergency. Somehow, you totally forget to switch on privacy\
  \ mode for your YouTube account, and all your home-locking activity is getting live\
  \ fed into your normally \"private\" YouTube channel, which you think is still secure.\
  \ Now, if a random thief, living nearby, was watching some random videos on YouTube\
  \ and accidentally stumbled on your live feed channel, he will know where you keep\
  \ the extra pair of keys. And it is just a matter of time; the thief will enter\
  \ your home without even breaking or raising any alarms, and steal your valuables.\n\
  \nAt this stage, you might be thinking that this is going to be a complex code debugging\
  \ operation, with many senior developers such as Gavin Wood himself involved in\
  \ fixing the code, even though he had not developed it. I also thought the same\
  \ when the news hit the media channels. But we will see in a short while, how simple\
  \ the flaw was and how easily such flaws can get overlooked even after many rounds\
  \ of peer review.\n\nLet us now get inside the code logic. Firstly, we will locate\
  \ the actual code in GitHub. The path of the code (also depicted in Figure 6.11)\
  \ is:\n\n- https://github.com/mayukhdifferent/parity/blob/master/js/src/contracts/snippets/enhanced-wallet.sol\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_217_0.png)\n\nFigure 6.11: enhanced-wallet.sol\
  \ at Parity GitHub archives\n\nHere, you will notice that the author is Gavin Wood\
  \ himself. Actually, this is the post-hack enhanced version, where the crucial bug\
  \ fix was provided by Gavin Wood himself, as shown in Figure 6.11. The funny thing\
  \ about viral media is that even though it spreads catastrophic news like wild fire,\
  \ it also suppresses many parts of credible news that also deserves applause. The\
  \ strategy and fix employed by the Parity team to stop the Parity hack midway actually\
  \ saved 593 equally vulnerable wallets valued at around $179 million, approximately\
  \ six times greater than the $30 million loss. Gavin Wood and the entire Parity\
  \ team deserves applause for this on-the-feet thinking and risk mitigation strategy.\
  \ It is very easy to act clever and wise once a theft has happened, but it takes\
  \ real presence of mind to stop a heist from happening mid-way, which the team of\
  \ developers at Parity has shown.\n\nLet us now study the enhanced-wallet.sol file.\
  \ This wallet code consists of four contracts, namely WalletEvents, WalletAbi, WalletLibrary,\
  \ and Wallet. Each contract consists of several functions. For ease of understanding,\
  \ a simpler\n\nversion of the wallet has been shown in Figure 6.12, which concentrates\
  \ only on the bare minimum code snippet required to understand the vulnerability.\n\
  \nBefore we start talking about the workings of this simplified contract, we need\
  \ to understand what libraries are. When we're deploying our smart contracts on\
  \ the Ethereum blockchain to build a decentralized application, we'll need to use\
  \ certain functionalities that many other DApps will have used as well. Instead\
  \ of coding these common functionalities from scratch, we bundle up such functionalities\
  \ into a library. Now, this bundled-up library package can not only be used by me\
  \ but also by several other developers who want to have this common set of functionalities\
  \ in their decentralized applications. In this way, we are creating reusable coding\
  \ assets.\n\nWhen we develop multi-sig wallets for Parity, our code basically uses\
  \ a helper library. Figure 6.12 has one such helper library named `WalletLibrary`.\
  \ This has a function called `initWallet`. So, one thing this library contract could\
  \ do is initialize a wallet. If we are building our own wallet contract code, we\
  \ can call this library function from our contract to initialize the wallet.\n\n\
  Also, we can check whether an address is the owner of a wallet by calling the `isOwner`\
  \ function instead of implementing it in our wallet contract. So, the library contract\
  \ is basically a bundled product of standard helper functions:\n\n\n\n```solidity\n\
  contract WalletLibrary{\n    function initWallet(){\n        //coding logic\n  \
  \  }\n    function addOwner(address owner){\n        //coding logic\n    }\n   \
  \ function isOwner(address _adr) constant returns (bool){\n        //coding logic\n\
  \    }\n}\ncontract Wallet{\n    function isOwner(address _adr) constant returns\
  \ (bool){\n        return _walletLibrary.delegatecall(msg.data);\n    }\n    function()\
  \ payable{\n        // gets called when no other function matches\n        _walletLibrary.delegatecall(msg.data);\n\
  \        //delegatecall is a pre-defined identifier for inline assembly opcode\n\
  \    }\n    address constant _walletLibrary = 0xcafecafecafecafecafecafecafecafe;\n\
  }\n```\n\nFigure 6.12: Simplified code snippet wallet.sol to understand the Parity\
  \ hack\n\n现在，如果我们观察 Wallet 合约中的代码，会发现它也拥有一个 isOwner 函数。但是，它本身并没有实现任何功能，而是仅仅将调用委托给了\
  \ WalletLibrary 合约中的 isOwner 函数。\n\n基本上，Wallet 合约是在对 WalletLibrary 合约说：“大哥，我只是一个小钱包，但你拥有所有那些可爱的小函数在为你跑腿做文书工作。请也帮我做一些吧。看，我没有那么多仆从函数。你能租借一些你的给我吗？不用担心\
  \ gas，我已经搞定了。我的用户刚刚给我充值了一堆 ether。”\n\n除了 Library 合约中的辅助函数之外，我们在 Wallet 合约中还存在一种特殊的函数定义。奇怪的是，它没有名字。payable\
  \ 是 solidity 的一个关键字，用来表示函数执行的操作，但该函数本质上是无名的。这些函数被称为 fallback 函数。理想情况下，当我们在 wallet\
  \ 合约本身中找不到任何匹配的函数名时，它就会被调用。\n\n嗯，听起来有点棘手，对吧？让我们以更简单的方式来理解这个概念。我们有一个名为 wallet 的合约。这个钱包有两个函数。一个是无名函数。另一个是有名字的函数，名字是\
  \ isOwner。现在，一个新手用户使用我们的 wallet 合约调用一个名为 donateEther 的函数。由于这个外来函数 donateEther 与我们\
  \ wallet 合约中存在的任何函数都不匹配，默认情况下会调用无名的 fallback 函数，而该函数内部包含一个 delegatecall 操作。\n\n\
  因此，无名的 fallback function() 基本上是在说：“大哥 walletLibrary，你看我的用户调用了这个不知道是什么的 donateEther\
  \ 函数。我完全不知道这个函数是什么。我自己内部也没有它的定义。你能请检查一下这是否是你那些可爱的小辅助函数之一吗。”\n\nwalletLibrary 回复道：“抱歉兄弟，没找到。我这里也没有这个\
  \ donateEther 函数。向用户抛出一些异常吧，伙计。他们会明白出了点问题。”\n\n在这种情况下，Fallback 函数在欺骗性地优雅。不仅它优雅地将调用委托回了辅助库，还执行了一些错误处理。但这正是欺骗潜入的地方。如果作为黑客，我们调用从我的\
  \ wallet 合约执行一个名为 initWallet 的函数呢？按照规则，这个函数在 wallet 合约内部并不存在。所以，fallback 函数会将调用委托给辅助\
  \ walletLibrary 合约。有趣的是，initWallet 函数确实存在于 walletLibrary 中。注意，这些调用现在正由 EVM 自动进行。黑客只需要向他自己的\
  \ wallet 合约传递函数名参数并在 EVM 上部署即可。一旦 initWallet 函数通过黑客的 wallet 合约被初始化，黑客就能够接管 Library\
  \ 合约并将所有者地址更改为他自己的钱包地址，这有助于将某些其他用户地址的所有 ether 资金转入黑客的钱包，如图 6.11 所示。\n\n因此，漏洞在于客户端\
  \ wallet 的 fallback 函数调用，该调用在没有任何安全检查的情况下被委托。这真的很灾难性，因为 Parity 团队将无法控制用户钱包。作为战术措施，他们利用了同样的漏洞，实际上从每一个剩余的钱包中窃取资金，金额达\
  \ 1.79 亿美元，并存入安全港，就像他们对价值 3000 万美元的 ether 所做的那样。\n\n作为战略解决方案，他们不得不修改其 walletLibrary，而其代码在他们控制之下。更改在图\
  \ 6.13 中显示，取自 GitHub，展示了 Parity 攻击前后的场景：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_221_0.png)\n\
  \nFigure 6.13: Code comparison of Parity wallet SOL file before and after hack\n\
  \n正如我们在图 6.13 中看到的，Parity 团队已将关键字 only_uninitialized 添加到 initWallet 函数中，这确保 walletLibrary\
  \ 只能在未初始化时执行。如果外部钱包尝试使用 delegatecall 执行 initWallet，则执行将被停止，因为实时钱包已经初始化，因此不能由其他函数调用重新初始化。\n\
  \n类似地，internal 关键字已被用于限制关键函数的作用域，防止它们被外部函数调用执行。initWallet 不能设为 internal，因为它必须保持为\
  \ public 函数，并且在构造函数中仍需要从 wallet 合约调用。\n\n因此，你可以看到，仅仅缺少 internal 和 only_uninitialized\
  \ 这样的单个关键字就导致了数百万美元的损失。因此，正如我们在前几章中所说，智能合约审计是一个非常重要的领域，我们需要领域专家，否则我们可能会经常面临此类危险。直到现在，我们主要集中在智能合约开发的后端。在下一章中，我们将深入探讨使用\
  \ web3.js 进行前端 Web 开发的精彩世界，以及它如何帮助区块链相关产品和服务吸引大量用户。\n\n## Summary\n\nSolidity 是一种仍在进行中但文档完善的语言，随着用户在区块链上实现智能合约时遇到各种问题而逐步发展。在本章中，我们涵盖了这种新语言的几个基本方面。我们首先赞扬了\
  \ JavaScript 以及它如何发展成为 Web 开发的强大语言。Solidity 正是基于这一传统而被选用于区块链。然后我们继续探讨这种语言为我们提供的各种细微差别，以其新的合约导向编程概念。我们随后深入研究了\
  \ solidity 优化器的内部工作原理，并使用事件和裸机汇编操作码探索了调试选项。我们以讨论和分析 Parity 钱包攻击作为本章的结尾，这有助于更深入地了解库和\
  \ fallback 函数在确保智能合约行业未来方面所发挥的重要但脆弱的作用。说实话，这只是开始，我们才刚刚触及技术冰山一角。\n\n在第 7 章 *Primer\
  \ on Web3.js* 中，我们将介绍 web3.js 并探索其作为区块链用户界面的潜力。\n"
- "## Primer on Web3.js\n\n在本章中，我们介绍 Web3.js，这是一个用 JavaScript 编写的特殊应用程序编程接口库。该接口将我们的\
  \ Web 浏览器与 Ethereum 区块链节点连接起来。我们将从了解 geth、Web3.js 和 Mist 之间的差异开始本章。然后我们将学习如何导入此\
  \ API 库并与 geth 连接。我们将随后探索 Web3.js 库内部的 API 结构。我们以研究所有权合约的设计作为本章的结尾。\n\n学习完本章后，你将能够做到以下几点：\n\
  \n- Differentiate between Mist, geth, and Web3.js\n- Realize how Web3.js interacts\
  \ with the Ethereum blockchain\n- Use Web3.js to run a basic smart contract\n- Know\
  \ the API structure of Web3.js library\n- Understand the design of an ownership\
  \ contract\n\n\n\n\n\n## Web3.js 在以太坊生态系统中的作用\n\n戴尔·卡内基，这位著名的自我提升训练师，曾说过财务成功有15%归因于技术技能，其余85%则归因于表达思想和激发人们热情的能力。区块链可能是由可靠的计算原理支持的前沿技术，但要使其取得财务成功，我们需要在人们中实现大规模采用。为此，我们需要一个每个人都能理解的接口。\n\
  \nWeb3.js 是一项可以帮助我们在这一领域的技术。Web3.js 为以太坊提供了 JavaScript 绑定，然后可用于使用 Web 堆栈构建直观的用户界面。\n\
  \n![](img/8c91673d39176d2e910ac52c4bc35d8b_225_0.png)\n\n图 7.1：Web3.js 通过 geth 与私有区块链交互\n\
  \n它提供了一个抽象层来隐藏区块链上智能合约复杂的内部运作。简单来说，使用 JavaScript 实现的 Web 应用程序通过 Web3.js 库与以太坊节点通信或与区块链上的智能合约进行交易。\n\
  \n图 7.1 说明了这种交互。图 7.2 清楚地区分了 Mist、geth 和 Web3.js。在此表中，我们可以看到 Mist 和 geth 使用 IPC，而\
  \ Web3.js 使用远程过程调用（RPC）。\n\n在以太坊生态系统中，IPC 通常在计算机本地工作。IPC 通常涉及 geth 在我们计算机的本地文件系统中创建一个\
  \ IPC 管道，命名为 geth.ipc。现在同一台计算机中的不同进程可以使用此管道与 geth 控制台创建双向通信。另一方面，RPC 在不同计算机之间工作，除非我们严格指定通过\
  \ RPC 端点连接到 localhost，例如使用 localhost:8545 或 127.0.0.1:8545。\n\n| Mist | Geth | Web3.js\
  \ |\n|---|---|---|\n| 它是一个浏览器 | 它是一个命令行界面 | 它是一个 API 库 |\n| 主要使用 JavaScript 实现 |\
  \ 主要使用 Golang 实现 | 主要使用 JavaScript 实现 |\n| 它用作钱包并且可以在区块链上运行 DApps | 它是运行完整以太坊节点或私有区块链的工具\
  \ | 它使用用户触发事件与以太坊节点交互 |\n| 使用进程间通信（IPC） | 使用进程间通信（IPC） | 使用远程过程调用（RPC） |\n\n图 7.2：Mist\
  \ 与 geth 与 Web3.js\n\n有趣的是，geth 和 Web3.js 中的 IPC 和 RPC 都使用一个名为 JSON-RPC 的通用协议。JavaScript\
  \ 对象表示法（JSON）是一种轻量级的数据交换格式，用于人类与机器交互。人类发现这种格式易于阅读和编写。机器发现这种格式易于解析和生成。这种数据格式完全独立于语言，基本上由两种结构组成：名称-值对和有序的值列表。\n\
  \nJSON-RPC 是一种无状态的轻量级 RPC 协议，使用 RFC 4627 作为数据格式。**请求评论（RFC）** 由 IETF 发布（请参阅 _第 2\
  \ 章，Grokking Ethereum_）。\n\n典型的 JSON-RPC 请求示例如下：\n\n```json\n{\"jsonrpc\":\"2.0\"\
  ,\"method\":\"eth_coinbase\",\"params\":[],\"id\": 67}\n```\n\n在前面的示例中，我们有一个包含四个属性的列表：\n\
  \n- `jsonrpc`：这是一个字符串，指定 JSON-RPC 协议的版本。这里版本为 `\"2.0\"`。\n- `method`：这是一个包含要调用的方法的字符串。\n\
  - `params`：这包含在调用方法期间要使用的参数值。\n- `id`：这是客户端建立的标识符。如果指定，我们让服务器知道我们期望一个响应。否则，服务器假设该消息为通知。\n\
  \n截至撰写本文时，Web3.js 的工作版本为 0.x.x；1.0 版本仍未发布。一旦 Web3.js 版本 1.0 发布，其库将支持如 _图 7.3_ 所示的一组模块。\n\
  \n每个模块为以太坊生态系统贡献特定的功能：\n\n- web3-eth 模块用于在以太坊区块链上开发智能合约\n- web3-shh 模块用于使用 whisper\
  \ 协议进行点对点通信\n- `web3-bzz` 模块用于使用 swarm 协议进行去中心化文件存储\n- `web3-utils` 模块用于 DApp 开发并包含有用的辅助函数\n\
  \n这在以下图中可视化：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_228_0.png)\n\n图 7.3：Web3.js\
  \ 在以太坊生态系统中的模块\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_230_0.png)\n\n图 7.4：从\
  \ GitHub 安装 Web3.js 和 http-server\n\n一旦 HTTP 服务器安装完成，我们就可以使用 http-server 命令启动服务器。要终止服务器实例，我们需要按\
  \ Ctrl + C。现在我们使用 Cygwin 打开 geth 节点，使用以下 geth 命令：\n\n```\n> geth -datadir=./chaindata/\
  \ --rpc --rpccorsdomain \"*\"\n```\n\n这是跨源资源共享（CORS）。例如，假设您想使用单个 Web 页面应用程序向多个服务器发送和接收数据，这就是\
  \ CORS 发挥作用的地方。它充当浏览器同源安全策略的变通方法。在使用 Web3.js 设置私有区块链后，我们编写一个名为 myDapp 的基本合约来获取我的钱包余额。此文件命名为\
  \ index.html 并放置在 web3.js 文件夹之外。\n\n图 7.5 显示了调用 Web3.js 库的 HTML 脚本，使用 JavaScript\
  \ 代码：\n\n```\n<!doctype html>\n<html>\n<head>\n<title>myDapp</title>\n<script src=\"\
  web3.js/dist/web3.min.js\"></script>\n<script type=\"text/javascript\">\n    if\
  \ (typeof web3 !== 'undefined') {\n        web3 = new Web3(web3.currentProvider);\n\
  \    } else {\n        // set the provider you want from Web3.providers\n      \
  \  web3 = new Web3(new Web3.providers.HttpProvider(\"http://localhost:8545\"));\n\
  \    }\n    function getBalance() {\n        document.getElementById(\"myBalance\"\
  ).innerText =\n        web3.fromWei(web3.eth.getBalance(web3.eth.accounts[0]), \"\
  ether\");\n    }\n</script>\n</head>\n<body>\n<h1>This is my balance</h1>\n<button\
  \ onclick=\"getBalance()\">Update my balance</button>\n<span id=\"myBalance\"></span>\
  \ in Ether\n</body>\n</html>\n```\n\n图 7.5：index.html 中的 Web3.js 库\n\n当我们在 Web 浏览器中打开此\
  \ index.html 文件并按下余额按钮时，它会返回我私有区块链中存在的以太币数量，这可以通过打开 Mist 浏览器来验证。这种比较在图 7.6 中说明。在下一节中，我们将对\
  \ Web3.js 中的 API 结构有一个高层次的了解。\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_231_0.png)\n\
  \n图 7.6：Mist 与基于 Web3.js 的 Dapp 的以太币余额比较\n\n## Web3.js 的 API 结构\n\n让我非常诚实地告诉你，浏览\
  \ Web3.js 库以找到我们合约所需的合适函数可能会令人困惑。这就是我们需要将 Web3.js 1.0 文档视为我们完美的旅游指南手册的原因。整个文档可免费获取，网址为\
  \ https://web3js.readthedocs.io/en/1.0/index.html。\n\n在本节中，我们将可视化重要 API 的地图，以便当我们实际编写合约时，可以直接跳转到\
  \ Web3.js 文档的各部分以获取规范和参数使用模式。\n\n如图 7.3 所示，我们有四个子模块，即 web3-eth、web3-shh、web3-bzz\
  \ 和 web3-utils。在图 7.4 中，我们将 web3-eth 模块细分为重要的子 API 模块。每个子模块都有若干辅助函数，可由智能合约调用。\n\n\
  要完成通过辅助函数可用的任何通用任务，调用的智能合约必须花费操作所需的以太币。\n\n```\nweb3.eth.personal.sign(dataToSign,\
  \ address, password, [callback])\n```\n\n下面是一个调用此函数并将输出打印到控制台的示例：\n\n```\nweb3.eth.personal.sign(\"\
  Dear Lord\", \"0x11f4d0A3c12e86D4D5F39D213F9E19D048296DAe\", \"password\")\n\"0x30955ed65396facf86c53e6219c52D4daeDe92aa4941d89635409de4c9c9f9466d4e9aaec999\"\
  \n```\n\n以下是 web3.eth 的 API 子模块：\n\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_233_0.png)\n\
  \n## 图 7.7：web3.eth 的 API 子模块\n\n简而言之，web3.eth 模块的 API 子模块中的函数有助于完成以下任务：\n\n- web3.eth.subscribe：用于订阅区块链上发生的特定事件。\n\
  - web3.eth.Contract：可以像操作 JavaScript 对象一样，轻松地与区块链上的智能合约进行交互。\n- web3.eth.accounts：用于生成数据、以太坊账户，并对交易进行签名。\n\
  - web3.eth.personal：允许我们的合约与以太坊节点账户进行交互。\n- web3.eth.Iban：用于在以太坊地址与 IBAN（国际银行账户号码）和\
  \ BBAN（基本银行账户号码）之间进行转换。\n- web3.eth.abi：允许合约对参数进行解码和编码，转换为**应用程序二进制接口（ABI）**，以便向**以太坊虚拟机（EVM）**发起函数调用。\n\
  - `web3.eth.net`：帮助我们的合约与以太坊节点的网络属性进行交互。除了 utils 之外，该子模块在所有 web3 模块中都是通用的；因此，它用\
  \ `web3.*.net` 表示，其中 * 可以是 `eth`、`shh` 或 `buzz`。\n\n类似地，*图 7.8* 描绘了 `web3.shh` 模块的\
  \ 33 个 API 子模块。忽略 `web3.shh.net` 模块后，其余 32 个子模块中的每一个都是一个函数，具有不同的输入和输出参数定义，并利用 Whisper\
  \ 协议进行点对点通信：\n\n- `setProvider`：更改其模块的提供者。\n- `providers`：包含当前可用的提供者。\n- `givenProvider`：返回浏览器当前的本地提供者。\n\
  - `currentProvider`：返回当前设置的提供者或 null。\n- `batchRequest`：创建并执行批量请求。\n- `extend`：允许扩展\
  \ web3 模块。\n- `getId`：获取当前网络 ID。\n- `isListening`：检查节点是否正在监听对等节点。\n- `getPeerCount`：获取已连接对等节点的数量。\n\
  - `getVersion`：获取正在运行的 Whisper 的版本。\n- `getInfo`：获取当前 Whisper 节点的信息。\n- `setMaxMessageSize`：设置\
  \ Whisper 节点允许的最大消息大小。\n- `setMinPoW`：设置节点所需的最小 PoW。\n- `markTrustedPeer`：将特定的受信任对等节点标记为可信，允许其发送过期或历史消息。\n\
  - `newKeyPair`：生成新的公钥和私钥对，用于消息加密和解密。\n- `addPrivateKey`：存储由私钥派生的密钥对，并返回其 ID。\n-\
  \ `deleteKeyPair`：如果存在，删除指定的密钥。\n- `hasKeyPair`：检查 Whisper 节点中是否存在与给定 ID 匹配的密钥对的私钥。\n\
  - `getPublicKey`：返回指定密钥对 ID 的公钥。\n- `getPrivateKey`：返回指定密钥对 ID 的私钥。\n- `newSymKey`：生成一个随机对称密钥，并将其存储在某个\
  \ ID 下。\n- `addSymKey`：存储密钥并返回一个 ID。\n- `generateSymKeyFromPassword`：从密码生成密钥并存储，然后返回其\
  \ ID。\n- `hasSymKey`：检查与给定 ID 一起存储的对称密钥。\n- `getSymKey`：返回与给定 ID 关联的对称密钥。\n- `deleteSymKey`：删除与给定\
  \ ID 关联的对称密钥。\n- `post`：将 Whisper 消息发布到网络。\n- `subscribe`：订阅传入的 Whisper 消息。\n- `clearSubscriptions`：清除对\
  \ Whisper 节点的订阅。\n- `newMessageFilter`：在节点内创建新的过滤器。\n- `deleteMessageFilter`：删除节点中的消息过滤器。\n\
  - `getFilterMessages`：检索自上次调用此函数以来收到的、且符合新过滤条件的消息。\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_236_0.png)\n\
  \n## 图 7.8：web3.shh 的 API 子模块\n\n*图 7.9* 列出了 web3.bzz 模块的 API 子模块。这些函数与 Swarm 交互：\n\
  \n- `setProvider`：更改其模块的提供者。\n- `givenProvider`：返回兼容以太坊浏览器的本地当前提供者。\n- `currentProvider`：返回当前提供者的\
  \ URL 或 NULL。\n- `upload`：将文件、文件夹或原始数据上传到 Swarm。\n- `download`：从 Swarm 下载文件和文件夹，以缓冲区形式或保存到磁盘。\n\
  - `pick`：打开文件选择器，帮助在浏览器中选择文件。\n- `net`：允许我们与以太坊节点网络属性进行交互。\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_237_0.png)\n\
  \n## 图 7.9：web3.bzz 的 API 子模块\n\n*图 7.10* 展示了 web3.utils 模块的 28 个 API 子模块。这些是合约执行与节点相关的基本操作时常用的函数。例如，`web3.utils.sha3()`\
  \ 会为传入该函数的字符串字面量生成哈希。此函数有一个别名 `web3.utils.keccak256()`。还有一个特殊的函数，它提供有用的辅助功能，而无需扩展任何内置对象。它被称为下划线函数，通常定义为\
  \ `web3.utils._()`。为方便起见，这里列出了这些函数：\n\n- `randomHex`：根据给定的字节大小生成加密强度高的伪随机 HEX 字符串。\n\
  - `_`：提供日常函数辅助功能，如 `map`、`filter` 和调用，以及更专业的功能，如函数绑定、JavaScript 模板化、创建快速索引和深度相等性测试。\n\
  - BN：在 JavaScript 中计算大数运算。\n- isBN：检查给定值是否是 BN.js 实例。\n- isBigNumber：检查给定值是否是 BigNumber.js\
  \ 实例。\n- sha3：计算输入的 sha3。\n- soliditySha3：通过 ABI 转换并紧密打包给定输入参数，然后计算其 sha3 哈希。\n\
  - isHex：检查给定字符串是否是 HEX 字符串。\n- isHexStrict：检查以 0x 为前缀的字符串是否是 HEX 字符串。\n- isAddress：检查给定字符串是否是有效的以太坊地址。\n\
  - toChecksumAddress：将大写或小写的以太坊地址转换为校验和地址。\n- checkAddressChecksum：检查给定地址的校验和。\n\
  - toHex：自动将任何给定值转换为 HEX。\n- toBN：将值转换为 BN.js 实例，用于 JavaScript 中的大数运算。\n- hexToNumberString：将给定\
  \ HEX 值以字符串形式返回其数字表示。\n- hexToNumber：返回给定 HEX 值的数字表示。\n- `numberToHex`：返回给定数字值的\
  \ HEX 表示。\n- `hexToUtf8`：返回给定 HEX 值的 UTF-8 字符串表示。\n- `hexToAscii`：返回给定 HEX 值的 ASCII\
  \ 字符串表示。\n- `utf8ToHex`：返回给定 UTF-8 字符串的 HEX 表示。\n- `asciiToHex`：返回给定 ASCII 字符串的\
  \ HEX 表示。\n- `hexToBytes`：从给定的 HEX 字符串返回字节数组。\n- `bytesToHex`：从字节数组返回 HEX 字符串。\n\
  - `toWei`：将任何 ether 值转换为 wei。\n- `fromWei`：将任何 wei 值转换为 ether 值。\n- `unitMap`：显示所有可能的\
  \ ether 值以及它们对应的 wei 数量。\n- `padLeft`：在字符串左侧添加填充，常用于为 HEX 字符串添加填充。\n- `padRight`：在字符串右侧添加填充，常用于为\
  \ HEX 字符串添加填充。\n- `toTwosComplement`：将负数转换为二进制补码：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_240_0.png)\n\
  \n## 图 7.10：web3.utils 的 API 子模块\n\n## 图 7.11：所有权智能合约\n\n```\npragma solidity ^0.4.19;\n\
  contract OwnershipContract\n{\n    struct FileMapping\n    {\n        uint timestamp;\n\
  \        string owner;\n    }\n\n    mapping (string => FileMapping) files;\n\n\
  \    event FileLogStatus(bool status, uint timestamp, string owner, string fileHash);\n\
  \n    //Used to store the owner of file at the block timestamp\n    function set(string\
  \ owner, string fileHash) public\n    {\n        //Here we are checking for default\
  \ value i.e., all bits are 0\n        if(files[fileHash].timestamp == 0)\n     \
  \   {\n            files[fileHash] = FileMapping(block.timestamp, owner);\n\n  \
  \          //triggering an event to notify the frontend\n            FileLogStatus(true,\
  \ block.timestamp, owner, fileHash);\n        }\n        else\n        {\n     \
  \       //returning out a false status to the frontend\n            FileLogStatus(false,\
  \ block.timestamp, owner, fileHash);\n        }\n    }\n\n    //this is used to\
  \ get file information\n    function get(string fileHash) internal view returns\
  \ (uint timestamp, string owner)\n    {\n        return (files[fileHash].timestamp,\
  \ files[fileHash].owner);\n    }\n}\n```\n\n图 7.12 中显示的相应 web3.js 文件可以嵌入到 JavaScript\
