  ## 图灵完备性和魔力酱


  正如我们在上一节讨论的那样，以太坊是一个去中心化应用平台。这意味着我们可以编写以去中心化方式执行的程序，其中没有中央服务器或中央实体来执行我们的程序。这些程序将在许多不同的计算机上执行，这意味着没有办法关闭这样一个去中心化应用。为了编写此类应用，我们需要开发智能合约，而智能合约是用一种名为
  Solidity 的编程语言编写的。因此，在以太坊区块链上，如果你想编写智能合约，你需要学习 Solidity。Solidity 是图灵完备的。那么，这意味着什么？要理解这一点，我们需要回到
  60 或 70 年前。


  在那个时候，人们有不同的计算机器。问题是，如果你有一台机器可以用一种算法计算某些东西，那么这台机器只能解决那个问题，而要解决另一个算法结构略有不同的问题，你必须从头开始构建一台单独的机器。


  因此，20 世纪最伟大的数学家和计算机科学家之一阿兰·图灵开发了一种机器的逻辑设计，一种理论机器。他解释了如何构建这样一台机器，以便这台机器可以运行任何程序。


  在他对这台机器的理论解释中，你可以用一条简单的磁带来构建它，磁带由均匀的单元组成，每个单元存储 0 或 1，以及一个可以左右移动的磁带头，能够读取磁带单元并存储数据。基本上他解释了如何构建一台可以运行任何程序并解决任何计算问题的计算机。话虽如此，并没有保证这需要多长时间。某些程序计算机执行它一百次。


  例如，一个简单的计算设备具有循环和加法操作，也可以被修改为通过循环特定的加法操作来执行乘法；也就是说，5 x 3 等价于 5 + 5 + 5，这等价于在 3 次循环中将
  5 与自身相加。然而，必须注意的是，循环并不总是对代码性能有利，因为循环内的循环会使任何代码的时间复杂度呈指数级增长。因此，循环对于识别图灵完备性是有用的，但在完全必要的情况下才应避免，因为它们会降低代码性能。我们还有另一个可扩展性问题，这将在后面的章节中解决，我们将在其中讨论分片的概念。


  这也是比特币避免使用图灵完备语言的主要原因之一。这是出于选择而非错误做出的决定。你看，整个图灵完备语言在区块链上运行循环的想法可能是危险的；因为如果你有一个循环执行某种代码数百万次，并且这种代码必须在区块链上执行，它将真正使网络过载。这就是比特币开发者决定不使用图灵完备语言的原因。他们只想要一种简单的机制来完成基本工作，即在节点之间进行价值转移。而在以太坊中，设计理念完全不同，随着复杂
  DApp 的引入，这些 DApp 必须使用智能合约在以太坊区块链上执行。这里，我们绝对需要一种图灵完备的语言，它必须具有循环结构。同样，我们不能通过运行数百万次循环来使以太坊区块链过载。因此，我们似乎陷入了一个两难的境地，循环是必要的恶，恶在于区块链过载和垃圾邮件其他用户。


  这正是我们需要魔力酱的时候；我们在以太坊区块链中称之为 gas。Solidity 在以太坊区块链上执行的每个操作都与之关联有固定的 gas 费用。让我们回到我们谈到的自助餐自助餐类比，我们谈到了需要开发者/聚餐厨师支付一定费用以保持他们的
  DApp/食谱温暖可口的燃气灶。你看，如果我必须为燃气灶燃料付费，我会自动烹饪即使在低 gas 使用下也很好的食谱，而不是需要大量火焰和持续高 gas 使用的食谱。因此，与其带来需要持续火焰的热烤肉，我会带来像面包或烘焙食品这样的东西，它们需要轻微或不需要燃气灶使用，以确保我在等待有人来食用我烹饪的东西时不会损失金钱。


  因此，回到以太坊区块链，如果某个新手开发者提出了一个超级疯狂的程序，其中包含数百万个循环，可能导致垃圾邮件和网络过载，那么该程序员的 gas 成本将显著增加，并且一旦开发者购买的
  gas 用完，其整个代码最终将停止执行。


  例如，如果我们运行一个包含五个操作的循环 100 次的代码，gas 费用将为每个 500 次循环消耗。因此，gas 就是那种魔力酱，需要使用 **ether (ETH)**
  代币购买以在以太坊区块链上运行 Solidity 智能合约。是的，这是一个预付费模式。你首先使用法币购买一些 ether 代币；然后，使用这些 ether 代币为你的
  gas 限额充值。然后，你运行你的智能合约程序，它将继续从你的账户中消耗 gas。你的代码越高效，你的代码消耗的 gas 越少，它在区块链上运行的时间就越长，你的
  DApp 对客户就越好。


  在以太坊区块链中，区分 gas 和 ether 至关重要。如前所述，gas 是一种在以太坊区块链上运行智能合约操作的费用，而 ether 是以太坊区块链上的加密货币代币。一个很好的现实生活类比是为汽车驾驶提供汽油或柴油。要在高速公路上驾驶汽车，我们需要为其加满汽油或柴油。我们需要现金、信用卡/借记卡或电子钱包里的钱来购买汽油或柴油。现在，汽车内部机械、天气条件、道路和交通状况、驾驶方式以及许多此类参数都会影响每英里行驶的燃料消耗。我们称之为
  **mileage**，该参数决定了汽车的性能。同样，燃料价格可能会因国际市场条件的变化及其对法币价值的影响而波动。同样，如果汽车是 Solidity 智能合约代码，




  gas 是用于为区块链的高速公路加油的燃料。我们使用以太币购买这种 gas，其中以太币相当于我们现实世界的法币。


  *图 2.13* 说明了以太坊区块链上的单位规模以及在当前货币中以太币等值的法币金额：


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_88_0.png)


  图 2.13：以太坊区块链中的以太币在货币市场上的表现以及单位


  现在出现了一个真正的问题，那就是我们永远无法知道我的智能合约代码在区块链上会如何表现，除非我们运行它。为此，以太坊平台引入了测试网和主网的概念。一旦我们编写了
  solidity 智能合约，我们就可以在测试网上运行它们，并检查操作在 gas 费用方面的花费，但这是在虚拟环境中；也就是说，我们可以免费运行代码来模拟 gas
  费用金额。一旦我们对智能合约代码的 gas 消耗率和效率感到满意，我们就会将其作为最终代码部署到主网上，在那里代码会永久地刻录到以太坊区块链中。早期的测试网被称为
  **morden**，由于安全问题已被废弃。当前的测试网被称为 **Ropsten**。


  因此，我们看到智能合约不仅仅是代表价值转移的简单交易。由此自然会产生一个问题：比特币的区块架构对于以太坊是否足够？此外，我们如何在以太坊区块链中进行挖矿？为什么我们会有两种独立的加密货币代币
  ETH 和 ETC？让我们在下一节中找出答案。


  ## 以太坊区块、挖矿和分叉


  在深入以太坊区块架构的细节之前，我们需要重新审视以太坊的区块链结构。在 *第 1 章，区块链基础* 中，我们了解到以太坊区块链是一个 Merkle 树，其中叶子代表代码的执行状态。出于简化的考虑，更精细的细节被省略了。以太坊的
  Merkle 树不是我们对比特币区块链所看到的二叉 Merkle 树。你看，二叉 Merkle 树在验证以列表格式存在的信息时是很好的数据结构，也就是一系列数据块依次排列。对于这样的交易树，编辑树创建后需要多长时间并不重要。这是因为交易保持在一个只能不断增长的冻结树的形式中。


  以太坊另一方面是一个状态树。这里的情况更复杂。以太坊中的状态表示为键值映射，其中键表示地址，值表示声明的金额、余额列表、nonce、代码和账户存储。甚至存储本身也是一个树。


  这里，与交易历史不同，状态会频繁更新。这是因为账户的余额和 nonce 发生变化，频繁创建新账户的插入，以及存储中键的频繁插入和删除。


  在这种情况下，一个理想的数据结构应该能够在插入、更新、编辑或删除操作后快速计算新的树根，而无需重新计算整个树。此外，这种树的深度应该是有限的。这可以防止任何黑客无限加深树并对其合法用户发起
  DoS 攻击。此外，以不同顺序进行更新甚至从头重新计算树也不应改变根；也就是说，根应仅取决于数据。


  Donald R. Morrison 在大约 1968 年描述了这样一种树数据结构。它被称为 **Practical Algorithm to Retrieve
  Information Coded in Alphanumeric (PATRICIA)** 树。基本上，它是一个 Radix 树，其中 Radix 等于 2，这意味着每个键的每一位都被单独比较，每个节点都是双向分支。在这样的树中，搜索、插入和删除以线性时间复杂度进行，即使在最坏的情况下也是如此。


  *图 2.14 说明了 Patricia 树中典型的插入是如何发生的：*


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_91_0.png)


  插入 ''team'' 同时拆分 ''test'' 并创建新的边标签 ''st''


  插入 ''toast'' 同时拆分 ''te'' 并将之前的字符串移动到更低一层


  图 2.14：Patricia 树插入演示，来源：Wikipedia


  因此，以太坊区块链在技术上是一个 Merkle-Patricia 树，其中以太坊区块链中的每个区块头包含三个这样的树来表示三种类型的对象：


  - 交易（代表价值转移）

  - 收据（显示每笔交易效果的数据块）

  - 状态（代表账户的所有信息）


  这三种类型的对象被矿工用来回答以下五个查询，这本质上是以太坊区块链上的挖矿活动：


  1. 一笔交易是否已包含在特定区块中？

  2. 过去 30 天中该地址发出的事件的所有实例是什么？

  3. 我的账户当前余额是多少？

  4. 这个账户甚至存在吗？

  5. 如果我在此合约上模拟执行此交易，输出会是什么？


  第一个查询由交易树处理，第二个由收据树处理，第三个和第四个由状态树处理。前四个查询计算起来相当直接。矿工只需找到对象，获取从对象到树根的 Merkle 分支，其中哈希列表向上延伸，并将分支回复给轻客户端。第五个查询也由状态树处理，但计算方式更复杂。这里，我们需要构建
  Merkle 状态转换证明。基本上，该证明做出以下声明：如果我们在根为 R 的状态上运行交易 T，结果将是根为 R'' 的状态，日志为 L，输出为 O。尽管在理论上并非必要，以太坊中存在输出的概念，因为每笔交易都是一个函数调用。为了计算证明，矿工本地创建一个假区块，将状态设置为
  S，并假装自己是轻客户端，同时应用交易。也就是说，如果应用交易的过程要求客户端确定一个账户的余额，轻客户端就会发出余额查询。如果轻客户端需要检查特定合约存储中的特定项目，轻客户端就会为此发出查询，依此类推。矿工对其自己的所有查询都正确响应，但会跟踪其发送回的所有数据。矿工随后将所有这些请求中的组合数据作为证明发送给客户端。客户端随后采用完全相同的程序，但使用提供的证明作为其数据库；如果其结果与矿工声称的一样，则客户端接受该证明。


  那么，证明是如何被接受的呢？这是通过共识算法完成的，该算法比较来自不同矿工的 PoW。该算法称为 ETH hash。即使以太坊框架的未来版本可能会切换到 PoS，PoW
  目前仍在使用。我们将在后面的章节中详细介绍该算法。目前，请记住该算法将 nonce 与 DAG 结合以生成新哈希并检查它是否小于目标阈值，以解决第 1 章《区块链基础》中讨论的挖矿的愚蠢难题。问题是
  DAG，本质上是一个庞大数据集（超过 2 GB）的有向无环图，处理起来需要大量的随机访问内存（RAM）。这种内存硬度是为什么我们不能使用 ASIC 矿机来挖以太坊区块的主要原因，因为
  ASIC 的内存缓存非常低。挖以太坊的最佳硬件客户端是 GPU 矿机。


  以下是使用 GPU 设备配置以太坊矿工时显示的列出规格：


  例如：RX 470 规格


  - **成本：** ~ $175（2017 年 3 月）

  - **内存：** 8 千兆字节

  - **内存带宽：** 211 千兆字节/秒


  除了这三个树对象之外，区块架构还有几个其他模块，这些模块在图 2.15 中说明，并在 Gavin Wood 的黄皮书中定义：


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_93_0.png)



  图2.15：以太坊区块内的模块


  如果我们仔细研究这个表示，我们会发现，除了**父哈希（prev hash）**之外，还有一个叔块哈希或ommers哈希。那么，叔块在以太坊区块链中扮演什么角色？如果我是一个区块，而区块链是我的家谱，我的叔父会非常接近我的父亲。然而，如果我由叔父的基因所生，情况就会大不相同。那样的话，我的父亲就会变成我的叔父。所以，父哈希就是我的父亲，也是我来自的正确前一个哈希。叔块哈希代表那些非常接近成为我正确前一个区块的区块，但它们未能成功，因为受到了我父亲的打击。所谓打击，是指我父亲做了比叔父更多的PoW；因此，挖矿共识选择了他而不是我的叔父。那么，我的叔父会发生什么？他现在已经成为相对于我的区块链的**矿工激活硬分叉（MAHF）**，因此，由于我位于父区块链上紧随我父亲之后（即prev
  hash），我无法访问他。


  类似地，我们可以讨论以太坊和以太坊经典之间的区别。如果你刚接触加密货币和以太坊，你可能已经注意到你可以购买两种不同类型的以太坊。所以，你可以购买称为ETH的以太坊，也可以购买称为ETC的以太坊经典。那么，这两者之间在技术和意识形态上有何区别？在以太坊区块链的创世区块开始时，只有ETH，没有以太坊经典。那么，ETC是如何产生的？一切始于以太坊上的DAO项目。**去中心化自治组织（DAO）**是构建在以太坊之上的一个项目。这个项目基本上是一个可以充当自我引导组织的应用程序，并且它举办了加密货币历史上最大规模的众筹销售。人们将自己的法币投入该项目，并获得了ETH代币作为投资回报。


  然而，这个去中心化组织所构成的智能合约存在一个缺陷。这个缺陷或漏洞使得一群黑客能够从众筹中窃取价值5000万美元的以太币。注意，这些黑客在技术上是利用者，因为这并非真正意义上的黑客攻击（由于bug），而是利用了DAO智能合约设计逻辑中的缺陷。因此，利用者通过这个缺陷窃取了价值5000万美元的以太币。这引发了大量讨论，以太坊社区的大多数人希望进行硬分叉并撤销这次盗窃，以便投资者能拿回资金，而黑客则会损失钱财。然而，要做到这一点，他们需要对区块链进行修改，而这正是以太坊社区内部意识形态争论开始的地方。虽然社区大多数人同意修改和硬分叉，但一个较小但直言不讳的少数派反对这种改变区块链的想法，因为区块链的核心思想是它应该是不可变的。一旦代码铭刻在区块链上，就应该被视为法律，所以如果发生了漏洞利用，我们可以修正以防止再次发生，但不能回头逆转已经发生的事情，无论多么不幸。因此，在争论的这一点上，社区处于一个分岔路口，一部分人希望区块链发生改变，而另一部分人希望继续前进，好像什么都没发生过。于是，这个直言不讳的少数派继续留在旧的区块链上，最终由于用户/社区激活的硬分叉而成为以太坊经典。与此同时，ETH最终被修改以将资金返还给投资者，因为风险很高。这就是为什么我们同时拥有ETH和ETC作为加密货币的原因。


  现在，如果你购买了一些ETH或ETC，你会将其存储在哪里？对于法币，我们通常将它们存储在银行账户或钱包中。在去中心化设置中，我们没有银行。然而，我们确实有钱包和客户端，我们将在下一节讨论。


  ## 以太坊钱包和客户端接口


  以太坊客户端指任何能够解析和验证以太坊区块链并执行其上智能合约的节点。正如我们在本章前几节所见，面向用户的客户端的主要目的是授权用户凭证并提供接口以执行各种操作。它们还提供了创建交易和挖掘区块的接口，这对于区块链交互至关重要。图2.16展示了以太坊客户端接口的分类：


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_96_0.png)


  图2.16：以太坊客户端接口分类


  钱包提供发送、存储和接收资金的服务。一个好的钱包服务的主要参数是安全性和信任。用户必须感到他们的资金是安全的，并且钱包管理员不会窃取资金。这类钱包被称为热钱包，因为它们始终连接到网络，且经常容易受到黑客攻击和漏洞利用。更安全的钱包包括纸钱包和硬件钱包，它们通常被称为冷钱包。这些钱包基本上以离线模式存储代币。纸钱包以扫描的QR码形式存储，代表接收地址以及必须记住的密码。简单来说，你将密钥打印在纸上，这样它们就不会被黑客入侵。硬件钱包在USB设备上具有硬接线的加密，只有通过密码才能打开。


  图2.17展示了一个钱包分类以便更清晰：


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_97_0.png)


  图2.17：以太坊钱包分类


  在所有这些以太坊客户端中，Inzhoop的轻量级以太坊移动钱包（LETH）值得特别提及，因为它不仅提供钱包服务，还拥有一个DApps浏览器商店，托管了不少可用的DApps。基于Android的alpha版本还提供群聊和个人聊天标签，完全基于whisper。聊天记录会保持24小时。目前，可以发送带有生成的bzzkey的图片文件。它目前托管在测试网Ropsten上，而钱包在主网上。因此，安装后聊天、玩游戏甚至开户，你都不需要花费任何宝贵的以太币。操作这个应用不需要任何编程知识，它可以在Google
  Play商店中找到。强烈建议初学者尝试这款基于移动端的应用，以体验DApps、whisper和swarm如何协同工作，创建一个良好的浏览器加钱包平台。他们也有一个适用于桌面的完整应用。


  图2.18展示了LETH（alpha版本）的一些截图：


  ![](img/8c91673d39176d2e910ac52c4bc35d8b_98_0.png)


  图2.18：轻量级以太坊移动钱包（Android版）


  这使我们来到了本章的结尾。我希望本章能帮助你获得必要的理论基础，以便在后续章节中踏上以太坊区块链和智能合约开发的旅程。


  卷起袖子，喝杯热咖啡，给设备充上电。我们很快就要动手编写一些Solidity智能合约了。我们第三章见，以太坊智能合约的Hello World。

