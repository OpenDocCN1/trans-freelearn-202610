- pgno: 143
  md: '# Understanding DApps


    Creation of new life always fascinates us, even more so when we are a part of
    such creation. For instance, consider a zygote cell. Smaller than a tiny speck
    of sand, it has the ability to grow into a complex biological entity, breathing
    life into a newborn infant.


    But why are we talking about zygotes rather than DApps? Well, a zygote signifies
    that juncture when one biological cell''s generation ends and the next one begins.
    It acclimates, responding to the outside world without any genetic changes. A
    zygote cannot be regulated, as it is stuck with its own genes. It can only grow
    recursively. A zygote is also autonomous. This is because it is still a cell;
    it''s formation is rapidly distributed during the cleavage phase and it is authorized
    to act as a single entity, apart from other cells. In fact, a zygote is the perfect
    metaphor of a decentralized application.


    An application qualifies as a DApp (pronounced as Dee App, similar to e-book)
    if it satisfies the following four criteria:


    +   - The application must be open source, that is, source code freely available
    to the public. In addition to this, the application must operate autonomously
    with no major entity controlling its tokens, that is, the protocol of the application
    will be fully regulated by the consensus of users.

    +   - The application must not have a single point of failure, with all its data
    and operation logs cryptographically stored in a public blockchain.

    +   - The application must use some type of native token for various'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'processes and access, and any contribution of value must be rewarded in terms
    of such tokens.


    +   - The application should use some standard and well-accepted cryptographic
    algorithm as proof of value contributed by a node to generate tokens.


    In 2014, David Johnston, CEO of Factom Inc., proposed the Johnston''s law for
    DApps:


    > "Everything that can be decentralized, will be decentralized."


    Academically, this law is a morphed version of Murphy''s law over Moore''s Law,
    which is a rule of thumb for any innovative technology, stating that the rate
    of entries occurring on a blockchain per day would double every 2 years in the
    foreseeable future.


    Murphy''s law, coined by the US Air Force, states that anything that can go wrong
    will go wrong. In the UK, an equivalent Sod''s law exists, which states that anything
    that can go wrong will go wrong with the worst possible outcome.


    He has also proposed an interesting classification of decentralized applications
    based on the blockchain the DApp is residing in, of three types:


    +   - **Type I**: DApps have their own blockchain. Bitcoin is the most famous
    example of a type I decentralized application but Ethereum and other "alt-coins"
    are of the same type.

    +   - **Type II**: DApps use the blockchain of a type I decentralized application.
    Type II decentralized applications are protocols and have tokens that are necessary
    for their function.

    +   - **Type III**: DApps use the protocol of a type II decentralized'
  merge: -1
  img_proc: true
