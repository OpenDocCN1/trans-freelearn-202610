- pgno: 95
  md: 'due to a bug but an exploitation of a flaw in the smart contract design logic
    of the DAO. So, by using this flaw the exploiters were able to steal 50 million
    USD worth of ethers. This caused a lot of discussions and the majority of the
    Ethereum community wanted to do a hard fork and reverse this theft, so that investors
    could get their money back and the hackers would lose their money. However, to
    do that, they needed to make alterations to the blockchain and this is where the
    whole ideological debate started within the Ethereum community. While the majority
    of the community agreed on the alterations and hard fork, a smaller but vocal
    minority opposed this notion of mutating the blockchain because the whole idea
    of a blockchain is that it should be immutable. Code once engraved in the blockchain
    should be treated as law, so if an exploit does occur, we may amend it from happening
    again, but we can''t just go back and reverse what has happened, however unfortunate.
    So, at this point of the debate, the community was standing on a juncture where
    one portion wanted the blockchain to mutate, while another wanted to keep going
    as if nothing happened. So, this vocal minority kept continuing in the old blockchain,
    which became the Ethereum classic as a result of user/community activated hard
    fork. Meanwhile, the ETH was eventually mutated to return the money to investors
    as the stakes were high. This is why we have both ETH and ETC as cryptocurrencies.


    Now, if you bought some ETH or ETC, where would you store it? For fiat money,
    we generally store them in bank accounts or in our wallet. Now, in a decentralized
    setup we do not have a bank. However, we do have wallets and clients, which we
