- pgno: 373
  md: '# Iota GitHub analysis


    If you go to GitHub and search for Iota, you will get to a page that links the
    repositories of Iota cryptocurrency. The GitHub page of Iota consists of three
    main repositories, namely wallet, **Iota reference implementation (IRI)**, and
    Iota JavaScript library. *Figure 11.9* depicts these repositories:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_373_0.png)


    Figure 11.9: Iota GitHub (https://github.com/iotaledger)


    Among these three repositories, IRI is the most interesting repository. So what
    is IRI? It is a reference implementation of the Iota protocol. Much like bitcoin,
    Iota is also a protocol operating on a DAG-based database called Tangle and not
    on a blockchain. Now, IRI represents a blueprint of'
  merge: -1
  img_proc: true
- pgno: 374
  md: 'Iota. So, when Iota developers made the reference implementation in Java, they
    are actually telling the world, "*this is how Iota functions work and using this
    reference implementation we can use any other Turing complete programming language
    to set up Iota clients or Iota nodes.*"


    Now if we step back and think about it for a while, we will realize that using
    this reference implementation, we can even use Solidity, which is a Turing complete
    programming language, to develop an Iota client, node, or even a smart contract.
    The possibility is endless and quite exciting. Isn''t it?


    Next we have the Iota Wallet. It is written in JavaScript and it is an electron
    app. So what is electron? It is a tool that programmers can use to package a website
    as a native application. Basically, when we want to develop native applications
    for macOS, Windows, or Linux, one way to do it would be to code everything from
    scratch, which is time consuming and confusing as we have to maintain several
    different code bases. Instead, what we can do is write a website and package it
    as a Windows, macOS, or Linux application. Now, if we want to make changes or
    develop the application further, we just develop this website further and package
    it once again. Electron is gaining traction on many other cryptocurrency projects
    as well.


    Finally, we have a JavaScript library. It provides coding tools and APIs for other
    developers. Suppose, as a developer, we want to create a website to interact with
    the Iota protocol. We can use their JavaScript libraries to invoke various Iota
    functionalities.


    In the next section, we will see how to purchase and store Iota cryptocurrency.'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# # Purchase and storage of Iota


    Presently, Iota cannot be purchased directly using fiat currency. It can be bought
    from crypto-exchanges such as Bitfinex or Binance using ethers or bitcoin.


    The following steps need to be followed to buy Iota:


    +   1. Create an account on coinbase.

    +   2. Buy BTC or ETH in coinbase.

    +   3. Open an account on Bitfinex or Binance.

    +   4. Transfer some BTC or ETH to Bitfinex or Binance.

    +   5. Buy Iota by placing an order bid using BTC or ETH. Iota is sold in millions
    called MIOTA.


    Storage of Iota is pretty straightforward by nature. We can store the Iota in
    the Iota Wallet as provided in the Iota GitHub. Or we can use paper wallets as
    provided in the following link: https://arancauchi.github.io/IOTA-Paper-Wallet/.


    To create a paper wallet, we need to pass the 81-digit code and generate a QR
    code, as show in *Figure 11.10*. We can then take a printout of the wallet and
    store it in a safe place:'
  merge: -1
  img_proc: true
