  md: '# # A Noob''s Guide to DApps and DAO


    This chapter develops our understanding of decentralized applications from a developer''s
    perspective. We will introduce the high-level steps to develop a decentralized
    application. Then we will explore a unique marketplace called ethercast, which
    serves as an aggregator of several DApps. We will then move on to design a **Decentralized
    Autonomous Organization (DAO)**. We will conclude this chapter by looking back
    at the infamous DAO hack, which led to the ETH/ETC split, from a purely technical
    perspective.


    After studying this chapter, you will be able to:


    +   - Identify the generic steps to develop DApps

    +   - Understand DApp architecture

    +   - Achieve basic knowledge about ethercast

    +   - Design a simple DAO from scratch

    +   - Understand the DAO hack'
