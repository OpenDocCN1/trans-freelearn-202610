  md: '# Forecasting and prediction market


    Blockchain is about to revolutionize the prediction industry. We can place bets
    using smart contracts and the winning amount will be automatically transferred
    to our account. Any challenging event such as election results, superbowl match
    results, and world cup finalist predictions can be converted into an automated
    yet legalized game of gambling.


    App.Augur.net is an Ethereum-based prediction market platform where we can place
    bets and do money trading in terms of ether. It is completely decentralized.'
