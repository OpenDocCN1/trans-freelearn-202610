  md: '# # Designing a voting DApp


    Decentralized voting on a blockchain has many perks. It is extremely hard to tamper
    with once a candidate is voted for. In this section, we try to design a simple
    voting DApp using both the private blockchain (also known as a private testnet)
    and remix platform that was introduced in chapter 3, *Hello World of Smart Contracts*.


    At this point, it will be good to recap the difference between an EthereumJS-based
    testrpc and Geth-based testnet from chapter 2, *Grokking Ethereum*. A test RPC
    is a third-party client implementation used for testing. It is basically a Node.js-based
    Ethereum client. It simulates a full client. Whereas Geth-based testnet is an
    official full client implementation in the Go language, having a command-line
    interface, which can be used to connect to the real blockchain or on public testnet
    blockchains, such as Ropsten, or on a private testnet blockchain like ours.


    The voting DApp we will develop has three basic functions:


    +   - It initializes a list of candidates

    +   - It lets anyone vote for the candidate

    +   - It displays the total vote of each candidate


    We are using the solidity programming language to write our voting DApp smart
    contract. The contract has been named the simple voting Dapp. It has a constructor
    function to initialize an array of candidates. We also have two methods, one to
    return the total number of votes received by a candidate and another one to increment
    the vote count of a candidate. To instantiate this smart contract after deploying
    on the blockchain, we need to pass the input parameter as an array of candidate
    names, who will be'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'assigned specific addresses. In our example input, we have used three candidates
    [Tom, Dick, and Harry].


    What is more interesting about this DApp is that the constructor can be invoked
    once and only once when we deploy it on the blockchain. Unlike a normal web application,
    where every new deployment with the same name overwrites the old code, the deployed
    code in a blockchain is immutable. That is, if we modify our contract and deploy
    again, the old contract will still survive in the blockchain untouched, along
    with all the store data. The new deployment will just create a separate new instance
    of the original contract.


    A corporate version of the voting app has also been provided in the code archives
    with the name `corporateVotingDapp.sol` with detailed comments of each function.
    This version combines the coin buying capability of a DAO along with the voting
    functionality. In this smart contract, we pass two more parameters along with
    the array of candidate names. These are the amount of total coins available for
    the voters or electorates, and the unit of each token in ether.


    For example an input of `10000,1, [Tom, Dick, and Harry]` means we have a voting
    contract that has at maximum, 10,000 tokens for the voters of 1 ether per token
    and voters can vote for three candidates. If Tom is voted for using 100 coins
    by one voter then the other voters can vote for any one of the three candidates
    using the remaining 9,900 tokens.


    *Figure 5.8* depicts the solidity smart contract of the voting DApp with necessary
