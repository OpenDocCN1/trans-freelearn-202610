- pgno: 199
  md: '# # Class properties of a contract


    Solidity is often called a contract-oriented language, as every operation that
    can occur on the blockchain must reside inside the scope of a contract. A contract
    serves as a template definition for the functions and variables, very similar
    to the definition inside a class for an object-oriented language. Like a class,
    contracts can inherit from other contracts.


    A contract can contain declarations ranging from functions and function modifiers,
