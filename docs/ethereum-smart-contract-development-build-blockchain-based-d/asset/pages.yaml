- pgno: 264
  md: '# # Enterprise Use Cases


    This chapter focuses on how blockchain and smart contracts have penetrated the
    industry. We start this chapter by introducing the concept of the Internet of
    Money, and explore how smart contracts have started affecting technology, society,
    and economics in various industries. Specifically, we will explore 18 use cases
    for blockchains and 12 use cases for smart contracts. We conclude this chapter
    by designing various modules of a command-line interface-based, decentralized,
    microblogging platform and deploy it over a private blockchain.


    After studying this chapter, you will be able to:


    +   - Appreciate the concept of the Internet of Money

    +   - Know about various use cases for smart contracts and blockchains

    +   - Understand the building blocks of a microblogging DApp

    +   - Explore the security and administrative properties of a DApp


    > > “What you seek is seeking you”

    > >

    > > — Rumi


    Before we start this chapter, I want you to take a step back and ponder on the
    preceding quote, which was said by the famous 13th-century, Persian, Sunni Muslim
    poet, Jalal ad-Din Muhammad Rumi. This notoriously simple six-word quote carries
    a mystic yet deep philosophy within it.


    For instance, if you are seeking a life partner, there is someone out there in
    this world who is seeking a person exactly like you.


    Let us take one of the simplest technical examples now. We all search on'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'the web, right? We normally Google it (never heard anyone say, let''s Bing
    it, or let''s duck duck go it, though that is perfectly normal), and that too,
    is free. But in this web economy, when we are getting something for free, we must
    understand that we are a product. You might ask, for whom? The advertisers, the
    market researchers, the product designers—for them, we are the product. The links
    we click, the products we view, the transactions we make, the quotes we like,
    the songs we hear—literally every action we make on the web is being recorded.
    Even the tiniest message we type in our favorite chat apps to send to our friends,
    and then delete to send a more formal one, that too gets recorded. These are sold
    to companies, data giants, and product makers who get a glimpse of our truly private
    psychology. They use our psychology as a product to create products or ads for
    those products, which we will eventually click and generate revenue for the search
    engine companies. So, the more we seek on the web, the more it seeks us.


    For a privacy-sensitive human being, this is certainly alarming. An obvious question
    will arise in our mind, *"Why would my individuality profit someone else other
    than me?"* Of course, we are taking a service from a platform, but that does not
    have to be at the expense of our individuality or privacy. This is the very idea
    that planted the seed of decentralization and decentralized applications, where
    our individuality is our responsibility and no middleman/machine should profit
    from it without our explicit permission.


    Seeking love and knowledge is fine, but we have a bigger monster within us to
    feed. It is the hunger to be recognized, to be respected in society, to be someone
    in power, and in control of the internal workings of the society we live in. And
    somehow, it has transpired, through generations of human civilization, that seeking
    and earning money brings us this recognition. Although the other two, knowledge
    and love, can accumulate and provide much more recognition, most ordinary mortals
    feel that money can bring us fame in our own lifetime. And so our symbiosis with
    the banks began, because somehow it made us believe that our money is safe with
    them and can grow if we keep it there for a long time. Then came the stock markets,
    a type of legalized and regulated gambling, which can sometimes multiple our money,
    provided we are willing to risk it all. Then came the'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'derivatives, the bonds, the futures, and the regulations and compliances; the
    financial police who would guard us from going astray with so many lucrative,
    yet risky, offers.


    But on the ill-fated day of September 15, 2008, when a 150-year-old investment
    bank named Lehman Brothers filed for bankruptcy, the entire world realized that
    banks are not as safe as they claim to be. However, people still needed money,
    and banks had to stay. On January 3, 2009, an anonymous entity, Satoshi Nakamoto,
    introduced the concept of bitcoin, which started a power struggle between common
    people and the so-called regulated institution of finance.


    These financial institutions first thought that if they just ignored this revolution,
    this crypto-economy would soon die a natural death. Like a tortoise retreating
    back into its shell, the financial world started to ignore this on-going revolution.
    But cryptocurrency, over the last eight years, has grown. The blockchain technology
    has not only brought money to the internet, but the introduction of smart contracts
    has made money programmable.


    Our seeking of money has brought us to a new paradigm, the Internet of Money.
    Here, money is not just a medium of exchange but also a medium of expression.
    In the previous chapter, we discussed ICOs, which were basically human ideas converted
    into cryptocurrency tokens. We are at a juncture of technology where money is
    seeking us. It is seeking us by transforming our ideas into tokens that people
    can buy. If our idea triumphs, so do our tokens.


    This newfound freedom in the Internet of Money, without any widely accepted framework
    or guidelines, has resulted in a very volatile situation in the tech industry.
    Programmable money is not equivalent to some new web app or software. The very
    concept of immutability on a blockchain makes the design of the Internet of Money
    a nightmare for enterprise architects. They can no longer think as data scientists
    or software developers. They must think more like firmware developers or construction
    workers. It is like making a customized home for a living. We can propose whatever
    changes we want during the floor planning, but once'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'it is approved and the home is built, it is extremely difficult to modify a
    room without making changes to the original floor plan.


    Again, if the original floor plan has some weak points and vulnerable blind spots,
    a burglar can barge in and steal all the valuables, as we saw in the Ethereum
    hacks of DAO and Parity. For this technology, we need to take a step backward
    and encourage monolith architectures, rather than modular ones, as the former
    are compact and less vulnerable to hacks:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_267_0.png)


    Figure 9.1: Blockchain use cases'
  merge: -1
  img_proc: true
