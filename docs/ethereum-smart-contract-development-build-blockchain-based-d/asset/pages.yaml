- pgno: 331
  md: '# Dark web marketplace


    To really understand the dark web, we need to differentiate it from the normal
    web. By normal web, we imply the surface web that we browse using a web page address,
    or search using natural language typed into search engines, such as Google or
    Bing. There is yet another type of web called the deep web. Figure 10.4 depicts
    the three strata of the web using an iceberg analogy:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_331_0.png)


    Figure 10.4: Web kernel diagram and iceberg analogy


    In simple words, the surface web is anything on the internet that a search engine
    can find and index. The deep web is something a search engine cannot find. To
    understand intuitively how search engines find a page, we can do a manual exercise
    by going to any news channel website and then keep clicking on the articles as
    they come up.


    So, we navigate throughout the article by clicking on some web links, which lands
    us to a new page of articles. This is what, in search engine parlance, is called
    web crawling. Now, there are many other sites such as Expedia or Airbnb, which
    cannot be fully explored just by crawling. We need to provide inputs such as flight
    date, departure city, arrival city, economy or business class, and number of hotel
    rooms required in order to'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'move through such pages. They even ask for our name, email, and contacts, which
    then takes us to new web content. Such websites cannot be explored using a search
    engine alone. These are parts of the deep web.


    The dark web can be considered as a subset of the deep web that has been intentionally
    hidden and is inaccessible through standard web browsers. So, even though both
    the surface web and deep web can be explored using a standard browser such as
    Chrome, Firefox, IE, Opera, or Safari, to navigate through the dark web we need
    a totally new browser called the Tor browser (there is also I2P and others, but
    Tor is more prominent). The website address ends with `.onion` suggesting the
    file type.


    *Figure 10.5* shows such an `.onion` site called hidden wiki using the Tor browser.
    Note that, the opposite is true; that is, Tor can be used to browse the surface
    web pages:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_332_0.png)


    Figure 10.5: Hidden Wiki on the dark web


    As you can observe in the hidden wiki, the dark web is full of illegal ongoing
    activities, ranging from drug dealing and counterfeiting, to hired assassination
    and illegal arms purchase.'
  merge: -1
  img_proc: true
- pgno: 333
  md: 'Figure 10.6 represents one such site for fake UK passports. Also, you can notice
    the payment is strictly using cryptocurrencies, such as bitcoin. For many sites,
    Ethereum is also accepted. This is because of the anonymity of the source that
    cryptocurrencies enjoy:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_333_0.png)


    Figure 10.6: Fake ID offering UK passport


    Unfortunately, such sites are pretty short-lived and keep changing domain names.
    A study by Virgil Griffith et al. a team of researchers at MIT, has revealed that
    more than 87% .onion web pages that they traced while crawling get lost. They
    also suggested that the word "web" in dark web is'
  merge: -1
  img_proc: true
- pgno: 334
  md: 'a misnomer and it is apparently a set of largely isolated dark silos.


    Such an isolated setup makes the dark web a safe haven for money launderers. Money
    laundering looks complex but can be broken down into three stages, as quoted in
    the **Association of Certified Anti-Money Laundering Specialists (ACAMS)** guide:


    +   1. **Stage one.**

    +      **Placement**: The physical disposal of cash or other assets derived from
    criminal activity

    +   2. **Stage two.**

    +      **Layering**: The separation of illicit proceeds from their source by layers
    of financial transactions intended to conceal the origin of the proceeds

    +   3. **Stage three.**

    +      **Integration**: Supplying apparent legitimacy to illicit wealth through
    the re-entry of the funds into the economy, in what appears to be normal business
    or personal transactions


    For example, a drug dealer can sell their products anonymously using a flash sale
    on the dark web to their customers worldwide by charging them in Ethereum or bitcoins.
    Then these coins can be used in cryptocurrency trading or you can just get them
    converted into some other cryptocurrency in the exchanges. Later these "white"
    currencies from the exchanges can be converted back to fiat money.


    This brings us to the end of this chapter. By now you will have realized that
    the properties that keep cryptocurrencies and blockchains a state-of-the-art technology
    and boon to humanity, can also be used for many illegal activities. It is our
    onus to treat this Pandora''s box as the benefit of mankind.'
  merge: -1
  img_proc: true
