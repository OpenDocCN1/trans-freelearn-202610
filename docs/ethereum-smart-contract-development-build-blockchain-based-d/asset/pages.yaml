  md: '# Smart contract auditing and compliance


    Presently, audits of a smart contract are limited to peer-reviewing by a senior
    developer. Although a well-documented framework is yet to come out for auditing
    smart contract code in the blockchain community, there has been a lot of noteworthy,
    tangible progress in the research community:


    +   - XiapuLuo et al. have come out with a proprietary tool named **GAS-costly
    pattern checker (GASPER)**, using which they have identified public smart contracts
    with many types of gas-costly patterns discussed in the earlier section

    +   - Juels et al. diagnosed that smart contracts can facilitate crimes and showed
    how criminal smart contracts can be facilitated to leak confidential information,
    theft of cryptographic keys, and various real-world crimes

    +   - Atzei et al. studied a series of attacks that exploit the vulnerabilities
    of contracts to steal or tamper with assets

    +   - Zhang et al. developed TOWN CRIER, which aims to provide trustworthy data
    to smart contracts, as many applications of smart contracts need data from outside
    the blockchain

    +   - Kosba et al. have developed HAWK, which is a decentralized smart contract
    system that enables developers to code privacy-reserved smart contracts

    +   - Luu et al. have developed OYENTE, a novel, symbolic,'
  merge: -1
