- pgno: 147
  md: '# Architecture of a DApp


    *Figure 4.1 represents an Ethereum DApp at a high level. If you notice, every
    client browser communicates with its own instance of the application. There is
    no central server to which all clients connect. This means, every person who wants
    to interact with a decentralized application will need a full copy of the blockchain
    running on their computer/phone, and so on. That means, before we can use an application,
    we have to download the entire blockchain and then start using the application.
    This might sound ridiculous at first but it has the advantage of not relying on
    a single central server that might disappear tomorrow, or start charging us third-party
    commissions.*


    To build web-based DApps, Ethereum comes with a handy JavaScript library called
    web3.js, which connects to our blockchain node using **remote procedure calls
    (RPCs)**. So, we can just include this library in our favorite JavaScript frameworks,
    such as ReactJS or AngularJS, and start developing our DApp:'
  merge: -1
  img_proc: true
