  md: '# Raising an issue on GitHub


    When you have a code bug, before raising any issue on GitHub, please have a check
    on the Ethereum documentations, freely available via any search engine. Then,
    ask the same in the Ethereum stack exchange. In most of the cases, you will not
    be the lone person who has faced that bug. So, the solution to your problem might
    be already out there on the web. The last resort is to raise an issue in the GitHub.
    GitHub is a code repository with version control freely available to all. Most
    of the blockchain related source codes are available on GitHub. I will show you
    how I raised an issue for the LETH wallet app for Android, which was discussed
    in Chapter 2, Grokking Ethereum:


    +   - **Identifying issue**: While uploading picture files to the chat window,
    which uses whisper communication protocol, there is no option to provide a message
    or caption, as we can do in chat services like WhatsApp.

    +   - **Logging issue**: Create a free GitHub account and log into the LETH GitHub
    repository page, as shown in Figure 3.19. Click the New issue button to log in
    the issue. Once the issue is described with any necessary images and descriptions,
    click the Submit new issue button, as shown in Figure 3.20, to generate the new
    issue, as I had generated in Figure 3.19. You can check the issue details in the
    link, https://github.com/inzhoop-co/LETH/issues/31:'
