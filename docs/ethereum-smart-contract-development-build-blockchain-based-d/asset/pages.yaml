- pgno: 28
  md: '# The Byzantine Generals'' Problem


    Imagine a time during the dark ages, where a pirate ship is under attack. There
    are 200 pirates aboard the pirate ship surrounded by six army ships of 50 warriors
    each, who''ve anchored, surrounding the pirate ship. Each army ship is commanded
    by a captain. The 300 warriors can easily overpower the 200 pirates aboard the
    pirate ship. However, if they don''t all attack simultaneously, there is a very
    real risk that the warriors will be outnumbered by the pirates and they''ll go
    on to lose the battle.


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_28_0.png)


    Figure 1.2: Pirate ship (200) surrounded by arm ship (50)


    So, how can the captains all agree on the same time to attack the pirate ship?
    These days, we''d simply need a quick group video-conference call, and the captains
    would have to agree to attack at 22:00 hours (10 PM).


    However, back in the dark ages, things were a little more complicated:


    +   - The 22:00 attack message could only be passed on by a sailor on a small
    boat. He has to sail around each army ship, visiting each'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'captain in turn to confirm.


    +   - Any captain may be a traitor and in league with the pirates in the pirate
    ship.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Losing strategy


    Captain 1 decides to attack at 22:00. He sends his sailor out with the message
    (22:00 attack) to deliver to Captain 2. Upon arrival, Captain 2 reads the message,
    notes the time of the attack, and sends a message that also says 22:00 attack.
    He sends the sailor on to share the message with Captain 3. However, we have a
    problem. Captain 3 is a traitor. He wants the attack to fail. So, when he gets
    the message, he rips it up and replaces it with a new message that says 21:00
    attack (9 PM). The sailor continues unaware. Captain 4 now receives a message
    saying 21:00 attack. He notes the time, signs the message saying 21:00 attack
    and sends this on to Captain 5, who then sends the same message to Captain 6.
    Now, the message has gone around everyone, but we have a problem. The dishonest
    captain has disrupted the result. We now have three captains (4, 5, and 6) with
    150 warriors attacking the pirate ship at 21:00. Expecting others to join them,
    they instead get outnumbered and overpowered by the 200 pirates. The victorious
    pirates now stream out of the pirate ship and join forces with the treacherous
    Captain 3. Suddenly, the two remaining captains (1 and 2) have only 100 warriors
    and find themselves fighting 200 pirates plus 50 traitors. Unfortunately, the
    pirates and traitors win.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Winning strategy


    Captain 1 wants to send the same message (attack at 22:00). However, this time,
    there are two new rules he must obey:


    +   - He must spend 10 minutes preparing any new message for it to be valid

    +   - He must include the history of every previous message in every new message


    So, let''s see what happens this time. As before, Captain 1 sends the message
    (22:00 attack) with the sailor on the boat. This time, however, it is different
    for Captain 2, because he knows two things for certain:


    +   - The message must have taken 10 minutes to prepare

    +   - There are no previous messages, so it must be the truth (even if Captain
    1 is a traitor and put in the wrong time, it doesn''t matter; if the majority
    of captains followed this suggestion and went with a 22:00 attack time, they would
    still outnumber those in the pirate ship and win the battle)


    So, now it is time for Captain 2 to send a message. As required, he spends 10
    minutes preparing the new message and he embeds Captain 1''s message into his
    own. The sailor then sets off with this message (now in fact, it is two messages
    chained together as the second has the first embedded within it). Now it gets
    to Captain 3.


    Remember, he''s the traitor. So, what does he do? Last time, he changed the'
  merge: -1
  img_proc: true
- pgno: 32
  md: "message to 21:00 attack so that captains 4, 5, and 6 would attack early and\
    \ get overpowered. Now, however, he can't because, under the new rules, he has\
    \ only 10 minutes to prepare a message for Captain 4. He has two options:\n\n\
    +   1. Cheat by changing the message to 21:00 attack. To do this, he needs to\
    \ (a) spend 10 minutes creating his message and then (b) spend an extra 2 x 10\
    \ minutes working to create replacement 21:00 attack messages from Captains 1\
    \ and 2 to embed these into his message and carry out this 30 minutes of work\
    \ within the next 10 minutes to avoid the other captains knowing that he's a traitor.\n\
    +   \n+   2. Admit defeat and prepare the 22:00 attack message during those 10\
    \ minutes.\n\nIn other words, every captain has got no more than 10 minutes to\
    \ provide the next captain with something that would take more than 10 minutes\
    \ to fake if they were trying to be dishonest. If they can't deliver it within\
    \ 10 minutes, everyone knows they're dishonest and ignores them, rendering their\
    \ attempts to mislead others useless."
  merge: -1
  img_proc: true
- pgno: 33
  md: '# The CAP theorem


    Before stating the CAP theorem, let''s try to understand consistency, availability,
    and partition tolerance using a real-world problem.


    As a married person, I know how pathetic a person''s life can become if they forget
    important dates like the birthday and anniversary of their spouse (in most cases,
    the husband is the culprit, but that is a separate discussion). One of my friends,
    let''s call him Kaushik, saw an opportunity in this and opened up a start-up,
    HappySpouse.com, to address this issue. During a typical business day, Kaushik
    (K) and his customer (C) would have the following conversation:


    K: Hello from HappySpouse.com. How may I help you?


    C: Hey, I want you to remember my wife''s birthday.


    K: Sure! When is it?


    C: September 3.


    K: (Writing it down on a page exclusive for C.) Stored. Call me any time to remind
    you of your spouse''s birthday again!


    C: Thank you!


    K: No problem! Your credit card has been charged with $0.05.


    Kaushik''s idea was so simple, needed nothing but a notebook and phone, yet so
    effective that it rolled off like an avalanche. VC firms started pouring in funds.
    He also started getting hundreds of calls every day. That''s where the problem
    started. Now, more and more of his customers had to wait in the queue to speak
    to him. Most of them even hung up, tired'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'of the waiting tone. Besides, when he was sick for a day and could not come
    to work, he lost a whole day of business. Not to mention all those unsatisfied
    customers who wanted information on that day. So, Kaushik decided to scale up
    and bring in his wife to help him.


    He started with a simple plan to solve his availability to customers:


    +   1. He and his wife both got an extension phone

    +   2. Customers still dialed the same number

    +   3. A PBX routed the customer calls to whoever was free at that moment


    A few weeks went by smoothly. One fine morning, he got a call from one of his
    old customers, Joey (J):


    J: Hello, am I speaking to Kaushik from HappySpouse.com?


    K: Hi Joey, great you remembered us. What can I do for you?


    J: Can you tell me when our anniversary was?


    K: Sure. 1 sec, Joey (looking up in his notebook, there was no entry on Joey''s
    page). Joey, I have only your spouse''s birthday here.


    J: Holy cow! I just called you guys yesterday! (Cuts the call!)


    How did that happen? Was Joey lying? Kaushik thought about it for a second and
    the reason hit him! Yesterday, did Joey''s call reach his wife? He goes to his
    wife''s desk and checks her notebook. Sure enough, it''s there. He tells this
    to his wife and she realizes the problem too. What a terrible flaw in this distributed
    setup! This setup was not consistent!


    Now, they decided that whenever either of them got a call to note, they would
    update each other''s notebook. In that way, they would both have the same up-to-date
    information. Even if one of them was offwork, the other'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'would email the updates so that the person could come the next day and jot
    down the updates. That way, they would be both consistent and available.


    However, fate has its own plans. Due to this hectic schedule, Kaushik himself
    forgot his wife''s birthday. Now his wife was angry with him and would not share
    any updates, creating a partition. To patch things up, Kaushik had to make himself
    unavailable to clients and make up to his wife.


    Let''s look at the CAP theorem now. It states that when we are designing a distributed
    system, we cannot achieve all three of consistency, availability, and partition
    tolerance. We can pick only two of CAP and sacrifice the third, that is CA, AP,
    or CP, where:


