- pgno: 204
  md: '# Inheritance


    Solidity imitates the Python language, in the context of inheritance. It supports
    general inheritance, multiple inheritance, and polymorphism. In simple words,
    inheritance is the property where a contract copies properties from a parent contract.
    In the case of multiple inheritance, a contract copies properties from more than
    one contract. Polymorphism denotes a general contract that can be reused by many
    other contracts.


    For example, a contract, eat(), can be used by both human() contract and birds(),
    as well as animal() contracts. In solidity, IS is the keyword used for inheritance
    of contracts.


    Multiple inheritances sometimes lead to deadlock problems. Figure 6.6 illustrates
    this problem in terms of solidity, which gives the peculiar error, Linearization
    of inheritance graph impossible. This happens because c requests Y to override
    D. This is done by specifying D and Y in the order D, Y at line 6. But D itself
    has requested to override Y at line 5. This results in a contradiction that cannot
    be resolved. Hence, solidity follows Python standards and forces only specific
    orders to be followed, or else gives rise to such an error:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_204_0.png)


    Figure 6.6: Deadlock problem in solidity'
  merge: -1
