  md: '# Mining ethers in a private blockchain


    We go back to a new Cygwin command window and type $ geth attach to attach the
    geth to the IPC, as shown in Figure 3.37. Then we type $ miner.start(1);. Please
    note that the background geth window, which was started with datadir, should be
    still running. It takes a while to mine the blocks and then we can stop the miner
    using the command $ miner.stop();. To check the intermediate steps, we can have
    an additional step before we start the miner in geth. The command is $ debug.verbosity(4);.


    Figure 3.37 also depicts the number of blocks (100) we have mined and the ethers
    (500.00) we earned as a reward. Please note that these ethers have no market value,
    as they are mined on our private blockchain and not on the main public Ethereum
    blockchain. However, we can use these ethers to deploy smart contracts, which
    we will illustrate in the next section:


