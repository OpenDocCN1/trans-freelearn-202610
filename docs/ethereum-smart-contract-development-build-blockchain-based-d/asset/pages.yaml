    Web did the media industry. It is destroying regulations and compliances arising
    due to borders, as cryptocurrencies such as bitcoin and Ethereum are making cross
    border transactions in seconds, with substantially lower transfer fees. This is
    connecting the investors of developed countries to the innovators of developing
    countries. Banks such as Barclays are implementing blockchains to strengthen their
    operational capabilities. Banks are also seed-funding and investing in blockchain-based
    start-ups.'
