  md: '# # Art and music


    Illegal art auctions and music piracy has always been a challenge to the entertainment
    industry. Coupled with manager and record company commissions, a serious percentage
    of money has been stolen from artists. The blockchain provides a transparent system
    of direct payment to the artist from the consumer, and the use of unique signatures
    to store the identity of an art piece.


    Maecenas is an open blockchain platform for accessing and auctioning fine art
    in a decentralized manner. Mycelia is an online music platform that pays artists
    directly from consumers.'
