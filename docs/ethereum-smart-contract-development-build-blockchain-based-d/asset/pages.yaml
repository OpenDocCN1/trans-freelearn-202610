    previous block as well as the root hash of the present block-action, eventually
    forming a chain of hash-blocks. It might be not very obvious, but such a Merkle
    tree structure does not require a central server; each block can come from physically
    separate clients. Hence, a blockchain is also a distributed system. I can feel
    you are starting to feel confused right now. Just look at Figure 1.5 to mitigate
    some of your confusion. We will discuss timestamp and nonce later, when we explore
    inside a block.


