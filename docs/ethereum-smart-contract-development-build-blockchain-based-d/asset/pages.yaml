- pgno: 225
  md: '# Web3.js in the Ethereum ecosystem


    Dale Carnegie, the famous self-improvement trainer, said that financial success
    is due to 15 percent technical skill, the remaining 85 percent being due to the
    ability to express ideas and arouse enthusiasm among people. Blockchain might
    be a cutting-edge technology backed by sound computing principles, but to make
    it a financial success we need to have mass adoption among people. For this, we
    need an interface to which everyone can relate.


    Web3.js is one technology that can help us in this area of concern. Web3.js provides
    JavaScript bindings to Ethereum, which can then be used to build intuitive user
    interfaces using the web stack.


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_225_0.png)


    Figure 7.1: Web3.js interacting with a private blockchain via geth


    It provides an abstraction to hide the complex internal works of smart'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'contracts on the blockchain. In simple words, a web application implemented
    in JavaScript communicates with an Ethereum node or transacts with a smart contract
    on the blockchain using the Web3.js library.


    Figure 7.1 illustrates this interaction. Figure 7.2 differentiates clearly between
    Mist, geth, and Web3.js. In this table, we can see that Mist and geth use IPC,
    whereas Web3.js uses Remote procedure calls (RPC).


    In the Ethereum ecosystem, IPC generally works locally on a computer. IPC normally
    involves geth creating an IPC pipe on our computer''s local filesystem, named
    geth.ipc. This pipe can now be used by different processes in the same computer
    to create bi-directional communication with the geth console. RPC, on the other
    hand, work across different computers, unless we strictly specify to connect with
    a localhost by using RPC endpoints as localhost: 8545 or 127.0.0.1:8545:


    | Mist | Geth | Web3.js |

    |---|---|---|

    | It is a browser | It is a command line interface | It is an API Library |

    | Mainly implemented using JavaScript | Mainly implemented in Golang | Mainly
    implemented using JavaScript |

    | It is used as a wallet and can run Dapps over Blockchain | It is a tool for
    running full ethereum Node or a Private Blockchain | It interacts with Ethereum
    node using User triggered Events |

    | Uses Inter-Process Communication (IPC) | Uses Inter-Process Communication (IPC)
    | Uses Remote Procedure Calling (RPC) |


    Figure 7.2: Mist versus geth versus Web3.js


    Interestingly, both IPC and RPC with geth and Web3.js use a common protocol called
    JSON-RPC. JavaScript Object Notation (JSON) is a lightweight data-interchange
    format for human-machine interaction. Humans find this format easy to read and
    write. Machines find this format easy to parse and generate. This data format
    is completely language independent and basically consists of two structures: a
    name-value pair and an ordered list of values.


    JSON-RPC is a stateless, lightweight RPC protocol that uses RFC 4627 as'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'the data format. **Request for Comments (RFC)** was released by IETF (refer
    to _Chapter 2, Grokking Ethereum_).


    A typical example of a JSON-RPC request is as follows:


    ```

    ```json

    {"jsonrpc":"2.0","method":"eth_coinbase","params":[],"id": 67}

    ```

    ```


    In the preceding example we have a list of four properties:


    +   - `jsonrpc`: This is a string specifying the version of the JSON-RPC protocol.
    Here, the version is `"2.0."`

    +   - `method`: This is a string that contains the method to be invoked.

    +   - `params`: This contains the parameter values to be used during the invocation
    of the method.

    +   - `id`: This is an identifier established by the client. If it is specified,
    we let the server know that we are expecting a response. Otherwise, the server
    assumes the message to be a notification.


    At the time of writing, the working version of Web3.js is 0.x.x; the 1.0 version
    is still unreleased. Once Web3.js version 1.0 is released, its library will support
    a collection of modules, as shown in _Figure 7.3_.


    Each module contributes specific functionalities to the Ethereum ecosystem:


    +   - The web3-eth module is for developing smart contracts on the Ethereum blockchain

    +   - The web3-shh module is for peer-to-peer communication using the whisper
    protocol'
  merge: -1
  img_proc: true
