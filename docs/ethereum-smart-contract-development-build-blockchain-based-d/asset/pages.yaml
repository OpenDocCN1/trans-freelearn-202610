- pgno: 344
  md: '# # Common design patterns


    Recently, my dad retired and found comfort in his passion of cooking. He has his
    own set of spices that he does not even share with my mom. From chicken to chickpeas,
    whatever dishes he prepares have a typical hint of his signature masala mix. He
    argues that the flavor is not about the spices he uses, but the pattern he applies
    to mix his spices while designing his recipes.


    So, what is a design pattern? In software engineering parlance, it is generally
    a piece of pseudo-code that represents a generic solution that can be reused while
    developing applications to avoid reinventing-wheel scenarios. A common example
    would be the functionality of passcode-based user-authentication. Most applications
    require this basic functionality and they are almost similar in design. A user
    has to first register with the application. The application then sends an OTP
    or confirmation link to set up a new passcode and registers a new user. Once a
    registered user has to log in, they have to provide a username and password to
    the application. The application then checks its registry database for this username
    and password and permits or blocks the user accordingly.


    Software design patterns are broadly classified into three categories, as shown
    in *Figure 11.1*:


    +   - **Structural:** Such patterns deal with relationships between entities,
    making it easier for these entities to work together

    +   - **Creational:** Such patterns make it easier to create objects in a way
    that suits a given situation

    +   - **Behavioral:** Such patterns are used to communicate flexibly'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'between two or more entities:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_345_0.png)


    Figure 11.1: Software design patterns


    These three categories are also called the **Gang of Four (GoF)** design patterns,
    which refers to its four authors, namely Erich Gamma, Richard Helm, Ralph Johnson,
    and John Vlissides. *Figure 11.2* briefly explains each GoF design pattern.


    In the following section, we will discuss some frequently used design patterns
    by smart contract developers on the Ethereum blockchain:'
  merge: -1
  img_proc: true
- pgno: 346
  md: '| Abstract Factory | Allows for the creation of objects without specifying
    their concrete type |

    | Builder | Used to create complex objects |

    | Factory Method | Creates objects without specifying the exact class to create
    |

    | Prototype | Creates a new object from an existing object |

    | Singleton | Ensures only one instance of an object is created |


    | Adapter | Allows for two incompatible classes to work together by wrapping an
    interface around one of the existing classes |

    | Bridge | Decouples an abstraction so two classes can vary independently |

    | Composite | Takes a group of objects into a single object |

    | Decorator | Allows for an object''s behavior to be extended dynamically at run
    time |

    | Facade | Provides a simple interface to a more complex underlying object |

    | Flyweight | Reduces the cost of complex object models |

    | Proxy | Provides a placeholder interface to an underlying object to control
    access, reduce cost, or reduce complexity |


    | Chain of Responsibility | Delegates commands to a chain of processing objects
    |

    | Command | Creates objects which encapsulate actions and parameters |

    | Interpreter | Implements a specialized language |

    | Iterator | Accesses the elements of an object sequentially without exposing
    its underlying representation |

    | Mediator | Allows loose coupling between classes by being the only class that
    has detailed knowledge of their methods |

    | Memento | Provides the ability to restore an object to its previous state |

    | Observer | Is a publish/subscribe pattern which allows a number of observer
    objects to see an event |

    | State | Allows an object to alter its behavior when its internal state changes
    |

    | Strategy | Allows one of a family of algorithms to be selected on-the-fly at
    run-time |

    | Template Method | Defines the skeleton of an algorithm as an abstract class,
    allowing its sub-classes to provide concrete behavior |

    | Vistor | Separates an algorithm from an object structure by moving the hierarchy
    of methods into one object |


    Figure 11.2: GoF design pattern summary'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# Restricting access


    Access restriction is a common functionality for smart contracts. In earlier chapters,
    we discussed how external contracts exploited the access related vulnerability
    in the Parity library contract to self-destruct the entire wallet library and
    block $300 million-worth of ethers. We can never restrict any human or computer
    from reading the contract''s state. We can make it a bit difficult by using encryption.


    The only viable thing for a developer to keep in mind is that the state of a contract
    is public, and then design it in a way without problems. We can, however, restrict
    the number of entities allowed to make modifications to a contract by using function
    modifiers on the entity addresses. Such addresses can be maintained on an **access
    control list (ACL)**, but with a caveat, that the read-only access will be available
    to anyone for a public blockchain.


    Modifiers are used to change the body of a function. If such modifiers are used,
    they prepend a check that only passes if the function is called from a certain
    address.


    This design implementation is a kind of structural design pattern.'
  merge: -1
  img_proc: true
- pgno: 348
