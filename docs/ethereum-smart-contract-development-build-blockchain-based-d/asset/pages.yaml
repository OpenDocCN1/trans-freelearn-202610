- pgno: 175
  md: '# Smart contract optimization


    In Chapter 2, Grokking Ethereum, we discussed the concept of ether and gas (recall
    the buffet and car-fuel analogy). Smart contracts that are under-optimized consume
    more gas than necessary. The creator and user of such smart contracts will always
    be over-charged while deploying and running them on the blockchain. Xiapu Luo
    et al, a group of blockchain researchers from the Hong Kong Polytechnic University
    and UEST China, have identified seven such gas-costly programming patterns that
    belong to two categories, as illustrated in Figure 5.5. The first category, useless
    code pattern, introduces additional gas cost due to the increase in bytecode size
    during the deployment and the runtime removal of bytecode. The second category
    involves expensive operations using a loop:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_175_0.png)


    Figure 5.5: Gas-costly programming patterns


    Figure 5.6 illustrates pseudo-code representing these entirely under-optimized
    code patterns. Ideally, this needs to be depicted as bytecode but'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'pseudo-code has been used for ease of understanding. Pattern 1 is an example
    of dead code because we will never reach the print statement in line 4 due to
    the `inner-if` condition at line 3 stating `y*y <20`. If you are still wondering
    what just happened, then go upward toward the `outer-if` condition at line 2 which
    states `y >5`. This means y, which is an unsigned integer, can only have values
    greater than 5, that is 6 and higher. Hence `y*y` always returns an integer equal
    or greater than 36. In other words `(36 or more) < 20` always return a `false`
    condition, so we always ignore any statement that occurs inside this `inner-if`
    condition.


    Interestingly, when the solidity compiler generates the bytecode of this logic,
    it never removes lines 3 and 4, which are practically ignored at runtime, and
    this wastes money in terms of gas consumption. Opaque predicate outcomes are identified
    without any execution. If we look into the pseudo-code of pattern 2, line 3, `y>2`
    is `true` by default; hence it is redundant. It can be removed to save gas. In
    the second category, we see that moving expensive operations out of the loop can
    save gas. For example, in the pseudo-code of pattern 3, since the variable `sumout`
    is stored in the storage, line 4 calls `SLOAD` to load `sumout` on the stack and
    a `SSTORE` to save the outcome of the `ADD` operation to the storage. Normally,
    the storage-related operations consume a lot of gas, and hence, are very expensive.
    An optimized compiler generally assigns `sumout` to a local variable `temp` that
    resides in the stack, then adds `j` to `temp` inside the loop, and finally assigns
    `temp` to `sumout` after the loop.


    Such optimization reduces the storage-related operations from 2x to just 2, that
    is, one `SLOAD` and one `SSTORE`:'
  merge: -1
  img_proc: true
