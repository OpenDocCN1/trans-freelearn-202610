- pgno: 80
  md: 'The EVM is designed to permit untrusted code from running over a global public
    blockchain based operating system.


    In order to accomplish this, the following security restrictions are imposed:


    +   - Every computational state of execution in a program is to be paid up front,
    which in turn prevents denial-of-service attacks.

    +   - Codes only interact with each other by transmitting a single, arbitrary-length
    byte array. The programs do not have access to each other''s execution state.

    +   - Program execution is isolated. A virtual machine program may access and
    modify only its own internal state and may trigger the execution of other programs
    on EVM.

    +   - Code execution is fully deterministic in nature and produce identical state
    transitions for any conforming implementation, which began in an identical state.


    The formal execution model of EVM code is surprisingly simple. While the EVM is
    running, its full computational state can be defined by the tuple (block_state,
    message, code, memory, transaction, stack, gas, and pc), where block_state is
    the global state, containing all accounts with balances and storage.


    At the start of every execution round, the current instruction is found by fetching
    the program counter (pc) code byte, and each instruction has its own definition
    in terms of how it affects the tuple.


    For example, an ADD operation pops two items from the top of the stack and pushes
    their sum, reduces gas by one, and increments pc by one; while store pops the
    top two items off the stack and inserts the second item into the contract''s storage
    at the specified index of the first item. Even though'
