  md: '# Decentralized microblogging


    In this section, we are going to explore the design of a basic Ethereum-based
    microblogging platform. Using these platforms, new users can register to get a
    personal microblogging account, which they can you to send anonymous tweets to
    a decentralized Ethereum-based private blockchain, with comments disabled by default.


    But why do we need a decentralized blockchain for tweeting, and more importantly
    why are the users anonymous? To answer this question we need to understand the
    administrative and security constraints of a normal centralized microblogging
