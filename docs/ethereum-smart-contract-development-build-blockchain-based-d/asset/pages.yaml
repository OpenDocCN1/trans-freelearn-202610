- pgno: 317
  md: '# Types of blockchain


    Before we dive into the types of blockchain, we must get familiar with the concept
    of the permission spectrum of distributed ledger technology aka DLT. A blockchain
    is a DLT and exists throughout the permission spectrum.


    To understand the permission spectrum, we need to identify the two extreme ends
    of this spectrum. At one end, we have to seek complete permission from an entity
    to participate in a consensus, and at the other extreme, we do not have to seek
    any permissions whatsoever from any entity to participate in a consensus.


    The interesting thing about the permissionless extreme is that we have no obligation
    to reveal our identity to anyone participating in the consensus. As we move toward
    complete permission, somewhere in the mid-spectrum of permission, this identity
    aspect needs to be revealed in order to participate in a consensus, just to validate
    our stakes in a consensus. As we arrive at the complete permission, we need to
    identify ourselves as well as take permission from an authority to participate
    in a consensus.


    This very ideology of any entity or authority for seeking permission endangers
    the ideas of decentralization and is a topic of serious and often heated debate
    in the blockchain community and traditional enterprise.


    Coming back to DLT, a blockchain is called a permissioned blockchain if:


    +   - It restricts the participants who can contribute to the consensus of the
    system state

    +   - Only a restricted set of identified users have rights to validate the block
    transactions'
  merge: -1
  img_proc: true
- pgno: 318
  md: '+   - An authority can restrict access to approved actors who can create smart
    contracts

    +   - Permission is required from an authority to send/receive transactions


    A permissioned blockchain ends up using consensus algorithms such as RAFT or Paxos
    (refer to Chapter 1, Blockchain Basics) because all of its participants have their
    identities revealed. The effort spent to verify blocks is not rewarded by the
    system and participants end up charging the end users for this by behaving as
    intermediaries.


    Enterprise-level financial institutions love this concept of a permissioned blockchain
    because they can enjoy the borderless transaction facility that bitcoin or other
    cryptocurrencies provide, but within their private high-speed network comes fine-grained
    access control, privacy within the approved group of participating institutions,
    and scalability on their intranet.


    Permissionless blockchains, on the other hand, are those in which:


    +   - Anyone can join the network

    +   - Anyone can participate in the process of block verification

    +   - Anyone can create a smart contract


    Ethereum and the bitcoin blockchain are great examples of a permissionless blockchains.
    The block verification process is similar to mining and is highly incentivized
    by the system. These blockchains use consensus algorithms such as PoW and may
    be PoS in the near future, where the participants might have to reveal their ownership
    to claim their stake. But participation essentially remains permissionless and
    irrespective of ownership revelation.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Figure 10.1 summarizes the key characteristics that differentiate the two extremes
    of the permission spectrum:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_319_0.png)


    Figure 10.1: Permissioned versus permissionless


    Bitcoin and Ethereum blockchains are hardened blockchain platforms. They have
    stood the test of time even after many hacks and occasional market crashes. Andreas
    Antonopoulos wrote the following about bitcoin, which is almost entirely applicable
    for Ethereum:


    > ".....is a sewer rat. It''s missing a leg. Its snout was badly mangled in an
    accident in the last year. It''s not allergic to anything. In fact, it''s probably
    got a couple of strains of bubonic plague on it which it treats like a common
    cold. You have a system that is antifragile and dynamic and robust.

    > Let''s take it, cut off its beard, take away its piercings, put it in a suit,
    call it blockchain, and present it to the board. It''s safe. It''s got borders.
    We can apply the same regulations. We can put barriers to entry and create an
    anti-competitive environment to control who has access. It will be more efficient
    than our existing banking system."


    At this point, we can introduce the three broad types of blockchain, namely public,
