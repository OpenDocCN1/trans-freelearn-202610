  md: '# # Understanding the design of DAO


    Is a DAO a smart contract? Is a DAO a DApp? Vitalik Buterin has described the
    decentralized autonomous organization as an entity that lives on the World Wide
    Web and has its own set of rules. DAO also heavily relies on hiring individuals
    to perform certain tasks that the automation itself cannot do.


    Grasping the concept of DAO can be bit tricky. From a software developer''s perspective,
    a DAO is just a piece of code, specifically a complex smart contract, or an interacting
    module comprising many simple smart contracts, which are abstracted as an organization.
    From a trader''s perspective, the closest analogy of DAO is a **Limited Liability
    Company (LLC)**. Let''s try to understand a bit about LLC. Suppose Susan has a
    great business idea and wants to open a start-up with her life-savings. Rather
    than going through the venture capitalist route to fund the rest of the money
    for doing business, she chose to go the LLC route. That way, she invites shareholders
    to own a piece of her company; whoever is willing to contribute. Again, being
    an LLC, she is immune to the personal tax axe for any profit generated by the
    LLC, which is basically a separate entity, coming under the purview of business
    tax. God forbid, if Susan''s business does not take off and suffers losses, she
    again has immunity by filing for bankruptcy, and she would not be held responsible
    for losing all the shareholders'' money, as it is an LLC. So, an LLC is basically
    a CAO, centralized autonomous organization. Hence DAO is an LLC over a decentralized
    network.


    Let''s now try to decipher what autonomous means. The very word autonomous brings
    up the memory of Arnold Schwarzenegger''s Terminator and Skynet. Yes, robotic
    autonomy can be quite exciting stuff but let me be quite blunt here. The DAO is
    autonomous but in a reactive'
  merge: -1
  img_proc: true
