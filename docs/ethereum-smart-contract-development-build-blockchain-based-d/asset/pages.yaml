- pgno: 109
  md: "# # Increment and decrement operations using Solidity\n\n*Figure 3.10* shows\
    \ the code of an increment and decrement operation in Solidity. It also has a\
    \ function that takes input, and a function, that fetches out this number once\
    \ the contract gets executed:\n\n```\npragma solidity ^0.4.11;\n// define new\
    \ contract\ncontract ArithValue{\n    uint number;\n    function ArithValue()\
    \ public {  //constructor function with default value\n        number = 100;\n\
    \    }\n    // constructor function to set new value\n    function setNumber(uint\
    \ theValue) public {\n        number = theValue;\n    }\n    // constructor function\
    \ to fetch the new value\n    function fetchNumber() public constant returns (uint)\
    \ {\n        return number;\n    }\n    // constructor function to increment by\
    \ one\n    function incrementNumber() public {\n        number=number + 1;\n \
    \   }\n    // constructor function to decrement by one\n    function decrementNumber()\
    \ public {\n        number=number - 1;\n    }\n}\n```\n\nFigure 3.10: Increment\
    \ and decrement operation using Solidity (ArithValue.sol)\n\nIsn’t this code a\
    \ bit more complex than the hello world contract? Let me walk you through this\
    \ code. The first line starts with `pragma`. As you have realized already, it\
    \ just states which version of Solidity we are about to use. In our case, we are\
    \ using version `0.4.11`. As I type, remix IDE supports versions up to 0.4.16.\n\
    \nTo understand pragma, let us go back to our brunch buffet analogy from Chapter\
    \ 2, *Grokkking Ethereum*. If I specify during the buffet reservation that I"
  merge: -1
  img_proc: true
- pgno: 110
  md: 'am a strict vegan, I am giving the buffet organizers some sort of directive,
    in advance, that I do not eat non-vegan dishes like meat, fish, poultry, or eggs.
    So, I get introduced to only those counters which serve vegan dishes when the
    gala brunch begins. Most obviously, I will be annoyed and flag it to the organizers
    if I am mistakenly served tender lamb kebabs in place of broccoli curry. Then,
    I would get my plates replaced even before touching or eating the food, no questions
    asked.


    In a similar way, pragma is a language construct that gives some sort of directive
    to the compiler about how to process its inputs. Generally, a pre-processor handles
    such language constructs and specifies compiler behavior. In our example, our
    directive is to make the compiler behave as if it is running a smart contract
    on Solidity version 0.4.11 or lower.


    So, what happens if we do not write this line? Well, nothing bad happens. A warning
    is thrown, as shown in Figure 3.11, and the code compiles just fine. However,
    it now uses the default Solidity version, 0.4.16 in our case. By analogy, we can''t
    get angry at the buffet organizers for serving me lamb kebabs if I forget to tell
    them that I am a vegan. I then somehow manage to eat the food served to me by
    avoiding the non-vegan portion and save all from further embarrassment.


    So, what is the point I am trying to make here? The point I am trying to make
    is to stick to good programming practice, so that your codes are readable to other
    programmers who might debug or enhance it in the distant future. As all of the
    source codes are open source and hosted on GitHub-like platforms, and developers
