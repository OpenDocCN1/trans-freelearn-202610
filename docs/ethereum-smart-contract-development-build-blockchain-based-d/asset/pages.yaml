  md: "# The rise and fall of DAO\n\nThe original, vulnerable DAO had many complex\
    \ contracts but the essence was the same as that of the simple DAO we created\
    \ in the previous section. In May 2016, DAO was formed by a huge crowdsourcing\
    \ of funds, where stakeholders bought Initial **coin offers (ICO)** worth more\
    \ than 150 million USD. But in the next month, June 2016, a hacker (one of the\
    \ users) exploited the vulnerability to siphon out around 50 million to their\
    \ own wallet. This amount was later taken back by blockchain reorganization but\
    \ led to the hard fork of ETH/ETC. Calling this a \"hack\" is technically a misnomer\
    \ because there was no break-and-enter violation of the fundraiser. It just exploited\
    \ a vulnerable line of code logic present in the DAOFundraiser contract by changing\
    \ the wallet logic.\n\nThis is quite possible because wallets are normally separate\
    \ modules and can have any custom logic and interface. Figure 4.10 represents\
    \ the function block that is vulnerable to an exploit. Please note, we have not\
    \ made any changes to the DAO contract apart from comment lines:\n\n```\nfunction\
    \ withdrawAllMyCoins(){\n    uint withdrawAmount = balances[msg.sender];\n   \
    \ TypicalWallet wallet = TypicalWallet(msg.sender);\n    wallet.payout.value(withdrawAmount)();\n\
    \    //vulnerable\n    balances[msg.sender] = 0;\n}\n```\n\nFigure 4.10: Vulnerability\
    \ in simple DAO\n\nLet's now write a malicious wallet, which is basically the\
    \ exploit logic inside the old TypicalWallet. Figure 4.11 represents the code\
    \ logic:"
  merge: -1
  img_proc: true
