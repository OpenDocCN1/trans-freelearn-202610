- pgno: 77
  md: 'communication.


    By technical definition, whisper is a messaging system with multi **distributed
    hash table (DHT)**, with routing privacy acting as a companion protocol to the
    Ethereum blockchain. Any normal communication protocol has a fundamental aim to
    maximize bandwidth and minimize latency. However, whisper as a communication protocol
    has only one aim: to nullify leakage of metadata and achieve true darkness, where
    no third party can eavesdrop while two peers are communicating. For this, whisper
    is willing to give up on both bandwidth and latency constraints. Whisper operates
    in a user-configurable manner with regard to how much information the communicating
    nodes are willing to leak concerning the decentralized application content that
    ultimately tracks the user activities.


    Whisper is based on two key concepts: messages and envelopes. If whisper is considered
    a datagram messaging service, then an envelope represents an un-encrypted data
    format, comprehensible by a node, which carries the encrypted message datagram
    inside it. An envelope consists of original **time to live (TTL**, in seconds),
    the absolute time to expiry (UNIX system time), the encrypted message data field,
    which is the actual payload, topics (cryptographically secure, probabilistic partial
    classifications of message), and nonce, an arbitrary value. This nonce is used
    for the PoW to judge the efforts of a peer. The message has a binary flag for
    signature with an unfixed payload.


    *Figure 2.9 illustrates these two concepts for further clarity:*


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_77_0.png)


    Figure 2.9: Whisper message inside an envelope'
