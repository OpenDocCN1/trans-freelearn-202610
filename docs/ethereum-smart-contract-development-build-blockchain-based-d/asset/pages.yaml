  md: '# Arbitrage trading for cryptocurrencies


    Ajay was an orphan. We were high school friends. To support his studies, he used
    to do odd jobs. Early in the morning, he used to sell vegetables; at night, he
    sold bangles. He could not complete his studies and graduate due to the excessive
    commute time. Fast forward 20 years: he runs an event management business and
    owns two bungalows and three sedans, all of which are rented for event functions.
    He still lives in the one-story apartment from his childhood days. He does not
    pay rent anymore, as he has bought it from the owner and paid in cash


    We met a few days ago in one of his bungalows where a third-party was hosting
    a dinner party. I casually asked him what made him tick. He told me that, firstly,
    he never took any loans. He does not have a credit card, even now. Secondly, the
    railway tracks.


    You see, our house is very near to a train station. We could literally hear the
    whistles of the trains every night. Ajay told me he made the bulk of his money
    during school days. The station has two-way rail tracks, and local trains commuted
    every half an hour from the city junction to remote villages.


    He used to buy vegetables from train vendors who sat on the right platform and
    sold them to morning walkers and joggers on the left platform.


    Our school was on the left side. When the school bell rang he used to go to buy
    bangles and then return home. Once twilight began to set in, he came out with
    bangles near a temple just beside the right platform.


    Ajay, without any formal business training, knew exactly what arbitrage'
  merge: -1
