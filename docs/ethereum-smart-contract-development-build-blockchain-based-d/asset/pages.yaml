    For example, the current bitcoin version is 2.


    | Field | Purpose | Updated when... | Size (Bytes) |

    |---|---|---|---|

    | Version | Block version number | You upgrade the software and it specifies a
    new version | 4 |

    | hashPrevBlock | 256-bit hash of the previous block header | A new block comes
