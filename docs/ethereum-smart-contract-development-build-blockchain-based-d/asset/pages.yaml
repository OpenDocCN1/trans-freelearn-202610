  md: '# Optimizer and debugging options


    In the previous chapter, we studied how gas-costly coding patterns are classified
    into two categories in terms of smart contract optimization. In this section,
    we will try to understand how the internal optimizer of the solidity compiler
    works. The sole aim of this optimizer is to generate assembly opcodes and, subsequently,
    machine code from high-level programming constructs in a way that reduces the
    gas cost during runtime.


    We will go through a high-level view of the optimizer, take on a simple contract,
    and see how our assembly opcodes are generated in the presence and absence of
    an optimizer. This will also serve as an option to debugging a solidity smart
    contract for better performance in terms of gas-cost.


    So what happens in a solidity optimizer when it is fed with a piece of code? It
    basically splits the sequence of instructions into blocks of atomic instructions
    at JUMPS and JUMPDESTS opcodes. It operates on the assembly so that it can be
    used by other languages as well.


    What actually happens inside these atomic blocks of instructions? These blocks
    are analyzed and every modification to memory, the stack, or storage is recorded
    as an expression. These expressions consist of an instruction and a list of arguments
    that are basically pointers to another expression.


    The main motive is to find equivalent expressions and club them into an expression
    class. This is a recursive activity and, at the end of this process, we know which
    expression has to be on the EVM stack and have a list of storage and memory modifications.
    This metadata about a block of instructions is stored together with the atomic
    block linking them together.'
  merge: -1
  img_proc: true
- pgno: 212
  md: "Apart from this, information about the memory, storage, and the stack configuration\
    \ is forwarded to the next block. We can even build a **control flow graph (CFG)**\
    \ of the entire program if we know the targets of all `JUMP` and `JUMPI` instructions.\n\
    \nAt last, the code in each block is completely regenerated and a dependency graph\
    \ is developed from such expressions. These expressions are then placed on the\
    \ stack at the end of the block. Any operation that is not part of this dependency\
    \ graph is essentially removed. The code is now generated in the order they were\
    \ present in the original solidity code. This applies to the modifications to\
    \ memory and storage as well. Finally, all these values that are generated need\
    \ to be on the stack in the correct place. *Figure 6.8* illustrates an optimizer\
    \ output to the EVM after doing all the preceding steps in the background to reduce\
    \ the overall gas-cost at runtime:\n\n```\n```solidity\n// code snippet fed to\
    \ optimizer\nvar x = 8;\ndata[8] = 10;\nif (data[x] != x + 2)  // data[8] != 6+2\
    \ is false condition\n    return 3;\nelse\n    return 1;\n\n// optimizer returns\
    \ to assembly to reduce gas-cost\ndata[8] = 10;\nreturn 1;\n```\n```\n\nFigure\
    \ 6.8: Illustration of solidity optimizer output to EVM\n\nNow that we have a\
    \ high-level view of how the solidity optimizer works when fed with a solidity\
    \ code snippet, let us go through the assembly instructions that get generated\
    \ in the presence, as well as in the absence, of a code optimizer. *Figure 6.9*\
    \ represents the solidity contract along with the assembly opcode that is getting\
    \ generated. As you can see, a lot of changes to the assembly opcodes are generated\
    \ due to `optimizer-off`. Along with the events described in the last section,\
    \ this is also an effective debugging option:"
  merge: -1
  img_proc: true
