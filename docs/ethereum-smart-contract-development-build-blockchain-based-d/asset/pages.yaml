  md: '# Playful privacy


    You might have noticed that throughout the previous chapters, all of the examples
    were coded over a private blockchain, which we created using a genesis block in
    chapter 3, *Hello World of Smart Contracts*. This was done because private blockchains
    are what industries prefer; apart from making things much easier to play around
    with, there is no need to wait for blocks or spend real money. Cryptocurrency
    such as ETH and ETC are on top of the Ethereum blockchain, which are completely
    different chain-types compared to our private chain. Confused?


    Let us look into the different types of blockchains to understand this classification.'
  merge: -1
