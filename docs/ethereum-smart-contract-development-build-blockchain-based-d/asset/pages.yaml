- pgno: 182
  md: 'execution-based tool, which discovers security bugs in Ethereum smart contracts


    +   - Bhargavan et al. use formal verification to analyze smart contracts


    Let us now get back to the oraclelize engine, which is similar to the TOWN CRIER.
    In solidity, it is very simple to inherit the oraclelize contract. This provide
    us functions such as `oraclelize_query`, which leverages this technology straight
    away. Oraclelize is integrated natively with the most widely used public blockchain
    protocols, such as Ethereum and Bitcoin. Privately, Ethereum-based chains can
    currently integrate with oraclelize by using the Ethereum-bridge. A valid request
    for data to oraclelize, done via the native blockchain integration or via the
    HTTP API, should specify the following arguments, as quoted in the oraclelize
    documentation:


    +   - **A data source type:** A data source is a trusted provider of data. It
    can be a website or web API, such as Reuters, Weather.com, BBC.com, or a secure
    application running on a hardware-enforced **trusted execution environment (TEE)**,
    or an auditable, locked-down virtual machine instance running in a cloud provider.

    +   - **A query:** A query is an array of parameters that needs to be evaluated
    in order to complete a specific data source type request. The intermediate result
    of a query may need to be parsed.

    +   - **An authenticity proof type (optional):** Oraclelize is designed to act
    as an untrusted intermediary. Optionally, a request to oraclelize can specify
    an authenticity proof. Not all proofs are compatible with all data source types.


    The interaction between oraclelize and an Ethereum smart contract is asynchronous.
    As illustrated in *Figure 5.7*, any request for data is composed of two steps,
    as quoted in the oraclelize documentation:'
