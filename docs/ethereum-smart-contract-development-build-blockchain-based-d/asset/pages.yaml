- pgno: 62
  md: 'applicable to communication networks as depicted in *Figure 2.2:*


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_62_0.png)


    (a) Centralized.


    (b) Decentralized.


    (c) Distributed networks.


    **Figure 2.2:** Centralized, decentralized, and distributed architecture


    Now, we need to discuss whether Ethereum is decentralized. You might have heard
    someone say that Ethereum is not decentralized. They might be partially correct.
    Even Vitalik Buterin, one of the founders of Ethereum, says so. You might be thinking
    that this is completely crazy. Of course, Ethereum ought to be decentralized.
    It is a blockchain technology, and the whole idea of a blockchain technology is
    that it should be decentralized.


    However, the answer to this is not a simple yes or no. It is a bit more complex
    than that. Vitalik Buterin has analyzed this notion of decentralization, which
    we will discuss right now.


    Decentralization consists of at least three important axes: the architectural
    axis, the political axis, and the logical axis. A system such as Ethereum can
    either be centralized or decentralized along these three orthogonal axes. It can
    also sometimes be the case that it is hard to draw a line and say that this system
    is centralized or decentralized as a whole. It is just hard to decide in practical
    terms.'
