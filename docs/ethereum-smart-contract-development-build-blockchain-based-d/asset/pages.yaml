  md: '# Need for solidity


    Let me tell you a dirty secret about programmers. We are the laziest lot of technicians
    in the entire community of engineering. We work really hard to remain lazy. We
    abide by the oath:


    > "If necessity is the mother of all inventions, laziness is their father."


    No wonder we love the open source movement so much. Reusing another lazy programmer''s
    code is what we fantasize about. And to add a little sprinkle of hypocrisy, we
    never ever forget to complain or criticize how messy the original code was, and
    how heroically we drove away the bugs and documented it to make it 2.0 or higher.
    It is just in our blood.


    But, sometimes, in this land of lazy nerds, there comes an outlier, one who writes
    something entirely original from scratch. The entire lazy community then laughs
    at this scratchy code. Slowly this outlier removes the bugs from the new stuff,
    and starts getting traction. Still, we keep ignoring it. By now the outlier has
    already moved out to do yet another new thing and some of his ardent followers
    from the period of traction are building on top of the core code. Then our lazy
    community starts fighting against it. The critics launch the famous X versus Y
    war, the ones that ask, "Which language should I prefer as a fresh college dropout-without-a-job,
    should it be X that my grandma used at her university, or Y, which my grandkid,
    I wrongly think, would be using?" on online forums. By this time, half a decade
    has passed by, and the new stuff is flying high on the IEEE list of the most-wanted
    programming languages, world-class universities are encouraging us to learn it,
    and the industry is trying to develop de facto standards and frameworks revolving
    around its usage. While us, the lazy lords, are searching frantically for its
    free copy, to install and "master" it.


    And no, it is not Python (though your guess was close enough) that I was'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'referring to, in our chapters context. It is good old JavaScript (with the
    de facto standard as ECMAScript) and the outlier is Brendan Eich.


    A programming language design is done with a particular operating environment
    in mind and a list of target tasks it needs to complete. All design decisions,
    features that are to be supported, and ones that need to be dropped, are driven
    by these two distinct factors. In the case of Ethereum, the operating environment
    was the **Ethereum virtual machine (EVM)**, which would take care of the second
    factor, to perform the entire assigned task over the Ethereum blockchain.


    But who would pass the instructions to the EVM? We need some sort of human machine
    interface. Hence, the **application binary interface (ABI)** was introduced. The
    sole aim of this interface was to make machine code portable across the blockchain.
    It is analogous to an **application programming interface (API)**, where we make
    the source code portable across various high-level languages.


    But the ABI was not enough to make complex abstractions such as a wallet or an
    oracle. The ABI is static, strongly typed, and known at compilation time. The
    need for a Turing-complete programming language that could totally adapt with
    the EVM and seamlessly couple with the ABI was obvious. It needed to have the
    user-rich features of JavaScript bundled with the assembly level, high performance
    of C++. Gavin Wood proposed a design of such a language and code-named it solidity.
    This language, along with the capability of writing a smart contract, also included
    properties such as safe language subsets, static analysis, in-built test-generations,
    executing environments, named components, contracts as class entities, and the
    ability of a contract to map segment information to storage.


    The EVM is just a very different beast. The decision to make a language specifically
    tailored to the EVM execution environment has helped the Ethereum community to
    prevent the problem of highly sub-optimal code execution. But a new language comes
    with its own set of grammar rules and features, which we will be discussing in
    the next section.'
  merge: -1
  img_proc: true
