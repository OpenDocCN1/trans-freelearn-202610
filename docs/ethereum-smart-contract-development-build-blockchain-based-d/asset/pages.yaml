  md: '# The ICO story


    A video log exists on YouTube at the following link:


    https://www.youtube.com/watch?v=4bMf4xZg_4U&feature=youtu.be&t=4m19s


    At the time of writing, it has gathered only 285 views. This is a clip from the
    Bitcoin 2013 conference in San Jose. At 4:19 in the clip, a panelist posed an
    idea he about developing a new protocol on top of the bitcoin blockchain protocol
    with some new X, Y, and Z features, using a group of trustworthy software developers.
    He also emphasized that he wanted to create this start-up without going to any
    venture capital firms. Rather, he would release a few tokens that the mass crowd
    could buy as an investment, which will act as the kick-starter fund. The value
    of these tokens will increase as the start-up grows, which in turn will reward
    the early adopters of such tokens.


    "I''ll take them," someone shouts, and the video ends.


    This person in the video is J.R. Willet and the idea he pioneered in this video
    is the concept of **initial coin offering (ICO)**. Sadly, this idea never took
    off on the bitcoin blockchain as there were no early adopters. A few years later,
    Vitalik Buterin used this concept to pitch the ICO on the Ethereum blockchain
    and has bagged around USD 2 billion worth of ether in terms of funding within
    the first nine months of 2017.


    An ICO is an unregulated way of offering investors some units of a new cryptocurrency
    or crypto token in exchange for market-established cryptocurrencies, such as bitcoin
    and Ethereum, via smart contracts.


    The good news is that a legitimate ICO, such as Ethereum, Augur, and Golem, is
    an amalgamation of a kick-starter model and an **initial public offering (IPO)**.
    The bad news is that most of the ICOs that come out in'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'today''s market do not have the proof-of-concept to start with, which is the
    core of any kick-starter model, nor are they regulated by the Securities and Exchange
    Commission, which is the backbone of all securities offered in IPOs. *Figure 8.7*
    represents this dilemma. Such dilemmas give rise to scams, Ponzi schemes, and
    faucets that we need to identify.


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_257_0.png)


    Figure 8.7: ICO dilemma


    Now, you might be wondering why I would even consider Ethereum as a legitimate
    ICO, after so many hacks have happened in the past few months. To answer this,
    we need to understand that all the hacks that have happened on Ethereum were due
    to bad coding practices on smart contracts, rather than the infrastructure itself,
    that is, the Ethereum blockchain or the Ethereum virtual machine and solidity.


    Most importantly, in terms of ICO, the tokens on sale were ethers, which are the
    same tokens that are being used for running smart contracts on gas over the Ethereum
    blockchain.


    This brings us to the point where we can identify a scam ICO. The important pointer
    of a scam ICO would be that the smart contracts running on the blockchain would
    not be using the tokens that were on the ICO.


    Imagine this: would you buy or invest in a company that says it is a diamond merchant
    but offers you roasted almonds as a token or receipt of your investment? Either
    it provides you with legal paper contracts equivalent to your amount invested
    on the tokens, or some sort of valuable stone.'
  merge: -1
  img_proc: true
- pgno: 258
  md: 'Ponzi ICOs are a different kind of financial fraud. In fact, the concept of
    Ponzi originated offline 150 years ago, where an investor is promised to recover
    their investments with interest, only if they can dupe in other investors to participate
    in this scheme. An affiliate business without any products is a form of Ponzi
    business. The world of Ethereum has, unfortunately, become a breeding ground for
    new Ponzi ICOs.


    Figure 8.8 represents the classification of an Ethereum-based Ponzi, which has
    been identified by Massimo Bartoletti et al. from the Department of Mathematics
    and Informatics at the University of Cagliari, Sardinia, Italy (arXiv:1703.03779v5):


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_258_0.png)


    Figure 8.8: Ethereum-based Ponzi smart-contracts


    Faucets are not related to ICOs. They are basically websites where the user has
    to do certain menial tasks to earn ethers. The tasks can be as simple as clicking
    a web page, participating in a survey, playing games, writing reviews, or simply
    copy-pasting affiliate links. The ether earned per task is extremely low, while
    the watermark eligible for ether transfer into the user''s wallet from the faucet
    can be extremely high or can take an enormous amount of time. Faucets are borderline
    cases of fraud, because some do pay the users who have grown due to affiliation
    and persistence. Yet, these are not legitimate miners who are mining ethers; rather,
    they are'
  merge: -1
  img_proc: true
- pgno: 259
  md: user-turned-slaves lured in by free ethers.
