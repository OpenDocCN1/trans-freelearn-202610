  md: '# Inside a block


    Let''s now discuss the contents of a block of bitcoin blockchain. This will help
    us in understanding and comparing Ethereum, which we will take up in chapter 2,
    Grokking Ethereum. A block is a very interesting concept, because a block gives
    blockchain its properties. It is the basic element of a blockchain.


    Therefore, it is important to know what a block consists of. Figure 1.8 lists
    the basic parts of a bitcoin block. First of all, we have a magic number, also
    called bitcoin network ID.


    | Field | Description | Size |

    |---|---|---|

    | Magic no | value always 0xD9B4BEF9 | 4 bytes |

    | Block size | number of bytes following up to end of block | 4 bytes |

    | Block header | consists of 6 items | 80 bytes |

    | Transaction counter | positive integer VI = Varint | 1 - 9 bytes |

    | Transactions | the (non empty) list of transactions | <Transaction counter>-many
    transactions |


    Figure 1.8: Parts of a bitcoin block (Bitcoin wiki)


    It is four bytes long and is an arbitrary number that signals that this is a bitcoin
    block. The magic number is not something specific to bitcoin. All nodes communicate
    using transmission control protocol.


    In TCP, different types of data packets use different magic numbers to identify
    themselves. It is like declaring our gender while filling out a passport to identify
    ourselves as male, female, or transgender. In our context, a block is actually
    a sequence of 0 and 1. When any machine reads such a data sequence and it encounters
    the binary version of 0xD9B4BEF9, it will identify the data as a bitcoin block.
    So, this number is the same for all bitcoin blocks. Now, why was 0xD9B4BEF9 chosen
    for bitcoin blocks?'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'As per the comments found in the bitcoin main.cpp files (bitcoin implementations
    were written in C++ language), the magic number was chosen in such a way that
    the characters are rarely used in upper ASCII, not valid as UTF-8, and produce
    a large four-byte integer at any alignment.


    Next, we have the block size which is also four bytes and tells us how long this
    block is with all of its transactions. As of July 2017, the size of an entire
    bitcoin block can be a maximum of 1 MB. We then have the block header, which is
    80 bytes and it is the most interesting part; we will talk about its contents
    in a short while. The next one is the transaction counter, which is an integer
    that tells us how many transactions this block has and next we have a list of
    transactions, which simply contains all the transactions that are in this block.


    For example, if we have the transaction counter as 20, we have 20 transactions
    in the block. The transaction counter is one to nine bytes. So, these were the
    basic parts of the block.


    So, let''s go ahead and look up what the bitcoin block header consists of. Here,
