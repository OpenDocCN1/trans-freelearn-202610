- pgno: 63
  md: 'Let us start with what we mean by the architectural axis. If a system is centralized
    in the architectural axis and I remove a couple of nodes/computing terminals from
    the system, it would collapse. Conversely, in a system that is decentralized on
    the architectural axis, even if I remove the majority of the nodes/computing terminals,
    the system would still function as intended. So, in that sense, Ethereum is decentralized
    on the architectural axis, because we can remove many computing nodes from the
    system but the whole network will still function. However, if you have a website
    that you host on a server or a network of servers where each one needs all of
    the others, and you remove one server, the servers and the website will obviously
    no longer function as this was a centralized system on the architectural axis.


    Let us move on. The second axis is the political axis.


    For example, a centralized system on the political axis could be a company or
    an enterprise where we have a CEO and maybe we have a board of directors, and
    they decide on the course of the company. However, Ethereum is decentralized on
    the political axis, because even the Ethereum Foundation cannot make everyone
    use their clients or force everyone to follow a protocol.


    Now, the last axis of discussion is the logical axis. So, a system that is centralized
    on the logical axis acts as a single entity, as a monolithic object, while a system
    that is decentralized on the logical axis can be divided into several parts, and
    each of those parts would behave and function as intended.


    For example, the BitTorrent protocol and the BitTorrent system is decentralized
    on the logical axis because we can split the system into several parts, and the
    computers in those split parts will still be able to use the BitTorrent protocol
    as intended. However, here is where Ethereum is not decentralized. In fact, Ethereum
    is centralized when it comes to the logical axis, because Ethereum acts as a single
    computer. You execute your contracts on Ethereum and on this one huge computer
    that is running on the blockchain. So, in that sense, Ethereum is centralized.
    If we split Ethereum into two different parts, then they would no longer function
    as'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'intended because the whole idea of Ethereum is that it should be a single computer—it
    should act as a single computer. In that way, Ethereum is not centralized on the
