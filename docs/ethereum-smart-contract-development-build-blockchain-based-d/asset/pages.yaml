    The idea of using different altcoins is not to make the public blockchain overloaded,
    and use separate blockchains to execute different operations. This is sometimes
    called **merge-mining** on sidechains. This is good performance-wise, but overall
    security is low when we have a segregated consensus acting on isolated blockchains,
    which eventually makes the 51% attack more likely.


    Coming back now to the main proposal of sharding. Sharding is a philosophy where
    we give away the notion of sequential executions of processes on each node of
    a blockchain. Rather, we split up the entire execution into sizable chunks called
    shards and many nodes process such shards in parallel. Users of one node computing
    one shard are not able to communicate with users of another node who are computing
    another shard. This is one of the main challenges while implementing sharding.
    For example, consider you live in Dublin but you have to attend an urgent business
    conference in London. And no, you cannot Skype talk as the session might turn
    out to be a solid deal. To top it off, the meet-up session might stretch to the
    entire day. Hence, you have to book a flight and reserve a hotel yet still want
    to make sure both operations are atomic—either both succeed or neither do. Now,
    if the flight ticket application and hotel room booking applications are on the
    same shard, they will be done in a sequential manner, and if one of the bookings
    fails, the other rolls back before committing. But if these are on different shards,
    unless we have cross-shard communication, this can land us in a big mess, the
    worst being that the hotel gets booked but the flight remains unreserved. One
    way to solve it is by using asynchronous, cross-shard communication. In simple
    words, one shard books the flight, and another shard books the hotel room. Then
    the shards message each other to acknowledge each other. Finally, the shards send
    us a confirmation. This is what we discussed in Chapter 1, *Blockchain Basics*,
