- pgno: 300
  md: '# Administrative and security constraints


    Popular microblogging platforms such as Twitter, Tumblr, and Weibo (the Chinese
    variant of microblog, dominated by Sina and Tencent) are basically centralized
    social network services that are prone to problems.


    The problems are mainly in two separate dimensions. One is technical, another
    one is social. In the technical dimension, the rapid popularity of such services
    results in an increasing cost of infrastructure management. This gives rise to
    many administrative problems while doing scalability deployments in production.


    For example, recently, US President Trump''s Twitter handle @POTUS auto-blocked
    many followers due to a technical glitch. Such glitches can be quite severe as
    automated trade-bots constantly monitor tweet sentiments and decide various stock
    prices on the worldwide stock exchanges, which can lead to multibillion dollar
    wipe-outs from the market capitalization in the blink of an eye.


    In the social dimension, we see a growth of trolls and online abuse to legitimate
    microblogging accounts. There have been instances where people have lost their
    employment, politicians had to resign, celebrities were fined because of their
    own race, gender, or religion.


    Even in our lives, we feel quite a pressure to microblog in the open, if our immediate
    supervisor or people from human resource are following our microblogging handles.
    So, in the social dimension, individual freedom and security becomes a big issue.


    A decentralized, microblogging platform can prevent problems in both technical
    and social dimensions, by providing a decentralized platform and'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'anonymity respectively. However, it is important to note that anonymity is
    a choice rather than a mandate while using decentralized technologies like a blockchain.
    In simple terms, using a blockchain does not make us anonymous automatically;
    rather, it is an add-on feature that needs to be separately implemented on top
    of a blockchain.


    The idea of this decentralized platform under discussion was originally conceived
    by a software developer named **Jahn Bertsch**. The entire functional logic was
    implemented in the Solidity programming language. It has two main smart contracts.
    An account related smart contract (`TwtAccount.sol`) and a user-registration related
    smart contract (`TwtRegistry.sol`). When these two smart contracts are deployed
    on the private blockchain, they interact with each other to form a command-line
    interface-based, decentralized, microblogging platform.


    In the subsequent sections, we will dive into the individual Solidity file, set
    up the service on the private blockchain, and check how these smart contracts
    perform in CLI and remix browser mode.'
  merge: -1
  img_proc: true
