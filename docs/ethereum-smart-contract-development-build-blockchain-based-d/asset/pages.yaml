    they will always get the most up-to-date information when they call subsequently,
    no matter how quickly they call back.

    +   - **Availability**: `HappySpouse.com` will always be available for calls as
    long as any one of them (Kaushik or his wife) reports to work.

    +   - **Partition tolerance**: `HappySpouse.com` will work even if there is a
