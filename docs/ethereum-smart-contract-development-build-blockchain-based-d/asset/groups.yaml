    the light client makes a query for that, and so on. The miner responds to all
    of its own queries correctly, but keeps track of all the data that it sends back.
    The miner then sends the client the combined data from all of these requests as
    a proof. The client then undertakes the exact same procedure, but using the provided
    proof as its database; if its result is the same as what the miner claims, then
    the client accepts the proof.


    So, how is the proof accepted? This is done using a consensus algorithm, which
    compares PoW from different miners. This algorithm is called ETH hash. Even though
    the future versions of the Ethereum framework might switch to PoS, PoW is currently
    in use. We will cover this algorithm in detail in the later chapters. As of now,
    remember the fact that this algorithm combines the nonce with a DAG to generate
    a new hash and check whether it is less than the target threshold to solve the
    dumb puzzle of mining, as discussed in Chapter 1, Blockchain Basics. The problem
    is that the DAG, which is essentially a direct acyclic graph of a huge dataset
    (more than 2 GB), takes a lot of random access memory (RAM) to process. This memory
    hardness is the main reason why we cannot use an ASIC miner to mine Ethereum blocks,
    as ASICs are very low in memory caches. The best hardware clients to mine Ethereum
    are GPU miners.


