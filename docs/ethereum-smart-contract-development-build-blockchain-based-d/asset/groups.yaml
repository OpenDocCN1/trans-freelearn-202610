    Figure 10.2: Types of blockchain on permission spectrum


    ## Private blockchains


    Private blockchains take advantage of blockchain technology by setting up private
    groups that can verify transactions internally. Write permissions are centralized,
    like traditional database management systems. Read permissions may be restricted
    or public to a certain extent. These blockchains have their niche use cases because
    of their scalability, compliance to data privacy rules, and other regulatory guidelines.
    Such blockchains can reduce cost but are not disruptive. MONAX and multichain
    are prominent players in the private blockchain space.


    ## Public blockchains


    Public blockchains are based on state-of-the-art consensus algorithms, are open
    source, permissionless, and provide incentives to transaction validating effort:


    - Anyone can start running a public node by downloading the free code on their
    local device

    - Anyone can participate in the consensus by validating transactions in the network,
    thus determining what block gets added to the chain along with the current state

    - Anyone in the world can do valid transactions and reflect them on a blockchain


    Using a public block explorer, anyone can read transactions, making it transparent
    yet pseudonymous. Bitcoin, Namecoin, Ethereum, Bitcoin Cash, Ethereum Classic,
    and Litecoin are just a few of the hundreds of examples of public blockchain protocols.


    ## Consortium blockchains


    Consortium blockchains operate within a group of stakeholders. Unlike public blockchains,
    they don''t allow any random person with access to the internet to participate
    in the process of transaction verification. Consortium blockchains are highly
    scalable and provide transaction privacy. These blockchains are mostly used in
    the banking and corporate sector, where various banks form a consortium to interact
    in their own intra-network to replace legacy systems, reduce transaction costs
    and data redundancies, and simplify document handling using smart compliance mechanisms.


    Bankchain is a consortium that has come together for building and exploring blockchain
    solutions. The member list can be retrieved from the following link where it is
    listed in a chronological manner: http://www.bankchain.org.in/members.php.


    Some prominent names in these lists include State Bank of India, Deutsche Bank,
    Dubai Islamic Bank, and even tech corporations such as Intel. This consortium
    has tied up a blockchain start-up called Primechain Technologies to roll out various
    beta version DApps by the end of 2017. One of the DApps is Primechain-KYC, which
    is a smart contract-based solution deployed on a permissioned consortium blockchain
    to share Know-Your-Customer (KYC), Anti-Money-Laundering (AML), and Countering
    the Financing of Terrorism (CFT) data.


    Primechain Technologies has, in turn, partnered with Microsoft to provide a blockchain-as-a-service
    model to the consortium members using the Azure developmental platform. Other
    prominent consortium blockchains are R3 (Banking), EWF (Energy), B3i (Insurance),
    and Corda (legal).


    In the following sections, we will try to understand what blockchain-as-a-service
    implies, and how various enterprises are providing different


    ## Blockchain-as-a-service


    There is a diverse landscape of solutions and approaches to implement a blockchain.
    *Figure 10.3* represents a broad classification of such approaches. Blockchain-as-a-service
    is an industry practice that merges the *development platform approach* with the
    *IT services approach* to provide tangible blockchain-based solutions to clients:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_325_0.png)


    Figure 10.3: Blockchain implementation solution


    We have seen in the previous chapters that we need several software components,
    such as geth, node.js, and Java runtime environments along with programming tools,
    such as Solidity and web3.js, on top of an operating system to develop a complete
    end-to-end, blockchain-based, decentralized application from scratch.


    This is fine for making a new and highly customized product to a certain extent,
    but to implement a repeatable and scalable service, coding from scratch is equivalent
    to reinventing the wheel.


    The big players in the cloud computing industry, such as IBM (Bluemix), Microsoft
    (Azure), and Amazon (AWS), have realized this gap and have come up with this BaaS
    model. They have seen the potential benefits of offering blockchain services in
    the cloud, where clients and users benefit from avoiding the overhead of hardware
    investment, as well as the problem of configuring and setting up a working blockchain
    network.


    Using BaaS, developers have access to single-click, drag-and-drop, cloud-based
    blockchain environments, that allow for rapid prototyping and deployment of DApps
    and smart contracts.


    ## Enterprise platforms for BaaS


    In this section, we will introduce a few enterprise platforms with BaaS offerings
    using three pointers. All these platforms provide a freemium version of the development
    platform to develop consortium blockchain-based applications.


    ### IBM Hyperledger


    Hyperledger was introduced in 2015 by the Linux Foundation as an umbrella project
    to advance cross-industry blockchain technologies. Hyperledger Fabric is one of
    the blockchain projects that provides permissioned consortium blockchains, where
    users on the network must enroll through a membership service provider. IBM (Bluemix)
    has partnered with Hyperledger to offer BaaS to its customers. It has also been
    leveraged with the cognitive capabilities of IBM Watson to provide IoT-based solutions.


    ### Microsoft Azure EBaaS


    Initially, Microsoft collaborated with ConsenSys to offer **Ethereum blockchain-as-a-service
    (EBaaS)** on the Microsoft Azure cloud platform.

    Then they announced Project Bletchley to provide consortium, blockchain-based
    solutions to their clients. Now they are building an enterprise smart contract
    framework on top of the existing infrastructure that follows a multi-trust model,
    which will allow their clients to harness their DApp development skills.


    ### Amazon Eris


    Amazon announced they would be offering the BaaS in collaboration with the Digital
    Currency Group. They developed Eris on top of the Amazon cloud, which is a platform
    for building, testing, maintaining, and operating distributed applications with
    a blockchain backend to wrangle complex smart contracts.


    Unfortunately, this service is currently unavailable to new users and is provided
    to old cloud-based clients of Amazon.


    ## Dark web marketplace


    To really understand the dark web, we need to differentiate it from the normal
    web. By normal web, we imply the surface web that we browse using a web page address,
    or search using natural language typed into search engines, such as Google or
    Bing. There is yet another type of web called the deep web. Figure 10.4 depicts
    the three strata of the web using an iceberg analogy:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_331_0.png)


    Figure 10.4: Web kernel diagram and iceberg analogy


    In simple words, the surface web is anything on the internet that a search engine
    can find and index. The deep web is something a search engine cannot find. To
    understand intuitively how search engines find a page, we can do a manual exercise
    by going to any news channel website and then keep clicking on the articles as
    they come up.


    So, we navigate throughout the article by clicking on some web links, which lands
    us to a new page of articles. This is what, in search engine parlance, is called
    web crawling. Now, there are many other sites such as Expedia or Airbnb, which
    cannot be fully explored just by crawling. We need to provide inputs such as flight
    date, departure city, arrival city, economy or business class, and number of hotel
    rooms required in order to move through such pages. They even ask for our name,
    email, and contacts, which then takes us to new web content. Such websites cannot
    be explored using a search engine alone. These are parts of the deep web.


    The dark web can be considered as a subset of the deep web that has been intentionally
    hidden and is inaccessible through standard web browsers. So, even though both
    the surface web and deep web can be explored using a standard browser such as
    Chrome, Firefox, IE, Opera, or Safari, to navigate through the dark web we need
    a totally new browser called the Tor browser (there is also I2P and others, but
    Tor is more prominent). The website address ends with `.onion` suggesting the
    file type.


    *Figure 10.5* shows such an `.onion` site called Hidden Wiki using the Tor browser.
    Note that, the opposite is true; that is, Tor can be used to browse the surface
    web pages:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_332_0.png)


    Figure 10.5: Hidden Wiki on the dark web


    As you can observe in the Hidden Wiki, the dark web is full of illegal ongoing
    activities, ranging from drug dealing and counterfeiting, to hired assassination
    and illegal arms purchase.

