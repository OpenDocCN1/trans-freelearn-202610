- raw:
  - '[PAGE 268]


    # Banking and payments


    The blockchain is going to disrupt the banking industry the way the World Wide
    Web did the media industry. It is destroying regulations and compliances arising
    due to borders, as cryptocurrencies such as bitcoin and Ethereum are making cross
    border transactions in seconds, with substantially lower transfer fees. This is
    connecting the investors of developed countries to the innovators of developing
    countries. Banks such as Barclays are implementing blockchains to strengthen their
    operational capabilities. Banks are also seed-funding and investing in blockchain-based
    start-ups.'
  - '[PAGE 269]


    # Insurance


    The global market of insurance is based on trust. A blockchain is a new way of
    managing trust. It can be used to verify the insured person''s identity, as well
    as interact with real-time data using frameworks such as oraclize to make amendments
    on the sum assured during payouts. Smart contracts for automobile and crop insurance
    can be powerful in determining a payout, without any significant human intervention.


    Fizzy.axa is an Ethereum-based insurance product launched by the French insurance
    giant, AXA. These are smart contracts that self-trigger payouts for flight delays
    lasting more than two hours.'
  - '[PAGE 270]


    <!-- no content -->'
  - '[PAGE 271]


    # Forecasting and prediction market


    Blockchain is about to revolutionize the prediction industry. We can place bets
    using smart contracts and the winning amount will be automatically transferred
    to our account. Any challenging event such as election results, superbowl match
    results, and world cup finalist predictions can be converted into an automated
    yet legalized game of gambling.


    App.Augur.net is an Ethereum-based prediction market platform where we can place
    bets and do money trading in terms of ether. It is completely decentralized.'
  - '[PAGE 272]


    # # Charity


    Corruption due to middlemen and the inefficiency of escrows is a common problem
    in the charity space. These issues prevent money from reaching those who actually
    need it. Blockchain is disrupting the charity space by providing donation tracking
    features, which makes sure our money is reaching the right person.


    In the Ethereum space, giveth.io has introduced a concept called liquid pledging,
    which is basically a smart contract that can transfer ether funds directly, or
    pledge to transfer funds through an automated delegate, to a person, with transparent
    tracking on the distributed ledger. Whenever the funds are moved, the donor is
    notified and can veto any action.


    It also provides a platform to develop decentralized altruistic communities, which
    can allocate funds to campaigns and track the donations as they deliver on predefined
    goals.


    Their source code and development status can be tracked at the following GitHub
    link: `https://github.com/Giveth`.'
  - '[PAGE 273]


    # # Public benefits


    The blockchain is a good framework to allocate social welfare funds in a transparent
    manner. Pensions, army benefits, scholarships, and unemployment benefits can be
    distributed without suffering slowness, corruption, and bureaucracy.


    GovCoin Systems Limited has partnered with Barclays and University College London
    to develop a social welfare distribution system using blockchain and smart contracts,
    which will be trialed by the Department for Work and Pensions of the UK government.'
  - '[PAGE 274]


    # Energy management


    Energy grids and utility industries are highly centralized. To buy gas, fuel,
    and electricity, we have to go through public grids or authorized private corporations.
    Even the producers have to go through highly regulated channels to sell basic
    utilities. The blockchain can disrupt this monopoly as well, by bringing peer-to-peer
    utility share frameworks.


    RWE, a German power company, has partnered with Ethereum-based blockchain start-up,
    Slock.it, to develop decentralized car charging stations for electric cars.'
  - '[PAGE 275]


    # # Art and music


    Illegal art auctions and music piracy has always been a challenge to the entertainment
    industry. Coupled with manager and record company commissions, a serious percentage
    of money has been stolen from artists. The blockchain provides a transparent system
    of direct payment to the artist from the consumer, and the use of unique signatures
    to store the identity of an art piece.


    Maecenas is an open blockchain platform for accessing and auctioning fine art
    in a decentralized manner. Mycelia is an online music platform that pays artists
    directly from consumers.'
  - '[PAGE 276]


    # Retail


    When we buy our monthly consumables from Spencers or a food bazaar, we trust the
    retail system to pay the actual producer of the goods. The blockchain can connect
    the producer with the consumers without the middle entities. This can lead to
    a sharp drop in the retail price.


    https://www.openbazaar.org/ is a bitcoin, blockchain-based, online, peer-to-peer
    store that allows everyone to set up their eShop and sell their product without
    any middle-entity commission. The platform accepts transactions in bitcoins.'
  - '[PAGE 277]


    # # Real estate


    Buying and selling real estate can involve a lack of transparency, bureaucracy,
    mistakes in public records, and fraud. The blockchain can reduce paper-based record
    keeping and speed up transactions.


    Smart contracts can help to automate tracking, transferring property deeds, verifying
    ownership, and ensuring document accuracy.


    The state government of Andhra Pradesh, India, has partnered with a Swedish start-up,
    ChromaWay, to build a blockchain-based solution for land registry. It is estimated
    that $700 million is paid in the form of bribes to land registrars across India.'
  - '[PAGE 278]


    # Cyber security


    Cyber security and the blockchain have a symbiotic relationship. Both need each
    other to grow and disrupt each other. The basic foundation of the blockchain is
    based on a cryptographic hash function, and as the blockchain is in a nascent
    stage, cyber security is of prime importance.


    Quantum computing is a real threat to modern asymmetric cryptography. Iota.org
    is a next-generation, graph-based, distributed ledger technology that claims to
    overcome this quantum threat and enhance the security of DLTs.'
  - '[PAGE 279]


    # # Crowdfunding


    The blockchain has leveraged crowdfunding to a whole new level, by introducing
    the concept of initial coin offering. As we discussed in the introduction and
    previous chapter, we have a long way to go before we have a consensus regulated
    ICO framework with proper audits. Currently, the ICO arena can be considered a
    "wild-wild-west" situation for crypto-equity tokens.'
  - '[PAGE 280]


    # Networking and the Internet of Things


    Blockchains can enable communication and micro payments between machines, without
    human intervention. The economy of machines is an emerging field that will prove
    crucial in steering innovation in automation.


    Project Oaken is an award-winning, Ethereum-based, smart contract project that
    uses the IoT to pay automated tolls to tolling booths for self-drive and manual
    cars. The prototype was tested successfully using Tesla, resulting in a $100K
    win at the Dubai Blockchain Hackathon. Currently, Oaken Innovations have teamed
    up with Toyota research and MIT Media Labs to research such prototypes for an
    autonomous drive future.'
  - "[PAGE 281]\n\n# Voting\n\n> \"It is enough that the people know there was an\
    \ election. The people who cast the votes decide nothing. The people who count\
    \ the votes decide everything.\"\n> \n> - Joseph Stalin\n\nData scientist might\
    \ be the sexiest job according to the Harvard Business Review, but it miserably\
    \ failed to predict the 2016 US general election. Rigging of the voting system\
    \ might be a conspiracy theory to divert from the major data science failure,\
    \ but cannot be entirely ruled out. Blockchain technology can work wonders for\
    \ such democratic processes due to its immutable property.\n\nhttps://www.democracy.earth/\
    \ and https://followmyvote.com/ are blockchain-based voting apps that are funded\
    \ by venture capitalist firms. They also have plans and road maps to incorporate\
    \ smart contracts in the near future."
