    现在，我们需要讨论以太坊是否去中心化。你可能听一些人说过，以太坊并不是去中心化的。他们可能只说对了一部分。甚至以太坊的创始人之一维塔利克·布特林（Vitalik
    Buterin）也这样认为。你可能会觉得这完全是天方夜谭。以太坊当然应该是去中心化的。它是一项区块链技术，而区块链技术的核心理念就是去中心化。


    然而，对于这个问题的回答并不是简单的“是”或“否”，而是比这更复杂一些。维塔利克·布特林分析了去中心化的这个概念，我们现在就来讨论一下。


    去中心化至少包含三个重要维度：架构维度、政治维度和逻辑维度。像以太坊这样的系统，在这三个正交维度上，可以表现为中心化，也可以表现为去中心化。有时，我们也很难划清界限，断言某个系统总体上就是中心化或者去中心化的。在实践中，这确实很难判定。


    我们先从架构维度说起。如果一个系统在架构维度上是中心化的，那么当我从这个系统中移除几个节点/计算终端时，它就会崩溃。相反，在一个架构维度上去中心化的系统中，即使我移除大多数节点/计算终端，系统仍然可以按照预期运行。从这个意义上说，以太坊在架构维度上是去中心化的，因为我们可以从系统中移除许多计算节点，但整个网络仍然可以正常工作。然而，如果你将一个网站托管在一个服务器或一个服务器网络上，其中每个服务器都依赖其他所有服务器，那么当你移除一个服务器时，这些服务器和网站显然将无法再正常工作，因为这在架构维度上是一个中心化系统。


    我们继续。第二个维度是政治维度。


    例如，在政治维度上中心化的系统可能是一个公司或企业，我们有一个首席执行官，也许还有一个董事会，他们决定公司的发展方向。然而，以太坊在政治维度上是去中心化的，因为即使是以太坊基金会也无法强制每个人都使用他们的客户端，或者强制每个人都遵循某个协议。


    现在，要讨论的最后一个维度是逻辑维度。一个在逻辑维度上中心化的系统就像一个单一实体，像一个单体对象一样运作；而一个在逻辑维度上去中心化的系统则可以被分割成多个部分，并且每个部分都可以按照预期的方式表现和运行。


    例如，BitTorrent 协议和 BitTorrent 系统在逻辑维度上是去中心化的，因为我们可以将系统分成几个部分，这些被分离部分中的计算机仍然可以按照预期使用
    BitTorrent 协议。然而，这正是以太坊不去中心化的地方。实际上，在逻辑维度上，以太坊是中心化的，因为以太坊充当一台单一计算机。你在以太坊上执行合约，就像在这台运行在区块链上的巨大计算机上执行一样。所以，从这个意义上说，以太坊是中心化的。如果我们把以太坊分成两个不同的部分，那么它们将无法按照预期运行，因为以太坊的核心思想就是它应该是一台单一的计算机——它应该像一台单一的计算机那样运行。在这方面，以太坊在逻辑维度上是中心化的。


    *图 2.3* 展示了以太坊在去中心化所有三个维度上的情况：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_64_0.png)


    | 维度 | 去中心化 | 中心化 |

    | --- | --- | --- |

    | 架构 | 是 | 否 |

    | 政治 | 是 | 否 |

    | 逻辑 | 否 | 是 |


    图 2.3：以太坊的去中心化概念


    问题依然存在：作为分布式计算平台，以太坊是如何在拥有完全去中心化架构的同时，实现如此水平的中心化逻辑抽象的呢？为了回答这个问题，我们需要熟悉以太坊生态系统的各个组成部分，并尝试构建其技术栈。下一节就会介绍这个。那么，让我们开始吧。


    ## 以太坊生态系统


    在第1章《区块链基础》中，我们学习了以太坊区块链如何表示为一棵巨大的默克尔树，树的叶子是代码执行的状态。我们还了解到，区块链是带有 web 3.0 框架的分布式账本。


    *图 2.4* 描绘了以太坊技术栈的这种框架。接下来的内容会比较复杂，请密切注意：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_65_0.png)


    图 2.4：以太坊的 Web 3.0 技术栈，来源：以太坊 Stack Exchange


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_67_0.png)


    图 2.5：Mist 浏览器类比


    ## 去中心化应用程序


    现在，让我们讨论一下下一层：**去中心化应用程序（DApps）**。

    这些基本上是在去中心化的点对点网络上运行，并拥有开源代码的应用程序。它可以是一个简单的、基于逻辑的、实现两数相加的程序，也可以是一些相当复杂的东西，比如微博客服务。


    作为一个美食爱好者，我经常把 Mist 浏览器想象成一家五星级酒店周末早午餐的自助餐桌（连同燃气灶），上面摆满了各式各样的 DApp，等待着饥饿的软件开发者和客户来大快朵颐。唯一的不同是，这些
    DApp 并非来自一个雇用了许多厨师的单一中心化厨房，而是由不同的软件开发者在“百家宴”的形式下共同提供的。他们甚至还要为燃气灶付费，以保持他们的 DApp
    的美味可口。最棒的是，开发人员必须免费分享食谱和配料。*图 2.6* 展示了 Mist 浏览器上的这些 DApp。


    ## 中间件


    Mist 和 DApp 主要是以太坊前端堆栈的一部分。现在，让我们进入后端机制。首先，我们从**中间件**开始。以太坊的中间件具有扁平化的层次结构，因为没有中央权威机构，比如服务器。它由三个同等重要的主要组件组成：


    - **Swarm（蜂群）**：以太坊的去中心化存储，主要用于静态文件

    - **Whisper（低语）**：DApp 的对讲机，是一种基于身份的消息系统

    - **EVM**：一种隔离的、即时的、人机代码转换器，运行在沙盒运行时环境中


    如果没有服务器，应用程序如何运行呢？我们可以这样理解：在 web 2.0 框架中，服务器为了保持客户端设备的轻量化，做了比其本意更多的活儿。它们不仅提供静态网页，还存储私人信息、管理用户认证，并计算所有复杂的分析。客户端所做的只是加载并向用户显示消息。另一方面，web
    3.0 中的无服务器架构允许一种更加模块化的方式，不同的计算设备和不同的协议来处理特定的任务；有些在客户端，有些在部署于点对点网络的专业节点上。因此，所有包含日志的数据逻辑，比如什么被保存了、谁在保存以及如何解决冲突，都由区块链上的智能合约处理；静态文件通过
    Swarm 提供，实时通信由 Whisper 负责，如*图 2.7* 所示。客户端设备保留用户认证并运行应用程序界面，也就是 Mist 钱包加浏览器：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_71_0.png)


    图 2.7：无服务器架构，来源：blog.ethereum.org


    图 2.8 说明了在无服务器架构下，这些模块如何与 DApps 和底层区块链协同工作。这样的设置也鼓励创新。由于接口与数据分离，任何人都可以为同一个应用程序开发新的接口，从而创建更活跃、更具竞争力的生态系统：


