    # # Developing a Cryptocurrency

    # from Scratch


    In this chapter, we will discuss one of the wide-spread applications of Ethereum,
    that is, crypto tokens. We will begin with a short introduction to the Truffle
    framework and create an ERC20-compatible token using it. Then, we will discuss
    **initial coin offerings (ICOs)** and how they can be identified as scam, Ponzi,
    faucet-like, or legit. We will then introduce the concept of arbitrage with respect
    to cryptocurrencies. We will also learn about **Fiat2Crypto (F2C)** and **Crypto2Crypto
    (C2C)** exchange. Then, we conclude the chapter with yet another parity hack case
    study.


    After studying this chapter, you will be able to:


