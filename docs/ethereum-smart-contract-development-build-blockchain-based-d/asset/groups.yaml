    ## 图灵完备性和魔力酱


    正如我们在上一节讨论的那样，以太坊是一个去中心化应用平台。这意味着我们可以编写以去中心化方式执行的程序，其中没有中央服务器或中央实体来执行我们的程序。这些程序将在许多不同的计算机上执行，这意味着没有办法关闭这样一个去中心化应用。为了编写此类应用，我们需要开发智能合约，而智能合约是用一种名为
    Solidity 的编程语言编写的。因此，在以太坊区块链上，如果你想编写智能合约，你需要学习 Solidity。Solidity 是图灵完备的。那么，这意味着什么？要理解这一点，我们需要回到
    60 或 70 年前。


    在那个时候，人们有不同的计算机器。问题是，如果你有一台机器可以用一种算法计算某些东西，那么这台机器只能解决那个问题，而要解决另一个算法结构略有不同的问题，你必须从头开始构建一台单独的机器。


    因此，20 世纪最伟大的数学家和计算机科学家之一阿兰·图灵开发了一种机器的逻辑设计，一种理论机器。他解释了如何构建这样一台机器，以便这台机器可以运行任何程序。


    在他对这台机器的理论解释中，你可以用一条简单的磁带来构建它，磁带由均匀的单元组成，每个单元存储 0 或 1，以及一个可以左右移动的磁带头，能够读取磁带单元并存储数据。基本上他解释了如何构建一台可以运行任何程序并解决任何计算问题的计算机。话虽如此，并没有保证这需要多长时间。某些程序计算机执行它一百次。


    例如，一个简单的计算设备具有循环和加法操作，也可以被修改为通过循环特定的加法操作来执行乘法；也就是说，5 x 3 等价于 5 + 5 + 5，这等价于在 3
    次循环中将 5 与自身相加。然而，必须注意的是，循环并不总是对代码性能有利，因为循环内的循环会使任何代码的时间复杂度呈指数级增长。因此，循环对于识别图灵完备性是有用的，但在完全必要的情况下才应避免，因为它们会降低代码性能。我们还有另一个可扩展性问题，这将在后面的章节中解决，我们将在其中讨论分片的概念。


    这也是比特币避免使用图灵完备语言的主要原因之一。这是出于选择而非错误做出的决定。你看，整个图灵完备语言在区块链上运行循环的想法可能是危险的；因为如果你有一个循环执行某种代码数百万次，并且这种代码必须在区块链上执行，它将真正使网络过载。这就是比特币开发者决定不使用图灵完备语言的原因。他们只想要一种简单的机制来完成基本工作，即在节点之间进行价值转移。而在以太坊中，设计理念完全不同，随着复杂
    DApp 的引入，这些 DApp 必须使用智能合约在以太坊区块链上执行。这里，我们绝对需要一种图灵完备的语言，它必须具有循环结构。同样，我们不能通过运行数百万次循环来使以太坊区块链过载。因此，我们似乎陷入了一个两难的境地，循环是必要的恶，恶在于区块链过载和垃圾邮件其他用户。


    这正是我们需要魔力酱的时候；我们在以太坊区块链中称之为 gas。Solidity 在以太坊区块链上执行的每个操作都与之关联有固定的 gas 费用。让我们回到我们谈到的自助餐自助餐类比，我们谈到了需要开发者/聚餐厨师支付一定费用以保持他们的
    DApp/食谱温暖可口的燃气灶。你看，如果我必须为燃气灶燃料付费，我会自动烹饪即使在低 gas 使用下也很好的食谱，而不是需要大量火焰和持续高 gas 使用的食谱。因此，与其带来需要持续火焰的热烤肉，我会带来像面包或烘焙食品这样的东西，它们需要轻微或不需要燃气灶使用，以确保我在等待有人来食用我烹饪的东西时不会损失金钱。


