  mdcn: "\n分配了特定的地址。在我们的示例输入中，我们使用了三位候选人 [Tom、Dick 和 Harry]。\n\n这个 DApp 更有趣的地方在于，当我们将其部署到区块链上时，构造函数只能被调用一次。与普通的\
