    status\",\"type\":\"bool\"},{\"indexed\":false,\"name\":\"timestamp\",\"type\"\
    :\"uint256\"},{\"indexed\":false,\"name\":\"owner\",\"type\":\"string\"},{\"indexed\"\
    :false,\"name\":\"fileHash\",\"type\":\"string\"}],\"name\":\"FileLogStatus\"\
    ,\"type\":\"event\"}]);\nvar browser_untitled_sol_ownershipcontract = browser_untitled_sol_ownershipcontractcontract.new(\n\
