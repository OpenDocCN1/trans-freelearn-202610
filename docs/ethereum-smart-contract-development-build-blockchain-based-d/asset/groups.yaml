    \ the Internet of Money. Here, money is not just a medium of exchange but also\
    \ a medium of expression. In the previous chapter, we discussed ICOs, which were\
    \ basically human ideas converted into cryptocurrency tokens. We are at a juncture\
    \ of technology where money is seeking us. It is seeking us by transforming our\
    \ ideas into tokens that people can buy. If our idea triumphs, so do our tokens.\n\
    \nThis newfound freedom in the Internet of Money, without any widely accepted\
    \ framework or guidelines, has resulted in a very volatile situation in the tech\
    \ industry. Programmable money is not equivalent to some new web app or software.\
    \ The very concept of immutability on a blockchain makes the design of the Internet\
    \ of Money a nightmare for enterprise architects. They can no longer think as\
    \ data scientists or software developers. They must think more like firmware developers\
    \ or construction workers. It is like making a customized home for a living. We\
    \ can propose whatever changes we want during the floor planning, but once it\
    \ is approved and the home is built, it is extremely difficult to modify a room\
    \ without making changes to the original floor plan.\n\nAgain, if the original\
    \ floor plan has some weak points and vulnerable blind spots, a burglar can barge\
    \ in and steal all the valuables, as we saw in the Ethereum hacks of DAO and Parity.\
    \ For this technology, we need to take a step backward and encourage monolithic\
    \ architectures, rather than modular ones, as the former are compact and less\
    \ vulnerable to hacks:\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_267_0.png)\n\
    \nFigure 9.1: Blockchain use cases\n"
  mdcn: "\n\n## Parity 漏洞重现\n\n在上一章关于 Solidity 的内容中，我们讨论了由库合约中的多签钱包引发的 Parity 漏洞。发生该漏洞后，Parity\
    \ 团队对库合约进行了必要的修复。然而，在此过程中，他们忘记了审计库智能合约的其他部分，而这些部分存在新的漏洞。\n\n图 8.10 显示了可供外部用户访问的自毁代码片段。一个化名为\
    \ devops199 的新手开发者访问了此函数并意外执行了它。因此，整个库合约被自毁并从区块链上移除。\n\n影响在很久之后才被意识到，当时调用该库的钱包变得毫无意义，而价值数百万美元的代币永远被困在这些悬空的钱包合约中。这样的黑客故事让我们认识到对任何开源代码进行同行评审的重要性，并说明了我们为何应使用冷钱包而非热钱包。\n\
    \n```solidity\n// kills the contract sending everything to `_to`.\nfunction kill(address\
    \ _to) onlymanyowners(sha3(msg.data)) external {\n    suicide(_to);\n}\n```\n\n\
    图 8.10：Parity 钱包库智能合约的自杀函数\n\n## 总结\n\n本章伊始，我们明确区分了代币与币种。然后，我们讨论了如何使用 Truffle\
    \ 框架开发符合 ERC20 的代币。随后，我们探讨了加密货币套利交易的概念，以及如何区分合法的 ICO 与诈骗和庞氏骗局。\n\n我们谈到了 Cryptereum\
    \ ICO 以及它如何革新 C2C 和 F2C 交易所。我们以分析又一起导致数百万美元以太币永远冻结在自杀式智能合约库中的 Parity 漏洞作为本章的结尾。\n\
    \n在第 9 章《企业用例》中，我们将研究以太坊智能合约的一些企业用例。\n\n## 企业用例\n\n本章重点介绍区块链和智能合约如何渗透到行业中。我们首先介绍互联网货币的概念，并探讨智能合约如何开始在各个行业影响技术、社会和经济。具体来说，我们将探索\
    \ 18 个区块链用例和 12 个智能合约用例。我们以设计命令行界面为基础的去中心化微型博客平台的各个模块并将其部署在私有区块链上作为本章的结尾。\n\n\
    学习完本章后，你将能够：\n\n- 欣赏互联网货币的概念\n- 了解智能合约和区块链的各种用例\n- 理解微型博客 DApp 的构建模块\n- 探索 DApp\
    \ 的安全性和管理属性\n\n> “What you seek is seeking you”\n> — Rumi\n\n在开始本章之前，我想请你退一步，思考一下前面这句引言，这句话出自著名的\
    \ 13 世纪波斯逊尼派穆斯林诗人贾拉勒·阿丁·穆罕默德·鲁米之口。这句臭名昭著的六个词的引言蕴含着神秘而深刻的哲学。\n\n例如，如果你在寻找生活伴侣，那么在这个世界上就有人在寻找一个像你这样的人。\n\
    \n现在让我们举一个最简单的技术例子。我们都在网上搜索，对吧？我们通常会用 Google 搜索（从没听过有人说，让我们用 Bing 搜索，或让我们用 DuckDuckGo\
    \ 搜索，虽然这也很正常），而且这还是免费的。但在这个网络经济中，当我们免费获得某样东西时，我们必须明白我们本身就是产品。你可能会问，为谁？为广告商、市场研究人员、产品设计师——对他们来说，我们就是产品。我们点击的链接、我们查看的产品、我们进行的交易、我们喜欢的语录、我们听的歌曲——我们在网上做的几乎每一个动作都被记录下来。甚至我们在最喜欢的聊天应用中输入给朋友发送的最小的信息，然后删除以发送更正式的信息，那也被记录下来。这些信息被卖给公司、数据巨头和产品制造商，他们得以窥见我们真正私密的心理。他们利用我们的心理作为产品来创造产品或这些产品的广告，而我们最终会点击它们并为搜索引擎公司创造收入。所以，我们在网上寻求得越多，它就越寻求我们。\n\
    \n对于一个注重隐私的人来说，这无疑令人担忧。我们脑中会自然产生一个显而易见的问题，*\"为什么我的个性会让别人而不是我自己获利？\"* 当然，我们从平台那里获得了服务，但这不应该以牺牲我们的个性和隐私为代价。这正是去中心化和去中心化应用的种子萌芽的想法，在那里我们的个性是我们自己的责任，没有中间人/机器应该在未经我们明确许可的情况下从中获利。\n\
    \n寻求爱情和知识是可以的，但我们内心还有一个更大的怪物需要喂养。那就是渴望被认可、渴望在社会中受人尊重、渴望成为有权势和掌控我们所处社会内部运作的人。 somehow，在人类文明的世代传承中，寻求和赚取金钱给我们带来了这种认可。虽然另外两种，知识和爱情，可以积累并提供更多认可，但大多数普通人觉得金钱可以在我们有生之年带来名声。因此我们与银行的共生关系开始了，因为某种程度上它让我们相信我们的钱在它们那里是安全的，如果我们长期存放，还会增值。然后出现了股市，一种合法化且受监管的赌博，有时可以使我们的钱翻倍，前提是我们愿意冒一切风险。然后出现了衍生品、债券、期货，以及法规和合规；金融警察会保护我们免受众多诱人却有风险的诱惑的侵害。\n\
    \n但在 2008 年 9 月 15 日这个不幸的日子，当一家拥有 150 年历史的投资银行雷曼兄弟申请破产时，全世界都意识到银行并不像它们声称的那样安全。然而，人们仍然需要钱，银行必须继续存在。2009\
    \ 年 1 月 3 日，一个匿名实体中本聪引入了比特币的概念，这引发了普通民众与所谓受监管金融机构之间的权力斗争。\n\n这些金融机构最初认为，如果只是忽视这场革命，这场加密经济很快就会自然死亡。像乌龟缩回壳中一样，金融世界开始忽视这场正在进行的革命。但加密货币在过去八年中不断发展。区块链技术不仅将货币带到了互联网，而且智能合约的引入使货币变得可编程。\n\
    \n我们对金钱的寻求把我们带到了一个新范式，互联网货币。在这里，金钱不仅仅是交换媒介，也是表达媒介。在上一章中，我们讨论了 ICO，它本质上是将人类思想转化为加密货币代币。我们正处于一个技术十字路口，金钱正在寻求我们。它通过将我们的想法转变为人们可以购买的代币来寻求我们。如果我们的想法取得成功，我们的代币也会成功。\n\
    \n互联网货币中这种新获得的自由，缺乏任何广泛接受的框架或指导，导致了科技行业非常动荡的局面。可编程货币并不等同于某个新的网络应用或软件。区块链上不可变性的概念本身就使互联网货币的设计成为企业架构师的噩梦。他们不能再像数据科学家或软件开发者那样思考。他们必须更像固件开发者或建筑工人那样思考。这就像为活人打造定制住宅。我们可以在平面规划阶段提出任何想要的更改，但一旦批准并建成房屋后，在不更改原始平面图的情况下修改一个房间就极其困难。\n\
    \n同样，如果原始平面图存在一些薄弱点和脆弱的盲点，小偷就可以闯入并偷走所有贵重物品，就像我们在以太坊 DAO 和 Parity 黑客事件中所看到的那样。对于这项技术，我们需要退一步，鼓励单体架构，而非模块化架构，因为前者更紧凑，对黑客攻击的脆弱性更小：\n\
    \n![](img/8c91673d39176d2e910ac52c4bc35d8b_267_0.png)\n\n图 9.1：区块链用例\n\n"
