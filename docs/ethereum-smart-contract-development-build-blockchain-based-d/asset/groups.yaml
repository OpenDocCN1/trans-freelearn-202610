    \ Web3.js，这是一个用 JavaScript 编写的特殊应用程序编程接口库。该接口将我们的 Web 浏览器与 Ethereum 区块链节点连接起来。我们将从了解\
    \ geth、Web3.js 和 Mist 之间的差异开始本章。然后我们将学习如何导入此 API 库并与 geth 连接。我们将随后探索 Web3.js 库内部的\
    \ API 结构。我们以研究所有权合约的设计作为本章的结尾。\n\n学习完本章后，你将能够做到以下几点：\n\n- Differentiate between\
    \ Mist, geth, and Web3.js\n- Realize how Web3.js interacts with the Ethereum blockchain\n\
