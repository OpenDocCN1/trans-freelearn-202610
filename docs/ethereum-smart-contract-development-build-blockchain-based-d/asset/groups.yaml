    \ or reduce complexity |\n\n**Behavioral patterns**\n\n| Pattern | Description\
    \ |\n| --- | --- |\n| Chain of Responsibility | Delegates commands to a chain\
    \ of processing objects |\n| Command | Creates objects which encapsulate actions\
    \ and parameters |\n| Interpreter | Implements a specialized language |\n| Iterator\
    \ | Accesses the elements of an object sequentially without exposing its underlying\
    \ representation |\n| Mediator | Allows loose coupling between classes by being\
    \ the only class that has detailed knowledge of their methods |\n| Memento | Provides\
    \ the ability to restore an object to its previous state |\n| Observer | Is a\
    \ publish/subscribe pattern which allows a number of observer objects to see an\
    \ event |\n| State | Allows an object to alter its behavior when its internal\
    \ state changes |\n| Strategy | Allows one of a family of algorithms to be selected\
    \ on-the-fly at run-time |\n| Template Method | Defines the skeleton of an algorithm\
    \ as an abstract class, allowing its sub-classes to provide concrete behavior\
    \ |\n| Visitor | Separates an algorithm from an object structure by moving the\
    \ hierarchy of methods into one object |\n\nFigure 11.2: GoF design pattern summary\n\
    \n在以下章节中，我们将讨论以太坊区块链上智能合约开发者经常使用的一些设计模式：\n\n#### Restricting access\n\n访问限制是智能合约的常见功能。在之前的章节中，我们讨论了外部合约如何利用\
    \ Parity 库合约中的访问相关漏洞，自毁整个钱包库并冻结价值 3 亿美元的以太币。我们永远无法阻止任何人或计算机读取合约的状态。我们可以通过使用加密使其变得困难一些。\n\
    \n开发者唯一需要牢记的是合约的状态是公开的，然后以无问题的方式设计它。我们可以通过在实体地址上使用函数修饰符来限制允许修改合约的实体数量。此类地址可以维护在**访问控制列表\
    \ (ACL)** 上，但有一个警告：对于公共区块链，只读访问将对任何人开放。\n\n修饰符用于更改函数的正文。如果使用此类修饰符，它们会在前面加上一个检查，只有在函数由某个地址调用时才会通过。\n\
    \n这种设计实现是一种结构型设计模式。\n\n#### Token systems\n\n这些与行为型设计模式相关。令牌系统类似于模板方法，其中算法的骨架被定义为抽象类，允许子类提供具体行为。\n\
    \n在之前的章节中，我们讨论了 ERC20 标准如何为以太坊基于的令牌系统实现兼容性。ERC20 不是代码、软件或技术。它是一个技术规范。\n\nFigure\
    \ 11.3 描绘了一个示例 ERC20 标准合约接口，其中包含推荐的函数定义：\n\n```\ncontract ERC20 {\n    function\
    \ totalSupply() constant returns (uint totalSupply);\n    function balanceOf(address\
    \ _owner) constant returns (uint balance);\n    function transfer(address _to,\
    \ uint _value) returns (bool success);\n    function transferFrom(address _from,\
    \ address _to, uint _value) returns (bool success);\n    function approve(address\
    \ _spender, uint _value) returns (bool success);\n    function allowance(address\
    \ _owner, address _spender) constant returns (uint remaining);\n    event Transfer(address\
    \ indexed _from, address indexed _to, uint _value);\n    event Approval(address\
    \ indexed _owner, address indexed _spender, uint _value);\n}\n```\n\nFigure 11.3:\
    \ ERC20 token system\n\n#### Factory pattern\n\n这种设计模式是一种创建型设计模式。使用此模式，可以在不指定确切创建类的情况下创建对象。\n\
    \nFigure 11.4 是一个简单的中心 (`Barrel`)，它从模板部署合约 (`Whisky`) 并跟踪已创建的合约。\n\n`Whisky` 是源文件的一部分，因此\
    \ `Barrel` 在编译期间可以“看到它”。`Whisky` 的字节码将成为 `Barrel` 的一部分，因此 `newWhisky()` 调用知道该怎么做。\n\
    \n在中心 (`Barrel`) 部署后，不必再部署模板 (`Whisky`)。\n\n我们可以通过在前者中调用一个函数来创建后者任意多个。\n\n"
