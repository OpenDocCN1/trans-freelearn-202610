    \ me!\");\n}\n```\n\n```\npattern #2 opaque predicate\nfunction q2 (uint y) {\n\
    if ( y > 5)\n  if ( y > 2)\n    print(\"think out-of-the-case!\");\n}\n```\n\n\
    ```\npattern #3\nexpensive operations of a loop\nuint sumout = 0;\nfunction q3\
    \ (uint y){\nfor ( uint j = 0; j < y; j++)\n  sumout += j;\n}\n```\n\n```\npattern\
    \ #4\nconstant outcome of a loop\nfunction q4 () returns (uint){\nuint sumout\
    \ = 0;\nfor ( uint j = 1; j <= 100 ; j++)\n  sumout += j;\nreturn sumout;\n}\n\
    ```\n\n```\npattern #7\ncomparison with unilateral outcome in a loop\nfunction\
    \ q7 (uint z , uint x)\nreturns (uint){\nfor ( int i = 0; i < 100 ; i++)\n  if\
    \ (z > 0)\n    x+=z;\nreturn x;\n}\n```\n\n```\npattern #6\nrepeated computations\
    \ in loop\nuint y = 1;\nuint z = 2;\nfunction q8 (uint j){\nuint sumout = 0;\n\
    for ( uint k = 1; k <= j ; k++)\n  sumout = sumout + y + z;\n}\n```\n\n```\npattern\
    \ #5\nloop fusion\nfunction q5 (uint y){\nuint n = 0;\nuint w = 0;\nfor ( uint\
    \ j = 0; j < y; j++)\n  n += j;\nfor ( uint k = 0; k < y; k++)\n  w -= k;\n}\n\
    ```\n\n## Figure 5.6: Pseudo-code of gas-costly pattern\n\nIn pattern 4, the outcome\
    \ of the loop is a constant value and deterministic in nature. Rather than using\
    \ a loop, we can just use a statement, such as return 5050, and assign it to sumout,\
    \ minimizing gas usage. Pattern 5 illustrates the need for a loop fusion where\
    \ we combine several loops into one to minimize gas usage. We can combine the\
    \ summation and subtraction step of n and w inside a single loop rather than running\
    \ them in sequential separate loops. Pattern 6 depicts repeated computation in\
    \ a loop. The summation of y+z is very expensive due to the use of a SLOAD operation\
    \ before ADD. This can be avoided by summing up y+z outside the loop and then\
    \ reusing the result inside the loop.\n\nAnd, lastly, pattern 7 shows unilateral\
    \ redundant comparison inside a loop. In simple words, z>0 can safely go outside\
    \ the loop without loss of functionality and in turn minimize gas cost as we are\
    \ preventing the same comparison from occurring 100 times, which gives the same\
    \ result anyway. It is noteworthy, that as we increase the loop counters, the\
    \ gas cost keeps on multiplying, which can make a smart contract quite expensive\
    \ to operate.\n\nApart from changes to the programming pattern, optimization can\
    \ be achieved at runtime by tinkering with the Ethereum virtual machine. We already\
    \ saw in *Chapter 2, Grokking Ethereum*, how EVM interacts with swarm and whisper\
    \ to run DApps on a blockchain using smart contracts. EVM basically allows us\
    \ to execute arbitrary code in a trustless environment in which the outcome is\
    \ fully deterministic. EVM operates on 256 bit integers and requires 256 bit arithmetic.\
    \ Because of the 256 bit nature of the EVM, the gas can theoretically be 2^256-1\
    \ but actually never will because the cost incurred by such an execution would\
    \ be way too much. Instead, there is a cap of using up to 2^64, which present\
    \ processors have native support for and can generally be optimized. Even though\
    \ 2^64 is still \"too costly\", it is a very nice constraint to have and allows\
    \ us to hard-cap the gas on something the computer can natively understand. The\
    \ EVM natively uses a quadratic-memory gas calculation, where for each word of\
    \ 32 bytes there is a cost associated with memory expansion. This capping of 64\
    \ bit has also put a limit on the expansion of associated memory with the expansion\
    \ never going beyond 2^64-1.\n\nLastly, the performance at blockchain level can\
    \ be optimized by a process called **sharding**. Currently, all the transactions\
    \ and calculations that are performed on an Ethereum blockchain need to be run\
    \ by all of the nodes. So, each node has to perform every calculation. And that\
    \ is of course inefficient if scaled. That is not a characteristic that is desirable\
    \ worldwide. If we want to make complex decentralized applications run efficiently\
    \ on the public blockchain, we need to speed up the execution process compared\
    \ to the present day's runtimes. What Ethereum performs today in terms of execution\
    \ speed is comparable to that of what happened in the late 1980's computers. Roughly,\
    \ this is about 7-15 transactions per second. So it is really too low for practical\
    \ purposes. Sharding is one of the main proposals for how we can increase in terms\
    \ of performance at scale, the other two being using different altcoins and increasing\
    \ the block size. The problem with increasing the block size is that even though\
    \ we could accomplish more transactions or operations in one go, it will become\
    \ increasingly difficult for normal computers to act as nodes due to the heavy\
    \ blocks on the entire chain. General purpose computer hardware wouldn't be enough\
    \ to act as a node, and the entire ecosystem will tend towards centralization\
    \ and monopolistic cartel-like behavior, because only those operators that have\
    \ massive hardware support will be able to act as nodes by downloading the complete\
    \ blockchain on their machines.\n\nThe idea of using different altcoins is not\
    \ to make the public blockchain overloaded, and use separate blockchains to execute\
    \ different operations. This is sometimes called **merge-mining** on sidechains.\
    \ This is good performance-wise, but overall security is low when we have a segregated\
    \ consensus acting on isolated blockchains, which eventually makes the 51% attack\
    \ more likely.\n\nComing back now to the main proposal of sharding. Sharding is\
    \ a philosophy where we give away the notion of sequential executions of processes\
    \ on each node of a blockchain. Rather, we split up the entire execution into\
    \ sizable chunks called shards and many nodes process such shards in parallel.\
    \ Users of one node computing one shard are not able to communicate with users\
    \ of another node who are computing another shard. This is one of the main challenges\
    \ while implementing sharding. For example, consider you live in Dublin but you\
    \ have to attend an urgent business conference in London. And no, you cannot Skype\
    \ talk as the session might turn out to be a solid deal. To top it off, the meet-up\
    \ session might stretch to the entire day. Hence, you have to book a flight and\
    \ reserve a hotel yet still want to make sure both operations are atomic—either\
    \ both succeed or neither do. Now, if the flight ticket application and hotel\
    \ room booking applications are on the same shard, they will be done in a sequential\
    \ manner, and if one of the bookings fails, the other rolls back before committing.\
    \ But if these are on different shards, unless we have cross-shard communication,\
    \ this can land us in a big mess, the worst being that the hotel gets booked but\
    \ the flight remains unreserved. One way to solve it is by using asynchronous,\
    \ cross-shard communication. In simple words, one shard books the flight, and\
    \ another shard books the hotel room. Then the shards message each other to acknowledge\
    \ each other. Finally, the shards send us a confirmation. This is what we discussed\
    \ in Chapter 1, *Blockchain Basics*, as eventual consistency (recall the CAP theorem).\
    \ Vitalik Buterin and other co-founders of Ethereum\n\n"
