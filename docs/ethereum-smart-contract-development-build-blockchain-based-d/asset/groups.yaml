  - '[PAGE 364]


    # Preamble


    EIP: 6

    Title: Renaming SUICIDE opcode

    Author: Hudson Jameson <hudson@hudsonjameson.com>

    Status: Final

    Type: Standards Track

    Layer: Applications

    Created: 2015-11-22


    # Abstract


    The solution proposed in this EIP is to change the name of the SUICIDE opcode
    in Ethereum programming languages with SELFDESTRUCT.


    # Motivation


    Mental health is a very real issue for many people and small notions can make
    a difference. Those dealing with loss or depression would benefit from not seeing
    the word suicide in our programming languages. By some estimates, 350 million
    people worldwide suffer from depression. The semantics of Ethereum''s programming
    languages need to be reviewed often if we wish to grow our ecosystem to all types
    of developers.


    An Ethereum security audit commissioned by DEVolution, GmbH and performed by Least
    Authority recommended the following:


    > > Replace the instruction name "suicide" with a less connotative word like "self-destruct",
    "destroy", "terminate", or "close", especially since that is a term describing
    the natural conclusion of a contract.


    The primary reason for us to change the term suicide is to show that people matter
    more than code and Ethereum is a mature enough of a project to recognize the need
    for a change. Suicide is a heavy subject and we should make every effort possible
    to not affect those in our development community who suffer from depression or
    who have recently lost someone to suicide. Ethereum is a young platform and it
    will cause less headaches if we implement this change early on in it''s life.


    # Implementation


    SELFDESTRUCT is added as an alias of SUICIDE opcode (rather than replacing it).


    # Copyright


    Copyright and related rights waived via CC0.'
  - '[PAGE 365]


    # Consortium blockchains


    As we discussed in the previous chapter, consortium blockchains lie in between
    private and public blockchains, and also in the middle of the permission spectrum.
    In this section, we will do a case study using consortium blockchains adopted
    by banks.


    Banks need blockchains to make money transfers faster, easier, and cheaper. The
    following are the limitations of a public blockchain if used for this purpose:


    +   - **Speed**: Banks need to do transactions in real time, while Ethereum takes
    around 12 sec to confirm one transaction.

    +   - **Permission**: Anyone can take part in the consensus for a public blockchain.
    But banks prefer to remain an authority or hire a regulatory body.

    +   - **Security**: Due to the limited number of participants, proof-of-work is
    not secure enough.

    +   - **Privacy**: Basically divided into identity privacy and data privacy, it
    is quite hard to maintain such privacy on a public Ethereum blockchain.


    Consortium blockchains generally employ proof of authority, where there is no
    need for mining. It is a consensus mechanism where the truth is arrived at by
    referring to a list of validators. Such validators are mainly a group of nodes
    that are allowed to participate in the consensus.'
  - '[PAGE 366]


    # # Case study on R3 Corda


    R3 is a distributed ledger company that has developed a blockchain platform, Corda,
    which can help with a lot of institutional finance services.


    Corda has been designed for recording and processing financial agreements and
    implementing the vision contained in this document.


    The Corda platform also supports smart contracts. In Corda, updates are applied
    using transactions that consume existing state objects and produce new state objects.
    There are two aspects of consensus: transaction validity and transaction uniqueness.


    The smart contracts on Corda are called CorDapp. A CorDapp is generally written
    in Java or kotlin.


    CorDApps are made up of the following key components:


    +   - **States:** This defines the facts over which agreement is reached

    +   - **Contracts:** This defines what constitutes a valid ledger update

    +   - **Services:** This provides long-lived utilities within the node

    +   - **Serialization whitelists:** This restricts what types your node will receive
    off the wire


    The node structure of Corda has the following structure:


    ```

    ├─ certificates  // The node''s certificates

    ├─ corda-webserver.jar // The built-in node webserver

    ├─ corda.jar  // The core Corda libraries

    ```'
  - '[PAGE 367]


    ```

    ├─ logs // The node logs

    ├─ node.conf // The node''s configuration files

    ├─ persistence.mv.db // The node''s database

    └─ plugins // The CorDapps JARs installed on the node

    ```


    A node can have four broad categories of functionality:


    +   - **Network map**: This provides a way to resolve identities to physical node
    addresses and associated public keys

    +   - **Notary**: This witnesses state spends and has the final say in whether
    a transaction is a double-spend or not

    +   - **Oracle**: This links the ledger to the outside world by providing facts
    that affect the validity of transactions

    +   - **Regular mode**: This starts protocols communicating with other nodes,
    notaries, and oracles and evolves their private ledger'
  - '[PAGE 368]


    # Tangle beyond blockchain


    We have devoted the entire book to blockchain-based smart contract development.
    But there is another ecosystem of cryptocurrencies that are not based on blockchains.
    These are based on direct acyclic graphs or DAGs. Such systems are called graph-based,
    distributed ledger technology. Some noteworthy DAG-based DLTs are DagCoin, Byteball,
    Hashgraph, and Tangle.


    DagCoin was the first DAG-based DLT launched in 2012 by Sergio Demian Lerner,
    pioneer of blockchain-free cryptocurrencies. That was closely followed by Byteball
    by Anton Churyumov. Hashgraph is currently a private DLT based on DAG, invented
    by Leemon Baird. Tangle technology was introduced as a whitepaper by Sergey Popov
    on April 3, 2016. The cryptocurrency on Tangle aims at supporting transactions
    between **Internet-of-Things (IoT)** appliances, hence aptly named Iota.


    In the following sections, we will explore the shortcoming of a traditional blockchain,
    the technology behind Tangle, a GitHub analysis of Iota, and how to purchase and
    store Iota cryptocurrency.'
  - '[PAGE 369]


    # Shortcomings of a blockchain


    Traditional blockchains suffer from two major problems for currency transaction:


    +   - **Mining-pool oligopoly**: Taking into consideration the competitive nature
    of mining rewards, mining pools with high-end technology make the process profitless
    for individual miners. Also, with decreasing mining rewards, as we reach the threshold
    of mining (for example, in bitcoin, currently it is 12.5 BTC; earlier it was 25
    BTC, which came down from 50 BTC), miners will be charging high transaction costs
    to justify the cost of mining and transaction validation using electricity.

    +   - Slow validation processes with no possibility of speed-up.'
  - '[PAGE 370]


    # # Tangle demystified


    Tangle is a new data structure based on direct acyclic graph. This data structure
    has no blocks, no chains, and no miners.


    So how does a public ledger on Tangle achieve consensus or validate transactions
    in the absence of miners? This is achieved by involving the user who wants to
    make a transaction validate and approve two past transactions. This unique way
    of attesting two past transactions ensures the whole network achieves consensus
    on the current state of an approved transaction.


    An Iota transaction can be broken down into three distinct steps:


    +   1. **Signing:** We sign the transaction inputs with our private keys.

    +   2. **Tip selection: Markov Chain Monte Carlo (MCMC):** This method of sampling
    is used to randomly select two tips, which will be validated by our transaction,
    namely `branchTransaction` and `trunkTransaction`.

    +   3. **Proof-of-Work:** In order to have our transaction accepted by the network,
    we need to do some PoW, similar to HashCash but not like bitcoin.


    An encoded transaction of Iota consists of 2,673 trytes. A tryte is a ternary
    equivalent of a byte. It is generally represented by alphabet characters starting
    with 9. The rest of the numbers are denoted from A to Z. Iota uses a balanced
    trinary system. To make the trinary code human-readable, Iota developers created
    alphabet mapping to numbers, as shown in *Figure 11.8:*'
