    \ The next section is all about what you can do when you are stuck with a problem\
    \ or a code bug.\n\n## Raising an issue on GitHub\n\nWhen you have a code bug,\
    \ before raising any issue on GitHub, please have a check on the Ethereum documentations,\
    \ freely available via any search engine. Then, ask the same in the Ethereum stack\
    \ exchange. In most of the cases, you will not be the lone person who has faced\
    \ that bug. So, the solution to your problem might be already out there on the\
    \ web. The last resort is to raise an issue in the GitHub. GitHub is a code repository\
    \ with version control freely available to all. Most of the blockchain related\
    \ source codes are available on GitHub. I will show you how I raised an issue\
    \ for the LETH wallet app for Android, which was discussed in Chapter 2, Grokking\
    \ Ethereum:\n\n- **Identifying issue**: While uploading picture files to the chat\
    \ window, which uses whisper communication protocol, there is no option to provide\
    \ a message or caption, as we can do in chat services like WhatsApp.\n- **Logging\
    \ issue**: Create a free GitHub account and log into the LETH GitHub repository\
    \ page, as shown in Figure 3.19. Click the New issue button to log in the issue.\
    \ Once the issue is described with any necessary images and descriptions, click\
    \ the Submit new issue button, as shown in Figure 3.20, to generate the new issue,\
    \ as I had generated in Figure 3.19. You can check the issue details in the link,\
    \ https://github.com/inzhoop-co/LETH/issues/31:\n\nFigure 3.19: Creating new issue\
    \ on GitHub\n\nFigure 3.20: Describing and submitting new issue on GitHub\n\n\
    ## Smart contract on a private blockchain\n\nLet us do some grown-up stuff now.\
    \ Yes, we are still not going to spend any fiat money to buy ethers to code on\
    \ a blockchain. Rather we will do the following:\n\n- 1. Write a genesis block\
    \ file for a private blockchain.\n- 2. Create the private blockchain using geth\
    \ commands.\n- 3. Link the private blockchain with the MIST browser.\n- 4. Mine\
    \ the chain to generate our own ethers as rewards.\n- 5. Use those ethers to deploy\
    \ a smart contract on our very own private blockchain.\n\nThe pre-requisite tools\
    \ to be installed are as follows:\n\n- Windows 7 (64-bit) (Instructions are for\
    \ Windows user, for Ubuntu/Mac refer appendix)\n- Cygwin setup-x86_64 (For Bash-Shell\
    \ on Windows 7) (https://cygwin.com/install.html)\n- geth-windows-amd64-1.6.7-ab5646c5\
    \ (https://geth.ethereum.org/downloads/)\n- Mist-win64-0-9-0 (https://github.com/ethereum/mist/releases)\n\
    - Node.js (node-v6.11.2-x64) (https://nodejs.org/en/download/)\n- .NET framework\
    \ 4.5 (https://www.microsoft.com/en-in/download/details.)\n\nI am not going into\
    \ the details of the installation. The installations are pretty straightforward,\
    \ involving the terms and conditions page (which we never read), followed by blind-surfing\
    \ of Next and I Agree buttons, and while the installations are going on, watching\
    \ some random YouTube videos or stand-up comedians to entertain ourselves.\n\n\
    For troubleshooting, Google and the stack exchange are your best friends, ever.\
    \ *Figure 3.21*, *Figure 3.22*, *Figure 3.23*, *Figure 3.24*, *Figure 3.25*, and\
    \ *Figure 3.26* are provided for your reference, to check whether you are on the\
    \ right track during installation, especially for MIST, geth, Cygwin, and Node.js.\
    \ The only recommendation is to try to keep all these installation, in one separate\
    \ folder in a separate drive, apart from .NET framework, so that they do not mess\
    \ up your main program files. My downloads and installations were inside `F:Ethereum_Environment\
    \ path`:\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_122_0.png)\n\nFigure 3.21:\
    \ Mist installer package\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_123_0.png)\n\
