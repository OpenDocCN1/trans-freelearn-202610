    \ continues to run forever. But real life has some constraints; we might not want\
    \ certain contracts to continue after a certain period of time. For example, we\
    \ might not want to renew our car insurance contract as we plan to sell the car.\
    \ That is why we need some mechanism to terminate or kill a contract.\n\n*Figure\
    \ 6.5* represents a killer contract that has a function, which when executed,\
    \ kills a live contract, and takes it off the blockchain. Actually it is done\
    \ by an in-built EVM operation, `selfdestruct`. It needs an input parameter in\
    \ terms of the address to send the remaining ethers and the killing occurs, which\
    \ takes away the contract from the blockchain:\n\n```\npragma solidity ^0.4.11;\n\
    \ncontract MyKillerContract {\n    address owner;\n\n    function MyKillerContract()\
    \ public {\n        owner = msg.sender;\n    }\n\n    function getCreator() public\
    \ constant returns(address) {\n        return owner;\n    }\n\n    function kill()\
    \ public {\n        if(msg.sender == owner) {\n            selfdestruct(msg.sender);\n\
    \        }\n    }\n}\n```\n\nFigure 6.5: Killer contract using selfdestruct operation\n\
    \nApart from `selfdestruct`, a function can be declared as a `view`, `pure`, `getter`,\
    \ and `fallback` function. A `view` declaration ensures that the state of a function\
    \ is not modified. A `pure` declaration ensures the function is not read and does\
    \ not modify the state of a function. The compiler automatically creates a `getter`\
    \ function for all state variables, hence they have external visibility. Fallbacks\
    \ are basically nameless functions that generally do not have arguments and cannot\
    \ return anything. This chapter's last section on Parity hack will discuss fallback\
    \ function in greater details.\n\n"
