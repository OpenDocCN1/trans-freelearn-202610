  mdcn: '


    面临了拜占庭将军问题和 CAP 定理等挑战，我们将在后续章节中讨论这些问题。


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_27_0.png)


    图 1.1：集中式系统（左）和分布式系统（右）的乐高积木表示


    ## 拜占庭将军问题


    想象一下在黑暗时代，有一艘海盗船正在遭受攻击。海盗船上有 200 名海盗，被六艘各有 50 名战士的军舰包围，每艘军舰都已抛锚，将海盗船团团围住。每艘军舰都由一名船长指挥。300
    名战士可以轻易压制海盗船上的 200 名海盗。然而，如果他们不能同时攻击，就有很大风险战士会被海盗以多打少并输掉战斗。


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_28_0.png)


    图 1.2：海盗船（200）被军舰（50）包围


    那么，船长们如何能在同一时间就攻击海盗船达成一致？在今天，我们只需要一个快速的群视频会议，船长们就会同意在 22:00 小时（晚上 10 点）发动攻击。


    然而，在黑暗时代，事情要复杂得多：


    - 22:00 攻击的消息只能由小船上的水手传递。他必须绕着每艘军舰航行，依次拜访每位船长以确认。

    - 任何船长都可能是叛徒，与海盗船上的海盗勾结。


    ## 失败的策略


    船长 1 决定在 22:00 发起攻击。他派他的水手带着消息（22:00 攻击）去交给船长 2。到达后，船长 2 阅读了消息，记下了攻击时间，并发送了一条同样写着
    22:00 攻击的消息。他让水手继续将消息传给船长 3。然而，我们遇到了问题。船长 3 是叛徒。他希望攻击失败。所以，当他收到消息时，他把消息撕掉并换成一条新消息，写着
    21:00 攻击（晚上 9 点）。水手浑然不觉地继续前进。船长 4 现在收到一条写着 21:00 攻击的消息。他记下时间，在消息上签名写着 21:00 攻击并将其传给船长
    5，船长 5 然后将同一消息传给船长 6。现在，消息已经传遍所有人，但我们有问题了。那个不诚实的船长破坏了结果。我们现在有三名船长（4、5 和 6）带着 150
    名战士在 21:00 攻击海盗船。期望其他人加入他们，他们反而被 200 名海盗以多打少并被压制。获胜的海盗现在从海盗船中涌出并与背叛的船长 3 汇合。突然间，剩下的两名船长（1
    和 2）只有 100 名战士，发现自己在与 200 名海盗加上 50 名叛徒作战。不幸的是，海盗和叛徒获胜了。


    ## 获胜的策略


    船长 1 想发送同样的消息（在 22:00 攻击）。然而，这次他必须遵守两条新规则：


    - 他必须花费 10 分钟准备任何新消息才有效

    - 他必须在每条新消息中包含所有先前消息的历史记录


    那么，这次会发生什么呢？和之前一样，船长 1 派水手乘船发送消息（22:00 攻击）。这次不同的是，船长 2 知道两件确定的事：


    - 消息必须花费 10 分钟准备

    - 没有先前的消息，所以它必须是真的（即使船长 1 是叛徒并写了错误的时间也没关系；如果大多数船长遵循这一建议并选择 22:00 的攻击时间，他们仍然会超过海盗船上的人数并赢得战斗）


    所以，现在轮到船长 2 发送消息了。按要求，他花费 10 分钟准备新消息并将船长 1 的消息嵌入到自己的消息中。水手随后带着这条消息出发（现在实际上是两条消息链接在一起，因为第二条消息中嵌入了第一条）。现在消息传到了船长
    3。


    记住，他是叛徒。那他会怎么做呢？上次，他把消息改成 21:00 攻击，让船长 4、5 和 6 提前攻击并被压制。现在，他却不能这么做，因为根据新规则，他只有
    10 分钟时间准备给船长 4 的消息。他有两个选择：


    1. 通过将消息改为 21:00 攻击来作弊。为此，他需要（a）花费 10 分钟创建他的消息，然后（b）再花费额外的 2 x 10 分钟来制作要嵌入到他消息中的来自船长
    1 和 2 的 21:00 攻击替换消息，并在接下来的 10 分钟内完成这 30 分钟的工作，以避免其他船长知道他是叛徒。

    2. 承认失败并在那 10 分钟内准备 22:00 攻击消息。


    换句话说，每位船长最多只有 10 分钟时间，为下一位船长提供一份如果他们想不诚实的话需要花费超过 10 分钟才能伪造的东西。如果他们不能在 10 分钟内交付，每个人都知道他们是不诚实的并会忽略他们，使他们试图误导他人的企图变得毫无用处。


    ## CAP 定理


    在陈述 CAP 定理之前，让我们先通过一个现实世界的问题来理解一致性、可用性和分区容错性。


    作为一个已婚人士，我知道一个人的生活如果忘记了配偶生日和结婚纪念日等重要日期会变得多么可怜（在大多数情况下，丈夫是罪魁祸首，但那是另一个讨论）。我的一个朋友，让我们叫他考希克，看到其中的机会并开设了一家初创公司
