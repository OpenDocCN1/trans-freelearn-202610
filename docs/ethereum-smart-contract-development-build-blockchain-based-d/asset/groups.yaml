    which stole around $30 million worth of ethers.


    Chapter 7, *Primer on Web3.js*, introduces a special application programming interface
    library written in JavaScript. This interface connects our web browser with the
    Ethereum blockchain node. We will begin this chapter by understanding the difference
    between Geth, Web3.js, and Mist. Then we will learn how to import this API library
    and get connected with Geth. We will then explore the API structure inside the
    web3.js library. We''ll conclude the chapter by studying the design of an ownership
    contract.


    Chapter 8, *Developing Cryptocurrency from Scratch*, provides a hands-on tutorial
    to develop an ERC20 standardized token using the Truffle framework. We then dive
    into the concepts of **initial coin offering (ICO)** and how to identify genuine
