    # Parity hack demystified


    Parity (https://parity.io/) is a UK-based, venture capitalist-funded, tech start-up
    company. They provide an Ethereum client, also called Parity, which has an extensive
    Ethereum wallet and DApp environment for contract deployment. The entire application
    is written and compiled in the RUST language. The wallets are multi-sig. Multi-sig
    wallets, in simple words, are wallets that require at least two separate agreements
    to spend a token from the wallet. These wallets are supposed to be more secure
    than normal single-sig wallets.


    Unfortunately, on July 19, 2017, three multi-sig wallets were exploited from a
    total of 596 wallets with similar vulnerabilities. Figure 6.10 shows these compromised
    accounts in Etherscan, the public Ethereum block explorer. When the Parity team
    got alerted of this hack, they tackled this situation by forming a "White Hat
    Group" and used the same vulnerability to siphon all the tokens from the remaining
    593 wallets into a safe repository so that the hacker could not lay their hands
    on these wallets. Even then, the damage done by exploiting the three wallets was
    around 83,017 ETH (~ $30 million on July 2017):'
