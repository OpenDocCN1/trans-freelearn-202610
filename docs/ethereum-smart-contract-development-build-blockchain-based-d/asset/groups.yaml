    1.5，以减轻一些困惑。我们稍后深入区块内部时会讨论时间戳和随机数（nonce）。


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_42_0.png)


    图 1.5：作为巨大默克尔树的区块链


    你可能会争辩说，区块链看起来更像一个链表，每个区块上挂着一棵默克尔树，但这从根本上是一种错误的认知，因为在这里我们无法反向传播到原始数据值。更恰当的说法是，利用区块的根哈希很难反向推导出实际值
    **x0, x1, x2** 和 **x3**。不过，优势在于这些哈希是不可变的。原则上，一旦区块链形成，你就无法撤销它。


    在讨论交易者视角的区块链之前，是时候了解一下什么是比特币区块链、什么是以太坊区块链，以及它们在原理和实践上有何不同。对于正在阅读前文的初学者，我想说明一点：在区块链社区中，约定俗成的标准是，用小写字母表示加密货币，用大写字母表示该币种的技术、协议和生态系统。因此，bitcoin
    或 Ethereum 代表虚拟加密货币，而 Bitcoin 或 Ethereum 代表围绕相应虚拟加密货币的技术栈、协议和生态系统。


    让我们看看 *图 1.6* 中过度简化的区块链示意图。所有区块链都有某种根值 **R**。因此，当我向朋友发送 2 个比特币（BTC）时，我实际上是在做一笔交易。我们称之为
    **T1**。


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_43_0.png)


    图 1.6：比特币和以太坊区块链


    这笔交易 **T1** 是一种价值转移，它将与之前的根 **R** 一起哈希，并产生一个新的根 **R1**。所以，这几乎就像一棵默克尔树（事实上，它就是一棵默克尔树），其中数据块，也就是默克尔树的叶子，存储着代表交易的数据位，这些数据位随后会被哈希成一个新的根哈希。然后，另一笔交易
    T2 到来，它与根 R1 哈希后又形成另一个新根 R2。这就是比特币区块链的工作方式，它永久保存着自原始哈希根（也称为创世区块）以来发生的所有交易。现在，如果我们试图通过声称我的交易
    T1 是 100 BTC（实际上我们只发送了 2 BTC）来欺骗系统，区块链社区会通过将假交易与 R 进行哈希来检查，这将生成一个与 R1 完全不同的全新根哈希值
    R''1。这种矛盾的出现将证明我们关于 100 BTC 的声明是虚假的。这正是比特币作为一种加密货币在防止双重支付问题上如此优雅的原因。


    现在出现的一个有趣方面是以太坊区块链如何工作。我们看到，比特币区块链是一种用于价值转移和验证交易的去中心化应用。而以太坊区块链甚至可以执行代码。作为软件开发人员，你们大多数可能对代码在运行时的状态很熟悉。


    简单来说，状态就是一段代码在任一给定时刻的配置。以太坊区块链充当一个去中心化应用平台，它在代码执行（即运行时）期间存储代码的每个状态，并据此创建一条哈希链。再次稍作停顿，让这个概念沉淀一下。因此，当我们在以太坊区块链上执行一段代码时，执行代码的每一个状态（S1,
    S2）都会分别与根 R'' 和 R''1 合并，并且公开可见。任何类型的代码故障都会被捕获并存储在公共区块链上，并永远保留在那里。将来，我们或许能看到曾在以太坊区块链上执行过的所有代码的所有先前状态。一个显而易见的问题出现了：当世界上许多此类代码在以太坊平台上运行时，运行时日志呈指数级增长，这类区块链究竟如何才能扩展？值得思考。


    与此同时，我们继续从交易者的角度来理解区块链。金融工具交易者或银行家将货币视为具有三大关键功能的东西：


    - 交换媒介

    - 价值储存

    - 记账单位


    对交易者来说，加密货币与实物货币并无不同，尽管它只以虚拟形式存在，且没有中心化的控制权威。从交易者的角度来看，区块链被视为一种分布式账本，其中分布式共识充当这种虚拟货币表面上的中心权威。


    区块链不可篡改，因此成为过去任何价值转移的永久记录，同时以密码学方式保护任何交易双方客户的身份隐私。


    需要强调的是，这两种区块链视角并不相互排斥。这些看似不同的视角并不是“苹果与橘子”的比较。它们协同共存，共同催生出一种去中心化经济，我们将在后面的章节中探讨。现在，你可以参考图
    1.7 来理解区块链在金融科技生态系统中的定位：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_46_0.png)


    图 1.7：金融科技生态系统中的区块链


    ## 区块内部


    现在让我们讨论比特币区块链区块的内容。这将有助于我们理解和比较以太坊，我们将在第 2 章“深入理解以太坊”中讨论以太坊。区块是一个非常有趣的概念，因为区块赋予了区块链其特性。它是区块链的基本元素。


    因此，了解区块由什么组成非常重要。图 1.8 列出了比特币区块的基本组成部分。首先，我们有一个魔法数字，也称为比特币网络 ID。


    | 字段 | 描述 | 大小 |

    |---|---|---|

    | 魔法数字 | 值始终为 0xD9B4BEF9 | 4 字节 |

    | 区块大小 | 从该字段之后到区块末尾的字节数 | 4 字节 |

    | 区块头 | 包含 6 个项目 | 80 字节 |

    | 交易计数器 | 正整数 VI = Varint | 1 - 9 字节 |

    | 交易 | （非空）交易列表 | <交易计数器>-多笔交易 |


    图 1.8：比特币区块的组成部分（比特币 Wiki）


    它长度为四个字节，是一个任意数字，用于标识这是一个比特币区块。魔法数字并非比特币特有。所有节点都使用传输控制协议（TCP）进行通信。


    在 TCP 中，不同类型的数据包使用不同的魔法数字来标识自身。这就像在填写护照时声明我们的性别，以表明自己是男性、女性或跨性别者。在我们的上下文中，区块实际上是一个
    0 和 1 的序列。当任何机器读取这样的数据序列并遇到 0xD9B4BEF9 的二进制版本时，它就会将该数据识别为比特币区块。因此，这个数字对所有比特币区块都是相同的。那么，为什么比特币区块会选择
    0xD9B4BEF9 呢？


    根据比特币 main.cpp 文件（比特币实现是用 C++ 语言编写的）中的注释，选择这个魔法数字的原因是：这些字符在上部 ASCII 中很少使用，不是有效的
    UTF-8，并且在任何对齐方式下都能产生一个大的四字节整数。


    接下来是区块大小，它也是四个字节，告诉我们这个区块连同其所有交易有多长。截至 2017 年 7 月，整个比特币区块的大小最大为 1 MB。然后是区块头，它有
    80 字节，是最有趣的部分；稍后我们将讨论其内容。下一个是交易计数器，它是一个整数，告诉我们这个区块有多少笔交易，接下来是交易列表，其中包含该区块中的所有交易。


    例如，如果交易计数器为 20，那么区块中就有 20 笔交易。交易计数器的长度是 1 到 9 字节。以上就是区块的基本组成部分。


    那么，让我们继续查看比特币区块头由什么组成。在图 1.9 中，我们列出了区块头的各个部分。区块头有一个版本号，它只是告诉我们当前使用的格式版本。


    例如，当前比特币版本是 2。


    | 字段 | 用途 | 何时更新... | 大小（字节） |

    |---|---|---|---|

    | 版本 | 区块版本号 | 你升级软件并指定新版本时 | 4 |

    | hashPrevBlock | 前一个区块头的 256 位哈希 | 新区块到来时 | 32 |

    | hashMerkleRoot | 基于区块中所有交易的 256 位哈希 | 交易被接受时 | 32 |

    | 时间 | 自 1970-01-01T00:00 UTC 以来的秒数（当前时间戳） | 每隔几秒 | 4 |

    | Bits | 紧凑格式的当前目标 | 难度调整时 | 4 |

    | Nonce | 32 位数字（从 0 开始） | 尝试一个哈希时（递增） | 4 |


    图 1.9：比特币区块头（比特币 Wiki）


    现在，如果出于某种原因，来自版本 1 客户端的比特币区块到来，它将被区块链忽略。未来，比特币区块的大小和格式可能会发生变化。届时，我们将不得不更改每个区块中的这个版本号，以使其在区块链中仍然有效。版本

