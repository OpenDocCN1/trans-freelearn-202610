    This design pattern is a kind of creational design pattern. Using this pattern,
    objects can be created without specifying the exact class of creation.


    *Figure 11.4* is a simple hub (`Barrel`) that deploys contracts (`Whisky`) from
    a template and keeps track of the contracts created.


    `Whisky` is part of the source file so `Barrel` can "see it" during compilation.
