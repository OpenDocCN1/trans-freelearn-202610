    ## Government


    Government systems are often prone to corruption, slow, and not transparent. Implementing
    blockchain-based systems can significantly increase security, transparency, and
    efficiency by reducing bureaucratic overheads of government operations.


    Estonia is planning to open crypto-banks. Dubai is aiming to upload government
    documents on the blockchain by 2020.


    ## Private transport and ride sharing


    It is a fact that Uber and Ola have disrupted the taxi and public transportation
    industry. The blockchain can take this a notch higher by providing a decentralized,
    peer-to-peer sharing paradigm. This will help the driver community to earn more
    without the unnecessary middlemen commission.


    Oaken Innovations and MIT Media Lab have tied up with Toyota for yet another project
    on toll-fee collection for developing a peer-to-peer ride-sharing DApp. Lazooz.org,
    based in Tel-Aviv, Israel, has launched a decentralized, community-owned transportation
    system with ride-sharing facilities.


    ## Cloud storage


    The blockchain allows cloud storage to be encrypted and highly distributed, making
    it more robust against attacks. Data on a centralized server is vulnerable to
    data loss, hacks, and human error.


    Storj.io is an encrypted cloud storage network using blockchain. But the pricing
    of the storage and retrieval is still a challenge. Swarm and IPFS also have the
    potential to evolve into a mature cloud storage with the fee structure at a minimum.


    ## Healthcare


    Technologies such as the blockchain can be a boon to the health record industry,
    for tamper-proof personal health records, which relies a lot on government authorities
    and legacy storage systems. It can empower the general public to fight against
    meaningless politics. Ledgers are open to the public with anonymized patient data,
    right from admission to discharge. No modification is possible. No tampering allowed.


    MedRec is one such project incubated within MIT Media Lab that has developed a
    medical record-keeping prototype on an Ethereum-based, private blockchain. This
    decentralized application can connect the patient record along with external data
    sources, like Fitbit (real-time physical activity tracking app using IoT) and
    23andMe (DNA trait-determining app from saliva samples). MedRec also allows patients
    to securely grant access to different doctors as well as healthcare providers,
    researchers, and even the patient''s children and grandchildren to their personal
    health information.


    ## Smart contract use cases


    In this section, we will be discussing how smart contracts as a technology can
    disrupt every aspect of society and its economy.


    Figure 9.2 depicts 12 use cases for smart contracts:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_286_0.png)


    Figure 9.2: Smart contract use cases


    ### Insurance


    Most of the insurance processes are disjointed by nature with many human interventions.
    Smart contracts along with the IoT can make self-aware decisions for automated
    insurance payouts.


    It increases savings by reducing duplicated work in verifying reports and policies.


    ### Trade finance


    Smart contracts facilitate faster letters of credit and payment initiations, leading
    to streamlined international transfers. This increases the liquidity of assets,
    improves efficiency in creating contract agreements, and promotes faster approval
    of payments.


    ### Derivatives


    Smart contracts eliminate duplicate processes during a trading life cycle by streamlining
    post-trade processes. It supports real-time valuation of positions, automated
    external event processing, and automated settlement of obligations while processing
    triggered trade events.


    ### Securities


    Smart contracts can facilitate automated dividend payouts, stock splits, and management
    of liabilities.


    It also reduces operational risk by circumventing intermediaries and managing
    capitalization.


    It provides a digitized, transparent, and traceable end-to-end workflow due to
    securities on a distributed ledger.


    ### Accounts


    Decentralized financial record-keeping using smart contracts improves transparency
    and data integrity, which leads to market stability. Insight into the capital
    amount gets improved owing to increased accessibility to financial data.


    ### Digital identity


    Smart contracts can enable individuals to control and own their digital identity.
    Every individual can then choose which personal data they would expose to third
    parties as KYC information.


    This will lead to lower data leakage by counterparties and increase compliance
    and interoperability.


    ### Record-keeping


    Automated compliance, auto renewal, auto release, and automated commercial code
    filing are some of the major advantages of a smart contract.


    This in turn reduces legal bills, tracks loans and collateral values, and archives
    automatically.


    ### Loans and mortgages


    A mortgage is currently a very confusing and manual process. Smart contracts can
    automate this by connecting different parties involved in the mortgage transaction,
    enabling a less error-prone process.


    It increases the visibility of the service records and automates the release of
    control from mortgaged property when it is paid off.


    ### Legal


    Legal services such as property transfer can be made fraud-free and seamless using
    smart contracts. The transactions are efficient and transparent. The audit and
    assurance costs are also reduced.


    ### Supply chain


    Smart contracts simplify complex multi-party delivery systems and achieve granularity
    on product tracking; traceability and verification get enhanced and reduce fraud
    and theft. Oracles play an important role in the supply chain to provide external
    data to smart contracts.


    ### Clinical trials


    Smart contracts increase cross-institutional visibility, defying geographical
    borders, which can immensely benefit clinical trials. It enables consent tracking
    of patient data, increases data privacy, streamlines trials, and processes setups
    by enhancing reproducibility of trial results by independent groups of researchers.


    ### Terminal disease research


    Terminal diseases such as cancer have their share of research challenges through
    collaboration due to data privacy concerns and misaligned incentives. Smart contracts
    can unleash the power of data by providing efficient data sharing across many
    sectors yet preserve patient privacy. It also helps in real-time visibility and
    policy enforcement, while maintaining regulatory requirements and patient consent.


    ## Decentralized microblogging


    In this section, we are going to explore the design of a basic Ethereum-based
    microblogging platform. Using these platforms, new users can register to get a
    personal microblogging account, which they can use to send anonymous tweets to
    a decentralized Ethereum-based private blockchain, with comments disabled by default.


