  - '[PAGE 351]


    # Registries


    Registries are mainly data design patterns. IT helps to refer contracts or addresses
    in a human-readable form. It typically consists of name-to-address associations.
    It is analogous to the facade (literally meaning a deceptive outward appearance)
    design pattern and belongs to the category of structural design patterns.


    In the Solidity programming language, the registry pattern can be implemented
    using the mapping keyword. It is used to structure value types, such as Booleans,
    integers, addresses, and structs. It consists of two main parts: a _KeyType and
    a _ValueType. They appear in the following syntax:


    ```

    mapping (_KeyType => _ValueType) mapName

    ```'
  - '[PAGE 352]


    # # Voting systems


    Voting systems are complex design patterns that comprise many simpler design patterns,
    such as factory, proxy, memento, composite, observer, and chain of responsibilities.
    Such complex design patterns can themselves serve as standalone applications.


    Implementing a completely decentralized voting system is still an open challenge,
    as the following modules are necessary to design any voting system:


    +   - **Voter**: One who casts a vote. They must be identifiable to avoid double
    voting. Yet their votes must be private.

    +   - **Authenticator**: This module authenticates the voter''s identity.

    +   - **User**: They are basically volunteers who assist the voters for correct
    usage of the voting process but do not influence the voter''s decision.

    +   - **Election officer**: This module supervises any discrepancy that may arise
    during the voting process.

    +   - **Administrator**: This module maintains the authenticator as well as anonymity
    of a voter''s choice.

    +   - **Researcher**: These are basically statistical agents to detect anomalies
    and maintain counts.

    +   - **Database**: This is the repository where the voting transactions get stored,
    as well as voter identity.'
