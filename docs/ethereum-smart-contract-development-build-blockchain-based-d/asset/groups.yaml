  - "[PAGE 116]\n\n# # Coding a loop\n\nLoops are very helpful when we need to repeat\
    \ the execution of a piece of code a certain number of times. Rather than copying\
    \ and pasting the same lines of code, making the code block longer, we use this\
    \ programming construct to add brevity to our code. Loops can be finite or infinite\
    \ in nature. For the infinite loop, we generally provide a break statement to\
    \ come out of it.\n\nThe smart contract in *Figure 3.16* is using a finite loop\
    \ to calculate the summation of a finite number of integers:\n\n```\n```solidity\n\
    pragma solidity ^0.4.11;\n\ncontract numberLoop {\n    uint number; // unsigned\
    \ integer is positive integer\n    //constructor function with default value\n\
    \    function numberLoop() public {\n        number = 100;\n    }\n    function\
    \ myFirstLoop() public returns (uint) {\n        for (uint i = 1; i < 10; i++)\
    \ {\n            number = number + i;\n        }\n        return number;\n   \
    \ }\n}\n```\n```\n\nFigure 3.16: Loop inside a Solidity smart contract\n\nThe\
    \ output on remix IDE is shown in *Figure 3.17*. As discussed earlier, keep a\
    \ watch on the amount of ethers that is getting decreased in the Account tab for\
    \ each call of the `myFirstLoop` function:"
