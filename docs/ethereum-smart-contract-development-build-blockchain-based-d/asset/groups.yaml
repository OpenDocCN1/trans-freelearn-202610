    +   1. **Stage one.**

    +      **Placement**: The physical disposal of cash or other assets derived from
    criminal activity

    +   2. **Stage two.**

    +      **Layering**: The separation of illicit proceeds from their source by layers
    of financial transactions intended to conceal the origin of the proceeds

    +   3. **Stage three.**

    +      **Integration**: Supplying apparent legitimacy to illicit wealth through
    the re-entry of the funds into the economy, in what appears to be normal business
    or personal transactions


