  mdcn: "\n\n## Web3.js 在以太坊生态系统中的作用\n\n戴尔·卡内基，这位著名的自我提升训练师，曾说过财务成功有15%归因于技术技能，其余85%则归因于表达思想和激发人们热情的能力。区块链可能是由可靠的计算原理支持的前沿技术，但要使其取得财务成功，我们需要在人们中实现大规模采用。为此，我们需要一个每个人都能理解的接口。\n\
    \nWeb3.js 是一项可以帮助我们在这一领域的技术。Web3.js 为以太坊提供了 JavaScript 绑定，然后可用于使用 Web 堆栈构建直观的用户界面。\n\
    \n![](img/8c91673d39176d2e910ac52c4bc35d8b_225_0.png)\n\n图 7.1：Web3.js 通过 geth\
    \ 与私有区块链交互\n\n它提供了一个抽象层来隐藏区块链上智能合约复杂的内部运作。简单来说，使用 JavaScript 实现的 Web 应用程序通过 Web3.js\
    \ 库与以太坊节点通信或与区块链上的智能合约进行交易。\n\n图 7.1 说明了这种交互。图 7.2 清楚地区分了 Mist、geth 和 Web3.js。在此表中，我们可以看到\
    \ Mist 和 geth 使用 IPC，而 Web3.js 使用远程过程调用（RPC）。\n\n在以太坊生态系统中，IPC 通常在计算机本地工作。IPC\
    \ 通常涉及 geth 在我们计算机的本地文件系统中创建一个 IPC 管道，命名为 geth.ipc。现在同一台计算机中的不同进程可以使用此管道与 geth\
    \ 控制台创建双向通信。另一方面，RPC 在不同计算机之间工作，除非我们严格指定通过 RPC 端点连接到 localhost，例如使用 localhost:8545\
    \ 或 127.0.0.1:8545。\n\n| Mist | Geth | Web3.js |\n|---|---|---|\n| 它是一个浏览器 | 它是一个命令行界面\
    \ | 它是一个 API 库 |\n| 主要使用 JavaScript 实现 | 主要使用 Golang 实现 | 主要使用 JavaScript 实现 |\n\
    | 它用作钱包并且可以在区块链上运行 DApps | 它是运行完整以太坊节点或私有区块链的工具 | 它使用用户触发事件与以太坊节点交互 |\n| 使用进程间通信（IPC）\
    \ | 使用进程间通信（IPC） | 使用远程过程调用（RPC） |\n\n图 7.2：Mist 与 geth 与 Web3.js\n\n有趣的是，geth\
    \ 和 Web3.js 中的 IPC 和 RPC 都使用一个名为 JSON-RPC 的通用协议。JavaScript 对象表示法（JSON）是一种轻量级的数据交换格式，用于人类与机器交互。人类发现这种格式易于阅读和编写。机器发现这种格式易于解析和生成。这种数据格式完全独立于语言，基本上由两种结构组成：名称-值对和有序的值列表。\n\
    \nJSON-RPC 是一种无状态的轻量级 RPC 协议，使用 RFC 4627 作为数据格式。**请求评论（RFC）** 由 IETF 发布（请参阅 _第\
    \ 2 章，Grokking Ethereum_）。\n\n典型的 JSON-RPC 请求示例如下：\n\n```json\n{\"jsonrpc\":\"\
    2.0\",\"method\":\"eth_coinbase\",\"params\":[],\"id\": 67}\n```\n\n在前面的示例中，我们有一个包含四个属性的列表：\n\
    \n- `jsonrpc`：这是一个字符串，指定 JSON-RPC 协议的版本。这里版本为 `\"2.0\"`。\n- `method`：这是一个包含要调用的方法的字符串。\n\
    - `params`：这包含在调用方法期间要使用的参数值。\n- `id`：这是客户端建立的标识符。如果指定，我们让服务器知道我们期望一个响应。否则，服务器假设该消息为通知。\n\
    \n截至撰写本文时，Web3.js 的工作版本为 0.x.x；1.0 版本仍未发布。一旦 Web3.js 版本 1.0 发布，其库将支持如 _图 7.3_\
    \ 所示的一组模块。\n\n每个模块为以太坊生态系统贡献特定的功能：\n\n- web3-eth 模块用于在以太坊区块链上开发智能合约\n- web3-shh\
    \ 模块用于使用 whisper 协议进行点对点通信\n- `web3-bzz` 模块用于使用 swarm 协议进行去中心化文件存储\n- `web3-utils`\
    \ 模块用于 DApp 开发并包含有用的辅助函数\n\n这在以下图中可视化：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_228_0.png)\n\
    \n图 7.3：Web3.js 在以太坊生态系统中的模块\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_230_0.png)\n\
    \n图 7.4：从 GitHub 安装 Web3.js 和 http-server\n\n一旦 HTTP 服务器安装完成，我们就可以使用 http-server\
    \ 命令启动服务器。要终止服务器实例，我们需要按 Ctrl + C。现在我们使用 Cygwin 打开 geth 节点，使用以下 geth 命令：\n\n```\n\
    > geth -datadir=./chaindata/ --rpc --rpccorsdomain \"*\"\n```\n\n这是跨源资源共享（CORS）。例如，假设您想使用单个\
    \ Web 页面应用程序向多个服务器发送和接收数据，这就是 CORS 发挥作用的地方。它充当浏览器同源安全策略的变通方法。在使用 Web3.js 设置私有区块链后，我们编写一个名为\
    \ myDapp 的基本合约来获取我的钱包余额。此文件命名为 index.html 并放置在 web3.js 文件夹之外。\n\n图 7.5 显示了调用 Web3.js\
    \ 库的 HTML 脚本，使用 JavaScript 代码：\n\n```\n<!doctype html>\n<html>\n<head>\n<title>myDapp</title>\n\
    <script src=\"web3.js/dist/web3.min.js\"></script>\n<script type=\"text/javascript\"\
    >\n    if (typeof web3 !== 'undefined') {\n        web3 = new Web3(web3.currentProvider);\n\
    \    } else {\n        // set the provider you want from Web3.providers\n    \
    \    web3 = new Web3(new Web3.providers.HttpProvider(\"http://localhost:8545\"\
    ));\n    }\n    function getBalance() {\n        document.getElementById(\"myBalance\"\
    ).innerText =\n        web3.fromWei(web3.eth.getBalance(web3.eth.accounts[0]),\
    \ \"ether\");\n    }\n</script>\n</head>\n<body>\n<h1>This is my balance</h1>\n\
    <button onclick=\"getBalance()\">Update my balance</button>\n<span id=\"myBalance\"\
    ></span> in Ether\n</body>\n</html>\n```\n\n图 7.5：index.html 中的 Web3.js 库\n\n\
    当我们在 Web 浏览器中打开此 index.html 文件并按下余额按钮时，它会返回我私有区块链中存在的以太币数量，这可以通过打开 Mist 浏览器来验证。这种比较在图\
    \ 7.6 中说明。在下一节中，我们将对 Web3.js 中的 API 结构有一个高层次的了解。\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_231_0.png)\n\
    \n图 7.6：Mist 与基于 Web3.js 的 Dapp 的以太币余额比较\n\n## Web3.js 的 API 结构\n\n让我非常诚实地告诉你，浏览\
    \ Web3.js 库以找到我们合约所需的合适函数可能会令人困惑。这就是我们需要将 Web3.js 1.0 文档视为我们完美的旅游指南手册的原因。整个文档可免费获取，网址为\
    \ https://web3js.readthedocs.io/en/1.0/index.html。\n\n在本节中，我们将可视化重要 API 的地图，以便当我们实际编写合约时，可以直接跳转到\
    \ Web3.js 文档的各部分以获取规范和参数使用模式。\n\n如图 7.3 所示，我们有四个子模块，即 web3-eth、web3-shh、web3-bzz\
    \ 和 web3-utils。在图 7.4 中，我们将 web3-eth 模块细分为重要的子 API 模块。每个子模块都有若干辅助函数，可由智能合约调用。\n\
    \n要完成通过辅助函数可用的任何通用任务，调用的智能合约必须花费操作所需的以太币。\n\n```\nweb3.eth.personal.sign(dataToSign,\
    \ address, password, [callback])\n```\n\n下面是一个调用此函数并将输出打印到控制台的示例：\n\n```\nweb3.eth.personal.sign(\"\
    Dear Lord\", \"0x11f4d0A3c12e86D4D5F39D213F9E19D048296DAe\", \"password\")\n\"\
    0x30955ed65396facf86c53e6219c52D4daeDe92aa4941d89635409de4c9c9f9466d4e9aaec999\"\
    \n```\n\n以下是 web3.eth 的 API 子模块：\n\n"
