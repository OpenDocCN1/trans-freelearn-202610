    \n图 5.15：Remix 浏览器上的企业版 votingDapp\n\n至此，本章即将结束。话虽如此，智能合约仍然是一个快速发展的主题。在第 6 章《Solidity\
    \ 深入》中，我们将讨论 Solidity 编程语言，以及它如何帮助创建复杂的智能合约。\n\n# 总结\n\n在本章开始时，我们破除了关于智能合约的迷思。我们意识到，智能合约无法自行做出决策，需要算法触发才能实现这样的功能。我们还研究了智能合约的原始定义，并认识到智能合约模型位于一个从编码自然语言到完全自动化的频谱上。我们了解到，代码在智能合约中的作用包括优化、审计和遵守合规要求的明智组合。我们讨论了\
    \ Solidity 编译器未能优化的高 Gas 成本代码模式，并将其归类为无用代码和昂贵循环。然后，我们简要了解了如何使用预言机化来提供真实数据，以及 GitHub\
    \ 归档上的一个问题如何催生了 ERC20 标准。最后，我们在私有区块链上部署了一个去中心化投票应用，以此结束本章。在第 6 章《Solidity 深入》中，我们将深入探讨图灵完备的\
    \ Solidity 编程语言。\n\n# Solidity 深入\n\n本章将全面介绍以太坊区块链上图灵完备的 Solidity 语言。我们将首先一窥其设计决策，以及我们究竟为什么需要一门像\
    \ Solidity 这样的新语言。接下来的部分将涵盖 Solidity 语言的细微差别及其使用的基本语法。具体来说，我们将涵盖面向合约的特性、函数、事件、继承、库、表达式、控制结构、单位和变量。然后，我们将一窥优化器和调试选项。最后，我们将分析导致近期以太坊区块链\
    \ Parity 钱包被黑客攻击的代码缺陷，该攻击盗取了价值约 3000 万美元的以太币。\n\n学习完本章后，你将能够：\n\n+   - 认识到 Solidity\
    \ 相对于其他高级语言的必要性\n+   - 理解 Solidity 的细微差别、语法和特性\n+   - 一窥 Solidity 优化器和调试选项\n+\
    \   - 分析 3000 万美元 Parity 钱包攻击事件背后的缺陷\n\n# 对 Solidity 的需求\n\n让我告诉你们一个关于程序员的肮脏秘密。在整个工程界中，我们是最懒惰的一群技术人员。我们非常努力地工作，就是为了保持懒惰。我们恪守这样一句誓言：\n\
    \n> “如果说需要是发明之母，那么懒惰就是发明之父。”\n\n难怪我们如此热爱开源运动。重用另一个懒惰程序员的代码正是我们所梦寐以求的。而为了增添一点虚伪的色彩，我们也从不忘记抱怨或批评原始代码有多么混乱，以及我们是多么英勇地驱赶了那些\
    \ bug，并将其整理成文档，使之成为 2.0 或更高版本。这就是我们的天性。\n\n但是，有时在这片懒惰极客的土地上，会出现一个异类，他完全从头开始编写一些全新的东西。整个懒惰社区随后会嘲笑这些粗糙的代码。渐渐地，这个异类消除了新东西中的\
