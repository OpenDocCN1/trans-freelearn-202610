    ## BaaS and the Dark Web Market


    This chapter introduces you to various platforms specific to smart contract and
    blockchain development. We will begin with a discussion about private, consortium,
    and public blockchains on the permission spectrum. Then we will dive into the
    concept of **blockchain-as-a-service (BaaS)** and introduce enterprise platforms,
    such as Hyperledger, Azure, and AWS. We conclude this chapter by exploring the
    mysterious dark web marketplaces with notes on money laundering.


    After studying this chapter, you will be able to:


