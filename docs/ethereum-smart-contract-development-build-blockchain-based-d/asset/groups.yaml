    hard fork (UAHF). To summarize, soft forks are backward compatible, while hard
    forks are not. In hard forks, the community has to choose only one of the forking
    paths and cannot go back to the other later with the changed specifications. A
    hard fork is like the red/blue pill of Morpheus from the movie The Matrix.


    ## Blockchains – evolution, generations, and hype


    We live in exponential times. As mere mortals, we normally perceive time in a
    linear way.


    For example, one of the greatest inventions of mankind, the landline telephone,
    took about half a century to establish itself as a mainstream consumer appliance
    from a symbol of luxury, whereas smart phones crossed that barrier within a decade.


