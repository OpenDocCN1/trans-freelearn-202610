  - '[PAGE 195]


    referring to, in our chapters context. It is good old JavaScript (with the de
    facto standard as ECMAScript) and the outlier is Brendan Eich.


    A programming language design is done with a particular operating environment
    in mind and a list of target tasks it needs to complete. All design decisions,
    features that are to be supported, and ones that need to be dropped, are driven
    by these two distinct factors. In the case of Ethereum, the operating environment
    was the **Ethereum virtual machine (EVM)**, which would take care of the second
    factor, to perform the entire assigned task over the Ethereum blockchain.


    But who would pass the instructions to the EVM? We need some sort of human machine
    interface. Hence, the **application binary interface (ABI)** was introduced. The
    sole aim of this interface was to make machine code portable across the blockchain.
    It is analogous to an **application programming interface (API)**, where we make
    the source code portable across various high-level languages.


    But the ABI was not enough to make complex abstractions such as a wallet or an
    oracle. The ABI is static, strongly typed, and known at compilation time. The
    need for a Turing-complete programming language that could totally adapt with
    the EVM and seamlessly couple with the ABI was obvious. It needed to have the
    user-rich features of JavaScript bundled with the assembly level, high performance
    of C++. Gavin Wood proposed a design of such a language and code-named it solidity.
    This language, along with the capability of writing a smart contract, also included
    properties such as safe language subsets, static analysis, in-built test-generations,
    executing environments, named components, contracts as class entities, and the
    ability of a contract to map segment information to storage.


    The EVM is just a very different beast. The decision to make a language specifically
    tailored to the EVM execution environment has helped the Ethereum community to
    prevent the problem of highly sub-optimal code execution. But a new language comes
    with its own set of grammar rules and features, which we will be discussing in
    the next section.'
