    \ here. Try to stick to some logical names.\n\n- 2. Then, we declare an unsigned\
    \ integer value that will store our default number, which must be a positive integer.\n\
    \n- 3. Now we need to give our contract a constructor function. So, what is a\
    \ constructor function? Basically, this is a function that will be called whenever\
    \ our contract is deployed and initiated for the first time. What's special about\
    \ this constructor function is that it has the same name as that of the contract,\
    \ that is, `ArithValue`. Inside the constructor function, we assign `100` to the\
    \ number variable. So, now, whenever the contract gets initiated for the first\
    \ time, it will set a default value of 100 to our unsigned integer variable number.\n\
    \n- 4. Now we create four other functions inside the contract that basically set,\
