    以太坊对我们到底意味着什么？它只是另一种模仿比特币的加密货币，还是一个可以运行各种应用程序在公共区块链上的分布式软件平台？作为一名软件开发者，我可以向你保证，以太坊远比它在标准维基百科文章中目前的定义要大得多。


    花点时间阅读以下定义。暂停，闭上眼睛，思考一下。下面的定义传达了一个微妙但非常有力的信息。它告诉我们：


    这是一个 24/7 的计算系统，你可以零前期成本拥有它。你可以复制它，使用它，模仿它，摆弄它，玩弄它，并根据你的需求调整它。不仅如此，你还可以用它发明自己的个性化货币，并提供给愿意拥有它的人。作为回报，你将通过公共账本上的合约永久定义地为他们提供某种服务，因此你和你的客户都无法作弊。取决于你的服务，你的价值会增长，你的货币的价值也会增长。你将与你的客户群体一起创建一个微型生态系统，其拥有独立于任何中央控制当局的个性化经济。效率将被奖励，而自满将被惩罚。那么，你准备好了吗？


