    Figure 6.3: Comments in solidity'
  - '[PAGE 199]


    # # Class properties of a contract


    Solidity is often called a contract-oriented language, as every operation that
    can occur on the blockchain must reside inside the scope of a contract. A contract
    serves as a template definition for the functions and variables, very similar
    to the definition inside a class for an object-oriented language. Like a class,
    contracts can inherit from other contracts.


    A contract can contain declarations ranging from functions and function modifiers,
    state variables, events, enum, and struct types. *Figure 6.4* summarizes these
    declarations in a tabular representation.


    For further details and nuances, solidity has a freely available public documentation
    site. The document is generated using the sphinx package of the Python language
    and can be accessed at http://solidity.readthedocs.io/en/develop/index.html:'
  - "[PAGE 200]\n\n| Declaration | Description | Example |\n|---|---|---|\n| State\
    \ Variables | Permanently stored values in contract storage | `uint32,bool, ufixed,address`\
    \ |\n| Functions | Executable code units inside a contract | ```solidity\ncontract\
    \ SampleContract {\n    function newfunction() payable { // Function\n       \
    \ // code\n    }\n}\n``` |\n| Function Modifiers | Used as a declarative way of\
    \ amending semantics of functions | ```solidity\ncontract newContract {\n    address\
    \ public bidder;\n\n    modifier onlyBidder() { // Modifier\n        require(msg.sender\
    \ == bidder);\n        _;\n    }\n\n    function abort() onlyBidder { // Modifier\
    \ usage\n        // code\n    }\n}\n``` |\n| Events | Used for EVM logging facility\
    \ and Convenience Interface | ```solidity\ncontract newAuction {\n    event HighBidIncrease(address\
    \ bidder, uint amount); // Event\n\n    function bid() payable {\n        // code\n\
    \        HighBidIncrease(msg.sender, msg.value); // Triggering event\n    }\n\
    }\n``` |\n| Structs Types | Customized type to group several variables | ```solidity\n\
    contract VotApp {\n    struct Electorate { // Struct\n        uint identity;\n\
    \        bool voted;\n        address delegate;\n        uint vote;\n    }\n}\n\
    ``` |\n| Enum Types | Customized type with a finite set of values | ```solidity\n\
    contract Volcano {\n    enum State { Active, Extinct, Dormant } // Enum\n}\n```\
    \ |\n\nFigure 6.4: Summarized declarations of solidity"
  - '[PAGE 201]


    # # Functions


    Solidity has basically two types of function calls. One is the internal, also
    called a message call, which does not make an actual call to the EVM. Another
    is the external function call, which is part of the contract interface and can
    be called from other contracts via transactions. These functions are mostly efficient
    when the contract is receiving large arrays of data. An external function cannot
    make internal calls.


    Function visibility has classified solidity into four types, namely `external`,
    `internal`, `public`, and `private`. The private visibility only prevents other
    contracts from accessing or modifying information residing in the contract, but
    it is still visible to the whole world on the live public blockchain.


    During this entire book, we have been trying to build contracts and deploy them
    over a blockchain. A contract, once deployed on the blockchain, continues to run
    forever. But real life has some constraints; we might not want certain contracts
    to continue after a certain period of time. For example, we might not want to
    renew our car insurance contract as we plan to sell the car. That is why we need
    some mechanism to terminate or kill a contract.


    *Figure 6.5* represents a killer contract that has a function, which when executed,
    kills a live contract, and takes it off the blockchain. Actually it is done by
    an in-built EVM operation, `selfdestruct`. It needs an input parameter in terms
    of the address to send the remaining ethers and the killing occurs, which takes
    away the contract from the blockchain:'
  - "[PAGE 202]\n\n```\npragma solidity ^0.4.11;\n\ncontract MyKillerContract {\n\
    \    address owner;\n\n    function MyKillerContract() public {\n        owner\
    \ = msg.sender;\n    }\n\n    function getCreator() public constant returns(address)\
    \ {\n        return owner;\n    }\n\n    function kill() public {\n        if(msg.sender\
    \ == owner) {\n            selfdestruct(msg.sender);\n        }\n    }\n}\n```\n\
    \nFigure 6.5: Killer contract using selfdestruct operation\n\nApart from `selfdestruct`,\
    \ a function can be declared as a `view`, `pure`, `getter`, and `fallback` function.\
    \ A `view` declaration ensures that the state of a function is not modified. A\
    \ `pure` declaration ensures the function is not read and does not modify the\
    \ state of a function. The compiler automatically creates a `getter` function\
    \ for all state variables, hence they have external visibility. Fallbacks are\
    \ basically nameless functions that generally do not have arguments and cannot\
    \ return anything. This chapter's last section on Parity hack will discuss fallback\
    \ function in greater details."
