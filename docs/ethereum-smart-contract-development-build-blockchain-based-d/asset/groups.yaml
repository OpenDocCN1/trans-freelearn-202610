    In 2014, David Johnston, CEO of Factom Inc., proposed the Johnston''s law for
    DApps:


    > "Everything that can be decentralized, will be decentralized."


    Academically, this law is a morphed version of Murphy''s law over Moore''s Law,
    which is a rule of thumb for any innovative technology, stating that the rate
    of entries occurring on a blockchain per day would double every 2 years in the
    foreseeable future.


    Murphy''s law, coined by the US Air Force, states that anything that can go wrong
    will go wrong. In the UK, an equivalent Sod''s law exists, which states that anything
    that can go wrong will go wrong with the worst possible outcome.


