    图2.15：以太坊区块内的模块


    如果我们仔细研究这个表示，我们会发现，除了**父哈希（prev hash）**之外，还有一个叔块哈希或ommers哈希。那么，叔块在以太坊区块链中扮演什么角色？如果我是一个区块，而区块链是我的家谱，我的叔父会非常接近我的父亲。然而，如果我由叔父的基因所生，情况就会大不相同。那样的话，我的父亲就会变成我的叔父。所以，父哈希就是我的父亲，也是我来自的正确前一个哈希。叔块哈希代表那些非常接近成为我正确前一个区块的区块，但它们未能成功，因为受到了我父亲的打击。所谓打击，是指我父亲做了比叔父更多的PoW；因此，挖矿共识选择了他而不是我的叔父。那么，我的叔父会发生什么？他现在已经成为相对于我的区块链的**矿工激活硬分叉（MAHF）**，因此，由于我位于父区块链上紧随我父亲之后（即prev
    hash），我无法访问他。


    类似地，我们可以讨论以太坊和以太坊经典之间的区别。如果你刚接触加密货币和以太坊，你可能已经注意到你可以购买两种不同类型的以太坊。所以，你可以购买称为ETH的以太坊，也可以购买称为ETC的以太坊经典。那么，这两者之间在技术和意识形态上有何区别？在以太坊区块链的创世区块开始时，只有ETH，没有以太坊经典。那么，ETC是如何产生的？一切始于以太坊上的DAO项目。**去中心化自治组织（DAO）**是构建在以太坊之上的一个项目。这个项目基本上是一个可以充当自我引导组织的应用程序，并且它举办了加密货币历史上最大规模的众筹销售。人们将自己的法币投入该项目，并获得了ETH代币作为投资回报。


    然而，这个去中心化组织所构成的智能合约存在一个缺陷。这个缺陷或漏洞使得一群黑客能够从众筹中窃取价值5000万美元的以太币。注意，这些黑客在技术上是利用者，因为这并非真正意义上的黑客攻击（由于bug），而是利用了DAO智能合约设计逻辑中的缺陷。因此，利用者通过这个缺陷窃取了价值5000万美元的以太币。这引发了大量讨论，以太坊社区的大多数人希望进行硬分叉并撤销这次盗窃，以便投资者能拿回资金，而黑客则会损失钱财。然而，要做到这一点，他们需要对区块链进行修改，而这正是以太坊社区内部意识形态争论开始的地方。虽然社区大多数人同意修改和硬分叉，但一个较小但直言不讳的少数派反对这种改变区块链的想法，因为区块链的核心思想是它应该是不可变的。一旦代码铭刻在区块链上，就应该被视为法律，所以如果发生了漏洞利用，我们可以修正以防止再次发生，但不能回头逆转已经发生的事情，无论多么不幸。因此，在争论的这一点上，社区处于一个分岔路口，一部分人希望区块链发生改变，而另一部分人希望继续前进，好像什么都没发生过。于是，这个直言不讳的少数派继续留在旧的区块链上，最终由于用户/社区激活的硬分叉而成为以太坊经典。与此同时，ETH最终被修改以将资金返还给投资者，因为风险很高。这就是为什么我们同时拥有ETH和ETC作为加密货币的原因。


    现在，如果你购买了一些ETH或ETC，你会将其存储在哪里？对于法币，我们通常将它们存储在银行账户或钱包中。在去中心化设置中，我们没有银行。然而，我们确实有钱包和客户端，我们将在下一节讨论。


    ## 以太坊钱包和客户端接口


    以太坊客户端指任何能够解析和验证以太坊区块链并执行其上智能合约的节点。正如我们在本章前几节所见，面向用户的客户端的主要目的是授权用户凭证并提供接口以执行各种操作。它们还提供了创建交易和挖掘区块的接口，这对于区块链交互至关重要。图2.16展示了以太坊客户端接口的分类：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_96_0.png)


    图2.16：以太坊客户端接口分类


    钱包提供发送、存储和接收资金的服务。一个好的钱包服务的主要参数是安全性和信任。用户必须感到他们的资金是安全的，并且钱包管理员不会窃取资金。这类钱包被称为热钱包，因为它们始终连接到网络，且经常容易受到黑客攻击和漏洞利用。更安全的钱包包括纸钱包和硬件钱包，它们通常被称为冷钱包。这些钱包基本上以离线模式存储代币。纸钱包以扫描的QR码形式存储，代表接收地址以及必须记住的密码。简单来说，你将密钥打印在纸上，这样它们就不会被黑客入侵。硬件钱包在USB设备上具有硬接线的加密，只有通过密码才能打开。


    图2.17展示了一个钱包分类以便更清晰：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_97_0.png)


    图2.17：以太坊钱包分类


    在所有这些以太坊客户端中，Inzhoop的轻量级以太坊移动钱包（LETH）值得特别提及，因为它不仅提供钱包服务，还拥有一个DApps浏览器商店，托管了不少可用的DApps。基于Android的alpha版本还提供群聊和个人聊天标签，完全基于whisper。聊天记录会保持24小时。目前，可以发送带有生成的bzzkey的图片文件。它目前托管在测试网Ropsten上，而钱包在主网上。因此，安装后聊天、玩游戏甚至开户，你都不需要花费任何宝贵的以太币。操作这个应用不需要任何编程知识，它可以在Google
    Play商店中找到。强烈建议初学者尝试这款基于移动端的应用，以体验DApps、whisper和swarm如何协同工作，创建一个良好的浏览器加钱包平台。他们也有一个适用于桌面的完整应用。


    图2.18展示了LETH（alpha版本）的一些截图：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_98_0.png)


    图2.18：轻量级以太坊移动钱包（Android版）


    这使我们来到了本章的结尾。我希望本章能帮助你获得必要的理论基础，以便在后续章节中踏上以太坊区块链和智能合约开发的旅程。


    卷起袖子，喝杯热咖啡，给设备充上电。我们很快就要动手编写一些Solidity智能合约了。我们第三章见，以太坊智能合约的Hello World。


    ## 智能合约的Hello World


    本章是开发我们第一个智能合约的动手指南。作为自C语言创造者Dennis Ritchie时代以来软件开发者的不成文传统，我们将从一个Hello World程序开始。然后，我们将使用智能合约介绍一些基本的递增、递减和循环操作。我们将逐步创建自己的私有区块链（从创世区块开始）并挖掘自己的以太币。学习本章后，你将能够：


    - 编写你的第一个Hello World智能合约

    - 编写具有基本递增和递减操作的合约

    - 编写循环

    - 在GitHub上提出问题

    - 创建私有区块链并挖掘以太币来运行智能合约


