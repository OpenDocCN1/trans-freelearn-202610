    \ button, followed by fetchNumber; the value 143 is decremented to 142.\n\nAs\
    \ you try this example on your laptop, keep a watch on the Account drop-down tab,\
    \ which is just below the Environment drop-down tab. Did you notice the decreasing\
    \ value of the ether? Do check it:\n"
