    \ 10 倍的金额。*图 4.12* 和 *图 4.13* 展示了这种利用：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_164_0.png)\n\
    \n图 4.13：对于同样的 10 wei，当我们提取时，我们会从 DAO 收到 100 wei 到钱包中\n\n现在，即使钱包中存在恶意逻辑，这段代码也无法从\
    \ DApp 中抽取以太币。这是因为递归路径已被修改，并且在递归代码再次调用自身之前，计数器已被设为零：\n\n```\n```solidity\nfunction\
    \ withdrawAllMyCoins(){\n    uint withdrawAmount = balances[msg.sender];\n   \
    \ //not vulnerable anymore\n    balances[msg.sender] = 0;\n    TypicalWallet wallet\
    \ = TypicalWallet(msg.sender);\n    wallet.payout.value(withdrawAmount)();\n}\n\
    ```\n```\n\n图 4.14. DAO 的代码修复\n\n我们看到了单行代码如何引发金融灾难。我们真的需要摆脱那种错觉，即区块链编码只是有趣的应用程序开发或一般的\
    \ Web 编程。在这里，我们处理的是他人的资金，任何错误的后果都不好受。\n\n## 总结\n\n本章开头，我们定义了 DApp 的四条基本规则：开源、无单点故障、拥有原生代币，以及价值证明算法。我们讨论了适用于\
    \ DApp 的 Johnston 定律以及 DApp 的三大类型。然后我们逐步完成了开发 DApp 的步骤。我们讨论了 DApp 的前端架构，接着转向 ethercast\
    \ 及其各种状态-颜色映射。然后我们了解了 DAO 作为区块链上的有限责任公司的概念。我们甚至从零开始编写了一个简单的 DAO，并从钱包转移了代币。最后，我们详细分析了递归步骤利用漏洞，该漏洞导致了\
    \ 5000 万美元的 DAO 攻击。在第 5 章\"深入智能合约\"中，我们将深入探讨智能合约，学习如何构建健壮且可扩展的代码。\n\n## 深入智能合约\n\
    \n在本章中，我们将深入探讨智能合约的设计。我们首先理解智能合约的教科书式定义。然后，我们继续理解不同的智能合约模型以及代码在智能合约中的作用。接着，我们了解智能合约的基本结构，并看看智能合约是如何工作的。然后，我们将重点转向一些高级主题，例如智能合约优化、审计和\
    \ ERC20 合规性。最后，我们通过构建投票 DApp 的动手练习来结束本章。\n\n学完本章后，你将能够：\n\n- 定义智能合约并理解各种设计模型\n\
    - 领会代码在智能合约中的作用\n- 形象化理解智能合约的基本结构\n- 理解智能合约的优化、审计和合规性\n- 理解使用智能合约的投票 DApp 的设计\n\
    \n## 是什么让合约变得\"智能\"？\n\n早在区块链和互联网出现之前很久的模拟时代，我们就已经拥有了基本上可以执行智能合约的机械设备，那就是自动售货机，如*图\
    \ 5.1* 所示。当你以某种货币支付一定金额后，你就可以选择产品代码。一旦代码被确认，产品就会从机器中出来。如果你不付款，产品就不会出来。如果你在付款后延迟超过等待时间阈值，或出现任何机械故障导致你的会话过期，产品也不会出来。\n\
    \n![](img/8c91673d39176d2e910ac52c4bc35d8b_167_0.png)\n\n图 5.1：自动售货机\n\n我们可以看到，智能合约的概念早在区块链和互联网之前就已经存在了。因此，即使在定义智能合约之前，我们也必须先澄清围绕它的种种误解。排在首位的一个误解是：智能合约是否具有智能。答案是否定的，它既聪明又愚笨，但并不具有智能。为了理解这个微妙的概念，让我们用智能手机来类比。你的手机会在你想到拨号之前就替你拨打电话吗？例如，你正身处一场骚乱之中；设备是否会利用\
    \ GPS 或其他内置应用感知到类似骚乱的情况，并代表你拨打 911 或当地报警电话？不会，对吧？（理想情况下，它不应触发此类电话，因为这非常依赖上下文。你也许实际上正待在一个安全屋里，而误报可能会造成麻烦。）然而，智能手机可能会智能地处理信息，并闪烁显示一条建议。它如何以特定方式处理信息，取决于某个特定应用给出的指令（以代码形式存储）。因此，智能手机上那些能够以某种期望方式处理信息的应用，使得智能手机变得智能。另一个误解是：智能合约就是几行计算机代码。为了理解这一点，让我们来看看下一节中给出的智能合约的定义和设计。\n\
    \n"
