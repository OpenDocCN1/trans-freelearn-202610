    ## Summary


    本章向我们介绍了分布式系统的诸多重要挑战和局限性，例如拜占庭将军问题和 CAP 定理。随后，我们转向理解单向哈希函数以及如何生成哈希链和 Merkle 树。我们认识到区块链本质上是一个巨大的
    Merkle 树，并且比特币和以太坊区块链之间微妙的差异在于将此类树的叶节点分别表示为交易或执行状态。我们深入剖析了比特币区块结构，以揭开挖矿作为一种激励的暴力攻击的本质。另一方面，分叉则标志着区块链协议的变更。最后，我们辨识出区块链的三种生成类型：货币、资产和合约，并思考根据
