    # # Pragma, import, and comments


    A pragma directive of solidity always has versions in the form 0.x.0 or x.0.0,
    as shown in *Figure 6.1*. This ensures that any future version of the solidity
    compiler is ignored that might introduce incompatibility:


    ```

    pragma solidity ^0.4.0;

    ```


    Figure 6.1: Pragma directives


    Although solidity does not have the ability to export or spool-out results yet,
    it supports import statements, which are very similar to JavaScript. This keyword
    is used at contract compile time in our local build environment. Once a contract
    gets deployed on a blockchain using EVM, it can neither read nor write files.
    *Figure 6.2*, lists down a few uses of the import statement at the global scope:


    ```

    import "filename";

    import * as symbolName from "filename";

    import {symbol1 as alias, symbol2} from "filename";

    import "github.com/ethereum/dapp-bin/library/iterable_mapping.sol" as it_mapping

    ```


    Figure 6.2: Import syntax with global scope


    Comments in solidity are of three types. These are single-line comments, multi-line
    comments, and the undocumented `natspec` comment, as depicted in *Figure 6.3*.
    Natspec comments are used directly above a function definition and the `@` tags
    provide a confirmation to the user during static code analysis of whether a variable
    described in the comment is actually used in the code or not:'
