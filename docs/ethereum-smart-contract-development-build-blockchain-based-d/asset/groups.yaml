    当地银行的一位年轻而充满活力的副总裁将这些客户债务视为有价值的未来资产，并提高了索菲亚的借款额度。他看不出有过度担忧的理由，因为他拥有顾客的债务作为抵押。在银行总部，量化交易员将这些酒类贷款转化为
    **neatbonds**、**pintbonds** 和 **hangoverbonds**。这些证券随后在全球证券市场上交易。菜鸟投资者并没有真正理解，他们被当作
    AAA 级债券出售的证券实际上是无收入的重度饮酒者的债务贷款。尽管如此，债券价格持续上涨，这些证券成为一些国家领先的经纪公司最畅销的商品。


