    035 PUSH1 03\n036 CALLDATALOAD\n037 CALLDATACOPY\n... 038 ... 367 ...\n```\n\n\
    Figure 3.9: Hello World 智能合约的 368 字节 [000 to 367] 机器代码\n\n## Remix in a nutshell\n\
    \n那么，这个 remix 是什么？简单来说，它是一个基于浏览器的 **Integrated Development Environment (IDE)**，用于编写\
    \ Solidity 智能合约。它具有集成编译器、无服务器端组件的运行时虚拟环境、集成调试器、集成测试环境和静态代码分析工具。以前，它被称为 **Browser-Solidity**。它不仅可以模拟区块链，还可以突出显示语法和错误，托管多个\
    \ Solidity 文件，并部署合约以及可见的字节码和 **application binary interface (ABI)**，其详细信息可在后面的章节中找到。\n\
    \n然而，我在本章承诺理论少而动手多。所以，让我们现在进入一个增量和减量合约。请注意，使用 geth 和 Mist 部署合约有更专业的方法，我们将在最后一节详细讨论。现在，我们将更多地集中在\
    \ Remix 上使用 Solidity 进行一些快速而粗糙的基础智能合约。\n\n### Increment and decrement operations\
    \ using Solidity\n\n*Figure 3.10* 显示了 Solidity 中增量和减量操作的代码。它还具有一个接收输入的函数，以及一个在合约执行后获取此数字的函数：\n\
    \n```\npragma solidity ^0.4.11;\n// define new contract\ncontract ArithValue{\n\
    \    uint number;\n    function ArithValue() public {  //constructor function\
    \ with default value\n        number = 100;\n    }\n    // constructor function\
    \ to set new value\n    function setNumber(uint theValue) public {\n        number\
    \ = theValue;\n    }\n    // constructor function to fetch the new value\n   \
    \ function fetchNumber() public constant returns (uint) {\n        return number;\n\
    \    }\n    // constructor function to increment by one\n    function incrementNumber()\
    \ public {\n        number=number + 1;\n    }\n    // constructor function to\
    \ decrement by one\n    function decrementNumber() public {\n        number=number\
    \ - 1;\n    }\n}\n```\n\nFigure 3.10: 使用 Solidity 进行增量和减量操作 (ArithValue.sol)\n\
    \n这段代码比 hello world 合约不是复杂一点吗？让我带你走一遍这段代码。第一行以 `pragma` 开始。正如你已经意识到的那样，它只是说明我们将使用哪个版本的\
    \ Solidity。在我们的例子中，我们使用的是版本 `0.4.11`。当我输入时，Remix IDE 支持最高到 0.4.16 的版本。\n\n为了理解\
    \ pragma，让我们回到第 2 章 *Grokking Ethereum* 中自助餐的类比。如果我在自助餐预订时指定我是一个严格的素食主义者，我就是在提前给自助餐组织者某种指示，即我不吃肉、鱼、家禽或鸡蛋等非素食菜肴。因此，在盛大的自助餐开始时，我只会被介绍到提供素食菜肴的柜台。最明显的是，如果我被错误地端上羊肉烤肉串代替西兰花咖喱，我会感到恼火并向组织者指出。然后，我会在触碰或吃食物之前就把盘子换掉，不问任何问题。\n\
    \n以类似的方式，pragma 是一种语言构造，它向编译器提供某种指令，说明如何处理其输入。通常，预处理器处理此类语言构造并指定编译器行为。在我们的例子中，我们的指令是让编译器表现得好像它正在\
    \ Solidity 版本 0.4.11 或更低版本上运行智能合约一样。\n\n如果我们不写这一行会怎样？好吧，没有坏事发生。会抛出一个警告，如 Figure\
    \ 3.11 所示，代码编译得很好。然而，它现在使用默认的 Solidity 版本，我们的情况是 0.4.16。按类比，如果我忘记告诉他们我是素食主义者，就不能怪自助餐组织者给我羊肉烤肉串。然后，我设法吃掉给我端上的食物，通过避免非素食部分来避免进一步的尴尬。\n\
    \n那么，我想表达的重点是什么呢？我想要表达的重点是坚持良好的编程实践，以便其他可能在遥远的将来调试或增强它的程序员可以阅读你的代码。由于所有源代码都是开源的并托管在\
    \ GitHub 类似的平台上，而开发人员天生讨厌编写明确的文档，因此编写带有逻辑内联注释的干净代码是一种推荐的专业礼仪：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_111_0.png)\n\
    \nFigure 3.11: 由于未提及 pragma 指令，ArithValue.sol 编译时出现警告\n\n## 让我们回到我们的代码：\n\n- 1.\
    \ 首先，我们通过定义合约开始。我们将其命名为 `ArithValue`，因为我们将使用算术运算存储和操作一个值。这里没有硬性命名规则。尝试坚持使用一些合乎逻辑的名称。\n\
    \n- 2. 然后，我们声明一个无符号整数值来存储我们的默认数字，它必须是正整数。\n\n- 3. 现在我们需要为合约提供一个构造函数函数。那么构造函数函数是什么？基本上，这是一个函数，它将在我们的合约首次部署和初始化时被调用。这个构造函数函数的特别之处在于它与合约的名称相同，即\
    \ `ArithValue`。在构造函数函数内部，我们将 `100` 分配给 number 变量。因此，现在，每当合约首次初始化时，它将为我们的无符号整数变量\
    \ number 设置默认值 100。\n\n- 4. 现在我们在合约内部创建另外四个函数，它们基本上设置、获取、增加和减少我们分配给变量 number 的值。这些步骤将在我们创建合约后在\
    \ Figure 3.12、Figure 3.13、Figure 3.14 和 Figure 3.15 中显示。理想情况下，我们必须先发布合约然后创建它以实例化，这将在区块链上花费我们真正的以太币，但此时发布意义不大，因为我们正在模拟的区块链环境中工作，并且不会永久发布任何东西。\n\
    \n- 5. 正如 Figure 3.12 所示，一旦合约部署并实例化，四个函数，即 fetchNumber、decrementNumber、incrementNumber\
    \ 和 setNumber，就会被创建。由于构造函数函数，我们的默认值在合约中设置为 100。\n\n- 6. 如 Figure 3.13 所描绘，如果我们按下\
    \ incrementNumber 按钮并按下 fetchNumber 按钮，值会增加到 101。\n\n- 7. 在 Figure 3.14 中，我们输入一个随机正整数\
    \ 143 并按下 setNumber。\n\n- 8. 然后我们按下 fetchNumber，我们的值已更改为 143。\n\n- 9. 然后，如 Figure\
    \ 3.15 所示，我们按下 decrementNumber 按钮，然后按下 fetchNumber；值 143 被递减到 142。\n\n当你在笔记本电脑上尝试此示例时，请注意\
    \ Account 下拉选项卡，它就在 Environment 下拉选项卡下方。你注意到以太币的值在减少吗？请检查一下：\n\n"
