  - '[PAGE 248]


    # ERC20 token development using Truffle


    Truffle is a framework for development, testing, and asset pipelining for Ethereum.
    It also has an incorporated package specification using the ERC190 standard. ERC190
    is a request for comments, which lays down a set of rules about package specifications
    for Ethereum smart contracts.


    Asset pipelining for Ethereum is a concept that has been borrowed from Ruby on
    Rails. This is a feature that provides a framework to concatenate, minify, or
    compress JavaScript, Solidity, and CSS assets in the required sequence of execution.
    This feature helps the developer to create compressed and pre-processed library-like
    modules that can be reused by other coding modules, which helps in improving productivity.


    Let''s start by installing the Truffle framework. The installation is pretty straightforward
    and can be accomplished in the Git Bash window with the following command, as
    shown in Figure 8.2:


    ```

    $ npm install -g truffle

    ```'
