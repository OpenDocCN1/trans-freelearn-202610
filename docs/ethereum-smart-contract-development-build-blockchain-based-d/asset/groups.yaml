    ## 总结


    我们从设计模式的快速介绍开始本章，并讨论了用于智能合约开发的常见模式，例如限制访问、工厂模式、代币系统、注册表和投票系统。然后我们继续了解去中心化自治公司和社会的概念，以及它们与
    DAO 的不同之处。在了解提案生命周期后，我们探讨了与以太坊相关的一些关键提案。选择了几个案例研究以了解联盟区块链的未来影响。我们通过对 Iota 加密货币的
    GitHub 分析以及对 Tangle 的介绍，简要介绍了基于图的分布式账本的世界，结束了本章。


