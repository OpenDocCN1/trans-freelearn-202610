    \n![](img/8c91673d39176d2e910ac52c4bc35d8b_250_0.png)\n\nFigure 8.3: Initiation\
    \ of Truffle framework\n\nLet's now create a simple ERC20-compatible token. For\
    \ that, we create a new folder, ERC20_token, inside the private-truffle-project\
    \ folder and write a solidity file, ScratchToken.sol, inside it.\n\nWe place this\
    \ solidity file, along with the Migration.sol file, inside the contract folder.\n\
    \nNow, we open another Git Bash window and type in testrpc to start the testnet,\
    \ as shown in Figure 8.4:\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_250_1.png)\n\
    \nFigure 8.4: Starting testrpc\n\nIn the old Git Bash window, we change the truffle.js\
    \ file to point to our localhost, as shown in Figure 8.5:\n\n```\nmodule.exports\
    \ = {\n  networks: {\n    development: {\n      host: \"localhost\",\n      port:\
    \ 8545,\n      network_id: \"*\" // Match any network id\n    }\n  }\n};\n```\n\
    \nFigure 8.5: Truffle.js configuration changes\n\nThen, we compile the .sol files,\
    \ as shown in Figure 8.6; they can now be deployed using the command truffle.cmd\
    \ deploy in the testnet:\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_251_0.png)\n\
    \nFigure 8.6: Compiling ScratchToken.sol\n\nThis is how we deploy a basic ERC20-compliant\
    \ token using the Truffle framework. We can add more functionality for incorporating\
    \ other ERC20-compliant functions that are required for a full-fledged token with\
    \ security enhancements.\n\nIn the chapter on smart contracts, we have discussed\
    \ why we need a compliance such as ERC20 and promised to list the various functions\
    \ mandated in an ERC20 token.\n\nAn ERC20-compliant token must have the following\
    \ list of functions with the same naming convention:\n\n```\ntotalSupply ()\n\
    ```\n\nThis function has no arguments and gets back the total supply of tokens\
    \ that is in circulation.\n\nFor example, if we create an ERC20 token that imitates\
    \ the bitcoin ideology, then the `totalSupply()` would fetch 21 million as a number:\n\
    \n```\nbalanceOf (owner)\n```\n\nThe preceding function has an argument inside\
    \ the parenthesis, which is the address of the owner. Hence, this `balanceOf`\
    \ function need the address of the owner to return back the balance value.\n\n\
    ```\ntransfer (to,value)\n```\n\nThe preceding function has two arguments, namely,\
    \ the address of the to, that is, the recipient's address, and the value of how\
    \ many tokens needs to be sent to that address.\n\n```\ntransferFrom (from,to,value)\n\
    ```\n\nThe preceding function has three arguments, namely, the sender's address,\
    \ the recipient's address, and the value of the token that needs to be transferred.\n\
    \n```\napprove (spender,value)\n```\n\nThe preceding function empowers the owner\
    \ to approve a third-party entity to spend tokens up to a designated maximum value.\n\
    \n```\nallowance (owner, spender)\n```\n"
  mdcn: "\n\n正如你所见，我们并未深入探讨如何在 JavaScript 代码中实现这个 Web3.js 版的所有权合约的细节来开发前端应用。\n\n在\
    \ _第 8 章，从零开始开发加密货币_ 中，我们将更仔细地审视实现方式，在其中我们将从零开始开发一种加密货币代币。\n\n## Summary\n\n本章首先明确区分了\
    \ geth、Mist 和 Web3.js，以及它们如何通过 IPC 和 HTTP 在以太坊区块链上协同运行。两者都被看到使用了 JSON-RPC 协议。然后我们继续将\
    \ Web3.js 库划分为四个主要模块，即 eth、shh、bzz 和 utils。我们还看到了如何在使用纯 JavaScript 调用 Web3.js\
    \ 库来在私有区块链上运行智能合约。我们学习了如何探索 Web3.js 库的各种 API 子模块和函数。本章以一个所有权合约的 Solidity 实现及其\
    \ Web3.js 等效代码生成作为结尾。\n\n在第 8 章，*从零开始开发加密货币* 中，我们将从零开始开发一种加密货币代币并学习有关 **首次代币发行\
    \ (ICO)** 的知识。\n\n## Developing a Cryptocurrency from Scratch\n\n在本章中，我们将讨论以太坊的广泛应用之一，即加密代币。我们将从对\
    \ Truffle 框架的简短介绍开始，并使用它创建一个 ERC20 兼容的代币。然后，我们将讨论 **首次代币发行 (ICO)** 以及它们如何被识别为诈骗、庞氏骗局、类似水龙头的或合法的。我们将随后介绍相对于加密货币的套利概念。我们还将学习有关\
    \ **法币兑换加密货币 (F2C)** 和 **加密货币兑换加密货币 (C2C)** 的知识。然后，我们以另一个 Parity 黑客案例研究作为本章的结尾。\n\
    \n学习本章后，你将能够：\n\n- 使用 Truffle 开发 ERC20 兼容代币\n- 识别庞氏骗局、诈骗、水龙头和合法的 ICO\n- 理解使用加密货币的套利交易。\n\
    - 了解法币兑换加密货币和加密货币兑换加密货币交易\n- 案例研究另一个 Parity 黑客并学习代币保管的重要性\n\n## Token versus coin\n\
    \n本章的标题具有误导性。它是有意被误导的。这是为了让你意识到从以太坊的角度来看加密货币和代币之间的细微差别。当你探索网络以获取有关加密货币的知识时，你会发现加密货币、币和代币这些术语经常被互换使用。\n\
    \n图 8.1 表示一种分类，突出了它们之间的细微差别：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_246_0.png)\n\
    \n图 8.1：代币与币\n\n简单来说，以下四点总结了币和代币之间的区别：\n\n- 币是其自身区块链上的独立货币，而代币主要基于单一区块链变体。\n-\
    \ 币通常具有有限的功能，价值存储，而代币可以存储复杂、多方面的价值。\n- 币大多是通过挖矿区块链生成的，而代币是通过在区块链上执行智能合约生成的。\n\
    - 因此，当我们在本章中说加密货币时，我们实际上指的是代币，因为本书是关于以太坊智能合约的。凭借这一微小却至关重要的信息，我们将探索下一节，了解如何通过遵循\
    \ ERC20 兼容性从零开始开发以太坊代币。\n\n## ERC20 token development using Truffle\n\nTruffle\
    \ 是用于以太坊的开发、测试和资产流水线的框架。它还具有使用 ERC190 标准集成的包规范。ERC190 是一份评论请求，规定了以太坊智能合约包规范的一套规则。\n\
    \n以太坊的资产流水线是一个概念，借鉴自 Ruby on Rails。这是一个提供框架来按所需执行顺序连接、压缩或压缩 JavaScript、Solidity\
    \ 和 CSS 资产的功能。此功能帮助开发人员创建压缩和预处理的类似库的模块，可以被其他编码模块重用，这有助于提高生产力。\n\n让我们开始安装 Truffle\
    \ 框架。安装非常简单，可以在 Git Bash 窗口中使用以下命令完成，如图 8.2 所示：\n\n```\n$ npm install -g truffle\n\
    ```\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_249_0.png)\n\n图 8.2：在名为 Truffle\
    \ 的新文件夹中安装\n\n安装后，我们需要启动框架，可以按如图 8.3 所示进行操作。如果在安装或启动过程中遇到任何问题，请参阅 Ethereum Stack\
    \ Exchange 或 Truffle 文档以了解已知的故障排除问题。\n\n> 需要注意的是，为了为新项目启动 Truffle，我们必须始终在具有自定义项目名称的新文件夹中使用\
    \ Truffle init 命令。我们不能在已启动 Truffle 框架的项目文件夹中启动 Truffle，因为这会抛出异常。\n\n它是如何工作的：\n\
    \n![](img/8c91673d39176d2e910ac52c4bc35d8b_250_0.png)\n\n图 8.3：Truffle 框架的启动\n\
    \n现在让我们创建一个简单的 ERC20 兼容代币。为此，我们在 private-truffle-project 文件夹内创建一个新文件夹 ERC20_token，并在其中编写一个\
    \ solidity 文件 ScratchToken.sol。\n\n我们将此 solidity 文件连同 Migration.sol 文件一起放在 contract\
    \ 文件夹中。\n\n现在，我们打开另一个 Git Bash 窗口并输入 testrpc 以启动测试网，如图 8.4 所示：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_250_1.png)\n\
    \n图 8.4：启动 testrpc\n\n在旧的 Git Bash 窗口中，我们更改 truffle.js 文件以指向我们的本地主机，如图 8.5 所示：\n\
    \n```\nmodule.exports = {\n  networks: {\n    development: {\n      host: \"localhost\"\
    ,\n      port: 8545,\n      network_id: \"*\" // Match any network id\n    }\n\
    \  }\n};\n```\n\n图 8.5：Truffle.js 配置更改\n\n然后，我们编译 .sol 文件，如图 8.6 所示；它们现在可以使用命令\
    \ truffle.cmd deploy 在测试网上部署：\n\n![](img/8c91673d39176d2e910ac52c4bc35d8b_251_0.png)\n\
    \n图 8.6：编译 ScratchToken.sol\n\n这就是我们如何使用 Truffle 框架部署一个基本的 ERC20 合规代币。我们可以添加更多功能以纳入其他\
    \ ERC20 合规功能，这些功能对于具有安全增强功能的完整代币是必需的。\n\n在智能合约章节中，我们讨论了为什么我们需要像 ERC20 这样的合规性，并承诺列出\
    \ ERC20 代币中强制要求的各种函数。\n\n一个 ERC20 合规代币必须具有以下具有相同命名约定的函数列表：\n\n```\ntotalSupply\
    \ ()\n```\n\n此函数没有参数，并返回流通中的代币总供应量。\n\n例如，如果我们创建一个模仿比特币理念的 ERC20 代币，那么 `totalSupply()`\
    \ 将获取 2100 万作为数字：\n\n```\nbalanceOf (owner)\n```\n\n前述函数在括号内有一个参数，即所有者的地址。因此，此\
    \ `balanceOf` 函数需要所有者的地址来返回余额值。\n\n```\ntransfer (to,value)\n```\n\n前述函数有两个参数，即\
    \ to 的地址，即接收者地址，以及需要发送到该地址的代币数量的值。\n\n```\ntransferFrom (from,to,value)\n```\n\
    \n前述函数有三个参数，即发送者地址、接收者地址以及需要转移的代币价值。\n\n```\napprove (spender,value)\n```\n\n\
    前述函数使所有者能够批准第三方实体在指定最大值范围内花费代币。\n\n```\nallowance (owner, spender)\n```\n\n"
