    gas 是用于为区块链的高速公路加油的燃料。我们使用以太币购买这种 gas，其中以太币相当于我们现实世界的法币。


    *图 2.13* 说明了以太坊区块链上的单位规模以及在当前货币中以太币等值的法币金额：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_88_0.png)


    图 2.13：以太坊区块链中的以太币在货币市场上的表现以及单位


    现在出现了一个真正的问题，那就是我们永远无法知道我的智能合约代码在区块链上会如何表现，除非我们运行它。为此，以太坊平台引入了测试网和主网的概念。一旦我们编写了
    solidity 智能合约，我们就可以在测试网上运行它们，并检查操作在 gas 费用方面的花费，但这是在虚拟环境中；也就是说，我们可以免费运行代码来模拟 gas
    费用金额。一旦我们对智能合约代码的 gas 消耗率和效率感到满意，我们就会将其作为最终代码部署到主网上，在那里代码会永久地刻录到以太坊区块链中。早期的测试网被称为
    **morden**，由于安全问题已被废弃。当前的测试网被称为 **Ropsten**。


    因此，我们看到智能合约不仅仅是代表价值转移的简单交易。由此自然会产生一个问题：比特币的区块架构对于以太坊是否足够？此外，我们如何在以太坊区块链中进行挖矿？为什么我们会有两种独立的加密货币代币
    ETH 和 ETC？让我们在下一节中找出答案。


    ## 以太坊区块、挖矿和分叉


    在深入以太坊区块架构的细节之前，我们需要重新审视以太坊的区块链结构。在 *第 1 章，区块链基础* 中，我们了解到以太坊区块链是一个 Merkle 树，其中叶子代表代码的执行状态。出于简化的考虑，更精细的细节被省略了。以太坊的
    Merkle 树不是我们对比特币区块链所看到的二叉 Merkle 树。你看，二叉 Merkle 树在验证以列表格式存在的信息时是很好的数据结构，也就是一系列数据块依次排列。对于这样的交易树，编辑树创建后需要多长时间并不重要。这是因为交易保持在一个只能不断增长的冻结树的形式中。


    以太坊另一方面是一个状态树。这里的情况更复杂。以太坊中的状态表示为键值映射，其中键表示地址，值表示声明的金额、余额列表、nonce、代码和账户存储。甚至存储本身也是一个树。


    这里，与交易历史不同，状态会频繁更新。这是因为账户的余额和 nonce 发生变化，频繁创建新账户的插入，以及存储中键的频繁插入和删除。


    在这种情况下，一个理想的数据结构应该能够在插入、更新、编辑或删除操作后快速计算新的树根，而无需重新计算整个树。此外，这种树的深度应该是有限的。这可以防止任何黑客无限加深树并对其合法用户发起
    DoS 攻击。此外，以不同顺序进行更新甚至从头重新计算树也不应改变根；也就是说，根应仅取决于数据。


    Donald R. Morrison 在大约 1968 年描述了这样一种树数据结构。它被称为 **Practical Algorithm to Retrieve
    Information Coded in Alphanumeric (PATRICIA)** 树。基本上，它是一个 Radix 树，其中 Radix 等于
    2，这意味着每个键的每一位都被单独比较，每个节点都是双向分支。在这样的树中，搜索、插入和删除以线性时间复杂度进行，即使在最坏的情况下也是如此。


    *图 2.14 说明了 Patricia 树中典型的插入是如何发生的：*


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_91_0.png)


    插入 ''team'' 同时拆分 ''test'' 并创建新的边标签 ''st''


    插入 ''toast'' 同时拆分 ''te'' 并将之前的字符串移动到更低一层


    图 2.14：Patricia 树插入演示，来源：Wikipedia


    因此，以太坊区块链在技术上是一个 Merkle-Patricia 树，其中以太坊区块链中的每个区块头包含三个这样的树来表示三种类型的对象：


    - 交易（代表价值转移）

    - 收据（显示每笔交易效果的数据块）

    - 状态（代表账户的所有信息）


    这三种类型的对象被矿工用来回答以下五个查询，这本质上是以太坊区块链上的挖矿活动：


    1. 一笔交易是否已包含在特定区块中？

    2. 过去 30 天中该地址发出的事件的所有实例是什么？

    3. 我的账户当前余额是多少？

    4. 这个账户甚至存在吗？

    5. 如果我在此合约上模拟执行此交易，输出会是什么？


    第一个查询由交易树处理，第二个由收据树处理，第三个和第四个由状态树处理。前四个查询计算起来相当直接。矿工只需找到对象，获取从对象到树根的 Merkle 分支，其中哈希列表向上延伸，并将分支回复给轻客户端。第五个查询也由状态树处理，但计算方式更复杂。这里，我们需要构建
    Merkle 状态转换证明。基本上，该证明做出以下声明：如果我们在根为 R 的状态上运行交易 T，结果将是根为 R'' 的状态，日志为 L，输出为 O。尽管在理论上并非必要，以太坊中存在输出的概念，因为每笔交易都是一个函数调用。为了计算证明，矿工本地创建一个假区块，将状态设置为
    S，并假装自己是轻客户端，同时应用交易。也就是说，如果应用交易的过程要求客户端确定一个账户的余额，轻客户端就会发出余额查询。如果轻客户端需要检查特定合约存储中的特定项目，轻客户端就会为此发出查询，依此类推。矿工对其自己的所有查询都正确响应，但会跟踪其发送回的所有数据。矿工随后将所有这些请求中的组合数据作为证明发送给客户端。客户端随后采用完全相同的程序，但使用提供的证明作为其数据库；如果其结果与矿工声称的一样，则客户端接受该证明。


    那么，证明是如何被接受的呢？这是通过共识算法完成的，该算法比较来自不同矿工的 PoW。该算法称为 ETH hash。即使以太坊框架的未来版本可能会切换到 PoS，PoW
    目前仍在使用。我们将在后面的章节中详细介绍该算法。目前，请记住该算法将 nonce 与 DAG 结合以生成新哈希并检查它是否小于目标阈值，以解决第 1 章《区块链基础》中讨论的挖矿的愚蠢难题。问题是
    DAG，本质上是一个庞大数据集（超过 2 GB）的有向无环图，处理起来需要大量的随机访问内存（RAM）。这种内存硬度是为什么我们不能使用 ASIC 矿机来挖以太坊区块的主要原因，因为
    ASIC 的内存缓存非常低。挖以太坊的最佳硬件客户端是 GPU 矿机。


    以下是使用 GPU 设备配置以太坊矿工时显示的列出规格：


    例如：RX 470 规格


    - **成本：** ~ $175（2017 年 3 月）

    - **内存：** 8 千兆字节

    - **内存带宽：** 211 千兆字节/秒


    除了这三个树对象之外，区块架构还有几个其他模块，这些模块在图 2.15 中说明，并在 Gavin Wood 的黄皮书中定义：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_93_0.png)


