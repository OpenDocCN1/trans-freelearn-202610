    ## Iota GitHub 分析


    如果你去 GitHub 搜索 Iota，你会进入一个链接 Iota 加密货币仓库的页面。Iota 的 GitHub 页面包含三个主要仓库，即钱包、**Iota
    参考实现 (IRI)**，以及 Iota JavaScript 库。*图 11.9* 描述了这些仓库：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_373_0.png)


    图 11.9：Iota GitHub (https://github.com/iotaledger)


    在这三个仓库中，IRI 是最有趣的仓库。那么 IRI 是什么？它是 Iota 协议的参考实现。就像比特币一样，Iota 也是运行在名为 Tangle 的 DAG
    基于数据库上的协议，而不是区块链。现在，IRI 代表了 Iota 的蓝图。因此，当 Iota 开发者用 Java 制作参考实现时，他们实际上是在告诉世界，“*这就是
    Iota 功能的工作方式，并且使用这个参考实现，我们可以用任何其他图灵完备的编程语言来设置 Iota 客户端或 Iota 节点。*”


    现在如果我们退一步思考一会儿，我们会意识到，使用这个参考实现，我们甚至可以使用 Solidity —— 一种图灵完备的编程语言 —— 来开发一个 Iota
    客户端、节点，甚至智能合约。可能性是无穷的，也相当令人兴奋。不是吗？


    接下来是 Iota 钱包。它是用 JavaScript 编写的，并且是一个 electron 应用。那么 electron 是什么？它是一种工具，程序员可以用它将网站打包为原生应用程序。基本上，当我们想要为
    macOS、Windows 或 Linux 开发原生应用程序时，一种方法是完全从头开始编码，这耗时且令人困惑，因为我们必须维护多个不同的代码库。相反，我们可以编写一个网站并将其打包为
    Windows、macOS 或 Linux 应用程序。现在，如果我们想要进行更改或进一步开发应用程序，我们只需进一步开发这个网站并再次打包。Electron
    在许多其他加密货币项目中也越来越受欢迎。


    最后，我们有一个 JavaScript 库。它为其他开发者提供编码工具和 API。假设作为一名开发者，我们想要创建一个网站来与 Iota 协议交互。我们可以使用他们的
    JavaScript 库来调用各种 Iota 功能。


    在下一节中，我们将看到如何购买和存储 Iota 加密货币。


    ### Iota 的购买与存储


    目前，Iota 不能直接使用法币购买。它可以从 Bitfinex 或 Binance 等加密交易所使用以太币或比特币购买。


    购买 Iota 需要遵循以下步骤：


    - 1. 在 coinbase 创建一个账户。

    - 2. 在 coinbase 购买 BTC 或 ETH。

    - 3. 在 Bitfinex 或 Binance 开设账户。

    - 4. 将一些 BTC 或 ETH 转移到 Bitfinex 或 Binance。

    - 5. 使用 BTC 或 ETH 下单购买 Iota。Iota 以百万计出售，称为 MIOTA。


    Iota 的存储本质上非常简单。我们可以将 Iota 存储在 Iota GitHub 提供的 Iota 钱包中。或者我们可以使用以下链接提供的纸钱包：https://arancauchi.github.io/IOTA-Paper-Wallet/。


    要创建纸钱包，我们需要输入 81 位代码并生成二维码，如 *图 11.10* 所示。然后我们可以打印钱包并将其存放在安全的地方：


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_376_0.png)


    图 11.10：Iota 纸钱包


    从 Tangle 出发，超越区块链，我们可能会进入技术进步的令人兴奋的新阶段。我们很快将体验到机器对机器经济，这将由物联网设备促进，而 Iota 最终可能会统治加密货币排行榜。


    这就结束了本书。但你进入这个令人兴奋的智能合约世界的旅程才刚刚开始。查阅遍布 YouTube 频道、GitHub 链接、Reddit 帖子和堆栈交换论坛的更广泛社区。你现在拥有在所有恐惧-不确定-怀疑（FUD）中利用这项技术改变世界的力量；你所需要的只是创造一些优秀源代码的能力。


