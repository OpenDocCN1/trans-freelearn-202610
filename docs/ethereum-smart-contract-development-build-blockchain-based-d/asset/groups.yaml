    \ IEEE 最受欢迎编程语言排行榜上高歌猛进，世界一流大学鼓励我们学习它，业界也在尝试围绕它的使用制定事实标准和框架。而我们这些懒惰的领主们，却在疯狂地寻找它的免费副本，以便安装并“掌握”它。\n\
