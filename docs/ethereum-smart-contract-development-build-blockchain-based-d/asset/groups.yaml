    do not have any matching function name present in the wallet contract itself.


    Hmm, sounds a bit tricky, right? Let us approach this concept in a simpler manner.
    We have a contract named wallet. This wallet has two functions. One is a nameless
    function. Another one is a "named" function with the name isOwner. Now, a novice
    user calls a function, donateEther, using our wallet contract. As this alien function,
    donateEther, does not match with any of the functions present in our wallet contract,
    the nameless fallback function gets called by default, which has a delegatecall
    operation inside it.


    So, the nameless fallbackfunction() basically says, "Big bro walletLibrary, see
    my user have called this god-knows-what donateEther function. I have no idea what
    this function is. I do not have any definition of it inside me. Can you please
    check whether this is one of your cute little helper functions."


    walletLibrary replies, "Sorry man, none found. I also do not has this donateEther
    function. Throw some exception to the user, buddy. They will understand that something
    went wrong."


    Fallback functions are deceptively elegant in such cases. Not only did it elegantly
    delegate back to the helper library but also performed some error handling. But
    this is where the deception creeps in. What if, as a hacker, we call to execute
    a function named initWallet from my wallet contract? By the rules, this function
    does not exist inside the wallet contract. So, the fallback function delegates
    the call to the helper walletLibrary contract. Interestingly, the initWallet function
    does exist in the walletLibrary. Note, these calls are now happening using EVM
    automatically. The hacker just had to pass the function name parameter to his
    own wallet contract and deploy it over EVM. And once the function initWallet got
    initialized using the hacker''s wallet contract, the hacker was able to take ownership
    of the Library contract and change the owner address to his own wallet address,
    which helped to drain all the ether funds of some other user address into the
    hacker''s wallet, as already shown in Figure 6.11.


    So, the vulnerability was in the fallback function call of the client''s wallet,
    which is delegated without any security checks. This was really disastrous'
