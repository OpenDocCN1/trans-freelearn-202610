  - '[PAGE 356]


    # Ethereum improvement proposal


    To become a successful Ethereum smart contract developer, apart from technical
    and architectural knowledge, we need to possess the ability to understand design
    documents. Such documentation is the Holy Grail for any developer, and provides
    the necessary insights into various intricacies and rationales behind any functionality.
    For a developer in the Ethereum community, such design documentation is maintained
    by many senior developers worldwide, and is known as the Ethereum improvement
    proposal.


    The Ethereum improvement proposal is a design documentation that provides information
    to the Ethereum community. It is used to propose a new Ethereum feature, a new
    process, or a new environment. EIP provides a concise technical specification
    and rationale for a proposed feature. The authors of an EIP are responsible for
    building consensus within the community and documenting opinions of critics. Anyone
    can propose a new implementation using EIP and if the community agrees with it,
    they become part of the implementation.


    The EIP purpose and guidelines have been authored by Martin Becze and Hudson Jameson.
    They are heavily derived from the bitcoin improvement proposal (BIP-0001), written
    by Amir Taaki, which in turn was inspired by the Python enhancement proposal (PEP-0001).
    The copyright on these proposals are waived under CC0 and are freely available
    to the public at the following GitHub:


    https://github.com/ethereum/EIPs


    In the subsequent sections, we will discuss the bare minimum details about EIPs
    that will equip you to navigate through the EIP GitHub yourself,'
  - '[PAGE 357]


    without getting lost because of information overload.'
  - '[PAGE 358]


    # Rational behind EIPs


    EIPs make it convenient to track implementation progress. Each implementation
    should ideally be listed as an EIP. This allows participants and investors to
    conveniently know about the current status of a given library or implementation.'
  - '[PAGE 359]


    # Types of EIP


    *Figure 11.5 illustrates various types of improvement proposals recommended by
    the Ethereum community. Mainly, the proposals are of three types:*


    +   - **Standard track EIP**: These proposals affect the Ethereum implementation.
    For example, change of block size, transaction validity rules, and interoperability
    of applications can be part of such proposals.

    +   - **Informational EIP**: These proposals flag any design issue or provide
    general guidelines. However, such a proposal does not introduce new features.

    +   - **Meta EIP**: These are also called process EIPs. Such proposals suggest
    changes to guidelines and processes. Unlike informational EIPs, users cannot ignore
    such EIPs once they are implemented:'
  - '[PAGE 360]


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_360_0.png)


    Figure 11.5: Categories of EIPs


    Standard track EIPs are further divided into four sub-categories:


    +   - **Core**: These proposals are mainly consensus-critical and involve fundamental
    changes to the Ethereum protocol and implementation strategies. For example, EIP7
    proposed a new opcode, `DELEGATECALL`.

    +   - **Networking**: These proposals primarily deal with changes to swarm, whisper,
    devp2p, and light sub-protocol implementation. For example, EIP8 proposed devp2p
    forward compatibility requirements for the homestead edition.

    +   - **Interface**: These proposals provide improvement to the ABI interface
    or RPC standards. For example, EIP6 proposed renaming suicide opcode.

    +   - **ERC**: These are mainly **request for comments (RCs)** and we discussed
    one such proposal, ERC20, in a previous chapter. These proposals deal with application-level
    standards and conventions. For example, EIP20 proposed ERC20 token compliance.'
  - '[PAGE 361]


    # EIP life cycle


    The life cycle of a proposal life cycle is pretty straightforward. On a typical
    happy path, a proposal is born with an idea of improvement for Ethereum. Such
    an idea is formalized by a draft EIP. Once the EIP has gained the confidence of
    the Ethereum community, the proposal is accepted and assigned an EIP number. Then
    it is implemented using code, and given a Final status, or if it is a guideline,
    made active on GitHub. The EIP list is eventually updated with the finalized EIP
    proposal number. The life cycle of a proposal can dramatically change if it is
    critically opposed by the general community:


    ![](img/8c91673d39176d2e910ac52c4bc35d8b_361_0.png)


    Figure 11.6: EIP workflow


    Technically, "life cycle" is a misnomer. We must generally refer to it as a proposal
    workflow. This is because the proposal does not change its state itself; external
    human intervention is required to change the status of a proposal. Figure 11.6
    illustrates the different statuses of a proposal, starting from a draft, until
    it is finalized and updated on the EIP list. Also note that EIPs can be superseded,
    making the older EIP obsolete. For informational EIPs, making them Active is analogous
    to a final state.'
