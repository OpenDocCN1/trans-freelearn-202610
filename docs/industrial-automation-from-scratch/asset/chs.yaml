  图 9.27 – 使用常开启动按钮和常开停止按钮的置位与复位程序


  该程序的 PLC 接线如下：


  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_331_0.png)


  图 9.28 – 使用常开启动按钮和常开停止按钮实现置位与复位程序的接线


  上述接线图显示了启动按钮（常开）连接到 I0.4，停止按钮（常开）连接到 I0.5。一个负载（可以是接触器的线圈）连接到 Q0.2。


  当启动按钮被按下时，程序中地址为 I0.4 的常开触点将闭合。由于程序中 I0.5 是常闭触点，电源将流过以使地址为 Q0.2 的线圈通电。当启动按钮被释放时，程序中地址为
  I0.4 的常开触点断开，但由于与 I0.4 并联的、地址与输出（Q0.2）相同的常开触点，地址为 Q0.2 的输出仍保持通电。通电（ON）的线圈 Q0.2 会闭合程序中与
  I0.4 并联的、地址为 Q0.2 的常开触点。这为信号流向 Q0.2 创建了一条替代路径。因此，即使按钮被释放，地址为 Q0.2 的输出线圈也保持 ON。这称为置位（锁存）。


  当停止按钮被按下时，程序中地址为 I0.5 的常闭触点断开。电源将不再流向线圈。地址为 Q0.2 的输出线圈将断电（OFF）。这称为复位（解锁）。


  此处使用的停止按钮不安全，因为当按钮发生故障时，输出将保持通电，机器将继续运行。这对于工业使用来说是不希望的，也是不安全的。


  #### 使用常开启动按钮和常闭停止按钮的置位与复位程序


  编辑网络 3 中的程序，使 I0.5 使用的常闭触点变为常开触点，如以下截图所示：


  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_333_0.png)


