- '### 理解人机界面（HMIs）


  前三章涵盖了大量关于**可编程逻辑控制器（PLCs）**的内容，PLC 是大多数自动化机器的大脑。我们学习了如何使用 PLC、传感器和执行器来自动化工业过程。然而，在大多数情况下，仅靠
  PLC、传感器和执行器无法为真实的工业过程提供所需的功能。**人机界面（HMI）**通常集成到生产线和其他工业过程中，以便用户轻松控制机器并获得机器状态的反馈。


  在上一章中，我们学习了如何使用 PLC 控制机器，其中用户或操作员按下按钮启动机器，指示灯显示机器是否正在运行。将 HMI 集成到此类系统中会使其更易于使用。HMI
  允许您启动或停止机器，甚至通过图形界面或触摸屏获得机器的反馈或状态更新。


  在本章中，您将学习有关 HMI 的知识以及如何将其与 PLC 接口以向机器发出命令并从机器获取反馈。您将使用 TIA Portal 创建用于监控和控制的 HMI
  屏幕。您将学习如何模拟您的 HMI 程序（在没有真实 HMI 面板的情况下测试 HMI 程序的好方法），您还将学习如何将设计的 HMI 图形下载到真实的 HMI
  面板（西门子 HMI - KTP400）以用于实际应用。


  我们将在本章中涵盖以下主题：


  - 介绍 HMI

  - 探索 HMI 的应用

  - 理解 HMI 编程和开发

  - 理解 HMI 编程软件

  - 探索 HMI 制造商及其编程软件

  - PLC 与 HMI 的接口

  - 将程序下载到 PLC 和 HMI


  #### 技术要求


  您需要了解前三章中的 PLC、传感器和执行器。


  确保您已在 PC 或笔记本电脑上下载并安装了 TIA Portal V13。请参阅第 8 章《使用 TIA Portal 理解 PLC 软件和编程》。


  可能需要的其他设备包括西门子 HMI（KTP400）和西门子 PLC（S7 1200，CPU 1211C，AC/DC/RLY）。


  #### 介绍 HMI


  HMI 可以被视为允许人类和机器交互的图形界面。我们了解到 PLC 可以控制和自动化工业机器。另一方面，HMI 允许人类与机器交互或通信。不管我们如何自动化一个过程，我们仍然需要一个人类（操作员）来启动或发起该过程，执行其他功能，并获得有关机器运行情况的反馈。


  HMI 允许人类向 PLC 发出命令以控制过程，并从 PLC 接收有关过程的反馈。有了 HMI，人类操作员可以通过 PLC 与机器交互、监控和控制机器。HMI
  通常通过通信电缆连接到 PLC，具体取决于所使用的协议（Ethernet/IP、Profinet、Profibus 或 Modbus）。本章不讨论协议。我们将在第
  13 章《工业网络和通信协议基础》中研究协议。然而，我们将使用 Profinet 作为建立 HMI 与 PLC 之间通信的协议。基本上，PLC 通过电缆连接到机器或传感器和执行器，正如我们在
  *第 7 章*、*理解可编程逻辑控制器 – 第 1 部分* 中所学到的，我们在其中讨论了 PLC 布线。以下图表描绘了人类操作员、HMI、PLC 和机器，以及它们之间的通信流程：


  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_366_0.png)


  图 10.1 – 人类操作员、HMI、PLC 和机器


  HMI 并非仅限于制造和其他工业环境。还有许多我们拥有并经常使用却不知道它们是 HMI 的 HMI。例如，一些汽车具有触摸屏界面，驾驶员或乘客可以通过该界面控制空调、加热、音响和其他系统。这些触摸屏就是
  HMI。驾驶员或乘客能够通过触摸屏启用的界面与机器交互。HMI 只是一个界面（通常是图形化的），人类可以通过它控制机器。它也可以被称为**人机界面（MMI）**、**操作员界面终端（OIT）**或**用户界面（UI）**。HMI
  的设计目的是确保操作员可以轻松监控或控制机器。HMI 还设计用于确保操作员可以监控报警并相应地做出响应。各种颜色可用于表示报警的优先级级别。HMI 报警提供有关重要事件和故障的信息。HMI
  的另一个优点是趋势。趋势可以指一段时间内数据的图形表示。HMI 允许您在图形界面中监控或查看一段时间内来自传感器的數據。


  HMI 还支持设定点管理。HMI 可以设计和编程以允许操作员从图形界面轻松更改设定点值。


  HMI 包括硬件和软件，允许人类操作员与机器之间进行通信。


  下图显示了操作员（用户）可以使用的一种 HMI：


  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_367_0.png)


  图 10.2 – HMI 显示 GUI，用户可以通过该界面与机器或过程交互


  此图像的版权归 Wikimedia Commons 所有：

  https://creativecommons.org/licenses/by-sa/4.0/deed.en


  HMI 用图形界面取代了连接到 PLC 的开关和其他形式的控制和状态指示器，通常是触摸屏，如前图所示。HMI 允许人类操作员监控过程，启动或停止过程，调整设定点，并执行需要人类注意的其他控制功能。


  #### 探索 HMI 的应用


  HMI 用于几乎所有行业。一些工业应用领域包括以下内容：


  - **食品和饮料**：HMI 可用于轻松监控和控制生产过程，以确保食品和饮料行业的质量。HMI 允许在生产中使用配方。“配方”简单地指用户可以根据要生产的产品类型选择的数据或值。配方总结了特定产品的生产数据或机器配置。然后在给定时间将数据从
  HMI 传输到 PLC 或控制器以切换到另一种产品类型。当要生产多种产品时使用配方。配方不仅在食品行业有优势；它们在生产多种产品的其他行业也非常有益。

  - **石油和天然气**：HMI 为钻井和钻机操作员提供了一种实时控制和监控现场应用的手段。HMI 还有助于石油和天然气的其他领域，例如炼油和管道完整性管理。

  - **电力**：HMI 可用于变电站和电力系统的其他区域，以便轻松执行开关和其他控制操作。

  - **废水管理系统**：HMI 用于废水处理，以查看处理系统的各个方面，包括 pH 值、化学品使用量和水箱液位。

  - **交通运输**：通过人类与机器之间的交互，可以提高公共交通系统的性能、效率和安全性，而 HMI 使其成为可能。


  我们刚刚了解了 HMI 及其在各个行业中的应用。我们将在下一节学习 HMI 编程和开发。


  #### 理解 HMI 编程和开发


  HMI 编程涉及机器操作、控制命令的视觉表示（图形）的创建，以及编写代码以执行所需功能的编写。


  HMI 的主要目的是允许操作员控制机器或过程。因此，HMI 设计必须做到以下几点：


  - 使用者能够轻松访问必要的信息和控制。

  - 允许用户尽可能快速地导航到不同区域。

  - 允许用户或操作员查看机器的当前状态。操作员必须能够通过 HMI 上的视觉指示判断机器是否正在运行或已停止。还可以提供其他信息来帮助操作员做出正确决策。


  让我们继续在下一节学习有关 HMI 编程软件的知识。


  #### 理解 HMI 编程软件


  HMI 编程软件是用于设计图形界面并在必要时编写一些代码以实现用户（人类）与机器之间交互的专用软件。该软件通常在编程前安装在 PC 上，然后再进行




  通过通信电缆下载到HMI面板，就像我们对PLC所做的那样。


  不同品牌的HMI面板有不同种类的编程软件。下一节将讨论各种HMI制造商及其编程软件。


  #### 探索HMI制造商及其编程软件


  这里列出一些流行的HMI制造商：


  - **西门子：** 西门子是一家德国公司，是自动化行业顶尖公司之一，生产SIMATIC HMI。其部分HMI型号包括KTP400、KTP600和KTP700。其HMI编程软件是WinCC。

  - **罗克韦尔自动化：** 罗克韦尔自动化是北美顶级公司之一。其HMI品牌名为**PanelView**，包括PanelView 600、PanelView
  800和PanelView+400。其HMI编程软件包括RSView32和FactoryTalk View。

  - **施耐德电气：** 施耐德电气是欧洲顶级公司之一。其HMI品牌包括Magelis和Harmony。其HMI编程和配置软件包括Ecostructure Operator
  Terminal Expert和Vijeo Designer。

  - **三菱电机公司：** 三菱电机公司（MELCO）是三菱的一个分部。其HMI产品线名为**图形操作终端（GOT）**，例如GOT 1000系列和GOT 2000系列。其HMI编程软件是GTworks2（GOT
  HMI设计器软件）。


  我们刚刚了解了一些主要的HMI制造商及其软件。本书将重点介绍西门子HMI（KTP 400）及其软件（WinCC）。我们将在后续章节中学习如何将西门子HMI（KTP400）连接到PLC，以及如何在TIA
  Portal中使用WinCC开发HMI画面。


  #### PLC与HMI的接口连接


  在*第9章“深入探讨使用TIA Portal进行PLC编程”*中，我们学习了如何使用按钮来启动和停止，以及如何使用灯作为指示器来显示负载是开启还是关闭。


  正如我们之前讨论的，HMI允许操作员通过PLC与机器交互。这意味着需要PLC与机器进行通信。


  在本节中，我们将学习如何使用Profinet作为通信协议来连接西门子HMI（KTP 400）和西门子PLC。我们将使用TIA Portal对PLC进行编程，并使用WinCC开发HMI应用程序，WinCC是在*第8章“理解PLC软件并与TIA
  Portal编程”*中安装TIA Portal时安装的。


  到本节结束时，您应该能够连接PLC和HMI，使HMI能够用于启动和停止，并获取机器（例如电机）状态的反馈。


