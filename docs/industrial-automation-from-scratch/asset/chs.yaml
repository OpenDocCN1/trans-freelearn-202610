  #### Using a real PLC (Siemens S7-1200 – CPU 1211C – AC/DC/RLY)


  In this example, we will wire and program a PLC to keep a heater turned on until
  the value at MD8 (the scaled value) is greater than or equal to 100. This is a simple
  control system technique that can be applied to temperature, pressure, or level
  control.


  ##### Requirements


  In addition to TIA Portal used in the simulation, the following devices are also
  required to demonstrate analog input signal processing with a real PLC:


