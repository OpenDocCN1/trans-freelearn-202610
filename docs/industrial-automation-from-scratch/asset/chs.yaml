  该程序的 PLC 接线如下：


  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_334_0.png)


  图 9.30 – 使用常开启动按钮和常闭停止按钮实现置位与复位程序的接线


  上述接线图显示了启动按钮（常开）连接到 I0.4，停止按钮（常闭）连接到 I0.5。一个负载（可以是接触器的线圈）连接到 Q0.2。


  当启动按钮被按下时，程序中地址为 I0.4 的常开触点将闭合。停止按钮（常闭按钮）将闭合程序中地址为 I0.5 的常开触点。由于接线中使用了常闭按钮，程序中地址
  I0.5 是闭合的，因此电源将流过以使地址为 Q0.2 的线圈通电。当启动按钮被释放时，程序中地址为 I0.4 的常开触点断开，但由于程序中与 I0.4 并联的、地址与输出（Q0.2）相同的常开触点，地址为
  Q0.2 的输出仍保持通电。通电（ON）的线圈 Q0.2 会闭合程序中与 I0.4 并联的、地址为 Q0.2 的常开触点。这为信号流向 Q0.2 创建了一条替代路径。因此，即使按钮被释放，地址为
  Q0.2 的输出线圈也保持 ON。这称为置位（锁存）。


  当停止按钮被按下时，程序中地址为 I0.5 的常闭触点断开。电源将不再流向线圈。地址为 Q0.2 的输出线圈将断电（OFF）。这称为复位（解锁）。


  此处使用的停止按钮是安全的，因为当按钮发生故障时，输出将断电，连接到该停止按钮的机器将不会运行。这对于工业使用来说是理想的，也是安全的。


  ###### 注意


  如果输出（Q0.2）将用于为感应电动机通电，则必须在接触器和电动机之间安装过载继电器，以确保发生过载时电动机会停止。在这种情况下，常闭触点（95-96）将作为输入接入
  PLC，并且在程序中为其使用常开触点（与停止的常开触点串联），这样当发生过载时，常开触点（95-96）打开，电动机将停止。这个想法用于使用 PLC 启动和停止感应电动机。


  我们现在已经了解了置位和复位。这两个术语在 PLC 编程中非常重要。在下一节中，我们将继续学习如何在程序中将输出地址用作输入。


