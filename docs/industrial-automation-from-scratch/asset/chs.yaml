  \ Save。\n\n本节介绍了如何从头开始创建项目以及如何保存它。了解如何创建绘图原理图的绘图环境以及如何将其保存以便将来检索非常重要。在下一节中，我们将学习如何使用符号、线条、文本、圆弧/圆和区域工具。了解这些工具对于在\
  \ PCSCHEMATIC Automation 中创建电气图/绘图是必需的。\n\n#### 使用符号、线条、文本、圆弧/圆和区域工具\n\n符号、线条、文本、圆弧/圆和区域按钮可在程序栏上获得，如以下屏幕截图所示。它们在处理对象和创建原理图时非常有用：\n\
