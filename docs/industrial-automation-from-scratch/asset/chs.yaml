  \n太好了！你刚刚完成了本书的第六章。你已学习了 **Computer Aided Design (CAD)** 软件，包括功能强大且专业的 CAD 软件（PCSCHEMATIC\
  \ Automation）的实际使用。本章涵盖了符号、线条、弧/圆、文本和区域工具的使用，以及创建常见工业控制原理图（DOL 启动器）的逐步指南。步骤中包含屏幕截图以进一步帮助理解。\n\
  \n在下一章中，我们将开始了解 **Programmable Logic Controllers (PLCs)**，即各种行业中机器的大脑。\n\n#### Questions\n\
  \n以下问题用于测试你对本章的理解。在尝试这些问题之前，请确保你已阅读并理解本章的主题：\n\n+   1. CAD 是 ________________ 的缩写。\n\
  +   2. _____________ 是一种使复杂电路易于故障排除的电气图类型。\n+   3. 显示物理组件及其之间布线的图片或详细 drawings 的电气图被称为\
  \ ________________。\n+   4. 在 PCSCHEMATIC Automation 中，显示你当前在屏幕上查看的页面部分的黑色框称为 ________________。\n\
  +   5. 在 PCSCHEMATIC Automation 中，图 6.50 是 ________________。\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_216_0.png)\n\
  \nFigure 6.50 – 显示 PCSCHEMATIC Automation 屏幕一部分的屏幕截图\n\n### Understanding PLC Hardware\
  \ and Wiring\n\n工业自动化早在 **programmable logic controller (PLC)** 于 20 世纪 60 年代末开发之前就已存在。在\
  \ PLC 引入之前，继电器和定时器用于自动化制造过程，但它们存在诸多挑战。其中一些挑战包括继电器和定时器占用的大空间，排除系统故障所需的时间，以及由于许多继电器以特定顺序硬连线以使机器运行，因此对系统进行更改非常困难。PLC\
  \ 通过占用空间更少、易于故障排除，并且使用 PLC 的控制系统可以轻松更改来解决所有这些挑战。以下照片显示了一个继电器室，其中有许多继电器占用了大量空间，不易于故障排除，并且控制系统更改也不易进行：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_219_0.png)\n\nFigure 7.1 – 继电器室中的继电器（Sergeev\
  \ Pavel，CC BY-SA 3.0 https://creativecommons.org/licenses/by-sa/3.0，via Wikimedia\
  \ Commons）\n\n本章重点关注 PLC 的硬件方面。我们将了解 PLC 到底是什么、构成 PLC 的各个部分、PLC 的操作、PLC 的类型、PLC\
  \ 制造商/供应商，以及如何将上一章学到的传感器和执行器连接到 PLC。\n\n我们将在本章中涵盖以下主要主题：\n\n+   - 介绍 PLC\n+   -\
  \ 探索 PLC 模块\n+   - 探索 PLC 类型\n+   - 了解 PLC 扫描周期\n+   - 了解 PLC 供应商\n+   - PLC 布线（1）–\
  \ 将开关、灯和执行器连接到 PLC 的布线\n+   - PLC 布线（2）– 接近传感器（3 线）的布线\n+   - PLC 布线（3）– 光电传感器（反光）的布线\n\
  +   - 西门子 S7-1200 PLC（CPU 1211C AC/DC/Relay）的布线\n\n#### Technical requirements\n\
  \n虽然本书的每个部分都很宝贵，但第 2 章《开关和传感器 – 工作原理、应用和布线》以及第 3 章《执行器及其在工业自动化中的应用》对于更好地理解本章非常重要。\n\
  \n#### Introducing a PLC\n\nPLC 是一种工业计算机，由硬件和软件组成，用于自动化工业过程。它们主要用于制造业，也可用于交通运输、制造、仓储、石油和天然气、建筑等其他行业。PLC\
  \ 也可以被视为一种电子设备，它从传感器和开关接收输入，对其进行处理，并输出信号来控制执行器。PLC 通过开关和传感器从工厂车间获取数据，然后执行写入其中的程序逻辑，并根据程序逻辑的结果输出信号来控制连接到它们的执行器或机器。PLC\
  \ 是几乎所有现代工业自动化机器的大脑。\n\n让我们现在来看看构成 PLC 的各个部分。\n\n#### Exploring PLC modules\n\n\
  PLC 的硬件部分由各种模块组成。构成 PLC 的基本模块包括以下内容：\n\n+   - 电源\n+   - CPU\n+   - 输入模块\n+   - 输出模块\n\
  \n下图显示了 PLC 的框图：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_221_0.png)\n\nFigure\
  \ 7.2 – PLC 的框图\n\n在下一节中，我们将查看每个模块。\n\n#### The power supply\n\nPLC 的电源部分为 PLC 的其他部分/模块提供适当的电压和电流。大多数\
  \ PLC 使用 24V DC，而电网的供电通常为 110V 或 220V AC，具体取决于国家/地区。电源将 220V 或 110V AC 作为输入，并向 PLC\
  \ 的其他部分提供所需的电压（通常为 24V DC）和电流作为输出。电源的电流额定值可从 2 安培到约 50 安培不等，具体取决于 PLC 的尺寸。下图显示了一个西门子电源模块：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_222_0.png)\n\nFigure 7.3 – 西门子电源\n\n\
  此照片的版权归 Showlight Technologies Ltd.（www.showlight.com.ng）所有。\n\nPLC 的电源模块为 PLC 的运行提供所需的能量。没有电源的\
  \ PLC 就像没有燃料的车辆一样。电源通过变压器的帮助将通常为 110V 或 220V AC 的线路电压降至较低的交流电压。整流器随后将较低电压的交流电转换为直流电。电容器平滑或滤波直流电，单元内的稳压器电路提供通常为\
  \ 24V DC 的稳压直流输出。\n\n让我们现在来看看我们列表中的下一个模块，即 CPU 模块。\n\n#### The CPU module\n\n**central\
  \ processing unit (CPU)** 可以被视为 PLC 系统的大脑。它由处理器、内存和其他集成电路组成，处理程序执行、存储以及与其他外部设备（包括编程设备或\
  \ **personal computer (PC)**、**Human-Machine Interface (HMI)**、**variable frequency\
  \ drive (VFD)** 等）的通信。CPU 控制并协调 PLC 的整个操作。下图显示了西门子 PLC（S7-300 CPU 313）的 CPU：\n\n\
  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_224_0.png)\n\n##### SIEMENS\n\nCPU 313\n\
  \n+   - SF\n+   - BATF\n+   - DC5V\n+   - FRCE\n+   - RUN\n+   - STOP\n\n+   - RUN-P\n\
  +   - RUN\n+   - STOP\n+   - MRES\n\n##### SIMATIC\nS7-300\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_225_0.png)\n\
  \nFigure 7.4 – 西门子 PLC 的 CPU（S7-300 CPU 313）\n\n此图的版权归 *Showlight Technologies Ltd.*（[www.showlight.com](http://www.showlight.com)）所有。\n\
  \nPLC 的 CPU 就像人类的大脑一样。人类活动（包括行走、坐下、站立等）的整个范围都由大脑控制。同样，PLC 的整个操作都由 CPU 控制。PLC 的 CPU\
  \ 也可以链接到 PC 的 CPU，后者控制计算机的所有活动。没有 CPU 的计算机无法运行，同样，没有 CPU 的 PLC 也无法运行。CPU 执行写入 PLC\
  \ 的程序并做出 PLC 所需的决策，以自动化或操作机械并与其他设备通信。\n\n让我们来看看我们列表中的下一个模块，即输入模块。\n\n#### The input\
  \ module\n\n输入模块是连接所有输入设备（开关和传感器）到 PLC 的部分。它允许 PLC 监控开关和传感器的当前状态，这些开关和传感器在执行程序时执行必要的控制功能。输入模块基本上可分为数字和模拟。数字输入模块用于要连接的输入设备产生离散信号（开或关）时，而模拟输入模块用于要连接的输入设备产生模拟信号（即\
  \ 0-5V、0-10V、0-20mA 或 4-20mA）时。\n\n下图显示了西门子 PLC（SM321，DI 16X DC24V）的数字输入模块：\n\n\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_227_0.png)\n\n**图 7.5 – 西门子数字量输入模块（SM321，DI\
  \ 16x DC24V）**\n\n该图的版权归 *Showlight Technologies Ltd.*（[www.showlight.com.ng](http://www.showlight.com.ng)）所有。\n\
  \n输入模块接收来自开关和传感器的信号，并将其发送至 CPU 进行处理。\n\n接下来，让我们看一下输出模块。\n\n#### 输出模块\n\n输出模块是连接\
  \ PLC 与输出设备或执行器的部分。输出设备可以是灯、继电器、接触器、电磁阀、控制阀等。PLC 输出模块根据输入状态及 CPU 中已编写程序的运行结果来操作或控制输出设备。输出模块也可分为两类，即数字量输出模块和模拟量输出模块。数字量输出模块能够控制处于“接通”或“断开”状态的输出设备或负载。此类负载或设备的示例包括灯、继电器、接触器、电磁阀等。\n\
  \n数字量输出模块产生二进制输出（1 或 0），这意味着对于“接通”或“断开”的负载，它控制其“接通”或“断开”。另一方面，模拟量输出模块产生可变的或变化的信号，其范围可为\
  \ 0-5V、0-10V、0-20mA 或 4-20mA。它们用于控制需要“完全接通”和“完全断开”之间控制信号的输出设备。\n\n此类负载或设备的示例包括模拟电压表、模拟电流表、控制阀、变频器（VFD）等。例如，可以将输出模块连接到控制阀，以在“完全接通”和“完全断开”之间缓慢改变控制阀的开启或关闭程度。您可以根据需要决定将控制阀打开到其全容量的二分之一或三分之一。\n\
  \nPLC 的输出模块可以是晶体管型、双向可控硅（TRIAC）型或继电器型，具体取决于输出电路中使用哪种元器件来接通或断开负载。\n\n在晶体管输出类型中，输出电路采用晶体管来接通或断开负载。晶体管类型的输出只能切换直流负载。晶体管类型的输出速度快、使用寿命长，且可切换较小的电流。\n\
  \n在双向可控硅（TRIAC）输出类型中，输出电路使用 TRIAC 来接通或断开负载。它只能切换交流负载（即不能用于直流负载）。与继电器输出类型相比，它同样具有更长的使用寿命和更快的速度。\n\
  \n在继电器类型中，输出电路使用继电器来切换负载。它既可用于交流负载，也可用于直流负载。这是最常见的 PLC 输出类型。\n\n下图展示了西门子数字量输出模块：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_229_0.png)\n\n**图 7.6 – 西门子数字量输出模块（SM322，DO\
  \ 16x DC24V/0.5A）**\n\n该图的版权归 *Showlight Technologies Ltd.*（[www.showlight.com](http://www.showlight.com)）所有。\n\
  \n输出模块接收来自 CPU 的处理后信号，以控制灯、继电器、接触器等输出设备。\n\n接下来，我们来看一下 PLC 的其他模块。\n\n#### 其他 PLC\
  \ 模块\n\n除了上述 PLC 模块之外，在 PLC 中您还会发现其他模块。这些模块包括：\n\n- **通信模块**：该模块允许 PLC 与工厂内部或远距离的其他\
  \ PLC、PC 及其他设备进行通信。PLC 的通信模块通常具有支持特定通信或协议（例如 PROFIBUS、PROFINET、DeviceNet、Modbus、AS-i\
  \ 或以太网）的接口或通信端口。您可以在 *[第 13 章 “工业网络与通信协议基础”](#)* 中了解网络协议的相关知识。S7-1200 PLC 系统的通信模块包括\
  \ CM 1241 RS232、CM 1241 RS485、CM 1243-2 AS-i 主站、CM 1242-5 PROFIBUS DP 从站、CM 1243-5\
  \ PROFIBUS DP 主站、CP 1242-7 GPRS，具体取决于您计划使用的通信方式或协议。\n- **定位模块**：该模块允许在运动控制系统中执行各种位置控制、速度控制、扭矩控制等。三菱\
  \ Q 系列 PLC 的定位模块示例包括 QD77/GF4、QD77/GF8、QD77/MS16 等。\n\n**注意**\n\n感性负载可能会产生反向电流，从而损坏输出继电器。应使用二极管、压敏电阻或其他缓冲电路来保护\
  \ PLC 输出免受反向电流的损坏。\n\n在本节中，您已了解了电源模块、CPU 模块、输入模块和输出模块。它们是 PLC 系统的主要组成部分。深入理解本节所述部件将有助于更好地理解后续章节。\n\
  \n#### 探索 PLC 的类型\n\n根据硬件规格，PLC 有两种基本类型：\n\n- 紧凑型\n- 模块化型\n\n让我们逐一了解这些类型。\n\n#####\
  \ 紧凑型 PLC\n\n在这种类型中，CPU、输入模块、输出模块以及有时还包括电源，都被集成到一个单一模块中。\n\n其默认具有固定/有限数量的 I/O，但某些型号设计为支持扩展模块，可以通过添加扩展模块来增加输入和输出的数量。紧凑型\
  \ PLC 也可以称为固定式或一体式 PLC。S7-200 和 S7-1200 是西门子紧凑型 PLC 的示例，而 FX1N、FX2N 等是三菱紧凑型 PLC\
  \ 的示例。其他 PLC 制造商也有自己的紧凑型 PLC 系列/型号。\n\n下图展示了一款来自西门子的紧凑型 PLC（S7-1200，CPU 1211C，AC/DC/Rly）：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_232_0.png)\n\n**图 7.7 – 来自西门子的紧凑型 PLC**\n\
  \n该图的版权归 *Showlight Technologies Ltd.*（[www.showlight.com.ng](http://www.showlight.com.ng)）所有。\n\
  \n##### 模块化 PLC\n\n在这种类型中，CPU、输入模块、输出模块和电源是分开的，即它们不是集成在一起的。每个模块都插入到一个共用的机架/机箱或总线上。根据系统要求，可以通过插入额外的输入和输出模块来增加输入和输出的数量。机架/机箱作为\
  \ PLC 系统的骨干，将所有模块（电源、CPU、输入、输出及其他模块）连接在一起。下图展示了一款来自西门子的模块化 PLC（S7-300）：\n\n####\
  \ PLC 扫描周期\n\n输出。这是一个重复的过程。PLC 完成一个扫描周期所需的时间称为扫描时间，以毫秒为单位进行测量。\n\n以下是 PLC 扫描周期：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_234_0.png)\n\n**图 7.9 – PLC 扫描周期**\n\n\
  PLC 扫描周期可能因所使用的 PLC 不同而略有差异。基本上，PLC 首先开始读取输入，即检查所连接的开关和传感器的状态，以确定哪个是“接通”或“断开”，如果是模拟量，则读取其当前值。然后，它根据输入的状态执行用户程序。接下来，PLC\
  \ 执行通信任务，包括向控制网络（如 Profibus、Modbus、Ethernet IP 等）传递必要的信息。它还执行诊断任务，以确保整个 PLC 系统正常运行。在开始新的扫描之前，它会更新输出。\n\
  \n了解 PLC 扫描周期非常重要，本节已对此进行了说明。现在让我们进入下一节，了解一些 PLC 制造商。\n\n#### 了解 PLC 制造商\n\n了解 PLC\
  \ 的主要制造商非常重要。我们将在此讨论一些主要的 PLC 制造商：\n\n- **西门子（Siemens）**：西门子是工业自动化行业最大的品牌。其 PLC\
  \ 系列和自动化系统被称为 **SIMATIC**，代表 **Siemens Automatic**。因此，西门子 PLC 的品牌名称是 SIMATIC。西门子提供各种系列的产品，包括\
  \ SIMATIC LOGO! PLC、SIMATIC S7-200 系列 PLC、SIMATIC S7-300 系列 PLC、SIMATIC S7-400 系列\
  \ PLC、SIMATIC S7-1200 系列和 SIMATIC S7-1500 系列 PLC。\n- **罗克韦尔自动化（Rockwell Automation）**：罗克韦尔自动化是一家美国公司，总部位于美国密尔沃基。罗克韦尔自动化\
  \ PLC 产品的品牌名称是 Allen Bradley。其 PLC 产品系列包括 Allen Bradley MicroLogix PLC 系统、Allen\
  \ Bradley CompactLogix 小型 PLC 系统、Allen Bradley ControlLogix 大型 PLC 系统等。\n- **三菱电机（Mitsubishi\
  \ Electric）**：三菱电机是一家日本公司，总部位于日本东京。他们也是顶级的 PLC 制造商之一。三菱 PLC 产品的品牌名称是 MELSEC，其产品系列包括\
  \ MELSEC-Q 系列、MELSEC-FX 系列、MELSEC-A 系列等。\n\n\n\n\n在此部分，我们将探讨输入设备（开关）和输出设备（灯和执行器）与PLC的连接（接线）。**漏型（sinking）**和**源型（sourcing）**是PLC接线中的两个重要术语。它们用于描述两个电路或设备之间常规电流的流动方向。常规电流总是从正电位（+）流向负电位（-）。任何时候，只要有电流在两个设备之间流动，一个就是源型，另一个就是漏型。\n\
  \n源型设备是提供电流（正极）的设备，而漏型设备是吸收电流的设备（即连接到负极或接地的设备）。\n\n在PLC接线中，所涉及的两个设备分别是输入设备与输入模块，或输出设备与输出模块。PLC制造商通常生产的输入/输出模块可以是漏型或源型。有些PLC的输入/输出模块只能是漏型，有些则可选择漏型或源型。这完全取决于制造商的设计。无论你在本书中获取了什么信息，都建议在接线前查阅输入或输出模块的手册。\n\
  \n许多PLC制造商通常在PLC的输入或输出模块上设置一个公共端子，该端子必须连接到正极（例如，如果模块是源型）或连接到负极（例如，如果模块是漏型）。当输入/输出模块的公共端子连接到电源的正极（+24V）时，我们说该输入/输出模块是源型；当公共端子连接到电源的负极（-或0V）时，我们说该输入/输出模块是漏型。\n\
  \n我们将在本书中遵循一些简单的PLC接线规则：\n\n- 源型输入设备（开关和传感器）必须连接到漏型输入模块。下图显示了将源型输入设备（**常开（NO）**按钮、**常闭（NC）**按钮以及限位开关和浮球开关）连接到漏型输入模块的情况：\n\
  \n图7.11 – 漏型输入设备连接到源型输入模块\n\n源型输出设备（灯和执行器）必须连接到漏型输出模块。以下电路图显示了将源型输出设备（指示灯、继电器、接触器和电磁阀）连接到漏型输出模块的情况：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_242_0.png)\n\n#### 图7.12 – 源型输出设备连接到漏型输出模块\n\
  \n• 漏型输出设备（灯和执行器）必须连接到源型输出模块。以下电路图显示了将漏型输出设备（指示灯、继电器、接触器和电磁阀）连接到源型输出模块的情况：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_243_0.png)\n\
  \n#### 图7.13 – 漏型输出设备连接到源型输出模块\n\n前面的规则和接线图适用于输入或输出模块为直流的PLC。对于输入或输出模块为交流的PLC，同样的概念也适用，只是不会使用*漏型*和*源型*这两个术语。可以使用**火线（L）**和**零线（N）**来描述设备的连接。例如，当输入设备连接到L时，输入模块必须连接到N，反之亦然。同样，当输出设备连接到L时，输出模块必须连接到N，反之亦然。\n\
  \n以下电路图显示了输入设备（NO按钮和NC按钮）连接到L，而输入模块连接到N：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_245_0.png)\n\
  \n图7.14 – 输入设备连接到火线（L），而输入模块连接到零线（N）\n\n以下电路图显示了输入设备（NO按钮和NC按钮）连接到N，而输入模块连接到L：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_247_0.png)\n\n图7.16 – 输出设备连接到火线（L），而输出模块连接到零线（N）\n\
  \n以下电路图显示了输出设备（指示灯、继电器、接触器和电磁阀）连接到N，而输出模块连接到L：\n\n该图显示了直流输出模块的接线，该模块连接到220V交流接触器，还连接到一个三相交流电机：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_249_0.png)\n\n图7.18 – 直流输出模块的接线，该模块连接到220V交流接触器，还连接到三相交流电机\n\
  \n在本节中，我们讨论了可以在PLC上进行的各种连接（接线）。术语漏型和源型已得到详细说明。现在，你应该能够将源型输入设备连接到漏型输入模块，将漏型输入设备连接到源型输入模块，将源型输出设备连接到漏型输出模块，以及将漏型输出设备连接到源型输出模块。本节还解释了如何将输入/输出设备连接到使用交流电的输入/输出模块，最后我们还提供了一张图，帮助理解如何将直流输出模块连接到交流负载（*图7.20*）。\n\
  \n现在让我们进入下一节，以进一步加深对PLC接线的理解。\n\n#### PLC接线（2） – 接近传感器（3线）与PLC的接线\n\n在*第2章《开关与传感器——工作原理、应用与接线》*中，我们学习了接近传感器（电容式和电感式）。在本节中，我们将学习如何将它们连接到PLC。\n\
  \n电容式和电感式接近传感器可以是PNP或NPN型。NPN或PNP型都可以是NO或NC型。\n\n以下电路图显示了3线PNP（NO）和NPN（NO）接近传感器的接线图：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_250_0.png)\n\n图7.19 – 3线PNP（NO）和NPN（NO）接近传感器接线图\n\
  \n现在，让我们区分PNP和NPN传感器。\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_252_0.png)\n\n\
  图7.20 – PNP传感器（NO）与PLC的连接\n\n下面来看NPN传感器。\n\n#### NPN传感器\n\n另一方面，NPN传感器可以称为漏型传感器。回顾一下，漏型输入设备吸收电流，因此NPN传感器在检测到物体时切换为负。它与源型输入模块（即连接到正极的模块）一起使用。以下电路图显示了NPN传感器（NO）与PLC的连接：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_253_0.png)\n\n图7.21 – NPN传感器（NO）与PLC的连接\n\
  \n我们现在已经能够区分PNP和NPN接近传感器，以及如何为它们接线。为了更好地理解，让我们看一下NPN传感器连接到数字输入模块的实物接线图：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_254_0.png)\n\
  \n图7.22 – NPN传感器连接到数字输入模块的实物接线图\n\n此图来源为Industrial Design Simulation Automation\
  \ Services Ltd.和Showlight Technologies Ltd.\n\n在本节中，你学习了接近传感器（3线）与PLC的基本连接（接线）。现在你应该能够将PNP或NPN接近传感器连接到PLC了。\n\
  \n现在，我们将进入下一节，学习光电传感器与PLC的连接（接线）。\n\n#### PLC接线（3） – 光电传感器（回归反射式）的接线\n\n我们在*第2章*《*开关与传感器——工作原理、应用与接线*》中也讨论过光电传感器；在本节中，我们将学习如何将光电传感器连接到输入模块。\n\
  \n*第2章*中的*图2.49*显示了回归反射式光电传感器的接线图。\n\n*第2章*中描述的回归反射式光电传感器可以切换为正或负，具体取决于与之配合使用的输入模块是漏型还是源型。如果**白色（WH）**线连接到正极，则**黑色（BK）**线在检测到物体时会有输出（+ve）；如果WH线连接到负极，则BK线在检测到物体时会有负输出。\n\
  \n以下电路图显示了光电传感器连接到漏型输入模块的接线：\n\n\n\n\n\nFigure 7.23 – Photoelectric sensor connection\
  \ to a sinking input module\n\nThe following circuit diagram shows a photoelectric\
  \ sensor connection to a sourcing input module:\n\nFigure 7.24 – Photoelectric sensor\
  \ connection to a sourcing input module\n\nIn this section, you have learned about\
  \ the basic connection of a photoelectric sensor to a PLC. You should now be able\
  \ to connect a photoelectric sensor to a sinking or sourcing input module of a PLC.\n\
  \nLet’s proceed to the next section to learn how to wire a PLC from one of the top\
  \ PLC manufacturers.\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_257_0.png)\n\n\
  #### Wiring of the Siemens S7-1200 PLC (CPU 1211C AC/DC/Relay)\n\nThe PLC wiring\
  \ explained in this chapter provides the basic skill needed to get PLCs wired to\
  \ sensors, lights, and actuators. It is advisable to consult the manual of any PLC\
  \ you want to wire and follow the wiring/guides provided in the manual. The following\
  \ diagram shows the wiring of the Siemens S7-1200 PLC (CPU 1211C AC/DC/Relay) in\
  \ the manual:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_258_0.png)\n\nFigure 7.25\
  \ – Siemens S7 1200 PLC wiring (CPU 1211C AC/DC/Relay)\n\nWhen the NC push button\
  \ connected to I0.1 is pressed, the corresponding indicator light (I0.1) will be\
  \ OFF, and when the button is released, the corresponding indicator light (I0.1)\
  \ will be ON.\n\nThe operation of the connected output devices (contactor and lamp)\
  \ is a function of the program written into the PLC, which is covered in *Chapter\
  \ 8*, *Understanding PLC Software and Programming with TIA Portal*.\n\nWhen the\
  \ written program is executed and the result of the logic energizes or activates\
  \ Q0.0, the corresponding indicator light on the PLC (Q0.0) will be ON and the contactor\
  \ will be energized. Similarly, when the result of the logic energizes or activates\
  \ Q0.1, the corresponding indicator light on the PLC (Q0.1) will be ON and the lamp\
  \ will be ON.\n\nPLC wiring and programming work together. You need to understand\
  \ the PLC wiring covered in this chapter to have a better understanding of the programming\
  \ covered in *Chapter 8*.\n\nYou have just completed the PLC wiring part of this\
  \ book. You should now be able to connect push buttons, limit switches, proximity\
  \ sensors, lights, relays, contactors, solenoid valves, and other input or output\
  \ devices to a PLC.\n\n#### Summary\n\nCongratulations! You have successfully completed\
  \ *Chapter 7* of this book. Good job! The chapter gives a good explanation of what\
