  \n图2.52\n\n### 执行器及其在工业自动化中的应用\n\n在上一章中，我们将人类的功能与自动化联系起来。眼睛、触觉和嗅觉被比作开关和传感器，而控制器被比作大脑。在本章中，我们将讨论执行器，它可以被比作手。在我们的人体系统中，手执行大脑指令。类似地，在自动化中，执行器执行控制器指令。执行器本质上是一个移动器。它可以像手一样移动、携带或执行其他类似功能。它需要来自控制器的控制信号来执行其动作。控制信号是控制器通过写入其中的程序（一组指令）进行处理的结果。没有执行器，工业自动化是不完整的。\n\
  \n本章将解释工业自动化中使用的各种执行器。你将学习它们的基本工作原理及其在工业中的应用。执行器是工业自动化中需要足够重视的关键组件之一。本章将提供自动化工程师需要了解的有关执行器的相关信息。\n\
  \n在本章中，我们将介绍以下主要主题：\n\n- 介绍执行器\n- 了解电动执行器\n- 探索气动执行器\n- 认识液压执行器\n\n#### 介绍执行器\n\n\
  **执行器**是产生动作或运动的设备或组件。它可以被称为**移动器**，因为它移动以控制系统。它通常需要来自控制器的控制信号和能源，可以是**电**、**气动**（空气）或**液压**（液体）。当它接收到控制信号时，它将自己的能量（电、气动或液压）转换为能够执行所需动作的能量或运动形式。\n\
  \n执行器在工业中的一个主要应用是**阀门**的打开和关闭。\n\n手动操作的阀门使用手轮、手动齿轮箱、旋钮等作为其操作执行器。人可以顺时针或逆时针转动手轮或旋钮来打开或关闭阀门。\n\
  \n在手动操作阀门打开或关闭不现实的情况下，例如在偏远位置或阀门非常大时，需要使用气动、电动或液压执行器。\n\n执行器（气动、电动或液压）在接收到控制器的控制信号时，通过将其自身能量转换为机械力（或运动），提供打开或关闭阀门所需的动力或运动。图3.16左侧显示了一个可以手动操作的手轮阀门，右侧显示了一个带有气动执行器的阀门，可以通过控制信号自动操作。\n\
  \n图3.1显示了执行器的功能框图：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_85_0.png)\n\n图3.1\
  \ – 执行器的功能框图\n\n执行器产生的运动可以是直线运动或旋转运动。有多种类型的执行器，其产生的运动可以是直线或旋转的。\n\n执行器基本上有三种类型：\n\
  \n- 电动执行器\n- 气动执行器\n- 液压执行器\n\n我们将在本章接下来的主题中了解这三种类型的执行器。我们将学习它们的基本结构以及它们在工业中的应用。掌握这些知识将有助于你为工业自动化需求选择合适的执行器。\n\
  \n#### 了解电动执行器\n\n**电动执行器**在工业中用于将电能转换为动能，以引起负载运动或执行需要运动或力的动作。大多数电动执行器的操作基于磁场与载流导体之间的相互作用，以产生*旋转力*。工业风扇、鼓风机、泵、风门等是这类电动执行器的常见应用。它们利用电动机来执行必要的动作。电动执行器因其精度、灵活性和低运行成本而用于机器人和其他装配应用。它们用于需要圆周运动的工业机器。它们还用于夹紧、压制、切割、冲压以及其他需要直线运动的应用。电动执行器可以被视为将电能转换为直线或圆周运动的设备。因此，电动执行器有两种类型：\n\
  \n- **电动直线执行器：** 这是一种沿直线方向移动的执行器。在这种执行器中，首先由电动机高速产生旋转运动。然后通过齿轮箱减速以增加扭矩，这将使丝杠旋转运动，进而使驱动螺母直线移动。使用限位开关来确保驱动螺母不会在正向或反向移动超过某个点。\n\
  \n*图3.2显示了线性执行器的部件：*\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_87_0.png)\n\n图3.2\
  \ – 电动直线执行器的部件\n\n电动旋转执行器：电动旋转执行器常用于自动化系统。示例包括直流（DC）电机、交流（AC）电机、步进电机和伺服电机。\n\n我们将在接下来的章节中了解电动旋转执行器的示例。\n\
  \n#### 直流电机\n\n直流（DC）电机将电能（通过DC）转换为机械能（运动）。直流电机由定子、电枢、裂环换向器和电刷组成。定子是固定部分，通常由永磁体组成；电枢是旋转部分，由线圈组成。线圈的绕组连接到裂环\n\
  \n\n\nThe split-ring commutators ensure the direction of the current in the coil\
  \ is reversed each half turn.\n\nWhen a current is passed to the coil through the\
  \ brushes and split-ring commutators, a rotating magnetic field is created that\
  \ interacts with the differing fields of the magnets in the stator to create a turning\
  \ force (torque), which causes the armature (coil) to rotate.\n\nFigure 3.3 shows\
  \ the internal structure of a simple DC motor.\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_88_0.png)\n\
  \nFigure 3.3 – Internal structure of a simple DC motor\n\nWe will go into further\
  \ details of a DC motor in Chapter 4, Overview of AC and DC Motors.\n\n##### Alternating\
  \ current motors\n\n**Alternating current** (AC) motors convert electrical energy\
  \ (through AC) to mechanical energy (motion). Unlike a DC motor, which makes use\
  \ of DC as its energy source, an AC motor uses AC as its energy source. AC motors\
  \ generally consist of two main parts, which are the stator and rotor.\n\nThe stator\
  \ is a stationary part with coils supplied with AC. The flow of the AC in the stator\
  \ coil creates a rotating magnetic field. The rotor is the rotating part and is\
  \ attached to an output shaft. The rotor also produces its own rotating magnetic\
  \ field through the induced current from the stator or other means. The interaction\
  \ between the rotating magnetic field of the stator and the field of the rotor creates\
  \ a turning force that causes rotation. An AC motor can be single-phase or three-phase.\
  \ A single-phase AC motor uses a single-phase supply (live and neutral) while a\
  \ three-phase AC motor uses a three-phase supply (L1, L2, and L3). *Chapter 4, Overview\
  \ of AC and DC Motors*, contains more information on AC motors.\n\nThe following\
  \ figure shows an **AC induction motor**:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_90_0.png)\n\
  \nFigure 3.4 – AC induction motor\n\nThe credit for this image goes to *Wikimedia\
  \ Commons* and can be found at the following link: https://creativecommons.org/licenses/by-sa/4.0/deed.en\n\
  \n##### Stepper motor\n\nA **stepper motor** is a type of DC motor that rotates\
  \ in steps. It does not turn arbitrarily when its terminal is connected to a source,\
  \ rather it turns in steps. It also consists of a stator and a rotor. The stator\
  \ consists of windings (coils) while the rotor is usually made of a permanent magnet.\
  \ Activating the windings of the stator step by step in a particular order will\
  \ create a turning force as the electromagnetic poles of the stator winding react\
  \ with the poles of the permanent magnet of the rotor.\n\nThe following figure shows\
  \ a stepper motor:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_91_0.png)\n\nFigure\
  \ 3.5 – Stepper motor\n\nThe credit for this image goes to *Wikimedia Commons* and\
  \ can be found at the following link: https://creativecommons.org/licenses/by-sa/4.0/deed.en\n\
  \n##### Servo motor\n\nA **servo motor** is a rotary actuator that can rotate with\
  \ high efficiency and great precision. It is good for rotating objects at some specific\
  \ angle or distance. They are commonly used in robotics and automation technology.\
  \ They consist of a control circuit that provides feedback on the current position\
  \ of the shaft. The feedback signal from the control circuit enables the motor to\
  \ control the rotational or linear speed and position. Servo motor types include\
  \ DC servo motors and AC servo motors, amongst other types. A **DC servo motor**\
  \ is powered by a DC supply. Common DC servo motors used in toys and other robotics-related\
  \ products consist of a DC motor, gears, a potentiometer, and a control circuit\
  \ that ensures it turns at a specific angle via a control signal.\n\nThe following\
  \ diagram shows the main parts of a common DC servo motor:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_92_0.png)\n\
  \nFigure 3.6 – Internal parts of a DC servo motor\n\nAn AC servo motor is powered\
  \ by an AC supply. It has an encoder and is used with controllers to provide feedback\
  \ and closed-loop control. The following diagram shows some of the parts of an AC\
  \ servo motor:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_92_1.png)\n\nFigure 3.7\
  \ – AC servo motor parts\n\nOther forms of electrical actuators include solenoid,\
  \ electro-mechanical relay, and contactor, among others. Let's have a look at what\
  \ each of them is in the next sections.\n\nA **solenoid** can be referred to as\
  \ a device that converts electrical energy into mechanical energy (motion). It consists\
  \ of a coil of wire, plunger, and spring. The coil is formed in such a way that\
  \ the plunger can move in and out of the coil's body. When a current passes through\
  \ the coil, a magnetic field is created and is used to create a linear or angular\
  \ motion depending on the type. The spring returns the plunger back to its original\
  \ position when power is removed. In *Figure 3.8*, when current flows through the\
  \ coil, an electromagnetic field is generated, which pulls the plunger inward. The\
  \ spring pushes it to its original position when power is removed.\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_93_0.png)\n\
  \nFigure 3.8 – Parts of solenoid\n\nA solenoid is used in an automated system to\
  \ create *motion*. The system can be applied to open or close a valve as shown in\
  \ the solenoid valve in the following diagram:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_94_0.png)\n\
  \nFigure 3.9 – Solenoid valve\n\nIn *Figure 3.9*, when current flows through the\
  \ coil, the magnetic field of the energized coil pulls the plunger to open the valve.\
  \ When the power is removed, the coil becomes de-energized and the spring forces\
  \ the plunger to close the valve. Solenoid valves are useful for controlling the\
  \ flow of compressed air into a *pneumatic cylinder* or the flow of hydraulic fluid\
  \ into a *hydraulic cylinder*. Other applications of solenoid valves include a door\
  \ locking system that offers secure door closure and a pusher on a conveyor belt\
  \ diverting an object or package to a specific location.\n\n#### Electro-mechanical\
  \ relay\n\nAn **electro-mechanical relay** is an electrically operated switch that\
  \ can open or close a circuit with the physical movement of a contact. It can be\
  \ referred to as a switch that is operated electrically, unlike the manual or mechanically\
  \ operated switch explained in *Chapter 2*, *Switches and Sensors – Working Principles,\
  \ Applications, and Wiring*. The following diagram shows the internal structure\
  \ of a relay:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_95_0.png)\n\nFigure 3.10\
  \ – Internal structure of a relay\n\nIt consists of a **coil** (electromagnet),\
  \ a **moveable contact**, **stationary contacts**, and a **spring**.\n\nWhen the\
  \ relay coil is energized by allowing a current to flow through the terminal, the\
  \ moveable **contact (C)** will be attracted towards the **normally open (NO)**\
  \ of the stationary contact, making them contact each other. When the power is removed,\
  \ the moveable contact returns to the **normally closed (NC)** position. The moveable\
  \ contact and the fixed contact can act as a switch for equipment that needs power,\
  \ as shown in the following diagram:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_96_0.png)\n\
  \nFigure 3.11 – Relay acting as a switch\n\nIn *Figure 3.11*, when there is a supply\
  \ to the coil from a control circuit, the coil becomes energized, the moveable contact\
  \ gets connected to the **NO** of the stationary contact, and the load turns on.\
  \ When there is no more supply from the control circuit, the coil becomes de-energized,\
  \ the moveable contact returns to the **NC** contact of the stationary contacts,\
  \ and the load turns off.\n\nRelays are of various configurations, just like a switch.\
  \ The various types include SPST, SPDT, DPST, and DPDT. The relay that I explained\
  \ is a **single pole double throw** relay. Refer to *Chapter 2, Switches and Sensors\
  \ – Working Principles, Applications, and Wiring*, to have a good understanding\
  \ of *SPST, SPDT, DPST, and DPDT*.\n\nThe following diagram shows the symbols of\
  \ various relay configurations:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_97_0.png)\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_97_1.png)\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_97_2.png)\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_97_3.png)\n\nFigure 3.12 – Relay configuration\n\
  \nThe following figure shows a single pole double throw relay with the cover removed:\n\
  \n\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_98_0.png)\n\nFigure 3.13 – 去掉外壳的单刀双掷继电器\n\
  \n此图像的署名归于 *Wikimedia Commons*，可在以下链接找到：\n\n[https://creativecommons.org/licenses/by-sa/4.0/deed.en](https://creativecommons.org/licenses/by-sa/4.0/deed.en)\n\
  \nC 可在 NO 与 NC 之间移动。当线圈未通电时，C 与 NC 触点连接；当线圈通电时，C 返回到 NO 触点。\n\n在自动化系统中需要大功率和大电流时使用机电继电器。\n\
  \n#### 接触器\n\n**接触器** 是一种电操作的开关，就像继电器一样。它是一种可以电操作的开关，不像手动和机械操作的开关。它通常至少包含一个线圈，最多三个常开触点。在某些情况下，还包括一个随主触点动作的辅助触点。线圈的端子通常标记为\
  \ A1 和 A2。当电流通过端子 A1 和 A2 供给线圈时，线圈通电，磁场迫使触点同时闭合。断电后，触点打开。\n\n继电器和接触器的基本操作和功能相似。主要区别在于其电流承载能力。继电器可切换约\
  \ 20 A 或更大的较小电流负载，而接触器可处理高达 12,500 A 的较大电流负载。\n\n下图显示了接触器的符号：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_99_0.png)\n\
  \nFigure 3.14 – 接触器的符号\n\n如果你好奇的话，下图显示了接触器的外观：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_100_0.png)\n\
  \nFigure 3.15 – 接触器\n\n此图像的署名归于 *Wikimedia Commons*，可在以下链接找到： https://creativecommons.org/licenses/by-sa/4.0/deed.en\n\
  \n在本节中，你已了解执行器是什么以及工业自动化中执行器的各种类别，包括电气、气动和液压执行器。本节涵盖了电气执行器，你将对该主题有全面的理解。下一节将重点介绍什么是\
  \ *气动执行器*。\n\n#### 探索气动执行器\n\n**气动执行器** 使用压缩空气或气体作为能量或动力源来产生旋转或线性运动。它们非常可靠、高效且安全，可用于可能因电引起火灾危险的环境中。它们有各种工业应用，包括阀门的常规开闭、拾放处理装置等。气动执行器也可称为\
  \ **气动缸** 或 **气缸**。\n\n在气动执行器中，压缩空气或加压气体进入一个腔室，气体在与外界大气压相对的情况下在腔室内积聚压力，从而导致装置的运动，该装置可能是活塞或齿轮。气动执行器产生的运动可以是\
  \ *线性* 或 *圆形*。因此，气动执行器只是将压缩空气中的能量转换为线性或圆形运动。\n\n*Figure 3.16* 显示了图左侧可手动操作的阀门和图右侧带气动执行器的阀门，该阀门可通过\
  \ *控制信号* 自动操作。气动执行器将其自身的能量转换为运动，通过控制信号自动打开或关闭阀门。\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_102_0.png)\n\
  \nFigure 3.16 – 带手轮的闸阀（左）和线性气动执行器（右）\n\n此图像的署名归于 *Wikimedia Commons*，可在以下链接找到： [https://creativecommons.org/licenses/by-sa/4.0/deed.en](https://creativecommons.org/licenses/by-sa/4.0/deed.en)\n\
  \n气动执行器基本上分为两种类型：\n\n- 气动线性执行器\n- 气动旋转执行器\n\n在下一节中，我们将了解它们是什么。\n\n#### 气动线性执行器\n\
  \n在 **气动线性执行器** 中，进入腔室或气缸的压缩空气积聚压力，当腔室内积聚的压力与外界大气压相对时，可使活塞向前或向后做线性运动。\n\n气动线性执行器有两种类型：\n\
  \n- 单作用气缸\n- 双作用气缸\n\n在 **单作用气缸** 中，气缸只有一个供空气流入的端口。当空气通过该端口进入时，压力升高并推动活塞向前（推式）或向后（拉式）。位于气缸内或外的弹簧将活塞复位到原始位置，使其准备好接受下一次压力冲击。\n\
  \n下图显示了单作用气缸的符号：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_103_0.png)\n\nFigure\
  \ 3.17 – 带弹簧复位的单作用气缸符号\n\nFigure 3.18 显示了单作用气缸的实际应用（也称为 **气动锤** 或 **冲击钻**）。它是一种将锤子和凿子结合在一起的气动工具，用于破碎岩石、沥青和混凝土。\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_104_0.png)\n\nFigure 3.18 – 气动钻或冲击锤\n\
  \n在 **双作用气缸** 中，有两个端口，分别位于气缸的两端。通过其中一个端口施加空气可推动活塞向前，而通过另一个端口施加空气可将活塞推回原始位置。这不需要弹簧，因为可在两端施加空气使活塞前后移动。\n\
  \n下图显示了双作用气缸的符号：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_105_0.png)\n\nFigure\
  \ 3.19 – 双作用气缸符号\n\n下图显示了一个双作用气缸：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_105_1.png)\n\
  \nFigure 3.20 – 双作用气缸\n\n此图像的署名归于 Wikimedia Commons，可在以下链接找到： https://creativecommons.org/licenses/by-sa/4.0/deed.en\n\
  \n现在让我们继续下一个类型的气动执行器。\n\n#### 气动旋转执行器\n\n**气动旋转执行器** 是旋转而不是直线移动。因此得名 *旋转*。它们可以设计为安装在需要旋转其阀杆以远程或通过\
  \ *控制信号* 自动打开或关闭阀门的阀门上。\n\n它由活塞或 *膜片* 一侧或两侧的气室组成。空气压力的增加推动活塞产生线性或 *圆形* 运动。如果产生的运动是线性的，则使用齿轮或凸轮（一种用于将旋转运动转换为线性运动或反之的机器部件）将线性运动在内部转换为圆形运动。\n\
  \n下图让你了解如果你好奇的话气动旋转执行器的外观：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_106_0.png)\n\
  \nFigure 3.21 – 气动旋转执行器\n\n气动旋转执行器有三种类型。让我们在下一节中探索它们。\n\n#### 苏格兰轭\n\n在 **苏格兰轭**\
  \ 执行器中，活塞连接到旋转轴。空气压力的增加使活塞线性移动，通过凸轮旋转旋转轴。双作用类型需要在另一侧施加空气压力以使旋转方向相反。\n\n下图显示了苏格兰轭气动旋转执行器的部件：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_107_0.png)\n\nFigure 3.22 – 苏格兰轭气动旋转执行器\n\
  \n#### 叶片\n\n**叶片** 是一种旋转执行器，不使用会先线性移动然后在内部转换为圆形运动的活塞。它产生圆形\n\n\nmotion directly\
  \ from compressed air through a movable vane in the air chamber.\n\n（译文）直接通过压缩空气作用于气室中的可移动叶片产生运动。\n\
  \n下面的图展示了气动叶片执行器的部件：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_108_0.png)\n\n\
  图 3.23 – 叶片式气动旋转执行器\n\n#### 齿轮齿条式\n\n在**齿轮齿条式**执行器中，活塞带动齿条穿过齿轮（小齿轮）。该动作使小齿轮旋转，从而在输出轴上产生圆周运动。下图展示了齿轮齿条式气动旋转执行器的部件：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_109_0.png)\n\n图 3.24 – 齿轮齿条式气动旋转执行器\n\
  \n在图 3.24 中，当加压空气通过 A 口进入中间腔室时，两个活塞被分开并移动到气缸的两端。两端气室中的空气通过 B 口排出。两个活塞的齿条同时驱动轴并使其逆时针旋转。当加压空气通过\
  \ B 口进入活塞两端的气室时，两个活塞向内移动。两个活塞的齿条同时驱动轴并使其顺时针旋转。\n\n在本节中，您已经了解了如何利用压缩空气通过气动执行器产生运动。您还学习了气动执行器的类型及其在工业中的应用。掌握气动执行器的知识将帮助您快速理解液压执行器，这将在下一节中介绍。\n\
  \n#### 了解液压执行器\n\n**液压执行器**使用加压液压油（即油）作为能量源，为需要高力和坚固性的应用产生旋转或直线运动。液压执行器也可以称为*液压缸*。它将液压能（即流体能量）转换为运动。它还包含一个气缸，其中与活塞杆相连的活塞通过将液压油泵入活塞一端或另一端的端口而往复运动。\n\
  \n与气动执行器类似，液压执行器有两种类型：\n\n- 液压直线执行器\n- 液压旋转执行器\n\n每种类型的工作原理与本章前一节中介绍的气动执行器类似，只是液压执行器使用液压油（即油），而不是气动系统中使用的压缩空气或气体。\n\
  \n下图展示了一个单作用液压直线执行器：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_111_0.png)\n\n\
  图 3.25 – 液压直线执行器\n\n图 3.25 展示了单作用液压执行器的各个部件。它包含气缸、活塞、活塞杆、弹簧等。它只有一个用于流体（液压油供应）流入气缸的端口。当液压油通过该端口进入时，压力增加并推动活塞向前（推式）或向后（拉式）。位于气缸内部或外部的弹簧将活塞恢复到其原始位置，使其为下一次压力冲击做好准备。\n\
  \n液压执行器也可以用于打开或关闭阀门，如下所示：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_112_0.png)\n\
  \n图 3.26 – 液压阀\n\n在本节中，您学习了利用加压流体产生运动的概念。您还发现液压执行器的操作方式类似于气动执行器。主要区别在于所用流体的种类。气动执行器使用压缩空气或气体，而液压执行器使用液压油，并且用于高力和坚固的应用。\n\
  \n#### 总结\n\n您已成功完成本章。干得漂亮！到达本章末尾后，您现在应该能够解释执行器及其可用的基本类型（电动执行器、气动执行器和液压执行器）。\n\n\
  电动执行器使用电能，气动执行器使用压缩空气，而液压执行器使用加压流体（油）。它们都通过运动执行动作，运动可以是直线运动或旋转运动。某些执行器比其他执行器更适合特定应用。例如，液压执行器适用于需要高力的任务。了解本书中提到的所有三种类型是很有好处的。当您作为自动化工程师在行业工作时，您可能会遇到其中任何一种类型。\n\
  \n本章涉及的主题与自动化工程师相关，并将帮助您更好地理解本书的下一章。\n\n#### 问题\n\n以下问题用于测试您对本章的理解。在尝试回答问题之前，请确保您已阅读并理解本章中的主题。\n\
