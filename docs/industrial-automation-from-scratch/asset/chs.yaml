  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_56_0.png)\n\n图 2.25 – 浮球开关和水泵\n\n下图显示了浮球开关的外观：\n\
  \n\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_57_0.png)\n\nFig. 2.26 – A float\
  \ switch\n\nThe credit for this image goes to *Showlight Technologies LTD* [www.showlight.com.ng](http://www.showlight.com.ng).\n\
  \nThe most basic float switch is a **two-wire, single-pole, single-throw (SPST)**\
  \ float switch, which can exist as normally closed or normally open. An SPDT float\
  \ switch, which has three wires, also exists. The following diagram shows the symbols\
  \ for various forms of float switches that are available:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_58_0.png)\n\
  \nNORMALLY OPEN (NO) FLOAT SWITCH\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_58_1.png)\n\
  \nNORMALLY CLOSED (NC) FLOAT SWITCH\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_58_2.png)\n\
  \nSINGLE POLE DOUBLE THROW FLOAT SWITCH\n\nFigure 2.27 – Symbols for various forms\
  \ of float switches\n\nNext, we will look at each float switch mentioned in this\
  \ section.\n\n#### Normally closed float switch\n\nIn a normally closed float switch,\
  \ the electrical circuit is closed in a downward position and opened in an upward\
  \ position. So, with gravity pulling it down, it is closed; as the liquid level\
  \ rises to the preset level, it will open, as shown in the following diagram:\n\n\
  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_59_0.png)\n\nFigure 2.28 – A normally closed\
  \ float switch being used to turn off a pump that fills a tank\n\nIn the preceding\
  \ diagram, when the water level is low, the float switch will close, and the power\
  \ will flow to the pump and the pump will begin to fill the tank. As the water level\
  \ rises, the float switch will become open at a preset point, and the pump will\
  \ stop.\n\n#### Normally open float switch\n\nIn a normally open float switch, the\
  \ electrical circuit is open in the downward position and closed in the upward position.\
  \ So, with gravity pulling it down, it is open, and as the liquid level rises to\
  \ the preset level, it will close:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_61_0.png)\n\
  \nFigure 2.30 – SPDT float switch\n\nThis switch can be used to either fill a tank\
  \ automatically when empty or empty a filled tank automatically.\n\nWe'll look at\
  \ these two scenarios in the following sections.\n\n##### Filling a tank\n\nHere,\
  \ the black and blue wires are used to turn the pump on or off. When the water level\
  \ is low, the black wire gets connected to the blue wire and the pump starts to\
  \ operate. When the tank is full, the black wire gets disconnected from the blue\
  \ wire and the pump stops.\n\nThe following diagram shows an SPDT float switch when\
  \ the water level is low:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_62_0.png)\n\
  \nBLACK AND BLUE WILL CONNECT IN THIS POSITION\n\nFigure 2.31 – SPDT float switch\
  \ when the water level is low\n\n##### Emptying a tank\n\nHere, the black and brown\
  \ wires of the float switch are used to turn the pump on or off. When the water\
  \ level is high, the black wire gets connected to the brown wire and the pump starts\
  \ to operate. When the water level is low, the black wire disconnects from the brown\
  \ wire and the pump stops.\n\nThe following diagram shows an SPDT float switch when\
  \ the tank is full:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_63_0.png)\n\nBLACK\
  \ AND BROWN WILL CONNECT IN THIS POSITION\n\nFigure 2.32 – SPDT float switch when\
  \ the tank is full\n\nIn the next section, we will explore another mechanically\
  \ operated switch.\n\n#### Pressure switch\n\nA pressure switch is a form of sensor\
  \ that closes or opens an electrical contact when a certain pressure is obtained\
  \ through an increase or decrease in pressure.\n\nA mechanical pressure switch consists\
  \ of a process connection, measuring element, switch contacts, electrical connection,\
  \ and a setpoint adjustment screw.\n\nThe core part of a mechanical pressure switch\
  \ is its measuring element. Elastic diaphragms or stainless-steel pistons are usually\
  \ used for this purpose. The diaphragm is designed for vacuum or low pressure ranges\
  \ up to 16 bars, while the piston is suitable for higher pressure ranges up to 350\
  \ bars. The process connection and case are usually made of galvanized steel or\
  \ brass. The process connection is the part that connects to the air supply or for\
  \ the process to control. The switch contacts are the internal contacts that open\
  \ or close as pressure increases or decreases. The electrical connection connects\
  \ to the internal electrical contact, which opens or closes as pressure rises or\
  \ falls. The setpoint adjustment screw can be used to calibrate or adjust the switch\
  \ (that is, set the pressure at which the switch opens or closes).\n\nThe following\
  \ diagram shows the cross-section of a pressure switch:\n\nELECTRICAL CONNECTION<br>SETPOINT\
  \ ADJUSTMENT SCREW<br>SWITCH CONTACTS<br>MEASURING ELEMENTS<br>PROCESS CONNECTION\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_65_0.png)\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_66_0.png)\n\
  \nFigure 2.33 – Cross-section of a pressure switch\n\nThe *single pole single throw*\
  \ form of a pressure switch can exist as NO and NC.\n\nIn an *NO* type, the switch\
  \ contacts are open (not connected) when no pressure is applied, and they close\
  \ when the applied pressure is equal to the setpoint.\n\nIn an NC type, the switch\
  \ contacts are closed (connected) when no pressure is applied, and they open when\
  \ the applied pressure is equal to the setpoint.\n\nYour choice of switch depends\
  \ on the type of circuit you intend to drive with the switch.\n\nThe following diagram\
  \ shows the symbols of a pressure switch:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_66_1.png)\n\
  \nNORMALLY CLOSED (NC) PRESSURE SWITCH\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_66_2.png)\n\
  \nNORMALLY OPEN (NO) PRESSURE SWITCH\n\nFigure 2.34 – Symbols of a pressure switch\n\
  \nThe following diagram shows the wiring of a pressure switch being used to switch\
  \ off a lamp when a setpoint has been reached:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_67_0.png)\n\
  \nFigure 2.35 – A pressure switch (NC) being used to switch off a lamp when a setpoint\
  \ has been reached\n\nThe following diagram shows the wiring of a pressure switch\
  \ being used to switch on a buzzer when a setpoint has been reached:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_67_1.png)\n\
  \nFigure 2.36 – A pressure switch (NO) being used to switch on a buzzer when a setpoint\
  \ has been reached\n\nLastly, we will look at what a temperature switch is.\n\n\
  #### Temperature switch\n\nA **temperature switch** is a switch that opens or closes\
  \ when the temperature reaches a setpoint or falls below a setpoint. The design\
  \ of a temperature switch consists of two parts:\n\n- **Sensor**: This can be a\
  \ sensing bulb filled with a fluid – liquid, gas, or a bimetallic strip. It's usually\
  \ immersed in the process whose temperature is to be controlled.\n- **Snap-action\
  \ contacts**: These switch the electrical power of the device controlling the temperature\
  \ of the process on or off.\n\nThere are various types of temperature switches,\
  \ including bimetallic strip temperature switches and liquid-filled temperature\
  \ switches.\n\nA **bimetallic strip temperature switch** is one of the most common\
  \ temperature switches. It consists of a thin rectangular strip formed of two dissimilar\
  \ metals that are bonded back to back. The two dissimilar metals experience dissimilar\
  \ thermal expansion rates. Hence, when the temperature increases, one metal will\
  \ expand faster than the other. This causes the strip to bend. The bending strip\
  \ is used to activate a snap action switch that opens or closes a circuit.\n\nThe\
  \ following diagram shows a simple bimetallic strip temperature switch:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_69_0.png)\n\
  \nFigure 2.37 – A bimetallic strip temperature switch\n\nA liquid-filled temperature\
  \ switch (capillary thermostat) consists of a fluid encapsulated in a metal tube\
  \ (bulb and capillary). The fluid expands or contracts when the temperature changes.\
  \ The change in fluid moves the head, which triggers a snap action switch, either\
  \ opening or closing the circuit.\n\nThe following diagram shows a capillary thermostat\
  \ (a liquid-filled temperature switch):\n\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_70_0.png)\n\
  \n图 2.38 – 毛细管式温度开关\n\n下图展示了温度开关的符号：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_70_1.png)\n\
  \n常开（NO）温度开关\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_70_2.png)\n\n常闭（NC）温度开关\n\
  \n图 2.39 – 温度开关的符号\n\n在本节中，你了解了一些可用于工业自动化流程的各种机械操作开关，还看到了不同开关使用的各种符号。这些符号对于阅读原理图非常重要。了解如何接线这些开关也很有帮助。你从本节获得的知识将帮助你更好地理解下一节。\n\
  \n#### 理解接近传感器（电容式、电感式和光电式）\n\n**接近传感器**常用于工业应用。了解接近传感器有助于你理解其他类型的传感器。\n\n接近传感器利用电磁场、光或声音来检测物体的存在与否。有多种类型，每种都适用于特定环境或应用。\n\
  \n可用的接近传感器类型如下：\n\n- 电感式接近传感器\n- 电容式接近传感器\n- 光电式接近传感器\n\n在接下来的几个小节中，我们将逐一探究这些接近传感器。\n\
  \n##### 电感式接近传感器\n\n这是一种*非接触式传感器*，用于检测铁磁性金属，如*碳钢、不锈钢和铸铁*。\n\n电感式接近传感器由**线圈、振荡器、检测电路**和**输出电路**组成。振荡器提供一个*振荡磁场*，该磁场辐射在线圈绕组周围，线圈位于传感器表面。当铁磁性金属靠近磁场时，金属表面会感应出微小电流（涡流）。该微小电流会改变磁路的固有频率，从而降低振荡幅度。检测电路监测振荡幅度，并在振荡降低到足够水平时触发*输出电路*产生输出。\n\
  \n如果传感器采用*NO*配置，当金属进入感应区域时，它将产生*ON*信号。对于*NC*配置，当金属进入感应区域时，其输出为*OFF*信号。该输出可由可编程逻辑控制器（PLC）或其他形式的控制器读取，将*ON*或*OFF*状态转换为可用信息。\n\
  \n下图展示了电感式接近传感器的主要电路：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_72_0.png)\n\n\
  图 2.40 – 电感式接近传感器\n\n既然我们已经探究了什么是电感式接近传感器，接下来将研究电容式接近传感器的定义。凭借你从本节获得的知识，你应该能轻松理解。让我们直接开始。\n\
  \n##### 电容式接近传感器\n\n这是一种*非接触式传感器*，可检测粉末、颗粒、液体和固体形式的金属和非金属物体。\n\n电容式传感器的作用类似于电容器。它们利用电容的电气特性，以及基于传感器活性面周围电场变化引起的电容变化。\n\
  \n传感器感应面上的金属板充当电容器的第一个极板，并与内部振荡器电路电气连接。待检测物体充当电容器的第二个极板。\n\n目标与内部传感器极板之间的外部电容构成振荡器电路中反馈电容的一部分。随着目标靠近传感器表面，振荡增加，直到达到阈值电平并激活输出。\n\
  \n下图展示了电容式接近传感器的主要电路：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_73_0.png)\n\n\
  图 2.41 – 电容式接近传感器\n\n下图显示了一个三线电容式传感器。这三根线如下：\n\n- **BN**（棕色）\n- **BK**（黑色）\n- **BU**（蓝色）\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_74_0.png)\n\n图 2.42 – 电容式接近传感器（欧姆龙 E2K-X8ME1）\n\
  \n此图片由 *Showlight Technologies LTD* www.showlight.com.ng 提供。\n\n以下接线图通常出现在三线接近传感器本体上，可能为*NPN*或*PNP*型。对于NPN，电源连接至**BN**和**BU**，负载连接在**BN**和**BK**之间。对于PNP，电源连接至**BN**和**BU**，负载连接在BN和BK之间：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_75_0.png)\n\n图 2.43 – 接近传感器接线图（NPN和PNP）\n\
  \n下图展示了一个简单的接线图，说明如何使用三线接近传感器（NPN）来打开或关闭直流灯：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_75_1.png)\n\
  \n图 2.44 – 使用三线接近传感器（NPN）开关直流灯\n\n另一方面，这里展示了一个简单的接线图，说明如何使用三线接近传感器（PNP）来打开或关闭直流灯：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_76_0.png)\n\n图 2.45 – 使用三线接近传感器（PNP）开关直流灯\n\
  \n现在，让我们看看下一种接近传感器。\n\n##### 光电式\n\n**光电式**传感器由光发射器（*发送器*）、光接收器和支持电路组成。它们通过使用光发射器和接收器来检测物体的存在与否。\n\
  \n发射器将可见或不可见的光束发射到检测接收器。\n\n光电式传感器有三种类型，如下所示：\n\n1. **对射式**：这种传感器中，发射器（发送器）和接收器分别置于独立的外壳中，并相对放置。发送器提供恒定光束；当物体在发送器和接收器之间通过时，遮挡光束即发生检测。下图说明了这一点：\n\
  \n图 2.47 – 回归反射式光电传感器\n\n3. **漫反射式**：这种传感器中，发射器和接收器位于同一外壳中，且朝向相同方向。发射器发出恒定光束，向所有方向漫射，填充检测区域。当目标物体进入该区域时，会将部分光束反射回接收器。目标充当反射器。当光被扰动（或目标）物体反射时，即发生检测。让我们看一下：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_78_0.png)\n\n图 2.48 – 漫反射式光电传感器\n\n下图显示了回归反射式光电传感器的接线。回归反射式接近传感器如今在工业中很常见，适用于远距离检测：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_79_0.png)\n\n图 2.49 – 回归反射式光电传感器接线图\n\
  \n在此接线图中，传感器有五根线，如下：\n\n- BN（棕色）\n- BU（蓝色）\n- WH（白色）\n- BK（黑色）\n- GY（灰色）\n\nBN和BU线连接电源。WH为公共线，将根据传感器输出端子（BK和GY）的需求连接到正极或负极。\n\
  \n当WH连接到正极时，GY处已有正极，当有遮挡物时，BK处会有正极。\n\n当WH连接到负极时，GY处已有负极，当有遮挡物时，BK处会有负极。\n\n\n\n\
  \n以下图示说明了如何通过将公共端（WH）连接到正极，使用传感器自动打开或关闭直流灯：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_80_0.png)\n\
  \n图2.50 – 使用回归反射式光电传感器自动打开或关闭直流灯（WH接正极）\n\n在本节中，你了解了工业中使用的各种接近传感器。你在本节学到的操作原理、符号和简单接线方法将帮助你更好地理解工业自动化。\n\
  \n#### 总结\n\n恭喜你完成本章！现在你应该能够解释开关和传感器，描述手动操作开关及其各种类型，描述机械操作开关及其各种类型，以及描述接近传感器及其各种类型。你还应该能够识别各种开关的符号，并理解它们如何接线以实现控制功能。\n\
