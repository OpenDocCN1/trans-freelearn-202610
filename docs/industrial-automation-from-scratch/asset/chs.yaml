  #### 使用比较指令


  比较指令用于测试来自两个源的两个值之间的关系。


  下表显示了 S7 1200 中可用的比较指令：


  | 比较指令 | 含义 |

  |---|---|

  | CMP == | 等于 |

  | CMP <> | 不等于 |

  | CMP >= | 大于或等于 |

  | CMP <= | 小于或等于 |

  | CMP < | 小于 |

  | CMP > | 大于 |


  表 9.1 – 比较指令及其含义


  我们将在本书中学习如何使用 CMP >。对其他比较指令也适用相同的概念。


