  \n常闭（NC）按钮开关\n\n图2.1 – 常开（NO）和常闭（NC）按钮开关的符号\n\n下图显示了一个NO按钮开关的正面和背面。端子3和端子4用于将开关连接到电路：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_34_2.png)\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_34_3.png)\n\
