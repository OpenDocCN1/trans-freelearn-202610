- "## 第 1 部分：学习入门所需的概念和技能\n\n这是入门部分，您将在其中了解工业自动化的全部内容。您将了解传感器和执行器，并能够识别电气控制元件并学习如何为基本的工业控制操作进行接线。您还将能够使用\
  \ CAD 软件绘制原理图/接线图。\n\n本部分包含以下章节：\n\n- *第 1 章*，工业自动化简介\n- *第 2 章*，开关和传感器 – 工作原理、应用和接线\n\
  - *第 3 章*，执行器及其在工业自动化中的应用\n- *第 4 章*，交流和直流电机的概述\n- *第 5 章*，变频器 VFD 简介\n- *第 6 章*，使用\
  \ CAD 软件绘制原理图/接线图\n\n## 工业自动化简介\n\n制造涉及使用原材料或零件来创建将出售给客户的商品或产品。制造产品可以由人类操作的手工工具或由人类操作的机器如电机、泵和钻头来完成。在机器之前，物品/产品由手工使用工具制作，花费大量时间和精力生产单个物品。制造业的发展导致手工工具被人类操作的机器所取代，从而以最小的努力加快了生产。如今，人类在制造中操作机器的参与度正在通过**工业自动化**减少或被取代。\n\
  \n完成本章后，您应该能够理解什么是工业自动化并识别存在的各种工业自动化类型。您还将能够描述工业自动化的基本层级并识别工业自动化在行业中的好处。最后，您将能够识别工业自动化在社会中的弊端。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 介绍工业自动化\n- 探索工业自动化的类型\n- 理解工业自动化的层级\n- 发现工业自动化的优势和劣势\n\n\
  ### 介绍工业自动化\n\n工业自动化是指使用计算机、机器人和其他控制设备在制造或加工厂中以极少的人为干预来操作机器和设备。\n\n在工厂中建立了一系列顺序操作，其中组件被组装成产品或材料经过精炼过程以生产适合消费的最终产品（即**生产线**或**装配线**）。这通常由需要操作以获得*成品*的机器和工具组成。在工业自动化之前，物品（如马克杯、勺子、锅等）由个人工匠手工制作，制造单个物品可能需要数小时或数天。\n\
  \n18 世纪出现了发展，物品不再手工生产，而是发明了允许机器生产物品的过程。这些机器/工具由人类操作。因此，我们可以将通过此过程生产的物品称为人机制造。该过程与手工方法相比大幅减少了生产时间和成本。制造业的进一步转变是\
  \ 19 世纪引入装配线/生产线，这进一步减少了生产时间和成本，因为不同工人可以在生产线或装配线的不同部分操作不同的机器，从而实现大规模生产。如今，许多工厂的生产线上的机器/工具由设备和控制系统自动操作。重复性任务如填充、封盖和冲压现在已实现自动化。\n\
  \n工厂装配线上的工人用眼睛看、用耳朵听、用大脑思考、用手移动物品或在装配线上执行所需操作。通过工业自动化，工人通常执行的活动/操作可以被控制系统取代，其中传感器执行眼睛和耳朵的工作，控制器执行大脑的工作，而执行器执行手的工作。因此，**传感器**、**控制器**和**执行器**，我们将在本书后续章节中更详细地介绍，可以取代工厂装配线上的工人。在某些制造过程中，需要一百名员工的装配线最终可能只需要一\n\
  \n\n\ntwo people doing that through industrial automation. With the introduction\
  \ of **artificial intelligence (AI)**, machines that can even think like humans\
  \ are being developed to handle human operations that we could not previously even\
  \ imagine being handled by a machine.\n\nIndustrial automation can also be defined\
  \ as being able to control machinery and equipment in an industry by using **personal\
  \ computers (PC)**, **programmable logic controllers (PLCs)**, sensors, actuators,\
  \ and other control devices to minimize the human involvement in the manufacturing\
  \ or production processes. PCs, PLCs, and other forms of controllers replace human\
  \ decision-making; the sensors replace the eyes and ears, while the actuators replace\
  \ the hands, as explained previously. PCs, PLCs and other forms of controllers have\
  \ programs (a set of instructions) written into them that enable them to make decisions\
  \ based on the state of the sensors. The results of these decisions are used by\
  \ the actuator to perform the action that the worker would have done.\n\nThe following\
  \ figure shows an example of industrial automation using a KUKA industrial robot.\
  \ Jobs, which are typically done by humans, are being carried out by robots (programmed\
  \ machines):\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_16_0.png)\n\nFigure 1.1\
  \ – Industrial automation in a vehicle manufacturing assembly line using a KUKA\
  \ industrial robot\n\nThis image is licensed under Wikimedia Commons:\nhttps://creativecommons.org/licenses/by-sa/4.0/deed.en.\n\
  \nBesides manufacturing, the transportation industry is another area where industrial\
  \ automation can be applied, where self-operating vehicles are used for both private\
  \ and commercial purposes – autopilot control in commercial jets enables jets to\
  \ travel without human pilots. Warehouses, buildings, and other industries also\
  \ benefit from industrial automation.\n\nWith that, you have learned that industrial\
  \ automation involves using devices that operate machines automatically with little\
  \ human involvement, which has significantly improved manufacturing and other industries.\
  \ The knowledge you have acquired in this section will help you understand the various\
  \ forms of automation we will look at in the next section.\n\n### Exploring the\
  \ types of industrial automation\n\nVarious types of industrial automation are applied\
  \ in the world today. Industrial automation solutions can fall into any of the following\
  \ four categories:\n\n- Fixed automation system\n- Programmable automation system\n\
  - Flexible automation system\n- Integrated automation system\n\nIn the next few\
  \ sections, you will discover what these categories are in detail. Let's have a\
  \ look.\n\n### Fixed automation system\n\nIn a fixed automation system, the series\
  \ of operations that must be performed on the raw material are fixed. This type\
  \ of automation is used to perform fixed and repetitive operations to achieve high\
  \ production rates. The machines involved are programmed or configured to produce\
  \ a specific design for a product. Once adopted, it is relatively difficult to change\
  \ the design or style of the product. Fixed automation systems are used when the\
  \ same style of product is to be manufactured or assembled. The series of operations\
  \ that are involved in the production or manufacturing process are designed or programmed\
  \ based on the product. This type of automation system is characterized by a high\
  \ production rate, high efficiency, and high initial cost and is suitable for manufacturing\
  \ a large volume of products that will have a low cost per product.\n\nExamples\
  \ of fixed automation systems are as follows:\n\n- Paint and coating automation\
  \ process\n- Automatic assembly machines\n- Bread production lines\n- Steel rolling\
  \ mills\n- Papermills\n- Metal pressing/stamping machines in a vehicle assembly\
  \ line in the automobile industry\n\nLet's have a look at programmable automation\
  \ systems.\n\n### Programmable automation system\n\nIn a programmable automation\
  \ system, the machines involved can be used to manufacture different styles of products.\
  \ However, this requires reprogramming and changeover for each new style of product,\
  \ which takes time to accomplish and creates downtime in production.\n\nThis type\
  \ of automation is suitable for manufacturing where identical or similar styles\
  \ of products are produced within a certain time frame. This is usually referred\
  \ to as **batch production**. A long setup time is required to modify the program\
  \ or reconfigure the sequence of operations for the new product design or batch\
  \ to be manufactured.\n\nExamples of programmable automation systems are as follows:\n\
  \n- **Industrial robot**: This is a type of robot (programmed machine) that's used\
  \ in the manufacturing industry. It consists of a power supply, a controller, and\
  \ a mechanical arm that can move in three or more axes. It can be programmed and\
  \ configured for different kinds of tasks.\n\nThe following figure shows a robot\
  \ designed to be able to do any work that can be programmed (within its limits and\
  \ work envelope) simply by changing the program. Here, the robot was programmed\
  \ for writing:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_19_0.png)\n\nFigure 1.2\
  \ – KUKA industrial robot\n\nThis image is licensed under Wikimedia Commons:\nhttps://creativecommons.org/licenses/by-sa/4.0/deed.en.\n\
  \n- **Computer Numerical Control (CNC) machine**: This is a type of automated machine\
  \ in which geometric code (G-code) and miscellaneous code (M-code), which are alphanumeric,\
  \ form the basic program instructions for different kinds of tasks. This type of\
  \ machine can automate drilling, milling, or 3D printing using a computer or controller.\n\
  \nThe following figure shows a CNC machine (KVR-4020A). This can be used for practically\
  \ any type of application, including manufacturing or production, die-molding, heavy\
  \ and hard milling, and more:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_20_0.png)\n\
  \nFigure 1.3 – CNC vertical machining center (Kent CNC KVR 4020A)\n\nThis image\
  \ is licensed under Wikimedia Commons:\nhttps://creativecommons.org/licenses/by-sa/4.0/deed.en\n\
  \nLet's proceed to learn about flexible automation systems.\n\n### Flexible automation\
  \ system\n\nFlexible automation systems are an advanced form of programmable automation\
  \ systems. They also require reprogramming and changeover for each new style of\
  \ product, but this does not take time to accomplish as it is done in a programmable\
  \ automation system. Hence, a flexible automation system reduces the downtime that's\
  \ experienced in a programmable automation system. The product styles that a flexible\
  \ automation system can produce are sufficiently limited so that the changeover\
  \ can be accomplished very quickly and automatically. A flexible automation system\
  \ allows a different range of products to flow through the line with little downtime.\n\
  \nExamples of flexible automation systems are as follows:\n\n- **Automated guided\
  \ vehicles (AGVs):** AGVs are vehicles without an onboard driver that are used mostly\
  \ to transport materials/goods in a factory or warehouse. They can navigate along\
  \ a pre-defined path using several guidance technologies, which makes it easy for\
  \ them to change routes and expand the operation of the system in response to changes\
  \ to a scalable and flexible material handling solution. AGVs can be used alongside\
  \ an industrial robot to provide a very cost-effective material handling solution\
  \ in a factory or warehouse. The AGV can transport pallets, cartons, and products\
  \ that have been loaded onto it using an industrial robot, and then send them to\
  \ various areas of the manufacturing facility or warehouse.\n\nThe following figure\
  \ shows an example of an AGV:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_22_0.png)\n\
  \nFigure 1.4 – Automated guided vehicle by AIUT\n\nThis image is licensed under\
  \ Wikimedia Commons:\nhttps://creativecommons.org/licenses/by-sa/4.0/deed.en.\n\n\
  - **Flexible Assembly System (FAS)**: A FAS is an assembly system that can produce\
  \ a variety of products in small to medium batches with rapid changeover and reprogramming\
  \ for a new set of product designs or styles.\n\nLet's now have a look at integrated\
  \ automation systems.\n\n### Integrated automation system\n\nAs the name implies,\
  \ an integrated automation system integrates various machines and tools such as\
  \ CAD, robots, cranes, conveyors and other automated machineries to work under a\
  \ single control system to execute an\n\n\n\n生产过程的自动化系统。在此，单独的机器、数据和流程被整合在一起并由单一控制系统控制。它允许整个制造工厂由计算机自动化并控制，减少人工干预。\n\
  \n集成自动化系统用于**计算机集成制造 (CIM)**，其中计算机在很少人工干预的情况下控制整个生产过程。它也用于各种先进的过程自动化系统。集成自动化系统为实施各种先进技术提供了空间，例如自动化物料搬运系统、**射频识别\
  \ (RFID)**、条形码跟踪系统、**制造执行系统 (MES)**、**计算机辅助工艺规划 (CAPP)**、自动化输送机和起重机，以及许多其他技术。\n\n\
  在本节中，您在查看相关示例的同时了解了可用的各种工业自动化类型。这些知识将帮助您更好地理解下一节以及本书中将涵盖的其他主题。\n\n### 理解工业自动化的层级\n\
  \n工业自动化是一个复杂的系统，其中多个设备相互通信和协作以提供所需的结果。描述工业自动化层级/层次结构的最简单方法是使用*三层*表示，如下所示：\n\n- 现场级\n\
  - 控制级\n- 监督和生产级\n\n我们将在下一节中描述这些层级中的每一个，并提供相关示例以便于理解。\n\n#### 现场级\n\n这是工业自动化层次结构中最低的层级。它由现场设备组成，例如传感器和执行器，用于工业自动化。传感器将物理特性转换为电信号（数字或模拟）。它们是输入设备，可以被称为自动化的眼睛和耳朵。传感器的示例包括**接近传感器**、**温度传感器**、**压力传感器**、**液位传感器**、**流量传感器**和**限位开关**。另一方面，执行器将电信号（数字或模拟输出信号）转换为物理特性，可以表现为运动。示例包括**交流/直流电机**、**伺服电机**、**步进电机**、**泵**、**控制阀**、**电磁阀**、**接触器**和**继电器**。现场设备（传感器和执行器）的工作是将机器和过程数据传输到下一级（控制级）以进行*监控*和*分析*。\n\
  \n该层级可以称为工业自动化系统的眼睛和手臂（手）。传感器充当眼睛，而执行器充当手臂。实时过程参数如温度、压力、液位和流量由传感器转换为电信号。从传感器收集的数据被传输到控制器以进行进一步监控和分析。执行器通过来自控制器的信号控制过程参数。\n\
  \n#### 控制级\n\n该层级由**可编程逻辑控制器 (PLC)** 或其他形式的控制器组成。PLC 是现代工业自动化的大脑。它们用于在工业中执行控制功能。它们从不同类型的传感器获取数据，使用写入其中的程序做出决策，并输出执行器将用于执行所需任务的控制信号。它们可以根据从传感器接收到的信号编程以提供自动控制功能。有关\
  \ PLC 的更多详细信息将在*第 7 章，理解 PLC 硬件和布线*，以及*第 8 章，理解 PLC 软件和 TIA Portal 编程*中提供。\n\n####\
  \ 监督和生产级\n\n该层级由**监控控制与数据采集 (SCADA)** 和**人机界面 (HMI)** 等组成，用于监控和控制各种参数并设定生产目标。*第\
  \ 10 章，理解人机界面 (HMI)* 解释了 HMI，而*第 11 章，探索监控控制与数据采集 (SCADA)* 解释了 SCADA。\n\n为了帮助您更好地理解\
  \ HMI 和 SCADA，本书安排在深入 HMI 和 SCADA 之前先介绍一些工业自动化的基础知识。\n\n下图表示工业自动化的基本层级：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_25_0.png)\n\
  \n图 1.5 – 工业自动化的层级/层次结构\n\n在本节中，您了解了工业自动化的基本层级，包括现场级、控制级和监督与生产级。第 2 章，开关和传感器 – 工作原理、应用和布线，以及第\
  \ 3 章，执行器及其在工业自动化中的应用，将对现场级进行更详细的解释。第 7 章，理解 PLC 硬件和布线，第 8 章，使用 TIA Portal 理解 PLC\
  \ 软件和编程，以及第 9 章，使用 TIA Portal 深入 PLC 编程，将以实践方法对控制级进行详细解释，而第 11 章，探索监控控制与数据采集 (SCADA)，将进一步解释监督和生产级，并包括一个动手项目/实践项目（使用\
  \ mySCADA 软件将 SCADA 与 S7-1200 PLC 接口），这将为您提供实践经验和对该概念的理解。\n\n### 发现工业自动化的优势和劣势\n\
  \n毫无疑问，工业自动化通过使事情更快、更好完成而改变了制造业和其他行业。任何行业要保持竞争力都需要工业自动化。虽然自动化在制造业和其他行业带来了巨大改进，但工业自动化的一些负面影响需要被关注，以便您做好准备并具备克服它们的能力。\n\
  \n在以下各节中，我们将发现这些优势和劣势是什么。\n\n#### 工业自动化的优势\n\n让我们看看人们如何（或确实）从工业自动化中受益：\n\n- 它减少了从开始到完成一个过程所需的时间。\n\
  - 它改善了工人的安全。自动化使工人免于暴露于工厂的有害环境中。\n- 工业自动化中使用机器人提高了生产产量。机器人可以 24/7 以恒定速度工作。\n- 工业自动化降低了运营成本。将自动化机器添加到操作中意味着更少的人力（即完成工作所需的员工更少）。此外，由于机器人在执行任务时的准确性，材料浪费也会减少。\n\
  - 工业自动化由于处理时间减少、运营成本降低、生产产量增加等原因提供了更快的**投资回报率 (ROI)**。\n- 使用**自动导引车 (AGV)** 和其他自动化机械在制造业中减少了本应由人为错误造成的事故。\n\
  - 工业自动化使管理人员能够更专注于工作的其他方面，因为机器人/自动化系统需要较少的监督。\n- 自动化系统/机器人工作时不会分心、疲惫或感到无聊，因此消除了延误，可以预期一致的性能。\n\
  \n#### 工业自动化的劣势\n\n通过工业自动化使人类摆脱某些活动是一件好事；然而，这威胁到人类劳动力。\n\n以下是工业自动化的一些劣势：\n\n+  \
