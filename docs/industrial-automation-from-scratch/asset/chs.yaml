- "### Understanding PLC Software and Programming with TIA Portal\n\nIn the previous\
  \ chapter, we learned about the hardware part of the **Programmable Logic Controller\
  \ (PLC)**, which includes wiring the PLC to sensors and actuators. A PLC wired to\
  \ switches, sensors, and actuators will do nothing unless there is a program written\
  \ into it. A program (a set of instructions written using a programming language)\
  \ is required for the CPU of the PLC to make decisions based on the inputs and carry\
  \ out the required control function. It is important for an industrial automation\
  \ engineer to have knowledge of both the hardware part of the PLC, including the\
  \ wiring, and the software part, which includes programming.\n\nThis chapter focuses\
  \ on the software aspect of the PLC. You will learn the basic things you need to\
  \ start programming PLCs with the most common PLC programming language, **Ladder\
  \ Diagram (LD)**. You will learn how to download, install, and use **Totally Integrated\
  \ Automation Portal (TIA Portal)**, powerful software for programming Siemens PLCs.\n\
  \nWe are going to cover the following main topics in this chapter:\n\n- Understanding\
  \ software/program in PLCs\n- Introducing PLC programming languages\n- Introducing\
  \ PLC programming devices\n- Understanding the basics of LD\n- Downloading and installing\
  \ TIA Portal V13 Professional and PLCSIM\n- Creating a project and writing a program\
  \ with Siemens programming software (TIA Portal)\n\n#### Technical requirements\n\
  \nWhile every part of this book is valuable, *[Chapter 2, Switches and Sensors –\
  \ Working Principles, Applications, and Wiring](#)*, *[Chapter 3, Actuators and\
  \ Their Applications in Industrial Automation](#)*, and *[Chapter 7, Understanding\
  \ PLC Hardware and Wiring](#)*, are very important to have a better understanding\
  \ of this chapter.\n\n#### Understanding software/program in PLCs\n\nBefore looking\
  \ into PLC programming languages, let's get some knowledge of the software/program\
  \ in PLCs.\n\nIn computing, generally, software is a set of instructions written\
  \ in a language the computer understands to perform a task. Software can also be\
  \ referred to as a program.\n\nA PLC requires two types of software that must be\
  \ executed by the CPU for the PLC to function. They are as follows:\n\n- The operating\
  \ system (firmware)\n- User program\n\nThe operating system is the program written\
  \ by the PLC manufacturers and designed to run automatically in the PLC once powered.\
  \ It is responsible for executing the user program, establishing communication between\
  \ devices, memory management, and updating the output.\n\nA PLC user program is\
  \ a set of instructions in either textual or graphical form that represents the\
  \ control function that will be carried out for a specific industrial task or application.\
  \ It is the program that the user or PLC programmer writes to dictate the required\
  \ automation or control task to the PLC.\n\nA programming language is usually used\
  \ to convey instructions to a PLC or any other computing device to perform a specific\
  \ task. Let's have a look at\n\nPLC programming languages in the next section.\n\
  \n#### Introducing PLC programming languages\n\nAccording to **International Electrotechnical\
  \ Commission (IEC)** standards, there are five programming languages, stated in\
  \ part 3 of IEC 61131, for writing a program for PLCs to control and automate a\
  \ task. These programming languages are the following:\n\n- Ladder Diagram (LD)\n\
  - Function Block Diagram (FBD)\n- Sequential Function Chart (SFC)\n- Instruction\
  \ List (IL)\n- Structured Text (ST)\n\nIEC 61131-3 can be purchased at their web\
  \ store at the following link. However, there is an abstract you can read and also\
  \ a preview that can be downloaded for free:\n\nhttps://webstore.iec.ch/publication/4552\n\
  \nNote\n\nIEC is an international standards organization responsible for preparing\
  \ and publishing international standards for all electrical, electronics, and other\
  \ related technologies.\n\nLet's discuss each of these programming languages in\
  \ detail.\n\n#### Ladder Diagram (LD)\n\n\n\n\n\n这在几种 PLC 编程语言中最为常见。这是一种图形化编程语言，大多数现场技术人员很容易理解，因为它与他们熟悉的继电器图相似。**常开\
  \ (NO)** 或 **常闭 (NC)** 触点用作输入。根据对输入执行的逻辑，特定的输出将被激活。\n\n下图显示了使用 LD 的简单与逻辑程序。仅当输入\
  \ 1 和输入 2 都为真（ON）时，输出 1 才会激活：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_266_0.png)\n\
  \n图 8.1 – 使用 LD 的简单与逻辑程序\n\n下图显示了使用 LD 的简单或逻辑程序。当输入 1 或输入 2 或输入 1 和输入 2 都为真（ON）时，输出\
  \ 1 才会激活：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_266_1.png)\n\n图 8.2 – 使用 LD\
  \ 的简单或逻辑程序\n\n下图显示了一个结合了与逻辑和或逻辑的程序。如果输入 1 或输入 2 为真且输入 3 为真（ON），则输出 1 将被激活：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_267_0.png)\n\
  \n图 8.3 – 一个结合了与逻辑和或逻辑的程序\n\n让我们了解一下 FBD 的样子。\n\n#### 功能块图 (FBD)\n\n这是一种图形化语言，其中程序元素以块的形式表示并连接在一起。包含多行代码的函数被表示为一个块，多个块可以在程序中连接在一起。\n\
  \n下图显示了使用 FBD 的简单与逻辑程序。仅当输入 1 和输入 2 都为真（ON）时，输出 1 才会激活：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_268_0.png)\n\
  \n图 8.4 – 使用 FBD 的简单与逻辑程序\n\n下图显示了使用 FBD 的简单或逻辑程序。当输入 1 或输入 2 或输入 1 和输入 2 都为真（ON）时，输出\
  \ 1 才会激活：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_268_1.png)\n\n图 8.5 – 使用 FBD\
  \ 的简单或逻辑程序\n\n下图显示了一个结合了与逻辑和或逻辑的程序。如果输入 1 或输入 2 为真且输入 3 为真（ON），则输出 1 将被激活：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_269_0.png)\n\
  \n图 8.6 – 一个结合了与逻辑和或逻辑的程序\n\n我们现在将简要讨论我们列表中的下一个编程语言。\n\n#### 指令表 (IL)\n\n这是一种基于文本的语言，类似于汇编语言。指令系列就像汇编语言一样列出。使用\
  \ IL 编写的程序比 IEC 为 PLC 编程定义的其它编程语言处理得更快。这种编程语言的一个缺点是调试大型或复杂程序很困难。\n\n以下是使用 IL 编写的示例程序。如果输入\
  \ A 或输入 B 为真（ON）且输入 C 为真（ON），则输出 Y 将被激活：\n\n```\nLD  A\nOR  B\nAND C\nOUT Y\nEND\n\
  ```\n\n让我们现在继续下一个语言。\n\n#### 结构化文本 (ST)\n\nST 也是一种基于文本的语言，其结构类似于传统的编程语言，如 C、C++、Python\
  \ 和 Java。它提供了使用 `if`、`while` 和 `for` 等语句处理输入和输出的可能性，这些语句在传统编程语言中很常见。与 LD 或其它一些编程语言相比，复杂算法在\
  \ ST 中更容易实现。ST 的一个缺点是程序员在调试时可能遇到的困难。以下代码块显示了使用 ST 编写的简单程序：\n\n```\n```st\nVAR\n\
  \        PushButton1: BOOL;\n        PilotLamp1: BOOL;\nEND_VAR\nIF PushButton1\
  \ = TRUE THEN\n        PilotLamp1 := TRUE\n        ELSE\n                PilotLamp1;\n\
  \        END_IF\nEND_IF\n```\n```\n\n最后，从我们列出的编程语言中，我们将查看 SFC。\n\n#### 顺序功能图 (SFC)\n\
  \n这也是一种图形化编程语言，类似于计算机科学中使用的常规流程图。使用了步骤/状态和转换。单独的步骤（矩形框）描述要执行的操作或动作，并通过垂直线按顺序连接。每个步骤之间都存在转换条件（必须为真才能继续的逻辑语句），如下图所示。使用\
  \ SFC 可以轻松地可视化和设计复杂的顺序任务：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_271_0.png)\n\
  \n图 8.7 – 使用 SFC 的示例程序\n\n在前面的图中，S1、S2 和 S3 表示步骤，而 T1、T2 和 T3 表示转换。\n\n我们现在应该能够区分\
  \ PLC 编程语言（LD、FBD、ST、IL 和 SFC）。刚刚结束的部分，即 *介绍 PLC 编程语言*，并不是要让你成为使用全部五种语言的 PLC 程序员；其目的只是让你对编程语言有一个简要的了解，并能够区分它们。如本章前面所述，我们将重点关注\
  \ LD，这将在后续章节中介绍。我们将在下一节中先快速了解一下 PLC 编程设备。\n\n#### 介绍 PLC 编程设备\n\n这些是用于编写、编辑和将程序传输到\
  \ PLC 的设备或工具。它们也可以用于从 PLC 读取程序。因此，编程设备可用于下载（写入）或上传（读取）程序。术语下载或写入是指将程序从编程设备传输到 PLC，而术语上传或读取是指将程序从\
  \ PLC 传输到编程设备。编程设备还可以帮助排除 PLC 故障。有两种常见的编程设备：\n\n- 手持设备\n- 个人计算机（PC）\n\n**手持设备**通常通过电缆连接到\
  \ PLC。它们由用于输入程序、编辑程序、将程序下载到 PLC 或从 PLC 上传程序的按键组成。它们还包括用于查看指令的小显示屏。它们体积小，功能有限。\n\n\
  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_275_0.png)\n\n图 8.8 — 一个继电器逻辑电路\n\n在第一级，当按下按钮\
  \ 1 时，灯 1 将亮起，当释放按钮 1 时，灯 1 将熄灭。\n\n在第二级，必须同时按下按钮 2 和按钮 3 才能使灯 2 亮起。当任一按钮释放时，灯将熄灭。\n\
  \n第三级是一个自锁电路，当按下按钮 4 时会使继电器线圈（CR1）通电。即使按钮释放，线圈仍保持通电。线圈保持通电的原因是继电器线圈（CR1）的常开触点与按钮\
  \ 4 并联。因此，当按钮被按下时，线圈（CR1）被通电，其触点闭合。CR1 的闭合触点（与按钮 4 并联）为电流流向线圈提供了替代路径。因此，线圈保持通电。按钮\
  \ 5 是一个停止按钮（常闭），按下时会切断流向线圈的电流，线圈将被断电，直到按下按钮 4。\n\nLD，我们将在本节和后续章节中学习，与继电器逻辑电路相似。这就是为什么大多数技术人员发现它很容易理解和操作的原因。但与使用如前图所示的组件符号的继电器逻辑电路不同，LD\
  \ 使用符号表示法来表达逻辑操作。以下屏幕截图显示了使用西门子编程软件的前述电路的 LD：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_277_0.png)\n\
  \n图 8.9 – 使用西门子编程软件的 LD\n\n下图显示了如何将按钮连接到 PLC 以使程序按要求运行。实际上，使用 PLC 和 LD 来实现 *图 8.8*\
  \ 中的继电器逻辑电路并不经济。这里使用 PLC 和 LD 实现这种简单逻辑的原因是为了帮助理解并让你看到继电器逻辑电路与 LD 编程语言之间的关系：\n\n\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_278_0.png)\n\nFigure 8.10 – Push buttons,\
  \ pilot lamps, and control relay wired to a PLC (S7-1200, CPU1211C, AC/DC/Rly)\n\
  \n我们现在应该已经对 LD 有了基本了解。后续章节将提供进一步的知识，帮助你开始使用 LD 编程 PLC。\n\n#### Exploring the elements\
  \ of LD (ladder logic) program\n\n要使用 LD 编写程序。你需要了解构成梯形图程序的元素。以下元素构成 LD（梯形逻辑）程序：\n\
  \n- Rails: 这是两条垂直线，一条在最左侧（热轨），另一条在最右侧。最左侧的垂直线称为热轨，而最右侧的可以称为中性线。\n- Rungs: 这些是连接两条导轨以完成电路的水平线。电功率从热轨流向中性轨。它将导轨连接到逻辑表达式。\n\
  - Inputs: 输入是表示连接到 PLC 的输入设备的常开和常闭触点符号，例如按钮、选择开关、限位开关或浮球开关。连接到 PLC 的输入设备的状态决定了程序中常开或常闭触点符号是打开还是关闭。\n\
  - Output: 输出是表示连接到 PLC 的输出设备的线圈符号，例如指示灯、继电器、接触器或电磁阀。\n- Logic expression: 这是输入和输出符号的组合，用于形成所需的控制功能。\n\
  - Address notation and tag names: PLC 使用地址来标识每个输入和输出点，其中外部设备（输入和输出设备）连接到 PLC。你连接每个输入设备或输出设备的点都有一个地址，PLC\
  \ 用它来识别它。PLC 还使用地址来标识内部/软件创建的设备，例如继电器、定时器和计数器。每个制造商用于标识其 PLC 中的输入/输出（输入/输出点）和软件创建设备的地址使用不同。在编程特定\
  \ PLC 制造商或 PLC 型号之前，程序员需要知道其使用的寻址或地址表示法。\n\n例如，西门子使用 I 表示输入，Q 表示输出。我们基本上可以将输入作为\
  \ I0.0、I0.1、I0.2 等，输出作为 Q0.0、Q0.1、Q0.2、Q0.3 等。西门子中的软件创建继电器/辅助继电器为 M0.0、M0.1、M0.2\
  \ 等。三菱使用 X 表示输入，Y 表示输出。我们基本上可以将输入作为 X000、X001、X002 等，输出作为 Y000、Y001、Y002 等。三菱 PLC\
  \ 中的软件创建继电器/辅助继电器为 M0、M1、M2 等。然而，本书的重点将是西门子 PLC（S7 1200 CPU 1211C AC/DC/RLY）。地址表示法只是对每个输入/输出（输入或输出点）和软件创建设备，例如继电器、定时器和计数器，而标签名称是对地址的描述。\n\
  \nS7 1200（CPU 1211C AC/DC/RLY）有六个数字输入和四个数字输出，可以在程序中如下寻址：\n\n- Inputs: `I0.0, I0.1,\
  \ I0.2, I0.3, I0.4, I0.5`\n- Outputs: `Q0.0, Q0.1, Q0.2, Q0.3`\n\n你可以在 PLC 或 PLC\
  \ 型号的手册中找到其输入/输出寻址。务必阅读你想要编程的任何 PLC 的文档/手册。\n\n- Comments: 注释用于描述 LD 中某一横档或一组横档将执行的逻辑操作。它们通常显示在每个横档的开头。它们使程序易于理解。\n\
  \n下图显示了带标签的示例 LD：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_281_0.png)\n\nFigure\
  \ 8.11 – LD with labels\n\n我们现在将学习使用 LD 编程 PLC 的规则。\n\n#### Rules for LD programming\n\
  \n以下规则将有助于使用 LD 编写良好的程序：\n\n- Inputs (NO contact and NC contact) can be connected\
  \ in parallel or series in LD:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_283_0.png)\n\
  \nFigure 8.13 – Outputs (coils) connected in parallel\n\n- One input can be used\
  \ several times in one program; that is, a single input can be used in a different\
  \ rung:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_284_0.png)\n\nFigure 8.14 –\
  \ Same input is used in rung 1 and rung 2\n\n一个输出不能在一个程序中被多次使用，除非在置位/复位和锁存/解锁程序中：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_284_1.png)\n\nFigure 8.15 – One output\
  \ used twice for set/reset in a Siemens PLC program\n\n下图显示了 Allen-Bradley PLC 程序中的一个简单的锁存和解锁程序：\n\
  \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_285_0.png)\n\nFigure 8.16 – One output\
  \ used twice for latch/unlatch in an Allen-Bradley PLC program\n\n- The address\
  \ of an output (coil) can be used for input (NC or NO contact). You can use the\
  \ address of an output (coil) for an input (NC or NO contact), which makes the input\
  \ have the same logic state (1 or 0) as the output; that is, if the output is ON\
  \ (1), the input will be HIGH (1), and if the output is OFF, the input will be LOW\
  \ (0).\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_286_0.png)\n\nFigure 8.17 – Sample\
  \ program showing output address used as input address\n\n> The address of an input\
  \ cannot be used for output. Don't make the mistake of using an input address for\
  \ output (coil).\n\n我们现在应该知道 LD 编程的规则。这些规则将在后续章节中使用 LD 编写程序时应用。我们将继续下一节学习如何下载和安装编程软件以及模拟器。\n\
