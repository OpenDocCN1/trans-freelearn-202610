  \n2. 在 Symbol Menu 对话框中查找并选择所需的符号，然后点击 OK。\n\n   符号将与十字光标一起出现在工作区中，如以下屏幕截图所示：\n\n\
  \   图 6.17 – 带十字光标的符号\n\n3. 点击您想要放置符号的位置。\n\n   组件数据对话框将会出现：\n\n   图 6.18 – 组件数据对话框\n\
  \n4. 在 Name 框中输入元件名称。您只需点击问号即可在 Name 框中的字母后添加下一个可用数字。\n\n5. 点击 **OK**。\n\n   符号将出现在工作区中。您可以通过重复步骤\
