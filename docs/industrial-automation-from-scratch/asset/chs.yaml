- "### 探索监控与数据采集（SCADA）\n\n在上一章中，我们学习了如何通过人机界面（HMI）来监控和控制一台机器。HMI 总是靠近机器或可编程逻辑控制器（PLC）——也就是说，HMI\
  \ 始终位于机器本地，其主要目的是控制单台机器/PLC。在本章中，我们将学习监控与数据采集（SCADA），它同样提供监控和控制手段，同时还具备报警、趋势和日志记录等其他功能。然而，用于监控、控制或其他功能的屏幕或\
  \ PC 可以位于远程位置——即远离机器——并且与 HMI 不同，我们可以为一个位于不同远程位置的多台机器配置一个 SCADA。SCADA 是工业自动化中一个有趣且高级的方面。\n\
  \n本章我们将涵盖以下主要主题：\n\n- 介绍 SCADA\n- 理解 SCADA 的功能\n- 探索 SCADA 的应用\n- 概述 SCADA 硬件\n\
  - 概述 SCADA 软件\n- 下载并安装 mySCADA\n- 使用 mySCADA 软件将 SCADA 与 S7-1200 PLC 接口连接（一个实践项目）\n\
  \n#### 介绍 SCADA\n\nSCADA 是一个由多种硬件和软件组成的系统，这些硬件和软件协同工作，用于监控和控制工业过程中的机器。\n\n监控控制是指对多个独立\
  \ PLC 或多个控制回路进行高层次的总体控制。\n\n数据采集是指从过程中收集信息和数据，并进行实时分析。实时数据收集有助于降低运营成本、监控整个流程并提高效率。\n\
  \nSCADA 系统有助于收集、分析和可视化来自设备或机器的数据，并提供从中央位置（可以是本地或远程，即靠近机器或远离机器）控制设备或机器的手段。\n\nSCADA\
  \ 通常用于监控和控制地理上分散的机器或设备。下图显示了一个简单的 SCADA 系统：\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_436_0.png)\n\
  \n图 11.1 – 一个显示 SCADA 硬件的简单 SCADA 系统\n\n一台生产机器可以位于一个地理区域（位置 A），而另一台机器可以位于不同的地理区域（位置\
  \ B）。如果为这两台生产机器部署了 SCADA 系统，我们就可以从一个中心位置监控两台机器的状态，并控制其中任意一台。SCADA 基本上通过获取系统或机器的数据来实现对其的控制。您想要监控和控制的系统或机器可以是水处理厂、发电厂、配电系统或任何其他设施。\n\
  \n#### 理解 SCADA 的功能\n\nSCADA 的含义本身已经暗示了其主要功能。下面详细说明 SCADA 系统的作用：\n\n- 它可以在本地或远程控制工业过程。开机或关机、增大或减小设定点等是\
  \ SCADA 系统可以编程执行的控制功能。\n- 它从现场或机器收集数据（获取实时数据），为操作员或工艺工程师提供状态指示器以进行监控。\n- 它使工艺工程师能够鸟瞰整个工厂，该工厂可能包含位于不同地理位置的各种机器/设备。\n\
  - 当过程中出现异常情况时，它会生成报警。当过程出现问题时，它可以触发报警，形式可以是声音、灯光、电子邮件、短信或其他形式。\n- 它记录事件（数据日志）。\n\
  \n接下来，让我们来看看 SCADA 的应用。\n\n#### 探索 SCADA 的应用\n\n以下是 SCADA 的一些应用：\n\n- **水处理厂**：SCADA\
  \ 有助于监控水库水位、泵运行、水流量等多项指标，并有助于控制工厂中的泵和其他设备。\n- **发电与配电**：SCADA 系统有助于监控和控制发电与配电网络。SCADA\
  \ 可以监控变电站中的各种设备，还可以向远程位置的设备发送信号，以开启或关闭断路器。\n- **制造业**：SCADA 控制用于制造各种商品的工业自动化设备，同时监控制造过程。\n\
  - **楼宇与设施管理**：设施管理人员使用 SCADA 来监控和控制照明、**暖通空调（HVAC）**等。\n- **交通信号灯**：SCADA 用于监控交通信号灯，例如故障检测、错误信号等，还可用于控制交通流量。\n\
  \n在下一节中，我们将讨论 SCADA 的硬件组件。\n\n#### 概述 SCADA 硬件\n\nSCADA 系统的硬件组件包括以下内容：\n\n- **现场设备**：这些是直接连接到机器或工厂的传感器、变送器和执行器，它们生成用于监控的数字或模拟信号。传感器或变送器用于监控机器状态或参数，而执行器用于对设备或机器执行控制操作。\n\
  - **远程站**：可以是 PLC 或**远程终端单元（RTU）**。它安装在被监控或控制的机器或设备所在的远程站点。现场设备（传感器、变送器和执行器）连接到远程站（PLC\
  \ 或 RTU），以便通过网络在远程站点的主机上进行监控和控制。它通过与其连接的传感器收集数据，并通过网络将数据传输到主机。它还将来自主机的电控信号传输到与其连接的执行器，以执行所需的控制操作。\n\
  \n通信网络：SCADA 中通信网络的主要目的是将远程站（PLC 或 RTU）连接到主机（主站）。它允许信息在 SCADA 系统中流动。SCADA 系统的通信介质可以是有线的或无线的。常见的有线介质是以太网。SCADA\
  \ 系统可以使用各种网络拓扑（星型、总线型、环型等），也可以使用各种网络协议（Profinet、Modbus、Profibus 等）。有关网络拓扑和网络协议的更多细节将在第\
  \ 13 章《工业网络与通信协议基础》中介绍。\n\n主站：也可以称为监控站。它是运行 SCADA 软件的主计算机，提供系统的图形化展示。它运行 HMI 应用程序，提供开关、传感器、变送器、泵等的图形化视图，用于监控和控制。报警可以设置为在不同的预设值处激活。通过主站上的\
  \ GUI，可以监控和控制各个工厂站点的整个控制系统。单台计算机可以配置为主站，也可以联网到工作站或多台服务器。在将多台服务器用作主站的 SCADA 系统中，其中一台服务器可以专用于报警管理系统（AMS），这可以称为\
  \ AMS 控制台。AMS 控制台由 AMS 软件组成，该软件提供工厂各个区域报警的概览，使工厂出现异常情况时能够快速响应等。\n\n基本上，主站从远程站（PLC\
  \ 或 RTU）收集信息，将这些信息显示在 GUI 上以便于解读，生成报警，并为可在远程站点执行的各种控制操作提供接口。\n\n\n\n\n\n图 11.1 说明了一个简单的\
  \ SCADA 系统，展示了本节中解释的各种 SCADA 硬件组件。接下来，我们将了解可用于创建 SCADA GUI 的不同软件。\n\n#### SCADA\
  \ 软件\n\n这是可用于创建所需界面（GUI）的软件，以监控和控制工业设备并执行所有必要的配置。它通常安装在中央主机计算机上，在该计算机上进行监控和控制操作。\n\
  \n常见的 SCADA 软件包括以下内容：\n\n- WinCC by Siemens\n- FactoryTalk View by Rockwell Automation\n\
  - InTouch by Wonderware\n- iFix by General Electric\n- Citect SCADA by Schneider\n\
  - mySCADA\n\n我们将在本章中使用上述其中一种 SCADA 软件（mySCADA）来学习 SCADA 的工作原理，并了解其基本配置和简单系统的接线。\n\
  \n**mySCADA** 是一款功能强大的 SCADA 软件，可在 Microsoft Windows、macOS 和 Linux 上运行。它支持各种 PLC，包括\
  \ S7-1200、S7-1500、S7-300、S7-400、ControlLogix、CompactLogix、Micrologix 1200、Micrologix\
  \ 1400、Micrologix 1500、SLC 500、PLC 5、Omron PLCs 和 Melsec-Q。\n\n它基本上由两部分软件组成（myDESIGNER\
  \ 和 myPRO）。myDESIGNER 是一个开发平台，可用于创建屏幕/可视化并执行适合您应用的所有必要配置，而 myPRO 允许可视化。您可以通过 myPRO\
  \ 查看您的 SCADA 以控制和监控您的设备。它可在常见浏览器上运行，包括 Microsoft Internet Explorer IE（版本 9 及以上）、Microsoft\
  \ Edge、Chrome、Firefox 和 Safari。\n\n在下一节中，我们将了解如何在系统上下载和安装 mySCADA 软件。\n\n#### 下载和安装\
