  ##### 倒计数（CTD）


  倒计数指令将在其输入被触发时（0 到 1）每次倒计数或减少 1；例如，当按钮被按下并释放或当传感器被激活和停用时。计数器的输出


  将在计数器的当前值等于零时被通电（从预设值倒计数）。


