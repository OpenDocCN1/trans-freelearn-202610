  \ 利用加压空气或气体作为能量或动力源来产生旋转或直线运动。\n\n4. 交流电机的两个主要部分是 ____________ 和 ____________。\n\
  \n5. ____________ 使用加压液压油（油）作为能量源，为高力和坚固的应用产生旋转或直线运动。\n\n6. 图 3.27 中的符号表示 ____________。\n\
