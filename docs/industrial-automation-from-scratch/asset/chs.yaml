  #### 使用 PLC 进行液位控制


  下图显示了可在工业中使用的液位控制：


  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_356_0.png)


  图 9.49 – 液位控制


  该罐有两个液位传感器（高液位传感器和低液位传感器）。低液位传感器连接到 I0.2，而高液位传感器连接到 I0.3。连接到 Q0.0 的泵通过接触器向罐供应液体。启动按钮（常开）连接到
  I0.0，而停止按钮（常闭）连接到 I0.1。泵 ON 指示灯连接到 Q0.1。手动排放阀用于在需要时排放液体。


  当启动按钮被按下并释放并且罐中没有液体时，也就是说低液位传感器无法检测到液体，泵应开始运行直到液体充满罐，也就是说高液位传感器检测到液体。


  当手动排放阀打开并且液体低于高液位传感器时，泵不应启动直到液体低于低液位传感器。


  无论何时按下停止按钮，泵都应停止运行。指示灯应指示泵是否正在运行。


  ###### 注意


  此处使用的液位传感器是振动叉式液位传感器。它是一种液位传感器类型，其中调谐叉在未接触材料（液体、自由流动固体、颗粒或粉末）时以其固有频率振动或振荡，当接触材料时其频率发生变化并给出可馈送到
  PLC 作为输入的输出信号。


  程序可以按如下方式编写：


  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_357_0.png)


  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_357_1.png)


  图 9.50 – 使用梯形图进行液位控制程序


  不同网络的解释如下：


  - **网络 1：** 当连接到 I0.0 的启动按钮被按下时，程序中的 I0.0 将闭合，并且由于连接到 I0.1 的停止按钮是常闭的，程序中的 I0.1 将闭合，从而使线圈
  M0.0 通电。当启动按钮释放时，线圈 M0.0 将保持通电，因为与 I0.0 并联的具有相同地址 M0.0 的常开按钮。当停止按钮被按下时，程序中地址为 I0.1
  的常闭触点将被打开并且地址为 M0.0 的线圈将被断电。

  - **网络 2：** 当 M0.0 被通电（由于启动按钮被按下并释放）并且低液位传感器未检测到任何液体时，地址为 I0.2 的常闭触点闭合，并且由于 M0.1
  是常闭触点，Q0.0 将被通电并且泵将开始运行以向罐供应水。与常闭触点并联的地址为 I0.2 的常开触点



  地址为 I0.2 的触点会为信号流向线圈（Q0.0）创建一条替代路径，从而即使低液位传感器已检测到液体而高液位传感器尚未检测到液体，也能保持泵继续运行。


  - **网络3：** 当 M0.0 得电（因按下并松开启动按钮）且低液位和高液位传感器均未检测到液体时，程序中地址为 I0.2 和 I0.3 的常开触点将断开，M0.1
  将失电，泵继续运行。M0.1 在第2梯级（网络2）中用于在得电时使泵停止。当第3梯级（网络3）中的地址 M0.1 得电时，第2梯级（网络2）中地址为 M0.1
  的常开触点将断开，这将使泵停止运行。这将在水箱满时发生。


  与 I0.3 并联的地址为 M0.1 的常开触点用于在手动排放阀打开且水箱水位逐渐下降时为信号流向 M0.1 创建一条替代路径。随着水位下降，当水位低于高液位传感器时，地址为
  I0.3 的常开触点（在水满时曾闭合）将断开。由于我们不希望 M0.1 失电而导致泵立即启动（换句话说，我们希望当液位低于高液位和低液位传感器时再启动），因此使用地址
  M0.1 保持线圈 M0.1 得电，以便泵保持关闭，直到液位低于地址为 I0.2 的低液位传感器。回想操作过程：当手动排放阀打开且液位低于高液位传感器时，泵不应启动，直到液位低于低液位传感器。


  - **网络4：** 该梯级负责泵运行指示灯。使用与泵线圈地址相同的常开触点（即 Q0.0）作为输入，而地址为 Q0.1 的线圈用于梯级的输出部分。只要 Q0.0
  得电（泵要运行必须满足此条件），地址为 Q0.0 的常开触点将闭合，Q0.1 将得电。


  > 因此，只要泵在运行，连接到 Q0.1 的指示灯就会亮起。


  我们刚刚学习了工业中可用的简单液位控制。这些知识有助于开发更高级的液位控制。下一节我们将看到一个使用 PLC 的自动灌装、压盖和包装系统。


  #### 使用 PLC 的自动灌装、压盖和包装系统


  ![](img/b10cb271ed113c7ba5bfded0a75d13e0_359_0.png)


  图9.51 – 灌装、压盖和包装


  启动按钮（常开）连接到 I0.0，停止按钮（常闭）连接到 I0.1。输送电机连接到 Q0.0，灌装阀连接到 Q0.1，压盖机连接到 Q0.2，包装机连接到 Q0.3。灌装位置传感器连接到
  I0.2，瓶盖位置传感器连接到 I0.3，而出料传感器连接到 I0.4，如前面的图所示。


  当启动按钮被按下并松开时，输送电机应开始运行，直到瓶子到达灌装位置传感器；换句话说，灌装位置传感器检测到瓶子后，输送电机停止。


  输送电机在灌装传感器处停止后，灌装阀应立即打开 10 秒以灌装瓶子。10 秒后，阀门应关闭，输送电机应继续运行，直到瓶子到达瓶盖位置传感器；换句话说，瓶盖位置传感器检测到瓶子后，输送电机停止。


  输送电机在瓶盖传感器处停止后，压盖机应立即启动 4 秒以压盖。4 秒后，压盖机应停止，输送电机继续运行。


  当瓶子到达出料传感器时，计数器应加 1，瓶子应掉落到包装机中。当出料传感器检测到的瓶子数量达到 6，即计数器递增到 6 时，包装机应开始包装这 6 个瓶子，并在
  5 秒后停止。


