  mA 输出的变送器连接到真实 PLC 的模拟输入并对其进行编程以在所需设定点执行简单的控制（例如，停止加热器）。


  本节简化了模拟信号处理，许多工业自动化工程师或 PLC 专家认为这是困难的。本书仅关注模拟输入信号，我们已使用它在满足条件时发出数字控制信号。也可以发出模拟信号（4
  至 20 mA）或使用具有 PID 功能的 PLC 以获得比此处示例更好的控制。


