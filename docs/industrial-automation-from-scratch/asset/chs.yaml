  用于触发输入，而 I0.3 用于 LD（装载）输入。Q0.2 用作输出。


  当连接到 I0.3 的按钮被按下并释放时，将装载 7。随着连接到 I0.2 的按钮被按下并释放，值将开始减少 1。当计数达到零时，输出 Q 将打开并且 Q0.2
  将被通电。


