  md: 'the output. It’s a repetitive process. The time taken by the PLC to complete
    one scan cycle is referred to as the scan time and is measured in milliseconds.


    The following is a PLC scan cycle:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_234_0.png)


    Figure 7.9 – PLC scan cycle


    PLC scan cycle may vary slightly depending on the PLC in use. Basically, the PLC
    starts by reading the inputs, that is, checking the state of the'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'connected switches and sensors to know which one is ON or OFF or the current
    value if it’s analog. It then executes the user program based on the state of
    the inputs. Next, the PLC performs communication tasks, which include communicating
    necessary information to the control network such as Profibus, Modbus, Ethernet
    IP, and so on. It also performs diagnostic tasks to ensure the entire PLC system
    is functioning properly. It then updates the output before it starts a new scan.


    It is important to know about the PLC scan cycle, which this section has explained.
    Let’s now proceed to the next section to learn about some PLC manufacturers.


    # Knowing about PLC manufacturers


    It is important to know the major manufacturers of PLC. We will discuss some of
    the major PLC manufacturers here:


    +   - **Siemens**: Siemens is the biggest brand in the industrial automation industry.
    Their PLC series and automation system is called **SIMATIC**, which stands for
    **Siemens Automatic**. Hence, the brand name of Siemens PLC is SIMATIC. Siemens
    offers various ranges of products, which include the SIMATIC LOGO! PLC, SIMATIC
    S7-200 series PLC, SIMATIC S7-300 series PLC, SIMATIC S7-400 series PLC, SIMATIC
    S7-1200 series, and SIMATIC S7-1500 series PLC.

    +   - **Rockwell Automation**: Rockwell Automation is an American company with
    headquarters in Milwaukee in the United States. The brand name of Rockwell Automation
    PLC’s product is Allen Bradley. Their PLC product range includes the Allen Bradley
    Micrologix PLC system, Allen Bradley Compactlogix small PLC system, Allen Bradley
    ControlLogix large PLC system, and so on.

    +   - **Mitsubishi Electric**: Mitsubishi Electric is a Japanese company with
    headquarters located in Tokyo, Japan. They are also one of the top PLC manufacturers.
    The brand name of Mitsubishi PLC products is MELSEC, and their product ranges
    are the MELSEC-Q series, MELSEC-FX series, MELSEC-A series, and so on.'
  merge: -1
