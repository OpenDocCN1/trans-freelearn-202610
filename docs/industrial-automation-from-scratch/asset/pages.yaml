- pgno: 488
  md: '# Part 3: Process Control, Industrial Network, and Smart Factory


    This part provides the fundamental knowledge of process control, industrial network,
    and the smart factory. It covers topics on instrumentation and control engineering
    that will be beneficial for engineers in manufacturing, oil and gas, and other
    industries. You will understand process control including analog signal processing,
    industrial networks and protocols, and finally, the current trend in manufacturing
    (the smart factory and its associated technologies, such as IoT, AI, robotics,
    cloud computing, and so on).


    This part has the following chapters:


    +   - Chapter 12, Process Control – Essentials

    +   - Chapter 13, Industrial Network and Communication Protocols Fundamentals

    +   - Chapter 14, Exploring Smart Factory (Industry 4.0) with 5G'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# Process Control – Essentials


    Many of the processes carried out in industry require control. You can’t have
    a quality product without control. Manufacturing, oil and gas, agriculture, and
    other industries require chemical or mechanical operations that need to be controlled
    to reach the finished product or desired results. Even in our homes, process control
    takes place in many of the devices or machines that we use. Here are some examples
    of home appliances that have process control integrated:


    +   - **Refrigerator**: It includes a process control system that makes it cycle
    on and off to keep your food and drinks cold at a certain temperature.

    +   - **Air conditioner**: This is another device that includes an integrated
    process control. You set a certain temperature using your remote and it ensures
    that the temperature of the room is maintained at that setpoint.

    +   - **Pressing iron**: It includes a thermostat or temperature switch that automatically
    turns off when the temperature has reached a certain level, which can be referred
    to as a setpoint.

    +   - **Room heater**: It keeps the temperature of a room at a certain temperature
    using a heater and a temperature switch.


    Process control in any industry will include sensors, actuators, and controllers,
    which we have learned about in previous chapters – this control can also sometimes
    involve communication networks. They all work together to ensure the required
    product quality is achieved.


    Upon the completion of this chapter, you should understand process control and
    the various measurement and devices applicable in industrial process control.
    You will learn hands-on how to control the temperature using a temperature controller.
    The last section provides practical knowledge about analog input signal processing
    in a Programmable Logic Controller (PLC), which is an advanced part of PLC programming.
    You will'
  merge: -1
  img_proc: true
- pgno: 490
  md: 'understand the wiring and programming of analog input for Siemens S7 1200 PLCs
    hands-on using the step-by-step guide provided.


    In this chapter, you will cover the following topics:


    +   - Introducing process control

    +   - Exploring process control terms

    +   - ISA symbology

    +   - Temperature measurement and transmitters

    +   - Pressure measurement and transmitters

    +   - Level measurement and transmitters

    +   - Flow measurement and transmitters

    +   - Understanding the process control loop

    +   - A practical example of a single loop process control

    +   - Wiring and programming the analog input of a PLC (Siemens S7 1200) for process
    control (hands-on)


    # Introducing process control


    In a very simple way, we can define process control as the technique of monitoring
    and adjusting a process to yield the desired result.


    In industry today, raw materials undergo a series of procedures (processes) before
    they become a finished product. These processes need to be carefully monitored
    and adjusted to ensure quality products are produced efficiently, economically,
    and safely. The monitoring of processes and the adjustments necessary are usually
    automated using control systems. If the monitoring and adjustments were to be
    done manually, there would be a need for more workers and we cannot achieve the
    best possible results this way due to human errors.'
  merge: -1
  img_proc: true
- pgno: 491
  md: '# Types of process control systems


    Automatic process control can be categorized as one of the following:


    +   - Open-loop

    +   - Closed-loop (feedback)

    +   - Feedforward

    +   - Feedforward-feedback


    Let’s have a look at each of the types.


    # Open-loop control


    In open-loop process control, the output does not change the control action. It
    has no sensor or feedback system. An operation that depends on time is a typical
    example of an open loop – for example, a washing machine has a timer that an operator
    will set to a desired time. The machine operates and performs the necessary processes
    to get the clothes cleaned within the specified time. It has no sensor that determines
    whether the cloth is cleaned or not. It will stop when the set time duration has
    been reached. Here, the output does not affect the control action. The following
    figure shows a block diagram for an open-loop control system:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_491_0.png)


    Figure 12.1 – A block diagram for an open-loop process control system


    # Closed-loop (feedback) control'
  merge: -1
  img_proc: true
- pgno: 492
  md: 'In closed-loop process control, the output affects the control action. It has
    a sensor at its output that is fed to its input as a feedback signal. The feedback
    signal is compared with a setpoint to generate an error signal, which it uses
    to determine the required action necessary to drive the process to the desired
    output or result. A closed-loop control system can also be referred to as a feedback
    control system for this reason. The output is fed back to the input and it uses
    the measured output (the process variable) and the given setpoint to control the
    input that keeps the output to the desired value. The following figure shows a
    block diagram for a feedback process control system:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_492_0.png)


    Figure 12.2 – A block diagram for a feedback process control system


    Feedback control is a common technology used in various industries such as aerospace
    (for example, autopilot and rockets), processing (for example, oil and gas, chemical,
    nuclear reactors, food and beverages, pharmaceutical, and water treatment), and
    automated manufacturing (for example, robotics and CNC machines).


    In the milk manufacturing industry, one of the production processes involves heating
    the milk to about 70 degrees Celsius within 15 seconds and cooling it immediately
    to about 3 degrees Celsius to kill germs and increase the shelf life (this process
    is known as pasteurization). **High Temperature, Short Time (HTST)** pasteurization
    equipment is usually used.'
  merge: -1
  img_proc: true
- pgno: 493
  md: 'This equipment uses sanitary plate heat exchangers, utilizing hot water or
    steam to increase the temperature of the milk. This heating stage is then followed
    by a rapid cooling stage. HTST pasteurization equipment uses a process control
    system, usually a feedback control system, to ensure that the milk is pasteurized
    well.


    Feedback control is also common in our homes. Air conditioning is one common example.
    It has a sensor that reads the temperature of the environment – this reading is
    fed to a controller that has a setpoint (the desired temperature value you set
    with your remote – for example, 16 degrees Celsius) and the setpoint is compared
    with the feedback signal to generate an error signal. The controller uses the
    generated error signal to decide the control action needed to drive the compressor
    to ensure that the desired temperature value is maintained. The sensor at its
    output enables it to determine whether the desired temperature has been reached
    or not, unlike open-loop.


    # Feedforward control


    With feedforward control, a disruption is measured and corrective action is taken
    to correct the error before it affects the system. It is a control system that
    foresees a disturbance and provides a control action before the disruption affects
    the system. Feedforward control bases its control action on the state of the load
    variable or input rather than the state of the output, unlike feedback control.
    It monitors the load variable and takes any necessary action before the process
    variable (or output) deviates from a setpoint. The output is not fed back, unlike
    feedback control.


    The following figure shows a block diagram for a feedforward process control system:'
  merge: -1
  img_proc: true
- pgno: 494
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_494_0.png)


    Figure 12.3 – A block diagram for a feedforward process control system


    # # Feedforward-feedback control


    Feedforward is not used by itself in industry – it is usually used with feedback
    control. Hence, feedforward-feedback control can be seen as a type of process
    control. The feedforward element provides a quick response to any disruption while
    the feedback element provides the remainder of the response by accurately acting
    on the error that eventually occurs. It utilizes both the feedforward and feedback
    controller, as shown in the following figure:'
  merge: -1
  img_proc: true
- pgno: 495
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_495_0.png)


    Figure 12.4 – A block diagram for a feedforward-feedback process control system


    We have just been introduced to process control and the various types available.
    Let’s proceed to the following section to learn about some process control terms.


    # Exploring process control terms


    Here, we are going to look into some of the common terminology related to process
    control:


    +   - Process: A process is any operation or event (or sequence of operations
    or events) that causes a physical or chemical change to an'
  merge: -1
  img_proc: true
- pgno: 496
  md: 'input. Raw materials in industry undergo some kind of series of operations,
    whether being heated, ground, or mixed, for example, before they resemble a finished
    product.


    +   - **Sensors:** A sensor is a device that senses or detects something – just
    as we have ears that hear, eyes that see, a nose that smells, and a tongue that
    tastes. We have sensors that sense or detect various physical properties such
    as temperature, pressure, level, or flow. Sensors basically convert a physical
    property into an electrical quantity.


    Hence, the four common sensors used in process control are a temperature sensor,
    a pressure sensor, a level sensor, and a flow sensor – some others include a pH
    sensor, speed sensor, or a position sensor. In *Chapter 2, Switches and Sensors
    – Working Principles, Applications, and Wiring*, we discussed sensors but our
    focus was on sensors that produced digital output, as in **LOW** or **HIGH** (0
    or 1). Here in this chapter, we will focus on sensors that produce analog signals.


    +   - **Transmitters:** A transmitter is a device that converts a signal produced
    by a sensor into a standard signal (4 to 20 mA, 0 to 10 V, or 3 to 15 psi) that
    is applicable to process control. The output signal from a sensor may be too small
    and need amplification or conditioning to produce a standard signal. Hence, sensors
    are usually connected to a transmitter to produce a standard signal output – for
    example, the following diagram shows how an RTD temperature sensor and an RTD
    temperature transmitter are wired to produce an output of 4 to 20 mA as the temperature
    varies:'
  merge: -1
  img_proc: true
- pgno: 497
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_497_0.png)


    Figure 12.5 – How an RTD temperature sensor and an RTD temperature transmitter
    are wired to produce an output of 4 to 20 mA as the temperature varies (Credit:
    Showlight Technologies Ltd.: [www.showlight.com.ng](http://www.showlight.com.ng))


    +   - **Process variables or process values (PVs):** This is the actual value
    or current value of the specific quantity we are measuring. This can be temperature,
    pressure, level, flow, or another quantity.

    +   - **Setpoints:** This can be referred to as the target value of the process
    variable. It is the value at which we want the process variable to be maintained.
    For example, the target temperature of a boiler can be referred to as the setpoint
    of the boiler.

    +   - **Errors:** This is the difference between the process variable or measured
    value and the setpoint.'
  merge: -1
  img_proc: true
- pgno: 498
  md: '+   - **Controllers**: This is a device that provides the necessary control
    action to keep the process variable at the setpoint. It acts on an error signal
    and provides the necessary control action to the final control element to keep
    the error at zero so that the setpoint can be maintained.

    +   - **Control elements or final control elements**: These are the devices that
    the controller operates to keep the process variable at a setpoint. Examples include
    contactors, relays, solenoid valves, pneumatic control valves, and variable frequency
    drives.


    So, we have just learned about some of the common process control terms. It is
    important to get familiar with the terms because you will find them in frequent
    use in any documents or discussions related to process control. Let’s now proceed
    to the following section where we will be learning about ISA symbology.


    # ISA symbology


    The **International Society of Automation (ISA)** is a non-profit professional
    association of engineers, technicians, and managers engaged in industrial automation.
    ISA is one of the leading standard organizations in the process control trade.
    They developed a set of symbols for use in the design of process control loops
    and other engineering diagrams. This set of symbols is referred to as ISA symbology
    and is detailed in one of their publications (*ISA5.1, Instrumentation Symbols
    and Identification*), which you can purchase at their website (https://www.isa.org/).


    ISA symbology is used when creating **Process (or Piping) and Instrumentation
    Diagrams (P&IDs)**.


    A P&ID is a diagram that depicts the details of the piping and instruments used
    in a processing plant. *Figure 12.14* shows a simple P&ID of a process control
    loop for a basic level of control. It is usually developed from a **Process Flow
    Diagram (PFD)** at the design stage of an industrial process plant. The PFD shows
    the basic flow of an industrial process plant. It only shows the major components
    in the process plant.'
  merge: -1
  img_proc: true
