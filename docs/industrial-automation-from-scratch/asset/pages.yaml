- pgno: 147
  md: '# Introduction to Variable Frequency Drive (VFD)


    In the previous chapter, we learned about the various types of electric motors.
    Among the various types, the asynchronous (induction) motor is the most commonly
    used motor in the industry. However, machines in the industry, such as conveyors,
    mixers, agitators, pumps, compressors, and others, that utilize an induction motor
    require a variable speed, which an induction motor alone cannot provide because
    induction motors are designed to run at a constant speed (that is, their speed
    remains almost the same for various load range).


    A variable speed drive is an electronic device used to achieve the varying speed
    needed by either an asynchronous or synchronous motor for various applications.


    This chapter looks at a Variable Frequency Drive (VFD), its working principle,
    benefit, wiring, and programming. We will also look at some practical applications,
    including forward, reverse, and speed control of an induction motor.


    In this chapter, we are going to cover the following main topics:


    +   - An overview of a VFD

    +   - Wiring a VFD

    +   - Understanding a basic VFD parameter setting

    +   - Wiring and programming a VFD to start/stop a three-phase motor and setting
    the frequency (speed) using a keypad

    +   - Wiring and programming a VFD (VAT20) to use a push button or switch to run
    a three-phase motor in a forward/reverse direction and to use a keypad to set
    the frequency (speed)'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Wiring and programming a VFD (VAT20) to use a push button or switch to run
    a three-phase motor in a forward/reverse direction and to use a potentiometer
    to set the frequency (speed)


    # An overview of a VFD


    A VFD is a device used to vary the speed of Asynchronous or Synchronous (AC) electric
    motors by varying the frequency and voltage supplied. A VFD can also be referred
    to as an Adjustable Speed Drive (ASD) or inverter. It is the most effective way
    of controlling the speed of an induction motor. The principle of operation of
    a VFD is based on the fact that the speed of an induction motor is directly proportional
    to the frequency of the voltage supplied to the motor. When frequency increases,
    speed also increases, and when frequency reduces, the speed will also reduce.
    A synchronous motor runs at synchronous speed (the speed of the rotating magnetic
    field of the stator) while an asynchronous (induction) motor’s speed is slightly
    less than synchronous speed. In the previous chapter, it was mentioned that synchronous
    speed is determined by the frequency of the voltage source and the number of poles,
    as shown by the following formula:


    Synchronous speed = 120f/P


    Here, f = frequency in Hz and P = the number of poles.


    From the preceding equation, it can be seen that a change in frequency will cause
    a change in speed. If an application requires a varying speed, a VFD can be used
    to increase or reduce the speed of the motor, and it does so by varying the frequency
    and voltage. Some of the companies in the VFD industry include Siemens, Rockwell
    Automation, Yaskawa Electric Corporation, and General Electric. This book focuses
    on the General Electric VFD.


    The following image shows a VFD manufactured by General Electric (VAT 20-U20N0K4S):'
  merge: -1
  img_proc: true
- pgno: 149
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_149_0.png)


    Figure 5.1 – A VFD from General Electric (VAT 20-U20N0K4S)


    The credit for this photo goes to *Showlight Technologies Limited at* www.showlight.com.ng.


    You should now have an understanding of what a VFD does, the relationship between
    the speed of an induction motor and the frequency, and the various companies in
    the VFD industry. Your knowledge here will help in understanding other sections
    in this chapter. Let’s learn how a VFD works in the next section.


    # Understanding how a VFD works


    The principle of operation of a VFD can be explained using the three basic stages
    that make it up, as shown in the following block diagram:'
  merge: -1
  img_proc: true
- pgno: 150
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_150_0.png)


    Figure 5.2 – A block diagram of a VFD


    Let’s have a look at the three stages to understand how a VFD works:


    +   - **Converter:** This is the first stage of a VFD. It converts the AC input
    power to DC power. This stage can also be referred to as the rectifier stage.
    It can consist of diodes or an array of fast switches.


    The following circuit diagram shows the converter/rectifier stage of a VFD that
    is made up of diodes:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_150_1.png)


    Figure 5.3 – The converter/rectifier stage'
  merge: -1
  img_proc: true
- pgno: 151
  md: '• **DC link:** Power from the rectifier is fed to the DC link stage. The DC
    link stage smoothens the DC from the converter/rectifier stage. It consists of
    a capacitor and may also include an inductor that remove ripples from the rectified
    signal to provide clean DC power for the next stage.


    The following circuit diagram shows the DC link stage of a VFD:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_151_0.png)


    Figure 5.4 – The DC link stage of a VFD


    • **Inverter:** This is the third stage, which converts the DC power from the
    DC link into a three-phase AC output. This stage comprises of a power-switching
    device such as a **Metal Oxide Semiconductor Field Effect Transistor (MOSFET)**,
    or an **Insulated Gate Bipolar Transistor (IGBT)**, or a thyristor. The output
    of an inverter is not a'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'pure sine wave but an approximation, based on the principle of Pulse Width
    Modulation (PWM), which is the major inverter technology.


    The following circuit diagram shows the inverter stage of a VFD:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_152_0.png)


    Figure 5.5 – The inverter stage of a VFD


    Having understood how a VFD works, let’s have a look at the advantages in the
    next section.


    # Advantages of a VFD


    A VFD offers so many advantages, which account for its use in many industries.
    Some of the advantages of VFD include the following:


    +   A VFD extends motor life and reduces maintenance costs because it starts the
    motor by ramping it up to the operating speed, rather than starting it abruptly
    as a direct online starter would do. This starting'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'method reduces mechanical and electrical stress that would have shortened the
    life of the motor or increased the maintenance costs of both the motor and the
    driven equipment.


    +   - A VFD reduces energy consumption. Running a motor at full speed consumes
    a lot of energy, which increases energy costs. Some applications do not require
    a motor to run at full speed. A VFD can be used in such cases to match the speed
    of the motor to the process requirement. This will greatly reduce electricity
    costs.

    +   - A VFD has built-in safety features that provide protection for both the
    motor and the VFD itself. The VFD can automatically stop operation when a fault
    occurs. The built-in safety features eliminate the cost of additional safety components.

    +   - A VFD offers flexible control of AC motors. With VFD, various options are
    available for controlling a motor. It can use push buttons, selector switches,
    and a potentiometer, and can even be operated through a **Programmable Logic Controller
    (PLC)** or other form of industrial controller.

    +   - A VFD reduces disturbances in the power line. When AC motors are started
    across the line, they can demand up to 600% of the full load current, depending
    on the capacity of the motor. This can cause a significant disturbance or a short-duration
    reduction in voltage (voltage sag) in the power system connected to it. Sensitive
    equipment connected to the same power distribution system can be interrupted due
    to the low voltage that occurs as a result of the disturbances. A VFD eliminates
    voltage sag or disturbance in a power line since it starts at 0V and ramps up
    to the required speed.


    Let’s discuss some disadvantages of a VFD as well.


    # Disadvantages of a VFD


    Despite the many advantages that make VFDs useful for many applications in the
    industry, they also have some disadvantages that need to be known,'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'understood, and mitigated. Some of the disadvantages include the following:


    +   - **Harmonics**: Harmonics are the most common issue that has to be dealt
    with when using a VFD. They are high-frequency signals that are superimposed on
    the fundamental waveform, creating a distorted waveform. They can cause overheating
    of motors and transformers, premature failure of circuit breakers, incorrect operation
    of electronic instruments, and other issues. A remedy for harmonics caused by
    a VFD is the use of an AC line reactor (choke) or filter.

    +   - **High initial cost**: Depending on how large a system is, the initial cost
    of purchasing a VFD could be a disadvantage. However, the cost issue can be neglected
    by the energy saving and protection offered by the built-in safety features.


    This section explains some of the disadvantages of a VFD along with a way to mitigate
    each challenge. Let’s proceed to the next section, where we will learn how to
    select a VFD.


    # Selecting a VFD


    Before going too far into the selection of VFD, it is important to first know
    and understand basic motor information, which can be found on a motor nameplate.
    Here are some motor information that can be found on a nameplate:


    +   - **Horsepower**: This is a measure of the output power of a motor. The output
    power of a motor can sometimes be given in watts, where 1HP = 746 watts. A 10HP
    motor is 7.46KW.

    +   - **Full Load Amps (FLA)**: This is the maximum current expected to be drawn
    by a motor when operating at maximum torque and HP.

    +   - **Voltage**: This is the voltage required to operate a motor for optimal
    performance. Operating the motor below or above the rated voltage will affect
    its performance.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '+   • **Revolutions per Minute (RPM)**: This refers to the speed of the shaft
    at the rated frequency, the rated load, and the rated voltage. It is the number
    of complete rotations the rotor’s shaft will make in 1 minute.

    +   • **Frequency**: This is the frequency of the supply that the motor is designed
    to operate.


    The following diagram gives a better understanding of a motor nameplate:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_155_0.png)


    Figure 5.6 – An electric motor nameplate showing basic information


    Now that we understand the basic information on a motor nameplate, let’s look
    at some necessary things to be considered when selecting a VFD for a motor:


    +   • **Input voltage**: This is the voltage required to power up a VFD. Some
    VFDs require a three-phase 380–400V input while others require a single-phase
    220–230V input. The type you will choose depends on the source you have available
    at the site (whether it’s a single-phase or three-phase).

    +   • **Output voltage**: The output voltage is the voltage that a VFD can provide
    to operate a motor. The output is usually three-phase with a voltage of 200V,
    220V, 380V, 400V, and more. Check the required'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'voltage to power up the motor on the nameplate and select a VFD that can produce
    the voltage.


    ● Load capacity: This refers to the amount of load the VFD can bear without damage.
    The load capacity of the VFD you will select depends on the motor size. A small
    motor will require a VFD with a small load capacity, while a large motor will
    require a VFD with a large load capacity. It is usually given in HP or Amps. Knowing
    the HP of your motor will help in searching for a suitable VFD, which will be
    further narrowed down by other parameters such as FLA and voltage. It is very
    important to ensure that the VFD can handle the current demand of the motor. The
    proper way to select a VFD for a motor is to use the FLA of the motor rather than
    HP alone. Check the FLA of the motor on its nameplate and ensure the VFD is rated
    for at least that much current.


    If the drive will be fed with single-phase power, ensure you use a drive built
    for single-phase. VFDs are significantly derated for single-phase operation. A
    single-phase input/three-phase output VFD can be up to 3 or 5HP; if a three-phase
    motor is larger than 5HP, for example, and a single-phase is to be used to power
    up the VFD, you’ll have to derate the three-phase VFD for single-phase power.
    Derating a three-phase VFD for single-phase input can simply be achieved by multiplying
    the FLA of the motor by 2 and then selecting a three-phase VFD with corresponding
    amps. For example, if a 10HP motor with FLA of 26.6A is to be used with a VFD
    and the site only has a single-phase power line voltage of 230V, we will have
    to derate the VFD to use the single-phase power; this can be done by multiplying
    26.6 by 2, which will be 53.2A. Hence, a three-phase 230V VFD of 53.2A or higher
    can be used, which will be about 20HP and will run a 10HP/230V motor on a single-phase.


    We have just completed an overview of VFD, which includes understanding the working
    of a VFD, the advantages of a VFD, the disadvantages of a VFD, and the selection
    of a VFD. This knowledge is important before doing any practical work on a VFD.
    The next sections cover practical work on VFD, and the theories in the previous
    section (an overview of a VFD) will be of great benefit.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Wiring a VFD


    Before wiring a VFD, ensure you have properly sized the VFD for your motor by
    using the information in the previous section (*Selecting a VFD*).


    Next, it is a good practice to look through the manual of the VFD to have an understanding
    of the VFD itself and its wiring.


    The following diagram shows the wiring of VAT 20 in the manual provided by the
    device manufacturer:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_157_0.png)


    Figure 5.7 – A wiring diagram of a GE VFD (VAT 20)


    Let’s now have a look at some of the terminals available in a VFD and how to connect
    them:'
  merge: -1
  img_proc: true
- pgno: 158
  md: '+   - **Power input (L1, L2, and L3)**: This is the input for the AC that will
    power the drive. The AC power from the source should connect to the power input
    terminals L1 and L2 for the single-phase input type or L1, L2, and L3 for the
    three-phase input type. It is advisable to use a properly sized circuit breaker
    and an AC line reactor between the power source and the power input of the VFD.
    The breaker can be used to switch ON or OFF the VFD and also act as protection
    while the line reactor improves the power factor. An AC line reactor is necessary
    for this VFD if the capacity of the power source is above 600KVA according to
    its manual. Always check the manual of the drive you want to use for necessary
    additional devices that may be required.

    +   - **Three-phase AC output terminal (U, V, and W)**: This is the AC power output
    terminal of the VFD, which should be connected to the three-phase wire (U, V,
    and W) of the three-phase motor.

    +   - **Terminals 1 and 2 (trip relay)**: This is a relay that can be connected
    to an indicator to indicate fault.

    +   - **Terminals 3 and 4 (forward and reverse)**: These terminals are used to
    control the operation of a VFD. Push buttons, selector switches, or signals from
    a PLC can be connected to control the operation of the VFD. It can be made to
    make the motor run in a forward or reverse direction.

    +   - **Terminal 5 (+12)**: This is the common point of terminals 3, 4, 6, and
    7. The VFD supplies +12V at this terminal. Hence, push buttons or selector switches
    can be connected between terminals 5 and 3, 4, 6, and 7, as shown in the preceding
    wiring diagram to send a control signal to the VFD to control the operation of
    the VFD for various operations.

    +   - **Terminals 6 and 7**: This can as well be used to control the operation
    of the VFD. The parameter setting will give further details on their use. The
    wiring is similar to the wiring of terminals 3 and 4.

    +   - **Terminal 8**: This is the power terminal of a potentiometer. This should
    connect to the third pin of a potentiometer.

    +   - **Terminal 9**: This is the analog input point. This should connect to the
    second (middle) pin of a potentiometer.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '+   - **Terminal 10:** This is the analog common point (0V). This should connect
    to the first pin of a potentiometer.

    +   - **Terminal 11:** This is the analog output positive connection point. A
    voltmeter or ammeter can be connected between terminals 11 and 10 to read analog
    output from VFD.


    The following photo shows the VFD showing the terminals for a better understanding:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_159_0.png)


    Figure 5.8 – The button view of GE VFD (VAT 20)


    The credit for this photo goes to *Showlight Technologies Limited* at [www.showlight.com.ng](http://www.showlight.com.ng).'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'Let’s now do some basic wiring for this VFD using some of the knowledge we
