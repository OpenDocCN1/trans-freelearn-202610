  md: 'transmit information when it receives a command from the master to transmit.
    There can only be one master and up to a maximum of 247 slaves, each of which
    has a unique address called a unit ID. In the following diagram, the PLC is the
    master and will communicate with the field devices and VFD (slaves), each of which
    has a unit ID. We can also have a SCADA/HMI as the master while the PLCs connected
    to the SCADA/HMI are regarded as the slaves.


    The physical communication medium of Modbus RTU is RS232, RS422, and RS485.


    RS232 is used for point-to-point topology. It allows communication between two
    devices (master and slave) at a distance of less than 50 ft.


    RS485 and RS422 are used to connect more than two devices on the same line at
    a distance greater than 50 ft, while RS485 is preferred for multiple devices connected
    over a long distance of about 4,000 ft. The following diagram shows a master PLC
    connected to field devices and VFD as slaves:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_592_0.png)


    Figure 13.19 – Modbus RTU network with one PLC as master and field devices and
    VFD as slaves


    The following diagram shows a SCADA/HMI as the master and PLCs as the slaves:'
