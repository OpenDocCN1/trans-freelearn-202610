    # Count up (CTU)


    The count up instruction will count up or increase by 1 each time its input is
    triggered (0 to 1); for example, when a button is pressed and released or when
    a sensor is activated. The counter’s output will be energized when the number
    of times the input is triggered (current value of the counter) is equal to, or
    greater than, the pre-set value (PV).


