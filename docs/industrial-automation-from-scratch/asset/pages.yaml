- pgno: 435
  md: '# Exploring Supervisory Control And Data Acquisition (SCADA)


    In the previous chapter, we learned how to monitor and control a machine through
    a Human-Machine Interface (HMI). An HMI is always close to the machine or Programmable
    Logic Controller (PLC) – that is, an HMI is always local to the machine, and it
    is basically meant to control a single machine/PLC. Here in this chapter, we will
    be learning about Supervisory Control And Data Acquisition (SCADA), which also
    provides a means of monitoring and controlling along with other functionalities,
    such as alarms, trending, and logging. However, the screen or PC for monitoring,
    controlling, or other functionalities can be in a remote place – that is, far
    away from the machine – and we can have one SCADA for more than one machine at
    different remote locations, unlike HMI. SCADA is an interesting and advanced aspect
    of industrial automation.


    We are going to cover the following main topics in this chapter:


    +   - Introducing SCADA

    +   - Understanding the functions of SCADA

    +   - Exploring the applications of SCADA

    +   - Overviewing SCADA hardware

    +   - Overviewing SCADA software

    +   - Downloading and installing mySCADA

    +   - Interfacing SCADA with an S7-1200 PLC using mySCADA software (a practical
    project)


    # Introducing SCADA'
  merge: -1
  img_proc: true
- pgno: 436
  md: 'SCADA is a system consisting of various hardware and software that work together
    to monitor and control machines in an industrial process.


    Supervisory control refers to a high level of overall control of several individual
    PLCs or multiple control loops.


    Data acquisition refers to the gathering of information and data from a process
    that is analyzed in real time. Real-time data collection helps to reduce overhead
    costs, monitor an entire process, and increase efficiency.


    SCADA system helps to collect, analyze, and visualize data from equipment or a
    machine and also provides a means of controlling the equipment or machine from
    a central location, which can be local or remote (that is, near the machine or
    far away from the machine).


    SCADA is typically used to monitor and control geographically dispersed machines
    or devices. The following figure shows a simple SCADA system:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_436_0.png)


    Figure 11.1 – A simple SCADA system showing SCADA hardware


    One production machine can be located in one geographical area (location A) while
    the other machine can be in a different geographical area (location B). If a SCADA
    system is in place for the two production machines, we can monitor the status
    of the two machines from a central location and also control either of them. SCADA
    basically acquires data about a system or'
  merge: -1
  img_proc: true
- pgno: 437
  md: 'machine in order to control it. The system or machine you want to monitor and
    control can be a water treatment plant, power generation, a power distribution
    system, or anything else.


    # Understanding the functions of SCADA


    The meaning of SCADA already implies its major functions. The following goes into
    detail about what a SCADA system does:


    +   - It controls industrial processes either locally or remotely. Switching on
    or off a machine, increasing or decreasing setpoints, and so on are control functions
    that a SCADA system can be programmed to perform.

    +   - It collects data (acquires real-time data) from a field or machine, which
    provides a status indicator to the operator or process engineer for monitoring.

    +   - It enables a process engineer to have a bird’s-eye view of an entire plant,
    which can consist of various machines/devices at different geographical locations.

    +   - It generates alarms when abnormal conditions occur within a process. It
    can trigger alarms that can be in the form of audible sounds, lights, emails,
    SMS, or other forms when something is wrong in a process.

    +   - It records events (data logging).


    Next, let’s take a look at the applications of SCADA.


    # Exploring the applications of SCADA


    The following are a few applications of SCADA:'
  merge: -1
  img_proc: true
- pgno: 438
  md: '+   - **Water treatment plant**: SCADA helps in monitoring reservoir levels,
    pump operations, water flow, and lots more, and also helps in controlling pumps
    and other equipment in a plant.

    +   - **Power generation and distribution**: A SCADA system helps to monitor and
    control power generation and distribution networks. SCADA can monitor various
    equipment in substations and also send a signal to control equipment in a remote
    location to switch ON or OFF a breaker.

    +   - **Manufacturing**: SCADA controls industrial automation equipment used in
    the manufacturing of various goods. It also monitors manufacturing processes.

    +   - **Building and facility management**: SCADA is used by facility managers
    to monitor and control lighting, **Heating Ventilation and Air Conditioning (HVAC)**,
    and so on.

    +   - **Traffic light**: SCADA is used to monitor traffic lights such as failure
    detection, incorrect signals, and lots more. It is also used to control traffic
    flow.


    In the next section, we will discuss the hardware components of SCADA.


    # Overviewing the SCADA hardware


    The hardware components of a SCADA system include the following:


    +   - **Field devices**: These are sensors, transmitters, and actuators that are
    directly connected to the machine or plant and generate a digital or analog signal
    for monitoring. Sensors or transmitters are for monitoring machine status or parameters,
    while actuators are for carrying out control action on equipment or a machine.

    +   - **Remote station**: This can be a PLC or a **Remote Terminal Unit (RTU)**.
    It is installed at a remote site where the machine or equipment to be monitored
    or controlled is located. Field devices (sensors, transmitters, and actuators)
    are connected to remote stations (a PLC or'
  merge: -1
  img_proc: true
- pgno: 439
  md: 'an RTU) to allow monitoring and control from the host computer at a remote
    site via a network. It gathers data through the sensors connected to it and transfers
    them to the host computer via a network. It also transfers an electrical control
    signal from the host computer to the actuators connected to it in order to perform
    the required control action.


    Communication network: The main purpose of a communication network in SCADA is
    to connect the remote stations (a PLC or an RTU) to the host computer (master
    station). It allows the flow of information in a SCADA system. The communication
    medium for a SCADA system can either be wired or wireless. A common wired medium
    is Ethernet. Various network topologies (star, bus, ring, and so on) are available
    for use in a SCADA system, and various network protocols (Profinet, Modbus, Profibus,
    and so on) are also available for use. More details will be provided on network
    topologies and network protocols in Chapter 13, Industrial Network and Communication
    Protocols Fundamentals.


    Master station: This can also be referred to as a supervisory station. It is the
    master computer that runs SCADA software that provides the graphical presentation
    of the system. It runs the HMI application that provides the graphical picture
    of the switches, sensors, transmitters, pumps, and so on for monitoring and control
    purposes. Alarms can be set up to activate at different predefined values. The
    entire control system at various plant sites can be monitored and controlled through
    the GUI on the master station. A single computer can be configured as a master
    station or networked to workstations or multiple servers. In a SCADA system that
    uses multiple servers as a master station, one of the servers can be dedicated
    to an Alarm Management System (AMS), and this can be referred to as an AMS console.
    An AMS console consists of AMS software that provides an overview of alarms from
    various areas in the plant, makes a quick response possible when there is an abnormal
    condition in the plant, and so on.


    Basically, the master station collects information from the remote station (a
    PLC or an RTU), represents them on a GUI for easy interpretation, generates an
    alarm, and also provides an interface for various control actions that can be
    carried out at remote sites.'
  merge: -1
  img_proc: true
- pgno: 440
  md: 'Figure 11.1 illustrated a simple SCADA system, showing the various SCADA hardware
    components that are explained in this section. Next, we will look at the different
    software that can be used to create the GUI for SCADA.


    # SCADA software


    This is software that can be used to create the interface (GUI) required to monitor
    and control the industrial equipment and perform all necessary configurations.
    It is usually installed on a central host computer, where monitoring and control
    operations will be carried out.


    Common SCADA software includes the following:


    +   - WinCC by Siemens

    +   - FactoryTalk View by Rockwell Automation

    +   - InTouch by Wonderware

    +   - iFix by General Electric

    +   - Citect SCADA by Schneider

    +   - mySCADA


    We are going to use one of the preceding SCADA software (mySCADA) in this chapter
    to learn how SCADA works, and to understand its basic configuration and wiring
    for a simple system.


    **mySCADA** is powerful SCADA software that runs on Microsoft Windows, macOS,
    and Linux. It supports various PLCs, including S7-1200, S7-1500, S7-300, S7-400,
    ControlLogix, CompactLogix, Micrologix 1200, Micrologix 1400, Micrologix 1500,
    SLC 500, PLC 5, Omron PLCs, and Melsec-Q.


    It basically consists of two pieces of software (myDESIGNER and myPRO). myDESIGNER
    is a development platform that can be used to create screen/visualization and
    perform all the necessary configurations that'
  merge: -1
  img_proc: true
- pgno: 441
  md: 'suit your application, while myPRO allows visualization. You can view your
    SCADA to control and monitor your equipment through myPRO. It runs on common browsers,
    including Microsoft Internet Explorer IE (version 9 and above), Microsoft Edge,
    Chrome, Firefox, and Safari.


    In the next section, we will see how to download and install the mySCADA software
    on your system.


    # Downloading and installing mySCADA software


    Let’s start by learning how to download the software, as it will be used in the
    SCADA project in the *Interfacing SCADA with an S7-1200 PLC using mySCADA software*
    section of this book.


