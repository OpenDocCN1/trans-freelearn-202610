- pgno: 83
  md: '# Actuators and Their Applications in Industrial Automation


    In the previous chapter, we related the way humans function to automation. The
    eyes, touch, and smell were likened to switches and sensors while the controller
    was likened to the brain. In this chapter, we will be looking at actuators, which
    can be likened to the hands. In our bodily system, the hands do what the brain
    tells them to do. Similarly, in automation, the actuator does what the controller
    tells it to do. An actuator is simply a mover. It can move, carry, or perform
    other similar functions just like the hand. It requires a control signal from
    a controller to carry out its actions. The control signal is the result of the
    processing done by the controller through the program (a set of instructions)
    written into it. Industrial automation is not complete without an actuator.


    This chapter will explain various actuators used in industrial automation. You
    will learn their basic principle of operation and about their application in industry.
    Actuators are one of the key components in industrial automation that need to
    be given enough attention. This chapter will provide relevant information that
    an automation engineer needs to know about actuators.


    In this chapter, we are going to cover these main topics:


    +   - Introducing actuators

    +   - Learning about electrical actuators

    +   - Exploring pneumatic actuators

    +   - Getting to know about hydraulic actuators


    # Introducing actuators'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'An **actuator** is a device or component that produces an action or motion.
    It can be referred to as a **mover** because it moves to control a system. It
    usually requires a control signal from a controller and an energy source, which
    can be **electric**, **pneumatic** (air), or **hydraulic** (liquid). When it receives
    a control signal, it converts its own energy (electric, pneumatic, or hydraulic)
    to a form of energy or motion that can perform the required action.


    One major application of an actuator in industry is the opening and closing of
    **valves**.


    Manually operated valves use hand-wheels, manual gearboxes, knobs, and so on as
    their actuators for operation. The hand-wheel or knob can be turned clockwise
    or counterclockwise by humans to open or close the valve.


    In situations where manual actuation of a valve to open or close it is not realistic,
    such as remote locations or on very large valves, a pneumatic, electric, or hydraulic
    actuator is required.


    The actuator (pneumatic, electric, or hydraulic) provides the power or motion
    required to open or close the valve by converting its own energy to a mechanical
    force (or motion) when it receives a control signal from a controller. Figure
    3.16 shows a valve with a hand-wheel on the left side of the figure that can be
    operated manually and a valve on the right side of the image with a pneumatic
    actuator that can be operated automatically via a control signal.


    Figure 3.1 shows the functional block diagram of an actuator:'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_85_0.png)


    Figure 3.1 – Functional block diagram of an actuator


    The motion produced by an actuator can either be linear or rotational. There are
    various types of actuators whose produced motion can either be linear or rotational.


    There are basically three types of actuators:


    +   - Electric actuators

    +   - Pneumatic actuators

    +   - Hydraulic actuators


    We will look at what these three types of actuators are in the next topics of
    the chapter. We will learn about their basic construction as well as their application
    in industry. Having this knowledge will help in choosing the right actuator for
    your industrial automation needs.


    # Learning about electric actuators


    **Electric actuators** are used in industry to convert electrical energy to kinetic
    energy to cause the movement of loads or perform actions that required motion
    or force. The operation of most electric actuators is based on the interaction
    between a magnetic field and a current carrying a'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'conductor to create a *turning force*. Industrial fans, blowers, pumps, dampers,
    and so on are common applications of such an electric actuator. They utilize electric
    motors to perform the necessary action. Electric actuators are used in robotics
    and other assembly applications due to their accuracy, flexibility, and low operating
    cost. They are used in industrial machines that require circular motion. They
    are also used for clamping, pressing, cutting, stamping, and other forms of applications
    that require linear motion. An electric actuator can be referred to as a device
    that converts electrical energy into a linear or circular motion. Hence, electric
    actuators are of two types:


    +   - **Electric linear actuator:** This is an actuator that will move in a linear
    direction. In this, rotational motion is first generated by an electric motor
    at high speed. It is then reduced by a gearbox to increase the torque, which will
    turn a leadscrew in a rotational motion, which in turn makes a drive nut move
    linearly. Limit switches are used to ensure the drive nut does not move beyond
    a certain point in the forward or reverse direction.


    *Figure 3.2 shows the parts of a linear actuator:*'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_87_0.png)


    Figure 3.2 – Parts of an electric linear actuator


    Electric rotary actuator: Electric rotary actuators are commonly used in automation
    systems. Examples include direct current (DC) motors, AC motors, stepper motors,
    and servo motors.


    We will look at examples of electric rotary actuators in the next sections.


    # Direct current motors


    Direct current (DC) motors convert electrical energy (through DC) to mechanical
    energy (motion). A DC motor consists of a stator, an armature, split ring commutators,
    and brushes. The stator is the stationary part, which usually consists of permanent
    magnets, and the armature is the rotating part, consisting of a coil of wire.
    The windings of the coil are connected to split'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'ring commutators. The split-ring commutators ensure the direction of the current
    in the coil is reversed each half turn.


    When a current is passed to the coil through the brushes and split ring commutators,
    a rotating magnetic field is created that interacts with the differing fields
    of the magnets in the stator to create a turning force (torque), which causes
    the armature (coil) to rotate.


    Figure 3.3 shows the internal structure of a simple DC motor.


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_88_0.png)


    Figure 3.3 – Internal structure of a simple DC motor


    We will go into further details of a DC motor in Chapter 4, Overview Of AC and
    DC Motors.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Alternating current motors


    **Alternating current** (AC) motors convert electrical energy (through AC) to
    mechanical energy (motion). Unlike a DC motor, which makes use of DC as its energy
    source, an AC motor uses AC as its energy source. AC motors generally consist
    of two main parts, which are the stator and rotor.


    The stator is a stationary part with coils supplied with AC. The flow of the AC
    in the stator coil creates a rotating magnetic field. The rotor is the rotating
    part and is attached to an output shaft. The rotor also produces its own rotating
    magnetic field through the induced current from the stator or other means. The
    interaction between the rotating magnetic field of the stator and the field of
    the rotor creates a turning force that causes rotation. An AC motor can be single-phase
    or three-phase. A single-phase AC motor uses a single-phase supply (live and neutral)
    while a three-phase AC motor uses a three-phase supply (L1, L2, and L3). *Chapter
    4, Overview of AC and DC Motors*, contains more information on AC motors.


    The following figure shows an **AC induction motor**:'
  merge: -1
  img_proc: true
- pgno: 90
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_90_0.png)


    Figure 3.4 – AC induction motor


    The credit for this image goes to *Wikimedia Commons* and can be found at the
    following link: https://creativecommons.org/licenses/by-sa/4.0/deed.en


    # Stepper motor


    A **stepper motor** is a type of DC motor that rotates in steps. It does not turn
    arbitrarily when its terminal is connected to a source, rather it turns in steps.
    It also consists of a stator and a rotor. The stator consists of windings (coils)
    while the rotor is usually made of a permanent magnet. Activating the windings
    of the stator step by step in a particular order will create a turning force as
    the electromagnetic poles of the stator winding react with the poles of the permanent
    magnet of the rotor.


    The following figure shows a stepper motor:'
  merge: -1
  img_proc: true
- pgno: 91
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_91_0.png)


    Figure 3.5 – Stepper motor


    The credit for this image goes to *Wikimedia Commons* and can be found at the
    following link: https://creativecommons.org/licenses/by-sa/4.0/deed.en


    # Servo motor


    A **servo motor** is a rotary actuator that can rotate with high efficiency and
    great precision. It is good for rotating objects at some specific angle or distance.
    They are commonly used in robotics and automation technology. They consist of
    a control circuit that provides feedback on the current position of the shaft.
    The feedback signal from the control circuit enables the motor to control the
    rotational or linear speed and position. Servo motor types include DC servo motors
    and AC servo motors, amongst other types. A **DC servo motor** is powered by a
    DC supply. Common DC servo motors used in toys and other robotics-related products
    consist of a DC motor, gears, a potentiometer, and a control circuit that ensures
    it turns at a specific angle via a control signal.


    The following diagram shows the main parts of a common DC servo motor:'
  merge: -1
  img_proc: true
- pgno: 92
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_92_0.png)


    Figure 3.6 – Internal parts of a DC servo motor


    An AC servo motor is powered by an AC supply. It has an encoder and is used with
    controllers to provide feedback and close-loop control. The following diagram
    shows some of the parts of an AC servo motor:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_92_1.png)


    Figure 3.7 – AC Servo motor parts'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Other forms of electrical actuators include solenoid, electro-mechanical relay,
    and contactor, among others. Let''s have a look at what each of them is in the
    next sections.


    A **solenoid** can be referred to as a device that converts electrical energy
    into mechanical energy (motion). It consists of a coil of wire, plunger, and spring.
    The coil is formed in such a way that the plunger can move in and out of the coil''s
    body. When a current passes through the coil, a magnetic field is created and
    is used to create a linear or angular motion depending on the type. The spring
    returns the plunger back to its original position when power is removed. In *Figure
    3.8*, when current flows through the coil, an electromagnetic field is generated,
    which pulls the plunger inward. The spring pushes it to its original position
    when power is removed.


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_93_0.png)


    Figure 3.8 – Parts of solenoid'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'A solenoid is used in an automated system to create *motion*. The system can
    be applied to open or close a valve as shown in the solenoid valve in the following
    diagram:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_94_0.png)


    Figure 3.9 – Solenoid valve


    In *Figure 3.9*, when current flows through the coil, the magnetic field of the
    energized coil pulls the plunger to open the valve. When the power is removed,
    the coil becomes de-energized and the spring forces the plunger to close the valve.
    Solenoid valves are useful for controlling the flow of compressed air into a *pneumatic
    cylinder* or the flow of hydraulic fluid into a *hydraulic cylinder*. Other applications
    of solenoid valves include a door'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'locking system that offers secure door closure and a pusher on a conveyor belt
    diverting an object or package to a specific location.


    # Electro-mechanical relay


    An **electro-mechanical relay** is an electrically operated switch that can open
    or close a circuit with the physical movement of a contact. It can be referred
    to as a switch that is operated electrically, unlike the manual or mechanically
    operated switch explained in *Chapter 2*, *Switches and Sensors – Working Principles,
    Applications, and Wiring*. The following diagram shows the internal structure
    of a relay:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_95_0.png)


    Figure 3.10 – Internal structure of a relay'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'It consists of a **coil** (electromagnet), a **moveable contact**, **stationary
    contacts**, and a **spring.**


    When the relay coil is energized by allowing a current to flow through the terminal,
    the moveable **contact (C)** will be attracted towards the **normally open (NO)**
    of the stationary contact, making them contact each other. When the power is removed,
    the moveable contact returns to the **normally closed (NC)** position. The moveable
    contact and the fixed contact can act as a switch for equipment that needs power,
    as shown in the following diagram:


