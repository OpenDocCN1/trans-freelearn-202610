    Next, we will look at each float switch mentioned in this section.


    # Normally closed float switch


    In a normally closed float switch, the electrical circuit is closed in a downward
    position and opened in an upward position. So, with gravity pulling it down, it
    is closed; as the liquid level rises to the preset level, it will open, as shown
    in the following diagram:'
