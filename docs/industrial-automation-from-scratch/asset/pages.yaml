- pgno: 311
  md: 'Congratulations! You have successfully completed Chapter 8 of this book. The
    chapter explained the software part of PLC. You should now be able to differentiate
    between various programming languages. You should also be able to explain programming
    devices, programming software, the basics of LD, and so on. An industrial automation
    engineer needs to be aware of the elements of LD and the rules for LD programming,
    which was well explained in this chapter. You should now be familiar with Siemens
    programming software (TIA Portal) and be able to use it to write some basic PLC
    programs using the most common PLC programming language (LD).


    The next chapter will further discuss PLC programming. You will learn how to simulate
    your program, how to download program to a live PLC and also how to write programs
    that are more advanced than the ones learned in this chapter.


    # Questions


