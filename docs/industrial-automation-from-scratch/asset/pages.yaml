- pgno: 68
  md: '# Temperature switch


    A **temperature switch** is a switch that opens or closes when the temperature
    reaches a setpoint or falls below a setpoint. The design of a temperature switch
    consists of two parts:


    +   - **Sensor**: This can be a sensing bulb filled with a fluid – liquid, gas,
    or a bimetallic strip. It''s usually immersed in the process whose temperature
    is to be controlled.

    +   - **Snap-action contacts**: These switch the electrical power of the device
    controlling the temperature of the process on or off.


    There are various types of temperature switches, including bimetallic strip temperature
    switches and liquid-filled temperature switches.


    A **bimetallic strip temperature switch** is one of the most common temperature
    switches. It consists of a thin rectangular strip formed of two dissimilar metals
    that are bonded back to back. The two dissimilar metals experience dissimilar
    thermal expansion rates. Hence, when the temperature increases, one metal will
    expand faster than the other. This causes the strip to bend. The bending strip
    is used to activate a snap action switch that opens or closes a circuit.


    The following diagram shows a simple bimetallic strip temperature switch:'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_69_0.png)


    Figure 2.37 – A bimetallic strip temperature switch


    A liquid-filled temperature switch (capillary thermostat) consists of a fluid
    encapsulated in a metal tube (bulb and capillary). The fluid expands or contracts
    when the temperature changes. The change in fluid moves the head, which triggers
    a snap action switch, either opening or closing the circuit.


    The following diagram shows a capillary thermostat (a liquid-filled temperature
    switch):'
  merge: -1
  img_proc: true
- pgno: 70
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_70_0.png)


    Figure 2.38 – A capillary thermostat temperature switch


