- pgno: 361
  md: '+   - **Network 1:** This is a simple start and stop program to start and stop
    the system. Refer to the explanation of network 1 in the previous section to understand
    how it works. When the start push button is pressed and released, M0.0 will be
    energized, and it will remain energized until the stop push button at I0.1 is
    pressed.

    +   - **Network 2:** M0.0, which will be energized in network 1 when the start
    button is pressed and released, will cause the normally open contact with the
    address M0.0 to close, and since I0.2 (address of the fill position sensor) and
    I0.2 (address of the cap position sensor) are normally closed, Q0.0 (address of
    the conveyor motor) will be energized and the conveyor motor will start running.
    When the fill position sensor detects a bottle, it will turn ON and this will
    make I0.2 to open and cause the motor to stop at that position until timer1 (filling
    time) elapses and close the normally open contact (timer1) in parallel to I0.2
    to create an alternative path for the signal to flow to coil Q0.0 to keep the
    conveyor running. When the cap position sensor detects a bottle, it will turn
    ON, this will make I0.3 to open and cause the motor to stop at that position until
    timer2 (capping time) elapses and close the normally open contact (timer2) in
    parallel to I0.3 to create an alternative path for the signal to flow to coil
    Q0.0 to keep the conveyor running.

    +   - **Network 3:** When the normally open contact with the address M0.0 is closed
    due to the start button being pressed and released, and the normally open contact
    with the address I0.2 is closed due to the fill position sensor that detects a
    bottle, a 10-second timer (timer1) will start and, at the same time, an output
    with the address Q0.1 will be energized. Hence, the valve connected to Q0.1 will
    open to fill the bottle. The valve will close after 10 seconds due to the normally
    closed contact (timer1) that is in series with the coil with the address Q0.1
    opening when timer1 is energized after 10 seconds.

    +   - **Network 4:** When the normally open contact with the address M0.0 is closed
    due to the start button being pressed and released, and the normally open contact
    with the address I0.3 is closed due to the cap position sensor that detects a
    bottle, a 4-second timer (timer2) will start and, at the same time, an output
    with the address Q0.2 will be energized. Hence, the capping machine connected
    to Q0.2 will start to'
  merge: -1
