    Let''s start by looking at brushed DC motors.


    # Brushed DC motors


    Brushed DC motors are used for simple control systems. They consist of a stator,
    rotor, commutator, brushes, and so on, and the brushes are usually made of carbon.
    A magnetic field is produced by passing a current through the commutator and the
    brush connected to the rotor. One of the drawbacks of a brush motor is the wear
    and tear of brushes. Types of brushed DC motor include the following:


    +   - Permanent magnet

    +   - Series wound

    +   - Shunt wound

    +   - Compound wound


    Let''s understand each of these in detail in the following sections.


    # Permanent magnet DC motors


    This type of motor does not have a field winding on the stator, rather, it uses
    a permanent magnet to create the magnetic field of the stator, which the rotor
    field reacts with to produce the turning force that causes rotation.


    The following figure shows a simplified circuit diagram of a permanent magnet
    DC motor:'
  merge: -1
  img_proc: true
- pgno: 135
