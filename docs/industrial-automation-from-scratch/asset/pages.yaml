    Figure 3.18 shows a practical application of a single-acting cylinder (also known
    as a **pneumatic hammer** or **jack drill**). It''s a pneumatic tool that combines
    a hammer and a chisel and is used to break apart rocks, asphalt, and concrete.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_104_0.png)


    Figure 3.18 – Pneumatic drill or jack hammer


    In a **double-action cylinder**, there are two ports, one at each end of the cylinder.
    The first application of air through one of the ports pushes the piston forward
    while the second application of air through the other port pushes the piston back
    into its original position. This does not require a spring since air can be applied
    at each end to make the piston move forward or backward.


    The following diagram shows the symbol of a double-acting cylinder:'
