    diagram.


    When the start push button is pressed and released, the conveyor motor should
    start running until the bottle gets to the fill position sensor; in other words,
    the fill position sensor detects the bottle and the conveyor motor stops.


    The fill valve should open as soon as the conveyor motor stops at the fill sensor
    for 10 seconds to fill the bottle. After 10 seconds, the valve should close and
    the conveyor motor should continue running until the bottle gets to the cap position
    sensor, in other words, the cap position sensor detects the bottle and the conveyor
    motor stops.


    The capping machine should start as soon as the conveyor motor stops at the cap
    sensor for 4 seconds to cap the bottle. After 4 seconds, the capping machine should
    stop and the conveyor motor should continue running.


    When the bottle gets to the job out sensor, a counter should increment by one
    and the bottle should drop to the wrapping machine. When the number of bottles
    detected by the job out sensor reaches 6, in other words, when the counter increments
    to 6, the wrapping machine should start to wrap the 6 bottles and stop after 5
    seconds.


