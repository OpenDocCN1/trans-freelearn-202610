- pgno: 313
  md: '# Deep Dive into PLC Programming with TIA Portal


    In the previous chapter, we learned the fundamentals of PLC programming, which
    include PLC programming languages, PLC programming devices, PLC programming software,
    Ladder Diagram basics, elements of Ladder Diagrams (ladder logic programs), rules
    for Ladder Diagram programming, downloading and installing TIA Portal V13 Professional
    and PLCSIM, and how to create a project and write some programs with the programming
    software (TIA Portal).


    In this chapter, you will dive deeper by practicing how to use the programming
    software you downloaded and installed in the previous chapter. This chapter also
    includes a simulation of programs, which will enable you to see the result of
    the programs you have written right there on your PC or laptop even when you don’t
    have the real PLC to test or practice.


    We are going to cover the following main topics in this chapter:


    +   - Opening a saved program

    +   - Simulating programs with Siemens TIA Portal using PLCSIM

    +   - Latching and unlatching in PLC programming

    +   - Using an output address as an input in a program

    +   - Using the SET and RESET instructions

    +   - Using the timer instruction

    +   - Using the counter instruction

    +   - Using the move instruction

    +   - Using the compare instructions

    +   - Level control using PLC'
  merge: -1
