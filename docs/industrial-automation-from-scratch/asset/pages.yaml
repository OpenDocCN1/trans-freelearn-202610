    Figure 9.30 – Wiring to implement a latch and unlatch program with a normally
    open push button for starting and a normally closed push button for stopping


    The preceding wiring diagram shows the start push button (normally open) connected
    to I0.4, and the stop push button (normally closed) connected to I0.5. A load,
    which can be the coil of a contactor, is connected to Q0.2.'
