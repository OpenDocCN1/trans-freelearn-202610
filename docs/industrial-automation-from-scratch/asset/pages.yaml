  merge: -1
  img_proc: true
- pgno: 49
  md: 'The **switch body** contains the electrical contacts. The **actuator** is the
    part of the limit switch that contacts the target and moves to cause connection
    or disconnection in the electrical contacts. The **operating head** is where the
    rotation occurs, and it consists of a mechanism that connects or disconnects the
    electrical contacts.


    Limit switches have two basic electrical contact configurations – **Single Pole,
    Double Throw (SPDT)** and **Double Pole, Double Throw (DPDT)**. SPDT consists
    of one normally open and one normally closed contact, while DPDT consists of two
    normally open and two normally closed contacts.


    The following diagram illustrates the basic contact configuration of a limit switch:'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_50_0.png)


