  md: 'connected to Q0.3 will be ON.


    If we edit the program by replacing the normally open contact with the address
    Q0.2 with a normally closed contact (NC), as shown in the following screenshot,
    the program will behave differently, as explained next.


    Anytime Q0.2 is ON, the normally closed contact with the address Q0.2 will be
    opened since the coil with the address Q0.2 is energized, and PL3 connected to
    Q0.3 will be OFF.


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_338_0.png)


    Figure 9.33 – Output address (Q0.2) used for a normally closed (NC) contact at
    the input


    We’ve just learned how an output address can be used as input. This is another
    important technique in PLC programming. Let’s proceed to learn the SET and RESET
    instructions in the next section.


    # Using the SET and RESET instructions


    The SET and RESET instructions are two important instructions used in ladder diagram
    programming. They are both output (coil/assignment) instructions.


    The SET coil is energized when power is supplied to it via an input (switch, sensor,
    or push button) and it remains SET (ON) even when the switch, sensor, or push
    button that supplied power to it is OFF until it is reset.'
  merge: -1
  img_proc: true
