    # Understanding proximity sensors (capacitive, inductive, and photoelectric)


    **Proximity sensors** are commonly used in industrial applications.

    Knowledge of proximity sensors can help you understand other types of sensors.


    Proximity sensors detect the presence or absence of objects using electromagnetic
    fields, light, or sound. There are various types, each suited to a specific environment
    or application.


    The available types of proximity sensors are as follows:


    +   - Inductive proximity sensors

    +   - Capacitive proximity sensors

    +   - Photoelectric proximity sensors


    In the next few sections, we are going to discover each of these proximity sensors.


    # Inductive proximity sensor'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'This is a *non-contact sensor* that detects ferrous metals, such as *carbon
    steel, stainless steel, and cast iron.*


    An inductive proximity sensor consists of a **coil, oscillator, detection circuit**,
    and **output**. The oscillator provides an *oscillating magnetic field* that radiates
    around the winding of the coil, which is located at the sensor''s surface. When
    a ferrous metal gets near the magnetic field, a small current (eddy current) is
    induced on the metal''s surface. This small current changes the natural frequency
    of the magnetic circuit, which, in turn, reduces the oscillating amplitude. The
    detection circuit monitors the amplitude of the oscillation and triggers an output
    from the *output circuitry* when the oscillation becomes reduced to a sufficient
    level.


    If the sensor has a *NO* configuration, it will produce an *ON* signal when a
    metal enters the sensing region. With an *NC* configuration, its output is an
    *OFF* signal when the metal enters the sensing region. This output can be read
    by a programmable logic controller (PLC) or other form of controller that will
    convert the *ON* or *OFF* state into useable information.


    The following diagram shows the main circuits in an inductive proximity sensor:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_72_0.png)


    Figure 2.40 – Inductive proximity sensor


    Now that we have explored what an inductive proximity sensor is, we will investigate
    the definition of a capacitive proximity sensor, which you'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'should understand with ease due to the knowledge you have taken from this section.
    Let''s dive right in.


    # # Capacitive proximity sensor


    This is a *non-contact sensor* that detects both metallic and non-metallic objects
    in the form of powder, granulate, liquids, and solids.


    Capacitive sensors act like capacitors. They make use of the electrical properties
    of capacitance and the change of capacitance based on a change in the electrical
    field around the active face of the sensor.


    A metal plate in the sensing face of the sensor acts as the first plate of a capacitor,
    and it''s electrically connected to an internal oscillator circuit. The object
    to be sensed acts as the second plate of the capacitor.


    The external capacitance between the target and the internal sensor plate forms
    a part of the feedback capacitance in the oscillator''s circuit. As the target
    approaches the sensor''s face, the oscillations increase until they reach a threshold
    level and activate the output.


    The following diagram shows the main circuits in a capacitive proximity sensor:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_73_0.png)


    Figure 2.41 – Capacitive proximity sensor'
  merge: -1
  img_proc: true
