  md: '# # Launching PCSCHEMATIC Automation and exploring the screen elements


    In this section, we will learn how to launch PCSCHEMATIC Automation and also explore
    the screen elements. Let’s start by learning how to launch the application.


    # ## Launching the application


    Follow these steps to launch PCSCHEMATIC Automation:


    +   1. From the **Start** menu, locate **PCSCHEMATIC Automation**.

    +   2. Click **PCSCHEMATIC Automation** to start the application.


    # ## Exploring the screen elements


    The following screenshot shows the PCSCHEMATIC Automation interface, showing some
    of the important elements:'
  merge: -1
  img_proc: true
- pgno: 184
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 185
  md: '+   - **Explorer window:** The explorer window gives direct access to the `Symbol
    Menu` where you can select symbols you need in your drawing. You also have direct
    access to the component database where you can access all the components in the
    database. The explorer window also contains the **Project** tab where you can
    get information about all the opened projects.

    +   - **Work area:** This can be seen as the paper for your drawing. Drawings
    are done in the work area. You can specify the size in **Settings | Page setup**.

    +   - **Left toolbar:** The left toolbar contains the **Zoom** tool to magnify
    the work area, and the **Pan** tool to move the work area left, right, up, or
    down. It also includes other tools such as **Snap**, **Zoom to page**, and others.

    +   - **Survey window:** This is the black box that shows the part of the page
    you are currently viewing on the screen.

    +   - **Page tab:** This shows the name of a page and can be used to switch between
    pages.


    In this section, you have learned how to launch PCSCHEMATIC Automation and have
    also explored the screen elements, which include the title bar, menu bar, program
    bar, command bar, pick menu, explorer window, work area, left toolbar, survey
    window, and page tab. You need to be familiar with the screen elements to be able
    to understand other sections of this chapter. In the next section, we will learn
    how to create and save a project in PCSCHEMATIC Automation.


