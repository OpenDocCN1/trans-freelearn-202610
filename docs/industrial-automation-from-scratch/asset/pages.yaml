    fills a tank


    In the preceding diagram, when the water level is low, the float switch will close,
    and the power will flow to the pump and the pump will begin to fill the tank.
    As the water level rises, the float switch will become open at a preset point,
    and the pump will stop.


    # Normally open float switch


    In a normally open float switch, the electrical circuit is open in the downward
    position and closed in the upward position. So, with gravity pulling it down,
    it is open, and as the liquid level rises to the preset level, it will close:'
