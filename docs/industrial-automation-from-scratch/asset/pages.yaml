  md: '# Overview of AC and DC Motors


    Electric motors are generally used to convert electrical energy into mechanical
    energy. Mechanical energy can be used to move an electric car, rotate a fan, and
    so on. An electric motor can be referred to as an actuator that converts electricity
    into motion. Hence, it is an electric actuator. Electric motors are very common
    in our homes. You will find them in most appliances, such as ceiling fans, standing
    fans, washing machines, microwaves, electric blenders, electric can openers, toys,
    and so on.


    In industry, they are widely used for pumps, blowers, mixers, agitators, conveyors,
    and so on. The use of electric motors in various equipment and machines in homes
    and industry has proven them to be among the most important electrical inventions
    of all time. Electric motors may be classified by their source of power, construction
    method, application, and the types of motion they produce. The following block
    diagram shows a simple classification of electric motors:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_116_0.png)


    Figure 4.1 – Block diagram showing basic types of electric motors


    This chapter will explain various electric motors, such as AC motors, DC motors,
    servo motors, and stepper motors, used in industrial automation. You will learn
    about the basic types of electric motors, the differences'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'between synchronous and asynchronous motors, and the wiring of asynchronous
    (induction) motors in a star or delta connection. The chapter also covers the
    differences between star and delta connections and direct online starters, including
    components such as a circuit breaker, contactor, and overload relay. Electric
    motors play a big role in industry. It is therefore necessary for automation engineers
    to have a good knowledge of them.


    In this chapter, we are going to cover the following main topics:


    +   - Understanding AC motors

    +   - Understanding DC motors

    +   - Understanding stepper motors and servo motors


    # # Understanding AC motors


    An AC motor is a type of electric motor that is powered by **alternating current
    (AC)** supplied from a power grid or other AC electricity source. Check out *Chapter
    3, Actuators and Their Applications in Industrial Automation*, to learn about
    the basic construction of an AC motor. Here, we will be looking at the various
    types of AC motors, which include the following:


    +   - Synchronous AC motors

    +   - Asynchronous AC motors (induction motors)


    Let''s start by understanding the synchronous AC motor.


    # ## Synchronous AC motors


    In a synchronous motor, the stator winding (winding fitted in the stator) is usually
    connected to a three-phase AC supply. The AC supplied to the stator establishes
    a rotating magnetic field in the stator and it rotates at synchronous speed. The
    rotor is supplied with **direct current (DC)** to make'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'it act as a permanent magnet. Sometimes, the rotor can be made of permanent
    magnets. Supplying DC to the rotor or making it a permanent magnet makes its magnetic
    field stationary (that is, the north and south poles are fixed).


    As the magnetic field of the stator rotates, its poles attract the opposite poles
    of the rotor and this creates a turning force that causes the rotor to rotate
    at the same speed as that of the rotating magnetic field (synchronous speed).
    The term synchronous motor means that the speed of the rotor of the motor is the
    same as the speed of the rotating magnetic field of the stator.


    The synchronous speed of an AC motor is the speed of the rotating magnetic field.
    It is determined by the frequency of the voltage source and the number of poles,
    as shown in the following formula:


    Synchronous speed = 120f/P


    Where f = frequency in Hz and P = number of poles.


    Synchronous motors can be used for applying constant speed from no load to full
    load. They are good for use in high-precision applications in industry and are
    also well suited for robotic actuators.


    The following diagram shows a synchronous motor:'
  merge: -1
  img_proc: true
- pgno: 119
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_119_0.png)


    Figure 4.2 – Synchronous motor


    Next, let''s check how an asynchronous motor works.


    # Asynchronous AC motors (induction motors)


    In an asynchronous motor, the stator winding is usually connected to a three-phase
    AC supply. The AC supplied to the stator establishes a rotating magnetic field
    in the stator and it rotates at synchronous speed. The rotor is not directly connected
    to a supply (that is, there is no electrical connection to the rotor). The rotor
    current required to produce a turning force is obtained by the electromagnetic
    induction from the magnetic field of the stator according to Faraday''s law of
    electromagnetic induction, which states that a current will be induced in a conductor
    placed in a changing magnetic field.


    An induction motor can simply be referred to as a motor that works on the principle
    of electromagnetic induction. Electromagnetic induction is the phenomenon in which
    current is induced in a conductor placed in a'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'changing magnetic field according to Faraday. The following diagram shows a
    current induced in coil 2 due to a changing magnetic field caused by the AC supply
    in coil 1. Coil 2 is placed in the changing magnetic field. Hence, current will
    be induced in the coil (coil 2) according to Faraday:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_120_0.png)


    Figure 4.3 – Current induced in coil 2 due to a changing magnetic field caused
    by the AC supply in coil 1


    The interaction between the rotating magnetic field of the stator and the magnetic
    field of the rotor creates a turning force that causes the rotor to rotate, but
    the rotor never runs at the same speed as that of the rotating magnetic field
    of the stator. An induction motor usually operates more slowly than synchronous
    speed (the speed of the rotating magnetic field of the stator) since rotation
    at synchronous speed would result in no induced current in the rotor.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'The difference between the rotor''s speed and the speed of the rotating magnetic
    field of the stator is referred to as slip. One major fact about induction motors
    is that the rotor current is created by induction instead of being separately
    excited as in synchronous motors or being self-magnetized using a permanent magnet.


    The following diagram shows a three-phase asynchronous (induction) motor:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_121_0.png)


    Figure 4.4 – Three-phase asynchronous (induction) motor


    Depending upon the power supply input, there are basically two types of induction
    motor, which include single-phase and three-phase. Three-phase induction motors
    are more commonly used in manufacturing and other industries. They have a high
    starting torque, low costs, low maintenance costs, and are durable. They can be
    used in conveyors, pumps, blowers, mixers, lifts, crushers, and so on.


