- pgno: 106
  md: 'A **pneumatic rotary actuator** rotates rather than moving in a straight line.
    Hence the name *rotary* is given to it. They can be designed to mount onto a valve
    that requires the rotation of their stem to open or close the valve remotely or
    automatically via a *control signal*.


    It consists of an air chamber on one or both sides of a piston or *diaphragm*.
    An increase in the air pressure pushes the piston to create a linear or *circular*
    motion. If the motion created is linear, gears or a cam (a machine component used
    to convert rotary motion into linear motion or vice versa) is used to convert
    the linear motion to circular motion internally.


    The following figure gives you an idea of what a pneumatic rotary actuator looks
    like if you are curious:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_106_0.png)


