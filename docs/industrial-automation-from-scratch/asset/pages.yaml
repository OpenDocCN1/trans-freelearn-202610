  md: 'operated switch, which is operated by hand or by a human operator. They are
    used in situations where automatic control is required. The switch operates automatically
    by pressure, temperature, or position via a mechanism in the switch. They can
    also be referred to as sensors.


    A mechanically operated switch takes the place of a *human operator*. Some examples
    of this type of switch are as follows:


    +   - Limit switch

    +   - Level switch

    +   - Pressure switch

    +   - Temperature switch


    Let''s have a look at each.


    # Limit switches


    This is a switch that is operated by the motion of a machine part. It operates
    when a predetermined limit is reached. The standard limit switch is a mechanical
    device that uses physical contact to detect the presence or absence of an object.
    It consists of a switch body, an actuator, and an operating head.


    The following diagram shows a limit switch and its parts:'
  merge: -1
  img_proc: true
