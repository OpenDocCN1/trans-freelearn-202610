- pgno: 364
  md: '# # Understanding Human Machine Interfaces (HMIs)


    The previous three chapters covered a great deal on **Programmable Logic Controllers
    (PLCs)**, which are the brains behind most automated machines. We learned how
    to automate industrial processes using PLCs, sensors, and actuators. However,
    in most cases, PLCs, sensors, and actuators alone cannot give us the functionality
    required in a real-life industrial process. A **Human Machine Interface (HMI)**
    is usually integrated into a manufacturing line and other industrial processes
    to give users easy control of the machines and to give them feedback on machine
    statuses.


    In the previous chapter, we learned how to control machines using PLCs, whereby
    the user or operator presses a push button to start the machine and a pilot light
    gives an indication of whether the machine is running or not. Integrating HMIs
    into such systems makes them more user-friendly. HMIs allow you to start or stop
    your machine and even get feedback or status updates for the machine through a
    graphical interface or touchscreen.


    In this chapter, you will learn about HMIs and how to interface them with PLCs
    to give commands to machines and also get feedback from machines. You will use
    TIA Portal to create an HMI screen for monitoring and control. You will learn
    how to simulate your HMI program (a good way to test your HMI program without
    a real HMI panel) and you will also learn how to download a designed HMI graphic
    to a real HMI panel (Siemens HMI - (KTP400) for a real-life application.


    We are going to cover the following topics in this chapter:


    +   - Introducing HMIs

    +   - Exploring the applications of HMIs

    +   - Understanding HMI programming and development'
  merge: -1
  img_proc: true
- pgno: 365
  md: '+   - Understanding HMI programming software

    +   - Exploring HMI manufacturers and their programming software

    +   - Interfacing PLCs and HMIs

    +   - Downloading programs to PLCs and HMIs


    # Technical requirements


    You will need an understanding of PLCs, sensors, and actuators from the previous
    three chapters.


    Ensure you have downloaded and installed TIA Portal V13 on your PC or laptop.
    Please refer to Chapter 8, Understanding PLC Software and Programming with TIA
    Portal.


    Other devices that may be required include Siemens HMI (KTP400) and Siemens PLC
    (S7 1200, CPU 1211C, AC/DC/RLY).


    # Introducing HMIs


    HMIs can be seen as graphical interfaces that allow humans and machines to interact.
    We have learned that PLCs can control and automate industrial machines. HMIs,
    on the other hand, allow humans to interact or communicate with machines. No matter
    how we automate a process, we still need a human (an operator) to start or initiate
    the process, perform other functions, and get feedback on the machine’s operation.


    HMIs allow humans to give commands to PLCs to control a process and also receive
    feedback from PLCs about the process. With HMIs, the human operator can interact
    with, monitor, and control machines via the PLC. The HMI is usually connected
    to the PLC via a communication cable, depending on the protocol being used (Ethernet/IP,
    Profinet, Profibus, or Modbus). This chapter does not discuss protocols. We will
    look into protocols in Chapter 13, Industrial Network and Communication Protocols
    Fundamentals. However, we will use Profinet as the protocol to establish'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'communication between the HMI and PLC. Basically, the PLC connects to the machine
    or sensors and actuators via cables, as we learned in *Chapter 7*, *Understanding
    Programmable Logic Controllers – Part 1*, where we discussed PLC wiring. The following
    diagram depicts the human operator, HMI, PLC, and machine, as well as the communication
    flow between them:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_366_0.png)


    Figure 10.1 – Human operator, HMI, PLC, and machine


    The HMI is not peculiar to manufacturing and other industrial settings alone.
    There are many HMIs that we have and even use regularly without knowing them as
    HMIs. For instance, some cars have a touchscreen interface through which the driver
    or passenger can control the air conditioning, heating, sound, and other systems.
    These touchscreens are HMIs. The driver or passenger is able to interact with
    the machine via the touchscreen-enabled interface. An HMI is simply an interface
    (usually graphical) through which a human can control a machine. It can also be
    referred to as a **Man-Machine Interface (MMI)**, **Operator Interface Terminal
    (OIT)**, or **User Interface (UI)**. HMIs are designed to ensure that operators
    can monitor or control machines easily. HMIs are also designed to ensure operators
    can monitor alarms and respond accordingly. Various colors can be used to represent
    the level of priority of the alarms. HMI alarms give information about important
    events and faults. Another good thing about HMIs is trend. Trend can be referred
    to as a graphical representations of data over a period of time. HMIs allow you
    to monitor or view the data from sensors over a period of time in a graphical
    interface.'
  merge: -1
  img_proc: true
- pgno: 367
  md: 'HMIs also support setpoint management. HMIs can be designed and programmed
    to allow operators to change setpoint values easily from a graphical interface.


    HMIs comprise both hardware and software that allow communication between a human
    operator and machines.


    The following figure shows an HMI that can be used by an operator (user):


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_367_0.png)


    Figure 10.2 – HMI showing the GUI through which the user can interact with the
    machine or process


    Credit for this image goes to Wikimedia Commons:

    https://creativecommons.org/licenses/by-sa/4.0/deed.en'
  merge: -1
  img_proc: true
- pgno: 368
  md: 'An HMI replaces switches and other forms of controls and status indicators
    connected to a PLC with a graphical interface, which is usually a touchscreen,
    as shown in the preceding figure. HMIs allow human operators to monitor a process,
    start or stop the process, adjust setpoint, and perform other control functions
    that require human attention.


    # Exploring the applications of HMIs


    HMIs are used in almost all industries. Some industrial areas of application include
    the following:


    +   - **Food and beverages**: HMIs can be used to easily monitor and control production
    processes to ensure quality in the food and beverages industry. HMIs allow recipes
    to be used in production. “Recipes” simply refers to data or values that can be
    selected by a user depending on the type of product that is to be produced. Recipes
    summarize production data or machine configurations for a particular product.
    The data is then transferred from the HMI to the PLC or controller at a given
    time to switch production to another product type. Recipes are used when multiple
    products are to be produced. Recipes are not only advantageous in the food industry;
    they are also of great benefit in other industries that produce multiple products.

    +   - **Oil and gas**: HMIs provide a means by which drilling and rig operators
    can control and monitor their applications in the field in real time. HMIs also
    help in other areas of oil and gas, such as refining and pipeline integrity management.

    +   - **Power**: HMIs can be used in substations and other areas of the power
    system to execute switching and other control operations easily.

    +   - **Wastewater management systems**: HMIs are used in wastewater treatment
    to view all aspects of the treatment system, including pH, chemical usage, and
    tank levels.

    +   - **Transportation**: The performance, efficiency, and safety of public transportation
    systems can be improved through interaction between humans and machines, which
    HMIs enable.'
  merge: -1
  img_proc: true
- pgno: 369
  md: 'We have just learned about HMIs and their application in various industries.
    We will learn about HMI programming and development in the next section.


    # Understanding HMI programming and development


    HMI programming involves the creation of the visual representation (graphic) of
    the machine operation, control commands, and writing codes to execute required
    functions.


    The main purpose of an HMI is to allow the operator to control a machine or process.
    Hence, an HMI design must do the following:


    +   - Be easy for the user to have access to the necessary information and control.

    +   - Allow the user to navigate to different areas as quickly as possible.

    +   - Allow the user or operator to see the current status of the machine. The
    operator must be able to tell whether the machine is running or has stopped through
    visual indication on the HMI. Other information that can help the operator to
    make the right decision can also be provided.


    Let’s proceed to learn about HMI programming software in the next section.


    # Understanding HMI programming software


    HMI programming software is special software used for designing the graphical
    interface and writing some code where necessary for the interaction between the
    user (human) and the machine. The software is usually installed on the PC where
    programming will be done before it is'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'downloaded to the HMI panel via a communication cable, just as we do for PLCs.


    There are different kinds of programming software for different brands of HMI
    panels. The next section discusses various HMI manufacturers and their programming
    software.


    # # Exploring HMI manufacturers and their programming software


    Some of the popular HMI manufacturers are listed here:


    +   - **Siemens:** Siemens is a German company, one of the top companies in the
    automation industry, producing SIMATIC HMIs. Some of their HMI models include
    KTP400, KTP600, and KTP700. Their HMI programming software is WinCC.

    +   - **Rockwell Automation:** Rockwell Automation is one of the top companies
    in North America. Their HMI brand is called **PanelView**, which includes PanelView
    600, Panel View 800, and PanelView+400. The programming software for their HMIs
    includes RSView32 and FactoryTalk View.

    +   - **Schneider Electric:** Schneider Electric is one of the top companies in
    Europe. Their HMI brands include Magelis and Harmony. Their HMI programming and
    configuration software includes Ecostructure Operator Terminal Expert and Vijeo
    Designer.

    +   - **Mitsubishi Electric Corporation:** Mitsubishi Electric Corporation (MELCO)
    is a division of Mitsubishi. Their line of HMIs is called **Graphical Operator
    Terminal (GOT)**, for example, the GOT 1000 series and GOT 2000 series. Their
    HMI programming software is GTworks2 (GOT HMI designer software).


    We’ve just learned about some of the leading HMI manufacturers and their software.
    This book will focus on a Siemens HMI (KTP 400) and their'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'software (WinCC). We will learn how to connect a Siemens HMI (KTP400) to a
    PLC and how to use WinCC in TIA Portal to develop an HMI screen in subsequent
    sections.


    # # Interfacing PLCs and HMIs


    In *Chapter 9, Deep Dive into PLC Programming with TIA Portal*, we learned how
    to use pushbuttons to start and stop and also how to use a lamp as an indicator
    that shows when a load is on or off.


    As we discussed earlier, HMIs allows human operators to interact with machines
    via a PLC. This means that a PLC is required to communicate with the machine.


    Here, in this section, we will learn how to interface a Siemens HMI (KTP 400)
    and a Siemens PLC using Profinet as a communication protocol. We will use TIA
    Portal to program the PLC and develop the HMI application using WinCC, which was
    installed when we installed TIA Portal in *Chapter 8, Understanding PLC Software
    and Programming with TIA Portal*.


    By the end of this section, you should be able to interface PLCs and HMIs such
    that the HMI can be used to start and stop and get feedback on the status of a
    machine (for example, a motor).


    We are already familiar with the Siemens S7 1200 PLC (CPU 1211C). The following
    photo shows a Siemens HMI (KTP 400):'
  merge: -1
  img_proc: true
