- pgno: 505
  md: '# Table 12.5 – Other ISA symbols


    More information is available in the *ISA5.1, Instrumentation symbols and identification*
    document.


    We have just learned about the ISA symbology. This knowledge will help us interpret
    P&ID diagrams. Learn more using the *ISA5.1, Instrumentation symbols and identification*
    document and other resources available online.


    In the following section, you will learn about the measurement of various quantities
    (temperature, pressure, level, and flow) and their associated transmitters.


    # Temperature measurement and transmitters


    Temperature is the measure of the degree of hotness or coldness of something.
    Temperature measurement is an important task in the process industry and can be
    achieved with the aid of a sensor and transmitter. Common sensors are **resistant
    temperature detectors (RTDs)** and **thermocouples.**


    An RTD is a device whose resistance changes as the temperature changes. It has
    a temperature range of -260 to 850 degrees Celsius. It has better sensitivity
    than a thermocouple but it is more expensive. The types of RTD sensors, when categorized
    by the resistant element material, are Pt100, Pt1000, Ni120, and Cu100. The letters
    represent the material of the element while the number represents the resistance
    at 0 degrees Celsius. Pt100 is the most common RTD. The resistance element is
    Platinum and it has a resistance of 100 Ohms at 0 degrees Celsius.


    An RTD temperature sensor requires an RTD transmitter to produce a standard signal
    output (for example, 4 to 20 mA) as the resistance changes'
  merge: -1
  img_proc: true
- pgno: 506
  md: 'with the temperature. Figure 12.6 shows an RTD temperature transmitter for
    PT100. The temperature range is 0 to 300 degrees Celsius with an analog signal
    output of 4 to 20 mA. This means that the transmitter will produce 4 mA at 0 degrees
    Celsius and 20 mA at 300 degrees Celsius.


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_506_0.png)


    Figure 12.6 – An RTD temperature transmitter for PT100 (Credit: Showlight Technologies
    Ltd.: www.showlight.com.ng)


    Figure 12.5 shows how an RTD temperature sensor and RTD transmitter are wired.


    A thermocouple consists of two dissimilar wires joined together at one end to
    form a sensing joint. A voltage (in mV) is produced and varies as the temperature
    changes. It has a temperature range of -270 to 1800 degrees Celsius. The thermocouple
    temperature sensors available include Type K, Type J, type T, Type E, Type N,
    and Type S. Each type has a temperature range. Type K is the most common thermocouple
    temperature sensor with a temperature range of -270 to 1,260 degrees Celsius.


    A thermocouple temperature sensor requires a thermocouple temperature transmitter
    to produce a standard signal output (for example, 4 to 20 mA or 0 to 10 V), as
    the mV produced changes with temperature. Figure 12.7 shows a thermocouple temperature
    transmitter for a Type K thermocouple. The temperature range is 0 to 400 degrees
    Celsius with an analog signal output of 4 to 20 mA. This means that the transmitter
    will produce 4 mA at 0 degrees Celsius and 20 mA at 400 degrees Celsius.'
  merge: -1
