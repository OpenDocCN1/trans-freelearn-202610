- pgno: 66
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_66_0.png)


    Figure 2.33 – Cross-section of a pressure switch


    The *single pole single throw* form of a pressure switch can exist as NO and NC.


    In an *NO* type, the switch contacts are open (not connected) when no pressure
    is applied, and they close when the applied pressure is equal to the setpoint.


    In an NC type, the switch contacts are closed (connected) when no pressure is
    applied, and they open when the applied pressure is equal to the setpoint.


    Your choice of switch depends on the type of circuit you intend to drive with
    the switch.


