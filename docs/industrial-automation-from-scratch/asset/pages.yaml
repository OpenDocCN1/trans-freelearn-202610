    CPU1211C, AC/DC/Rly)


    We should now have basic knowledge of LD. Subsequent sections will give further
    knowledge that will help you to start programming PLCs using LD.


    # Exploring the elements of LD (ladder logic) program


    In order to write a program using LD. You need to understand the elements that
    make up a ladder program. The following elements make up an LD (ladder logic)
    program:


    +   Rails: These are the two vertical lines, one at the extreme left (hot rail)
    and the other at the extreme right. The vertical line at the extreme left is'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'called the hot rail while the one at the extreme right can be referred to as
    the neutral.


    +   - **Rungs**: These are horizontal lines that connect the two rails to complete
    a circuit. Power flows across the rung from the hot rail to the neutral rail.
    It connects the rails to the logic expression.

    +   - **Inputs**: The inputs are the NO and NC contact symbols representing input
    devices, such as a push button, selector switch, limit switch, or float switch,
    that are hardwired to the PLC. The state of the input devices connected to the
    PLC determines whether the NO or NC contact symbol will open or close in the program.

    +   - **Output**: The output is the coil symbol representing the output devices,
    such as a pilot lamp, relay, contactor, or solenoid valve, that are hardwired
    to the PLC.

    +   - **Logic expression**: This is the combination of input and output symbols
    to formulate the desired control function.

    +   - **Address notation and tag names**: The PLC uses an address to identify
    each input and output point where external devices (input and output devices)
    are connected in the PLC. Each point you connect an input device or output device
    to has an address that the PLC uses to identify it. The PLC also uses an address
    to identify internal/software-created devices, such as relays, timers, and counters.
    The addresses used by each manufacturer to identify inputs/outputs (inputs/output
    points) and software-created devices in their PLCs differ. A programmer needs
    to know the addressing or address notation used by a particular PLC manufacturer
    or model of PLC before programming it.


    Siemens, for instance, uses I to represent input and Q to represent output. We
    can basically have inputs as I0.0, I0.1, I0.2, and so on and outputs as Q0.0,
    Q0.1, Q0.2, Q0.3, and so on. Software-created relays/auxiliary relays in Siemens
    are M0.0, M0.1, M0.2, and so on. Mitsubishi uses X to represent inputs and Y to
    represent outputs. We can basically have inputs as X000, X001, X002, and so on
    and outputs as Y000, Y001, Y002, and so on. Software-created relays/auxiliary
    relays in Mitsubishi PLCs are M0, M1, M2, and so on. However, our focus in this
    book will be Siemens PLC (S7 1200 CPU 1211C AC/DC/RLY). Address notation is simply
    a description'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'of each input/output (input or output point) and software-created devices,
    such as relays, timers, and counters, while a tag name is a description of an
    address.


    S7 1200 (CPU 1211C AC/DC/RLY) has six digital inputs and four digital outputs,
    which can be addressed in a program as follows:


    +   - **Inputs:** `I0.0, I0.1, I0.2, I0.3, I0.4, I0.5`

    +   - **Outputs:** `Q0.0, Q0.1, Q0.2, Q0.3`


    You can find the input/output addressing of a PLC or model of a PLC in its manual.
    Always read the documentation/manual of any PLC you want to program.


    +   - **Comments:** Comments are used to describe the logical operation that a
    rung or group of rungs will perform in an LD. They are usually displayed at the
    start of each rung. They make the program easy to understand.


    The following diagram shows sample LD with labels:'
  merge: -1
  img_proc: true
