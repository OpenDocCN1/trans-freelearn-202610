    Let''s now look at a series wound DC motor.


    # Series wound DC motors


    This type of motor has the field winding (housed in the stator) in series with
    the armature winding. The field winding is powered by a DC supply as shown in
    the following diagram. The same amount of current flows through the field winding
    and the armature winding since they are in series. As current flows through the
    field winding and armature winding, strong magnetic fields are produced. The interaction
    between the magnetic field in, the field winding and the armature winding produce
    the turning force (torque) that creates rotation.


    The following diagram shows a simplified circuit diagram of a series wound DC
    motor:'
  merge: -1
  img_proc: true
- pgno: 136
