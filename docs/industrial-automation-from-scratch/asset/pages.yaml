    Now, let’s learn about the most common industrial network.


    # Common industrial network protocol – PROFINET


    PROFINET is an industrial Ethernet protocol designed to exchange data between
    devices and controllers in industrial automation. It is the most well-adopted
    industrial Ethernet protocol. It can operate at a higher speed than PROFIBUS because
    it is Ethernet-based. The connector that’s used for PROFINET is a standard RJ45
    connector (Figure 13.13) and the network cable can be a standard Ethernet cable
    such as those you find in offices, such as twisted pair CAT 6 cables (Figure 13.9).
    A standard Ethernet cable'
  merge: -1
  img_proc: true
- pgno: 599
  md: 'can be damaged easily due to the challenging environmental conditions in the
    industry. For that reason, an industrial Ethernet cable is suitable for use in
    PROFINET. It is characterized by shielding protection and ruggedized and proper
    jacketing. A standard Ethernet switch (Figure 13.14) can also be used because
    it uses the same physical connection standard as Ethernet. PROFINET is now becoming
    a popular protocol that’s implemented in industries due to its high speed of operation
    (100 Mbps) and flexibility. The PROFINET protocol can be implemented using the
    point-to-point, bus, or star topology.


    Some of the differences between PROFINET and PROFIBUS are as follows:


    +   - A PROFINET cable is a four-core cable, though a standard Ethernet cable
    can be used. A PROFIBUS cable is usually purple and has two cores.

    +   - PROFINET uses a standard RJ45 connector while PROFIBUS uses a PROFIBUS connector,
    which looks like a standard DB-9 serial connector.

    +   - PROFINET can have unlimited devices, while each device in a PROFIBUS network
    has a unique address ranging from 1 to 127. Hence, 127 devices can be connected
    in a PROFIBUS network.

    +   - The data transfer rate in PROFINET is 100 Mbps, while the maximum data transfer
    rate in PROFIBUS is 12 Mbps.


    The following diagram shows a PLC and HMI connection using the point-to-point
    topology:'
