    In this wiring diagram, the sensor has five wires, as follows:


    +   - BN (brown)

    +   - BU (blue)

    +   - WH (white)

    +   - BK (black)

    +   - GY (gray)


    The BN and BU wires will be connected to the power. WH is common and it will be
    connected to either the positive or the negative, depending on what you require
    at the output terminal of the sensor (BK and GY).


    When WH is connected to the positive, you will have the positive already at GY
    and when there is an obstruction, you will have the positive at BK.


    When WH is connected to the negative, you will have the negative already at GY
