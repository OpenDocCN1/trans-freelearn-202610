- pgno: 562
  md: 'MD8 is 105.1649.


    In Network 2, there was an output in the comparator to energize or turn ON the
    M0.0 Assignment (Coil) because the condition is met, that is, 105.1649 at MD8
    is greater than 100.


    In Network 3, the normally closed contact (M0.0) becomes open because M0.0 is
    ON. This stops the signal from flowing to Q0.0, which de-energizes the contactor
    and the heater turns OFF.


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_562_0.png)


