    +   - The address of an output (coil) can be used for input (NC or NO contact).
    You can use the address of an output (coil) for an input (NC or NO contact), which
    makes the input have the same logic state (1 or 0) as the output; that is, if
    the output is ON (1), the input will be HIGH (1), and if the output is OFF, the
    input will be LOW (0).'
