    Figure 4.16 – Simplified circuit diagram of a series wound DC motor


    Let''s now have a look at a shunt DC motor.


    # Shunt DC motors


    This type of motor has the field winding (housed in the stator) in parallel with
    the armature winding. It is powered by DC and the total current splits into two
    parallel paths to supply the field winding and the armature winding. As the current
    flows through the stator and armature winding, a magnetic field is produced. The
    interaction between the magnetic fields of the stator and rotor produce the turning
    force that creates rotation.


    The following diagram shows a simplified circuit diagram of a shunt DC motor:'
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_137_0.png)


    Figure 4.17 – Simplified circuit diagram of a shunt DC motor


    Let''s have a look at a compound wound DC motor.


    # Compound wound DC motors


    This type of motor has the field winding (housed in the stator) in series with
    the armature winding and a shunt field that is excited separately. The shunt field
    winding is connected across the field supply and the series field winding is connected
    in series with the armature. When DC is supplied, both the shunt field winding
    and the series field winding produce the required magnetic field that interacts
    with the armature to produce the necessary turning force that creates rotation.
    Compound wound DC motor has the characteristics of both the series and shunt types
    of DC motor.


    The following diagram shows a simplified circuit diagram of a compound wound DC
    motor:'
  merge: -1
  img_proc: true
