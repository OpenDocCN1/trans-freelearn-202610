- pgno: 263
  md: '# Understanding PLC Software and Programming with TIA Portal


    In the previous chapter, we learned about the hardware part of the **Programmable
    Logic Controller (PLC)**, which includes wiring the PLC to sensors and actuators.
    A PLC wired to switches, sensors, and actuators will do nothing unless there is
    a program written into it. A program (a set of instructions written using a programming
    language) is required for the CPU of the PLC to make decisions based on the inputs
    and carry out the required control function. It is important for an industrial
    automation engineer to have knowledge of both the hardware part of the PLC, including
    the wiring, and the software part, which includes programming.


    This chapter focuses on the software aspect of the PLC. You will learn the basic
    things you need to start programming PLCs with the most common PLC programming
    language, **Ladder Diagram (LD)**. You will learn how to download, install, and
    use **Totally Integrated Automation Portal (TIA Portal)**, powerful software for
    programming Siemens PLCs.


    We are going to cover the following main topics in this chapter:


    +   - Understanding software/program in PLCs

    +   - Introducing PLC programming languages

    +   - Introducing PLC programming devices

    +   - Understanding the basics of LD

    +   - Downloading and installing TIA Portal V13 Professional and PLCSIM

    +   - Creating a project and writing a program with Siemens programming software
    (TIA Portal)


    # Technical requirements'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'While every part of this book is valuable, *[Chapter 2, Switches and Sensors
    – Working Principles, Applications, and Wiring](#)*, *[Chapter 3, Actuators and
    Their Applications in Industrial Automation](#)*, and *[Chapter 7, Understanding
    PLC Hardware and Wiring](#)*, are very important to have a better understanding
    of this chapter.


    # Understanding software/program in PLCs


    Before looking into PLC programming languages, let''s get some knowledge of the
    software/program in PLCs.


    In computing, generally, software is a set of instructions written in a language
    the computer understands to perform a task. Software can also be referred to as
    a program.


    A PLC requires two types of software that must be executed by the CPU for the
    PLC to function. They are as follows:


    +   - The operating system (firmware)

    +   - User program


    The operating system is the program written by the PLC manufacturers and designed
    to run automatically in the PLC once powered. It is responsible for executing
    the user program, establishing communication between devices, memory management,
    and updating the output.


    A PLC user program is a set of instructions in either textual or graphical form
    that represents the control function that will be carried out for a specific industrial
    task or application. It is the program that the user or PLC programmer writes
    to dictate the required automation or control task to the PLC.


    A programming language is usually used to convey instructions to a PLC or any
    other computing device to perform a specific task. Let''s have a look at'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'PLC programming languages in the next section.


    # Introducing PLC programming languages


    According to **International Electrotechnical Commission (IEC)** standards, there
    are five programming languages, stated in part 3 of IEC 61131, for writing a program
    for PLCs to control and automate a task. These programming languages are the following:


    +   - Ladder Diagram (LD)

    +   - Function Block Diagram (FBD)

    +   - Sequential Function Chart (SFC)

    +   - Instruction List (IL)

    +   - Structured Text (ST)


    IEC 61131-3 can be purchased at their web store at the following link. However,
    there is an abstract you can read and also a preview that can be downloaded for
    free:


    https://webstore.iec.ch/publication/4552


    Note


    IEC is an international standards organization responsible for preparing and publishing
    international standards for all electrical, electronics, and other related technologies.


    Let''s discuss each of these programming languages in detail.


    # Ladder Diagram (LD)'
  merge: -1
  img_proc: true
- pgno: 266
  md: 'This is most common among several PLC programming languages. It is a graphical
    programming language that''s easy to understand by most plant technicians because
    it''s similar to the relay diagrams that they are familiar with. **Normally Open
    (NO)** or **Normally Closed (NC)** contacts are used as input. Specific outputs
    are activated depending on the logic performed on the input.


    The following diagram shows a simple AND logic program using LD. Output 1 will
    be activated only when input 1 and input 2 are true (ON):


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_266_0.png)


    Figure 8.1 – A simple AND logic program using LD


    The following diagram shows a simple OR logic program using LD. Output 1 will
    be activated when either input 1 or input 2 or both input 1 and input 2 are true
    (ON):


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_266_1.png)


    Figure 8.2 – A simple OR logic program using LD'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'The following diagram shows a program that combines both AND and OR logic.
    If input 1 OR input 2 is true AND input 3 are true (ON), output 1 will be activated:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_267_0.png)


    Figure 8.3 – A program that combines both AND and OR logic


    Let''s have an idea of how FBD looks.


    # Function Block Diagram (FBD)


    This is a graphical language in which program elements are represented in the
    form of blocks and are connected together. A function with many lines of code
    is represented as a block and several blocks can be connected together in a program.


    The following diagram shows a simple AND logic program using FBD. Output 1 will
    be activated only when input 1 and input 2 are true (ON):'
  merge: -1
  img_proc: true
- pgno: 268
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_268_0.png)


    Figure 8.4 – A simple AND logic program using FBD


    The following diagram shows a simple OR logic program using FBD. Output 1 will
    be activated when either input 1 or input 2 or both input 1 and input 2 are true
    (ON):


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_268_1.png)


    Figure 8.5 – A simple OR logic program using FBD


    The following diagram shows a program that combines both AND and OR logic. If
    input 1 OR input 2 is true AND input 3 are true (ON), output 1 will'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'be activated:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_269_0.png)


    Figure 8.6 – A program that combines both AND and OR logic


    We will now briefly discuss the next programming language in our list.


    # Instruction List (IL)


    This is a text-based language that resembles assembly language. A series of instructions
    is listed just as assembly language. A program written using IL is processed faster
    than other programming languages defined by IEC for programming PLCs. One disadvantage
    of this programming language is that it''s difficult to debug a large or complex
    program.


    The following is a sample program written using IL. If input A or input B is true
    (ON) and input C is true (ON), output Y will be activated:


    ```

    LD  A

    OR  B

    AND C

    OUT Y

    END

    ```'
  merge: -1
  img_proc: true
- pgno: 270
  md: "Let's now move on to the next language.\n\n# Structured Text (ST)\n\nST is\
    \ also a text-based language, similar to traditional programming languages, such\
    \ as C, C++, Python, and Java, in structure. It gives the possibility of working\
    \ with inputs and outputs using statements such as `if`, `while`, and `for`, which\
    \ are common in traditional programming languages. A complex algorithm can more\
    \ easily be implemented in ST than LD or some other programming languages. One\
    \ drawback of ST is the difficulty a programmer may experience in debugging. The\
    \ following code block shows a simple program written using ST:\n\n```\n```st\n\
    VAR\n        PushButton1: BOOL;\n        PilotLamp1: BOOL;\nEND_VAR\nIF PushButton1\
    \ = TRUE THEN\n        PilotLamp1 := TRUE\n        ELSE\n                PilotLamp1;\n\
    \        END_IF\nEND_IF\n```\n```\n\nFinally, from our list of programming languages,\
    \ we will look at SFC.\n\n# Sequential Function Chart (SFC)\n\nThis is also a\
    \ graphical programming language similar to a regular flow chart used in computer\
    \ science. Steps/states and transitions are used. Separate steps (rectangular\
    \ boxes) describe the operation or action to execute and are connected sequentially\
    \ by a vertical line. A transition condition (a logical statement that must be\
    \ true to proceed) is present between each step, as shown in the following diagram.\
    \ A complex sequential task can easily be visualized and designed using SFC:"
  merge: -1
  img_proc: true
