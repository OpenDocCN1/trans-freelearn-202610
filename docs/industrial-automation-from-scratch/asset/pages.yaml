    Now, let''s look at the next proximity sensor.


    # Photoelectric


    A **photoelectric** sensor consists of a light emitter (*sender*), photoreceiver,
    and supporting circuitry. They are used to detect the presence or absence of objects
    by using a light emitter and a receiver.


    The emitter transmits a beam of either visible or invisible light to the detecting
    receiver.


    There are three types of photoelectric sensors, as follows:


    +   1. **Through beam**: With this sensor, the emitter (sender) and the receiver
    are in a separate housing and positioned to face each other. The sender provides
    a constant beam of light; detection occurs when an object passing in-between the
    sender and receiver breaks the beam. The following diagram illustrates this:'
  merge: -1
  img_proc: true
