- pgno: 218
  md: '# Understanding PLC Hardware and Wiring


    Industrial automation has been in existence since before the **programmable logic
    controller (PLC)** was developed in the late 1960s. Relays and timers were used
    for automating manufacturing processes prior to the introduction of PLCs but they
    had so many challenges. Some of these challenges included the large space occupied
    by relays and timers, the amount of time required to troubleshoot the system,
    and making changes to the system was very difficult due to the fact that so many
    relays were hardwired together in a specific order for the machine to operate.
    A PLC provides a solution to all these challenges by needing less space, being
    easy to troubleshoot, and changes can easily be made to a control system that
    uses a PLC. The following photograph shows a relay room with so many relays that
    take up much space, are not easy to troubleshoot, and changes are not easy to
    make on the control system:'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_219_0.png)'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Figure 7.1 – Relays in a relay room (Sergeev Pavel, CC BY-SA 3.0 https://creativecommons.org/licenses/by-sa/3.0,
    via Wikimedia Commons)


    This chapter focuses on the hardware aspect of PLCs. We will understand what a
    PLC really is, the various parts that make up a PLC, the operation of a PLC, types
    of PLCs, PLC manufacturers/vendors, and how to wire sensors and actuators learned
    in the previous chapter to a PLC.


    We are going to cover the following main topics in this chapter:


    +   - Introducing a PLC

    +   - Exploring PLC modules

    +   - Exploring PLC types

    +   - Understanding the PLC scan cycle

    +   - Knowing about PLC vendors

    +   - PLC wiring (1) – Wiring of switches, lights, and actuators to a PLC

    +   - PLC wiring (2) – Wiring of proximity sensors (3-wire)

    +   - PLC wiring (3) – Wiring of photoelectric sensors (retro-reflective)

    +   - Wiring of the Siemens S7-1200 PLC (CPU 1211C AC/DC/Relay)


    # Technical requirements


    While every part of this book is valuable, Chapter 2, Switches and Sensors – Working
    Principles, Applications, and Wiring, and Chapter 3, Actuators and Their Applications
    in Industrial Automation, are very important to have a better understanding of
    this chapter.


    # Introducing a PLC


    A PLC is an industrial computer that consists of both hardware and software used
    for automating industrial processes. They are mostly used in'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'manufacturing industries and can be found in other industries including transportation,
    manufacturing, warehousing, oil and gas, building, and so on. A PLC can also be
    referred to as an electronic device that accepts inputs from sensors and switches,
    processes them, and gives out signals to control actuators. PLCs take data from
    the plant floor through switches and sensors, they then execute the program logic
    written into them and give an output signal based on the result of the program
    logic to control actuators or machines connected to them. PLCs are the brains
    behind almost all modern automated machines in industries.


    Let’s now have a look at the parts that make up a PLC.


    # Exploring PLC modules


    The hardware part of a PLC consists of various modules. The basic modules that
    make up a PLC include the following:


    +   - The power supply

    +   - The CPU

    +   - Input module

    +   - Output module


    The following figure shows the block diagram of a PLC:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_221_0.png)


    Figure 7.2 – Block diagram of a PLC'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'In the next section, we will be looking at each module.


    # The power supply


    The power supply part of a PLC provides the appropriate voltage and current to
    other parts/modules of the PLC. Most PLCs use 24V DC and the supply from the grid
    is usually 110V or 220V AC, depending on the country. A power supply takes the
    220V or 110V AC as input and provides the required voltage (usually 24V DC) and
    current as output to other parts of a PLC. The current rating of power supplies
    can range from 2 to about 50 amps, depending on the PLC size. The following figure
    shows a Siemens power supply module:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_222_0.png)


    Figure 7.3 – Siemens power supply


    The credit for this photo goes to Showlight Technologies Ltd. (www.showlight.com.ng).'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'The power supply module of a PLC provides the energy required for the PLC to
    function. A PLC without a power supply is just like a vehicle without fuel. The
    power supply works by stepping down the line voltage of usually 110V or 220V AC
    to a lower AC voltage with the aid of a transformer. A rectifier then converts
    the lower voltage AC to DC. A capacitor smooths or filters the DC, and a regulator
    circuit within the unit provides a regulated DC output of usually 24V DC.


    Let’s now have a look at the next module in our list, the CPU module.


    # The CPU module


    The **central processing unit (CPU)** can be regarded as the brain of the PLC
    system. It consists of a processor, memory, and other integrated circuits that
    handle program execution, storage, and communication to other external devices
    including a programming device or **personal computer (PC)**, a **Human-Machine
    Interface (HMI)**, a **variable frequency drive (VFD)**, and so on. The CPU controls
    and coordinates the entire operation of the PLC. The following figure shows the
    CPU of an Siemens PLC (S7-300 CPU 313):'
  merge: -1
  img_proc: true
- pgno: 224
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_224_0.png)


