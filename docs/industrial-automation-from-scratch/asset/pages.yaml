- pgno: 335
  md: 'When the start button is pressed, the normally open contact with the address
    I0.4 in the program will be closed. The stop push button (normally closed push
    button) will close the normally open contact with the address I0.5 in the program.
    Power will flow to energize the coil with the address Q0.2 because address I0.5
    in the program is closed due to the normally closed push button used in the wiring.
    When the start button is released, the normally open contact with the address
    I0.4 in the program is opened, but the output with the address Q0.2 remains energized
    due to the normally open contact with the same address as the output (Q0.2) that
    is parallel to I0.4 in the program. Coil Q0.2, which is energized (ON), closes
    the normally open contact with the address Q0.2 that is parallel to I0.4 in the
    program. This creates an alternative path for the signal to flow to Q0.2. Hence,
    the output coil with the address Q0.2 remains ON even when the button is released.
    This is referred to as latching.


    When the stop push button is pressed, the normally closed contact with the address
    I0.5 is opened. Power will no longer flow to the coil. The output coil with the
    address Q0.2 will become de-energized (OFF). This is referred to as unlatching.


    The stop push button used here is safe because when the push button fails, the
    output will be de-energized and the machine that the stop push button is connected
    to will not run. This is preferred and safe for industrial use.


    # Note


    If the output (Q0.2) will be used to power on an induction motor, an overload
    relay is necessary between the contactor and the motor to ensure the motor stops
    when there is an overload. In this case, the normally closed contact (95-96) will
    be wired as input to the PLC, and a normally open contact will be used for it
    in the program (in series with the normally open contact for the stop) such that,
    when there is an overload, the normally open contact (95-96) opens and the motor
    will stop. This idea is used to start and stop an induction motor using PLC.


    We have now learned about latching and unlatching. The two terms are important
    in PLC programming. We will now proceed to learn how to use an output address
    for an input in a program in the next section.'
  merge: -1
  img_proc: true
