  md: 'Here, in this section, we will look into the connection (wiring) of input devices
    (switches) and output devices (lights and actuators) to the PLC. **Sinking** and
    **sourcing** are two important terms in PLC wiring. They are used to describe
    the direction of the conventional current flow between two circuits or devices.
    A conventional current always flows from positive potential (+) to negative potential
    (-). Anytime you have a current flowing between two devices, one will be sourcing
    while the other will be sinking.


    The sourcing device is the device that provides the current (positive), while
    the sinking device is the device that absorbs the current (that is, the device
    connected to negative or ground).


    In PLC wiring, the two devices in question are input devices and input modules
    or output devices and output modules. PLC manufacturers usually produce input/output
    modules that you can either sink or source. There are PLCs where you can only
    sink their input/output module, and for some, you can sink or source it. It all
    depends on the manufacturer’s design. You are advised to consult the manual of
    the input or output module before wiring, regardless of the information you have
    gathered in this book.


    Many PLC manufacturers usually have a common terminal on their PLC’s input or
    output module which must be connected to positive (e.g. if the module will be
    sourcing) or connected to negative (e.g. if the module will be sinking). When
    the common terminal of the input/output module is connected to the positive (+24V)
    of the power supply, we say the input/output module is sourcing, and when that
    common terminal is connected to the negative (- or 0V) of the power supply, we
    say the input/output module is sinking.


    We are going to follow simple rules in wiring PLCs in this book:


    +   - Sourcing input devices (switches and sensors) must be connected to a sinking
    input module. The following diagram shows the connection of sourcing input devices
    (**normally open (NO)** push button, **normally closed (NC)** push button, and
    limit and float switches) to a sinking input module:'
