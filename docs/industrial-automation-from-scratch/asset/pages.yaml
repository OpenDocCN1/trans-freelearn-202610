  md: '# Drawing Schematic/Wiring Diagrams Using CAD Software


    **Computer-Aided Design (CAD)** software is computer applications that help in
    creating, modifying, analyzing, and optimizing a design. CAD software is commonly
    used by engineers (mechanical, electrical, and computer engineers, among others)
    and in other fields that involve drawing. The need for CAD in industrial automation
    cannot be over-emphasized as designs or control systems need to be created, modified,
    analyzed, and optimized on a computer to achieve the desired result. Examples
    of CAD software include **AutoCAD, ProfiCAD, PCSCHEMATIC Automation, Automation
    Studio, SmartDraw**, and so on. In engineering or industrial automation-related
    drawing, CAD software saves time and drawings are more accurate than when using
    manual methods.


    This chapter explains the use of the PCSCHEMATIC Automation software to draw schematic/wiring
    diagrams relating to industrial automation. We will learn how to create a control
    system drawing using the software.


    In this chapter, we are going to cover the following main topics:


    +   - Understanding electrical diagrams/drawings

    +   - Overview of the PCSCHEMATIC Automation software

    +   - Downloading and installing PCSCHEMATIC Automation

    +   - Launching PCSCHEMATIC Automation and exploring the screen elements

    +   - Creating and saving a project in PCSCHEMATIC Automation

    +   - Using the symbol, line, text, arc/circle, and area tools

    +   - Drawing power and control schematic of a DOL starter using PCSCHEMATIC'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Technical requirements


    Our focus in this chapter is the use of CAD software (PCSCHEMATIC Automation)
    to draw circuit/schematic diagrams.


    While efforts were made to make the chapter comprehensive for readers without
    the knowledge of the previous chapters, knowledge of Chapter 4, Overview Of AC
    and DC Motors, will be of help.


    Steps to install the CAD software (PCSCHEMATIC Automation) will be provided in
    this chapter. You will need a computer system or laptop with the following minimum
    system requirements:


    +   - **Operating system**: Windows XP/Vista/7/8.1/10

    +   - **Memory (RAM)**: 1 GB of RAM

    +   - **Hard disk space**: 400 MB of free space

    +   - **Processor**: Intel Pentium 4 or later


    # Understanding electrical diagrams/drawings


    Before we start to learn how to draw schematics with CAD, let’s get an understanding
    of the various types of electrical drawings/diagrams you are likely to come across
    in industrial automation and control.


    Common electrical drawings/diagrams in industrial automation and control include
    the following:


    +   - **Schematic diagrams** can be referred to as electrical diagrams that show
    the components in a circuit using standard symbols and also how they connect with
    each other but do not include where the components and wires are located in the
    real system or device:'
  merge: -1
  img_proc: true
- pgno: 174
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_174_0.png)


    Figure 6.1 – Schematic diagram of a Direct On-Line (DOL) starter


    **Wiring diagrams** are electrical diagrams that show the components involved
    in a circuit, the physical connections between the components, and where the components
    and wires are located in the real system or device, unlike schematic diagrams,
    which do not show the real location of the components and wires involved:'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_175_0.png)


    Figure 6.2 – Wiring diagram of a DOL starter


    Pictorial diagrams are electrical diagrams that show a picture or detailed drawing
    of the physical components and the wiring between components. They are used by
    people that do not have sound electrical drawing skills. A pictorial diagram is
    not suitable for troubleshooting circuits. Figures 5.9, 5.10, 5.12, and 5.13 in
    Chapter 5, Introduction to Variable Frequency Drive (VFD), shows the pictorial
    diagrams of a basic Variable Frequency Drive’s (VFD’s) wiring.


    Ladder diagrams consist of two vertical lines (power supply) and horizontal lines
    that represent the control circuit. They are called ladders because they look
    like a ladder. This diagram also does not include where the components and wires
    are located in the real system or'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'device, but they show how the components interconnect. Ladder diagrams make
    complex circuits easy to read and understand. They are suitable for troubleshooting
    circuits:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_176_0.png)


    Figure 6.3 – Ladder diagram of a DOL starter


    This section explains electrical diagrams and the various types available. You
    should now be able to differentiate between schematic diagrams, pictorial diagrams,
    ladder diagrams, and wiring diagrams, which most people find difficult to differentiate
    between. Many people think they all mean the same thing, but they actually have
    different meanings.


    In the next section, we will discuss a software (PCSCHEMATIC Automation) that
    can be used to create electrical diagrams/drawings.


    # Overview of PCSCHEMATIC Automation software'
  merge: -1
  img_proc: true
- pgno: 177
