    +   - **Network 6:** When the normally open contact with the address M0.0 is closed
    due to the start button being pressed and released, and the counter in network
    5 has incremented to 6, the normally open contact (counter1) will close and since
    timer3 is a normally closed contact, the coil with the address Q0.3 will be energized
    and a wrapping machine connected to Q0.3 will start to wrap the 6 bottles. A 5-second
    timer (timer3) also starts when counter1 is incremented to 6.


    After 5 seconds, the normally closed contact (timer3) will open and the wrapping
    machine connected to Q0.3 will stop. The counter (counter1) in network 5 will
    also reset after the 5 seconds of timer3 have elapsed so that the next bottle
    will be counted as 1 and keep incrementing up to 6, when the wrapping machine
    will start to wrap again.


    The program for an automated filling, capping, and wrapping system learned in
