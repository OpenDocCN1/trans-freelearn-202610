- pgno: 51
  md: 'One type of actuator that a limit switch can use is **momentary operation**.
    With this type of actuator, when no force is applied, the device is in its free
    position and the contacts are in their normal state.


    When force is applied, the device will be in its operating position – in this
    case, the electrical contacts will change from their normal state to their operating
    state. When force is removed, the device will return to the free position and
    the electrical contacts will return to their normal state.


    The following diagram shows the operation of a momentary operation type of limit
    switch:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_51_0.png)


    Figure 2.20 – The operation of a momentary operation type of limit switch


    Another type of actuator is **maintained operation**. With this type of actuator,
    the actuator lever and the electrical contacts remain in their operating state
    after the actuator is no longer in contact with the target. When force is applied
    in the opposite direction, the actuator lever and electrical contacts return to
    their free position.'
  merge: -1
  img_proc: true
