    a practical way using real-life industrial devices that you will be able to practice
    with while learning. I aim to see experts emerge after reading this book. Industrial
    automation is such an interesting field with a good market. Most machines in industry
    are now automated and there will always be a need for experts with good knowledge
    of developing, maintaining, and troubleshooting such machines. You have started
    well by reading this book. I look forward to seeing you at the top of the field
    of industrial automation and process control.


    # Questions


    The following questions have been provided to test your understanding of this
    chapter. Ensure you have read and understood the topics in this chapter before
    attempting these questions:


    +   1. The ______________ industrial revolution involves mass production through
    the use of assembly lines consisting of machines that are powered by electricity.


    +   2. In the ______________ industrial revolution, industrial machines can think,
    make decisions, and communicate with each other over the internet with little
    or no human intervention.


    +   3. The ______________ refers to a network of physical objects or devices that
    collect data with the help of sensors and communicate'
