- pgno: 593
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_593_0.png)


    Figure 13.20 – Modbus RTU network with SCADA/HMI as the master and PLCs as the
    slaves


    # Modbus Transmission Control Protocol/Internet Protocol (TCP/IP)


    This protocol uses the server-client architecture. You can have more than one
    device acting as the server and more than one device acting as the client, as
    shown in the following diagram. The clients and server are connected via a regular
    switch; the physical medium of communication is a regular Ethernet cable. Each
    device in a Modbus TCP/IP network will have a unique IP address instead of a unit
    ID:'
  merge: -1
  img_proc: true
- pgno: 594
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_594_0.png)


    Figure 13.21 – Modbus TCP/IP network with servers and clients


    Note


    An open protocol is a protocol that can be used by any company or organization.
    The manufacturer of an open protocol provides the protocol and allows anyone to
    use it freely without any charge or conditions of use, while a proprietary protocol
    is a protocol developed and owned by a specific manufacturer and used by the devices
    that they manufacture.


    Now, let’s learn about the HART protocol.


    # Common industrial network protocol – HART'
  merge: -1
  img_proc: true
- pgno: 595
  md: 'The **Highway Addressable Remote Transducer (HART)** protocol is the world
    standard protocol and provides data exchange between smart/intelligent field devices
    and a controller (PLC, DCS, and so on) or handheld communicator. You can control
    and monitor HART-enabled field devices (sensors, transmitters, and actuators)
    with the HART protocol. In HART communication, a digital signal is superimposed
    on the traditional 4-20mA analog signal, allowing the 4-20mA analog signal to
    co-exist with the digital signal on the same two-wire loop without distortion.
    Hence, two signals are transmitted simultaneously — that is, the 4-20mA signal
    and the digital signal. The 4-20mA analog signal represents the measured variable
    regarding the temperature, pressure, level, or flow while the digital signals
    carry other device details, such as the device’s health, status, diagnostics alerts,
    and more.


    Each sensor/transmitter and actuator (transducer) in the network (highway) has
    a unique address and can be accessed remotely using that unique address, hence
    the name HART. We don’t have to be at the location of the sensor to configure
    or access its data. It can be done remotely from the control room or anywhere
    the HART data is accessible — that is, either from a programming PC or a handheld
    device (HART communicator) connected anywhere in the network for configuration
    and other purposes.


    It is the largest installed protocol worldwide and its benefits cannot be overemphasized.
    It provides a reliable and easy way to communicate with field devices. It can
    be used for various purposes, such as the following:


    +   - Configuration and reconfiguration of HART-enabled SMART field devices

    +   - Commissioning and calibrating HART-enabled SMART field instruments using
    a handheld device called a SMART communicator

    +   - Troubleshooting control loops

    +   - Getting details about a device’s health and status

    +   - Changing device ID or tags online'
