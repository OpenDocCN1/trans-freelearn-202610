- pgno: 31
  md: '# Switches and Sensors – Working Principles, Applications, and Wiring


    Understanding how human being functions will help you understand automation. Having
    a brain is not enough for a human being to operate. Sight, hearing, touch, and
    smell are required to provide information about the environment for the brain
    to process. Similarly, **switches and sensors** provide information about the
    environment for a controller to process. The result of processing determines the
    actions that will be carried out by an *actuator*, which will be discussed in
    the next chapter. This chapter is specifically reserved for switches and sensors
    to enable us to discuss actuators in depth. Just like sight, hearing, touch, and
    smell are important for humans to function, switches and sensors are important
    components that are required to automate an industrial process.


    In this chapter, we are going to cover the following main topics:


    +   - Introducing switches and sensors

    +   - Describing manually operated switches

    +   - Describing mechanically operated switches

    +   - Understanding proximity sensors (capacitive, inductive, and photoelectric)


    # Introducing switches and sensors


    A **switch** is an electrical component that connects or disconnects a signal
    path in an electrical circuit. It is used to make or break an electrical circuit.
    A switch has two states: an ON state and an OFF state. In an electrical circuit,
    the current will flow when the switch is in the ON state. When in'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'the OFF state, the current will not flow. Hence, the ON state will connect
    a signal path, while the OFF state will disconnect a signal path. A switch can
    be referred to as a device that''s used to turn equipment ON or OFF.


    Switches can be categorized as follows:


    +   - Manually operated switch

    +   - Mechanically operated switch


    **Sensors** are devices that detect or sense the presence or absence of objects.
    A sensor can be thought of as an automatic switch. They gather information from
    their environment and convert it into a form of signal that can be read and/or
    seen by an observer or equipment. In a human being, their eyes, nose, ears, tongue,
    and skin can be referred to as sensors. Their eyes detect light energy, their
    nose can detect chemicals or various kinds of smell, their ears can detect sound,
    and their skin can detect temperature or pressure. Likewise, in automation, various
    types of sensors detect various physical quantities such as light, sound, temperature,
    and so on. These physical quantities will be converted into a digital or analog
    signal that can be read and/or seen by an observer or piece of equipment (controller).
    There are various types of sensors, but we will cover proximity sensors later
    in this chapter.


    In this section, we learned about switches and can summarize them as devices that
    are used to turn equipment either ON or OFF. We also learned that sensors can
    be thought of as automatic switches. They are not operated by humans. Having an
    idea of switches and sensors will give you a better understanding of the types
    of switches that will be explained in the next section. It will also help you
    understand proximity sensors, which will be explained later in this chapter.


    # Describing manually operated switches'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'In manufacturing, there is always the need for an operator to start or stop
    a machine and there could be a need to manually perform some other form of control
    aside from starting and stopping. These usually require switches that can be operated
    by hand. Switches that are operated by hand are referred to as **manually operated
    switches**. Some examples are as follows:


    +   - Push button

    +   - Rocker switch

    +   - Toggle switch

    +   - Selector switch

    +   - Knife switch


    We will explore each of these in the following sections.


    # Push button


    A **push button** is a type of switch that closes or opens a circuit when a button
    is pressed or depressed. The button is designed to operate in two states (that
    is, ON or OFF). When it''s in the ON position, an internal metal spring contacts
    the two terminals of the switch, allowing the current to flow. When it''s in the
    OFF position, the internal switch retracts and the current will stop flowing.


    Push buttons exist as normally *open* or normally *closed*.


    Normally open or normally closed buttons can be used to control a single electrical
    circuit.


    In a normally open push button, when the push button is not pressed, the contacts
    are open, and the connection is broken (that is, the switch is OFF). When the
    push button is pressed, the contacts are closed, and the connection is made (that
    is, the switch is ON).


    In a normally closed push button, when the push button is not pressed, the contacts
    are closed, and a connection is made (that is, the switch is ON).'
  merge: -1
  img_proc: true
- pgno: 34
