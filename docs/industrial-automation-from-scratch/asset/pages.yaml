    with ease.


    Some of the features of PCSCHEMATIC Automation include the following:


    +   - A clean and neat circuit development environment

    +   - A well-equipped database of electrical and mechanical components

    +   - Complete solutions for all electrical circuit drawings

    +   - Support for pneumatic and hydraulic circuit drawing

    +   - Report generation

    +   - Complex design support


    You have now learned about PCSCHEMATIC Automation and its features. You should
