- pgno: 109
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_109_0.png)


    Figure 3.24 – Rack-and-pinion pneumatic rotary actuator


    In Figure 3.24, when the pressurized air enters the middle chamber through Port
    A, the two pistons are separated and will move to the two ends of the cylinder.
    The air in the air chambers at each end is discharged via Port B. The rack of
    the two pistons drives the shaft simultaneously and rotates it counterclockwise.
    When pressurized air enters the air chamber at both ends of the piston through
    Port B, the two pistons are shifted inward. The rack of the two pistons drives
    the shaft simultaneously and rotates it clockwise.


