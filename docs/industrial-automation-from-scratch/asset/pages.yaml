- pgno: 563
  md: 'transmitter with 4 to 20 mA output to an analog input of a real PLC and program
    it to perform a simple control (for example, stop a heater) at desired setpoint.


    This section simplifies analog signal processing which many industrial automation
    engineers or PLC specialists finds difficult. This book only focuses on analog
    input signals and we have used it to send out a digital control signal when a
    condition is met. It is also possible to send out an analog signal (4 to 20 mA)
    or use a PLC with a PID feature for better control than the example here.


    # Summary


    Well done! You have successfully completed this chapter, which is an important
    stage of industrial automation. You should now understand process control and
    be able to explain various process control terms and understand ISA symbols according
    to *ISA5.1*. You have also learned about the sensors and transmitters required
    for temperature measurement, level measurement, pressure measurement, and flow
    measurement, which are common in industry. You should now be able to wire a temperature
    sensor and transmitter, level transmitter, and pressure transmitter to generate
    a 4-to 20-mA analog output, which is very important for process control. We have
    also learned how to keep the temperature of a heater at the desired level by using
    a temperature controller.


    The last section covered more advanced topics within the field of industrial automation,
    where we discussed the basic theory you need to know about analog input signal
    processing in a PLC (S7-1200), which includes reading analog signals, normalizing,
    and scaling. We learned how to program a PLC (S7-1200) to process analog input
    signals using a step-by-step guide (simulation) and we also used a real PLC to
    learn how to wire and program the analog input of a real PLC to perform a control
    action following a step-by-step guide.


    The next chapter involves other vital knowledge you will need as an industrial
    automation engineer. Don’t miss out.'
