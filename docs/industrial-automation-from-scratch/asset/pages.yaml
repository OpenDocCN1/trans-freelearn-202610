- pgno: 272
  md: 'In the preceding figure, S1, S2, and S3 represent the steps, while T1, T2,
    and T3 represent the transitions.


    We should now be able to differentiate between PLC programming languages (LD,
    FBD, ST, IL, and SFC). The just-concluded section, that is, *Introducing PLC programming
    languages*, is not meant to make you a PLC programmer using all five languages;
    rather, its purpose is to give you a brief idea of the programming languages and
    allow you to be able to differentiate between them. As mentioned earlier in this
    chapter, we will focus on LD, which will be covered in subsequent sections. We
    will first quickly look at PLC programming devices in the next section.


    # Introducing PLC programming devices


    These are devices or tools used to write, edit, and transfer programs to the PLC.
    They can also be used to read programs from the PLC. Hence, a programming device
    can be used to download (write) or upload (read) a program. The term download
    or write means to transfer a program from a programming device to a PLC while
    the term upload or read means to transfer a program from the PLC to a programming
    device. Programming devices can also help in troubleshooting PLCs. There are two
    common programming devices:


    +   - Handheld devices

    +   - Personal Computers (PCs)


    **Handheld devices** are usually connected to the PLC via a cable. They consist
    of keys for entering a program, editing a program, downloading a program to the
    PLC or uploading a program from the PLC. They also consist of a small display
    for viewing instructions. They are small in size and have limited capability.'
