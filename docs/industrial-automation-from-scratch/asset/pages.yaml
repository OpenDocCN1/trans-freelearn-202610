    # Using the compare instructions


    The compare instructions are used to test the relationship between two values
    from two sources.


    The following table shows the compare instructions available in S7 1200:


    | Compare Instruction | Meaning |

    |---|---|

    | CMP == | Equals |

    | CMP <> | Not equal |

    | CMP >= | Greater than or equal to |

    | CMP <= | Lesser than or equal to |

    | CMP < | Less than |

    | CMP > | Greater than |


    Table 9.1 – The compare instructions and their meaning


    We will learn how to use CMP > in this book. The same concept applies to other
    compare instructions.'
