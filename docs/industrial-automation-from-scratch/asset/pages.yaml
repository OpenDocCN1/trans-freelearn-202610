- pgno: 356
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_356_0.png)


    Figure 9.49 – Level control


    The tank has two level sensors (a high-level sensor and a low-level sensor). The
    low-level sensor is connected to I0.2, while the high-level sensor is connected
    to I0.3. A pump connected to Q0.0 via a contactor supplies liquid to the tank.
    The start push button (normally open) is connected to I0.0, while the stop push
    button (normally closed) is connected to I0.1. The pump ON indicator is connected
    to Q0.1. A manual discharge valve is used to discharge the liquid when required.


    When the start push button is pressed and released and there is no liquid in the
    tank, in other words, the low-level sensor cannot detect liquid, the pump should
    start running until the liquid fills the tank, in other words, the high-level
    sensor detects liquid.


    When the manual discharge valve is opened and the liquid falls below the high-level
    sensor, the pump should not start until the liquid falls below the low-level sensor.


    Anytime the stop button is pressed, the pump should stop running. A pilot lamp
    should indicate when the pump is running.'
  merge: -1
  img_proc: true
- pgno: 357
  md: "# Note\n\nThe level sensor used here is a vibrating fork-level sensor. It’s\
    \ a type of level sensor in which a tuning fork vibrates or oscillates at its\
    \ natural frequency when not in contact with a material (liquid, free-flowing\
    \ solids, granules, or powders), its frequency changes when in contact with a\
    \ material and it gives an output signal that can be fed to a PLC as input.\n\n\
    The program can be written as follows:\n\n![](img/b10cb271ed113c7ba5bfded0a75d13e0_357_0.png)\n\
    \n![](img/b10cb271ed113c7ba5bfded0a75d13e0_357_1.png)\n\nFigure 9.50 – Level control\
    \ program using a ladder diagram\n\nThe different networks are explained as follows:\n\
    \n+   - **Network 1:** When the start push button connected to I0.0 is pressed,\
    \ I0.0 in the program will be closed, and since the stop push button connected\
    \ to I0.1 is normally closed, I0.1 in the program will be closed and this energizes\
    \ the coil M0.0. When the start push button is released, the coil M0.0 will remain\
    \ energized due to a normally open push button with the same address as M0.0 that’s\
    \ in parallel with I0.0. When the stop push button is pressed, the normally closed\
    \ contact with the address I0.1 in the program will be opened and the coil with\
    \ the address M0.0 will be de-energized.\n+   \n+   - **Network 2:** When M0.0\
    \ is energized (due to the start button being pressed and released) and the low-level\
    \ sensor is not detecting any liquid, the normally closed contact with the address\
    \ I0.2 is closed, and since M0.1 is a normally closed contact, Q0.0 will be energized\
    \ and the pump will start running to supply water to the tank. The normally open\
    \ contact with the address I0.2 that’s in parallel with the normally closed"
  merge: -1
  img_proc: true
- pgno: 358
  md: 'contact with the address I0.2 creates an alternative path for the signal to
    flow to the coil (Q0.0) to keep the pump running even when the low-level sensor
    detects liquid and the high-level sensor has not yet detected any liquid.


    +   - **Network 3:** When M0.0 is energized (due to the start button being pressed
    and released) and the low-level and high-level sensors have not detected liquid,
    the normally open contact with the addresses I0.2 and I0.3 will be opened in the
    program, M0.1 will be de-energized and the pump keep running. M0.1 is used in
    rung 2 (network 2) to cause the pump to stop when energized. The normally open
    contact with the address M0.1 in rung 2 (network 2) will become open when the
    address M0.1 in rung 3 (network 3) is energized and this will cause the pump to
    stop running. This will happen when the tank is full.


    The normally open contact with the address M0.1 in parallel with I0.3 is used
    to create an alternative path for the signal to flow to M0.1 when the manual discharge
    valve is open and the water level in the tank decreases gradually. As the water
    decreases, it will get to a point where it will fall below the high-level sensor,
    causing the normally open contact with the address I0.3 (which was closed when
    water was full) to open, and since we don’t want M0.1 to be de-energized to cause
    the pump to start immediately (in other words, we want it to start when the liquid
    level falls below the high- and low-level sensors), the address M0.1 is used to
    keep the coil M0.1 energized so that the pump can remain off until the liquid
    falls below the low-level sensor with the address I0.2. Recall from the operation
    that when the manual discharge valve is opened and the liquid falls below the
    high-level sensor, the pump should not start until the liquid falls below the
    low-level sensor.


    +   - **Network 4:** This rung is responsible for the pump ON indicator. A normally
    open contact with the same address as the coil for the pump, in other words, Q0.0,
    is used as input, while a coil with the address Q0.1 is used in the output section
    of the rung. Anytime Q0.0 is energized (which must happen in order for the pump
    to run), the normally open contact with the address Q0.0 will close and Q0.1 will
    be energized.'
  merge: -1
  img_proc: true
