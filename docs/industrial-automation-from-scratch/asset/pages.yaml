    # Using a real PLC (Siemens S71200 – CPU 1211C – AC/DC/RLY)


    In this example, we will wire and program a PLC to keep a heater turned on until
    the value at MD8 (the scaled value) is greater than or equal to 100. This is a
    simple control system technique that can be applied to temperature, pressure,
    or level control.


    # Requirements'
  merge: -1
  img_proc: true
- pgno: 543
  md: 'In addition to TIA Portal used in the simulation, the following devices are
    also required to demonstrate analog input signal processing with a real PLC:


    +   - An RTD temperature sensor (Pt100)

    +   - An RTD temperature transmitter

    +   - A power supply (220 V AC to 24 V DC)

    +   - A PLC (Siemens S7-1200)

    +   - A contactor

    +   - A heating element

    +   - An Ethernet cable

    +   - A PC or laptop with TIA Portal installed


    # Wiring:


    +   1. Connect the power to the AC input of the power supply using a breaker.
    Connect the power to the AC input of the PLC through the circuit breaker. Also
    connect AC power to terminal 1 (L1) and terminal 3 (L2) of the contactor as shown
    in the diagram.

    +   2. Connect the two terminals of the heater to terminal 2 (T1) and 4 (T2) of
    the contactor as shown.

    +   3. A three-wire Pt100 RTD comes with three wires – two of the wires have a
    resistance of 100 Ohms between them. The two wires should be connected to the
    two terminals with a resistance symbol in between them while the last (third wire)
    should be connected to the other terminal with no resistance sign as shown.

    +   4. Connect the positive terminal of the 24 V DC to the positive terminal of
    the transmitter.

    +   5. Connect the negative terminal of the transmitter to the first analog input
    channel (0).'
  merge: -1
  img_proc: true
- pgno: 544
  md: "+   6. Connect the negative terminal of the power supply unit to the negative\
    \ terminal of the 24 V DC output of the PLC (M) and also connect it to the common\
    \ terminal of the analog input channel (2M) as shown.\n+   \n+   7. Connect a\
    \ 500-Ohm resistor between the first analog input (0) and 2M as shown.\n+   \n\
    +   8. Connect Q0.0 on the PLC to A1 on the contactor and connect 1L on the PLC\
    \ to live (L) on the breaker. Also, connect A2 on the contactor to Neutral (N)\
    \ on the breaker as shown:"
  merge: -1
