  md: 'Figure 2.47 – Retro-reflective photoelectric sensor


    +   3. **Diffused reflective**: With this sensor, the emitter and the receiver
    are in the same housing and facing the same direction. The emitter sends out a
    constant beam of light that diffuses in all directions, filling a detection area.
    When a target object enters the area, it deflects part of the beam back to the
    receiver. The target acts as the reflector. Detection occurs when light is reflected
    off the disturbance (or target) object. Let''s have a look at this:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_78_0.png)


    Figure 2.48 – Diffused photoelectric sensor


