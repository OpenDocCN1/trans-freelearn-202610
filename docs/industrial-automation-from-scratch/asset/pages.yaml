  md: 'When a HART-enabled SMART field device or instrument is used with a HART-compatible
    controller in the control room, more benefits can be obtained from the field instrument.


    Apart from the wired HART that has been explained here, WirelessHART also exists.
    It is a wireless communication protocol that add wireless capability to HART technology.
    WirelessHART provides a cost-effective way to deliver new measurement values to
    control systems without the need to run additional wires.


    # Note


    SMART field devices are transmitters or actuators that consist of a processor
    and other components. They provide more benefits than the traditional analog field
    devices, which include diagnostics and other features of control that would have
    been required in the main controller in the control room. Diagnostics in a smart
    field device can indicate out-of-specification operations, communication link
    failures, and predict failures that could develop. Most SMART field instruments
    are HART, Foundation Fieldbus, or PROFIBUS protocol-enabled. SMART is an acronym
    for Single Modular Auto-ranging Remote Transducer.


    There are two types of HART networks:


    +   - **Point-to-point**: A point-to-point connection can be seen in the following
    diagram. Here, the digital signal is superimposed on the 4-20mA analog signal.
    The measured or process variable is transmitted as a 4-20mA analog signal and
    all additional information is transmitted using a digital signal:'
