- pgno: 575
  md: 'Figure 13.10 – Fiber optic cable (Single Mode Fiber) (source: https://commons.wikimedia.org/wiki/File:Optical_fiber_connectors-optical_patch_cable-01ASD.jpg)


    Wireless network: A wireless network uses radio waves through Bluetooth, Wi-Fi,
    and cellular communication as a communication channel. A radio wave can be referred
    to as an electromagnetic wave. It can propagate through air, vacuums, liquids,
    or even solid objects. It can be used to establish communication between two or
    more devices without cables:'
  merge: -1
  img_proc: true
- pgno: 576
  md: '+   - **Bluetooth:** This is a wireless technology standard for short-range.
    It is used to communicate or exchange data between fixed and mobile devices over
    short distances using ultra-high frequency radio waves from 2.402 to 2.48 GHz
    to build a **personal area network (PAN)**.

    +   - **Wi-Fi:** This is a wireless communication technology that uses radio waves
    to establish communication between devices. It can also be referred to as a standard
    **wireless local area network (WLAN)** technology that allows computers and various
    devices to connect to each other as well as to the internet without cables. Computers
    and other devices can connect to exchange data via Wi-Fi. Wi-Fi is not an acronym
    but a brand name.

    +   - **Cellular Communication (Mobile Telephone System):** This is a wireless
    communication technology that uses radio waves to establish communication between
    devices. Here, the radio network is distributed over the land through cells, where
    each cell includes a fixed location transceiver (base station). The cells provide
    radio coverage over larger areas. Mobile phones or any devices with a radio transmitter
    and receiver installed in their circuitry can communicate, even if the equipment
    is moving through cells.


    The following are some of the generations of cellular communication/mobile telephone
    systems:


    +   - **1G:** This is the first generation of cell phone technology. It uses an
    analog signal. Its maximum speed is 2.4 Kbps.

    +   - **2G:** This is the second generation of cell phone technology. The network
    is digital, unlike the first generation, which was analog. During the era of 2G,
    cellular phones were used for data and voice. The maximum speed of 2G with GPRS
    is 50 Kbps or 1 Mbps with **Enhanced Data Rates for GSM Evolution (EDGE)**. GPRS
    is also called 2.5G – that is, the technology between the second and third generations
    of mobile telephony.'
  merge: -1
  img_proc: true
- pgno: 577
  md: '**GPRS** is an acronym for **General Packet Radio Service**. It is a packet-switching
    technology that uses radio waves to enable data transfers through cellular networks.
    It is used for mobile internet and other data communications.


    +   - **3G**: This is the third generation of cell phone technology. It was introduced
    in 2001 with the main objective of facilitating greater voice and data capacity,
    increasing data transmission at low costs, and supporting a wide range of applications.
    Its speed ranges between 2 Mbps and 21.6.6 Mbps for HSDPA+.

    +   - **4G**: This is the fourth generation of cell phone technology. It was developed
    to provide high quality, high capacity, and high speed with improved security
    and lower cost for voice, data, multimedia, and internet over IP (internet protocol).
    It is suitable for gaming, high-definition mobile TV, video conferencing, cloud
    computing, and more. Its speed range is between 100 Mbps and 1 Gbps.

    +   - **5G**: This is the fifth generation of cell phone technology. It was designed
    to provide reliable connectivity to mobile users and connected devices at a speed
    range of 10 Gbps to 20 Gbps.


    5G provides lots of outstanding features, including the following:


    +   - Improved mobile phone capabilities and a great capacity to support virtual
    reality.

    +   - The ability to control physical infrastructures, cars, and other devices
    remotely with ultra-reliable, high-availability, and low-latency connections.

    +   - Seamlessly connects a great number of sensors and devices to the internet
    (IoT). This is a key feature that is useful for Industry 4.0 (Smart Factory),
    which will be discussed in the next chapter.


    This section discussed network media. You should now understand both wired and
    wireless networks and the various generation of cellular networks'
  merge: -1
  img_proc: true
- pgno: 578
  md: '– that is, 1G, 2G, 3G, 4G, and 5G. Now, let’s learn about network connectors
    and other network components.


    # Network connectors and other network components


    Let’s have a brief look at network connectors.


    Network connectors allow wired network media (coaxial cable, twisted pair, fiber
    optic, and so on) to connect to a network such as hubs, switches, routers, controllers,
    PCs, and other devices in a network. They are used to terminate a segment of network
    cable.


    The following are some examples:


    +   - **BNC Connector:** BNC is an acronym for **Bayone-Neill-Concelman**. A BNC
    connector is used for coaxial cables:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_578_0.png)'
  merge: -1
  img_proc: true
- pgno: 579
  md: 'Figure 13.11 – BNC connector (source: https://commons.wikimedia.org/wiki/File:BNC_connector_20050720_001.jpg)


    +   PROFIBUS connector: This is usually used with a PROFIBUS cable to establish
    communication between devices using the PROFIBUS protocol:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_579_0.png)


    Figure 13.12 – PROFIBUS connector (source: https://commons.wikimedia.org/wiki/File:0x-pb-stecker-verschieden.jpg)


    +   RJ45 connector: This is one of the most common network connectors in the world.
    RJ45 is an acronym for Registered Jack 45. It is usually used for twisted pair
    cables (CAT 5 or CAT 6):'
  merge: -1
  img_proc: true
- pgno: 580
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_580_0.png)


    Figure 13.13 – RJ45 connector (source: https://commons.wikimedia.org/wiki/File:KonektorRJ45.jpg)


    Some other networking components are as follows:


    +   - **Switch:** A switch is a device that connects different devices such as
    PCs, printers, and more in a network and allows them to share information and
    resources. In industrial automation, a switch can connect two or more PLCs, HMIs,
    PCs, and other automation and control devices and allow them to communicate with
    each other. The following figure shows a switch:'
  merge: -1
  img_proc: true
- pgno: 581
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_581_0.png)


    Figure 13.14 – Switch (source: https://commons.wikimedia.org/wiki/File:5_Port_Gigabit_Netzwerk-Switch_TL-SG1005D_02.jpg)


    There are two types of switch, as follows:


    +   - **Unmanaged switch**: A type of switch that does not require any configuration
    for it to work. They are used for basic connectivity.

    +   - **Managed switch**: This is a type of switch that requires configuration
    to make it fit our network or needs. It has many security features that can be
    configured, enabled or disabled. Some of these features include web authentication,
    access control, VLAN, and port enabling/disabling. A managed switch allows statistical
    analysis of packets and provides more special features than an unmanaged switch.'
  merge: -1
  img_proc: true
- pgno: 582
  md: '+   - **Router**: A router is a network device that routes data packets from
    the source to the destination in a network. Devices that are networked via a switch
    can be connected to the internet via a router. A router works with IP addresses
    and can connect two or more different networks or subnetworks, unlike a switch,
    which works with **Media Access Control (MAC)** addresses and can connects devices
    such as PCs, printers, and more in the same network. Routers receive incoming
    data packets, analyze them and direct them to another network.


    There are two types of routers, as follows:


    +   - **Wireless router**: This does not require any wire or cable to connect
    devices

    +   - **Wired router**: This requires wire or cable to connect network devices


    +   - **Repeater**: This is a device that amplifies or increases signal strength,
    so the signal can travel more distance with good quality. In addition, we can
    adapt different physical media to each other, such as a coaxial cable to an optical
    fiber, using a repeater.


    Now that we have learned about a few network components, let’s understand network
    protocols.


    # Understanding network protocols


    A network protocol can be referred to as a method of data communication between
    two or more devices on a network. It is a set of rules that should be adhered
    to for communication to occur between two or more connected devices. Industrial
    network protocols enable communication between industrial network devices such
    as PLCs, HMIs, VFDs, PCs, transmitters, actuators, and more. This protocol encompasses
    the network topology, network media, network connectors, and more.'
  merge: -1
  img_proc: true
- pgno: 583
  md: 'Many protocols are used around the world for communication. We will focus on
    industrial network protocols in this book.


    Common industrial network protocols can be grouped as wired and wireless networks.


    # Wired network protocols


    Wired network protocols can be grouped into two areas, as follows:


    **Fieldbus**: Fieldbus is a group of industrial network protocols used for real-time
    distributed control, standardized as IEC 61158. One great advantage of the Fieldbus
    protocol is that network cable use is reduced – that is, less wiring is required.
    It supports various network topologies such as bus, ring, and star. It is mostly
    used in industrial networks due to its simplicity and reliability. The following
    are popular Fieldbus protocols that are used in industrial automation or process
    control:


    +   - Foundation Fieldbus H1

    +   - PROFIBUS

    +   - HART

    +   - DeviceNet

    +   - CC-Link

    +   - AS-i

    +   - Modbus RTU


    **Industrial Ethernet**: This is another group of industrial network protocols
    that utilize standard Ethernet protocols for process control and automation. They
    have high performance and can integrate easily into an office network. The following
    protocols are in this group:


    +   - PROFINET'
  merge: -1
  img_proc: true
- pgno: 584
  md: '+   - Foundation Fieldbus HSE

    +   - Ethernet/IP

    +   - Ethernet CAT

    +   - Modbus TCP/IP


    # Wireless network protocols


    Wireless network protocols are a group of protocols that allows communication
    between devices without the use of wires. They are mostly used by sensors and
    measuring devices. The following are common wireless network protocols that are
    used in industrial automation:


    +   - Bluetooth

    +   - Wi-Fi

    +   - Cellular


    In the next few sections, we will learn about some common industrial network protocols.


    # Common industrial network protocol – Foundation Fieldbus


    This protocol is developed by the **International Society of Automation (ISA)**.
    Its application areas include petrochemicals, food and beverages, power, and other
    heavy-process applications. It is used to connect foundation Fieldbus-enabled
    devices such as sensors/transmitters to a control system with less wiring. It
    allows several Fieldbus devices to use a single cable.'
  merge: -1
  img_proc: true
- pgno: 585
  md: 'Two types of foundation Fieldbus implementation are Foundation Fieldbus H1
    and Foundation Fieldbus High-Speed Ethernet (HSE):


    +   - **Foundation Fieldbus H1**: This version provides speeds of up to 31.25
    Kbps. Twisted pair cables and fiber optic cables can be used as network media.
    It provides digital communication and DC power over the same twisted pair. It
    is implemented using a bus or star topology. Its network can have up to 32 nodes
    per segment. It is used for communication between several sensors/transmitters
    and actuators (field devices) and a PLC, DCS, or any other form of controller.

    +   - **Foundation Fieldbus HSE (High-Speed Ethernet)**: This version provides
    speeds up to 100 Mbps. It is used to connect higher-level devices (for example,
    PCs, controllers, and remote I/O). Twisted pair cables and fiber optic cables
    can also be used as network media. It is an industrial Ethernet-based protocol
    that can be implemented using a star or tree topology. You can easily add or remove
    devices without affecting the network.


    A linking device is usually used to connect a Foundation Fieldbus H1 to a Foundation
    Fieldbus HSE network, as shown in the following diagram:'
  merge: -1
  img_proc: true
- pgno: 586
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_586_0.png)


    Figure 13.15 – Foundation Fieldbus H1 and HSE


    Now, let’s learn about the PROFIBUS protocol.


    # Common industrial network protocol – PROFIBUS


    PROFIBUS is an acronym for Process Fieldbus. It is a standard protocol that can
    be used to connect sensors/transmitters, actuators, controllers, HMIs, VFDs, and
    more. Two-core twisted, shielded cables called PROFIBUS cables (Figure 13.8) are
    used for communication. A PROFIBUS connector (Figure 13.12) is used to connect
    to each device in the network. The PROFIBUS protocol comes in two forms, as follows:'
  merge: -1
  img_proc: true
- pgno: 587
  md: '● **PROFIBUS DP (Decentralized Peripherals)**: PROFIBUS DP is among the most
    commonly used network protocols in the industry. It is an industrial network protocol
    that reduces the number of wires required to connect sensors and actuators by
    decentralizing the **input and output (I/O)** modules.


    Before PROFIBUS DP, I/Os were centralized in the control room, as shown in the
    following diagram, leading to lots of cables being used to wire sensors and actuators
    (which could be far away from the control room) to the input and output modules
    in the control room. Instead of connecting individual sensors and actuators in
    the field directly to the PLC’s input and output modules in the control room,
    we can install an **Interface Module (IM)**; then, the input and output modules
    far away from the control room and the sensors and actuators can connect to it
    in the field area. Then, a single cable (PROFIBUS cable) can connect the faraway
    I/Os in the field (remote I/Os) to an IM in the PLC located in the control room,
    as shown in *Figure 13.17*. This greatly minimizes the cables required during
    wiring. We can have up to 32 devices in the PROFIBUS DP network per segment. The
    data transfer speed varies from 9.6 Mbps to 12 Mbps:'
  merge: -1
  img_proc: true
- pgno: 588
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_588_0.png)


    Figure 13.16 – Centralized control system


    The following diagram shows a decentralized control system in which a PROFIBUS
    cable connects remote I/Os in the field to the PLC in the control room through
    an IM:'
  merge: -1
  img_proc: true
- pgno: 589
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_589_0.png)


    Figure 13.17 – Decentralized control system


    PROFIBUS PA (Process Automation): This is used to monitor process measuring devices
    through a control system. Here, the I/O module that’s used in PROFIBUS DP is no
    longer required, nor is any wiring between each sensor and I/O module. The sensors
    are connected in a linear form to a single PROFIBUS PA bus. The network of sensors
    and actuators are then connected to a PLC via a coupler and a single cable (PROFIBUS
    cable), as shown in the following diagram. The segment coupler converts the PROFIBUS
    PA signals into a PROFIBUS DP signal. The segment coupler is required because
    the PLC does not have a PROFIBUS PA port. It only has a PROFIBUS DP port. PROFIBUS
    PA has a fixed data transfer speed of 32 Kbps:'
  merge: -1
  img_proc: true
