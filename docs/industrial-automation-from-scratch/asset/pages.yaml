- pgno: 107
  md: 'There are three types of pneumatic rotary actuators. Let''s explore them in
    the next sections.


    # Scotch yoke


    In a **scotch yoke** actuator, a piston is connected to a rotary shaft. An increase
    in the air pressure moves the piston linearly, which rotates the rotary shaft
    through a cam. A double-acting type will require air pressure on the other side
    to cause rotation in the opposite direction.


    The following diagram shows the parts of a scotch yoke pneumatic rotary actuator:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_107_0.png)


    Figure 3.22 – Scotch yoke pneumatic rotary actuator


    # Vane


    A **vane** is a type of rotary actuator that doesn''t use a piston that will move
    linearly before converting to circular motion internally. It creates circular'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'motion directly from compressed air through a movable vane in the air chamber.


    The following diagram shows the parts of a pneumatic vane actuator:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_108_0.png)


    Figure 3.23 – Vane pneumatic rotary actuator


    # Rack and pinion


    In a **rack-and-pinion** actuator, the piston moves a rack past a gear pinion.
    This action rotates the pinion to produce a circular motion at the output shaft.
    The following diagram shows the parts of a rack and pinion pneumatic rotary actuator:'
  merge: -1
