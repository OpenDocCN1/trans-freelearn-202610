  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_275_0.png)


    Figure 8.8 — A relay logic circuit


    In the first rung, when push button 1 is pressed, lamp 1 will be ON, and when
    push button 1 is released, lamp 1 will be OFF.


    In the second rung, push button 2 and push button 3 must be pressed for lamp 2
    to be ON. When any of the buttons are released, the lamp will be OFF.


    The third rung is a latching circuit that energizes a relay coil (CR1) when push
    button 4 is pressed. The coil remains energized even when the button'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'is released. The reason for the coil remaining energized is due to the fact
    that the NO contact of the relay coil (CR1) is in parallel with push button 4.
    Hence, when the button is pressed, the coil (CR1) becomes energized and its contacts
    close. The closed contact of CR1 (which is in parallel with push button 4) serves
    as an alternative path for the current to flow to the coil. Hence, the coil remains
    energized. Push button 5 is a stop button (NC), which will cut the flow of current
    to the coil when pressed, and the coil will be de-energized until push button
    4 is pressed.


    LD, which we will learn about in this and subsequent sections, is similar to a
    relay logic circuit. This is the reason why most technicians find it easy to understand
    and work with LD. But unlike a relay logic circuit, which uses component symbols,
    as shown in the preceding diagram, LD uses symbolic notation to express logic
    operation. The following screenshot shows the LD of the preceding circuit using
    Siemens programming software:'
  merge: -1
  img_proc: true
- pgno: 277
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_277_0.png)


    Figure 8.9 – LD using Siemens programming software


