    If more than two nodes are needed in the network, we can implement a star topology,
    where each node (PLC 1, PLC2, PLC 3, HMI 1, HMI 2, and any other devices) will
    connect to a central component (switch). PROFINET also supports the bus topology.


    Devices in a PROFINET network have three addresses (IP address, MAC address, and
    device name). We implemented a very simple network using the PROFINET protocol
