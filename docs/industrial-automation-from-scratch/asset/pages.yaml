- pgno: 103
  md: 'In a **pneumatic linear actuator**, compressed air entering a chamber or cylinder
    builds up pressure and can cause a piston to move forward or backward in a linear
    motion when the pressure built up in the chamber contrasts with the outside atmospheric
    pressure.


    Pneumatic linear actuators come in two types:


    +   - Single-acting cylinders

    +   - Double-acting cylinders


    In a **single-acting cylinder**, there is only one port for air to flow into the
    cylinder. When air enters through this port, the pressure increases and pushes
    a piston forward for the push type or backward for the pull type. A spring that
    is positioned in or outside the cylinder returns the piston to its original position
    to make it ready for another burst of pressure.


    The following diagram shows the symbol of a single-acting cylinder:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_103_0.png)


