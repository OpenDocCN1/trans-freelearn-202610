- pgno: 606
  md: '# Exploring Smart Factory (Industry 4.0) with 5G


    A smart factory is an intelligent factory that is characterized by connectivity
    and digitalization in the production or manufacturing structure that depends on
    the utilization of machinery connected to the internet. Data is stored in the
    cloud and used to monitor and control production or manufacturing processes. The
    stored data is also used to make decisions and resolve issues that may arise.


    Industry 4.0 is the current trend in manufacturing that combines computation,
    network, and physical process integrations (cyber-physical systems), automation,
    and the Internet of Things (IoT) to create a smart factory. In a smart factory,
    machines are connected to the cloud via smart sensors and other smart devices.
    Smart factories merge the virtual world with the physical world.


    Industry 4.0 is a new phase in the industrial revolution that increases production
    and efficiency with reduced cost. Many industries are now looking toward upgrading
    or switching to a smart factory due to its many benefits, which we will look at
    in this chapter. A smart factory can be seen as an advancement in industrial automation
    that allows automated machines or equipment in a factory to be controlled and
    monitored from anywhere in the world via the internet. Industry 4.0 is powered
    by data and other key technologies, which we will also look at in this chapter.


    Upon completing this chapter, you should be able to understand what smart factories
    are, their benefits, and the steps for building one. You will also understand
    how 5G, which we learned about in Chapter 13, Industrial Network and Communication
    Protocols Fundamentals, will be of benefit in a smart factory.


    In this chapter, we will cover the following topics:'
  merge: -1
  img_proc: true
- pgno: 607
  md: '+   - Understanding Industry 4.0

    +   - Exploring the key technologies in Industry 4.0

    +   - The benefits of Industry 4.0

    +   - Steps for building a smart factory

    +   - The benefits of a 5G-enabled smart factory

    +   - Connecting your PLC or machine data to the cloud


    # # Understanding Industry 4.0


    To have a better understanding of Industry 4.0, we need to understand the industrial
    revolution.


    The industrial revolution refers to the transition and changes in industrial or
    manufacturing processes with new innovative technologies.


    Let’s take a look at a brief history of the industrial revolution and its transitions:


    +   - The **first industrial revolution (Industry 1.0)** started around 1784.
    Here, machines were used in industries and powered by steam.

    +   - The **second industrial revolution (Industry 2.0)** started around 1870.
    Here, electricity was introduced in powering industrial machines. The mass production
    process also came into play during the second industrial revolution. Assembly
    lines operated by humans were used for mass production.

    +   - The **third industrial revolution (Industry 3.0)** started around 1969.
    In this revolution, automation was introduced into industrial processes. It was
    during this revolution that industrial processes started using sensors, actuators,
    controllers, and robots, which made production or industrial processes require
    little or no human effort. This book focuses on the use and implementation of
    automation in the industry.'
  merge: -1
  img_proc: true
- pgno: 608
  md: 'The **fourth industrial revolution (Industry 4.0)** was introduced around 2011.
    This is the new phase of the industrial revolution. Here, industrial machines
    are connected to the internet. These machines can think, make decisions, and communicate
    with each other over the internet with little or no human intervention. You can
    access any machine from anywhere in the world via the internet.


    Industry 4.0 involves the intelligent networking of machines and industrial processes
    with the help of information and communication technology. Machines, computers,
    and other devices are connected and communicate with each other to make decisions
    regarding industrial or production processes with little or no human intervention.
    It incorporates IoT, cloud computing, big data, and other technologies.


    Industry 4.0 enhances what was started in Industry 3.0 (the use of automated machines
    and computers) with smart and autonomous systems powered by IoT, artificial intelligence,
    cloud computing, and other technologies associated with Industry 4.0. These will
    be explained in the next section.


    # Exploring the key technologies in Industry 4.0


    Industry 4.0 implements various existing technologies in a more advanced way.
    The key technologies in Industry 4.0 are as follows:


    **Internet of Things (IoT)**: This refers to a network of physical objects or
    devices that collect data with the help of sensors and communicate with each other
    via the internet. In the manufacturing or other production industry, IoT is a
    technology that allows field devices (sensors and actuators) to communicate with
    each other with little or no human intervention. This is called **Industrial Internet
    of Things (IIoT)**. IIoT is a component of Industry 4.0. It enables manufacturers
    to monitor the status, performance, and health of devices, schedule'
  merge: -1
  img_proc: true
- pgno: 609
  md: 'predictive maintenance, or perform remote troubleshooting and improve operation
    safety and security.


    +   - **Robotics**: Robots are programmed machines that can carry out a series
    of tasks with little or no human intervention. They can make decisions based on
    input and carry out specific tasks on their own. Robots are important components
    in Industry 4.0.

    +   - **Artificial intelligence (AI)**: This is a technology or computer program
    that enables a computer or robots to perform tasks that are usually carried out
    by humans. With AI, machines can now learn, think, and act like humans. Note that
    there is still no program that matches human flexibility and capacity to operate
    in various areas. However, some are available that make machines work and operate
    like human experts in some specific areas.


    Machines can now learn from past experiences, and reason and plan just like humans,
    which enables them to perform complex tasks. AI is concerned with the development
    of smart machines that would have ordinarily required human intelligence. AI requires
    machine learning, data analytics, and more to function. Machine learning is a
    method used to train a computer or machine to learn from its inputs without explicitly
    programming it for every situation.


    Data analytics is the science of analyzing raw data to obtain meaningful information
    or draw out a conclusion. Data analytics helps make sense of data. Information
    obtained from data analytics can be used to optimize processes and increase efficiency.
    In the manufacturing or production industries, the runtime, downtime, and job
    queues for various machines can be analyzed and used to plan the workload for
    the machines to operate effectively.


    When robotics is combined with AI, we have what’s called an intelligent robot
    – that is, a programmed machine that can behave like a human or mimic human behavior,
    such as learning, reasoning, planning, problem-solving, and more.'
  merge: -1
  img_proc: true
- pgno: 610
  md: '+   - **Cloud computing**: This involves storing data on the internet and having
    access to the stored data when required. Data from various devices is stored in
    a remote server so that it can be accessed from anywhere in the world via the
    internet when required.

    +   - **Cyber security**: This is a technology or practice that involves defending
    data, servers, computers, and other devices in a network from malicious attacks.

    +   - **Augmented reality and virtual reality**: **Augmented reality (AR)** is
    a technology that provides an interactive 3D experience by combining a real-world
    view with computer-generated elements in real time. It can come in the form of
    goggles (that is, AR goggles) or a tablet or smartphone that uses the camera of
    the respective device to see the real world in front of the viewer and manipulate
    it by superimposing a computer-generated element on it. AR can interpret, manipulate,
    and enhance real-world views in real time. It allows you to interact with the
    real world in a meaningful way. It can instantly provide useful information to
    maintenance engineers wearing the AR headset. **Virtual reality (VR)**, on the
    other hand, is a technology that places a user inside a 3D computer-generated
    environment/element. The user can move around and interact with these computer-generated
    3D elements. VR creates a complete virtual world or computer environment within
    the headset. Engineers, designers, or clients using VR headsets can move around
    a facility or product, viewing it under different lighting conditions without
    the need to produce a prototype.


    We’ll look at the benefits of Industry 4.0 in the next section.


    # The benefits of Industry 4.0


    Industry 4.0 comes with various benefits:


    +   - **It increases productivity**: Industry 4.0 increases productivity because
    more can be produced faster. Industry 4.0 reduces downtime, leading to more production.'
  merge: -1
  img_proc: true
- pgno: 611
  md: '+   - **It increases efficiency**: Since Industry 4.0 reduces downtime, more
    products are produced faster.

    +   - **Flexibility**: Industry 4.0 makes your industry or manufacturing process
    flexible as you can easily scale production up or down. It is also easy to introduce
    new products to a production line.

    +   - **Cost reduction**: Industry 4.0 reduces production or manufacturing costs
    due to automation, IoT, and other technologies that have been integrated into
    the manufacturing processes. However, you will need to invest some amount of money
    at the setup stage.

    +   - **Increased revenue**: Industry 4.0 increases revenue due to automation
    and other industry 4.0 technologies that have been implemented. Less staff will
    be required to carry out tasks in many cases.

    +   - **Worker safety**: Industry 4.0 leads to worker safety as the machines being
    used on the production line require little or no human intervention and can be
    operated remotely via the internet.


    Now that you know the benefits of Industry 4.0, let’s have a look at the steps
    for building a smart factory.


    # Basic steps for building a smart factory


    The following points will help in developing a smart factory:


    +   - **Know your needs and define your goals**: Just like any other investment,
    you must first identify the reasons why you want to build a smart factory, define
    the goals, and prioritize them. A smart factory is usually created in phases.
    Understanding your needs and goals and prioritizing them will help you invest
    in the right equipment or tools at the right time in each phase.

    +   - **Start with the areas that will be most beneficial**: You don’t have to
    start with all areas of your facility at once. You can make your smart'
  merge: -1
  img_proc: true
- pgno: 612
  md: 'factory implementation a gradual process.


    +   - **Train your personnel on the new technology:** A smart factory involves
    new technologies that your existing staff might not be conversant with. It is
    important to get your staff equipped with the required skills to work with the
    new equipment and devices required in a smart factory.

    +   - **Hire a skilled workforce:** Besides training your existing staff on the
    new technologies in a smart factory, you may also need to bring in a skilled workforce.
    For example, a data analyst will help turn your factory data into usable data
    that can help in planning and making meaningful decisions. Other skilled workforces
    that are required in a smart factory include IT experts with networking and network
    security skills, robotics experts with a good understanding of the basic operation
    and programming of robots, PLC programmers, HMI programmers, and more.

    +   - **Guard against cyber attacks:** A smart factory connects equipment and
    devices to the cloud. Your factory is prone to cyber attacks from cyber criminals,
    which are on the increase. Take necessary precautions to protect your data and
    equipment from cyber attacks.

    +   - **Invest in new equipment and tools:** New equipment will be required to
    facilitate a smart factory. For instance, smart sensors and other smart devices
    will be required to help in getting machine data to the cloud. Computers and software
    will also be required to store, analyze, and manage data effectively.

    +   - **Keep updating your smart factory implementation:** You are not likely
    to fully implement a smart factory in all areas of your facility at once. You
    will need to keep updating your smart factory implementation by expanding to other
    areas of your facility after one area is completed.

    +   - **Develop a good wireless connection:** Wireless connectivity is key in
    building a smart factory. A good wireless network, such as 5G, will enable fast
    and reliable data exchange that will make a smart factory that relies on internet
    connectivity a reality.'
  merge: -1
  img_proc: true
- pgno: 613
  md: 'In the next section, we will discuss the benefits of a 5G-enabled smart factory
    in more detail.


    # The benefits of a 5G-enabled smart factory


    The following are the benefits of using 5G in a smart factory:


    +   - With 5G, more smart sensors and smart devices can be connected to the internet,
    boosting IoT capacity. This leads to a massively connected factory.

    +   - 5G enables staff using AR/VR headsets to move freely on the factory floor
    and stay connected to the private 5G network. A 5G network can provide the high-speed
    requirement for AR/VR to function effectively.

    +   - 5G enables staff to monitor machine performance, analyze production processes,
    and share that information between various smart factory locations for proper
    decision-making and planning. A 5G network enables large amounts of data to be
    analyzed at high speed.

    +   - Robots are used extensively in industries to move products, and some are
    also designed to work alongside humans. Most of these industrial robots are powered
    by a wired network connection because the current wireless speed is not good enough
    to make them perform effectively. With the emergence of 5G, robots can now be
    connected wirelessly without the limitation of cables, allowing them to be well
    utilized and maximized in a smart factory. 5G helps collaborative robots to perform
    better.

    +   - 5G enables the use of AI in a smart factory to offer more tangible features
    that lower-speed networks cannot provide.


    In summary, 5G connectivity enables automation and other key technologies of Industry
    4.0 such as IoT, AI, robotics, cloud computing, AR/VR, and more to function effectively,
    leading to an increase in'
  merge: -1
  img_proc: true
- pgno: 614
  md: 'efficiency, an increase in the productivity and quality of the factory, and
    an improvement in the working conditions of the staff in a smart factory.


    Let’s proceed to the next section, where we will briefly look at connecting PLCs
    to the cloud.


    # Connecting your PLC or machine data to the cloud


    It’s important to discuss how our PLC data can get to the cloud since it’s key
    in a smart factory. In this section, we will briefly talk about the IIoT gateway,
    which is a key component required to get PLC or machine data to the cloud.


    An IIoT gateway can be a piece of hardware or software that can integrate various
    devices such as sensors, actuators, PLC, and lots more, collect data from them,
    and transmit it to the cloud or local servers. It allows connected devices and
    the outside world (the cloud) to communicate. It can be referred to as a bridge
    that sits between connected devices in an industrial environment and the cloud.
    With the IIoT gateway, you can monitor and control machines or devices in the
    factory from anywhere in the world since the device’s data is available in the
    cloud. You can monitor the data via a dashboard on a PC, tablet, or smartphone
    connected to the internet; you can also send commands from your PC, tablet, or
    smartphone to control your equipment or machine. In each case, data passes through
    the IIoT gateway. It is one of the required pieces of equipment when setting up
    a smart factory. The IIoT gateway understands different protocols used by IoT
    devices, such as Bluetooth, Zigbee, MQTT, Wi-Fi, cellular, and others. The IIoT
    gateway processes critical data close to the source of data, which leads to quick
    decision-making and less load on the central platform. This is known as edge computing.


    There are various models of the IIoT gateway from different manufacturers. Examples
    of IIoT gateways from Siemens include SIMATIC IOT2020, SIMATIC IOT2040, and SIMATIC2050.
    The Siemens SIMATIC IOT2050 is an intelligent IoT gateway that connects internal
    IT, manufacturing, cloud'
  merge: -1
  img_proc: true
- pgno: 615
  md: 'department, and combines data from various sources. It is built with powerful
    Texas instrument ARM processor (AM6528). It has 1 GB of DDR4 RAM. SIMATIC IOT2050
    comes with multiple interfaces such as mPCIe slots for wireless card, Gbit LAN,
    USB port, Serial port, Arduino port to connect to Arduino UNO Rev3 and DP Port
    to connect directly to a monitor.


    The following are some other IIoT gateway manufacturers and their models:


    +   - **Advantech**: UNO-125IG

    +   - **Welotech**: EG602W, EG503W, EG602L

    +   - **Softing**: UAGATE SI, UAGATE MB, and edgeGate

    +   - **WLINK**: WL-D80 and G510-LF4 (compatible with 5G)


    Each IIoT gateway has manuals and guides that will help with installing and configuring
    them. Some will also have a forum where you can learn from those that have used
    the device.


