    # Contactor


    A **contactor** is an electrically operated switch just like a relay. It is a
    switch that can be operated electrically unlike manual and mechanically operated
    switches. It usually consists of at least one coil, and up to three NO contacts.
    In some instances, an auxiliary contact that operates with the main contact is
    included. The terminals of the coil are usually labeled A1 and A2. When a current
    is supplied to the coil through terminals A1 and A2, it becomes energized and
    the magnetic field forces the contacts to close simultaneously. When the power
    is removed, the contacts become open.'
  merge: -1
  img_proc: true
