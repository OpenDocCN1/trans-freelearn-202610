  md: 'Figure 7.6 – Siemens digital output module (SM322, DO 16X DC24V/0.5A)


    The credit for this figure goes to *Showlight Technologies Ltd.* ([www.showlight.com](http://www.showlight.com))


    The output module takes the processed signal from the CPU to control output devices
    such as lights, relays, contactors, and so on.


    Let’s have a look at other PLC modules.


    # Other PLC modules


    Other than the above-mentioned PLC modules, there are other modules you can find
    in a PLC. These include the following:


    +   - **Communication module**: This allows the PLC to communicate with other
    PLCs, PCs, and other devices within the factory facility or at a faraway distance.
    Communication module of a PLC usually have an interface or communication port
    that supports a particular communication or protocol (for example, PROFIBUS, PROFINET,
    DeviceNet, Modbus, AS-i or Ethernet). You can learn about network protocol in
    *[Chapter 13, Industrial Network and Communication Protocols Fundamentals](#)*.
    Communication module for S71200 PLC system include CM 1241 RS232, CM 1241 RS485,
    CM 1243-2 AS-i Master, CM 1242-5 PROFIBUS DP-Slave, CM 1243-5 PROFIBUS DP-Master,
    CP 1242-7 GPRS depending on the kind of communication or protocol you intend to
    use.

    +   - **Positioning module**: This module allows various position control, speed
    control, torque control, and so on to be carried out in a motion control system.
    Examples of positioning modules for the Q-series Mitsubishi PLC are QD77/GF4,
    QD77/GF8, QD77/MS16, and so on.


    Note'
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Inductive loads can deliver back currents that can damage output relays. A
    diode, varistor, or another snubber circuit should be used to protect the PLC
    output from being damaged by the back current.


    In this section, you have learned about the power supply module, CPU module, input
    module, and output module. They are the main parts of a PLC system. Having a good
    understanding of the parts explained in this section will help to better understand
    subsequent sections.


    # Exploring PLC types


    Based on the hardware specifications, there are two basic types of PLC:


    +   - Compact

    +   - Modular


    Let’s have a look at each of the types.


    # Compact PLC


    In this, the CPU, input module, output module, and sometimes the power supply
    are integrated into a single module.


    It has a fixed/limited number of I/O by default, but some are designed to support
    expansion modules, which can be added to increase the number of inputs and outputs.
    A compact PLC can also be referred to as a fixed or integrated PLC. S7-200 and
    S7-1200 are examples of compact PLCs by Siemens, while FX 1N, FX2N, and others
    are examples of compact PLCs from Mitsubishi. Other PLC manufacturers also have
    their compact PLC series/models.


    The following figure shows a compact PLC from Siemens (S7-1200, CPU 1211C, AC/DC/Rly):'
  merge: -1
  img_proc: true
- pgno: 232
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_232_0.png)


    Figure 7.7 – Compact PLC from Siemens


    The credit for this figure goes to Showlight Technologies Ltd. (www.showlight.com.ng).


    # Modular PLC


    In this, the CPU, input module, output module, and power supply are separate,
    that is, they are not integrated together. Each module is plugged into a common
    rack/chassis or bus. The number of inputs and outputs can be increased by plugging
    in additional input and output modules depending on the system requirement. The
    rack/chassis serves as the backbone of the PLC system that plugs every module
    (power supply, CPU, input, output, and other modules) together. The following
    figure shows a modular PLC from Siemens (S7-300):'
  merge: -1
  img_proc: true
