- pgno: 330
  md: '# Latching and unlatching in PLC programming


    Latching is a technique used to keep an output energized or activated even when
    the input ceases. Latching makes a momentary push-button act as a maintained switch;
    in other words, after the push button is pressed, the output is turned on to remain
    energized (ON) even when the button is released.


    Unlatching is simply a method or technique used to de-energize a latched output.


    # A latch and unlatch program using normally open push buttons for both starting
    and stopping


    Write the simple program in network 3 to see how latching and unlatching works
    with a normally open push button for starting and a normally open push button
    for stopping:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_330_0.png)'
  merge: -1
  img_proc: true
- pgno: 331
  md: 'Figure 9.27 – A latch and unlatch program using normally open push buttons
    for both starting and stopping


    The PLC wiring for the program is as follows:


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_331_0.png)


    Figure 9.28 – Wiring to implement a latch and unlatch program using normally open
    push buttons for both starting and stopping'
  merge: -1
  img_proc: true
- pgno: 332
  md: 'The preceding wiring diagram shows the start push button (normally open) connected
    to I0.4, and the stop push button (normally open) connected to I0.5. A load, which
    can be the coil of a contactor, is connected to Q0.2.


    When the start button is pressed, the normally open contact with the address I0.4
    in the program will be closed. Power will flow to energize the coil with the address
    Q0.2 because I0.5 in the program is a normally closed contact. When the start
    button is released, the normally open contact with the address I0.4 in the program
    opens, but the output with the address Q0.2 remains energized due to the normally
    open contact with the same address as the output (Q0.2) that is parallel to I0.4.
    Coil Q0.2, which is energized (ON), closes the normally open contact with the
    address Q0.2 in parallel to I0.4. This creates an alternative path for the signal
    to flow to Q0.2. Hence, the output coil with the address Q0.2 remains ON even
    when the button is released. This is referred to as latching.


    When the stop push button is pressed, the normally closed contact with the address
    I0.5 is opened. Power will no longer flow to the coil. The output coil with the
    address Q0.2 will become de-energized (OFF). This is referred to as unlatching.


    The stop push button used here is unsafe because when the push button fails, the
    output will remain energized and the machine will keep running. This is not preferred
    and is unsafe for industrial use.


    # A latch and unlatch program using a normally open push button for starting and
    a normally closed push button for stopping


    Edit the program in network 3 such that the normally closed contact used for I0.5
    will be a normally open contact, as shown in the following screenshot:'
  merge: -1
  img_proc: true
