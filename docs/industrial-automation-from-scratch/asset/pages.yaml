- pgno: 520
  md: 'The practical part (hands-on) will give you a better understanding. While every
    part of this book is important, in particular, Chapter 7, Understanding PLC Hardware
    and Wiring, Chapter 8, Understanding PLC Software and Programming with TIA Portal,
    and Chapter 9, Deep Dive into PLC Programming with TIA Portal, are all required
    to easily understand this section.


    There are specific controllers designed for temperature control – for example,
    the JTC903 controller used in the previous section for temperature control. We
    also have controllers designed specifically to measure pressure or level. However,
    a PLC can be wired and programmed to control any measurable quantity such as temperature,
    level, or pressure. We just need to use the right sensor or transmitter and actuator,
    wire it in the right way, and program it to perform the desired control function.
    Hence, the PLC is a key component in process control.


    Let’s have a brief look at analog signals for a better understanding of the practical
    part that follows.


    # Understanding analog signals


    Unlike digital signals, which can only be in two states (0 or 1), analog signals
    have a continuous range of values from the minimum to the maximum. They can present
    what’s between 0 (minimum, for example, 0 V or 4 mA) and 1 (maximum, for example,
    5 V, 10 V or 20 mA). When a voltage varies from 0 V to 10 V, or when a current
    varies from 4 mA to 20 mA, it is called an analog signal. Examples of sensors
    and transmitters that produce an analog signal output are temperature transmitters,
    pressure transmitters, and flow transmitters. Before a PLC can process analog
    values, it must be converted into digital information first – this is done by
    the Analog-to-Digital Converter (ADC) in the analog module of a PLC. One important
    feature of an analog module is its resolution in bits.


    Basically, an 8-bit analog module will have 0 to 254 representing 4 mA to 20 mA
    or 0 V to 10 V depending on whether the analog signal connected to it is a current
    or a voltage. A 10-bit analog module will have 0 to 1023'
  merge: -1
  img_proc: true
