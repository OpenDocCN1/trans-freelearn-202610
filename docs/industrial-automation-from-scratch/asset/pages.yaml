    # Brushless DC motors


    This design does not contain brushes. Hence, there is no wear and tear of brushes
    as experienced in a brushed type of DC motor. The stator (armature) consists of
    windings of coil through which current is passed to produce a magnetic field.
    The rotor is made of a permanent magnet unlike the brushed type.


    When a DC power is applied to the stator, it becomes an electromagnet. The force
    and reaction between the permanent magnet in the rotor and the electromagnet created
    in the stator produces the required rotation. A common example of a brushless
    DC motor is the type used in the fan of a computer power supply, as shown in the
    following figure:'
