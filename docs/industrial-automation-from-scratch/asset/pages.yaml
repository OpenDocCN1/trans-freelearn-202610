- pgno: 225
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_225_0.png)


    Figure 7.4 – CPU of Siemens PLC (S7-300 CPU 313)


    The credit for this figure goes to *Showlight Technologies Ltd.* ([www.showlight.com](http://www.showlight.com)).


    The CPU of a PLC functions like the brain of a human. The entire range of human
    activities (including walking, sitting, standing, and others) is controlled by
    the brain. Similarly, the entire operation of the PLC is controlled by the CPU.
    The CPU of a PLC can also be linked to the CPU of a PC, which controls all the
    activities of the computer. A computer without a CPU cannot function and likewise,
    a PLC without the CPU cannot function. The CPU executes the program written into
    the PLC and makes the decisions needed by the PLC to automate or operate machinery
    and communicate with other devices.


    Let’s have a look at the next module in our list, the input module.


    # The input module


    The input module is the part that connects all the input devices (switches and
    sensors) to the PLC. It allows the PLC to monitor the current state of switches
    and sensors that are required to perform the necessary control functions when
    executing a program. Input modules can basically be classified as digital and
    analog. Digital input modules are used when the input devices to be connected
    produce a discrete signal (ON or OFF), while analog input modules are used when
    the input device to be connected produces an analog signal (that is 0-5V, 0-10V,
    0-20mA, or 4-20mA).


    The following figure shows a digital input module for a Siemens PLC (SM321, DI
    16X DC24V):'
  merge: -1
  img_proc: true
- pgno: 226
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 227
  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_227_0.png)


    Figure 7.5 – Siemens digital input module (SM321, DI 16X DC24V)


    The credit for this figure goes to *Showlight Technologies Ltd.*

    ([www.showlight.com.ng](http://www.showlight.com.ng)).


    The input module receives signals from switches and sensors and sends them to
    the CPU for processing.


    Let’s have a look at the output module.


    # The output module


    This is the part that connects the PLC to the output devices or actuators. An
    output device can be a light, relay, contactor, solenoid valve, control valve,
    and so on. The PLC output module operates or controls the output devices based
    on the state of the inputs and the result of the written program in the CPU. Output
    modules can also be classified into two, namely digital output modules and analog
    output modules. The digital output module can control output devices or loads
    that are either ON or OFF. Examples of such loads or devices include lights, relays,
    contactors, solenoid valves, and others.


    The digital output module produces binary outputs (1 or 0), which means ON or
    OFF for loads that are either ON or OFF. Analog output modules, on the other hand,
    produce variable or changing signals that can range from 0-5V, 0-10V, 0-20mA,
    or 4-20mA. They are used for controlling output devices that require a control
    signal between full ON and full OFF.


    Examples of such loads or devices include analog voltmeters, analog ammeters,
    control valves, VFDs, and so on. For example, an output module can be connected
    to a control valve to vary the opening or closing of the control valve slowly
    between full ON and full OFF. You can decide to open a control valve to half or
    one-third of its full capacity depending on the need.


    The output module of a PLC can be a transistor, a TRIAC, or a relay type, depending
    on the type of component used in the output circuit to switch the'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'load ON or OFF.


    In a transistor output type, a transistor is in the output circuitry for switching
    loads ON or OFF. A transistor type of output can only switch a DC load. A transistor-type
    output is fast, has a longer lifetime, and switches small currents.


    In a TRIAC output type, TRIAC is used in the output circuitry for switching loads
    ON and OFF. It can only switch AC loads (that is, it cannot be used for DC loads).
    It also has a longer lifetime and is faster when compared to the relay output
    type.


    In a relay type, relays are used in the output circuitry for switching loads.
    It can be used for both AC and DC loads. It is the most common type of PLC output.


    The following figure shows the Siemens digital output module:'
  merge: -1
  img_proc: true
