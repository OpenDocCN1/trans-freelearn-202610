    # Understanding a basic VFD parameter setting


    It is not enough to know how to wire a VFD without knowing how to change a parameter
    setting. A properly wired VFD, as shown in Figure 5.9,'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'will not function as desired if the parameter setting for the required function
    is not used.


    A VFD parameter is a variable associated with the operation of a VFD that can
    be adjusted or altered to make the VFD function in a particular way. Adjusting
    or altering the values of parameters of a VFD to make it operate in a particular
    way can be referred to as **VFD programming**. Each VFD manufacturers and models
    have parameter settings that are peculiar to each model. It is important to consult
    the manual for the VFD manufacturer and model you want to use to be able to alter
    the parameter setting. We will be using the parameter setting of General Electric
    VFD (VAT 20) to explain a VFD parameter setting in this book.


    The following table shows a few of the parameters in a GE VFD (VAT 20) manual
    (https://inverterdrive.com/file/GE-VAT20-Manual-200401):


    | List of parameters |

    |---|---|---|---|---|---|

    | Function | FN_ | Function description | Unit | Range | Factory setting |

    |  | 0 | Factory adjustment |  |  | 0 |

    | Acceleration/deceleration time | 1 | Acceleration time | 0.1s | 0.1–999s | 5s
    |

    |  | 2 | Deceleration time | 0.1s | 0.1–999s | 5s |

    | Operation mode | 3 | 0: Forward/Stop, Reverse/Stop

    1: Run/Stop, Forward/Reverse | 1 | 0 -- 1 | 0 |

    | Motor direction | 4 | 0: Forward   1: Reverse | 1 | 0 -- 1 | 0 |

    | Jog frequency | 9 | Jog frequency | 0.1Hz | 1.0–120Hz | 6Hz |

    | Operation control | 10 | 0: Keypad   1: External terminal | 1 | 0 -- 1 | 0 |

    | Frequency control | 11 | 0: Keypad

    1: External terminal (0–10V)/(0–20mA)

    2: External terminal (4–20mA) | 1 | 0 --2 | 0 |

    | Stop method | 14 | 0: Deceleration stop

    1: Free run stop | 1 | 0 -- 1 | 0 |


    Table 5.1 – The parameters in a GE VFD (VAT 20) manual


    We will now discuss some of the parameters.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '+   - **Operation mode (F03):** This parameter allows you to specify the way
    you want the two push buttons connected to terminal 3 and terminal 4 to function.
    The two options available are as follows:

    +     - **Forward/stop and reverse/stop:** Value = 0

    +     - **Run/stop and forward/reverse:** Value = 1


    Specifying 0 as the value for parameter F03 will make the push button or switch
    connected to terminal 3 function as forward/stop, while the push button or switch
    connected to terminal 4 will function as reverse/stop. Specifying 1 as the value
    for the parameter will make the push button or switch connected to terminal 3
    function as run/stop, while the push button or switch connected to terminal 4
    will function as forward/reverse.


    +   - **Operation control (F10):** This parameter allows you to specify your choice
    of operating the VFD. The two available options are as follows:

    +     - **Keypad:** Value = 0

    +     - **External terminal:** Value = 1


    Specifying 0 as the value for parameter F10 allows you to operate the VFD (run/stop)
    using the keypad or operator panel on the VFD. Specifying 1 as the value for the
    parameter allows you to operate the VFD using push buttons, switches, or via a
    signal from an external device (a PLC or controller).


    +   - **Frequency control (F11):** This parameter allows you to specify a frequency
    source. The three options available are as follows:

    +     - **Keypad:** Value = 0

    +     - **External terminal (0–10V or 0–20mA):** Value = 1'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# External terminal (4–20mA): Value = 2


    Specifying 0 as the value for parameter F11 allows you to set the frequency of
    the VFD using the keypad (operator panel). Specifying 1 as the value for the parameter
    allows you to set the frequency using a potentiometer connected to terminals 8,
    9, and 10), as shown in the wiring (pictorial diagram) of Figure 5.9, or send
    a signal of 0–10V or 0–20mA from an external device. Specifying 2 as the value
    for the parameter allows you to set the frequency by sending a 4–20mA signal from
    an external device.


    It is advisable to study the manual of any VFD you want to work with. We have
    learned about some VFD parameter settings of General Electric VFD (VAT 20). You
    can learn more from the manual of the VFD. Let’s get our hands dirty with a practical
