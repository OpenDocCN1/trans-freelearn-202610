  md: '![](img/b10cb271ed113c7ba5bfded0a75d13e0_522_0.png)


    ![](img/b10cb271ed113c7ba5bfded0a75d13e0_522_1.png)


    Figure 12.18 – An S7-1200 (CPU 1211C, AC/DC/RLY) PLC showing analog input channels
    (Credit: Showlight Technologies Ltd.: www.showlight.com.ng)


    There are various data types for the Siemens S7-1200 controller, which include
    `bool`, `byte`, `word`, `INT`, and `REAL` types. The most common data types used
    in analog signal processing are `INT` and `REAL` because read-in analog signal
    values exist as 16-bit integers, which `INT` can hold since `INT` is 16 bits.
    To avoid rounding errors, `REAL` should be used to get more precise results since
    `REAL` can hold floating-point numbers or decimals.


    # Reading analog values'
