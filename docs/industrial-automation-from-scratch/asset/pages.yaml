    Figure 2.32 – SPDT float switch when the pump is full


    In the next section, we will explore another mechanically operated switch.


    # Pressure switch


    A pressure switch is a form of sensor that closes or opens an electrical contact
    when a certain pressure is obtained through an increase or decrease in pressure.


    A mechanical pressure switch consists of a process connection, measuring element,
    switch contacts, electrical connection, and a setpoint adjustment screw.


    The core part of a mechanical pressure switch is its measuring element. Elastic
    diaphragms or stainless-steel pistons are usually used for this purpose. The diaphragm
    is designed for vacuum or low pressure ranges up to 16 bars, while the piston
    is suitable for higher pressure ranges up to 350 bars. The process connection
    and case are usually made of galvanized steel or brass. The process connection
    is the part that connects to the air supply'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'or for the process to control. The switch contacts are the internal contacts
    that open or close as pressure increases or decreases. The electrical connection
    connects to the internal electrical contact, which opens or closes as pressure
    rises or falls. The setpoint adjustment screw can be used to calibrate or adjust
    the switch (that is, set the pressure at which the switch opens or close).


    The following diagram shows the cross-section of a pressure switch:'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'ELECTRICAL CONNECTION


    SETPOINT ADJUSTMENT SCREW


    SWITCH CONTACTS


    MEASURING ELEMENTS


