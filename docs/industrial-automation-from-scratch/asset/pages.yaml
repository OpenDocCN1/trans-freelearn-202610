  md: 'With S7-1200, the address of the first analog input channel is %IW64, while
    the second is %IW66. An analog output of 4 to 20 mA, 0 to 10 V, or 2 to 10 V from
    the transmitter is connected to the first or second channel.


    Regardless of resolution, the Siemens PLC always converts the voltage or current
    into a word value (digitized value) in which the rated maximum value is 27,648
    and the data type is INT. Hence, 0 to 10 or 4 to 20 mA will be rated 0 to 27,648,
    as shown in the following table:


    | Analog values (4 to 20 mA) | 4 mA | 8 mA | 12 mA | 16 mA | 20 mA |

    | Analog values (0 to 10 V) | 0 V | 2.5 V | 5 V | 7.5 V | 10 V |

    | Digitized values | 0 | 6,912 | 13,824 | 20,736 | 27,648 |


    Table 12.7 – The digitized values of five analog signals from minimum (0 mA or
    0 V) to maximum (20 mA or 10 V) for Siemens


    0 to 27,648 is a Siemens standard (rated range) for representing the analog signal
    input of 0 to 10 V or 4 to 20 mA in their analog module. It is not dependent on
    resolution and cannot be changed. However, the resolution explained earlier affects
    the accuracy of your reading. The higher the resolution, the more detail you can
    capture in your reading. 27,648 is not actually the maximum value – it is just
    the rated maximum. The real maximum value is 32,768 (that is, 15 bits = 215) and
    can be used in a calculation to determine the effect of the resolution, as indicated
    here:


    +   - 8-bit resolution is 2^8 = 256. The smallest change you can have will be
    32,768/256 = 128. Hence, you can change in increments of 128 from 0 to 27,648
    for 0 V to 10 V, as in, 0, 128, 256 ...... 27,648.

    +   - 12-bit resolution is 2^12 = 4,096. The smallest change you can have will
    be 32,768/4,096 = 8. Hence, you can change in increments of 8 from 0 to 27,648
    for 0 to 10 V, as in, 0, 8, 16 ...... 27,648.

    +   - 15-bit resolution is 2^15 = 32,768. The smallest change you can have will
    be 32,768/32,768 = 1. Hence, you can change in increments of 1 from 0 to 27,648
    for 0 to 10 V, as in, 0, 1, 2, 3, 4 ...... 27,648.'
  merge: -1
  img_proc: true
- pgno: 524
  md: 'The digitized value of 0 to 27,648 will need to be normalized for further processing.


    # Normalization and scaling


    **Normalize** is an inbuilt function in S7-1200 for converting any given data
    from a minimum to a maximum to 0 to 1 in float values. It requires you to enter
    the minimum and maximum values as well as the register containing the data to
    be converted – for example, `%IW64` if the analog signal is connected to the first
    analog input channel. The minimum is 0 while the maximum is 27,648. Our practical
    session will show the way to use **normalize**.


    **Scale** is an inbuilt function in S7-1200 for converting the normalized value
    from 0 to 1 into the required range. You will learn how to **scale** in the practical
    session.


    # Analog input signal processing (a practical demonstration)


    Having gone through the basics of analog signal processing, let’s get our hands
    dirty to get a practical understanding of the theories. We will start with a simulation
    using a virtual PLC to enable those without a real PLC to demonstrate it. We will
    then use a real PLC that can be practiced by anyone that can afford a PLC and
    the other materials required.


    # Simulation (using a virtual PLC)


    The following step-by-step guide requires that you have TIA Portal installed on
    your laptop or PC. Refer to *Chapter 8, Understanding PLC Software and Programming
    with TIA Portal*, to learn how to download and install TIA Portal. You can download
    and use it for 21 days:'
  merge: -1
  img_proc: true
