- pgno: 127
  md: '+   - In a star connection, similar points (start or end points) of three coils
    (that is, U1, V1, and W1 or U2, V2, and W2) are connected together to form a neutral
    point and three wires run from the remaining three terminals. In delta, the end
    point of each coil is connected to the starting point of another coil to form
    a closed loop and three wires are taken out from the coil joints.

    +   - A star connection has a neutral point while a delta connection has no neutral
    point.

    +   - In a star connection, the phase voltage is 1/√3 line voltage. In delta,
    phase voltage is equal to line voltage.

    +   - The speed of a star-connected motor is slow because it receives 1/√3 of
    line voltage while the speed of a delta-connected motor is fast because each phase
    gets the total line voltage.

    +   - A star connection is commonly used in power transmission while a delta connection
    is common in power distribution and industries.


    Let''s have a look at **direct on line (DOL)** starters.


    # Direct on line (DOL) starters


    A DOL starter is a method for starting a three-phase induction motor. It can also
    be referred to as an across the line starter. It is the simplest type of starter,
    which connects the three-phase motor directly to the power supply through a contactor.
    A DOL starter consists of a circuit breaker, contactor, overload relay, and push
    buttons (normally open (NO) and normally closed (NC) push buttons). Let''s take
    a look at some of these in detail in the following sections.


    # Circuit breaker


    This is a switching device that can automatically interrupt current flow whenever
    a fault occurs. It protects a circuit from damage caused by overcurrent/overload
    or a short circuit. It can also be operated manually to'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'supply or disconnect power from a circuit. It connects the power from a source
    to the next device (contactor) in a direct online starter.


    The following figure shows a photo of a two-pole circuit breaker mounted on a
    **Deutsches Institut für Normung (DIN)** rail, which is the German institute for
