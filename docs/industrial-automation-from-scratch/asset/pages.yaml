  md: 'When the NC push button connected to I0.1 is pressed, the corresponding indicator
    light (I0.1) will be OFF, and when the button is released, the corresponding indicator
    light (I0.1) will be ON.


    The operation of the connected output devices (contactor and lamp) is a function
    of the program written into the PLC, which is covered in *Chapter 8*, *Understanding
    PLC Software and Programming with TIA Portal*.


    When the written program is executed and the result of the logic energizes or
    activates Q0.0, the corresponding indicator light on the PLC (Q0.0) will be ON
    and the contactor will be energized. Similarly, when the result of the logic energizes
    or activates Q0.1, the corresponding indicator light on the PLC (Q0.1) will be
    ON and the lamp will be ON.


    PLC wiring and programming work together. You need to understand the PLC wiring
    covered in this chapter to have a better understanding of the programming covered
    in *Chapter 8*.


    You have just completed the PLC wiring part of this book. You should now be able
    to connect push buttons, limit switches, proximity sensors, lights, relays, contactors,
    solenoid valves, and other input or output devices to a PLC.


    # Summary


    Congratulations! You have successfully completed *Chapter 7* of this book. Good
    job! The chapter gives a good explanation of what you need to know about PLCs
    starting from the basic to the more advanced part involving wiring. You should
    now have a good understanding of what a PLC really is, the basic types available,
    PLC modules, and various wiring that you may need to carry out on PLCs as an industrial
    automation engineer. This chapter focuses on the hardware part of PLC.


    The next chapter focuses on the software part, where you will learn how to program
    PLCs to perform automated tasks.


