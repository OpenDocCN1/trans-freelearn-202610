    简介”等更低层级标题，层级关系更像是一节而不是顶层章。
  - 该行“## 7 通过 GUI 将数据存储到 MySQL 数据库”中“##”与“7”之间缺少常规顶层章标题的“第 X 章”或“Chapter X”格式，更像从某章标题中提取出的编号残留与子标题拼接，存在排版噪声的可能。
