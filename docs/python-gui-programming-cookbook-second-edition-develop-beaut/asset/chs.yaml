  \n## 使用模块级全局变量\n\n封装是任何编程语言的主要优势，使我们能够使用面向对象编程（OOP）进行编程。Python 既支持面向对象编程，也支持过程式编程。我们可以创建局部于其所在模块的全局变量。它们仅对该模块是全局的，这是封装的一种形式。为什么我们需要这样？因为随着我们向\
  \ GUI 添加越来越多的功能，我们希望避免可能导致代码中出现 bug 的命名冲突。\n\n> 我们不希望命名冲突在我们的代码中造成 bug！命名空间是避免这些\
  \ bug 的一种方法，在 Python 中，我们可以通过使用 Python 模块（即非官方命名空间）来做到这一点。\n\n### 准备工作\n\n我们可以在任意模块中、函数外部且紧邻函数上方的位置声明模块级**全局变量**。\n\
  \n然后，我们必须使用 Python 的 `global` 关键字来引用它们。如果忘记在函数中使用 `global`，就会意外创建新的局部变量。这将是一个 bug，也是我们确实不想做的事情。\n\
  \n> Python 是一种动态、强类型语言。只有在运行时，我们才会注意到诸如此类的 bug（忘记使用 `global` 关键字来限定变量作用域）。\n\n###\
  \ 操作步骤...\n\n将第 17 行所示的代码添加到我们在上一个配方 *如何从控件中获取数据* 中使用的 GUI 中，以创建一个模块级全局变量。我们使用 C\
  \ 风格的全大写约定，这并不完全符合 Python 风格，但我认为这确实强调了我们在本配方中讨论的原则：\n\n```\n6 #====================\n\
  7 # imports\n8 #====================\n9 import tkinter as tk\n10 from tkinter import\
  \ ttk\n11 from tkinter import scrolledtext\n12 from tkinter import Menu\n13 from\
  \ tkinter import messagebox as msg\n14 from tkinter import Spinbox\n15 from time\
  \ import sleep        # careful - this can freeze the GUI\n16 \n17 GLOBAL_CONST\
  \ = 42\n18\n```\n\n运行代码会输出全局变量的值。注意，42 被打印到 Eclipse 控制台：\n\nGUI_const_42_print.py\n\
  \n```\n213 # Printing the Global works\n214 print(GLOBAL_CONST)\n215 \n216 name_entered.focus()\n\
