  \ Python GUI\n- 防止 GUI 被调整大小\n- 向 GUI 表单添加标签\n- 创建按钮并更改其文本属性\n- 文本框控件\n- 将焦点设置到控件并禁用控件\n\
  - 组合框控件\n- 创建具有不同初始状态的复选框\n- 使用单选按钮控件\n- 使用滚动文本控件\n- 在循环中添加多个控件\n\n### 简介\n\n在本章中，我们将用\
  \ Python 开发我们的第一个 GUI。我们将从构建一个可运行的 GUI 应用程序所需的最少代码开始。随后每个方案都会向 GUI 表单添加不同的控件。\n\n\
  在前两个方案中，我们将展示全部代码，仅由几行代码组成。在接下来的方案中，我们将只展示需要添加到之前方案中的代码。\n\n到本章结束时，我们将创建一个可用的 GUI\
  \ 应用程序，其中包含标签、按钮、文本框、组合框、各种状态的复选框，以及用于更改 GUI 背景颜色的单选按钮。\n\n在每章开头，我会展示属于该章的 Python\
  \ 模块。然后，我会引用与所展示、学习和运行的代码相关的各个模块。\n\n以下是本章涉及的 Python 模块（以 .py 扩展名结尾）概览：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_30_0.png)\n\
  \n## 创建我们的第一个 Python GUI\n\nPython 是一种非常强大的编程语言。它内置了 `tkinter` 模块。只需几行代码（准确地说，四行），我们就可以构建出第一个\
  \ Python GUI。\n\n### 准备工作\n\n要遵循本方案，一个可用的 Python 开发环境是前提条件。Python 自带的 IDLE GUI 足以开始。IDLE\
  \ 就是使用 tkinter 构建的！\n\n- 本书中的所有方案都是在 Windows 10 64 位操作系统上使用 Python 3.6 开发的。它们没有在任何其他配置上测试过。由于\
  \ Python 是一种跨平台语言，每个方案的代码预计都可以在任何地方运行。\n- 如果你使用的是 Mac，它确实自带 Python，但可能缺少一些模块，例如\
  \ tkinter，而本书中我们将全程使用该模块。\n- 我们使用的是 Python 3.6，Python 的创造者特意选择不使其向后兼容 Python 2。如果你使用的是\
  \ Mac 或 Python 2，你可能需要从 www.python.org 安装 Python 3.6，才能成功运行本书中的方案。\n- 如果你确实希望在 Python\
  \ 2.7 上运行本书中的代码，则需要进行一些调整。例如，Python 2.x 中的 tkinter 是大写 T。Python 2.7 的 print 语句在\
  \ Python 3.6 中是一个函数，需要加上括号。\n- 虽然 Python 2.x 分支的 EOL（生命周期结束）已延长到 2020 年，但我强烈建议你开始使用\
  \ Python 3.6 及以上版本。\n- 除非真的有必要，否则为什么要固守过去呢？这里有一个链接，指向与 Python 2 的 EOL 相关的 Python\
  \ 增强提案（PEP）373：https://www.python.org/dev/peps/pep-0373/\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_31_0.png)\n\
  \n### 如何操作…\n\n以下是创建最终 GUI 所需的四行 `First_GUI.py` 代码：\n\n```\n```python\n6  #====================\n\
  7  # imports\n8  #====================\n9  import tkinter as tk\n\n11 # Create instance\n\
  12 win = tk.Tk()\n\n14 # Add a title\n15 win.title(\"Python GUI\")\n\n17 #====================\n\
  18 # Start GUI\n19 #====================\n20 win.mainloop()\n```\n```\n\n执行这段代码并欣赏结果：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_32_0.png)\n\n### 工作原理…\n\n在第 9 行，我们导入了内置的\
  \ `tkinter` 模块，并将其别名为 `tk`，以简化我们的 Python 代码。在第 12 行，我们通过调用 Tk 类的构造函数来创建该类的实例（Tk\
  \ 后面的括号将类转换为实例）。我们使用别名 `tk`，因此不必使用较长的 `tkinter` 一词。我们将该类实例分配给名为 `win` 的变量（window\
  \ 的缩写）。由于 Python 是一种动态类型语言，我们不必在赋值前声明此变量，也不必为其指定特定类型。Python 会根据此语句的赋值推断类型。Python\
  \ 是一种强类型语言，因此每个变量始终具有类型。只是我们不必像其他语言那样预先指定其类型。这使 Python 成为一种非常强大且高效的编程语言。\n\n###\
  \ 关于类与类型的一点说明：\n\n- 在 Python 中，每个变量始终具有类型。我们不能创建没有类型的变量。然而，在 Python 中，我们不必像在 C 编程语言中那样预先声明类型。\n\
  - Python 足够聪明，可以推断类型。在撰写本书时，C# 也具备这种能力。使用 Python，我们可以使用 `class` 关键字而不是 `def` 关键字创建自己的类。\n\
  - 为了将类分配给变量，我们必须先创建类的实例。我们创建实例并将该实例分配给我们的变量，例如：\n\n```\nclass AClass(object):\n\
  \    print('Hello from AClass')\nclass_instance = AClass()\n```\n\n现在，变量 `class_instance`\
  \ 的类型是 AClass。如果这听起来令人困惑，请不要担心。我们将在接下来的章节中介绍 OOP（面向对象编程）。\n\n在第 15 行，我们使用类的实例变量\
  \ (`win`) 通过 `title` 属性为窗口设置标题。在第 20 行，我们通过在类实例 `win` 上调用 `mainloop` 方法来启动窗口的事件循环。到目前为止，在我们的代码中，我们创建了一个实例并设置了一个属性，但在我们启动主事件循环之前，GUI\
  \ 不会显示。\n\n- 事件循环是一种使我们的 GUI 正常工作的机制。我们可以将其视为一个无限循环，GUI 在其中等待事件被发送给它。按钮单击会在我们的 GUI\
  \ 中创建一个事件，或者调整 GUI 大小也会创建一个事件。\n- 我们可以预先编写所有 GUI 代码，但在我们调用前面代码中的这个无限循环（`win.mainloop()`）之前，用户的屏幕上不会显示任何内容。当用户单击红色\
  \ X 按钮或我们编程用于结束 GUI 的控件时，事件循环结束。当事件循环结束时，我们的 GUI 也随之结束。\n\n### 更多内容...\n\n本方案使用最少的\
  \ Python 代码创建了我们的第一个 GUI 程序。但是，在本书中，我们将在有意义的情况下使用 OOP。\n\n## 防止 GUI 被调整大小\n\n默认情况下，使用\
  \ tkinter 创建的 GUI 可以调整大小。这并不总是理想的。我们放置在 GUI 表单上的控件最终可能会以不恰当的方式被调整大小，因此在本方案中，我们将学习如何防止\
  \ GUI 应用程序的用户调整我们的 GUI 大小。\n\n### 准备工作\n\n本方案是对前一个方案 *创建我们的第一个 Python GUI* 的扩展，因此一个要求是你已经亲自将第一个方案输入到了自己的项目中，或者从\
  \ https://github.com/PacktPublishing/Python-GUI-Programming-Cookbook-Second-Edition/\
  \ 下载代码。\n\n### 如何操作...\n\n我们要防止 GUI 被调整大小，请看：\n\n```\nGUI_not_resizable.py\n```\n\
  \n```\n6 #====================\n7 # imports\n8 #====================\n9 import tkinter\
  \ as tk\n10\n11 # Create instance\n12 win = tk.Tk()\n13\n14 # Add a title\n15 win.title(\"\
  Python GUI\")\n16\n17 # Disable resizing the GUI by passing in False/False\n18 win.resizable(False,\
  \ False)\n19\n20 # Enable resizing x-dimension, disable y-dimension\n21 # win.resizable(True,\
  \ False)\n22\n23 #====================\n24 # Start GUI\n25 #====================\n\
  26 win.mainloop()\n```\n\n运行这段代码会创建如下 GUI：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_35_0.png)\n\
  \n### 工作原理...\n\n第 18 行防止 Python GUI 被调整大小。\n\n运行此代码将产生一个与我们在第一个方案中创建的 GUI 类似的 GUI。但是，用户无法再调整它的大小。另外，请注意窗口工具栏中的最大化按钮是如何变灰的。\n\
  \n为什么这很重要？因为一旦我们在表单上添加了控件，调整大小可能会使我们的 GUI 看起来不如我们预期的那么好。我们将在接下来的方案中向我们的 GUI 添加控件。\n\
  \nresizable() 方法是 Tk() 类的方法，通过传入 (False, False)，我们防止 GUI 被调整大小。我们可以禁用 GUI 的 x 和\
  \ y 两个维度的调整大小，或者我们可以通过传入 True 或任何非零数字来启用其中一个或两个维度。(True, False) 将启用 x 维度，但阻止 y 维度被调整大小。\n\
  \n我们还为代码添加了注释，为本书中的方案做准备。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_36_0.png)\n\
  \n在诸如 Visual Studio .NET 之类的可视化编程 IDE 中，C# 程序员通常不会考虑防止用户调整他们用该语言开发的 GUI 的大小。这会创建较差的\
  \ GUI。添加这一行 Python 代码可以让我们的用户欣赏我们的 GUI。\n\n## 向 GUI 表单添加标签\n\n标签是一个非常简单的控件，它为我们的\
  \ GUI 增加了价值。它解释了其他控件的用途，提供了额外的信息。这可以引导用户理解 Entry 控件的含义，也可以解释控件显示的数据，而无需用户输入数据。\n\
  \n### 准备工作\n\n我们正在扩展第一个方案《创建我们的第一个 Python GUI》。我们将保持 GUI 可调整大小，因此不要使用第二个方案中的代码（或将\
  \ win.resizable 行注释掉）。\n\n\n\n\n\n## 如何操作...\n\n为了向我们的 GUI 添加一个 Label 控件，我们将从 tkinter\
  \ 导入 ttk 模块。请注意这两个 import 语句。将以下代码添加到 `win.mainloop()` 之前，该语句位于第一和第二份食谱的底部：\n\n\
  GUI_add_label.py\n\n```\n6 #===================\n7 # imports\n8 #===================\n\
  9 import tkinter as tk\n10 from tkinter import ttk\n11\n12 # Create instance\n13\
  \ win = tk.Tk()\n14\n15 # Add a title\n16 win.title(\"Python GUI\")\n17\n18 # Adding\
  \ a Label\n19 ttk.Label(win, text=\"A Label\").grid(column=0, row=0)\n20\n21 #===================\n\
  22 # Start GUI\n23 #===================\n24 win.mainloop()\n```\n\n运行代码后，我们的 GUI\
  \ 中会添加一个标签：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_37_0.png)\n\n## 其工作原理...\n\
  \n在前述代码的第 10 行，我们从 tkinter 包中导入了一个单独的模块。ttk 模块有一些高级控件，能让我们的 GUI 看起来很棒。从某种意义上说，ttk\
  \ 是 tkinter 包中的一个扩展。\n\n我们仍然需要导入 tkinter 包本身，但我们必须指定现在还想使用 tkinter 包中的 ttk。\n\n\
  ttk 代表 themed tk。它改善了我们 GUI 的外观和感觉。\n\n第 19 行在我们调用 mainloop 之前将标签添加到 GUI。\n\n我们将窗口实例传递给\
  \ ttk.Label 构造函数并设置 text 属性。这将成为我们的 Label 显示的文本。\n\n我们还使用了网格布局管理器，我们将在第 2 章《布局管理》中更深入地探讨它。\n\
  \n注意我们的 GUI 突然比之前的食谱小了很多。\n\n它变得这么小的原因是我们向表单添加了一个控件。没有控件时，tkinter 包会使用默认大小。添加控件会导致优化，这通常意味着使用尽可能少的空间来显示控件。\n\
  \n如果我们使标签的文本更长，GUI 会自动扩展。我们将在第 2 章《布局管理》中的后续食谱中介绍这种自动表单大小调整。\n\n## 还有更多...\n\n尝试调整此带标签的\
  \ GUI 的大小并最大化它，看看会发生什么。\n\n## 创建按钮并更改其文本属性\n\n在本食谱中，我们将添加一个按钮控件，并使用此按钮来更改我们 GUI\
  \ 的另一个控件的属性。这让我们了解了 Python GUI 环境中的回调函数和事件处理。\n\n### 准备工作\n\n本食谱扩展了前一个食谱 *向 GUI\
  \ 表单添加标签*。你可以从 `https://github.com/PacktPublishing/Python-GUI-Programming-Cookbook-Second-Edition/`\
  \ 下载全部代码。\n\n### 如何操作…\n\n我们添加一个按钮，点击时执行操作。在本食谱中，我们将更新我们在上一食谱中添加的标签以及按钮的文本属性：\n\n\
  `GUI_create_button_change_property.py`\n\n```\n18  # Adding a Label that will get\
  \ modified\n19  a_label = ttk.Label(win, text=\"A Label\")\n20  a_label.grid(column=0,\
  \ row=0)\n21\n22  # Button Click Event Function\n23  def click_me():\n24      action.configure(text='***\
  \ I have been Clicked! ***')\n25      a_label.configure(foreground='red')\n26  \
  \    a_label.configure(text='A Red Label')\n27\n28  # Adding a Button\n29  action\
  \ = ttk.Button(win, text='Click me!', command=click_me)\n30  action.grid(column=1,\
  \ row=0)\n31\n32  #====================\n33  # Start GUI\n34  #====================\n\
  35  win.mainloop()\n```\n\n以下屏幕截图显示了我们点击按钮之前 GUI 的外观：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_39_0.png)\n\
  \n点击按钮后，标签的颜色发生了变化，按钮的文本也随之改变，如下所示：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_40_0.png)\n\
  \n### 其工作原理…\n\n在第 19 行，我们将标签分配给一个变量，并在第 20 行使用此变量在表单内定位标签。我们需要此变量，以便在 `click_me()`\
  \ 函数中更改其属性。默认情况下，这是一个模块级变量，因此只要我们在调用它的函数之上声明该变量，我们就可以在函数内部访问它。\n\n第 23 行是事件处理程序，当按钮被点击时会被调用。\n\
  \n在第 29 行，我们创建按钮并将 command 绑定到 `click_me()` 函数。\n\n> GUI 是事件驱动的。点击按钮会产生一个事件。我们使用\
  \ `ttk.Button` 控件的 `command` 属性在回调函数中绑定事件发生时要执行的操作。注意我们没有使用括号，只使用了名称 `click_me`。\n\
  \n我们还将标签的文本更改为包含 `red`，因为在印刷版书籍中，否则可能不明显。当你运行代码时，你可以看到颜色确实发生了变化。\n\n第 20 行和第 30\
  \ 行都使用了网格布局管理器，这将在下一章中讨论。这使标签和按钮对齐。\n\n### 还有更多…\n\n我们将继续向我们的 GUI 添加更多控件，并在本书的其他食谱中利用许多内置属性。\n\
  \n## 文本框控件\n\n在 tkinter 中，典型的单行文本框控件称为 Entry。在本食谱中，我们将向我们的 GUI 添加这样的 Entry 控件。我们将使标签更有用，通过描述\
  \ Entry 控件为用户做了什么。\n\n### 准备工作\n\n本食谱基于 创建按钮并更改其文本属性 食谱。\n\n### 如何操作...\n\n查看以下代码：\n\
  \nGUI_textbox_widget.py\n\n```\n22 # Modified Button Click Function\n23 def click_me():\n\
  24     action.configure(text='Hello ' + name.get())\n25\n26 # Changing our Label\n\
  27 ttk.Label(win, text=\"Enter a name:\").grid(column=0, row=0)\n28\n29 # Adding\
  \ a Text box Entry widget\n30 name = tk.StringVar()\n31 name_entered = ttk.Entry(win,\
  \ width=12, textvariable=name)\n32 name_entered.grid(column=0, row=1)\n```\n\n现在，我们的\
  \ GUI 看起来像这样：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_41_0.png)\n\n输入一些文本并点击按钮后，GUI\
  \ 发生了以下变化：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_42_0.png)\n\n### 其工作原理...\n\
  \n在第 24 行，我们获取 Entry 控件的值。我们还没有使用 OOP，那么我们怎么能访问一个甚至还没有声明的变量的值呢？\n\n不使用 OOP 类，在 Python\
  \ 的过程式编码中，我们必须在尝试使用该名称的语句之前物理地放置一个名称。那么为什么这会起作用呢？它确实起作用。\n\n答案是按钮点击事件是一个回调函数，到用户点击按钮时为止，此函数中引用的变量是已知的并且确实存在。\n\
  \n生活很美好。\n\n第 27 行为我们的标签赋予了更有意义的名称；目前，它描述了它下面的文本框。我们将按钮向下移动到标签旁边，以便在视觉上将两者关联起来。我们仍然在使用网格布局管理器，这将在第\
  \ 2 章《布局管理》中更详细地解释。\n\n第 30 行创建了一个变量 name。此变量绑定到 Entry 控件，在我们的 click_me() 函数中，我们能够通过在此变量上调用\
  \ get() 来检索 Entry 控件的值。这工作得很好。\n\n现在我们看到，虽然按钮显示了我们输入的全部文本（以及更多），但文本框 Entry 控件并未扩展。原因是在第\
  \ 31 行我们将其硬编码为宽度 12。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_43_0.png)\n\n-\
  \ Python 是一种动态类型语言，会根据赋值推断类型。这意味着如果我们将字符串赋给 `name` 变量，它将是 `string` 类型，如果我们将整数赋给\
  \ `name`，其类型将是整数。\n- 使用 `tkinter` 时，我们必须在成功使用之前将 `name` 变量声明为 `tk.StringVar()` 类型。原因是\
  \ tkinter 不是 Python。我们可以从 Python 使用它，但它不是同一种语言。\n\n## 设置控件焦点并禁用控件\n\n虽然我们的 GUI 正在变得越来越好，但如果\
  \ GUI 出现时光标就出现在 Entry 控件中会更方便、更有用。在这里我们学习如何做到这一点。\n\n### 准备工作\n\n本食谱扩展了前一个食谱，文本框控件。\n\
  \n### 如何操作...\n\nPython 真的很棒。我们要做的就是在 GUI 出现时将焦点设置到特定控件上，只需在我们之前创建的 `tkinter` 控件实例上调用\
  \ `focus()` 方法即可。在我们当前的 GUI 示例中，我们将 `ttk.Entry` 类实例分配给一个名为 `name_entered` 的变量。现在，我们可以让它获得焦点。\n\
  \n\n\n\n将以下代码放在模块底部启动主窗口事件循环的代码上方，就像我们在之前的配方中所做的那样：\n\nGUI_set_focus.py\n\n```python\n\
  29 # Adding a Textbox Entry widget\n30 name = tk.StringVar()\n31 name_entered =\
  \ ttk.Entry(win, width=12, textvariable=name)\n32 name_entered.grid(column=0, row=1)\n\
  33\n34 # Adding a Button\n35 action = ttk.Button(win, text=\"Click Me!\", command=click_me)\n\
  36 action.grid(column=1, row=1)\n37\n38 name_entered.focus()      # Place cursor\
  \ into name Entry\n39 #========================\n40 # Start GUI\n41 #====================\n\
  42 win.mainloop()\n```\n\n如果出现错误，请确保将变量调用放在声明它们的代码之后。我们还没有使用面向对象编程，因此这仍然是必要的。以后，我们将不再需要这样做。\n\
  \n在 Mac 上，你可能需要先将焦点设置到 GUI 窗口，然后才能将焦点设置到该窗口中的 Entry 控件。\n\n添加这一行（第38行）Python 代码会将光标放入文本\
  \ Entry 控件中，从而使文本 Entry 控件获得焦点。一旦 GUI 出现，我们就可以直接在该文本框中输入，而无需先点击它。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_44_0.png)\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_45_0.png)\n\n注意光标现在默认位于文本 Entry 框内。\n\
  \n我们还可以禁用控件。为此，我们将在控件上设置一个属性。我们可以通过添加下面这一行（下方第37行）Python 代码来创建按钮，从而禁用该按钮：\n\n```python\n\
  34 # Adding a Button\n35 action = ttk.Button(win, text=\"Click Me!\", command=click_me)\n\
  36 action.grid(column=1, row=1)\n37 action.configure(state='disabled')    # Disable\
  \ the Button Widget\n38 \n39 name_entered.focus()        # Place cursor into name\
  \ Entry\n```\n\n添加上述 Python 代码行后，点击按钮将不再产生任何操作：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_45_1.png)\n\
  \n### 工作原理...\n\n这段代码不言自明。我们为其中一个控件设置焦点，并禁用另一个控件。编程语言中良好的命名有助于消除冗长的解释。在本书后面，将介绍一些高级技巧，讲解如何在工作中编程或在\
  \ 家中练习编程技能时做到这一点。\n\n### 更多内容...\n\n是的。这仅仅是第一章。后面还有更多内容。\n\n## 组合框控件\n\n在本配方中，我们将通过添加具有初始默认值的下拉组合框来改进我们的\
  \ GUI。我们既可以将用户限制为只能选择某些选项，也可以允许用户输入他们想要的任何内容。\n\n### 准备工作\n\n本配方扩展了之前的配方“将焦点设置到控件并禁用控件”。\n\
  \n### 操作步骤...\n\n我们使用网格布局管理器在 Entry 控件和 Button 控件之间插入另一列。以下是 Python 代码：\n\nGUI_combobox_widget.py\n\
  \n```python\n31 # Adding a Textbox Entry widget\n32 name = tk.StringVar()\n33 name_entered\
  \ = ttk.Entry(win, width=12, textvariable=name)\n34 name_entered.grid(column=0,\
  \ row=1)                # column 0\n35 \n36 # Adding a Button\n37 action = ttk.Button(win,\
  \ text=\"Click Me!\", command=click_me)\n38 action.grid(column=2, row=1)       \
  \               # <= change column to 2\n39 \n40 ttk.Label(win, text=\"Choose a\
  \ number:\").grid(column=1, row=0)\n41 number = tk.StringVar()\n42 number_chosen\
  \ = ttk.Combobox(win, width=12, textvariable=number)\n43 number_chosen['values']\
  \ = (1, 2, 4, 42, 100)\n44 number_chosen.grid(column=1, row=1)               # <=\
  \ Combobox in column 1\n45 number_chosen.current(0)\n46 \n47 name_entered.focus()\
  \      # Place cursor into name Entry\n48 #========================\n49 # Start\
  \ GUI\n50 #========================\n51 win.mainloop()\n```\n\n将这段代码添加到之前的配方中后，会生成以下\
  \ GUI。请注意，在上述代码的第43行，我们为组合框分配了一个包含默认值的元组。这些值会出现在下拉框中。我们也可以根据需要更改它们（在应用程序运行时输入不同的值）：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_47_0.png)\n\n### 工作原理...\n\n第40行添加了第二个标签，以匹配新创建的组合框（在第42行创建）。第41行将该框的值赋给一个特殊的\
  \ tkinter 类型 `StringVar` 的变量，就像我们在之前的配方中所做的那样。\n\n第44行将两个新控件（标签和组合框）对齐到我们之前的 GUI\
  \ 布局中，第45行指定了一个默认值，在 GUI 首次可见时显示。这是 `number_chosen['values']` 元组的第一个值，即字符串 \"1\"\
  。我们在第43行没有为整数元组添加引号，但由于在第41行我们声明值为 `tk.StringVar` 类型，它们被转换成了字符串。\n\n上面的截图显示用户选择了\
  \ 42。该值被赋给 number 变量。\n\n### 更多内容...\n\n如果我们希望限制用户只能选择我们编程到组合框中的值，可以通过将 state 属性传递给构造函数来实现。按如下方式修改第42行：\n\
  \nGUI_combobox_widget_readonly_plus_display_number.py\n\n```python\n40 ttk.Label(win,\
  \ text=\"Choose a number:\").grid(column=1, row=0)\n41 number = tk.StringVar()\n\
  42 number_chosen = ttk.Combobox(win, width=12, textvariable=number, state='readonly')\n\
  43 number_chosen['values'] = (1, 2, 4, 42, 100)\n44 number_chosen.grid(column=1,\
  \ row=1)\n45 number_chosen.current(0)\n```\n\n现在，用户不能再向组合框中输入值。我们可以通过在 Button 点击事件回调函数中添加以下代码行来显示用户选择的值：\n\
  \n```python\n22 # Modified Button Click Function\n23 def click_me():\n24     action.configure(text='Hello\
  \ ' + name.get() + ' ' +\n25                         number_chosen.get())\n```\n\
  \n在选择一个数字、输入名称并点击按钮后，我们得到以下 GUI 结果，它现在也显示了所选的数字：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_48_0.png)\n\
  \n## 创建具有不同初始状态的复选按钮\n\n在本配方中，我们将添加三个复选按钮控件，每个控件具有不同的初始状态。\n\n### 准备工作\n\n本配方扩展了之前的配方“组合框控件”。\n\
  \n### 操作步骤...\n\n我们将创建三个状态不同的复选按钮控件。第一个处于禁用状态且带有复选标记。由于该控件被禁用，用户无法移除这个复选标记。\n\n\
  第二个复选按钮处于启用状态，默认没有复选标记，但用户可以点击它来添加复选标记。\n\n第三个复选按钮默认处于启用且选中状态。用户可以随意取消选中和重新选中该控件。请看以下代码：\n\
  \nGUI_checkbutton_widget.py\n\n```python\n35 # Adding a Button\n36 action = ttk.Button(win,\
  \ text=\"Click Me!\", command=click_me)\n37 action.grid(column=2, row=1)\n38 \n\
  39 # Creating three checkbuttons\n40 ttk.Label(win, text=\"Choose a number:\").grid(column=1,\
  \ row=0)\n41 number = tk.StringVar()\n42 number_chosen = ttk.Combobox(win, width=12,\
  \ textvariable=number, state='readonly')\n43 number_chosen['values'] = (1, 2, 4,\
  \ 42, 100)\n44 number_chosen.grid(column=1, row=1)\n45 number_chosen.current(0)\n\
  46 \n47 chVarDis = tk.IntVar()\n48 check1 = tk.Checkbutton(win, text=\"Disabled\"\
  , variable=chVarDis, state='disabled')\n49 check1.select()\n50 check1.grid(column=0,\
  \ row=4, sticky=tk.W)\n51 \n52 chVarUn = tk.IntVar()\n53 check2 = tk.Checkbutton(win,\
  \ text=\"UnChecked\", variable=chVarUn)\n54 check2.deselect()\n55 check2.grid(column=1,\
  \ row=4, sticky=tk.W)\n56 \n57 chVarEn = tk.IntVar()\n58 check3 = tk.Checkbutton(win,\
  \ text=\"Enabled\", variable=chVarEn)\n59 check3.select()\n60 check3.grid(column=2,\
  \ row=4, sticky=tk.W)\n61 \n62 name_entered.focus()      # Place cursor into name\
  \ Entry\n63 #====================\n64 # Start GUI\n65 #====================\n66\
  \ win.mainloop()\n```\n\n运行新代码会得到以下 GUI：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_50_0.png)\n\
  \n### 工作原理...\n\n在第47、52和57行，我们创建了三个 IntVar 类型的变量。在每个变量后的下一行，我们创建一个 Checkbutton，并将这些变量传递进去。它们将保存\
  \ Checkbutton 的状态（未选中或选中）。默认情况下，状态为 0（未选中）或 1（选中），因此变量类型是 tkinter 整数。\n\n我们将这些 Checkbutton\
  \ 控件放置在主窗口中，因此传递给构造函数的第一个参数是控件的父级，在本例中是 win。我们通过 text 属性为每个 Checkbutton 控件指定不同的标签。\n\
  \n将 grid 的 sticky 属性设置为 tk.W 意味着控件将对齐到网格的西部。这与 Java 语法非常相似，意味着它将左对齐。当我们调整 GUI 大小时，控件将保持在左侧，而不会向\
  \ GUI 中心移动。\n\n第49和59行通过调用这两个 Checkbutton 类实例上的 select() 方法，将复选标记放入 Checkbutton\
  \ 控件中。\n\n我们继续使用网格布局管理器来排列控件，这将在第2章“布局管理”中更详细地解释。\n\n## 使用单选按钮控件\n\n在本配方中，我们将创建三个\
  \ tkinter Radiobutton 控件。我们还将添加一些代码，根据选择的是哪个 Radiobutton 来更改主窗体的颜色。\n\n\n\n\n# 准备工作\n\
  \n本食谱扩展了之前的食谱，使用不同初始状态创建复选按钮。\n\n# 如何做...\n\n我们在之前的食谱中添加以下代码：\n\nGUI_radiobutton_widget.py\n\
  \n```\n74  # Radiobutton Globals\n75  COLOR1 = \"Blue\"\n76  COLOR2 = \"Gold\"\n\
  77  COLOR3 = \"Red\"\n78\n79  # Radiobutton Callback\n80  def radCall():\n81   \
  \   radSel=radVar.get()\n82      if  radSel == 1: win.configure(background=COLOR1)\n\
  83      elif radSel == 2: win.configure(background=COLOR2)\n84      elif radSel\
  \ == 3: win.configure(background=COLOR3)\n85\n86  # create three Radiobuttons using\
  \ one variable\n87  radVar = tk.IntVar()\n88\n89  rad1 = tk.Radiobutton(win, text=COLOR1,\
  \ variable=radVar, value=1, command=radCall)\n90  rad1.grid(column=0, row=5, sticky=tk.W,\
  \ columnspan=3)\n91\n92  rad2 = tk.Radiobutton(win, text=COLOR2, variable=radVar,\
  \ value=2, command=radCall)\n93  rad2.grid(column=1, row=5, sticky=tk.W, columnspan=3)\n\
  94\n95  rad3 = tk.Radiobutton(win, text=COLOR3, variable=radVar, value=3, command=radCall)\n\
  96  rad3.grid(column=2, row=5, sticky=tk.W, columnspan=3)\n97\n98  name_entered.focus()\
  \      # Place cursor into name Entry\n99  ====================\n100 # Start GUI\n\
  101 ====================\n102 win.mainloop()\n```\n\n运行此代码并选择名为 Gold 的单选按钮会创建以下窗口：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_52_0.png)\n\n# 它是如何工作的...\n\n在第 75-77\
  \ 行，我们创建了一些模块级全局变量，我们将在创建每个单选按钮以及创建更改主窗体背景颜色的操作的回调函数中使用它们（使用实例变量 win）。\n\n我们使用全局变量是为了使更改代码更容易。通过将颜色名称分配给变量并在多个地方使用该变量，我们可以轻松尝试不同的颜色。无需对硬编码字符串进行全局搜索和替换（容易出错），我们只需更改一行代码，其余部分就会正常工作。这被称为\
  \ DRY 原则，即 Don't Repeat Yourself。这是我们在本书后面的食谱中会使用的 OOP 概念。\n\n我们分配给变量的颜色名称（COLOR1、COLOR2\
  \ ...）是 tkinter 关键字（从技术上讲，它们是符号名称）。如果我们使用不是 tkinter 颜色关键字的名称，则代码将无法工作。\n\n第 80 行是根据用户选择更改主窗体（win）背景的回调函数。\n\
  \n在第 87 行我们创建一个 tk.IntVar 变量。重要的是，我们只创建一个变量供所有三个单选按钮使用。正如屏幕截图所示，无论我们选择哪个单选按钮，其他单选按钮都会自动为我们取消选择。\n\
  \n第 89 到 96 行创建三个单选按钮，将它们分配给主窗体，并传入将在创建更改主窗口背景的操作的回调函数中使用的变量。\n\n虽然这是第一个更改小部件颜色的食谱，但说实话，它看起来有点难看。本书中很大一部分后续食谱解释了如何让我们的\
  \ GUI 看起来真正令人惊艳。\n\n# 还有更多...\n\n以下是可在官方 tcl 手册页 http://www.tcl.tk/man/tcl8.5/TkCmd/colors.htm\
  \ 上查找的可用符号颜色名称的小样本。\n\n| Name | Red | Green | Blue |\n|---|---|---|---|\n| alice\
  \ blue | 240 | 248 | 255 |\n| AliceBlue | 240 | 248 | 255 |\n| Blue | 0 | 0 | 255\
  \ |\n| Gold | 255 | 215 | 0 |\n| Red | 255 | 0 | 0 |\n\n其中一些名称创建相同的颜色，因此 alice blue\
  \ 创建的颜色与 AliceBlue 相同。在本食谱中，我们使用了符号名称 Blue、Gold 和 Red。\n\n# 使用滚动文本小部件\n\nScrolledText\
  \ 小部件比简单的 Entry 小部件大得多，并且跨越多行。它们是像记事本一样的控件，会自动换行，并在文本大于 ScrolledText 小部件高度时自动启用垂直滚动条。\n\
  \n# 准备工作\n\n本食谱扩展了之前的食谱，使用单选按钮小部件。您可以从 https://github.com/PacktPublishing/Python-GUI-Programming-Cookbook-Second-Edition/\
  \ 下载本书每个章节的代码。\n\n# 如何做...\n\n通过添加以下代码行，我们创建了一个 ScrolledText 小部件：\n\nGUI_scrolledtext_widget.py\n\
  \n```\n6 #====================\n7 # imports\n8 #====================\n9 import tkinter\
  \ as tk\n10 from tkinter import ttk\n11 from tkinter import scrolledtext\n\n99 #\
  \ Using a scrolled Text control\n100 scrol_w = 30\n101 scrol_h = 3\n102 scr = scrolledtext.ScrolledText(win,\
  \ width=scrol_w, height=scrol_h, wrap=tk.WORD)\n103 scr.grid(column=0, columnspan=3)\n\
  104\n105 name_entered.focus()      # Place cursor into name Entry\n106 #====================\n\
  107 # Start GUI\n108 #====================\n109 win.mainloop()\n```\n\n我们实际上可以输入我们的控件，如果我们输入足够的单词，行会自动换行：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_54_0.png)\n\n一旦我们输入的单词超过控件可以显示的高度，垂直滚动条就会启用。所有这些开箱即用，无需我们编写更多代码即可实现：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_55_0.png)\n\n# 它是如何工作的...\n\n在第 11 行，我们导入包含\
  \ ScrolledText 小部件类的模块。将此添加到模块顶部，位于另外两个 import 语句下方。\n\n第 100 行和第 101 行定义了我们即将创建的\
  \ ScrolledText 小部件的宽度和高度。这些是我们在第 102 行传递给 ScrolledText 小部件构造函数的硬编码值。\n\n这些值是通过实验得出的魔数，可以很好地工作。你可以尝试将\
  \ scol_w 从 30 改为 50 并观察效果！\n\n在第 102 行，我们还通过传入 wrap=tk.WORD 在小部件上设置了一个属性。\n\n通过将\
  \ wrap 属性设置为 tk.WORD，我们告诉 ScrolledText 小部件按单词换行，这样我们就不会在单词中间换行。默认选项是 tk.CHAR，它会在单词中间时换行任何字符。\n\
  \n第二个屏幕截图显示垂直滚动条向下移动，因为我们正在阅读更长的文本，该文本完全不适合我们创建的 ScrolledText 控件的 x、y 尺寸。\n\n将 ScrolledText\
  \ 小部件的 grid 小部件的 columnspan 属性设置为 3 使此小部件跨越全部三个列。如果我们不设置此属性，我们的 ScrolledText 小部件将仅位于第一列，这不是我们想要的。\n\
  \n# 在循环中添加多个小部件\n\n到目前为止，我们已经通过基本上复制和粘贴相同的代码然后修改变化（例如列号）创建了多个相同类型的小部件（例如 Radiobutton）。在本食谱中，我们开始重构代码以使其不那么冗余。\n\
  \n# 准备工作\n\n我们正在重构上一食谱 Using scrolled text widgets 的某些部分代码，因此您需要该代码才能将本食谱应用到其中。\n\
  \n# 如何做...\n\n以下是我们重构代码的方式：\n\nGUI_adding_widgets_in_loop.py\n\n```\n76 # First,\
  \ we change our Radiobutton global variables into a list\n77 colors = [\"Blue\"\
  , \"Gold\", \"Red\"]\n78 \n79 # We have also changed the callback function to be\
  \ zero-based, using the list\n80 # instead of module-level global variables\n81\
  \ # Radiobutton Callback\n82 def radCall():\n83     radSel=radVar.get()\n84    \
  \ if  radSel == 0: win.configure(background=colors[0])  # now zero-based\n85   \
  \  elif radSel == 1: win.configure(background=colors[1])  # and using list\n86 \
  \    elif radSel == 2: win.configure(background=colors[2])\n87 \n88 # create three\
  \ Radiobuttons using one variable\n89 radVar = tk.IntVar()\n90 \n91 # Next we are\
  \ selecting a non-existing index value for radVar\n92 radVar.set(99)\n93 \n94 #\
  \ Now we are creating all three Radiobutton widgets within one loop\n95 for col\
  \ in range(3):\n96     curRad = tk.Radiobutton(win, text=colors[col], variable=radVar,\n\
  97                             value=col, command=radCall)\n98     curRad.grid(column=col,\
  \ row=5, sticky=tk.W)\n99\n```\n\n\n\n\n\n运行这段代码会创建与之前相同的窗口，但我们的代码更加简洁，易于维护。这将在我们后续菜谱中扩展\
  \ GUI 时帮助我们。\n\n## How it works...\n\n第 77 行，我们将全局变量变成了一个列表。\n\n第 89 行，我们为我们命名的\
  \ tk.IntVar 变量 radVar 设置了一个默认值。这很重要，因为，虽然在之前的菜谱中我们将 Radiobutton 小部件的值从 1 开始设置，但在新的循环中，使用\
  \ Python 的零基索引会方便得多。如果我们没有将默认值设置为超出 Radiobutton 小部件范围的值，那么在 GUI 出现时其中一个单选按钮会被选中。虽然这本身可能不是什么大问题，但它不会触发回调，我们最终会得到一个被选中的单选按钮，但它不起作用（即，不会改变主\
  \ win 表单的颜色）。\n\n第 95 行，我们用一个循环替换了之前三个硬编码的 Radiobutton 小部件创建方式，它做的事情相同。它只是更简洁（代码行数更少），而且维护性更强。例如，如果我们想创建\
  \ 100 个而不是仅仅三个 Radiobutton 小部件，我们只需要更改 Python range 操作符内部的数字即可。我们不必输入或复制粘贴 97 段重复代码，只需一个数字。\n\
  \n第 82 行显示了修改后的回调函数。\n\n## There's more...\n\n本菜谱结束了本书的第一章。所有后续章节中的所有后续菜谱都将在此基础上构建我们迄今为止构建的\
  \ GUI，大大增强它。\n\n## 2\n"
- "## Layout Management\n\n在本章中，我们将使用 Python 3.6 及以上版本来布局我们的 GUI。我们将涵盖以下菜谱：\n\n- 在\
  \ label frame 小部件内排列多个标签\n- 使用 padding 在小部件周围添加空间\n- 小部件如何动态扩展 GUI\n- 通过在框架内嵌入框架来对齐\
  \ GUI 小部件\n- 创建菜单栏\n- 创建选项卡式小部件\n- 使用 grid 布局管理器\n\n## Introduction\n\n在本章中，我们将探讨如何在小部件内排列小部件以创建我们的\
  \ Python GUI。学习 GUI 布局设计的 fundamentals 将使我们能够创建外观精美的 GUI。有一些技术可以帮助我们实现这种布局设计。\n\n\
  grid 布局管理器是我们将使用的内置于 tkinter 的最重要的布局工具之一。\n\n我们可以使用 tkinter 非常轻松地创建菜单栏、选项卡式控件（又名\
  \ Notebooks）以及更多小部件。\n\n## Arranging several labels within a label frame widget\n\
  \nLabelFrame 小部件允许我们以有组织的方式设计我们的 GUI。我们仍然使用 grid 布局管理器作为主要的布局设计工具，但通过使用 LabelFrame\
  \ 小部件，我们对 GUI 设计的控制力更强。\n\n## Getting ready\n\n我们将开始向我们的 GUI 添加越来越多的 widgets，并在接下来的菜谱中使其完全功能化。在这里，我们将开始使用\
  \ LabelFrame 小部件。我们将重用来自第 1 章《Creating the GUI Form and Adding Widgets》中菜谱《Adding\
  \ Several Widgets in a Loop》的 GUI。\n\n## How to do it...\n\n在 Python 模块底部 main 事件循环上方添加以下代码：\n\
  \nGUI_LabelFrame_column_one.py\n\n```\n108 # Create a container to hold labels\n\
  109 buttons_frame = ttk.LabelFrame(win, text=' Labels in a Frame ')\n110 buttons_frame.grid(column=0,\
  \ row=7)\n111 # buttons_frame.grid(column=1, row=7)                # now in col\
  \ 1\n112 \n113 # Place labels into the container element\n114 ttk.Label(buttons_frame,\
  \ text=\"Label1\").grid(column=0, row=0, sticky=tk.W)\n115 ttk.Label(buttons_frame,\
  \ text=\"Label2\").grid(column=1, row=0, sticky=tk.W)\n116 ttk.Label(buttons_frame,\
  \ text=\"Label3\").grid(column=2, row=0, sticky=tk.W)\n117 \n118 name_entered.focus()\
  \      # Place cursor into name Entry\n119 #===================\n120 # Start GUI\n\
  121 #===================\n122 win.mainloop()\n```\n\n运行代码后，GUI 将如下所示：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_62_0.png)\n\
  \n取消注释第 111 行并注意 LabelFrame 的不同对齐方式。\n\n我们可以通过更改代码轻松地将标签垂直对齐，如下图所示：\n\n```\n```python\n\
  113  # Place labels into the container element\n114  ttk.Label(buttons_frame, text=\"\
  Label1\").grid(column=0, row=0)\n115  ttk.Label(buttons_frame, text=\"Label2\").grid(column=0,\
  \ row=1)\n116  ttk.Label(buttons_frame, text=\"Label3\").grid(column=0, row=2)\n\
  117\n118  for child in buttons_frame.winfo_children():\n```\n```\n\n请注意，我们唯一需要做的更改就是列和行编号。\n\
  \n现在 GUI LabelFrame 如下所示：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_63_0.png)\n\
  \n## How it works...\n\n第 109 行，我们创建了第一个 ttk LabelFrame 小部件并将 resulting 实例分配给 buttons_frame\
  \ 变量。父容器是 win，我们的主窗口。\n\n第 114 到 116 行，我们创建标签并将它们放置在 LabelFrame 中。buttons_frame\
  \ 是标签的父级。我们使用重要的 grid 布局工具在 LabelFrame 内排列标签。此布局管理器的 column 和 row 属性赋予我们控制 GUI 布局的能力。\n\
  \n我们标签的父级是 LabelFrame 的 buttons_frame 实例变量，而不是主窗口的 win 实例变量。我们在这里可以看到布局层次结构的开始。\n\
  \n我们可以看到，通过 column 和 row 属性更改布局是多么容易。请注意我们如何将 column 更改为 0，并通过按顺序编号 row 值将标签垂直分层。\n\
  \nname ttk 代表 themed tk。tk-themed 小部件集是在 Tk 8.5 中引入的。\n\n## There's more…\n\n在本章后面的一个菜谱中，我们将在\
  \ `LabelFrame` 小部件内嵌入 `LabelFrame` 小部件，将它们嵌套以控制我们的 GUI 布局。\n\n## Using padding to\
  \ add space around widgets\n\n我们的 GUI 正在很好地创建。接下来，我们将通过在它们周围添加一些空间来改善小部件的视觉方面，让它们有呼吸的空间。\n\
  \n## Getting ready\n\n虽然 tkinter 可能曾因创建丑陋的 GUI 而闻名，但自版本 8.5 以来这种情况已发生了巨大变化。你只需要知道如何使用可用的工具和技术。那就是我们接下来要做的。\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_64_0.png)\n\ntkinter 版本 8.6 随 Python\
  \ 3.6 一起发布。\n\n## How to do it…\n\n添加小部件周围间距的程序化方式首先展示，然后我们将使用循环以更好的方式实现同样的效果。\n\
  \n我们的 `LabelFrame` 看起来有点紧凑，因为它与底部的 main window 融为一体。让我们现在修复它。\n\n修改上一菜谱中 `GUI_LabelFrame_column_one.py`\
  \ 代码片段的第 110 行，通过添加 `padx` 和 `pady`。你也可以在以下位置找到代码：\n\n`GUI_add_padding.py`\n\n```\n\
  buttons_frame.grid(column=0, row=7, padx=20, pady=40)\n```\n\n现在，我们的 LabelFrame\
  \ 有了呼吸空间：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_65_0.png)\n\n## How it works...\n\
  \n在 tkinter 中，水平和垂直添加空间是通过使用名为 padx 和 pady 的内置属性来完成的。这些可用于在许多小部件周围添加空间，分别改善水平和垂直对齐。我们为\
  \ LabelFrame 硬编码了左右各 20 像素的空间，并在框架顶部和底部各添加了 40 像素。现在我们的 LabelFrame 比之前更突出。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_65_1.png)\n\
  \n前面的截图仅显示了相关的更改。\n\n我们可以使用循环为 LabelFrame 包含的标签添加空间：\n\nGUI_add_padding_loop.py\n\
  \n```\n113 # Place labels into the container element\n114 ttk.Label(buttons_frame,\
  \ text=\"Label1\").grid(column=0, row=0)\n115 ttk.Label(buttons_frame, text=\"Label2\"\
  ).grid(column=0, row=1)\n116 ttk.Label(buttons_frame, text=\"Label3\").grid(column=0,\
  \ row=2)\n117 \n118 for child in buttons_frame.winfo_children():\n119     child.grid_configure(padx=8,\
  \ pady=4)\n120 \n121 name_entered.focus()      # Place cursor into name Entry\n\
  122 #===========================\n123 # Start GUI\n124 #===========================\n\
  125 win.mainloop()\n```\n\n\n\n现在，`LabelFrame` 小部件中的标签周围也有一些空间：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_66_0.png)\n\
  \n`grid_configure()` 函数使我们能够在主循环显示它们之前修改 UI 元素。因此，与其在第一次创建小部件时硬编码值，我们可以在文件末尾、GUI\
  \ 创建之前处理布局然后安排间距。这是一个值得了解的巧妙技巧。\n\n`winfo_children()` 函数返回属于 `buttons_frame` 变量的所有子项的列表。这使我们能够遍历它们并为每个标签分配内边距。\n\
  \n> 需要注意的一点是，标签右侧的间距实际上并不明显。这是因为 `LabelFrame` 的标题比标签名称更长。我们可以通过使标签名称更长来尝试这一点。\n\n\
  考虑在 `GUI_long_label.py` 中按如下方式更改代码：\n\n```python\n# Place labels into the container\
  \ element - vertically with long label\nttk.Label(buttons_frame, text=\"Label1 -\
  \ sooooo much loooonger...?\").grid(column=0, row=0)\nttk.Label(buttons_frame, text=\"\
  Label2\").grid(column=0, row=1)\nttk.Label(buttons_frame, text=\"Label3\").grid(column=0,\
  \ row=2)\n```\n\n现在，我们的 GUI 如以下屏幕截图所示。请注意，现在长标签旁边点号的右侧添加了一些空间。最后一个点不再触碰 `LabelFrame`，如果没有添加的空间，它本应触碰：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_67_0.png)\n\n我们也可以删除 `LabelFrame` 的名称来查看\
  \ `padx` 对标签位置的影响：\n\n`GUI_LabelFrame_no_name.py`\n\n```python\nbuttons_frame =\
  \ ttk.LabelFrame(win, text='')    # no LabelFrame name\n```\n\n通过将 `text` 属性设置为空字符串，我们移除了之前为\
  \ `LabelFrame` 显示的名称：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_67_1.png)\n\n\
  ## 小部件如何动态扩展 GUI\n\n您可能已经在之前的屏幕截图中注意到，并且通过运行代码发现小部件具有将自身扩展到所需空间以便视觉显示其文本的能力。\n\n\
  ![](img/986b0dbf3f539f4f3baa82bd3003f04e_68_0.png)\n\n- Java 引入了动态 GUI 布局管理的概念。相比之下，视觉开发\
  \ IDE，例如 VS.NET，以视觉方式布局 GUI，并且基本上硬编码 UI 元素的 x 和 y 坐标。\n- 使用 tkinter，这种动态能力既创造了优势，也带来了一点挑战，因为有时我们的\
  \ GUI 会在我们宁愿它不那么动态时动态扩展！好吧，我们是动态的 Python 程序员，所以我们可以弄清楚如何最好地利用这种出色的行为！\n\n## 准备工作\n\
  \n在上一节 *Using padding to add space around widgets* 的开头，我们添加了一个 `LabelFrame` 小部件。这将我们的一些控件移到了第\
  \ 0 列的中心。我们可能不希望在 GUI 布局中进行此修改。接下来，我们将探讨一些解决办法。\n\n## 如何操作...\n\n让我们首先意识到在我们的 GUI\
  \ 布局中发生的细微细节，以便更好地理解它。\n\n我们使用的是 grid 布局管理器小部件，它以零基网格布局我们的 widgets。这与 Excel 电子表格或数据库表非常相似。\n\
  \n以下是具有两行三列的 grid 布局管理器的示例：\n\n| Row 0; Col 0 | Row 0; Col 1 | Row 0; Col 2 |\n\
  |---|---|---|\n| Row 1; Col 0 | Row 1; Col 1 | Row 1; Col 2 |\n\n使用 grid 布局管理器，任何给定列的宽度由该列中最长的名称或小部件决定。这会影响所有行。\n\
  \n通过添加我们的 `LabelFrame` 小部件并为其提供一个标题，该标题比某些硬编码大小的小部件更长，例如左上角的标签和下面的文本输入，我们动态地将这些小部件移动到第\
  \ 0 列的 **中心**，在这些小部件的左侧和右侧添加空间。\n\n顺便说一下，因为我们为 Checkbutton 和 `ScrolledText` 小部件使用了\
  \ `sticky` 属性，所以它们仍然附着在框架的左侧。\n\n让我们更详细地查看本章第一个配方 *Arranging several labels within\
  \ a label frame widget* 的屏幕截图：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_69_0.png)\n\
  \n我们添加了以下代码来创建 `LabelFrame`，然后将标签放置到此框架中：\n\n```python\n# Create a container to\
  \ hold labels\nbuttons_frame = ttk.LabelFrame(win, text=' Labels in a Frame ')\n\
  buttons_frame.grid(column=0, row=7)\n```\n\n由于 `LabelFrame` 的 `text` 属性，即显示为 `LabelFrame`\
  \ 标题的内容，比我们的 **Enter a name:** 标签和下面的文本框输入都长，这两个小部件在第 0 列的新宽度内被动态居中。\n\n第 0 列中的\
  \ Checkbutton 和 Radiobutton 小部件没有被居中，因为我们在创建这些小部件时使用了 `sticky=tk.W` 属性。\n\n对于 `ScrolledText`\
  \ 小部件，我们使用了 `sticky=tk.WE`，它将小部件绑定到框架的西侧（即左侧）和东侧（即右侧）。\n\n## 布局管理\n\n让我们从 `ScrolledText`\
  \ 小部件中移除 `sticky` 属性并观察此更改带来的效果：\n\n`GUI_remove_sticky.py`\n\n```python\n# Using\
  \ a scrolled Text control\nscrol_w = 30\nscrol_h  = 3\nscr = scrolledtext.ScrolledText(win,\
  \ width=scrol_w, height=scrol_h, wrap=tk.WORD)\n# scr.grid(column=0, row=5, sticky='WE',\
  \ columnspan=3)\nscr.grid(column=0, row=5, columnspan=3)             # sticky property\
  \ removed\n```\n\n现在，我们的 GUI 在 `ScrolledText` 小部件周围有了新的空间，左右两侧都有。因为我们使用了 `columnspan=3`\
  \ 属性，我们的 `ScrolledText` 小部件仍然跨越所有三列：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_70_0.png)\n\
  \n如果我们移除 `columnspan=3`，我们将得到以下 GUI，这不是我们想要的。现在，我们的 `ScrolledText` 仅占据第 0 列，并且由于其大小而拉伸布局：\n\
  \n`GUI_remove_columnspan.py`\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_71_0.png)\n\
  \n一种让我们的布局恢复到添加 `LabelFrame` 之前状态的方法是调整网格列位置。将列值从 0 改为 1：\n\n```python\nbuttons_frame.grid(column=1,\
  \ row=7)      # now in col 1\n```\n\n现在我们的 GUI 看起来如下：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_71_1.png)\n\
  \n## 它是如何工作的…\n\n因为我们仍然使用单个小部件，所以我们的布局可能会被搞乱。通过将 `LabelFrame` 的列值从 0 移到 1，我们能够将控件恢复到它们以前的位置，也是我们更喜欢的位置。至少，最左边的标签、文本、`Checkbutton`、`ScrolledText`\
  \ 和 `Radiobutton` 小部件现在位于我们打算它们所在的位置。第 1 列中的第二个标签和文本 `Entry` 根据 **Labels in a Frame**\
  \ 小部件的长度自行对齐到中心，因此我们基本上将对齐挑战向右移动了一列。它并不那么明显，因为 **Choose a number:** 标签的大小几乎与 **Labels\
  \ in a Frame** 标题的大小相同，因此列宽度已经接近 `LabelFrame` 生成的新宽度。\n\n## 还有更多…\n\n在下一个配方 *Aligning\
  \ the GUI widgets by embedding frames within frames* 中，我们将嵌入框架内的框架，以避免在本配方中刚刚遇到的小部件意外错位。\n\
  \n## 通过在框架内嵌入框架来对齐 GUI 小部件\n\n如果我们在框架内嵌入框架，我们将对 GUI 布局有更好的控制。这就是本配方中我们要做的事情。\n\n\
  ## 准备工作\n\nPython 及其 GUI 模块的动态行为可能会给真正让我们的 GUI 看起来我们想要的样子带来一点挑战。在这里，我们将在框架内嵌入框架以获得对布局的更多控制。这将在不同的\
  \ UI 元素之间建立更强的层次结构，使视觉外观更容易实现。\n\n我们将继续使用在上一配方 *How widgets dynamically expand the\
  \ GUI* 中创建的 GUI。\n\n\n\n\n\n# 如何实现...\n\n这里，我们将创建一个顶级框架，用来容纳其他框架和小部件。这将帮助我们获得想要的GUI布局。\n\
  \n为了实现这一点，我们必须将当前控件嵌入到一个名为 `ttk.LabelFrame` 的中央框架中。该 `ttk.LabelFrame` 框架是主父窗口的子级，所有控件都将成为这个\
  \ `ttk.LabelFrame` 的子级。\n\n到目前为止，在我们的教程中，我们一直将所有小部件直接分配给主GUI框架。现在，我们只将 `LabelFrame`\
  \ 分配给主窗口，之后让这个 `LabelFrame` 成为所有小部件的父容器。\n\n这会在我们的GUI布局中创建如下层次结构：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_73_0.png)\n\
  \n在上图中，**win** 是保存对主GUI tkinter窗口框架引用的变量，**mighty** 是保存对 `LabelFrame` 引用的变量，并且是主窗口框架\
  \ (**win**) 的子级，而 **Label** 及所有其他小部件现在都被放入 `LabelFrame` 容器 (**mighty**) 中。\n\n将以下代码添加到Python模块的顶部：\n\
  \nGUI_embed_frames.py\n\n```\n6 #====================\n7 # imports\n8 #====================\n\
  9 import tkinter as tk\n10 from tkinter import ttk\n11 from tkinter import scrolledtext\n\
  12 \n13 # Create instance\n14 win = tk.Tk()\n15 \n16 # Add a title\n17 win.title(\"\
  Python GUI\")\n18 \n19 # We are creating a container frame to hold all other widgets\n\
  20 mighty = ttk.LabelFrame(win, text=' Mighty Python ')\n21 mighty.grid(column=0,\
  \ row=0, padx=8, pady=4)\n```\n\n接下来，我们将修改以下控件，使用 mighty 作为父级，替换 win。下面是一个如何操作的示例：\n\
  \n```\n23 # Modify adding a Label using mighty as the parent instead of win\n24\
  \ a_label = ttk.Label(mighty, text=\"Enter a name:\")\n25 a_label.grid(column=0,\
  \ row=0)\n```\n\n这会产生如下GUI：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_74_0.png)\n\
  \n让我们将第0列中的输入框左对齐：\n\n```\n# Adding a Textbox Entry widget\nname = tk.StringVar()\n\
  name_entered = ttk.Entry(mighty, width=12, textvariable=name)\nname_entered.grid(column=0,\
  \ row=1, sticky=tk.W)      # align left/West\n```\n\n现在，标签和输入框都向 West（左）对齐：\n\n\
  GUI_embed_frames_align_entry_west.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_77_0.png)\n\
  \n为了将 Frame LabelFrame 中标签长度对我们GUI布局其余部分的影响隔离开来，我们不能将这个 LabelFrame 与其他小部件放在同一个 LabelFrame\
  \ 中，而必须将其直接分配给主GUI窗体 (win)。我们将在后续章节中这样做。\n\n## 创建菜单栏\n\n在本节中，我们将为主窗口添加菜单栏，在菜单栏中添加菜单，然后向菜单添加菜单项。\n\
  \n## 准备工作\n\n我们将首先学习如何添加菜单栏、多个菜单以及几个菜单项的技术，以展示其操作原理。最初，单击菜单项不会产生任何效果。然后，我们将为菜单项添加功能，例如单击\
  \ Exit 菜单项时关闭主窗口，以及显示 Help | About 对话框。\n\n我们将继续扩展上一个教程中创建的GUI，即通过“在框架中嵌入框架”来对齐GUI小部件。\n\
  \n## 如何实现...\n\n首先，我们必须从 tkinter 导入 Menu 类。将以下代码行添加到Python模块的顶部，即import语句所在的位置：\n\
  \n```\n6 # ====================\n7 # imports\n8 # ====================\n9 import\
  \ tkinter as tk\n10 from tkinter import ttk\n11 from tkinter import scrolledtext\n\
  12 from tkinter import Menu\n13 \n14 # Create instance\n15 win = tk.Tk()\n```\n\n\
  接下来，我们将创建菜单栏。将以下代码添加到模块底部，即创建主事件循环的代码上方：\n\nGUI_menubar_tearoff.py\n\n```\n118 #\
  \ Creating a Menu Bar\n119 menu_bar = Menu(win)\n120 win.config(menu=menu_bar)\n\
  121 \n122 # Create menu and add menu items\n123 file_menu = Menu(menu_bar)     \
  \           # create File menu\n124 file_menu.add_command(label=\"New\")       #\
  \ add File menu item\n```\n\n在第119行，我们调用导入的 Menu 模块类的构造函数，并传入主GUI实例 win。我们将 Menu\
  \ 对象的一个实例保存在 menu_bar 变量中。在第120行，我们将GUI配置为使用刚刚创建的 Menu 作为GUI的菜单。\n\n为了使其正常工作，我们还需要将菜单添加到菜单栏，并为其指定一个标签。\n\
  \n菜单项已经添加到菜单中，但我们仍然必须将菜单添加到菜单栏：\n\nGUI_menubar_file.py\n\n```\n122 # Create menu\
  \ and add menu items\n123 file_menu = Menu(menu_bar)                  # create File\
  \ menu\n124 file_menu.add_command(label=\"New\")          # add File menu item\n\
  125 menu_bar.add_cascade(label=\"File\", menu=file_menu)  # add File menu to menu\
  \ bar and give it a label\n126\n127 name_entered.focus()        # Place cursor into\
  \ name Entry\n128 #========================\n129 # Start GUI\n130 #========================\n\
  131 win.mainloop()\n```\n\n运行此代码会添加一个带有一个菜单项的菜单栏：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_79_0.png)\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_79_1.png)\n\n如果这个 tkinter 菜单栏语法看起来有点令人困惑，不必担心。这只是\
  \ tkinter 创建菜单栏的语法。它并不十分 Pythonic。\n\n## 布局管理\n\n接下来，我们将在添加到菜单栏的第一个菜单中添加第二个菜单项：\n\
  \n```\nGUI_menubar_exit.py\n```\n\n```\n```python\n# Add menu items\nfile_menu =\
  \ Menu(menu_bar)\nfile_menu.add_command(label=\"New\")\nfile_menu.add_command(label=\"\
  Exit\")\nmenu_bar.add_cascade(label=\"File\", menu=file_menu)\n\nname_entered.focus()\
  \        # Place cursor into name Entry\n#====================\n# Start GUI\n#====================\n\
  win.mainloop()\n```\n```\n\n运行代码会产生以下结果：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_80_0.png)\n\
  \n我们可以在现有菜单项之间添加一行代码，以添加分隔线：\n\n```\nGUI_menubar_separator.py\n```\n\n```\n# Creating\
  \ a Menu Bar\nmenu_bar = Menu(win)\nwin.config(menu=menu_bar)\n\n# Add menu items\n\
  file_menu = Menu(menu_bar)\nfile_menu.add_command(label=\"New\")\nfile_menu.add_separator()\n\
  file_menu.add_command(label=\"Exit\")\nmenu_bar.add_cascade(label=\"File\", menu=file_menu)\n\
  ```\n\n现在，我们可以在两个菜单项之间看到一条分隔线：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_81_0.png)\n\
  \n通过将 tearoff 属性传递给菜单的构造函数，我们可以移除默认出现在菜单第一个菜单项上方的第一条虚线：\n\n```\n# Add menu items\n\
  file_menu = Menu(menu_bar, tearoff=0)\nfile_menu.add_command(label=\"New\")\nfile_menu.add_separator()\n\
  ```\n\n现在，虚线不再出现，我们的GUI看起来好多了：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_82_0.png)\n\
  \n接下来，我们将添加第二个菜单，它将被水平放置到第一个菜单的右侧。我们给它一个菜单项，命名为 About，并且为了使其正常工作，我们必须将第二个菜单添加到菜单栏。\n\
  \nFile 和 Help | About 是我们非常熟悉的常见 Windows GUI 布局，我们可以使用 Python 和 tkinter 创建相同的菜单：\n\
  \nGUI_menubar_help.py\n\n```\n# Creating a Menu Bar\nmenu_bar = Menu(win)\nwin.config(menu=menu_bar)\n\
  \n# Add menu items\nfile_menu = Menu(menu_bar, tearoff=0)\nfile_menu.add_command(label=\"\
  New\")\nfile_menu.add_separator()\nfile_menu.add_command(label=\"Exit\")\nmenu_bar.add_cascade(label=\"\
  File\", menu=file_menu)\n\n# Add another Menu to the Menu Bar and an item\nhelp_menu\
  \ = Menu(menu_bar, tearoff=0)\nmenu_bar.add_cascade(label=\"Help\", menu=help_menu)\n\
  help_menu.add_command(label=\"About\")\n\nname_entered.focus()      # Place cursor\
  \ into name Entry\n====================\n# Start GUI\n====================\nwin.mainloop()\n\
  ```\n\n\n现在，我们有了第二个菜单，其中包含一个菜单项，位于菜单栏中：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_83_0.png)\n\
  \n此时，我们的 GUI 有一个菜单栏和两个菜单，其中包含一些菜单项。在添加一些命令之前，点击它们不会产生什么效果。这就是我们接下来要做的。在创建菜单栏的代码上方添加以下代码：\n\
  \n```python\n# Exit GUI cleanly\ndef _quit():\n    win.quit()\n    win.destroy()\n\
  \    exit()\n```\n\n接下来，我们将“文件 | 退出”菜单项绑定到此函数，方法是在菜单项中添加以下命令：\n\nGUI_menubar_exit_quit.py\n\
  \n```python\n# Exit GUI cleanly\ndef _quit():\n    win.quit()\n    win.destroy()\n\
  \    exit()\n\n# Creating a Menu Bar\nmenu_bar = Menu(win)\nwin.config(menu=menu_bar)\n\
  \n# Add menu items\nfile_menu = Menu(menu_bar, tearoff=0)\nfile_menu.add_command(label=\"\
  New\")\nfile_menu.add_separator()\nfile_menu.add_command(label=\"Exit\", command=_quit)\n\
  menu_bar.add_cascade(label=\"File\", menu=file_menu)\n```\n\n接下来，我们创建一个函数来干净地退出\
  \ GUI 应用程序。这是推荐的 Python 风格的主事件循环结束方式。\n\n我们使用 tkinter 的 `command` 属性将我们创建的函数绑定到菜单项。每当我们希望菜单项真正执行某些操作时，都必须将它们中的每一个绑定到一个函数。\n\
  \n> 我们使用了一种推荐的 Python 命名约定，在 `quit` 函数前面加一个下划线，以表明这是一个私有函数，不应由我们代码的客户端调用。\n\n##\
  \ 更多内容…\n\n我们将在*第 3 章 外观与感觉定制*中添加**帮助 | 关于**功能，该章将介绍消息框以及更多内容。\n\n## 创建选项卡式控件\n\n\
  在本节中，我们将创建选项卡式控件，以进一步组织用 tkinter 编写的不断扩展的 GUI。\n\n## 准备工作\n\n为了使用选项卡改进我们的 Python\
  \ GUI，我们将从头开始，使用最少的必要代码。在本节中，我们将创建一个简单的 GUI，然后添加前面小节中的控件，并将它们放入这个新的选项卡式布局中。\n\n\
  ## 操作步骤...\n\n创建一个新的 Python 模块，并将以下代码放入该模块：\n\nGUI_tabbed.py\n\n```python\n#========================\n\
  # imports\n#========================\nimport tkinter as tk\nfrom tkinter import\
  \ ttk\n\nwin = tk.Tk()                         # Create instance\nwin.title(\"Python\
  \ GUI\")              # Add a title\ntabControl = ttk.Notebook(win)       # Create\
  \ Tab Control\ntab1 = ttk.Frame(tabControl)         # Create a tab\ntabControl.add(tab1,\
  \ text='Tab 1')   # Add the tab\ntabControl.pack(expand=1, fill=\"both\")  # Pack\
  \ to make visible\n\n#========================\n# Start GUI\n#========================\n\
  win.mainloop()\n```\n\n这将创建以下 GUI：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_86_0.png)\n\
  \n虽然目前还不是很令人印象深刻，但这个控件为我们的 GUI 设计工具箱添加了另一个非常强大的工具。在上面的极简示例中，它有其自身的局限性（例如，我们既不能重新定位\
  \ GUI，也不能显示完整的 GUI 标题）。\n\n虽然我们在前面的小节中为较简单的 GUI 使用了网格布局管理器，但我们可以使用更简单的布局管理器，pack\
  \ 就是其中之一。\n\n在前面的代码中，我们将 `tabControl` 和 `ttk.Notebook` 控件打包到主 GUI 窗体中，将笔记本选项卡控件扩展到填充所有边。\n\
  \n我们可以向控件添加第二个选项卡，并在它们之间单击切换：\n\nGUI_tabbed_two.py\n\n```python\ntabControl = ttk.Notebook(win)\
  \          # Create Tab Control\n\ntab1 = ttk.Frame(tabControl)            # Create\
  \ a tab\ntabControl.add(tab1, text=\"Tab 1\")      # Add the tab\ntab2 = ttk.Frame(tabControl)\
  \            # Add a second tab\ntabControl.add(tab2, text=\"Tab 2\")      # Add\
  \ second tab\n\ntabControl.pack(expand=1, fill=\"both\")  # Pack to make visible\n\
  \n#====================\n# Start GUI\n#====================\nwin.mainloop()\n```\n\
  \n现在，我们有两个选项卡。单击 **Tab 2** 使其获得焦点：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_87_0.png)\n\
  \n我们非常希望看到窗口的标题；因此，要做到这一点，我们必须向其中一个选项卡添加一个控件。该控件必须足够宽，以便动态扩展我们的 GUI 以显示窗口标题：\n\n\
  GUI_tabbed_two_mighty.py\n\n```python\n# LabelFrame using tab1 as the parent\nmighty\
