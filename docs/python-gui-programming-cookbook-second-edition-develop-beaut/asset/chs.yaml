  \ 255)\nglVertex3f(50,50,50)\n\n# Yellow\nglColor3ub(255, 255, 0)\nglVertex3f(50,-50,50)\n\
  \n# Red\nglColor3ub(255, 0, 0)\nglVertex3f(-50,-50,50)\nglVertex3f(-50,50,50)\n\n\
