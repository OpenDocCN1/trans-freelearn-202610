- "## 9\n使用 wxPython 库扩展我们的 GUI\n\n在本章中，我们将使用 wxPython 库来增强我们的 Python GUI。我们将介绍以下内容：\n\
  \n+   - 安装 wxPython 库\n+   - 使用 wxPython 创建我们的 GUI\n+   - 使用 wxPython 快速添加控件\n+\
  \   - 尝试将主 wxPython 应用程序嵌入主 tkinter 应用程序中\n+   - 尝试将我们的 tkinter GUI 代码嵌入 wxPython\n\
  +   - 使用 Python 控制两个不同的 GUI 框架\n+   - 在两个连接的 GUI 之间通信\n\n### 简介\n\n在本章中，我们将介绍另一个目前不随\
  \ Python 一起发布的 Python GUI 工具包，它名为 wxPython。\n\n这个库有两个版本。原始版本称为 Classic，而最新版本以其开发项目代号命名，即\
  \ Phoenix。\n\n在本书中，我们仅使用 Python 3.6 及以上版本进行编程；由于新的 Phoenix 项目旨在支持 Python 3.6 及以上版本，因此我们将使用这个版本的\
  \ wxPython。\n\n## 使用 wxPython 库扩展我们的 GUI\n\n首先，我们将创建一个简单的 wxPython GUI，然后尝试将本书中开发的两个基于\
  \ tkinter 的 GUI 与新的 wxPython 库连接起来。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_330_0.png)\n\
  \nwxPython 是 wxWidgets 的 Python 绑定。wxPython 中的 w 代表 Windows 操作系统，x 代表基于 Unix 的操作系统，如\
  \ Linux 和 Apple 的 OS X（现已更名为 Mac OS）。\n\n如果同时使用这两种 GUI 工具包无法顺利工作，我们将尝试使用 Python\
  \ 来解决任何问题；如有必要，我们将在 Python 中使用**进程间通信（IPC）**，以确保我们的 Python 代码能够按预期工作。\n\n以下是本章使用的\
  \ Python 模块概览：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_330_1.png)\n\n## 安装 wxPython\
  \ 库\n\nwxPython 库不随 Python 一起发布，因此要使用它，我们必须先安装它。\n\n本指南将向我们展示在何处以及如何找到正确的安装版本，以匹配已安装的\
  \ Python 版本和当前运行的操作系统。\n\nwxPython 第三方库已经存在了 18 年多，这表明它是一个成熟稳定的库。\n\n### 准备工作\n\n\
  为了在 Python 3.6 及以上版本中使用 wxPython，我们必须安装 wxPython Phoenix 版本。\n\n### 操作步骤\n\n当你在网上搜索\
  \ wxPython 时，很可能会找到官方网站 www.wxpython.org：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_331_0.png)\n\
  \n\n\n\n\n# 使用 wxPython 库扩展我们的 GUI\n\n如果点击 MS Windows 的下载链接，你会看到几个 Windows 安装程序，它们都仅适用于\
  \ Python 2.x：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_332_0.png)\n\n要使用 Python\
  \ 3.6 的 wxPython，我们需要安装 wxPython/Phoenix 库。我们可以在 snapshot-builds 链接处找到安装程序：`http://wxpython.org/Phoenix/snapshot-builds/`\n\
  \n从这里，我们可以选择与我们的 Python 版本和操作系统相匹配的 wxPython/Phoenix 版本。我使用的是在 64 位 Windows 10 操作系统上运行的\
  \ Python 3.6。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_332_1.png)\n\nPython wheel（`.whl`）安装程序包有一个编号方案。\n\
  \n对我们来说，该方案中最重要的一部分是，我们安装的是适用于 Python 3.6（安装程序名称中的 *cp36*）并且适用于 Windows 64 位操作系统（安装程序名称中的\
  \ *win_amd64* 部分）的 wxPython/Phoenix 构建。\n\n成功下载 wxPython/Phoenix 包后，我们现在可以导航到它所在的目录，并使用\
  \ pip 安装此包：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_333_0.png)\n\n我们在 Python\
  \ site-packages 文件夹中有了一个名为 wx 的新文件夹：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_333_1.png)\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_333_2.png)\n\nwx 是文件夹名称，wxPython Phoenix\
  \ 库已安装到其中。我们将把此模块导入到我们的 Python 代码中。\n\n我们可以通过执行来自官方 wxPython/Phoenix 网站的这个简单演示脚本来验证我们的安装是否成功。官方网站的链接是\
  \ http://wxpython.org/Phoenix/docs/html/。\n\n考虑以下代码：\n\n```\n```python\nimport wx\n\
  app = wx.App()\nframe = wx.Frame(None, -1, \"Hello World\")\nframe.Show()\napp.MainLoop()\n\
  ```\n```\n\n运行上述 Python 3.6 脚本会使用 wxPython/Phoenix 创建以下 GUI：\n\nHello_wxPython.py\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_334_0.png)\n\n## How it works…\n\n在本教程中，我们成功安装了可与\
  \ Python 3.6 一起使用的正确版本的 wxPython 工具包。我们找到了该 GUI 工具包的 Phoenix 项目，这是当前且活跃的开发分支。Phoenix\
  \ 将在未来取代经典的 wxPython 工具包，并且特别旨在与 Python 3.6 良好配合。\n\n成功安装 wxPython/Phoenix 工具包后，我们仅用五行代码就使用该工具包创建了一个\
  \ GUI。\n\n我们之前通过使用 tkinter 实现了相同的结果。\n\n## 在 wxPython 中创建我们的 GUI\n\n在本教程中，我们将开始使用\
  \ wxPython GUI 工具包创建 Python GUI。\n\n我们将首先重新创建之前使用随 Python 提供的 tkinter 创建的几个小部件。\n\
  \n然后，我们将探索 wxPython GUI 工具包提供的一些小部件，这些小部件使用 tkinter 创建起来并不容易。\n\n## Getting ready\n\
  \n上一教程向你展示了如何安装与你的 Python 版本和正在运行的操作系统相匹配的正确版本的 wxPython。\n\n## How to do it...\n\
  \n探索 wxPython GUI 工具包的一个好地方是访问以下 URL：http://wxpython.org/Phoenix/docs/html/gallery.html\n\
  \n此网页显示了许多 wxPython 小部件，并且通过点击其中任何一个，我们都会被带到其文档，这是一个非常有用的功能，可以快速了解 wxPython 控件：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_335_0.png)\n\n以下屏幕截图显示了 wxPython 按钮小部件的文档：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_336_0.png)\n\n我们可以非常快速地创建一个带有标题、菜单栏和状态栏的工作窗口。当鼠标悬停在菜单项上时，该状态栏会显示菜单项的文本。这可以通过编写以下代码来实现：\n\
  \n```\n# Import wxPython GUI toolkit\nimport wx\n\n# Subclass wxPython frame\nclass\
  \ GUI(wx.Frame):\n    def __init__(self, parent, title, size=(200,100)):\n     \
  \   # Initialize super class\n        wx.Frame.__init__(self, parent, title=title,\
  \ size=size)\n\n        # Change the frame background color\n        self.SetBackgroundColour('white')\n\
  \n        # Create Status Bar\n        self.CreateStatusBar()\n\n        # Create\
  \ the Menu\n        menu= wx.Menu()\n\n        # Add Menu Items to the Menu\n  \
  \      menu.Append(wx.ID_ABOUT, \"About\", \"wxPython GUI\")\n        menu.AppendSeparator()\n\
  ```\n\n```\nmenu.Append(wx.ID_EXIT,\"Exit\",\" Exit the GUI\")\n\n# Create the MenuBar\n\
  menuBar = wx.MenuBar()\n\n# Give the Menu a Title\nmenuBar.Append(menu,\"File\"\
  )\n\n# Connect the MenuBar to the frame\nself.SetMenuBar(menuBar)\n\n# Display the\
  \ frame\nself.Show()\n\n# Create instance of wxPython application\napp = wx.App()\n\
  \n# Call sub-classed wxPython GUI increasing default Window size\nGUI(None, \"Python\
  \ GUI using wxPython\", (300,150))\n\n# Run the main GUI event loop\napp.MainLoop()\n\
  ```\n\n这会创建以下 GUI，该 GUI 使用 wxPython 库用 Python 编写：\n\nGUI_wxPython.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_337_0.png)\n\
  \n在之前的代码中，我们继承自 wx.Frame。在下一段代码中，我们继承自 wx.Panel，并且将 wx.Frame 传递给我们类的 __init__()\
  \ 方法。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_337_1.png)\n\n在 wxPython 中，顶级\
  \ GUI 窗口称为 frame。没有 frame 就没有 wxPython GUI，并且 frame 必须作为 wxPython 应用程序的一部分创建。我们在代码底部同时创建应用程序和\
  \ frame。\n\n为了向我们的 GUI 添加小部件，我们必须将它们附加到一个面板。面板的父级是 frame（我们的顶级窗口），而我们放置到面板中的小部件的父级是面板。\n\
  \n以下代码将一个多行文本框小部件添加到其父级为 frame 的面板中。我们还在面板小部件中添加了一个按钮小部件，当点击时，它会向文本框打印一些文本。\n\n\
  以下是完整代码：\n\n```\nimport wx                                          # Import wxPython\
  \ GUI toolkit\nclass GUI(wx.Panel):                               # Subclass wxPython\
  \ Panel\n    def __init__(self, parent):\n\n        # Initialize super class\n \
  \       wx.Panel.__init__(self, parent)\n\n        # Create Status Bar\n       \
  \ parent.CreateStatusBar()\n\n        # Create the Menu\n        menu= wx.Menu()\n\
  \n        # Add Menu Items to the Menu\n        menu.Append(wx.ID_ABOUT, \"About\"\
  , \"wxPython GUI\")\n        menu.AppendSeparator()\n        menu.Append(wx.ID_EXIT,\"\
  Exit\",\"  Exit the GUI\")\n\n        # Create the MenuBar\n        menuBar = wx.MenuBar()\n\
  \n        # Give the Menu a Title\n        menuBar.Append(menu,\"File\")\n\n   \
  \     # Connect the MenuBar to the frame\n        parent.SetMenuBar(menuBar)\n\n\
  \        # Create a Print Button\n        button = wx.Button(self, label=\"Print\"\
  , pos=(0,60))\n\n        # Connect Button to Click Event method\n        self.Bind(wx.EVT_BUTTON,\
  \ self.printButton, button)\n\n        # Create a Text Control widget\n        self.textBox\
  \ = wx.TextCtrl(self, size=(280,50),\n                                   style=wx.TE_MULTILINE)\n\
  ```\n\n```\n# callback event handler\ndef printButton(self, event):\n    self.textBox.AppendText(\"\
  The Print Button has been clicked!\")\n\napp = wx.App()        # Create instance\
  \ of wxPython application\n                      # Create frame\nframe = wx.Frame(None,\
  \ -1, size=(300,180))\nGUI(frame)            # Pass frame into GUI\nframe.Show()\
  \          # Display the frame\napp.MainLoop()        # Run the main GUI event loop\n\
  ```\n\n在前面的代码中，parent 是我们传递给 GUI 初始化器的 wx.Frame。\n\n运行前面的代码并点击我们的 wxPython 按钮小部件会产生以下\
  \ GUI 输出：\n\nwxPython_panel_GUI.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_339_0.png)\n\
  \n## How it works...\n\n在本教程中，我们使用成熟的 wxPython GUI 工具包创建了自己的 GUI。仅用几行 Python 代码，我们就能创建一个功能齐全的\
  \ GUI，其中包含最小化、最大化和退出按钮。我们添加了菜单栏、多行文本控件和按钮。我们还创建了一个状态栏，当我们选择菜单项时显示文本。我们将所有这些小部件放置在\
  \ Panel 容器小部件中。\n\n我们将按钮连接到向文本控件打印的功能。\n\n当悬停在菜单项上时，一些文本会显示在状态栏中。\n\n\n\n\n\n# 使用\
  \ wxPython 快速添加控件\n\n在本节中，我们将重新创建本书前面用 tkinter 创建的 GUI，但这次我们将使用 wxPython 库。我们会看到使用\
  \ wxPython GUI 工具包创建我们自己的 Python GUI 是多么简单快捷。\n\n我们不会重新创建前几章中实现的所有功能。例如，我们不会对 wxPython\
  \ GUI 进行国际化，也不会将其连接到 MySQL 数据库。我们将重新创建 GUI 的视觉部分，并添加一些功能。\n\n> 比较不同的库可以让我们选择使用哪些工具包来进行自己的\
  \ Python GUI 开发，而且我们可以在自己的 Python 代码中组合使用这些工具包中的多种。\n\n## 准备工作\n\n请确保你已安装 wxPython\
  \ 模块，以便按照本节内容进行操作。\n\n## 如何实现……\n\n首先，像之前使用 tkinter 时那样创建我们的 Python OOP 类，但这次我们继承并扩展了\
  \ `wx.Frame` 类。为了清晰起见，我们不再将类命名为 OOP，而是将其重命名为 `MainFrame`。\n\n> 在 wxPython 中，主 GUI\
  \ 窗口被称为 Frame。\n\n我们还创建了一个回调方法，当我们点击 **Exit** 菜单项时关闭 GUI，并声明一个浅灰色 `tuple` 作为 GUI\
  \ 的背景颜色：\n\n```\nimport wx\nBACKGROUND_COLOR = (240, 240, 240, 255)\n\nclass MainFrame(wx.Frame):\n\
  \    def __init__(self, *args, **kwargs):\n        wx.Frame.__init__(self, *args,\
  \ **kwargs)\n        self.createWidgets()\n        self.Show()\n```\n\n```\ndef\
  \ exitGUI(self, event):      # callback\n    self.Destroy()\n\ndef createWidgets(self):\n\
  \    self.CreateStatusBar()      # wxPython built-in method\n    self.createMenu()\n\
  \    self.createNotebook()\n```\n\n然后，我们通过创建 wxPython Notebook 类的实例，为 GUI 添加一个选项卡控件，并将其作为我们自定义类\
  \ Widgets 的父级。\n\nNotebook 类实例变量的父级是 wx.Panel：\n\n```\n#--------------------------------------------------\n\
  def createNotebook(self):\n    panel = wx.Panel(self)\n    notebook = wx.Notebook(panel)\n\
  \    widgets = Widgets(notebook) # Custom class explained below\n    notebook.AddPage(widgets,\
  \ \"Widgets\")\n    notebook.SetBackgroundColour(BACKGROUND_COLOR)\n    # layout\n\
  \    boxSizer = wx.BoxSizer()\n    boxSizer.Add(notebook, 1, wx.EXPAND)\n    panel.SetSizerAndFit(boxSizer)\n\
  ```\n\n在 wxPython 中，选项卡控件被命名为 Notebook，与 tkinter 中相同。\n\n每个 Notebook 控件都需要有一个父级，并且为了在\
  \ wxPython 的 Notebook 中布局控件，我们使用不同类型的 sizer。\n\nwxPython 的 sizer 是布局管理器，类似于 tkinter\
  \ 的 grid 布局管理器。\n\n接下来，我们向 Notebook 页面添加控件，方法是通过创建一个继承自 wx.Panel 的单独类：\n\n```\n\
  class Widgets(wx.Panel):\n    def __init__(self, parent):\n        wx.Panel.__init__(self,\
  \ parent)\n        self.createWidgetsFrame()\n        self.addWidgets()\n      \
  \  self.layoutWidgets()\n```\n\n## 使用 wxPython 库扩展我们的 GUI\n\n我们按照 Python OOP 编程规范，将\
  \ GUI 代码分解为小方法来实现模块化，这使我们的代码保持可管理和易理解：\n\n```\n```python\n#-----------------------------------------------\n\
