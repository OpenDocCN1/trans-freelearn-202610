  ```python\nimport pyglet\nfrom pyglet.gl import *\nfrom pyglet.window import key\n\
  from OpenGL.GLUT import *\n\nWINDOW    = 400\nINCREMENT = 5\n\nclass Window(pyglet.window.Window):\n\
  \n    # Cube 3D start rotation\n    xRotation = yRotation = 30\n\n    def __init__(self,\
  \ width, height, title=''):\n        super(Window, self).__init__(width, height,\
