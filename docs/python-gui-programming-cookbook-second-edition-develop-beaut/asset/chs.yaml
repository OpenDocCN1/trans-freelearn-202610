  在接下来的代码中，我们将混合使用两种不同的 import 语句放置方式。在 Python 中，我们拥有其他语言所不具备的灵活性。我们通常将所有 import 语句放在每个\
  \ Python 模块的最顶部，以便清楚地知道正在导入哪些模块。同时，一种现代编码方式是将变量的创建放在首次使用它们的函数或方法附近。\n\n在接下来的代码中，我们在\
  \ Python 模块的顶部导入消息框，但随后又在函数中导入 shutil 模块。为什么要这样做？这真的可行吗？答案是肯定的，确实可行。我们将这个 import\
  \ 语句放在函数中，因为这是代码中唯一真正需要该模块的地方。\n\n如果我们从不调用这个方法，那么我们就永远不会导入这个方法所需的模块。从某种意义上说，你可以将这种技术视为惰性初始化设计模式。如果不需要它，我们就不会导入它，直到我们的\
  \ Python 代码真正需要它时才导入。这里的想法是，我们的整个代码可能需要，比如说，20 个不同的模块。在运行时，真正需要哪些模块取决于用户的交互。如果我们从不调用\
  \ copyFile() 函数，那么就没有必要导入 shutil。\n\n当我们点击调用 copyFile() 函数的按钮时，会在这个函数中导入所需的模块：\n\
  \n```\nfrom tkinter import messagebox as msg\ndef copyFile():\n    import shutil\
