  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_219_0.png)\n\n## 工作原理...\n\n我们使用\
  \ Python 的 shell 工具将文件从本地硬盘复制到网络。由于大多数人都没有连接到同一个局域网，我们通过将代码备份到另一个本地文件夹来模拟复制。\n\n\
  我们使用了 tkinter 的一个对话框控件，并且通过使目录路径成为默认值，可以提高复制文件的效率。\n\n## 使用 TCP/IP 通过网络通信\n\n本示例展示如何使用套接字通过\
  \ TCP/IP 进行通信。为了实现这一点，我们既需要 IP 地址，也需要端口号。\n\n为了简单起见，并摆脱不断变化的互联网 IP 地址的影响，我们将创建自己的本地\
  \ TCP/IP 服务器，并以客户端身份学习如何连接它以及从 TCP/IP 连接读取数据。\n\n我们将使用前面示例中创建的队列，把这种网络功能集成到我们的 GUI\
  \ 中。\n\nTCP/IP 是传输控制协议/因特网协议的缩写，是一组允许两台或多台计算机进行通信的网络协议。\n\n## 准备工作\n\n我们将创建一个新的\
  \ Python 模块作为 TCP 服务器。\n\n## 操作步骤...\n\n在 Python 中实现 TCP 服务器的一种方法是继承 socketserver\
  \ 模块。我们继承 BaseRequestHandler，然后重写继承来的 handle 方法。只需很少几行 Python 代码，我们就可以实现一个 TCP 服务器：\n\
  \n```\nfrom socketserver import BaseRequestHandler, TCPServer\n\nclass RequestHandler(BaseRequestHandler):\n\
  \    # override base class handle method\n    def handle(self):\n        print('Server\
  \ connected to: ', self.client_address)\n        while True:\n            rsp =\
  \ self.request.recv(512)\n            if not rsp: break\n            self.request.send(b'Server\
  \ received: ' + rsp)\n\ndef start_server():\n    server = TCPServer(('', 24000),\
  \ RequestHandler)\n    server.serve_forever()\n```\n\n我们将 RequestHandler 类传递给 TCPServer\
  \ 初始化器。空单引号是传入 localhost（即我们自己的电脑）的快捷方式，也就是 IP 地址 127.0.0.1。元组中的第二项是端口号。我们可以选择本地电脑上未被使用的任意端口号。\n\
  \n我们只需确保 TCP 连接客户端使用相同的端口，否则将无法连接到服务器。当然，我们必须先启动服务器，然后客户端才能连接它。\n\n我们将修改 Queues.py\
  \ 模块以使其成为 TCP 客户端：\n\n```\n# using TCP/IP\nfrom socket import socket, AF_INET, SOCK_STREAM\n\
  \ndef write_to_scrol(inst):\n    print('hi from Queue', inst)\n    sock = socket(AF_INET,\
  \ SOCK_STREAM)\n    sock.connect(('localhost', 24000))\n    for idx in range(10):\n\
  \        sock.send(b'Message from a queue: ' +\n                  bytes(str(idx).encode())\
  \ )\n        recv = sock.recv(8192).decode()\n        inst.gui_queue.put(recv)\n\
  \    inst.create_thread(6)\n```\n\n现在，当我们点击 “Click Me!” 按钮时，我们调用 bq.write_to_scrol(self)，这将创建前面展示的套接字和连接。\n\
  \n这就是我们与 TCP 服务器通信所需的全部代码。在这个示例中，我们只是向服务器发送一些字节，服务器会将它们发送回来，并在返回响应之前预先附加一些字符串。\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_221_0.png)\n\n这展示了 TCP 通过网络通信的工作原理。\n\
  \n一旦我们知道如何通过 TCP/IP 连接到远程服务器，就可以使用我们想要通信的程序的协议所设计的任何命令。第一步是先连接，然后才能向驻留在服务器上的特定应用程序发送命令。\n\
  \n\n\n\n在 `write_to_scrol` 函数中，我们将使用与之前相同的循环，但现在会将消息发送到 TCP 服务器。服务器修改收到的消息，然后将其发送回给我们。接着我们把它放入\
  \ GUI 成员队列中，与之前的菜谱一样，该队列在自己的线程中运行：\n\n```python\nsock.send(b'Message from a queue:\
  \ ' + bytes(str(idx).encode()) )\n```\n\n注意字符串前面的 `b`，然后是所有其余必需的强制转换。\n\n我们在 OOP\
  \ 类的初始化器中，于其自身的线程中启动 TCP 服务器：\n\n```python\nclass OOP():\n    def __init__(self):\n\
  \        # Start TCP/IP server in its own thread\n        svrT = Thread(target=startServer,\
  \ daemon=True)\n        svrT.start()\n```\n\n在 Python 3 中，我们必须以二进制格式通过套接字发送字符串。现在加入整数索引变得有点绕，因为我们必须先将它转换为字符串、编码，再将编码后的字符串转换为字节！\n\
  \n现在，点击“标签页 1”上的“Click Me!”按钮，会在我们的 `ScrolledText` 控件以及控制台中产生以下输出，而且由于使用了线程，响应非常快：\n\
  \nGUI_TCP_IP.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_222_0.png)\n\n#### 工作原理……\n\
  \n我们创建了一个 TCP 服务器，用于模拟连接局域网或互联网中的服务器。我们将队列模块变成了一个 TCP 客户端。我们在各自的后台线程中运行队列和服务器，这使我们的\
  \ GUI 保持高度响应。\n\n### 使用 urlopen 从网站读取数据\n\n本菜谱展示了如何仅使用 Python 的内置模块轻松读取整个网页。我们先以原始格式显示网页数据，然后对其解码，最后再显示到\
  \ GUI 中。\n\n#### 准备工作\n\n我们将从网页读取数据，然后将其显示在 GUI 的 `ScrolledText` 控件中。\n\n#### 操作步骤……\n\
  \n首先，我们创建一个新的 Python 模块，命名为 `URL.py`。然后导入使用 Python 读取网页所需的功能。只需几行代码即可完成。\n\n我们将代码包裹在类似\
  \ Java 和 C# 的 `try...except` 块中。这是 Python 支持的现代编程方法。每当我们有可能会执行不完整的代码时，都可以尝试运行这段代码；如果它正常工作，那就没问题。如果\
  \ `try...except` 块中的代码不能正常工作，Python 解释器就会抛出若干可能的异常之一，我们可以将其捕获。捕获到异常后，我们就能决定下一步怎么做。\n\
  \nPython 中的异常存在层级结构，我们也可以创建自己的类，从 Python 的异常类继承并加以扩展。在下面的代码中，我们主要关心的是要打开的 URL 可能不可用，因此我们将代码包裹在\
  \ `try...except` 代码块中。如果代码成功打开了请求的 URL，一切正常。如果失败（也许是因为我们的网络连接中断了），就会进入代码的异常分支，并打印出发生了异常的信息：\n\
  \n```python\nfrom urllib.request import urlopen\nlink = 'http://python.org/'\n\n\
  try:\n    http_rsp = urlopen(link)\n    print(http_rsp)\n    html = http_rsp.read()\n\
  \    print(html)\n    html_decoded = html.decode()\n    print(html_decoded)\nexcept\
  \ Exception as ex:\n    print('*** Failed to get Html! ***\\n\\n' + str(ex))\nelse:\n\
  \    return html_decoded\n```\n\n你可以在 https://docs.python.org/3.6/library/exceptions.html\
  \ 上阅读更多关于 Python 异常处理的内容。\n\n通过在 Python 官方网站上调用 `urlopen`，我们会获得完整数据，它就像一个很长的字符串。第一个\
  \ `print` 语句将这个长字符串打印到控制台。\n\n然后我们对结果调用 `decode`，这次会得到 1,000 多行网页数据，其中包含一些空白符。\n\
  \n我们还会打印出调用 `urlopen` 的类型，它是一个 `http.client.HTTPResponse` 对象。实际上，我们先打印了它：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_224_0.png)\n\
  \n这就是我们刚刚读取的 Python 官方网页。如果你是一名 Web 开发者，你大概对如何处理这些解析后的数据有一些好主意：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_225_0.png)\n\
  \n然后我们将这些数据显示在 GUI 的 `ScrolledText` 控件中。为此，我们必须将新模块（负责从网页读取数据）连接到我们的 GUI。\n\n要做到这一点，我们需要一个指向\
  \ GUI 的引用，一种方法是将新模块绑定到**标签页 1** 的按钮回调函数。我们可以将 Python 网页解码后的 HTML 数据返回给 `Button`\
  \ 控件，然后将其放入 `ScrolledText` 控件中。\n\n那么，让我们把代码变成一个函数，并将数据返回给调用方：\n\n```python\nfrom\
  \ urllib.request import urlopen\nlink = 'http://python.org/'\n\ndef get_html():\n\
  \    try:\n        http_rsp = urlopen(link)\n        print(http_rsp)\n        html\
  \ = http_rsp.read()\n        print(html)\n        html_decoded = html.decode()\n\
  \        print(html_decoded)\n    except Exception as ex:\n        print('*** Failed\
  \ to get Html! ***\\n\\n' + str(ex))\n    else:\n        return html_decoded\n```\n\
  \n现在，我们可以先导入新模块，然后将数据插入控件，从而将按钮回调方法中的数据写入 `ScrolledText` 控件。在调用 `write_to_scrol`\
  \ 之后，我们还让程序稍作休眠：\n\n```python\nimport Ch06_Code.URL as url\n\n# Button callback\n\
  def click_me(self):\n    self.action.configure(text='Hello ' + self.name.get())\n\
  \    bq.write_to_scrol(self)\n    sleep(2)\n    html_data = url.get_html()\n   \
  \ print(html_data)\n    self.scrol.insert(tk.INSERT, html_data)\n```\n\nHTML 数据现在显示在我们的\
  \ GUI 控件中：\n\nGUI_URL.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_227_0.png)\n\
  \n#### 工作原理……\n\n我们创建了一个新模块，将从网页获取数据的代码与 GUI 代码分离开来。这始终是一个好做法。我们读取网页数据，解码后再返回给调用代码。然后使用按钮回调函数将返回的数据放入\
  \ `ScrolledText` 控件中。\n\n本章介绍了 Python 的一些高级编程概念，我们将它们结合起来，生成了一个功能完整的 GUI 程序。\n"
- "## 7 通过 GUI 将数据存储到 MySQL 数据库\n\n在本章中，我们将通过连接 MySQL 数据库来增强 Python GUI。我们将涵盖以下菜谱：\n\
  \n- 从 Python 安装并连接到 MySQL 服务器\n- 配置 MySQL 数据库连接\n- 设计 Python GUI 数据库\n- 使用 SQL INSERT\
  \ 命令\n- 使用 SQL UPDATE 命令\n- 使用 SQL DELETE 命令\n- 在我们的 MySQL 数据库中存储和检索数据\n- 使用 MySQL\
  \ Workbench\n\n### 简介\n\n在连接到 MySQL 服务器之前，我们必须能够访问一台 MySQL 服务器。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_229_0.png)\n\
  \n本章的第一个菜谱将向你展示如何安装免费的 MySQL Server Community Edition。\n\n在成功连接到正在运行的 MySQL 服务器实例之后，我们将设计并创建一个数据库，用于存放书名（也可以是我们自己的日记，或是从互联网上某处找到的名言）。我们会要求提供书中的页码（可以为空），然后使用基于\
  \ Python 3.6 及以上版本构建的 GUI，将我们喜欢的名言（来自书籍、期刊、网站或朋友）`insert` 到 MySQL 数据库中。\n\n我们将使用\
  \ Python GUI 来发出这些 SQL 命令并显示数据，从而插入、修改、删除和显示我们喜欢的名言。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_230_0.png)\n\
  \n**CRUD** 是一个你可能遇到的数据库术语，它缩写自四种基本的 SQL 命令，代表 **Create（创建）、Read（读取）、Update（更新）和\
  \ Delete（删除）**。\n\n以下是本章所用 Python 模块的概览：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_230_1.png)\n\
  \n### 从 Python 安装并连接到 MySQL 服务器\n\n在连接到 MySQL 数据库之前，我们必须先连接到 MySQL 服务器。为此，我们需要知道\
  \ MySQL 服务器的 IP 地址以及它监听的端口。\n\n我们还必须注册为具有密码的用户，才能通过 MySQL 服务器的身份验证。\n\n#### 准备工作\n\
  \n你需要能够访问正在运行的 MySQL 服务器实例，并且还需要具有管理员权限才能创建数据库和数据表。\n\nMySQL 官方网站提供了免费的 MySQL Community\
  \ Edition。你可以从 http://dev.mysql.com/downloads/windows/installer/5.7.html 下载并安装到本地电脑上：\n\
  \n\n\n\n\n## 通过 GUI 在我们的 MySQL 数据库中存储数据\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_232_0.png)\n\
  \n在安装过程中，您将为 Root 用户选择一个密码，并且还可以添加更多用户。我建议您将自己添加为 **DB Admin** 并同样选择一个密码：\n\n##\
  \ 账号和角色\n\n## Root 账号密码\n\n输入 root 账号的密码。请务必将此密码保存在安全的地方。\n\nMySQL Root Password:\n\
  \nRepeat Password:\n\nPassword Strength: Weak\n\n## MySQL 用户账号\n\n为您的用户和应用程序创建 MySQL\
  \ 用户账号。为用户分配一个由一组权限组成的角色。\n\n| MySQL Username | Host | User Role |\n| Burkhard |\
  \ % | DB Admin |\n\nAdd User\n\nEdit User\n\nDelete\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_233_0.png)\n\
  \n在本章中，我们使用的是最新的 MySQL Community Server Release 5.7.17。\n\n验证我们是否安装了正确的驱动程序并且它能让\
  \ Python 与 MySQL 通信的一种方法，是查看 Python `site-packages` 目录。如果您的 `site-packages` 目录中出现了新的\
  \ `MySQLdb` 文件夹以及一些其他 `_mysql` 模块，则安装成功：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_235_0.png)\n\
  \n## 通过 GUI 在我们的 MySQL 数据库中存储数据\n\n首先，让我们通过使用 *MySQL Command Line Client* 来验证我们的\
  \ MySQL 服务器安装是否正常工作。在 `mysql>` 提示符下，输入 `SHOW DATABASES;` 然后按 *Enter*：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_236_0.png)\n\
  \n接下来，我们将验证是否可以使用 Python 3.6 实现相同的结果：\n\n> 将占位符带括号的名称 `<adminUser>` 和 `<adminPwd>`\
  \ 替换为您在 MySQL 安装中实际使用的凭据。\n\n```\n```python\nimport MySQLdb as mysql\nconn = mysql.connect(user=<adminUser>,\
  \ password=<adminPwd>,\nhost='127.0.0.1')\nprint(conn)\nconn.close()\n```\n```\n\
  \n如果运行上述代码导致以下输出打印到控制台，则我们就没问题了：\n\n```\nMySQL_connect.py\n\n<terminated> C:\\Eclipse_NEON_workspace\\\
  2nd Edition Python GUI Programming Cookbook\\Ch07_Code\\MySQL_connect.py\n<_mysql.connection\
  \ open to '127.0.0.1' at 605769b8>\n```\n\n如果您无法通过 *Command Line Client* 或 Python\
  \ *mysqlclient* 连接到 MySQL 服务器，则安装过程中可能出了问题。如果是这种情况，请尝试卸载、重新启动您的 PC，然后再次运行安装。\n\n\
  ## How it works...\n\n为了将我们的 GUI 连接到 MySQL 服务器，如果我们想创建自己的数据库，就需要能够使用管理员权限连接到服务器。如果数据库已存在，则我们只需要连接、插入、更新和删除数据的授权权限即可。我们将在下一个配方中在\
  \ MySQL 服务器上创建一个新数据库。\n\n## 配置 MySQL 数据库连接\n\n在之前的配方中，我们通过将用于身份验证的凭据硬编码到 `connection`\
  \ 方法中使用了连接 MySQL 服务器的最简便方式。虽然这对于早期开发来说是一种快速的方法，但我们绝对不想让任何人看到我们的 MySQL 服务器凭据。相反，我们\
  \ *grant* 权限让特定用户访问数据库、表、视图和相关的数据库命令。\n\n一种更安全的方式来让 MySQL 服务器进行身份验证是将凭据存储在配置文件中，这就是我们在本配方中要做的事情。我们将使用配置文件连接到\
  \ MySQL 服务器，然后在 MySQL 服务器上创建自己的数据库。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_237_0.png)\n\
  \n我们将在以下所有配方中使用此数据库。\n\n## Getting ready\n\n运行本配方中显示的代码需要访问具有管理员权限的正在运行的 MySQL 服务器。\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_238_0.png)\n\n> 上一个配方展示了如何安装免费的 MySQL\
  \ Server Community Edition。管理员权限将使您能够实现本配方。\n\n## How to do it…\n\n首先，我们在 GUI_MySQL_class.py\
  \ 代码的同一模块中创建一个字典：\n\n```\n```python\n# create dictionary to hold connection info\n\
  dbConfig = {\n    'user': <adminName>,       # use your admin name\n    'password':\
  \ <adminPwd>,    # not the real password\n    'host': '127.0.0.1',       # IP address\
  \ of localhost\n}\n```\n```\n\n接下来，在连接方法中，我们解包字典值。看一下以下代码片段：\n\n```\n```python\n\
  mysql.connect('user': <adminName>, 'password': <adminPwd>, 'host':\n'127.0.0.1')\n\
  ```\n```\n\n与其使用上述片段，我们使用 (**dbConfig)，它实现了与上述相同的功能，但要短得多：\n\n```\n```python\nimport\
  \ MySQLdb as mysql\n# unpack dictionary credentials\nconn = mysql.connect(**dbConfig)\n\
  print(conn)\n```\n```\n\n这会产生对 MySQL 服务器的相同成功连接，但区别在于连接方法不再暴露任何关键任务信息：\n\n数据库服务器对您的任务至关重要。一旦您丢失了宝贵的数据...并且找不到任何最近的备份，您就会意识到这一点！\n\
  \nMySQL_connect_with_dict.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_239_0.png)\n\
  \n现在，将相同的用户名、密码、数据库等放入同一 Python 模块中的字典并不能消除任何浏览代码的人看到凭据的风险。\n\n为了提高数据库安全性，我们首先将字典移至其自己的\
  \ Python 模块。让我们将新的 Python 模块命名为 GuiDBConfig.py。\n\n然后我们导入此模块并像之前一样解包凭据：\n\n```\n\
  import GuiDBConfig as guiConf\n# unpack dictionary credentials\nconn = mysql.connect(**guiConf.dbConfig)\n\
  print(conn)\n```\n\n一旦我们将此模块放置在与代码其余部分分离的安全位置，我们就为我们的 MySQL 数据实现了更好的安全级别。\n\n现在我们知道如何连接到\
  \ MySQL 并且拥有管理员权限，我们可以通过发出以下命令来创建自己的数据库：\n\n```\nGUIDB = 'GuiDB'\n\n# unpack dictionary\
  \ credentials\nconn = mysql.connect(**guiConf.dbConfig)\n\ncursor = conn.cursor()\n\
  \ntry:\n    cursor.execute(\"CREATE DATABASE {}\n                    DEFAULT CHARACTER\
  \ SET 'utf8'\".format(GUIDB))\n```\n\n```\nexcept mysql.Error as err:\n    print(\"\
  Failed to create DB: {}\".format(err))\n\nconn.close()\n```\n\n为了执行对 MySQL 的命令，我们从连接对象创建一个游标对象。\n\
  \n游标通常是数据库表中特定行的位置，我们可以在表中上下移动它，但在这里，我们用它来创建数据库本身。我们将 Python 代码包装在 try...except\
  \ 块中，并使用 MySQL 的内置错误代码来告诉我们是否出现任何问题。\n\n我们可以通过执行创建数据库的代码两次来验证此块是否有效。第一次，它将在 MySQL\
  \ 中创建一个新数据库，第二次，它将打印出一条错误消息，指出该数据库已存在：\n\nMySQL_create_DB.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_240_0.png)\n\
  \n我们可以通过使用完全相同的游标对象语法执行以下 MySQL 命令来验证哪些数据库存在。与发出 CREATE DATABASE 命令不同，我们创建一个游标并使用它执行\
  \ SHOW DATABASES 命令，其结果我们获取并打印到控制台输出：\n\n```\nimport MySQLdb as mysql\nimport GuiDBConfig\
  \ as guiConf\n\n# unpack dictionary credentials\nconn = mysql.connect(**guiConf.dbConfig)\n\
  \ncursor = conn.cursor()\n\ncursor.execute(\"SHOW DATABASES\")\nprint(cursor.fetchall())\n\
  \nconn.close()\n```\n\n我们通过在游标对象上调用 `fetchall` 方法来检索结果。\n\n运行此代码会显示我们 MySQL 服务器实例中当前存在的数据库。正如输出所示，MySQL\
  \ 附带了多个内置数据库，例如 `information_schema` 等。我们已成功创建了自己的 `guidb` 数据库，这在输出中显示。所有其他数据库都是随\
  \ MySQL 一起提供的：\n\n```\nMySQL_show_DBS.py\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_241_0.png)\n\
  \n请注意，即使我们在创建时以混合大小写字母 GuiDB 指定了数据库，`SHOW DATABASES` 命令也会以小写显示 MySQL 中所有现有数据库，并将我们的数据库显示为\
  \ `guidb`。\n\n## How it works…\n\n为了将我们的 Python GUI 连接到 MySQL 数据库，我们首先必须知道如何连接到\
  \ MySQL 服务器。这需要建立连接，而此连接只有在我们能够提供所需凭据时才会被 MySQL 接受。\n\n虽然将字符串放入一行 Python 代码很容易，但当我们处理数据库时，我们必须非常谨慎，因为今天的个人沙盒开发环境明天就可能在万维网上变得可访问。\n\
  \n您不想损害数据库安全性，本配方的第一部分展示了更安全的方法，即将 MySQL 服务器的连接凭据放入单独的文件中，并且通过将此文件放置在无法从外部世界访问的位置，我们的数据库系统将变得更安全。\n\
  \n在真实的生产环境中，MySQL 服务器安装、连接凭据和此 `dbConfig` 文件将由 IT 系统管理员处理，他们将使您能够导入 `dbConfig` 文件以连接到\
  \ MySQL 服务器，而无需您知道实际凭据是什么。解包 `dbConfig` 不会像我们的代码中那样暴露凭据。\n\n\n\n\n\nThe second part\
  \ created our own database in a MySQL server instance, and we will extend and use\
  \ this database in the following recipes, combining it with our Python GUI.\n\n\
  ## Designing the Python GUI database\n\nBefore we start creating tables and inserting\
  \ data into them, we have to design the database. Unlike changing local Python variable\
  \ names, changing a database schema once it has been created and loaded with data\
  \ is not that easy.\n\nWe would have to DROP the table, which means we would lose\
  \ all the data that was in the table. So, before dropping a table, we would have\
  \ to extract the data, then DROP the table, recreate it, and finally reimport the\
  \ original data.\n\nYou get the picture...\n\nDesigning our GUI MySQL database means\
  \ first thinking about what we want our Python application to do with it and then\
  \ choosing names for our tables that match the intended purpose.\n\n## Getting ready\n\
  \nWe are working with the MySQL database we created in the previous recipe, Configuring\
  \ the MySQL database connection. A running instance of MySQL is necessary and the\
  \ two previous recipes show how to install MySQL, all necessary additional drivers,\
  \ as well as how to create the database we are using in this chapter.\n\n## How\
  \ to do it...\n\nFirst, we move the widgets from our Python GUI around between the\
  \ two tabs we created in the previous recipes in order to organize our Python GUI\
  \ better to connect to a MySQL database.\n\nWe rename several widgets and separate\
  \ the code that accesses the MySQL data to what used to be named Tab 1, and we will\
  \ move unrelated widgets to what we called Tab 2 in earlier recipes. We also adjust\
  \ some internal Python variable names in order to understand our code better.\n\n\
  > Code readability is a coding virtue and not a waste of time.\n\nOur refactored\
  \ Python GUI now looks like the following screenshot. We have renamed the first\
  \ tab as **MySQL** and created two tkinter `LabelFrame` widgets. We labeled the\
  \ one on the top Python database and it contains two labels and six tkinter entry\
  \ widgets plus three buttons, which we aligned in four rows and three columns using\
  \ the tkinter grid layout manager. We will enter book titles and pages into the\
  \ entry widgets, and clicking the buttons will result in either inserting, retrieving,\
  \ or modifying book quotations. The `LabelFrame` at the bottom has a label of **Book\
  \ Quotation** and the `ScrolledText` widget that is part of this frame will display\
  \ our books and quotations:\n\n```\nGUI_MySQL.py\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_243_0.png)\n\
  \nWe will create two SQL tables to hold our data. The first will hold the data for\
  \ the book title and book page, and then, we will join with the second table, which\
  \ will hold the book quotation. We will link the two tables together via primary\
  \ to foreign key relations.\n\nSo, let's create the first database table now. Before\
  \ we do that, let's verify first that our database does, indeed, have no tables.\
  \ According to the online MySQL documentation, the command to view the tables that\
  \ exist in a database is as follows:\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_244_0.png)\n\
  \n### 14.7.5.37 SHOW TABLES Syntax\n\n```\nSHOW [FULL] TABLES [{FROM | IN} db_name]\n\
  [LIKE 'pattern' | WHERE expr]\n```\n\nIt is important to note that, in the preceding\
  \ syntax, arguments in square brackets, such as FULL, are optional while arguments\
  \ in curly braces, such as FROM, are required for the SHOW TABLES command. The pipe\
  \ symbol between FROM and IN means that the MySQL syntax requires one or the other:\n\
  \n```\n# unpack dictionary credentials\nconn = mysql.connect(**guiConf.dbConfig)\n\
  # create cursor\ncursor = conn.cursor()\n# execute command\ncursor.execute(\"SHOW\
  \ TABLES FROM guidb\")\nprint(cursor.fetchall())\n\n# close connection to MySQL\n\
  conn.close()\n```\n\nWhen we execute the SQL command in Python, we get the expected\
  \ result, which is an empty tuple showing us that our database currently has no\
  \ tables:\n\n```\nGUI_MySQL_class.py\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_245_0.png)\n\
  \nWe can also first select the database by executing the `USE <DB>` command, and\
  \ then we don't have to pass it into the `SHOW TABLES` command because we have already\
  \ selected the database we want to talk to. The following code creates the same\
  \ true result as the previous one:\n\n```python\ncursor.execute(\"USE guidb\")\n\
  cursor.execute(\"SHOW TABLES\")\n```\n\nNow that we know how to verify that our\
  \ database has no tables, let's create some. After we have created two tables, we\
  \ will verify that they have truly made it into our database by using the same commands\
  \ as before.\n\nWe create the first table, named *Books*, by executing the following\
  \ code:\n\n```python\n# connect by unpacking dictionary credentials\nconn = mysql.connect(**guiConf.dbConfig)\n\
  \n# create cursor\ncursor = conn.cursor()\n\n# select DB\ncursor.execute(\"USE guidb\"\
  )\n\n# create Table inside DB\ncursor.execute(\"CREATE TABLE Books (\n        Book_ID\
  \ INT NOT NULL AUTO_INCREMENT,\n        Book_Title VARCHAR(25) NOT NULL,\n     \
  \   Book_Page INT NOT NULL,\n        PRIMARY KEY (Book_ID)\n    ) ENGINE=InnoDB\"\
  )\n\n# close connection to MySQL\nconn.close()\n```\n\nWe can verify that the table\
  \ has been created in our database by executing the following commands:\n\nGUI_MySQL_class.py\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_246_0.png)\n\nNow the result is no longer\
  \ an empty tuple but a tuple that contains a tuple, showing the books table we just\
  \ created.\n\nWe can use the MySQL command-line client to see the columns in our\
  \ table. In order to do this, we have to log in as the root user. We also have to\
  \ append a semicolon to the end of the command.\n\nOn Windows, you simply double-click\
  \ the MySQL command-line client shortcut, which is automatically installed during\
  \ the MySQL installation.\n\nIf you don’t have a shortcut on your desktop, you can\
  \ find the executable at the following path for a typical default installation:\n\
  \n```\nC:\\Program Files\\MySQL\\MySQL Server 5.7\\bin\\mysql.exe\n```\n\nWithout\
  \ a shortcut to run the MySQL client, you have to pass it some parameters:\n\n-\
  \ C:\\Program Files\\MySQL\\MySQL Server 5.7\\bin\\mysql.exe\n- -u root\n- -p\n\n\
  Either double-clicking the shortcut or using the command line with the full path\
  \ to the executable and passing in the required parameters, will bring up the MySQL\
  \ command-line client, which prompts you to enter the password for the root user:\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_247_0.png)\n\nIf you remember the password\
  \ you assigned to the root user during the installation, you can then run the SHOW\
  \ COLUMNS FROM books; command, as shown in the following screenshot. This will display\
  \ the columns of our books table from our guidb:\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_247_1.png)\n\
  \nWhen executing commands in the MySQL client, the syntax is not Pythonic.\n\nNext,\
  \ we will create the second table, which will store the book and journal quotations.\
  \ We will create it by executing the following code:\n\n```\n# select DB\ncursor.execute(\"\
  USE guidb\")\n\n# create second Table inside DB\ncursor.execute(\"CREATE TABLE Quotations\
