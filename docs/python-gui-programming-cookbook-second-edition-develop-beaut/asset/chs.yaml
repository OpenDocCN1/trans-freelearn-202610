  \n## Matplotlib 图表\n\n在本章中，我们将使用 Python 3.6 和 `Matplotlib` 模块创建漂亮的图表。我们将涵盖以下内容：\n\
  \n- 使用 `Matplotlib` 创建漂亮的图表\n- 使用 pip 配合 whl 扩展名安装 `Matplotlib`\n- 创建我们的第一个图表\n\
  - 在图表上放置标签\n- 如何为图表添加图例\n- 缩放图表\n- 动态调整图表的缩放比例\n\n### 引言\n\n在本章中，我们将创建美观的图表来直观地表示数据。根据数据源的格式，我们可以在同一图表中绘制一列或多列数据。\n\
  \n我们将使用 Python `Matplotlib` 模块来创建图表。\n\n为了创建这些图形图表，我们需要下载额外的 Python 模块，有几种方法可以安装它们。\n\
  \n本章将说明如何下载 `Matplotlib` Python 模块以及所有其他必需的 Python 模块，以及实现此目的的方法。\n\n在安装所需的模块后，我们将创建自己的\
  \ Python 风格图表。\n\n以下是本章涉及 Python 模块的概览：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_154_0.png)\n\
  \n## 使用 Matplotlib 创建漂亮的图表\n\n本节向我们介绍 `Matplotlib` Python 模块，它使我们能够使用 Python 3.6\
  \ 及以上版本创建可视化图表。\n\n网址 `http://matplotlib.org/users/screenshots.html` 是探索 Matplotlib\
  \ 世界的一个很好的起点，它还教我们如何创建本章未介绍的许多图表。\n\n### 准备工作\n\n为了使用 `Matplotlib` Python 模块，我们首先必须安装该模块以及其他几个相关的\
  \ Python 模块。\n\n如果你运行的是旧于 3.6 的 Python 版本，我建议你升级版本，因为本章将使用 Python `pip` 模块来安装所需的\
  \ Python 模块，而 `pip` 随 3.6 及以上版本一起安装。\n\n虽然可以在更早的 Python 3 版本上安装 `pip`，但该过程不太直观，因此绝对最好升级到\
  \ 3.6 或更高版本。\n\n## 操作步骤……\n\n下图是一个示例，展示了使用 Python 和 `Matplotlib` 模块可以创建的令人惊叹的图形图表：\n\
  \n```\nMatplotlib_chart.py\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_155_0.png)\n\
  \n在下面的代码片段中，我从 http://matplotlib.org/ 网站上复制了一些创建此精美图表的代码。我还添加了一些注释。这个网站上有许多示例，我鼓励你尝试这些示例，直到找到你想创建的图表类型。\n\
  \n以下代码用不到 25 行 Python 代码（包括空格）创建了该图表：\n\n```\nfrom mpl_toolkits.mplot3d import Axes3D\n\
  from matplotlib import cm\nfrom matplotlib.ticker import LinearLocator, FormatStrFormatter\n\
  import matplotlib.pyplot as plt\nimport numpy as np\n\nfig = plt.figure()      \
  \                              # create a figure\nax = fig.gca(projection='3d')\
  \                        # create a 3-dimensional axis\nX = np.arange(-5, 5, 0.25)\
  \                            # horizontal range\nY = np.arange(-5, 5, 0.25)    \
  \                        # vertical range\nX, Y = np.meshgrid(X, Y)            \
  \                  # create a special grid\nR = np.sqrt(X**2 + Y**2)           \
  \                   # calculate square root\nZ = np.sin(R)                     \
  \                    # calculate sinus\n\n## use #@UndefinedVariable below to ignore\
  \ the error for cm.coolwarm\nsurf = ax.plot_surface(X, Y, Z, rstride=1, cstride=1,\n\
  \                       cmap=cm.coolwarm, linewidth=0,\n                       antialiased=False)\n\
  ax.set_zlim(-1.01, 1.01)                              # z-axis is third dimension\n\
  \nax.zaxis.set_major_locator(LinearLocator(10))\nax.zaxis.set_major_formatter(FormatStrFormatter('%.02f'))\n\
  \nfig.colorbar(surf, shrink=0.5, aspect=5)\n\nplt.show()                       \
  \                     # display the figure\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_156_0.png)\n\
  \n使用 Python 3.6 或更高版本以及 Eclipse PyDev 插件运行上述代码时，可能会显示一些未解析的导入和变量错误。你可以通过 `#@UnresolvedImport`\
  \ 和 `#@UndefinedVariable` 在 Eclipse 中直接禁用这些错误。\n\n如果你使用 Eclipse 进行开发，忽略这些错误即可，因为代码会成功运行。\n\
  \n## 工作原理……\n\n为了创建如前所示的漂亮图表，我们需要下载 Matplotlib 以及其他几个 Python 模块。\n\n以下内容将引导我们成功下载并安装所有必需的模块，从而使我们能够创建自己的漂亮图表。\n\
  \n## 使用 pip 配合 whl 扩展名安装 Matplotlib\n\n下载额外 Python 模块的常用方法是使用 `pip`。pip 模块随最新版本的\
  \ Python（3.6 及以上）预装。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_157_0.png)\n\n\
  > 如果你使用的是较旧版本的 Python，你可能需要自行下载 pip 和 setuptools。\n\n本节将展示如何使用 pip 成功安装 Matplotlib。我们将使用\
