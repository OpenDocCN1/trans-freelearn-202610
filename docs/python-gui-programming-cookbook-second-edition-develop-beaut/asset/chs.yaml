  \ DRY 原则，将通用代码只放在一个位置，这样当我们修改代码时，所有导入该模块的模块都会自动获得最新版本。\n\n**DRY** 代表 **Don't Repeat\
  \ Yourself**（不要重复自己），我们将在后面的章节中再次讨论它。我们也可以通过将 **Tab 3** 图像转换为可复用组件来做类似的事情。为了保持本节代码的简洁，我们移除了\
