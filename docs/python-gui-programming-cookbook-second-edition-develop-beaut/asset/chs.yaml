  \    # display callback function\n    glClear(GL_COLOR_BUFFER_BIT)      # clear\
  \ window with color defined in SetupRC\n    glFlush()                         #\
  \ flush/execute the OpenGL drawing command(s)\n\ndef SetupRC():\n    # rendering\
  \ context\n    glClearColor(0.0, 0.0, 1.0, 1.0)  # RGBA: R=0.0, G=0.0, B=1.0 =>\
  \ becomes Blue\n\ndef main():\n    glutInit()\n    glutInitDisplayMode(GLUT_SINGLE\
  \ | GLUT_RGBA)  # single buffer; RGBA color mode\n    glutCreateWindow(b\"Simple\"\
  )                   # Python 3: bytes instead of string for Title\n    glutDisplayFunc(RenderScene)\n\
  \    SetupRC()\n\n    glutMainLoop()\n\n================\nmain()\n```\n\n运行代码会创建以下窗口，使用纯\
  \ Python 和 OpenGL：\n\nOpenGL_SuperBible_Simple.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_385_0.png)\n\
  \n为了在此 OpenGL 窗口中显示绘图组件，我们通过创建一个大小为 25 x 25 像素的正方形矩形来增强 RenderScene() 函数。\n\n我们还添加了一个新的函数\
  \ ChangeSize()，该函数会在 GLUT 库在窗口调整大小或重绘时自动调用：\n\nOpenGL_SuperBible_Simple_Rectangle.py\n\
  \n```\nfrom OpenGL.GLUT import *\nfrom OpenGL.GL import *\nfrom OpenGL.GLU import\
  \ *\n\ndef RenderScene():\n    # display callback function\n    glClear(GL_COLOR_BUFFER_BIT)\
  \          # clear window with color defined in SetupRC\n    #       R   G   B \
  \                    # set drawing color to Red\n    glColor3f(1.0, 0.0, 0.0)  \
  \            # function expects 3 f(loats)\n    glRectf(-25.0, 25.0, 25.0, -25.0)\
  \     # draw a filled rectangle with above color\n    glFlush()                \
  \             # flush/execute the OpenGL drawing command(s)\n\ndef SetupRC():\n\
  \    # rendering context setup\n    glClearColor(0.0, 0.0, 1.0, 1.0)      # RGBA:\
  \ R=0.0, G=0.0, B=1.0=white => becomes Blue\n\ndef ChangeSize(w, h):\n    # callback\
  \ when window size changes\n    if h == 0: h = 1                      # prevent\
  \ divide by zero\n    glViewport(0, 0, w, h)                # set Viewport to Window\
  \ dimensions\n    glMatrixMode(GL_PROJECTION)           # define the viewing volume\n\
  \    glLoadIdentity()                      # reset coordinate system\n    aspectRatio\
  \ = GLfloat(w).value / GLfloat(h).value  # establish clipping volume\n         \
  \                                 # GLfloat becomes ctypes.c_float\n           \
  \                               # Use the value attribute before dividing\n    if\
  \ w <= h: glOrtho(-100.0, 100.0, -100.0 / aspectRatio, 100.0 / aspectRatio, 1.0,\
  \ -1.0)\n    else: glOrtho(-100.0 * aspectRatio, 100.0 * aspectRatio, -100.0, 100.0,\
  \ 1.0, -1.0)\n    glMatrixMode(GL_MODELVIEW)\n    glLoadIdentity()\n\ndef main():\n\
  \    glutInit()\n    glutInitDisplayMode(GLUT_SINGLE | GLUT_RGBA)  # single buffer;\
  \ RGBA color mode\n    glutCreateWindow(b\"GLRect\")                  # Python 3:\
  \ bytes instead of string for Title\n    glutDisplayFunc(RenderScene)\n    glutReshapeFunc(ChangeSize)\n\
  \    SetupRC()\n    glutMainLoop()\n\n====================\nmain()\n```\n\n以下是 resulting\
  \ 窗口：\n\nOpenGL_SuperBible_Simple_Rectangle.py\n\n\n\n\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_387_0.png)\n\
  \n接下来，我们将通过让红色方块在窗口中移动并在每个角落反弹来为其制作动画。为此，我们首先创建一些模块级全局变量：\n\n```\nOpenGL_SuperBible_Animation.py\n\
  ```\n\n```\n```python\nfrom OpenGL.GLUT import *\nfrom OpenGL.GL import *\nfrom\
  \ OpenGL.GLU import *\n\n# initial position and size\nx1 = GLfloat(0.0).value\n\
  y1 = GLfloat(0.0).value\nrect_size = GLfloat(25.0).value\n\n# number of pixels to\
  \ move each step\nxstep = GLfloat(1.0).value\nystep = GLfloat(1.0).value\n\n# initialize\
  \ bouncing window\nwindowWidth = GLfloat(133).value      # 800/600 = 1.33\nwindowHeight\
  \ = GLfloat(100).value\n```\n```\n\n在 RenderScene() 函数中，我们现在使用双缓冲：\n\n```\ndef RenderScene():\
  \              # display callback function\n    glClear(GL_COLOR_BUFFER_BIT)   \
  \   # clear window with color defined in SetupRC\n    #   R   G   B            \
  \      # set drawing color to Red\n    glColor3f(1.0, 0.0, 0.0)          # functions\
  \ expects 3 floats\n    glRectf(x1, y1, x1 + rect_size, y1 - rect_size) # draw a\
  \ filled rectangle with above color\n    \n    glutSwapBuffers()               \
  \  # flush and swap double buffers\n```\n\n我们必须稍微更改我们的 main() 以将 GLUT_DOUBLE 传递给\
  \ glutInitDisplayMode() 函数：\n\n```\ndef main():\n    glutInit()\n    glutInitDisplayMode(GLUT_DOUBLE\
  \ | GLUT_RGB)      # Double buffer\n    glutInitWindowSize(800, 600)           \
  \           # window size\n    glutCreateWindow(b\"Bouncing Red Square\")      \
  \    # Python 3: bytes instead of string for Title\n    glutDisplayFunc(RenderScene)\n\
  \    glutReshapeFunc(ChangeSize)\n    glutTimerFunc(33, TimerFunction, 1)\n    \n\
  \    SetupRC()\n    \n    glutMainLoop()\n\n#================\nmain()\n```\n\n我们创建\
  \ TimerFunction() 以传递给 glutTimerFunc()。在此函数中，我们进行一些数学计算来定位红色方块并使其在窗口墙壁上反弹。在函数末尾，我们在\
  \ glutTimerFunc() 中递归调用此函数：\n\n```\ndef TimerFunction(value):\n    global x1, xstep,\
  \ y1, ystep\n\n    # reverse direction left/right\n    if ((x1 > windowWidth - rect_size)\
  \ or (x1 < -windowWidth)):\n        xstep = -xstep\n\n    # reverse direction top/bottom\n\
  \    if ((y1 > windowHeight) or (y1 < -windowHeight + rect_size)):\n        ystep\
  \ = -ystep\n\n    # move the red square\n    x1 += xstep\n    y1 += ystep\n\n  \
  \  # check the bounds of the clipping area\n    if (x1 > (windowWidth - rect_size\
  \ + xstep)):\n        x1 = windowWidth - rect_size - 1\n    elif (x1 < -(windowWidth\
  \ + xstep)):\n        x1 = -windowWidth - 1\n\n    if (y1 > (windowHeight + ystep)):\n\
  \        y1 = windowHeight - 1\n    elif (y1 < -(windowHeight - rect_size + ystep)):\n\
  \        y1 = -windowHeight + rect_size - 1\n\n    # redraw the scene\n    glutPostRedisplay()\n\
  \    glutTimerFunc(33, TimerFunction, 1)    # recursive call\n```\n\n当我们现在运行程序时，红色方块将在蓝色窗口内移动，并在每个角落反弹：\n\
  \n```\nOpenGL_SuperBible_Animation.py\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_390_0.png)\n\
  \n## How it works...\n\n在本教程中，我们直接从 Python 使用 OpenGL 库。我们在不使用任何其他 Python GUI 框架的情况下创建了自己的窗口。我们探索了许多\
  \ OpenGL 函数中的一些，并创建了可工作的程序。\n\n有关 OpenGL 的简短介绍以及如何从 Python 使用它，可以在 https://noobtuts.com/python/opengl-introduction\
  \ 上找到。\n\n## Creating a slide show using tkinter\n\n在本教程中，我们将使用纯 Python 创建一个漂亮的可工作幻灯片放映\
  \ GUI。我们将看到核心 Python 内置功能的局限性，然后我们将探索另一个可用的第三方模块 Pillow，该模块扩展了 tkinter 在图像处理方面的内置功能。\n\
  \n虽然名字 `Pillow` 最初听起来可能有点奇怪，但它实际上背后有着丰富的历史。\n\n本书中我们仅使用 Python 3.6 及以上版本。我们不会回到\
  \ Python 2。Guido 表达了他有意破坏向后兼容性的决定，并决定 Python 3 是 Python 编程的未来。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_391_0.png)\n\
  \n对于 GUI 和图像，旧的 Python 2 行有一个非常强大的模块名为 `PIL`，代表 Python Image Library。该库包含非常大量的功能，在\
  \ Python 3 非常成功创建后的几年里，这些功能尚未为 Python 3 翻译。\n\n许多开发人员仍然选择使用 Python 2 而不是由 *Python\
  \ 的仁慈独裁者* 设计的未来，因为 Python 2 仍然有更多可用的库。\n\n这有点令人难过。幸运的是，已经创建了另一个与 Python 3.6 配合使用的成像库，它的名字是\
  \ `PIL` 加上某物。\n\nPillow 与 Python 2 PIL 库不兼容。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_391_1.png)\n\
  \n## Getting ready\n\n在本教程的第一部分，我们将使用纯 Python。为了改进代码，我们将使用 `pip` 功能安装另一个 Python\
  \ 模块，因此虽然你可能已经熟悉 `pip`，但了解如何使用它可能会有用。\n\n## How to do it…\n\n首先，我们将创建一个使用纯 Python\
  \ 在窗口框架内随机播放幻灯片的可工作 GUI。以下是可工作的代码以及运行此代码结果的一些屏幕截图：\n\n```\n```python\nfrom tkinter\
  \ import Tk, PhotoImage, Label\nfrom itertools import cycle\nfrom os import listdir\n\
  \nclass SlideShow(Tk):\n    # inherit GUI framework extending tkinter\n    def __init__(self,\
  \ mssShowTimeBetweenslides=1500):\n```\n```\n\n```\n# initialize tkinter super class\n\
  Tk.__init__(self)\n\n# time each slide will be shown\nself.showTime = msShowTimeBetweenSlides\n\
  \n# look for images in current working directory\nlistOfSlides = [slide for slide\
  \ in listdir()\n                if slide.endswith('gif')]\n\n# cycle slides to show\
  \ on the tkinter Label\nself.iterableCycle = cycle((PhotoImage(file=slide), slide)\n\
  \                          for slide in listOfSlides)\n\n# create tkinter Label\
  \ widget which can display images\nself.slidesLabel = Label(self)\n\n# create the\
  \ Frame widget\nself.slidesLabel.pack()\n\ndef slidesCallback(self):\n    # get\
  \ next slide from iterable cycle\n    currentInstance, nameOfSlide = next(self.iterableCycle)\n\
  \n    # assign next slide to Label widget\n    self.slidesLabel.config(image=currentInstance)\n\
  \n    # update Window title with current slide\n    self.title(nameOfSlide)\n\n\
  \    # recursively repeat the Show\n    self.after(self.showTime, self.slidesCallback)\n\
  \n#================================\n# Start GUI\n#================================\n\
  win = SlideShow()\nwin.after(0, win.slidesCallback())\nwin.mainloop()\n\nSlideShow.py\n\
  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_393_0.png)\n\n以下是幻灯片放映展开过程中的另一个时刻：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_393_1.png)\n\n虽然幻灯片滑动效果确实令人印象深刻，但纯 Python\
  \ tkinter GUI 的内置功能不支持非常流行的 .jpg 格式，因此我们必须求助于另一个 Python 库。为了使用 Pillow，我们首先必须使用 pip\
  \ 命令安装它。\n\n一次成功的安装如下所示：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_394_0.png)\n\
  \nPillow 支持 `.jpg` 格式，为了使用它，我们必须稍微更改语法。\n\n不使用 Pillow，尝试显示 `.jpg` 图像会产生以下错误：\n\n\
  ```\nSlideShow_try_jpg.py\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_394_1.png)\n\
  \n使用 Pillow，我们可以同时显示 `.gif` 和 `.jpg` 文件。在成功安装 Pillow 包后，我们只需要进行一些更改：\n\n```\n# using\
  \ Pillow instead of PIL (2.7) for Python 3.6\n# Installation is: >pip install Pillow\n\
  from PIL import ImageTk\n\nclass SlideShow(Tk):\n    # inherit GUI framework extending\
  \ tkinter\n    def __init__(self, msShowTimeBetweenSlides=1500):\n        # initialize\
  \ tkinter super class\n        Tk.__init__(self)\n\n        # time each slide will\
  \ be shown\n        self.showTime = msShowTimeBetweenSlides\n\n        # look for\
  \ images in current working directory where this module lives\n        # listOfSlides\
  \ = [slide for slide in listdir() if slide.endswith('gif')]\n        listOfSlides\
  \ = [slide for slide in listdir() if slide.endswith('gif') or slide.endswith('jpg')]\n\
  \n        # endlessly read in the slides so we can show them on the tkinter label\n\
  \        # self.iterableCycle = cycle((PhotoImage(file=slide), slide) for slide\
  \ in listOfSlides)\n        self.iterableCycle = cycle((ImageTk.PhotoImage(file=slide),\
  \ slide) for slide in listOfSlides)\n```\n\n我们搜索文件夹中的 .jpg 扩展名，并且不再使用 PhotoImage()\
  \ 类，而是现在使用 ImageTk.PhotoImage() 类。这使我们能够显示具有不同扩展名的图像：\n\nSlideShow_Pillow.py\n\n\
  ![](img/986b0dbf3f539f4f3baa82bd3003f04e_395_0.png)\n\n\n\n\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_396_0.png)\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_396_1.png)\n\n## How it works…\n\nPython\
  \ 是一个很棒的工具，在本菜谱中，我们探索了几种使用和扩展它的方法。\n\n以下是本章 Python 模块的概览：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_398_0.png)\n\
  \n## Avoiding spaghetti code\n\n在本菜谱中，我们将探索一种典型的创建意大利面条代码的方式，然后我们将看到一种避免此类代码的更好方法。\n\
  \n意大利面条代码是指大量功能交织在一起的代码。\n\n## Getting ready\n\n我们将创建一个新的、简单的 GUI，使用内置的 Python `tkinter`\
  \ 库用 Python 编写。\n\n## How to do it…\n\n在网上搜索并阅读文档后，我们可能会开始编写以下代码来创建我们的 GUI：\n\n\
  ```python\nGUI_Spaghetti.py\n\n# Spaghetti Code ############################\ndef\
  \ PRINTME(me):print(me)\nimport tkinter\nx=y=z=1\nPRINTME(z)\nfrom tkinter import\
  \ *\nscrolW=30;scrolH=6\nwin=tkinter.Tk()\nif x:chVarUn=tkinter.IntVar()\nfrom tkinter\
  \ import ttk\nWE='WE'\nimport tkinter.scrolledtext\noutputFrame=tkinter.ttk.LabelFrame(win,text='\
  \ Type into the scrolled text control: ')\nscr=tkinter.scrolledtext.ScrolledText(outputFrame,width=scrolW,height=scrolH,wrap=tkinter.WORD)\n\
  e='E'\nscr.grid(column=1,row=1,sticky=WE)\noutputFrame.grid(column=0,row=2,sticky=e,padx=8)\n\
  lFrame=win\nif y:chk2=tkinter.Checkbutton(lFrame,text=\"Enabled\",variable=chVarUn)\n\
  WE='WE'\nif y==x:PRINTME(x)\nlFrame=tkinter.ttk.LabelFrame(win,text=\"Spaghetti\"\
  )\nchk2.grid(column=1,row=4,sticky=tkinter.W,columnspan=3)\nPRINTME(z)\nlFrame.grid(column=0,row=0,sticky=WE,padx=10,pady=10)\n\
  chk2.select()\ntry: win.mainloop()\nexcept: PRINTME(x)\nchk2.deselect()\nif y==x:PRINTME(x)\n\
  # End Pasta ###############################\n```\n\n运行前面的代码会得到以下 GUI：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_400_0.png)\n\
  \n这并不是我们想要的 GUI。我们希望它看起来更像这样：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_400_1.png)\n\
  \n虽然意大利面条代码创建了一个 GUI，但由于代码中混乱太多，很难调试。\n\n以下代码会产生期望的 GUI：\n\n```python\nGUI_NOT_Spaghetti.py\n\
  \n#===================\n# imports\n#===================\nimport tkinter as tk\n\
  from tkinter import ttk\nfrom tkinter import scrolledtext\n\n#===================\n\
  # Create instance\n#===================\nwin = tk.Tk()\n\n#===================\n\
  # Add a title\n#===================\nwin.title(\"Python GUI\")\n\n#===================\n\
  # Disable resizing the GUI\n#===================\nwin.resizable(0,0)\n\n#================================================================\n\
  # Adding a LabelFrame, Textbox (Entry) and Combobox\n#================================================================\n\
  LFrame = ttk.LabelFrame(win, text=\"Python GUI Programming Cookbook\")\nLFrame.grid(column=0,\
  \ row=0, sticky='WE', padx=10, pady=10)\n\n#================================================================\n\
  # Using a scrolled Text control\n#================================================================\n\
  outputFrame = ttk.LabelFrame(win, text=' Type into the scrolled text control: ')\n\
  outputFrame.grid(column=0, row=2, sticky='E', padx=8)\nscrolW = 30\nscrolH = 6\n\
  scr = scrolledtext.ScrolledText(outputFrame, width=scrolW,\n                   \
  \ height=scrolH, wrap=tk.WORD)\nscr.grid(column=1, row=0, sticky='WE')\n\n#================================================================\n\
  # Creating a checkbutton\n#================================================================\n\
  chVarUn = tk.IntVar()\ncheck2 = tk.Checkbutton(lFrame, text=\"Enabled\", variable=chVarUn)\n\
  check2.deselect()\ncheck2.grid(column=1, row=4, sticky=tk.W, columnspan=3)\n\n#========================\n\
  # Start GUI\n#========================\nwin.mainloop()\n```\n\n## How it works...\n\
  \n在本菜谱中，我们比较了意大利面条代码与良好代码。良好代码相比意大利面条代码有很多优势。它有清晰注释的段落。\n\n以下是意大利面条代码的示例：\n\n```python\n\
  def PRINTME(me):print(me)\nimport tkinter\nx=y=z=1\nPRINTME(z)\nfrom tkinter import\
  \ *\n```\n\n以下是良好代码的示例：\n\n```python\n#====================\n# imports\n#====================\n\
  import tkinter as tk\nfrom tkinter import ttk\n```\n\n它有自然的流程，遵循小部件在主 GUI 表单中的布局方式。\n\
  \n在意大利面条代码中，底部的 LabelFrame 在顶部的 LabelFrame 之前创建，并且与 import 语句和一些小部件创建混合在一起。\n\n\
  考虑以下意大利面条代码示例：\n\n```python\nimport tkinter.scrolledtext\noutputFrame=tkinter.ttk.LabelFrame(win,text='\
  \ Type into the scrolled text control: ')\nscr=tkinter.scrolledtext.ScrolledText(outputFrame,width=scrolW,height=scrolH,wrap=tkinter.WORD)\n\
  e='E'\nscr.grid(column=1,row=1,sticky=WE)\noutputFrame.grid(column=0, row=2, sticky=e,\
  \ padx=8)\niframe=None\nif y:chk2=tkinter.Checkbutton(lFrame,text=\"Enabled\",variable=chVarUn)\n\
  wE='WE'\nif y==x:PRINTME(x)\nlFrame=tkinter.ttk.LabelFrame(win,text=\"Spaghetti\"\
  )\n```\n\n考虑以下良好代码示例：\n\n```python\n#==============================================================\n\
  # Adding a LabelFrame, Textbox (Entry) and Combobox\n#==============================================================\n\
  lFrame = ttk.LabelFrame(win, text=\"Python GUI Programming Cookbook\")\nlFrame.grid(column=0,\
  \ row=0, sticky='WE', padx=10, pady=10)\n\n#==============================================================\n\
  # Using a scrolled Text control\n#==============================================================\n\
  outputFrame = ttk.LabelFrame(win, text=' Type into the scrolled text control: ')\n\
  outputFrame.grid(column=0, row=2, sticky='E', padx=8)\n```\n\n它不包含不必要的变量赋值，也没有 `print`\
  \ 函数，该函数在阅读代码时不会执行人们期望的调试操作。\n\n例如，考虑以下意大利面条代码：\n\n```python\ndef PRINTME(me):print(me)\n\
  x=y=z=1\ne='E'\nWE='WE'\nscr.grid(column=1,row=1,sticky=WE)\nwE='WE'\nif y==x:PRINTME(x)\n\
  lFrame.grid(column=0,row=0,sticky=WE,padx=10,pady=10)\nPRINTME(z)\ntry: win.mainloop()\n\
  except: PRINTME(x)\nchk2.deselect()\nif y==x:PRINTME(x)\n```\n\n良好代码没有意大利面条代码中提到的任何实例。\n\
  \n`import` 语句只导入所需的模块。它们不会分散在代码各处。没有重复的 `import` 语句。没有 `import *` 语句。\n\n再来看一下意大利面条代码的另一个实例：\n\
  \n```python\nimport tkinter\nx=y=z=1\nPRINTME(z)\nfrom tkinter import *\nscrollW=30;scrollH=6\n\
  win=tkinter.Tk()\nif x:chVarUn=tkinter.IntVar()\nfrom tkinter import ttk\nWE='WE'\n\
  import tkinter.scrolledtext\n```\n\n现在，来看一下良好代码：\n\n```python\nimport tkinter as\
  \ tk\nfrom tkinter import ttk\nfrom tkinter import scrolledtext\n```\n\n所选的变量名非常有意义。没有使用数字\
  \ 1 而不是 `True` 的不必要 `if` 语句。\n\n以下显示了意大利面条代码：\n\n```python\nx=y=z=1\nif x:chVarUn=tkinter.IntVar()\n\
  WE='WE'\n```\n\n以下显示了良好代码：\n\n```python\n#========================================\n\
  # Using a scrolled Text control\n#========================================\noutputFrame\
  \ = ttk.LabelFrame(win, text=' Type into the scrolled text control:')\noutputFrame.grid(column=0,\
  \ row=2, sticky='E', padx=8)\nscrollW = 30\nscrollH = 6\nscr = scrolledtext.ScrolledText(outputFrame,\
  \ width=scrollW,\n                                height=scrollH, wrap=tk.WORD)\n\
  scr.grid(column=1, row=0, sticky='WE')\n```\n\n我们没有丢失预期的窗口标题，我们的复选按钮也最终位于正确的位置。我们还使围绕复选按钮的\
  \ `LabelFrame` 可见。\n\n意大利面条代码：`GUI_Spaghetti.py`\n\n\n\n\n\n我们丢失了窗口标题并且没有显示顶部的 `LabelFrame`。Check\
  \ 按钮最终出现在错误的位置。\n\n好的代码：`GUI_NOT_Spaghetti.py`\n\n```python\n#====================\n\
  # Create instance\n#====================\nwin = tk.Tk()\n\n#====================\n\
  # Add a title\n#====================\nwin.title(\"Python GUI\")\n\n#====================================================================\n\
  # Adding a LabelFrame, Textbox (Entry) and Combobox\n#====================================================================\n\
