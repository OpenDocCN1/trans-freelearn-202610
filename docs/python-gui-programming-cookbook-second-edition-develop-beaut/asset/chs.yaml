  \ GUI\", command=wxPythonApp)\naction.grid(column=2, row=1)\n\n#===================\n\
  # Start GUI\n#===================\nwin.mainloop()\n```\n\n运行上述代码后，点击 tkinter 按钮控件，将从\
  \ tkinter GUI 启动一个 wxPython GUI：\n\nEmbed_wxPython.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_348_0.png)\n\
  \n## 工作原理...\n\n重要的是，我们将整个 wxPython 代码放入其自己的函数中，命名为 def wxPythonApp()。\n\n在按钮点击事件的回调函数中，我们只需调用这段代码。\n\
  \n> > 需要注意的一点是，我们必须先关闭 wxPython GUI，然后才能继续使用 tkinter GUI。\n\n## 尝试将我们的 tkinter GUI\
  \ 代码嵌入到 wxPython 中\n\n在本食谱中，我们将沿着与之前食谱相反的方向，尝试在 wxPython GUI 中调用我们的 tkinter GUI\
  \ 代码。\n\n### 准备工作\n\n我们将复用本章之前食谱中创建的一些 wxPython GUI 代码。\n\n### 如何实现...\n\n我们将从一个简单的\
  \ wxPython GUI 开始，如下所示：\n\n`Embed_tkinter.py`\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_349_0.png)\n\
  \n接下来，我们将尝试调用一个简单的 tkinter GUI。\n\n运行上述代码后，点击 wxPython 按钮控件，将从 wxPython GUI 启动一个\
  \ tkinter GUI。然后，我们可以在 tkinter 文本框中输入文本，并点击其按钮，按钮文本将更新为该名称：\n\n`Embed_tkinter.py`\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_351_0.png)\n\n启动 tkinter 事件循环后，当 tkinter\
  \ GUI 正在运行时，我们仍然可以向 TextCtrl 控件中输入文本，因此 wxPython GUI 仍然保持响应。\n\n在之前的食谱中，我们必须先关闭\
  \ wxPython GUI，然后才能使用 tkinter GUI。如果我们想将这两种 Python GUI 技术结合起来，了解这一差异有助于我们的设计决策。\n\
  \n我们还可以通过多次点击 wxPython GUI 按钮来创建多个 tkinter GUI 实例。但是，只要任何 tkinter GUI 仍在运行，我们就无法关闭\
  \ wxPython GUI。我们必须先关闭它们：\n\n`Embed_tkinter.py`\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_351_1.png)\n\
  \n### 工作原理...\n\n在本食谱中，我们沿与之前食谱相反的方向：首先使用 wxPython 创建 GUI，然后从其中创建多个使用 tkinter 构建的\
  \ GUI 实例。\n\n当一个或多个 tkinter GUI 运行时，wxPython GUI 仍然保持响应。然而，点击 tkinter 按钮只会更新第一个实例中的按钮文本。\n\
  \n## 使用 Python 控制两个不同的 GUI 框架\n\n在本食谱中，我们将探讨从 Python 控制 tkinter 和 wxPython GUI 框架的方法。我们已经在前面的一章“线程与网络”中使用过\
  \ Python 的 threading 模块来保持 GUI 的响应性，因此这里我们将尝试使用相同的方法。\n\n我们会发现，事情并不总是按照直觉的方式运作。\n\
  \n然而，我们将改进我们的 tkinter GUI，使其在从内部调用 wxPython GUI 实例时不会失去响应。\n\n### 准备工作\n\n本食谱将扩展本章之前的食谱“尝试将主\
  \ wxPython 应用嵌入主 tkinter 应用”，在该食谱中，我们尝试将主 wxPython GUI 嵌入到 tkinter GUI 中。\n\n###\
  \ 如何实现...\n\n当我们从 tkinter GUI 创建 wxPython GUI 实例时，在关闭这个 wxPython GUI 实例之前，我们无法再使用\
  \ tkinter GUI 控件。现在让我们对此进行改进。\n\n我们的第一次尝试可能是从 tkinter 按钮回调函数中使用线程。\n\n例如，我们的代码可能如下所示：\n\
  \n```\ndef wxPythonApp():\n    import wx\n    app = wx.App()\n    frame = wx.Frame(None,\
  \ -1, \"wxPython GUI\", size=(200,150))\n    frame.SetBackgroundColour('white')\n\
  \    frame.CreateStatusBar()\n    menu= wx.Menu()\n    menu.Append(wx.ID_ABOUT,\
  \ \"About\", \"wxPython GUI\")\n    menuBar = wx.MenuBar()\n    menuBar.Append(menu,\"\
  File\")\n    frame.SetMenuBar(menuBar)\n    frame.Show()\n    app.MainLoop()\n\n\
  def tryRunInThread():\n    runT = Thread(target=wxPythonApp)\n    runT.setDaemon(True)\n\
  \    runT.start()\n    print(runT)\n    print('createThread() :', runT.isAlive())\n\
  \naction = ttk.Button(win, text=\"Call wxPython GUI\", command=tryRunInThread)\n\
  ```\n\n起初，这似乎是有效的，这也符合直觉，因为 tkinter 控件不再被禁用，我们可以通过点击按钮创建多个 wxPython GUI 实例。我们还可以在\
  \ wxPython GUI 中输入文本，并选择其他 tkinter 控件：\n\nControl_Frameworks_NOT_working.py\n\n\
  ![](img/986b0dbf3f539f4f3baa82bd3003f04e_353_0.png)\n\n### 工作原理...\n\n我们首先尝试在一个线程中运行整个\
  \ wxPython GUI 应用程序，但这没有用，因为 wxPython 的主事件循环期望成为应用程序的主线程。\n\n我们通过只在一个线程中运行 wxPython\
  \ 的 `app.MainLoop` 找到了解决方法，使其误以为自己是主线程。\n\n这种方法的一个副作用是，我们无法再单独关闭所有 wxPython GUI\
  \ 实例。其中至少有一个实例只在我们关闭创建线程为守护线程的 wxPython GUI 时才会关闭。您可以通过点击 **调用 wxPython GUI** 按钮一次或多次，然后尝试关闭所有已创建的\
  \ wxPython 窗口窗体来测试这一点。除非我们先关闭调用方的 tkinter GUI，否则我们无法关闭最后一个 wxPython GUI！\n\n我不太确定为什么会这样。凭直觉，人们可能期望能够关闭所有守护线程，而不必等待创建它们的主线程先关闭。\n\
  \n这可能与主线程仍在运行时引用计数器尚未归零有关。\n\n从实际角度来看，这就是当前的工作方式。\n\n## 在两个连接的 GUI 之间通信\n\n在之前的食谱中，我们找到了将\
  \ wxPython GUI 与 tkinter GUI 连接的方法，可以从一个调用另一个，反之亦然。\n\n虽然两个 GUI 同时成功运行，但它们并没有真正相互通信，因为它们只是相互启动。\n\
  \n在本食谱中，我们将探讨让两个 GUI 相互对话的方法。\n\n### 准备工作\n\n阅读前面某个食谱可能对本食谱有很好的帮助。\n\n在本食谱中，我们将使用相对于前一个食谱稍作修改的\
  \ GUI 代码，但大多数基本的 GUI 构建代码是相同的。\n\n### 如何实现...\n\n在之前的食谱中，我们的主要挑战之一是如何组合两种 GUI 技术，而它们都被设计为应用程序唯一的\
  \ GUI 工具包。我们找到了各种简单的方法来组合它们。\n\n我们将再次从 tkinter GUI 的主事件循环启动 wxPython GUI，并在其自己的线程中启动\
  \ wxPython GUI，该线程在 Python.exe 进程内运行。\n\n为此，我们将使用一个共享的全局 multiprocessing Python\
  \ 队列。\n\n虽然通常最好避免使用全局数据，但在本食谱中，这是一个实用的解决方案，而且 Python 全局变量实际上只在其声明的模块中是全局的。\n\n下面是使两个\
  \ GUI 在一定程度上相互通信的 Python 代码。为了节省篇幅，这不是纯 OOP 代码。我们也没有展示所有控件的创建代码。这些代码与之前的食谱相同：\n\n\
  ```\n# Communicate.py\nimport tkinter as tk\nfrom tkinter import ttk\nfrom threading\
  \ import Thread\n\nwin = tk.Tk()\nwin.title(\"Python GUI\")\n\nfrom queue import\
  \ Queue\nsharedQueue = Queue()\ndataInQueue = False\n\ndef putDataIntoQueue(data):\n\
  \    global dataInQueue\n    dataInQueue = True\n    sharedQueue.put(data)\n\ndef\
  \ readDataFromQueue():\n```\n\n\n\n\n\n```\nglobal dataInQueue\n    dataInQueue\
  \ = False\n    return sharedQueue.get()\n#================================================================\n\
  import wx\nclass GUI(wx.Panel):\n    def __init__(self, parent):\n        wx.Panel.__init__(self,\
  \ parent)\n        parent.CreateStatusBar()\n        button = wx.Button(self, label=\"\
  Print\", pos=(0,60))\n        self.Bind(wx.EVT_BUTTON, self.writeToSharedQueue,\
  \ button)\n\n    #------------------------------------------------------------\n\
  \    def writeToSharedQueue(self, event):\n        self.textBox.AppendText(\"The\
  \ Print Button has been clicked!\\n\")\n        putDataIntoQueue('Hi from wxPython\
  \ via Shared Queue.\\n')\n        if dataInQueue:\n            data = readDataFromQueue()\n\
  \            self.textBox.AppendText(data)\n            text.insert('0.0', data)\
  \ # insert data into tkinter GUI\n\n#================================================================\n\
  def wxPythonApp():\n    app = wx.App()\n    frame = wx.Frame(None, ,\n         \
  \           size=(300,180))\n    GUI(frame)\n    frame.Show()\n    runT = Thread(target=app.MainLoop)\n\
  \    runT.setDaemon(True)\n    runT.start()\n    print(runT)\n    print('createThread():',\
  \ runT.isAlive())\n#================================================================\n\
  action = ttk.Button(win, text=\"Call wxPython GUI\", command=wxPythonApp)\naction.grid(column=2,\
  \ row=1)\n\n#==================\n# Start GUI\n#==================\nwin.mainloop()\n\
  ```\n\n## 使用 wxPython 库扩展我们的 GUI\n\n运行前面的代码首先创建程序的 tkinter 部分，当我们点击此 GUI 中的按钮时，它会运行\
  \ wxPython GUI。两者像之前一样同时运行，但这次两个 GUI 之间有额外的通信层：\n\n```\nCommunicate.py\n```\n\n\
  ![](img/986b0dbf3f539f4f3baa82bd3003f04e_358_0.png)\n\n前面的截图中左侧显示了 tkinter GUI，通过点击\
  \ **Call wxPython GUI** 按钮，我们会调用一个 wxPython GUI 实例。我们可以通过多次点击按钮来创建多个实例。\n\n> 所有创建的\
  \ GUI 都保持响应。它们不会崩溃也不会冻结。\n\n在任何 wxPython GUI 实例上点击 **Print** 按钮会向其自己的 TextCtrl 小部件写入一句话，然后再向自身以及\
  \ tkinter GUI 写入另一行。你需要向上滚动才能在 wxPython GUI 中看到第一句话。\n\n> 这样工作的方式是使用模块级队列和 tkinter\
  \ Text 小部件。\n\n一个需要注意的重要元素是，我们创建了一个线程来运行 wxPython app.MainLoop，就像我们在上一节食谱中所做的那样：\n\
  \n```\ndef wxPythonApp():\n    app = wx.App()\n    frame = wx.Frame(None, ,\n  \
  \                  size=(300,180))\n    GUI(frame)\n    frame.Show()\n    runT =\
  \ Thread(target=app.MainLoop)\n    runT.setDaemon(True)\n    runT.start()\n```\n\
  \n我们创建一个继承自 wx.Panel 的类并命名为 GUI，然后在前面的代码中实例化该类的一个实例。\n\n我们在此类中创建一个按钮点击事件回调方法，该方法随后调用在其上方编写的过程代码。正因为如此，该类可以访问函数并写入共享队列：\n\
  \n```\n#----------------------------------------------------------------\ndef writeToSharedQueue(self,\
  \ event):\n    self.textBox.AppendText(\"The Print Button has been clicked\\n\"\
  )\n    putDataIntoQueue('Hi from wxPython via Shared Queue.\\n')\n    if dataInQueue:\n\
  \        data = readDataFromQueue()\n        self.textBox.AppendText(data)\n   \
  \     text.insert('0.0', data) # insert data into tkinter\n```\n\n我们在前面的方法中首先检查数据是否已放置在共享队列中，如果是，则将公共数据打印到两个\
  \ GUI。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_359_0.png)\n\nputDataIntoQueue()\
  \ 行将数据放入队列，而 readDataFromQueue() 则将其读回，保存在 data 变量中。text.insert('0.0', data) 是将此数据从\
  \ Print 按钮的 wxPython 回调方法写入 tkinter GUI 的行。\n\n以下是在代码中被调用并使其工作的过程函数（不是方法，因为它们未绑定）：\n\
