  \ Python 模块，可以使用 Matplotlib 创建自己的图表了。\n\n我们只需几行 Python 代码即可创建图表。\n\n### 准备工作\n\n\
  如前面的操作步骤所示，成功安装 Matplotlib 是本节的前提条件。\n\n### 操作步骤\n\n按照 Matplotlib 官方网站上展示的最少代码量，我们可以创建第一张图表。嗯，几乎可以。网站上的示例代码需要先从\
  \ pylab 导入 show 函数并调用它才能运行：\n\nMatplotlib_our_first_chart.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_164_0.png)\n\
  \n我们可以利用 Matplotlib 官方网站提供的众多示例中的另一个来简化代码，甚至改进它。`pylab` 模块自带绘图函数，因此如果我们想简化代码，就不需要再导入\
  \ `matplotlib` 了：\n\nMatplotlib_second_chart.py\n\n```python\nfrom pylab import\
  \ show, arange, sin, plot, pi\n\nt = arange(0.0, 2.0, 0.01)\ns = sin(2 * pi * t)\n\
  plot(t, s)\n\nshow()\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_165_0.png)\n\
  \n### 工作原理\n\nPython 的 `Matplotlib` 模块与 `numpy` 等附加组件相结合，构建了一个非常丰富的编程环境，使我们能够轻松地执行数学计算并将其绘制为可视化图表。\n\
  \n`numpy` 的 `arange` 方法并不打算“排列”任何东西。它表示创建一个范围，用来替代 Python 内置的 `range` 运算符。`linspace`\
  \ 方法也可能造成类似的混淆。谁是 *lin*？在什么 *空间* 中？\n\n事实证明，这个名字的意思是 *线性等距向量*。\n\n`pylab` 的 show\
  \ 函数用于显示我们创建的图形。在成功创建第一个图形后，如果尝试绘制另一个图形，调用 `show()` 会产生一些副作用。\n\n## 在图表上放置标签\n\n\
  到目前为止，我们使用了默认的 `Matplotlib` GUI。现在，我们将使用 `Matplotlib` 创建一些 `tkinter` GUI。\n\n这将需要多写几行\
  \ Python 代码并导入更多库，但非常值得，因为我们将通过画布来掌控我们的绘图。\n\n我们将在水平轴和垂直轴上放置标签，即 *x* 轴和 *y* 轴。为此，我们将创建一个用于绘图的\
  \ `Matplotlib` 图形对象。\n\n你还将学习如何使用子图，从而可以在同一窗口中绘制多个图形。\n\n### 准备工作\n\n在安装了必要的 Python\
  \ 模块并知道在哪里可以找到官方在线文档和教程后，我们现在可以继续创建 `Matplotlib` 图表了。\n\n### 操作步骤\n\n虽然 `plot` 是创建\
  \ `Matplotlib` 图表的最简单方式，但将 `Figure` 与 `Canvas` 结合使用可以创建更加定制的图形，外观更好，并且还可以向其中添加按钮和其他控件：\n\
  \nMatplotlib_labels.py\n\n```python\nfrom matplotlib.figure import Figure\nfrom\
  \ matplotlib.backends.backend_tkagg import FigureCanvasTkAgg\nimport tkinter as\
  \ tk\n#---------------------------------------------------------------\nfig = Figure(figsize=(12,\
  \ 8), facecolor='white')\n#---------------------------------------------------------------\n\
  # axis = fig.add_subplot(111)    # 1 row, 1 column, only graph\naxis = fig.add_subplot(211)\
  \     # 2 rows, 1 column, Top graph\n#---------------------------------------------------------------\n\
  xValues = [1,2,3,4]\nyValues = [5,7,6,8]\naxis.plot(xValues, yValues)\naxis.set_xlabel('Horizontal\
  \ Label')\naxis.set_ylabel('Vertical Label')\n# axis.grid()                    #\
  \ default line style\naxis.grid(linestyle='-')         # solid grid lines\n#-------------------------------------------------------------------\n\
  def _destroyWindow():\n    root.quit()\n    root.destroy()\n#-------------------------------------------------------------------\n\
  root = tk.Tk()\nroot.withdraw()\nroot.protocol('WM_DELETE_WINDOW', _destroyWindow)\n\
  #-------------------------------------------------------------------\ncanvas = FigureCanvasTkAgg(fig,\
  \ master=root)\ncanvas._tkcanvas.pack(side=tk.TOP, fill=tk.BOTH, expand=1)\n#-------------------------------------------------------------------\n\
  root.update()\nroot.deiconify()\nroot.mainloop()\n```\n\n运行上述代码会生成下图：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_167_0.png)\n\
  \n在导入语句之后的第一行代码中，我们创建了一个 Figure 对象的实例。接下来，我们通过调用 add_subplot(211) 向该图形添加子图。211 中的第一个数字告诉图形要添加多少个图，第二个数字决定列数，第三个数字告诉图形显示这些图的顺序。\n\
  \n提供一个基于 Matplotlib 网站的示例，可能会让这一点更清楚：\n\n```python\nfrom matplotlib.figure import\
