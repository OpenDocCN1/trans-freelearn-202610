  \  File \"C:\\Eclipse NEON workspace\\2nd Edition Python GUI Programming Cookbook\\\
  Ch\n    print(GLOBAL_CONST)\nUnboundLocalError: local variable 'GLOBAL_CONST' referenced\
  \ before assignment\n```\n\n当我们使用 global 关键字限定局部变量时，我们可以打印出全局变量的值，也可以在本地覆盖该值：\n\n\
  ```\n213 def usingGlobal():\n214     global GLOBAL_CONST\n215     print(GLOBAL_CONST)\n\
  216     GLOBAL_CONST = 777\n217     print(GLOBAL_CONST)\n218 \n219 \n220 # call\
  \ function\n221 usingGlobal()\n222 \nC:\\Eclipse_NEON_workspace\\2nd Edition Python\n\
  42\n777\n```\n\n`global` 变量在编写小型应用程序时非常有用。它们可以帮助我们在同一个 Python 模块中的方法和函数之间共享数据，而且有时使用\
  \ OOP 的开销并不划算。\n\n随着程序复杂度的增长，使用全局变量所带来的好处会迅速减少。\n\n> 最好避免使用全局变量，也要避免在不同作用域中使用相同名称而意外遮蔽变量。我们可以使用\
  \ OOP 来代替全局变量。\n\n我们在过程式代码中尝试了 `global` 变量，并了解到它如何导致难以调试的 bug。在下一个配方中，我们将转向 OOP，这可以消除此类\
  \ bug。\n\n## 在类中编码如何改进 GUI\n\n到目前为止，我们一直以过程式风格编写代码。这是 Python 中一种快速的脚本编写方法。一旦代码变得越来越庞大，我们就需要进阶到使用\
  \ OOP 编码。\n\n为什么？\n\n因为，除许多其他好处外，OOP 允许我们通过方法来移动代码。一旦使用类，我们就不再需要将代码物理地放在调用它的代码之上。这为我们组织代码提供了极大的灵活性。\n\
  \n我们可以将相关代码写在一起，不再需要担心代码因未放在调用它的代码之前而无法运行。\n\n我们甚至可以将其发挥到相当极致的程度：编写引用那些并非在该模块内创建的方法的模块。它们依赖于运行时状态，即这些方法在代码运行期间已被创建。\n\
  \n> 如果到那时我们调用的方法尚未创建，就会收到运行时错误。\n\n\n\n\n\n## 准备工作\n\n我们将非常简单地整个过程化代码转换为 OOP。只需将它变成一个类，缩进所有现有代码，并在所有变量前加上\
  \ `self`。\n\n这非常容易。\n\n虽然一开始必须用 `self` 关键字给所有内容加前缀，使代码变得冗长，可能有点烦人（嘿，我们浪费了这么多纸……），但最终这是值得的。\n\
  \n### 如何实现...\n\n一开始，一切都乱套了，但我们很快就会修复这表面上的一团糟。\n\n请注意，在 Eclipse 中，PyDev 编辑器通过代码编辑器右侧的红色高亮来提示编码问题。\n\
  \n也许我们根本不应该用 OOP 编码，但这就是我们要做的，而且有很好的理由：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_140_0.png)\n\
  \n我们只需在所有变量前加上 `self` 关键字，并通过使用 `self` 将函数绑定到类，这在形式上和技术上都会把函数变为方法。\n\n> 函数和方法之间是有区别的。Python\
  \ 把这一点说得很清楚。方法绑定到类，而函数则不绑定。我们甚至可以在同一个 Python 模块中混合使用两者。\n\n让我们将所有内容加上 `self` 前缀，以消除红色错误，这样我们就可以再次运行代码了：\n\
  \n```python\n# Modified Button Click Function\ndef click_me(self):\n    self.action.configure(text='Hello\
  \ ' + self.name.get() + ' ' +\n                          self.number_chosen.get())\n\
  ```\n\n一旦我们对所有红色高亮显示的错误都这样处理后，就可以再次运行我们的 Python 代码了。 `click_Me` 函数现在已绑定到类，并正式成为了一个方法。\n\
  \n不幸的是，以过程化方式开始，然后将其转换为 OOP，并不像我前面说的那么简单。代码已经变得一团糟。这正是在 Python 中使用 OOP 编码模型开始编程的一个很好的理由。\n\
  \n> Python 擅长用简单的方式做事。简单的代码往往会变得更复杂（因为一开始很简单）。一旦变得过于复杂，将过程化代码重构为真正意义上的 OOP 代码，会随着每一行代码而变得愈发困难。\n\
  \n我们正在把过程化代码转换为面向对象代码。看到我们陷入的所有麻烦，仅仅把 200 多行 Python 代码翻译成 OOP 就足以说明，我们不妨从一开始就用 OOP\
  \ 来编码。\n\n实际上，我们确实破坏了以前的一些功能。使用**标签页2**并点击单选按钮不再起作用。我们需要进一步重构。\n\n过程化代码很简单，因为它只是从上到下的编码。现在我们已经将代码放入类中，必须将所有回调函数移到方法中。这可行，但转换原始代码确实需要一些工作：\n\
  \n```\n########################################\n# Our procedural code looked like\
  \ this:\n########################################\n# Button Click Function\n```\n\
  \n```\ndef click_me():\n    action.configure(text='Hello ' + name.get() + ' ' +\n\
  \                    number_chosen.get())\n\n# Adding a Textbox Entry widget\nname\
  \ = tk.StringVar()\nname_entered = ttk.Entry(mighty, width=12, textvariable=name)\n\
  name_entered.grid(column=0, row=1, sticky='W')\n\n# Adding a Button\naction = ttk.Button(mighty,\
  \ text=\"Click Me!\", command=click_me)\naction.grid(column=2, row=1)\n\nttk.Label(mighty,\
  \ text=\"Choose a number:\").grid(column=1, row=0)\nnumber = tk.StringVar()\nnumber_chosen\
  \ = ttk.Combobox(mighty, width=12,\n                            textvariable=number,\
  \ state='readonly')\nnumber_chosen['values'] = (1, 2, 4, 42, 100)\nnumber_chosen.grid(column=1,\
  \ row=1)\nnumber_chosen.current(0)\n\n**************************************************\n\
  The new OOP code looks like this:\n**************************************************\n\
  class OOP():\n    def __init__(self):                # Initializer method\n    \
  \    # Create instance\n        self.win = tk.Tk()\n\n        # Add a title\n  \
  \      self.win.title(\"Python GUI\")\n        self.create_widgets()\n\n# Button\
  \ callback\ndef click_me(self):\n    self.action.configure(text='Hello ' + self.name.get()\
  \ + ' '\n                        +self.number_chosen.get())\n    # ... more callback\
  \ methods\n\ndef create_widgets(self):\n    # Create Tab Control\n    tabControl\
  \ = ttk.Notebook(self.win)\n    tab1 = ttk.Frame(tabControl)                # Create\
  \ a tab\n    tabControl.add(tab1, text='Tab 1')          # Add the tab\n    tab2\
  \ = ttk.Frame(tabControl)                # Create second tab\n    tabControl.add(tab2,\
  \ text=\"Tab 2\")         # Add second tab\n    # Pack to make visible\n    tabControl.pack(expand=1,\
  \ fill=\"both\")\n```\n\n```python\n# Adding a Textbox Entry widget - using self\n\
  self.name = tk.StringVar()\nname_entered = ttk.Entry(mighty, width=12,\n       \
  \                  textvariable=self.name)\nname_entered.grid(column=0, row=1, sticky='W')\n\
  \n# Adding a Button - using self\nself.action = ttk.Button(mighty, text=\"Click\
  \ Me!\",\n                         command=self.click_me)\nself.action.grid(column=2,\
  \ row=1)\n# ...\n# ====================\n# Start GUI\n# ====================\noop\
  \ = OOP()              # create an instance of the class\n# use instance variable\
  \ to call mainloop via win\noop.win.mainloop()\n```\n\n我们将回调方法移到了模块顶部，放在新的 OOP 类中。我们将所有控件创建代码移到一个相当长的方法中，并在类的初始化器中调用它。\n\
  \n从技术上讲，在底层代码的深处，Python 确实有构造函数，但是 Python 让我们无需为此担心。它已经为我们处理好了。\n\n相反，除了真正的构造函数之外，Python\
  \ 还为我们提供了一个初始化器。\n\n我们强烈建议使用这个初始化器。我们可以用它向类传递参数，初始化希望在类实例内部使用的变量。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_143_0.png)\n\
  \n在 Python 中，同一个 Python 模块中可以存在多个类。\n\n与 Java 不同，Java 有非常严格的命名约定（没有它就无法工作），而 Python\
  \ 要灵活得多。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_143_1.png)\n\n我们可以在同一个 Python\
  \ 模块中创建多个类。与 Java 不同，我们不需要依赖与每个类名匹配的文件名。Python 真的很棒！\n\n一旦我们的 Python GUI 变得庞大，我们会将一些类拆分到各自的模块中，但与\
  \ Java 不同，我们并非必须这样做。在本书和项目中，我们会将一些类保留在同一个模块中，同时也会将其他一些类拆分到各自的模块中，并将它们导入到一个可以看作是\
  \ `main()` 函数的地方（这不是 C 语言，但我们可以将它想象成类似 C 语言的方式，因为 Python 非常灵活）。\n\n到目前为止，我们已将 ToolTip\
  \ 类添加到 Python 模块中，并将过程化 Python 代码重构为 OOP Python 代码。\n\n在本小节中，我们可以看到，同一个 Python 模块中可以存在多个类。\n\
  \n确实很酷！\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_144_0.png)\n\nToolTip 类和 OOP\
  \ 类都位于同一个 Python 模块中：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_144_1.png)\n\n\
  ## 准备工作\n\nPython 解释器会运行模块中的所有代码一次，找出并指出任何语法错误。如果语法不正确，就无法运行 Python 代码。这包括缩进（如果没有导致语法错误，错误的缩进通常会导致\
  \ bug）。\n\n在下一轮解析时，解释器会解释并运行我们的代码。\n\n在运行时，可以生成许多 GUI 事件，而通常是回调函数为 GUI 控件添加功能。\n\
  \n### 如何实现...\n\n以下是 `Spinbox` 控件的回调：\n\n```python\n# Spinbox callback\ndef _spin(self):\n\
  \    value = self.spin.get()\n    print(value)\n    self.scrol.insert(tk.INSERT,\
  \ value + '\\n')\n\n# Adding a Spinbox widget\nself.spin = Spinbox(mighty, values=(1,\
  \ 2, 4, 42, 100), width=5, bd=9, command=self._spin)\nself.spin.grid(column=0, row=2)\n\
  ```\n\n### 工作原理...\n\n我们在 OOP 类中创建了一个回调方法，当我们从 `Spinbox` 控件中选择一个值时，该方法会被调用，因为我们通过\
  \ command 参数（`command=self._spin`）将该方法绑定到了控件。我们使用前导下划线来暗示这个方法应该像 Java 私有方法一样被尊重。\n\
  \nPython 有意避免语言限制，如 `private`、`public`、`friend` 等。在 Python 中，我们改用命名约定。关键字前后的双下划线被保留给\
  \ Python 语言本身使用，我们不应在自己的 Python 代码中使用它们。\n\n\n\n\n\n不过，我们可以使用变量名或函数名加下划线前缀的方式来提示该名称应被视为私有辅助函数。\n\
  \n同时，如果我们希望使用原本是 Python 内置名称的单词，可以在其后加一个下划线后缀。例如，如果我们想用缩写表示列表的长度，可以这样做：\n\n```\n\
  len_ = len(aList)\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_147_0.png)\n\n\
  通常，下划线难以阅读且容易被忽略，所以这在实践中可能不是最好的做法。\n\n## 创建可复用的 GUI 组件\n\n我们将使用 Python 创建可复用的 GUI\
  \ 组件。在本节中，我们将保持简单，把 `ToolTip` 类移动到它自己的模块中。然后，我们将导入并使用它，以便在 GUI 的多个控件上显示工具提示。\n\n\
  ## 准备工作\n\n我们的代码基于第 3 章《外观与感觉定制：GUI_tooltip.py》构建。\n\n## 操作步骤……\n\n我们将先把 `ToolTip`\
  \ 类拆分成一个独立的 Python 模块。我们会对其进行轻微增强，以便传入控件控件以及当鼠标悬停在该控件上时希望显示的工具提示文本。\n\n我们创建一个新的\
  \ Python 模块，将 `ToolTip` 类的代码放入其中，然后将此模块导入到我们的主模块中。\n\n然后，我们通过创建多个工具提示来复用导入的 `ToolTip`\
