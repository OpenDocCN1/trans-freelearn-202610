- "# 8\n\n## Internationalization and Testing\n\n在本章中，我们将对 Python GUI 进行国际化和测试，涵盖以下教程：\n\
  \n- 在不同语言中显示部件文本\n- 一次性更改整个 GUI 语言\n- 本地化 GUI\n- 为国际化准备 GUI\n- 如何以敏捷方式设计 GUI\n-\
  \ 我们需要测试 GUI 代码吗？\n- 设置调试监视\n- 配置不同的调试输出级别\n- 使用 Python 的 `__main__` 部分创建自测试代码\n\
  - 使用单元测试创建健壮的 GUI\n- 如何使用 Eclipse PyDev IDE 编写单元测试\n\n## Introduction\n\n在本章中，我们将通过在标签、按钮、选项卡和其他部件上以不同语言显示文本来对\
  \ GUI 进行国际化。我们将从简单开始，然后探索如何在设计层面为 GUI 准备国际化。\n\n## Internationalization and Testing\n\
  \n我们还将本地化 GUI，这与国际化略有不同。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_276_0.png)\n\
  \n由于这些词很长，它们已被缩写为使用该词的第一个字符，后跟第一个和最后一个字符之间的字符总数，最后是该词的最后一个字符。因此，internationalization\
  \ 缩写为 I18N，localization 缩写为 L10N。\n\n我们还将测试我们的 GUI 代码，编写单元测试，并探索单元测试在我们的开发工作中可以提供的价值，这将引领我们走向\
  \ *refactoring* 代码的最佳实践。\n\n以下是本章的 Python 模块概述：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_276_1.png)\n\
  \n\n\n\n\n# 在不同语言中显示控件文本\n\n在 Python 中国际化文本字符串最简单的方法是将它们移入一个单独的 Python 模块，然后通过向该模块传入参数来选择我们的\
  \ GUI 中要显示的语言。\n\n虽然根据在线搜索结果，这种方法并不被强烈推荐，但取决于你所开发应用的具体需求，这种方法可能仍然是最务实且实现速度最快的方式。\n\
  \n## 准备工作\n\n我们将复用之前创建的 Python GUI。我们已注释掉了一行创建 MySQL 选项卡的 Python 代码，因为本章不会涉及与 MySQL\
  \ 数据库的交互。\n\n## 操作步骤...\n\n在本节中，我们将通过将窗口标题从英语改为另一种语言来开始我们 GUI 的 I18N（国际化）工作。\n\n\
  由于在其他语言中 GUI（图形用户界面）这个名称本身是相同的，我们首先要扩展这个名称，以便我们能够看到更改后的视觉效果。\n\n以下是我们之前的代码行：\n\n\
  ```\nself.win.title(\"Python GUI\")\n```\n\n让我们将其改为以下内容：\n\n```\nself.win.title(\"\
  Python Graphical User Interface\")\n```\n\n上述代码更改后，我们的 GUI 程序标题如下：\n\n```\nGUI_Refactored.py\n\
  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_278_0.png)\n\n> 在本章中，我们将使用英语和德语来示例我们\
  \ Python GUI 国际化的原理。\n\n将字符串硬编码到代码中从来都不是一个好主意，因此我们要做的第一件事就是将 GUI 中可见的所有字符串分离到它们自己的\
  \ Python 模块中。这就是我们 GUI 可见部分国际化的开端。\n\n> 在进行 I18N 的同时，我们将一步到位地完成这次非常有益的重构和语言翻译。\n\
  \n让我们创建一个新的 Python 模块，并将其命名为 `LanguageResources.py`。接下来，将 GUI 标题的英文字符串移入该模块，然后将此模块导入到我们的\
  \ GUI 代码中。\n\n> 我们将 GUI 与其显示的语言分离开来，这是一个 OOP 设计原则。\n\n我们新的包含国际化字符串的 Python 模块现在如下所示：\n\
  \n```\nclass I18N():\n    '''国际化'''\n    def __init__(self, language):\n       \
  \ if language == 'en': self.resourceLanguageEnglish()\n        elif language ==\
  \ 'de': self.resourceLanguageGerman()\n        else: raise NotImplementedError('不支持的语言。')\n\
  \n    def resourceLanguageEnglish(self):\n```\n\n```\nself.title = \"Python Graphical\
  \ User Interface\"\n\ndef resourceLanguageGerman(self):\n    self.title = 'Python\
  \ Grafische Benutzeroberflaeche'\n```\n```\n\n我们将这个新的 Python 模块导入到主 Python GUI 代码中，然后使用它：\n\
  \n```\nfrom Ch08_Code.LanguageResources import I18N\nclass OOP():\n    def __init__(self):\n\
  \        self.win = tk.Tk()                  # 创建实例\n        self.i18n = I18N('de')\
  \              # 选择语言\n        self.win.title(self.i18n.title)     # 添加标题\n```\n\
  ```\n\n根据我们传给 I18N 类的语言参数，我们的 GUI 将用该语言显示。\n\n运行上述代码，我们现在得到如下国际化结果：\n\nGUI.py\n\n\
  ![](img/986b0dbf3f539f4f3baa82bd3003f04e_279_0.png)\n\n## 工作原理...\n\n我们将构成 GUI 一部分的硬编码字符串拆解到它们各自的独立模块中。为此，我们创建了一个类，并在类的\
  \ `__init__()` 方法中，根据传入的语言参数来选择我们的 GUI 将显示哪种语言。\n\n这样是可行的。\n\n我们可以通过将国际化的字符串分离到单独的文件中，例如\
  \ XML 或其他格式，来进一步模块化我们的代码。我们也可以从 MySQL 数据库中读取它们。\n\n这是一种关注点分离的编码方法，而这正是 OOP 编程的核心。\n\
  \n## 一次性更改整个 GUI 语言\n\n在本节中，我们将一次性更改所有 GUI 显示名称，方法是将之前所有硬编码的英文字符串重构到一个单独的 Python\
