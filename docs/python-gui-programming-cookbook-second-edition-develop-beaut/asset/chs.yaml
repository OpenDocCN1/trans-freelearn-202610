  from site import addsitedir\nfrom os import getcwd, chdir, pardir\nwhile True:\n\
  \    curFull = getcwd()\n    curDir = curFull.split('\\\\')[-1]\n    if 'Ch11_Code'\
  \ == curDir:\n        addsitedir(curFull)\n        addsitedir(curFull + 'Folder1\\\
  Folder2\\Folder3')\n        break\n    chdir(pardir)\npprint(path)\n```\n\n在我们导入\
  \ clickMe 函数的模块中，我们不再需要指定完整的文件夹路径。我们可以直接导入模块及其函数：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_410_0.png)\n\
  \n我们必须显式导入 __init__ 才能使此代码正常工作。\n\n当我们现在运行我们的 GUI 代码时，我们得到与之前相同的窗口，但我们已删除了对 Eclipse\
  \ PYTHONPATH 变量的依赖。\n\n现在，我们可以成功地在 Eclipse PyDev 插件之外运行相同的代码：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_411_0.png)\n\
  \n我们的代码变得更 Pythonic 了。\n\n# 如何工作...\n\n在本教程中，我们从嵌套在文件夹结构中的模块导入了一个函数。\n\n我们看到可以使用\
  \ __init__.py 模块将文件夹结构添加到 Python 搜索路径。我们通过首先向 __init__.py 模块添加代码，然后显式导入 __init__.py\
  \ 模块来实现这一点。\n\n在一个循环中，我们搜索目录结构直到找到我们正在寻找的根文件夹。\n\n然后我们获取此文件夹的完整路径并附加三个文件夹。我们没有对整个搜索路径进行硬编码。我们只将已知的文件夹附加到我们的模块所在的位置。\n\
  \n我们添加到 __init__.py 模块的代码使我们能够在 Eclipse 内部以及从命令行成功运行代码。\n\n使用纯 Python 通常是最好的方法。\n\
  \n# 混合瀑布式和 OOP 编码\n\nPython 是一种面向对象编程语言，但并不总是使用 OOP 有意义。对于简单的脚本任务，传统的瀑布式编码风格仍然是合适的。\n\
  \n在本教程中，我们将创建一个新的 GUI，混合使用瀑布式编码风格和更现代的 OOP 编码风格。\n\n我们将创建一个 OOP 风格的类，当我们在使用瀑布式风格创建的\
  \ Python GUI 中将鼠标悬停在小部件上时，该类将显示工具提示。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_412_0.png)\n\
  \n> 瀑布式和瀑布式编码风格是相同的。这意味着我们必须在物理上将代码放在代码之上，然后才能从下面的代码中调用它。在这种范式中，代码在执行时 literally\
  \ 从程序顶部落到程序底部。\n\n## 准备工作\n\n在本教程中，我们将使用 `tkinter` 创建一个 GUI，这与我们在本书第一章中创建的 GUI 类似。\n\
  \n## 如何操作...\n\n在 Python 中，我们可以通过使用 `self` 命名约定将其变成方法，将函数绑定到类。这真的是 Python 的一个很棒的能力，它使我们能够创建可理解且可维护的大型系统。\n\
  \n有时，当我们只编写短脚本时，OOP 没有意义，因为我们发现自己在很多变量前加上 `self` 命名约定，而代码变得不必要地庞大，而实际上不需要这样。\n\n\
  让我们首先使用 `tkinter` 创建一个 Python GUI，并以瀑布式风格编码。\n\n以下代码 `GUI_FallDown.py` 创建了 GUI：\n\
  \n```python\n#========================\n# imports\n#========================\nimport\
  \ tkinter as tk\nfrom tkinter import ttk\nfrom tkinter import messagebox\n```\n\n\
  \n\n\n\n```python\n#====================\n# Create instance\n#====================\n\
  win = tk.Tk()\n\n#====================\n# Add a title\n#====================\nwin.title(\"\
  Python GUI\")\n\n#============================\n# Disable resizing the GUI\n#============================\n\
  win.resizable(0, 0)\n\n#====================================================================\n\
  # Adding a LabelFrame, Textbox (Entry) and Combobox\n#====================================================================\n\
  lFrame = ttk.LabelFrame(win, text=\"Python GUI Programming Cookbook\")\nlFrame.grid(column=0,\
  \ row=0, sticky='WE', padx=10, pady=10)\n\n#====================================================================\n\
  # Labels\n#====================================================================\n\
  ttk.Label(lFrame, text=\"Enter a name:\").grid(column=0, row=0)\nttk.Label(lFrame,\
  \ text=\"Choose a number:\").grid(column=1, row=0, sticky=tk.W)\n\n#====================================================================\n\
  # Buttons click command\n#====================================================================\n\
  def clickMe(name, number):\n    messagebox.showinfo('Information Message Box', 'Hello\
  \ ' + name +\n                        ', your number is: ' + number)\n\n#====================================================================\n\
  # Creating several controls in a loop\n#====================================================================\n\
  names       = ['name0', 'name1', 'name2']\nnameEntries = ['nameEntry0', 'nameEntry1',\
  \ 'nameEntry2']\n\nnumbers       = ['number0', 'number1', 'number2']\nnumberEntries\
  \ = ['numberEntry0', 'numberEntry1', 'numberEntry2']\n\nbuttons = []\n\nfor idx\
  \ in range(3):\n    names[idx] = tk.StringVar()\n```\n\n```python\nnameEntries[idx]\
  \ = ttk.Entry(lFrame, width=12, textvariable=names[idx])\nnameEntries[idx].grid(column=0,\
  \ row=idx+1)\nnameEntries[idx].delete(0, ttk.END)\nnameEntries[idx].insert(0, '<name>')\n\
  \nnumbers[idx] = tk.StringVar()\nnumberEntries[idx] = ttk.Combobox(lFrame, width=14,\n\
  \                                  textvariable=numbers[idx])\nnumberEntries[idx]['values']\
  \ = (1+idx, 2+idx, 4+idx, 42+idx, 100+idx)\nnumberEntries[idx].grid(column=1, row=idx+1)\n\
  numberEntries[idx].current(0)\n\nbutton = ttk.Button(lFrame, text=\"Click Me \"\
  \ + str(idx+1),\n                    command=lambda idx=idx: clickMe(names[idx].get(),\n\
  \                    numbers[idx].get()))\nbutton.grid(column=2, row=idx+1, sticky=tk.W)\n\
  buttons.append(button)\n\n#====================\n# Start GUI\n#====================\n\
  win.mainloop()\n```\n\n当我们运行这段代码时，会得到如下所示的 GUI：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_414_0.png)\n\
  \n我们可以通过添加工具提示（tooltip）来改进我们的 Python GUI。最好的做法是将创建工具提示功能的代码与 GUI 本身隔离开来。\n\n具体做法是创建一个独立的类，它包含工具提示功能，然后在创建\
  \ GUI 的同一个 Python 模块中创建这个类的实例。\n\n使用 Python 时，我们无需将 `ToolTip` 类放在单独的模块中。可以把它放在过程式代码的上方，然后在类代码的下方调用它。\n\
  \n代码如下所示：\n\n```python\n#====================\n# imports\n#====================\n\
  import tkinter as tk\nfrom tkinter import ttk\nfrom tkinter import messagebox\n\n\
  #-------------------------------------------------------------------------------\n\
  class ToolTip(object):\n    def __init__(self, widget):\n        self.widget = widget\n\
  \        self.tipwindow = None\n        self.id = None\n        self.x = self.y\
  \ = 0\n\n#-------------------------------------------------------------------------------\n\
  def createToolTip(widget, text):\n    toolTip = ToolTip(widget)\n    def enter(event):\
  \ toolTip.showtip(text)\n    def leave(event): toolTip.hidetip()\n    widget.bind('<Enter>',\
  \ enter)\n    widget.bind('<Leave>', leave)\n\n#-------------------------------------------------------------------------------\n\
  # further down the module we call the createToolTip function\n#-------------------------------------------------------------------------------\n\
  \nfor idx in range(3):\n    names[idx] = tk.StringVar()\n    nameEntries[idx] =\
  \ ttk.Entry(lFrame, width=12, textvariable=names[idx])\n    nameEntries[idx].grid(column=0,\
  \ row=idx+1)\n    nameEntries[idx].delete(0, tk.END)\n    nameEntries[idx].insert(0,\
  \ '<name>')\n\n    numbers[idx] = tk.StringVar()\n    numberEntries[idx] = ttk.Combobox(lFrame,\
  \ width=14,\n                                      textvariable=numbers[idx])\n\
  \    numberEntries[idx]['values'] = (1+idx, 2+idx, 4+idx, 42+idx, 100+idx)\n   \
  \ numberEntries[idx].grid(column=1, row=idx+1)\n    numberEntries[idx].current(0)\n\
  \n    button = ttk.Button(lFrame, text=\"Click Me \" + str(idx+1),\n           \
  \             command=lambda idx=idx: clickMe(names[idx].get(),\n```\n\n```python\n\
  numbers[idx].get()))\nbutton.grid(column=2, row=idx+1, sticky=tk.W)\nbuttons.append(button)\n\
  \n#--------------------------------------------------\n# Add Tooltips to more widgets\n\
  createToolTip(nameEntries[idx], 'This is an Entry widget.')\ncreateToolTip(numberEntries[idx],\
  \ 'This is a DropDown widget.')\ncreateToolTip(buttons[idx], 'This is a Button widget.')\n\
  #--------------------------------------------------\n```\n\n运行代码后，当鼠标悬停在控件上时，就会显示出工具提示：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_416_0.png)\n\n## 工作原理\n\n在本示例中，我们以过程式的方式创建了一个\
  \ Python GUI，随后又在模块顶部添加了一个类。\n\n我们可以非常轻松地在同一个 Python 模块中混合使用过程式编程和面向对象编程。\n\n##\
  \ 使用代码命名约定\n\n本书第一版中的最初几个示例并没有采用结构化的代码命名约定。本示例将向你展示遵循代码命名方案的价值，因为它能帮助我们找到要扩展的代码，同时也能提醒我们程序的设计。\n\
  \n## 准备工作\n\n在本示例中，我们将查看本书第一版第一章中的 Python 模块名称，并将它们与更好的命名约定进行比较。\n\n## 操作步骤\n\n\
  在本书的第一章中，我们创建了第一个 Python GUI。我们通过递增的序号来区分不同的代码模块名称，以此改进我们的 GUI。\n\n以下截图来自本书的第一版。\n\
  \n它看起来是这样的：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_417_0.png)\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_419_0.png)\n\
  \n> 将 PRODUCT 一词替换为你当前正在开发的产品名称。\n\n整个应用程序就是一个 GUI。所有部分都是相互连接的。`DEBUG.py` 模块仅用于调试我们的代码。与其他所有模块相比，调用\
  \ GUI 的主函数名称采用了相反的命名方式。它以 `Gui` 开头，并以 `.pyw` 扩展名结尾。\n\n它是唯一一个带有这种扩展名的 Python 模块。\n\
  \n根据这一命名约定，如果你对 Python 足够熟悉，就会明白：要运行这个 GUI，你必须双击 `Gui_PRODUCT.pyw` 模块。\n\n所有其他 Python\
  \ 模块都包含为 GUI 提供功能以及执行业务逻辑（以实现该 GUI 所要达成的目的）的代码。\n\n## 工作原理…\n\nPython 代码模块的命名约定对于保持工作效率和记住我们最初的设计非常有帮助。当我们需要调试和修复缺陷或添加新功能时，它们是首先应该查看的资源。\n\
  \n按数字递增模块名称并不是很有意义，最终还会浪费开发时间。\n\n另一方面，Python 变量的命名则更加自由。Python 会自动推断类型，因此我们不必指定某个变量将是\
  \ `<list>` 类型（它可能不是，或者在后续代码中可能变成其他类型）。\n\n命名变量的一个好方法是让它们具有描述性，同时也不要过度缩写。\n\n如果我们希望表明某个变量设计为\
  \ `<list>` 类型，那么使用完整的单词 `list` 比 `lst` 更直观。\n\n`number` 和 `num` 也是同样的道理。\n\n虽然为变量取非常具有描述性的名称是个好主意，但有时名称会变得过长。在\
  \ Apple 的 Objective-C 语言中，一些变量和函数名称就很极端：\n\n```text\nthisIsAMethodThatDoesThisAndThatAndAlsoThatIfYouPassInNIntegers:1:2:3\n\
  ```\n\n在命名变量、方法和函数时，请运用常识。\n\n## 何时不应使用 OOP\n\nPython 内置了面向对象编程能力，但同时我们也可以编写无需使用\
  \ OOP 的脚本。对于某些任务，OOP 并不可取。\n\n本示例将向我们展示何时不应使用 OOP。\n\n## 准备工作\n\n在本示例中，我们将创建一个与前面示例类似的\
  \ Python GUI，并比较 OOP 代码与非 OOP 编程方式之间的差异。\n\n\n\n\n\n## 如何操作...\n\n让我们首先使用 OOP 方法创建一个新的\
  \ GUI。以下代码将创建显示的 GUI，代码如下：\n\n```\nGUI_Not_OOP.py\n\nimport tkinter as tk\nfrom\
  \ tkinter import ttk\nfrom tkinter import scrolledtext\nfrom tkinter import Menu\n\
  \nclass OOP():\n    def __init__(self):\n        self.win = tk.Tk()\n        self.win.title(\"\
  Python GUI\")\n        self.createWidgets()\n\ndef createWidgets(self):\n    tabControl\
  \ = ttk.Notebook(self.win)\n    tab1 = ttk.Frame(tabControl)\n    tabControl.add(tab1,\
  \ text='Tab 1')\n    tabControl.pack(expand=1, fill=\"both\")\n    self.monty =\
  \ ttk.LabelFrame(tab1, text=' Mighty Python ')\n    self.monty.grid(column=0, row=0,\
  \ padx=8, pady=4)\n\n    ttk.Label(self.monty, text=\"Enter a name:\").grid(column=0,\
  \ row=0, sticky='W')\n\n    self.name = tk.StringVar()\n    nameEntered = ttk.Entry(self.monty,\
  \ width=12, textvariable=self.name)\n    nameEntered.grid(column=0, row=1, sticky='W')\n\
  \n    self.action = ttk.Button(self.monty, text=\"Click Me!\")\n    self.action.grid(column=2,\
  \ row=1)\n\n    ttk.Label(self.monty, text=\"Choose a number:\").grid(column=1,\
  \ row=0)\n    number = tk.StringVar()\n    numberChosen = ttk.Combobox(self.monty,\
  \ width=12, textvariable=number)\n    numberChosen['values'] = (42)\n    numberChosen.grid(column=1,\
  \ row=1)\n    numberChosen.current(0)\n\n    scrolW = 30; scrolH = 3\n    self.scr\
  \ = scrolledtext.ScrolledText(self.monty, width=scrolW, height=scrolH, wrap=tk.WORD)\n\
  ```\n\n```\n```python\nself.scr.grid(column=0, row=3, sticky='WE', columnspan=3)\n\
  \nmenuBar = Menu(tab1)\nself.win.config(menu=menuBar)\nfileMenu = Menu(menuBar,\
  \ tearoff=0)\nmenuBar.add_cascade(label=\"File\", menu=fileMenu)\nhelpMenu = Menu(menuBar,\
  \ tearoff=0)\nmenuBar.add_cascade(label=\"Help\", menu=helpMenu)\n\nnameEntered.focus()\n\
  #====================\noop = OOP()\noop.win.mainloop()\n```\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_422_0.png)\n\
  \n我们可以通过稍微重构代码而不使用 OOP 方法来实现相同的 GUI。首先，我们删除 OOP 类及其 `__init__` 方法。\n\n接下来，我们将所有方法向左移动并删除\
  \ `self` 类引用，这会将它们变成非绑定函数。\n\n我们还删除了之前代码中可能存在的任何其他 `self` 引用。然后，我们将 `createWidgets`\
  \ 函数调用移动到函数声明点下方。我们将其放置在 `mainloop` 调用正上方。\n\n最后，我们实现了相同的 GUI，但没有使用 OOP。\n\n重构后的代码如下所示：\n\
  \n```\n```python\nimport tkinter as tk\nfrom tkinter import ttk\nfrom tkinter import\
  \ scrolledtext\n```\n```\n\n```\nfrom tkinter import Menu\n\ndef createWidgets():\n\
  \    tabControl = ttk.Notebook(win)\n    tab1 = ttk.Frame(tabControl)\n    tabControl.add(tab1,\
  \ text='Tab 1')\n    tabControl.pack(expand=1, fill=\"both\")\n    monty = ttk.LabelFrame(tab1,\
  \ text=' Mighty Python ')\n    monty.grid(column=0, row=0, padx=8, pady=4)\n\n \
  \   ttk.Label(monty, text=\"Enter a name:\").grid(column=0, row=0, sticky='W')\n\
  \n    name = tk.StringVar()\n    nameEntered = ttk.Entry(monty, width=12, textvariable=name)\n\
  \    nameEntered.grid(column=0, row=1, sticky='W')\n\n    action = ttk.Button(monty,\
  \ text=\"Click Me!\")\n    action.grid(column=2, row=1)\n\n    ttk.Label(monty,\
  \ text=\"Choose a number:\").grid(column=1, row=0)\n    number = tk.StringVar()\n\
  \    numberChosen = ttk.Combobox(monty, width=12, textvariable=number)\n    numberChosen['values']\
  \ = (42)\n    numberChosen.grid(column=1, row=1)\n    numberChosen.current(0)\n\n\
  \    scrolW = 30; scrolH = 3\n    scr = scrolledtext.ScrolledText(monty, width=scrolW,\
  \ height=scrolH, wrap=tk.WORD)\n    scr.grid(column=0, row=3, sticky='WE', columnspan=3)\n\
  \n    menuBar = Menu(tab1)\n    win.config(menu=menuBar)\n    fileMenu = Menu(menuBar,\
  \ tearoff=0)\n    menuBar.add_cascade(label=\"File\", menu=fileMenu)\n    helpMenu\
  \ = Menu(menuBar, tearoff=0)\n    menuBar.add_cascade(label=\"Help\", menu=helpMenu)\n\
  \n    nameEntered.focus()\n#===================\nwin = tk.Tk()\nwin.title(\"Python\
  \ GUI\")\ncreateWidgets()\nwin.mainloop()\n```\n\n## 其工作原理...\n\nPython 使我们能够在有意义时使用\
  \ OOP。其他语言如 Java 和 C# 强制我们始终使用 OOP 方法进行编码。在本教程中，我们探索了一个不适合使用 OOP 的情况。\n\n如果代码库增长，OOP\
  \ 方法会更具可扩展性，但如果确定只需要这段代码，则无需使用 OOP。\n\n## 如何成功使用设计模式\n\n在本教程中，我们将通过使用工厂设计模式为 Python\
  \ GUI 创建小部件。在之前的教程中，我们要么手动逐个创建小部件，要么在循环中动态创建。使用工厂设计模式，我们将使用工厂来创建小部件。\n\n### 准备工作\n\
  \n我们将创建一个 Python GUI，其中有三个按钮，每个按钮具有不同的样式。\n\n## 如何操作...\n\n在 Python GUI 模块顶部，导入语句下方，我们创建了几个类：\n\
  \n```\nimport tkinter as tk\nfrom tkinter import ttk\nfrom tkinter import scrolledtext\n\
  from tkinter import Menu\n\nclass ButtonFactory():\n    def createButton(self, type_):\n\
  \        return buttonTypes[type_]()\n\nclass ButtonBase():\n    relief  ='flat'\n\
  \    foreground ='white'\n    def getButtonConfig(self):\n        return self.relief,\
  \ self.foreground\n```\n\n```\nclass ButtonRidge(ButtonBase):\n    relief  ='ridge'\n\
  \    foreground ='red'\n\nclass ButtonSunken(ButtonBase):\n    relief  ='sunken'\n\
  \    foreground ='blue'\n\nclass ButtonGroove(ButtonBase):\n    relief  ='groove'\n\
  \    foreground ='green'\n\nbuttonTypes = [ButtonRidge, ButtonSunken, ButtonGroove]\n\
  \nclass OOP():\n    def __init__(self):\n        self.win = tk.Tk()\n        self.win.title(\"\
  Python GUI\")\n        self.createWidgets()\n```\n\n我们创建一个基类，不同的按钮样式类从它继承，并且每个类都覆盖\
  \ relief 和 foreground 配置属性。所有子类都从该基类继承 getButtonConfig 方法。该方法返回一个元组。\n\n我们还创建了一个按钮工厂类和一个保存按钮子类名称的列表。我们将该列表命名为\
  \ buttonTypes，因为我们的工厂将创建不同类型的按钮。\n\n在模块的更下方，我们使用相同的 buttonTypes 列表创建按钮小部件：\n\n```\n\
  def createButtons(self):\n\n    factory = ButtonFactory()\n\n    # Button 1\n  \
  \  rel = factory.createButton(0).getButtonConfig()[0]\n    fg  = factory.createButton(0).getButtonConfig()[1]\n\
  \    action = tk.Button(self.monty, text=\"Button \"+str(0+1),\n               \
  \        relief=rel, foreground=fg)\n    action.grid(column=0, row=1)\n\n    # Button\
  \ 2\n    rel = factory.createButton(1).getButtonConfig()[0]\n    fg  = factory.createButton(1).getButtonConfig()[1]\n\
  \    action = tk.Button(self.monty, text=\"Button \"+str(1+1),\n               \
  \        relief=rel, foreground=fg)\n```\n\n我们可以看到，我们的 Python GUI 工厂确实创建了不同的按钮，每个按钮具有不同的样式。它们在文本颜色和\
  \ `relief` 属性上有所不同。\n\n## 其工作原理...\n\n在本教程中，我们使用工厂设计模式创建了具有不同样式的多个小部件。我们可以轻松使用此设计模式创建整个\
  \ GUI。\n\n设计模式是我们软件开发工具箱中非常令人兴奋的工具。\n\n## 避免复杂性\n\n在本教程中，我们将扩展我们的 Python GUI 并学习处理软件开发工作日益增长的复杂性的方法。\n\
  \n我们的同事和客户喜欢我们在 Python 中创建的 GUI，并要求添加越来越多的功能。\n\n这会增加复杂性，并可能破坏我们最初的良好设计。\n\n###\
  \ 准备工作\n\n我们将创建一个新的 Python GUI，类似于之前的教程中的 GUI，并以小部件的形式向其添加许多功能。\n\n## 如何操作...\n\n\
  我们将从一个具有两个选项卡的 Python GUI 开始，其外观如下。运行 GUI_Complexity_start.py 会得到以下结果：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_428_0.png)\n\
  \n我们收到的第一个新功能请求是为 Tab 1 添加清除 scrolledtext 小部件的功能。\n\n很容易。我们只需在 Tab 1 中添加另一个按钮：\n\
  \n```\n# Adding another Button\nself.action = ttk.Button(self.monty, text=\"Clear\
  \ Text\",\ncommand=self.clearScrol)\nself.action.grid(column=2, row=2)\n```\n\n\
  我们还必须创建回调方法以添加所需的功能，我们在类的顶部、在创建小部件的方法之外定义它：\n\n```\n# Button callback\ndef clickMe(self):\n\
  \    self.action.configure(text='Hello ' + self.name.get())\n\n# Button callback\
  \ Clear Text\ndef clearScrol(self):\n    self.scr.delete('1.0', tk.END)\n```\n\n\
  \n\n现在，我们的 GUI 有了一个新按钮，点击它时，我们会清除 `ScrolledText` 小部件的文本。运行 `GUI_Complexity_start_add_button.py`\
  \ 会得到这个新按钮：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_429_0.png)\n\n为了添加此功能，我们必须在同一个\
  \ Python 模块的两个地方添加代码。\n\n我们在 `createWidgets` 方法中插入了新按钮（未显示），然后创建了一个新的回调方法，我们的新按钮在被点击时会调用它。我们将此代码放在第一个按钮的回调下方。\n\
  \n我们的下一个功能请求是添加更多功能。业务逻辑封装在另一个 Python 模块中。我们通过向 **Tab 1** 添加三个更多按钮来调用此新功能。我们使用循环来执行此操作：\n\
  \n```\n```python\n# Adding more Feature Buttons\nfor idx in range(3):\n    b = ttk.Button(self.monty,\
  \ text=\"Feature\" + str(idx+1))\n    b.grid(column=idx, row=4)\n```\n```\n\n运行后，我们的\
  \ GUI 现在看起来像这样\n\n```\nGUI_Complexity_start_add_three_more_buttons.py:\n```\n\n\
  ![](img/986b0dbf3f539f4f3baa82bd3003f04e_430_0.png)\n\n接下来，我们的客户要求更多功能，我们使用相同的方法。我们的\
  \ GUI 现在如下所示：\n\n```\nGUI_Complexity_start_add_three_more_buttons_add_more.py\n\
  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_430_1.png)\n\n> 这还不算太糟糕。当我们为另外 50\
  \ 个新功能收到新功能请求时，我们开始怀疑我们的方法是否仍然是最好的方法...\n\n管理 GUI 必须处理的不断增加的复杂性的一种方法是添加选项卡。通过添加更多选项卡并将相关功能放入各自的选项卡中，我们可以控制复杂性并使我们的\
  \ GUI 更直观。\n\n以下是代码 `GUI_Complexity_end_tab3.py`，它创建了我们的新 **Tab 3**：\n\n```\n```python\n\
  # Tab Control 3  ---------------------------------------\n        tab3 = ttk.Frame(tabControl)\
  \          # Add a tab\n        tabControl.add(tab3, text='Tab 3')     # Make tab\
