  \    def on_draw(self):\n        # Clear the current GL Window\n        self.clear()\n\
  \n        # Push Matrix onto stack\n        glPushMatrix()\n```\n```\n\n```\n```python\n\
  glRotatef(self.xRotation, 1, 0, 0)\nglRotatef(self.yRotation, 0, 1, 0)\n\n# Draw\
