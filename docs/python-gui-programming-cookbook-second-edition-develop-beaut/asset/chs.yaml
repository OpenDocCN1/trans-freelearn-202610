  root.update()\nroot.deiconify()\nroot.mainloop()\n```\n\n## 如何为图表添加图例\n\n一旦我们开始绘制多条数据点线，事情可能会变得有些不清楚。因此，通过为图形添加图例，我们可以分辨哪些数据是什么，以及它们的实际含义。\n\
  \n我们不必选择不同的颜色来表示不同的数据。`Matplotlib` 会自动为每条数据点线分配不同的颜色。\n\n我们只需创建图表并为其添加图例即可。\n\n\
  ### 准备工作\n\n在本指南中，我们将改进上一个指南 *在图表上放置标签* 中的图表。我们将只绘制一个图表。\n\n### 操作步骤...\n\n首先，我们将在同一图表上绘制更多数据线，然后为图表添加图例。\n\
  \n我们将通过修改上一个教程中的代码来实现这一点：\n\nMatplotlib_chart_with_legend.py\n\n```\nfrom matplotlib.figure\
  \ import Figure\nfrom matplotlib.backends.backend_tkagg import FigureCanvasTkAgg\n\
  import tkinter as tk\n#---------------------------------------------\nfig = Figure(figsize=(12,\
  \ 5), facecolor='white')\n#---------------------------------------------\naxis =\
  \ fig.add_subplot(111)                         # 1 row, 1 column\n\nxValues = [1,2,3,4]\n\
  yValues0 = [6,7.5,8,7.5]\nyValues1 = [5.5,6.5,8,6]\nyValues2 = [6.5,7,8,7]\n\nt0,\
  \ = axis.plot(xValues, yValues0)\nt1, = axis.plot(xValues, yValues1)\nt2, = axis.plot(xValues,\
  \ yValues2)\n```\n\n```\naxis.set_ylabel('Vertical Label')\naxis.set_xlabel('Horizontal\
  \ Label')\n\naxis.grid()\n\nfig.legend((t0, t1, t2), ('First line', 'Second line',\
  \ 'Third line'), 'upper right')\n\n#--------------------------------------------------------------------------\n\
  def _destroyWindow():\n    root.quit()\n    root.destroy()\n#--------------------------------------------------------------------------\n\
  root = tk.Tk()\nroot.withdraw()\nroot.protocol('WM_DELETE_WINDOW', _destroyWindow)\n\
  #--------------------------------------------------------------------------\ncanvas\
  \ = FigureCanvasTkAgg(fig, master=root)\ncanvas._tkcanvas.pack(side=tk.TOP, fill=tk.BOTH,\
  \ expand=1)\n#--------------------------------------------------------------------------\n\
  root.update()\nroot.deiconify()\nroot.mainloop()\n```\n\n运行修改后的代码将创建以下图表，其右上角有一个图例：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_173_0.png)\n\n在本指南中，我们只绘制一个图形，这是通过更改\
  \ fig.add_subplot(111) 来实现的。我们还通过 figsize 属性稍微修改了图形的大小。\n\n接下来，我们创建三个包含待绘制值的 Python\
  \ 列表。绘制数据时，我们将绘图的引用保存在局部变量中。\n\n我们通过传入一个包含三个绘图引用的元组、另一个包含随后显示在图例中的字符串的元组来创建图例，并通过第三个参数设置图例在图表中的位置。\n\
  \nMatplotlib 的默认设置会给所绘制的线条分配一种颜色方案。\n\n我们可以通过在绘制每个坐标轴时设置一个属性，轻松地将默认颜色设置更改为我们偏好的颜色。\n\
  \n我们通过使用 color 属性并为其分配一个可用的颜色值来实现这一点：\n\nMatplotlib_chart_with_legend.py\n\n```\n\
  \    t0, = axis.plot(xValues, yValues0, color = 'purple')\n    t1, = axis.plot(xValues,\
  \ yValues1, color = 'red')\n    t2, = axis.plot(xValues, yValues2, color = 'blue')\n\
  ```\n\n请注意，t0、t1 和 t2 变量赋值后的逗号并不是错误。它是创建图例所必需的。\n\n每个变量后的逗号会将列表转换为元组。如果我们省略它，图例将不会显示。\n\
  \n代码仍然可以运行，只是没有预期的图例。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_174_0.png)\n\n\
  当我们移除 t0 赋值后的逗号时，会得到一个错误，并且第一条线不再出现在图中。图表和图例仍会创建，但图例中不会出现第一条线。\n\n\n\n\n\n# t0,\
  \ t1 和 t2 之后的逗号是必需的\nt0 = axis.plot(xValues, yValues0)      # no comma here\nt1,\
  \ = axis.plot(xValues, yValues1)\nt2, = axis.plot(xValues, yValues2)\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_175_0.png)\n\
  \n## How it works...\n\n我们通过在同一张图表中绘制三条数据线并为其添加图例来增强图表，以便区分这三条线所绘制的数据。\n\n## Scaling\
  \ charts\n\n在之前的配方中，在创建我们的第一个图表并对其进行增强时，我们对这些值如何被视觉表示的缩放进行了硬编码。\n\n对于我们使用的值来说，这对我们很有帮助，但我们经常从非常大的数据库中绘制图表。\n\
  \n根据数据的范围，我们对垂直 y 维度的硬编码值可能并不总是最佳解决方案，并且可能使我们难以在图表中看到线条。\n\n到目前为止，我们的图表已根据它们所视觉表示的数据自行调整。\n\
  \n虽然这是 Matplotlib 的实用特性，但这并不总是我们想要的。我们可以通过限制垂直 y 维度来限制图表的表示比例：\n\n```\nMatplotlib_labels_two_charts_scaled.py\n\
  \nyValues0 = [6,7.5,8,7.5]\nyValues1 = [5.5,6.5,50,6]        # one very high value\
  \ (50)\nyValues2 = [6.5,7,8,7]\n\naxis.set_ylim(5, 8)             # limit the vertical\
  \ display\n```\n\n`axis.set_ylim(5, 8)` 代码行现在将开始值限制为 5，将垂直显示的结束值限制为 8。\n\n现在，当我们创建图表时，之前的高值峰值不再产生之前的影响：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_177_0.png)\n\n## How it works...\n\n\
  我们增加了一个数据值，这导致了戏剧性的效果。通过设置图表的垂直和水平显示的限制，我们可以看到我们最感兴趣的数据。\n\n让我们修改代码以同时对 $x$ 和 $y$\
  \ 维度设置限制：\n\n```\nMatplotlib_labels_two_charts_scaled_dynamic.py\n\n    xValues\
  \   = [1,2,3,4]\n\n    yValues0  = [6,7.5,8,7.5]\n    yValues1  = [5.5,6.5,50,6]\
  \          # one very high value (50)\n    yValues2  = [6.5,7,8,7]\n\n    axis.set_ylim(0,\
  \ 8)                 # lower limit (0)\n    axis.set_xlim(0, 8)                \
  \ # use same limits for x\n```\n\n现在我们为 $x$ 和 $y$ 设置了相同的限制，我们的图表可能看起来更平衡。\n当我们运行修改后的代码时，我们得到以下结果：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_179_0.png)\n\n也许从 (0, 0) 开始并不是一个好主意...\n\
  \n我们真正想要做的是根据数据的范围动态调整图表，同时限制过高或过低的值。\n\n我们可以通过解析要表示在图表中的所有数据，同时设置一些明确的限制来实现这一点。\n\
  \n## Modify the code as follows:\n\n```\nMatplotlib_labels_two_charts_scaled_dynamic.py\n\
  \nxValues = [1,2,3,4]\n\nyValues0 = [6,7.5,8,7.5]\nyValues1 = [5.5,6.5,50,6]   \
  \             # one very high value (50)\nyValues2 = [6.5,7,8,7]\nyAll = [yValues0,\
  \ yValues1, yValues2]   # list of lists\n\n# flatten list of lists retrieving minimum\
  \ value\nminY = min([y for yValues in yAll for y in yValues])\n\nyUpperLimit = 20\n\
  # flatten list of lists retrieving max value within defined limit\nmaxY = max([y\
  \ for yValues in yAll for y in yValues if y <\n            yUpperLimit])\n\n# dynamic\
  \ limits\naxis.set_ylim(minY, maxY)\naxis.set_xlim(min(xValues), max(xValues))\n\
  \nt0, = axis.plot(xValues, yValues0)\nt1, = axis.plot(xValues, yValues1)\nt2, =\
  \ axis.plot(xValues, yValues2)\n```\n\n运行代码后得到以下图表。我们动态调整了其 x 和 y 维度。请注意，y 维度现在从\
  \ 5.5 开始，而不是之前的 5.0。图表也不再从 (0, 0) 开始，为我们提供了关于数据的更有价值的信息：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_180_0.png)\n\
  \n我们为 y 维度数据创建了一个列表的列表，然后使用列表推导式包装到 Python 的 min() 和 max() 函数调用中。\n\n如果列表推导式看起来有点高级，它们本质上是一个非常压缩的循环。\n\
  \n它们还设计为比常规编程循环更快。\n\n在前面的 Python 代码中，我们创建了三个列表来保存要绘制的 y 维度数据。然后我们创建了另一个列表来保存这三个列表，从而创建了一个列表的列表，如下所示：\n\
  \n```\nyValues0 = [6,7.5,8,7.5]\nyValues1 = [5.5,6.5,50,6]        # one very high\
  \ value (50)\nyValues2 = [6.5,7,8,7]\nyAll = [yValues0, yValues1, yValues2]  # list\
  \ of lists\n```\n\n我们有兴趣获取所有 y 维度数据的最小值以及这三个列表中包含的最大值。\n\n我们可以通过 Python 列表推导式来实现这一点：\n\
  \n```\n# flatten list of lists retrieving minimum value\nminY = min([y for yValues\
  \ in yAll for y in yValues])\n```\n\n运行列表推导式后，minY 为 5.5。\n\n前一行代码是遍历三个列表中包含的所有数据的所有值并使用\
  \ Python min 关键字找到最小值的列表推导式。\n\n以完全相同的模式，我们找到要绘制的数据中包含的最大值。这次，我们还在列表推导式中设置了一个限制，该限制忽略所有高于我们指定的限制的值，如下所示：\n\
  \n```\nyUpperLimit = 20\n# flatten list of lists retrieving max value within defined\
  \ limit\nmaxY = max([y for yValues in yAll for y in yValues if y <\n           \
  \ yUpperLimit])\n```\n\n使用我们选择的限制运行前面的代码后，maxY 的值为 8（而不是 50）。\n\n我们根据预定义的条件对最大值应用了限制，选择\
  \ 20 作为图表中显示的最大值。\n\n对于 x 维度，我们只需在 Matplotlib 方法中调用 min() 和 max() 来动态缩放图表的限制。\n\n\
  ## How it works...\n\n在本配方中，我们创建了多个 Matplotlib 图表并调整了一些可用的属性。我们还使用核心 Python 动态控制图表的缩放。\n\
  \n当我们在 Windows 任务管理器中运行我们的 Python GUI 时，我们可以看到已启动了一个新的 `python.exe` 进程。当我们为我们的 Python\
  \ GUI 提供 `.pyw` 扩展名时，则创建的进程将是 `python.pyw`，正如在任务管理器中看到的那样。\n\n当创建进程时，进程会自动创建一个主线程来运行我们的应用程序。这称为单线程应用程序。\n\
  \n对于我们的 Python GUI，单线程应用程序会导致我们的 GUI 在我们调用较长时间运行的任务时冻结，例如点击一个按钮，该按钮有几秒钟的睡眠时间。为了保持我们的\
  \ GUI 响应，我们必须使用多线程，这就是本章将要研究的主题。我们也可以通过创建我们 Python GUI 的多个实例来创建多个进程，正如在任务管理器中看到的那样。\n\
  \n进程按设计彼此隔离并且不共享公共数据。为了在单独的进程之间进行通信，我们必须使用 **Inter Process Communication (IPC)**，这是一种高级技术。另一方面，线程确实共享公共数据、代码和文件，这使得同一进程内线程之间的通信比使用\
  \ IPC 时容易得多。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_184_0.png)\n\n> 关于线程的精彩解释可以在\
  \ `https://www.cs.uic.edu/~jbell/CourseNotes/OperatingSystems/4_Threads.html` 找到。\n\
  \n在本章中，我们将学习如何保持我们的 Python GUI 响应并防止其冻结。\n\n以下是本章的 Python 模块概述：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_185_0.png)\n\
  \n## How to create multiple threads\n\n我们将使用 Python 创建多个线程。这对于保持我们的 GUI 响应是必要的。\n\
  \n\n\n\n线程就像用纱线编织布料一样，没什么好害怕的。\n\n## 准备工作\n\n多个线程运行在同一个计算机进程的内存空间中。无需使用 IPC，它会让我们的代码变得复杂。在本节中，我们将通过使用线程来避免\
  \ IPC。\n\n## 如何实现…\n\n首先，我们将增大 `ScrolledText` 控件的大小。我们把 `scrol_w` 增加到 40，`scrol_h`\
  \ 增加到 10：\n\n```\n```python\n# Using a scrolled Text control\nscrol_w = 40; scrol_h\
  \ = 10                         # increase sizes\nself.scrol = scrolledtext.ScrolledText(mighty,\
  \ width=scrol_w,\n                                       height=scrol_h,\n     \
  \                                  wrap=tk.WORD)\nself.scrol.grid(column=0, row=3,\
  \ sticky='WE', columnspan=3)\n```\n```\n\n当我们运行生成的 GUI 时，Spinbox 控件相对于其上方 Entry\
  \ 控件是居中对齐的，看起来不太美观。我们将通过左对齐该控件来改变这一点。\n\n将 `sticky='W'` 添加到 `grid` 控件中，以左对齐 Spinbox\
  \ 控件：\n\n```\n```python\n# Adding a Spinbox widget\nself.spin = Spinbox(mighty,\
  \ values=(1, 2, 4, 42, 100), width=5,\n                   bd=9, command=self._spin)\n\
  self.spin.grid(column=0, row=2, sticky='W')             # align left\n```\n```\n\
  \nGUI 看起来还可以进一步改进，所以现在我们增加 Entry 控件的大小，以获得更均衡的 GUI 布局。\n\n将 `width` 增加到 24，如以下代码片段所示：\n\
