  \n之前，我们 GUI 显示的一串串文字遍布于我们的 Python 代码各处。\n\n以下是我们未经 I18N 时 GUI 的样子：\n\n```\nGUI_Refactored.py\n\
  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_281_0.png)\n\n每个控件的每一个字符串，包括 GUI\
