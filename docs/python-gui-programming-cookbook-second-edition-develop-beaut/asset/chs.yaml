  \n在上面的代码片段中，我们使用了模块级 `global`。很容易因遮蔽 `global` 而犯错，如下所示：\n\n```\nGUI_const_42_777.py\n\
  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_137_1.png)\n\n注意，即使我们使用相同的变量名，42\
  \ 也会变成 777。\n\n> Python 中没有编译器会在我们在局部函数中覆盖 `global` 变量时发出警告。这可能导致运行时调试困难。\n\n如果不使用\
  \ global 限定符（第 214 行），我们会得到一个错误。\n\n```\n213 def usingGlobal():\n214 #     global\
  \ GLOBAL_CONST\n215     print(GLOBAL_CONST)\n216     GLOBAL_CONST = 777\n217   \
  \  print(GLOBAL_CONST)\n218 \n219 \n220 # call function\n221 usingGlobal()\n222\
  \ \n<terminated> C:\\Eclipse_NEON_workspace\\2nd Edition Python GUI Programming\
