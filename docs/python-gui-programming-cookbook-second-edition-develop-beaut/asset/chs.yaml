  \n\n\n\n\n\n## 前言\n\n在本书第二版中，我们将使用 Python 编程语言探索图形用户界面（GUI）的美丽世界。我们将使用最新版本的 Python\
  \ 3。本版包含了第一版的所有配方。我们在第二版中添加了一些新的配方，您可能无法通过 Google 搜索轻松找到。我认为这些新配方对读者来说会很有用且有趣。\n\
  \n这是一本编程菜谱书。每章都是独立的，并解释了某种编程解决方案。我们将从非常简单开始，但在本书中我们将构建一个用 Python 3 编写的正在运行的应用程序。每个配方都会扩展构建此应用程序。我们将沿途与网络、队列、数据库、OpenGL\
  \ 图形库以及更多技术进行交互。我们将应用设计模式并使用最佳实践。\n\n本书假设读者对 Python 编程语言有一定经验，但这并不是成功使用本书的必要条件。如果您致力于成为一名\
  \ Python 程序员，本书也可以用作 Python 编程语言的入门。\n\n如果您是任何其他语言的经验丰富的开发人员，您将通过将使用 Python 编写 GUI\
  \ 添加到您的专业工具箱中而获得乐趣。准备好了吗？\n\n让我们开始我们的旅程…\n\n## 本书涵盖内容\n\n- 第 1 章，*创建 GUI 表单并添加控件*，解释了如何在\
  \ Python 中开发我们的第一个 GUI。我们将从构建可运行的 GUI 应用程序所需的最小代码开始。然后每个配方都会向 GUI 表单添加不同的控件。\n-\
  \ 第 2 章，*布局管理*，探讨了如何排列控件以创建我们的 Python GUI。网格布局管理器是我们将使用的内置于 tkinter 的最重要的布局工具之一。\n\
  - 第 3 章，*外观和感觉定制*，展示了如何创建良好的外观和感觉 GUI 的几个示例。在实践层面，我们将添加功能到我们在其中一个配方中创建的 Help | About\
  \ 菜单项。\n\n\n\n\n\n## 前言\n\n第4章“数据与类”讨论了如何保存GUI所显示的数据。我们将开始使用面向对象编程（OOP），以扩展Python的内置功能。\n\
  \n第5章“Matplotlib图表”讲解了如何创建美观的图表来可视化表示数据。根据数据源的格式，我们可以在同一图表中绘制一列或多列数据。\n\n第6章“线程与网络”讲解了如何使用线程、队列和网络连接来扩展Python\
  \ GUI的功能。这将向我们展示，GUI完全不受限于个人电脑的本地范围。\n\n第7章“通过GUI将数据存储到MySQL数据库”向我们展示了如何连接到MySQL数据库服务器。本章的第一个操作指南将演示如何安装免费的MySQL\
  \ Server社区版，在后续的操作指南中，我们将创建数据库、表，将数据加载到这些表中，并修改这些数据。我们还将从MySQL服务器中将数据读取回GUI中。\n\n\
  第8章“国际化与测试”展示了如何通过在不同语言的标签、按钮、选项卡和其他控件上显示文本，来实现GUI的国际化。我们将从简单的方式开始，然后探索如何在设计层面为GUI的国际化做好准备。我们还将探讨几种使用Python内置单元测试框架自动测试GUI的方法。\n\
  \n第9章“使用wxPython库扩展GUI”介绍了另一个当前未随Python一起发布的Python GUI工具包。它名为wxPython，我们将使用wxPython的Phoenix版本，该版本被设计为能与Python\
  \ 3良好协作。\n\n第10章“使用PyOpenGL和PyGLet创建惊艳的3D GUI”展示了如何通过赋予GUI真正的三维能力来对其进行改造。我们将使用两个Python第三方包。PyOpenGL是OpenGL标准的Python绑定，OpenGL是一个随所有主流操作系统内置的图形库。这使生成的控件具有原生外观和感觉。PyGLet是另一种类似的绑定，我们将在本章中进行探索。我们还将展示一些直接使用PyOpenGL库的代码。这是一种底层方法，可能会为感兴趣的读者打开一些大门。\n\
  \n第11章“最佳实践”探讨了各种最佳实践，这些实践可以帮助我们高效地构建GUI，并使其保持可维护性和可扩展性。最佳实践适用于任何优秀的代码，我们的GUI也不例外，同样需要设计和实施良好的软件实践。\n\
