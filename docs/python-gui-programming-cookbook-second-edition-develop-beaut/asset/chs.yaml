  \ 2。下面是一个示例，我们将其应用于所有重新定位到 Tab 2 的控件：\n\n```python\nchVarDis = tk.IntVar()\ncheck1\
  \ = tk.Checkbutton(mighty2, text=\"Disabled\", variable=chVarDis, state='disabled')\n\
  ```\n\n当我们运行代码时，我们的 GUI 现在看起来不同了。Tab 1 中的控件比以前少，当时它包含我们之前创建的所有控件：\n\n```text\nGUI_tabbed_all_widgets_both_tabs.py\n\
  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_89_0.png)\n\n## 布局管理\n\n我们现在可以单击\
  \ **Tab 2** 查看我们重新定位的控件：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_90_0.png)\n\
  \n单击重新定位的 `Radiobutton` 不再有任何效果，因此我们将更改它们的操作，将 text 属性从 `LabelFrame` 控件的标题重命名为 `Radiobuttons`\
  \ 显示的名称。当我们单击 **Gold** `Radiobutton` 时，我们不再将框架的背景设置为金色，而是替换 `LabelFrame` 的文本标题。Python\
  \ **The Snake** 现在变成了 **Gold**。\n\n```python\ndef radCall():\n    radSel = radVar.get()\n\
  \    if radSel == 0:\n        mighty2.configure(text='Blue')\n    elif radSel ==\
  \ 1:\n        mighty2.configure(text='Gold')\n    elif radSel == 2:\n        mighty2.configure(text='Red')\n\
  ```\n\n现在，选择任何一个 `RadioButton` 控件都会更改 `LabelFrame` 的名称：\n\n`GUI_tabbed_all_widgets_both_tabs_radio.py`\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_90_1.png)\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_91_0.png)\n\
  \n## 工作原理...\n\n创建第二个选项卡后，我们将最初位于 **Tab 1** 中的一些控件移动到了 **Tab 2**。添加选项卡是组织我们不断增长的\
  \ GUI 的另一种极好方法。这是处理 GUI 设计复杂性的一个非常好的方法。我们可以将控件按自然归属分组，并通过使用选项卡让用户远离杂乱。\n\n> 在 tkinter\
  \ 中，创建选项卡是通过 `Notebook` 控件完成的，该控件允许我们添加选项卡式控件。与许多其他控件一样，`tkinter` 笔记本控件带有我们可以使用和配置的附加属性。开始探索我们可用的\
  \ tkinter 控件附加功能的一个绝佳位置是官方网站：`https://docs.python.org/3.11/library/tkinter.ttk.html#notebook`。\n\
  \n## 使用网格布局管理器\n\n网格布局管理器是我们可用的最有用的布局工具之一。我们已经在前面的许多小节中使用过它，因为它非常强大。\n\n## 准备工作...\n\
  \n在本节中，我们将回顾网格布局管理器的一些技术。我们已经在使用它们，在这里我们将进一步探索。\n\n## 操作步骤...\n\n在本章中，我们创建了行和列，这确实是一种数据库方法的\
  \ GUI 设计（MS Excel 也是如此）。我们对前几行进行了硬编码，但随后我们忘记为下一行指定我们希望它所在的位置。\n\nTkinter 在我们没有注意到的情况下为我们填充了这一点。\n\
  \n以下是我们代码中的做法：\n\n```python\n# Using a scrolled Text control\nscrol_w = 30\nscrol_h\
  \ = 3\nscr = scrolledtext.ScrolledText(mighty, width=scrol_w, height=scrol_h, wrap=tk.WORD)\n\
  # scr.grid(column=0, row=2, sticky='WE', columnspan=3)\nscr.grid(column=0, sticky='WE',\
  \ columnspan=3)            # row not specified\n```\n\nTkinter 会自动在我们未指定特定行的位置添加缺失的行。我们可能没有意识到这一点。\n\
  \n我们将 Entry 控件放在第 1 行，然后忘记为 ScrolledText 控件指定行（我们通过 `scr` 变量引用它），然后添加了要放在第 3 行的\
  \ Radiobutton 控件。\n\n这样做效果很好，因为 tkinter 会自动为我们的 ScrolledText 控件递增行位置，使其使用下一个最大行号，即第\
  \ 2 行。\n\n查看我们的代码，而没有意识到我们忘记将 ScrolledText 控件显式定位到第 2 行，我们可能会认为那里什么都没有。\n\n因此，我们可能会尝试以下操作。如果我们将变量\
  \ `curRad` 设置为使用第 2 行，我们可能会得到一个令人不快的意外：\n\nGUI_grid_layout.py\n\n\n\n\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_93_0.png)\n\
  \n## 如何工作…\n\n注意我们的 `RadioButton(s)` 行突然出现在我们的 `ScrolledText` 控件中间！这绝对不是我们希望 GUI\
  \ 看起来的样子！\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_93_1.png)\n\n如果我们忘记显式指定行号，默认情况下\
  \ tkinter 将使用下一个可用的行。\n\n我们还使用了 `columnspan` 属性来确保我们的控件不会仅限于一列。以下是我们确保 `ScrolledText`\
  \ 控件跨越 GUI 所有列的方法：\n\n```python\n# Using a scrolled Text control\nscroll_w = 30\n\
  scroll_h = 3\nscr = scrolledtext.ScrolledText(mighty, width=scroll_w, height=scroll_h,\
  \ wrap=tk.WORD)\nscr.grid(column=0, row=2, sticky='WE', columnspan=3)          \
  \       # using columnspan\n```\n\n# 3\n"
- "# 外观与风格自定义\n\n在本章中，我们将使用 Python 3.6 及以上版本自定义我们的 GUI。我们将涵盖以下配方：\n\n- 创建消息框 – 信息、警告和错误\n\
  - 如何创建独立的消息框\n- 如何创建 tkinter 窗口表单的标题\n- 更改主根窗口的图标\n- 使用微调框控件\n- 控件的浮雕、下沉和凸起外观\n\
  - 使用 Python 创建工具提示\n- 向 GUI 添加进度条\n- 如何使用画布控件\n\n# 引言\n\n在本章中，我们将通过更改其部分属性来自定义 GUI\
  \ 中的一些控件。我们还将介绍 tkinter 为我们提供的几个新控件。\n\nCreating tooltips using Python 配方将创建一个 ToolTip\
  \ OOP 风格的类，它将成为我们迄今为止一直使用的单个 Python 模块的一部分。\n\n以下是本章 Python 模块的概述：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_96_0.png)\n\
  \n# 创建消息框 – 信息、警告和错误\n\n消息框是一个弹出窗口，向用户提供反馈。它可以是信息性的，提示潜在问题以及灾难性错误。\n\n使用 Python\
  \ 创建消息框非常容易。\n\n# 准备工作\n\n我们将向上一章 Creating tabbed widgets 配方中创建的 Help | About 菜单项添加功能。\n\
  \n代码来自 GUI_tabbed_all_widgets_both_tabs.py。大多数应用程序中点击 Help | About 菜单时对用户的典型反馈是信息性的。我们从此信息开始，然后改变设计模式以显示警告和错误。\n\
  \n# 如何操作…\n\n在导入语句所在的模块顶部添加以下代码行：\n\n```python\n#===================\n# imports\n\
  #===================\nimport tkinter as tk\nfrom tkinter import ttk\nfrom tkinter\
  \ import scrolledtext\nfrom tkinter import Menu\nfrom tkinter import messagebox\
  \ as msg\n```\n\n接下来，创建一个将显示消息框的回调函数。我们必须在将回调附加到菜单项的代码之上定位回调代码，因为这仍然是过程式而不是 OOP\
  \ 代码。\n\n在我们创建帮助菜单的行上方添加以下代码：\n\nGUI_message_box.py\n\n```python\n# Display a Message\
  \ Box\ndef _msgBox():\n    msg.showinfo('Python Message Info Box', 'A Python GUI\
  \ created using tkinter:\\nThe year is 2017.')\n# Add another Menu to the Menu Bar\
  \ and an item\nhelp_menu = Menu(menu_bar, tearoff=0)\nhelp_menu.add_command(label=\"\
  About\", command=_msgBox)  # display messagebox when clicked\nmenu_bar.add_cascade(label=\"\
  Help\", menu=help_menu)\n```\n\n点击 Help | About 现在会弹出以下窗口：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_98_0.png)\n\
  \n让我们将此代码转换为警告消息框弹出窗口。注释掉上一行并添加以下代码：\n\n```python\n# Display a Message Box\ndef\
  \ _msgBox():\n#     msg.showinfo('Python Message Info Box', 'A Python GUI created\
  \ using tkinter:'\n#                 '\\nThe year is 2017.')\n    msg.showwarning('Python\
  \ Message Warning Box', 'A Python GUI created using tkinter:'\n                \
  \    '\\n\\nWarning: There might be a bug in this code.')\n```\n\n运行前面的代码现在将导致以下稍作修改的消息框：\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_98_1.png)\n\n显示错误消息框很简单，通常会警告用户严重问题。如前一个代码片段所示，注释掉上一行并添加以下代码，如下所示：\n\
  \n```python\n# Display a Message Box\ndef _msgBox():\n#     msg.showinfo('Python\
  \ Message Info Box', 'A Python GUI created using tkinter:\\nThe year is 2017.')\n\
  #     msg.showwarning('Python Message Warning Box', 'A Python GUI created using\
  \ tkinter:'\n#                     '\\nWarning: There might be a bug in this code.')\n\
  \    msg.showerror('Python Message Error Box', 'A Python GUI created using tkinter:'\n\
  \                  '\\nError: Houston ~ we DO have a serious PROBLEM!')\n```\n\n\
  错误消息如下所示：\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_99_0.png)\n\n## 如何工作...\n\n\
  我们添加了另一个回调功能并将其作为委托附加以处理点击事件。现在，当我们点击 Help | About 菜单时，会发生一个动作。我们正在创建并显示最常见的弹出消息框对话框。它们是模态的，因此用户在点击\
  \ OK 按钮之前无法使用 GUI。\n\n在第一个示例中，我们显示一个信息框，可以通过其左侧的图标看到。接下来，我们创建警告和错误消息框，它们会自动更改与弹出窗口关联的图标。我们要做的就是指定要显示哪个消息框。\n\
  \n有不同的消息框会显示不止一个 OK 按钮，我们可以根据用户的选择编程我们的响应。\n\n以下是一个简单的示例，说明了此技术：\n\n```python\n\
  # Display a Message Box\ndef _msgBox():\n# msg.showinfo('Python Message Info Box',\
  \ 'A Python GUI created using tkinter:\\nThe year is 2017.')\n# msg.showwarning('Python\
  \ Message Warning Box', 'A Python GUI created using tkinter:\\nWarning: There might\
  \ be a bug in this code.')\n# msg.showerror('Python Message Error Box', 'A Python\
  \ GUI created using tkinter:\\nError: Houston ~ we DO have a serious PROBLEM!')\n\
  answer = msg.askyesnocancel(\"Python Message Multi Choice Box\", \"Are you sure\
  \ you really wish to do this?\")\nprint(answer)\n```\n\n运行此 GUI 代码会产生一个弹出窗口，其用户响应可用于根据此事件驱动\
  \ GUI 循环的答案进行分支，通过将其保存在 answer 变量中：\n\nGUI_message_box_yes_no_cancel.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_100_0.png)\n\
  \n使用 Eclipse 的控制台输出显示，点击 Yes 按钮会导致布尔值 True 被分配给 answer 变量：\n\n```text\nSearch Console\n\
  C:\\Eclipse_NEON_workspace\\2nd Edition Python GUI Programming Cookbook\\Ch03_Code\\\
  GUI_message_box_yes_no_cancel.py\nTrue\n```\n\n例如，我们可以使用以下代码：\n\n```python\nif answer\
  \ == True:\n    <do something>\n```\n\n点击 No 返回 False，Cancel 返回 None。\n\n# 如何创建独立的消息框\n\
  \n在本配方中，我们将把 tkinter 消息框创建为独立的顶级 GUI 窗口。\n\n你会首先注意到，通过这样做，我们最终会得到一个额外的窗口，因此我们将探索隐藏此窗口的方法。\n\
  \n在上一配方中，我们通过主 GUI 表单中的 Help | About 菜单调用 tkinter 消息框。\n\n那么，为什么我们希望创建独立的消息框呢？\n\
  \n一个原因是我们可能会自定义我们的消息框并在多个 GUI 中重用它们。无需将相同的代码复制并粘贴到我们设计的每个 Python GUI 中，我们可以将其从主\
  \ GUI 代码中提取出来。这可以创建一个小型可重用组件，我们随后可以将其导入到不同的 Python GUI 中。\n\n# 准备工作\n\n我们在上一配方 Creating\
  \ message boxes - information, warning, and error 中已经创建了消息框的标题。我们将不重用上一配方的代码，而是使用很少的\
  \ Python 代码构建一个新的 GUI。\n\n# 如何操作…\n\n我们可以创建简单的消息框，如下所示：\n\n```python\nfrom tkinter\
  \ import messagebox as msg\nmsg.showinfo('Python GUI created using tkinter:\\nThe\
  \ year is 2017')\n```\n\n\n\n这将产生以下两个窗口：\n\n```\nGUI_independent_msg.py\n```\n\n\
  ![](img/986b0dbf3f539f4f3baa82bd3003f04e_102_0.png)\n\n这看起来并非我们所期望的。现在，我们有两个窗口：一个是多余的，另一个则将文本显示成了标题。\n\
  \n哎呀！\n\n让我们现在来解决这个问题。我们可以修改 Python 代码，添加一个单引号或双引号，后面再跟一个逗号：\n\n```python\nfrom\
  \ tkinter import messagebox as msg\nmsg.showinfo('', 'Python GUI created using tkinter:\\\
  nThe year is 2017')\n```\n\n现在，我们没有标题了，但文本如预期那样显示在了弹出窗口中：\n\n```\nGUI_independent_msg_info.py\n\
  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_102_1.png)\n\n第一个参数是标题，第二个参数是弹出消息框中显示的文本。通过添加一对空的单引号或双引号，后面再跟一个逗号，我们就可以将文本从标题移到弹出消息框中。\n\
  \n我们仍然需要一个标题，而且肯定希望去掉这个多余的第二窗口。第二个窗口是由 Windows 事件循环引起的。我们可以通过抑制它来摆脱它。\n\n添加以下代码：\n\
  \n```python\nfrom tkinter import messagebox as msg\nfrom tkinter import Tk\nroot\
  \ = Tk()\nroot.withdraw()\nmsg.showinfo('', 'Python GUI created using tkinter:\\\
  nThe year is 2017')\n```\n\n现在，我们只剩一个窗口了。`withdraw()` 函数会移除我们不想让其四处漂浮的调试窗口：\n\n\
  ```\nGUI_independent_msg_one_window.py\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_103_0.png)\n\
  \n为了添加标题，我们只需在空的第一个参数中放入某个字符串即可。\n\n## 外观与感觉定制\n\n例如，考虑以下代码片段：\n\n```python\nfrom\
  \ tkinter import messagebox as msg\nfrom tkinter import Tk\nroot = Tk()\nroot.withdraw()\n\
  msg.showinfo('This is a Title', 'Python GUI created using tkinter:\\nThe year is\
  \ 2017')\n```\n\n现在，我们的对话框有了标题，如下面的截图所示：\n\n```\nGUI_independent_msg_one_window_title.py\n\
  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_104_0.png)\n\n## 工作原理……\n\n我们向消息框的\
  \ tkinter 构造函数传递更多参数，以便为窗口窗体添加标题，并在消息框中显示文本，而不是将其显示为标题。这是因为我们所传递参数的位置。如果我们省略空的单引号或双引号，那么消息框控件就会将第一个参数位置作为标题，而不是要在消息框内显示的文本。通过传递一个空引号后跟一个逗号，我们改变了消息框显示我们传递给函数的文本的位置。\n\
  \n我们通过在根窗口上调用 `withdraw()` 方法来抑制 tkinter 消息框控件自动创建的第二个弹出窗口。\n\n## 如何创建 tkinter 窗口窗体的标题\n\
  \n更改 tkinter 主根窗口标题的原理与我们在上一个教程中讨论的“如何创建独立消息框”相同。我们只需将一个字符串作为第一个参数传递给控件的构造函数即可。\n\
  \n## 准备\n\n我们不创建弹出对话框窗口，而是创建主根窗口并为其指定标题。\n\n## 操作步骤……\n\n以下代码创建主窗口并为其添加标题。我们在前面的教程中已经做过类似操作，例如在第\
  \ 2 章“布局管理”的“创建选项卡控件”中。这里我们只关注 GUI 的这一方面：\n\n```python\nimport tkinter as tk\nwin\
  \ = tk.Tk()      # Create instance\nwin.title(\"Python GUI\")  # Add a title\n```\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_105_0.png)\n\n## 工作原理……\n\n这通过使用 tkinter\
  \ 内置的 `title` 属性来设置主根窗口的标题。在我们创建 `Tk()` 实例后，就可以使用所有 tkinter 内置属性来自定义我们的 GUI。\n\n\
  ## 更改主根窗口的图标\n\n自定义 GUI 的一种方式是给它一个不同于 tkinter 默认图标的图标。下面是我们如何做到这一点的。\n\n## 准备\n\n\
  我们正在改进第 2 章“布局管理”中“创建选项卡控件”教程中的 GUI。我们将使用一个随 Python 一同提供的图标，但您也可以使用任何您觉得有用的图标。请确保代码中包含了图标的完整路径，否则可能会出错。\n\
  \n## 操作步骤……\n\n在本示例中，我将从安装 Python 3.6 的目录中复制了图标到代码所在的同一个文件夹中。\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_106_0.png)\n\
  \n将以下代码放在主事件循环上方的某个位置：\n\n```python\n# Change the main window's icon\nwin.iconbitmap('pyc.ico')\n\
