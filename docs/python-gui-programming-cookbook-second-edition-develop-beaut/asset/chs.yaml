  \n## 工作原理……\n\n这是 tkinter 随附的另一个属性，它随 Python 3.6 及更高版本一起提供。我们使用 `iconbitmap` 属性，通过传入一个图标的相对路径来更改主根窗口窗体的图标。这会覆盖\
  \ tkinter 的默认图标，将其替换为我们选择的图标。\n\n## 使用微调框控件\n\n在本教程中，我们将使用一个 Spinbox 控件，并将键盘上的回车键绑定到我们某个控件上。\n\
  \n## 准备\n\n我们将使用带选项卡的 GUI，并在 ScrolledText 控件上方添加一个 Spinbox 控件。这只需要我们将 ScrolledText\
  \ 的行数值加一，然后将新的 Spinbox 控件插入到 Entry 控件上方的那一行。\n\n## 操作步骤……\n\n首先，我们添加 Spinbox 控件。将以下代码放在\
  \ ScrolledText 控件上方：\n\n```python\n# Adding a Spinbox widget\nspin = Spinbox(mighty,\
