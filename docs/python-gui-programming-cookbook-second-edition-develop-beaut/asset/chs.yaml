  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_109_0.png)\n\n在这里，我们通过创建回调函数并将其链接到控件来为控件添加功能。\n\
  \n这会将 Spinbox 的选择打印到 ScrolledText 中，并同时打印到标准输出。变量 `scrol` 是我们对 ScrolledText 控件的引用：\n\
  \n```python\n# Spinbox callback\ndef _spin():\n    value = spin.get()\n    print(value)\n\
  \    scrol.insert(tk.INSERT, value + '\\n')\n\nspin = Spinbox(mighty, from_=0, to=10,\
  \ width=5, bd=8,\n                command=_spin)\n```\n\n运行上述代码会得到以下 GUI：\n\n```\n\
  GUI_spinbox_small_bd_scrol.py\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_110_0.png)\n\
  \n除了使用范围，我们也可以指定一组值：\n\n```python\n# Adding a Spinbox widget using a set of values\n\
  spin = Spinbox(mighty, values=(1, 2, 4, 42, 100), width=5, bd=8,\n             \
  \  command=spin)\nspin.grid(column=0, row=2)\n```\n\n这将创建以下 GUI 输出：\n\n```\nGUI_spinbox_small_bd_scrol_values.py\n\
  ```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_110_1.png)\n\n## 工作原理……\n\n请注意，在第一张截图中，我们新的\
  \ Spinbox 控件默认宽度为 20，这将该列中所有控件的列宽都推了出去。这不是我们想要的。\n\n我们给控件指定了从 0 到 10 的范围。\n\n在第二张截图中，我们减小了\
  \ Spinbox 控件的宽度，使其在列中居中对齐。\n\n在第三张截图中，我们添加了 Spinbox 的 `borderwidth` 属性，这使整个 Spinbox\
  \ 看起来不再扁平，而是具有了三维效果。\n\n在第四张截图中，我们添加了一个回调函数，用于在 ScrolledText 控件中显示所选数字，并将其打印到标准输出流中。我们添加了\
  \ `\\n` 以便在新行上打印。注意默认值不会被打印。只有当我们点击控件时，回调函数才会被调用。通过将默认值 0 向下箭头点击，我们可以打印出 0 值。\n\n\
  最后，我们将可用值限制为一组硬编码的值。这也可以从数据源（例如文本或 XML 文件）中读取。\n\n## 控件的浮雕、凹陷和凸起外观\n\n我们可以通过使用一个属性来控制\
  \ Spinbox 控件的外观，使其呈现不同的凹陷或凸起格式。\n\n## 准备\n\n我们将再添加一个 Spinbox 控件，以演示可用的控件外观，使用 Spinbox\
  \ 控件的 `relief` 属性。\n\n\n\n\n## 如何操作...\n\n首先，让我们增大边框宽度，以区分第二个 Spinbox 和第一个 Spinbox：\n\
  \n```python\n# Adding a second Spinbox widget\nspin = Spinbox(mighty, values=(0,\
  \ 50, 100), width=5, bd=20,\n    command=_spin)\nspin.grid(column=1, row=2)\n```\n\
  \n这将生成以下 GUI 输出：\n\nGUI_spinbox_two_sunken.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_112_0.png)\n\
  \n我们前面的两个 Spinbox 控件具有相同的浮雕样式。唯一的区别是，位于第一个 Spinbox 右侧的新控件具有大得多的边框宽度。\n\n在我们的代码中，我们没有指定使用哪个浮雕属性，因此浮雕默认为\
  \ `tk.SUNKEN`。\n\n我们将 tkinter 导入为 `tk`。这就是为什么我们可以将浮雕属性称为 `tk.SUNKEN`。\n\n以下是可设置的浮雕属性选项：\n\
  \n| `tk.SUNKEN` | `tk.RAISED` | `tk.FLAT` | `tk.GROOVE` | `tk.RIDGE` |\n|---|---|---|---|---|\n\
  \n通过为浮雕属性分配不同的可用选项，我们可以为此控件创建不同的外观。\n\n将 `tk.RIDGE` 浮雕分配给控件，并将边框宽度减小到与我们的第一个 `Spinbox`\
  \ 控件相同的值，将生成以下 GUI：\n\n`GUI_spinbox_two_ridge.py`\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_113_0.png)\n\
  \n## 工作原理...\n\n首先，我们创建了第二个 `Spinbox`，它位于第二列（索引 == 1）。它默认为 `SUNKEN`，因此看起来与我们的第一个\
  \ `Spinbox` 相似。我们通过增大第二个控件（右侧的那个）的边框宽度来区分这两个控件。\n\n接下来，我们显式设置了 Spinbox 控件的浮雕属性。我们将边框宽度设为与第一个\
  \ Spinbox 相同，因为通过赋予它不同的浮雕，差异变得可见，而无需更改任何其他属性。\n\n以下是不同选项的示例：\n\n```python\n# Adding\
  \ a second Spinbox widget displaying its relief options with larger borderline\n\
  # uncomment each next code line to see the different effects\n# spin = Spinbox(mighty,\
  \ values=(0, 50, 100), width=5, bd=20, command=_spin)      # default value is: tk.SUNKEN\n\
  # spin = Spinbox(mighty, values=(0, 50, 100), width=5, bd=20, command=_spin, relief=tk.FLAT)\n\
  # spin = Spinbox(mighty, values=(0, 50, 100), width=5, bd=20, command=_spin, relief=tk.RAISED)\n\
  # spin = Spinbox(mighty, values=(0, 50, 100), width=5, bd=20, command=_spin, relief=tk.SUNKEN)\
  \ # default\n# spin = Spinbox(mighty, values=(0, 50, 100), width=5, bd=20, command=_spin,\
  \ relief=tk.GROOVE)\n# spin = Spinbox(mighty, values=(0, 50, 100), width=5, bd=20,\
  \ command=_spin, relief=tk.RIDGE)\n```\n\n## 使用 Python 创建工具提示\n\n本食谱将向我们展示如何创建工具提示。当用户将鼠标悬停在控件上时，将以工具提示的形式显示附加信息。\n\
  \n我们将把这些附加信息编码到 GUI 中。\n\n## 准备工作\n\n我们将为 GUI 添加更多有用的功能。令人惊讶的是，向控件添加工具提示本应很简单，但并没有我们希望的那么简单。\n\
  \n为了实现这一预期功能，我们将工具提示代码放入其自身的 OOP 类中。\n\n## 如何操作...\n\n在 import 语句的正下方添加以下类：\n\n\
  ```python\nclass ToolTip(object):\n    def __init__(self, widget):\n        self.widget\
  \ = widget\n        self.tip_window = None\n\n    def show_tip(self, tip_text):\n\
  \        \"Display text in a tooltip window\"\n        if self.tip_window or not\
  \ tip_text:\n            return\n        x, y, cx, cy = self.widget.bbox(\"insert\"\
  )      # get size of widget\n        x = x + self.widget.winfo_rootx() + 25    \
  \      # calculate to display tooltip\n        y = y + cy + self.widget.winfo_rooty()\
  \ + 25     # below and to the right\n        self.tip_window = tw = tk.Toplevel(self.widget)\
  \ # create new tooltip window\n        tw.wm_overrideredirect(True)            \
  \        # remove all Window Manager (wm) decorations\n        # tw.wm_overrideredirect(False)\
  \                  # uncomment to see the effect\n        tw.wm_geometry(\"+%d+%d\"\
  \ % (x, y))                # create window size\n\n        label = tk.Label(tw,\
  \ text=tip_text, justify=tk.LEFT,\n                         background=\"#ffffe0\"\
  , relief=tk.SOLID, borderwidth=1,\n                         font=(\"tahoma\", \"\
  8\", \"normal\"))\n        label.pack(ipadx=1)\n\n    def hide_tip(self):\n    \
  \    tw = self.tip_window\n        self.tip_window = None\n        if tw:\n    \
  \        tw.destroy()\n\ndef create_ToolTip(widget, text):\n    tooltip = ToolTip(widget)\
  \      # create instance of class\n    def enter(event):\n        tooltip.show_tip(text)\n\
  \    def leave(event):\n        tooltip.hide_tip()\n    widget.bind('<Enter>', enter)\
  \  # bind mouse events\n    widget.bind('<Leave>', leave)\n```\n\n在面向对象编程（OOP）方法中，我们在\
  \ Python 模块中创建一个新类。Python 允许我们在同一个 Python 模块中放置多个类，也允许我们在同一模块中混合搭配类和常规函数。\n\n前面的代码正是这样做的。\n\
  \nToolTip 类是一个 Python 类，要使用它，我们必须实例化它。\n\n如果你不熟悉 OOP 编程，实例化一个对象来创建类的实例听起来可能相当枯燥。\n\
  \n其原理非常简单，与通过 `def` 语句创建 Python 函数，然后在代码中稍后实际调用该函数非常相似。\n\n以非常类似的方式，我们首先创建类的蓝图，然后通过在类名后面添加括号将其赋给变量，如下所示：\n\
  \n```python\nclass AClass():\n    pass\ninstance_of_a_class = AClass()\nprint(instance_of_a_class)\n\
  ```\n\n前面的代码打印出一个内存地址，并显示我们的变量现在有了对该类实例的引用。\n\nOOP 的妙处在于，我们可以创建同一个类的许多实例。\n\n在我们的工具提示代码中，我们声明了一个\
  \ Python 类，并明确让它继承自 `object`，这是所有 Python 类的基础。我们也可以省略它，就像我们在 AClass 代码示例中所做的那样，因为它是所有\
  \ Python 类的默认父类。\n\n在 ToolTip 类中所有必要的工具提示创建代码之后，我们切换到非 OOP 的 Python 编程，在类下方创建了一个函数。\n\
  \n我们定义了 `create_ToolTip()` 函数，它期望传入一个 GUI 控件作为参数，这样当我们将鼠标悬停在该控件上时，就可以显示工具提示。\n\n\
  `create_ToolTip()` 函数实际上为每个调用它的控件创建了一个新的 ToolTip 类实例。\n\n我们可以为 Spinbox 控件添加工具提示，如下所示：\n\
  \n```python\n# Add a Tooltip\ncreate_ToolTip(spin, 'This is a Spin control')\n```\n\
  \n我们可以以完全相同的方式为所有其他 GUI 控件做同样的事情。只需传入我们希望显示工具提示的控件的引用，并显示一些额外信息。对于我们的 ScrolledText\
  \ 控件，我们让 `scrol` 变量指向它，因此我们将其传给创建工具提示的函数：\n\n```python\n# Using a scrolled Text\
  \ control\nscrol_w = 30\nscrol_h = 3\nscrol = scrolledtext.ScrolledText(mighty,\
  \ width=scrol_w, height=scrol_h, wrap=tk.WORD)\nscrol.grid(column=0, row=3, sticky='WE',\
  \ columnspan=3)\n\n# Add a Tooltip to the ScrolledText widget\ncreate_ToolTip(scrol,\
  \ 'This is a ScrolledText widget')\n```\n\n## 工作原理...\n\n这是本书中 OOP 编程的开端。这可能看起来有点高级，但别担心；我们会解释一切，而且它确实有效。\n\
  \n考虑在创建 Spinbox 的代码正下方添加以下代码：\n\n```python\n# Add a Tooltip\ncreate_ToolTip(spin,\
  \ 'This is a Spin control.')\n```\n\n现在，当我们将鼠标悬停在 Spinbox 控件上时，会得到一个工具提示，向用户提供附加信息：\n\
  \nGUI_tooltip.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_117_0.png)\n\n我们调用创建\
  \ ToolTip 的函数，然后传入控件的引用以及我们希望鼠标悬停在控件上时显示的文本。\n\n本书剩余食谱将在有意义时使用 OOP。在这里，我们展示了可能最简单的\
  \ OOP 示例。默认情况下，我们创建的每个 Python 类都继承自 object 基类。Python 作为一门真正实用的编程语言，简化了类创建过程。\n\n\
  我们可以编写以下语法：\n\n```python\nclass ToolTip(object):\n    pass\n```\n\n我们也可以省略默认基类来简化它：\n\
  \n```python\nclass ToolTip():\n    pass\n```\n\n类似地，我们可以继承并扩展任何 tkinter 类。\n\n##\
  \ 向 GUI 添加进度条\n\n在本食谱中，我们将向 GUI 添加一个进度条。添加 `ttk.Progressbar` 非常容易，我们将演示如何启动和停止进度条。本食谱还将向你展示如何延迟进度条的停止以及如何循环运行它。\n\
  \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_118_0.png)\n\n进度条通常用于显示长期运行进程的当前状态。\n\
  \n## 准备工作\n\n我们将把进度条添加到我们在上一食谱（使用 Python 创建工具提示）中开发的 GUI 的 Tab 2 中。\n\n\n\n\n\n\
  ## 如何操作...\n\n首先，我们在标签页 2 的 LabelFrame 中添加了四个按钮，替换了之前存在的标签。我们将 LabelFrame 的 text\
  \ 属性设置为 ProgressBar。\n\n然后我们在标签页 2 的所有其他小部件下方放置一个 ttk.Progressbar 小部件，并将这个新小部件与其它小部件对齐。\n\
  \n我们的 GUI 现在如下所示：\n\nGUI_progressbar.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_119_0.png)\n\
  \n我们将四个新按钮中的每一个都连接到一个新的回调函数，并将其分配给它们的 command 属性：\n\n```\n# Add Buttons for Progressbar\
  \ commands\nttk.Button(buttons_frame, text=\" Run Progressbar \", command=run_progressbar).grid(column=0,\
  \ row=0, sticky='W')\nttk.Button(buttons_frame, text=\" Start Progressbar \", command=start_progressbar).grid(column=0,\
  \ row=1, sticky='W')\nttk.Button(buttons_frame, text=\" Stop immediately \", command=stop_progressbar).grid(column=0,\
  \ row=2, sticky='W')\nttk.Button(buttons_frame, text=\" Stop after second \", command=progressbar_stop_after).grid(column=0,\
  \ row=3, sticky='W')\n```\n\n点击 Run Progressbar 按钮将使 Progressbar 从左向右运行，然后 Progressbar\
  \ 将在那里停止，并且绿色条会消失。\n\n以下是代码：\n\n```\n# Add a Progressbar to Tab 2\nprogress_bar\
  \ = ttk.Progressbar(tab2, orient='horizontal', length=286, mode='determinate')\n\
  progress_bar.grid(column=0, row=3, pady=2)\n\n# update progressbar in callback loop\n\
  def run_progressbar():\n    progress_bar[\"maximum\"] = 100\n    for i in range(101):\n\
  \        sleep(0.05)\n        progress_bar[\"value\"] = i    # increment progressbar\n\
  \        progress_bar.update()        # have to call update() in loop\nprogress_bar[\"\
  value\"] = 0           # reset/clear progressbar\n```\n\n点击 Start Progressbar 按钮将启动\
  \ Progressbar。Progressbar 将运行到结束，然后它将从左侧重新开始，在无限循环中：\n\n```\ndef start_progressbar():\n\
  \    progress_bar.start()\n```\n\n为了停止我们 progressbar 小部件的这种无限循环，我们只需创建一个新的回调函数并将其分配给我们的按钮之一：\n\
  \n```\ndef stop_progressbar():\n    progress_bar.stop()\n```\n\n一旦我们点击 Stop Progressbar\
  \ 按钮，我们的 Progressbar 将停止并将自身重置到开始位置，使其不可见。我们不再在 Progressbar 内部看到绿色条。\n\n如果我们点击 Run\
  \ Progressbar 按钮然后点击 Stop Progressbar 按钮，条的进度会暂时停止，但随后循环将运行到完成，ProgressBar 也会完成。\n\
  \n我们也可以延迟正在运行的 ProgressBar 的停止。虽然我们可能会期望 sleep 语句能奏效，但它不起作用。相反，我们必须使用 tkinter 的\
  \ after 函数，如下所示：\n\n```\ndef progressbar_stop_after(wait_ms=1000):\n    win.after(wait_ms,\
  \ progress_bar.stop)\n```\n\n这样编码将会在我们点击此按钮后，在 wait_ms 变量指定的时间（以毫秒为单位）后停止正在运行的 ProgressBar。\n\
  \n## 其工作原理...\n\n我们可以指定一个最大值并在循环中使用该值，结合 sleep 语句。\n\n我们可以使用 ProgressBar 小部件内置的\
  \ start 和 stop 命令来启动和停止 ProgressBar 的进度。\n\n我们还可以通过使用 tkinter 内置的 after 函数来延迟条中进度的停止。\n\
  \n我们通过在我们命名的主 GUI 窗口的引用上调用 after 函数来实现这一点，我们将其命名为 win。\n\n## 如何使用 canvas 小部件\n\n\
  本食谱展示了如何通过使用 tkinter canvas 小部件为我们的 GUI 添加戏剧性的颜色效果。\n\n## 准备工作\n\n我们将改进我们之前从 GUI_tooltip.py\
