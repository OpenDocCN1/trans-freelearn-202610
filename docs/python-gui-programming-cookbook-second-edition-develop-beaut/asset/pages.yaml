  md: '# 10


    # Creating Amazing 3D GUIs with PyOpenGL and PyGLet


    In this chapter, we will create amazing Python GUIs that display true three-dimensional
    images that can be rotated around themselves so that we can look at them from
    all sides. We will cover the following recipes:


    +   - PyOpenGL transforms our GUI

    +   - Our GUI in 3D!

    +   - Using bitmaps to make our GUI pretty

    +   - PyGLet transforms our GUI easier than PyOpenGL

    +   - Our GUI in amazing colors

    +   - OpenGL animation

    +   - Creating a slide show using tkinter


    # Introduction


    In this chapter, we will transform our GUI by giving it true three-dimensional
    capabilities. We will use two Python third-party packages. PyOpenGL is a Python
    binding to the OpenGL standard, which is a graphics library that comes built in
    with all major operating systems. This gives the resulting widgets a native look
    and feel.


    PyGLet is another Python binding to the OpenGL library, but it can also create
    GUI applications, which can make coding using PyGLet easier than using PyOpenGL.'
