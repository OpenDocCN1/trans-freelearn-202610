- pgno: 342
  md: "# Extending Our GUI with the wxPython Library\n\nWe modularize our GUI code\
    \ by breaking it into small methods, following Python OOP programming protocol,\
    \ which keeps our code manageable and understandable:\n\n```\n```python\n#-----------------------------------------------\n\
    def createWidgetsFrame(self):\n    self.panel = wx.Panel(self)\n    staticBox\
    \ = wx.StaticBox(self.panel, -1, \"Widgets Frame\")\n    self.statBoxSizerV =\
    \ wx.StaticBoxSizer(staticBox, wx.VERTICAL)\n#-----------------------------------------------\n\
    def layoutWidgets(self):\n    boxSizerV = wx.BoxSizer(wx.VERTICAL)\n    boxSizerV.Add(self.statBoxSizerV,\
    \ 1, wx.ALL)\n    self.panel.SetSizer(boxSizerV)\n    boxSizerV.SetSizeHints(self.panel)\n\
    #-----------------------------------------------\ndef addWidgets(self):\n    self.addCheckBoxes()\n\
    \    self.addRadioButtons()\n    self.addStaticBoxWithLabels()\n```\n```\n\n>\
    \ When using wxPython `StaticBox` widgets, in order to successfully lay them out,\
    \ we use a combination of `StaticBoxSizer` and a regular `BoxSizer`. The wxPython\
    \ `StaticBox` is very similar to the tkinter `LabelFrame` widget.\n\nEmbedding\
    \ a `StaticBox` within another `StaticBox` is straightforward in tkinter, but\
