  md: '![](img/986b0dbf3f539f4f3baa82bd3003f04e_91_0.png)


    # How it works...


    After creating a second tab, we moved some of the widgets that originally resided
    in **Tab 1** to **Tab 2**. Adding tabs is another excellent way to organize our
    ever-increasing GUI. This is a very nice way to handle the complexity in our GUI
    design. We can arrange widgets in groups, where they naturally belong and free
    our users from clutter by using tabs.


    > In tkinter, creating tabs is done via the `Notebook` widget, which is the tool
    that allows us to add tabbed controls. The `tkinter` notebook widget, like so
    many other widgets, comes with additional properties that we can use and configure.
    An excellent place to start exploring additional capabilities of the tkinter widgets
    at our disposal is the official website: `https://docs.python.org/3.11/library/tkinter.ttk.html#notebook`.


    # Using the grid layout manager


    The grid layout manager is one of the most useful layout tools at our disposal.
    We have already used it in many recipes because it is just so powerful.


    # Getting ready...


    In this recipe, we will review some of the techniques of the grid layout manager.
    We have already used them and here we will explore them further.'
