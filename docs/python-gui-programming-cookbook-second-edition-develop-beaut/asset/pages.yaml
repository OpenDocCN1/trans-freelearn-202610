    \nOne way to manage the ever-increasing complexity our GUI has to handle is by\
    \ adding tabs. By adding more tabs and placing related features into their own\
    \ tab, we get control of the complexity and make our GUI more intuitive.\n\nHere\
    \ is the code, `GUI_Complexity_end_tab3.py`, which creates our new **Tab 3**:\n\
    \n```\n```python\n# Tab Control 3  ---------------------------------------\n \
