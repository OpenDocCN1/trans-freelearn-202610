- pgno: 64
  md: '# There''s more…


    In a recipe later in this chapter, we will embed `LabelFrame` widgets within `LabelFrame`
    widgets, nesting them to control our GUI layout.


    # Using padding to add space around widgets


    Our GUI is being created nicely. Next, we will improve the visual aspects of our
    widgets by adding a little space around them, so they can breathe.


    # Getting ready


    While tkinter might have had a reputation for creating ugly GUIs, this has dramatically
    changed since version 8.5. You just have to know how to use the tools and techniques
    that are available. That''s what we will do next.


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_64_0.png)


    tkinter version 8.6 ships with Python 3.6.


    # How to do it…


    The procedural way of adding spacing around widgets is shown first, and then we
    will use a loop to achieve the same thing in a much better way.


    Our `LabelFrame` looks a bit tight as it blends into the main window towards the
    bottom. Let''s fix this now.


    Modify line 110 of the code snippet from `GUI_LabelFrame_column_one.py` in the
    previous recipe by adding `padx` and `pady`. You can also find the code in:


    `GUI_add_padding.py`


    ```

    buttons_frame.grid(column=0, row=7, padx=20, pady=40)

    ```'
  merge: -1
  img_proc: true
- pgno: 65
  md: "Now, our LabelFrame gets some breathing space:\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_65_0.png)\n\
    \n# How it works...\n\nIn tkinter, adding space horizontally and vertically is\
    \ done by using built-in properties named padx and pady. These can be used to\
    \ add space around many widgets, improving horizontal and vertical alignments,\
    \ respectively. We hardcoded 20 pixels of space to the left and right of LabelFrame,\
    \ and we added 40 pixels to the top and bottom of the frame. Now our LabelFrame\
    \ stands out better than it did before.\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_65_1.png)\n\
    \nThe preceding screenshot only shows the relevant change.\n\nWe can use a loop\
    \ to add space around the labels contained within LabelFrame:\n\nGUI_add_padding_loop.py\n\
    \n```\n113 # Place labels into the container element\n114 ttk.Label(buttons_frame,\
    \ text=\"Label1\").grid(column=0, row=0)\n115 ttk.Label(buttons_frame, text=\"\
    Label2\").grid(column=0, row=1)\n116 ttk.Label(buttons_frame, text=\"Label3\"\
    ).grid(column=0, row=2)\n117 \n118 for child in buttons_frame.winfo_children():\n\
    119     child.grid_configure(padx=8, pady=4)\n120 \n121 name_entered.focus() \
    \     # Place cursor into name Entry\n122 #===========================\n123 #\
    \ Start GUI\n124 #===========================\n125 win.mainloop()\n```"
  merge: -1
