    # Scaling charts


    In the previous recipes, while creating our first charts and enhancing them, we
    hardcoded the scaling of how those values are visually represented.


    While this served us well for the values we were using, we often plot charts from
    very large databases.


    Depending on the range of that data, our hardcoded values for the vertical y-dimension
    might not always be the best solution, and may make it hard to see the lines in
    our charts.'
