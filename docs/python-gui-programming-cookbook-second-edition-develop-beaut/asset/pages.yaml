    and setuptools yourself.


    This recipe will show how to successfully install Matplotlib using pip. We will
    be using the `.whl` extension for this installation, so this recipe will also
    show you how to install the wheel module.


    # # Getting ready


    First, let''s find out if you have the wheel module already installed. The wheel
    module is necessary to download and install Python packages that have the `.whl`
    extension.


    We can find out what modules we have currently installed using pip.'
