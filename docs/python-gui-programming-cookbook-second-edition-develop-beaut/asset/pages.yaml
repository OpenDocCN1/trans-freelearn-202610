    For the x-dimension, we simply called min() and max() in the Matplotlib method
    to scale the limits of the chart dynamically.


    # How it works...


    In this recipe, we have created several Matplotlib charts and adjusted some of
    the many available properties. We also used core Python to control the scaling
    of the charts dynamically.'
