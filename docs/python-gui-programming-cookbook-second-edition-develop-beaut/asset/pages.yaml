- pgno: 237
  md: 'If running the preceding code results in the following output printed to the
    console, then we are good:


    ```

    MySQL_connect.py


    <terminated> C:\Eclipse_NEON_workspace\2nd Edition Python GUI Programming Cookbook\Ch07_Code\MySQL_connect.py

    <_mysql.connection open to ''127.0.0.1'' at 605769b8>

    ```


    If you are not able to connect to the MySQL server via the *Command Line Client*
    or the Python *mysqlclient*, then something probably went wrong during the installation.
    If this is the case, try uninstalling, rebooting your PC, and then running the
    installation again.


    # How it works...


    In order to connect our GUI to a MySQL server, we need to be able to connect to
    the server with administrative privileges if we want to create our own database.
    If the database already exists, then we just need the authorization rights to
    connect, insert, update, and delete data. We will create a new database on a MySQL
    server in the next recipe.


    # Configuring the MySQL database connection


    In the previous recipe, we used the shortest way to connect to a MySQL server
    by hardcoding the credentials required for authentication into the `connection`
    method. While this is a fast approach for early development, we definitely do
    not want to expose our MySQL server credentials to anyone. Instead, we *grant*
    permission to access databases, tables, views, and related database commands to
    specific users.


    A much safer way to get authenticated by a MySQL server is by storing the credentials
    in a configuration file, which is what we will do in this recipe. We will use
    our configuration file to connect to the MySQL server and then create our own
    database on the MySQL server.


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_237_0.png)


    We will use this database in all of the following recipes.'
  merge: -1
  img_proc: true
- pgno: 238
  md: "# Getting ready\n\nAccess to a running MySQL server with administrator privileges\
    \ is required to run the code shown in this recipe.\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_238_0.png)\n\
    \n> The previous recipe shows how to install the free Community Edition of MySQL\
    \ Server. The administrator privileges will enable you to implement this recipe.\n\
    \n# How to do it…\n\nFirst, we create a dictionary in the same module of the GUI_MySQL_class.py\
    \ code:\n\n```\n```python\n# create dictionary to hold connection info\ndbConfig\
    \ = {\n    'user': <adminName>,       # use your admin name\n    'password': <adminPwd>,\
    \    # not the real password\n    'host': '127.0.0.1',       # IP address of localhost\n\
    }\n```\n```\n\nNext, in the connection method, we unpack the dictionary values.\
    \ Take a look at the following code snippet:\n\n```\n```python\nmysql.connect('user':\
    \ <adminName>, 'password': <adminPwd>, 'host':\n'127.0.0.1')\n```\n```\n\nInstead\
    \ of using the preceding snippet, we use (**dbConfig), which achieves the same\
    \ thing as the preceding one but is much shorter:\n\n```\n```python\nimport MySQLdb\
    \ as mysql\n# unpack dictionary credentials\nconn = mysql.connect(**dbConfig)\n\
    print(conn)\n```\n```\n\nThis results in the same successful connection to the\
    \ MySQL server, but the difference is that the connection method no longer exposes\
    \ any mission-critical information:"
  merge: -1
  img_proc: true
- pgno: 239
  md: "A database server is critical to your mission. You realize this once you have\
    \ lost your valuable data...and can't find any recent backup!\n\nMySQL_connect_with_dict.py\n\
    \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_239_0.png)\n\nNow, placing the same\
    \ username, password, database, and so on into a dictionary in the same Python\
    \ module does not eliminate the risk of having the credentials seen by anyone\
    \ perusing the code.\n\nIn order to increase database security, we first move\
    \ the dictionary into its own Python module. Let's call the new Python module\
    \ GuiDBConfig.py.\n\nWe then import this module and unpack the credentials as\
    \ we did before:\n\n```\nimport GuiDBConfig as guiConf\n# unpack dictionary credentials\n\
    conn = mysql.connect(**guiConf.dbConfig)\nprint(conn)\n```\n\nOnce we place this\
    \ module into a secure place, separated from the rest of the code, we have achieved\
    \ a better level of security for our MySQL data.\n\nNow that we know how to connect\
    \ to MySQL and have administrator privileges, we can create our own database by\
    \ issuing the following commands:\n\n```\nGUIDB = 'GuiDB'\n\n# unpack dictionary\
    \ credentials\nconn = mysql.connect(**guiConf.dbConfig)\n\ncursor = conn.cursor()\n\
    \ntry:\n    cursor.execute(\"CREATE DATABASE {}\n                    DEFAULT CHARACTER\
    \ SET 'utf8'\".format(GUIDB))\n```"
  merge: -1
  img_proc: true
- pgno: 240
  md: "```\nexcept mysql.Error as err:\n    print(\"Failed to create DB: {}\".format(err))\n\
    \nconn.close()\n```\n\nIn order to execute commands to MySQL, we create a cursor\
    \ object from the connection object.\n\nA cursor is usually a place in a specific\
    \ row in a database table, which we move up or down the table, but here, we use\
    \ it to create the database itself. We wrap the Python code into a try...except\
    \ block and use the built-in error codes of MySQL to tell us if anything went\
    \ wrong.\n\nWe can verify that this block works by executing the database-creating\
    \ code twice. The first time, it will create a new database in MySQL, and the\
    \ second time, it will print out an error message stating that this database already\
    \ exists:\n\nMySQL_create_DB.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_240_0.png)\n\
    \nWe can verify which databases exist by executing the following MySQL command\
    \ using the very same cursor object syntax. Instead of issuing the CREATE DATABASE\
    \ command we create a cursor and use it to execute the SHOW DATABASES command,\
    \ the result of which we fetch and print to the console output:\n\n```\nimport\
    \ MySQLdb as mysql\nimport GuiDBConfig as guiConf\n\n# unpack dictionary credentials\n\
    conn = mysql.connect(**guiConf.dbConfig)\n\ncursor = conn.cursor()\n\ncursor.execute(\"\
    SHOW DATABASES\")\nprint(cursor.fetchall())\n\nconn.close()\n```"
