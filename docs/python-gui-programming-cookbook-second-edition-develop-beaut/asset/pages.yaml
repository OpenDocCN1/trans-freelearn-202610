    \           col = colIdx\n            else:\n                col += 1\n      \
    \      if not idx % 3:\n                startRow += 1\n                col = 0\n\
    \n            b = ttk.Button(monty3, text=\"Feature \" + str(idx+1))\n       \
    \     b.grid(column=col, row=startRow)\n\n        # Add some space around each\
