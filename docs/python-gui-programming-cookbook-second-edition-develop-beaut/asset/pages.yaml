- pgno: 120
  md: "Clicking the Run Progressbar button will run the Progressbar from the left\
    \ to the right, then the Progressbar will stop there, and the green bar will disappear.\n\
    \nHere is the code:\n\n```\n# Add a Progressbar to Tab 2\nprogress_bar = ttk.Progressbar(tab2,\
    \ orient='horizontal', length=286, mode='determinate')\nprogress_bar.grid(column=0,\
    \ row=3, pady=2)\n\n# update progressbar in callback loop\ndef run_progressbar():\n\
    \    progress_bar[\"maximum\"] = 100\n    for i in range(101):\n        sleep(0.05)\n\
    \        progress_bar[\"value\"] = i    # increment progressbar\n        progress_bar.update()\
    \        # have to call update() in loop\nprogress_bar[\"value\"] = 0        \
    \   # reset/clear progressbar\n```\n\nClicking the Start Progressbar button will\
    \ start the Progressbar. The Progressbar will run to the end, and then it will\
    \ start all over from the left, in an endless loop:\n\n```\ndef start_progressbar():\n\
    \    progress_bar.start()\n```\n\nIn order to stop this endless loop of our progressbar\
    \ widget, we simply create another callback function and assign it to one of our\
    \ buttons:\n\n```\ndef stop_progressbar():\n    progress_bar.stop()\n```\n\nAs\
    \ soon as we click the Stop Progressbar button, our Progressbar will stop and\
    \ it will reset itself to the beginning, making it invisible. We no longer see\
    \ a green bar inside the Progressbar.\n\nIf we click the Run Progressbar button\
    \ and then click the Stop Progressbar button, the progress of the bar will temporarily\
    \ halt, but then the loop will run to completion and so will the ProgressBar."
  merge: -1
  img_proc: true
