- pgno: 61
  md: "# Arranging several labels within a label frame widget\n\nThe LabelFrame widget\
    \ allows us to design our GUI in an organized fashion. We are still using the\
    \ grid layout manager as our main layout design tool, but by using LabelFrame\
    \ widgets, we get much more control over our GUI design.\n\n# Getting ready\n\n\
    We will start adding more and more widgets to our GUI, and we will make the GUI\
    \ fully functional in the coming recipes. Here, we will start using the LabelFrame\
    \ widget. We will reuse the GUI from the recipe, Adding Several Widgets in a Loop\
    \ in Chapter 1, Creating the GUI Form and Adding Widgets.\n\n# How to do it...\n\
    \nAdd the following code just above the main event loop towards the bottom of\
    \ the Python module:\n\nGUI_LabelFrame_column_one.py\n\n```\n108 # Create a container\
    \ to hold labels\n109 buttons_frame = ttk.LabelFrame(win, text=' Labels in a Frame\
    \ ')\n110 buttons_frame.grid(column=0, row=7)\n111 # buttons_frame.grid(column=1,\
    \ row=7)                # now in col 1\n112 \n113 # Place labels into the container\
    \ element\n114 ttk.Label(buttons_frame, text=\"Label1\").grid(column=0, row=0,\
    \ sticky=tk.W)\n115 ttk.Label(buttons_frame, text=\"Label2\").grid(column=1, row=0,\
    \ sticky=tk.W)\n116 ttk.Label(buttons_frame, text=\"Label3\").grid(column=2, row=0,\
    \ sticky=tk.W)\n117 \n118 name_entered.focus()      # Place cursor into name Entry\n\
    119 #===================\n120 # Start GUI\n121 #===================\n122 win.mainloop()\n\
    ```"
  merge: -1
  img_proc: true
