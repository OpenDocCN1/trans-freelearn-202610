  md: '# # Matplotlib Charts


    In this chapter, we will create beautiful charts using Python 3.6 with the `Matplotlib`
    module. We will cover the following recipes:


    +   - Creating beautiful charts using `Matplotlib`

    +   - Installing `Matplotlib` using pip with whl extension

    +   - Creating our first chart

    +   - Placing labels on charts

    +   - How to give the chart a legend

    +   - Scaling charts

    +   - Adjusting the scale of charts dynamically


    # ## Introduction


    In this chapter, we will create beautiful charts that visually represent data.
    Depending on the format of the data source, we can plot one or more columns of
    data in the same chart.


    We will be using the Python `Matplotlib` module to create our charts.


    In order to create these graphical charts, we need to download additional Python
    modules, and there are several ways to install them.


    This chapter will explain how to download the `Matplotlib` Python module along
    with all other required Python modules and the ways to do this.


    After we install the required modules, we will then create our own Pythonic charts.'
