- pgno: 177
  md: 'So far, our charts have adjusted themselves according to the data they visually
    represent.


    While this is a practical feature of Matplotlib, this is not always what we want.
    We can restrict the scale of the chart being represented by limiting the vertical
    y-dimension:


    ```

    Matplotlib_labels_two_charts_scaled.py


    yValues0 = [6,7.5,8,7.5]

    yValues1 = [5.5,6.5,50,6]        # one very high value (50)

    yValues2 = [6.5,7,8,7]


    axis.set_ylim(5, 8)             # limit the vertical display

    ```


    The axis.set_ylim(5, 8) line of code now limits the beginning value to 5 and the
    ending value of the vertical display to 8.


    Now, when we create our chart, the high value peak no longer has the impact it
    had before:


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_177_0.png)


    # How it works...


    We increased one value in the data, which resulted in a dramatic effect. By setting
    limits to the vertical and horizontal displays of the chart, we can see the data
    we are most interested in.'
  merge: -1
  img_proc: true
