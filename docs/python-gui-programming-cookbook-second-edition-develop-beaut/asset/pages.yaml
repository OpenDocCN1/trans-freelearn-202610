- pgno: 299
  md: 'In the initializer of our new class, the passed-in GUI instance is saved under
    the name `self.oop` and used throughout this new Python class module.


    Running the refactored GUI code still works. We have only increased its readability
    and reduced the complexity of our code in preparation for further development
    work.


    # How it works...


    We have first improved the readability of our code by grouping the related import
    statements. We next broke out the callback methods into their own class and module,
    in order to further reduce the complexity of our code.


    We had already taken the same OOP approach by having the `ToolTip` class reside
    in its own module and by internationalizing all GUI strings in the previous recipes.
    In this recipe, we went one step further in refactoring by passing our own instance
    into the callback method''s class that our GUI relies upon. This enables us to
    use all of our GUI widgets.


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_299_0.png)


    Now that we better understand the value of a modular approach to software development,
    we will most likely start with this approach in our future software designs.


    # Do we need to test the GUI code?


    Testing our software is an important activity during the coding phase as well
    as when releasing service packs or bug fixes.


    There are different levels of testing. The first level is developer testing, which
    often starts with the compiler or interpreter not letting us run our buggy code,
    forcing us to test small parts of our code on the level of individual methods.


    This is the first level of defense.


    A second level of coding defensively is when our source code control system tells
    us about some conflicts to be resolved and does not let us check in our modified
    code.


    This is very useful and absolutely necessary when we work professionally in a
    team of developers. The source code control system is our friend and points out
    changes that have been committed to a particular branch or top-of-tree, either
    by ourselves or by our other developers, and tells us that our local version of
    the code is both outdated and has some conflicts that need to be resolved before
    we can submit our code into the repository.'
  merge: -1
  img_proc: true
- pgno: 300
  md: 'This part assumes you use a source control system to manage and store your
    code. Examples include git, mercurial, svn, and several others. Git is a very
    popular source control and it is free for a single user.


    A third level is the level of APIs where we encapsulate potential future changes
    to our code by only allowing interactions with our code via published interfaces.


    Another level of testing is integration testing, when half of the bridge we finally
    built meets the other half that the other development teams created and the two
    don''t meet at the same height (say, one half ended up two meters or yards higher
    than the other half...).


    Then, there is the end user testing. While we built what they specified, it is
    not really what they wanted.


    All of the above examples are valid reasons why we need to test our code both
    in the design and implementation stages.


    # Getting ready


    We will test the GUI we created in recent recipes and chapters. We will also show
    some simple examples of what can go wrong and why we need to keep testing our
    code and the code we call via APIs.


    # How to do it...


    While many experienced developers grew up sprinkling printf() statements all over
    their code while debugging, many developers in the 21st century are accustomed
    to modern IDE development environments that efficiently speed up development time.


    In this book, we are using the PyDev Python plugin for the Eclipse IDE.


    If you are just starting to use an IDE, such as Eclipse with PyDev, it might be
    a little bit overwhelming at first. The Python IDLE tool that ships with Python
    3.6 has a simpler debugger and you might wish to explore that first.


    Whenever something goes wrong in our code, we have to debug it. The first step
    of doing this is to set break points and then step through our code, line by line,
    or method by method.


    Stepping in and out of our code is a daily activity until the code runs smoothly.'
  merge: -1
  img_proc: true
- pgno: 301
  md: 'In Python GUI programming, one of the first things that can go wrong is missing
    out on importing the required modules or importing the existing modules.


    Here is a simple example:


    GUI.py with the import statement `# import tkinter as tk` commented out:


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_301_0.png)


    We are trying to create an instance of the `tkinter` class, but things don''t
    work as expected.


    Well, we simply forgot to import the module and alias it as `tk`, and we can fix
    this by adding a line of Python code above our class creation, where the import
    statements live:


    ```

    ```python

    #====================

    # imports

    #====================

    import tkinter as tk

    ```

    ```


    This is an example in which our development environment does the testing for us.
    We just have to do the debugging and code fixing.


    Another example more closely related to developer testing is when we code conditionals
    and, during our regular development, do not exercise all branches of logic.


    Using an example from Chapter 7, *Storing Data in our MySQL Database via our GUI*,
    let''s say we click on the **Get Quotes** button and this works, but we never
    clicked on the **Mody Quote** button. The first button click creates the desired
    result but the second throws an exception (because we had not yet implemented
    this code and probably forgot all about it):'
