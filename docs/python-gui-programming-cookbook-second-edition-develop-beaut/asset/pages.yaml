- pgno: 388
  md: "In the RenderScene() function, we now use double-buffering:\n\n```\ndef RenderScene():\
    \              # display callback function\n    glClear(GL_COLOR_BUFFER_BIT) \
    \     # clear window with color defined in SetupRC\n    #   R   G   B        \
    \          # set drawing color to Red\n    glColor3f(1.0, 0.0, 0.0)          #\
    \ functions expects 3 floats\n    glRectf(x1, y1, x1 + rect_size, y1 - rect_size)\
    \ # draw a filled rectangle with above color\n    \n    glutSwapBuffers()    \
    \             # flush and swap double buffers\n```\n\nWe have to slightly change\
    \ our main() to pass GLUT_DOUBLE into the glutInitDisplayMode() function:\n\n\
    ```\ndef main():\n    glutInit()\n    glutInitDisplayMode(GLUT_DOUBLE | GLUT_RGB)\
    \      # Double buffer\n    glutInitWindowSize(800, 600)                     \
    \ # window size\n    glutCreateWindow(b\"Bouncing Red Square\")          # Python\
    \ 3: bytes instead of string for Title\n    glutDisplayFunc(RenderScene)\n   \
    \ glutReshapeFunc(ChangeSize)\n    glutTimerFunc(33, TimerFunction, 1)\n    \n\
    \    SetupRC()\n    \n    glutMainLoop()\n\n#================\nmain()\n```"
