- pgno: 43
  md: '![](img/986b0dbf3f539f4f3baa82bd3003f04e_43_0.png)


    +   - Python is a dynamically typed language and infers the type from the assignment.
    What this means is that if we assign a string to the `name` variable, it will
    be of the `string` type, and if we assign an integer to `name`, its type will
    be integer.

    +   - Using `tkinter`, we have to declare the `name` variable as the type `tk.StringVar()`
    before we can use it successfully. The reason is that tkinter is not Python. We
    can use it from Python, but it is not the same language.


    # Setting the focus to a widget and disabling widgets


    While our GUI is nicely improving, it would be more convenient and useful to have
    the cursor appear in the Entry widget as soon as the GUI appears. Here we learn
    how to do this.


    # Getting ready


    This recipe extends the previous recipe, Text box widgets.


    # How to do it...


    Python is truly great. All we have to do to set the focus to a specific control
    when the GUI appears is call the `focus()` method on an instance of a `tkinter`
