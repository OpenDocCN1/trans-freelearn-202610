    \    win.after(wait_ms, progress_bar.stop)\n```\n\nCoding it this way will stop\
    \ the running ProgressBar when we click this button after the time specified in\
    \ the wait_ms variable, in milliseconds.\n\n# How it works...\n\nWe can specify\
    \ a maximum value and use this value in a loop, together with a sleep statement.\n\
    \nWe can start and stop the progress of the ProgressBar, using the start and stop\
    \ commands built into the ProgressBar widget.\n\nWe can also delay the stopping\
