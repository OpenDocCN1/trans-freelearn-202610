- pgno: 166
  md: '# # Placing labels on charts


    So far, we have used the default `Matplotlib` GUI. Now, we will create some `tkinter`
    GUIs using `Matplotlib`.


    This will require a few more lines of Python code and importing some more libraries,
    and it is well worth the effort, because we are gaining control of our paintings
    using canvases.


    We will position labels onto both the horizontal and the vertical axes, that is,
    *x* and *y*. We will do this by creating a `Matplotlib` figure upon which we will
    draw.


    You will also learn how to use subplots, which will enable you to draw more than
    one graph in the same window.


    # ## Getting ready


    With the necessary Python modules installed and knowing where to find the official
    online documentation and tutorials, we can now carry on with our creation of `Matplotlib`
    charts.


    # ## How to do it...


    While `plot` is the easiest way to create a `Matplotlib` chart, using `Figure`
    in combination with `Canvas` creates a more custom-made graph, which looks much
    better and also enables us to add buttons and other widgets to it:


    ```

    Matplotlib_labels.py


    ```python

    from matplotlib.figure import Figure

    from matplotlib.backends.backend_tkagg import FigureCanvasTkAgg

    import tkinter as tk

    #---------------------------------------------------------------

    fig = Figure(figsize=(12, 8), facecolor=''white'')

    #---------------------------------------------------------------

    # axis = fig.add_subplot(111)    # 1 row, 1 column, only graph

    axis = fig.add_subplot(211)     # 2 rows, 1 column, Top graph

    #---------------------------------------------------------------

    xValues = [1,2,3,4]

    yValues = [5,7,6,8]

    axis.plot(xValues, yValues)

    axis.set_xlabel(''Horizontal Label'')

    axis.set_ylabel(''Vertical Label'')

    # axis.grid()                    # default line style

    axis.grid(linestyle=''-'')         # solid grid lines

    ```

    ```'
