- pgno: 49
  md: "# How to do it...\n\nWe are creating three check button widgets that differ\
    \ in their states. The first is disabled and has a check mark in it. The user\
    \ cannot remove this check mark as the widget is disabled.\n\nThe second check\
    \ button is enabled, and by default, has no check mark in it, but the user can\
    \ click it to add a check mark.\n\nThe third check button is both enabled and\
    \ checked by default. The users can uncheck and recheck the widget as often as\
    \ they like. Look at the following code:\n\nGUI_checkbutton_widget.py\n\n```\n\
    35 # Adding a Button\n36 action = ttk.Button(win, text=\"Click Me!\", command=click_me)\n\
    37 action.grid(column=2, row=1)\n38 \n39 # Creating three checkbuttons\n40 ttk.Label(win,\
    \ text=\"Choose a number:\").grid(column=1, row=0)\n41 number = tk.StringVar()\n\
    42 number_chosen = ttk.Combobox(win, width=12, textvariable=number, state='readonly')\n\
    43 number_chosen['values'] = (1, 2, 4, 42, 100)\n44 number_chosen.grid(column=1,\
    \ row=1)\n45 number_chosen.current(0)\n46 \n47 chVarDis = tk.IntVar()\n48 check1\
    \ = tk.Checkbutton(win, text=\"Disabled\", variable=chVarDis, state='disabled')\n\
    49 check1.select()\n50 check1.grid(column=0, row=4, sticky=tk.W)\n51 \n52 chVarUn\
    \ = tk.IntVar()\n53 check2 = tk.Checkbutton(win, text=\"UnChecked\", variable=chVarUn)\n\
    54 check2.deselect()\n55 check2.grid(column=1, row=4, sticky=tk.W)\n56 \n57 chVarEn\
    \ = tk.IntVar()\n58 check3 = tk.Checkbutton(win, text=\"Enabled\", variable=chVarEn)\n\
    59 check3.select()\n60 check3.grid(column=2, row=4, sticky=tk.W)\n61 \n62 name_entered.focus()\
    \      # Place cursor into name Entry\n63 #====================\n64 # Start GUI\n\
    65 #====================\n66 win.mainloop()\n```"
