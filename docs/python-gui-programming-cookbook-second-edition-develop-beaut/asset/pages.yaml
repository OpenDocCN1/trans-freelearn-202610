- pgno: 295
  md: 'After changing the PyDev default encoding, we now can display those German
    umlaut characters. We also updated the title to use the correct German ä character:


    ```

    GUI_Refactored.py

    ```


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_295_0.png)


    # How it works…


    Internationalization and working with foreign language Unicode characters is often
    not as straightforward as we would wish. Sometimes we have to find workarounds,
    and expressing Unicode characters via Python by using the direct representation
    by prepending `\u` can do the trick.


    At other times, we just have to find the settings of our development environment
    to adjust.


    # How to design a GUI in an agile fashion


    The modern agile software development approach to design and coding came out of
    the lessons learned by software professionals. This method applies to a GUI as
    much as to any other code. One of the main keys of agile software development
    is the continuously applied process of refactoring.


    One practical example of how refactoring our code can help us in our software
    development work is by first implementing some simple functionality using functions.


    As our code grows in complexity, we might want to refactor our functions into
    methods of a class. This approach would enable us to remove global variables and
    also to be more flexible about where we place the methods inside the class.


    While the functionality of our code has not changed, the structure has.'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'In this process, we code, test, refactor, and then test again. We do this in
    short cycles and often start with the minimum code required to get some functionality
    to work.


    > Test-driven software development is one particular style of the agile development
    methodology.


    While our GUI is working nicely, our main GUI.py code has been ever-increasing
    in complexity, and it has started to get a little bit harder to maintain an overview
    of our code. This means, we need to refactor our code.


    # Getting ready


    We will refactor the GUI we created in previous chapters. We will use the English
    version of the GUI.


    # How to do it…


    We have already broken out all the names our GUI displays when we internationalized
    it in the previous recipe. That was an excellent start to refactoring our code.


    > Refactoring is the process of improving the structure, readability, and maintainability
    of the existing code. We are not adding new functionality.


    In the previous chapters and recipes, we have been extending our GUI in a top-to-bottom
    waterfall development approach, adding import to the top and code towards the
    bottom of the existing code.


    While this was useful when looking at the code, it now looks a little bit messy
    and we can improve this to help our future development.


    Let’s first clean up our import statement section, which currently looks as follows:


    ```

    ```python

    #=====================

    # imports

    #=====================

    import tkinter as tk

    from tkinter import ttk

    from tkinter import scrolledtext

    ```

    ```'
