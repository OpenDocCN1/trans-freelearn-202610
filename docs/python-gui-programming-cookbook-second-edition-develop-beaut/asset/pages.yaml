- pgno: 312
  md: "# # Creating self-testing code using Python's `__main__` section\n\nPython\
    \ comes with a very nice feature that enables each module to self-test. Making\
    \ use of this feature is a great way of making sure that the changes to our code\
    \ do not break the existing code and, additionally, the `__main__` self-testing\
    \ section can serve as documentation for how each module works.\n\n> > After a\
    \ few months or years, we sometimes forget what our code is doing, so having an\
    \ explanation written in the code itself is indeed of great benefit.\n\nIt is\
    \ a good idea to always add a self-testing section to every Python module, when\
    \ possible. It is sometimes not possible but, in most modules, it is possible\
    \ to do so.\n\n# ## Getting ready\n\nWe will extend the previous recipe, so in\
    \ order to understand what the code in this recipe is doing, we have to first\
    \ read and understand the code of the previous recipe.\n\n# ## How to do it…\n\
    \nFirst, we will explore the power of the Python `__main__` self-testing section\
    \ by adding this self-testing section to our `LanguageResources.py` module. Whenever\
    \ we run a module that has this self-testing section located at the bottom of\
    \ the module, when the module is executed by itself, this code will run.\n\nWhen\
    \ the module is imported and used from other modules, the code in the `__main__`\
    \ self-testing section will not be executed.\n\nThis is the code which is also\
    \ shown in the screenshot that follows:\n\n```\n```python\nif __name__ == '__main__':\n\
    \    language = 'en'\n    inst = I18N(language)\n    print(inst.title)\n\n   \
    \ language = 'de'\n    inst = I18N(language)\n    print(inst.title)\n```\n```"
  merge: -1
  img_proc: true
