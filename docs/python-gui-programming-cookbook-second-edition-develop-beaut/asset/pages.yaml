  md: "We can do this by calling the setDaemon(True) method on the thread before we\
    \ start the thread:\n\n```\n# Running methods in Threads\ndef create_thread(self):\n\
    \    self.run_thread = Thread(target=self.method_in_a_thread, args=[8])\n    self.run_thread.setDaemon(True)\n\
    \    self.run_thread.start()\n    print(self.run_thread)\n```\n\nWhen we now click\
    \ the button and exit our GUI while the thread has not yet completed its assigned\
    \ task, we no longer get any errors:\n\nGUI_multiple_threads_stopping_a_thread.py\n\
    \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_198_0.png)\n\n# How it works...\n\n\
    While there is a start method to make threads run, surprisingly there isn't really\
    \ an equivalent stop method.\n\nIn this recipe, we are running a method in a thread,\
    \ which prints numbers to our ScrolledText widget.\n\nWhen we exit our GUI, we\
    \ are no longer interested in the thread that used to print to our widget, so\
    \ by turning the thread into a daemon, we can exit our GUI cleanly."
