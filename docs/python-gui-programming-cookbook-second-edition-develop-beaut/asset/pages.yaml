- pgno: 146
  md: "# Getting ready\n\nThe Python interpreter runs through all the code in a module\
    \ once, finding any syntax errors and pointing them out. You cannot run your Python\
    \ code if you do not have the syntax right. This includes indentation (if not\
    \ resulting in a syntax error, wrong indentation usually results in a bug).\n\n\
    On the next parsing round, the interpreter interprets our code and runs it.\n\n\
    At runtime, many GUI events can be generated and it is usually callback functions\
    \ that add functionality to GUI widgets.\n\n# How to do it…\n\nHere is the callback\
    \ for the `Spinbox` widget:\n\n```\n```python\n# Spinbox callback\ndef _spin(self):\n\
    \    value = self.spin.get()\n    print(value)\n    self.scrol.insert(tk.INSERT,\
    \ value + '\\n')\n\n# Adding a Spinbox widget\nself.spin = Spinbox(mighty, values=(1,\
    \ 2, 4, 42, 100), width=5, bd=9, command=self._spin)\nself.spin.grid(column=0,\
    \ row=2)\n```\n```\n\n# How it works…\n\nWe created a callback method in the OOP\
    \ class which gets called when we select a value from the `Spinbox` widget because\
    \ we bound the method to the widget via the command argument (`command=self._spin`).\
    \ We use a leading underscore to hint at the fact that this method is meant to\
    \ be respected like a private Java method.\n\nPython intentionally avoids language\
    \ restrictions, such as private, public, friend, and so on. In Python, we use\
    \ naming conventions instead. Leading and trailing double underscores surrounding\
    \ a keyword are expected to be restricted to the Python language and we are expected\
    \ not to use them in our own Python code."
  merge: -1
