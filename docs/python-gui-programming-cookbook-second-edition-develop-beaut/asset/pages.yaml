- pgno: 355
  md: '# How it works...


    We first tried to run the entire wxPython GUI application in a thread, but this
    did not work because the wxPython main event loop expects to be the main thread
    of the application.


    We found a workaround for this by only running the wxPython `app.MainLoop` in
    a thread that tricks it into believing it is the main thread.


    One side-effect of this approach is that we can no longer individually close all
    of the wxPython GUI instances. At least one of them only closes when we close
    the wxPython GUI that created the threads as daemons. You can test this out by
    clicking the **Call wxPython GUI** button once or several times and then try to
    close all the created wxPython window forms. We cannot close the last one until
    we close the calling tkinter GUI!


    I am not quite sure why this is. Intuitively, one might expect to be able to close
    all daemon threads without having to wait for the main thread that created them
    to close first.


    It possibly has to do with a reference counter not having been set to zero while
    our main thread is still running.


    On a pragmatic level, this is how it currently works.


    # Communicating between the two connected GUIs


    In the previous recipes, we found ways to connect a wxPython GUI with a tkinter
    GUI, invoking one from the other and vice versa.


    While both GUIs were successfully running at the same time, they did not really
    communicate with each other, as they were only launching one another.


    In this recipe, we will explore ways to make the two GUIs talk to each other.'
  merge: -1
  img_proc: true
