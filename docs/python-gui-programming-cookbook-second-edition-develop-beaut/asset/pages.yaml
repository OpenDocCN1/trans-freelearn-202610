- pgno: 36
  md: '# How it works...


    Line 18 prevents the Python GUI from being resized.


    Running this code will result in a GUI similar to the one we created in the first
    recipe. However, the user can no longer resize it. Also, note how the maximize
    button in the toolbar of the window is grayed out.


    Why is this important? Because once we add widgets to our form, resizing can make
    our GUI look not as good as we want it to be. We will add widgets to our GUI in
    the next recipes.


    The resizable() method is of the Tk() class, and by passing in (False, False),
    we prevent the GUI from being resized. We can disable both the x and y dimensions
    of the GUI from being resized, or we can enable one or both dimensions by passing
    in True or any number other than zero. (True, False) would enable the x-dimension
    but prevent the y-dimension from being resized.


    We also added comments to our code in preparation for the recipes contained in
    this book.


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_36_0.png)


    In visual programming IDEs such as Visual Studio .NET, C# programmers often do
    not think of preventing the user from resizing the GUI they developed in this
    language. This creates inferior GUIs. Adding this one line of Python code can
    make our users appreciate our GUI.


    # Adding a label to the GUI form


    A label is a very simple widget that adds value to our GUI. It explains the purpose
    of the other widgets, providing additional information. This can guide the user
    to the meaning of an Entry widget, and it can also explain the data displayed
    by widgets without the user having to enter data into it.


    # Getting ready


    We are extending the first recipe, Creating our first Python GUI. We will leave
    the GUI resizable, so don’t use the code from the second recipe (or comment the
    win.resizable line out).'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# How to do it...


    In order to add a Label widget to our GUI, we will import the ttk module from
    tkinter. Please note the two import statements. Add the following code just above
    win.mainloop(), which is located at the bottom of the first and second recipes:


    GUI_add_label.py


    ```

    6 #===================

    7 # imports

    8 #===================

    9 import tkinter as tk

