- pgno: 6
  md: '# About the Author


    **Burkhard A. Meier** has more than 17 years of professional experience working
    in the software industry as a software tester and developer, specializing in software
    test automation development, execution, and analysis. He has a very strong background
    in Python 3 software test automation development, as well as in SQL relational
    database administration, the development of stored procedures, and debugging code.


    While experienced in Visual Studio .NET C#, Visual Test, TestComplete, and other
    testing languages (such as C/C++), the main focus of the author over the past
    five years has been developing test automation written in Python 3 to test the
    leading edge of FLIR ONE (now in its third generation) infrared cameras for iPhone
    and Android smart phones and handheld tablets, as well as assuring the quality
    of FLIR bolometer IR camera platforms.


    Being highly appreciative of art, beauty, and programming, the author developed
    GUIs in C# and Python to streamline everyday test automation tasks, enabling these
    automated tests to run unattended for weeks, collecting very useful data to be
    analyzed, automatically plotted in graphs, and e-mailed to upper management upon
    completion of nightly automated test runs.


    His previous jobs include working as a senior test automation engineer and designer
    for InfoGenesis (now Agilysys), QAD, InTouch Health, and FLIR Systems.


    You can get in touch with him through his LinkedIn account, https://www.linkedin.com/pub/burkhard-meier/5/246/296.


    I would like to thank all truly great artists, such as Leonardo da Vinci, Charles
    Baudelaire, Edgar Allan Poe, and so many more for bringing the presence of beauty
    into our human lives. This book is about creating very beautiful GUIs written
    in the Python programming language, and it was inspired by these truly great artists.


    I would like to thank all of the great people that made this book possible. Without
    any of you, this book would only exist in my mind. I would like to especially
    thank all of my editors at Packt Publishing: Sonali, Anurag, Prashant, Vivek,
    Arwa, Sumeet, Saurabh, Pramod, Nikhil, and so many more. I would also like to
    thank all of the reviewers of the code of this book. Without them, this book would
    be harder to read and apply to real-world problems. Last but not least, I’d like
    to thank my wife, our daughter, and our parents for the emotional support they
    provided so successfully during the writing of the second edition of this book.
    I’d also like to give thanks to the creator of the very beautiful and powerful
    programming language that Python truly is. Thank you Guido.'
  merge: -1
  img_proc: true
