    \ and, in this recipe, we will start using this framework to test our Python GUI\
    \ code.\n\nBefore we start writing unit tests, we want to design our testing strategy.\
    \ We could easily intermix the unit tests with the code they are testing but a\
    \ better strategy is to separate the application code from the unit test code.\n\
    \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_317_0.png)\n\nPyUnit has been designed\
    \ according to the principles of all the other xUnit testing Frameworks.\n\n#\
