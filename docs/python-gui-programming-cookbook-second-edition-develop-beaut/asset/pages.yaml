- pgno: 66
  md: 'Now, the labels within the `LabelFrame` widget have some space around them
    too:


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_66_0.png)


    The `grid_configure()` function enables us to modify the UI elements before the
    main loop displays them. So, instead of hardcoding values when we first create
    a widget, we can work on our layout and then arrange spacing towards the end of
    our file, just before the GUI is created. This is a neat technique to know.


    The `winfo_children()` function returns a list of all the children belonging to
    the `buttons_frame` variable. This enables us to loop through them and assign
    the padding to each label.


    > One thing to notice is that the spacing to the right of the labels is not really
    visible. This is because the title of `LabelFrame` is longer than the names of
    the labels. We can experiment with this by making the label names longer.


