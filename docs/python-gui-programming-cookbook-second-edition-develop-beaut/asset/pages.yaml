    \ text='Tab 3')     # Make tab visible\n\n        monty3 = ttk.LabelFrame(tab3,\
    \ text=' New Features ')\n        monty3.grid(column=0, row=0, padx=8, pady=4)\n\
    \n        # Adding more Feature Buttons\n        startRow = 4\n        for idx\
