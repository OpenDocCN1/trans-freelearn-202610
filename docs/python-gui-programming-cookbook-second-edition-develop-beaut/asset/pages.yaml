    We will create a new Python GUI similar to the one in the previous recipe. This
    time, however, we will design our GUI with two notebooks. In order to focus on
    this feature, we will use functions instead of class methods. Reading the previous
    recipe will be a good introduction to this recipe.


    # ## How to do it…


    In order to use multiple notebooks within the same GUI, we start by creating two
    frames. The first frame will hold the notebooks and their tabs, while the second
    frame will serve as the display area for the widgets each tab is designed to display.
    We use the grid layout manager to arrange the two frames, placing one above the
    other. Then, we create two notebooks and arrange them within the first frame:


    ```

    ```python

    # --------------------------------------------------

    # Create GUI

    # --------------------------------------------------

    win = tk.Tk()                 # Create instance

    win.title("Python GUI")       # Add title

    # --------------------------------------------------


    win_frame_multi_row_tabs = ttk.Frame(win)

    win_frame_multi_row_tabs.grid(column=0, row=0, sticky=''W'')


    display_area = ttk.Labelframe(win, text='' Tab Display Area '')

    display_area.grid(column=0, row=1, sticky=''NW'')


    note1 = ttk.Notebook(win_frame_multi_row_tabs)

    note1.grid(column=0, row=0)


    note2 = ttk.Notebook(win_frame_multi_row_tabs)

    note2.grid(column=0, row=1)

    ```

    ```'
