  md: "# How it works...\n\nPython enables us to use OOP when it makes sense. Other\
    \ languages like Java and C# force us to always use the OOP approach to coding.\
    \ In this recipe, we explored a situation when it did not make sense to use OOP.\n\
    \nThe OOP approach will be more extendible if the codebase grows, but if it's\
    \ certain that it is the only code that's needed, then there's no need to go through\
    \ OOP.\n\n# How to use design patterns successfully\n\nIn this recipe, we will\
    \ create widgets for our Python GUI by using the factory design pattern. In the\
    \ previous recipes, we created our widgets either manually one at a time or dynamically\
    \ in a loop. Using the factory design pattern, we will use the factory to create\
    \ our widgets.\n\n# Getting ready\n\nWe will create a Python GUI that has three\
    \ buttons, each having different styles.\n\n# How to do it...\n\nTowards the top\
    \ of our Python GUI module, just below the import statements, we create several\
    \ classes:\n\n```\nimport tkinter as tk\nfrom tkinter import ttk\nfrom tkinter\
    \ import scrolledtext\nfrom tkinter import Menu\n\nclass ButtonFactory():\n  \
    \  def createButton(self, type_):\n        return buttonTypes[type_]()\n\nclass\
    \ ButtonBase():\n    relief  ='flat'\n    foreground ='white'\n    def getButtonConfig(self):\n\
    \        return self.relief, self.foreground\n```"
  merge: -1
