- pgno: 340
  md: "# Quickly adding controls using wxPython\n\nIn this recipe, we will recreate\
    \ the GUI we originally created earlier in this book with tkinter, but this time,\
    \ we will be using the wxPython library. We will see how easy and quick it is\
    \ to use the wxPython GUI toolkit to create our own Python GUIs.\n\nWe will not\
    \ recreate the entire functionality we created in the previous chapters. For example,\
    \ we will not internationalize our wxPython GUI, nor connect it to a MySQL database.\
    \ We will recreate the visual aspects of the GUI and add some functionality.\n\
    \n> Comparing different libraries gives us the choice of which toolkits to use\
    \ for our own Python GUI development, and we can combine several of those toolkits\
    \ in our own Python code.\n\n# Getting ready\n\nEnsure you have the wxPython module\
    \ installed to follow this recipe.\n\n# How to do it...\n\nFirst, we create our\
    \ Python OOP class as we did before, using tkinter, but this time we inherit from\
    \ and extend the `wx.Frame` class. For reasons of clarity, we no longer call our\
    \ class OOP but, instead, rename it as `MainFrame`.\n\n> In wxPython, the main\
    \ GUI window is called a Frame.\n\nWe also create a callback method that closes\
    \ the GUI when we click the **Exit** menu item and declare a light-grey `tuple`\
    \ as the background color for our GUI:\n\n```\nimport wx\nBACKGROUND_COLOR = (240,\
    \ 240, 240, 255)\n\nclass MainFrame(wx.Frame):\n    def __init__(self, *args,\
    \ **kwargs):\n        wx.Frame.__init__(self, *args, **kwargs)\n        self.createWidgets()\n\
    \        self.Show()\n```"
  merge: -1
  img_proc: true
- pgno: 341
  md: "```\ndef exitGUI(self, event):      # callback\n    self.Destroy()\n\ndef createWidgets(self):\n\
    \    self.CreateStatusBar()      # wxPython built-in method\n    self.createMenu()\n\
    \    self.createNotebook()\n```\n\nWe then add a tabbed control to our GUI by\
    \ creating an instance of the wxPython Notebook class and assign it as the parent\
    \ of our own custom class named Widgets.\n\nThe notebook class instance variable\
    \ has wx.Panel as its parent:\n\n```\n#--------------------------------------------------\n\
    def createNotebook(self):\n    panel = wx.Panel(self)\n    notebook = wx.Notebook(panel)\n\
    \    widgets = Widgets(notebook) # Custom class explained below\n    notebook.AddPage(widgets,\
    \ \"Widgets\")\n    notebook.SetBackgroundColour(BACKGROUNDCOLOR)\n    # layout\n\
