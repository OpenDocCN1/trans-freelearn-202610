  md: '# Creating our first Python GUI


    Python is a very powerful programming language. It ships with the built-in `tkinter`
    module. In only a few lines of code (four, to be precise) we can build our first
    Python GUI.


    # Getting ready


    To follow this recipe, a working Python development environment is a prerequisite.
    The IDLE GUI, which ships with Python, is enough to start. IDLE was built using
    tkinter!


    +   - All the recipes in this book were developed using Python 3.6 on a Windows
    10 64-bit OS. They have not been tested on any other configuration. As Python
    is a cross-platform language, the code from each recipe is expected to run everywhere.

    +   - If you are using a Mac, it does come with built-in Python, yet it might
    be missing some modules such as tkinter, which we will use throughout this book.

    +   - We are using Python 3.6, and the creator of Python intentionally chose not
    to make it backwards compatible with Python 2. If you are using a Mac or Python
    2, you might have to install Python 3.6 from www.python.org in order to successfully
    run the recipes in this book.

    +   - If you really wish to run the code in this book on Python 2.7, you will
    have to make some adjustments. For example, tkinter in Python 2.x has an uppercase
    T. The Python 2.7 print statement is a function in Python 3.6 and requires parentheses.

    +   - While the EOL (End Of Life) for the Python 2.x branch has been extended
    to the year 2020, I would strongly recommend that you start using Python 3.6 and
    above.

    +   - Why hold on to the past, unless you really have to? Here is a link to the
    Python Enhancement Proposal (PEP) 373 that refers to the EOL of Python 2: https://www.python.org/dev/peps/pep-0373/


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_31_0.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# How to do it…


    Here are the four lines of `First_GUI.py` required to create the resulting GUI:


    ```

    ```python

    6  #====================

    7  # imports

    8  #====================

    9  import tkinter as tk


    11 # Create instance

    12 win = tk.Tk()


    14 # Add a title

    15 win.title("Python GUI")


    17 #====================

    18 # Start GUI

    19 #====================

    20 win.mainloop()

    ```

    ```


    Execute this code and admire the result:


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_32_0.png)


    # How it works…


    In line nine, we import the built-in `tkinter` module and alias it as `tk` to
    simplify our Python code. In line 12, we create an instance of the Tk class by
    calling its constructor (the parentheses appended to Tk turns the class into an
    instance). We are using the alias `tk`, so we don’t have to use the longer word
    `tkinter`. We are assigning the class instance to a variable named `win` (short
    for a window). As Python is a dynamically typed language, we did not have to declare
    this variable before assigning to it, and we did not have to give it a specific
    type. Python infers the type from the assignment of this statement. Python is
    a strongly typed language, so every variable always has a type. We just don’t
    have to specify its type beforehand like in other languages. This makes Python
    a very powerful and productive language to program in.'
  merge: -1
  img_proc: true
- pgno: 33
  md: "# A little note about classes and types:\n\n+   - In Python, every variable\
    \ always has a type. We cannot create a variable that does not have a type. Yet,\
    \ in Python, we do not have to declare the type beforehand, as we have to do in\
    \ the C programming language.\n+   - Python is smart enough to infer the type.\
    \ C#, at the time of writing this book, also has this capability. Using Python,\
    \ we can create our own classes using the `class` keyword instead of the `def`\
    \ keyword.\n+   - In order to assign the class to a variable, we first have to\
    \ create an instance of our class. We create the instance and assign this instance\
    \ to our variable, for example:\n\n```\nclass AClass(object):\n    print('Hello\
    \ from AClass')\nclass_instance = AClass()\n```\n\nNow, the variable, `class_instance`,\
    \ is of the AClass type. If this sounds confusing, do not worry. We will cover\
    \ OOP in the coming chapters.\n\nIn line 15, we use the instance variable (`win`)\
    \ of the class to give our window a title via the `title` property. In line 20,\
    \ we start the window's event loop by calling the `mainloop` method on the class\
    \ instance, `win`. Up to this point in our code, we created an instance and set\
    \ one property, but the GUI will not be displayed until we start the main event\
    \ loop.\n\n+   - An event loop is a mechanism that makes our GUI work. We can\
    \ think of it as an endless loop where our GUI is waiting for events to be sent\
    \ to it. A button click creates an event within our GUI, or our GUI being resized\
    \ also creates an event.\n+   - We can write all of our GUI code in advance and\
    \ nothing will be displayed on the user's screen until we call this endless loop\
    \ (`win.mainloop()`) in the preceding code. The event loop ends when the user\
    \ clicks the red X button or a widget that we have programmed to end our GUI.\
    \ When the event loop ends, our GUI also ends."
  merge: -1
  img_proc: true
