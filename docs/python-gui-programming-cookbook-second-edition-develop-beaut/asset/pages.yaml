    This does not look like what we had in mind. Now, we have two windows, one undesired
    and the second with its text displayed as its title.


    Oops!


    Let''s solve this now. We can change the Python code by adding a single or double
    quote, followed by a comma:


    ```

    from tkinter import messagebox as msg

