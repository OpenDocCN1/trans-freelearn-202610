- pgno: 386
  md: "In order to display a drawing component within this OpenGL window, we enhance\
    \ the RenderScene() function by creating a square rectangle with a size of 25\
    \ x 25 pixels.\n\nWe also add a new function, ChangeSize(), which gets automatically\
    \ called by the GLUT library whenever the window is resized or redrawn:\n\nOpenGL_SuperBible_Simple_Rectangle.py\n\
    \n```\nfrom OpenGL.GLUT import *\nfrom OpenGL.GL import *\nfrom OpenGL.GLU import\
    \ *\n\ndef RenderScene():\n    # display callback function\n    glClear(GL_COLOR_BUFFER_BIT)\
    \          # clear window with color defined in SetupRC\n    #       R   G   B\
    \                     # set drawing color to Red\n    glColor3f(1.0, 0.0, 0.0)\
    \              # function expects 3 f(loats)\n    glRectf(-25.0, 25.0, 25.0, -25.0)\
    \     # draw a filled rectangle with above color\n    glFlush()              \
    \               # flush/execute the OpenGL drawing command(s)\n\ndef SetupRC():\n\
    \    # rendering context setup\n    glClearColor(0.0, 0.0, 1.0, 1.0)      # RGBA:\
    \ R=0.0, G=0.0, B=1.0=white => becomes Blue\n\ndef ChangeSize(w, h):\n    # callback\
    \ when window size changes\n    if h == 0: h = 1                      # prevent\
    \ divide by zero\n    glViewport(0, 0, w, h)                # set Viewport to\
    \ Window dimensions\n    glMatrixMode(GL_PROJECTION)           # define the viewing\
    \ volume\n    glLoadIdentity()                      # reset coordinate system\n\
    \    aspectRatio = GLfloat(w).value / GLfloat(h).value  # establish clipping volume\n\
    \                                          # GLfloat becomes ctypes.c_float\n\
    \                                          # Use the value attribute before dividing\n\
    \    if w <= h: glOrtho(-100.0, 100.0, -100.0 / aspectRatio, 100.0 / aspectRatio,\
    \ 1.0, -1.0)\n    else: glOrtho(-100.0 * aspectRatio, 100.0 * aspectRatio, -100.0,\
    \ 100.0, 1.0, -1.0)\n    glMatrixMode(GL_MODELVIEW)\n    glLoadIdentity()\n\n\
    def main():\n    glutInit()\n    glutInitDisplayMode(GLUT_SINGLE | GLUT_RGBA)\
    \  # single buffer; RGBA color mode\n    glutCreateWindow(b\"GLRect\")       \
    \           # Python 3: bytes instead of string for Title\n    glutDisplayFunc(RenderScene)\n\
    \    glutReshapeFunc(ChangeSize)\n    SetupRC()\n    glutMainLoop()\n\n====================\n\
    main()\n```\n\nHere is the resulting window:\n\nOpenGL_SuperBible_Simple_Rectangle.py"
