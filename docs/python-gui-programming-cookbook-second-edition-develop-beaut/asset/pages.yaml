- pgno: 195
  md: "We simulated long-running tasks by inserting a sleep statement into our code,\
    \ which showed us that threads can indeed solve our problem.\n\n# Stopping a thread\n\
    \nWe have to start a thread to actually make it do something by calling the start()\
    \ method, so intuitively, we would expect there to be a matching stop() method,\
    \ but there is no such thing. In this recipe, we will learn how to run a thread\
    \ as a background task, which is called a daemon. When closing the main thread,\
    \ which is our GUI, all daemons will automatically be stopped as well.\n\n# Getting\
    \ ready\n\nWhen we call methods in a thread, we can also pass arguments and keyword\
    \ arguments to the method. We start this recipe by doing exactly that.\n\n# How\
    \ to do it...\n\nBy adding args=[8] to the thread constructor and modifying the\
    \ targeted method to expect arguments, we can pass arguments to the threaded methods.\
    \ The parameter to args has to be a sequence, so we will wrap our number in a\
    \ Python list:\n\n```\ndef method_in_a_thread(self, num_of_loops=10):\n    print('Hi,\
    \ how are you?')\n    for idx in range(num_of_loops):\n        sleep(5)\n    \
    \    self.scrol.insert(tk.INSERT, str(idx) + 'n')\n```\n\nIn the following code,\
    \ run_thread is a local variable, which we only access within the scope of the\
    \ method inside which we created run_thread:\n\n```\n# Running methods in Threads\n\
    def create_thread(self):\n    run_thread = Thread(target=self.method_in_a_thread,\
    \ args=[8])\n    run_thread.start()\n```"
  merge: -1
  img_proc: true
- pgno: 196
  md: "# Threads and Networking\n\nBy turning the local variable into a member, we\
    \ can then check if the thread is still running by calling `isAlive` on it from\
    \ another method:\n\n```\n```python\n# Running methods in Threads\ndef create_thread(self):\n\
    \    self.run_thread = Thread(target=self.method_in_a_thread, args=\n        \
    \                     [8])\n    self.run_thread.start()\n    print(self.run_thread)\n\
    \    print('createThread():', self.run_thread.isAlive())\n```\n```\n\nIn the preceding\
    \ code, we have elevated our local `run_thread` variable to a member of our class.\
    \ This enables us to access the `self.run_thread` variable from any method in\
    \ our class.\n\nIt is achieved like this:\n\n```\n```python\ndef method_in_a_thread(self,\
    \ num_of_loops=10):\n    for idx in range(num_of_loops):\n        sleep(1)\n \
    \       self.scrol.insert(tk.INSERT, str(idx) + '\\n')\n    sleep(1)\n    print('method_in_a_thread():',\
    \ self.run_thread.isAlive())\n```\n```\n\nWhen we click the button and then exit\
    \ the GUI, we can see that the print statements in the `create_thread` method\
    \ were printed, but we do not see the second print statement from `method_in_a_thread`.\n\
    \nConsider the following output:\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_196_0.png)"
