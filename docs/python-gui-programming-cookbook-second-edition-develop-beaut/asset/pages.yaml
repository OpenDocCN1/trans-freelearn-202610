- pgno: 139
  md: 'The `global` variables can be very useful when programming small applications.
    They can help us make data available across methods and functions within the same
    Python module and sometimes the overhead of OOP is not justified.


    As our programs grow in complexity, the benefit we gain from using globals can
    quickly diminish.


    > It is best to avoid globals and accidentally shadowing variables by using the
    same name in different scopes. We can use OOP instead of using global variables.


    We played around with the `global` variables within procedural code and learned
    how it can lead to hard-to-debug bugs. In the next recipe, we will move on to
    OOP, which can eliminate such bugs.


    # How coding in classes can improve the GUI


    So far, we have been coding in a procedural style. This is a quick scripting method
    from Python. Once our code gets larger and larger, we need to advance to coding
    in OOP.


    Why?


    Because, among many other benefits, OOP allows us to move code around by using
    methods. Once we use classes, we no longer have to physically place code above
    the code that calls it. This gives us great flexibility in organizing our code.


    We can write related code next to other code and no longer have to worry that
    the code will not run because the code does not sit above the code that calls
    it.


    We can take that to some rather fancy extremes by coding up modules that refer
    to methods that are not being created within that module. They rely on the runtime
    state having created those methods during the time the code runs.


    > If the methods we call have not been created by that time, we get a runtime
    error.'
  merge: -1
  img_proc: true
