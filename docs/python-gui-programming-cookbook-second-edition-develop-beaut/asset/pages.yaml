    \ towards the top of our GUI module:\n\n```\nfrom threading import Thread\nfrom\
    \ queue import Queue\n```\n\nThat gets us started.\n\nNext, we create a queue\
    \ instance:\n\n```\ndef use_queues(self):\n    gui_queue = Queue()           \
    \     # create queue instance\n    print(gui_queue)                   # print\
    \ instance\n```\n\nWe call the method within our button click event:\n\n```\n\
    # Button callback\ndef click_me(self):\n    self.action.configure(text='Hello\
    \ ' + self.name.get())\n    self.create_thread()\n    self.use_queues()\n```\n\
    \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_200_0.png)\n\nIn the preceding code,\
    \ we create a local Queue instance that is only accessible within this method.\
    \ If we wish to access this queue from other places, we have to turn it into a\
    \ member of our class by using the self keyword, which binds the local variable\
    \ to the entire class, making it available from any other method within our class.\
    \ In Python, we often create class instance variables in the __init__(self) method,\
    \ but Python is very pragmatic and enables us to create those member variables\
    \ anywhere in the code."
