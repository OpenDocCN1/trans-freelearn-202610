- pgno: 389
  md: "We create the TimerFunction() to be passed into glutTimerFunc(). In this function,\
    \ we do some math to position the red square and make it bounce of the window\
    \ walls. At the end of the function, we recursively call this function in glutTimerFunc():\n\
    \n```\ndef TimerFunction(value):\n    global x1, xstep, y1, ystep\n\n    # reverse\
    \ direction left/right\n    if ((x1 > windowWidth - rect_size) or (x1 < -windowWidth)):\n\
    \        xstep = -xstep\n\n    # reverse direction top/bottom\n    if ((y1 > windowHeight)\
    \ or (y1 < -windowHeight + rect_size)):\n        ystep = -ystep\n\n    # move\
    \ the red square\n    x1 += xstep\n    y1 += ystep\n\n    # check the bounds of\
    \ the clipping area\n    if (x1 > (windowWidth - rect_size + xstep)):\n      \
    \  x1 = windowWidth - rect_size - 1\n    elif (x1 < -(windowWidth + xstep)):\n\
    \        x1 = -windowWidth - 1\n\n    if (y1 > (windowHeight + ystep)):\n    \
    \    y1 = windowHeight - 1\n    elif (y1 < -(windowHeight - rect_size + ystep)):\n\
    \        y1 = -windowHeight + rect_size - 1\n\n    # redraw the scene\n    glutPostRedisplay()\n\
    \    glutTimerFunc(33, TimerFunction, 1)    # recursive call\n```"
