- pgno: 306
  md: 'A better idea is to place our breakpoint closer to our own code in order to
    watch the values of some of our own Python variables. In the event-driven world
    of modern GUIs, we have to place our breakpoints at code that gets invoked during
    events, for example, button clicks.


    Currently, one of our main functionalities resides in a button click event. When
    we click the button labelled **New York**, we create an event, which, then, results
    in something happening in our GUI.


    Let''s place a breakpoint at the **New York** button callback method, which we
    named `getDateTime()`.


    When we now run a debug session, we will stop at the breakpoint and then we can
    enable watches of variables that are in scope.


    Using PyDev in Eclipse, we can right-click a variable and then select the watch
    command from the pop-up menu. The name of the variable, its type, and the current
    value will be displayed in the expressions debug window shown in the next screenshot.
    We can also type directly into the expressions window.


    The variables we are watching are not limited to simple data types. We can watch
    class instances, lists, dictionaries, and so on.


    When watching these more complex objects, we can expand them in the Expressions
    window and drill down into all of the values of the class instances, dictionaries,
    and so on.


    We do this by clicking on the triangle to the left of our watched variable that
    appears leftmost under the **Name** column, next to each variable:


    ```

    Callbacks_Refactored.py

    ```'
