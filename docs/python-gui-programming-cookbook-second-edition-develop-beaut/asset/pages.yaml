  md: '# How it works...


    In this recipe, we went in the opposite direction of the previous recipe by first
    creating a GUI using wxPython and then, from within it, creating several GUI instances
    built using tkinter.


    The wxPython GUI remained responsive while one or more tkinter GUIs were running.
    However, clicking the tkinter button only updated its button text in the first
    instance.


    # Using Python to control two different GUI frameworks


    In this recipe, we will explore ways to control the tkinter and wxPython GUI frameworks
    from Python. We have already used the Python threading module to keep our GUI
    responsive in a previous chapter, Threads and Networking, so here we will attempt
    to use the same approach.


    We will see that things don''t always work in a way that would be intuitive.


    However, we will improve our tkinter GUI from being unresponsive while we invoke
    an instance of the wxPython GUI from within it.


    # Getting ready


    This recipe will extend a previous recipe from this chapter, Trying to embed a
    main wxPython app in a main tkinter app, in which we tried to embed a main wxPython
    GUI into our tkinter GUI.


    # How to do it...


    When we created an instance of a wxPython GUI from our tkinter GUI, we could no
    longer use the tkinter GUI controls until we closed the one instance of the wxPython
    GUI. Let''s improve on this now.


    Our first attempt might be to use threading from the tkinter button callback function.'
