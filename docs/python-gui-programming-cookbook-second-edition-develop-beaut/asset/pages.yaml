  md: "# Data and Classes\n\nWe will retrieve the current value of the `Spinbox` control.\n\
    \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_134_0.png)\n\nWe placed our code above\
    \ the GUI main event loop, so the printing happens before the GUI becomes visible.\
    \ We would have to place the code into a callback function if we wanted to print\
    \ out the current value after displaying the GUI and changing the value of the\
    \ `Spinbox` control.\n\nWe created our `Spinbox` widget using the following code,\
    \ hardcoding the available values into it:\n\n```\n```python\n# Adding a Spinbox\
    \ widget using a set of values\nspin = Spinbox(mighty, values=(1, 2, 4, 42, 100),\
    \ width=5, bd=8,\n               command=_spin)\nspin.grid(column=0, row=2)\n\
    ```\n```\n\nWe can also move the hardcoding of the data out of the creation of\
    \ the `Spinbox` class instance and set it later:\n\n```\n```python\n# Adding a\
    \ Spinbox widget assigning values after creation\nspin = Spinbox(mighty, width=5,\
    \ bd=8, command=_spin)\nspin['values'] = (1, 2, 4, 42, 100)\nspin.grid(column=0,\
    \ row=2)\n```\n```\n\nIt does not matter how we create our widget and insert data\
    \ into it because we can access this data by using the `get()` method on the instance\
    \ of the widget.\n\n# How it works...\n\nIn order to get the values out of our\
    \ GUI written using tkinter, we use the tkinter `get()` method on an instance\
    \ of the widget we wish to get the value from.\n\nIn the preceding example, we\
    \ used the `Spinbox` control, but the principle is the same for all widgets that\
    \ have a `get()` method.\n\nOnce we have got the data, we are in a pure Python\
    \ world, and tkinter did serve us well in building our GUI. Now that we know how\
    \ to get the data out of our GUI, we can use this data."
