- pgno: 258
  md: "# # Using the SQL DELETE command\n\nIn this recipe, we will use the SQL DELETE\
    \ command to delete the data we created in the previous recipe, *Using the SQL\
    \ UPDATE command*.\n\nWhile deleting data might at first sight sound trivial,\
    \ once we get a rather large database design in production, things might not be\
    \ that easy any more.\n\nBecause we have designed our GUI database by relating\
    \ two tables via a primary to foreign key relation, when we delete certain data,\
    \ we do not end up with orphan records because this database design takes care\
    \ of cascading deletes.\n\n# ## Getting ready\n\nThis recipe uses the MySQL database,\
    \ tables, as well as the data inserted into those tables from the previous recipe,\
    \ *Using the SQL UPDATE command*. In order to demonstrate how to create orphan\
    \ records, we will have to change the design of one of our database tables.\n\n\
    # ## How to do it...\n\nWe kept our database design simple by using only two database\
    \ tables.\n\nWhile this works when we delete data, there is always a chance of\
    \ ending up with orphan records. What this means is that we delete data in one\
    \ table but somehow do not delete the related data in another SQL table.\n\nIf\
    \ we create our quotations table without a foreign key relationship to the books\
    \ table, we can end up with orphan records:\n\n```\n```sql\n# create second Table\
    \ inside DB ---\n# No FOREIGN KEY relation to Books Table\ncursor.execute(\"CREATE\
    \ TABLE Quotations (\n    Quote_ID INT AUTO_INCREMENT,\n    Quotation VARCHAR(250),\n\
    \    Books_Book_ID INT,\n    PRIMARY KEY (Quote_ID)\n) ENGINE=InnoDB\")\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 259
  md: "After inserting data into the books and quotations tables, if we execute a\
    \ `DELETE` statement, we are only deleting the book with `Book_ID 1` while the\
    \ related quotation with the `Books_Book_ID 1` is left behind.\n\nThis is an *orphaned\
    \ record*. There no longer exists a book record that has a `Book_ID` of 1:\n\n\
    ```\nmysql> SELECT * FROM books;\n+---------+----------------------+-----------+\n\
    | Book_ID | Book_Title           | Book_Page |\n+---------+----------------------+-----------+\n\
    |       2 | xUnit Test Patterns  |        31 |\n+---------+----------------------+-----------+\n\
    1 row in set (0.00 sec)\n\nmysql> SELECT * FROM quotations;\n+---------+------------------------------------------+----------------+\n\
    | Quote_ID | quotation                                | Books_Book_ID |\n+---------+------------------------------------------+----------------+\n\
    |       1 | programming to an Interface, not an Implementation |             \
    \ 2 |\n|       2 | philosophy of Test Automation             |              2\
    \ |\n+---------+------------------------------------------+----------------+\n\
    2 rows in set (0.00 sec)\n\nmysql>\n```\n\nThis situation can create a mess, which\
    \ we avoid by using cascading deletes.\n\nWe do this in the creation of the tables\
    \ by adding certain database constraints. When we created the table that holds\
    \ the quotations in a previous recipe, we created our `quotations` table with\
    \ a foreign key constraint that explicitly references the primary key of the books\
    \ table, linking the two:\n\n```\n# create second Table inside DB\ncursor.execute(\"\
    CREATE TABLE Quotations (\n            Quote_ID INT AUTO_INCREMENT,\n        \
    \    Quotation VARCHAR(250),\n            Books_Book_ID INT,\n            PRIMARY\
    \ KEY (Quote_ID),\n            FOREIGN KEY (Books_Book_ID)\n                REFERENCES\
    \ Books(Book_ID)\n                ON DELETE CASCADE\n        ) ENGINE=InnoDB\"\
    )\n```\n\nThe `FOREIGN KEY` relation includes the `ON DELETE CASCADE` attribute,\
    \ which basically tells our MySQL server to delete related records in this table\
    \ when the records that this foreign key relates to are deleted."
  merge: -1
  img_proc: true
- pgno: 260
  md: "Without specifying the `ON DELETE CASCADE` attribute in the creation of our\
    \ table we can neither delete nor update our data because an `UPDATE` is a `DELETE`\
    \ followed by an `INSERT`.\n\nBecause of this design, no orphan records will be\
    \ left behind, which is what we want.\n\nIn MySQL, we have to specify `ENGINE=InnoDB`\
    \ on both the related tables in order to use primary to foreign key relations.\n\
    \nLet's display the data in our database:\n\n```\n```python\n#===============================================\n\
    if __name__ == '__main__':\n    # Create class instance\n    mySQL = MySQL()\n\
    \    mySQL.showData()\n```\n```\n\nThis shows us the following data in our database\
    \ tables:\n\n`GUI_MySQL_class.py`\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_260_0.png)\n\
    \nThis shows us that we have two records that are related via primary to foreign\
    \ key relationships.\n\nWhen we now delete a record in the books table, we expect\
    \ the related record in the quotations table to also be deleted by a cascading\
    \ delete. Let's try this by executing the following SQL commands in Python:\n\n\
    ```\n```python\nimport MySQLdb as mysql\nimport Ch07_Code.GuiDBConfig as guiConf\n\
    \nclass MySQL():\n    #===============================================\n    def\
    \ deleteRecord(self):\n        # connect to MySQL\n        conn, cursor = self.connect()\n\
    ```\n```"
