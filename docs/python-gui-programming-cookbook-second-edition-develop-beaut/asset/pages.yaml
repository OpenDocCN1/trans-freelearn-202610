- pgno: 329
  md: '# 9

    Extending Our GUI with the wxPython Library


    In this chapter, we will enhance our Python GUI by using the wxPython library.
    We will cover the following recipes:


    +   - Installing the wxPython library

    +   - Creating our GUI in wxPython

    +   - Quickly adding controls using wxPython

    +   - Trying to embed a main wxPython app in a main tkinter app

    +   - Trying to embed our tkinter GUI code into wxPython

    +   - Using Python to control two different GUI frameworks

    +   - Communicating between two connected GUIs


    # Introduction


    In this chapter, we will introduce another Python GUI toolkit that currently does
    not ship with Python. It is called wxPython.


    There are two versions of this library. The original is called Classic, while
    the newest is called by its development project code name, which is Phoenix.


    In this book, we are solely programming using Python 3.6 and above, and because
    the new Phoenix project is aimed at supporting Python 3.6 and above, this is the
    version of wxPython we will use in this chapter.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# Extending Our GUI with the wxPython Library


    First, we will create a simple wxPython GUI, and then we will try to connect both
    of the tkinter-based GUIs we developed in this book with the new wxPython library.


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_330_0.png)


    wxPython is a Python binding to wxWidgets. The w in wxPython stands for the Windows
    OS and the x stands for Unix-based operating systems, such as Linux and Apple''s
    OS X (now renamed Mac OS).


    If things don''t work out using these two GUI toolkits in unison, we will attempt
    to use Python to solve any problems and, if necessary, we will use **Inter Process
    Communication (IPC)** within Python to make sure that our Python code works as
    we want it to work.


    Here is the overview of Python modules for this chapter:


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_330_1.png)'
