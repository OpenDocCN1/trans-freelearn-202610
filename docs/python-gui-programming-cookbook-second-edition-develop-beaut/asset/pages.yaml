- pgno: 321
  md: 'Unit testing code is code and can have bugs too.


    While the purpose of writing unit tests is really to test our application code,
    we have to make sure that our tests are written correctly. One approach from the
    **Test-Driven-Development (TDD)** methodology might help us.


    In TDD, we develop the unit tests before we actually write the application code.
    Now, if a test passes for a method that does not even exist, something is wrong.
    The next step is to create the non-existing method and make sure it will fail.
    After that, we can write the minimum amount of code necessary to make the unit
    test pass.


    # How it works…


    In this recipe we started testing our Python GUI, writing unit tests in Python.
    We saw that Python unit test code is just code and can contain mistakes that need
    to be corrected. In the next recipe, we will extend this recipe''s code and use
    the graphical unit test runner that comes with the PyDev plugin for the Eclipse
    IDE.


    # How to write unit tests using the Eclipse PyDev IDE


    In the previous recipe, we started using Python''s unit testing capabilities,
    and in this recipe, we will ensure the quality of our GUI code by further using
    this capability.


    We will unit test our GUI in order to make sure that the internationalized strings
    our GUI displays are as expected.


    In the previous recipe, we encountered some bugs in our unit testing code but,
    typically, our unit tests will find regression bugs that are caused by modifying
    the existing application code, not the unit test code. Once we have verified that
    our unit testing code is correct, we do not usually change it.'
