  md: '# Creating our first chart


    Now that we have all the required Python modules installed, we can create our
    own charts using Matplotlib.


    We can create charts from only a few lines of Python code.


    # Getting ready


    Successfully installing Matplotlib, as shown in the previous recipe, is a requirement
    for this recipe.


    # How to do it...


    Using the minimum amount of code, as presented on the official Matplotlib website,
    we can create our first chart. Well, almost. The sample code shown on the website
    does not work until we import the show function from pylab and then call it:


    Matplotlib_our_first_chart.py


