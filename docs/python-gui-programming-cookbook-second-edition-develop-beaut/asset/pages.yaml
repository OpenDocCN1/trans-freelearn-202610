- pgno: 174
  md: "We are only plotting one graph in this recipe, and we do this by changing fig.add_subplot(111).\
    \ We also slightly modify the size of the figure via the figsize property.\n\n\
    Next, we create three Python lists that contain the values to be plotted. When\
    \ we plot the data, we save the references to the plots in local variables.\n\n\
    We create the legend by passing in a tuple with the references to the three plots,\
    \ another tuple that contains the strings that are then displayed in the legend,\
    \ and in the third argument, we position the legend within the chart.\n\nThe default\
    \ settings of Matplotlib assign a color scheme to the lines being plotted.\n\n\
    We can easily change this default setting of colors to the colors we prefer by\
    \ setting a property when we plot each axis.\n\nWe do this by using the color\
    \ property and assigning it an available color value:\n\n```\nMatplotlib_chart_with_legend.py\n\
    \n    t0, = axis.plot(xValues, yValues0, color = 'purple')\n    t1, = axis.plot(xValues,\
    \ yValues1, color = 'red')\n    t2, = axis.plot(xValues, yValues2, color = 'blue')\n\
    ```\n\nNote that the comma after the variable assignments of t0, t1, and t2 is\
    \ not a mistake. It is required in order to create the legend.\n\nThe comma after\
    \ each variable turns a list into a tuple. If we leave this out, our legend will\
    \ not be displayed.\n\nThe code will still run, just without the intended legend.\n\
    \n![](img/986b0dbf3f539f4f3baa82bd3003f04e_174_0.png)\n\nWhen we remove the comma\
    \ after the t0 assignment, we get an error and the first line no longer appears\
    \ in the figure. The chart and legend still get created but without the first\
    \ line appearing in the legend."
