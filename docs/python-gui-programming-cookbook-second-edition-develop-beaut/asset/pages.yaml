    # Creating tooltips using Python


    This recipe will show us how to create tooltips. When the user hovers the mouse
    over a widget, additional information will be available in the form of a tooltip.


    We will code this additional information into our GUI.


    # Getting ready


    We will be adding more useful functionality to our GUI. Surprisingly, adding a
    tooltip to our controls should be simple, but it is not as simple as we''d wish
    it to be.


    In order to achieve this desired functionality, we will place our tooltip code
    into its own OOP class.'
  merge: -1
  img_proc: true
- pgno: 115
  md: "# How to do it...\n\nAdd the following class just below the import statements:\n\
    \n```\nclass ToolTip(object):\n    def __init__(self, widget):\n        self.widget\
    \ = widget\n        self.tip_window = None\n\n    def show_tip(self, tip_text):\n\
    \        \"Display text in a tooltip window\"\n        if self.tip_window or not\
    \ tip_text:\n            return\n        x, y, cx, cy = self.widget.bbox(\"insert\"\
    )      # get size of widget\n        x = x + self.widget.winfo_rootx() + 25  \
    \        # calculate to display tooltip\n        y = y + cy + self.widget.winfo_rooty()\
    \ + 25     # below and to the right\n        self.tip_window = tw = tk.Toplevel(self.widget)\
    \ # create new tooltip window\n        tw.wm_overrideredirect(True)          \
    \          # remove all Window Manager (wm) decorations\n        # tw.wm_overrideredirect(False)\
    \                  # uncomment to see the effect\n        tw.wm_geometry(\"+%d+%d\"\
    \ % (x, y))                # create window size\n\n        label = tk.Label(tw,\
    \ text=tip_text, justify=tk.LEFT,\n                         background=\"#ffffe0\"\
    , relief=tk.SOLID, borderwidth=1,\n                         font=(\"tahoma\",\
    \ \"8\", \"normal\"))\n        label.pack(ipadx=1)\n\n    def hide_tip(self):\n\
    \        tw = self.tip_window\n        self.tip_window = None\n        if tw:\n\
    \            tw.destroy()\n\ndef create_ToolTip(widget, text):\n    tooltip =\
    \ ToolTip(widget)      # create instance of class\n    def enter(event):\n   \
    \     tooltip.show_tip(text)\n    def leave(event):\n        tooltip.hide_tip()\n\
    \    widget.bind('<Enter>', enter)  # bind mouse events\n    widget.bind('<Leave>',\
    \ leave)\n```\n\nIn an Object Oriented Programming (OOP) approach, we create a\
    \ new class in our Python module. Python allows us to place more than one class\
    \ into the same Python module and it also enables us to mix-and-match classes\
    \ and regular functions in the same module.\n\nThe preceding code does exactly\
    \ this.\n\nThe ToolTip class is a Python class, and in order to use it, we have\
    \ to instantiate it."
  merge: -1
  img_proc: true
- pgno: 116
  md: "If you are not familiar with OOP programming, instantiating an object to create\
    \ an instance of the class, may sound rather boring.\n\nThe principle is quite\
    \ simple and very similar to creating a Python function via a def statement and\
    \ then, later in the code, actually calling this function.\n\nIn a very similar\
    \ manner, we first create a blueprint of a class and simply assign it to a variable\
    \ by adding parentheses to the name of the class, as follows:\n\n```\nclass AClass():\n\
    \    pass\ninstance_of_a_class = AClass()\nprint(instance_of_a_class)\n```\n\n\
    The preceding code prints out a memory address and also shows that our variable\
    \ now has a reference to this class instance.\n\nThe cool thing about OOP is that\
    \ we can create many instances of the same class.\n\nIn our tooltip code, we declare\
    \ a Python class and explicitly make it inherit from object, which is the foundation\
    \ of all Python classes. We can also leave it out, as we did in the AClass code\
    \ example, because it is the default for all Python classes.\n\nAfter all the\
    \ necessary tooltip creation code that occurs within the ToolTip class, we switch\
    \ over to non-OOP Python programming by creating a function just below it.\n\n\
    We define the create_ToolTip() function, and it expects one of our GUI widgets\
    \ to be passed in as an argument, so we can display a tooltip when we hover our\
    \ mouse over this control.\n\nThe create_ToolTip() function actually creates a\
    \ new instance of our ToolTip class for every widget we call it for.\n\nWe can\
    \ add a tooltip for our Spinbox widget, as follows:\n\n```\n# Add a Tooltip\n\
    create_ToolTip(spin, 'This is a Spin control')\n```"
