  md: 'Our unit tests also serve as a documentation of what we expect our code to
    do.


    By default, Python''s unit tests are executed with a textual unit test runner,
    and we can run this in the PyDev plugin from within the Eclipse IDE. We can also
    run the very same unit tests from a console window.


    In addition to the text runner in this recipe, we will explore PyDev''s graphical
    unit test feature, which can be used from within the Eclipse IDE.


    # Getting ready


    We will extend the previous recipe in which we began using Python unit tests.


    # How to do it…


    The Python unit testing framework comes with what are called **Fixtures**.


    Refer to the following URLs for a description of what a test fixture is:


    +   - `https://docs.python.org/3.6/library/unittest.html`

    +   - `https://en.wikipedia.org/wiki/Test_fixture`

    +   - `http://www.boost.org/doc/libs/1_51_0/libs/test/doc/html/utf/user-guide/fixture.html`


    What this means is that we can create `setup()` and `teardown()` unit testing
    methods so that the `setup()` method is called at the beginning before any single
    test is executed, and at the end of every single unit test, the `teardown()` method
    is called.


    This fixture capability provides us with a very controlled environment in which
    we can run our unit tests. It is similar to using pre- and post-conditions.


    Let''s set up our unit testing environment. We will create a new testing class
    which focuses on the aforementioned correctness of code:


    ```

    import unittest

    from Ch08_Code.LanguageResources import I18N

    ```'
