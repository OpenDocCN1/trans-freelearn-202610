- pgno: 241
  md: 'We retrieve the results by calling the `fetchall` method on the cursor object.


    Running this code shows us which databases currently exist in our MySQL server
    instance. As we can see from the output, MySQL ships with several built-in databases
    such as `information_schema`, and so on. We have successfully created our own
    `guidb` database, which is shown in the output. All other databases illustrated
    come shipped with MySQL:


    ```

    MySQL_show_DBS.py

    ```


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_241_0.png)


    Note how, even though we specified the database when we created it in mixed-case
    letters as GuiDB, the `SHOW DATABASES` command shows all existing databases in
    MySQL in lower-case and displays our database as `guidb`.


    # How it works…


    In order to connect our Python GUI to a MySQL database, we first have to know
    how to connect to the MySQL server. This requires establishing a connection, and
    this connection will only be accepted by MySQL if we are able to provide the required
    credentials.


    While it is easy to place strings into one line of Python code, when we deal with
    databases, we have to be really thoughtful because today''s personal sandbox development
    environment could easily end up being accessible on the World Wide Web by tomorrow.


    You do not want to compromise database security, and the first part of this recipe
    showed ways to be more secure by placing the connection credentials to the MySQL
    server into a separate file and, by placing this file into a location where it
    is not accessible from the outside world, our database system will become more
    secure.


    In a real-world production environment, the MySQL server installation, connection
    credentials, and this `dbConfig` file would be handled by IT system administrators
    who would enable you to import the `dbConfig` file to connect to the MySQL server
    without you knowing what the actual credentials are. Unpacking `dbConfig` would
    not expose the credentials as it does in our code.'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'The second part created our own database in a MySQL server instance, and we
    will extend and use this database in the following recipes, combining it with
    our Python GUI.


    # Designing the Python GUI database


    Before we start creating tables and inserting data into them, we have to design
    the database. Unlike changing local Python variable names, changing a database
    schema once it has been created and loaded with data is not that easy.


    We would have to DROP the table, which means we would lose all the data that was
    in the table. So, before dropping a table, we would have to extract the data,
    then DROP the table, recreate it, and finally reimport the original data.


    You get the picture...


    Designing our GUI MySQL database means first thinking about what we want our Python
    application to do with it and then choosing names for our tables that match the
    intended purpose.


    # Getting ready


    We are working with the MySQL database we created in the previous recipe, Configuring
    the MySQL database connection. A running instance of MySQL is necessary and the
    two previous recipes show how to install MySQL, all necessary additional drivers,
    as well as how to create the database we are using in this chapter.


    # How to do it...


    First, we move the widgets from our Python GUI around between the two tabs we
    created in the previous recipes in order to organize our Python GUI better to
    connect to a MySQL database.


    We rename several widgets and separate the code that accesses the MySQL data to
    what used to be named Tab 1, and we will move unrelated widgets to what we called
    Tab 2 in earlier recipes. We also adjust some internal Python variable names in
    order to understand our code better.'
  merge: -1
  img_proc: true
