- pgno: 220
  md: "# Using TCP/IP to communicate via networks\n\nThis recipe shows you how to\
    \ use sockets to communicate via TCP/IP. In order to achieve this, we need both\
    \ an IP address and a port number.\n\nIn order to keep things simple and independent\
    \ of the ever changing internet IP addresses, we will create our own local TCP/IP\
    \ server and, as a client, learn how to connect to it and read data from a TCP/IP\
    \ connection.\n\nWe will integrate this networking capability into our GUI by\
    \ using the queues we created in the previous recipes.\n\nTCP/IP stands for Transmission\
    \ Control Protocol/Internet Protocol, which is a set of networking protocols that\
    \ allows two or more computers to communicate.\n\n# Getting ready\n\nWe will create\
    \ a new Python module which will be the TCP server.\n\n# How to do it...\n\nOne\
    \ way to implement a TCP server in Python is to inherit from the socketserver\
    \ module. We subclass BaseRequestHandler and then override the inherited handle\
    \ method. In very few lines of Python code, we can implement a TCP server:\n\n\
    ```\nfrom socketserver import BaseRequestHandler, TCPServer\n\nclass RequestHandler(BaseRequestHandler):\n\
    \    # override base class handle method\n    def handle(self):\n        print('Server\
    \ connected to: ', self.client_address)\n        while True:\n            rsp\
    \ = self.request.recv(512)\n            if not rsp: break\n            self.request.send(b'Server\
    \ received: ' + rsp)\n\ndef start_server():\n    server = TCPServer(('', 24000),\
    \ RequestHandler)\n    server.serve_forever()\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "We are passing in our RequestHandler class into a TCPServer initializer. The\
    \ empty single quotes are a short cut for passing in localhost, which is our own\
    \ PC. This is the IP address of 127.0.0.1. The second item in the tuple is the\
    \ port number. We can choose any port number that is not in use on our local PC.\n\
    \nWe just have to make sure that we are using the same port on the client side\
    \ of the TCP connection; otherwise, we would not be able to connect to the server.\
    \ Of course, we have to start the server first before clients can connect to it.\n\
    \nWe will modify our Queues.py module to become the TCP client:\n\n```\n# using\
    \ TCP/IP\nfrom socket import socket, AF_INET, SOCK_STREAM\n\ndef write_to_scrol(inst):\n\
    \    print('hi from Queue', inst)\n    sock = socket(AF_INET, SOCK_STREAM)\n \
    \   sock.connect(('localhost', 24000))\n    for idx in range(10):\n        sock.send(b'Message\
    \ from a queue: ' +\n                  bytes(str(idx).encode()) )\n        recv\
    \ = sock.recv(8192).decode()\n        inst.gui_queue.put(recv)\n    inst.create_thread(6)\n\
    ```\n\nWhen we now click the Click Me! button, we are calling bq.write_to_scrol(self),\
    \ which then creates the socket and connection shown precedingly.\nThis is all\
    \ the code we need to talk to the TCP server. In this example, we are simply sending\
    \ some bytes to the server and the server sends them back, prepending some strings\
    \ before returning the response.\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_221_0.png)\n\
    \nThis shows the principle of how TCP communications via networks work.\n\nOnce\
    \ we know how to connect to a remote server via TCP/IP, we will use whatever commands\
    \ are designed by the protocol of the program we are interested in communicating\
    \ with. The first step is to connect before we can send commands to specific applications\
    \ residing on a server."
  merge: -1
  img_proc: true
- pgno: 222
  md: "In the writeToScrol function, we will use the same loop as before, but now\
    \ we will send the messages to the TCP server. The server modifies the received\
    \ message and then sends it back to us. Next we place it into the GUI member queue,\
    \ which, as in the previous recipes, runs in its own thread:\n\n```\nsock.send(b'Message\
    \ from a queue: ' + bytes(str(idx).encode()) )\n```\n\nNote the b before the string\
    \ and then, well, all the rest of the required casting.\n\nWe start the TCP server\
    \ in its own thread in the initializer of the OOP class:\n\n```\nclass OOP():\n\
    \    def __init__(self):\n        # Start TCP/IP server in its own thread\n  \
    \      svrT = Thread(target=startServer, daemon=True)\n        svrT.start()\n\
    ```\n\nIn Python 3 we have to send strings over sockets in binary format. Adding\
    \ the integer index now becomes a little bit convoluted as we have to cast it\
    \ to a string, encode it, and then cast the encoded string into bytes!\n\nClicking\
    \ the Click Me! button on Tab 1 now creates the following output in our ScrolledText\
    \ widget as well as on the console, and the response due to the use of threads\
    \ is very fast:\n\nGUI_TCP_IP.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_222_0.png)"
