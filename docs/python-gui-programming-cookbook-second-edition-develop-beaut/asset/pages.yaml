  md: '# How it works...


    We created a Queue and placed messages into one side of the Queue in a FIFO fashion.
    We got the messages out of the Queue and then printed them to the console (stdout).


    We realized that we have to call the method in its own thread because, otherwise,
    our GUI might freeze.


    # Passing queues among different modules


    In this recipe, we will pass queues around different modules. As our GUI code
    increases in complexity, we want to separate the GUI components from the business
    logic, separating them out into different modules.


    Modularization gives us code reuse and also makes the code more readable.


    Once the data to be displayed in our GUI comes from different data sources, we
    will face latency issues, which is what queues solve. By passing instances of
    Queue among different Python modules, we are separating the different concerns
    of the modules'' functionalities.


    The GUI code ideally would only be concerned with creating and displaying widgets.
    The business logic modules'' job is only to do the business logic.


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_205_0.png)


    We have to combine the two elements, ideally using as few relations among the
    different modules as possible, reducing code interdependence.


    The coding principle of avoiding unnecessary dependencies is usually called loose
    coupling.


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_205_1.png)


    In order to understand the significance of loose coupling, we can draw some boxes
    on a whiteboard or a piece of paper. One box represents our GUI class and code
    while the other boxes represent business logic, databases, and so on.


    Next, we draw lines between the boxes, graphing out the interdependencies between
    those boxes which are our Python modules.'
  merge: -1
  img_proc: true
