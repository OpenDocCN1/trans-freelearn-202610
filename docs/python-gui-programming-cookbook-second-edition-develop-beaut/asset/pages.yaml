- pgno: 434
  md: "# Best Practices\n\nNext, we use a loop to create five tabs and add them to\
    \ each notebook:\n\n```\n```python\n# create and add tabs to Notebooks\nfor tab_no\
    \ in range(5):\n    tab1 = ttk.Frame(note1, width=0, height=0)             # Create\
    \ a tab for notebook 1\n    tab2 = ttk.Frame(note2, width=0, height=0)       \
    \      # Create a tab for notebook 2\n    note1.add(tab1, text='Tab {}'.format(tab_no\
    \ + 1))      # Add tab notebook 1\n    note2.add(tab2, text='Tab {}'.format(tab_no\
    \ + 1))      # Add tab notebook 2\n```\n```\n\nWe create a callback function and\
    \ bind the click event of the two notebooks to this callback function. Now, when\
    \ the user clicks on any tab belonging to the two notebooks, this callback function\
    \ will be called:\n\n```\n```python\n# bind click-events to Notebooks\nnote1.bind(\"\
    <ButtonRelease-1>\", notebook_callback)\nnote2.bind(\"<ButtonRelease-1>\", notebook_callback)\n\
    ```\n```\n\nIn the callback function, we add logic that decides which widgets\
    \ get displayed after clicking a tab:\n\n```\n```python\n#--------------------------------------------------\n\
    def notebook_callback(event):\n    clear_display_area()\n\n    current_notebook\
    \ = str(event.widget)\n    tab_no = str(event.widget.index(\"current\") + 1)\n\
    \n    if current_notebook.endswith('notebook'):\n        active_notebook = 'Notebook\
    \ 1'\n    elif current_notebook.endswith('notebook2'):\n        active_notebook\
    \ = 'Notebook 2'\n    else:\n        active_notebook = ''\n\n    if active_notebook\
    \ is 'Notebook 1':\n        if tab_no == '1': display_tab1()\n        elif tab_no\
    \ == '2': display_tab2()\n        elif tab_no == '3': display_tab3()\n       \
    \ else: display_button(active_notebook, tab_no)\n    else:\n        display_button(active_notebook,\
    \ tab_no)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 435
  md: "We add a function that creates a display area and another function that clears\
    \ the area:\n\nNote how the callback function calls the clear_display_area() function.\n\
    \n```\n#----------------------------------------\ndef create_display_area():\n\
    \    # add empty label for spacing\n    display_area_label = tk.Label(display_area,\
    \ text=\"\", height=2)\n    display_area_label.grid(column=0, row=0)\n\n#----------------------------------------\n\
    def clear_display_area():\n    # remove previous widget(s) from display_area:\n\
    \    for widget in display_area.grid_slaves():\n        if int(widget.grid_info()[\"\
    row\"]) == 0:\n            widget.grid_forget()\n```\n\nThe clear_display_area()\
    \ function knows both the row and column in which the widgets of tabs are being\
    \ created, and by finding row zero, we can then use grid_forget() to clear the\
    \ display.\n\nFor Tabs 1 to 3 of the first notebook, we create new frames to hold\
    \ more widgets. Clicking any of those three tabs then results in a GUI very similar\
    \ to the one we created in the previous recipe.\n\nThese first three tabs are\
    \ being invoked in the callback function as display_tab1(), display_tab2(), and\
    \ display_tab3() when those tabs are being clicked."
  merge: -1
  img_proc: true
- pgno: 436
  md: "Here is the code that runs when clicking on Tab 3 of the first notebook:\n\n\
    ```\n#----------------------------------------\ndef display_tab3():\n    monty3\
    \ = ttk.LabelFrame(display_area, text=' New Features ')\n    monty3.grid(column=0,\
    \ row=0, padx=8, pady=4)\n\n    # Adding more Feature Buttons\n    startRow =\
    \ 4\n    for idx in range(24):\n        if idx < 2:\n            colIdx = idx\n\
    \            col = colIdx\n        else:\n            col += 1\n        if not\
    \ idx % 3:\n            startRow += 1\n            col = 0\n\n        b = ttk.Button(monty3,\
    \ text=\"Feature \" + str(idx + 1))\n        b.grid(column=col, row=startRow)\n\
    \n    # Add some space around each label\n    for child in monty3.winfo_children():\n\
    \        child.grid_configure(padx=8)\n```\n\nClicking any tab other than the\
    \ first three tabs of notebook one calls the same function, display_button(),\
    \ which results in a button being displayed whose text property is being set to\
    \ show the notebook and tab number:\n\n```\n#----------------------------------------\n\
    def display_button(active_notebook, tab_no):\n    btn = ttk.Button(display_area,\
    \ text=active_notebook + ' - Tab ' + tab_no, \\\n                     command=\
    \ lambda: showinfo(\"Tab Display\", \"Tab: \" + tab_no ))\n    btn.grid(column=0,\
    \ row=0, padx=8, pady=8)\n```\n\nClicking any of these buttons results in a Message\
    \ box.\n\nAt the end of the code, we invoke the display_tab1() function. When\
    \ the GUI first starts up, the widgets of this tab are what get displayed in the\
    \ display area:"
