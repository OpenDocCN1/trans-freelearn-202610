- pgno: 179
  md: "Let's modify the code to set limits on both the $x$ and $y$ dimensions:\n\n\
    ```\nMatplotlib_labels_two_charts_scaled_dynamic.py\n\n    xValues   = [1,2,3,4]\n\
    \n    yValues0  = [6,7.5,8,7.5]\n    yValues1  = [5.5,6.5,50,6]          # one\
    \ very high value (50)\n    yValues2  = [6.5,7,8,7]\n\n    axis.set_ylim(0, 8)\
    \                 # lower limit (0)\n    axis.set_xlim(0, 8)                 #\
    \ use same limits for x\n```\n\nNow that we have set the same limits for $x$ and\
    \ $y$, our chart might look more balanced.\nWhen we run the modified code, we\
    \ get the following result:\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_179_0.png)\n\
    \nMaybe starting at (0, 0) was not such a great idea after all...\n\nWhat we really\
    \ want to do is adjust our chart dynamically according to the range of the data,\
    \ while at the same time restricting the values that are too high or too low.\n\
    \nWe can do this by parsing all the data to be represented in the chart while,\
    \ at the same time, setting some explicit limits."
  merge: -1
  img_proc: true
- pgno: 180
  md: "# Modify the code as follows:\n\n```\nMatplotlib_labels_two_charts_scaled_dynamic.py\n\
    \nxValues = [1,2,3,4]\n\nyValues0 = [6,7.5,8,7.5]\nyValues1 = [5.5,6.5,50,6] \
    \               # one very high value (50)\nyValues2 = [6.5,7,8,7]\nyAll = [yValues0,\
    \ yValues1, yValues2]   # list of lists\n\n# flatten list of lists retrieving\
    \ minimum value\nminY = min([y for yValues in yAll for y in yValues])\n\nyUpperLimit\
    \ = 20\n# flatten list of lists retrieving max value within defined limit\nmaxY\
    \ = max([y for yValues in yAll for y in yValues if y <\n            yUpperLimit])\n\
    \n# dynamic limits\naxis.set_ylim(minY, maxY)\naxis.set_xlim(min(xValues), max(xValues))\n\
    \nt0, = axis.plot(xValues, yValues0)\nt1, = axis.plot(xValues, yValues1)\nt2,\
    \ = axis.plot(xValues, yValues2)\n```\n\nRunning the code results in the following\
    \ chart. We adjusted both its x and y dimensions dynamically. Note how the y-dimension\
    \ now starts at 5.5 instead of 5.0, as it did before. The chart also no longer\
    \ starts at (0, 0), giving us more valuable information about our data:\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_180_0.png)"
  merge: -1
  img_proc: true
- pgno: 181
  md: "We are creating a list of lists for the y-dimension data and then using a list\
    \ comprehension wrapped into a call to Python's min() and max() functions.\n\n\
    If list comprehensions seem to be a little bit advanced, what they basically are\
    \ is a very compressed loop.\n\nThey are also designed to be faster than a regular\
    \ programming loop.\n\nIn the preceding Python code, we created three lists that\
    \ hold the y-dimensional data to be plotted. We then created another list that\
    \ holds those three lists, which creates a list of lists, as follows:\n\n```\n\
    yValues0 = [6,7.5,8,7.5]\nyValues1 = [5.5,6.5,50,6]        # one very high value\
    \ (50)\nyValues2 = [6.5,7,8,7]\nyAll = [yValues0, yValues1, yValues2]  # list\
    \ of lists\n```\n\nWe are interested in getting both the minimum value of all\
    \ of the y-dimensional data and the maximum value contained within these three\
    \ lists.\n\nWe can do this via a Python list comprehension:\n\n```\n# flatten\
    \ list of lists retrieving minimum value\nminY = min([y for yValues in yAll for\
    \ y in yValues])\n```\n\nAfter running the list comprehension, minY is 5.5.\n\n\
    The preceding line of code is the list comprehension that runs through all the\
    \ values of all the data contained within the three lists and finds the minimum\
    \ value using the Python min keyword.\n\nIn the very same pattern, we find the\
    \ maximum value contained in the data we wish to plot. This time, we'll also set\
    \ a limit within our list comprehension, which ignores all the values that are\
    \ above the limit we specified, as follows:\n\n```\nyUpperLimit = 20\n# flatten\
    \ list of lists retrieving max value within defined limit\nmaxY = max([y for yValues\
    \ in yAll for y in yValues if y <\n            yUpperLimit])\n```"
  merge: -1
  img_proc: true
- pgno: 182
  md: 'After running the preceding code with our chosen restriction, maxY has the
