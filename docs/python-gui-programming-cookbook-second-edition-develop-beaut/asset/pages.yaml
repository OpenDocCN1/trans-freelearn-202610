  md: "One important element to note is that we create a thread to run the wxPython\
    \ app.MainLoop, as we did in the previous recipe:\n\n```\ndef wxPythonApp():\n\
    \    app = wx.App()\n    frame = wx.Frame(None, ,\n                    size=(300,180))\n\
    \    GUI(frame)\n    frame.Show()\n    runT = Thread(target=app.MainLoop)\n  \
