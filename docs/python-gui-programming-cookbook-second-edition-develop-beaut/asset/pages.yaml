- pgno: 68
  md: '![](img/986b0dbf3f539f4f3baa82bd3003f04e_68_0.png)


    +   - Java introduced the concept of dynamic GUI layout management. In comparison,
    visual development IDEs, such as VS.NET, lay out the GUI in a visual manner, and
    basically hardcode the x and y coordinates of the UI elements.

    +   - Using tkinter, this dynamic capability creates both an advantage and a little
    bit of a challenge because sometimes our GUI dynamically expands when we would
    rather it not be so dynamic! Well, we are dynamic Python programmers, so we can
    figure out how to make the best use of this fantastic behavior!


    # Getting ready


    In the beginning of the previous recipe, Using padding to add space around widgets,
    we added a LabelFrame widget. This moved some of our controls to the center of
    column 0. We might not want this modification in our GUI layout. Next, we will
    explore some ways to solve this.


    # How to do it...


    Let''s first become aware of the subtle details that are going on in our GUI layout
    in order to understand it better.


    We are using the grid layout manager widget, and it lays out our widgets in a
    zero-based grid. This is very similar to an Excel spreadsheet or a database table.


    The following is an example of a grid layout manager with two rows and three columns:


    | Row 0; Col 0 | Row 0; Col 1 | Row 0; Col 2 |

    |---|---|---|

    | Row 1; Col 0 | Row 1; Col 1 | Row 1; Col 2 |


    Using the grid layout manager, what happens is that the width of any given column
    is determined by the longest name or widget in that column. This affects all the
    rows.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'By adding our `LabelFrame` widget and giving it a title that is longer than
    some hardcoded size widget, such as the top-left label and the text entry below
    it, we dynamically move those widgets to the **center** of column 0, adding space
    on the left- and right-hand side of those widgets.


    Incidentally, because we used the `sticky` property for the Checkbutton and `ScrolledText`
    widgets, those remain attached to the left-hand side of the frame.


    Let’s look in more detail at the screenshot from the first recipe of this chapter,
    *Arranging several labels within a label frame widget:*


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_69_0.png)


    We added the following code to create `LabelFrame` and then placed labels into
    this frame:


    ```

    ```python

    # Create a container to hold labels

    buttons_frame = ttk.LabelFrame(win, text='' Labels in a Frame '')

    buttons_frame.grid(column=0, row=7)

    ```

    ```


    Since the text property of the LabelFrame, which is displayed as the title of
    the LabelFrame, is longer than both our **Enter a name:** label and the textbox
    entry below it, those two widgets are dynamically centered within the new width
    of column 0.


    The Checkbutton and Radiobutton widgets in column 0 did not get centered because
    we used the `sticky=tk.W` property when we created those widgets.


    For the `ScrolledText` widget, we used `sticky=tk.WE`, which binds the widget
    to both the west (aka left) and east (aka right) side of the frame.'
  merge: -1
  img_proc: true
