- pgno: 59
  md: '# 2


    # Layout Management


    In this chapter, we will lay out our GUI using Python 3.6 and above. We will cover
    the following recipes:


    +   - Arranging several labels within a label frame widget

    +   - Using padding to add space around widgets

    +   - How widgets dynamically expand the GUI

    +   - Aligning the GUI widgets by embedding frames within frames

    +   - Creating menu bars

    +   - Creating tabbed widgets

    +   - Using the grid layout manager


    # Introduction


    In this chapter, we will explore how to arrange widgets within widgets to create
    our Python GUI. Learning the fundamentals of GUI layout design will enable us
    to create great-looking GUIs. There are certain techniques that will help us in
    achieving this layout design.


    The grid layout manager is one of the most important layout tools built into tkinter
    that we will be using.


    We can very easily create menu bars, tabbed controls (aka Notebooks), and many
    more widgets using tkinter.'
  merge: -1
  img_proc: true
