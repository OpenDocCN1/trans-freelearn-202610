- pgno: 215
  md: "As we are not all on the same network, this recipe will use the local hard\
    \ drive as an example for a network.\n\nA UNC path is a **Universal Naming Convention\
    \ (UNC)** and what this means is that by using double backslashes instead of the\
    \ typical `C:\\`, we can access a server on a network.\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_215_0.png)\n\
    \nYou just have to use the UNC and replace `C:\\` with `\\\\<servername>\\<folder>`.\n\
    \nThis example can be used to back up our code to a backup directory, which we\
    \ can create if it does not exist by using `os.makedirs`:\n\n```\n```python\n\
    # Module level GLOBALS\nGLOBAL_CONST = 42\n\nfrom os import makedirs\nfDir   =\
    \ path.dirname(__file__)\nnetDir = fDir + 'Backup'\nif not path.exists(netDir):\n\
    \    makedirs(netDir, exist_ok = True)\n```\n```\n\nAfter selecting a file to\
    \ copy to somewhere else, we import the Python shutil module. We need the full\
    \ path to the source of the file to be copied and a network or local directory\
    \ path, and then we append the file name to the path where we will copy it, using\
    \ `shutil.copy`.\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_215_1.png)\n\nShutil\
    \ is short-hand notation for shell utility.\n\nWe also give feedback to the user\
    \ via a message box to indicate whether the copying succeeded or failed. In order\
    \ to do this, import `messagebox` and alias it `msg`.\n\nIn the next code, we\
    \ will mix two different approaches of where to place our import statements. In\
    \ Python, we have some flexibility that other languages do not provide. We typically\
    \ place all of the import statements towards the very top of each of our Python\
    \ modules so that it is clear which modules we are importing. At the same time,\
    \ a modern coding approach is to place the creation of variables close to the\
    \ function or method where they are first being used."
  merge: -1
  img_proc: true
- pgno: 216
  md: "In the next code, we import the message box at the top of our Python module,\
    \ but then we also import the shutil Python module in a function. Why would we\
    \ wish to do this? Does this even work? The answer is yes, it does work, and we\
    \ are placing this import statement into a function because this is the only place\
    \ in our code where we actually do need this module.\n\nIf we never call this\
    \ method then we will never import the module this method requires. In a sense,\
    \ you can view this technique as the lazy initialization design pattern. If we\
    \ don't need it, we don't import it until we really do require it in our Python\
    \ code. The idea here is that our entire code might require, let's say, 20 different\
    \ modules. At runtime, which modules are really needed depends upon the user interaction.\
    \ If we never call the copyFile() function, then there is no need to import shutil.\n\
    \nOnce we click the button that invokes the copyFile() function in this function,\
    \ we import the required module:\n\n```\nfrom tkinter import messagebox as msg\n\
    def copyFile():\n    import shutil                #import module within function\n\
    \    src = self.fileEntry.get()\n    file = src.split('/')[-1]\n    dst = self.netwEntry.get()\
    \ + '/' + file\n    try:\n        shutil.copy(src, dst)\n        msg.showinfo('Copy\
    \ File to Network', 'Succes: File copied.')\n    except FileNotFoundError as err:\n\
    \        msg.showerror('Copy File to Network',\n            '*** Failed to copy\
    \ file! ***\\n\\n' + str(err))\n    except Exception as ex:\n        msg.showerror('Copy\
    \ File to Network',\n            '*** Failed to copy file! ***\\n\\n' + str(ex))\n\
    ```"
  merge: -1
