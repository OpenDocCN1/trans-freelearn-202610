    \ then we create our own class and, within this class, we inherit and extend the\
    \ unittest.TestCase class.\n\nThe simplest code to do it looks as follows:\n\n\
    ```\nimport unittest\n\nclass GuiUnitTests(unittest.TestCase):\n    pass\n\nif\
    \ __name__ == '__main__':\n```"
