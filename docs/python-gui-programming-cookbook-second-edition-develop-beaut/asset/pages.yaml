  md: "In the following code snippet, I have copied some code from the http://matplotlib.org/\
    \ website, which creates this incredible chart. I have also added some comments\
    \ to the code. There are many examples available on this site, and I encourage\
    \ you to try them out until you find the kind of charts you would like to create.\n\
    \nHere is the code to create the chart in less than 25 lines of Python code, including\
    \ white spaces:\n\n```\nfrom mpl_toolkits.mplot3d import Axes3D\nfrom matplotlib\
    \ import cm\nfrom matplotlib.ticker import LinearLocator, FormatStrFormatter\n\
    import matplotlib.pyplot as plt\nimport numpy as np\n\nfig = plt.figure()    \
    \                                # create a figure\nax = fig.gca(projection='3d')\
    \                        # create a 3-dimensional axis\nX = np.arange(-5, 5, 0.25)\
    \                            # horizontal range\nY = np.arange(-5, 5, 0.25)  \
    \                          # vertical range\nX, Y = np.meshgrid(X, Y)        \
    \                      # create a special grid\nR = np.sqrt(X**2 + Y**2)     \
    \                         # calculate square root\nZ = np.sin(R)             \
    \                            # calculate sinus\n\n## use #@UndefinedVariable below\
    \ to ignore the error for cm.coolwarm\nsurf = ax.plot_surface(X, Y, Z, rstride=1,\
    \ cstride=1,\n                       cmap=cm.coolwarm, linewidth=0,\n        \
    \               antialiased=False)\nax.set_zlim(-1.01, 1.01)                 \
    \             # z-axis is third dimension\n\nax.zaxis.set_major_locator(LinearLocator(10))\n\
    ax.zaxis.set_major_formatter(FormatStrFormatter('%.02f'))\n\nfig.colorbar(surf,\
    \ shrink=0.5, aspect=5)\n\nplt.show()                                        \
    \    # display the figure\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_156_0.png)\n\
    \nRunning the code using Python 3.6 or above with the Eclipse PyDev plugin might\
    \ show some unresolved import and variable errors. You can simply disable these\
