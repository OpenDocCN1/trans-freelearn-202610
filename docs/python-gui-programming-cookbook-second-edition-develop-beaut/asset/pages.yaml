- pgno: 104
  md: '# Look and Feel Customization


    For example, consider the following code snippet:


    ```

    from tkinter import messagebox as msg

    from tkinter import Tk

    root = Tk()

    root.withdraw()

    msg.showinfo(''This is a Title'', ''Python GUI created using tkinter:\nThe year
    is 2017'')

    ```


    Now our dialog has a title, as shown in the following screenshot:


    GUI_independent_msg_one_window_title.py


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_104_0.png)


    # How it works…


    We are passing more arguments into the tkinter constructor of the message box
    to add a title to the window form and display the text in the message box instead
    of displaying it as its title. This happens due to the position of the arguments
    we are passing. If we leave out an empty quote or a double quote, then the message
    box widget takes the first position of the arguments as the title, not the text
    to be displayed within the message box. By passing an empty quote followed by
    a comma, we change where the message box displays the text we are passing into
    the function.


    We suppress the second pop-up window, which automatically gets created by the
    tkinter message box widget, by calling the withdraw() method on our main root
    window.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# How to create the title of a tkinter window form


    The principle of changing the title of a tkinter main root window is the same
    as what we discussed in the previous recipe: How to create independent message
    boxes. We just pass in a string as the first argument to the constructor of the
    widget.


    # Getting ready


    Instead of a pop-up dialog window, we create the main root window and give it
    a title.


    # How to do it...


    The following code creates the main window and adds a title to it. We have already
    done this in the previous recipes, for example, in Creating tabbed widgets, in
    Chapter 2, Layout Management. Here we just focus on this aspect of our GUI:


    ```

    import tkinter as tk

    win = tk.Tk()      # Create instance

    win.title("Python GUI")  # Add a title

    ```


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_105_0.png)


    # How it works...


    This gives a title to the main root window by using the built-in tkinter title
    property. After we create a Tk() instance, we can use all the built-in tkinter
    properties to customize our GUI.'
  merge: -1
  img_proc: true
