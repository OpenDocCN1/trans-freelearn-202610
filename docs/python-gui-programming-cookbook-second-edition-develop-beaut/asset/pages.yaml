- pgno: 304
  md: 'Setting debug watches is a very convenient way to help our development efforts.


    # Getting ready


    In this recipe, we will reuse the Python GUI we developed in the earlier recipes.
    We will step through the code we had previously developed, and we will set debug
    watches.


    # How to do it...


    While this recipe applies to the PyDev plugin in the Java-based Eclipse IDE, its
    principles also apply to many modern IDEs.


    The first position where we might wish to place a breakpoint is at the place where
    we make our GUI visible by calling the tkinter main event loop.


    The green balloon symbol on the left is a breakpoint in PyDev/Eclipse. When we
    execute our code in debug mode, the execution of the code will be halted once
    the execution reaches the breakpoint. At this point, we can see the values of
    all the variables that are currently in scope. We can also type expressions into
    one of the debugger windows, which will execute them, showing us the results.
    If the result is what we want, we might decide to change our code using what we
    have just learned.


    We normally step through the code by either clicking an icon in the toolbar of
    our IDE or by using a keyboard shortcut (such as pressing F5 to step into code,
    F6 to step over, and F7 to step out of the current method):


    GUI.py


    ```

    #===================

    # Start GUI

    #===================

    oop = OOP()

    oop.win.mainloop()

    ```'
