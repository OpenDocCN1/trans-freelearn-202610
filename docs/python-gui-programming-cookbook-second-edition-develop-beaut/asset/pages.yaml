- pgno: 39
  md: '# # Getting ready


    This recipe extends the previous one, *Adding a label to the GUI form*. You can
    download the entire code from `https://github.com/PacktPublishing/Python-GUI-Programming-Cookbook-Second-Edition/`.


    # # How to do it…


    We add a button that, when clicked, performs an action. In this recipe, we will
    update the label we added in the previous recipe as well as the text property
    of the button:


    `GUI_create_button_change_property.py`


    ```

    18  # Adding a Label that will get modified

    19  a_label = ttk.Label(win, text="A Label")

    20  a_label.grid(column=0, row=0)

    21

    22  # Button Click Event Function

    23  def click_me():

    24      action.configure(text=''*** I have been Clicked! ***'')

    25      a_label.configure(foreground=''red'')

    26      a_label.configure(text=''A Red Label'')

    27

    28  # Adding a Button

    29  action = ttk.Button(win, text=''Click me!'', command=click_me)

    30  action.grid(column=1, row=0)

    31

    32  #====================

    33  # Start GUI

    34  #====================

    35  win.mainloop()

    ```


    The following screenshot shows how our GUI looks before clicking the button:


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_39_0.png)'
