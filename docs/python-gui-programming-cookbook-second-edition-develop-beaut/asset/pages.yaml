- pgno: 147
  md: 'However, we can use a leading underscore prefix with a variable name or function
    to provide a hint that this name is meant to be respected as a private helper.


    At the same time, we can postfix a single underscore if we wish to use what otherwise
    would be built-in Python names. For example, if we wished to abbreviate the length
    of a list, we could do the following:


    ```

    len_ = len(aList)

    ```


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_147_0.png)


    Often, the underscore is hard to read and easy to oversee, so this might not be
    the best idea in practice.


