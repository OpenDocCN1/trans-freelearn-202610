- pgno: 55
  md: 'Once we type in more words than the height the widget can display, the vertical
    scrollbar becomes enabled. This all works out-of-the-box without us needing to
    write any more code to achieve this:


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_55_0.png)


    # How it works...


    In line 11, we import the module that contains the ScrolledText widget class.
    Add this to the top of the module, just below the other two import statements.


    Lines 100 and 101 define the width and height of the ScrolledText widget we are
    about to create. These are hardcoded values we are passing into the ScrolledText
    widget constructor in line 102.


    These values are magic numbers found by experimentation to work well. You might
    experiment by changing scol_w from 30 to 50 and observe the effect!


    In line 102, we are also setting a property on the widget by passing in wrap=tk.WORD.


    By setting the wrap property to tk.WORD we are telling the ScrolledText widget
    to break lines by words so that we do not wrap around within a word. The default
    option is tk.CHAR, which wraps any character regardless of whether we are in the
    middle of a word.


    The second screenshot shows that the vertical scrollbar moved down because we
    are reading a longer text that does not entirely fit into the x, y dimensions
    of the SrolledText control we created.


    Setting the columnspan property of the grid widget to 3 for the SrolledText widget
    makes this widget span all the three columns. If we do not set this property,
    our SrolledText widget would only reside in column one, which is not what we want.'
  merge: -1
  img_proc: true
- pgno: 56
  md: "# Adding several widgets in a loop\n\nSo far, we have created several widgets\
    \ of the same type (for example, Radiobutton) by basically copying and pasting\
    \ the same code and then modifying the variations (for example, the column number).\
    \ In this recipe, we start refactoring our code to make it less redundant.\n\n\
    # Getting ready\n\nWe are refactoring some parts of the previous recipe's code,\
    \ Using scrolled text widgets, so you need that code to apply this recipe to.\n\
    \n# How to do it...\n\nHere's how we refactor our code:\n\nGUI_adding_widgets_in_loop.py\n\
    \n```\n76 # First, we change our Radiobutton global variables into a list\n77\
    \ colors = [\"Blue\", \"Gold\", \"Red\"]\n78 \n79 # We have also changed the callback\
    \ function to be zero-based, using the list\n80 # instead of module-level global\
    \ variables\n81 # Radiobutton Callback\n82 def radCall():\n83     radSel=radVar.get()\n\
    84     if  radSel == 0: win.configure(background=colors[0])  # now zero-based\n\
    85     elif radSel == 1: win.configure(background=colors[1])  # and using list\n\
    86     elif radSel == 2: win.configure(background=colors[2])\n87 \n88 # create\
    \ three Radiobuttons using one variable\n89 radVar = tk.IntVar()\n90 \n91 # Next\
    \ we are selecting a non-existing index value for radVar\n92 radVar.set(99)\n\
    93 \n94 # Now we are creating all three Radiobutton widgets within one loop\n\
    95 for col in range(3):\n96     curRad = tk.Radiobutton(win, text=colors[col],\
    \ variable=radVar,\n97                             value=col, command=radCall)\n\
    98     curRad.grid(column=col, row=5, sticky=tk.W)\n99\n```"
  merge: -1
  img_proc: true
- pgno: 57
  md: 'Running this code will create the same window as before, but our code is much
    cleaner and easier to maintain. This will help us when we expand our GUI in the
    coming recipes.


    # How it works...


    In line 77, we have turned our global variables into a list.


    In line 89, we set a default value to the tk.IntVar variable that we named radVar.
    This is important because, while in the previous recipe we had set the value for
    Radiobutton widgets starting at 1, in our new loop it is much more convenient
    to use Python''s zero-based indexing. If we did not set the default value to a
    value outside the range of our Radiobutton widgets, one of the radio buttons would
    be selected when the GUI appears. While this in itself might not be so bad, it
    would not trigger the callback and we would end up with a radio button selected
    that does not do its job (that is, change the color of the main win form).


    In line 95, we replace the three previously hardcoded creations of the Radiobutton
    widgets with a loop that does the same. It is just more concise (fewer lines of
    code) and much more maintainable. For example, if we want to create 100 instead
    of just three Radiobutton widgets, all we have to change is the number inside
    Python''s range operator. We would not have to type or copy and paste 97 sections
    of duplicate code, just one number.


    Line 82 shows the modified callback function.


    # There''s more...


    This recipe concludes the first chapter of this book. All the following recipes
    in all of the next chapters will build upon the GUI we have constructed so far,
    greatly enhancing it.'
  merge: -1
  img_proc: true
