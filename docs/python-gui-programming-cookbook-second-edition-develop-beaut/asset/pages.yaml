- pgno: 165
  md: 'We can simplify the code and even improve it by using another of the many examples
    provided on the official `Matplotlib` website. The `pylab` module comes with its
    own plotting function, so we do not need to import `matplotlib`, after all, if
    we wish to simplify the code:


    ```

    Matplotlib_second_chart.py

    ```


    ```

    ```python

    from pylab import show, arange, sin, plot, pi


    t = arange(0.0, 2.0, 0.01)

    s = sin(2 * pi * t)

    plot(t, s)


    show()

    ```

    ```


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_165_0.png)


    # How it works…


    The Python `Matplotlib` module, combined with add-ons such as `numpy`, creates
    a very rich programming environment that enables us to perform mathematical computations
    and plot them in visual charts very easily.


    The `arange` method of `numpy` does not intend to arrange anything. It means to
    create a range, which is used instead of Python''s built-in `range` operator.
    The `linspace` method can create a similar confusion. Who is *lin* and in what
    *space*?


    As it turns out, the name means *linear spaced vector*.


    The `pyglet` function show displays the graph we created. Calling `show()` has
    some side effects when you try to plot another graph after successfully creating
    the first one.'
