    # # Using urlopen to read data from websites


    This recipe shows how we can easily read entire web pages by using Python''s built-in
    modules. We will display the web page data first in its raw format and then decode
    it, and then we will display it in our GUI.


    # # Getting ready


    We will read the data from a webpage and then display it in the `ScrolledText`
    widget of our GUI.


    # # How to do it...


    First, we create a new Python module and name it `URL.py`. We then import the
    required functionality to read webpages using Python. We can do this in very few
    lines of code.


    We wrap our code in a `try...except` block similar to Java and C#. This is a modern
    approach to coding, which Python supports. Whenever we have code that might not
    complete, we can experiment with this code and, if it works, all is fine. If the
    block of code in the `try...except` block does not work, the Python interpreter
    will throw one of several possible exceptions, which we can then catch. Once we
    have caught the exception, we can decide what to do next.


    There is a hierarchy of exceptions in Python and we can also create our own classes
    that inherit from and extend the Python exception classes. In the following code,
    we are mainly concerned that the URL we are trying to open might not be available
    so, we wrap our code within a `try...except` code block. If the code succeeds
    in opening the requested URL, all is fine. If it fails, maybe because our Internet
    connection is down, we fall into the exception part of the code and print out
    that an exception has occurred:


    ```

    from urllib.request import urlopen

    link = ''http://python.org/''

    ```'
  merge: -1
  img_proc: true
