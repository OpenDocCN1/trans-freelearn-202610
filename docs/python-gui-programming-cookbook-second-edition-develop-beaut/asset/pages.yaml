  md: '# Displaying widget text in different languages


    The easiest way to internationalize text strings in Python is by moving them into
    a separate Python module and then selecting the language to be displayed in our
    GUI by passing in a parameter to this module.


    While this approach is not highly recommended, according to online search results,
    depending on the specific requirements of the application you are developing,
    this approach might still be the most pragmatic and fastest to implement.


    # Getting ready


    We will reuse the Python GUI we created earlier. We have commented out one line
    of Python code that creates the MySQL tab because we do not talk to a MySQL database
    in this chapter.


    # How to do it...


    In this recipe, we will start the I18N of our GUI by changing the Windows title
    from English to another language.


    As the name GUI is the same in other languages, we will first expand the name
    which enables us to see the visual effects of our changes.


    The following was our previous line of code:


    ```

    self.win.title("Python GUI")

    ```


    Let''s change this to the following:


    ```

    self.win.title("Python Graphical User Interface")

    ```'
  merge: -1
  img_proc: true
- pgno: 278
  md: "The preceding code change results in the following title for our GUI program:\n\
    \n```\nGUI_Refactored.py\n```\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_278_0.png)\n\
    \n> In this chapter, we will use English and German to exemplify the principle\
    \ of internationalizing our Python GUI.\n\nHardcoding strings into code is never\
    \ too good an idea, so the first thing we can do to improve our code is to separate\
    \ all the strings that are visible in our GUI into a Python module of their own.\
    \ This is the beginning of internationalizing the visible aspects of our GUI.\n\
    \n> While we are into I18N, we will do this very positive refactoring and language\
    \ translation, all in one step.\n\nLet's create a new Python module and name it\
    \ `LanguageResources.py`. Let's next move the English string of our GUI title\
    \ into this module and then import this module into our GUI code.\n\n> We are\
    \ separating the GUI from the languages it displays, which is an OOP design principle.\n\
    \nOur new Python module, containing internationalized strings, now looks as follows:\n\
    \n```\nclass I18N():\n    '''Internationalization'''\n    def __init__(self, language):\n\
    \        if language == 'en': self.resourceLanguageEnglish()\n        elif language\
    \ == 'de': self.resourceLanguageGerman()\n        else: raise NotImplementedError('Unsupported\
    \ language.')\n\n    def resourceLanguageEnglish(self):\n```"
  merge: -1
  img_proc: true
- pgno: 279
  md: "```\n```python\nself.title = \"Python Graphical User Interface\"\n\ndef resourceLanguageGerman(self):\n\
    \    self.title = 'Python Grafische Benutzeroberflaeche'\n```\n```\n\nWe import\
    \ this new Python module into our main Python GUI code, and then use it:\n\n```\n\
    ```python\nfrom Ch08_Code.LanguageResources import I18N\nclass OOP():\n    def\
    \ __init__(self):\n        self.win = tk.Tk()                  # Create instance\n\
    \        self.i18n = I18N('de')              # Select language\n        self.win.title(self.i18n.title)\
    \     # Add a title\n```\n```\n\nDepending on which language we pass into the\
    \ I18N class, our GUI will be displayed in that language.\n\nRunning the above\
    \ code, we now get the following internationalized result:\n\nGUI.py\n\n![](img/986b0dbf3f539f4f3baa82bd3003f04e_279_0.png)\n\
    \n# How it works...\n\nWe break out the hardcoded strings that are part of our\
    \ GUI into their own separate modules. We do this by creating a class, and within\
    \ the class's `__init__()` method, we select which language our GUI will display,\
