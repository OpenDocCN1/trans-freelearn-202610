    ```\n\nIn wxPython, the tabbed widget is named Notebook, just as in tkinter.\n\
    \nEvery Notebook widget needs to have a parent and, in order to lay out widgets\
    \ in the Notebook in wxPython, we use different kinds of sizers.\n\nwxPython sizers\
    \ are layout managers, similar to tkinter's grid layout manager.\n\nNext, we add\
    \ controls to our Notebook page, and we do this by creating a separate class that\
    \ inherits from wx.Panel:\n\n```\nclass Widgets(wx.Panel):\n    def __init__(self,\
    \ parent):\n        wx.Panel.__init__(self, parent)\n        self.createWidgetsFrame()\n\
    \        self.addWidgets()\n        self.layoutWidgets()\n```"
