- pgno: 420
  md: 'Incrementing module names by numbers is not very meaningful and eventually
    wastes development time.


    On the other hand, naming Python variables is more of a free form. Python infers
    types, so we do not have to specify that a variable will be of type `<list>` (it
    might not be, or later in the code, it might become a different type).


    A good idea for naming variables is to make them descriptive and it is also a
    good idea not to abbreviate too much.


    If we wish to point out that a certain variable is designed to be of the `<list>`
    type, then it is much more intuitive to use the full word `list` instead of `lst`.


    It is similar for `number` instead of `num`.


    While it is a good idea to have very descriptive names for variables, sometimes
    that can get too long. In Apple''s Objective-C language, some variable and function
    names are extreme:


    ```

    thisIsAMethodThatDoesThisAndThatAndAlsoThatIfYouPassInNIntegers:1:2:3

    ```


    Use common sense when naming variables, methods, and functions.


    # When not to use OOP


    Python comes builtin with object-oriented programming capabilities, but at the
    same time, we can write scripts that do not need to use OOP. For some tasks, OOP
    does not make sense.


    This recipe will show us when not to use OOP.


    # Getting ready


    In this recipe, we will create a Python GUI similar to the previous recipes. We
    will compare the OOP code to the non-OOP alternative way of programming.'
