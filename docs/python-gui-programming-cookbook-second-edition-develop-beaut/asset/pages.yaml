- pgno: 346
  md: 'Whatever code we place between the creation of the app and calling its main
    event loop, becomes our wxPython GUI. It might take some time to really get used
    to the wxPython library and its API, but once we understand how to use it, this
    library is really fun and a powerful tool to build our own Python GUIs. There
    is also a visual designer tool that can be used with wxPython:

    http://www.cae.tntech.edu/help/programming/wxdesigner-getting-started/view


    This recipe used OOP to learn how to use the wxPython GUI toolkit.


    # Trying to embed a main wxPython app in a main tkinter app


    Now that we have created the same GUI using both Python''s built-in tkinter library
    as well as the wxPython wrapper of the wxWidgets library, we really do need to
    combine the GUIs we created using these technologies.


    Both the wxPython and the tkinter libraries have their own advantages. In online
    forums such as http://stackoverflow.com/, we often see questions, such as which
    one is better, which GUI toolkit should I use, and so on. This suggests that we
    have to make an either-or decision. We do not have to make such a decision.


    One of the main challenges in doing so is that each GUI toolkit must have its
    own event loop.


    In this recipe, we will try to embed a simple wxPython GUI by calling it from
    our tkinter GUI.


    # Getting ready


    We will reuse the tkinter GUI we built in the recipe Combo Box Widgets, in Chapter
    1, Creating the GUI Form and Adding Widgets.'
