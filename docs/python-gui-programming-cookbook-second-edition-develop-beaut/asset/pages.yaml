- pgno: 308
  md: '# How it works…


    We use modern Integrated Development Environments (IDEs) in the 21st century that
    are freely available to help us to create solid code.


    This recipe showed how to set debug watches, which is a fundamental tool in every
    developer''s skill set. Stepping through our own code even when not hunting down
    bugs ensures that we understand our code, and it can lead to improving our code
    via refactoring.


    The following is a quote from the first programming book I read, *Thinking in
    Java*, written by Bruce Eckel.


    > > “Resist the Urge to Hurry, it will only slow you down.”

    > >

    > > — Bruce Eckel


    Almost two decades later, this advice has passed the test of time.


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_308_0.png)


    Debug watches help us create solid code and is not a waste of time.


    # Configuring different debug output levels


    In this recipe, we will configure different debug levels, which we can select
    and change at runtime. This allows us to control how much we want to drill down
    into our code when debugging our code.


    We will create two new Python classes and place both of them into the same module.


    We will use four different logging levels and write our debugging output to a
    log file we will create. If the logs folder does not exist, we will create it
    automatically as well.


    The name of the log file is the name of the executing script, which is our refactored
    GUI.py. We can also choose other names for our log files by passing in the full
    path to the initializer of our Logger class.


    # Getting ready


    We will continue using our refactored GUI.py code from the previous recipe.'
  merge: -1
  img_proc: true
- pgno: 309
  md: "# How to do it...\n\nFirst, we create a new Python module into which we place\
    \ two new classes. The first class is very simple and defines the logging levels.\
    \ This is basically an enumeration:\n\n```\nclass LogLevel:\n'''Define logging\
    \ levels.'''\n    OFF      = 0\n    MINIMUM  = 1\n    NORMAL   = 2\n    DEBUG\
    \    = 3\n```\n\nThe second class creates a log file by using the passed-in full\
    \ path of the file name and places this into a logs folder. On the first run,\
    \ the logs folder might not exist, so the code automatically creates the folder:\n\
    \n```\nimport os, time\nfrom datetime import datetime\nclass Logger:\n    '''\
    \ Create a test log and write to it. '''\n    #------------------------------------------------------------\n\
    \    def __init__(self, fullTestName, loglevel=LogLevel.DEBUG):\n        testName\
    \ = os.path.splitext(os.path.basename(fullTestName))[0]\n        logName  = testName\
    \ + '.log'\n\n        logsFolder = 'logs'\n        if not os.path.exists(logsFolder):\n\
    \            os.makedirs(logsFolder, exist_ok = True)\n\n        self.log = os.path.join(logsFolder,\
    \ logName)\n        self.createLog()\n\n        self.loggingLevel = loglevel\n\
    \        self.startTime    = time.perf_counter()\n\n    #------------------------------------------------------------\n\
    \    def createLog(self):\n        with open(self.log, mode='w', encoding='utf-8')\
    \ as logFile:\n            logFile.write(self.getDateTime() +\n              \
    \            '\\t\\t*** Starting Test ***\\n')\n        logFile.close()\n```\n\
    \nIn order to write to our log file, we use the writeToLog() method. Inside the\
    \ method, the first thing we do is check whether the message has a logging level\
    \ higher than the limit we set our desired logging output to. If the message has\
    \ a lower level, we discard it and immediately return from the method."
  merge: -1
  img_proc: true
- pgno: 310
  md: "If the message has the logging level that we want to display, we then check\
    \ whether it starts with a newline character, and if it does, we discard the newline\
    \ by slicing the method starting at index 1, using Python’s slice operator (`msg\
    \ = msg[1:]`).\n\nWe then write one line to our log file consisting of the current\
    \ date timestamp, two tab spaces, our message, and ending in a newline character:\n\
    \n```\n```python\n#--------------------------------------------------\ndef writeToLog(self,\
    \ msg='', loglevel=LogLevel.DEBUG):\n    # control how much gets logged\n    if\
    \ loglevel > self.loggingLevel:\n        return\n\n    # open log file in append\
    \ mode\n    with open(self.log, mode='a', encoding='utf-8') as logfile:\n    \
    \    msg = str(msg)\n        if msg.startswith('\\\\n'):\n            msg = msg[1:]\n\
    \        logfile.write(self.getDateTime() + '\\\\t\\\\t' + msg + '\\\\n')\n\n\
    \    logfile.close()\n```\n```\n\nWe can now import our new Python module and,\
    \ inside the `__init__` section of our GUI code, can create an instance of the\
    \ Logger class:\n\n```\n```python\nfrom os import path\nfrom Ch08_Code.Logger\
    \ import Logger\nclass OOP():\n    def __init__(self):\n        # create Logger\
    \ instance\n        fullPath = path.realpath(__file__)\n        self.log = Logger(fullPath)\n\
    \        print(self.log)\n```\n```\n\nWe are retrieving the full path to our running\
    \ GUI script via `path.realpath(__file__)` and passing this into the initializer\
    \ of the Logger class. If the logs folder does not exist, it will automatically\
    \ be created by our Python code.\n\nThis creates the following results:\n\n`Callbacks_Refactored.py`\
    \ with `print(self.log)` uncommented"
  merge: -1
  img_proc: true
