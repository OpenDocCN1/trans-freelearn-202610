- pgno: 244
  md: 'We will create two SQL tables to hold our data. The first will hold the data
    for the book title and book page, and then, we will join with the second table,
    which will hold the book quotation. We will link the two tables together via primary
    to foreign key relations.


    So, let''s create the first database table now. Before we do that, let''s verify
    first that our database does, indeed, have no tables. According to the online
    MySQL documentation, the command to view the tables that exist in a database is
    as follows:


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_244_0.png)


    # 14.7.5.37 SHOW TABLES Syntax


    ```

    SHOW [FULL] TABLES [{FROM | IN} db_name]

    [LIKE ''pattern'' | WHERE expr]

    ```


    It is important to note that, in the preceding syntax, arguments in square brackets,
    such as FULL, are optional while arguments in curly braces, such as FROM, are
    required for the SHOW TABLES command. The pipe symbol between FROM and IN means
    that the MySQL syntax requires one or the other:


    ```

    # unpack dictionary credentials

    conn = mysql.connect(**guiConf.dbConfig)

    # create cursor

    cursor = conn.cursor()

    # execute command

    cursor.execute("SHOW TABLES FROM guidb")

    print(cursor.fetchall())


    # close connection to MySQL

    conn.close()

    ```


    When we execute the SQL command in Python, we get the expected result, which is
    an empty tuple showing us that our database currently has no tables:


    ```

    GUI_MySQL_class.py

    ```'
