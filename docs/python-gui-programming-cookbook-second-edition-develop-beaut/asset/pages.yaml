- pgno: 92
  md: '# How to do it...


    In this chapter, we have created rows and columns, which truly is a database approach
    to GUI design (MS Excel does the same). We hardcoded the first rows, but then
    we forgot to give the next row a specification of where we wish it to reside.


    Tkinter did fill this in for us without us even noticing.


    Here is what we did in our code:


    ```

    # Using a scrolled Text control

    scrol_w = 30

    scrol_h = 3

    scr = scrolledtext.ScrolledText(mighty, width=scrol_w, height=scrol_h, wrap=tk.WORD)

    # scr.grid(column=0, row=2, sticky=''WE'', columnspan=3)

    scr.grid(column=0, sticky=''WE'', columnspan=3)            # row not specified

    ```


    Tkinter automatically adds the missing row where we did not specify any particular
    row. We might not realize this.


    We laid out the Entry widgets on row 1, then we forgot to specify the row for
    our ScrolledText widget which we reference via the scr variable, and then we added
    the Radiobutton widgets to be laid out in row 3.


    This works nicely because tkinter automatically incremented the row position for
    our ScrolledText widget to use the next highest row number, which was row 2.


    Looking at our code and not realizing that we forgot to explicitly position our
    ScrolledText widget to row 2, we might think nothing resides there.


    So, we might try the following. If we set the variable curRad to use row 2, we
    might get an unpleasant surprise:


    GUI_grid_layout.py'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/986b0dbf3f539f4f3baa82bd3003f04e_93_0.png)


    # ## How it works…


    Note how our row of `RadioButton(s)` suddenly ended up in the middle of our `ScrolledText`
    widget! This is definitely not what we intended our GUI to look like!


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_93_1.png)


    If we forget to explicitly specify the row number, by default, tkinter will use
    the next available row.


    We also used the `columnspan` property to make sure our widgets did not get limited
    to just one column. Here is how we made sure that our `ScrolledText` widget spans
    all the columns of our GUI:


    ```

    ```python

    # Using a scrolled Text control

    scroll_w = 30

    scroll_h = 3

    scr = scrolledtext.ScrolledText(mighty, width=scroll_w, height=scroll_h, wrap=tk.WORD)

    scr.grid(column=0, row=2, sticky=''WE'', columnspan=3)                 # using
    columnspan

    ```

    ```'
