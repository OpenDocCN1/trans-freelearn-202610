- pgno: 72
  md: '# How it works…


    Because we are still using individual widgets, our layout can get messed up. By
    moving the column value of `LabelFrame` from 0 to 1, we were able to get the controls
    back to where they used to be and where we prefer them to be. At least, the left-most
    label, text, `Checkbutton`, `ScrolledText`, and `Radiobutton` widgets are now
    located where we intended them to be. The second label and text `Entry` located
    in column 1 aligned themselves to the center of the length of the **Labels in
    a Frame** widget, so we basically moved our alignment challenge one column to
    the right. It is not so visible because the size of the **Choose a number:** label
    is almost the same as the size of the **Labels in a Frame** title, and so the
    column width was already close to the new width generated by `LabelFrame`.


    # There''s more…


    In the next recipe, *Aligning the GUI widgets by embedding frames within frames*,
    we will embed frames within frames to avoid the accidental misalignment of widgets
    we just experienced in this recipe.


    # Aligning the GUI widgets by embedding

    frames within frames


    We’ll have a much better control of our GUI layout if we embed frames within frames.
    This is what we will do in this recipe.


    # Getting ready


    The dynamic behavior of Python and its GUI modules can create a little bit of
    a challenge to really get our GUI looking the way we want. Here, we will embed
    frames within frames to get more control of our layout. This will establish a
    stronger hierarchy among the different UI elements, making the visual appearance
    easier to achieve.


    We will continue using the GUI we created in the previous recipe, *How widgets
    dynamically expand the GUI*.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# # How to do it...


    Here, we will create a top-level frame that will contain other frames and widgets.
    This will help us get our GUI layout just the way we want.


    In order to do so, we will have to embed our current controls within a central
    frame called `ttk.LabelFrame`. This frame `ttk.LabelFrame` is the child of the
    main parent window and all controls will be the children of this `ttk.LabelFrame`.


    Up to this point in our recipes, we had assigned all widgets to our main GUI frame
    directly. Now, we will only assign `LabelFrame` to our main window and after that,
    we will make this `LabelFrame` the parent container for all the widgets.


    This creates the following hierarchy in our GUI layout:


    ![](img/986b0dbf3f539f4f3baa82bd3003f04e_73_0.png)


    In the preceding diagram, **win** is the variable that holds a reference to our
    main GUI tkinter window frame, **mighty** is the variable that holds a reference
    to our `LabelFrame` and is a child of the main window frame (**win**), and **Label**
    and all other widgets are now placed into the `LabelFrame` container (**mighty**).'
  merge: -1
  img_proc: true
