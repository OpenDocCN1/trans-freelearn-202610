- pgno: 1
  md: '# Python GUI Programming Cookbook

    - Second Edition


    Explore the beautiful world of GUI development using the Python programming language.
    You will learn how easy it is to get started, and you might be surprised how advanced
    you can become with just a small amount of coding. GUI development using Python
    is not a very well-known subject. The built-in tkinter GUI framework was limited,
    but with the latest versions of Python 3 and tkinter, all of this has dramatically
    changed.


    This book will start with the very basics of creating a fully functional GUI in
    Python with only a few lines of code. Each and every recipe adds more widgets
    to the GUIs we are creating. While the cookbook recipes all stand on their own,
    there is a common theme running through them. As our GUIs keep expanding, using
    more and more widgets, we start to talk to networks, databases, and graphical
    libraries that greatly enhance our GUI''s functionality.


    Things you will learn:


    +   - Create the GUI Form and add widgets

    +   - Arrange the widgets using layout managers

    +   - Use object-oriented programming to create GUIs

    +   - Create Matplotlib charts

    +   - Use threads to talk to networks

    +   - Talk to a MySQL database via the GUI

    +   - Perform unit testing and internationalization of the GUI

    +   - Extend the GUI with third-party graphical libraries

    +   - Get to know the best practices of creating GUIs'
  merge: -1
  img_proc: true
