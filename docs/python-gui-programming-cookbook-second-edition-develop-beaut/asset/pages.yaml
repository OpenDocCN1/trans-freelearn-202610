    \ + self.i18n.colorsIn[2])\n```\n\nNote how all of the previously hardcoded English\
    \ strings have been replaced by calls to the instance of our new I18N class. An\
    \ example is self.win.title(self.i18n.title).\n\nWhat this gives us is the ability\
