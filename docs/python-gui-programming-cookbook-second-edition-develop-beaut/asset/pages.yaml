  md: '# Text box widgets


    In tkinter, the typical one-line textbox widget is called Entry. In this recipe,
    we will add such an Entry widget to our GUI. We will make our label more useful
    by describing what the Entry widget is doing for the user.


    # Getting ready


    This recipe builds upon the Creating buttons and changing their text property
    recipe.


    # How to do it...


    Check out the following code:


    GUI_textbox_widget.py


    ```

    22 # Modified Button Click Function

    23 def click_me():

    24     action.configure(text=''Hello '' + name.get())

    25

    26 # Changing our Label

    27 ttk.Label(win, text="Enter a name:").grid(column=0, row=0)

    28

    29 # Adding a Text box Entry widget

    30 name = tk.StringVar()

    31 name_entered = ttk.Entry(win, width=12, textvariable=name)

    32 name_entered.grid(column=0, row=1)

