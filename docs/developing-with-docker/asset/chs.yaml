  \ 前言\n\nDocker 在过去几年里获得了大量关注。今天它拥有数千名社区贡献者、无数容器下载量，并且有越来越多的第三方项目在使用它。看起来在未来几年里它的声誉还会进一步增长。在本书中，我们将尝试解释这种非凡的流行度，并展示你如何从更快、更简单的应用程序开发、测试和部署中受益。我们将主要从开发者的角度学习\
  \ Docker，并专注于创建、运行和发布 Docker 镜像，而不是管理和集群它们。我们将从 Docker 为开发者工具集带来的基本思想和优势开始。\n\n\
  ## 本书涵盖内容\n\n第 1 章，Docker 简介，简要描述了 Docker 是什么以及它如何在现代软件开发和部署中发挥作用。我们将指出该工具带来的优势以及它为何有帮助。本章还将演示包含代码、运行时、系统工具和库的容器如何加快开发和部署，同时使其成为更愉快的体验。\n\
  \n第 2 章，安装 Docker，包含了可用工具的简要描述，例如 Docker CLI 或 Kitematic（Docker GUI）。接下来，我们将直接进入行动——安装工具。本章将给出在\
  \ Mac、Linux 和 Windows 上安装 Docker Toolbox 的精确且实用的说明。本章还将描述在云中安装 Docker 的过程，例如 Amazon\
  \ AWS。\n\n第 3 章，理解镜像和容器，讲述了 Docker 的架构。我们将解释与之相关的术语。阅读完本章后，你将理解 Docker 背后的概念和架构；在阅读后续章节时这是必不可少的。\n\
  \n第 4 章，网络和持久化存储，描述了 Docker 的网络和存储概念。本章将向读者介绍容器网络并介绍不同类型的容器（开放、封闭、桥接和连接）。读者还将熟悉卷及其类型的概念。此外，读者将学习如何管理、挂载和共享\
  \ Docker 卷。\n\n第 5 章，查找镜像，描述了使用 Docker Hub 识别软件、查找和安装它以及替代来源的过程。阅读完本章后，读者能够在 Docker\
  \ 仓库中找到指定的镜像然后安装它。\n\n第 6 章，创建镜像，告诉读者如何编写 Dockerfile，如何从中构建镜像并熟悉镜像构建过程。本章将包含编写 Dockerfiles\
  \ 的最佳实践以及处理镜像的有用技巧。\n\n第 7 章，运行容器，告诉我们如何在容器内运行程序。本章将描述启动、停止、重启、列出和查看容器输出的概念。读者将在容器中运行多个程序并熟悉向容器注入配置。我们还将描述容器生命周期和清理过程。\n\
  \n第 8 章，发布镜像，使我们熟悉软件分发打包的过程。阅读完本章后，读者将能够创建 Docker Hub 账户和仓库。然后，他将把镜像推送到上面，以便其他拥有\
  \ Docker Engine 的人可以运行它。本章还将描述私有软件分发过程。在本章结束时，读者将从仓库中拉取自己的镜像以测试该过程。\n\n第 9 章，在开发中使用\
  \ Docker，讨论如何将构建 Docker 镜像纳入 Maven 构建过程。为此，我们将利用 docker-maven 插件。我们还将打包运行在 Spring\
  \ Boot 嵌入式服务器上的 Java Web 应用。为了演示将静态 Web 应用打包到 Docker 容器中的过程，我们还将从 Docker 容器内部运行带有\
  \ node.js 后端的 angular.js 应用。\n\n附录 A，更多资源，将你引导至一些用于进一步阅读的有用资源，例如与 Docker 相关的论坛、博客和网站。本章还将提及一些与\
