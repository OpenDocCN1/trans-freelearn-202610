  ## 1 Introduction to Docker\n\n最初，Docker 由一家名为 **dotCloud** 的平台即服务公司作为内部工具创建。后来在\
  \ 2013 年 3 月，它作为开源软件发布。除了主要赞助商 Docker Inc. 团队之外，还有其他一些知名公司为该工具做出贡献——例如 Red Hat、IBM、Microsoft、Google\
  \ 和 Cisco Systems。今天的软件开发需要敏捷并快速响应变化。我们使用 Scrum 等方法论，按故事点估算工作，并参加每日站会。但软件的出货准备和部署怎么办？让我们看看\
  \ Docker 如何融入这一场景并帮助我们实现敏捷。\n\n本章将涵盖以下主题：\n\n- Docker 背后的基本思想\n- 虚拟化与容器化的区别\n- 使用\
  \ Docker 的好处\n- 可安装的组件\n\n我们将从这个精彩工具背后的基本思想开始。\n\n## The basic idea\n\nDocker 背后的基本思想是将应用程序及其所有依赖项（无论是二进制文件、库、配置文件、脚本、jar\
  \ 等）打包成一个用于软件开发和部署的单一标准化单元。Docker 容器将软件封装在一个完整的文件系统中，其中包含运行所需的一切：代码、运行时、系统工具和系统库——服务器上可以安装的任何东西。这保证了无论部署在什么环境中，它始终以相同的方式运行。\n\
  使用 Docker，您可以构建 Node.js 或 Java 项目（当然您并不局限于这两个）而无需在主机上安装 Node.js 或 Java。完成后，您只需销毁\
  \ Docker 镜像，就好像什么都没发生过一样。它不是编程语言或框架；更确切地说，它是一个帮助解决安装、发布和管理软件等常见问题的工具。它允许程序员和 DevOps\
  \ 在任何地方构建、发布和运行代码。\n\n您可能认为 Docker 是一个虚拟化引擎，但事实远非如此，我们稍后会解释。\n\n## Containerization\
  \ versus virtualization\n\n为了充分理解 Docker 到底是什么，我们首先需要了解传统虚拟化与容器化之间的区别。现在让我们比较这两种技术。\n\
  \n## Traditional virtualization\n\n传统虚拟机代表硬件级虚拟化，本质上是在主机操作系统之上运行的完整操作系统。虚拟化 hypervisor\
  \ 有两种类型：Type 1 和 Type 2。Type 1 hypervisor 在裸金属硬件上提供服务器虚拟化——没有传统的终端用户操作系统。另一方面，Type\
  \ 2 hypervisor 通常用作桌面虚拟化——您在自己的操作系统之上运行虚拟化引擎。利用虚拟化有很多用例——最大的优势是您可以在单个主机上运行具有完全不同操作系统的许多虚拟机。\n\
  \n虚拟机完全隔离，因此非常安全。但没有免费的午餐。它们有很多缺点——它们包含操作系统所需的所有功能：设备驱动程序、核心系统库等等。它们重量大，通常资源消耗高，而且设置起来并不容易——虚拟机需要完整安装。它们执行需要更多的计算资源。要在虚拟机上成功运行应用程序，hypervisor\
  \ 需要先导入虚拟机然后再启动，这需要时间。此外，它们的性能会大幅下降。因此，单个机器上只能配置并提供少量虚拟机使用。\n\n## Containerization\n\
  \nDocker 软件在名为 **Docker container** 的隔离环境中运行。Docker 容器在流行意义上并不是虚拟机。它代表操作系统虚拟化。虽然每个虚拟机镜像都在独立的客户操作系统上运行，但\
  \ Docker 镜像在同一操作系统内核内运行。容器拥有自己的文件系统和环境变量。它是自给自足的。由于容器在同一内核内运行，它们使用的系统资源更少。基础容器可以而且通常是轻量级的。值得注意的是，Docker\
  \ 容器不仅与底层操作系统隔离，而且彼此之间也是隔离的。与经典虚拟化 hypervisor 和客户操作系统相关的开销为零。这使得能够实现接近裸金属、接近原生的性能。**dockerized**\
  \ 应用程序的启动时间通常非常快，因为容器的开销很低。还可以加快数百个应用程序容器的推出速度，并在数秒内完成，并减少配置软件所需的时间。\n\n传统虚拟化引擎。请注意，容器不能替代所有用例中的虚拟机。仍需要仔细评估以确定什么最适合您的应用程序。两种解决方案各有优势。一方面我们有完全隔离、安全但性能一般的虚拟机，另一方面我们有容器，它们缺少一些关键功能（如完全隔离），但配备了高性能并且可以快速配置。让我们看看使用\
  \ Docker 容器化还能获得哪些其他好处。\n\n正如您所见，Docker 与传统虚拟化引擎大不相同。请注意，容器并不是所有用例中虚拟机的替代品。仍需要仔细评估以确定什么最适合您的应用程序。两种解决方案各有优势。一方面我们有完全隔离、安全但性能一般的虚拟机，另一方面我们有容器，它们缺少一些关键功能（如完全隔离），但配备了高性能并且可以快速配置。\n\
  \n让我们看看使用 Docker 容器化还能获得哪些其他好处。\n\n## Benefits of using Docker\n\n将 Docker 容器与传统虚拟机进行比较时，我们已经提到了其一些优势。现在让我们更详细地总结它们并补充一些。\n\
  \n## Speed and size\n\n正如我们之前所说，使用 Docker 的第一个明显好处将是性能非常令人满意以及配置时间很短。您可以快速轻松地创建或销毁容器。Docker\
  \ 仅共享内核，不多也不少。然而，它会重用特定镜像所构建的基础镜像层。因此，在容器中运行的应用程序的多个版本将非常轻量。结果是部署更快、迁移更容易、启动时间更灵活。\n\
  \n## Reproducible and portable builds\n\n使用 Docker 您可以部署即用型软件，该软件具有可移植性且极易分发（我们将在第\
  \ 6 章《Building Images》中介绍创建镜像的过程）。您的容器化应用程序只需在其容器内运行：无需传统安装。Docker 镜像的关键优势在于它捆绑了容器化应用程序运行所需的所有依赖项。无需安装依赖项具有巨大优势。这消除了诸如软件和库冲突甚至驱动程序兼容性问题等麻烦。由于\
  \ Docker 的可重复构建环境，它特别适合测试，尤其是在您的持续集成流程中。您可以快速启动相同的环境来运行测试。而且由于容器镜像每次都相同，您可以分发工作负载并并行运行测试而不会有问题。开发人员可以在其机器上运行稍后将在生产环境中运行的相同镜像，这在测试中再次具有巨大优势。Docker\
  \ 容器的使用加快了持续集成。不再有无休止的构建-测试-部署循环。Docker 容器确保应用程序在开发、测试和生产环境中以相同的方式运行。\n\n\n\nDocker\
  \ 最大的特性之一是可移植性。Docker 容器具有可移植性——它们可以在任何地方运行：本地机器、附近或远程服务器，以及私有或公有云。提到云时，所有主要云计算提供商，例如亚马逊网络服务和\
  \ Google 计算引擎都认识到 Docker 的可用性并现在支持它。只要主机操作系统支持 Docker，Docker 容器就可以在 Amazon EC2 实例或\
  \ Google 计算引擎实例内部运行。运行在 Amazon EC2 实例上的容器可以轻松转移到其他环境，实现相同的一致性和功能。Docker 与各种其他 **IaaS（基础设施即服务）**\
  \ 提供商（如 Microsoft 的 Azure、IBM SoftLayer 或 OpenStack）配合得非常好。从基础设施层提供的这种额外抽象层是不可或缺的功能。你只需开发软件，而无需担心它以后将在哪个平台上运行。它确实是一个\
  \ *一次编写，到处运行* 的解决方案。\n\n## Immutable and agile infrastructure\n\n维护一个真正幂等的配置管理代码库可能很棘手且耗时。代码会随着时间的推移而增长，变得越来越麻烦。这就是为什么不可变基础设施的理念如今变得越来越流行。容器化来拯救局面。在应用程序的开发和部署过程中使用容器，可以简化流程。拥有一个几乎不需要配置管理的轻量级\
  \ Docker 服务器，你只需通过向服务器部署和重新部署容器来管理应用程序。而且，由于容器非常轻量，只需花费你几秒钟的时间。\n\n作为起点，你可以从 Docker\
  \ Hub 下载预构建的 Docker 镜像，它就像一个即用型镜像的存储库。有许多选择，包括 Web 服务器、运行时平台、数据库、消息服务器等等。它就像一个真正的软件金矿，你可以免费使用它为自己的项目建立基础。我们将在第\
  \ 5 章 *查找镜像* 中介绍 Docker Hub 和查找镜像。\n\nDocker 镜像不可变性的效果源于它们创建的方式。Docker 使用一个名为 Dockerfile\
  \ 的特殊文件。该文件包含创建镜像所需的所有设置说明，例如必备组件、库、暴露的共享目录、网络配置等等。镜像可以非常基础，只包含操作系统基础，或者——更常见的情况——包含一个完整的预构建技术栈，可随时启动。你可以手工创建镜像，但也可以是自动化过程。\n\
  \nDocker 以分层方式创建镜像：你包含的每个功能都会作为另一层添加到基础镜像中。与传统的虚拟化技术相比，这又是另一个显著的速度提升。\n\n我们将在第 6\
  \ 章《创建镜像》中稍后详细介绍创建镜像的细节。\n\n## Tools and APIs\n\n当然，Docker 不仅仅是一个 Dockerfile 处理器和运行时引擎。它是一个完整的软件包，包含大量工具和\
  \ API，对开发人员和 DevOps 的日常工作很有帮助。首先，有 Docker Toolbox，它是一个安装程序，可快速轻松地在自己的机器上安装和设置 Docker\
  \ 环境。Kitematic 是在 Windows 和 Mac OS X 上使用 Docker 的桌面开发环境。Docker 发行版还包含大量命令行工具，我们将在整本书中使用它们。现在让我们来看一下它们。\n\
  \n## Tools overview\n\n在 Windows 上，根据你使用的 Windows 版本，有两种选择。如果你在 Windows 10 或更高版本，可以是\
  \ Docker for Windows；如果是所有更早版本的 Windows，则是 Docker Toolbox。MacOS 也是如此。最新提供的是 Docker\
  \ for Mac，它作为原生 Mac 应用程序运行，并使用 xhyve 来虚拟化 Docker Engine 环境和 Linux 内核。对于不符合 Docker\
  \ for Mac 要求的更早版本的 Mac（我们将在第 2 章《安装 Docker》中列出它们），你应该选择 Docker Toolbox for Mac。Docker\
  \ Toolbox 和 Docker 原生应用程序背后的理念相同——在你的操作系统之上虚拟化 Linux 内核和 Docker Engine。为了本书的目的，我们将使用\
  \ Docker Toolbox，因为它具有通用性；它可在所有 Windows 和 MacOS 版本上运行。Windows 和 Mac OS 的安装包被打包在一个名为\
  \ Docker Toolbox 的可执行文件中。该软件包包含开始使用 Docker 所需的所有工具。当然，还有大量与 Docker 兼容的第三方实用工具，其中一些非常有用。我们将在第\
  \ 9 章《在开发中使用 Docker》中简要介绍其中一些。但现在，让我们专注于默认工具集。在开始安装之前，让我们先看看安装程序包包含哪些工具，以便更好地了解会对系统做出哪些更改。\n\
  \n## Docker Engine and Docker Engine client\n\nDocker 是一个客户端-服务器应用程序。它由守护进程组成，执行重要任务：构建和下载镜像、启动和停止容器等等。它公开了一个\
  \ REST API，指定了与守护进程交互的接口，并用于远程管理。Docker Engine 接受来自命令行的 Docker 命令，例如 `docker` 运行镜像，`docker\
  \ ps` 列出正在运行的容器，`docker images` 列出镜像，等等。\n\nDocker 客户端是一个命令行程序，用于管理运行 Linux 容器的\
  \ Docker 主机。它使用 REST API 包装器与 Docker 服务器通信。你将通过使用客户端向服务器发送命令与 Docker 交互。\n\nDocker\
  \ Engine 仅在 Linux 上工作。如果你想在 Windows 或 Mac OS 上运行 Docker，或想在网络或云上配置多个 Docker 主机，你将需要\
  \ Docker Machine。\n\n## Docker Machine\n\nDocker Machine 是 Docker 团队创建的一个相对较新的命令行工具，用于管理可以部署容器的\
  \ Docker 服务器。它弃用了使用 **Boot2Docker** 实用工具安装 Docker 的旧方法。Docker Machine 消除了手动创建虚拟机并在上面安装\
  \ Docker 才能启动 Docker 容器的需求。它在幕后为你处理配置和安装过程。换句话说，它是一种快速获取新虚拟机并准备好运行 Docker 容器的途径。在开发\
  \ **PaaS（平台即服务）** 架构时，这是一个不可或缺的工具。Docker Machine 不仅创建安装了 Docker Engine 的新 VM，还设置用于身份验证的证书文件，然后配置\
  \ Docker 客户端以与其通信。出于灵活性目的，Docker Machine 引入了驱动程序的概念。使用驱动程序，Docker 能够与各种虚拟化软件和云提供商通信。事实上，当你安装\
  \ Docker for Windows 或 Mac OS 时，默认会使用 VirtualBox 驱动程序。以下命令将在幕后执行：\n\n```\ndocker-machine\
  \ create --driver=virtualbox default\n```\n\n另一个可用的驱动程序是用于亚马逊网络服务的 amazonec2。它可用于在\
  \ Amazon 云上安装 Docker——我们将在本章后面进行。有很多驱动程序可供使用，而且不断增加。现有官方驱动程序及其文档的列表始终可在 **Docker\
  \ 驱动程序** 网站上获取：https://docs.docker.com/machine/drivers。\n\n目前列表包含以下驱动程序：\n\n- 亚马逊网络服务\n\
  - Microsoft Azure\n- DigitalOcean\n- Exoscale\n- Google 计算引擎\n- 通用\n- Microsoft\
  \ Hyper-V\n- OpenStack\n- Rackspace\n- IBM SoftLayer\n- Oracle VirtualBox\n- VMware\
  \ vCloud Air\n- VMware Fusion\n- VMware vSphere\n\n除了这些之外，还有大量第三方驱动程序插件可在 GitHub\
  \ 等互联网网站上免费获取。你可以找到适用于不同云提供商和虚拟化平台的额外驱动程序，例如 OVH Cloud 或适用于 Mac OS 的 Parallels，例如，你并不局限于\
  \ Amazon 的 AWS 或 Oracle 的 VirtualBox。正如你所见，选择非常广泛。\n\n![](img/0c87321919fa245e22f056c67ec70003_23_0.png)\n\
  \n如果你找不到特定云提供商的驱动程序，请尝试在 GitHub 上查找。\n\n在 Windows 或 Mac OS 上安装 Docker Toolbox 时，Docker\
  \ Machine 将默认被选中。它是强制性的，目前是这些操作系统上运行 Docker 的唯一方式。对于 Linux 而言，安装 Docker Machine\
  \ 并不是强制性的——在那里无需虚拟化 Linux 内核。然而，如果你想处理云提供商，或只是想在 Mac OS、Windows 和 Linux 之间拥有可移植的通用运行时环境，你也可以为\
  \ Linux 安装 Docker Machine。我们将在本章后面描述该过程。Docker Machine 也将在幕后使用图形工具 Kitematic 时使用，我们稍后会介绍它。\n\
  \n安装过程完成后，Docker Machine 将作为命令行工具可用：docker-machine。\n\n\n\n## Kitematic\n\nKitematic\
  \ 是一个可用于通过简洁而稳健的图形用户界面（GUI）运行容器的软件工具。2015 年，Docker 收购了 Kitematic 团队，希望吸引更多开发者，并希望将容器化解决方案推广给更多开发者以及更广泛的普通公众。\n\
  \n安装 Docker Toolbox 时，Kitematic 现在默认包含在 Mac OS 和 MS Windows 上。你可以使用它从 Docker Hub\
  \ 舒适地搜索并获取所需的镜像。该工具也可以用于运行你自己的应用容器。使用 GUI，你可以编辑环境变量、映射端口、配置卷、查看日志，并对容器进行命令行访问。值得一提的是，你可以在\
  \ Kitematic GUI 和命令行界面之间无缝切换以运行和管理应用容器。Kitematic 非常方便，然而，如果你希望在处理容器时拥有更多控制权或只是想使用脚本——命令行将是更好的解决方案。事实上，Kitematic\
  \ 允许你在 Docker CLI 和 GUI 之间来回切换。你在命令行界面所做的任何更改都将直接反映在 Kitematic 中。该工具使用简单，正如你在本章末尾将看到的那样，我们将在\
  \ Mac 或 Windows PC 上测试我们的设置。在本书的剩余部分，我们将使用命令行界面来操作 Docker。\n\n## Docker Compose\n\
  \nCompose 是一个工具，可从命令行作为 `docker-compose` 执行。它取代了旧的 *fig* 工具。它用于定义和运行多容器 Docker 应用。虽然很容易想象一个多容器应用（例如一个容器中的\
  \ Web 服务器和另一个容器中的数据库），但这不是强制性的。因此，如果你决定你的应用可以适配于单个 Docker 容器，`docker-compose` 就没有用途了。在现实生活中，你的应用很可能会跨多个容器。使用\
  \ `docker-compose`，你可以使用 compose 文件配置应用的服务，使它们能够在隔离环境中一起运行。然后，使用单个命令，你可以创建并启动配置中的所有服务。对于多容器应用而言，`docker-compose`\
  \ 对于开发和测试以及持续集成工作流非常有用。\n\n我们将在本书稍后的第 6 章 *创建镜像* 中使用 `docker-compose` 创建 `multicontainer`\
  \ 应用。\n\n## Oracle VirtualBox\n\nOracle VM VirtualBox 是 Oracle 提供的用于 x86 计算机的免费开源虚拟化程序。安装\
  \ Docker Toolbox 时它将默认安装。它支持创建和管理运行 Windows、Linux、BSD、OS/2、Solaris 等的虚拟机。在我们的案例中，使用\
  \ VirtualBox 驱动的 Docker Machine 将使用 VirtualBox 创建并启动一个能够运行 `docker-engine` 的精简 Linux\
  \ 发行版。值得一提的是，你也可以直接从 VirtualBox 本身运行这个极其精简的虚拟化 Linux。\n\n使用 `docker-machine` 或 `Kitematic`\
  \ 创建的每个 Docker Machine 在直接运行时都将在 VirtualBox 中可见并可启动，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_25_0.png)\n\
  \n你可以像其他虚拟化操作系统一样启动、停止、重置、更改设置并读取日志。\n\n![](img/0c87321919fa245e22f056c67ec70003_26_0.png)\n\
  \n你可以在 Windows 或 Mac 上将 VirtualBox 用于 Docker 以外的其他用途。\n\n## Git\n\nGit 是一个分布式版本控制系统，广泛用于软件开发和其他版本控制任务。它强调速度、数据完整性以及对分布式、非线性工作流的支持。Docker\
  \ Machine 和 Docker 客户端遵循 Git 的 pull/push 模型来从网络获取所需的依赖项。例如，如果你决定运行本地机器上不存在的 Docker\
  \ 镜像，Docker 将从 Docker Hub 获取该镜像。Docker 在内部不使用 Git 进行任何资源版本控制。然而，它确实依赖哈希来唯一标识文件系统层，这与\
  \ Git 所做的事情非常相似。Docker 也从提交、推送和拉取的概念中汲取了最初的灵感。Git 也包含在 Docker Toolbox 安装包中。\n\n\
  从开发者的角度来看，有一些工具对程序员的日常工作特别有用，无论是面向 Java 爱好者的 IntelliJ IDEA Docker Integration Plugin，还是面向偏好\
  \ C# 的开发者的 Visual Studio 2015 Tools for Docker。它们让你可以直接从你喜欢的 IDE 下载和构建 Docker 镜像、创建和启动容器，并执行其他相关任务。我们将在下一章中更详细地介绍它们。\n\
  \n除了 Docker 发行包中包含的工具（对于较旧版本的 Windows 为 Docker Toolbox，或为 Docker for Windows 和 Docker\
  \ for Mac）之外，还有数百种第三方工具，例如 Kubernetes 和 Helios（用于 Docker 编排）、Prometheus（用于统计监控），或用于管理集群的\
  \ Swarm 和 Shipyard。随着 Docker 受到更多关注，几乎每周都会出现越来越多的 Docker 相关工具。我们将尝试在第 9 章 Using\
  \ Docker in Development 以及更多资源中简要介绍其中最有趣的工具。\n\n但这些并不是你可用的唯一工具。此外，Docker 还提供了一套非常实用的\
  \ API。其中之一是用于管理镜像和容器的 Remote API。使用此 API，你将能够将镜像分发到运行时的 Docker 引擎。容器可以转移到另一台运行 Docker\
  \ 的机器上，并在那里执行而无需担心兼容性问题。在创建 PaaS（平台即服务）架构时，这可能特别有用。还有 Stats API，它将公开容器的实时资源使用信息（如\
  \ CPU、内存、网络 I/O 和块 I/O）。此 API 端点可用于创建显示容器行为的工具，例如在生产系统上。\n\n## Summary\n\n到目前为止，我们已经理解了虚拟化与容器化之间的区别，而且我希望我们也能看到使用后者的优势。我们也知道有哪些组件可供我们安装和使用。让我们开始进入容器世界之旅，并通过安装软件直接付诸行动。\n\
  \n# 2\n\n## 2 Installing Docker\n\n在本章中，我们将了解如何在 Windows、Mac OS 和 Linux 操作系统上安装\
  \ Docker。还将提供逐步说明，介绍如何在云中设置 Docker，并以 Amazon EC2 为例。接下来，我们将运行示例 `hello-world` 镜像以验证设置并检查安装过程后一切是否正常工作。本章将涵盖以下主题：\n\
  \n- 运行 Docker 的硬件要求\n- 在 Windows 上安装\n- 在 Mac OS 上安装\n- 在 Linux 上安装\n- 在 Amazon\
  \ AWS 云上安装\n\nDocker 安装相当直接，但有一些事项你需要关注以使其运行。我们会指出它们以使安装过程轻松无痛。\n\n![](img/0c87321919fa245e22f056c67ec70003_28_0.png)\n\
  \n> 值得一提的是，Linux 是 Docker 的自然环境。Docker 引擎构建在 Linux 内核之上。要使其在 Windows 或 Mac OS 上运行，Linux\
  \ 内核需要被虚拟化。\n\nDocker Engine 可以通过使用专门用于运行 Docker 容器的轻量级 Linux 发行版在 Mac 和 MS Windows\
  \ 操作系统上运行。它完全从 RAM 运行，仅重几十兆字节，并在几秒钟内启动。在安装主要 Docker 包——Docker Toolbox 期间，虚拟化引擎 VirtualBox\
  \ 也将默认安装。因此，你的机器有一些特殊硬件要求。\n\n\n\n## 硬件要求\n\n使用 Docker，您需要一台相对较新的机器，支持硬件级虚拟化：基于\
  \ Intel 的 PC 需要 VT-x，AMD 处理器需要 AMD-V。\n\n大多数 Mac 机器开箱即支持，但对于 PC，您需要确保其已启用，并可能在 BIOS\
  \ 设置中开启。\n\n不同 BIOS 的设置方式不同，只需查找 VT-x / AMD-V 开关即可。\n\n在 Windows 8 中，您可以在任务管理器的性能选项卡中检查虚拟化支持：\n\
  \n|  |  |\n|---|---|\n| 虚拟化: | 已启用 |\n| L1 缓存: | 256 KB |\n| L2 缓存: | 2.0 MB |\n\
  \n如果您想在 Windows 7 中检查 PC 是否支持硬件级虚拟化，请查找 Microsoft 硬件辅助虚拟化检测工具。\n\n这是一款免费的小型实用工具，用于检查系统是否支持虚拟化。\n\
  \n下载并运行它以查看报告：\n\n![](img/0c87321919fa245e22f056c67ec70003_29_0.png)\n\n如果您的报告显示硬件辅助虚拟化未启用，您需要检查机器的\
  \ BIOS 设置，也许硬件辅助虚拟化支持只是被关闭了。\n\n在这种情况下，请将其打开并重新运行该工具。\n\n如果您的 PC 不支持硬件辅助虚拟化，而您仍决定安装\
  \ Docker，则在启动虚拟化 Linux 发行版期间会出现错误。\n\n此外，在 Windows PC 上安装时，您需要确保 Windows 操作系统为 64\
  \ 位（x64）。\n\nDocker 默认不会在 32 位系统上运行。\n\n我们已从 `Chapter 1, Introduction to Docker`\
  \ 了解到，默认安装包中可安装哪些 Docker 组件。\n\n了解硬件要求后，让我们下载并安装软件。\n\n## 在 Windows 上安装\n\nDocker\
  \ 的最新安装指南始终可在 `https://www.docker.com/` 网站上获取。\n\n前往 *开始使用 Docker* 部分，并根据您的操作系统选择安装指南：Windows、Mac\
  \ OS 或 Linux。\n\n正如前一章所述，您在 Windows 上安装 Docker 有两种选择：可在几乎所有 Windows 版本上运行的 Docker\
  \ Toolbox，或仅在 Windows 10 或更高版本上运行的 Docker for Windows。\n\n此外，即使您运行的是 Windows 10，也有一些额外要求：必须是\
  \ 64 位 Windows 10 专业版、企业版和教育版（1511 十一月更新，Build 10586 或更高版本）。\n\n对于 Docker 的原生安装包（Docker\
  \ for Windows 或 Docker for Mac），您可以选择经过充分测试且可靠的稳定通道，或包含 Docker 团队正在开发的一些实验性功能但可能不稳定且有漏洞的测试版通道。\n\
  \n我建议选择稳定通道。\n\n安装包只是一个单一的 `installDocker.msi` 包。\n\n直接运行它——这是一种无需提问的安装类型。\n\n但是请注意，您需要在\
  \ Windows 机器上拥有管理员权限。\n\n安装结束后，您会收到完成通知并被提示运行 Docker，如以下屏幕截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_31_0.png)\n\
  \n您现在或稍后可以从 Windows 菜单运行 Docker。\n\n如果您运行它，片刻后您应该会在托盘中看到正在动画的 Docker 图标，表示 Docker\
  \ 正在启动。\n\n如果是这样，您应该会看到一个弹出消息，提示它已准备好使用：\n\n![](img/0c87321919fa245e22f056c67ec70003_31_1.png)\n\
  \n从现在开始，您可以使用托盘区域中的鲸鱼图标与 Docker Engine 交互。\n\n您需要注意，我们在 *第 1 章，Docker 简介* 中描述的 Kitematic\
  \ 工具不再是 Docker for Windows 安装包的一部分（Docker Toolbox 中是如此）。\n\n然而，Kitematic 与 Docker\
  \ for Windows 兼容，也可以继续使用。\n\n您可以单独下载并解压到 `C:\\Program Files\\Docker\\Kitematic`。\n\
  \nDocker Toolbox 的设置略有不同。\n\nWindows 和 Mac OS 的 Toolbox 包可在 `https://www.docker.com/products/docker-toolbox`\
  \ 获取。\n\n下载 **Docker Toolbox** 包后，运行它。\n\n第一个屏幕会询问您是否允许提供匿名使用统计信息以帮助 Docker 开发者改进软件。\n\
  \n是否允许取决于您的隐私顾虑。\n\n下一个屏幕显示可供安装的组件：\n\n![](img/0c87321919fa245e22f056c67ec70003_32_0.png)\n\
  \nDocker Client for Windows 和 Docker Machine for Windows 是强制性的——没有它们您将无法做任何事情。\n\
  \n对于初始设置，最好保留所有选项的勾选状态。\n\n在撰写本文时，Kitematic 工具处于 alpha 版本，但不用担心，它运行良好。\n\n最后一个安装屏幕会询问您是否希望将\
  \ Docker 的二进制文件添加到路径或创建桌面快捷方式，如以下屏幕截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_33_0.png)\n\
  \n将 Docker 命令行工具放在路径中将来会非常方便，因此最好勾选此选项。\n\n值得一提的是，您可以选择安装旧的 NDIS5 主机网络过滤驱动程序，而不是默认的\
  \ NDIS6。\n\n如果您使用的是 Windows Vista 之前的旧版本 Windows，这可能有助于解决诸如减速或网络问题等一些问题。\n\n如果您选择了\
  \ NDIS6 并随后发现问题，只需再次执行安装程序，然后改选 NDIS5 即可。\n\n安装后，运行我们之前描述的 Kitematic 工具。\n\n它将在启动\
  \ Docker Linux 虚拟机时显示进度窗口。\n\n成功启动后，Kitematic 会要求您提供 Docker Hub 凭据。\n\n您现在可以登录 **Docker\
  \ Hub**，创建 Docker Hub 账户，或暂时跳过此过程。\n\n这对于搜索和运行镜像不是强制性的。\n\n我们将用它来创建账户，并在第 5 章 *查找镜像*\
  \ 中大量使用 Docker Hub。\n\n![](img/0c87321919fa245e22f056c67ec70003_34_0.png)\n\n无论您决定执行还是跳过登录过程，您都将看到\
  \ Kitematic 的主窗口。\n\n让我们简要讨论一下。\n\n在左侧，有一个可运行的容器列表——如果您首次运行 Kitematic，则为空。\n\n让我们找一个简单的镜像来运行。\n\
  \n只需在搜索框中开始输入 hello-world，即可列出名称中包含该短语的 Docker Hub 镜像。\n\n尝试不同的搜索以查看 Hub 中有哪些内容。\n\
  \n您可以下载并运行诸如 MySQL 或 Mongo 之类的数据库、诸如 nginx 之类的 Web 服务器，以及更多、更多的内容，只需几次鼠标点击！\n\n\
  最好的是，您的机器上无需安装任何依赖项。\n\n例如，您甚至不需要在机器上安装 Java 即可运行 Jboss 或 Tomcat。\n\n这就是容器化的魔力，这只是开始。\n\
  \n来自官方仓库的镜像之一是著名的 **hello-world** 镜像。\n\n点击它旁边的 **创建**：\n\n![](img/0c87321919fa245e22f056c67ec70003_35_0.png)\n\
  \n现在魔术开始了。\n\nDocker 将从 Hub 获取所选镜像并执行它。\n\n从现在开始，您可以使用 Kitematic 启动、停止、重启和配置您的容器：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_36_0.png)\n\n正如您在 **容器** 日志部分所看到的，后台发生了很多事情，只为打印\
  \ `Hello` from Docker 消息。\n\n但当然，这不是通常的消息。\n\n它来自容器化软件，与标准的 `hello world` 程序相比有很大不同。\n\
  \n首先，它检查 Docker daemon 是否在您的系统上运行，如果是则连接到它。\n\n接下来，它会检查 hello-world 镜像是否在您的本地系统上。\n\
  \n如果没有——在您首次运行时就会如此——它会从 Docker Hub 获取镜像。\n\nDocker 运行镜像并将输出流回给您查看。\n\n让我们从 Docker\
  \ CLI 做同样的事情。\n\n点击 Kitematic 中的 **Docker CLI** 图标以执行 Windows PowerShell 命令提示符。\n\
  \n您现在不必担心命令行语法——我们将在下一章中解释它。\n\n此外，我们将在整本书中使用命令行工具，因此您将很容易熟悉语法。\n\n\n\n首先，让我们验证虚拟化的\
  \ Linux 机器是否正常工作，通过执行以下命令：\n\n```\ndocker-machine ls\n```\n\nls 代表 list 命令，并列出你在\
  \ Windows 上配置的虚拟机。当前正在运行的机器将在 ACTIVE 列中有一个星号，并在 STATUS 列中显示状态为 Running：\n\n![](img/0c87321919fa245e22f056c67ec70003_37_0.png)\n\
  \n接下来，执行以下命令来运行镜像：\n\n```\ndocker run hello-world\n```\n\n这将给出与 Kitematic 中相同的输出：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_37_1.png)\n\n正如我们之前所说，Docker CLI 和 Kitematic\
  \ 无缝连接，你在命令行中所做的一切都会反映在 Kitematic 中。你会注意到你刚刚运行的镜像会显示在 Kitematic 的 GUI 中。值得注意的是，当你创建一个新的\
  \ Docker 容器并且没有为其指定自定义名称（通过使用 Docker CLI 传递 `--name` 选项）时，Docker 会为你生成一个名称：\n\n\
  ![](img/0c87321919fa245e22f056c67ec70003_38_0.png)\n\n这些自动生成的名称可能很有趣，但以后在需要按名称区分容器时也会非常有用。记住\
  \ `furious_keller` 比记住 `3955c5396595` 更容易，不是吗？\n\n![](img/0c87321919fa245e22f056c67ec70003_38_1.png)\n\
  \n如果忘记指定，Docker 会自动为容器生成名称。\n\n现在我们已经在 Windows 上成功运行了 Docker，让我们来解释在 Mac 机器上的安装过程。\n\
  \n## 在 Mac OS 上安装\n\n在 Mac OS 上安装 Docker 与在 Windows PC 上的安装非常相似。这里你也有两个选项。如果你的 Mac\
  \ 是 2010 年或更新的机型，并且运行的是 Yosemite 或更新的 Mac OS，你可以选择 Docker for Mac 安装。与原生 Docker\
  \ for Windows 相同，你可以选择稳定版或 beta 版。除非你想体验 Beta 版中提供的新功能和 bug 的刺激，否则应选择 Stable 版本。Docker\
  \ for Mac 是一个原生应用程序，你只需将其复制到你的 `/Applications` 文件夹，就像任何其他 Mac 应用程序一样，如下图所示：\n\n\
  ![](img/0c87321919fa245e22f056c67ec70003_39_0.png)\n\n如果你运行已安装的 `Docker.app`，你会在\
  \ Mac OS 的菜单工具栏中看到一个鲸鱼图标：\n\n![](img/0c87321919fa245e22f056c67ec70003_39_1.png)\n\
  \n与原生 Docker for Windows 相同的说明也适用于 Docker for Mac：Kitematic 不再是安装包的一部分。然而，它仍然与 Docker\
  \ for Mac 兼容——你只需单独下载并放入 `/Applications` 文件夹即可。\n\n如果你使用的是较旧的 Mac 或较旧的 Mac OS，你将需要\
  \ Docker Toolbox。然而，你至少需要 Mac OS 10.8 *Mountain Lion* 才能安装 Docker Toolbox。Docker\
  \ Toolbox 包与 Windows 中一样，包含开始所需的所有工具。它包含 Docker Client、Machine、Compose、Kitematic\
  \ 和 VirtualBox。直接前往 Docker Toolbox 网站 https://www.docker.com/products/docker-toolbox\
  \ 并下载 Mac OS 版本。Docker Toolbox for Mac 被打包成 pkg 包，因此你需要运行它，而不是简单地移动到 `/Applications`\
  \ 文件夹。与 Windows 版本类似，你可能希望给予它权限以报告使用统计数据来改进未来的版本。安装后，**Quick Start** 页面会让你选择快速执行\
  \ Terminal 或 Kitematic 工具：\n\n![](img/0c87321919fa245e22f056c67ec70003_40_0.png)\n\
  \n稍后你还可以在 `Applications` 文件夹和 **Launchpad** 菜单中找到 Docker 工具和 VirtualBox：\n\n![](img/0c87321919fa245e22f056c67ec70003_41_0.png)\n\
  \n要验证设置，请执行 **Kitematic**，跳过 **Docker Hub login** 并在搜索字段中输入 `hello-world`：\n\n![](img/0c87321919fa245e22f056c67ec70003_41_1.png)\n\
  \n接下来，单击 hello-world 镜像旁边的 CREATE 按钮。Kitematic（准确地说是 docker-machine）将从 Docker Hub\
  \ 下载镜像并向你展示输出：\n\n![](img/0c87321919fa245e22f056c67ec70003_42_0.png)\n\n从现在开始，Docker\
  \ 的命令行工具也供你使用。从 Kitematic 打开 Terminal 会自动设置所有必需的环境变量并连接到默认机器。但如果你想从自己的 Terminal\
  \ 会话中工作，你可能会收到 Docker 客户端无法连接到 Docker daemon 的消息。原因是客户端不知道它应该控制哪台机器。要将客户端附加到特定机器，请在你的\
  \ Terminal 会话中输入以下命令：\n\n```\neval \"$(docker-machine env default)\"\n```\n\neval\
  \ 命令设置环境变量，以指示 docker 对特定机器运行命令，在我们的示例中是默认机器。\n\n要查看 Docker 相关环境变量的列表，请使用 env 命令：\n\
  \n```\nenv | grep DOCKER\n```\n\n输出将包含 Docker 变量，例如机器名称、主机和证书路径：\n\n```\nDOCKER_TLS_VERIFY=1\n\
  DOCKER_HOST=tcp://192.168.99.100:2376\nDOCKER_CERT_PATH=/Users/jarek/.docker/machine/machines/default\n\
  DOCKER_MACHINE_NAME=default\n```\n\n在出现 Docker daemon 连接问题时，始终检查环境变量。\n\n另一种测试设置的方法是\
  \ docker info 命令。从命令行 shell 执行以下操作：\n\n```\ndocker info\n```\n\n输出将包含大量有用的信息，关于服务器的内核版本、可用内存、正在运行的容器数量、机器名称等等。\n\
  \n现在让我们在 Terminal 中直接运行 hello-world 镜像，输入以下命令：\n\n```\ndocker run hello-world\n\
  ```\n\n如果你能看到镜像的输出，那么一切就绪，你的 Mac 上已成功设置了可用的 Docker：\n\n![](img/0c87321919fa245e22f056c67ec70003_43_0.png)\n\
  \n## 在 Linux 上安装\n\n正如我们之前所说，Linux 是 Docker 的自然栖息地。因此，没有必要虚拟化 Linux 内核。你可以在处理器中没有\
  \ VT-x 或类似技术的情况下运行 Docker，因为 Docker 只需要内核中可用 cgroups 即可使其大部分功能正常工作。Cgroups（控制组）是\
  \ Linux 内核的一项功能，可限制、核算并隔离一组进程的资源使用（CPU、内存、磁盘 I/O、网络等）。Docker 只会简单地使用你自己的操作系统的内核。这也使安装包更小——不需要虚拟化引擎和另一个虚拟化操作系统。这就是安装过程与\
  \ Mac OS 或 Windows 略有不同的原因。首先，安装中不包含 Docker Machine——对于 Linux 来说它并非强制。其次，没有花哨的 GUI\
  \ 安装程序。你需要从命令行执行大部分任务，但这对 Linux 用户来说应该不是问题。最后但同样重要的是，Linux 上没有 Kitematic 工具可用。\n\
  \n在 Docker 网站上，你可以找到特定 Linux 发行版的安装步骤（例如 Red Hat 使用 yum 包管理器，Ubuntu 使用 apt-get）。如果你不愿意直接使用包管理器，可以使用\
  \ Docker 团队提供的安装脚本。事实上，该脚本将执行适用于你的 Linux 操作系统的包管理器，然后使用包安装软件。要获取 Linux 的最新 Docker\
  \ 版本，请在 shell 中输入以下内容：\n\n```bash\n$ curl -fsSL https://get.docker.com/ | sh\n```\n\
  \n或者，你也可以使用 wget 命令安装 Docker，执行以下命令：\n\n```bash\n$ wget -qO- https://get.docker.com/\
  \ | sh\n```\n\n下载所需包的过程将开始，你会看到密钥、包及其依赖项被下载。在输出末尾，安装程序将打印已安装的 Docker 客户端和服务器的版本：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_45_0.png)\n\n以这种方式安装将使 Docker 服务可供 root\
  \ 运行。并非总是明智的做法以 root 身份运行软件，因此你可能希望也让你的用户可以运行它。首先，你需要创建 docker 组：\n\n```\n$ sudo\
  \ groupadd docker\n```\n\n然后将当前用户添加到该组（假设 yourUsername 是你的用户登录名：\n\n```\n$ sudo\
  \ usermod -aG docker yourUsername\n```\n\n如果你打算使用 Linux 进行云设置，你也希望安装 Docker Machine。要做到这一点，请执行此脚本：\n\
  \n```\n$ curl -L https://github.com/docker/machine/releases/download/v0.7.0/docker-machine-`uname\
  \ -s`-`uname -m` > /usr/local/bin/docker-machine\n$ chmod +x /usr/local/bin/docker-machine\n\
  ```\n\n\n\n你也可以直接前往 Linux 发行版页面并在 https://github.com/docker/machine/releases/ 选择所需的版本。\n\
  \n为了测试安装，让我们通过执行脚本来打印 Docker 服务状态（这是针对最新 Ubuntu Linux 的示例，我将在本书其余部分使用它）：\n\n```\n\
  $ sudo service docker status\n```\n\n如果服务响应正常，它将显示运行状态以及一些统计信息，例如服务可用的内存和一些最近的日志行：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_46_0.png)\n\n服务似乎运行正常，所以接下来我们要做的是运行简单的\
  \ hello-world 镜像。这里乐趣开始了——如果 Docker 无法在你的本地机器上找到镜像，它将从 Docker Hub 获取它然后运行它。我们将在第\
  \ 5 章《Finding Images》中更详细地讨论查找镜像和 Docker Hub。注销并重新登录后，在你的 shell 中输入以下命令来执行示例 hello-world\
  \ 镜像：\n\n```\ndocker run hello-world\n```\n\n执行命令后，正确的结果将只是 Hello from Docker 消息以及一些更有趣的事实：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_47_0.png)\n\n使用 Kitematic 在 Windows 或\
  \ Mac OS 上运行镜像时，你会得到相同的输出。Docker 会打印出运行镜像所需执行的步骤。再次强调，仅为打印这条简单消息，后台发生了很多事情，但运行示例镜像是测试设置的好方法。\n\
  \n## 在云上安装 — AWS\n\n在接下来的章节中，我们将展示如何使用 Docker Machine 远程创建 Docker 实例。这次我们将手动在 Amazon\
  \ EC2 云上安装 Docker 并运行示例镜像。如果你已在 EC2 云上运行 Linux，Docker 安装过程几乎与任何 Linux 系统相同。让我们从创建第一个\
  \ Linux 实例开始。\n\n要使用 EC2 云，你需要创建一个账户。基本用途是免费的，所以前往 http://aws.amazon.com 并填写注册表。此外，基本的\
  \ `t2.micro` 实例可供你免费使用，足以测试 Docker 安装。创建账户后，登录 **AWS Console** 并从可用服务列表中选择 **EC2**：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_48_0.png)\n\n接下来，使用 **Launch Instance**\
  \ 按钮启动实例：\n\n![](img/0c87321919fa245e22f056c67ec70003_48_1.png)\n\n下一页询问你的新 EC2\
  \ 实例应提供什么操作系统。对于我们的目的，**Amazon Linux** 就足够了。它在列表中排第一，选择它：\n\n![](img/0c87321919fa245e22f056c67ec70003_48_2.png)\n\
  \n接下来，你需要选择 **Instance Type**，它决定了你的服务器将拥有的 CPU、内存、存储和网络容量类型。坚持使用默认选项 `t2.micro`（免费）并点击\
  \ Next。接下来，点击 **Configure Instance Details** 按钮。\n\n然后 Amazon EC2 助手将显示实例配置页面，其中\
  \ `SSH` 端口（22）默认打开。根据你的需求，你可以添加或打开更多端口，例如如果你计划运行可通过 Web 浏览器访问的 Web 应用程序，则为 `HTTP`（80）：\n\
  \n| 类型 | 协议 | 端口范围 | 来源 |\n|------|----------|------------|--------|\n| SSH | TCP\
  \ | 22 | 任何地方 0.0.0.0/0 |\n| HTTP | TCP | 80 | 任何地方 0.0.0.0/0 |\n| 添加规则 |  |  |\
  \  |\n\n现在到了重要部分。为了能够远程登录到你的实例，你需要一个密钥对。它由公钥和私钥文件组成，你必须使用它们通过 SSH 连接到你的 EC2 实例。从下拉列表中选择\
  \ **Create a new key pair**，为其指定一个名称，例如 `MY_EC2`，然后点击 **Download Key Pair** 按钮：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_49_0.png)\n\n如果你点击 **Launch Instances**\
  \ 按钮，启动过程将开始并显示状态：\n\n![](img/0c87321919fa245e22f056c67ec70003_50_0.png)\n\n你也可以通过从\
  \ **Management Console** 菜单中选择 **Instances** 来检查你的 AWS 实例状态。这是一个方便的页面，可用于管理所有实例。状态页面将列出所有云机器、其状态（如运行或已停止），以及可用于登录实例的公共\
  \ IP：\n\n![](img/0c87321919fa245e22f056c67ec70003_50_1.png)\n\n我们新创建的实例似乎运行正常，所以让我们尝试登录其\
  \ shell。前往你之前保存 Amazon 生成的密钥的目录，并执行以下命令：\n\n```\nchmod 400 MY_EC2.pem.txt\nssh -i\
  \ MY_EC2.pem.txt ec2-user@52.58.22.247\n```\n\n这里，`MY_EC2.pem.txt` 是生成的密钥的文件名，而\
  \ `52.58.22.247` 是你的远程实例的公共 IP 地址——当然，这两者对你来说会不同。运行 SSH 登录后，你将看到 Amazon Linux 的欢迎界面：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_51_0.png)\n\n从现在开始，Docker 安装过程与任何 Linux\
  \ 设置差别不大。首先，最好升级操作系统软件以确保错误修复到位。在 Amazon Linux 上执行此操作，请执行以下命令：\n\n```\nsudo yum\
  \ update -y\n```\n\n接下来，使用 `yum` 包管理器安装 Docker 并将你的用户添加到 `docker` 组：\n\n```\nsudo\
  \ yum install -y docker\nsudo usermod -a -G docker ec2-user\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_51_1.png)\n\
  \n将你的用户添加到 `docker` Linux 组后，你需要注销并重新登录，以便能够以普通非 root 用户身份运行 Docker。\n\n安装 Docker\
  \ 后，让我们直接检查它是否正在运行。我们将通过启动 `hello-world` 镜像来完成此操作。执行以下命令：\n\n```\ndocker run hello-world\n\
  ```\n\nDocker 将从 Docker Hub 获取镜像然后运行它：\n\n![](img/0c87321919fa245e22f056c67ec70003_52_0.png)\n\
  \n著名的 `Hello from Docker` 消息简单地说明你现在已成功在 AWS 云中运行 Docker 容器！\n\n现在我们已完成安装过程，希望你能够在你选择的\
  \ operating system 上运行示例 `hello-world` 镜像。让我们在下一章中更深入地探索容器化世界，了解更多关于容器和镜像的知识。\n\n\
  ## 摘要\n\n在本章中，我们介绍了在各种操作系统和 Amazon 云上安装 Docker 的过程。到目前为止，你应该已验证 Docker 安装并使其运行。我们还了解了可供我们使用的工具及其用途。现在先放下它，学习一些理论。\n\
  \n在下一章中，我们将深入探讨 Docker 的镜像和容器架构。在运行 Docker 容器或创建自己的镜像之前，了解一些概念是必不可少的。\n\n# 3\n\n\
  ## 3 理解镜像和容器\n\n在上一章中，我们学习了如何在 Windows、Mac OS、Linux 和 Amazon EC2 云上安装 Docker。到目前为止，你应该已在机器上运行\
  \ Docker 并能够在容器中运行 hello-world 镜像。在本章中，我们将更深入地探索镜像和容器的世界。稍后，我们还将介绍与镜像分发相关的术语，例如\
  \ Docker repository、registry 和 index。本章将涵盖以下主题：\n\n- 镜像\n- 层\n- 容器\n- 保存容器更改\n-\
  \ Docker registry、repository 和 index\n\n请注意，我们主要使用 shell（或 Windows 中的命令提示符）来执行 Docker\
  \ 命令。你可以随时执行 docker help 来获取可用命令的描述。例如，执行 docker help 后跟特定命令的名称 docker help pull，将显示有关该命令的信息以及可用选项的简要描述：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_55_0.png)\n\n让我们开始详细解释镜像、层和容器是什么。\n\n\
  ### 镜像\n\n你可以将镜像视为只读模板，它是运行容器的基础。它就像一个模板，包含应用程序运行所需的一切。它可以是安装了 Web 服务器和你的 Web 应用程序的\
  \ Ubuntu Linux。每个镜像都从一个基础镜像开始，例如 Ubuntu，一个基础 Linux 镜像。你可以自己创建镜像——镜像是使用一系列命令（称为指令）创建的，这些指令在\
  \ Dockerfile 中描述。它是有序的层集合——根文件系统更改堆叠在一起。这些更改可以是运行命令、添加文件或目录、创建环境变量等等。Docker 使用一种名为\
  \ AUFS 的文件系统，全称为 Augmented File System。Dockerfile 的几乎每一行（有一些例外，我们稍后会解释）都会创建一个新镜像，当你将它们全部堆叠或增强在一起时，你将得到最终的\
  \ Docker 镜像。这本质上是一种缓存方式。例如，如果你只更改 Dockerfile 的一行，Docker 不会重建整个镜像集。Dockerfile 在开始构建镜像的过程时会按顺序处理。Docker\
  \ 将逐一执行指令并返回最终镜像。每个指令在镜像中创建一个新层。我们将在第 6 章《Creating Images》中介绍该过程。\n\n\n\nDocker\
  \ 镜像在不同主机之间具有高度可移植性 —— 镜像可以在任何运行 Docker 的主机上的 Docker 容器中运行。需要注意的是，Docker 使用镜像来运行你的代码，而不是\
  \ Dockerfile。Dockerfile 用于在运行 `build` 命令时创建镜像 —— 我们将在 `Chapter 6`、*Creating Images*\
  \ 中再次讨论它。此外，如果你将镜像发布到 Docker Hub，你发布的是生成的镜像，而不是源 Dockerfile。我们将在本书后面、`Chapter 8`、*Publishing\
  \ Images* 中描述该过程。\n\n本地机器上拥有的镜像可以通过运行 `docker images` 命令列出：\n\n![](img/0c87321919fa245e22f056c67ec70003_56_0.png)\n\
  \nimages 命令将显示一个包含以下列的表格：\n\n- `REPOSITORY` : 这是仓库的名称。我们将在本章末尾详细解释它。\n- `TAG` :\
  \ 它类似于 Git 或其他版本控制系统的标签。它代表仓库提交历史中的一个特定点。在构建镜像时你可以拥有多个标签。甚至还有一个名为 latest 的特殊标签，表示最新版本。标签的完整形式为\
  \ `[REGISTRYHOST/][USERNAME/]NAME[:TAG]`，但 TAG 列只是完整标签中的 `[:TAG]` 部分。我们将在 `Chapter\
  \ 6`、*Creating Images* 中详细讲解标签。\n- `IMAGE ID` : 这是镜像的标识符（实际上它是镜像真实标识符的前 12 个字符）。你可以在执行镜像命令时使用它来引用特定镜像，但也可以使用镜像的名称。\n\
  - `CREATED` : 日期表示仓库创建的时间。你可以用它来验证镜像构建的新鲜程度。\n- `SIZE` : 这是镜像的大小。\n\n要删除系统上所有的镜像，请执行以下命令：\n\
  \n```\ndocker rmi $(docker images -q)\n```\n\n每当你将一个已被使用的标签分配给新镜像时（例如，通过构建镜像 myImage，对其\
  \ Dockerfile 进行更改，然后再次构建 myImage），旧镜像将失去该标签，但仍会保留，即使其所有标签都被删除。这些旧版本的镜像是 Docker images\
  \ 输出中的未标记条目，你可以使用以下命令安全地删除它们：\n\n```\n$ docker rmi <IMAGE HASH>\n```\n\n要删除所有未标记的\
  \ docker 镜像，请使用镜像列表和过滤器：\n\n```\n$ docker rmi $(docker images -q -f dangling=true)\n\
  ```\n\n作为从头创建镜像的替代方案，你可以从互联网上数百个可用的镜像中挑选已准备好的镜像。此外，你可以在自己的私有镜像仓库中发布镜像，以便组织中的其他人可以拉取并复用。我们将在第\
  \ 5 章、查找镜像 中介绍查找镜像的过程。下载的镜像可以自由更新和扩展，因此下载基础镜像是在自己开发时获得显著提速的好方法。下载即用型镜像，例如 Web 服务器或数据库，然后在其基础上构建的做法非常常见。例如，你可以有一个基础的\
  \ Apache 镜像。你可以将它用作所有 Web 应用镜像的基础。这得益于镜像的内部特性 —— 层，Docker 镜像就是由这些层组成。我们之前说过，Dockerfile\
  \ 中的每一条指令都会创建一个新的层。现在让我们解释一下它们是什么。\n\n## Layers\n\n每个镜像都由一系列层叠加而成。通过使用联合文件系统，Docker\
  \ 将这些层组合成一个单一的镜像实体。联合文件系统允许对不同文件系统的文件和目录进行透明叠加，从而得到一个单一、一致的文件系统，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_58_0.png)\n\
  \n在这些独立文件系统中具有相同路径的目录的内容和结构，将在新的类虚拟文件系统中作为一个合并目录一起显示。换句话说，上层的文件系统结构会与下层结构合并。具有与上一层相同路径的文件和目录会覆盖其下方的对象。移除上层后，又会重新显示并暴露之前的目录内容。如前所述，层是堆叠放置的。为了保持层的顺序，Docker\
  \ 利用了层 ID 和指针的概念。每个层都包含 ID 和指向其父层的指针。没有指向父层的指针的层是堆栈中的第一层，即基础层。你可以在下图中看到这种关系：\n\n\
  ![](img/0c87321919fa245e22f056c67ec70003_58_1.png)\n\n当你从 Docker Hub 拉取镜像时，你实际上可以看到每个依赖层的下载进度。以下是最新版\
  \ Ubuntu Linux 的示例：\n\n![](img/0c87321919fa245e22f056c67ec70003_59_0.png)\n\n使用层带来的另一个优势是历史的持久性。层可以提供特定镜像是如何构建的历史记录。一旦所有层下载完成，你可以使用\
  \ history 命令列出特定镜像中的层：\n\n```\n$ docker history ubuntu\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_59_1.png)\n\
  \nhistory 命令输出中的每一行都对应一次对文件系统的提交。SIZE 列中的值加起来等于 docker images 中镜像对应的 SIZE 列。\n\n\
  你也可以使用可在 https://imagelayers.iron.io 获取的 ImageLayers Web 应用查看镜像的图形化表示：\n\n![](img/0c87321919fa245e22f056c67ec70003_60_0.png)\n\
  \n层有一些有趣的特性。首先，它们是可复用的。如果两个不同的镜像有共同部分，例如 Linux shell，Docker 会跟踪所有已拉取的层，并在两个镜像中复用\
  \ shell 层。这是一个安全操作；正如你记得的，层是只读的。在下载第二个镜像时，该层会被复用，只有差异部分会从 Docker Hub 拉取。这当然节省了时间和带宽、磁盘空间，但它还有另一个巨大的优势。如果你修改\
  \ Docker 镜像，例如提升应用版本，只有单个层会被修改。无需分发整个镜像，只推送更新即可，使过程更简单、更快。这在你使用 Docker 进行持续部署流程时尤其有用：推送一个\
  \ Git 分支会触发镜像构建，然后为用户发布应用。由于层的复用特性，整个过程快得多。因为有了层，Docker 相比于不共享任何内容的完整虚拟机来说更轻量。因为\
  \ Docker 使用的层缓存，当你拉取一个镜像（https://docs.docker.com/reference/commandline/pull/）时，最终不必下载其整个文件系统。如果你已有另一个镜像包含你要拉取的镜像的部分层，只有缺失的层才会被实际下载。不过，这里有一个警告，与层的另一个特性有关：除了可复用之外，层也是累加的。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_61_0.png)\n\n层是累加的 —— 因此镜像可能会变得相当大。\n\
  \n例如，如果你在容器中创建一个大文件，进行一次提交（我们稍后会讲到），然后删除该文件并再次提交，该文件仍会存在于层历史中。想象一下这个场景：你拉取基础 Ubuntu\
  \ 镜像并安装 Wildfly 应用服务器。然后你改变主意，卸载 Wildfly 并改装 Tomcat。Wildfly 安装中删除的那些文件仍会存在于镜像中 ——\
  \ 尽管它们已被删除。镜像大小会在短时间内增长。\n\n理解 Docker 的分层文件系统可以对镜像大小产生巨大影响。不断增长的大小在你将镜像发布到镜像仓库时会成为问题\
  \ —— 需要更多请求且传输时间更长。当需要在集群中部署数千个容器时，大镜像就会成为问题，例如。\n\n要扁平化镜像，你可以使用 export 命令将其导出为\
  \ TAR 文件：\n\n```\n$ docker export <CONTAINER ID> > /home/docker/myImage.tar\n```\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_61_1.png)\n\n将镜像导出为 TAR 不会保留其历史记录。\n\n\
  导出的文件随后可以使用 import 命令重新导入：\n\n```\n$ cat /home/docker/myImage.tar | docker import\
  \ - some-name:latest\n```\n\n如果可用磁盘空间真的成为问题，你可以将 export 的输出流管道到 import 的输入流：\n\n\
  ```\n$ docker export <CONTAINER ID> | docker import - exampleimagelocal:new\n```\n\
  \n另外，你也可以使用可在 GitHub https://github.com/jwilder/docker-squash 获取的 docker-squash\
  \ 工具使镜像变小。它会将多个 Docker 层压缩成一层，以创建层更少、更小的镜像。压缩后的镜像与原始构建方式工作相同，因为该工具保留了 Dockerfile\
  \ 命令，例如 PORT 或 ENV。此外，后续层中已删除的文件在压缩时实际上会从镜像中移除。\n\n\n\n如果需要，你也可以使用 cp（copy 的缩写）命令从已完成的容器中提取数据文件：\n\
  \n```\n$ docker cp <CONTAINER ID>:/path/to/find/files /path/to/put/copy\n```\n\n\
  层和镜像彼此密切相关。Docker 使用一些命令来处理镜像及其层，我们已经使用过其中大部分。现在让我们总结一下：\n\n| 镜像相关命令 | 描述 |\n|---|---|\n\
  | images | 这列出镜像 |\n| Build | 这从 Dockerfile 构建镜像 |\n| history | 这显示镜像的历史记录 |\n|\
  \ import | 这从 TAR 归档的内容创建新的文件系统镜像 |\n| load | 这从 TAR 归档加载镜像 |\n| rmi | 这删除一个或多个镜像\
  \ |\n| Save | 这将镜像的内容保存到 TAR 归档 |\n| inspect | 这返回有关镜像的低级信息 |\n\n层是容器世界中的一个很棒的功能。合理使用时，在创建镜像时可以提供很大帮助。但它们也有局限性。目前，AUFS\
  \ 的层数限制为 42 层 https://github.com/dotcloud/docker/issues/1171。这意味着你应该在可能的情况下将相似的命令分组，这样只会产生一个单一的层。\n\
  \n正如我们之前所说，Docker 镜像以一系列只读层存储。这意味着一旦容器镜像创建完成，它就不会改变。但让整个文件系统都只读并没有多大意义。修改镜像怎么办？向基础\
  \ Web 服务器镜像添加你的软件？好吧，当我们启动一个容器时，Docker 实际上会取出只读镜像（及其所有只读层），并在层栈顶部添加一个读写层。现在让我们关注容器。\n\
  \n## 容器\n\n镜像的运行实例称为容器。Docker 使用 Docker 镜像作为只读模板来启动它们。用编程的比喻来说，如果镜像是一个类，那么容器就是该类的一个实例——一个运行时对象。容器是运行应用程序的环境的轻量级且可移植的封装。要将镜像转换为容器，Docker\
  \ 引擎会取出镜像，在其顶部添加一个读写文件系统，并初始化各种设置，包括网络端口、容器名称、ID 和资源限制（我们将在第 7 章《运行容器》中讨论向容器应用资源限制）。要运行容器，请使用我们在上一章测试安装时使用的相同命令\
  \ docker run：\n\n```\n$ docker run [OPTIONS] IMAGE [COMMAND]\n[ARG...]\n```\n\n\
  ![](img/0c87321919fa245e22f056c67ec70003_63_0.png)\n\n你可以同时运行同一镜像的多个容器。\n\nrun 命令有很多可用的选项。其中一些包括网络配置，例如（我们将在下一章解释\
  \ Docker 的网络）； -it（交互式）选项告诉 Docker 使容器交互式并将其输出和输入附加到终端。我们将在第 7 章《运行容器》中详细介绍所有选项。现在，让我们只关注容器的概念，以便更好地理解整体情况。让我们尝试一个简单的命令，使用最新版本的\
  \ Ubuntu 启动一个新容器。交互式运行的结果是，一旦此容器启动，你将获得一个 bash 提示符 shell，可以在其中执行 Ubuntu 命令，就像在普通\
  \ shell 中一样：\n\n```\n$ docker run -it ubuntu:latest\n/bin/bash\n```\n\n当我们运行此命令时，幕后发生了什么？\n\
  \n镜像——在我们的例子中是 ubuntu:latest——将从 ubuntu 仓库拉取下来，除非它已在你的本地机器上可用。\n\nDocker 引擎取出镜像并在层栈顶部添加一个读写层，然后初始化镜像名称、ID\
  \ 和资源限制（如 CPU 和内存）。在此阶段，Docker 还会通过从池中查找并附加一个可用 IP 地址来设置 IP 地址。执行的最后一步将是实际命令——作为最后一个参数传递：在我们的例子中为\
  \ /bin/bash——它启动一个可以登录的 shell。Docker 将捕获并提供容器输出；它将显示在控制台中。现在你可以做在为应用程序准备操作系统时通常会做的事。这可以是安装软件包（例如通过\
  \ apt-get）、使用 Git 拉取源代码、使用 npm 下载 Node.js 库等等。所有这些都将修改顶部可写层的文件系统。如果随后执行 commit 命令，将创建一个包含你所有更改的新镜像，可稍后运行。\n\
  \n有时我们可以告诉 Docker，在容器停止后我们不再需要它。为此，run 命令提供了 -rm 选项：\n\n```\n$ docker run -i -t\
  \ -rm ubuntu:latest\n/bin/bash\n```\n\n这将拉取（当然，如果它尚未在你的机器上）并启动最新的 Ubuntu 容器，并为我们提供一个交互式\
  \ bash shell。一旦我们完成工作并停止容器，它将被从文件系统中删除，从而释放驱动器上的一些空间。\n\n要停止容器，请使用 docker stop 命令。Docker\
  \ stop 的语法如下：\n\n```\n$ docker stop [OPTIONS] <container ID/name> [<container ID/name...>]\n\
  ```\n\nstop 命令没有太多选项；你可以提供 -t 选项来指定 Docker 在停止容器前等待的秒数，默认值为 10 秒。例如，要停止 ID 为 fa19b25b311e\
  \ 的容器，只需执行以下命令：\n\n```\n$ docker stop fa19b25b311e\n```\n\n容器在停止时将保留所有设置和文件系统更改（在顶部的读写层中），但所有进程将被停止，你将丢失内存中的任何内容。这就是停止的容器与\
  \ Docker 镜像的区别。有时你需要停止所有正在运行的容器，因此此命令可能会派上用场：\n\n```\ndocker stop $(docker ps -q)\n\
  ```\n\n要列出系统上所有的容器——无论是正在运行还是已停止——请执行 ps 命令：\n\n```\n$ docker ps -a\n```\n\n结果，Docker\
  \ 客户端将列出一个包含容器 ID（可在其他命令中用来引用容器的唯一标识符）、创建时间、启动容器时使用的命令、状态、暴露端口以及名称（由你指定或 Docker\
  \ 为你挑选的有趣名称）的表格：\n\n![](img/0c87321919fa245e22f056c67ec70003_65_0.png)\n\n如你所见，输出将包含有关容器状态和运行时间的详细信息以及用于在容器中启动的命令。\n\
  \n要删除容器，只需使用 rm 命令。如果你想一次删除所有已停止的容器，可以使用 ps 命令提供的容器列表并使用过滤器：\n\n```\n$ docker rm\
  \ -v $(docker ps -q -f status=exited)\n```\n\n## 将容器更改保存\n\n尽管镜像始终是只读且不可变的，但我们实际上可以对正在运行的容器进行更改——容器栈的顶层始终是读写（可写）层。这可以是添加或修改文件，例如安装软件包、配置操作系统等等。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_65_1.png)\n\n如果你在正在运行的容器中修改文件，该文件将被复制出底层只读层并进入顶部的读写层。你的更改仅应用于顶层，而联合文件系统将隐藏底层文件。原始文件不会被销毁——它仍然存在于底层的只读层中。如果你删除容器并再次重新启动同一镜像，Docker\
  \ 将启动一个全新的容器，不包含之前运行容器中所做的任何更改。\n\n换句话说，你对文件系统的更改不会影响基础镜像。然而，你可以使用 commit 命令从正在运行的容器（及其所有更改）创建新镜像：\n\
  \n```\n$ docker commit <container-id> <image-name>\n```\n\n要保存你对容器所做的更改，必须提交它们。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_66_0.png)\n\n在运行时，如果容器中的进程对其文件系统进行更改，那么当前容器文件系统与容器创建时所基于的镜像文件系统之间当然会存在差异。如果你运行\
  \ docker commit 命令，此差异将成为一个新只读镜像，你可以从中创建新容器。否则，如果你删除容器，此差异将消失。你可以对容器进行更新，但一系列更新会产生一系列新的容器镜像，因此系统回滚很容易。看看执行\
  \ commit 后会发生什么：\n\n![](img/0c87321919fa245e22f056c67ec70003_66_1.png)\n\n让我们看一个例子。首先，我们拉取一个名为\
  \ busybox 的基础镜像。Busybox 将许多常见 UNIX 工具的微小版本组合成一个单一的小型可执行文件。它为你在 GNU 中通常找到的大多数工具提供了替代品，例如文件实用程序、shell\
  \ 工具等等：\n\n```\n$ docker pull busybox\n```\n\n\n\n现在，我们对该镜像的容器进行更改；在本例中，我们新建一个文件夹：\n\
  \n```\n$ docker run busybox mkdir /home/test\n```\n\n目前，我们可以使用以下命令获取 busybox 容器\
  \ ID：\n\n```\n$ docker ps -a\n```\n\n让我们提交这个已更改的容器——这将创建一个名为 busybox_modified 的新镜像：\n\
  \n```\n$ docker commit <CONTAINER ID> busybox_modified\n```\n\n提交成功后，Docker 只会输出新生成镜像的完整\
  \ ID。\n\n为避免数据损坏或不一致，Docker 会暂停你正在提交更改的容器。虽然不推荐这样做，但你可以选择禁用此行为，将 --pause 选项设置为 false。\n\
  \n如果我们列出现在拥有的镜像，busybox 和 busybox_modified 都应出现在列表中。要查看它们，请执行 images 命令：\n\n```\n\
  $ docker images -a\n```\n\n如你所见，新的 busybox_modified 已出现在本地可用镜像列表中：\n\n![](img/0c87321919fa245e22f056c67ec70003_67_0.png)\n\
  \n要查看两个镜像之间的差异，我们可以使用以下文件夹检查：\n\n```\n$ docker run busybox [ -d /home/test ] &&\
  \ echo 'Directory found' || echo 'Directory not found'\n$ docker run busybox_modified\
  \ [ -d /home/test ] && echo 'Directory found' || echo 'Directory not found'\n```\n\
  \n现在我们有两个不同的镜像（busybox 和 busybox_modified），并且我们有一个基于 busybox 创建的容器，其中也包含该更改（新文件夹\
  \ /home/test）。commit 命令会将容器的顶层读写层转换为只读层。实际上，容器（无论是运行中还是已停止）都会变成新的、只读的、不可变的镜像。\n\n\
  当容器被删除时，可写层也会被删除。\n\n通过修改容器中的顶层可写层来创建镜像在调试和实验时很有用，但通常最好使用 Dockerfile 以文档化且可维护的方式管理镜像。我们将在第\
  \ 6 章《创建镜像》中进行此操作。\n\n![](img/0c87321919fa245e22f056c67ec70003_68_0.png)\n\n容器是镜像的有状态实例化。\n\
  \n我们在本节中使用了一些容器相关命令，让我们将其总结在表格中：\n\n| 容器相关命令 | 描述 |\n|---|---|\n| attach | 这用于附加到正在运行的容器\
  \ |\n| commit | 这用于从 Dockerfile 构建镜像 |\n| cp | 这显示镜像的历史记录 |\n| create | 这从 TAR 归档的内容创建新的文件系统镜像\
  \ |\n| diff | 这从 TAR 归档加载镜像 |\n| exec | 这删除一个或多个镜像 |\n| inspect | 这将镜像的内容保存到 TAR\
  \ 归档 |\n| kill | 这返回有关镜像的低级信息 |\n| start / stop / restart / pause / unpause | 这管理容器的运行状态\
  \ |\n| logs | 这获取容器的日志 |\n| port | 这列出容器的端口映射或特定映射 |\n| rename | 这用于重命名容器 |\n| run\
  \ | 这用于在新容器中运行命令 |\n| stats | 这用于显示容器资源使用统计的实时流 |\n| top | 这用于显示容器的运行进程 |\n| Update\
  \ | 这用于更新一个或多个容器的配置 |\n| Wait | 这用于阻塞直到容器停止，然后打印其退出代码 |\n\n我们现在已经了解了容器化世界中的构建（镜像）和运行（容器）部分。我们仍然缺少最后一个元素——分发组件。Docker\
  \ 的分发组件由 Docker registry、index 和 repository 组成。让我们现在关注它们，以获得完整的图景。\n\n## Docker\
  \ registry、repository 和 index\n\nDocker 使用分层系统来存储镜像，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_69_0.png)\n\
  \n该系统中的第一个组件是 registry。你构建的镜像将被存储在远程 registry 中供他人使用。Docker registry 是一个服务（实际上是一个应用程序），用于存储你的\
  \ Docker 镜像。Docker Hub 是公开可用 registry 的一个示例——它是免费的，并提供庞大且不断增长的现有镜像集合。我们将在第 5 章《查找镜像》中详细介绍\
  \ Docker Hub。当然，互联网上还有其他 registry，例如 Artifactory (https://www.jfrog.com/artifactory)、Google\
  \ Container Registry (https://cloud.google.com/container-registry) 和 Quay (https://quay.io)。\n\
  \n**repository** 另一方面，是相关镜像的集合（命名空间），通常提供同一应用程序或服务的不同版本。换句话说，它是具有相同名称但不同标签的不同 docker\
  \ 镜像的集合。如果你的应用名为“hello-world”，并且你在 Registry 中的用户名（或命名空间）是 `developingWithDocker`，那么你的镜像将被放置在\
  \ `developingWithDocker/hello-world` 仓库中。你可以为镜像打标签，并在单个命名仓库中存储该镜像的不同 ID 的多个版本，使用特殊语法访问镜像的不同标签版本，例如\
  \ `username/image_name:tag`。Docker 仓库由 URI 标识，可以是公共的也可以是私有的。URI 的格式如下：\n\n```\n\
  {registryAddress}/{namespace}/{repositoryName}:{tag}\n```\n\nDocker Hub 是默认的 registry，如果你未指定\
  \ registry 地址，Docker 将从 Docker Hub 拉取镜像。\n\n![](img/0c87321919fa245e22f056c67ec70003_70_0.png)\n\
  \n对于托管在 Docker Hub 上的仓库，可以省略 registry 地址。\n\n我们在本章前面提到过标签——我们将在第 6 章《创建镜像》中详细介绍它们。一个\
  \ registry 通常托管多个 Docker 仓库。\n\nRegistry 和 repository 之间的区别在开始时可能会令人困惑，因此让我们描述一下如果你执行以下命令会发生什么：\n\
  \n```\n$ docker pull ubuntu:14.04\n```\n\n该命令从 Docker Hub registry 下载 ubuntu 仓库中标记为\
  \ 14.04 的镜像。Ubuntu 仓库不使用用户名，因此在此示例中省略了命名空间部分。\n\n让我们在表格中总结仓库相关命令：\n\n| 仓库相关命令 |\
  \ 描述 |\n|---|---|\n| login | 这用于登录 Docker registry |\n| logout | 这用于从 Docker registry\
  \ 注销 |\n| pull | 这用于从 registry 拉取镜像或仓库 |\n| push | 这用于向 registry 推送镜像或仓库 |\n| search\
  \ | 这用于在 Docker Hub 搜索镜像 |\n\n尽管 Docker Hub 是公开的，但使用你的 Docker Hub 用户账户可以免费获得一个私有仓库，但它不能用于你所属的组织。如果你需要更多账户，可以升级你的\
  \ Docker Hub 计划，这将不是免费的。有一些付费计划基于你需要的私有仓库数量。我们将在第 5 章《查找镜像》和第 8 章《发布镜像》中详细介绍 Docker\
  \ Hub。\n\n另一方面，私有 registry 可以为你或组织中的其他用户在公司自己的网络中设置。\n\n![](img/0c87321919fa245e22f056c67ec70003_71_0.png)\n\
  \n你可以在公司防火墙后面创建私有 registry。\n\n要运行你完全私有的 registry，你可以使用 Docker Hub 本身。它是一个开源应用程序，也可作为\
  \ Docker 镜像使用。最简单的情况就是运行以下命令：\n\n```\n$ docker run -d -p 5000:5000 --name registry\
  \ registry:2\n```\n\n结果，你将在自己的机器上启动一个私有 registry。\n\n你应该了解的最后一个组件是 Index。Index 管理搜索和标签，同时也管理用户账户和权限。事实上，registry\
  \ 将身份验证委托给 index。当执行 push 或 pull 等远程命令时，index 首先会查看镜像的名称，然后检查它是否有对应的仓库。如果有，index\
  \ 会验证你是否有权访问或修改该镜像。如果有权限，操作将被批准，registry 会接收或发送镜像。\n\n## 总结\n\n让我们总结一下我们迄今为止学到的内容。我们已经知道\
  \ Dockerfile 是 Image 的源代码。它包含按顺序排列的构建镜像的指令。镜像是文件系统的一种特定状态：一个只读的、冻结的、不可变的实时容器快照。它由代表不同时间点文件系统更改的层组成；层有点像\
  \ Git 仓库的提交历史。另一方面，容器是镜像的运行时实例。它们可以有状态（例如运行或停止）。你可以在容器上对文件系统进行更改并提交以使其持久化，但只有文件系统更改可以被提交——内存更改将会丢失。Commit\
  \ 总是创建一个新镜像。我们还提到了 registry 的概念，它保存了命名仓库的集合，而这些仓库本身是按 ID 跟踪的镜像集合。registry 就像 Git\
  \ 仓库：你可以推送和拉取容器。我们将在第 5 章《查找镜像》中详细介绍仓库。\n\n阅读完本章后，你应该对具有层和容器的镜像的本质有所了解。但 Docker\
  \ 提供了另一种将容器扩展并开放给外部世界的方式：网络和持久存储。我们将在下一章介绍这个主题。\n\n\n"
- "# 4 网络和持久化存储\n\n在上一章中，我们学习了镜像和容器以及修改它们的方法。就实际用途而言，容器内部运行的服务需要暴露给外部世界。Docker 工具链提供了一个非常强大的网络接口，使您能够根据需要暴露并控制网络连接。在本章中，我们将深入探讨\
  \ Docker 网络方法。持久化存储对于存储数据很有用，因为正如你在前几章中记得的，Docker 文件系统是临时的，换句话说。如果停止正在运行的容器，你的所有更改都将丢失：任何被删除的文件都会恢复，而你对现有文件所做的任何更改都不会存在。在本章中，我们将涵盖以下主题：\n\
  \n- Docker 网络，包括网络类型如 host、bridge 或 overlay\n- 暴露和映射端口\n- 链接容器\n- 创建 Docker 卷\n\n\
  让我们从网络概述开始。\n\n## Docker 网络\n\nDocker 使用 **容器网络模型 (CNM)** 的概念。本质上，CNM 允许你为一组容器创建小型、分割的网络以便它们进行通信。让我们使用下面的图表来解释该模型：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_74_0.png)\n\nCNM 中存在三个实体：\n\n- **sandbox:**\
  \ 这是一个隔离的环境，保存容器的网络配置。\n- **endpoint:** 这是一个可用于在特定网络上通信的网络接口。端点加入到恰好一个网络。一个网络沙箱内可以存在多个端点。\n\
  - **network:** 它是一组能够相互通信的端点。例如，你可以创建两个独立的网络，它们将完全隔离。网络可以通过其名称（如 **backend** 和 **frontend**）或\
  \ ID（由 Docker 在网络创建期间自动生成）来标识。\n\nDocker 网络模型还引入了网络驱动的概念。默认情况下，Docker 提供了两个网络驱动：`bridge`\
  \ 和 `overlay` 驱动。我们稍后会回到这个问题。\n\n同一网络上的所有容器都可以自由地相互通信。端点为沙箱提供网络连接——如果需要将容器加入多个网络，则每个容器应有多个端点。该网络模型高度可配置（并且允许相当复杂的网络配置），但使用默认设置也很容易设置。事实上，Docker\
  \ 开箱即为我们创建了一些默认网络。\n\n我们在本章中用于处理网络的 `docker` 命令是 `network` 命令。正如你在上一章中记得的，简洁的帮助始终可从\
  \ shell（或命令行）获得——让我们查看 `docker network help` 命令的输出：\n\n![](img/0c87321919fa245e22f056c67ec70003_75_0.png)\n\
  \n与网络相关的命令并不多，但它们非常有用。让我们开始解释默认网络。\n\n## 默认网络\n\n当你安装 Docker 时，会自动创建三个默认网络——你可以使用\
  \ `network ls` 命令列出它们，如下所示：\n\n```\n$ docker network ls\n```\n\nDocker 将输出可用网络的列表，包括其\
  \ ID、网络名称、驱动（我们稍后会介绍驱动）和作用域，如以下屏幕截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_76_0.png)\n\
  \n我们默认安装了三个网络：host、none 和 bridge。让我们更详细地讨论它们，从最简单的 none 开始。\n\n### 无网络\n\n简而言之，none\
  \ 模式根本不配置网络。之前列出的 DRIVER 列包含 null，这意味着该网络没有使用任何驱动。当你不需要容器具有网络访问权限时，这很有用。\n\n让我们通过在没有网络的情况下运行\
  \ busybox 镜像来运行简单示例：\n\n![](img/0c87321919fa245e22f056c67ec70003_77_0.png)\n\n例如，容器的网络详细信息，如\
  \ IP 地址，可以使用 docker inspect 命令，然后使用 grep 过滤输出。要执行此操作，请执行以下操作：\n\n```\n$ docker inspect\
  \ <container ID or name> | grep IPAddress\n```\n\n如果我们现在检查使用 --net=none 选项启动的容器，我们会看到新容器未被分配\
  \ IP 地址：\n\n![](img/0c87321919fa245e22f056c67ec70003_77_1.png)\n\n### 主机网络\n\n如果你使用\
  \ `--net=host` 选项启动容器，则容器将使用主机网络。这是一个默认创建的网络，它使用 `host` 驱动。它与普通网络一样快：没有桥接，没有转换，什么都没有。这就是为什么当你需要获得最佳网络性能时它会很有用。在此模式下，容器共享主机的网络命名空间（例如你的本地机器），直接将其暴露给外部世界。在\
  \ `--net=host` 的情况下，可以通过主机的 IP 地址访问容器。这也意味着你不需要使用端口映射来访问容器内的服务。然而，你需要意识到这可能很危险。如果有以\
  \ root 运行且存在漏洞的应用程序，就存在安全漏洞的风险——有人可以通过 Docker 容器远程控制主机网络。\n\n### 桥接网络\n\n我们将更关注\
  \ `bridge` 网络，因为它可能是使用最频繁的网络。`bridge` 网络有点特殊——它存在于所有 Docker 主机上。你可以将其视为主机网络栈的一部分。例如，你可以使用\
  \ Mac 或 Linux 机器上的 `ifconfig` 命令查看它：\n\n![](img/0c87321919fa245e22f056c67ec70003_78_0.png)\n\
  \n它也是 Docker 中的默认网络。当 Docker 服务守护进程启动时，它会配置一个名为 docker0 的虚拟桥接。除非你使用 docker run --net=<NETWORK>\
  \ 选项指定网络，否则 Docker 守护进程默认会将容器连接到桥接网络。此外，如果你创建新容器，它将被连接到桥接网络。Docker 将从桥接上可用的范围内找到一个空闲\
  \ IP 地址，并用该 IP 地址配置容器的 eth0 接口。从现在开始，如果新容器想要例如连接到互联网，它将使用桥接——主机自己的 IP 地址将被用作网关。该桥接将自动在连接到它的任何其他网络接口之间转发数据包，并允许容器与主机机器以及同一主机上的其他容器通信。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_79_0.png)\n\n默认情况下，Docker 容器可以连接到外部世界，它们通过\
  \ docker0 接口连接，但外部世界无法连接到容器。\n\n我们之前看到的 docker network inspect 命令显示了给定网络上所有已连接的容器及其网络资源。此默认网络中的容器能够使用\
  \ IP 地址相互通信。\n\n有时，Docker 创建的默认网络是不够的。幸运的是，Docker 允许我们创建自己的自定义网络。让我们创建一个自定义网络。\n\
  \n## 创建网络\n\n正如你从 network help 命令中看到的，有一个 create 命令。从 shell 或命令行运行：\n\n```\n$ docker\
  \ network create backend\n```\n\n这是命令的最简单形式，然而它可能最常被使用。它采用默认驱动（我们没有使用任何选项来指定驱动——我们稍后会介绍网络类型和驱动）。作为输出，Docker\
  \ 将打印出网络 ID。你可以在以后连接容器到该网络或检查网络属性时使用此 ID 来引用该网络。\n\n命令的最后一个参数是网络的名称——这比 ID 更方便、更容易记住。\n\
  \n\n\n在我们的例子中，网络名称是 backend。network create 命令接受更多参数，如下表所示：\n\n| 选项 | 描述 |\n|---|---|\n\
  | `-d, --driver=\"bridge\"` | 这是用于管理网络的驱动程序 |\n| `--aux-address=map[]` | 网络驱动程序使用的辅助\
  \ IPv4 或 IPv6 地址 |\n| `--gateway=[]` | 用于主子网的 IPv4 或 IPv6 网关 |\n| `--ip-range=[]`\
  \ | 用于从子范围分配容器 IP |\n| `--ipam-driver=default` | 这是 IP 地址管理驱动程序 |\n| `-o, --opt=map[]`\
  \ | 设置驱动程序的特定选项 |\n| `--subnet=[]` | 这是以 CIDR 格式表示网络段的子网 |\n\n最重要的参数之一是 driver，其值为\
  \ bridge driver，可让你指定网络类型。Docker 默认提供一些驱动程序。我们将在不久后详细介绍它们，但首先，让我们将容器连接到网络。\n\n##\
  \ 在网络中运行容器\n\n创建网络后，你可以使用 docker run --net=<NETWORK> 选项在上面启动容器，其中 <NETWORK> 是默认网络之一的名称或你自己创建的网络的名称，例如：\n\
  \n```\ndocker run -it --net=bridge ubuntu\n```\n\n如果你不想明确指定容器应以哪个网络启动，但只是想告知 Docker\
  \ 你希望容器连接到其他容器使用的同一网络，请使用带有 container: 前缀的 --net 选项执行 run 命令，指定其他容器的 ID 或名称。例如，执行以下命令：\n\
  \n```\ndocker run -it --name=myUbuntu --net=bridge ubuntu\ndocker run -it --net=container:myUbuntu\
  \ busybox\n```\n\n这将使你的 busybox 容器在与 Ubuntu 容器相同的网络上运行，无论该网络是什么。启动到同一网络的容器必须在同一\
  \ Docker 主机上运行。网络中的每个容器都可以立即与其他容器通信。\n\n然而，网络本身会将容器与外部网络隔离，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_81_0.png)\n\
  \n让我们在网络上运行容器：\n\n- 1. 让我们连接两个容器到网络以查看是否有效。首先，我们将创建一个网络：\n- 2. 接下来，让我们创建第一个容器，它将是\
  \ busybox，并将其连接到 testNetwork：\n\n```\ndocker network create testNetwork\n```\n\n\
  ```\ndocker run -it --name=container1 --net=testNetwork busybox\n```\n\n- 3. 现在，如果我们运行第二个\
  \ busybox 容器并将其连接到 testNetwork，使用相同的 --net=testNetwork，我们可以看到两个容器可以相互看到；它们运行在同一网络上，并且\
  \ ping 命令确实有响应：\n\n```\ndocker run -it --name=container2 --net=testNetwork busybox\n\
  ```\n\n![](img/0c87321919fa245e22f056c67ec70003_82_0.png)\n\n- 4. 因此，我们已成功将第二个容器附加到\
  \ testNetwork（使用默认的 bridge 驱动程序）。\n- 5. 现在让我们查看网络的详细信息。为此，我们将使用 network inspect\
  \ 命令：\n\n```\ndocker network inspect testNetwork\n```\n\nDocker 将输出关于网络的综合报告：\n\n\
  ![](img/0c87321919fa245e22f056c67ec70003_83_0.png)\n\n正如你所见，该报告包含许多有趣的细节，例如使用的驱动程序以及当前连接到此网络的容器列表。\n\
  \n正如容器可以连接到网络一样，它也可以断开连接，并且相应的网络接口将被移除。network disconnect 命令的语法如下：\n\n```\ndocker\
  \ network disconnect <network ID or name> <container Id or name>\n```\n\n例如，要将我们的\
  \ container1 从 testNetwork 断开，我们需要执行以下命令：\n\n```\ndocker network disconnect testNetwork\
  \ container1\n```\n\n创建单独网络的可能性旨在隔离服务，以便网络上只有需要相互通信的东西。在实践中，你很可能拥有许多网络，每个网络连接的容器数量很少。网络彼此完全隔离。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_84_0.png)\n\n如果两个容器不在同一网络上，它们无法直接通信。\n\
  \n一个典型的例子是负载均衡器、Web 应用程序前端、Web 应用程序后端，最后是数据库。\n\n你可能希望有一天在不同 Docker 主机上运行的容器通过网络通信。在这种情况下，Docker\
  \ 的多主机网络功能非常有用。\n\n## 创建多主机网络\n\n到目前为止，我们一直在学习 bridge 网络驱动程序，它具有本地范围，这意味着 bridge\
  \ 网络是 Docker 主机本地的。除了基本网络驱动程序（null、bridge 和 host）之外，Docker 还提供 overlay 网络驱动程序。它具有全局范围，这意味着\
  \ overlay 网络可以在多个 Docker 主机上存在。你可以使用 overlay 网络连接到多个主机。这些 Docker 主机可以存在于不同的数据中心，甚至不同的云提供商中。在\
  \ Docker 中创建多主机网络时，你有两个选择。第一个是让 Docker Engine 以 swarm 模式运行。Swarm 模式已在 Docker 版本\
  \ 1.12 中引入——如果你使用的是 Docker for Mac 或 Docker for Windows（而不是 Docker Toolbox），你可以启用\
  \ swarm 模式。在其他情况下，当你运行较旧版本的 Docker 时，你也可以创建多主机网络，但你需要配置一个键值存储。让我们先从 swarm 模式开始，然后再介绍键值存储的设置。\n\
  \n### Swarm 模式\n\n要解释 swarm 模式是什么，首先我们需要了解此功能背后的一些术语。Swarm 本身是一个运行中的 Docker Engines\
  \ 集群。节点是属于集群的单个 Docker Engine 实例。然而，有一个要求，即所有将参与 swarm 的 Docker 主机都需要打开以下端口：\n\n\
  - TCP 端口 2377（用于 swarm 管理相关的通信）\n- TCP 和 UDP 端口 7946（用于节点通信）\n- TCP 和 UDP 端口 4789（用于我们现在创建的\
  \ overlay 网络流量）\n\n打开这些端口后，我们可以初始化 Docker swarm。Swarm 模式默认处于禁用状态；你可以使用 `docker swarm\
  \ init` 命令启用它，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_85_0.png)\n\n你在其上执行此命令的第一个\
  \ Docker Engine 成为 swarm 管理器——它将协调集群中参与的其他节点。\n\n正如前面的屏幕截图所示，第一次运行 `docker swarm\
  \ init` 会给出一个特殊输出：要在新创建的 swarm 中参与的其他 Docker 主机上运行的命令。在我们的例子中，它是：\n\n```\ndocker\
  \ swarm join\n--token SWMTKN-1-0vpwtxueqgr9ufx24zs1fw7zqou38p8w5bwqodoipgbm2scrdv-9owikcgrpuz4izuwy5ghni3xc\
  \ \\\n10.0.75.2:2377\n```\n\n当然，你希望确保其他机器可以访问管理器的 IP 地址。如果你将前面的命令在其他机器上运行，它们将加入集群。如果你现在运行\
  \ `docker info` 命令，你可以看到 swarm 的当前状态。你将获得有关 swarm 状态的信息（它是 `active`），当前主机的节点标识符，以及参与\
  \ swarm 的节点数量。要查看 swarm 中节点的详细列表，你可以执行以下命令：\n\n```\ndocker node ls\n```\n\n输出将包含节点列表，其中包含其主机名、可用性状态和管理器状态。我们的\
  \ swarm 运行后，我们可以创建一个 overlay 网络以使参与 swarm 的主机相互通信。这将是我们已经知道的相同的 `network create`\
  \ 命令；不过这次，我们将使用 overlay 驱动程序：\n\n```\ndocker network create --driver overlay mynet\n\
  ```\n\n如果你现在列出网络，你将看到 `mynet` 作为具有 swarm 范围的 overlay 网络，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_86_0.png)\n\
  \n如果你无法在最新版本（支持 swarm 模式）的 Docker 上运行，你也可以创建多主机网络。为此，你需要一个键值存储。让我们现在设置它。\n\n###\
  \ 键值存储 overlay 网络\n\n有一个要求。要创建 overlay 网络，你需要配置一个键值存储：\n\n![](img/0c87321919fa245e22f056c67ec70003_87_0.png)\n\
  \nDocker（通过 `libkv` —— 一个分布式键值存储抽象库）支持不同的键值存储。对于覆盖网络，你可以使用诸如 Consul、Etcd、Zookeeper（分布式存储）和\
  \ BoltDB（本地存储）等存储。我们将在示例中使用 Consul（https://www.consul.io）。\n\nDocker 覆盖网络起初看起来有点复杂，但在实际示例中却很容易理解。让我们创建一个覆盖网络。我们需要几个独立的\
  \ Docker 主机来测试它。我们这次将在 Windows 机器上进行，但该过程在 Mac 和 Linux 上相同。正如你在第 2 章 *安装 Docker*\
  \ 中可能记得的，如果需要在 Linux 操作系统上创建额外的主机，你需要先安装 `docker-machine` —— 它默认不包含。\n\n模拟独立主机，我们将使用\
  \ `docker-machine create` 命令开始创建一个新主机：\n\n```\ndocker-machine create -driver=virtualbox\
  \ host01\n```\n\n执行命令时，我们得到以下结果：\n\n![](img/0c87321919fa245e22f056c67ec70003_88_0.png)\n\
  \n现在 Docker 主机已运行，让我们在主机上安装 Consul。它将充当我们的服务发现服务器，并使我们的主机能够共享网络和通信。请注意，我们将以守护进程方式运行它并映射\
  \ Consul 上的端口号 `8500`（我们稍后在本章中会回到暴露和发布端口的话题）。另外，如你所见，我们需要将命令加上 `config host01` 前缀，因为现在我们有四个（包括默认）Docker\
  \ 主机在运行，我们需要指示 Docker 的 Engine 我们将在其上运行容器：\n\n```\ndocker $(docker-machine config\
  \ host01) run -d -p \"8500:8500\" -h \"consul\" progrium/consul -server -bootstrap\n\
  ```\n\n![](img/0c87321919fa245e22f056c67ec70003_89_0.png)\n\nConsul 运行后，让我们再创建两个额外的\
  \ Docker 主机，我们实际上将把它们连接到同一个多主机覆盖网络。请注意，这次我们给 Docker 的 Engine 提供了特殊指令，说明我们希望它们使用\
  \ Consul 协议的集群存储，使用我们之前映射的端口 8500：\n\n```\ndocker-machine create -d virtualbox --engine-opt=\"\
  cluster-store=consul://$(docker-machine ip host01):8500\" --engine-opt=\"cluster-advertise=eth1:0\"\
  \ host02\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_89_1.png)\n\n接下来是第三个也是最后一个主机。再次为引擎提供了相同的指令。使用端口号\
  \ 8500 通过 Consul 协议使用集群存储：\n\n```\ndocker-machine create -d virtualbox --engine-opt=\"\
  cluster-store=consul://$(docker-machine ip host01):8500\" --engine-opt=\"cluster-advertise=eth1:0\"\
  \ host03\n```\n\n现在总结一下：我们在本地机器上运行了三个不同的 Docker 主机。第一个运行着 Consul 容器，而后面的主机知道 Consul\
  \ 主机正在 8500 端口监听。让我们然后使用 machine 的 ls 命令列出这些主机：\n\n![](img/0c87321919fa245e22f056c67ec70003_90_0.png)\n\
  \n到目前为止一切顺利。我们有四个主机已准备就绪，每个主机都有不同的 IP 地址。现在让我们回到正题，在我们的第二个主机（host02）上创建一个覆盖网络。我们使用\
  \ network create 命令来执行此操作，这次使用 overlay 驱动程序。我们的网络名称将是 myOverlayNetwork：\n\n```\n\
  docker $(docker-machine config host02) network create -d overlay myOverlayNetwork\n\
  ```\n\n如果我们现在列出第二个主机上可用的网络，我们会看到名为 myOverlayNetwork 的覆盖网络出现在列表中。我们可以使用 network ls\
  \ 命令列出网络，再次将命令加上 config host02 前缀，以指示 Docker 我们想要从 host02 主机获取网络列表：\n\n```\ndocker\
  \ $(docker-machine config host02) network ls\n```\n\n如果你执行相同的命令，但使用第三个主机（host03），令人惊讶的是，myOverlayNetwork\
  \ 也会可用，即使我们没有明确为 host03 创建它。这就是 Consul 发挥作用的地方。正如你记得的，在创建主机期间，我们指示 Docker Engine\
  \ 使用在 8500 端口监听的 Consul。因此，我们的 host02 和 host03 共享同一个覆盖网络。\n\n在 host03 上列出网络，以发现\
  \ `myOverlayNetwork` 也在第三个主机上处于活动状态：\n\n```\ndocker $(docker-machine config host03)\
  \ network ls\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_91_0.png)\n\n现在，让我们看看它是否真的有效。这将是一个相当简单的测试\
  \ —— 我们将在 host02 中运行一个 nginx Web 服务器容器，并尝试查看它是否可以从 host03 看到。为此，在 host02 上执行命令。请注意，我们使用\
  \ `--net=myOverlayNetwork` 来指示 Docker 我们希望将 nginx 连接到我们刚刚创建的覆盖网络：\n\n```\ndocker\
  \ $(docker-machine config host02) run -itd --name=nginx\n--net=myOverlayNetwork\
  \ nginx\n```\n\n为了测试多主机网络，我们将从 `host03` 获取默认的 nginx 索引页。让我们安装 busybox，它包含 `wget`\
  \ 命令（用于从 Web 获取资源的命令）。同样，我们将 `busybox` 容器连接到同一个覆盖网络：\n\n```\ndocker $(docker-machine\
  \ config host03) run -it --net=myOverlayNetwork busybox\n```\n\n然后运行 wget 命令从运行在不同主机的\
  \ nginx 服务器获取网页：\n\n```\nwget -O- http://nginx\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_92_0.png)\n\
  \nwget 命令将把下载的 nginx 索引页输出到控制台：就这样 —— 我们使用三台独立机器创建了一个多主机容器网络。第一台运行着 Consul 服务器并使剩下的两个主机能够找到彼此并通信。就像桥接网络一样，你应该将这些覆盖网络用于实际需要相互通信的小组容器。\n\
  \n创建多主机网络时，我们在 Consul 服务器上打开了一个端口。暴露和发布网络端口是使容器能够与其他容器和外部世界通信的好方法。让我们更详细地了解暴露和映射端口。\n\
  \n## 暴露和映射端口\n\n常见的情况是，你希望你的容器化应用程序接受传入连接，无论来自其他容器还是 Docker 外部。它可以是监听 80 端口的应用服务器，也可以是接受传入请求的数据库。你可以通过两种方式暴露端口，要么在\
  \ Dockerfile 中使用 `EXPOSE` 指令（我们将在后面关于创建镜像的章节中进行），要么在 run 命令中使用 `--expose` 选项。这两个命令是等效的，不过\
  \ `--expose` 会接受端口范围作为参数（例如，`--expose=1000-2000`）。\n\n你还可以使用 `-p` 标志将容器中的端口（或一组端口）显式绑定到主机。此配置取决于主机，因此\
  \ Dockerfile 中不允许有等效指令。Dockerfile 需要与主机无关且可移植。\n\n![](img/0c87321919fa245e22f056c67ec70003_93_0.png)\n\
  \n你只能在运行时使用 `-p` 绑定端口。\n\n那么，`--expose` 和 `-p` 有什么区别呢？嗯，`--expose` 会在运行时暴露端口，但不会创建到主机的映射。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_93_1.png)\n\n如果你 `EXPOSE` 一个端口，容器中的服务无法从\
  \ Docker 外部访问，但可以从其他 Docker 容器内部访问。所以这对于容器间通信是很好的。\n\n`EXPOSE` 指令暴露端口以供链接中使用，我们稍后会解释。\n\
  \n另一方面，`-p` 选项就像发布 —— 它会创建端口映射规则，将容器上的端口映射到主机系统上的端口。如果未指定主机上的端口，Docker 将自动分配一个。请注意，如果你执行\
  \ `-p`，但未执行 `EXPOSE`，Docker 会隐式执行 `EXPOSE`。这是因为如果一个端口对公众开放，它也会自动对其他 Docker 容器开放。\n\
  \n\n\n看起来应该还有另一个选项，允许在容器启动期间自动映射镜像中（即在 Dockerfile 中）暴露的端口。就是它：-P 选项（这次是大写 P）会将一个动态分配的主机端口映射到所有由\
  \ Dockerfile 中的 EXPOSE 指令暴露的容器端口。让我们在表格中简要总结一下这些选项：\n\n| 指令 | 含义 |\n|---|---|\n\
  | EXPOSE | 这表示在指定的端口上有服务可用。这在 Dockerfile 中使用，使暴露的端口对其他容器开放。 |\n| --expose | 这与 EXPOSE\
  \ 类似，但用于运行时。 |\n| -p | 这指定了一个端口映射规则，将容器上的端口与主机机器上的端口映射。这使得端口从 Docker 外部开放。 |\n|\
  \ -P | 这将主机机器上的动态分配端口映射到使用 EXPOSE 或 --expose 暴露的所有端口。 |\n\n请注意，我们将以守护进程方式启动 nginx，Docker\
  \ 会返回容器 ID 以供将来参考，这样你就可以使用 kill 停止容器或使用 inspect 命令查看其详细信息。如果我们现在执行 ps 命令来列出活动和正在运行的容器，在\
  \ PORTS 列中我们会看到发生的端口映射。在我们的例子中，Docker 将 nginx 暴露的端口号 80 映射到主机机器上的端口号 32773，并将暴露的端口号\
  \ 443 映射到主机机器上的端口号 32772：\n\n```\ndocker run --name nginx -d -P nginx\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_94_0.png)\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_95_0.png)\n\n确定当前端口映射的最快方法就是使用 ps 命令（正如你从前几章记得的，它用于查看正在运行的容器的列表）。\n\
  \n-p 选项另一方面给了我们更多控制。在这种情况下，Docker 不会自动选择任何端口——由你决定主机上的哪些端口应映射到容器的端口。-p 选项的语法相当直接：你只需输入容器暴露的端口号、冒号，然后是希望在主机机器上映射的端口：\n\
  \n```\ndocker run -p <containerPort>:<hostPort> <image ID or name>\n```\n\n如果需要，你也可以使用\
  \ Dockerfile 中的 EXPOSE 指令（例如 EXPOSE 7000-8000）或 run 命令将一整段端口暴露给其他容器：\n\n```\ndocker\
  \ run --expose=7000-8000 <container ID or name>\n```\n\n当然你随后可以通过 Docker 的 run (https://docs.docker.com/engine/reference/commandline/cli/)\
  \ 命令将一段端口发布到主机机器：\n\n```\ndocker run -p 7000-8000:7000-8000 <container ID or name>\n\
  ```\n\n好吧，让我们使用 stop 命令停止 nginx 并启动另一个容器，这次将容器端口 80（在 Dockerfile 中暴露）映射到我们主机机器的端口号\
  \ 8080：\n\n```\ndocker run --name nginx -d -p 8080:80 nginx\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_95_1.png)\n\
  \n启动后，你可以通过链接 http://localhost:8080 在主机机器的本地地址和映射的端口 8080 访问默认的 nginx 欢迎页面。\n\n\
  ![](img/0c87321919fa245e22f056c67ec70003_96_0.png)\n\n作为 ps 命令的替代方案，你可以执行 port 命令，使用容器\
  \ ID 作为参数（容器启动期间 Docker 返回的 ID）来确定已映射的端口。以下是我在我的情况下的命令：\n\n```\ndocker port e1926dc061c5125b5aa3fd2685bcda4cf26ee99def4b2a1ae5e53721b88231c1\n\
  ```\n\n结果，Docker 将输出映射，说明容器中的端口号 80 已映射到主机机器上的端口号 8080：\n\n![](img/0c87321919fa245e22f056c67ec70003_96_1.png)\n\
  \n你也可以使用 inspect 命令查看有关暴露的（以及已映射的，如果有的话）端口的信息：\n\n```\ndocker inspect e1926dc061c5125b5aa3fd2685bcda4cf26ee99def4b2a1ae5e53721b88231c1\n\
  ```\n\n如果你滚动到 Ports 部分，你会找到镜像暴露的端口列表（在 nginx 的情况下将是 TCP 443 和 TCP 80）以及在主机机器上对应的映射端口，如果你决定使用\
  \ -p 或 -P 选项运行容器：\n\n![](img/0c87321919fa245e22f056c67ec70003_97_0.png)\n\n请注意，nginx\
  \ 镜像暴露了两个端口，但我们只映射了其中一个，端口号 80。你可以使用 -P 选项运行容器以自动映射所有暴露的端口（到 Docker 主机端口范围内的一个随机高端口），或者你可以有多个\
  \ -p 选项分别映射它们中的每一个。如果需要，你甚至可以像这样将多个主机机器端口映射到容器中的单个暴露端口：\n\n```\ndocker run --name\
  \ nginx -d -p 8080:80 -p 8081:80 nginx\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_97_1.png)\n\
  \n-p 标志可以多次使用来配置多个端口。\n\n端口映射是一个很棒的功能。它为你提供了灵活的配置可能性，让你的容器对外部世界开放。事实上，如果你希望你的容器化\
  \ Web 服务器、数据库或消息服务器能够与其他服务器通信，这是不可或缺的。\n\nDocker 网络是一个相当新的功能。然而 Docker 还有另一个可能派上用场的特性：容器之间的链接。让我们来了解一下它们。\n\
  \n## 链接容器\n\nDocker 包含一种机制，允许将多个容器链接在一起。已链接的容器会将连接信息从一个容器发送到另一个容器。在创建链接时，源容器的信息会被发送到目标容器。这种用例的一个很好的例子是将\
  \ Web 应用程序容器链接到数据库容器。链接后，数据库容器会向 Web 应用程序容器暴露一些信息（如数据库名称、连接 URL、用户名和密码）。要将容器链接在一起，我们在\
  \ run 命令中使用 --link 选项。如果我们将一个容器链接到另一个容器，幕后会发生两件事。首先，Docker 会自动更新已链接容器的 /etc/hosts\
  \ 文件，以便引用我们链接到的容器。\n\n让我们以示例来尝试。首先，让我们在桥接网络上运行 MySQL 容器：\n\n![](img/0c87321919fa245e22f056c67ec70003_98_0.png)\n\
  \n接下来，让我们运行第二个容器，同样是最新版的 Ubuntu，但这次将其与 MySQL 容器链接：\n\n```\ndocker run -it --name=ubuntu\
  \ --link mysql:mysql ubuntu\n```\n\n请注意 MySQL 容器必须正在运行。\n\n![](img/0c87321919fa245e22f056c67ec70003_98_1.png)\n\
  \n你只能链接到正在运行的容器。\n\n你可以看到 Docker 自动调整了 Ubuntu 容器的 /etc/hosts 文件，为 MySQL 实例插入了一个条目：\n\
  \n```bash\n$ docker run -it --name=ubuntu --link mysql:mysql ubuntu\nroot@60886fca65fb:#\
  \ more /etc/hosts\n127.0.0.1       localhost\n::1     localhost ip6-localhost ip6-loopback\n\
  fe00::0 ip6-localnet\nff00::0 ip6-mcastprefix\nff02::1 ip6-allnodes\nff02::2 ip6-allrouters\n\
  172.17.0.2      mysql 5d22b0ea87d4\n172.17.0.3      60886fca65fb\nroot@60886fca65fb:#\n\
  ```\n\n/etc/hosts 链接是持久的——如果重启源容器并分配新的 IP 地址，已链接容器的 /etc/hosts 文件将自动使用源容器新的 IP 地址进行更新。\n\
  \n创建链接时发生的第二个重要事情，是从我们链接到的容器传输一些暴露的环境变量。看看我们的已链接 Ubuntu 容器吧；它神奇地知道有关已链接 MySQL 数据库的位置和设置的大量信息，这都要归功于\
  \ --link 选项（当然，也要归功于正确定义的 MySQL 镜像，暴露了这些信息）：\n\n```bash\nroot@60886fca65fb:# env\
  \ | grep MYSQL\nMYSQL_ENV_MYSQL_ROOT_PASSWORD=my-secret-pw\nMYSQL_ENV_GOSU_VERSION=1.7\n\
  MYSQL_ENV_MYSQL_VERSION=5.7.13-1debian8\nMYSQL_ENV_no_proxy=*.local, 169.254/16\n\
  MYSQL_NAME=/ubuntu/mysql\nMYSQL_PORT_3306_TCP_PROTO=tcp\nMYSQL_PORT_3306_TCP_ADDR=172.17.0.2\n\
  MYSQL_ENV_MYSQL_MAJOR=5.7\nMYSQL_PORT=tcp://172.17.0.2:3306\nroot@60886fca65fb:#\n\
  ```\n\n\n\n每个变量都以大写别名作为前缀，该别名取自 `--link` 命令，在我们的例子中是 `MYSQL`。暴露的环境变量可以来自以下几个地方：\n\
  \n-   启动源容器时 `docker run` 命令上的 `--env`（简写为 `-e`）和 `--env-file` 选项。\n-   Dockerfile\
  \ 中的 `ENV` 命令——我们将在后续章节学习如何操作。\n-   源容器暴露的每个端口。Docker 会为源容器中每个开放端口生成三个环境变量：一个用于地址，一个用于端口号，一个用于协议。\n\
  -   与主机条目不同，如果源容器重启，作为环境变量存储的 IP 地址不会自动更新。\n\n![](img/0c87321919fa245e22f056c67ec70003_100_0.png)\n\
  \n你可以将多个容器链接到单个源。例如，你可以让多个 Web 容器连接到你的单个数据库容器。\n\n在用户定义的 `bridge` 网络中，不支持链接。它仅在默认创建的\
  \ bridge 网络上工作。如果需要在你创建的 `bridge` 网络上让容器通信，可以在该网络的容器上暴露并发布容器端口。这在你希望将 `bridge` 网络的一部分暴露给外部网络时很有用。\n\
  \nDocker 的链接功能是源容器向接收容器提供自身信息的好方法。事实上，这在 Docker 内部完成，不需要暴露任何网络端口。这就是链接的一大好处：我们不需要将源容器暴露给网络。\n\
  \n在 Docker 中，即使是复杂网络配置的可能性也很广。容器可以属于你需要的任意多个网络。它们可以同时属于本地 `bridge` 网络和 overlay 网络。如果这还不够，你可以使用外部插件提供其他网络选项。下面简要介绍一下。\n\
  \n## 网络插件\n\nDocker Engine 网络插件扩展了 Docker 以支持各种网络技术，例如 VXLAN、IPVLAN、MACVLAN 或完全不同的技术。网络驱动插件通过\
  \ LibNetwork 项目获得支持。一些现有的网络插件包括，例如 Weave Network Plugin——一个网络插件，可创建虚拟网络连接你的 Docker\
  \ 容器——跨多个主机或云，并实现应用程序的自动发现。Weave 网络具有弹性、分区容错、安全，并且可在部分连接的网络和其他恶劣环境中工作——全部以令人愉悦的简单性进行配置。\n\
  \nDocker 中的网络可能性几乎无穷无尽。很难想象一个在 Docker 中无法搭建的场景——无论使用 bridge 还是 overlay 网络。如果默认的驱动集不够——你总可以尝试在互联网上寻找特定驱动——或自行开发。现在让我们关注\
  \ Docker 容器可扩展性的另一个非常重要的方面——卷。\n\n## Docker 卷\n\n正如你在上一章记得的，Docker 文件系统默认是临时的。如果你启动一个\
  \ Docker 镜像（即运行容器），你会在层栈顶部得到一个读写层。你可以随意创建、修改和删除文件，但如果停止容器并再次启动，所有更改都会丢失：之前删除的任何文件现在都会回来，而你所做的任何新文件或编辑都不会存在。当然，你可以将更改提交回镜像以使其持久化。如果想在镜像中创建应用程序的完整设置，连同所有环境变量，这是一个很棒的功能。但在存储和检索数据方面，这并不方便。最好我们应该将容器生命周期与数据分离。理想情况下，你可能希望将它们分开，以便应用程序生成（或使用）的数据不会被销毁或绑定到容器生命周期，从而可以重复使用。完美的例子是\
  \ Web 服务器：Docker 镜像包含已配置并准备使用的 Web 服务器软件。但服务器将使用的数据（你的网页）应与镜像分离，这样你就可以随时更改，而无需修改镜像。反之亦然——你可以说，升级\
  \ Web 服务器软件到新版本或调整其配置，而无需修改它将提供的数据。这是通过卷完成的，我们将在本章的这一部分重点关注。卷不是联合文件系统的一部分，因此写操作是即时的并且尽可能快，因此无需提交任何更改。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_102_0.png)\n\n卷存在于联合文件系统之外，并在主机文件系统上作为普通目录和文件存在。\n\
  \n让我们开始创建卷。\n\n### 创建卷\n\n在 Docker 中，你基本上创建卷有三种选项：\n\n-   通过简单地将卷映射到主机目录创建无名卷（使用\
  \ `docker run` 命令的 `-v` 参数）\n-   创建仅用于数据的 Docker 容器镜像（然后对 `docker run` 命令使用 `--volumes-from`）\n\
  -   显式创建 Docker 命名卷（使用 `docker volume create` 命令）\n\n让我们逐一讨论它们，从 `docker run` 命令的\
  \ `-v` 选项开始。我们将通过运行最新的 Ubuntu 并为我们的数据创建卷来开始：\n\n```\ndocker run -it -v /Users/jarek/testDir/:/data\
  \ ubuntu\n```\n\n`-v` 选项中的参数是主机（你自己的操作系统）上的目录——在我示例中是 `/Users/jarek/testDir`——冒号，以及它对容器可用的路径：在我的例子中是\
  \ `/data`。正如你所见，这是一个无名的卷——只是映射。这样，在容器启动期间，Docker 创建了一个卷，这是一种映射的目录。它对容器可用，也可从主机操作系统访问。映射目录中已存在的任何文件（在我们的例子中为\
  \ `/Users/jarek/testDir`）将在容器内部可用——映射期间不会被删除。因为你没有为卷指定名称，Docker 会为你创建一个名称。它不会像我们之前看到的容器名称那样有趣，但足以唯一地识别卷。让我们使用\
  \ `volume ls` 命令检查卷是否在此：\n\n![](img/0c87321919fa245e22f056c67ec70003_103_0.png)\n\
  \n`volume ls` 命令可以接受一些过滤参数，这可能非常有用。例如，你可以列出未被任何容器使用的卷：\n\n```\ndocker volume ls\
  \ -f dangling=true\n```\n\n或者，列出使用特定驱动创建的卷（我们很快就会介绍驱动）：\n\n```\ndocker volume ls\
  \ -f driver=local\n```\n\n名称过滤器匹配卷名称的全部或部分，例如以下命令：\n\n```\ndocker volume ls -f name=da\n\
  ```\n\n这将给出名称中包含 da 的所有卷的列表：\n\n![](img/0c87321919fa245e22f056c67ec70003_103_1.png)\n\
  \n除了将卷映射到已知的主机目录外，你还可以创建一个不会显式映射到主机路径的卷——只需输入它对容器可用的路径，不带冒号。如果容器的基础镜像在指定的挂载点包含数据，该数据将在卷初始化时复制到新卷中。（当显式指定主机目录时不适用，https://docs.docker.com/engine/tutorials/dockervolumes/。）其背后的想法是你不应该关心卷在主机系统上的位置，这样可以使镜像在不同主机之间可移植。\n\
  \n以下命令作为示例：\n\n```\ndocker run -it -v /data2 ubuntu\n```\n\n这次，Docker 将创建一个卷并将其映射到主机机器上\
  \ Docker 设置的内部路径（在 Macintosh 上它将是 /var/lib/docker/volumes）。\n\n如果你想知道那个主机路径是什么，可以使用\
  \ volume inspect 命令检查卷。首先，你需要找出与容器关联的是哪个卷。你可以通过在容器上执行 docker inspect 命令来做到这一点。卷\
  \ ID 将列在 inspect 命令输出中。\n\n有了卷名称，你只需运行 docker volume inspect <volumeName>，在我这里将是以下内容：\n\
  \n```\ndocker volume inspect\n3840cf476f0db530a9e62d5251975156eb5418bd9ba75e7435eb427ece46fc22\n\
  ```\n\n![](img/0c87321919fa245e22f056c67ec70003_104_0.png)\n\n\n\nThe output of\
  \ the command briefly shows the details of the volume – its name, the driver being\
  \ used (we will get to it shortly), a mount point in the host system, assigned labels,\
  \ and a scope. As you can see, in my case, Docker assigned a mount point for this\
  \ volume somewhere in /var/lib/docker/volumes. You are not limited to just one volume\
  \ per container. That would be a serious limitation.\n\n![](img/0c87321919fa245e22f056c67ec70003_105_0.png)\n\
  \nYou can use the -v multiple times to mount multiple data volumes.\n\nThe -v option\
  \ can be used not only for directories, but for single files as well. This can be\
  \ very useful if you want to have configuration files available in your container.\
  \ The best example for it is the example from the official Docker documentation:\n\
  \n```\ndocker run -it -v ~/.bash_history:/root/.bash_history ubuntu\n```\n\nExecuting\
  \ the preceding command will make you have the same bash history between your local\
  \ machine and a started Ubuntu container. And best of all, if you exit the container,\
  \ the bash history on your own local machine will contain the bash commands you\
  \ have been executing inside the container.\n\nMapping a single file from a host\
  \ allows exposing a configuration for your containers.\n\nThe trick for sharing\
  \ the data between containers is to use the --volumes-from option when executing\
  \ the docker run command. This way if one of your containers has volumes mounted\
  \ already, you can instruct Docker to use the same volumes when starting another\
  \ container. Consider the following example:\n\n```\ndocker run -it --name myUbuntu\
  \ -v /data ubuntu\n```\n\nThis will start Ubuntu with volume mounted as /data. Start\
  \ another container using the following command:\n\n```\ndocker run -it --name myBusyBox\
  \ --volumes-from myUbuntu busybox\n```\n\nHere, your Ubuntu and busybox containers\
  \ will share the same volume and thus, the same data. You can use multiple --volumes-from\
  \ options to combine data volumes from several containers. Also, chaining is possible\
  \ – you can mount chained --volumes-from in a group of containers.\n\nThe common\
  \ practice when working with Docker is to create data-only containers. The only\
  \ purpose of data-only containers is to carry on the volume. For any other containers\
  \ that you then want to connect to this data volume container, use the Docker's\
  \ --volumes-from option to grab the volume from this container and apply them to\
  \ the current container. Let's consider the following example:\n\n```\n$ docker\
  \ create -v ~/docker-nginx/html:/usr/share/nginx/html --name myWebSiteData nginx\n\
  ```\n\nBy executing the preceding command, we are creating a container with the\
  \ name myWebSiteData. Its only purpose will be to have a /usr/share/nginx/html volume\
  \ attached and mapped to ~/docker-nginx/html in your home directory. You may ask\
  \ what image should you pick as a base for the data-only container. Well, it doesn't\
  \ matter that much – we are not going to run this container anyway, so it will not\
  \ be wasting resources such as CPU or RAM. You may use the same image for the data\
  \ container as for the container with the application you are going to run. You\
  \ don't leave data containers running, so it won't consume resources. Using the\
  \ same image can be important for several reasons:\n\n- It will take up less space\
  \ as you already have the image layer cached (as you remember from Chapter 3, Understanding\
  \ Images and Containers, Docker caches and shares the same layers between images)\n\
  - The image could be used to fill the volume with some initial data, such as default\
  \ configuration files, for example\n- The permissions and ownership will be correct\n\
  \nWith our data-only container ready, we can use it to provide a volume for another\
  \ container (with our application, for example), using the --volumes-from option\
  \ for the docker run command, just like we did previously, when dealing with nameless\
  \ volumes.\n\nLet's say we want to run nginx with the volume referenced in our data-only\
  \ myWebsiteData container:\n\n```\n$ docker run --name docker-nginx -p 80:80 -d\
  \ --volumes-from myWebSiteData nginx\n```\n\nOf course, the data-only container\
  \ can be shared among other containers – in our case, you can run as many nginx\
  \ containers as you like – as long as you enter the same --volumes-from option,\
  \ they will share the same data.\n\nApart from creating a volume when starting a\
  \ container or using data-only containers, there is a command that allows creating\
  \ the volume before starting any containers. It's the last option on our list: the\
  \ possibility to create Docker volumes explicitly, using the docker volume create\
  \ command.\n\nWe will use it now, and this time, we will also provide a more friendly\
  \ name for our volume. To create a volume, execute the volume create command:\n\n\
  ```\ndocker volume create --name data\n```\n\nAgain, the new data volume will be\
  \ available when you list volumes using the volume ls command. To mount a volume\
  \ in a container during its startup, use the same -v option when starting a container:\n\
  \n```\ndocker run -it -v data:/data ubuntu\n```\n\nThe data volume will then be\
  \ available for your container in /data. It's also possible to run another container\
  \ with the same volume mounted.\n\n![](img/0c87321919fa245e22f056c67ec70003_107_0.png)\n\
  \nVolumes can be shared between containers – just run them with mapping the same\
  \ volume.\n\nWhen it comes to creating your own images using Dockerfile, the VOLUME\
  \ instruction comes in handy. Actually, we will be using it later in the book, when\
  \ creating images from a Dockerfile.\n\nIt creates a mount point with the specified\
  \ name and marks it as holding externally mounted volumes from native host or other\
  \ containers. Creating volumes using the VOLUME instruction has one important difference\
  \ to using the -v option during the container startup: you cannot specify a host\
  \ directory when using the VOLUME instruction. Dockerfiles are meant to be portable\
  \ and shared. The host directory volume is 100% host dependent and will break on\
  \ any other machine, which is a little bit off the Docker idea. Because of this,\
  \ it is only possible to use portable instructions within a Dockerfile. A benefit\
  \ of using shared volumes is that they are host-independent. This means that a volume\
  \ can be made available on any host that a container is started on as long as it\
  \ has access to the shared storage and has the plugin (driver) installed.\n\n![](img/0c87321919fa245e22f056c67ec70003_107_1.png)\n\
  \nIf you need to specify a host directory when creating a volume, you need to specify\
  \ it at runtime.\n\n## Removing a volume\n\nThe same as with creating volumes, there\
  \ are two ways of removing a volume from Docker. One way is to remove a volume by\
  \ referencing a container's name and executing the rm -v command:\n\n```\ndocker\
  \ rm -v <containerName>\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_108_0.png)\n\
  \nDocker will not warn you when removing a container without providing the -v option\
  \ to delete its volumes. As a result, you will have dangling volumes – volumes that\
  \ are no longer referenced by a container.\n\nYou can also remove the volume using\
  \ the volume rm command:\n\n```\ndocker volume rm <volumeName>\n```\n\nIf the volume\
  \ happens to be used by the container, Docker Engine will not allow deleting it\
  \ and will give you a warning message:\n\n![](img/0c87321919fa245e22f056c67ec70003_108_1.png)\n\
  \nThe handy shortcut to remove all volumes not being referenced by any container\
  \ is using a `dangling=true` filter from the `volume ls` command:\n\n```\ndocker\
  \ volume rm $(docker volume ls -qf dangling=true)\n```\n\nAs you can see, creating,\
  \ sharing, and removing volumes in Docker is not that tricky. It's very flexible\
  \ and allows creating a setup you will need for your applications. But there's more\
  \ to this flexibility. When creating a volume, you can specify a `--driver` option\
  \ (or `-d` for short), which may be useful if you need to map some external, not-so-standard\
  \ storage. The volumes we have created so far were using the `local` filesystem\
  \ driver (the files were being stored on the local drive of the host system) – you\
  \ can see the driver name when inspecting a volume using the `volume inspect` command.\
  \ There are other options though, let's look at them now.\n\n## Volume drivers\n\
  \nThe same as with network driver plugins, the volume plugins extend the capabilities\
  \ of the Docker Engine and enable integration with other types of storage. There\
  \ are tons of ready-to-use plugins available for free on the Internet; you can find\
  \ a list on Docker's GitHub page. Some of them include the following:\n\n- **Docker\
  \ Volume Driver for Azure File Storage**: This is a Docker Volume Driver that uses\
  \ Azure File Storage to mount file shares on the cloud to Docker containers as volumes.\
  \ It uses network file sharing by utilizing the SMB (Server Message Block) and CIFS\
  \ (Common Internet File System) protocols capabilities of Azure File Storage. You\
  \ can create Docker containers that can migrate from one host to another seamlessly\
  \ or share volumes among multiple containers running on different hosts.\n- **IPFS**:\
  \ The abbreviation stands for **InterPlanetary File System**. It's an open source\
  \ volume plugin that allows using an IPFS filesystem as a volume. IPFS is a very\
  \ interesting and promising storage system – it makes it possible to distribute\
  \ high volumes of data with high efficiency. It provides deduplication, high performance,\
  \ and clustered persistence, provides secure P2P content delivery, fast performance,\
  \ and decentralized archiving. IPFS provides resilient access to data, independent\
  \ of low latency or connectivity to the backbone.\n\n\n\n-   **Keywhiz:** 该驱动程序可用于使容器与远程\
  \ Keywhiz 服务器通信。Keywhiz 是一种用于管理和分发机密数据的系统，例如 TLS 证书/密钥、GPG 密钥、API 令牌和数据库凭据。不是将此数据放在配置文件中或复制文件（这可能会泄露或难以追踪），Keywhiz\
  \ 使其管理更轻松、更安全：集群中的 Keywhiz 服务器将机密集中存储在加密的数据库中。客户端使用相互认证的 TLS（mTLS）检索其有权访问的机密。\n\n\
  正如前面的示例所示，它们相当有趣，有时甚至很奇特。由于 Docker 及其插件架构的可扩展性，您可以创建非常灵活的设置。但第三方驱动程序并不总是引入完全新的存储类型，有时它们只是扩展现有驱动程序。一个例子是\
  \ `Local Persist Plugin`，这是一个卷插件，它通过允许您在主机上任意位置指定挂载点来扩展默认本地驱动程序的功能，从而使文件始终保持持久，即使通过\
  \ Docker 的 `volume rm` 命令删除卷也是如此。\n\n如果您需要尚未可用的卷插件，您可以自行编写——该流程在 Docker 的 GitHub\
  \ 页面上记录得非常详细，并附带可扩展的示例。\n\n## Summary\n\n我们现在已经介绍了如何将容器开放给外部世界——我们可以使用网络和挂载的卷在容器之间以及容器与其他主机之间共享数据。让我们总结一下本章迄今为止学到的内容。我们知道，来自同一\
  \ Docker 主机的容器在默认的 `bridge` 网络上会自动相互看到，前提是容器绑定到默认桥接。我们可以使在不同主机上运行的容器相互通信。为此，我们需要多主机\
  \ `overlay` 网络。您需要运行在 swarm 模式下的 Docker 1.12 或更高版本，或者 alternatively 运行一个键值存储。如果\
  \ Docker 提供的驱动程序不足，我们可以使用网络插件进一步扩展网络数据交换。我们已经介绍了卷创建过程，并且知道卷即使在容器重启后也能持久保存数据；我们还知道对卷上文件的更改是直接进行的，但在更新镜像时不会包含这些更改。\n\
  \n卷允许在主机文件系统与 Docker 容器之间，或在 Docker 容器之间共享数据，并且即使容器本身被删除，它们也会持久存在。我们可以使用卷驱动程序进一步扩展文件交换的可能性。\n\
  \n在下一章中，我们将重点关注 Docker Hub。我们将学习如何查找镜像，这些镜像将成为下一章的基础，在下一章中我们将使用 Dockerfile 实际创建镜像。\n\
  \n# 5\n\n## 5 Finding Images\n\n在之前的章节中，我们学习了如何安装 Docker，并熟悉了 Docker 架构、网络和持久存储功能。我们在\
  \ `Chapter 3`、*Understanding Images and Containers* 中稍微提到了使用 Docker Hub 和远程仓库的工作，但这次我们将深入详细了解。\n\
  \n本章将涵盖以下主题：\n-   The Docker Hub\n-   Image tags\n-   Searching for images using\
  \ the web interface and a command line\n-   Docker Hub REST API\n\n在下一章实际构建自己的镜像之前，我们将首先专注于使用\
  \ Docker Hub——创建账户、身份验证、查找镜像并拉取它们。我们将更详细地介绍版本和标签，解释最容易被误解的 Docker 标签之一 `latest`。本章还将介绍\
  \ Docker Hub 的 REST API，如果您计划以编程方式使用 Docker Hub——来自您自己的应用程序或集成流程，这可能会派上用场。\n\n这次我们还将在\
  \ Docker Hub 上创建账户——当我们将镜像发布到世界时，这是强制性的。\n\n## The Docker Hub\n\nDocker 镜像仓库的主要功能是根据描述查找特定镜像。仓库在仓库中处理\
  \ Docker 镜像。了解 registry 和 repository 之间的区别很重要。Docker registry 是一个存储 Docker 镜像的服务，而\
  \ repository 是具有相同名称的不同 docker 镜像的集合，它们具有不同的标签（我们稍后会回到标签）。与 git 相当，Docker 仓库由 URI\
  \ 标识，可以是公共的也可以是私有的。\n\n最知名的托管 Docker registry 版本是 Docker Hub。它提供了一个美观且易用的 UI。Docker\
  \ Hub 是一个用于共享和管理 Docker 镜像的软件即服务（SaaS）平台。换句话说，它是一种能够托管和分发镜像的基于云的 registry 服务。镜像保存在公共或私有仓库中。目前，Hub\
  \ 提供数十万个公共仓库，并且数量每天都在增长。其中近三分之一的公共仓库使用自动构建，这意味着镜像是由 Hub 本身使用已发布的 Dockerfile 构建的。其余仓库包含通过\
  \ `docker push` 命令手动上传的镜像。Docker Hub 可在 https://hub.docker.com/ 获取。\n\n![](img/0c87321919fa245e22f056c67ec70003_113_0.png)\n\
  \nDocker Hub 是默认的 registry。如果您在使用 `login`、`pull` 或 `push` 等 registry 相关命令时未提供 registry\
  \ 主机名，Docker 将使用 Docker Hub。\n\nRegistry 提供诸如推送（将镜像上传到仓库）和拉取（从仓库下载镜像）等操作。Docker\
  \ registry 还有另一个重要角色，即索引。索引维护有关用户账户、镜像校验和以及公共命名空间的信息。事实上，Docker Hub 是公共仓库的集中式索引。\n\
  \nDocker Hub 是一个公共服务，如果您注册账户，您可以免费获得一个私有仓库。如果您需要更多私有仓库，您可以升级 Docker Hub 计划，这将不是免费的。\n\
  \nDocker Hub 不仅仅是一个 registry 和索引——一个搜索、存储或获取镜像的地方——它更像是一个伞形项目；它允许链接到代码仓库（如 GitHub\
  \ 或 BitBucket），创建镜像的自动构建并对其进行测试。Docker Hub 还允许链接到 Docker Cloud，以便您可以将镜像部署到自己的主机上。所有这些方面在开发管道中创建镜像工作流自动化时都很有用。我们将在\
  \ `Chapter 8, Publishing Images` 中详细介绍这些与开发相关的功能，例如发布和创建自动构建。\n\n除了管理单个用户账户和身份验证之外，Docker\
  \ Hub 还管理组织。通过创建组织，您可以轻松地让同事访问共享镜像仓库，并让 Docker Hub 管理团队协作和变更管理。\n\n让我们总结 Docker\
  \ Hub 的功能：\n-   **Accounts**: 这有助于用户管理和身份验证。\n-   **Organizations**: 这用于创建工作组以管理对镜像仓库的访问。\n\
  -   **Image repositories**: 这用于从社区、官方或私有镜像仓库中搜索、`pull`、`push` 和 `manage` 镜像。\n-\
  \   **Automated builds and web hooks**: 这用于在源代码发生变化时自动触发镜像构建过程。Web Hook 是自动构建的一部分，允许您在将镜像推送到仓库后执行不同的操作。\n\
  -   **Integration source code repositories**: 这用于将您的 GitHub 和/或 Bitbucket 源代码仓库链接起来以创建开发工作流。\n\
  -   **REST API**: 通过 Docker Hub Web 界面提供的几乎所有功能也都作为一个记录良好的 REST 端点提供，您可以使用它以编程方式处理\
  \ Docker Hub。\n\nDocker Hub 账户（称为 Docker ID）对于搜索和拉取镜像不是强制性的。事实上，正如您所记得的，我们在之前的章节中拉取了大量\
  \ `hello-world`、`nginx` 和 `ubuntu` 镜像来演示 Docker 的架构，而没有注册适当的 Docker ID。\n\n![](img/0c87321919fa245e22f056c67ec70003_114_0.png)\n\
  \nDocker Hub 账户对于从 Docker Hub 搜索和拉取镜像不是强制性的——您可以在不登录甚至没有账户的情况下下载镜像。\n\n然而，为了发布镜像、发布评论或为仓库加星，您需要一个\
  \ Docker ID。通过留下评论，您可以与其他 Docker 社区成员以及特定镜像的维护者互动。\n\n![](img/0c87321919fa245e22f056c67ec70003_114_1.png)\n\
  \n像任何成熟的社区一样，您的评论应精确且有意义。如果您发现任何不合适的评论，您可以将其标记以供审查。\n\n\n\n为仓库加星与 GitHub 上的星标作用相同——它是一种表示你喜欢某个仓库的方式。星标功能也提供了一种便捷的方式来收藏你喜欢的仓库。在本书撰写时，ubuntu\
  \ 仓库是最受关注的仓库。让我们从账号创建开始。\n\n## Docker Hub account\n\n为了获取你的 Docker ID，请前往 http://hub.docker.com\
  \ 并滚动到 Sign Up 部分。你需要提供用户名（它将成为你发布镜像的命名空间）、密码和有效的电子邮件地址，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_115_0.png)\n\
  \n注册需要有效的电子邮件地址，因为激活邮件将发送到该地址。\n\n![](img/0c87321919fa245e22f056c67ec70003_116_0.png)\n\
  \n如果找不到验证邮件，请检查垃圾邮件文件夹并将 docker.com 从不良发件人中排除。如果仍然找不到，请前往 https://hub.docker.com/login/\
  \ 并执行与密码重置相同的操作，激活链接将被重新发送。\n\n从那里，你可以使用你的 Docker ID 登录。当你首次登录新账号时，你将进入 Docker Dashboard，这是一个带标签页界面的页面，如下图所示：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_116_1.png)\n\n第一个标签页包含你的仓库列表；对于新账号它将为空，并提供创建仓库、组织或浏览仓库的快捷方式。注意，你也可以使用网站页眉中的搜索字段搜索镜像，它随时可用。第二个标签页用作你的书签查看器——它列出你已加星的仓库。\n\
  \nDashboard 还提供了一个链接到账号设置页面，在那里你可以设置默认的仓库可见性（默认为 `public`，你可以将其更改为 `private`）。在此处，你还可以设置个人详细信息，如姓名、位置、网页地址，或添加与你的\
  \ Docker ID 关联的额外电子邮件地址（只有一个可以为主）。这些电子邮件地址将用于 Docker 的所有公告和通信。**Settings** 页面还允许将你的个人（User）账号转换为\
  \ Organization 账号。让我们澄清一下 Organization 账号是什么。\n\n## Organization account and teams\n\
  \n组织和群组允许你在组织或团队之间协作。你可以在账号的 `Settings` 标签页中添加新组织并查看你所属的组织。你也可以在仓库页面和账号资料中用户名下方看到它们。\n\
  \n如果将你的 Dashboard 切换到你所属的组织，它与个人用户仪表板会略有不同，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_117_0.png)\n\
  \n主要区别在于 Teams 标签页的存在，你可以在其中定义组织内的团队。Docker Hub 会自动创建 Owners 团队。Owners 团队比较特殊——你需要是组织\
  \ Owners 团队的成员才能创建新仓库、新自动化构建以及该组织内的新团队。如果你属于 Owner 团队，你可以在仓库视图的 Collaborators 部分分配访问权限。这可以是读权限（允许你以与公共仓库相同的方式查看、搜索和拉取私有仓库）、写权限（允许你推送镜像）或管理员权限（允许你修改仓库属性，如描述、协作者权限、公开或私有可见性，或删除仓库）。你可以通过选择团队并输入用户名（针对现有\
  \ Docker Hub 用户）或电子邮件地址（如果尚未注册）来向组织的任何团队添加或邀请用户：\n\n![](img/0c87321919fa245e22f056c67ec70003_118_0.png)\n\
  \n因此，被邀请的用户将收到一封加入团队的邀请邮件。\n\n## Collaborators\n\nDocker Hub 引入了协作者的概念。协作者只是另一个\
  \ Docker Hub 用户，你可以授予其访问你的仓库（公开或私有）的权限。你可以在仓库的 Settings 页面中的 Collaborators 标签页中进行操作，如下图所示：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_118_1.png)\n\n协作者不允许执行任何管理任务，例如删除仓库或将其状态从私有更改为公开。然而，他们可以通过执行\
  \ `docker push` 和 `docker pull` 命令来使用你的仓库。如果你需要对仓库进行更具体、更详细的访问权限设置，请考虑使用 Docker\
  \ Hub 提供的组织和团队。\n\n![](img/0c87321919fa245e22f056c67ec70003_119_0.png)\n\n值得注意的是，协作者不能添加其他协作者。只有你作为仓库的所有者才拥有管理权限。\n\
  \n## Private Repositories\n\n如果你想存储希望保持私有的镜像，你需要将它们存储在私有仓库中。它仅对你的账号或组织/群组可见。一旦仓库被标记为私有，你就可以使用\
  \ Docker 向其推送和拉取镜像，与公共仓库的操作相同。唯一的区别是你需要登录并拥有访问权限才能操作私有仓库。私有仓库的行为与公共仓库一样；不过，它们不会列在公共注册表中。\n\
  \n在仓库的 `Settings` 页面中，你可以切换其可见性，使其为 `public` 或 `private`，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_119_1.png)\n\
  \n如果你将仓库设为私有，它将对组织的成员可用，你也可以将访问权限授予你选择的协作者。正如你所记得的，免费的 Docker Hub 账号只允许你拥有一个私有仓库，如果你想要更多，就需要升级你的计划。\n\
  \n## Logging into Docker Hub\n\n你当然可以使用 Docker Hub 页面登录账号，但更常见的做法是通过 shell 或命令行登录。让我们使用我们的账号登录\
  \ Docker Hub 注册表：\n\n```\ndocker login --username myUser --password 123\n```\n\n\
  默认情况下，Docker 假定你要登录的注册表是 Docker Hub。要登录不同的注册表，请将注册表的 hostname 作为登录命令的最后一个参数提供：\n\
  \n```\ndocker login --username myUser --password 123 localhost:8080\n```\n\n这次让我们在\
  \ Mac 上登录 Docker Hub：\n\n![](img/0c87321919fa245e22f056c67ec70003_120_0.png)\n\n\
  如果身份验证正确，Docker 会简短地响应，表示我们已准备好从注册表拉取镜像：\n\n```\nLogin Succeeded\n```\n\n登录后，幕后会发生一件有趣的事情。由于在使用\
  \ Docker 时，与注册表通信以拉取、推送和查找镜像是非常常见的操作，你的凭据将被存储以供将来使用。这样你就可以自动化操作。Docker 将从本地存储中获取凭据，并在你请求拉取或推送镜像等操作时代表你使用它们。默认情况下，Docker\
  \ 将使用一个名为 .docker/config.json 的纯文本文件，该文件写入你的主目录（或 MS Windows 上的配置文件夹）：\n\n![](img/0c87321919fa245e22f056c67ec70003_121_0.png)\n\
  \n该文件的结构支持同时使用多个注册表。在我们的例子中，我们只有一个条目对应默认的官方 Docker 索引（index.docker.io），但如果需要也可以有更多。从现在开始，当注册表需要身份验证时（例如执行\
  \ push 命令时），Docker 将从 config.json 文件中获取你的凭据。当然，你将要工作的注册表必须与配置文件条目中的索引 URL 匹配。请注意，文件中没有日期或时间——凭据将被永久缓存，直到我们使用\
  \ logout 命令告诉 Docker 删除它们为止。\n\n![](img/0c87321919fa245e22f056c67ec70003_121_1.png)\n\
  \n存储在本地文件中的凭据未加密——它只是使用 Base64 编码的 username:password 字符串。请勿与任何人共享此文件。\n\n如果你不再希望在本地存储中缓存凭据，请执行\
  \ logout 命令：\n\n```\ndocker logout\n```\n\n\n\nDocker 会回复，表示 config.json 文件中的条目已被移除，因此你已从注册表中注销：\n\
  \n```\nRemove login credentials for https://index.docker.io/v1/\n```\n\n本地凭据文件在你正在试验\
  \ Docker Hub 且安全性并非你特别关心的事情时可能会有用。在其他情况下，例如使用私有注册表或进行一些严肃的工作，将凭据存储在其他存储中可能是一种更合适、更安全的做法。使用外部存储比将凭据存储在\
  \ Docker 配置文件中更安全。幸运的是，Docker Engine 可以使用外部凭据存储，例如操作系统的原生钥匙串。例如，Apple OS X 钥匙串或\
  \ Microsoft Windows 凭据管理器。\n\n![](img/0c87321919fa245e22f056c67ec70003_122_0.png)\n\
  \n使用外部存储需要系统 $PATH 上可用的额外助手。助手程序与特定的钥匙串或外部存储交互。你可以从 GitHub https://github.com/docker/docker-credential-helpers/releases\
  \ 下载助手。目前可用的凭据助手列表包括：D-Bus Secret Service、Apple OS X 钥匙串和 Microsoft Windows 凭据管理器。\n\
  \n如果你想为凭据使用外部存储，你需要在系统 $PATH 上提供助手，并通过修改 .docker/config.json 指示 Docker 使用此外部存储：\n\
  \n```\n{\n  \"credsStore\": \"osxkeychain\"\n}\n```\n\n如果你将来需要将凭据存储在 Docker 未官方支持的存储中，互联网上有一些第三方存储助手可供使用。例如，在\
  \ GitHub 上有 Amazon ECR Credentials helper 可用（https://github.com/aws-labs/amazon-ecr-credential-helper）。它使用与\
  \ AWS 命令行工具和 AWS SDK 相同的凭据。如果找不到所需的凭据助手，Docker 允许使用你自己开发的凭据助手。基本上，助手可以是任何可以从标准输入读取值的程序。它仅公开三个操作：store（用于保存凭据，其中输入是包含服务器\
  \ URL、名称和密码的 JSON）、get 和 erase，分别用于获取和从存储中删除凭据。Get 和 erase 仅将服务器 URL 作为输入参数。\n\n\
  实现自己的凭据存储最简单的方法是浏览 GitHub https://github.com/docker/docker-credential-helpers 上的现有助手的源代码。\n\
  \n现在我们了解了登录注册表时会发生什么，是时候利用它并搜索镜像了。\n\n## Searching for images\n\n要有效地搜索特定镜像，首先我们需要了解\
  \ Docker 镜像命名模式和标签的概念。我们之前已经提到过它；让我们现在详细了解一下。\n\n## Image naming and tags\n\n完整的镜像名称具有以下语法：\n\
  \n```\n{registry_host}/(_|/{user_or_org_namespace})/{repository}:{tag}\n```\n\n\
  让我们详细探索一下。镜像名称以命名空间和斜杠开头。例如，由用户 `tutum` 创建并上传的名为 `hello-world` 的镜像（顺便说一下，这是一个在端口\
  \ `80` 上响应 `hello-world` 消息的 Apache 镜像）将以此部分开头：`tutum/hello-world`。\n\n也可以没有命名空间前缀的镜像——这些将是所谓的\
  \ **官方仓库** 的镜像。官方仓库是来自 Docker 供应商和贡献者（如 Red Hat、Oracle 和 Canonical）的认证仓库。当然，你也可以使用它们来构建自己的应用程序和服务。官方镜像的示例可以是最受欢迎的\
  \ `ubuntu`、`nginx`，或我们之前章节中使用的 `hello-world` 的官方版本。官方镜像通常由将应用程序容器化到 Docker 中的人员支持，例如，来自官方仓库的\
  \ `nginx` 镜像由 Nginx 团队支持。\n\n![](img/0c87321919fa245e22f056c67ec70003_123_0.png)\n\
  \n如果你决定使用官方仓库中的镜像作为自己工作的基础，你可以相当确定自己使用的是维护良好、优化且最新的镜像。\n\n每个仓库可以包含多个镜像。例如，`nginx`\
  \ 仓库将包含不同版本的 Web 服务器镜像，例如 `1.10.1-alpine`、`stable`、`latest` 等。每个镜像都由标签标识。正如我们之前提到的，标签通常代表同一应用程序或服务的不同版本，并用于区分镜像。标签只是附加到镜像的字母数字标识符，例如可以是\
  \ `1.0` 或 `latest`，但提供构建哈希以明确无误地标识镜像被认为是一种良好做法。标签名称可能不会以句点或破折号开头，并且最多可包含 128 个字符。我们稍后将介绍的\
  \ Docker 自动化构建允许你将镜像标签链接到 git 历史记录中的分支或标签。\n\n`latest` 标签有点特殊。此外，它可能不会按你期望的方式工作。好吧，简单来说，除非镜像创建者（例如\
  \ `ubuntu` 或 `nginx`）有特定的 `build`、`tag` 和 `push` 模式，否则它没有任何特别的含义。分配给镜像的 `latest`\
  \ 标签仅仅意味着它是最后构建并在未提供特定标签的情况下执行的镜像。可以理解这可能会令人困惑——拉取标记为 `latest` 的镜像不会获取软件的最新版本。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_124_0.png)\n\nDocker 不会在拉取标记为 `latest`\
  \ 的镜像时检查你是否获得软件的最新版本。\n\n如果你在不指定标签的情况下拉取镜像，Docker 将下载标记为 `latest` 的镜像。但这不一定是你想要运行的软件的最新最佳版本。相反，你应该始终查看仓库中存在的其他标签，以选择所需的软件版本。\n\
  \n此外，如果我们在本书后面构建自己的镜像，相同的 `latest` 标签行为也适用。如果你未在仓库名称后指定标签，它将在仓库中自动分配 `latest` 标签。\n\
  \n最后但同样重要的是，镜像名称可以加上 Docker 注册表的 hostname 或 IP 前缀。例如，镜像名称 `localhost:5000/hello-world`\
  \ 将引用你本地注册表中的 `hello-world` 仓库。但如果需要从 Docker Hub 以外的注册表拉取官方镜像呢？遵循镜像名称模式，只需使用单个下划线字符代替用户或组织名称即可。例如，考虑以下命令：\n\
  \n```\ndocker pull someRegistry.com/_/someOfficialImage:1.0\n```\n\n这将从位于 someRegistry.com\
  \ 上的 someOfficialImage 官方仓库中拉取标记为 1.0 的镜像。你也可以通过完全省略用户或组织名称来缩短命令。我们的命令将如下所示：\n\n\
  ```\ndocker pull someRegistry.com/someOfficialImage:1.0\n```\n\n正如你记得的，如果你不提供注册表\
  \ hostname，Docker 将默认为其自己的官方注册表 Docker Hub。\n\n现在我们应该完全了解镜像名称的构成。定位要拉取的镜像应该更容易了。你可以通过两种方式找到\
  \ Docker Hub 上的公共仓库和镜像。你可以使用 Docker Hub 网站或使用 Docker 命令行工具运行 docker search 命令。让我们现在搜索一个镜像。\n\
  \n## Searching through the web interface\n\n使用 Docker Hub 的 Web 界面查找镜像与使用右上角的搜索字段一样简单：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_125_0.png)\n\n作为响应，Docker Hub 将列出名称或作者与你的搜索词匹配的镜像。请注意，结果列表中只会显示公共仓库。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_125_1.png)\n\n私有仓库不会出现在仓库搜索结果中。\n\n在搜索结果中，你可以注意到星级和下载次数。这可以让你了解仓库的受欢迎程度。此外，你可以看到仓库是官方还是公开，以及是否使用自动化构建构建：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_125_2.png)\n\n\n\n使用网页界面搜索在您想要获取有关仓库的更详细信息时可能会很有用。如果您点击\
  \ `repository` 名称，您将被带到仓库详情页面，其中通常包含大量有用信息。详情页面的第二个标签页包含标签列表，因此您可以快速浏览并选择所需的版本。此视图还会显示关联镜像的大小。镜像大小是镜像及其所有父镜像占用的累计空间——这也是执行\
  \ `docker save` 命令导出镜像时形成的 tar 文件内容所使用的磁盘空间。如果搜索结果页面上列出的镜像是自动构建的，Docker Hub 将提供两个额外的标签页：**Dockerfile**\
  \ 和 **Build Details**。**Dockerfile** 标签页将包含构建期间使用的 Dockerfile（在学习如何创建自己的 Dockerfile\
  \ 时非常有用）以及一个链接的源代码仓库（正如您所记得的，这可能是 GitHub 或 BitBucket）：\n\n![](img/0c87321919fa245e22f056c67ec70003_126_0.png)\n\
  \n**Build Details** 列出了自动构建作业的状态（如成功或失败）以及构建日期等信息：\n\n![](img/0c87321919fa245e22f056c67ec70003_127_0.png)\n\
  \n如您所见，Docker Hub 的网页界面可以为您提供有关所需镜像的许多详细信息，但并不太方便。更快的解决方案是使用命令行搜索镜像。\n\n## 使用命令行搜索\n\
  \nDocker 为您提供了一个用于搜索镜像的命令：`docker search`。\n\n例如，如果您正在寻找 `ubuntu` 镜像，您可能会运行以下命令行搜索：`docker\
  \ search Ubuntu`。\n\n`search` 命令的语法相当简单，您可以通过执行 `docker help search` 命令查看。默认情况下，它只接受一个参数——要查找的内容。搜索可以通过镜像名称、用户名或描述找到镜像。这将显示\
  \ Docker Hub 上当前可用的与所提供关键字匹配的仓库列表。以下是搜索 Ubuntu 镜像的示例输出：\n\n### 查找镜像\n\n![](img/0c87321919fa245e22f056c67ec70003_128_0.png)\n\
  \n一目了然的信息很多。请注意，命令输出列出了镜像名称、简短描述、星级数量、是否为官方仓库的标记以及最近一次自动构建的状态。\n\n如果仓库是私有的，除非您是镜像创建者、组织的成员或协作者，否则它不会列在仓库搜索结果中。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_128_1.png)\n\n私有仓库不会出现在仓库搜索结果中。要查看您可以访问的所有仓库及其状态，请在\
  \ Docker Hub 上查看 Dashboard。\n\n原因在于 Docker 首先会询问索引您是否有足够的权限列出和拉取镜像（如果您是创建者、组织的成员或协作者）。实际上，后台正在进行许多操作：\n\
  - 您向索引发出列出或下载镜像的请求。\n- 作为响应，索引返回信息：\n  - 镜像所在的注册表\n  - 镜像的校验和，包括其所有层\n  - 用于授权目的的令牌（*对于公共仓库不是必需的*）：\n\
  \    - 您使用索引响应中返回的令牌联系注册表。\n    - 作为回报，注册表会询问索引该令牌是否已授权且有效。\n    - 最后，索引现在向注册表发送\
  \ true/false 消息，允许或禁止您列出或拉取所需的镜像。\n\n使用 shell（或命令行）命令查找镜像是最快的方式。一旦找到您想要的镜像——接下来就是您已经知道的部分——只需使用\
  \ docker pull 命令下载镜像即可。但您处理镜像的方式并不仅限于 docker search/pull 命令和 Docker Hub 网页界面。Docker\
  \ 提供了一套全面的远程 API，其中之一就是 Docker Hub 和 Docker Registry REST API。\n\n## Docker Hub\
  \ 和 Docker Registry REST API\n\n让我们讨论 Docker Registry API 和 Docker Hub API，并列出与搜索和下载镜像相关的\
  \ API 端点。我们将使用命令行工具 curl，但您可以使用任何您选择的 REST 客户端，甚至是您的网页浏览器。\n\n首先，让我们通过执行 HTTP GET\
  \ 调用 /_ping 端点来检查远程注册表的状态：\n\n```bash\ncurl -k https://registry.hub.docker.com/v1/_ping\n\
  ```\n\n注册表将回复一个简单的 true 值，表示它正在运行。\n\n首先，我们需要登录或验证是否已登录。授权通过 SSL 上的 Basic Auth 进行。为了处理用户账户，API\
  \ 公开了 /users 端点。现在，对以下 URL 发出 GET 请求：\n\n```\nhttps://registry.hub.docker.com/v1/users\n\
  ```\n\n如果您已登录，这将回复 OK 响应；如果未登录，则返回 HTTP 401 Unauthorized 状态：\n\n![](img/0c87321919fa245e22f056c67ec70003_130_0.png)\n\
  \nDocker Hub API 不仅是只读的，它还接受 POST 请求。例如，您可以通过向 /users 端点发出 POST 请求来注册新账户。POST 请求负载需要包含注册数据，例如电子邮件、用户名和密码，例如：\n\
  \n```\n{\n  \"email\": \"someUser@someHost.com\",\n  \"username\": \"myNewAccount\"\
  ,\n  \"password\": \"mySecret\"\n}\n```\n\n要执行此类 API 调用，您可以使用 curl 命令或任何其他用于执行 HTTP\
  \ 请求的工具或命令。示例 curl 命令如下所示：\n\n```\n$ curl -H \"Content-Type: application/json\"\
  \ -X POST -d '{\"email\":\"someUser@someHost.com\",\"username\":\"myNewAccount\"\
  ,\"password\":\"mySecret\"}' https://registry.hub.docker.com/v1/users\n```\n\n此调用的响应将只是一个字符串\
  \ User Created，并带有 HTTP 201 User Created 返回代码。如果出现任何错误，响应将具有 HTTP 400 错误代码。\n\n\
  要更新用户账户，例如更改特定用户的密码或电子邮件地址，您需要向同一个 /users 端点发送类似的 JSON 负载，但使用 PUT 请求。如果您传入电子邮件，它将添加到您的账户中，不会删除旧的。密码将被更新。\n\
  \n要查找特定仓库中的镜像，我们将使用 /images 端点。列出镜像的 URL 为：\n\n```\n/v1/repositories/(namespace)/(repo_name)/images\n\
  ```\n\n因此，例如要列出官方 ubuntu 仓库中的镜像，我们需要对以下地址执行 HTTP GET 操作：\n\n```\nhttps://registry.hub.docker.com/v1/repositories/ubuntu/images\n\
  ```\n\n让我们执行该调用（这次在网页浏览器中——输出会很多）。只需在网页浏览器中输入 URL 并执行 GET 请求。Hub 将回复包含镜像 ID 的 JSON：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_131_0.png)\n\n不太可读，但还有另一个用于列出仓库的标签的端点。要获取仓库的所有标签或特定标签，请在\
  \ /tags 端点上执行 GET。此 URL 类似：\n\n```\n/v1/repositories/(namespace)/(repository)/tags\n\
  ```\n\n让我们尝试查找 ubuntu 仓库中的标签，通过在 `https://registry.hub.docker.com/v1/repositories/ubuntu/tags`\
  \ 上执行 `GET` 请求：\n\n![](img/0c87321919fa245e22f056c67ec70003_132_0.png)\n\n现在，在响应中我们有更多信息，如层\
  \ ID 和标签名称，通常包括 `latest` 标签。\n\n除了用于列出用户登录和验证、列出镜像和标签的端点之外，Registry Hub API 还包含更多内容。让我们在下表中总结它们：\n\
  \n| 目的 | Request type and endpoint |\n|---|---|\n| 注册表状态检查 | `GET /v1/_ping` |\n\
  | 创建新用户账户 | `POST /v1/users` |\n| 更新用户详情 | `PUT /v1/users/(username)/` |\n| 为库授权令牌\
  \ | `PUT /v1/repositories/(repo_name)/auth` |\n\n\n\n| 为用户仓库授权令牌 | PUT /v1/repositories/(namespace)/(repo_name)/auth\
  \ |\n| 验证用户登录 | GET /v1/users |\n| 创建新的库仓库 | PUT /v1/repositories/(repo_name)/ |\n\
  | 创建新的用户仓库 | PUT /v1/repositories/(namespace)/(repo_name)/ |\n| 更新用户仓库镜像 | PUT /v1/repositories/(namespace)/(repo_name)/images\
  \ |\n| 更新库仓库镜像 | PUT /v1/repositories/(repo_name)/images |\n| 删除现有的库仓库 | DELETE\
  \ /v1/repositories/(repo_name)/ |\n| 删除用户仓库 | DELETE /v1/repositories/(namespace)/(repo_name)/\
  \ |\n| 列出库仓库中的镜像 | GET /v1/repositories/(repo_name)/images |\n| 列出用户仓库中的镜像 | GET\
  \ /v1/repositories/(namespace)/(repo_name)/images |\n| 检索镜像 | GET /v1/images/(image_id)/json\
  \ |\n| 获取仓库的所有标签或特定标签 | GET /v1/repositories/(namespace)/(repository)/tags |\n|\
  \ 删除标签 | DELETE /v1/repositories/(namespace)/(repository)/tags/(tag*) |\n| 提取镜像层\
  \ | GET /v1/images/(image_id)/layer |\n| 插入镜像层 | PUT /v1/images/(image_id)/layer\
  \ |\n| 检索镜像的根 | GET /v1/images/(image_id)/ancestry |\n\n所有 API 命令在 Docker 文档网站上都有相当完善的文档，网址为\
  \ https://docs.docker.com。在那里你可以找到 API 调用所需提供的示例 JSON 负载，以及示例响应和 HTTP 返回状态码。暴露的\
  \ REST API 是一种很好的方式，如果你想开发自己的应用程序或处理 Registry 的自动化脚本。这再次证明了 Docker 为管理员或开发者提供的可扩展性和灵活性。\n\
  \n阅读本章后，你现在应该熟悉查找镜像的方式，无论是使用 Web 界面、命令行工具还是远程 API。你应该能够轻松找到一个将成为你自己镜像基础的镜像，而我们实际上将在下一章中创建这些镜像。\n\
  \n## Summary\n\n阅读本章后，你应该对 Docker 的远程存储概念——Docker Registries 有所理解。我们也知道如何在最流行的 Docker\
  \ 镜像仓库 Docker Hub 上创建和管理用户账户。我们能够找到一个可用于作为我们自己镜像基础的有用且合适的镜像。事实上，在第 6 章《创建镜像》中，我们将把所有这些付诸实践——我们将基于在\
  \ Docker Hub 上找到的镜像创建一个镜像。\n\n# 6\n\n## 6 创建镜像\n\n在阅读了前几章后，你应该熟悉如何找到适合作为自己软件基础的镜像。你可以从远程仓库拉取它们，在运行时运行并对其进行更改，然后导出为新镜像。我们在第\
  \ 3 章《理解镜像和容器》中曾通过运行容器、在其中安装软件并执行提交来创建镜像的方式看到了构建自己的镜像。这并不太实用，有时非常繁琐。幸运的是，有解决方案。Docker\
  \ 有一个脚本引擎，我们可以用它来使用预定义的指令和属性列表创建新镜像。我们称这些脚本为 Dockerfiles。这次，我们将基于 Dockerfile 创建一个镜像。本章将涵盖以下主题：\n\
  \n- Dockerfile 简介\n- 创建和编辑 Dockerfile\n- Dockerfile 指令\n- 构建镜像\n\n首先让我们了解 Dockerfile\
  \ 是什么。它只是一个包含构建镜像指令的纯文本文件。Docker 将处理此文件并逐步（或更确切地说是逐层）自动构建镜像，以源（基础）镜像作为基础。例如，我们可以使用基础\
  \ Ubuntu 镜像，安装诸如 Wildfly 之类的应用服务器，配置自己的应用程序或服务，并将 resulting 镜像作为一个整体发布——一个完整的应用程序，供其他人使用。使用\
  \ Dockerfile 有很多好处——你编辑和操作的是文本文件，而不是直接进行所有更改并将镜像保存回磁盘。你将 Dockerfile 视为应用程序源代码的一部分——你应该将其放入像\
  \ GIT 这样的版本控制系统中，以便跟踪更改并与团队成员共享。事实上，编写 Dockerfile 是构建自己的镜像更一致且可重复的方式。此外，使用 Dockerfile\
  \ 是在动态构建镜像时的推荐方式，例如在持续部署设置中。\n\n本章将涵盖以下主题：\n\n- 创建和编辑 Dockerfile\n- Dockerfile 指令\n\
  - 构建镜像\n\n让我们开始创建 Dockerfile。我们将使用 Dockerfile 以更程序化的方式创建镜像。编辑 Dockerfile 时，你可以使用任何你选择的文本编辑器，但使用支持\
  \ Dockerfile 语法高亮的 IDE 会更方便。例如，IntelliJ IDEA 有一个 Docker 集成插件，我强烈推荐。顺便说一下，我们将在下一章大量使用此插件——有一个新的\
  \ IDEA Run/Debug 配置用于 Docker 部署，它将允许你指定云部署目标、适当的 Dockerfile，并为你的容器命名。此插件可让你下载和构建镜像、创建和启动容器，并执行其他与\
  \ Docker 相关的任务。除此之外，在编辑 Dockerfile 时你将获得编辑器补全和语法高亮，如以下屏幕截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_136_0.png)\n\
  \nDocker 中的镜像创建流程相当直接，主要包括两个步骤：\n\n- 首先，你准备 `Dockerfile`，它只是一个包含构建镜像一系列指令的文本文件。它支持一组不算很大的命令，你可以在\
  \ Dockerfile 中使用它们来指示 Docker 如何创建镜像。\n- 接下来，你将使用 docker build 命令基于刚刚创建的 Dockerfile\
  \ 创建 Docker 镜像。\n\nDockerfile 的标准名称就是 `Dockerfile`，它只是一个纯文本文件。\nDockerfile 使用简单、清晰的语法，这使得它们非常容易创建和使用。它们旨在自解释，特别是因为它们允许像良好且正确编写的应用程序源代码一样进行注释。\n\
  \n此文件中的指令不区分大小写，然而，好的做法是坚持一种约定并以大写形式编写——这将使 Dockerfile 更具可读性。你可以使用井号符号 # 在 Dockerfile\
  \ 中编写注释。Docker 将跳过注释行，除非它包含解析指令，我们稍后会介绍。虽然某些命令，例如 `MAINTAINER`，可以放在 Dockerfile 的任何位置，但大多数命令，例如\
  \ `ADD` 必须按照你希望在构建镜像时执行的顺序放置。`CMD` 和 `ENTRYPOINT` 是例外——Dockerfile 中只有最后一个 `CMD`\
  \ 或 `ENTRYPOINT` 指令会生效。\n\n![](img/0c87321919fa245e22f056c67ec70003_137_0.png)\n\
  \nDockerfile 中指令的顺序很重要——它们将按照 Dockerfile 中的相同顺序执行。\n\n让我们逐一开始描述可能的 Dockerfile 指令。\n\
  \n## Dockerfile 指令\n\n在本节中，我们将逐一介绍 Dockerfile 指令。让我们从应该在我们要创建的 Dockerfile 中排在第一位的指令开始，即\
  \ `FROM` 指令。\n\n### FROM\n\nFROM 指令的语法非常简单。它有三种形式。可以像这样简单：\n\n```\nFROM <image>\n\
  ```\n\n默认情况下，Docker 将使用标记为 latest 的镜像。如果你需要基于不同的标签构建，你需要在镜像名称后添加标签名称。然后 FROM 指令将采用以下形式：\n\
  \n```\nFROM <image>:<tag>\n```\n\n最后但并非最不重要的一点是，你甚至可以使用其摘要更精确地选择镜像。正如你从前几章中记得的，如果作者决定这样做，具有相同标签的镜像可能会随时间变化。如果你想将基础镜像锁定到固定版本，可以将摘要指定为镜像名称。这样，你自己的镜像将始终使用基础镜像的特定版本进行构建，而与标签无关。要使用摘要指定基础镜像，请使用\
  \ FROM 指令的以下语法：\n\n```\nFROM <image>@<digest>\n```\n\nFROM 指令告诉 Docker 正在创建的镜像的基础是什么。在这里，你可以使用在第\
  \ 5 章《查找镜像》中学到的在 Docker Hub 上查找镜像的技能。现在这很重要——因为它将是起点——请明智选择。当然你可以选择任何你想要作为自己镜像基础的东西，由你决定——但我的建议是始终优先选择官方仓库。通过选择官方镜像，你可以相当确定它质量高、经过测试、受支持且维护。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_138_0.png)\n\n你可以在 FROM 指令中使用自己的镜像。\n\
  \n如果在你的 Docker 主机上（例如你的本地机器）找不到 FROM 镜像，Docker 将尝试从 Docker 镜像索引中找到并下载它。同样，Docker\
  \ Hub 将默认被选中。\n\n\n\n\nDockerfile 中的所有后续指令都将使用 FROM 指定的镜像作为基础起点。这就是为什么它是强制性的——一个有效的\
  \ Dockerfile 必须将其放在顶部。虽然你可以在镜像中使用多个 FROM 指令，但这可能不是一个好且推荐的做法——虽然有趣，但并未完全支持。特别是，使用多个\
  \ FROM 产生的非最终镜像如果不解析构建输出，很难找到。实际上，Docker 的 GitHub 上正在进行一项关于从 Dockerfile 规范中移除对多个\
  \ FROM 指令支持的讨论。\n\nFROM 指令接受标签或摘要作为参数。如果你决定跳过它们，Docker 将假设你想从 latest 标签构建镜像。正如你在第\
  \ 5 章《查找镜像》中记得的那样，它并不总是你想要构建的基础镜像的最新版本。如果 Docker 找不到你提供的标签或摘要，构建过程中会抛出错误。\n\n##\
  \ MAINTAINER\n\n通过使用 MAINTAINER 指令，你可以设置生成镜像的 Author 字段。这可以是你的姓名、用户名，或你希望用来作为使用此\
  \ Dockerfile 创建的镜像作者的任何引用。此命令可以放在 Dockerfile 的任何位置，但良好的做法是将其放在文件顶部，紧跟在 FROM 指令之后。这是所谓的非执行命令，这意味着它不会对生成的镜像做任何更改。语法，再次说明，非常简单：\n\
  \n```\nMAINTAINER authors_name\n```\n\n## ADD\n\nADD 基本上会将主机上的源文件复制到 Docker 镜像自身的\
  \ 文件系统中的期望目标位置。它接受两个参数；源（<source path or URL>）和目标（<destination path>）：\n\n```\n\
  ADD <source path or URL> <destination path >\n```\n\n源路径可以是相对于构建过程将要启动的目录（构建上下文）的文件或目录。这意味着你不能例如将\
  \ `../../config.json` 放在 `ADD` 指令的源路径参数中。构建上下文可以使用 `docker build` 命令中的 `PATH` 选项更改，且源路径相对于构建上下文。\n\
  \n源可以包含通配符。这些与常规文件系统相同：* 代表任意文本字符串，或 ? 代表任意单个字符。\n\n请考虑以下示例：\n\n- `ADD myFiles*\
  \ /myDirectory/`: 这将添加所有以 myFiles 开头的文件\n- `ADD file?.txt /myDirectory/`: 这将用任意单个字符替换，以便匹配\
  \ `file1.txt`、`fileB.txt`，和 so on。\n\n![](img/0c87321919fa245e22f056c67ec70003_140_0.png)\n\
  \n另一方面，目标路径不能包含通配符。\n\n你可以指定多个源路径，用逗号分隔。它们都必须相对于构建上下文，就像只有一个源路径一样。如果你的源或目标路径包含空格，你需要使用特殊语法，在周围加上方括号：\n\
  \n```\nADD [\"<source path or URL>\" \"<destination path>\"]\n```\n\n在向镜像添加文件或目录时，尾部斜杠\
  \ / 非常重要。如果源路径不以尾部斜杠结尾，它将被视为单个文件并直接复制到目标位置。如果源路径以尾部斜杠结尾，它将被视为目录；其所有内容将被复制到目标路径，但目录本身不会在目标路径创建。\n\
  \n如果源路径指向 `zip`、`tar` 等常见格式的压缩归档，它将被解压到目标路径。Docker 并不是通过文件名识别归档，而是检查文件内容。\n\n![](img/0c87321919fa245e22f056c67ec70003_141_0.png)\n\
  \n如果归档已损坏或以其他方式无法被 Docker 读取，它将不会被提取，并且你不会收到错误消息——文件将只是被复制到目标路径。\n\n相同的尾部斜杠规则适用于目标路径：如果它以尾部斜杠结尾，则表示它是一个目录。否则，它将被视为单个文件。这在构建镜像的文件系统内容时提供了很大的灵活性——你可以将文件添加到目录中，也可以添加整个目录。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_141_1.png)\n\n请注意，使用 ADD 且源文件多于一个时，目标必须是目录并以斜杠\
  \ / 结尾。\n\nADD 命令不仅仅是复制本地文件系统中的文件——你也可以用它从网络获取文件。如果源是 URL，则 URL 的内容将被自动下载并放置在目标位置。请注意，从网络下载的文件归档不会被解压。再次强调，尾部斜杠在下载文件时很重要——如果目标路径以斜杠结尾，文件将被下载到目录中。否则，下载的文件将仅以你提供的目标路径名称保存。\n\
  \n<destination directory> 要么是绝对路径，要么是相对于 WORKDIR 指令指定的目录的路径（我们稍后会介绍）。源（或多个源）将被直接复制到指定的目标位置。请考虑以下示例：\n\
  \n- `ADD config.json projectRoot/` 将把 `config.json` 文件添加到 `<WORKDIR>/projectRoot/`\n\
  - `ADD config.json /absoluteDirectory/` 将把 `config.json` 文件添加到 `/absoluteDirectory/`\n\
  \n就镜像中创建的文件所有权而言，它们始终将以用户 ID (UID) 0 和组 ID (GID) 0 创建。权限将与源文件相同，除非它是从远程 URL 下载的文件。在这种情况下，它将获得权限值\
  \ 600（只有所有者可以读写文件）。如果你需要更改这些值（所有权或权限），你需要在 Dockerfile 中在 ADD 指令之后提供更多指令。\n\n![](img/0c87321919fa245e22f056c67ec70003_142_0.png)\n\
  \n如果需要添加到镜像中的文件放置在需要身份验证的 URL 上，ADD 指令将无法工作——你需要使用 shell 命令下载文件，例如 wget 或 curl。\n\
  \n## COPY\n\nCOPY 指令会将新的文件或目录从 <source path> 复制并添加到容器文件系统中的 <destination path> 路径。\n\
  \n它与 ADD 指令非常相似，甚至语法也完全相同：\n\n```\nCOPY <source path or URL> <destination path >\n\
  ```\n\nADD 的相同规则适用于 COPY——所有源路径必须相对于构建的上下文。再次强调，源路径和目标路径末尾是否存在尾部斜杠很重要。如果存在，路径将被视为目录，否则将被视为文件。\n\
  \n当然，如同 ADD 一样，你可以有多个源路径。如果源或目标路径包含空格，你需要将它们用方括号括起来：\n\n```\nCOPY [\"<source path\
  \ or URL>\" \"<destination path>\"]\n```\n\n<destination path> 是绝对路径（以斜杠开头），或相对于\
  \ WORKDIR 指令指定的路径的路径。\n\n正如你所见，COPY 的功能几乎与 ADD 指令相同，只有一个区别。COPY 仅支持将本地文件复制到容器的基本操作。另一方面，ADD\
  \ 具有更多功能，例如归档提取、通过 URL 下载文件等。Docker 的最佳实践指出，如果你不需要 ADD 的这些额外功能，应该优先使用 COPY。得益于 COPY\
  \ 命令的透明性，Dockerfile 将更简洁、更容易理解。\n\n对于 ADD 和 COPY 指令来说，有一个共同且重要的方面，那就是缓存。基本上，Docker\
  \ 在构建过程中缓存进入镜像的文件。镜像中文件或文件的内容将被检查，并为每个文件计算校验和。在缓存查找期间，校验和与现有镜像中的校验和进行比较。如果文件（例如内容和元数据）有任何更改，则缓存将被失效。否则，如果源文件未更改，则会重用现有的镜像层。\n\
  \n\n\n如果你的 Dockerfile 中有多个步骤使用了来自构建上下文的不同文件，请分别单独复制它们，而不是一次性全部复制。这样可以确保只有在特定所需的文件发生变化时，才会使每个步骤的构建缓存失效（从而强制重新运行该步骤）。\n\
  \n如你所见，`COPY` 指令与 `ADD` 指令的语法和行为几乎相同，但其功能集有所不同。对于不需要 `ADD` 指令的归档解包或从 URL 获取等功能的文\
  \ 件和目录，你应始终使用 `COPY`。\n\n## CMD\n\n`CMD` 指令的目的是为正在运行的容器提供默认值。你可以将 `CMD` 指令视为镜像的\
  \ *起点*，当容器稍后运行时。这可以是一个可执行文件，或者如果你指定了 `ENTRYPOINT` 指令（我们将在本章稍后解释），你可以省略可执行文件，只提供默认参数。\n\
  \n`CMD` 指令的语法如下：\n\n```\nCMD [\"parameter1\",\"parameter2\"]\n```\n\n- `CMD [\"\
  executable\", \"parameter1\", \"parameter2\"]`：这是所谓的 exec 形式。它也是首选且推荐的形式。参数被包含在方括号中——它是一个\
  \ JSON 数组。这也意味着你必须使用双引号 (`) 将单词括起来，而不是单引号 (')。需要注意的重要一点是，exec 形式在容器运行时不会调用命令 shell。它只是运行作为第一个参数提供的可执行文件。这也意味着正常的\
  \ shell 处理不会发生，例如，以下环境变量替换将不起作用：\n  \n  ```\n  CMD [\"parameter1\",\"parameter2\"\
  ]\n  ```\n  \n  此形式的 `CMD` 指令仅为 `ENTRYPOINT` 指令提供一组默认参数。\n- `CMD command parameter1\
  \ parameter2`：这是该指令的 shell 形式。这时，shell（如果镜像中存在）将处理该命令。指定的二进制文件将使用 `/bin/sh -c` 调用\
  \ shell 来执行。这意味着如果你想显示容器的主机名，例如使用 `CMD echo $HOSTNAME`，你应该使用 shell 形式。\n\n我们之前说过，CMD\
  \ 指令的推荐形式是 exec 形式。原因在于通过 shell 启动的一切都将作为 /bin/sh -c 的子命令启动，而它不会传递信号。这意味着可执行文件将不是容器的\
  \ PID 1——也不会接收 Unix 信号——因此你的可执行文件将不会收到来自 docker stop <container> 的 SIGTERM。还有另一个缺点——你需要在容器中拥有一个\
  \ shell。如果你在构建最小化镜像，它不需要包含 shell 二进制文件。使用 shell 形式的 CMD 指令将简单地失败。\n\n![](img/0c87321919fa245e22f056c67ec70003_144_0.png)\n\
  \n当 Docker 执行命令时，它不会检查容器内部是否存在 shell；如果镜像中没有 /bin/sh，容器将无法启动。\n\nexec 形式和 shell\
  \ 形式之间的区别可以通过运行示例轻松展示。考虑以下使用 shell 形式的 Dockerfile：\n\n```\nFROM ubuntu\nCMD echo\
  \ $HOSTNAME\n```\n\n输出将只是 Docker 在容器运行时生成的唯一主机名：\n\n![](img/0c87321919fa245e22f056c67ec70003_144_1.png)\n\
  \n另一方面，如果我们将 CMD 改为 exec 形式，Docker 将会寻找名为 echo 的可执行文件，这当然会失败，因为 echo 是一个 shell 命令。\n\
  \n由于 CMD 在 Docker Engine 运行容器时就像一个起点，因此 Dockerfile 中只能有一个 CMD 指令。\n\n![](img/0c87321919fa245e22f056c67ec70003_145_0.png)\n\
  \n如果 Dockerfile 中有多个 CMD 指令，只有最后一个会生效。\n\n`CMD` 命令的参数可以在启动镜像时被覆盖——如果你向 docker run\
  \ 指定参数。在启动容器时，你可以通过在命令行提供参数来覆盖默认的 CMD 参数，如下图所示。在此示例中，我们要求再次启动 /bin/sh -c shell，因为我们使用的是\
  \ CMD 的 shell 形式，这次覆盖了 Dockerfile 中的默认 CMD 指令：\n\n```\ndocker run 00bd948ecdff \"\
  echo\" \"Hello world!\"\n```\n\n请注意，这次它不会打印出主机名，而是打印 Hello world，取自我们覆盖的 CMD 参数：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_145_1.png)\n\n我们将在第 7 章《运行容器》中详细讨论这一点。\n\
  \n## ENTRYPOINT\n\n官方 Docker 文档说，ENTRYPOINT 指令允许你配置一个作为可执行文件运行的容器。至少第一次看时，这并不太清楚。ENTRYPOINT\
  \ 指令与 CMD 指令相关。事实上，开始时可能会令人困惑。原因很简单；CMD 最先开发，然后 ENTRYPOINT 为更灵活的定制而开发，这两个指令之间存在一些功能重叠。让我们稍微解释一下。ENTRYPOINT\
  \ 指令指定了容器启动时始终会执行的命令。另一方面，CMD 指令指定将提供给 ENTRYPOINT 指令的参数。考虑这个例子。假设我们要运行的镜像（ubuntu）有一个\
  \ ENTRYPOINT 为 /bin/sh -c，但没有默认 CMD，并且我们执行以下命令：\n\n```\ndocker run ubuntu \"echo\"\
  \ \"hello world\"\n```\n\n在这种情况下，镜像将是最新版 ubuntu，ENTRYPOINT 指令将是 /bin/sh -c，而传递给\
  \ ENTRYPOINT 指令的命令将是 echo \"hello world\"。\n\nENTRYPOINT 指令的语法可以有两种形式，与 CMD 类似：\n\
  \n- ENTRYPOINT [\"executable\", \"parameter1\", \"parameter2\"]：这是 exec 形式，首选且推荐。与\
  \ CMD 指令的 exec 形式完全相同，这不会调用命令 shell。这意味着正常的 shell 处理不会发生。例如，ENTRYPOINT [ \"echo\"\
  , \"$HOSTNAME\" ] 不会对 $HOSTNAME 变量进行变量替换。如果你想要 shell 处理，那么你需要使用 shell 形式或直接执行 shell，例如：\n\
  \  \n  ENTRYPOINT [ \"sh\", \"-c\", \"echo $HOSTNAME\" ]\n  \n  使用 Dockerfile 中的\
  \ ENV 定义的变量（我们稍后会介绍）将由 Dockerfile 解析器进行替换。\n- ENTRYPOINT command parameter1 parameter2：这是\
  \ shell 形式。正常的 shell 处理将会发生。此形式还将忽略任何 CMD 或 docker run 命令行参数。此外，你的命令将不是 PID 1，因为它将由\
  \ shell 执行。因此，如果你随后运行 docker stop <container>，容器将不会干净地退出——stop 命令将被迫在超时后发送 SIGKILL\
  \ 命令。\n\n```\nENTRYPOINT [ \"sh\", \"-c\", \"echo $HOSTNAME\" ]\n```\n\n你需要知道，与\
  \ CMD 指令完全相同，只有 Dockerfile 中最后一个 ENTRYPOINT 指令会生效。覆盖 Dockerfile 中的 ENTRYPOINT 允许你在容器运行时使用不同的命令处理你的参数。如果你需要更改镜像中的默认\
  \ shell，你可以通过更改 ENTRYPOINT 来实现：\n\n```\nFROM ubuntu\nENTRYPOINT [\"/bin/bash\"]\n\
  ```\n\n从现在开始，所有来自 CMD 或使用 docker run 启动容器时提供的参数都将由 Bash shell 处理，而不是默认的 /bin/sh\
  \ -c。\n\n考虑另一个示例 Dockerfile：\n\n```\nFROM busybox\nENTRYPOINT [\"/bin/ping\"]\n\
  CMD [\"localhost\"]\n```\n\n如果你现在运行从此 Dockerfile 构建的容器，则 ping 命令作为镜像的 ENTRYPOINT\
  \ 将处理来自提供的 CMD 参数的参数：在我们的例子中是 localhost。因此，你将得到一个 /bin/ping localhost 命令行响应：\n\n\
  ![](img/0c87321919fa245e22f056c67ec70003_147_0.png)\n\n\n\n正如你从 CMD 指令的描述中记得的，它设置默认的命令和/或参数，可以在\
  \ Docker 容器运行时从命令行覆盖。ENTRYPOINT 命令和参数不会从命令行被覆盖。相反，所有命令行参数都会添加到 ENTRYPOINT 参数之后。\n\
  \n与 CMD 参数不同，当 Docker 容器使用命令行参数运行时，ENTRYPOINT 命令和参数不会被忽略。\n\n因此我们可以运行我们的 ping 镜像，并向\
  \ ENTRYPOINT 指令传递不同的参数：\n\n![](img/0c87321919fa245e22f056c67ec70003_148_0.png)\n\
  \n你可以使用 ENTRYPOINT 的 exec 形式来设置相当稳定的默认命令和参数，然后使用 CMD 的任一形式来设置更可能被更改的附加默认值。\n\n拥有\
  \ ENTRYPOINT 指令给了我们很大的灵活性。最后但同样重要的是，ENTRYPOINT 在启动容器时也可以使用 docker run 命令的 --entrypoint\
  \ 参数进行覆盖。请注意，你可以使用 --entrypoint 覆盖 ENTRYPOINT 设置，但这只能设置要执行的二进制文件（不会使用 sh -c）。我们将在第\
  \ 7 章《运行容器》中详细讨论这一点。\n\n如你所见，`CMD` 和 `ENTRYPOINT` 指令都定义了运行容器时执行什么命令。让我们总结一下我们所学到的关于它们差异和协作的内容：\n\
  \n- Dockerfile 应至少指定 `CMD` 或 `ENTRYPOINT` 指令之一\n- Dockerfile 中只有最后一个 `CMD` 和 `ENTRYPOINT`\
  \ 会被使用\n- 使用容器作为可执行文件时应定义 `ENTRYPOINT`\n- 你应使用 `CMD` 指令作为为 `ENTRYPOINT` 定义的命令定义默认参数的方式，或在容器中执行临时命令\n\
  - 使用替代参数运行容器时，`CMD` 会被覆盖\n- `ENTRYPOINT` 参数设置每次使用镜像创建容器时使用的具体默认应用程序\n- 如果将 `ENTRYPOINT`\
  \ 与 `CMD` 结合使用，可以从 `CMD` 中移除可执行文件，只保留其参数，这些参数将被传递给 `ENTRYPOINT` 指令\n- `ENTRYPOINT`\
  \ 指令的最佳用途是设置镜像的主要命令，使该镜像可以像该命令一样运行（然后使用 `CMD` 作为默认标志）。\n\n## LABEL\n\n要向我们的镜像添加元数据，我们使用\
  \ `LABEL` 指令。单个标签是一个键值对。如果标签值中需要包含空格，则需要将其用一对引号括起来。标签是累加的。它们包括从作为你自己镜像的基础的镜像（来自\
  \ `FROM` 指令的那个）中获取的所有标签。如果 Docker 遇到已存在的标签，它将使用新值覆盖具有相同键的标签。\n\n![](img/0c87321919fa245e22f056c67ec70003_149_0.png)\n\
  \n定义标签时必须遵守一些规则：键只能由小写字母数字字符、点和连字符组成，并且必须以字母数字字符开头和结尾。\n\n为防止命名冲突，Docker 建议使用反向域名表示法对键使用命名空间进行标记。另一方面，没有命名空间（点）的键保留用于命令行使用。\n\
  \nLABEL 指令的语法很简单：\n\n```\nLABEL \"key\"=\"value\"\n```\n\n要实现多行值，请用反斜杠分隔各行，例如：\n\
  \n```\nLABEL description=\"This is my \\ multiline description of the software.\"\
  \n```\n\n单个镜像中可以有多个标签。用空格或反斜杠分隔它们，例如：\n\n```\nLABEL key1=\"value1\" key2=\"value2\"\
  \ key3=\"value3\"\nLABEL key1=\"value1\" \\\nkey2=\"value2\" \\\nkey3=\"value3\"\
  \n```\n\n实际上，如果你需要在镜像中拥有多个标签，建议使用 LABEL 指令的多标签形式，因为它只会在镜像中产生一个额外的层。\n\n![](img/0c87321919fa245e22f056c67ec70003_150_0.png)\n\
  \n每个 LABEL 指令都会创建一个新层。如果你的镜像有许多标签，请使用单个 LABEL 指令的多个形式。\n\n如果你想检查镜像有哪些标签，请使用你已从前几章了解的\
  \ docker inspect 命令：\n\n![](img/0c87321919fa245e22f056c67ec70003_150_1.png)\n\n\
  ENV Dockerfile 指令将环境变量 <key> 设置为值 <value>。它有两种形式：\n\n- 第一种形式，ENV <key> <value> 将单个变量设置为一个值。第一个空格之后的所有字符串都将被视为\
  \ <value>。这将包括任何字符，也包括空格和引号。考虑以下示例：ENV JAVA_HOME /var/lib/java8\n- 第二种形式是 ENV <key>=<value>\
  \ ...，允许一次设置多个环境变量。区别在于等号。如果你需要在值中提供空格，则需要使用引号。如果需要在值中使用引号，请使用反斜杠：ENV CONFIG_TYPE=file\
  \ CONFIG_LOCATION=\"home/Jarek/my \\ app/config\"\n\n请注意，你可以使用 ENV 更新 PATH 环境变量，然后\
  \ CMD 参数将意识到该设置。这将在 Dockerfile 中产生更简洁的 CMD 参数形式。考虑以下示例：\n\n```\nENV PATH /var/lib/tomcat8/bin:$PATH\n\
  ```\n\n设置此项将确保 CMD [\"startup.sh\"] 正常工作，因为它将在系统 PATH 中找到 startup.sh 文件。你也可以使用 ENV\
  \ 设置经常修改的版本号，以便升级更容易处理，如以下示例所示：\n\n```\nENV TOMCAT_VERSION_MAJOR 8\nENV TOMCAT_VERSION\
  \ 8.5.4\nRUN curl -SL\nhttp://apache.uib.no/tomcat/tomcat-$TOMCAT_VERSION_MAJOR/v$TOMCAT_VERSION/bin/apache-tomcat-$TOMCAT_VERSION.tar.gz\
  \ | tar zxvf apache-tomcat-$TOMCAT_VERSION.tar.gz -c /usr/Jarek/apache-tomcat-$TOMCAT_VERSION\n\
  ENV PATH /usr/Jarek/apache-tomcat-$TOMCAT_VERSION/bin:$PATH\n```\n\n在前面的示例中，Docker\
  \ 将下载 ENV 变量中指定的 Tomcat 版本，将其提取到以该版本命名的新目录中，并设置系统 PATH 使其可用于运行。\n\n使用 ENV 设置的环境变量在从生成的镜像运行容器时将保持不变。与使用\
  \ LABEL 创建的标签一样，你可以使用 docker inspect 命令查看 ENV 值。ENV 值也可以在使用 docker run --env <key>=<value>\
  \ 启动容器之前被覆盖。\n\n## EXPOSE\n\nEXPOSE 指令通知 Docker 容器在运行时监听指定的网络端口。我们已在第 4 章《网络和持久存储》中提到过\
  \ EXPOSE 指令。正如你记得的，Dockerfile 中的 EXPOSE 等同于 --expose 命令行选项。Docker 使用 EXPOSE 命令后跟端口号来允许流量进入容器。我们已经知道\
  \ EXPOSE 不会自动使容器的端口对主机可访问。为此，你必须使用 -p 标志发布一系列端口，或使用 -P 标志一次发布所有暴露的端口。\n\n让我们以 Nginx\
  \ Web 服务器 Dockerfile 为例。正如一直以来那样，查看现有源代码是创建自己的最佳方式。对于 Dockerfile 来说也一样。Nginx Dockerfile\
  \ 很不错而且很小，它在 GitHub 上可用 (https://github.com/dockerfile/nginx/blob/master/Dockerfile)：\n\
  \n```\n# Pull base image.\nFROM ubuntu:14.04\n# Install Nginx.\nRUN \\\n    add-apt-repository\
  \ -y ppa:nginx/stable && \\\n    apt-get update && apt-get install -y nginx && \\\
  \n    rm -rf /var/lib/apt/lists/* && \\\n    echo \"\\ndaemon off;\" >> /etc/nginx/nginx.conf\
  \ && \\\n    chown -R www-data:www-data /var/lib/nginx\n\n# Define mountable directories.\n\
  VOLUME [\"/etc/nginx/sites-enabled\", \"/etc/nginx/certs\",\n\"/etc/nginx/conf.d\"\
  , \"/var/log/nginx\", \"/var/www/html\"]\n\n# Define working directory.\nWORKDIR\
  \ /etc/nginx\n\n# Define default command.\nCMD [\"nginx\"]\n\n# Expose ports.\n\
  EXPOSE 80\nEXPOSE 443\n```\n\n\n\n如你在前面的 Dockerfile 中所见，它使用 EXPOSE 暴露了两个端口：标准 HTTP（80）和\
  \ SSL（443）。这些端口将可供此主机上的其他容器使用，并且——如果你在运行时暴露它们——也对外部世界可用。你可以显式地使用指定端口运行镜像：\n\n```\n\
  docker run nginx -p 80\n```\n\n另选地，你可以告诉 Docker 我们希望所有暴露的端口一次性发布：\n\n```\ndocker\
  \ run nginx -P\n```\n\n良好做法是为你的应用程序使用通用、已知的端口号。例如，如果你的应用程序运行在 nginx Web 服务器上，你应该使用端口号\
  \ 80 进行 EXPOSE，这样应用程序的用户就不会对一些奇特的端口号感到惊讶。当然，如果有暴露非标准端口号的特定需求，你可以自由选择，这只是良好实践。\n\n\
  ## RUN\n\nRUN 指令是 Dockerfile 的核心执行指令。本质上，RUN 指令会在当前镜像之上新建一层执行任意命令，然后提交结果。提交后的镜像将用作\
  \ Dockerfile 中下一条指令的基础。正如你在第 3 章 *理解镜像和容器* 中记得的那样，分层是 Docker 的核心概念。RUN 将命令作为参数并运行它以形成镜像。RUN\
  \ 指令可以运行任何命令（或应用程序），这与我们之前了解的 CMD 指令类似。有一个关键的重要区别——执行时间。通过 RUN 指令提供的命令在构建时执行，而通过\
  \ CMD 指令指定的命令在通过在新创建的镜像上执行 docker run 启动容器时执行。与 CMD 不同，RUN 指令实际上用于构建镜像，通过在之前的基础上创建新层并提交。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_153_0.png)\n\nCMD 是运行时指令，而 RUN 是构建时指令。\n\
  \n这也意味着 CMD 和 ENTRYPOINT 设置的参数可以在运行时被覆盖，因此如果你不做任何更改，启动容器后结果始终相同。而 RUN 则在构建时执行，无论你在运行时做什么，其效果都会在这里体现。\n\
  \nRUN 与 CMD 和 ENTRYPOINT 类似，可以有两种形式：\n\n- `RUN <command>`: 这是 shell 形式。提供的命令及其参数将在\
  \ shell 中执行，在 Linux 上为 `/bin/sh -c`，在 Windows 上为 `cmd /S /C`。RUN 指令的默认 shell 可以使用\
  \ SHELL 命令更改。\n- `RUN [\"executable\", \"parameter1\", \"parameter2\"]`: 这是 exec\
  \ 形式。与 CMD 中的规则相同。使用此形式，你可以在不包含指定 shell 可执行文件的 base 镜像上执行命令。此形式的 RUN 不会调用命令 shell。同样，与\
  \ CMD 或 ENTRYPOINT 一样，正常的 shell 处理，例如变量替换，不会发生。\n\n![](img/0c87321919fa245e22f056c67ec70003_154_0.png)\n\
  \n为了使 Dockerfile 更易读且更易维护，你可以将长或复杂的 RUN 语句拆分为多行，用反斜杠分隔。\n\nDockerfile 中的 RUN 命令将按其出现的顺序执行。每个\
  \ RUN 指令都会在镜像中创建一个新层。层，如你已从第 3 章 *理解镜像和容器* 中所知，被 Docker 缓存并重用。RUN 指令的缓存不会在下一次构建期间自动失效。例如，像\
  \ RUN apt-get upgrade -y 这样的指令的缓存将在下一次构建期间被重用。缓存的重要性是什么？在大多数情况下，缓存非常有帮助，可以在构建镜像时为你节省大量时间。如果\
  \ Docker 即将产生的对象在构建之间未受影响，重用主机上之前构建的缓存是极大的节省时间。它使构建新容器变得非常、非常快。这些文件结构不必再次创建并写入磁盘——对它们的引用足以定位并重用之前构建的结构。然而，有时缓存可能是危险的并提供意外的结果。缓存在构建过程中被大量使用，这可能会导致问题，当你希望\
  \ RUN 命令的更新输出进入新容器时。\n\n如果 RUN 命令在两次构建之间没有变化，Docker 的缓存将不会失效。实际上，Docker 将重用缓存中的先前结果。当例如\
  \ RUN 命令是源代码检出，例如项目的构建第一步的 Git clone 时，这显然是有害的。\n\n![](img/0c87321919fa245e22f056c67ec70003_155_0.png)\n\
  \n请注意缓存有时需要失效，否则你将用镜像构建得到意外的结果。\n\n这就是为什么了解如何选择性地使缓存失效是好的。在 Docker 世界中，这被称为缓存破坏。\n\
  \n考虑以下示例。RUN 最常见的用例可能是 apt-get 的应用，它是 Ubuntu 上用于下载软件包的包管理器命令。假设我们有以下 Dockerfile，在镜像中安装\
  \ MongoDB：\n\n```\nFROM ubuntu\nRUN apt-get update\nRUN apt-get install -y mongodb-server\n\
  ```\n\n如果我们从此 Dockerfile 构建镜像，两个 RUN 指令的所有层都将放入层缓存中。但，过了一段时间你决定在镜像中想要 node.js 软件包，于是\
  \ Dockerfile 现在看起来像这样：\n\n```\nFROM ubuntu\nRUN apt-get update\nRUN apt-get install\
  \ -y mongodb-server\nRUN apt-get install -y nodejs\n```\n\n在第二次构建时，Docker 将通过从层缓存中获取来重用层。结果\
  \ apt-get update 将不会执行，因为将使用缓存版本。实际上，你新创建的镜像可能具有过时的 MongoDb 和 node-js 软件包版本。你在创建\
  \ RUN 指令时应始终牢记缓存概念。在我们的示例中，我们应始终将 RUN apt-get update 与 apt-get install 结合在同一个 RUN\
  \ 语句中，这将只创建一个层。考虑以下示例：\n\n```\nRUN apt-get update \\\n&& apt-get install -y mongodb-server\
  \ \\\n&& apt-get install -y nodejs\n```\n\n比这更好的是，你还可以使用一种称为 **版本锁定** 的技术来避免缓存问题。它无非就是为你想要安装的软件包提供特定、具体的版本：\n\
  \n```\nRUN apt-get update \\\n&& apt-get install -y mongodb-server \\\n&& apt-get\
  \ install -y nodejs=0.6.12~DFSG1-1UBUNTU1\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_156_0.png)\n\
  \n由于缓存问题，单独在 RUN 语句中使用 `apt-get update` 不被推荐。\n\nRUN 指令的缓存可以通过 ADD 指令或使用 `--no-cache`\
  \ 标志来使失效，例如：\n\n```\ndocker build --no-cache\n```\n\n## USER\n\nUSER 指令非常简单。它设置运行镜像时使用的用户名或\
  \ UID。它还影响 Dockerfile 中其后出现的任何 RUN、CMD 和 ENTRYPOINT 指令的用户。\n\n指令的语法只是 USER <user\
  \ name or UID>，例如：\n\n```\nUSER tomcat\n```\n\n如果你可以在没有特权的情况下运行可执行文件，可以使用 USER 命令。Dockerfile\
  \ 可以包含如下的用户和组创建指令：\n\n```\nRUN groupadd -r tomcat && useradd -r -g tomcat tomcat\n\
  ```\n\n![](img/0c87321919fa245e22f056c67ec70003_156_1.png)\n\n频繁地在 USER 之间切换会增加结果镜像中的层数，并使\
  \ Dockerfile 变得更复杂。\n\n## VOLUME\n\n正如你从第 3 章 *理解镜像和容器* 中记得的那样，Docker 文件系统默认是临时性的。如果你启动一个\
  \ Docker 镜像（即运行容器），你将在层堆栈顶部得到一个读写层。你可以随意创建、修改和删除文件，然后提交层以保留更改。此外，使用 Dockerfile 将创建只读镜像。在第\
  \ 4 章 *网络和持久化存储* 中我们学习了如何创建卷——从 Docker 容器存储和检索数据的好方法。我们可以在 Dockerfile 中使用 VOLUME\
  \ 指令做同样的事情。\n\n语法 couldn't be simpler，它只是 `VOLUME [ \"/volumeName\" ]`。\n\nVOLUME\
  \ 的参数可以是 JSON 数组，也可以是包含一个或多个参数的纯字符串，例如：\n\n```\nVOLUME [\"/var/lib/tomcat8/webapps/\"\
  ]\nVOLUME /var/log/mongodb /var/log/tomcat\n```\n\nVOLUME 指令创建具有指定名称的挂载点，并将其标记为保存来自原生主机或其他容器的外部挂载卷。\n\
  \nVOLUME 命令将在容器内挂载一个目录，并将该目录内创建或编辑的任何文件存储在主机磁盘上容器文件结构之外。使用 Dockerfile 中的 VOLUME\
  \ 让 Docker 知道某个目录包含永久数据。Docker 将为该数据创建卷，并且即使你删除使用它的所有容器也不会删除它。它还绕过联合文件系统，因此卷实际上是一个实际目录，在所有共享它的容器中以正确的位置挂载，要么是读写，要么是只读（如果它们是用\
  \ `--volumes-from` 选项启动的，例如）。为了理解 VOLUME，让我们看一下简单的 Dockerfile：\n\n```\nFROM ubuntu\n\
  VOLUME /var/myVolume\n```\n\n如果你现在运行容器并在 `/var/myVolume` 中保存一些文件，它们将可供其他容器共享。\n\n\
  基本上，VOLUME 和 `-v` 选项几乎相等。VOLUME 和 `-v` 选项之间的区别是，你可以使用 `-v` 选项动态地在启动容器时通过执行 `docker\
  \ run` 将主机目录挂载到容器上。这是因为 Dockerfile 旨在可移植和共享。主机目录卷是 100% 主机依赖的，并且会在任何其他机器上中断，这有点偏离\
  \ Docker 的理念。因为这个原因，只能在 Dockerfile 中使用可移植的指令。\n\n\n\n\n![](img/0c87321919fa245e22f056c67ec70003_158_0.png)\n\
  \nVOLUME 与 -v 之间的根本区别在于：-v 会将操作系统中已有的文件挂载到 Docker 容器内部，而 VOLUME 会在主机上创建一个新的、空的卷并将其挂载到容器内部。\n\
  \n## WORKDIR\n\nWORKDIR 指令为 Dockerfile 中后续的 CMD、RUN、ENTRYPOINT、COPY 或 ADD 指令添加一个工作目录。该指令的语法为\
  \ WORKDIR /PATH。你可以在一个 Dockerfile 中使用多个 WORKDIR 指令，如果提供了相对路径，则它将相对于上一个 WORKDIR 指令的路径。\n\
  \n## ARG\n\n如果需要在 docker build 命令期间在构建时向 Docker 传递一个参数，你可以在 Dockerfile 中使用 ARG 指令。ARG\
  \ 变量的定义从其在 Dockerfile 中定义的这一行开始生效。稍后，在构建过程中，可以使用 --build-arg 开关向 docker build 命令传递任何值：\n\
  \n```\n--build-arg <variable name>=<value>\n```\n\n来自 --build-arg 开关的值将被传递给正在构建镜像的守护进程。如果指定了使用\
  \ ARG 指令未定义的构建时参数，构建将以错误失败。你可以使用多个 ARG 指令指定多个参数，例如：\n\n```\nFROM ubuntu\nARG user\n\
  ARG version\n```\n\n也可以在 Dockerfile 中为参数指定默认值——如果在构建时未指定，则将使用默认值：\n\n```\nFROM ubuntu\n\
  ARG user=jarek\n```\n\n可以通过调用以下命令将参数传递给构建器：\n\n```\ndocker build --build-arg user=somebodyElse\
  \ .\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_159_0.png)\n\n不建议使用 ARG 传递诸如\
  \ GitHub 密钥、用户凭据、密码等秘密信息，因为任何镜像使用者都可以通过 docker history 命令看到它。\n\n## ONBUILD\n\n\
  ONBUILD 指令指定了额外的指令，当使用此镜像作为其基础镜像构建其他镜像时，这些指令将被触发。换句话说，ONBUILD 指令是父 Dockerfile 给子\
  \ Dockerfile（下游构建）的指令。任何构建指令都可以注册为触发器，并且这些指令将在 Dockerfile 中的 FROM 指令之后立即触发。\n\n\
  ONBUILD 指令的语法如下：\n\n```\nONBUILD <INSTRUCTION>\n```\n\n其中，<INSTRUCTION> 是另一个 Dockerfile\
  \ 构建指令，当子镜像即将构建时它将被触发。存在一些限制：ONBUILD 指令不允许链式使用另一个 ONBUILD 指令，并且不允许将 FROM 和 MAINTAINER\
  \ 指令用作 ONBUILD 触发器。\n\n如果你正在构建一个将用作构建其他镜像的基础的镜像，例如应用程序构建环境或守护进程，这些可能使用用户特定的配置进行自定义，那么这很有用。ONBUILD\
  \ 指令对于自动化你选择的软件栈的构建非常有用。考虑以下使用 Maven 构建 Java 应用程序的示例。（是的，Maven 也可作为 Docker 容器使用）。基本上，你项目的\
  \ Dockerfile 需要做的就是引用包含 ONBUILD 指令的基础容器：\n\n```\nFROM maven:3.3-jdk-8-onbuild\n\
  CMD [\"java\",\"-jar\",\"/usr/src/app/target/app-1.0-SNAPSHOT-jar-with-dependencies.jar\"\
  ]\n```\n\n没有什么魔法，如果你查看父 Dockerfile，一切就会变得清晰；在我们的例子中，它将是 GitHub 上可用的 docker-maven\
  \ Dockerfile：\n\n```\nFROM maven:3-jdk-8 RUN mkdir -p /usr/src/app WORKDIR /usr/src/app\n\
  ONBUILD ADD . /usr/src/app ONBUILD RUN mvn install\n```\n\n有一个基础镜像同时安装了 Java 和 Maven，并且有一系列用于复制文件和运行\
  \ Maven 的指令。\n\nONBUILD 指令向镜像添加一个触发指令，以便在稍后执行——当镜像用作另一个构建的基础时。触发器将在子构建的上下文中执行，就好像它已立即插入子\
  \ Dockerfile 中的 FROM 指令之后一样。\n\n当 Docker 在构建过程中遇到 ONBUILD 指令时，构建器会向正在构建的镜像的元数据中添加一种触发器。但这就是该镜像被影响的唯一方式。在构建结束时，所有触发器的列表存储在镜像清单中，键为\
  \ OnBuild。你可以使用我们已经了解的 docker inspect 命令查看它们。\n\n稍后，该镜像可能使用 FROM 指令用作新构建的基础。作为处理\
  \ FROM 指令的一部分，Docker 构建器会查找 ONBUILD 触发器，并按它们注册的相同顺序执行它们。如果任何触发器失败，FROM 指令将被中止，这将导致构建失败。如果所有触发器都成功，FROM\
  \ 指令完成，构建继续。\n\n![](img/0c87321919fa245e22f056c67ec70003_160_0.png)\n\nONBUILD 触发器在执行后会从最终镜像中移除。它们不会被进一步继承。\n\
  \n## STOPSIGNAL\n\n要指定应发送到容器以使其退出的系统调用信号，请使用 STOPSIGNAL 指令。该信号可以是与内核 syscall 表中位置匹配的有效无符号数字，例如\
  \ 9，或格式为 SIGNAME 的信号名称，例如 SIGKILL。\n\n## HEALTHCHECK\n\n这是一个相对较新的功能，于 Docker 1.12\
  \ 中引入。你可以使用 HEALTHCHECK 指令告诉 Docker 如何测试容器以检查它是否仍在工作。这可以是检查数据库是否响应远程调用，或 Web 应用程序是否仍在指定的端口上监听。\n\
  \n如果你指定 HEALTHCHECK 指令，运行中的容器除了其正常状态外还将具有额外的状态。我们在第 3 章《理解容器和镜像》中讨论过容器状态。正如你所记得的，容器可以有多个状态，可以使用\
  \ docker ps 命令列出。这些状态可以是 created、restarting、removing、running、paused 或 exited。但有时这还不够——从\
  \ Docker 的角度来看，容器可能仍然“存活”，但应用程序可能会挂起或以其他方式失败——对应用程序状态进行额外检查会很有用，而 HEALTHCHECK 指令正派上用场。\n\
  \nHEALTHCHECK 状态最初为 starting。每当健康检查通过时，它就会变为 healthy（无论之前处于什么状态）。在连续失败一定次数后，它会变为\
  \ unhealthy。\n\nHEALTHCHECK 指令的语法如下：\n\n```\nHEALTHCHECK --interval=<interval> --timeout=<timeout>\
  \ CMD\n<command>\n```\n\n<interval>（默认值是 30 秒）和 <timeout>（同样，默认值是 30 秒）是时间值，具体为检查间隔和超时时间。<command>\
  \ 是实际用于检查应用程序是否仍在运行的命令。Docker 使用 <command> 的退出代码来确定健康检查是否失败或成功。值可以是 0，表示容器健康且可使用；也可以是\
  \ 1，表示出现问题，容器未正常工作。\n\n考虑以下示例：\n\n```\nHEALTHCHECK --interval=5m --timeout=2s --retries=3\
  \ CMD curl -f\nhttp://localhost/ || exit 1\n```\n\n在前面的示例中，`curl -f http://localhost`\
  \ 命令将每五分钟执行一次，最大超时时间为 2 秒。如果一次检查的运行时间超过 2 秒，则该检查被视为失败。如果连续三次重试失败，容器将获得 `unhealthy`\
  \ 状态。\n\n![](img/0c87321919fa245e22f056c67ec70003_162_0.png)\n\nDockerfile 中只能有一个\
  \ HEALTHCHECK 指令。如果列出多个，则只有最后一个 HEALTHCHECK 会生效。\n\nHEALTHCHECK 指令使你能够精细调整容器监控，从而确保你的容器正常工作。这比仅靠\
  \ `running` `exited` 或 `dead` 这类标准 Docker 状态要好。\n\n## SHELL\n\n正如我们之前所见，一些指令如 RUN\
  \ 和 CMD 可以使用 shell 形式的执行。Linux 上的默认 shell 是 [\"/bin/sh\", \"-c\"]，Windows 上是 [\"\
  cmd\", \"/S\", \"/C\"]。如果需要，你可以使用 SHELL 指令覆盖 shell 形式命令使用的默认 shell。它可以是 Linux 上的\
  \ zsh、csh 或 tcsh，或 Windows 上的 PowerShell 等。该指令的语法是：\n\n```\nSHELL [\"executable\"\
  , \"parameters\"]\n```\n\n请注意，SHELL 只能接受 JSON 数组作为参数。SHELL 指令也可以用于修改 shell 的工作方式。例如，在\
  \ Windows 上使用 SHELL cmd /S /C /V:ON，可以修改默认 cmd shell 的行为（在这种情况下将是延迟环境变量扩展）。\n\n\
  SHELL 指令可以出现多次。每个 SHELL 指令都会覆盖之前的所有声明，但请注意，Dockerfile 中的每一行 SHELL 都会在生成的镜像中产生一个新的层。\n\
  \n现在我们已经介绍了所有 Dockerfile 指令以及在创建镜像中的作用。让我们现在关注镜像构建的过程。\n\n\n\n## 使用 Dockerfile\n\
  \n现在我们已经了解了 Dockerfile 中除其他以外的每条指令的作用，可以准备我们的第一个 Dockerfile。如前所述，它只是一个纯文本文件。创建 Dockerfile\
  \ 并添加所有指令后，您可以使用 docker build 命令来构建镜像。该命令的格式为：\n\n```\ndocker build [OPTIONS] <PATH\
  \ or URL> | -\n```\n\ndocker build 命令接受一些参数和选项，您可以使用 -help 开关显示其简短说明，就像其他任何 Docker\
  \ 命令一样：\n\n```\ndocker build -help\n```\n\n例如，您可以通过指定 CPU 和内存设置或关闭缓存来调整构建过程。您还可以使用\
  \ -t 选项在构建后为新仓库打标签，例如：\n\n```\ndocker build -t jarek/myapp .\n```\n\n要同时将镜像标记到多个仓库，您还可以添加多个\
  \ -t 参数：\n\n```\ndocker build -t jarek/myapp:1.0.0 -t jarek/myapp:latest .\n```\n\
  \n与 CPU 和内存调整相关的默认参数集应该是一个足够好的起点，因此您可以在开始时省略它们。\n\ndocker build 命令从 Dockerfile 和上下文构建镜像。构建的上下文是\
  \ PATH 或 URL 下指定位置的文件。PATH 是本地文件系统上的目录，而 URL 是 Git 仓库的位置。它是递归工作的，因此 PATH 包含任何子目录，而\
  \ URL 包含仓库及其子模块。如果您从实际 Dockerfile 所在的目录运行构建命令，请将 PATH 参数仅用作点。然后 docker build 的最简单形式，以当前目录作为构建上下文为：\n\
  \n```\ndocker build\n```\n\n构建由 Docker 守护进程运行。首先，整个上下文将作为一个整体包发送到守护进程。这就是为什么在指定构建上下文时应谨慎的原因。您可以在启动构建后立即观察推送到守护进程的上下文大小：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_164_0.png)\n\n![](img/0c87321919fa245e22f056c67ec70003_164_1.png)\n\
  \n最佳实践是以仅包含 Dockerfile 的目录作为上下文开始，并仅添加构建 Dockerfile 所需的文件。\n\n无论如何，您可以将 Dockerfile\
  \ 放在系统中的任何位置。要使用当前目录之外的文件构建镜像，您可以使用 -f 开关来执行 docker build 命令，例如：\n\n```\ndocker\
  \ build -f /usr/Jarek/myDockerfiles/Dockerfile .\n```\n\n在前面的示例中，Docker 将使用指定路径的\
  \ Dockerfile，但构建上下文将是当前目录，如点所指定。\n\n正如本章前面提到的，Dockerfile 中的指令，例如 COPY，如果源路径未以斜杠开头，将在构建上下文中查找文件。在现实生活中，docker\
  \ build 上下文将包含许多其他工作文件和目录，这些文件和目录永远不应包含在镜像中，例如临时文件、日志等。尽管如此，Docker 构建系统仍会将这些文件发送到守护进程。\n\
  \n为了提高构建性能并使镜像尽可能干净，您可以通过在上下文目录中添加 `.dockerignore` 文件来排除文件和目录。它类似于 `.gitignore`\
  \ 文件——`.dockerignore` 文件中包含的所有路径都将被简单忽略。指定要忽略的路径时，您可以使用标准通配符。考虑 `.dockerignore`\
  \ 文件的以下示例：\n\n```\n*/tmp*\n*/*/tmp*\n**/*.log\ntmp?\n```\n\n在前面的示例中，根目录的任何直接子目录中文件名和目录名以\
  \ `tmp` 开头。另外，根目录下两级子目录中以 `tmpf` 开头的文件和目录，以及根目录中名称为 `tmp` 的一字符扩展名（如 `tmp1` 或 `tmp2`）的文件和目录也将被忽略。也可以使用\
  \ `**/*` 形式的特殊映射——它匹配任意数量的目录（包括零）。例如，`**/*.log` 将排除所有目录中找到的日志文件。您可以排除某些文件，使其不被匹配为忽略。考虑以下示例：\n\
  \n```\n*.log\n!important.log\n```\n\n前面的示例将匹配所有日志文件，除了 `important.log` 文件。进行排除时，请注意\
  \ `.dockerignore` 文件中行的顺序很重要。如果您排除一个文件，然后在该排除之后声明类似的匹配，则它将不会被排除。\n\n使用 `.dockerignore`\
  \ 可以得到更干净的镜像。自定义构建过程还有另一种方法。正如我们之前提到的，使用 `ENV` 指令声明的环境变量可以在 Dockerfile 指令中使用，例如\
  \ `ADD`、`COPY`、`ENV`、`EXPOSE`、`LABEL`、`USER`、`WORKDIR`、`VOLUME`、`STOPSIGNAL` 或 `ONBUILD`。\n\
  \n如果构建命令被成功解析和处理，将生成一个新镜像，您可以使用 `docker run` 启动它，就像从 Docker Hub 获取的任何其他镜像一样。执行 `docker\
  \ build` 命令后的输出将是新 Docker 镜像的 ID。如果您使用已知的命令 `docker images` 列出镜像，它也将存在，如以下屏幕截图所示：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_166_0.png)\n\n### 摘要\n\nDocker 提供了用于使用\
  \ Dockerfile 创建镜像的一套小巧但非常灵活的指令。我们说明了所有命令、其语法和用法技巧，以便有效地创建 Docker 镜像。指令具有相当简单的语法，并在官方\
  \ Docker 文档中有非常详细的记录。创建自己的镜像不会很棘手。然而，您需要遵循 Docker 推荐的一些最佳实践和指南。首先，您应该记住由您的镜像创建的容器应该是短暂的，即它们应该能够以绝对最小的配置停止、销毁和重新创建。镜像应尽可能干净，因此从空构建上下文开始，仅添加必要的内容并使用\
  \ .dockerignore 是一种可行的方法。此外，来自干净代码开发实践的 YAGNI（You ain't gonna need it，你不会需要它）原则在创建\
  \ Dockerfile 时具有非常重要的意义。\n\n保持在绝对最小，不要因为在容器中拥有它很不错就安装某些东西。始终牢记 Docker 使用的缓存机制，并尝试通过将相似命令合并为一条指令来最小化层数。目标应该是尽可能少、尽可能快地工作并且尽可能轻量。此外，如果可能，请考虑每个容器只运行一个进程——它更容易扩展并允许容器重用。如果一个服务依赖于另一个服务，它们应该在不同的但链接的容器中运行。\n\
  \n使用 Dockerfile 需要一些实践和实验，但以后会得到回报——当您能够快速创建和调整镜像时。在下一章中，我们将更专注于运行镜像。\n"
- "# 7\n\n## 7 运行容器\n\n在前几章中，我们学习了 Docker 架构、网络、持久存储和 Dockerfile 的结构。到目前为止，您应该能够创建自己的\
  \ Docker 镜像并开始使用它。实际上，我们已经多次运行容器，但没有深入细节；我们将在本章中这样做。本章我们将更专注于运行容器化软件。这将包括以下概念：\n\
  \n- 容器运行模式\n- 覆盖 `CMD` 和 `ENTRYPOINT`\n- 监控容器\n- 退出代码和重启策略\n- 资源运行时限制\n- Docker\
  \ Swarm 模式\n\n您将学习如何通过指定重启策略和运行时限制来设置容器在运行时表现良好。在 `Chapter 6, Creating Images` 中，我们已经讨论了\
  \ Dockerfile 的 `CMD` 和 `ENTRYPOINT` 命令。本章我们将重点介绍如何在容器启动期间覆盖它们，这次会详细说明。我们将学习如何读取容器日志，并将其输出不仅到文本文件，还输出到一些专门的日志工具，如\
  \ Splunk 或 Fluentd，以便进一步分析和处理。在本章结束时，我们将学习 Docker 的新功能——Swarm 模式，它允许您管理 Docker 容器的集群。\n\
  \n\n\n让我们回顾一下我们迄今为止学到的关于 Docker 的知识。Docker 在隔离的容器中运行进程。容器是在主机上运行的进程；不过，主机可能是本地的也可能是远程的。当你执行\
  \ `docker run` 命令时，运行的容器进程是隔离的，并且拥有自己独立的文件系统、网络栈以及与主机分离的隔离进程树。你使用 `docker run` 命令来运行镜像。请记住，每次\
  \ `docker run` 都会使用指定的镜像创建一个新容器，并在其中启动一个命令（Dockerfile 中指定的 `CMD` 或 `ENTRYPOINT`）。默认情况下，容器的文件系统是持久化的，即使容器关闭后也依然存在。如果反复运行短期前台进程，这些文件系统会迅速增大。解决方案是不要手动清理，而是告诉\
  \ Docker 在容器退出时自动清理容器并删除文件系统。你可以通过添加 `--rm` 标志来实现，这样进程结束后容器数据会自动删除。\n\n![](img/0c87321919fa245e22f056c67ec70003_169_0.png)\n\
  \n`--rm` 标志会使 Docker 在容器关闭后删除容器。\n\n例如，使用 run 命令，如以下示例所示：\n\n```\ndocker run --rm\
  \ -it Ubuntu /bin/bash\n```\n\n上述命令告诉 Docker 如果容器关闭则删除容器。\n\nDocker 非常灵活，因此 `docker\
  \ run` 命令有大量参数也就不足为奇了。它们很重要，我们将在后续章节中详细讲解。\n\n回顾一下基本的 `docker run` 语法：\n\n```\n\
  docker run [OPTIONS] IMAGE[:TAG|@DIGEST] [COMMAND] [ARG...]\n```\n\n`docker run`\
  \ 命令接受你想要运行的镜像；它附带许多可能有用的选项，例如运行时模式，即 detached 或 foreground，以及网络设置或对处理器和内存的运行时限制。当然，你可以在几乎不带任何参数的情况下执行\
  \ run 命令，只提供镜像名称。它会运行并采用镜像中的默认选项。Docker 允许你覆盖镜像作者指定的选项。\n\n启动 Docker 容器时，你可以决定是否以默认模式、在前台运行容器，或在所谓的\
  \ **分离** 模式下在后台运行。\n让我们解释一下它们的区别。\n\n## 运行时模式 – 分离与前台\n\n运行容器时，你可以选择在前台或 detached\
  \ 模式下运行。\n我们先从分离模式开始。\n\n### 分离\n\n你可以使用 -d 选项以分离模式启动 Docker 容器。容器启动并在后台运行。容器启动后，你可以使用控制台执行其他命令。Dockerfile\
  \ 一次只能启动一个进程。请注意，以分离模式启动的容器会在用于运行容器的根进程退出时退出。即使有从 Dockerfile 指令启动的后台进程在运行，理解这一点也很重要。Docker\
  \ 将在启动容器的命令结束时停止容器。换句话说，Docker 要求你的命令在前台持续运行；否则，它会认为你的应用程序停止并关闭容器。例如，如果容器中的默认命令是\
  \ `bash`，当你使用 `-d` 命令行选项在后台运行镜像时，shell 会立即退出，Docker 将停止容器。\n\n![](img/0c87321919fa245e22f056c67ec70003_170_0.png)\n\
  \n除非命令在前台运行，否则你的容器会立即停止。\n\n但对此有一个解决方案。你可以通过永远执行一个前台命令来“欺骗” Docker。使容器持续运行的技巧是保持主进程运行。请考虑以下示例：\n\
  \n```\ndocker run -d myImage tail -f /dev/null\n```\n\n在 `/dev/null` 上执行 `tail`\
  \ 命令会让主 bash shell 保持忙碌，从而不允许 Docker 关闭容器。\n\n在分离模式下，你可以使用 `docker logs` 命令显示 Docker\
  \ 容器的标准输出。你可以访问日志文件，因为容器内 `pid 1` 进程写入 `stdout` 的所有内容都会被捕获到 Docker 主机上的一个特殊历史文件中。要查看日志条目，请执行以下命令：\n\
  \n```\ndocker logs -f <container name>\n```\n\n我们稍后会介绍 Docker 日志。要保留对分离容器的控制，请使用\
  \ `docker attach` 命令。`docker attach` 的语法是：\n\n```\ndocker attach [OPTIONS] <container\
  \ ID or name>\n```\n\n如果想实时查看写入 `stdout` 流的内容，`docker attach` 命令会很有用。它基本上会将你的控制台重新连接到容器中运行的进程。换句话说，它会将\
  \ `stdout` 流式传输到你的屏幕，并将 `stdin` 映射到你的键盘，从而允许你输入命令并查看输出。要从进程分离，请使用默认的 Ctrl + P、Ctrl\
  \ + Q 键盘序列。\n\n### 前台\n\n前台模式是默认模式。它与分离模式相反，当你不指定 `-d` 选项时使用。在前台模式下，你用来执行 `docker\
  \ run` 的控制台将附加到标准输入、输出和错误流。实际上，默认情况下，Docker 会将所有标准流附加到你的控制台；这些流为 `STDIN`、`STDOUT`\
  \ 和 `STDERR`。你可以更改此默认行为，并在 `docker run` 命令中使用 `-a` 开关。作为 `-a` 开关的参数，你使用想要附加到控制台的流的名称。例如：\n\
  \n```\ndocker run -a stdin -a stdout -i -t centos /bin/bash\n```\n\n上述命令将同时把 `stdin`\
  \ 和 `stdout` 流附加到你的控制台。\n\n有 `-i` 或 `--interactive`（即使未附加也保持 STDIN 流打开）和 `-t` 或\
  \ `--tty`（用于附加伪 tty）开关，通常一起使用为 `-it`，你需要为容器中运行的进程分配一个伪 tty 控制台。它用于在容器启动后将命令行附加到容器。正如你可能从前几章中记得的，我们已经这样做过，当时我们在运行交互式\
  \ Ubuntu bash shell：\n\n```\ndocker run -it ubuntu\n```\n\n当你运行容器并希望稍后与之交互，例如更新限制时，你必须告诉\
  \ Docker 你要为其执行命令的镜像。镜像在 Docker 世界中可以通过几种方式标识。到目前为止，我们一直使用长或短 UUID 标识符来执行镜像。这里让我们看一些选项。\n\
  \n## 标识镜像和容器\n\n正如你从前几章中记得的，你想要运行的镜像可以简单地通过其名称标识，例如 Ubuntu。在这种情况下，Docker 默认会选择标记为\
  \ latest 的镜像。你也可以使用标签语法或摘要语法：\n\n```\nImage[:tag]\nImage[@digest]\n```\n\n例如，如果你想运行标记为\
  \ 14.04 版本的 Ubuntu，只需执行以下命令：\n\n```\ndocker run ubuntu:14.04\n```\n\n镜像可以包含一个称为摘要的标识符。摘要计算为镜像清单的\
  \ sha256 校验和，不包括签名部分。清单包括镜像的名称、其标签（latest）、架构、fsLayers（镜像各层列表，通过其摘要引用）、历史记录、模式版本和签名。你可以通过在\
  \ `docker images` 命令中指定 –digests 选项来列出摘要。摘要可与 `docker create`、`docker pull` 和 `docker\
  \ rmi` 命令以及 Dockerfile 中的 `FROM` 指令一起使用。此外，它还可用于 `docker run` 命令，以精确运行指定的镜像。摘要值可预测且可引用，允许你非常精确地选择镜像。\n\
  \n以下示例将运行使用摘要选择的 Ubuntu 镜像：\n\n```\ndocker run -it ubuntu@sha256:1ffcb21397aa4012a9d88cff8582224ff06aa13ba2de2e9f96c9814bfda95e0\
  \ /bin/bash\n```\n\n\n\n容器可以通过三种方式识别：使用其名称或短 ID 或 UUID 标识符。标识符由 Docker daemon 生成。可能，最方便的选项是通过名称识别容器。记住一个友好的名称总比记住一个长字母数字标识符更容易。为容器定义名称会增加其含义，因此你一眼就能知道容器负责什么。假设名称为\
  \ `myWildfly` —— 你就会知道该容器是你的应用服务器。将 `abbb3434aa43` 作为容器标识符并不会让人清楚。要为 `docker run`\
  \ 命令提供名称，请使用 `--name` 开关。如果你没有使用 `--name` 选项为容器提供名称，那么 Docker 会为你创建一个名称。我建议你始终为容器创建有意义的名称，因为这样会更容易记住它们。如果你指定了名称，你可以在\
  \ Docker 网络中引用容器时使用它。这适用于后台和前台 Docker 容器。\n\n![](img/0c87321919fa245e22f056c67ec70003_173_0.png)\n\
  \n当容器在默认 bridge 网络上运行时，它们必须通过名称链接才能通信。\n\nDocker 使用 PID 命名空间，从而为你提供监控容器内运行进程以及限制其数量的选项。\n\
  \n## PID settings\n\n要设置 PID 命名空间模式，你有三种设置容器 PID 命名空间模式的选项：\n\n- `--pid=\"\"`: 这将为容器设置\
  \ PID（进程）命名空间模式\n- `--pid=container`: 此 `<name | id>` 加入另一个容器的 PID 命名空间\n- `--pid=host`:\
  \ 这将在容器内部使用主机 PID 命名空间\n\n默认情况下，所有容器都启用了 PID 命名空间。PID 命名空间对于进程分离很有用。默认情况下，容器 PID\
  \ 与主机隔离，但你可以通过使用 `--pid host` 选项运行容器来更改此行为，容器 PID 将从主机可见。此外，你的容器将共享主机的进程命名空间。这意味着容器内的进程将看到主机上的所有进程。你可以使用\
  \ `--pid=container:id` 将要启动的容器加入另一个容器的 PID 命名空间。这可能有助于从另一个容器调试该容器；例如，你还可以轻松限制容器内运行的活动进程数量以防止\
  \ fork 炸弹。\n\nfork 炸弹（也称为 rabbit 病毒或 wabbit）是一种拒绝服务攻击，其中一个进程不断复制自身以耗尽可用系统资源，导致系统因资源使用而变慢或崩溃。要限制容器内的活动进程数量，请使用设置了\
  \ --pids-limit 值的 docker run 命令执行：\n\n```\ndocker run --pids-limit=64\n```\n\n使用\
  \ docker inspect 命令获取容器的当前 PID 很简单：\n\n```\ndocker inspect --format '{{.State.Pid}}'\
  \ <containerID or name>\n```\n\n另一方面，通过 PID 获取容器名称更棘手，但可行。为此，你需要使用一些 grep 操作，如以下示例所示：\n\
  \n```\ndocker ps -q | xargs docker inspect --format '{{.State.Pid}}, {{.ID}}' |\n\
  grep \"^${PID},\"\n```\n\n类似于某些程序将进程 ID 写入文件（你见过它们作为 PID 文件），Docker 可以将容器 ID 写入你选择的文件。要将进程\
  \ ID 写入文件，请使用 --cidfile 开关：\n\n```\n--cidfile=\"\"\n```\n\n除了 PID 命名空间之外，你还可以为容器设置\
  \ UTS 命名空间。\n\n## UTS settings\n\n正如你记得的，Docker 试图将容器与主机系统隔离。UTS 命名空间用于设置主机名和域，即在该命名空间中运行进程时可见的。UTS\
  \ 是 UNIX Timesharing System 的缩写。默认情况下，所有容器都启用了 UTS 命名空间。这意味着进程拥有主机名和（现在大多未使用）NIS\
  \ 域名名的单独副本，因此可以将其设置为其他值而不影响系统的其余部分。\n\n主机名通过 sethostname 设置，是 uname 返回的结构中的 nodename\
  \ 成员。NIS 域名由 setdomainname 设置，是 uname 返回的结构中的 domainname 成员。\n\n在 Docker 中设置 UTS\
  \ 命名空间的语法与 --pid 语法非常相似，你只需使用 --uts 而不是 --pid。要为容器设置 UTS 命名空间，请使用 --uts=\"value\"\
  \ 开关。你也可以使用 --uts=host 在容器内绑定主机的 UTS 命名空间。\n\n现在我们知道了如何识别容器，我们想要运行并设置它们的命名空间。让我们学习如何覆盖镜像\
  \ Dockerfile 中提供的默认命令。我们在前几章中已经做过，但没有深入细节。现在让我们再做一次。\n\n## Overriding default commands\
  \ from Dockerfile\n\n正如你从第 6 章《创建镜像》中可以回忆起来的，当我们创建 Docker 镜像时，我们使用 CMD 指令或使用 ENTRYPOINT\
  \ 指令提供运行时执行的默认命令或选项。但如果没有通过提供不同于镜像作者提供的命令或参数来影响容器启动过程的可能性，在许多情况下就无法使用 Docker。镜像会相当静态，有时甚至毫无用处。幸运的是，Docker\
  \ 支持覆盖这些默认值，这一功能使其成为非常灵活的工具。正如你从上一章记得的，ENTRYPOINT 和 CMD 指令之间存在重要区别：ENTRYPOINT 定义了在容器中作为\
  \ PID 1 运行的进程，而 CMD 为其提供选项。如果在 Dockerfile 中未指定 ENTRYPOINT，但指定了 CMD，则 shell /bin/sh\
  \ -c 将是镜像的入口点。CMD 指令与 ENTRYPOINT 相同，可以在执行 docker run 命令时在命令行中指定，这使其成为修改容器行为的强大工具。因此，在本节中我们关注覆盖启动命令及其参数；让我们从\
  \ CMD 开始。\n\n## Overriding the CMD\n\n正如你从本章开头记得的，docker run 命令的语法包括 COMMAND 参数：\n\
  \n```\ndocker run [OPTIONS] IMAGE[:TAG|@DIGEST] [COMMAND] [ARG...]\n```\n\nCOMMAND\
  \ 参数不是必需的，因为镜像作者可能已在镜像的 Dockerfile 中使用 CMD 指令提供了默认 COMMAND。这通常经常是这种情况。\n\nCMD 指令应在\
  \ Dockerfile 中仅使用一次来运行镜像中包含的软件。它通常是 Dockerfile 中的最后一个命令，但当从此类镜像启动容器时，我们只需将自己的命令或参数作为\
  \ docker run 的 COMMAND 参数提供，即可覆盖 CMD 指令。docker run 命令中出现在镜像名称之后的所有内容都会传递给容器并被视为\
  \ CMD 参数。结果是，如果镜像还指定了 ENTRYPOINT，则 CMD 或 COMMAND 会作为参数附加到 ENTRYPOINT。但猜猜看，我们也可以覆盖\
  \ ENTRYPOINT。\n\n## Overriding the ENTRYPOINT\n\n每个 Docker 镜像都有一个入口点。它可以是默认的，也可以是由\
  \ ENTRYPOINT 指令指定的，它是运行时要执行的默认命令；它指定容器启动时运行什么可执行文件，但更难覆盖。ENTRYPOINT 使运行中的容器更像是一个要执行的完整命令，它从\
  \ COMMAND 值获取参数。但有时在运行容器时，你可能想运行其他东西，因此你可以在运行时使用字符串覆盖默认 ENTRYPOINT 来指定新的 ENTRYPOINT。覆盖入口点的语法如下：\n\
  \n```\ndocker run -it --entrypoint /bin/bash Ubuntu\n```\n\n让我们看看 MongoDB Dockerfile，它定义了\
  \ ENTRYPOINT：\n\n```\nFROM dockerfile/ubuntu\nRUN mkdir -p /data/db /data/configdb\
  \ \\\n&&chown -R mongodb:mongodb /data/db /data/configdb\nVOLUME /data/db /data/configdb\n\
  COPY docker-entrypoint.sh /entrypoint.sh\nENTRYPOINT [\"/entrypoint.sh\"]\nEXPOSE\
  \ 27017\nCMD [\"mongod\"]\n```\n\n如你所见，定义了一个自定义入口点；它将是一个 entrypoint.sh shell 脚本。如果你现在运行此容器，容器的主进程将来自此脚本。我们可以使用以下命令覆盖此入口点：\n\
  \n```\ndocker run -it --entrypoint /bin/bash mongo\n```\n\n\n\n执行前面的命令后，Dockerfile\
  \ 中的 ENTRYPOINT 将被你在 docker run 命令期间提供的那个覆盖。当然，在这种情况下 MongoDB 不会启动进程（你会看到 bash 提示符），但这可以让你了解如何影响默认的容器行为，有时执行与镜像作者意图完全不同的操作。\n\
  \n除在容器启动期间覆盖 Dockerfile 中的 CMD 或 ENTRYPOINT 外，还有另一种值得提及的执行命令方式。那就是 docker exec 命令。\n\
  \n## 执行 exec 中的任意命令\n\n它可能是使用 Docker 镜像时最强大的全能工具。exec 命令允许你在运行中的容器内执行任意命令。\n\n与覆盖\
  \ CMD 或 ENTRYPOINT 相比，使用 docker exec 启动的命令只会在容器的主进程（PID 1）运行期间执行。\n\n![](img/0c87321919fa245e22f056c67ec70003_177_0.png)\n\
  \n如果容器处于暂停状态，则 docker exec 命令将报错失败。\n\n此外，exec 命令的语法不同。它不是 docker run 命令的一部分，而是一个新的独立命令，在你使用\
  \ docker run 运行容器后执行。请考虑以下示例，并在一个 shell 终端中运行以下命令：\n\n```\ndocker run -it ubuntu\
  \ bash --name myUbuntuBash\n```\n\n然后在第二个 shell 终端窗口中运行下一个命令：\n\n```\ndocker exec\
  \ -d myUbuntuBash touch /tmp/myFile\n```\n\n在前面的示例中，第一个命令将从 Ubuntu 容器启动交互式 bash\
  \ shell，这没什么新意；然而，第二个命令 docker exec 将实际在运行中的容器内执行 touch shell 命令。\n\n`docker exec`\
  \ 与我们在学习分离容器时已经提到过的 `docker attach` 命令可能会有点混淆。值得注意的是，`docker attach` 并不是用于在容器中运行额外内容，它用于附加到正在运行的进程。此外，如果主进程是\
  \ shell，那么我们可以使用 attach 运行新进程。另一方面，`docker exec` 专为在已启动的容器中运行新内容而设计。当然，它也可以是 shell\
  \ 或其他进程，如以下截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_178_0.png)\n\n我们现在知道如何以前台或后台方式运行容器；我们知道如何覆盖默认启动进程或如何在运行中的容器中执行自定义命令。现在是时候查看运行中的容器并监控它们的表现如何；或者说表现有多差。\n\
  \n## 监控容器\n\n有几种监控运行中的 Docker 容器的方法。它们包括查看日志文件、查看容器事件和统计信息，以及检查容器属性。让我们从日志开始。Docker\
  \ 具有强大的日志功能。访问日志条目至关重要，特别是当你的容器以分离运行时模式运行时。让我们看看 Docker 在日志机制方面能提供什么。\n\n### 查看日志\n\
  \n大多数应用程序将其日志条目输出到标准 stdout 流（通常你在运行应用程序时只是在控制台中看到它）。然而，在 Docker 的分离模式下运行，我们在控制台看不到任何内容，因为容器在后台运行。要查看容器中的日志条目，请执行以下命令：\n\
  \n```\ndocker logs -f <container name>\n```\n\n-f 标志的作用与 Linux tail 命令中的相同标志一样；它会持续在控制台上显示新的日志条目。完成后，按\
  \ ctrl-c 停止在控制台上显示日志文件。\n\n即使容器停止后，只要其文件系统仍存在于磁盘上（当然直到使用 docker rm 命令将其删除），日志文件仍然可用。数据存储在位于\
  \ /var/lib/docker 目录的 JSON 文件中。你可以使用 docker inspect 命令并使用模板提取 LogPath 来查看日志文件的完整路径（我们稍后会介绍\
  \ inspect 和模板）：\n\n```\ndocker inspect -f {{.LogPath}} 351c05e5ca22\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_179_0.png)\n\
  \nDocker 利用日志驱动的概念来存储容器日志条目。默认驱动是 json-file 驱动，它只是将 JSON 条目写入文件。它可以接受一些调整参数，例如：\n\
  \n```\n--log-opt max-size=[0-9+][k|m|g]\n--log-opt max-file=[0-9+]\n```\n\n`max-size`\
  \ 指定可以创建的最大文件大小。Docker 在达到指定大小时会创建新文件。你可以使用大小后缀 k、m 或 g，其中 k 表示千字节，m 表示兆字节，g 表示千兆字节。如果未提供\
  \ `max-size`，Docker 会将所有日志输出写入单个文件，如果你需要下载、上传或搜索日志文件等，这就不是很方便。`max-file` 选项指定在丢弃之前日志轮转的最大文件数。请注意，如果未设置\
  \ `max-size`，`max-file` 选项将被忽略。\n\n![](img/0c87321919fa245e22f056c67ec70003_180_0.png)\n\
  \n`docker logs` 命令仅显示来自最新日志文件的日志条目。\n\n然而，`json-file` 驱动并不是唯一可用的日志驱动实现。实际上，有几种实现可供选择：\n\
  \n- `none`: 它将完全关闭日志记录\n- `syslog`: 它是 Docker 的 `syslog` 日志驱动，将日志消息写入系统 `syslog`。\n\
  - `journald`: 它会将消息记录到 `journald`。`systemd-journald` 是一个负责事件日志记录的守护进程，其日志文件为仅追加的二进制文件。\n\
  \n除此之外，还有一些更专业的驱动可供选择：\n\n- `splunk`: 这提供了使用 **Event Http Collector** 将日志消息写入 Splunk。Splunk\
  \ 可用作 `enterprise-grade` 日志分析器。你可以在 https://www.splunk.com 了解更多信息。\n- `gelf`: 这会将日志条目写入类似\
  \ Graylog 或 Logstash 的 GELF 端点。Graylog 可在 https://www.graylog.org 获取，是一款开源日志管理，支持在所有日志文件中进行搜索、分析和告警。Logstash\
  \ 可在 https://www.elastic.co/products/logstash 找到，是处理任何数据源的管道。\n- `fluentd`: 这会将日志消息写入\
  \ fluentd。Fluentd 是一个用于统一日志层的开源数据收集器。Fluentd 的主要特性是它通过提供中间的统一日志层来分离数据源和后端系统。它小巧、快速，并且有数百个插件，使其成为非常灵活的解决方案。你可以在其网站\
  \ https://www.fluentd.org 上阅读更多信息。\n\n- `gcplogs`: 这会将日志条目发送到 Google Cloud Logging\n\
  - `awslogs`: 此驱动会将日志消息写入 Amazon CloudWatch Logs。\n\n正如你所见，Docker 的可插拔架构再次为你运行容器提供了几乎无限的灵活性。要切换到其他日志驱动，请为\
  \ `docker run` 命令使用 `--log-driver` 开关，例如：\n\n```\ndocker run --log-driver=syslog\
  \ ubuntu\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_181_0.png)\n\n`docker\
  \ logs` 命令仅适用于 `json-file` 和 `journal` 日志驱动。要访问写入其他日志引擎的日志，你需要使用日志解决方案提供商提供的工具，例如\
  \ Splunk。\n\n除了使用 `docker logs` 命令外，查看控制台输出的另一种方法是使用本章前面学到的 attach 命令；将其附加到运行中的容器，以查看其控制台输出。\n\
  \n### 容器事件\n\n要获取服务器的实时事件，我们使用 `docker events` 命令。当容器运行时发生某些变化时，例如 `stop`、`pause`\
  \ 或 `kill`，容器会存储并发布该情况的事件。如果想知道容器运行时发生了什么，这非常有用；这是一个强大的监控功能。Docker 容器报告了大量事件，你可以使用\
  \ `docker events` 命令列出它们：\n\n```\nattach, commit, copy, create, destroy, detach,\
  \ die, exec_create,\nexec_detach, exec_start, export, health_status, kill, oom,\
  \ pause, rename,\nresize, restart, start, stop, top, unpause, update\n```\n\n`docker\
  \ events` 命令可以接受 `-f` 开关，如果你正在寻找特定内容，它将过滤输出（默认情况下过滤器为空，因此它将返回所有事件）。目前，可能的过滤器列表包括：\n\
  \n- `container` (`container=<name or id>`)\n\n\n\n- 事件 (event=<event action>)\n\
  - 镜像 (image=<tag or id>)\n- 插件（实验性） (plugin=<name or id>)\n- 标签 (label=<key> or\
  \ label=<key>=<value>)\n- 类型 (type=<container or image or volume or network or daemon>)\n\
  - 卷 (volume=<name or id>)\n- 网络 (network=<name or id>)\n- 守护进程 (daemon=<name or\
  \ id>)\n\ndocker events 命令可以接受 --since 和 --until 开关，用于指定要获取事件的时间范围。Docker 支持常见的\
  \ RFC3339 日期和时间格式，例如\n2016-09-10T05:10:00, 2016-09-10T05:05:00.99999999, 2016-09-10Z07:00,\
  \ and\n2016-09-10.\n\n默认情况下，docker events 会将事件流式传输到控制台，类似于 tail -f 命令。正如以下截图所示，示例输出将包含事件的时间戳、容器\
  \ ID，以及当然是发生的事件本身：\n\n![](img/0c87321919fa245e22f056c67ec70003_182_0.png)\n\n##\
  \ 检查容器\n\n我们现在一直大量使用 docker ps 命令。它可以提供有关正在运行容器的许多有用信息，例如其 ID、状态、执行的命令、暴露的端口等等。还有另一个命令\
  \ docker inspect，也可以提供有关容器的一些有用信息。docker inspect 命令的语法如下：\n\n```\ndocker inspect\
  \ [OPTIONS] CONTAINER|IMAGE|TASK [CONTAINER|IMAGE|TASK...]\n```\n\n默认情况下，inspect\
  \ 命令会以 JSON 数组格式输出有关容器或镜像的信息。你可以使用 --format 或简写 -f 作为命令的开关来提供用于处理输出的模板。docker inspect\
  \ 命令接受 Go 模板。inspect 命令最简单的用例只是提供简短的模板来提取所需的信息，例如：\n\n```\ndocker inspect -f '{{.State.ExitCode}}'\
  \ jboss/wildfly\n```\n\n由于 inspect 命令接受提供的 Go 模板来形成容器或镜像元数据的输出，此功能为您提供了几乎无限的处理和转换结果的可能性。Go\
  \ 模板引擎功能强大，因此与其将输出通过 grep 管道传输（快速但混乱），你可以使用模板引擎进一步处理结果。\n\n--format 的参数只是一个我们想要应用于容器元数据的模板。在此模板中，我们可以使用条件语句、循环和其他\
  \ Go 语言特性。例如，要查找所有退出代码不为零的容器的名称：\n\n```\ndocker inspect -f '{{if ne 0.0 .State.ExitCode\
  \ }}{{.Name}} {{.State.ExitCode}}{{ end }}' $(docker ps -aq)\n```\n\n请注意，我们提供 $(docker\
  \ ps -aq) 而不是容器 ID 或名称。结果，所有正在运行的容器 ID 将被管道传输到 docker inspect 命令，这可以是一个非常方便的快捷方式。大括号\
  \ {{ }} 表示 Go 模板指令，括号外的任何内容都将原样打印出来。Go 模板中的点 (.) 表示上下文。大多数情况下，当前上下文将是元数据的完整数据结构，但在需要时可以重新绑定，包括使用\
  \ with 操作。例如，以下两个 inspect 命令将打印出完全相同的结果：\n\n```\ndocker inspect -f '{{.State.ExitCode}}'\
  \ wildfly\ndocker inspect -f '{{with .State}} {{.ExitCode}} {{end}}' wildfly\n```\n\
  \n如果你在绑定的上下文中，美元符号 ($) 总是可以带你回到根上下文。执行以下命令：\n\n```\ndocker inspect -f '{{with .State}}\
  \ {{$.Name}} exited with {{.ExitCode}} exit code \\ {{end}}' wildfly\n```\n\n这将输出:\n\
  \n/wildfly exited with 0 exit code.\n\n模板引擎支持逻辑函数，例如 and、or 和 not ——它们将返回布尔结果。还支持比较函数，例如\
  \ eq（等于）、ne（不等于）、lt（小于）、le（小于或等于）、gt（大于）、ge（大于或等于）。比较函数可以比较字符串、浮点数或整数。所有这些与条件函数（如\
  \ if）结合使用时，在创建 inspect 命令的更复杂的输出时非常有用：\n\n```\ndocker inspect -f '{{if eq .State.ExitCode\
  \ 0.0}} \\\nNormal Exit \\\n{{else if eq .State.ExitCode 1.0}} \\\nNot a Normal\
  \ Exit \\\n{{else}} \\\nStill Not a Normal Exit \\\n{{end}}' wildfly\n```\n\n有时\
  \ docker inspect 命令的巨大输出可能会令人困惑。由于输出采用 JSON 格式，可以使用 jq-tool 来概览输出并挑选有趣的部分。\n\njq-tools\
  \ 可在 https://stedolan.github.io/jq/ 免费获取。它是一个轻量级且灵活的命令行 JSON 处理器，类似于 JSON 数据的 sed\
  \ 命令。例如，让我们从元数据中提取容器 IP 地址：\n\n```\ndocker inspect <containerID> | jq -r '.[0].NetworkSettings.IPAddress'\n\
  ```\n\n正如你所见，docker inspect 命令提供了有关 Docker 容器的有用信息。结合 Go 模板功能，以及可选的 jq 工具，它为你提供了获取容器信息的强大工具，并且可以在脚本中进一步使用。但除了元数据之外，还有另一个有价值的信息来源。它是运行时统计信息，我们现在将重点关注它。\n\
  \n## 统计信息\n\n要查看正在运行容器的运行时统计信息，请使用 docker stats 命令。测量的统计信息包括 CPU、内存和网络 I/O 使用情况。\n\
  \ndocker stats 命令的语法如下：\n\n```\ndocker stats [OPTIONS] [CONTAINER...]\n```\n\n选项可以包括\
  \ `--no-stream`，它将禁用流式统计信息并仅提取第一个结果，以及 `--all`（或简写 `-a`），它将显示所有容器，默认情况下命令仅显示正在运行容器的统计信息。\n\
  \n命令的最简单形式就是 `docker stats`。它将列出所有正在运行容器的所有统计信息。你可以通过指定容器 ID 或名称的列表，用空格分隔，来将返回的数据限制为一个或多个特定容器：\n\
  \n```\ndocker stats b4fd15acfcb1 d15acb4ffcbb\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_185_0.png)\n\
  \n查看日志、容器事件和运行时统计信息在监控正在运行的容器时为你提供了几乎无限的可能性。但是我们如何确保容器能够持续运行，比如在生产服务器上？Docker 容器退出代码和重启策略来救援。\n\
  \n## 容器退出代码和重启策略\n\n你可以使用 `docker run` 命令中的 `--restart` 开关指定所谓的 **重启策略**。重启策略告诉\
  \ Docker 在容器关闭时如何行为。它可以被重启以最小化停机时间，例如在生产服务器上运行。然而，在解释 Docker 重启策略之前，让我们先关注退出代码。退出代码是关键信息，它说明容器为何运行失败或为何退出。有时它与你作为参数传递给\
  \ `docker run` 的包含命令有关。\n\n当 `docker run` 命令以非零代码结束时，退出代码遵循 `chroot` 标准，如以下示例所示：\n\
  \n- 退出代码 125：`docker run` 命令本身失败\n- 退出代码 126：提供的命令无法调用\n- 退出代码 127：提供的命令无法找到\n-\
  \ 其他、非零、应用程序相关的退出代码。\n\n正如你所回忆的，在之前的章节中我们一直使用 `docker ps` 命令来列出正在运行的容器。要同时列出未运行的容器，我们可以为\
  \ `docker ps` 命令添加 `-a` 开关。当容器完成时，退出代码可以在 `docker ps -a` 命令的输出中的状态列中找到，如此截图所示：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_186_0.png)\n\n通过在启动容器时指定重启策略，可以自动重启崩溃的容器。指定期望的重启策略是通过\
  \ `docker run` 命令的 restart 开关完成的，如示例所示：\n\n```\ndocker run --restart=always mongo\n\
  ```\n\n目前 Docker 有四种重启策略。让我们现在一个一个地了解它们，从最简单的开始：无。\n\n\n\n## no\n\n**无** 策略是默认的重启策略，并且在任何情况下都不会重启容器。实际上你不需要指定此策略，因为这是默认行为。除非你有一些可配置的设置来运行\
  \ Docker 容器，那么 *无* 策略可以用作 *关闭* 开关。\n\n## always\n\n如果我们希望容器无论命令的退出代码为何都将被重启，我们可以使用\
  \ always 重启策略。基本上，它名副其实——Docker 将在每种情况下都重启容器。重启策略将始终重启容器。即使容器在重启前已被停止也是如此。每当 Docker\
  \ 服务重启时，使用 always 策略的容器也将被重启，无论它们是否正在执行。\n\n![](img/0c87321919fa245e22f056c67ec70003_187_0.png)\n\
  \n使用重启策略，Docker 守护进程将始终尝试无限期地重启容器。\n\n## on-failure\n\n这是一个特殊的重启策略，可能也是使用最频繁的一个。使用\
  \ `on-failure` 重启策略，你可以指示 Docker 在容器以非零退出状态退出时重启它，而在其他情况下不重启。这就是我们开始用退出代码来解释重启策略的原因。你可以可选地提供\
  \ Docker 尝试重启容器的次数。此重启策略的语法也有点不同，因为使用此策略时，你还可以指定 Docker 自动重启容器的最大尝试次数。\n\n请考虑以下示例：\n\
  \n```\ndocker run --restart=on-failure:5 mongo\n```\n\n前面的命令将运行 MongoDB 镜像，并在失败时尝试重启五次然后放弃。使用\
  \ on-failure 重启策略的主要好处是，当应用程序以成功的退出代码退出（这意味着应用程序中没有错误，它只是执行完毕）时，容器不会被重启。容器的重启尝试次数可以通过\
  \ docker inspect 命令获得。例如，要获取具有特定 ID 或名称的容器的重启次数：\n\n```\ndocker inspect -f \"{{\
  \ .RestartCount }}\" <ContainerID>\n```\n\n你也可以获取容器最近一次重新启动的时间：\n\n```\ndocker inspect\
  \ -f \"{{ .State.StartedAt }}\" <ContainerID>\n```\n\n你应该知道 Docker 在重启容器之间使用延迟，以防止类似洪水的保护。这是一个递增的延迟，它从\
  \ 100 毫秒开始，然后 Docker 会将之前的延迟加倍。实际上，守护进程将等待 100 ms，然后 200 ms，400ms，800ms，依此类推，直到达到\
  \ on-failure 限制或你使用 docker stop 停止容器或通过执行 docker rm -f 命令强制删除容器。\n\n![](img/0c87321919fa245e22f056c67ec70003_188_0.png)\n\
  \n如果容器成功重启，延迟将重置为默认值 100 毫秒。\n\n## unless-stopped\n\n同样，如果我们希望容器无论退出代码如何都被重启，可以使用\
  \ unless-stopped。unless-stopped 重启策略与 always 作用相同，只有一个例外，它将无论退出状态如何都重启容器，但在守护进程启动时，如果容器之前已被置于停止状态，则不会启动它。这意味着使用\
  \ unless-stopped 重启策略，如果容器在重启前正在运行，系统重启后容器将被重启。当 Docker 容器内的应用程序退出时，该容器将被停止。如果容器内运行的应用程序崩溃，容器会停止，并且该容器将保持停止状态，直到有人或某物重启它。\n\
  \n在将重启策略应用于容器之前，考虑容器将用于执行何种工作是很有益的。这也取决于将在容器上运行的软件类型。例如，数据库可能应应用 always 或 unless-stopped\
  \ 策略。如果你的容器应用了某种重启策略，使用 docker ps 命令列出容器时，它将显示为 Restarting 或 Up 状态。\n\n## Updating\
  \ a restart policy on a running container\n\n有时在容器已经启动后，需要更新 Docker 运行时参数，例如即时更新。一个示例情况是，如果你想防止容器在\
  \ Docker 主机上消耗过多资源。要在运行时设置策略，我们可以使用 docker update 命令。除了其他运行时参数（例如内存或 CPU 限制，关于这些我们将在本章稍后讲述）之外，docker\
  \ update 命令使你能够在运行中的容器上更新重启策略。语法很简单，你只需要提供你希望容器拥有的新重启策略以及容器的 ID 或名称：\n\n```\ndocker\
  \ update --restart=always <CONTAINER_ID or NAME>\n```\n\n在容器上运行 docker update 命令后，新重启策略会立即生效。另一方面，如果你在已停止的容器上执行\
  \ update 命令，该策略将在稍后启动容器时使用。可能的选项与启动容器时可以指定的选项完全相同：\n\n- no（默认）\n- always\n- on-failure\n\
  - unless-stopped\n\n![](img/0c87321919fa245e22f056c67ec70003_189_0.png)\n\n如果 Docker\
  \ 主机上运行了多个容器，并且你想同时为它们全部指定新的重启策略，只需提供它们的所有 ID 或名称，用空格分隔即可。\n\n你也可以使用上一节中已知的 docker\
  \ events 命令查看应用了什么重启策略。可以用于观察容器报告的运行时事件历史记录的 docker events 也会报告 docker update 事件，提供有关更改的详细信息。\n\
  \n## Running Containers\n\n如果容器已应用重启策略，该事件将出现在历史记录中，如以下截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_190_0.png)\n\
  \n如果你想检查运行中容器的重启策略，请使用 docker inspect 并提供容器 ID 或名称，并将 --format 参数设置为值的路径：\n\n```\n\
  docker inspect --format '{{ .HostConfig.RestartPolicy.Name }}' <ContainerID>\n```\n\
  \n前面的命令将简单地显示当前应用的重启策略，如截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_190_1.png)\n\
  \n按容器设置重启策略的能力对于镜像自包含且不需要执行更复杂编排任务的情况非常有用。重启策略不是可以在运行容器上更改的唯一参数。为了确保容器在 Docker 主机上运行时表现良好，你可以对其施加限制。我们现在将介绍它们。\n\
  \n## Runtime constraints on resources\n\n在运行时限制 Docker 容器对资源的占用可能是有用的。Docker 为你提供了许多设置内存、CPU\
  \ 使用量或磁盘访问使用量限制的可能性。让我们从设置内存限制开始。\n\n### Memory\n\n值得知道的是，默认情况下，即如果你使用没有任何限制的默认设置，运行中的容器可以使用主机上的所有内存。要更改此行为，我们可以使用\
  \ docker run 命令的 --memory（或简写 -m）开关。它接受通常的后缀 k、m 或 g，分别表示千字节、兆字节和千兆字节。\n\n设置内存限制的\
  \ docker run 命令的语法如下：\n\n```\ndocker run -it -m 512m ubuntu\n```\n\n前面的命令将以容器最多可使用半千兆字节的内存执行\
  \ Ubuntu 镜像。\n\n![](img/0c87321919fa245e22f056c67ec70003_191_0.png)\n\n如果你不设置容器可分配内存的限制，可能会导致随机问题，其中单个容器很容易使整个主机系统不稳定和/或无法使用。因此，在容器上始终使用内存限制是一个明智的决定。\n\
  \n除了用户内存限制之外，还有内存保留和内核内存限制。让我们解释一下内存保留限制是什么。在正常工作条件下，运行中的容器可以使用并可能将使用所需内存，直到你使用\
  \ docker run 命令的 --memory (-m) 开关设置的限制。当应用内存保留时，Docker 将检测到内存不足的情况，并尝试强制容器将其消耗限制在保留限制内。如果你未设置内存保留限制，它将与使用\
  \ -m 开关设置的硬内存限制相同。\n\n内存保留不是硬限制功能。没有保证限制不会被超过。内存保留功能将尝试确保内存将根据保留设置进行分配。\n\n请考虑以下示例：\n\
  \n```\ndocker run -it -m 1G --memory-reservation 500M ubuntu /bin/bash\n```\n\n\n\
  \n前面的命令将硬内存限制设置为 1GB，然后将内存预留设置为 0.5GB。在设置了这些限制后，当容器消耗的内存超过 500M 且小于 1G 时，Docker\
  \ 会尝试将容器内存缩小到 500M 以下。\n\n在下一个示例中，我们将设置内存预留，而不设置硬内存限制：\n\n```\ndocker run -it --memory-reservation\
  \ 1G ubuntu /bin/bash\n```\n\n在前面的示例中，容器启动时可以使用进程所需的任意多内存。--memory-reservation 开关的设置会防止容器长时间消耗过多内存，因为每次内存回收都会将容器的内存使用量缩小到预留中指定的大小。\n\
  \n内核内存与用户内存完全不同——主要区别在于内核内存不能交换到磁盘。它包括栈页、slab 页、套接字内存压力和 TCP 内存压力。你使用 --kernel-memory\
  \ 开关来设置内核内存限制以约束这类内存。与设置用户内存限制相同，只需提供带后缀的数字，如 k、m、g 分别表示千字节、兆字节或千兆字节——尽管以千字节设置可能非常罕见。\n\
  \n例如，每个进程都会占用一些栈页。通过限制内核内存，可以在内核内存使用过高时阻止新进程启动，并且由于主机无法将内核内存交换到磁盘，容器通过消耗过多内核内存可能会阻塞整个主机服务。\n\
  \n设置内核内存限制很简单。我们可以单独设置 --kernel-memory，而不使用 -m 限制总内存，如以下示例所示：\n\n```\ndocker run\
  \ -it --kernel-memory 100M ubuntu /bin/bash\n```\n\n在前面的示例中，容器中的进程可以根据需要获取内存，但只能消耗\
  \ 100M 内核内存。我们也可以设置硬内存限制，如以下命令所示：\n\n```\ndocker run -it -m 1G --kernel-memory 100M\
  \ ubuntu /bin/bash\n```\n\n在前面的示例中，我们同时设置了内存和内核内存，因此容器中的进程总共可以使用 1G 内存，而这 1G 中包含\
  \ 100M 的内核内存。\n\n与内存相关的另一个在运行容器时可能有用的限制是 swappiness 限制。我们通过在 `docker run` 命令中使用\
  \ `--memory-swappiness` 开关来应用该限制。当你想避免与内存交换相关的性能下降时，这会很有帮助。`--memory-swappiness`\
  \ 开关的参数是可以交换出去的匿名内存页的百分比，因此取值范围为 0 到 100。值为 0 会完全关闭匿名页交换。相反，值为 100 会将所有匿名页设为交换候选。例如：\n\
  \n```\ndocker run -it --memory-swappiness=0 ubuntu /bin/bash\n```\n\n在前面的命令中，我们为\
  \ `ubuntu` 容器完全关闭了交换。\n\n除了设置内存使用限制之外，你还可以指示 Docker 如何将处理器资源分配给它将要运行的容器。\n\n## 处理器\n\
  \n使用 `-c`（或等效的 `--cpu-shares`）作为 `docker run` 命令开关，可以指定容器可以分配的 CPU 份额值。默认情况下，每个新容器都有\
  \ 1024 份 CPU 份额，所有容器获得相同的 CPU 周期部分。通过相对于所有其他运行中容器的权重调整容器的 CPU 份额权重，可以改变此百分比。但请注意，你无法设置容器可以使用的精确处理器速度。这是一个相对权重，与实际处理器速度无关。事实上，没有办法精确地说容器应该只有使用主机处理器\
  \ 2GHz 的权利。\n\n![](img/0c87321919fa245e22f056c67ec70003_193_0.png)\n\n> CPU 份额只是一个数字——与\
  \ CPU 速度完全无关。\n\n如果我们启动两个容器并且两者都使用 100% CPU，处理器时间将在两个容器之间平均分配。原因在于两个容器具有相同数量的处理器份额。但如果你将一个容器的处理器份额限制为\
  \ 512，它将只获得一半的 CPU 时间。这并不意味着它只能使用一半的 CPU——该比例仅在运行 CPU 密集型进程时适用。如果另一个容器（具有 1024 份额）处于空闲状态——我们的容器将被允许使用\
  \ 100% 的处理器时间。实际的 CPU 时间量将取决于系统上运行的容器数量。通过具体示例更容易理解。\n\n考虑三个容器，其中一个（我们称之为 Container1）将\
  \ --cpu-shares 设置为 1024，另外两个（Container2 和 Container3）将 --cpu-shares 设置为 512。当三个容器中的进程都尝试使用全部\
  \ CPU 功率时，Container1 将获得 50% 的总 CPU 时间，因为与运行中的其他容器（Container2 和 Container3）的总和相比，它允许的\
  \ CPU 使用量为一半。如果我们再添加一个 --cpu-shares 为 1024 的第四个容器（Container4），我们的第一个 Container1\
  \ 将只获得 33% 的 CPU，因为它现在相对而言拥有三分之一的总 CPU 功率分配。Container2 将获得 16.5%，Container3 也为 16.5%，最后一个\
  \ Container4 再次将被允许使用 33% 的 CPU。\n\n虽然 `docker run` 命令的 -c 或 --cpu-shares 标志会相对于所有其他运行中容器的权重修改容器的\
  \ CPU 份额权重，但它不会限制容器从主机使用 CPU。但还有另一个标志可以限制容器的 CPU 使用：--cpu-quota。其默认值是 100000，这意味着允许使用\
  \ 100% 的 CPU。我们可以使用 --cpu-quota 来限制 CPU 使用，例如：\n\n```\ndocker run -it --cpu-quota=50000\
  \ ubuntu /bin/bash\n```\n\n在前面的命令中，容器的限制将为 50% 的 CPU 资源。--cpu-quota 通常与 `docker\
  \ run` 的 --cpu-period 标志一起使用。这是 CPU CFS（完全公平调度程序）周期的设置。默认周期值为 100000，即 100 毫秒。看一下示例：\n\
  \n```\ndocker run -it --cpu-quota=25000 --cpu-period=50000 ubuntu /bin/bash\n```\n\
  \n这意味着容器每 50ms 可以获得 50% 的 CPU 使用率。\n\n限制 CPU 份额和使用率并不是我们可以在容器上设置的唯一与处理器相关的限制。我们还可以将容器的进程分配到特定的处理器或处理器核心。`docker\
  \ run` 命令的 --cpuset 开关在我们想要执行此操作时非常有用。考虑以下示例：\n\n```\ndocker run -it --cpuset 4\
  \ ubuntu\n```\n\n前面的命令将运行 ubuntu 镜像并允许容器使用全部四个处理器核心。要启动容器并仅允许在一个处理器核心上使用，可以将 --cpuset\
  \ 值更改为 1：\n\n```\ndocker run -it --cpuset 1 ubuntu\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_195_0.png)\n\
  \n你当然可以混合使用 --cpuset 选项和 --cpu-shares 来微调容器的 CPU 限制。\n\n## 运行中容器的约束更新\n\n与重启策略一样，约束也可以在容器已经运行时进行更新。这可能会有所帮助，如果你观察到你的容器消耗了太多\
  \ Docker 主机系统资源并且想要限制这种使用。同样，我们使用 docker update 命令来执行此操作。\n\n与重启策略相同，docker update\
  \ 命令的语法与启动容器时相同——你将期望的约束指定为 docker update 命令的参数，然后给出容器 ID（例如取自 docker ps 命令输出）或其名称。同样，如果你想同时更改多个容器的约束，只需提供用空格分隔的它们的\
  \ ID 或名称。让我们看一些在运行时更新约束的示例：\n\n```\ndocker update --cpu-shares 512 abbdef1231677\n\
  ```\n\n前面的命令将把 CPU 份额限制为 512。当然，你可以同时对多个容器应用 CPU 和内存限制：\n\n```\ndocker update --cpu-shares\
  \ 512 -m 500M abbdef1231677 dabdff1231678\n```\n\n上文将更新由 `abbdef1231677` 和 `dabdff1231678`\
  \ 标识的两个容器的 CPU 份额和内存限制。\n\n当然，在更新运行时限制时，你也可以在一个命令中同时应用所需的重启策略，如以下示例所示：\n\n```\n\
  docker update --restart=always -m 300M aabef1234716\n```\n\n正如你所见，设置限制的能力在运行 Docker\
  \ 容器时为你提供了很大的灵活性。但值得注意的是，并非总能应用限制。其原因在于限制设置功能高度依赖于 Docker 主机的内部实现，尤其是其内核。例如，有时无法设置内核内存限制或内存交换倾向，例如——有时你收到的只是\
  \ **你的内核不支持内核内存限制或你的内核不支持内存交换倾向功能** 消息。有时这些限制是可以配置的，有时则不行。例如，如果在 Ubuntu 上收到 **警告：你的内核不支持\
  \ cgroup 交换限制**，你可以借助 `cgroup_enable=memory swapaccount=1` 设置调整你的 Grub 启动加载器。务必阅读\
  \ Docker 输出的日志，以确保你的限制已生效。\n\n![](img/0c87321919fa245e22f056c67ec70003_196_0.png)\n\
  \n在容器启动期间或在动态更新限制后，务必注意 Docker 输出的警告——你的限制可能不会生效！\n\n到目前为止，我们了解了容器的运行时模式（前台和分离）。我们能够监控正在运行的容器并更新其重启策略和运行时限制。但在运行容器和扩展应用程序方面还有更多内容——Docker\
  \ Swarm 模式。在关于运行容器的章节中不可能忽略它，所以现在让我们来介绍它。\n\n## Docker Swarm 模式\n\n我们在第 4 章《网络和持久化存储》中简要提到了\
  \ Swarm 模式，当时我们学习多主机网络。这次，我们将更深入地了解 Docker 的容器集群功能。Swarm 模式是 Docker 中的一个相当新的功能——它在\
  \ Docker 1.12 及更高版本中可用。这意味着你只能在 Linux 上使用它，这很明显，但如果你在 Windows 或 Mac 上运行 Docker，可以使用原生的\
  \ Docker for Windows 或 Docker for Mac 应用程序。然而，Swarm 是什么？让我们解释一下为什么在最新版本的 Docker\
  \ 中包含 Swarm。\n\n## 目的\n\n在 Docker 容器中运行单个应用程序很容易。我们已经做过多次。但扩展和故障转移怎么办？想象一下，你有一个应用程序或服务，即使在高负载下也需要快速响应。如果单个容器无法处理负载，那么你可能希望运行多个容器。使用\
  \ Docker Swarm，你可以建立和管理一个 Docker 主机集群作为单一虚拟系统。通过启用集群，你基本上创建了一个协作的 Docker 主机组。如果其中一个失败并宕机，其他主机仍可以向用户提供应用程序。运行\
  \ Docker Swarm 集群时，你还可以根据负载变化随时添加或减少容器实例。最好的部分来了：我们不必决定在哪个主机上启动每个容器。这将由 Swarm 自动完成——在后台，以\
  \ swarm 模式运行的 Docker 会决定在哪些节点上启动它们。这看起来可能很复杂，但在实际操作中运行 Docker Swarm 与运行单个 Docker\
  \ 容器一样简单。如果你熟悉 Docker 命令，你也会熟悉 Docker Swarm 命令。让我们开始解释一些 Swarm 模式术语。\n\n## 术语\n\n\
  Docker Swarm 中有一些关键名称。我们需要理解它们的含义，以便轻松理解本章的其余部分以及外部资源。让我们逐一列出它们：\n\n- **Swarm：**\
  \ 这只是一个运行中的 Docker 容器集群。它是一个 Docker 主机池，行为有点像单个大型 Docker 主机。\n- **Swarm 管理器：** 这是在其上初始化了\
  \ Swarm 的 Docker 主机。管理器节点具有特殊用途：它维护集群状态、调度服务并提供 swarm 模式 HTTP API 端点。\n- **Node：**\
  \ 在 swarm 中运行的所有容器都称为 `nodes`——它们运行在所谓的 **swarm 模式** 中。要使容器以此模式运行，你需要初始化 swarm（这将创建一个新的\
  \ swarm）或将容器加入现有 Swarm。在 Docker 的 swarm 模式中，你可以在运行时部署管理器节点和工作节点。节点也可以通过使用 `docker\
  \ node promote` 命令提升为 Manager。\n- **Scheduling：** 这只是启动 Swarm 集群中容器的名称。目前，Docker\
  \ Swarm 实现了三种算法来帮助它决定在集群中的哪个节点上运行容器：spread、BinPack 和 random。spread 设置是默认值。Docker\
  \ 会根据每个节点可用的 CPU 和 RAM 资源来平衡容器。BinPack 调度器则完全相反——它会先将给定节点利用到最大容量，然后再在下一个节点上运行容器。Random，正如其名，就是随机调度。\n\
  - **Service：** 它是要在集群上运行的容器以及将在容器上执行的命令。\n\nDocker Engine 提供了一些用于处理 swarm 的命令。其中大多数与我们已知的命令非常相似——用于操作容器的命令。让我们连同其描述一起列出它们。\n\
  \n## Swarm 模式命令\n\n- `swarm init`：初始化 Swarm 并将当前 Docker 主机设为 Swarm 管理器。\n- `swarm\
  \ join`：将节点加入 Swarm。\n- `service create`：将服务（容器）调度到 Swarm。\n- `service inspect`：显示作为\
  \ Swarm 服务运行的容器的详细信息。\n- `service ls`：列出正在运行的服务。命令输出还将包含此特定服务正在运行的节点数量。\n- `service\
  \ rm`：删除服务。\n- `service scale`：添加给定服务的副本。你也可以同时扩展多个服务。\n- `service ps`：将列出服务的任务（即与容器一起运行的命令）。\n\
  - `service update`：允许你更新服务——你可以设置服务命令行参数、运行时限制，如 CPU 或内存、添加或修改环境变量等等。\n\n要初始化 Swarm（这也会使你当前所在的主机成为\
  \ Swarm 管理器），你需要执行 swarm init 命令：\n\n```\ndocker swarm init --advertise-addr <IP>\n\
  ```\n\n作为输出，Docker 会给你一个令牌，如果你想将另一个 Docker 主机连接到你的 Swarm，就需要使用它。你可以在以下截图中看到它：\n\n\
  ![](img/0c87321919fa245e22f056c67ec70003_199_0.png)\n\n要将节点连接到 Swarm，请执行 docker\
  \ swarm join 命令，其中包括从 docker swarm init 命令获得的令牌，例如：\n\n```\ndocker swarm join \\\
  \n  --token SWMTKN-1-5p7kzi2jbising1pew571s91jidy61biticftzbwmj5j4nfocg-6aieefd3frhl3ow3zppulc0bc\n\
  ```\n\n现在我们有一个简单的（两个节点）Docker Swarm。是时候安装（调度）一个服务了。将服务调度到 Docker Swarm 上运行与运行独立容器非常相似。你可以使用\
  \ docker service create 命令调度服务：\n\n```\ndocker service create --replicas 1 -p80:80\
  \ --name nginx nginx\n```\n\n## 运行容器\n\n在前面的例子中，我们将 nginx Web 服务器作为 Docker Swarm\
  \ 服务运行。我们用于处理容器的许多命令，例如 ps、ls、inspect——它们也适用于 docker service 命令，如以下截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_200_0.png)\n\
  \n服务相关命令模仿容器相关命令的方式使服务相关命令更容易记住。要扩展服务，即增加服务实例的数量，请执行 docker service scale 命令，例如：\n\
  \n```\ndocker service scale nginx=3\n```\n\n\n\n正如你所见，拥有 Docker Swarm 并没有看起来那么棘手。Docker\
  \ 集群实现的精妙之处在于其简单性。使用 swarm 模式，你可以使用 `init` 命令创建 swarm，并使用 `join` 命令将工作节点添加到集群中。就这样。创建和加入\
  \ swarm 的命令 literally 只需一两秒钟即可完成。\n\n## Summary\n\n你可能会有这样的印象，运行 Docker 容器时具有巨大的灵活性。而你是对的，确实我们可以做很多事情。我们可以覆盖镜像的\
  \ `RUN`、`CMD`、`ENTRYPOINT` 指令来更改容器运行行为，有时甚至可以根据需要完全更改容器的用途。Docker 提供了大量强大的命令来检查容器运行时状态，查看日志、事件和统计信息。它们无疑使\
  \ DevOps 的日常工作变得轻松得多。此外，设置容器的重启策略以及对 CPU 或内存的运行时限制，可以实现使用 Docker 容器的运行即忘方式。如果你需要应用程序能够轻松扩展，启动\
  \ Docker Swarm 就没有比这更简单的了。设置 Docker Swarm 既简单又直接且灵活。当然，集群的详细设置可能需要一些时间，但几秒钟内运行一个基本的\
  \ Docker 容器集群是可能的。\n\n现在我们已经知道如何创建镜像，如何在运行时运行和测试它们——是时候迈出下一步——向世界展示我们的工作了。在下一个 `Chapter\
  \ 8`，*Publishing Images*，我们将把镜像发布到 Docker Hub 并做一些更有趣的事情，比如为我们的镜像创建自动构建。\n"
- "# 8\n\n## 8 Publishing Images\n\n到目前为止，你已经学会了如何使用命令行在本地机器上运行 Docker，如何从现有镜像拉取镜像以构建容器，以及如何创建自己的镜像。在本章中，我们将学习如何在\
  \ Docker Hub 仓库中发布我们的镜像。我们还将介绍使用 Webhooks 进行镜像自动构建的过程。我们已经在第 5 章《Finding Images》中讨论了从仓库拉取镜像的过程。现在，相反，我们将发布我们的工作。正如你可能记得的，要做到这一点，你需要拥有一个\
  \ Docker Hub 账户。你可以参考第 5 章《Finding Images》中的说明，了解如何创建账户，如果你还没有创建的话。Docker Hub 服务对公共\
  \ Docker 镜像是免费的。一旦你创建了账户，你就可以推送之前创建的镜像，使其可供他人使用。在本章中，我们将涵盖以下主题：\n\n- 管理镜像标签并推送到远程仓库\n\
  - 集成 GitHub 和 Bitbucket\n- Webhooks 和自动构建\n\n让我们开始将我们的镜像发布到仓库。\n\n### Publishing\
  \ images\n\n在处理远程仓库上的镜像时，标签的概念非常重要。我们能够使用标签找到镜像并识别它们。如果你要发布自己的镜像，这也至关重要；你需要先为其打标签。让我们现在就做。\n\
  \n### Tagging\n\n我们使用 `docker tag` 命令为镜像打标签。你可以通过使用其 ID 或其名称来标识要标记的镜像。此外，你还可以使用其他标签来选择要标记的镜像。`docker\
  \ tag` 命令的语法如下：\n\n```\ndocker tag IMAGE[:TAG] IMAGE[:TAG]\n```\n\n例如，你需要执行以下命令将名为\
  \ `myHelloWorld` 且标签为 `test` 的本地镜像标记到 `myRepo` 仓库中，标签为 `version1.0.test`：\n\n```\n\
  docker tag myHelloWorld:test myRepo/myHelloWorld:version1.0.test\n```\n\n如果你现在运行\
  \ `docker images` 命令，你将看到你新标记的镜像。\n\n你的新标记镜像现在已准备好推送到远程仓库。标签的概念被 Docker Hub 的自动构建大量使用。标签让你可以将\
  \ `version` 标签链接到 `git` 历史记录中的分支或标签。在这种情况下，分支将指代不同的 Git 分支或不同的子目录。我们将在讨论自动构建功能时稍后再回来。\n\
  \n### Untagging the image\n\n有时删除镜像的标签可能很有用。没有 `docker untag` 命令，但如果你小心，可以使用 `docker\
  \ rmi` 命令取消镜像的标签。通常，我们使用 `docker rmi` 命令删除镜像；然而，如果你的镜像有多个标签，则 `docker rmi` 命令将删除标签但不会删除镜像。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_203_0.png)\n\n要谨慎，因为如果镜像不再有标签，`docker\
  \ rmi` 命令将删除该镜像。\n\n例如，如果你需要从镜像中删除 `version1.0.test` 标签，请执行以下命令：\n\n```\ndocker\
  \ rmi <image ID or name>:version1.0.test\n```\n\n### Pushing the image\n\n一旦镜像正确标记，你就可以使用\
  \ docker `login` 命令登录 Docker Hub，就像我们在第 5 章 *Finding Images* 中所做的那样。要登录远程仓库，请执行\
  \ docker `login` 命令：\n\n```\ndocker login --username=yourUsername --email=yourEmail@address.com\n\
  ```\n\n成功验证后，你只需使用 docker `push` 命令推送镜像：\n\n```\ndocker push yourUsername/myRepo\n\
  ```\n\n当然，推送镜像可能需要一些时间，这取决于镜像大小和你互联网连接的速度。完成后，镜像即可拉取。如果你需要检查镜像是否已在远程仓库上可用并就绪，你可以将其拉取。\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_204_0.png)\n\n如果你想从 Docker Hub 拉取自己的镜像，请先从本地机器删除原始镜像。Docker\
  \ 会比较你本地拥有的镜像和远程仓库上的镜像，如果本地和远程镜像相同，则不会拉取。\n\n如果发布到 Docker Hub 上的公共仓库，登录并执行 docker\
  \ `push` 命令将使新镜像对全世界可用。然而，你当然并不局限于公共仓库，你也可以将镜像推送到自己的私有仓库。如果你想使用私有仓库，你需要将私有仓库的 URL\
  \ 设置为用户名。首先，你需要正确标记它，然后再推送它。如果你的仓库在 localhost 端口 5000 上监听，你可以执行以下命令：\n\n```\ndocker\
  \ tag yourUser/myRegistry localhost:5000/myRegistry\ndocker push localhost:5000/myRegistry\n\
  ```\n\n你可以通过使用在 GitHub 上免费提供的 Docker Distribution 工具集来创建自己的私有仓库：https://github.com/docker/distribution。你可以在此\
  \ GitHub 仓库中找到的主要实用程序是用于存储和分发 Docker 镜像的 Docker registry 2.0 实现。它用新的 API 设计取代了旧的\
  \ docker-registry 项目，专注于安全性和性能。此新仓库实现相比旧版本提供了以下优势：更快的推送和拉取、简化的部署、可插拔的存储后端和 Webhooks\
  \ 通知。它支持多种存储后端，你可以选择例如本地文件系统或类似 Amazon S3 的云。\n\n无论是公共还是私有，将镜像标记并推送到远程仓库都相当直接，并不是一个复杂的过程。但\
  \ Docker Hub 提供的还有更多内容，以及自动构建。让我们在后面的章节中解释它们。\n\n### Webhooks and automated builds\n\
  \n正如你可能从第 5 章《Finding Images》中回忆的那样，自动构建是 Docker Hub 的最酷功能之一。自动构建会在镜像的源代码（即 Dockerfile）发生变化时由\
  \ Webhooks 触发。Webhooks 让你在将镜像推送到仓库后执行不同的操作。自动构建仓库可直接在 Docker Hub 上从最流行的 git 仓库，即\
  \ GitHub 或 Bitbucket，自动化构建和更新镜像。自动构建仓库可以为私有或公共仓库创建。它通过向你选择的 GitHub 或 Bitbucket 仓库添加提交钩子来实现；因此，当你推送提交时触发构建和更新。自动构建仓库有几个优点，以这种方式构建的镜像完全按指定构建，Dockerfile\
  \ 对具有 Docker Hub 仓库访问权限的任何人都可用，并且你的 Docker 仓库会自动始终与源代码更改保持最新。\n\n### Setting up\
  \ the automated build\n\n在第 6 章《Creating Images》中，我们讨论了 Docker 使用所谓的构建上下文来构建镜像。构建上下文是一个\
  \ Dockerfile 以及 Dockerfile 中引用的特定位置的任何文件。对于自动构建，构建上下文将是一个包含 Dockerfile 的源代码仓库。这意味着源代码仓库必须包含你通常在本地构建镜像所需的所有文件，且必须首先包含\
  \ Dockerfile。\n\n![](img/0c87321919fa245e22f056c67ec70003_205_0.png)\n\n对于自动构建，源代码仓库是构建上下文。\n\
  \n\n\n要设置自动构建，您首先需要登录 Docker Hub。之后，打开创建下拉菜单并选择 **创建自动构建**，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_206_0.png)\n\
  \nDocker Hub 使用 GitHub 或 Bitbucket 作为源代码仓库，因此如果您尚未执行此操作，则需要将您的 GitHub 或 Bitbucket\
  \ 账户链接到您的 Docker Hub 账户。步骤包括使用 GitHub 或 Bitbucket 进行身份验证，并授予 Docker Hub 对您仓库账户的有限或完全访问权限。此访问权限对于\
  \ Docker Hub 查找您的仓库并为您注册适当的 Webhook 是必需的。为此，请单击 **链接账户** 按钮并选择 GitHub 或 Bitbucket，如下所示：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_206_1.png)\n\n如果您选择链接 GitHub，您需要再做一个选择。您可以授予\
  \ Docker Hub 对您仓库的公共和私有访问权限，或仅限于公共仓库的只读访问权限，如以下屏幕截图所示：\n\n### 公共和私有（推荐）\n- 对公共和私有仓库具有读写权限。（我们仅使用写权限来添加服务钩子和部署密钥）\n\
  - 如果您想从私有 GitHub 仓库设置自动构建，则需要此权限。\n- 如果您想使用私有 GitHub 组织，则需要此权限。\n- 我们将为您自动配置服务钩子和部署密钥。\n\
  \n### 受限访问\n- 公共只读访问。\n- 仅适用于公共仓库和组织。\n- 您需要手动更改仓库才能使用自动构建。\n\n两者之间存在很大差异。第一个选项授予对公共和私有仓库的读写访问权限，这意味着\
  \ Docker Hub 将能够自动向您的仓库添加服务钩子和部署密钥。此外，如果您想从私有 GitHub 仓库设置自动构建，则此读写访问是强制性的。受限的只读访问意味着您只能使用公共仓库创建自动构建仓库。此外，为了使用自动构建功能，您需要自行对仓库进行更改。\n\
  \n授予 Docker Hub 访问您的私有仓库的权限更为方便且推荐，但如果您有安全方面的顾虑，请考虑仅使用受限访问。\n\n一旦您授予对仓库的访问权限，您将被带到\
  \ OAuth 摘要屏幕，在那里 GitHub 将在授予对您账户的访问权限之前要求您确认：\n\n![](img/0c87321919fa245e22f056c67ec70003_208_0.png)\n\
  \n在授权对您 GitHub 账户的访问后，如果您从创建下拉菜单中选择创建自动构建选项，将显示您在 GitHub 上的仓库列表。\n\n![](img/0c87321919fa245e22f056c67ec70003_208_1.png)\n\
  \n您想要创建自动构建的仓库中需要包含您想要构建的 Dockerfile。\n\n为本示例的目的，我已 fork 了在 GitHub 上可用的 hello-world\
  \ Docker 镜像仓库，地址为 https://github.com/docker-library/hello-world。\n\n现在您需要做的就是从列表中选择仓库。您将看到\
  \ `Automated Build` 配置屏幕。在这里，您可以设置生成的镜像的可见性（公开或私有）。默认情况下，Docker Hub 将使用您 Git 仓库中的分支名称为生成的镜像打标签。对\
  \ `master` 分支的 Git `push` 命令将触发构建并为镜像打上 `latest` 标签。对除 `master` 之外的分支的 git `push`\
  \ 将触发从该 Git 分支构建镜像。结果将然后使用该分支名称进行标签。\n\nTIP: 您可以为每个仓库创建多个自动构建，并将它们配置为指向特定的 Dockerfile\
  \ 或 Git 分支。\n\n这通常已足够并且是一个非常有效的设置，但如果需要，您可以自定义行为。只需单击 Click here to customize 链接以打开规则编辑器：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_209_0.png)\n\n在 **Autobuild Tags** 编辑器中，您可以指定特定类型的\
  \ git push（分支或标签）将具有的标签。如您所见，`master` git 分支构建的结果默认会被标记为 `latest`。这里的灵活性很大，您可以根据需要添加或删除规则。例如，推送到特定分支的构建结果将始终与其它分支不同。\n\
  \nTIP: 您可以在 `Build Settings` 页面中创建 `Automated Build` 后，随时更改标签配置。\n\n## 发布镜像\n\n\
  单击 **创建** 按钮后，您的自动构建将被创建。Docker Hub 将其与您的其它仓库一起列出；请注意，您刚刚创建的仓库是自动构建的结果：\n\n![](img/0c87321919fa245e22f056c67ec70003_210_0.png)\n\
  \n创建 `Automated Build` 仓库后，您以后可以停用或删除它。Docker 将您的自动构建列为普通仓库，但有两个区别。第一个区别是您无法向 `Automated\
  \ Build` 仓库推送镜像。\n\n![](img/0c87321919fa245e22f056c70003_210_1.png)\n\n您无法使用 `docker\
  \ push` 命令推送到自动构建。您只能通过将源代码提交并推送到 GitHub 或 Bitbucket 仓库来管理它。\n\n第二个区别是，如果您进入仓库详情，将会出现两个额外的标签页：**构建详情**\
  \ 和 **构建设置**。`Build Details` 屏幕，如以下示例所示，将展示最新构建的历史记录及其状态，例如 `Queued`、`Success` 或\
  \ `Failure`。\n\n![](img/0c87321919fa245e22f056c67ec70003_210_2.png)\n\n您可以看到的状态包括：\n\
  - `Queued`：您的镜像等待在队列中构建。稍等片刻即可准备就绪。\n- `Building`：镜像正在构建中。\n- `Success`：构建过程中没有问题，镜像现已可供拉取。\n\
  - `Error`：构建过程中出现一些问题（如 Dockerfile 中的错误或上下文中缺少文件）。如果您单击状态行，您将被带到构建详情屏幕，在那里您可以查看构建日志以快速找到构建失败的原因。\n\
  \n**构建设置** 页面包含您可以为该特定自动构建更改的详细设置列表。您可以在此处找到 **Autobuild Tags** 编辑器，即您在创建自动构建仓库时最初看到的那个。您随时可以在此处调整标签方案。\n\
  \n尽管启动镜像构建的主要触发器是 git push 命令，您也可以通过向特定端点发出 `HTTP POST` 命令来触发构建。此功能称为构建触发器。\n\n\
  ## 构建触发器\n\n构建触发器只是一个 HTTP 端点，如果使用 HTTP post 命令调用它，将触发您选择的镜像的构建。您可以使用设置中的 **构建触发器**\
  \ 部分设置触发器 URL。\n\n当您向下滚动页面直到看到 *构建触发器* 部分时即可使用它，如以下屏幕截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_212_0.png)\n\
  \nDocker 最初会生成一个特殊的唯一触发器，您也可以重新生成它。令牌用作触发器 URL 的一部分。设置好后，您现在可以从自己的流程中触发构建，例如您的持续集成或交付流程。示例用例可以是如果您的镜像使用某些外部依赖项。您可以在按需重建镜像，而不仅仅是在将新代码推送到源代码仓库时。\n\
  \n要测试构建触发器，您可以使用您选择的 HTTP 客户端执行 POST，例如 Chrome 的 Postman 或 Mac 的 PAW。最简单最快的工具可能是\
  \ curl 命令。它是一个命令行 HTTP 客户端，默认在 Linux 中可用，但您可以从其主页 https://curl.haxx.se/download.html\
  \ 下载适用于几乎所有平台的版本。对构建触发器的 POST 调用会携带 JSON 有效负载，其中包含指示 Docker Hub 执行什么操作以及如何操作的指令。请考虑以下触发构建的示例。如果您想触发所有标签/分支，请执行：\n\
  \n```\ncurl -H \"Content-Type: application/json\" --data '{\"build\": true}' -X\
  \ POST\nhttps://registry.hub.docker.com/u/jotka/hello-world-docker/trigger/a9308c54-7105-4d20-a950-93db1f15085f/\n\
  ```\n\n\n\n要使用 Docker 标签名称触发构建，您需要在 POST 命令的 JSON 负载中提供标签名称：\n\n```\ncurl -H \"\
  Content-Type: application/json\" --data '{\"docker_tag\": \"master\"}' -X POST\n\
  https://registry.hub.docker.com/u/jotka/hello-world-docker/trigger/a9308c54-7105-4d20-a950-93db1f15085f/\n\
  ```\n\n要通过源分支触发构建，例如 feature/NIS-234，JSON 负载需要携带分支名称，如下所示：\n\n```\ncurl -H \"Content-Type:\
  \ application/json\" --data '{\"source_type\": \"Branch\", \"source_name\": \"feature/NIS-234\"\
  }' -X POST\nhttps://registry.hub.docker.com/u/jotka/hello-world-docker/trigger/a9308c54-7105-4d20-a950-93db1f15085f/\n\
  ```\n\n最后，您还可以使用源标签触发构建，例如 1.1：\n\n```\ncurl -H \"Content-Type: application/json\"\
  \ --data '{\"source_type\": \"Tag\", \"source_name\": \"v1.1\"}' -X POST\nhttps://registry.hub.docker.com/u/jotka/hello-world-docker/trigger/a9308c54-7105-4d20-a950-93db1f15085f/\n\
  ```\n\nDocker Hub 及其 Automated Build 功能是保持源代码和已发布镜像同步的绝佳工具。但还有另一个很棒的功能，允许在仓库中发生事件时在另一个应用程序中执行操作——这些就是\
  \ Webhooks。让我们现在来看看它们。\n\n## Webhooks 与持续部署\n\n当镜像构建完成或向您的 Automated Build 仓库添加新标签时，Docker\
  \ Hub 会触发 Webhooks。\n\n## 发布镜像\n\n在定义 Webhook 时，您会指定其名称和在构建完成或出现新标签时调用的目标 URL。这可以在\
  \ `Automated Build` 仓库详情中的 `Webhooks` 选项卡中完成，如以下截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_214_0.png)\n\
  \nWebhook 调用将是一个 HTTP `POST` 请求。此请求的 JSON 负载将包含刚刚发生的事件的所有详细信息。查看该负载内容并测试 Webhook\
  \ 的最简单方法是 在 `http://requestb.in` 注册一个临时的 REST 端点，并将其输入并用作 Webhook URL。\n\nrequestb.in\
  \ 是一个免费的 Web 应用程序，允许您创建一个 URL（端点），该端点会监听发往它的请求并以可读的形式让您检查它们。只需点击 Create Request\
  \ Bin 按钮即可创建自己的 URL，如以下截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_215_0.png)\n\
  \n结果页面将显示 URL 值以及如何调用新创建的 URL 的一些示例。这些示例目前对我们来说不重要；是 Docker Hub 将调用该 URL。Bin URL\
  \ 是您希望在 Docker Hub 中 Webhook 设置中输入的 URL，如以下截图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_215_1.png)\n\
  \n在 http://requestb.in 中创建的 URL 将监听传入连接，并在 webhook 被调用后显示传入的 POST 数据。如果您在 Docker\
  \ Hub 上触发构建，无论是通过向 GIT 仓库推送提交、使用构建触发器还是从 Docker Hub Web 界面手动执行构建。Docker Hub 将使用定义的\
  \ Webhook 调用监听端点，您将在那里实际看到传入的数据。您可以在以下截图中看到结果：\n\n![](img/0c87321919fa245e22f056c67ec70003_216_0.png)\n\
  \n如 RAW BODY 部分所示，Docker Hub 发布了一个包含事件所有详细信息的 JSON 负载：\n\n```\n{\n  \"push_data\"\
  :{\n    \"pushed_at\":1475303709,\n    \"images\":[],\n    \"tag\":\"latest\",\n\
  \    \"pusher\":\"jotka\"\n  },\n  \"callback_url\":\"https://registry.hub.docker.com/u/jotka/hello-world-docker2/hook/2ec10hea0aade410aeih2c1gjd\
  \ i2b3e50/\",\n  \"repository\":{\n    \"status\":\"Active\",\n    \"description\"\
  :\"desc\",\n    \"is_trusted\":true,\n    \"full_description\":null,\n    \"repo_url\"\
  :\"https://hub.docker.com/r/jotka/hello-world-docker2\",\n    \"owner\":\"jotka\"\
  ,\n    \"is_official\":false,\n    \"is_private\":false,\n    \"name\":\"hello-world-docker2\"\
  ,\n    \"namespace\":\"jotka\",\n    \"star_count\":0,\n    \"comment_count\":0,\n\
  \    \"date_created\":1475303673,\n    \"repo_name\":\"jotka/hello-world-docker2\"\
  \n  }\n}\n```\n\n在负载中，我们拥有导致 Webhook 被调用的事件相关的所有详细信息，例如 repo_name、date_created、tag\
  \ 等。当然，这些可以在 Webhook 实现中使用，例如拉取生成的镜像并部署到某处。\n\nWebhooks 可用于进一步自动化一些事情并创建持续部署设置。您需要做的就是定义\
  \ POST 端点并拥有一个应用程序（实际上是一个 Web 服务器），该应用程序会在指定的端点监听请求，Docker 将使用所有详细信息执行 POST。Webhooks\
  \ 最佳用途可能是持续部署设置。例如，有一个名为 Shipyard 的 Docker 管理工具，可在 https://shipyard-project.com\
  \ 获取。如果 Docker Hub 构建了新的 Docker 镜像（无论是由源代码仓库的推送触发还是使用 Build Trigger），它将使用 HTTP POST\
  \ 请求向 Shipyard 发送 Webhook 通知。Shipyard 将检查 Webhook 密钥以进行授权，然后从 Docker Hub 拉取最新镜像。因此，Shipyard\
  \ 将停止并删除您当前的容器并部署一个新容器。另一个有用的应用程序，可让您设置持续部署管道的是 Swarm Inception。它是一个简单的应用程序，可在 GitHub\
  \ https://github.com/giantswarm/swarm-inception 获取。这实际上是一个小型服务器，可监听 POST 请求。使用 Swarm\
  \ Inception，您可以使用 Docker Hub 的镜像构建器和 Giant Swarm 进行持续容器交付。同样，当构建完成后，Docker Hub 将调用此服务的\
  \ Webhook 处理程序，进而触发部署或更新 Docker Hub 构建的镜像到 Giant Swarm 的公共云。Giant Swarm 是一个云应用程序，您可以在其中在几秒钟内将\
  \ Docker 容器部署到完全托管的 Kubernetes 集群上。\n\n虽然 Swarm Inception 可以开箱即用地实现持续部署，但它也是实现自己的\
  \ Webhook 处理程序并使用 Docker Hub 的构建服务进行持续部署的非常好的参考文档。虽然 Swarm Inception 使用 Giant Swarm\
  \ 的 API 来处理容器，但您可以轻松地 fork 或复制存储库并使用其他服务实现自己的持续交付。\n\n还有一些其他很棒的起点来实现自己的 Webhook\
  \ 监听服务器。第一个是名为 `dockerhook-webhook-listener` 的项目，可在 GitHub `https://github.com/cpuguy83/dockerhub-webhook-listener`\
  \ 获取。它只是一个用 Go 编写的简单而纯粹的 Web 服务器（顺便说一下，Docker 本身也是用这种语言开发的）。另一个很棒的是 `Captain Hook`，同样可在\
  \ GitHub 上获取：`https://github.com/bketelsen/captainhook`。它是一个通用的 Webhook 端点，可根据调用的\
  \ URL 运行脚本。您在 Captain Hook 的 `configdir` 中创建的每个脚本将在对应的端点被调用时执行。\n\n![](img/0c87321919fa245e22f056c67ec70003_218_0.png)\n\
  \nCaptain Hook 本身作为 Docker 镜像提供，因此您可以立即拉取并使用它。\n\n您可以通过执行众所周知的 `docker pull` 命令从\
  \ Docker Hub 拉取 Captain Hook：\n\n```\ndocker pull ablas/docker-captainhook\n```\n\
  \n接下来，您使用 `docker run` 命令运行 Captain Hook，公开 `8080` 端口，并将 Webhooks 处理程序的脚本路径作为 `HOOKS_PATH`\
  \ 环境变量提供：\n\n```\ndocker run -d -p 8080:8080 -v `${HOOKS_PATH}`:/webhooks ablas/docker-captainhook\n\
  ```\n\n您可以将 Webhook 处理程序放在任何文件夹中，只需注意您需要将其映射到 `/webhooks` 目录。每个脚本对应一个监听端点。例如，如果您放置一个名为\
  \ `deployMyContainer.json` 的脚本，当 Docker Hub 向以下 URL 创建 `POST` 请求时，它将被执行：\n\n```\n\
  http://your.captainhook.url/deployMyContainer\n```\n\n\n\nThe handler script can\
  \ contain a reference to the shell script. After the specific POST endpoint has\
  \ been hit, the shell script will take over and, for example, deploy a fresh image.\
  \ Take a look at this Captain Hook script:\n\n```\n{\n  \"scripts\": [\n    {\n\
  \      \"command\": \"/usr/jarek/webhook.sh\",\n      \"args\": [\n        \"3\"\
  \n      ]\n    }\n  ]\n}\n```\n\nIn the referenced shell script, we need to do something\
  \ useful, actually. All we have to do is to parse the incoming JSON payload. We\
  \ can do it using the JSON parsing jq tool, about which we know from the previous\
  \ Chapter 7, Running Containers. It's available at https://stedolan.github.io/jq/.\
  \ We have been using jq to parse the docker inspect command output. At this time\
  \ we can use the jq tool to parse the incoming data and to pull the image from the\
  \ Docker Hub and run it.\n\nAfter reading this chapter, you should be aware that\
  \ Webhooks are powerful feature. The listening endpoint can be written in any language\
  \ of your choice, let it be Java, Scala, or C#. There is a lot of ready-to-use API\
  \ for dealing with Docker containers available for free. You can, of course, use\
  \ them in your Webhook handler implementation to pull and deploy images. We are\
  \ going to cover some of them in the next chapter. To give you some inspirations,\
  \ here are some you can pick from:\n\n- **Java Docker API 客户端**: Available on GitHub\
  \ https://github.com/docker-java/docker-java. It's based on Jersey REST library.\n\
  - **Docker.DotNet**: It's a C# client available on GitHub https://github.com/ahmetalpbalkan/Docker.DotNet.\n\
  - **docker-client**: It's for Groovy https://github.com/gesellix/docker-client\n\
  - **tugboat**: It's available at https://github.com/softprops/tugboat, is a Scala\
  \ library for dealing with the Docker containers.\n\n![](img/0c87321919fa245e22f056c67ec70003_219_0.png)\n\
  \nAn always up-to-date API list is available at Docker website at the https://docs.docker.com/engine/reference/api/remote_api_client_libraries/address.\n\
  \nThere's so many of them that there's a huge chance you will find something for\
  \ the programming language of your choice. Knowing the incoming payload structure\
  \ and having a Docker API library it's easy to implement your own listening Webhook\
  \ handlers. If you have Webhooks defined in your automated builds, Webhook handlers\
  \ running and listening for calls, your deployments can be launched seamlessly from\
  \ GIT push command. It will work smoothly without needing any manual intervention\
  \ from anyone. It's true continuous deployment. Docker can be useful also in your\
  \ existing development or continuous delivery flow, using Jenkins, or Maven for\
  \ example. This is what we are going to cover in the next chapter.\n\n## Summary\n\
  \nIn this chapter, we have learned how to tag and push our images to the remote\
  \ registry making it available for others to use. We also know how to setup the\
  \ automated build feature using the integrated GitHub or BitBucket account. Automatic\
  \ Build repository is a great feature; it allows you to keep the source of your\
  \ images (including of course, Dockerfiles) and the images on the DockerHub in sync.\
  \ We also know how to use Webhooks feature to do some more automation, for example\
  \ continuous deployment. In the next chapter, we will go a little bit more into\
  \ using Docker, we will be utilizing Docker to package our Java and JavaScript application\
  \ into the container.\n"
- "# 9\n\n## 9 Using Docker in Development\n\nAfter reading the past chapters, you\
  \ should be able to pull a image and use it as the base for your own image. We already\
  \ know how to create an image, attach volumes, expose ports, and run it in a container.\
  \ We can also publish it into the Docker Hub for others to use. This is the last\
  \ chapter in which we are going to cover some practical examples of how you can\
  \ put Docker to use in your daily life as a developer. First of all, you will learn\
  \ how to make Docker work with the most popular Java build system: Maven. Then we\
  \ can put our applications into containers in practice; we will run Spring Boot\
  \ Java application from inside a Docker container. Next, we will pack the Angular.js\
  \ frontend application, which runs on Node.js in a Docker container. These examples\
  \ should give you an idea and some inspiration on how you can create Docker containers\
  \ with your own applications. In particular, we are going to cover the following\
  \ topics in this chapter:\n\n- Using Docker with Maven\n- Packaging Java Spring\
  \ Boot application into the container\n- Packaging node.js Angular application into\
  \ the container\n\nLet's begin with explaining how to incorporate Docker in our\
  \ Java Maven build.\n\n## Using Docker with Maven\n\nIf you develop in Java, you\
  \ probably know Maven. It's used widely to build Java applications or libraries.\
  \ The Maven's build process uses the concept of an artifact. An artifact is a file,\
  \ usually a JAR (containing Java libraries or application) or WAR/EAR, which is\
  \ a Java web application. The artifacts are deployed to a Maven repository. A Maven\
  \ build produces one or more artifacts and each artifact has a group ID (usually\
  \ a reversed domain name, such as com.example.foo), an artifact ID (just a name),\
  \ and a version string. The three together uniquely identify the artifact. Your\
  \ application dependencies are also specified as artifacts. You already know Docker\
  \ pretty well, so you could probably imagine what a useful Maven plug in for Docker\
  \ should do. It should allow to:\n\n- Pull images from the registry\n- Build container\
  \ images\n- Start containers\n- Optionally link containers\n- Expose the needed\
  \ ports (useful for integration tests)\n- Push images to the registry\n\nIncluding\
  \ Docker in your Maven build setup can be especially useful in your development\
  \ flow. Imagine that after Maven build, the resulting image containing your application\
  \ could be automatically pushed to the registry, thus making it ready for your colleagues,\
  \ testers, or clients. Your high-level build process could include the following\
  \ steps:\n\n- 1. Build from sources\n- 2. Execute unit tests\n- 3. Create Docker\
  \ image (the dockerbuild command needs to be executed here)\n- 4. Run integration\
  \ tests on the container (Docker commands, such as run, start, expose, link, and\
  \ stop will be probably executed here)\n- 5. Publish the image (the last step is\
  \ usually the docker publish command)\n\nThere are a lot of Docker plugins for Maven;\
  \ we will focus on probably the two most interesting ones. The first one is Spotify's\
  \ Maven Docker Plugin.\n\n## Spotify's Maven Docker plugin\n\nIt's available as\
  \ open source and you can get the sources and documentation from GitHub: https://github.com/spotify/docker-maven-plugin.\
  \ You can use this plugin to create a Docker image with artifacts built from your\
  \ Maven project. For example, the build process for a Java service can output a\
  \ Docker image that runs the service.\n\nThe usage of the Spotify's docker-maven-plugin\
  \ is pretty straightforward. You will just have to include it as a plugin in your\
  \ build and provide a `dockerDirectory` value in the configuration. The plugin will\
  \ expect the Dockerfile in this directory, so if you specify that directory, it\
  \ must contain valid Dockerfile. You can also build the image without Dockerfile.\
  \ In this case, you will need to provide additional plugin configuration, such as\
  \ `baseImage` (it will be used in the `FROM` instruction-the starting point in every\
  \ Dockerfile, as you remember from Chapter 6, *Creating Images*), `maintainer`,\
  \ `cmd` and `entrypoint`.\n\nThe contents of the directory specified as the `dockerDirectory`\
  \ value will be copied into `${project.build.directory}/docker`. This will be the\
  \ build context when the `docker build` command starts. Using the `resource` element,\
  \ you can include additional artifacts to the Docker's build context. Take a look\
  \ at the following example fragment of the `pom.xml` build file:\n\n```xml\n<build>\n\
  \    <plugins>\n        <plugin>\n            <groupId>com.spotify</groupId>\n \
  \           <artifactId>docker-maven-plugin</artifactId>\n            <version>0.4.13</version>\n\
  \            <configuration>\n                <imageName>myImage</imageName>\n \
  \               <dockerDirectory>docker</dockerDirectory>\n                <resources>\n\
  \                    <resource>\n                        <targetPath/>\n       \
  \                 <directory>${project.build.directory}</directory>\n          \
  \              <include>${project.build.finalName}.jar</include>\n             \
  \       </resource>\n                </resources>\n            </configuration>\n\
  \        </plugin>\n    </plugins>\n</build>\n```\n\n\n\n在前面的示例中，我们已将插件包含在 pom.xml\
  \ 文件的 plugins 部分。来自 ${project.build.directory} 的一个 jar 文件（默认情况下为 /target 目录）将被包含在构建上下文中。这次它将是一个以你的应用程序名称命名的\
  \ jar 文件，其中包含你构建的应用程序。\n\n有了这种设置，再加上一个正确引用 /target 目录中应用程序 jar 的 Dockerfile，就足以从\
  \ Maven 的 pom.xml 创建 Docker 镜像。你只需执行以下 Maven 目标：\n\n```\nmvn clean package docker:build\n\
  ```\n\n如果你决定将生成的镜像推送到注册表，则需要额外的 -DpushImage 参数：\n\n```\nmvn clean package docker:build\
  \ -DpushImage\n```\n\n如果你需要在仅运行 mvn deploy 时构建、标记并推送镜像，你需要将 Docker 命令绑定到 Maven 阶段，就像你通常对其他构建插件所做的那样。Spotify\
  \ 的插件很不错、快速且简单。如果你只需要构建镜像，它可以作为一个起点。但它有一个限制：它不允许运行容器。由于该插件只能用于构建镜像，因此相当受限。让我们来看另一个：fabric8io\
  \ Docker 插件。\n\n## fabric8io Maven Docker 插件\n\n它的配置不同。fabric8 插件使用一个配置部分来维护所有镜像。它为每个部分都有配置项，这些配置项分为\
  \ build 和 run 部分，分别用于构建指令和运行时配置。部分功能包括拉取镜像时的进度条、动态灵活的端口映射和变量分配，以及通过插件配置或 Dockerfile\
  \ 构建镜像（与 Spotify 插件相同）。它还在集成测试期间记录容器的标准输出，并在容器启动后完全支持等待时间、特定 URL 或日志输出。\n\n就配置而言，Fabric8.io\
  \ Docker Maven 插件非常强大且灵活。要设置镜像配置，你需要在 <configuration><images> 元素中创建 <image> 元素，如以下示例所示：\n\
  \n```xml\n<configuration>\n  <images>\n    <image>\n      <alias>myApplication</alias>\n\
  \      <name>me/my-application:${project.version}</name>\n      <build>\n<from>java:8</from>\n\
  <assembly>\n    <descriptor>artifact</descriptor>\n</assembly>\n<cmd>\n    <shell>java\
  \ -jar maven/myApplication.jar</shell>\n</cmd>\n</build>\n<run>\n    <ports>\n \
  \       <port>8080:8080</port>\n    </ports>\n</run>\n</image>\n</images>\n</configuration>\n\
  ```\n\n![](img/0c87321919fa245e22f056c67ec70003_225_0.png)\n\n你可以为每个要创建或使用的镜像拥有多个\
  \ <image> 元素。\n\n镜像构建过程在 <build> 元素内配置。Fabric8.io 插件对构建配置采用两种方法；你可以使用现有的 Dockerfile，也可以使用内联配置（如前例所示）。如果你想使用现有的\
  \ Dockerfile，你需要提供额外的 dockerFileDir 和 dockerFile 元素。前者将指定包含 Dockerfile 的目录，后者将指向该目录中的特定\
  \ Dockerfile。作为 dockerFileDir 元素指定的目录中的所有文件也将被包含在镜像构建上下文中。\n\n另一方面，内联配置将描述 pom.xml\
  \ 本身中的镜像构建过程。你需要提供诸如 <from> 之类的元素，其中将包含基础镜像（相当于 Dockerfile 中的 FROM 指令）。assembly\
  \ 描述符包含将进入镜像的所有文件，而 <cmd> 包含在创建容器时运行的命令。正如我们在第 6 章《Creating Images》中讨论的那样，此设置类似于标准的\
  \ Dockerfile，当然你完全支持所有 Dockerfile 标准功能。你可以暴露端口（与我们在第 6 章《Creating Images》中使用 EXPOSE\
  \ Dockerfile 指令所做的方式相同）。\n\n要暴露端口，你需要在 <ports> 元素中定义 <port> 子元素。在以下示例中，我们暴露端口号 8080，以便在运行容器时稍后将其映射到主机的端口：\n\
  \n```xml\n<ports>\n  <port>8080</port>\n</ports>\n```\n\n要定义卷，需要类似的构造，并且 <volumes>\
  \ 元素内部包含的每个 <volume> 元素将代表一个卷。与 VOLUME 指令完全相同，它会创建具有指定名称的挂载点，并将其标记为保存来自本地主机或其他容器的外部挂载卷。\n\
  \n```xml\n<volumes>\n  <volume>/path/to/volume</volume>\n</volumes>\n```\n\n要定义镜像的入口点，你需要（正如你可能已经猜到的）一个\
  \ <entrypoint> 元素，如以下示例所示：\n\n```xml\n<entryPoint>\n  <exec>\n    <arg>java</arg>\n\
  \    <arg>-jar</arg>\n    <arg>/maven/myApplication.jar</arg>\n  </exec>\n</entryPoint>\n\
  ```\n\n<entrypoint> 指定了一个命令，该命令在容器启动时始终会被执行，与普通和传统的 Dockerfile 中的 ENTRYPOINT 指令方式相同。\n\
  \n构建配置中的 <assembly> 元素指定构建产物以及应用程序可能需要的其他文件将如何放入生成的 Docker 镜像中。有几个预定义的 assembly\
  \ 描述符，例如 artifact-with-dependencies（将项目的构件及其所有依赖项附加到镜像中）、artifact（仅将项目的构件放入镜像中）、project（将整个\
  \ Maven 项目附加到镜像中）以及 rootWar（将构件作为 ROOT.war 复制到暴露的目录中）。\n\n![](img/0c87321919fa245e22f056c67ec70003_227_0.png)\n\
  \n来自 assembly 描述符的所有文件都会自动进入镜像。你可以通过查看 target/docker/yourProject/build/maven 目录的内容来了解镜像中包含的内容。\n\
  \n正如你所见，<build> 元素中的配置几乎完全匹配 Dockerfile 的结构和内容。当你使用 Maven 执行 docker:build 命令时，它将被考虑在内：\n\
  \n```\nmvn -PmyProfile docker:build\n```\n\n<image> 的 <run> 元素包含运行时设置；当你使用以下命令通过\
  \ Maven 创建和运行 Docker 容器时，它将被使用：\n\n```\nmvn -PmyProfile docker:build docker:start\n\
  ```\n\n在运行时配置中，你可以按以下示例定义端口映射：\n\n```\n<ports>\n  <port>8080</port>\n</ports>\n\
  ```\n\n在前一种情况下，容器端口 8080 将映射到 Docker 主机端口 8080。这与我们在第 4 章《Networking and Persistent\
  \ Storage》中所做的相同，我们使用 docker run 命令的 -p 或 -P 选项映射了暴露的端口：\n\n```\ndocker run --name\
  \ nginx -d -P nginx\n```\n\n除了映射端口之外，你还可以映射卷。这再次类似于我们之前使用 docker run 命令的 -v 选项所做的映射：\n\
  \n```\ndocker run -it -v data:/data ubuntu\n```\n\n正如我们在第 4 章《Networking and Persistent\
  \ Storage》中看到的那样，容器在启动时可以从各种来源挂载卷。它可以是主机系统的目录，也可以是导出一个或多个目录的另一个容器。挂载配置在 <run> 配置的\
  \ <volumes> 部分中指定。\n\n```\n<volumes>\n  <bind>\n    <volume>/logs</volume>\n   \
  \ <volume>/opt/hostDirectory:/opt/containerDirectory</volume>\n  </bind>\n</volumes>\n\
  ```\n\n要从另一个镜像导入卷（如我们之前使用 --volumes-from 所做的那样），你可以在卷配置中使用 <from> 和 <image> 元素。要提供镜像名称或别名，请在\
  \ <image> 元素中指定你想要使用的卷，如以下示例所示：\n\n```\n<volumes>\n  <from>\n    <image>test/myApplication2</image>\n\
  \  </from>\n</volumes>\n```\n\nfabric8.io Maven 插件是一个完整的解决方案，包含所有 Docker 相关的构建和运行时配置。你可以链接镜像、提供运行时网络设置并定义运行时重启策略（我们在第\
  \ 7 章《Running Containers》中详细讨论了重启策略）。它还有一套完整的 Maven 相关目标，例如用于构建镜像的 docker:build、用于管理容器生命周期的\
  \ docker:start 或 docker:run 和 docker:stop、用于将容器上传到注册表的 docker:push，以及用于输出容器日志的 docker:logs。你甚至可以使用\
  \ maven:source 目标将生成的 Docker 镜像包含到 Maven 构件中以供进一步处理。\n\n要执行整个操作链，即创建镜像、启动容器、执行单元测试、停止容器并进行清理，请执行\
  \ install 命令：\n\n```\nmvn -PmyProfile install\n```\n\n在使用 Maven 和 Docker 时，fabric8.io\
  \ 插件提供了很多功能。你始终可以参考插件网站 https://dmp.fabric8.io/ 上的最新文档。如果需要从 Maven 构建中构建或运行 Docker\
  \ 容器，它是首选。\n\n现在我们知道如何从自己的构建过程中创建和运行 Docker 容器。现在让我们专注于将实际应用程序打包到容器中。我们将介绍示例设置，例如\
  \ Java 应用程序和 Angular.js 前端应用程序。让我们从 Java 开始；我们将对 Spring Boot 应用程序进行容器化。我们将使用我们已经了解的\
  \ fabric8 Docker Maven 插件。\n\n\n\n## 在 Docker 容器中运行 Spring Boot 应用\n\n为本示例的目的，我们将从一个简单的\
  \ hello-world 类型的 Spring Boot 应用开始。我们将在官方 Java 镜像 openjdk 之上运行它。如果你更喜欢在 Oracle Java\
  \ 镜像上运行，可以在 DockerHub 仓库中搜索它。有很多可直接使用的镜像，其中一些基于官方镜像，例如 Ubuntu。\n\n正如我们在第 6 章《创建镜像》中看到的，选择官方镜像作为基础镜像总是明智的。官方镜像经过测试、有支持，并且通常质量非常高。在容器中创建\
  \ Java 应用的基本步骤如下：\n\n-   从 Docker Hub 拉取基础镜像\n-   安装应用程序本身，在我们的例子中它将是一个可执行的 jar\
  \ 文件\n-   暴露端口，如果你的应用程序需要通过网络与外部世界通信\n-   运行容器\n\n当然，如果你想在容器中放置其他类型的应用程序，以上步骤是不够的；你需要在基础镜像之上安装\
  \ Web 服务器，例如 Tomcat 或 Wildfly。此外，应用程序本身可能打包为 WAR 或 EAR 文件。\n\n我们将放入容器的应用程序只是一个非常简单的\
  \ Spring Boot hello world 示例应用。我们不会详细介绍 Spring Boot，我们只需要有一个可以从 Docker 容器打包和运行的东西。\n\
  \n让我们开始创建我们的 Maven pom.xml 构建文件，如以下示例所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n<project>\n    <modelVersion>4.0.0</modelVersion>\n    <groupId>pl.finsys</groupId>\n\
  \    <artifactId>hello-docker</artifactId>\n    <version>0.0.1-SNAPSHOT</version>\n\
  \    <parent>\n        <groupId>org.springframework.boot</groupId>\n        <artifactId>spring-boot-starter-parent</artifactId>\n\
  \        <version>1.4.1.RELEASE</version>\n    </parent>\n    <dependencies>\n \
  \       <dependency>\n            <groupId>org.springframework.boot</groupId>\n\
  \            <artifactId>spring-boot-starter-web</artifactId>\n        </dependency>\n\
  \    </dependencies>\n<properties>\n    <java.version>1.8</java.version>\n</properties>\n\
  <build>\n    <plugins>\n        <plugin>\n            <groupId>org.springframework.boot</groupId>\n\
  \            <artifactId>spring-boot-maven-plugin</artifactId>\n        </plugin>\n\
  \    </plugins>\n</build>\n</project>\n```\n\n如你所见，我们使用 `spring-boot-starter-parent`\
  \ 作为父 `pom.xml`。它为我们节省了大量工作，并且非常适合本示例中拥有一个正在运行的 Spring Boot 应用的目的。我们的应用程序由 Maven\
  \ 构建，因此文件夹结构需要类似于标准的 Maven 应用结构。它将包含 `pom.xml` 文件，然后是 `src/main/java` 文件夹。`java`\
  \ 文件夹将包含我们的 Java 包。完整的文件夹结构将类似于以下截图：\n\n![](img/0c87321919fa245e22f056c67ec70003_230_0.png)\n\
  \n我们的第一个也是唯一一个 REST 控制器将是 `Hello.java`，让我们把它放在 `java/helloDocker` 文件夹中：\n\n```java\n\
  package helloDocker;\nimport org.springframework.web.bind.annotation.RestController;\n\
  import org.springframework.web.bind.annotation.RequestMapping;\n@RestController\n\
  public class HelloController {\n    @RequestMapping(\"/\")\n    public String hello()\
  \ {\n        return \"Greetings from Spring Boot in Docker!\";\n    }\n}\n```\n\n\
  将此控制器保存在 src/main/java/helloDocker 目录下的 HelloController.java 文件中后，我们所需要的就是实际应用程序的启动点。在\
  \ helloDocker 包中创建一个新的 Java 类：\n\n```java\npackage helloDocker;\nimport org.springframework.boot.SpringApplication;\n\
  import org.springframework.boot.autoconfigure.SpringBootApplication;\nimport org.springframework.context.ApplicationContext;\n\
  @SpringBootApplication\npublic class Application {\n    public static void main(String[]\
  \ args) {\n        ApplicationContext ctx =\n            SpringApplication.run(Application.class,\
  \ args);\n    }\n}\n```\n\n就是这样；我们有一个完整的 Spring Boot 应用，具有一个功能，它将响应 HTTP GET 调用并返回消息\
  \ Hello from Spring Boot in Docker！让我们先使用 Maven 构建它，通过执行 mvn package 命令：\n\n```\n\
  mvn package\n```\n\n为此，你需要安装 Maven 并使其在系统路径中可用。这需要一些时间，所有 Maven 依赖项都需要先下载，并且需要编译应用程序的源代码。你应该能看到以下表示构建成功的消息：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_231_0.png)\n\n我们的应用程序现在已打包为项目 target\
  \ 目录中的 `helloDocker-0.1.0.jar` 文件。让我们进行试运行并执行以下命令：\n\n```\njava -jar target/helloDocker-0.1.0.jar\n\
  ```\n\nSpring 应用将启动并在控制台上输出一些日志：\n\n![](img/0c87321919fa245e22f056c67ec70003_232_0.png)\n\
  \n默认情况下，Spring Boot 应用监听 8080 端口的 HTTP 请求；我们稍后会将此端口暴露给 Docker 镜像。同时，在你的 Web 浏览器中输入\
  \ http://localhost:8080，以验证我们的应用程序是否正常工作并响应 HTTP 请求。你应该会看到我们希望看到的消息：\n\n![](img/0c87321919fa245e22f056c67ec70003_232_1.png)\n\
  \n如果你使用 Linux 或 Mac，或者在 Windows PC 上也安装了 `curl` 命令，你也可以执行它来查看以下消息：\n\n```\ncurl\
  \ http://localhost:8080\nGreetings from Spring Boot in Docker!\n```\n\n就是这样；我们的应用程序运行良好，是时候把它放入容器中了。我们将使用\
  \ fabric8.io 的 Maven Docker 插件，我们在本书章节开始时已经了解过它。我们将使用现有的 Dockerfile 方法，因此让我们在项目的\
  \ `src/main` 目录中创建一个 `docker` 目录并将 `Dockerfile` 放入其中。`openjdk` 官方仓库包含很多标签，每个标签都打包了不同的\
  \ Java 版本供你选择。例如：\n\n-   8u102-jdk, 8u102, 8-jdk, 8, jdk, latest\n-   8u92-jdk-alpine,\
  \ 8u92-alpine, 8-jdk-alpine, 8-alpine, jdk-alpine, alpine\n-   8u102-jre, 8-jre,\
  \ jre\n-   8u92-jre-alpine, 8-jre-alpine, jre-alpine\n-   9-b139-jdk, 9-b139, 9-jdk,\
  \ 9\n-   9-b139-jre, 9-jre\n\n我们将选择最新的一个，即 Java `8u102-jdk`。我们将采用内联配置方法来构建镜像，因此\
  \ `pom.xml` 中的插件部分将包含构建包含我们应用程序的镜像的说明。你需要在 `pom.xml` 文件的 `<build><plugins>` 部分添加以下插件定义：\n\
  \n```xml\n<plugin>\n    <groupId>io.fabric8</groupId>\n    <artifactId>docker-maven-plugin</artifactId>\n\
  \    <version>0.16.8</version>\n    <configuration>\n        <dockerHost>http://127.0.0.1:2375</dockerHost>\n\
  \        <verbose>true</verbose>\n        <images>\n            <image>\n      \
  \          <name>hello-docker</name>\n                <build>\n                \
  \    <from>openjdk:8u102-jdk</from>\n                    <ports>\n             \
  \           <port>8080</port>\n                    </ports>\n                  \
  \  <entryPoint>\n                        <exec>\n                            <args>java</args>\n\
  <args>--jar</args>\n<args>/maven/hello-docker-${project.version}.jar</args>\n</exec>\n\
  </entryPoint>\n<assembly>\n<descriptorRef>artifact</descriptorRef>\n</assembly>\n\
  </build>\n</image>\n</images>\n</configuration>\n</plugin>\n```\n\n现在，为了编译、打包并构建你的\
  \ Docker 镜像，执行以下 Maven 命令：\n\n```\nmvn clean package docker:build\n```\n\n在输出中，maven-docker\
  \ 插件将输出一些详细信息，例如构建镜像过程中的具体步骤。你会找到所有的 EXPOSE、COPY、VOLUME、ENTRYPOINT 指令。所有这些都是你在外部\
  \ Dockerfile 中配置的，或者使用 pom.xml 文件本身中的内联配置。你可以在以下截图中看到示例输出：\n\n![](img/0c87321919fa245e22f056c67ec70003_234_0.png)\n\
  \n\n\n最后，Docker 会输出刚刚创建的镜像 ID。让我们检查我们的镜像是否在镜像列表中，执行众所周知的 docker images 命令：\n\n```\n\
  docker images\n```\n\n如果一切顺利，你将在镜像列表中看到你刚刚创建的镜像，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_235_0.png)\n\
  \n镜像已在列表中，让我们通过执行以下命令来运行它：\n\n```\ndocker run -it -p8080:8080 hello-docker\n```\n\
  \n请注意，我们包含了 -p 选项以自动将暴露的端口映射到主机的端口。正如你可能记得的，我们在 pom.xml 配置中暴露了端口号 8080。执行命令后，你将看到与之前在本地运行\
  \ java -jar 命令时相同的输出。\n\n然而，现在它来自 Docker 容器中包含的应用，如下图所示：\n\n![](img/0c87321919fa245e22f056c67ec70003_236_0.png)\n\
  \n为了验证 Docker 容器中的应用程序确实能工作，再次将你的网页浏览器指向 http://localhost:8080 地址：\n\n![](img/0c87321919fa245e22f056c67ec70003_236_1.png)\n\
  \n另外，如果要手动运行 docker run，我们可以将 runtime 部分包含到项目的 pom.xml 文件中。整个 <image> 元素将类似于这样：\n\
  \n```\n<image>\n  <name>hello-docker</name>\n  <build>\n    <from>openjdk:8u102-jdk</from>\n\
  \    <ports>\n      <port>8080</port>\n    </ports>\n    <entryPoint>\n      <exec>\n\
  \        <args>java</args>\n        <args>--jar</args>\n        <args>/maven/hello-docker-${project.version}.jar</args>\n\
  \      </exec>\n    </entryPoint>\n    <assembly>\n      <descriptorRef>artifact</descriptorRef>\n\
  \    </assembly>\n  </build>\n  <run>\n    <ports>\n      <port>8080:8080</port>\n\
  \    </ports>\n  </run>\n</image>\n```\n\n现在你可以在一步中编译、打包、构建并运行镜像：\n\n```\nmvn clean\
  \ package docker:build docker:run\n```\n\n现在我们有一个完全可用的 Spring Boot 应用被打包为 Docker\
  \ 容器。它已准备好推送到 Docker Hub 或你自己的私有仓库。只要 Docker 可以运行，此应用程序将以相同的方式工作。想象一下，你为应用程序的用户节省了多少麻烦，操作系统配置、Java\
  \ 设置和配置、依赖管理等等。这只是一个相当简单的示例，但它应该能让你了解 fabric8.io Docker 插件有多灵活和有用。\n\n现在我们知道了如何打包\
  \ Java 应用程序，让我们做更多的事情。我们将打包一个示例前端应用程序。这将是一个在 node.js 上运行的 Angular.js 前端。\n\n## 打包\
  \ Angular.js 应用程序\n\n在本示例中，我们将创建一个在 node.js 运行时上运行的简单 Angular.js 应用程序。为了示例的清晰性，我们不会引入任何测试。正如\
  \ Spring Boot 应用程序的情况一样，我们的 Angular.js 应用程序将尽可能简单和精简。我们将了解如何将其容器化，而不是深入 Angular.js\
  \ 开发。当然，如果你还没有了解 Angular.js，欢迎你去了解它；它是一项很棒的技术。在开始之前，你需要安装 node.js。你可以从 node.js 网站\
  \ https://nodejs.org/en/ 获取安装程序。\n\n首先，让我们将应用程序的结构分为两部分。第一部分是前端，包含所有静态资源，如 JavaScript\
  \ 和 HTML 文件。第二部分是 node.js 后端，实际提供前端文件并响应 HTTP 请求。以 angular-docker-example 为父目录的文件夹结构最初将类似于以下截图：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_238_0.png)\n\n我们将使用 Bower 来管理第三方 JavaScript\
  \ 库。Bower 使用 bower.json 文件，在其中定义需要运行的所有应用程序。目前，我们只需要一个 angular.js 依赖项。以下是我们这个小应用程序的最小\
  \ bower.json 文件：\n\n```json\n{\n  \"name\": \"hello-docker-angular \",\n  \"ignore\"\
  : [\n    \"**/*\",\n    \"node_modules\",\n    \"bower_components\"\n  ],\n  \"\
  dependencies\": {\n    \"angular\": \"~1.5\"\n  }\n}\n```\n\n我们希望所有依赖项都下载到我们的前端应用程序文件夹中。因此，在执行\
  \ bower install 之前，我们需要告诉 Bower 我们希望这些文件去哪里。为此，我们需要创建一个 .bowerrc 文件并将其放在项目的根目录中。该文件的\
  \ JSON 内容将包含所有将被下载的依赖项的目的地：\n\n```\n{\n  \"directory\": \"frontend/bower_components\"\
  \n}\n```\n\n接下来，你首先想要安装 bower 本身，你可以在系统中全局安装它，通过执行 npm install 命令：\n\n```\nnpm install\
  \ -g bower\n```\n\n安装了 Bower 并放置了 .bowerrc 后，我们现在可以下载所有所需的前端依赖项。在项目的根文件夹中执行以下操作以开始下载过程：\n\
  \n```\nbower install\n```\n\n过了一会儿，Bower 完成下载所有依赖项（在我们的例子中只是 Angular.js）。它们将存在于\
  \ frontend/bower_components 目录中。由于只有一个依赖项，bower_components 目录中只会创建一个名为 angular 的目录，如下图所示：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_239_0.png)\n\n我们的 index.html 将作为应用程序前端部分的入口点，需要放在前端模块的根目录中，在我的例子中是\
  \ angular-docker-example\\frontend。它将类似于以下代码：\n\n```html\n<script src=\"bower_components/angular/angular.min.js\"\
  ></script>\n<script src=\"hello_world_docker.controller.js\"></script>\n<div ng-app=\"\
  HelloWorldApp\">\n    <div ng-controller=\"HelloWorldDockerController\">\n     \
  \   Your name: <input ng-model=\"name\" ng-keyup=\"sayHello()\">\n        <h1>{{greeting}}</h1>\n\
  \    </div>\n</div>\n```\n\n我们还需要向应用程序添加控制器（它将是 hello_world_docker.controller.js\
  \ 文件），它将对按键抬起事件做出反应。如果你将你的名字写在文本字段中，Angular 将用你的名字向你问好：\n\n```javascript\nangular.module('HelloWorldDockerApp',\
  \ [])\n    .controller('HelloWorldDockerController', function($scope) {\n      \
  \  $scope.sayHello = function () {\n            $scope.greeting = \"Hello from Docker-Angular,\
  \ \" +\n                $scope.name;\n        };\n    });\n```\n\n现在是测试我们应用程序的时候了，只需在你选择的网页浏览器中打开\
  \ index.html 文件并在文本字段中输入你的名字：\n\n![](img/0c87321919fa245e22f056c67ec70003_240_0.png)\n\
  \n好的，它按预期工作。让我们继续进行服务器部分——Web 应用程序需要被提供服务。当然，我们的简单应用程序通过直接在网页浏览器中运行 HTML 文件来工作。如果你以后决定包含更多\
  \ Angular 功能，例如路由，直接打开将不起作用。此外，服务器通常通过响应 HTTP 请求（例如 REST 调用）来完成应用程序。从这些调用中获取的响应然后可以在静态\
  \ Angular 页面上使用。我们可以使用任何我们喜欢的编程语言，例如 Java 和 Spring Boot 以及我们之前示例中使用的 docker-maven\
  \ 插件。这次，为了展示将应用程序手动打包到 Docker 容器的过程，我们将使用 node.js 运行时作为我们应用程序的后端。为了获取所需的 node.js\
  \ 依赖项，我们需要创建一个包含所有所需依赖项的 package.json 文件：\n\n```\n{\n  \"name\": \"hello-world-docker\"\
  ,\n  \"main\": \"index.js\",\n  \"dependencies\": {\n    \"express\": \"^4.12.3\"\
  ,\n    \"bower\": \"1.7.9\"\n  }\n}\n```\n\npackage.json 文件与 bower.json 相同，需要放在项目的根目录中。如果文件准备好了，我们可以运行\
  \ npm install 命令来下载所需的依赖项，在我们的例子中是 Express 和 Bower。执行以下命令：\n\n```\nnpm install\n\
  ```\n\n过了一会儿，node_modules 文件夹将被创建。它将包含 package.json 文件中提到的依赖项，我们的应用程序将使用它们。我们 node.js\
  \ 应用程序的入口点将是一个简单的基础 HTTP Web 服务器，从 frontend 目录提供静态内容。让我们将其命名为 app.js 并用以下内容填充它：\n\
  \n```\n'use strict';\nprocess.env.NODE_ENV = process.env.NODE_ENV || 'development';\n\
  var express = require('express');\nvar http = require('http');\nvar path = require('path');\n\
  var app = express();\nvar config = {\n  port: 8080,\n  root: path.normalize(path.join(__dirname,\
  \ '../frontend'))\n}\napp.use(express.static(config.root));\n```\n\n```\napp.route('/*')\n\
  \  .get(function (req, res) {\n    res.sendFile(path.join(config.root, 'index.html'));\n\
  \  });\nhttp.createServer(app).listen(config.port, function () {\n  console.log('hello-docker\
  \ server listening on %d, in %s mode',\n    config.port, app.get('env'));\n});\n\
  exports = module.exports = app;\n```\n\n如前一节所示，我们引入了 node.js Express 库来提供静态内容，配置端口号、根路径和\
  \ Express 路由。唯一特定的配置路由是 \"/*\"，这意味着前端目录中的 index.html 将作为对发往 http://localhost:8080/\
  \ 地址的每个 HTTP GET 请求的响应发送。\n\n我们 index.html 中包含的其他每个 URL，例如 http://localhost:8080/hello_world_docker.controller.js\
  \ 或 http://localhost:8080/bower_components/angular/angular.js 都会作为静态内容提供。然后我们只需启动服务器监听进程。这是我们\
  \ node.js Angular 应用中的最后一个文件。文件和文件夹的完整结构应与以下截图类似：\n\n![](img/0c87321919fa245e22f056c67ec70003_242_0.png)\n\
  \n再次强调，它只需要最少的实现；足以确保它正在运行并提供我们的静态内容。在常规应用中，你可能会引入更复杂的路由设置，将应用程序划分为模块等等。\n\n让我们通过在项目根目录执行\
  \ node 命令来运行我们的 node.js 服务器：\n\n```\nnode backend\\app.js\n```\n\n然后再次启动你的网页浏览器并输入以下地址：http://localhost:8080。你应该能看到我们的应用程序。这次它将由\
  \ node.js HTTP 服务器提供服务：\n\n![](img/0c87321919fa245e22f056c67ec70003_243_0.png)\n\
  \n如你所见，我们的应用程序运行正常，是时候将其放入 Docker 容器中了。我们需要决定用作基础镜像的镜像。如同往常一样，强烈建议使用官方 Docker 镜像。Docker\
  \ Hub 托管着官方的 node.js 仓库。我们将使用可用的 node 的长期支持（LTS）版本 argon。node:argon 镜像已附带安装、配置好并可直接使用的所有\
  \ node 和 npm 工具。选择特定基础镜像的决定为我们的 Dockerfile 奠定了基础。让我们在项目根目录创建 Dockerfile 并包含 FROM\
  \ 指令：\n\n```\nFROM node:argon\n```\n\n由于基础镜像已包含我们所需的所有工具，我们需要做的就是复制应用程序文件并触发依赖下载。我们项目的当前根目录将作为\
  \ Docker 的构建上下文，因此让我们使用以下指令创建工作目录：\n\n```\nWORKDIR /usr/hello-docker\n```\n\n现在，让我们先复制应用程序。我们将使用\
  \ COPY，但这里也可以使用 ADD。正如你在第 6 章《创建镜像》中记得的，ADD 比 COPY 能做更多的事情：它允许 <src> 为 URL，并且如果\
  \ ADD 的 <src> 参数是一个被识别的压缩格式的归档文件，它将被解压到镜像内部。话虽如此，在我们的情况下 COPY 已足够：\n\n```\nCOPY\
  \ backend /usr/hello-docker/backend\nCOPY frontend /usr/hello-docker/frontend\n\
  COPY .bowerrc bower.json package.json /usr/hello-docker\n```\n\n请注意，Docker 会通过 COPY\
  \ 指令自动创建目录，因此不需要 mkdir 命令。正如你从第 3 章《理解镜像和容器》和第 6 章《创建镜像》中记得的，每个单独的文件系统命令都会在镜像中创建另一层。创建额外的、不必要的层不是良好的实践。跳过\
  \ mkdir 命令我们可以避免一个额外的层。\n\n现在，是时候运行 npm install 和 bower install 命令了：\n\n```\nRUN\
  \ npm install\n```\n\n要做的最后一件事是暴露正确的端口。我们的应用程序监听 8080 端口，因此我们在 Dockerfile 中添加以下行：\n\
  \n```\nEXPOSE 8080\n```\n\n最后一步将通过添加 CMD 指令实际运行我们的 node.js 服务器：\n\n```\nCMD [\"\
  node\", \"backend/app.js\"]\n```\n\nDockerfile 的最终版本如下：\n\n```\nFROM node:argon\n\
  WORKDIR /usr/hello-docker\nCOPY backend /usr/hello-docker/backend\nCOPY frontend\
  \ /usr/hello-docker/frontend\nCOPY .bowerrc bower.json package.json /usr/hello-docker\n\
  RUN npm install\nEXPOSE 8080\nCMD [\"node\", \"/usr/hello-docker/backend/app.js\"\
  ]\n```\n\n就这样，我们完整的 Dockerfile 与我们的 node.js 应用程序一样小巧简单，但这应该足够了。让我们尝试构建镜像，执行 docker\
  \ build 命令，将当前目录作为构建上下文：\n\n```\ndocker build .\n```\n\n在长长的日志输出列表、下载 node.js 依赖项、添加与\
  \ Dockerfile 中指令相关的所有层之后，我们将获得刚刚构建的镜像的 ID：\n\n```\nSuccessfully built fa19b25b311e\n\
  ```\n\n让我们运行新镜像，将 node.js 服务器监听连接的端口映射到我们机器的 8080 端口号：\n\n```\ndocker run -p 8080:8080\
  \ fa19b25b311e\n```\n\n如果你现在再次打开网页浏览器，指向 http://localhost:8080，你将看到我们的问候应用程序，如以下截图所示：\n\
  \n![](img/0c87321919fa245e22f056c67ec70003_245_0.png)\n\n不过这次，它是从 Docker 容器内部提供的。再次想象，你刚刚为未来的客户节省了多少麻烦。操作系统：已检查。Node.js\
  \ 设置：已检查。所需的前端和后端依赖项：也已检查。一切都已准备好，可以在任何可以运行 Docker 引擎的地方运行。\n\n这些 Java 和 node.js\
  \ 示例应该能让你大致了解如何将自己的应用程序打包到 Docker 容器中。你可以使用 Maven 并自动化大部分工作，或者手动创建 Dockerfile。生成的镜像将准备好分发到远程注册表，并且它也是可移植的。在下一章我们将做某种总结。你将获得一些有用且高质量的额外资源，可以用来扩展你对\
  \ Docker 的知识。\n\n## 总结\n\n在本章中，我们在使用 Maven 构建 Java 应用程序的过程中使用了 Docker。我们知道 Maven\
  \ 有几个 Docker 插件，并且我们了解它们的功能和局限性。为了让你了解如何将自己的应用程序打包到容器中，我们使用 Docker 运行了 Java 和 JavaScript\
  \ 应用程序。当然，这只是冰山一角，但我希望你获得了将自己的应用程序打包的灵感，无论你使用什么语言或框架。有了迄今为止获得的 Docker 知识，你将能够将你编写的任何应用程序打包到容器中并发布到\
  \ Docker Hub。今天 Docker 的世界是巨大的，有很多东西可以探索。在本书的后面，我会指出我认为非常有用的其他资源；你可以用它们来进一步扩展你的\
  \ Docker 知识库。\n\n## 更多资源\n\n到目前为止，你已经掌握了大量的 Docker 知识。在阅读了前面的章节后，你现在可以搜索并拉取所需的镜像，并在其基础上构建自己的镜像。我们也知道如何打包现有的应用程序，无论是\
  \ Java Web 应用程序还是在 Node.js 上运行的前端 Angular.js 应用程序。我们可以通过手工完成或使用 Maven 来自动化。互联网上有许多地方可以让你进一步扩展知识。我将介绍我认为最有用的那些。\n\
  \n## 官方文档\n\n很难不推荐官方的 Docker 文档，其质量非常高。你可以在 https://docs.docker.com 找到它。这里有很多信息，从在各种平台上安装\
  \ Docker 开始，到拉取镜像、创建 Dockerfile、构建镜像以及将它们发布到远程注册表。这是一个刷新你已有的 Docker 知识的绝佳资源，但你也会在这里找到本书中未提及的大量信息。这包括，例如：\n\
  \n- Compose 是一个用于定义和运行多容器 Docker 应用程序的工具。通过此工具，你可以使用单个 Compose 文件来配置应用程序的服务。然后，使用单个命令，你可以从配置中创建并启动所有服务。\n\
  - Universal Control Plane 是 Docker 提供的企业级（你可以在自己的防火墙后面安装）集群管理解决方案。它帮助你从单个界面管理整个集群。\n\
  - Docker Trusted Registry 是 Docker 提供的企业级镜像存储解决方案——一个安全地存储和管理你使用的 Docker 镜像的地方。\n\
  - Docker Store，是找到作为 Docker 镜像分发的最佳受信任的商业和免费软件的地方。\n\n\n\n## 精彩的 Docker\n\n除官方非常全面的文档外，GitHub\
  \ 上还有一个精彩的（它甚至就叫这个名字——Awesome Docker）Docker 资源列表 https://github.com/veggiemonk/awesome-docker。\n\
  \n资源列表结构良好，从基础开始，例如解释 Docker 实际是什么以及如何在各种平台上安装它的教程。列表分为主要区域，其中包括：\n\n- **有用文章**：这包含与各种主题相关的文章列表。Docker\
  \ networking 将列出与 Docker 的网络内部相关的文章。Image optimizations 部分将告诉你如何创建尽可能小的镜像以及如何在考虑镜像大小的情况下创建\
  \ Dockerfile。安全部分列出了与安全最佳实践、审计、改进容器安全等相关的资源。性能相关文章将帮助你提高容器的性能。我发现的 Good Tips 部分最有用。它包含来自实际使用者的一系列技巧和窍门——这些非常宝贵。\n\
  - **工具**：这包含大量与 Docker 相关的开发人员和 DevOps 工具的参考。它将包括用于持续集成或持续交付、监控和日志记录的工具；列表无穷无尽，你肯定能找到有用的东西。\n\
  - **幻灯片/视频**：这里收录了作为演示幻灯片提供的额外资源列表，以及视频、网络研讨会等列表。\n- **人物、Twitter 账号和社区**：最后但同样重要的是，Docker\
  \ 世界中重要人物的目录。你可以找到值得关注的博客和 Twitter 账号列表，以及可以加入的 Docker 相关社区列表。\n\nAwesome Docker\
  \ 列表经常更新，贡献者众多。你总能在这里找到大量有趣的材料。例如，你会找到最新的 Docker Tips 文章和博客链接、实用的 Docker 第三方开发工具列表以及与众多持续集成/持续交付提供商集成的配方。如果你需要托管\
  \ Docker 容器，你可以获取几乎所有可用 Docker 托管提供商的信息。很难想象如果与 Docker 相关，你找不到想要的东西。甚至还有在 Raspberry\
  \ Pi 上运行 Docker 的链接。我的建议是克隆仓库，以便将来更新以找到更多有趣的链接。\n\n![](img/0c87321919fa245e22f056c67ec70003_249_0.png)\n\
  \n你可以克隆 Awesome-Docker 列表，并在执行 Git pull 时找到最新更改。\n\n如果你发现一些有趣的内容想与他人分享，欢迎为 Awesome-Docker-list\
  \ 做出贡献；作者感谢任何想为列表添加内容的人。\n\n![](img/0c87321919fa245e22f056c67ec70003_249_1.png)\n\
  \n要为 Awesome-Docker 列表做出贡献，请向仓库创建 pull request。\n\n我还想提到的另一个资源是 Andrew Odewahn 的\
  \ Docker Jumpstart。它也在 GitHub 上以标记文档的形式提供。你可以在 https://github.com/odewahn/docker-jumpstart/\
  \ 地址获取它。它非常简洁完整，适合复习 Docker 核心技能。\n\n## 培训\n\n如果你喜欢观看视频和网络研讨会，http://training.docker.com/\
  \ 网站包含大量课程，可帮助你提升并获取 Docker 知识。其中一些是自定进度培训视频（可在 http://training.docker.com/self-paced-training\
  \ 获取）。它们免费观看，我强烈推荐观看。每个系列都是一个一小时的视频网络研讨会。主题包括：\n\n- Docker 简介\n- Docker 基础\n- Docker\
  \ 运维\n\n如果免费资源不够，你还可以随时报名参加 Docker 团队的讲师指导培训。他们在 http://training.docker.com/instructor-led-training\
  \ 提供大量课程（当然是付费的）。这些包括以下具体主题：\n\n- Docker 管理和运维\n- Docker 数据中心培训系列\n- 部署 Docker 数据中心\n\
  - 使用通用控制平面管理容器服务\n\n还有很多其他内容。付费课程涵盖更高级和专业的主题。它们包含你可能在其他地方找不到的技巧，但它们并不是每天成功使用 Docker\
  \ 的必备条件。\n\n互联网上有大量与 Docker 相关的资源；不可能全部列在这里。其中大多数可免费访问，因此你可以进一步扩展 Docker 知识。但最好的学习方式是实践——开始尝试你的\
  \ Docker 镜像：拉取、创建、构建和发布。如果你将 Docker 引入日常工作，你很快就会想知道过去没有 Docker 是怎么工作的。我希望使用 Docker\
  \ 对你来说和对我一样愉快。\n"
