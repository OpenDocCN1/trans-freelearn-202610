- pgno: 68
  md: 'To see the difference between both images, we can use the following check for
    folders:


    ```

    $ docker run busybox [ -d /home/test ]

    && echo ''Directory found'' || echo

    ''Directory not found''

    $ docker run busybox_modified [ -d

    /home/test ] && echo ''Directory found''

    || echo ''Directory not found''

    ```


    Now we have two different images (busybox and busybox_modified) and we have a
    container made from busybox that also contains the change (the new folder, /home/test).
    The commit command takes a container''s top-level read/write layer and turns it
    into a read-only layer. In effect, the container (no matter if it''s running or
    stopped) becomes new, read-only, immutable image.


    When the container is deleted the writable layer is also deleted.


    Creating images by altering the top writable layer in the container is useful
    when debugging and experimenting, but it''s usually better to use Dockerfile to
    manage your images in a documented and maintainable way. We will do it in Chapter
    6, Creating Images.


    ![](img/0c87321919fa245e22f056c67ec70003_68_0.png)


    A container is a stateful instantiation of an image.


    We have been using a couple of container-related commands in this section, let''s
