    To run a container, use the same command we used in the previous chapter when
    we tested our installation, docker run:


    ```

    $ docker run [OPTIONS] IMAGE [COMMAND]

    [ARG...]

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_63_0.png)


    You can have many running containers of the same image.


