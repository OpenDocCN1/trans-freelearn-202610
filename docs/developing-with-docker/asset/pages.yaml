    | Type | Protocol | Port Range | Source |

    |------|----------|------------|--------|

    | SSH | TCP | 22 | Anywhere 0.0.0/0 |

    | HTTP | TCP | 80 | Anywhere 0.0.0/0 |

    | Add Rule |  |  |  |


    Now comes the important part. To be able to remotely log into your instance, you
    will need a key pair. It consists of a public and private key file that you must
