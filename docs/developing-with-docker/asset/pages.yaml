    n. It''s also available on the GitHub in the form of mark-up documentation. You
    can get it at the https://github.com/odewahn/docker-jumpstart/ address. It''s
    very concise and complete, good for refreshing essential Docker skills.


    # Training


    If you prefer watching videos with webinars, the http://training.docker.com/ site
    contains a lot of courses to improve and gain knowledge about Docker. Some of
    them are self-paced training videos (available at http://training.docker.com/self-paced-training).
    They are free to watch and I highly recommend watching them. Each of the series
    is a one hour long video webinar. The subjects include:


    +   - Introduction to Docker

    +   - Docker fundamentals

    +   - Docker operations'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'If free resources are not enough, you can always sign-up to instructor-led
    training from the Docker team. They have a lot of courses available (paid, of
    course) at http://training.docker.com/instructor-led-training. These include specific
    subjects like:


    +   - Docker administration and operations

    +   - Docker datacentre training series

    +   - Deploying Docker datacenter

    +   - Managing container services with universal control plane


    and many others. The paid courses cover more advanced and specialized topics.
    They contain tips which you will probably not find any where else but they are
    not mandatory for working successfully with Docker on a daily basis.


    There are a lot of Docker related resources available on the Internet; it is impossible
    to fit them all in here. Most of them are free to access, so your can further
    extend you Docker knowledge. But the best way of learning is doing – start experiment
    with your Docker images: pull, create, build and publish. If you introduce Docker
    in to your daily routine, you will quickly wonder how you worked without Docker
    in the past. I hope that working with Docker will be as pleasant an experience
    for you, as it is for me.'
  merge: -1
  img_proc: true
