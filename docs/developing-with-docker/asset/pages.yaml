- pgno: 70
  md: 'The first component in this system is the registry. The images you build will
    be stored in a remote registry for others to use. Docker registry is a service
    (an application, in fact) that stores your Docker images. Docker Hub is an example
    of the publicly available registry – it''s free and serves a huge, constantly
    growing collection of existing images. We are going to cover Docker Hub in detail
    in Chapter 5, Finding Images. There are, of course, other registries available
    on the Internet, such as Artifactory (https://www.jfrog.com/artifactory), Google
    Container Registry (https://cloud.google.com/container-registry), and Quay (https://quay.io).


    The **repository**, on the other hand, is a collection (namespace) of related
    images, usually providing different versions of the same application or service.
    In other words, it is a collection of different docker images with the same name
    and different tags. If your app is named “hello-world” and your username (or namespace)
    for the Registry is `developingWithDocker`, then your image will be placed in
    the `developingWithDocker/hello-world` repository. You can tag an image, and store
    multiple versions of that image with different IDs in a single named repository,
    access different tagged versions of an image with a special syntax, such as `username/image_name:tag`.
    A Docker repository is identified by a URI and can either be public or private.
    The URI looks like:


    ```

    {registryAddress}/{namespace}/{repositoryName}:{tag}

    ```


    The Docker Hub is the default registry and Docker will pull images from the Docker
    Hub if you do not specify a registry address.


    ![](img/0c87321919fa245e22f056c67ec70003_70_0.png)


    The registry address can be omitted for repositories hosted with Docker Hub.


    We have mentioned tags earlier in this chapter – we will get back to them in detail
    in Chapter 6, Creating Images. A registry typically hosts multiple Docker repositories.


    The difference between Registry and repository can be confusing at the beginning,
    so let''s describe what will happen if you execute the following command:


    ```

    $ docker pull ubuntu:14.04

    ```'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'The command downloads the image tagged 14.04 within the ubuntu repository from
    the Docker Hub registry. The Ubuntu repository doesn''t use a username, so the
    namespace part is omitted in this example.


    Let''s summarize the repository-related commands in a table:


    | Repository-related command | Description |

    |---|---|

    | login | This is used to log in to a Docker registry |

    | logout | This is used to log out from a Docker registry |

    | pull | This is used to pull an image or a repository from a registry |

    | push | This is used to push an image or a repository to a registry |

    | search | This is used to search the Docker Hub for images |


    Although the Docker Hub is public, you get one private repository for free with
    your Docker Hub user account, but it''s not usable for organizations you''re a
    member of. If you need more accounts, you can upgrade your Docker Hub plan, which
    will not be free of charge. There are a couple of payment plans based on the number
    of private repositories you need. We will cover the Docker Hub in detail in Chapter
    5, Finding Images, and Chapter 8, Publishing Images.


    Private registries, on the other hand, can be set up just for you or other users
    in your organization, in your company''s own network.


    ![](img/0c87321919fa245e22f056c67ec70003_71_0.png)


    You can create the private registry behind your company''s firewall.


    To run your totally private registry, you can use the Docker Hub itself. It''s
    an open source application, and is also available as a Docker image. The simplest
    case is just running the following command:


    ```

    $ docker run -d -p 5000:5000 --name

    registry registry:2

    ```


    As a result, you will start a private registry on your own machine.'
