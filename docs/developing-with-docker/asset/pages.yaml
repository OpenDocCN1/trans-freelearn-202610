- pgno: 237
  md: "Alternatively, to running docker run by hand, we can include the runtime section\
    \ into our project's pom.xml file. The whole <image> element will look similar\
    \ to this:\n\n```\n<image>\n  <name>hello-docker</name>\n  <build>\n    <from>openjdk:8u102-jdk</from>\n\
    \    <ports>\n      <port>8080</port>\n    </ports>\n    <entryPoint>\n      <exec>\n\
    \        <args>java</args>\n        <args>--jar</args>\n        <args>/maven/hello-docker-${project.version}.jar</args>\n\
    \      </exec>\n    </entryPoint>\n    <assembly>\n      <descriptorRef>artifact</descriptorRef>\n\
    \    </assembly>\n  </build>\n  <run>\n    <ports>\n      <port>8080:8080</port>\n\
    \    </ports>\n  </run>\n</image>\n```\n\nNow you can compile, package, build,\
    \ and run image in one step:\n\n```\nmvn clean package docker:build docker:run\n\
    ```\n\nNow we have a fully working Spring Boot application packaged as the Docker\
    \ container. It's ready to be pushed into Docker Hub or your own private registry.\
    \ Wherever the Docker can run, this application will work the same way. Imagine\
    \ how much trouble you have saved the users of your application, operating system\
    \ configuration, Java setup and configuration, the dependency management, and\
    \ so on. That was a rather simple example, but it should give you an idea of how\
    \ flexible and useful fabric8.io Docker plugin can be."
  merge: -1
  img_proc: true
- pgno: 238
  md: "Now that we know how to package Java applications, let's do more. We are going\
    \ to pack sample frontend application. This will be Angular.js frontend running\
    \ on node.js.\n\n# Packaging Angular.js application\n\nIn this example, we are\
    \ going to create a simple Angular.js application which runs on node.js runtime.\
    \ For the purpose of clarity of example, we are not going to introduce any tests.\
    \ As it was the case with SpringBoot application, our Angular.js application will\
    \ be as simple and tiny as possible. We are going to understand how to containerize\
    \ it instead of diving into Angular.js development. Of course, you are more than\
    \ welcome to get to know Angular.js if you haven't done this already; it's a wonderful\
    \ technology. Before you start, you will need to have node.js installed. You can\
    \ get the installer from node.js website at https://nodejs.org/en/.\n\nFirst,\
    \ let's divide the structure of our application in two parts. The first one will\
    \ be frontend, will all the static resources such as Java Scripts and HTML files.\
    \ The second one will be node.js backed, actually serving our frontend files and\
    \ responding to HTTP request. The folder structure, having the angular-docker-example\
    \ as a parent directory, would initially look similar to the following screenshot:\n\
    \n![](img/0c87321919fa245e22f056c67ec70003_238_0.png)\n\nWe are going to use Bower\
    \ to manage third-party JavaScript libraries. Bower uses the bower.json file in\
    \ which you define all the application that need to run. At this time, we only\
    \ need a single angular.js dependency. Here's our little application's minimal\
    \ bower.json file:\n\n```\n```json\n{\n  \"name\": \"hello-docker-angular \",\n\
    \  \"ignore\": [\n    \"**/*\",\n    \"node_modules\",\n    \"bower_components\"\
    \n  ],\n  \"dependencies\": {\n    \"angular\": \"~1.5\"\n  }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 239
  md: "We would like all the dependencies to be downloaded into our frontend application\
    \ folder. So, before we execute bower install, we need to tell Bower where we\
    \ want those files to go. To achieve this, we need to create a .bowerrc file and\
    \ put it in the root directory of our project. The JSON content of the file will\
    \ contain the destination for all the dependencies which are going to be downloaded:\n\
    \n```\n{\n  \"directory\": \"frontend/bower_components\"\n}\n```\n\nNext, you\
    \ will want to install bower itself first, you can do it globally in your system,\
    \ by executing the npm install command:\n\n```\nnpm install -g bower\n```\n\n\
    Having Bower installed and .bowerrc in place, we can now download all the required\
    \ front-end dependencies. Execute the following in the root folder of our project\
    \ to begin the download process:\n\n```\nbower install\n```\n\nAfter a while,\
    \ Bower finishes downloading all the dependencies (it will be just Angular.js\
    \ in our case). They will be present in the frontend/bower-components directory.\
    \ As it is a single dependency, only one directory named angular will be created\
    \ in the bower_components directory, as you can see in the following screenshot:\n\
    \n![](img/0c87321919fa245e22f056c67ec70003_239_0.png)"
  merge: -1
  img_proc: true
- pgno: 240
  md: "Our index.html, which will be an entry point to our application's frontend\
    \ part, needs to be placed in the root of the frontend module, which is angular-docker-example\\\
    frontend in my case. It will look similar to the following code:\n\n```\n```html\n\
    <script src=\"bower_components/angular/angular.min.js\"></script>\n<script src=\"\
    hello_world_docker.controller.js\"></script>\n<div ng-app=\"HelloWorldApp\">\n\
    \    <div ng-controller=\"HelloWorldDockerController\">\n        Your name: <input\
    \ ng-model=\"name\" ng-keyup=\"sayHello()\">\n        <h1>{{greeting}}</h1>\n\
    \    </div>\n</div>\n```\n```\n\nWe also need do add the controller (it will be\
    \ hello_world_docker.controller.js file) to our application which will react to\
    \ the key up event. If you write your name in the text field, Angular will greet\
    \ you by your name:\n\n```\n```javascript\nangular.module('HelloWorldDockerApp',\
    \ [])\n    .controller('HelloWorldDockerController', function($scope) {\n    \
    \    $scope.sayHello = function () {\n            $scope.greeting = \"Hello from\
    \ Docker-Angular, \" +\n                $scope.name;\n        };\n    });\n```\n\
    ```\n\nNow it's time to test our application, simply open the index.html file\
    \ in the web browser of your choice and type your name in the text field:\n\n\
    ![](img/0c87321919fa245e22f056c67ec70003_240_0.png)"
  merge: -1
  img_proc: true
- pgno: 241
  md: "Ok, it's working as intended. Let's proceed to the server part-the web application\
    \ needs to be served. Of course, our simple application works by running the HTML\
    \ file directly in the web browser. If you decide to include more Angular features\
    \ later, for example routing, it will not work by opening directly. Also, the\
    \ server usually completes the application by responding to HTTP requests, such\
    \ as REST calls for example. The response taken from those calls can be then used\
    \ on the static Angular pages. We could use any programming language we like,\
    \ for example Java and Spring Boot with docker-maven plugin as we did in the previous\
    \ example. This time, to present the manual way of packaging an application into\
    \ Docker container, we are going to use node.js runtime as a backend for our application.\
    \ To get the required node.js dependencies, we will need to create package.json\
    \ file with all the required dependencies:\n\n```\n{\n  \"name\": \"hello-world-docker\"\
    ,\n  \"main\": \"index.js\",\n  \"dependencies\": {\n    \"express\": \"^4.12.3\"\
    ,\n    \"bower\": \"1.7.9\"\n  }\n}\n```\n\nThe package.json file, the same as\
    \ bower.json, needs to be placed in the root directory of our project. If the\
    \ file is ready, we can run the npm i»¿ install command to download the needed\
    \ dependencies, which will be Express and Bower in our case. Execute the following\
    \ command:\n\n```\nnpm install\n```\n\nAfter a while, the node_modules folder\
    \ will be created. It will contain the dependencies mentioned in the package.json\
    \ file and our application will use them. The entrypoint»¿ for our node.js application\
    \ will be a simple and basic HTTP web server, serving static content from the\
    \ frontend directory. Let's name it app.js and fill it out with this content:\n\
    \n```\n'use strict';\nprocess.env.NODE_ENV = process.env.NODE_ENV || 'development';\n\
    var express = require('express');\nvar http = require('http');\nvar path = require('path');\n\
    var app = express();\nvar config = {\n  port: 8080,\n  root: path.normalize(path.join(__dirname,\
    \ '../frontend'))\n}\napp.use(express.static(config.root));\n```"
  merge: -1
  img_proc: true
- pgno: 242
  md: "```\napp.route('/*')\n  .get(function (req, res) {\n    res.sendFile(path.join(config.root,\
    \ 'index.html'));\n  });\nhttp.createServer(app).listen(config.port, function\
    \ () {\n  console.log('hello-docker server listening on %d, in %s mode',\n   \
    \ config.port, app.get('env'));\n});\nexports = module.exports = app;\n```\n\n\
    As you can see in the preceding section, we include node.js Express library to\
    \ serve our static context, configure port number, and the root path and Express\
    \ routes. The only specific configured route is \"/*\", meaning that index.html\
    \ from the frontend directory will be sent as a response to every HTTP GET request\
    \ to http://localhost:8080/ address.\n\nEvery other URL, such as http://localhost:8080/hello_world_docker.controller.js\
    \ or http://localhost:8080/bower_components/angular/angular.js which we include\
    \ in our index.html will be served as static context. Then we just start the server\
    \ listening process. This is the last file in or node.js Angular application.\
    \ The complete structure of files and folders should look similar to the following\
    \ screenshot:\n\n![](img/0c87321919fa245e22f056c67ec70003_242_0.png)"
  merge: -1
  img_proc: true
- pgno: 243
  md: 'Again, it needs minimal implementation; just enough to make sure it''s running
    and serving our static content. In the normal application you would probably introduce
    a more complex routes setup, divide the application into modules, and so on.


    Let''s run our node.js server, by executing the node command in the root of our
    project:


    ```

    node backend\app.js

    ```


    Then again, fire up your web browser and enter the following address: http://localhost:8080.
    You should see our application. This time, it will be served from node.js HTTP
    server:


    ![](img/0c87321919fa245e22f056c67ec70003_243_0.png)


    As you can see our application works properly, it''s time to put it into the Docker
    container. We need to decide the image that we will use as a base image. As always,
    using official Docker images is highly recommended. The Docker Hub hosts official
    node.js repository. We are going to use the long-term support (LTS) version arg
    on of node available. The node:argon image comes with all the node and npm tools
    installed, configured and ready to use. The decision about picking up the specific
    base image gives us the foundation for our Dockerfile. Let''s create a Dockerfile
    in the root of the project and include the FROM instruction:


    ```

    FROM node:argon

    ```


    As the base image contains all the tools we need already, all we need to do is
    copy our application files and trigger the dependency downloading. The current
    root directory of our project will be a built context for Docker, so let''s create
    a workdir using the following instruction:


    ```

    WORKDIR /usr/hello-docker

    ```'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'Now, let''s copy the application first. We will use COPY, but we could just
    also use ADD here. As you remember from Chapter 6, Creating Images, ADD can do
    more than COPY: it allows <src> to be a URL and if the <src> parameter of ADD
    is an archive in a recognized compression format, it will be unpacked inside the
    image. That said COPY is enough in our case:


    ```

    COPY backend /usr/hello-docker/backend

    COPY frontend /usr/hello-docker/frontend

    COPY .bowerrc bower.json package.json /usr/hello-docker

    ```


    Note that the Docker will automatically create a directory with the COPY instruction
    and hence mkdir command is not needed. As you remember from the Chapter 3, Understanding
    Images and Containers and Chapter 6, Creating Images, every separate filesystem
    command would create another layer in the image. Creating additional, unneeded
    layers is not the good practice. Skipping mkdir command we can avoid one additional
    layer.


    Now, it''s time to run the npm i»¿ install and bower install commands:


    ```

    RUN npm install

    ```


    The last thing to do would be to expose the proper port. Our application listens
    of port 8080, so we add the following line to the Dockerfile:


    ```

    EXPOSE 8080

    ```


    The last step will be actually running our node.js server, by adding the CMD instruction:


    ```

    CMD ["node", "backend/app.js"]

    ```


    The final version of the Dockerfile is like:


    ```

    FROM node:argon

    WORKDIR /usr/hello-docker

    COPY backend /usr/hello-docker/backend

    COPY frontend /usr/hello-docker/frontend

    COPY .bowerrc bower.json package.json /usr/hello-docker

    RUN npm install

    EXPOSE 8080

    CMD ["node", "/usr/hello-docker/backend/app.js"]

    ```'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'That''s it, our complete Dockerfile is as tiny and simple as our node.js application,
    but that should be enough. Let''s try and build the image, executing the docker
    build command, giving the current directory a build context:


    ```

    ```

    docker build .

    ```

    ```


    After a long listing of log output, downloading node.js dependencies, adding all
    the layers related to the instructions in the Dockerfile, we will be given the
    ID of the image we have just built:


    ```

    ```

    Successfully built fa19b25b311e

    ```

    ```


    Let''s run the fresh image, mapping the port on which node.js server listens for
    connections to our machine port number 8080:


    ```

    ```

    docker run -p 8080:8080 fa19b25b311e

    ```

    ```


    If you now open a web browser again, pointing to http://localhost:8080, you will
    see our greeting application, as seen in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_245_0.png)


    This time, however, it''s being served from inside a Docker container. Again,
    imagine how much hassle you have just saved for your future customer. Operating
    system: checked. Node.js setup: checked. All the needed frontend and backend dependencies:
    also checked. Everything is ready to run everywhere a Docker engine can be run.'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'Those Java and node.js examples should give you an overview of how you can
    package your own application into a Docker container. You can use Maven and automate
    most of the things or you can create a Dockerfile manually. The resulting image
    will be ready to distribute into the remote registry and it will be also be portable.
    In the next chapter we will do some kind of a summary. You will be given some
    useful and high-quality additional resources, which you can use to extend your
    knowledge about Docker.


    # Summary


    In this chapter, we have been using Docker during the build process of the Java
    applications using Maven. We know that there are a couple of Docker plugins for
    Maven and we know their functionality and limitations. To give you an idea of
    how to package your own applications into the container, we have run Java and
    JavaScript applications using Docker. Of course, this is just the tip of the iceberg,
    but I hope you were given some inspirations to package your own applications,
    no matter what language or framework you use. Having the Docker knowledge you
    have acquired so far, you will be able to pack any application that you wrote
    into the container and publish it on the Docker Hub. The world of Docker is enormous
    today, there''s a lot to explore. Further in the book, I will point you to other
    resources that I find very useful; you can use them to further extend your Docker
    knowledge base.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# More Resources


    You have a lot of Docker knowledge at this point. After reading the previous chapters,
    you can now search and pull the image you need and build your own on top of it.
    We also know how to package an existing application, let it be a Java web application
    or a front end Angular.js application working on Node.js. We can do it by hand
    or use Maven for automating things. There are a lot of places on the Internet
    where you can extend your knowledge further. I''m going to present the ones I
    find most useful.


    # Official documentation


    It''s hard not to recommend the official Docker documentation, which is of very
    high quality. You will find it at https://docs.docker.com. There is a lot of information
    here, starting from installing Docker on various platforms and going through pulling
    images, creating Dockerfiles, building images, and publishing them into the remote
    Registry. It''s a great resource for refreshing the Docker knowledge you already
    have, but you will also find here a lot of information which was not mentioned
    in this book. This includes, for example:


    +   - Compose is a tool for defining and running multi-container Docker applications.
    With this tool you can use a single Compose file to configure your application''s
    services. Then, using a single command, you can create and start all the services
    from your configuration.

    +   - Universal Control Plane is the enterprise-grade (you can install it behind
    your own firewall) cluster management solution from Docker. It helps you manage
    your whole cluster from a single interface.

    +   - Docker Trusted Registry is an enterprise-grade image storage solution from
    Docker–a secure place to store and manage the Docker images you use.

    +   - The Docker Store, which is the place to find the best-trusted commercial
    and free software distributed as Docker Images.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Awesome Docker


    Apart from the official, very comprehensive documentation, there is an awesome
    (it''s even named that way – Awesome Docker) list of Docker resources available
    on GitHub https://github.com/veggie... ://github.com/veggie.../awesome-docker.


    The list of resources has a good structure and begins with the basics like tutorials
    explaining what Docker actually is and how to install it on various platforms.
    The list is divided into main areas, which, among others, include:


    +   - **Useful articles**: This contains a list of articles related to various
    subjects. Docker networking will list articles related to Docker''s networking
    internals. The Image optimizations section will tell you how to create the smallest
    possible images and how to create Dockerfiles with the image size in mind. The
    security section lists resources related to security best practices, auditing,
    improving container security, and so on. Performance related articles will let
    you improve the performance of the containers. The Good Tips section is what I
    found the most useful. It contains a list of tips and tricks, coming from the
    people who use it in real life – these are very valuable.

    +   - **Tools**: This contains references to a lot of developer and devop tools
    that are related to Docker. It will include tools for doing continuous integration
    or continuous delivery, monitoring, and logging; the list is endless, you can
    find something useful for sure.

    +   - **Slides/Videos**: This holds a list of additional resources available as
    slides for presentations and a list of videos, webinars, and so on.

    +   - **People, twitter accounts and communities**: And last but not least, a
    catalogue of people important in the Docker world. You will be able to find a
    list of blogs, and twitter accounts worth following and also a list of Docker
    related communities you can join.


    The Awesome Docker list is updated very often and has a lot of contributors. You
    will always find a lot of interesting material here. For example, you will find
    links to the most up-to-date Docker Tips articles and blogs, a list of useful
    Docker third-party developer tools and recipes for integration with many continuous
    integration/continuous delivery providers. If you need to host your Docker container,
    you can get the information about almost all available Docker hosting providers.
    It''s really hard to imagine that you wouldn''t be able to find something you
    are looking for if it''s related to Docker. There are even links for running Docker
    on Raspberry Pi. My advice is to clone the repository to be able to update in
    the future to find more interesting links.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/0c87321919fa245e22f056c67ec70003_249_0.png)


