- pgno: 232
  md: 'Our application is now packaged as a `helloDocker-0.1.0.jar` file in the target
    directory of the project. Let''s do the trial run and execute the command:


    ```

    java -jar target/helloDocker-0.1.0.jar

    ```


    The spring application will boot and present some log output on the console:


    ![](img/0c87321919fa245e22f056c67ec70003_232_0.png)


    By default, Spring Boot applications listen to HTTP requests on port 8080; we
    will expose this port to the Docker image in a while. At the same time, enter
    the http://localhost:8080 in your web browser, to verify that our application
    actually works properly and responds to HTTP requests. You should see the message
    that we are hoping to see:


    ![](img/0c87321919fa245e22f056c67ec70003_232_1.png)'
  merge: -1
