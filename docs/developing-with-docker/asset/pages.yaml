    # Installing on the cloud — AWS


    In the next chapters, we will show how to create the Docker instance remotely,
    using the Docker Machine. This time we will just install Docker and run the sample
    image on Amazon EC2 cloud manually. If you have a running Linux on the EC2 Cloud,
    the Docker installation procedure is almost identical as for any Linux system.
    Let''s begin with creating the first Linux instance.'
  merge: -1
