    \ can be of course used in the Webhook implementation, to, for example, pull the\
    \ resulted image and deploy it somewhere.\n\nWebhooks can be used to further automate\
    \ some things and create continuous deployment setup. All you need to is define\
    \ the POST endpoint and have some application (a web server, actually) that listen\
    \ for requests at the specified endpoint, Docker will do the POST with all the\
    \ details. Probably the best use for Webhooks is a continuous deployment setup.\
    \ There's a Docker management tool, for example, called Shipyard, available at\
    \ https://shipyard-project.com. If Docker Hub builds a new Docker image (either\
    \ triggered by a push to the source code repository or using the Build Trigger),\
    \ it will send a Webhook notification to Shipyard using the HTTP POST request.\
    \ Shipyard will check the Webhook key for authorization, and then pull latest\
    \ image from the Docker Hub. As a result, Shipyard will stop and remove your current\
    \ containers and will deploy a new one. Another useful application which allows\
    \ you to set up a continuous deployment pipeline is the Swarm Inception. It's\
    \ a simple application available at GitHub https://github.com/giantswarm/swarm-inception.\
    \ This is actually a small server, which listens for POST requests. Using Swarm\
    \ Inception you can do continuous container delivery using Docker Hub's image\
    \ builder and Giant Swarm. Again, when the build completes, Docker Hub will call\
    \ this service's Webhook handler, which in turn triggers a deployment or update\
    \ of the image built by Docker Hub onto Giant Swarm's public cloud. Giant Swarm\
    \ is a cloud application, where you can simply deploy your Docker Containers on\
    \ your fully-managed Kubernetes Cluster in seconds."
  merge: -1
  img_proc: true
- pgno: 218
  md: 'While the Swarm Inception can be used out-of-the-box to implement continuous
    deployment, it''s also a very good reference document for implementing your own
    Webhook handlers and doing continuous deployments with Docker Hub''s builder service.
    While Giant Inception uses Giant Swarm''s APIs to deal with the containers, you
    can easily fork or copy the repository and implement your own continuous delivery
    with other services.


    There are some other great starting points to implement your own Webhook listening
    servers. The first one is the project called `dockerhook-webhook-listener`, available
    on GitHub `https://github.com/cpuguy83/dockerhub-webhook-listener`. It''s just
    a plain and simple web server written in Go (the same language in which Docker
    itself is developed, by the way). Another great one is the `Captain Hook`, again
    available on GitHub: `https://github.com/bketelsen/captainhook`. It''s a generic
    Webhook endpoint that runs scripts based on the URL called. Each script you create
    in the `configdir` of the Captain Hook will be executed when the corresponding
    endpoint is called.


    ![](img/0c87321919fa245e22f056c67ec70003_218_0.png)


    Captain Hook itself is available as a Docker image, so you can pull and use it
    in no time.


    You can pull Captain Hook from the Docker Hub by executing well-known `docker
    pull` command:


    ```

    docker pull ablas/docker-captainhook

    ```


    Next, you run Captain Hook using the `docker run` command, exposing the `8080`
    port and providing the scripts path for your Webhooks handlers as a `HOOKS_PATH`
    environment variable:


    ```

    docker run -d -p 8080:8080 -v `${HOOKS_PATH}`:/webhooks ablas/docker-captainhook

    ```


    You can put your Webhook handlers in any folder, just note that you''ll need to
    map it to the `/webhooks` directory. Each one script will correspond to one listening
    endpoint. For example, if you put a script called `deployMyContainer.json`, it
    will be executed if Docker Hub create a `POST` request to the following URL:


    ```

    http://your.captainhook.url/deployMyContainer

    ```'
  merge: -1
  img_proc: true
- pgno: 219
  md: "The handler script can contain a reference to the shell script. After the specific\
    \ POST endpoint has been hit, the shell script will take over and,for example,\
    \ deploy a fresh image. Take a look at this Captain Hook script:\n\n```\n{\n \
    \ \"scripts\": [\n    {\n      \"command\": \"/usr/jarek/webhook.sh\",\n     \
    \ \"args\": [\n        \"3\"\n      ]\n    }\n  ]\n}\n```\n\nIn the referenced\
    \ shell script, we need to do something useful, actually. All we have to do is\
    \ to parse the incoming JSON payload. We can do it using the JSON parsing jq tool,\
    \ about which we know from the previous Chapter 7, Running Containers. It's available\
    \ at https://stedolan.github.io/jq/. We have been using jq to parse the docker\
    \ inspect command output. At this time we can use the jq tool to parse the incoming\
    \ data and to pull the image from the Docker Hub and run it.\n\nAfter reading\
    \ this chapter, you should be aware that Webhooks are powerful feature. The listening\
    \ endpoint can be written in any language of your choice, let it be Java, Scala,\
    \ or C#. There is a lot of ready-to-use API for dealing with Docker containers\
    \ available for free. You can, of course, use them in your Webhook handler implementation\
    \ to pull and deploy images. We are going to cover some of them in the next chapter.\
    \ To give you some inspirations, here are some you can pick from:\n\n+   - **Java\
    \ Docker API client**: Available on GitHub https://github.com/docker-java/docker-java.\
    \ It's based on Jersey REST library.\n+   - **Docker.DotNet**: It's a C# client\
    \ available on GitHub https://github.com/ahmetalpbalkan/Docker.DotNet.\n+   -\
    \ **docker-client**: It's for Groovy https://github.com/gesellix/docker-client\n\
    +   - **tugboat**: It's available at https://github.com/softprops/tugboat, is\
    \ a Scala library for dealing with the Docker containers.\n\n![](img/0c87321919fa245e22f056c67ec70003_219_0.png)\n\
    \nAn always up-to-date API list is available at Docker website at the https://docs.docker.com/engine/reference/api/remote_api_client_libraries/address."
  merge: -1
  img_proc: true
- pgno: 220
  md: 'There''s so many of them that there''s a huge chance you will find something
    for the programming language of your choice. Knowing the incoming payload structure
    and having a Docker API library it''s easy to implement your own listening Webhook
    handlers. If you have Webhooks defined in your automated builds, Webhook handlers
    running and listening for calls, your deployments can be launched seamlessly from
    GIT push command. It will work smoothly without needing any manual intervention
    from anyone. It''s true continuous deployment. Docker can be useful also in your
    existing development or continuous delivery flow, using Jenkins, or Maven for
    example. This is what we are going to cover in the next chapter.


    # Summary


    In this chapter, we have learned how to tag and push our images to the remote
    registry making it available for others to use. We also know how to setup the
    automated build feature using the integrated GitHub or BitBucket account. Automatic
    Build repository is a great feature; it allows you to keep the source of your
    images (including of course, Dockerfiles) and the images on the DockerHub in sync.
    We also know how to use Webhooks feature to do some more automation, for example
    continuous deployment. In the next chapter, we will go a little bit more into
    using Docker, we will be utilizing Docker to package our Java and JavaScript application
    into the container.'
