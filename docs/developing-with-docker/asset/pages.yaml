- pgno: 28
  md: '# 2


    # Installing Docker


    In this chapter, we will find out how to install Docker on Windows, Mac OS, and
    Linux operating systems. There will also be step-by-step instructions on how to
    set up Docker in the cloud and Amazon EC2 will be used as an example. Next, we
    will run the sample `hello-world` image to verify the setup and check whether
    everything works fine after the installation process. We are going to cover the
    following topics in this chapter:


    +   - Hardware requirements for running Docker

    +   - Installing on Windows

    +   - Installing on Mac OS

    +   - Installing on Linux

    +   - Installing on the Amazon AWS cloud


    Docker installation is quite straightforward, but there are some things you will
    need to focus on to make it run. We will point them out to make the installation
    process painless.


    ![](img/0c87321919fa245e22f056c67ec70003_28_0.png)


    > It''s worth mentioning that Linux is the natural environment for Docker. The
    Docker engine is built on top of the Linux kernel. To make it run on Windows or
    Mac OS, the Linux kernel needs to be virtualized.


    The Docker Engine could be run on the Mac and MS Windows operating systems by
    using the lightweight Linux distribution, made specifically to run Docker containers.
    It runs completely from RAM, weighs just several dozens of megabytes, and boots
    in a couple of seconds. During the installation of the main Docker package—the
    Docker Toolbox—the virtualization engine VirtualBox will also be installed by
    default. Therefore, there are some special hardware requirements for your machine.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Hardware requirements


    To use Docker, you will need some reasonably new machine, that supports hardware-level
    virtualization: VT-x for Intel-based PCs and AMD-V for AMD processors. Most of
    the Mac machines support it out of the box, but for PC you will need to make sure
    it''s turned on and perhaps enable it in the BIOS settings. It will be different
    for different BIOS, just look for VT-x / AMD-V switch.


    In Windows 8, you can check virtualization support in the task manager in the
    Performance tab:


    |  |  |

    |---|---|

    | Virtualization: | Enabled |

    | L1 cache: | 256 KB |

    | L2 cache: | 2.0 MB |


    If you want to check whether your PC supports the hardware level virtualization
    in Windows 7, look for Microsoft Hardware-Assisted Virtualization Detection Tool.
    Its free, tiny utility is used to check whether your system supports virtualization.
    Download and run it to see the report:


    ![](img/0c87321919fa245e22f056c67ec70003_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'If the report is different for you, saying that hardware-assisted virtualization
    is not enabled, you will need to check the BIOS settings on your machine, maybe
    the hardware-assisted virtualization support is just switched off. In such a case,
    switch it on and re-run the tool.


    If your PC doesn''t support hardware-assisted virtualization and you decide to
    install Docker anyway, it will result in an error during the start of the virtualized
    Linux distribution.


    Additionally, when installing on Windows PC, you need to make sure your Windows
    OS is 64-bit (x64). Docker will not run on the 32-bit system by default.


    We already know from `Chapter 1, Introduction to Docker`, which Docker components
    are available to install in the default installation package.


    Knowing the hardware requirements, let''s download it and install the software.


    # Installing on Windows


    Docker up-to-date installation guides are always available on the `https://www.docker.com`
    / website. Head to the *Get started with Docker* section and pick the installation
    guide according to your operating system: Windows, Mac OS, or Linux.


    As it was already mentioned in the previous chapter, you have two options for
    installing Docker on Windows, it will be the Docker Toolbox, running on almost
    all versions of Windows or Docker For Windows, which will run only on Windows
    10 or later. Also, even if you are running Windows 10, there are some additional
    requirements: it must be a 64-bit Windows 10 Pro, Enterprise and Education (1511
    November update, Build 10586 or later). With native versions of Docker installation
    packages (either Docker for Windows or Docker for Mac), you can go with the stable
    channel, which is fully tested and reliable or the beta channel, and contains
    some experimental features that the Docker team currently works on, but can be
    a little unstable and buggy. I recommend to pick the stable channel. The installation
    package is just a single `installDocker.msi` package. Just run it—it''s rather
    a no-questions-asked type of installation. However, take note that you will need
    to have administrative rights on your Windows machine.'
  merge: -1
  img_proc: true
