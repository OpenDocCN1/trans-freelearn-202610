- pgno: 54
  md: '# 3


    # Understanding Images and Containers


    In previous chapter, we learned how to install Docker on Windows, Mac OS, Linux,
    and Amazon EC2 cloud. So far, you should have Docker running on your machine and
    should be able to run the hello-world image in a container. In this chapter, we
    will dive deeper into the world of images and containers. Later, we will also
    cover image distribution-related terms, such as Docker repository, registry, and
    index. We are going to cover the following topics in this chapter:


    +   - Images

    +   - Layers

    +   - Containers

    +   - Saving changes to containers

    +   - Docker registry, repository, and index'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'Note that we will mainly use the shell (or command prompt in Windows) to execute
    Docker commands. You can always execute docker help to get a description of the
    available commands. Executing docker help with the name of specific command docker
    help pull, for example, will display information about this command with a brief
    description of the available options:


    ![](img/0c87321919fa245e22f056c67ec70003_55_0.png)


    Let''s start by explaining in detail what images, layers, and containers are.


    # Images


    You can think of an image as a read-only template, which is the base foundation
    to run a container on. It''s like a template that contains everything your application
    needs to operate. It can be Ubuntu Linux with a web server and your web application
    installed. Every image starts from a base image, for example, Ubuntu, a base Linux
    image. You can create images yourself – images are created using a series of commands
    (called instructions), described in the Dockerfile. It is an ordered collection
    of layers - root filesystem changes stacked on top of one another. These changes
    can be running a command, adding a file or directory, creating environmental variables,
    and so on. Docker uses a filesystem called AUFS, which stands for Augmented File
    System. Pretty much every line of a Docker file (with some exceptions, which we
    are going to explain later) will create a new image and when you stack or augment
    them all on top of each other, you''ll get your final Docker image. This is essentially
    a way of caching. For example, if you change only one line of your Docker file,
    Docker will not rebuild the entire image set. The Docker file will be sequentially
    when you start the process of building of an image. Docker will execute the instructions
    one by one, and return a final image. Each instruction creates a new layer in
    the image. We will cover the process in Chapter 6, Creating Images.'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'Docker images are highly portable across hosts – an image can be run in a Docker
    container on any host that runs Docker. It''s important to know that Docker uses
    an image to run your code, not the Dockerfile. The Dockerfile is used to create
    the image when you run the `build` command – we will also get back to it in `Chapter
    6`, *Creating Images*. Also, if you publish your image to the Docker Hub, you
    publish a resulting image, not a source Dockerfile. We will describe the process
    later in this book, in `Chapter 8`, *Publishing Images*.


    The local images you have on your machine can be listed by running the `docker
    images` command:


    ![](img/0c87321919fa245e22f056c67ec70003_56_0.png)


    The images command will display a table with the following columns:


    +   - `REPOSITORY` : This is the name of the repository. We will explain it in
    detail at the end of this chapter.

    +   - `TAG` : It''s similar to Git or other version control systems tag. It represents
    a specific set point in the repositories'' commit history. You can have multiple
    tags when building the image. There''s even a special tag called latest, which
    represents the latest version. The full form of a tag is `[REGISTRYHOST/][USERNAME/]NAME[:TAG]`,
    but the TAG column is just the `[:TAG]` part of the full tag. We will cover tagging
    in detail later in `Chapter 6`, *Creating Images*.

    +   - `IMAGE ID` : This is the identifier for the image (actually it''s the first
    12 characters of the true identifier for an image). You may use it to refer to
    a specific image when executing image commands, but you can also use the image''s
    name.

    +   - `CREATED` : The date represents the time the repository was created. You
    can use it to verify how fresh the build of the image is.

    +   - `SIZE` : This is the size of the image.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "To remove all the images you have on your system, execute the following command:\n\
    \n```\ndocker rmi $(docker images -q)\n```\n\nWhenever you assign a tag that is\
    \ already in use to a new image (for example, by building the image myImage, making\
    \ a change in its Dockerfile, and then building myImage again), the old image\
    \ will lose that tag but will still stay around, even if all of its tags are deleted.\
    \ These older versions of your images are the untagged entries in the output of\
    \ Docker images, and you can safely delete them with the following command:\n\n\
    ```\n$ docker rmi <IMAGE HASH>\n```\n\nTo remove all un-tagged docker images,\
    \ use the list of images and a filter:\n\n```\n$ docker rmi $(docker images -q\
    \ -f\n dangling=true)\n```\n\nAlternatively to creating your image from scratch,\
    \ you can pick already prepared images from a hundreds available on the Internet.\
    \ Also, you can publish an image in your private hub, so other people in your\
    \ organization can pull it and reuse. We will cover the process of looking for\
    \ images in Chapter 5, Finding Images. The downloaded images can be updated and\
    \ extended freely, so downloading base image is a great way to get a serious speed\
    \ boost when developing one by yourself. It's very common practice to download\
    \ ready-to-run images, such as a webserver or database, for example, and build\
    \ on top of it. You can have, for example, a base Apache image. You could use\
    \ this as the base of all your web application images. This is possible due to\
    \ the internal nature of an image – layers, which Docker images are composed from.\
    \ We said a while ago that every instruction in the Dockerfile creates a new layer.\
    \ Let's explain now what they are.\n\n# Layers\n\nEach image consists of a series\
    \ of layers that are stacked on one another. By using the union filesystem, Docker\
    \ combines all these layers into a single image entity. The union filesystem allows\
    \ transparent overlaying of files and directories of separate filesystems, giving\
    \ a single, consistent filesystem as a result, as you can see in the following\
    \ diagram:"
  merge: -1
  img_proc: true
- pgno: 58
  md: '![](img/0c87321919fa245e22f056c67ec70003_58_0.png)


    The contents and structure of directories that have the same path within these
    separate filesystems will be seen together in a single merged directory, within
    the new, virtual-like filesystem. In other words, the filesystem structure of
    the top layer will merge with the structure of the layer beneath. Files and directories
    that have the same path as in the previous layer will cover those beneath. Removing
    the upper layer will again reveal and expose the previous directory content. As
    we have mentioned earlier, layers are placed in a stack on top of one another.
    To maintain the order of layers, Docker utilizes the concept of layer IDs and
    pointers. Each layer contains the ID and a pointer to its parent layer. A layer
    without a pointer referencing the parent is the first layer in the stack, a base.
    You can see the relation in the following diagram:


    ![](img/0c87321919fa245e22f056c67ec70003_58_1.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'As you pull the image from Docker Hub, you actually can see the progress of
    each dependent layer being downloaded. Here''s an example for the latest Ubuntu
    Linux:


    ![](img/0c87321919fa245e22f056c67ec70003_59_0.png)


    Another advantage of using layers is the persistence of history. Layers can provide
    a history of how a specific image was built. Once all the layers are finished
    downloading, you can list the layers in the specific image using the history command:


    ```

    $ docker history ubuntu

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_59_1.png)


    Each line in the history command''s output corresponds to a commit to a filesystem.
    The values in the SIZE column add up to the corresponding SIZE column for the
    image in docker image.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'You can also see the graphical representation of the image using the ImageLayers
    web application available at https://imagelayers.iron.io:


    ![](img/0c87321919fa245e22f056c67ec70003_60_0.png)


    Layers have some interesting features. First, they are reusable. If two different
    images have a common part, let''s say a Linux shell, for example, Docker tracks
    all of the pulled layers and will reuse the shell layer in both of the images.
    It''s a safe operation; as you remember, layers are read-only. When downloading
    the second image, the layer will be reused and only the difference will be pulled
    from the Docker Hub. This saves time, bandwidth, and disk space of course, but
    it has another great advantage. If you modify your Docker image, for example,
    by bumping the version of your application, only the single layer gets modified.
    Instead of distributing the whole image, you push just the update, making the
    process simpler and faster. This is especially useful if you use Docker in your
    continuous deployment flow: pushing a Git branch will trigger building an image
    and then publishing the application for users. Due to the layers reuse feature,
    the whole process is a lot faster. Because of layers, Docker is lightweight in
    comparison to full virtual machines, which doesn''t share anything. Because of
    the layer caching that Docker uses, when you pull an image (https://docs.docker.com/reference/commandline/pull/),
    you eventually don''t have to download all of its filesystem. If you already have
    another image that has some of the layers of the image you pull, only the missing
    layers are actually downloaded. There is a word of warning, though, related to
    another feature of layers: apart from being reusable, layers are also additive.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '![](img/0c87321919fa245e22f056c67ec70003_61_0.png)


    Layers are additive – the image can get quite large as a result.


    For example, if you create a large file in the container, make a commit (we will
    get to that in a while), then delete the file, and do another commit, this file
    will still be present in the layer history. Imagine this scenario: you pull the
    base Ubuntu image and install the Wildfly application server. Then you change
    your mind, uninstall Wildfly and install Tomcat instead. All those removed files
    from the Wildfly installation will still be present in the image – although they
    have been deleted. The image size will grow in no time.


    Understanding Docker''s layered filesystem can make a big difference to the size
    of your images. The growing size can become a problem when you publish your images
    to a registry – it takes more requests and takes longer to transfer. Large images
    become an issue when thousands of containers need to be deployed across a cluster,
    for example.


    To flatten the image, you can export it to a TAR file, using the export command:


    ```

    $ docker export <CONTAINER ID> >

    /home/docker/myImage.tar

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_61_1.png)


    Exporting the image to TAR will not preserve its history.


    The exported file can then be imported back, using the import command:


    ```

    $ cat /home/docker/myImage.tar | docker

    import - some-name:latest

    ```


    If the free disk space is really an issue, you can pipe the output stream of export
    into the input stream of import:


    ```

    $ docker export <CONTAINER ID> | docker

    import - exampleimagelocal:new

    ```


    Alternatively, you can use the docker-squash utility, available at GitHub https://github.com/jwilder/docker-squash,
    to make your images smaller. It will squash multiple Docker layers into one in
    order to create an image with fewer and smaller layers. Squashed images work the
    same as they were originally built, because this utility retains Dockerfile commands
    such as PORT or ENV. In addition, deleted files in later layers are actually removed
    from the image when squashed.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'If necessary, you can also extract data files from the finished container with
    the cp (from copy) command:


    ```

    $ docker cp <CONTAINER ID>:

    /path/to/find/files /path/to/put/copy

    ```


    Layers and images are closely related to each other. Docker deals with images
    and their layers with a few commands, and we have been using most of them already.
    Let''s summarize them now:


    | Image-related command | Description |

    |---|---|

    | images | This lists the images |

    | Build | This builds an image from a Dockerfile |

    | history | This shows the history of an image |

    | import | This creates a new filesystem image from the contents of a TAR archive
    |

    | load | This loads an image from a TAR archive |

    | rmi | This removes one or more images |

    | Save | This saves an image''s contents to a TAR archive |

    | inspect | This returns low-level information on an image |


    Layers are a great feature in the container world. When used wisely, can be a
    great help when creating images. But, they also have a limitation. At present,
    the AUFS limit of 42 layers https://github.com/dotcloud/docker/issues/1171. This
    means that you should group similar commands where it is possible, which will
    result with just one single layer.


    As we have said before, Docker images are stored as series of read-only layers.
    This means that once the container image has been created, it does not change.
    But having all the filesystem read-only would not have a lot of sense. What about
    modifying an image? Adding your software to a base web server image? Well, when
    we start a container, Docker actually takes the read-only image (with all its
    read-only layers) and adds a read/write layer on top of the layer''s stack. Let''s
    focus on containers now.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Containers


    A running instance of an image is called a container. Docker launches them using
    the Docker images as read-only templates. To use a programming metaphor, if an
    image is a class, then a container is an instance of a class-a runtime object.
    Containers are lightweight and portable encapsulations of an environment in which
    to run applications. To turn an image into a container, the Docker engine takes
    the image, adds a read/write filesystem on top, and initializes various settings,
