  md: '3. Now, if we run the second busybox container and connect it to testNetwork,
    using the same --net=testNetwork, we can see that both containers can see each
    other they run on the same network and the ping command actually responds:


    ```

    docker run -it --name=container2 --net=testNetwork busybox

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_82_0.png)


    4. So we have successfully attached the second container to testNetwork (using
    the default bridge driver).


    5. Now let''s take a look at the network details. To do this, we will use the
    network inspect command:


    ```

    docker network inspect testNetwork

    ```


    Docker will output a comprehensive report about the network:'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/0c87321919fa245e22f056c67ec70003_83_0.png)


    As you can see, there are a lot of interesting details in this report, such as
    the driver being used and a list of containers currently connected to this network.


    Just as the container can be connected to a network, it can also be disconnected
    and the corresponding network interface will be removed. The syntax of the network
    disconnect command is as follows:


    ```

    docker network disconnect <network ID or name> <container Id or name>

    ```


    For example, to disconnect our container1 from testNetwork, we need to execute
    the following command:


    ```

    docker network disconnect testNetwork container1

    ```


    The intention of the possibility to create separate networks is to segregate services
    so that the only things on a network are the ones that need to talk to each other.
    In practice, you will probably have a lot of networks with small numbers of containers
    connected to them. Networks are all isolated from each other.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/0c87321919fa245e22f056c67ec70003_84_0.png)


    If two containers are not on the same network, they cannot talk directly.


    A typical example would be a load balancer, a web application frontend, a web
    application backend, and finally, a database.


    You may want that your containers running on separate Docker hosts to communicate
    over the network someday. In this case, the multi-host networking feature of Docker
    comes in handy.


    # Creating multi-host networking


    So far, we''ve been learning about the bridge network driver, which has a local
    scope, meaning bridge networks are local to the Docker host. In addition to basic
    network drivers (null, bridge, and host), Docker also provides the overlay network
    driver. It has a global, scope meaning that overlay networks can exist across
    multiple Docker hosts. You can use the overlay network to connect to multiple
    hosts. Those Docker hosts can exist in different datacenters, or even different
    cloud providers. When creating multi-host networks in Docker, you have two options.
    The first one is to have Docker Engine running in swarm mode. Swarm mode has been
    introduced in Docker version 1.12 – if you have Docker for Mac or Docker for Windows
    (as opposite to Docker Toolbox), you can enable swarm mode. In other cases, when
    you are running the older version of Docker, you will also be able to create multi-host
    networking, but you will need a key-value store configured. Let''s begin with
    swarm mode, and then we will cover the key-value store setup.


    # Swarm mode


    To explain what swarm mode is, first we''ll need to understand some of the terms
    behind this feature. Swarm itself is a cluster of running Docker Engines. A node
    is the single instance of Docker Engine that belongs to a cluster. There is a
    requirement, however, that all Docker hosts that are going to participate in a
    swarm need to have the following ports open:


    +   - TCP port 2377 (for communication related to swarm management)

    +   - TCP and UDP port 7946 (for nodes to communicate)

    +   - TCP and UDP port 4789 (for overlay network traffic that we are creating
    now)'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'Having these ports open, we can initialize our Docker swarm. Swarm mode is
    disabled by default; you can enable it using the `docker swarm init` command,
    as shown in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_85_0.png)


    The first Docker Engine you execute this command on becomes a swarm manager –
    it will coordinate the rest of the nodes participating in the cluster.


    As you can see in the preceding screenshot, running `docker swarm init` for the
    first time gives a special output: a command to run on the additional Docker hosts
    that you would like to participate in newly created swarm. It will be this one
    in our example:


    ```

    docker swarm join

    --token SWMTKN-1-0vpwtxueqgr9ufx24zs1fw7zqou38p8w5bwqodoipgbm2scrdv-9owikcgrpuz4izuwy5ghni3xc
    \

    10.0.75.2:2377

    ```


    Of course, you will want to make sure that other machines can access manager''s
    IP address. If you run the preceding command on other machines, they will join
    the cluster. If you now run the `docker info` command, you can see the current
    state of the swarm. You will get information about the state of the swarm (it''s
    `active`), the current host''s node identifier, and a number of nodes participating
    in the swarm. To see a detailed list of nodes in the swarm, you can execute the
    following command:


    ```

    docker node ls

    ```'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'The output will contain the list of nodes with their hostnames, availability
    status, and a manager status. Having our little swarm up and running, we can create
    an overlay network to enable to hosts participating in a swarm to communicate
    with each other. This will be the same `network create` command we already know;
    this time, however, we are going to use the overlay driver:


    ```

    docker network create --driver overlay mynet

    ```


    If you now list the networks, you will see `mynet` as an overlay network with
    a swarm scope, as shown in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_86_0.png)


    If you are unable to run Docker in the latest version (supporting swarm mode),
    you can also create multi-host networking. To do this, you will need a key-value
    store. Let''s set it up now.


    # Key-value store overlay networking


    There is one requirement. In order to create an overlay network, you need to have
    a key-value store configured:'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/0c87321919fa245e22f056c67ec70003_87_0.png)


    Docker (through `libkv` – a distributed key-value store abstraction library) supports
    different key-value stores. For overlay networking, you can use stores such as
    Consul, Etcd, Zookeeper (distributed store), and BoltDB (local store). We will
    be using Consul (https://www.consul.io) in our example.


    Docker overlay networking can seem a bit complicated at first, but it''s quite
    easy to understand in the practical example. Let''s create an overlay network.
    We will need a couple of separate Docker hosts to test it. We are going to do
    this on Windows machine this time, but the procedure is the same on Mac and Linux.
    As you may remember from Chapter 2, *Installing Docker*, if you need to create
    additional hosts on Linux OS, you need to install a `docker-machine` first – it''s
    not included by default.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'To simulate separate hosts, we will begin by creating a new host using the
    `docker-machine create` command:


    ```

    docker-machine create -driver=virtualbox host01

    ```


    As the command is being executed, we get the following result:


    ![](img/0c87321919fa245e22f056c67ec70003_88_0.png)


    Now we have the docker host running, let''s install Consul on the host. It will
    play the role of a service discovery server for us and will enable our hosts to
    share the network and communicate. Note that we are going to run it as a daemon
    and map the port number `8500` on Consul (we will get back to exposing and publishing
    ports in a while, later in this chapter). Also, as you can see, we need to prefix
    the command with `config host01`, because we have now four (including the default)
    Docker hosts running and we need to instruct Docker''s Engine on which we are
    going to run the container:


    ```

    docker $(docker-machine config host01) run -d -p "8500:8500" -h "consul" progrium/consul
    -server -bootstrap

    ```'
  merge: -1
  img_proc: true
- pgno: 89
  md: '![](img/0c87321919fa245e22f056c67ec70003_89_0.png)


    With Consul running, let''s create two additional Docker hosts, which we are actually
    going to connect to the same multi-host, overlay network. Note that this time
    we are giving special instructions to Docker''s Engine, saying that we want them
    to use the cluster store with Consul protocol, using the port that we mapped earlier,
    8500:


    ```

    docker-machine create -d virtualbox --engine-opt="cluster-store=consul://$(docker-machine
    ip host01):8500" --engine-opt="cluster-advertise=eth1:0" host02

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_89_1.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'Next is the third and the last host. Again, the same instructions for the engine
    are given. Use a cluster store with the Consul protocol through port number 8500:


    ```

    docker-machine create -d virtualbox --engine-opt="cluster-store=consul://$(docker-machine
    ip host01):8500" --engine-opt="cluster-advertise=eth1:0" host03

    ```


    Let''s summarize now: we have three different Docker hosts running on our local
    machine. The first one is running a Consul container, and the next ones are aware
    of the Consul host listening on port 8500. Let''s list these hosts then using
    the machine''s ls command:


    ![](img/0c87321919fa245e22f056c67ec70003_90_0.png)


    So far so good. We have four hosts ready, each with a different IP address. Now
    let''s get back to the point and create an overlay network on our second host
    (host02). We do this using the network create command, this time using the overlay
    driver. The name of our network will be myOverlayNetwork:


    ```

    docker $(docker-machine config host02) network create -d overlay myOverlayNetwork

    ```


    If we now list the networks available on the second host, we will see that overlay
    network named myOverlayNetwork is present on the list. We can list the networks
    using the network ls command, again prefixing the command with config host02 to
    instruct Docker that we want the list of networks from the host02 host:


    ```

    docker $(docker-machine config host02) network ls

    ```


    If you execute the same command, but with the third host (host03), surprisingly,
    myOverlayNetwork will also be available, even if we haven''t created it explicitly
    for host03. This is where Consul comes in. As you remember, during the creation
    of the hosts, we instructed the Docker Engine to use Consul listening on port
    8500. As a result, our host02 and host03 share the same overlay network.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'List the network on host03, to find out that `myOverlayNetwork` is also active
    on the third host:


    ```

    docker $(docker-machine config host03) network ls

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_91_0.png)


    Now, let''s find out whether it''s actually working. This will be a rather simple
    test – we are going to run an nginx web server container in host02 and will try
    to see if it''s visible from host03. To do this, execute the command on host02.
    Note that we are using `--net=myOverlayNetwork` to instruct Docker that we want
    to connect nginx to the overlay network we have just created:


    ```

    docker $(docker-machine config host02) run -itd --name=nginx

    --net=myOverlayNetwork nginx

    ```


    To test the multi-host network, we will fetch the default nginx index page from
    `host03`. Let''s install busybox, which contains the `wget` command (a command
    used to get the resource from the Web). Again, we are connecting the `busybox`
    container to the same overlay network:


    ```

    docker $(docker-machine config host03) run -it --net=myOverlayNetwork busybox

    ```'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'And then run the wget command to fetch a web page from the nginx server running
    on a different host:


    ```

    wget -O- http://nginx

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_92_0.png)


    The wget command will output the downloaded index page of nginx to the console:
    that''s it – we have created a multi-host container network, using three separate
    machines. The first one was running the Consul server and enabling the remaining
    two hosts to find themselves and communicate. Just like with the bridge networks,
    you should use these overlay networks with small groups of containers that actually
    need to communicate with each other.


    When creating a multi-host network, we opened a port on the Consul server. Exposing
    and publishing network ports is a great way to make the container be able to communicate
    with the other containers and the external world. Let''s look at exposing and
    mapping ports in more detail.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Exposing and mapping ports


    It''s a common scenario that you will want your containerized application to accept
    incoming connections, either from other containers or from outside of Docker.
    It can be the application server listening on port 80 or the database accepting
    incoming requests. You can expose a port in two ways, either in the Dockerfile
    with the `EXPOSE` instruction (we will do it in the chapter about creating images
    later) or in the run command using the `--expose` option. These are equivalent
    commands, though `--expose` will accept a range of ports as an argument (for example,
    `--expose=1000-2000`).


    You can also explicitly bind a port (or group of ports) from the container to
    the host using the `-p` flag. This configuration depends on the host, so there
    is no equivalent instruction allowed us in the Dockerfile. Dockerfiles need to
    be host independent and portable.


    ![](img/0c87321919fa245e22f056c67ec70003_93_0.png)


    You can bind a port using `-p` at runtime only.


    So, what''s the difference between `--expose` and `-p` ? Well, `--expose` will
    expose a port at runtime, but will not create any mapping to the host.


    ![](img/0c87321919fa245e22f056c67ec70003_93_1.png)


    If you `EXPOSE` a port, the service in the container is not accessible from outside
    Docker, but from inside other Docker containers. So this is good for intercontainer
    communication.


    The `EXPOSE` instruction exposes ports for use within links, which we are going
    to explain in a while.


    The `-p` option, on the other hand, is like publish – it will create a port mapping
    rule, mapping a port on the container with the port on the host system. If no
    port on the host is specified, Docker will automatically allocate one. Note that
    if you execute `-p`, but do not execute `EXPOSE`, Docker does an implicit `EXPOSE`.
    This is because if a port is open to the public, it is automatically also open
    to other Docker containers.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'It seems that there should be another option, allowing to map ports exposed
    in an image (that is in the Dockerfile) automatically during the startup of the
    container. And here it is: the -P option (capital P this time) will map a dynamically
    allocated host port to all container ports that have been exposed by the Dockerfile
    by the EXPOSE instruction. Let''s briefly summarize the options in a table:


    | Instruction | Meaning |

    |---|---|

    | EXPOSE | This signals that there is a service available on the specified port.
    This is used in the Dockerfile that makes exposed ports open for other containers.
    |

    | --expose | This is similar to EXPOSE, but is used at runtime. |

    | -p | This specifies a port mapping rule, mapping the port on the container with
    the port on the host machine. This makes a port open from outside of Docker. |

    | -P | This map is the dynamically allocated port on the host machine to all ports
    exposed using EXPOSE or --expose. |


    Note that we will start nginx as a daemon, Docker will respond with the container
    ID for future reference, so you can stop the container using kill or show its
    details by using the inspect command). If we execute a ps command now, to list
    of active and running containers, in the PORTS column we will get the port mapping
    that took place. In our case, Docker mapped nginx''s exposed port number 80 to
    port number 32773 on the host machine and exposed port number 443 to port number
    32772 on the host machine:


    ```

    docker run --name nginx -d -P nginx

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_94_0.png)'
  merge: -1
  img_proc: true
- pgno: 95
  md: '![](img/0c87321919fa245e22f056c67ec70003_95_0.png)


    The quickest way of determining the current port mapping is just the ps command
    (as you remember from the previous chapters, it''s being used to see the list
    of running containers).


    The -p option, on the other hand, gives us more control. In this case, Docker
    will not automatically pick any port – it''s up to you what ports on the host
    should be mapped to the container''s ports. The syntax of the -p option is quite
    straightforward: you just enter the container exposed port number, a colon, and
    then a port you would like to be mapped on the host machine:


    ```

    docker run -p <containerPort>:<hostPort> <image ID or name>

    ```


    If you need to, you can also expose a whole range of ports to other containers
    using either the EXPOSE instruction in a Dockerfile (EXPOSE 7000-8000, for example)
    or the run command:


    ```

    docker run --expose=7000-8000 <container ID or name>

    ```


    Of course you can then publish a range of ports to the host machine via Docker''s
    run (https://docs.docker.com/engine/reference/commandline/cli/) command:


    ```

    docker run -p 7000-8000:7000-8000 <container ID or name>

    ```


    Ok, let''s stop our nginx using the stop command and start another container,
    this time mapping the container port 80 (which is exposed in the Dockerfile) to
    our host machine port number 8080:


    ```

    docker run --name nginx -d -p 8080:80 nginx

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_95_1.png)'
  merge: -1
  img_proc: true
- pgno: 96
  md: "When started, you can access the default nginx welcome page at your host machine\
    \ local address and mapped port 8080 by using the link http://localhost:8080.\n\
    \n![](img/0c87321919fa245e22f056c67ec70003_96_0.png)\n\nAs an alternative to the\
    \ ps command, you can execute the port command, using the container ID as a parameter\
    \ (the ID that Docker has given back during the container startup) to determine\
    \ what ports have been mapped. The following is the port in my case:\n\n```\n\
    docker port\n e1926dc061c5125b5aa3fd2685bcda4cf26ee99def4b2a1ae5e53721b88231c1\n\
    ```\n\nAs a result, Docker will output the mapping, saying that port number 80\
    \ from the container has been mapped to the port number 8080 on the host machine:\n\
    \n![](img/0c87321919fa245e22f056c67ec70003_96_1.png)"
  merge: -1
  img_proc: true
- pgno: 97
  md: 'You can also see information about exposed (and mapped, if any) ports using
    the inspect command:


    ```

    docker inspect

    e1926dc061c5125b5aa3fd2685bcda4cf26ee99def4b2a1ae5e53721b88231c1

    ```


    If you scroll to the Ports section, you will find the list of ports that have
    been exposed by the image (this will be TCP 443 and TCP 80 in the case of nginx)
    and a corresponding mapped port on the host machine, if you decided to run the
    container with the -p or -P option:


    ![](img/0c87321919fa245e22f056c67ec70003_97_0.png)


    Note that the nginx image has two ports exposed, but we have mapped only one of
    them, port number 80. You can either run the container with the -P option to map
    all of the exposed ports automatically (to a random high port within the port
    range on your Docker host) or you can have multiple -p options to map each one
    of them individually. If there''s a need to, you can even map multiple host machine
    ports to a single exposed port in the container like this:


    ```

    docker run --name nginx -d -p 8080:80 -p 8081:80 nginx

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_97_1.png)


    The -p flag can be used multiple times to configure multiple ports.


    Mapping ports is a wonderful feature. It gives you the flexible configuration
    possibilities to open your containers to the external world. In fact, it''s indispensable
    if you want your containerized web server, database, or messaging server to be
    able to talk to others.


    Docker networking is quite a new feature. Yet there is another feature of Docker
    that may come in handy: links between containers. Let''s get to know them.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Linking containers


    Docker contains a mechanism that allows linking multiple containers together.
    Linked containers send connection information from one container to another. When
    creating a link, the information about a source container is being sent to a target
    container. A good example for such use case can be linking a web application container
    to the database container. After linking, the database container will expose some
    information to the web application container (such as the database name, the URL
    to connect to, the username, and the password). To link containers together, we
    use the --link option in the run command. If we link one container to another,
    two things will happen under the hood. First, Docker will update the linked container''s
    /etc/hosts file automatically to reference to the container we are linking to.


    Let''s try it for the example. First, let''s run the MySQL container on the bridge
    network:


    ![](img/0c87321919fa245e22f056c67ec70003_98_0.png)


    Next, let''s run the second container, again the latest Ubuntu, but this time
    linking it with the MySQL container:


    ```

    docker run -it --name=ubuntu --link mysql:mysql ubuntu

    ```


    Notice that the MySQL container has to be running.


    ![](img/0c87321919fa245e22f056c67ec70003_98_1.png)


    You can link only to the running container.'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'You can notice that Docker automatically adjusted the /etc/hosts file of the
    Ubuntu container, inserting an entry for the MySQL instance:


    ```

    ```bash

    $ docker run -it --name=ubuntu --link mysql:mysql ubuntu

    root@60886fca65fb:# more /etc/hosts

    127.0.0.1       localhost

    ::1     localhost ip6-localhost ip6-loopback

    fe00::0 ip6-localnet

    ff00::0 ip6-mcastprefix

    ff02::1 ip6-allnodes

    ff02::2 ip6-allrouters

    172.17.0.2      mysql 5d22b0ea87d4

    172.17.0.3      60886fca65fb

    root@60886fca65fb:#

    ```

    ```


    The /etc/hosts linking is persistent – if you restart the source container and
    it will be given a new IP address, the linked container''s /etc/hosts files will
    be automatically updated with the source container''s new IP address.


    The second important thing that will happen when creating a link, is the transfer
    of some exposed environment variables from the container we are linking to. Take
    a look at our linked Ubuntu container; it magically knows a lot about the location
    and setup of the linked MySQL database, all thanks to the --link option (and of
    course, thanks to the properly defined MySQL image, exposing this information):


    ```

    ```bash

    root@60886fca65fb:# env | grep MYSQL

    MYSQL_ENV_MYSQL_ROOT_PASSWORD=my-secret-pw

    MYSQL_ENV_GOSU_VERSION=1.7

    MYSQL_PORT_3306_TCP_PORT=3306

    MYSQL_PORT_3306_TCP=tcp://172.17.0.2:3306

    MYSQL_ENV_MYSQL_VERSION=5.7.13-1debian8

    MYSQL_ENV_no_proxy=*.local, 169.254/16

    MYSQL_NAME=/ubuntu/mysql

    MYSQL_PORT_3306_TCP_PROTO=tcp

    MYSQL_PORT_3306_TCP_ADDR=172.17.0.2

    MYSQL_ENV_MYSQL_MAJOR=5.7

    MYSQL_PORT=tcp://172.17.0.2:3306

    root@60886fca65fb:#

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'Each variable is prefixed by the uppercase alias, taken from the `--link` command,
    which is `MYSQL` in our case. The exposed environment variables can come from
    a couple of places:


    +   - The `--env` (`-e` for short) and `--env-file` options on the `docker run`
    command when starting the source container.

    +   - The `ENV` Dockerfile command – we will learn how to do it in the upcoming
    chapters.

    +   - Each port exposed by the source container. Docker will generate three environment
    variables for each open port in the source container: one for the address, one
    for the port number, and one for the protocol.

    +   - Unlike host entries, IP addresses stored as the environment variables are
    not automatically updated if the source container is restarted.


    ![](img/0c87321919fa245e22f056c67ec70003_100_0.png)


    You can link multiple containers to a single source. For example, you can have
    multiple web containers attached to your single database container.


    Within a user-defined `bridge` network, linking is not supported. It works only
    on the bridge network created by default. If you need your containers to communicate
    on your created `bridge` network, you can expose and publish container ports on
    containers in this network. This is useful if you want to make a portion of the
    `bridge` network available to an outside network.


    Docker''s linking feature is a great way for source container to provide information
    about itself to a recipient container. In fact, this is internal to Docker and
    doesn''t require exposing any network ports. That''s a big benefit of linking:
    we don''t need to expose the source container to the network.


    The possibilities of configuring even complex network configuration are very broad
    in Docker. Containers can be a part of as many networks as you need. They can
    be a part of local `bridge` networks and overlay networks at the same time. If
    that''s not enough, you can use external plugins to provide other networking options.
    Let''s present this briefly.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# Networking plugins


    Docker Engine network plugins extend Docker to support a wide range of networking
    technologies, such as VXLAN, IPVLAN, MACVLAN, or something completely different.
    Network driver plugins are supported via the LibNetwork project. Some of the existing
    network plugins include, for example, a Weave Network Plugin – a network plugin
    that creates a virtual network that connects your Docker containers – across multiple
    hosts or clouds and enables automatic discovery of applications. Weave networks
    are resilient, partition tolerant, secure, and work in partially connected networks,
    and other adverse environments – all configured with delightful simplicity.


    Networking possibilities are almost endless in Docker. It''s hard to imagine a
    scenario that would be impossible to set up in Docker – by either using bridge
    or overlay networks. If the default set of drivers is not enough – you can always
    try to find a specific driver on the Internet – or develop it yourself. Let''s
    focus now on another very important aspect of Docker container''s extensibility-
    volumes.


    # Docker volumes


    As you remember from the previous chapter, Docker filesystems are kind of temporary
    by default. If you start up a Docker image (that is, run the container) you''ll
    end up with a read/write layer on top of the layer''s stack. You can create, modify,
    and delete files as you wish, but if you stop the container and start it up again,
    all your changes will be lost: any files you previously deleted will now be back,
    and any new files or edits you made won''t be present. Of course, you can commit
    the changes back into the image to have them persisted. This is a great feature
    if you want to create a complete setup of your application in the image, altogether
    with all its environment variable. But this is not very convenient when it comes
    to storing and retrieving data. At best we should separate out the container lifecycle
    from the data. Ideally, you would probably want to keep these separate so that
    the data generated (or being used) by your application is not destroyed or tied
    to the container lifecycle and can thus be reused. The perfect example is a web
    server: the Docker image contains web server software, configured and ready to
    use. But the data the server will be using (your web pages) should be separated
    from the image, so you can change it anytime without modifying an image. And vice
    versa – you can, let''s say, upgrade the web server software to a new version
    or tweak its configuration without modifying a data it will be serving. This is
    done via volumes, which we will focus on in this part of the chapter. Volumes
    are not a part of the Union File System, so the write operations are instant and
    as fast as possible, so there is no need to commit any changes.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '![](img/0c87321919fa245e22f056c67ec70003_102_0.png)


    Volumes live outside of the Union File System and exist as normal directories
    and files on the host filesystem.


    Let''s begin by creating a volume.


    # Creating a volume


    In Docker, you have basically three options to create volumes:


    +   - Creating a nameless volume by simply mapping volume to host directory (by
    using the `-v` argument for the `docker run` command)

    +   - Creating a Docker container image only for data (and then using the `--volumes-from`
    for `docker run` command)

    +   - Creating a Docker named volume explicitly (using the `docker volume create`
    command)


    Let''s discuss them one by one, starting with the `-v` option for the `docker
    run` command. We will begin by running the latest Ubuntu and create a volume for
    our data:


    ```

    docker run -it -v /Users/jarek/testDir/:/data ubuntu

    ```


    The parameters in the `-v` option are the directory on the host (your own operating
    system) – it is `/Users/jarek/testDir` in my example—a colon, and a path at which
    it will be available for the container: `/data` in my case. As you can see, it''s
    a volume without a name – just a mapping. This way, during the startup of the
    container, Docker has created a volume, which is a kind of mapped directory. It
    will be available for the container and also available from the host operating
    system. Any files already existing in the mapped directory (`/Users/jarek/testDir`
    in our case) will be available inside the container – they will not be deleted
    during the mapping. Because you have not specified a name for the volume, Docker
    will create a name for you. It will not be as funny as a container name we have
    seen before, but is unique enough to identify a volume using it. Let''s check
    if the volume is here using the `volume ls` command:'
  merge: -1
  img_proc: true
- pgno: 103
  md: '![](img/0c87321919fa245e22f056c67ec70003_103_0.png)


    The volume ls command can take some filter parameters, which can be quite useful.
    For example, you can list volumes that are not being used by any container:


    ```

    docker volume ls -f dangling=true

    ```


    Alternatively, list volumes are being created with a specific driver (we are going
    to cover drivers in a short while):


    ```

    docker volume ls -f driver=local

    ```


    The name filter matches on all or part of a volume''s name, for example, the following
    command:


    ```

    docker volume ls -f name=da

    ```


    This will give you the list of all volumes containing da in their name:


    ![](img/0c87321919fa245e22f056c67ec70003_103_1.png)'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'Apart from mapping a volume to a known host directory, you can also create
    a volume that will not be mapped explicitly with a path on the host—just enter
    the path at which it will be available for the container, without a colon. If
    the container''s base image contains data at the specified mount point, that data
    will be copied into the new volume upon volume initialization. (This does not
    apply when specifying a host directory explicitly, https://docs.docker.com/engine/tutorials/dockervolumes/.)
    The idea behind it is that you should not care about the location of the volume
    on the host system, this way making the image portable between different hosts.


    Consider the following command as an example:


    ```

    docker run -it -v /data2 ubuntu

    ```


    This time, Docker will create volume and map it to a internal path of the Docker
    setup on the host machine (it will be /var/lib/docker/volumes on the Macintosh).


    If you are wondering what that host path is, inspect the volume using the volume
    inspect command. First, you will need to find out which is the volume associated
    with the container. You can do it by executing the docker inspect command on your
    container. The volume ID will be listed in the inspect command output.


    With the volume name, you can just run docker volume inspect <volumeName>, which
    will be the following in my case:


    ```

    docker volume inspect

    3840cf476f0db530a9e62d5251975156eb5418bd9ba75e7435eb427ece46fc22

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_104_0.png)'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'The output of the command briefly shows the details of the volume – its name,
    the driver being used (we will get to it shortly), a mount point in the host system,
    assigned labels, and a scope. As you can see, in my case, Docker assigned a mount
    point for this volume somewhere in /var/lib/docker/volumes. You are not limited
    to just one volume per container. That would be a serious limitation.


    ![](img/0c87321919fa245e22f056c67ec70003_105_0.png)


    You can use the -v multiple times to mount multiple data volumes.


    The -v option can be used not only for directories, but for single files as well.
    This can be very useful if you want to have configuration files available in your
    container. The best example for it is the example from the official Docker documentation:


    ```

    docker run -it -v ~/.bash_history:/root/.bash_history ubuntu

    ```


    Executing the preceding command will make you having the same bash history between
    your local machine and a started Ubuntu container. And best of all, if you exit
    the container, the bash history on your own local machine will contain the bash
    commands you have been executing inside the container.


    Mapping a single file from a host allows exposing a configuration for your containers.


    The trick for sharing the data between containers is to use the --volumes-from
    option when executing the docker run command. This way if one of your containers
    has volumes mounted already, you can instruct Docker to use the same volumes when
    starting another container. Consider the following example:


    ```

    docker run -it --name myUbuntu -v /data ubuntu

    ```


    This will start Ubuntu with volume mounted as /data. Start another container using
    the following command:


    ```

    docker run -it --name myBusyBox --volumes-from myUbuntu busybox

    ```


    Here, your Ubuntu and busybox containers will share the same volume and thus,
    the same data. You can use multiple --volumes-from options to combine data volumes
    from several containers. Also, chaining is possible – you can mount chained --volumes_from
    in a group of containers.'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The common practice when working with Docker is to create data-only containers.
    The only purpose of data-only containers is to carry on the volume. For any other
    containers that you then want to connect to this data volume container, use the
    Docker''s --volumes-from option to grab the volume from this container and apply
    them to the current container. Let''s consider the following example:


    ```

    $ docker create -v ~/docker-nginx/html:/usr/share/nginx/html --name myWebSiteData
    nginx

    ```


    By executing the preceding command, we are creating a container with the name
    myWebSiteData. Its only purpose will be to have a /usr/share/nginx/html volume
    attached and mapped to ~/docker-nginx/html in your home directory. You may ask
    what image should you pick as a base for the data-only container. Well, it doesn''t
    matter that much – we are not going to run this container anyway, so it will not
    be wasting resources such as CPU or RAM. You may use the same image for the data
    container as for the container with the application you are going to run. You
    don''t leave data containers running, so it won''t consume resources. Using the
    same image can be important for several reasons:


    +   - It will take up less space as you already have the image layer cached (as
    you remember from Chapter 3, Understanding Images and Containers, Docker caches
    and shares the same layers between images)

    +   - The image could be used to fill the volume with some initial data, such
    as default configuration files, for example

    +   - The permissions and ownership will be correct


    With our data-only container ready, we can use it to provide a volume for another
    container (with our application, for example), using the --volumes-from option
    for the docker run command, just like we did previously, when dealing with nameless
    volumes.


    Let''s say we want to run nginx with the volume referenced in our data-only myWebsiteData
    container:


    ```

    $ docker run --name docker-nginx -p 80:80 -d --volumes-from myWebsiteData nginx

    ```


    Of course, the data-only container can be shared among other containers – in our
    case, you can run as many nginx containers as you like – as long as you enter
    the same --volumes-from option, they will share the same data.'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Apart from creating a volume when starting a container or using data-only containers,
    there is a command that allows creating the volume before starting any containers.
    It''s the last option on our list: the possibility to create Docker volumes explicitly,
    using the docker volume create command.


    We will use it now, and this time, we will aslo provide a more friendly name for
    our volume. To create a volume, execute the volume create command:


    ```

    docker volume create --name data

    ```


    Again, the new data volume will be available when you list volumes using the volume
    ls command. To mount a volume in a container during its startup, use the same
    -v option when starting a container:


    ```

    docker run -it -v data:/data ubuntu

    ```


    The data volume will then be available for your container in /data. It''s also
    possible to run another container with the same volume mounted.


    ![](img/0c87321919fa245e22f056c67ec70003_107_0.png)


    Volumes can be shared between containers – just run them with mapping the same
    volume.


    When it comes to creating your own images using Dockerfile, the VOLUME instruction
    comes in handy. Actually, we will be using it later in the book, when creating
    images from a Dockerfile.


    It creates a mount point with the specified name and marks it as holding externally
    mounted volumes from native host or other containers. Creating volumes using the
    VOLUME instruction has one important difference to using option during the container
    startup: you cannot specify a host directory when using the VOLUME instruction.
    Dockerfiles are meant to be portable and shared. The host directory volume is
    100% host dependent and will break on any other machine, which is a little bit
    off the Docker idea. Because of this, it is only possible to use portable instructions
    within a Dockerfile. A benefit of using shared volumes is that they are host-independent.
    This means that a volume can be made available on any host that a container is
    started on as long as it has access to the shared storage and has the plugin (driver)
    installed.


    ![](img/0c87321919fa245e22f056c67ec70003_107_1.png)


    If you need to specify a host directory when creating a volume, you need to specify
    it at runtime.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# Removing a volume


    The same as with creating volumes, there are two ways of removing a volume from
    Docker. One way is to remove a volume by referencing a container''s name and executing
    the rm -v command:


    ```

    docker rm -v <containerName>

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_108_0.png)


    Docker will not warn you when removing a container without providing the -v option
    to delete its volumes. As a result, you will have dangling volumes – volumes that
    are no longer referenced by a container.


    You can also remove the volume using the volume rm command:


    ```

    docker volume rm <volumeName>

    ```


    If the volume happens to being used by the container, Docker Engine will not allow
    deleting it and will give you a warning message:


    ![](img/0c87321919fa245e22f056c67ec70003_108_1.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'The handy shortcut to remove all volumes not being referenced by any container
    is using a `dangling=true` filter from the `volume ls` command:


    ```

    docker volume rm $(docker volume ls -qf dangling=true)

    ```


    As you can see, creating, sharing, and removing volumes in Docker is not that
    tricky. It''s very flexible and allows creating a setup you will need for your
    applications. But there''s more to this flexibility. When creating a volume, you
    can specify a `--driver` option (or `-d` for short), which may be useful if you
    need to map some external, not-so-standard storage. The volumes we have created
    so far were using the `local` filesystem driver (the files were being stored on
    the local drive of the host system) – you can see the driver name when inspecting
    a volume using the `volume inspect` command. There are other options though, let''s
    look at them now;


    # Volume drivers


    The same as with network driver plugins, the volume plugins extend the capabilities
    of the Docker Engine and enable integration with other types of storage. There
    are tons of ready-to-use plugins available for free on the Internet; you can find
    a list on Docker''s GitHub page. Some of them include the following:


    +   - **Docker Volume Driver for Azure File Storage**: This is a Docker Volume
    Driver that uses Azure File Storage to mount file shares on the cloud to Docker
    containers as volumes. It uses network file sharing by utilizing the SMB (Server
    Message Block) and CIFS (Common Internet File System) protocols capabilities of
    Azure File Storage. You can create Docker containers that can migrate from one
    host to another seamlessly or share volumes among multiple containers running
    on different hosts.

    +   - **IPFS**: The abbreviation stands from **InterPlanetary File System**. It''s
    an open source volume plugin that allows using an IPFS filesystem as a volume.
    IPFS is a very interesting and promising storage system – it makes, possible to
    distribute high volumes of data with high efficiency. It provides deduplication,
    high performance, and clustered persistence, provides secure P2P content delivery,
    fast performance, and decentralized archiving. IPFS provides resilient access
    to data, independent of low latency or connectivity to the backbone.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '+   - **Keywhiz:** This driver can be used to make your container talk to a
    remote Keywhiz server. Keywhiz is a system for managing and distributing secret
    data, such as TLS certificates/keys, GPG keys, API tokens, and database credentials.
    Instead of putting this data in config files or copying files (which is likely
    to be leaked or difficult to track), Keywhiz makes managing it easier and more
    secure: Keywhiz servers in a cluster centrally store secrets encrypted in a database.
    Clients use mutually authenticated TLS (mTLS) to retrieve secrets they have access
    to.


    As you can see from the preceding examples, they are quite interesting, sometimes
    even exotic. Because of the extendable nature of Docker and its plugin architecture,
    you can create very flexible setups. But third-party drivers do not always introduce
    completely new storage types, sometimes they just extend the existing drivers.
    An example of that is `Local Persist Plugin`, a volume plugin that extends the
    default local driver''s functionality by allowing you to specify a mount point
    anywhere on the host, which enables the files to always persist, even if the volume
    is removed via Docker''s `volume rm` command.


    If you need a volume plugin that is not yet available, you can just write your
    own – the process is very well documented on Docker''s GitHub page, together with
    extensible examples.


    # Summary


    We''ve now covered how to open our containers to the external world – we can use
    networking and mounted volumes to be able to share data between containers and
    other hosts. Let''s summarize what we have learned so far in this chapter. We
    know that containers from the same Docker host see each other automatically on
    the default `bridge` network, only if the container is bound to default bridge.
    We can make containers running on different hosts to communicate with each other.
    To do this, we need a multi-host `overlay` network. You will need Docker version
    1.12 or later running in swarm mode, or alternatively, a key-value storage running.
    If the drivers provided by Docker are not enough, we can use the network plugins
    to further extend the networking data exchange. We went through the volume creation
    process and know that volumes persist data even through container restarts; we
    also know that changes to files on the volume are made directly, but they will
    not be included when you update an image.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'Volumes allow sharing data between the host filesystem and the Docker container,
    or between other Docker containers, and they persist even if the container itself
    is deleted. We can use the volume drivers to further extend the file exchange
    possibilities.


    In the next chapter, we will focus on the Docker hub. We will learn how to find
    images that will be our foundation for the next chapters, where we will actually
    create our images using Dockerfiles.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 5


    # Finding Images


    In previous chapters, we have learned how to install Docker and we got familiar
    with the Docker architecture, networking, and persistent storage features. We
    have mentioned about working with the Docker Hub and remote repositories a little
    in `Chapter 3`, *Understanding Images and Containers*, but this time we will go
    into more details.


    This chapter will cover the following topics:


    +   - The Docker Hub

    +   - Image tags

    +   - Searching for images using the web interface and a command line

    +   - Docker Hub REST API


    Before we actually build our own images in the next chapter, we are going to focus
    on working with Docker Hub first—creating an account, authenticating, looking
    for images, and pulling them. We will go into more details of version and tags,
    explaining one of the most misunderstood Docker tags, `latest`. This chapter will
    also present the REST API of Docker Hub, which may come in handy if you plan to
    use Docker Hub programmatically—from your own applications or integration flow.


    This time also we will create an account on the Docker Hub—it will be mandatory
    when we publish our images to the world.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# The Docker Hub


    The main functionality of the Docker registry is to find a certain image based
    on a description. The registry handles Docker Images in repositories. It''s important
    to understand the difference between registry and repository. Docker registry
    is a service that is storing your Docker Images, and repository is a collection
    of different docker images with the same name, which have different tags (we will
    get back to tags in a while). Like the git counterpart, a Docker repository is
    identified by a URI and can either be public or private.


    The most recognized hosted version of a Docker registry is the Docker Hub. It
    comes with a nice and usable UI. The Docker Hub is a software-as-a service (SaaS)
    platform for sharing and managing Docker images. In other words, it''s a cloud-based
    registry service capable of hosting and distributing images. Images are being
    kept either in public or private repositories. Currently, the Hub serves hundreds
    of thousands public repositories and the number grows every day. Almost one third
    of these public repositories are using automated builds, which means that the
    images are being built by the Hub itself using a published Dockerfile. The rest
    of the repositories contain images that have been uploaded manually via a `docker
    push` command. Docker Hub is available at https://hub.docker.com/.


    ![](img/0c87321919fa245e22f056c67ec70003_113_0.png)


    Docker Hub is the default registry. If you do not provide registry host name using
    registry-related commands such as `login`, `pull`, or `push`, Docker will use
    the Docker Hub.


    A registry offers operations such as pushing (uploading an image into a repository)
    and pulling (downloading an image from a repository). Docker registry has also
    another important role to play, the index. The index maintains information about
    user accounts, checksums of the images, and public namespaces. In fact, the Docker
    Hub is a centralized index for public repositories.


    The Docker Hub is a public service and you get one private repository for free
    if your register your account. If you need more private repositories you can upgrade
    your Docker Hub plan, which will not be free of charge.


    Docker Hub is not just a registry and index-a place to search, store or get images
    from-it''s rather an umbrella project; it allows linking to code repositories
    (such as GitHub or BitBucket), create automated builds of your images, and test
    them. Docker Hub allows also linking to the Docker Cloud so you can deploy images
    to your own hosts. All these aspects will be useful when creating your image workflow
    automation throughout the development pipeline. We will cover these development-related
    features such as publishing and creating automated builds in detail in `Chapter
    8, Publishing Images`.'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'Apart from managing single user accounts and authentication, the Docker hub
    also manages organizations. By creating an organization, you can easily give your
    coworkers access to shared image repositories and let Docker Hub manage the team
    collaboration and change management.


    Let''s summarize the Docker Hub features:


    +   - **Accounts**: This helps in user management and authentication.

    +   - **Organizations**: This is used to create work groups to manage access to
    image repositories.

    +   - **Image repositories**: This is used to search, `pull`, `push`, and `manage`
    images from either community, official, or private image repositories.

    +   - **Automated builds and web hooks**: This is used to automatically trigger
    the image build process when changes to a source code are being made. Web hooks
    are a part of automated builds and let you execute different actions after pushing
    the image to a repository.

    +   - **Integration source code repositories**: This is used to link your GitHub
    and/or Bitbucket source code repositories to create a development workflow.

    +   - **REST API**: Almost every feature available through the Docker Hub''s web
    interface is also available as a well-documented REST endpoint you can use to
    deal with Docker Hub programmatically.


    The Docker Hub account (it''s called Docker ID) is not mandatory for searching
    and pulling images. In fact, as you remember, we have pulled a lot of `hello-world`,
    `nginx`, and `ubuntu` images to demonstrate the Docker''s architecture in the
    previous chapters, not having the proper Docker ID registered.


    ![](img/0c87321919fa245e22f056c67ec70003_114_0.png)


    Docker Hub account is not mandatory for searching and pulling images from the
    Docker Hub—you can download images without signing in or even having an account.


    However, in order to publish images, post your comments, or to star a repository,
    you will need a Docker ID. By leaving comments, you can interact with other members
    of the Docker community and maintainers of the specific images.


    ![](img/0c87321919fa245e22f056c67ec70003_114_1.png)


    Like in any matured community, your comments should be precise and meaningful.
    If you find any comments that are not appropriate, you can flag them for examination.'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'Starring a repository serves the same purpose as stars on the GitHub—it’s a
    way to show that you like a repository. Stars function also has an easy way of
    bookmarking your favorite repositories. As of the time of writing this book, the
    ubuntu repository was the most starred one. Let’s begin with account creation.


    # Docker Hub account


    In order to get your Docker ID, head to http://hub.docker.com and scroll to the
    Sign Up part. You will need to provide a username (it will become a namespace
    for images you will publish), password, and valid e-mail address, as shown in
    the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_115_0.png)'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'A valid e-mail address is required to register because the activation e-mail
    will be sent to this address.


    ![](img/0c87321919fa245e22f056c67ec70003_116_0.png)


    If you can''t find the validation e-mail, check the Spam folder and exclude docker.com
    from bad senders. If you still cannot find it, go to https://hub.docker.com/login/
    and perform the same procedure as for the password reset the activation link will
    be sent again.


    From there, you can log in using your Docker ID. When you first log into your
    new account, you will land on the Docker Dashboard, a page with tabbed interface,
    as shown in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_116_1.png)


    The first tab holds a list of your repositories; it will contain nothing for the
    fresh account and provide some quick shortcuts for creating a repository, organization,
    or exploring repositories. Note that you can also search for images using the
    search field in the header of the site, it''s always at hand. The second tab serves
    the purpose of your bookmarks viewer-it lists the repositories you have starred.'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'The Dashboard also presents a link to the account settings page, where you
    can set your default repository visibility (it''s `public` by default, you can
    change it to `private`). From here, you can also set your personal details such
    as name, location, web page address, or add additional e-mail address linked with
    your Docker ID (only can be primary). Those e-mail addresses will be used for
    all announcements and communication from Docker. The **Settings** page allows
    also converting your personal (User) account into the Organization account. Let''s
    clarify what an Organization account is.


    # Organization account and teams


    Organizations and groups allow you to collaborate across your organization or
    team. You can add new organizations and see what organizations you belong to in
    the account''s `Settings` tab. You can also see them below your username on your
    repositories page and in your account profile.


    If you switch your Dashboard to the organization you belong to, it will differ
    slightly from the personal user dashboard, as shown in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_117_0.png)'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'The main difference is the presence of the Teams tab, where you can define
    teams within your organization. Docker Hub will automatically create the Owners
    team. The Owners team is kind of special—you need to be a member of the organization''s
    Owners team to create a new repository, a new automated build and also a new team
    within this organization. If you belong to the Owner team, you can assign access
    right in the Collaborators section of the repository view. This can be read access
    (allowing you to view, search, and pull a private repository in the same way as
    they can a public repository), write access (allowing you to push an image), or
    admin access (allowing you to modify the repositories properties such as description,
    collaborators rights, public or private visibility, or delete the repository).
    You can add or invite users to any of the organization''s teams, by selecting
    the team and entering a username (for current Docker Hub users) or e-mail address,
    if they are not yet registered:


    ![](img/0c87321919fa245e22f056c67ec70003_118_0.png)


    In result, the invited users will receive an e-mail with an invitation to join
    the team.


    # Collaborators


    The Docker Hub introduces a term collaborator. A collaborator is simply another
    Docker Hub user, who you can give access to your repository, either public or
    private. You do it in the repository''s Settings page, in the Collaborators tab,
    as shown in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_118_1.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'Collaborators are not allowed to perform any administrative tasks such as deleting
    the repository or changing its status from private to public. They can, however,
    use your repository by executing `docker push` and `docker pull` commands. If
    you need more specific and detailed access rights setup for your repositories,
    consider using organization and teams provided by Docker Hub.


    ![](img/0c87321919fa245e22f056c67ec70003_119_0.png)


    It is worth noting, that a collaborator cannot add other collaborators. Only you,
    as the owner of the repository has administrative access.


    # Private Repositories


    If you want to store images that you want to keep private, you need to store them
    in a private repository. It will be visible only to your own account or within
    an organization or group. Once the repository is marked as private, you can push
    and pull images to and from it using Docker, the same as with other repositories
    that are public. The only difference is that you need to be signed in and have
    access to work with a private repository. Private repositories behave just like
    public ones; however, they will not be listed on the public registry.


    In the repository''s `Settings` page, you can switch its visibility, to be either
    `public` or `private`, as shown in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_119_1.png)


    If you make your repository private, it will be available to the members of your
    organization and you can also give access to anyone you choose as a collaborator.
    As you remember, the free Docker Hub account allows you to have just one private
    repository, if you want more, you will need to upgrade your plan.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Logging into Docker Hub


    You can of course login into your account using the Docker Hub page, but a more
    common action would be to log in using the shell or command line. Let''s log into
    the Docker Hub registry using our account:


    ```

    docker login --username myUser --password 123

    ```


    By default, Docker assumes the registry you are logging into will be Docker Hub.
    To log into a different registry, provide a registry''s hostname as the last parameter
    of the login command:


    ```

    docker login --username myUser --password 123 localhost:8080

    ```


    Let''s log into the Docker Hub, on a Mac this time:


    ![](img/0c87321919fa245e22f056c67ec70003_120_0.png)


    If you are authenticated correctly, the Docker will respond briefly, saying that
    we''re ready to pull images from the registry:


    ```

    Login Succeeded

    ```'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'After you login, an interesting thing will happen behind the scenes. Since
    communicating with a registry to pull, push, and look for images is very common
    when working with Docker, your credentials will be stored for future use. This
    way you can automate things. Docker will get the credentials from the local storage
    and use it on your behalf when you request things such as pulling or pushing an
    image. By default, Docker will use just a plain text file named .docker/config.json
    written in your home directory (or profile folder on MS Windows):


    ![](img/0c87321919fa245e22f056c67ec70003_121_0.png)


    The structure of this file supports multiple registries at once. In our case,
    we just have one entry for the default, official Docker index (index.docker.io),
    but we could have more if we need it. From now on, when the registry needs authentication
    (for example, when doing a push command), Docker will pick your credentials from
    the config.json file. Of course, the registry you going to work with must match
    the index URL taken from the entries in the config file. Note that there is no
    date or time present in the file—the credentials are cached forever until we tell
    Docker to remove them, using the logout command.


    ![](img/0c87321919fa245e22f056c67ec70003_121_1.png)


    Credentials stored in the local file are not encrypted—it’s just a username:password
    string encoded using Base64 encoding. Do not share this file with anyone.


    If you no longer want to cache your credentials in the local storage, issue the
    logout command:


    ```

    docker logout

    ```'
  merge: -1
  img_proc: true
- pgno: 122
  md: "Docker will reply, saying that the entry from the config.json file has been\
    \ removed and thus you have been logged out from the registry:\n\n```\nRemove\
    \ login credentials for https://index.docker.io/v1/\n```\n\nThe local credentials\
    \ file can be useful if you are experimenting with the Docker Hub and security\
    \ is not the thing you especially care for. In other cases, like working with\
    \ private registries or doing some serious work, storing the credentials in some\
    \ other storage can be a more appropriate and secure solution. Using an external\
    \ store is more secure than storing credentials in the Docker configuration file.\
    \ Luckily, the Docker Engine can make use of an external credentials store, such\
    \ as the native keychain of the operating system. This will be, for example, Apple\
    \ OS X keychain or Microsoft Windows Credential Manager.\n\n![](img/0c87321919fa245e22f056c67ec70003_122_0.png)\n\
    \nUsing external storages will require additional helpers available on a system\
    \ $PATH. The helper program interacts with a specific keychain or external store.\
    \ You can download helpers from GitHub https://github.com/docker/docker-credential-helpers/releases.\
    \ The list of currently available credential helpers include: D-Bus Secret Service,\
    \ Apple OS X keychain, and Microsoft Windows Credential Manager.\n\nIf you want\
    \ to use external storage for your credentials, you need to make helpers available\
    \ on a system $PATH and instruct Docker, that it needs to use this external storage\
    \ by modifying .docker/config.json:\n\n```\n{\n  \"credsStore\": \"osxkeychain\"\
    \n}\n```\n\nIf you will ever need to store the credentials in a storage that is\
    \ not officially supported by Docker, there are some third-party storage helpers\
    \ available on the Internet. For example, there is Amazon ECR Credentials helper\
    \ available on GitHub (https://github.com/aws labs/amazon-ecr-credential-helper).\
    \ It makes use of the same credentials as the AWS command-line tools and the AWS\
    \ SDKs. In case you don't find a credentials helper you need, Docker allows using\
    \ your own developed credential helpers. Basically, a helper can be any program\
    \ that can read values from the standard input. It exposes just three operations:\
    \ store (to save credentials, where the input is JSON containing the server URL,\
    \ name, and password), get, and erase to get and remove credentials from the storage,\
    \ respectively. Get and erase takes only server URL as an input parameter."
  merge: -1
  img_proc: true
- pgno: 123
  md: 'The simplest way to implement your own credentials store will be to browse
    the source code for the existing helpers at GitHub https://github.com/docker/docker-credential-helpers.


    Now that we understand what happens when you log into the registry, it''s time
    to make use of it and search for an image.


    # Searching for images


    To effectively search for a specific image, first we need to understand the Docker
    image naming schema and tags concept. We have already mentioned it before; let''s
    look at it now in detail.


    # Image naming and tags


    The full image name has the following syntax:


    ```

    {registry_host}/(_|/{user_or_org_namespace})/{repository}:{tag}

    ```


    Let''s explore it in detail, image names start with a namespace and a slash. For
    example, the image named `hello-world` created and uploaded by user `tutum` (which
    is an Apache image responding with `hello-world` message on port `80`, by the
    way) will begin with this part: `tutum/hello-world`.


    There can also be images with no namespace prefix-these will be images from the
    so-called **official repositories**. The official repositories are certified repositories
    from vendors and contributors to Docker such as Red Hat, Oracle, and Canonical.
    And of course, you can use them to build your own applications and services. An
    example of the official images can be the most-starred `ubuntu`, `nginx`, or the
    official version of `hello-world`-images that we have been using in the previous
    chapters. Official images are usually supported by the people who have created
    the application that is containerized in Docker, for example, `nginx` image from
    the official repository is supported by the Nginx team.


    ![](img/0c87321919fa245e22f056c67ec70003_123_0.png)


    If you decide to use an image from the official repository as the base for your
    own work, you can be pretty sure you''re using a maintained, optimized, and up-to-date
    image.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'Each repository can contain multiple images. For example, the `nginx` repository
    will contain different versions of the web server image, such as `1.10.1-alpine`,
    `stable`, `latest`, and so on. Each of these images is identified by tags. As
    we have mentioned before, tags usually represent different versions of the same
    application or service and are used to distinguish images from each other. A tag
    is simply an alphanumeric identifier attached to the image, which could be, for
    example, `1.0` or `latest`, but it''s considered good practice to provide a build
    hash to clearly and unambiguously identify the image. A tag name may not start
    with a period or a dash and may contain a maximum of 128 characters. Docker''s
    automated builds, which we are going to cover later, let you link image tags either
    to a branch or a tag in your git history.


    The `latest` tag is kind of a special one. Also, it may not work as you may expect.
    Well, to cut the long story short, it doesn''t mean anything special unless the
    image creator (`ubuntu` or `nginx`, for example) has a specific `build`, `tag`,
    and `push` pattern. The `latest` tag assigned to an image simply means that it''s
    the image that was last built and executed without a specific tag provided. It''s
    easy to understand that it may be confusing-pulling the image tagged `latest`
    will not fetch the latest version of the software.


    ![](img/0c87321919fa245e22f056c67ec70003_124_0.png)


    Docker will not take care of checking if you are getting the newest version of
    the software when pulling the image tagged `latest`.


    If you pull the image without specifying a tag, Docker will download the image
    tagged `latest`. But this will not be necessary with the latest and greatest version
    of the software you wanted to run. Instead, you should always consult the other
    tags present in the repository to pick the version of software you need.


    Also, the same `latest` tag behavior will apply if we build our own images later
    in this book. If you do not specify a tag after the repository name, it will be
    automatically assigned the `latest` tag in the repository.


    Last but not least, the image name can be prefixed with a hostname or IP of the
    Docker registry. For example, the image name `localhost:5000/hello-world` will
    reference a `hello-world` repository in your local registry. But what if you need
    to pull the official image from the registry other than Docker Hub? Following
    the image name schema, just use the single underscore character instead of user
    or organization name. For example, consider the following command:


    ```

    docker pull somerRegistry.com/_/someOfficialImage:1.0

    ```'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'This will pull the image tagged 1.0 from the someOfficialImage official repository
    located on someRegistry.com. You can also shorten the command by omitting the
    user or organization name completely. Our command will then look just like this:


    ```

    docker pull someRegistry.com/someOfficialImage:1.0

    ```


    As you remember, if you do not provide a registry hostname, Docker will default
    to its own official registry, the Docker Hub.


    Now we should have a full understanding of what the image name consists of. It
    should be easier to precisely locate an image to pull. You can find public repositories
    and images from Docker Hub in two ways. You use the Docker Hub website or you
    can use the Docker command-line tool to run the docker search command. Let''s
    search for an image now.


    # Searching through the web interface


    Looking for an image using the web interface of Docker Hub is as simple as using
    the Search field in the right upper corner:


    ![](img/0c87321919fa245e22f056c67ec70003_125_0.png)


    In response, Docker Hub will list images with names or authors matching your search
    term. Note that only public repositories will be presented on the result list.


    ![](img/0c87321919fa245e22f056c67ec70003_125_1.png)


    Private repositories will not appear in the repository search results.


    In the search results, you can notice the stars and the download count. This can
    give you an idea about how popular the repository is. Also, you can see if the
    repository is official or public and if it is built using the automated build:


    ![](img/0c87321919fa245e22f056c67ec70003_125_2.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'Searching using the web interface can be useful if you would like to get some
    more detailed information about the repository. If you click on the `repository`
    name, you will be presented with the repository details page, often containing
    a lot of useful information. The second tab on the details page contains a list
    of tags, so you can quickly look around and pick the version you need. This view
    also shows you the size of the associated image. Image sizes are the cumulative
    space taken up by the image and all its parent images—this is also the disk space
    used by the contents of the tar file formed when you execute the `docker save`
    command to export an image. If the image listed on the search results page is
    being built automatically, Docker Hub will present two additional tabs: The **Dockerfile**
    and **Build Details**. The **Dockerfile** tab will contain the Dockerfile being
    used during the build (it can be very useful when learning how to create your
    own Dockerfiles) and a linked source repository (as you remember, this may be
    GitHub or BitBucket):


    ![](img/0c87321919fa245e22f056c67ec70003_126_0.png)'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'The **Build Details** list the automated build job status (such as success
    or failure) and information like the date of the build:


    ![](img/0c87321919fa245e22f056c67ec70003_127_0.png)


    As you can see, the web interface of Docker Hub can give you a lot of details
    about the image you are looking for, but it''s not very convenient. A faster solution
    is to search for an image using the command line.


    # Searching using the command line


    Docker gives you a command for searching for an image: `docker search`.


    For example, if you were looking for an `ubuntu` image, you might run the following
    command line search: `docker search Ubuntu`.


    The syntax of the `search` command is rather straightforward, you can see it by
    issuing the `docker help search` command. By default, it takes only one argument—what
    to look for. Searching can find images by image name, username, or description.
    This will show you a list of the currently available repositories on the Docker
    Hub, which match the provided keyword. This is an example output of searching
    for the Ubuntu image:'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Finding Images


    ![](img/0c87321919fa245e22f056c67ec70003_128_0.png)


    There is a lot of information at a glance. Notice that the command output lists
    the image names, a short description, also the number of stars, a marker saying
    if it''s the official repository and a status of the last automated build.


    If a repository is private, it won''t be listed on the repository search results,
    unless you are the image creator, member of an organization, or a collaborator.


    ![](img/0c87321919fa245e22f056c67ec70003_128_1.png)


    Private repositories will not appear in the repository search results. To see
    all the repositories you can access and their status, view the Dashboard on Docker
    Hub.'
  merge: -1
