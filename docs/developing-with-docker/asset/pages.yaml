- pgno: 72
  md: 'The last component you should be aware of is an Index. An Index manages search
    and tagging but also user accounts and permissions. In fact, the registry delegates
    authentication to the index. When executing remote commands such as push or pull,
    the index first will look at the name of the image and then check to see if it
    has a corresponding repository. If so, the index verifies if you are allowed to
    access or modify the image. If you are, the operation is approved and the registry
    takes or sends the image.


    # Summary


    Let''s summarize what we have learned so far. We already know that the Dockerfile
    is the source code of the Image. It contains ordered instructions on how to build
    an image. An image is a specific state of a filesystem: a read-only, frozen immutable
    snapshot of a live container. It''s composed of layers representing changes in
    the filesystem at various points in time; layers are a bit like the commit history
    of a Git repository. Containers, on the other hand are runtime instances of an
    image. They can have state (for example, running or stopped). You can make changes
    to the filesystem on a container and commit them to make them persisted, but only
    changes in the filesystem can be committed – memory changes will be lost. Commit
    always creates a new image. We also mentioned the concept of a registry, which
    holds a collection of named repositories, which themselves are a collection of
    images tracked by their IDs. A registry is like a Git repository: you can push
    and pull containers. We are going to cover repositories in detail in Chapter 5,
    Finding Images.


    After reading this chapter you should have an understanding the nature of images
    with their layers and containers. But Docker provides another way of extending
    and opening containers to the external world: networking and persistent storage.
    We are going to cover this subject in the next chapter.'
