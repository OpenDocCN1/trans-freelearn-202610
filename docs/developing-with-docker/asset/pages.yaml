- pgno: 221
  md: '# 9


    # Using Docker in Development


    After reading the past chapters, you should be able to pull a image and use it
    as the base for your own image. We already know how to create an image, attach
    volumes, expose ports, and run it in a container. We can also publish it into
    the Docker Hub for others to use. This is the last chapter in which we are going
    to cover some practical examples of how you can put Docker to use in your daily
    life as a developer. First of all, you will learn how to make Docker work with
    the most popular Java build system: Maven. Then we can put our applications into
    containers in practice; we will run Spring Boot Java application from inside a
    Docker container. Next, we will pack the Angular.js frontend application, which
    runs on Node.js in a Docker container. These examples should give you an idea
    and some inspiration on how you can create Docker containers with your own applications.
    In particular, we are going to cover the following topics in this chapter:


    +   - Using Docker with Maven

    +   - Packaging Java Spring Boot application into the container

    +   - Packaging node.js Angular application into the container


    Let''s begin with explaining how to incorporate Docker in our Java Maven build.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Using Docker with Maven


    If you develop in Java, you probably know Maven. It''s used widely to build Java
    applications or libraries. The Maven''s build process uses the concept of an artifact.
    An artifact is a file, usually a JAR (containing Java libraries or application)
    or WAR/EAR, which is a Java web application. The artifacts are deployed to a Maven
    repository. A Maven build produces one or more artifacts and each artifact has
    a group ID (usually a reversed domain name, such as com.example.foo), an artifact
    ID (just a name), and a version string. The three together uniquely identify the
    artifact. Your application dependencies are also specified as artifacts. You already
    know Docker pretty well, so you could probably imagine what a useful Maven plug
    in for Docker should do. It should allow to:


    +   - Pull images from the registry

    +   - Build container images

    +   - Start containers

    +   - Optionally link containers

    +   - Expose the needed ports (useful for integration tests)

    +   - Push images to the registry


    Including Docker in your Maven build setup can be especially useful in your development
    flow. Imagine that after Maven build, the resulting image containing your application
    could be automatically pushed to the registry, thus making it ready for your colleagues,
    testers, or clients. Your high-level build process could include the following
    steps:


    +   1. Build from sources

    +   2. Execute unit tests

    +   3. Create Docker image (the dockerbuild command needs to be executed here)

    +   4. Run integration tests on the container (Docker commands, such as run, start,
    expose, link, and stop will be probably executed here)

    +   5. Publish the image (the last step is usually the docker publish command)


    There are a lot of Docker plugins for Maven; we will focus on probably the two
    most interesting ones. The first one is Spotify''s Maven Docker Plugin.'
  merge: -1
  img_proc: true
- pgno: 223
  md: "# Spotify's Maven Docker plugin\n\nIt's available as open source and you can\
    \ get the sources and documentation from GitHub: https://github.com/spotify/docker-maven-plugin.\
    \ You can use this plugin to create a Docker image with artifacts built from your\
    \ Maven project. For example, the build process for a Java service can output\
    \ a Docker image that runs the service.\n\nThe usage of the Spotify's docker-maven-plugin\
    \ is pretty straightforward. You will just have to include it as a plugin in your\
    \ build and provide a `dockerDirectory` value in the configuration. The plugin\
    \ will expect the Dockerfile in this directory, so if you specify that directory,\
    \ it must contain valid Dockerfile. You can also build the image without Dockerfile.\
    \ In this case, you will need to provide additional plugin configuration, such\
    \ as `baseImage` (it will be used in the `FROM` instruction-the starting point\
    \ in every Dockerfile, as you remember from Chapter 6, *Creating Images*), `maintainer`,\
    \ `cmd` and `entrypoint`.\n\nThe contents of the directory specified as the `dockerDirectory`\
    \ value will be copied into `${project.build.directory}/docker`. This will be\
    \ the build context when the `docker build` command starts. Using the `resource`\
    \ element, you can include additional artifacts to the Docker's build context.\
    \ Take a look at the following example fragment of the `pom.xml` build file:\n\
    \n```\n```xml\n<build>\n    <plugins>\n        <plugin>\n            <groupId>com.spotify</groupId>\n\
    \            <artifactId>docker-maven-plugin</artifactId>\n            <version>0.4.13</version>\n\
    \            <configuration>\n                <imageName>myImage</imageName>\n\
    \                <dockerDirectory>docker</dockerDirectory>\n                <resources>\n\
    \                    <resource>\n                        <targetPath/>\n     \
    \                   <directory>${project.build.directory}</directory>\n      \
    \                  <include>${project.build.finalName}.jar</include>\n       \
    \             </resource>\n                </resources>\n            </configuration>\n\
    \        </plugin>\n    </plugins>\n</build>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 224
  md: "In the preceding example we have included the plugin in the plugins section\
    \ of the pom.xml file. One jar file from the ${project.build.directory}, which\
    \ will be the /target directory by default will be included in the build context.\
    \ This time it will be a jar file named as your application name, containing your\
    \ built application.\n\nHaving this setup, altogether with a proper Dockerfile\
    \ referencing the application jar from the /target directory is enough to create\
    \ a Docker image from the Maven's pom.xml. You have to simply execute the following\
    \ Maven target:\n\n```\n```\nmvn clean package docker:build\n```\n```\n\nIf you\
    \ decide to push the resulting image into the registry, the additional -DpushImage\
    \ parameter is needed:\n\n```\n```\nmvn clean package docker:build -DpushImage\n\
    ```\n```\n\nIf you need the image to be built, tagged, and pushed when you run\
    \ just mvn deploy, you will need to bind Docker commands to Maven phases, similar\
    \ to how you normally do with every other build plugin. Spotify's plugin is nice,\
    \ quick, and simple. If you just need to build images, it can be a starting point.\
    \ But it has one limitation: it doesn't allow running containers. Since this plugin\
    \ can be only used to build an image, it's quite limited. Let's look at another\
    \ one: fabric8io Docker plugin.\n\n# fabric8io Maven Docker plugin\n\nIts configuration\
    \ is different. The fabric8 plugin uses a configuration section for all images\
    \ to maintain. It has configuration item for each section, which are divided into\
    \ build and run parts for building instructions and runtime configurations. Some\
    \ of the features include a progress bar when pulling images, dynamic and flexible\
    \ port mapping and assignment to variables, and building images via plugin configuration\
    \ or Dockerfile (the same as Spotify's plugin). It also logs output of the containers'\
    \ standard out during integration test and has full support for waiting on time,\
    \ specific URL or log output after container startup.\n\nFabrio8.io Docker Maven\
    \ plugin is very powerful and flexible when it comes to the configuration. To\
    \ setup the image configuration, you will need to create <image> element in the\
    \ <configuration><images> element, as shown on the following example:\n\n```\n\
    ```xml\n<configuration>\n  <images>\n    <image>\n      <alias>myApplication</alias>\n\
    \      <name>me/my-application:${project.version}</name>\n      <build>\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 225
  md: "```\n```xml\n<from>java:8</from>\n<assembly>\n    <descriptor>artifact</descriptor>\n\
    </assembly>\n<cmd>\n    <shell>java -jar maven/myApplication.jar</shell>\n</cmd>\n\
    </build>\n<run>\n    <ports>\n        <port>8080:8080</port>\n    </ports>\n</run>\n\
    </image>\n</images>\n</configuration>\n```\n```\n\n![](img/0c87321919fa245e22f056c67ec70003_225_0.png)\n\
    \nYou can have multiple <image> elements, for each image you are going to create\
    \ or use.\n\nThe image build process is configured within the <build> element.\
    \ Fabric8.io plugin takes two approaches for the build configuration; you can\
    \ either use the existing Dockerfile or use the inline configuration (as seen\
    \ in the previous example). If you want to use the existing Dockerfile, you need\
    \ to provide additional dockerFileDir and dockerFile elements. The first one will\
    \ specify a directory containing a Dockerfile, the second one will point to the\
    \ specific Dockerfile in that directory. All files in the directory that are specified\
    \ as the dockerFileDir element will also be included in the image build context.\n\
    \nThe inline configuration, on the other hand, will describe the image building\
    \ process in the pom.xml itself. You will need to provide elements, such as <from>,\
    \ which will contain the base image (as FROM instruction in the Dockerfile). The\
    \ assembly descriptor contains all the files that will go into the image and <cmd>\
    \ contains the command to run when a container is created. As we discussed in\
    \ Chapter 6, Creating Images, this setup resembles a standard Dockerfile and of\
    \ course you have the full support for all Dockerfile standard features. You can\
    \ expose ports (the same way as we did in Chapter 6, Creating Images, with the\
    \ EXPOSE Dockerfile instruction)."
  merge: -1
  img_proc: true
- pgno: 226
  md: "To expose ports, you will need to define <port> sub-elements in the <ports>\
    \ element. In the following example, we are exposing port number 8080 that we\
    \ can map to the host's port later when running the container:\n\n```\n```xml\n\
    <ports>\n  <port>8080</port>\n</ports>\n```\n```\n\nTo define volumes, similar\
    \ construction is needed and each <volume> element that is contained inside the\
    \ <volumes> element will represent the volume. Exactly the same as the VOLUME\
    \ instruction, it creates a mount point with the specified name and marks it as\
    \ holding externally mounted volumes from native host or other containers.\n\n\
    ```\n```xml\n<volumes>\n  <volume>/path/to/volume</volume>\n</volumes>\n```\n\
    ```\n\nTo define the entry point of the image, you will need, as you may have\
    \ guessed already, an <entrypoint> element, as shown in the following example:\n\
    \n```\n```xml\n<entryPoint>\n  <exec>\n    <arg>java</arg>\n    <arg>-jar</arg>\n\
    \    <arg>/maven/myApplication.jar</arg>\n  </exec>\n</entryPoint>\n```\n```\n\
    \nThe<entrypoint> specifies a command that will always be executed when the container\
    \ starts, the same way the ENTRYPOINT instruction in the normal and traditional\
    \ Dockerfile.\n\nThe<assembly> element in the build configuration specifies how\
    \ build artifacts and other files your application may need will be put in the\
    \ resulting Docker image. There are a couple of predefined assembly descriptors,\
    \ such as artifact-with-dependencies (which will attach the project's artifact\
    \ and all its dependencies into the image), artifact (where only the project's\
    \ artifact will be put into the image, project (attaches the whole Maven project\
    \ into the image), and rootWar (which will copy the artifact as ROOT.war into\
    \ the exposed directory)."
  merge: -1
  img_proc: true
- pgno: 227
  md: "![](img/0c87321919fa245e22f056c67ec70003_227_0.png)\n\nAll files coming from\
    \ assembly descriptor will go to the image automatically. You can see what was\
    \ included in the image by looking into the contents of the target/docker/yourProject/build/maven\
    \ directory.\n\nAs you can see, the configuration from the <build> element matches\
    \ the structure and contents of Dockerfile almost exactly. It will be taken into\
    \ account when you execute the docker:build command using Maven:\n\n```\nmvn -PmyProfile\
    \ docker:build\n```\n\nThe <run> element of the <image> contains the runtime setup;\
    \ this is going to be used when you create and run the Docker container using\
    \ Maven using the following command:\n\n```\nmvn -PmyProfile docker:build docker:start\n\
    ```\n\nIn the runtime configuration, you can define port mappings as shown in\
    \ the following example:\n\n```\n<ports>\n  <port>8080</port>\n</ports>\n```\n\
    \nIn the preceding case, the container port 8080 will be mapped to the Docker\
    \ host port 8080. This will be the same as what we did in the Chapter 4, Networking\
    \ and Persistent Storage, we have mapped the exposed ports using the -p or -P\
    \ option for the docker run command:\n\n```\ndocker run --name nginx -d -P nginx\n\
    ```\n\nApart from mapping ports, you can also map volumes. This will again resemble\
    \ the mapping which we did previously using the -v option for the docker run command:\n\
    \n```\ndocker run -it -v data:/data ubuntu\n```\n\nAs we had seen in Chapter 4,\
    \ Networking and Persistent Storage, a container can mount volumes from various\
    \ sources when starting up. It can be a directory of the host system or from another\
    \ container which exports one or more directories. The mount configuration is\
    \ specified within a <volumes>section of the <run> configuration.\n\n```\n<volumes>\n\
    \  <bind>\n    <volume>/logs</volume>\n    <volume>/opt/hostDirectory:/opt/containerDirectory</volume>\n\
    \  </bind>\n</volumes>\n```"
  merge: -1
  img_proc: true
- pgno: 228
  md: "To import volumes from another image (as we did with --volumes-from earlier),\
    \ you can use the <from> and <image> elements in your volumes configuration. To\
    \ provide an image name or alias, specify the volumes you would like to use in\
    \ the <image> element, as shown in the following example:\n\n```\n<volumes>\n\
    \  <from>\n    <image>test/myApplication2</image>\n  </from>\n</volumes>\n```\n\
    \nThe fabric8.io Maven plugin is a complete solution and contains all Docker-related\
    \ build and runtime configurations. You can link images, provide runtime network\
    \ settings, and define runtime restart policy (we have been talking about restart\
    \ policies in detail in the Chapter 7, Running Containers). It also has a full\
    \ set of Maven related goals, such as docker:build for building images, docker:start\
    \ or docker:run and docker:stop for managing the container's lifecycle, docker:push\
    \ for uploading containers to the registry, and docker:logs to output the container\
    \ log. You can even include the resulting Docker image into Maven artifacts for\
    \ further processing using maven:source goal.\n\nTo execute the whole chain of\
    \ actions, that is, create image, start the container, execute unit test, stop\
    \ the container, and do the cleanup, execute the install command:\n\n```\nmvn\
    \ -PmyProfile install\n```\n\nThe fabric8.io plugin has a lot to offer when working\
    \ with Maven and Docker. You can always refer to the newest documentation present\
    \ on the plugin's website at https://dmp.fabric8.io/. It's the first class choice\
    \ if you need to build or run Docker containers from your Maven build.\n\nNow\
    \ we know how to create and run Docker containers from our own build process.\
    \ Let's focus now on packaging actual applications into containers. We are going\
    \ to cover example setups, such as Java application and Angular.js frontend application.\
    \ Let's begin with Java; we are going to containerize the Spring Boot application.\
    \ We will use the fabric8 Docker Maven plugin that we already know about."
  merge: -1
  img_proc: true
- pgno: 229
  md: "# Spring Boot application in Docker container\n\nFor the purpose of our example,\
    \ we will start with a simple hello-world type Spring Boot application. We are\
    \ going to run in on top of official Java image: openjdk. If you prefer to run\
    \ it on the Oracle Java image, you can search for it in the DockerHub registry.\
    \ There are a lot of images that are ready to use, some of them are based on the\
    \ official images, such as Ubuntu for example. As we saw in Chapter 6, Creating\
    \ Images, it's always good to pick an official image as the base image. Official\
    \ images are tested, supported, and usually of very high quality. The basic steps\
    \ for creating Java application in the container are:\n\n+   - Using a base image\
    \ pulled out from the Docker Hub\n+   - Installing the application itself, it\
    \ will be an executable jar file in our case\n+   - Exposing ports, if your application\
    \ needs to communicate with the outside world using a network\n+   - Running the\
    \ container\n\nOf course, if you would like to put another kind of application\
    \ in the container, the preceding steps would not be enough; you would want to\
    \ install a web server on top of your base image, such as Tomcat or Wildfly. Also,\
    \ the application itself would probably be packaged in a WAR or EAR file.\n\n\
    The application that we are going to put in the container will be just a very\
    \ simple Spring Boot hello world sample application. We are not going to cover\
    \ Spring Boot in detail, we just need to have something to package and run from\
    \ the Docker container.\n\nLet's begin with creating our Maven pom.xml build file,\
    \ as shown in the following example:\n\n```\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<project>\n    <modelVersion>4.0.0</modelVersion>\n    <groupId>pl.finsys</groupId>\n\
    \    <artifactId>hello-docker</artifactId>\n    <version>0.0.1-SNAPSHOT</version>\n\
    \    <parent>\n        <groupId>org.springframework.boot</groupId>\n        <artifactId>spring-boot-starter-parent</artifactId>\n\
    \        <version>1.4.1.RELEASE</version>\n    </parent>\n    <dependencies>\n\
    \        <dependency>\n            <groupId>org.springframework.boot</groupId>\n\
    \            <artifactId>spring-boot-starter-web</artifactId>\n        </dependency>\n\
    \    </dependencies>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 230
  md: "```\n```xml\n<properties>\n    <java.version>1.8</java.version>\n</properties>\n\
    <build>\n    <plugins>\n        <plugin>\n            <groupId>org.springframework.boot</groupId>\n\
    \            <artifactId>spring-boot-maven-plugin</artifactId>\n        </plugin>\n\
    \    </plugins>\n</build>\n</project>\n```\n```\n\nAs you can see, we are using\
    \ `spring-boot-starter-parent` as a parent `pom.xml`. It saves us a lot of work\
    \ and is excellent for the purpose of this example of having a running Spring\
    \ Boot application. Our application is built by Maven, so the folder structure\
    \ needs to resemble the standard Maven application structure. It will contain\
    \ `pom.xml` file, then `src/main/java` folders. The `java` folder will contain\
    \ our Java packages. The complete file folders structure will look similar to\
    \ the following screenshot:\n\n![](img/0c87321919fa245e22f056c67ec70003_230_0.png)\n\
    \nOur first (and only) REST controller will be `Hello.java`, let's put it in the\
    \ `java/helloDocker` folder:\n\n```\n```java\npackage helloDocker;\nimport org.springframework.web.bind.annotation.RestController;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\n@RestController\n\
    public class HelloController {\n    @RequestMapping(\"/\")\n    public String\
    \ hello() {\n        return \"Greetings from Spring Boot in Docker!\";\n    }\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 231
  md: "Having this controller saved in the HelloController.java file in the main/src/java/helloDocker\
    \ directory, all we need is the actual application it's starting point. Create\
    \ a new Java class in the helloDocker package:\n\n```\n```java\npackage helloDocker;\n\
    import org.springframework.boot.SpringApplication;\nimport org.springframework.boot.autoconfigure.\n\
    \    SpringBootApplication;\nimport org.springframework.context.ApplicationContext;\n\
    @SpringBootApplication\npublic class Application {\n    public static void main(String[]\
    \ args) {\n        ApplicationContext ctx =\n            SpringApplication.run(Application.class,\
    \ args);\n    }\n}\n```\n```\n\nThis is it; we have a complete Spring Boot application\
    \ with one feature it will respond to HTTP GET call with a message Hello from\
    \ Spring Boot in Docker! Let's build it using Maven first, by executing the mvn\
    \ package command:\n\n```\n```\nmvn package\n```\n```\n\nFor this, you will need\
    \ Maven to be installed and available on the system path. It will take a while,\
    \ all Maven dependencies will need to be downloaded first and a source of your\
    \ application needs to be compiled. You should be able to see the following message\
    \ saying that the build succeeded:\n\n![](img/0c87321919fa245e22f056c67ec70003_231_0.png)"
  merge: -1
