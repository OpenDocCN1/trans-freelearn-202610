- pgno: 11
  md: '# Preface


    Docker has got a lot of attention in the last few years. Today it has thousands
    of community contributors, countless numbers of containers downloads, and more
    and more third party projects using it. It seems that its acclaim will grow even
    more in the next few years. In this book, we will try to explain this extraordinary
    popularity and show how you can benefit from faster and simpler application development,
    testing, and deployment. We will learn Docker from a developer’s perspective mostly
    and focus on creating, running, and publishing Docker images, rather than managing
    and clustering them. We will begin with the basic ideas and advantages which Docker
    brings to the developer’s tool set.


    # What this book covers


    Chapter 1, Introduction to Docker, briefly describes what Docker is and how it
    can be useful in modern software development and deployment. We will point out
    what advantages come with the tool and why it is helpful. This chapter will also
    demonstrate how the containers containing code, runtime, system tools, and libraries
    can speed up the development and deployment, at the same time making it a more
    enjoyable experience.


    Chapter 2, Installing Docker, contains the brief description of the available
    tools, such as Docker CLI or Kinematic (Docker GUI). Next, we will go straight
    to the action--installing the tools. The chapter will give precise and practical
    instructions on how to install the Docker Toolbox on Mac, Linux, and Windows.
    The chapter will also describe the process of installing Docker in the cloud,
    such as Amazon AWS.


    Chapter 3, Understanding Images and Containers, talks about the Docker’s architecture.
    We will explain the terminology related to working with it. After reading this
    chapter you will understand the concepts and architecture behind Docker; it is
    a must when going through the next chapters.


    Chapter 4, Networking and Persistent Storage, describes the Dockers networking
    and storage concepts. The chapter will introduce the reader to containers networking
    and present different kind of containers (open, closed, bridged and joined). The
    reader will also get familiar with the idea of volumes and their types. Additionally,
    the reader will learn how to manage, mount, and share Docker volumes.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Chapter 5, Finding Images, describes the process of identifying software, finding
    and installing it with the Docker Hub, and the alternative sources. After reading
    this chapter, the reader will be able to find a specified image in the Docker
    repository and then install it.


    Chapter 6, Creating Images, tells the reader how to write a Dockerfile, how to
    build an image from it, and get familiar with the image build process. The chapter
    will contain the best practices for writing Dockerfiles and useful tips and tricks
    for dealing with the images.


    Chapter 7, Running Containers, tells us how to run programs within containers.
    The chapter will describe the concept of starting, stopping, restarting, listing,
    and viewing the container output. The reader will run multiple programs in a container
    and get familiar with injecting the configuration into the container. We will
    also describe the container life cycle and the cleanup process.


    Chapter 8, Publishing Images, familiarizes us with the process of packaging software
    for distribution. After reading this chapter, the reader will be able to create
    a Docker Hub account & repository. Then, he will push his image up to it so other
    people with Docker Engine can run it. The chapter will also describe the process
    of private software distribution. At the end of the chapter, the reader will pull
    his own image from the repository to test the process.


    Chapter 9, Using Docker in Development, discusses how to incorporate building
    Docker images into the Maven build process. To do that, we will utilize docker-maven
    plugins. We will also package a Java web application running on Spring Boot embedded
    server. To demonstrate the process of packaging a static web application into
    Docker container we will also run angular.js application with node.js backend
    from inside the Docker container.


    Appendix A, More resources, directs you to some more useful resources for further
    reading, such as forums, blogs, and websites related to Docker. The chapter will
    also mention some useful third party tools related to Docker and show how they
    can be useful when working with Docker.


    # What you need for this book


    You will need a Mac or PC, running OS X, MS Windows or Linux to be able to setup
    and run Docker. You can download Docker for free. You can read how to get and
    install it in Chapter 2, Installing Docker.'
  merge: -1
  img_proc: true
