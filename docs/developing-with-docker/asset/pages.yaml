- pgno: 129
  md: 'The reason for this is that Docker first asks the index if you have enough
    permissions to list and pull the image (if you are the creator, member of the
    organization, or a collaborator). Actually, a lot of actions are being taken in
    the background:


    +   - You execute the request to the index to list or download the image.

    +   - In response, the index returns an information:

    +     - The registry in which the image is located

    +     - Checksums for the image, including all its layers

    +     - A token for authorization purposes (*not mandatory for public repositories*):

    +       - You contact the registry with the token that was returned in the index''s
    response.

    +       - In return, the registry asks the index if the token is authorized and
    valid.

    +       - Lastly, the index now sends a true/false message back to the registry,
    allowing or forbidding you to list or pull the needed image.


    Using the shell (or command line) commands to find an image is the fastest way
    of finding the image. Once you have found the image you want—now comes the part
    you already know—just download the image with the docker pull command. But you
    are not limited only to docker search/pull commands and the Docker Hub web interface
    to deal with the images. Docker provides a comprehensive set of remote APIs and
    one of them is the Docker Hub and Docker registry REST API.


    # Docker Hub and docker registry REST API


    Let''s discuss Docker Registry API and Docker Hub API and list the API endpoints
    related to searching and downloading the images. We will be using the command-line
    tool curl, but you can use any REST client of your choice, even your web browser.


    First, let''s check the status of the remote registry, by issuing a call to /_ping
    endpoint, by executing an HTTP GET:


    ```

    ```bash

    curl -k https://registry.hub.docker.com/v1/_ping

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 130
  md: "The registry will reply with a simple true value, that it's up and running.\n\
    \nFirst, we need to login or verify if we are logged in. Authorization is done\
    \ with Basic Auth over SSL. To deal with user accounts, the API exposes the /users\
    \ endpoint. Now, issue a GET on the following URL:\n\n```\nhttps://registry.hub.docker.com/v1/users\n\
    ```\n\nThis will reply with an OK response if you are logged in or return the\
    \ HTTP 401 Unauthorized status if you are not:\n\n![](img/0c87321919fa245e22f056c67ec70003_130_0.png)\n\
    \nThe Docker Hub API is not read-only, it also accepts POST requests. For example,\
    \ you can register your new account issuing a POST to the /users endpoint. The\
    \ POST request payload needs to contain the registration data, such as e-mail,\
    \ username, and a password, for example:\n\n```\n{\n  \"email\": \"someUser@someHost.com\"\
    ,\n  \"username\": \"myNewAccount\",\n  \"password\": \"mySecret\"\n}\n```\n\n\
    To execute such an API call, you can use the curl command or any other tool or\
    \ command for performing HTTP requests. An example curl command would look like\
    \ this:\n\n```\n$ curl -H \"Content-Type: application/json\" -X POST -d '{\" email\
    \ \":\" someUser@someHost.com\",\" username\":\" myNewAccount\", \"password\"\
    :\" mySecret\"}' https://registry.hub.docker.com/v1/users\n```\n\nThe response\
    \ to this call will be just a string User Created, coming with the HTTP 201 User\
    \ Created return code. In case of any errors, the response will have HTTP 400\
    \ Error code."
  merge: -1
  img_proc: true
- pgno: 131
  md: 'To update the user account, for example, to change a password or e-mail address
    for a given user, you will need to send similar JSON payload to the same /users
    endpoint, but with the PUT request. If you pass in an e-mail, it will add it to
    your account, it will not remove the old one. Passwords will be updated.


    To look up images in the specific repository, we will use the /images endpoint.
    The URL for listing images is:


    ```

    /v1/repositories/(namespace)/(repo_name)/images

    ```


    So, to list the images in the official ubuntu repository, for example, we need
    to perform an HTTP GET operation on the following:


    ```

    https://registry.hub.docker.com/v1/repositories/ubuntu/images

    ```


    Let''s execute the call (in a web browser this time—there will be a lot of output).
    Simply enter the URL in your web browser and execute the GET request. In return,
    the Hub will reply with a JSON containing the image IDs:


    ![](img/0c87321919fa245e22f056c67ec70003_131_0.png)


    Not very readable, but there''s another endpoint for listing tags, which the repository
    has. To obtain all tags or a specific tag of a repository, execute GET on the
    /tags endpoint. This has a similar URL:


    ```

    /v1/repositories/(namespace)/(repository)/tags

    ```'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Let''s try it to lookup tags in the ubuntu repository, by executing the `GET`
    request on `https://registry.hub.docker.com/v1/repositories/ubuntu/tags`:


    ![](img/0c87321919fa245e22f056c67ec70003_132_0.png)


    Now, in the response we have some more information like the layer ID and a name
    of the tag, often including the `latest` tag.


    Apart from the endpoints for listing user login and validation, listing images
    and tags, the Registry Hub API contains some more. Let''s summarize them in the
    following table:


    | Purpose | Request type and endpoint |

    |---|---|

    | Status check of registry | `GET /v1/_ping` |

    | Create a new user account | `POST /v1/users` |

    | Update user details | `PUT /v1/users/(username)/` |

    | Authorize a token for a library | `PUT /v1/repositories/(repo_name)/auth` |'
  merge: -1
  img_proc: true
- pgno: 133
  md: '| Authorize a token for user''s repository | PUT /v1/repositories/(namespace)/(repo_name)/auth
    |

    | Verify a user login | GET /v1/users |

    | Create a new library repository | PUT /v1/repositories/(repo_name)/ |

    | Create a new user repository | PUT /v1/repositories/(namespace)/(repo_name)/
    |

    | Update user repository images | PUT /v1/repositories/(namespace)/(repo_name)/images
    |

    | Update library repository images | PUT /v1/repositories/(repo_name)/images |

    | Delete the existing library repository | DELETE /v1/repositories/(repo_name)/
    |

    | Delete the user repository | DELETE /v1/repositories/(namespace)/(repo_name)/
    |

    | List images in the library repository | GET /v1/repositories/(repo_name)/images
    |

    | List images in user''s repository | GET /v1/repositories/(namespace)/(repo_name)/images
    |

    | Retrieve an image | GET /v1/images/(image_id)/json |'
  merge: -1
  img_proc: true
- pgno: 134
  md: '| Obtain all tags or a specific tag of a repository | GET /v1/repositories/(namespace)/(repository)/tags
    |

    | Delete a tag | DELETE

    /v1/repositories/(namespace)/(repository)/tags/(tag*) |

    | Extract image layer | GET /v1/images/(image_id)/layer |

    | Insert image layer | PUT /v1/images/(image_id)/layer |

    | Retrieve roots of an image | GET /v1/images/(image_id)/ancestry |


    All of the API commands are pretty well documented on the Docker documentation
    website, available at https://docs.docker.com. There you can find example JSON
    payloads you need to provide for your API calls, altogether with example responses
    and HTTP return status codes. The exposed REST API is a great way if you want
    to develop your own applications or automation scripts dealing with the Registry.
    This is another proof of extensibility and flexibility Docker provides for administrators
    or developers.


    After reading this chapter, you should now be familiar with the ways you can look
    for images, be it using the web interface, command-line tool, or remote API. You
    should be able to easily find an image that will become a base for your own images,
    which we are going to create in the next chapter, actually.


    # Summary


    After reading this chapter, you should have the understanding about the concept
    of Docker''s remote storages-Docker Registries. We also know how to create and
    manage user''s account on the most popular Docker registry, the Docker Hub. We
    are able to find an image that can be useful and appropriate as a base for our
    own image. In fact, in Chapter 6, Creating Images, we will use all of it in practice—we
    will create an image based on the image found in the Docker Hub.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# 6


    # Creating Images


    After reading the previous chapters, you should be familiar on how to find images
    suitable as a base for your own software. You can pull them from the remote repository,
    run and make changes to them during runtime and then export as new images. We
    saw building our own image earlier via running a container, installing our software
    in it, and doing a commit to create the image in Chapter 3, Understanding Images
    and Containers. This is not very practical and sometimes very cumbersome. Luckily,
    there''s a solution for that. Docker has a scripting engine that we can use to
    create a new image with a predefined list of instructions and properties. We call
    these scripts Dockerfiles. This time, we are going to create an image based on
    a Dockerfile. This chapter will cover the following topics:


    +   - Introduction to Dockerfiles

    +   - Creating and editing Dockerfiles

    +   - Dockerfile instructions

    +   - Building images


    Let''s understand what a Dockerfile is first. It''s nothing more than a plain
    text file containing instructions on how to build an image. Docker will process
    this file and build images step-by-step (or rather, layer-by-layer), automatically,
    taking a source (base) image as a foundation. We can, for example, use the base
    Ubuntu image, install the application server such as Wildfly, configure your own
    application or service, and publish the resulting image as a whole–a complete
    application that others can use. Using Dockerfile has a lot of benefits–you edit
    and work on a text file, rather than making all the changes directly and saving
    the image back to disk. You treat the Dockerfile as a part of the source code
    of your application–you should put it into the version control system like GIT
    to be able to track changes and share it with members of your team. In fact, writing
    a Dockerfile is a more consistent and repeatable way to build your own images.
    Also, using Dockerfile is the recommended way of building images on the fly, for
    example, in the continuous deployment setup.'
  merge: -1
  img_proc: true
- pgno: 136
  md: 'This chapter will cover the following topics:


    +   - Creating and editing Dockerfiles

    +   - Dockerfile instructions

    +   - Building images


    Let''s begin by creating a Dockerfile. We are going to create images in a more
    programmatic way using the Dockerfile. To edit Dockerfile, you can use any text
    editor of your choice, but it would be a lot more convenient to use an IDE with
    syntax highlighting support for Dockerfiles. For example, IntelliJ IDEA has a
    Docker integration plugin I can highly recommend. By the way, we will be using
    this plugin a lot in the next chapter–there is a new IDEA Run/Debug Configuration
    for Docker deployments, which will allow you to specify the cloud deployment target,
    an appropriate Dockerfile, and give your container a name. This plug-in lets you
    download and build images, create and start containers, and carry out other Docker-related
    tasks. Apart from that, you will get editor completion and syntax highlighting
    when editing Dockerfiles, as you can see in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_136_0.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'The image creation flow in Docker is pretty straightforward and consists basically
    of two steps:


    +   - First, you prepare `Dockerfile`, which is just a text file that has a series
    of instructions on how to build the image. It supports a not very large set of
    commands that you can use in your Dockerfile, to instruct Docker how to create
    an image.

    +   - Next, you will use the docker build command to create a Docker image based
    on the Dockerfile that you have just created.


    The standard name for a Dockerfile is just `Dockerfile` and it''s just a plain
    text file.

    Dockerfiles use simple, clean, and clear syntax, which makes them strikingly easy
    to create and use. They are designed to be self-explanatory, especially because
    they allow commenting just like a good and properly written application source
    code.


    The instructions in this file are not case-sensitive, however, the good idea is
    to stick to a convention and write them in uppercase–this will make a Dockerfile
    more readable. You can write comments in the Dockerfile using the hash symbol
    #. Docker will skip commented lines unless it contains a parser directive, which
    we are going to cover in a while. While some commands, such as `MAINTAINER`, can
    be placed anywhere in a Dockerfile, most of them such as `ADD` must be placed
    in the order you would like them to be executed when building an image. `CMD`
    and `ENTRYPOINT` are exceptions–only the last `CMD` or `ENTRYPOINT` instruction
    in a Dockerfile will have an effect.


    ![](img/0c87321919fa245e22f056c67ec70003_137_0.png)


    The order of instructions in a Dockerfile is important–they will be executed in
    the same order as in the Dockerfile.


    Let''s start with the description of possible Dockerfile instructions, one by
    one.


    # Dockerfile instructions


    In this section, we are going to cover Dockerfile instructions one by one. Let''s
    begin with the instruction that should be the first one in the Dockerfile we are
    going to create, the `FROM` instruction.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# FROM


    The syntax for the FROM instruction is very simple. It can have three forms. It
    can be as simple as that:


    ```

    FROM <image>

    ```


    By default, Docker will use the image tagged latest. If you need to build upon
    different tags, you will need to add the tag name after the name of the image.
    The FROM instruction will take this form then:


    ```

    FROM <image>:<tag>

    ```


    Last but not least, you can even more precisely pick the image using its digest.
    As you remember from the previous chapters, images with the same tag can change
    in time, if their author decides so. If you like to lock your base image to the
    fixed version, you can specify its digest as the image name. This way your own
    image will be always built using the specific version of the base image, regardless
    of tags. To specify base image using digest, use the following syntax of the FROM
    instruction:


    ```

    FROM <image>@<digest>

    ```


    The FROM instruction tells Docker what will be the base for the image being created.
    Here you can use your skills of finding images on the Docker Hub, learned in Chapter
    5, Finding Images. Now this is important–as it will be starting point–choose wisely.
    Of course you can pick whatever you want to be base for your own image, it''s
    up to you–but my recommendation would be to always prefer the official repositories.
    By choosing the official image, you can be pretty sure it will be of high quality,
    tested, supported, and maintained.


    ![](img/0c87321919fa245e22f056c67ec70003_138_0.png)


    You can use your own images in the FROM instruction.


    If a FROM image is not found on your Docker host (on your local machine, for example),
    Docker will try to find and download it from the Docker image index. Again, the
    Docker Hub will be picked by default.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'All subsequent instructions in the Dockerfile will use the image specified
    in FROM as a base starting point. That''s why it''s mandatory–a valid Dockerfile
    must have it at the top. Although you can have multiple FROM instructions in your
    image, it''s probably not a good and recommended practice–while interesting, isn''t
    fully supported. In particular, the nonfinal images that are produced by using
    multiple FROM are not easily found without some parsing of the build output. Actually,
    there is an ongoing discussion on Docker''s GitHub about removing the support
    for multiple FROM instructions from a Dockerfile specification.


    The FROM instruction takes a tag or digest as a parameter. If you decide to skip
    them, Docker will assume you want to build your image from the latest tag. As
    you remember from Chapter 5, Finding Images, it will not always be the latest
    version of the image you want to build upon. Docker will throw an error during
    the build if it cannot find a tag or digest you provide.


    # MAINTAINER


    By using the MAINTAINER instruction, you set the Author field of the generated
    image. This can be your name, username, or whatever you would like it to be referenced
    with, as an author of the image that will be created using this Dockerfile. This
    command can be placed anywhere in a Dockerfile, but the good practice is to place
    it on top of the file, just after the FROM instruction. This is the so-called
    non-executing command, which means that it will not make any changes to the generated
    image. The syntax, again, is very simple:


    ```

    MAINTAINER authors_name

    ```


    # ADD


    The ADD basically copies the files from the source on the host into the Docker
    image''s own filesystem at the desired destination. It takes two arguments; the
    source (<source path or URL>) and a destination (<destination path>):


    ```

    ADD <source path or URL> <destination path >

    ```'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'The source path can be a file or a directory relative to the directory in which
    the build process is going to be started (the build context). This means you cannot
    have, for example, `../../config.json` placed as a source path parameter of the
    `ADD` instruction. The build context can be changed using the `PATH` option in
    the `docker build` command and the source path is relative to the build context.


    The source can contain wildcards. These are the same as in conventional filesystem:
    * for any text string, or ? for any single character.


    Consider the following examples:


    +   - `ADD myFiles* /myDirectory/`: This will add all the files starting with
    myFiles

    +   - `ADD file?.txt /myDirectory/`: This will replace with any single character
    so that it will match `file1.txt`, `fileB.txt`, and so on.


    ![](img/0c87321919fa245e22f056c67ec70003_140_0.png)


    The destination path, on the other hand, cannot contain wildcards.


    You can specify multiple source paths, separated with a comma. All of them must
    be relative to the building context, the same as if you have just a single source
    path. If your source or destination paths contain spaces, you will need to use
    a special syntax, adding the square brackets around:


    ```

    ADD ["<source path or URL>" "<destination path>"]

    ```


    A trailing slash / is quite important when adding files or directories to an image.
    If the source path doesn''t end with a trailing slash, it will be considered as
    a single file and just copied into the destination. If the source path ends with
    a trailing slash, it will be considered as a directory; all of its contents will
    then be copied into the destination path, but the directory itself will not be
    created at the destination path.


    If the source path points to the compressed archive in one of the common formats
    such as `zip`, `tar`, and so on, it will be decompressed into the destination
    path. Docker doesn''t recognize an archive by the filename, it checks the contents
    of the file.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '![](img/0c87321919fa245e22f056c67ec70003_141_0.png)


    If the archive is damaged or unreadable by Docker in another way, it will not
    be extracted and you will not be given an error message—the file will be just
    copied into the destination path.


    The same trailing slash rules apply to the destination path: if it ends with a
    trailing slash, it means that it''s a directory. Otherwise, it will be considered
    as a single file. This gives you great flexibility when constructing filesystem
    contents of your image—you can add files into directories or just add whole directories.


    ![](img/0c87321919fa245e22f056c67ec70003_141_1.png)


    Note that when using ADD with more than one source file, the destination must
    be a directory and end with a slash /.


    The ADD command is not only about copying files from the local filesystem—you
    can use it to get the file from the network. If the source is a URL, then the
    contents of the URL will be automatically downloaded and placed at the destination.
    Note that file archives that were downloaded from the network will not be decompressed.
    Again, the trailing slash is important when downloading files—if the destination
    path ends with a slash, the file will be downloaded into the directory. Otherwise,
    the downloaded file will be just saved under the name you provided as the destination
    path.


    The <destination directory> is either an absolute path or a path that is relative
    to the directory specific by the WORKDIR instruction (we will cover it in a while).
    The source (or multiple sources) will be just copied into the destination specified.
    Consider the following example:


    +   - `ADD config.json projectRoot/` will add the `config.json` file to `<WORKDIR>/projectRoot/`

    +   - `ADD config.json /absoluteDirectory/` will add the `config.json` file to
    the `/absoluteDirectory/`


    When it comes to the ownership of the files created in the image, they will always
    be created with the user ID (UID) 0 and group ID (GID) 0. Permissions will be
    the same as in the source file, unless it''s a file downloaded from the remote
    URL. In this case, it will get permissions value 600 (only the owner can read
    and write the file). If you need to change these values (ownership or permissions),
    you will need to provide more instructions in your Dockerfile, after the ADD instruction.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/0c87321919fa245e22f056c67ec70003_142_0.png)


    If the files that you need to add to the image are placed on the URL that needs
    authentication, the ADD instruction will not work–you will need to use the shell
    command to download the file, such as wget or curl.


    # COPY


    The COPY instruction will copy new files or directories from <source path> and
    adds them to the filesystem of the container at the path <destination path>.


    It''s very similar to ADD instructions, even the syntax is identical:


    ```

    COPY <source path or URL> <destination path >

    ```


    The same rules from ADD apply to COPY–all source paths must be relative to the
    context of the build. Again, the presence of the trailing slash at the end of
    source and destination path is important. If it''s present, the path will be considered
    as a file, otherwise it will be treated as a directory.


    Of course, as in ADD, you can have multiple source paths. If source or destination
    paths contain spaces, you will need to wrap them in to square brackets:


    ```

    COPY ["<source path or URL>" "<destination path>"]

    ```


    The <destination path> is an absolute path (it begins with a slash), or a path
    relative to the path specified by the WORKDIR instruction.


    As you can see, the functionality of COPY is almost the same as that of the ADD
    instruction with one difference. COPY supports only the basic copying of local
    files into the container. On the other hand, ADD features some more, such as archive
    extraction, downloading files through URL, and so on. Docker''s best practices
    say, that you should prefer COPY if you do not need those additional features
    of ADD. The Dockerfile will be cleaner and easier to understand thanks to the
    transparency of the COPY command.


    There is one common, important aspect for both ADD and COPY instructions, a cache.
    Basically, Docker caches the files that go into the image during the build. The
    contents of the file or files in the image is examined and a checksum is calculated
    for each file. During the cache lookup, the checksum is compared against the checksum
    in the existing images. If anything has changed in the file(s), such as the contents
    and metadata, then the cache is being invalidated. Otherwise, if the source file
    has not changed, then an existing image layer is being reused.'
  merge: -1
  img_proc: true
- pgno: 143
  md: "If you have multiple Dockerfile steps that use different files from your context,\
    \ copy them individually, rather than all at once. This will ensure that each\
    \ step's build cache is only invalidated (forcing the step to be re-run) if the\
    \ files that are specifically required change.\n\nAs you can see, the `COPY` instruction\
    \ has almost identical syntax and behavior as the `ADD` instruction, but their\
    \ feature set is somehow different. For files and directories that do not require\
    \ the `ADD` feature of archive unpacking or fetching from the URL, you should\
    \ always use `COPY`.\n\n# CMD\n\nThe purpose of a `CMD` instruction is to provide\
    \ defaults for an executing container. You can think about the `CMD` instruction\
    \ as the *starting point* of your image, when the container is being run later\
    \ on. This can be an executable, or if you specify the `ENTRYPOINT` instruction\
    \ (we are going to explain it in a while later in this chapter) you can omit the\
    \ executable and provide the default parameters only.\n\nThe `CMD` instruction\
    \ syntax be as follows:\n\n```\nCMD [\"parameter1\",\"parameter2\"]\n```\n\n+\
    \   - `CMD [\"executable\", \"parameter1\", \"parameter2\"]`: This is the so-called\
    \ exec form. It's also the preferred and recommended form. The parameters are\
    \ enclosed in square brackets–it's a JSON array. It also means that you must use\
    \ double quotes (`) around words, not single quotes ('). The important note is\
    \ that the exec form does not invoke a command shell when the container is run.\
    \ It just runs the executable provided as the first parameter. It means also that\
    \ normal shell processing will not happen, for example, the following environment\
    \ variables substitution will not work:\n+   \n+     ```\n+     CMD [\"parameter1\"\
    ,\"parameter2\"]\n+     ```\n+   \n+     This form of `CMD` instruction just provides\
    \ a default set of parameters for the `ENTRYPOINT` instruction.\n+   - `CMD command\
    \ parameter1 parameter2`: This a shell form of the instruction. This time, the\
    \ shell (if present in the image) will be processing the command. The specified\
    \ binary will be executed with an invocation of the shell using `/bin/sh -c`.\
    \ It means that if you display the container's hostname, for example, using `CMD\
    \ echo $HOSTNAME` you should use the shell form of the instruction."
  merge: -1
  img_proc: true
- pgno: 144
  md: 'We have said before that the recommended form of CMD instruction is the exec”
    form. Here''s why everything started through the shell will be started as a subcommand
    of /bin/sh -c, which does not pass signals. This means that the executable will
    not be the container''s PID 1–and will not receive Unix signals–so your executable
    will not receive a SIGTERM from docker stop <container>. There is another drawback–you
    will need a shell in your container. If you''re building a minimal image, it doesn''t
    need to contain a shell binary. The CMD instruction using the shell form will
    simply fail.


    ![](img/0c87321919fa245e22f056c67ec70003_144_0.png)


    When Docker is executing the command, it doesn''t check if the shell is available
    inside the container; if there is no /bin/sh in the image, the container will
    fail to start.


    The difference between exec and shell forms of the instruction can be easily shown
    in the running example. Consider the following Dockerfile, using the shell form:


    ```

    FROM ubuntu

    CMD echo $HOSTNAME

    ```


    The output will be just the unique hostname generated by Docker when the container
    is run:


    ![](img/0c87321919fa245e22f056c67ec70003_144_1.png)


    On the other hand, if we will change the CMD to the exec form, Docker will be
    looking for an executable named echo, which, of course, will fail, because echo
    is a shell command.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'Because CMD is like a starting point for the Docker Engine when running a container,
    there can only be one single CMD instruction in a Dockerfile.


    ![](img/0c87321919fa245e22f056c67ec70003_145_0.png)


    If there are more than one CMD instructions in a Dockerfile, only the last one
    will take effect.


    The parameters for the CMD command can be overridden when starting the image–if
    you specify arguments to docker run. While launching the container, you can override
    the default CMD parameters by providing them at the command line, as shown in
    the following screenshot. In this example, we are asking you to launch the /bin/sh
    -c shell again, because we are using the shell form of the CMD, this time overriding
    the default CMD instruction from the Dockerfile:


    ```

    docker run 00bd948ecdff "echo" "Hello world!"

    ```


    Notice that this time it will not print out the hostname, but Hello world instead,
    taken from our overridden CMD parameters:


    ![](img/0c87321919fa245e22f056c67ec70003_145_1.png)


    We are going to cover this in detail in Chapter 7, Running Containers.'
  merge: -1
  img_proc: true
- pgno: 146
  md: "# ENTRYPOINT\n\nThe official Docker documentation says that the ENTRYPOINT\
    \ instruction allows you to configure a container that will run as an executable.\
    \ It's not very clear, at least for the first time. The ENTRYPOINT instruction\
    \ is related to the CMD instruction. In fact, it can be confusing at the beginning.\
    \ The reason for that is simple; CMD was developed first, then ENTRYPOINT was\
    \ developed for more customization, and some functionality overlaps between those\
    \ two instructions. Let's explain it a bit. The ENTRYPOINT instruction specifies\
    \ a command that will always be executed when the container starts. The CMD instruction,\
    \ on the other hand specifies the arguments that will be fed to the ENTRYPOINT\
    \ instruction. Consider this example. Let's say that the image we want to run\
    \ (ubuntu) has an ENTRYPOINT which is /bin/sh -c but does not have a default CMD\
    \ and we execute the following command:\n\n```\ndocker run ubuntu \"echo\" \"\
    hello world\"\n```\n\nIn this case, the image will be the latest ubuntu, the ENTRYPOINT\
    \ instruction will be the /bin/sh -c, and the command passed to the ENTRYPOINT\
    \ instruction will be echo \"hello world\".\n\nThe syntax for the ENTRYPOINT instruction\
    \ can have two forms, similar to CMD:\n\n+   - ENTRYPOINT [\"executable\", \"\
    parameter1\", \"parameter2\"]: This is the exec form, preferred, and recommended.\
    \ Exactly the same as in the exec form of CMD instruction, this will not invoke\
    \ a command shell. This means that normal shell processing will not happen. For\
    \ example, ENTRYPOINT [ \"echo\", \"$HOSTNAME\" ] will not do variable substitution\
    \ on the $HOSTNAME variable. If you want shell processing, then you need to either\
    \ use the shell form or execute a shell directly, for example:\n+   \n+     ENTRYPOINT\
    \ [ \"sh\", \"-c\", \"echo $HOSTNAME\" ]\n+   \n+     Variables that are defined\
    \ in the Dockerfile using ENV (we are going to cover this in a while), will be\
    \ substituted by the Dockerfile parser.\n+   - ENTRYPOINT command parameter1 parameter2:\
    \ It's a shell form. Normal shell processing will occur. This form will also ignore\
    \ any CMD or docker run command-line arguments. Also, your command will not be\
    \ PID 1, because it will be executed by shell. As a result, if you then run docker\
    \ stop <container>, the container will not exit cleanly–the stop command will\
    \ be forced to send an SIGKILL command after the timeout.\n\n```\nENTRYPOINT [\
    \ \"sh\", \"-c\", \"echo $HOSTNAME\" ]\n```"
  merge: -1
  img_proc: true
- pgno: 147
  md: 'You need to know that, exactly the same as with CMD instruction, only the last
    ENTRYPOINT instruction in the Dockerfile will have an effect. Overriding the ENTRYPOINT
    in the Dockerfile allows you to have a different command processing your arguments
    when the container is run. If you need to change the default shell in your image,
    you can do this by changing an ENTRYPOINT:


    ```

    FROM ubuntu

    ENTRYPOINT ["/bin/bash"]

    ```


    From now on, all parameters from CMD or provided when starting the container using
    docker run, will be processed by Bash shell instead of default /bin/sh -c.


    Consider another example Dockerfile:


    ```

    FROM busybox

    ENTRYPOINT ["/bin/ping"]

    CMD ["localhost"]

    ```


    If you now run the container built from this Dockerfile, the ping command, as
    an image ENTRYPOINT will be processing arguments from the supplied CMD argument:
    localhost, in our case. As a result, you will have a /bin/ping localhost command-line
    response:


    ![](img/0c87321919fa245e22f056c67ec70003_147_0.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'As you remember from the CMD instruction description, it sets the default command
    and/or parameters, which can be overwritten from the command line when Docker
    container runs. The ENTRYPOINT command and parameters will not be overwritten
    from the command line. Instead, all the command-line arguments will be added after
    ENTRYPOINT parameters.


    Unlike the CMD parameters, the ENTRYPOINT command and parameters are not ignored
    when Docker container runs with the command-line parameters.


    That''s why we can run our ping image with different parameters passed to the
    ENTRYPOINT instruction:


    ![](img/0c87321919fa245e22f056c67ec70003_148_0.png)


    You can use the exec form of ENTRYPOINT to set fairly stable default commands
    and arguments and then use either form of CMD to set additional defaults that
    are more likely to be changed.


    Having the ENTRYPOINT instruction gives us a lot of flexibility. And, last but
    not least, an ENTRYPOINT can be also overridden when starting the container using
    the --entrypoint parameter for the docker run command. Note that you can override
    the ENTRYPOINT setting using --entrypoint, but this can only set the binary to
    execute (no sh -c will be used). We will cover this in detail in Chapter 7, Running
    Containers.'
  merge: -1
  img_proc: true
- pgno: 149
  md: 'As you can see, both `CMD` and `ENTRYPOINT` instructions define what command
    gets executed when running a container. Let''s summarize what we have learnt about
    the differences and their co-operation:


    +   - Dockerfile should specify at least one of the `CMD` or `ENTRYPOINT` instructions

    +   - Only the last `CMD` and `ENTRYPOINT` in a Dockerfile will be used

    +   - `ENTRYPOINT` should be defined when using the container as an executable

    +   - You should use the `CMD` instruction as a way of defining default arguments
    for the command defined as `ENTRYPOINT` or for executing an ad-hoc command in
    a container

    +   - `CMD` will be overridden when running the container with alternative arguments

    +   - The `ENTRYPOINT` argument sets the concrete default application that is
    used every time a container is created using the image

    +   - If you couple `ENTRYPOINT` with `CMD`, you can remove an executable from
    `CMD` and just leave its arguments, which will be passed to the `ENTRYPOINT` instruction

    +   - The best use for the `ENTRYPOINT` instruction is to set the image''s main
    command, allowing that image to be run as though it was that command (and then
    use `CMD` as the default flags).


    # LABEL


    To add the metadata to our image, we use the `LABEL` instruction. A single label
    is a key-value pair. If you need to have spaces in the label value, you will need
    to wrap it into the pair of quotes. Labels are additive. They include all labels
    taken from the image that is the base of your own image (the one from the `FROM`
    instruction). If Docker encounters a label that already exists, it will override
    the label having the same key with the new value.


    ![](img/0c87321919fa245e22f056c67ec70003_149_0.png)


    There are some rules that you must stick to when defining labels: keys can only
    consist of lowercase alphanumeric characters, dots, and dashes and must begin
    and end with an alphanumeric character.


    To prevent naming conflicts, Docker recommends using namespaces to label keys
    using reverse domain notation. On the other hand, keys without namespaces (dots)
    are reserved for command line use.'
  merge: -1
  img_proc: true
- pgno: 150
  md: 'The syntax of the LABEL instruction is straightforward:


    ```

    LABEL "key"="value"

    ```


    To have a multiline value, separate the lines with backslashes, for example:


    ```

    LABEL description="This is my \ multiline description of the software."

    ```


    You can have multiple labels in a single image. Provide them separated with a
    space or a backslash, for example:


    ```

    LABEL key1="value1" key2="value2" key3="value3"

    LABEL key1="value1" \

    key2="value2" \

    key3="value3"

    ```


    Actually, if you need to have multiple labels in your image, it''s recommended
    to use the multilabel form of the LABEL instruction, because it will result in
    just one additional layer in the image.


    ![](img/0c87321919fa245e22f056c67ec70003_150_0.png)


    Each LABEL instruction creates a new layer. If your image has many labels, use
    the multiple form of the single LABEL instruction.


    If you want to inspect what labels an image has, use the docker inspect command
    you already know from the previous chapters:


    ![](img/0c87321919fa245e22f056c67ec70003_150_1.png)'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'The ENV Dockerfile instruction sets the environment variable <key> to the value
    <value>. It has two forms:


    +   - The first form, ENV <key> <value> will set a single variable to a value.
    The entire string after the first space will be treated as the <value>. This will
    include any character, also spaces and quotes. Consider the following example:
    ENV JAVA_HOME /var/lib/java8

    +   - The second form is ENV <key>=<value> ..., and allows setting multiple environment
    variables at once. The difference is the equal to sign. If you need to provide
    spaces in the values, you will need to use quotes. If you need quotes in the values,
    use backslashes: ENV CONFIG_TYPE=file CONFIG_LOCATION="home/Jarek/my \ app/config"


    Note that you can use ENV to update the PATH environment variable, and then CMD
    parameters will be aware of that setting. This will result in a cleaner form of
    CMD parameters in the Dockerfile. Consider the following example:


    ```

    ENV PATH /var/lib/tomcat8/bin:$PATH

    ```


    Setting this will ensure that CMD ["startup.sh"] works, because it will find the
    startup.sh file in the system PATH. You can also use ENV to set the often modified
    version numbers so that upgrades are easier to handle, as shown in the following
    example:


    ```

    ENV TOMCAT_VERSION_MAJOR 8

    ENV TOMCAT_VERSION 8.5.4

    RUN curl -SL

    http://apache.uib.no/tomcat/tomcat-$TOMCAT_VERSION_MAJOR/v$TOMCAT_VERSION/bin/apache-tomcat-$TOMCAT_VERSION.tar.gz
    | tar zxvf apache-tomcat-$TOMCAT_VERSION.tar.gz -c /usr/Jarek/apache-tomcat-$TOMCAT_VERSION

    ENV PATH /usr/Jarek/apache-tomcat-$TOMCAT_VERSION/bin:$PATH

    ```


    In the preceding example, Docker will download the version of Tomcat specified
    in the ENV variable, extract it to the new directory with that version in its
    name and also set up the system PATH to make it available for running.


    The environment variables set using ENV will persist when a container is run from
    the resulting image. The same as with labels created with LABEL, you can view
    the ENV values using the docker inspect command. The ENV values can be also overridden
    just before the start of the container, using docker run --env <key>=<value>.'
  merge: -1
  img_proc: true
- pgno: 152
  md: "# EXPOSE\n\nThe EXPOSE instruction informs Docker that the container listens\
    \ on the specified network ports at runtime. We already have mentioned the EXPOSE\
    \ instruction in Chapter 4, Networking and Persistent Storage. As you remember,\
    \ the EXPOSE in a Dockerfile is the equivalent for the --expose command line option.\
    \ Docker uses the EXPOSE command followed by a port number to allow incoming traffic\
    \ to the container. We already know that EXPOSE does not make the ports of the\
    \ container automatically accessible to the host. To do that, you must use either\
    \ the -p flag to publish a range of ports or the -P flag to publish all of the\
    \ exposed ports at once.\n\nLet's look at the Nginx web server Dockerfile, as\
    \ an example. As always, looking at an existing source is the best of way to create\
    \ your own. It's no different, when it comes to Dockerfiles. The Nginx Dockerfile\
    \ is quite nice and small, it's available on GitHub (https://github.com/dockerfile/nginx/blob/master/Dockerfile):\n\
    \n```\n# Pull base image.\nFROM ubuntu:14.04\n# Install Nginx.\nRUN \\\n    add-apt-repository\
    \ -y ppa:nginx/stable && \\\n    apt-get update && apt-get install -y nginx &&\
    \ \\\n    rm -rf /var/lib/apt/lists/* && \\\n    echo \"\\ndaemon off;\" >> /etc/nginx/nginx.conf\
    \ && \\\n    chown -R www-data:www-data /var/lib/nginx\n\n# Define mountable directories.\n\
    VOLUME [\"/etc/nginx/sites-enabled\", \"/etc/nginx/certs\",\n\"/etc/nginx/conf.d\"\
    , \"/var/log/nginx\", \"/var/www/html\"]\n\n# Define working directory.\nWORKDIR\
    \ /etc/nginx\n\n# Define default command.\nCMD [\"nginx\"]\n\n# Expose ports.\n\
    EXPOSE 80\nEXPOSE 443\n```"
  merge: -1
  img_proc: true
- pgno: 153
  md: 'As you can see in the preceding Dockerfile, it uses EXPOSE to expose two ports:
    standard HTTP (80) and SSL (443). These ports will be available for the other
    containers on this host, and–if you expose them during runtime–also for the external
    world. You can either run the image using a specified port explicitly:


    ```

    docker run nginx -p 80

    ```


    Alternatively, you can tell Docker that we want all of the exposed ports published
    at once:


    ```

    docker run nginx -P

    ```


    The good practice is to use common, known port numbers for your application. For
    example, if your application runs on nginx web server, you should do the EXPOSE
    with port number 80, so that the users of your application will not be surprised
    with some exotic port numbers. Of course, if there''s a specific need for exposing
    nonstandard port numbers, you are free to go, it''s just a good practice.


    # RUN


    The RUN instruction is the central executing instruction for Dockerfiles. In essence,
    the RUN instruction will execute any commands in a new layer on top of the current
    image and then commit the results. The resulting committed image will be used
    as a base for the next instruction in the Dockerfile. As you remember from Chapter
    3, Understanding Images and Containers, layering is the core concept in Docker.
    RUN takes a command as its argument and runs it to form the image. The RUN instruction
    can run any command (or application), which is similar to the CMD instruction
    we got to know earlier. There is a key important difference–the time of execution.
    The command supplied through the RUN instruction is executed during the build
    time, whereas the command specified through the CMD instruction is executed when
    the container is launched by executing docker run on the newly created image.
    Unlike CMD, the RUN instruction is actually used to build the image, by creating
    a new layer on top of the previous one which is committed.


    ![](img/0c87321919fa245e22f056c67ec70003_153_0.png)


    CMD is runtime instruction, where RUN is the build-time instruction.'
  merge: -1
  img_proc: true
- pgno: 154
  md: 'This also means that CMD and ENTRYPOINT set parameters that can be overridden
    at runtime, so if you don''t change anything, after starting your container, the
    result will always be the same. RUN, however, will be executed at build time and
    no matter what you do at runtime, its effects will be seen here.


    RUN, similarly to CMD and ENDPOINT, can take two forms:


    +   - `RUN <command>`: This is a shell form. The supplied command and its arguments
    will be executed in a shell, which is `/bin/sh -c` on Linux or `cmd /S /C` on
    Windows. The default shell for the RUN instruction can be changed using the SHELL
    command.

    +   - `RUN ["executable", "parameter1", "parameter2"]`: This an exec form. The
    same rules apply as in CMD. Using this form, you can execute commands using a
    base image that does not contain the specified shell executable. RUN in this form
    will not invoke a command shell. And again, the same as with CMD or ENTRYPOINT,
    normal shell processing such as variable substitution, for example, will not happen.


    ![](img/0c87321919fa245e22f056c67ec70003_154_0.png)


    To make your Dockerfile more readable and easier to maintain, you can split long
    or complex RUN statements on multiple lines separated with backslashes.


    The RUN commands from the Dockerfile will be executed in the order they appear
    in it. Each RUN instruction will create a new layer in the image. Layers, as you
    already know from Chapter 3, Understanding Images and Containers, are being cached
    and reused by Docker. The cache for RUN instructions isn''t invalidated automatically
    during the next build. For example, the cache for an instruction such as RUN apt-get
    upgrade -y will be reused during the next build. What makes the cache important?
    For the most part, the cache is exceptionally helpful and can save you tremendous
    amount of time while building your images. If the objects on the filesystem that
    Docker is about to produce are unaffected between builds, reusing a cache of a
    previous build on the host is a great time-saver. It makes building a new container
    really, really fast. None of those file structures have to be created and written
    to disk this time–the reference to them is sufficient to locate and reuse the
    previously built structures. However, there are times when the caching can be
    dangerous and provide unexpected results. Cache is used pretty heavily during
    the build process and this may cause issues when you want the updated output of
    a RUN command to make it into the new container.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'If the RUN command doesn''t change between two builds, Docker''s cache will
    not get invalidated. In effect, Docker will reuse the previous results from cache.
    This is clearly harmful, when, for example, the RUN command is a source code checkout,
    for example, a Git clone as the first step of a project''s build.


    ![](img/0c87321919fa245e22f056c67ec70003_155_0.png)


    Beware that cache needs to be invalidated sometimes, otherwise you will get unexpected
    results with your image builds.


    That''s why it''s good to know how to selectively invalidate the cache. In the
    Docker world, this is called cache busting.


    Consider the following example. Probably the most common use-case for RUN is an
    application of apt-get, which is a package manager command for downloading packages
    on Ubuntu. Let''s say we have the following Dockerfile, installing a MongoDB in
    image:


    ```

    FROM ubuntu

    RUN apt-get update

    RUN apt-get install -y mongodb-server

    ```


    If we build an image from this Dockerfile, all layers from two RUN instructions
    will be put into the layers cache. But, after a while you decide you want the
    node.js package in your image, so now the Dockerfile looks like this:


    ```

    FROM ubuntu

    RUN apt-get update

    RUN apt-get install -y mongodb-server

    RUN apt-get install -y nodejs

    ```


    On the second build, Docker will reuse the layers by taking them from the layer''s
    cache. As a result the apt-get update will not be executed, because the cached
    version will be used. In effect, your newly created image will potentially have
    an outdated version of the MongoDb and node-js packages. You should always have
    the cache concept in mind when creating RUN instructions. In our example, we should
    always combine RUN apt-get update with apt-get install in the same RUN statement,
    which will create just a single layer. Consider the following example:


    ```

    RUN apt-get update \

    && apt-get install -y mongodb-server \

    && apt-get install -y nodejs

    ```'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Yet better than this, you can also use a technique called **version pinning**
    to avoid cache problems. It''s nothing else than just providing a specific, concrete
    version for the package you want to install:


    ```

    RUN apt-get update \

    && apt-get install -y mongodb-server \

    && APT-GET INSTALL -Y NODEJS= 0.6.12~DFSG1-1UBUNTU1

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_156_0.png)


    Using `apt-get update` alone in a RUN statement is not recommended because of
    the caching issues.


    The cache for RUN instructions can be invalidated by ADD instructions or using
    the `--no-cache` flag, for example:


    ```

    docker build --no-cache

    ```


    # USER


    The USER instruction is very simple. It sets the user name or UID to use when
    running the image. It also affects the user for any RUN, CMD, and ENTRYPOINT instructions
    that follow it in the Dockerfile.


    The syntax of the instruction is just USER <user name or UID>, for example:


    ```

    USER tomcat

    ```


    You can use the USER command if an executable can be run without privileges. The
    Dockerfile can contain the user and group creation instruction like this one:


    ```

    RUN groupadd -r tomcat && useradd -r -g tomcat tomcat

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_156_1.png)


    Switching USER back and forth frequently will increase the number of layers in
    the resulting image and will also make a Dockerfile more complex.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# VOLUME


    As you remember from Chapter 3, *Understanding Images and Containers*, Docker
    filesystems are kind of temporary by default. If you start up a Docker image (that
    is, run the container) you''ll end up with a read-write layer on top of the layers
    stack. You can create, modify, and delete files as you wish, then commit the layer
    to persist the changes. Also, using Dockerfile will create a read-only image.
    In Chapter 4, *Networking and Persistent Storage* we have learned how to create
    volumes—a great way of storing and retrieving data from the Docker container.
    We can do the same in the Dockerfile, using the VOLUME instruction.


    The syntax couldn''t be simpler, it''s just `VOLUME [ "/volumeName" ]`.


    The parameter for VOLUME can be a JSON array, a plain string with one or more
    arguments, for example:


    ```

    VOLUME ["/var/lib/tomcat8/webapps/"]

    VOLUME /var/log/mongodb /var/log/tomcat

    ```


    The VOLUME instruction creates a mount point with the specified name and marks
    it as holding externally mounted volumes from native host or other containers.


    The VOLUME command will mount a directory inside your container and store any
    files created or edited inside that directory on your host''s disk out side the
    container file structure. Using VOLUME in the Dockerfile lets Docker know that
    a certain directory contains permanent data. Docker will create a volume for that
    data and never delete it, even if you remove all the containers that use it. It
    also bypasses the union filesystem so that the volume is in fact an actual directory
    that gets mounted, either read/write or read-only, in the right place in all the
    containers that share it (if they are started with `--volumes-from` option, for
    example). To understand VOLUME, let''s look at the simple Dockerfile:


    ```

    FROM ubuntu

    VOLUME /var/myVolume

    ```


    If you now run your container and save some files in `/var/myVolume`, they will
    be available to other containers for sharing.


    Basically, the VOLUME and `-v` options are almost equal. A difference between
    the VOLUME and `-v` options is that you can use the `-v` option dynamically and
    mount your host directory on your container when starting it by executing `docker
    run`. The reason for this is that Dockerfiles are meant to be portable and shared.
    The host directory volume is something that is 100% host dependent and will break
    on any other machine, which is a little bit off the Docker idea. Because of this,
    it is only possible to use portable instructions within a Dockerfile.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '![](img/0c87321919fa245e22f056c67ec70003_158_0.png)


    The fundamental difference between VOLUME and -v is this: -v will mount the existing
    files from your operating system inside your Docker container and VOLUME will
    create a new, empty volume on your host and mount it inside your container.


    # WORKDIR


    The WORKDIR instruction adds a working directory for any CMD, RUN, ENTRYPOINT,
    COPY, or ADD instruction that follow in the Dockerfile. The syntax for the instruction
    is WORKDIR /PATH. You can have multiple WORKDIR instructions in one Dockerfile,
    if the relative path is provided, it will be relative to the path of the previous
    WORKDIR instruction.


    # ARG


    If you need to pass an argument at build time to the Docker during the docker
    build command, you can use the ARG instruction in the Dockerfile. An ARG variable
    definition comes into effect from the line on which it is defined in the Dockerfile.
    Later on, during the build, any value can be passed to the docker build command
    using the --build-arg switch:


    ```

    --build-arg <variable name>=<value>

    ```


    The value from the --build-arg switch will be passed to the daemon building the
    image. If you specify the build time argument that is not defined using the ARG
    instruction, the build will fail with an error. You can specify multiple arguments
    using multiple ARG instructions, for example:


    ```

    FROM ubuntu

    ARG user

    ARG version

    ```


    Also, the default value can be specified for an argument in a Dockerfile–if none
    will be specified during the build time, the default value will be used:


    ```

    FROM ubuntu

    ARG user=jarek

    ```'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'Parameters can be passed to the builder by calling:


    ```

    docker build --build-arg user=somebodyElse .

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_159_0.png)


    It is not recommended to use ARG for passing secrets such as GitHub keys, user
    credentials, passwords, and so on, because it will be visible to any user of the
    image by using the docker history command.


    # ONBUILD


    The ONBUILD instruction specifies additional instructions, which will be triggered
    when some other image is built by using this image as its base image. In other
    words, the ONBUILD instruction is an instruction the parent Dockerfile gives to
    the child Dockerfile (downstream build). Any build instruction can be registered
    as a trigger and those instructions will be triggered immediately after the FROM
    instruction in the Dockerfile.


    The syntax of the ONBUILD instruction is as follows:


    ```

    ONBUILD <INSTRUCTION>

    ```


    Within this, <INSTRUCTION> is another Dockerfile build instruction, which will
    be triggered later when the child image is going to be built. There are some limitations:
    the ONBUILD instruction does not allow the chaining of another ONBUILD instruction
    and it does not allow the FROM and MAINTAINER instructions as ONBUILD triggers.


    This is useful if you are building an image that will be used as a base to build
    other images, for example, an application build environment or a daemon, which
    may be customized with user-specific configuration. The ONBUILD instruction is
    very useful for automating the build of your chosen software stack. Consider the
    following example with Maven and building Java applications. (yes, Maven is also
    available as a Docker container). Basically, all your project''s Dockerfile needs
    to do is reference the base container containing the ONBUILD instructions:


    ```

    FROM maven:3.3-jdk-8-onbuild

    CMD ["java","-jar","/usr/src/app/target/app-1.0-SNAPSHOT-jar-with-dependencies.jar"]

    ```'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'There''s no magic, and everything becomes clear if you look into the parent''s
    Dockerfile; in our case, it will be the docker-maven Dockerfile available on GitHub:


    ```

    FROM maven:3-jdk-8 RUN mkdir -p /usr/src/app WORKDIR /usr/src/app

    ONBUILD ADD . /usr/src/app ONBUILD RUN mvn install

    ```


    There''s a base image that has both Java and Maven installed and a series of instructions
    to copy files and run Maven.


    The ONBUILD instruction adds to the image a trigger instruction to be executed
    at a later time—when the image is used as the base for another build. The trigger
    will be executed in the context of the child build, as if it had been inserted
    immediately after the FROM instruction in the child Dockerfile.


    When Docker encounters an ONBUILD instruction during the build process, the builder
    adds kind of a trigger to the metadata of the image being built. But this is the
    only way this image is being affected. At the end of the build, a list of all
    triggers is stored in the image manifest, under the key OnBuild. You can see them
    using the docker inspect command, which we already know.


    Later, the image may be used as a base for a new build, using the FROM instruction.
    As part of processing the FROM instruction, the Docker builder looks for ONBUILD
    triggers, and executes them in the same order they were registered. If any of
    the triggers fail, the FROM instruction is aborted which will make the build fail.
    If all triggers succeed, the FROM instruction completes and the build resumes.


    ![](img/0c87321919fa245e22f056c67ec70003_160_0.png)


    The ONBUILD triggers are removed from the final image after being executed. They
    will be inherited any further.


    # STOPSIGNAL


    To specify what system call signal should be sent to the container to exit, use
    the STOPSIGNAL instruction. This signal can be a valid unsigned number that matches
    a position in the kernel''s syscall table, for instance, 9, or a signal name in
    the format SIGNAME, for instance, SIGKILL.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# HEALTHCHECK


    This is a rather new feature, introduced in Docker 1.12. You can use the HEALTHCHECK
    instruction to tell Docker, how to test a container to check that it is still
    working. This can be checking if the database responds to remote calls or if a
    web application still listens on a specified port.


    If you specify the HEALTHCHECK instruction, the running container will heave additional
    status in addition to its normal status. We have been talking about container
    statuses in Chapter 3, Understanding Containers and Images. As you remember, a
    container can have several statuses that can be listed using the docker ps command.
    These can be created, restarting, removing, running, paused, or exited. But sometimes
    this is not enough–the container may be still “alive” from the Docker point of
    view, but the application can hang or fail in some other way–an additional checking
    for the application status can be useful and the HEALTCHECK instruction comes
    in handy.


    The HEALTHCHECK status is initially starting. Whenever a health check passes,
    it becomes healthy (whatever state it was previously in). After a certain number
    of consecutive failures, it becomes unhealthy.


    The syntax for a HEALTHCHECK instruction is as follows:


    ```

    HEALTHCHECK --interval=<interval> --timeout=<timeout> CMD

    <command>

    ```


    The <interval> (the default value is 30 seconds) and <timeout> (again, the default
    is 30 seconds) are time values, specifically checking interval and timeout accordingly.
    The <command> is the command actually being used to check if the application is
    still running. The exit code of the <command> is being used by Docker to determine
    if a health check failed or succeeded. The values can be 0, which means that the
    container is healthy and ready for use and 1, which means that something is wrong
    and the container is not working correctly.


    Consider the following example:


    ```

    HEALTHCHECK --interval=5m --timeout=2s --retries=3 CMD curl -f

    http://localhost/ || exit 1

    ```'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'In the preceding example, the `curl -f http://localhost` command will be executed
    every five minutes, for the maximum timeout of 2 seconds. If a single run of the
    check takes longer than 2 seconds, then the check is considered to have failed.
    If three consecutive retries fail, the container will get the `unhealthy` status.


    ![](img/0c87321919fa245e22f056c67ec70003_162_0.png)


    There can only be one HEALTHCHECK instruction in a Dockerfile. If you list more
    than one, then only the last HEALTHCHECK will take effect.


    The HEALTHCHECK instruction gives you the possibility to fine tune container monitoring
    and thus be sure that your container is working fine. It''s better than just `running`
    `exited` or `dead` standard Docker status.


    # SHELL


    As we have seen before, some instructions such as RUN and CMD can use the shell
    form of execution. The default shell on Linux is ["/bin/sh", "-c"], and on Windows
    is ["cmd", "/S", "/C"]. If you need to, you can use the SHELL instruction to override
    the default shell used for the shell form of commands. It can be zsh, csh, or
    tcsh for Linux or PowerShell for Windows, for example. The syntax for the instruction
    is:


    ```

    SHELL ["executable", "parameters"]

    ```


    Note that SHELL can take only the JSON array as a parameter. The SHELL instruction
    could also be used to modify the way in which a shell works. For example, using
    SHELL cmd /S /C /V:ON on Windows, the behavior of the default cmd shell (it will
    be delayed environment variable expansion in this case) can be modified.


    The SHELL instruction can appear multiple times. Each SHELL instruction overrides
    all the previous declarations, but be aware that every SHELL line in your Dockerfile
    will result in a new layer in the resulting image.


    Now we have addressed all of the Dockerfile instructions and roles in creating
    the image. Let''s focus on the process of building an image now.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Using Dockerfiles


    Now that we understand what every other Dockerfile instruction does, we can prepare
    our first Dockerfile. As mentioned earlier, it''s just a plain text file. Once
    you''ve created a Dockerfile and added all your instructions, you can use it to
    build an image using the docker build command. The format for this command is:


    ```

    docker build [OPTIONS] <PATH or URL> | -

    ```


    The docker build command takes some arguments and options, you can display them
    with a short description using the -help switch, as with any other Docker command:


    ```

    docker build -help

    ```


    There are options to tweak the build process by specifying the CPU and memory
    setup or turning off the cache, for example. You can also tag the new repository
    after the build, using the -t option, for example:


    ```

    docker build -t jarek/myapp .

    ```


    To tag the image into multiple repositories at once, you can also add multiple
    -t parameters:


    ```

    docker build -t jarek/myapp:1.0.0 -t jarek/myapp:latest .

    ```


    The default set of parameters related to CPU and memory tweaking should be a good
    enough starting point, so you can omit them at the beginning.


    The docker build command builds an image from a Dockerfile and a context. The
    build''s context is the files at a specified location under the PATH or URL. The
    PATH is a directory on your local filesystem, while the URL is a the location
    of a Git repository. It works recursively, so a PATH includes any subdirectories
    and the URL includes the repository and its submodules. If you run the build command
    from the directory where your actual Dockerfile is, use just a dot as the PATH
    parameter. The simplest form of docker build, with the current directory as a
    build context will then be:


    ```

    docker build

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'The build is being run by the Docker daemon. The first that will happen is
    that the entire context will be sent as a single bundle to the daemon. That''s
    why you should be careful when specifying the build context. You can observe the
    size of the context being pushed to the daemon just after you have started the
    build:


    ![](img/0c87321919fa245e22f056c67ec70003_164_0.png)


    ![](img/0c87321919fa245e22f056c67ec70003_164_1.png)


    It''s good practice to start with a directory containing only your Dockerfile
    as context and add only the files that are needed for building the Dockerfile.


    Anyway, you can have your Dockerfile anywhere in the system. To build an image
    using the file outside of the current directory, you can use the -f switch for
    the docker build command, for example:


    ```

    docker build -f /usr/Jarek/myDockerfiles/Dockerfile .

    ```


    In the preceding example, Docker will use a Dockerfile from the specified path,
    but the build context will be the current directory, as specified by a dot.


    As we have mentioned earlier in this chapter, instructions from Dockerfile, such
    as COPY, for example, will look for the file in the context of the build if the
    source path is specified without a trailing space. In real life, the docker build
    context will contain many other working files and directories, which should never
    be included in the image, like temporary files, logs, and so on. Nevertheless,
    the Docker build system would still send those files to the daemon.'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'To increase the build''s performance and make the image as clean as possible,
    you can exclude files and directories by adding a `.dockerignore` file to the
    context directory. It''s similar to the `.gitignore` file—all paths contained
    in the `.dockerignore` file will be simply ignored. You can use standard wildcards
    when specifying paths to ignore. Consider the following example of the `.dockerignore`
    file:


    ```

    */tmp*

    */*/tmp*

    **/*.log

    tmp?

    ```


    In the preceding example, file and directory names start with `tmp` in any immediate
    subdirectory of the root. Also files and directories starting with `tmpf` from
    any subdirectory that is two levels below the root and files and directories in
    the root directory whose names are a one-character extension of `tmp`, such as
    `tmp1` or `tmp2` will also be ignored. The special mapping in the form of `**/*`
    can also be used—it matches any number of directories (including zero). For example,
    `**/*.log` will exclude all the log files found in all the directories. You can
    exclude some files from being matched to ignored. Consider the following example:


    ```

    *.log

    !important.log

    ```


    The preceding example will match all log files, except the `important.log` file.
    When doing exclusions, be advised that the order of lines in the `.dockerignore`
    file is important. If you exclude a file and then declare similar matching below
    that exclusion, it will not be excluded.


    Using `.dockerignore` can result in a much more cleaner image. There''s another
    way of customizing the build process. As we have mentioned before, environment
    variables that are declared with the `ENV` instruction can be used in Dockerfile
    instructions, such as `ADD`, `COPY`, `ENV`, `EXPOSE`, `LABEL`, `USER`, `WORKDIR`,
    `VOLUME`, `STOPSIGNAL`, or `ONBUILD`.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'The build command, if parsed and processed successfully, results in a new image
    that you can start using `docker run`, just like any other image, taken, for example,
    from Docker Hub. The output after executing the `docker build` command will be
    the ID of the new Docker image. It will also be present if you list your images
    using the command you already know: `docker images`, as shown in the following
    screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_166_0.png)


    # Summary


    Docker provides a small but very flexible set of instructions for creating images
    using Dockerfiles. We have illustrated all the commands, their syntax, and their
    usage techniques in order to effectively create Docker images. Instructions have
    a rather simple syntax and are very well documented in the official Docker documentation.
    Creating your own images will not be very tricky. However, you will need to stick
    some best practices and guidelines, recommended by Docker. First of all, you should
    keep in mind that the containers created by your images should be ephemeral, that
    is, they should be able to be stopped, destroyed, and recreated with absolute
    minimum configuration. The images should be clean as far as possible, so starting
    from an empty build context, adding only what is necessary and using a .dockerignore
    is a way to go. Also, the YAGNI (You ain''t gonna need it) principle, known from
    clean-code development practices has a very important meaning when it comes to
    creating Dockerfiles.'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'Keep it at absolute minimum, don''t install something because it''s nice to
    have it in a container. Always keep in mind the cache mechanism Docker uses and
    try to minimize the number of layers, by combining similar command into one instruction.
    Bare minimum, working as fast as it can and weighting as less as possible should
    be the goal. Also, if it''s possible, consider running only one process per container–it
    will scale easier and allow for container reuse. If one service depends on another
    service, they should run in different, but linked containers.


    Working with Dockerfile needs some practice and experimenting, but will pay later–when
    you will be able to create and adjust your images quickly. In the next chapter,
    we will focus more on running the images.'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 7


    # Running Containers


    In previous chapters, we have learned about the Docker architecture, networking,
    persistent storage, and the structure of Dockerfile. At this point, you should
    be able to create your own Docker image and start using it. Actually, we did run
    the containers several times, but without going into details; we are going to
    do that in this chapter. In this chapter, we are going to focus more on running
    the containerized software. This will include the following concepts:


    +   - Container running modes

    +   - Overriding the `CMD` and `ENTRYPOINT`

    +   - Monitoring containers

    +   - Exit codes and restart policies

    +   - Runtime constraints on resources

    +   - Docker Swarm mode


    You will learn how to set up your containers to behave well when running by specifying
    the restart policy and runtime constraints. In `Chapter 6, Creating Images`, we
    already discussed the `CMD` and `ENTRYPOINT` commands of Dockerfile. In this chapter,
    we will focus on how to override them during the container startup, this time
    in detail. We will learn how to read containers logs and output them not only
    to the text file, but to some specialized log tools, such as Splunk or Fluentd,
    for further analysis or processing. At the end of the chapter, we will learn about
    the new Docker feature – the Swarm mode, which allows you to manage the cluster
    of your Docker containers.'
  merge: -1
  img_proc: true
- pgno: 169
  md: 'Let''s recall what we have learned so far about Docker. Docker runs processes
    in isolated containers. A container is a process that runs on a host; however,
    the host might be local or remote. When you execute the docker run command, the
    container process that runs is isolated and has its very own filesystem, networking
    stack, and isolated process tree separate from the host. You run the image using
    the docker run command. Keep in mind that every docker run creates a new container
    with the specified image and starts a command inside it (CMD or ENTRYPOINT specified
    in the Dockerfile). By default, the file system of a container is persistent,
    even after the container shut down. These file systems can grow in size very quickly
    if you run short-term foreground processes again and again. The solution is that
    instead of cleaning it manually by hand, tell Docker to automatically clean up
    the container and remove the file system when the container exits. You can do
    this by adding the --rm flag, so that the container data is removed automatically
    after the process is finished.


    ![](img/0c87321919fa245e22f056c67ec70003_169_0.png)


    The --rm flag will make Docker remove the container after it has been shut down.


    For example, use the run command, as shown in the following example:


    ```

    docker run --rm -it Ubuntu /bin/bash

    ```


    The preceding command tells Docker to remove the container if it''s shut down.


    Docker is very flexible, so it''s no wonder that there are a lot of parameters
    for the docker run command. They are important and we will cover them in detail
    in the upcoming sections.


    Let''s recall the basic docker run syntax:


    ```

    docker run [OPTIONS] IMAGE[:TAG|@DIGEST] [COMMAND] [ARG...]

    ```


    The docker run command takes an image you would like to run; with it comes a lot
    of possible options that you might find useful, such as the runtime mode, either
    detached or foreground, and network settings or runtime restrictions on processor
    and memory. Of course, you can execute the run command without almost any arguments
    but the image name. It will run and take the default options coming from an image.
    Docker gives you the possibility to override the options specified by the author
    of the image.'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'When starting a Docker container, you can decide whether you want to run the
    container in the default mode, in the foreground, or in the background in the
    so-called **detached** mode.

    Let''s explain what the difference is.


    # Runtime modes – detached and foreground


    When running a container, you have a choice to run it in the foreground or detached
    mode.

    Let''s start with the detached mode.


    # Detached


    You can start a Docker container in a detached mode with adoption. The container
    starts up and runs in the background. After the container startup, you can use
    the console for executing other commands. Dockerfile can launch only one process
    at a time. Take note of the fact that the containers started in detached mode
    exit when the root process used to run the container exits. Understanding this
    is important even if you have some process running in the background (started
    from the instruction in the Dockerfile). Docker will stop the container if the
    command that started the container finishes. In other words, Docker requires your
    command to keep running in the foreground; otherwise, it thinks that your application
    stops and shuts down the container. For example, if the default command in your
    container is `bash`, when you run the image in background using the `-d` command
    line option, the shell will exit immediately and Docker will stop the container.


    ![](img/0c87321919fa245e22f056c67ec70003_170_0.png)


    Your container immediately stops, unless the commands are not running in the foreground.


    But there is a solution for this. You can cheat Docker by executing a foreground
    command forever. The trick to make your container run continuously is to keep
    your main process running. Consider the following example:


    ```

    docker run -d myImage tail -f /dev/null

    ```


    Executing the `tail` command on `/dev/null` will keep the main bash shell busy
    and will not allow Docker to shut the container down.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'In detached mode, you can display the standard output of your Docker container
    using the `docker logs` command. You can access the log files because everything
    that is written to `stdout` for the process that is `pid 1` inside the container
    will get captured in a special history file on the Docker host. To view the log
    entries, execute the following command:


    ```

    docker logs -f <container name>

    ```


    We are going to cover Docker logging in a short while. To retain control over
    a detached container, use the `docker attach` command. The syntax for `docker
    attach` is:


    ```

    docker attach [OPTIONS] <container ID or name>

    ```


    The `docker attach` command can come in handy if you want to see what is written
    to the `stdout` stream in real time. It will basically reattach your console to
    the process running in the container. In other words, it will stream the `stdout`
    into your screen and map the `stdin` to your keyboard, thus allowing you to enter
    the commands and see their output. To detach from the process, use the default
    Ctrl + P, Ctrl + Q keyboard sequence.


    # Foreground


    The foreground mode is the default one. It''s the opposite of the detached mode
    and it''s used when you simply do not specify the `-d` option. In the foreground
    mode, the console you are using to execute `docker run` will be attached to the
    standard input, output, and error streams. Actually, by default, Docker will attach
    all the standard streams to your console; these will be `STDIN`, `STDOUT`, and
    `STDERR`. You can change this default behavior and use the `-a` switch for the
    `docker run` command. As a parameter for the `-a` switch, you use the name of
    the stream you want to attach to the console. For example:


    ```

    docker run -a stdin -a stdout -i -t centos /bin/bash

    ```


    The preceding command will attach both `stdin` and `stdout` streams to your console.


    There are `-i` or `--interactive` (for keeping the STDIN stream open even if not
    attached) and `-t` or `--tty` (for attaching a pseudo-tty) switches, commonly
    used together as `-it`, which you will need to allocate a pseudo-tty console for
    the process running in the container. It is used to attach the command line to
    the container after it has started. As you may remember from the previous chapters,
    we already did this, when we were running the interactive Ubuntu bash shell:


    ```

    docker run -it ubuntu

    ```'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'When you run your container and want to interact with it later, updating the
    restrictions for example, you must tell Docker the image that you want to execute
    the command for. Images can be identified in the Docker world in a couple of ways.
    Until now, we have been executing images using long or short UUID identifiers.
    Let''s see some options here.


    # Identifying images and containers


    As you remember from the previous chapters, images that you want to run can be
    identified simply by there name, such as Ubuntu. In this case, Docker will pick
    the image tagged by latest by default. You can also use the tag syntax or the
    digest syntax:


    ```

    Image[:tag]

    Image[@digest]

    ```


    For example, if you want to run Ubuntu tagged as version 14.04, you simply execute
    the command:


    ```

    docker run ubuntu:14.04

    ```


    The image can contain an identifier called a digest. The digest is calculated
    as the sha256 checksum of the image manifest, excluding the signature portion.
    The manifest comprises of the image''s name, its tag (latest), architecture, fsLayers
    (a list of the image''s layers, referenced by their digests), history, schema
    version, and signatures. You can list the digest by specifying the –digests option
    to the docker images command. A digest can be used with the docker create, docker
    pull, and dockerrmi commands and with the FROM instruction in a Dockerfile. Also,
    it can be used in the docker run command, to precisely run the specified image.
    The digest value is predictable and referenceable and allows of picking the image
    very precisely.


    The following example will run the Ubuntu image that was selected using a digest:


    ```

    docker -it run

    ubuntu@sha256:1ffcb21397aa4012a9d88cff8582224ff06aa13ba2de2e9f96c9814bfda95e0
    /bin/bash

    ```'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'The containers can be identified in three ways using there name or short or
    UUID identifier. The identifiers are generated by the Docker daemon. Probably,
    the most convenient option is to identify a container by its name. It''s always
    easier to remember a friendly name than a long alphanumeric identifier. Defining
    a name will add meaning to a container, so you will know at the first glance what
    the container is responsible for. Let''s say the name will be `myWildfly` – you
    will know that the container is your application server. Having `abbb3434aa43`
    as a container identifier doesn''t make things clear. To provide a name for the
    `docker run` command, use the `--name` switch. If you don''t provide a name for
    a container with the `--name` option, then Docker will create a name for you.
    I recommend that you always create meaningful names for your containers, since
    it will be a lot easier to remember them. If you specify a name, you can use it
    when referencing the container within a Docker network. This works for both the
    background and foreground Docker containers.


    ![](img/0c87321919fa245e22f056c67ec70003_173_0.png)


    When containers run on default bridge network, they must be linked to communicate
    by name.


    Docker makes use of the PID namespace, thus giving you options to monitor the
    processes being run within the containers and also limit their number.


    # PID settings


    To set the PID namespace mode, you have three options for setting the PID namespace
    mode for the container:


    +   - `--pid=""`: This will set the PID (Process) namespace mode for the container

    +   - `--pid=container`: This `<name | id>` joins another container''s PID namespace

    +   - `--pid=host`: This will use the host''s PID namespace inside the container


    The PID namespace is enabled for all containers by default. The PID namespace
    is useful for the separation of processes. By default, the container PIDs are
    isolated from the host but you can change this behavior by running your container
    with the `--pid host` option, the container PID will be visible from the host.
    Also, your container will share the host''s process namespace. This means that
    the processes within the container will see all of the processes on the host.
    You can join the container you are starting with another container''s PID namespace
    using `--pid=container:id`. This may be useful for debugging that container from
    another; for example, you can also easily limit the number of active processes
    running inside a container to prevent fork bombs.'
  merge: -1
  img_proc: true
- pgno: 174
  md: 'A fork bomb (also known as rabbit virus or wabbit) is a denial-of-service attack,
    wherein a process continually replicates itself to deplete the available system
    resources, slowing down or crashing the system due to resource usage. To limit
    the number of active processes within the container, execute the docker run command
    with --pids-limit value set:


    ```

    docker run --pids-limit=64

    ```


    Getting the current PID of the container is easy using the docker inspect command:


    ```

    docker inspect --format ''{{.State.Pid}}'' <containerID or name>

    ```


    On the other hand, getting the container name by PID is more tricky, but doable.
    To do this, you will need to use some grepping, as shown in the following example:


    ```

    dockerps -q | xargs docker inspect --format ''{{.State.Pid}}, {{.ID}}'' |

    grep "^${PID},"

    ```


    Similar to how some programs write their process ID to a file (you''ve seen them
    as PID files), Docker can write the container ID to a file you choose. To write
    the process ID to a file, use the --cidfile switch:


    ```

    --cidfile=""

    ```


    Apart from the PID namespace, you can also set the UTS namespace for your containers.


    # UTS settings


    As you remember Docker tries to isolate the container from the host system. The
    UTS namespace is for setting the hostname and the domain, which is visible, to
    run processes in that namespace. UTS is the abbreviation for UNIX Timesharing
    System. By default, all containers have the UTS namespace enabled. It means the
    process has a separate copy of the hostname and the (now mostly unused) NIS domain
    name, so it can set it to something else without affecting the rest of the system.


    The hostname is set via sethostname and is the nodename member of the struct returned
    by uname. The NIS domain name is set by setdomainname and is the domainname member
    of the struct returned by uname.


    The syntax of setting the UTS namespace in Docker is very similar to the --pid
    syntax, you will just use --uts instead of --pid. To set the UTS namespace for
    the container, use the --uts="value" switch. You can also use the --uts=host to
    bind the host''s UTS namespace within your container.'
  merge: -1
  img_proc: true
- pgno: 175
  md: 'Now we know how to identify containers, we want to run and set up their namespaces.
    Let''s learn how to override the default commands provided in the Dockerfile of
    the image. We have been doing this in previous chapters, but without going much
    into details. Let''s do it again now.


    # Overriding default commands from Dockerfile


    As you can recall from Chapter 6, Creating Images, when we create a Docker image,
    we provide the default command or options either using the CMD instruction or
    default command to execute at runtime using the ENTRYPOINT instruction. But without
    the possibility to influence the container startup process by providing different
    commands or parameters, other than the image author provided, it wouldn''t be
    possible to use Docker in many cases. Images would be rather static and sometimes
    just useless. Luckily, Docker supports overriding those defaults and this feature
    makes it very flexible tool. As you remember from the previous chapter, there''s
    an important difference between ENTRYPOINT and CMD instructions: the ENTRYPOINT
    defines the process that runs as PID 1 in the container and the CMD provides options
    for it. If the ENTRYPOINT has not been specified in the Dockerfile, but CMD was,
    then the shell /bin/sh -c will be the image''s entry point. The CMD instruction,
    the same as ENTRYPOINT, can be specified on the command line when the docker run
    command is executed, which makes it powerful tool for modifying container''s behavior.
    So, in this section we are interested in overriding the startup commands and their
    parameters; let''s begin with the CMD.


    # Overriding the CMD


    As you remember from the beginning of the current chapter, the syntax for the
    docker run command includes the COMMAND parameter:


    ```

    docker run [OPTIONS] IMAGE[:TAG|@DIGEST] [COMMAND] [ARG...]

    ```


    The COMMAND parameter is not required because the author of the image may have
    already provided a default COMMAND using the CMD instruction in the image''s Dockerfile.
    This is usually very often the case.'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'The CMD instruction should be used in a Dockerfile only once to run the software
    contained in the image. It''s usually the last command in a Dockerfile, but when
    starting the container from such an image, we can override the CMD instruction
    simply by providing our own command or parameters as the COMMAND parameter for
    the docker run. Anything that appears after the image name in the docker run command
    is passed to the container and treated as CMD arguments. As a result, if the image
    also specifies an ENTRYPOINT then the CMD or COMMAND gets appended as arguments
    to the ENTRYPOINT. But guess what, we can override the ENTRYPOINT as well.


    # Overriding the ENTRYPOINT


    Every Docker image has an entry point. It can be the default one or the one specified
    by the ENTRYPOINT instruction, it''s a default command to be executed at runtime;
    it specifies what executable to run when the container starts, but it is more
    difficult to override. The ENTRYPOINT makes a running container more like a complete
    command to execute, which takes parameters from the COMMAND value. But sometimes
    when running the container, you will want to run something else, so you can override
    the default ENTRYPOINT at runtime using a string to specify the new ENTRYPOINT.
    The syntax for overriding an entry point is as follows:


    ```

    docker run -it --entrypoint /bin/bash Ubuntu

    ```


    Let''s take at look of the MongoDB Dockerfile, which has the ENTRYPOINT defined:


    ```

    FROM dockerfile/ubuntu

    RUN mkdir -p /data/db /data/configdb \

    &&chown -R mongodb:mongodb /data/db /data/configdb

    VOLUME /data/db /data/configdb

    COPY docker-entrypoint.sh /entrypoint.sh

    ENTRYPOINT ["/entrypoint.sh"]

    EXPOSE 27017

    CMD ["mongod"]

    ```


    As you can see, there is a custom entry point defined; it will be an entrypoint.sh
    shell script. If you run this container now, the main process of the container
    will come from this script. We can override this entry point using the command:


    ```

    docker run -it --entrypoint /bin/bash mongo

    ```'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'After executing the previous command, the ENTRYPOINT from the Dockerfile will
    be overridden by the one you have provided during the docker run command. Of course,
    MongoDB will not start the property in this case (you will see the bash prompt
    instead), but this can give you an idea of how you can influence the default container
    behavior, sometimes executing something completely different from what the image
    author intended.


    Apart from overriding the CMD or ENTRYPOINT from the Dockerfile during the startup
    of the container, there''s another way of executing a command worth mentioning.
    It will be the dockerexec command.


    # Executing arbitrary commands with exec


    It''s maybe the most powerful all-around tool when working with Docker images.
    The exec command allows you to run arbitrary commands inside a running container.


    In opposite of the overriding the CMD or ENTRYPOINT, the command started using
    docker exec will only run while the container''s primary process (PID 1) is running.


    ![](img/0c87321919fa245e22f056c67ec70003_177_0.png)


    If the container is paused, then the docker exec command will fail with an error.


    Also, the syntax of the exec command is different. It''s not a part of the Docker
    run command, it''s rather a new separate command, executed after you run your
    container with the docker run. Consider the following example and run the following
    in one shell terminal:


    ```

    docker run -it ubuntu bash --name myUbuntuBash

    ```


    Then run the next command in the second shell terminal window:


    ```

    dockerexec -d myUbuntuBash touch /tmp/myFile

    ```


    In the preceding example, the first command fill starts the interactive bash shell
    from the Ubuntu container, ok that is nothing new; however, the second command,
    docker exec will actually execute a touch shell command within the running container.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'The `docker exec` can be a little confusing with the `docker attach` command
    we have already mentioned when learning about the detached containers. It''s worth
    noting, that the `docker attach` isn''t for running an extra thing in a container,
    it''s useful for attaching to the running process. Also, if the main process is
    a shell, then we can run a new process using attach. The `docker exec`, on the
    other hand, is specifically designed for running new things in a container that
    is already started. Of course, it can also be a shell or some other process, as
    can be seen in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_178_0.png)


    We now know how to run containers, either in foreground or in background; we know
    how to override default startup process or how to execute our custom commands
    in the running containers. It''s now time to take a look at the running containers
    and monitor how well they behave; or how bad, for that matter.


    # Monitoring containers


    There are a few ways of monitoring the running Docker containers. They includes
    viewing the log files, looking at the container events and statistics, and also
    inspecting container properties. Let''s begin with the logging. Docker has powerful
    logging features. An access to the log entries is crucial, especially if you have
    your container running in the detached runtime mode. Let''s see what Docker can
    offer when it comes to a logging mechanism.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# Viewing logs


    Most applications output their log entries to the standard stdout stream (normally
    you just see in in the console when you run the application). However, when running
    from Docker in detached mode, we see nothing on the console because the container
    runs in the background. To view the log entries from the container, execute the
    following command:


    ```

    docker logs -f <container name>

    ```


    The -f flag acts as the same flag in Linux tail command; it will continuously
    display new log entries on the console. When you are done, hit ctrl-c to stop
    displaying log files on the console.


    The log file is available even after the container stops, as long as its file
    system is still present on disk (until of course it is removed with the docker
    rm command). The data is stored in a JSON file located in the /var/lib/docker
    directory. You can see the complete path of the log file using the docker inspect
    command and using a template to extract the LogPath (we will cover inspect and
    templates in a while):


    ```

    docker inspect -f {{.LogPath}} 351c05e5ca22

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_179_0.png)


    Docker utilizes the concept of logging drivers, to store containers log entries.
    The default driver is the json-file driver, which just writes out the JSON entries
    into the file. It can take some tweaking parameters, for example:


    ```

    --log-opt max-size=[0-9+][k|m|g]

    --log-opt max-file=[0-9+]

    ```'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'The `max-size` specifies the maximum file size that can be created. Docker
    will create a new file if it reaches the specified size. You can use the size
    suffixes k, m, or g, where k will be for kilobytes, m for megabytes and g for
    gigabytes. If you do not provide the `max-size`, Docker will write all the log
    output into a single file, which is not very handy, if you need to download, upload,
    or search through the log file for example. The `max-file` option specifies the
    maximum number of files that a log is rolled over before being discarded. Note
    that if `max-size` is not set, the `max-file` option will be ignored.


    ![](img/0c87321919fa245e22f056c67ec70003_180_0.png)


    The `docker log` command only displays log entries from the newest log file.


    However, the `json-file` driver is not the only log driver implementation available.
    Actually, there are a couple of implementations to choose from:


    +   - `none`: It will switch off logging completely

    +   - `syslog`: It''s a `syslog` logging driver for Docker and writes log messages
    to the system `syslog`.

    +   - `journald`: It will log messages to `journald`. `systemd-journald` is a
    daemon responsible for event logging with append-only binary files serving as
    its log files.


    Apart from the preceding, there are a couple of more specialized drivers you can
    choose from:


    +   - `splunk`: This provides writing log messages to Splunk using **Event Http
    Collector**. Splunk can be used as an `enterprise-grade` log analyzer. You can
    read more about it at https://www.splunk.com.

    +   - `gelf`: This will write log entries into a GELF endpoint similar to Graylog
    or Logstash. Graylog, available at https://www.graylog.org, is an open source
    log management, supporting search, analysis, and alerting across all of your log
    files. Logstash, which you can find at https://www.elastic.co/products/logstash,
    is a pipeline for processing any day source.

    +   - `fluentd`: This writes log messages to fluentd. Fluentd is an open source
    data collector for unified logging layer. The main feature of Fluentd is that
    it separates data sources from backend systems by providing a unified logging
    layer in between. It''s small, fast, and has hundreds of plugins that make it
    a very flexible solution out of it. You can read more about fluentd on its website
    https://www.fluentd.org.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '+   - `gcplogs` (including log data) from any source. `fluentd`: This writes
    log messages to fluentd. Fluentd is an open source data collector for unified
    logging layer. The main feature of Fluentd is that it separates data sources from
    backend systems by providing a unified logging layer in between. It''s small,
    fast, and has hundreds of plugins that make a very flexible solution out of it.
    You can read more about fluentd on its website https://www.fluentd.org. `gcplogs`:
    This will send the log entries to Google Cloud Logging

    +   - `awslogs`: This driver will write log messages to the Amazon CloudWatch
    Logs.


    As you can see, again the Docker''s pluggable architecture gives you almost infinite
    flexibility when running the container. To switch to the other log driver, use
    the `--log-driver` switch for the `docker run` command, for example:


    ```

    docker run --log-driver=syslog ubuntu

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_181_0.png)


    The `docker logs` command is available only for the `json-file` and `journal`
    logging drivers. To access logs written to other log engines, you will need to
    use the tools provided by the vendor of the log solution, such as Splunk.


    Apart from using the `docker log` command, another way of seeing the console output
    is using the attach command that we learned about earlier in this chapter; attach
    it to the running container, to see its console output.


    # Container events


    To get the real-time events from the server, we use the `docker events` command.
    When something has changed during the container runtime, such as `stop`, `pause`
    or `kill`, container will store and publish an event for that case. This can be
    very useful if you would like to know what has happened during the container runtime;
    it''s a powerful monitoring feature. Docker containers report a huge list of events,
    which you can list with the `docker events` command:


    ```

    attach, commit, copy, create, destroy, detach, die, exec_create,

    exec_detach, exec_start, export, health_status, kill, oom, pause, rename,

    resize, restart, start, stop, top, unpause, update

    ```


    The `docker events` command can take the `-f` switch, which will filter the output
    if you are looking for something specific (the filter is empty by default, so
    it will return all the events). Currently, the list of possible filters includes:


    +   - `container` (`container=<name or id>`)'
  merge: -1
  img_proc: true
- pgno: 182
  md: '+   - event (event=<event action>)

    +   - image (image=<tag or id>)

    +   - plugin (experimental) (plugin=<name or id>)

    +   - label (label=<key>orlabel=<key>=<value>)

    +   - type (type=<container or image or volume or network or daemon>)

    +   - volume (volume=<name or id>)

    +   - network (network=<name or id>)

    +   - daemon (daemon=<name or id>)


    The docker events command can take --since and -until switches, which can be used
    to specify a timeframe you want to get the events from. Docker supports common
    RFC3339 formats for date and time, for example

    2016-09-10T05:10:00, 2016-09-10T05:05:00.99999999, 2016-09-10Z07:00, and

    2016-09-10.


    By default, the docker events will stream the events to the console, similar to
    the tail -f command. As you can see in the following screenshot, t he sample output
    will contain timestamp of the event, container ID, and, of course, the occurred
    event itself:


    ![](img/0c87321919fa245e22f056c67ec70003_182_0.png)


    # Inspecting a container


    We have been using the dockerps command heavily since now. It can give you a lot
    of useful information about your running containers, such as their ID, status,
    command executed, exposed ports, and so on. There''s another command, docker inspect
    that can also give you some useful information about your containers. The syntax
    for the docker inspect command is as follows:


    ```

    docker inspect [OPTIONS] CONTAINER|IMAGE|TASK [CONTAINER|IMAGE|TASK...]

    ```'
  merge: -1
  img_proc: true
- pgno: 183
  md: 'By default, the inspect command will output the information about the container
    or image in a JSON array format. You can provide a template for processing the
    output, using the --format or -f for short as a switch for the command. The docker
    inspect command accepts templates in Go. The simplest use case for the inspect
    command is just to provide short template to extract the information you need,
    for example:


    ```

    docker inspect -f ''{{.State.ExitCode}}'' jboss/wildfly

    ```


    As the inspect command accepts the provided Go template to form the output of
    the container or image metadata, this feature gives you almost infinite possibilities
    of processing and transforming the results. The Go templating engine is powerful,
    so instead of piping the output through grep, which is quick but messy, you can
    use the template engine to further process the result.


    The argument to --format is a just a template that we want to apply to the metadata
    of container. In this template, we can use conditional statements, loops, and
    other Go language features. For example, to find the names of all containers with
    a non-zero exit code:


    ```

    docker inspect -f ''{{if ne 0.0 .State.ExitCode }}{{.Name}} {{.State.ExitCode}}{{
    end }}'' $(dockerps -aq)

    ```


    Note that we provide $(dockerps -aq) instead of container ID or name. As a result,
    all of the running containers IDs will be piped to the docker inspect command,
    which can be a very handy shortcut. The curly brackets {{ }} means that the Go
    template directives anything outside of them will be printed out literally. The
    dot (.) in Go templates means context. Most of the time, the current context will
    be the complete data structure for the metadata, but it can be rebound when needed,
    including using the with action. For example, the following two inspect commands
    will print out exactly the same result:


    ```

    docker inspect -f ''{{.State.ExitCode}}'' wildfly

    docker inspect -f ''{{with .State}} {{.ExitCode}} {{end}}'' wildfly

    ```


    If you are inside the bound context, the dollar sign ($) will always get you the
    root context. Execute the following command:


    ```

    docker inspect -f ''{{with .State}} {{$ .Name}} exited with {{.ExitCode}} exit
    code \ {{end}}'' wildfly

    ```


    This will output:


    ```

    /wildfly exited with 0 exit code.

    ```'
  merge: -1
  img_proc: true
- pgno: 184
  md: 'The template engine supports logical functions, such as and, or, and not –
    they will return a Boolean result. Also the comparison functions are supported,
    such as eq (equals), ne (not equals), lt (less than), le (less than or equal to),
    gt (greater than), ge (greater than or equal to). Comparison functions can compare
    strings, floats, or integers. All of these can be very useful together with the
    conditional functions, such as if, when creating some more sophisticated output
    from the inspect command:


    ```

    docker inspect -f ''{{if eq .State.ExitCode 0.0}} \

    Normal Exit \

    {{else if eq .State.ExitCode 1.0}} \

    Not a Normal Exit \

    {{else}} \

    Still Not a Normal Exit \

    {{end}}'' wildfly

    ```


    Sometimes the huge output of the docker inspect command can be confusing. Since
    the output comes in JSON format, the jq-tool can be used to get an overview of
    the output and pick interesting parts.


    The jq-tools is available for free at https://stedolan.github.io/jq/. It''s a
    lightweight and flexible command-line JSON processor, similar to the sed command
    for the JSON data. For example, let''s extract the container IP address from the
    metadata:


    ```

    docker inspect <containerID> | jq -r ''.[0].NetworkSettings.IPAddress''

    ```


    As you can see, the docker inspect command provides useful information about Docker
    containers. Combined with the Go template features, and optionally with the jq
    tool, it gives you the powerful tool to get the information about your containers
    and can be used further in scripting. But there''s another source of valuable
    information apart from the metadata. It''s runtime statistics, which we are going
    to focus on now.


    # Statistics


    To see the runtime statistics for running containers, use the docker stats command.
    The measured statistics include CPU, memory, and network I/O usage.


    The syntax for the docker stats command is as follows:


    ```

    docker stats [OPTIONS] [CONTAINER...]

    ```'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'The options can include `--no-stream` that will disable the streaming stats
    and only pull the first result and `--all` (or `-a` for short), which will show
    all containers, by default the command shows statistics just for running containers.


    The simplest form of the command will be just `docker stats`. It will list all
    statistics for all running containers. You can limit the returned data to one
    or more specific containers, by specifying a list of container IDs or names, separated
    with a space:


    ```

    docker stats b4fd15acfcb1 d15acb4ffcbb

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_185_0.png)


    Viewing logs, container events, and runtime statistics gives you almost infinite
    possibilities when monitoring your running containers. But how can we assure that
    the container will run continuously, let''s say on a production server? The Docker
    contains the exit codes and the restart policies come to the rescue.


    # Container exit codes and restart policies


    You can specify the so called **restart policy** using the `--restart` switch
    with the `docker run` command. Restart policy tells Docker how to behave on container
    shutdown. It can be restarted to minimize downtime, for example if running on
    production server. However, before we explain the Docker restart policy, let''s
    focus on the exit codes. The exit code is crucial information, it tells why the
    container failed to run or why it exited. Sometimes it''s related to the contained
    command you will give to `docker run` as a parameter.'
  merge: -1
  img_proc: true
- pgno: 186
  md: 'When the `dockerrun` command ends with a non-zero code, the exit codes follow
    the `chroot` standard, as you can see in the following example:


    +   - exit code 125: The `docker run` command fails by itself

    +   - exit code 126: The supplied command cannot be invoked

    +   - exit code 127: The supplied command cannot be found

    +   - Other, non-zero, application dependent exit code.


    As you can recall, in the previous chapters we have been using the `dockerps`
    command to list the running containers. To list the non-running containers as
    well, we can add the `-a` switch for the `dockerps` command. The exit code can
    be found in the output of the `dockerps-a` command in a status column when a container
    completes, as you can see in this screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_186_0.png)


    It''s possible to automatically restart crashed containers by specifying a restart
    policy when starting the container. Specifying the desired restart policy is done
    by the restart switch for the `docker run` command, as in the example:


    ```

    dockerrun --restart=always mongo

    ```


    Currently Docker has four restart policies. Let''s get to know them now one by
    one, starting with the simplest: no.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# no


    The **no** policy is the default restart policy and simply will not restart a
    container under any case. Actually you do not have to specify this policy, because
    this is the default behavior. Unless you have some configurable setup to run Docker
    containers, then the *no* policy can be used as an *off* switch.


    # always


    If we want the container to be restarted no matter what exit code the command
    would have, we can use the always restart policy. Basically, it does what it says-Docker
    will restart the container in every case. The restart policy will always restart
    the container. This is true even if the container has been stopped before the
    reboot. Whenever the Docker service is restarted, containers using the always
    policy will also be restarted, it doesn''t matter whether they were executing
    or not.


    ![](img/0c87321919fa245e22f056c67ec70003_187_0.png)


    With the restart policy, the Docker daemon will always try to restart the container
    indefinitely.


    # on-failure


    This is a special restart policy and probably the most often used one. Using the
    `on-failure` restart policy, you can instruct Docker to restart your container
    whenever it exits with a non-zero exit status and not restart otherwise. That''s
    why we have begun explaining restart policies with the exit codes. You can optionally
    provide a number of times for Docker to attempt to restart the container. The
    syntax of this restart policy is also a little bit different, because using this
    policy, you can also specify a maximum number of tries that Docker will make to
    automatically restart the container.


    Consider the following example:


    ```

    dockerrun --restart=on-failure:5 mongo

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'The preceding command will run MongoDBimage and will try to restart it five
    times in case of failure before giving up. The main benefit of a on-failures restart
    policy is that when an application exits with a successful exit code (that means
    there were no error in the application, it just finished executing) the container
    will not be restarted. The number of restart tries for a container can be obtained
    via the docker inspect command. For example, to get the number of restarts for
    container with specific ID or name:


    ```

    docker inspect -f "{{ .RestartCount }}"<ContainerID>

    ```


    You can also get the last time the container was started again:


    ```

    docker inspect -f "{{ .State.StartedAt }}"<ContainerID>

    ```


    You should know that Docker uses a delay between restarting the container, to
    prevent flood-like protection. This is an increasing delay, it starts with the
    value of 100 milliseconds, and then Docker will double the previous delay. In
    effect, the daemon will wait for 100 ms, then 200 ms, 400ms, 800ms, and so on,
    until either the on-failure limit is reached or when you stop the container using
    docker stop or execute the force removal by executing the docker rm -f command.


    ![](img/0c87321919fa245e22f056c67ec70003_188_0.png)


    If a container is successfully restarted the delay is reset to the default value
    of 100 milliseconds.


    # unless-stopped


    Again, similar to always if we want the container to be restarted regardless of
    the exit code, we can use unless-stopped. The unless-stopped restart policy acts
    the same as always with one exception, it will restart the container regardless
    of the exit status, but do not start it on daemon startup if the container has
    been put to a stopped state before. This means that with unless-stopped restart
    policy is that if the container was running before the reboot, the container would
    be restarted once the system restarts. When an application within a Docker container
    exits, that container is halted. If an application that is running within a container
    crashes, the container stops and that container will remain stopped until someone
    or something restarts it.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Before you apply the restart policy to your container, it''s good to think
    what kind of work the container will be used to do. That also depends on the kind
    of software that will be running on the container. A database for example, should
    have probably always or unless-stopped policy applied. If your container has some
    restart policy applied, it will be shown as Restarting or Up status when you list
    your container using the dockerps command.


    # Updating a restart policy on a running container


    Sometimes there''s a need to update the Docker runtime parameters after the container
    has already started, such as on-the-fly. The sample case can be if you want to
    prevent containers from consuming too many resources on the Docker host. To set
    the policy during the runtime, we can use the docker update command. Apart from
    other runtime parameters (such as memory or CPU constraints for example, about
    which we are going to tell in a while later in this chapter), the docker update
    command gives you the possibility to update the restart policy on a running container.
    The syntax is straightforward, you will just need to provide the new restart policy
    that you would like the container to have and the containers ID or name:


    ```

    docker update --restart=always <CONTAINER_ID or NAME>

    ```


    A new restart policy will take effect immediately after you run the docker update
    command on a container. On the other hand, if you execute the update command on
    the container that is stopped, the policy will be used when you start the container
    later on. The possible options are exactly the same as those you can specify when
    starting the container:


    +   - no (which is default)

    +   - always

    +   - on-failure

    +   - unless-stopped


    ![](img/0c87321919fa245e22f056c67ec70003_189_0.png)


    If you have more than one container running on the Docker host, and want to specify
    new restart policy on all of them at once, just provide all of their IDs or names
    separated with space.


    You can also see what restart policy was applied using the docker events command
    you already know from the previous section. The docker events that can be used
    to observe the history of runtime events that the container has reported, will
    also report the docker update event, providing you the details what has changed.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Running Containers


    If the container has been applied the restart policy, the event will be present
    in the history, as you can see in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_190_0.png)


    If you want to check the restart policy of a running container use docker inspect
    with the container ID or name with the --format argument set for the path of the
    value:


    ```

    docker inspect --format ''{{ .HostConfig.RestartPolicy.Name }}'' <ContainerID>

    ```


    The preceding command will simply display the currently applied restart policy,
    as seen on the screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_190_1.png)


    The ability to set a restart policy on a container by container basis is great
    for those cases where your images are self-contained and you don''t need to do
    more complex orchestration tasks. The restart policy is not the only parameter
    you can change on the running containers. To be sure that your containers behave
    well when running on the Docker host, you can put constraints on them. We are
    going to cover them now.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# Runtime constraints on resources


    It may be useful to restrict the Docker container usage on resources when running.
    Docker gives you a lot of possibilities to set constraints on the memory, CPU
    usage or disk access usage. Let''s begin with setting the memory constraints.


    # Memory


    It''s worth knowing, that by default, that is if you use the default settings
    without any constraints, the running container can use all of the host memory.
    To change this behavior we can use the --memory (or -m for short) switch for the
    docker run command. It takes a usual suffixes k,m, or g for kilobytes, megabytes
    and gigabytes respectively.


    The syntax of the docker run command with memory constraints set will be as follows:


    ```

    docker run -it -m 512m ubuntu

    ```


    The preceding command will execute the Ubuntu image with the maximum memory that
    can be used by container of half of gigabyte.


    ![](img/0c87321919fa245e22f056c67ec70003_191_0.png)


    If you do not set a limit on the memory container can allocate can lead to random
    issues where a single container can easily make the whole host system unstable
    and/or unusable. So it''s a wise decision to always use the memory constraints
    on the container.


    Apart from user memory limit, there are also memory reservation and kernel memory
    constraint. Let''s explain what memory reservation limit is. Under normal working
    conditions, a running container can, and probably will use as much of the memory
    as needed up to the limit you have set using the --memory (-m) switch for the
    docker run command. When memory reservation is applied, Docker will detect low
    memory situation and will try to force container to restrict it''s consumption
    up to a reservation limit. If you do not set the memory reservation limit, it
    will be the same as the hard memory limit set with the -m switch.


    Memory reservation is not a hard limit feature. There''s no guarantee the limit
    won''t be exceeded. The memory reservation feature will attempt to ensure that
    memory will be allocated based on the reservation setting.


    Consider the following example:


    ```

    docker run -it -m 1G --memory-reservation 500M ubuntu /bin/bash

    ```'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'The preceding command sets the hard memory limit to one gig, and then sets
    the memory reservation to half a gig. With those constraints set, when the container
    consumes memory more than 500M and less than 1G, Docker will attempt to shrink
    container memory below 500M.


    In the next example, we are going to set the memory reservation without setting
    the hard memory limit:


    ```

    docker run -it --memory-reservation 1G ubuntu /bin/bash

    ```


    In the previous example, when the container starts, it can use as much memory
    as it''s processes need. The --memory-reservation switch setting will prevent
    the container from consuming too much memory for long time, because every memory
    reclaim will shrinks the container''s memory usage to the size specified in the
    reservation.


    The kernel memory is something entirely different from the user memory–the main
    difference is that kernel memory can''t be swapped out to disk. It includes stack
    pages, slab pages, sockets memory pressure, and TCP memory pressure. You use the
    --kernel-memory switch setup kernel memory limit to constrain these kinds of memory.
    The same as in setting the user memory limit, just provide a number with a suffix
    like k, b, g for kilobyte, megabyte or gigabyte respectively-although setting
    it in kilobytes may be a really rare case.


    For example, every process eats some stack pages. By restricting kernel memory,
    you can prevent new processes from being started when the kernel memory usage
    is too high and because the host cannot swap the kernel memory to disk, the container
    can block the whole host services by consuming too much kernel memory.


    Setting the kernel memory limit is straightforward. We can set the --kernel-memory
    alone, without limiting the total memory with -m, as seen in the following example:


    ```

    docker run -it --kernel-memory 100M ubuntu /bin/bash

    ```


    In the previous example, the process in the container can take memory as it needs,
    but it can only consume 100M kernel memory. We can also set up the hard memory
    limit, as in the following command:


    ```

    docker run -it -m 1G --kernel-memory 100M ubuntu /bin/bash

    ```


    In the previous, we set memory and kernel memory altogether, so the processes
    in the container can use 1G memory in total, and this 1G will include 100M of
    the kernel memory.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'One more constraint related to the memory which can be useful when running
    containers, is the swappines constraint. We apply the constraint by using the
    `--memory-swappiness` switch to the `docker run` command. It can be helpful when
    you want to avoid performance drops related to memory swapping. The parameter
    for the `--memory-swappiness` switch is the percentage of anonymous memory pages
    that can be swapped out, so it takes values from 0 to 100. A value of 0 turns
    off anonymous page swapping completely. On the contrary, a value of 100 sets all
    anonymous pages as candidates for swapping out. For example:


    ```

    docker run -it --memory-swappiness=0 ubuntu/bin/bash

    ```


    In the previous command we turn the swapping completely for our `ubuntu` container.


    Apart from setting the memory usage constraint, you can also instruct Docker how
    the processor power should be assigned to containers it''s going to run.


    # Processors


    Using the `-c` (or `--cpu-shares` as an equivalent) for the `docker run` command
    switch it''s possible to specify a value of shares of the CPU that container can
    allocate. By default, every new container has 1024 shares of CPU and all containers
    get the same part of CPU cycles. This percentage can be altered by shifting the
    container''s CPU share weighting relative to the weighting of all other running
    containers. But take note, that you cannot set the precise processor speed that
    container can use. This is a relative weight and has nothing to do with the real
    processor speed. In fact, there is no way to say precisely that a container should
    have right to use only to 2GHz of host''s processor.


    ![](img/0c87321919fa245e22f056c67ec70003_193_0.png)


    > CPU share is just a number – it''s not related at all to the CPU speed.


    If we start two containers and both will use 100% CPU, the processor time will
    be divided equally between the two containers. The reason for that is two containers
    will have the same number of processor shares. But if you constraint one container''s
    processor shares to 512 it will receive just a half of the CPU time. This does
    not mean that it can use only half of the CPU – the proportion will only apply
    when CPU-intensive processes are running. If the other container (with 1024 shares)
    is idle – our container will be allowed to use 100% of the processor time. The
    real amount of CPU time will differ depending on the number of containers running
    on the system. It''s easier to understand on a tangible example.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'Consider three containers, one (let''s call it Container1) has --cpu-shares
    set for 1024 and two others (Container2 and Container3) have a --cpu-shares setting
    of 512. When processes in all three containers attempt to use all of the CPU power,
    the Container1 would receive 50% of the total CPU time, because it has half of
    the CPU usage allowed in comparison to the sum of other running containers (Container2
    and Container3). If we add a fourth container (Container4) with a --cpu-share
    of 1024, our first Container1 will only get 33% of the CPU, because it now has
    one third of the total CPU power assigned, relatively. Container2 will receive
    16.5%, Container3 also 16.5% and the last one, Container4, again, will be allowed
    to use 33% of the CPU.


    While the -c or --cpu_shares flag for the dockerrun command modifies the container''s
    CPU share weighting relative to the weighting of all other running containers,
    it does not restrict the container''s use of CPU from the host machine. But there''s
    another flag to limit the CPU usage for the container: --cpu-quota. Its default
    value is 100000 which means allowance for 100% of the CPU usage. We can use the
    --cpu-quota to limit CPU usage, for example:


    ```

    docker run -it --cpu-quota=50000 ubuntu/bin/bash

    ```


    In the preceding command, the limit for the container will be 50% of a CPU resource.
    The --cpu-quota is usually used in conjunction with --cpu-period flag for the
    docker run. This is the setting for CPU CFS (Completely Fair Scheduler) period.
    The default period value is 100000 which is 100 milliseconds. Take a look at the
    example:


    ```

    docker run -it --cpu-quota=25000 --cpu-period=50000 ubuntu /bin/bash

    ```


    It means that the container can get 50% of the CPU usage every 50ms.


    Limiting CPU shares and usage is not the only processor-related constraint we
    can set on the container. We can also assign the container''s processes to a particular
    processor or processor core. The --cpuset switch of the docker run command comes
    in handy when we want to do this. Consider the following example:


    ```

    docker run -it --cpuset 4 ubuntu

    ```'
  merge: -1
  img_proc: true
- pgno: 195
  md: 'The preceding command will run the ubuntu image and allow container use all
    of four processor cores. To start the container and only allow usage on one processor
    core, you can change the --cpuset value to 1:


    ```

    docker run -it --cpuset 1 ubuntu

    ```


    ![](img/0c87321919fa245e22f056c67ec70003_195_0.png)


    You can of course mix the option -cpuset with --cpu_shares to tweak your container''s
    CPU constraints.


    # Updating constraints on a running container


    As with the restart policies, the constraints can be updated also when the container
    is already running. This may be helpful, if you observe your containers eating
    too much of the Docker host system resources and would like to limit this usage.
    Again, we use the docker update command to do this.


    The same as with restart policies, the syntax for the docker update command will
    be the same as when starting the container – you specify the desired constraints
    as an argument for the docker update command and then give the container ID (taken
    from the dockerps command output for example) or its name. Again, if you would
    like to change the constraints on more than one container at once, just provide
    their IDs or names separated with a space. Let''s look at some examples how to
    update constraints at the runtime:


    ```

    docker update --cpu-shares 512 abbdef1231677

    ```


    The previous command will limit the CPU shares to the value of 512. Of course,
    you can apply CPU and memory constraints at the same time, to more than one container:


    ```

    docker update --cpu-shares 512 -m 500M abbdef1231677 dabdff1231678

    ```'
  merge: -1
  img_proc: true
- pgno: 196
  md: 'The previous will update CPU shares and memory limit to two containers, identified
    by `abbdef1231677` and `dabdff1231678`.


    Of course, when updating the runtime constraints, you can also apply the desired
    restart policy in one single command, as in the following example:


    ```

    docker update --restart=always -m 300M aabef1234716

    ```


    As you can see, the ability to set constraints gives you a lot of flexibility
    when running Docker containers. But it''s worth noting, that applying constraints
    is not always possible. The reason for that is the constraint setting features
    depend heavily of the internals of the Docker host, especially it''s kernel. For
    example, it''s not always possible to setup kernel memory limit or memory swappines,
    for example – sometimes all you will get is **Your kernel does not support kernel
    memory limit or kernel does not support memory swappiness capabilities** messages.
    Sometimes those limitations can be configurable, sometimes not. For example if
    you get **WARNING: Your kernel does not support cgroup swap limit** on Ubuntu,
    you can tweak your Grub bootloader with the `cgroup_enable=memory swapaccount=1`
    setting. It''s important to read logs printed out by Docker, to make sure your
    constraints are in place.


    ![](img/0c87321919fa245e22f056c67ec70003_196_0.png)


    Always take note on the warnings Docker outputs during the container startup or
    after updating your constraints on the fly – it may happen that your constraints
    will not take action!


    At this time, we know about the container runtime modes (foreground and detached).
    We are able to monitor running containers and update their restart policies and
    runtime constraints. But there''s some more when it comes to running containers
    and scaling your applications – the Docker Swarm mode. It couldn''t be missed
    in a chapter about running containers, so let''s cover it now.'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# Docker Swarm mode


    We have mentioned the Swarm mode briefly in the Chapter 4, Networking and Persistent
    Storage, when we were learning about multi-host networks. This time, we will look
    closer to the container clustering features of Docker. The Swarm mode is quite
    new feature in Docker – it''s available in Docker version 1.12 and up. It means,
    that you can only use this in Linux, which is obvious, but if you run Docker in
    Windows or Mac, you can use the native Docker for Windows or Docker for Mac application.
    However, what Swarm is? Let''s explain what was the purpose behind including the
    Swarm in latest Docker versions.


    # The purpose


    Running a single application in a Docker container is easy. We already did it
    a number of times. But what about scaling and fail-over? Imagine that you have
    an application or service that will need to respond swiftly even under heavy load.
    If a single container cannot handle the load, then you will probably want to run
    multiple containers. Using Docker Swarm, you can establish and manage a cluster
    of Docker hosts as a single virtual system. By enabling the cluster, you basically
    create a cooperative group of Docker hosts If one them fails and is down, other
    can still serve an application to the user. Having Docker Swarm cluster running,
    you also have the ability to add or subtract container instances whenever the
    load changes. And here comes the best part: we don''t have to make the decision
    on which host to start every container on. It will be made automatically by Swarm
    – in the background, Docker running in swarm mode decides which nodes to start
    them on. It may seem complex, but in real life running Docker Swarm is as easy
    as running single Docker containers. If you will get familiar with Docker commands,
    you will be familiar with Docker Swarm commands as well. Let''s get started with
    explaining some Swarm mode terminology.


    # Terminology


    There are some key names in Docker Swarm. We need to understand their meaning
    to easily understand the rest of the chapter and also external resources. Let''s
    list them one by one:


    +   - **Swarm:** This is simply a cluster of running Docker containers. It''s
    a pool of Docker hosts that acts a bit like a single large Docker host.

    +   - **The Swarm manager:** This is a Docker host on which you have initialized
    the Swarm. The manager node serves the special purpose: it maintains the cluster
    state, schedules services and serves swarm mode HTTP API endpoints.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   - **Node:** All containers running in a swarm are called `nodes` – they
    run in a so-called **swarm mode**. To make a container run in this mode, you will
    need to initialize the swarm (this will create a new swarm) or join the container
    to the existing Swarm. In Docker''s swarm mode, you can deploy manager and worker
    nodes at runtime. A node can be also promoted to be Manager by using the `docker
    node promote` command.

    +   - **Scheduling:** It''s just a name for launching containers in a Swarm cluster.
    Currently, there are three algorithms implemented in Docker Swarm to help it decide
    on which nodes in the cluster the container should be run: spread, BinPack and
    random. The spread setting is the default one-Docker will balance the containers
    based on the CPU and RAM resources available on each node. BinPack scheduler is
    quite the opposite -it will utilise the given node first to its max capacity,
    the will run containers on the next node. Random, as its name says, is just a
    random scheduling.

    +   - **Service:** It''s a container that is going to be run on the cluster together
    with the command that will be executed on the container.


    Docker Engine provides some commands for dealing with the swarm. Most of them
    are very similar to the commands we already know – those for working with the
    containers. Let''s list them altogether with their description.


    # Swarm mode commands


    +   - `swarminit`: To initialize the Swarm and also make to current Docker host
    the Swarm manager.

    +   - `swarm join`: To join a node to the Swarm.

    +   - `service create`: To schedule a service (container) to the Swarm.

    +   - `service inspect`: To display details about container running as a Swarm
    service.

    +   - `service ls`: To list running services. The command output will also contain
    the number of nodes that this specific service is being run on.

    +   - `servicerm`: To remove a service.

    +   - `service scale`: To add a replicas of the given service. You can also scale
    multiple services at once.'
  merge: -1
  img_proc: true
- pgno: 199
  md: "+   - `serviceps`: Will list the tasks of the service (which is the command\
    \ that was run with the container).\n+   - `service update`: Allows you to update\
    \ the service's – you can set service command line arguments, runtime constraints,\
    \ like CPU or memory, add or modify environment variables and so on.\n\nTo initialize\
    \ the Swarm (which also make the host you are currently on a Swarm manager), you'll\
    \ need to execute the swarm init command:\n\n```\ndocker swarm init --advertise-addr<IP>\n\
    ```\n\nAs an output, Docker will give you the token that you will need to user\
    \ if you would like to connect another Docker host to you Swarm. You can see it\
    \ on the following screenshot:\n\n![](img/0c87321919fa245e22f056c67ec70003_199_0.png)\n\
    \nTo connect a node to the Swarm, execute the docker swarm join command, including\
    \ the token you were given from the docker swarm init command, for example:\n\n\
    ```\ndocker swarm join \\\n  --token SWMTKN-1-5p7kzi2jbising1pew571s91jidy61biticftzbwmj5j4nfocg-6aieefd3frhl3ow3zppulc0bc\n\
    ```\n\nNow we have simple (two nodes) Docker Swarm. It's time to install (schedule)\
    \ a service. Scheduling a service to be run on Docker Swarm is very similar to\
    \ running the standalone container. You can schedule the service using the docker\
    \ service create command:\n\n```\ndocker service create --replicas 1 -p80:80 --name\
    \ nginx nginx\n```"
  merge: -1
  img_proc: true
- pgno: 200
  md: '# Running Containers


    In the previous case we run nginx web server as a Docker Swarm service. Most of
    the commands that we have been using to deal with containers, such as ps, and
    ls, inspect – they will also work with the docker service command, as you can
    see on the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_200_0.png)


    The way service related commands mimic those container related commands makes
    the service related command easier to remember. To scale the service, which will
    be increasing the number of service instances, execute the docker scale command,
    for example:


    ```

    docker service scale nginx=3

    ```'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'As you can see, having the Docker Swarm is not that tricky as it may seem.
    The beauty of the Docker cluster implementations is its simplicity. With the swarm
    mode you create a swarm with the `init` command, and add workers to the cluster
    with the `join` command. That''s it. The commands to create and join a swarm literally
    take a second or two to complete.


    # Summary


    You may have an impression, that there is a huge flexibility when it comes to
    running Docker containers. And you are right, definitely there is much we can
    do. We can override the images `RUN`, `CMD`, `ENTRYPOINT` instructions to change
    the container run behavior, sometimes even totally change the container''s purpose
    if needed. Docker provides a lot of powerful commands to inspect the container
    runtime state, viewing logs, events and statistics. They surely make devop''s
    daily job a lot easier. Also, setting the container restart policies and runtime
    constraints on CPU or memory can result of run-and-forget way of working with
    Docker containers. If you need your applications to scale easily, there is nothing
    simpler than bringing a Docker Swarm to life. Setting up Docker Swarm is easy,
    straightforward and flexible. Of course, detailed setup of a cluster may take
    some time, but running a basic cluster of Docker containers in seconds is possible.


    Now that we know how to create images, how to run and test them during runtime
    – it''s time for another step – to show world out work. In the next `Chapter 8`,
    *Publishing Images*, we are going to publish our images to the Docker Hub and
    do some more interesting tricks, like creating the automated builds for our images.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# 8


    # Publishing Images


    So far you have learned how to use the command line to run Docker on your local
    machine, how to pull down images to build containers from existing images, and
    how to create your own images. In this chapter, we are going to learn how to publish
    our images in the Docker Hub registry. We will also cover the process of doing
    an automatic build of the image using the Webhooks. We have already discussed
    the process of pulling an image from the registry in Chapter 5, Finding Images.
    Now, however, instead of pulling images, we are going to publish our work. As
    you might remember, to do this, you will need to have a Docker Hub account. You
    can refer to Chapter 5, Finding Images, for the instructions on how to create
    an account, if you haven''t done so already. The Docker Hub service is free for
    public Docker images. Once you have created your account, you can push the image
    that you created previously, to make it available for others to use. In this chapter,
    we are going to cover the following topics:


    +   - Managing image tags and pushing to the remote registry

    +   - Integrating GitHub and Bitbucket

    +   - Webhooks and automated builds


    Let''s begin with publishing our images to the repository.


    # Publishing images


    When dealing with images on the remote registry, the concept of tag is very important.
    We were going to find the images and identify those using tags. This is also crucial
    if you are going to publish your own image; you will need to tag it first. Let''s
    do that now.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Tagging


    We use the `docker tag` command to tag an image. You can identify an image you
    want to tag by either using its ID or its name. Also, you can pick the image to
    tag using other tags. The syntax of the `docker tag` command is as follows:


    ```

    docker tag IMAGE[:TAG] IMAGE[:TAG]

    ```


    For example, you will need to execute the following command to tag a local image
    with name `myHelloWorld` and tag `test` into the `myRepo` repository with `version1.0.test`:


    ```

    docker tag myHelloWorld:test myRepo/myHelloWorld:version1.0.test

    ```


    If you run the `docker images` command now, you will see your newly tagged image.


    Your newly tagged image is now ready to be pushed to the remote registry. The
    concept of tags is used heavily by the Docker Hub''s automated builds. A tag lets
    you link a `version` tag to either a branch or a tag in the `git` history. A branch
    in this case will refer either to a different Git branch or a different sub-directory.
    We will get back to it in a while when we discuss the automated build feature.


    # Untagging the image


    Sometimes it may be useful to remove a tag from the image. There is no `docker
    untag` command, but if you are careful, you can use the `docker rmi` command to
    untag the image. Normally, we use the `docker rmi` command to remove the image;
    however, if your image is tagged with more than one tag, then the `docker rmi`
    command will remove the tag but not the image.


    ![](img/0c87321919fa245e22f056c67ec70003_203_0.png)


    Be cautious, because if the image has no more tags, the `docker rmi` command will
    remove the image.


    For example, execute the following command if you need to remove the `version1.0.test`
    tag from your image:


    ```

    docker rmi <image ID or name>:version1.0.test

    ```'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# Pushing the image


    Once your image is properly tagged, you can log in to the Docker Hub using the
    docker `login` command, the same way that we did in Chapter 5, *Finding Images*.
    To log in into the remote registry, execute the docker `login` command:


    ```

    docker login --username=yourUsername --email=yourEmail@address.com

    ```


    After successful authentication, you just simply push the image using the docker
    `push` command:


    ```

    docker push yourUsername/myRepo

    ```


    Of course, pushing the image can take some time, depending on the image size and
    the speed of your internet connection. When finished, the image is available for
    pulling. If you need to check if the image is available and ready on the remote
    registry, you can just pull it.


    ![](img/0c87321919fa245e22f056c67ec70003_204_0.png)


    If you want to pull your own image from the Docker Hub, first delete the original
    image from your local machine. Docker will compare the one you have locally and
    the one you have on the remote registry and will not pull as the local and the
    remote images are identical.


    If publishing to a public repository in the Docker hub, logging in and executing
    the docker `push` command will make the new image available to the world. However,
    you are, of course, not limited to the public registry, you can also push the
    image to your own private registry. In case you want to use a private registry,
    you need to set the URL to your private registry as the username. First, you will
    need to tag it properly and then push it. If your registry is listing on localhost
    port 5000, you can execute the following commands:


    ```

    docker tag yourUser/myRegistry localhost:5000/myRegistry

    docker push localhost:5000/myRegistry

    ```


    You can create your own private registry by making use of the Docker Distribution
    toolset, available freely on GitHub: https://github.com/docker/distribution. The
    main utility you can find in this GitHub repository is the Docker registry 2.0
    implementation for storing and distributing Docker images. It replaces the old
    docker-registry project with a new API design, focused on security and performance.
    This new registry implementation provides the following benefits over the old
    one: faster push and pull, simplified deployment, pluggable storage backend, and
    webhooks notifications. It supports multiple storage backends, you can choose,
    for example, the local file system or a cloud similar to the Amazon S3.'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'Tagging and pushing images to the remote registry, either public or private,
    is rather straightforward and not a complicated process. But there''s more in
    what Docker Hub offers and automated builds. Let''s explain them in the succeeding
    sections.


    # Webhooks and automated builds


    As you may recall from Chapter 5, Finding Images, one of the coolest Docker Hub
    features are the automated builds. An automated build is triggered by webhooks
    when changes are made to a source code of the image (that is, to Dockerfile).
    Webhooks let you execute different actions after pushing an image to a repository.
    Automated Builds repository automate the building and updating of images from
    the most popular git repositories, namely GitHuborBitbucket, directly on Docker
    Hub. Automated builds repository can be created either for private or public repositories.
    It works by adding a commit hook to your selected GitHub or Bitbucket repository;
    thus, triggering a build and update when you push a commit. Automated Builds repository
    have several advantages, images built this way are built exactly as specified,
    the Dockerfile is available to anyone with access to your Docker Hub repository,
    and your Docker repository is automatically always up-to-date with source code
    changes.


    # Setting up the automated build


    In Chapter 6, Creating Images, we discussed that Docker builds images using the
    so called build context. The build context is a Dockerfile and any files in a
    specific location that are referenced by the Dockerfile. For an Automated Build,
    the build context will be a source code repository containing a Dockerfile. This
    means that the source code repository must contain all the files that you would
    usually need to build the image locally, with mandatory Dockerfile in the first
    place.


    ![](img/0c87321919fa245e22f056c67ec70003_205_0.png)


    For automated builds, the source code repository is the build context.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'To set up the Automated Build you will need to login into Docker Hub first.
    After that, open the create dropdown and choose **Create Automated Build**, as
    you can see in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_206_0.png)


    Docker Hub uses the GitHub or Bitbucket as a source code repository, so you will
    need to link your GitHub or Bitbucket account to your Docker Hub account, if you
    haven''t done this earlier. The steps will include authenticating with GitHub
    or Bitbucket and granting Docker Hub limited or full access to your repository
    account. That access is required for the Docker Hub to find your repositories
    and register appropriate webhooks for you. To do this, click on the **Link Account**
    button and choose either GitHub or Bitbucket, as shown:


    ![](img/0c87321919fa245e22f056c67ec70003_206_1.png)'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'If you select Link GitHub, you will need to do one more choice. You can give
    Docker Hub public and private access or a limited, read-only, public access to
    your repositories, as you can see on the following screenshot:


    # Public and Private (Recommended)


    +   - Read and Write access to public and private repositories. (We only use write
    access to add service hooks and add deploy keys)

    +   - Required if you want to setup an Automated Build from a private GitHub repository.

    +   - Required if you want to use a private GitHub organization.

    +   - We will automatically configure the service hooks and deploy keys for you.


    # Limited Access


    +   - Public read only access.

    +   - Only works with public repositories and organizations.

    +   - You will need to manually make changes to your repositories in order to
    use Automated Build.


    There''s a big difference between the two. The first option gives read and write
    access to public and private repositories, it means that Docker Hub will be able
    to add service hooks and deploy keys to your repositories automatically. Also,
    this read-write access is mandatory, if you want to set up an Automated Build
    from a private GitHub repository. The limited, read-only access means that you
    will be able to create an Automated Build repository only with public repositories.
    Also, in order to use the automated build feature, you will need to make changes
    to the repository on your own.


    Giving Docker Hub access to your private repository is a lot more convenient and
    recommended, but consider using only the limited access if you have security concerns.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Once you give access to your repository, you will be taken to the OAuth summary
    screen, where GitHub will ask for your confirmation before giving access to your
    account:


    ![](img/0c87321919fa245e22f056c67ec70003_208_0.png)


    After authorizing the access to your GitHub account, the list of your repositories
    on GitHub will be shown if you pick the Create Automated Build option from the
    Create dropdown.


    ![](img/0c87321919fa245e22f056c67ec70003_208_1.png)


    The repository you want to have automatic build created from needs to have a Dockerfile
    in that you want to build.


    For the purpose of this example, I''ve forked the hello-world Docker image repository
    available on GitHub at https://github.com/docker-library/hello-world.'
  merge: -1
  img_proc: true
- pgno: 209
  md: 'All you need to do now is pick up the repository from the list. You will be
    presented with the `Automated Build` configuration screen. Here, you can set the
    visibility of the resulting image (public or private). By default, Docker Hub
    will tag the resulting images with the names of the branches in your Git repository.
    The Git `push` command to the `master` branch will trigger a build and tag the
    image with the `latest` tag. A git `push` to a branch other than `master` will
    trigger the build of an image from that Git branch. The result will then be tagged
    with this branch name.


    TIP: You can create multiple Automated Builds per repository and configure them
    to point to specific Dockerfile''s or Git branches.


    This is usually sufficient and it''s a very effective setup, but you can customize
    the behavior if you need to. Just click on the Click here to customize link to
    open a rule editor:


    ![](img/0c87321919fa245e22f056c67ec70003_209_0.png)


    In the **Autobuild Tags** editor, you can specify the tags that specific kind
    of git push (branch or tag) will have. As you can see, the result of the `master`
    git branch build will be tagged `latest` by default. There is a lot of flexibility
    here, you can add or remove rules as you like. For example, a build result of
    push to the specific branch will be always tagged differently from the other branches.


    TIP: You can always change the tagging configuration later, after creating an
    `Automated Build` in the `Build Settings` page.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Publishing Images


    After clicking on the **Create** button, your automated build will be created.
    Docker Hub will list it along with your other repositories; note that the repository
    you have just created is a result of the automated build:


    ![](img/0c87321919fa245e22f056c67ec70003_210_0.png)


    Once you''ve created an `Automated Build` repository, you can deactivate or delete
    it later. Docker will list your automated build as a normal repository, however
    with two differences. The first one difference is that you cannot push an image
    to `Automated Build` repository.


    ![](img/0c87321919fa245e22f056c67ec70003_210_1.png)


    You cannot push to an Automated Build with the `docker push` command. You can
    only manage it by committing and pushing your source code to GitHub or Bitbucket
    repository.


    The second difference is that if you go to the repository details, two additional
    tabs will be present: **Build Details** and **Build Settings**. The `Build Details`
    screen, as shown in the following example, will present the history of the latest
    builds and their statuses, such as `Queued`, `Success`, or `Failure`.


    ![](img/0c87321919fa245e22f056c67ec70003_210_2.png)'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'The statuses you can see include:


    +   - `Queued`: Your image waits in the queue to be built. Just wait for a while
    and it will be ready.

    +   - `Building`: The image is being currently built.

    +   - `Success`: There were no issues during the building process and the image
    is now available for pulling.

    +   - `Error`: There were some issues during the build (like an error in the Dockerfile
    or a missing file in the context). If you click on the status row, you will be
    taken to the Builds Details screen, where you can view the build logs to quickly
    find a reason for the build failure.


    The **Build Settings** page contains the detailed list of settings you can change
    for that specific automated build. You will find it here on the **Autobuild Tags**
    editor, the one you saw when creating the Automated Build repository at the beginning.
    You can always tweak your tagging scheme here.


    Although the main trigger for the start of the image build is the git push command,
    you can also trigger a build issuing the `HTTP POST` command to the specific endpoint.
    This feature is called a Build Trigger.


    # Build Triggers


    The build trigger is simply an HTTP endpoint, which—if called using an HTTP post
    command will trigger a build of the image of your choice. You can set up the trigger
    URL using the **Build Triggers** part of the setup.


    It''s available when you scroll down the page until you see the *Build triggers*
    section, as you can see in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 212
  md: '![](img/0c87321919fa245e22f056c67ec70003_212_0.png)


    Docker will generate a special unique trigger initially, you can regenerate it
    if you wish. The token is being used as a part of the trigger URL. Having this
    set up, you can now trigger a build from your own processes, for example, your
    continuous integration or delivery flow. The example use case can be if your image
    uses some external dependencies. You can rebuild the image on demand, not only
    while pushing the new code to the source code repository.


    To test the build trigger, you can execute the POST using the HTTP client of your
    choice, such as postman for Chrome or PAW for Mac. The simplest and fastest tool
    is the curl command probably. It''s a command line HTTP client, available, by
    default, in Linux, but you can download it for almost all possible platforms from
    its homepage: https://curl.haxx.se/download.html. The POST call to the build trigger
    takes JSON payload with instruction do Docker Hub what to do and how to do it.
    Consider the following examples of triggering a build. If you want to trigger
    all tags/branches, execute:


    ```

    curl -H "Content-Type: application/json" --data ''{"build": true}'' -X POST

    https://registry.hub.docker.com/u/jotka/hello-world-docker/trigger/a9308c54-7105-4d20-a950-93db1f15085f/

    ```'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'To trigger a build using the Docker tag name, you will need to provide the
    tag name in the JSON payload of the POST command:


    ```

    curl -H "Content-Type: application/json" --data ''{"docker_tag": "master"}'' -X
    POST

    https://registry.hub.docker.com/u/jotka/hello-world-docker/trigger/a9308c54-7105-4d20-a950-93db1f15085f/

    ```


    To trigger a build by a source branch, such as feature/NIS-234 the JSON payload
    needs to carry the branch name, as shown:


    ```

    curl -H "Content-Type: application/json" --data ''{"source_type": "Branch", "source_name":
    " feature/NIS-234"}'' -X POST

    https://registry.hub.docker.com/u/jotka/hello-world-docker/trigger/a9308c54-7105-4d20-a950-93db1f15085f/

    ```


    Last but not the least, you can trigger a build using a source tag, such as 1.1:


    ```

    curl -H "Content-Type: application/json" --data ''{"source_type": "Tag", "source_name":
    "v1.1"}'' -X POST

    https://registry.hub.docker.com/u/jotka/hello-world-docker/trigger/a9308c54-7105-4d20-a950-93db1f15085f/

    ```


    Docker Hub and its Automated Build feature is a great tool to keep your source
    code and published images in sync. But there''s also another great feature that
    allows executing an action in another application in response to an event in the
    repository—these are Webhooks. Let''s take a look at them now.


    # Webhooks and continuous deployments


    Docker Hub fires Webhooks when an image is built or a new tag is added to your
    Automated Build repository.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Publishing Images


    When defining the Webhook, you specify its name and target URL to call when build
    finishes or a new tag comes. This can be done on the `Webhooks` tab in the `Automated
    Build` repository details, as you can see in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_214_0.png)


    The Webhook call will be an HTTP `POST` request. The JSON payload of this request
    will contain all the details of the event that just happened. The easiest way
    to see what that payload is and also test your Webhook is to register a temporary
    REST endpoint at `http://requestb.in` and enter use it as a Webhook URL.'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'The requestb.in is a web application, available free of charge, which allows
    you to create a URL (the endpoint) that will listen for requests made to it and
    let you inspect them in a readable form. Just click on the Create Request Bin
    button, to create your own URL, as you can see in the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_215_0.png)


    The resulting page will present the URL value and also some examples on how you
    can call the newly created URL. Those examples are not interesting for us at the
    moment; it''s the Docker Hub that is going to call the URL. The Bin URL is the
    URL you will want to enter in the setup of the Webhook in the Docker Hub, as you
    can see on the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_215_1.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: "The URL created in the http://request.in will listen for incoming connections\
    \ and present the incoming POST data after the webhook has been called. If you\
    \ trigger a build on the Docker Hub, either by pushing a commit to the GIT repository,\
    \ using a build trigger or executing a build manually from the Docker Hub web\
    \ interface. Docker Hub will use the defined Webhook to call the listening endpoint,\
    \ where you will actually see the incoming data. You can see the result in the\
    \ following screenshot:\n\n![](img/0c87321919fa245e22f056c67ec70003_216_0.png)\n\
    \nAs you can see in the RAW BODY section, Docker Hub posts a JSON payload with\
