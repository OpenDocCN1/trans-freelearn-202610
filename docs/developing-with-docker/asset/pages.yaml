- pgno: 48
  md: 'To use the EC2 cloud, you will need to create an account. It''s free for basic
    purposes, so go to http://aws.amazon.com and fill out the registration form. Also,
    the basic `t2.micro` instance is free for you to use and is enough for testing
    the Docker installation. After creating the account, log into **AWS Console**
    and select **EC2** from the list of available services:


    ![](img/0c87321919fa245e22f056c67ec70003_48_0.png)


    Next, launch the instance using the **Launch Instance** button:


    ![](img/0c87321919fa245e22f056c67ec70003_48_1.png)


    The next page asks what operating system should be available on your new EC2 instance.
    For our purposes, **Amazon Linux** will be fine. It''s first on the list, select
