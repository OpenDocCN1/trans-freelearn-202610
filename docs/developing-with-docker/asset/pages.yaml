- pgno: 64
  md: 'The Docker engine takes the image and adds a read/write layer on top of the
    layer''s stack, then initializes the image name, ID, and resource limits (such
    as CPU and memory). In this phase, Docker will also set up an IP address by finding
    and attaching an available IP address from a pool. The last step of the execution
    will be the actual command – passed as the last parameter: /bin/bash in our case
    – that starts a shell where you can log in. Docker will capture and provide the
    container output; it will be displayed in the console. You can now do things you
    would normally do when preparing an operating system to run your applications.
    This can be installing packages (via apt-get, for example), pulling source code
    with Git, downloading Node.js libraries using npm, and so on. All of this will
    modify the filesystem of the top, writable layer. If you then execute the commit
    command, a new image containing all of your changes will be created and ready
    to run later.


    Sometimes we can tell Docker that we will not need a container after it is stopped.
    For this purpose, there is the -rm option available for the run command:


    ```

    $ docker run -i -t -rm ubuntu:latest

    /bin/bash

    ```


    This will pull (of course, if it''s not already present on your machine) and start
    the latest Ubuntu container and present us an interactive bash shell. As soon
    as we finish our work and stop the container, it will be deleted from the filesystem
    releasing some space on a drive.


    To stop a container, use the docker stop command. The Docker stop has the following
    syntax:


    ```

    $ docker stop [OPTIONS] <container

    ID/name> [<container ID/name...]

    ```


    There are not many options to the stop command; you can give the -t option to
    provide the time in seconds Docker should wait before stopping the container,
    with 10 seconds as the default value. For example, to stop the container with
    ID fa19b25b311e, simply execute the following command:


    ```

    $ docker stop fa19b25b311e

    ```


    A container when stopped will retain all settings and filesystem changes (in the
    top, read/write layer), but all processes will be stopped and you will lose anything
    in memory. This is what differentiates a stopped container from a Docker image.
