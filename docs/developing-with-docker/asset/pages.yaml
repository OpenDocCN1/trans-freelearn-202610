  img_proc: true
- pgno: 73
  md: '# 4


    # Networking and Persistent Storage


    In the previous chapter, we learned about images and containers and a way to modify
    them. For all practical purposes, the service running inside a container needs
    to be exposed to the outside world. The Docker tool chain provides a very powerful
    network interface that enables you to expose as well as control network connectivity
    as per your requirement. In this chapter, we will dive deep into the docker networking
    approach. The persistent storage will be useful for storing data, because, as
    you remember from the previous chapters, Docker filesystems are temporary, so
    to speak. If you stop the running container, all your changes will be lost: any
    deleted files will be back, and any changes in the existing files you have made
    will not be present. In this chapter, we are going to cover the following topics:


    +   - Docker networking, including network types such as host, bridge, or overlay

    +   - Exposing and mapping ports

    +   - Linking containers

    +   - Creating Docker volumes


    Let''s begin with a networking overview.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Docker networking


    Docker uses the concept of the **Container Network Model (CNM)**. In essence,
    CNM allows you to create small, segmented networks for groups of containers to
    communicate over. Let''s explain the model using the following diagram:


    ![](img/0c87321919fa245e22f056c67ec70003_74_0.png)


    There are three entities present in the CNM:


    +   - **sandbox:** This is an isolated environment holding the networking configuration
    for a container.

    +   - **endpoint:** This is a network interface that can be used for communication
    over a specific network. Endpoints join to exactly one network. Multiple endpoints
    can exist within a single network sandbox.

    +   - **network:** It''s a group of endpoints that are able to communicate with
    each other. You could create, for example, two separate networks, and they will
    be completely isolated. Network can be identified by their names (such as **backend**
    and **frontend**) or IDs (generated automatically by Docker during the network
    creation).


    Docker networking model also introduces the concept of network drivers. By default,
    two network drivers are provided by Docker: the `bridge` and the `overlay` driver.
    We will get back to it in a moment.


    All containers on the same network can communicate with each other freely. An
    endpoint provides network connectivity for a sandbox – if you need to join a container
    to multiple networks, there should be multiple endpoints per container. This networking
    model is highly configurable (and allowing quite complex networking configurations),
    but also quite easy to set up using just the defaults. In fact, Docker creates
    some default networks for us out of the box.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'The `docker` command that we will be using throughout this chapter to deal
    with networking is the `network` command. As you remember from the previous chapter,
    the concise help is always available from the shell (or command line) – let''s
    look at the output of the `docker network help` command:


    ![](img/0c87321919fa245e22f056c67ec70003_75_0.png)


    There are not many commands related to networking, but they are quite useful.
    Let''s begin with explaining the default networks.


    # Default networks


    When you install Docker, three default networks will be automatically created
    – you can list them using the `network ls` command, as follows:


    ```

    $ docker network ls

    ```'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Docker will output the list of available networks, including their ID, network
    name, driver (we will cover drivers in a while), and a scope, as you can see in
    the following screenshot:


    ![](img/0c87321919fa245e22f056c67ec70003_76_0.png)


    We have three networks installed by default: host, none, and bridge. Let''s discuss
    them in more detail, starting with the simplest one, none.


    # No networking


    To cut the long story short, none mode does not configure networking at all. The
    DRIVER column listed earlier contains null, which means that there is no driver
    being used by this network. It''s useful when you don''t need your container to
    have network access.


    Let''s run the simple example by running the busybox image without the network:'
  merge: -1
  img_proc: true
