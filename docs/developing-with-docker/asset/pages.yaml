    We have now learned about the build (images) and run (containers) pieces of our
    containerization world. We still are missing the last element – the distribution
    component. The distribution component of Docker consists of Docker registry, index,
    and repository. Let''s focus on them now to have a complete picture.


    # Docker registry, repository and index


    Docker utilizes a hierarchical system for storing images, as shown in the following
    diagram:


    ![](img/0c87321919fa245e22f056c67ec70003_69_0.png)'
  merge: -1
