- pgno: 44
  md: '# Installing on Linux


    As we have said before, Linux is the natural habitat for Docker. Therefore, there
    is no need to virtualize the Linux kernel. You can run Docker without VT-x or
    similar technologies in your processor, since Docker only requires cgroups to
    be available on the kernel to get the majority of its features working. Cgroups
    (control groups) is a Linux kernel feature that limits, accounts for, and isolates
    the resource usage (CPU, memory, disk I/O, network, and so on) of a collection
    of processes. Docker will simply use the kernel of your own operating system.
    This also makes the installation package smaller—there is no need for a virtualization
    engine and another virtualized operating system. This is the reason that the installation
    process is a little bit different from the one on Mac OS or Windows. First, there
    is no Docker Machine included in the installation—it’s simply not mandatory for
    Linux. Second, there is no fancy GUI installer. You will need to perform most
    of the tasks from the command line, but this should not be a problem for a Linux
    user. And last but not least, there is no Kitematic tool available for Linux.


    On the Docker website, you can find the installation steps for the specific Linux
    distribution (this will be the yum package manager for Red Hat or apt-get for
    Ubuntu, for example). If you are not willing to use the package manager directly,
    you can use the installation script provided by the Docker team. In fact, the
    script will execute the package manager valid for your Linux OS and then install
    the software using packages. To get the most recent Docker release for Linux,
    type the following in the shell:


    ```

    ```bash

    $ curl -fsSL https://get.docker.com/ | sh

    ```

    ```


    Alternatively, you can install Docker using the wget command by executing the
    following command:


    ```

    ```bash

    $ wget -qO- https://get.docker.com/ | sh

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 45
  md: "The process of downloading the required package will begin and you will observe\
    \ keys, packages, and their dependencies being downloaded. At the end of the output,\
    \ the installer will print out the version of the installed Docker client and\
    \ server:\n\n![](img/0c87321919fa245e22f056c67ec70003_45_0.png)\n\nInstalling\
    \ this way will make the Docker service available to be run from root. It's not\
    \ always a good idea to run software as a root, so you will probably want to make\
    \ it runnable also for your user. First, you will need to create the docker group:\n\
    \n```\n$ sudo groupadd docker\n```\n\nThen add your current user to the group\
    \ (assuming that yourUsername is the login name for your user:\n\n```\n$ sudo\
    \ usermod -aG docker yourUsername\n```\n\nIf you are going to deal with the cloud\
    \ setup using your Linux, you will want to install the Docker Machine as well.\
    \ To do this, execute this script:\n\n```\n$ curl -L https://github.com/docker/machine/releases/download/\n\
    \ v0.7.0/docker-machine-`uname -s`-`uname -m` > /usr/local/bin/\n docker-machine\n\
    $ chmod +x /usr/local/bin/docker-machine\n```"
  merge: -1
  img_proc: true
