- pgno: 78
  md: '# Host network


    If you start your container with the `--net=host` option, then the container will
    use the host network. It''s a network created by default and it is using the `host`
    driver. It''s as fast as the normal networking: there is no bridge, no translation,
    nothing. That''s why it can be useful when you need to get the best network performance.
    In this mode, container shares the networking namespace of the host (your local
    machine, for example), directly exposing it to the outside world. In the case
    of `--net=host`, the container can be accessed through the host''s IP address.
    This also means that you need not use port mapping to reach services inside the
    container. However, you need to be aware that this can be dangerous. If you have
    an application running as root and it has vulnerabilities, there will be a risk
    of security breach – someone can get the remote control of the host network via
    the Docker container.


    # Bridged network


    We will focus a little bit more on the `bridge` network because this will be probably
    the most frequently used one. The `bridge` network is kind of special – it''s
    present on all Docker hosts. You can see it as part of a host''s network stack.
    You can see it by using the `ifconfig` command on your Mac or Linux machine, for
    example:


    ![](img/0c87321919fa245e22f056c67ec70003_78_0.png)'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'It''s also the default network in Docker. When the Docker service daemon starts,
    it configures a virtual bridge named docker0. Unless you specify a network with
    the docker run --net=<NETWORK> option, the Docker daemon will connect the container
    to the bridge network by default. Also, if you create a new container, it will
    be connected to the bridge network. Docker will find a free IP address from the
    range available on the bridge and will configure the container''s eth0 interface
    with that IP address. From now on, if the new container wants to, for example,
    connect to the Internet, it will use the bridge – the host''s own IP address will
    be used as the gateway. This bridge will automatically forward packets between
    any other network interfaces that are attached to it and also allow containers
    to communicate with the host machine as well as with the containers on the same
    host.


    ![](img/0c87321919fa245e22f056c67ec70003_79_0.png)


    By default, Docker containers can make connections to the outside world, they
    connect via the docker0 interface, but the outside world cannot connect to containers.


    The docker network inspect command that we saw earlier shows all the connected
    containers and their network resources on a given network. Containers in this
    default network are able to communicate with each other using IP addresses.


    Sometimes, the default networks created by Docker are not enough. Luckily, Docker
    gives us a possibility to create our own custom network. Let''s create a custom
    network.


    # Creating a network


    As you can see from the network help command, there''s a create command. Run from
    the shell or command line:


    ```

    $ docker network create backend

    ```


    This is the simplest form of the command, and yet it will be used probably the
    most often. It takes a default driver (we haven''t used any options to specify
    a driver – we will cover network types and drivers in a while). As the output,
    Docker will print out the network ID. You can use this ID later when referring
    to this network when connecting containers to it or inspecting the network''s
    properties.


    The last parameter of the command is the network''s name – which is a lot more
    convenient and easier to remember than the ID.'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'The network name in our case is backend. The network creates commands that
    take in more parameters, as shown in the following table:


    | Option | Description |

    |---|---|

    | `-d, --driver="bridge"` | This is the driver that is used to manage the network
    |

    | `--aux-address=map[]` | Auxiliary ipv4 or ipv6 addresses are used by the network
    driver |

    | `--gateway=[]` | ipv4 or ipv6 gateway is used for the master subnet |

    | `--ip-range=[]` | This is used to allocate container IP from a subrange |

    | `--ipam-driver=default` | This is the IP address management driver |

    | `-o, --opt=map[]` | This sets the driver''s specific options |

    | `--subnet=[]` | This is the subnet in CIDR format that represents a network
    segment |


    One of the most important parameters is the driver with the value bridge drivers
    that let you specify the network type. Docker has a couple of drivers available
    by default. We are going to cover them in detail in a short while, but first,
    let''s connect a container to the network.


    # Running a container in a network


    After you create the network, you can launch containers on it using the docker
    run --net=<NETWORK> option, where <NETWORK> is the name of one of the default
    networks or the one you have created yourself, for example:


    ```

    docker run -it --net=bridge ubuntu

    ```


    If you don''t want to explicitly state what network a container should start with,
    but just want to inform Docker that you would like the container to connect to
    the same network that the other container uses, execute the run command with a
    --net option with the container: prefix, specifying other container''s ID or name.
    So, for example, execute the following commands:


    ```

    docker run -it --name=myUbuntu --net=bridge ubuntu

    docker run -it --net=container:myUbuntu busybox

    ```


    This will make your busybox container run on the same network that the Ubuntu
    container is running on, no matter what network it is. The containers you launch
    into the same network must be run on the same Docker host. Each container in the
    network can immediately communicate with other containers in the network.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'However, the network itself isolates the containers from external networks,
