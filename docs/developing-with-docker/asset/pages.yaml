    # Saving changes to a container


    Although an image is always read-only and immutable, we can actually make changes
    to a running container – the top layer of a container stack is always the read/write
    (writable) layer. This can be adding or modifying files, such as installing a
    software package, configuring the operation system, and so on.


    ![](img/0c87321919fa245e22f056c67ec70003_65_1.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'If you modify a file in the running container, the file will be copied out
    of the underlying read-only layer and into the top, read/write layer. Your changes
    will be applied only in the top layer, and the union filesystem will hide the
    underlying file. The original file will not be destroyed – it still exists in
    the underlying, read-only layer. If you delete the container, and relaunch the
    same image again, Docker will start a fresh container without any of the changes
    made in the previously running container.


    In other words, your changes to the filesystem will not affect the base image.
    However, you can create a new image from a running container (and all its changes)
    using the commit command:


    ```

    $ docker commit <container-id>

    <image-name>

    ```


    To save changes you have made to the container, you must commit them.


    ![](img/0c87321919fa245e22f056c67ec70003_66_0.png)


    During runtime, if the process in a container makes changes to its filesystem,
    there will be of course a difference between the current container filesystem
    and the filesystem of the image from which the container was created. If you run
    the docker commit command, this difference becomes a new read-only image, from
    which you can create new containers. Otherwise, if you remove the container, this
    difference will disappear. You can make updates to a container, but a series of
    updates will engender a series of new container images, so system rollbacks are
    easy. Take a look at what happens after you do a commit:


    ![](img/0c87321919fa245e22f056c67ec70003_66_1.png)


    Let''s see an example. First, we pull a base image called busybox. Busybox combines
    tiny versions of many common UNIX utilities into a single small executable. It
    provides replacements for most of the utilities you usually find in GNU, such
    as file utilities, shell tools, and so on:


    ```

    $ docker pull busybox

    ```'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Now, we make changes to a container of this image; in this case, we make a
    new folder:


    ```

    $ docker run busybox mkdir /home/test

    ```


    At the moment, we can get a busybox container ID using the command:


    ```

    $ docker ps -a

    ```


    Let''s commit this changed container – this will create a new image called busybox_modified:


    ```

    $ docker commit <CONTAINER ID>

    busybox_modified

    ```


    In response to the successful commit, Docker will just output the full ID of newly
    generated images.


    To avoid data corruption or inconsistency, Docker will pause a container you are
    committing changes to. Although it''s not recommended to do so, you have an option
    to disable this behavior, setting the --pause option to false.


    If we list the images we have now, both busybox and busybox_modified should be
    present on the list. To see them, execute the images command:


    ```

    $ docker images -a

    ```


    As you can see, the new busybox_modified is present on the list of images available
    locally:


    ![](img/0c87321919fa245e22f056c67ec70003_67_0.png)'
  merge: -1
