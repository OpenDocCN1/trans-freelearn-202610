  \n请注意，现在运行于**14:14**更新了三行，对应投资组合的新内容。插入的第三行是`quantity = 0`的那一行，用于平掉'GCM'股票的头寸。\n\
  \n## 选择正确的加载模式来加载历史数据\n\n既然你有两个HIST表，对于相同的输入却有不同的数据，你可能想知道哪一个是正确的。\n\n两个表都是正确的，因为它们都正确地记录了各自想要记录的内容。\n\
  \n你真正的问题不应该是对错，而是如何选择合适的模式。选择正确加载模式的人是我们分析工程师，我们必须根据要加载的数据以及数据从源系统导出的方式来选择正确的加载模式。\n\
  \n一般来说，你可以使用基本历史加载模式加载所有维度，这些维度的条目即使被删除后也必须保持使用状态；也可以加载那些不会被删除、但最终会被禁用或停用的事实。当源系统启用了变更跟踪或变更数据捕获时，我们也可以使用这种模式，从源获取数据，并附带告诉我们表中条目何时被删除的列。\n\
  \n在所有情况下，如果事实表中的行会被删除，但我们无法从源数据中获取删除信息，就必须使用能够识别并存储删除操作的加载模式，即使它的性能不如另一种模式。\n\n\
  ## 将已平仓头寸纳入流程\n\n现在我们已经创建了能够检测已平仓头寸的新HIST表，让我们用这些更好的数据替换旧的HIST表。\n\n打开`REF_POSITION_ABC_BANK`模型，并替换`current_from_history`宏中对旧HIST表的引用：\n\
  \n```\nhistory_rel = ref('HIST_ABC_BANK_POSITION'),\n```\n\n改为引用新的HIST表：\n\n```\n\
  history_rel = ref('HIST_ABC_BANK_POSITION_WITH_CLOSING'),\n```\n\n现在，如果你尝试运行REF模型，会收到一个错误。这是因为在已平仓头寸对应的行中，成本基础现在为零，导致了除零错误。\n\
  \n要消除该错误，并在成本基础值为零时输出零值，我们必须用`DIV0`函数替换普通除法：\n\n```sql\n, ROUND(DIV0(UNREALIZED_PROFIT,\
  \ COST_BASE), 5)*100\n  as UNREALIZED_PROFIT_PCT\n```\n\n\n\n\n\n考虑另一种可能的替代方案是将\
  \ `UNREALIZED_PROFIT_PCT` 列设为 null。虽然从 SQL 和理论角度来看这可能很有意义，但它可能会让你在 BI 工具中的展示效果不那么理想。\n\
  \n一种折中方案是在 REF 模型中将其设为 null，然后在数据 Mart 中将其改为 0。请注意，过多的这些美化规则会让你的数据 Mart 代码变得难以阅读。\n\
  \n现在，运行 REF 模型将为你提供投资组合的真实表示，关闭的头寸会显示为已关闭：\n\n| Row | ACCOUNT_CODE | SECURITY_CODE\
  \ | QUANTITY | COST_BASE | POSITION_VALUE | LOAD_TS_UTC | CLOSED | UNREALIZED_PROFIT\
  \ | UNREALIZED_PROFIT_PCT |\n|---|---|---|---|---|---|---|---|---|---|\n| 1 | ABC000123\
  \ | -1 | 100 | 4015.00000 | 4389.50000 | 2023-03-08 ... | FALSE | 374.50000 | 9.32800\
  \ |\n| 2 | ABC000123 | GCM | 0 | 0.00000 | 0.00000 | 2023-03-08 ... | TRUE | 0.00000\
  \ | 0.00000 |\n| 3 | ABC000123 | STAR | 200 | 3125.00000 | 2950.50000 | 2023-03-08\
  \ ... | FALSE | -174.50000 | -5.58400 |\n| 4 | ABC000123 | TTD | 10 | 5310.45000\
  \ | 6925.60000 | 2023-03-08 ... | FALSE | 1615.15000 | 30.41500 |\n\nFigure 14.6:\
  \ REF model for the positions with the closed positions\n\n请注意第一行中 `SECURITY_CODE\
  \ = -1` 的情况，以及它看起来有多糟糕。我们之所以有它，是因为我们（目前）还没有 Security Info 维度中 SAFE 证券的行，而我们用于移除孤儿键的代码用默认值\
  \ (-1) 替换了它。\n\n在下一节中，我们将学习如何发布可靠的数据集以及如何使用自完成功能维度来避免此问题。\n\n现在，让我们思考一下 `FACT_POSITION`，我们在数据\
  \ Mart 中发布它。\n\n我们希望它也显示已关闭的头寸，所有自有始以来的已关闭头寸吗？\n还是我们更喜欢只保留未平仓头寸？\n\n在第一种情况下，你无需做任何事，因为所有已关闭的头寸都是你在\
  \ REF 模型中现在得到的内容。我们认为这是 REF 模型适当的表现，因为在所有不希望包含它们的情况下，很容易过滤掉已关闭的头寸。\n\n例如，如果你希望你的\
  \ `FACT_POSITION` 不显示已关闭的头寸，你只需添加一个简单的 WHERE 子句，使其如下所示：\n\n```sql\nSELECT * FROM\
  \ {{ ref('REF_POSITION_ABC_BANK') }}\nWHERE NOT CLOSED\n```\n\n通过为我们的列选择适当的命名约定，我们编写的\
  \ SQL 变得非常容易理解。\n\n以这种方式，每一行都包含前一个头寸的值在 PREV_xxx 列中，如果没有前一个头寸则为 null。\n\n然后，我们必须从头寸中获取一些数据，从头寸键和头寸变化报告日期创建键：\n\
  \n```sql\n, tx_calculation as (\n    SELECT\n        {{ dbt_utils.surrogate_key(['ACCOUNT_CODE',\n\
  \            'SECURITY_CODE', 'REPORT_DATE']) }}\n            as TX_HKEY\n     \
  \   , ACCOUNT_CODE\n        , SECURITY_CODE\n        , REPORT_DATE\n```\n\n我们创建\
  \ HKEY 主要用于标识预期的业务键，并使测试和连接更容易。\n\n接下来，我们必须从头寸中获取更多列来描述交易：\n\n```sql\n, SECURITY_NAME\n\
  , EXCHANGE_CODE\n, CURRENCY_CODE\n, RECORD_SOURCE\n, LOAD_TS_UTC\n```\n\n然后，我们必须计算交易的新的指标：\n\
  \n```sql\n, COALESCE(QUANTITY - PREV_QUANTITY, QUANTITY)\n      as QUANTITY_PURCHASED\n\
  , CASE\n    WHEN QUANTITY_PURCHASED > 0 THEN 'BUY'\n    WHEN QUANTITY_PURCHASED\
  \ < 0 THEN 'SELL'\n    ELSE 'UNCHANGED'\n  END as TX_TYPE\n, CASE\n    WHEN QUANTITY_PURCHASED\
  \ > 0\n      THEN -1 * COALESCE(COST_BASE - PREV_COST_BASE,\n                  \
  \       COST_BASE)\n    WHEN QUANTITY_PURCHASED < 0\n      THEN IFF(QUANTITY = 0,\
  \ PREV_POSITION_VALUE,\n               POSITION_VALUE / QUANTITY * QUANTITY_PURCHASED)\n\
  \    ELSE 0\n  END as ESTIMATED_TX_PROCEEDS\n```\n\nQUANTITY_PURCHASED 指标是当前数量与之前数量之间的差值，除非之前为\
  \ `null`，因为我们正在开立头寸。在这种情况下，变化就是数量本身。\n\n该值应该是正确的，或者至少正确地表示我们在两次观察到的不同头寸之间发生的所有交易。\n\
  \nTX_TYPE 指标提供了关于交易方向的易于理解的语义。\n\n*ESTIMATED_TX_PROCEEDS* 指标，如其名称所示，是与交易相关的货币流量的估计值（买入为负，卖出为正）。如前所述，买入的成本应该是准确的，而卖出的收益仅是估计值（基于在卖出前头寸的最后一次变化）。\n\
  \n我们将用描述交易后头寸的指标来关闭此 CTE：\n\n```sql\n    , QUANTITY             as FINAL_QUANTITY\n\
  \    , COST_BASE            as FINAL_COST_BASE\n    , POSITION_VALUE       as FINAL_POSITION_VALUE\n\
  FROM position_with_lead as p\n)\n```\n\n最后，我们将通过按交易键对数据排序并返回来自前一个 CTE 的列来关闭模型：\n\
  \n```sql\nSELECT * FROM tx_calculation\nORDER BY ACCOUNT_CODE, SECURITY_CODE, REPORT_DATE\n\
  ```\n\n如果我们想在数据 Mart 中使用这个新的事实，并与证券信息维度一起使用，我们可能会添加一个 CTE 将其与维度连接以移除孤儿，但我们更喜欢不移除缺失键并使用自完成功能维度模式。在这种情况下，为头寸事实完成维度也会完成交易，因为所涉及的证券列表是相同的。\n\
  \n## Publishing dependable datasets\n\n交付层的角色是使我们在 REF 层构建的数据可供我们的用户访问，他们将以各种方式使用它们。\n\
  \n我们可以确定的一件事是，我们在交付层中更改数据的布局越频繁，我们的客户就越不满意，因为他们必须对我们所有的更改做出反应。\n\n意外的更改是激怒客户的另一种好方法。\n\
  \n我们应该从中吸取什么教训？\n\n### Managing data marts like APIs\n\n你在数据 Mart 中发布的表和视图是数据平台的公共\
  \ API，因此你应该像对待它们一样处理它们。\n\n以下是让客户生活更美好的基本起点：\n\n- 提供列和表的清晰且一致的命名。\n\n    例如，不要在某处称同一事物为\
  \ `PRODUCT_ID`，在另一处称其为 `PRODUCT_CODE`。始终对同一概念使用相同的术语，不要混用同义词（PRODUCT、ITEM、MERCHANDISE\
  \ 等）。\n\n- 使用一致的命名约定。\n\n    例如，以类似的方式命名所有 PK——例如 `<ENTITY>_CODE`。\n\n- 使用正确且可预测的数据类型。\n\
  \n    你会做 PK 和 FK 的数学运算吗？不会，所以你最好将它们作为文本而不是数字，即使它们看起来像数字。\n\n- 决定你想要使用的默认记录集并一致地应用它们。\n\
  \n- 合理调整你的数据 Mart 的大小。小型数据 Mart 比包含数百个表的庞大数据 Mart 更容易理解和使用，但如果你有太多数据 Mart，很难以良好的描述性方式命名它们，并且用户很难找到正确的数据\
  \ Mart。\n\n- 一旦发布事实或维度，请避免重命名它、重命名其中的列或更改数据类型。\n\n- 当你想要/需要更改 API 时，请以受控且沟通的方式进行。提供更改的时间框架，如果更改会破坏客户端，请考虑至少在过渡期内保留旧版本可用，并以新名称提供新版本。\n\
  \n为了便于你保持外部 API 不变，你可以尝试将数据 Mart 作为最终表上数据的视图交付，以便如果出于某种原因你必须更改底层表，你可以保持外部接口不变，尝试在发布数据的视图中吸收更改。\n\
  \n### What shape should you use for your data mart?\n\n不同的数据用途需要不同的数据集交付方式以实现最佳可用性。\n\
  \n例如，对于大多数 AI/ML 工作负载，提供一个包含所有有趣数据已清理并预先连接至所需粒度度的宽表是可取的，而大多数 BI 工具期望以 Kimball 风格提供数据模型——即星型模式的形状。\n\
  \n\n\n\n\n不要认为所有场景都应使用同一数据集市；相反，应该针对每个用例思考什么才是最佳解决方案。\n\n例如，如果你需要为 REST API 提供数据支持，最好提供按\
  \ API 所服务的数据进行切分的表。你应该尝试使用 *Snowflake Unistore* 新功能中的 *Hybrid Tables*（混合表）。\n\n\
  当你研究运营活动并希望分析错误情况，或当流程未按预期完成、中途停滞时，构建一些使用全外连接（full outer joins）的复合事实表可能会很有用。这样，除了常规（内）连接所能匹配到的数据之外，你还可以观察到两侧不匹配的数据。\n\
  \n如果你还记得我们在 *第3章* 中讨论的 *统一星型模式（Unified Star Schema）*，你可以利用 UNION ALL 运算符构建宽表，其中包含许多外键（FK），这些外键通过遵循数据中的关系来生成，从而可以基于那些看似不相关、但在其关系链中拥有某个共同外键的对象进行报表分析。\n\
  \n在大多数情况下，你至少会准备一些用于 BI 工具进行强力报表分析的数据集市，并提供 Kimball 星型模式。\n\n在 *第10章* 中，我们讨论了如何以敏捷方式构建星型模式，但这里先回顾一下关键要点：\n\
  \n- 你的数据集市会包含许多事实表，因为它们要为使用相同维度的多个相关报表提供数据支持。\n- 你应该提供所需的复合事实表，使用现有关系连接 REF 层中多个单独的基事实表，以便每个报表都能基于单一事实表构建。\n\
  - 提供维度和层级结构，使你的事实表没有孤立记录。接下来我们将通过自补全维度（self-completing dimensions）来实现这一点。\n- 尽量避免将度量值放入维度中，因为这会因扇出陷阱（fan\
  \ traps）而可能导致严重错误的数字。\n- 确定哪些字段（这些字段也可能在维度中可用）需要作为事实的一部分提供历史值。例如，交付时的地址，因为普通维度（SCD\
  \ 类型一）只会包含当前值，该值可能与历史值不同。\n- 决定哪些维度（也）应包含所有变更历史，并在需要使用这些 *类型二缓慢变化维度（SCDs of type\
  \ two）* 的事实中放入正确的版本外键（HDIFF 来自维度中的版本，是一个非常不错的选择）。\n\n有关此内容的更多细节，请返回 *第10章* 查看，此外关于这方面所有细枝末节的细节，也有大量已出版的书籍可供参考。\n\
  \n在下一节中，我们将学习如何构建自补全维度。\n\n最终的 CTE 通过将维度的内容与新添加的缺失条目行正确组合，构建出最终维度：\n\n```sql\ndim\
  \ as (\n    SELECT * FROM dim_base\n    UNION ALL\n    SELECT * FROM dim_missing_entries\n\
  )\nSELECT * FROM dim\n{% endmacro %}\n```\n\n最后一行返回补全后的维度内容。至此，该宏就可以使用了。\n\n## 创建自补全社会维度\n\
  \n现在，让我们使用这个宏来创建安全维度的自补全版本。\n\n你可以在数据集市中创建一个新文件，也可以用以下内容修改现有的 `DIM_SECURITY` 模型：\n\
  \n```jinja\n{{ self_completing_dimension(\n    dim_rel = ref('REF_SECURITY_INFO_ABC_BANK'),\n\
  \    dim_key_column = 'SECURITY_CODE',\n    dim_default_key_value = '-1',\n    rel_columns_to_exclude\
  \ =\n        ['SECURITY_HKEY','SECURITY_HDIFF'],\n    fact_defs = [{ 'model': 'REF_POSITION_ABC_BANK',\n\
  \                   'key': 'SECURITY_CODE'}]\n) }}\n```\n\n如宏的代码旁所解释的那样，我们只需传入包含维度数据的模型关系、主键列的名称，以及我们为补全维度而创建的默认记录的主键值。\n\
  \n`rel_columns_to_exclude` 参数是一个实用工具，可以方便地从发布的维度中移除那些在数据集中不需要的列。\n\n需要注意的是，你可以将每个可能引入孤立记录的事实定义传递给\
  \ `fact_defs` 参数。一个事实定义由事实模型名称和指向该维度的外键字段名组成。\n\n在我们的案例中，由于交易是根据持仓计算得出的，涉及的安全品种集合是相同的，因此并不需要同时传入两个事实，但这样做也无妨。\n\
  \n以下截图显示了在投资组合中引入 SAFE 持仓后，自补全社会维度的内容：\n\n| 行号 | SECURITY_CODE | SECURITY_NAME |\
  \ SECTOR_NAME | INDUSTRY_NAME | COUNTRY_CODE | EXCHANGE_CODE | RECORD_SOURCE | LOAD_TS_UTC\
  \ |\n|---:|---|---|---|---|---|---|---|---|\n| 1 | TTD | The Trading De... | Technology\
  \ | EDP Services | US | NASDAQ | SEED.ABC_Ban... | 2023-01-21 17:... |\n| 2 | STAR\
  \ | ISTAR INC | Real Estate | REIT - Diversifi... | US | NYSE | SEED.ABC_Ban...\
  \ | 2023-01-21 17:... |\n| 3 | GCM | GRAN COLOM... | Basic Materials | GOLD | CA\
  \ | TSE | SEED.ABC_Ban... | 2023-01-21 17:... |\n| 4 | -1 | Missing | Missing |\
  \ Missing | -1 | -1 | System.Default... | 2020-01-01 00:... |\n| 5 | SAFE | Missing\
  \ | Missing | Missing | -1 | -1 | System.Default... | 2020-01-01 00:... |\n\n图14.7：自补全社会维度的内容\n\
  \n如你所见，该维度现在有了一个主键为 SAFE 的条目，该行的内容与默认记录相同。\n\n这一点，加上我们之前关于多个默认记录的讨论，使你能够为报表选择合适的列值。\n\
  \n## 恢复持仓事实以保持其数据不变\n\n如果你预览了自补全维度但看不到带有 SAFE 主键的行，很可能是你忘记了将持仓事实恢复为完整状态。\n\n要修复此问题，请打开\
  \ `REF_POSITION_ABC_BANK` 模型，并将最终查询改回其原始形式，如下所示：\n\n```sql\nSELECT\n    p.*\n  ,\
  \ POSITION_VALUE - COST_BASE as UNREALIZED_PROFIT\n  , ROUND(DIV0(UNREALIZED_PROFIT,\
  \ COST_BASE), 5)*100\n      as UNREALIZED_PROFIT_PCT\nFROM position as p\n```\n\n\
  通过移除对安全维度的连接，并使用事实自身的外键，我们消除了对 REF 层的依赖，使 SAFE 外键重新出现在事实中，进而该外键也会出现在自补全维度中。\n\n\
  ## 将测试转移到持仓事实的孤立外键上\n\n最后但同样重要的是，我们必须将持仓事实与安全模型之间关系的测试移到交付层，该测试目前位于 REF 层。\n\n通过移除\
  \ REF 模型中的连接，该测试可能会失败，但我们关心的是该关系在交付层是否有效且没有孤立记录，因为我们的 BI 工具将在交付层进行等值连接。\n\n要将测试移到交付层，请先将其从\
  \ `refined.yml` 文件的 `REF_POSITION_ABC_BANK` 表部分移除。\n\n然后，将其添加到 `_portfolio.yml`\
  \ 文件中，如下所示：\n\n```yaml\n- name: FACT_POSITION\n  columns:\n    - name: SECURITY_CODE\n\
  \      description: 'The code of the security'\n      tests:\n        - relationships:\n\
  \            to: ref('DIM_SECURITY')\n            field: SECURITY_CODE\n```\n\n\
  上述代码将测试持仓事实与安全维度之间的关系是否存在孤立记录。\n\n现在，我们的持仓事实完整无缺，安全维度也已补全，所有测试都应该完美通过。\n\n## 报表中的历史——即类型二缓慢变化维度\n\
  \n大多数报表基于维度的当前值，因为企业希望看到公司当前名称、当前联系人、当前电话/电子邮件、当前产品名称——而不是下订单或签合同时（3个月或3年前）的名称。\n\
  \n到目前为止，我们所做的——从 REF 层的历史表中提取当前数据——都是为了满足这类报表需求。但是，我们存储所有变更历史的方法也使我们能够服务于那些需要查看数据在历史时刻样子的场景。\n\
  \n在我们的历史表中，我们已经拥有所见数据的所有版本，并且通过在 STG 层创建 HDIFF 列，我们也为这些版本创建了唯一键。\n\n我们的历史表高效地存储了构建更正式称为\
  \ **类型二缓慢变化维度** 所需的数据。\n\n通过从 HIST 表提取数据，并且对每个 HDIFF 只取一份副本（请记住，相同内容可能会多次出现并被存储），你可以构建一个包含实体所有版本的\
  \ SCD2 维度。\n\n要使用这样的维度，你必须根据事实日期以及特定 HKEY 的不同 HDIFF 的有效期，将正确的 HDIFF 填充到你希望连接该维度的事实中。\n\
  \n你可以使用 LAG 函数计算每个 HDIFF 的有效期，类似于我们根据持仓计算交易的方式。\n\n要填充 HDIFF，你可以从提供维度外键和某个相关日期的事实开始，然后基于主键和有效期范围在\
  \ SCD2 维度和该日期中查找对应的 HDIFF。\n\n\n\n\n\n## 常见使用场景的模式\n\n在最后一章中，我们想为你提供一个小型模式库，这些模式常用于从外部文件摄取数据，并将摄取的数据存储到我们所说的历史表中。\n\
  \n我们将从数据摄取自动化这一关键任务开始本章。我们将讨论各种替代方案及其优缺点，并为你提供我们基于经验的见解和用于在 Snowflake 中摄取数据的代码。\n\
  \n接下来，我们将扩展前面章节中介绍的用于存储实体变更历史的基本模式。我们将为你提供一组常见的存储传入数据的用例，以及处理所有这些不同需求所需的代码和条件。\n\
  \n在本章中，你将了解以下主题：\n\n- 摄取模式\n- 历史模式\n\n### 技术要求\n\n本章比前几章更具技术性，因此需要良好的 SQL 理解以及 dbt\
  \ 和 Snowflake 的工作原理知识，才能充分理解所有主题。然而，对于将要涵盖的许多主题，了解 SQL 可能就足以掌握基础知识。\n\n本章的所有代码示例均可在\
  \ GitHub 上获取，网址为 https://github.com/PacktPublishing/Data-engineering-with-dbt/tree/main/Chapter_15。\n\
  \n### 摄取模式\n\n将数据摄取到平台中仍然是构建任何数据平台的关键方面之一——没有数据，就没有数据平台。\n\n这是一个涉及面很广的主题，因为数据摄取取决于数据平台、存储服务、文件格式以及许多大大小小的细节。\n\
  \n在本章中，我们将重点讨论 Snowflake，它可以通过多种方式加载数据。然而，摄取合理数据量最有效的方式是通过文件。我们为 Snowflake 描述的概念经过一些调整后，也适用于其他平台。\n\
  \n例如，可以使用 SQL insert 语句，但其吞吐量比基于文件的摄取或从外部表读取数据（在底层是从文件读取）要低几个数量级，但这种方法也有其缺点，我们稍后会看到。\n\
  \n在本节中，我们将介绍使用 dbt 将数据摄取到 Snowflake 的一些最常见用例，以及一种可行的解决方法，使用经过验证的最佳实践代码，并且应该简单易用。\n\
  \n让我们看看将数据加载到 Snowflake 的不同方式：\n\n- **SQL INSERT**：这是你在事务数据库中熟悉的标准 SQL INSERT 命令。它适用于插入少量行，但无法扩展。\n\
  \n    dbt 使用 SQL INSERT 命令将你放在 seed/data 文件夹中的 CSV 文件中的行加载到 Snowflake 中。这限制了你可以加载的数据量。祝你好运，加载\
  \ 10K 或 100K 行……\n\n    这不是摄取任何合理数据量的可行方式。\n\n- **外部表**：在 Snowflake 中，可以定义指向外部存储服务上容器中文件夹的外部表，该表将根据提供的文件格式和字段表达式解析文件。\n\
  \n    这是一种非常灵活的访问外部数据（结构化或半结构化）的方式。Snowflake 可以利用半结构化文件中存储的架构信息，使创建变得非常简单。\n\n \
  \   使用外部表的主要缺点是，每次查询该表且未命中缓存时，必须加载、解析并最终过滤所有支持该表的文件，以回答你的查询。\n\n    可以通过基于文件/路径名称添加分区来获得一些改进，但只有在查询时对分区列进行过滤才有帮助。在基于\
  \ Delta Lake 表的特殊情况下，Snowflake 可以利用 Delta Lake 日志文件中的元数据，仅解析构成表当前状态的文件。然而，每次查询（未命中缓存时）仍然必须解析这些文件。\n\
  \n- **COPY INTO**：COPY INTO 命令是 Snowflake 中加载数据最重要的命令，因为所有高性能摄取方法都以某种方式依赖通过此命令摄取文件。\n\
  \n    你可以主动直接发出 `COPY INTO` 命令（手动或通过脚本，就像我们即将做的那样），也可以间接通过 Snowpipe 发出该命令。即使通过 Snowflake\
  \ Kafka 连接器摄取数据，最终也会写入临时文件，然后通过 `COPY INTO` 命令摄取这些文件。\n\n    使用 `COPY INTO` 的主要优点是文件只解析一次。这是因为\
  \ Snowflake 会跟踪已加载到目标表（通常称为“落地表”）中的文件，因此每次执行 `COPY INTO` 查询时，Snowflake 只会将新的或已修改的文件加载到落地表中。\n\
  \n    另一个优点是，在 `COPY INTO` 命令结束时，数据会位于普通的 Snowflake 表中，你对它发出的每个查询都可以利用微分区及相关元数据来减少查询的数据量。\n\
  \n    另一个优点是，你可以在加载数据的同时转换数据，使用几乎所有正常的 SQL 表达式和函数，尽管我们不会这样做。\n\n    最后一点，考虑到使用 `COPY\
  \ INTO`，你可以将 Snowflake 表中的数据写入兼容格式的文件中，从而允许你将数据回馈到数据湖中。\n\n    创建一个 SQL 表达式来生成外部表的列所需的工作量，与编写一个\
  \ SELECT 语句作为 `COPY INTO` 命令的一部分将数据加载到落地表相比，是差不多的。\n\n    考虑到工作量相似，我们通常更倾向于使用落地表方法，这样数据只解析一次，然后立即可以以最佳性能进行查询。这对于小表来说差别不大，但当表中有数百万行或文件中有数\
  \ GB 数据时，差别就很明显了。\n\n现在我们已经讨论了摄取数据的可能方式，让我们看看我们将介绍哪些技术来加载不同类型的数据：\n\n- 1. 摄取**结构化数据**，通常通过加载\
  \ CSV 文件完成。\n\n    我们将在脚本中使用 `COPY INTO` 命令摄取数据，该命令将利用文件中每列的位置。列名和数据类型将由落地表的 `CREATE\
  \ TABLE` 语句指定。\n\n    在从 Delta Lake 读取的特殊情况下，对于中小型表，我们会考虑外部表方法，因为性能损失会明显减少，因为 Snowflake\
  \ 只会解析构成当前表的 Parquet 文件。\n\n- 2. 摄取 Snowflake 支持的文件格式中的**半结构化数据**，例如 JSON、Parquet、AVRO\
  \ 和 ORC。\n\n    在这种情况下，我们将使用落地表方法，但我们将展示 Snowflake 如何利用某些文件格式中嵌入的架构信息来简化我们的工作，几乎不用输入任何内容。\n\
  \n你可以猜到，文件格式封装了读取阶段中文件所需的所有信息，并且是可选的。如果我们将其与阶段一起提供，那么当我们从阶段读取数据时，就不需要提供文件格式，阶段中设置的格式就足够了。\n\
  \n**目录表**功能最近被添加到 Snowflake 阶段中，使我们能够像列出目录一样查询暂存文件的元数据。\n\n要将目录服务添加到阶段，请将以下内容添加到阶段定义中：\n\
  \n```\nDIRECTORY = ( ENABLE = TRUE\n             REFRESH_ON_CREATE = TRUE )\n```\n\
  \n一旦你将目录表添加到阶段，你可以使用以下语法在阶段名称上使用 DIRECTORY 函数来查询它：\n\n```\nSELECT * FROM DIRECTORY(@mystage)\n\
  WHERE SIZE > 100000;\n```\n\n前面的代码使得查询文件的元数据字段成为可能，例如 FILE_URL、LAST_MODIFIED 或 RELATIVE_PATH。\n\
  \n当你使用目录表功能时，你必须刷新文件列表，要么通过向 Snowflake 提供底层云提供商的集成，要么在查询之前手动发出请求。\n\n在规划文件容器时，请考虑当你在一个阶段中有许多文件时，数量达到数十万或数百万，文件访问操作（包括过滤要摄取的文件和刷新目录）会变得更慢。\n\
  \n在我们的摄取自动化中，我们不需要使用目录表，因为我们依赖于 Snowflake 跟踪已被 COPY INTO 命令处理并加载到落地表中的文件的能力。\n\n\
  ### 授权访问你的文件\n\n既然你明白了阶段描述了文件的位置，我们还需要提供访问这些文件的授权信息。\n\n在 Snowflake 中，可以通过多种方式实现这一点，具体取决于文件所在的云提供商，包括在创建阶段或加载/卸载数据时提供凭据。\n\
  \n我们更倾向于使用**存储集成**，这是一个 Snowflake 对象，存储了外部云提供商授予的身份和授权信息，以及一些元数据，可用于创建多个阶段或加载/卸载操作，而无需了解凭据。这既提供了额外的安全性，又易于使用。\n\
  \n\n\n\n除非你有特殊安全需求，我们建议为每个存储桶/存储账户创建一个存储集成，按源系统用顶级文件夹/容器进行划分，然后将阶段与能访问某一特定系统表的文件的顶级文件夹/容器配对。在系统级文件夹下，为该系统中的每个表、主题或消息类型创建一个文件夹，是一个良好的初始组织结构。\n\
  \n如果某些表需要特殊安全保护，我们建议将其数据托管在不同的存储桶/账户中，并为每一组可以访问这些数据的人员创建单独的集成和阶段。这样你就可以为其角色提供集成（如果他们必须管理阶段）或阶段的使用权限来读取文件。\n\
  \n创建存储集成的过程因云提供商而异，因此我们建议你在 Snowflake 文档中的 CREATE STORAGE INTEGRATION 命令页面上查找适用于你的云提供商的流程，网址为\
  \ https://docs.snowflake.com/en。\n\n## 如何解析你的文件\n\n一旦我们知道文件在哪里并被授权读取，我们仍需告诉 Snowflake\
  \ 如何读取它们。\n\n对于许多半结构化格式，如 Parquet、AVRO 和 ORC，由于这些格式既有内容的模式描述，又有明确的读写内容方式，所以选项很少。\n\
  \n对于 CSV 以及较小程度上的 JSON 格式，我们的可变性稍多一些，在创建格式时，提供所需选项以便 Snowflake 能正确读取并表示数据非常重要。\n\
  \n对于 Snowflake 支持的每种文件类型，都有一个由 CREATE FILE FORMAT 命令的默认值隐式定义的默认文件格式。因此，要定义一种格式，你只需为那些与默认值不一致的选项提供值。\n\
  \n通常需要指定的选项包括要跳过的标题行数、字段分隔符、文件编码、转义字符以及日期和时间格式。\n\n以下是一个文件格式定义示例，其中定义了一些基本选项：\n\n\
  ```sql\nCREATE FILE FORMAT IF NOT EXISTS file_format_name\n  TYPE = 'csv'\n  FIELD_DELIMITER\
  \ = '|'                -- default ','\n  SKIP_HEADER = 1                      --\
  \ default 0\n  ENCODING = 'ISO-8859-1'              -- default 'UTF8'\n  FIELD_OPTIONALLY_ENCLOSED_BY\
  \ = '\"'  -- default NONE\n;\n```\n\n我们认为，始终至少指定这些常见选项是一种良好实践，即使它们的值与默认值一致。\n\n\
  明确定义这些选项可以让所有相关方更容易了解实际值，即使他们不记得 Snowflake 的默认值，也更容易更改它们，或为需要不同格式的文件创建不同的文件格式。\n\
  \n## 从文件加载数据\n\n一旦你能访问文件并解析它们，最后但最重要的一步是理解文件中的数据组织方式，以便你能读取数据，以及如果你想将数据加载到落地表中，还需要理解你想如何组织数据。\n\
  \n文件或表中的字段组织方式称为文件/表的**模式**，它包括列的名称、类型以及可能的组织方式（嵌套）。 “schema”一词在数据领域被过度使用，但这是最常用的含义。\n\
  \n让我们根据数据类型快速概述一下模式问题：\n\n- **CSV 文件中的结构化数据**：在这种情况下，模式在设计上是扁平化的，字段在每一行中以相同顺序出现，因此我们必须为每个字段提供名称和数据类型。\n\
  \n- **半结构化数据**：半结构化数据的两个主要区别在于，数据可以嵌套到对象或数组中，并且实体不具有相同的固定模式。\n\n    在 Snowflake\
  \ 中，你有三种替代方式来摄取半结构化数据：将所有数据加载到一个 VARIANT 列中（由 Snowflake 解析和推断结构），在加载时显式转换数据以提供所需组织，以及能够自动推断某些格式（Parquet、AVRO\
  \ 和 ORC）的列定义。后者在撰写本文时处于预览阶段。\n\n- **非结构化数据**：这些数据无法受益于基于列的模式，例如图像、视频、社交媒体提要或需要在数据库之外进行基于应用程序的处理才能传递其信息的格式。\n\
  \n    Snowflake 可以通过阶段访问内部或外部存储中的文件，然后存储并提供指向文件的 URL 和元数据以提供共享访问。讨论非结构化数据超出了我们的范围。\n\
  \n将数据（无论是结构化还是半结构化）加载到表中的过程可以分为两步：\n\n1. 创建落地表以保存加载的数据：\n\n    ```sql\n    CREATE\
  \ TABLE my_table (the_only_column VARIANT);\n    ```\n\n    这样做非常简单，但我们将模式决策委托给了\
  \ Snowflake，并且在读取数据时将不得不处理这些问题。\n\n    相反，我们更喜欢创建一张模式与我们希望的数据组织方式匹配的表，包括加载过程中的元数据。这样，当我们要读取数据时，就没有未解决的问题需要处理。\n\
  \n2. 使用 COPY 命令将数据加载到表中：\n\n    ```sql\n    COPY INTO my_table ...\n        FROM\
  \ @my_stage      -- stage can include format\n        PATTERN = '.*xxx.*.json'\n\
  \    ```\n\n    通过这条基本命令，我们指示 Snowflake 将阶段中所有名称匹配该模式的新文件加载到表中。\n\n当加载 CSV 时，字段必须按正确顺序排列，但对于半结构化格式，如果文件和表具有相同的模式，你可以使用\
  \ COPY 命令的 MATCH_BY_COLUMN_NAME 选项。\n\n然而，通常情况下，我们将 FROM @my_stage 子句替换为 FROM (SELECT\
  \ ... FROM @my_stage) 子句，以便在从文件加载数据时转换数据并添加可用元数据。\n\n在 Snowflake 中加载结构化和半结构化数据的工作方式类似，但不同之处在于如何构建\
  \ SELECT 语句以在加载时转换数据。\n\n让我们看看如何处理 CSV 和半结构化数据的模式需求。\n\n### 提供模式以加载 CSV 数据\n\n对于\
  \ CSV 文件，不需要提供太多信息。由于模式是扁平的，我们只需提供列的名称和数据类型，并考虑顺序。\n\n这可以通过一条 CREATE TABLE 语句一次完成，该语句按与要加载到表中的\
  \ CSV 文件相同的顺序列出列。\n\n一旦我们有了一张与文件中列顺序匹配的落地表，我们就可以用一种非常简单的方式摄取数据，如下所示：\n\n```sql\n\
  COPY INTO {{ full_table_name }}\nFROM (\n    SELECT\n        $1, $2, ... $n,   \
  \   -- one for each column in file\n        METADATA$FILENAME as FROM_FILE,\n  \
  \      METADATA$FILE_ROW_NUMBER as FILE_ROW_NUMBER,\n        '{{ run_started_at\
  \ }}' as INGESTION_TS_UTC\n    FROM @{{ full_stage_name }}/\n)\nPATTERN = '{{file_pattern}}'\n\
  ```\n\n前面的代码来自用于加载 CSV 文件的宏，我们将在后面讨论。\n\n请注意，我们需要从文件中读取的唯一信息是列数，因为我们可以通过列号引用它们。数据类型在落地表中设置，该表通过\
  \ CREATE TABLE 命令创建一次，并以正确的顺序引用文件列。\n\n### 推断半结构化数据的模式\n\n如果你认为计算 CSV 文件中有多少字段很简单，那么你仍然需要了解\
  \ Snowflake 提供的最新函数来管理半结构化数据。\n\nINFER_SCHEMA 和 GENERATE_COLUMN_DESCRIPTION 函数共同允许你将\
  \ Snowflake 指向一个文件（Parquet、Avro 或 ORC 格式），并为你完成生成落地表和 SELECT 命令的大部分或全部工作。\n\n从阶段中受支持文件读取元数据的命令如下所示：\n\
  \n```sql\nINFER_SCHEMA(\n    LOCATION => '@mystage/path/folder/'\n  , FILE_FORMAT\
  \ => 'my_parquet_format'\n  , FILES => '<file_name.parquet>'[, …]\n)\n```\n\nFILE_FORMAT\
  \ 参数是必需的，我们建议使用 FILES 参数将采样限制为一个或几个已知包含良好有效负载数据的文件。请特别注意支持文件，例如 Delta Lake 的检查点文件，它们可能包含用于元数据或工具的其他列。\n\
  \nLOCATION 和 FILES 中的名称必须共同生成文件的完整路径，因此将 LOCATION 设置为文件所在的文件夹是一个好做法。\n\n你可以使用 LIST\
  \ 命令查看阶段中文件夹内文件的路径：\n\n```sql\nlist '@mystage/path/folder/'\n    PATTERN = '.*[.]parquet';\n\
  ```\n\n通过将 INFER_SCHEMA 函数指向一组文件，你将获得源文件中出现的每个列的以下信息：COLUMN_NAME、TYPE、NULLABLE、EXPRESSION、FILENAMES\
  \ 和 ORDER_ID。\n\n你可以通过将 INFER_SCHEMA 函数包装在 table() 函数中并从中选择来查询其输出，如以下示例所示：\n\n```sql\n\
  SELECT *\nFROM table( INFER_SCHEMA(…) )\n```\n\n\n\n这会生成如下所示的输出（第一行为列标题）：\n\n| 列名\
  \ | 类型 | 可空 | 表达式 | 文件名 | ORDER_ID |\n|---|---|---|---|---|---|\n| continent | TEXT\
  \ | True | $1:continent::TEXT | xxx.parquet | 0 |\n| country | VARIANT | True |\
  \ $1:country::VARIANT | xxx.parquet | 1 |\n\n请注意，EXPRESSION 列提供了从解析后的 Parquet 文件中选择列所用的代码，这对于定义外部表以及在\
  \ COPY INTO 命令中使用的 SELECT 查询都很有用。\n\n您可以分别传入 table、external_table 或 view 字符串值，使用\
  \ GENERATE_COLUMN_DESCRIPTION 函数来为三种使用场景生成有用的输出：创建表、创建外部表和创建视图。\n\n以下代码展示了如何使用 GENERATE_COLUMN_DESCRIPTION\
  \ 函数，输出创建表所需的列和数据类型列表：\n\n```\nSELECT GENERATE_COLUMN_DESCRIPTION\n       ( ARRAY_AGG(OBJECT_CONSTRUCT(*)),\
  \ 'table')\nFROM table( INFER_SCHEMA(...) )\n```\n\n结果类似于下面这样：\n\n```\n\"country\"\
  \ VARIANT,\n\"continent\" TEXT\n```\n\n为了从推理出的模式中生成所需的代码，我们更倾向于使用我们可以控制的普通 SQL。\n\
  \n下面的 SELECT 查询会为创建表生成类似的列定义：\n\n```\nSELECT\n    COLUMN_NAME || ' ' || type ||\
  \ ',' as sql_create_table\nFROM table( INFER_SCHEMA(...) )\n```\n\n另一方面，下面的查询会为读取数据的\
  \ SELECT 查询生成列：\n\n```\nSELECT EXPRESSION as sql_select\nFROM table( INFER_SCHEMA(...)\
  \ )\n```\n\n结果如下：\n\n```\n$1:country::VARIANT,\n$1:continent::TEXT\n```\n\n下面的 SELECT\
  \ 查询会为外部表生成列定义：\n\n```\nSELECT\n    COLUMN_NAME || ' ' || TYPE\n           || '\
  \ as (' || EXPRESSION || ')' as sql_ext_table\nFROM table( INFER_SCHEMA(...) )\n\
  ```\n\n结果如下所示：\n\n```\ncountry VARIANT AS ($1:country::VARIANT),\ncontinent TEXT\
  \ AS ($1:continent::TEXT)\n```\n\n在本节中，我们看到了让 Snowflake 以现代半结构化格式对数据文件进行采样，并根据文件中存储的定义生成数据的\
  \ schema 定义是多么容易。\n\n在接下来的几个部分中，我们将学习如何使用这些代码片段来创建外部表，或将数据摄入到着陆表中。\n\n## 外部表\n\n\
  我们之前已经暗示过，使用外部表并不是我们最喜欢的选项，但它是一种将数据摄入 Snowflake 的可能方式。那么，为什么不直接从存储中查询数据来加载呢？\n\n\
  简短的答案是性能、成本，以及需要处理重复数据。\n\n主要原因是，读取外部表时，除非你主动按文件名/路径过滤文件，否则每次查询未命中缓存时都需要解析每个文件。这既慢又昂贵（你需要为耗时付费）。\n\
  \n第二个原因是，当你读取一个文件夹中的所有文件时（该文件夹中已经积累了数天甚至数年的全量或增量导出），每次加载你都会得到大量旧版本，这些旧版本在主键上是重复的\
  \ —— 同样，除非你主动按文件名/路径过滤。\n\n第三个原因是，正如我们将看到的，创建外部表的复杂程度与将数据摄入到着陆表相当，但却没有那些好处。\n\n\
  最后一个原因是，除非你配置底层文件系统以通知 Snowflake 每个文件的变化，否则你必须在查询外部表之前刷新它，以便它检查表定义下现在有哪些文件可用。在 dbt\
  \ 中，在查询前执行这个操作非常容易，所以这不是一个大问题，但这确实是我们需要多做的另一件事。\n\n刷新外部表底层文件的代码如下：\n\n```\nALTER\
  \ EXTERNAL TABLE my_ext_table REFRESH;\n```\n\n简而言之，对于只加载几百万行的小表来说，这些问题都不是问题。但对于任何有规模、有速度的表来说，除非你采用增量加载和严格过滤，否则这将是一个缓慢的死刑判决。\n\
  \n唯一的例外是你的数据以 Delta Lake 格式存储。在这种情况下，Snowflake 可以读取并利用该格式，只解析构成表当前状态的 Parquet 文件，从而让你查询源表的最新快照。\n\
  \n每次查询表时，你仍然需要等待并为解析所需的 Parquet 文件付费，但至少你无需过滤和管理增量加载。\n\n要创建外部表，你需要先创建 stage 和文件格式。然后，你可以使用类似下面的代码创建外部表：\n\
  \n```\nCREATE EXTERNAL TABLE my_ext_table\n(\n  file_part as (<expression on metadata$filename>)\n\
  \  col1 varchar AS (value:col1::varchar)\n  ...\n)\nPARTITION BY (file_part)\nLOCATION=@mystage/daily/\
  \        -- @stage/path\nFILE_FORMAT = my_file_format\nAUTO_REFRESH = FALSE;\n```\n\
  \n在前面的伪代码中，你定义外部表中的虚拟列（VIRTUAL columns）的方式与普通表略有不同。\n\n在虚拟列的名称和类型之后，我们需要提供一个表达式来从底层文件中提取该列。该表达式必须基于\
  \ VALUE 列（VARIANT 类型），即当你让 Snowflake 解析半结构化数据时获得的列。\n\n要设置 stage 和文件格式，你可以使用 setup_xxx\
  \ 文件，如下一节关于着陆表的描述，因为它们的设置方式相同。\n\n在上一节中，我们提供了一个 SQL 表达式，用于从 INFER_SCHEMA 生成虚拟列的定义。下面的代码片段使用来自\
  \ INFER_SCHEMA 函数的相同信息创建了一个外部表：\n\n```\nCREATE EXTERNAL TABLE my_ext_table\n  USING\
  \ TEMPLATE (\n    SELECT ARRAY_AGG(OBJECT_CONSTRUCT(*))\n      FROM TABLE(\n   \
  \     INFER_SCHEMA(\n          LOCATION=> '@mystage',\n          FILE_FORMAT=>'my_file_format'\n\
  \        )\n      )\n  )\n```\n\n虽然这对于临时的数据读取或探索工作来说是一个非常方便的表创建方式，但这不是创建长期外部表以作为\
  \ ETL 基础的最稳定方式，因为列将取决于 stage 中当前的文件。\n\n因此，我们更倾向于运行上一节中的 SQL，并存储生成的 CREATE TABLE\
  \ 语句，以便在需要时随时重现。\n\n外部表的一个合理使用场景是底层数据托管在 DELTA LAKE 格式中。\n\n为了指示 Snowflake 使用 Delta\
  \ 格式，请在创建外部表的命令中添加 TABLE_FORMAT = DELTA，如下所示：\n\n```\nCREATE EXTERNAL TABLE my_ext_table\n\
  \    ...\n    TABLE_FORMAT = DELTA;\n```\n\n对于这种表，Snowflake 将查找并使用日志文件来确定需要解析哪些\
  \ Parquet 文件来服务查询。\n\n## 着陆表\n\n最后，我们来到了着陆表，这是我们将数据加载到 Snowflake 的首选方式，因为它们以最少的努力提供了最大的好处。\n\
  \n这种方法适用于大表和高吞吐量数据，并且可以很好地扩展。\n\n在前面几节中，我们看到了加载数据需要遵循三个步骤：\n\n- 设置数据库对象，例如 stage、文件格式和\
  \ schema。\n- 创建着陆表以保存加载的数据。\n- 编写 COPY INTO 命令，将数据加载到着陆表中。\n\n在本节中，我们将利用前面几节的描述，向你呈现一套观点鲜明的宏集合，用于自动化创建和加载你的着陆表，这套宏易于理解、健壮且维护成本低。\n\
  \n我们将展示的用于自动化摄入的代码由宏组成，因此包含必要代码的文件必须放在 macros 文件夹下。\n\n通常，我们会创建一个 ingestion_lib\
  \ 文件夹来存放实现通用模式和支持函数的宏，以及第二个 ingestion_code 文件夹，其中包含每个源系统的一个子文件夹，用于设置特定系统对象和摄入该系统各个表的代码。\n\
  \n在深入代码之前，先说明一下加载频率：在 Snowflake 中加载数据本质上是一个批量过程，使用 Snowpipe 也不例外。\n\n好在这是一个快速过程，可以在几秒内摄入大量数据，因此可以通过微批次实现近实时的加载。这是因为你可以以短间隔（低至分钟级）在着陆表上运行\
  \ COPY INTO 命令。\n\n### 为着陆表和外部表设置对象\n\n首先，我们希望设置一个名为 _setup_XXX.sql 的文件，它封装了从一个源系统摄入时所需通用对象的命名和创建。\n\
  \n我们会为每个需要摄入的源系统创建一个设置文件，因为这通常是一个需要不同文件格式/stage 的领域，或者我们希望将其分开放在不同的 schema 中。当然，具体情况可能有所不同。\n\
  \n_setup_XXX.sql 文件的高级布局如下：\n\n- 工具宏，用于生成并最终运行设置所需的所有 SQL\n- 获取宏，用于定义并提供对象的名称\n\
  - 创建宏，用于生成每个所需对象的 SQL\n\n让我们更详细地描述文件中包含的宏。\n\n我们以一个辅助宏开始该文件，该宏允许我们生成运行所有设置所需的全部\
  \ SQL：\n\n```\n{% macro setup_XXX_sql() %}\n  {{ create_XXX_ingestion_schema_sql()\
  \ }}\n  {{ create_XXX_ingestion__ff_sql() }}\n  {{ create_XXX_ingestion__stage_sql()\
  \ }}\n{%- endmacro %}\n```\n\n请注意，我们为所有这些宏命名时都以 _sql 结尾，因为它们只是生成所需的 SQL 而不运行它。setup_XXX\
  \ 宏调用了三个单独的宏，它们为我们所需的每个设置元素生成 SQL。\n\n要运行 SQL，我们必须将 _sql 宏的结果传递给 run_query 宏：\n\n\
  ```\n{% macro run_setup_XXX() %}\n  {{ log('**  Setting up the LANDING / EXTERNAL\
  \ tables,\n        schema, FF and STAGE for XXX system **', true) }}\n```\n\n\n\n\
  \n```jinja\n{% macro run_setup_XXX() %}\n{% do run_query(setup_XXX_sql()) %}\n{%-\
  \ endmacro %}\n```\n\n你可以添加一个类似这样的辅助宏，以便在不加载表中的数据的情况下运行设置。要运行它，请使用 `dbt run-operation\
  \ run_setup_XXX`。这也是 `load_XXX_...` 宏中的第一次调用，该宏运行所有摄取操作。\n\n接下来，我们有定义我们为摄取和落地表创建的对象名称和位置（数据库和模式）的宏。\n\
  \n第一个宏，如图所示，定义了对象的数据库和落地表：\n\n```jinja\n/* DEFINE Names */\n{% macro get_XXX_db_name()\
  \ %}\n  {% do return( target.database ) %}\n{%- endmacro %}\n```\n\n通常，我们返回 `target.database`\
  \ 以使用运行代码的环境相同的数据库，但也可以返回一个固定名称，以便我们始终使用该数据库。在这种情况下，你的所有环境都将依赖于相同的表（这对增量演进是不利的），并且你需要向在所有环境中使用的角色提供对该数据库的访问权限。\n\
  \n第二个宏，如图所示，定义了对象和落地表的模式名称：\n\n```jinja\n{% macro get_XXX_schema_name() %}\n  {%\
  \ do return( 'LAND_XXX' ) %}\n{%- endmacro %}\n```\n\n我们通常返回一个固定字符串，主要是为了简单起见，但你可以使用变量，以便在此处和我们将用于从落地表读取的源定义中使用相同的定义。\n\
  \n以下宏生成文件格式的完全限定名称：\n\n```jinja\n{% macro get_XXX_ff_name() %}\n  {% do return(\
  \ get_XXX_db_name()\n             ~ '.' ~ get_XXX_schema_name()\n             ~\
  \ '.XXX__FF' ) %}\n{%- endmacro %}\n```\n\n在大多数情况下，对于一个源，一个文件格式就足够了，因为来自一个源的数据通常以一种方式导出，但如果需要，你可以创建更多名称。\n\
  \n最后一个命名宏生成阶段的完全限定名称：\n\n```jinja\n{% macro get_XXX_stage_name() %}\n  {% do return(\
  \ get_XXX_db_name()\n             ~ '.' ~ get_XXX_schema_name()\n             ~\
  \ '.XXX__STAGE' ) %}\n{%- endmacro %}\n```\n\n通常，对于一个源系统，一个阶段和一个名称就足够了。\n\n文件的最后一部分包含创建要执行的\
  \ SQL 的宏。\n\n一个重要点是，这些宏必须生成幂等的 SQL 代码，可以每天运行，而对象存在或不存在都不会产生错误，并且如果对象存在则不会更改现有定义。\n\
  \n第一个宏创建用于保存对象和落地表的模式：\n\n```jinja\n{% macro create_XXX_schema_sql() %}\nCREATE\
  \ SCHEMA IF NOT EXISTS\n    {{ get_XXX_db_name() }}.{{ get_XXX_schema_name() }}\n\
  COMMENT = 'The Landing Schema for XXX data.';\n{%- endmacro %}\n```\n\n它只是使用宏返回的数据库和模式名称创建模式。\n\
  \n第二个宏创建文件格式：\n\n```jinja\n{% macro create_XXX_ff_sql() %}\nCREATE FILE FORMAT IF\
  \ NOT EXISTS {{ get_XXX_ff_name() }}\n    TYPE = 'CSV'\n    FIELD_DELIMITER = ','\n\
  \    SKIP_HEADER = 1\n    FIELD_OPTIONALLY_ENCLOSED_BY = '\"'\n    ESCAPE = '\\\\\
  '\n    -- ENCODING = 'ISO-8859-1' -- For nordic languages\n;\n{%- endmacro %}\n\
  ```\n\n此宏为 CSV 文件创建文件格式，因为需要提供更多参数，但对于其他格式，创建方式类似，只是更短。\n\n在此示例中，我们选择了一些最常见的选项，通常需要指定。特别提到的是\
  \ UTF-8 编码是默认值。如果你使用的文件编码与 UTF8 不同，则需要指定编码。\n\n使用 Parquet、Avro 或 ORC 等格式可以消除大多数这些格式问题。\n\
  \n我们需要的第三个宏创建用于访问文件的阶段：\n\n```jinja\n{% macro create_XXX_stage_sql() %}\nCREATE\
  \ STAGE IF NOT EXISTS {{ get_XXX_stage_name() }}\nSTORAGE_INTEGRATION = <STORAGE_INTEGRATION_NAME>\n\
  URL = 'azure://strg_account.blob.core.windows.net/XYZ-container/XXXpath/'\nFILE_FORMAT\
  \ = {{ get_XXX_ff_name() }};\n{%- endmacro %}\n```\n\n此宏使用存储集成创建阶段，该集成封装了 Snowflake\
  \ 与包含文件的平台之间的授权。\n\n在此示例中，我们提供了一个基于 Azure 的 URL，指向 strg_account 存储账户中名为 XYZ-container\
  \ 的容器中的 XXXpath 路径。\n\n我们还提供了一个文件格式，以便在大多数情况下（外部表除外）从阶段读取数据时默认使用。\n\n此第一个设置文件可以被认为对于基于外部表和落地表的摄取创建很有用，因为模式、文件格式和阶段可以共享。\n"
- "## 从 CSV 文件加载\n\n现在我们已经设置了摄取数据集所需的<|message|>\n```jinja\n{% macro load_<table_name>(\n\
  \    db_name = get_XXX_ingestion_db_name(),\n    schema_name = get_XXX_ingestion_schema_name(),\n\
  \    stage_name = get_XXX_ingestion_stage_name(),\n    format_name = None,\n   \
  \ table_name = 'YYYYYY',\n    pattern = '.*YYYYYY*[.]csv',\n    field_count = 12\n\
  ) %}\n{% set full_table_name =\n        db_name ~ '.' ~ schema_name ~ '.' ~ table_name\
  \ %}\n{% do run_query(X_Y__create_table_sql(full_table_name)) %}\n{% do run_query(ingest_into_landing_sql(\n\
  \        full_table_name,\n        field_count = field_count,\n        file_pattern\
  \ = pattern,\n        full_stage_name = stage_name,\n        full_format_name =\
  \ format_name\n    )) %}\n{%- endmacro %}\n```\n\n首先要注意的是，我们将主宏命名为 `load`，加上要摄取的表名。\n\
  \n然后，我们使用参数声明将它们设置为使用设置文件中定义的 getter 或通过提供特定于此表的值。\n\n它们是表的名称，将是落地表的名称，用于从阶段加载文件的模式，以及\
  \ CSV 文件中的列数。\n\n请注意，我们在这里不需要列名，因为我们在 `CREATE TABLE` 宏中定义它们。\n\n要选择要加载的文件，你可以提供一个简单的正则表达式；Snowflake\
  \ 只会加载尚未在 `COPY INTO` 命令引用的表中加载的文件，或自加载以来被修改过的文件。\n\n然后，我们必须构建落地表的完全限定名称，并使用它调用创建表特定宏，将结果传递给\
  \ `run_query()` 函数以执行生成的 SQL 代码。\n\n请注意，出于简洁考虑，我们已从宏中删除了日志记录指令。\n\n最后一次操作通过传递在主宏声明中为方便使用而设置的参数来调用\
  \ `ingest_into_landing_sql` 库宏。\n\n创建表宏非常简单，并且做其名称所暗示的事情：\n\n```sql\n{% macro X_Y__create_table_sql(full_table_name)\
  \ %}\nCREATE TRANSIENT TABLE IF NOT EXISTS {{ full_table_name }}\n(\n        --\
  \ Add declaration for table columns\n        -- column type [[NOT] NULL],\n    \
  \    YYY_CODE string NOT NULL,\n        YYY_NAME string NULL,\n\n        -- metadata\n\
  \        FROM_FILE string,\n        FILE_ROW_NUMBER integer,\n```\n\n\n\n\n```sql\n\
  INGESTION_TS_UTC TIMESTAMP_NTZ(9)\n)\nCOMMENT = '...';\n{%- endmacro %}\n```\n\n\
  如你所见，这里没什么好说的，因为该宏只是封装了一个普通的 CREATE TABLE SQL 命令。\n\n有趣的一点是，你应该在表的初始部分声明 CSV 中存在的所有列，将三个元数据字段放在最后，因为它们是由摄取宏在最后三个位置自动创建的。\n\
  \n作为说明，你可以定义字段的可空性，默认是可空的。除非你想要一个非常严格且不灵活的加载设置，我们建议将所有列都设为可空，并通过你在读取落地表的源上定义的测试来检查你希望设为非空的列。\n\
  \n最后，让我们来看看 `ingest_into_landing_sql` 库宏的实现，它实现了 COPY INTO 命令的调用：\n\n```sql\n{%\
  \ macro ingest_into_landing_sql(\n    full_table_name,\n    field_count,\n    file_pattern,\n\
  \    full_stage_name,\n    full_format_name\n) %}\nBEGIN TRANSACTION;\nCOPY INTO\
  \ {{ full_table_name }}\nFROM (\n    SELECT\n    {% for i in range(1, field_count+1)\
  \ %}${{i}},{% endfor %}\n\n    METADATA$FILENAME as FROM_FILE,\n    METADATA$FILE_ROW_NUMBER\
  \ as FILE_ROW_NUMBER,\n    '{{ run_started_at }}' as INGESTION_TS_UTC\n    FROM\
  \ @{{ full_stage_name }}/\n)\nPATTERN = '{{ file_pattern }}'\n{%- if full_format_name\
  \ %}\nFILE_FORMAT = (FORMAT_NAME = '{{ full_format_name }}')\n{%- endif %}\n;\n\
  COMMIT;\n{%- endmacro %}\n```\n\n如你所见，摄取本身非常简单——它涉及在事务中调用 COPY INTO 命令并传递落地表、stage、文件模式以及最终用于覆盖\
  \ stage 的文件格式的正确名称。\n\nCSV 摄取的宏会生成 $1、$2... 位置列名来加载 CSV 的负载，然后添加元数据列：文件名、文件中的行号以及加载时间（我们开始\
  \ dbt 运行的时间）。\n"
- "## 从半结构化文件加载\n\n摄取半结构化文件的工作方式与摄取 CSV 文件几乎相同，唯一的区别是，与其仅使用位置列的列表（$1, ... $n），我们需要为要读取的每个列提供一个表达式。\n\
  \n该表达式必须提供半结构化文件模式中信息的路径，并且还要将表达式转换为所需的 SQL 类型。\n\n我们之前已经看到如何使用 INFER_SCHEMA 函数获取读取半结构化文件数据的表达式。\n\
  \n考虑到与 CSV 摄取的唯一区别是需要提供读取字段的表达式，我们的宏中的更改如下：\n\n- 用字段表达式的定义替换字段数量\n- 使用字段定义而不是生成位置列名\n\
  \n让我们来看一下文件中以我们要摄取的表命名的两个宏，从加载宏开始：\n\n宏声明与 CSV 的一样，但没有字段数量。现在，我们需要提供读取字段的完整表达式，而不仅仅是指定它们的数量：\n\
  \n```sql\n{% macro load_ZZZ(\n    db_name = get_XXX_ingestion_db_name(),\n    schema_name\
  \ = get_XXX_ingestion_schema_name(),\n    stage_name = get_XXX_ingestion_stage_name(),\n\
  \    format_name = None,\n    table_name = 'ZZZ',\n    pattern = '.*ZZZ[.]parquet'\n\
  ) %}\n```\n\n完整表名的创建以及对创建落地表的宏的调用与 CSV 摄取相同：\n\n```sql\n{% set full_table_name =\n\
  \        db_name ~ '.' ~ schema_name ~ '.' ~ table_name %}\n\n{% do run_query(X_Z__create_table_sql(full_table_name))\
  \ %}\n{% set field_expressions %}\n    $1 as src_data,\n    $1:ZZZ_CODE::string\
  \ as ZZZ_CODE,\n    $1:ZZZ_NAME::string as ZZZ_NAME,\n    $1:ZZZ_VALUE::double as\
  \ ZZZ_VALUE\n{% endset %}\n```\n\n接下来，我们使用 set 块创建了一个变量，其中包含读取半结构化数据字段的表达式。请注意，你可以自己编写它，也可以由\
  \ INFER_SCHEMA 和 GENERATE_COLUMN_DESCRIPTION 函数或一些 SQL 生成，就像我们在本章前一节中展示的那样。\n\n\
  我们最后通过调用 `ingest_semi_structured_into_landing_sql` 宏并将字段表达式作为字段数量的替代传递来完成：\n\n```sql\n\
  {% do run_query(ingest_semi_structured_into_landing_sql(\n            full_table_name,\n\
  \            field_expressions,\n            file_pattern = pattern,\n         \
  \   full_stage_name = stage_name,\n            full_format_name = format_name\n\
  \        ) ) %}\n{%- endmacro %}\n```\n\n第二个宏是创建落地表的宏——它与 CSV 情况相同，但请记住，现在你必须使用与\
  \ `field_expressions` 变量中相同的名称和数据类型来定义列。\n\n唯一的特点是，如果你想以 variant 形式存储源数据，就像我们在本示例中所做的那样，将\
  \ $1 作为 src_data 作为第一个表达式。然后，你需要为该列创建第一个字段，并使用 variant 数据类型：\n\n```sql\n-- Add declaration\
  \ for table columns\n    SRC_DATA variant,\n    ZZZ_CODE string NOT NULL,\n    ZZZ_NAME\
  \ string,\n    ZZZ_VALUE double,\n```\n\n前面的片段举例说明了本节中 `field_expressions` 变量示例中定义的字段的字段声明。\n\
  \n请注意，通过以 variant 形式将 $1 存储在源数据中，你正在复制存储的数据大小，因此它只有在你在使用 variant 提取数据时遇到困难的初始开发阶段才有意义，或者如果你决定提取很少的字段并将大部分数据作为\
  \ variant 存储作为主要存储。\n\n请注意，当解包和展平半结构化实体的模式非常复杂或会带来对象关系转换问题时，这可能是一个合理的解决方案。\n\n一个典型的例子是解包带有标题和行的文档。这是半结构化文件中存储的\
  \ **嵌套分层数据** 的常见示例。\n\n如果行没有稳定的唯一标识符，而只是由标题 ID 加上行号标识，这在订单或发票中经常这样做，那么就无法单独跟踪行（想想如果一行被删除，而其他行没有变化该怎么办），因此最好将文档的版本作为一个整体进行跟踪，然后在\
  \ ref 层中解包它。\n\n另一种选择是展平标题和行，但为行创建 HDIFF，这样如果发生任何更改（标题或行），所有现有行都将保存与更改的标题相同的 LOAD_TS，并且可以使用\
  \ QUALIFY 子句与按 HKEY 标题分区并按 LOAD_TS 降序排序的 rank 函数检索所有行。rank=1 将检索在最后 LOAD_TS 编写的全部行。\n\
  \n现在我们已经看到了半结构化数据的加载宏，让我们快速看一下实现加载模式的宏——`ingest_semi_structured_into_landing_sql`\
  \ 宏：\n\n```sql\n{% macro ingest_semi_structured_into_landing_sql(\n        full_table_name,\
  \ field_expressions,\n        file_pattern, full_stage_name, full_format_name\n\
  ) %}\nBEGIN TRANSACTION;\nCOPY INTO {{ full_table_name }}\nFROM (\n    SELECT\n\
  \        {{ field_expressions }},\n\n        METADATA$FILENAME as FROM_FILE,\n \
  \       METADATA$FILE_ROW_NUMBER as FILE_ROW_NUMBER,\n        '{{ run_started_at\
  \ }}' as INGESTION_TS_UTC\n    FROM @{{ full_stage_name }}/\n)\nPATTERN = '{{ file_pattern\
  \ }}'\n{%- if full_format_name %}\n, FILE_FORMAT = (FORMAT_NAME = '{{ full_format_name\
  \ }}')\n{%- endif %}\n;\nCOMMIT;\n{%- endmacro %}\n```\n\n不出所料，这与从 CSV 文件摄取的宏几乎相同，但它用提供的\
  \ `field_expressions` 替换了生成编号列的 for 循环（$1, … $n），我们在前面的代码中突出显示了这一点。\n\n理论上，通过将 for\
  \ 循环移到生成编号列（$1, … $n）的宏中并将其用作参数，你可以使用如下调用始终使用此模式：\n\n```text\nfield_expressions\
  \ = positional_columns(field_count)\n```\n\n我们更喜欢保留两种模式，以保持开发人员的流程简单。\n"
- "## 使用落地表加载模式\n\n到目前为止，你已经知道如何设置所需的对象、创建落地表并将数据摄取到落地表中。\n\n为了简单可靠地执行此操作，创建一个 `load_all_xxx`\
  \ 宏，该宏将调用设置宏，然后调用所有 `load_yyy` 宏以加载各个表。\n\n`load_all_xxx` 宏的内容如下所示：\n\n```jinja\n\
  {% macro load_all_xxx() %}\n{{ log('*** Load for xxx system ***', true) }}\n\n{{\
  \ log('**  Setting up for XXX system **', true) }}\n{% do run_query(setup_xxx_sql())\
  \ %}\n\n{{ log('*  load_YYYYY *', true) }}\n{% do load_YYYYY() %}\n\n--\n{{ log('***\
  \ DONE loading for xxx system ***', true) }}\n{%- endmacro %}\n```\n\n首先，你必须调用设置宏，然后添加对每个表加载宏的调用。\n\
  \n完成此操作后，你可以通过将以下命令添加到作业中来安排执行：\n\n```text\ndbt run-operation load_all_xxx\n```\n\
  \n\n\n\n\n你可以选择按顺序为每个源系统安排摄取，每个系统使用一个 `load_all_XXX` 宏，也可以并行执行然后安排转换。\n\n无论如何，你将通过将它们定义为暂存模型的源来从落地表中读取。\n\
  \n另一个实际考虑因素，尤其是在你的源每天都有完整导出时，就是删除已从落地表中加载的旧数据。\n\n要实现这一点，你可以在 COPY INTO 命令后简单地添加一个\
  \ DELETE 查询。DELETE 查询看起来像这样：\n\n```\nDELETE FROM landing_table\nWHERE <where_clause>\n\
  ```\n\n对于 WHERE 子句，有几种方法可以遵循：\n\n- 保留最后 *N* 次摄取批次。每次我们向落地表加载数据时，所有行的 `INGESTION_TS_UTC`\
  \ 相同，因此你可以编写如下子句：\n\n    ```\n    WHERE  INGESTION_TS_UTC  NOT  IN\n        (SELECT\
  \ DISTINCT INGESTION_TS_UTC\n           FROM <landing>\n           ORDER BY INGESTION_TS_UTC\
  \ DESC\n           LIMIT N)\n    ```\n\n- 删除摄取时间超过 *N* 天的数据。在这里，你可以编写如下子句：\n\n \
  \   ```\n    WHERE\n        INGESTION_TS_UTC  <  DATEADD(DAY, -N, CURRENT_DATE)\n\
  \    ```\n\n- 你也可以编写一个 WHERE 子句，引用将存储落地表数据的 HIST 表，并删除在 HIST 表中 `INGESTION_TS_UTC`\
  \ 最大值之前加载的数据。\n\n  虽然诱人且 SQL 允许这样做，但这不是一个好主意：你会创建一个循环，其中落地表依赖于 HIST 表，而 HIST 表又依赖于落地表。这会使运行和维护项目变得复杂。\n\
  \n请注意，虽然在列式数据库中删除通常相当慢，但如果你基于 `INGESTION_TS_UTC` 进行删除，你基本上是按照每次日常加载时创建的微分区进行删除，因此你将获得非常好的性能。\n"
- "## 历史模式\n\n在之前的章节中，我们已经了解了如何定义合适的 HKEY 和 HDIFF 字段，如何使用 `save_history` 宏来存储我们随时间看到的实体的版本，以及如何使用\
  \ `current_from_history` 宏从历史表中读取每个实体的当前版本。\n\n我们还了解了如何将 `HDIFF` 字段用作版本标识符，在事实表中使用，当我们不仅关心当前版本，还希望使用具有所有历史版本的维度，即\
  \ SCD2 维度时。\n\n在讨论如何从投资组合的定期活跃投资组合提取中计算我们的投资组合中的未平仓头寸时，我们引入了源数据中删除的问题，并创建了解决方案来检测删除以识别已关闭头寸。\n\
  \n`save_history` 宏的加载模式的一个重要警告是，它一次只能处理每个键的一个版本。通过在 STG 模型中使用 QUALIFY 子句并仅放行输入中最新的版本，可以轻松实现这一点。\n\
  \n这种解决方案编码简单、非常健壮且易于测试，但当我们需要保留更改的可靠审计时就无法使用，因为 QUALIFY 子句可能会删除一些中间版本。\n\n在本章中，我们将讨论并提供可用的代码，以扩展历史表的使用，涵盖那些你想要跟踪源中删除的情况或需要保留收到的更改的完整审计的用例。\n\
  \n我们还将为你提供处理 **个人身份信息 (PII)** 并在保存历史表时遵循 **GDPR 合规** 的解决方案。\n\n为了回顾，让我们看一下我们将涵盖的用例列表：\n\
  \n- 在识别完整导出中的删除的同时存储历史。\n- 在接收显式删除的同时存储历史。在这里，我们将区分你接收到带有删除标志的完整记录还是仅删除实体的键。\n-\
  \ 在保留输入中的多个版本的同时存储历史（完整审计）。\n- 在你有 PII 且需要 GDPR 合规时存储历史。\n\n通过查看这一组宏，我们已经涵盖了你将面临的大多数实际用例，并为你提供了将这些宏适配到其他用例的能力，在这些用例中，所提出的解决方案不能直接应用。\n\
  \n### 存储历史并删除 – 完整加载\n\n我们已经在示例项目中以某种方式介绍的常见情况是，当你没有提供关于删除的信息时识别删除。\n\n在这种情况下，只有当你拥有来自源系统的完整、当前导出时，才能检测到删除。通过将其与历史表中的当前（和活跃）实体进行比较，你可以将那些出现在历史中但未出现在源完整导出中的实体视为已删除。\n\
  \n如果我们不是在增量运行中，那么我们可以将收到的所有输入存储在历史中，按需重塑，并加上加载时间戳和最后的 DELETED 列：\n\n```\n{%- else\
  \ %}-- not an incremental run\nchanges_to_store as (\n    SELECT\n        i.* EXCLUDE\
  \ ({{load_ts_column}})\n        , {{load_ts_column}}\n        , false as deleted\n\
  \    FROM {{ input_rel }} as i\n)\n{%- endif %}\n```\n\n最后，我们从 changes_to_store\
  \ CTE 中选择所有内容来完成宏：\n\n```\nSELECT * FROM changes_to_store\n{% endmacro %}\n```\n\
  \n前面的代码并不特别复杂，但有一些细微之处，例如重塑表以控制我们需要修改的字段，以及对历史表中的已删除行应用过滤。\n\n请注意，如果你在初始 CTE current_from_history\
  \ 中添加 WHERE not curr.deleted 子句，你将得到错误的结果，因为 WHERE 子句会在 QUALIFY 子句之前应用，而 QUALIFY\
  \ 子句用于保留最新版本。这将在任何已删除版本被选为最新版本之前排除它们。\n\n### 存储历史并删除 – 删除列表\n\n在上一节中，我们看到如果你有完整导出，你可以在没有进一步外部帮助的情况下识别已删除的行。它运行良好，但对于大表来说可能相当慢，因为你需要对两个相同大小的表进行两次连接。\n\
  \n为了避免庞大且昂贵的导出以及更大的连接，公司通常会配置其系统以提供有关哪些列已被删除的信息，即使这不是系统的原始功能。\n\n你可以配置许多数据库以跟踪表中的更改（新行、更新和删除），并以某种方式使它们可用。\n\
  \n在其他情况下，当变更数据捕获功能不可用（或对组织来说成本太高）时，可以使用现有的数据库功能，例如触发器，来捕获表中的变更事件。\n\n#### 删除时附带完整负载\n\
  \n我们讨论的第一个案例是，你接收到表的所有正常列以及负载的完整负载，外加另一个包含行状态（已删除 VS 活跃）或产生该行的操作（创建、更新或删除）的列。\n\n\
  在这种情况下，你可以将状态/操作列视为一个正常的负载列，并使用正常的 save_history 宏加载表，将该列作为表 HDIFF 列的一部分。\n\n在这种情况下，我们建议在\
  \ STG 模型中添加一个布尔 DELETED 列，该列封装了识别行是否已被删除的具体规则。这有助于将有关导出和加载的硬规则封装在存储层中。\n\n以这种方式处理删除检测是好的，因为我们回到了只有一个内容真实来源的正常情况。\n\
  \n一个特殊情况是，当你有一个初始或周期性的对账完整导出而没有这个额外的状态/操作列，以及更频繁的增量加载而具有此列时。\n\n这里的“技巧”是认为完整导出为你在某个时间点存在的行提供了数据，并且你可以在\
  \ STG 模型中创建额外的列，同时将这些行指定为活跃或具有操作代码，该代码也可以有自己的值。\n\n在下一节中，我们进入了同一个表的多个真实来源的领域，因此我们需要建立一个可靠的时间线，并在\
  \ STG 模型中最终设定一些优先级规则，以便为每个实体发送正确的行到 HIST 表。\n\n#### 删除时仅有已删除键\n\n当我们没有已删除行的完整负载而只有它们的键时，我们发现自己处于接近从完整导出删除的情况，但我们知道哪些行已被删除，而无需在输入中拥有完整导出，也无需执行昂贵的连接操作。\n\
  \n我们的解决方案将按通常方式加载来自输入的实体，同时我们使用历史和删除列表生成记录删除的行。\n\n让我们讨论该宏的代码。\n\n\n\n\n\n宏声明与普通的\
  \ save_history 宏基本相同，只是增加了 `del_rel` 和 `del_key_column` 参数，分别包含与包含已删除实体的列表的模型的关系，以及输入实体的键列：\n\
  \n```\n{% macro save_history_with_deletion_from_list(\n    input_rel,\n    key_column,\n\
  \    diff_column,\n\n    del_rel,\n    del_key_column,\n\n    load_ts_column = 'LOAD_TS_UTC',\n\
  \    input_filter_expr = 'true',\n    high_watermark_column = None,\n    high_watermark_test\
  \ = '>=',\n    order_by_expr = None\n) -%}\n```\n\n在此，或在调用宏的模型中，我们需要具有增量模型配置：\n\n\
  ```\n{{ config(materialized='incremental') }}\n```\n\n正如我们对增量模型经常做的那样，我们先从增量情况的代码开始。\n\
  \n首先，我们像往常一样读取历史表中的当前数据：\n\n```\nWITH\n{% if is_incremental() %}  -- in an incremental\
  \ run\ncurrent_from_history as (\n    {{- current_from_history(\n        history_rel\
  \ = this,\n        key_column = key_column,\n        load_ts_column = load_ts_column,\n\
  \    ) }}\n),\n```\n\n接下来，我们必须保留输入中包含新实体或与历史相比的新行的行。这与普通的 save_history 宏非常相似。\n\n\
  请注意，现在我们过滤历史，仅针对活动实体进行比较。\n\n你应该设置测试来声明两个来源中不能有相同的键，或者在提供输入和删除列表到历史表的两个 STG 模型中以期望的方式处理这种情况。\n\
  \n该宏具有以下清晰但非幂等的行为：\n\n- 当实体在 `HIST` 表中被标记为已删除时，如果它存在于输入中，它将被再次添加。\n\n- 当实体在 `HIST`\
  \ 表中未被标记为已删除时，如果它存在于 `DEL` 输入中，它将被标记为已删除。\n\n    如果输入中的版本与历史中的版本不同，则新版本和删除都将被添加到\
  \ `HIST` 表中，破坏了历史表对每个加载时间戳仅有一条条目的契约。\n\n    这可能会造成问题和重复，因为将存在两个当前版本，但由于其中一个版本被标记为已删除，最可能的行為是删除实际上会被忽略。\n\
  \n- 这两个输出的组合结果是，如果一个键同时存在于输入和删除列表中，结果将取决于其在 `HIST` 中的状态和版本：如果该键已被删除，它将被取消删除，而如果未被删除，结果将取决于版本是否相等。\n\
  \n作为示例，要消除这种情况，你可以通过在为历史表提供数据的 STG 模型中加入以下逻辑之一来优先考虑其中一个输入：\n\n- 要优先考虑输入，必须从删除列表中移除出现在输入中的键\n\
  \n- 要优先考虑删除列表，必须从输入中移除出现在删除列表中的键\n\n通过最后的讨论，我们已经为你提供了一些工具，以便在这种复杂的情况下充分利用这种强大的模式，分析工程师在设计模型时需要很好地理解它。\n\
  \n## 在输入中存储历史的多版本\n\n到目前为止，我们每次只向历史中添加一个版本——来自输入的“最新”版本——因此很自然地，它要么与历史中已有的版本相同，要么是更新的版本。\n\
  \n在本节中，我们将介绍一种模式，你可以用它在一次加载轮次中加载多个版本，从而能够以任意速度加载数据并保持准确的审计，以存储在输入中可以观察到的所有版本。\n\n\
  我们在此提出的模式使用历史中的当前版本作为基线，将历史中的当前版本与每个实例的输入中的第一个最旧版本进行比较，然后按输入中的顺序比较其余输入。\n\n这需要满足一些易于实现但很重要的条件：\n\
  \n- 版本的顺序必须稳定。你需要提供一个排序表达式，以确保版本按正确的顺序进行评估。\n\n    最常见的情况是具有某个生效或最后修改时间戳来提供版本顺序，但任何能产生排序且没有多个行具有相同排名的排序方式都有效，包括按摄取文件名和行号排序。\n\
  \n    毕竟，如果你无法为收到的版本建立顺序，又如何知道哪个是当前/最新的？这可能是你遗漏了某些东西的信号。\n\n- 为了拥有精简且有序的版本序列，输入只能包含与历史中的当前版本对齐或更新的版本。\n\
  \n    如果你的输入包含早于历史中当前版本的版本，历史将包含按正确顺序排列的完整版本序列，但历史中当前版本之前的版本将被再次插入，而没有任何必要，生成除加载时间戳外都是重复的行。\n\
  \n    自然的解决方案是使用高水位列，根据历史表的内容过滤来自 STG 模型的传入数据。\n\n    这种模式非常适合摄取增量加载，但也可以很好地与完整导出一起使用，只要你可以使用业务信息的一部分作为高水位，例如最后修改或生效时间戳，而不是某些加载元数据，例如摄取时间戳。\n\
  \n    在此模式中，高水位在表级别实现，作为给定列的最大值。这是常见情况并提供良好性能，但该模式可以修改为按键级别。\n\n- 另一个重要考虑因素是延迟到达。\n\
  \n    数据是根据到达时间线添加到历史表的，因此输入数据被认为是在同一时间或在上一次加载之后到达。\n\n    每个键的版本将根据提供的排序表达式与“前一个”版本进行比较。第一个输入与历史中的当前版本进行比较；其他输入与输入中的前一个进行比较。\n\
  \n    在许多情况下，可以通过架构 HDIFF 列、排序表达式和加载时间线来存储延迟到达的数据，同时接受某些数据可能被存储两次，但你可以正确地从历史表中读取数据。\n\
  \n    如果你有多个时间线，并且对于你的用例，仅基于一个时间线与历史表中最当前记录进行比较是不够的，那么这种模式不适合你。\n\n到目前为止，我们一直摄取来自输入的最新版本。现在，如果我们可以识别这个起点，我们就可以一次性保存所有在上次摄取后到达的新信息。通常，这就是通过最后更新列完成的。\n\
  \n在我们进入代码之前，我们可以说摄取机制与保存历史的其他宏非常相似。不同之处在于能够为单个加载时间戳存储一个实例的多个版本，反过来，能够在存在多个具有相同加载时间戳的版本的情况下，从历史中获取单个最当前实例。\n\
  \n正如我们之前提到的，要实现这一点，我们需要一个排序表达式来将一个实例的多个版本排序。\n\n为了实现这种模式，我们将实现两个宏：一个是 current_from_history\
  \ 的扩展，用于从最后加载时间的多行中选择最后一行；另一个是 save_history 的扩展，根据版本的顺序应用正确的比较。\n\n让我们开始讨论 save_history_with_multiple_versions\
  \ 宏。\n\n你会立即注意到，此处的声明与 save_history 宏中的声明相同，只是增加了 sort_expr 参数，它是新的且强制性的。\n\n此新参数需要提供一个\
  \ SQL 表达式，当与 ORDER BY 结合使用时，可为输入产生稳定的排序，最旧版本在前，最新的在后。\n\n作为示例，`LAST_UPDATED asc`\
  \ 或 `FILE_NAME, ROW_NUMBER` 将是两个良好的表达式，前者适用于所有情况，包括完整导出，后者适用于增量加载：\n\n```\n{% macro\
  \ save_history_with_multiple_versions(\n    input_rel,\n    key_column,\n    diff_column,\n\
  \    sort_expr,\n    history_rel = this,\n    load_ts_column = 'LOAD_TS_UTC',\n\
  \    input_filter_expr = 'true',\n    history_filter_expr = 'true',\n    high_watermark_column\
  \ = None,\n    high_watermark_test = '>='\n) -%}\n```\n\n然后，我们有配置来声明增量物化：\n\n```\n\
  {{- config(materialized='incremental') }}\n```\n\n我们将配置包含在宏中，因为宏在没有增量物化的情况下没有意义，但你可以将其取出并放在你的模型中。\n\
  \n\n\n\n\n照常，我们从增量物化（materialization）的代码开始。\n\n我们做的第一件事，与保存历史的其他宏一样，是为每个实例检索我们已存储的最后一个版本：\n\
  \n```\nWITH\n{% if is_incremental() %}\ncurrent_from_history as (\n  {{current_from_history_with_multiple_versions(\n\
  \    history_rel = history_rel,\n    key_column = key_column,\n    sort_expr = sort_expr,\n\
  \    selection_expr = key_column ~ ', ' ~ diff_column,\n    load_ts_column = load_ts_column,\n\
  \    history_filter_expr = history_filter_expr\n  )}}\n),\n```\n\n这里，我们使用的是 `current_from_history_with_multiple_versions`\
  \ 宏，其名称已暗示，它是一个专门用于在历史表可以为单个加载时间戳存储多个版本时读取最新版本的宏。在这种情况下，我们还需要 `sort_expr`，一个 SQL\
  \ 表达式，用于对在同一时间输入/加载时呈现的版本进行排序。\n\n对于此宏，我们需要检索最新版本的 HKEY 和 HDIFF 两列，因此必须在 `selection_expr`\
  \ 参数中构建此 SQL 表达式。\n\n下面的 `load_from_input` CTE 在选择要保存的行方面具有与我们在其他 `save_history`\
  \ 宏中相同的功能：\n\n```\nload_from_input as (\n  SELECT\n    i.*\n    , LAG(i.{{diff_column}})\n\
  \      OVER(PARTITION BY i.{{key_column}}\n      ORDER BY {{sort_expr}}) as PREV_HDIFF\n\
  \    , CASE\n        WHEN PREV_HDIFF is null\n        THEN COALESCE(i.{{diff_column}}\
  \ != h.{{diff_column}}, true)\n        ELSE (i.{{diff_column}} != PREV_HDIFF)\n\
  \      END as TO_BE_STORED\n  FROM {{input_rel}} as i\n  LEFT OUTER JOIN current_from_history\
  \ as h\n    ON h.{{key_column}} = i.{{key_column}}\n  WHERE {{input_filter_expr}}\n\
  ```\n\n我们以通常的查询结束，该查询在所有情况下都能产生所需的结果：\n\n```\nSELECT * EXCLUDE(PREV_HDIFF, TO_BE_STORED)\n\
  FROM load_from_input\nWHERE TO_BE_STORED\nORDER BY {{key_column}}, {{sort_expr}}\n\
  {%- endmacro %}\n```\n\n这里，与其他保存历史宏相比，我们有几个不同之处。\n\n第一个是我们对 `TO_BE_STORED` 列进行了显式过滤。我们本可以在两种情况下使用\
  \ `QUALIFY` 谓词，但我们认为在这里使用单个谓词更具可读性。\n\n第二个是我们从最终的 `SELECT` 投影中移除了用于确定要存储行的临时 `PREV_HDIFF`\
  \ 和 `TO_BE_STORED` 列。\n\n第三个是我们最后添加了 `ORDER BY`，以便于从历史表中读取数据时检索。\n\n现在我们知道了如何在历史表中存储多个版本，让我们来看看\
  \ `current_from_history_with_multiple_versions` 宏，该宏用于检索最后一个版本。\n\n宏声明与 `current_from_history`\
  \ 宏的声明类似，只是增加了 `sort_expr` 参数，用于提供版本的顺序，以及 `qualify_function` 参数的默认值，该参数用于过滤结果：\n\
  \n```\n{% macro current_from_history_with_multiple_versions(\n    history_rel,\n\
  \    key_column,\n    sort_expr,\n    selection_expr = '*',\n    load_ts_column\
  \ = 'LOAD_TS_UTC',\n    history_filter_expr = 'true',\n    qualify_function = '(rn\
  \ = cnt) and rank'\n) %}\n```\n\n在宏声明之后，我们创建一个新变量，通过添加行号和计数窗口函数来扩展提供的 `SELECT` 投影表达式。这些用于通过加载时间戳确定最新版本：\n\
  \n```\n{%- set multiple_versions_selection_expression %}\n    {{selection_expr}}\n\
  \    , row_number() OVER( PARTITION BY\n        {{key_column}}, {{load_ts_column}}\n\
  \        ORDER BY {{sort_expr}}) as rn\n```\n\n使用这种方法，当 PII 信息从源系统中消失时，它会自然地从您的数据平台中清除。在落地表中，PII\
  \ 仅保留您在删除导入数据之前决定的保留期，对于包含 PII 数据的表，您可以使其尽可能短；在数据平台中，它仅存储在每天重新创建的表中。\n\n另一个优点是，通过在各处使用相同的代理，您仍然可以连接、计数和分析每个参与者的活动，即使您已“忘记”其\
  \ PII。\n"
- "## 使用增量导出处理 PII\n\n如果我们要处理的 PII 是增量导出的一部分，则解决方案需要更多逻辑，因为我们无法将 PII 存储委托给外部源。这是因为导出仅包含已更改的行，而大多数行很长时间都不会更改。\n\
  \n在这种情况下，实现与之前的步骤 2 不同，因为我们需要在永久表中存储 PII。为了能够在时机到来时删除 PII，我们需要收到一个信号。\n\n信号可以有两种类型：\n\
  \n- 我们收到信息表明某个 PII 不再使用。这可能是因为包含 PII 的行已被删除，或者 PII 本身已更改，从而创建了实体的新版本。如果该版本是旧 PII\
  \ 的唯一出现，我们需要删除/匿名化它。\n- 我们收到信息表明某个 PII 需要被匿名化/删除。\n\n在任何这些情况下，我们都可以使用信号将 MAP 表中\
  \ PII 的值替换为其代理，使两个列相同。这将确保在交付层，连接将自动输出代理值。\n\n第一个用例更复杂，因为我们需要制定业务规则来决定何时需要匿名化 PII。\n\
  \n考虑在一个发票中，您有销售人员或操作员姓名的情况。仅仅因为您删除了该发票并不意味着您需要在所有发票中匿名化该值。\n\n同样，当我们收到 PII 的新版本时，我们称之为\
  \ PII₂，我们需要决定对之前的版本 PII₁ 做什么，并且通常，正确的操作是什么都不做。\n\n在这种情况下，如果在一张发票中操作员姓名的值被更改，这并不意味着之前操作员姓名的所有版本都必须被匿名化。\n\
  \n针对这种情况的一种解决方案是比较 MAP 表中的代理列表与来自 HIST 表的当前版本的列表。\n\n仅出现在 MAP 表中而未出现在列表中的所有代理都应被匿名化，因为它们不再使用，要么是因为它们已更改，要么是因为使用它的记录已被删除。\n\
  \n```\n, current_from_history as (\n  {{ current_from_history(\n    history_rel\
  \ = ref('HIST_XXX_Vn'),\n    key_column = 'XXX_HKEY'\n  ) }}\n)\n, all_current as\
  \ (\n  SELECT * FROM current_from_history\n  UNION ALL\n  SELECT * FROM current_from_old_histories\n\
  )\n{{ current_from_history(\n  history_rel ='all_current',\n  key_column = 'XXX_HKEY'\n\
  ) }}\n```\n\n前面的代码获取所有先前历史表中的当前实体——即静态表——因为这些历史表不会更改。然后，活动历史中的当前实体将它们放在一起，并从联合数据中取出最新实体。\n\
  \n作为替代方案，根据表中更改的数量，您可以将所有先前历史表中的当前实体添加到活动历史中，并从联合中取出当前实体。实际上，这意味着用包含 `select * from\
  \ {{ ref('HIST_XXX_Vn') }}` 查询以获取活动历史中所有内容的 CTE 命名为 `active_history` 来替换伪代码中的 `current_from_history`。\n\
  \n此示例也向您展示了，我们所看到的宏通常可以应用于类似的情况，即使它们与我们引入它们的用例不完全相同。\n\n通过理解它们的作用，您可以在新上下文中应用它们，或派生出一个新宏来执行您经常需要的操作。\n"
- '## 总结


  恭喜，您已读完本书的最后一章！


  在本章中，我们介绍了将数据摄取到 Snowflake 的一些更高级模式，以及 `save_history` 宏的多种扩展，用于处理不同的用例，从检测已删除的行到一次摄取多个版本，再到在历史表中管理
  PII。


  作为作者，首先，我希望我已传递了我对软件工程的热情，以及组装一个架构良好、易于理解的项目所带来的乐趣，该项目使得 onboarding 新同事并在不失眠的情况下维护和演进功能成为可能。






  编写本书的团队的一个关键目标是讨论数据工程和数据架构，同时展示 dbt 的工作原理，以及如何使用它来解决我们在构建数据平台时都面临的常见问题。


  在处理数据几十年之后，我有自己的一套主观做法，这构成了实用数据平台的主体，这是我试图在简单性、效率（开发者和平台的效率）和通用性之间取得平衡的尝试。


  通常，这些目标会相互冲突，有时我提出了不同的替代方案。这是因为最佳行动方案可能是主观的，或者取决于实际用例。


  最后，我希望我已经让你对数据工程和 dbt 的工作原理有了深入的了解，并让你有能力进一步学习，并将我所展示的内容调整到你的实际需求中。

  '
- '## 延伸阅读


  Snowflake 和 dbt 是两款以光速发展的产品，几乎每季度都会推出新功能，因此我们的主要建议是熟悉它们的文档网站并加入它们的社区，这些是信息和支持的重要来源。


  你可以在以下位置找到它们：


  - dbt Cloud 文档：https://docs.getdbt.com/

  - Snowflake 文档：https://docs.snowflake.com/


  在静态媒体中捕捉这种演变是困难的，总会有一些重要的东西被排除在外，例如 Snowflake 中 SELECT 命令的 EXCLUDE（我们在它可用时就开始使用）或
  dbt 中的指标（它们仍需成熟并得到支持才能正确使用）。

  '
