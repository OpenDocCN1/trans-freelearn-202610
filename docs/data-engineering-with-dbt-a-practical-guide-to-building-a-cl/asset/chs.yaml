- "## 使用 SQL 转换数据的基础知识\n\n本书是关于使用 **dbt** 构建工程化数据平台的。在使用 dbt 时，你需要使用**结构化查询语言**（通常称为\
  \ **SQL**，发音为“sequel”或按字母读作 S-Q-L）编写代码，并辅以少量 **Jinja** 模板语法。\n\n这意味着，当我们在讨论架构和设计主题之外的内容时，我们会阅读和编写\
  \ SQL 代码，因此你需要快速掌握 SQL 才能熟练使用 dbt。\n\n在本章中，你将复习或从零开始学习 SQL 的基础知识，熟悉这种在处理数据时随处可见的强大语言。\n\
  \n首先，我们将介绍 SQL，并带你了解其核心概念，这样即使你是这门语言的新手，也能开始建立自己的能力，并跟上本章和本书其余部分的内容。\n\n作为这一介绍的补充，我们还会按使用类别快速列出所有主要的\
  \ SQL 命令。这将确保你了解 SQL 中最相关的部分，并在开始编写代码时可以将本章作为快速参考。\n\n然后，我们将指导你如何在 **Snowflake**\
  \ 中*创建账户*——Snowflake 是领先的云**数据库**，经常与 dbt 一起使用。你将在云端使用 Snowflake，无需安装任何东西，并且有免费试用期。\n\
  \n一旦你有了 Snowflake 账户，我们就会引导你创建你的第一个角色、用户和数据库。\n\n当你的云数据库准备就绪，并且已经介绍了基本 SQL 命令之后，我们将更深入地学习\
  \ `SELECT` 语句和 `JOIN` 子句，因为它们在使用 dbt 时至关重要。\n\n本章末尾会以简单的方式介绍分析函数和窗口函数，既适合初学者，也适合中高级\
  \ SQL 用户；这些高级功能将提升你的 SQL 技能，极大地拓展你的能力。\n\n综上所述，本章将涵盖以下主题：\n\n- 介绍 SQL\n- SQL 基础——核心概念和命令\n\
  - 在 Snowflake 中设置包含用户和角色的数据库\n- 在 SQL 中查询数据——语法和运算符\n- 在 SQL 中组合数据——JOIN 子句\n- 进阶——介绍窗口函数\n\
  \n### 技术要求\n\n本章不假设你具备任何 SQL 知识，内容从基础到中级水平。如果你对 SQL 很熟悉，可以跳过本章，或者只浏览更高级的主题。\n\n\
  本章的所有代码示例都可以在 GitHub 上获取：https://github.com/PacktPublishing/Data-engineering-with-dbt/tree/main/Chapter_01。\n\
  \n要运行这些示例，我们将在本章后面指导你设置 Snowflake 账户和角色，并创建你的第一个数据库。\n\n### 介绍 SQL\n\nSQL 诞生于 70\
  \ 年代，到 80 年代末已成为与关系数据库（RDB）交互的事实标准，如今它驱动着全球大部分数据管理行业。\n\n由于其巨大的影响力和强大的抽象能力，SQL 已成为任何使用数据库系统的人最终都会熟悉的标准。SQL\
  \ 的表达能力广为人知，其知识如此普及，以至于它已经超越了关系数据库的范畴，各类数据库管理系统（DBMS）都提供了 SQL 接口，甚至许多非关系型数据库系统之上也有\
  \ SQL 接口。\n\nSQL 的一些巨大优势如下：\n\n- SQL 的核心功能在 80 年代就已标准化，但 SQL 至今依然生机勃勃，随着数据管理的发展不断演进并添加强大的新功能，同时保持与先前版本的兼容性。\n\
  \n- 每个数据库都有自己的 SQL 特性，但逻辑是相同的，大多数 SQL 代码可以很少或无需改动地在多种数据库上运行。\n\n- 现在学会，终身受用，并且（几乎）适用于每种数据库。\n\
  \n- 其核心具有*简单、严谨且强大的语法，读起来像英语句子*，因此即使非技术人士也能掌握基本概念，而专业人员则能够精确而简洁地表达他们想要的内容。\n\n大多数人大致能猜出以下\
  \ SQL 的作用：\n\n```sql\nSELECT ORDER_ID, CUSTOMER_CODE, TOTAL_AMOUNT\nFROM ORDERS\n\
  WHERE YEAR(ORDER_DATE) = 2021;\n```\n\n- 使用 SQL，你是在*逻辑层面*工作，因此不需要处理实现细节，而且*它是一种声明式语言*；你用严谨的方式描述你想达成什么目标，而不是如何实现。数据库引擎可以自由地以自己的方式存储数据、实现和执行请求，只要它能根据\
  \ SQL 规范产生正确的结果即可。\n\n- 使用一条简单的 SQL 语句，你既可以*处理一条数据，也可以处理数十亿条数据*，把寻找最有效实现方式的负担交给数据库，同时在一定程度上让你摆脱规模的限制。\n\
  \n### SQL 基础——核心概念和命令\n\nSQL 语言当然庞大而复杂，需要时间才能完全掌握，但令人惊讶的是，仅凭我们将在本书中介绍的有限功能，你就能高效工作，并且在实际用例中需要时，你会逐渐掌握其中的微妙之处。\n\
  \n本章的目标不是让你成为 SQL 专家，而是让你入门，深入了解我们将经常使用的少数几个命令，以便你能够快速高效地使用 dbt。\n\n在这部分介绍中，我们从\
  \ SQL 最基本的概念开始，然后按使用类别概述 SQL 命令。在本章其余部分，我们将更深入地讨论使用 dbt 时最常用的命令：`SELECT`、`JOIN`\
  \ 以及分析函数和窗口函数。\n\n### SQL 核心概念\n\nSQL 的主要目标，正如其名称所示，是允许用户查询数据库中包含的数据；SQL 还提供了全面管理数据库所需的所有命令，允许你添加、转换、删除、组织和管理数据以及其他数据库对象（例如用户和角色）。\n\
  \nSQL 中的核心概念源于关系数据库的组织方式：\n\n- 一个**数据库**包含**表**，表按模式（**schema** 的复数形式为 schemata）组织。\n\
  \n- 表将数据存储在多行（**rows**）中，每一行对应表中定义的每一列（**columns**）有一个值。\n\n- 列有名称，并且只能包含所声明的**数据类型**的数据。\n\
  \n- 为了规范对数据的访问，**权限**被授予**用户**和**角色**。\n\n在 SQL 中，一张表既包含其内容的定义（列及其类型），也包含内容本身（按行组织的数据）：\n\
  \n- **表定义：** 列出构成表的列，每一列提供数据类型和其他可选细节。数据类型是必需的，并声明该列将接受什么值。\n\n- **表内容：** 按行组织，每行包含为表定义的每一列的一个值，如果没有提供值，则为\
  \ `null`。\n\n- **数据值：** 列中的所有值必须与该列声明的类型兼容。`null` 是一种特殊值，对应于数据的缺失，并且与所有数据类型兼容。\n\
  \n创建表时，我们必须为表提供名称和定义，定义至少包括列名和每列的类型；数据可以在之后添加。\n\n在以下代码块中，我们有一个订单表的示例定义：\n\n```sql\n\
  CREATE TABLE ORDERS (\n    ORDER_ID NUMBER,\n    CUSTOMER_CODE TEXT,\n    TOTAL_AMOUNT\
  \ FLOAT,\n    ORDER_DATE DATE,\n    CURRENCY TEXT DEFAULT 'EUR'\n);\n```\n\n> **提示**\n\
  >\n> 当我们编写 SQL 时，我们将使用 Snowflake 的 SQL 语法和命令。我们将指导你创建一个免费的 Snowflake 账户，在那里你可以运行这里展示的代码。\n\
  \n在这个示例中，我们看到创建表的命令读起来很像英语，并提供了表名和列的列表，以及每列将要包含的数据类型。\n\n你可以看到，对于类型为 `text` 的 CURRENCY\
  \ 列，这段代码还提供了 `default` 值 EUR。在 SQL 中，单引号用于界定一段文本，也就是所谓 `string`（字符串）。\n\n### 视图——查看某些数据的一种特殊方式\n\
  \n如果你已有数据，并且希望以某种转换或过滤后的形式将其提供给他人使用，你可以创建一个**视图**。你可以把视图想象成一张表，但其列定义和数据都来自一个查询，该查询从一个或多个表读取数据。\n\
  \n\n\n\n\n作为示例，如果你想要一份订单金额大于 1,000 的简短清单，你可以编写以下查询来创建 BIG_ORDERS 视图：\n\n```\nCREATE\
  \ VIEW BIG_ORDERS AS\nSELECT * FROM ORDERS\nWHERE TOTAL_AMOUNT > 1000;\n```\n\n\
  在这个示例中，我们看到这个简单的创建视图语句提供了视图的名称，并使用一个查询，即 SELECT 语句，来定义视图提供的数据。\n\n查询提供了数据，即所有总金额大于\
  \ 1,000 的订单，以及列定义。` * ` 字符 – 称为星号 – 是 SELECT 语句读取的表中所有列的快捷方式。\n\n当然，这是一个天真的示例，但在本书的整个过程中，你会看到，将存储数据的表与过滤和转换来自表和视图的数据的视图结合起来，是使用\
  \ dbt 的核心。 在前一个对象之上构建一个对象，使我们能够以原始数据作为输入，并提供作为输出的经过精炼的信息，供用户轻松访问和理解。\n\n> **提示**\n\
  > 在使用 dbt 时，你无需编写创建表或创建视图语句，因为 dbt 会为我们创建它们。 尽管如此，熟悉这些基本的 SQL 命令仍然是好的，因为这些是在数据库中执行的命令，如果你查看日志，你会看到它们。\n\
  \n## 数据库和模式\n\n我们已经看到，数据库是表和视图的容器。\n\n数据库可以进一步使用模式对象进行划分和组织。\n\n在现实生活中的数据库中，表的数量可能从几个单位到数千个。\
  \ 模式在很大程度上就像文件夹，但不能嵌套，因此你始终可以通过其数据库、模式和名称来识别一个表。\n\n在下面的屏幕截图中，我们看到 SNOWFLAKE_SAMPLE_DATA\
  \ 数据库的部分内容，该数据库在所有 Snowflake 账户中都可用：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_29_0.png)\n\
  \n图 1.2：SNOWFLAKE_SAMPLE_DATA 数据库的一些模式和表\n\n数据库和模式作为表容器，是组织信息的主要方式，但它们也用于以分层方式应用安全、访问限制和其他功能，从而简化大型系统的管理。\n\
  \n要创建 TEST 数据库及其中的 SOME_DATA 模式，我们可以使用以下命令：\n\n```\nCREATE DATABASE TEST;\nCREATE\
  \ SCHEMA TEST.SOME_DATA;\n```\n\ndatabase.schema 记法，也称为完全限定名称，使我们能够精确描述要在哪个数据库中创建模式，并在创建后唯一标识该模式。\n\
  \n> 提示\n> 在使用 dbt 时，你将为你的项目创建一个数据库或使用现有的数据库； dbt 会为你创建所需的模式对象，如果你尚未创建它们。\n\n在 Snowflake\
  \ 中的最佳实践是为每个项目或你想要为了管理目的而分开的数据集创建一个数据库。 Snowflake 中的数据库和模式是软边界，因为如果用户具有适当的权限，则可以访问所有数据库和模式中的所有数据。\n\
  \n在某些其他数据库系统中，例如 PostgreSQL，数据库是一个更强的边界。\n\n## 用户和角色\n\n为了控制对 SQL 中数据的访问，你将 GRANT\
  \ 访问和其他权限授予用户和角色。\n\n用户代表可以访问数据库的一个个人用户或服务，而角色代表可以授予权限的命名实体。\n\n可以将角色授予用户，从而提供与该角色相关的所有权限。\n\
  \n还可以将一个角色授予另一个角色，建立使用简单基本角色构建更复杂角色的层次结构，然后将这些角色分配给用户。\n\n使用角色而不是直接向用户授予权限，可以让你简单一致地管理大量用户。\
  \ 在这种情况下，角色是权限集的标签，成为管理我们想要授予相同权限的用户组的一种方式。 在任何时候更改授予角色的权限都将更改用户从该角色获得的权限。\n\n在使用\
  \ dbt 时，一个典型的模式是为 dbt 用户创建一个角色，然后将其分配给开发人员和 dbt 程序将使用的服务用户。\n\n以下是使用一个角色和几个用户的简单设置的示例：\n\
  \n```\nCREATE ROLE DBT_SAMPLE_ROLE;\nCREATE USER MY_NAME;          -- 个人用户\nCREATE\
  \ USER SAMPLE_SERVICE;   -- 服务用户\nGRANT ROLE DBT_SAMPLE_ROLE TO USER MY_NAME;\n\
  GRANT ROLE DBT_SAMPLE_ROLE TO USER SAMPLE_SERVICE;\n```\n\n更复杂的设置可能对每个源系统（由包含系统数据的模式表示）、数据仓库（一个或多个处理数据的模式）和每个数据\
  \ mart（每个数据 mart 一个模式）具有一个用于读取的角色和一个用于写入的角色。\n\n然后你可以在付出更多努力的代价下，更详细地控制谁可以读取和写入什么。\n\
  \n## 理解 SQL 命令的类别\n\nSQL 命令可以根据其在语言中的用途组织成类别：\n\n- 数据定义语言 (DDL)：DDL 包含用于管理数据库的结构和组织的命令。\n\
  - 数据操作语言 (DML)：DML 包含用于操作数据的命令，例如 INSERT、DELETE 和 UPDATE。\n- 数据查询语言 (DQL)：DQL 包含\
  \ SELECT 命令，是 SQL 的核心部分，允许查询和转换存储在数据库中的数据。\n- **数据控制语言 (DCL)**：DCL 包含 `GRANT` 和\
  \ `REVOKE` 命令，用于管理控制对数据库资源和对象访问的权限。\n- **事务控制语言 (TCL)**：TCL 包含用于管理事务的命令。\n\n在接下来的部分中，我们通过查看\
  \ Snowflake 特定的命令来提供这些命令的更多细节，但这些思想和名称在所有数据库系统中都是通用的，使用时几乎没有变化或没有变化。\n\n## 数据定义语言\
  \ – DDL\n\nDDL 命令不直接处理数据，但用于创建和维护数据库的结构和组织，包括创建存储数据的表。\n\n它们操作以下对象：\n\n- 账户/会话对象，包含和操作数据，例如用户、角色、数据库和仓库。\n\
  - 数据库/模式对象，存储和操作数据，例如模式、表、视图、函数和存储过程。\n\n主要命令如下：\n\n- `CREATE`：用于创建数据库本身和其他对象\n\
  - `DROP`：用于删除指定的对象\n- `ALTER`：用于修改指定对象的某些属性\n- `DESC`：用于描述指定对象的详细信息\n- `SHOW`：用于列出指定对象类型的现有对象，并附带元数据\n\
  - `USE`：用于选择在未使用完全指定名称时使用的数据库、模式和对象\n\n> **提示**\n> 在使用 dbt 时，我们仅在宏中使用 DDL 和 DML\
  \ 命令。\n> 我们不在模型中使用 DDL 和 DML 命令，因为 dbt 将根据附加到模型的元数据为我们的模型生成所需的命令。\n\n## 数据操作语言 –\
  \ DML\n\nDML 提供了操作数据库中的数据并执行批量数据加载的命令。\n\nSnowflake 还提供了特定的命令来分阶段处理文件，例如在 Snowflake\
  \ 管理的位置，即 stage 中加载文件。\n\n主要命令如下：\n\n- INSERT：向表中插入行\n- DELETE：从表中删除指定的行\n- UPDATE：更新表中指定行的某些值\n\
  - MERGE：在表中插入、更新或删除行\n- TRUNCATE TABLE：清空表，保留定义和权限\n\n对于批量数据加载，Snowflake 提供了以下命令：\n\
  \n- COPY INTO：将数据从 stage 中的文件加载到表中，或将数据从表中卸载到 stage 中的一个或多个文件\n\n为了管理 stage 中的文件，Snowflake\
  \ 提供了这些文件分阶段命令：\n\n- PUT：将本地文件上传到 Snowflake stage\n- GET：将文件从 stage 下载到本地机器\n- LIST：列出\
  \ Snowflake stage 中存在的文件\n- REMOVE：从 Snowflake stage 中删除文件\n\n> **重要说明**\n> 在 dbt\
  \ 中，我们可以使用宏与 COPY INTO 和文件分阶段命令来管理数据管道的数据加载部分，当源数据位于文件存储服务中时，例如 AWS S3、Google Cloud\
  \ Storage 或 Microsoft Azure Data Lake 文件存储。\n\n## 数据查询语言 – DQL\n\nDQL 是 SQL 存在的理由：查询和转换数据。\n\
  \n用于查询数据的命令是 SELECT，它毫无疑问是所有 SQL 中最重要的和最通用的命令。\n\n目前，认为 SELECT 语句，即查询，可以执行以下所有操作：\n\
  \n- 从一个或多个表中读取数据\n- 对检索到的数据应用函数和转换\n- 过滤从每个这些表中检索到的数据\n- 对一组列（或转换后的值）对检索到的数据进行分组，为每个组生成一行，对分组的行计算函数，并根据这些函数的结果进行过滤\n\
  \n\n\n\n- 对于每一行，基于窗口表达式识别的行组计算一个或多个函数，并根据这些函数的结果过滤结果。\n\n> **重要说明**\n> 我们在本章后面的*查询语法和运算符*一节中专门详细分析了Snowflake中的`SELECT`命令，因为你将在每个dbt模型中使用`SELECT`命令。\n\
  \n## 数据控制语言 – DCL\n\nDCL包含`GRANT`和`REVOKE`命令，用于管理控制数据库资源和对象访问或使用的权限和角色。\n\n与用于创建角色、用户和其他数据库对象的DDL命令一起，DCL命令用于管理用户和安全性：\n\
  \n- `GRANT`：向角色（或用户）分配权限或角色\n- `REVOKE`：从角色（或用户）撤销权限或角色\n- `SHOW GRANTS`：列出授予角色或对象的访问权限\n\
  \n## 事务控制语言 – TCL\n\nTCL命令用于管理数据库中的事务。\n\n**事务**将一组SQL命令分组为一个*单一执行单元*，并保证如果事务成功完成，则应用所有命令的所有效果；如果事务失败，则不应用任何效果。这也可以用**ACID**缩写来描述，它代表**原子性、一致性、隔离性和持久性**。\n\
  \n只有当事务分组的所有命令都成功完成时，事务才会成功结束；在任何其他情况下，事务都会失败，其效果会像从未发生过一样被回滚。\n\nTCL命令如下：\n\n-\
  \ `BEGIN`：在当前会话中启动事务\n- `COMMIT`：提交当前会话中的打开事务，并使事务效果对所有会话可见\n- `ROLLBACK`：回滚当前会话中的打开事务，并撤销自`BEGIN`语句以来应用的所有效果\n\
  \n既然我们已经介绍了SQL中的基本概念和命令，现在是时候建立一个数据库来运行它们了。下一节将为你提供对Snowflake数据库的访问。\n\n## 使用用户和角色设置Snowflake数据库\n\
  \n在本节中，你将学习创建自己的Snowflake账户，以便你可以试验上一节中的SQL命令，并在接下来的章节中将其与dbt一起使用。\n\n创建账户后，我们将帮助你快速设置用户和角色，这些将在本书及你后续的项目中非常有用。\n\
  \n## 创建你的Snowflake账户\n\n要注册Snowflake的30天免费试用，你可以访问 https://signup.snowflake.com/\
  \ 或在Snowflake主页上查找“免费开始”按钮。\n\n在Snowflake网站上，请按照以下步骤操作：\n\n1. 填写包含你数据的注册表单，然后点击“继续”。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_34_0.png)\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_34_1.png)\n\
  \n图1.3：Snowflake免费试用注册表单\n\n6. 关闭此介绍菜单后，你就可以探索和使用你的Snowflake账户了，在经典控制台界面中，它看起来像这样：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_37_0.png)\n\n图1.6：Snowflake工作表用户界面\n\n\
  如果你最终使用的是新的Snowflake界面（称为Snowsight），你可以使用它，或者使用菜单中的**Classic Console**条目切换到旧界面。\n\
  \n## 在Snowflake中设置初始用户、角色和数据库\n\n现在你有了一个Snowflake账户，其中有一个可以登录的用户，并且你的用户已被授予ACCOUNTADMIN这一全能角色。\n\
  \n这很好，但不建议你在日常工作中使用该角色。最佳实践是设置一些用户和角色以提供所需的访问级别，并使用能够完成任务的最低级别。\n\nSnowflake允许你在工作表中执行命令时，在你已被授予的角色之间选择要模拟的角色，这样你无需注销并重新登录即可更改角色。\n\
  \n> **提示**\n> \n> 你可以使用工作表编辑区域右上角的选择器更改你的角色、要使用的仓库以及当前数据库和架构。\n\n3. 让我们保持简单，将执行者角色分配给自己：\n\
  \n```\nGRANT ROLE DBT_EXECUTOR_ROLE TO USER <your_user>;\n```\n\n现在，我们的用户同时拥有账户管理员和执行者角色。为了能够在用户界面下拉菜单中看到并选择该角色，你可能需要刷新页面。\n\
  \n## 授予创建数据库的权限\n\n我们可以在模拟账户管理员角色时创建数据库，但这无助于我们使用执行者角色管理该数据库的计划。因此，我们必须赋予执行者角色创建数据库的能力。要让我们的SQL命令在数据库上执行，我们需要能够使用或创建现有仓库。\n\
  \n> **重要说明**\n> 为了管理数据库结构和仓库设置，Snowflake提供了默认的SYSADMIN角色，该角色具有所需的权限。\n\n我们可以通过以下方式之一实现为执行者角色提供这些能力的目标：\n\
  \n- 直接向执行者角色授予所需权限\n- 将SYSADMIN角色授予执行者角色，该角色具有所需权限\n\n有什么区别？\n\n如果你直接授予权限，执行者角色与其他角色完全隔离，拥有该角色的用户只能访问该角色允许他们访问的内容。\n\
  \n如果你授予SYSADMIN角色，拥有执行者角色的用户也将能够模拟SYSADMIN角色，因此也能访问它可以访问的任何对象。例如，他们可以访问另一个用户使用sysadmin角色创建的数据库。\n\
  \n让我们直接分配所需权限，以使我们的dbt对象远离SYSADMIN。\n\n要向执行者角色授予权限，我们需要切换到可以授予这些权限的角色，然后授予它们：\n\n\
  1. 切换到SYSADMIN角色：\n\n```\nUSE ROLE SYSADMIN;\n```\n\n2. 授予创建新数据库的权限：\n\n```\nGRANT\
  \ CREATE DATABASE ON ACCOUNT\nTO ROLE DBT_EXECUTOR_ROLE;\n```\n\n3. 授予使用默认仓库（名为COMPUTE_WH）的权限：\n\
  \n```\nGRANT USAGE ON WAREHOUSE COMPUTE_WH\nTO ROLE DBT_EXECUTOR_ROLE;\n```\n\n\
  ## 创建你的第一个数据库\n\n既然我们的执行者角色可以创建数据库，让我们开始吧：\n\n1. 让我们模拟执行者角色，以便它拥有我们创建的内容：\n\n```\n\
  USE ROLE DBT_EXECUTOR_ROLE;\n```\n\n2. 现在，让我们创建数据库：\n\n```\nCREATE DATABASE DATA_ENG_DBT;\n\
  -- or pick any name you like for the DB\n```\n\n要在Snowflake中看到新数据库，你可能需要使用面板右上角的刷新按钮（形状为循环箭头）刷新用户界面左侧的浏览面板。\n\
  \n> 提示\n> 点击新数据库将显示它不是空的。\n> \n> 新数据库有两个架构：INFORMATION_SCHEMA，其中包含可用于收集数据库本身信息的视图；以及PUBLIC，它是新数据库的默认架构，并且是空的。\n\
  \n为了减少Snowflake积分消耗，让我们最后将默认仓库配置为在1分钟后暂停，而不是10分钟：\n\n```\nUSE ROLE SYSADMIN;\nALTER\
  \ WAREHOUSE \"COMPUTE_WH\" SET\n    WAREHOUSE_SIZE = 'XSMALL'\n    AUTO_SUSPEND\
  \ = 60\n    AUTO_RESUME = TRUE\n    COMMENT = 'Default Warehouse';\n```\n\n> 提示\n\
  > 要更改仓库，你必须切换到SYSADMIN用户，因为它是拥有该仓库的角色；我们只授予了执行者角色使用它的权限。\n\n恭喜！你现在已经创建了一个角色，将其分配给了你的个人用户，创建了一个由该角色拥有的数据库，并配置了默认仓库。你几乎已经完成设置了。\n\
  \n\n\n\n## 为 dbt 应用创建用户\n\n让我们通过创建一个新的用户来完成初始设置，我们将使用该用户与 dbt 配合使用，并授予其执行者角色，以便它能够作为所有者管理该数据库。\n\
  \n要创建用户，我们需要切换到具有该能力的角色：\n\n- 1. 切换到 USERADMIN 角色：\n\n```sql\nUSE ROLE USERADMIN;\n\
  ```\n\n- 2. 为 dbt 创建新用户；我将其命名为 DBT_EXECUTOR，但您可以选择任何名称：\n\n```sql\nCREATE USER IF\
  \ NOT EXISTS DBT_EXECUTOR\n    COMMENT = 'User running DBT commands'\n    PASSWORD\
  \ = 'pick_a_password'\n    DEFAULT_WAREHOUSE = 'COMPUTE_WH'\n    DEFAULT_ROLE =\
  \ 'DBT_EXECUTOR_ROLE'\n;\n```\n\n- 3. 让我们将执行者角色分配给 dbt 用户：\n\n```sql\nGRANT ROLE\
  \ DBT_EXECUTOR_ROLE TO USER DBT_EXECUTOR;\n```\n\n- 4. 切回操作角色，我们应该始终使用该角色进行工作：\n\
  \n```sql\nUSE ROLE DBT_EXECUTOR_ROLE;\n```\n\n太好了！您现在已完成新 Snowflake 账户的基础设置；您已学习了用户和角色管理的基础知识，并且已准备好学习更多\
  \ SQL 以查询数据。\n\n## 在 SQL 中查询数据 – 语法和运算符\n\n在本节中，您将学习如何使用 SQL 和 Snowflake 示例数据库查询现有数据。\n\
  \n在本章中，以及更广泛地在本书中，您将熟悉 Snowflake 语法，它是现代且非常标准的。我们还将使用一些专有扩展，使您的工作更轻松。\n\n### Snowflake\
  \ 查询语法\n\nSnowflake 支持使用标准 SELECT 语句查询数据，其基本语法如下：\n\n```sql\nWITH ...\nSELECT ...\n\
  FROM ...\nJOIN ...\nWHERE ...\nGROUP BY ...\nHAVING ...\nQUALIFY ...\nORDER BY ...\n\
  LIMIT ...\n```\n\n唯一强制的部分是 SELECT，因此 SELECT 1 是一个有效的查询，只返回值 1。\n\n如果您熟悉来自其他数据库系统的\
  \ SQL，您会想知道 QUALIFY 子句是什么。它是一个可选的 SQL 子句，非常适合 Snowflake 所使用的分析型工作，并且并非所有数据库引擎都实现。它将在本节后面描述。\n\
  \n我们经常在指代可执行的 SQL 片段时互换使用查询、命令和语句这几个术语。\n\n严格来说，命令是诸如 SELECT 或 `CREATE <object>`\
  \ 之类的通用命令，而语句是可运行的某个命令的一个具体且完整的实例，例如 `SELECT 1` 或 `CREATE TABLE my_table ...;`。\n\
  \n查询一词本应仅指 SELECT 语句，因为 SELECT 语句用于从数据库查询数据，但查询经常用于指代与数据相关的任何语句。\n\n您也会经常听到术语子句，例如\
  \ FROM 子句或 GROUP BY 子句。非正式地，您可以将其视为语句中遵循特定关键字语法和规则的部分。\n\n### WITH 子句\n\nWITH 子句是可选的，只能在\
  \ SELECT 命令之前使用，以定义一个或多个公用表表达式（CTE）。CTE 将名称与另一个 SELECT 语句的结果关联起来，该结果可以在主 SELECT\
  \ 语句中像其他任何表状对象一样使用。\n\n定义 CTE 有用之处在于：\n\n- **清晰性**：您可以为一段 SQL 提供有意义的名称\n- **重用、维护和效率**：您可以定义一个支持查询，其结果您可能在主查询中多次使用，而数据库引擎将只执行一次支持查询\n\
  - **创建递归查询**：定义一个查询自身的 CTE 是在 SQL 中使用递归的唯一方法\n- 将复杂的转换分解为更小、更简单的步骤，使其更易于编码和理解，并限制未来维护的范围\n\
  \n简化的语法如下：\n\n```sql\nWITH [RECURSIVE]\n    <cte1_name> AS (SELECT ...)\n    [,\
  \ <cte2_name> AS (SELECT ...)]\nSELECT ...\n```\n\n我们在这里查看一些示例：\n\n- 1. 检查我们是否仍有待处理的优先订单：\n\
  \n```sql\nWITH\nhigh_prio_orders as (\n    SELECT *\n    FROM \"SNOWFLAKE_SAMPLE_DATA\"\
  .\"TPCH_SF1\".\"ORDERS\"\n    WHERE O_ORDERPRIORITY IN ('1-URGENT', '2-HIGH')\n\
  )\nSELECT count(*)\nFROM high_prio_orders\nWHERE O_ORDERDATE < '1998-01-01'\n  \
  \  and O_ORDERSTATUS = 'O';\n```\n\n在这里，您可以看到第一个表达式将高优先级订单的业务定义封装为任何优先级设置为紧急或高优先级的订单。如果没有\
  \ CTE，您必须在 WHERE 子句中混合业务定义和其他过滤逻辑。然后，就不清楚状态是定义的一部分还是我们现在应用的过滤器。\n\n- 2. 计算汽车行业客户的一些指标：\n\
  \n```sql\nWITH\nauto_customer_key as (\n    SELECT C_CUSTKEY\n    FROM SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.CUSTOMER\n\
  \    WHERE C_MKTSEGMENT = 'AUTOMOBILE'\n),\norders_by_auto_customer as (\n    SELECT\
  \ O_ORDERKEY\n    FROM SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.ORDERS\n    WHERE O_CUSTKEY\
  \ in (SELECT * FROM auto_customer_key)\n),\nmetrics as (\n    SELECT 'customers'\
  \ as metric, count(*) as value\n    FROM auto_customer_key\n    UNION ALL\n```\n\
  \n这使我们能够引用没有名称的列，例如从没有标题的 CSV 文件中读取时。这在脚本中也很有用，用于引用我们不知道名称但知道其位置的列：\n\n```sql\n\
  SELECT $1 as ORDER_KEY, $2 as CUST_KEY\nFROM SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.ORDERS;\n\
  ```\n\n在这种情况下，我们从具有列名的表中读取，并且始终可以使用列号代替列名。但在从表或视图读取时很少这样做，因为使用数字，结果将取决于对象中列的顺序，如果对象被重新创建，顺序可能会随时间变化。\n\
  \n- 4. 一个表达式，如数学表达式或函数调用，对每一行求值为某个值：\n\n```sql\nSELECT\n    P_PARTKEY\n  , UPPER(P_NAME)\
  \ as P_NAME\n  , P_RETAILPRICE\n  , P_RETAILPRICE * 0.9 as P_DISCOUNTED_PRICE\n\
  FROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"PART\";\n```\n\n前面的示例显示了两个表达式：一个数学表达式，将列乘以常数以生成新列，以及一个函数调用，将\
  \ p_name 列转换为大写，保持相同的列名。\n\n> **重要说明**\n>\n> 这里强调的能力，即编写任意表达式并为结果分配名称，是 SQL 用于转换数据核心方式之一，也是我们使用\
  \ dbt 时最常见的事情之一。\n\n在本节中，我们看到 SELECT 子句提供了四种强大的能力：\n\n- 1. 决定从源表中保留哪些数据在查询结果中\n\
  - 2. 使用任意复杂表达式从源数据计算新数据\n- 3. 为查询结果中想要的数据提供新名称\n- 4. 使用 DISTINCT 关键字在结果中只保留每一行的一份副本\n\
  \n### FROM 子句\n\nFROM 子句引入 SQL 语句中用作数据来源或命令目标的表对象。\n\n对于 SELECT 语句，FROM 子句可以列出零个、一个或多个表对象，每个对象都有自己的别名。SELECT\
  \ 语句的结果行可能包含 FROM 子句中引用的所有表的所有列。\n\n简化的语法如下：\n\n```sql\nSELECT ...\nFROM [tableObject1\
  \ [AS alias1]]\n    [, tableObject2 [AS alias2] ...]\n```\n\n**表对象**，在 SELECT 语句的上下文中，是以下内容的组合：\n\
  \n- **表和视图**：表和视图是 SQL 工作的主要数据对象，因此大多数情况下，FROM 子句中会出现这些对象。\n- **表函数**：表函数是一类返回一组行、一个或多个列的函数。它们可以是预定义函数或用户定义的函数。\n\
  - **VALUES 子句**：此子句允许我们使用常量值构建一组行。这使我们能够创建一个内联表，可用作引用表、映射表或测试输入。\n- 少数其他可读取的对象，例如\
  \ LATERAL 子查询或分阶段文件。\n\n当未列出表时，SELECT 子句中的列必须使用常量和全局对象，例如 current_date 函数，如以下示例所示：\n\
  \n```sql\nSELECT 1 + 1 as sum, current_date as today;\n```\n\n当我们使用 VALUES 子句时，我们可以定义一个内联表，如此示例所示：\n\
  \n```sql\nSELECT * FROM ( VALUES\n    ('IT', 'ITA', 'Italy')\n  , ('US', 'USA',\
  \ 'United States of America')\n  , ('SF', 'FIN', 'Finland (Suomi)')\n) AS inline_table\
  \ (code_2, code_3, country_name);\n```\n\n当 FROM 子句列出多个表对象时，结果是这些表中元素的**笛卡尔积**。为了避免**笛卡尔爆炸**，重要的是包含一个\
  \ WHERE 子句来限制组合，只保留我们想要的组合。\n\n> **重要说明**\n>\n> 笛卡尔积是将产品中所有对象的行以所有可能的方式配对的结果。这意味着笛卡尔积返回的行数是产品中每个对象行数的乘积。\n\
  >\n> 术语笛卡尔爆炸通常用于指代笛卡尔积返回的行数会迅速增加，并且很容易造成性能问题这一事实。\n\n\n\n\n得益于 WHERE 子句，以下查询将生成一组更有意义且更紧凑的行，理想情况下等于\
  \ LINEITEM 表中的行数：\n\n```\nSELECT count(*)\nFROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\"\
  .\"LINEITEM\" as l\n    ,\"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"ORDERS\"   as\
  \ o\n    ,\"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"CUSTOMER\" as c\n    ,\"SNOWFLAKE_SAMPLE_DATA\"\
  .\"TPCH_SF1\".\"PART\"      as p\nWHERE o.O_ORDERKEY = l.L_ORDERKEY\n  and c.C_CUSTKEY\
  \  = o.O_CUSTKEY\n  and p.P_PARTKEY  = l.L_PARTKEY\n;\n```\n\n在上一个查询中，我们使用 WHERE\
  \ 子句将真正相关的行保留在结果中。这是通过在相关表的字段之间添加等价约束来实现的。\n\n上一个查询恰好生成 6,001,215 行结果，这与 LINEITEM\
  \ 表中的行数一致，而不是由各行数相乘得出的天文数字：6,001,215 x 1,500,000 x 150,000 x 200,000，约等于 2.7 x 10^23。\n\
  \n具体结果就留给你计算吧……\n\n这样一来，完整的查询会处理 600 万行数据，并在几秒钟内完成；而不带 WHERE 子句的查询将尝试处理多出 10^18\
  \ 倍的行数，可能需要数小时甚至数天才能完成，期间白白消耗大量资源，因为最终得到的数据毫无价值。\n\n计数的精确对应源于这样一个事实：每个行项目只有一个订单，每个订单只有一个客户，依此类推。\n\
  \n即使键的匹配并非如此精确，提供相关的 WHERE 子句也有助于将结果集减少多个数量级。我们将在第 3 章讨论数据建模时更详细地探讨这个主题。\n\n这个例子很好地展示了\
  \ SQL 的强大之处，也说明了准确表达我们需求的重要性。\n\n> **提示**\n> 基本原则是：除非你清楚自己在做什么，并且能够接受将要生成的爆炸性行数，否则绝不要执行无限制的笛卡尔积。\n\
  \n## JOIN 子句\n\nJOIN 是 FROM 子句的一个子句，用于更精确地描述如何组合两个表的行。JOIN 不能脱离 FROM 子句而存在。\n\n\
  以下示例仅返回订单总额大于 500,000 的行：\n\n```\nSELECT O_ORDERKEY, O_CUSTKEY, O_TOTALPRICE\nFROM\
  \ \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"ORDERS\"\nWHERE O_TOTALPRICE > 500000;\n\
  ```\n\n以下示例不返回任何行，但定义了两个名称和类型与源表中的列相同的列，以及两个采用我们提供的名称和类型的列：\n\n```\nSELECT O_ORDERKEY,\
  \ O_CUSTKEY, 1 as an_int, null::number as a_num\nFROM \"SNOWFLAKE_SAMPLE_DATA\"\
  .\"TPCH_SF1\".\"ORDERS\"\nWHERE false;\n```\n\n当你需要定义某些列名和类型时，这可能是一个好技巧。请记住，如果你不想使用现有表中的列，就不需要\
  \ FROM 子句……\n\n> **重要提示**\n> 当涉及 NULL 时要小心，因为它的行为可能和你预期的不同。\n> 例如，NULL = NULL 表达式的结果为\
  \ NULL。\n> 在 WHERE 子句中，这意味着相应的行会被丢弃。\n\n在前面的示例中，我们看到使用 FROM 子句时，WHERE 子句可用来指定某些类型的\
  \ JOIN。我们建议使用 JOIN ... ON ... 语法进行连接，使用 WHERE 子句来过滤行。我们将在“在 SQL 中组合数据——JOIN 子句”一节中查看更多示例。\n\
  \n## GROUP BY 子句\n\nGROUP BY 子句用于对按分组表达式产生相同值的行组计算聚合函数。\n\n简化语法如下：\n\n```\nSELECT\
  \ ...\nGROUP BY groupExpr1 [, groupExpr2 ...]\n```\n\n分组表达式可以是以下之一：\n\n- **列名：**\
  \ 表达式的结果是指定名称的列的值。列中具有相同值的所有行将被分组。\n\n以下查询计算每个客户（客户键）所有订单的总和：\n\n```\nSELECT O_CUSTKEY,\
  \ sum(O_TOTALPRICE)\nFROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"ORDERS\"\nGROUP\
  \ BY O_CUSTKEY;\n```\n\n- **数字：** 用于分组的值为 `SELECT` 语句结果中指定位置列的值。该值在语句结束时、应用任何函数或表达式之后计算。\n\
  \n以下查询与上一个查询相同，使用序号 1 而不是列名 O_CUSTKEY 来指示要分组的列：\n\n```\nSELECT O_CUSTKEY, sum(O_TOTALPRICE)\n\
  FROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"ORDERS\"\nGROUP BY 1;\n```\n\n- **SQL\
  \ 表达式：** 使用查询中数据的任意组合构成的任何表达式。用于分组的值是表达式的结果。\n\n以下查询使用 `year()` 函数计算按年份统计的订单总额，该函数从日期中返回年份：\n\
  \n```\nSELECT YEAR(O_ORDERDATE), sum(O_TOTALPRICE)\nFROM \"SNOWFLAKE_SAMPLE_DATA\"\
  .\"TPCH_SF1\".\"ORDERS\"\nGROUP BY YEAR(O_ORDERDATE)\nORDER BY YEAR(O_ORDERDATE);\n\
  ```\n\n我们还添加了与 GROUP BY 表达式相同的 ORDER BY 子句，以便获得排序良好的输出。这是一种非常常见的模式。\n\n当提供多个分组表达式时，将根据所有分组表达式的值对行进行分组。\n\
  \n在前一个示例中，你可以使用 GROUP BY YEAR(O_ORDERDATE), MONTH(O_ORDERDATE) 将订单总额按月（和年）拆分，如下所示：\n\
  \n```\nSELECT YEAR(O_ORDERDATE), MONTH(O_ORDERDATE), sum(O_TOTALPRICE)\nFROM \"\
  SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"ORDERS\"\nGROUP BY YEAR(O_ORDERDATE), MONTH(O_ORDERDATE)\n\
  ORDER BY YEAR(O_ORDERDATE), MONTH(O_ORDERDATE);\n```\n\n## HAVING 子句\n\nHAVING 子句根据谓词过滤由\
  \ GROUP BY 子句产生的行：\n\n```\nSELECT …\nGROUP BY …\nHAVING <predicate>\n```\n\n谓词是一个返回布尔值的表达式，并且可以引用：\n\
  \n- 常量\n- `GROUP BY` 子句中出现的表达式\n- 可以根据 `GROUP BY` 子句计算的聚合函数\n\n例如，我们可以扩展 GROUP BY\
  \ 主题中的示例，来查看订单量少于 10,000 的月份。\n\n以下查询实现了这一点：\n\n```\nSELECT YEAR(O_ORDERDATE), MONTH(O_ORDERDATE),\
  \ sum(O_TOTALPRICE)\nFROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"ORDERS\"\nGROUP\
  \ BY YEAR(O_ORDERDATE), MONTH(O_ORDERDATE)\nHAVING count(*) < 10000\nORDER BY YEAR(O_ORDERDATE),\
  \ MONTH(O_ORDERDATE);\n```\n\n在此查询中，我们使用了 count() 聚合函数来计算一个组中有多少行，每个订单对应一行。\n\n\
  > **提示**\n> HAVING 子句之于 GROUP BY，正如 WHERE 子句之于 FROM 子句。\n> 我们将在下一个主题中介绍第三个过滤子句 QUALIFY。\n\
  \n## QUALIFY 子句\n\nQUALIFY 子句对窗口函数的结果进行过滤，窗口函数是查询中继表达式和分组之后的第三种数据计算类型。\n\n本章最后一节将专门讨论窗口函数。\n\
  \nQUALIFY 子句是一个可选的 SQL 子句，在分析型工作负载中极其有用，因此 Snowflake 实现了该子句。\n\n简单回顾一下我们所见过的内容，用于过滤数据的三个子句如下：\n\
  \n- WHERE 适用于从 FROM / JOIN 子句指定的源中读取的数据\n- HAVING 适用于已按 GROUP BY 子句分组的数据\n- QUALIFY\
  \ 适用于已由窗口函数计算出的数据\n\nQUALIFY 子句与简单的 row_number() 窗口函数一起使用的最常见用途之一是防止出现不需要的重复行，或者在表示同一对象不同版本的其他行中选出特定的一行：\n\
  \n```\nSELECT *\nFROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"LINEITEM\"\nQUALIFY\
  \ row_number()\n    over(partition by L_ORDERKEY, L_LINENUMBER\n    order by L_COMMITDATE\
  \ desc ) = 1;\n```\n\n\n\n\n\n此查询从表中选择所有字段，仅过滤掉行号窗口函数返回的值不等于 1 的不需要的行。\n\nrow_number\
  \ 窗口函数会按照行顺序，为同一窗口中的所有行从 1 开始分配递增的编号，然后在下一个窗口重新从 1 开始。\n\n选择其值等于 1 的行意味着保留每个窗口的第一行。\n\
  \n窗口由 over (...) 子句定义，其中包含一个 partition by 部分来定义窗口，方式类似于 group by，以及一个 order by 来提供窗口内的排序。我们将在专门介绍窗口函数的章节中更详细地讨论这一点。\n\
  \n## Tip\n\n使用 QUALIFY 子句时，如前一个查询所示，我们避免了创建包含 row_number 窗口函数结果的列然后使用子查询对其进行过滤的需求。这是在不支持\
  \ QUALIFY 子句的数据库中进行此类过滤的常规方式。QUALIFY 更简单易读易用。\n\n现在，让我们扩展上一节中的订单示例，以筛选出“好月份”，即当我们某月的总销售额高于其所属年份的平均销售额时：\n\
  \n```sql\nWITH\nmonthly_totals as (\n    SELECT\n        YEAR(O_ORDERDATE) as year,\n\
  \        MONTH(O_ORDERDATE) as month,\n        sum(O_TOTALPRICE) as month_tot\n\
  \    FROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"ORDERS\"\n    GROUP BY YEAR(O_ORDERDATE),\
  \ MONTH(O_ORDERDATE)\n)\nSELECT year, month, month_tot\n    ,avg(month_tot) over(partition\
  \ by YEAR) as year_avg\nFROM monthly_totals\nQUALIFY month_tot > year_avg\nORDER\
  \ BY YEAR, MONTH;\n```\n\n这里，我们将迄今为止看到的几个子句组合在一起，使用 WITH 子句定义了一个名为 monthly_totals\
  \ 的 CTE，其中包含我们之前的查询来计算月度总额。\n\n然后，我们定义了一个从 CTE 读取的查询，并使用 avg 窗口函数为特定月份所属的整年中的每个月计算平均月销售额。然后，我们使用\
  \ QUALIFY 子句仅保留月度总额大于年度平均值的行。\n\n## Tip\n\n前一个示例说明了为什么窗口函数也被称为分析函数。\n\n**Important\
  \ note:** 请注意，窗口函数使用定义的窗口为每一行计算一个值，不会改变行数。相比之下，使用带 GROUP BY 子句的 avg 聚合函数会将行数减少到每个组一行。\n\
  \n## The ORDER BY clause\n\nORDER BY 子句指定查询或窗口函数按何种顺序排列行。\n\n简化的语法如下：\n\n```sql\n\
  SELECT ...\nORDER BY orderExpr1 [ASC|DESC] [NULLS FIRST|LAST] [, orderExpr2 ...]\n\
  ```\n\n每个 order by 表达式可以由三部分组成：\n\n1. 一个标识排序依据的表达式。它可以是列别名、位置序号或表达式，就像我们在 GROUP\
  \ BY 子句中所见。请参阅该部分了解更多细节。\n2. 一个可选的排序方向：ASC 表示升序，DESC 表示降序。\n3. 一个可选的空值排序规范：NULLS\
  \ FIRST 或 NULLS LAST，自解释。\n\n请查看前面的章节，了解 ORDER BY 在查询和窗口函数定义中 over () 的实际示例。\n\n\
  ## The LIMIT/FETCH clause\n\nLIMIT 子句用于限制查询返回的行数。\n\nLIMIT 和 FETCH 是同义词，语法略有不同。\n\
  \n让我们看一下 LIMIT 语法：\n\n```sql\nSELECT ...\n[ORDER BY ...]\nLIMIT <count> [OFFSET\
  \ <start>]\n```\n\ncount 参数是一个数字，指定返回的最大行数。\n\n让我们回顾一下运算符的类别以及它们的使用方式：\n\n- **Arithmetic\
  \ operators:** 这些是传统的 +, -, *, /, 和 %（取模）。\n\n  它们期望一个或多个数值（或可转换为数值）的输入以提供数值结果，具有通常的算术优先级和含义，如以下示例所示：\n\
  \n  ```sql\n  SELECT 1 + '2' as three, (3+2) * 4 as twenty\n  WHERE twenty % 2 =\
  \ 0;\n  ```\n\n  请注意 '2' 是一个字符串，但可以自动转换为数字 2。还请注意隐式转换会发生，但显式转换更好。\n\n  取模运算符返回第一个操作数除以第二个操作数的余数，val\
  \ % 2 = 0 模式通常用于识别偶数。\n\n- **Comparison operators:** 这些用于测试两个值是否相等或其他比较，分别是 =（相等）、!=（不相等）、<>（也表示不相等）、<（小于）、<=（小于或等于）、>（大于）和\
  \ >=（大于或等于）。\n\n  它们通常用于 WHERE 子句，但可以在任何需要布尔结果的地方使用，如以下示例所示：\n\n  ```sql\n  SELECT\
  \ 2 < 1 as nope, '3' != 'three' as yep\n  WHERE 1 != 2;\n  ```\n\n  请注意运算符可以比较所有操作已定义的类型。\n\
  \n  我在很多地方看到 WHERE 1 = 2 用于避免返回任何行，因为 1=2 总是返回 FALSE；更清晰的写法是直接写 WHERE false，如果你不需要过滤任何行，可以直接省略\
  \ WHERE 子句，或使用 WHERE true 表达式。\n\n- **Logical operators:** 这些是传统的 AND、OR 和 NOT 布尔运算符。\n\
  \n  它们仅对布尔谓词和值操作并返回布尔值。\n\n  它们通常用于 WHERE 子句，但可以出现在任何允许表达式的地方，如以下示例所示：\n\n  ```sql\n\
  \  SELECT *,\n      (C_ACCTBAL > 7500) AND (C_NATIONKEY = 24) as IS_TOP_US_CUST\n\
  \  FROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"CUSTOMER\"\n  WHERE (C_NAME IS\
  \ NOT null) AND IS_TOP_US_CUST;\n  ```\n\n  在前一个示例中，我们使用逻辑运算符组合两个谓词定义了 IS_TOP_US_CUST\
  \ 列，就像我们在 WHERE 子句中所做的那样，同时重用了我们创建的新布尔列。\n\n- **Set operators:** 这些运算符用于将多个查询的结果组合在一起，分别是\
  \ `INTERSECT`、`MINUS` 或 `EXCEPT`，以及 `UNION [ALL]`。\n\n  简化的语法如下：\n\n  ```sql\n \
  \ query_1 <set_operator> query_2\n  ```\n\n  查询必须兼容，具有相同数量且类型相同的列。\n\n  同样重要的是同一位置列的语义是正确的，因为将人名与州代码组合是可能的，因为它们都是字符串，但通常意义不大。\n\
  \n  让我们描述集合运算符：\n\n  - `INTERSECT` 返回同时出现在两个查询中的行，检查所有列的值是否相同。\n\n  - `MINUS` 或\
  \ `EXCEPT` 返回在第一个查询中出现但未出现在第二个查询中的行。\n\n  - `UNION [ALL]` 返回两个查询的行，ALL 保留重复项。\n\n\
  \  作为示例，以下查询返回来自印度（8）和美国（24）的客户数据以及 AUTOMOBILE 细分市场的客户且不重复：\n\n  ```sql\n  SELECT\
  \ C_NAME, C_ADDRESS, C_PHONE\n  FROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"CUSTOMER\"\
  \n  WHERE C_NATIONKEY IN (8, 24)\n  UNION\n  SELECT C_NAME, C_ADDRESS, C_PHONE\n\
  \  FROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"CUSTOMER\"\n  WHERE C_MKTSEGMENT\
  \ = 'AUTOMOBILE';\n  ```\n\n  在这种特殊情况下，由于两个查询都针对同一张表，我们本可以使用一个带有更复杂 WHERE 子句的单个查询，使用\
  \ OR 运算符组合两个单独的子句。在实际情况下，你可能想要组合来自不同表的相似数据，集合运算符就是为此而设的。\n\n- **Subquery operators:**\
  \ 这些运算符允许我们在 WHERE 子句中使用子查询。\n\n  子查询是在另一个查询内部定义的查询。\n\n  子查询可以不带任何运算符作为类似表的对象使用，例如选择我们想要使用数据的表的子集，或如果它返回单个值则作为表达式，如以下示例所示：\n\
  \n  ```sql\n  SELECT C_NAME, C_ADDRESS, C_PHONE\n  FROM \"SNOWFLAKE_SAMPLE_DATA\"\
  .\"TPCH_SF1\".\"CUSTOMER\"\n  WHERE C_NATIONKEY = (\n      SELECT N_NATIONKEY\n\
  \  ```\n\n\n```\nFROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\".\"NATION\"\nWHERE N_NAME\
  \ = 'JAPAN'\n);\n```\n\n在此示例中，子查询只返回一个值，因此我们可以使用等号运算符。\n\n子查询运算符根据其定义，其用途可扩展到其他情况：\n\
  \n- ALL/ANY：允许你对子查询的所有/任意行应用比较。\n- [NOT] EXISTS：如果子查询至少返回一行，则返回 true；如果前面加上 NOT，则返回\
  \ false。\n- [NOT] IN：如果表达式不包含在子查询结果中，则返回 true。\n\n以下示例将前面的示例扩展到我们想要来自多个国家的客户，并按名称选择国家的情况：\n\
  \n```\nSELECT C_NAME, C_ADDRESS, C_PHONE\nFROM \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\"\
  .\"CUSTOMER\"\nWHERE C_NATIONKEY IN (\n    SELECT N_NATIONKEY\n    FROM \"SNOWFLAKE_SAMPLE_DATA\"\
  .\"TPCH_SF1\".\"NATION\"\n    WHERE N_NAME IN ('JAPAN', 'CANADA')\n);\n```\n\n我们可以轻松地重写同样的查询，使用\
  \ = ANY 代替 IN，并且可能还会对子查询做一些修改，也使用 EXISTS。\n\n现在我们已经熟悉了在 SQL 中查询数据的基础知识，让我们更深入地研究\
  \ JOIN 子句，它允许我们将来自多个源的数据组合在一起，这对于将原始数据转化为有用信息至关重要。\n\n## 在 SQL 中组合数据 – JOIN 子句\n\
  \nJOIN 子句以及 FROM 子句与多个表等效的形式，用于组合两个表的行，以创建包含两个表中（你所选择的）列的一行。\n\n当要组合的表彼此相关时，即两个表具有一些表示相同内容的列，并且我们希望组合两个表中的数据时，JOIN\
  \ 非常有用。\n\n我们通过提供连接子句（通常是 ON 子句）来表达如何组合行，ON 子句将一个表中的行与另一个表中的行进行比较。大多数情况下，关系是对应列的值相同，但\
  \ ON 子句中可以使用任何谓词。\n\n### 组合订单和客户\n\n一个如何组合数据的例子可能是 web_order 表和 customer 表。\n\n\
  在这两个表中，通常会有一个包含客户 ID 信息的列，即使这些列可能没有相同的名称。假设在订单表中，有一个列 ORDER_PLACED_BY，其中包含下单客户的\
  \ ID；在客户表中，有一个列 CUSTOMER_ID，其中包含客户的 ID。那么，我们可以编写以下查询：\n\n```\nSELECT *\nFROM web_order\n\
  JOIN customer ON ORDER_PLACED_BY = CUSTOMER_ID;\n```\n\n该查询使用 *，当存在满足 ON 条件的行时，返回所有具有两个表中所有列的行。\n\
  \n让我们看在订单表中有一个 ORDER_PLACED_BY = 123 的订单，在客户表中有一个 CUSTOMER_ID = 123 的客户时，输入和输出表的相关行。\n\
  \n假设 web_order 表中有一行，其中 ORDER_PLACED_BY = 123，如下所示：\n\n| Order_ID | ORDER_PLACED_BY\
  \ | ORDER_VALUE |\n|---|---|---|\n| WEB_0001 | 123 | 225.52 |\n\n表1.2：web_order\
  \ 表示例\n\n并且我们在 customer 表中有一行 CUSTOMER_ID = 123，如下所示：\n\n| Customer_ID | Customer_Name\
  \ | Address |\n|---|---|---|\n| 123 | 大买家LLP | 美景路，00100 某处 |\n\n表1.3：customer 表示例\n\
  \n那么，我们在结果表中得到如下行：\n\n| Order_ID | ORDER_PLACED_BY | ORDER_VALUE | Customer_ID |\
  \ Customer_Name | Address |\n|---|---|---|---|---|---|\n| WEB_0001 | 123 | 225.52\
  \ | 123 | 大买家LLP | 美景... |\n\n表1.4：上述查询的结果示例\n\n如果没有任何 CUSTOMER_ID = 123 的客户，那么结果表中将不会返回（针对该订单的）任何行。\n\
  \n假设我们有一个与之前相同的订单表，但 customer 表中有三行 CUSTOMER_ID = 123：\n\n| Customer_ID | Customer_Name\
  \ | Address |\n|---|---|---|\n| 123 | 大买家LLP | 美景路，00100 某处 |\n| 123 | 另一位客户 | 某路，10250\
  \ 某处 |\n| 123 | 第三位客户 | 无名路，20100 无处 |\n\n表1.5：customer 表的另一个示例，包含三行 CUSTOMER_ID\
  \ = 123\n\n那么，我们将返回三行，每行都包含相同的订单信息并分别与一个特定客户组合，如下表所示：\n\n| Order_ID | ORDER_PLACED_BY\
  \ | ORDER_VALUE | Customer_ID | Customer_Name | Address |\n|---|---|---|---|---|---|\n\
  | WEB_0001 | 123 | 225.52 | 123 | 大买家LLP | 美景... |\n| WEB_0001 | 123 | 225.52 |\
  \ 123 | 另一位客户 | 某... |\n| WEB_0001 | 123 | 225.52 | 123 | 第三位客户 | 无... |\n\n表1.6：之前的示例\
  \ JOIN 查询得到的结果表，包含三个匹配的客户\n\n最后这种情况可能不是你想要的，因为它会“重复”订单，为每个满足条件的客户返回一行具有相同订单信息的数据。在本书后面讨论身份时，我们将看到如何确保这种情况不会发生，以及如何使用\
  \ dbt 轻松测试它确实不会发生。\n\n你可能会想到另一个问题：即使客户表中没有匹配项，我们如何将订单信息保留在结果中，以便获得所有订单，并在可用时附带客户信息？这是一个好问题，下一个关于连接类型的主题将为你解答。\n\
  \n### JOIN 类型\n\n在前面的查询语法一节中，我们介绍了 JOIN 子句的简化语法。这里我们用更短的表名和没有别名的方式回顾一下：\n\n```\n\
  SELECT ...\nFROM t1\n[<join type>] JOIN t2 ON <condition_A>\n[[<join type>] JOIN\
  \ t3 ON <condition_B>]\n...\n```\n\n### JOIN 查询中返回行的可视化表示\n\n下图直观地描述了表 A 和表 B 的两行如何对齐，以形成不同类型连接产生的行：\n\
  \n```\nSELECT ...\nFROM TableA as A\n<type> JOIN TableB as B\nON A.key = B.key\n\
  ```\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_64_0.png)\n\n图1.7：表 A 与表 B 之间不同\
  \ JOIN 类型的可视化表示\n\n每个表被分为两部分：一部分是行在另一个表中有满足连接条件的一个或多个匹配项，另一部分是每一行在另一个表中没有匹配项。\n\n\
  来自两个表且具有匹配项的行位于图的中心，根据匹配条件正确对齐，因此每个结果行都包含满足条件的 A 列和 B 列的值。所有连接都会返回这个中心部分，除非使用 WHERE\
  \ 子句显式排除其中两个键之一为 NULL。\n\n没有匹配项的行（表 A 的显示在顶部，表 B 的显示在底部）与来自另一个表的列对齐，这些列填充了 NULL\
  \ 值。这会产生一个有些难以直观理解的结果：带有 ON A.key = B.key 子句的查询可能会生成两键中一个为 NULL 而另一个不为 NULL 的行。\n\
  \n> 提示\n> 请记住，NULL 是一个特殊值，并不是所有事情都能按预期进行。例如，表达式 NULL = NULL 产生 NULL，而不是你可能期望的 TRUE。\n\
  > 你可以使用这个查询自行尝试：SELECT NULL = NULL as unexpected;。\n> 这就是为什么你使用 `field` IS NULL\
  \ 来测试 NULL 值，而不是使用相等性。\n\n### 全外连接\n\n下图描述了 FULL OUTER JOIN 相对于两个原始表的行的结果：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_65_0.png)\n\
  \n图1.8：FULL OUTER JOIN 的可视化表示\n\n你可以清楚地识别上一张图片的中心部分，即两个表中的行满足连接约束的部分，以及两个表中一个表在另一个表中没有匹配行的两个部分；在这些行中，另一个表的列填充了\
  \ NULL 值。\n\n### 左外连接\n\n下图描述了 LEFT OUTER JOIN 相对于两个原始表的行的结果：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_65_1.png)\n\
  \n图1.9：LEFT OUTER JOIN 的可视化表示\n\n你可以清晰地看到，结果由来自两侧满足连接约束的行，以及仅来自表 A 中在表 B 中没有匹配项的行组成，其中来自\
  \ B 的列填充了 NULL 值。\n\n表 B 中在表 A 中没有匹配项的行不会被返回。\n\n\n\n\n前面的图展示了我们在两种形式下看到的连接类型：\n\
  \n1. 仅使用 ON 子句，展示纯连接的结果\n2. 在 ON 子句所用列上使用 WHERE 子句\n\n在图中，这些信息被用来从外连接中排除发生匹配的行，即\
  \ A 和 B 重叠的区域，也就是内连接返回的行。\n\n这类查询非常有用且常用，例如，用于检查我们是否拥有引用了客户表中不存在的客户的订单。这被称为订单表中的孤立键。\n\
  \n让我们看一个使用 Snowflake 示例数据的例子：\n\n```sql\nSELECT *\nFROM \"SNOWFLAKE_SAMPLE_DATA\"\
  .\"TPCH_SF1\".\"ORDERS\"\nLEFT OUTER JOIN \"SNOWFLAKE_SAMPLE_DATA\".\"TPCH_SF1\"\
  .\"CUSTOMER\"\n    ON C_CUSTKEY = O_CUSTKEY\nWHERE C_CUSTKEY is NULL;\n```\n\n此查询应不返回任何行，因为订单引用的所有客户都应存在于客户表中。现在我们已经涵盖了\
  \ SQL 中的所有基本函数，让我们来了解一个高级特性：窗口函数。\n\n## 高级——引入窗口函数\n\n窗口函数是一种 SQL 函数，它作用于一组行，称为行窗口。\n\
  \n这些函数也被称为分析函数，因为它们主要用于分析型查询中。\n\n窗口是一组相关行，包含从 0 到查询结果中的所有行的任意数量。\n\n通常，窗口会将结果行划分为不相交的分区。\n\
  \n某些窗口函数还可以作用于窗口框架，这是窗口定义的行中的一个动态子集，基于当前行。\n\n您可以定义一个累计窗口框架，取窗口中当前行之前或之后的行，或者定义一个滑动窗口框架，从当前行之前的若干行延伸到当前行之后的若干行。\n\
  \n窗口函数与使用 GROUP BY 的聚合函数有很多共同点，因为它们都将查询结果划分为组（即分区），然后对每个组中的行计算函数值。\n\n要使用窗口函数，可以使用以下语法：\n\
  \n```\n<function_name> ([<arguments>])\n    OVER ( [PARTITION BY <part_expr>] [ORDER\
  \ BY <order_expr>])\n```\n\nOVER 子句的存在指定了该函数应用于 OVER 子句内定义的窗口。当然，函数也可以接受自己的参数。\n\
  \nPARTITION BY 子句定义了行如何分区，`<part_expr>` 是一个由列或基于查询数据计算的表达式组成的逗号分隔列表，这与我们之前看到的 group\
  \ by 表达式类似，如前面的示例所示。\n\nORDER BY 子句指定了用于计算函数的行的排序方式，且该排序在窗口函数之外不可见。ORDER BY 子句和\
  \ `<order_expr>` 的工作方式与 SELECT 语句中对查询结果排序时基本相同。\n\n在语法层面上，PARTITION BY 和 ORDER BY\
  \ 子句都是可选的，即使某些函数要求或禁止这两者之一。请查阅每个函数的文档以了解更多细节。\n\nORDER BY 子句对顺序敏感的窗口函数有影响，这些函数分为两种类型：\n\
  \n- **排名相关函数**：这些函数根据行的排名（即行在窗口中的顺序）来计算值。它们用于将行在窗口中的多种可能排序之一显式化，即固化为一个以后可以使用的值。\n\
  \n  一个例子是根据积分或奖牌对锦标赛中的队伍进行排序：当出现相同值时可以有不同的排序风格，具体取决于你如何决定。\n\n  例如，如果两支队伍（A 和 B）得分相同，而另一支队伍（C）得分更高，你可以说\
  \ A 和 B 都是第二名，也可以说一支是第二，另一支是第三。\n\n- **窗口框架函数**：这些函数作用于窗口框架，即窗口行的动态子集。如前所述，它们可以使用累计或滑动窗口框架。下一节将深入探讨这些内容。\n\
  \n## 窗口框架定义\n\n某些函数可以使用动态窗口框架，而不是固定窗口。\n\n您在窗口的 OVER 子句中，在窗口的 ORDER BY 子句之后指定窗口框架：\n\
  \n```\n<function_name> ([<arguments>])\n    OVER ( [PARTITION BY <part_expr>]\n\
  \            ORDER BY <order_expr>\n            <cumulative_frame_def> | <sliding_frame_def>\n\
  \    )\n```\n\n**累计窗口框架**是窗口的一个子集，它根据窗口内的当前行而增长或收缩。框架包含窗口中当前行之前或之后的行。累计框架定义的语法如下两行：\n\
  \n```sql\n{ROWS | RANGE} BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW\n| {ROWS |\
  \ RANGE} BETWEEN CURRENT ROW AND UNBOUNDED FOLLOWING\n```\n\n第一个表达式取分区中的所有行，或同一排序范围内截至当前行的所有行，而第二个表达式则取从当前行到分区或范围的末尾的所有行。接下来会更详细地描述\
  \ ROWS 和 RANGE。\n\n**滑动窗口框架**是一个行子集，它从当前行之前的 N 行延伸到当前行之后的 M 行。一侧或两侧可以固定到分区的开始或结束。\n\
  \n以下是该语法的三种可能形式：\n\n```sql\nROWS BETWEEN <N> { PRECEDING | FOLLOWING }\n       \
  \   AND <M> { PRECEDING | FOLLOWING }\n| ROWS BETWEEN UNBOUNDED PRECEDING AND <M>\
  \ { PRECEDING | FOLLOWING }\n| ROWS BETWEEN <N> { PRECEDING | FOLLOWING } AND UNBOUNDED\
  \ FOLLOWING\n```\n\n第一种语法用于当你希望创建一个从当前行之前的 N 行延伸到当前行之后的 M 行的框架时，而另外两种是一侧固定为窗口起点或终点的情况。\n\
  \n### 累计窗口定义中的 ROWS/RANGE\n\n在指定累计窗口框架时，我们可以使用 ROWS 或 RANGE，但它们的区别是什么？\n\n- **ROWS**：表示框架的固定一侧延伸到分区的边界：从分区起点到当前行，或从当前行到分区末尾。\n\
  - **RANGE**：表示框架的固定一侧延伸到与当前行在 ORDER BY 值上相同的前行/后行。框架作用于排序中处于相同位置的 precedding/following\
  \ 行。例如，你可以想象在锦标赛列表中依次经过许多积分相同的队伍。\n\n> **重要说明**\n>\n> 提供有关窗口函数的广泛信息超出了本 SQL 分析操作入门指南的范围。这也是\
  \ SQL 在不同数据库中表现并不总是一致的一个领域。我们建议在您所用数据库的文档中搜索“window functions”。\n\n## 总结\n\n在本章中，您学习了\
  \ SQL 的基础知识，并从基础逐步深入到一些相当高级的主题。您还亲身体验了在云端使用 Snowflake 的过程。\n\n您了解了不同的 SQL 命令和类别，在\
  \ Snowflake 中开设了账户，并使用用户和角色创建了您的第一个数据库。随后，您详细学习了编写 SELECT 查询时可能用到的各种子句和运算符，并使用 Snowflake\
  \ 示例数据进行了尝试。然后，您更详细地分析了如何使用 JOIN 子句来混合多个表中的数据。我们在本章结束时介绍了窗口函数，它为我们的查询开辟了新的途径，并使许多复杂的计算变得简单高效。\n\
  \n在下一章《设置您的 dbt Cloud 开发环境》中，我们将创建第一个 dbt 模型，并在云端设置 dbt 和 GitHub。\n\n## 进一步阅读\n\n\
  在本章中，我们描述了最重要的 SQL 主题，但如果您想更深入地学习并精通 SQL，还有更多内容可以阅读。\n\nSnowflake 文档可免费使用，提供了良好的解释和示例，当然也是\
  \ Snowflake SQL 方言的参考知识来源。\n\n您可以从以下页面开始：\n\n- SQL 命令参考：https://docs.snowflake.com/en/sql-reference-commands.html\n\
  - 命令摘要：https://docs.snowflake.com/en/sql-reference/intro-summary-sql.html\n- 查询：https://docs.snowflake.com/en/user-guide/querying.html\n\
  \n\n\n\n"
- "## 设置你的 dbt Cloud 开发环境\n\n在本章中，我们将开始动手使用 dbt。\n\n我们将从设置开发环境开始，首先创建一个带有 dbt 项目仓库的免费\
  \ GitHub 账户，然后创建一个免费的 dbt Cloud 账户来托管你的第一个项目。我们会将 dbt 项目连接到我们在第一章中创建的 Snowflake\
  \ 账户。\n\n一旦我们启动并运行 dbt Cloud，我们将了解 dbt Cloud 与开源版本 dbt Core 之间的区别。在本书的其余部分，我们将使用\
  \ dbt Cloud，因为它无需安装，并且无论你的操作系统是什么，都能提供相同的体验，此外还提供一系列额外的服务和功能。\n\n在本章中，你将开始学习使用 dbt\
  \ 进行数据工程的工作流程，以及为什么版本控制（VC）很重要。\n\n我们将通过试验第一章中看到的一些 SQL 来结束本章，然后查看默认的 dbt 项目，这将让我们介绍\
  \ dbt 中的两个核心函数：`ref` 和 `source`。这些函数是 dbt 工作方式的基础，因为它们以最自然、最透明的方式构建你的 ELT 结构。\n\n\
  到本章结束时，你将能够熟练使用 dbt Cloud，并在学习以下主题后构建一个简单的 dbt 项目来转换数据：\n\n- 设置你的 GitHub 账户\n- 设置你的\
  \ dbt Cloud 账户\n- 比较 dbt Core 和 dbt Cloud 的工作流程\n- 在 dbt Cloud 中试验 SQL\n- 介绍 `source`\
  \ 和 `ref` dbt 函数\n\n### 技术要求\n\n本章只假设你具备基本的 SQL 知识，如果你是新用户，可以从*第 1 章*获取这些知识。\n\n\
  你只需要一个电子邮件地址即可创建免费的 GitHub 账户和免费的 dbt Cloud 账户。\n\n### 设置你的 GitHub 账户\n\n**GitHub**\
  \ 是一项在线服务，它基于 **Git 版本控制系统（VCS）** 提供免费和付费的 VC 访问。\n\n在本章中，我们将简要介绍什么是 VCS 以及为什么我们需要它，然后指导你如何在\
  \ GitHub 上创建账户，最后指导你设置一个仓库来存放你的第一个 dbt 项目。\n\n#### 介绍版本控制\n\n现代代码开发建立在 VC 的基础上，即能够将源代码存储在中央服务器中，以便多个开发人员可以获取代码、进行修改，并将更新版本发送回去存储。*VC\
  \ 允许多人协作处理同一代码库。*\n\nVCS 的主要功能是允许按生成顺序存储所有不同版本的代码，并在任何时间点来回切换任何文件的版本。*VC 还允许轻松识别版本之间的更改。*\n\
  \nVCS 的一个关键功能是允许开发人员通过创建分支来处理*并行的代码开发线*。分支是命名的开发线，开发人员可以在其中开发代码一段时间，然后将**分支**的内容合并到另一个分支中，整合所有更改。\n\
  \n另一个关键功能是自动化或促进来自不同开发人员和开发线的更改合并，以便对同一文件的更改按预期工作。\n\nVCS 的好处在于，开发人员能够以非常安全的方式修改代码，因为如果新版本结果不如预期，你总是可以回到之前的版本。\n\
  \nVCS 还允许开发人员创建多个分支以隔离开发线的更改，使他们能够独立地专注于一组特定的更改，同时也很容易将独立开发的结果以基本自动化的方式合并回主开发线——主开发线是所有开发的综合版本。\n\
  \n识别版本之间更改的能力使同事能够审查来自开发分支的更改，并与更改的作者讨论这些更改。这是一项基本的最佳实践，它提供了更好的代码质量，并将更改的知识和代码的功能传播给参与**代码审查**操作的团队中的每个人。\n\
  \n总之，使用 VC 是现代软件工程的关键推动因素，也是高效团队合作的基石。\n\n#### 基于 Git 的版本控制\n\nVCS 有很多种，但在过去 15\
  \ 年中彻底改变了软件工程格局、实现真正敏捷团队合作的是 git。\n\nGit 是 Linus Torvalds 在 2005 年为支持 Linux 内核的工作而创建的，旨在支持快速管理非线性、分布式的工作。\n\
  \nGit 的核心目标是让分支和合并变得快速简单，其理念与 dbt 相近：让简单的事情易于完成，并让复杂的事情成为可能。\n\n让我们介绍一些基本术语：\n\n\
  - **仓库**（通常简称为 **repo**）是*项目文件的容器*。你的文件位于一个完全普通的文件夹结构中，所有仓库信息都保存在仓库根文件夹下的隐藏 `.git`\
  \ 文件夹中。\n- **提交操作**是保存当前版本的一些文件并为其分配标识符的操作。一次提交操作会将分支指针向前移动一步，从之前的提交移动到正在创建的提交。\n\
  - **提交**表示在执行提交时所有文件在特定时间点的状态，并以唯一的 ID 进行标识。你可以把提交想象成存储所选文件（如果它们相对于先前提交发生了变化）以及指向先前提交的指针。一旦创建，提交就是一个不可变的对象，通过沿着先前提交的链条，可以生成项目在提交时的完整快照。\n\
  - **分支**用于创建*可独立于其他分支演进的替代开发线*。分支是指向提交的命名指针，可以随时间移动。分支从它被创建时的相同点（提交）开始，但随后独立演进。正如名字所暗示的，分支类似于树的结构：分支从树干或某个已存在的分支上分出。每个分支在其他分支执行合并操作之前独立演进。分支指定的提交序列指示了仓库中每个文件的特定版本，代表项目在该分支中的状态。\n\
  - **合并**是将一个分支中文件的更改合并到另一个分支中的操作。合并刚完成后，两个分支的内容是相等的，但它们随后可以继续独立演进。\n- **合并冲突**是指在进行合并操作的两个分支中，某个文件都被修改，而系统无法自动确定如何混合这些更改的情况。此时需要简单的手动干预来编辑并保存冲突文件的最终所需版本。\n\
  \n提交和分支之间的交互方式是：你创建提交以冻结项目在特定时刻的状态，而分支则跟随快照的演进以识别其中一个开发线的当前状态。\n\n关于 git 的文献很多，如果你想深入了解更多，可以从\
  \ https://git-scm.com/ 开始，那里还有一本很棒的免费书籍解释了 git 的所有细节。我开始使用 git 时从中受益良多。\n\n好消息是，使用\
  \ dbt Cloud 时，你不需要对 git 了解太多，因为它有一种由 UI 引导的简化 git 流程，使每个人都能轻松地遵循隐含流程直接工作。我们将在本章稍后的\
  \ *dbt Cloud 工作流程* 部分中，在面对 dbt Cloud 时进一步了解这一点。\n\n#### 创建你的 GitHub 账户\n\n让我们注册\
  \ GitHub，以便你可以根据需要创建任意数量的 git 仓库：\n\n1. 前往 GitHub 主页 https://github.com/。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_76_0.png)\n\
  \n*图 2.1：GitHub 主页*\n\n\n\n\n\n- 2. 点击右上角的**注册**按钮，或者在框中输入你的电子邮件地址，然后点击页面中央的**注册\
  \ GitHub**按钮。\n\n- 3. 在下一页的字段中输入你的信息，然后点击**继续**。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_77_0.png)\n\
  \n图 2.2：GitHub 输入表单\n\n- 4. 完成拼图以验证你是人类，然后点击**创建账户**。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_77_1.png)\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_77_2.png)\n\n图 2.3：GitHub 拼图表单\n\n- 5.\
  \ 在出现的下一页上，你需要输入通过电子邮件收到的代码。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_78_0.png)\n\
  \n图 2.4：GitHub 验证表单\n\n- 6. 欢迎使用 GitHub！设置已接近完成。选择你将与之协作的人数范围；开始时，**仅本人**即可。\n\n\
  ![](img/8868d272a75eee8b407a8e0f3434d10f_78_1.png)\n\n图 2.5：GitHub 欢迎页面\n\n- 7.\
  \ 在下一页上，选择你想使用的工具，然后继续。目前，协作编码就足够了。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_79_0.png)\n\
  \n图 2.6：GitHub 功能选择页面\n\n- 8. 最后，选择你想开始使用的方案。免费方案适合起步，因此你可以通过点击页面底部的“免费继续”来继续。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_80_0.png)\n\n图 2.7：GitHub 方案选择页面\n\n\
  - 9. 现在你真的完成了，你将进入已登录主页。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_81_0.png)\n\
  \n图 2.8：GitHub 已登录主页\n\n在你已登录的主页上，你随时可以创建新的仓库，现在它还会主动建议你创建第一个项目。我们将在下一节中这样做，但现在，如果你愿意，可以花\
  \ 5 分钟完成 README.md 文件来介绍你自己。\n\n## 为 dbt 设置你的第一个仓库\n\n无论你是刚刚创建了 GitHub 账户，还是已经拥有一个带有很多仓库的长期账户，现在都是时候为你的第一个\
  \ dbt 项目创建一个新仓库了：\n\n> **重要说明**\n>\n> dbt 项目是代码和配置组织的主要单元，这些代码和配置协同工作以实现一个目标，每个\
  \ dbt 项目都托管在它自己的基于 git 的仓库中。\n>\n> 好消息是，你可以在 dbt 中拥有任意数量的项目，也可以在 GitHub 中创建任意数量的仓库。\n\
  \n- 1. 让我们从 `https://github.com/` 的已登录主页开始，我们在上一节结束时停在这里（参见*图 2.8*）。在屏幕左上角区域，点击**创建仓库**按钮，或者如果你已经有其他仓库，则点击**新建**按钮。\n\
  \n- 2. 填写**创建新仓库**页面，提供仓库名称和描述，并选择是公开还是私有。*重要的是让仓库保持为空*（没有文件、没有 README、没有许可证），这样\
  \ dbt 会要求你生成默认项目，因此请保持复选框为空并点击**创建仓库**按钮。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_82_0.png)\n\
  \n图 2.9：GitHub 仓库创建页面\n\n恭喜，你现在有了一个空仓库，可以托管你的第一个 dbt 项目。由于是一个空仓库，dbt 会询问你是否要生成默认项目，我们将在后面的*将默认项目添加到空仓库*一节中看到。\n\
  \n## 设置你的 dbt Cloud 账户\n\n在本节中，我们将指导你如何创建 dbt Cloud 账户，然后使用你刚刚在 GitHub 上创建的仓库来创建你的第一个\
  \ dbt 项目。\n\n在创建第一个 dbt 项目时，我们还将配置 dbt Cloud 与 GitHub 之间的集成，因此该过程会多出一些步骤，而这些步骤只需要执行一次。\n\
  \n### 注册 dbt Cloud 账户\n\n你可以轻松注册免费的 dbt Cloud 试用账户，在最初的 15 天试用期结束后，你将可以在付费的团队计划或永久免费的开发者计划之间进行选择。\n\
  \n让我们开始吧：\n\n- 1. 前往 dbt 主页 https://www.getdbt.com/ ，点击两个**免费开始**按钮之一。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_83_0.png)\n\
  \n图 2.10：dbt 主页\n\n- 2. 在打开的页面表单中填写你的详细信息，然后点击**创建我的账户**按钮。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_84_0.png)\n\
  \n图 2.11：dbt 订阅表单\n\n- 3. 你将进入“欢迎使用 dbt Cloud！”页面，该页面会告知你验证电子邮件正在发送中，如果你没有收到第一封邮件，也可以在这里请求重新发送。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_84_1.png)\n\n图 2.12：dbt 欢迎页面\n\n- 4.\
  \ 你将收到一封带有验证电子邮件地址按钮的邮件。点击邮件中的**验证电子邮件地址**按钮，返回 dbt Cloud 网站，完成电子邮件地址验证。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_85_0.png)\n\
  \n图 2.13：dbt 欢迎邮件\n\n进入 dbt Cloud 网站后，你就可以开始创建你的第一个项目，我们将在下一节中介绍。\n\n### 设置你的第一个\
  \ dbt Cloud 项目\n\n要在 dbt Cloud 中设置项目，你必须完成以下步骤：\n\n- 1. 为项目提供一个名称。\n- 2. 选择**数据库（DB）**并提供特定于该数据库类型的连接详细信息。\n\
  - 3. 设置 dbt Cloud 与你的 git 系统之间的集成。仅当这是你使用该 git 系统设置的第一个项目时才需要此操作。\n- 4. 选择一个 git\
  \ 仓库来托管源代码。\n- 5. 可选地，在初始账户设置中，邀请更多用户加入 dbt Cloud 账户。\n\n在本节中，我们假设这是你设置的第一个项目，因此我们还会指导你完成\
  \ dbt Cloud 与你的 git 仓库提供商之间的集成设置。对于未来的 dbt Cloud 项目，则无需再进行该设置。\n\n继续上一节，一旦你点击邮件中的链接验证你的电子邮件地址，你将被自动引导创建一个名为**Analytics**的新项目。\n\
  \n如果你已经有 dbt Cloud 账户，或者你创建第一个项目时中途离开了，你可以通过打开左上角的主菜单，然后选择**账户设置**，再选择**项目**（这是新菜单中的第一个元素，也是你默认会进入的页面）来回到你上次离开的位置。然后，如果你之前已经开始创建\
  \ **Analytics** 项目，则点击它；或者如果你要开始一个新项目，则点击**新建项目**按钮并提供所需项目名称。\n\n然后，按照以下步骤操作：\n\n\
  - 1. 当你通过确认邮件中的链接进入**设置“Analytics”**页面（如下所示）后，点击**继续**按钮。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_86_0.png)\n\
  \n图 2.14：Analytics 项目的 dbt 设置页面\n\n如果你因为正在创建新项目而进入类似的**设置新项目**页面，请点击**开始**按钮，在名为**项目设置**的下一页上提供项目名称，然后点击**继续**按钮。\n\
  \n- 2. 在下一页**设置数据库连接**中，点击你想使用的数据库。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_87_0.png)\n\
  \n图 2.15：dbt 数据库连接选择页面\n\n- 3. 在下一页（同样名为**设置数据库连接**）中，你需要输入连接名称和连接详细信息，以及用户详细信息，这些信息我们将在*图\
  \ 2.16*中看到。\n\n**设置数据库连接**\n\n连接测试成功！点击“继续”保存你的连接并进入下一步。\n\n| 字段 | 值 |\n| --- |\
  \ --- |\n| 类型 | snowflake |\n| 名称 | dbt Book Snowflake |\n\n**Snowflake 设置**\n\n\
  dbt Cloud 将始终从 52.45.144.63、54.81.134.249 或 52.22.161.231 连接到你的数据仓库。请确保在你的防火墙中允许来自这些\
  \ IP 的入站流量，并将其包含在数据库授权中。\n\n| 字段 | 值 |\n| --- | --- |\n| 账户 | op36091.north-europe.azure\
  \ |\n| 角色（可选） | DBT_EXECUTOR_ROLE |\n| 数据库 | DATA_ENG_DBT |\n| 仓库 | COMPUTE_WH |\n\
  | 会话保持活动 | 在 dbt 0.16.0 中添加。使 Snowflake 会话在通常的 4 小时超时限制后仍保持活动。 |\n\n图 2.16：dbt 数据库连接设置页面\n\
  \n对于 Snowflake 连接，重要的是，ACCOUNT 参数只需输入用于访问 Snowflake 服务器的 URL 中的账户部分，省略开头的 http://\
  \ 部分和末尾的 .snowflakecomputing.com 部分。\n\n如果你在第 1 章中完成了设置，则可以按所示输入 ROLE、DATABASE 和\
  \ WAREHOUSE 参数；否则，请输入你想使用的参数。\n\n- 4. 在同一页面上向下滚动后，你可以为开发环境实例输入身份验证凭据。你将在后面的章节中创建其他环境。\n\
  \n\n\n\n## 开发凭据\n\n在此输入你的个人开发凭据（不是部署凭据！）。dbt 将代表你使用这些凭据连接到你的数据库。当你准备将 dbt 项目部署到生产环境时，你可以单独提供生产凭据。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_89_0.png)\n\n图 2.17：dbt 数据库开发凭据输入页面\n\
  \n为简单起见，我们使用了“用户名和密码”，但你也可以从下拉选项中选择“密钥对”来使用私钥，并可选择输入口令。\n\n你可以保留 SCHEMA 的建议值，或选择一个更短的值，只要它对于参与此项目的每个开发者都是唯一的，因为它将用作开发环境中数据库\
  \ schema 的名称或前缀。\n\n对于 TARGET NAME，你可以保留建议的默认值，或将其更改为更能标识开发环境的值，例如 dev，这是我一贯的选择。\n\
  \n为 THREADS 选择一个数字，4 到 8 都是不错的选择。\n\n完成 Snowflake 设置和开发凭据后，点击页面顶部的“测试”按钮以验证连接是否正常（你会得到一条绿色消息，如图\
  \ 2.16 所示），然后点击“继续”按钮。\n\n- 5. 完成与所选数据库的连接设置后，你将进入仓库设置，以保存项目代码。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_90_0.png)\n\
  \n图 2.18：dbt 仓库设置页面\n\n对于仓库的托管位置，你有几种选择。默认是使用 dbt Cloud 管理的仓库，但为了让你了解专业环境中更常用的设置，我们将完成\
  \ GitHub 集成设置。\n\n通过选择**Git 克隆**，你可以设置托管在任何其他 git 提供商上的仓库，例如 Azure DevOps 或 Bitbucket；而通过选择**GitLab**，你可以设置\
  \ GitLab 集成。\n\n选择**GitHub**按钮开始设置。\n\n- 6. 你将被重定向到 GitHub 登录，因此请输入你的凭据并点击**登录。**\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_91_0.png)\n\n图 2.19：GitHub 登录表单\n\n-\
  \ 7. 通过点击**授权 dbt Cloud**按钮，允许 dbt Cloud 应用访问你的 GitHub。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_92_0.png)\n\
  \n图 2.20：GitHub dbt Cloud 应用访问确认\n\n- 8. 确认后，你将返回 dbt Cloud 的“设置仓库”页面。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_93_0.png)\n\
  \n图 2.21：dbt 仓库设置页面\n\n现在，你已经授权 dbt Cloud 访问 GitHub，但尚未配置 dbt Cloud 在你的 GitHub 账户中可以访问哪些内容。该集成作为你个人资料的一部分进行管理，因此让我们点击页面“未找到仓库”部分中提供的个人资料链接。\n\
  \n你也可以通过点击右上角的个人资料图标，从下拉菜单中选择“个人资料”，然后从左侧菜单中选择“集成”来进入该页面。\n\n- 9. 在**集成**页面上，点击**在\
  \ GitHub 中配置集成**按钮。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_94_0.png)\n\n图 2.22：dbt\
  \ 集成页面\n\n- 10. 如果你有一个或多个仓库，你可以选择要授予 dbt Cloud 访问权限的单个仓库，也可以选择**所有仓库**，如下面的截图所示：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_95_0.png)\n\n图 2.23：GitHub 仓库选择表单\n\n\
  选择**所有仓库**很方便，因为以后你不必再回到这里授予其他仓库的访问权限，但对于一个拥有许多与 dbt 无关的项目的账户来说，这可能不是最佳选择。\n\n-\
  \ 11. 一旦你授权 dbt Cloud 访问你在 GitHub 中的仓库，你将回到 dbt Cloud，此时你的 GitHub 集成已配置完成。你无需再次配置。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_96_0.png)\n\n图 2.24：dbt 集成页面\n\n- 12.\
  \ 现在，我们可以返回完成项目配置：从左上角的菜单 ☰ 中选择**账户设置**，然后选择**Analytics**项目。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_96_1.png)\n\
  \n图 2.25：dbt 项目设置封面页\n\n到达此处后，点击**继续**按钮，通过添加仓库来完成设置。\n\n- 13. 现在集成已配置完成，dbt Cloud\
  \ 可以访问你的仓库，你可以通过点击想要导入的仓库来开始导入过程。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_97_0.png)\n\
  \n图 2.26：dbt git 仓库设置页面\n\n- 14. 导入完成后，你会看到一条绿色的**成功导入仓库。**消息，然后你可以点击**继续**进入最后一步。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_98_0.png)\n\n图 2.27：成功认证后的 dbt git 仓库设置页面\n\
  \n- 15. 在完成初始账户设置时，系统还会询问你是否要邀请更多人加入 dbt Cloud 账户。除非你想邀请，否则可以点击“跳过并完成”来结束。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_99_0.png)\n\
  \n图 2.28：dbt 邀请用户页面\n\n- 16. 然后你将进入 dbt Cloud 中已登录的主页。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_100_0.png)\n\
  \n图 2.29：dbt 主页\n\n在这里的截图中，你可以看到我随意地将 `-` 作为公司名称。\n\n恭喜！你现在已经建立了一个功能齐全的专业环境，并使用了顶级组件：Snowflake\
  \ 作为数据平台，GitHub 作为 git 提供商服务，dbt Cloud 作为数据自动化工具。\n\n目前我们的仓库仍然是空的，因此在下一节中，我们将了解如何在我们自己的仓库中创建默认的\
  \ dbt 项目，以便开始探索和测试我们的设置。\n\n## 向空仓库添加默认项目\n\n无论你是刚刚完成初始设置，还是在一个已经拥有多个项目的账户中添加了一个新的空仓库，默认的\
  \ dbt 项目都是检查新项目是否按预期工作的好方法。\n\n因此，我建议你在开始新项目时始终让 dbt 生成默认的 dbt 项目，一旦你确认一切正常并准备好开发自己的项目后，再将其删除。这就是我们将在本节以及本章其余部分要做的事情。\n\
  \n从你已登录的主页，点击“>_ 开始开发”按钮或左上角主菜单 ≡ 中的“开发”项，进入集成开发环境（IDE）。然后按照以下步骤操作：\n\n- 1. 在灰显的\
  \ IDE 上等待几秒钟，并出现一个显示“正在加载 Analytics”（或你的项目名称）的弹出窗口后，你将进入一个带有空项目的 IDE 页面，如下面的截图所示：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_101_0.png)\n\n图 2.30：空项目的 dbt IDE 页面\n\
  \n你可以看到仓库是空的，因为左侧区域你的仓库名下没有任何文件，左上角的仓库操作按钮显示“初始化你的项目”。\n\n如果你在右下角看到红色的编译错误，请不要担心；如果项目中没有任何内容，这是正常的。“Lineage”窗口中的消息也是如此。\n\
  \n要创建默认的 dbt 项目，请点击“初始化你的项目”按钮。\n\n- 2. 默认项目的文件夹和文件会添加到你的开发环境中。你可以在文件资源管理器中看到它们，并点击它们的名称将其打开。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_102_0.png)\n\n图 2.31：带有默认项目的 dbt IDE\
  \ 页面\n\n如果你愿意，可以浏览已添加的文件和文件夹，但我们将在本章后面再回来介绍它们。当你准备好将新文件保存到仓库时，点击**提交…**按钮。\n\n-\
  \ 3. 将出现**编写提交信息**弹出窗口，供你输入提交信息。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_103_0.png)\n\
  \n图 2.32：dbt 提交信息窗口\n\n一条好的提交信息应清晰而肯定地说明自上次提交以来所完成的工作。最好以过去分词开头，例如*已添加*或*已修复*，虽然这不是强制性的，重要的是它能清楚地说明做了什么。点击**提交**按钮将更改保存到你的仓库。\n\
  \n- 4. 一旦你的提交被处理并同步到你的 git 仓库，你将回到 IDE，文件和文件夹将显示为黑色，因为它们不再是新的或已更改的状态。\n\n\n\n\n\n\
  ## 设置你的 dbt Cloud 开发环境\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_104_0.png)\n\n\
  图 2.33：dbt IDE 已打开并正在编辑 SQL 文件\n\n此截图显示大多数文件夹都是空的，只包含 `.gitkeep` 文件。该文件是一个空文件，其唯一作用就是强制\
  \ git 创建文件夹（git 会跳过空文件夹）。\n\n唯一包含实际文件的文件夹是 **models** 文件夹，它在 **example** 文件夹下包含两个示例模型。我们将在本章后面详细研究它们。\n\
  \n请注意，你现在位于 **main** 分支上，这是 GitHub 的新默认分支（之前名为 `master`），并且当你处于 **main** 分支时，你处于只读模式，因此无法进行更改。这是引导式\
  \ git 工作流的一部分，我们稍后会看到。\n\n恭喜，你现在已经完成了开发环境的设置，包括设置默认的 dbt 项目。在接下来的章节中，我们将通过默认项目来更深入地了解\
  \ dbt Cloud 的基础知识。\n\n## 比较 dbt Core 和 dbt Cloud 的工作流\n\n你可以选择使用两个 dbt 版本：\n\n-\
  \ **dbt Core**：这是由 dbt Labs 创建的开源软件，使用 Python 开发，你可以免费下载，并在许多操作系统（如 Windows、Mac\
  \ 和 Linux）上从命令行本地使用。它提供了 dbt 的所有核心功能，也可以用于商业项目。\n- **dbt Cloud**：这是由 dbt Labs 创建的商业软件，提供**软件即服务**（SaaS）体验，包含\
  \ dbt Core 的所有功能，并封装在一个 Web 界面中，使 dbt Core 的功能更易于使用，同时增加了许多在运行实际数据项目时有用的功能。\n\n\
  **dbt Core** 开源产品提供了运行完整 dbt 项目所需的所有功能，其核心功能与 dbt Cloud 产品没有任何差异或限制，以至于你可以在两种产品中的任何一种下执行相同的项目。\n\
  \n**dbt Cloud** 在 **dbt Core** 之上新增的功能旨在让基于 dbt 项目的开发、维护和运营变得更简单、更快速，并且总体上对更广泛的团队来说更具生产力或价值。以下是主要新增功能的列表：\n\
  \n- 强大的基于 Web 的 IDE，支持模型的在线编译和执行\n- 引导式 git 工作流，集成在 Web IDE 中，包括对拉取请求的支持\n- 开发环境的创建和维护，包括\
  \ dbt 版本的选择\n- 执行作业的创建，以可靠的方式运行 dbt 命令\n- 作业执行的调度、监控和告警\n- 数据源新鲜度监控\n- 生成文档的发布\n\
  \n在本书中，我们决定使用 dbt Cloud 开发环境，因为它使 dbt 项目的工作更加容易，不需要任何安装，并且对每个人来说外观和操作方式都相同，与你电脑的操作系统无关。\n\
  \n### dbt Core 工作流\n\n使用 dbt Core 时，你需要在项目根文件夹中从命令行发出命令来与 dbt 交互。dbt Core 只查看本地文件和文件夹，不会也不关心你的项目是否也存储在\
  \ git 或其他 VCS 中。\n\n使用 dbt Core 开发功能的典型工作流如下所示：\n\n1. 在开始新功能之前，如果你使用 VCS 并遵循在开发分支中进行新工作的最佳实践，请转到命令行，为你的\
  \ VCS 运行命令以创建新分支，并将其设置为项目文件夹中的活动分支。\n\n2. 然后，你可以在所选的编辑器中创建或编辑 dbt 模型，并将其保存到 dbt\
  \ 项目文件夹结构中。\n\n3. 要查看当前版本是否能正常工作，且不将更改应用到数据库，你需要在命令行中运行以下命令，并附带相应的开关以仅编译你更改的内容：\n\
  \n   ```\n   dbt compile <eventual switches>\n   ```\n\n   这会为 `target` 文件夹下的每个模型生成或更新编译后的\
  \ SQL 文件。\n\n4. 如果一切正常且没有编译错误，你会在 `target` 文件夹下找到该模型的编译后 SQL 文件。找到文件后，你需要打开它，复制其内容，并将其粘贴到可以在数据库上运行这些内容的地方。对于\
  \ Snowflake，你可以将它们复制到 Snowflake worksheet 中并从那里运行。某些代码编辑器也允许运行 SQL 脚本。\n\n   - 或者，你可以跳过繁琐的第\
  \ 3 步和第 4 步，像第 6 步那样，使用 `dbt run` 命令运行你想要测试的模型，但一旦运行，你将会更改数据库，并且如果不回退代码并再次运行旧版本，你将无法轻松回到之前的版本。请注意，回退并重新运行不适用于增量模型。\n\
  \n5. 你将会看到模型的结果；如果需要更改，请回到第 1 步，重复编辑、编译、打开、复制、粘贴和执行的过程，直到你满意为止。\n\n6. 当你满意并想要将更改应用到数据库时，请在命令行中运行以下命令，并附带相应的开关以运行与当前开发相关的模型：\n\
  \n   ```\n   dbt run <eventual switches>\n   ```\n\n   这会为 `target` 文件夹下的每个模型生成或更新编译后的\
  \ SQL 文件，然后在数据库上运行它，将 SELECT 查询包裹在用于生成视图或表的代码中。\n\n7. 然后，通过发出以下命令来执行你已经声明或编写的测试，并附带相应的开关以测试与当前开发相关的模型：\n\
  \n   ```\n   dbt test <eventual switches>\n   ```\n\n8. 当你对开发感到满意并完成了一组想要保存到 VCS\
  \ 的更改时，回到命令行并发出适当的命令来提交更改。你需要知道相关的命令。\n\n9. 当你准备好完成开发并征求同事的反馈时，在将代码合并到主开发分支之前，请转到你的\
  \ VCS 并开始一个新的拉取请求。当拉取请求获得批准后，合并它，你就完成了。\n\n运行 dbt 项目的典型工作流如下所示：\n\n1. 将你想要运行的代码放入\
  \ dbt 项目文件夹中。这通常是通过检出所需分支来完成的，但任何你选择的方式对 dbt 产品来说都有效。\n\n2. 从命令行运行一系列 dbt 命令，可能使用\
  \ shell 脚本，来执行你想要的操作。一个典型的情况如下：\n\n   - 可选地，运行任何维护数据库、设置数据源访问或将数据导入落地表所需的 `dbt run-operation`\
  \ 命令。\n   - 使用 `dbt source freshness` 命令检查数据源的新鲜度。\n   - 在将要读取的源数据或落地表上运行测试。\n \
  \  - 运行可选的 `dbt snapshot` 命令以存储源中的更改，然后对快照运行可选的测试。\n   - 运行 dbt 模型；即发出 `dbt run`\
  \ 命令。\n   - 然后，使用 `dbt test` 命令对模型运行测试。\n   - 使用 `dbt docs generate` 命令生成文档。\n\n\
  \   这是一个简单的设置，可以让你在实际使用中走得很远。\n\n3. 监控执行期间输出的日志信息，以验证一切正常，并且在每个步骤结束时，你可以决定是否继续执行下一步，直到完成。\n\
  \n   请注意，如果你使用脚本运行这些命令，你应该对输出进行检查，因为如果在某个时刻发生错误，你应该停止运行。\n\n4. 如果你不需要存储日志信息，那么你就完成了；否则，你需要设置一些东西来捕获日志信息并按需存储。\n\
  \n5. 如果你想调度运行，你需要自己设置调度，使用你手头可用的任何技术。在简单的设置中，这通常是通过 `cron` 等调度器来实现的。\n\n6. 如果你想存储或发布数据源新鲜度检查的结果，你需要捕获结果或从执行生成的\
  \ JSON 文件中提取结果并发布它。\n\n\n\n\n\n- 7. 如果你想要发布生成的文档，你需要将已生成且可直接发布的文件复制到某个位置，以便进行发布。一个简单的做法是将它们复制到\
  \ Amazon S3 或类似服务的文件桶中，然后发布给你想要触达的受众。\n\n正如你在前面关于 dbt Core 工作流的描述中所看到的，如果你对命令行、代码编辑器和运行\
  \ SQL 的工具都比较熟悉，那么对模型进行基本修改并运行它们来执行 ETL 过程并不困难。\n\n如果你不想每次都手动完成所有操作，你还需要知道如何编写一些脚本来实现自动化执行；而如果你希望这些脚本根据每一步的情况做出正确响应，你还需要编写逻辑来决定是否继续执行。\n\
  \n如果你还想执行任何我标记为可选但在专业环境中属于常规操作的步骤，比如调度执行、存储执行结果、发布新鲜度检查或文档，那么你需要掌握的知识和付出的努力就远不止手动运行模型那么简单。\n\
  \n即使你独自在一个项目上工作，使用版本控制（VC）和分支也非常有用，我们对此习以为常。当你的项目扩展到两个或更多开发者或环境时，使用 VCS 是保持环境间同步、促进开发者协作的唯一有效方式。\n\
  \n因此，要想超越“单人表演”的模式，你需要熟悉 VCS。\n\n## dbt Cloud 工作流\n\n让我们再看一遍之前为 dbt Core 介绍过的两个工作流，但这次使用的是\
  \ dbt Cloud，以便你了解主要区别。\n\n这是 dbt Cloud IDE 的外观：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_109_0.png)\n\
  \n一个使用 dbt Cloud IDE 开发功能的典型工作流可以如下所示：\n\n- 1. 当你想开始一个新功能时，可以点击 IDE 左上角 VCS 区域中的**“创建新分支…”**按钮来创建新分支，或者通过\
  \ VCS 操作按钮右侧的下拉菜单选择其他分支。\n- 2. 然后，你可以直接在 IDE 中打开、编辑和保存文件。\n- 3. 通过点击**“预览”**按钮在\
  \ IDE 中测试模型，dbt Cloud 会编译并在你的数据库上执行生成的 SQL，然后在 IDE 中显示结果。你也可以查看编译后的 SQL；如果你只想查看\
  \ SQL，可以点击**“编译”**按钮而不是**“预览”**按钮。\n- 4. 继续处理你的模型，在 IDE 中编辑、保存并选择**“预览”**或**“编译”**，直到你满意为止。\n\
  - 5. 当你想在数据库上应用某个模型时，前往 IDE 页面底部的命令行，输入与你在 dbt Core 中相同的 dbt 命令，如下所示，并可使用`switches`来测试与当前开发相关的模型：\n\
  \n  ```text\n  dbt run <eventual switches>\n  ```\n\n在较新版本的 dbt IDE 中，你可以直接点击构建按钮，或从按钮的下拉菜单中选择其中一个运行选项。\n\
  \n- 6. 然后，使用与 dbt Core 中相同的命令运行测试，如下所示，并可使用`switches`来测试与当前开发相关的模型：\n\n  ```text\n\
  \  dbt test <eventual switches>\n  ```\n\n- 7. 当你的开发准备就绪后，点击 VCS 区域中的**“提交”**按钮（当你第一次保存模型更改后该按钮会显示），然后在\
  \ IDE 顶部弹出的窗口中输入提交信息，即可完成，无需离开 IDE。\n- 8. 当你的开发准备好接受反馈并最终发布时，点击 VCS 区域中的**“打开拉取请求”**按钮，这会带你到\
  \ GitHub（或你的 VCS）上的拉取请求创建页面，你可以在其中输入描述并邀请需要的审阅者对新拉取请求进行评论。\n\n如果将我们刚刚描述的 dbt Cloud\
  \ 工作流与之前在 dbt Core 中描述的同一工作流进行比较，我们会发现，虽然逻辑操作和 dbt 命令是相同的，但执行它们所需付出的努力却大不相同。在 dbt\
  \ Cloud 中，你可以在 IDE 中完成所有操作，无需复制粘贴任何代码、查找编译后的文件，也无需在不同工具中编辑或运行编译后的 SQL 查询。\n\n接下来我们看第二个工作流：如何运行\
  \ dbt 项目。在 dbt Cloud 中，你可以在 IDE 中手动运行所有内容（这相当于在开发环境中进行的操作），也可以定义一个可重复的作业在部署环境（如\
  \ QA 或生产环境）中运行（这相当于当你希望调度 ETL 管道执行时要做的操作）。\n\n在 dbt Cloud 中运行项目的工作流如下：\n\n- 1. 要选择运行哪个版本的代码，你需要定义一个环境，并将一个\
  \ VCS 分支与之关联。\n- 2. 要决定在代码上运行哪些 dbt 命令，你需要定义一个作业，按照你希望执行的顺序输入 dbt 命令。这些命令与 dbt Core\
  \ 中的相同，但某些功能（如检查数据源新鲜度或生成文档）可以通过复选框启用。\n\n在创建或编辑作业时，你还可以定义定时执行，dbt Cloud 将根据你的调度运行该作业。\n\
  \n- 3. 当作业启动时（根据你的指令或计划），命令会按你定义的顺序执行，如果出现错误，作业会停止执行。你可以实时查看日志，也可以让作业继续运行，稍后再回来查看结果，并随时可获得完整日志。\n\
  \n  执行结果和日志会自动存储在 dbt Cloud 中，你无需做任何额外操作来启用它们。\n\n- 4. 如果你想调度运行，只需在作业中编辑调度定义，使用普通的\
  \ cron 语法即可。你也可以手动启动作业，或通过 REST 调用启动。\n- 5. 如果你想存储或发布源数据新鲜度检查，请在作业中激活相应的复选框，然后选择一个运行该检查的作业，使其发布到项目的数据源新鲜度页面上。\n\
  - 6. 如果你想发布生成的文档，只需在作业配置中启用特定的复选框，然后决定从哪个作业发布文档。\n- 7. 如果你愿意，你可以启用 dbt Cloud 的通知功能，以便在特定作业运行、被中断或失败时向你发送通知。有一个页面可以控制项目的所有通知。\n\
  \n再次比较 dbt Core 和 dbt Cloud 的这第二个工作流，我们可以看到在这两种情况下，我们都能够获得相同的结果，并且涉及的 dbt 命令也是相同的。但使用\
  \ dbt Cloud，你拥有一个简单的基于 Web 的工具，它能为你提供专业环境中所需的所有功能。\n\ndbt Cloud 还让这些以及其他现代数据自动化功能能够方便地提供给那些没有足够技能或时间来自己构建这些功能的小团队。\n\
  \n我们已经看到，无论你使用的是 dbt Core 还是 dbt Cloud，要执行的 dbt 命令都是相同的。在本书的其余部分，我们将使用 dbt Cloud\
  \ 及其功能，但你可以放心，如果你更喜欢 dbt Core，你也可以运行同样的模型。\n\n现在你已经对 dbt Core 和 dbt Cloud 都有了了解，让我们开始探索如何使用\
  \ dbt Cloud 来使用 dbt。\n\n## 在 dbt Cloud 中试用 SQL\n\n现在你已经设置好 dbt Cloud 并连接到你的 Snowflake\
  \ 数据平台，你可以使用 dbt IDE 发出 SQL 命令并查看结果。“预览”功能让你在开发模型时轻松测试模型，但它也可以用来在数据库上运行任意 SQL。\n\
  \n在本节中，我们将运行前一章中的一些示例，以便你熟悉 dbt 界面；如果你对 SQL 不熟悉，也可以借此尝试一下 SQL。\n\n\n\n\n\n## 从 dbt\
  \ IDE 执行 SQL\n\n让我们开始运行 *第 1 章* Select 部分中的一个查询。\n\n在语句标签中输入以下代码：\n\n```sql\n--\
  \ ** SELECT clause **\n-- Sample SELECT with alias\nSELECT\n    O_ORDERKEY,\n  \
  \  ord.O_CUSTKEY,\n    cust.C_NAME as CUSTOMER_NAME\nFROM SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.ORDERS\
  \ as ord\nJOIN SNOWFLAKE_SAMPLE_DATA.TPCH_SF1.CUSTOMER as cust\n        ON cust.C_CUSTKEY\
  \ = ord.O_CUSTKEY\nlimit 100\n```\n\n在 IDE 中输入代码并按下 **Preview** 按钮后，你应该在几秒钟后看到查询结果，如下图所示：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_113_0.png)\n\n图 2.36：在 IDE 中运行示例查询\n\n\
  ## 探索 dbt 默认模型\n\n让我们列出 dbt 默认项目包含的内容：\n\n- `README.md`：这是一个包含一些说明和指向 dbt 文档的指针的文本文件\n\
  - `dbt_project.yml`：主要配置文件\n- `.gitignore`：一个 git 特定文件，列出要从版本控制中排除的资源，例如 dbt_packages、target\
  \ 和 logs 文件夹\n- 在 `models/example` 文件夹内，我们有两个模型和一个配置文件：\n  - `my_first_dbt_model.sql`：顾名思义，这是第一个模型，它只是由纯\
  \ SQL 组成，将生成两行硬编码数据\n  - `my_second_dbt_model.sql`：这是第二个模型，它读取第一个模型，引入使用 ref 函数引用其他模型\n\
  \  - `schema.yml`：另一个配置文件，提供模型的元数据，并声明我们希望对这些模型运行的测试\n\n如果你打开/选择两个模型之一并点击编辑面板下部的\
  \ **Lineage** 标签，你将看到 lineage 图，它显示了此项目中两个模型之间的依赖关系，如下图所示：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_115_0.png)\n\
  \n图 2.38：dbt 默认项目的 Lineage\n\n让我们更好地分析模型文件夹的内容。\n\n### Analysis of my_first_dbt_model\n\
  \n第一个模型具有以下源代码（我们删除了一些空行和注释）：\n\n```sql\n01    {{ config(materialized='table') }}\n\
  02    with source_data as (\n03        select 1 as id\n04        union all\n05 \
  \       select null as id\n06    )\n07    select *\n08    from source_data\n```\n\
  \n我们可以看到第 3 到 5 行使用了两个非常基本的查询，它们只是返回一个值，并使用 `UNION ALL` 操作符生成两行数据，一行 ID 值为 1，另一行值为\
  \ `null`，`null` 是 SQL 中表示数据缺失的特殊值。\n\n第 2 到 6 行声明了一个名为 `source_data` 的 CTE，由第 7\
  \ 和 8 行使用，在那里我们选择该 CTE 生成的所有内容。\n\n可能最有趣的行是第 1 行，因为它不是 SQL 代码，而是一个内联配置，指示 dbt 将此查询的结果物化为表。如果你预览模型，你将在\
  \ dbt Cloud IDE 中看到其 SQL 的结果，但你不会在你的数据库上生成任何内容。要影响你的数据库，你需要使用 `dbt run` 或 `dbt build`\
  \ 命令运行模型。\n\n> **重要说明**\n>\n> 预览模型将按原样运行模型中的查询，而当 *运行模型* 时，使用 `dbt run` 命令会将 SELECT\
  \ 查询包装上正确的 DDL，以便以所需的方式将模型物化到数据库中，例如表或视图。\n\n### Analysis of my_second_dbt_model\n\
  \n第二个模型具有以下源代码：\n\n```sql\n01    select *\n02    from {{ ref('my_first_dbt_model')\
  \ }}\n03    where id = 1\n```\n\n如果你在尚未使用 dbt `run` 命令之前尝试预览此模型，你将收到错误，因为你在数据库上引用的第一个模型不存在。很可能，你选择的架构名称对应的\
  \ schema 也不存在。\n\n我们将在下一节中使用 dbt `run` 命令，因此目前，我们只需注意到此模型只是从第一个模型中选择所有内容，该模型仅通过其名称使用\
  \ dbt `ref` 函数引用。\n\n大括号符号 `{` 和 `}` 用于在我们的模型中开始和结束 Jinja 代码块。我们将在本书的第二部分更详细地介绍\
  \ Jinja。目前请注意，双大括号符号 `{{` 用于从 Jinja 表达式中打印值。\n\n我们然后期望 `{{ ref('my_first_dbt_model')\
  \ }}` 行会打印出引用包含第一个模型的表或视图的正确 SQL 名称。\n\n### Analysis of schema.yml\n\n此配置文件的第一行如下：\n\
  \n```yaml\n01\n02    version: 2\n03\n04    models:\n05        - name: my_first_dbt_model\n\
  06          description: \"A starter dbt model\"\n07          columns:\n08     \
  \         - name: id\n09                description: \"The primary key for this\
  \ table\"\n10                tests:\n11                    - unique\n12        \
  \            - not_null\n```\n\n第二行声明了配置文件的版本。\n\n第四行声明在接下来的行中，我们正在配置一些模型。\n\n第五行通过其名称标识一个模型，第五行声明了它的描述。\n\
  \n第七行声明我们开始为所选模型配置列。\n\n第八行标识 ID 列（请记住，在 Snowflake 中，如果未加引号，字段名称不区分大小写），第九行为其提供描述。\n\
  \n第 10 行声明我们将列出希望 dbt 对此模型的此列运行的测试，第 11 行请求唯一性测试，而第 12 行请求测试列不为空。\n\n在此之后，我们有一组类似的行来配置测试并为第二个模型提供描述。\n\
  \n## 使用 ref 和 source 连接模型\n\n我们从 lineage 图中看到，此项目有两个模型，并且 my_second_dbt_model 感谢以下代码片段连接到第一个模型：`{{\
  \ ref('my_first_dbt_model') }}`。\n\nref 函数允许你以简单而灵活的方式 *按名称引用 dbt 模型*。当模型编译为 SQL\
  \ 时，`ref` 函数将生成正确的完全限定名称，以便根据环境、用户和配置从正确的表或视图中读取。\n\n以非常相似的方式，source 函数允许你引用一个未由\
  \ dbt 创建的表或视图。通过在 YAML 文件中定义一个 source 系统，指向某个数据库和 schema，以及其下的一个或多个表对象，我们就可以以灵活的方式使用\
  \ source 函数访问它们，如下所示：\n\n```jinja\n{{ source('source_system', 'table_object') }}\n\
  ```\n\ndbt 的卓越之处在于，当我们运行 dbt 模型时，模型中 SQL 和 Jinja 代码的混合会被编译为目标平台的纯 SQL 代码；*dbt 生成部署模型逻辑到数据库所需的所有样板代码*，以便你的逻辑或其结果作为与模型文件名相同的视图或表部署到数据库。\n\
  \nref 和 source 函数是 dbt 工作方式的基石；通过使用它们，我们为 dbt 提供构建整个项目依赖关系图所需的信息，然后 dbt 能够动态生成 SQL\
  \ 代码，使得编写一次模型并部署到多个环境变得简单。\n\n在 dbt 项目中编写 SQL 时，你必须始终通过使用 `ref` 或 `source` 函数引用其他数据库对象，具体取决于它们是否由\
  \ dbt 管理，以便模型在你更改配置或部署到多个环境时自动生成正确的 SQL 名称。\n\n## 运行你的第一个模型\n\n现在我们已经查看了默认 dbt 项目中的模型以及如何将它们串联起来，是时候在我们的\
  \ Snowflake 数据库中创建它们了。为此，我们需要运行 dbt 项目。\n\n要运行项目的全部模型，你只需在命令行中输入以下命令，该命令行可在 dbt\
  \ Cloud IDE 底部找到，或在 dbt Core 的命令行中使用：\n\n```bash\ndbt run\n```\n\n\n\n\n在我们的示例中，您在\
  \ Snowflake 数据库内部，名为 **DATA_ENG_DBT**，应该有一个架构，其名称在设置期间您所选择，示例中为 **RZ**，并且在该架构内部，您应该有两个模型，如上一张屏幕截图所示。\n\
  \n太好了，我们已成功执行模型并生成了所需的产物！\n\n我们做完了吗？没有，制作可工作的模型是一个重要的步骤，但确保它们按预期工作 arguably 更为重要，所以是时候谈谈测试了！\n\
  \n## 测试你的第一个模型\n\n测试的好坏取决于你对问题的理解以及你投入的努力，因此你应该在测试上投入至少与编写代码相同的努力。\n\n能够以简单的方式向代码添加有用的测试是\
  \ dbt 与其他构建数据平台方式相比的关键点，但请注意，测试即代码，过多的测试会带来维护成本，带来一点额外的安全感，而错误或脆弱的测试甚至比不测试某个功能或模型更糟。\n\
  \n我们应该测试什么？如何实现正确的平衡？\n\n我们将在本书的第二部分和第三部分更详细地讨论测试，但现在请注意，测试您对将要转换的数据的假设尤其有用，例如您所依赖的键和字段的唯一性和非空性，以及您认为复杂或不甚了解的业务逻辑的结果。\n\
  \n让我们看看在这个默认项目中我们有哪些测试。\n\n该项目已使用通用 `not_null` 和 `unique` 测试为两个模型中的每一个声明了四个测试。您可以在\
  \ `schema.yml` 配置文件中找到它们的声明，我们在本节开头分析过该文件，其中我们重现了前半部分，包括 `my_first_dbt_model` 模型的测试（第\
  \ 11 行和第 12 行）。\n\n您现在可以使用以下命令运行测试：\n\n```\ndbt test\n```\n\n如果出现错误，请不要感到惊讶；这是有意为之的，这样您可以看到错误是如何报告的，并且它给了我们学习如何修复错误的机会。\n\
  \n*Figure 2.41: The results of the first test run*\n\n从上一张屏幕截图中，我们可以看到我们有一个错误。您可以打开失败测试的下拉菜单并查看摘要，在本例中它告诉我们只有一个行未能通过测试。查看详细信息视图，您可以看到作为测试运行的实际查询，您甚至可以将其复制并粘贴到\
  \ IDE 的新语句面板中以在您的数据库上运行查询。\n\n在本例中，查看模型代码，本节中也曾分析过，我们可以看到它只生成两行，其中一行在 `id` 列的值为\
  \ null。\n\n我们找到了错误所在，所以让我们修复它。\n\n首先，由于这是一个脱离上下文的示例，我们需要就正确情况达成一致：\n\n- 正确的逻辑是 `id`\
  \ 字段不能为空，因此我们需要修复模型。\n- 正确的逻辑是 `id` 字段可以为空，因此我们需要删除测试。\n- 这是一个测试未遵循正确逻辑导致的工作量比不进行测试更大的例子。\n\
  \n让我们假设正确的逻辑是第一种，因此我们想要修复模型。我们将在下一节中这样做。\n\n## 编辑你的第一个模型\n\n在 dbt Cloud 中，您不能在主分支上编辑，因此我们将这样做：\n\
  \n1. 创建一个新分支。\n2. 在分支中编辑 `my_first_dbt_model` 模型。\n3. 运行并测试修改后的项目以检查它现在是否正常工作。\n"
- "## 数据工程的数据建模\n\n在本章中，我们将介绍数据模型是什么以及为什么我们需要数据建模。\n\n在关系型 **数据库** 的基础上，有 **实体-关系（E-R）**\
  \ 模型。因此，您将学习如何使用 E-R 模型来表示描述您拥有或想要收集的数据的数据模型。\n\n我们将介绍 E-R 记法、基数、可选性，以及数据模型中可以拥有的不同抽象级别和键，并将在我们讨论的不同示例中介绍行业中常用的两种不同记法。\n\
  \n我们将解释数据模型的一些特殊用例，例如弱实体或层次关系，讨论它们的特殊性或通常如何实现。\n\n我们还将向您介绍您在数据中会遇到的一些常见问题，如何在可能的情况下避免它们，以及如果无法避免如何识别它们。\n\
  \n到本章结束时，您将对数据工程项目中使用的最重要的建模风格和架构有一个概述，讨论其优缺点。\n\n最后，我们简要讨论了本书的总体方法，并参考我们讨论过的风格和架构。\n\
  \n在本章中，您将学习以下主题：\n\n- 什么是数据建模以及为什么我们需要它？\n- 概念、逻辑和物理数据模型\n- E-R 建模\n- 建模用例和模式\n\
  - 数据模型中的常见问题\n- 建模风格和架构\n\n### 技术要求\n\n本章不需要对 E-R 模型主题的任何先验知识。\n\n本章的所有代码示例均可在 GitHub\
  \ 上获取，网址为 https://github.com/PacktPublishing/Data-Engineering-with-dbt/tree/main/Chapter_03。\n\
  \n### 什么是数据建模以及为什么我们需要它？\n\n数据并不存在于真空中。没有周围知识的纯数据很少有任何价值。\n\n当您可以将数据置于上下文中并将其转化为信息时，数据才具有很大的价值。\n\
  \n### 理解数据\n\n纯数字 1.75，如您在数据库列中找到的那样，本身并不能说明太多。你认为它代表什么？它可能是 1.75 米、千克、加仑、秒，或您想附加的任何单位。\n\
  \n如果不是纯数字 1.75，而是 1.75 米或 1.75 秒，您已经更好地理解它了，但您仍然不能说您真正知道这些数据是关于什么的。\n\n如果您在名为 width\
  \ 的列中有 1.75 米，那么您知道得更多一些，但祝您好运猜出那个数字真正代表什么。如果您还知道它在名为 car、product 或 road 的表中，您可能就能更好地理解它真正代表什么。\n\
  \n通过这个非常简单的例子，您应该开始看到，要真正理解数据意味着什么，仅靠数据是不够的；您需要一些周围的信息来将数据置于正确的视角。\n\n### 什么是数据建模？\n\
  \n**数据建模** 涵盖了为数据提供清晰上下文的活动，在多个层面上进行。\n\n在最常见的解释中，数据模型是数据的视觉表示，在您分析的上下文中。\n\n数据建模的一个重要部分是命名，如我们之前看到的示例中所示，它提供了语义的基础层，而另一个重要方面是解释不同数据片段如何相互关联。\n\
  \n为了有效地传达信息，数据模型必须易于阅读，这意味着将信息量限制在特定细节级别，该级别通常与所考虑的域的大小成反比。因此，通常会提到我们将在本章后面看到的三个细节级别：概念、逻辑和物理数据模型。\n\
  \n视觉数据模型的典型组件如下：\n\n- **实体：** 实体是我们想要分析的概念，我们想要收集数据的感兴趣的事物，例如汽车、订单或页面访问。\n- **属性：**\
  \ 属性是实体的一个属性，我们想要存储其值，例如汽车牌照、客户或交易的总额。\n- **关系：** 关系是两个相互关联的实体之间的连接，并捕获它们如何相关，例如汽车与其所有者之间的所有权关系，或客户与产品之间的购买关系。\n\
  \n这三个组件使我们能够以简洁的方式描述数据和数据之间的关系。我们将在本章的下一节中看到，我们可以用多种记法表达这些信息，并且我们可以借助其他工具来澄清数据语义。\n\
  \n作为示例，我们在下图中展示了一个 E-R 图，它是表示数据模型的常见方式（我们将在下一节中描述）。该示例图描述了两个实体（**Owner** 和 **Car**）以及它们之间的关系（**owns**）。该图还表示了\
  \ **Owner** 的两个属性（**Owner_ID** 和 **Owner_Name**）和 **Car** 的两个属性（**Plate** 和 **Model**）：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_127_0.png)\n\n*Figure 3.1: A sample E-R\
  \ diagram*\n\n诸如 E-R 图之类的视觉模型是一个有用的起点，但不足以传达构建或正确使用数据平台所需的所有信息，许多数据团队都理解它应该由更多信息补充。\n\
  \n### 为什么我们需要数据建模\n\n数据建模的全部意义在于传达信息，以便那些使用建模数据的用户能更好地理解数据和彼此。\n\n\n\n\n\n数据建模通常用于两种主要场景：\n\
  \n-   描述应用程序或项目应当生成或收集哪些数据。在这种情况下，我们在拥有数据之前就构建数据模型。\n-   描述已经存在的数据。在这种情况下，我们根据现有数据逆向推导数据模型。\n\
  \n这一区别至关重要，因为在第一种情况下，你可以根据用例的需求自由地将模型设计成你需要的模样；而在第二种情况下，数据是给定的，也就是说数据已经存在，因此数据模型只能反映数据的实际状况，在建模上没有真正的自由。\n\
  \n在数据仓库中，我们总是从第二种情况入手，因为我们从源系统获得的是“原样”数据；如果源系统没有现成的数据模型，我们就会尽己所知逆向推导出一个描述这些数据的模型。\n\
  \n通常情况下，我们会有多个源系统，它们的数据模型往往大相径庭，即使包含相似的数据，我们仍要设法整合这些数据。典型情况是：对分析师而言，任何一个源系统的模型都不易理解，也都不理想地满足业务需求。\n\
  \n因此，我们最终会转换源数据，构建一个新的目标数据模型，使其更易于理解、尽可能满足业务需求，并能够整合来自不同源系统的所需数据。\n\n一个好的实践是在编写转换代码之前，明确设计这个新的数据模型，至少绘制一个模型，代表作为整合目标的业务概念，这些概念将成为我们转换后的精炼目标。这个模型可以是高度抽象的，只描述业务和主要实体；也可以更加详细，已经体现技术设计。\n\
  \n这与第一种情况不同，因为构建新的目标数据模型是一项受约束的工作；建模者必须始终牢记起始模型，因为新数据模型离源系统越远，就越需要额外信息（如映射表和主数据），也越需要投入工作来转换数据，同时丢失或改变原始数据并引入错误的风险也越高。\n\
  \n拥有显式的目标模型可以简化协作，并为项目提供清晰的目标。它也是分析我们是否遗漏了某些信息、是否需要映射表或业务规则来从源系统数据集过渡到期望目标模型的一个良好起点。\n\
  \n这个目标模型也可以被理解为：支撑所需数据集市中的报表所需的全部业务概念及其关系。事实上，识别目标数据模型中应包含哪些概念的最佳方法，是从期望的报表反向推导出业务概念。\n\
  \n> **注意**\n> 我们会经常提到数据集市和报表，因为这是数据集市最常见的用途；但请记住，数据集市只是提供一组精心设计的表来满足某一用例的一种方式，无论该用例是报表、AI/ML\
  \ 模型、数据导出，还是其他场景。\n\n下一步是识别从这些概念到源系统数据之间所需的连接，查明我们何时缺少某些连接或需要更改键，以及何时需要映射表、业务规则或主数据。\n\
  \n## 补充可视化数据模型\n\n我们已经看到，数据模型是一种沟通工具，而可视化数据模型的简洁特性使其成为传达某些技术信息的绝佳手段；但数据工程项目的其他重要方面，例如语义或业务规则，仅使用可视化数据模型的标准组件是表达不清楚的。\n\
  \n因此，我们建议用其他类型的文档来补充可视化数据模型，以更好地传达这些信息。\n\n描述性文档（如 Wiki 或术语表）是解释数据模型中出现的实体和属性语义、就你在模型中使用的术语含义达成共识，以及解释除了技术实现细节之外必须被理解的重要业务规则的绝佳方式。\n\
  \n另一个重要方面是恰当描述我们如何从数据源推导出新目标数据模型中的数据。这被称为数据血缘。\n\n当你使用 dbt 时，很容易让这些信息与代码保持接近，而且有些信息（例如数据血缘）可以直接从代码本身自动生成。\n\
  \n现在我们已经知道了数据模型是什么、它们的目的以及为什么有用，是时候深入更多细节了。在本章的下一节中，我们将介绍不同类型的数据模型；在后续小节中，我们将研究表达它们的表示法，并看一些示例和问题。最后，我们将介绍不同的建模风格和架构，它们为数据模型的使用提供了框架。\n\
  \n## 概念、逻辑和物理数据模型\n\n数据模型可以用略有不同的表示法来设计，但无论你怎么设计，一个描述数据项目中所有内容的模型都会像你的数据库一样复杂，并且会过于庞大，无法作为沟通工具使用。\n\
  \n此外，在数据工程项目中，你会与不同的人进行讨论，这些讨论聚焦于项目的数据、业务和技术方面不同层次的细节。\n\n我们通常提到以下三种类型的数据模型，它们的详细程度各不相同：\n\
  \n-   **概念数据模型**：这是最抽象的模型，定义*项目领域中将包含什么*，并提供总体范围。\n-   **逻辑数据模型**：该模型提供更多细节，定义*数据将是什么样子*。\n\
  -   **物理数据模型**：这是最详细的模型，精确描述*数据将如何存储在数据库中*。\n\n在接下来的小节中，我们将描述这三种类型的模型。\n\n### 概念数据模型\n\
  \n概念数据模型是技术性最低的模型，因为它用于*在业务层面捕捉最重要的实体和关系*。\n\n该模型识别核心主数据实体及其关系，定义项目领域中将包含什么，并提供总体范围和命名。\n\
  \n绘制它的一个良好起点是识别所需报表中需要的所有实体，澄清这些实体的语义，以便让项目的所有参与者都能清楚理解。\n\n该模型必须使用与现实业务相关的真实业务实体和关系，通常不包含属性或其他技术细节，例如系统特定的名称或属性。\n\
  \n它由数据架构师和业务利益相关者共同创建，并应以最重要的业务规则和约束集合作为补充。\n\n由于概念数据模型描述的是现实中的真实业务，使用现实实体，因此它在涉及同一领域的不同项目中都应当保持有效。\n\
  \n### 概念模型示例\n\n下面的概念数据模型使用 UML 表示法，提供了一个简单、业务级别的订单和退货数据模型：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_130_0.png)\n\
  \n图 3.2：订单和退货的概念数据模型\n\n尽管该模型很简单，它已经能开启与业务的讨论，并捕捉一些有趣的信息，例如退货与订单之间是否存在数据关联，或者一个退货是只能关联一个订单，还是可以关联多个订单。\n\
  \n诚然，我们或许可以通过分析源数据来弄清这些信息；但从数据中挖掘一切既缓慢又容易出错，而且诸如此类的业务规则会随时间变化。\n\n同时拥有数据和来自业务的预期规则，让我们能够在不一致到达报表和用户之前发现它们。\n\
  \n### 逻辑数据模型\n\n逻辑数据模型是一种技术模型，它定义数据将如何组织，但尚未确定特定的技术实现。\n\n该模型开始识别实体的关键属性，例如**自然键（NKs）**和**业务键（BKs）**，这些属性将用于标识实体实例，或连接到其他实体或参考表。它还识别对数据使用至关重要的关键度量和分类。\n\
  \n该模型还根据需要包含操作型和事务型实体、辅助表、映射表和参考表，具体取决于所关注的领域部分。\n\n它通常由数据架构师和业务分析师共同开发，提供一张关于需要开发什么以及如何运作的详细蓝图。它必须以所有不容忽视的业务规则和数据结构规范作为补充。\n\
  \n当存在良好的概念模型时，随着项目逐步深入领域的不同区域，该模型可以被增量构建并细化。\n\n### 逻辑模型示例\n\n下面的逻辑数据模型使用乌鸦脚（crow’s\
  \ foot）表示法绘制，这是 E-R 图最简单、最常用的表示法。该模型仅表示概念数据模型示例中的订单部分：\n\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_132_0.png)\n\
  \n图3.3：订单的逻辑数据模型\n\n你可以清晰地看到，这个逻辑模型比概念模型详细得多，提供了实体的自然键，以及业务或开发人员关注的一些关键属性。它还将订单概念实体拆分成了实现层面的表头（header）和明细（detail）表。\n\
  \n如果我们还有退货（return）部分，就有机会描述订单与退货之间的关系。这种关系可能只存在于表头层级，也可能一条退货明细行引用了特定的订单明细行。\n\n\
  > **提示**\n> \n> 请记住，更改关系的基数（cardinality）可能引发重大变更或需要大量返工，因此*如有疑问，请选择你认为可能需要容纳数据的最宽松约束*（例如一对多而不是一对一，或多对多而不是一对多），如果你预期应使用更严格的约束，则添加一个测试来检查它是否/何时被违反。将这一点推向极致，**Data\
  \ Vault（DV）**方法论始终使用多对多关系，这样你随时准备应对任何意外情况，而且一切都能以相同的方式运作。\n\n## 关于模型详细程度的总体考虑\n\n\
  概念数据模型和逻辑数据模型的详细程度并不是固定的，因此你可以有非常基础、仅标识实体键且非常接近概念模型的逻辑模型。你也可以有非常详细的逻辑模型，将实体拆分为所有现有类型，并展示中间表和支持表。在这个例子中，我们可能有两种类型的订单、一个订单主数据表以及两个将它们映射到主数据的映射表，外加一个用于将本地货币转换为所需通用货币的汇率转换表。\n\
  \n很常见的情况是，先从一个简单、基础的数据模型版本开始，然后为那些被认为困难或不清晰的部分制作详细的图表。另一种常见情况是，只为首先开发的部分绘制详细图表，而如果其他部分可以按照类似的模式开发，则可能不需要这些详细图表。\n\
  \n模型是一种沟通工具，特别用于澄清复杂情况，因此如果在我们的例子中，退货的货币转换与订单类似，并且所有利益相关者已经清楚情况，那么可能就不需要详细图表。\n\n\
  ## 物理数据模型\n\n物理数据模型描述了数据模型在特定数据库中的实际实现。“物理”这个名字意味着它极其详细，实际上与数据库定义一一对应，并且通常可以用来生成实例化数据库的命令，或者通过数据库反向工程来创建。\n\
  \n该模型包括主键（Primary Keys，PKs）、索引以及实例化数据库所需的一切，包括将多对多关系转换为关联表。\n\n在过去，这种详细的模型要重要得多，因为当时数据项目的一个关键部分是从非常昂贵的机器中榨取尽可能多的性能，这些机器需要精确地规划尺寸、购买，然后使用数年。\n\
  \n如今，随着具有近乎无限扩展能力且只需按使用量付费的 SaaS 云数据仓库的出现，焦点已转向快速交付，性能主要通过最佳实践来保证，只有在运行时间或成本超出期望范围时才引起关注。\n\
  \n我们不打算提供物理模型的示例，因为它们由于一些因素而在数据仓库中变得不那么重要了，例如半结构化数据数量的增加，以及现代云数据库在不需要或无法定义诸如索引、关系或唯一性约束等物理数据模型核心内容的情况下也能良好运行。\n\
  \n> **重要提示**\n> \n> 在使用 dbt 时，数据库中的物理表或视图将由 dbt 在运行时根据我们的代码和项目中的元数据为我们创建。我们不需要编写或维护脚本来完成这项工作。\n\
  \n因此，花大量精力手动创建并维护一个物理模型是没有意义的，因为每次我们的 dbt 模型发生变化时，它就会变得过时，我们甚至不会用它来生成表/视图创建脚本。更好的做法是拥有一个稳定的逻辑或概念模型，以及最新的文档，其中包含所生成视图/表的详细信息。\n\
  \n## 绘制数据模型的工具\n\n有许多工具可以帮助你绘制这些模型。\n\n在基础层面，有许多通用绘图工具能够绘制 UML 和/或 E-R 图。它们通常购买起来容易且便宜，但仅限于图的视觉方面。\n\
  \n还有一些现代的基于 Web 的工具，例如 Ellie (https://ellie.ai/)，旨在帮助你在与业务利益相关者讨论概念模型和逻辑模型时实时绘制它们。它们帮助你收集的远不止视觉上的\
  \ E-R 部分，你还可以收集描述、关键字段和元数据，并且它可以让你生成非常有用的业务术语表。\n\n还有一些工具可以帮助你绘制物理数据模型或从数据库反向工程它，例如\
  \ SqlDBM (https://sqldbm.com/)。正如我们所看到的，物理模型对于你将使用 dbt 生成的部分用处不大，但收集源系统的模型可能是有用的。\n\
  \n既然我们知道了可以在不同层级上表达数据模型，以及如何绘制它们，在下一节中，我们将介绍几种表示数据模型的符号。\n\n在接下来的几节中，你会看到一些有助于加深理解的示例，我们还将描述处理数据模型时面临的一些问题。我们将仔细研究不同的建模风格和架构，它们构成了数据模型的使用框架。\n\
  \n## 实体-关系建模\n\n在前面的章节中，我们简要定义了 E-R 模型的三个组成部分：实体、属性和关系。我们还看到了一些使用不同符号（如 UML 或 crow’s\
  \ foot）绘制的 E-R 图。\n\n在本节中，我们将更详细地定义 E-R 模型，并展示如何使用这两种常见符号（UML 和 crow’s foot）来表示不同情况。\n\
  \n### 主要符号\n\n我们已经介绍了 E-R 模型的三个组成部分。在本节中，我们解释它们在 E-R 模型中的可视化表示：\n\n- **实体：** 用包含实体名称的方框表示。\n\
  \  如果显示属性，实体名称位于顶部，通常使用粗体或更大的字体，并在视觉上与其属性分开。\n- **属性：** 在它所属实体的方框内，用属性名称表示，每行一个名称。\n\
  - **关系：** 用连接关系中涉及的实体的线条表示，关系名称可选地靠近线条。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_135_0.png)\n\
  \n图3.4：E-R 符号基础\n\n在上图中，我们以通常用于描述概念模型的详细程度，说明了最常用的两种符号。事实上，在这个例子中，我们没有显示键和属性，但你已经在本章上一节描述逻辑模型的示例中看到了带属性和键的示例。\n\
  \n这个例子还说明了基数，这是 E-R 模型的另一个核心方面，我们将在下一节中描述。\n\n### 基数\n\n关系的**基数**表示关系一侧实体的多少个实例与另一侧实体的多少个实例参与该关系。\n\
  \n让我们使用 crow’s foot 符号来看可能的情况：\n\n- **一对一基数：** 这是一种相当罕见的情况，即每个实体在每一侧只有一个实例参与。\n\n\
  \  一个例子是 **Person has Passport**（人拥有护照）关系：一个特定的人拥有零个或一个（有效的）护照，而一本护照恰好属于一个人。请注意，如果\
  \ **Passport** 实体的语义不是仅记录当前有效的护照，那么我们就会有一对多关系，因为一个人一生中可能拥有多本护照。此外，一些国家允许一个人同时拥有多本有效护照，因此正确理解并描述领域中每个实体的语义非常重要。\n\
  \n\n\n\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_136_0.png)\n\n图 3.5：一对一基数的 E-R\
  \ 示例模型\n\n- **一对多基数**：这是最常见的关系类型，即一侧的一个实体与另一侧的多个实体参与关联。\n\n  例如，**公司** 生产 **汽车**\
  \ 的关系：一家公司生产多辆汽车，而一辆汽车恰好由一家公司生产。后面展示的 **人** 拥有 **汽车** 关系也许是一对多的一个很好的例子，具体取决于 **人**\
  \ 和 *拥有* 的语义。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_136_1.png)\n\n图 3.6：一对多基数的\
  \ E-R 示例模型\n\n- **多对多基数**：这是一种相对少见的情况，即一侧的多个实体与另一侧的多个实体参与关联。\n\n  例如，**学生** 选修 **课程**\
  \ 的关系：一个学生选修一门或多门课程，否则将失去学籍；而一门课程可以被零个或多个学生选修。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_136_2.png)\n\
  \n图 3.7：多对多基数的 E-R 示例模型\n\n下图展示了乌鸦脚记法和 UML 记法中基数的表示方式，包括两种记法中的同一个 **人** 拥有 **汽车**\
  \ 关系。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_136_3.png)\n\n图 3.8：两种不同 E-R 图记法中基数的可视化表示\n\
  \n## 找出基数\n\n要理解基数或在你的模型中找到基数，应该遵循怎样的推理过程？\n\n答案很简单：你考虑关系一侧的一个泛化实体，以及在你的领域中，它与关系另一侧多少个实体相关联。\n\
  \n例如，一个人只用一本护照通关，所以你会说在该领域中基数为 1；但一个人可以同时持有不同国家的多本有效护照，而且大多数人在一生中会持有不止一本护照，只是在任一时刻只有一本有效。改变领域或时间视角可能会改变关系的基数。\n\
  \n在同一个关系的另一侧，一本护照总是对应于一个人。\n\n现在我们已经了解了记法的组成部分，是时候来看第三个维度了：时间视角。它会极大地影响我们将绘制的模型的结果。\n\
  \n## 主键、外键和其他类型的键\n\n在使用数据模型时，一个关键方面是如何标识实体的一个实例，例如某一辆特定的汽车、一家特定的公司或某个人。\n\n能够唯一标识某个实体实例的一个字段或一组字段称为该实体的键。例如，对于汽车，可以是车牌号加所在州，或者车辆识别码（VIN）；对于人，可以是社会安全号（SSN），也可以是个人数据的唯一组合，例如姓名、姓氏、出生日期和出生地。\n\
  \n键有以下几种名称：\n\n- **主键（PK）**：这是能够唯一标识某个实体实例的字段或一组字段。Primary 表示它是用于确保该实体上唯一性约束的键。在存储数据时，它是用于确定两行是否指向同一实例的主要键。\n\
  \n- **自然键（NK）**：这是一种具有业务意义的键，能够在给定上下文中唯一标识实体的实例。NK 也存在于数据库世界之外。它是在表单上打印的内容，或者一个人在现实世界中用来标识实体实例的内容。例如，某个州内一辆汽车的车牌号，或某个系统内一个用户的电子邮件地址。\n\
  \n- **代理键（SK）**：这是一种没有业务意义的键，仅在生成它的系统内部用作键。生成 SK 的一种旧方式是使用序列。更现代的方式是使用哈希函数。SK 通常用于简化标识，尤其在不存在良好的\
  \ NK 或 NK/PK 由多个字段组成时使用。\n\n- **外键（FK）**：这是一个实体中与另一个实体的键相匹配的字段或一组字段。字段名不必相同，只要内容匹配即可。\n\
  \n让我们看看各种特定基数的一些细节：\n\n- **一对一基数：** 在这种情况下，两个实体都可以引用（即外键）对方，但这通常不是一个好主意，因为你将陷入先有鸡还是先有蛋的问题，并且还有出现不一致的风险。最好的解决方案通常是只在两个实体之一中放置外键，通常是可选的实体。如果两侧都是必填的，那么你可以考虑将它们合并成一个实体或表。\n\
  \n  在 **人-护照** 示例中，即使没有护照，人依然存在，但反过来则不然。因此，将 **人** 的外键放在 **护照** 实体中是一个好方案。\n\n \
  \ 注意，这两个一对一实体可能具有相同的主键或自然键，但并非必须如此。\n\n- **一对多基数：** 这是最常见的基数，也是最简单的情况，因为“多”方将有指向“一”方的外键。在我们的\
  \ **公司-汽车** 示例中，每辆汽车都将引用生产它的公司。\n\n  作为说明，可以考虑将数据模型不规范化，把“一”方与“多”方存储在一起，并在每次需要时重复其数据，例如为每辆生产的汽车重复公司信息。在业务系统中几乎不会这样做，因为更新“一”方的信息会非常不方便——你需要修改许多副本，而且数据量会大幅增加。这种做法在报表场景中更常见，并且在某些环境（例如\
  \ BigQuery 上的营销报表和使用 Google Data Studio 时）中相当普遍。\n\n- **多对多基数：** 在这种情况下，模型与现实无法对齐。任一侧实例中的外键只能包含一个指向另一侧的引用，因此无法正确包含多对多关系所需的多个引用。\n\
  \n  为了表示这类关系，除了两个实体的表之外，我们还需要一张额外的表。这张额外的表称为连接表（join table）；它的主键是两个实体主键的组合，并且它是与两个原始实体构成的一对多关系的“多”方。\n\
  \n  这第三张表通常被创建为一个新实体，用来表示多对多关系，同时记录每个关系实例的属性。一个例子是在 **客户** 和 **产品** 之间创建 **订单**\
  \ 实体，或者在具有多对多关系的 **学生** 和 **课程** 之间创建 **选课** 实体。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_139_0.png)\n\
  \n图 3.9：多对多关系的替代表示\n\n虽然关系的基数是数据模型及其实现的主要驱动因素，但时间视角（我们将在下一节讨论）是决定上下文中的实体语义的主要驱动因素之一，因此也会影响模型中所采用的实体。\n\
  \n现在我们已经了解了 E-R 建模的基础，是时候来看一个会极大地影响我们将绘制的模型结果的维度了：时间视角。\n\n## 时间视角\n\n我们尚未讨论的另一个重要方面是：时间视角是否以及如何影响\
  \ E-R 模型。简短的回答是：会的。而且这常常是一个隐式假设，很少被充分解释。\n\nE-R 模型是对现实一部分的抽象，并表达了试图捕获该现实的系统应遵守的约束或业务规则。系统的角色，尤其是其时间视角，会深刻影响实体的语义、哪些规则生效，以及在该上下文中描述实体和关系的模型。\n\
  \n考虑一个管理出租车车队的应用。对于该应用，如果你要描述 **司机** 和 **出租车** 之间的直接关系，你会说它是一对一的，因为一辆出租车需要一名司机，而一名司机同一时间只能驾驶一辆出租车。这几乎是每个使用\
  \ E-R 模型来描述实时对象如何协作以及它们在某一时间点能做什么的应用的观点。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_140_0.png)\n\
  \n图 3.10：实时应用中 **司机** 与 **出租车** 之间的关系\n\n在这种情况下，很明显司机在同一时间开一辆出租车，而一辆出租车在同一时间由一名司机驾驶，因此上限是\
  \ 1，但下限呢？嗯， **司机** 和 **出租车** 在没有对方的情况下也都有意义：司机可以休息一天或作为备用待命，即使出租车没有被驾驶，它也仍然存在。\n\
  \n对于每个仅为了满足业务运行需求而设计、不考虑报表需求的操作型应用，类似的推理同样适用。\n\n在某些情况下，即使在操作型应用中，时间视角也会被嵌入组织已有的中间实体中，例如班次、合同、绩效等。这些实体就是为了随时间跟踪某个关系的各个实例而创建的。\n\
  \n\n\n\n\n我们通过一个约束将两种视角结合起来，以正确表示现实：这些基于时间的实体，相对于那些一次只能出现一次的实体，不应重叠。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_141_0.png)\n\
  \n图 3.11：驾驶员与出租车之间通过工作时段建立的关系\n\n当我们在数据工程项目中工作时，我们通常采用生命周期视角，也就是说，我们关注的是相关实体在整个生命周期中的关系。\n\
  \n在这种数据仓库视角下，我们可能会认为，在我们数据覆盖的时间段内，一位驾驶员会驾驶多辆出租车，而一辆出租车也会被不同的驾驶员驾驶。\n\n因此，**驾驶员**和**出租车**之间的关系将被视为多对多关系。即使我们的数据平台从操作表中捕获变更，而该操作表实现了我们本节前面看到的可选的一对一关系，情况也仍然如此。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_141_1.png)\n\n图 3.12：驾驶员与出租车之间的多对多关系\n\
  \n这种关系与所有多对多关系一样，无法直接在数据库中实现，最终需要通过中间关联表来实现，该表将存储驾驶员驾驶出租车的时段。这将类似于我们之前看到的**工作时段**，但由于它是通过我们捕获操作表上发生的变更而生成的，因此所包含的信息有限，充其量也只能与我们对那张表的变更捕获能力一样精确。事实上，如果我们的复制不完整，我们就有可能丢失一些变更，例如定期导出数据表的情况就是如此。\n\
  \n数据仓库项目的最佳情形是源系统中存在一个时间感知实体，例如**工作时段**，因为我们不会面临漏掉时段的风险，而且很可能收集到更好、更完整的数据。\n\n##\
  \ 不同详细程度下的E-R模型示例\n\n数据模型只是表示真实情况的众多可能方式之一，而且正如我们所看到的，模型合适的详细程度取决于模型的预期用途。\n\n在下面的示例中，我们将展示，学生注册**课程**实例这一相同的情况可以根据模型的抽象程度以多种方式表示。\n\
  \n对于概念模型，一个高层模型可能就足够了，它只说明**学生**可以注册多个**课程**实例，而**课程**可以有多名**学生**注册，如*图 3.13*左侧所示。两侧都是可选的，因为学生可能尚未注册任何课程，或者课程可能还没有学生。\n\
  \n如果我们正在构建数据仓库，我们想要更深入一些，如果这种关系对业务很重要，我们希望尽可能记录关于**学生-课程**关系的更多信息。因此，我们在两个原始实体之间引入一个**选课**实体，以记录学生注册课程的所需信息。\n\
  \n在这种情况下，**学生**和**课程**在与**选课**的关系中都是强制性的，因为如果没有这两个原始实体中的任何一个，后者就没有意义。\n\n初始概念模型中简单的多对多关系已被转换为一种间接关系，分解为两个一对多关系。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_142_0.png)\n\n图 3.13：同一现实，两种不同的详细程度\n\
  \n在下一节中，我们将探讨实体之间另一种常见的关系类型：泛化与特化。\n\n## 泛化与特化\n\n在下图中，我们探讨从不同抽象层次表示模型所引发的另一个主题，以引入表达泛化和特化的表示法。这种表示法使用得不是很广泛，可能是因为缺乏通用知识和标准化，但它非常有用：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_143_0.png)\n\n在这个模型中，我们要表达的是：一个人可能拥有一辆汽车而成为车主，而无论他们是否拥有汽车，他们最终都可以驾驶多辆汽车。这两件事是独立的。一辆汽车总是需要有人拥有它（成为车主），并且它可以被多人驾驶，或者只是停在那里从未被驾驶过。\n\
  \n在左上方的模型中，我们看到了最通用的模型，它可以是一个概念模型。它不区分**人**在与**汽车**关系中的不同角色。\n\n在右上方的模型中，我们突出了一个人可以扮演的两种角色，但省略了**人**实体。这可以作为逻辑模型的起点。\n\
  \n在左下方的模型中，我们介绍了一种表示泛化关系的方式，即泛化实体包含其子类型。这种表示法大多配合鸦爪记号使用。\n\n在右下方的模型中，我们使用了UML表示法，即UML为泛化-特化关系提供的显式表示法。\n\
  \n请注意，涉及超类型和子类型的关系可以以最有利于表示现实的方式来绘制。在同一张图中，一些关系可以指向泛化实体，而另一些关系可以指向特化实体。\n\n在我们的例子中，**驾驶**和**拥有**关系对子类型是有意义的，但如果我们还想绘制一个**人**“乘坐”**汽车**的关系，那么把它指向**人**超类型会更合理，让其他关系继续留在子类型上。\n\
  \n现在你已经了解了数据模型类型以及如何表示一个基本的数据模型，在下一节中，你将看到一些示例以加深理解。稍后，我们还将描述在使用数据模型时遇到的一些问题，并深入了解不同的建模风格和架构，这些风格和架构为数据模型的使用提供了框架。\n\
  \n## 建模用例与模式\n\n本章介绍如何使用E-R图来表示数据工程项目中的概念模型和逻辑模型，但我们已经看到，同样的建模概念也用于为应用程序设计数据模型，以及用于任何我们希望描述不同数据之间关系的地方。\n\
  \n在接下来的几个小节中，我们将介绍一些常见的数据结构用例及其模型、一些已知的问题案例，最后，我们会提及数据模型库这一完整的领域。\n\n### 头-明细用例\n\
  \n处理数据时最普遍的情况之一是头-明细数据结构。它非常常见，我敢肯定你在某个地方已经见过它。\n\n例如，它用于发票和订单，以及几乎所有内含一个文档和多行明细的地方。文档的公共信息放在表头**实体**中，明细行由一个或多个依赖于表头的**弱实体**表示。弱实体是指没有表头实体就没有任何意义的实体，例如没有订单表头的订单行。\n\
  \n下面的模型以不同的详细程度说明了**订单-订单行**的情况，包括**订单**与周边**客户**和**产品**实体的关系：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_144_0.png)\n\
  \n*图 3.15：E-R模型的不同抽象层次*\n\n在该图的左上角，我们有一个非常高层次的概念模型，其中**订单**只是一个单独的实体。在左下角，我们有一个更详细的概念模型，其中**订单表头**已与**订单行**分离，并且与**客户**和**产品**的连接被放置到各自所属的位置。\n\
  \n在右侧，我们有一个逻辑模型，其详细程度与左下角的概念模型相同，但增加了不同实体自然键（NK）的详细信息，以及一些重要属性。\n\n\n\n\n\n看到逻辑模型时，很容易想当然地认为，在**订单**主键上再加一个行号，就可以为**订单行**提供主键。这也许可行，但重要的是为其定义清晰的语义。我们处理弱实体时总会遇到一个问题：它们的键没有真实的业务含义，而且分配的键可能不是稳定键。也就是说，弱实体的某个实例不一定始终拥有相同的键，或者同一个键在不同时间可能表示不同的实例。\n\
  \n下面用一个示例来说明这个问题。假设第一天，我们有一个订单和五个订单行，每个订单行使用订单 ID 加上行号作为键。第二天，我们收到同一订单的更新，现在它只有前三个订单行且未发生变化；这可能还不是问题，因为我们得到的三行与前一天具有相同的主键和内容，只需将第四行和第五行标记为已删除即可。第三天，我们又收到一次更新，现在订单有四个订单行：前三个未变，第四个是一个全新产品。如果我们仅用行号生成主键，这个新行就会得到与第一天第四行相同的主键。\n\
  \n我们是否应认为第一天的第四行又回来了、未被删除且发生了变化，还是应将其视为一个新行？\n\n最好的解决方案是为弱实体提供合适的主键，例如使用稳定的行号；如果第三天出现的新行行号为\
  \ 6，就属于这种情况，因为编号 4 和 5 已经留给了最初使用它们的、现已删除的行。\n\n弱实体很少拥有合适且稳定的键，因为运营系统架构师通常意识不到或不在意这类影响下游系统的后果，而这些下游系统会使用他们生成的数据。\n\
  \n对于来自 JSON 结构的弱实体，情况几乎总是如此。REST API 的典型情况是，嵌入到 JSON 对象中的元素通常没有标识符，更不用说合适且稳定的键了。\n\
  \n遗憾的是，如果我们无法控制数据的生成方式，就没有通用的方法来缓解这一问题；但至少我们可以努力仔细理解所接收数据的语义，并确保自己掌控数据的建模和存储方式。\n\
  \n## 实现说明\n\n原则上，我们可以将**订单**实现为单张表，每个订单行占一行，并在每一行中重复订单头中存储的信息。\n\n这种单表形式也称为反规范化形式，会有不少缺点：例如将相同信息重复多次；更糟的是，难以维护一致性，因为订单头信息的更改需要应用到该订单的所有行。此外，统计某个客户下了多少订单这类查询也会变得复杂。\n\
  \n头-明细（header-detail）方案有一些好处，例如保证一致性、简化维护；而且大多数查询更简单，因为你可以直接查询包含所需信息的表，如果还需要两张表的数据，也可以在那里进行连接。\n\
  \n话虽如此，反规范化形式有时仍被用作生成报表的最终形态，因为它具有无需任何连接的性能优势；对于不擅长数据建模、不会创建连接的人来说，它也非常简单易用。\n\n\
  ## 层级关系\n\n层级关系非常常见，通常是一对多关系的一种特殊情况。它们表示的是看起来像树的数据结构。\n\n常见模式是：一个实例依赖于同一实体的另一个更高级/更大的实例，除非它自身处于最高/最大层级。\n\
  \n它们特殊的原因有两个：通常只构建在一个实体之上，该实体既是关系的起点也是终点；同时它们是递归的，意味着嵌套层级可以无限制，因为你可以不限次数地遍历这种关系。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_146_0.png)\n\n图 3.16：单一和多个层级关系\n\n虽然最常见的表示层级关系的方式是单张表，但也可以只用一张表保存现有实体及其属性，再用第二张表单独表示递归关系。这与我们稍后展示的多对多递归关系类似，只是\
  \ Entity_KEY 字段之间是一对一关系。\n\n这种关系总是由较小的单元（有时称为子级）指向较大的单元（称为父级）来实现。子级是多的一端，因此包含一个指向父级主键的字段，这与所有一对多关系相同。\n\
  \n请注意，在上图中，我们将 **Mother_KEY** 和 **Father_KEY** 字段保留为必填，但这可能只在理论上是准确的。虽然确实每个人都有生物学意义上的父亲和母亲，但现实中有些人的父母可能未知，而且我们显然无法一直追溯到最早的人类。给出的模型在理论上是正确的，但更务实的做法是让这两个关系变为可选，就像我们在通用\
  \ **Entity-Parent** 场景中所做的那样，其中 **Parent_KEY** 的多重性为零或一。\n\n层级关系的一些常见示例如下：\n\n-\
  \ **员工-经理**：每个员工都有一个其依赖的其他员工，即其直线经理，除非该员工是 CEO 或其他不依赖任何人的人；此外，一个员工可能有零个或多个人向其汇报。\n\
  \n- **公司中的组织单元或集团中的公司**：公司通常由若干较小的部分组成，而这些部分又进一步拆分成更小的部分。这些通常被称为组织单元，它们至少构成一个层级结构，即使拥有多个层级也很常见。集团也是如此：集团由公司组成，公司再拆分为组织单元。虽然严格的法律所有权关系可能不是线性的或一对多的，但通常为实现集团管理会建立一个简单的层级结构。因此，请一如既往地注意你所建模内容的语义。\n\
  \n- **类别/子类别**：这是一种非常常见的情况，通常是自上而下的一对多层级结构，因为这样便于通过求和将总计从较低层级汇总到较高层级。在这些情况下，要注意被分类对象之间的关系，并将数字归集到类别上。\n\
  \n    如果你没有简单的自上而下关系，例如一个产品属于多个类别，那么你就不能简单地对数字求和，因为类别与数字之间是多对多关系。这是扇出陷阱（fan trap）的一种情况，我们将在本章后面介绍。\n\
  \n- **物料清单（BOM）**：这在生产组织中很常见。\n\n    BOM 表示构建成品所需的最低层级零部件；例如，想想制造一辆汽车或一件家具所需的一切。\n\
  \n    这些零部件本身就是产品，而且往往组成需要组装或采购的中间产品，从而形成多级层级结构。\n\n- **工作分解结构（WBS）**：WBS 表示完成一个项目所需的全部任务。它通常由逐级缩小的子项目来表示，这些子项目本身也是任务，由此构建出多级的任务层级结构。\n\
  \n在下图中，我们展示了这里讨论的部分案例，其余案例遵循相同的模式：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_148_0.png)\n\
  \n图 3.17：层级关系示例\n\n当一个实体看似可能有多个父级时，通常意味着存在多个层级关系，它们可以拆分为各自独立的单一依赖关系。\n\n例如 Parent-Child（亲子）关系中，每个孩子总是有两位父母，即父亲和母亲；你可以独立表示这两个关系，并回到同一个\
  \ Person 实体上，让它自身拥有两个层级关系：父亲和母亲。另一个类似示例是组织单元：你可能会有不同的汇报线，例如法定所有权或销售组织。\n\n在所有可能面临多个父级的情况中，我建议你仔细寻找多个平行关系。如果确实可以有多个父级，那么这就是多对多关系，因此你需要一张辅助表来保存实体键及其父级，这在多对多关系中是常见做法。下图说明了这一点：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_148_1.png)\n\n图 3.18：多对多层级关系\n\n## 层级结构遍历\n\
  \n在关系型数据库世界中，层级结构一个可能令人困惑的地方在于，这种关系是从下向上表示的——每个实体都指向其最终父级；而对它的遍历通常却是从上向下进行的，从没有父级的顶层实体开始，每一步向下增加一层，并把每个被访问实体的子级挂接到该实体下。\n\
  \n层级结构的遍历通常使用递归代码完成，层级中每向下走一步就是一个递归步骤。下面的伪代码说明了这一过程：\n\n```\n1. Get the initial\
  \ entities, the ones with no parent;\n   process and store them\n```\n\n\n\n\n\n\
  - 2. 获取那些以已存储实体之一为父实体的实体；处理并存储新实体\n- 3. 重复步骤 2，直到不再发现新实体为止；\n\n我们来看一个示例，演示如何为递归实体创建表并对其进行查询以生成层次结构。\n\
  \n以下 SQL 代码将创建一张包含八行数据的表，这些数据代表一家虚拟公司中的员工及其管理关系：\n\n```\nCREATE OR REPLACE TABLE\
  \ DATA_ENG_DBT.PUBLIC.Entity as\nSELECT * FROM ( VALUES\n    (1, null::Number, 'President'),\n\
  \    (2,1,'VP Sales'),\n    (3,1,'VP Tech'),\n    (4,2,'Sales Dir'),\n    (5,3,'Lead\
  \ Architect'),\n    (6,3,'Software Dev Manager'),\n    (7,6,'Proj Mgr'),\n    (8,6,'Software\
  \ Eng')\n) as v (Entity_KEY, Parent_KEY, Entity_Name);\n```\n\n以下 SQL 代码使用递归公共表表达式（CTE）遍历层次结构，并在遍历过程中计算一些有用的信息：\n\
  \n```\nWITH recursive\nENTITY_HIERARCHY as (\n    SELECT\n        Entity_KEY\n \
  \   , Parent_KEY\n    , Entity_Name\n    , 1 as level\n    , '-' as parent_name\n\
  \    , Entity_KEY::string as key_path\n    , Entity_Name::string as name_path\n\
  \    FROM DATA_ENG_DBT.PUBLIC.Entity\n    WHERE Parent_KEY is null\n    UNION ALL\n\
  \    SELECT\n        ENT.Entity_KEY\n    , ENT.Parent_KEY\n    , ENT.Entity_Name\n\
  \    , HIER.level + 1 as level\n    , HIER.Entity_Name as parent_name\n    , HIER.key_path\
  \ || '-' || ENT.Entity_KEY::string as key_path\n    , HIER.name_path || '-' || ENT.Entity_Name::string\
  \ as name_path\n    FROM DATA_ENG_DBT.PUBLIC.Entity as ENT\n    JOIN ENTITY_HIERARCHY\
  \ as HIER ON HIER.Entity_KEY = ENT.Parent_KEY\n)\nSELECT * FROM ENTITY_HIERARCHY;\n\
  ```\n\n下表显示了查询结果：\n\n| E_KEY | P_KEY | 实体名称 | 层级 | 父实体名称 | 键路径 | 名称路径 |\n|---|---|---|---|---|---|---|\n\
  | 1 |  | 总裁 | 1 | - | 1 | 总裁 |\n| 2 | 1 | 销售副总裁 | 2 | 总裁 | 1-2 | 总裁-销售副总裁 |\n| 3\
  \ | 1 | 技术副总裁 | 2 | 总裁 | 1-3 | 总裁-技术副总裁 |\n| 4 | 2 | 销售总监 | 3 | 销售副总裁 | 1-2-4 |\
  \ 总裁-销售副总裁-销售总监 |\n| 5 | 3 | 首席架构师 | 3 | 技术副总裁 | 1-3-5 | 总裁-技术副总裁-首席架构师 |\n| 6 |\
  \ 3 | 软件开发经理 | 3 | 技术副总裁 | 1-3-6 | 总裁-技术副总裁-软件开发经理 |\n| 7 | 6 | 项目经理 | 4 | 软件开发经理\
  \ | 1-3-6-7 | 总裁-技术副总裁-软件开发经理-项目经理 |\n| 8 | 6 | 软件工程师 | 4 | 软件开发经理 | 1-3-6-8 | 总裁-技术副总裁-软件开发经理-软件工程师\
  \ |\n\n表 3.1：递归查询结果表\n\n通过分析递归查询的代码，你可以看到 CTE 由两部分组成：UNION ALL 之前的锚点部分和其后的递归部分。\n\
  \n锚点部分使用查询获取初始行集，并设置计算字段的初始值。\n\n递归查询使用基表与上一次递归迭代内容之间的连接（通过 CTE 的名称访问）来检索下一层实体并更新计算字段。\n\
  \n查看结果，你可以看到，借助这种数据结构与查询，你可以基于层次结构中遍历的完整路径来计算字段。\n\n有关 CTE 的更多信息，请参阅第 1 章。\n\n##\
  \ 预测值与实际值\n\n企业中，预算和预测流程非常普遍，这些流程试图预测未来的一些数据，然后希望在预测变为已知后，通过将不同时期所做的各种预测与实际值进行匹配来分析这些数据。\n\
  \n在这种情况下，模型的一个特殊之处在于，源数据模型和报表数据模型之间通常会创建两个截然不同的数据模型，即使涉及的实体并未改变。\n\n通常，每个时期和每个单位有一个实际值，而对于同一时期和单位，会随着时间的推移产生多个预测值。因此，实际值与预测值之间存在一对多关系。\n\
  \n当我们要将实际值和预测值放在一起进行报表分析时，我们希望在实际值可用后，能够将其与每个预测值相关联。因此，我们可以将它们视为 Figures 实体的两个子类或特化版本，而\
  \ Figures 实体是它们的共同泛化。\n\n在下图中，我们使用 UML 表示法来可视化源数据模型和报表数据模型，后者使用了泛化-特化表示法。需要特别注意的是，泛化并不是\
  \ E-R 意义上的关系，而是表示派生：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_151_0.png)\n\n\
  图 3.19：实际值与预测值的数据模型\n\n特化实体由从泛化实体继承的属性加上该特化实体特有的属性组成。\n\n虽然可以通过多种方式实现报表模型，但最常见的方式是将所有特化实体放在一张表中，为所有特化实体的每个不同属性设置一列。在我们的示例中，兼容的属性（如\
  \ Actuals_Value 和 Forecast_Value）存储在同一字段中，以便更简单地进行使用/比较。\n\n从源数据模型转换到报表数据模型时，我们需要获取现有的实际值，并为同一时期和单位的每个预测值复制一份。这只需通过\
  \ **实际值** 表与 **预测值** 表进行连接即可完成。如果预测的数量和日期已知且可靠，就可以使用业务逻辑生成所需的实际值副本，这种逻辑可以非常简单，例如为已知前几个月的每个预测日期制作一份副本。\n\
  \n## 标准数据模型库\n\n由于数据模型的使用非常频繁，有些人专门从事这一领域，也有多本书籍详细描述了适用于企业普遍或特定行业常见情况的数据模型集合。\n\n\
  这些集合有时被称为数据模型库，其理念是，就像从代码库中挑选函数一样，从这些库中为你的用例挑选合适的模型。\n\n这些模型非常详细，应用也非常通用，由于其规模庞大，并非一目了然，但可以让人放心，它们能够以正确的方式捕获公司数据。这些模型很少被“原样”使用，尤其是在数据工程项目中，但它们总能提供关于不同实体之间如何相互交互的有趣见解。\n\
  \n约翰·吉莱斯（John Gilles）在他的著作*《冰箱里的大象》*中介绍了一系列共 12 个通用数据模型，覆盖了公司的大部分需求。\n\n如果你想了解更多关于数据模型的知识，我建议你从这些模型开始。此外，你可能会有兴趣阅读约翰的书，它也会为你提供关于如何收集信息来构建数据模型的良好解释。你还将学习另一种名为\
  \ DV 的数据工程方法论的基础知识，我们将在本章下一节中简要介绍它，因为它在很多工作方式上与这里介绍的方法论有重叠。\n\n在*延伸阅读*部分，你还会看到对伦恩·西尔弗斯顿（Len\
  \ Silverston）所著的更宏大、更详细的著作*《数据模型资源手册》*的引用，该书提供了一个完整的通用数据模型库。\n\n现在你已经了解了数据模型的类型以及如何表示数据模型。\n\
  \n在下一节中，我们将描述在使用数据模型时面临的一些问题。然后，在本章结尾，我们将介绍不同的建模风格和架构，它们构成了数据模型使用的框架。\n\n## 数据模型中的常见问题\n\
  \n创建正确的数据模型仅仅是提供良好数据平台的开始，因为这些数据模型的用户还必须意识到，由于关系模型操作的性质，可能会出现各种问题。\n\n在接下来的部分中，我们将介绍你会遇到的最常见问题。\n\
  \n\n\n\n\n## Fan trap\n\n**fan trap** 是一种非常常见的问题，每当你在“一对多”关系中进行连接时都可能发生。它不是关系本身的问题，而是你如何使用它的问题。\n\
  \n*fan trap 问题会导致对从一对多关系一侧连接的度量进行的计算出现错误。*\n\n只有当你使用一对多关系一侧的度量，并且在多侧实体的粒度上进行分组/工作时，这才是一个问题。这是因为连接会将度量重复以匹配多侧的基数。\n\
  \n让我们基于以下数据模型来看一个简单的例子。在模型中，我们有公司站点，一些单位驻扎在这些站点。站点有 **Site_surface** 度量，单位有 **Unit_Budget**\
  \ 度量：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_153_0.png)\n\n图 3.20：存在 fan trap\
  \ 风险的数据模型\n\n要理解 fan trap，你必须回忆起，当连接具有一对多关系的两个表时，一侧的出现次数会为与连接中其键匹配的每个多侧实例重复。\n\n\
  连接结束时，你会得到一个表，其行数与多侧相同，一侧的列通过基于匹配键的重复填充。\n\n让我们展示连接以下两个 **Unit** 和 **Site** 表的示例：\n\
  \n| Unit_Name | Site_ID | Budget |\n|-----------|---------|--------|\n| Unit_1 \
  \   | Site_1  | 100    |\n| Unit_2    | Site_1  | 130    |\n\n表 3.2：Unit 表，多侧\n\n\
  | Site_ID | Site_Name | Surface |\n|---------|-----------|---------|\n| Site_1 \
  \ | HQ        | 2500    |\n\n表 3.3：Site 表，一侧\n\n连接 **Site** 和 **Unit** 表在 **Site_ID**\
  \ 键上的结果如下表所示：\n\n| Unit_Name | Site_ID | Budget | Site_ID | Site_Name | Surface\
  \ |\n|---|---|---:|---|---|---:|\n| Unit_1 | Site_1 | 100 | Site_1 | HQ | 2500 |\n\
  | Unit_2 | Site_1 | 130 | Site_1 | HQ | 2500 |\n\n表 3.4：通过 Site_ID 连接的 Unit 和 Site\
  \ 表\n\n正如从连接后的表中可以看到，我们现在有两个度量，来自 **Unit** 表的 **Budget** 未被重复，以及来自 **Site** 表的 **Surface**\
  \ 已为与站点键匹配的每个单位重复。\n\n因此，我们对这些指标进行的计算可能有两种情况：\n\n1. **对一侧度量的总计：** 如果我们尝试对 **Surface**\
  \ 度量计算总计，就会遇到问题。这是因为我们会为连接创建的每个副本求和相同的值：\n\n    i. 如果我们按一侧分组，使用 **Site_ID**，每个总计的值都是错误的，当然总总计也会不正确。\n\
  \n    ii. 如果我们按多侧分组，使用 **Unit_Name** 或 ID，我们实际上没有求和，因为每个 ID 只有一行，我们无法确定每个单位的总面积值是否真的有意义，但我们确信总总计会是错误的，因为它会将面积值乘以与站点匹配的单位数量。思考结果的有意义性，我们能说\
  \ **Unit_1** 和 **Unit_2** 都使用 2,500 的面积吗？我猜不能。\n\n2. **对多侧度量的总计：** 这是最安全的做法。事实上，如果我们尝试对\
  \ **Budget** 度量计算总计，就不会有问题。这是因为 **Budget** 度量没有被连接重复。因此，我们可以按一侧或多侧分组，总计和总总计都将是正确的。\n\
  \n## How can we deal with the fan trap?\n\n简单、有限的特定用例解决方案是在连接它们之前先对多侧按一侧进行分组。这会产生不期望的效果，即删除粒度低于我们开始的一侧的所有维度，但它允许我们在一侧的度量上得到正确的结果。\n\
  \n从我们的示例模型中可以举一个例子，即按 **Site** 对 **Unit** 表进行分组，按站点计算总预算，然后将分组后的表与 **Site** 连接。这将是一个安全操作，因为现在\
  \ **Site** 与分组后的表之间是一对一关系。\n\n处理 fan trap 问题的一个更好的理解和更通用的解决方案是使用 **Unified Star\
  \ Schema (USS)**，如 Francesco Puppini 所著的书籍 *The Unified Star Schema* 中所述。\n\n##\
  \ Chasm trap\n\n**chasm trap** 是我们在报表中面临的另一个非常常见的问题。\n\n本质上，chasm trap 是一种未管理的、通常是无意的\
  \ 多对多 关系。\n\n由于它未被管理，它就变成了一个意外的部分笛卡尔积。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_155_0.png)\n\
  \n图 3.21：Chasm trap 和正确的多对多关系模型\n\n上图说明了 *chasm trap 的场景：有两个表具有一个共同键，而该键在两个表中都不是唯一的。*\
  \ 表 A 和表 B 都对表 X 有外键，因此该键在每个表上都出现多次。请注意，表 X 对于 chasm trap 问题的存在并不是必需的。它在这里是为了显示表\
  \ A 和表 B 具有共同的键，也是因为“共享维度”是我们立即看到 chasm trap 的最常见情况。\n\n在 chasm trap 场景中，与完整的笛卡尔积不同，你会得到一个键约束的笛卡尔积：一侧的行将与另一侧具有相同键的出现次数进行交叉连接，事实上按键进行笛卡尔积。\n\
  \nchasm trap 与真实多对多关系的区别在于，后者你有映射表来将笛卡尔积限制为只有有意义的出现。在多对多情况下，你以一个键进入映射，有指定的 M 行给出实际映射，然后移动到另一个表，在那里你只有一行，最终你拥有的行数与映射表中的行数一样多。这是有意义的，因为映射表是为表示特定关系而构建的。\n\
  \n在 chasm trap 情况下，你以匹配一个表中键的 M 行进入映射表，并在另一个表中找到具有相同键的 N 行，最终在该键上产生 MxN 行的连接，但两个表的行之间没有实际关系，因为共同的外键是为了表达这两个表与具有该键作为主键的表之间的关系，而不是表达这两个表之间的关系。\n\
  \nchasm trap 的经典案例是具有共同维度 X 的两个事实 A 和 B，如上图所示。维度不是必需的，但它通常是使无意的、未管理的间接关系在商业智能 BI\
  \ 工具中被使用的原因。\n\n下图提供了多个无意关系使用导致 OrderDetail 和 ReturnDetail 事实表之间出现 chasm trap 的潜在用法的示例。在一个或多个共同外键上连接这两个表不会产生有意义的结果，因为没有信息说明一侧的实例与另一侧的实例相关：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_156_0.png)\n\n图 3.22：共享维度事实之间 chasm trap\
  \ 的示例\n\n例如，考虑并非产品的每次退货都与该产品的全部订单相关，反之亦然，这就是你在产品代码上进行连接时得到的结果。\n\n结果是 chasm trap\
  \ 导致行数爆炸。爆炸的程度不如完整的笛卡尔积大，因为乘法是按键的计数而不是总计的计数，但它通常非常显著并产生以下问题：\n\n- **性能缓慢：** 将已经很大的表乘以一个非平凡的因子，有可能使计算变得非常缓慢。乘法的近似因子是每个侧键平均出现次数的乘积。如果你在一侧的键平均出现\
  \ 10 次，另一侧平均出现 20 次，你可以预期连接会比起始表大 200 倍。\n- **数字错误：** 由于一侧的度量会为另一侧的每个相同键出现而重复，求和在大多数情况下会完全错误。来自\
  \ X 表的任何度量也是如此，因为它们也会被乘以。\n- **缺少结果：** 如果两个关系之一指向主键是可选的，那么你会丢失一些行，因为在连接中，你只会找到同时存在于两个表中的键。\n\
  \n以订单和退货为例；如果你在不考虑后果的情况下按 Customer 连接它们，你将找不到每个从未退货的客户的任何订单，而对于有退货的客户，你将拥有每个订单乘以该客户的退货次数。\n\
  \n\n\n\n\n## 为什么看起来不错的数据模型会产生这些问题？\n\n简而言之，两个表拥有共同的外键（例如客户键或产品键），很可能在某种程度上是相关的，但仅凭共同键并不足以表达两个表之间可能存在的多重且复杂的关系。在缺乏足够数据的情况下试图提取信息，通常不会产生有意义的结果。\n\
  \n我们来看一个例子：以订单和交付为例，但如果你还考虑相关表（如退货或付款），同样的情况也适用。\n\n它们都有对 Customer、Product 或两者的引用，但按客户将订单和交付关联起来有什么意义呢？将某个客户的每一笔订单与该客户的每一次交付配对，并没有太大意义。\n\
  \n将按客户分组的订单与同一客户的分组交付进行匹配是有意义的，这样你就可以比较该客户的汇总数据，并使用汇总度量进行任何所需计算。汇总表之间的一对一匹配将产生完全良好的结果，而不会产生任何重复。\n\
  \n将单个订单与为交付该特定订单而进行的交付进行匹配也是有意义的，但要实现这一点，你需要比仅用客户键和/或产品键更多的数据。如果交付带有订单键，那么一切就都齐备了，因为你已经有了所需的关联。\n\
  \n如果没有那个键，你或许够幸运，可以利用某些逻辑尝试进行订单与交付之间的精确或近似匹配，但你必须使用比仅用客户和/或产品更多的信息，最终目标是尽量为每笔订单和每次交付进行对应，以免出现重复。数据提供的真实关联是一回事；基于某些启发式方法得到的近似关联又是另一回事。\n\
  \n一如既往，你手中数据的语义以及你希望实现的目标，应当是你最好的指南。不要仅仅因为两个表拥有共同外键就把它们关联起来。\n\n现在你已经了解了数据模型类型、如何表示数据模型以及它可能存在的问题，我们将通过考察不同的建模风格和架构来结束本章，这些风格和架构框定了数据模型的使用方式。\n\
  \n## 建模风格与架构\n\n在本章中，我们介绍了数据建模，并了解了它如何用于描述我们已有或我们希望成为的数据。\n\n数据建模是描述数据的基本工具，但构建数据平台不仅仅是描述平台中托管的数据以及各实体之间的关系。例如，如何将新数据加载到表中，以及如何更新所有中间表以保持数据集市的最新状态，这些关键点都不是数据模型所能捕捉的。\n\
  \n在下一章中，我们将更详细地探讨整体数据生命周期，但在本节中，我们想介绍几种与如何为数据平台开发数据模型密切相关的设计风格。\n\n好消息是，借助 dbt，不存在偏好或限制，你可以采用这些不同范式中的任何一种，并实现最适合的一种。\n\
  \n我们将从金博尔方法开始，它引入了星型模式，而在大多数情况下，这将是供 BI 工具访问数据的数据集市所使用的模型风格。\n\n在开始之前有一点提醒：以下每个主题都已有多本书籍进行详细阐述，所以我们不会试图深入讲授它们。以下各节的目标是让你对可能遇到的某些最常见范式有个初步了解，并讨论它们的一些特性和问题。\n\
  \n在本章末尾，如果你想更详细了解这些主题，会有一个书单。\n\n如果有些主题你不理解或无法完全跟上，不必担心。在本书其余部分，我们还会回到其中的许多主题，因为我们会尝试从这些方法中选取最佳实践。\n\
  \n### 金博尔方法或维度建模或星型模式\n\n在数据仓库领域，最普遍的设计风格大概要算**拉尔夫·金博尔**提出的**维度模型**，它实际上是 BI 领域的事实标准。\n\
  \n维度建模设计的标志性特征是生成一种称为**星型模式**的数据模型结构，它是 BI 工具访问数据的接口。\n\n在星型模式中，包含感兴趣度量的事件或记录所在的**事实表**被若干个维度表包围。**维度表**是一种反规范化的表，包含你要访问的最低细节级别的描述性数据，并且（在金博尔的原始定义中）不应包含度量，以避免扇出陷阱问题。**度量**是你希望用于计算的一个数字。\n\
  \n下图展示了一个围绕 **Order** 事实组织的典型星型模式：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_159_0.png)\n\
  \n图 3.23：星型模式示例\n\n星型模式的主要优点是它的简单性，这使得它非常易于查询，甚至非技术人员也能轻松理解。\n\n其使用的简单模式是：事实表中的每一行都包含指向维度的外键，例如\
  \ **Product_ID** 或 **Country_Code**，以及度量，例如 **Amount_ordered**、**Price** 和 **Discount**。\n\
  \n使用相应的外键连接到所需维度，以检索特定报表中所需的描述性数据，例如产品名称、客户姓名或地址，或增值税代码。\n\n鉴于其简单的结构以及从事实到维度只使用多对一关系，它的查询性能也非常高，因此非常适合为交互式报表提供数据。\n\
  \n维度建模设计风格的目标是从源数据出发构建这些事实和维度。原则上，每个事实都可以与自己的一组具有不同键和列维度相连接，但你可以看到，为每个不同事实设置不同的客户和产品，将会产生大量相似但不同的维度表。\n\
  \n**一致性维度**的概念用于避免维度表的大量增殖，并整合来自不同系统的数据。一致性维度只是一个维度，但它的设计目标是供所有或至少大多数对此类描述性数据感兴趣的事实表使用。因此，它必须处于所需的最小粒度，并且必须包含所有使用该维度的事实所构建的全部报表中感兴趣的所有列。\n\
  \n金博尔数据仓库方法论使用一个以行为事实、列为维度的矩阵，来确定添加一致性维度和事实的优先级。该矩阵描述了围绕每个事实的星型模式内容。\n\n金博尔数据仓库中的数据处理基于对传入源数据进行转换，以构建所需的一致性维度。转换尽可能直接地从数据源转换到事实和维度，而事实和维度就是存储数据的结构。这种事实与维度连接而成的网络，就是金博尔仓库中数据平台的中心数据模型。\n\
  \n> **提示**\n> *数据集市*是数据的一个集合，通常只是所有可用数据中的一小部分，它是为了满足特定业务领域（如某个部门或用例）的 BI 需求而被挑选出来的。\n\
  >\n> 其理念是提供数量有限的表，而且这些表中的属性数量通常也较少，这样分析师更容易找到所需的数据并生成正确的报表。\n>\n> 数据集市通常以少量事实和相关维度的形式出现，以提供一个或多个星型模式，用于在选定主题的上下文中分析这些事实。\n\
  >\n> 可用数据集市的集合是大多数用户访问数据平台的唯一外部接口，因此其中可用表（如事实、维度和属性）的名称和语义都必须清晰明确，这一点极其重要。\n\n我们已经了解了金博尔仓库的主要概念，现在也来看看它的一些缺点：\n\
  \n-   按照原始定义，维度中不应有度量，因为如果维度中有度量并用于涉及事实的计算，你就会总是遇到扇出陷阱。不在产品维度中保留或不使用价格等重要指标是非常受限的，所以实际上我们会在维度中保留度量，此时你应当注意何时会触发扇出陷阱。\n\
  -   根据金博尔规则的另一个限制是，事实只能连接到维度，不能连接到其他事实。但一些最有趣的分析是基于多个事实（如订单与交付或退货）的数据构建的。金博尔星型模式在这里无能为力，因此你可以考虑其他方法论，例如\
  \ USS，或者自行编写 SQL 来生成一个新的可分析事实表。\n-   金博尔方法面向的是业务过程的报表，而非构建企业的数据视图，因此事实和一致性维度可能无法处理除星型模式设计目标之外的其他报表需求。\n\
  -   从数据源加载和存储数据的过程与业务规则的实现深度交织，因为一致性维度和事实既是业务转换的目标，也是所有数据的主要存储。\n\n\n\n\n这导致代码具有高度的复杂性和许多变更原因，因为数据源或业务规则的任何更改都可能导致数据源与最终维度之间的所有转换需要重做，包括修复现有数据。这也很容易蔓延到相关联的事实和维度，导致与业务需求相比代码变更率非常高。随着项目规模变大，这个问题变得更加严重，因为连接到一个维度的更多事实会使该维度发生变更的可能性更大。\n\
  \n- 将主要数据存储在经过多次技术和业务转换后产生的事实和维度中，实际上无法知道原始数据的样子，而且存在风险，因为可能无法撤销错误或变更的业务规则的应用来修正它，或者将新的业务规则应用于旧数据。\n\
  - 当维度还需要与业务规则集成时，存储维度的变更历史并不容易，因此通常维度只存储当前值。\n\nKimball 方法论的最大贡献是星型模式，它是大多数现代数据平台中交付层的事实标准，因为大多数\
  \ BI 工具期望这样的模型，即事实和维度组织在数据集市中。\n\n使用 Kimball 方法论构建平台的核心已有些过时，不再普遍采用，也不是我们建议的方式。\n\
  \n## 统一星型模式\n\nUSS 是 Kimball 星型模式的扩展，它解决了星型模式的一些局限，例如扇出陷阱（fan trap），以及一次查询多个事实时可能面临断层陷阱（chasm\
  \ trap）的风险。\n\nUSS 生成一个单一的星型模式，以 Puppini Bridge 为中心，就像一个超级事实，所有维度围绕在它周围。这使得它对各类用户都极其易用，因为数据模型是固定的且非常简单，同时强大到足以回答比整套数据集市更多的\
  \ BI 问题。\n\n使 USS 能够创新并提供比普通星型模式更强的回答能力的技术解决方案是：超级事实（以其发明者命名的 Puppini Bridge）使用\
  \ UNION ALL 运算符生成一个单一表，该表将所有事实和维度编码在其中，每一行都拥有并可能使用指向所有维度的外键（FK）。\n\n真正的奇妙之处在于，Puppini\
  \ Bridge 中的每一行都编码了用于构建 USS 的所有表之间的完整关系路径。无论它们是事实还是维度，它们之间的关系及其复杂程度都已得到正确处理，其度量值以正确的粒度存储在\
  \ Bridge 中，因此不会出现扇出陷阱或断层陷阱。\n\n我们可以查看 Snowflake 示例数据库中提供的 TPC-H 数据库示例。下图展示了 USS\
  \ 方法中的定向数据模型（ODM），它总是将一对多关系表示为指向查找方向的箭头，即从左（多端）到右（一端），箭头指向关系的一端：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_162_0.png)\n\
  \n图 3.24：TPC-H 数据库的 ODM\n\n下图展示了 TPC-H 数据库的最终星型模式，其中 USS TPC-H 超级事实位于中心，所有现有维度围绕在它周围：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_162_1.png)\n\n图 3.25：TPC-H 数据库的 USS TPC-H\
  \ 超级事实星型模式\n\nUSS TPC-H 超级事实将为任意事实表和维度表中的每一行生成一行，包含所有表中的所有键，以及来自事实和维度的度量。现在你可以理解，每一行都能够编码任意表之间的关系。\n\
  \n当然，单一的 USS 无法编码公司感兴趣的所有表之间的所有可能关系，例如 Nation 和 Region 在 TPC-H 数据库中就有两条可能的路径，但决定并编码一个完整的“首选”关系路径（如\
  \ LineItem => Orders => Customer => Nation => Region）的能力，使得特定 USS 具有稳定且清晰的语义，并产生正确且一致的结果。\n\
  \n在图中，你可以看到一些虚线维度。这些是别名的例子，USS 可以采用这种技术来增加可表示的关系数量，同时消除歧义（**Country** 是客户国家还是供应商国家？）。\n\
  \n我们提供了下图，让你了解在这个简单数据库中，经典的 Kimball 星型模式可能是什么样子。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_163_0.png)\n\
  \n图 3.26：TPC-H 数据库的经典星型模式\n\n你可以看到，许多现有关系无法在星型模式中直接使用或表示，例如 **Customer-Orders**，而是需要通过\
  \ ETL 过程将该关系转换为 **Lineitem** 和 **Customer** 之间的关系。\n\n类似地，如果你不想丢失 **Nation** 和 **Region**\
  \ 之间的关系，就必须构建一个包含 **Nation Hierarchy** 的新维度。由于许多维度并未直接连接到事实，我们需要一个 ETL 过程来遵循正确的关系路径并将结果存储在事实中。\n\
  \n最后一点，我想说明，USS 可以取代任何普通星型模式，因为它在各方面都是一个完全合规的 Kimball 星型模式，只是它还藏有几手妙招。\n\n因此，USS\
  \ 非常适合作为交付星型模式，适用于所有希望让用户能够安全地查询普通星型模式无法实现的广泛事实和维度的情况。这通常被称为**自助式 BI**。\n\n如果你想了解更多关于\
  \ USS 的内容，我建议你阅读介绍它的书：比尔·因蒙（Bill Inmon）和弗朗切斯科·普皮尼（Francesco Puppini）合著的《统一星型模式》（*The\
  \ Unified Star Schema*），本章末尾列出了该书。\n\n## Inmon 设计风格\n\n比尔·因蒙（Bill Inmon）被认为是数据仓库之父，他与\
  \ Kimball 一起塑造了数据仓库构建的大部分方式。\n\nInmon 设计风格的标志性概念是创建企业级、集成且可互操作的数据存储库。Kimball 致力于满足报表需求，而\
  \ Inmon 则试图构建一个描述组织及其业务流程的数据存储库，提供全公司范围内的单一事实来源。\n\n因此，目标是识别描述公司及其运作方式的业务概念（即实体），并将输入源数据转换为正确概念下的同质数据。为了避免冗余并最大化表达能力，数据以**第三范式（3NF）**进行规范化，并且可以在所需概念之间捕获所有有意义的关系。\n\
  \n通过数据集市来交付满足报表需求的数据，这些数据集市是为了满足特定业务领域的信息需求而构建的。数据仓库中存储的业务概念最终与事实和维度非常接近，或者用于生成我们在\
  \ Kimball 星型模式和数据集市中看到的事实和维度。你可以按照 Inmon 设计构建和组织数据仓库，然后按照我们在 Kimball 风格中看到的方式生成事实和维度。\n\
  \n在这种情况下，主要区别在于数据仓库层存储的概念和关系比支持所需事实和维度所需的最小集合更丰富。\n\n可以想象，企业级数据集成的目标需要全企业的努力，以及高层管理人员在较长时期内的承诺。\n\
  \nInmon 模型的一个重要优势是，基于企业级业务概念构建的数据仓库对业务变化以及技术源系统的变化具有极强的适应性。\n\n由于 Inmon 数据仓库表达了公司的业务流程，它拥有回答大多数报表问题的数据，即使是那些最初未确定的问题。\n\
  \n主要缺点是过程规模大且复杂，需要高技能的数据建模人员和数据仓库专家来编写 ETL、维护平台，并在出现新的报表需求时创建/更新数据集市。\n\n另一个缺点是，在经历了大量转换和业务规则的应用之后，数据的主要存储形式是业务概念，这使得很难回溯到原始数据。这使得数据仓库面临返工的需要，并且无法审计原始数据。虽然这与我们在\
  \ Kimball 设计风格中看到的问题类似，但我们必须说，Inmon 业务概念比 Kimball 风格的简单事实和维度保留了更多的信息。\n\n\n\n\n\
  ## Data Vault\n\nDV 是一种由 Dan Linstedt 发明的数据平台构建方法论。\n\n当前版本 **Data Vault 2.0 (DV2)**\
  \ 于 2013 年发布，并随着技术、数据平台和用例的演进而不断发展。\n\nDV2 方法论涵盖了架构、模型、工作方式方法论和实施，但最著名且最具代表性的元素是\
  \ DV 模型。\n\nDV 中最核心的理念是 *所有信息都围绕已识别的业务概念进行聚合*，并且数据通过 BK 进行集成。概念定义和身份管理是 DV2 的两个重要基石。\n\
  \n标志性的 DV 模型基于以下三个核心元素：\n\n- **Hub:** 包含该 hub 概念的 BK 的所有唯一实例\n- **Link:** 包含 hub\
  \ 之间关系的唯一实例，作为 BK 的元组，提供非常灵活的多对多关系\n- **Satellite:** 包含与 hub 或 link 相连的描述性信息随时间的变化\n\
  \nDV 方法论为在特定情况下使用提供了这些核心元素的多种专用版本，外加一些其他元素，例如时点表和桥接表。\n\n下图展示了一个简单的 DV 模型的示例：\n\n\
  ![](img/8868d272a75eee8b407a8e0f3434d10f_165_0.png)\n\n图 3.27：DV 模型示例\n\n正如你从图中可以看到，所有关系都是“一对多”，并且\
  \ hub 一侧的基数始终为一，因为一个关键原则是，某个业务概念的所有键都存储在该概念的 hub 中。\n\nLink 仅记录连接的 hub 之间存在的一种关系，使用它们的\
  \ BK，并允许记录 hub 之间的多对多关系。这使我们能够对所有类型的关系使用相同的结构，即使存储来自不同来源且基数不同的数据，或允许关系从一对多演变为多对多，而无需对模型或代码进行任何更改。\n\
  \n业务域中业务概念的身份存储在专用于该概念的 hub 中，关系使用 link 编码，每个关系一个，描述性数据存储在所需的多个卫星表中。\n\n正如你在图中看到的，卫星是描述性数据容器，可以在我们需要存储新信息时附加到概念上。它们仅依赖于它们所属概念的\
  \ BK。\n\n构建和理解 DV 模型需要对数据建模和 DV 的具体细节进行更高级别的培训，以避免任何可能的陷阱，例如创建以源为中心的 DV 而非以业务为中心的\
  \ DV。\n\n区别于我们之前看到的先前建模风格的另一个关键元素是 DV 架构，如下图所示：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_166_0.png)\n\
  \n图 3.28：DV 架构\n\n来自源系统的外部数据、参考数据和主数据被加载到暂存表中，暂存表不 supposed to 改变传入数据，保持好坏丑全有。我们只应用硬性的业务规则来对齐数据类型、添加元数据并最终应用规范化。其理念是我们必须能够审计从源数据传入的内容。\n\
  \n以下是为什么我不喜欢 DV 的原因列表：\n\n- 创建 DV 平台需要具备 DV2 培训和经验的熟练数据专业人员，这在许多情况下是一个难以满足的硬性要求。\n\
  - DV 模型需要大量的连接才能将所有数据碎片重新组合成正确形式。这通常超出了大多数开发人员的舒适区，对于分析师和业务用户来说更是难以企及。\n- 创建一个合适的\
  \ DV 需要对开发中域的业务概念进行彻底分析。这需要足够高层级的赞助、一定的时间、业务方面的专家可用性，以及有人能够将所有这些整合起来。\n\nDV 方法论能够采纳先前设计风格中的优点，同时增加值得注意的改进：像\
  \ Inmon 一样，它将业务概念置于 DV 组织的核心，但保留了原始数据；它使用事实上的标准 Kimball 星型模式为 BI 工具的用户提供易于使用的数据集市；它通过将源数据的摄取和存储与业务规则的应用分离来创新，从而解耦构建和维护数据平台的两个最具挑战性的方面。\n\
  \n鉴于对业务概念的共同关注，Bill Inmon 的以下引言不会令人惊讶：\n\n> “数据仓库是 DV 2.0 框架中建模企业数据仓库的最佳选择。”\n\n\
  总之，我们可以很容易地说，DV 方法论在开发规模和需求复杂性足以证明所需高技能人员、高度赞助和可见性的可用性时，在所有情况下都极具吸引力。\n\n好消息是 dbt\
  \ 非常适合支持使用 DV 方法论的开发。为了让你快速入门，使你能够快速应用正确的加载模式，有一个名为 dbtvault 的开源 dbt 库可通过 dbt hub\
  \ 在 https://hub.getdbt.com/datavault-uk/dbtvault/latest/ 下载。\n\n## Data mesh\n\n\
  目前数据世界最热门的流行语是 **data mesh**，让我们来看看它。\n\n数据网格方法诞生于一些最具技术实力的公司中，以规避影响大多数数据工程行业的一个非常常见的问题：数据所有权。\n\
  \n痛苦是真实且普遍存在的：负责构建企业级统一数据平台的人对源数据和业务一无所知；他们最多只能得到运行业务应用的同事的薄弱支持，并且几乎没有机会或能力与真正理解业务以及数据在业务侧如何使用和解释的关键人员互动。\n\
  \n实际上，企业中没有人对应用程序生成的数据或与特定业务概念或域相关的数据拥有端到端的责任。没有共同的定义，同一概念的语义可能因所处的域而略有不同。如果你问公司不同部门“客户的定义是什么？”，你会得到相同的答案吗？\n\
  \n难怪这种数据平台产生的内容很少能吸引数据平台本应服务于的业务用户。这不幸是一个经常遇到的问题，尽管 Inmon 自 80 年代以来就告诉我们你需要根据业务概念组织你的数据，而\
  \ DV 完全围绕业务概念和 BK 的理念构建。\n\n如果根本问题是不同的技术团队管理源系统和数据平台，并且业务部门与 IT 部门的目标不一致，有办法解决这个问题吗？\n\
  \n发明数据网格的那些技术密集型公司的解决方案是使用在应用软件交付中行之有效的方法。他们将微服务架构和 DevOps 工作方式应用于数据领域，创建了数据网格。数据网格可以简单地被认为是一种微服务架构，其中微服务是一个数据仓库。\n\
  \n与其试图构建统一的、集中的数据平台，数据网格是由业务单元规模的数据平台构建的，这些平台可以通过已知且定义良好的接口进行交互，具有清晰的语义，每个平台由不同的团队维护。\n\
  \n不同部分的交互通过创建数据产品来管理。\n\n关键点是，提供由单元平台提供的数据产品的团队是运行该业务单元所有其他技术系统的同一团队。\n\n简而言之，数据产品可以是以下之一：\n\
  \n- 一个应用程序，允许使用你没有但提供产品的系统中底层数据做某事。\n\n  一个例子可能是验证客户是否活跃或是否有权下达一定金额的订单。另一个例子可能是面向客户的应用程序，用于估算其房屋价值或为汽车保险报价。\n\
  \n- 一个允许以清晰语义检索数据的接口。\n\n  一个例子可能是市场部门提供最近的客户行为或触点，一个生产站点提供装配线的状态，或物流部门提供其卡车或其交付相关的距离、燃料消耗或二氧化碳排放数据。\n\
  \n数据集市是你已经熟悉的数据产品。\n\n\n\n\n这样做的效果是，这些技术人员能够端到端地掌控数据，并且非常清楚所处理数据的语义。同时，由于提供并维持约定的业务产品持续运行是整个业务单元的责任，团队之间也能形成良好的对齐，从而交付高质量的数据。\n\
  \n这一切听起来很美好，但请记住：分布式系统比集中式系统复杂得多，并且会带来许多单体系统中根本不存在的新问题。\n\n此外，管理敏捷项目、提供可靠的 API、持续运行众多分布式数据管道所需的技能，在大多数传统行业未必能轻易获得，即使是技术密集型公司或大型电商企业也不例外。\n\
  \n虽然现有能力和数据管理成熟度未必达到实施数据网格所需的水平，但我们可以借鉴其中的一些理念，例如从数据产品的角度思考，以及将业务单元的数据所有权扩展到数据仓库领域。\n\
  \ndbt 的灵活性还允许通过清晰的 API 让多个 dbt 项目彼此交互，这些 API 既是一个项目的数据源，也是另一个项目的暴露对象。\n\ndbt 还让你能轻松地让全公司不同部门的人员参与数据项目，并提供强大的文档来阐明所提供数据的血缘关系、数据模型和语义。\n\
  \n## 我们的方法：务实数据平台（PDP）\n\n在对主要的数据建模风格和数据架构进行概述之后，你可能会好奇 dbt 最适合什么，以及我们在本书余下部分将要解释什么。\n\
  \n就工具的适用性而言，你可以放心，dbt 是一个完全不偏不倚的开发工具。尽管其创造者也好，我们也罢，都有自己的个人偏好，但工具本身在生成我们在本章中介绍的任何一种风格时，表现同样出色。\n\
  \n关于本书的方法，我们采取务实的取向，汲取所有现有风格和架构中我们认为最优秀的元素，目标是在充分发挥工具全部能力的同时，尽量降低专业知识门槛。\n\nDV 的主张有很多值得喜欢之处，但它所需要的高层支持、全公司范围的协作、为待开发领域构建概念模型的时间，以及专业知识要求都非常高，往往不易具备，甚至可能根本无法实现。\n\
  \n因此，我们的目标是打造一个采纳一流解决方案的现代数据平台，同时跳过那些在大多数情况下只会抬高门槛却不能带来显著收益的部分。\n\n例如，我们采用的架构与 DV\
  \ 架构非常接近，因为我们相信将摄取与业务规则的应用分离开来是一个关键优势。\n\n我们还采用基于模式的、只插入的全历史摄取方式，这带来了许多好处，而我们在了解\
  \ DV2 之前就已经在使用这种方法了。我们还采纳了 DV 与 Inmon 共同的理念：数据应根据领域的业务概念来组织。同时，我们专注于清晰的业务键定义，并将身份管理视为数据平台的重要组成部分。\n\
  \n我们不去使用 DV 建模，不是因为它没有价值，而是因为它较为复杂，数据社区内外的多数人都不熟悉。我们知道，跳过 DV 建模会使精细化层在面对某些变化时韧性稍差，但这对我们来说是一个可以接受的折中。\n\
  \n在大多数用例中，我们还选择通过包含若干星型模式的数据集市来交付数据；但在某些情况下，比如使用 Google Data Studio 或面向 ML/AI 的用例，我们可能更倾向于交付宽表、反规范化的表。\n\
  \n我们还采用了在*Data Vault*一节中介绍的许多技术，例如哈希，尽管这些技术并非 DV 专属。\n\n总而言之，我们力求务实，因此将我们的方法命名为**务实数据平台（PDP）**。\n\
  \n## 小结\n\n恭喜！现在你已经能够绘制并理解简单的数据模型了！\n\n在本章中，你学习了在不同层面上使用 E-R 模型进行数据建模的基本功，以及如何表达关于数据的关键观点。\n\
  \n现在你已经知道如何看待一些最常见的数据模型模式，不会再被扇出陷阱和深渊陷阱所迷惑。\n\n你已经逐一了解了当前业界使用的各种架构和建模风格，认识了它们的优缺点，并对我们将在本书中使用的方法有了更清晰的认识。\n\
  \n在下一章《分析工程：数据工程的新核心》中，你将获得数据工程的完整图景，然后深入我们使用 dbt 工作的核心——分析工程。\n\n## 延伸阅读\n\n在本章中，我们介绍了许多建模风格和架构。\n\
  \n以下书籍是深入了解这些主题的良好起点。\n\n### 数据建模：\n\n- 一套提供通用数据模型库的丛书：Len Silverston，*《数据模型资源手册》*。John\
  \ Wiley & Sons Inc，2001 年，ISBN 978-0471380238\n\n### Kimball 数据模型：\n\n- 作者自称的权威指南，出自其创造者之手：Ralph\
  \ Kimball 与 Margy Ross，*《数据仓库工具箱》*。Wiley，2013 年，ISBN 978-1118530801\n\n### Inmon\
  \ 设计风格：\n\n- 数据仓库之父的开创性著作：W. H. Inmon，*《构建数据仓库》*。Wiley，2005 年，ISBN 978-0764599446\n\
  \n### 统一星型模式（USS）：\n\n- 这本书首次提出 USS，也是了解扇出陷阱和深渊陷阱等建模问题的优秀资料。其第一部分由 Bill Inmon 本人对\
  \ Inmon 风格进行了更新：Bill Inmon 与 Francesco Puppini，*《统一星型模式：数据仓库与分析设计的敏捷弹性方法》*。Technics\
  \ Publications，2020 年，ISBN 978-1634628877\n\n### Data Vault：\n\n- 关于建模和 DV 的极佳入门书：John\
  \ Giles，*《冰箱里的大象：通过构建以业务为中心的模型迈向 Data Vault 成功的指南》*。Technics Publications，2019 年，ISBN\
  \ 978-1634624893\n- 一本简洁实用的 DV 入门读物，非常适合快速了解：Kent Graziano，*《使用 Data Vault 2.0 进行敏捷数据工程入门》*，ISBN\
  \ 978-1796584936\n- DV2 的圣经，出自其发明者 Dan Linstedt 之手，尽管内容略旧，并未反映该标准中某些最新且重要的变化：Daniel\
  \ Linstedt 与 Michael Olschimke，*《使用 Data Vault 2.0 构建可扩展数据仓库》*。Morgan Kaufmann，2015\
  \ 年，ISBN 978-0128025109\n"
- "## 分析工程：数据工程的新核心\n\n在本章中，我们将理解数据的完整生命周期——从数据在运营过程中产生，到最终被业务用户消费。在这一过程中，我们将分析从原始数据到信息这一数据转化各阶段最重要的细节。\n\
  \n这将帮助我们理解，为什么分析工程——即我们使用 dbt 工作时所聚焦的数据旅程环节——除了仍是数据全生命周期中最富创造力和趣味性的部分之外，已经成为数据工程项目中的关键组成部分。\n\
  \n分析工程将来自公司各个异构数据源的原始数据转化为信息，这些信息可直接用于分析师和业务人员使用的工具，帮助他们获得洞察并支持数据驱动的决策。\n\n随后，我们将讨论现代数据栈以及数据团队如何更好地协作，定义现代分析工程学科和数据团队中的角色，并特别关注分析工程师这一角色。\n\
  \n在本章结尾，我们还将探讨软件工程的最佳实践，这些实践可以帮助使用 dbt 在现代数据栈上工作的数据团队编写更好的代码、更加从容、不再疲于应对突发问题，并向利益相关方提供更好的数据。\n\
  \n在本章中，你将学习以下主题：\n\n- 数据生命周期及其演进\n- 理解现代数据栈\n- 定义分析工程\n- DataOps——数据项目中的软件工程最佳实践\n\
  \n\n\n5. **数据写回**：最终，业务用户可以在报表工具中与数据交互，生成反馈回数据平台的数据。业务用户的输入以及机器学习洞察可以产生数据，这些数据甚至可以被发送回源系统。\n\
  \n这个流程非常通用，几乎可以应用于所有用例，主要的巨大差异在于各步骤的执行方式以及每一步的结果。\n\n> **关于数据网格的说明**\n>\n> *步骤 2\
  \ 和步骤 3*在数据网格的情况下会有所不同，因为不存在中央平台，这些步骤以去中心化的方式执行，并增加了一些机制，允许业务的其他部分访问和使用在其他地方产生的精炼数据。本质上，步骤是相同的，但范围不同，因为我们并不是要构建一个完整的数据平台，也不是所有数据都会以原始源数据的形式出现。在数据网格中，每个部门在设置其本地数据平台时，会用来自其他部门数据平台的更精炼的数据源替换相同的源系统。\n\
  \n在接下来的章节中，我们将更详细地分析这些步骤。\n\n## 数据创建\n\n通常，我们可以确定数据创建的三种主要数据源类型：\n\n- 运营系统，包括**企业资源计划（ERP）**软件以及各类业务系统，更不用说\
  \ Excel 文件，它们仍然是许多业务流程的基石。最有价值且易于使用的数据通常产生于运营系统，运营人员开展日常运营并生成与公司运营保持一致的数据。\n\n-\
  \ 生产系统，包括监控生产现场的 IoT 系统。\n\n  这些系统可以产生大量非常底层的数据，通常使用专门的或行业特定的格式，使得这类数据与公司的业务思维相去甚远，且不太容易使用。\n\
  \n- 在线系统，包括营销和网站，可能产生大量数据。这些系统可以产生高层次的、易于使用的数据，例如在线销售和支付，以及大量关于用户行为的低层次数据，这些数据需要复杂的分析工具。这是机器学习的应用领域之一，用于理解和预测用户行为。\n\
  \n理解我们使用的数据源至关重要，因为数据的速度和结构化程度是决定如何移动和管理数据的关键因素。\n\n你可以理解，处理高容量、半结构化的 Web 数据、来自**变更数据捕获（CDC）**的结构化\
  \ ERP 数据以及不稳定的 IoT 数据是非常不同的。\n\n在本书的第二和第三部分，我们将看到管理不同类型数据的模式。\n\n## 数据移动与存储\n\n\
  如果我们所使用的源系统不提供所需的分析工具，或者我们需要将这些系统的数据与其他系统的数据集成，我们面临的第一个障碍是如何将数据从这些源系统移动到可以进行分析的地方。\n\
  \n如果你的源系统足够标准、足够通用，以至于受到一个或多个数据提取工具（如 Fivetran、Stitch 或 Supermetrics）的支持，那么你可能会很省心，只需配置工具即可让数据流动起来。\n\
  \n在那些你不够幸运，没有现成工具可以快速可靠地为你移动数据的情况下，你需要设计自己的数据移动方案，并考虑以下方面：\n\n- 如何从源系统提取数据\n- 如何将数据从源移动到存储位置\n\
  - 长期在哪里以及如何存储提取的数据\n\n在这三个主要操作中，有很多细微之处需要考虑，我们将在接下来的章节中讨论。\n\n### 从源系统提取\n\n最理想的情况是，源系统被设计为提供数据甚至其状态的外部可观测性，而无需处理系统内部。这意味着系统将其变更发布在一个易于读取的地方（通常是队列）。在这种情况下，我们不会有丢失任何变更的风险，也不必急于获取数据，因为所有数据都在那里供我们读取，并且会保留一段时间。\n\
  \n如果我们能够接入**数据库（DB）**的日志系统，我们也能达到同样的效果，因为数据库本身会将所有正在执行的变更写入其中。\n\n如果源系统在设计时就考虑到了数据导出，那么从源系统提取数据可能很简单；但如果源系统是一个复杂的应用程序，没有构建外部接口，而且可能文档也很少，那么提取数据可能会很困难。\n\
  \n在所有这类情况下，即使我们可以完美地复制数据库表，表本身的设计或应用程序逻辑可能很适合外部可观测性，因为如果不按照应用程序自身的规则进行解释，数据本身可能处于不一致状态。\n\
  \n一个例子是，当系统删除已完成或不再有效的内容时，例如删除已取消的发票，但保留连接发票和订单的多对多表中的条目。\n\n这是一个简单的案例，一旦你弄明白了；但其他案例更为微妙，所需的业务逻辑可能很难仅从数据中反向推导出来。\n\
  \n另一个常见例子是后续变更覆盖了自身，例如文档的不同状态。如果我们获取表的变更（快照）不够频繁，就会错过中间步骤。这可能不是问题，但应该被知晓，因为数据平台将无法提供所有的历史变更，也无法解释在现实世界中观察到的所有行为。\n\
  \n在下面的列表中，我们描述了最常见的提取类型：\n\n- **基于事件的可观测性**：这是指系统本身发布被认为对外部应用有用、需要其知晓的变更。如果设计得当，我们可以保证不会丢失（重要的）中间步骤，并且不存在逻辑不一致。一个特殊情况是，事件不仅仅是数据变更事件，而是*业务事件*，即具有业务意义、定义明确的事件，例如创建订单或接受付款。事件的语义与业务流程相关联，这为事件数据提供了额外的上下文，其信息通常还可以用于最初设计事件时未考虑到的额外用例。\n\
  \n- **变更数据捕获**：这是指我们可以连接到数据库日志或源系统的其他事件流。虽然我们可以确保不会丢失任何中间变更，但仍然可能存在逻辑问题，因为表可能不是为外部系统访问而设计的。这是一个非常常见的用例，能够提供良好且可审计的数据，但我们必须警惕不一致的数据。\n\
  \n- **应用程序编程接口（API）**：另一个非常常见的用例是系统提供 API，我们可以用来从系统读取数据。如今，这些 API 往往是 REST API，以\
  \ JSON 格式提供数据；而在过去，大多数 API 以 XML 格式提供数据。\n\n  在这种情况下，很大程度上取决于 API 设计的质量。最常见的问题源于\
  \ JSON 和 XML 可以表示嵌套结构，且关系在嵌套中一目了然，而 SQL 表只能表示扁平结构。要在 SQL 中表示嵌套结构之间的关系，我们需要至少两个表和一些键。如果我们希望能够随时间管理这种关系，我们需要\
  \ JSON 或 XML 中两种结构的键；否则，我们就无法确定组成关系的每个表中的哪些结构应该添加、更新甚至删除。\n\n- **数据库快照**：这是另一种非常常见的方法，即在特定时间（无论是定期还是按需）从源系统导出数据，可能包含所有数据（全量数据导出），也可能只包含最新数据（自某个已知时间以来创建或更改的数据）。“快照”这个名称提醒我们，数据是特定时间点的“原样”数据。\n\
  \n\n\n\n使用快照时，我们可能会遇到两类问题：我们无法观察到两次快照之间发生并被覆盖的中间变化；虽然我们拥有特定时间点的各个表，但可能会出现逻辑不一致。\n\
  \n如果导出的是全量数据，我们可以追踪删除操作；但如果只导出变更数据，则无法做到这一点。\n\n## 提取数据的临时存储\n\n在上一节中，我们看到从源系统检索/提取数据的方法有很多种。其中一些方法可以直接将数据传输到数据平台的永久存储中，但在许多情况下，提取的数据会在中间存储中保存一段时间。\n\
  \n这样做可能是为了在多次尝试移动数据时保持数据可用，也可能是因为在系统间移动数据的工具与提取数据的工具不同。\n\n以下列表简要讨论了提取后数据最常见的存储方式：\n\
  \n- **直接在数据平台中**：将数据直接存储在目标系统中，无论是直接存储在表中，还是存储在数据湖的文件中，都是最简单、最干净的方式，因为执行提取的工具同时也在系统之间移动数据。\n\
  \n- **文件**：这是最常用也最古老的数据移动方式。包括数据库在内的许多系统都有将数据导出为文件的方式，通常是 CSV 文件，也有 XML 或 JSON 文件。\n\
  \n    当从 API 读取数据的工具不负责将数据传输到目标系统时，这也是一种常见的中间格式。在本地系统环境中，由不同系统分别执行提取和传输是很常见的，但如今这种情况已越来越少，在云应用中更是罕见。\n\
  \n- **队列系统**：当源系统被设计为提供外部可观测性，并自行发送有关其状态或事件的消息时，将数据存储在 Kafka 等队列系统中非常常见。队列用于存储传输中数据的另一个常见场景是物联网或实时场景，队列中存储的数据可被多个系统访问，而数据平台只是这些数据的目的地之一。\n\
  \n## 源系统与数据平台之间的数据移动\n\n在考察数据的实际移动时，我们需要关注两个维度：移动是如何编码的，以及数据在传输过程中发生了什么。\n\n以下是数据移动编码的常见方式：\n\
  \n- **数据移动/加载工具**：随着许多应用程序和服务迁往云端以及在线营销的兴起，能够直接从 API 提取数据的工具大量涌现，这些 API 由众多云应用和数据库提供，用于将数据移动到\
  \ Snowflake 或 BigQuery 等云数据平台。\n\n    Fivetran、Supermetrics 和 Funnel 等工具从诞生之初就面向营销部门，而\
  \ Stitch Data 等其他工具则从 IT 部门/ETL 的角度来处理数据移动问题。它们最终都提供了易于配置的接口，可从数百种常见云服务中检索数据，非技术用户无需学习\
  \ API，也几乎不需要配置访问参数之外的内容即可轻松下载数据。\n\n- **ETL 或数据科学工具：** 使用 Matillion、Talend 或 Informatica\
  \ 等 ETL 专用工具，或 Alteryx、Dataiku 等数据科学工具，是利用现有工具移动数据的有效方式，因为这些工具为处理文件和表中的数据提供了广泛的可能性。使用这些工具时，需要有人编写代码，或使用可视化界面绘制转换逻辑，然后由工具生成/执行。\n\
  \n- **直接编码：** 当有强大的 IT 部门且没有适合该目的的既定工具时，使用 Python 或 Java 等通用编程语言直接编码是一种可能的选择。在本地环境中仍常见的一种方法是使用\
  \ Shell 或 Perl 等脚本，配合 FTP 或临时构建的可执行文件等常见的 Unix 风格工具。\n\n我们将上述工具类别列为处理数据移动的现代方式，但归根结底，你可以选择任何能够满足需求、且无需人工干预即可无误移动数据的方式。\n\
  \n数据移动的第二个维度涉及数据在移动过程中的变化。可选方式如下：\n\n- **数据在移动过程中被转换：** 这就是所谓的“老派”方式，称为 **ETL**，代表\
  \ **提取、转换和加载**。在数据从源系统移动到目标系统的过程中进行转换，在数据量有限、数据库面向行、速度慢、部署在本地且内存和存储受限的情况下，是合理的做法。\n\
  \n    如今，若考虑逻辑转换，这种方式已不那么常见，但在处理提供 XML 或专有数据格式、甚至是复杂 JSON 格式（不适合轻松导入目标平台）的旧系统时，进行格式转换并不少见。\n\
  \n- **数据在移动过程中保持不变：** 这是云时代数据仓库的现代方式，称为 **ELT**，代表 **提取、加载和转换**。\n\n    这种逻辑转变远不止是交换操作顺序，因为新范式是将数据原样加载到数据平台上，然后再进行转换，充分利用现代极为强大的数据库，这些数据库能够提供海量内存、几乎无限的存储和线性可扩展的性能。\n\
  \n在使用 dbt 时，你将在数据迁移后开始处理数据。你可以使用移动数据的工具来开始数据转换，但我们的建议是尽可能保持数据不变，并尽可能接近其在源系统中的状态。\n\
  \n虽然进行任何必要的格式转换是可以的，但我们建议不要在数据移动过程中应用任何业务逻辑。这将尽可能保留原始数据，使其接近操作型系统的记录方式，不受会随时间变化的业务规则的篡改。\n\
  \n尽可能少地改变既简单又快捷，它将为你提供几乎未经修改的数据，这些数据适合对源系统进行良好的审计，并且可以被信任来讲述真实情况，而不是当时业务规则所解读的情况。\n\
  \n保持事实不变，并在后续过程中构建解读。\n\n## 数据平台中的初始存储与永久存储\n\n从源系统提取数据后，你需要将其移动到某个位置，以便以简单有序的方式供数据平台访问，这意味着人们可以轻松找到所需的数据，并且能够获取其有权访问的数据。\n\
  \n当我们讨论刚提取完的数据移动时，这些仍然是相当原始的数据，因此这里所说的“人员”指的是数据架构师、数据科学家和分析工程师，他们将以更持久的方式存储这些数据，并将其转化为信息。\n\
  \n好消息是，从技术层面看，虽然名称众多，但初始和永久存储基本上只有两种选择，而且它们通常简单、便宜，并且彼此相差不大。\n\n在技术层面，永久存储的两种选择是文件或数据库表。\n\
  \n以下是对这两种选择的简要讨论：\n\n- *文件* 是半结构化数据（如 JSON 或 XML，其模式内嵌在数据中且不固定）或非结构化数据（图像、视频、音频、文本文档或几乎没有模式的日志）的首选。\n\
  \n    这类数据也可以存储在数据库中，但可能与数据库结构不太匹配，并且使用 SQL 和典型数据库代码对其进行处理的能力有限，因此最好将其保存在文件中，这样既能保持数据完整，也符合处理此类数据的工具和库的预期格式。\n\
  \n    这种方法通常被称为数据湖，最初之所以这样命名，是为了描述其缺乏固定、标准化结构却能容纳海量数据的特点。尽管缺乏固定、标准化结构的情况依然如此，但如今云数据库能够以相当的价格存储同样数量的数据，因为归根结底，这些数据与你的文件存储在同一个云存储中。\n\
  \n    现代云数据库还允许我们使用 SQL 很好地管理半结构化数据，从而在使用 dbt 处理此类数据时更加得心应手。\n\n\n\n- 本书将采用的方式是尽可能以源系统中的原始形式存储数据，保留数据和关系，并明确标识业务键（也称为自然键），这些键将在后续层中用于驱动系统间的集成。\n\
  - **存储精炼数据：** 在Kimball架构中，其理念是将传入数据转换为事实表和一致性维度，对传入数据应用必要的业务规则，使其符合某种约定的方式来表示所需信息。虽然将事实表和维度作为数据平台的最终层来支撑报表几乎已成为常态，但我们并不建议像Kimball架构所倡导的那样将事实表和维度作为主要数据存储，因为那些结构中的数据可能已经远离原始数据，经过多次复杂业务规则的应用而发生了改变。需要重申的是，在业务规则出错或变更时，追溯到原始数据可能非常困难，甚至不可能。\n\
  \n我们对此的建议是尽可能“原样”移动和保存原始数据，仅执行非常重要的任务：通过清晰命名和测试主键、业务键及其变化方式，来正确识别概念及其身份，因为这是正确存储历史数据的三个关键方面。\n\
  \n事实上，如果你希望能够识别并存储某个概念的变化，你需要知道该概念的实例是什么，以及如何区分该概念的两个实例是同一概念实体的两个版本，还是两个独立的实体。\n\
  \n例如，能够识别“Person”表中的两行是关于两个不同的人，还是同一个人的两个版本（即同一个人经历某些变化后的状态），这一点至关重要。\n\n## 数据转换\n\
  \n一旦你将原始数据从源系统移动到数据平台，并以保留所有所需历史数据的方式存储，这些数据很可能还远未达到可用于报表的正确格式。\n\n正如我们在上一节中所见，你很可能先将数据以某种初始位置和格式落到平台上，再以另一种位置和格式永久存储，最后生产出业务用户通过BI工具使用的内容。\n\
  \n这使我们能够为你的数据识别出以下三个主要层次：\n\n- **原始数据：** 这是最初加载到数据平台上的数据，即其在源系统中的状态，或由迁移工具传输过来的状态。\n\
  - **历史数据：** 这是你决定以何种方式、在何处保留数据的完整历史。尚未应用任何业务规则。它仍然与源系统中的形式非常相似。\n- **精炼数据：** 这是为报表或其他用例（如机器学习或人工智能）准备好的数据。这是你通过应用所有必需的通用业务规则和特定于用例的业务规则所生成的数据。\n\
  \ndbt的核心功能是帮助你管理这些层次之间的数据转换。以下是对这两个步骤的描述：\n\n- **存储转换：** 将落地数据准备好以进行持久化历史存储。\n\n\
  \  这些转换具有一定的技术复杂性，但它们相当常见且重复性高，以至于大部分过程都可以自动化。我们将看到如何使用dbt及其宏来实现这一点。\n\n  在此步骤中，列名应改为使用业务名称以创建通用词汇表，但应用于数据的转换应仅是技术性的，不应改变数据本身，而只改变其格式、添加处理过程中可用的元数据以及添加计算字段。\n\
  \n  示例包括从文本中解析日期和数字、计算哈希键和哈希DIFF字段，以及用于将传入数据存储到历史中的实际代码。可以执行诸如移除填充零和空格等操作，但在这一层，原始源数据应被保留，并在每次数据变更时存储到历史中。\n\
  \n- **主数据和业务规则转换：** 从持久化历史中获取数据，并使其为报表做好准备。\n\n  这是我们应用大部分数据转换的地方，从主数据映射到各种各样的业务规则。\n\
  \n  这是数据工程师工作中的“创造性”部分，最佳实践、指导原则和经验可以帮助你找到好的解决方案并避免死胡同，但你个人的见解至关重要。\n\n  毕竟，业务规则的发现和应用是构建数据平台中最复杂的事情，而且仍然是专家级专业人士能够带来巨大价值的领域。\n\
  \n在本节中，我们开始展示我们认为最适合dbt和Snowflake等现代工具的思维方式，并且根据我们的经验，这种方式能为构建云数据平台的公司带来最大的价值。\n\
  \n我们将多次涉及的一个关键概念是，必须放弃一些更传统的数据仓库方法，转而采用更简单的方法，这些方法如今凭借云平台强大的功能和低廉的成本而变得可行。\n\n一个例子是使用基于序列构建的代理键。当数据库处理数字键的能力远强于文本键，且无法并行工作时，代理键是不错的选择。如今，基于键类型的差异几乎不存在，云数据库可以利用并行性让你的查询快得难以置信，因此使用自然业务键或通过哈希构建的代理键（它们能很好地与并行性配合）要好得多，并且要不惜一切代价避免使用序列，因为序列会扼杀键生成和查找过程中的所有并行性。\n\
  \n另一个例子是增量加载；要做到正确，它们比提供所需转换的简单查询复杂得多。差异在于增量加载依赖于当前执行之前发生的状态和历史（包括失败）。如果出现问题，你必须修复数据，否则你的数据将不一致，因为它将构建在未修复的数据之上。\n\
  \n当你必须购买数据库服务器时，你往往最终会选择能满足需求的最小、最慢的服务器，因此小且慢的数据库加上缺乏并行性，自然无法一次性处理你的所有数据。那时，我们被迫将增量加载作为性能工具，一次处理更少的数据，这使得转换更复杂但更快。\n\
  \n如今，借助提供极其强大配置的云平台，我们能够避免将增量加载作为性能工具，并且可以构建更简单的转换，这些转换构建更快、更容易理解、错误更少，并且维护工作量大大减少。想想看，你不需要处理之前任何一次运行中发生了什么，只需关心你的代码做了什么。\n\
  \n## 业务报表\n\n构建数据平台的主要目的是提供可用于支撑报表的精炼数据，而报表反过来又能驱动良好的决策。\n\n如今，我们有两个主要用例：经典业务报表（通过对源数据应用业务规则得出）和高级分析（包括机器学习和人工智能生成的报表洞察）。\n\
  \n在两种情况下，我们可能都需要按照Kimball维度模型向最终用户提供数据，这意味着使用事实表和维度。虽然我们不建议将这些产物作为永久存储，但它们是提供报表数据的标准方式。\n\
  \n最常见的交付方式是为每个报表域（如营销或采购）构建一个数据集市，有时还按国家或地区划分。数据集市是提供所需事实表和维度的表和视图的集合。\n\n为了提高一致性并避免返工，我们建议你实现一个通用的精炼层，以表的形式存储应用主数据和通用业务规则的结果，同时将各个数据集市实现为从精炼层读取数据并最终添加该报表域特有业务规则的视图集合。\n\
  \n\n\n\n机器学习和人工智能流程可以使用完整历史或精炼数据作为输入数据，并生成更精炼的数据，这样就能自然地将其添加到所需的数据集市中。\n\n## 反馈回源系统\n\
  \n数据流中最后一个可能的步骤，是关于数据平台中生成的数据以及在其他系统中使用这些数据的需求。\n\n一个常见用例是将数据平台中计算出的某些数据带回到某个运营系统。这在营销和\
  \ CRM 领域非常常见，数据平台可用于计算客户细分以及各种度量指标，然后需要将这些指标反馈回营销工具和 CRM 平台。\n\n另一个日益常见的用例是，某些机器学习流程正在为运营系统构建有价值的数据，例如销售预测或预测性维护数据。\n\
  \n在所有这些情况下，我们可以采用与之前将数据从源系统移动到数据平台时相似的思路来处理该主题，但一个很大的区别是：许多系统提供了某种导出的方式，却几乎没有提供任何导入数据的方式。\n\
  \n即使目标应用程序确实有加载数据的 API，数据加载器也很少具备同样广泛的回载数据能力。\n\n不要绝望，因为有一些工具专注于“反向 ETL”流程，即把数据从数据仓库移回业务工具/运营系统，例如\
  \ Census（可在 `https://www.getcensus.com/` 获取）。\n\n数据平台中生成数据的另一种情况是：使用 BI 工具的人员可以在\
  \ BI 工具的报表中编辑数据，并以某种方式将其发送回数据平台本身。这通常被称为 BI 工具中的写回功能。\n\n一些示例用例包括：人们可以使用 BI 工具输入缺失信息或在特定报表中提供更新值，例如管理库存水平或更新预测。\n\
  \n在这种情况下，更好的做法是将从 BI 工具写回的新数据视为数据平台的新输入，并将其作为转换链的一部分进行集成，而不是直接修改为报表提供支持的数据集市。这同样符合让数据变更可见的精神，并且无需处理先前的状态即可从头重现最终结果。\n\
  \n现在我们已经探索了数据生命周期及其演变，接下来将继续学习现代数据栈，它使数据工程变得更加顺畅。\n\n## 理解现代数据栈\n\n当我们谈论数据工程时，我们涵盖了端到端覆盖数据生命周期的所有技能、工具和实践，如上一节所述，从数据提取到用户数据消费，最终还包括数据写回。\n\
  \n这是一套庞大的能力和工具，从安全到脚本和编程，从基础设施运维到数据可视化。\n\n除了非常简单的情况外，单个人能够对所有涉及领域有透彻理解和良好技能来完全覆盖这一切，是相当罕见的，更不用说还有时间去开发和维护了。\n\
  \n### 传统数据栈\n\n传统数据栈通常由数据工程师构建，他们开发临时的 ETL 流程，从源系统提取数据，并在本地转换，然后以精炼形式加载到用于支撑报表的传统数据库中。这被称为\
  \ ETL 管道。\n\n该过程包括创建一些临时集成来从源系统提取数据，确定要提取的内容，并设计提取逻辑。通常，它还包含所需的数据转换（包括汇总），最后才将“已消化”的数据加载到用于报表的普通数据库中。\n\
  \n使用 MySQL 或 SQL Server 这类事务型数据库进行报表会带来巨大问题，需要各种技巧才能实现报表功能。主要问题在于，这些数据库针对与表中的整行数据进行交互的大量小型操作进行了优化。它们是面向行的。\n\
  \n事实上，分析工作恰恰相反：它需要对大量数据执行少量查询，而且通常只使用少数几列，而不是所有列。为了解决分析工作负载的需求，列式数据库应运而生，但在 2000\
  \ 年代的头十年，它们并未被广泛了解，而且与“常规”面向行的 OLTP 数据库相比，它们仍然相当昂贵。\n\n使用传统 OLTP 数据库时，最容易出现问题的折衷之一是在将数据加载到报表数据库之前应用业务规则和数据汇总。这造成了一种局面：源数据或业务规则的任何变化都会影响整个数据历史。这反过来又要求修复转换逻辑以及现有数据，以符合新逻辑。如你所见，这是双倍的工作，而且也很可怕，因为你必须修改历史数据的唯一副本。\n\
  \n另一个问题是，工具的大小和功能都受到限制，编写集成并保持其运行的时间也同样有限，因此通常只加载真正需要的数据，而且往往只保留有限的时间段。\n\n数据分析师会从数据库获取已加载的数据，为最终用户构建报表和仪表板，并偶尔对数据的某些方面进行深入分析。\n\
  \n即使在这些深入分析中，他们也只能使用已有的数据：如果某些内容被过度汇总，他们除了请求重新加载之外别无他法；如果某些有用数据不可用，他们也只能再次请求数据工程师通过创建另一个\
  \ ETL 管道来添加数据。\n\n难怪最终用户常常需要等待新数据被添加，或者只能从可用数据中获得部分答案。\n\n数据工程师和分析师之间的工作分工，也使得数据分析师更难以充分理解数据及其局限性，也让数据工程师更难理解他们交付的数据的使用情况与质量。\n\
  \n通常，几乎没有测试或数据质量检查，导致数据团队在数据生命周期的两端持续“救火”：源系统中不断变化/缺失的数据，以及报表中过时/错误的数据。\n\n另一点是，鉴于维持\
  \ ETL 管道运行的技术难度以及数据工程师与业务问题之间的距离，通常更多的精力花在了让数据流动上——这是一个传统且客观、无人能质疑的指标——而不是理解数据和确保其质量上。\n\
  \n### 现代数据栈\n\n快进到 2010 年代中期，我们发现自己的处境好多了：\n\n- 云上的分析型数据仓库，例如 BigQuery、Redshift\
  \ 和 Snowflake，越来越普遍，并且对大多数数据团队来说已成为可负担的选择\n- Stitch 和 Fivetran 等数据移动/集成工具，可以非常轻松地将数据从传统数据库和常见业务平台移动到云数据仓库\n\
  - 现代 BI 工具开始提供改进的自助式报表能力，供高级用户使用\n\n云数据仓库的出现是一个转折点，它提供了海量的存储和处理能力，而无需预先购买容量。\n\n\
  在用户侧，这使公司能够将大量数据加载到这些云**数据仓库（DW）**中，并以更快、更便宜的方式处理数据，成本仅为本地系统的一小部分。\n\n在商业侧，这促进了数据移动工具的创建和兴起，使得从最常用的系统（如传统\
  \ DBMS 以及运营和 SaaS 软件）快速、轻松地将数据加载到这些标准云 DW 之一成为可能。\n\n采用这种现代数据栈，可以轻松地将来自源系统的原始数据加载到云\
  \ DW 中，从而减少了数据工程领域最复杂、最耗时的工作需求。\n\n\n\n\n拥有一种只需在短时间内设置好就能将数据送到你的数据仓库（DW）的工具，使得一个人就能负责源系统的数据生命周期的全部或大部分工作，前提是这些源系统可以用数据移动工具来管理。它也解决了学习并跟上这些丰富但经常变化的\
  \ API 的需求，因为这现在已成为数据移动工具开发团队的问题。\n\n如今，你只有在没有工具可以自动化数据移动时，才会作为最后的手段创建临时管道。\n\n原始数据易于获取，促进了下一个问题的产生：我们如何改进转换阶段并使其有效？*这正是\
  \ dbt 被创建来帮助解决的问题。*\n\n我们将在下一节中对此提供更多细节。\n\n数据栈中的另一个巨大变化是，将尽可能少的逻辑放入报表工具中并保留在 DW\
  \ 中，以便你只需编写和管理一次，它就可以为每份报表和每种其他用途提供服务。这之所以成为可能，是因为随着运行 ETL 管道所需的编程和基础设施减少，负责转换的工程师拥有更好的\
  \ SQL 和仓库技能，而现代工具如 dbt 使直接在转换中编写和测试业务逻辑变得更容易。\n\n现在我们已经描述了传统和现代的数据栈，让我们深入探讨 dbt\
  \ 的核心：作为一个敏捷团队，将原始数据转换成语义信息。这就是分析工程的核心，我们将在下一部分讨论。\n\n## 定义分析工程\n\n我们在上一节中看到，随着现代数据栈的出现，数据移动变得更容易，因此重点已转向管理原始数据并将其转换成语业用户在报表中使用的精炼数据。仍然存在大量需要临时集成和\
  \ ETL 管道的案例，但这不再是数据团队的主要关注点，就像过去一样。\n\n另一个哥白尼式的革命是，新的数据栈使数据专业人员能够作为团队工作，而不是延续在传统数据栈中常见的孤立工作。重点现在是应用软件工程的最佳实践，使数据转换开发像构建软件一样可靠。你可能听说过\
  \ DevOps 和 DataOps。\n\n随着重点的转移，术语 **分析工程** 出现了，用以标识从访问原始数据到将精炼数据提供给 BI 报表工具的数据生命周期中的核心部分。这并非巧合，因为这也是云\
  \ DW 平台和 dbt 所覆盖的数据生命周期部分。\n\n以新的眼光审视数据生命周期，我们可以将其分为以下几个部分：\n\n- **数据集成：** 通过尽可能使用现成的工具将所有数据收集到一个地方，即云数据平台，并在需要时求助于临时数据管道。\n\
  - **分析工程：** 将原始数据转换为精炼的、可用的、可信赖的数据。这就是你使用 dbt 所做的工作，使用你偏好的数据平台，在我们的案例中是 Snowflake。\n\
  - **数据分析：** 使用精炼数据构建报表、仪表板、机器学习模型等。这是在你的 BI 工具中完成的工作，以使数据对业务用户可访问。\n\n这三个阶段与我们在上一节中看到的并没有太大不同。不同之处在于，在现代数据栈中，我们现在有了与现代工具相一致的清晰边界，这对从事其中的专业角色产生了影响。\n\
  \n## 现代数据栈中的角色\n\n将数据生命周期划分为这三个步骤后，这些是在使用 dbt 和云 DW 的现代数据团队中所属的专业角色：\n\n- **数据工程师：**\
  \ 拥有脚本/编码和基础设施知识的“传统”数据工程师仍然非常有价值，尤其是当并非所有数据源都能被现代数据加载工具覆盖时。即使在这种情况下，复杂的日程安排、安全性和许多其他主题可能仍需要数据工程师的专业知识和专注。\n\
  - **分析工程师：** 一个新角色，牢牢围绕了解并将原始数据转换为有用信息。他们不太关心数据移动管道的开发，而是专注于使数据可用、可使用且可信赖。\n- **数据分析师：**\
  \ 这是传统数据分析师的改进版本，因为现在他们可以理解甚至帮助构建数据模型，并且能够调查更广泛的数据集的能力前所未有。\n\n虽然清楚地区分这三个角色是有意义的，但重要的是要注意它们有很大重叠，核心能力围绕\
  \ SQL 和数据素养。\n\n现代数据栈甚至使得拥有一个人的数据团队成为可能，如果你可以在无需编写和照看一个或多个数据管道的情况下移动数据，并且你的业务逻辑不是\
  \ constantly 变化的，因此现有的数据模型和报表不需要频繁更改。\n\n## 分析工程师\n\n我们看到分析工程师有点像数据工程师，在收集和理解原始数据方面，又有点像数据分析师，在了解如何创建能够实现良好分析的数据集方面。但该角色的核心是使用允许软件工程师生产和维护可靠软件的最佳实践来转换数据为信息。\n\
  \n从旧栈到新栈的主要变化是，能够并且需要从个人工作转向团队合作，以使用为传统软件工程创建的心态和强大工具来用于数据工程。\n\n构建数据平台的方法变得更类似于构建软件，认识到即使在数据世界中，你也可以构建模块化模型，并且可以通过使用通用、可重用的模型来组合复杂的数据集，就像在构建软件时重用软件组件和库一样。\n\
  \n分析工程师组织数据转换及其依赖关系，就像软件工程师设计应用程序一样，使用可重用模式，并应用关注点分离，以最大限度地减少因多种不同原因而更改模型的需求。\n\n\
  分析工程师的工作不仅仅是编写执行从原始数据到信息的所需转换的 SQL，还要应用或发现模式来分解、结构化和以有意义且可重复的方式组织转换，使用清晰的命名，以便团队中的每个人都知道这些转换的每个步骤可以预期什么。\n\
  \n在下一节中，我们将讨论可以从传统软件工程中采用的最佳实践，以改进数据项目。\n\n## DataOps – 数据的软件工程最佳实践\n\n事实是，许多数据团队曾经、现在仍然不是由具有软件工程背景的人组成，因此他们错过了采用属于\
  \ DevOps 的现代软件工程技术。\n\n名副其实，DevOps 运动为软件开发领域带来了巨大改进，帮助团队变得更具生产力并对工作更满意。\n\n简而言之，DevOps\
  \ 的核心思想是为团队提供所需工具，以及对整个开发周期的权限和责任：从软件编码到质量保证（QA），到发布然后运行生产操作。\n\n实现这一目标的基石是使用自动化来避免手动执行重复性任务，例如发布和测试，强调自动化测试，依赖主动自动化监控，最重要的是，团队对代码的共同所有权。\n\
  \n这些思想通过四眼原则得到体现，要求每段代码至少被两个人看到并批准（通过结对、拉取请求或代码审查），以及童子军规则，该规则促使你在触碰一段代码时确保它比你触碰它之前处于更好的状态，无论是谁编写的，从而随着时间的推移改进工作。\n\
  \n\n\n\n\n另一个重要概念是主动管理技术债务。虽然代码库的某些部分即使未达到标准也可以发布，这很正常，但必须出于真实的权宜原因，并且团队必须在权宜原因过去后偿还这笔债务，修复质量较低的代码。\n\
  \n在以下小节中，我们讨论一些软件工程最佳实践，它们可以帮助数据团队以更令人满意的方式工作。\n\n请注意，这些实践与 dbt-labs 创始人 Tristan\
  \ Handy 在开始开发 dbt 时发表的一篇开创性文章中提出的观点非常一致。你可以在以下网址阅读 Tristan 的 2016 年文章：https://blog.getdbt.com/building-a-mature-analytics-workflow/。\n\
  \n## 版本控制\n\n拥有一个中央仓库，将所有代码存储并组织好供所有人访问，并清楚了解版本的更迭，这已经比许多将 SQL 文件保存到共享磁盘、通过文件名或文件夹名来维护版本的情况改进良多。\n\
  \n创建分支以独立工作，然后合并更改的能力，不仅可以实现功能的并行开发，还提供了一种安全的方式来尝试更改。\n\n无论如何，采用代码版本控制不仅本身有用，也是实现许多积极流程的必要步骤。\n\
  \n版本控制系统（如 Git）成为集成中心，可以触发协作和自动化流程，例如以下这些：\n\n- **拉取请求：** 这一强大功能允许团队查看开发人员提出的更改并发表评论，要求澄清并提出改进建议，同时跟上最新的更改。\n\
  - **自动化：** 当新代码被检入时，可以触发多种自动化，从分析新代码的代码质量工具，到自动化测试，再到持续集成和持续部署。\n- **授权：** 尤其是在非常官僚或高度监管的环境中，版本控制系统可以作为审批的记录工具，使这一必要步骤变得简单。\n\
  \n## 质量保证\n\nDataOps 的三大基石——所有权、自由和责任——在很大程度上依赖于团队拥有一个可靠的质量保证流程。\n\n确保生产环境中的代码按预期工作、传入的数据符合预期的最佳方式，是每次发布新代码或加载新数据时都执行自动化测试。\n\
  \n现代数据栈允许你构建可复用的模型，因此你可以只编写一次客户模型，也许可以通过组合代表线上客户、门店客户和批发客户的底层模型来实现。所有这些模型都是有用的精炼模型，可以在多种场景中复用。\n\
  \n这里的关键是，技术和业务必须保持一致，以定义相关的业务概念，然后技术帮助实现这些概念，减少代码重复并促进稳定接口的使用。\n\n我们将在 *设计可维护性*\
  \ 一节中进一步探讨如何编写模块化代码。\n\n## 开发环境\n\n为了让开发团队能够快速迭代代码并开发和测试新功能，每个开发人员都必须拥有自己的环境，可以在其中工作，无需等待或与他人同步，也无需担心破坏任何东西。\n\
  \n能够在你准备好时自由运行代码，运行能在几秒或几分钟内给出可信答案的测试，或者能够在同样短的时间内销毁并重建你的环境，这些都是现代数据栈提供的基本能力。这些能力使开发人员能够专注于编写良好、干净的业务代码，而不是支持或附带任务，更不用说只是等待了。\n\
  \n相反，当开发人员必须在生产环境中尝试代码时，他们无法承受犯错的代价，因为失败会引发重大问题。结果是害怕更改任何代码，发布需要很长时间，因为每一个小更改都必须经过深思熟虑并权衡后果。\n\
  \n即使只有一个共享的开发环境，或者只有少数几个创建缓慢或昂贵、因此必须共享并精心维护的环境……结果也是相似的：害怕更改，以及由于浪费时间等待环境或因为开发环境不能反映真实环境而导致结果误导，从而失去动力。\n\
  \n毕竟，这应该并不令人意外，因为大多数人不喜欢排队等待，更不愿意在悬在高空的缆索上行走，无论有没有安全网。\n\n个人开发环境是快速开发和测试新功能的关键推动因素。如果每个开发人员都要等半天才能尝试自己的代码，你怎么能每天发布甚至一天发布多次？\n\
  \n持续集成是提高开发流程速度和信任度的下一步，确保所有已开发的独立功能能够良好协同工作。它提供了另一个更强的信心水平，强化了所有发布的代码都经过团队审查和讨论的意识。\n\
  \n持续部署提供了最后一步，允许将在集成环境中测试过的代码发布到生产环境。这可以自动完成，也可以在手动提升代码后完成。\n\n## 设计可维护性\n\n我们把最重要的最佳实践留到了最后：在开发时着眼未来，即考虑演进和维护。\n\
  \n数据平台是生命周期最长的企业应用程序之一，因此当你编写一个数据平台时，可以确信它将长期使用。这意味着随着时间的推移，数据源和业务规则会发生很多变化，甚至更多的问题会围绕数据平台中管理的数据而产生。\n\
  \n这反过来又意味着很多人，包括未来几个月和几年的你自己，肯定会回来重新阅读那些代码。这就构成了为人类编写可理解代码的理由。\n\n仅仅编写能运行的代码是不够的，就像把控制器半隐藏在一个难以触及的地方不是好的设计一样。设计你的代码，让下一个接触它的人会因为你把控制器放在易于看到和触及的地方而感谢你。\n\
  \n编写可维护的代码意味着编写容易被同事理解和更改的代码。通过将逻辑步骤分解为单独的**通用表表达式（CTE）**来避免冗长复杂的查询，以便为每一步提供适当的命名，并创建干净、可读的代码。保持模型在\
  \ 100 行以内，连接数控制在两到三个，除非模型的唯一目的是连接多张表。\n\n在这方面，Bob Martin 的经典著作 *《代码整洁之道》* 以及 Martin\
  \ Fowler 关于架构、重构和敏捷的文章将是很好的指南；即使代码示例和主要讨论可能涉及 Java 和应用软件，这些思想也适用于每个编程环境。\n\n性能和正确性是架构良好且表达清晰的代码的结果；它们绝不是编写晦涩代码或过于复杂逻辑的借口。\n\
  \n记住，代码越少，其中的错误就越少。\n\n我们可能使用 SQL 或某种基于 Python 的脚本来表达逻辑，这一事实并不意味着我们应该满足于不够好的代码，而应该追求良好、可读的代码和清晰表达的业务逻辑。毕竟，如果代码易于理解，那么人类也容易验证其逻辑，并自动测试其行为是否符合预期；但如果代码晦涩或业务逻辑不清晰，情况就并非如此。\n\
  \n编写可维护代码的另一个关键部分是确保你的代码不必每隔一天就更改一次，并且当你需要更改时，它很容易更改。为此，我们可以借助整个软件工程知识体系，特别关注面向对象编程中的\
  \ SOLID 原则。以下是一些易于在数据项目中应用的原则：\n\n- **SRP**：**单一职责原则** 指出，一个模型应该只有一个、且仅有一个更改的理由。在实践中，这意味着一个模型应该专注于做一件事，希望把它做好，并明确说明它做什么。这与那些一次性完成所有事情、甚至尽可能做更多事情的巨型查询正好相反。\n\
  \n\n\n\n\n- **OCP:** **开放/封闭原则** 指出模型应对扩展开放，对（接口）修改封闭。这意味着我们用作系统与模型之间连接点的模型，其所暴露的接口应保持稳定，同时也应易于扩展。在数据世界中，这很容易通过选择良好、经过业务验证且经得起时间考验的名称，并使用视图作为接触点来隔离消费者与底层存储精炼数据的表可能发生的变更来实现。\n\
  - **ISP:** **接口隔离原则** 指出客户端不应依赖于其未使用的接口。听起来很 trivial，但我们都见过拥有超过 100 列的客户维度。同样，在数据世界中，通过使用一个视图来提供对底层精炼数据的访问，仅暴露所需信息，而非“仅仅因为可用”而暴露所有内容，就很容易遵守这一原则。这样，我们就限制了未来变更导致某些字段不可用或语义改变时的“爆炸半径”。\n\
  - **LSP:** **最小惊讶原则** 指出模型应做其名称和在项目中的位置所暗示的明显事情。你应该能够正确猜测它所做的事情，并且在阅读其代码时不应感到惊讶。没有这一原则，你就无法信任任何代码片段而不必每次都重新阅读，使工作变得痛苦。\n\
  \n一个例子是，你不会期望数据仓库中的视图从原始数据源读取，也不会期望一个应用了主数据映射的模型同时计算一些无关的指标。\n\n在讨论这些原则时，我们已经尝试将措辞和示例适配到数据世界，因此你可能会发现它们与应用软件开发的等效定义略有不同。\n\
  \n除了这些总体原则之外，还有其他软件工程原则，如抽象、封装和继承，虽然不能直接映射到数据/SQL 世界，但可以提供良好的灵感，例如使用视图来定义抽象（想想像基础客户或产品维度这样的通用接口，可以存在于许多不需要所有细节的通用数据仓库中）或封装（通过使用合适的名称暴露大表中列的子集）。\n\
  \n最后，项目的可理解性和可维护性很大程度上取决于非常简单的操作，例如采用简单、商定的约定，使每个人都能轻松弄清模型的位置或模型的作用，正如 LSP 所建议的那样。\n\
  \n可维护性的另一个重要主题是文档。请注意，过于详细且手动创建的文档往往会迅速过时，从而变得毫无价值甚至具有误导性。\n\n在这里，我们想强调的事实是，大多数文档应是生成的，特别是对于经常变化的技术细节，如模型及其连接。\n\
  \n如果稳定的部分，如高层架构和模型或字段的描述，或报告或仪表板的总体描述，由人类创建是完全可以的。\n\n## Summary\n\n在本章中，你学习了完整的数据生命周期，并熟悉了\
  \ DataOps 和使我们能够以与使用 DevOps 方法开发软件项目相似的方式工作并达到相同满意度水平的现代数据平台概念。\n\n做得好！\n\n我们介绍了分析工程师这一角色，他在构建现代数据平台的核心中扮演着中心角色，并且我们看到了可以从软件工程中采用的最佳实践和原则，以使我们对数据项目的工作对我们和其他利益相关者更可靠、更令人满意。\n\
  \n通过本章，我们结束了本书的第一部分，该部分向你介绍了数据工程的关键要素，并将使你更好地理解我们如何使用 dbt 工作。\n\n在下一章，*使用 dbt 进行敏捷数据工程*\
  \ 中，你将开始学习 dbt 的核心功能，并开始构建一个更大示例的第一个模型，该示例将为我们提供一个现实的使用案例。\n\n## Further reading\n\
  \n在本章中，我们谈到了数据生命周期、软件工程原则、DevOps 和 DataOps。关于这些主题的书籍很多，但据我们所知，关于现代数据堆栈的书籍没有，因此我们在此列出几本非常经典的参考书，它们是为软件应用开发而写的，但提出了在任何编程环境中都有用的主题：\n\
  \n- 我个人最喜欢的，因为它清楚地说明了干净代码的好处：\n  \n  Robert C. Martin，昵称“Uncle Bob”，*Clean Code:\
  \ A Handbook of Agile Software Craftsmanship*，Prentice Hall，2008，ISBN 978-0132350884\n\
  \  \n  如果你喜欢这本，还有几本 Uncle Bob 关于干净代码和架构的书籍。你也可以参考他的网站：`http://cleancoder.com/`。\n\
  - 关于保持代码良好状态的经典书籍，作者是我深深尊重的人，他提出了我最喜欢的引言，这可以作为本章的标题：“*任何傻瓜都能写出计算机能理解的代码。优秀的程序员写出人类能理解的代码。*”\
  \ M. Fowler (1999)\n  \n  Martin Fowler（作者），Kent Beck（合作者），*Refactoring: Improving\
  \ the Design of Existing Code*，Addison-Wesley Professional，2019，ISBN 978-0134757599\n\
  \  \n  这是软件工程中经典书籍之一的更新版本，提供了 Martin Fowler 的智慧以及 Kent Beck 的合作，Kent Beck 是极限编程的创造者。\n"
- "## The dbt Core workflow for ingesting and transforming data\n\n在本章中，我们将构建我们的第一个完整的\
  \ dbt 项目，从源系统获取数据并使其可用于报告，但让我们先从大局着手，通过描述现代数据平台的参考架构来开始。\n\n在第 4 章中，我们概述了数据生命周期。在下面的图像中，我们将开始可视化现代数据平台的层级，并开始将它们与我们使用\
  \ dbt 构建它们的方式联系起来：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_198_0.png)\n\nFigure\
  \ 5.1: Layers of a modern data platform\n\n层级如下：\n\n1. **Data sources:** 我们将使用底层数据平台的全部能力来加载来自我们数据源的数据。在\
  \ Snowflake 的情况下，这意味着能够从主要云提供商存储的文件中加载数据，当然还有驻留在其他 Snowflake 数据库（DB）中的数据，无论是我们自己的还是与我们共享的，例如合作伙伴、客户或其他部门。\n\
  2. **Data storage:** 我们将从数据源读取数据，将其放入我们在数据平台上永久存储所需使用的格式，并跟踪源数据的变更。我们希望尽可能接近源数据存储数据，仅应用一些不改变数据的技术步骤，例如将其转换为正确的数据类型（作为文本接收的数字或日期），对数据应用硬性规则（删除填充零或空格，转换为所需时区，或管理大小写），并最终将作为对象接收的数据（来自\
  \ JSON、AVRO ...）展平为 SQL 或符合关系的数据结构（例如，将作为单个对象接收的发票头和发票行分离）。\n3. **Data refinement**:\
  \ 这里是真正的数据转换发生的地方：将原始数据转变为有用的信息。此转换的两个主要部分是应用 **Master Data (MD)** 将源系统特定数据转换为企业范围内可使用的数据，然后应用\
  \ **Business Rules (BR)** 将数据转换为可用信息。\n   \n   虽然 MD 部分可以遵循一些指导和模式，但 BR 部分是经验丰富的分析师和数据专业人员真正发挥作用的地方，他们通过保持秩序并创建可重用的数据模型，而不是一团糟的临时转换而没有组织，来做出差异。\n\
  4. **Data delivery**: 在数据交付层，我们将拥有传统的报告数据仓库，它们使用维度模型将数据交付给报告工具，其他数据仓库提供数据作为宽表，以及其他具有更多技术用途的“仓库”，提供一种简单的方式来构建和管理外部工具的\
  \ API，例如 AI 或 ML 工作负载，或被带回操作系统的精炼信息，例如更新的客户档案或用于营销工具的完整细分。\n\n我们提出的架构的标志性特征是将源数据摄取与业务逻辑的应用和业务概念的创建分离。\n\
  \n这种核心关注点的分离是我们现代数据平台思想的基础，因为它允许在实现细节上拥有很大的自由度，并带来以下实质性优势：\n\n- 解耦两个最重要的活动，即摄取和构建业务概念，简化了整体开发，允许为问题的每个部分使用最佳解决方案。\n\
  - 广泛使用模式允许更快地开发，保持复杂性低，使人员培训变得容易，并提供可靠的结果和可预测的交付时间。\n- 源数据的保留使适当的审计成为可能，允许高级源系统分析和改进，并保证我们始终能够使用我们的数据，因为原始数据不会因\
  \ BR 的应用而改变，这些 BR 在未来可能不再有效，并且源数据不会以无法还原的方式改变。\n- 一个组织良好的精炼层，具有简单的 MD 管理手册、易于导航的有向依赖关系，以及具有明确角色的几种常见模型类型，使我们能够构建即使是最复杂的业务概念，而不会创建很快变得过于复杂而难以管理和维护的巨大意大利面条代码球。\n\
  - 从存储的历史源数据不断重新创建精炼层和交付层的做法使你能够轻松更改 MD 和 BR 并立即将其部署到你的所有数据中，消除任何需要维护的状态。\n- 从精炼层和交付层中移除任何累积状态的能力使系统简单且快速更改，并且像无状态应用程序一样易于维护，重新获得开发人员和利益相关者的信心，并节省大量此前花费在数据修复或修复任务上的人力。这与传统数据仓库形成直接对比，在传统数据仓库中，变更是\n\
  \n\nconstantly hindered by the need to preserve, backfill, and maintain the complex\
  \ state caused by incremental loads and the incremental summarization of data.\n\
  \n- 灵活的交付层在始终与 MD 和通用 BR 保持同步的、分离良好的精炼层之上提供简单的数据集市个性化，让你能够根据最新的数据集市发展，为每个部门、客户或外部接口提供所有数据。\n\
  - 外部依赖关系可通过用户、角色、模式和视图等简单的数据库结构轻松管理，并且访问权限本质上仅限于最小的可能范围，这得益于能够快速提供数据集市，在你的精炼数据之上提供任何所需的\
  \ API。\n\n下图可视化了使用本节所述工作流程的现代仓库项目与传统项目（传统项目专注于数据集市交付而没有任何关注点分离）相比，对实施工作量和成本的主要影响：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_200_0.png)\n\n图 5.2：仓库项目中随时间推移的实施工作量和成本\n\
  \n现在我们已经有了构建数据平台的工作流程，是时候开始学习如何使用 dbt 和 Snowflake 的功能来解决实际用例了。\n\n通过本章及后续章节，我们将引导你构建一个完整的数据平台，从源数据到可用于提供报告的数据集市。\n\
  \n我们将使用的两个主要工具是一个库存跟踪数据平台，以及作为数据共享提供给每个 Snowflake 账户的 Snowflake 示例数据。\n\n我们将从构建一个非常简单的库存跟踪数据平台开始，并逐步对其进行转换以加入更多功能，以说明\
  \ dbt 功能以及现代敏捷开发流程的强大之处。\n\n这个示例数据平台将提供核心经验教训，你可以按照步骤使用行数较少的示例进行跟进，这些示例易于分析和理解。Snowflake\
  \ 示例数据将在我们想要专门针对大行数用例时使用。\n\n## 介绍我们的库存跟踪项目\n\n我们选择构建一个简单的库存跟踪平台来说明 dbt 功能，因为它最初可以简化为一组简单概念和关系，同时在后续迭代中提供多种增加复杂性和有趣需求的方式。\n\
  \n使用许多人会产生共鸣的示例项目，我们希望提供更易于理解和参与，并也许通过能够启动一个项目来跟踪你的股票，从而提供实际价值。\n\n事实上，这是一个相当常见的情况，即一个人或一个家庭最终拥有多个账户，并且这些账户中存在可交易的证券。因此，一个常见的需求是希望对所有账户有一个全局视图。\n\
  \n随着金融科技解决方案的进步，如果你的账户不在同一个国家，在现代投资组合应用中这变得更简单，但如果你在不同司法辖区拥有账户，那么祝你好运，或者你可以和我们一起卷起袖子，打造一个符合需求的解决方案。\n\
  \n其他可能使该用例有效的常见原因包括使你的数据独立于你的经纪商，以便你的历史记录始终伴随你，或在你当前提供商提供的范围之外个性化你的报告和分析。\n\n举例来说，我发现诸如行业甚至国家等类别的归属对于许多中小型股票，尤其是美国市场以外的股票，往往缺失或与实际情况不一致。你会为一家在墨西哥或俄罗斯拥有矿山的加拿大公司使用哪个国家？该运营属于发达国家还是发展中国家？它暴露于加元、墨西哥比索还是俄罗斯卢布？\n\
  \n## 初始数据模型和术语表\n\n本示例项目旨在能够跟踪分散在多个投资组合中的投资价值，并按我们偏好的方式进行分析。我们将从简单开始，只跟踪投资组合的当前价值，并在接下来的章节中添加更多功能。\n\
  \n起始用例是投资者拥有投资组合，可能在不同的经纪商处，在这些投资组合中持有证券头寸。他们可以买卖证券，因此可以开仓、平仓并改变持有的头寸。\n\n他们希望使用从经纪商处接收的数据来跟踪其整体情况的日价值，并根据证券的多个属性分析其持仓。\n\
  \n以下概念数据模型说明了主要实体及其关系，正如你从用例的初始解释中可以得出的那样。\n\n请注意，在数据模型中，我们并没有列出我们提到的所有实体，因为我们更感兴趣的是展示核心“结构关系”，而不是完全反规范化数据模型，展示所有现有实体及其所有关系。例如，我们没有显示投资者实体，因为目前我们可以在投资组合实体内部先使用\
  \ owner 或 owner_id 列：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_202_0.png)\n\n\
  图 5.3：投资组合跟踪项目的初始数据模型\n\n为了提供共同的理解，提供一个包含数据模型概念描述的术语表是良好的实践，例如以下内容：\n\n- **Position:**\
  \ 头寸跟踪投资组合中持有的特定证券的数量，并附带除持有的股票数量之外的一些度量，例如头寸中持有的证券成本。\n- **Portfolio:** 投资组合是头寸的容器，通常与经纪商的交易或托管账户相关联。\n\
  - **Security:** 证券是可以买卖的投资工具，可在特定市场买卖。证券存在多种类型，包括债券、股票、期权等。\n- **Quote:** 证券报价是一组值，例如买价和卖价，用于描述股票在某一时刻的市场报价，或一组值用于描述股票在一段时间内的市场报价：\n\
  \  - **Daily quote:** 日报价是一组值，例如开盘价、收盘价、最高价和最低价，用于描述股票在交易日内的市场报价。\n- **Calendar:**\
  \ 日历代表所需分辨率的时间维度，通常为一天，为日历中的所有项目提供有用的预先计算属性。\n\n在本章及后续章节中，我们将首先从非常简单的需求和功能开始，并在途中增加复杂性和功能以介绍更多\
  \ dbt 或 Snowflake 功能，有时也只是展示替代方案或说明初始解决方案可能存在的局限性。\n\n想法是像处理真实项目一样进行：你从某些需求开始，等到你完成了人们脑海中想到的约一半内容时，新的想法就会出现，你会发现自己将项目引向新的、更有前景的目标。你明白了：变化是唯一不变的。\n\
  \n因此，如果在某些情况下我们可能会突然改变想法或引入可能不完全合乎逻辑的新需求，请耐心配合，但这都是为了利用 dbt 功能或引入有趣的模式。在这里，这可能作为技能进阶，但我们会尽量使其不要与实际项目相差太远。\n\
  \n## 在 dbt、Snowflake 和 GitHub 中设置项目\n\n现在我们已经大致描述了项目，是时候卷起袖子开始构建它了。\n\n为了开始并在 dbt\
  \ 中准备好项目，我们需要在 GitHub 中设置一个存储库来托管代码，并在 Snowflake 中设置一个数据库来保存数据并部署代码。\n\n我们还需要做出一些基本的设计选择来组织项目。我们将在下一个\
  \ *Portfolio tracking project design* 部分简要讨论它们。\n\n在以下各节中，我们将快速描述你需要执行的操作步骤来设置项目。如果你还不确定如何操作，可以参考我们在\
  \ *Chapter 1* 中为 Snowflake 和 *Chapter 2* 中为 GitHub 和 dbt 提供的逐步说明。\n\n## 投资组合跟踪项目设计\n\
  \n这是一个示例项目，因此我们将尽可能保持设置简单，但这是讨论大型项目替代方案的好机会：\n\n- **Database and environments:**\
  \ 对于本项目，我们将使用 dbt 在同一数据库中通过使用前缀提供多个并行且独立的环境的能力。我们还将只使用两个环境：用于编码的开发环境和用于稳定发布的生产环境。这对于单人项目可能已经过剩，但我们希望做得好，而且在金钱或时间上几乎不花费。\n\
  \  \n  在实际应用中，你可能希望将所有开发人员环境放在一个 DEV 数据库中，然后在自己的 QA 数据库中有一个 **Quality Assurance\
  \ (QA)** 或 **Continuous Integration (CI)** 环境来集成所有开发，最后在 PROD 数据库中有一个生产环境来保存良好数据并在稳定版本上运行。\n\
  - **Git branches:** 由于我们将只拥有 DEV 和 PROD 环境，我们将在 DEV 环境中使用你为每个功能想出的名称的功能分支，而 *main*（或在旧设置中为\
  \ *master*）将是对应于 PROD 环境的分支。\n\n\n\n\n如果你同时拥有 QA 和 PROD 环境，那么让默认合并开发内容的主分支与 QA 关联，并创建一个长期存在的\
  \ PROD 分支与 PROD 环境关联，这种做法是合理的。如果你想在 QA 和 PROD 之间设置更多部署环境（例如发布候选环境），也可以采用同样的模式。我们只是建议你保持简单和敏捷。\n\
  \n- **用户和角色：** 我们将为 DEV 和 PROD 使用同一个角色 `DBT_EXECUTOR_ROLE`。我们将在 DEV 环境中使用我们的用户，并为\
  \ PROD 环境创建一个用户。它们都将使用执行器角色来运行 dbt 项目。\n\n    在真实场景中，你可能希望为每个数据库或环境设置一个写入角色，以及一个或多个读取角色，为开发者的用户分配\
  \ DEV 写入角色，并为其他环境分配读取角色，因为你只希望 dbt 在收到开发者的手动命令时才在那里进行受控更改。你可能还希望创建仅限于某个数据集市的读取角色，以更好地控制和管理数据交付，并根据用户的访问需求将这些读取角色分配给用户。\n\
  \n- **输入数据的位置和格式：** 我们希望让你全面了解 dbt 与 Snowflake 结合的能力，因此我们将使用 CSV 文件格式的数据作为包含在 dbt\
  \ 源代码仓库中的源文件（这并不总是最佳选择）。\n\n    在真实项目中，将 CSV 文件存储在项目仓库中的做法虽然有用，但仅适用于少数情况；加载文件也不是手动的，而是由数据移动代码自动完成，这些代码将文件放入文件容器（通常位于\
  \ Snowflake 外部），再由 dbt 宏进行加载。\n\n## 为投资组合项目设置仓库\n\n我们需要一个仓库来存放数据，所以让我们在 GitHub 上创建一个新的空仓库：\n\
  \n1. 登录你的 GitHub 个人账户，或你选择的 Git 提供商账户。\n2. 创建一个你喜欢的名称的新仓库。我们使用了 `portfolio-tracking-dbt`，但你可以选择你喜欢的名称，并让它完全为空，即不包含\
  \ README、`.gitignore`、`license` 或任何其他文件。\n\n就这样——我们现在有了一个可以与 dbt 一起使用的空仓库。\n\n我们将使用\
  \ dbt 与 GitHub 的集成来从 dbt 端建立连接，所以这里不需要再做其他工作了。\n\n## 为投资组合项目设置数据库\n\n我们需要在 Snowflake\
  \ 中创建一个数据库和一个用于运行生产环境的用户，那么让我们开始吧。\n\n首先，让我们回顾一下第 1 章中的设置，在那里我们为所有需要在 dbt 中运行代码的用户创建了一个\
  \ DBT_EXECUTOR_ROLE 角色。\n\n我们已经授予现有仓库运行查询和创建新数据库的权限。然后，我们将该角色分配给了我们的用户，以便我们可以在 dbt\
  \ DEV 环境中使用它，也分配给了我们将配置为运行 PROD 环境的 DBT_EXECUTOR 服务用户。\n\n因此，我们只需要创建数据库，因为现有的两个用户已经满足需求。\n\
  \n使用执行器角色创建新数据库。我们将其命名为 PORTFOLIO_TRACKING。如果你更改了名称，请记住相应地更改所有将使用此名称的命令和脚本：\n\n\
  ```sql\nUSE ROLE DBT_EXECUTOR_ROLE;\nCREATE DATABASE PORTFOLIO_TRACKING\n    COMMENT\
  \ = 'DB for the portfolio tracking project';\n```\n\n既然我们已经拥有所需的一切，现在可以创建一个新的 dbt\
  \ 项目。\n\n> **注意**\n> \n> 我们决定使用执行器角色创建数据库，但另一种选择可能是使用不同的角色来创建数据库，并赋予执行器角色在该数据库中创建\
  \ schema 的能力。\n> \n> 主要区别在于执行器角色是否能够（或不能）通过单条命令删除整个数据库。\n\n## 为投资组合项目创建新的 dbt 项目\n\
  \n我们已经准备好了所需的内容，因此我们将能够按照第二章中展示的相同步骤来创建新项目，下面回顾一下这些步骤：\n\n1. 从 dbt 主菜单（左上角的汉堡图标）中点击**账户设置**，在左侧菜单中点击**项目**，然后点击右上角的**新建项目**按钮。\n\
  \n    点击右上角的**开始**按钮，即可启动引导式设置。\n\n2. 输入项目名称——我们使用的是 `Portfolio tracking`。\n\n \
  \   完成后，点击**继续**按钮。\n\n3. 点击 Snowflake 的徽标或名称，选择 **Snowflake** 数据库。你将进入页面设置连接。\n\
  \n4. 在**连接设置**页面，输入**Snowflake 设置**信息，即适用于所有用户的通用连接参数，以及你的**开发凭据**信息，这些信息与你的用户和开发环境相关。\n\
  \n    请注意，你刚刚使用你想要的角色创建了你想使用的数据库，所以对于 Snowflake 设置，你只需要你的 Snowflake 账户（你的 Snowflake\
  \ 地址中介于 `https://` 和 `.snowflakecomputing.com` 之间的部分）和执行仓库名称（默认为 `COMPUTE_WH`，我们没有更改它）。\n\
  \n    然后，输入你的 Snowflake 用户详细信息，将 schema 设置为你的姓名首字母，将 target name 设置为 dev，并在 DEV\
  \ 环境凭据中使用 8 或 12 个线程。\n\n    测试你的连接，如果一切正常，点击继续按钮。\n\n5. 在“设置仓库”页面上，点击 GitHub 按钮（或你使用的\
  \ Git 提供商的相应按钮），然后选择你要使用的仓库（即我们刚刚创建的那个）。导入成功后，点击继续按钮，设置就完成了。\n\n恭喜——你现在已经在你的 dbt\
  \ 账户中设置好了一个新的空项目！\n\n> 注意\n> 如果你有一个较新的 dbt 账户，无法免费创建第二个项目，请使用前面的步骤更改我们已经设置的第一个项目，并使用后续步骤对其进行测试并从默认项目中清空它。\n\
  \n在 dbt 概览页面中，选择“开始开发”按钮进入集成开发环境（IDE）或代码编辑器。你也可以通过点击主菜单中的“开发”项来做同样的事情。\n\n进入代码编辑器后，点击“初始化你的项目”按钮，dbt\
  \ 将为你生成默认的 dbt 项目。点击“提交…”按钮将其保存到 Git 仓库：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_206_0.png)\n\
  \n图 5.4：dbt Cloud 界面与项目内容\n\n现在，通过两个非常简单的检查来确认你的项目设置正确：\n\n1. 在空白的临时面板中输入以下 SQL\
  \ 命令，然后点击“预览”按钮：\n\n    ```\n    select 1\n    ```\n\n    如果预览执行无误，并且你在查询结果面板中看到“返回了\
  \ 1 行”的结果，以及结果中的值 1，那么这意味着你可以连接到数据库并在其上运行查询。\n\n2. 在代码编辑器底部的命令行中输入 `dbt run` 命令来运行\
  \ dbt 默认项目。如果运行成功完成，则意味着你可以在数据库中创建 schema、表和视图。如果你转到 Snowflake 界面，你会发现 schema（使用你在项目设置中输入的姓名首字母）以及数据库中的两个模型（一个表和一个视图）已创建。\n\
  \n    这就是我们为确保能够使用 dbt 和 Snowflake 构建项目而需要做的全部工作。\n\n3. 你可以删除 models 文件夹中的示例文件夹来清理\
  \ dbt 默认项目。如果这样做，你还可以通过删除这两个模型或整个 schema（如果其中不包含其他任何内容）来清理数据库。\n\n太棒了！我们已经确认项目设置正确，并准备好开始我们的投资组合项目。\n\
  \n## 定义数据源并提供参考数据\n\n从理论上讲，每个数据仓库项目都可以归结为找到正确的数据源及其转换，以实现你想要的输出。\n\n在理想情况下，你总能找到所需的数据并产出你想要的结果，但现实通常更为复杂，因为你可能无法拥有你想要的所有数据源或信息。实际上，你常常需要调整你的目标，看看从已有数据出发能实现什么。\n\
  \n无论如何，定义数据源都是至关重要的，因为数据源就是提供给你的内容；除非你处于少数能够更改源系统收集内容或设计数据源的位置，否则通过编写适当的转换，你可以成为其中信息的最佳管理者。\n\
  \n### 在 dbt 中定义数据源\n\n在 dbt 中，你有两种合适的方式来指定和使用外部数据，即并非由 dbt 创建或转换的数据：\n\n- 源（Sources）：在\
  \ dbt 中使用外部数据的通用机制是，将你希望开始转换的初始数据定义为一个源，该源由指向一个数据库和 schema 的源系统定义，以及一个或多个从其中选择表或视图的表定义组成\n\
  \n\n\n\n- **数据库和 schema：** 定义源系统并使用 `source` 引用，是明确说明你认为是外部产生或由当前 dbt 项目外部管理的数据的使用方式的好方法，无论它是一个真正的外部系统，还是由另一个\
  \ dbt 项目管理但实际上是本地的数据。\n- **种子（Seeds）：** 在 dbt 中，你可以将 CSV 文件放入指定的文件夹，然后通过 `dbt seed`\
  \ 命令让 dbt 将它们加载到表中。请注意，这并非设计上通用的 CSV 数据加载机制。\n- **创建的数据：** 听起来很奇怪，但在数据仓库（DW）项目中，有些数据是可以凭空创建的。一个常见的例子是日历维度，但任何可以由某种逻辑和少量初始数据生成的数据都是如此。这些数据被视为普通模型，与其他任何逻辑部分相对于输入数据占绝对优势的模型一样，即使它们除了变量或硬编码值之外没有输入。\n\
  - **直接硬编码引用：** 当你开始在 dbt 中编写代码时，你可能会像在普通 SQL 查询中那样，直接引用实际数据库表，而不是使用 `source` 和 `ref`\
  \ 引用。请务必抵制这种做法。虽然从技术上讲，这是一种引用外部数据的潜在方式，但它也会彻底阻碍你的 dbt 项目，并在诸多层面削弱 dbt 的优势。我们只提几个避免直接引用的原因：使\
  \ dbt 无法以正确的顺序运行项目，无法追踪和可视化依赖关系（血缘），无法让你的代码在 dbt 管理的不同环境中工作，降低代码的灵活性，并使 dbt 无法生成正确的文档。你应当明白，在\
  \ SQL 中直接指定表名而不是使用正确的 `ref` 或 `source` 语法并不是一个好主意。\n\n构建 dbt 项目的正确方式是，将输入定义为 `sources`\
  \ 和 `seeds`，并在它们之上构建第一层 dbt 模型，然后继续转换管道，使用 `ref` 函数引用之前的模型，如 *第 2 章* 中 *介绍 source\
  \ 和 ref dbt 函数* 一节所述。\n\n## 理解并声明 dbt 源引用\n\n在你的代码中使用 `source` 引用，可以定义 dbt 项目的边界，并正确可视化和管理其依赖关系。\n\
  \n例如，你可以为源系统或特定源表声明数据新鲜度的 SLA，编写测试来定义对传入数据的预期，或者能够以非常灵活的方式管理外部数据位置。\n\n源是以 YAML\
  \ 文件中的元数据形式声明的，并且可以为任何你可以使用普通 `SELECT ... FROM db.schema.source` 语法查询的数据库对象定义，因此它包括外部表和类似的数据库扩展，你可以直接以这种形式查询它们，或者将它们封装在视图等标准数据库对象中。\n\
  \n提供和访问外部数据的典型模式是，来自特定系统（真实的或逻辑的）的所有数据都在你的 dbt 代码可以读取的数据库的 schema 中可用，这样你将**源系统**识别为数据库和\
  \ schema，将**源表**识别为该系统中（数据库和 schema）内的数据库对象（表、视图或其他）。\n\n以下代码让你了解源系统和源表的定义方式：\n\n\
  ```\nsources:\n  - name: <source system name>\n\n    database: <db name>\n    schema:\
  \ <schema name>\n    description: <some description of the system>\n\n    freshness:\
  \ # system level freshness SLA\n      warn_after: {count: 12, period: hour}\n  \
  \    error_after: {count: 24, period: hour}\n    loaded_at_field: <default timestamp\
  \ field>\n    tables:\n      - name: <name we want to use for the source table/view>\n\
  \        identifier: <name in the target database>\n        description: source\
  \ table description\n```\n\n让我们来描述上述源系统及其内部表的定义：\n\n- 初始的 `name` 字段定义了我们正在定义的源系统的名称，在\
  \ SQL 代码中使用 `source` 函数时，它将用于访问该系统。\n- `database` 和 `schema` 字段定义了读取的位置，如同在完全限定数据库名称中使用的那样。它们是可选的，默认使用项目连接中声明的数据库和\
  \ schema，但我们建议显式声明，除非它们严格遵循 dbt 项目的位置。\n- `description` 字段允许我们在文档中输入人类可读的描述。\n-\
  \ `freshness` 和 `loaded_at_field` 字段允许我们定义系统级或表级的数据新鲜度 SLA，该 SLA 定义了源系统表中最新数据在触发警告或错误之前允许的最大时效，以及用于查询表中数据时效的时间戳字段。系统级\
  \ SLA 或字段适用于其下定义的所有表，并且与 dbt 中一贯的做法一样，可以在更低层级（即表级）被覆盖。\n- `tables` 键引入对已定义系统内各个源表的声明。\n\
  - `tables` 下的 `name` 字段定义了我们想要访问的源表的名称，在 SQL 代码中使用 `source` 函数时，它将是用于访问的第二个元素。除非你包含一个\
  \ `identifier` 字段来提供目标数据库中的实际对象名称，否则将使用 `name` 字段，并且它必须与源系统位置中找到的对象相匹配。\n\n在此源表定义下，你可以声明所有可用的表属性和配置，此处以\
  \ `description` 字段为例，我们稍后将在所有模型中看到更多细节。例如，这包括测试和标签。\n\n一般来说，这可以视为一个普通的 dbt YAML\
  \ 文件，你可以使用现有的适用于源的通用 dbt 属性和配置。\n\n虽然你可以定义多个不同名称的源系统，并让它们指向同一个数据库和 schema，但这通常不是一个好主意，因为同一事物有两个名称会造成混淆。我认为这种方法的一个很好的用例是，当来自多个系统的数据被提供到同一个数据库和\
  \ schema 中时。通过定义多个源系统并选择正确的表，你可以有效地将哪个表来自哪个系统区分开来。\n\n## 涉及源的特殊情况\n\n一般来说，源是针对提供给我们的数据定义的，我们与\
  \ dbt 的第一次接触是从源定义开始读取该数据。\n\n虽然在逻辑和语义层面仍然如此，但在某些加载模式中，我们让 dbt 对系统接收的原始数据执行某些操作，然后在这些操作的结果上定义源，这将是我们\
  \ dbt 转换的起点。\n\n最常见的例子是我们使用 dbt 将文件中的数据摄取到落地表（landing table）中。\n\n在这种模式中，将原始数据从文件加载到落地表的步骤由\
  \ dbt `run-operation` 完成，该操作会调用一个宏来执行数据库命令，例如 `COPY INTO`。`run-operation` 在实际 dbt\
  \ 运行开始之前执行，并且落地表被定义为源表，这样当 dbt 代码运行时，它就会通过 `source` 引用正确地引用此外部源，我们的转换从落地表开始，而不是从文件开始。\n\
  \n其他常见情况包括：使用由 dbt `run-operation`（或一次性设置查询）创建的外部表，或者声明一个封装特殊数据库构造的视图，例如 **BigQuery（BQ）**\
  \ 中的联邦查询，以提供对非原生 SQL 数据的访问。\n\n> **重要提示**\n> 通常，使用 dbt 通过 `run-operation` 或设置时查询来管理资源创建，然后在这些设置或加载任务的结果上定义源，是非常有用的。其逻辑是将数据库对象定义为一个源，你可以从中开始编写构成\
  \ dbt 模型的 SQL 转换。\n\n\n\n\n\n## 理解种子\n\ndbt 中的种子加载机制并不是一种通用的大批量 CSV 数据加载方式——它只是作为一种实用工具，用于加载与当前项目紧密相关的小批量数据（最多几百行或几千行），这些数据在其他地方或用其他工具维护或加载没有太大意义。\n\
  \n适合作为种子加载的数据具有以下属性：不经常变化、通常手动维护、适合甚至需要在你的 Git 仓库中进行版本控制以跟踪变化。\n\n好的种子示例包括手动维护的列表，如测试用户或示例产品；特殊映射，如将用户代码映射到内部员工代码；或参考数据，如将国家代码连接至国家名称和统计数据，或将货币代码连接至名称。\n\
  \n不适合种子加载的情况包括：大文件，因为加载缓慢且每个副本将永远留在那里，使你的 Git 仓库杂乱无章；频繁变化的数据；以及包含个人或敏感信息的数据，因为它们将永远以明文记录并暴露在你的仓库中。\n\
  \n要从 CSV 文件加载数据，只需将文件直接或放在子文件夹中放入项目配置文件中指定的文件夹，然后运行`dbt seed`命令。当然，你还可以带开关运行`dbt\
  \ seed`命令，以更好地控制要加载或重新加载哪些种子。\n\n下面的代码行显示了项目配置文件中的种子配置行，你可以在其中指定要搜索种子的文件夹：\n\n```\n\
  seed-paths: [\"seeds\"]\n```\n\n如果不做其他操作，数据将加载到一个与 CSV 文件同名的表中，数据类型由 dbt 和目标数据库推断。\n\
  \n由种子加载生成的表可以使用`ref`函数像普通 dbt 模型一样访问。\n\n对于种子，dbt 提供标准的元数据驱动方法，在 YAML 文件内以分层方式定义属性和配置。\n\
  \n种子可以在主配置文件的`seed`键下配置，如下面的代码片段所示，其中展示了种子特有的配置：\n\n```\nseeds:\n  <resource-path>:\n\
  \    quote_columns: true | false\n    column_types:\n      column_name: datatype\n\
  ```\n\n通过该配置，你可以决定表生成在哪个数据库和模式中，定义 CSV 文件中的哪些列名需要加引号，最重要的是，声明每一列的数据类型，以便你可以自主选择，而不是依赖目标数据库的类型推断（有时推断会出错）。\n\
  \n要在你的种子上编写文档和定义测试，可以使用常规的 YAML 文件机制，就像对任何其他 dbt 模型一样定义它们。\n\n在接下来的章节中，我们将使用我们的投资组合跟踪项目来示例这个过程。\n\
  \n## 为投资组合项目加载第一批数据\n\n既然我们已经对 dbt 的功能有了基本了解，下面让我们通过加载我们希望跟踪的第一个投资组合的数据，看看这些功能如何在实际场景中发挥作用。\n\
  \n让我们从加载假设在虚构 ABC 银行中拥有的投资组合数据开始。然后，我们将尝试补充该信息。\n\n### 加载你的第一个投资组合数据导出\n\n每个券商都提供一种方式来下载我们持有投资的数据，我们称之为投资组合，每项投资称为一个持仓。\n\
  \n下表代表大多数银行在导出与其投资相关数据时提供的最少信息集。许多银行会提供更多数据。\n\n在此示例中，我们在三个不同市场（交易所）交易股票中持有三项投资（持仓），其中两项在美国，一项在加拿大：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_212_0.png)\n\n图 5.5：我们在 ABC 银行的虚构投资组合数据导出\n\
  \n为了快速启动项目，我们可以将此数据保存为 CSV 文件——我们可以使用 dbt 的种子功能加载它。然而，我们在前一节中解释过，此功能并非用于加载经常变化的数据，而且每天更新投资组合就在\
  \ Git 仓库中保留一个 CSV 文件并不合理，因此这将是对该功能的滥用。\n\n为了保持配置简单并避免使用外部文件存储系统（如 AWS S3、Google\
  \ File Storage 或 Azure Storage）或安装 SnowSQL 从本地文件系统加载文件，我们将指导你使用 Snowflake 用户界面（UI）将\
  \ CSV 数据加载到表中。本质上，我们将手动执行通常自动完成的摄取基于文件的数据的过程。我们将在本书最后一部分详细分析基于文件的加载模式。\n\n因此，计划如下：\n\
  \n1. 创建用于保存外部数据的落地表。\n2. 手动将 CSV 文件中的外部数据加载到落地表。\n3. 将落地表定义为我们源表。\n4. 从源表读取数据以开始我们的\
  \ ELT。\n\n将数据加载到落地表并随后在其上定义源表，目的是为使用我们的数据提供一种弹性方式，这样如果在某个时刻我们开始以自动化方式或从不同的文件存储系统加载此数据，我们的\
  \ ELT 也不必更改。\n\n那么，让我们开始吧！\n\n1. 在本章前面，我们创建了将要使用的`PORTFOLIO_TRACKING`数据库，所以让我们先使用执行者角色创建一个`SOURCE_DATA`模式来保存我们从外部源加载的数据：\n\
  \n```sql\nUSE ROLE DBT_EXECUTOR_ROLE;\nCREATE SCHEMA PORTFOLIO_TRACKING.SOURCE_DATA;\n\
  ```\n\n2. 既然我们有了模式，就可以创建`ABC_BANK_POSITION`表，我们要将 ABC 银行投资组合的数据加载到其中：\n\n```sql\n\
  CREATE OR REPLACE TABLE\n    PORTFOLIO_TRACKING.SOURCE_DATA.ABC_BANK_POSITION (\n\
  \        accountID        TEXT,\n        symbol           TEXT,\n        description\
  \      TEXT,\n        exchange         TEXT,\n        report_date      DATE,\n \
  \       quantity         NUMBER(38,0),\n        cost_base        NUMBER(38,5),\n\
  \        position_value   NUMBER(38,5),\n        currency         TEXT\n);\n```\n\
  \n前面的语句创建了一个与我们的 CSV 文件具有相同列、数据类型和相同顺序的表，这样我们可以轻松加载它。\n\n现在我们已经有了保存数据的表，可以使用 Snowflake\
  \ 界面加载它：\n\n1. 首先，按照前面图中的格式创建一个包含你投资的文件，并将数据导出为 CSV 格式（遵循美国标准或调整格式），或者从我们的仓库下载图片中的\
  \ CSV：`https://github.com/PacktPublishing/Data-engineering-with-dbt/blob/main/Chapter_05/ABC_Bank_PORTFOLIO__2021-04-09.csv`。\n\
  \n2. 为了无问题地读取 CSV，我们必须向 Snowflake 提供有关我们如何导出 CSV 文件的设置。我们可以通过定义文件格式（File Format）轻松做到这一点，之后每次使用相同格式的文件时都可以复用该格式。\n\
  \n以下代码创建了一个适用于读取通过使用美国区域设置（美国标准设置）从 Excel 导出数据而创建的 CSV 文件的文件格式：\n\n```sql\nCREATE\
  \ FILE FORMAT\n    PORTFOLIO_TRACKING.SOURCE_DATA.ABC_BANK_CSV_FILE_FORMAT\n   \
  \     TYPE = 'CSV'\n        COMPRESSION = 'AUTO'\n        FIELD_DELIMITER = ','\n\
  \        RECORD_DELIMITER = '\\\\n'\n        SKIP_HEADER = 1\n        FIELD_OPTIONALLY_ENCLOSED_BY\
  \ = '\\\\042'\n        TRIM_SPACE = FALSE\n        ERROR_ON_COLUMN_COUNT_MISMATCH\
  \ = TRUE\n        ESCAPE = 'NONE'\n        ESCAPE_UNENCLOSED_FIELD = '\\\\134'\n\
  \        DATE_FORMAT = 'AUTO'\n        TIMESTAMP_FORMAT = 'AUTO'\n        NULL_IF\
  \ = ('\\\\N')\n;\n```\n\n3. 现在你已准备好 CSV 和读取它的文件格式，请在浏览器中转到你的 Snowflake 账户，并确保选择你的\
  \ DBT_EXECUTOR_ROLE 作为你扮演的角色（在 Snowflake 界面右上角）。\n\n请注意，大多数属性是可选的，因为它们有正确的默认值，但如果你选择关键值，我们提供的文件格式与**加载数据**向导提供的相同。重要的是要注意`SKIP_HEADER\
  \ = 1`的值，因为这允许你将第一行定义为标题（在加载数据时跳过）。`FIELD_DELIMITER`和`RECORD_DELIMITER`属性很重要，因为它们定义了一行中列的分隔方式以及行的结束方式（`'\\\
  n'`是换行符）。\n\n`FIELD_OPTIONALLY_ENCLOSED_BY = '\\\\042'`属性指定字符串类型的列可以选择性地用双引号括起来。如果它们包含具有特殊含义的字符（例如分隔符），则需要这样做。\n\
  \n\n\n\n要将 CSV 中的数据加载到我们创建的表中，请点击左上角的**数据库**图标，然后在出现的列表中点击 **PORTFOLIO_TRACKING**\
  \ 数据库。接着，选中该行，或点击 **ABC_BANK_POSITION** 表的名称，并点击**加载表**以启动**加载数据**向导：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_215_0.png)\n\
  \n图 5.6：Snowflake 中的加载数据向导\n\n在**加载数据**向导中，选择你要用于加载数据的仓库，然后在**仓库**页面上点击**下一步**。点击**选择文件**，选择你已保存的\
  \ CSV 文件，然后在**源文件**页面上点击**下一步**。选择我们创建的文件格式，并在**文件格式**页面上点击**加载**。如果你想浏览向导的下一页，可以点击**下一步**，然后点击**加载**。\n\
  \n点击**加载**按钮后，Snowflake 会将 CSV 文件加载到一个暂存区（stage），然后使用我们指定的文件格式在内存中解析它，最后通过 `COPY\
  \ INTO` 命令将数据插入到指定的表中，这是加载大量数据最有效的方式。\n\n为了确认一切正常，请回到 Snowflake 界面中的**工作表**，然后在左侧导航面板中选择我们加载数据时所用的数据库、模式和表。你应该会看到该表包含的行数与\
  \ CSV 中的行数一致。你可以点击**预览数据**查看数据的前几行。\n\n## 定义源数据\n\n在真实项目中，你通常已经获得了源数据，或者你的团队已经构建了加载数据的管道。在本书的最后一部分，我们将对此进行详细说明。\n\
  \n现在，让我们为已加载的数据定义 dbt 源，然后从 dbt 中访问它。\n\n兼顾项目条理、编辑便捷并避免大量合并冲突的一个最佳实践是：为我们获取数据的每个源系统分别定义一个\
  \ YAML 文件。\n\n在 dbt 编辑器的 models 文件夹下创建一个名为 `source_abc_bank.yml` 的新文件，内容如下：\n\n\
  ```yaml\nversion: 2\nsources:\n  - name: abc_bank\n    database: PORTFOLIO_TRACKING\n\
  \    schema: SOURCE_DATA\n    tables:\n      - name: ABC_BANK_POSITION\n```\n\n\
  你可以在我们的仓库中找到该源文件，它位于 dbt 文件夹中*第 5 章*材料里的 `05_03_v1__source_abc_bank.yml` 文件中。\n\n\
  我们来分析一下上面的文件：\n\n- 以 `version: 2` 开头的那一行是必须的，它告诉 dbt，这个 YAML 文件使用的是第二版 dbt YAML\
  \ 文件规范。第一版已被弃用。\n- 下一行的 `sources:` 声明我们将在该声明下描述一些源系统。\n- 带有 name 属性的那一行引入了第一个系统及其名称。\n\
  - 系统名称下面是一些用于更好地配置源的属性。其中 database 和 schema 属性告诉 dbt 到哪里查找该源系统的表。\n- `tables:` 属性引入了我们将从该源系统中使用的源表的声明。我们可以根据需要添加任意数量的表。\n\
  - `- name: ABC_BANK_POSITION` 这一行使用 name 属性引入了第一个系统表，正如我们对源系统所做的那样。\n\n目前，我们已尽量让它保持简单，但很快我们就会看到，我们将利用这个声明来添加更多功能，例如描述列和引入测试。\n\
  \n通过这个初始 YAML 文件，我们完成了第一个源的最小配置，从而能够简单而灵活地访问数据。\n\n我们可以编写下面这个查询来测试我们的源，这是测试源的最简单方式：\n\
  \n```sql\nSELECT *\nFROM {{ source('abc_bank', 'ABC_BANK_POSITION') }}\n```\n\n\
  请注意，dbt 中的名称区分大小写，因此请使用与 YAML 文件中相同的大小写。这要求你的项目内部就表和源名称达成一致的命名约定。\n\n在 dbt IDE 中点击**预览**按钮，即可让\
  \ dbt 编译并在你的数据库上运行该查询，然后带你进入**查询结果**选项卡，在那里你可以看到查询结果：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_217_0.png)\n\
  \n图 5.7：在 dbt 的“预览”选项卡中对源执行查询的结果\n\n进入**已编译 SQL**选项卡，你可以看到在数据库上执行的 SQL，如下图所示。请注意，点击\
  \ `</>` **编译**按钮只会编译代码并将你带到**已编译 SQL**选项卡，而不会执行它：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_217_1.png)\n\
  \n图 5.8：上述查询在 dbt 的“编译 SQL”选项卡中的编译代码\n\n我们来讨论一下：\n\n- 在 SELECT 命令中使用 `*`（星号）可以获取所读取源中的所有字段，从而为将来的更改留有空间。\n\
  - 我们计算 UNREALIZED_PROFIT，即当前价值与持仓成本基础之间的差额。\n\n关于文件名的说明：我们将 CSV 文件命名为 ABC_BANK_POSITION，将\
  \ dbt 模型命名为 POSITION_ABC_BANK。这些名字好吗？我们会有混淆的风险吗？\n\n先考虑来源、再考虑内容，这种思考传入数据的方式是常见且合乎逻辑的，因此我们的\
  \ CSV 名称正体现了这种“来源优先”的思路，这种思路适用于源层和存储层。当我们转向精炼层中承载信息的 dbt 模型时，我们开始优先考虑内容（或概念）；如果数据不具有通用性，或其适用范围有限，我们可能还需要或希望回忆其来源。我们模型的名称表明，我们讨论的是\
  \ POSITION 这一概念，且其内容仅限于 ABC Bank 系统。\n\n到目前为止一切顺利，但如果运行查询，看起来代码为 TTD 的“TRADE DESC\
  \ INC/THE”头寸具有很大的绝对盈利，而其他头寸则只有很小的盈利。让我们添加一个 UNREALIZED_PROFIT_PCT 字段，以体现初始投资的规模。\n\
  \n让我们将 POSITION_ABC_BANK.sql 文件修改如下：\n\n```sql\nSELECT\n    *\n    , POSITION_VALUE\
  \ - COST_BASE as UNREALIZED_PROFIT\n    , UNREALIZED_PROFIT / COST_BASE as UNREALIZED_PROFIT_PCT\n\
  FROM {{ source('abc_bank', 'ABC_BANK_POSITION') }}\n```\n\n现在，我们也得到了相对于持仓成本基础的盈利百分比。\n\
  \n一切看起来都不错，但也许我们不喜欢除法运算产生的那一串长长的小数。\n\n让我们使用 Snowflake 的标准 ROUND 函数来解决这个问题。\n\n\
  将该行修改如下：\n\n```sql\n, ROUND(UNREALIZED_PROFIT / COST_BASE, 5)\n    as UNREALIZED_PROFIT_PCT\n\
  ```\n\n现在，我们将结果四舍五入到了小数点后第五位。\n\n你可以在 Git 仓库中、dbt 文件夹里第 5 章素材中的 05_04_v1__POSITION_ABC_BANK.sql\
  \ 文件中找到该源文件的最终版本。\n\n## 实时血缘与项目导航\n\n我们已经根据所声明的唯一源创建了我们的第一个 dbt 模型，因此现在在项目中很难迷失方向；但如果你有数据平台的使用经验，你就会知道理解哪些转换相互关联是多么复杂。\n\
  \n别灰心，在 POSITION_ABC_BANK 模型中点击 dbt IDE 的 Lineage（血缘）选项卡即可。\n\n看看吧……你现在有了一张漂亮且易于阅读的血缘图，它展示了该模型与所有其他相关模型之间的关系：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_220_0.png)\n\n图 5.9：投资组合项目的初始血缘图\n\n\
  虽然目前可看的内容不多，因为我们只声明了一个源表（如左侧带箭头的数据库图标所示）和一个模型（如右侧的立方体图标所示），但当你的项目变得更大、更复杂时，这张图将成为你轻松遍历模型、记住自己构建内容的无价指南。\n\
  \n血缘图是实时绘制的，并且始终与你的项目保持同步。\n\n你还可以使用它在项目中快速移动：双击即可跳转到某个模型或某个源的定义。该图也是动态的，你可以拖拽各个方框，按照对自己更有意义的方式排列，甚至可以复制或打印出来，以便更好地与同事或利益相关者沟通。\n\
  \n## 部署第一个 dbt 模型\n\n到目前为止，我们只是创建了文件，在每次修改后保存了几次，并使用 dbt Cloud 上的“预览”按钮功能运行了它——但数据库中还不存在任何表，仓库中也未保存任何代码。让我们来解决这个问题。\n\
  \n要在我们的 DEV 环境中部署代码，我们必须使用 IDE 底部的命令行手动执行所需的 dbt 命令。\n\n执行以下命令以运行所有模型（尽管目前我们只有一个！）并将它们部署到\
  \ Snowflake：\n\n```bash\ndbt run\n```\n\n几秒钟后，命令成功执行完毕，你的模型就在数据库中创建好了——但它在哪里？\n\n\
  \n\n\n它将被创建在你创建此项目时配置 Snowflake 时在向导中命名的 schema 中。我使用了 RZ，我们建议使用你的姓名首字母。\n\n当我们使用\
  \ `dbt run` 测试一切配置是否正确时，初始默认项目也是在同一个 schema 中创建的。\n\n要在 DEV 环境中部署代码，你需要手动运行命令，因为通常的做法是一次添加一个模型，并在满意之前修改几次或很多次，而不想在每次更改时都运行所有内容。通过手动运行，你可以随时运行和测试你认为正确的部分。\n\
  \n我们将看到，要在部署环境中部署，你将使用一个作业（job）——即一系列 dbt 命令。你只需定义一次，每次想要部署和运行该环境时运行它即可。\n\n好处在于，你可以为每个环境定义多个作业，这样你可以有一个运行所有内容的作业，还有一个只加载每小时变化的数据并只刷新依赖该数据的任何内容的作业。\n\
  \n## 提交第一个 dbt 模型\n\n通过运行所需的 dbt 命令，我们现在已经在数据库中生成了模型，但模型的代码只存在于 dbt Cloud 服务器上，并不在我们的\
  \ Git 仓库中。\n\n要将当前版本的代码添加到 Git 仓库，我们必须提交更改。\n\n在 dbt Cloud 中你可以非常轻松地完成此操作，因为它有一个引导式\
  \ Git 工作流，允许你轻松创建 Git 分支，然后在开发过程中提交更改，最后打开一个**拉取请求（PR）**，将该开发内容合并到 `main` 或 `master`\
  \ 分支。\n\n要提交项目、模型和配置的当前代码，请单击 dbt IDE 左上角的绿色 **commit...** 按钮，然后在打开的弹出窗口中输入提交消息。单击\
  \ **commit** 按钮会将代码作为新提交发送到 Git。\n\n请记住，在完成提交之前保存所有打开的模型和配置文件，因为只有已保存的内容才会被提交。无论如何，请放心，如果有未保存的文件，dbt\
  \ IDE 会发出警告。\n\n既然你已经提交了它们，你的更改也会保存到 Git 仓库中，最重要的是，现在所有可以访问该仓库的人都可以使用这些更改。\n\n每次提交后，只要\
  \ IDE 上的代码自上次提交以来没有更改，你就可以打开一个 PR 与同事共享代码，并开始收集反馈或请求最终批准将其合并回 `main` 分支。我们将在后面的章节中再讨论协作。\n\
  \n## 配置我们的项目以及数据存储位置\n\n你在开发凭据中定义的 schema 就是你的开发环境将存在的 schema，如果我们不做任何操作，我们创建的所有内容都将生成在该\
  \ schema 中。\n\n请注意，用于 DEV 环境或部署环境的 schema 在 dbt 文档中通常被称为目标 schema（target schema），在代码中可以通过\
  \ {{ target.schema }} 使用。\n\n随着时间的推移，将所有内容生成在同一个单一 schema 中会变得混乱，而我们主要目标之一是创建和维护一个让开发人员更轻松的环境，所以让我们修复这个问题，并通过配置\
  \ dbt 项目的不同部分在我们的环境中创建到不同的 schema 来开始建立更多秩序。\n\n问题在于，我们的环境被定义为一个 schema，而在数据库中，不能在一个\
  \ schema 中嵌套另一个 schema，因此我们无法在 DEV 环境的目标 schema 内创建多个 schema。\n\n为了克服这个问题，dbt 会在多个\
  \ schema 中生成表和视图，这些 schema 的名称由目标 schema 的名称加上我们为特定内容定义的自定义 schema 名称组成，最终的 schema\
  \ 名称布局如下：<target_schema>_<custom_schema>。\n\n例如，如果我的目标 schema 是 RZ，并且内容被配置为进入名为\
  \ REFINED 的自定义 schema，那么内容在我的环境中部署时实际的 schema 名称将是 RZ_REFINED。相同的内容部署到目标 schema\
  \ 为 PROD 的环境中时，将创建在 PROD_REFINED schema 中。\n\n回顾一下，请记住，你在定义环境时定义目标 schema，通常连同连接详细信息一起定义，而你在主\
  \ dbt 配置文件中配置自定义 schema，或者像任何其他配置一样在项目中覆盖它。\n\n## 主配置文件\n\n我们用于定义和配置 dbt 项目（包括资源创建位置）的主要元素是主配置文件\
  \ dbt_project.yml。\n\ndbt 将包含 dbt_project.yml 文件的文件夹定义为 dbt 项目文件夹，此文件包含项目的必要和通用配置，这些配置最终可以在更具体的级别被覆盖。\n\
  \n打开它，并按照我们的描述和更改进行操作。\n\n在前几行（通常是第 5 到 7 行），你会看到以下内容：\n\n```\nname: 'my_new_project'\n\
  version: '1.0.0'\nconfig-version: 2\n```\n\n将名称改为有意义的名字是一个好习惯，因此我们将其命名为 `portfolio_tracking`。\n\
  \n你可以将版本改为 `0.1.0`，并在进行次要版本发布时更新它，或者保持原样，只在主要版本发布时更新。我们将保持它不变。\n\n不要更改 `config-version`，因为它指定了要使用的配置定义的版本，而版本\
  \ 2 是当前使用的版本。\n\n继续向下，你会在大约第 10 行找到要使用的 profile 名称，如下所示：\n\n```\nprofile: 'default'\n\
  ```\n\n这在 dbt Cloud 中不会使用，但在 dbt Core 中，它用于从连接配置文件中可定义的众多连接 profile 中选择要使用的连接 profile。\n\
  \n在此之后，是路径的定义，dbt 在这些路径中查找不同类型的对象、放置生成的代码，以及如果你运行 `dbt clean` 命令时要清理的内容。\n\n这通常在第\
  \ 15 到 25 行，如下所示：\n\n```\nmodel-paths: [\"models\"]\nanalysis-paths: [\"analyses\"\
  ]\ntest-paths: [\"tests\"]\nseed-paths: [\"seeds\"]\nmacro-paths: [\"macros\"]\n\
  snapshot-paths: [\"snapshots\"]\ntarget-path: \"target\"  # directory for compiled\
  \ SQL files\nclean-targets:         # directories to be removed by `dbt clean`\n\
  \  - <target>\n  - <dbt_packages>\n```\n\n不要更改这些，因为它们没有问题，除非你有非常特殊的需求。\n\n默认配置文件的最后一部分是关于配置模型和其他\
  \ dbt 对象的，我们稍后会看到。随着时间的推移，我们可能会为其他元素添加配置，例如 seeds、snapshots、variables、sources、tests\
  \ 以及我们想要为项目全局配置的任何其他功能。\n\n模型配置仍然反映旧名称和示例项目，所以让我们将其更改以适应当前需求，如下例所示：\n\n```\nmodels:\n\
  \  portfolio_tracking:\n    +materialized: view\n    refined:    # Applies to all\
  \ files under models/refined/\n      +materialized: table\n      +schema: REFINED\n\
  ```\n\n你可以在我们仓库中 `dbt` 文件夹内 *第 5 章* 的材料中的 `05_05_v1__dbt_project.yml` 文件中找到此源文件的初始版本。\n\
  \n让我们回顾一下我们配置的内容：\n\n- 在通用的 `models:` 下（一个适用于所有项目中所有模型的标签），我们嵌套了项目名称 `portfolio_tracking:`，以仅配置此项目的模型。\n\
  - 在我们的项目下，我们添加了模型特定的 `materialized` 配置，值为 `view`，因为我们希望模型默认以视图形式创建。\n- 在我们的项目下，我们接着命名了\
  \ `refined` 文件夹，该文件夹尚不存在，但我们已经可以为其及其子文件夹声明配置。\n- 在 `refined` 文件夹下，我们再次声明了模型特定的 `materialized`\
  \ 配置，值为 `table`，因为我们希望放置在其下的模型以表的形式物化。\n- 在 `refined` 文件夹下，我们还声明了 `schema` 配置，值为\
  \ `REFINED`，因为我们希望其下的模型在自定义 schema 部分为 `REFINED` 的 schema 中创建。\n\n我们在配置关键字（如 `schema`）前面添加了一个\
  \ + 符号，以便更容易地将它们与用于分层应用配置的文件夹名称区分开来。请注意，+ 是可选的，仅用于提高可读性。\n\n概括来说，如果我们没有为模型定义任何自定义\
  \ schema，它们将创建在目标 schema 中，即我们在连接配置中定义的那个 schema。如果我们定义了自定义 schema，模型将创建在一个 schema\
  \ 中，其名称由目标 schema 和所定义的自定义 schema 组成；这确保每个开发人员或环境都能在具有不同且唯一名称的 schema 中创建其数据库对象。\n\
  \n## 将我们的环境重新部署到目标 schema\n\n在第一次部署之后，我们添加了配置，以便能够将*细化模型*生成到自定义的 `refined` schema\
  \ 中。\n\n如果我们现在再次运行 `dbt run` 命令……什么也不会改变。\n\n为什么？因为我们将 `refined` 文件夹中的模型配置为进入 `refined`\
  \ schema，而我们的 `POSITION_ABC_BANK` 模型位于 `model` 文件夹中，而不是 `model/refined` 文件夹中。\n\n\
  \n\n让我们创建文件夹、移动模型并重新运行项目：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_225_0.png)\n\
  \n图 5.10：创建文件夹的菜单以及移动文件后的结果\n\n如果将鼠标悬停在 dbt IDE 中的 models 文件夹上，它会被高亮显示，并且在最右端会出现一个由三个点指示的菜单。单击这三个点，然后选择\
  \ New Folder 菜单项。\n\n在文件夹名称中输入小写的 refined，就像在配置文件中所做的那样。请记住，在 dbt 中，文件和文件夹名称区分大小写。\n\
  \n要移动 POSITION_ABC_BANK 模型，请将鼠标悬停在其名称上，单击三个点打开菜单，然后选择 Rename 项。\n\n在文件名前添加 refined/，使完整路径变为\
  \ models/refined/POSITION_ABC_BANK.sql，然后单击 Save 按钮。\n\n你会看到该文件现在出现在 refined 文件夹下。\n\
  \n我们现在可以再次运行项目，在我们配置的位置创建模型。\n\n在 dbt IDE 的命令行中执行常用命令：\n\n```\ndbt run\n```\n\n\
  现在你可以前往 Snowflake 数据库，检查 POSITION_ABC_BANK 表是否已在 RZ_REFINED schema 下创建（将 RZ 替换为目标\
  \ schema）。另请注意，该 schema 也已为你自动创建，无需你执行任何额外操作。\n\n很好，我们已经轻松清理了开发环境，这是在开发过程中保持环境干净的方法，同时你可以频繁更改模型名称（频繁）和位置（初始模型后很少更改）的想法。\n\
  \n这是管理公共 QA 或测试环境或生产环境的好方法吗？不，手动管理环境只建议用于你自己的开发环境，并且只针对尚未发布到其他环境的模型。由于这些模型只存在于你的环境中，我们建议保持轻量级管理，并直接在数据库上使用手动命令进行管理。\n\
  \n对于已发布到其他环境的模型，我们需要在每个环境中一致且适时地应用更改，因此不能手动完成——必须自动化。\n\n对数据库的自动化更改通常称为**数据库迁移**，因为它们将数据库从一种状态迁移到另一种状态，并且可以通过\
  \ Flyway 或 Liquibase 等专门软件应用。\n\n在接下来的章节中，我们将看到，通过使用极其简单的 dbt 宏来保存 SQL 代码，并使用 run-operation\
  \ 命令来执行它们，可以在 dbt 中使用相同的方法。\n\n回顾一下这个概念：在发布模型之前，它对你来说是私有的，你可以手动管理；但一旦发布到外部，就需要一种一致的方法，我们将使用数据库迁移的概念在所有需要的环境中应用这些更改。\n\
  \n## 为我们的架构配置各层\n\n既然我们已经讨论了希望模型生成的位置，现在是时候思考我们讨论过的整体架构，并开始落实配置来实现它了。\n\n让我们看看如何组织我们定义的三个层：\n\
  \n- **数据存储层：** 我们将教你以两种方式实现这一层——使用 *dbt 快照* 和 *仅插入式摄入历史表*。在这两种情况下，我们都会将快照或模型配置到它们自己的\
  \ schema 中；主要区别在于，快照是全局的，意味着每个环境都使用相同的快照，并将存储在 snapshots 文件夹中，而历史表则使用存储在 staging\
  \ 文件夹中的普通模型实现，因此每个环境都是独立的，从而提供更多的自由度和可扩展性。\n- **精细化数据层：** 我们已经配置了 refined 文件夹，使其下的模型将在\
  \ refined schema 中生成。\n- **数据交付层：** 数据交付层由一个或多个数据集市实现。每个数据集市的模型在 marts 文件夹下各自的文件夹中创建，每个数据集市在数据库中的独立\
  \ schema 中创建。\n\n让我们准备配置，以便设置好所有层。\n\n模型和快照配置都可以存储在主配置文件 `dbt_project.yml` 中，因此请打开并更新它，如下所示：\n\
  \n```yaml\nmodels:\n  portfolio_tracking:\n    +materialized: view\n    staging:\
  \      # Data storage layer\n      +materialized: view\n      +schema: STAGING\n\
  \    refined:      # Refined data layer\n      +materialized: view\n      +schema:\
  \ REFINED\n    marts:        # Data delivery layer\n      portfolio:   # one specific\
  \ data mart\n        +materialized: table\n        +schema: MART_PORTFOLIO\nsnapshots:\n\
  \  portfolio_tracking:\n    +target_schema: SNAPSHOTS\n```\n\n你可以在我们仓库的 dbt 文件夹中\
  \ *第 5 章* 的资料中找到此源文件的更新版本，即 `05_05_v2__dbt_project.yml` 文件。\n\n让我们回顾一下配置：\n\n- `staging`\
  \ 文件夹的内容现在默认在 STAGING schema 中创建为视图。此配置将用于使用暂存视图的仅增量摄入（在文件夹级别配置），以及将增量加载并单独配置的历史表。\n\
  - `refined` 文件夹的内容现在默认在 REFINED schema 中创建为视图。\n- 嵌套在 marts 文件夹下的 `portfolio` 文件夹的内容将默认在\
  \ MART_PORTFOLIO schema 中创建为表。\n- 此项目的快照组织在 snapshots 文件夹下，将在 SNAPSHOTS schema 中创建。它们总是生成为表，并增量加载。\n\
  \n为不同层生成视图或表主要是一种性能选择，因为它们在功能上是等价的。表创建较慢且占用存储空间，但查询速度快得多。\n\n因此，将 ELT 期间被多次查询的模型物化为表是有意义的，这样计算只执行一次；对于最终用户在交互模式下查询的模型也是如此，以便查询在尽可能短的时间内执行。\n\
  \n在上一节中，我们将 refined 层配置为生成表；当我们还没有数据集市层，且 refined 层同时也是交付层时，这是一个明智的选择。\n\n交付层通常物化为表，但如果你使用的\
  \ BI 工具在内部存储来自数据集市层的数据（例如 Power BI），那么将该层生成为视图是一个明智的选择，因为每个视图将被查询一次以在工具中加载数据。\n\n\
  ## 通过测试确保数据质量\n\n到目前为止，我们已经将 CSV 中的数据加载到落地表中，并创建了一个模型来读取其中的数据，但我们如何确保数据的可靠性呢？\n\n\
  我们如何提供真正的数据质量？\n\n最好的方法是让数据质量成为现实，而不仅仅是希望。它明确定义了我们对输入和输出的期望，然后检查数据是否符合这些要求。这就是能够在数据上定义可运行测试的本质。\n\
  \n在 dbt 中，我们可以定义两种类型的测试：\n\n- **通用测试**，曾被称为 schema 测试，本质上是通用的，因此被编码在参数化查询中，可以通过在\
  \ YAML 配置文件中命名它们来应用于任何模型或任何模型中的任何列。\n\n  dbt 默认定义的通用测试示例包括：列不为 `null` 或具有唯一值的测试，但我们也可以定义自己的测试，例如测试哈希列是否不会产生哈希冲突。\n\
  \n- **单一测试**是最通用的测试形式，因为你可以测试任何能用 SQL 表达的内容。你只需编写一个 SQL 查询，返回未通过测试的行，无论你想测试什么，是单个计算、全表匹配，还是多表中列的子集。\n\
  \n通用测试在 YAML 配置文件中配置，只需定义需求，即可轻松测试大量表和列中的常见需求——无需其他额外工作。\n\ndbt 自带四种已实现的通用测试类型：\n\
  \n- `not_null`：测试表中的列永远不会为 null。\n- `unique`：测试列中的值是唯一的。\n- `relationships`：测试两个表之间的参照完整性，即表中的每个外键值都存在于指定表的指定列中。换句话说，你测试被测试表中没有*孤儿记录*。\n\
  - `accepted_values`：测试列中的值是指定值之一。\n\n\n\n\n\n我们随后声明了第一个测试，`not_null`，要求表中每一行的 ACCOUNTID\
  \ 列不包含 `null` 值。请注意，这与数据库列是否被声明为可空无关。\n\n`not_null` 测试在很大程度上是最常用的测试，因为我们经常希望确保我们获取或产生的数据在被测试的列中始终具有非空数据。\n\
  \n> **实用提示**\n>\n> 在我们转向为此数据源想要介绍的其他测试之前，这里有一些关于处理 YAML 文件的实用建议。\n>\n> 请注意在 YAML\
  \ 文件中，对齐对于定义结构至关重要，因此请尽量精确地进行，否则您会遇到编译错误，因为 YAML 解释器将无法正确解析您的配置文件。\n>\n> 在添加新的配置片段后，请检查\
  \ dbt IDE 右下角是否显示**就绪**的绿色字样，以确保项目编译正确。为了确保您不会引入编译错误，您可以在保存更多更改时瞥一眼。\n>\n> 当这种情况发生，即使在阅读错误消息后您也无从知晓时，我们建议删除您更改的块，以便编译再次正确，然后一次添加回一点，以了解阻止编译的问题所在。\n\
  \n让我们继续添加并对表中其他列所需的测试进行评论：\n\n```yaml\n- name: SYMBOL\n  description: The symbol\
  \ of the security at ABC Bank.\n  tests:\n    - unique\n    - not_null\n```\n\n\
  接下来，我们正在配置 SYMBOL 列的描述和测试，我们假设它是一个银行头寸的良好自然键。\n\n因此，我们同时声明了 `not_null` 和 `unique`\
  \ 测试，这是唯一性约束的标志，例如键，无论是自然键还是代理键。\n\n```yaml\n- name: DESCRIPTION\n  description:\
  \ The name of the security at ABC Bank.\n  tests:\n    - not_null\n```\n\n在前面的配置片段中，我们正在配置\
  \ DESCRIPTION 列的描述和测试，我们希望它为 not_null，因为它具有证券的名称。\n\n```yaml\n- name: EXCHANGE\n\
  \  description: >\n    The short name or code of the exchange\n    where the security\
  \ is traded.\n  tests:\n    - not_null\n```\n\n在前面的配置片段中，我们正在配置 EXCHANGE 列的描述和测试，我们希望它为\
  \ not_null，因为它具有证券被购买的交易所的名称或代码。我们将在参考 STG 模型时更深入地讨论命名。\n\n我们也可以考虑使用 accepted_values\
  \ 测试来表达交易所值应限制为已知值列表，但由于我们没有理由限制值，此类测试只会在失败时产生误报，促使我们维护列表以添加新值。\n\n请注意，如果我们需要因任何法规而被提醒使用新交易所，或确保其他数据或授权已到位，这可能是一个明智的策略。\n\
  \n然后我们会将授权或配置的交易所添加到测试接受的列表中，如果使用我们未命名为已接受的其他交易所，我们将收到错误。\n\n```yaml\n- name: REPORT_DATE\n\
  \  description: >\n    The date the report was extracted by ABC Bank.\n    We consider\
  \ this position to be effective\n    from this date forward, until a change is seen.\n\
  \  tests:\n    - not_null\n```\n\n对于 REPORT_DATE 列，我们希望它为 not_null，因为我们需要能够知道位置中的信息所指的日期。时间在现实中非常重要，在数据仓库方面，这可能是整本书的主题。我们将经常谈论它。\n\
  \n```yaml\n- name: QUANTITY\n  description: >\n    The number of securities we hold\
  \ in the\n    portfolio at ABC Bank at the Report Date.\n  tests:\n    - not_null\n\
  ```\n\n对于 QUANTITY 列，我们希望它为 not_null，因为我们需要知道我们有多少证券。仅知道“投资组合中有一些该证券”而不知道实际持有的股票或头寸数量根本没有帮助。\n\
  \n```yaml\n- name: COST_BASE\n  description: >\n    The cost we paid for the securities\
  \ that\n```\n\n您可以在我们的存储库中找到此源文件的更新版本，在 dbt 文件夹中第 5 章的材料中，05_03_v2__source_abc_bank.yml\
  \ 文件内。\n\n## 重要说明\n\n测试在整个数据生命周期中非常有用。\n\n在这里，我们在创建源和第一个模型之后才介绍它们，以避免用太多新主题使您不堪重负。在项目的现实中，在编写源和模型时编写测试是有用的。\n\
  \n当开始使用我们不完全了解的数据时，测试尤其有用，因为它们允许数据工程师轻松快速地表达和验证他的假设。\n\n知道预期的唯一性约束和字段的可空性，特别是外键和关系完整性约束是否得到满足，对于设计数据上的\
  \ ELT 转换非常重要。\n\n测试使我们能够最初分析，然后完全描述，最后不断监控传入数据的质量，使我们的 ELT 更加可靠，结果值得信赖。\n\n## 运行测试\n\
  \n现在我们已经添加了第一个测试，我们如何使用它们？\n\n在 dbt 中，您使用 `dbt test` 命令执行测试，与我们之前看到的运行 dbt 模型的方式非常相似。\n\
  \n转到 dbt Cloud 命令行并运行以下命令：\n\n```\ndbt test\n```\n\n前面的命令将执行 dbt 项目中的所有测试，您会看到命令行区域打开以首先显示执行，然后显示测试结果：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_235_0.png)\n\n您会看到您的测试正在运行，并且完成后，如果通过，右侧会有绿色勾号，如果产生警告，则为橙色感叹号，如果失败，则为红色“x”符号。\n\
  \n您可以打开每个测试的行以访问摘要结果，详细说明测试结果及其持续时间，以及详细信息，您还可以看到在 Snowflake 数据库上运行的确切查询。\n\n现在，我们只为单个源表定义了测试，因此运行所有测试完全没问题，但展望未来，能够仅运行您想要的源或模型的测试非常重要。\n\
  \n以下命令为您提供了更好地控制运行测试的替代方案：\n\n- 运行所有源的测试：\n\n  ```\n  dbt test -s source:*\n  ```\n\
  \n- 运行 abc_bank 源中所有表的测试：\n\n  ```\n  dbt test -s source:abc_bank.*\n  ```\n\n-\
  \ 运行 abc_bank 源中 ABC_BANK_POSITION 表的测试：\n\n  ```\n  dbt test -s source:abc_bank.ABC_BANK_POSITION\n\
  \  ```\n\n在接下来的章节中，我们将更深入地了解 dbt 提供的模型选择语法，以便您可以构建运行或测试您想要的确切模型的命令。\n\n## 测试我们交付的信息是否可靠\n\
  \n现在我们确信传入的数据符合我们的期望，是时候确保我们交付的内容也符合期望了。\n\n编写验证我们想要交付内容的测试将在许多方面为我们提供帮助：\n\n- 确保我们第一次编写代码时做对了。\n\
  - 它提供了一个清晰且非常有价值的文档片段，它将随着我们的代码保持最新，或在代码或数据停止遵守它时失败并引起我们的注意。\n\n  在这方面，重要的是要注意，测试为记录项目提供了如此宝贵的信息，以至于\
  \ dbt 使用它们来丰富项目文档。\n- 它将继续监控我们或他人对代码所做的每一次未来更改是否仍将满足我们的期望以及我们的客户所使用的合同。\n\n我们已在\
  \ `refined` 文件夹中创建了模型，因此让我们在 `refined` 文件夹中创建一个名为 `refined.yml` 的 YAML 文件来托管我们的测试以及我们在\
  \ `refined` 文件夹中实现的转换的描述。\n\n与往常一样，在我们的 YAML 文件中，让我们从版本和我们将在文件中描述的实体类型开始。用这两行开始文件：\n\
  \n```yaml\nversion: 2\nmodels:\n```\n\n版本始终为 2，因为这是当前使用的 YAML 文件的定义 - 然后，我们使用 `models`\
  \ 关键字声明我们将描述一些模型。\n\n与源一样，首先，我们使用 name 条目标识我们想要描述和测试的模型，然后我们可以输入描述，除了帮助我们作为开发人员外，还将用于文档中：\n\
  \n```yaml\n- name: POSITION_ABC_BANK\n  description: The positions we have in the\
  \ ABC Bank portfolio.\n```\n\n嵌套在模型内部，`columns` 允许我们命名我们想要描述和测试的列：\n\n```yaml\n\
  \  columns:\n    - name: UNREALIZED_PROFIT\n      description: The unrealized profit\
  \ on the position.\n      tests:\n        - not_null\n```\n\n\n\n\n\n在前面的代码中，我们识别了\
  \ `POSITION_ABC_BANK` 模型中的 `UNREALIZED_PROFIT_PCT` 列，并声明了 `not_null` 测试，因为我们期望该列始终有数据。\n\
  \n```yaml\n- name: UNREALIZED_PROFIT_PCT\n  description: >\n    The unrealized profit\
  \ percentage on the position.\n  tests:\n    - not_null\n```\n\n另外，对于 `UNREALIZED_PROFIT_PCT`\
  \ 列，我们通过使用 `not_null` 测试声明了它应包含数据。\n\n当我们对模型或项目中的所有模型运行测试时，这两个测试都将被执行。\n\n要运行所有测试，请前往\
  \ dbt Cloud 命令行并运行以下命令：\n\n```bash\ndbt test\n```\n\n上述命令将执行 dbt 项目中的所有测试，你会看到命令行区域先显示执行过程，然后显示测试结果。\n\
  \n如果只想对 `POSITION_ABC_BANK` 模型运行测试，请运行以下命令：\n\n```bash\ndbt test -s POSITION_ABC_BANK\n\
  ```\n\n我们现在已经创建了测试，用于验证我们获得正确的输入数据，并且在我们仍然简单的转换结束时能够交付正确的数据。\n\n### 生成文档\n\n接下来需要熟悉的重点是\
  \ dbt 根据我们的代码自动生成的文档。\n\n要生成文档，请运行以下命令：\n\n```bash\ndbt docs generate\n```\n\n你会注意到，生成完成后，几秒钟内，你的开发环境左上角会弹出一个小窗口，提示你的文档已准备好查看，如下面的截图所示：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_238_0.png)\n\n图 5.13：文档生成期间及结束时的开发环境\n\
  \n点击 **查看文档** 链接，新的浏览器标签页将打开，显示 dbt 生成的文档。它看起来像下面的截图：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_238_1.png)\n\
  \n图 5.14：dbt 文档首页\n\n你可以四处浏览，尽管目前内容还不多。\n\n点击页面右下角的蓝色圆形按钮以打开血缘图：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_239_0.png)\n\
  \n图 5.15：我们第一个模型的 dbt 血缘图\n\n目前血缘图非常简单，因为它只需要展示来自 `abc_bank` 源系统的 `ABC_BANK_POSITION`\
  \ 源表（在血缘图中以绿色显示），该表被 `POSITION_ABC_BANK` dbt 模型使用（即数据流向该模型，在血缘图中以浅蓝色显示）。\n\n###\
  \ 小结\n\n恭喜——你的第一个数据应用正在运行！\n\n在本章中，我们开始在 dbt 中开发示例应用，并遵循所有步骤创建、部署、测试和记录一个数据应用，尽管这个应用仍然非常简单。\n\
  \n在下一章中，我们将为该数据应用引入更多真实需求，并且必须调整我们的代码来考虑这些需求，因此我们将开始学习如何重构我们的模型并编写可维护的代码。\n"
- '## 第二部分：使用 dbt 进行敏捷数据工程


  在本节中，你将学习如何使用扎实的工程流程和敏捷方式实现数据平台，编写可读且可维护的代码，并产出业务可信任的数据。


  本节包含以下章节：


  - *第 6 章，编写可维护代码*

  - *第 7 章，处理维度数据*

  - *第 8 章，在代码中实现一致性*

  - *第 9 章，在数据中实现可靠性*

  - *第 10 章，敏捷开发*

  - *第 11 章，协作*

  '
- "## 编写可维护代码\n\n在本章中，我们将继续上一章开始的示例，并指导你配置 dbt，编写一些基础但功能完整的代码，以构建我们参考架构的三个层——暂存/存储、精细化数据以及通过数据市集交付。\n\
  \n我们将首先向你介绍一些核心原则，以实现构建易于理解和维护的数据平台的目标，然后我们将开始将这些原则付诸实践，以构建和配置我们参考架构的各层。\n\n在每一步中，我们都会分析我们编写的模型的关键要素，这些模型将原始源数据转换为数据市集中包含事实和维度的可用信息。事实告诉我们发生了什么，而维度则提供与事实相关实体的额外描述性信息。首先，我们将为事实表构建管道，然后在下一章中，我们将为维度构建管道，并讨论它们之间的区别。\n\
  \n我们还将介绍 dbt 的 Snapshot 功能，它允许你轻松保存实体的变化，并将其存储在称为**类型二的缓慢变化维度**的形式中。这使我们的平台能够捕获源数据及其变化，从而变得自给自足。\n\
  \n到本章和下一章结束时，你将能够仅使用 dbt 的基本功能构建一个可工作的数据平台，该平台具有合理的架构和清晰的组织结构。\n\n本章将探讨以下主题：\n\n\
  - 为人类编写代码\n- 创建架构层\n- 为什么保存历史记录至关重要\n\n### 技术要求\n\n本章建立并继续我们在第 5 章开始的示例，因此你需要熟悉该示例才能继续，并且要拥有其中的代码以继续进行动手示例。\n\
  \n本章的所有代码示例可在 GitHub 上获取：https://github.com/PacktPublishing/Data-engineering-with-dbt/tree/main/Chapter_06。\n\
  \n### 为人类编写代码\n\n在上一章中，我们加载了第一批数据，并构建了第一个模型来对其进行转换。\n\n由于我们项目中开发的代码还很少，因此不存在混淆或对同一事物使用不同名称的风险，但这些在任何真实项目中都是真实存在的问题，而且它们的重要性远超大多数人的想象。\n\
  \n大多数人认为，编码时你只是在编写新代码，但现实是，为了编写一行新代码，你经常必须返回去检查在其他几个地方做了什么，这意味着要一遍又一遍地阅读现有代码中的几十行代码。\n\
  \n项目越老，参与项目的人越多，这一点就越真实、越明显。\n\n我们在前面的章节中已经看到，有一些模式可以最大限度地减少并控制这个问题，但请记住，规模只是复杂性的一个维度，我们能做的管理是有限的。\n\
  \n删除重复或复制粘贴的代码是首要任务，因为它限制了项目的规模，并使得演进成为可能，维护也更加容易。\n\n我们可以做的其他控制复杂性的最重要事项如下：\n\n\
  - *减少重新阅读的需求*，应用**最小惊讶原则（LSP）**。\n    为此，使用有意义的模型名称、前缀和后缀是有益的；使用良好的分层架构，并以一致的方式应用模式（尽可能少），使模型的行为和字段的含义符合你对其名称的预期。\n\
  - *让你编写的代码易于重新阅读/理解。*\n    为实现这一点，使用良好的**公用表表达式（CTE）** 名称和列名是有益的，并将所有非常规的内容放在文件顶部，这样每个“偏离预期”的地方都尽可能容易发现。\n\
  - *保持我们编写的模型聚焦且规模有限。*\n    一个模型应只做一件事，做好它，并用其名称清楚地传达它。这就是**单一职责原则（SRP）**，它利用中间步骤构建更简单的概念，以便在更复杂的概念中使用，同时避免创建一个大而全的模型。\n\
  \    在这里，低模型复杂度和低项目规模是相互矛盾的，因此宁可保持模型简单和聚焦，也要让它们做有意义的工作。\n- *保持依赖关系有序，并且只朝一个方向流动，从架构中的一个层到下一个层。*\n\
  \    预期的数据流和依赖方向如下：`源系统 => 暂存 => 精细化 => 展示（市集）`。\n    绝对要避免跨越多个层，甚至更糟的是，创建方向错误的依赖关系。幸运的是，dbt\
  \ 很可能会报错，因为你会创建循环依赖；无论如何，这对项目的可理解性来说都是一个大问题。\n- *当你看到改进机会时，重构你的模型以使其保持最新。*\n   \
  \ 一致性是保持大型项目和多人良好协作的关键因素。\n    如果你有正确的测试和正确的架构，即使在数据仓库环境中，你也能够以很小的代价应用重构。这将使你的项目几乎永远保持可运行状态，而不是每隔几年就必须重建——这听起来是不是很熟悉？你是否做过演进、革命和再演进项目？\n\
  \n### 重构我们的初始模型使其对人类可读\n\n如果你打开我们之前完成的初始模型代码，你眼前的是该模型生成的十一个列中仅两个列的定义。这可能完全不是问题，因为你有血缘图，可以双击其上游模型去查看那些列是什么以及它们是如何定义的。\n\
  \n问题是，上游模型是一个源，仅由一个 YAML 文件中的元数据定义组成。\n\n幸运的是，如果我们一直是项目的好公民，我们可以从 YAML 文件中获得我们已经记录的列的人类可读、有意义的描述。你应该至少列出并描述重要的列——业务键、外键、重要指标和类别，尤其是你期望存在于业务规则中的那些列（然后测试它们确实存在）。\n\
  \n此外，我们无法控制源列名；它们来自我们无法控制的源系统。\n\n\n\n\n这可能会带来两个重要问题：\n\n- 源名称对我们项目的稳定性构成威胁。如果源发生变化，我们将需要更改所有使用此模型的代码，以及任何使用已更改名称的测试。\n\
  - 一般来说，源中的名称并不是我们项目中的最佳名称，因为它们通常对我们来说不够清晰、来自不同的领域，或者在我们的项目中我们使用不同的术语甚至完全不同的语言，而我们希望无论在哪里出现，都用同一个名称来称呼同一事物。这是让项目中的每个人都清楚地认定它是同一件事的唯一方法；如果名称不同，那就不是同一件事。\n\
  \n> **提示**\n> 我们知道，在一个大型项目中，要在每个地方以相同方式命名同一事物达到 100% 是非常困难的，但如果我们接近这个目标，收益就已经值得了。\n\
  > 越接近越好，因为这会降低以错误方式使用数据的风险。\n\n让我们尝试结合多种策略来解决第一个模型中的所有这些难题：\n\n- 我们将把模型拆分为一个“哑”适配模型，并把它放在暂存层（staging\
  \ layer）中。在这里，我们将选择希望保留的列、它们的名称和数据类型。\n- 我们将把“智能”从当前模型转移到精细化层（refined layer）。这种智能通常也被称为业务规则，它属于精细化层，应用于来自暂存/存储层的安全存储数据之上。\n\
  \n请注意，在本章中，我们将重点为你解释关键概念，并提供一系列实用步骤，帮助你构建整体架构并实现从原始数据到可用信息的转换。\n\n最终得到的代码并不是我们旅程的终点，因为我们仍然缺少一些关键特性和改进，例如适当的测试、哈希键的哈希处理，或将代码重构为宏，这要么是因为篇幅限制，要么是因为我们尚未引入相关特性。\n\
  \n在接下来的章节中，我们将重构代码，以使用我们引入的新特性。\n\n## 创建架构层\n\n在本节中，我们将完成 **务实数据平台（PDP）** 架构的各层——暂存/存储层、精细化层以及用于交付的数据集市层。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_247_0.png)\n\n### 创建暂存层\n\n在*第 4 章*中，我们通过在主配置文件`dbt_project.yml`中添加相关配置来创建精细化层。现在，让我们对暂存层做同样的事情。\n\
  \n在主配置文件的末尾添加暂存层的配置，如下例所示：\n\n```yaml\nstaging:    #Applies to all files under models/staging/\n\
  \  +materialized: view\n  +schema: STAGING\n```\n\n你可以根据自己的喜好将其添加到精细化层配置的上方或下方，只要缩进正确，并且与精细化配置处于同一层级即可。\n\
  \n你可以在我们的代码仓库中找到本章主配置文件的版本，文件名为`06_01_v2__dbt_project.yml`，它位于 dbt 文件夹中*第 6 章*的材料内。\n\
  \n请注意，它已经包含其他新增内容，我们将在后面进行解释。\n\n让我们回顾一下我们已经配置的内容：\n\n- 在我们的项目下，我们命名了一个尚不存在的`staging`文件夹，但我们已经可以为其及其子文件夹声明配置\n\
  - 在`staging`文件夹下，我们声明了`materialized`配置，值为`view`，因为我们希望该文件夹下的模型以视图（view）形式物化\n- 在`staging`文件夹下，我们声明了`schema`配置，值为`STAGING`，因为我们希望暂存文件夹下的模型创建在自定义\
  \ schema 部分为 STAGING 的 schema 中，从而生成如`RZ_STAGING`这样的完整名称\n\n请注意，与精细化层相反，我们希望暂存层默认以视图形式生成。此外，我们希望模型位于带有\
  \ STAGING 后缀的 schema 中。\n\n为完成暂存层的创建，请在模型文件夹下创建一个名为`staging`的文件夹。完成后，你就有了一个可以创建暂存模型的地方。\n\
  \n从你的 dbt Cloud 命令行运行该模型，以便下游可以使用它：\n\n```\ndbt run -s STG_ABC_BANK_POSITION\n```\n\
  \n然后你可以在 Snowflake 中确认暂存层的新 schema 已经存在，并且其中包含该模型的视图。\n\n在编写模型时，你可以运行预览来查看结果，但请记得在模型定稿后执行\
  \ dbt run，以便在数据库中生成视图，供其他模型使用。\n\n### 生成暂存模型\n\n当我们介绍这个 STG 模型的代码时，我们曾向你透露，你不需要手写它，而是能够生成\
  \ STG 模型中的大部分代码。\n\n每个现代数据库都带有一个信息模式（information schema）——即一个生成的模式，你可以用它来查询数据库自身的相关信息。这太棒了。\n\
  \n在 Snowflake 以及其他一些数据库中，这个模式被恰当地命名为 INFORMATION_SCHEMA，因此你会在 PORTFOLIO_TRACKING\
  \ 数据库中找到完全限定名为 PORTFOLIO_TRACKING.INFORMATION_SCHEMA 的模式。\n\n因此，我们可以利用数据库已有的关于源表的信息，来生成\
  \ STG 模型所需的大部分代码。听起来很厉害吧！\n\n基本思想是，STG 模型的核心操作就是选择所需的列（通常全部列），重命名其中一些列，并最终处理类型或时区转换。\n\
  \n此外，大多数新名称与旧名称不会有太大差异，除非我们讨论的是非常古老的名称（仅限于八个字符）、不同语言的名称，或奇怪的命名策略，例如某些专有或专用系统中出现的那种。\n\
  \n因此，对于 SELECT 子句中的列定义部分，以下 SQL 查询生成的结果将与我们在 STG 模型中想要的 SQL 非常接近：\n\n```\n-- Generate\
  \ STG query\nSELECT\n  ',' || COLUMN_NAME || ' as ' || COLUMN_NAME\n    || ' --\
  \ ' || DATA_TYPE as SQL_TEXT\nFROM PORTFOLIO_TRACKING.INFORMATION_SCHEMA.COLUMNS\n\
  WHERE TABLE_SCHEMA = 'SOURCE_DATA'\n  and TABLE_NAME = 'ABC_BANK_POSITION'\nORDER\
  \ BY ORDINAL_POSITION\n```\n\n运行该查询后，结果的前三行如下所示：\n\n```\n, ACCOUNTID as ACCOUNTID\
  \ -- TEXT\n, SYMBOL as SYMBOL -- TEXT\n, DESCRIPTION as DESCRIPTION -- TEXT\n```\n\
  \n让我们分析一下这段代码和结果：\n\n- FROM 子句表明我们正在查询信息模式中的 COLUMNS 视图，因此我们可以使用一个或多个表的列信息。数据库中每个表的每一列都在\
  \ COLUMNS 视图中由一行描述。WHERE 子句将我们的查询限制为单个目标表。\n- SELECT 子句为源中的每一列生成一行，产生类似“ , col_name\
  \ as col_name -- data_type_name”的文本，这正是我们要创建的 STG 模型中 SELECT 子句的典型行。列名重复了两次，因为我们需要第一个列名保持原样以便从源中读取（源使用该原始列名），而第二个列名则是我们编辑的基础；如果保持原样，也能直接使用。\n\
  - WHERE 子句使用 schema 和表名来选择我们想要读取信息的表。将其指向你要为其创建 STG 模型的源表。\n- ORDER BY 子句用于以可预测的方式生成结果，尊重源表中字段的顺序。没有人阻止你在\
  \ STG 模型中更改顺序。实际上，重新排序列的顺序是一种非常常见的做法，将自然键和代理键列放在开头，并让在源表中可能不相邻的相关列保持在一起。\n- 请注意，所有行都以逗号开头，但我们需要从\
  \ STG 模型中 SELECT 子句后保留为第一行的那个行中删除逗号。\n\n然后，我们可以应用下面这个非常简单的模式来生成 STG 模型的初始部分，更完整的模式将在下一节中介绍：\n\
  \n```\nSELECT\n  <generated column block>\nFROM {{ source('source_system', 'SOURCE_TABLE')\
  \ }}\n```\n\n通过这个模式，你可以很容易地看到以下几点：\n\n- 我们几乎可以避免意外。当你看到一个 STG 模型时，你会知道它是什么样的，因为所有\
  \ STG 模型都具有简单一致的格式。\n- 我们运行一个查询来生成模型主体，并在模型中输入一次源表信息，在查询中输入一次，以生成 SQL 代码。\n\n\n\n\
  \n- 我们将编辑减少到最低限度所需，并且修改一段良好且可用的代码比从头编写更容易更快。从生成的代码开始，您还可以避免忘记某些列的风险。\n\n以这种方式管理\
  \ STG 层的好处在于，它让我们在将传入数据适配到我们需求时拥有巨大的灵活性，同时只需要我们付出最少的努力。这真的不是火箭科学，只是一些商定命名规范的审慎应用。\n\
  \n## 暂存模型的目标和内容\n\nSTG 模型的目标是将外部数据适配为我们在项目中希望看到和使用的方式。这包括为变更跟踪做准备，并以对我们未来需求最易用的方式进行存储。\n\
  \n为实现这一点，我们可以在 STG 模型中执行以下几个操作：\n\n- 选择所需的列，通常是全部\n- 重命名列以遵循我们的规范并使用项目指定的名称\n- 管理数据类型，进行转换为所需数据类型\n\
  - 应用“硬规则”进行非破坏性转换，例如时区转换\n- 添加默认记录但仅限于维度；事实/事件不需要\n- 根据输入具体情况添加所需/可用的元数据\n- 通过添加基于哈希的键和\
  \ diff 字段使键和变更跟踪显式化\n\n列表很长，为了应用之前的原则，我们需要将这些步骤中的大多数应用在其自己的代码片段中，包含在 CTE 中，使 STG\
  \ 模型的模式成为一个定义良好的 CTE 序列，依次构建在前一个之上。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_251_0.png)\n\
  \n暂存/存储层是我们构建的接口，用于使外部数据对我们尽可能可用，而不改变其含义。\n\n## 您暂存模型的通用模式\n\n以下是按顺序排列所有前述步骤的简单骨架代码：\n\
  \n```\nWITH\nsrc_data as ( ... ),\ndefault_record as ( ... ),\nwith_default_record\
  \ as(\n    SELECT * FROM src_data\n    UNION ALL\n    SELECT * FROM default_record\n\
  ),\nhashed as ( ... )\nSELECT * FROM hashed\n```\n\n使用上述模式，操作将以这种方式划分：\n\n- `src_data`\
  \ CTE 将处理所有直接作用于传入数据的操作，例如选择列及其名称、管理数据类型、应用硬规则，以及提取可在源系统中找到的元数据（例如导出时间戳）\n- `default_record`\
  \ CTE 将按其名称所暗示的那样做——为维度定义一行默认记录的值，最终在交付层中使用\n- `with_default_record` CTE 只会将前两个\
  \ CTE 组合起来以获得完整数据\n- `hashed` CTE 将添加带有 Key 和 Diff 定义的哈希值，以及您想要添加但不来自源数据的最终元数据，例如数据的加载时间\n\
  \n您可以决定将代码分为更多步骤，但请记住编程几乎总是关于在相互冲突的约束之间保持平衡——在这种情况下，是 SRP 和简洁性。\n\n在下一节中，让我们逐一介绍列为\
  \ STG 模型目标的各个要点。\n\n## 在 STG 模型中选择列\n\n通常，我们保留源表的所有列，但有时，出于有效原因需要排除某些列：\n\n- 安全或合规需求或其他法律或业务要求。\n\
  \n  有时，我们不希望某些类型的数据，例如个人信息、健康数据或其他敏感数据存在于系统中。这可能是法规强制要求的，也可能只是为了简化一个系统的合规需求而做出的决定。\n\
  - *当*，在也询问业务之后，我们*无法理解某些数据*。\n\n  如果没有人知道也不关心某些数据，忽略它是可以的。考虑询问业务的成本 VS 直接添加数据 VS\
  \ 现在排除数据、稍后添加（重新计算哈希值、后续适配……）。\n\n在许多情况下，我们也会添加新列，如元数据或计算字段。建议是，当您添加计算数据时，除非数据量使之不切实际，否则也保留原始数据。\n\
  \n## 命名列\n\n名称在某种程度上是任意的，因此很难有强规则。最好的建议是与项目团队就一些命名指南达成一致，然后选择大多数需要使用它的人都能接受的名称。\n\
  \n话虽如此，重要的是您能快速分配人们会理解和识别的名称，因此建立良好的指南至关重要。\n\n举例来说，当您有一个客户标识符时，可以使用许多可能的名称，例如 `CUSTOMER_CODE`、`CUSTOMER_ID`、`CUSTOMER_NUM(BER)`\
  \ 和 `CUSTOMER_KEY`。最好的做法是决定始终为具有相同角色的所有列使用相同的后缀，例如 `_CODE` 或 `_ID`。\n\n为实现这一切，有用的是制作自己的列表并附上自己的定义，如下所示：\n\
  \n- `_CODE`：业务使用/已知标识符，也称为业务键，通常表示为字符串，即使它只是由数字组成。这不需要是表的唯一键，因为它可以是诸如 `MARKET_CODE`\
  \ 或 `COUNTRY_CODE` 之类的东西。\n- `_ID`：通常，这是一个作为唯一标识符的单个字段，通常作为内部数字开始，具有技术功能。然而，它可能已迁移到业务使用中（`CUSTOMER_ID`\
  \ 被广泛使用），现在可能不再是数字。\n- `_KEY`：这通常是一个技术字段，不用于业务或向业务展示。对通用使用而言，略微偏好 `string` 类型。\n\
  - `_NUMBER`：这感觉在某个时间点上曾是数字，但我们见过太多“number”字段包含文本，因此最好避免此类后缀。\n\n一旦您完成了列表，最有用的事情是决定使用哪些以及始终避免哪些，因为它们通常会重叠。记住目标是让您所有的人（开发人员和业务人员）在使用名称时轻松。\n\
  \n在编写代码时，您每天至少要几十次甚至上百次思考，名称是 `CUSTOMER_ID` 还是 `CUSTOMER_CODE` 或其他什么。因此，您选择哪一个远不如决定始终对所有代码类事物使用\
  \ `_CODE`（或 `_ID`），并且始终将它们设为字符串重要。\n\n在可能的情况下，我们应尽量仅对会暴露给业务的“代码类”字段使用 `_CODE`，对“仅限开发人员”的字段，如哈希生成的键，使用\
  \ `_KEY`。\n\n## 管理数据类型\n\n相当频繁地，您会收到未以正确数据类型表示的数据，例如当您收到日期或时间戳以字符串或整数表示时。\n\n其他常见情况是时间戳被拆分为时间和日期，或您收到仅代表日期一部分的字符串，通常只是月份和年份。\n\
  \n其他较少见的情况涉及货币金额以错误的十进制位数表示（太多或太少），甚至被转换为分。\n\n现代数据库和报表工具完全可以正常工作，并且善于处理日期、时间戳和定点数，因此您应将传入数据转换为最合适的数据类型，这将使一切更简单更快。\n\
  \n这里的建议是，只要可能，最好同时保留原始值，该值将仅存储在历史表中，以及转换后的值，该值将在整个模型中使用。\n\n这既是为了审计要求，也是为了防止错误，以及可能存在数量足够小而您在模型第一版中不会注意到或修复的奇怪数据。\n\
  \n## 应用硬规则\n\n应用硬规则有助于提高数据的互操作性，在某些情况下与数据类型管理非常接近。\n\n硬规则是始终应用于数据以使其在我们想要使用的格式中可接受的规则，因此数据类型转换是一种特殊且简单的硬规则类型。\n\
  \n硬规则并非旨在改变数据的含义，只是其格式或表示方式。\n\n其他类型的硬规则的几个例子如下：\n\n- 修剪字符串以删除无用的空格或剪掉冗余部分\n- 将数字填充为所需长度的字符串，反之亦然——将字符串解填充为数字或不带无用填充零的字符串\n\
  - 修复大小写，处理不支持字符集中的字符，或需要特殊处理的其他情况\n- 从分层源（如 AVRO、Parquet 或 JSON 源）中提取数据到单个字段中\n\n\
  \n\n\n\n前面的代码应在你实现了 `src_data` CTE 之后在 STG 模型上运行，以便为模型生成相当稳定的列名、数据类型和字段顺序。\n\n以下截图显示了在\
  \ ABC 银行持仓实体的 STG 模型上运行此查询的结果：\n\n| 行号 | SQL_TEXT |\n| --- | --- |\n| 1 | , '-1'\
  \ as ACCOUNT_CODE |\n| 2 | , '-1' as SECURITY_CODE |\n| 3 | , 'Missing' as SECURITY_NAME\
  \ |\n| 4 | , '-1' as EXCHANGE_CODE |\n| 5 | , '2000-01-01' as REPORT_DATE |\n| 6\
  \ | , -1 as QUANTITY |\n| 7 | , -1 as COST_BASE |\n| 8 | , -1 as POSITION_VALUE\
  \ |\n| 9 | , '-1' as CURRENCY_CODE |\n\n图 6.3：为默认记录生成的代码\n\n另外，在这种情况下，你可以获取生成的代码，在第一行之前加上\
  \ `SELECT`，去掉多余的前导逗号，然后就能得到一份可用的默认记录定义，你可以原样保留或手动改进。\n\n## 添加元数据\n\n另一个常见任务是记录来自源系统的元数据，并添加我们可以生成的其它元数据。\n\
  \n某些“元数据”字段将来自源系统的普通字段，而另一些将由加载管道添加。通过定义元数据字段，我们将相关信息复制到元数据名称下，同时保留原始字段（如果它本身也有用的话）。由于相同的元数据在不同源系统中可能有多种叫法，因此始终将元数据放入具有相同名称的字段中是很有用的。\n\
  \n以下是一些可能添加的元数据形式：\n\n- `LOAD_TS`：这是数据加载到我们数据平台的时间。这是必需的，且不依赖于源系统。我们通常将其作为最后一个字段添加。\n\
  - `RECORD_SOURCE`：这是数据的来源。这可能来自数据移动管道（例如，我们正在读取的 CSV 的文件名），也可能不可用，因此你可以为其编造一个描述，例如视图/源表名称。这也是必需的，因为它允许你审计/理解数据的来源。\n\
  - `EXTRACTION_TIME`：这是从源系统提取数据的时间。通常，我们并不直接读取源，因此它可能与 `LOAD_TS` 有很大不同。\n- `CREATION_TIME`：这是信息首次创建的时间。许多系统会记录此信息，如果它通常可用，那么创建这样的元数据字段是很有用的。\n\
  - `EFFECTIVE_FROM`：这是信息在业务上生效的时间。这纯粹是一个业务字段，允许你处理多时态性——即多条时间线。在所有情况下，区分你何时收到某些信息以及何时需要考虑该信息投入使用都非常重要。\n\
  \n当然，你可以根据需要定义自己的元数据，以描述源系统和数据平台流程的任何方面。\n\n## 身份与变更检测字段\n\n我们在 STG 模型中添加的最后一项是三个有助于存储实体的字段：\n\
  \n- `HASH_KEY`：这是一个单一字段，包含构成实体主键的所有列，并将它们链接在一起。结果通常会被哈希处理，故名 `HASH_KEY`。其主要用途是提供单一字段的主键，以标准化并简化历史记录的加载。通过在代码中定义\
  \ `HASH_KEY`，你给出了实体主键的清晰、明确的定义。\n- `HASH_DIFF`：这是一个单一字段，包含我们想要测试变更的所有字段，并将它们链接在一起。结果通常会被哈希处理，故名\
  \ `HASH_DIFF`。此字段用于简化和标准化历史记录的加载，并提供被视为变更的明确定义。它通常包含除元数据字段之外的所有字段。\n- `LOAD_TS`：这是一个时间戳，提供实体变更的时间线，按数据平台接收和存储的顺序排列。这是我们在加载过程中添加的元数据。\n\
  \n利用 `HASH_KEY` 字段，我们能够选取特定实体的所有版本，而利用 `LOAD_TS`，我们能够知道哪个版本是当前版本，或者在某个特定时刻哪个版本是当前版本。\n\
  \n`HASH_DIFF` 字段是一个纯技术字段，可被视为版本标识符，但请注意，实体完全有可能恢复到过去某个时刻所拥有的一组相同值。因此，很可能在历史表中出现两个相同的哈希差异值，而它们之间隔着若干个不同的值。\n\
  \n在某些情况下，我们会添加多个 `HASH_KEY`，因为我们存储的实体可能以多种方式查看（例如，账户可以视为本地账户，也可以视为全球账户）。\n\n有时，我们还会为要存储在历史表中的复合外键添加哈希键。如果你构建使用由多个字段组成的哈希作为键的层级结构或脏维度，这可能是常见情况。不过，更常见的做法是在\
  \ REF 层中添加此类计算键。\n\n## 完成 STG 模型\n\n在本章前面，我们为 ABC 银行的持仓创建了 STG 模型的初始版本。现在让我们按照上一节描述的模式，添加各个部分来完成它。\n\
  \n你可以在本书仓库的 Chapter_06 材料下的 dbt 文件夹中找到 `06_02_v2__STG_ABC_BANK_POSITION.sql` 文件中的完整第二版。这里，我们将逐个描述每个部分。\n\
  \n让我们先将当前版本移动到 `src_data` CTE 中，并添加一些元数据：\n\n```sql\nWITH\nsrc_data as (\n     \
  \   SELECT\n                ACCOUNTID        as ACCOUNT_CODE    -- TEXT\n      \
  \  , SYMBOL               as SECURITY_CODE   -- TEXT\n        , DESCRIPTION    \
  \      as SECURITY_NAME   -- TEXT\n        , EXCHANGE             as EXCHANGE_CODE\
  \   -- TEXT\n        , REPORT_DATE          as REPORT_DATE     -- DATE\n       \
  \ , QUANTITY             as QUANTITY        -- NUMBER\n        , COST_BASE     \
  \       as COST_BASE       -- NUMBER\n        , POSITION_VALUE       as POSITION_VALUE\
  \  -- NUMBER\n        , CURRENCY             as CURRENCY_CODE   -- TEXT\n\n    \
  \    , 'SOURCE_DATA.ABC_BANK_POSITION' as RECORD_SOURCE\n\n        FROM {{ source('abc_bank',\
  \ 'ABC_BANK_POSITION') }}\n),\n```\n\n上述代码中唯一真正的添加是 `RECORD_SOURCE` 元数据。\n\n我们没有真实传入的数据告诉我们数据来自哪里，因此常见解决方案是使用一个包含我们所读取的视图/表名称的字符串。\n\
  \n下一部分将是 `default record` CTE——如果这是一个维度表的话——但既然这是一个事实表——即列出已发生事件或描述系统状态的表，而非关于实体的描述性信息——我们就不需要默认记录。\n\
  \n由于我们没有默认记录，`with_default_record` CTE 也就不需要了。\n\nSTG 模型的最后一部分是哈希 CTE，你可以在以下代码块中看到。目前，我们还不会有任何哈希处理，因为我们尚未引入将用于哈希的功能。字段链接的方式目前已经足够好了：\n\
  \n```sql\nhashed as (\n    SELECT\n        concat_ws('|', ACCOUNT_CODE, SECURITY_CODE)\
  \ as POSITION_HKEY\n      , concat_ws('|', ACCOUNT_CODE, SECURITY_CODE,\n      \
  \    SECURITY_NAME, EXCHANGE_CODE, REPORT_DATE,\n          QUANTITY, COST_BASE,\
  \ POSITION_VALUE, CURRENCY_CODE )\n        as POSITION_HDIFF\n      , *\n      ,\
  \ '{{ run_started_at }}' as LOAD_TS_UTC\n    FROM src_data\n)\nSELECT * FROM hashed\n\
  ```\n\n这部分代码的作用如下：\n\n- 将复合主键 `POSITION_HKEY` 定义为 `ACCOUNT_CODE` 和 `SECURITY_CODE`\
  \ 字段的拼接（目前没有哈希）。\n\n  这是潜在选择之一；和往常一样，在选择键时，重要的考虑是它们能反映实际情况。理论上，在一个账户中，同一证券可能在不同市场上报价，而证券的报价取决于你所查看的市场。\n\
  \n  我们将从这个定义开始，如果以后需要，最终会更改它。更改键从来都不容易，所以最好仔细考虑，但另一方面，我们也不应因疑虑和潜在利弊而陷入瘫痪。如果你真的有两个不错的选择，就为它们找到两个名称并以一致的方式定义，然后极其明确地说明你用于存储历史记录的是哪一个。\n\
  \n- 类似地，我们将变更控制字段 `POSITION_HDIFF` 定义为持仓实体所有非元数据字段的拼接。\n\n  包括所有字段（包括键字段）是一个标准过程，使得通过一次比较就能检查哪怕包含数十或数百个字段的巨大记录是否与先前版本相比发生了变化。\n\
  \n- 我们使用了星号符号 `*`，将源数据中的所有字段以及我们在前面 CTE 中添加的元数据都向前传递。\n\n\n\n\n\n- 最后但同样重要，我们添加了最重要的元数据字段\
  \ `LOAD_TS_UTC`，它记录了平台接收并存储数据的时间。\n\n  在我们的代码中，我们决定为在同一 ETL 加载运行期间加载的所有实体实例使用相同的加载时间戳。这样，就有可能调查我们加载的历史记录，并了解在同一运行中到达的数据。\n\
  \n虽然在所有 STG 模型中都有很多事情在发生，但需要注意的是，我们设法将它们很好地分离开，最重要的是，每个 CTE 只关注一个主题：\n\n- 在 `src_data`\
  \ CTE 中，你关注的是传入的数据。\n\n  你希望对其进行适配并提取在加载过程中获得的元数据。\n\n- 在 `default_record` CTE 中，你关注的是提供默认记录。你希望在没有数据时选择最有意义的值来展示。\n\
  \n- 在 `hashed` CTE 中，你关注的是保存历史记录。\n\n  你希望定义实体的身份，定义你想要做出反应的变化，并定义你认为数据被添加到平台的时刻，这也是历史表中版本的默认排序。\n\
  \n现在你已经完成了 STG 模型，你可以通过运行 **Preview** 按钮来尝试它，并且，如果你对我们使用的 dbt 函数好奇，可以通过使用 **Compiled\
  \ SQL** 选项卡查看生成的代码。\n\n一旦模型运行正确并且你在仓库中提交了代码，不要忘记通过运行 `dbt run` 命令将其部署到你的开发环境中。\n\
  \n在真实场景中继续之前，你必须确保已添加能让你对传入数据和主键选择感到安心的测试。在本章中，我们不会讨论测试，因为我们希望专注于构建模型及其内容。\n\n##\
  \ 将 REF 模型连接到 STG\n\n我们已向 dbt 项目添加了 STG 模型来适配数据，使其符合我们希望看到的方式，并且它运行良好，以我们选择的名称生成了我们想要的结果。\n\
  \n这很棒；然而，新的名称和字段在 REF 模型中没有显示——为什么呢？\n\n好吧，我们没有更改模型，所以它仍然直接从源表中读取。\n\n跨多个层读取是一种非常糟糕的编码方式，是构建\
  \ SQL 代码意大利面球的配方，随着时间的推移，没有人会想再碰它。\n\n让我们通过让精炼层中的模型从 STG 模型读取来修复这个问题。\n\n打开 `POSITION_ABC_BANK.sql`\
  \ 文件并更改 FROM 子句，使其读取如下所示的代码块：\n\n```sql\nSELECT\n    *\n  , POSITION_VALUE - COST_BASE\
  \ as UNREALIZED_PROFIT\n  , ROUND(UNREALIZED_PROFIT / COST_BASE, 5)\n      as UNREALIZED_PROFIT_PCT\n\
  FROM {{ ref('STG_ABC_BANK_POSITION') }}\n```\n\n你可以运行预览，查看模型现在与之前一样继续生成相同的结果，但列名已更新。\n\
  \n通过运行更改后的模型、单个层或整个项目，将更改部署到数据库：\n\n```bash\ndbt run -s refined\n```\n\n在你的 dbt\
  \ Cloud 命令行中执行前面的命令将运行精炼层中的所有模型，目前只有我们的初始模型。\n\n转到 Snowflake 并验证表现在是否具有新的名称。\n\n\
  我们已完成代码的第一次重构，因为我们现在与之前具有相同的功能，但名称和可用性要好得多。现在，你可以查看血缘图，通过点击 STG 模型，可以清楚地了解情况以及与源系统的简单映射。\n\
  \n我们还清楚地划分了两个模型之间的职责——STG 模型只负责接收和适配数据，而不改变其含义，而精炼层中的模型将使用 STG 模型中的名称，并添加所需的业务规则以执行任何必要的计算。\n\
  \n## 精炼层的目标和内容\n\n精炼层目标很明确——以从暂存层提供的“已适配”数据为基础，通过应用业务规则，包括合并多个来源，生成可用于数据集市的“精炼”数据，为平台用户提供有用的信息。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_261_0.png)\n\n事实是，*“业务规则”* 是一个非常宽泛的术语，它可能意味着像求和或乘积这样简单的操作，也可能涉及使用多个模型和相当复杂的逻辑。\n\
  \n几乎所有改变或组合数据以生成其他数据的操作都是业务规则，因此与暂存层不同，我们无法对精炼层中每个模型内部会看到什么做出太多说明。\n\n我们可以说的是，我们期望从\
  \ *原始* 到 *精炼* 数据的转换是逐步进行的。我们将有一些半精炼模型，它们直接建立在来自 STG 层的原始源数据之上，会处理特定于该数据集的业务逻辑，但尚未代表完全精炼的业务概念。这些“半精炼”模型可以被视为中间转换，它们反过来用于生成代表最终、完全精炼业务概念的最终模型。每个最终概念的构建方式可能不同，但通常会借助一些中间模型完成，具体取决于最终概念的复杂性，并且经常会结合其他专业模型的使用。还值得注意的是，并不总是立即清楚如何命名一个精炼模型，因为一个模型本身可能就是一个精炼模型，例如“EMEA\
  \ 客户”，这对于 EMEA 报告数据集市来说是一个完整的概念，也是更通用概念如“全球客户”的组成部分。正如编程中总是如此，命名并不总是容易，提供一致命名的最好方法是制定一些通用指南并在共识下应用。\n\
  \n## 精炼层中的模型类型\n\n在本节中，我们介绍你在精炼层中会遇到的几种常见模型类型。这不是一个确定的列表，因为你可能有其他需求，你也可能不喜欢这些名称，但如果你能制定一个涵盖你反复使用的模型类型的列表，让项目中的任何人都能清楚地了解其内容，那么你就走在正确的方向上：\n\
  \n- **中间转换 (TR)：** 这是一种通用类型，用于创建中间计算的模型，这些计算不代表适当的业务概念或不能独立存在，意思是你不会期望其他开发人员在不了解具体注意事项的情况下使用此类模型。\n\
  \n  你可以将它们视为“私有”中间模型的近似值，你不期望它们具有通用用途或在其他上下文中易于重用。\n\n- **精炼模型 (REF)：** 这是代表可识别业务概念的模型的类型，处于任何级别，如果不是通用用途，级别应从名称中明确。我们期望任何需要该概念的人在该级别上重用此模型，而不是自行构建。\n\
  \n  其含义是概念的身份和语义必须定义良好，并且键必须是名称中定义的级别和系统的正确键。\n\n- **映射模型 (MAP)：** 这是支持从一个参考系统到另一个参考系统的转换的模型类型，通过提供一个系统中键到另一个系统中等效键的映射。\n\
  \n  这些模型通常源自主数据管理系统，应明确命名以说明它们有助于映射的内容，标明来源和目标系统及概念。\n\n  例如，将物流库存位置映射到组织仓库的模型可以命名为\
  \ `MAP_LOG_INVENTORY_TO_ORG_WAREHOUSE`。\n\n- **主数据维度 (MDD) 模型：** 这是实现主数据管理系统提供的维度的模型类型。\n\
  \n  这些模型也可以像 REF 模型一样命名，但当它们可用时，我们更喜欢使用 MDD 模型，以突出数据不是由数据平台计算的，而是尽可能少地更改后直接从 MDM\
  \ 系统提供的数据，而 MDM 系统通常是生成维度的最权威系统。\n\n- **聚合 (AGG) 模型：** 这是包含聚合或汇总数据的模型类型。\n\n  这些模型通常是最终转换步骤，从完整的\
  \ REF 模型中获取数据并通过在可用外键的子集上聚合来生成汇总事实。当可以使用紧凑且因此更快的汇总数据代替 REF 模型时，AGG 模型将被引用在数据集市中，而\
  \ REF 模型则保留用于需要完整详细粒度的情况。\n\n- **透视 (PIVOT) 模型：** 这是包含透视数据的模型类型。\n\n  这是一种专门的模型类型，如果你碰巧处理透视数据，可以使用。它在此列出是为了明确你可以根据需要创建新的模型类型。目标始终应该是清晰地传达模型的功能。\n\
  \n我们期望你在 REF 层中的大多数模型将是 TR 和 REF 模型，根据需要会有少量或大量的 MAP 模型，用于在不同键系统之间进行转换。\n\n## 重命名精炼模型\n\
  \n现在我们已为暂存层中的模型提供了适当的名称并加上 STG 前缀，我们也应该为精炼层中的模型选择一个适当的名称，考虑前一节的信息。\n\n虽然暂存层角色简单且名称相当模式化，留下较少的疑问，但精炼层是疑问之地，因为最终名称应反映角色，而角色取决于你构建的内容以及团队对你正在构建的概念的感受。\n\
  \n\n\n\n\n要为ABC银行的头寸相关模型命名，你必须考虑该模型在你的项目中代表什么：\n\n- 如果你认为这个模型代表了ABC银行的头寸，以便在需要这些头寸时可以随时复用，那么将其视为该概念的精细化模型是合理的，并使用REF前缀命名。\n\
  - 反之，如果你认为这是使数据以更可复用的方式可用这一过程中的中间步骤，那么你应该使用TR前缀。\n\n在IT领域常常如此，你可能会找到支持两种方向的充分理由，例如：\n\
  \n- 我们知道每个经纪商的证券代码和交易代码都不同，因此我们需要一个主数据层，才能以通用方式组合和复用数据。\n- 目前，这是我们对这类数据的最佳表示，也是我们能够在报表中对外提供和使用的数据。\n\
  - 在报表中，我们只想对外提供精细化数据，这些数据可以几乎不带限制条件地使用，并可能与其他数据复用和组合。作为通用模式，我们倾向于让数据集市模型只依赖REF或同等模型（如AGG或MDD），并且只来自精细化层。\n\
  \n两种方向各有优缺点，而且我相信你还能找到更多，但重要的是要做出选择。\n\n我强烈建议你考虑这样一个事实：一个项目，尤其是敏捷项目，总是在变化；用一个足够好的、被普遍接受的名称向前推进，比停滞不前要好。幸运的是，dbt工具和我们的工作方式使得更改名称和代码比过去更简单，尤其是在REF层。\n\
  \n在本例中，该模型是目前我们拥有的“最精细化”的模型，即使我们认为将来会修改它，因此我们选择使用REF前缀。\n\n请前往你的dbt Cloud IDE，将`POSITION_ABC_BANK`模型重命名为`REF_POSITION_ABC_BANK`，然后更新`refined.yml`\
  \ YAML文件中的模型名称，以确保描述和测试继续按预期工作。\n\n一旦你试用并测试了该模型，就可以提交更改并运行该模型以将其部署到数据库中，使用以下命令：\n\
  \n```bash\ndbt run --select REF_POSITION_ABC_BANK\n```\n\n现在，你已经在精细化层部署了新模型，该模型与STG模型关联。\n\
  \n> **提示**\n>\n> 请记住，dbt不会移除你可能用旧名称创建的表或视图。由于我们处于开发环境中，你可以直接用`DROP`命令删除旧对象，以保持项目整洁。\n\
  \n另一种可行的做法是：用一个包含当前代码的TR模型，和一个目前仅从TR模型读取所有内容、但将来会发展为应用所需MD转换的REF模型。这是一种实际、具体地展示未来架构的好方法，但也可能引入额外的复杂性，而这个额外步骤在未来一段时间内可能不会使用，甚至永远都不会使用。\n\
  \n应用**你不需要它（YAGNI）**原则，你不应该在真正需要之前引入任何东西（功能、模型以及其他任何复杂化）。在大型项目中遵循这一原则至关重要，因此我们认为，只有在以下情况下，添加临时或骨架REF模型才是个好主意：你已经有了如何开发它的良好计划，你准备在短时间内完成开发，并且将模型拆分为两个会减轻开发团队的工作量。\n\
  \n## 创建第一个数据集市\n\n在本节中，我们希望完成初始架构的搭建，方法是创建本项目第一个数据集市中的第一个模型。数据集市构成了交付层。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_265_0.png)\n\
  \n*图6.5：实用数据平台中高亮显示的交付层*\n\n总体计划是为每个将使用平台数据的领域创建一个数据集市，从而为每个领域提供最佳数据集，使用正确的名称、正确的数据深度和粒度，并且只提供该领域关心的概念。\n\
  \n在我们这个简单的示例中，我们不需要多个数据集市，因此我们决定创建一个名为`portfolio`的数据集市，该名称已在主配置文件`dbt_project.yml`中设置好。\n\
  \n实际创建数据集市时，我们必须先创建`marts`和`portfolio`文件夹，然后将所需模型放入数据集市文件夹中。\n\n让我们来做：\n\n1. 在`models`文件夹下创建`marts`文件夹。你可以点击**models**文件夹的三点菜单，然后选择**New\
  \ Folder**（新建文件夹）来实现。你可以在`models/`后只输入`marts`名称，或者通过一次输入`models/marts/portfolio`两个级别，在单个命令中完成两个步骤。\n\
  2. 在`marts`文件夹下创建`portfolio`文件夹。\n3. 创建第一个数据集市模型，名称为`FACT_POSITION`。你可以在`portfolio`文件夹的三点菜单中选择**New\
  \ File**（新建文件），并在路径末尾添加模型名称（带`.sql`扩展名），生成完整名称`models/marts/portfolio/FACT_POSITION.sql`。\n\
  \n我们模型的第一版将只从精细化层模型读取所有数据，如下代码所示：\n\n```sql\nSELECT * FROM {{ ref('REF_POSITION_ABC_BANK')\
  \ }}\n```\n\n4. 保存模型后，你可以使用以下命令部署它：\n\n```bash\ndbt run --select FACT_POSITION\n\
  ```\n\n5. 部署模型后，你可以检查你的Snowflake数据库，现在应该有一个名为`XX_MART_PORTFOLIO`的新schema（将XX替换为你个人schema），并且在该schema中有一个名为`FACT_POSITION`的表。\n\
  \n通过这些步骤，我们刚刚在我们的数据集中创建了第一个表，即事实表。\n\n只有一个表的数据集市并不那么有趣，但在这种情况下，我们的事实表只是开始构建一些基础报表所需的最低限度，而对我们来说，走到这一步的过程比当前的最终结果更重要。构建报表不在我们的范围内。\n\
  \n目前，我们的数据平台只是反映了输入的最新内容。\n\n在下一节中，我们将为平台添加随时间存储其输入和变化的能力。\n\n## 保存历史至关重要\n\n一个不存储输入的数据平台是一个非常脆弱的平台，因为它需要所有输入系统在每次运行时都处于可用状态，才能产生结果。\n\
  \n更大的限制是，没有历史记录的平台无法满足现代数据平台今天本应实现的许多需求，例如审计、时间旅行、双时态性，以及支持对运营系统和实践的分析与改进。\n\n对我们来说，无论如何，你应该始终保存实体历史的核心原因是构建一个更简单、更具韧性的数据平台。当你将平台拆分为一个只负责适配并保存历史的部分（存储层），以及另一个使用保存的数据来应用所需业务规则的部分（精细化层）时，你就应用了我们讨论过的原则，并实现了数据平台的极大简化。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_267_0.png)\n\n*图6.6：实用数据平台中高亮显示的存储层*\n\
  \n你可能想问：“好，这是优点，那缺点呢？”这是个合理的问题，而且出乎意料的是，答案是没有真正的缺点！\n\n我将在这里列出的所有主题最终对数据平台都是净正面的，即使有人可能最初将它们视为缺点，因为它们需要“额外的工作”：\n\
  \n- **你的团队成员（技术和业务人员一起）必须理解他们摄取的数据，并且对他们存储的实体的身份（IDENTITY）非常清楚。**\n\n  被迫决定/发现主键可能感觉很麻烦，但结果是数据在所有数据平台上的使用和互操作性得到了极大改善。\n\
  \n- **你会存储好的、坏的和丑陋的数据。** 虽然你可能只关心好的数据，但拥有全部数据并被迫明确管理坏的和丑陋的数据，会让你的团队，尤其是业务人员，了解到很多关于你运营系统和流程的情况。\n\
  \n- **存储历史会占用更多数据空间。** 这是事实，但在大多数情况下，变更率非常低，因为较大表中只有少数实体有多个版本，所以额外数据的量很小。此外，现代云平台的列式存储大大减少了占用的空间。\n\
  \n无论如何，数据平台简化所带来的价值，以及历史记录所支持的额外功能，远超过额外存储的微小成本。INSERT是云平台上性能最佳的操作，因此在进阶章节中，我们将转向仅插入历史记录，因为快照会使用更新，共享于各环境之间，并且在你想更改它们时会成为部署问题。\n\
  \n\n\n\n- 处理源系统导出并深入了解每个系统如何提供其加载数据，可以让你评估能否捕获数据删除操作，并告诉你能够以何种粒度捕获变更。\n- 将源系统身份管理（用于存储历史）与主数据管理（用于生成集成信息）分离，将让你看到缺失的信息，并暴露出主动管理系统间连接的需求。\n\
  \n我们认为，尽早逐个实体地处理这些主题是一个很大的优势，因为它使你免于继续处理那些尚未被清晰理解的模糊实体。\n\n如果没有这种清晰性，你可能会构建出最初能运行的东西——比如一个小项目，只有一个开发人员，且其隐含假设保持一致——但在一个中等至复杂、有几位开发人员的项目中，你极不可能取得任何积极成果，更不用说创建一个易于维护、经久耐用的平台了。\n\
  \n举个例子，在我们的示例项目中，有一个“职位”实体。当我们为它选择键时，我们发现其身份并非一成不变，我们可以选择一个自己觉得合适的主键，但以后可能会更改。事实类数据往往如此。\n\
  \n这里的关键在于，我们处于一个示例项目中，背后没有真实的业务来讨论和评估各种可能性，或者只是为我们提供一些业务背景，因此我们必须依靠直觉和经验，而这些可能并非最优，且对每位开发人员而言都可能不同。\n\
  \n在真实用例中，业务方将能够回答你关于选择某个键或另一个键的影响的问题，从而更好地引导你做出适当的决策。\n\n## 使用 dbt 保存历史\n\n在使用 dbt\
  \ 时，我们主要有两种途径来捕获并保存实体实例的变更：\n\n- *使用 dbt 快照的标准功能*：这使你可以轻松地将变更捕获为**类型 2 缓慢变化维度（SCD2）**，而无需为此编写任何代码，因为该逻辑由\
  \ dbt 本身使用 merge 或 delete/insert 语句实现。如果我们从源获得可靠的全量导出，快照还可以捕获删除操作。\n\n  这对于正常规模的数据集（最多数百万行）非常有效，也是最简单的方法，但它也有自身的缺点，因此我们通常更倾向于使用仅插入历史来存储变更，如下一点所述。\n\
  \n  快照的主要缺点之一是它们是全局对象，因此所有环境只有一个副本和一个活动版本。另一个缺点是，你无法预览或测试为快照提供数据的 SELECT 查询。\n\n\
  \  可想而知，如果你有一个像 `SELECT * FROM <source>` 这样的简单查询，这些并不是大问题；但如果你想在存储历史之前应用我们前面讨论过的暂存层最佳实践，这就成了一个限制。\n\
  \n- *使用增量模型保存每次运行的新数据或变更数据*：我们更倾向于使用这种方法，应用基于集合的操作以仅插入模式捕获变更，因为这是管理和存储海量数据的最有效方式，并且可以针对所有情况进行定制，即使单个表有多个来源（例如近实时馈送和定期控制馈送）也能适用。\n\
  \n  这需要编写你自己的宏，或采用我们自己的宏，来实现存储历史的逻辑——即检查暂存模型中某个实例的版本是新实例，还是与该实例最后存储版本相关的变更。\n\n\
  \  这在 SQL 中做起来比解释起来更容易，而且我们已经准备好了宏，因此对我们来说，这种方法工作量更少，并且能让我们完全按照自己的需求存储变更。我们将在最后几章中介绍该宏和这种方法，以及更多与数据摄取相关的话题。\n\
  \n在下一节中，我们将向你介绍如何使用快照来存储变更，并最终记录删除操作。\n\n## 使用快照保存历史\n\ndbt 提供了快照功能来保存传入的数据。其最佳用途是尽可能接近源数据地捕获传入的源数据，即尽可能少做更改。\n\
  \n在快照中，完全可以应用我们为暂存模型讨论过的所有转换。在大多数情况下，在快照中这样做效果很好，但正如我们将在下一章中看到的，它比在 STG 模型中操作稍微不那么透明。\n\
  \n### 快照功能\n\n快照是一个由 dbt 管理的表，它将 SELECT 语句的数据以缓慢变化维度的形式存储。\n\n快照由你在 dbt 的 `.sql`\
  \ 文件中创建的特殊 `snapshot` 块生成。\n\n快照不是普通模型，从某种意义上说，它们不会通过 `dbt run` 命令运行，而是必须通过特定的 `dbt\
  \ snapshot` 命令或包罗万象的 `dbt build` 命令运行。\n\n快照表通常生成在它们自己的特定 schema 中，因为它们是唯一不能在每次运行时重新创建的表，所以你不希望意外删除它们。因此，它们存储在\
  \ snapshots 文件夹中，而不是 models 文件夹中。\n\n**check** 策略适用于你没有良好的高水位标记的情况，此时你必须查看数据，以检查\
  \ SELECT 语句呈现的每一行与快照中指定唯一键下存储的最新实例是相同还是不同的实例。使用此策略时，你必须配置要检查的列，以决定两行是否为同一实例，使用 `check_cols`\
  \ 配置。你不必列出 SELECT 中的所有列，只需列出要比较的列；无论如何，SELECT 中的所有列都会存储在快照中。\n\n一旦你定义了一个或多个快照，就可以使用\
  \ `dbt snapshot` 命令运行它们，并且可以在其他模型中使用普通的 `ref` 函数引用快照中的数据，方法是将快照名称作为被引用的模型，例如 `ref('snapshot_name')`。\n\
  \n快照的预期用途是作为 ETL 过程的起点，用于捕获和存储源数据，因此一般 ETL 将遵循以下模式：\n\n1. 运行快照命令以捕获源数据——`dbt snapshot`。\n\
  2. 运行模型以从快照中读取数据并计算所需的转换——`dbt run`。\n3. 运行测试以验证结果——`dbt test`。\n\n较新版本的 dbt 引入了\
  \ `dbt build` 命令，它可以替代上述三个命令，因为它会按正确顺序运行所有命令来构建所有类型的模型，包括 seeds 和快照，以及针对它们定义的测试。\n\
  \n运行快照将导致以下结果：\n\n- 根据 SELECT 语句的结果创建快照表，这发生在你首次运行快照时\n- 快照表被更新，更新内容来自 SELECT 语句中与快照表内容相关的变更，这发生在你首次运行之后的任何其他时间\n\
  \n### 在快照中编写 SELECT 查询\n\n在快照中，你可以选择直接读取未更改的源，并在快照之后应用我们在 STG 模型中看到的更改，但这意味着每次读取数据时都必须重新运行所有转换。\n\
  \n我们更倾向于将 STG 模型中的转换放在快照中，这样我们可以只运行一次转换，并将转换后的数据存储为正确的数据类型，包括我们计算出的额外数据（例如从文件名中提取的日期）。\n\
  \n\n\n\n将 STG 模型中的代码放入快照（snapshot）中，会在一定程度上牺牲构建和维护 ELT 的便利性，因为你无法在快照块内预览 SELECT\
  \ 语句的结果。\n\n无法在预览的情况下构建 SELECT 查询，这与轻松维护模型的目标相悖，尤其是当这些模型实现了我们在 STG 层中讨论过的大部分功能时。\n\
  \n我们可以通过保留 STG 模型并声明其为临时模型（ephemeral model）来缓解这个问题。临时模型不会生成任何持久化对象（不会创建视图或表），只会生成一个命名查询定义。这样，我们就拥有一个可用于预览查询结果的\
  \ STG 模型，但无需运行它即可将其提供给快照使用。\n\n## 快照表的布局\n\n使用快照功能时，快照表会为 SELECT 语句随时间产生的每个实例的每个新版本包含一行。每次，当前（仍）处于活动状态的最新版本，就是由唯一键标识的实例的当前值。\n\
  \n快照表除了包含 SELECT 语句产生的字段外，还将包含以下元数据字段：\n\n- dbt_valid_from：行插入快照时的时间戳。它为实例的不同“版本”提供了排序依据。\n\
  - dbt_valid_to：行停止处于活动状态以来的时间戳。实例的最新版本如果仍处于活动状态，其 dbt_valid_to 将设为 null；如果已不再活动，则设为该实例的最高时间戳。\n\
  - dbt_scd_id：为快照中每一行生成的唯一键。这是 dbt 内部使用的。\n- dbt_updated_at：行插入时的时间戳。这是 dbt 内部使用的。\n\
  \n以下是快照的一些最佳实践：\n\n- 在 ETL 中，将源数据进行快照作为第一步，并适当地声明 source，让 ETL 的其余部分只依赖该快照。\n- 在快照中包含所有源列，因为你无法回到过去去回填你没有的信息；即使你拥有这些信息，回填数据也是一项复杂且耗时的任务。\n\
  - 不要在向快照提供数据的查询中添加任何业务逻辑；只使用不会改变数据的硬规则。如果你应用了软业务规则，而这些规则将来会发生变化，那么你很可能无法回到原始数据并应用新的业务规则；即使可以，也会是一个复杂而缓慢的手动过程。\n\
  - 避免在 SELECT 查询中使用 join，因为有时很难判断 join 的结果何时是一个新版本，更不用说将变更合并到两个表中了。请先分别对需要 join 的两张表进行快照，然后在应用业务逻辑的下游模型中进行\
  \ join。\n\n## 使用快照的多种方式\n\n我们之前讨论过有几种使用快照的方式；这里快速回顾一下：\n\n- **将快照作为第一步：** 在流程中首先进行快照是\
  \ dbt 的建议，但这意味着要么使用简单的 SELECT * FROM {{ source(...) }} 查询来保留源名称，要么编写一个不宜预览/调试的查询。\n\
  \n  如果你使用这种方法，我们建议尽量使用简单的 select-star 查询，然后在快照之后紧接一个完整的 STG 模型，确保所有其他内容都使用良好的名称和数据类型，即使快照本身不会如此。\n\
  \n- **在 STG 模型之后进行快照：** 从 STG 模型中提取快照解决了可维护性问题，但如果你使用普通模型，会有点笨拙，因为你需要先只运行 STG 模型来生成快照，再运行除快照模型之外的所有模型。如果你对\
  \ STG 模型使用临时模型（ephemeral model），就不需要提前运行它们，从而消除了这种笨拙感。\n\n  如果使用这种方法，你将能够在每次运行时轻松编写、调试和测试用于向快照提供待存储数据的查询。\n\
  \n现在，我们已经对快照功能有了很好的了解，下面就来使用它吧。\n\n## 在示例项目中引入历史记录\n\n在我们的示例项目中，我们获取虚构的 ABC 银行中的证券持仓数据。\n\
  \n我们已经设计了一个简单的管道，可以按我们偏好的方式展示数据，并从获取的输入数据中计算一些新信息。\n\n让我们使用快照功能来存储获取的数据，使整个流程更具弹性，并允许我们利用随时间积累的数据做更多事情。\n\
  \n引入快照功能最简单直接的方法，是将 STG 模型中的代码复制粘贴为快照中的 SELECT 查询。这确实可行，但我们已经讨论过，这样做会使此类查询及其生成的快照的开发和未来管理更加复杂，因为你无法单独预览或测试该查询。\n\
  \n为了解决这个问题，我们将把当前的 STG 模型改为使用临时物化（ephemeral materialization），并用它将 STG 视图的内容提供给快照：\n\
  \n1. 首先，让我们将 staging 模型改为使用临时物化——也就是说，不生成数据库对象，只为 STG 查询定义一个模型名称。\n\n   我们只需添加配置，使模型使用\
  \ ephemeral：\n\n```sql\n{{ config(materialized='ephemeral') }}\n```\n\n2. 删除 STG\
  \ 模型在变为 ephemeral 之前创建的视图：\n\n```sql\nDROP VIEW <DB>.<SCHEMA>.STG_ABC_BANK_POSITION;\n\
  ```\n\n   最好删除旧视图；否则，将来你或项目中的其他人可能会认为它仍与 STG 模型关联，甚至使用它，但该视图已经不再与模型关联，若有变更也不会更新。\n\
  \n3. 创建快照以存储传入的数据及其演变，方法是输入其配置并使用 STG 模型作为数据源。在快照文件夹内，创建一个名为 SNSH_ABC_BANK_POSITION.sql\
  \ 的文件，并输入以下快照代码：\n\n```sql\n{% snapshot SNSH_ABC_BANK_POSITION %}\n{{\n    config(\n\
  \        unique_key= 'POSITION_HKEY',\n        strategy='check',\n        check_cols=['POSITION_HDIFF'],\n\
  \        invalidate_hard_deletes=True,\n    )\n}}\nselect * from {{ ref('STG_ABC_BANK_POSITION')\
  \ }}\n{% endsnapshot %}\n```\n\n在上述快照代码中，我们有以下内容：\n\n- 定义快照及其名称的快照块：\n\n  `{% snapshot\
  \ SNSH_ABC_BANK_POSITION %} ... {% endsnapshot %}`\n\n- 定义快照行为的配置块。在本例中，我们使用了以下配置：\n\
  \n  - 定义用作主键的字段，以标识我们要跟踪变更的实体实例：\n\n    `unique_key = 'POSITION_HKEY'`\n\n  - 定义用于查找变更的策略——即识别新的实例或已跟踪实例的新版本：\n\
  \n    `strategy='check'`,\n\n  - `check_cols=['POSITION_HDIFF']`,\n\n  - 启用对源端删除进行跟踪的配置：\n\
  \n    `invalidate_hard_deletes=True`,\n\n  - 执行以获取数据来更新快照的查询：\n\n    `select * from\
  \ {{ ref ('STG_ABC_BANK_POSITION') }}`\n\n我们使用了 check 策略，因为我们认为 REPORT_DATE 列并不能作为\
  \ timestamp 策略的良好时间戳。\n\n请注意，为了能够跟踪删除，你需要从源端获得可靠的全量导出，因为任何不在源端中的键都被视为已删除。\n\n正如我们在本节前面所讨论的，为了解决快照中查询无法预览的问题，我们将查询编写在\
  \ STG 模型中，并配置为 ephemeral。\n\n现在我们已经创建了第一个快照，使用以下命令运行它：\n\n```\ndbt snapshot\n```\n\
  \n运行会在几秒内完成，之后你应该会在数据库中找到一个以你的快照名称命名的新表，以及我们在主 dbt 配置文件 dbt_project.yml 中配置的 schema。\n\
  \n重要的是要记住，快照是全局共享资源，因为它们最终会进入共享同一数据库的所有开发者和环境所共用的同一个 schema。\n\n现在我们已经有了包含数据的快照，是时候将\
  \ REF 模型与快照连接，以取代 STG 模型了。\n\n## 将 REF 层与快照连接\n\n我们之前编写的 REF_POSITION_ABC_BANK 模型仍然在从我们改为\
  \ ephemeral 的 STG 模型中读取数据。它目前仍然可以工作，但现在是时候让它从快照中读取了，这样即使外部源不可用，我们的 ELT 也能继续工作。\n\
  \n如果你只是更改 REF 模型中 ref() 函数内的模型名称，结果将是读取历史中的所有内容——也就是快照历史中遇到的所有版本。这不是我们想要的。\n\n\n\
  \n\n为了报告当前投资组合，我们只想读取当前有效的持仓记录。\n\n为此，我们需要从快照中仅选择尚未关闭的行——即 `DBT_VALID_TO` 字段为 null\
  \ 的行——因为旧版本在“DBT_VALID_TO”列中带有时间戳。\n\nREF_POSITION_ABC_BANK 模型现在看起来像这样：\n\n```\n\
  WITH\ncurrent_from_snapshot as (\n    SELECT *\n    FROM {{ ref('SNSH_ABC_BANK_POSITION')\
  \ }}\n    WHERE DBT_VALID_TO is null\n)\nSELECT\n    *\n    , POSITION_VALUE - COST_BASE\
  \ as UNREALIZED_PROFIT\n    , ROUND(UNREALIZED_PROFIT / COST_BASE, 5)*100\n    \
  \    as UNREALIZED_PROFIT_PCT\nFROM current_from_snapshot\n```\n\n可以看到，在 `current_from_snapshot`\
  \ CTE 中，我们添加了 WHERE 子句，以便从快照中只读取尚未关闭的行。\n\n现在我们已经更改了 REF 模型，可以使用以下 dbt 命令重建它及其上游模型：\n\
  \n```\ndbt build -s +FACT_POSITION\n```\n\n此命令将对源数据运行测试、刷新快照，并重建 REF 层和数据集市模型。\n\
  \n我们现在已经重构了代码，使其更具弹性、更易于维护、更容易理解和演进。\n\n我们构建的模型只是用于输出一些报表的最小数据模型，但在这些报表中，我们甚至无法获取账户所有者的姓名。\n\
  \n为了改善这种情况，我们需要开始添加维度数据，这将在下一章中进行。\n\n## 小结\n\n干得漂亮！\n\n在本章中，你仅使用 dbt 的基本功能就构建了一个可用的数据平台，其架构合理、组织清晰。\n\
  \n你现在已经理解了架构的所有层次，能够为每一层构建合适的模型，并使用 dbt 快照将更改保存到数据中。\n\n在下一章中，我们将学习如何将维度数据整合到架构中，并巩固本章学到的所有内容。\n\
  \n## 重要提示\n\n请注意，在本章中，我们一直专注于向你介绍每个架构层中合适的架构和模型组织的基础知识。为了控制篇幅并保持重点，我们有意忽略了一些重要的活动，例如添加测试来验证输入源数据和我们在数据集中市中发布的数据。请不要认为这些活动不重要。\n\
  \n我们还使用了一些基本功能，因为尚未介绍用于实现更高级解决方案的特性。我们将在接下来的章节中介绍它们，并重构我们的解决方案来使用这些特性。\n"
- "## 使用维度数据\n\n在上一章中，我们从零开始探索了构建数据平台背后的核心原则，并在参考架构中实现了这些原则。\n\n在本章中，我们将学习如何将维度数据整合到数据模型中，并利用它来扩展描述业务事实的事实表。维度数据使事实信息对业务用户来说更加有用且易于使用。\n\
  \n**维度数据**一词指的是为实体提供可读信息的描述性数据，例如客户或账户的名称或国家。\n\n我们将探索如何创建数据模型来规划工作，并为 *Pragmatic\
  \ Data Platform* 架构的所有层构建 dbt 模型，以在数据集中市中交付维度数据。\n\n最后，我们还将借助一个练习来回顾上一章和本章所学的内容。\n\
  \n本章涵盖以下主题：\n\n- 添加维度数据\n- 加载第一个维度的数据\n- 为第一个维度构建 STG 模型\n- 保存维度数据的历史记录\n- 使用维度数据构建\
  \ REF 层\n- 将维度数据添加到数据集市\n- 练习——添加更多手动维护的维度\n\n### 添加维度数据\n\n一般来说，维度数据用于通过事实表中存储的维度实体代码，去连接维度表以获取描述性信息，从而为事实提供描述性信息。\n\
  \n我们在上一节加载的持仓事实有四个显式外键，我们恰当地用 `_CODE` 后缀命名：账户代码、证券代码、交易所代码和货币代码。\n\n这四个代码是引用，或者说外键，指向我们可以直接连接到该事实的四个维度。\n\
  \n还有一个额外的隐式维度——银行维度，它隐含在模型的名称中。\n\n### 为精炼层和数据集市层创建清晰的数据模型\n\n为了能够最终确定维度和事实表设计，我们需要对报表（数据集市层）中使用的数据模型有一个清晰的了解，这通常是星型模式，或者很少情况下是一张宽表。\n\
  \n这反过来又与我们所拥有且能够在精炼层完整表示的数据模型紧密相连并受其影响。\n\n让我们先快速看一下简化后的概念数据模型，它涉及我们已命名并希望围绕持仓事实进行报表展示的实体：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_280_0.png)\n\n图 7.1：示例项目的概念数据模型\n\n在此数据模型中，我们看到了前面提到的四个维度，以及我们讨论过的隐含银行维度。\n\
  \n### 加载第一个维度的数据\n\n在本节中，我们将了解如何创建（如果你没有来自某个外部源系统的数据）并加载证券维度的维度数据，该维度描述了账户持仓中包含的证券。\n\
  \n在本节结束时，我们将邀请你将其他维度作为练习添加进来。\n\n### 创建 CSV 文件并作为 seed 加载\n\n在真实的银行数据平台中，证券维度很容易达到几十列，其中一些列是不经常变化的信息值，而大多数列则是根据交易活动计算出来的值。\n\
  \n在本节中，我们将创建一个简单的 CSV 文件，其中包含几个基本列：`Security_Code`、`Security_Name`、`Sector`、`Industry`、`Country`\
  \ 和 `Exchange`。\n\n| SECURITY_CODE | SECURITY_NAME | SECTOR | INDUSTRY | COUNTRY\
  \ | EXCHANGE |\n|---|---|---|---|---|---|\n| TTD | The Trade Desk, Inc. | Technology\
  \ | EDP Services | US | NASDAQ |\n| GCM | GRAN COLOMBIA GOLD CORP | Basic Materials\
  \ | GOLD | CA | TSE |\n| STAR | ISTAR INC | Real Estate | REIT - Diversified | US\
  \ | NYSE |\n\n*图 7.3：表示 ABC_BANK_SECURITY_INFO.CSV 文件内容的 Excel 表格*\n\nCSV 文件的内容如下所示：\n\
  \n```\nSECURITY_CODE,SECURITY_NAME,SECTOR,INDUSTRY,COUNTRY,EXCHANGE\nTTD,\"The Trade\
  \ Desk, Inc.\",Technology,EDP Services,US,NASDAQ\nGCM,GRAN COLOMBIA GOLD CORP,Basic\
  \ Materials,GOLD,CA,TSE\nSTAR,ISTAR INC,Real Estate,REIT - Diversified,US,NYSE\n\
  ```\n\n你可以在 Excel 等电子表格中创建自己的 CSV 文件，如前面的截图所示，然后将其导出为 CSV；也可以直接在 dbt 中创建 CSV 文件，然后键入或复制粘贴内容（注意换行）。\n\
  \n如果你不想手动输入内容，可以从我们的 GitHub 仓库的 *Chapter 6* 文件夹中下载，文件名为 `06_05_v1__ABC_Bank_SECURITY_INFO.csv`。\n\
  \n让我们创建 CSV 文件：\n\n- 1. 打开 dbt Cloud 文件**资源管理器**中的 seeds 文件夹。\n- 2. 打开右侧的菜单（三个点），点击**创建文件**。\n\
  - 3. 在弹出的窗口中输入文件名 `ABC_Bank_SECURITY_INFO.csv`。\n- 4. 打开新文件并编辑其内容，使其与本部分所示内容（前面的代码和下面的截图）一致：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_283_0.png)\n\n### 配置 seed 并加载它们\n\n在\
  \ seeds 文件夹中创建好 CSV 文件后，就该配置希望 seed 数据加载的位置，然后执行加载。\n\n让我们来操作：\n\n- 1. 打开主配置文件 `dbt_project.yml`，并在文件末尾添加以下代码：\n\
  \n```\n### Configuring Seeds\nseeds:\n  +schema: seed_data\n```\n\n此配置指示 dbt 将所有\
  \ seed 加载到名为 seed_data 的 schema 中。\n\n- 2. 配置好希望 dbt 创建包含 CSV 数据表的位置后，就可以运行命令加载数据了。在\
  \ dbt 命令行中执行以下命令：\n\n```\ndbt seed\n```\n\n运行 `dbt seed` 命令后，你会发现 dbt 在配置的 schema\
  \ 中创建了一个与 CSV 文件同名的表，并带有您开发环境常用的前缀。\n\n### 为 seed 添加数据类型和加载时间戳\n\n在 seed 加载过程中，我们很幸运，所有数据都是字符串类型，并且没有\
  \ null 值，因此即使在未指定列数据类型的情况下，一切也都顺利进行了。\n\n加载表之后，我们还注意到，我们无法知道数据是什么时候加载的。\n\n\n\n\n\
  让我们添加一个 timestamp 类型的 LOAD_TS 列，并使用 post_hook 填充它：\n\n1. 打开 CSV 文件，在第一行末尾通过添加一个逗号和新的列名来加上\
  \ `,LOAD_TS`，不要有空格，如下面的截图所示。保存文件。\n\n这会将 LOAD_TS 列添加到文件中，其他行没有任何数据，这些数据将由 null 值填充。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_284_0.png)\n\n图 7.5：添加了 LOAD_TS 列的 CSV\
  \ 文件\n\n2. 在主 dbt 配置文件中添加配置，以声明 timestamp 数据类型的 LOAD_TS 列。\n\n要配置数据类型，你需要在要配置的 seed\
  \ 下添加 `column_types` 配置，并在其中将你想映射的列对应到你想要指定的数据类型，如下面的代码所示：\n\n```yaml\nportfolio_tracking:\n\
  \  ABC_BANK_SECURITY_INFO:\n    +column_types:\n      LOAD_TS: TIMESTAMP\n```\n\n\
  请注意，我们首先列出了项目名称，然后在它下面列出了 seed 名称。\n\n你不需要指定所有列。你没有指定的列将由 Snowflake 根据 CSV 文件中列的内容进行推断。\n\
  \n3. 在主 dbt 配置文件中添加配置，以便在创建用于保存 CSV 文件的表之后运行 SQL 查询。\n\n要实现这一点，请在 CSV 名称下添加 `post-hook`\
  \ 配置来定义查询，然后添加要执行的查询行：\n\n```yaml\nABC_BANK_SECURITY_INFO:\n  +post-hook:\n    -\
  \ \"UPDATE {{ this }} SET LOAD_TS = '{{ run_started_at }}' WHERE LOAD_TS is null\"\
  \n```\n\nPre-hooks 和 post-hooks 是 dbt 的功能，允许你在模型（包括 seed 表）创建之前或之后执行一个或多个 SQL 查询。\n\
  \n请注意，我们将完整的 SQL 查询放在双引号内，这样我们就可以在查询中使用单引号。还要注意，查询中使用了 dbt 脚本，特别是 `this` 和 `run_started_at`\
  \ 变量。\n\n前者将被替换为正在构建的模型的完全限定名称，而后者将被替换为以 UTC 时区表示的 dbt 执行开始时间的时间戳。\n\n以下截图提供了 CSV\
  \ seed 的最终配置：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_285_0.png)\n\n图 7.6：dbt\
  \ 主配置文件中的 CSV 数据类型和 post-hook 配置\n\n请注意，在 `seed:` 声明下第 61 行定义目标 schema，意味着该配置将应用于所有\
  \ seed，包括由其他库导入的 seed。如果你希望它仅应用于我们项目中的 seed，请将其移动到项目名称下，并进行相应的缩进。\n\n既然我们已经添加了列并完成了配置，让我们从头重新创建\
  \ seed 表，以便能够创建新列。运行以下命令：\n\n```bash\ndbt seed --full-refresh\n```\n\n我们添加了 `--full-refresh`\
  \ 选项，因为我们要删除并重新创建 seed 表。\n\n现在，你可以前往 Snowflake，检查 seed 表是否具有 LOAD_TS 列，并且该列包含你运行命令时的时间戳。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_285_1.png)\n\n图 7.7：Pragmatic Data Platform\
  \ 的层次结构\n\n最终的 YAML 文件将如下所示：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_287_0.png)\n\
  \n图 7.8：用于读取我们的 seed 文件的源系统定义\n\n现在，我们还可以使用 `source()` 函数引用 seed 表。\n\n## 为安全维度创建\
  \ STG 模型\n\n现在，我们已经从创建的 CSV 中加载了数据，因此希望名称和数据类型都没有问题。但在实际环境中，我们可能会从无法控制的来源获得这些数据，因此\
  \ STG 模型将有助于像往常一样调整传入的数据。\n\n此外，从 STG 模型的通用模式中（你可以在我们仓库 Chapter_06 的 patterns 文件夹中找到\
  \ `06_06_v1__STG_Model.sql` 文件），你会记得，对于维度，我们还需要有一个默认记录。\n\n让我们开始构建 STG 模型的骨架：\n\n\
  1. 在 `models/stg` 文件夹中创建一个名为 `STG_ABC_BANK_SECURITY_INFO.sql` 的新文件。\n2. 为 config\
  \ 和 `src_data` CTE 添加以下代码：\n\n```sql\n{{ config(materialized='ephemeral') }}\nWITH\n\
  src_data as (\n    SELECT\n        SECURITY_CODE      as SECURITY_CODE      -- TEXT\n\
  \      , SECURITY_NAME      as SECURITY_NAME      -- TEXT\n      , SECTOR      \
  \       as SECTOR_NAME        -- TEXT\n      , INDUSTRY           as INDUSTRY_NAME\
  \      -- TEXT\n      , COUNTRY            as COUNTRY_CODE      -- TEXT\n      ,\
  \ EXCHANGE           as EXCHANGE_CODE      -- TEXT\n      , LOAD_TS            as\
  \ LOAD_TS            -- TIMESTAMP_NTZ\n      , 'SEED.ABC_Bank_SECURITY_INFO' as\
  \ RECORD_SOURCE\n\n    FROM {{ source('seeds', 'ABC_Bank_SECURITY_INFO') }}\n),\n\
  ```\n\n你可以看到，我们已将模型配置为以 ephemeral 方式物化。我们添加了 RECORD_SOURCE 字段，并且对其他字段的名称做了很少的更改。最后，我们使用\
  \ source() 函数引用 seed 表。\n\n3. 为 hashed CTE 添加以下代码：\n\n```sql\nhashed as (\n    SELECT\n\
  \        concat_ws('|', SECURITY_CODE) as SECURITY_HKEY\n    , concat_ws('|', SECURITY_CODE,\n\
  \                SECURITY_NAME, SECTOR_NAME,\n                INDUSTRY_NAME, COUNTRY_CODE,\n\
  \                EXCHANGE_CODE )\n                as SECURITY_HDIFF\n\n    , * EXCLUDE\
  \ LOAD_TS\n    , LOAD_TS as LOAD_TS_UTC\n    FROM src_data\n)\nSELECT * FROM hashed\n\
  ```\n\n我们将 HKEY 定义为安全代码，并将除 LOAD_TS 和 RECORD_SOURCE 元数据列之外的所有列添加到 HDIFF 中。\n\n关于\
  \ LOAD_TS_UTC 列的定义，有一点需要注意。\n\n通常，我们将其定义为 `'{{ run_started_at }}' as LOAD_TS_UTC`，它提供\
  \ dbt 运行开始的时间戳，但在本例中，我们决定使用 seed 数据加载的时间作为该时间戳，这主要是为了向你介绍新的 Snowflake 语法：`SELECT\
  \ * EXCLUDE <columns>`。\n\n这种 Snowflake 语法在你想要从输出中排除某些列，或重新定义所查询的某个表中某一列的值时非常方便，无需像在标准\
  \ SQL 中那样列出所有其他列。对于列很多的表来说，这非常方便。\n\n更保守的做法是将 LOAD_TS 字段重命名为 INGESTION_TS，并保留 LOAD_TS_UTC\
  \ 列的常见定义。\n\n我们已经创建了 STG 模型的核心。在下一节中，让我们看看如何向该模型添加默认记录。\n\n## 向 STG 添加默认记录\n\n我们要添加的下一部分是默认记录\
  \ CTE，如下所示：\n\n```sql\ndefault_record as (\n    SELECT\n        '-1'          as\
  \ SECURITY_CODE\n        , 'Missing' as SECURITY_NAME\n        , 'Missing' as SECTOR_NAME\n\
  \        , 'Missing' as INDUSTRY_NAME\n        , '-1'        as COUNTRY_CODE\n \
  \       , '-1'        as EXCHANGE_CODE\n        , '2020-01-01'          as LOAD_TS_UTC\n\
  \        , 'System.DefaultKey'   as RECORD_SOURCE\n)\n```\n\n在上述代码中，你可以看到以下内容：\n\
  \n- 所有 CODE 字段都以字符串 -1 作为默认值。这是数据仓库中非常常见的值，用于表示与代码列相关的维度中缺少值所对应的条目。\n- 我们还在默认记录中添加了\
  \ RECORD_SOURCE 字段，其值为 System.DefaultKey，这一点很重要，因为它可以区分出这是由我们的系统作为默认值添加的数据，而不是来自原始系统。\n\
  \  这也是在 src_data CTE 和此处都添加该字段的一个很好的理由，这样我们就可以区分默认记录与其他数据的来源。\n- 其他字段根据其类型具有标准的默认值：字符串字段以\
  \ Missing 作为默认值，数字字段以 -1 作为默认值，但你可以根据该特定实体中每个字段的具体情况选择任何有意义的值。\n\nwith_default_record\
  \ CTE 与模式相比没有变化。\n\n## 保存维度数据的历史记录\n\n在上一章中，我们保存了第一张表的历史记录，该表是关于持仓的。那是一张事实表（FACT\
  \ 表），因为它记录的是已经发生的事实或系统在某个时间点的状态。\n\n事实可能会发生变化。如果会变化，我们就需要业务键来识别事实的不同实例，就像我们对持仓所做的那样。另外，事实也可能是不可变的，此时我们不需要业务键，例如\
  \ Web 浏览量的情况。\n\n现在，我们将保存第一个维度（DIMENSION）的历史记录。\n\n\n\n维度存储描述性信息，使我们能够全面理解一个事实，例如关于客户的信息，或者在此案例中，关于证券的信息。\n\
  \n维度所描述的实体生命周期较长，经常在不同时间被多个事实引用，并且在其生命周期中通常可以发生变化。因此，正确定义实体的身份（最好带有业务键）至关重要。这也是捕获实体实例历史的关键。\n\
  \n## 使用快照保存历史\n\n在本章中，我们将使用 dbt 快照捕获维度的历史，而在第 13 章中，我们将看到如何使用简单的 SQL 以更高效的方式大规模保存历史。\n\
  \n让我们构建快照：\n\n1. 在快照文件夹中创建一个名为 `SNSH_ABC_BANK_SECURITY_INFO.sql` 的文件，就像我们之前创建的其他快照一样。\n\
  2. 在文件中输入以下代码：\n\n```sql\n{% snapshot SNSH_ABC_BANK_SECURITY_INFO %}\n{{\n    config(\n\
  \        unique_key='SECURITY_HKEY',\n        strategy='check',\n        check_cols=['SECURITY_HDIFF'],\n\
  \    )\n}}\nselect * from {{ ref('STG_ABC_BANK_SECURITY_INFO') }}\n{% endsnapshot\
  \ %}\n```\n\n您可能已经注意到，这段代码与之前的快照非常相似，唯一的区别是查询中引用的 STG 模型以及 HKEY 和 HDIFF 字段。\n\n\
  另一个区别是我们移除了 invalidate_hard_deletes 参数，因为通常对于维度而言，保留旧条目比捕获删除更重要，因为这些旧条目会被旧事实引用。最终，我们可能会想知道某个条目是否仍然有效。在这种情况下，我们会启用该参数来跟踪硬删除，但随后在从快照派生的\
  \ REF 模型中同时保留活动行和已删除行。\n\n一个重要的注意事项是我们如何定义 HDIFF 列：我们从 seed 中省略了 LOAD_TS 列，因为它会在每次重新加载\
  \ seed 时发生变化，而如果实际数据没有变化，我们并不关心存储新版本。\n\n请始终非常谨慎地考虑您要将什么视为需要跟踪的变更，并据此构建 HDIFF 列。\n\
  \n现在我们已经创建了第二个快照，让我们使用以下命令部署它：\n\n```bash\ndbt snapshot\n```\n\n这将运行并刷新我们定义的两个快照，因此您将在\
  \ Snowflake 数据库中找到它们。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_291_0.png)\n\n\
  图 7.9：实用数据平台中突出显示的存储层\n\n现在我们已经添加了存储层，可以开始处理精炼层了。\n\n## 使用维度数据构建 REF 层\n\n让我们继续通过构建\
  \ REF 模型来构建证券信息维度。\n\n让我们开始：\n\n1. 在 `models/refined` 文件夹中创建一个名为 `REF_ABC_BANK_SECURITY_INFO.sql`\
  \ 的新文件。\n2. 在文件中输入以下代码：\n\n```sql\nWITH\n    current_from_snapshot as (\n      \
  \  SELECT *\n        FROM {{ ref('SNSH_ABC_BANK_SECURITY_INFO') }}\n        WHERE\
  \ DBT_VALID_TO is null\n    )\nSELECT *\nFROM current_from_snapshot\n```\n\n您可以看到，此文件的内容与我们之前为持仓事实创建的\
  \ REF 模型几乎相同。\n\n我们已经创建了 REF 模型，因此使用以下代码构建它：\n\n```bash\ndbt build -s REF_ABC_BANK_SECURITY_INFO\n\
  ```\n\n查看模型中的列，我们可以看到有 DBT_SCD_ID、DBT_UPDATED_AT、DBT_VALID_FROM 和 DBT_VALID_TO 这些技术列，它们在快照之外不太有用。\n\
  \n我们可以使用 Snowflake 的 SELECT * EXCLUDE 语法轻松地将它们从结果中移除。将 current_from_snapshot CTE\
  \ 改为如下所示：\n\n```sql\ncurrent_from_snapshot as (\n    SELECT * EXCLUDE (DBT_SCD_ID,\
  \ DBT_UPDATED_AT,\n                        DBT_VALID_FROM, DBT_VALID_TO)\n    FROM\
  \ {{ ref('SNSH_ABC_BANK_SECURITY_INFO') }}\n    WHERE DBT_VALID_TO is null\n)\n\
  ```\n\n保存并再次运行构建命令，即可看到这些字段不再出现在输出中。\n\n非常好，这样看起来好多了！\n\n将这一改进同样应用到其他使用类似代码实现的 REF\
  \ 模型上是合理的。您可能会想打开它，复制并粘贴代码，就像您在构建此模型时可能做的那样。\n\n注意！复制和粘贴应当让您的软件工程第六感拉响红色警报！\n\n\
  复制和粘贴代码是快速陷入维护地狱的最可靠方式之一。它浪费时间且容易出错，维护工作很快就会失控，因为每次更改都需要手动应用到所有复制粘贴过代码的地方，但要想找到所有这些地方，祝你好运！\n\
  \n在这种情况下，您很容易理解，大多数从快照数据派生的模型都会使用与之前相同的代码从快照中读取当前数据。如果您有 100 张表，复制和粘贴会让您面临必须在 100\
  \ 个地方应用相同更改的风险。\n\ndbt 最重要的特性之一——宏——就是解决这个问题的方法。在下一章中，我们将介绍宏并解决这个问题，所以目前我们可以保持原样。\n\
  \n## 将维度数据添加到数据集市\n\n现在我们已经有了维度的精炼模型，可以将其发布到数据集市。\n\n让我们构建证券维度：\n\n1. 在 `models/marts/portfolio`\
  \ 文件夹中创建 `DIM_SECURITY.sql` 文件。\n2. 在文件中输入以下代码：\n\n```sql\nSELECT * FROM {{ ref('REF_ABC_BANK_SECURITY_INFO')\
  \ }}\n```\n\n与持仓事实的情况一样，我们现在没有特殊要求，因此我们只是将 REF 模型中的所有内容原样发布。\n\n像往常一样，要部署模型，请运行以下命令：\n\
  \n```bash\ndbt build -s DIM_SECURITY\n```\n\n如果您想确保所有内容都以最新形式部署，请运行以下命令：\n\n```bash\n\
  dbt build\n```\n\n运行上述任一命令后，您将在数据集市中拥有两个表：FACT_POSITION 和 DIM_SECURITY。现在您就可以开始进行分析了。\n\
  \n## 练习——添加几个手动维护的维度\n\n在本章中，我们向您展示了如何从源数据出发（包括在数据在其他地方不可用时创建 CSV），通过存储层和精炼层，生成可用来支持分析的数据集市。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_293_0.png)\n\n图 7.10：实用数据平台的各层\n\n在这里，我们建议您向项目添加几个维度，以提供关于已加载事实的更多有用信息。\n\
  \n对于每个维度，您都需要为数据平台的所有层创建 dbt 模型，并且您将开始看到如何反复应用相同的模式。\n\n每个维度的潜在候选及列如下：\n\n- **交易所**：描述证券交易场所的维度，包含代码、名称、国家、城市、交易时间和时区\n\
  - **账户**：描述持有持仓的账户的维度，包含代码、昵称、主要受益人姓名、所有受益人姓名、记账货币、经纪商名称或经纪商代码\n- **货币**：将货币名称与其字母代码联系起来的维度，还可以包含其他信息，如符号、要使用的小数位数以及发行国家/实体\n\
  - **国家**：包含两位字母和三位字母国家代码、国家名称、地区、次区域等信息的维度\n\n这只是一个示例列表；根据您的兴趣，您可能会找到更多。\n\n我们建议您选择一个或多个并自行实现所有步骤，以便在数据集市中使用它们：\n\
  \n1. 将 CSV 作为 seed 加载，包括生成 LOAD_TS。\n2. 将 CSV 的源定义为另一个 seed 数据表。\n3. 创建 STG 模型以适应传入的数据。\n\
  4. 创建快照以存储维度数据中的变更。\n5. 创建精炼模型，从快照中读取当前数据。\n6. 在数据集市中创建 DIM 模型。\n\n在本书的 Git 仓库中，本章的文件夹下，您会找到一个\
  \ csv 文件夹，其中包含三个 CSV 文件，分别包含货币、国家和交易所的数据。\n\n## 总结\n\n在本章中，我们学习了维度数据以及它如何增强数据平台和数据集市的可用性。我们学习了如何使用\
  \ dbt 的基本功能将维度数据纳入我们的数据平台。\n\n我们加深了对前几章学习的实用数据平台各层的理解，并应用这些原则来处理维度数据。\n\n在下一章中，我们将开始探索更高级的特性，这些特性将使我们能够替换一些基础代码，以构建一个更具弹性、更易于编写且更易于维护的数据平台。\n\
  \n\n\n\n"
- "## 在数据中实现一致性\n\n在之前的章节中，我们了解了如何使用基本的 dbt 功能来构建一个端到端的数据平台，将源数据转换为可用的信息。\n\n在本章和下一章中，你将学习如何为你的转换添加一致性和可靠性。这是\
  \ dbt 独有的两项关键优势，它通过将函数和测试作为开发过程中的一等公民，使这两点变得如此简单。\n\n在本章中，你将学习如何超越基本的 SQL，将脚本能力引入你的代码，编写你的第一个宏，并学习如何在项目中使用外部库。\n\
  \n在本章中，你将了解以下主题：\n\n- 通过复用代码保持一致性——宏\n- 站在巨人的肩膀上——dbt 包\n\n### 技术要求\n\n本章建立在前两章中我们一直在开发的示例之上。\n\
  \n只要了解 dbt 的基础知识，即使没有阅读前面的章节，你也可以阅读并理解本章；但为了更好地理解，我们建议你探索示例项目。\n\n本章的所有代码示例都可以在\
  \ GitHub 上找到：https://github.com/PacktPublishing/Data-engineering-with-dbt/tree/main/Chapter_08。\n\
  \n### 通过复用代码保持一致性——宏\n\n在前面的章节中，我们使用 dbt 将简单的基于 SQL 的转换串联起来，为报表生成精炼的信息。这很好，并且提供了一种使用\
  \ SQL 代码的良好方式，但与之前可用的工具相比，它算不上一个重大的改进。\n\ndbt 在数据转换方面区别于其他工具的一个主要不同点在于，它能够轻松定义宏。宏与编程语言中的函数非常相似，允许我们复用逻辑和\
  \ SQL 代码片段，以生成最终要在数据库中执行的 SQL 代码。\n\n另一个巨大的不同点是，在编写代码时轻松地集成测试，并让测试与代码一起运行以保持数据质量，这一点我们将在下一章中看到。\n\
  \n你使用一种名为 Jinja 的脚本语言来编写 dbt 宏，Jinja 基于 Python，并且被许多其他基于 Python 的项目使用。\n\n使用宏，你可以应用\
  \ DRY 和 KISS 软件工程原则，减少代码重复，并将复杂任务简单化，使诸如模式之类的通用解决方案得以广泛采用，因为复杂性可以对大多数编码者隐藏。\n\n\
  ### 重复是数据项目的固有特性\n\n在构建数据平台时，你反复做同样的事情是很正常的，有时甚至数百次。这通常由两个主要原因驱动——应用列特定的转换，以及应用通用使用模式。\n\
  \n第一种情况，重复的字段转换，源于你处理的数据是由某些软件生成的，而这些数据总是带有该软件的特定怪癖。\n\n每次从系统读取数据时，你都需要处理它的怪癖，例如转换特定的日期格式，或者用\
  \ null 代替空字符串，或者去掉短数字前面的填充零。\n\n无论需要什么样的处理，它很可能被应用很多次——可能非常多次——因为数据源中有许多字段需要处理。\n\
  \n第二种常见的重复来自反复应用相同的逻辑，也就是一种模式。它可能是如何存储历史数据，如何使用映射表进行主数据映射，或者你在代码中一遍又一遍地做的任何其他简单或复杂的行为。\n\
  \n在这两种情况下，使用复制粘贴的诱惑都很大，因为所需的代码几乎总是相同的，唯一的改变通常只是一个字段名或其他参数。\n\n在我们的代码中已经有一个这样的例子。\n\
  \n看看我们两个 REF 模型中的 `current_from_snapshot` 通用表表达式（CTE）——我们有两个“相似”的模型，是通过复制粘贴完成的。这很糟糕！\n\
  \n### 为什么复制粘贴会毁掉未来的你\n\n我们现在有两个 REF 模型，并且有“相同代码”的两个副本，它们在我们读取的快照名称上有所不同，而且是否排除某些技术字段也不同。\n\
  \n你已经可以看到，如果我们有 100 个源表，我们就需要 100 个快照，并且需要 100 次相同的代码来从中提取当前数据。\n\n将代码复制粘贴 100 次似乎是一种不错的收益，因为你无需想太多就能获得所需的数据，但如果你想做任何更改呢？\n\
  \n使用复制粘贴，你必须去修改代码重复自身的 100 个地方。这太糟糕了！你在项目开始时节省了一点精力，结果却在后来被坑了。\n\n那么，让我们的代码由函数（即宏）来生成呢？\n\
  \n那样的话，你只需要更改宏一次，所有 100 处使用都会立即更新。\n\n这节省了大量时间。\n\n项目中唯一不变的是变化和 bug。Bug 比业务变更需要更多的修改。每当你把某些内容写了几次，就开始思考如果你需要更改它，你会受到什么影响。\n\
  \n第二个考虑因素（在许多情况下更重要）是，当你更改生成代码的函数时，你可以 100% 确定所有实例都已更新，无需到处寻找它们。\n\n如果你需要在一个中型项目中找到某个模式或特定格式的所有出现位置，而这样的模式或格式你只应用过\
  \ 20 或 30 次，那我祝你好运。除了耗费时间外，结果的不确定性和不完整更改的后果会让你的开发人员对提议的更改感到害怕。这不是一个令人愉快的情况，尽管不幸的是这相当常见。\n\
  \n不一致地应用模式和公式，是导致数据平台 bug 的最常见原因之一，这些数据平台是使用鼓励复制粘贴而不是让函数创建几乎像复制粘贴一样简单的工具构建的。\n\n\
  dbt 中的宏为你提供了彻底解决这个问题的利器，让你对重复感到舒适，而不是被它们吓到。\n\n### 如何编写宏\n\n编写宏非常简单，只需在宏文件夹中的 SQL\
  \ 文件内的宏声明中编写 SQL 即可，看起来如下所示：\n\n```\n{% macro this_with_filter(arg1, arg2='XXXX')\
  \ %}\n  SELECT * FROM {{this}}\n  {% if arg1 %}\n```\n\n```\nSELECT\n    * EXCLUDE\
  \ (DBT_SCD_ID, DBT_VALID_FROM, DBT_VALID_TO)\n    RENAME (DBT_UPDATED_AT as SNSH_LOAD_TS_UTC\
  \ )\nFROM {{ snsh_ref }}\nWHERE DBT_VALID_TO is null\n{% endmacro %}\n```\n\n3.\
  \ 编辑 REF_POSITION_ABC_BANK.sql 文件中的 CTE，用我们在上一步创建的宏调用来替换当前 SQL：\n\n```\nWITH\ncurrent_from_snapshot\
  \ as (\n    {{ current_from_snapshot(\n        snsh_ref = ref('SNSH_ABC_BANK_POSITION')\n\
  \    ) }}\n)\nSELECT\n    *\n    , POSITION_VALUE - COST_BASE as UNREALIZED_PROFIT\n\
  \    , ROUND(UNREALIZED_PROFIT / COST_BASE, 5)*100\n        as UNREALIZED_PROFIT_PCT\n\
  FROM current_from_snapshot\n```\n\n请注意，你可以决定是保留参数名并为其赋值，还是在调用宏时按正确顺序直接传入值，就像在 Python\
  \ 中调用函数一样。保留参数名使调用更易于阅读，并且在参数不多且并非所有参数都像这里那样直接时会有很大帮助。\n\n下面的调用不带参数名也同样有效：\n\n```\n\
  {{ current_from_snapshot(ref('SNSH_ABC_BANK_POSITION')) }}\n```\n\n保存文件后，宏会取代 CTE\
  \ 的位置，你可以通过点击 </> Compile 按钮来查看宏编译后的结果。你会在名为 Compiled Code 的选项卡下找到编译后的代码。点击 Preview\
  \ 按钮来运行查询。\n\n4. 同样地，按照步骤 3，编辑 REF_ABC_BANK_SECURITY_INFO.sql 文件中的 CTE，用宏调用来替换当前\
  \ SQL：\n\n```\nWITH\ncurrent_from_snapshot as (\n    {{ current_from_snapshot(\n\
  \        snsh_ref=ref('SNSH_ABC_BANK_SECURITY_INFO')\n    ) }}\n)\nSELECT *\nFROM\
  \ current_from_snapshot\n```\n\n\n\n注意，在前面的代码中，正如它在之前的表述中一样，你可以只保留 CTE 的内容并删除其余代码，以保留你在以下代码块中看到的内容。我们更喜欢保留这种带有\
  \ CTE 的较长格式，因为它使得在保持结构在各模型中非常清晰和一致的同时，更容易添加逻辑：\n\n```\n{{ current_from_snapshot(\n\
  \    snsh_ref = ref('SNSH_ABC_BANK_SECURITY_INFO')\n) }}\n```\n\n作为良好的实践，在编辑模型后，运行预览以检查其是否正常工作。\n\
  \n5. 现在我们已经创建了宏，将其放置在我们的代码中，并检查我们的模型仍然正常工作，你可以使用以下命令部署更新后的代码：\n\n```\ndbt build\n\
  ```\n\n如果你回顾一下你编写的宏，你会看到，使用一个仅有一个参数且没有逻辑的非常简单的宏，我们已经极大地改善了项目的质量和可维护性。\n\n我们宏中唯一的\
  \ Jinja 编码部分是 {{ snsh_ref }} 表达式，它将打印出由 snsh_ref 变量引用的对象对应的值。\n\n在这种特定情况下，你可以看到，在我们使用宏的每个模型中，我们都通过对\
  \ ref() 函数的调用来初始化变量：\n\n```\n{{ current_from_snapshot(snsh_ref = ref('SNSH_ABC_BANK_POSITION'))\
  \ }}\n```\n\n如果你在 dbt 参考文档的 dbt Jinja 函数页面中查找 ref() 函数，你会发现它返回一个 Relation 对象，“它具有与\
  \ {{ this }} 变量相同的 table、schema 和 name 属性”。\n\n{{ this }} 变量表示指向正在编译的模型的 Relation\
  \ 对象，在增量模型或钩子中引用模型本身时尤其有用。\n\n还需要注意的是，当在表达式中调用时，例如 {{ snsh_ref }}，Relation 对象将返回它所引用的数据库对象的完全限定名称的字符串，通常是视图或表。\n\
  \n## 为我们的宏添加条件行为\n\n你可能已经注意到，自从使用宏以来，我们的 REF 模型获得了一个名为 SNSH_LOAD_TS_UTC 的新字段。这是因为宏排除了快照中的大多数技术字段，并将\
  \ DBT_UPDATED_AT 重命名为 SNSH_LOAD_TS_UTC。\n\n我们的 REF 模型已经从 STG 模型获得了 LOAD_TS_UTC 字段，因此我们可能会认为同时拥有这两个时间戳是多余的，我们希望使宏更灵活，提供选择是否想要该额外字段的能力。\n\
  \n在本节中，我们添加了一个宏来实现一种模式，并使模型开发者能够轻松使用其逻辑——在我们的例子中，如何从快照中获取当前数据。模型开发者现在只需要知道他们想要从哪个快照读取数据，以及最终是否还想要\
  \ SNSH_LOAD_TS_UTC 列。\n\n我相信你能理解，能够以如此简单的形式生成实现项目特定工作方式的宏，并让模型开发者直接使用它，而不是每次都开发或复制代码，其威力有多大。\n\
  \n在下一节中，我们将看到另一个常见案例，即需要反复应用相同的格式、公式或数据修复。\n\n## 修复从 CSV 文件加载的数据\n\n查看我们为 ABC BANK\
  \ 的头寸加载的数据，你可能会注意到日期有点偏差，因为它们指的是第一个世纪而不是 21 世纪。\n\n该死！我们受到了一个非常常见问题的侵害——在导出、导入和跨系统移动数据时，数据格式往往会以某种方式不完美，最终的数据与开始时的数据会不同。\n\
  \n在我们的例子中，从 Excel 导出到 CSV 文件产生了年份只有两位数字的日期。在这里，我复制了文件中的一行，你可以看到日期表示为 4 / 9 / 21。Snowflake\
  \ 能够将其解释为美国格式的日期，并生成日期 0021-04-09，即公元 21 年 4 月 9 日：\n\n```\nABC000123, STAR, ISTAR\
  \ INC, NYSE, 4/9/21, 150, 2444, 2725.5, USD\n```\n\n现在我们对这个问题有了更深的了解，我们在任何项目中通常有两种前进方式：\n\
  \n- 在源头修复问题并重新加载数据。\n\n这是更好的选择，因为数据在所有步骤中都是正确的，你的项目不需要有修复问题的代码，而代码越少，错误越少，维护也越少。不幸的是，在许多情况下，我们无法控制源头或无法要求其修复，或者我们需要保留收集的历史记录，因此修复源头只会修复一半的问题。\n\
  \n- 至少暂时忍受它，然后再修复它。\n\n即使它不如前者好，这通常是我们唯一的选择。\n\n即使我们能够要求修复数据，修复的时间表和我们工作预期的发布时间可能不匹配，或者我们可能不想依赖外部操作，因此我们仍然需要修复数据，即使只是暂时。\n\
  \n如果你愿意，你可以去修复 CSV，重新导入它，并运行所有内容，以便快照中的最新版本是正确的。\n\n我们将采用修复路径，因为这是你经常必须采取的路径，因为你无法在源头影响问题。\n\
  \n我们的源是一个包含数据已在 date 数据类型中的表的表，因此我们无法修复 CSV 的解析；我们的修复将涉及将日期从公元 1 世纪带到 21 世纪。\n\n\
  由于我们将 CSV 作为 seed 导入，我们也可以强制该列为文本数据类型，然后从文本解析为日期并提供正确的格式。这可以以与此处所示类似的方式实现为宏。你可以将其作为练习。\n\
  \n我们本可以直接在 STG 模型中编写 SQL，但为了使其可重用，我们将创建一个带有 SQL 和参数的宏，并向你展示如何在 STG 模型中使用它。\n\n让我们开始：\n\
  \n1. 在 macros 文件夹中创建 `to_21st_century_date.sql` 文件，代码如下：\n\n```sql\n{% macro to_21st_century_date(date_column_name)\
  \ -%}\n    CASE\n        WHEN {{ date_column_name }} >= '0100-01-01'::date\n   \
  \     THEN {{ date_column_name }}\n        ELSE DATEADD(year, 2000, {{ date_column_name\
  \ }})\n    END\n{%- endmacro %}\n```\n\n在前面的代码中，我们创建了 `to_21st_century_date` 宏，它有一个单一的\
  \ `date_column_name` 参数。代码是纯 SQL，只是将列名替换为将保存列名的参数。\n\n请注意，宏将在 dbt 中运行以创建要发送到数据库的\
  \ SQL；因此，我们传入的参数值只是列名的字符串，而不是列值。\n\n2. 打开 `STG_ABC_BANK_POSITION.sql` 文件并编辑 `src_data`\
  \ CTE，将 `REPORT_DATE` 列的行编辑为如下所示：\n\n```sql\nsrc_data as (\n    SELECT\n       \
  \ ACCOUNTID   as ACCOUNT_CODE    -- TEXT\n      , SYMBOL      as SECURITY_CODE \
  \  -- TEXT\n      , DESCRIPTION as SECURITY_NAME   -- TEXT\n      , EXCHANGE   \
  \ as EXCHANGE_CODE   -- TEXT\n      , {{to_21st_century_date('REPORT_DATE')}}\n\
  \            as REPORT_DATE            -- DATE\n      , QUANTITY    as QUANTITY\
  \        -- NUMBER\n      , COST_BASE   as COST_BASE       -- NUMBER\n      , POSITION_VALUE\
  \ as POSITION_VALUE\n      , CURRENCY as CURRENCY_CODE      -- TEXT\n      , 'SOURCE_DATA.ABC_BANK_POSITION'\
  \ as RECORD_SOURCE\n    FROM {{ source('abc_bank', 'ABC_BANK_POSITION') }}\n),\n\
  ```\n\n你可以看到，唯一的变化是将 REPORT_DATE 列名替换为 {{to_21st_century_date('REPORT_DATE')}} 宏调用，将列名作为字符串传递（用单引号或双引号括起来）。\n\
  \n运行 dbt 模型时，宏将被运行并替换为执行结果的代码。你可以通过单击 </> Compile 按钮查看结果。你可以通过单击 Preview 按钮预览结果并检查日期是否已在\
  \ 21 世纪。\n\n3. 使用以下命令运行模型及其下游模型：\n\n```\ndbt build -s STG_ABC_BANK_POSITION+\n```\n\
  \n4. 运行完成后，验证你现在是否在快照中为已修复的行获得了新条目，而旧行已关闭，并在 DBT_VALID_TO 列中带有我们运行的时间戳。\n\n你也可以验证\
  \ REF 模型现在是否正在提供当前值，即带有 21 世纪日期的值。\n\n在本节中，我们创建了一个宏，它隐藏了一段更长的 SQL 代码，并使其在简单名称下可用，易于应用于不同的列。\n\
  \n虽然为仅使用一次而创建宏是没有意义的，就像我们的例子一样，在现实项目中，如果你需要应用修复或转换，通常需要多次应用它，因此创建宏可能是一个不错的解决方案。\n\
  \n在全面用宏替换 SQL 之前，请记住，代码的可读性是我们最重要的目标之一，引入过多的宏，尤其是如果你找不到合适的名称，可能会使你的代码难以理解。\n\n##\
  \ 宏编写的基础知识\n\n在前面的章节中，我们看到了一些简单的例子，说明如何使用宏来赋能初级同事应用模式和一致的转换，改善你的项目，并使你的代码更易于阅读和维护。\n\
  \n在本节中，我们将看到一些基本元素，帮助你开始编写有用的宏，但要获得完整概述，我们建议你从 dbt Jinja 参考文档 https://next.docs.getdbt.com/reference/dbt-jinja-functions\
  \ 开始，然后是 Jinja 模板设计师文档 https://jinja.palletsprojects.com/en/3.1.x/templates/。\n\n\
  \n\n\n\n## Jinja 分隔符\n\n在处理 Jinja 时，首先要理解也是最重要的一点是，如何从输出上下文（代码原样输出）切换到 Jinja 上下文（逻辑控制流程和输出），以及如何从\
  \ Jinja 生成输出，使其成为发送到数据库的代码的一部分。\n\n在 dbt 模型中编写的文本被视为要发送到数据库的 SQL 代码，除非你使用此处描述的分隔符进入\
  \ Jinja 上下文：\n\n- `{% ... %}` 用于开始和结束 Jinja 语句。\n\n语句是你在 Jinja 中用来控制执行流程的控制结构。例如\
  \ if 条件语句、for 循环、宏定义、set 赋值和过滤器。\n\n- `{{ ... }}` 用于包围 Jinja 表达式，表示将结果打印出来。\n\n\
  Jinja 表达式与 Python 表达式非常相似，包括多种类型的字面量、数学运算、比较和逻辑运算，以及其他一些运算符，包括调用 Python 方法的能力。\n\
  \n- `{# ... #}` 用于包围 Jinja 注释，可用于将某些 Jinja 代码从求值/输出中排除。\n\n- 需要注意的是，一旦进入 Jinja 上下文，你就不再需要分隔符，可以直接使用表达式而无需额外的大括号。\n\
  \n在接下来的章节中，我们将更详细地描述一些最常用的元素。\n\n## Jinja 表达式\n\n与 Python 一样，表达式允许你使用字面量、变量、函数和运算符来计算值。然后你可以使用表达式的结果，将结果存储在变量中，作为函数的输入，或者直接打印出来。\n\
  \n在这里，我们可以看到不同类别的一些示例：\n\n- Jinja 字面量示例：\n\n```text\n'Hello World' or \"Hello World\"\
  \   -- String literals\n42 or 42.24 or 42E3               -- Numeric literals\n\
  true / false                       -- Boolean literal\n['list', 'of', 'objects']\
  \          -- List literal\n('tuple', 'of', 'values')          -- Tuple literal\n\
  {'dict': 'of', 'key': 'and', 'value': 'pairs'}\n        -- Dictionary literal\n\
  ```\n\n你可以用双花括号将它们包围起来打印出来，例如 `{{ 'Hello World' }}` 或 `{{ 42.24 }}`，这将会打印出这些值。\n\
  \n- **使用数学运算符的示例：**\n\n```text\n{{ 1 + 1 }} or {{3-1}} or {{7 // 3}}  -- all print\
  \ 2\n{{ 1 / 2 }}                         -- prints out 0.5\n{{ 3*2 }} or {{ 20 %\
  \ 7 }}            -- all print out 6\n{{ 2**3 }}                            -- prints\
  \ out 8\n```\n\n数学运算符是通常的四种算术运算符（+、-、* 和 /），它们执行浮点运算，此外还有 // 整数除法、% 取模或余数，以及 **\
  \ 幂运算符。\n\n- **使用比较运算符的示例：**\n\n```text\n{{ 42 == 42 }} or {{ 42 != 24 }}      \
  \ -- both return true\n{{ 42 > 24 }} or {{ 42 >= 24 }}          -- both return true\n\
  {{ 24 < 42 }} or {{ 24 <= 42 }}          -- both return true\n```\n\n如前面的示例所示，我们有常用的比较运算符：`==`——等于，`!=`——不等于，`>`——大于，`>=`——大于或等于，`<`——小于，`<=`——小于或等于。\n\
  \n- **使用逻辑运算符的示例：**\n\n```text\n{{ true and true }} or {{ not false }} -- will return\
  \ true\n{{ false or (42 > 24) }}              -- will return true\n```\n\n你可以使用逻辑运算符（and、or、not\
  \ 以及 () 分组）来组合布尔表达式，并控制 if 语句或任何其他需要使用布尔值的地方。\n\n- **使用其他运算符的示例：** `in` 运算符执行包含性测试，如果被测试的元素包含在\
  \ `in` 运算符之后的序列或映射中，则返回 true：\n\n```text\n{{ 1 in [1, 2, 3] }} or {{ 'bc' in ['bc',\
  \ 'a'] }} -- in operator\n```\n\n`is` 运算符使用一种 Jinja 测试对变量或表达式执行测试。你编写表达式，然后是 `is`\
  \ 运算符，接着是测试名称，最终可以在测试名称后面带上测试的其他参数：\n\n```text\n{{ (expr) is integer }}        \
  \         -- is operator\n```\n\n`~` 运算符将操作数转换为字符串并连接它们：\n\n```text\n{{ 1 ~ \" string\"\
  \ ~ '!' }}             -- ~ operator\n```\n\n`()` 运算符允许我们调用可调用对象并传递最终参数：\n\n```text\n\
  {{ \"Welcome {}\".format(name) }}        -- () operator\n```\n\n`|` 运算符，称为管道符或竖线，用于应用过滤器。过滤器会修改其应用到的值。过滤器可以链式使用，并依次应用，第一个过滤器的输出由第二个过滤器修改，依此类推：\n\
  \n```text\n{{ \"to uppercase\"|upper }}          -- | operator (pipe)\n```\n\n`.`\
  \ 或 `[]` 运算符允许访问存储在你应用运算符的变量中的对象的属性，其语法类似于 Java 或 Python：\n\n```text\n{{ obj.attr\
  \ }} or {{ obj[attr] }}      -- . / [] operator\n```\n\n组合不同类型的表达式，你可以生成复杂的表达式，从而像在\
  \ Python 中一样表达几乎任何计算或测试。\n\n## If 语句（if... then... 和 else）\n\nif 语句，也称为条件语句，其工作方式与\
  \ Python 中相同，允许你根据一个或多个测试来决定在哪个分支中继续执行。\n\n主要区别在于表示法略有不同，它以 `{% if value_to_test\
  \ %}` 块开始，并始终以 `{% endif %}` 块结束。\n\n在最简单的版本中，如果测试值为真，if 语句将继续流程，如以下示例所示：\n\n```text\n\
  {% if value_to_test %}\nsome output\n{% endif %}\n```\n\n如果你愿意，也可以将前面的示例全部写在一行：\n\
  \n```text\n{% if value_to_test %}some output{% endif %}\n```\n\n如果测试为真，则 if 语句内的代码将被执行——在这种情况下，返回文本。你可以在\
  \ if 语句内放置其他语句和表达式。\n\nif 语句的一般形式如下：\n\n```text\n{% if test1 %}\n    Test 1 is true.\
  \ Do something ...\n{% elif test2 %}\n    Test 2 is true, but not test 1. Do second\
  \ thing...\n{% else %}\n    Both test1 and test2 did not return true. Do something\
  \ else...\n{% endif %}\n```\n\n查看前面的示例，你会发现你可以根据需要链式使用任意数量的 elif 块，并且可以使用 else 块来捕获未满足前述任一测试的所有情况。\n\
  \n## for 循环语句\n\nfor 循环是另一种主要的控制结构，与 if-else 语句一起，并且与 Python 的 for 循环非常接近。主要区别在于你不能在\
  \ Jinja for 循环中 break 或 continue，但可以应用过滤器和测试。\n\n你可以使用 for 循环遍历序列，如以下示例所示：\n\n```text\n\
  {% for item in sequence %}\n  {{item}} {% if not loop.last %},{% endif %}\n{% endfor\
  \ %}\n```\n\n在这里，我们举例说明了 loop 特殊变量的 last 属性的用法。\n\n示例中的 sequence 变量可以是任何类型内容的列表，通常是列名或值的列表。另一个常见用例是使用\
  \ range 函数生成数字列表——例如，要生成从 1 到 10 的列表，可以使用 range(1, 11) 表达式。\n\n你也可以使用 for 语句遍历字典的内容：\n\
  \n```text\n{% for key, value in a_dict | dictsort %}\n{{ key }}, {{ value }} is\
  \ the same as {{ key ~ ', ' ~ value}}\n{% endfor %}\n```\n\n在前面的示例中，我们还应用了 dictsort\
  \ 过滤器，以便在遍历之前对字典进行排序。\n\n## set 语句\n\n在 Jinja 中，你使用 set 语句来执行变量赋值。\n\n赋值有两种格式；第一种是内联赋值，类似于\
  \ Python 中的赋值，如下面的示例所示：\n\n```text\n{% set var = \"some value\" %}\n{% set a_mixed_list\
  \ = ['one', 2, three] %}\n{% set var1, var2 = my_function() %}\n```\n\n如你所见，你可以在同一次赋值中同时给多个变量赋值，就像在\
  \ Python 中一样。\n\n请注意，for 循环引入了不同的作用域（而 if 条件语句则不会）；结果是，在 for 循环外部，你看不到在循环内部进行的赋值的效果，即使该变量是在\
  \ for 循环外部声明/初始化的。为此，你应该使用命名空间或其他不同的结构。\n\n\n\n\n\n第二类赋值是块赋值，你只需在 set 语句中声明变量名，然后该变量就会被赋值为\
  \ set 块内代码解析后的结果：\n\n```\n{% set date_filter %}\n  DATE between {{ start_date }}\
  \ and {{ end_date }}\n{% endset %}\n```\n\n这种第二类赋值对于赋值较长的文本非常方便，尤其是当你希望它们格式正确时，因为该块会保留正确的换行符。\n\
  \n当我们想在文本中加入变量时，我们倾向于使用这种赋值方式，因为在块内，你可以正常输入文本，并使用常见的双花括号表达式格式输出变量或计算结果。\n\n这是一种简单易读的方式，可以将\
  \ SQL 查询的文本或要在宏中传递的过滤器赋值给变量。\n\n## run_query() 函数\n\ndbt 提供的 run_query() Jinja 函数允许我们向执行调用所在环境配置的数据库执行一段\
  \ SQL。\n\n在开始编写更复杂的函数——这些函数的行为取决于数据库的内容，或者当你希望执行超出正常的 dbt 运行周期的 SQL 命令时——你才需要使用此函数。\n\
  \n以下来自 dbt 函数参考的示例代码为我们提供了两个有用的信息来讨论：\n\n```\n{% set results = run_query('select\
  \ 42 as the_answer') %}\n{% do run_query('DROP TABLE IF EXISTS PUBLIC.MY_USELESS_TABLE')\
  \ %}\n```\n\n- 第一行表明，如果你想将结果存储在变量中，可以使用赋值来执行函数并在变量中获取结果。\n- 第二行表明，作为替代方案，你可以使用带有\
  \ `do` 标签的表达式语句来执行表达式，而不打印任何结果。\n\n  如果你不想存储结果，这对于执行具有副作用的表达式或函数非常有用；示例包括更改列表或运行一些\
  \ DDL 或 DML SQL 代码。\n\n通常，我们只会在想要执行某些操作（即非 SELECT 查询）并且不想使用查询结果时使用 run_query 函数，因为结果是\
  \ Agate 表——这是一个不太容易操作的复杂对象。\n\n当你想要在宏中使用查询结果时，我们建议使用 dbt_utils 库中的 get_query_results_as_dict()\
  \ 宏，我们将在下一节中介绍。该宏将返回一个易于使用的 Python 字典。\n\n当我们希望以自动化方式运行 DDL 或 DML 命令时，我们会将 `run_query`\
  \ 函数与 `run-operation` dbt 命令结合使用，例如当我们想要定义外部表、创建落地表，或使用 `COPY INTO` 命令直接从文件摄取数据时。\n\
  \n## `return()` 函数\n\n我们只在更高级的宏中使用 `return()` 函数，这些宏不直接产生最终输出，而是返回一个数据结构以供进一步使用，通常是列表或字典，如下面的示例宏所示：\n\
  \n```jinja\n{%- macro get_user_dictionary() -%}\n{% set users_dict_yaml -%}\ndevelopers:\n\
  \  - MY_SF_USER\n  - ANOTHER_SF_USER\nreaders:\n  - PBI_USER\n{%- endset %}\n{%\
  \ do return(fromyaml(users_dict_yaml)) %}\n{%- endmacro %}\n```\n\n上面的宏允许你使用 YAML\
  \ 格式创建和维护字典，方法是将其写在赋值给 `users_dict_yaml` 变量的块内。\n\n然后，该变量被传递给 dbt 的 `fromyaml` 函数，该函数解析文本并构建相应的数据结构。存在一个类似的函数\
  \ `fromjson` 用于解析 JSON 格式。\n\n最后，`return()` 函数将数据结构返回给调用者。\n\n这里，我们看到了一个返回手动维护配置的示例；return()\
  \ 函数的另一个常见用途是返回你通过 `run_query()` 函数（或库提供的其他更可用的变体）加载的数据。\n\n到目前为止，我们一直在从头编写模型和宏——也就是说，除了基本的\
  \ dbt 功能外，不借助任何帮助地编写所有代码。在下一节中，我们将看到我们可以从 dbt 库（称为包）获得很多帮助，我们可以将它们导入到我们的项目中。\n\n\
  ## 站在巨人的肩膀上 – dbt 包\n\n我们一直在仅使用基本 dbt 功能编写模型和宏。在本节中，我们将了解一些现有的库（在 dbt 中称为包），以及如何导入它们以提高生产力。\n\
  \n仅使用 dbt 或 Java 或 Python 标准功能，你就可以构建所需的一切。凡事自己做并不构成绝对的限制，但在所有语言中，库的可用性——这些库是经过良好测试的代码集合，用于处理频繁或复杂的任务，你可以轻松下载并使用它们来完成复杂任务——极大地提升了程序员的生产力和解决更复杂问题的能力。\n\
  \n使用库，你可以专注于问题的核心，并依靠许多其他聪明人的知识和经验来降低项目的复杂性，节省大量时间。\n\n你可以重用由在团队不擅长的领域的专家编写的代码，使用你自己可能无法创造的经过验证的解决方案，或者使用快速且标准的解决方案来实现日常需求，使用经过验证的方案而不是重新发明轮子。\n\
  \n### 创建 dbt 包\n\n也许你想知道如何创建 dbt 包。\n\n你可能会惊讶地听到你已经做到了！\n\n一个 **dbt 包**只是一个普通的 dbt\
  \ 项目，与其他项目一样，通常存储在 git 仓库中。\n\n是什么让 dbt 项目成为包？实际上并没有特别的原因——只是被另一个包导入这一事实。*包*这个名字指的是被导入的项目将一些功能打包在一起，供其他项目重用。\n\
  \n一个包可以包含 dbt 项目包含的所有内容——模型、宏、源、测试等——这些将成为导入项目的一部分，因此你可以像往常一样引用这些元素。\n\n因此，你可以使用\
  \ `ref()` 函数引用导入的模型，并通过其名称调用宏，调用时以导入的包名作为前缀以避免名称冲突。\n\n当你导入一个包时，所有 dbt 命令都将同时作用于你的代码和你导入的代码。例如，当你运行\
  \ `dbt run` 命令时，导入包中的最终模型也会被运行。\n\n你通常可以找到或创建包来解决常见问题，例如：\n\n- 转换来自标准接口（如 SaaS 和常见产品）的数据\n\
  - 用于执行常见任务或与特定领域相关的任务的宏库\n- 管理或审计特定工具\n\n### 导入 dbt 包\n\n- 使用本地文件夹，语法如下：\n\n  ```yaml\n\
  \  packages:\n    - local: /your/local/folder  # a local path\n  ```\n\n  这是一种特殊的导入包的方式，对于你正在开发的包非常有用，因为只要你保存包的文件，更改就会立即生效，无需在每次更改时运行\
  \ `dbt deps`。\n\n  此功能仅在 dbt Core 中可用，而不可在 dbt Cloud 中使用，因为你无法访问 dbt Cloud 项目的本地文件系统。\n\
  \n- 从 Git 私有仓库导入：语法略有不同，具体取决于你使用的 Git 服务提供商，因为你需要使用正确的 HTTP URL 格式来提供访问令牌，以及（如需要）用户名，具体取决于服务提供商的要求：\n\
  \n  ```yaml\n  packages:\n    # github format\n    - git: \"https://<application\
  \ token>@github.com/...\"\n    - git: \"https://<user_name>:<personal token>@github.com/...\"\
  \n    # Azure format\n    - git: \"https://<personal access token>@dev.azure.com/...\"\
  \n\n    # BitBucket format\n    - git: \"https://<user>:<personal token>@bitbucketserver.com/...\"\
  \n    # GitLab format\n    - git: \"https://<user>:<personal token>@gitlab.xxx.com/...\"\
  \n  ```\n\n  正如你在前面的示例中所看到的，你可以在 @ 符号之前提供访问信息，然后是通常的完整仓库 URL。\n\n  提供访问信息的格式主要有两种——一种只包含访问令牌，另一种包含用户名和访问令牌，用冒号分隔。\n\
  \n  为了避免将机密明文放入你的仓库，你不应直接在 YML 文件中编写用户名和令牌。相反，你应该使用环境变量来存储实际值，并在 YML 文件中使用 `env_var`\
  \ 函数。\n\n  参考前面的示例，你可以进行以下替换：\n\n  将 `<user_name>` 替换为 `{{ env_var('DBT_ENV_SECRET_GIT_USERNAME')\
  \ }}`。\n\n  将 `<token>` 替换为 `{{ env_var('DBT_ENV_SECRET_GIT_CREDENTIAL') }}`。\n\n\
  \  请记住，在 dbt Cloud 中，环境变量有严格的名称，必须以 `DBT_` 或 `DBT_ENV_SECRET_` 开头。两者之间的区别在于 dbt\
  \ Cloud 是否能够将其打印的值从日志中移除，并且不在 UI 中显示或打印出这些机密值。\n\n现在我们已经了解了如何导入包，让我们讨论何时使用每种方法。\n\
  \n\n\n\n\n## 使用 dbt 包的导入方法\n\n看到这四种导入包的方式，你可能已经猜到了它们的常见用例，但让我们简要讨论一下：\n\n- 从 dbt\
  \ Hub 导入包是从常用的开源包中导入通用包的首选方法。这绝对是你项目中最常使用（甚至可能是唯一）的导入包的方法，至少对于引入第三方构建的功能而言是如此。\n\
  - 从 git 公共仓库导入是将不太知名或小众的包引入的便捷方式，这些包由作者向社区提供，无需费心在 dbt Hub 上注册。如果你可以接受将代码公开，也可以将它用于自己的库。\n\
  - 本地导入是一种专门的功能，主要由包开发者使用。其主要优势是任何更改都会立即生效，无需调用 dbt deps 命令来刷新包。\n- 从私有仓库导入使你能够拥有私有包，从而构建自己的\
  \ dbt 宏和模型库，并在所有项目中复用，而无需公开代码。\n- 从私有仓库导入还可用于构建嵌套的项目架构，其中多个项目共用的部分（例如来自同一数据源的摄取和/或初始转换）被提取到一个公共包中，并包含在需要相同数据的所有项目中。\n\
  - 私有导入的另一个用途是将较大的项目拆分为多个子项目，但这样做风险在于最终全局项目的复杂度增加，以及在小项目中工作的收益减少。当某些数据或代码不能与某些第三方共享时，可能需要这种用途；这些第三方可以转而处理整个项目中不那么敏感的部分。\n\
  \n这可以通过两种方式实现；第一种是导入公共包的代码，重复处理过程，并为每个项目生成一份独立的数据副本，而无需管理多份代码副本，同时提供连续的沿袭图。这种做法的缺点是处理过程和数据的重复。\n\
  \n第二种方式是让一个项目执行公共导入/处理，且只运行一次、只针对数据的一份副本，然后创建第二个“仅接口”项目，将第一个项目的结果定义为源。这个第二个项目可以被所有需要读取转换后数据的其他项目导入。这种设置的缺点是沿袭被分散在公共项目和被导入的项目之间。\n\
  \n我们讨论了一些导入 dbt 包的常见方式，以及一些更高级的可能性；这些高级可能性很可能在你项目变得相当大（数百个模型）并且积累了丰富经验之前，都不需要考虑。\n\
  \n大多数时候你都会从 dbt Hub 导入常规包，这是完全正常的；尽管如此，我们认为了解一些高级可能性以备将来使用仍然是有益的。\n\n## 使用包构建内部共享库\n\
  \n如果你的公司有多个 dbt 项目，那么很有可能你在所有这些项目中都应用了相同的最佳实践和模式。因此，有相当多的宏和工具模型在这些项目中的全部或许多项目里被使用，且几乎没有改动。\n\
  \n共享宏的示例可能包括摄取数据（使用宏，我们将在后续章节中看到）、你持续使用的通用测试（例如针对哈希冲突的测试），或者你经常需要应用的格式转换（例如去除字符串中的填充零或为字符串添加填充零）。\n\
  \n共享模型的示例可以包括监控本地部署中的性能和资源或 SaaS 平台中的消耗，提供安全相关的报告（如用户和角色访问），或提供活动审计（如某个用户运行的查询或访问某些信息的用户）。\n\
  \n在这些情况下，复制粘贴和复用模型或宏的诱惑很大，但如果你回到本章开头重新阅读“为什么复制粘贴会毁掉未来的你”一节，你会被提醒：在项目内部这样做不是一个好主意，而且你可以猜到，跨项目这样做同样如此。\n\
  \n解决方案是将公共宏和模型重构为一个独立的 dbt 项目，作为你共享库的第一个版本。然后，你将根据项目中出现的需求来演化它，例如当我们需要额外功能时扩展了我们的\
  \ current_from_snapshot 宏。\n\n设计一个库并不是简单的事情，因为你需要平衡你想给用户的灵活性与使用的简单性。以下指导原则将帮助你入门：\n\
  \n- 优先选择小而专注的包，而不是包罗万象的包。导入三个或五个不同的包很容易，但你无法只导入一个包的一半。\n- 特别是当包含会在每次运行项目时物化的模型时，宁可拆成多个高内聚的小包，这样你的用户可以在不携带任何额外负担的情况下选择他们想要的功能。\n\
  - 提供一种简单的方式来配置模型，使用 dbt 变量或环境变量，并记录如何完成配置。\n- 当你制作的包只包含宏或测试时，可以倾向于制作更少但更大的包，因为未使用的宏和测试只是放在那里，不会打扰任何人。一个很好的例子是\
  \ dbt_utils 包，它提供了一组相当不同的宏，其共同点是通用性。\n\n  库越大，按领域和功能组织宏就越重要。要提供它们的使用示例，清楚地说明你期望参数具有什么数据类型以及你期望处理的数据结构，并说明是否有任何特殊要求，例如键字段是列列表中的第一个。\n\
  \n- 与软件工程中一贯的原则一样，避免库之间的循环引用，因此在构建库时要考虑它们的抽象层级，并最终拆分库，将许多库使用的对象与使用其他库的对象分开。\n\n\
  现在，通过使用宏、通用测试和包，你知道了如何避免项目内部和跨项目的重复。在下一节中，我们将浏览一些有用的包，它们为你提供了大量新功能。\n\n## 浏览 dbt\
  \ 值得关注的包\n\n你现在知道如何导入包来为你的项目添加功能，也知道有一个 dbt Hub 存储库，其中包含最常用的开源包，你可以轻松地将它们添加到项目中。\n\
  \n你可以通过 `https://hub.getdbt.com/` URL 访问 dbt Hub 存储库。\n\n在接下来的几节中，我们将介绍一些你可以在 dbt\
  \ Hub 中找到的值得关注的包。\n\n### dbt_utils 包\n\n这无疑是使用最普遍、最常用的 dbt 包，因为它提供了各种各样的常见功能，从更通用的测试到不同领域的宏，例如从数据库加载数据、扩展\
  \ SQL、提供统一的跨数据库功能，以及更具体需求，例如从 URL 中提取参数或 Jinja 辅助函数。\n\n以下是一些通用测试和宏的列表，我们会发现它们对此包尤其有用：\n\
  \n- `expression_is_true`：这是一个模型级测试，用于断言你提供的 SQL 谓词（一个求值为真或假的表达式）对表中的所有记录均为真。这个宏允许你测试几乎任何可以用\
  \ SQL 谓词表达的内容，但如果你一直以相同方式使用它，我们建议你定义一个具有适当名称的自己的通用测试。\n- `not_empty_string`：这是一个列级测试，用于验证某一列在修剪该列内容后，不存在空字符串（`''`）。\n\
  \n与 `not_null` 测试结合使用，你可以验证文本列确实包含真实的文本值，既没有 null，也没有 `''`。\n\n```yaml\n- name:\
  \ column_name\n  tests:\n```\n\n\n\n\n\n- `not_null`\n- `dbt_utils.not_empty_string`\n\
  - **mutually_exclusive_ranges**: 该模型级宏测试按列分区时行是否创建正确的日期范围，让你验证范围不重叠、有或没有间隙，以及范围大小大于零。\n\
  - **get_column_values**: 该宏将模型中特定列的值加载为 Python 列表，而无需处理 Agate 表。\n- **get_query_results_as_dict**:\
  \ 该宏将 SQL 查询的结果加载为 Python 字典，这样你就无需处理 Agate 表。\n- **date_spine**: 该宏生成 SQL 代码以在区间内生成连续的日期序列，根据所需的粒度（天、月等）。\n\
  - **union_relations**: 该宏允许你联合两个或多个关系（表或视图），对具有相同名称的字段进行对齐并为缺失的字段添加 null 列，从而简化对相似但列不完全相同且顺序不同的表的\
  \ UNION 操作。\n- **star**: 该宏的基本行为是生成关系中列的逗号分隔列表，最终可带别名，并能够排除某些列。这可以用在通常的 SELECT *\
  \ 代码的位置，以更好地控制你想要选择的列，即使在数据库不支持 SELECT * EXCLUDE (...) 构造的情况下也是如此。\n  更高级的用法允许你为列名添加前缀或后缀。\n\
  - **generate_surrogate_key**: 该宏提供了一种跨数据库的方式来计算列列表的哈希值。这可以用作代理键或用于任何其他哈希的常见用途。\n\
  \  我们将在宏中经常使用它来存储表的历史记录。\n\n我们刚刚提供了一个非常简短的 dbt_utils 包中可用有用宏的列表，我们强烈建议你去 https://hub.getdbt.com/dbt-labs/dbt_utils/\
  \ 看一看。\n\n## Codegen package\n\n该包同样来自 dbt-labs，提供了许多有用的宏来生成常用代码片段的初始版本，以便你可以最大程度地减少输入数据库中已有的信息，尤其是名称的需要。\n\
  \n使用这些宏，你可以生成模式中表的源定义，将其复制粘贴到源 YAML 文件中，或者你可以生成一个骨架暂存模型或用于记录和测试一组模型的 YAML 代码。\n\n\
  预览以下代码将生成用于导入所选数据库中模式的关联的源文件的 YAML：\n\n```\n{{ codegen.generate_source('<schema>',database_name\
  \ = '<database>') }}\n```\n\n你也可以使用 run-operation 命令运行宏，如下所示：\n\n```\ndbt run-operation\
  \ generate_source --args '{\"schema_name\": \"<schema>\", \"database_name\": \"\
  <database>\", \"table_names\":[\"table_1\", \"table_2\"]}'\n```\n\n以下代码可用于生成描述和测试模型的\
  \ YAML：\n\n```\n{{ codegen.generate_model_yaml(model_name='<model>') }}\n```\n\n\
  我们强烈建议使用这些宏或自行构建，以最大程度地减少无用的输入，减少输入列和关系名称时的错误，并专注于你需要添加以将数据转换为信息的逻辑。\n\n在第 6 章中，我们提供了可运行的\
  \ SQL 查询示例，以同样的效果从数据库已有的源表元数据信息中生成模型所需的代码。\n\n## dbt_expectations package\n\n该包通过定义许多测试宏扩展了\
  \ dbt 的测试能力，受启发于测试 Python 程序的 Great Expectations 包。\n\n可用的测试从简单的例如 expect_table_row_count_to_equal_other_table\
  \ 到更复杂的可以测试数据值的测试，例如 expect_column_values_to_be_within_n_moving_stdevs。\n\n## The\
  \ dbt_external_tables package\n\n该包允许你以数据库无关的方式通过在 YAML 中配置想要的表来创建外部表作为源。\n\n##\
  \ The metrics package\n\n该由 dbt-labs 创建的包使用 dbt V1.0.0 中引入的指标定义来生成数据表，根据指标定义提供数据。\n\
  \n该包允许你物化已定义的指标并利用二级计算，例如环比、期初至今、滚动等。\n\n## dbt_vault package\n\n这是第一个帮助根据 Data\
  \ Vault 2.0（DV2）原则构建数据平台的 dbt 包，由 Data Vault 生产，这是一家专门从事 DV2 咨询的英国公司，由著名的 DV2 专家\
  \ Neil Strange 运营。\n\n## datavault4dbt package\n\n这是一个根据 DV2 原则构建数据平台的包，由 Scalefree\
  \ International 生产，这是一家与 Data Vault 创建者 Dan Linstedt 关系密切的公司。\n\n## dbt Model Usage\
  \ package\n\n该 dbt 包提供测试，让你知道你的模型是否仍然与你的用户相关。这些测试扫描数据库的查询日志以检查用户是否仍在从 dbt 生成的表中选择。测试失败可以让你知道何时可能需要淘汰未使用的模型。\n\
  \n## dbt_profiler package\n\n该包提供宏来分析关系的内容，为每个列提供许多度量，例如非空比例、最小值、最大值和不同值的数量。\n\n\
  该包可用于初始数据探索、创建详细文档或编写分析查询，这对于需要特别关注的表的监控很有用。\n\n## dbt_artifacts package\n\n该 dbt\
  \ 包构建数据集市来分析 dbt 组件的执行和用法，例如模型、测试和暴露，最终描述安装该包的 dbt 项目。\n\n## snowflake_spend package\n\
  \n该包由 GitLab 提供，允许你收集和分析 Snowflake 数据库产生的成本。它还提供了构建其使用的仪表板的查询。\n\n在本节中，我们列出了一些你可能有兴趣添加到\
  \ dbt 项目中的有用包。在下一节中，我们将把 dbt_utils 包添加到我们的示例项目中，并使用其宏之一为我们的模型计算哈希值。\n\n## Adding\
  \ the dbt-utils package to our project\n\n我们看到 dbt-utils 包具有许多有用的功能，所以让我们将其添加到我们的项目中，然后使用它来重构我们的代码以生成更好的代理键，取代我们迄今为止使用的简单字段拼接。\n\
  \n另外，预览此模型以确保一切按预期工作。\n\n我们不必部署 STG 模型，因为它们是临时性的，所以让我们更新收集 STG 模型输出数据的快照。\n\n我们没有更改\
  \ STG 模型的模式，所以我们可以直接运行快照，其效果是所有旧行都被带有新哈希码的行替换。\n\n这无论如何也没什么意义，因为我们将用两个不同的键在表中表示同一个实体。继续使用旧历史的解决方案是重命名当前表或快照，以便只有一个使用当前键的活动快照表。然后，你以正确的方式在\
  \ REF 模型中引用这两个表。\n\n就我们而言，由于快照不包含任何珍贵的历史，我们将直接删除快照表，这样运行快照将创建新表，其键基于哈希码。\n\n让我们这样做：\n\
  \n1. 让我们删除旧的快照表：\n\n```\nDROP TABLE\n  PORTFOLIO_TRACKING.SNAPSHOTS.SNSH_ABC_BANK_POSITION;\n\
  DROP TABLE\n  PORTFOLIO_TRACKING.SNAPSHOTS.SNSH_ABC_BANK_SECURITY_INFO;\n```\n\n\
  2. 运行快照以创建新表：\n\n```\ndbt snapshot\n```\n\n我们使用了来自一个包的第一个函数，你已经看到了在哪里可以找到更多包以及如何安装它们。\n\
  \n## Summary\n\n恭喜！在本章中，你了解了 dbt 如何使为你的转换添加一致性变得非常简单。\n\n你现在可以创建自己的宏，甚至更好，使用其他人在包中提供的宏来加快你的开发速度并一致地实现模式和转换。\n\
  \n在下一章中，你将学习如何使你的开发和转换可靠，并借助测试确保数据质量。\n\n测试是 dbt 带来的另一个伟大改进——使测试成为正常、预期的开发周期的一部分，就像我们正常期望现代软件是用强大的测试套件开发的一样。\n\
  \n\n\n\n"
- "## 确保数据可靠性\n\n在上一章中，我们学习了如何确保代码行为一致，以及如何在代码中使用宏和外部库。\n\n在本章中，你将学习如何通过添加测试来验证你的预期并检查转换结果，从而确保数据的可靠性。\n\
  \n最后，你将了解哪些测试在每个层中最有意义，我们将向示例项目中添加许多测试和宏。\n\n本章涵盖以下主题：\n\n- 通过测试提供可靠性\n- 在正确的位置测试正确的内容\n\
  \n## 通过测试提供可靠性\n\n如果你只从本节带走一样东西，那就是：“测试将成为让你安睡的超能力。”\n\n测试确保事情按你期望的方式发展，并在情况并非如此时提醒你。\n\
  \n它们是你的军队，保护你的工作和时间免受数据源损坏和不可避免的代码错误（你自己的和同事的）的邪恶影响。\n\n这就是真正的力量。\n\n缺乏测试，再加上不严谨的开发（因为编写SQL查询的人往往缺乏软件工程背景），使得“救火”成为太多数据团队中最常见的活动；而更改数据管道中某些被大量使用的部分（比如客户或订单）的想法，可能会让整个团队紧张不已。你是否经历过？\n\
  \n我们希望你能摆脱这些噩梦。在前面的章节中，我们提供了关于如何组织代码并使其易于阅读和维护的合理指南。在本节中，我们将向你展示如何在部署的转换关键节点设置守卫，以检查一切是否按预期进行。\n\
  \n我们在*第5章*中介绍了dbt开箱即用的通用测试，并向你展示了如何在YAML文件中使用它们；在本章中，我们将更详细地讨论所有类型的测试及其用法。\n\n##\
  \ 测试类型\n\n每个测试都检查对dbt资源的某个预期是否得到满足。\n\n在dbt中，测试以SQL查询的形式实现，你也可以将它们编写为SQL查询，但大多数时候，你只需在YAML文件中以声明方式将它们应用于dbt资源（模型、源、快照或种子）或其某个列。\n\
  \ndbt测试运行一条SELECT语句，返回不满足你所测试预期的行，因此空结果集表示测试通过，而返回的每一行都表示测试失败。这些失败的行可以自动保存以供你检查。\n\
  \n例如，not-null测试的查询看起来像`SELECT column FROM model WHERE column is null`。你可以看到，如果存在column为null的行，那么这些行会被返回；如果没有null值的行，则查询没有结果行。\n\
  \n在dbt中，你可以用两种方式表达测试：\n\n- 通过编写一个普通的SQL查询来测试你的假设。这被称为**单一测试**，因为它用于单个场景。你通常只会使用少量此类测试来覆盖现有通用测试未覆盖的罕见情况。\n\
  - 通过编写或使用参数化SQL查询并传递所需参数；这被称为**通用测试**，因为原则上你可以用它来测试任何dbt资源。这类测试将成为你的家常便饭，而且你将从包中获得大多数测试，因为通常你会反复测试与其他人在其他项目中测试的相同类型的假设。\n\
  \n在讨论要编写哪种测试之前，让我们先看看编写测试的两种方式。\n\n## 单一测试\n\n这是最简单的测试形式，其测试能力仅受限于你用SQL表达待测试假设的能力。\n\
  \n鉴于我们最终会在大多数dbt资源上测试相似的假设，而且通用测试一旦写好就非常简单易用，那么通用测试成为最常见的测试类型也就不足为奇了。\n\n在大多数情况下，你只需以纯声明方式使用通用测试，将想要应用于资源的通用测试作为列表元素添加到YAML文件中dbt资源的`tests`属性下，就像我们在*第5章*中所做的那样。\n\
  \n## 开箱即用的通用测试\n\n你可能还记得*第5章*，dbt自带以下四种通用测试：\n\n- `not_null`：测试表中某列永不为null。\n- `unique`：测试某列中的值是唯一的。\n\
  - `relationships`：测试两个表之间的参照完整性，即一个表中的每个外键值都存在于指定表的指定列中。换句话说，你测试被测试表中没有*孤儿记录*。\n\
  - `accepted_values`：测试列中的值是否属于列出的值之一。\n\n使用这些基础测试，你已经可以强化项目，并覆盖构建管道时所做的基本假设，例如主键和业务键唯一且不为null，外键没有孤儿记录，以及类别具有预期集合中的值。\n\
  \ndbt提供的通用测试覆盖了最常见的测试需求，并且可以进一步配置以针对特定情况定制——例如，要求`email`这样的列唯一，但仅针对活跃用户；或者认为单个姓名为空的客户不足以阻塞ELT，只应发出警告，而超过10个错误则可能有必要停止管道。\n\
  \n## 应用通用测试\n\n你将使用YAML文件将通用测试应用于模型，就像本书前面我们对源所做的操作一样。\n\n例如，下面是`refined.yml`文件，它对refined层中的`REF_POSITION_ABC_BANK`模型提供了描述和测试：\n\
  \n```yaml\nversion: 2\nmodels:\n  - name: REF_POSITION_ABC_BANK\n    description:\
  \ The positions we have in the ABC Bank portfolio.\n    columns:\n      - name:\
  \ UNREALIZED_PROFIT\n        description: The unrealized profit on the position.\n\
  \        tests:\n          - not_null\n      - name: UNREALIZED_PROFIT_PCT\n   \
  \     description: The unrealized profit % on the position.\n        tests:\n  \
  \        - not_null\n```\n\n上面的代码片段演示了not_null测试在两个不同列上的基本用法。稍后，你将看到如何添加额外配置以更好地定制测试行为，例如让测试返回警告、仅在超过某个阈值时出错，或在特定条件下应用测试。\n\
  \ndbt提供的默认测试在列级别应用，但测试也可以应用于资源级别，无需嵌套在列下。\n\n以下语法用于将`has_default_record`测试应用于`REF_SECURITY_INFO_ABC_BANK`表：\n\
  \n```yaml\nversion: 2\nmodels:\n  - name: REF_SECURITY_INFO_ABC_BANK\n    tests:\n\
  \      - has_default_record\n```\n\n这对于应用于表而非特定列的测试很常见，例如假设的`table_is_not_empty`测试。\n\
  \n## 来自包的通用测试\n\n你可以用开源或私有包提供的许多其他通用测试来补充开箱即用的通用测试，从而用他人甚至你自己编写的通用测试扩展项目。\n\n事实上，在之前关于包的部分，我们提到了两个提供大量测试的包——`dbt_utils`和`dbt_expectations`。\n\
  \n`dbt_utils`包提供了丰富的通用测试选择，补充了dbt Core开箱即用的四个测试，使你能够覆盖常规测试需求，从而很少需要自己编写通用测试，你可能只是为了可读性或配置方便而使用它。\n\
  \n请查看我们在上一节中描述的测试，以及dbt Hub上`dbt_utils`页面中的其余测试：https://hub.getdbt.com/dbt-labs/dbt_utils/。\n\
  \n`dbt_expectations`包极大地扩展了可用的通用测试，并允许你使用与Python的Great Expectations测试套件相同的测试风格向项目添加测试。\n\
  \n为了让您了解可用测试的扩展范围，以下是`dbt_expectations`包0.8.0版本的测试类别列表：表形态、缺失值、唯一值和类型、集合和范围、字符串匹配、聚合函数，以及多列和分布函数。\n\
  \n\n\n\n您可以在 dbt Hub 的 `https://hub.getdbt.com/calogica/dbt_expectations/` 上查看这些定义。每个测试都附有用法示例，您还可以查看测试的源代码。\n\
  \n## 定义通用测试\n\n要定义通用测试，或者覆盖现有的开箱即用测试，您可以编写一个测试 Jinja 块，在 SQL 文件中包含测试的 SQL。\n\n测试块与宏非常相似，因为通用测试曾经是名称以\
  \ `test_` 开头的宏，而且它们的工作方式与宏基本相同——定义一个接受参数并以测试结果形式评估其结果的函数。\n\n通用测试的 SQL 必须编写为返回测试失败的行，使用我们在单一测试中看到的相同逻辑。如果您测试一个等于\
  \ 42 的列，那么您的 SQL 应选择所有列值不为 42 的行。\n\n通用测试使用 YAML 文件应用，并且必须始终至少定义两个参数：`model` 和 `column_name`，这两个参数会自动用于向每次测试调用传递资源引用，以及传递测试在\
  \ YAML 文件中应用的列名称。\n\n您可以在测试定义中添加其他参数，带或不带默认值，就像处理宏一样。然后您可以在 YAML 文件中为这些额外参数传递值，稍后我们开发第一个通用测试时会看到。\n\
  \n从 dbt 1.0.0 版本开始，您可以将通用测试放在两个位置：\n\n- 在 `macro` 文件夹中，您还可以在其中定义宏。这是最初将通用测试定义为宏的遗留方式，当您想在通用测试中使用其他临时宏来定义复杂逻辑时，它会变得很方便。\n\
  - 在 `tests/generic` 文件夹中，与单一测试相邻。这个特殊文件夹是在 dbt 1.0.0 中引入的，允许您将所有测试放在同一文件夹下，通用测试放在\
  \ generic 文件夹中，而单一测试则按您认为合适的方式组织。\n\n我们建议您选择这两个位置之一来组织您的通用测试。\n\n我们将使用 macro 文件夹下的\
  \ tests 子文件夹，以便在需要时可以在测试旁边定义宏，而 tests 文件夹仅用于单一测试。\n\n## 通用测试模式\n\n为通用测试编写的 SQL 使用\
  \ `model` 和 `column_name` 参数来测试您已为其配置测试的资源和列，但您的测试可以使用更多参数。\n\n```\nSELECT * FROM\
  \ validation_errors\n{%- endtest %}\n```\n\n在 no_hash_collisions 通用测试的测试块声明中，我们声明了三个参数，将\
  \ hashed_fields 添加到了必需的 model 和 column_name 参数之外。\n\n我们将 model_data CTE 重命名为 all_tuples，以强调我们获取的是由哈希字段和用于构建哈希的所有字段组成的所有不同元组。\n\
  \n然后我们选择了存在多个字段元组的所有哈希，因为这将是一种冲突情况——由两个不同的值集生成相同的哈希。\n\n- 3. 创建一个 snapshots.yml\
  \ YAML 文件来描述和测试快照：\n\n```\nversion: 2\nsnapshots:\n  - name: SNSH_ABC_BANK_POSITION\n\
  \    columns:\n      - name: POSITION_HKEY\n        tests:\n          - no_hash_collisions:\n\
  \              hashed_fields: ACCOUNT_CODE, SECURITY_CODE\n```\n\nmodel 和 column_name\
  \ 参数由 dbt 自动管理，因此我们无需将它们传递给测试，但我们需要为通用测试中没有默认值的任何其他参数提供值，例如 hashed_fields。我们省略了描述，但描述应该是存在的。\n\
  \n您将参数值作为所声明测试的属性来提供。实际上，这意味着您在测试名称后添加一个冒号（:），然后在下一行，相对于测试名称缩进，写入参数名称、冒号（:）和参数值，就像我们在前一个示例中为\
  \ hashed_fields 参数所做的那样。\n\n参数值可以是 Jinja 表达式，但此时应适当加上引号。\n\n- 4. 在快照上运行测试，看看您闪亮的新测试的实际效果：\n\
  \n```\ndbt test -s SNSH_ABC_BANK_POSITION\n```\n\n通过在测试 Jinja 块中编写一些 SQL，并使用一些关于必需参数名称的约定，我们轻松定义了一个通用测试。\n\
  \n让我们看看如何添加一个支持使用此测试的宏，以便我们可以使用与定义哈希相同的代码来用于测试，而不必提供相同的字段列表，但无需加引号。\n\n如果您查看 STG\
  \ 模型，您会看到为了构建哈希键和哈希差异，我们将字段名称列表传递给 dbt_utils.surrogate_key 宏。通过使用 join 筛选器，很容易生成以逗号分隔的名称列表，所以让我们来做吧：\n\
  \n- 1. 将用于生成字段列表的宏添加到 no_hash_collisions 文件中：\n\n```\n{% macro as_sql_list(hashed_fields_list)\
  \ -%}\n{{ hashed_fields_list|join(', ') }}\n{%- endmacro %}\n```\n\n这个宏很简单；它使用 Jinja\
  \ 的 join 筛选器将字段名按逗号连接起来，但通过快速复用我们用来定义哈希字段的同一列表，它使操作变得简单，使测试编写更快捷并减少错误。\n\n- 2. 在\
  \ snapshots.yml 文件中为 POSITION_HDIFF 字段添加 no_hash_collisions 测试，该测试使用一长串字段：\n\n```\n\
  - name: POSITION_HDIFF\n  tests:\n    - no_hash_collisions:\n        hashed_fields:\
  \ \"{{ as_sql_list(\n          ['ACCOUNT_CODE', 'SECURITY_CODE',\n           'SECURITY_NAME',\
  \ 'EXCHANGE_CODE',\n           'REPORT_DATE', 'QUANTITY', 'COST_BASE',\n       \
  \    'POSITION_VALUE', 'CURRENCY_CODE'\n          ] ) }}\"\n```\n\n您可以看到，在参数定义中，我们通过传递字符串列表，在花括号内调用宏来生成包含所需内容的字符串。如果宏在\
  \ YAML 文件中正确用引号括起来，它会工作得很好。在这种情况下，我们使用双引号，因为我们想对字符串列表使用单引号。\n\n通过这个简单示例，我们向您展示了一些重要过程——定义带有额外参数的通用测试、传递额外参数、添加宏以简化通用测试的使用，以及最终在\
  \ YAML 文件内调用宏来提供值。\n\n## 配置测试\n\n与大多数 dbt 资源一样，对于测试，除了传递参数外，还有一些配置可用于控制测试行为。\n\n\
  您可以在不同的层级上配置测试，最通用的配置优先级最低，最专业的配置优先级最高：\n\n- 在全局配置文件 dbt_project.yml 中，您可以使用 tests:\
  \ 属性配置所有测试，如下例所示：\n\n```\ntests:\n  portfolio_tracking:\n```\n\n前面的代码展示了如何将配置作为属性应用于\
  \ YAML 文件中的通用测试，但它们也可以通过 `config()` 块或通常在主配置文件中应用于任何测试。\n\n以下是对它们的简要描述：\n\n- where:\
  \ 这会将测试限制为满足以字符串形式传入的 where 子句的行。这通常用于将测试限制为活动行（某些列不为空）或某个时间范围内的数据。\n- severity:\
  \ 这将在测试失败时将严重级别设置为 error 或 warn。默认值为 error。\n- error_if 和 warn_if: 这些配置一个 SQL 条件，该条件可以与失败次数进行比较以微调严重级别，允许您应用阈值来产生错误或警告。两个配置的默认值都是\
  \ != 0。\n- fail_calc: 这配置应用于测试查询以报告错误的聚合函数。默认值为 count(*)，即测试失败的行数。\n- limit: 这配置测试返回失败行的最大数量。通常不设置，仅在将错误存储到大表中时有用。\n\
  - store_failures: 这是一个用于启用或禁用存储测试失败行的配置。默认值为 false，表示不存储失败行。\n\n这些配置会从 severity\
  \ 和 error_if 条件开始检查，以评估是否必须引发错误；如果未触发错误，则检查 warn_if 条件。\n\n例如，您可以使用 sum(n_records)\
  \ 查看具有重复项的总行数，或使用 max(n_records) 查看找到的最大重复数。您需要充分了解测试 SQL 代码，才能应用正确的聚合表达式。\n\n当配置为存储测试失败时，dbt\
  \ 会将测试查询的结果（即失败行）保存到 schema 中与测试同名的表中，并带有默认的 dbt_test__audit 后缀。这使您可以轻松分析失败行。\n\n\
  除了这里提到的测试特定配置外，还可以将其他通用配置应用于测试，例如 enabled、tags 和 meta，以及 database、schema 和表别名，以配置失败存储的位置。\n\
  \n## 在正确的位置测试正确的内容\n\n在前面的章节中，我们看到了在 dbt 中添加测试是多么容易；大多数时候，您只需在 YAML 文件的表或列下添加一个\
  \ tests: 属性，并包含几个测试名称。\n\n添加测试如此简单，以至于很容易过度，开始测试所有内容和所有地方，但请克制不要这样做，并记住测试也是代码，因此它们也会带来相应的错误（错误地应用或配置来自库的通用测试，以及编码\n\
  \n我们自己单元测试中的错误）、维护（误报、没有业务价值、可以忽略的错误，以及不断的测试重构），以及后果（因为持续的测试失败疲劳而忽略重要测试）。\n\n测试的执行也需要时间和金钱，所以等待无用的测试完成完全是浪费金钱，也浪费开发者在自己的开发环境中运行测试时的时间。这也不是特别有趣，所以找到一个好的平衡点会很棒。\n\
  \n真正的问题于是变成了：*我们测试什么？*以及*我们在哪里进行测试才能让我们的时间和金钱获得最大的价值？*\n\n让我们先从 dbt 测试一个意想不到的特殊用例开始——数据探索。\n\
  \n在源数据上编写 dbt 测试非常简单快捷，以至于它常常是熟悉一些你还不够了解的新数据的最佳方式。在这种情况下，你可以使用 dbt 测试来探索你的预期并更好地理解数据。\n\
  \n一个常见的场景是尝试不同的潜在主键和业务键，以验证它们是否唯一，以及它们的列是否始终非空。其他常见场景包括：验证从事实表到维度表的关系没有孤儿数据（或者维度表是完整的）、验证类别和度量是否存在及其比例。\n\
  \n当然，进行此类探索的理想方式之一是使用 `dbt_profiler` 包，但如果你没有安装它，使用测试是一种快速且常见的方式，用于检查你最初的预期，并与团队其他成员分享你的发现。\n\
  \n## 我们测试什么？\n\n一旦这阵为了更好地理解数据而进行的初步测试热潮过去，我们就必须专注于在我们的项目中保留真正重要的测试。下一节将讨论这个问题。\n\
  \n我们必须始终从驱动价值的事物开始，进而思考哪些问题会最大程度地损害价值，或足以造成影响。\n\n让我们来看看模型中能发现的主要数据类别：\n\n- **主键（PK）**和**业务键（BK）**：正确的\
  \ PK/BK 对于识别实体和存储其变更历史至关重要。它们使我们能够连接事实表和维度表，而 BK 则是跨不同系统识别同一实体的关键。\n\n    虽然不可变事实在缺少\
  \ PK/BK 时可能没问题，但对于我们可能要在平台上使用的所有其他实体来说，键是必不可少的：可变事实、维度、参考表、映射表和配置。\n\n- **外键（FK）**：FK\
  \ 是关系系统的核心要素，因为它们通过指向另一张表中补全信息的 PK/BK 来存储表与实体之间的关系。在多对多关系的情况下，每一侧的 FK 存储在定义该关系的映射表中，而不是直接存储在表内。\n\
  \n    FK 最常见的场景是事实表拥有与维度表建立关系的 FK。在这种情况下，如果关系是强制的，我们需要确保事实表中的 FK 没有 NULL 值。无论如何，我们还希望事实表中的每个\
  \ FK 都能在维度表中找到对应的 PK。\n\n    同样非常常见且重要的是，正确表示维度之间的关系以创建层级结构，比如城市位于国家内、国家位于地区内、地区位于大洲内；以及表示业务流程的事实之间的关系，例如与销售订单行关联的发票行或退货行。\n\
  \n    贯穿正确识别 PK 和 FK 的一个核心主题是正确理解关系的多重性。\n\n- **业务规则（BR）**：业务规则形式多样，是为我们的数据平台带来大部分价值的“调味料”。要完整列出\
  \ BR 类型是不可能的，因为它们可以从计算到实体连接方式再到数据格式化方式，包罗万象。\n\n    无论它们是哪种类型，如果我们想正确表达业务，就必须把它们做对。\n\
  \n- **度量**：度量是可用于计算的数值型数据。有些度量极其重要，因为计算需要用到它们，缺少它们会使数据几乎毫无用处，比如没有销售金额的销售订单。\n\n\
  - **类别**：类别是非纯描述性的文本数据，例如名称或任意自由文本，但它们用于分组或以某种方式组织数据，比如产品类型、客户所在行业，或者用户用来切片报表的任何值，但它不是一个完整的维度。\n\
  \n- **描述性数据**：其他几乎所有数据都可以归入描述性数据类别，其中包含名称、自由文本，以及一般意义上所有不属于其他类别类型的文本数据。\n\n观察这些数据类别，很明显，其中一些如果弄错了会引发许多问题，而另一些可能只算是小小的麻烦：\n\
  \n- PK 和 BK 至关重要，我们必须尽一切可能把它们做对；否则，我们将无法正确地连接数据或存储变更历史，并且很可能会产生重复数据。\n\n    简而言之，如果\
  \ PK/BK 出错，我们的数据模型就绝无可能正常工作；因此，我们必须测试我们选作 PK/BK 的键是否是一个好键。\n\n- 同样重要程度的是，正确理解由 FK\
  \ 所标识的关系的多重性（包括可选或强制状态）。我们必须测试我们使用的强制关系的 FK 是否存在（非空）；否则，我们的数据模型将无法按预期工作。\n\n- 谈到\
  \ BR 时，测试我们是否拥有计算它们所需的全部要素也非常重要，如果可能的话，还要测试我们的计算是否正确。最后这一点需要业务用户提供带有预期结果的可用于测试的用例。\n\
  \n- 对于度量、类别或描述性数据等优先级较低的数据类别，其重要性应逐案评估。\n\n销售负责人、销售团队或客户名称在某些情境下可能是次要的，而在其他情境下则可能是关键的。\n\
  \n在考虑为这些数据类别添加测试时，你需要权衡利弊。\n\n现在我们对测试什么有了清晰的认识，接下来让我们分析在哪里进行测试最好。\n\n## 在哪里测试什么？\n\
  \n关于在哪里进行测试，总的想法很简单：我们越早发现问题越好，所以只要测试可行，我们就应该尽快进行测试。\n\n你还希望测试你要交付的内容，以确保尽管你做了所有中间转换，结果仍然符合你预期的数据模型。\n\
  \n黄金法则是：\n\n- 在源数据上或尽可能早地测试你对输入的预期\n\n- 在交付输出时测试你对输出的预期\n\n- 在 ELT 管道的中间转换中，测试那些可能引发大量问题、或者你并不完全信任其总能按计划工作的关键内容，例如\
  \ BR 或复杂的连接\n\n在接下来的章节中，让我们讨论我们数据平台每一层的典型测试。\n\n## 源数据测试（输入层）\n\n这是数据的入口点，你尚未触碰过这些数据，因此你只能测试那些不需要对传入数据做任何更改的假设。\n\
  \n在这里，你有一些最重要的测试：\n\n- 测试 PK 和 BK 非空且唯一。这是最高优先级，确保你正确理解并存储实体。\n\n如果你的源数据具有完整历史，甚至只是包含多个版本的部分历史，你必须将唯一性测试移到另一层，通常是\
  \ STG 层（你可以在该层进行过滤，只保留要存储的最新版本）。\n\n\n\n\n你可以通过测试 PK 以及更新时间戳的唯一性，但这更多是为了探索你的输入数据模型，而不是为了确保数据质量的一致性。\n\
  \n请记住，对于一个不可变事实来说，没有 PK/BK 也是可以的。\n\n- 测试 FK，以检查强制的一对多关系是否不为空。这是高优先级，确保 FK 存在且符合预期。关系是强制性的，意味着它必须始终存在；因此，FK\
  \ 必须不为空。\n\n- 测试关系，以检查它们是否没有孤立的 FK。这是低优先级。知道关系是完整的很好，但你只能使用输入数据提供的东西。\n\n  知道事实中存在孤儿（维度或查找表对于事实的一个或多个\
  \ FK 没有 PK）可能是给运营人员的一个良好输入，让他们知道问题所在，特别是如果他们可以添加缺失的主键，并且否则确保你自己管理孤儿，但它不会提供结构信息，你必须接受你所拥有的数据。\n\
  \n- 我们依赖的类别和度量是中到低优先级，这意味着你必须确保拥有重要的数据片段，但并非所有内容都是必要的。\n\n  例如，如果你没有销售额，就很难报告销售情况；如果某些客户没有国家代码，就很难按国家拆分数据。你必须根据最终可用的替代方案以及测试失败时可以采取的行动来决定其重要性。\n\
  \n- 测试源数据的新鲜度。这是高优先级。你必须确保数据与预期一样新鲜。\n\n  利用 dbt 的功能，为每个源表输入期望的新鲜度阈值并自动运行测试，从而生成易于阅读的报告。\n\
  \n## 存储层上的测试 – STG 和 HIST 模型\n\n在这里，我们以我们想要存储的基本可用格式过滤和转换数据，并且我们可以测试所有我们感兴趣的内容，但无法直接在源数据上测试。\n\
  \n这是数据质量最重要的层，因为在这里我们将数据放入其可被使用且存储其历史的正确形状。你必须确保你所存储的内容：\n\n- 测试 PK 和 BK（在源上无法测试）是否不为空且唯一。这是最高优先级。你需要确保键是有效的键，因为你将依赖它们。\n\
  \n  在大多数现实案例中，即使你的源包含多个版本，在每次运行中仅将最新版本添加到历史中也是可以的，在 STG 模型中过滤数据以存储在 HIST 模型中的版本。\n\
  \n  在此阶段，你必须测试 STG 模型输出的 PK/BK 是否唯一，并且在 HIST 模型中，PK/BK 与 LOAD_TS 的组合也唯一，因为我们希望在每次运行中存储一次变更。\n\
  \n- 测试 HKEY 和 HDIFF 是否没有哈希冲突（在 HIST 模型中）。\n\n  这是低优先级。冲突风险很小，特别是如果你没有数十亿行。\n\n \
  \ 哈希冲突风险随着表中哈希数量的增加而增加；因此，有意义在 HIST 模型中检查哈希，因为它包含一个实体的所有哈希。风险始终非常小，一次冲突最终只会影响一行数据，但不测试它是不负责任的。\n\
  \n  当表有数十亿行时，测试开始更有用但也更慢，因此可能有意义以更低的频率运行哈希冲突测试。\n\n- 创建所有你在源层本应执行但因需要数据转换而不可行的测试。\n\
  \n  某些输入数据在按预期工作之前需要清理或转换的情况很常见。常见示例是日期和时间戳从文本解析而来（你希望确保可以从其文本格式解析它们，然后再测试它们所期望的内容），或文本字段通过删除多余空格或无意义的零进行规范化，或更改为大写或小写。\n\
  \n## 精炼层上的测试\n\n这是依赖于存储数据正确性的业务规则层。\n\n在此层，我们应假设来自存储层的数据是可靠的，我们只需在可能通过转换引入错误的地方进行测试：\n\
  \n- 测试计算值的 BR 结果。这是高优先级。我们必须确保我们有结果并且它是正确的。\n\n  最低期望是你检查计算值是否产生结果而不是空值（除非该值是可选的），并且如果有控制数据，则测试结果是否正确。BR\
  \ 的正确性通常使用针对知名测试用例的单项测试进行验证。\n\n- 在执行 BR 的有风险或复杂的连接后测试 PK/FK。\n\n  这是最高优先级。确保数据符合\
  \ BR 的数据模型。\n\n  另一大类 BR 是丰富，其中你连接表以引入度量或描述值。我们在上一要点中处理了值的获取及其在计算中的使用。\n\n  请注意，获得结果表的正确基数极其重要，你应测试实现\
  \ BR 的连接链不会产生重复或遗漏数据。\n\n## 投递层上的测试\n\n投递层使数据可供我们的消费者、我们的“客户”使用。\n\n我们需要测试我们交付的内容是否符合我们的数据模型和行业标准：\n\
  \n- **测试维度是否格式良好：** 测试 PK 或 BK 是否唯一且不为空，并且只有一个且仅有一个默认记录。\n- **测试事实是否格式良好：** 测试 PK（如果存在）是否唯一且不为空，事实到维度的\
  \ FK 不为空（具有业务值或如果关系是可选的则为默认值），并且没有孤儿（事实的 FK 存在于维度的 PK 中，最终作为默认记录）。\n- **测试事实和维度中的值：**\
  \ 测试强制类别和度量不为空，并且类别具有预期值集合中的值。\n- **测试众所周知的预期输出是否正确生成：** 使用一组众所周知的案例，检查计算值是否与预期值匹配。这可以通过单项测试轻松实现。\n\
  - **运行统计、定量测试以确保数据流动且在合理范围内：** 我们知道一定数量的事件或值应该流动。测试我们在特定时间范围内事件数量或度量值的范围内，最终基于过去的数据，同时考虑季节性。例如，我们每周/每月应有合理数量的订单，订单总额应在合理范围内。\n\
  \n这类测试补充了源新鲜度测试，增加了对数据数量的控制并确保其值合理。\n\n## 测试我们的模型以确保良好质量\n\n回顾我们的项目，我们在为 ABC_BANK_POSITION\
  \ 源添加测试方面做得相当好，因为我们正在检查我们关心的列是否不为空。\n\n我们投入的精力较少来为其他层添加测试，因为我们专注于构建模型本身；在这一节中，我们将遍历示例的各层并添加一些重要测试，以确保我们的应用程序按预期工作。\n\
  \n### 测试复合键的唯一性\n\n在 ABC_BANK_POSITION 源中，我们正在检查 SYMBOL 列是否唯一。然而，这真的正确吗？\n\n嗯，如果我们只考虑一个人的单个投资组合，则是的，但如果我们考虑一个人可能在同一家银行拥有多个账户，那么我们可能应该承认这太严格了。\n\
  \n当我们查看 STG 层时，我们可以看到 POSITION_HKEY 由两个字段 ACCOUNT_CODE 和 SECURITY_CODE 定义，所以我们有一个复合键，这是常见情况。\n\
  \n由于这也看起来更符合现实要求，让我们看看如何在源上测试此复合键。\n\n建议的解决方案是使用分隔符创建它们的连接列（以避免‘ab’||‘c’等于‘a’||‘bc’并且也等于\
  \ ‘’||‘abc’ 或 ‘abc’||‘’），并对其进行测试，但我们无法更改源，因此此解决方案不可行。\n\n我们可以将测试移至下一层，在那里我们已经将 POSITION_HKEY\
  \ 列定义为这些列的组合，外加哈希。这可行，但如果我们可以在源上测试，那更好，这样我们就知道问题不在我们的代码中，而在我们的假设与传入数据不一致。\n\n为了将测试保留在源层，我们有两个替代方案——在源\
  \ YAML 文件中创建列的匿名连接，或使用 dbt_utils 包中的 unique_combination_of_columns 测试。\n\n第一个方法很直接但可能存在性能问题，而第二个是应用于表的测试，并且是高效的解决方案。\n\
  \n让我们看看这两种方法，然后你可以决定你更喜欢哪一种。打开 source_abc_bank 文件并为 ABC_BANK_POSITION 表添加以下代码：\n\
  \n```\n- name: ABC_BANK_POSITION\n  tests:\n    - dbt_utils.unique_combination_of_columns:\n\
  \        combination_of_columns:\n          - ACCOUNTID\n          - SYMBOL\n  columns:\n\
  \    - name: CONCAT_WS('-', ACCOUNTID, SYMBOL)\n      tests:\n        - not_null\n\
  \        - unique\n    - name: SYMBOL\n      tests:\n        - not_null\n```\n\n\
  \n在前面的代码中，我们完成了以下操作：\n\n- 在表名和 `unique_combination_of_columns` 测试下添加了 `test:` 属性，并将我们想要的两列（ACCOUNTID\
  \ 和 SYMBOL）作为 YAML 列表传入。\n\n- 添加了一个伪列，用有效的 SQL 表达式代替列名。\n\n这种方式始终有效，通过使用 `CONCAT_WS`\
  \ 函数，你可以使用分隔符连接任意数量的列。如你所见，它的优点是快速且易于阅读，并将测试放在与其他列测试相同的位置。只需注意，这种连接并非严格必要，而且在处理大表时可能会增加大量开销。表级测试只是对要测试的列做一个\
  \ `group` by，这是最低要求且速度很快。它还将测试直接放在表下，使其更加醒目，避免将主键测试与其他列的测试混在一起。\n\n- 从 SYMBOL 列移除了\
  \ `unique` 测试。\n\n总而言之，我们可以说，在处理小表时使用 `CONCAT_WS` 函数没有问题，而在处理大表（1 亿行以上）时，则应使用 `dbt_utils`\
  \ 包中的测试。只有当我们需要编辑或提取相关列，或对源进行过滤时，才应考虑将这类重要测试移到下一层。\n\n## 测试 CSV 种子数据\n\n我们的第二个输入是一个作为\
  \ `seed` 加载的 CSV 文件。\n\n在这种情况下，我们可以在三个位置进行测试：\n\n- **在 CSV 种子上：** 如果测试的需求或重要性与被测试源是\
  \ CSV 文件有关，我们会把测试放在这里。例如，解析日期或数字，或者在我们的场景中，正确应用 post-hook 查询。\n\n- **在种子源表上：** 如果测试的重要性与输入类型无关，我们会把测试放在这里。换句话说，它与数据的语义有关。\n\
  \n- 和往常一样，我们可以将测试传递到 STG 模型中，但如果可能的话，我们更倾向于尽早测试。\n\n为了展示这两种方式，让我们在种子上为 `LOAD_TS`\
  \ 列添加一个 `not null` 测试，并在我们定义为读取 CSV 的源上添加我们认为合适的其他测试。\n\n让我们从种子开始：\n\n1. 在 `seeds`\
  \ 文件夹下创建一个 `seeds.yml` 文件\n\n2. 添加以下代码：\n\n```\nversion: 2\nseeds:\ntests:\n  -\
  \ not_null\n  - not_empty\n```\n\n在前面的代码中，我们完成了以下操作：\n\n- 测试了 SECURITY_CODE 列是唯一且非空的，隐式地将其定义为业务键\n\
  - 测试了 SECURITY_NAME 列非空且非空字符串；我们以后会经常使用证券名称，不能接受它为空\n\n我们把这个留作练习：如果你认为有必要，可以为 ABC_Bank_SECURITY_INFO\
  \ 表的其他列添加更多的 not_null 和/或 not_empty 测试。\n\n## 添加测试以避免回归\n\n看看我们的 STG 层，剩下的测试不多了，因为我们已经设法在源和种子上完成了重要测试（唯一性和必填的非空字段）。\n\
  \n只有一个字段需要转换，那就是报告日期，它之前以两位数字存储在 CSV 文件中，并被加载为 1 世纪的日期。\n\n我们决定保持加载不变（得到一个日期），然后在\
  \ STG 模型中通过创建宏来“修复”该日期。我们也可以更改加载方式，从 CSV 中加载字符串，并在 STG 模型中将其正确解析为两位数的年份。\n\n两种方法都可行，而且我们无法排除日后有人不喜欢我们的解决方案，从而修改加载或找到其他方式，包括从不同的源获取数据。现在，为了提高加载质量并增强信任，我们可以设置一个测试，避免回退到我们已经解决过的问题。\n\
  \n让我们添加一个测试来检查 REPORT_DATE 列属于 21 世纪：\n\n1. 在 models/staging 文件夹中创建一个 staging.yml\
  \ 文件。\n2. 向文件中添加以下代码：\n\n```\nversion: 2\nmodels:\n  - name: STG_ABC_BANK_POSITION\n\
  \    tests:\n      - dbt_utils.expression_is_true:\n          expression: \" YEAR(REPORT_DATE)\
  \ >= 2000 \"\n```\n\n我们将使用 `dbt_utils` 包中的 expression_is_true 测试来表达表级条件：REPORT_DATE\
  \ 列的年大于 2000，或者任何对你合适的值（如果你的数据更旧，也许是 1970 或 1900）。\n\n这是对宏进行单元测试的一种非常简单有效的方法，但这只是其中一种方式，根据要执行的测试，可以使用这种模式的许多变体。\n\
  \n你可以通过多种方式提供输入数据，像我们这样使用简单的 SELECT 和 UNION ALL；但如果你打算提供更多数据，你可能会想改用 SELECT FROM\
  \ VALUES SQL 子句，甚至将数据放在一个正式的表中，既可以是 CSV 种子加载，也可以作为提供给您的源并在测试中访问。\n\n在某些情况下，只需验证结果满足某个规则即可，而不必为每个输入值表达预期结果，因此你可能不需要预期的数据，因为它将被按给定规则进行的计算所取代。\n\
  \n在其他情况下，预期数据可能不绑定到单个行，而是会有一个预期的结果集。在这种情况下，你会得到两个表，一个用于输入数据，一个用于预期数据，你可以使用 MINUS（等同于\
  \ EXCEPT）集合运算符：\n\n```\nSELECT results\nMINUS\nSELECT expectations\nUNION\nSELECT\
  \ expectations\nMINUS\nSELECT results\n```\n\n前面查询的第一部分验证 results 中的所有行都是预期表中的预期行，而第二部分验证预期表中只有预期行出现在\
  \ results 中。这两部分合起来验证结果与预期产生相同的行。\n\n在介绍通用测试时，我们已经在 HIST 模型上应用了 no_hash_collisions\
  \ 测试，因此不需要再对它们进行更多测试。\n\n## 避免事实表中的孤儿键\n\n转到 refined 层，我们已经有了几个测试来确保我们计算的值（业务规则）不为空。\n\
  \n我们的两个 REF 模型也非常简单，不做任何连接，因此剩下的唯一有意义的测试是：确保 position 事实表与 security 维度表之间的关系是正确构建的，且事实表中没有孤儿记录。\n\
  \n让我们使用 dbt 提供的 relationship 测试来确保这一点：\n\n1. 打开 refined 文件夹中的 refined.yml 文件。\n\
  2. 添加以下代码：\n\n```\n- name: REF_POSITION_ABC_BANK\n  columns:\n    ...\n    - name:\
  \ SECURITY_CODE\n      description: The code of the security in the position.\n\
  \      tests:\n        - relationships:\n            to: ref('REF_ABC_BANK_SECURITY_INFO')\n\
  \            field: SECURITY_CODE\n```\n\n我们已经为事实表的 SECURITY_CODE 列添加了一个 relationships\
  \ 测试。\n\n该测试声明事实表中的这一列是与 security 维度表关系的的外键，其中 SECURITY_CODE 字段是主键。\n\n测试通过，所以我们可以继续前进，并因知道我们没有孤儿记录而感到安心，即使我们知道自己迟早会遇到一些孤儿记录，届时需要管理它们。我们会在讨论重构模型时处理这个问题。\n\
  \n测试我们期望的模型之间的关系是否按预期工作，对于保证我们的数据模型持续适用极其重要。\n\n另外需要注意的是，通常我们在 refined 层有一个关系型数据模型（在\
  \ REF 模型之间），它试图广泛表示现实世界和我们领域内的流程，但我们为创建的每个数据集市都有一个 Kimball（或星型模式）模型。它们相关但不相等。我们应该在哪里测试这些关系？\n\
  \n黄金法则是：尽快测试！因此，我们应该在 REF 层测试属于 REF 层数据模型的关系，然后在数据集市层测试仅为该数据集市创建的关系。\n\n## 测试交付层\n\
  \n看看我们交付层的模型，可以看到它们都是非常简单的 `SELECT * FROM aRefModel` 类型，因此我们只需确保主键有效，并且维度表有一个默认键。\n\
  \n让我们从主键开始：\n\n1. 在数据集市文件夹中创建 _portfolio.yml 文件。\n\n2. 向文件中添加以下代码：\n\n```\nversion:\
  \ 2\nmodels:\n  - name: FACT_POSITION\n```\n\n\n\n\n```\ntests:\n  - dbt_utils.unique_combination_of_columns:\n\
  \      combination_of_columns:\n        - ACCOUNT_CODE\n        - SECURITY_CODE\n\
  \  - name: DIM_SECURITY\n    columns:\n      - name: SECURITY_CODE\n        tests:\n\
  \          - not_null\n          - unique\n```\n\n在上面这段代码中，我们测试了两个模型的主键。我们提醒你，使用\
  \ `unique_combination_of_columns` 宏测试的两列并不会检查它们是否为空，因此你应该添加必需的列级测试。\n\n为了能够测试维度具有默认记录且只有一个默认记录键，我们需要创建相关的通用测试，那么让我们开始吧。\n\
  \n3. 在 `macros/tests` 文件夹中创建一个 `has_default_key.sql` 文件，并添加以下代码：\n\n```\n{% test\
  \ has_default_key ( model, column_name\n, default_key_value = '-1'\n, record_source_field_name\
  \ = 'RECORD_SOURCE'\n, default_key_record_source = 'System.DefaultKey'\n) -%}\n\
  {{ config(severity = 'error') }}\nWITH\ndefault_key_rows as (\n    SELECT distinct\
  \ {{column_name}},\n        {{record_source_field_name}}\n    FROM {{ model }}\n\
  \    WHERE {{column_name}} = '{{default_key_value}}'\n    and {{record_source_field_name}}\
  \ = '{{default_key_record_source}}'\n),\nvalidation_errors as (\n    SELECT '{{default_key_value}}'\
  \ as {{column_name}},\n'{{default_key_record_source}}' as {{record_source_field_name}}\n\
  \    EXCEPT\n    SELECT {{column_name}}, {{record_source_field_name}}\n    FROM\
  \ default_key_rows\n)\nSELECT * FROM validation_errors\n{%- endtest %}\n```\n\n\
  此测试验证存在一行具有正确的值和记录来源。\n\n4. 在 `macros/tests` 文件夹中创建一个 `warn_on_multiple_default_key.sql`\
  \ 文件，并添加以下代码：\n\n```\n{% test warn_on_multiple_default_key ( model, column_name\n\
  , default_key_value = '-1'\n, record_source_field_name = 'RECORD_SOURCE'\n, default_key_record_source\
  \ = 'System.DefaultKey'\n) -%}\n{{ config(severity = 'warn') }}\nWITH\nvalidation_errors\
  \ as (\n    SELECT distinct {{column_name}},\n        {{record_source_field_name}}\n\
  \    FROM {{ model }}\n    WHERE {{column_name}} != '{{default_key_value}}'\n  \
  \  and {{record_source_field_name}} = '{{default_key_record_source}}'\n)\nSELECT\
  \ * FROM validation_errors\n{%- endtest %}\n```\n\n此测试在存在具有默认记录记录来源的行、但其键不是默认记录预期键时，会引发警告。如果你想要区分事实表中没有外键的不同原因，这可能是一个有效的情况，例如：数据缺失（-1）、未来/尚无数据（-2）、错误/不正确的值（-3）以及有意留空/不适用（-4）。如果是这种情况，我们建议一旦你确认多个键是有意为之，就移除该测试。\n\
  \n5. 让我们通过编辑 `_portfolio.yml` 文件来应用这两个测试。\n\n在维度的主键（`SECURITY_CODE`）下添加这两个测试：\n\n\
  ```\n- name: DIM_SECURITY\n  columns:\n    - name: SECURITY_CODE\n      tests:\n\
  \        - not_null\n        - unique\n        - has_default_key\n        - warn_on_multiple_default_key\n\
  ```\n\n现在我们已经定义了两个测试，`has_default_key` 和 `warn_on_multiple_default_key`，你可以看到测试每个维度是多么容易。\n\
  \n我们已经遍历了示例项目的各层，并添加了我们认为有用的测试，最终创建了所需的通用测试宏。\n\n## 总结\n\n在本章中，你看到了多种方法来测试传入和结果数据是否符合你的预期、如何添加更多测试，以及如何对宏或你自己的代码进行单元测试。\n\
  \n我们讨论了在项目中的哪一层应用哪些测试，并在示例项目中应用了这些测试。\n\n在下一章中，你将学习如何使用 dbt 更好地作为团队一员工作，并自动化平台的部署和执行。\n"
- "## 敏捷开发\n\n在上一章中，我们完成了使用 dbt 编码的基础知识，解释了如何编写宏和测试，并完成了目标架构的 MVP。\n\n在本章中，你将学习通过结合哲学与实践提示来进行敏捷开发，了解如何在项目各阶段保持待办事项敏捷，并深入探讨构建数据集市。\n\
  \n在本章中，你将了解以下主题：\n\n- 敏捷开发与协作\n- 将敏捷应用于数据工程\n- 以敏捷方式构建报表\n\n### 技术要求\n\n只要你知道 dbt\
  \ 的基础知识，即使不阅读前面的章节，也能阅读并理解本章。\n\n本章没有代码示例。\n\n### 敏捷开发与协作\n\n在本章中，我们将涉及开发周期中可能最重要的部分，即对项目成功和交付时间贡献最大的部分——让你的团队富有生产力，并渴望通过互相帮助作为团队在项目上工作。\n\
  \n凭借二十多年在不同国家、公司、行业和职能领域工作的经验，我可以说开发人员热爱他们的工作，他们讨厌无所事事，甚至更讨厌愚蠢、毫无意义的事情。\n\n你可以放心，只要你的开发人员清楚要构建什么，并有足够小的增量目标去实现，他们就会构建你的项目，因为这正是带给他们满足感的东西。\n\
  \n事情并不是这样运作的。构建软件和创建数据平台在很大程度上是以有组织的方式编写新代码。这是一个创造性过程，不同的能力、经验和观点都很重要。它更接近于在已知行业中发明新产品的过程。\n\
  \n在构建数据平台的过程中，公司和需求可能会发生变化；数据平台基础的数据和流程会随世界不断变化，并非一成不变。在写下第一行代码之后，甚至在首次发布之前，为跟上不断变化的需求而进行演进就是开发的一部分。\n\
  \n我建议你还阅读敏捷宣言背后的12条原则，可在 https://agilemanifesto.org/principles.html 获取。\n\n它们提供了关于敏捷工作的宝贵且常青的洞见，这些原则中的大多数已成为敏捷团队的基石，例如其中一条说：“可工作的软件是衡量进度的首要标准”。可工作的软件正是你想要的；其他一切只有在多大程度上让你更接近拥有（并保持）可工作的软件时才有用。\n\
  \n### 将敏捷应用于数据工程\n\n审视敏捷宣言的四条声明，关键信息是人员、结果和遵循现实世界的关注比计划和文件更重要。这并不意味着其他要素本身不好，只是它们不是最重要的，它们的重要性在于对其他要素的贡献。\n\
  \n以下是一些适用于数据工程领域的总体考虑：\n\n- 敏捷不是即兴发挥。拥有计划很重要，同时要理解任何计划都不是一成不变的，它会不断变化。计划的意义在于跟踪我们所处的位置、当前期望目标以及我们在领域周边积累的知识。快速失败对于尽早了解此路不通很重要。\n\
  - 与了解领域（即业务）的人以及了解技术的人合作选定方向。持续交付并验证中间结果，在每一步只需进行小幅方向调整。你走得越远，方向变化越小，目标越清晰。当遇到失败时，尽快将所学纳入计划，并按需调整方向。\n\
  - 前一点的一个重要推论是，在推进过程中不断完善你的目标细节。这是一个迭代过程。你从一个明确的范围和一个总体目标开始，可能对可用数据知之甚少。通过努力并交付初步成果，你最终会明确你想要什么和不想要什么。你也会更好地理解数据中有哪些内容，哪些没有。不断与业务方讨论他们想要什么，并相应调整他们的期望/你的项目。保持信息流通和想法灵活。\n\
  \n\n\n\n- 一个总体目标是让你的计划尽可能灵活，在负责的最后时刻做出决策（尤其是那些难以改变的决策），以便能够尽可能多地利用知识和经验来做出决策。这并不意味着永远拖延；它意味着如果你可以等待，就应该避免过早地固化决策，也不要仅仅因为计划而坚持用一种方式做事。如果你有更好的想法，就采用它。\n\
  - 在开始时验证最大的问题，这样随着前进，方向发生重大变化的风险就会降低。例如，检查你是否能够处理一些不可或缺的关键数据，是否能够读取某种格式或访问某个系统，或者处理预期数据量所需的时间是否合理。\n\
  - 尝试将工作分解为小块工作增量，通常称为 **故事**，这些增量可以在几乎不会被迫停止的风险下完成。在开始一个故事的工作之前，将其拆分为可以在1天或更短时间内完成的小任务。请注意，在设定时间段内计划完成的一组工作增量，即\
  \ **开发迭代**，通常被称为 **产品增量**。\n- 不要试图“煮沸大海”（做不可能的事）或迷失在太多不同的事情中。尝试让团队专注于当下最重要的话题，以便他们能够协作解决问题。以协作方式每周完成一个可工作的软件片段，好过一个月完成五六件但各自为政的工作。质量会更好，团队会更开心，知识会分布在许多头脑中，而不仅仅是一个人。\n\
  - *先完成，再开始* – 在开始更多工作之前，专注于收尾未完成的工作。太多悬而未决的事情会给人们带来巨大的精神消耗，项目失去动力，变得无法集中注意力，而且如果只有很少的工作完成，就很难了解取得了多少进展。\n\
  - 敏捷不仅关乎灵活性，还关乎避免浪费，移除过时、价值不大或价值不确定的东西。这适用于所有方面，从代码到文档再到规划。\n\n如果让我用一句话总结敏捷概念，我会说敏捷就是：让一个最初模糊但不断清晰的全景图保持最新，做一些工作来产生预期的结果，并照亮进一步明确全景图以及你接下来要做什么的道路。\n\
  \n## 以敏捷方式启动项目\n\n我们已经说过，开始时必须充分理解项目的范围以及你想要实现的主要目标，但这只是意味着你从总体上知道你想要什么，而不是知道所有实现细节。\n\
  \n在这个阶段，知道你不要什么和知道你要什么同样重要。你应该首先建立对项目范围的充分理解。\n\n选择正确的范围并组建一个团队，先找到正确的方向，再找到实现目标的途径（业务需求和技术能力），这是本阶段最重要的事情。\n\
  \n让团队形成一个业务和技术都认同的初步高层计划，并确定起点以及你不确定、可能使计划偏离轨道或大幅改变其形态的重大问题。这些就是你要面对的高风险。先厘清它们。\n\
  \n为每个风险创建一个故事，以验证你能否按计划的方式或某种替代方式完成计划的事情。你不需要开发最终交付物，只需具体验证你计划要做的事情是否可行以及如何实现。这有时被称为做\
  \ **概念验证（POC）**。\n\n在这个初步构思/定向阶段之后，你会对自己所处的位置和想要实现的目标有更清晰的了解，并且随着主要风险的澄清，你应该能够有足够的信心选择一个好的方向开始实际工作。\n\
  \n这个初始阶段应该很短——对于普通项目，理想情况下只有一个冲刺（sprint），如果你在做全新的事情并且需要制作大量POC，最多也就几个冲刺。\n\n用一个假期来类比：你首先要决定是想去西班牙享受海滩时光、去法国逛城堡、去波兰徒步旅行，还是去芬兰钓鱼。还应该明确谁负责目的地、预算和运营决策。\n\
  \n对你想要进行的活动有所了解也很有用，因为它会影响行装和交通需求。品尝葡萄酒时你不需要渔具。一旦你知道了目的地，你就需要知道如何到达那里以及如何四处走动，尤其是如果你计划进行很多活动。如果你不确定，你可能想查看是否有飞机和火车，核实乘车的价格、时间和费用，或者住宿的可用性和价格，这样如果需要改成露营，你在打包之前就知道了。\n\
  \n在这个初始阶段，你创建了一个初步计划，这个计划的许多细节肯定会改变，但它已经得到相关各方的同意，并且团队也理解，因此当需要或大或小的改变时，他们会知道其中的影响，并能更快更好地行动。\n\
  \n考虑到我们的务实数据平台（Pragmatic Data Platform）方法及其架构，你需要确保已经为项目选择了一个数据平台（我们选择了 Snowflake\
  \ 和 dbt），有明确的范围，能够访问你期望使用的数据，能够在所选数据平台上使用这些数据，并且没有悬而未决的重大技术问题。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_355_0.png)\n\
  \n图10.1：务实数据平台架构\n\n如果你以前从未尝试过技术设置或其中某部分，你可能会想对其实施POC。\n\n我用POC验证过的一些技术问题包括：使用内部暂存区（internal\
  \ stages）每分钟将Avro文件加载到落地表（landing table）的能力；在参考系之间转换地理空间坐标的能力；以及在合理时间内对数十亿行大小的表执行一些可能较慢的操作的能力。\n\
  \n## 以敏捷方式组织工作\n\n既然你有了明确的范围和前进的方向，是时候开始持续产出有价值的结果，让你更接近最终目标了。\n\n敏捷原则建议，频繁交付可工作的软件是更可取的。这是一个关键的敏捷概念，也是一个优秀敏捷团队的标志之一——在每个开发迭代或产品增量结束时，完成并展示已完成的工作。\n\
  \n在广泛使用的Scrum方法中，一个开发迭代被称为一个冲刺（sprint）。\n\nScrum是一种不错的方法，但“冲刺”这个词并不是一个好选择，因为它让人联想到某人以最快速度奔跑的画面。这种状态只能在短时间内维持，随后就会因精疲力竭而不得不停下来。这不是我们希望开发迭代达到的状态！\n\
  \n敏捷团队的目标是以可持续的方式工作。一个开发迭代，即使被称为冲刺，也必须按照一个好的节奏来规划工作，这个节奏可以无限期地持续下去。这是敏捷团队真正的秘诀——在团队中分配负载，不让个人或团队过度负荷。\n\
  \n首先要诚实面对每个人能投入项目工作的时间，然后选择在迭代期间可能完成的工作量，并让团队感到有承诺去完成，同时要考虑到正在处理的工作项和已经交付的项目部分（即维护工作或缺陷修复）必然会出现的各种问题。\n\
  \n如果你不确定，宁可承诺更少的工作。这是因为达成目标的团队士气要比未达成的团队高得多，而且大多数重大改进都发生在团队有一定回旋余地、可以尝试新的工作方式或清理拖后腿的旧技术债务的时候。\n\
  \n请记住，软件工程师热爱自己的工作，如果得到认可，他们会为尽了全力而感到自豪。\n\n敏捷开发的另一个基石（主要被称为DevOps文化）是，为团队提供执行开发项目所需的所有任务的工具、专业知识、权限和责任，从项目启动和分析到生产环境中的执行。\n\
  \n授权并信任团队，为他们的成功喝彩，并对他们的结果负责。\n\n\n\n\n\n## 以敏捷方式管理积压工作\n\n那么，**积压工作**中应该包含什么，或者工作待办清单应由什么组成？\n\
  \n积压工作必须包含待办工作的描述，但这并不意味着所有内容都应处于同一详细程度，或待办工作不会发生变化。\n\n黄金法则是，它应以最详细的程度描述下一迭代中要完成的工作，包含足够的信息让开发人员完全理解需要做什么。它也可以以递减的详细程度包含未来要完成的其他工作的描述，因为预计这些工作会在更远的时间完成。未来的工作应以少量且逐渐更概括的故事呈现。\n\
  \n在每次迭代，即每次冲刺中，你会处理掉已开发的许多小故事，并将从积压工作中挑选出来计划在下一次进行工作的更大故事拆分为小而详细的 story 和任务。\n\n\
  > **提示**\n> \n> 关于将什么放入积压工作中存在一个常见冲突。对于开发团队而言，最好只保留足以填满略多于当前迭代的故事，任何更多都是负担，而产品负责人则有兴趣跟踪未来要开发的功能以及更长期的计划和想法。\n\
  \n如果浏览积压工作中的所有故事花费太多时间，这表明你的积压工作中故事太多。我们强烈建议将遥远的工作分组为更大、更概括的故事。如果项目的范围很大，有意义的做法是将产品负责人的积压工作与开发团队的积压工作分开，前者更像是一份正在考虑开发的想法和功能的清单，后者应只包含需要在未来几次迭代中开发的功能，因为更远的工作是不确定的，很可能发生变化。\n\
  \n这只是工作环境卫生的基本原则——像保持你的办公桌和办公室一样保持你的积压工作干净。没有人能在堆满灰尘的箱子或堆满久已遗忘的纸堆的桌子上高效工作。为什么你要让你的积压工作处于这种状态？\n\
  \n举例来说，你知道要开发报告 XYZ，你需要加载 10 个表并计算几个中间表等等。这是有价值的信息，但如果你不计划在下一次冲刺左右做这项工作，那么最好将这些信息作为一段文本和项目符号放在单个功能中，而不是拥有许多独立的故事。直到开发即将开始时，管理一个标题为\
  \ `develop report xyz` 的单个条目会更容易，然后在你准备开始工作时再将其拆分为独立的故事，并拆分为可在放入冲刺后在不到 1 天内完成任务。这个概括性的故事应在开发即将开始时移至开发团队积压工作，而当它只是未来某个时间可能开发的一个功能时，可以保留在产品负责人积压工作中。\n\
  \n用更实用的方式来说，使用常见的术语来识别不同粒度级别的待办工作，积压工作应包含以下内容：\n\n- 一到两个冲刺量的**故事**，这些故事已准备好开发。这些故事必须以实现细节级别描述，以便团队中的每个人都理解需要做什么。进入开发的故事必须在开始工作前拆分为**任务**。最初，任务可以是故事描述中的待办事项项目符号列表。当你拆分它们时，应确保每个任务可以在一天内完成。\n\
  - 若干**功能**，描述已计划且可能准备好执行但仍在详细分析和拆分为独立故事的工作。这些应提供另外几个冲刺左右的工作量，不应更多。\n- 最终，几个非常概括的**史诗**，列出尚未计划或计划在少数几个冲刺之后才进行的下一个开发领域。这些是未来工作的少数高层描述，主要是产品负责人的关注点。如果它们包含文本或文档，例如在准备时所理解的预期内容的演示文稿，是完全可以的。在基于旧计划开始工作前，请批判性地审查它们。\n\
  \n这看起来如此简单，但我可以向你保证，在绝大多数项目中，积压工作的卫生状况最多令人不满意，有大量腐烂的故事永远不会完成，留在那里白白消耗每个人的注意力。\n\n\
  筛选数百个故事以找到下一次冲刺要做的少数几个故事或根据你的发现进行更新，比用十几个或二十个故事做同样的事情更复杂、耗时更长，并降低专注度。\n\n“制作报告 X”或“加载表\
  \ Y”这样的故事如果没有额外内容有什么价值？没有！它只是使你的积压工作混乱，并在规划工作或使用积压工作时杀死你的生产力。\n\n问问自己，如果故事几个月未被触及，保留它们的价值何在。删除它们并保持你的积压工作简短且专注。你会在需要时记住这些故事，如果你记不住它们，那就意味着它们并不重要。如果旧故事中确实有有价值的信息，你可以将其保存到更高层级的故事中，但如果所有你拥有的只是一个标题，就把它扔掉。\n\
  \n## 我们示例项目的初始积压工作\n\n在本节的其余部分，我们将为你提供一个管理积压工作的实用示例，以及一种经过验证的方法来完成数据工程中最常见的任务之一——构建报告。\n\
  \n我们将按照数据流的方式描述我们的架构，因此我们有源，然后是存储层，其中有 STG 和 SNAPSHOT 或 HIST 模型，然后是精炼层，其中有许多专门的模型，最后是交付层，在那里你为每个域有一个数据\
  \ mart，为该域的报告提供支持。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_359_0.png)\n\n图 10.2：务实的数据平台架构和迭代分析与开发\n\
  \n在构建报告时，如敏捷方法中经常做的那样，我们从流程的末端开始以识别目标，然后逆向工作以识别实现目标所需的最小工作量。\n\n上图直观地显示了分析和开发工作的主要方向，虚线回环提醒我们，在这两种情况下，这些都是迭代过程，每当我们发现阻塞或问题时，我们都可以返回并更改之前步骤的结果。\n\
  \n作为迭代过程，我们的意思是在每次迭代或一组迭代中，我们尝试分析和开发我们范围的一个小水平切片，覆盖所有层，然后再移动到另一个切片。\n\n考虑到我们在前几章中使用的示例项目，我们可以说初始概述产生了以下史诗：\n\
  \n- E1 – 设置平台\n- E2 – 构建客户报告\n- E3 – 构建积压报告\n\n第一个史诗 E1 将涵盖我们在前几章中设置平台所做的工作。它将被切片为诸如“设置\
  \ Snowflake 账户”、“设置 dbt 账户”和“设置 GitHub 账户”之类的功能。\n\nSnowflake 功能可以细分为诸如“创建 Snowflake\
  \ 账户”、“为 dbt 项目创建数据库”、“为 dbt 项目创建角色”、“为 dbt 执行创建用户”、“为开发人员创建用户”等故事。如果我们认为完成它们需要超过\
  \ 1 天，每个故事都将被拆分为任务。\n\n如果故事已经足够小，就没有必要拆分它。记住，敏捷也意味着避免无用的工作。\n\n第二个史诗（E2）可能被切片为以下功能：\n\
  \n- F1 – 构建客户当前头寸报告\n- F2 – 构建客户历史头寸报告\n- F3 – 构建客户交易报告\n- F4 – 其他客户报告\n\n我们有意将\
  \ F4 功能命名为“其他客户报告”，以表明拥有一个包含潜在长列表所需报告的单个功能，比现在就为每个报告创建功能而产生长列表更有意义，因为现在它们将在很多冲刺之后才会被考虑工作。\n\
  \n### 提示\n\n> 通过将远期工作放在所有层级的“所有其余”项中或单独的产品负责人积压工作中来保持积压工作简短。“遥远”的含义取决于冲刺持续时间和冲刺中完成的工作量。\n\
  \n一个好的经验法则是为一个或两个冲刺准备好故事，并将已识别的功能拆分为故事以提供几个冲刺的工作量。其他所有内容都应放在产品负责人的积压工作中或“所有其余”类型的项目中。\n\
  \n## 以敏捷方式构建报告\n\n在本节中，我们将以非常通用的方式将构建报告的功能分解为故事，你可以将其用于任何报告，以及数据 mart 中的几乎任何其他结果交付物。\n\
  \n“F1 – 构建客户当前头寸报告”功能可以拆分为以下五种类型的故事：\n\n- S1 – 为为 F1 报告提供支持的数据 mart 设计轻量级数据模型。\n\
  - S2 – 为为 F1 报告的数据 mart 提供支持的 REF 层设计轻量级数据模型。\n- S3.x – 使用 dbt 模型开发数据 mart 中 DIM_x\
  \ / FACT_x / REF_x 表的管道。这不是一个故事，而是数据 mart 中的每个表以及 REF 层中每个必要的支持表的故事。我们稍后会讨论更多细节。\n\
  - S4 – 对数据 mart 中生成的数据进行验收测试。\n- S5 – 在 BI 应用中开发和验证报告。\n\n\n\n\n\n这五类用户故事旨在按照建议的顺序进行开发，因为每一类用户故事都建立在前一类用户故事的结果之上。\n\
  \n显然，相邻的用户故事之间存在一些重叠，后一类用户故事有时可以在前一类完成之前就开始。\n\n用户故事S1和S2重叠度很高，且对定义构建报告的工作至关重要，因此强烈建议由同一位资深人员开发它们，并由负责模型开发的人员负责报告的交付，将后续的用户故事分配给团队，并监督和协调它们的开发。\n\
  \n这一组用户故事可以用来收集需求（S1和S2）并开发（S3.x和S4）任何报告；稍作调整后，也可以用于任何可以作为数据集市中一组表来交付的内容。\n\n在接下来的章节中，我们将深入探讨每个用户故事。\n\
  \n## S1 – 为数据集市设计轻量级数据模型\n\n我们将在这个用户故事中设计数据集市，而我们希望构建的报告、AI模型或API（即该功能的目标）将从这个数据集市读取数据。\n\
  \n设计数据模型是一项需求收集工作，其输出就是数据模型，也就是以简单而正式的方式表达的一组表的设计，用于回答报告（或AI模型或API读取）的查询。\n\n设计这样的数据模型意味着要理解数据集市客户端的需求，以及需要哪些查询来满足这些需求，从而设计出回答这些查询所需的表和列。这通常是数据建模师或高级分析工程师通过与业务方沟通、理解他们想要达成的目标来完成的工作。\n\
  \n构建数据集市数据模型提供了REF层（精炼层）需要满足的可交付成果，使我们能在用户故事S2中开发其需求。\n\n### 保持模型简单\n\n我们之所以称之为轻量级数据模型，是因为构建这个数据模型的目的是为功能开发后我们需要在数据集市中看到的内容提供清晰且明确的蓝图。我们需要一个分析工程师可以遵循的蓝图来构建数据集市；我们不需要一个细致到包含所有列、所有关系，甚至所有表的完整模型。\n\
  \n我们希望尽量让可视化模型保持简单易读。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_362_0.png)\n\n\
  图10.3：TPC-H的轻量级数据集市数据模型\n\n如果不考虑虚线关系，上述模型是纯粹的星型模式。它已经简单到不能再简单，每个实体只包含主键。没有标签的关系已经存在于源数据中，而标记为ETL的关系则需要按照精炼层中已有的关系添加到事实表中。这些关系仅标记为REF，因为期望星型模式的报表工具无法使用它们，但它们提供了构建星型模式所需的信息。\n\
  \n重要的一点是，我们不需要在数据模型中列出所有表的所有列。我们只需要那些有一定重要性、希望确保存在的列。我们假设维度和事实的其他信息也会存在，但我们对它们没有特别的关注。如果你想排除某些列，就在用户故事中添加一条备注。\n\
  \n例如，经典的客户维度可能有几十列，有时甚至有上百列。为了实现我们的目标，只需要列出主键和那些具有特殊含义或要求的列，例如我们希望在报告中筛选的类别，如 CUSTOMER_CLASSIFICATION_CODE\
  \ 或 CUSTOMER_SECTOR。\n\n类似地，在事实表中，我们只放重要的内容，例如指向维度的外键（FK），或者需要特别关注的内容，例如我们希望确保存在或必须计算的度量或类别。事实表和维度表都有的显而易见的键，如\
  \ CUSTOMER_CODE，如果我们认为没有出错的风险，可以从事实表中省略。\n\n反过来，在数据模型（也就是我们想构建内容的示意图）中列出客户维度80多个或200多个列，又有什么好处呢？\n\
  \n我看不到任何好处，只有缺点——输入列名需要花很长时间，模型会变得庞大、混乱，无法在屏幕上以可读的大小完整显示；维护起来容易出错，而且很难检查现有列是否是我们真正想要的、是否确实存在于数据集市维度中。总而言之，这会把我们需要的少数几列的有用信息淹没在大量无用的列名海洋中，而这些列名只是我们碰巧从数据源中得到的。\n\
  \n如果你想检查一组列是否存在于某个维度中，更简单的做法是列出这些列，然后在维度中添加一个测试来检查它们是否存在：\n\n```\n- name: concat(SECURITY_NAME,\
  \ SECTOR_NAME, INDUSTRY_NAME)\n  tests:\n    - not_null:\n        where: \"false\"\
  \n```\n\n上述测试添加到任何表中，只检查 SECURITY_NAME、SECTOR_NAME 和 INDUSTRY_NAME 列是否存在于表中，因为 WHERE\
  \ 条件设置为 false 的查询永远不会返回任何一行，所以如果这些列存在，测试将始终通过。\n\n请记住，使用 dbt 时，在 ELT 中让所有列继续向前流动，比从流程中移除某些列更容易，而在列式数据库中这样做的缺点几乎仅仅是廉价存储的成本，所以常见的情况是：一个模型拥有其派生来源模型的所有列。\n\
  \n我们绘制的数据模型是一种沟通工具，模型越简单就越容易理解。在这里，少即是多。只放那些你在与同事交谈时会指出的内容。\n\n另一个保持模型简单的重要方法是，对多个相似的表只使用一个示例。例如，如果在数据集市中需要有10个维度，它们只是事实表中10种不同的数据分组，那么只需要一个维度“Grouping\
  \ X ×10”——维度中有主键，事实表中有名为 Grouping_X_CODE 的外键。然后，在用户故事中添加一个包含10个分组名称和10个键的列表；如果觉得更容易管理，也可以附上Excel附件。\n\
  \n### 星型模式数据模型\n\n大多数情况下，当我们使用BI工具构建报告时，我们希望采用 Kimball 架构或星型模式，因为这是BI工具所期望且能有效使用的。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_364_0.png)\n\n图10.4：一个通用星型模式的示例\n\n在这些情况下，数据集市数据模型的布局已经设计好了：一个事实表位于中心，各个维度表以多对一关系连接到事实表。\n\
  \n如果数据模型的布局已经确定，那还有什么需要设计呢？\n\n实际上还有很多。设计中最重要的部分显然是事实表，但维度表，即使是那些已经在事实表中有外键的简单扁平维度，也会促使你在备选方案之间做出决策，需要考虑易用性、开发简便性和方案的健壮性。\n\
  \n关于如何设计星型模式，已经有不少专著。下面只是对你将面临的主要备选方案的简要介绍。这个清单简短而不全面，但能极大帮助你为数据集市设计星型模式：\n\n- **简单维度**：这些维度只是列出一个实体的描述性信息，该实体在事实表中已经有主键，或者很容易有主键。\n\
  \n  如果幸运的话，你的大多数维度都是这样。画出维度及其名称和主键，再加上那些重要的列。\n\n- **层次维度**：这些维度可以分解为一系列不同粒度的嵌套维度。一个例子是地理维度，可以由城市\
  \ < 省份 < 地区 < 州 < 国家 < 大洲组成。\n\n  另一个常见的层次结构是日历：日期 < 周 < 月 < 季度 < 年。\n\n\n\n\n\n\
  ![](img/8868d272a75eee8b407a8e0f3434d10f_366_0.png)\n\n图 10.6：部门和课程信息的建模\n\n在这种情况下，将课程-讲师-部门维度称为层次结构会很奇怪。不过，一种解决方案是像对待层次结构那样，通过扩展关系，将部门和负责讲师的描述性列反规范化到课程维度中。如果我们不是单独关注讲师和部门维度，并且只反规范化少量列，这种做法效果很好，也很有意义。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_366_1.png)\n\n图 10.7：部门和讲师信息的另一种建模\n\n\
  另一种解决方案是创建各个独立的维度，并在构建事实表时，利用事实表、第一个维度以及其他雪花形维度之间的关系，将每个维度的键引入事实表中，从而在 REF 层中丰富事实表。\n\
  \n- **事实表**：事实表是星型模式中心的表，提供描述组织中所发生情况的数字，也就是我们想要分析的内容。这些数字称为**度量**。\n\n一个星型模式中只能有一个事实表，但有趣的答案往往来自将不同的基础事实组合在一起，因此在大多数情况下，我们会在星型模式中心放置复合事实表，为分析型数据集市提供支撑，这一点我们稍后将讨论。\n\
  \n请记住，这里很少有非黑即白的情况，大多数情况下，根据利益相关者的不同，会有深浅不一的灰色地带。重要的是要理解，构建数据集市的数据模型是一项设计工作，其目的是生成能够很好地满足当前需求的东西，而不是试图复制现实，也不是要构建一个在所有情况下都适用的东西。\n\
  \n一个领域中的大多数信息都以某种方式相互关联，并且可以扩展出大量数据——例如，在大多数情况下，你可以认为我们之前示例中的讲师只有姓名、电子邮件，也许还有一个类别，因为这是该领域报告中的必要信息，但当我们进入人力资源领域时，我们肯定会有更多信息，包括开始日期、职位、薪水等等。在某些领域，将讲师信息反规范化到其他维度中是正常的做法，而在其他领域，它则是一个独立的维度。\n\
  \n建立数据集市的确切意义在于为复杂组织中的不同领域提供清晰且易于使用的模型。要拥抱这种选择能力，而不是试图以千篇一律的方式处理所有事情来抗拒它。\n\n我们将在下一个故事\
  \ S2 中看到，REF 层是我们在认为有用的范围内尽可能贴近现实、并尝试为每个实体构建唯一真相的地方，这些真相随后可以在数据集市中从不同角度查看。\n\n##\
  \ 在星型模式中使用多个事实表\n\n设计数据集市时最常见的问题之一是一个约束，即根据 Kimball 架构和大多数 BI 工具的要求，在星型模式中必须只有一个事实表。\n\
  \n当人们意识到复合事实或复杂事实作为星型模式中心的事实表是完全有效的时候，这通常就不是问题了。\n\n人们正确地认为事实表是描述组织生命周期的文档、事件和流程结果，例如销售订单、生产订单、发票、库存增加或减少、每个项目的库存量、退货订单或工资支付。\n\
  \n为了便于后续讨论，我将**基础事实**定义为组织产生的原生信息。这些通常是业务方在提出需求时命名的事实，也是我们通常从组织系统中获得的东西。\n\n现实情况是，组织想要分析的有趣信息几乎总是通过合并多个基础事实的数据获得的。我们几乎可以说，你组合的基础事实越多，信息的价值就越高。\n\
  \n我们如何将星型模式中单一事实表的需求与组合多个事实表为组织提供大量价值的现实情况结合起来？\n\n引入**复合事实**。复合事实是通过利用基础事实之间自然存在的关系，将多个基础事实的信息组合在一起而创建的。这些关系不能直接在星型模式中原样使用，但它们会在\
  \ REF 层中用于生成星型模式中使用的复合事实。和所有事实表一样，复合事实只是一个简单的表。\n\n举一个简单的例子，如果我们的业务需要扣除退货后的开票金额。第一种选择当然是询问其中一个原生事实中是否已经存在这样的值，但如果没有，而我们只有发票和退货这两个基础事实，那么我们就知道需要使用已有的这两个基础事实中的信息来构建一个复合事实。\n\
  \n接下来的问题就变成了*如何*连接这两个基础事实，以及如何获得正确的粒度和多重性。这项工作是 S2 故事的核心，因为这就是在 REF 层中所要完成的工作。\n\
  \n对于数据集市（即 S1 故事的主题），我们的工作是确定一个事实表，名称类似于“含退货的发票”，其中包含“开票金额”和“退货金额”等列，也许还有计算得出的“扣除退货后的开票金额”。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_368_0.png)\n\n图 10.8：含退货发票的数据集市\n\n在前面的模型中，我们没有详细列出产品、客户、发票或退货头信息的键或字段，因为我们认为它们显而易见，并且期望它们已经在事实表中。相反，我们指出了想要计算的列，以及到销售代表和客户支持代理的外键（FK），这些列和键预计不在事实表中，需要在\
  \ REF 层中进行扩充。\n\n当我们组合不同的基础事实时，自然会有一个驱动事实——通常是粒度较粗的那个，与其连接的其他事实提供所需的附加度量。所有度量都成为复合事实的一部分，并聚合成正确的粒度。\n\
  \n我们还需要决定如何处理合并到复合事实中的各事实的描述性数据。正如我们已经看到的，选择要么是将列反规范化到事实表中，要么是“从（基础）事实中创建维度”。这种选择通常由多重性决定。\n\
  \n例如，在“含退货的发票”案例中，如果我们想在产品级别分析数据，就需要将事实表置于发票行粒度，并与退货行组合。在这两种情况下，我们都有发票头信息和退货头信息，它们不仅是事实表，还包含大量有趣的描述性信息，例如日期、地址，以及谁接单或授权退货。\n\
  \n如果你想按城市或邮政编码（这些信息通常位于头信息中）分析发票或退货，你可以将这些信息反规范化到复合事实表中。这在列式数据库中效果很好，但你需要编写 ELT\
  \ 代码将其引入事实表，而且通常只为少数几列这样做。\n\n更通用的做法是识别事实表与头信息之间的多对一多重性，并从中创建一个维度。通过采用这种方法，你可能会决定将销售人员的姓名（这比头信息中的代码更具可读性）以及授权退货的人员姓名，或退货头信息中所述的问题类别描述，引入“发票头信息维度”。\n\
  \n\n\n\n\n## S2 – 为 REF 层设计轻量级数据模型\n\n有人可能会争辩说，设计数据仓库的数据模型和有效驱动数据仓库的 REF 层的数据模型是同一个过程。这在很大程度上是正确的，因为两者密不可分，这也是我们建议由同一个人来完成的原因。\n\
  \n我们决定将这两个部分分开，并为每个数据模型设立一个单独的故事，因为这两个模型本身就提供价值，通常在不同背景下由与不同人员交谈创建，并且可能在不同时间因不同原因而发生变化。\n\
  \n我们重申，建议由同一位资深人员来推动这两个故事（S1 和 S2），并对报告端到端创建的整体责任负责。\n\n模型师负责端到端的主要原因是，建立对需求、对数据仓库以及将在\
  \ REF 层中合并的来源的正确理解是一个缓慢而复杂的过程，需要与许多人讨论，而且在构建过程中将所有必要的细微差别传达给他人是相当困难的。\n\n开发完成后，尤其是使用\
  \ dbt 时，我们拥有 SQL、血缘图和数据模型，这些提供了非常好的材料来描述需求，而与此同时，团队也已经熟悉了这些需求。\n\n团队中多个人协作开发是最好的方式，让他们内化报告的大部分知识，同时也为提高解决方案质量做出贡献。模型师的角色是指导同事，并确保即使是难以传达的细微差别也能得到满足。\n\
  \n这个 S2 故事的开发通常是模型师与了解将为报告提供数据的来源系统的相关人员之间进行的对话，如在分析数据仓库的故事（S1）期间初步确定的。\n\n在 S1\
  \ 中，业务人员通常使用操作系统处理的基事实或其他概念来表达自己，这些概念是在他们之前或本地版本的报告中构建的。\n\n在 S1 和 S2 之间，模型师在连续的步骤中设计并完善事实和维度及其丰富化，以满足需求，同时处理可用的来源。\n\
  \n本故事需要执行的工作如下：\n\n- 学习如何将精炼层中构建的基事实和维度的数据组合起来，以生成复合事实和故事 S1 已识别的丰富维度。\n- 识别精炼层中需要的表——基事实和维度，加上代表额外关系或用于在系统之间转换所需的支持表。\n\
  - 识别从哪些来源系统最简单或最容易收集前述表的数据，以及如何将其加载和存储到数据平台中。\n\n这个 S2 故事的一般进展，通常与 S1 故事的最后部分重叠，是一种递归过程，用于寻找所需信息的位置以及如何连接它，当该信息尚未可用时，以生成所需的精炼模型。\n\
  \n一旦所需信息得到说明，就该检查数据是否按预期提供信息，并开始思考可能与简单/通用情况不同的特殊情况。这部分通常是与来源系统专家和业务的严格协作，以验证或根据数据的实际情况调整需求。\n\
  \n以下是您将反复处理的典型情况的快速描述。\n\n### 从来源定义 REF 模型\n\n下图描述了来自来源 S1 的表 XYZ 如何被摄取、存储、丰富化，然后映射到主数据系统，以提供完全精炼的\
  \ REF_XYZ 模型，该模型可以与其他 REF 模型相关联，因为它们都以主数据代码表示。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_371_0.png)\n\
  \n图 10.9：最终主数据 REF 模型的一个示例数据模型\n\n如我们在使用 dbt 的务实数据平台方法时在前几章中解释的那样，我们大量使用前述加载模式：\n\
  \n1. 我们将来自来源系统表 XYZ 的数据带入暂存模型 STG_S1_XYZ，用于在不添加任何业务规则（BRs）的情况下调整数据。名称中的 S1 明确表示所有代码和约定仍然是\
  \ S1 系统的。\n2. 我们使用 dbt 快照或我们的仅插入历史宏存储 STG 模型的输出到唯一的增量模型中，该模型存储实体单个实例所显示的所有版本。对于\
  \ STG 中的一个 PK，存储表中可能有多个行。\n3. 当是时候在 REF 层中使用 XYZ 数据时，我们使用我们的 current 宏取出每个实例的当前版本，形成\
  \ CURR_S1_XYZ CTE 或表。\n4. 当前实例最终会与其他来自同一 S1 系统的表连接，以丰富实体并生成“本地精炼”版本 REF_S1_XYZ，仍限于\
  \ S1 系统。在此步骤中，我们使用同一系统中的数据丰富实体，以便将其向前传递。\n\n丰富化操作可能在模型之间以一个步骤完成，这些模型基本上只是围绕 CURR\
  \ CTE 的外壳，也可能是对所有贡献于最终 REF 模型实体的多次转换的结果。这取决于要应用的 BRs。\n\n5. 构建可普遍重复使用的精炼模型以用于 **XYZ**\
  \ 实体的最后一步是应用主数据映射，将代码和约定从系统 S1 转换为所选主数据系统的约定。\n\n直接从来源系统表派生但已转换为主数据系统的各种 **REF_XYZ**\
  \ 模型，是构建更复杂 REF 模型的基础，后者结合多个系统信息。\n\n来自多个系统的数据组合可以提供丰富化（例如从 HR 系统引入销售人员的姓名）、扩展范围（例如使多个国家/地区的发票可用），或生成在单个系统中不存在的新、更高级别的概念。\n\
  \n这种模式重复出现且命名一致，以至于在大多数情况下，绘制全部内容是多余的，因为这不会增加价值，只会使 REF 层数据模型变得杂乱。\n\n因此，通常只需在 REF\
  \ 层数据模型中识别最终的 REF 模型即可。如果您认为识别对 REF 模型进行重要丰富化步骤有贡献的其他实体很重要，可以从 CURR 模型开始。\n\n请注意，在极少数需要处理所有版本的情况下（通常称为\
  \ *缓慢变化维度类型二*），逻辑类似但更复杂，因为它需要考虑所有实体的版本时间线以执行操作。\n\n### 维度丰富化\n\n这是最常见的情况之一，在 S1\
  \ 故事中您选择将雪花维度或参考表的数据非规范化到与事实连接的目标维度中。\n\n要建模此情况，您需要识别目标维度与您想要从中带入值的相关 REF 模型（维度）之间的连接条件，检查基数，以确保您可以为目标维度的每一行带入雪花维度的单个值，而不会产生重复。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_372_0.png)\n\n图 10.10：一个丰富维度的示例\n\n数据模型还显示，在细线中带有“by\
  \ ETL”描述，通过向事实添加部门和主讲师维度的 FK 而创建的两个关系：\n\n```\nSELECT\n  f.*,\n  c.Department_CODE,\n\
  \  c.Main_Lecturer_CODE\nFROM FACT_XYZ as f\nLEFT OUTER JOIN REF_Course as c ON\
  \ f.Course_Code = c.Course_Code\n```\n\n前述代码将是 FACT_XYZ 模型的一部分，展示了如何通过遵循从事实到课程的连接并从\
  \ REF_Course 表中选取这两个表的 FK 来完成此类丰富化。\n\n### 主数据的应用\n\n在 REF 层中您需要考虑的另一个常见任务是主数据映射，需要将数据从原始来源的编码和约定转换为主数据系统中使用的约定，如果存在的话，或者至少转换为用于指定数据仓库的通用系统。\n\
  \n这很常见，以至于我们在本故事描述开始时构建 REF 模型的正常转换链数据模型图中已经添加了此步骤。\n\n### 复合事实的定义\n\n在大多数情况下，您报告的星型模式中心的事实是一个复合事实，需要从基事实和支持表（包括映射和多对多关系表）创建。\n\
  \n在故事 S1 和 S2 期间，重要的是您很好地覆盖如何构建复合事实，其中 S1 更侧重于所需内容是什么，S2 更侧重于如何构建它并应用正确的 BRs 以提供正确的值。\n\
  \n我们无法涵盖您将面临的所有可能情况，但我们想指出，您应仔细考虑需要组合的事实和中间表的关系的性质，因为存在多对多关系的情况非常难以处理。\n\n此类情况的解决方案可以是特定的\
  \ BRs，减少关系的复杂性，和/或将不同部分聚合到关系变得更容易处理的程度。\n\n## S3.x – 使用 dbt 模型开发 XYZ 表的管道\n\n一旦\
  \ S1 和 S2 故事已完成或至少处于完成的高级阶段，您将拥有需要在精炼层和交付层中构建的表列表。\n\n\n\n\n\n你将为每个表创建一个 S3 故事，通常包括以下内容：\n\
  \n- 精炼表（本地或主数据精炼），直接用于数据集市或构建更复杂的模型：这些包括支持表，例如主数据映射和多对多关系表，需要从源系统加载并在 ref 层中提供。\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_375_0.png)\n\n图 10.12：构建 REF 模型的管道的一般布局\n\
  \n对于此类中的每个表，上图给出了一般发生的情况的计划。由你来在故事中明确定义数据的来源（源）以及所需的内容，特别是超过 CURR 模型之后。\n\n- 在精炼表之上构建的复杂模型：每个故事都应说明模型应如何构建以及涉及的\
  \ BR。\n\n- 数据集市中使用的最终事实和维度：如果维度直接基于 REF 模型构建而没有任何特定规则（基本上使用 SELECT * 查询），你可以将维度的创建添加到创建\
  \ REF 表的故事中，因为工作量很小。\n\n对于这些存储区，每个都需要了解的重要点如下：\n\n- 源是否提供完整导出（所有实例）或仅提供部分导出。\n\n\
  - 源是否只提供一个版本或提供多个版本。\n\n- 如果源中存在删除以及如何处理它们。\n\n- 该实体的自然键和源表的 primary key 是什么？\n\n\
  - 决定要在存储中存储什么。一般来说，你只想在收到时存储不同的更改，但在某些情况下，为以后的使用更容易，可以为每天（或其他时间间隔）存储一个快照。\n\n- 在\
  \ REF 层指定最终的 BR 用于丰富和主数据映射。\n\n不要对其中许多故事只是千篇一律的“从源 SX 将表 XYZ 导入 REF 层”类型感到惊讶，没有任何特殊的\
  \ BR，甚至可能没有 MD 映射，因为最终的 REF 模型可能只是用于丰富另一个模型。\n\n这些是优秀的故事，可以由经验较少的同事并行构建，他们可以在经验丰富的同事的初步帮助下开始学习正确摄取数据的复杂性。\n\
  \n其中只有少数故事与复合事实的构建以及包含复杂 BR 的维度或必须克服数据中大量问题相关。这些更适合最有经验的同事，或应与建模者直接协作完成，以避免因数据中意外的\
  \ issues 和 BR 中的 corner cases 而陷入困境。\n\n正如始终记住的那样，以敏捷方式工作意味着我们不想花费大量时间收集所有详细需求（瀑布式），但我们需要与业务和专家保持快速且持续的联系，以便能够克服出现的问题。\n\
  \n这些故事的集合在到达 REF 层之前是相当独立的，因此可以并行交付，但随后你需要开始完成前面的故事以开始复杂模型和数据仓库表的故事。\n\n## S4 –\
  \ 对数据仓库中产生的数据的验收测试\n\n一旦你开始拥有要在数据仓库中使用的最终表，就该验证你提供的数据是否可靠了。\n\n主要有两种方法：\n\n- **自动化验收/集成测试**：在某些情况下，可以对你必须生成的所有或至少部分数据具有预期输出。这是当存在（或曾经存在）我们将要替换的先前系统在运行的情况，但也有可能是业务已为有限的数据集生成了期望的输出。\n\
  \n在这些情况下，只需在 dbt 中设置单一测试来验证输出是否符合预期即可。\n\n- **手动验收测试**：这仍然是最常见的情况，你要求业务或另一团队的同事验证你生成的数据是否正确。\n\
  \n在这些情况下，我们建议准备临时报告来支持同事的工作。我们还建议在测试期间保持沟通渠道畅通，并在发现问题时快速修复，而不是批量更改。\n\n这个故事的要点和细节因地而异，有些地方需要详细和正式的验证和验收，而其他地方则对几次手动检查感到满意。\n\
  \n当数据被认为足够好以投入生产时，故事就完成了。\n\n## S5 – 在 BI 应用中开发和验证报告\n\n这是最终的故事，你将使用 S4 中验证的数据仓库来使用\
  \ BI 应用构建报告。\n\n起点是 S1 故事中为数据仓库设计的数据模型，该模型是考虑到 BI 工具需求而开发的，因此将为你的 BI 工具提供正确的模型，无论是星型模式还是宽表。\n\
  \n我们不会进一步详细介绍这个故事，因为这项工作是在 dbt 和你的数据平台之外完成的，很大程度上取决于手头的 BI 工具。\n\n> **敏捷提示**\n>\
  \ \n> 我们刚刚讨论了通常的步骤，编纂成故事，用于构建由数据平台支持的报告。\n> \n> 应用的过程是通用的（知道你想要什么，找到如何构建它，构建它，验证数据，并将可视化交付给你的受众），但重要的是要记住在敏捷团队中，你不能以瀑布式的心态解释这些步骤，在完成（并签署）一个步骤后再进入下一步。正确的方法是让它们重叠，并在接近实现时澄清更多细节，如果数据讲述的故事与你所想的不同，则回溯并重新思考。\n\
  > \n> 记住目标——向客户交付，而不是构建文档。\n\n在本节中，我们讨论了如何以敏捷方式工作，并深入探讨了构建星型模式数据仓库以驱动你的报告，这是 dbt\
  \ 和数据仓库的常见用途之一。\n\n## 总结\n\n在本章中，你学习了一些敏捷哲学和实用提示，从项目的开始，管理积压工作，最后深入探讨如何组织工作以构建报告数据仓库。干得好！\n\
  \n在下一章中，你将学习关于协作以及在 dbt Cloud 旁边使用 Git 进行协作的知识。\n"
- "## 11\n\n## 团队协作\n\n在上一章关于敏捷开发中，我们讨论了开发流程，通常提到它如何影响团队合作。\n\n在本章中，我们将介绍一些有助于开发人员作为团队工作的实践，以及\
  \ dbt 为此提供的支持。\n\n本章涵盖以下主题：\n\n- 启用协作\n- 使用分支和拉取请求\n- 在 dbt Cloud 中使用 Git\n- 进行你的第一个拉取请求\n\
  \n## 启用协作\n\n团队能够一起工作的最重要方面是**一致性**，我简单地将其定义为团队成员有能力和意愿朝同一方向前进的能力。重要的是要反思这两个维度——能力和意愿。\n\
  \n团队成员必须能够朝同一方向工作；他们必须知道并清楚地理解预期的共同方向（必须与管理层相同），并且不应有冲突的优先事项或分配。这对于团队中并非所有人都依赖于同一组织/经理的情况尤其重要。\n\
  \n团队成员必须愿意朝同一方向工作；他们必须拥有知识和能力，使其能够在团队中有效工作，并且他们必须积极参与团队方向的制定，以便对团队的工作有真正的认同。\n\n\
  敏捷的核心是“自组织”团队，因为这是确保方向为所有团队成员所知并达成一致的最佳方式，并且团队中的每个人在主题上的发言权与其能力成比例。敏捷宣言的第 11 条原则说：“最好的架构、需求和设计来自自组织团队。”\n\
  \n\n\n\n\n## 核心协作实践\n\n要实现协作，你需要共享的目标，通过共同编写和选择开发功能与故事来实现，还需要工作方式，以便所有任务，甚至那些通常与个人工作相关的任务（如编写代码或设计数据模型），都能从团队视角审视，并以团队友好/可用的方式执行。\n\
  \n这意味着必须有共同的实践和工具。\n\n以下是帮助团队协作的重要实践列表：\n\n- 1. **共同代码所有权**：开发必须开放透明，代码归团队所有，而非编写它的个人。必须鼓励每个人都能修改代码库的任何部分，目标是提升质量，而不仅仅是按照代码开发者的偏好来改动代码。\n\
  \n这可能是许多团队最重要的一步——打破“我的代码”与“你的代码”之间的心理隔离墙，接受“我们的代码”。\n\n一旦我们同意我们编写的代码属于整个团队，协作就成为可能。\n\
  \n- 2. **整洁代码与技术卓越**：为了让团队成长和协作，代码必须是团队能写出的最好代码，并且要像散文一样易于阅读。\n\n敏捷宣言的第 9 条原则指出：“*持续关注技术卓越和良好设计能增强敏捷性。*”\
  \ *最小惊讶原则* 对协作非常重要，因为它让代码更容易理解，避免出现意外的代码行为。\n\n这里的关键问题是，“*你为谁而写？*”答案是，“*为你自己，也为你的同事*”，因为你写的代码会被阅读几十次甚至上百次。尽量减少理解代码所需的时间，以及被误解的可能性，是关键。\n\
  \n优秀的专业人士希望为自己的工作感到自豪，而这只有当他们所处理的代码清晰且运行良好时才有可能。必须鼓励团队每天提高代码的平均质量，而不是降低它，这也可以通过辅导同事来实现。\n\
  \n- 3. **信任，但也要质疑**：自由只有伴随责任才可能实现。集体所有权和高品质代码（以及流程）是一个持续的过程，不仅在积极编写代码时如此，在评估或审查任何部分代码时也是如此。\n\
  \n团队中的每个人都可以质疑、请求或提议改进每一段代码。这样做必须是为了提供真正的价值，并以建设性的方式沟通，而不是出于羞辱、控制或微观管理的目的。\n\n通常，这种情况发生在开发期间——记住“童子军规则”——以及新代码的审查期间，但如果能增加足够的价值，任何时候都可以。\n\
  \n4. **开放政策**：不仅要鼓励代码方面的透明和贡献，还要鼓励所有可交付成果和活动（包括会议）中的透明和贡献。\n\n在每项活动中，如果团队成员能做出贡献，就应感到受欢迎；但如果无法贡献，也应感到自由且有必要离开。\n\
  \n自由和责任是关键。\n\n上述实践为团队协作的蓬勃发展奠定了良好基础，但仅仅口头承诺是不够的。所有团队成员都必须理解这些实践，并感到可以放心地按照它们工作，因此管理层有责任辅导团队吸收这些实践。\n\
  \n这些共同实践和工具应覆盖所有工作，从目标与工作管理（编写和选择故事）到开发（数据库访问和编码）再到协作（沟通、版本控制和代码审查）。\n\n## 与 dbt\
  \ Cloud 的协作\n\n在通用工具类别中，使用 dbt Cloud 带来了许多好处：\n\n- 一个基于 Web、与系统无关的**集成开发环境（IDE）**，为团队所有成员提供相同的访问、工具和工作流程。\n\
  \n敏捷团队鼓励个人选择工作工具，因为这能提升个人福祉和生产力，但一个易用、人人平等的环境对于实现共同工作方式非常重要。\n\n这对于那些并非编程背景出身、而是具有\
  \ BI 或分析师经验的数据团队成员尤其重要，他们可能不习惯版本控制、测试或发布到多个环境等编码实践。\n\n- 简单透明地访问数据库和代码，无需管理手动连接或访问\
  \ Git 仓库。\n\n- 一种有主见、简单且高效的基于 Git 的流程，用于处理版本控制、开发分支和拉取请求，使对 Git 了解甚少的人也能遵循 Git 分支最佳实践来开发代码。\n\
  \n使用版本控制，尤其是开发分支，是促成代码审查和**拉取请求（PR）**形式协作的关键推动因素。\n\n我们将在本节后面探讨与 Git、分支和 PR 相关的协作。\n\
  \n- 一种简单的方式来管理团队成员的个人开发环境，以及团队部署环境（如 QA 和 PROD），以及在这些环境上部署和运行代码的作业。\n\ndbt Cloud\
  \ 的这一部分——我们将在本章最后一节讨论——自动化了大部分工作，减轻了团队的负担，使更多成员能够处理部署，并且比典型的自建工具在流程中提供更高的透明度。\n\n\
  ## 团队协作\n\n当你把共同目标、工作方式和工具整合在一起时，就提供了一个有利于良好团队协作的环境。文化是让良好团队协作真正落地的秘诀。\n\n在使用 dbt\
  \ 时，以下实践是协作编写代码、建立共同编码方式以及辅导或分享知识的绝佳方法：\n\n- **结对编程**：在同一个代码片段上一起工作。这是辅导同事、建立共同工作方式以及传播领域知识最有效的方式。\n\
  \n无论你采用传统方式——两个人（甚至更多人）共用一台电脑和一个键盘——还是在线方式，结对编程总是非常有效。结对编程产生的代码始终比独自编写的代码更好，如果同事对该代码满意，就可以合并到\
  \ `master` 分支。此外，知识现在存在于两个人的头脑中。\n\n- **代码走查**：某段代码的开发者带领团队走查他们的代码。团队提出澄清性问题，并可以以协作的方式对开发者采用的解决方案提出质疑。\n\
  \n积极、诚实和友好的态度是这一实践的核心，因为问题的目标必须是更好地理解代码、理解选择背后的原因，并为质量提供切实的改进。\n\n这种技术对于让一大群人快速了解某段代码非常有用，无论它是应用程序的重要部分，还是领域中反复出现的通用模式或库的使用。\n\
  \n仅使用这种技术的缺点是，走查将在代码至少处于非常高级状态（甚至几乎完成）时进行。此时获得关键的反馈意味着许多工作必须重做，因此，团队能做的更改/改进的门槛被提高了。\n\
  \n- **拉取请求（PR）和代码审查**：PR 是将代码从一个开发分支合并到另一个分支（通常是包含当前集成版本的主分支）的请求。这个分支通常称为 `master`\
  \ 或 `main`。\n\n代码审查是同事审查开发分支提出的更改并提出问题/建议的过程。我们将在下一节中详细讨论。\n\n文化是使团队能够协作并最终有效工作的最强因素。当开发人员和管理者把团队的福祉和成果放在个人之前，同时当然兼顾个人需求和兴趣时，你就拥有了良好的团队文化。\n\
  \n工具和实践能够促成并支持协作，是团队文化的一部分，但最终决定团队文化成败的是心态。\n\n> 毕竟，敏捷宣言的第 5 条原则指出：“*围绕有动力的个体构建项目。给他们所需的环境和支持，并信任他们能够完成工作。*”\n\
  \n\n\n\n例如，按四分位数组织的奖金，前四分之一的同事获得更多，后四分之一获得更少，这更多是促进竞争而非协作。基于团队成果的奖金更可能激励协作和指导。\n\
  \n软件开发中的有效协作通常依赖于对版本控制的高效使用，其中分支和PR是管理代码变更和团队协调的强大工具，这也是我们下一节的主题。\n\n## 使用分支和PR\n\
  \n软件开发中最重要且最具干扰性的时刻是将新代码集成到现有代码库中。此时，你必须确保新代码实现了开发者的预期功能，并且与现有代码良好融合，尤其是与刚刚由其他开发者开发的其他近期更改相兼容。\n\
  \n经验表明，与包含大量代码的所谓“大爆炸”发布相比，小增量集成的执行速度更快、更容易。\n\n事实上，要确切了解一小段代码的功能要容易得多，而且由于开发小幅改动所需时间较短，因此在开发开始后已交付的改动以及新代码必须与之良好集成的改动都很少。\n\
  \n现代软件工程已将使用**版本控制系统（VCSs）**作为代码管理的标准，因为它允许软件演化过程中采取可控且可预测的步骤。\n\n分支的使用是在技术上实现上述快速开发和频繁将新代码集成到现有代码库的方式。\n\
  \n创建分支就像对代码制作一个命名副本，之后可以独立于原始代码进行修改和开发。这允许开发者在特定功能上工作，并与在其他分支中由其他开发者并行创建的更改隔离开来。\n\
  \n当分支内完成的开发准备集成时，该分支中的代码会被合并到主分支（master branch），或另一个代表产品当前版本的长期分支中。\n\n合并过程将来自被合并分支的更改应用到目标分支中当前版本的代码之上。应用更改的过程通常由VCS自动处理。只有在极少数情况下，当两个并行更改试图修改同一文件时，才需要人工干预，称为**冲突解决**。\n\
  \n冲突可能出现在：当提议的更改会触及文件的同一部分，而该部分在提议更改的分支从原始分支创建之后已被修改，并且冲突的更改已通过此前来自另一分支的合并操作被合并到目标分支中。\n\
  \n开发者会在自己的分支中进行更改，直到一切按预期运行，然后将代码合并回主分支。这样做的好处是，主分支只会接收经过充分测试的可运行代码，并从一个有意义的功能集演进到另一个。\n\
  \n在 dbt Cloud IDE 中处理代码时，你可以在主分支（首次提交后被视为只读）上，也可以在一个不同名称的分支上，该分支被视为功能开发分支，可以部署到你自己的开发环境。\n\
  \n在第2章中，我们看到了如何从空仓库初始化项目，在之前的章节中，我们经常使用与Git相关的命令，但让我们结合与Git相关的命令，描述功能开发的完整流程：\n\n\
  - 1. 从主分支开始。注意，它被标记为只读。这是一种最佳实践，防止意外且不受监督的更改在未遵循适当流程的情况下进入主分支。\n\n从下面的截图可以看到，与Git相关的dbt\
  \ Cloud功能集中在窗口左上角区域，第一行显示你当前所在的分支名称，版本控制区域显示命令和已更改的文件（下图中没有）。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_385_0.png)\n\
  \n图11.1：主分支上可用的Git操作\n\n你可以随时点击刷新Git状态来检查是否有任何更改。\n\n- 2. 点击 **创建分支** 按钮，并在出现的弹出窗口中为分支命名，以创建新的功能分支来处理代码。\n\
  \n- 3. 几秒钟后，你将发现自己位于新分支中（下图中命名为 **chapter08**），该分支不再是只读的。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_386_0.png)\n\
  \n图11.2：干净状态开发分支上可用的Git操作\n\n当分支没有尚未提交的更改时，它处于干净状态，因为工作目录与Git仓库同步，此时你可以选择创建新的PR。\n\
  \n- 4. 你现在可以根据需要编辑和开发该功能。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_386_1.png)\n\
  \n图11.3：脏状态分支上可用的Git操作\n\n一旦你编辑了一个文件，你的分支将处于脏状态，因为工作目录与Git仓库不同步。已更改的文件会列在**版本控制**区域，你可以点击其中的文件名，查看与之前版本相比发生了什么更改。\n\
  \n如果你想放弃自上次提交以来的所有更改，并回到分支上次提交时的状态，可以点击**还原**并确认。\n\n即使你没有积极地在分支之间切换，而是在自己的分支中开发，然后回到主分支，再开始另一个分支，你也必然会导入一些并非在你的分支中所做的对现有表的更改。\n\
  \n当你切换或在分支间推进时，代码会反映你当前所在的分支，而开发环境的数据库则会根据你运行的内容累积更改。\n\n一般来说，为了确保开发环境的数据库反映你正在处理的代码，你可以使用\
  \ `--full-refresh` 开关运行 dbt 项目。这会重新创建所有表，包括增量加载的表，因此虽然你会丢失一些历史数据（在开发环境中这无关紧要），但可以确保拥有最新的表定义。\n\
  \n一个简单的替代方案是直接删除开发环境中的一个或多个schema或单独的表，以便在下一次 dbt 运行时重新创建它们。\n\n关于分支切换还有一件事需要注意——切换分支完全没有问题，因为它可以用于检查和运行PR的代码，或在远程环境中进行辅导或结对编程，但未经事先同意，切勿在他人的分支中做更改。\n\
  \n如果你想向现有的功能分支提出更改，应使用你的Git提供程序，从要修改的功能分支创建另一个分支，然后在dbt Cloud中处理新分支，最后打开一个PR，将目标选择为功能分支。\n\
  \ndbt Cloud 托管工作流只允许你从主分支创建分支，因为这是通常的做法，并防止对Git理解不足的人使自己陷入复杂情况。但你可以从非主分支创建分支，并且你的Git提供程序允许的一切操作都可以进行；一旦创建了分支，你就可以在dbt\
  \ Cloud中正常处理它。\n\n## 推荐的Git分支命名\n\n在我们展示的工作流中，我们仅考虑了主分支或 master 分支以及功能分支的存在，其中隐含的理解是：主分支是长期分支，提供产品的当前版本；而功能分支是一次性、短期的分支。\n\
  \n对于开发分支来说，这完全没问题，但实际情况要复杂得多，而且通常你不仅仅拥有开发环境和生产环境。\n\n在下一章关于自动化中，你将看到在 dbt Cloud\
  \ 中，你可以创建环境并将它们与一个分支（通常是长期分支）关联。\n\n一种非常常见的情况是拥有三个环境：供开发者使用的开发环境、中间的集成环境和最终的生产环境。\n\
  \n\n\n\n让我们看看如何将分支与环境匹配，以及如何进行发布：\n\n- 1. 在开发环境中，每个开发人员都会按需在功能分支之间切换，并保持其数据库同步，正如我们在上一节中所见。\n\
  \n- 2. 因此，将主分支用作集成分支会很方便，我们通常将其命名为 CI（持续集成）或 QA（质量保证）。名称因组织文化而异，但功能是相同的——来自各功能的所有变更都会合并到这个分支中，它用于确保单独运行良好的功能能够继续协同工作。\n\
  \n   如果每个 PR 的代码都经过适当测试并执行了所有测试，这种情况本不应发生，但实际经验表明，出于种种原因，少量错误还是可能在 PR 审查阶段漏过。\n\n\
  \   你可以把集成分支视为矿井中维护成本低的金丝雀，它可以帮助你捕获大多数在 PR 流程中漏过的错误。\n\n   始终与最终生产环境保持非常接近或略微超前，有助于在细节仍在打磨时及早开始报表或外部集成的开发。\n\
  \n- 3. 最后，你可以创建另一个我们通常命名为 PROD 的分支，用于容纳从集成环境提升到生产环境的代码。\n\n   从集成到生产的代码提升是通过使用你的\
  \ Git 提供商将选定的代码合并到 PROD 分支来完成的。\n\n在大多数情况下，这种三分支设置是有效的，因为它让你既能高效地控制到生产的发布流程，又只需维护一个中间环境。\n\
  \n这在典型的内部项目中效果很好，因为组织通常希望在每个功能可用时就将其投入生产。\n\n在流程非常规范的组织中，或者在生产变更需要严格监控和沟通的情况下（例如正式版本控制或仅包含约定功能的定期发布），你可能需要根据情况添加额外的环境。例如，可以用“发布候选”来累积准备在某个版本中发布的变更，用“热修复”来测试应用于生产环境的快速修复。\n\
  \n在少数没有真正集成需求/风险的情况下，可以避免中间环境，而将 main 用于生产。例如，当只有一个开发人员，或者所有开发工作都是独立的（比如原样摄取和发布数据）时，就可能出现这种情况。直接进入生产环境时，你还需要能接受生产环境中偶尔出现的小问题。\n\
  \n## 采用频繁发布\n\n《敏捷宣言》的第三条原则说：“经常交付可工作的软件，周期从几周到几个月，倾向于更短的时间尺度。”\n\n我想说，鉴于《敏捷宣言》发布\
  \ 20 多年来生产力的提升，以及 dbt Cloud 带来的发布简化，即使保持迭代周期为数周，我们也能将更短的发布周期缩短到一周以内。\n\n在使用 dbt\
  \ 工作时，团队中大约每天完成一个 PR 并在集成环境中获得新功能，这是很常见的。这很正常，因为当开发人员完成了一个打开的 PR 的工作后，完成并将其合并到 main\
  \ 分支是标准做法。\n\n有时，我们发现生产环境发布并没有保持同样的节奏，因此我们利用本节来倡导尽可能频繁地发布到生产环境。\n\n使用上一节讨论的三个环境来发布项目的常规模式是，从\
  \ main 分支向 PROD 分支发起一个 PR，这意味着将集成环境中的所有代码提升到生产环境。\n\n理由有三点——首先也是最重要的，我们尽量保持集成环境与生产环境一致，这样发布规模小且风险低。其次，只有把我们在集成环境中一起测试过的内容发布到生产环境，才能假定所发布的功能能够协同工作。第三，将\
  \ main 提升到生产环境是把新功能发布到生产环境的更简单、更安全的方式。\n\n由于使用 dbt 工作的特性，多个功能通常可以独立发布，并在就绪时投入生产，即使它们只是一个更大功能的一部分，而这个更大功能只有在完整时才会在生产环境中使用。\n\
  \n一个典型的例子是为新报表构建数据集市组件，其中涉及的各个功能是：将基础实体带到 REF 层的管道，然后实现主数据转换和业务规则，最后发布到数据集市的视图。\n\
  \n鉴于上述考虑，我们建议一种工作方式：已批准的 PR 最晚在合并到 main 后的第二天发布到生产环境。\n\n一个良好的时间安排是：在完整的加载和测试周期（通常至少每天一次）完成后、合并任何新\
  \ PR 之前，将 main 提升到 PROD。\n\n这可以确保前一天合并的所有 PR 在完整加载时与代码库的其余部分一起正常工作。\n\n为了能够以这种方式进行，重要的是识别出那些需要在特定时机发布的\
  \ PR，并只在需要将其投入生产时完成它们。长时间保持一个 PR 打开，或将以后要发布的 PR 累积在“发布候选”分支中，会使团队面临这样的风险：这些代码可能因其他\
  \ PR 合并到 main 而需要更新。但重要的是，要防止将那些会阻塞 main 提升到 PROD 的 PR 合并到 main。\n\n将 main 提升到 PROD\
  \ 的替代方案是将各个开发分支合并或将提交拣选（cherry-pick）到生产环境，但这种方式是手动的、复杂且容易出错的，并且会失去集成环境带来的好处。\n\n\
  当有紧急事项（如修复）必须发布，但其他原因阻碍了 main 的提升时，可以使用这种手动选择过程。最终，你应该把修复发布到 main，并力求在可能的情况下，基于\
  \ main 的提升恢复正常发布流程。\n\n既然我们已经讨论了 PR，是时候创建一个了。\n\n## 创建你的第一个 PR\n\n为了完成本章，让我们看看在以\
  \ GitHub 作为 Git 提供商的配置下，如何创建一个 PR。\n\n请记住，只有当工作环境干净时才能打开 PR——也就是说，在最后一次提交后没有待处理的更改。因此，要创建\
  \ PR，请提交或还原所有更改。\n\n当你拥有干净的工作环境后，请按以下步骤操作：\n\n- 1. 要在服务提供商上开始创建 PR 的流程，请点击创建拉取请求按钮。\n\
  \n   ![](img/8868d272a75eee8b407a8e0f3434d10f_392_0.png)\n\n   图 11.6：创建 PR 的选项\n\
  \n- 2. 你将被引导到 Git 提供商的网站，进入开始创建 PR 并确认起始分支和目标分支的页面。分支将根据你在 dbt 中打开的分支预先设置为 **main**\
  \ 或 **master**。每个 Git 提供商的过程略有不同，但你始终需要确认起始分支和目标分支。\n\n   比较更改\n\n   选择两个分支来查看更改内容或开始新的拉取请求。如果需要，你还可以跨\
  \ fork 进行比较。\n\n   ![](img/8868d272a75eee8b407a8e0f3434d10f_393_0.png)\n\n   由于我们要将开发分支合并到\
  \ **main**，请点击**创建拉取请求**按钮。\n\n- 3. 下一步是为 PR 提供标题，并编写关于 PR 内容的良好描述。打开 PR 时还可以做的另一件事是指定一个或多个审查者，他们将收到新\
  \ PR 的通知，并被邀请对其发表评论。\n\n\n\n\n\n## 图 11.8：PR 窗口\n\n填写好标题和描述并邀请审阅者后，您可以点击 **Create\
  \ pull request**（创建拉取请求）按钮，此时 PR 即创建完成。\n\n5. 当您准备好完成 PR 并合并其代码时，请点击 Merge pull\
  \ request（合并拉取请求）按钮。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_396_0.png)\n\n\
  图 11.10：合并 PR\n\n6. 上一个表单将被新表单替换，您可以在其中编辑提交信息及其描述，但我们建议保持提交信息不变。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_396_1.png)\n\
  \n图 11.11：确认合并\n\n如果您没有改变主意，请点击 Confirm merge（确认合并）按钮。\n\n7. 确认合并后，表单将替换为一条消息，确认代码已合并且\
  \ PR 已关闭。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_396_2.png)\n\n图 11.12：合并 PR\
  \ 后的最终状态\n\n8. PR 合并后，更改已在 main 分支中生效，因此您可以刷新当前所在分支并点击 Pull from “main” 以拉取更改，或者您可以回到\
  \ main 分支并点击 Pull from remote 将更改拉取到 main 分支的本地工作目录中。\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_397_0.png)\n\
  \n图 11.13：检查分支的版本控制\n\n请注意，将更改拉取到刚刚合并的分支中，仅在您计划继续在该分支上工作以进一步开发该功能时才有用。通常，我们建议创建新分支。\n\
  \n现在您已经打开、完成并合并了第一个 PR，您可以看到该过程本身只是少量操作，需要几次点击即可将更改提交审阅、完成审阅，然后将其合并到主分支。除了在特定时间记录已提议并合并的更改之外，该过程本身价值不大。\n\
  \nPR 过程的价值在于团队的协作。如果您创建了 PR，但团队没有任何评论和参与，那么您并没有在协作，PR 过程也近乎毫无意义。\n\n## 小结\n\n协作是软件开发中至关重要的一部分，而像\
  \ Git 这样的版本控制工具使得协作编写代码和在团队中传播知识变得更加容易。\n\n本章介绍了如何使用 Git 和 dbt Cloud 简化协作工作流，重点讲解了分支和\
  \ PR。您还通过分步指南学习了如何创建第一个 PR。\n\n在下一章中，我们将学习如何利用环境和作业来自动化数据平台操作。\n\n## 延伸阅读\n\n使用\
  \ dbt 时，您不需要成为 Git 专家，但如果您想了解更多关于这一事实标准的信息，可以阅读 Scott Chacon 和 Ben Straub 编写、Apress\
  \ 出版的《Pro Git》一书，该书可在 https://git-scm.com/book/en/v2 免费在线阅读。\n\n如果您想探索 GitHub 的所有可用功能，可以查阅\
  \ https://docs.github.com/en 上的 GitHub 文档。\n\n关于敏捷开发，有大量书籍和网络资源，但我更喜欢 Henrik Kniberg\
  \ 在他的“来自一线”系列书中关于 Scrum、XP 和精益开发的实用风格。\n"
- "## 12\n\n## 部署、执行和文档自动化\n\n在本章中，您将学习如何通过设置环境和作业来自动化数据平台的操作，这些环境和作业会根据您的部署设计自动发布和执行代码。\n\
  \n您将了解通知系统，当作业被取消或失败（无论是由于错误还是测试未通过并产生错误）时，该系统会提醒相关人员。\n\n您还将了解文档、血缘图和源数据新鲜度仪表板，这些内容会根据项目\
  \ YAML 文件中提供的元数据自动生成。\n\n在本章中，您将学习以下主题：\n\n- 设计您的部署自动化\n- 高级自动化——钩子与运行操作\n- 文档\n\
  \n## 技术要求\n\n本章使用我们在本书第二部分构建的示例项目作为创建环境和作业的设置。\n\n本章的所有代码示例可在 GitHub 上的 https://github.com/PacktPublishing/Data-engineering-with-dbt/tree/main/Chapter_12\
  \ 获取。\n\n## 设计您的部署自动化\n\n在上一章中，我们讨论了如何在 dbt 中使用 Git。\n\ndbt 用户界面所倡导的流程平衡了交付速度、质量控制以及在团队中传播代码知识和指导经验较少同事的能力。\n\
  \n基本流程使用 main 分支来接收所有来自短期功能分支的更改，这些分支用于开发更改。\n\n开发人员在个人开发环境中的功能分支上工作，在该环境中他们可以从任何分支部署和运行代码。\n\
  \n最基本的设置仅适用于最简单的用例，只包含两个环境：一个公共生产环境（通过从 main 分支部署代码创建）和各个开发人员的独立开发环境。\n\n## 使用 dbt\
  \ 环境\n\n要设计您的部署策略，您可以使用 dbt Cloud 中可用的两种环境类型：\n\n- 1. **开发环境**，其中连接和部署 schema 委托给开发人员的凭据，为每个开发人员生成一个环境，dbt\
  \ 命令由开发人员在 IDE 中亲自执行。执行的代码是 IDE 中所选分支的代码。\n- 2. **部署环境**，其中连接、部署 schema 和要使用的代码分支在环境定义中配置，生成一个单一环境，dbt\
  \ 命令由作业使用配置分支中的代码执行。\n\n我们通常只配置一个开发环境（默认定义），因为它已经为每个开发人员生成了一个开发环境。我们根据设计部署策略的需要使用尽可能多的部署环境。\n\
  \n### 开发环境\n\n开发环境的定义在项目创建时自动生成，并使用开发人员的凭据为每个开发人员实例化一个物理环境。\n\n开发人员凭据中的连接详情（数据库、角色以及\
  \ Snowflake 的计算仓库）默认与项目的连接相同。我们建议在项目创建期间，将其设置为适合开发环境的方式。\n\n这样，开发人员只需提供他们的访问凭据并选择一个个人\
  \ schema 名称，即可拥有一个完全可用的开发环境。\n\n## 部署环境\n\n我们使用部署环境来创建通过作业和自动化维护的公共环境。\n\n在非常简单的情况下，您可以只定义一个指向\
  \ `main` 分支代码的部署环境。如果您未指定自定义分支，则将使用 main 分支。\n\n这非常简单，但仅适用于只有一两个开发人员、更改较少且没有重叠工作、并且数据平台偶尔停机也可以接受的情况，因为您只能依赖各个开发人员开发环境中的测试，而没有任何集成测试。\n\
  \n在这种简单设置中，一旦您合并 PR，代码就会立即部署，您的用户将在下次项目运行后看到更改。\n\n通常，您会希望创建更多环境，我们的常见设置是上一章中介绍的那种——一个连接到\
  \ `main` 分支的 QA 环境和一个连接到 PROD 分支的生产环境。\n\n在更结构化的设置中，如果使用许多长期存在的分支，例如具有发布分支的完整 Git\
  \ Flow，那么创建更多环境将是自然而然的。\n\n在 dbt 中，您可以创建任意数量的环境——没有限制。不过，通常环境是与组织中具有特定语义的长期分支相关联而创建的，例如我们的示例项目中代表生产环境的\
  \ PROD 分支。\n\n您可以将多个环境与同一代码分支关联。这可以服务于特殊情况：您希望在某个时间点冻结一个分支而不阻塞在同一分支上定义的其他环境，或者您希望在不同位置部署相同的代码。例如，这可以用于审计或压力测试，因为您不希望报告/结果在过程中途发生变化，但您也不想停止开发。\n\
  \n## 创建我们的 QA 和 PROD 环境\n\n在本节中，我们将使用示例项目创建两个部署环境。QA 环境将与 `main` 分支关联，而我们的生产环境将命名为\
  \ PROD，并将与我们将通过 GitHub 创建的 PROD 分支关联。\n\n\n\n\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_405_0.png)\n\
  \n图 12.2：“创建新环境”页面的“常规设置”部分\n\n在**常规设置**部分，你必须选择名称、要使用的 dbt Core 版本；如果你不想使用 `main`/`master`\
  \ 分支，还可以选择代码分支。\n\n- **3.** 向下滚动，你会看到“部署连接”部分：\n\n  ![](img/8868d272a75eee8b407a8e0f3434d10f_406_0.png)\n\
  \n  图 12.3：“创建新环境”页面的“部署连接”部分\n\n  在这里，你可以覆盖项目连接中配置的参数。\n\n  配置你要部署此环境的目标数据库名称，并选择在该数据库中为\
  \ dbt 提供适当访问权限的数据库角色。\n\n  你还可以选择使用哪个 Snowflake 计算仓库来运行此环境。这使你可以最终在不同计算仓库之间分配不同环境的负载。我们的建议是首先用一个计算仓库处理所有环境；如果需要更好的性能，再将最敏感的环境（通常是生产环境）迁移出去。\n\
  \n- **4.** 继续向下滚动，你会看到“部署凭据”部分：\n\n  ![](img/8868d272a75eee8b407a8e0f3434d10f_407_0.png)\n\
  \n  图 12.4：“创建新环境”页面的“部署凭据”部分\n\n  在这里，你必须配置 dbt 用于部署和执行环境时的服务用户及其密码。或者，你也可以提供用户名和密钥对。\n\
  \n  你必须输入该环境的目标 schema。当代码配置中未指定自定义 schema 时，它就是 schema 的名称；当为某个 dbt 对象指定了自定义 schema\
  \ 时，它又是实际 schema 名称的前缀。\n\n- **5.** 完成新环境的配置后，点击页面顶部的“保存”按钮。\n\n至此，我们创建了 QA 环境，它将在所选数据库（由于我们没有更改数据库，所以与\
  \ DEV 环境相同）上部署来自主分支的代码；当没有自定义 schema 时使用 QA schema 名称，有自定义 schema 时则使用 QA 前缀。\n\n\
  即使这对我们的示例场景来说有点小题大做，我们还是来创建一个名为 PROD 的生产环境，它将从 PROD 分支部署代码：\n\n- **1.** 同样，在 dbt\
  \ Cloud 页面顶部主菜单的“部署”菜单中选择“环境”条目，进入“环境”页面：\n\n  ![](img/8868d272a75eee8b407a8e0f3434d10f_408_0.png)\n\
  \n  输入 PROD 作为环境名称，选择要运行的 dbt 版本，勾选**仅在自定义分支上运行**复选框，然后输入 PROD 作为自定义分支名称。\n\n- **2.**\
  \ 滚动到页面的**部署连接**部分，按你的需要做出更改。\n\n  对于这个示例项目，我们认为将所有环境部署到同一个数据库，并使用相同的角色和计算仓库是没有问题的，所以我们不做任何更改，保留项目连接中配置的值。\n\
  \n- **3.** 继续向下滚动到页面的**部署凭据**部分，输入 dbt 使用的服务用户的用户名和密码，或输入密钥对。\n\ndbt 允许你将任何环境部署到你选择的数据库和目标\
  \ schema，让你可以自由地安排环境。\n\n主要的决策是：为每个环境准备一个独立的数据库，还是将部分或全部环境放在同一个数据库中，并通过目标 schema\
  \ 来区分它们。\n\n在 Snowflake 的情况下，两者差别很小，因为你可以轻松地跨数据库查询，同一角色也可以拥有跨多个数据库的权限。但在其他情况下，差别可能大得多。\n\
  \n如果你决定将 QA 和 PROD 环境放在两个不同的数据库中，我们建议两个环境使用相同的目标 schema，这样两个环境中的 schema 和表名将保持一致。\n\
  \n这将使切换客户端（如 BI 应用程序）变得非常简单，只需更改连接字符串即可让它们使用 QA 或 PROD。例如，这使你可以轻松地在 QA 中测试报表，然后通过更改指向的数据库将其切换到\
  \ PROD。\n\n在使用 dbt Cloud IDE 时，要运行哪些代码是很直接的：你要么为环境指定一个特定的自定义分支，要么环境将使用主分支。\n\n另外请注意，你可以使用\
  \ dbt Cloud API 在任何部署环境上启动作业。在这种情况下，你可以在 REST 调用中提供可选值来覆盖大部分环境设置。\n\n## 创建作业\n\n\
  既然我们已经创建了环境，现在是时候看看如何有效地部署代码了。这是通过创建运行 dbt 命令的 dbt 作业来实现的。\n\n本质上，dbt 作业就是一组你想在环境中运行的命令。\n\
  \n你可以选择要运行的命令，并使用 dbt 节点选择语法（所有细节请参阅 https://docs.getdbt.com/reference/node-selection/syntax）来决定每条命令应用于项目的哪一部分，从而用作业来组织数据平台的运行。\n\
  \n作业可以定时调度，由 dbt Cloud 内部调度器触发，也可以通过 API 调用来触发。如果你使用的是 dbt 与某个 Git 提供程序的集成（目前为 GitHub、GitLab\
  \ 或 Azure DevOps），那么当创建或更新拉取请求（PR）时，还可以通过 webhook 触发作业。\n\n## 设计你的平台执行\n\n作业是设计数据平台如何执行的基础组件。\n\
  \n你通过环境来决定部署到哪里；在一个环境内部，你通过作业来设计部署什么以及如何编排。\n\ndbt 中的编排包含两个方面：在作业内的命令里使用 dbt 选择语法来选择要运行的节点，以及通过定时器或\
  \ REST 调用来调度作业。\n\ndbt 选择语法利用 dbt 资源的依赖关系图（在 dbt 中显示为**血缘关系图**）以及其他模型元数据，来选择要运行的节点。然后，dbt\
  \ 会在遵循这些依赖关系的前提下运行它们。\n\n请记住，dbt 在执行命令时，始终会恰当地编排该命令所选节点的执行——范围从项目中的所有节点到一条单独的依赖链。\n\
  \n> **提示**\n>\n> 当我们讨论 dbt 命令和依赖关系图时，应当使用“节点”或“（dbt）资源”这一术语来指代所有类型的 dbt 资源，例如源（sources）、种子（seeds）、快照（snapshots）、模型（models）、测试（tests）、分析（analyses）和展示（exposures）。\n\
  >\n> 有时，我们使用*模型*这一术语，因为它们构成了节点中的大多数，而且开发人员对这个术语很熟悉。但请理解，大多数命令和配置适用于大多数节点类型，因此我们在这里使用的是通用含义。\n\
  \n因此，设计平台的编排是一种高层资源选择行为。它涉及使用高层选择语法挑选要执行的节点，然后让 dbt 按依赖关系运行节点，完成实际的底层编排。\n\n在实践中，你编写命令、选择命令所适用的节点，然后将它们按正确顺序放入作业中，以便按照你的设计运行作业，并让\
  \ dbt 在每条命令的执行过程中完成底层编排。\n\n为了保持较高的韧性，我们的建议是采用最简单且适合你的编排方式，通常是让 dbt 根据依赖关系运行所有内容。设置一个默认执行（几乎）所有内容的作业是一个很好的起点。\n\
  \n在下一节关于高级自动化的内容中，我们将看到 dbt run-operation 命令可以以 dbt 宏的形式，把数据平台上的任何操作添加到我们的作业中。通过在\
  \ run-operation 调用的宏中添加相关 SQL，我们可以执行任何任务，甚至超出常规 dbt 资源执行的范畴。\n\n这类任务是数据平台正常运营的一部分，例如数据库维护、数据摄取或抽取，以及其他例程操作。\n\
  \n\n\n\n\n如果您拥有非常昂贵的节点，每天构建成本很高，而它们只在每周或每月才发生变化，那么将它们排除在“正常日”运行之外是有意义的，并为在需要时执行此类资源设置一个特定的作业。\n\
  \n同样，如果您拥有需要更频繁运行或在特定事件发生时运行的资源，您可以为它们创建一个作业，并按需安排它们，或在事件发生时通过 REST API 调用启动它们。\n\
  \n在此基础作业中，我们希望执行所有资源。因此，如果我们使用旧式的低级 dbt 命令，列表可能如下所示：\n\n```\ndbt seed\ndbt source\
  \ freshness\ndbt test -select source:*\ndbt snapshot\ndbt run\ndbt test -exclude\
  \ source:*\ndbt docs generate\n```\n\n在上述代码中，我们加载种子。然后，我们测试源数据，以确保输入数据是新鲜的（根据我们定义过的\
  \ SLA）并符合我们的预期。\n\n一旦我们知道源是正常的，我们就运行快照和模型，并通过对除源之外的一切进行测试来完成运行。\n\n我们通过为项目生成文档来结束。在这些命令之前和之后，我们可能会运行操作命令来运行其他基于\
  \ SQL 的操作。\n\n让我们使用现代的 dbt build 命令为我们的项目创建基线作业：\n\n- 1. 从顶部的主菜单打开 Deploy 菜单并点击\
  \ Jobs 条目：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_413_0.png)\n\n图 12.7：Jobs\
  \ 页面和 Deploy 菜单\n\n进入 Jobs 页面后，点击右上角的 Create New Job 按钮。\n\n- 2. 通过输入其名称开始创建新作业：\n\
  \n## 图 12.8：Create New Job 页面\n\n我们建议以项目的名称或缩写、环境缩写开头，然后是作业的描述。这样，当您拥有多个 dbt 项目时，一旦收到通知，就能立即清楚哪个作业失败了。\n\
  \n4. 在下一节中，您可以控制一些执行设置。\n\n您可以在 dbt Cloud 取消作业后输入最大执行时间，但对于日常运行，我们通常将其保留为 0。\n\n\
  我们不会将执行推迟到另一个作业，因为我们希望在每次运行中都编译和构建所有内容：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_416_0.png)\n\
  \n图 12.10：Create New Job 页面的 Execution Settings 部分\n\n最后，我们激活复选框以在运行作业时生成文档并收集源新鲜度数据。在下一节中，我们将学习如何告诉\
  \ dbt 使用哪个作业来发布文档和新鲜度。\n\n5. 下一节是任何作业的核心，因为它就是您按 dbt 执行顺序列出 dbt 命令的地方：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_416_1.png)\n\
  \n图 12.11：Create New Job 页面的 Commands 部分\n\n作为替代方案，您可以使用 **Enter custom cron schedule\
  \ (UTC)** dbt UI 设置计划，这允许您输入 **cron** 配置字符串：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_418_0.png)\n\
  \n图 12.13：Create New Job 页面上有关 cron 调度的详细信息\n\n为了帮助自己，设置一个 cron 字符串来精确执行您想要的操作。您可以在\
  \ https://crontab.guru/ 上尝试并调整它。\n\n完成设置后，点击右上角的 **Save** 按钮。\n\n这样，我们就创建了一个新作业，它将根据我们的计划构建所有\
  \ dbt 资源，但当然，您也可以随时通过点击作业特定页面上的 **Run now** 按钮手动运行任何作业，您可以通过在 **Jobs** 页面上点击作业名称到达该页面。您可以通过主菜单中的\
  \ **Deploy** 下的 **Jobs** 条目到达它：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_418_1.png)\n\
  \n图 12.14：特定作业的页面\n\n作业页面提供了 **Settings** 按钮以便您编辑作业，以及 **Run Now** 按钮以便您立即排队执行一次作业。它还列出了有关作业的一些信息，例如下次运行的时间戳、使用的部署环境以及指向源新鲜度报告的链接。页面下方，您可以找到该作业的完整运行历史记录。\n\
  \n点击 **Run Now** 按钮启动作业的新实例。点击 **Run History** 区域中出现的新行以进入 **Run Overview** 页面：\n\
  \n图 12.15：作业的 Run Overview 页面\n\n现在我们的作业已成功运行并完成，在此过程中收集了源新鲜度并生成了自动文档，让我们看看如何使用它们。\n\
  \n## 设置构建文档和新鲜度报告的作业\n\n在 dbt Cloud 中，您可以浏览由项目结构、数据平台的内容以及 YAML 文件中开发者的输入自动生成的文档。\n\
  \n本章后面我们将更详细地研究为项目生成良好文档的方法。\n\n同样，dbt 可以生成一份关于项目源数据新鲜度的非常有用的报告。\n\n在这里，我们将集中讨论如何配置从哪个作业中选取生成的文档和源新鲜度数据。\n\
  \n这些是项目范围的配置，因此您必须通过右上角的齿轮菜单选择 Account Settings 来进入 Project Details 页面：⚙\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_420_0.png)\n\
  \n然后，在左侧菜单中选择 Projects 条目，并在 Account Settings 页面的 Projects 部分点击您的项目。\n\n进入 Project\
  \ Details 页面后，向下滚动到页面底部以找到 Artifacts 部分。\n\n打开 Documentation 下的下拉菜单以选择用于文档工件的作业：\n\
  \n图 12.17：Project Details 页面 Artifacts 部分中的 Documentation 下拉菜单\n\n打开 Source Freshness\
  \ 下的下拉菜单以选择用于源新鲜度工件的作业：\n\n图 12.18：Project Details 页面 Artifacts 部分中的 Source Freshness\
  \ 下拉菜单\n\n作为示例，+MODEL 将应用于 MODEL 及其父级，MODEL+ 将应用于 MODEL 及其子级，而 +MODEL+ 将应用于 MODEL\
  \ 父级和子级。\n\n`dbt cmd +mod_A mod_B+` 命令将应用于具有其父级的 mod_A，以及具有其子级的 mod_B，按正确的依赖顺序且不重复。\n\
  \n让我们创建一个执行依赖于 ABC_BANK_POSITION 源的作业：\n\n- 1. 从主菜单选择 **Deploy | Jobs** 进入 **Jobs**\
  \ 页面。然后，点击 **Create New Job** 按钮开始作业创建向导，就像我们在上一节为基线作业所做的那样。\n- 2. 在 **Create New\
  \ Job** 页面中，在 **General Settings** 部分将作业的名称输入为 `Portfolio Tracking - QA - Load new\
  \ position data`。\n  \n  在 **Environment** 部分选择 QA 作为环境，qa 作为目标名称，以及 12 作为线程数。\n\
  - 3. 移动到 **Execution Settings** 部分并按如下方式更改命令：\n  \n  ```\n  dbt build -s source:abc_bank.ABC_BANK_POSITION+\n\
  \  ```\n  \n  前述命令将构建命令应用于依赖于 ABC_BANK_POSITION 源的所有模型：\n- 4. 如果您愿意，可以为此特定作业添加计划，然后点击\
  \ **Save** 按钮。\n- 5. 如果您愿意，可以在作业页面上点击 **Run Now** 按钮以确认一切按预期工作。\n\n```\ndbt build\
  \ -s source:abc_bank.ABC_BANK_POSITION+\n```\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_423_0.png)\n\
  \n图 12.20：依赖于 ABC_BANK_POSITION 源的节点的血缘图\n\n您可以通过打开资源并查看 IDE 中的血缘图，或通过查看资源生成的文档中的图来可视化每个\
  \ dbt 资源的图。前面的屏幕截图显示了 IDE 中的血缘图。\n\n您现在已为项目添加了第二个作业，以执行刷新数据的专门任务，取决于一个源。\n\n同样，您可以创建一个刷新完整数据集市的作业，通过构建所有前驱，使用类似\
  \ `dbt build -s +marts.portfolio` 的语法。\n\n使用 dbt 设计您的数据平台编排意味着规划在正确频率下或在 REST 调用后执行哪些资源集合。\n\
  \n\n\n\n建议一如既往地保持尽可能简单，将具有相同频率的资源分组，使用选择语法编写弹性命令，将源系统（或特定源）和数据集市作为要运行内容的高级逻辑规范（不依赖特定模型名称），并使用图运算符来包含所需内容。\n\
  \n这通常归结为构建数据集市所需的一切，或构建依赖于某个数据源或一组特定源表的一切。效果可能因人而异，而且有充分的理由制定其他类型的选择。\n\n最后但同样重要的是，请记住，你可以将选择语法应用于任何\
  \ dbt 命令，因此你可以创建仅测试特定模型、源或数据集市的作业，并使用它们来通知相关人员最终可能出现的问题。\n\n## 特殊作业 – 完全刷新和临时命令\n\
  \n我们要介绍另一种类型的作业，你可以将其视为 IDE 命令行的等价物：一个在特定环境上执行特定一次性命令的作业。\n\n拥有这样一个作业的一些原因如下：\n\n\
  - 为了保持不同环境之间的一致性，我们不希望允许开发人员在其开发环境之外的任何环境上执行手动的、未经审计的 SQL 命令。经验表明，手动命令会导致环境不一致，进而违背了拥有这些环境的目的。如果没有完全一致的环境，在一个环境中运行良好的东西并不能保证在另一个环境中也能正常工作。\n\
  - 我们需要一种执行维护操作的方法。通常，我们可以使用 `run-operation` 来执行维护操作，下一节将介绍这一点，但在某些情况下，直接运行 dbt 命令更简单、更安全。\n\
  - 如果你使用变量或环境变量来驱动流程，你会在 YAML 文件或运行流程的定期作业中设置默认值。有时，你可能希望在不必编辑主定期作业的情况下，使用不同的参数进行一次有限的、特殊的运行。例如，可以考虑只重新运行图的一个子集，读取最近一个月摄入的数据，而不是像通常作业那样只读取最近几天。\n\
  - 当你想要清除旧数据或对模式应用更改（同时清除旧数据）时，可以进行特殊运行来重置某些增量表（使用 `-full-refresh` 选项）。另一种方法是编写迁移，这是一组用于修改表或其内容的\
  \ SQL 命令，我们将在下一节中看到。\n\n使用一个作业来执行所有这些特殊的、一次性的运行，可以让你很容易地回顾并找到这些特殊运行的详细信息，并且让你放心，执行及其日志都被存储并记录在案，而不是像另一种选择那样临时更改某些定期作业。\n\
  \n在我们的示例项目中，由于传入数据的变化是使用 dbt 快照功能处理的，因此我们还没有增量表。但是，在下一章中，我们将向你展示如何使用仅插入增量模型在云平台上提供更大的灵活性和更好的性能，使你能够处理大量频繁变化的数据。\n\
  \n让我们为这些特殊运行再创建一个作业：\n\n- 1. 从主菜单中选择 **Deploy | Jobs** 进入 **Jobs** 页面。然后，单击 **Create\
  \ New Job** 按钮启动作业创建向导，就像我们在上一节中为基线作业所做的那样。\n- 2. 在 **Create New Job** 页面的 **General\
  \ Settings** 部分，输入 `Portfolio Tracking - QA - manual runs` 作为作业名称。\n- 在 **Environment**\
  \ 部分，选择 QA 作为环境，qa 作为目标名称，12 作为线程数。\n- 3. 转到 **Execution Settings** 部分，并按如下方式更改命令：\n\
  - 4. 不要为此作业添加计划，因为它总是在编辑命令后手动运行一次。单击 **Save** 按钮保存作业。现在运行它没有意义。\n\n```\ndbt build\
  \ -s REF_POSITION_ABC_BANK --full-refresh\n```\n\n上述命令将对 REF_POSITION_ABC_BANK 模型应用带有\
  \ full-refresh 标志的 build 命令，该标志会重新创建增量表。由于这不是一个增量模型，full-refresh 选项不会有特殊效果，但在这里引入它是为了说明如何使用它。\n\
  \n我们已经创建了这个作业，因此如果你需要在 QA 环境上运行一次性命令，现在有了一种方便的方法。另外，请记住，目标是保持环境一致，如果我们只运行 dbt 命令，这要容易得多。我们建议为每个环境创建类似的作业。\n\
  \n## 设计数据平台的架构\n\n到目前为止，你已经了解了主要的 dbt 元素，这些元素通过决定部署什么、在哪里部署以及如何编排所有内容来描绘平台的架构。\n\
  \n让我们回顾一下影响架构的主要元素：\n\n- **环境**用于选择平台部署的主要部分，通过选择要使用的数据库、目标模式（环境中所有模式的前缀）、用于连接数据库的用户和角色，以及用于运行\
  \ dbt 命令的仓库来实现。\n- **作业**用于选择运行什么以及何时运行。使用作业，你可以编排数据平台的执行。\n- **主配置文件** `dbt_project.yml`\
  \ 与用于组织模型的文件结构一起使用，用于向环境提供的目标模式添加自定义模式，从而允许你将环境的表和视图划分为多个模式。\n- 对于非常大型的数据平台或你更倾向于使用松散耦合的域（而不是单体平台）来组合最终架构的方法（例如在**数据网格**中），你可以在自己的\
  \ dbt 项目中开发每个域，并使用源来清晰地声明依赖关系。\n\n现在，你应该能够使用上述元素来设计项目的架构，并根据你的意愿部署 dbt 生成的对象。\n\n\
  无论如何，请考虑这些元素提供的大多数设置可以通过使用 `config()` 宏或 YAML 文件中嵌入的配置来覆盖，因此保持一定的纪律有助于避免意外和让同事感到困惑。\n\
  \n## 通知\n\n有效的警报使你的数据团队能够主动掌握必然会发生的问题，并领先于你的（内部）客户，使你能够专业地做出反应并为他们提供服务，而不是在被当场抓住时忙于救火。\n\
  \ndbt 允许你通过电子邮件或 Slack 频道发送通知。\n\n在本节中，我们将向你展示如何设置适用于所有人且可根据每个 dbt 用户、项目和作业进行定制的电子邮件通知。我们将略过\
  \ Slack 通知，因为它们需要 Slack 订阅，并且是在账户级别设置的，会在所需的 Slack 频道中发送通知。\n\n让我们为示例项目设置通知：\n\n\
  - 1. 要设置通知，请从 dbt Cloud 右上角的齿轮菜单中选择 **Notifications Settings**：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_426_0.png)\n\
  \n图 12.21：打开的设置菜单\n- 2. 选择用户，以及要为其设置警报的环境，然后单击 **Edit** 按钮。\n- 3. 在 **Email Notifications**\
  \ 页面上，你现在可以使用复选框选择所选环境的哪些作业将在三种可用事件下向用户发送通知：作业成功、作业失败或作业被取消：\n\n## 电子邮件通知\n\n根据你的选择，dbt\
  \ Cloud 将向指定用户发送通知。\n\n为以下对象配置通知...\n\nRoberto Zagni - rz70rz70@gmail.com\n\n环境\
  \ QA\n\n| 作业名称 | 成功 | 失败 | 已取消 |\n|---|---|---|---|\n| Portfolio Tracking - QA -\
  \ Build all |  | ☑ | ☑ |\n| Portfolio Tracking - QA - Load new positio... |  | ☑\
  \ |  |\n\n图 12.22：电子邮件通知页面的详细信息\n- 4. 做出选择后，你可以单击 **Save** 按钮。\n\n这就是为你或添加到你的 dbt\
  \ 账户中的任何同事设置电子邮件警报所需做的全部工作。\n\n如果你的通知太多，可以使用一个按钮重置所有通知，如下面的截图所示：\n\n不想收到任何这些电子邮件？你可以通过单击下面的按钮取消订阅所有电子邮件通知。\n\
  \n取消订阅所有电子邮件通知\n\n图 12.23：电子邮件通知取消订阅按钮\n\n在下一节中，我们将介绍一些高级自动化功能。\n\n\n\n\n\n## 高级自动化\
  \ – hooks 和 run-operations\n\n有了环境、作业和配置，你可以使用一个或多个 dbt 项目来设计你的架构并部署和运行你的数据平台，但除了数据转换之外，还需要其他活动来保持数据平台的正常运行。\n\
  \n在本章中，我们将介绍两个高级功能：hook 和 run-operation 命令，以及后者用于处理 dbt 未处理的数据库迁移的使用。\n\n这两个功能都允许你执行任意的\
  \ SQL 来补充 dbt 转换。它可以是从创建用户函数到管理权限，或执行数据库特定的操作，如克隆、真空、创建共享或运行除创建表/视图和转换数据之外的任何其他命令。\n\
  \n这两个功能的主要区别在于 SQL 必须激活的时间：连接到某个模型生命周期还是独立于它。\n\n### Hooks\n\nhook 功能允许你将任意 SQL\
  \ 的执行附加到模型和项目运行生命周期的特定时刻。\n\n你可以直接将一段 SQL 放入 hook 中，也可以调用一个宏，该宏将返回要执行的 SQL，dbt 将在正确的时间执行该\
  \ SQL。\n\n可用的 hooks 如下：\n\n- **pre-hook**：SQL 将在构建其所附加的 dbt 节点之前运行\n- **post-hook**：SQL\
  \ 将在构建其所附加的 dbt 节点之后运行\n- **on-run-start**：SQL 将在 dbt 命令开始时运行\n- **on-run-end**：SQL\
  \ 将在 dbt 命令结束时运行\n\nHooks 允许你运行任意 SQL，但最常见的用途是为模型构建时应用权限。这仍然是一种实现你希望的对权限控制程度的方法，即使自\
  \ dbt 1.2 起可用的新 dbt grant 功能现在允许你以声明方式配置权限。\n\n经过一点创造性，我们在主项目的配置文件中配置了一个 post-hook\
  \ 来将运行时时间戳设置为我们 seed 中的 `LOAD_TS` 列：\n\n```yaml\nABC_BANK_SECURITY_INFO:\n  +post-hook:\n\
  \    - \"UPDATE {{ this }} SET LOAD_TS =\n      '{{ run_started_at }}' WHERE LOAD_TS\
  \ is null\"\n  +column_types:\n    LOAD_TS: TIMESTAMP\n```\n\n前面的片段在 seed 加载后更新\
  \ seed 表，用运行时间戳替换 `LOAD_TS` 列中的空值。所有行都是空值，因为我们在 seed 文件中没有提供任何时间戳。请注意，我们需要将列配置为正确类型；否则，Snowflake\
  \ 会将其推断为 Number 类型，这是当所有值都为空时的默认值。\n\n要使用宏为 hook 生成 SQL，请使用以下语法：\n\n```yaml\nsome_model:\n\
  \  +post-hook: \"{{ my_macro(this, 'a string') }}\"\n```\n\n前面的片段调用 `my_macro` 宏，同时传递两个参数：`this`\
  \ 变量，表示当前模型，以及 `'a string'` 字符串。宏将生成一个 SQL 命令，该命令将在 `some_model` 节点构建后执行。\n\n请注意，虽然你可以将\
  \ pre 和 post-hooks 附加到单个模型，但你也可以将它们附加到 `dbt_project.yml` 配置文件中的整个文件夹；hooks 将为该文件夹中的每个模型（及其子文件夹）执行。\n\
  \n我们见过 pre-hooks 用于删除正在由模型重写的增量表中的当前期间记录。虽然这在使用事务性数据库进行数据仓库时是众所周知的实践，但它与 dbt 以及现代列式云数据库的工作方式相冲突。我们鼓励你找到不同的模式，避免删除和更新，因为在云平台中它们比插入要昂贵得多。\n\
  \n虽然所有 hooks 都可以访问模型中可用的上下文，但请考虑 on-run-end hook 有一些额外的上下文变量：\n\n- `schemas` 变量包含\
  \ dbt 在当前运行中构建的模型所在的架构列表\n- `database_schemas` 变量与 `schemas` 变量类似，但包含 `(database,\
  \ schema)` 元组而不是架构名称\n- `results` 变量包含 dbt 在当前运行中构建的每个节点的 result 对象的列表。这对应于将填充结果\
  \ JSON 工件的数据。\n\n你可以利用 hook 可用的上下文来编写直接的 SQL 命令或使用此信息生成 SQL 的宏，或只是保存上下文信息。\n\n###\
  \ Run-operations\n\nrun-operation 命令允许你从命令行或作为作业的一部分激活宏，从而通过执行平台中可用的任意 SQL 命令并结合业务逻辑来扩展\
  \ dbt 功能。\n\n常见操作的示例如下：\n\n- **数据摄取：** 使用宏配置外部表，或从数据湖中驻留的文件摄取数据。我们将在 *第 15 章* 更深入地探讨此主题，在那里我们将讨论摄取模式。\n\
  - **迁移：** 对 dbt 未处理的数据库对象执行演进性更改，例如删除未使用的表或管理单个字段。以下部分介绍迁移概念以及如何使用它们。\n- **运行后操作：**\
  \ 一旦转换完成，你可能还想做一些额外的事情，例如管理权限、写入审计信息、分析表、生成额外文档等。\n\n你可以使用 hook 运行宏，但然后你需要将其附加到正在运行的节点。run-operation\
  \ 命令允许你独立于模型运行宏。你可能有一个作业只使用 run-operation 命令来运行宏，而没有模型。\n\n使用 run-operation 调用宏的语法如下：\n\
  \n```text\ndbt run-operation {macro} --args {args}\n```\n\n至少，你必须传递宏名称而不带任何参数。这使得使用\
  \ `dbt run-operation macro_name` 命令运行任何不需要参数的宏变得非常容易。\n\n如果需要传递或覆盖任何参数的默认值，你可以通过传递一个字典来完成，提供参数名称和参数值作为\
  \ YAML 字符串 – 例如，`--args '{arg_name: arg_value, arg_name2: arg_value2}'`。\n\n请注意大括号周围的引号，因为这必须是一个\
  \ YAML 字符串。\n\nhook 和 run-operation 命令之间的一个重要区别是，使用 hook，你必须传递 SQL，而使用 run-operation，你的宏会被执行，并且它必须明确执行所有所需的操作。因此，如果你想运行任何\
  \ SQL，你必须使用语句块或 `run_query` 宏来执行。\n\n后者使用起来容易得多，因为你将 SQL 作为字符串传递并获得结果，常见的使用模式如下：\n\
  \n```jinja\n{% set sql %}\n  -- write some SQL or generate it with logic\n{% endset\
  \ %}\n{% do run_sql(sql) %}  -- if you do not need the results\n{% set results =\
  \ run_query(sql) %}  -- if you need them\n```\n\n在前面的片段中，你使用 `set` Jinja 块来编写或生成你想要执行的\
  \ SQL 文本，然后调用 `run_sql` 宏并传递 `sql` 字符串。如果你不需要查询结果，可以使用 `do` 操作符；如果你想获取结果对象，可以使用\
  \ `set` 操作符。\n\n### 表迁移\n\ndbt 管理创建和维护数据平台中架构、表和视图所需的大多数 DDL 和 DML 命令，但在某些情况下，你可能想要做\
  \ dbt 未为你做的事情。\n\n最常见需要你自行管理的事情如下：\n\n- **删除不再使用的表和视图。**\n\n  例如，当你在运行后重命名模型时，具有旧名称的对象不会被\
  \ dbt 删除，因为它无法知道是否可以安全删除它。表可能包含有用的数据或仍可被其他系统使用。\n\n- **演进增量表。**\n\n  虽然普通表和视图在每次运行中都会重新创建，因此任何更改都可以轻松应用，但增量表是跨执行保留数据的表。无论你想重命名它们还是对其列进行操作，通常你不能简单地删除并重新创建它们；相反，你必须手动演进它们。\n\
  \n- **对数据执行批量操作。**\n\n  虽然在数据仓库中编辑/篡改数据不应经常发生，但在某些情况下你会想要编辑/修复或删除数据。一个例子可能是将表中的结束时间日期从\
  \ 2100-12-31 改为 9999-9-9。\n\n所有这些操作都可以通过编写简单的 SQL 语句来完成，例如 `drop table` 或 `alter\
  \ table`，开发人员应该被允许在开发环境中运行这些语句，但不应在共享环境如 QA 和 PROD 中运行。\n\n一旦资源在共享环境中发布，它就成为数据平台公共\
  \ API 的一部分，因此你必须明确管理其演进和最终删除，保证更改在环境之间保持一致，并在与每个环境的代码同步时发布。\n\n通过使用一些约定和在 run-operation\
  \ 激活的宏中进行一些脚本编写，你可以创建一个简单的设置，允许你快速编写所需的迁移。\n\n\n\n\n\n## 组织迁移\n\n每当我们需要运行迁移时，我们可以为它编写一个新的宏，并向作业中添加一个临时的\
  \ run-operation 命令来调用它，但这样做每次都需要大量手动工作，而且容易出错。\n\n我们提出了一种更好的设置：有一个名为 `run_migrations`\
  \ 的宏，总是在主作业开始时被调用，以便与代码运行保持同步，并且它会根据需要调用各个迁移宏。\n\n我们还建议通过创建一个 `migrations` 文件夹来组织迁移宏，该文件夹位于\
  \ `macros` 文件夹下，用于存放正在使用的迁移；并在其中创建一个 `ARCHIVE` 文件夹，用于存放过去使用过的迁移，如下面的截图所示：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_433_0.png)\n\
  \n图 12.24：迁移宏的示例组织\n\n`run_migrations` 宏将如下所示：\n\n```\n{% macro run_migrations(\n\
  \    database = target.database,\n    schema_prefix = target.schema\n) -%}\n{% do\
  \ log(\n\"Running V001_drop_example_table migration with database = \"\n~ database\
  \ ~ \", schema_prefix = \" ~ schema_prefix,\n    info=True) %}\n{% do run_query(V001_drop_example_table(\n\
  \    database, schema_prefix) ) %}\n{# do log(\"No migrations to run.\", info=True)\
  \ #}\n-- Remove # to uncomment if no migration to run\n{%- endmacro %}\n```\n\n\
  让我们来看看上面的 `run_migrations` 宏：\n\n- 它有 `database` 和 `schema_prefix` 参数，并且带有我们想要的默认值，因此除非出于某种原因需要覆盖它们，否则我们无需传递这些值。\n\
  - 对于每个要运行的迁移，都有一个 `log` 语句和一个 `run` 语句。`log` 用于在日志中显示正在运行的迁移以及所使用的数据库和 schema。\n\
  - 有一个被注释掉的 `log` 语句，用于在没有迁移需要运行时使用。\n\n我们还创建了一个示例迁移，名为 `V001_drop_example_table`，以展示命名约定，以及编写额外迁移并将它们添加到\
  \ `run_migrations` 宏中是多么简单：\n\n```\n{% macro V001_drop_example_table(\n    database\
  \ = target.database,\n    schema_prefix = target.schema\n) -%}\nDROP TABLE IF EXISTS\n\
  {{database}}.{{schema_prefix}}_STAGING.TABLE_XXX ;\n{%- endmacro %}\n```\n\n上面的示例迁移具有与\
  \ `run_migrations` 宏相同的参数，并示例了如何根据当前环境使用参数在正确的数据库和 schema 中运行 SQL 命令。\n\n通过使用这种简单的设置，所有开发人员都可以添加迁移，使表的演进与使用新表名和新列名的代码发布保持同步，从而让发布过程非常顺畅。\n\
  \n一旦迁移在所有需要的环境中完成了其编写目的，就可以将其从 `run_migrations` 宏中移除，并将文件移动到 `ARCHIVED` 文件夹。\n\n\
  ## 文档\n\n使用 dbt 的一大优势是，文档可以自动生成，或者开发人员只需极少精力即可生成。\n\n在本节中，我们将讨论以下与文档相关的特性：\n\n-\
  \ **血缘图**：这是 dbt 在 IDE 和生成的文档中向我们展示的项目中模型之间的依赖关系图。\n- **生成的文档**：这是一个自动生成的网站，使用人工提供和生成的元数据描述所有模型。\n\
  - **源数据新鲜度报告**：这是一个网页，检查源中的数据有多新鲜，并根据 YAML 文件中设置的 SLA 进行验证。\n- **Exposures（暴露）**：此功能允许我们描述仪表板或\
  \ ML 模型等外部对象对 dbt 管理模型的依赖关系。\n- **Markdown 文档**：这允许我们在所有描述字段中使用 Markdown，以生成格式整齐的文档。\n\
  \n通过使用并组合这些功能，我们可以为开发人员、业务人员和高级用户提供一种简单的方式来浏览和理解我们的项目以及我们创建的模型。\n\n### 血缘图\n\n我们在*第2章*结尾查看\
  \ IDE、默认 dbt 项目以及引入 `ref` 和 `source` 函数时，简要介绍了血缘图。\n\n血缘图以易于使用的方式展示了项目的**有向无环图（DAG）**。你的模型必须组织在不能有环的有向图中，这是\
  \ dbt 的一个关键特性。这促进了良好的开发实践，并允许 dbt 简单且可预测地管理执行。\n\n在文档方面，我们认为必须指出，编码时实时可用的血缘图可以节省大量脑力劳动，因为你可以使用它快速双击跳转到其他模型，无需搜索；同时，它还能让你直观地看到转换结构，而无需记住或创建和维护此类文档：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_435_0.png)\n\n在上面的截图中，你可以看到 seeds 和 snapshots\
  \ 的图标与 models 不同，并且我们拖动了节点表示以显示分层组织，例如 STG 和 SNSH 构成了暂存（staging）或存储层。\n\n血缘图也出现在生成的文档中，区别在于：在\
  \ IDE 中，你始终看到的是与当前打开的模型相连的模型血缘；而在文档中，你可以浏览项目的完整血缘图，也可以聚焦于单个节点，查看与 IDE 中相同的视图。\n\n\
  如果你使用 dbt Core，在编辑时不会有实时血缘图，这严重限制了你的工作便利性，但你仍然可以在生成的文档中访问相同的血缘：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_436_0.png)\n\
  \n图 12.26：生成的文档中项目的完整血缘\n\n文档中血缘图的一个有用特性是右键单击上下文菜单，它允许你快速重新聚焦于一个节点，或跳转到某个节点的文档并隐藏部分图。\n\
  \n另一个有用的特性是能够启用和禁用组成 dbt 血缘图的不同类型的节点。启用和禁用后，发生变化的节点会以灰色显示。\n\n最后但同样重要的是，在 tags、--select\
  \ 和 --exclude 输入框中，你可以尝试选择语法表达式，并直观地看到哪些节点被选中。这是尝试并查看你计划在命令中使用的复杂选择效果的便捷方式。\n\n\
  ### dbt 生成的文档\n\ndbt 与任何其他数据转换工具的标志性区别之一在于，它能够轻松地以极少的精力生成有用的文档，从而让你的数据平台更有价值，因为它可以被更广泛的用户更好地理解和使用。\n\
  \n基于 Web 的文档自动生成并不新鲜，Java 在九十年代就已经有了。\n\ndbt 的优点是让创建有用、最新且易读的文档变得简单，它从你的代码、测试、数据库中收集元数据和信息，自然也来自面向文档的特性，如\
  \ exposures 和描述属性：\n\n- YAML 文件中的 *源声明*。\n  你可以使用测试和描述来说明声明为源（sources）的输入数据，使输入要求/期望变得明确。\n\
  - 通过查询 *数据库* 收集的信息。\n  这提供了关于你的表的定量信息。\n- YAML 文件中定义的 *exposures*。\n  它们允许你描述模型在\
  \ dbt 之外的使用方式，并为这些外部报表/工具/ML 模型的用户提供丰富的数据集描述。\n\n在文档站点上，你可以通过点击右下角的圆形图标访问整体或特定模型的血缘图，如上一节所示。你可以将血缘图作为导航文档的第三种方式。\n\
  \n### 源数据新鲜度报告\n\n如果你的平台运行良好，所有测试都通过，但数据却是几天、几周或几个月前的，你的用户会满意吗？\n\n你是否每天都在检查所有输入数据的新鲜度？或者你是否可能收到一封不太友好的邮件，询问为什么某个报告中上周没有数据？你能快速找到哪些数据进入了这样的报告，以及哪个源数据已过期吗？\n\
  \ndbt 让你不再需要被动地解决这类问题，而是可以主动采取行动。\n\n使用血缘图，你可以快速查看任何数据集市（data mart）使用了哪些源，或者哪些源是任何模型的祖先；而借助我们接下来要介绍的\
  \ exposure 功能，你将能够定义哪些表为仪表板或 ML 模型提供支持。\n\n源数据新鲜度报告允许你定义**服务级别协议（SLA）**，以判断表内容是否足够新鲜，并在\
  \ SLA 未被满足时发出警告或错误：\n\n\n\n\n\n## 数据来源\n\n图 12.29：按系统划分的数据源新鲜度报告\n\n数据源新鲜度报告提供了一种快速简便的方式来检查传入数据是否存在问题，并且结合\
  \ dbt 在作业失败时发送警报的能力，当表的 SLA 未满足时发送警报，将错误通知给负责的人员/团队。操作非常简单，只需创建一个仅执行新鲜度检查并配置失败时需要通知的人员的作业即可：\n\
  \n图 12.30：按系统划分的新鲜度报告\n\n我们示例项目的报告显示，我们定义了两个系统，每个系统都定义了一个表。**abc_bank** 系统存在一些陈旧数据，而对于\
  \ **seeds** 系统，所有数据都是新鲜的。\n\n您可以在 YAML 文件中声明源系统时设置 SLA，通过设置阈值级别并命名时间戳列：\n\n```yaml\n\
  sources:\n  - name: seeds\n    freshness:\n      warn_after: {count: 3, period:\
  \ day}\n      error_after: {count: 5, period: day}\n    loaded_at_field: LOAD_TS\n\
  ```\n\n如前面的代码所示，您可以提供警告级别和错误级别，并且必须命名要与当前时间进行检查的时间戳列。\n\n与大多数 dbt 配置一样，您可以在系统级别设置通用\
  \ SLA，并为每个源表覆盖阈值和时间戳列。\n\n如果您设置了系统范围的 SLA，您可以通过将新鲜度设置为 **null** 来禁用不需要检查的表的新鲜度检查（例如很少更改的参考表），正如我们在以下片段中对\
  \ t2 表所做的那样：\n\n```yaml\ntables:\n  - name: t1\n  - name: t2\n    freshness: null\
  \   # no freshness for this table\n```\n\n数据源新鲜度报告可通过 **Deploy** 菜单的最后一个条目访问。\n\n\
  ![](img/8868d272a75eee8b407a8e0f3434d10f_441_0.png)\n\n图 12.31：包含 Data Sources 条目的\
  \ Deploy 菜单\n\n新鲜度报告也对使用读者许可证访问 dbt 的非开发人员用户可用，使其可供业务用户使用，同时提供生成的文档。\n\n## 暴露\n\n\
  Exposure 在依赖关系图中添加了一个终端节点，用于描述对某些特定 dbt 模型的外部依赖。\n\n在 exposure 的核心，是一个 dbt 模型的列表，暴露的依赖项依赖于这些模型。\n\
  \nexposures 的主要好处如下：\n\n- 为外部功能所依赖的列出模型提供一个清晰的名称，以便简单且一致地应用 dbt 命令\n- 能够为报告添加手动维护的文档到文档站点，并直接访问\
  \ exposure 所依赖的模型\n\n以下代码为我们由唯一的事实表和唯一的维度表组成的简单报告创建了一个 exposure：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_442_0.png)\n\
  \n图 12.32：为我们的示例项目定义 exposure 的代码\n\n让我们分析一下：\n\n- 您通过提供名称来创建 exposure，因此名称是强制性的。\n\
  \n  名称必须采用驼峰命名法，因为它可以用作任何 dbt 节点名称。\n\n- 您还需要提供外部依赖的类型。\n\n  外部依赖可以是任何东西，但可用的类型有\
  \ `analysis`、`application`、`dashboard`、`ml` 和 `notebook`。\n\n  类型用于在文档站点中组织 exposures，它们按类型分组。\n\
  \n- 最后一个强制字段是报告所有者的 `email` 字段，而所有者的姓名是可选的。\n\n- 最重要的是提供 `depends_on` 列表。\n\n  虽然是可选的，但它是创建\
  \ exposure 的主要原因，除非您只是想要一个可以在文档中手动编辑的页面。\n\n  您可以使用 `ref` 和 `source` 函数来构建列表，但您很少需要\
  \ `source` 函数。\n\n  在列表中，您只需列出外部功能所依赖的最终模型；构建它们所需的其他模型 dbt 会通过节点的 DAG 得知。在前面的屏幕截图中，我们列出了数据\
  \ mart 层的两个模型，dbt 显示了完整的血缘图。\n\n- exposure 的另一个关键组件可以是描述。\n\n  虽然您可以只输入一些简单文本，但当与\
  \ Markdown 文档块一起使用时，它成为提供易于使用且视觉上引人注目的文档的非常强大的方式。\n\n- exposure 节点现在将出现在所有血缘图中，无论是在\
  \ IDE 中还是在文档站点中的生成文档中。\n\n前一个 exposure 定义的结果显示在以下屏幕截图中，该截图通过使用 Markdown 文档块增强了报告内容的描述：\n\
  \n图 12.33：exposure 的生成文档\n\n在为 exposure 生成的文档页面中，您可以看到指向所有者的详细信息、通过使用 Markdown 文档块增强外观的描述，以及模型列表，只需点击一下即可访问。\n\
  \n血缘图也只需点击一下即可访问，其布局与 IDE 屏幕截图中看到的相同。\n\nexposures 在左侧导航中有专用的菜单，按类型分组。\n\n## Markdown\
  \ 文档\n\n在讨论 exposures 时，我们展示了使用 Markdown 文档块的结果。我们在谈论什么？\n\n在 dbt 中，您可以在 YAML 文件中描述的大多数元素中声明\
  \ description 字段。每当您可以输入描述时，您也可以使用文档块定义全部或部分内容。\n\n文档块是具有唯一名称的 docs Jinja 对象的定义，其中包含在文档站点中可视化时被解释为\
  \ Markdown 的文本：\n\n```\n{% docs exp_portfolio_report %}\n## Portfolio report\nThe\
  \ Portfolio report features are:\n* list all positions by account\n* provide up\
  \ to date valorization of positions.\n  The value is available\n  * in the position\
  \ currency, depending on the exchange\n  * in the account base currency, as set\
  \ by the owner\n{% enddocs %}\n```\n\n我们在 exposure 示例中使用的前一个文档块必须位于以 .md 结尾的文件中。它可以与您的模型位于同一文件夹中，名称由您决定。同一文件可以包含多个文档块。\n\
  \n要使用文档块，您可以使用 doc 函数以及块的名称：\n\n```\ndescription: |\n  The basic portfolio report.\
  \ Positions by account.\n  {{ doc('exp_portfolio_report') }}\n```\n\n前面的描述混合了普通文本和\
  \ doc 函数，使用 | YAML 块表示法，表示对多行 YAML 字符串的“逐字”解释。\n\n这很重要，因为 Markdown 中空行很重要，如果您改用\
  \ > YAML 折叠样式，新行将被空格替换，从而改变您的 Markdown，因此渲染输出也会改变。\n\n您也可以直接在表的描述字段、列或任何可能的位置中使用\
  \ doc 函数，但在此情况下，您可能需要引用 doc 函数：\n\n```\ndescription: \"{{ doc('exp_portfolio_report')\
  \ }}\"\n```\n\n每当您引用一个 Jinja 块时，请使用与用于文档块名称字符串的引号相反类型的引号。\n\n请注意，您可以直接在描述中使用 Markdown，而无需创建文档块。当您想要包含链接时，这很有用，如以下示例所示：\n\
  \n```\ndescription: \"See [the docs](http://www.docs.com)\"\n```\n\n提供易于使用且令人愉悦的文档可以提高您的高级用户充分利用您准备的数据集的能力。dbt\
  \ 允许您按您认为合适的方式提供文档。\n\n## 总结\n\n恭喜，您已完成本书的第二部分，现在了解了所有核心 dbt 功能以及如何使用它们！\n\n在本章中，您学习了如何部署和运行您的项目，以及如何使用高级自动化功能来扩展\
  \ dbt 以执行您所需的所有任务。\n\n您现在熟悉 dbt 功能及其广泛的文档功能，并且可以使用它们来提高项目的价值。\n\n在下一章 *Moving Beyond\
  \ Basics* 中，我们将开始介绍更高级的数据工程主题，例如身份和主数据管理或保存实体的更改，以及我们用于处理它们的 dbt 功能。\n\n\n\n\n"
- "## 13 超越基础\n\n在前几章中，我们讨论了数据工程的基本原则，我们对实用数据平台（PDP）的观点化方法，并使用 dbt 的基本和高级功能以其基本形式实现它。\n\
  \n在本章中，你将回顾在管道中应用模块化的最佳实践，以简化其演进和维护。\n\n接下来你将学习如何管理实体的身份，因为它对于存储其变更并应用主数据管理以合并来自不同系统的数据至关重要。\n\
  \n我们还将使用宏，即 dbt 最强大的功能，来实现存储和检索我们数据中变更的第一个模式，这与我们对身份管理的讨论一致。这使得所有开发人员都能使用资深同事开发的最佳实践。\n\
  \n在本章中，你将学习以下主题：\n\n- 构建模块化\n- 管理身份\n- 主数据管理\n- 大规模保存历史\n\n### 技术要求\n\n本章基于前几章的概念，包括基本的\
  \ dbt 函数，我们的目标架构的描述，以及示例项目。\n\n本章的所有代码示例均可在 GitHub 上获取，地址为 `https://github.com/PacktPublishing/Data-engineering-with-dbt/tree/main/Chapter_13`。\n\
  \n### 构建模块化\n\n到目前为止，你应该已经熟悉我们实用数据平台（PDP）的各层以及每一层的核心原则：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_448_0.png)\n\
  \n*Figure 13.1: The layers of the Pragmatic Data Platform*\n\n让我们快速回顾一下它们：\n\n-\
  \ **Storage layer:** 在这里，我们将传入的数据适配为我们想要使用的方式，而不改变其语义，并存储所有数据：好的、坏的和丑陋的。\n  \n \
  \ 核心原则是在这里隔离平台状态——即依赖于之前运行的模型，如快照或增量模型——以便下一层可以在存储层之上从头重建。\n  \n  视角是源为中心，每个源表对应一条加载管道。\n\
  \n- **Refined layer:** 在这里，我们应用主数据并实现业务规则。\n  \n  这里的核心原则是在构建更抽象和通用概念时应用模块化，这些概念建立在存储层中更简单、源为中心的之上。\n\
  \  \n  无状态、模式和清晰的名称避免了意外，使我们保持敏捷，并允许我们以最小的努力添加和演进业务规则。\n  \n  视角是业务为中心，或者更好的是，最终目标是拥有以业务术语表达的业务概念——最终还有中间概念，即使它们是由存储层中的源特定输入构建的。\n\
  \n- **Delivery layer:** 在这里，我们组织数据以便易于使用，具体取决于用户。\n  \n  这里的核心原则是为受众提供量身定制的数据集。\n\
  \  \n  仅提供有用且经过测试的内容——以业务名称公开，并在期望的格式和交付架构中，如星型模式或宽表——允许客户端用户或应用程序简单采用。\n  \n  在精炼层之上轻量构建使我们能够轻松地为不同受众，如营销或运营，提供相同数据的不同切片。\n\
  \  \n  视角是业务为中心，重点在于内容、命名和架构，以满足特定受众或业务领域。\n\n回顾各层及其内容，我们可以说模块化是通过提供组件来实现的，你可以用这些组件在模块化系统中构建管道。\n\
  \n这些组件可以以简单模式的形式提供，这些模式提供清晰的语义和一致的名称，以便清楚地了解模型的作用并确定其在管道中的角色，而不会产生疑问。\n\n模式通常可以作为宏实现，但在某些情况下，出于可读性的考虑，最好只是使用经过验证的布局并避免调用宏的间接性。\n\
  \n通过组合指导核心需求实现的简单组件，你可以构建管道并创建完整的架构。\n\n在以下部分中，我们将回顾一些我们已经看到的组件，并介绍一些我们稍后会看到的组件。\n\
  \n#### Modularity in the storage layer\n\n存储层受益于极大的可预测性，我们有一系列组件，允许我们遵循清晰的模式来构建管道的这一部分，自动化大部分代码创建，并通过交换可互换的组件（如\
  \ HIST 模型与快照）以多种不同方式实现该层。\n\n让我们回顾一下可用的组件：\n\n- **Seed:** Seed 的作用是轻松加载小型参考或手工维护的数据，这些数据不是来自特定系统，并且存储在小型\
  \ CSV 文件中。\n  \n  如果你计划直接使用 `ref()` 函数使用它们，我们建议将它们命名为 `SEED_xxx`，以便其功能非常清晰。如果你计划通过\
  \ `source()` 函数间接访问它们，CSV 名称就不那么重要了。\n\n- **Source definition:** 源定义的作用是以易于灵活管理的方式引用外部数据，通过命名输入组添加语义，并通过间接层提供灵活性。\n\
  \  \n  你可以通过按系统或逻辑子系统命名源来组织外部数据——即不由 dbt 模型管理的数据——同时保持表名不变以便于审计/测试。\n\n- **Snapshot:**\
  \ 快照的作用是存储输入实体中的变更，当你从源定期接收快照时。它是 dbt 的核心组件。\n  \n  一个关键限制是它是一个由所有环境共享的资源；另一个限制是需要完整导出以跟踪删除。\n\
  \n- **STG model:** 我们在整合多个组件和模式时介绍 STG 模型，每个模式都分为其 CTE，但你可以选择使用哪些组件，甚至将组件作为单独的模型链接：\n\
  \  - **Adaptation:** 此组件通过适配数据类型、重命名列、提取嵌套对象并应用硬数据修复，使传入数据尽可能可用。\n  - **Default\
  \ record:** 默认记录为维度提供一条记录，其中所有字段包括主键和描述列都具有默认值，用于在事实具有孤立外键时使用。如果它出现在变更存储组件之前，默认值中的变更也会被捕获。\n\
  \  - **Hashed:** 此组件定义并计算 HKEY 和 HDIFF 列，并在需要时生成 LOAD_TS 元数据列。\n    \n    HKEY 和\
  \ HDIFF 列提供了存储所用键的清晰定义以及实体版本变更的定义。由于这个原因，它们在多个模式中发挥着关键作用。\n    \n    为了简单起见，我们将\
  \ STG 模型呈现为单个模型，该模型通过读取源来实现我们所需的所有组件（因为我们的参考实现使用 HIST 组件代替快照），以获得性能、可扩展性，最重要的是，在环境之间获得更大的演进自由。\n\
  \n- **HIST model:** HIST 模型的作用是存储实体的变更。它使用仅插入策略构建缓慢变化维度类型 2 表，为实体的每个实例的每个版本提供一行。\n\
  \  \n  这是我们存储变更的默认实现，因为它性能高，并且很好地服务于表的当前状态及其所有变更。\n  \n  通过使用可感知删除的 HIST 变体，你可以有效跟踪删除并产生相同的存储布局，在下游使用时没有任何区别。\n\
  \n- **PII model:** 这种高度专业化模型的作用是将实际的 **Personally Identifiable Information (PII)**\
  \ 数据与正常转换分开存储，以便在交付层根据需要替换给授权人员，同时仍可用（例如，考虑 **GDPR** 的被遗忘权）。\n\n\n\n\n\n在存储层，清楚地知道需要做什么，这份组件和模型角色的清单使我们能够以不同的方式实现层目标，以最适合我们情况的方式组织这些逻辑组件。\n\
  \n在之前的章节中，我们将打算使用的所有组件都安排在一个 STG 模型中，因为在使用仅插入的 HIST 模型时这是最佳设置，而这正是我们目标架构所使用的。它提供了极大的灵活性、易于开发，并且与默认的\
  \ dbt 快照相比性能更好。\n\n如果你计划使用快照模型来存储变更，那么保持存储的内容与输入相同是有意义的，以最大程度地降低快照代码发生变化的可能性。这是因为快照是在所有环境中共享的组件。\n\
  \n在这种情况下，你可能在快照之前计算哈希值，甚至添加默认记录。然而，如果你担心适配组件的变更率更高，你可以将它移至快照之后，即使这样做可能会因在每次读取时应用复杂或缓慢的转换而带来一定的性能损失。\n\
  \n## 精炼层的模块化\n\n精炼层并不像存储层那样具有可预测性，但总体思路还是相当清晰的，并经历以下阶段：\n\n1. **精炼单个系统：** 初始过程是对来自每个独立源系统的数据进行组合和转换，包括使用本地特定的业务规则，直到达到与其他系统可比的抽象级别。在此过程中，它在可能的情况下用业务键替换本地代理键。\n\
  \n2. **主数据映射：** 此过程涉及应用主数据转换，将来自一个系统的代码转换为使其能够与更广泛的系统互操作。\n\n3. **主数据精炼层：** 这是我们正在寻找的“圣杯”。最终过程是对主数据映射的结果进行组合和转换，以生成一组业务概念，使用主数据代码表达，使我们能够计算全公司范围的业务指标并应用公司业务规则。\n\
  \n需要注意的是，如果你有大量遗留系统或由多次集成产生的系统，*步骤 1 和 2* 可以重复几次，逐步构建同质主数据代码域，其规模不断增大（*图 13.2* 的左侧）。这通常是为组织实体（如工厂、国家或地区）建立一定程度的通用报告而进行的渐进且通常部分努力的结果：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_452_0.png)\n\n当进行过全公司范围的主数据计划以将所有/大部分数据带到某种互操作性水平时，结果可能更接近\
  \ *图 13.2* 的右侧，从每个源系统直接转换为约定的主数据代码。\n\n在两种情况下，通常存在多个嵌套域和需要在每个域内应用的业务规则，以使数据通过表示相同概念而实现互操作。例如，考虑在不同国家/地区对不同税项或成本结构进行核算，以构建“人工成本”概念。\n\
  \n在前面的图中，我们突出了产生数据的源系统以及用于从一个“主数据”范围转换到下一个范围的映射表。然而，大多数转换通常与业务规则相关，正如我们之前讨论的那样。\n\
  \nREF 层的转换可变性最大，因为它是在此应用主数据转换和不同级别的业务规则的地方。尽管如此，我们仍可以识别出具有明确角色的以下组件：\n\n- **REF\
  \ 模型：** REF 模型的作用是表示特定上下文中的精炼实体，你期望它在该上下文中通常可重用，因为它代表了在该上下文中有用且相当完整的概念。\n\n  在构建公司级\
  \ REF 实体之前，通常会先构建较低域的 REF 实体；然后，利用业务规则和映射表，这些概念被用来组合更高级别的 REF 模型。\n\n  例如，通常会构建多个\
  \ `REF_<country>_CUSTOMER` 模型，然后再用来构建最终的全公司范围的 `REF_CUSTOMER`。国家级实体在构建更广泛实体之外也有用。\n\
  \n- **AGG 模型：** AGG 模型的作用是表示聚合的精炼模型。\n\n  不同的系统经常以不同的详细程度提供相同的概念，为了能够组合它们，需要通过在公共维度上聚合将其带到相同的粒度。\n\
  \n  AGG 模型的另一个驱动因素是希望减少输入到报表工具的行数，通过将事实表聚合到所需的粒度。\n\n- **MDD 模型：** MDD 模型的作用是表示直接来自主数据的维度，因此是一种“权威”的实体列表。\n\
  \n- **MAP 模型：** MAP 模型的作用是表示映射表，允许在系统/上下文之间进行代码转换。\n\n  这可以来自主数据工具，也可以计算得出，甚至手动创建。想法是它支持某种转换/翻译。\n\
  \n  这些模型的一个关键方面是在名称中明确表达它们执行的映射，使用诸如 `MAP_US_ITEM_TO_MD_PRODUCT` 之类的名称来同时表达上下文和被映射的实体。\n\
  \n- **TR 模型：** TR 模型的作用是表示中间转换。\n\n  与 REF 模型的主要区别在于，TR 模型被视为一个本身没有真正意义的中间步骤，很难被重用，因为它不代表某个通常有用的概念。\n\
  \n  TR 模型最接近私有模型。在重用 TR 模型时应谨慎，因为可能存在从名称或起始选择中无法明显看出限制。\n\n- **PIVOT 模型：** PIVOT\
  \ 模型的作用是通过对其他模型进行透视来获得模型。\n\n  这是一个非常专业的角色，像 AGG 一样，它提供与其它模型相同的数据，但通过透视对其进行重新组织。\n\
  \n虽然我们很难预测 REF 层将需要什么转换，但我们可以轻松识别我们将创建的大多数模型的作用。\n\n这个列表可能并不完整，因为命名是团队需要达成一致并决定强调哪个方面。例如，你将拥有关联或连接表，用于表示多对多关系。\n\
  \n你可能会将关联客户和已购产品的表命名为 `JOIN_PRODUCT_PURCHASED_BY_CUSTOMER`（嘿，这种关系通常称为发票或订单）或甚至 `REF_JOIN_xxx`，但在许多情况下，这些关系有业务名称，自然会将其称为\
  \ `REF_ORDER` 或 `REF_INVOICE`。\n\n- **DIM 模型：** DIM 模型的作用是表示 Kimball 风格的维度或层级。\n\
  \n  对于维度，或压缩在维度中的层级，其粒度为层级中最低元素的粒度，最重要的方面是拥有正确的代码以匹配数据集市中的事实。\n\n  维度的另一个关键特征是所有条目都由数据集市中事实的代码引用，以便事实不会出现孤立代码。\n\
  \n- **REPORT 模型：** REPORT 模型的作用是表示可为报表提供支持的表。\n\n  此类模型用于提供可为报表或 AI/ML 用例提供支持的宽表。名称也可能变化很大，因为事实和维度没有通用的命名方式。\n\
  \n  通常它不用于 Kimball 风格的数据集市，但可以存在于并行的数据集市中，用于其他工具或只是为了用磁盘空间换取性能。宽表是一个预先连接的数据集市，其中事实已经与所有维度连接。这在存储方面效率较低，但在查询方面效率要高得多，因此当你一次写入多次查询时可能值得。\n\
  \n- **FILTER 模型：** 这是一个专门的模型，其作用是使一个或多个事实如何基于仅存在于过滤模型所在特定数据集市中的需求而被过滤变得极其清晰。\n\n\
  \  如果过滤具有通用用途，则应将过滤器移至 REF 层并在那里应用于事实，以构建一个恰当地命名的新事实模型，同时考虑已应用的过滤。\n\n  使用此类模型主要有两个目的。第一个是使代码模块化并提高过滤的可见性，提供可在报表工具中使用的独立\
  \ DB 对象。\n\n  第二个目的是使维护过滤逻辑变得简单且明确。当过滤应用于数据集市中不止一个事实时，这一点尤为重要。\n\n在本节中，我们看到了认识我们编写某段\
  \ SQL 的原因有多重要，以及以逻辑流程构建模型并使用使我们所写 SQL 相对于该流程的角色清晰的名称。\n\n缺乏这种组织和模块化是数据仓库项目在变得庞大时变得难以管理的关键原因之一。\n\
  \n我们提供我们的模型类型和角色集合作为坚实起点，给予你更改它们并采用自己的名称和角色，甚至开发新角色的许可。只要在你的组织内部对它们非常清晰即可。\n\n\n\
  \n\n\n避免混淆和错误唯一的方法是在命名实体及其键时非常明确，甚至可能到了吹毛求疵的地步。\n\n以目录为例，我们或许应该将实体/表命名为 `CAR_MODEL`，其键命名为\
  \ `CAR_MODEL_CODE` 或 `CAR_MODEL_KEY`；而在交通场景中，我们可以将实体命名为 `CAR`，其键命名为 `CAR_CODE` 或\
  \ `CAR_KEY`。\n\n是的，`CAR_INSTANCE` 即使对我们来说也显得有点过于吹毛求疵了。\n\n## 时间序列语义\n\n另一种容易因语义不清而被误导的情况是：当我们想要追踪随时间变化的事物时。\n\
  \n在这种情况下，我们需要极其清楚地明确我们到底要追踪什么：是实体实例发生的变化（与变化发生的时间无关），还是要在特定时间点获取值（即使没有发生任何变化）。\n\
  \n第一种情况是使用实体的键来追踪实体变化的常规过程；而第二种情况下，我们构建的是值的时间序列。此时，键将由实体键加上时间键共同组成，具体取决于所需的周期。\n\
  \n一个常见的例子是商品库存追踪。\n\n在某些情况下，你想知道某种产品有多少（以及其他许多指标），并且只在其发生变化时进行记录。这种情况下，你会使用实体键来追踪变化。\n\
  \n在另一些情况下，你可能希望按给定的周期（日、周、月）追踪产品的指标值，无论指标是否发生变化。这种情况下，你需要通过组合实体键和周期键来构建复合键，从而追踪变化。\n\
  \n这两种方式相互关联，可以从一种表示转换到另一种；但如果你已经明确了自己的用例，最好根据所需的语义来命名表，并使用正确的键。\n\n## 不同类型的键\n\n\
  在本节中，我们将补充并扩展第3章在讨论实体-关系图时所提供的关于键的描述。\n\n在讨论键的字段名时，会用到 `CODE` 和 `KEY` 之类的术语，也会用到\
  \ `ID`（identifier 的缩写）和 `NUMBER`。\n\n与人类缺乏一致性相符（但人类也有应对这种不一致的能力），这些术语常常被混用且含义相同，因此你可能会看到名为\
  \ `CUSTOMER_CODE`、`CUSTOMER_KEY`、`CUSTOMER_ID` 或 `CUSTOMER_NUMBER` 的列。\n\n第一个也是最重要的区别在于键的可见性：\n\
  \n- **代理键（SK）：** 这是仅出于技术需要而存在的键，通常仅限于系统内部使用。`Hash_Key` 就是代理键的一个例子。\n- **自然键（NK）或业务键（BK）：**\
  \ 这种键既履行其技术角色，也在公开场合使用。它印在文档上，并在业务对话和文档中被引用。`Invoice_code` 就是自然键的一个例子。\n\n在我们的讨论和我们使用的命名中，我们倾向于用\
  \ `CODE` 来表示自然键，而用 `SK`（`SURROGATE_KEY` 的缩写）或通用的 `KEY` 来表示代理键。\n\n在许多情况下，我们看到的键名中带有\
  \ `ID` 或 `NUMBER` 作为名称的一部分。虽然这些命名本身并无不妥，但通常 `XXX_NUMBER` 字段已经不再是数字，而最初作为内部标识符的 `XXX_ID`\
  \ 后缀已变成了众所周知的业务键。因此，我们建议只使用一个名称来标识其可见性。如前所述，在这种情况下，我们倾向于使用 `CODE` 和 `KEY` 作为通用术语。\n\
  \n有趣的是，`NUMBER` 后缀让人联想到过去的技术要求：当时使用序列或自增生成的数字来生成代码是一种常见方式，而且这些代码对数据库处理也很高效。如今情况已不再如此，但这些字段名却在多次系统迁移中保留了下来。\n\
  \n第二个非常重要的区别基于键在表中的作用：\n\n- **主键（PK）：** 该键负责唯一标识实体的一个实例。表中具有相同主键的多行描述的是同一个实例。\n\n\
  大多数数据建模都是为操作型系统而做的，在这些系统中，你会不断更新某个实例的值，以便表中始终保存该实例的最新值。在这种情况下，主键在表中必须是唯一的，以保证只有一行描述实体实例的当前值。\n\
  \n反之，当表存储的是一个实例的多个版本时（就像我们在快照表和 HIST 表中所做的那样），仅靠主键本身就不再唯一了。唯一的是：主键加每个版本的时间戳的组合。\n\
  \n请注意你使用主键时的语义：这里我们描述的是“实体的主键”的含义——即标识实体的某个特定实例，这对信息管理至关重要。人们有时会说主键，但用的是“表的主键”的含义，这指的是表上的一个唯一约束。\n\
  \n如果我们有一个 `CUSTOMER` 实体，其 `CUSTOMER_CODE` 是该实体的主键，那么它也将是操作型系统中 `CUSTOMER` 表的主键，同时也是数据平台中只包含当前客户的所有表的主键。但是，`HIST_CUSTOMER`\
  \ 或 `CUSTOMER_SNSH` 表的主键将是 `CUSTOMER_CODE` 和 `LOAD_TS` 的组合。\n\n- **外键（FK）：** 这是与另一实体的主键相匹配的键。\n\
  \n外键是连接信息的基本方式，用于表达两个或多个实体之间存在某种关系。如果关系是可选的，外键可以为空；但如果关系是强制的，外键则不能为空。\n\n例如，当我们创建一条发票行时，它会为我们要连接的每个实体包含一个外键，例如\
  \ `CUSTOMER_CODE` 和 `PRODUCT_CODE`，此外还有 `PROMOTION_CODE` 等等。\n\n其中客户和产品是强制的，它们的代码不能为空；而促销是可选的，因此其代码可以为空。\n\
  \n到目前为止，我们讨论了键。我们使用的示例中键都是单一字段，但由多个列组成的键完全没问题。在这种情况下，我们常常通过将多个字段进行哈希处理来创建单列代理键，以简化我们的工作。\n\
  \n处理复合键最常见的情况是事实表。这些事实表是文档（如订单或发票）或业务事件，它们通常带有业务键或至少一个代理键。许多其他事实表没有主键，但通常可以通过使用事实表中的所有外键以及某些时间信息来构建一个主键，这些时间信息使我们能够区分同一外键的多个实例。\n\
  \n在某些情况下，例如追踪用户的页面浏览行为时，可能很难甚至无法区分在很短时间内发生的两次相同操作，因为我们无法构建一个稳定的键来标识“页面浏览”动作的每个实例。\n\
  \n如果我们无法为一个实体构建良好的、稳定的主键，我们就无法追踪该实体的变化，必须接受只能将所有接收到的实例作为独立的、不可变的实例存储起来。\n\n另一种遇到复合键的情况是：当我们需要处理那些并非为我们当前使用领域而设计的维度时，且我们没有主数据来进行适当的转换。在这种情况下，原始键可能不足以确保正确的识别，因此我们必须添加第二列来指示领域。\n\
  \n例如，如果我们有两个 `PRODUCT` 维度，分别由两个工厂或两个国家独立开发，并且没有主数据映射将代码转换为通用的 MD 代码，我们可以将两者合并来创建一个通用的\
  \ `PRODUCT` 维度。然而，由于仅凭 `PRODUCT_CODE` 可能发生冲突，我们需要在键中添加一个表示来源的第二列。这*并非*一个好的解决方案，因为同一个产品可能会以两个不同的代码（每个来源一个）出现两次，但在某些情况下，这是我们唯一能做的事情，我们必须接受这种技术债务。\n\
  \n\n\n\n\n## 键的主要用途\n\n在上一节中，我们看到实体的 PK 用于标识实体的实例，而 FK 则用于将实体的实例关联起来。\n\n键在以下最常见的操作中处于核心地位：\n\
  \n- **跟踪和应用变更**：PK 用于标识传入数据所属的实例，以便我们可以比较与已存储的内容相比是否发生了变化。\n\n- **提取当前或历史版本**：PK\
  \ 用于收集存储的所有版本并提取最新版本或在某个时间点处于活动状态的版本。\n\n- **连接数据**：通过将一个表中的 FK 与另一个表的 PK 相等来连接表，是我们在\
  \ REF 层中将所需数据跨现有关系组合起来的主要操作。\n\n通过将另一个表的 PK 作为表中 FK 来在表之间创建关系，是关系型数据库存在的最强大的功能。它是理解和设计数据模型的最重要能力。\n\
  \n你应该只在遵循直接的 FK-PK 关系或用于实现多对多关系的关联表的情况下连接表。在后一种情况下，对于起始表的每一行，你应该预期连接可能返回多行。\n\n\
  要警惕盲目地在两个表上通过共同的外键进行连接，因为这会直接导致我们在第 3 章中描述的深渊陷阱数据问题。\n\n- **引用完整性**：当我们在一个表中有 FK\
  \ 时，我们应该确保 FK 引用的实例存在于托管 PK 的父表中。如果没有 PK 与 FK 匹配，我们就缺少某些信息。在这种情况下，我们说该 FK 是孤立的，因为父表中没有对应的条目。\n\
  \n确保适当的引用完整性对于保证我们能够查询表并检索所有预期信息非常重要。\n\n这是事实表存储多个 FK 的常见情况，每个 FK 都指向一个父表，即维度。\n\
  \n现在我们已经了解了键是什么以及它们用于什么，让我们深入探讨如何使用主数据管理来扩展我们识别实体超出其初始域的能力。\n\n## 主数据管理\n\n当我们谈论主数据时，我们指的是组织核心的描述性数据，以及确保我们能够理解不同单元何时指的是同一概念实例的过程。\n\
  \n在很大程度上，主数据在数据平台领域与描述组织概念的维度重叠，例如客户、产品、员工等。\n\n我们很少有主数据维度时，它增加了包含“黄金记录”的语义，这些记录被选用来代表维度所代表的业务概念（即实体）的实例。\n\
  \n例如，产品 MD 维度（我们在 REF 层中称为 MDD_PRODUCT）包含产品的黄金记录，从用作实体 PK 的代码开始，并继续列出列的值。\n\n相当频繁地，我们只有一份\
  \ MD 代码列表，最终可能带有名称，以及映射表，允许我们将本地维度转换为 MD 代码，并利用数据从本地维度生成 MD 编码的维度，这要归功于业务规则。\n\n\
  当我们谈论主数据管理时，我们谈论的是在不同域之间管理主数据实体的流程和数据（MDD 和 MAP 表）。\n\n## 主数据管理的数据\n\n在主数据管理中，我们依赖两种类型的数据：\n\
  \n- **主数据维度（MDDs）**：这是包含业务概念“黄金记录”的维度。通常，没有完整的维度，而只有一份主数据代码列表，可能附带名称或描述供人工使用。\n\n\
  \  其有效性可能仅限于特定域，例如仅美国产品。\n\n- **映射表（MAPs）**：这是一个表，允许我们将一个域中的代码转换为另一个域中的代码——例如，将意大利产品代码转换为\
  \ EMEA 代码。\n\n  这些映射表是每个 MD 计划的核心，因为它们是使数据互操作性的工具。\n\n  它们可用于转换维度的代码，但其强大之处在于还可以将代码转换为事实，从而实现事实在不同域中的使用。\n\
  \n  映射表通常以业务键而不是代理键表示，因为它们没有业务含义。\n\n  对于每个映射表需要注意的一个关键要素是映射的*方向性*。概念在不同域中的基数不同是很常见的，因此映射不能是一对一且双向的。\n\
  \n  如果在本地域中，多个代码被用于在一段时间内标识主数据维度中的单个代码，那么所有这些代码都将映射到相同的 MD 代码，并且映射将是从本地域到 MD 域的多对一且单向的。\n\
  \n  如果一个国家对“通用箱 30x30x5 cm”产品使用多个代码，因为它们来自不同的供应商或在不同的工厂生产，但 MDD 只有这样一种产品，就会是这种情况。\n\
  \n  这也表明映射表可能使用多个列来跨域映射一个代码。以箱子为例，我们需要 MD 代码和生产工厂代码才能将 MD 代码映射到本地域。\n\n  这可能会让你感到惊讶，但映射表是需要的，而拥有所有或大多数概念的主数据维度并不常见。这很受欢迎，但不是必须的。\n\
  \n  即使我们只有映射表，我们也隐式地拥有一个最小的 MDD，它由映射表中出现的所有 MD 代码组成。在这种情况下，数据仓库中使用的维度是从本地维度派生的，并结合一些业务规则来决定从每个本地维度收集哪些数据，以及当数据可以由多个维度替代提供时最终的优先级。\n\
  \n## 使用 DBT 的轻量级 MDM 方法\n\n当我们在本章前面讨论模块化时，我们介绍了在跨域使数据互操作时我们会遇到的两种可能的极端情况。\n\n一种可能性是逐步将数据从一个域转换为下一个域，而另一个极端是直接将所有内容转换为更高级别的域，这通常被认为是目标主数据参考系统。\n\
  \n现实很少是黑白分明的，你会发现自己处于这样一种情况：对于某些数据，你必须经过几次转换步骤，而对于其他数据，你只需要一步。这种混合方法通常是这种情况，因为某些实体没有相同的语义。除此之外，对于主数据代码转换，需要一些规则来具有相同的定义并构建更广泛适用的概念版本。\n\
  \n让我们做一个简单的图形示例，以便更好地阐明 MD 转换过程的一个步骤。在我们的示例中，我们有两个系统，它们具有订单行数据，需要转换为某个主数据域以使其互操作：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_462_0.png)\n\n图 13.3：主数据转换的期望结果——来自 SYS1\
  \ 和 SYS2 的可互操作订单行\n\n在这里，我们从使用 SYS1 和 SYS2 键（业务键或代理键，将在后面讨论）编码的数据开始转换，使它们不可互操作。我们的目标是生成一个以期望\
  \ MD 域编码的模型，然后能够将它们组合以提供域级模型。\n\n当我们开始查看系统 1 的订单行时，我们可以看到它们没有业务键，只有代理键（SK）。\n\n\
  问题是 SK 仅在特定环境内有效，因此同一实例的 SK 在 DEV、QA 和 PROD 中不同，如果重新创建环境或维度，它也会发生变化：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_463_0.png)\n\
  \n图 13.4：当源数据使用代理键时应用 MD 需要进行的转换\n\n由于其性质，SK 对任何人都没有任何意义，并且可能随时更改，因此它们不会在主数据系统中使用。\n\
  \n主数据系统使用实体的 BK，因为它们对人们有意义并且在一段时间内稳定，以标识实体的实例。\n\n要检索实体的 BK，我们可以使用提供的 SK 连接其维度。\n\
  \n因此，我们的第一个操作是用相应的业务键替换源中拥有的代理键。\n\n在前面的图中，我们将源数据 CURR_SYS1_OLINES 与系统一的维度（TR_SYS1_CUSTOMER\
  \ 和 TR_SYS1_PRODUCT）连接起来，以生成 TR_SYS1_OLINES 模型，其中 SK 被 SYS1 BK 取代。\n\n\n\n\n下一步是将TR_SYS1_OLINES模型与每个需要从SYS1转换为目标MD域的业务键（BK）的映射表连接起来，生成REF_SYS1_OLINES模型，该模型使用MD域的业务键。\n\
  \n在本例中，我们假设只有客户和产品键需要转换，首先从SK转换为SYS1业务键，再转换为MD域业务键。很可能你需要转换的SK数量与此不同。例如，假设你有一个国家键。首先，你需要从SK转换为SYS1业务键，但如果SYS1已经使用国际国家代码，那么你可能已经在使用目标业务键，这意味着你无需再对国家键进行MD转换。\n\
  \n我们还希望你注意到，模型命名的主观性有多强，并且在很大程度上取决于我们对模型的预期用途。\n\n我们对维度使用了TR_前缀，因为它们以SK表示，因此在SYS1之外不具通用性。然后，我们将Order\
  \ Lines模型命名为TR_。这是我们放置SYS1业务键的地方，因为我们只打算使用域代码来构建报表，所以不认为它是可复用的。出于同样的原因，我们将下一个包含SYS1数据和DOMAIN业务键的模型命名为REF_。\n\
  \n从某种意义上说，我们总是使用MD域业务键来制作报表的假设，使我们仅将使用这种代码引用系统的模型称为REF_，所以我们不需要明确说明它是在什么域中的REF模型。\n\
  \n如果我们计划生成使用SYS1业务键的报表数据集市，那么我们应该将TR_SYS1_OLINES模型命名为REF_SYS1_OLINES，并将下一个包含相同数据但使用DOMAIN业务键的模型命名为REF_DOMxxx_SYS1_OLINES，以明确每个模型中使用了哪些业务键以及数据来自哪里。\n\
  \n最后这种命名约定有点冗长，但整体上更清晰。在决定如何命名模型时，请注意你的假设并将其公开。\n\n现在我们已经完成了系统一的转换，接下来看看系统二需要做什么：\n\
  \n![](img/8868d272a75eee8b407a8e0f3434d10f_464_0.png)\n\n图13.5：当源数据使用业务键时应用MD的转换\n\
  \n在我们的示例中，我们假设系统二已经在使用自己的业务键，因此我们不需要先用系统业务键替换内部SK。\n\n在这种情况下，我们只需应用转换的MD部分，将SYS2业务键转换为MD域业务键。\n\
  \n我们将其中一个映射表命名为`MAP_SYS2_ITEM_TO_DOMAIN_PROD`，以便在两个域中的概念不一致时使用。\n\n在我们的示例中，我们假设在SYS2中有`ITEM`的概念，它必须转换为MD域中的`PRODUCT`。这种转换所需的差异和业务规则可以是任意的，因此我们没有做任何特殊假设。然而，在这种情况下，仅靠映射表的查找可能不够，你需要实现更复杂的业务规则，并最终使用中间模型来简化计算，并让其他开发者清楚地了解正在执行哪些转换以及为什么要执行这些转换。\n\
  \n一旦你完成了两个源系统数据的转换，从而能够使用所需的MD域业务键，你就可以通过选择公共字段并应用最终的业务规则来生成并非所有输入中都立即可用的列，从而将它们合并在一起。在某些情况下，你可以添加中间步骤来执行这种适配。\n\
  \n一个简单的例子是，某些输入可能已经同时具有本币和所需记账货币的金额，而其他输入可能需要额外的一次转换，才能根据本币金额计算出记账货币金额。在这里，我们又回到了常规业务规则，而不是特定于MD转换的内容。\n\
  \n在本节中，我们讨论了如何应用主数据（MD）转换，使来自不同系统的数据能够互操作。在构建以多个数据源为输入的数据平台时，实现跨源数据互操作是迄今为止最重要的目标，因为这些数据源对某些数据使用不同的业务键。\n\
  \n在下一节中，我们将介绍一种高级的数据存储方式，用于存储我们在所有基于Snowflake或BigQuery等云数据库运行的项目中使用的输入数据。\n\n##\
  \ 大规模保存历史数据\n\n在*第6章*中，我们看到存储我们所处理的数据带来了许多好处，其中最大的好处是能够构建一个简单的平台，在该平台中，状态仅限于数据存储层，而精炼层和交付层是无状态的。\n\
  \n当时，我们介绍了dbt的快照（snapshots）功能，并向你展示了另一种基于增量模型存储变更历史的方式，它简单、快速，并且没有跨环境共享的架构限制：\n\n\
  ![](img/8868d272a75eee8b407a8e0f3434d10f_466_0.png)\n\n在本节中，我们将结合Pragmatic Data\
  \ Platform的三层架构，讨论我们首选的数据存储方式：HIST模型，它利用Snowflake最高效的特性来存储数据的所有版本。\n\n我们将创建HIST模型，因为它们简单、高效、灵活且富有弹性。无论你是希望存储变更、需要能够审计摄取的数据，还是只想要当前数据，它们都是最佳解决方案。\n\
  \n在本节后面，我们将向你介绍一个宏，它实现了保存输入数据的模式，以及如何使用它来创建HIST模型。\n\n现在，让我们首先讨论这种存储模式的主要优势：\n\n\
  - HIST模型使用仅插入（insert-only）操作保存版本变更，并提供最简单、可扩展的方式来保存数据，同时保留数据经历过的所有版本。一举两得！\n- 插入是现代云数据库上最高效的操作，而Snapshot使用的更新或删除性能较差。\n\
  - 列式格式在压缩数据方面表现出色，尤其是对于低可变性的列，因此你的版本将被高效存储。\n- HIST表实现幂等加载，允许你重复运行dbt项目。这为你的团队提供了弹性和工作的便利。\n\
  - HIST表以缓慢变化维度（slowly changing dimensions）这种通用且灵活的方式存储变更，允许你从仅使用当前版本开始，并在需要时转而使用所有变更。如果你想使用已存储的变更，无需重新加载数据或更改数据加载/存储方式。\n\
  - 即使是最简单的`save_history`宏实现，如果你每次加载每个业务键只收到一个变更，它也能提供完整的变更审计能力。你还可以使用其他版本来摄取每个业务键的多个变更并跟踪硬删除（hard\
  \ deletions）。\n- 它们都以相同的方式存储数据，因此你可以轻松使用它们。\n- 历史数据保存在普通的增量模型中，所有逻辑都委托给`save_history`宏。这使得使用它们就像使用其他模型一样简单，并且你可以像预览任何模型一样预览它们。\n\
  - `save_history`宏中加载模式的实现，使其能够被各级开发人员以最有效的方式使用。\n- `save_history`宏提供了多个参数，可在特殊情况下大幅提高加载性能，例如当你有一个适合作为高水位标记（high\
  \ watermark）的列时。\n\n我们建议你用HIST模型替换项目中的快照（snapshots）。这会让你的项目更灵活，并且能够扩展到巨型表。\n\n##\
  \ 理解`save_history`宏\n\n为了理解我们如何使用`save_history`宏（它实现了我们的通用加载模式）来存储历史，让我们先看看它在代码中的一般用法，然后分析宏中的代码。\n\
  \n## 创建HIST模型\n\n该宏的常规用途是创建HIST模型，从我们的STG模型中读取数据并保存。\n\n以下是`HIST_ABC_BANK_POSITION`模型的完整代码：\n\
  \n```jinja\n{{ save_history(\n    input_rel = ref('STG_ABC_BANK_POSITION'),\n  \
  \  key_column = 'POSITION_HKEY',\n    diff_column = 'POSITION_HDIFF',\n) }}\n```\n\
  \n是的，你没有理解错——这四行代码就是保存来自源数据的完整历史所需的全部内容。\n\n你可能想使用宏中提供的其他一些参数，但绝大多数HIST模型仅使用这种基本设置就完全没问题。\n\
  \n所有其他参数都可用于在不同情况下提高宏的性能，但只有对足够大的表才开始使用它们才是合理的。通常，这指的是表有数百万行、占用数GB存储空间的情况。\n\n\n\
  \n\n然后，我们有一行配置使模型增量：\n\n```jinja\n{{ config(materialized='incremental') }}\n```\n\
  \n请注意，通过不为 config 提供 unique_key 参数，我们指示 dbt 将我们 SQL 代码返回的所有行追加到增量模型中。\n\n该宏的设计基于\
  \ dbt 的 is_incremental() 宏，以便根据我们是否已有底层表或正在创建它来运行正确的代码。\n\n宏在增量表已存在且模型运行为增量模型的正常运行时返回\
  \ true；当目标表尚不存在时或运行为全量刷新运行时返回 false。这可以通过传递 --full-refresh 参数来实现，以从头重新创建表。\n\n```sql\n\
  WITH\n{%- if is_incremental() %}\n```\n\n如果我们已有目标表，对于每个 key，我们只需要将 HIST 表中存储的最新版本与传入数据进行比较，以查看哪些未发生变化且无需保存，哪些是新数据或已更改且需要保存。\n\
  \n```sql\ncurrent_from_history as (\n  -- get the current HDIFF for each HKEY\n\
  ),\n```\n\n通过确保 HDIFF 列包含源负载，包括实体的业务键，并仅排除元数据（以及我们不想跟踪更改的任何其他字段），它就充当唯一的 content\
  \ identifier。\n\n因此，我们可以在仅 HDIFF 列上进行等值连接，以在列式数据库中实现最有效的比较。\n\n```sql\nload_from_input\
  \ as (\n  -- join the input with the HIST on the HDIFF columns\n  -- and keep the\
  \ rows where there is no match\n)\n```\n\n当输入和 HIST 的 HDIFF 相同时，意味着我们已将该版本的数据作为最新版本存储。然后，我们需要仅从输入中加载\
  \ HDIFF 在输入和 HIST 表之间不匹配的行。这些是输入与当前或新数据不同的行。\n\n此加载模式的一个关键步骤是确保在输入和 current_from_history\
  \ 中，对于每个 key 只有一行。如果有多行，一个 HDIFF 永远无法匹配两个不同的 HDIFF，因此加载结果将不正确。current_from_history\
  \ 宏通过设计满足此要求，因此你需要确保输入按 HKEY 唯一。\n\n除非你需要完美的可审计性，否则你可以轻松地过滤传入数据，仅保留每个 key 的最新版本在输入中，使此要求在实际案例中几乎不是限制。\n\
  \n如果你需要在同一时间存储多个输入版本，也有一种模式版本可以处理这种情况，它稍微复杂一些，并且在大表上的性能较差，因为它需要在所有输入上运行窗口函数。我们将在第\
  \ 15 章中看到它，以及其他允许我们检测删除的变体。\n\n```\n{%- else %}  -- not an incremental run\n```\n\
  \n如果我们没有 HIST 表或想从头重新创建它，我们使用以下代码：\n\n```\nload_from_input as (\n-- load all from\
  \ the input\n)\n```\n\n在这种情况下，我们只需加载从输入到达的所有数据。\n\n```\n{%- endif %}\n```\n\n无论是增量运行还是非增量运行，我们都已准备好要保存到\
  \ load_from_input CTE 中的数据，因此最后一步只需从中读取所有内容：\n\n```\nSELECT * FROM load_from_input\n\
  -- ORDER BY option to optimize writes\n{%- endmacro %}\n```\n\n我们介绍的最后一个选项是在从 load_from_input\
  \ CTE 读取时添加 ORDER BY 子句，以便数据按所需顺序输出并写入磁盘，从而利用 Snowflake micro-partitions。\n\n现在我们已经了解了宏的总体流程，让我们深入详细地分析每个部分以分析实际代码。\n\
  \n## 分析 save_history 宏的参数\n\n以下是宏的完整声明，包括可选参数：\n\n```jinja\n{% macro save_history(\n\
  \  input_rel,\n  key_column,\n  diff_column,\n  load_ts_column = 'LOAD_TS_UTC',\n\
  \  input_filter_expr = 'true',\n  history_filter_expr = 'true',\n  high_watermark_column\
  \ = none,\n  high_watermark_test = '>=',\n  order_by_expr = none\n) -%}\n```\n\n\
  让我们逐一分析它们：\n\n- `input_rel` 参数是 `Relation` 类型的对象，如 `ref()` 或 `source()` 函数返回的那样，提供要保存的输入数据。\n\
  \n    在我们的 PDP 架构中，这通常是一个 STG 模型，它反过来从源读取，但任何有效的 relation 都可以使用。\n\n- `key_column`\
  \ 参数是一个字符串，其中包含要用作 key 的列名，以确定实例的最新版本。\n\n    此参数对于从 HIST 表读取数据至关重要，因为它允许我们识别表中存储的实体实例，从而选择最新版本，即“当前”版本。\n\
  \n- `diff_column` 参数是一个字符串，指定保存 HASH DIFF 列的列名。可以用它来比较表中存储的实体的不同版本。它必须包含实体 key。\n\
  \n- `load_ts_column` 参数是一个可选字符串，至少包含用于排序数据以了解当前内容的列名。\n\n    默认值为 `LOAD_TS_UTC`，指向数据添加到数据平台时的时间字段。它可以是任何在添加新、更近版本时递增的列。\n\
  \n- `input_filter_expr` 参数是一个可选字符串，其中包含用于过滤输入数据的 SQL 表达式。\n\n    默认值为 TRUE，表示不对输入进行过滤。此过滤器在增量和非增量运行中均适用。\n\
  \n    为了高效操作，过滤应用于输入模型，但该参数也允许我们使用来自 HIST 表本身的数据进行过滤。\n\n    另一个用例是当多个模型依赖于同一个输入模型时，这意味着过滤无法推回到输入模型，如实时\
  \ Lambda 架构的情况。\n\n- `history_filter_expr` 参数是一个可选字符串，其中包含用于过滤 HIST 数据的 SQL 表达式。\n\
  \n    默认值为 TRUE，表示不对 HIST 表进行过滤。此过滤器仅在增量运行中应用，因为它适用于 HIST 表。\n\n    此参数很少使用，因为通常你希望将输入数据与\
  \ HIST 表中所有内容的当前版本进行比较，即使它非常旧。\n\n    如果你知道更改不会追溯太远，例如在某些会计设置中，或仅影响数据的少数类别，你可以限制当前行，使其仅在\
  \ HIST 表的相关子集中。\n\n    在摄取事实表时，通常更改仅针对最近的日期出现，而远过去的更改极其罕见。在这种情况下，我们可以通过不从过去加载当前行来换取每日巨大的收益，以换取可能再次添加与非常旧版本匹配的行。无论如何，我们从\
  \ HIST 表读取的数据都是完全正确的。\n\n    此过滤器以相同方式用于输入，为我们提供了一个优雅的解决方案，当我们不能接受追溯太远的更改时，例如在旧的、已关闭的期间内我们不希望再看到任何更改。这可行，但使\
  \ HIST 与源对旧数据的可审计性失效。\n\n- `high_watermark_column` 参数是一个可选字符串，指定用于根据 HIST 表中该列的最大值过滤输入的列名。它不限制来自\
  \ HIST 表的当前值。\n\n    默认值为 none，表示不对输入进行过滤。此过滤器仅在增量运行中应用。\n\n    该列通常是指向表负载中 `LAST_UPDATED`\
  \ 类型的列或来自传输和摄取管道的 `EXPORTED_AT` 或 `INGESTED_TS` 类型的列的时间戳列。\n\n    任何随时间递增且我们不会有延迟到达风险的列都是一个不错的候选，与数据类型无关。\n\
  \n- `high_watermark_test` 参数是一个可选字符串，指定与 `high_watermark_column` 参数一起使用的比较运算符。\n\
  \n    默认值为 `>=`，表示具有与 HIST 中最大值相同的值的数据会保留在输入中并与 HDIFF 进行比较。\n\n    这是一个保守的假设，当高水位线是日期或周数或值比较粗糙的列时是有意义的，因为你可能有在上次摄取后到达的新数据具有相同的值。\n\
  \n    当使用时间戳列或某种批摄取 ID 作为高水位线时，建议你使用 `>` 进行测试，如果没有新数据具有与上次平台运行相同的值的风险。\n\n- `order_by_expr`\
  \ 参数是一个可选字符串，可以保存用于对流入 HIST 表的数据进行排序的 SQL 表达式。\n\n    默认值为 none，表示不对数据进行排序。\n\n\
  \    此参数对于组织保存到 HIST 表中的数据很有用，以便在从表中读取数据时利用 Snowflake micro-partitions。\n\n\n\n\n\
  \n```sql\n(select max({{high_watermark_column}}) from {{ this }})\n{%- endif %}\n\
  )\n```\n\n让我们详细分析这个 CTE 的代码：\n\n- 这个 CTE 的前三个子句（`SELECT`、`FROM` 和 `JOIN`）从输入模型中选择所有列，并将其与\
  \ HIST 表中的 HDIFF 列进行连接。\n\n  这里需要注意的主要是，只返回输入模型中的数据，并且 `JOIN` 是一个 `LEFT OUTER JOIN`，可能会保留输入中的所有行。\n\
  \n- CTE 的其余部分都与 `WHERE` 子句有关。\n\n第一个过滤器是最重要的，也是唯一需要的：\n\n```sql\nWHERE h.{{diff_column}}\
  \ is null\n```\n\n当 HIST 侧的 JOIN 列不为 null 时，这意味着输入的 HDIFF 与 HIST 的 HDIFF 之间存在匹配。这意味着这两个行代表同一版本，并且\
  \ HIST 已经有了它。\n\n当 HIST 侧的 JOIN 列为 null 时，这意味着该行要么是新键，要么是旧键的不同版本，我们需要将其存储。\n\nWHERE\
  \ 子句的第一部分只是保留我们想要存储的行。\n\n- 第二个过滤器允许我们无条件地过滤传入的数据：\n\n  ```sql\n  and {{input_filter_expr}}\n\
  \  ```\n\n  此过滤器允许我们移除我们不想保存到历史记录中的数据，但无法直接在输入模型中过滤掉。\n\n- 第三个过滤器用于应用高水位标记逻辑：\n\n\
  \  ```sql\n  {%- if high_watermark_column %}\n    and {{high_watermark_column}}\
  \ {{high_watermark_test}}\n      (select max({{high_watermark_column}})\n      \
  \ from {{ this }})\n  {%- endif %}\n  ```\n\n  if 条件确保在传递高水位标记列名时添加过滤器，因为没有它代码就没有意义。\n\
  \n  实际的 SQL 代码会生成一个简单的表达式，根据在 HIST 表中找到的 MAX() 值过滤所需列，如以下示例所示：\n\n  ```sql\n  and\
  \ LAST_UPDATED >=\n      (select MAX(LAST_UPDATED) from HIST_TABLE)\n  ```\n\n在前面的示例中，我使用\
  \ LAST_UPDATED 作为 high_watermark_column 参数的值，并使用 >= 作为 high_watermark_test 参数的值。\n\
  \n回顾一下，这个 CTE 的工作非常专注：连接输入与 HDIFF，只保留需要添加到 HIST 表的行。\n\n它还提供了两个额外的选项，通过过滤输入表来提高\
  \ JOIN 性能，这意味着需要比较的行更少。\n\n## 分析 load_from_input CTE – 非增量运行\n\n如果我们处于非增量加载中，这意味着我们要么还没有\
  \ HIST 表，要么我们想从头开始重新创建它。\n\n在这两种情况下，输入模型中的所有行都需要插入到 HIST 表中，因此我们的代码非常简单：\n\n```sql\n\
  load_from_input as (\n  SELECT *\n  FROM {{input_rel}}\n  WHERE {{input_filter_expr}}\n\
  )\n```\n\n我们唯一的选择是过滤传入的数据，以移除我们不想保存到历史记录中的数据，但无法直接在输入模型中过滤掉。\n\n在本节中，我们讨论了 save_history\
  \ 宏。在下一节中，我们将讨论 current_from_history 宏，它是从 HIST 表获取当前数据的接口。它也用于下游的 REF 模型以及保存宏本身。\n\
  \n## 理解 current_from_history 宏\n\n在上一节中，我们分析了用于存储实体变更历史的基本宏的内部工作原理。current_from_history\
  \ 宏用于从此类历史表中读取当前数据。\n\n在所有情况下，当我们提到 HIST 表时，我们指的是存储多个版本（由 HDIFF 区分）的表，按 BK（在 HKEY\
  \ 中哈希），跟踪版本添加到表中的顺序（LOAD_TS）。\n\n下表提供了 HIST 表的两个主要视图——按加载时间存储和按键逻辑——使用控制表内容的字段：\n\
  \n**按 LOAD_TS 存储数据：**\n\n| HKEY | HDIFF | LOAD_TS |\n|---|---|---|\n| key01 | ghi\
  \ | 2023-02-23 17:25 |\n| key01 | def | 2023-02-22 16:15 |\n| key02 | bbb | 2023-02-22\
  \ 16:15 |\n| key01 | abc | 2023-02-21 15:11 |\n| key02 | aaa | 2023-02-21 15:11\
  \ |\n\n**当前数据 / 按 KEY 的逻辑视图：**\n\n| HKEY | HDIFF | LOAD_TS |\n|---|---|---|\n| key01\
  \ | ghi | 2023-02-23 17:25 |\n| key01 | def | 2023-02-22 16:15 |\n| key01 | abc\
  \ | 2023-02-21 15:11 |\n| key02 | bbb | 2023-02-22 16:15 |\n| key02 | aaa | 2023-02-21\
  \ 15:11 |\n\n图 13.8：HIST 表中数据的存储视图和逻辑视图\n\n`current_from_history` 宏非常简单——它所做的只是按键和加载时间对数据排序，并为每个键获取顶部值。\n\
  \n例如，要从上一节中创建的 `HIST_ABC_BANK_POSITION` 模型中读取当前行，你只需要四行：\n\n```sql\n{{ current_from_history(\n\
  \    history_rel = ref('HIST_ABC_BANK_POSITION'),\n    key_column = 'POSITION_HKEY',\n\
  ) }}\n```\n\n让我们分析 `current_from_history` 宏的代码：\n\n```sql\n{%- macro current_from_history(\n\
  \        history_rel,\n        key_column,\n        selection_expr = '*',\n    \
  \    load_ts_column = 'LOAD_TS_UTC',\n        history_filter_expr = 'true',\n  \
  \      qualify_function = 'row_number'\n    ) -%}\nSELECT {{selection_expr}}\nFROM\
  \ {{history_rel}}\nWHERE {{history_filter_expr}}\nQUALIFY {{qualify_function}}()\n\
  \    OVER ( PARTITION BY {{key_column}}\n           ORDER BY {{load_ts_column}}\
  \ desc ) = 1\n{%- endmacro %}\n```\n\n从前面的代码可以看出，繁重的工作由 QUALIFY 子句完成，我们按所需键分区数据，并按所需列降序排序，以便我们保留的第一行是最新的。\n\
  \n查看宏声明，我们可以看到唯一强制参数是 HIST 模型的关联和 HKEY 列的名称。\n\n其他参数通过替换默认值提供灵活性。让我们讨论它们：\n\n- `history_rel`\
  \ 参数是 `Relation` 类型的对象，如 `ref()` 或 `source()` 函数返回的，指向 HIST 表。\n\n- `key_column`\
  \ 参数是用于将数据分区并获取当前值的键列名的字符串。\n\n  此参数提供了获取最新版本的粒度。它几乎总是与存储历史时使用的相同键，但任何比存储数据时使用的粒度更粗的键都可以使用。\n\
  \n- `selection_expr` 参数是可选字符串，列出从 HIST 表中检索的列。\n\n  默认值是 `*`，这意味着检索所有列。\n\n- `load_ts_column`\
  \ 参数是可选字符串，提供用于对分区数据排序的列名。\n\n  默认值是 `LOAD_TS_UTC`，这是我们在项目中的默认名称。\n\n  当 HIST 表还具有生效日期时，此参数可用于根据生效日期和加载时间获取当前版本。\n\
  \n  `load_ts_column='EFFECTIVITY desc, LOAD_TS '` 的值将对两个列进行分区排序。\n\n- `history_filter_expr`\
  \ 参数是可选字符串，提供用于过滤数据并告诉它在 HIST 表中查找当前版本位置的表达式。\n\n  默认值是 `true`，这意味着检索所有数据。\n\n-\
  \ `qualify_function` 参数是可选字符串，指定用于过滤 HIST 表的窗口函数。\n\n  默认值是 `row_number`，这意味着基于用于分区和排序的键返回最新行。\n\
  \n  当我们使用比 HIST 表中存储的数据粒度更粗的键时，我们可以使用其他函数来控制检索的数据。\n\n  例如，通过使用 `rank()` 函数以及 `MONTH(LOAD_TS_UTC)`\
  \ 排序列，你可以按每个键检索在数据最新月份中进行的所有更改。\n\n遵循我们在 PDP 中通常的工作方式，`current_from_history` 宏使从\
  \ HIST 表中读取数据成为一项非常简单的任务，你可以用 4 行代码完成，但它也提供了适应更高级需求的灵活性。\n\n\n\n\n\n通过串联 STG 模型、HIST\
  \ 模型以及 current_from_history 宏，你现在已经拥有了所有拼图碎片，可以构建一个简单且高度 resilient 的加载管道，该管道能够以高效且高度可扩展的方式调整、存储和提供全范围的入站数据以供业务使用。\n\
  \n在上一章中，我们将研究用于摄取数据并在具有更高级需求的情况下存储历史的模式，例如跟踪删除以及每次加载运行中的多次更改。\n\n但在此之前，在下一章中，我们将利用新获得的知识重构我们的示例项目，并使用\
  \ save_history 宏创建 HIST 模型，添加更多数据并实现一些业务规则。\n\n## Summary\n\n在本章中，你学习了如何基于经过深思熟虑的键构建模块化管道，这些键反映了实体的期望语义。\n\
  \n你学习了如何组合来自不同系统的实体，以及如何根据其语义以简单有效的方式存储其更改。\n\n凭借本章获得的知识，你现在能够构建现代、可维护且可扩展的数据平台，其中包含数百个实体，以及主表中数亿甚至数十亿行数据。\n\
  \n在下一章中，我们将完成示例项目并用它来讨论在交付真实项目时派上用场的几个更多主题。\n\n## 14\n"
- "## Enhancing Software Quality\n\n在本章中，你将发现并应用更高级的模式，以在真实项目中提供高质量的结果，并将尝试如何通过重构自信地演进代码。\n\
  \n通过围绕我们示例项目的一些小型用例的选择，你将学习如何以非常高效的方式保存实体更改的历史，如何从源中检测已删除的行，以及如何使用窗口函数利用存储在 HIST\
  \ 表中的数据来随时间分析数据演变。\n\n在本章的最后一部分，你将创建并应用一个宏，以使用自完成功能的维度正确处理事实中的孤儿键，从而为你的数据集市生成质量更好的事实和维度。\n\
  \n在本章中，你将学习以下主题：\n- Refactoring and evolving models\n- Implementing real-world code\
  \ and business rules\n- Publishing dependable datasets\n\n## Technical requirements\n\
  \n本章基于前几章讨论的概念、示例项目和宏。\n\n本章的代码示例可在 GitHub 上获取，地址为 https://github.com/PacktPublishing/Data-engineering-with-dbt/tree/main/Chapter_14。\n\
  \n## Refactoring and evolving models\n\n我们务实数据平台的核心思想之一是根据最小惊讶原则生产干净的代码和干净的结构，这反过来促进更快的发展、高度可维护性并降低开发人员压力。\n\
  \n为什么？因为数据库是任何公司中最长寿的应用程序，它们需要长期管理。因此，我们的管道需要随着业务变化、源系统变化，有时也为了合规或其他法律原因而变化和适应。\n\
  \n也许违反直觉的是，我们的数据产品越成功，我们收到的添加更多功能的要求就越多。所有更改的时间和成本直接受制于必须应用更改的代码的质量。\n\n在这一漫长旅程中，我们将有两项活动来保持项目相关性：\n\
  - **Evolution:** 这涉及添加新功能并保持现有功能按预期工作。不要把这句话的后半部分视为理所当然。\n\n  演进应利用模块化，在已有内容之上构建新概念，并始终为每个概念提供唯一的真相。\n\
  - **Refactoring:** 重构“*是一种有纪律的技术，用于重构现有代码体，在不改变其外部行为的情况下改变其内部结构*”，正如 Refactoring.com\
  \ 主页上 Martin Fowler 所说，他是我崇拜的编码英雄之一。\n\n  重构的核心是进行多次小的更改，保持项目正常运行，在每次小更改后进行测试，最终用保持按预期工作的更好代码替换初始代码。\n\
  \n在本章中，我们将首先重构现有代码，用我们最初使用快照的实现替换为在上一章中介绍的并作为长期解决方案更偏好的 HIST 表实现。\n\n本章后面，我们将添加一些更多功能，这些功能都经过了第一个可工作但粗糙的版本，然后重构为更好的解决方案。\n\
  \n你现在已经知道我们需要使用以开始将示例项目转变为简单、微小、不完整但逼真的项目所需的所有核心概念。它永远无法接近真实的东西，但我们希望我们拥有的东西是做得很好的。\n\
  \n## Dealing with technical debt\n\n在演进代码时，第一个目标和正常程序是创建一个可行的解决方案，并且包含检查我们交付内容的核心测试。\n\
  \n在正常情况下，最佳解决方案是在正常开发工作中不断清除少量技术债务，保持正常态度，使我们碰巧工作的代码保持良好状态。这通常被称为“童子军规则”，它规定如果你能做到，就应该让停留的地方比你找到时更好。\n\
  \n在本节中，我们了解到重构是交付项目的重要组成部分。那么，你的重构目标应该是什么？我们认为易读的代码、干净的架构和性能足够好的查询是重要的。\n\n## Tools\
  \ for refactoring in dbt projects\n\n让我们看看我们在项目中重构的基本工具：\n- **Code readability and\
  \ organization:** 我们通过为列、CTE 和模型提供良好的名称使代码更易于维护，并通过引入一次只执行一个步骤的 CTE 以及将大型模型拆分为一次实现一个目标的较小模型来改善其组织。\n\
  - **Tests:** 通用测试提供了第一道防线，以保证我们接收和生成的数据质量良好并符合预期。\n\n  单个测试可以提供业务规则正确性的定点验证，检查转换结果是否为预期结果。\n\
  \n  初始解决方案上通过的测试必须在每次重构后继续通过。\n- **Data auditing:** 一旦我们使初始解决方案正常工作，我们可以保存已验证的结果，然后在开发环境中保持输入冻结的同时，将其与每次重构步骤的结果进行比较。\n\
  \n  审计更改的过程可通过 `audit helper` 包大大简化：https://hub.getdbt.com/dbt-labs/audit_helper/latest/。\n\
  \n我们已经看到，为了保持项目健康，你必须不断演进它以提供新功能，同时不断重构它以保持代码整洁。\n\n在下一节中，我们将对示例项目中的代码进行一些增强，包括重构，我们将从一个可以改进的解决方案开始。\n\
  \n## Implementing real-world code and business rules\n\n在本节中，我们将提供许多真实代码示例，用真实项目代码替换初始示例代码并实现一些业务逻辑，即业务规则，并添加一些额外数据，展示更改是如何存储的。\n\
  \n第二，我们将用 `REF_ABC_BANK_SECURITY_INFO` 模型中的 `HIST_ABC_BANK_SECURITY_INFO` 表替换 `SNSH_ABC_BANK_SECURITY_INFO`\
  \ 快照：\n1. 在暂存文件夹中创建一个名为 `HIST_ABC_BANK_SECURITY_INFO` 的新文件并添加以下代码：\n\n```\n{{ save_history(\n\
  \    input_rel = ref('STG_ABC_BANK_SECURITY_INFO'),\n    key_column = 'SECURITY_HKEY',\n\
  \    diff_column = 'SECURITY_HDIFF',\n) }}\n```\n\n输入代码并点击 **Save** 按钮。然后，点击 **Build**\
  \ 按钮或运行 `dbt build -s HIST_ABC_BANK_SECURITY_INFO` 命令。\n2. 编辑 `REF_ABC_BANK_SECURITY_INFO`\
  \ 模型，使其使用 HIST 表作为输入代替快照。\n\n以下是 `current_from_snapshot` CTE：\n\n```\ncurrent_from_snapshot\
  \ as (\n    {{ current_from_snapshot(\n        snsh_ref = ref('SNSH_ABC_BANK_SECURITY_INFO'),\n\
  \    ) }}\n)\n```\n\n将其替换为 `current_from_history` CTE，如下所示：\n\n```\ncurrent_from_history\
  \ as (\n    {{ current_from_history(\n        history_rel = ref('HIST_ABC_BANK_SECURITY_INFO'),\n\
  \        key_column = 'SECURITY_HKEY',\n    ) }}\n)\n```\n\n完成后，保存并构建模型。\n\n你可以在本书关联的存储库中的\
  \ *Chapter 14* 材料中找到使用 HIST 模型的完整 REF 文件代码。\n\n我们现在已经创建并部署了两个 HIST 模型，并重构了 REF 模型以使用来自\
  \ HIST 模型的数据。现在，血缘图如下所示：\n\n![](img/8868d272a75eee8b407a8e0f3434d10f_484_0.png)\n\
  \nFigure 14.1: Lineage graph after the last refactoring\n\n\n\n\n\n我们现在可以删除或禁用不再使用的快照。\n\
  \n要禁用快照，请在快照声明内部添加 `{{ config(enabled=false) }}` 行。你也可以将 enabled=false 参数添加到现有的\
  \ config 定义中，但我们认为将其单独放在一个 config 中更清晰。\n\n你现在可以从数据库中移除快照表。\n\n请注意，正如你所写的那样，你不需要任何额外权限即可删除快照的唯一现有副本，该副本由所有环境共享，并且可能抹除重要的生产数据，破坏生产环境。\n\
  \n让不同的环境由不同的角色拥有并可写是一种常见策略，以确保 QA 和 PROD 保持安全并以受控的方式更改，使用 dbt 命令或迁移。这是拥有每个环境一个 HIST\
  \ 表的更好解决方案的另一个原因。没有任何开发用户可以抹除 QA 和 PROD 的 HIST 表，它们将不受干扰地继续工作。\n\n## 向 HIST 表添加测试\n\
  \n当我们使用 HIST 表时，有三个测试是我们想要实施的：\n\n- 1. HIST 表主键的唯一性，该主键由存储在 HIST 表中的实体的 HKEY 属性和\
  \ LOAD_TS_UTC 组成。\n  \n      除非我们使用高级 HIST 宏在一<|message|>次摄取运行中摄取同一键的多个版本，否则我们希望每个键每个加载时间戳只有一个版本。\n\
  \  \n- 2. 检查 HKEY 是否不会产生哈希冲突。\n  \n- 3. 检查 HDIFF 是否不会产生哈希冲突。\n\n让我们看看 `HIST_ABC_BANK_POSITION`\
  \ 模型的测试：\n\n```\n```yaml\n- name: HIST_ABC_BANK_POSITION\n  tests:\n    - dbt_utils.unique_combination_of_columns:\n\
  \        combination_of_columns:\n          - POSITION_HKEY\n          - LOAD_TS_UTC\n\
  \  columns:\n    - name: POSITION_HKEY\n      tests:\n        - no_hash_collisions:\n\
  \            hashed_fields: ACCOUNT_CODE, SECURITY_CODE\n    - name: POSITION_HDIFF\n\
  \      tests:\n        - no_hash_collisions:\n            hashed_fields: \"{{ as_sql_list(\n\
  ```\n\n```\n['ACCOUNT_CODE', 'SECURITY_CODE',\n 'SECURITY_NAME', 'EXCHANGE_CODE',\
  \ 'REPORT_DATE',\n 'QUANTITY', 'COST_BASE', 'POSITION_VALUE', 'CURRENCY_CODE'\n\
  ]    } }\"\n```\n\n你可以在本书关联的仓库的 *第 14 章* 材料中找到完整的 `staging.yml` 文件，以及两个 HIST 模型的测试。\n\
  \n一个重要的考虑是，为了使这次重构成为一次良好的重构，我们项目的行为不应改变，因此我们更改为从新的 HIST 模型读取的 REF 模型上的测试应像以前一样继续通过，以及下游模型的测试。\n\
  \n## 重命名 `REF_ABC_BANK_SECURITY_INFO` 模型\n\n查看 REF 层中两个模型的名字，我们可以看到 `REF_POSITION_ABC_BANK`\
  \ 模型的名字更偏向业务，因为它把概念放在前面，然后才是源/主数据代码宇宙的名字。\n\n另一方面，`REF_ABC_BANK_SECURITY_INFO` 模型仍然更偏向源/MD\
  \ 宇宙中心，因为它把名字放在前面。\n\n这两种命名方式都有意义，在某些情况下，你可能会同时使用两者，因为你可能需要从一个源中心的 REF 模型开始，然后应用\
  \ MD 和一些规则将其转换为更偏向业务的 REF 模型。\n\n在我们的示例案例中，我们只处理一个银行/源系统，我们的两个 REF 模型都没有代理键，只有业务键。我们没有\
  \ MD 键集，所以我们决定采用概念优先的命名。\n\n因此，让我们重命名 `REF_ABC_BANK_SECURITY_INFO` 模型并通过创建迁移来清理旧表：\n\
  \n- 1. 将 `REF_ABC_BANK_SECURITY_INFO` 模型重命名为 `REF_SECURITY_INFO_ABC_BANK`，在 IDE\
  \ 中选择 **Rename**。\n  \n- 2. 重命名 YAML 文件中的表，其中包含测试和描述。\n  \n- 3. 在 `DIM_SECURITY`\
  \ 模型中更改对重命名表的引用。\n  \n      你可以使用 lineage 图来查看依赖关系。\n  \n- 4. 点击 **Build** 按钮以运行并部署具有新名称的表。\n\
  \  \n      所有模型和测试都应正确执行，确认我们的重构已完成并且运行良好。\n  \n- 5. 在 `macros/migrations` 文件夹中创建一个名为\
  \ `V003_drop_table_with_old_name` 的文件，以保存删除旧名称表的迁移代码。\n\n将以下代码添加到迁移文件中：\n\n```\n\
  ```jinja\n{% macro V003_drop_table(\n        database = target.database,\n     \
  \   schema_prefix = target.schema\n) -%}\nDROP TABLE IF EXISTS {{database}}.{{schema_prefix\n\
  \    }}_REFINED.REF_ABC_BANK_SECURITY_INFO;\n{%- endmacro %}\n```\n```\n\n此宏将生成删除表的代码。\n\
  \n- 6. 通过向其中添加以下代码，将迁移添加到 `run_migrations` 宏中：\n\n```\n```jinja\n{% do log(\"Running\
  \ V003_drop_table migration with database = \" ~ database ~ \", schema_prefix =\
  \ \" ~ schema_prefix, info=True) %}\n{% do run_query(V003_drop_table(database, schema_prefix))\
  \ %}\n```\n```\n\n此宏将在数据库上运行所有活动迁移的 SQL 代码。\n\n你现在可以通过执行 `dbt run-operation run_migration`\
  \ 在你的开发环境中运行活动迁移。\n\n为了确保它也在 QA 和 PROD 中运行，请验证主作业（“Build all”）是否包含 `dbt run-operation\
  \ run_migrations` 作为第一个命令。\n\n## 重构 `run_migrations` 宏\n\n查看 `run_migrations` 宏，我们可以看到当我们想要添加一个新迁移来运行时，我们需要添加两行：一行用于日志，另一行用于实际调用将运行我们迁移宏生成的\
  \ SQL 代码的 `run_query()` 宏。\n\n这两行的驱动因素是迁移宏的名称和其他参数，因此有意义将所有这些代码重构到一个宏内部，该宏只需接收参数，生成如下调用：\n\
  \n```\n```text\nrun_migration(\"V003_drop_table\", database, schema_prefix)\n```\n\
  ```\n\n主要问题是迁移宏的名称被使用了两次，首先作为日志中的字符串，其次用于调用宏：\n\n- 第一次使用很容易重构，因为我们可以用宏名称获取字符串，并且很容易将其传递并在日志中使用。\n\
  \  \n- 第二次使用名称是宏调用。幸运的是在 Jinja 中，我们可以像在 Python 中对函数那样分配、传递和调用宏对象。\n\n它将排除事实中在维度中没有匹配的行。\n\
  \n因此，我们在 `refined.yml` 文件中有 `REF_POSITION_ABC_BANK` 事实和 `REF_SECURITY_INFO_ABC_BANK`\
  \ 维度之间的关系测试。在测试通过之前，我们是安全的，但我们的安全取决于输入。\n\n另一个重要原因是 `null` 值会使我们的指标不可靠/不可预测。例如，包含\
  \ `DISTINCT` 的 SQL 查询，这些查询经常由 BI 工具创建，会有意外的行为。\n\n看下面两个查询：\n\n```\nSELECT DISTINCT\
  \ c1, c2 FROM t1\n-- 选择所有具有不同元组的行\n-- null 的存在会使元组不同\nSELECT COUNT(DISTINCT c1,\
  \ c2) FROM t1\n-- 选择值组合的计数\n-- null 不是值，包含 null 的元组不被计数\n```\n\n如果 c1 或 c2 中有 null\
  \ 值，则第一个查询返回的行数将与第二个查询返回的计数不同。这与大多数 SQL 开发人员的常见预期相反。\n\n例如，如果你想分析订单中使用的促销代码，如果未使用促销时促销代码为\
  \ null，就很容易发生这种情况。\n\n你可能会使用第一个查询并正确获取客户代码和促销代码的所有组合，或所有订单中使用的所有促销代码，包括 null，但如果你或你的\
  \ BI 工具在计算中使用类似第二个查询的东西（例如计算占总数的百分比），你将只计算使用促销的情况，从而使计算错误。\n\n在下一节中，我们将回顾事实和维度不匹配的原因，然后介绍两种确保我们始终安全的方法。\n\
  \n## 理解事实和维度不匹配的情况\n\n在大多数情况下，我们期望 FK 会匹配相关维度中的 PK，但也有不匹配的情况。\n\n让我们看看可能的情况：\n\n\
  - 1. **错误 1 – 未找到/维度中数据缺失。**\n  \n      这是典型的事实中存在孤儿的情况——即事实有一个正确的 FK，但在维度中找不到。\n\
  \  \n      本节后面我们将介绍两种处理这种情况的方法。\n\n\n\n\n\n+   2. **错误 2 – 缺失/事实中数据缺失。**\n\n  \
  \    当你在一个强制关系中有一个外键或复合外键的一部分为 `null` 时，就会发生这种情况。事实中缺少了强制数据。\n\n      在我们的管道中，这应该由源上的测试或至少在\
  \ STG 模型上进行测试来检查，如果我们需要修复某些 `null` 值的话。在这种情况下，最好引入一个特定的默认记录来突出显示事实中缺失的数据，并在 STG\
  \ 模型中将 `null` 替换为默认记录键。如果缺失数据将来得到修复，较新版本的事实将成为 HIST 表中的当前版本。\n\n+   3. **暂缺 – 暂时缺失/尚不可用。**\n\
  \n      在某些情况下，事实会随时间变化，事实中的某些数据尚不可用，例如仍在准备发货的订单的运输公司或发货日期。\n\n      当事实处于某个已知状态而外键为\
  \ `null` 时，就会发生这种情况。这是原本属于错误 2 的一种特殊情况，但该情况仅在事实生命周期的部分阶段有效。为了与错误 2 区分，您可以创建一个单独的默认记录。\n\
  \n+   4. **不适用 – 可选，未提供数据/不适用。**\n\n      当我们在可选关系中没有数据时，就会发生这种情况。这通常表现为可选关系中外键等于\
  \ `null`。\n\n      您可以在 STG 模型的加载过程中处理此问题，方法是将 `null` 值替换为“不适用”默认记录的键。\n\n前面的讨论提出了令人信服的理由，说明为什么一个维度中可以有多个**默认记录**。\n\
  \n维度中不同默认记录的数量取决于您希望多精确地记录事实与维度之间不匹配的原因。\n\n简单的解决方案是使用一个默认记录，通常主键为 -1，用于所有情况，但在希望更精确的组织中，至少在某些情况下会这样做（为某些表添加一些额外代码）。\n\
  \n## 用默认记录替换孤立记录\n\n前面列表中的情况 2、3 和 4 通常直接在 STG 模型中处理，或者在 REF 层早期处理，只要所有用于区分情况 2\
  \ 和 3 的业务规则所需的数据可用即可。\n\n处理前面列表中情况 1（即事实中的孤立记录）的经典方法是将孤立外键替换为指向正确默认记录的外键。这确保了事实中的所有外键都指向维度中的条目。\n\
  \n> **重要说明**\n> \n> 将事实中找到的原始外键永久替换为某个默认记录的主键，尽管非常常见，但问题很大，因为这相当于丢失信息。主要维度的缺失键看起来不好。\n\
  > \n> 我们可以在 REF 模型中这样做，因为它们是无状态的，每次运行都会重新创建。原始外键安全地存储在 HIST 表中，每次运行时，仅当原始外键不存在于当前维度中时才会被替换。\n\
  > \n> 这仍然看起来不好，并且在修复维度之前，您无法使用丢失的键。\n\n与大多数在所有层都基于增量加载的传统数据平台不同，我们可以对所有非增量加载的事实使用这种简单解决方案，而不会永久丢失数据，并且我们可以确信始终使用来自事实和维度的最新数据。无论如何，我们将在数据集中市中提供较少可用的数据。\n\
  \n这种加载的另一个问题是性能。它通过强制在事实之前构建所有维度的 REF 模型来限制流程的并行性，而事实将与之连接。这浪费了现代架构中能够执行大规模并行计算的某些性能。\n\
  \n考虑到尽管 Snowflake 在连接方面表现出色，但数据大小本身也有其特点，而事实往往是最大的表。如果我们进行增量加载，则不能使用这种加载模式，因为会丢失数据；如果我们进行正常的全量加载，连接非常大的表将花费时间。\n\
  \n那么，我们的解决方案是什么？\n\n简单但较差的解决方案是将这种外键替换保留在 REF 层，并接受在增量加载的事实上最终一致性，方法是按可接受的时间间隔对这些事实表执行\
  \ `full-refresh` 运行。希望全量刷新运行能够通过将完整事实表与维度中的最新数据连接时找到迟到的维度条目来解决问题，而我们的数据丢失只是暂时的。\n\
  \n更优越的解决方案称为**自完成维度**，即将正确的数据保留在事实中，独立于每个维度加载它们，而是将事实中的孤立外键添加到维度中，为事实中的每个孤立外键复制一个默认记录来补全它们。\n\
  \n这第二种加载模式更好地保持了并行性，因为它可以应用于事实和维度的 REF 模型之上，即使它们是增量加载的，并且可以利用 Snowflake（和其他列式数据库）从一列中提取不同值列表而无需扫描所有数据的卓越能力。\n\
  \n在数据集中市中构建维度时（通常比事实小得多，可以每天重建），我们可以从连接到维度的事实中获取不同外键的列表，并为维度中（尚）不存在的外键创建新条目。添加的外键将具有与所需默认记录相同的值。\n\
  \n鉴于以上讨论，我们认为识别已删除的位置并实施硬业务规则来为已关闭位置设置所需的值是有意义的。\n\n因此，在本节中，我们将展示并讨论用于识别和评估已关闭位置的代码。\n\
  \n另一种方法是使用带删除的历史记录的通用加载模式（我们将在下一章中介绍），以泛化我们在此讨论的代码，然后设置已关闭位置的值。\n\n这最后一个操作可以通过创建一个依赖于带删除的\
  \ HIST 表的 ref 模型，或使用 post-hook 来为新进入的已关闭位置设置所需的值来完成，我们知道该位置的状态和 LOAD_TS，即当前 dbt\
  \ 运行开始的时间。\n\n## 实现已关闭位置的识别\n\n让我们创建并讨论跟踪已关闭位置的新的 HIST 模型：\n\n+   1. 在 `staging`\
  \ 文件夹中，创建一个名为 `HIST_ABC_BANK_POSITION_WITH_CLOSING.sql` 的新模型文件\n+   \n+   2. 首先配置增量物化：\n\
  \n```\n```sql\n{{ config(materialized='incremental') }}\n```\n```\n\n+   3. 然后，重新定义\
  \ HIST 表的形状，以便我们知道要在代码中处理的列的位置：\n\n```\n```sql\nWITH\nstg_input as (\n    SELECT\n\
  \        i.* EXCLUDE (REPORT_DATE, QUANTITY, COST_BASE,\n                    POSITION_VALUE,\
  \ LOAD_TS_UTC)\n        , REPORT_DATE\n        , QUANTITY\n        , COST_BASE\n\
  \        , POSITION_VALUE\n        , LOAD_TS_UTC\n        , false as CLOSED\n  \
  \  FROM {{ ref('STG_ABC_BANK_POSITION') }} as i\n```\n```\n\n注意，我们首先排除我们希望手动定位的列，然后按照我们喜欢的方式排列它们。\n\
  \n+   4. 当处于增量运行时，启动分支：\n\n```\n```sql\n{% if is_incremental() %}— in an incremental\
  \ run …\n```\n```\n\n## 提升软件质量\n\n+   5. 使用常用的宏从 HIST 表读取当前值：\n\n```\n```sql\n,\
  \ current_from_history as (\n    {{ current_from_history(\n        history_rel =\
  \ this,\n        key_column = 'POSITION_HKEY',\n    ) }}\n),\n```\n```\n\n+   6.\
  \ 像往常一样，从输入中选择要加载到 HIST 中的数据：\n\n```\n```sql\nload_from_input as (\n    SELECT i.*\n\
  \    FROM stg_input as i\n    LEFT OUTER JOIN current_from_history curr\n    ON\
  \ (not curr.closed\n        and i.POSITION_HDIFF = curr.POSITION_HDIFF)\n    WHERE\
  \ curr.POSITION_HDIFF is null\n),\n```\n```\n\n+   7. 选择已删除的数据——即 HIST 表中不在输入中的活动行——并设置值以表示已关闭位置：\n\
  \n```\n```sql\nclosed_from_hist as (\n    SELECT\n        curr.* EXCLUDE (REPORT_DATE,\
  \ QUANTITY, COST_BASE,\n                       POSITION_VALUE, LOAD_TS_UTC, CLOSED)\n\
  \        , (SELECT MAX(REPORT_DATE) FROM stg_input)\n                  as REPORT_DATE\n\
  \        , 0 as QUANTITY\n        , 0 as COST_BASE\n        , 0 as POSITION_VALUE\n\
  \        , '{{ run_started_at }}' as LOAD_TS_UTC\n        , true as CLOSED\n   \
  \ FROM current_from_history curr\n    LEFT OUTER JOIN stg_input as i\n        ON\
  \ (i.POSITION_HKEY = curr.POSITION_HKEY)\n    WHERE not curr.closed\n        and\
  \ i.POSITION_HKEY is null\n),\n```\n```\n\n请注意，对于已关闭的位置，我们保留大部分列，其值与关闭前最后一个版本中的值相同。这是您需要根据定义来决定并采取行动的事情。\n\
  \n\n\n\n\n- 8. 通过将来自输入的新数据与识别出的已平仓头寸合并，构建增量运行中要存储的变更：\n\n```sql\nchanges_to_store\
  \ as (\n    SELECT * FROM load_from_input\n    UNION ALL\n    SELECT * FROM closed_from_hist\n\
  )\n```\n\n这是增量分支的最后一个CTE。\n\n- 9. 如果不是增量运行——也就是说，我们需要从头开始建表——我们获取重塑后的输入中的所有数据，并且没有需要删除的记录：\n\
  \n```sql\n{%- else %}-- not an incremental run ...\n, changes_to_store as (\n  \
  \  SELECT *\n    FROM stg_input\n)\n```\n\n- 10. 最后但同样重要的是，让我们选择要存储的变更：\n\n```sql\n\
  {%- endif %}\nSELECT * FROM changes_to_store\n```\n\n如果你将这个加载模式与`save_history`宏中的模式进行比较，你会发现两处变化：首先，我们重塑输入数据，以便将需要处理的列留到最后；其次，在增量运行期间，我们检测已删除的行并将其添加到HIST表中。\n\
  \n现在，如果你运行新的模型，它只会像普通的旧HIST模型一样存储来自输入的数据，因为我们没有任何删除操作。\n\n在下一节中，我们将修改模拟外部来源的表的内容，以便了解当新增或平仓头寸时，新模型将存储什么内容。\n\
  \n## 向头寸事实表添加新数据\n\n到目前为止，我们在ABC_BANK_POSITION表中始终使用相同的数据作为源，这些数据最初是从Excel电子表格导出的CSV文件直接加载到Snowflake中的。\n\
  \n现在，我们想对该表进行更改，以模拟不同输入在我们管道起点到达的情况。\n\n我们想要在投资组合中模拟的变更如下：\n\n- 1. 在'SAFE'股票中创建一个新头寸。该股票不会出现在股票信息维度中。\n\
  - 2. 更改'STAR'股票的头寸。\n- 3. 平掉'GCM'股票的头寸。\n\n要更改源表的内容，我们可以从新的CSV重新加载它。如果我们要从真实投资组合中导出数据，这很合理；但为了让示例快速且易于复现，我们将通过一些SQL语句来更改表的内容，并将这些语句存储在一个分析文件中，方便我们执行SQL。\n\
  \n要应用这三个更改，你可以运行以下SQL代码：\n\n```sql\nDELETE FROM PORTFOLIO_TRACKING.SOURCE_DATA.ABC_BANK_POSITION\n\
