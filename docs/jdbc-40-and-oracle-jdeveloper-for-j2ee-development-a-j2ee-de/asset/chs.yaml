  \n## JDBC 4.0 版本\n\n嵌入 JDeveloper 10g 或 11g 的 OC4J 服务器不支持 JDBC 4.0 规范；但在支持 JDBC\
  \ 4.0 的 JDeveloper 后续版本中，可将 JDBC 4.0 功能添加到用于创建 Data Table 的 JSF 应用程序中。JDBC 4.0 提供了诸如增强的连接管理、自动驱动程序加载、对包装器模式的支持、语句池、SQLException\
  \ 分类以及对 Java SE 链式异常设施的增强支持等新功能。要使用 JDBC 4.0 功能，您需要从 http://www.oracle.com/technology/software/tech/java/sqlj_jdbc/htdocs/jdbc_111060.html\
  \ 下载 Oracle 数据库 11g JDBC 4.0 驱动程序 JAR 文件 ojdbc6.jar。将 ojdbc6.jar 复制到 j2ee/home/lib\
  \ 目录，该目录位于在 OC4J 服务器中运行的 Web 应用程序的运行时类路径中。由于 JDBC 4.0 驱动程序需要 JDK 6.0，我们还需要将 J2SE\
  \ 版本设置为 JDK 6.0。要设置 JDK 版本，请选择 Tools | Project Properties 并在 Project Properties\
  \ 窗口中选择 Libraries。为 J2SE Version 字段选择 Change 按钮以将 JDK 设置为 6.0。\n\n您无需修改 JSF 应用程序即可向应用程序添加连接状态跟踪。连接状态跟踪由连接池管理器实现，用于跟踪连接池中的不可用连接。不可用连接可能会影响连接池性能。在\
  \ JDBC 4.0 的新功能之前，如果连接池中的某些连接变得不可用，连接池管理器必须关闭所有连接并重新初始化连接池。JDBC 4.0 中的 Connection\
  \ 接口提供了一个新的方法 isValid()，连接池管理器可使用它来测试连接是否仍然有效，如果连接变得不可用则关闭连接。\n\n```\nif (!connection.isValid())\n\
  \    connection.close();\n```\n\n我们使用了两种不同的方法来创建 Data Table。在每种方法中，我们都使用 Class.forName\
  \ 方法加载 Oracle JDBC 驱动程序来获取与数据库的连接。JDBC 4.0 使用 Java SE 服务提供者机制提供自动驱动程序加载。要使用 Java\
  \ SE 服务提供者机制，请在 META-INF/services 目录中创建 java.sql.Driver 文件并指定要用于自动加载的不同 JDBC 驱动程序。Oracle\
  \ 数据库 11g 驱动程序 JAR 文件 ojdbc6.jar 包含一个 META-INF/services/java.sql.Driver 文件，其中指定了\
  \ oracle.jdbc.OracleDriver 类。有了自动驱动程序加载功能，我们就不需要调用 Class.forName 方法。\n\n与连接状态跟踪不同，如果您想使用\
  \ JDBC 4.0 中的连接标识功能，则必须修改 JSF 应用程序。JDBC 4.0 中的 Connection 接口有两个新方法 setClientInfo\
  \ 和 getClientInfo，用于设置和获取客户端信息属性。有时一个或多个连接会因使用过多的 CPU 而拖慢整个应用程序。使用客户端信息属性，JDBC 驱动程序能够识别可能导致性能下降的连接客户端。JDBC\
  \ 4.0 支持的标准客户端信息属性是 ApplicationName、ClientUser 和 ClientHostname。在用于创建 MBean 随后创建\
  \ Data Table 的 Web Service 客户端类中的 getDataResultSet 方法中，按如下方式设置客户端信息属性：\n\n```\n\
  connection.setClientInfo(\"ApplicationName\",\"OracleApp\");\nconnection.setClientInfo(\"\
  ClientUser\",\"OracleUser\");\nconnection.setClientInfo(\"ClientHostname\",\"OracleHost\"\
  );\n```\n\n同样，在用于使用输入文本字段中指定的 SQL 查询创建 Data Table 的 backing bean 方法 commandButton1_action\
  \ 中设置客户端信息属性。数据库支持的客户端信息属性的 ResultSet 可使用 DatabaseMetaData 接口的 getClientInfoProperties()\
  \ 方法获取：\n\n```\nDatabaseMetaData metaData=connection.getMetaData();\nResultSet clientInfo=metaData.getClientInfoProperties();\n\
  ```\n\n如果数据库支持语句池，则 PreparedStatements 默认情况下会被池化。为了高效使用 Statement 对象，JDBC 4.0 提供了\
  \ Statement 对象池。可使用 setPoolable 方法对频繁使用的 Statement 对象进行池化。首先使用 isPoolable 方法测试 Statement\
  \ 对象是否可池化，然后将 Statement 对象设置为可池化。\n\n```\nif(stmt.isPoolable())\n    stmt.setPoolable(true);\n\
  ```\n\nJDBC 4.0 支持包装器模式，用于访问 JDBC API 厂商特定扩展中的非标准方法。例如，扩展 Statement 接口的 oracle.jdbc.OracleStatement\
  \ 接口提供了 Statement 接口中没有的一些方法。Statement 接口在 JDK 6.0 中扩展了 Wrapper 接口。要使用包装器模式访问 OracleStatement\
  \ 接口，请使用 isWrapperFor 方法测试 Statement 对象是否为 OracleStatement 接口的包装器。如果是包装器，请使用 unwrap\
  \ 方法创建 OracleStatement 类型的对象。随后可以调用 OracleStatement 接口的 defineColumnType 方法来指定列的列\
  \ SQL 类型。数据库表数据以指定的列类型获取到 ResultSet 中。预定义列类型可节省 JDBC 驱动程序往返数据库以查找列的列类型。如果要使用 defineColumnType\
  \ 指定列类型，则必须设置所有列的列类型。如果仅设置了少数列或设置的列数多于 SQL 查询中的列数，则会生成 SQLException。例如，使用 Data Table\
  \ 创建的 SQL 查询中不同列的列类型设置如下：\n\n```\nClass class = Class.forName(\"oracle.jdbc.OracleStatement\"\
  );\nif(stmt.isWrapperFor(class)) {\nOracleStatement oracleStmt = (OracleStatement)stmt.unwrap(class);\n\
  oracleStmt.defineColumnType(1, OracleTypes.VARCHAR);\noracleStmt.defineColumnType(2,\
  \ OracleTypes.VARCHAR);\noracleStmt.defineColumnType(3, OracleTypes.VARCHAR);\n\
  oracleStmt.defineColumnType(4, OracleTypes.VARCHAR);\noracleStmt.defineColumnType(5,\
  \ OracleTypes.VARCHAR);\noracleStmt.defineColumnType(6, OracleTypes.VARCHAR);\n\
  oracleStmt.defineColumnType(7, OracleTypes.VARCHAR);\n}\n```\n\nJDBC 4.0 提供的另一个新功能是对\
  \ for-each 循环的支持，用于遍历链式异常和链式原因。链式异常是指链接到异常的异常。在 JDBC 3.0 中，只能通过递归调用 getNextException\
  \ 方法来检索链式异常。使用 JDBC 4.0 中的 Java SE 链式异常设施，可以按如下方式检索链式异常和链式原因：\n\n```\ncatch(SQLException\
  \ e){\nfor(Throwable e : exception ) {\nout.println(\"Error encountered: \" + e);\n\
  }\n}\n```\n\n添加了 JDBC 4.0 功能的 getDataResultSet 方法列出如下：\n\n```\npublic ResultSet\
  \ getDataResultSet(){\n    ResultSet rs=null;\n    try{\n    String url=\"jdbc:oracle:thin:@localhost:1521:ORCL\"\
  ;\n    Connection connection = DriverManager.getConnection(url,\n              \
  \  \"OE\", \"pw\");\nconnection.setClientInfo(\"ApplicationName\",\"OracleApp\"\
  );\nconnection.setClientInfo(\"ClientUser\",\"OracleUser\");\nconnection.setClientInfo(\"\
  ClientHostname\",\"OracleHost\");\n    Statement stmt=connection.createStatement(ResultSet.TYPE_SCROLL_INSENSITIVE,\
  \ ResultSet.CONCUR_READ_ONLY);\nDatabaseMetaData metaData=connection.getMetaData();\n\
  if(metaData.supportsStatementPooling()){\nif(stmt.isPoolable())\nstmt.setPoolable(true);\n\
  }\n```\n\n\n\n```\nClass clazz = Class.forName(\"oracle.jdbc.OracleStatement\");\n\
  if(stmt.isWrapperFor(clazz)) {\nOracleStatement oracleStmt = (OracleStatement)stmt.unwrap(clazz);\n\
  oracleStmt.defineColumnType(1, OracleTypes.VARCHAR);\noracleStmt.defineColumnType(2,\
  \ OracleTypes.VARCHAR);\noracleStmt.defineColumnType(3, OracleTypes.VARCHAR);\n\
  oracleStmt.defineColumnType(4, OracleTypes.VARCHAR);\noracleStmt.defineColumnType(5,\
  \ OracleTypes.VARCHAR);\noracleStmt.defineColumnType(6, OracleTypes.VARCHAR);\n\
  oracleStmt.defineColumnType(7, OracleTypes.VARCHAR);\nrs=stmt.executeQuery(\"SELECT\
  \ * FROM OE.CATALOG\");\n}\n} catch(SQLException e){for(Throwable e : exceptions\
  \ ) {\nout.println(\"Error encountered: \" + e);\n}\n    return rs;\n}\n```\n\n\
  同样地，修改 JSF 后台 bean 中的 commandButton1_action 方法。\n\n## 摘要\n\nJSF UI 组件数据表可用于显示通过静态\
  \ SQL 查询或动态生成的 SQL 查询检索的数据库数据。JDeveloper 提供了 Create Data Table Wizard 来创建数据表。数据表可以通过将数据表绑定到\
  \ MBean 或使用 JSF API 生成。在支持 JDBC 4.0 的 JDeveloper 版本中，可以使用 JDBC 4.0 的新功能，例如连接状态跟踪、语句池、连接标识、对包装器模式的支持以及\
  \ Java SE 链式异常设施。\n"
- "## 11 创建 JSF 面板网格\n\n## 创建 JSF 面板网格\n\n在上一章中，我们使用 JSF 数据表组件显示数据库数据。在本章中，我们将讨论 JSF\
  \ 面板网格，以使用 JDBC API 从数据库添加和检索数据。我们还将在数据添加到数据库时验证数据。面板网格是一个 UI 面板组件，由 `javax.faces.HtmlPanelGrid`\
  \ 类和 `h:panelGrid` 标签表示。JDeveloper 提供了 Create PanelGrid Wizard 来创建面板网格。\n\n面板网格以指定的列数显示一组组件。生成面板网格时只需指定列数；行数不是必需的。行数基于网格中的组件数和网格中的列数。面板网格中的组件被添加到指定的列数中。在为一行分配了指定数量的列后，将开始新的面板网格行。例如，如果面板网格中指定的列数为三，且要添加到面板网格的组件数为十。前三个组件添加到第一行，接下来的三个添加到第二行。另三个组件添加到第三行，一个添加到第四行。\n\
  \n在本章中，将使用 Create PanelGrid Wizard 从数据库表生成面板网格。Create PanelGrid Wizard 提供了两种创建面板网格的方法。面板网格可以通过先创建空面板网格然后向其添加组件，或通过将托管\
  \ bean 绑定到面板网格来创建。我们将讨论这两种创建面板网格的方法。面板网格的数据将使用 JSF 后台 bean 中的 JDBC 进行检索/添加。在本章中，我们将学习以下内容：\n\
  \n- 使用 Create JSF Panel Grid Wizard 创建空面板网格并向面板网格添加 JSF UI 组件。\n- 使用 Create JSF\
  \ Panel Grid Wizard 通过绑定托管 bean 到面板网格来创建面板网格。\n- 向面板网格添加 JSF 验证器。\n- 向面板网格添加 JSF\
  \ 转换器。\n\n## 设置环境\n\n安装 JDeveloper 10.1.3 IDE。安装包括示例模式的 Oracle 10g 数据库。在 SQL Plus\
  \ 中，创建一个示例数据库表，将从该表生成面板网格。生成示例数据库表的 SQL 脚本如下：\n\n```\nCREATE TABLE OE.Catalog(CatalogId\
  \ INTEGER PRIMARY KEY, Journal VARCHAR(25), Publisher VARCHAR(25), Edition VARCHAR(25),\
  \ Title Varchar(45), Author Varchar(25), HREF VARCHAR(125));\nINSERT INTO OE.Catalog\
  \ VALUES('1', 'Oracle Magazine', 'Oracle Publishing', 'Nov-Dec 2004', 'Database\
  \ Resource Manager', 'Kimberly Floss', 'http://www.oracle.com/technology/oramag/oracle/04-nov/o64tuning.html');\n\
  INSERT INTO OE.Catalog VALUES('2', 'Oracle Magazine', 'Oracle Publishing', 'Nov-Dec\
  \ 2004', 'From ADF UIX to JSF', 'Jonas Jacobi','http://www.oracle.com/technology/oramag/oracle/04-nov/o64jsf.html');\n\
  INSERT INTO OE.Catalog VALUES('3', 'Oracle Magazine', 'Oracle Publishing', 'March-April\
  \ 2005', 'Starting with Oracle ADF ', 'Steve Muench', 'http://www.oracle.com/technology/oramag/oracle/05-mar/o25window.html');\n\
  ```\n\n## 通过绑定行创建面板网格\n\n在本节中，我们将通过将行绑定到面板网格来创建面板网格。首先，我们将通过指定面板网格中的列数来创建空面板网格。随后，我们将从\
  \ JSF HTML 组件调色板向空面板网格添加 JSF UI 组件。添加到空面板网格的组件会自动按指定的列数添加。要创建 JSF 面板网格，只需指定列数即可。\n\
  \n在本节中，我们将生成输出标签、输入文本字段、输出文本字段和命令按钮的面板网格。我们将向 JSF 页面添加面板网格，并从组件调色板向面板网格添加 UI 组件。我们将从期刊目录的字段创建面板网格。Catalog\
  \ 表中的示例期刊目录具有目录 id、期刊、出版商、版次、标题、作者和 url href 字段。在 JSF 应用程序中，各种输出文本字段的值是从 Oracle\
  \ 数据库为指定的输入目录 id 检索的。首先，创建一个用于创建面板网格的项目。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_319_0.png)\n\
  \n接下来，使用 文件 | 新建 向项目添加 JSF 页面。在 新画廊 窗口中，在 类别 中选择 Web Tier | JSF，在 项目 中选择 JSF JSP。在\
  \ Create JSF JSP 向导中，在 Web 应用程序窗口中选择 J2EE 1.4 并单击 下一步。在 JSP 文件窗口中指定 文件名 并单击 下一步。在\
  \ 组件绑定 窗口中选择 自动地在新的托管 bean 中公开 UI 组件。后台 bean 名称、类和包已预先指定。单击 下一步。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_319_1.png)\n\
  \n## 创建 JSF 面板网格\n\n在 **Error Page Options** 窗口中，选择默认设置，即不使用错误页面，然后单击 **Next**。在\
  \ **Tag Libraries** 窗口中，默认库（JSF Core 1.0 和 JSF HTML 1.0）默认被选中。单击 **Next**。在 **HTML\
  \ Options** 窗口中，选择默认设置并单击 **Next**。在 **Finish** 窗口中，单击 **Finish**。JSF 页面被添加到项目中。向\
  \ JSF JSP 页面添加 **JDeveloper** CSS 样式表。添加一个 **Heading 2** 标题 **JSF Panel Grid**。接下来，向\
  \ JSF 页面添加面板网格。将光标定位在 JSF 页面标题下方并在 JSF HTML 组件调色板中选择 Panel Grid。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_320_0.png)\n\
  \n在 **Create PanelGrid Wizard** 中，单击 **Next**。在 **PanelGrid Options** 窗口中选择 **Create\
  \ empty panel grid** 单选按钮并指定面板网格中的 **Number of Columns**，示例 JSF 应用程序中为 2。单击 **Finish.**\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_321_0.png)\n\n空 JSF 面板网格被添加到 JSF 页面。接下来，我们将从组件调色板向面板网格添加组件。添加到空面板网格的组件按两列排列。将光标定位在面板网格中并在组件调色板中选择\
  \ Output Label。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_321_1.png)\n\n## 创建\
  \ JSF 面板网格\n\n向 JSF 页面添加了输出标签。使用右箭头键将光标定位到输出标签右侧并在组件调色板中选择 Input Text。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_322_0.png)\n\
  \n输入文本字段被添加到 JSF 页面。要向 JSF 页面添加另一个组件，使用右箭头键将光标定位到前一个组件右侧。接下来，添加一个输出标签。由于面板网格只有两列，输出标签被添加到新行中。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_322_1.png)\n\n\n\nAdd **输出文本** fields\
  \ and **输出标签** to the panel grid to four rows. In the fifth row add a **输出标签** and\
  \ a **输出超链接.**\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_323_0.png)\n\nNext, we\
  \ will add an **输出文本** component to the **输出超链接** component. Select the **输出超链接**\
  \ component in the JSF page and select **输出文本** in the Component Palette. An output\
  \ text field gets added to the output hyperlink component. An output hyperlink is\
  \ a UI component that is similar to a <a/> component in a HTML page. The output\
  \ text in the output link is text that gets displayed in the hyperlink.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_323_1.png)\n\
  \n## 创建 JSF 面板网格\n\nAdd another row of **输出标签** and **输出文本** components. Next, add\
  \ a row of command buttons to the panel grid.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_324_0.png)\n\
  \nIn the **属性检查器**, set the text on the **输出标签** and the command buttons. To specify\
  \ the text value for a component, click on the component and specify the text value\
  \ in the **值** property in the **属性检查器**.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_324_1.png)\n\
  \nThe example JSF application also demonstrates the data conversion and validation\
  \ provided by the JSF specification. By specifying a Validator for a component the\
  \ component value may be validated to be within a specified range, and by specifying\
  \ a Converter for a component, the component value may be converted to the specified\
  \ converter type. Specify the validateLongRange validator for the Catalog ID input\
  \ text field:\n\n```\n<f:validateLongRange minimum=\"1\" maximum=\"3\"/>\n```\n\n\
  If the value in the Catalog ID input field is not within the specified range of\
  \ 1 and 3 a validation error gets generated. The different types of validators provided\
  \ by the JSF are listed in the following table:\n\n| 验证器 | 描述 |\n|---|---|\n| validateLongRange\
  \ | Validates a long value to be within a specified range. |\n| validateLength |\
  \ Validates the length of a String value to be within a specified range. |\n| validateDoubleRange\
  \ | Validates a double value to be within the specified range. |\n\nRegister an\
  \ Integer data type converter with the Catalog ID input text field:\n\n```\n<f:converter\
  \ converterId=\"javax.faces.Integer\" />\n```\n\nThe value specified in the input\
  \ text field gets converted to java.lang.Integer type. Next, add a message component\
  \ to display an error message by the Catalog ID input text field. Add the input\
  \ text and message components to a panel group component. Select the catalog.jsp\
  \ node in the Applications Navigator and select the Source tab in the editor window.\
  \ Replace the <h:inputText binding=\"#{backing_catalog.inputText1}\" id=\"inputText1\"\
  /> component with the following h:panelGroup component.\n\n```\n<h:panelGroup>\n\
  \    <h:inputText binding=\"#{backing_catalog.inputText1}\" id=\"inputText1\">\n\
  \        <f:converter converterId=\"javax.faces.Integer\" />\n        <f:validateLongRange\
  \ minimum=\"1\" maximum=\"3\"/>\n    </h:inputText>\n    <h:message for=\"inputText1\"\
  />\n</h:panelGroup>\n```\n\nWe have added the h:panelGroup component declaratively.\
  \ JDeveloper also has the provision to add the panelGroup component when adding\
  \ the inputText component using the surround with option. Next, add a action method\
  \ for the command buttons. Select the catalog.jsp node in Applications Navigator\
  \ and select the Design tab. Double click on the Submit command button. In the Bind\
  \ Action Property window, select the managed Bean backing_catalog and backing bean\
  \ method as commandButton1_action. Add an import statement for the java.sql package\
  \ to the backing bean class panelgrid.backing.Catalog.java.\n\nIn the command button\
  \ action method query the example database table OE.CATALOG with the Catalog ID\
  \ specified in the input field. Load the Oracle JDBC driver oracle.jdbc.OracleDriver\
  \ using the Class.forName method. Create a Connection object using the getConnection\
  \ method of the DriverManager class. Create a Statement object from the Connection\
  \ object using the createStatement method. Specify the result set type as scrollable\
  \ and result set concurrency as read-only. Retrieve the Catalog ID input in the\
  \ JSF page in the Input Text field by invoking the getValue method on the backing\
  \ bean attribute for the Input Text. Run an SQL query using the executeQuery method\
  \ to generate a ResultSet. Set the values retrieved in the result set in the output\
  \ text fields and the output hyperlink using the setValue method. The following\
  \ listing shows the commandButton1_action method:\n\n```\npublic String commandButton1_action()\
  \ {\n    // Add event code here...\n    ResultSet rs=null;\n    try{\n        Class.forName(\"\
  oracle.jdbc.OracleDriver\");\n        String url=\"jdbc:oracle:thin:@localhost:1521:ORCL\"\
  ;\n        Connection connection =\n            DriverManager.getConnection(url,\"\
  OE\", \"pw\");\n        Statement stmt=connection.createStatement(ResultSet.\n \
  \           TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_READ_ONLY);\n        String\
  \ query=\"SELECT * FROM OE.CATALOG WHERE CATALOGID=\n            \"+inputText1.getValue();\n\
  \        rs=stmt.executeQuery(query);\n        rs.next();\n        outputText1.setValue(rs.getString(\"\
  Journal\"));\n        outputText2.setValue(rs.getString(\"Publisher\"));\n     \
  \   outputText3.setValue(rs.getString(\"Edition\"));\n        outputText4.setValue(rs.getString(\"\
  Href\"));\n        outputText4.setValue(rs.getString(\"Title\"));\n        outputText5.setValue(rs.getString(\"\
  Author\"));\n        rs.close();\n        stmt.close();\n        connection.close();\n\
  \    }catch(SQLException e){\n    }catch(ClassNotFoundException e){\n}\n    return\
  \ null;\n}\n```\n\nThe SQL query handling may also be specified in a server-side\
  \ helper class instead of directly in the managed bean. The **清除** button clears\
  \ the fields in the JSF page. Double click on the **清除** command button in the **设计**\
  \ mode. In the **绑定操作属性** window, select the `backing_catalog` managed bean and\
  \ the `commandButton2_action` method. Modify the `commandButton2_action` method\
  \ to set the output text field values to an empty string. The `commandButton2_action`\
  \ method is listed below:\n\n```\npublic String commandButton2_action() {\n    //\
  \ Add event code here...\n    outputText1.setValue(\"\");\n    outputText2.setValue(\"\
  \");\n    outputText3.setValue(\"\");\n    outputText4.setValue(\"\");\n    outputLink1.setValue(\"\
  \");\n    outputText5.setValue(\"\");\n    return null;\n}\n```\n\nRight-click on\
  \ the JSF JSP page `catalog.jsp` in the **应用程序导航器** and select **运行**. The JSF Panel\
  \ Grid gets displayed. The output labels and input text field/ output text fields\
  \ are displayed in two columns.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_327_0.png)\n\
  \n## 创建 JSF 面板网格\n\nSpecify a Catalog ID in the input field and select the Submit\
  \ button. The database table column values corresponding to the specified catalog\
  \ id are displayed in the panel grid. The title is displayed as a hyperlink, which\
  \ may be selected to display the referred document.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_328_0.png)\n\
  \nThe output text fields may be reset to empty text fields by selecting the **清除**\
  \ button. Next, we will demonstrate the validation of the input text value. Specify\
  \ a Catalog Id input text value that is not within the validator range of 1 and\
  \ 3 and click on the **提交** button:\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_329_0.png)\n\
  \nA validation error is generated to indicate that the specified Catalog ID is not\
  \ in the range specified in the validator.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_330_0.png)\n\
  \nIn this section, we created a JSF panel grid by binding two columns to the panel\
  \ grid and subsequently adding JSF components to the empty panel grid from the Component\
  \ Palette.\n\n## 通过绑定托管 Bean 创建面板网格\n\nIn this section, we will create a panel grid\
  \ by binding a managed bean to the panel grid in the Create PanelGrid Wizard. We\
  \ had used a similar managed bean binding to create a Data Table in the previous\
  \ chapter. A managed bean is a Java object that represents a resource. The example\
  \ panel grid is an input form to update a\n\nOracle 数据库中的期刊目录。通过绑定托管 bean 创建面板网格的步骤如下。\n\
  \n- 1. 创建一个 Java Bean 类来表示期刊目录中的不同字段。\n- 2. 从 Java Bean 类创建托管 bean。\n- 3. 将托管 bean\
  \ 绑定到 JSF 页面中的面板网格。\n\n删除上一节中创建的 JSFPanelGrid 应用程序，并在 Applications-Navigator 中为面板网格创建类似的应用程序和项目。从\
  \ JavaBean 类生成托管 bean。托管 bean 实现了一个资源，即示例应用程序中的 JavaBean 类。JavaBean 类具有属性以及对应于示例数据库表中不同列的属性的\
  \ getter/setter 方法。使用 File | New 向项目添加一个 Java 类。在 New Gallery 窗口中，在 Categories 中选择\
  \ General，在 Items 中选择 Java Class。在 Create Java Class 窗口中指定类名 PanelGridBean 和包名 example.panelgrid。将以下列表复制到\
  \ PanelGridBean。\n\n```java\npackage example.panelgrid;\npublic class PanelGridBean\n\
  {\n    private int catalogId;\n    private String journal;\n    private String publisher;\n\
  \    private String edition;\n    private String title;\n    private String author;\n\
  \    private String href;\n    public PanelGridBean() {\n    }\n    public int getCatalogId()\
  \ {\n        return this.catalogId;\n    }\n    public void setCatalogId(int catalogId)\
  \ {\n        this.catalogId=catalogId;\n    }\n    public String getJournal() {\n\
  \        return this.journal;\n    }\n    public void setJournal(String journal)\
  \ {\n        this.journal=journal;\n    }\n    public String getPublisher() {\n\
  \        return this.publisher;\n    }\n    public void setPublisher(String publisher)\
  \ {\n        this.publisher=publisher;\n    }\n    public String getEdition() {\n\
  return this.edition;\n}\npublic void setEdition(String edition){\n    this.edition=edition;\n\
  }\npublic String getTitle(){\n    return this.title;\n}\npublic void setTitle(String\
  \ title){\n    this.title=title;\n}\npublic String getAuthor(){\n    return this.author;\n\
  }\npublic void setAuthor(String author){\n    this.author=author;\n}\npublic String\
  \ getHref(){\n    return this.href;\n}\npublic void setHref(String href){\n    this.href=href;\n\
  }\n}\n```\n\n接下来，使用 File | New 向项目添加一个 JSF JSP 页面 catalog.jsp。在 New Gallery 窗口中，在\
  \ Categories 中选择 Web Tier | JSF，并在 Items 中选择 JSF JSP。单击 OK。接下来，我们将从 Java Bean 类创建托管\
  \ bean。在 Applications Navigator 中打开 faces-config.xml 配置文件节点，并在编辑器窗口中选择 Overview\
  \ 选项卡。选择 Managed Beans 节点（如果尚未选择）。单击 New 添加新的托管 bean。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_332_0.png)\n\
  \n在 Create Managed Bean 窗口中，指定托管 bean 名称 PanelGridMBean，并选择 JavaBean 类 PanelGridBean\
  \ 作为托管 bean 的 Class。选择 request 作为 Scope 并单击 OK。托管 bean PanelGridMBean 被创建。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_333_0.png)\n\
  \nJSF 面板网格也可用于指定输入表单中输入文本字段的初始值。在 faces-config.xml 文件中指定托管 bean 属性的初始值。选择 faces-config.xml\
  \ 文件节点和 Source 选项卡。使用 <managed-property/> 元素为 PanelGridMBean 添加托管 bean 属性的初始值。指定了托管\
  \ bean 属性的 faces-config.xml 中的 managed-bean 元素如下所示：\n\n```\n<managed-bean>\n   \
  \ <managed-bean-name>backing_catalog</managed-bean-name>\n    <managed-bean-class>panelgrid.backing.Catalog</managed-bean-class>\n\
  \    <managed-bean-scope>request</managed-bean-scope>\n    <!--oracle-jdev-comment:managed-bean-jsp-link:1catalog.jsp-->\n\
  </managed-bean>\n<managed-bean>\n    <managed-bean-name>PanelGridMBean</managed-bean-name>\n\
  \    <managed-bean-class>example.panelgrid.PanelGridBean</managed-bean-class>\n\
  \    <managed-bean-scope>request</managed-bean-scope>\n    <managed-property>\n\
  \    <property-name>catalogId</property-name>\n    <value>1</value>\n    </managed-property>\n\
  \    <managed-property>\n    <property-name>journal</property-name>\n    <value>Oracle\
  \ Magazine</value>\n    </managed-property>\n    <managed-property>\n    <property-name>publisher</property-name>\n\
  ```\n\n向 JSF 页面 catalog.jsp 添加一个面板网格。在 JSF 页面中定位光标，并在 Component Palette 中选择 Panel\
  \ Grid。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_334_0.png)\n\n**创建 PanelGrid\
  \ 向导** 开始运行。单击 **下一步**。在 **面板网格选项** 窗口中选择 **从托管 Bean 或表达式创建面板网格** 单选按钮。单击 **绑定**\
  \ 将面板网格与托管 bean 绑定。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_335_0.png)\n\n在\
  \ **表达式生成器** 窗口中，选择 **JSF 托管 Bean | PanelGridMBean** 节点，并使用 > 按钮将 **PanelGridMBean**\
  \ 添加到 **表达式** 字段。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_335_1.png)\n\n## 创建\
  \ JSF 面板网格\n\n在 **面板网格选项** 窗口中，在 **类** 字段中选择 JavaBean 类 **PanelGridBean** 并单击 **下一步**。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_336_0.png)\n\n在 **字段选择** 窗口中对所选字段的顺序进行排序，使其对应于\
  \ **OE.CATALOG** 数据库表列。单击 **下一步**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_336_1.png)\n\
  \n在 **组件详细信息** 中选择 `<header>` 行并在 **标签** 字段中指定一个标题。选择 `Catalog Id` 行并将 **类型** 选择为\
  \ **输入文本**。通过选择 **必填** 复选框将 `Catalog Id` 字段指定为必填字段。选择 **关联消息** 复选框以向面板网格添加消息组件列。错误消息将在消息组件中显示。单击\
  \ **高级** 按钮为 Catalog Id 输入文本字段注册验证器和转换器。JSF 验证器用于验证输入字段值，JSF 转换器用于转换输入字段值。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_337_0.png)\n\
  \n在 **高级属性** 窗口中，选择 **整数** 转换器。Catalog Id 输入文本字段的值将通过转换器转换为 `Integer` 类型。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_337_1.png)\n\
  \n## 创建 JSF 面板网格\n\n接下来，选择 Validator 选项卡并选择 Validate Long Range 验证器。为验证器指定 Minimum\
  \ 和 Maximum 值。验证器验证 Catalog Id 输入字段值是否在指定范围内。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_338_0.png)\n\
  \n在 Components Detail 窗口中，为其他字段将 Type 指定为 Input Text 并单击 Next。在 Finish 窗口中单击 Finish。一个\
  \ JSF 面板网格已添加到 JSF 页面 catalog.jsp。向 JSF 页面添加一个命令按钮 Submit。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_338_1.png)\n\
  \n接下来，我们将修改 backing bean 中的命令按钮 action 方法。在 Design 选项卡中双击命令按钮。在 Bind Action 属性窗口中为\
  \ Managed Bean 和 Method 选择默认设置并单击 OK。在命令按钮 action 方法中检索输入字段值并更新指定 catalog id 的数据库表。在\
  \ backing bean 类中为 java.sql 包添加 import 语句。在 commandButton1_action 方法中使用 Class.forName\
  \ 方法加载 Oracle JDBC 驱动程序 oracle.jdbc.OracleDriver。\n\n使用 DriverManager 类的 getConnection\
  \ 方法创建 Connection 对象。使用 createStatement 方法从 Connection 对象创建 Statement 对象。将结果集类型指定为可滚动，结果集并发指定为只读。使用\
  \ getValue 方法检索 Input Text 字段值。通过使用 executeQuery 方法运行 UPDATE SQL 语句来更新数据库表 Catalog。commandButton1_action\
  \ 方法如下所示：\n\n```java\npublic String commandButton1_action() {\n    // Add event\
  \ code here...\n    ResultSet rs=null;\n    try{Class.forName(\"oracle.jdbc.OracleDriver\"\
  );\n        String url=\"jdbc:oracle:thin:@localhost:1521:ORCL\";\n        Connection\
  \ connection =\n        DriverManager.getConnection(url,\"OE\", \"pw\");\n    Statement\n\
  \    stmt=connection.createStatement(ResultSet.TYPE_SCROLL_INSENSITIVE,\n    ResultSet.CONCUR_READ_ONLY);\n\
  \        int catalogId=((Integer)(inputText0.getValue())).\nintValue();\n      \
  \  String journal=(String)inputText1.getValue();\n        String publisher=(String)inputText2.getValue();\n\
  \        String edition=(String)inputText3.getValue();\n        String title=(String)inputText4.getValue();\n\
  \        String author=(String)inputText5.getValue();\n        String href=(String)inputText6.getValue();\n\
  \    String query=\"UPDATE OE.CATALOG SET\n    JOURNAL=\"+\"'\"+journal+\"'\"+\"\
  ,\"+\"PUBLISHER=\"+\"'\"+publisher+\"'\"+\n    \",\"+\"EDITION=\"+\"'\"+edition+\"\
  '\"+\",\"+\"  TITLE=\" +\"'\"+title+\"'\"+\",\"+\"AUTHOR=\"+\"'\"+author+\"'\"+\"\
  ,\" + \" HREF=\"+\"'\"+href+\"'\"+\"WHERE\n    CATALOGID=\"+\"'\"+catalogId+\"'\"\
  ;\n    stmt.executeUpdate(query);stmt.close();connection.close();}\n    catch(SQLException\
  \ e){System.out.println(e.getMessage());}\n    catch(ClassNotFoundException e)\n\
  \    {System.out.println(e.getMessage());}return null;}\n```\n\n\n\n## 创建 JSF 面板网格\n\
  \n右键单击 **catalog.jsp** 节点并选择 **运行**。输入字段中指定的初始值的面板网格显示如下：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_340_0.png)\n\
  \n要更新数据库表行，请指定该行的 Catalog Id 和输入字段值，然后单击 **提交** 按钮。输入字段 **Catalog Id** 被指定为 **必填**\
  \ 字段。如果在 **Catalog Id** 字段中未指定输入值，则会生成验证错误。验证错误会显示在消息组件列中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_341_0.png)\n\
  \n接下来，我们将演示与 Catalog Id 输入字段注册的验证器。指定不在 1 到 3 范围内的 Catalog Id 输入值并单击提交按钮。消息列中会生成验证错误。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_341_1.png)\n\n## JDBC 4.0 版本\n\n在其嵌入式\
  \ OC4J 服务器支持 JDBC 4.0 的 JDeveloper 版本中，我们可以将 JDBC 4.0 功能添加到 JSF 面板网格应用程序中。JDBC 4.0\
  \ 提供了诸如增强的连接管理、使用 Java SE 服务提供者机制自动加载驱动程序、支持包装器模式以访问 JDBC API 的供应商特定扩展、语句池以及对 Java\
  \ SE 链式异常设施和异常分类的支持等新功能。\n\n对于 JSF 面板网格应用程序的 JDBC 4.0 版本，我们需要从 http://www.oracle.com/technology/software/tech/java/sqlj_jdbc/htdocs/jdbc_111060.html\
  \ 下载 Oracle 数据库 11g JDBC 4.0 驱动程序 JAR 文件 ojdbc6.jar。JDBC 4.0 驱动程序需要 JDK 6.0。因此，我们需要在\
  \ JDeveloper 中将 J2SE 版本设置为 JDK 6.0。要设置 JDK 版本，请选择 工具 | 项目属性。在项目属性窗口中选择 库，并在 J2SE\
  \ 版本 字段中指定 JDK 6.0 版本。\n\nJDBC 4.0 驱动程序 JAR 文件 ojdbc6.jar 包含一个 META-INF/services/java.sql.Driver\
  \ 文件，该文件指定了 Oracle JDBC 驱动程序类 oracle.jdbc.OracleDriver。java.sql.Driver 字段包含在 ojdbc6.jar\
  \ 中，以便 Java SE 服务提供者机制加载 JDBC 驱动程序。在 backing bean 类中 commandButton1_action() 方法的\
  \ JDBC 4.0 版本中，删除使用 Class.forName() 方法加载 Oracle JDBC 驱动程序的那一行。\n\nJDBC 4.0 使用 Connection\
  \ 接口中的 isValid() 方法提供连接状态跟踪。连接池管理器使用 isValid 方法测试连接是否变得不可用。如果连接变得不可用，连接池管理器将使用 close()\
  \ 方法关闭连接。连接状态跟踪减少了在连接池中的某些连接变得不可用时关闭连接池中的所有连接并重新初始化连接池的开销。\n\nJDBC 4.0 提供的另一个连接管理功能是连接客户端标识。有时某些客户端连接会因消耗过多的\
  \ CPU 而拖慢应用程序。JDBC 的早期版本没有识别此类客户端连接的 provision。JDBC 4.0 中的 Connection 接口有两个新方法 setClientInfo\
  \ 和 getClientInfo，用于设置和获取客户端信息属性。因此，Connection 对象由其客户端信息属性标识。数据库支持的不同客户端信息属性可以使用\
  \ DatabaseMetaData 接口的 getClientInfoProperties 方法获得。标准客户端信息属性是 ApplicationName、ClientUser\
  \ 和 Hostname。\n\n除了 PreparedStatements 池化之外，JDBC 4.0 还提供 Statement 池化。经常使用的 Statements\
  \ 可以使用 setPoolable() 方法进行池化。isPoolable() 方法用于测试 Statement 对象是否可池化。\n\nJDBC 4.0 在\
  \ Wrapper 接口中支持包装器模式，以访问 JDBC API 的供应商特定扩展。Oracle JDBC 扩展可在 oracle.jdbc.package\
  \ 中获得。例如，要访问扩展 Statement 接口的 OracleStatement 接口中的非标准方法，请使用 isWrapperFor 方法测试 Statement\
  \ 对象是否为 OracleStatement 接口的包装器。如果 Statement 对象是包装器，请使用 unwrap() 方法解包 OracleStatement\
  \ 接口以创建 OracleStatement 对象。随后，可以调用 OracleStatement 对象的 defineColumnType 方法来定义列类型。定义列类型可节省\
  \ JDBC 驱动程序往返数据库查找列类型的开销。当运行 SQL 查询时，数据库表数据会被提取到 ResultSet 中的已定义列类型中。\n\nJDBC 4.0\
  \ 提供了对 Java SE 链式异常设施的支持，也称为 cause 设施，用于检索链式异常。JDBC 4.0 还检索非 SQLException 链式异常。在面板网格应用程序的\
  \ JDBC 4.0 版本中，链式异常和链式原因使用 J2SE 5.0 中引入的增强 for-each 循环检索。\n\n用于检索指定 Catalog ID 的字段值的\
  \ commandButton1_action() 方法的 JDBC 4.0 版本如下所示：\n\n```\npublic String commandButton1_action()\
  \ {\n    // Add event code here...\n    ResultSet rs=null;\n    try{\n        String\
  \ url=\"jdbc:oracle:thin:@localhost:1521:ORCL\";\n        Connection connection\
  \ =\n        DriverManager.getConnection(url,\"OE\", \"pw\");\n    connection.setClientInfo(\"\
  ApplicationName\",\"OracleApp\");\n    connection.setClientInfo(\"ClientUser\",\"\
  OracleUser\");\n    connection.setClientInfo(\"ClientHostname\",\"OracleHost\");\n\
  \    Statement stmt=connection.createStatement(ResultSet.TYPE_SCROLL_INSENSITIVE,\
  \ ResultSet.CONCUR_READ_ONLY);\n    DatabaseMetaData metaData=connection.getMetaData();\n\
  \    if(metaData.supportsStatementPooling()){\n    if(stmt.isPoolable())\n    stmt.setPoolable(true);\n\
  \    }\n    Class clazz = Class.forName(\"oracle.jdbc.OracleStatement\");\n    if(stmt.isWrapperFor(clazz))\
  \ {\n    OracleStatement oracleStmt = (OracleStatement)stmt.unwrap(clazz);\n   \
  \ oracleStmt.defineColumnType(1, OracleTypes.VARCHAR);\n```\n\n```\noracleStmt.defineColumnType(2,\
  \ OracleTypes.VARCHAR);\noracleStmt.defineColumnType(3, OracleTypes.VARCHAR);\n\
  oracleStmt.defineColumnType(4, OracleTypes.VARCHAR);\noracleStmt.defineColumnType(5,\
  \ OracleTypes.VARCHAR);\noracleStmt.defineColumnType(6, OracleTypes.VARCHAR);\n\
  oracleStmt.defineColumnType(7, OracleTypes.VARCHAR);\nString query=\"SELECT * FROM\
  \ OE.CATALOG WHERE CATALOGID=\"+inputText1.getValue();\n        rs=stmt.executeQuery(query);\n\
  rs=stmt.executeQuery(\"SELECT * FROM OE.CATALOG\");\noutputText1.setValue(rs.getString(\"\
  Journal\"));\n        outputText2.setValue(rs.getString(\"Publisher\"));\n     \
  \   outputText3.setValue(rs.getString(\"Edition\"));\n        outputLink1.setValue(rs.getString(\"\
  HRef\"));\n        outputText4.setValue(rs.getString(\"Title\"));\n        outputText5.setValue(rs.getString(\"\
  Author\"));\n} rs.close();\nstmt.close();\nconnection.close();\n    }catch(SQLException\
  \ e){for(Throwable e : e.getCause()) {\nout.println(\"Error encountered: \" + e);\n\
  }\n        return null;\n    }\n```\n\n## 摘要\n\nJSF 面板网格是用于以网格布局在指定数量的列中显示一组 UI\
  \ 组件的 UI 组件。在本章中，面板网格用于显示从数据库检索的目录数据。面板网格还用于转换和验证输入字段值。面板网格可以在 Create PanelGrid\
  \ Wizard 中通过绑定行或绑定托管 bean 来创建。在面板网格应用程序的 JDBC 4.0 版本中，我们添加了 JDBC 4.0 功能自动驱动程序加载、客户端信息属性、语句池和包装器模式。\n"
- "## 12 使用 JasperReports 创建报告\n\nJasperReports 是一个用于准备演示报告的 Java 报告工具。JasperReports\
  \ 报告是 HTML、PDF、Excel XLS、CSV 或 XML 报告。JasperReports 报告的数据是静态数据，或是通过 SQL 查询从数据库表检索的数据。JasperReports\
  \ 设计用于包含在 Java/J2EE 应用程序中以生成动态演示报告。\n\n在本章中，我们将在 JDeveloper 中创建 JasperReports 报告。JasperReports\
  \ 使用 JDBC 连接到数据库并检索 JasperReports 报告的数据。在 JasperReports 配置文件（.xml 文件）中建立了与 Oracle\
  \ 数据库 10g 的 JDBC 连接。我们将使用 JasperReports 创建 PDF 报告和 Excel 电子表格报告。在本章中我们将学习以下内容：\n\
  \n- 使用 JasperReports 创建 PDF 报告\n- 使用 JasperReports 创建 Excel 电子表格\n\n## 设置环境\n\n\
  下载开源 JasperReports 工具 JAR 文件 `jasperreports-2.0.5.jar`。下载 iText Java-PDF 库 `itext-2.1.0.jar`。下载\
  \ Jakarta-POI ZIP 文件 `poi-bin-3.0.2-FINAL-20080204.zip`。下载 `Commons Digester 1.8`\
  \ 并将 ZIP 文件解压到一个目录中。安装 JDeveloper 10g IDE Studio Edition 完整安装。从以下位置下载并安装 Oracle\
  \ 数据库：http://www.oracle.com/database/index.html 10g。\n\n创建一个示例数据库表 `Catalog`，从中将生成\
  \ JasperReports PDF 报告和 Excel 报告。在 Oracle SQL *Plus 中创建数据库表。创建示例表的 SQL 脚本如下所示。\n\
  \n\n\n```\nCREATE TABLE OE.Catalog(CatalogId VARCHAR(25), Journal VARCHAR(25),\n\
  \    Publisher Varchar(25),Edition VARCHAR(25), Title Varchar(45),\n    Author Varchar(25));\n\
  INSERT INTO OE.Catalog VALUES('catalog1', 'Oracle Magazine', 'Oracle\n    Publishing',\
  \ 'July-August 2005', 'Tuning Undo Tablespace',\n    'Kimberly Floss');\nINSERT\
  \ INTO OE.Catalog VALUES('catalog2', 'Oracle Magazine', 'Oracle\n    Publishing','March-April\
  \ 2005', 'Starting with Oracle ADF ', 'Steve\n    Muench');\n```\n\n从 JDeveloper\
  \ IDE 创建到 Oracle 数据库的 JDBC 连接。要创建连接，请选择 Connections 选项卡，在 Connections Navigator\
  \ 中选择 Database 节点，右键单击 Database 节点，然后选择 New Database Connection。在显示的 Create Database\
  \ Connection (Type) 窗口中，指定 Connection Name 并将 Connection Type 设置为 Oracle(JDBC)。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_346_0.png)\n\n单击 Next。在 Authentication\
  \ 窗口中，指定 Username 和 Password 并单击 Next。在 Connection 窗口中，指定 Driver type、Host Name、JDBC\
  \ Port、SID 并单击 Next。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_347_0.png)\n\n\
  在 **Test** 窗口中，单击 **Test Connection**。如果与数据库的连接已建立，则会显示成功消息。单击 **Finish** 完成连接配置。连接节点将被添加到\
  \ **Connections Navigator** 中。JDBC 连接 `JasperReportsConnection` 可作为 JNDI 资源 `jdbc/JasperReportsConnectionDS`\
  \ 使用。该数据源将用于从数据库检索数据以生成 JasperReports 报表。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_347_1.png)\n\
  \n我们还需要下载并安装 Adobe Acrobat Reader 用于 PDF 报表，以及 MS Excel 用于 Excel 报表。\n\n## 安装 JasperReports\n\
  \n在本节中，在 JDeveloper IDE 中创建 JasperReports 项目并创建 JasperReports 报表所需的库。首先，在 JDeveloper\
  \ IDE 中选择 File | New。在 New Gallery 窗口中，在列出的 Categories 中选择 General，并在列出的 Items 中选择\
  \ Application。单击 OK 按钮。在 Create Application 窗口中指定 Application Name。单击 OK 按钮。在 Create\
  \ Project 窗口中指定 Project Name 并单击 OK 按钮。JasperReports 应用程序和项目将被添加到 Applications-Navigator\
  \ 中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_348_0.png)\n\n接下来，将生成 JasperReports\
  \ 报表所需的库添加到项目中。在 Applications-Navigator 中选择 JasperReports 项目节点并选择 Tools | Project\
  \ Properties。在 Project Properties 窗口中选择 Libraries 节点。使用 Add Library 按钮添加库，并使用 Add\
  \ Jar/Directory 按钮添加 JAR/目录。添加以下表格中列出的库/JAR 文件。\n\n| 库/Jar/Zip | 描述 |\n|---|---|\n\
  | jasperreports-2.0.5.jar | JasperReports API. |\n| Commons BeanUtils | JavaBeans\
  \ 实用程序类 |\n| Commons Collections | 集合框架扩展类 |\n| Commons Digester 1.8 jar | 用于处理\
  \ XML 文档的类 |\n| Commons Logging | 日志类 |\n| poi-bin-3.0.2-FINAL-20080204.jar | 用于生成\
  \ Excel 文档的 Jakarta POI API |\n| itext-2.1.0 | PDF 库 |\n| Oracle XML Parser v2 |\
  \ XML 解析器 API |\n\n创建的库列在 **Libraries** 窗口中。在 **Project Properties** 窗口中单击 **OK**\
  \ 按钮。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_349_0.png)\n\n## 配置 JasperReports\
  \ 配置文件\n\nJasperReports 报表设计在 XML 配置文件中指定。本节中，XML 配置文件 `catalog.xml` 被配置为 PDF 报表。JasperReports\
  \ 配置文件是基于 `jasperreport.dtd` DTD 的 XML 文件。配置文件的根元素是 `jasperReport`。JasperReports\
  \ XML 文件中其他一些元素（带常用子元素和属性）在以下表格中列出：\n\n| XML 元素 | 描述 | 子元素 | 属性 |\n|---|---|---|---|\n\
  | jasperReport | 根元素 | reportFont, parameter, queryString, field, variable, group,\
  \ title, pageHeader, columnHeader, detail, columnFooter, pageFooter. | name, columnCount,\
  \ pageWidth, pageHeight, orientation, columnWidth, columnSpacing, leftMargin, rightMargin,\
  \ topMargin, bottomMargin. |\n| reportFont | 报表级字体定义。 | Report level font definitions.\
  \ | name, isDefault, fontName,size, isBold, isItalic, isUnderline, isStrikeThrough,\
  \ pdfFontName, pdfEncoding, isPdfEmbedded |\n| parameter | 用于生成报表时引用的对象引用。引用格式为\
  \ P${name} | parameterDescription, defaultValueExpression. | name,class |\n| queryString\
  \ | 指定用于从数据库检索数据的 SQL 查询。 | - | - |\n| field | 包含在报表中的数据库表列。引用格式为 F${name} | fieldDescription\
  \ | name,class |\n| variable | 报表 XML 文件中使用的变量。引用格式为 V${name} | variableExpression,\
  \ initialValueExpression | name,class |\n| title | 报表标题。 | band | - |\n| pageHeader\
  \ | 页眉 | band | - |\n| columnHeader | 指定报表中的不同列。 | band | - |\n| detail | 指定列值。\
  \ | band | - |\n| columnFooter | 列页脚 | band | - |\n| pageFooter | 页脚。 | band | -\
  \ |\n\n报表中的 band 代表报表的一个区段。`band` 元素包含 `staticText` 和 `textElement` 元素。`staticText`\
  \ 元素用于向报表添加静态文本，例如列标题。`textElement` 元素用于向报表添加动态生成的文本，例如从数据库表检索的列值。在 *生成 PDF 报表*\
  \ 部分，从示例 `Catalog` 表生成 JasperReports PDF 报表。示例 JasperReports 配置 XML 文件 `catalog.xml`\
  \ 的 `queryString` 指定了用于检索报表数据的 SQL 查询。\n\n```\n<queryString><![CDATA[SELECT CatalogId,\
  \ Journal, Publisher, Edition, Title, Author FROM OE.Catalog]]></queryString>\n\
  ```\n\n`reportElement` 元素指定报表中使用的 `ARIAL_NORMAL`、`ARIAL_BOLD` 和 `ARIAL_ITALIC` 字体。PDF\
  \ 报表具有列 `CatalogId`、`Journal`、`Publisher`、`Edition`、`Title`、`Author`。JasperReports\
  \ 配置文件 `catalog.xml` 如下所示。\n\n```\n<?xml version='1.0' encoding='utf-8'?>\n<!DOCTYPE\
  \ jasperReport PUBLIC \"-//JasperReports//DTD Report Design//EN\"\n\"http://jasperreports.sourceforge.net/dtds/jasperreport.dtd\"\
  >\n<jasperReport name=\"PDFReport\" pageWidth=\"1250\">\n<!-- Specify report fonts.\
  \ -->\n<reportFont name=\"Arial_Normal\" isDefault=\"true\" fontName=\"Arial\" size=\"\
  15\" isBold=\"false\" isItalic=\"false\" isUnderline=\"false\" isStrikeThrough=\"\
  false\" pdfFontName=\"Helvetica\" pdfEncoding=\"Cp1252\" isPdfEmbedded=\"false\"\
  />\n<reportFont name=\"Arial_Bold\" isDefault=\"false\" fontName=\"Arial\" size=\"\
  15\" isBold=\"true\" isItalic=\"false\" isUnderline=\"false\" isStrikeThrough=\"\
  false\" pdfFontName=\"Helvetica-Bold\" pdfEncoding=\"Cp1252\" isPdfEmbedded=\"false\"\
  />\n<reportFont name=\"Arial_Italic\" isDefault=\"false\" fontName=\"Arial\" size=\"\
  12\" isBold=\"false\" isItalic=\"true\" isUnderline=\"false\" isStrikeThrough=\"\
  false\" pdfFontName=\"Helvetica-Oblique\" pdfEncoding=\"Cp1252\" isPdfEmbedded=\"\
  false\"/>\n<!-- Specify report parameters. -->\n<parameter name=\"ReportTitle\"\
  \ class=\"java.lang.String\"/>\n<!-- Specify SQL Query -->\n<queryString><![CDATA[SELECT\
  \ CatalogId, Journal, Publisher, Edition, Title, Author FROM Catalog]]></queryString>\n\
  <field name=\"CatalogId\" class=\"java.lang.String\"/>\n<field name=\"Journal\"\
  \ class=\"java.lang.String\"/>\n<field name=\"Publisher\" class=\"java.lang.String\"\
  />\n<field name=\"Edition\" class=\"java.lang.String\"/>\n<field name=\"Title\"\
  \ class=\"java.lang.String\"/>\n```\n\n```\n<field name=\"Author\" class=\"java.lang.String\"\
  />\n<!-- Specify report title.-->\n<title>\n    <band height=\"50\">\n        <textField>\n\
