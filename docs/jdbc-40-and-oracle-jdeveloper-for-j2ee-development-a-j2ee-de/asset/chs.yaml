- "## 1 JDBC 4.0\n\nJava 数据库连接 API 用于从 Java 应用程序访问 SQL 数据库。JDBC 还支持表格数据源，例如电子表格。我们将讨论范围限定在\
  \ SQL 关系数据库。使用 JDBC API，可以在数据库中运行 SQL 语句。JDBC 起源于 JDBC 1.0 API；JDBC 1.0 涵盖了与数据库建立连接、运行\
  \ SQL 语句、从结果集中检索值以及使用事务的基础知识。JDBC 2.0 引入了可滚动结果集、更新结果集或数据库表的 JDBC 方法、批量更新以及 SQL3\
  \ 数据类型，如 BLOB、CLOB、Array、Ref 和 Struct。JDBC 3.0 引入了保存点、预处理语句的连接池、多个打开的 ResultSet\
  \ 对象、BOOLEAN 数据类型，以及用于参数元数据和检索数据库元数据的接口。JDBC 4.0 规范增加了一些新功能，我们将在本章中讨论。\n\nJDBC API\
  \ 提供了各种接口和类，用于访问数据库；在数据库中创建表；以及在数据库表中添加、更新、删除数据。在以下各节中，我们将讨论一些 JDBC 类和接口。我们还将讨论\
  \ JDBC 4.0 规范中为这些类或接口添加的新方法。要运行 JDBC 4.0 应用程序，请安装 RDBMS 数据库，例如开源 MySQL 数据库或商业 Oracle\
  \ 数据库。需要 JDBC 驱动程序类来建立与数据库的连接。JDBC 驱动程序是特定于厂商的。JDBC 驱动程序类实现 java.sql.Driver 接口。\n\
  \n### DriverManager 类\n\nDriverManager 类用于获取与数据库的连接。在获取与数据库的连接之前，必须加载 JDBC 驱动程序。在\
  \ JDBC 3.0 中，JDBC 驱动程序可以通过在 jdbc.drivers 系统属性中指定它，或使用 Class.forName() 方法来加载。我们需要通过使用\
  \ JDBC 3.0 加载 Oracle JDBC 驱动程序 oracle.jdbc.OracleDriver 来调用 Class.forName() 方法。\n\
  \n```\nClass.forName(\"oracle.jdbc.OracleDriver\");\n```\n\n在 JDBC 4.0 规范中，DriverManager\
  \ 类已为 Java SE（服务提供者）机制添加了对 getConnection() 和 getDrivers() 方法的支持。通过使用这些方法，JDBC 驱动程序可以自动加载。不需要调用\
  \ Class.forName() 方法。使用 Java SE 服务提供者机制加载驱动程序将在“自动 SQL 驱动程序加载”部分中讨论。\n\nJDBC 连接由\
  \ java.sql.Connection 对象表示，可以通过调用 DriverManager 的重载静态 getConnection() 方法获得。getConnection()\
  \ 方法列在下表中：\n\n| getConnection() 方法 | 描述 |\n|---|---|\n| getConnection(String url\
  \ ) | 使用指定的数据库 URL 获取连接。 |\n| getConnection(String url, Properties properties) |\
  \ 用户名和密码可在 Properties 哈希表中指定。 |\n| getConnection(String url, String user, String\
  \ password) | 使用 URL、用户名和密码获取连接。 |\n\n例如，可以按如下所示获取与 Oracle 数据库的连接：\n\n```\nString\
  \ url=\"jdbc:oracle:thin:@localhost:1521:ORCL\";\nConnection connection = DriverManager.getConnection(url,\
  \ \"oe\", \"pw\");\n```\n\n### Connection 接口\n\nConnection 接口表示与数据库的连接。SQL 语句可通过使用\
  \ Statement 对象在连接会话中运行。默认情况下，Connection 对象处于自动提交模式。在自动提交模式下，执行 SQL 语句后更改会提交到数据库。可以通过调用\
  \ setAutoCommit(boolean autoCommit) 方法修改自动提交模式。例如，自动提交可以设置为 false：\n\n```\nconnection.setAutoCommit(false);\n\
  ```\n\n如果自动提交设置为 false，则需要通过调用 commit() 方法来提交更改：\n\n```\nconnection.commit();\n\
  ```\n\n可以通过调用 setReadOnly() 方法将 Connection 对象设置为只读：\n\n```\nconnection.setReadOnly(true);\n\
  ```\n\n如果不需要 Connection 对象，请通过调用 close() 方法关闭连接：\n\n```\nconnection.close();\n```\n\
  \n下表讨论了在 JDBC 4.0 中添加到 Connection 接口的方法。\n\n| 方法 | 描述 |\n|---|---|\n| createArrayOf()\
  \ | 创建 java.sql.Array 对象。java.sql.Array 是 SQL 数据类型 ARRAY 的 Java 映射。SQL3 数据类型 ARRAY\
  \ 在列中存储数组。 |\n| createBlob() | 创建 Blob 对象。 |\n| createClob() | 创建 Clob 对象。 |\n|\
  \ createNClob() | 创建 NClob 对象。 |\n| createSQLXML() | 创建 SQLXML 对象。 |\n| createStruct()\
  \ | 创建 Struct 对象。 |\n| isValid() | 测试连接的有效性。 |\n| getClientInfo() | 重载方法返回客户端信息属性或客户端信息属性列表。客户端信息表示有关客户端的信息，例如用户名和应用程序名称。\
  \ |\n| setClientInfo() | 重载方法设置客户端信息。 |\n\n### 事务\n\n事务是一组作为一个单元运行的一个或多个语句。如果自动提交的默认值设置为\
  \ true，则每个要运行的 Statement 代表一个事务。执行每个语句后，在自动提交设置为 true 时对数据库进行更改。如果开发人员需要一组语句一起运行，请将自动提交设置为\
  \ false。直到每个语句都运行后，才会对数据库进行更改。如果自动提交设置为 false，则通过 commit() 方法提交对数据库的更改。commit()\
  \ 方法将自上次提交到数据库后运行的 SQL 语句提交。两次连续提交到数据库之间运行的语句组代表一个事务。rollback() 方法回滚当前事务中进行的更改。如果发生错误或\
  \ SQLException，则可能需要回滚事务。\n\n```\nconnection.rollback();\n```\n\n当一个事务正在修改数据库表时，另一个事务可能正在从同一表读取。读取类型可以是脏读、不可重复读或幻读。脏读发生在某行已被一个事务修改但尚未提交，而被另一个事务读取时。如果修改行的事务回滚，则第二个事务检索到的值将是错误的。不可重复事务发生在某个事务读取一行而另一个事务修改它时。第一个事务重新读取该行，得到不同的值。幻读发生在某个事务使用\
  \ WHERE 条件检索结果集，而另一个事务添加了一行满足 WHERE 条件时。第一个事务重新运行以生成具有额外行的结果集。默认事务级别可以通过 getTransactionLevel()\
  \ 方法获得：\n\n```\nint transactionLevel=connection.getTransactionIsolation();\n```\n\
  \n不同的事务隔离级别列在下表中：\n\n| 事务隔离级别 | 描述 |\n|---|---|\n| TRANSACTION_NONE | 事务不受支持。 |\n\
  | TRANSACTION_READ_COMMITTED | 不能进行脏读。可以进行不可重复读和幻读。 |\n| TRANSACTION_REPEATABLE_READ\
  \ | 不能进行脏读和不可重复读。可以进行幻读。 |\n| TRANSACTION_SERIALIZABLE | 不能进行脏读、不可重复读和幻读。 |\n\n\
  可以通过 setTransactionIsolation(int level) 方法设置事务隔离级别：\n\n```\nconnection.setTransactionIsolation(level);\n\
  ```\n\n### Savepoint 接口\n\nSavepoint 是 JDBC 3.0 规范中的一个新接口。Savepoint 是事务中的一个点，如果使用\
  \ rollback() 方法回滚事务，则事务中在此点之前所做的更改将被回滚。当事务回滚时，保存点之前的更改将被实施。保存点通过重载的 setSavepoint()\
  \ 方法设置：\n\n```\nSavepoint savepoint=connection.setSavepoint();\nSavepoint savepoint=connection.setSavepoint(\"\
  savepointName\");\n```\n\n\n\ngetSavepointId() 方法返回保存点 ID，getSavepointName() 方法返回保存点名称。\n\
  \n### Statement 接口\n\nStatement 接口在数据库中运行 SQL 语句并返回结果集。Statement 对象通过重载的 createStatement()\
  \ 方法从 Connection 对象获取。在列举不同的 createStatement() 方法之前，我们将讨论结果集类型、结果集并发性和结果集持有性。有三种结果集类型：\n\
  \n- 1. TYPE_FORWARD_ONLY\n- 2. TYPE_SCROLL_INSENSITIVE\n- 3. TYPE_SCROLL_SENSITIVE\n\
  \nTYPE_FORWARD_ONLY 结果集不可滚动。其光标仅向前移动。结果集中的行满足查询，要么在查询执行时，要么在行被检索时。\n\nTYPE_SCROLL_INSENSITIVE\
  \ 结果集可滚动。结果集中的行不反映数据库中进行的更改。结果集中的行满足查询，要么在查询执行时，要么在行被检索时。\n\nTYPE_SCROLL_SENSITIVE\
  \ 结果集可滚动，并在结果集打开时反映对数据库所做的更改。\n\n结果集并发性指定可更新性级别。有两个并发级别：\n\n- 1. CONCUR_READ_ONLY\n\
  - 2. CONCUR_UPDATABLE\n\nCONCUR_READ_ONLY 是默认的并发级别。CONCUR_READ_ONLY 并发性指定不可更新的结果集，而\
  \ CONCUR_UPDATABLE 并发性指定可更新的结果集。\n\n持有性指定在调用 commit() 方法时结果集对象应保持打开。有两个持有性值：\n\n\
  - 1. HOLD_CURSORS_OVER_COMMIT\n- 2. CLOSE_CURSORS_AT_COMMIT\n\n如果指定了 HOLD_CURSORS_OVER_COMMIT，则在调用\
  \ commit() 方法后结果集对象（即光标）保持打开。如果指定了 CLOSE_CURSORS_AT_COMMIT，则在 commit() 方法时结果集对象将被关闭。\n\
  \n用于从 Connection 对象创建 Statement 对象的不同 createStatement() 方法在下表中进行了讨论：\n\n| 创建 Statement\
  \ 方法 | 描述 |\n|---|---|\n| createStatement() | 使用类型为 TYPE_FORWARD_ONLY 且并发性为 CONCUR_READ_ONLY\
  \ 的结果集创建 Statement 对象。 |\n| createStatement(int resultSetType, int resultSetConcurrency)\
  \ | 使用指定的结果集类型和结果集并发性创建 Statement 对象。实现相关，使用 resultSetHoldability。 |\n| createStatement(int\
  \ resultSetType, int resultSetConcurrency, int resultSetHoldability) | 使用指定的结果集类型、并发性和持有性创建\
  \ Statement 对象。 |\n\n可用不同的 execute() 方法运行可能返回多个结果的 SQL 语句。execute(String sqlStatement)\
  \ 方法运行 SQL 语句并返回一个布尔值，表示第一个结果是 ResultSet 对象还是更新计数。如果返回 true，则第一个结果是 ResultSet 对象。如果返回\
  \ false，则第一个结果是更新计数。如果第一个结果是 ResultSet 对象，则可通过 getResultSet() 方法获取 ResultSet 对象。如果第一个结果是更新计数，则可通过\
  \ getUpdateCount() 方法获取更新计数：\n\n```\nStatement stmt=connection.createStatement();\n\
  boolean resultType=stmt.execute(\"SQL Statement\");\nif(resultType==true)\nResultSet\
  \ resultSet=stmt.getResultSet();\nelse\nint updateCount=stmt.getUpdateCount();\n\
  ```\n\nexecute() 方法可以返回多个结果。要获取其他结果，请调用 getMoreResults() 方法。getMoreResults() 方法的返回值与\
  \ execute() 方法类似。JDBC 3.0 引入了 getMoreResults(int) 方法，以指定在打开新结果集之前是否应关闭当前结果集。getMoreResults(int)\
  \ 方法的参数值可以是 CLOSE_ALL_RESULTS、CLOSE_CURRENT_RESULT 或 KEEP_CURRENT_RESULT。如果参数值为\
  \ CLOSE_ALL_RESULTS，则所有先前打开的 ResultSet 对象将被关闭。如果值为 CLOSE_CURRENT_RESULT，则仅关闭当前 ResultSet\
  \ 对象。如果值为 KEEP_CURRENT_RESULT，则当前 ResultSet 对象不会被关闭。\n\n`setQueryTimeout (int)`\
  \ 方法指定 `Statement` 对象执行的超时时间（以秒为单位）。`executeQuery(String sql)` 执行 SQL 查询并返回单个 `ResultSet`\
  \ 对象。`executeUpdate(String sql)` 方法执行 SQL 语句，该语句要么是 **DML**（INSERT、UPDATE 或 DELETE）语句，要么是\
  \ **DDL** 语句。如果 SQL 字符串是 DML 语句，则 `executeUpdate(String)` 方法返回修改的行数。如果 SQL 字符串是\
  \ DDL 语句，则方法返回值为 \"0\"。SQL 语句也可以使用 `executeBatch()` 方法批量运行。使用 `addBatch(String sql)`\
  \ 方法添加要运行批处理的 SQL 命令：\n\n```\nstmt.addBatch(\"SQL command\");\nstmt.executeBatch();\n\
  ```\n\n`executeBatch()` 方法返回一个 `int []` 更新计数。批处理 SQL 命令可通过 `clearBatch()` 方法清除。如果\
  \ `Statement` 对象未被使用，则会自动关闭。建议使用 `close()` 方法关闭 `Statement` 对象：\n\n```\nstmt.close();\n\
  ```\n\n当 `Statement` 对象被关闭时，与该对象关联的数据库和 JDBC 资源也会被关闭。此外，与 `Statement` 对象关联的 `ResultSet`\
  \ 对象也会被关闭。\n\n在 JDBC 4.0 中，以下表中讨论的新方法已添加到 Statement 接口：\n\n| 方法 | 描述 |\n|---|---|\n\
  | `isClosed()` | 测试 `Statement` 对象是否已关闭。 |\n| `isPoolable()` | 测试 `Statement` 对象是否可池化。\
  \ |\n| `setPoolable()` | 将 `Statement` 对象设置为可池化。默认情况下，`Statement` 对象未设置为可池化。该方法仅是对语句池实现的一个提示。语句池提供更好的语句池资源管理。\
  \ |\n\n### ResultSet 接口\n\nResultSet 是一个数据表，即数据库结果集。结果集类型、并发性和持有性已在上一节中讨论过。可以创建\
  \ ResultSet 对象以便在提交时滚动、更新并保持光标打开：\n\n```\nStatement stmt=connection.createStatement(\n\
  \    ResultSet.TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_UPDATABLE,\n    ResultSet.HOLD_CURSORS_OVER_COMMIT);\n\
  ResultSet rs=stmt.execute(\"sql\");\n```\n\nResultSet 有一个光标，指向当前行。最初，光标指向第一行之前。next()\
  \ 方法将光标移动到下一行。previous() 方法将光标移至上一行。ResultSet 接口提供不同的方法来定位光标。如果 ResultSet 可滚动，则结果集类型为\
  \ TYPE_SCROLL_INSENSITIVE 或 TYPE_SCROLL_SENSITIVE，并且光标可以移至指定位置。用于定位 ResultSet 光标的一些方法在下表中列出：\n\
  \n| ResultSet 方法 | 描述 |\n|---|---|\n| absolute(int row) | 将光标定位到指定的行。第一行的索引为 1。如果索引为负数，则光标相对于结果集末尾定位。-1\
  \ 索引将光标定位到最后一行。如果索引大于 ResultSet 中的行数，则光标定位在 ResultSet 末尾。如果负索引小于行数，则光标定位在第一行之前。该方法在光标位于\
  \ ResultSet 内时返回 true。 |\n| afterLast() | 将光标定位在最后一行之后。 |\n| beforeFirst() | 将光标定位在第一行之前。如果\
  \ ResultSet 为 TYPE_FORWARD_ONLY，则会生成 SQLException |\n| first() | 将光标定位在 ResultSet\
  \ 中的第一行。如果光标位于有效行，则返回值为 true。 |\n| last() | 将光标定位在 ResultSet 中的最后一行。 |\n| relative(int\
  \ rows) | 将光标定位到相对于当前行的指定行数。如果相对位置在当前行之前或之后，则光标定位在当前行之前或之后。 |\n\n\n\n\n对于可更新的结果集，方法\
  \ moveToInsertRow() 将光标移动到插入行，该插入行是一个缓冲区，用于插入新行。光标可以通过方法 moveToCurrentRow() 移回当前行。ResultSet\
  \ 接口具有用于获取光标位置的方法，列于下表中：\n\n| 方法名称 | 描述 |\n|---|---|\n| isAfterLast() | 返回 true，如果光标位置在最后一行之后。\
  \ |\n| isFirst() | 返回 true，如果光标位置在第一行。 |\n| isLast() | 返回 true，如果光标位置在最后一行。 |\n\
  | isBeforeFirst() | 返回 true，如果光标位置在第一行之前。 |\n\nResultSet 列值是借助 getter 方法获得的。ResultSet\
  \ 接口为映射到数据库数据类型的每个 Java 数据类型提供一个 'getter' 方法。如果数据库数据类型可以映射到 Java 数据类型，则返回 Java 数据类型。每个数据类型都包含一个具有列索引位置和列名称的\
  \ getter 方法。具有列索引位置的 getter 方法更高效。以索引位置检索 int 列值，并以下列方式使用列名称检索 String 列值：\n\n```\n\
  ResultSet rs;\nint intColumnValue = rs.getInt(1);\nString stringColumnValue = rs.getString(\"\
  column name\");\n```\n\nResultSet 接口具有用于更新行中列值的 updater 方法。为映射到数据库数据类型的每个 Java 数据类型包含一个\
  \ 'updater' 方法。如果 ResultSet 可更新，则可以更新行中的列值，或添加新行。要更新一行，请将光标移动到要更新的行。例如，将光标移至第十行。使用\
  \ updater 方法更新列值。例如，将 String 列 column1 更新为值 col1val。也更新数据库中的行：\n\n```\nrs.absolute(10);\n\
  rs.updateString(\"column1\", \"col1val\");\nrs.updateRow();\n```\n\n方法 updateRow()\
  \ 更新数据库。要添加新行，请使用 moveToInsertRow() 方法将光标移至插入行。使用 updater 方法添加列值，并使用 insertRow()\
  \ 方法在数据库中插入一行。使用 moveToCurrentRow() 方法将光标移至当前行：\n\n```\nrs.moveToInsertRow();\n\
  rs.updateString(1, \"JDBC4.0\");\nrs.updateInt(2,16);\n```\n\n```\nrs.updateBoolean(3,\
  \ true);\nrs.insertRow();\nrs.moveToCurrentRow();\n```\n\nResultSet 中的当前行可以使用 deleteRow()\
  \ 方法删除。当创建 ResultSet 对象的 Statement 对象被关闭时，ResultSet 对象会自动关闭并释放相关资源。但是，建议使用 close()\
  \ 方法关闭 ResultSet 对象。\n\n```\nrs.close();\n```\n\n在 JDBC 4.0 中，以下表中讨论的方法已添加到 ResultSet\
  \ 接口：\n\n| 方法 | 描述 |\n|---|---|\n| getHoldability() | 返回 ResultSet 对象的保持性。 |\n|\
  \ getRowId() | 重载方法返回指定列的行 ID。 |\n| updateRowId() | 重载方法更新指定对象的 RowId 的行 ID。 |\n\
  | getNClob() | 重载方法将指定列作为 NClob 对象返回。 |\n| isClosed() | 返回布尔值以指示 ResultSet 对象是否已关闭。\
  \ |\n| getNString() | 重载方法将指定列作为 String 对象返回，用于 NCHAR、NVARCHAR 和 LONGNVARCHAR 列。\
  \ |\n| getNCharacterStream() | 重载方法将指定列值作为 java.io.Reader 对象返回，用于 NCHAR、NVARCHAR\
  \ 和 LONGNVARCHAR 列。 |\n| updateNString() | 重载方法使用指定的 String 值更新指定列，用于 NCHAR、NVARCHAR\
  \ 和 LONGNVARCHAR 列。 |\n| updateNCharacterStream() | 重载方法使用指定的字符流和指定的 String 值更新指定列。用于\
  \ NCHAR、NVARCHAR 和 LONGNVARCHAR 列。 |\n| getSQLXML() | 重载方法将指定列作为 SQLXML 对象返回。本章后面的部分将讨论\
  \ SQLXML Java 数据类型。 |\n| updateSQLXML() | 重载方法使用指定的 SQLXML 值更新指定列。 |\n| updateNClob()\
  \ | 重载方法使用指定的 Reader 对象更新指定列。 |\n\nResultSet 接口中的 updateObject() 方法已修改为在 JDBC 4.0\
  \ 中支持新的数据类型 NClob 和 SQLXML。表中的 updater 方法不会更新底层数据库。要更新数据库，需要调用 insertRow() 或 updateRow()\
  \ 方法。\n\n### PreparedStatement 接口\n\nPreparedStatement 对象表示预编译的 SQL 语句。PreparedStatement\
  \ 接口扩展了 Statement 接口。预编译的 SQL 语句具有 IN 参数，其值通过 PreparedStatement 接口的 setter 方法设置。为映射到\
  \ SQL 数据类型的每个 Java 数据类型包含一个 'setter' 方法。JDBC 驱动程序将 Java 数据类型转换为 SQL 数据类型。IN 参数值使用参数索引设置。例如，使用\
  \ PreparedStatement 更新具有以下定义的 Catalog 表：\n\n```\nCatalogId NUMBER\nJournal VARCHAR(255)\n\
  Publisher VARCHAR(255)\nTitle VARCHAR(255)\nAuthor VARCHAR(255)\n```\n\n将 Publisher\
  \ 列值设置为 Oracle Publishing，并将 Journal 列值设置为 Oracle Magazine，其中 CatalogId 为 1，参考下面的代码：\n\
  \n```\nPreparedStatement pstmt = connection.prepareStatement(\"UPDATE CATALOG SET\
  \ Journal=? AND Publisher=? WHERE CatalogId=?\");\npstmt.setString(1, \"Oracle Magazine\"\
  );\npstmt.setString(2, \"Oracle Publishing\");\npstmt.setInt(3, 1);\npstmt.executeUpdate();\n\
  ```\n\n如果数据库支持语句池，则 PreparedStatement 对象默认会被池化。在 JDBC 4.0 中，以下表中讨论的方法已添加到 PreparedStatement\
  \ 接口：\n\n| 方法 | 描述 |\n|---|---|\n| setRowId() | 将指定参数设置为指定的 RowId 值。驱动程序将值转换为 SQL\
  \ 类型 ROWID。 |\n| setNString() | 将指定参数设置为指定的 String 值。驱动程序将值转换为 NCHAR、NVARCHAR 或\
  \ LONGNVARCHAR SQL 数据类型。 |\n| setNClob() | 重载方法将指定参数设置为指定的 NClob 对象或 Reader 对象。驱动程序将值转换为\
  \ SQL 类型 NCLOB。 |\n| setNCharacterStream() | 重载方法将指定参数设置为指定的 Reader 对象。 |\n| setSQLXML()\
  \ | 将指定参数设置为指定的 SQLXML 值。驱动程序将值转换为 SQL 类型 XML。 |\n\n### 数据库元数据\n\n不同的 RDBMS 数据库结合数据库特定的\
  \ JDBC 驱动程序通常以不同的方式支持并实现功能。它还支持不同的 SQL 数据类型。使用不同数据库的应用程序需要获取数据库特定的信息。例如，应用程序可能需要检索有关数据库支持的所有\
  \ SQL 数据类型的的信息。实现批更新的应用程序需要查明数据库是否支持批更新。DatabaseMetaData 接口表示数据库元数据。数据库元数据从 Connection\
  \ 对象获取：\n\n```\nDatabaseMetaData metadata = currentConnection.getMetaData();\n```\n\
  \n可以使用 getTypeInfo() 方法获取数据库支持的 SQL 数据类型：\n\n```\nResultSet resultSet=metadata.getTypeInfo();\n\
  ```\n\n要查明数据库是否支持批更新，请调用 supportsBatchUpdates() 方法：\n\n```\nmetadata.supportsBatchUpdates();\n\
  ```\n\n要查明数据库是否支持事务，请调用 supportsTransactions() 方法，要查明数据库是否支持保存点，请调用 supportsSavepoints()\
  \ 方法：\n\n```\nmetadata.supportsTransactions();\nmetadata.supportsSavepoints();\n\
  ```\n\n可以使用 supportsResultSetType() 方法检查 ResultSet 类型的支持情况，而可以使用 supportsResultSetConcurrency()\
  \ 方法检查与结果集类型组合的并发类型的支持情况。可以使用 supportsResultSetHoldability() 方法检查结果集保持性的支持情况：\n\n\
  ```\nmetadata.supportsResultSetType(ResultSet.TYPE_SCROLL_INSENSITIVE);\nmetadata.supportsResultSetConcurrency(ResultSet.\n\
  \    TYPE_SCROLL_INSENSITIVE, ResultSet.CONCUR_UPDATABLE);\nmetadata.supportsResultSetHoldability(ResultSet.\n\
  \    CLOSE_CURSORS_AT_COMMIT);\n```\n\n数据库元数据还包含有关数据库支持的不同 SQL 子句的信息。GROUP BY 子句的支持通过\
  \ supportsGroupBy() 方法检查；SELECT FOR UPDATE 的支持通过 supportsSelectForUpdate() 方法检查；UNION\
  \ 子句的支持通过 supportsUnion() 方法检查；ALTER TABLE 添加列的支持通过 supportsAlterTableWithAddColumn()\
  \ 方法检查；以及混合大小写 SQL 标识符的支持通过 storesMixedCaseIdentifiers() 方法检查。此外，可在 SELECT 语句中指定的最大列数可通过\
  \ getMaxColumnsInSelect() 方法获得。\n\n数据库元数据还提供有关 JDBC 驱动程序和数据库的信息。数据库产品名称、数据库主要版本、驱动程序主要版本、驱动程序名称、驱动程序版本以及驱动程序支持的\
  \ JDBC 主要版本按如下方式获得：\n\n```\nString database=metadata.getDatabaseProductName();\n\
  int databaseMajorVersion=metadata.getDatabaseMajorVersion();\nint driverMajorVersion=metadata.getDriverMajorVersion();\n\
  String driverName=metadata.getDriverName();\nint driverVersion=metadata.getDriverVersion();\n\
  int jdbcMajorVersion=metadata.getJDBCMajorVersion();\n```\n\n数据库表的元数据通过 getTables(String\
  \ catalog,String schemaPattern,String tableNamePattern,String[] types) 方法获得。参数 catalog\
  \ 是数据库中的目录名称。SchemaPattern 是模式模式。TableNamePattern 是表名模式，types 表示表类型。表类型包括 TABLE、VIEW、SYSTEM\
  \ TABLE、GLOBAL TEMPORARY、LOCAL TEMPORARY、ALIAS 和 SYNONYM。获取类型为 TABLE 的所有表：\n\n```\n\
  String[] names = {\"TABLE\"};\nResultSet tables = metadata.getTables(null,\"%\"\
  , \"%\", names);\n```\n\n从表的元数据中获取表名和表模式：\n\n```\nwhile (tables.next()) {\n    String\
  \ tableName = tables.getString(\"TABLE_NAME\");\n    String tableSchema = tables.getString(\"\
  TABLE_SCHEM\");\n}\n```\n\n列的元数据可通过 getColumns(String catalog,String schemaPattern,String\
  \ tableNamePattern,String columnNamePattern) 方法获得。获取从表元数据中获得的表名的列元数据：\n\n```\nResultSet\
  \ columns = metadata.getColumns(null, \"%\", tableName, \"%\");\n```\n\n获取列名、列类型、列大小和列是否可空：\n\
  \n```\nwhile (columns.next()) {\n    String columnName = columns.getString(\"COLUMN_NAME\"\
  );\n    String datatype = columns.getString(\"TYPE_NAME\");\n    int datasize =\
  \ columns.getInt(\"COLUMN_SIZE\");\n    int nullable = columns.getInt(\"NULLABLE\"\
  );\n}\n```\n\n数据库中的过程可通过 getProcedures(String catalog,String schemaPattern, String\
  \ procedureNamePattern) 方法获得：\n\n```\nResultSet procedures=metadata.getProcedures(null,\"\
  %\", \"%\");\n```\n\n获取过程名、过程类型和过程模式：\n\n```\nwhile (procedures.next())\n{\n   \
  \ String procedureName = procedures.getString(\"PROCEDURE_NAME\");\n    String procedureSchema\
  \ = procedures.getString(\"PROCEDURE_SCHEM\");\n    String procedureType = procedures.getString(\"\
  PROCEDURE_TYPE\");\n}\n```\n\n在 JDBC 4.0 中，以下表中讨论的方法已添加到 DatabaseMetaData 接口中：\n\
  \n| 方法 | 描述 |\n|---|---|\n| getRowIdLifetime() | 指示数据库是否支持 SQL 数据类型 ROWID，以及 RowId\
  \ 对象的有效持续时间。返回的值为以下之一：RowIdLifetime.ROWID_UNSUPPORTED。RowIdLifetime.ROWID_VALID_OTHER。RowIdLifetime.ROWID_VALID_SESSION。RowIdLifetime.ROWID_VALID_TRANSACTION。RowIdLifetime.ROWID_VALID_FOREVER。\
  \ |\n| autoCommitFailureClosesAllResultSets() | 指示是否关闭所有 ResultSet，以及在 autocommit\
  \ 设置为 true 时是否生成 SQLException。 |\n| getFunctions() | 检索指定目录中的系统函数和用户函数的 ResultSet。函数和过程不在本书的讨论范围之内。\
  \ |\n| getFunctionColumns() | 检索指定目录的系统参数和用户参数的 ResultSet。 |\n| getClientInfoProperties()\
  \ | 检索 JDBC 驱动程序支持的客户端信息属性的 ResultSet。 |\n| supportsStoredFunctionsUsingCallSyntax()\
  \ | 指示数据库是否支持使用 CALL 语法调用函数。 |\n\nDatabaseMetaData 接口中的 getSchemas() 方法已被重载以支持目录名称和模式模式。\n\
  \n### JDBC 异常\n\nSQLException 是在 JDBC 应用程序中生成的主要异常。SQL 异常的详细信息可通过 SQLException 对象使用\
  \ SQLException 方法获得，其中一些方法在下表中讨论：\n\n| 方法 | 描述 |\n|---|---|\n| getMessage() | 返回错误的文本描述。\
  \ |\n| getSQLState() | 返回 SQLException 的 SQLState。 |\n| getErrorCode() | 返回 SQLException\
  \ 对象的实现特定错误代码。 |\n| getCause() | 返回 SQLException 的原因，如果原因未指定或未知则返回 null。 |\n| getNextException()\
  \ | 返回链接到 SQLException 的异常。所有链接的异常都可以通过递归调用 getNextException() 方法检索。如果没有链接的异常，则返回\
  \ null。 |\n| getMessage() | 返回错误的文本描述。 |\n\n当发生 SQLException 时，很可能还有一个或多个链接到它的 SQLException\
  \ 也发生了。链接的异常可以通过递归调用 getNextException() 方法检索，直到该方法返回 null。SQLException 的原因可使用 getCause()\
  \ 方法检索。链接的原因也可以通过递归调用 getCause() 方法检索，直到返回值为 null。\n\n如果生成 SQLException，使用 getMessage()\
  \ 方法输出异常消息，使用 getCause() 方法递归输出异常原因，并使用 getNextException() 方法递归检索链接到该异常的异常：\n\n\
  ```java\ncatch(SQLException e)\n{\n    while(e != null)\n    {\n        System.out.println(\"\
  SQLException Message:\" + e.getMessage());\n        Throwable t = e.getCause();\n\
  \        while(t != null)\n        {\n            System.out.println(\"SQLException\
  \ Cause:\" + t);\n            t = t.getCause();\n        }\n        e = e.getNextException();\n\
  \    }\n}\n```\n\nSQLException 类中的一些子类在下表中列出：\n\n| 异常 | 描述 |\n|---|---|\n| javax.sql.rowset.RowSetWarning\
  \ | RowSet 对象上的数据库警告。 |\n| javax.sql.rowset.serial.SerialException | 指示在序列化与反序列化\
  \ SQL 类型（如：BLOB、CLOB、STRUCT、ARRAY）时出现错误。 |\n| java.sql.SQLWarning | 数据库访问警告。 |\n\
  | java.sql.DataTruncation | 指示数据截断。 |\n| java.sql.BatchUpdateException | 表示批更新操作中的错误。\
  \ |\n\nJDBC 4.0 已添加对 SQLException 分类支持并增强了对链接 SQLException 的支持，我们将在后面的章节中讨论。\n\n\
  ### JDBC 4.0 中的新功能\n\nJDBC 4.0 规范于 2006 年 12 月发布。大多数数据库在其 JDBC 驱动程序中至少提供对 JDBC 4.0\
  \ 规范的部分支持。JDBC 4.0 规范在 JDK 6.0 中实现。JDBC 4.0 规范的一些新功能以及数据库对 JDBC 4.0 规范的支持将在以下章节中讨论。\n\
  \n### 自动 SQL 驱动程序加载\n\nJDBC 4.0 促进了 JDBC 驱动程序的加载。在 JDBC 3.0 中，JDBC 驱动程序通过 Class.forName(String)\
  \ 方法加载。Oracle JDBC 驱动程序按如下方式加载：\n\n```\nClass.forName(\"oracle.jdbc.OracleDriver\"\
  );\n```\n\n在 JDBC 4.0 中，JDBC 驱动程序通过 Java 标准版服务提供者机制自动加载。当调用 java.sql.DriverManager.getConnection()\
  \ 方法时加载 JDBC 驱动程序。要通过服务提供者机制加载 JDBC 驱动程序，JDBC 4.0 驱动程序应包含 META-INF/services/java.sql.Driver\
  \ 文件。在 java.sql.Driver 文件中，指定要加载的 JDBC 驱动程序类。如果要加载 oracle.jdbc.OracleDriver，则在 java.sql.Driver\
  \ 文件中指定以下行：\n\n```\noracle.jdbc.OracleDriver\n```\n\n可以在 java.sql.Driver 文件中指定多个驱动程序类，每行一个。可通过\
  \ getDrivers() 方法获得可供 DriverManager 使用的 JDBC 驱动程序列表：\n\n```\nEnumeration<Driver>\
  \ drivers=DriverManager.getDrivers();\n```\n\n可使用 DriverManager 类的 getConnection()\
  \ 方法获得 JDBC 连接：\n\n```\nString url=\"jdbc:oracle:thin:@localhost:1521:ORCL\";\n\
  Connection connection = DriverManager.getConnection(url,\"oe\", \"pw\");\n```\n\n\
  ### 增强的数据类型支持\n\nJDBC 4.0 已添加对一些新的 SQL 数据类型的支持。用于标识表中一行的 ROWID SQL 数据类型映射到 java.sql.RowId\
  \ Java 数据类型。Reader 方法 readRowId() 已添加到 SQLInput 接口，writer 方法 writeRowId() 已添加到 SQLOutput\
  \ 接口以读取和写入 ROWID 值。\n\n\n\n在 JDBC 3.0 中，JDBC 驱动程序仅支持 Unicode 字符集。SQL: 2003 标准增加了对\
  \ SQL 类型 NCHAR、NVARCHAR、LONGNVARCHAR 和 NCLOB 的支持，其中值使用国家字符集 (NCS) 编码。使用 JDBC 3.0\
  \ 驱动程序时，国家字符集 SQL 数据类型值会被转换为 Unicode 字符集值。如果需要进行大量的字符处理操作，NCS 数据类型可能更合适。对国家字符集数据库数据类型\
  \ NCHAR、NVARCHAR、LONGNVARCHAR 和 NCLOB 的支持已在 JDBC 4.0 中添加。\n\nSetter 方法 setNString()、setNCharacterStream()\
  \ 和 setNClob() 已添加到 PreparedStatement 和 CallableStatement 接口。Getter 方法 getNString()、getNCharacterStream()\
  \ 和 getNClob() 已添加到 CallableStatement 和 ResultSet 接口。Updater 方法 updateNString()、updateNCharacterStream()\
  \ 和 updateNClob() 已添加到 ResultSet 接口。为了创建 NClob 对象，createNClob() 方法已添加到 Connection\
  \ 接口。Reader 方法 readNString() 和 readNClob() 已添加到 SQLInput 接口，用于读取 NCHAR、NVARCHAR、LONGNVARCHAR\
  \ 和 NCLOB 值。Writer 方法 writeNClob() 和 writeNString() 已添加到 SQLOutput 接口，用于写入 NCHAR、NVARCHAR、LONGNVARCHAR\
  \ 和 NCLOB 值。\n\n在 JDBC 4.0 中，对 BLOB 和 CLOB SQL 数据类型的支持得到了增强。为了创建 java.sql.Blob 和\
  \ java.sql.Clob 对象，createBlob() 和 createClob() 等方法已添加到 Connection 接口。在 PreparedStatement\
  \ 和 CallableStatement 接口中，setBlob() 方法已被重载以从 InputStream 设置 Blob 值，setClob() 方法已被重载以从\
  \ Reader 设置 Clob 值。在 ResultSet 接口中，updater 方法 updateBlob() 已被重载以从 InputStream 更新列，updater\
  \ 方法 updateClob() 已被重载以从 Reader 更新列。为了释放 Blob 和 Clob 对象中的资源，free() 方法已添加到 Blob 和\
  \ Clob 接口。\n\nCallableStatement 和 PreparedStatement 接口中的 setAsciiStream、setBinaryStream\
  \ 和 setCharacterStream 方法已被重载。这些接口已被重载以支持类型为 long 的 length 参数，除类型为 int 的 length\
  \ 参数之外。length 参数指定 InputStream 或 Reader 对象的字节数或字符数。此外，CallableStatement 和 PreparedStatement\
  \ 接口中的 setAsciiStream、setBinaryStream 和 setCharacterStream 方法已被重载为不带 length 参数的版本。\n\
  \nCallableStatement 和 PreparedStatement 接口中的 setBlob() 方法已被重载为另外两种方法，以从 InputStream\
  \ 对象设置参数值，一种带有用于二进制流长度的 length 参数，另一种不带 length 参数。如果 InputStream 长度与指定的长度不匹配，则会生成\
  \ SQLException。CallableStatement 和 PreparedStatement 接口中的 setClob() 方法已被重载为另外两种方法，以从\
  \ Reader 对象设置参数值，一种带有用于 Reader 对象中字符数的 length 参数，另一种不带 length 参数。\n\n如果 Reader 对象中的字符数与指定的长度不匹配，则会生成\
  \ SQLException。与 PreparedStatement/CallableStatement 中的 setter 方法类似，ResultSet 接口中的\
  \ updateAsciiStream、updateBinaryStream、updateBlob、updateCharacterStream 和 updateClob\
  \ 方法已被重载。与 PreparedStatement 和 CallableStatement 接口的 setBlob 和 setClob 方法不同，如果 InputStream/Reader\
  \ 长度与指定的长度不匹配，ResultSet 接口的 updateBlob 和 updateClob 方法不会生成 SQLException。\n\n###\
  \ SQL: 2003 XML 数据类型支持\n\nSQL: 2003 标准支持一种新的数据类型 XML，用于存储 XML 文档。有了 XML 数据类型，XML\
  \ 文档可以像其他数据类型一样存储在数据库表列中。JDBC 4.0 支持 SQL: 2003 标准。java.sql.SQLXML 对象是数据库类型 XML 的\
  \ Java 映射。在 SQLXML Java 数据类型之前，XML 类型列值只能作为 String 或 CLOB 检索，这不包括访问 XML 文档中不同节点的功能。\n\
  \n在 SQLXML 数据类型的帮助下，XML 类型数据库列可以映射到 Java 数据类型。在 JDBC 4.0 规范中，java.sql.Connection\
  \ 对象具有创建初始不包含任何数据的 SQLXML 对象的 provision。数据可以通过 setString() 方法或 setBinaryStream()、setCharacterStream()\
  \ 和 setResult() 方法添加。SQLXML 对象可以通过使用重载的 getSQLXML() 方法从 ResultSet 或 CallableStatement\
  \ 检索。SQLXML 对象中的数据可以通过 getString() 方法或 getBinaryStream()、getCharacterStream() 和\
  \ getSource() 方法检索。SQLXML 对象可以使用 PreparedStatement 接口的 setSQLXML() 方法存储在类型为 XML\
  \ 的数据库表列中，这与任何其他数据类型类似。\n\nSQL Server 2005 EXPRESS 支持 XML 数据类型，而 SQL Server 2000\
  \ 不支持。IBM 的 DB2 UDB V 9 也支持 XML 数据类型。要确定数据库是否支持 XML 数据类型，请从 Connection 对象获取数据库元数据：\n\
  \n```\nDatabaseMetaData metadata= connection.getMetaData();\n```\n\n使用 getTypeInfo()\
  \ 方法支持的数据类型，如下所示：\n\n```\nResultSet rs=metadata.getTypeInfo();\n```\n\n遍历数据类型结果集并输出\
  \ TYPE_NAME 列，如下所示：\n\n```\nSystem.out.println(\"TYPE_NAME:\"+rs.getString(\"TYPE_NAME\"\
  )) ;\n```\n\n对于 SQL Server 2005 和 IBM 的 DB2 UDB v9，会输出 XML TYPE_NAME：\n\nTYPE_NAME:\
  \ XML\n\n在以下小节中，将讨论创建 XML 文档、将其存储在支持 XML 数据类型的数据库中以及从数据库检索它的过程。\n\n### 生成 XML 文档\n\
  \n我们将讨论创建和初始化 SQLXML 对象的过程。导入 java.sql 包和 javax.xml.stream 包：\n\n```\nimport java.sql.*;\n\
  import javax.xml.stream.*;\n```\n\n数据库表中 XML 文档的 Java 表示形式是 SQLXML 对象。使用 createSQLXML()\
  \ 方法从 Connection 对象创建 SQLXML 对象，如下所示：\n\n```\nSQLXML sqlXML=connection.createSQLXML();\n\
  ```\n\nSQLXML 对象可以使用 setString()、setBinaryStream()、setCharacterStream() 或 setResult()\
  \ 方法之一进行初始化。SQLXML 对象可以使用 setResult() 方法和 StAXResult 类进行初始化。从 StAXResult 对象创建 XMLStreamWriter\
  \ 对象，如下所示：\n\n```\nStAXResult staxResult = sqlXML.setResult(StAXResult.class);\n\
  XMLStreamWriter xmlStreamWriter = staxResult.getXMLStreamWriter();\n```\n\n调用 setResult()\
  \ 方法后，SQLXML 对象变为不可写。使用 writeStartDocument(String,String) 方法添加 XML 文档的开始，如下所示：\n\
  \n```\nxmlStreamWriter.writeStartDocument(\"UTF-8\",\"1.0\");\n```\n\nXML 文档的编码和版本在\
  \ writeStartDocument 方法中指定。使用 writeStartElement (String localName) 方法添加元素的开始，如下所示：\n\
  \n```\nxmlStreamWriter.writeStartElement(\"catalog\");\n```\n\n使用 writeAttribute(String\
  \ localName, String value) 方法添加元素属性。使用 writeCharacters(String text) 方法添加文本元素。每个开始元素都有一个对应的结束元素标签。使用\
  \ writeEndElement() 方法添加结束元素。writeEndElement() 方法不指定元素名称，如 writeStartElement(String)\
  \ 方法：\n\n```\nxmlStreamWriter.writeEndElement();\n```\n\n使用 writeEndDocument() 方法添加文档的结束：\n\
  \n```\nxmlStreamWriter.writeEndDocument();\n```\n\nSQLXML 对象也可以使用 SAXResult 类进行初始化。使用\
  \ SQLXML 接口的 setResult() 方法创建 SAXResult 对象。随后，使用 getHandler() 方法获取 ContentHandler\
  \ 结果：\n\n```\nSAXResult saxResult = sqlXML.setResult(SAXResult.class);\nContentHandler\
  \ contentHandler= saxResult.getHandler();\n```\n\n使用 startDocument() 方法指定 XML 文档的开始：\n\
  \n```\ncontentHandler.startDocument();\n```\n\n使用 startElement(String uri,String\
  \ localName,String qName,Attributes atts) 方法指定元素的开始，其中参数 uri 指定元素命名空间，参数 localName\
  \ 指定元素本地名称，参数 qName 指定元素限定名称，参数 atts 类型为 Attributes 指定元素属性。Attributes 对象可以使用实现 Attributes\
  \ 接口的 org.xml.sax.helpers.AttributesImpl 类创建。可以使用 addAttribute(String uri, String\
  \ localName, String qName, String type, String value) 方法向 AttributesImpl 对象添加属性：\n\
  \n```\nAttributesImpl attrs=new AttributesImpl();\nattrs.addAttribute(\"\",\"\"\
  ,\"journal\",\"StringType\",\"OracleMagazine\");\ncontentHandler.startElement(\"\
  \",\"\",\"catalog\",attrs);\n```\n\n元素的结束通过 endElement(String uri,String localName,String\
  \ qName) 方法指定。文档的结束也通过 endDocument() 方法指定：\n\n```\ncontentHandler.endElement(\"\"\
  ,\"\",\"catalog\");\ncontentHandler.endDocument();\n```\n\nSQLXML 对象也可以使用 setCharacterStream()\
  \ 方法进行初始化。使用 setCharacterStream() 方法从 SQLXML 对象创建 Writer 对象。从输入的 XML 文件创建 BufferedReader\
  \ 对象。从 BufferedReader 读取，并输出到 Writer 对象：\n\n```\nWriter writer= sqlXML.setCharacterStream();\n\
  BufferedReader bufferedReader = new BufferedReader(new FileReader(new File(\"C:/catalog.xml\"\
  )));\nString line= null;\nwhile((line = bufferedReader.readLine()) != null) {\n\
  writer.write(line);\n}\n```\n\n调用 setCharacterStream() 方法后，SQLXML 对象变为不可写。XML 文档也可以通过\
  \ setString() 方法添加到 SQLXML 对象中，如下所示：\n\n```\nsqlXML.setString(\"xmlString\");\n\
  ```\n\n调用 setString() 方法后，SQLXML 对象变为不可写。如果在之前已初始化的 SQLXML 对象上调用 setString()、setBinaryStream()、setCharacterStream()\
  \ 或 setResult() 方法，将生成 SQLException。如果 setBinaryStream()、setCharacterStream() 或\
  \ setResult() 方法被调用多次，将生成 SQLException，且之前返回的 InputStream、Writer 或 Result 对象不受影响。\n\
  \n### 存储 XML 文档\n\nSQLXML Java 数据类型像任何其他 Java 数据类型一样存储在 XML 文档中。创建一个具有 XML 类型列的数据库表。运行创建数据库表的\
  \ SQL 语句，并从 Connection 对象获取 Statement 对象，如下所示：\n\n```\nStatement stmt=connection.createStatement();\n\
  ```\n\n创建一个具有 XML 类型列的数据库表 Catalog，如下所示：\n\n```\nstmt.executeUpdate(\"CREATE Table\
  \ Catalog(CatalogId int, Catalog XML)\");\n```\n\n创建 PreparedStatement 对象以向数据库表添加值，如以下列表所示：\n\
  \n```\nPreparedStatement statement=connection.prepareStatement(\"INSERT INTO CATALOG(catalogId,\
  \ catalog) VALUES(?,?)\");\n```\n\n使用 setInt() 方法设置 int 值，并使用 setSQLXML() 方法设置 SQLXML\
  \ 值，如下所示：\n\n```\nstmt.setInt(1, 1);\nstmt.setSQLXML(2, sqlXML);\n```\n\n使用 executeUpdate()\
  \ 方法更新数据库：\n\n```\nstmt.executeUpdate();\n```\n\n### 检索 XML 文档\n\nXML 数据库数据类型行作为\
  \ SQLXML Java 数据类型检索。为 SELECT 查询创建 PreparedStatement，如下所示：\n\n```\nPreparedStatement\
  \ stmt=connection.prepareStatement(\"SELECT * FROM CATALOG WHERE catalogId=?\");\n\
  ```\n\n指定要检索 XML 文档的 catalogId 值：\n\n```\nstmt.setInt(1, 1);\n```\n\n使用 executeQuery()\
  \ 方法获取结果集：\n\n```\nResultSet rs=stmt.executeQuery();\n```\n\n获取类型为 XML 的 catalog\
  \ 列的 SQLXML 对象，如下所示：\n\n```\nSQLXML sqlXML=rs.getSQLXML(\"Catalog\");\n```\n\n使用\
  \ getString() 方法输出 SQLXML 对象中的 XML 文档：\n\n```\nSystem.out.println(sqlXML.getString());\n\
  ```\n\n### 访问 XML 文档数据\n\nXMLStreamReader 接口可用于使用事件迭代器读取 XML 文档。XMLStreamReader\
  \ 对象可从 SQLXML 对象获取，如下所示：\n\n```\nInputStream binaryStream = sqlXML.getBinaryStream();\n\
  XMLInputFactory factory = XMLInputFactory.newInstance();\nXMLStreamReader xmlStreamReader\
  \ = factory.createXMLStreamReader(binaryStream);\n```\n\n调用 getBinaryStream() 方法后，SQLXML\
  \ 对象变为不可读。下一个事件可通过使用 next() 方法获取，如下所示：\n\n```\nwhile(xmlStreamReader.hasNext())\n\
  {\n    int parseEvent=xmlStreamReader.next();\n}\n```\n\nnext() 方法返回一个 int 值，该值对应于表示事件类型的\
  \ XMLStreamConstants 常量。next() 方法的一些返回值列在下表中：\n\n| 事件类型 | 描述 |\n|---|---|\n| ATTRIBUTE\
  \ | 指定一个属性。 |\n| CDATA | 指定 CDATA。 |\n| CHARACTERS | 文本。 |\n| COMMENT | XML 文档注释。\
  \ |\n| NOTATION_DECLARATION | 指定符号声明。 |\n| START_DOCUMENT | 指定文档的开始 |\n| START_ELEMENT\
  \ | 指定元素的开始。 |\n| END_ELEMENT | 指定元素的结束。 |\n| ENTITY_DECLARATION | 指定实体声明。 |\n|\
  \ ENTITY_REFERENCE | 指定实体引用。 |\n| NAMESPACE | 指定命名空间声明。 |\n| SPACE | 指定可忽略的空白。 |\n\
  \n如果返回值是 ELEMENT，则可以使用 getLocalName()、getPrefix() 和 getNamespaceURI() 方法获取本地名称、前缀和命名空间，如下所示：\n\
  \n```\nSystem.out.println(\"Element Local Name: \"+xmlStreamReader.getLocalName());\n\
  System.out.println(\"Element Prefix: \"+xmlStreamReader.getPrefix());\nSystem.out.println(\"\
  Element Namespace:\"+xmlStreamReader.getNamespaceURI());\n```\n\n元素中的属性计数可通过使用 getAttributeCount()\
  \ 方法获得。遍历属性并使用 getAttributeLocalName() 方法获取属性本地名称，使用 getAttributeValue() 方法获取属性值，使用\
  \ getAttributePrefix() 方法获取属性前缀，使用 getAttributeNamespace() 方法获取属性命名空间：\n\n```\n\
  for(int i=0; i<xmlStreamReader.getAttributeCount();i++){\nSystem.out.println(\"\
  Attribute Prefix:\"+xmlStreamReader.\ngetAttributePrefix(i));\nSystem.out.println(\"\
  Attribute Namespace:\"+xmlStreamReader.getAttribute\nNamespace(i));\nSystem.out.println(\"\
  Attribute Local Name:\"+xmlStreamReader.getAttribut\neLocalName(i));\nSystem.out.println(\"\
  Attribute Value:\"+xmlStreamReader.\ngetAttributeValue(i));\n}\n```\n\n### Wrapper\
  \ 模式支持\n\n出于架构原因，提供非标准 JDBC 方法的一些厂商特定 JDBC 资源被包装。这样的 JDBC 资源可以通过包装器模式解包以访问实例。Wrapper\
  \ 接口实现了对包装器模式的支持。通过 Wrapper 接口，可以访问作为代理类包装的资源。Wrapper 接口的目标是提供一种标准方法来访问标准 JDBC 对象（如\
  \ Connections、Statements 和 ResultSets）内部的厂商特定扩展。Wrapper 接口由以下接口扩展：\n\n- java.sql.Connection\n\
  - java.sql.DataSource\n- java.sql.ResultSet\n- java.sql.Statement\n- java.sql.DatabaseMetaData\n\
  - java.sql.ResultSetMetaData\n- java.sql.ParameterMetaData\n\nWrapper 接口提供的方法是 isWrapperFor(Class<?>)\
  \ 和 unwrap(Class<?>)。unwrap() 方法接受一个接口作为参数，并返回实现指定接口的对象。返回的对象要么是找到的实现指定接口的对象，要么是该对象的代理。isWrapperFor()\
  \ 方法返回一个 boolean。此方法用于判断一个实例是否实现指定接口，或一个实例是否为实现指定接口的对象的包装器。如果对象实现指定接口，则返回值为 true。如果对象是指定接口的包装器，则\
  \ isWrapperFor() 方法会递归地在被包装对象上调用。如果对象既不实现接口也不是接口的包装器，则返回值为 false。如果 isWrapperFor()\
  \ 方法返回 true，则应调用 unwrap() 方法。\n\n创建类型为 java.sql.PreparedStatement 的对象，并使用 isWrapperFor()\
  \ 方法检查该对象是否为 Oracle JDBC 特定接口 oracle.jdbc.OraclePreparedStatement 的包装器。如果该对象是接口的包装器，则使用\
  \ unwrap() 方法创建 oracle.jdbc.OraclePreparedStatement JDBC 接口的实例：\n\n```\nString url=\"\
  jdbc:oracle:thin:@localhost:1521:ORCL\";\nConnection connection = DriverManager.getConnection(url,\"\
  oe\", \"pw\");\nString sql=\"INSERT INTO CATALOG(catalogId, journal) VALUES(?,?)\"\
  \njava.sql.PreparedStatement stmt = connection.prepareStatement(sql);\nClass class\
  \ = Class.forName(\"oracle.jdbc.OraclePreparedStatement\");\nif(stmt.isWrapperFor(class))\n\
  {\nOraclePreparedStatement ops = (OraclePreparedStatement)stmt.\nunwrap(class);\n\
  ops.defineColumnType(2, oracle.jdbc.OracleTypes.VARCHAR,4000);\n}\n```\n\n### SQLException\
  \ 的增强\n\n数据源交互中的错误由 SQLException 类表示。JDBC 4.0 通过 SQLException 类中的 iterator() 方法增强了对链式\
  \ SQLException 的导航支持。链式 SQLException 是与其它异常关联的异常。iterator() 方法遍历链式异常和链式原因。链式异常可以使用\
  \ J2SE 5 中引入的增强 For-Each 循环检索和遍历（无需递归调用 getNextException() 和 getCause() 方法）。当使用\
  \ For-Each 循环生成 SQLException 时，链式异常可以按如下所示输出：\n\n```\ncatch(SQLException sqlException)\n\
  {\nfor(Throwable e : sqlException )\n{\nSystem.out.println(\"Error encountered:\
  \ \" + e);\n}\n}\n```\n\n在 JDBC 4.0 中，SQLException 类中添加了四个构造函数，其中 Throwable cause\
  \ 作为其中一个参数。getCause() 方法可以返回非 SQLException。在 JDBC 4.0 中，添加了三种类别的 SQLException，分别是：\n\
  \n- SQLTransientException\n- SQLNonTransientException\n- SQLRecoverableException\n\
  \n\n\nCategorization of the SQLExceptions facilitates the portability of error handling\
  \ code. SQLTransientException 和 SQLNonTransientException 类都有子类，这些子类映射到常见的 SQLState\
  \ 类值。SQLState 类为 JDBC 应用程序提供有关最近执行的 SQL 语句的返回码信息。返回码在每个 SQL 语句完成后由数据库管理器发送。SQLState\
  \ 类值在 SQL: 2003 规范中定义。\n\nA SQLTransientException 表示生成该异常的操作如果重试可能会成功。SQLTransientException\
  \ 类的子类在下表中讨论：\n\n| SQL Exception | SQLState Class Value | Description |\n|---|---|---|\n\
  | SQLTransientConnectionException | 08 | 表示失败的连接操作如果重试可能会成功。 |\n| SQLTransactionRollbackException\
  \ | 40 | 表示当前 Statement 已被回滚。 |\n| SQLTimeoutException | Does not correspond to\
  \ a standard SQLState. | 表示 Statement 已超时。 |\n\nSQLNonTransientException 表示生成该异常的操作在\
  \ SQLException 的原因未得到纠正的情况下不会成功。SQLNonTransientException 的子类在下表中讨论：\n\n| SQL Exception\
  \ | SQLState Class Value | Description |\n|---|---|---|\n| SQLFeatureNotSupportedException\
  \ | 0A | 表示 JDBC 驱动程序不支持某个功能。 |\n| SQLNonTransientConnectionException | 08 | 表示失败的连接操作如果在异常原因未被纠正的情况下重试将不会成功。\
  \ |\n| SQLDataException | 22 | 表示各种数据错误，包括不允许的转换和除以 0。 |\n| SQLIntegrityConstraintViolationException\
  \ | 23 | 表示完整性约束异常。 |\n| SQLInvalidAuthorizationSpecException | 28 | 表示授权异常。 |\n\
  | SQLSyntaxErrorException | 42 | 表示 SQL 语法错误。 |\n\nSQLRecoverableException 表示如果应用程序执行某些恢复步骤并重试整个事务（在分布式事务的情况下为事务分支），则抛出该异常的操作可以成功。恢复步骤至少包括关闭当前连接并获取新连接。\n\
  \nSQLException 类的一个新子类 SQLClientInfoException 已在 JDBC 4.0 规范中添加。如果无法在 Connection\
  \ 上设置一个或多个客户端信息属性，则会生成 SQLClientInfoException。SQLClientInfoException 还列出了未设置的客户端信息属性。某些不允许原子地设置多个客户端信息属性的数据库在设置一个或多个客户端信息属性后可能会生成\
  \ SQLClientInfoException 异常。未设置的客户端信息属性可通过使用 getFailedProperties() 方法检索。\n\n###\
  \ Connection Management\n\n连接池通过提供可在客户端会话间重复使用的连接缓存来提高连接的性能和可扩展性。连接池减少了打开、初始化和关闭连接的开销。连接池的一个缺点是，当连接池中的连接变得陈旧且不可用时，应用程序性能会下降。JDBC\
  \ 3.0 规范没有跟踪连接状态的 provision。连接状态跟踪已添加到 JDBC 4.0 中的 Connection 接口，以确定连接是否有效。isValid(int\
  \ timeout) 方法如果连接有效则返回 true。isValid() 方法使用 SQL 查询或其他机制验证连接。如果连接无效，则可以关闭连接，从而减少不可用连接的积累。如果未使用，Connection\
  \ 对象 conn 可以关闭：\n\n```\nif (!conn.isClosed())\nif (!conn.isValid())\nconn.close();\n\
  ```\n\n连接状态跟踪和无效连接的关闭由连接池管理器实现。连接池的另一个缺点是，Web 或应用程序服务器中从连接池分配的一个或多个连接可能会拖慢应用程序。JDBC\
  \ 3.0 没有识别使用过量 CPU 时间的连接的 provision。JDBC 4.0 已在 Connection 接口中添加了 setClientInfo()\
  \ 和 getClientInfo() 方法，通过这些方法，可以在将 Connection 分配给应用程序时在 Connection 对象上指定客户端特定信息。客户端规范信息包括用户名和应用程序名称。JDBC\
  \ 4.0 中的 DatabaseMetaData 接口提供了一个新方法 getClientInfoProperties()。JDBC 驱动程序支持的客户端信息属性可通过\
  \ `getClientInfoProperties()` 方法获取。当一个或多个连接拖慢应用程序时，可以使用 `getClientInfo()` 方法来识别哪些连接可能导致性能下降。JDBC\
  \ 驱动程序可以支持的一些标准客户端信息属性在下表中讨论：\n\n| Client Info Property | Description |\n|---|---|\n\
  | ApplicationName | 使用连接的应用程序的名称。 |\n| ClientUser | 用户的名称。 |\n| ClientHostname |\
  \ 应用程序运行的主机名。 |\n\n类似于连接池，JDBC 4.0 提供 `Statement` 池以减少打开、初始化和关闭 `Statement` 对象的开销。频繁使用的\
  \ `Statement` 对象可以使用 `setPoolable(boolean poolable)` 方法进行池化。`isPoolable()` 方法用于检查\
  \ `Statement` 对象是否可池化。如果可池化，则 `Statement` 对象 `stmt` 可以被池化：\n\n```\nif(stmt.isPoolable())\n\
  stmt.setPoolable(true);\n```\n\n### Scalar Functions\n\n大多数数据库支持标量值上的数值、字符串、时间、日期、系统和转换函数。使用\
  \ `Statement` 对象运行的 SQL 语句可以使用 JDBC 转义语法包含标量函数。JDBC 4.0 提供了一些新的标量函数，这些函数在下表中讨论：\n\
  \n| Scalar Function | Description |\n|---|---|\n| CHAR_LENGTH | 返回字符串表达式的长度。 |\n\
  | CHARACTER_LENGTH |  |\n| CURRENT_DATE | 返回当前日期。 |\n| CURRENT_TIME | 返回当前时间。 |\n\
  | CURRENT_TIMESTAMP | 返回当前时间戳。 |\n| EXTRACT | 从日期时间值中提取字段。 |\n| OCTET_LENGTH | 返回字符串表达式以八位字节（字节）为单位的长度。\
  \ |\n\n### JDBC 4.0 support in Oracle Database\n\n对 JDBC 4.0 规范的支持是 JDBC 驱动程序功能，而不是数据库功能。Oracle\
  \ Database 11g JDBC 驱动程序支持 JDBC 4.0 规范。将 ojdbc6.jar 文件添加到 CLASSPATH 环境变量以使用 JDBC\
  \ 4.0 功能。需要 JDK 6.0 才能支持 JDBC 4.0。Oracle 数据库 11g JDBC 驱动程序可与 Oracle 数据库 9i 及更高版本一起使用。Oracle\
  \ 数据库 11g JDBC 驱动程序支持所有 JDBC 4.0 功能，除了用于访问 SQL 数据类型 XML 的 SQLXML Java 数据类型。Oracle\
  \ 数据库 11g JDBC 驱动程序支持包装器模式以访问非标准的 Oracle JDBC 资源。Oracle 对 JDBC 的扩展可在 oracle.jdbc\
  \ 包中使用。\n\n可以使用 unwrap() 方法解包 oracle.jdbc.OracleStatement 接口以创建 oracle.jdbc.OracleStatement\
  \ 对象。由于 Statement 接口扩展了 Wrapper 接口，因此从 Connection 对象 conn 创建一个 Statement 对象。使用 isWrapperFor()\
  \ 方法检查 Statement 对象是否为 oracle.jdbc.OracleStatement 接口的包装器。使用 unwrap() 方法从接口获取 OracleStatement\
  \ 对象以使用 OracleStatement 接口的方法：\n\n```\nStatement stmt = conn.createStatement();\n\
  Class class = Class.forName(\"oracle.jdbc.OracleStatement\");\nif(stmt.isWrapperFor(class))\n\
  {\nOracleStatement oracleStmt = (OracleStatement)stmt.unwrap(class);\noracleStmt.defineColumnType(1,\
  \ Types.NUMBER);\n}\n```\n\nOracle 数据库 11g JDBC 驱动程序支持 JDBC 4.0 SQLException 类中的增强链式异常。JDBC\
  \ 4.0 增加了永久错误和瞬态错误之间的区别。永久错误是在数据库系统正常操作中发生的错误，并且在错误原因被消除之前会持续出现。瞬态错误是由于系统某些部分故障或超时而发生的错误，如果重试生成错误的\
  \ operation，这些错误可能不会再次出现。Oracle 数据库 11g JDBC 驱动程序支持 SQLException 的不同类别。\n\nOracle\
  \ 数据库 11g JDBC 驱动程序支持 ROWID SQL 数据类型。Oracle 数据库中的每个表都有一个 ROWID 伪列，用于标识表中的一行。ROWID\
  \ 列的 SQL 数据类型为 ROWID。通常 rowid 唯一标识数据库中的一行。但存储在集群中的不同表中的行可能具有相同的 rowid。Rowid 不应用作数据库表的\
  \ primary key。如果使用 Import 或 Export 实用程序删除并重新插入一行，其 rowid 可能会被修改。如果删除一行，其 rowid 可以分配给稍后添加的行。ROWID\
  \ 伪列可在 SELECT 和 WHERE 子句中使用。Rowid 值具有以下应用：\n\n\n- 1. Rowid 是访问数据库表中一行数据的最快方式。\n\
  - 2. Rowid 是表中行的唯一标识符。\n- 3. Rowid 表示行在表中的存储方式。\n\nROWID 列值可使用 ResultSet 和 CallableStatement\
  \ 接口中的 getter 方法检索。如下所示检索 ResultSet 对象 rs 中当前行的 ROWID 列值：\n\n```\njava.sql.RowId\
  \ rowid=rs.getRowId();\n```\n\nRowId 对象在所标识的行未被删除之前有效。有效期可通过 DatabaseMetaData 接口的\
  \ getRowIdLifetime() 方法获得。有效期可以是下表中 int 值之一：\n\n| int 值 | 描述 |\n|---|---|\n| ROWID_UNSUPPORTED\
  \ | 数据库不支持 ROWID SQL 数据类型。 |\n| ROWID_VALID_TRANSACTION | 在创建时有效的事务期间有效。 |\n| ROWID_VALID_SESSION\
  \ | 在创建时有效的会话期间跨所有事务有效。 |\n| ROWID_VALID_FOREVER | 跨所有会话有效。 |\n| ROWID_VALID_OTHER\
  \ | 有效性未知。 |\n\nRowId 值可与参数化 PreparedStatement 一起使用，以使用 RowId 对象设置参数值。RowId 值也可与可更新的\
  \ ResultSet 一起使用，以使用 RowId 对象更新列。\n\nOracle 数据库 11g JDBC 驱动程序支持国家字符集 (NCS) 数据类型\
  \ NCHAR、NVARCHAR、LONGNVARCHAR 和 NCLOB。Oracle 数据库 11g 驱动程序还支持大对象数据类型 (LOBs)。Connection\
  \ 接口提供 createBlob、createClob 和 createNClob 方法来创建 Blob、Clob 和 NCLOB 对象。如下所示创建 Blob\
  \ 对象：\n\n```\nString url=\"jdbc:oracle:thin:@localhost:1521:ORCL\";\nConnection\
  \ connection = DriverManager.getConnection(url,\"oe\", \"pw\");\nBlob aBlob = connection.createBlob();\n\
  ```\n\n创建的 LOB 对象不包含任何数据。可使用 Blob、Clob 和 NCLOB 接口中的 setter 方法添加数据。要向 Blob 对象添加数据，请从\
  \ Blob 对象获取 OutputStream 对象：\n\n```\nOutputStream outputStream=aBlob.setBinaryStream(1);\n\
  ```\n\nLOB 对象可使用 setBlob、setClob 和 setNClob 方法作为 PreparedStatement 对象的输入参数使用。之前创建的\
  \ Blob 对象可按如下方式设置为 PreparedStatement 对象 pstmt 的参数值：\n\n```\npstmt.setBlob(2,aBlob);\n\
  ```\n\n对于可更新的 ResultSet，可使用 updateBlob、updateClob 和 updateNClob 方法更新 Blob、Clob 或\
  \ NClob 列值。使用已创建的 Blob 对象更新列类型为 BLOB 的 ResultSet 对象 rs：\n\n```\nrs.updateBlob(3,aBlob);\n\
  ```\n\n可使用 ResultSet 和 CallableStatement 接口中的 getBlob、getClob 和 getNClob 方法检索 Blob、Clob\
  \ 和 NClob 数据。从 ResultSet 对象 rs 中检索对应于 BLOB 列的 Blob 对象：\n\n```\nBlob blob=rs.getBlob(2);\n\
  ```\n\n可以使用 getBinaryStream() 方法检索 Blob 对象中的全部数据，或使用 getBinaryStream(long pos, long\
  \ length) 方法检索 Blob 对象中的部分数据。这里，参数 pos 指定数据检索的起始偏移位置，参数 length 指定要检索的数据的字节长度。从之前创建的\
  \ Blob 对象中以偏移位置 200 检索 100 字节数据：\n\n```\nInputStream inputStream = aBlob.getBinaryStream(200,\
  \ 100);\n```\n\nLOB 至少在创建它的事务持续时间内有效。对于长时间运行的事务，使用 free() 方法释放 LOB 资源会更好：\n\n```\n\
  aBlob.free();\n```\n\n### MySQL 数据库中的 JDBC 4.0 支持\n\nMySQL 数据库服务器在 Connector/J 5.1\
  \ JDBC 驱动程序中提供对 JDBC 4.0 规范的支持。MySQL 的 Connector/J 5.1 支持以下列出的 JDBC 4.0 功能：\n\n\
  - 1. 通过 J2SE 服务提供者机制将 JDBC 驱动程序与 DriverManager 自动注册。\n- 2. 使用 Connection 接口的 isValid()\
  \ 方法检查连接有效性。\n- 3. 根据可恢复性或可重试性以及底层错误的类别对 SQLException 进行分类。\n- 4. 解包 JDBC 的 MySQL\
  \ 特定扩展。\n- 5. 支持 SQLXML。MySQL 数据库不支持 SQL: 2003 SQL 数据类型 XML。JDBC 4.0 规范未规定用于存储 SQLXML\
  \ 对象的 SQL 数据类型必须是 SQL: 2003 XML 数据类型。MySQL 的 Connector/J 5.1 JDBC 驱动程序支持 SQLXML\
  \ Java 数据类型。\n- 6. 使用 `Connection` 接口的 `setClientInfo()` 方法支持设置每个连接的客户端信息。\n- 7.\
  \ 支持国家字符集数据类型 NCHAR、NVARCHAR、LONGNVARCHAR 和 NCLOB。\n\n### IBM DB2 UDB 中的 JDBC 4.0\
  \ 支持\n\nIBM Data Server Driver for JDBC and SQLJ 版本 4.0 支持 JDBC 4.0 规范。要使用 JDBC\
  \ 4.0 功能，请将 `db2jcc4.jar` 文件添加到 `CLASSPATH` 环境变量。JDBC 4.0 驱动程序名称为 \"IBM Data Server\
  \ Driver for JDBC and SQLJ\"，而不是之前的 \"IBM DB2 JDBC Universal Driver Architecture\"\
  。IBM Data Server Driver for JDBC and SQLJ 支持大多数 JDBC 4.0 功能。\n\n已为 JDBC 4.0 `java.sql.RowId`\
  \ 接口添加 JDBC 支持，用于在 ROWID 列中更新和检索数据。还为 `java.sql.SQLXML` 接口添加了 JDBC 支持，用于在 XML 列中存储、更新和检索数据。IBM\
  \ Data Server Driver for JDBC and SQLJ 支持以下客户端信息属性来标识客户端连接：\n\n- 1. ApplicationName\n\
  - 2. ClientAccountingInformation\n- 3. ClientHostname\n- 4. ClientUser\n\nIBM Data\
  \ Server Driver for JDBC and SQLJ 支持 JDBC 4.0 规范中的新的 `SQLException` 子类。它还支持链式异常。支持包装器模式以访问供应商特定资源。`com.ibm.db2.jcc`\
  \ 包中以下 IBM Data Server Driver for JDBC and SQLJ 特定接口扩展了 `Wrapper` 接口：\n\n- 1. DB2Connection\n\
  - 2. DB2BaseDataSource\n- 3. DB2SimpleDataSource\n- 4. DB2Statement\n- 5. DB2ResultSet\n\
  - 6. DB2DatabaseMetaData\n\n### 使用 JDBC 4.0 驱动程序的示例连接\n\n我们将使用 JDBC 4.0 驱动程序连接数据库。我们将使用\
  \ Java DB 作为示例数据库。Java DB 是 Sun 的开源 Apache Derby 数据库版本。Java DB 是一个轻量级（仅 2MB）、但完全事务性、安全且基于标准的组件。它还支持\
  \ SQL、JDBC 和 Java EE 标准。Java DB 是一个 100% Java 技术数据库，由于 Java 跨平台可移植，Java DB 可以在任何平台上运行，其应用程序可以迁移到其他开放标准数据库。Java\
  \ DB 与 JDK 6 一起打包。因此，安装 Java DB 所需的全部就是安装 JDK 6。我们使用 JDBC 4.0 驱动程序连接 Java DB 数据库。在目录\
  \ C:/JavaDB 中创建 Java 应用程序 JDBCConnection.java，并将该目录添加到 CLASSPATH 系统环境变量。Java DB\
  \ 可以以嵌入模式启动或作为网络服务器启动。嵌入模式用于从与 Java DB 数据库运行在同一 JVM 中的 Java 应用程序连接 Java DB。Java\
  \ DB 作为网络服务器用于从网络中不同 JVM 连接数据库。我们将从 JDBCConnection.java 应用程序以嵌入模式启动 Java DB。我们将使用\
  \ Java SE 服务提供者机制自动加载 JDBC 4.0 驱动程序。为了自动加载 JDBC 驱动程序，我们需要将 Java DB JDBC 4.0 驱动程序\
  \ JAR 文件 C:/Program Files/Sun/JavaDB/lib/derby.jar 添加到 CLASSPATH 变量。Java DB 在 bin\
  \ 目录中提供批处理脚本 setEmbeddedCP.bat 来设置嵌入模式的 CLASSPATH。从要运行 JDBCConnection.java 应用程序的目录按如下方式运行\
  \ setEmbeddedCP 脚本：\n\n```\n\"C:\\Program Files\\Sun\\JavaDB\\bin\\setEmbeddedCP.bat\"\
  \n```\n\nJAR 文件 derby.jar 已添加到 CLASSPATH。derby.jar 文件包含目录结构 META-INF/services/，以及\
  \ services 目录中的文件 java.sql.Driver。java.sql.Driver 文件指定了以下 Java DB JDBC 驱动程序类，该类将使用\
  \ Java SE 服务提供者机制自动加载：\n\n```\norg.apache.derby.jdbc.AutoloadedDriver\n```\n\n\n\
  \n在 JDBCConnection.java 应用程序中，指定 Java DB 数据库的连接 URL。通过指定数据库名称 demodb 以及 create 属性为\
  \ true 来创建新的数据库实例：\n\n```\nString url=\"jdbc:derby:demodb;create=true\";\n```\n\n\
  使用 DriverManager 类的 getConnection() 方法连接 Java DB 数据库：\n\n```\nConnection conn =\
  \ DriverManager.getConnection(url);\n```\n\nDriverManager 会自动加载 JDBC 4.0 驱动类 org.apache.derby.jdbc.AutoloadedDriver，该类使用\
  \ Java SE 服务提供者机制在 java.sql.Driver 文件中指定。使用 JDBC 3.0 驱动程序时，无需使用 Class.forName()\
  \ 方法加载 JDBC 驱动程序。JDBCConnection.java 应用程序如下所示：\n\n```\nimport java.sql.*;\npublic\
  \ class JDBCConnection\n{\npublic void connectToDatabase()\n{\ntry\n{\nString url=\"\
  jdbc:derby:demodb;create=true\";\nConnection conn = DriverManager.getConnection(url);\n\
  System.out.println(\"Connection Established\");\n}\ncatch (SQLException e)\n{\n\
  System.out.println(e.getMessage());\n}\n}\npublic static void main(String[] argv)\n\
  {\nJDBCConnection jdbc = new JDBCConnection();\njdbc.connectToDatabase();\n}\n}\n\
  ```\n\n其他 **关系数据库管理系统**（RDBMS）数据库提供 JDBC 4.0 驱动程序，可使用 JDBC 4.0 驱动程序进行连接，如 Java DB\
  \ 数据库所述。以下表格中讨论了一些常用数据库的连接 URL 和 JDBC 4.0 驱动程序：\n\n| 数据库 | 连接 URL | JDBC 4.0 驱动程序\
  \ |\n|---|---|---|\n| MySQL（4.1、5.0、5.1 及 6.0 alpha 版）。 | jdbc:mysql://localhost:3306/test\
  \ | MySQL Connector/J 5.1 (http://dev.mysql.com/downloads/connector/j/5.1.html)\
  \ 由于未包含在驱动 JAR 文件中，因此需要将 META-INF/services/java.sql.Driver 添加到 CLASSPATH 中。 |\n\
  | Oracle Database（9.01 及更高版本）。 | jdbc:oracle:thin:@localhost:1521:ORCL | Oracle\
  \ Database 11g JDBC Driver（http://www.oracle.com/technology/software/tech/java/sqlj_jdbc/htdocs/jdbc_111060.html）的\
  \ java.sql.Driver 文件包含在 JDBC JAR 文件 ojdbc6.jar 中。 |\n| IBM DB2 for Linux UNIX 和\
  \ Windows。 | jdbc:db2://localhost:50000/SAMPLE | IBM Data Server Driver for JDBC\
  \ and SQLJ version 4.0（https://www14.software.ibm.com/webapp/iwm/web/reg/download.do?source=swg-informixfpd&S_PKG=d1&lang=en_US&cp=UTF-8）的\
  \ java.sql.Driver 文件未包含在 JDBC JAR 文件 db2jcc4.jar 中。 |\n| SQL Server 数据库（MS SQL Server\
  \ 6.5 - 2005 含所有 Service Pack）。 | jdbc:inetdae7://localhost:1433 | i-net MERLIA\
  \ JDBC 4.0 driver for MS SQL Database（http://www.inetsoftware.de/products/jdbc/mssql/merlia/）的\
  \ java.sql.Driver 文件未包含在 JDBC JAR 文件 Merlia.jar 中。 |\n\n### 摘要\n\n在本章中，您已了解 JDBC\
  \ API 以及 JDBC 4.0 规范中的新特性。`DriverManager` 类用于连接数据库。`Connection` 接口表示数据库连接。`Savepoint`\
  \ 接口表示事务中的保存点。这是如果事务回滚，则更改会被回滚到的点。`Statement` 接口用于运行静态 SQL 语句。`ResultSet` 接口表示通过在数据库上运行\
  \ SQL 语句生成的结果集表。`PreparedStatement` 表示可使用不同参数多次运行的已编译 SQL 语句。`DatabaseMetadata`\
  \ 接口表示数据库元数据，例如表名、模式名、列名和列类型。`SQLException` 类表示数据库访问错误或其他 SQL 错误。JDBC 4.0 规范提供了一些新特性以促进\
  \ JDBC 应用程序的开发。已添加对新 SQL 数据类型的支持。新特性包括自动 SQL 驱动程序加载、SQL: 2003 XML 数据类型支持、包装器模式支持、`SQLException`\
  \ 的增强以及增强的连接管理。\n\n## 2 Configuring JDBC in Oracle JDeveloper\n\n## 2 在 Oracle JDeveloper\
  \ 中配置 JDBC\n\nOracle JDeveloper 是一个免费的 **集成开发环境（IDE）**，用于建模、开发、调试、优化和部署 Java 应用程序。JDeveloper\
  \ 10g 用于开发由 JSP、EJB、Struts、Servlet 以及可能需要访问 Oracle 10g 数据库或第三方数据库中的数据库表的 Java 类组成的\
  \ J2EE 应用程序。与需要插件的 *Eclipse* 不同，JDeveloper 内置了建立与数据库 JDBC 连接的功能。JDeveloper 是唯一具有嵌入式应用程序服务器的\
  \ Java IDE，即 Oracle Containers for J2EE（OC4J）。此基于数据库的 Web 应用程序可在 JDeveloper 中运行，无需第三方应用程序服务器。然而，JDeveloper\
  \ 也支持第三方应用程序服务器。从 JDeveloper 11 开始，应用程序开发人员可以将 IDE 指向应用程序服务器实例（或 OC4J 实例），包括他们在开发期间用于测试的第三方应用程序服务器。JDeveloper\
  \ 提供了连接池以高效使用数据库连接。数据库连接可用于 ADF BC 应用程序或 JavaEE 应用程序。\n\n在 JDeveloper 中，数据库连接可在\
  \ Connections Navigator 中配置。Connections Navigator 连接可作为在 JNDI 命名服务中注册的 `DataSource`\
  \ 使用。JDeveloper 中的数据库连接是一个可重用的命名连接，开发人员只需配置一次，然后可在任意多个项目中使用。取决于项目性质和数据库连接，连接配置在\
  \ **bc4j.xcfg 文件** 或 JavaEE 数据源中。在此，有必要区分 data source 和 `DataSource`。数据源是数据的来源；例如\
  \ RDBMS 数据库是一个数据源。`DataSource` 是一个接口，表示 JDBC `Connection` 对象的工厂。JDeveloper 使用术语\
  \ Data Source 或 data source 指代连接的工厂。我们也将使用术语 Data Source 或 data source 指代连接的工厂，该工厂在\
  \ `javax.sql` 包中由\nDataSource 接口表示。DataSource 对象可通过 JNDI 查找从在 JNDI（Java 命名和目录）命名服务中注册的数据源创建。可以使用\
  \ getConnection 方法从 DataSource 对象获取 JDBC Connection 对象。作为在 Connections Navigator\
  \ 中配置连接的替代方案，数据源也可以直接在数据源配置文件 data-sources.xml 中指定。本章将讨论在 JDeveloper 10g IDE 中配置\
  \ JDBC 连接和 JDBC 数据源的步骤。我们将使用支持 JDBC 4.0 规范的 MySQL 5.0 数据库服务器和 MySQL Connector/J\
  \ 5.1 JDBC 驱动程序。本章您将学习以下内容：\n\n- 在 JDeveloper Connections Navigator 中创建数据库连接\n-\
  \ 配置 Connections Navigator 中配置的连接关联的数据源和连接池\n- 常见的 JDBC 连接错误\n- 创建连接池和数据源\n- 从 Web\
  \ 应用程序连接到数据库\n- Web 应用程序的 JDBC 4.0 版本\n\n在创建 JDBC 连接和数据源之前，我们将讨论连接池和 DataSource。\n\
  \n### Connection Pooling and DataSource\n\n### 连接池和 DataSource\n\njavax.sql 包提供了服务器端数据库访问的\
  \ API。javax.sql 包中的主要接口是 DataSource、ConnectionPoolDataSource 和 PooledConnection。DataSource\
  \ 接口表示数据库连接的工厂。在第 1 章和第 2 章中，我们使用 DriverManager 类获取 Connection 对象。DataSource 是获取\
  \ JDBC 连接的替代且首选方法。实现 DataSource 接口的对象通常在基于 Java 命名和目录 API 的命名服务中注册。DataSource 接口实现是驱动程序厂商特定的。DataSource\
  \ 接口有三种类型的实现：\n\n- **基本实现：** 在基本实现中，客户端的 Connection 对象与数据库连接之间存在 1:1 对应关系。这意味着对于每个\
  \ Connection 对象，都存在一个与数据库的连接。使用基本实现时，每次客户端会话都会产生打开、初始化和关闭连接的开销。\n\n\n\n-   **连接池实现：**\
  \ 可用 `Connection` 对象池，从中为不同的客户端会话分配连接。连接池管理器实现连接池。当客户端会话不需要连接时，连接会被归还到连接池并可供其他客户端使用。因此，打开、初始化和关闭连接的开销得以降低。\n\
  -   **分布式事务实现：** 分布式事务实现产生一个主要用于分布式事务且始终连接池化的 `Connection` 对象。事务管理器实现分布式事务。\n\n\
  使用数据源的一个优点是，在将应用程序迁移到不同的应用服务器时，访问数据源的代码无需修改。只需修改数据源属性即可。使用 `DataSource` 访问的 JDBC\
  \ 驱动程序不会在 `DriverManager` 中注册自己。`DataSource` 对象通过 JNDI 查找创建，随后从 `DataSource` 对象创建\
  \ `Connection` 对象。例如，如果数据源的 JNDI 名称为 `jdbc/OracleDS`，则可使用 JNDI 查找创建 `DataSource`\
  \ 对象。首先，创建 `InitialContext` 对象，然后使用 `InitialContext` 的 lookup 方法创建 `DataSource`\
  \ 对象。从 `DataSource` 对象使用 `getConnection()` 方法创建 `Connection` 对象：\n\n```\nInitialContext\
  \ ctx=new InitialContext();\nDataSource ds=ctx.lookup(\"jdbc/OracleDS\");\nConnection\
  \ conn=ds.getConnection();\n```\n\n用于创建 `DataSource` 对象的 JNDI 命名服务由 J2EE 应用服务器提供，例如嵌入在\
  \ JDeveloper IDE 中的 Oracle Application Server Containers for J2EE (OC4J)。\n\n连接池中的连接由\
  \ `PooledConnection` 接口表示，而不是 `Connection` 接口。连接池管理器，通常是应用服务器，维护一个 `PooledConnection`\
  \ 对象池。当应用程序使用 `DataSource.getConnection()` 方法请求连接时，如我们使用 `jdbc/OracleDS` 数据源示例所做的那样，连接池管理器返回一个\
  \ `Connection` 对象，该对象实际上是对实现 `PooledConnection` 接口的对象的句柄。`ConnectionPoolDataSource`\
  \ 对象，通常在 JNDI 命名服务中注册，表示 `PooledConnection` 对象的集合。JDBC 驱动程序提供 `ConnectionPoolDataSource`\
  \ 的实现，由应用服务器用于构建和管理连接池。当应用程序请求连接时，如果连接池中有合适的 `PooledConnection` 对象，连接池管理器将返回对 `PooledConnection`\
  \ 对象的句柄作为 `Connection` 对象。如果没有合适的 PooledConnection 对象可用，连接池管理器将调用 ConnectionPoolDataSource\
  \ 的 getPooledConnection() 方法来创建新的 PooledConnection 对象。例如，如果 connectionPoolDataSource\
  \ 是一个 ConnectionPoolDataSource 对象，则新的 PooledConnection 按如下方式创建：\n\n```\nPooledConnection\n\
  pooledConnection=connectionPoolDataSource.getPooledConnection();\n```\n\n应用程序不必调用\
  \ getPooledConnection() 方法；连接池管理器调用 getPooledConnection() 方法，而实现 ConnectionPoolDataSource\
  \ 的 JDBC 驱动程序创建新的 PooledConnection 并返回其句柄。连接池管理器向请求连接的应用程序返回一个 Connection 对象，该对象是对\
  \ PooledConnection 对象的句柄。当应用程序使用 close() 方法关闭 Connection 对象时，如下所示，连接实际上并未关闭。\n\n\
  ```\nconn.close();\n```\n\n当应用程序使用 close() 方法关闭 Connection 对象时，连接句柄会被停用。连接池管理器执行停用操作。当应用程序使用\
  \ close() 方法关闭 Connection 对象时，使用 setClientInfo 方法设置的任何客户端信息属性都会被清除。连接池管理器使用 addConnectionEventListener()\
  \ 方法向 PooledConnection 对象注册。当连接关闭时，连接池管理器会收到通知，连接池管理器停用对 PooledConnection 对象的句柄，并将\
  \ PooledConnection 对象返回到连接池以供其他应用程序使用。如果连接出现错误，连接池管理器也会收到通知。PooledConnection 对象要到连接池重新初始化、服务器关闭或连接变得不可用时才会被关闭。\n\
  \n除了连接被池化外，如果数据库支持语句池化，PreparedStatement 对象默认也会被池化。是否数据库支持语句池化可通过 DatabaseMetaData\
  \ 接口的 supportsStatementPooling() 方法发现。PreparedStatement 池化也由连接池管理器管理。为了接收 PreparedStatement\
  \ 关闭或 PreparedStatement 变得不可用等 PreparedStatement 事件的通知，连接池管理器使用 addStatementEventListener()\
  \ 方法向 PooledConnection 管理器注册。连接池管理器使用 removeStatementEventListener() 方法注销 PooledConnection\
  \ 对象。addStatementEventListener 和 removeStatementEventListener 方法是 JDBC 4.0 中 PooledConnection\
  \ 接口中的新方法。Statement 对象的池化是 JDBC 4.0 中的另一个新特性。Statement 接口在 JDBC 4.0 中为 Statement\
  \ 池化提供了两个新方法：isPoolable() 和 setPoolable()。\n\nisPoolable 方法检查 Statement 对象是否可池化，而\
  \ setPoolable 方法将 Statement 对象设置为可池化。当应用程序使用 close() 方法关闭 PreparedStatement 对象时，PreparedStatement\
  \ 对象实际上并未关闭。PreparedStatement 对象会被返回到 PreparedStatement 池。当连接池管理器通过调用 PooledConnection\
  \ 的 close() 方法关闭 PooledConnection 对象时，所有关联的语句也会被关闭。PreparedStatement 的池化提供了显著的优化，但如果有大量语句保持打开状态，可能不是资源的最优使用。因此，使用数据源在应用服务器中获取连接时遵循以下流程：\n\
  \n-   1. 使用 JNDI 名称绑定到 JNDI 命名服务创建数据源。\n-   2. 创建 InitialContext 对象并使用 lookup 方法查找数据源的\
  \ JNDI 名称以创建 DataSource 对象。如果 JDBC 驱动程序将 DataSource 实现为连接池，则连接池可用。\n-   3. 从连接池请求连接。连接池管理器检查是否有合适的\
  \ PooledConnection 对象可用。如果有合适的 PooledConnection 对象可用，连接池管理器将返回对 PooledConnection\
  \ 对象的句柄作为 Connection 对象给请求连接的应用程序。\n-   4. 如果 PooledConnection 对象不可用，连接池管理器将调用由\
  \ JDBC 驱动程序实现的 ConnectionPoolDataSource 的 getPooledConnection() 方法。\n-   5. 实现 ConnectionPoolDataSource\
  \ 的 JDBC 驱动程序创建 PooledConnection 对象并返回其句柄。\n-   6. 连接池管理器将返回对 PooledConnection 对象的句柄作为\
  \ Connection 对象给请求连接的应用程序。\n-   7. 当应用程序关闭连接时，连接池管理器停用对 PooledConnection 对象的句柄并将\
  \ PooledConnection 对象返回到连接池。\n\nConnectionPoolDataSource 提供了一些配置属性来配置连接池。配置池属性不是由\
  \ JDBC 客户端设置的，而是由连接池实现或增强。属性可以在数据源配置中设置。因此，不是应用程序本身来更改设置，而是由池管理员，有时也是开发者，来执行此操作。Connection\
  \ pool properties supported by ConnectionPoolDataSource are discussed in following\
  \ table:\n\n| 连接池属性 | 类型 | 描述 |\n|---|---|---|\n| maxStatements | int | 池应保持打开的最大语句数。0（零）表示未启用语句缓存。\
  \ |\n| initialPoolSize | int | 创建时池应具有的初始连接数。 |\n| minPoolSize | int | 池中的最小连接数。0（零）表示按需创建连接。\
  \ |\n| maxPoolSize | int | 连接池中的最大连接数。0 表示没有最大限制。 |\n| maxIdleTime | int | 连接在未使用前可保持打开的最大持续时间（以秒为单位），在此之后连接将被关闭。0（零）表示没有限制。\
  \ |\n| propertyCycle | int | 池在实施连接池属性定义的当前策略之前应等待的时间间隔（以秒为单位）。 |\n| maxStatements\
  \ | int | 池可保持打开的最大语句数。0（零）表示未启用语句缓存。 |\n\n## 设置环境\n\n开始之前，我们必须安装 JDeveloper 10.1.3\
  \ IDE 和 MySQL 5.0 数据库。从以下地址下载 JDeveloper：http://www.oracle.com/technology/software/products/jdev/index.html。下载\
  \ MySQL Connector/J 5.1，即支持 JDBC 4.0 规范的 MySQL JDBC 驱动程序。要安装 JDeveloper，请将 JDeveloper\
  \ ZIP 文件解压到一个目录。登录 MySQL 数据库并将数据库设置为 test。创建一个数据库表 Catalog，我们将在 Web 应用程序中使用它。以下是创建数据库表的\
  \ SQL 脚本：\n\n```\nCREATE TABLE Catalog(CatalogId VARCHAR(25)\nPRIMARY KEY, Journal\
  \ VARCHAR(25), Publisher VARCHAR(25),\nEdition VARCHAR(25), Title Varchar(45), Author\
  \ Varchar(25));\nINSERT INTO Catalog VALUES('catalog1', 'Oracle Magazine',\n'Oracle\
  \ Publishing', 'Nov-Dec 2004', 'Database Resource Manager',\n'Kimberly Floss');\n\
  INSERT INTO Catalog VALUES('catalog2', 'Oracle Magazine', 'Oracle\nPublishing',\
  \ 'Nov-Dec 2004', 'From ADF UIX to JSF', 'Jonas Jacobi');\n```\n\nMySQL 不支持 ROWID，而\
  \ JDBC 4.0 已添加了对此的支持。安装 JDeveloper IDE 后，接下来我们将在 Connections Navigator 中配置 JDBC\
  \ 连接。选择 Connections 选项卡并右键单击 Database 节点以选择 New Database Connection。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_61_0.png)\n\
  \n在 Create Database Connection Wizard 中单击 Next。在 Create Database Connection Type\
  \ 窗口中，指定一个 Connection Name ——例如 MySQLConnection ——并将 Connection Type 设置为 Third Party\
  \ JDBC Driver，因为我们将使用 MySQL 数据库，而 MySQL 对于 Oracle JDeveloper 来说是一个第三方数据库，然后单击 Next。如果要使用\
  \ Oracle 数据库配置连接，请选择 Oracle (JDBC) 作为 Connection Type，然后单击 Next。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_61_1.png)\n\
  \n## 在 Oracle JDeveloper 中配置 JDBC\n\n在 **身份验证** 窗口中将 **用户名** 指定为 **root**（**密码**\
  \ 默认情况下对于 root 用户无需指定），然后单击 **下一步**。在 **连接** 窗口中，我们将指定连接参数，例如驱动程序名称和连接 URL；单击 **新建**\
  \ 以指定 Driver Class。在 **注册 JDBC 驱动程序** 窗口中，将 Driver Class 指定为 com.mysql.jdbc.Driver，然后单击\
  \ **浏览** 以为 Driver Class 选择一个库。在 **选择库** 窗口中，单击 **新建** 为 MySQL Connector/J 5.1 JAR\
  \ 文件创建一个新库。在 **创建库** 窗口中，将 Library Name 指定为 MySQL，然后单击 **添加条目** 为 MySQL 库添加一个 JAR\
  \ 文件条目。在 **选择路径条目** 窗口中选择 mysql-connector-java-5.1.3-rc\\mysql-connector-java-5.1.3-rc-bin.jar，然后单击\
  \ **选择**。在 **创建库** 窗口中，在 Class Path 条目添加到 MySQL 库后，单击 **确定**。在 **选择库** 窗口中，选择 MySQL\
  \ 库，然后单击 **确定**。在 **注册 JDBC 驱动程序** 窗口中，MySQL 库在 Library 字段中指定，而 mysql-connector-java-5.1.3-rc\\\
  mysql-connector-java-5.1.3-rc-bin.jar 在 Classpath 字段中指定。现在，单击 **确定**。Driver Class、Library\
  \ 和 Classpath 字段在 **连接** 窗口中被指定。将 URL 指定为 jdbc:mysql://localhost:3306/test，然后单击\
  \ **下一步**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_62_0.png)\n\n在 **测试** 窗口中单击\
  \ **测试连接** 以测试我们配置的连接。建立连接，并在 Status 文本区域输出成功消息。在 **测试** 窗口中单击 **完成**。一个连接配置 **MySQLConnection**\
  \ 被添加到 **Connections** 导航器中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_63_0.png)\n\
  \n连接参数在结构视图中显示。要修改任何连接设置，请双击 **连接** 节点。**编辑数据库连接** 窗口显示。连接的 Username、Password、Driver\
  \ Class 和 URL 可以在 Edit 窗口中修改。\n\n## 在 Oracle JDeveloper 中配置 JDBC\n\n在 Connections\
  \ 导航器中配置的数据库连接在 OC4J 提供的 JNDI 命名服务中具有 JNDI 名称绑定。使用 JNDI 名称绑定，可以在 J2EE 应用程序中创建 DataSource\
  \ 对象。要查看或修改 JDBC 连接的配置设置，请在 JDeveloper 中选择 Tools | Embedded OC4J Server Preferences。在显示的窗口中，选择\
  \ Global | Data Sources 节点，并为使用 Connections 导航器中定义的连接更新 data-sources.xml 文件，请单击\
  \ Refresh Now 按钮。可以选择复选框以在未定义时创建 data-source 元素，并更新现有 data-source 元素。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_64_0.png)\n\
  \n在 **Connections** 导航器中配置的连接关联的连接池和数据源被列出。选择 **jdev-connection-pool-MySQLConnection**\
  \ 节点以将连接池属性列为 **属性集 A** 和 **属性集 B**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_65_0.png)\n\
  \nJDBC 连接池的调优属性可以在 **连接池** 窗口中设置。不同的调优属性列在下表中：\n\n| 调优属性 | 属性描述 | 默认值 |\n|---|---|---|\n\
  | Abandoned Connection Timeout | 用户获取的连接在非活动状态后经过的时间间隔（秒），之后该连接将被返回到缓存。 | -1 表示该功能未生效。\
  \ |\n| Retry Interval | 失败的连接尝试在经过的时间间隔（秒）后重试。与 Max Connect Attempts 配合使用。 | 1 |\n\
  | Disable Connection Pooling | 指定是否禁用应用程序服务器的连接池。该属性可用，因为某些驱动程序在驱动程序内部提供连接池。 | False\
  \ |\n| Inactivity Timeout | 未使用的连接在非活动状态后被从池中移除的秒数。 | 非活动超时 |\n| Initial Limit |\
  \ 连接池中的初始连接数。如果值大于 0，则指定数量的连接会被预先创建并在连接缓存中可用，从而减少构建缓存到其最佳大小所需的时间。 | 0 |\n| Login\
  \ Timeout | 登录尝试在经过的秒数后超时。0 表示使用系统超时值。如果未定义系统超时，则登录尝试不会超时。 | 0 |\n| Max Connect\
  \ Attempts | 对数据库的最大连接尝试次数。与重试间隔配合使用。 | 3 |\n| Max Connections | 连接池中可用的数据库连接的最大数量。0\
  \ 或更小的值表示没有最大限制。 | 0 |\n| Min Connections | 连接池中的数据库连接的最小数量。 | 0 |\n\n\n\nSelect\
  \ **Property Set B** to specify additional connection pool properties.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_67_0.png)\n\
  \nThe connection pool properties in **Property Set B** are discussed in the following\
  \ table:\n\n| 属性 | 描述 | 默认值 |\n|---|---|---|\n| 缓存语句数 | Specifies the maximum number\
  \ of prepared and callable statements that should be cached for each connection\
  \ in each connection pool. Statement caching increases system performance. A value\
  \ greater than 0 enables statement caching. | 0 |\n| 属性检查间隔 | Specifies the time\
  \ interval (seconds) after which property values are checked for new values, and\
  \ time out limits are implemented. | 900 |\n| 存活时间超时 | Specifies the maximum number\
  \ of seconds a used connection may be active, after which it is closed and returned\
  \ to the connection pool. -1 indicates that the feature is not enabled. | -1 |\n\
  \n## 在 Oracle JDeveloper 中配置 JDBC\n\n| 属性 | 描述 | 默认值 |\n|---|---|---|\n| 已使用连接等待超时\
  \ | Number of seconds for which a used connection remains unused before being returned\
  \ to the connection pool. Only applies if the maximum numbers of connections that\
  \ a connection pool may cache have been acquired by clients, and a client requests\
  \ a connection. | 60 |\n| 验证连接 | Specifies if connections are to be validated, when\
  \ given to a client. Used in conjunction with Validate Connection Statements. |\
  \ False |\n| 验证连接语句 | Specifies the SQL statements used to validate connections\
  \ before being acquired by a client. | None |\n\nThe **Connection Factory** node\
  \ specifies the Factory Class, User name, Password, Login Timeout, and connection\
  \ URL. The factory class must implement one of the following interfaces: `java.sql.Driver`,\
  \ `javax.sql.DataSource`, `javax.sql.ConnectionPoolDataSource`, `javax.sql.XADataSource`.\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_68_0.png)\n\nThe **Managed DataSource**\
  \ node specifies the managed data sources associated with the connection, and which\
  \ are data sources managed by the OC4J. A managed data source is an OC4J implementation\
  \ of the `javax.sql.DataSource` interface that wraps a JDBC driver class, or data\
  \ source class. Even if the factory class does not implement the `javax.sql.DataSource`\
  \ interface, the OC4J implementation of the factory class implements the `javax.sql.DataSource`\
  \ interface. A managed data source supports connection caching, global transaction\
  \ management, and error handling, all provided by the OC4J. A managed data source\
  \ is associated with a connection pool, and thus has the advantage of being able\
  \ to specify the tuning parameters. The **JNDI Name** of the data source is specified\
  \ in the managed data source window. The **JNDI Name** is in the jdbc/MySQLConnectionDS\
  \ format, with MySQLConnection being the connection name configured in the **Connections**\
  \ navigator.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_69_0.png)\n\nA connection\
  \ MySQLConnection in the Connections navigator is available as a data source with\
  \ the JNDI Name binding jdbc/MySQLConnectionDS. To obtain a connection from the\
  \ data source, add a resource-ref element to the web application in which a connection\
  \ is to be obtained. In a Servlet or JSP application, a connection may be obtained\
  \ with the data source JNDI Name.\n\n```\nInitialContext initialContext = new InitialContext();\n\
  javax.sql.DataSource ds = (javax.sql.DataSource)\ninitialContext.lookup(\"java:comp/env/jdbc/MySQLConnectionDS\"\
  );\njava.sql.Connection conn = ds.getConnection();\n```\n\nJavaEE 5 defines annotations\
  \ to support resource injection. Resource injection is the injection of external\
  \ resources, such as a data source in a JEE 5 application using the javax.annotation.Resource\
  \ annotation. JDeveloper 11 will support resource injection with annotations to\
  \ obtain a handle of a data source. For example, define a catalogDS resource of\
  \ the javax.sql.DataSource type, as shown below:\n\n```\nprivate @Resource DataSource\
  \ catalogDS;\n```\n\nThe catalogDS field of type javax.sql.DataSource is annotated\
  \ with the @Resource annotation. JNDI lookup is not required with resource injection,\
  \ and the DataSource resource is also not defined in the web.xml deployment descriptor.\n\
  \n## JDBC 配置错误\n\nYou might get errors while configuring a JDBC connection. If you\
  \ are using MySQL, and the connection URL is incorrect, or the MySQL database is\
  \ not running, the following error message is generated:\n\n```\nCommunications\
  \ link failure\n```\n\nIf you are using Oracle database, some possible connection\
  \ configuration errors are listed below:\n\n```\nIO exception: The Network Adapter\
  \ could not establish the connection\nIO exception: Connection refused\n```\n\n\
  The Network Adapter could not establish the connection exception is caused by one\
  \ or more of the following configuration errors:\n\n- 1. The database host name,\
  \ port number, or database instance name is wrong.\n- 2. The database TNSListener\
  \ has not been started. The TNSListener may be started with the lsnrctl utility.\n\
  \n```\nC:\\>lsnrctl start\n```\n\nThe *Connection refused* exception is caused by\
  \ one or more of the following configuration errors:\n\n- 1. The database **SID**\
  \ specified is incorrect.\n- 2. The database instance has not been started. To start\
  \ the database instance connect to SQL*Plus as SYSDBA.\n\n```\nC:\\>sqlplus SYS/<pwd>\
  \ AS SYSDBA\n```\n\nAt the SQL prompt, start the database instance with the startup\
  \ command.\n\n```\nSQL>startup\n```\n\n## 创建托管数据源\n\nIn the previous section, a\
  \ JDBC connection was obtained in the **Connections** navigator. A corresponding\
  \ JNDI managed data source becomes available for the **Connections** navigator connection.\
  \ A data source object is configured with a JNDI Name binding in the OC4J server\
  \ integrated with JDeveloper. A data source may also be configured in the **Embedded\
  \ OC4J Server Preferences** window directly, or may be configured declaratively\
  \ by modifying the `data-sources.xml` file. We will discuss each of these methods\
  \ for creating a data source. A data source may be configured at the **Global**\
  \ level or the Current Workspace level. A **Global** data source is available to\
  \ all applications while a Current Workspace data source is available only in the\
  \ current workspace. To create a new **Global** data source, select **Tools | Embedded\
  \ OC4J Preferences** and select the **Global | Data Sources** node, and click on\
  \ the **New** button.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_71_0.png)\n\n\
  Before we are able to configure a managed data source, we need to configure a connection\
  \ pool. In the **Create Data Source** window select **Transaction Level** as Connection\
  \ Pool, specify a connection pool name, and click on the **OK** button.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_72_0.png)\n\
  \nA new connection pool gets created and its tuning properties may be set, as required.\
  \ In the **Connection Factory** window, specify a Factory Class, User name, Password,\
  \ Login Timeout, and connection URL. The Factory Class is required to implement\
  \ one of the following interfaces: `java.sql.Driver`, `javax.sql.DataSource`, `javax.sql.ConnectionPoolDataSource`,\
  \ `javax.sql.XADataSource`. The **Factory Class** for a MySQL managed data source\
  \ can be a MySQL class that implements the `javax.sql.DataSource` interface, for\
  \ example the `com.mysql.jdbc.jdbc2.optional.MysqlDataSource` and `com.mysql.jdbc.jdbc2.optional.MysqlConnectionPoolDataSource`\
  \ classes, or it can be a class that implements the `java.sql.Driver` interface,\
  \ for example the `com.mysql.jdbc.Driver` class. Whether a class implementing the\
  \ `java.sql.Driver` interface is used, or a class implementing the `javax.sql.DataSource`\
  \ interface is used, the OC4J server wraps the class and provides an implementation\
  \ of the `javax.sql.DataSource` interface. We will use the data source class **com.mysql.jdbc.jdbc2.optional.MysqlConnectionPoolDataSource**.\
  \ A **Password** is not required for a root user, by default. Specify the connection\
  \ **URL** as `jdbc:mysql://localhost:3306/test`. Click on **OK** to configure the\
  \ connection pool.\n\n\n\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_73_0.png)\n\
  \n创建数据源，方法是选择 **全局 | 数据源** 节点，然后单击 **新建**，就像我们为创建连接池所做的那样。在 **创建数据源** 窗口中，将事务级别选择为受管数据源，指定数据源\
  \ **名称** 并单击 **确定**。数据源也可以配置为 **原生数据源**。受管数据源与原生数据源之间的区别在于 OC4J 服务器不会包装原生数据源。OC4J\
  \ 服务器不会为原生数据源提供连接缓存。原生数据源不支持全局/分布式事务。分布式事务是指跨多个数据库服务器的事务。如果要配置原生数据源，请指定实现 `javax.sql.DataSource`\
  \ 接口的数据源类。**连接池** 不应为原生数据源配置。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_73_1.png)\n\
  \n## 在 Oracle JDeveloper 中配置 JDBC\n\n添加一个新的 **受管数据源**。指定数据源要关联的连接池名称为我们之前配置的 **连接池**。指定\
  \ JNDI 名称、用户名、密码、登录超时、事务级别，然后单击 **确定**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_74_0.png)\n\
  \n受管数据源 gets configured and updates the `data-sources.xml` file using the **刷新**\
  \ button. 受管数据源也可以通过直接修改目录 `C:\\JDeveloper\\jdev\\system\\oracle.j2ee.10.1.3.nn.nn\\\
  embedded-oc4j\\config` 中的 `data-sources.xml` 配置文件以声明方式创建。`<JDeveloper10.1.3>` 是\
  \ JDeveloper 安装的目录。向 `data-sources.xml` 文件添加一个 `managed-data-source` 元素以指定 `DataSource`\
  \ 对象的配置。`managed-data-source` 元素包括用于获取 `DataSource` 对象的数据源类。用于配置数据源 `MySQLDataSource`、使用\
  \ `MySQL` 数据库、使用 `jndi-name jdbc/MySQLDataSource` 的 `managed-data-source` 元素如下所示：\n\
  \n```\n<managed-data-source name='MySQLDataSource'\nconnection-pool-name='MySQL\
  \ Connection Pool'\njndi-name='jdbc/MySQLDataSource'/>\n<connection-pool name='MySQL\
  \ Connection Pool'>\n<connection-factory factory-class='com.mysql.jdbc.jdbc2.optional.MysqlConnectionPoolDataSource'\n\
  user='root'\npassword=''\nurl=\"jdbc:mysql://localhost:3306/test\">\n</connection-factory>\n\
  </connection-pool>\n```\n\n`data-sources.xml` 文件中的元素基于 XML Schema http://www.oracle.com/technology/oracleas/schema/data-sources-10_1.xsd。根元素是\
  \ data-sources，data-sources 元素有一个或多个 managed-data-source、connection-pool 和 native-data-source\
  \ 元素。managed-data-source 元素具有以下属性：name、user、password、login-timeout、tx-level、schema、connection-pool-name\
  \ 和 jndi-name。每个 managed-data-source 元素都与一个连接池关联，该连接池在 connection-pool 元素中指定。connection-pool\
  \ 元素具有 connection-factory 子元素和属性，这些属性在以下表格中讨论：\n\n| 元素 | 描述 | 默认值 |\n|---|---|---|\n\
  | name | 连接池名称。 | -1 |\n| min-connections | 连接池中的最小连接数。 | 0 |\n| max-connections\
  \ | 连接池中打开连接的最大数量。值为 0 或更小表示没有最大限制。 | 0 |\n| initial-limit | 创建或重新初始化连接池时的初始连接数。指定连接池的初始大小可减少达到最佳大小的启动时间。\
  \ | 0 |\n| used-connection-wait-timeout | 当连接池达到最大连接数且池中所有连接都在使用时，连接池会等待指定时间以供客户端释放连接回连接池。\
  \ | 60 |\n| inactivity-timeout | 当连接池中的连接非活动时间达到非活动超时期限（以秒为单位）时，该连接将被移除。 | 60 |\n\
  | login-timeout | 指定数据源等待建立与数据库连接的时间（以秒为单位）。值为 0 表示默认系统超时。 | 0 |\n| connection-retry-interval\
  \ | 指定在重试与数据库连接之前等待的时间间隔（以秒为单位）。 | 1 |\n| max-connect-attempts | 指定重试连接到数据库的次数。\
  \ | 3 |\n| validate-connection | 如果设置为 true，则在将连接提供给客户端时，使用 validate-connection-statement\
  \ 属性指定的 SQL 语句验证与数据库的连接。 | False |\n| validate-connection-statement | 当连接从连接池提供给客户端时运行的语句。\
  \ | None |\n| num-cached-statements | 指定为连接缓存的语句的最大数量。值大于 0 可启用语句缓存。 | 0 |\n| time-to-live-timeout\
  \ | 默认情况下未启用，此元素指定已使用连接在关闭并返回连接池之前可保持活动状态的最长时间（以秒为单位）。当连接关闭时，语句句柄也会关闭。 | -1 |\n\
  | abandoned-connection-timeout | 仅在 Oracle 数据库中受支持且默认情况下未启用，此元素指定已使用连接的非活动超时。 |\
  \ -1 |\n| disable-server-connection-pooling | 禁用应用服务器的连接池。该元素与在驱动程序内部支持连接池的 JDBC\
  \ 驱动程序一起使用。使用隐式连接缓存的 Oracle JDBC 驱动程序时，其值不使用。 | False |\n| property-check-interval\
  \ | 仅与 Oracle 数据库一起使用。此元素指定在应用超时之前的时间间隔（以秒为单位）。 | 900 |\n| lower-threshold-limit\
  \ | 连接限制的下限阈值。默认为 20%。 | 20% |\n\n如果使用原生数据源，则连接缓存主要以编程方式执行。OracleDataSource 使用方法\
  \ getConnectionCacheName()、setConnectionCacheName(String cacheName)、getConnectionCacheProperties()\
  \ 和 setConnectionCacheProperties(java.util.Properties cp) 提供连接缓存。或者，可以使用连接缓存管理器类\
  \ OracleConnectionCacheManager 来指定连接缓存。OracleConnectionCacheManager 类提供 getCacheManagerInstance()、createCache(String\
  \ cacheName, javax.sql.DataSource ds, Properties cacheProperties)、\n\n`createCache(javax.sql.DataSource\
  \ ds, Properties cacheProperties)`、`removeCache(String cacheName, int mode)`、`refreshCache(String\
  \ cacheName, int mode)` 和 `getCacheProperties(String cacheName)` 方法来配置连接缓存。对于原生数据源，还可以在\
  \ `data-sources.xml` 文件中的 `native-data-source` 元素中使用 `property` 元素以声明方式指定连接缓存。可以在原生数据源中指定的连接缓存属性在以下表格中讨论：\n\
  \n| 连接缓存属性 | 类型 | 描述 |\n|---|---|---|\n| connectionCacheName | String | 缓存名称。 |\n\
  | connectionCachingEnabled | Boolean | 指定是否启用隐式连接缓存。 |\n| fastConnectionFailoverEnabled\
  \ | Boolean | 指定是否启用快速连接故障转移。要启用快速连接故障转移，还应启用隐式连接缓存。快速连接故障转移提供连接缓存中可用连接的负载均衡。此外，使用快速连接故障转移时，无效连接将被关闭。\
  \ |\n\n受管数据源是首选数据源，因为连接池由 OC4J 服务器实现，开发人员无需实现连接池。在下一节中，我们将开发一个 Web 应用程序以从 MySQL\
  \ 数据库检索数据。删除本节中配置的受管数据源 MySQLDataSource 和连接池 MySQLConnectionPool，方法是选择 **工具 | 嵌入式\
  \ OC4J 服务器首选项** 窗口中的受管数据源/连接池，然后选择 **删除** 按钮。使用 **立即刷新** 按钮更新 `data-sources.xml`\
  \ 配置文件\n\n## 从 Web 应用程序连接数据库\n\n如果使用 Java 应用程序连接数据库，可以使用 `DriverManager` 类的 `getConnection()`\
  \ 方法获取 JDBC 连接。如果要在 Web 应用程序中获取 JDBC 连接，则必须在应用程序服务器中配置具有 JNDI 命名服务绑定的数据源，例如嵌入在 JDeveloper\
  \ IDE 中的 OC4J。配置在 `data-sources.xml` 中的数据源对象可在 JDeveloper 中的 Servlet 或 JSP 中使用。在本节中，我们将使用上一节中配置的受管数据源连接到\
  \ MySQL 数据库。首先，我们需要在 JDeveloper 中使用 **文件 | 新建** 创建一个项目。在 **新建库** 窗口中，在类别中选择 **常规\
  \ | 应用程序**，并在\n\n\n项目并点击 **确定**。在 **创建应用程序** 窗口中指定应用程序名称并点击 **确定** 按钮。在 **创建项目**\
  \ 窗口中指定项目名称并点击 **确定** 按钮。一个新项目将被添加到应用程序导航器中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_78_0.png)\n\
  \n在 **应用程序导航器** 窗口中右键单击项目节点并选择 **新建**。在 **新建库** 窗口中，在类别中选择 **Web Tier | JSP**，在项目中选择\
  \ **JSP**，然后点击 **确定**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_78_1.png)\n\n\
  **创建 JSP 向导** 开始。在 **Web 应用程序** 窗口中，选择 J2EE 1.4 作为 J2EE 版本并点击 **下一步**。在 **JSP 文件**\
  \ 窗口中，指定文件名并点击 **下一步**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_79_0.png)\n\n\
  如果不使用错误页面来处理未处理的异常，请在 **错误页面选项** 窗口中选择默认设置。如果要使用错误页面来处理未处理的异常，请选择 **使用错误页面** 并点击\
  \ **下一步** 按钮。由于本章中不会使用任何标记库，请在 **标记库** 窗口中选择默认设置，然后点击 **下一步**。在 **HTML 选项** 窗口中选择默认设置，HTML\
  \ 版本为 4.0.1 Transitional，然后点击 **下一步**。\n\n## Configuring JDBC in Oracle JDeveloper\n\
  \n在完成窗口中点击完成后，一个 JSP 将被添加到项目中。在 web.xml 文件中，为托管数据源添加 resource-ref 元素。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_80_0.png)\n\
  \nres-ref-name 指定托管数据源的 JNDI 名称。resource-ref 元素如下所示：\n\n```\n<resource-ref>\n  <res-ref-name>jdbc/MySQLConnectionDS</res-ref-name>\n\
  \  <res-type>javax.sql.DataSource</res-type>\n  <res-auth>Container</res-auth>\n\
  </resource-ref>\n```\n\n我们还需要将 mysql-connector-java-5.1.3-rc-bin.jar 复制到 C:\\JDeveloper\\\
  j2ee\\home\\applib 目录，这将把 MySQL Connector/J JDBC 4.0 驱动程序添加到 Web 应用程序的运行时类路径中。\n\
  \n## Setting J2SE Version to JDK 6.0\n\nJDBC 4.0 驱动程序需要 JDK 6.0。因此，我们必须将 JDBC4 项目的\
  \ J2SE 版本设置为 J2SE 6.0。在应用程序导航器中选择项目节点并选择 Tools | Project Properties。在项目属性窗口中，选择库节点。点击\
  \ J2SE 版本字段的更改按钮。在编辑 J2SE 定义窗口中，点击新建。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_81_0.png)\n\
  \n在创建 J2SE 窗口中，点击浏览以选择 JDK 6.0 java.exe 可执行文件。指定 J2SE 名称，然后点击确定。一个新的 J2SE 定义将在编辑\
  \ J2SE 定义窗口中创建。选择 J2SE6.0 定义并点击确定。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_82_0.png)\n\
  \n在项目属性窗口中点击确定。\n\n## Developing and Running JSP\n\n接下来，我们将使用上一节中配置的托管数据源，在 MySQLDataSource\
  \ JSP 中获取 JDBC 连接。嵌入在 JDeveloper 10.1.3 中的 OC4J 服务器不支持 JDBC 4.0。因此，我们将无法在 Web 应用程序中使用\
  \ JDBC 4.0 功能。大多数 J2EE 应用服务器，如 WebLogic 服务器、JBoss 服务器和 WebSphere 服务器都不支持 JDBC 4.0。Sun\
  \ Java System Application Server 9.1 是唯一支持 JDBC 4.0 的应用服务器。\n\n然而，我们将使用 JDBC 4.0\
  \ 驱动程序，并且 JDBC 4.0 功能可与支持 JDBC 4.0 的应用服务器一起使用。将 MySQL JDBC 4.0 JAR 文件复制到 <JDeveloper>\\\
  j2ee\\home\\applib 目录，<JDeveloper> 为\nJDeveloper 安装目录。开发人员使用 JDBC 4.0 所需的全部条件是一个支持\
  \ JDBC 4.0 驱动程序的应用服务器。在 MySQLDataSource JSP 中，从我们之前配置的托管数据源创建 DataSource 对象。首先，我们必须创建一个\
  \ InitialContext 对象，然后使用 lookup() 方法创建一个 javax.sql.DataSource 对象，以查找数据源资源，该资源在 web.xml\
  \ 文件中作为外部资源使用 resource-ref 元素指定。我们必须将 JNDI 名称 jdbc/MySQLDS 前缀为 JNDI 上下文 java:comp/env。有关\
  \ JNDI 命名教程，请参阅 JNDI 教程：http://java.sun.com/products/jndi/tutorial/。\n\n```\nInitialContext\
  \ initialContext = new InitialContext();\njavax.sql.DataSource ds = (javax.sql.DataSource)\
  \ initialContext.\nlookup(\"java:comp/env/jdbc/MySQLConnectionDS\");\n```\n\n使用\
  \ getConnection() 方法从 DataSource 对象获取 JDBC 连接。\n\n```\njava.sql.Connection connection\
  \ = ds.getConnection();\n```\n\n运行 SQL 查询并从查询的结果集创建 HTML 表格。使用 createStatement()\
  \ 方法从 Connection 对象创建 Statement 对象。使用 Statement 对象的 executeQuery() 方法运行 SQL 查询。遍历结果集并从结果集行中检索列值，以创建\
  \ HTML 表格。使用 close() 方法关闭 ResultSet 对象、Statement 对象和 Connection 对象，该方法为这些接口中的每一个定义。MySQLDataSource.jsp\
  \ 如下所示：\n\n```\n<%@ page contentType=\"text/html;charset=windows-1252\"%>\n<%@ page\
  \ language=\"java\" import=\"java.sql.*, javax.naming.*, javax.sql.*\" %>\n<%\n\
  InitialContext initialContext = new InitialContext();\njavax.sql.DataSource ds =\
  \ (javax.sql.DataSource)\ninitialContext.lookup(\"java:comp/env/jdbc/MySQLDS\");\n\
  java.sql.Connection connection = ds.getConnection();\nStatement stmt=connection.createStatement();\n\
  ResultSet resultSet=stmt.executeQuery(\"Select * from Catalog\");\n%>\n<table border=\"\
  1\" cellspacing=\"0\">\n<tr>\n<th>CatalogId</th>\n<th>Journal</th>\n<th>Publisher</th>\n\
  <th>Edition</th>\n<th>Title</th>\n<th>Author</th>\n</tr>\n<%\nwhile (resultSet.next())\n\
  {\n%>\n<tr>\n<td><%=out.println(resultSet.getString(1));%></td>\n<td><%=out.println(resultSet.getString(2));%></td>\n\
  <td><%=out.println(resultSet.getString(3));%></td>\n<td><%=out.println(resultSet.getString(4));%></td>\n\
  <td><%=out.println(resultSet.getString(5));%></td>\n<td><%=out.println(resultSet.getString(6));%></td>\n\
  </tr>\n<%\n}\n%>\n</table>\n<%\nresultSet.close();\nstmt.close();\nif(!connection.isClosed())\n\
  connection.close();\n%>\n```\n\n通过在 **应用程序导航器** 中右键单击 JSP 节点并选择 **运行** 来运行 JSP。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_84_0.png)\n\nJSP 的输出在默认浏览器中显示：\n\n| CatalogId\
  \ | Journal | Publisher | Edition | Title | Author |\n|---|---|---|---|---|---|\n\
  | catalog1 | Oracle Magazine | Oracle Publishing | Nov-Dec 2004 | Database Resource\
  \ Manager | Kimberly Floss |\n| catalog2 | Oracle Magazine | Oracle Publishing |\
  \ Nov-Dec 2004 | From ADF UIX to JSF | Jonas Jacobi |\n\n## JDBC 4.0 Version\n\n\
  嵌入在 JDeveloper 10g 中的 OC4J 不支持 JDBC 4.0。当为 JDBC 4.0 添加支持时，JDBC 4.0 的功能可以添加到我们在上一节中开发的\
  \ JSP Web 应用程序中。在 Connection 对象上设置客户端信息属性的能力是 JDBC 4.0 中的新功能。客户端信息属性可以使用 Connection\
  \ 对象的 setClientInfoProperty() 方法设置。按如下方式设置客户端信息属性 ApplicationName、ClientUser 和 ClientHostname：\n\
  \n```\nconnection.setClientInfo(\"ApplicationName\",\"DataDirectApp\");\nconnection.setClientInfo(\"\
  ClientUser\",\"DataDirect\");\nconnection.setClientInfo(\"ClientHostname\",\"DataDirectHost\"\
  );\n```\n\n如果数据库支持语句缓存，我们可以将语句池设置为 true。要了解数据库是否支持语句池，请创建 DatabaseMetaData 对象。使用\
  \ supportsStatementPooling() 方法测试数据库是否支持语句池。如果数据库支持语句池，请使用 isPoolable() 方法检查 Statement\
  \ 是否可池化。如果 Statement 对象可池化，请使用 setPoolable() 方法将 Statement 对象设置为可池化：\n\n```\nDatabaseMetaData\
  \ metaData=connection.getMetaData();\nif(metaData.supportsStatementPooling())\n\
  {\n    if(stmt.isPoolable())\n    stmt.setPoolable(true);\n}\n```\n\n\n\n我们可以使用对包装器模式的支持，其中使用了\
  \ `Wrapper` 接口，而 `Statement` 接口扩展了它。Oracle 对 JDBC API 的扩展提供了 `OracleStatement` 接口，该接口扩展了\
  \ `Statement` 接口。使用包装器模式创建一个 `OracleStatement` 类型的对象。首先，我们需要使用 `isWrapperFor()`\
  \ 方法检查 `Statement` 对象是否为 `oracle.jdbc.OracleStatement` 的包装器。随后，使用 `unwrap()` 方法创建一个\
  \ `OracleStatement` 类型的对象：\n\n```\nOracleStatement oracleStmt=null;\nClass class\
  \ = Class.forName(\"oracle.jdbc.OracleStatement\");\nif(stmt.isWrapperFor(class))\n\
  {\n    oracleStmt = (OracleStatement)stmt.unwrap(class);\n}\n```\n\n`OracleStatement`\
  \ 对象可用于使用 `defineColumnType()` 方法为从数据库获取的不同列设置列类型。此外，还可以使用 `setRowPrefetch()` 方法设置预取的行数。\n\
  \n如果数据库支持 SQL 类型的 `ROWID`，我们可以在结果集中为行的 `ROWID` 值添加一列。`ROWID` 列值可使用 `getRowId()`\
  \ 方法作为 `java.sql.RowId` 对象检索。Oracle 数据库 10g 支持 `ROWID` 数据类型。因此，修改 `SELECT` 查询以添加\
  \ `ROWID` 伪列的列。\n\n```\nResultSet resultSet= oracleStmt.executeQuery(\"Select ROWID,\
  \ CATALOGID, JOURNAL, PUBLISHER, EDITION, TITLE, AUTHOR from Catalog\");\n```\n\n\
  我们还必须向从结果集创建的 HTML 表格添加一个类型为 `ROWID` 的列。`ROWID` 列值可使用 `getRowId()` 方法从 `ResultSet`\
  \ 对象检索。`RowId` 对象可使用 `toString()` 方法转换为 `String` 值：\n\n```\n<%out.println(resultSet.getRowId(\"\
  ROWID\").toString());%>\n```\n\nJSP Web 应用程序中可以使用 `SQLException` 接口中对链式异常的增强支持。我们需要在\
  \ `input.jsp` 中指定 `errorPage` 以进行错误处理：\n\n```\n<%@ page errorPage=\"errorpage.jsp\"\
  \ %>\n```\n\n在 `errorpage.jsp` 中，使用增强的 **for-each 循环** 来检索链式异常和链式原因。\n\n```\n<%@\
  \ page isErrorPage=\"true\" %>\n<%\n    for( Throwable e : exception )\n{\n    out.println(\"\
  Error encountered: \" + e);\n}\n%>\n```\n\n下面列出了 input.jsp 的 JDBC 4.0 版本，当在 OC4J\
  \ 服务器中添加对 JDBC 4.0 的支持时，该版本可在 JDeveloper 中运行：\n\n```\n<%@ page contentType=\"text/html;charset=windows-1252\"\
  %>\n<%@ page language=\"java\" import=\"java.sql.*, javax.naming.*, javax.sql.*,oracle.jdbc.*\"\
  \ %>\n<%@ page errorPage=\"errorpage.jsp\" %>\n<%\nInitialContext initialContext\
  \ = new InitialContext();\nDataSource ds = (DataSource)\ninitialContext.lookup(\"\
  java:comp/env/jdbc/OracleDS\");\njava.sql.Connection connection = ds.getConnection();\n\
  connection.setClientInfo(\"ApplicationName\",\"DataDirectApp\");\nconnection.setClientInfo(\"\
  ClientUser\",\"DataDirect\");\nconnection.setClientInfo(\"ClientHostname\",\"DataDirectHost\"\
  );\nStatement stmt=connection.createStatement();\nDatabaseMetaData metaData=connection.getMetaData();\n\
  if(metaData.supportsStatementPooling())\n{\n    if(stmt.isPoolable())\n    stmt.setPoolable(true);\n\
  }\nOracleStatement oracleStmt=null;\nClass class = Class.forName(\"oracle.jdbc.OracleStatement\"\
  );\nif(stmt.isWrapperFor(class))\n{\n    oracleStmt = (OracleStatement)stmt.unwrap(class);\n\
  \    oracleStmt.defineColumnType(1, OracleTypes.VARCHAR);\n    oracleStmt.defineColumnType(2,\
  \ OracleTypes.VARCHAR);\n    oracleStmt.defineColumnType(3, OracleTypes.VARCHAR);\n\
  \    oracleStmt.defineColumnType(4, OracleTypes.VARCHAR);\n    oracleStmt.defineColumnType(5,\
  \ OracleTypes.VARCHAR);\n    oracleStmt.defineColumnType(6, OracleTypes.VARCHAR);\n\
  \    oracleStmt.defineColumnType(7, OracleTypes.VARCHAR);\n    oracleStmt.setRowPrefetch(2);\n\
  }\nResultSet resultSet=oracleStmt.executeQuery(\"Select ROWID, CATALOGID, JOURNAL,\
  \ PUBLISHER, EDITION, TITLE, AUTHOR from Catalog\");\n%>\n<table border=\"1\" cellspacing=\"\
  0\">\n<tr>\n<th>Row Id</th>\n<th>Catalog Id</th>\n<th>Journal</th>\n<th>Publisher</th>\n\
  <th>Edition</th>\n<th>Title</th>\n<th>Author</th>\n</tr>\n<%\nwhile (resultSet.next())\n\
  {\n%>\n<tr>\n<td><%=out.println(resultSet.getRowId(\"ROWID\").toString());%></td>\n\
  <td><%=out.println(resultSet.getString(1));%></td>\n<td><%=out.println(resultSet.getString(2));%></td>\n\
  <td><%=out.println(resultSet.getString(3));%></td>\n<td><%=out.println(resultSet.getString(4));%></td>\n\
  <td><%=out.println(resultSet.getString(5));%></td>\n<td><%=out.println(resultSet.getString(6));%></td>\n\
  </tr>\n<%\n}\n%>\n</table>\n<%\nresultSet.close();\noracleStmt.close();\nif(!connection.isClosed())\n\
  connection.close();\n%>\n```\n\n## 摘要\n\nJDeveloper IDE 提供了内置的 **Connections** 导航器，用于配置与任何可用\
  \ JDBC 驱动程序的关系数据库的连接。在 **Connections** 导航器中配置的连接也可作为数据源使用。在本章中，我们使用 MySQL Connector/J\
  \ 5.1 JDBC 4.0 驱动程序在 JDeveloper 中配置了与 MySQL 数据库的 JDBC 连接。我们还在嵌入 JDeveloper 的 OC4J\
  \ 中创建了一个托管数据源，并在 Web 应用程序中使用了该数据源。随后，我们讨论了 Web 应用程序的 JDBC 4.0 版本。\n"
- "## 3 使用 JSTL SQL 标签库连接数据库\n\nJSP 1.1 和之后的 JSP 版本支持称为自定义操作的<|message|> 可重用模块。自定义操作在\
  \ JSP 页面中通过自定义标签调用。自定义标签的集合称为标签库。用于访问数据库的各种 SQL 标签库可用。JavaServer Pages 标准标签库（JSTL）是一个标签库，提供用于访问数据库的\
  \ SQL 标签。JSTL 1.1 要求 JSP 容器支持 Servlet 规范 2.4 和 JSP 规范 2.0。在本章中，我们将讨论 JSTL SQL 标签库，并在支持\
  \ Servlet 2.4 和 JSP 2.0 规范的嵌入式 OC4J 的 JDeveloper 10.1.3 中开发 JSTL SQL 标签库应用程序。JSTL\
  \ SQL 标签库是在 JDBC 4.0 规范可用之前创建的。如果您使用 JDK 6.0 中的 JDBC 4.0 驱动程序，您仍然可以使用 JSTL SQL 标签库。我们将使用\
  \ JDBC 4.0 和 JDK 6.0 使用 JSTL SQL 标签库访问 Oracle 数据库。首先，让我们讨论 JSTL SQL 标签库标签。\n\n##\
  \ JSTL SQL 和核心标签概述\n\nJSTL SQL 标签库提供各种用于访问数据库、创建数据库表、更新、删除和查询数据库的标签。SQL 标签库 URI\
  \ 为：http://java.sun.com/jsp/jstl/sql。在 JSP 页面中包含 JSTL SQL 标签库的语法如下所示的 taglib 指令。URI\
  \ 用于为标签库定义命名空间，这避免了如果在同一 JSP 页面上使用具有相似标签名称的另一个标签库可能发生的冲突。\n\n```\n<%@ taglib prefix=\"\
  sql\" uri=\" http://java.sun.com/jsp/jstl/sql\" %>\n```\n\nJSTL SQL 标签库中的不同标签在下表中讨论。表中所有标签属性的类型均为\
  \ java.lang.String，除非指定为其他类型。属性不是必需的，除非指定为必需。\n\n| 标签名称 | 描述 | 属性 |\n|---|---|---|\n\
  | transaction | 创建一个事务，在其中运行一组 SQL 语句。为 sql:query 和 sql:update 子标签建立事务上下文。sql:transaction\
  \ 标签内的 sql:query 和 sql:update 标签不得指定 dataSource 属性。sql:transaction 标签通过调用 commit()\
  \ 或 rollback() 方法提交或回滚（如果发生事务）事务。 | dataSource- 指定数据源，可以是 JNDI 资源的相关路径，或 DriverManager\
  \ 类的 JDBC 参数。JDBC 参数为驱动类、连接 URL、用户名和密码。isolation- 指定事务隔离级别。隔离级别值可以是 \"read_committed\"\
  、\"read_uncommitted\"、\"repeatable_read\" 或 \"serializable\"。隔离级别值已在第 1 章中讨论。默认值为数据源的隔离级别。\
  \ |\n| query | 运行 SQL 查询。SQL 查询可在 sql 属性中指定，或在 query 元素中指定。如果指定了 dataSource，则 query\
  \ 标签不应位于 transaction 标签内。查询结果存储在作用域变量 var 中。如果查询未产生结果，则返回空的 Result 对象。查询语句可能包含参数标记\
  \ (\"?\")，用于标识 PreparedStatement 参数。结果集中行的顺序可能因 RDBMS 实现而异，除非指定了 ORDER BY 子句。如果在\
  \ transaction 标签中指定了 query 标签，则 Connection 对象从 transaction 标签获取。 | var(required)-\
  \ 查询的作用域变量。Var 的类型为 javax.servlet.jsp.jstl.sql.Result。scope- 变量的作用域。作用域可以是 \"page\"\
  、\"request\"、\"session\" 或 \"application\"。sql- SQL 查询语句 dataSource- 与查询关联的数据源。数据源可以是\
  \ JNDI 资源的相关路径，或 DriverManager 类的 JDBC 参数。startRow- 指定查询返回的 Result 的起始行。默认值为 '0'，也是原始结果集起始行的索引。maxRows-\
  \ 查询结果集中的最大行数。默认包含所有行。值应为 >-1。值为 -1 也包含所有行。 |\n\n\n\n\n\n| 标签名称 | 描述 | 属性 |\n|---|---|---|\n\
  | update | 运行一条 SQL 语句。SQL 语句可在 sql 属性中指定或在 update 元素标签内指定。SQL 语句可以是 CREATE、UPDATE、INSERT\
  \ 或 DELETE 语句。也可以运行 SQL DDL 语句。update 语句可能包含参数标记（\"?\"），用于标识 PreparedStatement 参数，其值使用包含的\
  \ sql:param 或 sql:dataParam 标签指定。如果指定了 scope，则也必须指定 var。如果指定了 dataSource，则 sql:update\
  \ 标签不应在 sql:transaction 标签内指定。如果 sql:update 标签在 sql:transaction 标签中指定，则 Connection\
  \ 对象从 sql:transaction 标签获取。 | var- SQL 语句结果的范围变量，即 UPDATE、DELETE、INSERT 语句的更新计数。var\
  \ 属性为 Integer 类型。 scope- 变量的作用域。 sql- SQL 语句，可以是 CREATE、UPDATE、INSERT 或 DELETE 语句。\
  \ dataSource- 与更新语句关联的数据源。数据源是 JNDI 资源的相关路径或 DriverManager 类的 JDBC 参数。 |\n| param\
  \ | 使用 sql:query 和 sql:update 标签的子标签指定 SQL 语句中参数标记（\"?\"）的值。参数按指定的顺序替换。如果值为 null，则参数设置为\
  \ SQL NULL 值。 | value- 参数值。 |\n| dateParam | 使用 sql:query 或 sql:update 标签的子标签为 java.util.Date\
  \ 类型参数设置 SQL 语句中参数标记（\"?\"）的值。 | value- DATE、TIME 或 TIMESTAMP 数据库的参数值。 type- \"\
  date\"、\"time\" 或 \"timestamp\"。如果值为 null，则值设置为 SQL NULL。 |\n\n| 标签名称 | 描述 | 属性\
  \ |\n|---|---|---|\n| setDataSource | 创建并导出数据源作为范围变量以在 JSP 页面中使用。 | var- 数据源的范围变量，可以是\
  \ JNDI 资源的相关路径，或 DriverManager 类的 JDBC 参数。var 为 String 或 DataSource 类型。 scope- 变量的作用域。\
  \ dataSource- 数据源。JNDI 资源的相关路径，或 DriverManager 的 JDBC 参数 url- 数据库连接 URL。 user- 用户名。\
  \ password- 密码。 |\n\n我们还将使用一些 JSTL Core 1.1 标签库标签。JSTL Core 1.1 标签库提供用于表达式求值、循环、条件求值、导入基于\
  \ URL 的资源以及输出表达式求值结果的标签。使用 JSTL Core 1.1 标签需要对表达式语言（EL- http://www.oracle.com/technology/sample_code/tutorials/jsp20/simpleel.html）有一定的熟悉程度。JSTL\
  \ Core 1.1 标签库标签在下表中讨论。属性不是必需的，除非指定为必需。\n\n| 标签 | 描述 | 属性 |\n|---|---|---|\n| catch\
  \ | 捕获由其任何包含操作抛出的 java.lang. Throwable。 | var (String)- 表示被包含操作抛出的异常的范围变量。 |\n|\
  \ choose | 指定由 <when> 和 <otherwise> 标记的操作的互斥条件执行的上下文。 | 无。 |\n| forEach | 遍历对象集合。\
  \ | test (boolean)- 指定内容求值测试条件的必需属性。 var (java.lang.String)- 测试条件结果值的导出的变量名。 scope\
  \ (java.lang.String)- 变量的作用域。 |\n\n| 标签 | 描述 | 属性 |\n|---|---|---|\n| forTokens\
  \ | 遍历标记。 | items (java.lang.String)- 指定要遍历的标记的必需属性。 delims (java.lang.String)-\
  \ 指定分隔标记的分隔符的必需属性。 begin (int)- 指定迭代开始的索引。第一个标记的索引为 0。 end (int)- 指定迭代结束的索引。 step\
  \ (int)- 获取下一个标记的步长值。 var (String)- 当前迭代项的导出的范围变量名。 varStatus (String)- 迭代状态的导出的范围变量名。\
  \ |\n| if | 如果表达式求值为 true 则求值内容。 | test (Boolean)- 指定测试条件的必需属性。 var (String)- 测试条件下结果值的导出的范围变量名。\
  \ scope (String)- 变量的作用域。 |\n| import | 导入基于 URL 的资源的内容。 | 所有属性均为 String 类型。 url-\
  \ 指定要导入的资源 URL 的必需属性。 var- 资源内容的导出的范围变量名。 scope- 变量的作用域。 varReader- 与 var 相同，但为\
  \ Reader 类型。 context- 相对 URL 的上下文名称。 charEncoding- URL 资源内容的字符编码。 |\n\n| 标签 | 描述\
  \ | 属性 |\n|---|---|---|\n| otherwise | 指定 <c:choose> 操作中的最后一种替代方案。 | 无。 |\n| out\
  \ | 求值表达式并输出结果。 | 所有属性均为 String 类型。 value- 指定要求值的表达式的必需属性。 default- 结果值为 null 时的默认值。\
  \ escapeXml- 指定结果字符串中的字符 <、>、&、'、\" 是否应转换为对应的字符实体代码。 |\n| param | 向包含 URL 的 import\
  \ 标签添加参数。 | name- 指定查询字符串参数名称的必需属性。 value- 参数值。 |\n| redirect | 重定向到新的 URL。 | 所有属性均为\
  \ String 类型。 url- 重定向到资源的 URL。 context- 重定向到相对 URL 时的上下文名称。 |\n| remove | 删除范围变量。\
  \ | 所有属性均为 String 类型。 var- 指定要删除的范围变量名称的必需属性。 scope- 变量的作用域。 |\n| set | 将表达式求值的结果设置为目标对象的属性。\
  \ | 所有属性均为 String 类型。 var- 包含表达式求值结果值的导出的范围变量名。 value- 要求值的表达式。 target- 其值将被设置的目标对象。\
  \ property- 要设置的目标对象中的属性。 scope- 变量的作用域。 |\n\n| 标签 | 描述 | 属性 |\n|---|---|---|\n\
  | url | 使用可选查询参数创建 URL。 | 所有属性均为 String 类型。 var- 处理后 URL 的导出的范围变量名。 scope- 变量的作用域。\
  \ value- 要处理的 URL。 context- 相对 URL 的上下文。 |\n| when | 如果测试条件求值为 true，则会被求值的子标签。 |\
  \ test (boolean)- 指定测试条件的必需属性。 |\n\n## 设置环境\n\n从以下地址下载 JDeveloper 10.1.3：http://www.oracle.com/technology/software/products/jdev/index.html。将\
  \ JDeveloper zip 文件解压到一个目录，该目录安装 JDeveloper IDE。下载 Oracle 数据库。安装 Oracle 数据库包括示例模式。我们需要将\
  \ Oracle 数据库 11g JDBC 驱动程序 JAR 文件 ojdbc6.jar（用于 JDBC 4.0）复制到 C:\\JDeveloper\\j2ee\\\
  home\\applib 目录。保留 JDBC JAR 文件的副本并将其从 C:\\JDeveloper\\jdbc\\lib 目录中删除。运行 JSTL 应用程序后，将已删除的\
  \ JDBC JAR 文件复制回目录。我们还需要将 J2SE 版本设置为 JDK 6.0，如第 2 章所述。在 JDeveloper 中，为 JSTL SQL\
  \ 标签库创建一个项目。选择 File | New，并在 New Gallery 窗口中，在 Categories 列表中选择 General，在 Items\
  \ 列表中选择 Application。单击 OK 按钮。在 Create Application 窗口中，指定应用程序名称 JSTLApp，然后单击 OK。在\
  \ Create Project 窗口中指定项目名称 JSTLSQL，然后单击 OK。应用程序和项目节点将被添加到 Applications Navigator。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_95_0.png)\n\n## 使用 JSTL SQL 标签库连接数据库\n\
  \n选择项目节点并选择 File | New。在 Categories 中，选择 Web Tier | JSP 并在列出的 Items 中选择 JSP，然后单击\
  \ OK。在 Create JSP Wizard 中，单击 next 按钮。在 Web Application 窗口中，选择 J2EE 1.4（JSTL 1.1\
  \ 所需），然后单击 Next。在 JSP File 窗口中，指定文件名为 catalog.jsp，然后单击 Next。在 Error Page Options\
  \ 窗口中，选择默认设置 Do Not Use an Error Page to Handle Uncaught Exceptions in This File，然后单击\
  \ next。在 Tag Libraries 窗口中，选择库 JSTL Core 1.1 和 JSTL SQL 1.1，然后单击 Next 按钮。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_96_0.png)\n\
  \n在 HTML Options 窗口中选择默认设置，然后单击 Next。单击 Finish 窗口中的 Finish 后，JSP 和 web.xml 将被添加到项目中。\n\
  \n在 Applications-Navigator 中在 JDeveloper 中创建项目后，选择项目节点并选择 Tools | Project Properties。在\
  \ Project Properties 窗口中选择 Libraries 节点。库应列在项目库中。如果这些库中任何一个不在项目库中，请使用 Add Library\
  \ 按钮添加库。例如，要添加 JSTL 1.1 库，请单击 Add Library，选择 JSTL 1.1 库，然后单击 OK\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_97_0.png)\n\
  \n## 创建数据库表\n\n在本节中，我们将使用 JDeveloper 10.1.3 IDE 中的 JSTL 1.1 SQL 标签在 Oracle 数据库中创建数据库表。数据库表将使用\
  \ catalog.jsp JSP 创建，该 JSP 在“设置环境”部分中创建。下面所示的 JSTL SQL taglib 和 JSTL Core taglib\
  \ 的 taglib 指令被添加到 catalog.jsp 中，因为在创建 JSP 时选择了 JSTL SQL 1.1 和 JSTL Core 1.1 taglib。\n\
  \n```\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/sql\" prefix=\"sql\"%>\n<%@\
  \ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\"%>\n```\n\n## 使用\
  \ JSTL SQL 标签库连接数据库\n\n要访问 Oracle 数据库，请使用 SQL 标签 setDataSource 创建数据源。JDeveloper\
  \ 提供了一个组件调色板，用于向 JSP 页面添加 JSTL SQL 标签。选择 JSTL 1.1 SQL 组件调色板。将光标定位在 JSP 页面中，并在 JSTL\
  \ SQL 组件调色板中选择 SetDataSource 标签。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_98_0.png)\n\
  \n在 setDataSource 标签中，在 driver 属性中指定 JDBC 驱动程序 oracle.jdbc.OracleDriver 用于 Oracle\
  \ 数据库。将连接 URL 指定为：jdbc:oracle:thin:@localhost:1521:ORCL 用于 Oracle 数据库。还请指定用户名为 OE，以及密码。要添加标签属性，请在\
  \ setDataSource 标签中按空格键并双击该属性。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_99_0.png)\n\
  \n添加了属性的 sql:setDataSource 标签如下所示：\n\n```\n<sql:setDataSource driver=\"oracle.jdbc.OracleDriver\"\
  \ url=\"jdbc:oracle:\nthin:@localhost:1521:ORCL\" user=\"OE\" password=\"pw\" />\n\
  ```\n\n## 使用 JSTL SQL 标签库连接数据库\n\n接下来，使用 sql:transaction 标签创建一个事务以运行 SQL 语句、创建数据库表并向数据库表添加行。将光标定位在\
  \ JSP 页面中，并在 JSTL 1.1 SQL 组件调色板中选择 Transaction。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_100_0.png)\n\
  \nsql:transaction 标签提供 dataSource 和 isolation 属性，可以像 setDataSource 标签属性一样添加。将以下\
  \ sql:transaction 标签添加到 JSP 页面。\n\n```\n<sql:transaction>\n</sql:transaction>\n\
  ```\n\n`sql:update` 标签用于创建数据库表并向数据库表添加行。`sql:update` 标签添加到 `sql:transaction` 标签内。将光标定位在打开的\
  \ `sql:transaction` 标签和关闭的 `sql:transaction` 标签之间，并在 JSTL 1.1 SQL 组件调色板中选择 Update\
  \ 标签。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_101_0.png)\n\n## 使用 JSTL SQL 标签库连接数据库\n\
  \nsql:update 可能包含 sql、dataSource、var 和 scope 属性。首先，使用 JSTL SQL 标签创建数据库表。SQL CREATE\
  \ 语句在 sql:update 标签的 sql 属性中指定。要添加 sql 属性，请在 sql:update 标签中按空格键并在列出的属性中双击 sql 属性：\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_102_0.png)\n\n创建数据库表的 sql:update 标签如下：\n\
  \n```\n<sql:update sql=\"CREATE TABLE OE.Catalog(CatalogId VARCHAR(25) PRIMARY KEY,\
  \ Journal VARCHAR(25), Publisher VARCHAR(25), Edition VARCHAR(25), Title Varchar(45),\
  \ Author Varchar(25))\">\n</sql:update>\n```\n\n接下来，使用 sql:update 标签向数据库表添加行。INSERT\
  \ 语句在 sql:update 标签的 sql 属性中指定。\n\n```\n<sql:update sql=\"INSERT INTO OE.Catalog\
  \ VALUES('catalog1', 'Oracle Magazine', 'Oracle Publishing', 'Nov-Dec 2004', 'Database\
  \ Resource Manager', 'Kimberly Floss')\">\n</sql:update>\n```\n\n用于创建数据库表并向数据库表中插入行的\
  \ **catalog.jsp** 页面在以下列表中显示：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01\
  \ Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\">\n<%@ page contentType=\"\
  text/html;charset=windows-1252\"%>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/sql\"\
  \ prefix=\"sql\"%>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"\
  c\"%>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\n\
  charset=windows-1252\"/>\n<title>catalog</title>\n</head>\n<body><sql:setDataSource\
  \ driver=\"oracle.jdbc.OracleDriver\"\nurl=\"jdbc:oracle:thin:@localhost:1521:ORCL\"\
  \ user=\"OE\" password=\"pw\"/>\n<sql:transaction>\n<sql:update sql=\"CREATE TABLE\
  \ OE.Catalog(CatalogId VARCHAR(25)\nPRIMARY KEY, Journal VARCHAR(25), Publisher\
  \ VARCHAR(25),\nEdition VARCHAR(25), Title Varchar(45), Author Varchar(25))\">\n\
  </sql:update>\n<sql:update sql=\"INSERT INTO OE.Catalog VALUES('catalog1', 'Oracle\n\
  Magazine', 'Oracle Publishing', 'Nov-Dec 2004', 'Database Resource\nManager', 'Kimberly\n\
  Floss')\">\n</sql:update>\n<sql:update sql=\"INSERT INTO OE.Catalog VALUES('catalog2',\
  \ 'Oracle\nMagazine', 'Oracle Publishing', 'Nov-Dec 2004', 'From ADF UIX to JSF',\n\
  'Jonas Jacobi')\">\n</sql:update>\n<sql:update sql=\"INSERT INTO OE.Catalog VALUES('catalog3',\
  \ 'Oracle\nMagazine',\n'Oracle Publishing','March-April 2005','Starting with Oracle\
  \ ADF',\n'Steve Muench')\">\n</sql:update>\n</sql:transaction>\n<%out.println(\"\
  Database Table Created\");%>\n</body>\n</html>\n```\n\n## 使用 JSTL SQL 标签库连接数据库\n\
  \n通过在应用程序导航器中右键单击 JSP 节点并选择 Run 来运行 JSP。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_104_0.png)\n\
  \n数据库表被创建，并且行被添加到数据库表中。\n\n## 更新数据库表\n\n在本节中，将更新数据库表行。在 JSTLSQL 项目中创建一个 JSP catalogUpdate.jsp。如前一节所述，使用\
  \ setDataSource 标签为 JSP 页面设置数据源。UPDATE SQL 语句使用 sql:update 标签运行。从组件调色板向 JSP 页面添加一个\
  \ Update 标签。SQL 语句具有用于指定 UPDATE 语句的 IN 参数的占位符。将 UPDATE SQL 语句添加到 sql:update 标签的\
  \ sql 属性中。\n\n```\n<sql:update sql=\"UPDATE OE.CATALOG SET TITLE=?, AUTHOR=?\nWHERE\
  \ CATALOGID=?\">\n</sql:update>\n```\n\nIN 参数的值使用 `sql:param` 标签指定。将光标定位在 `sql:update`\
  \ 语句中，并在 JSTL 1.1 SQL 组件调色板中选择 Param 标签。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_105_0.png)\n\
  \n## 使用 JSTL SQL 标签库连接数据库\n\nparam 值使用 sql:param 标签中的 value 属性设置。要添加 value 属性，请在\
  \ sql:param 标签中按空格键并双击 value 属性。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_106_0.png)\n\
  \n指定 param 值并类似地添加 sql:param 标签以指定与 UPDATE SQL 语句中 IN 参数对应的 param 值，如下所示：\n\n```\n\
  <sql:param value=\"Introduction to ADF\"/>\n<sql:param value=\"Muench, Steve\"/>\n\
  <sql:param value=\"catalog3\"/>\n```\n\ncatalogUpdate.jsp 如下所示：\n\n```\n<!DOCTYPE\
  \ HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\"\
  >\n<%@ page contentType=\"text/html;charset=windows-1252\"%>\n<%@ taglib uri=\"\
  http://java.sun.com/jsp/jstl/sql\" prefix=\"sql\"%>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\"\
  \ prefix=\"c\"%>\n<html>\n  <head>\n    <meta http-equiv=\"Content-Type\" content=\"\
  text/html;\ncharset=windows-1252\"/>\n    <title>catalogUpdate</title>\n    </head>\n\
  \    <body>\n    <sql:setDataSource driver=\"oracle.jdbc.OracleDriver\"\nurl=\"\
  jdbc:oracle:thin:@localhost:1521:ORCL\" user=\"oe\"\npassword=\"pw\"/>\n    <sql:update\
  \ sql=\"UPDATE OE.CATALOG SET TITLE=?, AUTHOR=?\nWHERE CATALOGID=?\">\n    <sql:param\
  \ value=\"Introduction to ADF\"/>\n    <sql:param value=\"Muench, Steve\"/>\n  \
  \  <sql:param value=\"catalog3\"/>\n    </sql:update>\n    </body>\n    </html>\n\
  ```\n\n通过右键单击 JSP 并选择 Run 来运行 catalogUpdate.jsp。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_107_0.png)\n\
  \n数据库表已更新。\n\n\n\n## 查询数据库表\n\n在本节中，将查询在前几节中创建和修改的数据库表，并将结果显示在 HTML 表格中。创建一个 JSP，catalogQuery.jsp。为\
  \ JSP 选择 JSTL Core 1.1 和 JSTL SQL 1.1 标签库。如前几节所述，添加一个 setDataSource 标签以获取与 Oracle\
  \ 数据库的连接。用于查询数据库的 SQL 标签库标签是 sql:query。在 JSP 页面中定位光标，并在 SQL 组件调色板中选择 Query 标签。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_108_0.png)\n\n在“插入查询”窗口中，指定 var 属性，该属性是必需属性。var\
  \ 属性指定 Query 标签返回的结果集的变量。选择“高级属性”选项卡。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_108_1.png)\n\
  \n在 sql 属性字段中指定 SQL 查询，然后单击“确定”按钮。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_109_0.png)\n\
  \nsql:query 标签被添加到 JSP 页面：\n\n```\n<sql:query  var=\"catalog\" sql=\"SELECT * FROM\
  \ CATALOG\"/>\n```\n\n添加一个 <table> 来显示 Query 标签的结果集。添加表头。结果集中每一行都将对应添加一行。选择 JSTL\
  \ 1.1 Core 组件库并向 <table> 添加 ForEach 标签。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_109_1.png)\n\
  \n## 使用 JSTL SQL 标签库连接数据库\n\nc:forEach 标签的 var 属性指定与结果集中的一行相对应的变量。items 属性指定用于遍历\
  \ Query 标签返回的结果集中的行的 EL 绑定。sql:query 标签返回的结果集中的行是通过 ${catalog.rows} EL 表达式获取的。catalogQuery.jsp\
  \ JSP 中的 c:forEach 标签如下：\n\n```\n<c:forEach var=\"journal\" items=\"${catalog.rows}\"\
  >\n</c:forEach>\n```\n\n接下来，将行中每个列对应的值输出到 JSP 表格。JSP 表格值通过 c:out 标签添加。从 JSTL 1.1\
  \ Core 组件调色板为 c:forEach 标签添加每个列的 c:out 标签。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_110_0.png)\n\
  \n在“插入输出”窗口中，指定用于绑定列值的 EL 表达式。列值绑定通过结果集中的列名获取。要绑定列值，请单击“绑定”按钮。journal 是与结果集中的一行相对应的变量。例如，绑定\
  \ CatalogId 列的 EL 表达式是 ${journal.CatalogId}。在“绑定到数据”窗口的表达式文本区域中指定 EL 表达式，然后单击“确定”按钮。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_111_0.png)\n\n在“插入输出”窗口中单击“确定”按钮。\n\n\
  ![](img/553e44bc30e70d0d8e58278a7ece8da8_111_1.png)\n\n类似地为结果集中的其他列添加 c:out 标签。下面列出了\
  \ catalogQuery.jsp：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\
  \n\"http://www.w3.org/TR/html4/loose.dtd\">\n<%@ page contentType=\"text/html;charset=windows-1252\"\
  %>\n<%@ taglib uri=\"http://java.sun.com/jsp/jstl/core\" prefix=\"c\"%>\n<%@ taglib\
  \ uri=\"http://java.sun.com/jsp/jstl/sql\" prefix=\"sql\"%>\n<html>\n<head>\n<meta\
  \ http-equiv=\"Content-Type\" content=\"text/html;\ncharset=windows-1252\"/>\n<title>catalogQuery</title>\n\
  </head>\n<body><sql:setDataSource driver=\"oracle.jdbc.OracleDriver\"\nurl=\"jdbc:oracle:thin:@localhost:1521:ORCL\"\
  \ user=\"oe\"\npassword=\"pw\"/><sql:query var=\"catalog\" sql=\"SELECT * FROM\n\
  OE.CATALOG\"/>\n<table border>\n<tr>\n    <td><b>CatalogId</b></td>\n    <td><b>Journal</b></td>\n\
  \    <td><b>Publisher</b></td>\n    <td><b>Edition</b></td>\n    <td><b>Title</b></td>\n\
  \    <td><b>Author</b></td>\n</tr>\n<c:forEach var=\"journal\" items=\"${catalog.rows}\"\
  >\n<tr>\n    <td>\n        <c:out value=\"${journal.CatalogId}\"/>\n    </td>\n\
  \    <td><c:out value=\"${journal.Journal}\"/></td>\n    <td><c:out value=\"${journal.Publisher}\"\
  /></td>\n    <td><c:out value=\"${journal.Edition}\"/></td>\n    <td><c:out value=\"\
  ${journal.Title}\"/></td>\n    <td><c:out value=\"${journal.Author}\"/></td>\n</tr>\n\
  </c:forEach>\n</table>\n</body>\n</html>\n```\n\n要运行 **catalogQuery.jsp**，右键单击 JSP\
  \ 并选择 **Run**：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_112_0.png)\n\n通过 Query\
  \ 标签获取的结果集会显示在 HTML 表格中。\n\n| 目录ID | 期刊 | 出版社 | 版本 | 标题 | 作者 |\n|---|---|---|---|---|---|\n\
  | catalog1 | Oracle Magazine | Oracle Publishing | Nov-Dec 2004 | Database Resource\
  \ Manager | Kimberly Floss |\n| catalog2 | Oracle Magazine | Oracle Publishing |\
  \ Nov-Dec 2004 | From ADF UIX to JSF | Jonas Jacobi |\n| catalog3 | Oracle Magazine\
  \ | Oracle Publishing | March-April 2005 | Introduction to ADF | Muench, Steve |\n\
  \n## 摘要\n\nJSTL SQL 标签库提供对数据库的访问。JDeveloper 10.1.3 通过为 JSTL SQL 1.1 标签提供的组件调色板来促进\
  \ JSTL SQL 应用程序的开发，可从中将标签库标签添加到 JSP 应用程序。在本章中，您已学习如何在 JDeveloper 10.1.3 中使用 JSTL\
  \ SQL 1.1 标签创建 Oracle 数据库表。您还学习了如何使用 JSTL SQL 1.1 标签更新数据库表和查询数据库表。\n"
- "## 4 在 JBoss 应用服务器中配置 JDBC\n\nJBoss 4.0 是一个开源应用服务器，默认配置为使用 **Hypersonic Database**（HSQLDB）。然而，一些\
  \ **Java 2 Platform Enterprise Edition**（J2EE）开发人员希望使用除 Hypersonic Database 之外的数据库来开发和部署应用程序。JBoss\
  \ 应用服务器为 **Enterprise Java Beans**（EJB）持久化和 J2EE 应用程序提供数据源访问。在本章中，我们将了解如何配置 JBoss\
  \ 以使用其他数据库。\n\nJBoss 4.0 服务器使用 Java 数据库连接（JDBC）配置文件和数据源文件来将服务器配置为使用数据库。要使用除默认数据库\
  \ Hypersonic 之外的数据库，JDBC 配置文件必须进行修改，并且数据库的数据源文件必须提供给服务器。从 `http://labs.jboss.com/jbossas/downloads`\
  \ 下载 JBoss 4.0 应用服务器 ZIP 文件，并通过将 ZIP 文件解压到目录中来安装 JBoss 服务器。在本章中，您将学习如何执行以下操作：\n\n\
  - 从 JDeveloper 部署 Web 应用程序到 JBoss 应用服务器\n- 部署 JDBC 4.0 版本的 Web 应用程序到 JBoss 服务器\n\
  - 使用 JDBC 4.0 驱动程序配置 JBoss 服务器以使用 Oracle 数据库 10g\n- 使用 JDBC 4.0 驱动程序配置 JBoss 服务器以使用\
  \ MySQL 数据库\n- 使用 JDBC 4.0 驱动程序配置 JBoss 服务器以使用 PostgreSQL 数据库服务器\n- 使用 JDBC 4.0\
  \ 驱动程序配置 JBoss 服务器以使用 DB2 UDB 数据库\n- 使用 JDBC 4.0 驱动程序配置 JBoss 服务器以使用 MS SQL Server\n\
  \n## 从 JDeveloper 部署 Web 应用程序到 JBoss\n\n在本节中，我们将从 JDeveloper IDE 创建 Web 应用程序并将其部署到\
  \ JBoss 应用服务器。JDeveloper 具有内置功能，可配置与 JBoss 应用服务器的连接，并将 Web 应用程序部署到服务器。首先，通过选择 文件\
  \ | 新建 在 JDeveloper 中创建应用程序。在“新建库”窗口中，在“类别”中选择“常规”，在“项目”中选择“应用程序”，然后单击“确定”。在“创建应用程序”窗口中，指定应用程序名称，然后单击“确定”按钮。在“创建项目”窗口中，指定项目名称，然后单击“确定”。应用程序和项目将被添加到应用程序导航器。接下来，要添加\
  \ JSP，请在应用程序导航器中选择项目节点，然后选择 文件 | 新建。在“新建库”窗口中，在“类别”中选择“Web 层 | JSP”，在“项目”中选择“JSP”，然后单击“确定”。“创建\
  \ JSP 向导”启动。现在，单击“下一步”。在“Web 应用程序”窗口中选择 J2EE 1.4，然后单击“确定”。在 JSP 文件窗口中指定文件名，然后单击“下一步”按钮。在“错误页面选项”窗口中选择默认设置，然后单击“下一步”。在“标签库”窗口中单击“下一步”。在“HTML\
  \ 选项”窗口中选择默认设置，然后单击“下一步”。在“完成”窗口中单击“完成”。现在，JSP 和 web.xml 将被添加到应用程序导航器。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_116_0.png)\n\
  \n接下来，使用以下 SQL 脚本在 MySQL 数据库中创建数据库表：\n\n```\n```sql\nCREATE TABLE Catalog( CatalogId\
  \ VARCHAR(25)\nPRIMARY KEY, Journal VARCHAR(25), Publisher VARCHAR(25),\n    Edition\
  \ VARCHAR(25), Title Varchar(45), Author Varchar(25));\nINSERT INTO Catalog VALUES('catalog1',\
  \ 'Oracle Magazine',\n'Oracle Publishing', 'Nov-Dec 2004', 'Database Resource Manager',\n\
  'Kimberly Floss');\nINSERT INTO Catalog VALUES('catalog2', 'Oracle Magazine', 'Oracle\n\
  Publishing', 'Nov-Dec 2004', 'From ADF UIX to JSP', 'Jonas Jacobi');\n```\n```\n\
  \n\n\n按照《Configuring JBoss Server with MySQL Database》部分所述，在 JBoss 应用服务器中配置与 MySQL\
  \ 数据库的连接。我们将在 catalog.jsp 中获取与 MySQL 数据库的连接。创建 InitialContext 对象，并使用 JNDI 查找在 JBoss\
  \ 应用服务器中配置的 MySQL 数据源创建 DataSource 对象。\n\n```\nInitialContext initialContext = new\
  \ InitialContext();\nDataSource ds = (DataSource)\ninitialContext.lookup(\"java:/MySqlDS\"\
  );\n```\n\n使用 getConnection() 方法从 DataSource 对象创建 Connection 对象，并使用 createStatement()\
  \ 方法从 Connection 对象创建 Statement 对象。使用 Statement 接口的 executeQuery() 方法在 Catalog 表上运行\
  \ SQL 查询。遍历 ResultSet 并创建 HTML 表格。catalog.jsp 文件如下所示：\n\n```\n<%@ page contentType=\"\
  text/html;charset=windows-1252\"%>\n<%@ page language=\"java\" import=\"java.sql.*,\
  \ javax.naming.*, javax.sql.*\" %>\n<%\nInitialContext initialContext = new InitialContext();\n\
  DataSource ds = (DataSource)\ninitialContext.lookup(\"java:/MySqlDS\");\njava.sql.Connection\
  \ connection = ds.getConnection();\nStatement stmt=connection.createStatement();\n\
  ResultSet resultSet=stmt.executeQuery(\"Select * from Catalog\");\n%>\n<table border=\"\
  1\" cellspacing=\"0\">\n<tr>\n<th>CatalogId</th>\n<th>Journal</th>\n<th>Publisher</th>\n\
  <th>Edition</th>\n<th>Title</th>\n<th>Author</th>\n</tr>\n<%\nwhile (resultSet.next())\n\
  {\n%>\n<tr>\n<td><%=out.println(resultSet.getString(1));%></td>\n<td><%=out.println(resultSet.getString(2));%></td>\n\
  <td><%=out.println(resultSet.getString(3));%></td>\n<td><%=out.println(resultSet.getString(4));%></td>\n\
  <td><%=out.println(resultSet.getString(5));%></td>\n<td><%=out.println(resultSet.getString(6));%></td>\n\
  </tr>\n<%\n}\n%>\n</table>\n<%\nresultSet.close();\nstmt.close();\nif(!connection.isClosed())\n\
  \    connection.close();\n%>\n```\n\n## 在 JBoss 应用服务器中配置 JDBC\n\n我们将在 JDeveloper\
  \ 中配置与 JBoss 应用服务器的连接。选择 **连接** 选项卡，在 Connections 导航器中，右键单击 **应用服务器** 节点并选择 **新建应用服务器连接**。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_118_0.png)\n\n在创建应用服务器连接向导中，单击 Next 按钮。在\
  \ Type 窗口中指定连接名称，将连接类型选择为 JBoss 4.0.x，然后单击 Next。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_119_0.png)\n\
  \n在 JBoss 目录窗口中，指定 JBoss 应用服务器的部署目录，然后单击 Next。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_119_1.png)\n\
  \n## 在 JBoss 应用服务器中配置 JDBC\n\n在 Finish 窗口中单击 Finish。JBossConnection 节点将被添加到 Connections\
  \ 导航器中的 Application Server 节点。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_120_0.png)\n\
  \n我们将把创建的 Web 应用程序部署到 JBoss 应用服务器。首先，为了为 Web 应用程序创建部署配置文件，选择 File | New。在 New Gallery\
  \ 窗口中，在 Categories 中选择 General | Deployment Profiles，在 Items 中选择 WAR File，然后单击 OK。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_120_1.png)\n\n在 **创建部署配置文件** 窗口中指定部署配置文件名称并单击\
  \ **确定**。在 **WAR 部署配置文件属性** 窗口中指定 J2EE Web 上下文根并单击 **确定**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_121_0.png)\n\
  \n## 在 JBoss 应用服务器中配置 JDBC\n\nWeb 应用程序的部署配置文件将被添加到 **应用程序导航器**。我们之前已配置了与 JBoss 应用服务器的连接。因此，接下来将部署配置文件部署到\
  \ JBoss 应用服务器。右键单击部署配置文件，选择 **部署到 | JBossConnection**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_122_0.png)\n\
  \nWeb 应用程序将被部署到 JBoss 应用服务器。如果尚未执行，请使用 `C:\\JBoss\\jboss-4.0.5.GA\\bin\\run` 批处理脚本启动\
  \ JBoss 应用服务器。使用 URL `http://localhost:8080/jboss/catalog.jsp` 运行 `catalog.jsp`。使用\
  \ JBoss 应用服务器中配置的 JNDI 数据源建立与 MySQL 数据库的连接，并为 `catalog.jsp` 显示 HTML 表格：\n\n| 目录ID\
  \ | 期刊 | 出版社 | 版本 | 标题 | 作者 |\n|---|---|---|---|---|---|\n| catalog1 | Oracle Magazine\
  \ | Oracle Publishing | Nov-Dec 2004 | Database Resource Manager | Kimberly Floss\
  \ |\n| catalog2 | Oracle Magazine | Oracle Publishing | Nov-Dec 2004 | From ADF\
  \ UIX to JSF | Jonas Jacobi |\n\n## JDBC 4.0 版本\n\nJBoss 应用服务器 4 不支持 JDBC 4.0。当为\
  \ JDBC 4.0 添加支持时，我们将能够使用 JDBC 4.0 中的新功能。JDBC 4.0 支持连接跟踪以关闭不可用的连接。连接跟踪由连接池管理器使用 Connection\
  \ 接口的 isValid() 方法实现。如果连接池管理器检测到连接无效，则关闭该连接，从而减少不可用连接的积累，这些连接会阻碍连接池性能。对于 Connection\
  \ 对象 conn，连接跟踪实现如下：\n\n```\nif (!connection.isValid())\n    connection.close();\n\
  ```\n\nMySQL Connector/J 5.1 驱动程序支持包装器模式，该模式在 Wrapper 接口中实现。MySQL 特定的 JDBC API 扩展包含供应商特定的方法，可以使用包装器模式访问。MySQL\
  \ 对 JDBC API 的扩展位于 com.mysql.jdbc 包中。它提供了 com.mysql.jdbc.Connection 接口作为 java.sql.Connection\
  \ 接口的扩展。使用 isWrapperFor() 方法检查 java.sql.Connection 对象是否为 com.mysql.jdbc.Connection\
  \ 接口的包装器，以解包 com.mysql.jdbc.Connection 资源并获取实现该接口的对象。如果 java.sql.Connection 对象是包装器，则使用\
  \ unwrap() 方法解包 Connection 接口的 MySQL 扩展，并创建 com.mysql.jdbc.Connection 类型的对象。\n\n\
  ```\nClass clazz = Class.forName(\"com.mysql.jdbc.Connection\");\nif (connection.isWrapperFor(clazz))\
  \ {\ncom.mysql.jdbc.Connection conn= (com.mysql.jdbc.Connection)connection.unwrap(clazz);\n\
  }\n```\n\nJDBC 4.0 中用于连接管理的另一个新功能是能够在 Connection 对象上设置客户端信息属性。因此，如果连接池由于某些连接过度使用\
  \ CPU 而导致性能下降，连接池管理器能够识别出导致 CPU 过度使用的连接并关闭这些连接。为了设置和获取客户端信息属性，Connection 接口提供了 setClientInfo()\
  \ 和 getClientInfo() 方法。例如，设置 ApplicationName、ClientUser 和 ClientHostname 客户端信息属性：\n\
  \n```\nconn.setClientInfo(\"ApplicationName\",\"JBossApp\");\nconn.setClientInfo(\"\
  ClientUser\",\"JBossUser\");\nconn.setClientInfo(\"ClientHostname\",\"JBossHost\"\
  );\n```\n\nMySQL 对 Connection 接口的扩展提供了 clientPrepareStatement() 方法，可用于创建客户端预编译语句并运行\
  \ SQL 查询。\n\n```\nString sql=\"SELECT CATALOGID, JOURNAL, PUBLISHER, EDITION, TITLE,\n\
  \    AUTHOR from Catalog WHERE CATALOGID=?\";\nPreparedStatement pstmt=conn.clientPrepareStatement(sql);\n\
  ```\n\n预编译语句是可使用不同参数值运行的预编译 SQL 语句。预编译语句由于逻辑和数据的分离而降低了 SQL 注入的风险，并且还提高了性能。预编译语句分为服务器端预编译语句或客户端预编译语句。对于服务器端预编译语句，在接收到\
  \ SQL 语句时，数据库会解析该语句，检查语法错误，为语句准备执行计划并运行语句。当数据库再次接收到同一语句时，它会使用之前准备好的语句和相同的执行计划来运行语句。如果要使用不同的参数多次运行语句，使用预编译语句是有利的。预编译语句仅由数据库服务器编译一次，并使用不同的参数值多次运行。\n\
  \n预编译语句的优点是由于速度提高和 CPU 负载降低而性能更好。此外，数据库服务器使用相同的编译语句和执行计划。如果数据库服务器不支持服务器端预编译语句，与\
  \ MySQL 数据库（4.1 之前的版本）相同，则预编译语句可以由驱动程序模拟。这些称为客户端预编译语句。\n\nMySQL 的 Connector/J 5.1\
  \ 驱动程序提供增强的链式异常支持。可以使用 J2SE 6.0 中引入的 For-Each 循环检索链接到 SQLException 的异常和异常的原因。在 catalog.jsp\
  \ 中指定错误页面：\n\n```\n<%@ page errorPage=\"errorpage.jsp\" %>\n```\n\n在错误页面中使用 For-Each\
  \ 循环输出链式异常和链式原因。\n\n```\n<%@ page isErrorPage=\"true\" %>\n<%\nfor( Throwable e\
  \ : exception )\n{\n    out.println(\"Error encountered: \" + e);\n}\n%>\n```\n\n\
  部署到 JBoss 的 catalog.jsp 的 JDBC 4.0 版本如下所示：\n\n```\n<%@ page contentType=\"text/html;charset=windows-1252\"\
  %>\n<%@ page language=\"java\" import=\"java.sql.*, javax.naming.*, javax.sql.*,oracle.jdbc.*\"\
  \ %>\n<%@ page errorPage=\"errorpage.jsp\" %>\n<%\nInitialContext initialContext\
  \ = new InitialContext();\nDataSource ds = (DataSource)\ninitialContext.lookup(\"\
  java:/MySqlDS\");\njava.sql.Connection connection = ds.getConnection();\nconnection.setClientInfo(\"\
  ApplicationName\",\"JBossApp\");\nconnection.setClientInfo(\"ClientUser\",\"JBossUser\"\
  );\nconnection.setClientInfo(\"ClientHostname\",\"JBossHost\");\nClass clazz = Class.forName(\"\
  com.mysql.jdbc.Connection\");\nif(connection.isWrapperFor(clazz))\n{\ncom.mysql.jdbc.Connection\
  \ conn=\n(com.mysql.jdbc.Connection)connection.unwrap(clazz);\nconn.setClientInfo(\"\
  ApplicationName\",\"JBossApp\");\nconn.setClientInfo(\"ClientUser\",\"JBossUser\"\
  );\nconn.setClientInfo(\"ClientHostname\",\"JBossHost\");\nString sql=\"SELECT CATALOGID,\
  \ JOURNAL, PUBLISHER, EDITION, TITLE,\nAUTHOR from Catalog WHERE CATALOGID=?\";\n\
  PreparedStatement pstmt=conn.clientPrepareStatement(sql);\npstmt.setString(1, \"\
  catalog1\");\nResultSet rs=pstmt.executeQuery();\n%>\n<table border=\"1\" cellspacing=\"\
  0\">\n<tr>\n<th>Catalog Id</th>\n<th>Journal</th>\n<th>Publisher</th>\n<th>Edition</th>\n\
  <th>Title</th>\n<th>Author</th>\n</tr>\n<%\nwhile (rs.next())\n{\n%>\n<tr>\n<td><%=\
  \ rs.getString(1) %></td>\n<td><%= rs.getString(2) %></td>\n<td><%= rs.getString(3)\
  \ %></td>\n<td><%= rs.getString(4) %></td>\n<td><%= rs.getString(5) %></td>\n<td><%=\
  \ rs.getString(6) %></td>\n</tr>\n<%\n}\n%>\n</table>\n<%\nrs.close();\npstmt.close();\n\
  if(!connection.isClosed())\n  connection.close();\n}\n%>\n```\n\n## 用于 EJB 的 JBoss\
  \ 部署描述符\n\n我们需要配置一些 EJB 配置文件，以便在 EJB 中使用 JBoss 应用服务器数据源。standardjaws.xml 配置文件代表\
  \ JBossCMP 引擎。它包含默认数据源的 JNDI 名称、jdbc-sql 映射以及 CMP 实体 Bean 设置。改用 jaws.xml 文件以使用自定义配置来映射容器托管持久性\
  \ (CMP) 实体 EJB。在这两种情况下，文件都会复制到 EJB.jar 文件的 META-INF 目录中。standardjaws.xml 和 jaws.xml\
  \ 配置文件执行以下操作：\n\n- 1. 指定数据源及其类型映射\n- 2. 指定表的构建或使用方式\n- 3. 定义用于访问实体 Bean 的查找方法\n\
  - 4. 定义类型映射\n\n数据源是 Java 命名和目录接口 (JNDI) 对象，用于从连接池获取到数据库的连接。Hypersonic Database 是\
  \ JBoss 4.0 配置的默认数据源。您需要修改 jaws.xml 或 standardjaws.xml 以使用 CMP 实体 EJB 的其他数据库。\n\n\
  standardjbosscmp-jdbc.xml 配置文件是配置 JBoss CMP 容器的标准部署描述符。它可以用名为 jboss cmp-jdbc.xml\
  \ 的自定义配置版本替换，并放置在 EJB.jar 文件的 META-INF 目录中。JBoss 4.0 默认设置为 Hypersonic Database。我们需要编辑此文件以使用其他数据库。以下各节中的文件路径如果为相对路径，则相对于\
  \ JBoss 安装目录。\n\n## 配置 JBoss 服务器以使用 Oracle 数据库\n\nOracle 是一款领先的企业数据库，以其性能和可靠性著称。要将\
  \ JBoss 4.0 与 Oracle 集成，我们需要将 Oracle 的驱动类放入 JBoss 应用服务器的运行时类路径中。将 Oracle 数据库 11g\
  \ JDBC 4.0 驱动的 JAR 文件 ojdbc6.jar 复制到 C:\\JBoss\\jboss-4.0.5.GA\\server\\default\\\
  lib 目录。我们还需要将 JAVA_HOME 环境变量设置为 JDK 6.0。\n\n要使用 Oracle 的事务性 (XA) 数据源，请将 /docs/examples/jca/oracle-xa-ds.xml\
  \ 复制到 /server/default/deploy 目录。目录路径相对于 JBoss 应用服务器安装目录。要使用非 XA 数据源进行配置，请将 /docs/examples/jca/oracle-ds.xml\
  \ 复制到 /server/default/deploy 目录并修改 oracle-ds.xml 配置文件。Oracle 的 <driver-class/> 和\
  \ <connection-url/> 设置会因所使用的驱动类型而异。Oracle 的 <driver-class/> 和 <connection-url/>\
  \ 设置列在下表中：\n\n| 驱动类型 | 驱动类 | 连接 URL |\n|---|---|---|\n| Oracle OCI 类型 2 驱动 | oracle.jdbc.OracleDriver\
  \ | jdbc:oracle:oci:@<database> |\n| Oracle Thin 类型 4 驱动 | oracle.jdbc.OracleDriver\
  \ | jdbc:oracle:thin:@<host>:<port>:<database> |\n| Oracle OCI XA 类型 4 驱动 | oracle.jdbc.xa.client.OracleXADatasource\
  \ | jdbc:oracle:oci:@<database> |\n| Oracle Thin XA 类型 4 驱动 | oracle.jdbc.xa.client.OracleXADatasource\
  \ | jdbc:oracle:thin:@<host>:<port>:<database> |\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_127_0.png)\n\
  \n> 在连接 URL 设置中，<host> 是在 <Oracle10g>/network/ADMIN/tnsnames.ora 文件中指定的 HOST 值，<port>\
  \ 是在 tnsnames.ora 文件中指定的 PORT 值，而 <database> 是数据库名称。<Oracle10g> 是 Oracle 数据库安装的目录。\n\
  \n最后，我们需要修改 \\server\\default\\conf\\login-config.xml 以使用 Oracle。将以下 <application-policy>\
  \ 元素添加到 login-config.xml 中：\n\n```\n<application-policy name = \"OracleDbRealm\"\
  >\n    <authentication>\n        <login-module code = \"org.jboss.resource.security.ConfiguredIdentityLoginModule\"\
  \ flag = \"required\">\n            <module-option name = \"principal\"></module-option>\n\
  \            <module-option name = \"userName\">OE</module-option>\n           \
  \ <module-option name = \"password\">pw</module-option>\n            <module-option\
  \ name = \"managedConnectionFactoryName\">jboss.jca:service=LocalTxCM,name=OracleDS</module-option>\n\
  \        </login-module>\n    </authentication>\n</application-policy>\n```\n\n\
  这将 JBoss 应用服务器配置为使用 Oracle 数据库。要使用 Oracle 数据源的 CMP 实体 EJB，需要进行一些额外的修改。修改 standardjbosscmp-jdbc.xml\
  \ 或 jboss cmp-jdbc.xml 配置文件，设置 <datasource> 和 <datasource-mapping> 元素以使用 Oracle。\n\
  \n```\n<jboss cmp-jdbc>\n<defaults>\n<datasource>java:/OracleDS</datasource>\n<datasource-mapping>Oracle9i</datasource-mapping>\n\
  </defaults>\n</jboss cmp-jdbc>\n```\n\n修改 standardjaws.xml 或 jaws.xml 配置文件，设置 <datasource>\
  \ 和 <type-mapping> 元素：\n\n```\n<jaws>\n<datasource>java:/OracleDS</datasource>\n\
  <type-mapping>Oracle9i</type-mapping>\n</jaws>\n```\n\n修改 oracle-ds.xml、standardjaws.xml、standardjboss\
  \ cmp-jdbc.xml 和 login-config.xml 文件可将 JBoss 4.0 服务器配置为与 Oracle 数据库一起使用。\n\n## 配置\
  \ JBoss 服务器以使用 MySQL 数据库\n\nMySQL 是一款开源数据库，被许多开源项目和小型组织使用。要使用 JBoss 4.0 与 MySQL，我们必须将\
  \ MySQL 驱动类放入 JBoss 应用服务器的运行时类路径中，并将 MySQL Connector/J 5.1 驱动 JAR 文件复制到 C:\\JBoss\\\
  jboss-4.0.5.GA\\server\\default\\lib 目录。MySQL Connector/J 5.1 驱动支持 JDBC 4.0，可从 http://dev.mysql.com/downloads/connector/j/5.1.html\
  \ 获取。我们还需要将 JAVA_HOME 环境变量设置为 JDK 6.0。\n\n要使用 MySQL 数据源，请将 /docs/examples/jca/mysql-ds.xml\
  \ 复制到 /server/default/deploy 目录。通过将 <driver-class/> 设置为 com.mysql.jdbc.Driver 并将\
  \ <connection-url/> 设置为 jdbc:mysql://localhost:3306/test 来修改 mysql-ds.xml 配置文件。\n\
  \n最后，使用 MySQL 数据库设置修改 server/default/conf/login-config.xml 并将以下 <application-policy/>\
  \ 元素添加到 \\server\\default\\conf\\login-config.xml：\n\n```\n<application-policy name\
  \ = \"MySqlDbRealm\">\n    <authentication>\n        <login-module code = \"org.jboss.resource.security.ConfiguredIdentityLoginModule\"\
  \ flag = \"required\">\n            <module-option name =\"principal\"></module-option>\n\
  \            <module-option name =\"userName\">root</module-option>\n          \
  \  <module-option name =\"password\"></module-option>\n            <module-option\
  \ name =\"managedConnectionFactoryName\">jboss.jca:service=LocalTxCM,name=MySqlDS</module-option>\n\
  \        </login-module>\n    </authentication>\n</application-policy>\n```\n\n\
  上述 <application-policy/> 元素将 JBoss 服务器配置为使用 MySQL 数据库。本章示例应用程序不需要以下使用 MySQL 数据库的\
  \ JBoss 配置。要使用 MySQL 数据源的 CMP 实体 EJB，需要进行一些额外的修改。在 standardjbosscmp-jdbc.xml 或 jboss\
  \ cmp-jdbc.xml 文件中设置 <datasource> 和 <datasource-mapping> 元素。\n\n```\n<jboss cmp-jdbc>\n\
  \    <defaults>\n        <datasource>java:/MySqlDS</datasource>\n        <datasource-mapping>mySQL</datasource-mapping>\n\
  \    </defaults>\n</jboss cmp-jdbc>\n```\n\n我们还必须在 standardjaws.xml 或 jaws.xml 文件中设置\
  \ <datasource> 和 <type-mapping> 元素。\n\n```\n<jaws>\n    <datasource>java:/MySqlDS</datasource>\n\
  \    <type-mapping>mySQL</type-mapping>\n</jaws>\n```\n\n修改 mysql-ds.xml、standardjaws.xml、standardjboss\
  \ cmp-jdbc.xml 和 login-config.xml 文件可将 JBoss 4.0 服务器配置为与 MySQL 数据库一起使用。\n\n\n\n\
  ## 配置 JBoss 服务器以使用 PostgreSQL 数据库\n\nPostgreSQL 数据库是最常用的开源关系型数据库之一。第一步是将数据库驱动类放入\
  \ JBoss 应用服务器的运行时类路径中。PostgreSQL 数据库的 JDBC 4.0 驱动程序可从 http://jdbc.postgresql.org/download.html\
  \ 获取。将 PostgreSQL 驱动 JAR 文件 postgresql-8.2-507.jdbc4.jar 复制到 JBoss 安装的 /server/default/lib\
  \ 目录。我们还需要将 JAVA_HOME 环境变量设置为 JDK 6.0，然后通过将 /docs/examples/jca/postgres-ds.xml 复制到\
  \ /server/default/deploy 目录来使用其数据源。\n\n通过将 <driver-class/> 设置为 org.postgresql.Driver\
  \ 并将 <connection-url/> 设置为 jdbc:postgresql://localhost:5432/postgres 来修改 postgres-ds.xml\
  \ 配置文件。\n\n最后，修改 \\server\\default\\conf\\login-config.xml 以使用 PostgreSQL 数据库，并将以下\
  \ <application-policy/> 元素添加到文件中：\n\n```\n<application-policy name = \"PostgreSQLDbRealm\"\
  >\n    <authentication>\n        <login-module code = \"org.jboss.resource.security.ConfiguredIdentityLoginModule\"\
  \n        flag = \"required\">\n            <module-option name =\"principal\"></module-option>\n\
  \            <module-option name = \"userName\">sac</module-option>\n          \
  \  <module-option name = \"password\">pw</module-option>\n            <module-option\
  \ name = \"managedConnectionFactoryName\">\n            jboss.jca.service=LocalTxCM,name=PostgreSQLDS</module-option>\n\
  \        </login-module>\n    </authentication>\n</application-policy>\n```\n\n\
  上面的 <application-policy/> 元素将 JBoss 应用服务器配置为使用 PostgreSQL 数据库。如果 CMP 实体 EJB 需要访问\
  \ PostgreSQL 数据源，则需要进行一些额外的修改。修改 standardjbosscmp-jdbc.xml 或 jbosscmp-jdbc.xml 以设置\
  \ <datasource> 和 <datasource-mapping> 元素。\n\n```\n<jboss-cmp-jdbc>\n    <defaults>\n\
  \        <datasource>java:/PostgreSQLDS</datasource>\n        <datasource-mapping>PostgreSQL</datasource-mapping>\n\
  \    </defaults>\n</jboss-cmp-jdbc>\n```\n\n我们还必须修改 standardjaws.xml 或 jaws.xml\
  \ 以设置 <datasource> 和 <type-mapping> 元素。\n\n```\n<jaws>\n    <datasource>java:/PostgreSQLDS</datasource>\n\
  \    <type-mapping>PostgreSQL</type-mapping>\n</jaws>\n```\n\n通过修改 postgres-ds.xml、standardjaws.xml、standardjbosscmp-jdbc.xml\
  \ 和 login-config.xml，JBoss 4.0 服务器被配置为与 PostgreSQL 数据库一起使用。\n\n## 配置 JBoss 服务器以使用\
  \ DB2 数据库\n\nIBM 的 DB2 Universal Database 是一款功能齐全、健壮、可扩展且易于使用的数据库服务器，可在 Linux、UNIX\
  \ 和 Windows 平台上使用。首先将其驱动程序添加到 JBoss 应用服务器的运行时类路径中。IBM Data Server Driver for JDBC\
  \ and SQLJ 版本 4.0 支持 JDBC 4.0，可从 https://www14.software.ibm.com/webapp/iwm/web/reg/download.do?source=swg-informixfpd&S_PKG=dl&lang=en_US&cp=UTF-8#\
  \ 下载。为了实现 JDBC 4.0 功能，将 db2jcc4.jar 添加到 JBoss 安装的 /server/default/lib 目录。要使用 JDBC\
  \ 4.0 功能，将 JAVA_HOME 环境变量设置为 JDK 6.0。将 /docs/examples/jca/db2-ds.xml 复制到 /server/default/deploy\
  \ 目录以配置 JBoss 服务器使用 DB2 数据源。\n\n接下来，通过将 <driver-class/> 设置为 com.ibm.db2.jcc.DB2Driver\
  \ 并将 <connection-url/> 设置为 jdbc:db2://localhost:50000/database 来修改 db2-ds.xml 配置文件，其中\
  \ DB2 为数据库名称。最后，将以下 <application-policy/> 元素添加到 \\server\\default\\conf\\login-config.xml：\n\
  \n```\n<application-policy name = \"DB2DbRealm\">\n    <authentication>\n      \
  \  <login-module code = \"org.jboss.resource.security.ConfiguredIdentityLoginModule\"\
  \ flag = \"required\">\n            <module-option name = \"principal\">sa</module-option>\n\
  \            <module-option name = \"userName\">sa</module-option>\n           \
  \ <module-option name = \"password\">pw</module-option>\n            <module-option\
  \ name = \"managedConnectionFactoryName\">jboss.jca:service=LocalTxCM,name=DB2DS</module-option>\n\
  \        </login-module>\n    </authentication>\n</application-policy>\n```\n\n\
  此 <application-policy/> 元素将 JBoss 应用服务器配置为使用 DB2 数据库。如果需要从 CMP 实体 EJB 访问 DB2 数据库，则需要进行额外的修改。按如下方式修改\
  \ standardjbosscmp-jdbc.xml 或 jbosscmp-jdbc.xml：\n\n```\n<jboss-cmp-jdbc>\n    <defaults>\n\
  \        <datasource>java:/DB2DS</datasource>\n        <datasource-mapping>DB2</datasource-mapping>\n\
  \    </defaults>\n</jboss-cmp-jdbc>\n```\n\n我们还必须修改 standardjaws.xml 或 jaws.xml\
  \ 以设置 <datasource> 和 <type-mapping>。\n\n```\n<jaws>\n    <datasource>java:/DB2DS</datasource>\n\
  \    <type-mapping>DB2</type-mapping>\n</jaws>\n```\n\n上述配置更改使我们能够将 DB2 与 JBoss\
  \ 一起使用。\n\n## 配置 JBoss 服务器以使用 SQL Server\n\nSQL Server 是构建、部署和管理企业应用程序的综合数据管理和分析解决方案。在本节中，我们将配置\
  \ JBoss 应用服务器以使用 SQL Server 2000 和 SQL Server 2005。像对其他数据库一样，将 SQL Server JDBC 4.0\
  \ JAR 文件复制到 JBoss 服务器。I-net 软件的 Merlia JDBC 驱动程序支持 JDBC 4.0，其中 Merlia 驱动程序 ZIP 文件\
  \ Merlia_Trial_7.02.zip 可从 http://www.inetsoftware.de/products/jdbc/mssql/merlia/\
  \ 获取。将 Merlia ZIP 文件解压到一个目录，将 Merlia.jar 添加到 JBoss 安装的 /server/default/lib 目录，并将\
  \ JAVA_HOME 环境变量设置为 JDK 6.0。我们还必须将 SQL Server 数据源文件复制到 JBoss 服务器部署目录。将 docs\\examples\\\
  jca\\mssql-ds.xml 用于非事务性数据源，或将 \\docs\\examples\\jca\\mssql-xa-ds.xml 用于事务性数据源复制到\
  \ \\server\\default\\deploy 目录。\n\n修改 mssql-ds.xml 配置文件以设置驱动程序类和连接 URL，并将 <driver-class/>\
  \ 指定为 com.inet.tds.TdsDriver。对于 SQL Server 2000，将 <connection-url/> 指定为 jdbc:inetdae7:localhost:1433；对于\
  \ SQL Server 2005，将 <connection-url/> 指定为 jdbc:inetdae7:localhost:port。SQL Server\
  \ 2005 的可变端口号可从 SQL Server 配置管理器获得。在 **the SQL Server Configuration Manager** 中选择\
  \ SQLEXPRESS 节点的 **SQL Server 2005 Network Configuration | Protocols**。右键单击 **TCP/IP**\
  \ 节点，选择属性，然后选择 **IP Addresses** 选项卡。在 **IP ALL** 中，TCP 动态端口指定 SQL Server 2005 的端口。SQL\
  \ Server 2005 的端口号在服务器重新启动时会发生变化。\n\n最后，我们必须将以下 `<application-policy/>` 元素添加到 `\\\
  server\\default\\conf\\login-config.xml`：\n\n```\n<application-policy name = \"\
  SQLServerRealm\">\n    <authentication>\n        <login-module code = \"org.jboss.resource.security.ConfiguredIdentityLoginModule\"\
  \ flag = \"required\">\n            <module-option name = \"principal\"></module-option>\n\
  \            <module-option name = \"userName\">sa</module-option>\n           \
  \ <module-option name = \"password\">pw</module-option>\n            <module-option\
  \ name = \"managedConnectionFactoryName\">jboss.jca:service=LocalTxCM,name=MSSQLDS</module-option>\n\
  \        </login-module>\n    </authentication>\n</application-policy>\n```\n\n\
  上面的 `<application-policy/>` 元素将 SQL Server 数据库配置为与 JBoss 应用服务器一起使用。如果将 CMP 实体 EJB\
  \ 部署到 JBoss 并访问 SQL Server，则必须修改 standardjbosscmp-jdbc.xml 或 jbosscmp-jdbc.xml 以及\
  \ standardjaws.xml 或 jaws.xml 配置文件。按如下方式设置 standardjbosscmp-jdbc.xml 或 jbosscmp-jdbc.xml\
  \ 的 `<datasource>` 和 `<datasource-mapping>` 元素：\n\n```\n<jboss-cmp-jdbc>\n    <defaults>\n\
  \        <datasource>java:/MSSQLDS</datasource>\n        <datasource-mapping>MS\
  \ SQLSERVER</datasource-mapping>\n    </defaults>\n</jboss-cmp-jdbc>\n```\n\n按如下方式设置\
  \ standardjaws.xml 或 jaws.xml 中的 `<datasource>` 和 `<type-mapping>` 元素：\n\n```\n\
  <jaws>\n    <datasource>java:/MSSQLDS</datasource>\n    <type-mapping>MS SQLSERVER</type-mapping>\n\
  </jaws>\n```\n\n\n\n对于 SQL Server 2000，将数据源映射或类型映射设置为 MS SQLSERVER2000。这些配置更改允许将\
  \ JBoss 与 SQL Server 数据库进行配置。\n\n## 摘要\n\nJBoss 4.0 服务器默认配置为使用 Hypersonic 数据库。然而，只需更改几个配置文件即可使用多种流行数据库中的任意一种。在本章中，我们已将\
  \ JBoss 应用服务器配置为使用 Oracle 数据库、MySQL 数据库服务器、PostgreSQL 数据库服务器、MS SQL Server 数据库和\
  \ DB2 UDB 数据库。\n"
- "## 5 在 WebLogic Server 中配置 JDBC\n\nWebLogic Server 使用数据源提供数据库连接。**数据源**是一个数据库连接池，可以从中获取连接。数据源可以单独配置或与其他数据源组合，例如多数据源。**多数据源**就像一个数据源池，配置为在数据库管理系统之间提供**故障转移**和**负载均衡**。数据源使用\
  \ JNDI 绑定进行配置。`DataSource` 对象表示一个数据源，可使用 JNDI 查找获得。可使用 `DataSource` 对象的 `getConnection()`\
  \ 方法获得 `Connection` 对象。WebLogic Server 提供管理控制台来配置数据源。WebLogic Server 9.x 和 10.x\
  \ 包含 Type 4 JDBC 驱动程序，它们是 DataDirect 驱动程序的 OEM 品牌版本，适用于 DB2、Informix、MS SQL Server、Sybase\
  \ 和 Oracle 数据库。它还包含来自 Sybase 和 Oracle 的 DBMS 厂商驱动程序。通过将 JAR 文件包含在服务器类路径中，可将其他数据库的\
  \ JDBC 驱动程序合并到服务器中。\n\nWebLogic Server 9.0 中的新 JDBC 功能包括对 JDBC 3.0 的支持、数据源的多个 JNDI\
  \ 名称以及 **Logging Last Resource 事务**选项。SQL 语句超时已添加到连接池配置中。`SecondsToTrustAnIdlePoolConnection`\
  \ 和 `PinnedToThread` 连接池属性已添加以提高数据源性能，这将在本章后面讨论。多数据源故障转移功能已得到改进。已为其性能诊断向不同连接参数添加了统计信息收集。在\
  \ WebLogic Server 9.1 中，已向 WebLogic Type 4 JDBC 驱动程序添加了新功能，并且还添加了基于身份的连接池。已向管理添加了事务、诊断和安全选项卡以配置数据源。WebLogic\
  \ Server 9.2 已添加对 BEA WebLogic Type 4 JDBC MS SQL Server 驱动程序的支持。WebLogic Server\
  \ 10.3 支持 JDBC 4.0，但它是技术预览版，不支持 JDBC 4.0 的所有功能。\n\n在本章中，您将学习如何：\n\n- 在 WebLogic\
  \ Server 中创建数据源。\n- 为数据源配置连接池属性。\n- 在 WebLogic Server 中创建多数据源。\n- 性能调优 WebLogic\
  \ Server 连接。\n- 从 JDeveloper 部署 Web 应用程序到 WebLogic Server。\n- Web 应用程序的 JDBC 4.0\
  \ 版本。\n\n### 设置环境\n\n安装需要 JDBC 连接的数据库。安装数据库的步骤在第 1 章中讨论。如果 WebLogic 没有 DBMS 的驱动程序，请下载该数据库的\
  \ JDBC 驱动程序。我们将使用 Oracle 数据库 10g 配置 JDBC 连接。将 Oracle 数据库 JDBC 驱动程序 JAR 文件 `ojdbc14.jar`\
  \ 从 `<Oracle>\\jdbc\\lib` 目录复制到 `<weblogic91>\\samples\\domains\\wl_server\\lib`\
  \ 目录，`<Oracle>` 为 Oracle 数据库 10g 安装目录，`<weblogic91>` 为 WebLogic Server 9.1 安装目录。服务器\
  \ `lib` 目录中的 JAR 文件在服务器启动时会自动添加到类路径中。如果需要更高版本，请在 `lib` 目录中替换它。或者，您可以编辑 `<weblogic91>\\\
  samples\\domains\\wl_server\\bin\\startWebLogic` 脚本，通过向脚本构建的类路径参数添加驱动程序 JAR 文件。将\
  \ JAR 文件放在类路径中 `weblogic.jar` 之前。双击 `<weblogic91>\\samples\\domains\\wl_server\\\
  startWebLogicEx` 命令脚本以启动 WebLogic 示例服务器。\n\n### 创建数据源\n\n数据源是一个 JDBC 连接池，可以使用 `DataSource`\
  \ 对象的 `getConnection()` 方法从中获取连接。在本节中，我们将在 WebLogic Server 管理控制台中创建一个数据源。使用 URL\
  \ `http://localhost:7001/console` 访问管理控制台，并在管理控制台中选择节点 **服务 | JDBC | 数据源**。\n\n\
  ![](img/553e44bc30e70d0d8e58278a7ece8da8_137_0.png)\n\n单击 Lock & Edit 以激活数据源页面按钮。要创建新的\
  \ JDBC 数据源，请在数据源表中单击 New。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_137_1.png)\n\
  \n在 **创建新的 JDBC 数据源** 窗口中，指定数据源名称和数据源的 **JNDI 名称**。数据源使用 JNDI 名称绑定到 JNDI 命名服务。选择\
  \ **数据库类型**，并使用 Oracle 数据库创建数据源。选择 Oracle 作为数据库类型，并选择 Oracle 的驱动程序（精简版）作为 **数据库驱动程序**，然后单击下一步。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_138_0.png)\n\n数据源可以配置为使用任何常用数据库。\nWebLogic\
  \ Server 为 DB2、Informix、Oracle、SQL Server 和 Sybase 提供来自 DataDirect 的 Type 4 JDBC\
  \ 驱动程序。BEA 品牌的 DataDirect、Sybase jConnect 和 Oracle 精简驱动程序已安装在 <weblogic9.1>/server/lib\
  \ 目录中。\nWebLogic Server 提供的不同 JDBC Type 4 驱动程序列在下表中：\n\n| 支持的数据库版本 | 驱动程序类 | 连接\
  \ URL |\n|---|---|---|\n| DB2 UDB 7.x、8.1 和 8.2 在 Linux、Unix 和 Windows 上。 | XA-weblogic.jdbcx.DB2DataSource.<br>非\
  \ XA- weblogic.jdbc.db2.DB2Driver. | jdbc:bea:db2://db2_server_name:port;<br>DatabaseName=\
  \ database |\n| Informix 9.4 及更高版本。 | XA- weblogic.jdbcx.informix.InformixDataSource.<br>非\
  \ XA- weblogic.jdbc.informix.InformixDriver. | jdbc:bea:informix://dserver1:1543;<br>informixServer=\
  \ dserver1;<br>databaseName= dbname |\n| MS SQL Server 7.0、SQL Server 2000(SP1、SP2\
  \ 和 SP3a) 和 SQL Server 2005。 | XA- weblogic.jdbcx.sqlserver.SQLServerDataSource.<br>非\
  \ XA- weblogic.jdbc.sqlserver.SQLServerDriver. | jdbc:bea:sqlserver://dserver:port\
  \ |\n| Oracle 9i（R1 和 R2）Oracle 10g。 | XA- weblogic.jdbcx.oracle.OracleDataSource.<br>非\
  \ XA- weblogic.jdbc.oracle.OracleDriver. | jdbc:bea:oracle://dserver:port |\n| Sybase\
  \ Adaptive Server 11.5、11.9、12.0、12.5、15。 | XA- weblogic.jdbcx.sybase.SybaseDataSource.<br>非\
  \ XA- weblogic.jdbc.Sybase.SybaseDriver. | jdbc:bea:sybase://dserver:port |\n\n\
  可以选中不包含 JDBC 驱动程序的数据库。如果选中此类驱动程序，请将驱动程序 zip 或 JAR 文件添加到 `startWebLogic` 脚本中的 `CLASSPATH`\
  \ 变量；否则将 JAR 或 zip 文件添加到服务器 `lib` 目录。通过指定“其他”，并手动将驱动程序类名输入到控制台，可以使用对 DBMS 的 JDBC\
  \ 驱动程序。任何 Type 4 JDBC 驱动程序都可以手动添加到 start-weblogic 脚本的类路径中，而无需放入服务器或 lib 目录：\n\n\
  ![](img/553e44bc30e70d0d8e58278a7ece8da8_140_0.png)\n\n在 **事务选项** 窗口中，指定数据源的事务属性。如果选择\
  \ XA 驱动程序，将自动使用两阶段提交事务协议支持全局事务。全局、分布式或 XA 事务是指涉及多个 DBMS 或资源并且需要 2 阶段提交协议以确保事务全部成功或全部失败的事务。全局事务由使用\
  \ JTA 的事务管理器管理。对于非 XA 数据源要支持全局事务，请选中 **全局事务** 复选框。选择支持全局事务的协议。不同的事务协议列在下表中：\n\n\
  | 事务协议 | 描述 |\n|---|---|\n| Logging Last Resource (LLR)。 | LLR 优化与 XA JDBC 驱动程序相比，对于插入、更新和删除操作提供了更好的性能。XA\
  \ 驱动程序对于读取操作提供了更好的性能。推荐使用两阶段提交。 |\n| 两阶段提交。 | 使用 JTA 模拟对全局事务的参与。 |\n| 一阶段提交。 | 这是默认设置。使用一阶段提交时，只能有一个资源参与全局事务。\
  \ |\n\n\n\n\n在“事务选项”页面中，单击下一步。在“连接属性”窗口中，将数据库名称指定为 ORCL。主机名为 localhost，端口为 1521，用户名为\
  \ OE。指定 OE 用户名的密码并单击下一步按钮：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_141_0.png)\n\
  \n在 **测试数据库连接** 窗口中，指定了 Oracle 数据库的驱动程序类名、连接 URL 和用户名。单击 **测试数据库配置** 以测试与数据库的连接：\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_142_0.png)\n\n显示一条消息，表明已建立连接。如果数据库未连接并显示错误消息，则单击\
  \ **下一步** 按钮。在 **选择目标** 窗口中，选择要部署数据源的服务器。要部署到示例服务器，请选择 `examplesServer`，然后单击 **完成**。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_142_1.png)\n\n数据源已配置并添加到 **数据源** 表中。数据源使用命名服务和目标服务器注册了\
  \ JNDI 名称，该数据源已部署并也在数据源表中列出：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_143_0.png)\n\
  \n通过单击 **激活更改** 按钮，使数据源可供服务器中的应用程序使用。在未选择 **激活更改** 或 **撤消所有更改** 按钮之前，Web 应用程序不会部署到\
  \ WebLogic 服务器。\n\n## 配置数据源\n\n将在上一节中创建的数据源进行配置。在数据源表中选择要配置的数据源，并选择 **配置** 选项卡，这是默认设置。在\
  \ **配置** 窗口中，可以修改数据源 JNDI 名称：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_143_1.png)\n\
  \n数据源的其他配置选项列在下表中：\n\n| 数据源设置 | 描述 |\n|---|---|\n| 行预取 | 行预取在一次服务器访问中从服务器向客户端获取多行，从而提高其性能。\
  \ |\n| 行预取大小 | 如果启用了行预取，请指定要获取的行数。要获取的行的最佳大小取决于查询。 |\n| 流块大小 | 指定用于流式传输数据类型的的数据块大小。\
  \ |\n\n选择 **连接池** 链接以配置与数据源关联的连接池。初始容量、最大容量和容量增量可在连接池配置中设置。**高级** 链接用于设置高级连接池属性。一些连接池设置列在下表中：\n\
  \n| 连接池设置 | 描述 |\n|---|---|\n| 初始容量 | 指定连接池中的初始连接数。它还指定连接池中可用连接的最小数量。 |\n| 最大容量\
  \ | 指定连接池中的最大连接数。 |\n| 容量增量 | 指定在一次连接增量中添加到连接池的连接数。 |\n| 语句缓存类型 | 指定用于缓存预编译语句的算法。如果值为\
  \ LRU，并且创建了新语句，则缓存中 **最近最少使用** 的语句将被替换。如果值为 FIXED，则首先填充缓存的语句将永久保留。 |\n| 测试保留时连接。\
  \ | 如果选中测试保留时连接复选框，则在将连接提供给客户端之前会对其进行测试。对于使用故障转移算法创建的多数据源中的连接池，需要进行测试。如果选择了测试保留时连接，则应指定测试表名。\
  \ |\n| 测试频率 | 指定以秒为单位测试连接池中未使用连接的间隔。如果测试失败，则关闭并重新打开连接。再次，如果测试失败，则关闭连接。如果指定测试频率大于\
  \ 0，则应指定测试表名。 |\n\n| 连接池设置 | 描述 |\n|---|---|\n| 测试表名 | 指定用于测试连接的数据库表。为提高测试效果，请指定一个没有行或只有几行的表。用于测试连接的\
  \ SQL 查询可以用以下方式指定：SQL <query>。 <query> 是用于测试数据库连接的查询。 |\n| 初始化 SQL | 指定用于初始化与数据库连接的\
  \ SQL 语句。SQL 语句的指定方式为：SQL <sql statement>。 <sql statement> 是用于测试连接的 SQL 语句。可以不指定字段开头的\
  \ 'SQL' 来指定数据库表。如果指定了数据库表，则使用 SQL 语句：\"SELECT count(*) from InitSQL\" 测试数据库连接。 |\n\
  | 收缩频率 | 指定使用预增量值减少连接池大小的等待时间。 |\n| 连接创建重试频率。 | 指定每次尝试与数据库建立连接之间的秒数。 |\n| 非活动连接超时。\
  \ | 指定未使用的连接返回到连接池的秒数。 |\n| 登录延迟。 | 指定建立与数据库连接的延迟秒数。它用于无法处理连续连接请求的数据库服务器。 |\n| 最大等待连接数\
  \ | 指定等待从连接池获取连接的连接请求的最大数量。 |\n| 连接保留超时 | 指定连接请求超时后的秒数。 |\n| 语句超时 | 指定语句超时后的秒数。\
  \ |\n\n可以使用 **事务** 链接配置事务协议设置。可以使用 **诊断** 链接收集监控统计信息。可以收集概要信息。一些数据源概要列在下表中：\n\n\
  | 配置文件 | 描述 |\n|---|---|\n| 配置文件连接使用 | 收集有关当前使用连接池中连接的线程的概要信息。 |\n| 配置文件连接保留等待 |\
  \ 收集有关当前等待从连接池保留连接的线程的概要信息。 |\n| 配置文件连接泄漏 | 收集有关从连接池保留连接并发生连接泄漏的线程的概要信息。 |\n\n|\
  \ 配置文件 | 描述 |\n|---|---|\n| 配置文件连接使用。 | 收集有关当前使用连接池中连接的线程的概要信息。 |\n| 配置文件连接保留失败。\
  \ | 收集有关未能从连接池保留连接的线程的概要信息。 |\n| 配置文件语句缓存条目。 | 收集有关添加到语句缓存的可调用语句和预编译语句以及创建这些语句的线程的概要信息。\
  \ |\n| 配置文件语句使用 | 收集有关当前执行语句缓存中语句的线程的概要信息。 |\n| 配置文件连接最后使用 | 收集有关最后使用连接池中连接的上一个线程的概要信息。\
  \ |\n| 配置文件连接多线程使用 | 收集有关错误使用先前由不同线程获取的连接的线程的概要信息。 |\n| 配置文件收获频率 | WebLogic Server\
  \ 收获概要数据的线程之间的间隔，以秒为单位。 |\n\n选择 **监控** 选项卡以监控数据源。选择 **控制** 选项卡以管理由数据源部署的 WebLogic\
  \ Server 实例。在已部署的服务器实例中，可以清除语句缓存，并可以挂起或关闭服务器。\n\n## 创建多数据源\n\n多数据源是一个提供故障转移和负载均衡的抽象数据源组。多数据源具有与数据源类似的\
  \ JNDI 绑定。要创建多数据源，请在管理控制台中单击 **服务** | **JDBC** | **多数据源** 链接：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_147_0.png)\n\
  \n在“多数据源”表中，单击“新建”按钮以创建新的多数据源。在“配置多数据源”窗口中，指定数据源名称和 JNDI 名称。选择算法类型为故障转移或负载均衡，然后单击“下一步”。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_147_1.png)\n\n在“**选择目标**”窗口中，通过将多数据源部署到其上，选择\
  \ **examplesServer** 或其他任何服务器，然后单击“下一步”。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_148_0.png)\n\
  \n在“**选择数据源类型**”窗口中，为 XA 数据源选择 XA 驱动程序，或为非 XA 数据源选择非 XA 驱动程序，然后单击“**下一步**”。由于我们使用非\
  \ XA JDBC 驱动程序创建了 Oracle 数据源，请选择非 XA 驱动程序。在“**添加数据源**”窗口中，将数据源从“**可用**”列表添加到“**已选**”列表。如果需要新的数据源，请单击“**创建新的数据源**”按钮，然后单击“**完成**”。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_148_1.png)\n\n新数据源已配置并添加到“**多数据源**”表。单击“**激活更改**”按钮以使数据源可供应用程序使用。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_149_0.png)\n\n可以通过选择多数据源链接来配置多数据源。部署多数据源的目标可以通过“**目标**”选项卡进行配置。多数据源中的数据源可以通过“**配置**”选项卡中的数据源链接进行配置。多数据源\
  \ JNDI 名称可以在“**配置 | 通用**”窗口中修改。“**算法类型**”指定用于选择获取连接的数据源的算法。如果算法类型为“**故障转移**”，连接请求始终发送到列表中的第一个数据源。如果第一个数据源与\
  \ DBMS 失去连接，则连接请求将依次发送到列表中的下一个数据源，直到获得连接或到达数据源列表末尾。如果算法类型为“**负载均衡**”，连接请求的负载将在列表中的数据源之间平均分配。如果选择负载均衡，则连接请求也提供连接故障转移。这些连接请求将被发送到列表中的不同数据源，直到建立连接或到达数据源列表末尾。\n\
  \n多数据源还提供“**繁忙时故障转移请求**”、“**故障转移回调处理程序**”和“**测试频率**”设置。对于使用故障转移算法的多数据源，当选择“**繁忙时故障转移请求**”时，如果数据源中的所有连接都忙，则连接请求将发送到数据源池中的下一个数据源。“**故障转移回调处理程序**”指定用于处理回调的应用程序类，该回调在多数据源准备向另一个数据源发送故障转移连接请求时发送。“**测试频率**”指定测试连接的间隔（以秒为单位）。如果连接失败，则关闭并重新打开连接。如果连接再次失败，则关闭连接。\n\
  \nWebLogic Server 9.x 还支持数据源工厂。应用程序范围的连接池使用 JDBC 数据源工厂提供默认连接池值。通过单击“服务 | JDBC |\
  \ 数据源工厂”链接来配置数据源工厂。在“数据源工厂”表中单击“新建”。在“创建新的 JDBC 数据源工厂”窗口中，指定数据源工厂名称、用户名和密码。这些用于登录数据库、连接\
  \ URL、驱动程序类名称和工厂名称，然后单击“确定”。数据源工厂已创建，可以部署到目标服务器节点。数据源工厂名称在管理控制台和配置文件 config.xml\
  \ 中使用。工厂名称在部署描述符中使用。\n\n## JDBC 性能调优\n\n为了获得最佳稳定性和性能，请配置池在启动期间创建所需的所有连接，并无限期保留它们。因此，将初始容量设置为等于最大容量，这对于每个执行线程都是相同的。WebLogic\
  \ Server 数据源提供的连接池通过为 JDBC 应用程序提供连接池来提高性能。无需为每个客户端打开和关闭连接。\n\n“保留时测试连接”会在将连接提供给客户端之前测试连接，并可能降低性能。为防止频繁的连接测试，请设置连接池属性“Seconds\
  \ to Trust an Idle Pool Connection”。此属性指定已知已成功使用的连接不使用 SQL 查询进行测试的秒数。当在外部客户端 JVM\
  \ 中使用 RMI 通过 WebLogic 执行 JDBC 到 DBMS 时，通过在配置数据源时选择“启用行预取”并设置最佳预取大小，可以提高数据源性能。行预取通过从服务器向外部客户端预取多行来提高性能。不建议通过\
  \ WebLogic 在外部客户端中使用行预取。在 WebLogic JVM、JSP、servlet、EJB 等中执行 JDBC 要快得多。语句缓存通过重用语句而不是创建新语句来提高连接测试的性能。语句缓存在连接池配置中指定。\n\
  \n以下是无风险 WebLogic JDBC 编码风格的理想标准。池化速度很快，最好以快速的每次调用方式使用：\n\n```\n/* This is how you\
  \ should make any of your top-level methods that will produce JDBC, work for any\
  \ of your applications. */\n```\n\n```\npublic void myTopLevelJDBCMethod()\n{\n\
  \    Connection c = null;\n\n    /* All JDBC objects would be method level objects\
  \ that ensure thread-safety and\n    prevent connection leaking. Define the connection\
  \ object before the JDBC 'try'\n    block.*/\n    try\n    {\n        /* The above\
  \ is the JDBC try block for the method. All the JDBCs' for this method in\n    \
  \    the block is connected directly from the DataSource in the try block. Do not\
  \ connect\n        it from any method that has kept a connection, and is sharing\
  \ it for repeated use.*/\n        c = myDataSource.getConnection();\n\n        /*\
  \ You can pass the connection or sub-objects to sub-methods but none of these\n\
  \        methods must expect to keep or use the objects they receive after their\
  \ method call\n        completes (eg).*/\n        DoSomethingFancyWith(c);\n\n \
  \       /* Use Prepared or Callable Statements. They are usually faster, because\
  \ we cache\n        them transparently with the pool.*/\n        PreparedStatement\
  \ p = c.prepareStatement(...);\n        ResultSet rs = p.executeQuery();\n     \
  \   ProcessResult(rs);\n\n        /* Close JDBC objects in the proper order: first\
  \ resultset,; then statement; and then\n        connection.*/\n        rs.close();\n\
  \n        /* Always close result sets as soon as possible (ASAP) at the levels they\
  \ were\n        created*/\n        p.close();\n\n        /* Always close statements\
  \ ASAP at the levels they were created. When the JDBC is\n        processed in the\
  \ try-block, close the connection:*/\n        c.close();\n\n        /* Always close\
  \ connection-ASAP in the same method and the block that was used\n        to create\
  \ or obtain it.*/\n        c = null;\n\n        /* Set the connection to null, so\
  \ that the finally block below knows that it has been taken care of.*/\n    }\n\
  \    catch (Exception e )\n    {\n        /* Do whatever, according to your needs.\
  \ You would not have a catch block, if it is not needed.*/\n    }\n    finally\n\
  \    {\n        /* Always have the above finally block. A finally block is crucial\
  \ to ensure that the connection is closed and returned to the pool, and is not leaked.*/\n\
  \        /* Failsafe: Do every individual thing you want to do in the finally block\
  \ in it's own try block-catch-ignore so everything is attempted.*/\n        try\n\
  \        {\n            if (c != null) c.close();\n        }\n        catch (Exception\
  \ ignore)\n        {\n        }\n    }\n}\n```\n\n## 从 JDeveloper 部署 Web 应用程序到 WebLogic\
  \ Server\n\n我们将开发一个 Web 应用程序，从“配置数据源”部分中配置的数据源检索 Oracle 数据库表中的数据。在 Oracle 数据库中创建一个示例数据库表。使用\
  \ SQL*Plus 等 SQL 客户端工具或命令行实用程序，使用以下 SQL 脚本创建表 Catalog：\n\n```\nCREATE TABLE Catalog\
  \ (CatalogId INTEGER PRIMARY KEY, Journal VARCHAR(25), Publisher VARCHAR(25), Edition\
  \ VARCHAR(25), Title Varchar(45), Author Varchar(25));\nINSERT INTO Catalog VALUES\
  \ ('1', 'Oracle Magazine', 'Oracle Publishing', 'Nov-Dec 2004', 'Database Resource\
  \ Manager', 'Kimberly Floss');\nINSERT INTO Catalog VALUES ('2', 'Oracle Magazine',\
  \ 'Oracle Publishing', 'Nov-Dec 2004', 'From ADF UIX to JSF', 'Jonas Jacobi');\n\
  INSERT INTO Catalog VALUES ('3', 'Oracle Magazine', 'Oracle Publishing', 'March-April\
  \ 2005', 'Starting with Oracle ADF ', 'Steve Muench');\n```\n\n\n\n我们将在 JDeveloper\
  \ 中创建一个 Web 应用程序以访问 Oracle 数据库。在启动 JDeveloper 之前，我们需要将 <Weblogic91>\\server\\lib\\\
  weblogic.jar 复制到 <JDeveloper>\\jdev\\lib\\ext 目录。<WebLogic91> 是安装 WebLogic Server\
  \ 9.1 的目录。<JDeveloper> 是安装 JDeveloper 的目录。选择 File | New 创建新的应用程序和项目。在 New Gallery\
  \ 窗口中，在 Categories 中选择 General，在 Items 中选择 Application，然后单击 OK。在 Create Application\
  \ 窗口中，指定应用程序名称并单击 OK。在 Create Project 窗口中，指定项目名称并单击 OK。在 Applications Navigator\
  \ 中添加了一个应用程序和一个项目，并创建了一个 JSP，catalog.jsp。选择 File | New，并在 New Gallery 窗口中在 Categories\
  \ 中选择 Web Tier | JSP。在 Items 中选择 JSP 并单击 OK。一个 JSP 已添加到 Applications Navigator。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_153_0.png)\n\n在 JSP 中导入 java.sql、javax.sql\
  \ 和 javax.naming 包。我们必须创建一个 InitialContext 对象，该对象是 JNDI 命名操作所必需的：\n\n```\nInitialContext\
  \ ctx=new InitialContext();\n```\n\n之前，我们已创建了一个 JNDI 名称为 jdbc/OracleDS 的数据源。使用 lookup()\
  \ 方法从 JNDI 名称创建 DataSource 对象：\n\n```\nDataSource ds=(DataSource)ctx.lookup(\"jdbc/OracleDS\"\
  );\n```\n\n从 DataSource 对象获取 JDBC 连接。使用 DataSource 对象的 getConnection() 方法创建 Connection\
  \ 对象：\n\n```\nConnection connection=ds.getConnection();\n```\n\n使用 createStatement()\
  \ 方法从 Connection 对象创建 Statement 对象：\n\n```\nStatement stmt=connection.createStatement();\n\
  ```\n\n使用 executeQuery() 方法运行 SQL 查询以返回 ResultSet 对象。指定一个 SQL 查询，该查询选择示例数据库表 Catalog\
  \ 的所有列：\n\n```\nResultSet resultSet=stmt.executeQuery(\"Select * from Catalog\"\
  );\n```\n\n创建一个 HTML 表格，其中每一行对应结果集中的每一行，每一列对应结果集中的每一列。向 html 表格添加标题行。遍历结果集，并将行值添加到\
  \ html 表格中：\n\n```\nwhile (resultSet.next())\n{\n<tr>\n<td><%=out.println(resultSet.getString(1));%></td>\n\
  </tr>\n}\n```\n\n用于从配置在 WebLogic 服务器中的数据源的示例数据库表中生成 HTML 表格的 JSP 页面 catalog.jsp\
  \ 如下所示：\n\n```\n<%@ page contentType=\"text/html\"%>\n<%@ page import=\"java.sql.*,javax.sql.*,javax.naming.*\"\
  %>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html\">\n<title>WebLogic\
  \ Application</title>\n</head>\n<body>\n<%\nInitialContext ctx=new InitialContext();\n\
  DataSource ds=(DataSource)ctx.lookup(\"jdbc/OracleDS\");\nConnection connection=ds.getConnection();\n\
  Statement stmt=connection.createStatement();\nResultSet resultSet=stmt.executeQuery(\"\
  Select * from Catalog\");\n%>\n<table border=\"1\" cellspacing=\"0\">\n<tr>\n<th>CatalogId</th>\n\
  <th>Journal</th>\n<th>Publisher</th>\n<th>Edition</th>\n<th>Title</th>\n<th>Author</th>\n\
  </tr>\n<%\n    while (resultSet.next())\n    {\n%>\n<tr>\n    <td><%=out.println(resultSet.getString(1));%></td>\n\
  \    <td><%=out.println(resultSet.getString(2));%></td>\n    <td><%=out.println(resultSet.getString(3));%></td>\n\
  \    <td><%=out.println(resultSet.getString(4));%></td>\n    <td><%=out.println(resultSet.getString(5));%></td>\n\
  \    <td><%=out.println(resultSet.getString(6));%></td>\n</tr>\n<%\n    }\n    resultSet.close();\n\
  \    stmt.close();\n    connection.close();\n%>\n</table>\n</body>\n</html>\n```\n\
  \n我们将把 Web 应用程序部署到 WebLogic 服务器。<JDeveloper> 是安装 JDeveloper 的目录。要将 Web 应用程序部署到 WebLogic\
  \ 服务器，我们必须执行以下操作：\n\n- 1. 创建到 WebLogic Server 的连接。\n- 2. 为 Web 应用程序创建部署配置文件。\n-\
  \ 3. 使用到服务器的连接将部署配置文件部署到 WebLogic Server。\n\n## 在 WebLogic Server 中配置 JDBC\n\n我们必须启动\
  \ WebLogic 服务器以建立与服务器的连接。要创建到 WebLogic Server 的连接，请在 **Connections** 导航器中右键单击 **Application\
  \ Server** 节点，并选择 **New Application Server Connection**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_156_0.png)\n\
  \n在 **Create Application Server Connection Wizard** 中单击 **Next**。在 **Type** 窗口中，指定\
  \ Connection Name 并将 Connection Type 选择为 WebLogic Server 9.x，然后单击 **Next**。\n\n\
  ![](img/553e44bc30e70d0d8e58278a7ece8da8_156_1.png)\n\n在 Authentication 窗口中指定用户名（默认为\
  \ 'weblogic'）和密码（默认为 'weblogic'），这些是在安装 WebLogic 服务器时指定的。在 Connection 窗口中，将 Host\
  \ Name 指定为 localhost，Port 指定为 1521，Target Node 指定为 examplesServer，并指定 weblogic.jar\
  \ 的路径。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_157_0.png)\n\n在 Test 窗口中，单击 Test\
  \ Connection 按钮以测试与 WebLogic 服务器的连接。如果建立了连接，则会显示 \"Success\" 消息。如果未建立连接，则会生成错误消息。例如，如果在测试与服务器的连接之前未启动\
  \ WebLogic 服务器，则会生成错误。应用程序服务器连接节点已添加到 Connections 导航器中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_157_1.png)\n\
  \n我们将从 Web 应用程序创建部署配置文件。选择 **File | New**，并在 **New Gallery** 窗口中选择 **General | Deployment\
  \ Profiles**。在 **Items** 中选择 **WAR File** 并单击 **OK**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_158_0.png)\n\
  \n在 **Create Deployment Profile** 窗口中，指定部署配置文件名称 `webapp1`，这是默认值，然后单击 **OK**。在 WAR\
  \ Deployment Profile Properties 窗口中将 J2EE web context root 指定为 '`weblogic`'。我们与\
  \ WebLogic 服务器创建的连接是 `t3` 协议连接。默认情况下，部署配置文件使用 `http` 协议部署到 WebLogic 服务器。因此，我们必须将部署配置文件协议修改为\
  \ `t3`。选择 **Platform | WebLogic 9.x** 节点，将 **adminurl** 选项从 `http://${hostname}:${port}`\
  \ 修改为 `t3://${hostname}:${port}` 并单击 **OK**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_159_0.png)\n\
  \n在 J2EE 应用程序部署到 WebLogic Server 之前，WebLogic Server 必须不处于 Lock & Edit 模式。通过右键单击部署配置文件并选择\
  \ Deploy to | WebLogicConnection 链接来部署部署配置文件到 WebLogic Server。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_159_1.png)\n\
