  \ 属性指定的数据库表被生成。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_421_0.png)\n\n使用 Hibernate\
  \ 生成的 CREATE TABLE 脚本如下：\n\n```\ncreate table OE.CATALOG (ID varchar2(255) not null,\
  \ JOURNAL varchar2(255), PUBLISHER varchar2(255), EDITION varchar2(255), TITLE varchar2(255),\
  \ AUTHOR varchar2(255), primary key (ID))\ncreate sequence hibernate_sequence\n\
