  ```\n\n## 更新一行\n\n接下来，我们将在 OracleWebRowSet 对象中更新一行。在 ReadRow JSP 中点击修改 Web RowSet\
  \ 页面链接。在 ModifyWebRowSet JSP 中点击 Update Row 链接。在 UpdateRow JSP 中指定要更新的行并指定修改后的值。例如，更新第二行。点击\
  \ Apply。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_265_0.png)\n\nUpdateRow JSP\
  \ 调用 WebRowSetQuery Java 类的 updateRow() 方法。WebRowSetQuery 对象从 session 对象中检索：\n\n\
  ```\nWebRowSetQuery query=( webrowset.WebRowSetQuery)\n    session.getAttribute(\"\
  query\");\n```\n\n在 updateRow() 方法中，OracleWebRowSet 对象光标移动到要更新的行：\n\n```\nwebRowSet.absolute(rowUpdate);\n\
  ```\n\n使用 OracleWebRowSet 对象的 updateString() 方法更新行值：\n\n```\nwebRowSet.updateString(1,\
  \ journal);\nwebRowSet.updateString(2, publisher);\nwebRowSet.updateString(3, edition);\n\
  webRowSet.updateString(4, title);\nwebRowSet.updateString(5, author);\n```\n\n使用\
  \ updateRow() 方法更新 OracleWebRowSet 对象：\n\n```\nwebRowSet.updateRow();\n```\n\nOracleWebRowSet\
  \ 对象中的行已更新。数据库表中的行尚未更新。UpdateRow.jsp 如下所示：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
