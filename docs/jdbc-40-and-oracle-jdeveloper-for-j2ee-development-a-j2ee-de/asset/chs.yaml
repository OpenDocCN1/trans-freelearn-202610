  {\n    for (Throwable e: sqlException)\n{\n        System.out.println(\"Error encountered:\
  \ \" + e);\n    }\n    }\n}\n}\n```\n\n## 摘要\n\n使用 ResultSet 接口更新数据库需要与数据库保持持久连接。RowSet\
  \ 扩展了 ResultSet 接口。RowSet 的优点是不需要在修改数据时保持持久的 JDBC 数据库连接。WebRowSet 接口进一步扩展了 RowSet\
  \ 接口，并将 RowSet 对象表示为 XML 文档，从而便于未连接到数据库的远程客户端查询和修改数据的传输。在支持 JDBC 4.0 的服务器中，Web RowSet\
  \ 应用程序可以使用 JDBC 4.0 功能，例如连接状态跟踪和 Java SE 链接异常设施。\n"
- "## 10 创建 JSF 数据表\n\nJavaServer Faces (JSF) 提供了一组用户界面 (UI) 组件，可与 JDBC API 结合使用以显示数据库数据。JDeveloper\
  \ 10.1.3 版支持 JSF 1.1_02 的参考实现。JSF HTML 标签库在组件调色板中为开发 Web 应用程序提供不同的用户界面组件。Data Table\
  \ 是 JSF HTML 组件调色板中的一个 UI 组件，表示表格中的数据集合。Data Table 组件可用于使用静态或动态生成的 SQL 查询显示数据库数据。\n\
  \nJDeveloper 10.1.3 提供了创建数据表向导来创建 JSF 数据表。在本章中，我们将通过在创建数据表向导中将数据表绑定到托管 bean (MBean)\
  \ 并将数据表绑定到创建数据表向导中指定的列数，然后使用 JSF API 创建数据表来创建数据表。JSF 类 javax.faces.component.html.HtmlDataTable\
  \ 表示数据表。数据表中的列由 javax.faces.component.UIColumn 类表示。托管 bean 是表示某些资源的 Java 对象，由 JSF\
  \ 框架管理，可用作组件模型。在本章中我们将学习关于：\n\n- 使用创建数据表向导使用 MBean 创建数据表\n- 使用创建数据表向导使用 JSF API\
  \ 创建数据表\n\n### 设置环境\n\n安装 Oracle 数据库 10g，包括示例模式，并创建数据库实例。数据表是从示例数据库表 OE.Catalog\
  \ 创建的。使用以下 SQL 脚本创建示例表 OE.Catalog：\n\n```\nCREATE TABLE OE.Catalog(CatalogId INTEGER\
  \ PRIMARY KEY, Journal VARCHAR(25), Publisher VARCHAR(25), Edition VARCHAR(25),\
  \ Title Varchar(45), Author Varchar(25));\n```\n\n\n\n```\nINSERT INTO OE.Catalog\
  \ VALUES('1', 'Oracle Magazine', 'Oracle\n    Publishing', 'Nov-Dec 2004', 'Database\
  \ Resource Manager',\n    'Kimberly Floss');\nINSERT INTO OE.Catalog VALUES('2',\
  \ 'Oracle Magazine', 'Oracle\n    Publishing', 'Nov-Dec 2004', 'From ADF UIX to\
  \ JSF','Jonas Jacobi');\nINSERT INTO OE.Catalog VALUES('3', 'Oracle Magazine', 'Oracle\n\
  \    Publishing', 'March-April 2005', 'Starting with Oracle ADF ',\n    'Steve Muench');\n\
  ```\n\n## 通过绑定 MBean 创建数据表\n\n在本节中，我们将使用创建数据表向导创建数据表，通过将数据表与表示数据表数据源的管理 bean 绑定。\
  \ 使用 MBean 创建数据表的步骤如下：\n\n- 1. 为 Web 服务创建一个 JavaBean 类。\n- 2. 为 Web 服务创建服务端点接口（SEI）。\n\
  - 3. 从 JavaBean 类和 SEI 生成 Web 服务。\n- 4. 为 Web 服务创建客户端类。在客户端类中，使用 JDBC 连接到 Oracle\
  \ 数据库并运行 SQL 查询以创建 ResultSet，该 ResultSet 表示我们将绑定到数据表的对象集合。\n- 5. 从 Web 服务客户端类创建\
  \ MBean。\n- 6. 在 JSF 页面中将数据表绑定到 MBean。\n\n首先，如图所示在 JDeveloper 10.1.3 中创建一个应用程序和项目。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_286_0.png)\n\n数据表 JSF 应用程序由三个层组成：数据库、中间层\
  \ MBean 和 JSF 用户界面。为中间层向项目添加一个 JavaBean 类。Bean 类包含数据表不同列的 getter 和 setter 值。JavaBean\
  \ 类通过 **File | New** 添加。在 **New Gallery** 窗口中在 **Categories** 中选择 **General | Java\
  \ Class** 并单击 **OK**。JavaBean 类 `DataTable.java` 如下所示。\n\n```java\npackage datatable;\n\
  public class DataTable\n{\n    private int catalogId;\n    private String journal;\n\
  \    private String publisher;\n    private String edition;\n    private String\
  \ title;\n    private String author;\n    public DataTable()\n    {}\n    public\
  \ int getCatalogId(){\n        return this.catalogId;}\n    public void setCatalogId(int\
  \ catalogId){\n        this.catalogId=catalogId;}\n    public String getJournal(){\n\
  \        return this.journal;}\n    public void setJournal(String journal){\n  \
  \      this.journal=journal;}\n    public String getPublisher(){\n        return\
  \ this.publisher;}\n    public void setPublisher(String publisher){\n        this.publisher=publisher;}\n\
  \    public String getEdition(){\n        return this.edition;}\n    public void\
  \ setEdition(String edition){\n        this.edition=edition;}\n    public String\
  \ getTitle(){\n        return this.title;}\n    public void setTitle(String title){\n\
  \        this.title=title;}\n    public String getAuthor(){\n        return this.author;}\n\
  \    public void setAuthor(String author){\n        this.author=author;}\n    public\
  \ static void main(String[] args){\n        DataTable dataTable = new DataTable();\n\
  \    }\n}\n```\n\n## 创建 JSF 数据表\n\n使用 **File | New** 为 Bean 类添加 MyWebService1SEI.java\
  \ SEI。在 **New Gallery** 窗口中在 **Categories** 中选择 **General**，在 **Items** 中选择 **Java\
  \ Interface**。MyWebService1SEI.java 如下所示。\n\n```java\npackage datatable;\nimport\
  \ java.rmi.RemoteException;\npublic interface MyWebService1SEI extends java.rmi.Remote\n\
  {   public java.lang.String getTitle() throws RemoteException;\n    public void\
  \ setTitle(java.lang.String param0) throws RemoteException;\n    public int getCatalogId()\
  \ throws RemoteException;\n    public void setCatalogId(int param0) throws RemoteException;\n\
  \    public java.lang.String getJournal() throws RemoteException;\n    public void\
  \ setJournal(java.lang.String param0) throws RemoteException;\n    public java.lang.String\
  \ getPublisher() throws RemoteException;\n    public void setPublisher(java.lang.String\
  \ param0) throws RemoteException;\n    public java.lang.String getEdition() throws\
  \ RemoteException;\n    public void setEdition(java.lang.String param0) throws RemoteException;\n\
  \    public java.lang.String getAuthor() throws RemoteException;\n    public void\
  \ setAuthor(java.lang.String param0) throws RemoteException;\n}\n```\n\n接下来，从中间层\
  \ JavaBean 类和 SEI 生成 Web 服务。右键单击 DataTable.java Bean 类并选择 **Create J2EE Web Service**。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_288_0.png)\n\n在 **Select J2EE Version**\
  \ 窗口中，选择 J2EE 1.4 (JAX-RPC) Web 服务。在 **Class** 窗口中选择默认的 **Web Service Name** 并为\
  \ **Service Endpoint Interface** 选择默认设置，然后单击 **Next**。在 **Message Format** 窗口中选择\
  \ **SOAP Message Format**，其可以设置为 **Wrapped** 或 **Unwrapped**。**SOAP Message Format**\
  \ 指定 SOAP 绑定文档样式。在 **Wrapped** 样式中，**wsdl:operation** 名称指定为与 XML 文档的根元素相同。选择 **SOAP\
  \ Message Format** 为 **Document/Wrapped**。**Generate Schema with Qualified Elements**\
  \ 复选框默认选中，这意味着模式元素带命名空间前缀。Web 服务附件使用 **MIME** 编码处理。\n\n**Multipurpose Internet Mail\
  \ Extensions (MIME)** 格式用于传输消息，是 HTTP 通信协议的基本组件。MIME 支持非 ASCII 字符集中的文本和头信息，以及非文本附件。要使用\
  \ **MIME** 编码，请选中 **Use MIME Encoding** 复选框。单击 **Next**。在 **Specify Custom DataType\
  \ Serializers** 中，指定 XML 类型与其对应的 Java 类型之间的映射。选择默认设置并单击 **Next**。在 **Mapping** 窗口中，可选地指定\
  \ **Java Web Service** 与相应 WSDL 元素之间的映射。选择默认设置并单击 **Next**。**Methods** 窗口显示 Web\
  \ 服务方法。单击 **Next**。在 **Handler Details** 窗口中，选择默认设置并单击 **Next**。在 **State** 窗口中，选择默认设置并单击\
  \ **Next**。在 **Additional Classes** 窗口中，单击 **Next**。中间层的 Web 服务将被添加到项目中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_289_0.png)\n\
  \n## 创建 JSF 数据表\n\n接下来，为 Web 服务生成客户端类。右键单击 Web 服务节点并选择 **Generate Web Service Proxy**。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_290_0.png)\n\n在 **Shared Service Endpoint\
  \ Interface** 窗口中，单击 **Yes**。在 **Port Endpoints** 窗口中，选中 **Run Against a service\
  \ deployed to Embedded OC4J** 复选框并单击 **OK**。Web 服务的客户端类将被添加到项目中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_291_0.png)\n\
  \n在客户端类中，我们将访问 Oracle 数据库并运行 SQL 查询，从我们之前创建的 catalog 表中创建 ResultSet。为客户端类添加 java.sql.*\
  \ 包的 import 语句和一个 getDataResultSet 方法，该方法返回从数据库表检索的数据的 ResultSet。在 getDataResultSet\
  \ 方法中，加载 Oracle JDBC 驱动类 oracle.jdbc.OracleDriver 并使用 DriverManager 类的 getConnection\
  \ 方法与 Oracle 数据库创建连接。使用 Connection 对象的 createStatement 方法从 Connection 对象创建 Statement\
  \ 对象。默认情况下，您只能从第一行到最后一行迭代一次 ResultSet。要创建可滚动结果，请将结果集类型指定为 ResultSet.TYPE_SCROLL_INSENSITIVE。对于只读结果集，将结果集并发指定为\
  \ ResultSet.CONCUR_READ_ONLY。使用 Statement 对象的 executeQuery 方法运行 SQL 查询。\n\ngetDataResultSet\
  \ 方法如下所示：\n\n```\npublic ResultSet getDataResultSet(){\n    ResultSet rs=null;\n\
  \    try{\n    Class.forName(\"oracle.jdbc.OracleDriver\");\n    String url=\"jdbc:oracle:thin:@localhost:1521:ORCL\"\
  ;\n    Connection connection = DriverManager.getConnection(url,\n        \"OE\"\
  , \"pw\");\n    Statement stmt=connection.createStatement(ResultSet.\n        TYPE_SCROLL_INSENSITIVE,\
  \ ResultSet.CONCUR_READ_ONLY);\n    rs=stmt.executeQuery(\"SELECT * FROM OE.CATALOG\"\
  );\n    }catch(SQLException e){}\n    catch(ClassNotFoundException e){}\n    return\
  \ rs;\n}\n```\n\n接下来，我们将在 JSF 页面中创建数据表。使用 File | New 向 Applications-Navigator 项目添加一个\
  \ JSF 页面。在 New Gallery 窗口中在 Categories 中选择 Web Tier | JSF，在 Items 中选择 JSF JSP。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_292_0.png)\n\n\n\n\n在 **JSP 文件** 窗口中指定\
  \ **文件名**，`catalog.jsp`，然后单击 **下一步**。在 **组件绑定** 窗口中选择 **在新的托管 Bean 中自动公开 UI 组件**。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_293_0.png)\n\n## 创建 JSF 数据表\n\n在“错误页面选项”窗口中，选择默认设置，即不使用错误页面，然后单击“下一步”。在“标签库”窗口中，JSF\
  \ HTML 和 JSF Core 标签库已被预先选中。Data Table 是 JSF HTML 标签库组件。JSF Core 标签库实现了标准的 JSF 核心标签。单击“下一步”。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_294_0.png)\n\n在 **HTML 选项** 窗口中，选择默认设置并单击\
  \ **下一步**。在 **完成** 窗口中，单击 **完成**。包含 `faces-config.xml` 配置文件和 JSF 页面的支持 bean 的 JSF\
  \ 页面被添加到 **Applications-Navigator** 项目节点。接下来我们将添加一个 MBean，它封装了中间层 Web 服务的客户端类。打开\
  \ `faces-config.xml` 配置文件，选择 **概述** 选项卡并单击 **新建**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_295_0.png)\n\
  \n## 创建 JSF 数据表\n\n在“创建托管 Bean”窗口中，指定托管 Bean 名称 CatalogBean，并在“类”字段中指定之前生成的 Web\
  \ 服务客户端类，并将范围选择为 request。单击“确定”。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_296_0.png)\n\
  \n为 Web 服务客户端类添加了一个托管 Bean。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_296_1.png)\n\
  \n接下来，我们将向 JSF 页面添加一个数据表。选择 JSF HTML 组件调色板。在应用程序导航器中选择 JSF 页面节点，将光标定位在 JSF 页面中，并在\
  \ JSF HTML 组件调色板中选择数据表。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_297_0.png)\n\
  \n## 创建 JSF 数据表\n\n**创建数据表向导** 启动。在介绍窗口中单击 **下一步**。在 **绑定** 窗口中，选择 **立即绑定数据表** 单选按钮并单击\
  \ **下一步**。**列数** 选项用于使用 JSF API 绑定数据表，我们将在下一节讨论。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_298_0.png)\n\
  \n在 **绑定数据表** 窗口中，**值** 字段指定用于生成数据表的数据对象集合。**类** 字段指定数据对象集合的 Bean 类，而 **变量** 字段指定数据对象集合中一行数据的变量。单击\
  \ **绑定** 将数据对象集合绑定到数据表。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_298_1.png)\n\
  \n在 **按以下筛选** 选择中选择 **所有类型**。从之前生成的 `CatalogBean` MBean 中选择 `dataResultSet` 变量。使用\
  \ > 按钮将所选变量添加到 **表达式** 窗口。单击 **确定**。**表达式** 表示由封装在 `CatalogBean` MBean 中的 Web 服务客户端类的\
  \ `dataResultSet` 方法返回的数据对象集合的 EL 表达式。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_299_0.png)\n\
  \n在 **绑定数据表** 窗口中，在 **类** 字段中指定创建 Web 服务的 bean 类 `DataTable`。在 **变量** 字段中，指定数据对象集合中一行数据的变量。单击\
  \ **下一步**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_299_1.png)\n\n## 创建 JSF 数据表\n\
  \n在 **标题和行数据** 窗口中，指定数据表中的列标题和数据表中列值的 EL 表达式。修改列的顺序以匹配用于生成数据表的数据库表中的列，然后单击 **下一步**。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_300_0.png)\n\n在 **完成** 窗口中，单击 **完成**\
  \ 按钮。数据表标题和列值的 EL 表达式被添加到 JSF 页面。右键单击 catalog.jsp 节点并选择 **运行** 以生成数据表。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_300_1.png)\n\
  \n数据表被生成并在默认浏览器中显示。\n\n| 目录 ID | 期刊 | 出版社 | 版本 | 标题 | 作者 |\n|---|---|---|---|---|---|\n\
  | 1 | Oracle Magazine | Oracle Publishing | Nov-Dec 2004 | Database Resource Manager\
  \ | Kimberly Floss |\n| 2 | Oracle Magazine | Oracle Publishing | Nov-Dec 2004 |\
  \ From ADF UIX to JSF | Jonas Jacobi |\n| 3 | Oracle Magazine | Oracle Publishing\
  \ | March-April 2005 | Starting with Oracle ADF | Steve Muench |\n\n## 使用 JSF API\
  \ 创建数据表\n\n在上一节中，我们从 Web 服务客户端类中的静态查询生成了一个数据表。在本节中，我们将从 JSF 页面中指定的动态查询生成数据表。我们将使用\
  \ **创建数据表向导** 将数据表绑定到指定数量的列，并在支持 bean 中使用 JSF API 生成数据表。使用 JSF API 从数据库表创建数据表的步骤如下：\n\
  \n- 1. 创建一个 JSF 页面。\n- 2. 向 JSF 页面添加 **输入文本** JSF 组件。我们将使用输入文本指定用于生成数据表的 SQL 查询。\n\
  - 3. 从组件调色板添加 **命令按钮** 以提交 SQL 查询。我们将命令按钮绑定到用于创建数据表的支持 bean 方法。\n- 4. 从组件调色板添加 **数据表**。在创建数据表向导中指定列数以匹配用于创建数据表的数据库表中的列数。\n\
  - 5. 在支持 bean 中检索输入文本中指定的 SQL 查询并使用 JSF API 创建数据表。\n\n## 创建 JSF 数据表\n\n删除上一节中创建的\
  \ JSFDataTable 应用程序，包括应用程序内容。如同上一节一样，创建一个应用程序和项目。使用 **文件 | 新建** 添加一个 JSF 页面。在 **新建库**\
  \ 窗口中，在 **类别** 中选择 **Web 层 | JSF**，在 **项目** 中选择 **JSF JSP**。单击 **确定**。向 JSF 页面添加来自\
  \ **CSS** 组件调色板的 **JDeveloper** CSS 样式。向 JSF 页面添加一个 **标题 2**。将标题指定为“JSF Data Table”。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_302_0.png)\n\n接下来，在 JSF 页面设计视图中将光标定位在标题下方，并从\
  \ **JSF HTML 组件调色板** 添加 **输入文本** UI 组件。要从 JSF HTML 组件调色板添加 UI 组件，请单击组件调色板中的组件。我们将在输入文本中指定用于生成数据表的\
  \ SQL 查询。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_303_0.png)\n\n## 创建 JSF 数据表\n\
  \n将光标定位在 JSF 页面输入文本下方，并从 JSF HTML 组件调色板添加 **命令按钮** 组件。我们将使用命令按钮提交 SQL 查询。在 **属性检查器**\
  \ 中设置命令按钮上的文本。\n\n接下来，将光标定位在 JSF 页面命令按钮下方，并从组件调色板添加 **数据表**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_305_0.png)\n\
  \n**创建数据表向导** 启动。单击 **下一步**。在 **绑定** 窗口中，选择 **列数** 并指定一个值，将数据表生成的数据库表中的列数指定为 6。单击\
  \ **完成**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_305_1.png)\n\n## 创建 JSF 数据表\n\
  \n数据表被添加到 JSF 页面。数据表目前不包含任何列标题或列数据。我们将为数据表列和列标题添加支持 bean 绑定以生成数据表。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_306_0.png)\n\
  \n修改 catalog.jsp JSF 页面以指定数据表中不同列的支持 bean 绑定。将以下列表替换为：\n\n```\n<h:dataTable binding=\"\
  #{backing_catalog.dataTable1}\" id=\"dataTable1\">\n    <h:column/>\n    <h:column/>\n\
  \    <h:column/>\n    <h:column/>\n    <h:column/>\n    <h:column/>\n</h:dataTable>\n\
  ```\n\n以下列表：\n\n```\n<h:dataTable rows=\"5\" binding=\"#{backing_catalog.dataTable1}\"\
  >\n    <h:column binding=\"#{backing_catalog.column1}\"/>\n    <h:column binding=\"\
  #{backing_catalog.column2}\"/>\n    <h:column binding=\"#{backing_catalog.column3}\"\
  />\n```\n\n\n\n```\n<h:column binding=\"#{backing_catalog.column4}\"/>\n<h:column\
  \ binding=\"#{backing_catalog.column5}\"/>\n<h:column binding=\"#{backing_catalog.column6}\"\
  />\n</h:dataTable>\n```\n\n接下来，将命令按钮绑定到将生成数据表的 backing bean 方法。双击命令按钮。在“绑定操作属性”窗口中，选择命令按钮在\
  \ backing bean 中的默认操作方法，然后单击“确定”。JSF 页面的 backing bean 类 Catalog.java 将显示出来。为数据表列添加\
  \ UIColumn 组件变量，并为 UIColumn 组件添加 getter/setter 方法。修改在单击数据表按钮时调用的 commandButton1_action\
  \ 方法。在 commandButton1_action 方法中，使用数据库获取 JDBC 连接。使用 Class.forName 方法加载驱动类 oracle.jdbc.OracleDriver。使用\
  \ DriverManager 类的 getConnection 方法创建 Connection 对象：\n\n```\nClass.forName(\"oracle.jdbc.driver.OracleDriver\"\
  );\nString url=\"jdbc:oracle:thin:@<host>:1521:<database>\";\nConnection connection\
  \ = DriverManager.getConnection(url,\n    \"OE\", \"<password>\");\n```\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_307_0.png)\n\
  \n> 在连接 URL 中，<host> 是数据库主机，<database> 是数据库实例。\n\n使用 createStatement 方法创建 Statement\
  \ 对象。将结果集类型指定为可滚动，结果集并发指定为只读。\n\n```\nStatement\nstmt=connection.createStatement(ResultSet.TYPE_SCROLL_INSENSITIVE,\n\
  ResultSet.CONCUR_READ_ONLY);\n```\n\n使用 JSF 页面输入文本字段中指定的 SQL Select 语句查询数据库。输入文本值是通过调用输入文本的\
  \ backing bean 属性的 getValue 方法检索的。SQL 查询使用 Statement 对象的 executeQuery 方法运行。executeQuery\
  \ 方法生成 ResultSet 对象。\n\n```\nResultSet rs=stmt.executeQuery((String)inputText1.getValue());\n\
  ```\n\n使用数据表的 backing bean 属性设置数据表的边框和单元格填充。边框使用 setBorder 方法设置，单元格填充使用 setCellPadding\
  \ 方法设置：\n\n```\ndataTable1.setBorder(5);\ndataTable1.setCellPadding(\"1\");\n```\n\
  \n使用 setVar 方法设置从数据库检索的 ResultSet 中数据行的变量：\n\n```\ndataTable1.setVar(\"catalog\"\
  );\n```\n\n设置数据表中列的标题值。数据表为数据库表中的每一列都有列。通过创建 HtmlOutputText 标题组件并使用 setHeader 方法将标题设置在\
  \ UIColumn 组件上来添加列标题。HtmlOutputText 值使用 setValue 方法设置。例如，CatalogId 列的列标题添加如下：\n\n\
  ```\nHtmlOutputText headerComponent = new HtmlOutputText();\nheaderComponent.setValue(\"\
  CatalogId\");\ncolumn1.setHeader(headerComponent);\n```\n\n对于数据表中的每一列，为 HtmlOutputText\
  \ 组件指定值绑定并将组件添加到列中。HtmlOutputText 组件的值绑定使用 setValueBinding 方法设置。通过调用 getChildren\
  \ 方法然后调用 add 方法将 HtmlOutputText 组件添加到 UIColumn 组件。例如，对于 CatalogId 列，HtmlOutputText\
  \ 组件添加如下：\n\n```\nHtmlOutputText column1Text=new HtmlOutputText();\nValueBinding\
  \ vb =\nFacesContext.getCurrentInstance().getApplication().createValueBinding(\n\
  \"#{catalog.catalogid}\");\ncolumn1Text.setValueBinding(\"value\", vb);\ncolumn1.getChildren().add(column1Text);\n\
  ```\n\n创建 ResultSetDataModel 对象。ResultSetDataModel 对象用于包装 ResultSet 对象，后者需要可滚动。使用\
  \ setWrappedData 方法将通过 SQL 查询检索的 ResultSet 设置为 ResultSetDataModel 的数据：\n\n```\n\
  ResultSetDataModel dataModel=new ResultSetDataModel();\ndataModel.setWrappedData(rs);\n\
  ```\n\n使用 setValue 方法将数据表与 ResultSetDataModel 对象绑定。\n\n```\ndataTable1.setValue(dataModel);\n\
  ```\n\n下面列出了修改后的 backing bean 类 Catalog.java：\n\n```\npackage datatable.backing;\n\
