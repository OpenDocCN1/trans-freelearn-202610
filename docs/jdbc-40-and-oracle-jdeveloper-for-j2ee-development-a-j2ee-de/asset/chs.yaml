  </metadata>\n<data>\n    <row>\n        <col>Oracle Magazine</col>\n        <col>Oracle\
  \ Publishing</col>\n        <col>July-August 2005</col>\n        <col>Tuning Undo\
  \ Tablespace</col>\n        <col>Kimberly Floss</col>\n    </row>\n    <row>\n \
  \       <col>Oracle Magazine</col>\n        <col>Oracle Publishing</col>\n     \
  \   <col>March-April 2005</col>\n        <col>Starting with Oracle ADF</col>\n \
  \       <col>Steve Muench</col>\n    </row>\n</data>\n</RowSet>\n```\n\n在本节中，解释了从数据库表生成\
  \ Web RowSet 的过程。在下一节中，Web RowSet 将被修改，并将修改后的数据存储到数据库表中。\n\n## 使用 Web RowSet 修改数据库表\n\
  \n使用 ResultSet 接口时，要修改数据库中的数据，需要与数据库建立 JDBC 连接才能插入、删除或更新数据库表行。使用 Web RowSet 时，数据可以在\
  \ OracleWebRowSet 对象中进行修改，只有在对 Web RowSet 完成所有修改后，才需要连接来使用 Web RowSet 中的数据更新数据库表。本节将修改\
  \ Web RowSet 中的数据，并使用修改后的 Web RowSet 更新数据库表。在示例 Web RowSet 中修改数据不需要 JDBC 连接。OracleWebRowSet\
  \ 对象如前一节所述生成。\n\n创建一个 JSP，ModifyWebRowSet.jsp，用于从 SQL 查询创建和修改 Web RowSet。还添加了稍后在本章中列出的\
  \ JSP CreateRow.jsp、ReadRow.jsp、UpdateRow.jsp、DeleteRow.jsp 和 UpdateDatabase.jsp。用于创建和修改\
  \ Web RowSet 的 ModifyWebRowSet.jsp 如下所示：\n\n```\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD\
  \ HTML 4.01 Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\">\n<%@ page\
  \ contentType=\"text/html;charset=windows-1252\"%>\n<%@ page session=\"true\"%>\n\
  <html>\n    <head>\n        <title>Modify Database Table with Web RowSet</title>\n\
  \    </head>\n    <body>\n        <h3>Modify Database Table with Web RowSet</h3>\n\
  \        <%webrowset.WebRowSetQuery query=null;%>\n        <%String selectQuery=request.getParameter(\"\
  selectQuery\");\n        if(selectQuery!=null){\n        query=new webrowset.WebRowSetQuery();\n\
  \        query.generateWebRowSet(selectQuery);\n        session.setAttribute(\"\
  query\", query);\n        }\n        %>\n        <form name=\"query\" action=\"\
  ModifyWebRowSet.jsp\" method=\"post\">\n            <table>\n                <tr>\n\
  \                    <td>Select Query:</td>\n                </tr><tr><td>\n   \
  \                 <textarea name=\"selectQuery\" rows=\"5\"\n                  \
  \  cols=\"50\"></textarea>\n```\n\n```\n</td></tr><tr><td>\n    <input class=\"\
  Submit\" type=\"submit\" value=\"Apply Query\"/>\n    </td></tr>\n<tr><td><a href=\"\
  CreateRow.jsp\">Create Row</a></td></tr>\n<tr><td><a href=\"ReadRow.jsp\">Read Row</a></td></tr>\n\
  <tr><td><a href=\"UpdateRow.jsp\">Update Row</a></td></tr>\n<tr><td><a href=\"DeleteRow.jsp\"\
  >Delete Row</a></td></tr>\n<tr><td><a href=\"UpdateDatabase.jsp\">Update Database</a></td></tr>\n\
  </table>\n</form>\n</body>\n</html>\n```\n\nWeb RowSet 应用程序的目录结构在 **Applications\
  \ Navigator** 中显示。在 JDeveloper 中运行 `ModifyWebRowSet.jsp` JSP。JSP 在浏览器中显示。指定 SQL\
  \ 查询以生成 Web RowSet。单击 **Apply Query** 随后我们将修改 Web RowSet 并更新数据库。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_256_0.png)\n\
  \n生成了一个 Web RowSet。我们将使用 Web RowSet 对象来创建、读取、更新和删除通过 SQL 查询获得的结果集。在 ModifyWebRowSet.jsp\
  \ 中，将 WebRowSetQuery 对象设置为会话对象属性：\n\n```\nsession.setAttribute(\"query\", query);\n\
  ```\n\nModifyWebRowSet 对象的 OracleWebRowSet 对象将在 Create、Read、Update 和 Delete JSP\
  \ 中使用。\n\n## 创建新行\n\n接下来，在 Web RowSet 中创建新行。在 ModifyWebRowSet.jsp JSP 中单击 Create\
  \ Row 链接。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_257_0.png)\n\n显示 CreateRow.jsp。指定要添加的行值并单击\
  \ Apply。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_258_0.png)\n\n在 CreateRow.jsp\
  \ 中，从 JSP 检索输入值并调用 WebRowSetQuery 类的 insertRow() 方法。WebRowSetQuery 对象从会话对象中检索：\n\
  \n```\nWebRowSetQuery query=( webrowset.WebRowSetQuery)\n    session.getAttribute(\"\
  query\");\n```\n\n在 insertRow() 方法中，OracleWebRowSet 对象光标移动到插入行：\n\n```\nwebRowSet.moveToInsertRow();\n\
  ```\n\n使用 updateString() 方法设置行值：\n\n```\nwebRowSet.updateString(1, journal);\nwebRowSet.updateString(2,\
  \ publisher);\nwebRowSet.updateString(3, edition);\nwebRowSet.updateString(4, title);\n\
  webRowSet.updateString(5, author);\n```\n\n将行添加到 OracleWebRowSet：\n\n```\nwebRowSet.insertRow();\n\
  ```\n\n在 OracleWebRowSet 对象中添加了新行。新行尚未添加到数据库中。CreateRow.jsp 如下所示：\n\n```\n<%@ page\
  \ contentType=\"text/html;charset=windows-1252\"%>\n<%@ page session=\"true\"%>\n\
  <html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=windows-1252\"\
  >\n<title>Create Row with Web RowSet</title>\n</head>\n<body>\n<form><h3>Create\
  \ Row with Web RowSet</h3>\n<table>\n<tr><td><a href=\"ModifyWebRowSet.jsp\">Modify\
  \ Web RowSet Page</a></td></tr>\n</table>\n</form>\n<%\nwebrowset.WebRowSetQuery\
  \ query=null;\nquery=(webrowset.WebRowSetQuery)\nsession.getAttribute(\"query\"\
  );\nString journal=request.getParameter(\"journal\");\nString publisher=request.getParameter(\"\
  publisher\");\nString edition=request.getParameter(\"edition\");\nString title=request.getParameter(\"\
  title\");\nString author=request.getParameter(\"author\");\nif(journal!=null||publisher!=null||edition!=null||title!=null||author!=null){\n\
  query.insertRow(journal, publisher, edition, title, author);\n}\n%>\n<form name=\"\
  query\" action=\"CreateRow.jsp\" method=\"post\">\n<table>\n<tr>\n<td>\n<h4>Insert\
  \ Row</h4>\n</td>\n</tr>\n```\n\n```\n<tr>\n    <td>Journal:</td>\n</tr>\n<tr>\n\
  \    <td>\n        <input name=\"journal\" type=\"text\" size=\"50\"\n         \
