  \ Publishing | Nov-Dec 2004 | From ADF UIX to JSF | Jonas Jacobi |\n| 3 | Oracle\
  \ Magazine | Oracle Publishing | March-April 2005 | Starting with Oracle ADF | Steve\
  \ Muench |\n\n## JDBC 4.0 版本\n\nWebLogic Server 9.x 也不支持 JDBC 4.0，10.x 也不支持。在 WebLogic\
  \ Server 的后续版本中，我们可以使用 JDBC 4.0 中的新功能。为使用 JDBC 4.0 驱动程序，我们将修改 catalog.jsp 以从 WebLogic\
  \ Server 连接到 Oracle 数据库。Oracle 数据库 11g JDBC 驱动程序支持 JDBC 4.0，可从以下位置下载： http://www.oracle.com/technology/software/tech/java/sqlj_jdbc/htdocs/jdbc_111060.html。可以通过将\
  \ JDBC 4.0 JAR 文件 ojdbc6.jar 添加到服务器 lib 目录，或添加到 startWebLogic 脚本的 classpath 变量中来使用\
  \ JDBC 4.0 功能。JDBC 4.0 已添加对在 Connection 对象上设置客户端信息属性的支持，以标识可能拖慢应用程序的连接。标准客户端信息属性为\
  \ ApplicationName、ClientUser 和 ClientHostname。在 Web 应用程序的 JDBC 4.0 版本中，在 Connection\
  \ 对象上设置标准客户端信息属性：\n\n```\nconnection.setClientInfo(\"ApplicationName\",\"OracleApp\"\
  );\nconnection.setClientInfo(\"ClientUser\",\"OracleUser\");\nconnection.setClientInfo(\"\
  ClientHostname\",\"OracleHost\");\n```\n\nConnection state tracking 是 JDBC 4.0 中添加的连接管理功能。Connection\
  \ state tracking 用于标识不可用的连接并关闭这些连接。Connection state tracking 由 WebLogic 连接池管理器使用\
  \ Connection 对象的 isValid() 方法实现：\n\n```\nif(!connection.isValid())\nconnection.close();\n\
  ```\n\nPreparedStatements 在连接池中默认会被池化，前提是数据库支持语句池化。语句池化减少了频繁使用的语句的打开、初始化和关闭开销。JDBC\
  \ 4.0 还添加了对 Statement 对象池化的支持。默认情况下，WebLogic Server 对所有 DBMS 或驱动程序池化语句。在 JDBC 4.0\
  \ 中，语句池化的支持与 WebLogic JDBC 应用程序无关。\n\nOracle JDBC 提供了对 JDBC API 的一些扩展，具有额外的方法。JDBC\
  \ 4.0 添加了一个名为 wrapper pattern 的新功能，可用于访问特定于厂商的 JDBC 资源。wrapper pattern 在 Wrapper\
  \ 接口中实现，该接口由以下接口扩展：\n\n- java.sql.Connection\n- java.sql.Statement\n- java.sql.DatabaseMetaData\n\
  - java.sql.ParameterMetaData\n- java.sql.ResultSetMetaData\n- java.sql.ResultSet\n\
  - javax.sql.DataSource\n\nOracle JDBC API 提供了 oracle.jdbc.OracleStatement 接口作为 java.sql.Statement\
  \ 接口的扩展。OracleStatement 接口可以被解包以创建其类型的对象。要创建 OracleStatement 对象，请使用 isWrapperFor()\
  \ 方法测试 Statement 对象是否为 OracleStatement 接口的包装器。如果 Statement 对象是包装器，则使用下面给出的 unwrap()\
  \ 方法解包 OracleStatement 接口：\n\n```\nClass class = Class.forName(\"oracle.jdbc.OracleStatement\"\
  );\nif(stmt.isWrapperFor(class))\n{\nOracleStatement oracleStmt = (OracleStatement)stmt.unwrap(class);\n\
  }\n```\n\nOracleStatement 对象可使用 defineColumnType() 方法设置列类型。定义列类型用于性能优化和数据类型转换。如果同一个语句对象用于运行不同的查询，则使用\
  \ clearDefines() 方法清除先前定义的列类型。将第一列的列类型设置为 OracleTypes.Number，第二列设置为 OracleTypes.VARCHAR：\n\
  \n```\noracleStmt.clearDefines();\noracleStmt.defineColumnType(1, OracleTypes.NUMBER);\n\
  oracleStmt.defineColumnType(2, OracleTypes.VARCHAR);\n```\n\nJDBC 4.0 还支持诸如 ROWID、NCLOB\
  \ 和 NBLOB 等数据类型。Oracle 数据库支持 ROWID 数据类型。Oracle 数据库表中的 ROWID 伪列标识表中的唯一行。将 ROWID 列添加到\
  \ SELECT 查询中：\n\n```\nResultSet resultSet=oracleStmt.executeQuery(\"Select ROWID,\
  \ CATALOGID, JOURNAL, PUBLISHER, EDITION, TITLE, AUTHOR from Catalog\");\n```\n\n\
  在 HTML 表格中添加 ROWID 列的列，并使用 ResultSet 接口中的 getRowId() 方法向其添加值：\n\n```\n<td><%=out.println(resultSet.getRowId(\"\
  ROWID\").toString());%></td>\n```\n\nJDBC 4.0 已增强对链式 SQLException 的支持。链式异常和链式原因可以使用\
  \ JDK 6.0 中引入的 FOR-EACH 循环检索。在错误 JSP 页面中，FOR-EACH 循环用于输出链式异常和链式原因。以前，getNextException()\
  \ 和 getCause() 方法被迭代调用以检索链式异常和链式原因：\n\n```\n<%@ page isErrorPage=\"true\" %>\n<%\n\
  for( Throwable e : exception )\n{\nout.println(\"Error encountered: \" + e);\n}\n\
  %>\n```\n\ncatalog.jsp 的 JDBC 4.0 版本如下所示：\n\n```\n<%@ page contentType=\"text/html\"\
  %>\n<%@ page import=\"java.sql.*,javax.sql.*,java.util.*,javax.naming.*, oracle.jdbc.OracleStatement\"\
  %>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html\">\n<title>WebLogic\
  \ Application</title>\n</head>\n<body>\n<%\nInitialContext ctx=new InitialContext();\n\
  DataSource ds=(DataSource)ctx.lookup(\"jdbc/OracleDS\");\nConnection connection=ds.getConnection();\n\
  connection.setClientInfo(\"ApplicationName\",\"OracleApp\");\nconnection.setClientInfo(\"\
  ClientUser\",\"OracleUser\");\nconnection.setClientInfo(\"ClientHostname\",\"OracleHost\"\
  );\nStatement stmt=connection.createStatement();\n```\n\nDatabaseMetaData metaData=connection.getMetaData();\n\
  if(metaData.supportsStatementPooling())\n{\n    if(stmt.isPoolable())\n    stmt.setPoolable(true);\n\
  }\nClass class = Class.forName(\"oracle.jdbc.OracleStatement\");\nif(stmt.isWrapperFor(class))\n\
  {\n    OracleStatement oracleStmt = (OracleStatement)stmt.unwrap(class);\n    oracleStmt.clearDefines();\n\
  \    oracleStmt.defineColumnType(1, OracleTypes.NUMBER);\n    oracleStmt.defineColumnType(2,\
  \ OracleTypes.VARCHAR);\n    oracleStmt.defineColumnType(3, OracleTypes.VARCHAR);\n\
  \    oracleStmt.defineColumnType(4, OracleTypes.VARCHAR);\n    oracleStmt.defineColumnType(5,\
  \ OracleTypes.VARCHAR);\n    oracleStmt.defineColumnType(6, OracleTypes.VARCHAR);\n\
  \    oracleStmt.defineColumnType(7, OracleTypes.VARCHAR);\n    ResultSet resultSet=oracleStmt.executeQuery(\"\
  Select ROWID,\nCATALOGID, JOURNAL, PUBLISHER, EDITION, TITLE, AUTHOR from Catalog\"\
  );\n%>\n<table border=\"1\" cellspacing=\"0\">\n    <tr>\n        <th>CatalogId</th>\n\
  \        <th>Journal</th>\n        <th>Publisher</th>\n        <th>Edition</th>\n\
  \        <th>Title</th>\n        <th>Author</th>\n    </tr>\n    <%\n    while (resultSet.next())\n\
  \    {\n%>\n<tr>\n    <td><%=out.println(resultSet.getRowId(\"ROWID\").toString());%></td>\n\
  \    <td><%=out.println(resultSet.getString(1));%></td>\n    <td><%=out.println(resultSet.getString(2));%></td>\n\
  \    <td><%=out.println(resultSet.getString(3));%></td>\n    <td><%=out.println(resultSet.getString(4));%></td>\n\
  \    <td><%=out.println(resultSet.getString(5));%></td>\n    <td><%=out.println(resultSet.getString(6));%></td>\n\
  </tr>\n<%\n}\nresultSet.close();\nstmt.close();\nconnection.close();\n}\n%>\n</table>\n\
  </body>\n</html>\n\n## 摘要\n\nWebLogic Server 9.x 引入了一个新功能，多数据源，即一组具有 JNDI 名称绑定的数据源。多数据源可最大化可用数据源。WebLogic\
  \ Server 8.1 也具有名为 MultiPools 的多数据源。任何池或多池都通过 DataSource 访问。对于 9.0 及更高版本，用于访问池或多池概念的\
  \ DataSource 已合并。在 WebLogic Server 9.x 中，WebLogic Server 8.1 中使用的连接池配置已被移除。WebLogic\
  \ Server 9.x 中的数据源配置提供了增强的连接请求故障转移和数据源之间的负载均衡。在支持 JDBC 4.0 的 WebLogic Server 版本中，可以使用\
  \ JDBC 4.0 的新功能，例如连接状态跟踪、Java SE 链式设施以及用于访问非标准资源的包装器模式。\n"
- "## 6 在 WebSphere Application Server 中配置 JDBC\n\nWebSphere Application Server 6.1\
  \ 是一个基于 J2EE 和 Web 服务技术的应用服务器，用于开发 J2EE 应用程序。WebSphere Application Server 用于开发 JDBC\
  \ 应用程序。IBM DB2 9 提供了一些新功能，适用于开发 JDBC 4.0 应用程序。DB2 9 已添加对 SQL XML 数据类型的支持，可与 SQLXML\
  \ Java 数据类型结合使用。它是 JDBC 4.0 中的一种新型数据类型，用于存储和检索 XML 文档。DB2 数据库服务器通过配置 JDBC Provider\
  \ 从 WebSphere Application Server 提供访问，该术语是应用服务器中的 WebSphere 专有术语。\n\n在本章中，我们将在 WebSphere\
  \ Application Server 6.1 中配置数据源以连接到 DB2 9 数据库。我们将部署一个 Web 应用程序到 WebSphere Application\
  \ Server，该应用程序包含一个 JSP，用于使用服务器中配置的数据源生成 HTML 表。我们将使用 DB2 JDBC Type 4 驱动程序创建到 DB2\
  \ 9 数据库的 JDBC 连接。Type 4 驱动程序相对于 Type 2 驱动程序具有优势：它提供对 DB2 数据库的直接访问。本章中您将了解以下内容：\n\
  \n- 在 WebSphere Application Server 6.1 中使用 DB2 9 数据库创建 JDBC Provider。\n- 在 WebSphere\
  \ Application Server 6.1 中使用 DB2 9 数据库创建数据源。\n- 从 JDeveloper 10g 部署 Web 应用程序到 WebSphere\
  \ Application Server 6.1 以连接 DB2 数据库 9。\n- Web 应用程序的 JDBC 4.0 版本。\n\n## 设置环境\n\n\
  在从 WebSphere Application Server 6.1 配置与 DB2 9 数据库的 JDBC 连接之前，需要进行以下初步设置：\n\n1. 从\
  \ http://www.ibm.com/developerworks/downloads/im/udb/?S_TACT=105AGX28&S_CMP=TRIALS\
  \ 下载并安装 DB2 9 数据库。\n2. 在 DB2 9 数据库服务器中创建示例数据库 SAMPLE。\n3. 在数据库中创建包含期刊文章目录的示例表。创建示例表的\
  \ SQL 脚本如下所示：\n4. 从 http://www14.software.ibm.com/webapp/download/preconfig.jsp?id=2005-01-19+10%3A47%3A53.647228&S_TACT=104CBW71&S_CMP=\
  \ 下载 WebSphere Application Server 6.1 并安装 WebSphere Application Server。\n\n```sql\n\
  CREATE TABLE DB2ADMIN.Catalog(CatalogId VARCHAR(25) PRIMARY KEY NOT NULL, Journal\
  \ VARCHAR(25), Section VARCHAR(25), Edition VARCHAR(25), Title VARCHAR(75), Author\
  \ VARCHAR(25))\n\nINSERT INTO DB2ADMIN.Catalog VALUES('catalog1', 'developerWorks',\
  \ 'Java Technology', 'Nov 2004', 'Getting started with enumerated types', 'Brett\
  \ McLaughlin');\n\nINSERT INTO DB2ADMIN.Catalog VALUES('catalog2', 'developerWorks',\
  \ 'XML', 'Apr 2005', 'Transform Eclipse navigation files to DITA navigation files',\
  \ 'Loretta Hicks');\n```\n\n## 配置 JDBC Provider\n\n在本节中，我们将从 WebSphere Application\
  \ Server 6.1 配置与 DB2 9 数据库的 JDBC 连接。从 First steps 控制台启动 WebSphere Application Server。从\
  \ First steps 控制台访问 WebSphere Administration 控制台，或使用 URL https://localhost:9043/ibm/console/logon.jsp。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_169_0.png)\n\n在登录页面，指定 **用户 ID** 和 **密码**，然后单击\
  \ **登录**。管理控制台页面显示。管理控制台页面提供配置 JDBC、部署应用程序、设置环境变量和定义登录配置的功能。\n\n选择 **资源 | JDBC |\
  \ JDBC 提供程序** 节点以配置新的 JDBC 提供程序。JDBC 提供程序用于访问数据库。它包含数据库、JDBC 驱动程序类型和驱动程序类的设置。\n\n\
  ![](img/553e44bc30e70d0d8e58278a7ece8da8_169_1.png)\n\n## 配置 JDBC in WebSphere Application\
  \ Server\n\n选择范围 Scope，Server 以定义新的 JDBC 提供程序。范围定义 JDBC 提供程序可用的级别。WebSphere 架构包含三个级别：单元、节点和服务器。单元是包含一组节点的行政域。节点是一组管理服务器进程的\
  \ WebSphere Application Server。应用服务器是 WebSphere Application Server 配置中的主要运行时组件。如果要使\
  \ JDBC Provider 可用于节点中的所有应用服务器，请选择节点作为范围。如果要使 JDBC Provider 可用于单元中的所有节点，请选择单元作为范围。选择新建以配置新的\
  \ JDBC 提供程序。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_170_0.png)\n\n在创建新的 JDBC\
  \ 提供程序窗口中，选择 DB2 作为数据库类型。如果要配置连接的数据库未列出，请为数据库类型选择用户定义。选择提供程序类型为 DB2 Universal JDBC\
  \ Driver Provider。对于 Windows 上的 DB2 数据库类型，提供程序类型 DB2 Universal JDBC Provider (XA)\
  \ 用于分布式事务。如果选择的数据库类型为用户定义，则指定提供程序类型用户定义 JDBC Provider。选择实现类型，连接池数据源。如果选择用户定义数据库类型作为实现类型，则也指定用户定义。如果选择提供程序类型\
  \ DB2 Universal JDBC Provider (XA)，则选择实现类型 XA DataSource 并单击下一步。\n\n\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_171_0.png)\n\
  \n**类路径** 字段指定类路径中的 JAR 文件。`db2jcc.jar`，其中包含 DB2 JDBC Type 4 驱动程序，以及 `db2jcc_license_cu.jar`，它是\
  \ DB2 数据库服务器的许可证文件，都包含在类路径设置中。**类路径** 字段还包括一些环境变量。指定保存为环境变量 `DB2UNIVERSAL_JDBC_DRIVER_PATH`\
  \ 的目录位置，用于 JDBC JAR 文件，然后单击 **下一步**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_171_1.png)\n\
  \n## 在 WebSphere Application Server 中配置 JDBC\n\n在“摘要”页面中，显示 JDBC 提供程序配置的摘要。现在，单击“完成”按钮。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_172_0.png)\n\n指定的设置应用于本地配置。单击“消息”框架中的“保存”链接后，更改将应用于主配置。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_172_1.png)\n\n已配置 DB2 数据库的 JDBC 提供程序，并将其添加到\
  \ JDBC 提供程序列表中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_173_0.png)\n\n## 配置数据源\n\
  \n我们将配置一个 JDBC 数据源，以从 DB2 数据库检索数据。我们已配置的 JDBC 提供程序为数据源提供驱动程序类。默认驱动程序类名为 `com.ibm.db2.jcc.DB2ConnectionPoolDataSource`。也可以指定另一个驱动程序类来代替默认值。要配置新的数据源，请选择\
  \ JDBC 提供程序 DB2 Universal JDBC Driver Provider。\n\n## 在 WebSphere Application Server\
  \ 中配置 JDBC\n\n在 **附加属性** 标题中单击 **数据源** 链接。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_174_0.png)\n\
  \n显示数据源表。现在，单击 **新建** 以添加新的数据源。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_174_1.png)\n\
  \n在 **创建数据源** 窗口中，指定数据源名称和 **JNDI 名称**。J2EE 连接器身份验证数据条目由 JDBC 数据源用于登录数据库。连接器身份验证数据条目定义数据库访问凭据。单击\
  \ **创建新的 J2C 认证别名** 链接以创建组件管理的身份验证别名。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_175_0.png)\n\
  \n## 在 WebSphere Application Server 中配置 JDBC\n\n显示 J2C 身份验证数据条目表。单击 **新建** 以添加 J2C\
  \ 身份验证数据条目。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_176_0.png)\n\n在 J2C 身份验证数据条目配置框架中，为该条目指定别名。还指定用于登录\
  \ DB2 数据库的 user id 和密码，然后单击 **应用**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_176_1.png)\n\
  \n单击 **保存** 将工作区更改保存到主配置。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_177_0.png)\n\
  \n添加了新的 J2C 身份验证数据条目。单击 **数据源** 链接以配置新的数据源。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_177_1.png)\n\
  \n## 在 WebSphere Application Server 中配置 JDBC\n\n在“数据源”表中单击“新建”以创建新的数据源。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_178_0.png)\n\
  \n为数据源指定 JNDI 名称。在“组件管理身份验证别名”字段中，选择我们之前配置的 J2C 身份验证别名，然后单击“下一步”。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_178_1.png)\n\
  \n在数据源属性窗口中，指定数据库名称（SAMPLE）、驱动程序类型（type 4）、服务器名称（localhost）和端口号（50000），然后单击“下一步”。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_179_0.png)\n\n在“摘要”页面中，显示数据源配置的摘要。现在，单击“完成”。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_179_1.png)\n\n## 在 WebSphere Application\
  \ Server 中配置 JDBC\n\n新数据源已添加到数据源表中。单击“保存”将数据源保存到主配置。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_180_0.png)\n\
  \n选择数据源复选框，然后单击“测试连接”以测试与 DB2 数据库的 JDBC 连接。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_180_1.png)\n\
  \n显示一条消息，表明与 DB2 数据库的 JDBC 连接成功。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_181_0.png)\n\
  \n通过在“附加属性”标题中选择“数据源”链接和“连接池属性”链接来配置其他连接池属性。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_181_1.png)\n\
  \n## 在 WebSphere Application Server 中配置 JDBC\n\n指定连接池属性。连接超时是应用程序在超时之前等待从连接池获取连接的最大秒数。最大连接数是连接池中的最大连接数。最小连接数是连接池中的最小连接数。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_182_0.png)\n\n## 从 JDeveloper 部署 Web\
  \ 应用程序到 WebSphere\n\n我们将开发一个 JSP 应用程序以从 DB2 数据库检索数据并在浏览器中显示数据。JDeveloper 没有连接到 WebSphere\
  \ 应用服务器或将应用程序部署到 WebSphere 的功能。JDeveloper 可用于创建可部署到 WebSphere 的 JSP。通过选择“文件 | 新建”创建应用程序。在“新建库”窗口中，在“类别”中选择“常规”，在“项目”中选择“应用程序”，然后单击“确定”。在“创建应用程序”窗口中指定应用程序名称，将应用程序模板选择为“无模板”，然后单击“确定”。在“创建项目”窗口中，指定项目名称并单击“确定”。应用程序和项目已添加到\
  \ JDeveloper。向项目添加 JSP。选择“文件 | 新建”，在“新建库”窗口中选择“Web 层 | JSP”。在“项目”中选择 JSP 并单击“确定”。在“创建\
  \ JSP 向导”中单击“下一步”。在 **Web 应用程序** 窗口中选择 J2EE 1.4，然后单击“下一步”。在 **JSP 文件** 窗口中指定文件名，然后单击“下一步”。由于未使用错误页面，请在\
  \ **错误页面选项** 中选择默认设置，然后单击“下一步”。在 **标记库** 窗口中单击“下一步”，因为我们不会使用任何标记库。在 **HTML 选项**\
  \ 窗口中单击“下一步”。在 **完成** 窗口中单击“完成”。JSP 和 `web.xml` 已添加到 WebSphere 应用程序。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_183_0.png)\n\
  \n在 JSP 中，创建 `InitialContext` 对象用于 JNDI 命名操作。使用 `lookup()` 方法在我们本章前面创建的数据源 JNDI\
  \ 名称上创建 `DataSource` 对象。使用 `getConnection()` 方法从 `DataSource` 对象创建 `Connection`\
  \ 对象：\n\n```\nInitialContext initialContext = new InitialContext();\njavax.sql.DataSource\
  \ ds = (javax.sql.DataSource) initialContext.\nlookup(\"jdbc/DB2\");\njava.sql.Connection\
  \ conn = ds.getConnection();\n```\n\n使用 `createStatement()` 方法从 `Connection` 对象创建\
  \ `Statement` 对象。使用 `Statement` 对象的 `executeQuery()` 方法运行 SQL 查询以从 DB2 数据库检索数据。查询运行并生成\
  \ `ResultSet` 对象：\n\n```\njava.sql.Statement stmt = conn.createStatement();\nResultSet\
  \ resultSet=stmt.executeQuery(\"Select * from Catalog\");\n```\n\n使用 `next()` 方法遍历结果集，并在\
  \ HTML 表格中显示数据。JSP 页面 `Catalog.jsp` 如下所示：\n\n```\n<%@ page contentType=\"text/html\"\
  %>\n<%@ page import=\"java.sql.*,javax.naming.*\" %>\n<html>\n<head>\n<meta http-equiv=\"\
  Content-Type\" content=\"text/html\">\n<title>WebSphere JSP Application</title>\n\
  </head>\n<body>\n<%\nInitialContext initialContext = new InitialContext();\njavax.sql.DataSource\
  \ ds = (javax.sql.DataSource)\ninitialContext.lookup(\"jdbc/DB2\");\njava.sql.Connection\
  \ conn = ds.getConnection();\njava.sql.Statement stmt = conn.createStatement();\n\
  ResultSet resultSet=stmt.executeQuery(\"Select * from Catalog\");%>\n<table border=\"\
  1\" cellspacing=\"0\">\n<tr>\n<th>CatalogId</th>\n<th>Journal</th>\n<th>Section</th>\n\
  <th>Edition</th>\n<th>Title</th>\n<th>Author</th>\n</tr>\n<%\nwhile (resultSet.next())\n\
  {\n%>\n<tr>\n<td><%=out.println(resultSet.getString(1));%></td>\n<td><%=out.println(resultSet.getString(2));%></td>\n\
  <td><%=out.println(resultSet.getString(3));%></td>\n<td><%=out.println(resultSet.getString(4));%></td>\n\
  <td><%=out.println(resultSet.getString(5));%></td>\n<td><%=out.println(resultSet.getString(6));%></td>\n\
  </tr>\n<%\n}\nresultSet.close();stmt.close();conn.close();\n%>\n</table>\n</body>\n\
  </html>\n```\n\n\n\n创建 Web 应用程序部署配置文件时，选择 **文件 | 新建**，在 **新建库** 窗口中，在类别中选择 **常规\
  \ | 部署配置文件**。在项目中，选择 **WAR 文件** 并单击确定。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_185_0.png)\n\
  \n## 在 WebSphere Application Server 中配置 JDBC\n\n在 **创建部署配置文件** 窗口中，指定部署配置文件名称 webapp1，然后单击确定。在\
  \ **WAR 部署配置文件属性** 窗口中，选择 **常规** 节点。指定 J2EE Web 上下文根 websphere（例如）并单击确定。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_186_0.png)\n\
  \n创建 Web 应用程序部署配置文件。右键单击部署配置文件并选择 **部署到 EAR 文件**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_187_0.png)\n\
  \n## 在 WebSphere Application Server 中配置 JDBC\n\n在项目部署目录中创建 webapp1.ear 文件。将 webapp1.ear\
  \ 文件复制到 `C:\\Program Files\\IBM\\WebSphere\\AppServer\\installableApps` 目录。向 WebSphere\
  \ 服务器安装 webapp1 Web 应用程序。在 WebSphere 管理控制台中选择 **应用程序 | 安装新应用程序** 节点，并选择 webapp1.ear\
  \ 文件作为要安装的应用程序。单击 **下一步** 按钮。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_188_0.png)\n\
  \n选择默认安装选项，然后单击 **下一步**。webapp1 企业应用程序有一个 Web 模块 webapp1.war。在 **将模块映射到服务器** 窗口中，指定要部署\
  \ Web 模块到的服务器。选择 webapp1.war 模块，选择 WebSphere 服务器节点并单击 **应用**，然后单击下一步。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_189_0.png)\n\
  \n在 **为 Web 模块映射虚拟主机** 框架中，选择 webapp1.war 文件旁边的复选框，并选择 default_host 作为虚拟主机。单击 **下一步**\
  \ 按钮。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_189_1.png)\n\n## 在 WebSphere Application\
  \ Server 中配置 JDBC\n\n在摘要页面中单击完成以创建 Web 应用程序部署配置。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_190_0.png)\n\
  \nWeb 应用程序已安装在 WebSphere 应用程序服务器中，并且部署更改已保存到本地配置。单击保存以将更改保存到主配置。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_190_1.png)\n\
  \n选择 **应用程序 | 企业应用程序** 链接以显示已安装的应用程序。webapp1 Web 应用程序列在已安装企业应用程序表中。选择 webapp1 Web\
  \ 应用程序旁边的复选框，然后单击 **启动**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_191_0.png)\n\
  \nWeb 应用程序 webapp1 已在 WebSphere 应用程序服务器上启动。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_191_1.png)\n\
  \n使用 URL `http://localhost:9080/websphere/Catalog.jsp` 在服务器中运行 `Catalog.jsp`。JSP\
  \ 应用程序在服务器中运行，DB2 数据库中的数据在浏览器中显示。\n\n| 目录 ID | 期刊 | 部分 | 版本 | 标题 | 作者 |\n|---|---|---|---|---|---|\n\
  | catalog1 | developerWorks | Java Technology | Nov 2004 | Getting started with\
  \ enumerated types | Brett McLaughlin |\n| catalog2 | developerWorks | XML | Apr\
  \ 2005 | Transform Eclipse navigation files to DITA navigation files | Loretta Hicks\
  \ |\n\n## JDBC 4.0 版本\n\nWebSphere 应用程序服务器 6 不支持 JDBC 4.0 规范，但 IBM 提供了支持 JDBC 4.0\
  \ 的 JDBC 驱动程序。IBM Data Server Driver 和 SQLJ 版本 4.0 支持 JDBC 4.0。它们可以从 `https://www14.software.ibm.com/webapp/iwm/web/preLogin.do?lang=en_US&source=swg-idsjs11`\
  \ 获取。支持 JDBC 4.0 的 WebSphere 应用程序服务器版本会将 IBM Data Server Driver for JDBC 和 SQLJ\
  \ 中的 `db2jcc4.jar` 添加到服务器类路径中。此外，WebSphere 服务器必须在 JDK 6.0 上运行才能使用 JDBC 4.0 功能。\n\
  \nJDBC 4.0 已添加对连接管理的支持，其中包括跟踪连接状态并根据客户端信息属性识别连接的功能。连接状态跟踪可用于跟踪不可用但仍处于打开状态并在连接池中可用的连接。不可用的连接会导致性能下降。在\
  \ JDBC 4.0 的新功能之前，如果连接池中积累了不可用的连接，则必须重新初始化连接池。借助连接池管理器实现的连接状态跟踪功能，可以使用 `Connection`\
  \ 接口的 `isValid()` 方法获取连接状态。如果 `Connection` 对象不可用，则 `Connection` 对象将被关闭。\n\n```\n\
  if (!connection.isValid())\n    connection.close();\n```\n\nJDBC 4.0 中添加的另一个新的连接管理功能是连接跟踪，这与连接状态跟踪不同。在连接跟踪中，会在\
  \ `Connection` 对象上设置一些客户端信息属性。如果某些连接降低了应用程序性能，则会使用客户端信息属性跟踪这些连接。客户端信息属性使用 `setClientInfo()`\
  \ 方法设置在 `Connection` 对象上，并使用 `getClientInfo()` 方法检索。在 `catalog.jsp` 中，按如下方式设置客户端信息属性\
  \ `ApplicationName`、`ClientUser` 和 `ClientHostname`：\n\n```\nconnection.setClientInfo(\"\
  ApplicationName\",\"WebSphereApp\");\nconnection.setClientInfo(\"ClientUser\",\"\
  WebSphereUser\");\nconnection.setClientInfo(\"ClientHostname\",\"WebSphereHost\"\
  );\n```\n\nPreparedStatement 默认情况下会被池化，并提供 PreparedStatement 对象的回收，而不是创建新的 PreparedStatement\
  \ 对象。频繁使用的 PreparedStatement 对象无需为每个客户端请求打开、初始化和关闭。JDBC 4.0 还引入了 Statement 池化，其中频繁使用的\
  \ Statement 对象不会被关闭，而是返回到语句池，供其他客户端使用。要向连接池添加语句池化：首先，使用 DatabaseMetaData 接口的 supportsStatementPooling()\
  \ 方法测试数据库是否支持语句池化。其次，使用 isPoolable() 方法测试 Statement 对象是否可池化。如果可池化，则可以使用 setPoolable(true)\
  \ 方法对 Statement 对象进行池化：\n\n```\njava.sql.Statement stmt = conn.createStatement();\n\
  DatabaseMetaData metaData=connection.getMetaData();\nif(metaData.supportsStatementPooling())\n\
  {\nif(stmt.isPoolable())\nstmt.setPoolable(true);\n}\n```\n\nJDBC 4.0 已引入对包装器模式的支持，可通过该模式访问非标准厂商特定的\
  \ JDBC 资源。包装器模式在 Wrapper 接口中实现。应作为 JDBC API 扩展提供的 JDBC 接口应扩展 Wrapper 接口。在 IBM Data\
  \ Server Driver for JDBC 和 SQLJ 中，Wrapper 接口由 com.ibm.db2.jcc 包中的以下接口扩展：\n\n- DB2Connection.\n\
  - DB2BaseDataSource.\n- DB2SimpleDataSource.\n- DB2Statement.\n- DB2ResultSet.\n\
  - DB2DatabaseMetaData.\n\n厂商特定接口在 JDBC API 中提供额外的方法。例如，使用包装器模式创建 DB2Statement 对象以使用\
  \ setDB2ClientProgramId() 方法，该方法在 DB2Statement 接口中设置来自连接的程序 ID。使用 isWrapperFor()\
  \ 方法测试 Statement 对象是否为 DB2Statement 接口的包装器。如果 Statement 对象是包装器，则使用 unwrap() 方法解包\
  \ DB2Statement 接口以创建 DB2Statement 对象。此外，调用 DB2Statement 对象的 setDB2ClientProgramId()\
  \ 方法：\n\n```\nClass class = Class.forName(\"com.ibm.db2.jcc.DB2Statement\");\nif(stmt.isWrapperFor(class))\n\
  {\ncom.ibm.db2.jcc.DB2Statement db2Stmt = (com.ibm.db2.jcc.\nDB2Statement) stmt.unwrap(class);\n\
  db2Stmt.setDB2ClientProgramId(\"WebSphereprogram\");\n}\n```\n\nJDBC 4.0 已引入对 SQL\
  \ ROWID 数据类型的支持。ROWID 类型列值可以使用 getRowId() 方法检索。ROWID 在数据库表中唯一标识一行，是访问行的最快方法。由于 DB2\
  \ 数据库支持 ROWID 数据类型，因此在 SELECT 查询中添加 ROWID 列：\n\n```\nResultSet resultSet=db2Stmt.executeQuery(\"\
  Select ROWID, CATALOGID,\nJOURNAL, PUBLISHER, EDITION, TITLE, AUTHOR from Catalog\"\
  );\n```\n\n使用 ResultSet 接口的 getRowId() 方法检索 ROWID 列值：\n\n```\n<td><%=out.println(resultSet.getRowId(\"\
  ROWID\").toString());%></td>\n```\n\n在 JDK 5.0 之前，集合必须使用迭代器和索引变量进行迭代。JDK 5.0 引入了增强的\
  \ FOR 循环，可在没有迭代器和索引变量的情况下迭代集合。例如，如果要迭代 java.util.Collection 中的 String 对象，则需要检索 Collection\
  \ 中的 String 对象。迭代器将使用 for 循环创建。Collection 中的 String 对象使用 next() 方法检索：\n\n```\nfor(Iterator\
  \ i = c.iterator(); i.hasNext(); )\n{\nString str = (String) i.next();\n}\n```\n\
  \n在 JDK 5.0 中引入的增强 for 循环可用于检索字符串集合中的 String 对象：\n\n```\nfor(String string : c)\n\
  {\nString str =string\n}\n```\n\n\n\nSQLException 可能具有链式异常，并且 SQLException 的原因也可能具有链式原因。使用增强\
  \ for 循环处理链式异常，SQLException 的链式原因可以按如下方式输出：\n\n```\nfor(Throwable e : exception)\n\
  {\n    out.println(\"Error encountered: \" + e);\n}\n```\n\n下面列出了用于检索 DB2 UDB 数据库数据并在\
  \ HTML 表格中显示的 Web 应用程序 JSP catalog.jsp 的 JDBC 4.0 版本：\n\n```\n<%@ page contentType=\"\
  text/html\"%>\n<%@ page import=\"java.sql.*, javax.naming.*, com.ibm.db2.jcc.DB2Statement\"\
  \ %>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html\">\n\
  <title>WebSphere JSP Application</title>\n</head>\n<body>\n<%\n    InitialContext\
  \ initialContext = new InitialContext();\n    javax.sql.DataSource ds = (javax.sql.DataSource)\n\
  \    initialContext.lookup(\"jdbc/DB2DataSource\");\n    java.sql.Connection conn\
  \ = ds.getConnection();\n    conn.setClientInfo(\"ApplicationName\",\"WebSphereApp\"\
  );\n    conn.setClientInfo(\"ClientUser\",\"WebSphereUser\");\n    conn.setClientInfo(\"\
  ClientHostname\",\"WebSphereHost\");\n    java.sql.Statement stmt = conn.createStatement();\n\
  \    DatabaseMetaData metaData=conn.getMetaData();\n    if(metaData.supportsStatementPooling())\n\
  \    {\n        if(stmt.isPoolable())\n        stmt.setPoolable(true);\n    }\n\
  \    Class cls = Class.forName(\"com.ibm.db2.jcc.DB2Statement\");\n    if(stmt.isWrapperFor(cls))\n\
  \    {\n        com.ibm.db2.jcc.DB2Statement db2Stmt = (com.ibm.db2.jcc.DB2Statement)\
  \ stmt.unwrap(cls);\n        db2Stmt.setDB2ClientProgramId(\"WebSphereprogram\"\
  );\n        ResultSet resultSet=db2Stmt.executeQuery(\"Select ROWID, CATALOGID,\
  \ JOURNAL, PUBLISHER, EDITION, TITLE, AUTHOR from Catalog\");\n%>\n```\n\n```\n\
  <table border=\"1\" cellspacing=\"0\">\n<tr>\n<th>RowId</th>\n<th>CatalogId</th>\n\
  <th>Journal</th>\n<th>Section</th>\n<th>Edition</th>\n<th>Title</th>\n<th>Author</th>\n\
  </tr>\n<%\nwhile (resultSet.next())\n{\n%>\n<tr>\n<td><%=out.println(resultSet.getRowId(\"\
  ROWID\").toString());%></td>\n<td><%=out.println(resultSet.getString(1));%></td>\n\
  <td><%=out.println(resultSet.getString(2));%></td>\n<td><%=out.println(resultSet.getString(3));%></td>\n\
  <td><%=out.println(resultSet.getString(4));%></td>\n<td><%=out.println(resultSet.getString(5));%></td>\n\
  <td><%=out.println(resultSet.getString(6));%></td>\n</tr>\n<%\n}\nresultSet.close();\n\
  stmt.close();\nconn.close();\n}\n%>\n</table>\n</body>\n</html>\n```\n\n## 摘要\n\n\
  WebSphere 6.1 应用服务器具备创建 JDBC 提供程序和具有关系数据源的 JDBC 数据源的功能。本章中，我们在 WebSphere 中配置了与 DB2\
  \ 9 数据库的 JDBC 连接。IBM 的 DB2 数据库与 IBM 的 WebSphere 应用服务器的组合适合于 JDBC 应用程序的开发。DB2 V9\
  \ 支持 SQL XML 数据类型，该数据类型可与 JDBC 4.0 中的一种新的 Java 数据类型 SQLXML 一起使用。IBM Data Server\
  \ Driver for JDBC and SQLJ 版本 4.0 支持 JDBC 4.0 规范。\n"
- "## 7 XML SQL 实用程序\n\n**可扩展标记语言** (XML) 是 Web 上数据交换的标准媒介。XML 数据交换的示例是网络订阅源（RSS 订阅源和\
  \ Atom 订阅源）以及 Web 服务。使用 XML 文档交换的数据可能需要存储在关系数据库中，或者可能需要从数据库表生成 XML 文档。XML 文档是一种层次化数据结构，其中各种元素可以映射到数据库表中的列。因此，通过将各种元素映射到表，您可以将\
  \ XML 存储在关系数据库中，此映射过程称为 XML 到 SQL 映射技术。Oracle 创建了 **XML SQL 实用程序** (XSU) Java API\
  \ 以将 XML 映射到 SQL 并将 SQL 映射到 XML。将 XML 文档映射到的表必须在将 XML 文档映射到数据库之前创建。使用 XSU，XML 元素映射到数据库表列。使用\
  \ XSU 将 XML 文档映射到数据库表不会存储文档的属性。在存储之前，可以通过对 XML 文档应用 **可扩展样式表语言转换** (XSLT) 来存储属性，将要存储的属性转换为元素，这些元素可以映射到列。使用\
  \ XSU，可以更新、删除和检索数据库中的数据。使用 XSU 生成的 XML 文档不包含属性。可以通过对使用 XSU 获得的文档应用 XSLT 来向 XML 文档添加属性。\n\
  \nJDBC 4.0 引入了 SQLXML Java 数据类型，我们在第 1 章中讨论过它，用于在 SQL XML 数据类型的列中存储和访问 XML 文档。但某些数据库驱动程序，例如\
  \ Oracle 数据库 11g JDBC 驱动程序，尚未支持 SQLXML 数据类型。此外，XSU 具有将 XSLT 样式表应用于从数据库表映射到 XML 文档的数据的优势。我们将使用\
  \ Oracle 数据库 11g JDBC 4.0 驱动程序用于 XML SQL 实用程序，以利用 JDBC 4.0 的某些功能，例如自动驱动程序加载和增强的链式异常支持。\n\
  \nJDeveloper 10.1.3 包含一个 XSU 实用程序库，用于将 XML 文档存储在 SQL 数据库中并从数据库中检索它。类 `OracleXMLSave`\
  \ 用于将 XML 文档存储在数据库表中，并且元素标签映射到数据库列。类 `OracleXMLQuery` 用于从数据库表生成 XML 文档。数据库表列作为元素标签映射到\
  \ XML 文档。使用 `OracleXMLSave` 类将 XML 文档映射到数据库表不包括 XML 文档元素属性的映射；我们可以通过将属性转换为元素来存储元素属性。本章以示例形式讨论了将包含元素和属性的\
  \ XML 文档映射到 Oracle 数据库 10g 表，以及将数据库列映射到包含属性的 XML 文档的步骤。您不受限于使用 Oracle 通过 XSU 存储\
  \ XML 文档。您也可以轻松使用 MySQL 等其他关系数据库。XML 文档 `catalog.xml` 用作映射到数据库表的示例，并列于下方：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<catalog>\n    <journal title=\"Oracle\
  \ Magazine\" publisher=\"Oracle Publishing\" edition=\"July-August 2005\">\n   \
  \     <catalogId>catalog1</catalogId>\n        <article section=\"Technology\">\n\
  \            <title> Tuning Undo Tablespace </title>\n            <author> Kimberly\
  \ Floss </author>\n        </article>\n    </journal>\n    <journal title=\"Oracle\
  \ Magazine\" publisher=\"Oracle Publishing\" edition=\"Nov-Dec 2003\">\n       \
  \ <catalogId>catalog2</catalogId>\n        <article section=\"DEVELOPER\">\n   \
  \         <title>Starting with Oracle ADF</title>\n            <author>Steve Muench</author>\n\
  \        </article>\n    </journal>\n</catalog>\n```\n\n在本章中，您将学习如何：\n- 使用 XSU 将\
  \ XML 文档映射到数据库表\n- 使用 XSU 从 XML 文档更新数据库表\n- 使用 XSU 从 XML 文档删除数据库表行\n- 使用 XSU 将数据库表映射到\
  \ XML 文档\n\n## 设置环境\n\n我们需要创建一个 JDeveloper 项目来使用 XML SQL 实用程序存储 XML 文档。在 JDeveloper\
  \ 项目中，通过选择 File | New 创建 XML 文档 catalog.xml。在 New Gallery 窗口中，在 Categories 中选择 General\
  \ | XML，在 Items 中选择 XML Document。还添加 XML 文件 catalog-update.xml 和 catalog-delete.xml。通过选择\
  \ File | New 在 JDeveloper 项目中创建 XSL 样式表 input.xsl 和 output.xsl。本章还列出了上述提到的 XML 文件和\
  \ XSL 样式表。XML 文档 catalog-update.xml 和 catalog-delete.xml，以及 XSLT 样式表 input.xsl 和\
  \ output.xsl 在本章后面列出。将 catalog.xml、catalog-delete.xml、catalog-update.xml、input.xsl\
  \ 和 output.xsl 的列表复制到 JDeveloper XSU 项目中。在 New Gallery 窗口中，在 Categories 中选择 General\
  \ | XML，在 Items 中选择 XSL Style Sheet。通过选择 File | New 在 JDeveloper 项目中创建一个 Java 应用程序\
  \ XMLToDatabase.java。在 New Gallery 窗口中，在 Categories 中选择 General，在 Items 中选择 Java\
  \ Class。XSU 应用程序的目录结构如下所示：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_199_0.png)\n\
  \n\n\n## XML SQL Utility\n\n我们需要向项目中添加一些库和 JAR 文件。由于我们使用的是 JDBC 4.0 驱动程序，因此需要将 JDBC\
  \ 4.0 驱动程序 JAR 文件添加到项目库中。从 http://www.oracle.com/technology/software/tech/java/sqlj_jdbc/htdocs/jdbc_111060.html\
  \ 下载 Oracle Database 11g JDBC 驱动程序的 JAR 文件 ojdbc6.jar。选择 Tools | Project Properties，并在\
  \ Project Properties 窗口中选择 Libraries。选择 Add Library 按钮以添加 Oracle XML SQL Utility\
  \ 和 Oracle XML Parser v2 库。选择 Add Jar/Directory 按钮以添加 <JDeveloper>/rdbms/jlib/xdb.jar\
  \ 和 ojdbc6.jar，其中 <JDeveloper> 为 JDeveloper 安装目录。下面显示了 XML SQL Utility 所需的 JAR 文件和库：\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_200_0.png)\n\nOracle 数据库 11g JDBC 4.0\
  \ 驱动程序需要 JDK 6.0。我们需要将 J2SE 版本设置为 JDK 6.0，然后从 http://java.sun.com/javase/downloads/index.jsp\
  \ 下载并安装 JDK 6.0。选择 Tools | Project Properties 将 J2SE 版本设置为 JDK 6.0，并在 Project Properties\
  \ 窗口中选择 Libraries。J2SE Version 字段指定 JDeveloper 中 Java 应用程序使用的 J2SE 版本。在 J2SE Version\
  \ 中单击 Change 按钮，并在 Edit J2SE Definition 窗口中单击 New 以定义新的 J2SE 版本定义。在 Create J2SE\
  \ 窗口中选择 JDK 6.0 的 J2SE 可执行文件并单击 OK。JDK 6.0 的 J2SE 定义将被添加到 Edit J2SE Definition 窗口中。选择\
  \ J2SE 6.0 定义并在 Edit J2SE Definition 窗口中单击 OK。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_201_0.png)\n\
  \nJDK 6.0 J2SE 定义将被添加到 Project Properties 窗口中的 J2SE Version 字段中。现在，单击 OK。\n\n同时安装包含示例模式的\
  \ Oracle 数据库 10g。Oracle 数据库 11g JDBC 驱动程序可与 Oracle 数据库 10g 配合使用，如果使用支持 JDBC 4.0\
  \ 的应用服务器，则所有 JDBC 4.0 功能都可能带来优势。在数据库中创建一个数据库实例和一个数据库表 JOURNAL。示例 XML 文档将映射到数据库表。下面说明了用于在示例模式\
  \ OE 中创建数据库表的 SQL 脚本：\n\n```\nCREATE TABLE OE.JOURNAL (CATALOGID VARCHAR(255) PRIMARY\
  \ KEY, JOURNAL_TITLE VARCHAR(255), PUBLISHER VARCHAR(255), EDITION VARCHAR(255),\
  \ ARTICLE_SECTION VARCHAR(255), TITLE VARCHAR(255), AUTHOR VARCHAR(255));\n```\n\
  \n## XML Document to SQL Database Mapping\n\n如果 XML 文档已使用 XSU 存储，则只会存储 XML 文档中的元素标签。XML\
  \ 文档中的属性不会被存储。XML 文档中的属性可以通过映射到元素来存储。可以通过对 XML 文档应用 XSLT 样式表将属性转换为元素。本节讨论将包含属性的\
  \ XML 文档存储到数据库表中的过程。XML 文档使用 OracleXMLSave 类存储到数据库表中，该类在 XMLToDatabase.java 应用程序中导入。\n\
  \n创建与数据库的连接。如果我们使用的是 JDBC 3.0 驱动程序，我们将使用 registerDriver(Driver) 方法通过 DriverManager\
  \ 注册 Oracle JDBC 驱动程序。JDBC 4.0 使用 Java SE 服务提供者机制添加了自动驱动程序注册支持。Oracle 数据库 11g JDBC\
  \ 4.0 驱动程序 JAR 文件 ojdbc6.jar 包含 META-INF/services/java.sql.Driver 文件。对于 Oracle JDBC\
  \ 驱动程序，该文件包含：\n\n```\noracle.jdbc.OracleDriver\n```\n\n当使用 getConnection() 方法从 DriverManager\
  \ 请求连接时，java.sql.Driver 文件中指定的所有驱动程序类都可供 DriverManager 使用。因此，我们将不会通过 DriverManager\
  \ 注册 Oracle JDBC 驱动程序。使用 getConnection(String url, String user, String password)\
  \ 方法从 DriverManager 获取连接：\n\n```\nConnection conn =\nDriverManager.getConnection(\"\
  jdbc:oracle:thin:@<host>:<port>:<SID>\",\n\"<user>\",\"<password>\");\n```\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_202_0.png)\n\
  \n<host> 是数据库主机。\n<port> 是数据库端口。\n<SID> 是数据库 SID。\n<user> 是登录数据库的用户名。\n<password>\
  \ 是登录数据库的密码。\n<host>、<port> 和 <SID> 的值可以从 <Oracle 10g>/NETWORK/ADMIN/tnsnames.ora\
  \ 文件中获取。\n\n在获取 Oracle 数据库连接时可能会生成 SQLException。生成的 SQLException 可能包含链式异常和链式原因。JDBC\
  \ 4.0 已添加对 Java SE 链式异常设施的支持，该设施也称为原因设施。在 JDBC 4.0 之前，必须递归调用 getNextException()\
  \ 和 getCause() 方法来检索链式异常和原因。JDBC 4.0 使用 J2SE 6.0 中引入的 for 循环增强了对这些链式异常的支持。SQLException\
  \ 接口实现了 Iterable 接口。链式异常可以使用下面的增强 for-each 循环输出：\n\n```\ncatch(SQLException exception)\n\
  {\n    for(Throwable e : exception )\n    {\n        System.out.println(\"Error\
  \ encountered: \" + e);\n    }\n}\n```\n\n我们需要创建一个 OracleXMLSave 类对象以将 XML 文档保存到数据库表\
  \ JOURNAL 中。\n\n```\nOracleXMLSave oracleXMLSave =new OracleXMLSave(conn, \"JOURNAL\"\
  );\n```\n\nJOURNAL 是在 Setting the Environment 部分创建的数据库表。将给定示例 XML 文档中的属性转换为元素标签。通过对\
  \ XML 文档应用 XSLT 将属性转换为元素标签。使用 setXSLT(Reader, String) 方法在 OracleXMLSave 对象上设置 XSLT。String\
  \ 参数指定用于包含导入和外部实体的 URL。\n\n```\nReader xsltReader=new FileReader(new File(\"input.xsl\"\
  ));\noracleXMLSave.setXSLT(xsltReader, null);\n```\n\nXSLT input.xslt 用于将给定 XML\
  \ 文档中的属性转换为元素，作为示例：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<xsl:stylesheet\
  \ version=\"1.0\" xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\">\n<xsl:output\
  \ method=\"xml/text\" omit-xml-declaration=\"no\"/>\n<xsl:template match=\"/\">\n\
  <xsl:element name=\"catalog\">\n<xsl:apply-templates select=\"catalog/journal\"\
  />\n</xsl:element>\n</xsl:template>\n<xsl:template match=\"journal\">\n<xsl:element\
  \ name=\"journal\">\n<xsl:element name=\"journal_title\">\n<xsl:value-of select=\"\
  @title\"/>\n</xsl:element>\n<xsl:element name=\"catalogId\">\n<xsl:value-of select=\"\
  catalogId\"/>\n</xsl:element>\n<xsl:element name=\"publisher\">\n<xsl:value-of select=\"\
  @publisher\"/>\n</xsl:element>\n<xsl:element name=\"edition\">\n<xsl:value-of select=\"\
  @edition\"/>\n</xsl:element>\n<xsl:apply-templates select=\"article\"/>\n</xsl:element>\n\
  </xsl:template>\n<xsl:template match=\"article\">\n<xsl:element name=\"article_section\"\
  >\n<xsl:value-of select=\"@section\"/>\n</xsl:element>\n<xsl:copy-of select=\"title\"\
  />\n<xsl:copy-of select=\"author\"/>\n</xsl:template>\n</xsl:stylesheet>\n```\n\n\
  input.xslt 转换将 XML 文档中的属性 title 和 section 转换为元素 journal_title 和 article_title。设置行封闭元素的标签。将行标签设置为\
  \ null 意味着未定义行标签，文档的顶级元素对应于数据库表行。行标签设置为 journal。示例 XML 文档中的每个 journal 标签对应于数据库表中的一行。表中的每一行代表一个期刊条目；期刊条目是行封闭元素。\n\
  \n```\noracleXMLSave.setRowTag(\"journal\");\n```\n\n使用 setKeyColumnList(String[]\
  \ keyColNames) 方法设置数据库表中包含主键的列。将 CATALOGID 设置为主键列：\n\n```\nString [] keyColNames\
  \ = new String[1];\nkeyColNames[0] = \"CATALOGID\";\noracleXMLSave.setKeyColumnList(keyColNames);\n\
  ```\n\nXSU 根据元素标签名称将 XML 文档元素映射到数据库表列。要匹配不区分大小写的元素标签，请将忽略大小写设置为 true。\n\n```\noracleXMLSave.setIgnoreCase(true);\n\
  ```\n\n从 XML 文档 catalog.xml 创建一个 InputStream。\n\n```\nInputStream input=new FileInputStream(new\
  \ File(\"catalog.xml\"));\n```\n\n使用 insertXML(InputStream) 方法将示例 XML 文档映射到数据库表。insertXML()\
  \ 方法被重载，输入可以指定为 Document 对象、InputStream 对象、Reader 对象、String 对象或 URL 对象：\n\n```\n\
  oracleXMLSave.insertXML(input);\n```\n\nXSLT input.xslt 会应用于 XML 文档。XML 文档（其属性已转换为元素）会被存储到数据库中。使用\
  \ close() 方法关闭 OracleXMLSave 对象：\n\n```\noracleXMLSave.close();\n```\n\nXMLToDatabase\
  \ 应用程序在章节后面完整列出。可以通过注释掉不需要的方法来运行选定的操作。例如，要将 XML 文档映射到数据库表，请注释掉除 xmlToSQL() 方法之外的所有方法的调用。要运行\
  \ XMLToDatabase.java 应用程序，在 JDeveloper 中右键单击应用程序节点并选择 Run。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_205_0.png)\n\
  \nXML 文档 input.xml 被映射到 Oracle 数据库表 JOURNAL。\n\n## 从 XML 文档更新数据库\n\n在本节中，我们将使用 OracleXMLSave\
  \ 类从 XML 文档更新数据库表，并使用 Connection 对象创建一个 OracleXMLSave 对象。JOURNAL 是需要修改的数据库表。\n\n\
  ```\nOracleXMLSave oracleXMLSave =new OracleXMLSave(conn, \"JOURNAL\");\n```\n\n\
  使用 setRowTag(String) 方法设置行包围元素标签，并将行标签设置为 journal。还将忽略大小写设置为 true。\n\n```\noracleXMLSave.setRowTag(\"\
  journal\");\noracleXMLSave.setIgnoreCase(true);\n```\n\n使用 setKeyColumnList(String[])\
  \ 方法设置键列，并将 CATALOGID 设置为键列。\n\n```\nString [] keyColNames = new String[1];\nkeyColNames[0]\
  \ = \"CATALOGID\";\noracleXMLSave.setKeyColumnList(keyColNames);\n```\n\n指定要更新的列数组，并使用\
  \ setUpdateColumnList(String[]) 方法指定要更新的列。我们将使用 XML 文档修改 EDITION 列和 TITLE 列。\n\n\
  ```\nString[] updateColNames = new String[2];\nupdateColNames[0] = \"EDITION\";\n\
  updateColNames[1] = \"TITLE\";\noracleXMLSave.setUpdateColumnList(updateColNames);\n\
  ```\n\n数据库表中要更新的数据在 XML 文档中指定。XML 文档 catalog-update.xml 指定了一个 catalogId 为 \"catalog2\"\
  \ 的 journal 元素。仅当表 JOURNAL 中行 catalogId 包含 catalog2 时，才会修改 EDITION 和 TITLE 列。catalog-update.xml\
  \ 如下所示：\n\n```\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<catalog>\n<journal>\n\
  <catalogId>catalog2</catalogId>\n<journal_title>Oracle Magazine</journal_title>\n\
  <publisher>Oracle Publishing</publisher>\n<edition>September-October 2005</edition>\n\
  <article_section>Developer</article_section>\n<title>Creating Search Pages</title>\n\
  <author>Steve Muench</author>\n</journal>\n</catalog>\n```\n\n从 catalog-update.xml\
  \ 创建一个 InputStream 对象。\n\n```\nInputStream input=new FileInputStream(new File(\"\
  catalog-update.xml\"));\n```\n\n使用 updateXML(InputStream) 方法更新数据库表 JOURNAL。\nupdateXML()\
  \ 方法被重载，数据库表行可以从以下之一更新：Document 对象、InputStream 对象、Reader 对象、String 对象或 URL 对象。使用\
  \ close() 方法关闭 OracleXMLSave 对象。\n\n```\noracleXMLSave.updateXML(input);\noracleXMLSave.close();\n\
  ```\n\n要更新数据库表 JOURNAL，请在 XMLToDatabase.java 应用程序中注释掉除 updateDatabase() 方法之外的所有方法调用。结果，数据库表\
  \ JOURNAL 得到更新。\n\n## 在数据库中删除一行\n\n我们将使用 XML SQL 实用程序删除数据库表行。可以通过在 XML 文档中指定对应于键列的元素标签来删除数据库表行。示例\
  \ XML 文档 catalog-delete.xml 指定了 catalogId 为 \"catalog2\"。我们将从表 JOURNAL 中删除主键列 CATALOGID\
  \ 的值为 \"catalog2\" 的行，如 catalog-delete.xml 所示：\n\n```\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<catalog>\n<journal>\n<catalogId>catalog2</catalogId>\n</journal>\n</catalog>\n\
  ```\n\n我们必须创建一个 OracleXMLSave 对象，设置行包围标签并将忽略大小写设置为 true，如上一节所述。\n\n```\nOracleXMLSave\
  \ oracleXMLSave =new OracleXMLSave(conn, \"JOURNAL\");\noracleXMLSave.setRowTag(\"\
  journal\");\noracleXMLSave.setIgnoreCase(true);\n```\n\n使用 setKeyColumnList(String[]\
  \ keyColumns) 方法设置键列，并将 CATALOGID 设置为键列。\n\n```\nString [] keyColNames = new String[1];\n\
  keyColNames[0] = \"CATALOGID\";\noracleXMLSave.setKeyColumnList(keyColNames);\n\
  ```\n\n从 catalog-delete.xml 文档创建 InputStream。\n\n```\nInputStream input=new FileInputStream(new\
  \ File(\"catalog-delete.xml\"));\n```\n\n使用 deleteXML(InputStream) 方法删除数据库表行。deleteXML()\
  \ 方法被重载，数据库表行可以使用以下之一删除：Document 对象、InputStream 对象、Reader 对象、String 对象或 URL 对象。使用\
  \ close() 方法关闭 OracleXMLSave 对象。\n\n```\noracleXMLSave.deleteXML(input);\noracleXMLSave.close();\n\
  ```\n\n注释掉 XMLToDatabase.java 应用程序中除 deleteRow() 方法之外的所有方法调用，以使用 catalog-delete.xml\
  \ 从 JOURNAL 表中删除一行。结果，catalog-delete.xml 中指定的数据库表行将被从 JOURNAL 表中删除。\n\n## SQL 数据库到\
  \ XML 文档映射\n\n我们将使用 XML SQL 实用程序将数据库表 JOURNAL 映射到 XML 文档。OracleXMLQuery 类用于将数据库表转换为\
  \ XML 文档。在生成的 XML 文档中，会为数据库表的每一列创建相应的 XML 元素。元素属性不会被创建，若要创建它们，请对使用 OracleXMLQuery\
  \ 类从数据库表创建的 XML 文档应用 XSLT。\n\n本节讨论创建包含元素和元素属性的 XML 文档的步骤。导入 OracleXMLQuery 类并创建\
  \ OracleXMLQuery 类对象：\n\n```\nOracleXMLQuery query = new OracleXMLQuery(conn, \"\
  SELECT CATALOGID, JOURNAL_TITLE, PUBLISHER, EDITION, ARTICLE_SECTION, TITLE, AUTHOR\
  \ FROM JOURNAL\");\n```\n\n变量 conn 是用于查询数据库的 JDBC 连接。SELECT SQL 语句指定了从数据库表 JOURNAL\
  \ 选择数据的查询。对 OracleXMLQuery 对象应用 XSLT 以生成包含元素属性的 XML 文档。使用 setXSLT(Reader, String)\
  \ 方法在 OracleXMLQuery 对象上设置 XSLT。String 参数指定外部实体的 URL。\n\n```\nReader xsltReader=new\
  \ FileReader(new File(\"output.xsl\"));\nquery.setXSLT(xsltReader, null);\n```\n\
  \nXSLT output.xsl 如下所示：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<xsl:stylesheet\
  \ version=\"1.0\"\n                xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  >\n    <xsl:output method=\"xml\"/>\n    <xsl:template match=\"/ROWSET\">\n    \
  \    <xsl:element name=\"CATALOG\">\n            <xsl:apply-templates select=\"\
  journal\"/>\n        </xsl:element>\n    </xsl:template>\n    <xsl:template match=\"\
  journal\">\n        <xsl:element name=\"journal\">\n            <xsl:attribute name=\"\
  title\">\n                <xsl:value-of select=\"JOURNAL_TITLE\"/>\n           \
  \ </xsl:attribute>\n            <xsl:attribute name=\"publisher\">\n           \
  \     <xsl:value-of select=\"PUBLISHER\"/>\n            </xsl:attribute>\n     \
  \       <xsl:attribute name=\"edition\">\n                <xsl:value-of select=\"\
  EDITION\"/>\n            </xsl:attribute>\n            <xsl:element name=\"catalogId\"\
  >\n                <xsl:value-of select=\"CATALOGID\"/>\n            </xsl:element>\n\
  \            <xsl:element name=\"article\">\n                <xsl:attribute name=\"\
  section\">\n                    <xsl:value-of select=\"ARTICLE_SECTION\"/>\n   \
  \             </xsl:attribute>\n                <xsl:copy-of select=\"TITLE\"/>\n\
  \                <xsl:copy-of select=\"AUTHOR\"/>\n            </xsl:element>\n\
  \        </xsl:element>\n    </xsl:template>\n</xsl:stylesheet>\n```\n\n将行包围标签，即在生成的\
  \ XML 文档中对应数据库表行的元素标签，设置为 journal：\n\n```\nquery.setRowTag(\"journal\");\n```\n\n\
  使用 getXMLString() 方法从数据库表 JOURNAL 生成 XML 文档：\n\n```\nString xmlString=query.getXMLString();\n\
  ```\n\n使用 PrintWriter 将 XML 字符串输出到 catalog-output.xml 文件：\n\n```\nOutputStream output=new\
  \ FileOutputStream(new File(\"catalog-output.xml\"));\nPrintWriter printWriter=new\
  \ PrintWriter(output);\nprintWriter.print(xmlString);\nprintWriter.flush();\n```\n\
  \n使用 XSU 生成的 XML 文档会应用 XSLT output.xslt。存储在数据库中的 XML 文档被生成。在 XSU 版本 2.1.0（包含在 XDK\
  \ 10g 中）中，可以通过自定义 SQL SELECT 语句将数据库列映射到属性。要将列映射到属性，请为列创建别名并在别名前加上 @ 符号。要将 CATALOGID\
  \ 列映射到 catalogId 属性，SELECT 查询如下：\n\n```\nSELECT CATALOGID \"@catalogId\", JOURNAL_TITLE,\
  \ PUBLISHER, EDITION, ARTICLE_SECTION, TITLE, AUTHOR FROM JOURNAL;\n```\n\nXMLToDatabase.java，即用于将\
  \ XML 文档存储到数据库中并从数据库中检索 XML 文档的 Java 程序，列出如下：\n\n```\npackage xsu;\nimport oracle.xml.sql.query.OracleXMLQuery;\n\
  import oracle.xml.sql.dml.OracleXMLSave;\nimport java.sql.*;\nimport java.io.*;\n\
  public class XMLToDatabase\n{\npublic void xmlToSQL(Connection conn)\n{\ntry\n{\n\
  OracleXMLSave oracleXMLSave = new OracleXMLSave(conn, \"JOURNAL\");\nString[] keyColNames\
  \ = new String[1];\nkeyColNames[0] = \"CATALOGID\";\noracleXMLSave.setKeyColumnList(keyColNames);\n\
  /*Reader xsltReader=new FileReader(new File(\"input.xsl\"));*/\noracleXMLSave.setXSLT(\"\
  input.xsl\", null);\noracleXMLSave.setIgnoreCase(true);\noracleXMLSave.setRowTag(\"\
  journal\");\nInputStream input = new FileInputStream(new File(\"catalog.xml\"));\n\
  oracleXMLSave.insertXML(input);\noracleXMLSave.close();\n}\ncatch (IOException e)\n\
  {\nSystem.out.println(\"IOException\" + e.getMessage());\n}\n}\npublic void updateDatabase(Connection\
  \ conn)\n{\ntry\n{\nOracleXMLSave oracleXMLSave = new OracleXMLSave(conn, \"JOURNAL\"\
  );\noracleXMLSave.setRowTag(\"journal\");\noracleXMLSave.setIgnoreCase(true);\n\
  String[] keyColNames = new String[1];\nkeyColNames[0] = \"CATALOGID\";\noracleXMLSave.setKeyColumnList(keyColNames);\n\
  String[] updateColNames = new String[2];\nupdateColNames[0] = \"EDITION\";\nupdateColNames[1]\
  \ = \"TITLE\";\noracleXMLSave.setUpdateColumnList(updateColNames);\nInputStream\
  \ input = new FileInputStream(new File(\n\"catalog-update.xml\"));\noracleXMLSave.updateXML(input);\n\
  oracleXMLSave.close();\n}\ncatch (IOException e)\n{\nSystem.out.println(\"IOException\"\
  \ + e.getMessage());\n}\n}\npublic void deleteRow(Connection conn)\n{\ntry\n{\n\
  OracleXMLSave oracleXMLSave = new OracleXMLSave(conn, \"JOURNAL\");\noracleXMLSave.setRowTag(\"\
  journal\");\noracleXMLSave.setIgnoreCase(true);\nString[] keyColNames = new String[1];\n\
  keyColNames[0] = \"CATALOGID\";\noracleXMLSave.setKeyColumnList(keyColNames);\n\
  InputStream input = new FileInputStream(\nnew File(\"catalog-delete.xml\"));\noracleXMLSave.deleteXML(input);\n\
  oracleXMLSave.close();\n}\ncatch (IOException e)\n{\n    System.out.println(\"IOException\"\
  \ + e.getMessage());\n}\n}\npublic void sqlToXML(Connection conn)\n{\ntry\n{\n \
  \   OracleXMLQuery query = new OracleXMLQuery(conn, \"SELECT CATALOGID,\n      \
  \  JOURNAL_TITLE, PUBLISHER, EDITION, ARTICLE_SECTION, TITLE,\n        AUTHOR FROM\
  \ JOURNAL\");\n    Reader xsltReader = new FileReader(new File(\"output.xsl\"));\n\
  \    query.setXSLT(xsltReader, null);\n    query.setRowTag(\"journal\");\n    String\
  \ xmlString = query.getXMLString();\n    OutputStream output = new FileOutputStream(\n\
  \        new File(\"catalog-output.xml\"));\n    PrintWriter printWriter = new PrintWriter(output);\n\
  \    printWriter.print(xmlString);\n    printWriter.flush();\n}\ncatch (IOException\
  \ e)\n{\n    System.out.println(\"IOException\" + e.getMessage());\n}\n}\npublic\
  \ static void main(String[] args)\n{\ntry\n{\n    Connection conn = DriverManager.getConnection(\n\
  \        \"jdbc:oracle:thin:@localhost:1521:ORCL\", \"OE\", \"calgary\");\n    XMLToDatabase\
  \ xmlToDB = new XMLToDatabase();\n    /* xmlToDB.xmlToSQL(conn);\n    xmlToDB.updateDatabase(conn);\n\
  \    xmlToDB.deleteRow(conn);*/\n    xmlToDB.sqlToXML(conn);\n    conn.close();\n\
  }\ncatch (SQLException exception)\n{\n    for (Throwable e: exception)\n    {\n\
  \        System.out.println(\"Error encountered: \" + e);\n    }\n}\n}\n}\n```\n\
  \n可以通过注释掉不需要的方法来运行所选操作。要将数据库表 JOURNAL 映射到 XML 文档，请注释掉除 sqlToXML() 方法之外的所有方法的调用。要运行\
  \ XMLToDatabase.java 应用程序，在 JDeveloper 中右键单击应用程序节点，然后选择 Run。\n\n应用程序的输出生成 XML 文档\
  \ catalog-output.xml，其中已删除一个 journal 元素。要将 catalog-output.xml 添加到 XSU 项目，请单击项目节点并选择\
  \ View | Refresh。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_213_0.png)\n\nJDBC\
  \ 4.0 在 SQLException 中引入了新功能，即 SQLException 的分类。SQLException 被分为 SQLNonTransientException、SQLRecoverableException\
  \ 和 SQLTransientException。停止 Oracle 数据库 10g 的 TNSListener，并使用除 sqlToXML() 方法之外的所有已注释的方法调用运行\
  \ XMLToDatabase.java 应用程序。显示以下异常：\n\n```\nError encountered: java.sql.SQLRecoverableException:\
  \ Io exception: The Network Adapter could not establish the connection\n```\n\n\
  该异常表明 `SQLException` 是一个 `SQLRecoverableException`。这意味着如果执行恢复操作，JDBC 操作将成功。如果启动\
  \ `TNSListener`，则 `SQLException` 将消失。在异常消息中，`SQLException` 未链接到另一个 `SQLException`。\n\
  \n## 摘要\n\nOracle XML SQL 实用程序用于在 XML 文档与关系数据库之间进行映射，反之亦然。XML SQL 实用程序（XSU）不会存储\
  \ XML 文档中的属性。可以通过对 XML 文档应用 XSLT 来存储属性。在本章中，使用 Oracle 数据库存储 XML 文档。我们也可以使用开源 MySQL\
  \ 数据库执行相同的操作。我们使用 Oracle 数据库 11g JDBC 4.0 驱动程序将 XML 文档映射到 Oracle 数据库表，并将 Oracle\
  \ 数据库表映射到 XML 文档。我们使用了 JDBC 4.0 中的一些新功能，例如自动驱动程序加载和增强的链式 `SQLExceptions` 支持。\n"
- "## 8 XSQL\n\n在第 7 章中，我们讨论了 XML 到 SQL 和 SQL 到 XML 的映射。XML SQL Utility 是一个 Java API。但是，使用\
  \ JDBC 驱动程序也可以通过 XSQL 在没有任何 Java 代码的情况下进行 SQL 到 XML 的映射。包含在 Oracle JDeveloper 10g\
  \ 中的 Oracle XSQL Pages Publishing Framework 支持处理 SQL 查询以生成 XML。XSQL 还可用于运行除 SQL\
  \ `SELECT` 之外的 SQL DML（数据操作语言）语句，例如 `INSERT`、`UPDATE` 和 `DELETE`。XSQL 页面由 `urn:oracle-xsql`\
  \ 命名空间中的 XSQL 标签组成。XSQL 页面请求发送到 XSQL Servlet，后者调用 XSQL Page Processor。\n\nXSQL Pages\
  \ Publishing Framework 集成 XML、SQL 和 XSLT。XSQL Page Processor 处理 XSQL 页面模板。XSQL Page\
  \ Processor 使用 Oracle XML Parser 解析 XSQL 页面模板，并使用 XSLT 样式表转换 XSQL 页面处理输出。XSQL Pages\
  \ Framework 使用 XML SQL Utility（XSU）查询数据库并从 SQL 查询生成 XML。JDBC 连接用于访问数据库以处理 SQL 查询。使用\
  \ XSQL 生成的 XML 输出可能需要不同的格式或需要修改，为此 XSQL Pages Framework 支持 XSLT 转换。\n\n一个 XSQL 应用程序由客户端\
  \ XSQL 页面、`XSQLConfig.xml` 配置文件、服务器端 XSQL Servlet 和数据库组成。XSQL 页面（`.xsql` 文件）由 `<xsql:query></xsql:query>`\
  \ 标签中定义的 SQL 查询语句组成。XSQL 还可使用 `<xsql:dml></xsql:dml>` 标签根据 XML 文档中的数据创建和更新数据库表。XSQL\
  \ 支持使用 XSQL 查询检索的 XML 数据的 XSLT 转换。要转换 XML 数据的 XSLT 样式表在 XSQL 页面中指定。当在 JDeveloper\
  \ 中运行 XSQL 页面时，处理 XSQL 页面的过程如下：\n\n- 1. XSQL 页面请求从浏览器发送到 XSQL Servlet。\n- 2. XSQL\
  \ Servlet 将请求转发给 XSQL Page Processor 以处理 `.xsql` 页面。\n\n\n\n3. XSQL 页面处理器使用 Oracle\
  \ XML 解析器解析 XSQL 页面并缓存该页面。\n4. XSQL 页面处理器使用 XSQL 页面中的 connection 属性连接到数据库。\n5. XSQL\
  \ 页面处理器使用 XML SQL 实用程序 (XSU) 从 SQL 查询生成 XML。\n6. XSQL 页面处理器通过用其操作处理程序返回的 XML 结果替换每个\
  \ XSQL 操作元素（如 xsql:query）来生成 XML 数据报。\n7. 如果指定了 XSLT 样式表，XSQL 页面处理器将解析样式表并缓存它。\n\
  8. XSQL 页面处理器使用 Oracle XSLT 处理器应用 XSLT 样式表来转换 XML 数据报。\n9. XSQL 页面处理器将 XSLT 转换的\
  \ XML/HTML 输出返回给 XSQL Servlet 以在浏览器中显示。\n\n本章中，我们将使用 XSQL 查询包含目录的示例数据库表。随后，我们将通过\
  \ XSLT 转换将 XML 输出显示为 HTML 表格。本章您将学习以下内容：\n\n- 创建 XSQL 页面以运行 SQL 查询并生成 XML\n- 在 SQL\
  \ 查询中使用绑定参数\n- 应用 XSQL 查询属性来自定义 XML 输出\n- 对 XML 输出应用 XSLT 转换\n\n## XSQL 标签概述\n\n\
  本节中，我们将讨论可在 XSQL 页面中指定的不同 XSQL 标签。XSQL 页面中的根元素是 <page>。以下表格中讨论了一些 XSQL 标签。XSQL 标签属性是可选的，除非在表格中指定为必需。\n\
  \n| XSQL 标签 | 描述 | 属性 |\n|---|---|---|\n| xsql:query | 运行 SQL 查询并将结果集作为 XML 包含在内。\
  \ | 参见第二张表 |\n| xsql:dml | 运行 DML SQL 语句或 PL/SQL 匿名块。 | name (required): 页面级参数的名称。ignore-empty-value:\
  \ 指定是否应忽略空值 (\"\")。默认为 'no'。value: 参数值。 |\n| xsql:set-page-param | 设置页面级参数。 | name\
  \ (required): 页面级参数的名称。ignore-empty-value: 指定是否应忽略空值 (\"\")。默认为 'no'。value: 参数值。\
  \ |\n| xsql:set-session-param | 设置会话级参数。 | 同 xsql:set-page-param。 |\n| xsql:set-stylesheet-param\
  \ | 设置 XSLT 样式表参数。 | 同 xsql:set-page-param。 |\n| xsql:include-param | 包含表示页面参数名称和值的\
  \ XML。例如，如果页面参数定义为：<xsql:set-page-param name=\"param1\" value=\"paramValue\"/> 定义为\
  \ <xsql:include-param name=\"param1\"/> 的 include-param 在 XML 输出中包含以下 XML：<param1>paramValue</param1>\
  \ | Name (required): 要包含的参数的名称。 |\n| xsql:query | 运行 SQL 查询并将结果集作为 XML 包含在内 | 参见第二张表\
  \ |\n\n| XSQL 标签 | 描述 | 属性 |\n|---|---|---|\n| xsql:include-request-params | 包含表示所有\
  \ HTTP 参数、Cookie 和会话变量的名称和值的 XML 片段。例如，如果指定了 `<xsql:include-request-params/>`，则会包含以下\
  \ XML 片段：`<request><parameters><param1>value1</param1></parameters><session><var1>value1</var1></session><cookies><cookiename1>cookieValue</cookiename1></cookies></request>`\
  \ |  |\n| xsql:include-xml | 包含来自绝对、相对或参数化 URL 的外部 XML 内容。 | href (required): 可能为静态文件或动态源的绝对、相对或参数化\
  \ URL。 |\n| xsql:include-xsql | 包含另一个 XSQL 页面的 XML 输出。 | href (required): XSQL 资源的绝对、相对或参数化\
  \ URL。reparse: 指定是否应重新解析包含的 XSQL 页面。默认值是 'no'。 |\n\n| XSQL 标签 | 描述 | 属性 |\n|---|---|---|\n\
  | xsql:insert-request | 将请求中已发布的 XML 文档或 HTML 表单插入到数据库表或视图中。XML 文档可以用 XSLT 转换。如果发布了\
  \ HTML 表单，则包含请求参数、会话变量和 Cookie 的 XML 文档。示例 XML 文档：`<request><parameters><param1>value1</param1></parameters><session><var1>varValue</var1></session><cookies><cookiename1>cookieValue</cookiename1></cookies></request>`\
  \ | table (required): 表、视图或同义词的名称。transform: 用于转换 XML 文档的 XSLT 的相对或绝对 URL。columns:\
  \ 列的空格或逗号分隔列表 date-format: 数据字段值的日期格式。 |\n| xsql:update-request | 更新已发布 XML 文档中表示的行。\
  \ | 除 xsql: insert-request 的属性外：key-columns: 用于标识表行的列值的空格或逗号分隔列表。 |\n| xsql:delete-request\
  \ | 删除已发布 XML 文档中表示的行。 | 同 xsql:update-request，只是 columns 不是属性。 |\n| xsql:insert-param\
  \ | 将参数的值插入到数据库表或视图中。 | name (required): 参数名称。table (required): 表名称。date-format:\
  \ 数据字段值的日期格式。transform: XSLT 的相对、绝对或参数化 URL。 |\n\n| XSQL 标签 | 描述 | 属性 |\n|---|---|---|\n\
  | xsql:set-cookie | 设置 HTTP Cookie 的值。 | name (required): HTTP Cookie 的名称。domain:\
  \ Cookie 有效且可读的域。默认值是创建 Cookie 的文档的完整域。ignore-empty-value: 指定是否忽略空值。默认值是 'no'。max-age:\
  \ Cookie 的最大生存时间（以秒为单位）。默认生存时间是用户当前浏览器会话。only-if-unset: 指定是否仅在 Cookie 当前未定义时设置 Cookie。默认值是\
  \ 'no'。path: Cookie 有效且可读的域内的相对 URL。默认值是创建 Cookie 的文档的 URL 路径。value: Cookie 值。 |\n\
  \n## 设置环境\n\n本节中，我们将讨论创建 XSQL 应用程序所需的前期设置，这并不多，因为 XSQLServlet 已在 web.xml 中指定，并且在创建\
  \ XSQL 页面时 XSQL 库已添加到项目中。Oracle 数据库 11g JDBC 驱动程序可与任何 Oracle 数据库 9i 及更高版本一起使用。我们将使用\
  \ Oracle 数据库 10g。我们需要安装 Oracle 数据库 10g 包括示例模式。我们需要创建并启动 Oracle 数据库实例。使用订单录入 (OE)\
  \ 示例模式（用户名）连接到数据库。\n\n```\nCONNECT OE/<password>\n```\n\n运行以下 SQL 脚本来创建一个由示例目录组成的数据库表：\n\
  \n```\nCREATE TABLE Catalog(Journal VARCHAR(25), Publisher\n    Varchar(25),Edition\
  \ VARCHAR(25), Title Varchar(45), Author\n    Varchar(25));\nINSERT INTO Catalog\
  \ VALUES('Oracle Magazine', 'Oracle\n    Publishing','July-August 2005', 'Tuning\
  \ Undo Tablespace', 'Kimberly\n    Floss');\nINSERT INTO Catalog VALUES('Oracle\
  \ Magazine',   'Oracle\n    Publishing','September-October 2005', 'Creating Search\
  \ Pages',\n    'Steve Muench');\n```\n\n我们需要为 XSQL 应用程序创建一个 JDeveloper 项目：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_221_0.png)\n\
  \n## 配置连接\n\n我们还需要创建一个数据库连接来运行 XSQL 查询。默认情况下，Oracle XSQL 页面使用在 J2EE Web 应用程序环境中配置的\
  \ Oracle JDBC 数据源。XSQLConfig.xml 中 connection-manager 元素中的 factory 元素设置 XSQL 页面使用\
  \ JDBC 数据源。\n\n```\n<connection-manager>\n    ...\n    <factory>\n        oracle.xml.xsql.XSQLOracleDatasourceConnectionManager\n\
  \    </factory>\n</connection-manager>\n```\n\nXSQL 页面还可以通过在 XSQLConfig.xml 中按如下方式设置\
  \ connection-manager 工厂类来使用基于 XSQLConfig.xml 的命名连接：\n\n```\n<factory>oracle.xml.xsql.XSQLConnectionManagerFactoryImpl</factory>\n\
  ```\n\n## XSQL\n\n如果要在 XSQL 页面中使用第三方 JDBC 数据源，请在 XSQLConfig.xml 中按如下方式设置 connection-manager\
  \ 工厂类：\n\n```\n<factory> oracle.xml.xsql.XSQLDatasourceConnectionManager</factory>\n\
  ```\n\nJDeveloper 10.1.3.3 提供了三种不同的方法从 XSQL 页面创建数据库连接：\n\n- **连接导航器** 中的 JDBC 连接。**连接导航器**\
  \ 连接具有相应的数据源，并提供 JNDI 名称绑定。\n- 在 **Embedded OC4J 首选项窗口** 或 `data-sources.xml` 中配置的数据源。\n\
  - 在 `XSQLConfig.xml` 文件中指定的连接。\n\n要在 **连接导航器** 中创建数据库连接，请在 **连接导航器** 中选择 **数据库 |\
  \ 新建数据库连接** 节点。Create Connection Wizard 将启动。单击 **下一步**。在 **类型** 框架中，指定 **连接名称**\
  \ 并将 **连接类型** 选择为 Oracle (JDBC)。在 **身份验证** 框架中，指定 **用户名** 和 **密码** 并单击 **下一步**。在\
  \ **连接** 框架中指定 **JDBC 驱动程序**、**主机名**、**JDBC 端口** 和数据库 **SID** 并单击 **下一步**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_222_0.png)\n\
  \n\n\n在测试框架中，单击“测试连接”按钮以测试 JDBC 连接。单击“完成”按钮以配置数据库连接。连接节点将被添加到应用程序导航器中的 Connections\
  \ | Database 节点。xsqlConnection 可作为 jdbc/xsqlConnectionDS JNDI 资源使用。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_223_0.png)\n\
  \n连接也可以在嵌入式 OC4J 服务器的 data-sources.xml 配置文件中配置，<JDeveloper10.1.3>\\jdev\\system\\\
  oracle.j2ee.10.1.3.34.12\\embedded-oc4j\\config\\data-sources.xml，方式为声明式或使用 Tools\
  \ | Embedded OC4J Preferences | Global | Data Sources，如第 2 章所述。<JDeveloper10.1.3>\
  \ 是安装 JDeveloper 的目录。将 managed-data-source 元素添加到 data-sources.xml 文件中，指定数据源的连接配置。managed-data-source\
  \ 元素包含用于获取数据源对象的数据源类。managed-data-source 元素如下所示：\n\n```\n<managed-data-source name='XSQLDataSource'\
  \ connection-pool-name='Oracle Connection Pool' jndi-name='jdbc/XSQLDataSource'/>\n\
  <connection-pool name='Oracle Connection Pool'>  <connection-factory\nfactory-class='oracle.jdbc.pool.OracleDataSource'\
  \      user='OE'\npassword='pw'  url=\"jdbc:oracle:thin:@<host>:<port>:<SID>\" \
  \  </\nconnection-factory>  </connection-pool>\n```\n\n<host> 是数据库主机，默认为 localhost。\n\
  <port> 是端口号，默认为 1521。\n<SID> 是数据库 SID，默认为 ORCL。\n<host>、<port> 和 <SID> 值可以从 tnsnames.ora\
  \ 文件中获取。\n\n要在 XSQL 页面中使用 JDBC 数据源连接到数据库，请在 `page` 元素的 `connection` 属性中指定 JDBC 数据源的\
  \ JNDI 名称。例如，如果 JDBC 数据源的 JNDI 名称为 `jdbc/XSQLDataSource`，则按如下方式指定 `connection` 属性。\n\
  \n```\n<page xmlns:xsql=\"urn:oracle-xsql\" connection=\"jdbc/XSQLDataSource\">\n\
  </page>\n```\n\n也可以通过修改 `XSQLConfig.xml` 文件来创建 XSQL 页面与数据库的连接。当创建 XSQL 文件时，会在项目的\
  \ `src` 文件夹中添加一个 `XSQLConfig.xml` 文件。首先按如下方式在 `XSQLConfig.xml` 中指定 `connection-manager`\
  \ 工厂类：\n\n```\n<factory>oracle.xml.xsql.XSQLConnectionManagerFactoryImpl</factory>\n\
  ```\n\n在 `XSQLConfig.xml` 中的 `<connectiondefs>` 元素中，添加一个 `<connection>` 元素以指定要创建的连接。创建具有\
  \ OE 架构的连接：\n\n```\n<connection name=\"dbConnection\">\n    <username>OE</username>\n\
  \    <password>pw</password>\n    <dburl>jdbc:oracle:thin:@<HOST>:<PORT>:<SID></dburl>\n\
  \    <driver>oracle.jdbc.OracleDriver</driver>\n</connection>\n```\n\n- 属性 name\
  \ 是连接名称。\n- `<username>` 是用于登录数据库的用户名。\n- `<password>` 是用于登录数据库的密码。\n- `<dburl>`\
  \ 是数据库的 URL。\n- `<driver>` 是用于连接到数据库的 JDBC 驱动程序。\n- `<HOST>` 是 Oracle 10g 生产数据库主机。\n\
  - `<PORT>` 是数据库端口。\n- `<SID>` 是数据库 SID。\n\n要在 XSQL 页面中使用在 `XSQLConfig.xml` 文件中配置的命名连接，请将\
  \ XSQL 页面中 `<page>` 标签的 `connection` 属性值指定为 `dbConnection`。\n\n## 创建 XSQL 查询\n\n\
  在本节中，我们将在 JDeveloper 中创建一个 XSQL 页面（`queryDb.xsql`）。要创建 XSQL 文件，请在 **应用程序导航器** 框架中选择项目节点并选择\
  \ **文件 | 新建**。在 **新建库** 窗口中，在 **类别** 中选择 **常规 | XML**。在 **项目** 中，选择 **XSQL 文件**\
  \ 并单击 **确定**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_225_0.png)\n\n### XSQL\n\
  \n在 **创建 XSQL 文件** 框架中，指定 **文件名** 并单击 **确定**。一个 **XSQL** 页面被添加到 JDeveloper 项目中，其中包含\
  \ `XSQLConfig.xml` 配置文件。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_226_0.png)\n\
  \nXSQL 应用程序所需的库已添加到项目库中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_227_0.png)\n\
  \n我们将构建一个 XSQL 页面以查询示例数据库表 `Catalog` 并生成 XML 文档。XSQL 组件调色板提供了本章第一表中讨论的不同的 XSQL 组件。接下来我们将向\
  \ XSQL 页面添加 `<xsql:query></xsql:query>` 标签以处理 XSQL 查询。XSQL 查询的应用可能需要使用绑定变量，即 SQL\
  \ 语句中的变量。\n\n### XSQL\n\n绑定变量可以使用 URL 参数、会话变量、Cookie 值或页面参数的值进行设置。在我们的示例中，我们将使用页面参数设置\
  \ XSQL 查询绑定变量。绑定变量在 `<xsql:query>` 标签中使用 `bind-params` 属性指定，并在 `<xsql:query>` 标签内的\
  \ SQL 语句中使用。绑定变量在 SQL 语句中用 '?' 表示。绑定参数的值使用 `<xsql:set-page-param/>` 标签指定。将光标定位在\
  \ XSQL 页面中并在组件调色板中选择 **设置页面参数** 组件。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_228_0.png)\n\
  \n在 **设置页面参数** 框架中，将 **name** 属性值指定为 **JOURNAL**，然后单击 **下一步**。将页面参数的值指定为 SQL 或字符串。选择\
  \ **将参数值指定为字符串** 并将 **param** 值指定为 \"**Oracle Magazine**\"，然后单击 **下一步**。选择 XSQL\
  \ 页面要使用的数据库连接并选择 **完成**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_229_0.png)\n\
  \n### XSQL\n\n在 XSQL 页面中，可以使用 `page` 标签中的 `connection` 属性将数据库连接指定为全局连接。如果 XSQL 页面中的某些元素使用不同的连接，请使用各个元素中的\
  \ `connection` 属性指定连接。元素中的 `connection` 属性会覆盖全局连接。类似地添加另一个页面参数，`PUBLISHER`，值为 \"\
  Oracle Publishing\"。接下来，添加一个 `xsql:Query` 元素。将光标定位在 XSQL 页面中并在 XSQL 组件调色板中选择 **查询**。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_230_0.png)\n\n如有需要，指定任何 xsql:query 元素属性，然后单击下一步。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_231_0.png)\n\n选择 XSQL 查询要使用的数据库连接，然后单击下一步。在查询窗口中，指定定义\
  \ SQL 查询的 SQL 语句，然后单击完成。使用以下 SQL 语句从 Catalog 数据库检索数据：\n\n```\nSELECT JOURNAL, PUBLISHER,\
  \ EDITION, TITLE, AUTHOR FROM CATALOG WHERE JOURNAL=? AND PUBLISHER=?\n```\n\n###\
  \ XSQL\n\nxsql:query 标签已添加到 XSQL 页面。指定 JDBC 数据源的 connection 属性已添加到 page 标签。接下来我们将向\
  \ xsql:query 元素添加绑定参数。将光标定位在 xsql:query 标签中并从显示的列表中选择 bind-params。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_232_0.png)\n\
  \nbind-params 属性已添加到 xsql:query 元素。将 \"JOURNAL PUBLISHER\" 添加到 bind-params 属性。bind-params\
  \ 属性值是一个字符串列表，参数的值从 set-page-param 标签获取。queryDb.xsql 页面如下所示：\n\n```\n<page xmlns:xsql=\"\
  urn:oracle-xsql\"\n    connection=\"jdbc/xsqlConnectionDS\">\n    <xsql:set-page-param\
  \ name=\"JOURNAL\" ignore-empty-value=\"no\"\n        value=\"Oracle Magazine\"\
  />\n    <xsql:set-page-param name=\"PUBLISHER\" ignore-empty-value=\"no\"\n    \
  \    value=\"Oracle Publishing\"/>\n    <xsql:query bind-params=\"JOURNAL PUBLISHER\"\
  \ max-rows=\"-1\" null-\n        indicator=\"no\" tag-case=\"lower\">\n        SELECT\
  \  JOURNAL, PUBLISHER, EDITION, TITLE, AUTHOR from\n            OE.Catalog WHERE\
  \ JOURNAL=? AND PUBLISHER=?\n    </xsql:query>\n</page>\n```\n\n可在 `xsql:query`\
  \ 标签中指定的其他一些属性在下表中讨论：\n\n| 属性 | 描述 | 类型 |\n|---|---|---|\n| bind-params | 有序的、以空格分隔的查询参数列表，包括数组值参数，其值用于\
  \ JDBC 绑定变量。 | String |\n| date-format | 数据列的日期格式。有效值类型为 java.text.SimpleDateFormat。\
  \ | String |\n| id-attribute | 用于标识结果集中每一行的属性。默认值为 'num'。 | String |\n| error-statement\
  \ | 如果设置为 true（默认值），则为有错误的 SQL 语句生成 xsql-error 元素。 | boolean |\n| id-attribute-column\
  \ | 指定结果集中列的名称，其值将用作每一行的行 ID 属性值。默认使用行计数值。 | String |\n| include-schema | 如果为 yes，则包含结果集结构的内联\
  \ XML 模式。默认值是 no。 | boolean |\n| max-rows | 在跳过 skip-rows 属性指定的行后要获取的最大行数。默认获取所有行。\
  \ | boolean |\n| null-indicator | 指定是否要在输出 XML 中包含 null 列值，并为该元素使用 NULL=\"Y\"。默认省略具有\
  \ null 值的元素。 | boolean |\n| row-element | 指定要使用而不是默认 ROW 的行元素。 | String |\n| rowset-element\
  \ | 指定要使用而不是默认 ROWSET 元素的行集元素。 | String |\n| skip-rows | 从结果集获取之前要跳过的行数。 | integer\
  \ |\n| tag-case | 元素名称的大小写。有效值为 lower 和 upper。默认使用查询语句中指定的列名。 | String |\n\n\n\n\
  ## XSQL\n\n运行 XSQL 页面时，右键单击 queryDb.xsql 节点并选择 **Run**。XSQL 查询运行并生成一个代表 XSQL 查询结果集的\
  \ XML 文档。\n\n```xml\n<?xml version=\"1.0\" encoding=\"windows-1252\" ?>\n<!--\n\
  | Uncomment the following processing instruction and replace\n| the stylesheet name\
  \ to transform output of your XSQL Page using XSLT\n| <?xml-stylesheet type=\"text/xsl\"\
  \ href=\"YourStylesheet.xsl\" ?>\n-->\n<page>\n  <rowset>\n    <row num=\"1\">\n\
  \      <journal>Oracle Magazine</journal>\n      <publisher>Oracle Publishing</publisher>\n\
  \      <edition>July-August 2005</edition>\n      <title>Tuning Undo Tablespace</title>\n\
  \      <author>Kimberly Floss</author>\n    </row>\n    <row num=\"2\">\n      <journal>Oracle\
  \ Magazine</journal>\n      <publisher>Oracle Publishing</publisher>\n      <edition>September-October\
  \ 2005</edition>\n      <title>Creating Search Pages</title>\n      <author>Steve\
  \ Muench</author>\n    </row>\n  </rowset>\n</page>\n```\n\n在下一节中，我们将使用 <xsql:query>\
  \ 标签在 XSQL 查询中的一些属性。\n\n## Applying XSQL Query Attributes\n\n<xsql:query> 标签提供 XSQL\
  \ 属性来修改通过 XSQL 查询检索的数据以及修改通过 XSQL 查询生成的 XML 文档。不同的 XSQL 属性及其应用已在本章第二张表中讨论。某些 xsql-query\
  \ 属性，例如 page-params，仅在 XSQL 页面中可用。\n\n为演示 XSQL 查询属性，删除 queryDB.xsql 并创建一个与上一节类似的\
  \ XSQL 页面，只是当从组件调色板添加 XSQL 查询时，指定查询属性，然后单击 **Next**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_235_0.png)\n\
  \n选择数据库连接并单击 Next。在查询窗口中，指定 SQL 语句并单击 Finish。在 SQL 语句中指定参数标记，因为我们将使用绑定参数。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_235_1.png)\n\
  \nqueryDB.xsql 页面如下所示：\n\n```\n<?xml version = '1.0' encoding = 'windows-1252'?><page\
  \ xmlns:xsql=\"urn:oracle-xsql\" connection=\"jdbc/xsqlConnectionDS\">\n<xsql:set-page-param\
  \ name=\"JOURNAL\" ignore-empty-value=\"no\" value=\"Oracle Magazine\"/>\n<xsql:set-page-param\
  \ name=\"PUBLISHER\" ignore-empty-value=\"no\" value=\"Oracle Publishing\"/>\n<xsql:query\
  \ bind-params=\"JOURNAL PUBLISHER\" fetch-size=\"1\" id-attribute=\"catalogId\"\
  \ max-rows=\"2\" null-indicator=\"yes\" row-element=\"CATALOG\" rowset-element=\"\
  CATALOGS\" tag-case=\"upper\">\nSELECT  JOURNAL, PUBLISHER, EDITION, TITLE, AUTHOR\
  \ from\nOE.Catalog WHERE JOURNAL=? AND PUBLISHER=?\n</xsql:query>\n</page>\n```\n\
  \n右键单击 queryDb.xsql XSQL 页面并选择 Run。XSQL 查询运行并显示 XML 文档。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_236_0.png)\n\
  \n在下一节中，我们将讨论 XSQL 查询输出的 XSLT 转换。\n\n## Transforming XSQL Output\n\nXSQL 页面支持使用\
  \ XSLT 转换查询输出。在本节中，我们将向使用 XSQL 查询生成的 XML 文档添加 XSLT 转换。使用 File | New 添加 XSLT 文件。在\
  \ New Gallery 窗口中，在 Categories 中选择 General | XML，在 Items 中选择 XSL Style Sheet，然后单击\
  \ OK。在 Create XSL File 框架中，指定文件名并单击 OK。XSL 样式表已添加到 XSQL 项目中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_237_0.png)\n\
  \n用于从 XSQL 查询 XML 输出生成 HTML 表格的 XSLT，catalog.xsl，列出如下：\n\n```\n<?xml version=\"\
  1.0\" encoding=\"UTF-8\"?>\n<xsl:stylesheet version=\"1.0\" xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  >\n<xsl:output encoding=\"ISO-8859-1\" method=\"text/html\" />\n<xsl:template match=\"\
  //page\">\n<html>\n<head>\n<title>Oracle Catalog</title>\n</head>\n<body>\n<table\
  \ border=\"1\" cellspacing=\"0\">\n<tr>\n    <th>Journal</th>\n    <th>Publisher</th>\n\
  \    <th>Edition</th>\n    <th>Title</th>\n    <th>Author</th>\n  </tr>\n  <xsl:for-each\
  \ select=\"ROWSET/ROW\">\n    <tr>\n      <td><xsl:value-of select=\"JOURNAL\"/></td>\n\
  \      <td><xsl:value-of select=\"PUBLISHER\"/></td>\n      <td><xsl:value-of select=\"\
  EDITION\"/></td>\n      <td><xsl:value-of select=\"TITLE\"/></td>\n      <td><xsl:value-of\
  \ select=\"AUTHOR\"/></td>\n    </tr>\n  </xsl:for-each>\n  </table>\n  </body>\n\
  </html>\n</xsl:template>\n</xsl:stylesheet>\n```\n\n使用 File | Save 将 catalog.xsl\
  \ 样式表保存到与 queryDB.xsql 相同的目录，即 public_html 目录。用于转换 XSQL 输出的 XSL 样式表在 XSQL 页面中通过\
  \ xml-stylesheet 元素指定：\n\n```\n<?xml-stylesheet type=\"text/xsl\" href=\"catalog.xsl\"\
  ?>\n```\n\n带有 xml-stylesheet 元素的 XSQL 页面 queryDb.xsql 如下所示：\n\n```\n<?xml version\
  \ = '1.0' encoding = 'windows-1252'?>\n<?xml-stylesheet type=\"text/xsl\" href=\"\
  catalog.xsl\"?>\n<page xmlns:xsql=\"urn:oracle-xsql\" connection=\"jdbc/xsqlConnectionDS\"\
  >\n    <xsql:set-page-param name=\"JOURNAL\"  value=\"Oracle Magazine\"/>\n    <xsql:set-page-param\
  \ name=\"PUBLISHER\"  value=\"Oracle Publishing\"/>\n    <xsql:query bind-params=\"\
  JOURNAL PUBLISHER\">\nSELECT  JOURNAL, PUBLISHER, EDITION, TITLE, AUTHOR from\n\
  \    OE.Catalog WHERE JOURNAL=? AND PUBLISHER=?\n</xsql:query>\n</page>\n```\n\n\
  要运行 XSQL 页面，右键单击 queryDb.xsql 节点并选择 Run。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_239_0.png)\n\
  \nXSQL 查询运行，XML 输出通过 XSLT 转换。\n\n| 期刊 | 出版社 | 版本 | 标题 | 作者 |\n|---|---|---|---|---|\n\
  | Oracle Magazine | Oracle Publishing | July-August 2005 | Tuning Undo Tablespace\
  \ | Kimberly Floss |\n| Oracle Magazine | Oracle Publishing | September-October\
  \ 2005 | Creating Search Pages | Steve Muench |\n\n## JDBC 4.0 Version\n\n嵌入在 JDeveloper\
  \ 10g 或 JDeveloper 11g 中的 OC4J 服务器不支持 JDBC 4.0 规范。在支持 JDBC 4.0 规范的 JDeveloper 的更高版本中，JDBC\
  \ 4.0 的新功能可与 XSQL 应用程序一起使用。要使用 JDBC 4.0 功能，我们需要使用 Oracle 数据库 11g JDBC 4.0 驱动程序 JAR\
  \ 文件 ojdbc6.jar 配置与 Oracle 数据库的 JDBC 连接。由于 JDBC 4.0 驱动程序需要 JDK 6.0，请通过选择 Tools |\
  \ Project Properties 然后选择 Libraries 将 J2SE 版本设置为 JDK 6.0。JDK 版本可在 J2SE Version 字段中设置。使用\
  \ JDBC 4.0 驱动程序，我们可以使用连接管理功能，例如连接状态跟踪。连接状态跟踪由连接池管理器使用 Connection 接口的 isValid() 方法实现。连接池管理器通过在连接上调用\
  \ isValid() 方法来确定连接池中的连接是否不可用。如果连接无效，连接池管理器将使用 close() 方法关闭连接。\n\n```\nif (!connection.isValid())\n\
  \    connection.close();\n```\n\n## 摘要\n\nOracle XSQL Pages Publishing Framework\
  \ 用于使用 SQL 查询生成 XML 文档。可将 XSLT 应用于使用 XSQL 生成的 XML 以转换 XML 输出。JDBC 连接用于连接到数据库以运行\
  \ SQL 查询语句。Oracle JDeveloper 支持 XSQL 框架。使用 XSQL 生成的 XML 文档可通过指定行元素、行集元素以及 XSQL 查询的其他属性来自定义。在嵌入式\
  \ OC4J 支持 JDBC 4.0 的 JDeveloper 版本中，JDBC 4.0 功能例如连接状态跟踪可在 XSQL 应用程序中使用。\n"
- "## 9 Oracle Web RowSet\n\n在前两章中，我们使用 XSU 将 XML 文档映射到关系数据库，并使用 XSU 和 XSQL 将关系数据库表映射到\
  \ XML 文档。在本章中，我们将使用使用 SQL 查询生成的 result set 的 XML 文档表示来修改关系数据库表。\n\n`ResultSet` 接口需要在数据库上保持持久连接以在数据库表数据上调用插入、更新和删除行操作。`RowSet`\
  \ 接口扩展了 `ResultSet` 接口，是一个可无需连接到数据源即可操作的表格数据容器。因此，`RowSet` 接口减少了与数据库保持持久连接的开销。\n\
  \n在 J2SE 5.0 中，引入了五种新的 RowSet 实现——`JdbcRowSet`、`CachedRowSet`、`WebRowSet`、`FilteredRowSet`\
  \ 和 `JoinRowSet`。`WebRowSet` 接口扩展了 `RowSet` 接口，是 `RowSet` 对象的 XML 文档表示。`WebRowSet`\
  \ 对象表示一组获取的数据库表行，可在不连接到数据库的情况下进行修改。\n\nOracle Web RowSet 支持是 Oracle Database 10g\
  \ 驱动程序中的新功能。Oracle Web RowSet 省去了与数据库保持持久连接的要求。连接仅在需要使用 `SELECT` 查询从数据库检索数据以及在对检索到的数据执行所有必需的行操作后更新数据库中的数据时才需要。Oracle\
  \ Web RowSet 用于对从数据库检索的数据进行查询和修改。Oracle Web RowSet 作为 `RowSet` 的 XML 文档表示，便于数据传输。\n\
  \n在 Oracle Database 10g 和 11g JDBC 驱动程序中，Oracle Web RowSet 实现在 `oracle.jdbc.rowset`\
  \ 包中。`OracleWebRowSet` 类表示 Oracle Web RowSet。Web RowSet 中的数据可在不连接到数据库的情况下进行修改。修改\
  \ Web RowSet 后，可使用 `OracleWebRowSet` 类更新数据库表。数据库 JDBC 连接仅在需要从数据库检索数据和用于更新时才需要\n\n\
  数据库。通过 Web RowSet 中的数据可以获得用于数据交换的 XML 文档表示形式。本章在 JDeveloper 10g 中实现了 Oracle 10g\
  \ 数据库 JDBC 驱动程序中的 Web RowSet 功能。将从数据库创建一个示例 Web RowSet。Web RowSet 将被修改并存储在数据库表中。\n\
  \n在本章中我们将学习以下内容：\n\n- 创建 Oracle Web RowSet 对象\n- 向 Oracle Web RowSet 添加一行\n- 从 Oracle\
  \ Web RowSet 读取一行\n- 更新 Oracle Web RowSet 中的一行\n- 从 Oracle Web RowSet 删除一行\n- 使用修改后的\
  \ Oracle Web RowSet 更新数据库表\n\n## 设置环境\n\n我们将使用 Oracle 数据库生成可更新的 OracleWebRowSet\
  \ 对象。因此，安装包含示例模式的 Oracle 数据库 10g。使用 OE 模式连接到数据库：\n\n```\nSQL> CONNECT OE/<password>\n\
  ```\n\n使用以下 SQL 脚本创建示例数据库表 Catalog：\n\n```\nCREATE TABLE OE.Catalog(Journal VARCHAR(25),\
  \ Publisher Varchar(25), Edition VARCHAR(25), Title Varchar(45), Author Varchar(25));\n\
  INSERT INTO OE.Catalog VALUES('Oracle Magazine', 'Oracle Publishing', 'July-August\
  \ 2005', 'Tuning Undo Tablespace', 'Kimberly Floss');\nINSERT INTO OE.Catalog VALUES('Oracle\
  \ Magazine', 'Oracle Publishing', 'March-April 2005', 'Starting with Oracle ADF',\
  \ 'Steve Muench');\n```\n\n为 Web RowSet 实现配置 JDeveloper 10g。在 JDeveloper 中创建项目。选择\
  \ 文件 | 新建 | 通用 | 应用程序。在“创建应用程序”窗口中指定应用程序名称并单击“下一步”。在“创建项目”窗口中指定项目名称并单击“下一步”。项目已添加到应用程序导航器中。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_243_0.png)\n\n接下来，我们将设置项目库。选择 **工具 |\
  \ 项目属性** 并在 **项目属性** 窗口中选择 **库 | 添加库** 以添加库。将 **Oracle JDBC** 库添加到项目库中。如果使用早于 Oracle\
  \ 数据库 10g (R2) JDBC 驱动程序版本的 Oracle JDBC 驱动程序版本，请从 Oracle Web RowSet 实现类 JAR 文件 `C:\\\
  JDeveloper10.1.3\\jdbc\\lib\\ocrs12.jar` 创建库。`ocrs12.jar` 仅在 JDBC 驱动程序早于 Oracle\
  \ 数据库 10g (R2) JDBC 驱动程序时才需要。在 Oracle 数据库 10g (R2) JDBC 驱动程序中，Oracle RowSet 实现类打包在\
  \ `ojdbc14.jar` 中。在 Oracle 数据库 11g JDBC 驱动程序中，Oracle RowSet 实现类打包在 `ojdbc5.jar`\
  \ 和 `ojdbc6.jar` 中。\n\n在 **添加库** 窗口中选择 **用户** 节点并单击 **新建**。在 **创建库** 窗口中指定 **库名称**，选择\
  \ **类路径** 节点并单击 **添加条目**。为 `ocrs12.jar` 添加条目。由于 Web RowSet 在 J2SE 5.0 中引入，如果使用 J2SE\
  \ 1.4，我们还需要为 RowSet 实现 JAR 文件 `rowset.jar` 添加条目。从 `http://java.sun.com/products/jdbc/download.html#rowset1_0_1`\
  \ 下载 JDBC RowSet 实现 1.0.1 zip 文件 `jdbc_rowset_tiger-1_0_1-mrel-ri.zip` 并将 JDBC RowSet\
  \ zip 文件解压到目录中。在 **创建库** 窗口中单击 **确定**。在 **添加库** 窗口中单击 **确定**。Web RowSet 应用程序的库已添加。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_243_1.png)\n\n现在配置 OC4J 数据源。选择 工具 | 嵌入式\
  \ OC4J 服务器首选项。数据源可以全局配置或为当前工作区配置。如果使用 全局 | 数据源 创建全局数据源，则数据源配置在 C:\\JDeveloper10.1.3\\\
  jdev\\system\\oracle.j2ee.10.1.3.36.73\\embedded-oc4j\\config \\data-sources.xml\
  \ 文件中。如果使用 当前工作区 | 数据源 为当前工作区配置数据源，则数据源配置在 data-sources.xml 文件中。例如，WebRowSetApp\
  \ 应用程序的数据源文件是 WebRowSetApp-data-sources.xml。在“嵌入式 OC4J 服务器首选项”窗口中，使用第 2 章中讨论的流程配置全局数据源或当前工作区中的数据源。全局数据源定义可供部署在\
  \ OC4J 服务器实例中的所有应用程序使用。在 data-sources.xml 文件中添加了 managed-data-source 元素。\n\n```\n\
  <managed-data-source name='OracleDataSource' connection-pool-name='Oracle Connection\
  \ Pool' jndi-name='jdbc/OracleDataSource'/>\n<connection-pool name='Oracle Connection\
  \ Pool'>\n  <connection-factory factory-class='oracle.jdbc.pool.OracleDataSource'\
  \ user='OE' password='pw' url=\"jdbc:oracle:thin:@localhost:1521:ORCL\">\n  </connection-factory>\n\
  </connection-pool>\n```\n\n向 WebRowSet 项目添加一个 JSP，GenerateWebRowSet.jsp。选择 文件 |\
  \ 新建 | Web 层 | JSP | JSP。单击 确定。在 Web 应用程序窗口中选择 J2EE 1.3 或 J2EE 1.4 并单击 下一步。在 JSP\
  \ 文件窗口中指定文件名并单击 下一步。在“错误页面选项”页面中选择默认设置并单击 下一步。在“标记库”窗口中选择默认设置并单击 下一步。在“HTML 选项”窗口中选择默认选项并单击\
  \ 下一步。在“完成”窗口中单击 完成。接下来，配置 web.xml 部署描述符以包含对在 data-sources.xml 文件中配置的数据源资源的引用，如以下列表所示：\n\
  \n```\n<resource-ref>\n  <res-ref-name>jdbc/OracleDataSource</res-ref-name>\n  <res-type>javax.sql.DataSource</res-type>\n\
  \  <res-auth>Container</res-auth>\n</resource-ref>\n```\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_245_0.png)\n\
  \n## 创建 Web RowSet\n\n在本节中，我们将从数据库表创建 Web RowSet 并生成 Web RowSet 的 XML 文档表示形式。使用\
  \ 文件 | 新建 | 通用 | Java 类 在 JDeveloper 中创建 Java 类。在“创建 Java 类”窗口中指定类名 WebRowSetQuery\
  \ 和包名并单击 确定。Java 类 WebRowSetQuery.java 已添加到 WebRowSet 项目中。在 Java 应用程序中首先导入 oracle.jdbc.rowset\
  \ 包类。创建 OracleWebRowSet 类对象：\n\n```\nOracleWebRowSet webRowSet=new OracleWebRowSet();\n\
  ```\n\n设置数据源名称以获取与数据库的 JDBC 连接。数据源名称配置在 data-sources.xml 文件中：\n\n```\nwebRowSet.setDataSourceName(\"\
  jdbc/OracleDataSource\");\n```\n\n为 OracleWebRowSet 类对象设置 SQL 查询命令：\n\n```\nwebRowSet.setCommand(selectQuery);\n\
  ```\n\n变量 selectQuery 是用于查询数据库的 SQL 语句的字符串值。SQL 语句值从 JSP 中的输入字段获取。设置用户名和密码以获取 JDBC\
  \ 连接：\n\n```\nwebRowSet.setUsername(\"OE\");\nwebRowSet.setPassword(\"<password>\"\
  );\n```\n\n设置 OracleWebRowSet 对象的只读、获取大小和最大行属性：\n\n```\nwebRowSet.setReadOnly(false);\n\
  webRowSet.setFetchSize(5);\nwebRowSet.setMaxRows(3);\n```\n\n使用 execute() 方法运行 setCommand()\
  \ 方法中指定的 SQL 命令：\n\n```\nwebRowSet.execute();\n```\n\n使用 SQL 查询从数据库表检索的数据创建了一个 Web\
  \ RowSet。使用 writeXml() 方法从 Web RowSet 生成 XML 文档；\n\n```\nOutputStreamWriter output=new\
  \ OutputStreamWriter( new\nFileOutputStream(new File(\"c:/output/output.xml\")));\n\
  webRowSet.writeXml(output);\n```\n\nOracle Web RowSet 还提供 readXml() 方法，使用 Reader\
  \ 对象或 InputStream 对象以 XML 格式读取 Oracle Web RowSet 对象。如果要使用 readXml() 方法，请设置以下 JAXP\
  \ 系统属性之一：\n\n- javax.xml.parsers.SAXParserFactory\n- javax.xml.parsers.DocumentBuilderFactory\n\
  \n例如，按如下方式设置 SAXParserFactory 属性：\n\n```\nSystem.setProperty(\"javax.xml.parsers.SAXParserFactory\"\
  ,\n\"oracle.xml.jaxp.JXSAXParserFactory\");\n```\n\nWebRowSetQuery.java 还有读取、更新、删除和插入数据库表中的行的\
  \ 方法，将在后续章节中讨论。WebRowSetQuery.java 应用程序如下所示：\n\n```\npackage webrowset;\nimport\
  \ oracle.jdbc.rowset.*;\nimport java.io.*;\nimport java.sql.SQLException;\npublic\
  \ class WebRowSetQuery\n{\n```\n\npublic OracleWebRowSet webRowSet;\npublic String\
  \ selectQuery;\npublic WebRowSetQuery()\n{\n}\npublic WebRowSetQuery(OracleWebRowSet\
  \ webRowSet)\n{\n    this.webRowSet = webRowSet;\n}\npublic void generateWebRowSet(String\
  \ selectQuery)\n{\n    try\n    {\n        webRowSet = new OracleWebRowSet();\n\
  \        webRowSet.setDataSourceName(\"jdbc/OracleDataSource\");\n        webRowSet.setCommand(selectQuery);\n\
  \        webRowSet.setUsername(\"oe\");\n        webRowSet.setPassword(\"pw\");\n\
  \        webRowSet.setReadOnly(false);\n        webRowSet.setFetchSize(5);\n   \
  \     webRowSet.setMaxRows(3);\n        webRowSet.execute();\n    }\n    catch (SQLException\
  \ e)\n    {\n        System.out.println(e.getMessage());\n    }\n}\npublic void\
  \ generateXMLDocument()\n{\n    try\n    {\n        OutputStreamWriter output =\
  \ new OutputStreamWriter(\n                new FileOutputStream(new File(\"c:/output/output.xml\"\
  )));\n        webRowSet.writeXml(output);\n    }\n    catch (SQLException e)\n \
  \   {\n        System.out.println(e.getMessage());\n    }\n    catch (IOException\
  \ e)\n    {\n    }\n}\npublic void deleteRow(int row)\n{\n    try\n    {\n     \
  \   webRowSet.absolute(row);\n        webRowSet.deleteRow();\n    }\n    catch (SQLException\
  \ e)\n    {\n        System.out.println(e.getMessage());\n    }\n}\npublic void\
  \ insertRow(String journal, String publisher,\n        String edition, String title,\
  \ String author)\n{\n    try\n    {\n        webRowSet.moveToInsertRow();\n    \
  \    webRowSet.updateString(1, journal);\n        webRowSet.updateString(2, publisher);\n\
  \        webRowSet.updateString(3, edition);\n        webRowSet.updateString(4,\
  \ title);\n        webRowSet.updateString(5, author);\n        webRowSet.insertRow();\n\
  \    }\n    catch (SQLException e)\n    {\n        System.out.println(e.getMessage());\n\
  \    }\n}\npublic void updateRow(int rowUpdate, String journal,\n        String\
  \ publisher, String edition, String title, String author)\n{\n    try\n    {\n \
  \       webRowSet.absolute(rowUpdate);\n        webRowSet.updateString(1, journal);\n\
  \        webRowSet.updateString(2, publisher);\n        webRowSet.updateString(3,\
  \ edition);\n        webRowSet.updateString(4, title);\n        webRowSet.updateString(5,\
  \ author);\n        webRowSet.updateRow();\n    }\n    catch (SQLException e)\n\
  \    {\n        System.out.println(e.getMessage());\n    }\n}\npublic String[] readRow(int\
  \ rowRead)\n{\n    String[] resultSet = null;\n    try\n    {\n        resultSet\
  \ = new String[5];\n        webRowSet.absolute(rowRead);\n        resultSet[0] =\
  \ webRowSet.getString(1);\n        resultSet[1] = webRowSet.getString(2);\n    \
  \    resultSet[2] = webRowSet.getString(3);\n        resultSet[3] = webRowSet.getString(4);\n\
  \        resultSet[4] = webRowSet.getString(5);\n    }\n    catch (SQLException\
  \ e)\n    {\n        System.out.println(e.getMessage());\n    }\n    return resultSet;\n\
  }\npublic void updateDatabase()\n{\n    try\n    {\n        webRowSet.acceptChanges();\n\
  \    }\n    catch (java.sql.SQLException e)\n    {\n        System.out.println(e.getMessage());\n\
  \    }\n}\n}\n\n用于创建 Web RowSet 的 SELECT 查询从 GenerateWebRowSet.jsp JSP 输入，该 JSP\
  \ 已在“设置环境”部分中添加，下面列出：\n\n<%@ page contentType=\"text/html;charset=windows-1252\"\
  %>\n<html>\n<head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html;\n\
  \    charset=windows-1252\">\n    <title>Generate WebRowSet</title>\n</head>\n<body>\n\
  \    <form>\n    </form>\n    <%\n    String selectQuery=request.getParameter(\"\
  selectQuery\");\n    webrowset.WebRowSetQuery query=new webrowset.WebRowSetQuery();\n\
  \    if(selectQuery!=null)\n    {\n        query.generateWebRowSet(selectQuery);\n\
  \        query.generateXMLDocument();\n    }\n    %>\n    <form name=\"query\" action=\"\
  GenerateWebRowSet.jsp\" method=\"post\">\n    <table>\n        <tr>\n          \
  \  <td>Select Query:</td>\n        </tr><tr><td>\n            <textarea name=\"\
  selectQuery\" rows=\"5\"\n            cols=\"50\"></textarea>\n        </td>\n \
  \       </tr><tr><td>\n            <input class=\"Submit\" type=\"submit\" value=\"\
  Apply\"/>\n        </td>\n        </tr>\n    </table>\n    </form>\n</body>\n</html>\n\
  \n## Oracle Web RowSet\n\n右键单击 GenerateWebRowSet.jsp 并选择 Run 以运行 JSP。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_250_0.png)\n\
  \n在显示的 JSP 页面中，指定用于生成 Web RowSet 的 SQL 查询。例如，指定 SQL 查询：\n\n```\nSELECT JOURNAL,\
  \ PUBLISHER, EDITION, TITLE, AUTHOR FROM OE.Catalog\n```\n\n单击 Apply。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_251_0.png)\n\
  \n生成了一个 Web RowSet，并从 Web RowSet 生成了一个 XML 文档。Web RowSet 输出的 XML 文档包含 JDBC 数据源、数据库表以及表中的数据的元数据信息；data\
  \ 元素标签表示数据库表中的数据。从 Web RowSet 生成的 XML 文档基于 DTD (http://java.sun.com/j2ee/dtds/RowSet.dtd)。以下是从示例数据库表\
  \ Catalog 生成的 XML 文档：\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE\
