  </summary>\n</jasperReport>\n\n## 生成 PDF 报告\n\n我们将使用 JasperReports 类和接口从 catalog.xml\
  \ 文件生成 PDF 文件。使用 **File | New** 向 JasperReports 项目添加一个 XML 文件。在 **New Gallery**\
  \ 窗口中，在列出的 **Categories** 中选择 **General | XML**，在列出的 **Items** 中选择 **XML Document**。点击\
  \ **OK** 按钮。在 **Create XML File** 窗口中指定 **File Name** 为 catalog.xml，然后点击 **OK**\
  \ 按钮。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_355_0.png)\n\nXML 文档已添加到 JasperReports\
  \ 项目中。将上一节中的 catalog.xml 列表复制到 XML 文档 catalog.xml 中。使用 File | Save As 将 catalog.xml\
  \ 保存到 C:/JasperReports 目录。创建一个 JSP 来生成 JasperReports 报表。右键单击 JasperReports 项目节点并选择\
  \ New。在 New Gallery 窗口中，在列出的 Categories 中选择 Web Tier | JSP，在列出的 Items 中选择 JSP。点击\
  \ OK 按钮。在 Create JSP Wizard 中，点击 Next。在 Web Application 窗口中，选择 Servlet 2.4/JSP 2.0\
  \ 并点击 Next。在 JSP File 窗口中，将 File Name 指定为 catalog.jsp 并选择默认的 Directory Name。点击 Next。在\
  \ Error Page Options 窗口中选择默认选项并点击 Next。在 Tag Libraries 窗口中，点击 Next。在 HTML Options\
  \ 页面中，点击 Next。在 Finish 窗口中，点击 Finish。JSP catalog.jsp 已添加到 JasperReports 项目中。\n\n\
  ![](img/553e44bc30e70d0d8e58278a7ece8da8_356_0.png)\n\nJDBC 数据源 jdbc/JasperReportsConnectionDS\
  \ 必须在 JSP web.xml 配置文件中进行配置。在 web.xml 文件中添加以下 resource-ref 元素：\n\n```\n<resource-ref>\n\
  <res-ref-name>jdbc/JasperReportsConnectionDS</res-ref-name>\n<res-type>javax.sql.DataSource</res-type>\n\
  <res-auth>Container</res-auth>\n</resource-ref>\n```\n\n在 catalog.jsp 中，首先导入 JasperReports\
  \ 类和接口：\n\n```\n<%@ page import=\"java.io.*, java.util.*, java.sql.Connection, javax.sql.DataSource,\
  \ javax.naming.InitialContext, net.sf.jasperreports.engine.*, net.sf.jasperreports.engine.design.JasperDesign,\
  \ net.sf.jasperreports.engine.xml.JRXmlLoader\" %>\n```\n\n接下来，为 JasperReports 配置文件\
  \ catalog.xml 创建一个 InputStream。接下来，使用 JRXmlLoader 类的静态方法 load() 加载 XML 文件。load()\
  \ 方法被重载，XML 配置文件可以从 File 对象、InputStream 对象或 String 对象加载。load() 方法返回一个 JasperDesign\
  \ 对象。\n\n```\nInputStream input=new FileInputStream(new File(\"c:/JasperReports/\n\
  \ catalog.xml\"));\nJasperDesign design = JRXmlLoader.load(input);\n```\n\nJasperDesign\
  \ 对象表示报表设计。使用 JasperCompileManager 的 compileReport() 方法编译报表设计文件。编译报表设计文件会使用 jasperreports.dtd\
  \ DTD 验证 JasperReports XML 文件（catalog.xml），并将报表表达式转换为可求值形式。compileReport() 方法返回一个\
  \ JasperReport 对象，表示已编译的报表。\n\n```\nJasperReport report = JasperCompileManager.compileReport(design);\n\
  ```\n\n创建一个 Connection 对象以从数据库检索数据来创建 PDF 文件。创建一个 InitialContext 对象，使用 lookup()\
  \ 方法查找数据源 JNDI。使用 getConnection() 方法从数据源获取 JDBC 连接。\n\n```\nInitialContext initialContext\
  \ = new InitialContext();\nDataSource ds = (DataSource)initialContext.lookup\n(\"\
  java:comp/env/jdbc/JasperReportsConnectionDS\");\nConnection conn = ds.getConnection();\n\
  ```\n\n从已编译的报表生成 JasperReports 报表。使用 JasperFillManager 类的 fillReport() 方法用数据库中的数据填充已编译的报表。fillReport()\
  \ 方法返回一个 JasperPrint 对象，表示可查看、打印或导出到其他格式的报表文档：\n\n```\nJasperPrint print =JasperFillManager.fillReport(report,parameters,\n\
  \    conn);\n```\n\nfillReport() 方法中的参数由 XML 配置文件中 <parameter/> 元素指定的参数值组成。Catalog.xml\
  \ 有参数 ReportTitle，因此为 ReportTitle 参数指定一个值。\n\n```\nMap parameters = new HashMap();\n\
  parameters.put(\"ReportTitle\", \"PDF JasperReport\");\n```\n\nJasperReports 报表可以导出为\
  \ XML 文件、PDF 文件、HTML 文件、CSV 文件或 Excel XLS 文件。使用 JasperExportManager 类的 exportReportToPdfStream()\
  \ 方法将生成的 JasperReports 导出为 PDF 文件：\n\n```\nOutputStream output=new FileOutputStream(new\
  \ File(\"c:/JasperReports/\n catalog.pdf\"));\nJasperExportManager.exportReportToPdfStream(print,\
  \ output);\n```\n\nJSP 文件 catalog.jsp 如下所示：\n\n```\n<%@ page contentType=\"text/html;charset=windows-1252\"\
  %>\n<%@ page import=\"java.io.*, java.util.*, java.sql.Connection, javax.sql.DataSource,\
  \ javax.naming.InitialContext, net.sf.jasperreports.engine.*, net.sf.jasperreports.engine.design.JasperDesign,net.sf.jasperreports.engine.xml.JRXmlLoader\"\
  \ %>\n<%InputStream input=new FileInputStream(new\nFile(\"c:/JasperReports/catalog.xml\"\
  ));\nJasperDesign design = JRXmlLoader.load(input);\nJasperReport report = JasperCompileManager.compileReport(design);\n\
  Map parameters = new HashMap();\nparameters.put(\"ReportTitle\", \"PDF JasperReport\"\
  );\nInitialContext initialContext = new InitialContext();\nDataSource ds = (DataSource)initialContext.lookup\n\
  (\"java:comp/env/jdbc/JasperReportsConnectionDS\");\nConnection conn = ds.getConnection();\n\
  JasperPrint print = JasperFillManager.fillReport(report,\nparameters, conn);\nOutputStream\
  \ output=new FileOutputStream\n(new File(\"c:/JasperReports/catalog.pdf\"));\nJasperExportManager.exportReportToPdfStream(print,\
  \ output);%>\n```\n\n将 catalog.jsp 列表中的代码复制到 JasperReports 应用程序中的 catalog.jsp。要运行\
  \ catalog.jsp JSP，右键单击 catalog.jsp 节点并选择 Run。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_358_0.png)\n\
  \n\n\n生成 catalog.pdf PDF 文件。PDF 文件可以在 Adobe Acrobat Reader 中打开。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_359_0.png)\n\
  \n## 创建 Excel 电子表格\n\n在 JDeveloper 中的 JasperReports 项目中创建 catalog-excel.jsp 以创建\
  \ Excel 电子表格。如果需要 Excel 报表，请使用 JRXlsExporter 对象将 JasperReports 文档导出到 Excel 电子表格。指定\
  \ OutputStream 以输出 Excel 电子表格。为 JRXlsExporter 对象的输出指定 ByteArrayOutputStream：\n\n\
  ```\nOutputStream outputStream=new FileOutputStream\n(new File(\"c:/JasperReports/catalog.xls\"\
  ));\nByteArrayOutputStream byteArrayOutputStream = new\nByteArrayOutputStream();\n\
  ```\n\n创建 JRXlsExporter 对象并设置要生成的报表来源的 JasperPrint 对象以及用于输出报表的 OutputStream。\n\n\
  ```\nJRXlsExporter exporterXLS = new JRXlsExporter();\nexporterXLS.setParameter(JRXlsExporterParameter.JASPER_PRINT,\
  \ print);\nexporterXLS.setParameter\n(JRXlsExporterParameter.OUTPUT_STREAM,byteArrayOutputStream);\n\
  ```\n\n使用 exportReport() 方法导出 JasperReport 文档：\n\n```\nexporterXLS.exportReport();\n\
  ```\n\n将 JasperReports excel 报表输出到 catalog.xls 文件：\n\n```\noutputStream.write(byteArrayOutputStream.toByteArray());\n\
  outputStream.flush();\noutputStream.close();\n```\n\n以下是 catalog-excel.jsp 的内容：\n\
  \n```\n<%@ page contentType=\"text/html;charset=windows-1252\"%>\n<%@ page import=\"\
  java.io.*, java.util.*, java.sql.Connection, javax.\nsql.DataSource, javax.naming.InitialContext,\n\
  net.sf.jasperreports.engine.*, net.sf.jasperreports.engine.design.\nJasperDesign,net.sf.jasperreports.engine.xml.JRXmlLoader,\n\
  net.sf.jasperreports.engine.export.*\"\n%>\n<%\n    InputStream input=new FileInputStream\n\
  \        (new File(\"c:/JasperReports/catalog.xml\"));\n    JasperDesign design\
  \ = JRXmlLoader.load(input);\n    JasperReport report = JasperCompileManager.compileReport(design);\n\
  \    Map parameters = new HashMap();\n    parameters.put(\"ReportTitle\", \"Excel\
  \ JasperReport\");\n    InitialContext initialContext = new InitialContext();\n\
  \    DataSource ds = (DataSource)initialContext.lookup\n        (\"java:comp/env/jdbc/JasperReportsConnectionDS\"\
  );\n    Connection conn = ds.getConnection();\n    JasperPrint print = JasperFillManager.fillReport\n\
  \        (report, parameters, conn);\n        OutputStream outputStream=new FileOutputStream\n\
  \            (new File(\"c:/JasperReports/catalog.xls\"));\n        ByteArrayOutputStream\
  \ byteArrayOutputStream = new\n            ByteArrayOutputStream();\n        JRXlsExporter\
  \ exporterXLS = new JRXlsExporter();\n        exporterXLS.setParameter(\n      \
  \      JRXlsExporterParameter.JASPER_PRINT, print);\n        exporterXLS.setParameter(JRXlsExporterParameter.\n\
  \            OUTPUT_STREAM, byteArrayOutputStream);\n        exporterXLS.exportReport();\n\
  \        outputStream.write(byteArrayOutputStream.toByteArray());\n        outputStream.flush();\n\
  \        outputStream.close();\n%>\n```\n\n要生成 Excel 报表，请右键单击 catalog-excel.jsp\
  \ 并选择 Run。\nExcel 电子表格可在 MS Excel 或 Excel Viewer 中打开。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_360_0.png)\n\
  \n## JDBC 4.0 版本\n\n在 JasperReports 应用的 JDBC 4.0 版本中，要生成 PDF 报表，请使用 Oracle 数据库 11g\
  \ JDBC 4.0 驱动 JAR 文件 ojdbc6.jar 代替 Oracle JDBC 库。JDBC 4.0 驱动程序需要 JDK 6.0。因此，在 Project\
  \ Properties 窗口中将 J2SE Version 设置为 JDK 6.0。要修改 J2SE Version，请在 Project Properties\
  \ 窗口中选择 Libraries 节点。单击 J2SE Version 字段的 Change 按钮。在 Edit J2SE Definition 窗口中，单击\
  \ New 以创建 JDK 6.0 的 J2SE 定义。在 Create J2SE 窗口中，选择一个 JDK 6.0 Java Executable 并单击 OK。在\
  \ Edit J2SE Definition 窗口中选择 JDK 6.0 定义并单击 OK。Project Properties 窗口中的 J2SE Version\
  \ 将被设置为 JDK 6.0。在 Project Properties 中单击 OK。\n\n可以在支持嵌入式 OC4J 中 JDBC 4.0 的 JDeveloper\
  \ 版本中使用 JDBC 4.0 功能。JDBC 4.0 提供了增强的连接管理，具有连接状态跟踪和连接客户端标识。连接状态跟踪由连接池管理器实现。如果连接池中的某些连接变得不可用，连接池管理器会关闭这些连接。在连接状态跟踪功能之前，如果某些连接变得不可用，连接池管理器通常会关闭所有连接并重新初始化连接池。关闭连接并打开新连接会产生开销。支持\
  \ JDBC 4.0 的 JDK 6.0 中的 Connection 接口具有 isValid() 方法来测试连接的有效性。连接池管理器在连接上调用 isValid\
  \ 方法，如果连接返回 false，则连接池管理器使用 close() 方法关闭连接，如下所示：\n\n```\nif(!connection.isValid())\n\
  \    connection.close();\n```\n\n连接客户端标识由 JDBC 驱动程序实现。连接客户端标识用于识别因 CPU 使用过度而可能拖慢应用的连接。JDK\
  \ 6.0 Connection 接口提供了两个用于连接客户端标识的新方法；setClientInfo() 和 getClientInfo()。Connection\
  \ 对象可通过使用 setClientInfo() 设置在 Connection 上的客户端信息属性来标识。数据库支持的不同客户端信息属性可通过 DatabaseMetaData\
  \ 接口的 getClientInfoProperties 方法从数据库元数据中获取。\n\n```\nDatabaseMetaData metaData=connection.getMetaData();\n\
  ResultSet clientInfo=metaData.getClientInfoProperties();\n```\n\n标准客户端信息属性为 ApplicationName、ClientUser\
  \ 和 ClientHostname。在 JasperReports 应用的 JDBC 4.0 版本中，按如下方式设置标准客户端信息属性：\n\n```\nconnection.setClientInfo(\"\
  ApplicationName\",\"OracleApp\");\nconnection.setClientInfo(\"ClientUser\",\"OracleUser\"\
  );\nconnection.setClientInfo(\"ClientHostname\",\"OracleHost\");\n```\n\n在 JasperReports\
  \ 应用的 JDBC 4.0 版本中，我们还可以利用 Java SE 链式异常设施的支持。在 JasperReports JSP 中指定一个错误页面，并在错误页面中，使用\
  \ J2SE 5.0 中引入的增强 for-each 循环检索链式异常和链式原因，如下所示：\n\n```\nfor(Throwable e : exception\
  \ ) {\n    out.println(\"Error encountered: \" + e);\n}\n```\n\n以下是生成 PDF 报表的 JasperReports\
  \ 应用的 JDBC 4.0 版本：\n\n```\n<%@ page contentType=\"text/html;charset=windows-1252\"\
  %>\n<%@ page import=\"java.io.*, java.util.*, java.sql.Connection, javax.sql.DataSource,\
  \ javax.naming.InitialContext, net.sf.jasperreports.engine.*, net.sf.jasperreports.engine.design.JasperDesign,net.sf.jasperreports.engine.xml.JRXmlLoader\"\
  \ %>\n<%\n    InputStream input=new FileInputStream\n    (new File(\"c:/JasperReports/catalog.xml\"\
  ));\n    JasperDesign design = JRXmlLoader.load(input);\n    JasperReport report\
  \ = JasperCompileManager.compileReport(design);\n    Map parameters = new HashMap();\n\
  \    parameters.put(\"ReportTitle\", \"PDF JasperReport\");\n    InitialContext\
  \ initialContext = new InitialContext();\n    DataSource ds = (DataSource)initialContext.lookup\n\
  \    (\"java:comp/env/jdbc/JasperReportsConnectionDS\");\n    Connection conn =\
  \ ds.getConnection();\n    connection.setClientInfo(\"ApplicationName\",\"OracleApp\"\
  );\n    connection.setClientInfo(\"ClientUser\",\"OracleUser\");\n    connection.setClientInfo(\"\
  ClientHostname\",\"OracleHost\");\n\n    JasperPrint print = JasperFillManager.fillReport(report,\
  \ parameters, conn);\n    OutputStream output=new FileOutputStream(new File(\"c:/JasperReports/catalog.pdf\"\
  ));\n    JasperExportManager.exportReportToPdfStream(print, output);\n%>\n```\n\n\
  相同的修改也适用于生成 Excel 电子表格的 JasperReports 应用。\n\n## 摘要\n\nJasperReports 是一个 Java 报表工具，用于生成\
  \ HTML、XML、PDF、CSV 或 XLS 报表。在本章中，我们学习了如何使用 JDBC 连接数据库并运行 SQL 查询，从数据库表中创建 PDF 和 Excel\
  \ 电子表格报表。我们在 JasperReports 应用的 JDBC 4.0 版本中添加了 JDBC 4.0 功能连接状态跟踪和连接客户端标识。\n\n\n"
- "## 13 使用 Apache POI 创建电子表格\n\n## 使用 Apache POI 创建电子表格\n\n数据库表数据通常需要以 Excel 电子表格的形式呈现。Apache\
  \ POI 项目提供了用于处理 Microsoft OLE 2 复合文档格式文件的 Java API，其中包括 XLS 和 DOC 文件。Apache POI\
  \ 项目的 **Apache POI HSSF** 组件是一个用于访问和生成 Excel 工作簿和 Excel 电子表格的 Java API。Apache POI\
  \ HSSF 不支持新的 Excel 2007 .xlsx OOXML 文件格式，该格式不是基于 OLE2 的。Excel 工作簿由电子表格组成，而 Excel\
  \ 电子表格由行和单元格组成。电子表格的布局和字体也可以通过 Apache POI HSSF Java API 设置。\n\nApache POI HSSF 项目是用于创建\
  \ Excel 工作簿和 Excel 电子表格的 Java API。Apache POI HSSF 项目的实现在 `org.apache.poi.hssf.usermodel`\
  \ 包中提供。使用 POI HSSF 项目生成的 Excel 电子表格中的数据可能是静态数据，也可能是从数据库动态检索的数据。本章将讨论从 Oracle 数据库表创建\
  \ Excel 电子表格的步骤。Excel 电子表格在 JDeveloper IDE 中生成。\n\n## 设置环境\n\n生成 Excel 电子表格需要 `org.apache.poi.hssf.usermodel`\
  \ 包中的类。从 `http://www.apache.org/dyn/closer.cgi/poi/` 下载 Apache POI 库的 `poi-bin-3.0.2-FINAL-20080204.zip`\
  \ 文件并将其解压到安装目录。安装 JDeveloper 10g (10.1.3)。安装包含示例模式的 Oracle 数据库 10g。创建数据库实例。创建一个示例数据库表，将从中生成\
  \ Excel 电子表格。创建示例表 `catalog` 的 SQL 脚本如下所示：\n\n```sql\nCREATE TABLE OE.Catalog(CatalogId\
  \ VARCHAR(25), Journal VARCHAR(25),\n    Publisher Varchar(25),Edition VARCHAR(25),\
  \ Title Varchar(255),\n    Author Varchar(25));\n\nINSERT INTO OE.Catalog VALUES('catalog1',\
  \ 'Oracle Magazine',\n    'Oracle Publishing', 'March-April 2005', 'Starting with\
  \ Oracle ADF'\n    , 'Steve Muench');\n\nINSERT INTO OE.Catalog VALUES('catalog2',\
  \ 'Oracle Magazine',\n    'Oracle Publishing','Jan-Feb 2005', 'Understanding Optimization',\n\
  \    'Kimberly Floss');\n```\n\n接下来，我们将创建一个用于生成 Excel 电子表格的 JDeveloper 项目，并向项目中添加\
  \ Apache POI JAR 文件的库。此外，我们将使用 Oracle 数据库创建 JDBC 连接以检索用于 Excel 电子表格的数据。\n\n首先，从\
  \ JDeveloper IDE 创建到 Oracle 数据库的 JDBC 连接。要创建连接，请选择 Connections 选项卡，在 Connections\
  \ Navigator 中选择 Database 节点，右键单击 Database 节点，然后选择 New Database Connection。在显示的 Create\
  \ Database Connection (Type) 窗口中，指定 Connection Name 并将 Connection Type 设置为 Oracle(JDBC)。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_366_0.png)\n\n单击 **Next**。在 **Authentication**\
  \ 窗口中，指定 **Username** 和 **Password**，然后单击 **Next**。在 **Connection** 窗口中，指定 **Driver\
  \ type**、**Host Name**、**JDBC Port**、**SID**，然后单击 **Next**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_367_0.png)\n\
  \n在 **Test** 窗口中，单击 **Test Connection**。如果与数据库的连接已建立，则会显示成功消息。单击 **Finish** 完成连接配置。连接节点将被添加到\
  \ **Connections Navigator**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_367_1.png)\n\
  \nJDBC 连接 `ApachePOIConnection` 可作为数据源 `jdbc/ApachePOIConnectionDS` 使用。该数据源用于从数据库检索数据以生成\
  \ Excel 电子表格。接下来，创建一个用于生成 Excel 电子表格的 JDeveloper 项目。在 JDeveloper IDE 中选择 **File\
  \ | New**。在 **New Gallery** 窗口中，在列出的 **Categories** 中选择 **General | Applications**，并在列出的\
  \ **Items** 中选择 **Application**。单击 **OK** 按钮。在 **Create Application** 窗口中，指定 **Application\
  \ Name**，选择 **No Template Application Template**，然后单击 **OK** 按钮。在 **Create Project**\
  \ 窗口中，指定 **Project Name** 并单击 **OK** 按钮。应用程序和项目将被添加到 **Applications Navigator.**\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_368_0.png)\n\n接下来，向项目添加 Apache POI JAR\
  \ 文件的库。在 **Applications Navigator** 中选择 Apache POI 项目节点。选择 **Tools | Project Properties**。在\
  \ **Project Properties** 窗口中，选择 **Libraries** 节点。单击 **Add Library** 按钮创建新库。在 **Add\
  \ Library** 窗口中单击 **New** 按钮添加新库。在 **Create Library** 窗口中指定 **Library Name** 并单击\
  \ **Add Entry** 按钮。\n\n在 **Select Path Entry** 窗口中选择 `poi-3.0.2-FINAL-20080204.jar`\
  \ 文件并单击 **Select** 按钮。所选 JAR 文件将被添加到 **Create Library** 窗口中的 **Class Path** 节点。在\
  \ **Create Library** 窗口中单击 **OK** 按钮。Apache POI 库被添加到 **Add Library** 窗口。在 **Add\
  \ Library** 窗口中单击 **OK** 按钮。Apache POI 库已创建并添加到 **Libraries**。`poi-3.0.2-FINAL-20080204.jar`\
  \ 文件也可以使用 **Add Jar/Directory** 按钮添加到 ApachePOI 项目。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_369_0.png)\n\
  \n## 创建 Excel 电子表格\n\n在本节中，将从示例数据库表生成 Excel 电子表格。首先，创建一个 JSP 应用程序以生成 Excel 电子表格。在\
  \ **Applications Navigator** 中右键单击 ApachePOI 项目节点并选择 **New**。在 **New Gallery** 窗口中选择\
  \ **Web Tier | Java Server Pages**。在列出的 **Items** 中，选择 **JSP Page** 并单击 **OK** 按钮。在\
  \ **Create JSP Wizard** 中选择 **Web Application** 版本并单击 **Next** 按钮。在 **JSP File**\
  \ 窗口中指定文件名并单击 **Next**。在 **Tag Libraries** 窗口中单击 **Next** 按钮。在 **HTML Options**\
  \ 页面中选择默认选项并单击 **Next** 按钮。在 **Finish** 窗口中，单击 **Finish**。JSP 被添加到 **Applications\
  \ Navigator** 中的 Apache POI 项目。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_369_1.png)\n\
  \n向 JSP `web.xml` 配置文件添加 JDBC 数据源 `jdbc/ApachePOIConnectionDS` 的资源引用，该数据源已在上一节中配置。向\
  \ `web.xml` 文件添加 `resource-ref` 元素。\n\n```\n<resource-ref>\n    <res-ref-name>jdbc/ApachePOIConnectionDS</res-ref-name>\n\
  \    <res-type>javax.sql.DataSource</res-type>\n    <res-auth>Container</res-auth>\n\
  </resource-ref>\n```\n\n在 `catalog.jsp` 中，将从 Oracle 数据库表创建 Excel 电子表格。使用 Apache\
  \ POI HSSF 项目生成 Excel 电子表格。Apache POI HSSF 包具有用于 Excel 电子表格不同组件的类。Apache POI HSSF\
  \ 包中一些常用的类列在下表中。\n\n| 类名 | 描述 |\n|---|---|\n| HSSFWorkbook | 表示 Excel 电子表格工作簿。 |\n\
  | HSSFSheet | 表示 Excel 电子表格。 |\n| HSSFHeader | 指定电子表格页眉。 |\n| HSSFRow | 指定电子表格行。\
  \ |\n| HSSFCell | 指定电子表格单元格 |\n| HSSFCellStyle | 指定单元格样式 |\n| HSSFFont | 指定电子表格的字体\
  \ |\n| HSSFChart | 表示图表 |\n| HSSFDateUtil | 指定 Excel 日期 |\n| HSSFPrintSetup | 指定\
  \ Excel 文档的打印设置 |\n\n在 JSP 应用程序中，首先导入 Apache POI HSSF 包：\n\n```\n<%@ page import=\"\
  org.apache.poi.hssf.usermodel.*, java.sql.*, java.io.*,javax.naming.InitialContext\"\
  %>\n```\n\n使用 `HSSFWorkbook` 类创建 Excel 电子表格工作簿：\n\n```\nHSSFWorkbook wb=new HSSFWorkbook();\n\
  ```\n\n接下来，使用 `createSheet()` 方法从 `HSSFWorkbook` 对象创建 Excel 电子表格：\n\n```\nHSSFSheet\
  \ sheet1=wb.createSheet(\"sheet1\");\n```\n\n\n\n\n样式表的数据从 Oracle 数据库表中检索。 从数据库获取\
  \ JDBC 连接。 首先，创建一个 InitialContext 对象。 随后，使用 InitialContext 类的 lookup() 方法创建 DataSource\
  \ 对象以查找数据源 JNDI。 使用 getConnection() 方法从 DataSource 对象获取连接：\n\n```\nInitialContext\
  \ initialContext = new InitialContext();\njavax.sql.DataSource ds = (javax.sql.DataSource)\n\
  initialContext.lookup(\"java:comp/env/jdbc/ApachePOIConnectionDS\");\njava.sql.Connection\
  \ conn = ds.getConnection();\n```\n\n使用 Connection 接口的 createStatement() 方法创建 Statement\
  \ 对象。 使用 Statement 接口的 executeQuery() 方法在 Catalog 表上运行 SQL 查询以生成 ResultSet 对象。\n\
  \n```\nStatement stmt=conn.createStatement();\nResultSet resultSet=stmt.executeQuery(\"\
  Select * from Catalog\");\n```\n\n使用 HSSFRow 类的 createRow() 方法为 Excel 电子表格创建标题行。\
  \ Excel 电子表格中的行以 '0' 为基数。\n\n```\nHSSFRow row=sheet1.createRow(0);\n```\n\n设置标题行单元格值以对应表列。\
  \ 使用 HSSFRow 类的 createCell() 方法创建单元格并使用 setCellValue() 方法设置单元格值。 例如，行中第一个单元格的值设置为\
  \ CatalogId 如下：\n\n```\nrow.createCell((short)0).setCellValue(\"CatalogId\");\n\
  ```\n\n要向电子表格添加行，请遍历结果集并为每个表行添加一行。 从 ResultSet 检索列值并将值设置在行单元格中：\n\n```\nfor (int\
  \ i=1;resultSet.next(); i++){\n    row=sheet1.createRow(i);\n    row.createCell((short)0).setCellValue(resultSet.getString(1));\n\
  \    row.createCell((short)1).setCellValue(resultSet.getString(2));\n    row.createCell((short)2).setCellValue(resultSet.getString(3));\n\
  \    row.createCell((short)3).setCellValue(resultSet.getString(4));\n    row.createCell((short)4).setCellValue(resultSet.getString(5));\n\
  }\n```\n\n创建目录 C:/excel。 创建 FileOutputStream 将 Excel 电子表格输出到 XLS 文件。 XLS 文件表示 excel\
  \ 电子表格。\n\n```\nFileOutputStream output=new FileOutputStream(new File(\"c:/excel/catalog.xls\"\
  ));\n```\n\n使用 HSSFWorkbook 类的 write() 方法将 Excel 电子表格输出到 XLS 文件。\n\n```\nwb.write(output);\n\
  ```\n\n下面列出了用于生成 Excel 电子表格的 catalog.jsp。\n\n```jsp\n<%@ page contentType=\"text/html;charset=windows-1252\"\
  %>\n<%@ page import=\"org.apache.poi.hssf.usermodel.*, java.sql.*, java.io.*,javax.naming.InitialContext\"\
  %>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=windows-1252\"\
  >\n<title>untitled</title>\n</head>\n<body><%HSSFWorkbook wb=new HSSFWorkbook();\n\
  HSSFSheet sheet1=wb.createSheet(\"sheet1\");\nInitialContext initialContext = new\
  \ InitialContext();\njavax.sql.DataSource ds = (javax.sql.DataSource)\ninitialContext.lookup(\"\
  java:comp/env/jdbc/ApachePOIConnectionDS\");\njava.sql.Connection conn = ds.getConnection();\n\
  Statement stmt=conn.createStatement();\nResultSet resultSet=stmt.executeQuery(\"\
  Select * from Catalog\");\nHSSFRow row=sheet1.createRow(0);\nrow.createCell((short)0).setCellValue(\"\
  CatalogId\");\nrow.createCell((short)1).setCellValue(\"Journal\");\nrow.createCell((short)2).setCellValue(\"\
  Publisher\");\nrow.createCell((short)3).setCellValue(\"Edition\");\nrow.createCell((short)4).setCellValue(\"\
  Title\");\nrow.createCell((short)5).setCellValue(\"Author\");\nfor (int i=1;resultSet.next();\
  \ i++)\n{\nrow=sheet1.createRow(i);\nrow.createCell((short)0).setCellValue(resultSet.getString(1));\n\
  row.createCell((short)1).setCellValue(resultSet.getString(2));\nrow.createCell((short)2).setCellValue(resultSet.getString(3));\n\
  row.createCell((short)3).setCellValue(resultSet.getString(4));\nrow.createCell((short)4).setCellValue(resultSet.getString(5));\n\
  row.createCell((short)5).setCellValue(resultSet.getString(6));\n}\nFileOutputStream\
  \ output=new FileOutputStream(new File(\"c:/excel/catalog.xls\"));\nwb.write(output);\n\
  output.close();\nresultSet.close();\nstmt.close();\nconn.close();\n%>\n</body>\n\
  </html>\n```\n\n要在 JDeveloper 嵌入式 OC4J 服务器中运行 catalog.jsp JSP，请在 Applications-Navigator\
  \ 中右键单击 JSP 节点并选择 Run。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_373_0.png)\n\n\
  ## Creating a Spreadsheet with Apache POI\n\n生成了一个可在 MS Excel 或 Excel Viewer 工具中打开的\
  \ Excel 电子表格：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_374_0.png)\n\n## JDBC\
  \ 4.0 Version\n\n在 Apache POI 应用程序的 JDBC 4.0 版本中，我们需要使用 Oracle 数据库 11g JDBC 4.0\
  \ 驱动程序创建与 Oracle 数据库的 JDBC 连接，该驱动程序可从以下位置获取： http://www.oracle.com/technology/software/tech/java/sqlj_jdbc/htdocs/jdbc_111060.html。\
  \ 使用 ojdbc6.jar JDBC JAR 文件配置与 Oracle 数据源的 JDBC 连接和数据源。 由于 JDBC 4.0 驱动程序需要 JDK 6.0，请通过选择\
  \ Tools | Project Properties 将 J2SE 版本设置为 JDK 6.0。 在 Project Properties 窗口中，选择 Libraries\
  \ 节点并在 J2SE Version 字段中选择 JDK 6.0 Java 可执行文件。\n\n我们将向 Apache POI 应用程序添加以下 JDBC 4.0\
  \ 功能：\n\n- Connection state tracking\n- Connection client identification using client\
  \ info properties\n- Statement pooling\n- Wrapper pattern\n- Java SE chained exception\
  \ facility\n\n连接状态跟踪由连接池管理器实现，用于识别连接池中变得不可用的连接。 JDBC 4.0 在 Connection 接口中提供 isValid()\
  \ 方法用于连接状态跟踪。 如果 isValid() 方法返回 false，连接池管理器将关闭连接。\n\n```\nif (!connection.isValid())\n\
  connection.close();\n```\n\n连接客户端标识用于识别可能因 CPU 使用过多而导致性能下降的连接。 连接使用客户端信息属性与应用程序客户端关联。\
  \ JDBC 4.0 中的 Connection 接口包括两个新方法 setClientInfo() 和 getClientInfo()，用于设置和获取客户端信息属性。\
  \ 数据库支持的客户端信息属性可使用 DatabaseMetaData 接口的 getClientInfoProperties() 方法检索，如下所示：\n\n\
  ```\nDatabaseMetaData metaData=connection.getMetaData();\nResultSet rsClientInfo=metaData.getClientInfoProperties();\n\
  ```\n\n标准客户端信息属性 ApplicationName、ClientUser 和 ClientHostname 可按如下方式设置在 Connection\
  \ 对象上：\n\n```\nconn.setClientInfo(\"ApplicationName\",\"OracleApp\");\nconn.setClientInfo(\"\
  ClientUser\",\"OracleUser\");\nconn.setClientInfo(\"ClientHostname\",\"OracleHost\"\
  );\n```\n\n如果数据库支持语句池，则 PreparedStatement 对象默认会被池化。 JDBC 4.0 还增加了池化 Statement 对象的功能。\
  \ 建议对频繁使用的 Statement 对象进行池化，以避免关闭和打开新 Statement 对象的开销。 Statement 池化使用 Statement\
  \ 对象的 isPoolable() 和 setPoolable() 方法实现，如下所示：\n\n```\nif (stmt.isPoolable())\nstmt.setPoolable(true);\n\
  ```\n\nJDBC 4.0 中的 Wrapper 接口使用包装器模式提供对 JDBC API 供应商特定扩展中的非标准 JDBC 方法的访问。 Wrapper\
  \ 接口由以下 JDBC 接口扩展：\n\n- CachedRowSet\n- CallableStatement\n- Connection\n- DatabaseMetaData\n\
  - DataSource\n- FilteredRowSet\n- JdbcRowSet\n- JoinRowSet\n- ParameterMetaData\n\
  - PreparedStatement\n- ResultSet\n- ResultSetMetaData\n- RowSet\n- RowSetMetaData\n\
  - Statement\n- WebRowSet\n\n任何扩展这些接口的供应商特定接口都实现了包装器模式，因为它也扩展了 Wrapper 接口。 例如，Oracle\
  \ 对 JDBC API 的扩展中的 OracleStatement 接口扩展了 Statement 接口，从而扩展了 Wrapper 接口。 OracleStatement\
  \ 接口提供了 Statement 接口中未定义的方法。 我们将使用 OracleStatement 接口而不是 Statement 接口来运行 SQL 查询。\
  \ 要创建 OracleStatement 对象，首先使用 isWrapperFor() 方法确定 Statement 对象是否为 OracleStatement\
  \ 接口的包装器。 如果是包装器，则使用 Wrapper 接口中的 unwrap() 方法解包 OracleStatement 接口以创建 OracleStatement\
  \ 对象。随后调用 OracleStatement 对象的 defineColumnType() 方法来设置列类型。\n\nJDBC 4.0 支持 Java SE\
  \ 链式异常设施以检索链式异常和链式原因。 链式异常是链接到异常的异常。 JDBC 4.0 支持在 J2SE 5.0 中引入的增强 for 循环来遍历链式异常，如下所示：\n\
  \n```\nfor(Throwable e : exception ) {\n    out.println(\"Error encountered: \"\
  \ + e);\n}\n```\n\nApache POI 应用程序的 JDBC 4.0 版本列如下。\n\n```\n<%@ page contentType=\"\
  text/html;charset=windows-1252\"%>\n<%@ page import=\"org.apache.poi.hssf.usermodel.*,\
  \ java.sql.*, java.io.*,javax.naming.InitialContext, oracle.jdbc.OracleStatement\"\
  %>\n```\n\n<html>\n    <head>\n        <meta http-equiv=\"Content-Type\" content=\"\
  text/html;\ncharset=windows-1252\">\n        <title>untitled</title>\n    </head>\n\
  \    <body><%\nResultSet resultSet;\nHSSFWorkbook wb=new HSSFWorkbook();\nHSSFSheet\
  \ sheet1=wb.createSheet(\"sheet1\");\nInitialContext initialContext = new InitialContext();\n\
  \    javax.sql.DataSource ds = (javax.sql.DataSource)\n    initialContext.lookup(\"\
  java:comp/env/jdbc/ApachePOIConnectionDS\n\");\n    java.sql.Connection conn = ds.getConnection();\n\
  \nconn.setClientInfo(\"ApplicationName\",\"OracleApp\");\nconn.setClientInfo(\"\
  ClientUser\",\"OracleUser\");\nconn.setClientInfo(\"ClientHostname\",\"OracleHost\"\
  );\n\nStatement stmt=conn.createStatement();\nDatabaseMetaData metaData=conn.getMetaData();\n\
  if(metaData.supportsStatementPooling()){\nif(stmt.isPoolable())\nstmt.setPoolable(true);\n\
  }\n\nClass clazz = Class.forName(\"oracle.jdbc.OracleStatement\");\nif(stmt.isWrapperFor(clazz))\
  \ {\nOracleStatement oracleStmt = (OracleStatement)stmt.unwrap(clazz);\noracleStmt.defineColumnType(1,\
  \ OracleTypes.VARCHAR);\noracleStmt.defineColumnType(2, OracleTypes.VARCHAR);\n\
  oracleStmt.defineColumnType(3, OracleTypes.VARCHAR);\noracleStmt.defineColumnType(4,\
  \ OracleTypes.VARCHAR);\noracleStmt.defineColumnType(5, OracleTypes.VARCHAR);\n\
  oracleStmt.defineColumnType(6, OracleTypes.VARCHAR);\n\nresultSet=oracleStmt.executeQuery(\"\
  SELECT * FROM OE.CATALOG\");\n}\nHSSFRow row=sheet1.createRow(0);\nrow.createCell((short)0).setCellValue(\"\
  CatalogId\");\nrow.createCell((short)1).setCellValue(\"Journal\");\nrow.createCell((short)2).setCellValue(\"\
  Publisher\");\nrow.createCell((short)3).setCellValue(\"Edition\");\nrow.createCell((short)4).setCellValue(\"\
  Title\");\nrow.createCell((short)5).setCellValue(\"Author\");\n    for (int i=1;resultSet.next();\
  \ i++)\n    {\nrow=sheet1.createRow(i);\nrow.createCell((short)0).setCellValue(resultSet.getString(1));\n\
  row.createCell((short)1).setCellValue(resultSet.getString(2));\nrow.createCell((short)2).setCellValue(resultSet.getString(3));\n\
  row.createCell((short)3).setCellValue(resultSet.getString(4));\nrow.createCell((short)4).setCellValue(resultSet.getString(5));\n\
  row.createCell((short)5).setCellValue(resultSet.getString(6));\n    }\nFileOutputStream\
  \ output=new FileOutputStream(new File(\"c:/excel/catalog.xls\"));\nwb.write(output);\n\
  output.close();\nresultSet.close();\nstmt.close();\nconn.close();\n%>\n    </body>\n\
  </html>\n\n## 摘要\n\n在本章中，使用 Apache POI HSSF API 从 Oracle 数据库表中生成了一个 Excel 电子表格。Apache\
  \ POI HSSF API 也可以用于解析 Excel 电子表格并随后将电子表格存储到数据库中。在 Apache POI 应用的 JDBC 4.0 版本中，我们添加了\
  \ JDBC 4.0 功能，包括连接状态跟踪、设置客户端信息属性、语句缓存、使用 Wrapper 接口访问非标准 JDBC 方法，以及 Java SE 链式异常机制。\n"
- "## 14 创建 Oracle ADF 业务组件\n\nOracle **Application Development Framework**（ADF）是一个简化\
  \ J2EE 开发的 J2EE 框架，而 Oracle JDeveloper 为其提供了一个声明式开发环境。ADF 的 **Business Components\
  \ for Java**（BC4J）层是一个基于 JDBC 的编程框架，用于在 Java 中开发以数据库为中心的业务服务。ADF 业务组件使用 JDBC 查询数据库。业务组件应用程序由实体对象、视图对象和应用程序模块组成，另外还包括关联和视图链接。ADF\
  \ 业务组件可与 JavaServer 页面、UIX 和 Swing 等不同的视图层一起使用。\n\nADF 业务组件中的实体对象执行所有数据库交互和验证，也是业务逻辑定义的位置。实体对象基于数据库表，并将表列映射到\
  \ Java 中的属性。实体对象封装业务逻辑、定义验证规则，并缓存数据。通常，视图对象由 SQL 查询组成，用于呈现由实体对象建模的业务数据（视图）的子集。视图对象可能基于实体对象，也可能不基于实体对象。\n\
  \n视图对象为客户端提供可由客户端修改的数据行集；视图对象基本上是行集迭代器，允许程序在数据集合上导航。一个实体对象可以从不同的视图对象访问。应用程序中可以使用多个视图对象的实例。ADF\
  \ 业务组件视图对象通过应用程序模块暴露给视图层，应用程序模块表示逻辑数据模型并管理数据事务。业务组件关联表示实体对象之间的关联，而视图链接表示不同视图对象中查询之间的链接。关联和视图链接不是业务组件应用程序的必需功能。\n\
  \nADF 的 BC4J 层用于为数据库表开发视图对象和实体对象。由视图对象组成的应用程序模块连接到数据库并检索数据以创建视图对象。应用程序模块可在 **Connections\
  \ Navigator** 中用于连接到数据库，或使用业务组件 Java API 与客户端/视图 Web 应用程序集成。客户端/视图 Web 应用程序可能是 Java/JSP\
  \ 应用程序，具有 `oracle.jbo` 包中的类和接口，可用于将应用程序模块连接到数据库并创建视图对象。在本章中，从 Oracle 数据库表创建业务组件。随后，创建一个\
  \ Web 应用程序以将业务组件应用程序模块连接到数据库并创建视图对象。\n\n## 设置环境\n\n业务组件在 JDeveloper 10g 中开发。安装 JDeveloper\
  \ 10g IDE。安装 Oracle 10g 数据库。创建数据库实例。在数据库中创建一个示例表，业务组件将从该表生成。创建示例表 Catalog 的 SQL\
  \ 脚本如下所示。\n\n```\nCREATE TABLE OE.Catalog(CatalogId VARCHAR(25) PRIMARY KEY, Journal\
  \ VARCHAR(25), Publisher Varchar(25),Edition VARCHAR(25), Section VARCHAR(25), Title\
  \ Varchar(75), Author Varchar(25));\nINSERT INTO OE.Catalog VALUES('catalog1', 'Oracle\
  \ Magazine', 'Oracle Publishing', 'Nov-Dec 2004','ORACLE DEVELOPER', 'From ADF UIX\
  \ to JSF', 'Jonas Jacobi');\nINSERT INTO OE.Catalog VALUES('catalog2', 'Oracle Magazine',\
  \ 'Oracle Publishing', 'Nov-Dec 2004', 'TECHNOLOGY', 'Database Resource Manager',\
  \ 'Kimberly Floss');\nINSERT INTO OE.Catalog VALUES('catalog3', 'Oracle Magazine','Oracle\
  \ Publishing','March-April 2005','ORACLE DEVELOPER','Starting with Oracle ADF',\
  \ 'Steve Muench');\n```\n\n接下来，使用 Oracle 10g 数据库创建 JDBC 连接。在 **Connections Navigator**\
  \ 中，右键单击 **Database** 节点并选择 **New Database Connection**。在 **Create Database Connection\
  \ Type** 窗口中，指定连接名称并选择 **Oracle JDBC** 作为 **Connection Type**。在 **Authentication**\
  \ 窗口中，指定 **Username** 和 **Password** 并单击 **Next**。在 **Connection** 窗口中，选择 **thin**\
  \ 或 **oci** 作为 Driver。在 **Host Name** 字段中，指定 Oracle 数据库主机名。主机在数据库的 `tnsnames.ora`\
  \ 文件中指定。指定 **JDBC Port** 和 **SID**，它们也在 `tnsnames.ora` 文件中指定。单击 **Next** 以显示 **Test**\
  \ 窗口。在 Test 窗口中单击 **Test Connection** 按钮以测试 JDBC 连接。如果与数据库的连接已建立，则会显示 Success 消息。单击\
  \ **Finish** 完成连接配置。\n\n在 **Connections Navigator** 中添加了一个连接节点。连接节点的 OE 模式显示了在数据库中创建的\
  \ **Catalog** 表。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_381_0.png)\n\n## 配置\
  \ BC4J 项目\n\n在本节中，创建业务组件工作区和项目，从 Oracle 数据库表创建业务组件，并在 JDeveloper 中测试业务组件项目。首先，创建一个应用程序工作区。在\
  \ JDeveloper 中选择 **File | New**。在 **New Gallery** 窗口中，在列出的项目中选择 **General** 和 **Application**。在\
  \ **Create Application** 窗口中指定 **Application Name**、应用程序的 **Directory Name**，并选择\
  \ **Application Template**。选择 **Web Application [JSP, Struts ADF BC]** 模板。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_381_1.png)\n\
  \n\n\n一个应用程序工作区 **BC4JApp** 被添加到 **Applications-Navigator** 中。该应用程序包含一个 **Model**\
  \ 节点和一个 **ViewController** 节点。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_382_0.png)\n\
  \n## 创建业务组件\n\n在本节中，业务组件将从上一节中创建的 Oracle 数据库表 Catalog 创建。从该表创建的默认业务组件将在 JDeveloper\
  \ 中进行修改。右键单击 **Model** 节点并选择 **New**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_382_1.png)\n\
  \n在 New Gallery 窗口中，在 Filter By 中选择 Project Technologies。在 Categories 中选择 Business\
  \ Tier | ADF Business Components，并在列出的 Items 中选择 Business Components from Tables。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_383_0.png)\n\n## 创建 Oracle ADF 业务组件\n\
  \n在 Initialize Business Components Project 窗口中，在 Connection 列表中选择数据库连接以从数据库表创建业务组件。\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_384_0.png)\n\n在 Login 窗口中，指定 User Name\
  \ 和 Password 并单击 OK。Create Business Components from Tables 向导开始。单击 Next。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_384_1.png)\n\
  \n显示 **Entity Objects** 窗口。指定要从数据库表创建的实体对象。首先，在 **Schema** 列表中选择包含用于创建业务组件的数据库表的模式。`catalog`\
  \ 表位于 `OE` 模式中，因此选择 `OE` 模式。单击 **Query** 按钮。`OE` 模式中的数据库表列在 **Available** 显示区中。在\
  \ **Available** 列表中选择 `OE.CATALOG` 表，并使用 **Copy (>)** 按钮或使用 *Alt+C* 将所选表传输到 **Selected**\
  \ 区。实体对象 `Catalog` 被指定。单击 **Next**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_385_0.png)\n\
  \n显示 **View Objects** 窗口。可用于生成默认可更新视图对象的实体对象列在 **Available** 区中。从 **Available**\
  \ 区选择实体对象，并使用 **Copy (>)** 按钮或使用 *Alt+C* 将其传输到 **Selected** 区。在 **Available** 列表中选择\
  \ `Catalog` 实体对象并将其复制到 **Selected** 列表。视图对象 **CatalogView** 被指定。**CatalogView**\
  \ 是所选实体对象的默认视图对象。\n\n默认视图对象包含实体对象中的所有属性，并且 SELECT 查询选择所有数据库列。单击 Next。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_386_0.png)\n\
  \n显示 Read-Only View Objects 窗口。可用于视图对象的表的数据库 Schema 列在 Schema 字段中。Object Types 复选框\
  \ Tables 默认被选中。可用表列在 Available 选择列表中。选择要为其生成只读视图对象的表并将其移至 Selected 列表。作为示例，选择 Catalog\
  \ 表用于只读视图对象并单击 Next。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_386_1.png)\n\n\
  显示 Application Module 窗口。指定应用程序模块名称并单击 Next。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_387_0.png)\n\
  \n在 Diagram 窗口中，如果需要创建图表，请选择 Business Components Diagram 复选框并单击 Next。在 Finish 窗口中，列出业务组件。对于\
  \ Oracle 数据库表 Catalog，业务组件为实体对象 Catalog、可更新视图对象 CatalogView、只读视图对象 CatalogView1\
  \ 和应用程序模块 AppModule。如果所选实体对象具有关联关系，则还会生成视图链接。单击 Finish 以生成业务组件。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_387_1.png)\n\
  \n为 `Catalog` 表生成的业务组件已添加到 **Applications-Navigator** 中。生成视图对象实例 **CatalogView1**\
  \ 和 **CatalogView1_1**。**CatalogView1** 是对应于可更新视图对象 **CatalogView** 的视图对象实例。**CatalogView1_1**\
  \ 是对应于只读视图对象 **CatalogView1** 的视图对象实例。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_388_0.png)\n\
  \n从数据库表 `Catalog` 创建的业务组件是默认业务组件。实体对象、视图对象和应用程序模块可在 JDeveloper 中进行修改。要修改实体对象 `Catalog`，右键单击\
  \ `Catalog` 实体对象节点并选择 **Edit Catalog**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_389_0.png)\n\
  \n在 **Entity Object Editor** 中，单击 **Attributes** 节点。实体对象的属性被列出。实体对象属性对应于 `Catalog`\
  \ 表中的数据库列。要删除属性，请在 **Entity Attributes** 列表中选择该属性并单击 **Remove** 按钮。要从未映射的表列添加属性，请单击\
  \ **New from Table** 按钮。要添加没有对应表列的属性，请单击 **New** 按钮。作为示例，添加一个没有对应表列的新属性。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_389_1.png)\n\
  \n在 New Entity Attribute 窗口中指定属性 Name、Type 和 Default value。对于持久字段，选择 Persistent\
  \ 复选框并单击 OK。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_390_0.png)\n\n新属性 ArticleAbstract\
  \ 已添加到实体对象 Catalog。要从实体对象中删除属性，首先从视图对象中删除该属性。单击 Apply 按钮以应用属性的添加/删除。单击 OK 按钮。\n\n\
  ![](img/553e44bc30e70d0d8e58278a7ece8da8_390_1.png)\n\n要将对 Catalog 实体对象所做的属性添加与\
  \ Oracle 数据库表同步，右键单击实体对象节点并选择 **Synchronize with Database**。**Synchronize with Database**\
  \ 窗口显示同步数据库与实体对象所需的修改。如果向实体对象添加新的 `persistent` 属性，则在创建 `persistent` 属性之前，表中也需要新的表列。如果未添加新的表列，则\
  \ `persistent` 实体对象将被修改为 `transient` 属性。选择 **Entity: Catalog** 并单击 **Synchronize**\
  \ 按钮以将实体对象与数据库同步。窗口显示消息 **The following Synchronization Actions were performed successfully**。由于未为\
  \ `ArticleAbstract` 列创建数据库表列，因此 `ArticleAbstract` 属性被设置为 `transient` 属性。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_391_0.png)\n\
  \n要修改可更新视图对象 CatalogView，右键单击视图对象节点并选择 **Edit CatalogView**。**View Object Editor**\
  \ 显示视图对象的属性和 SQL 查询。选择 **Attributes** 节点以编辑视图对象属性。选择 **SQL Statement** 节点以编辑视图对象的\
  \ SELECT 查询。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_392_0.png)\n\n接下来，我们将测试业务组件应用程序。要测试业务组件应用程序，右键单击应用程序模块节点并选择\
  \ **Test**。显示 **Connect** 窗口。在 **Connect** 窗口中，选择用于连接数据库的 JDBC 连接。选择 **Connection\
  \ Type**（JDBC URL 或 Datasource）和 **Connection Name** 并单击 **Connect** 按钮。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_392_1.png)\n\
  \n业务组件应用程序已连接到数据库并显示 **Local** 窗口。**Local** 窗口包含一个应用程序模块节点和视图对象实例结果节点。**CatalogView1**\
  \ 是可更新视图对象 **CatalogView** 的视图对象实例，而 **CatalogView1_1** 是只读视图对象 **CatalogView1**\
  \ 的视图对象实例。双击可更新视图对象实例 **CatalogView1** 节点以显示视图对象查询的结果。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_393_0.png)\n\
  \n\n\nThe **转到下一条/上一条记录**, **转到下一页/上一页**, and **转到最后一条/第一条记录** links may be used\
  \ to navigate through the view object query results. To add a new record, select\
  \ the **插入新记录** link.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_394_0.png)\n\n\
  As an example, delete a record with the **删除当前记录** link. To commit the changes to\
  \ a transaction, select **数据库 | 提交**.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_395_0.png)\n\
  \nTo view the data represented by a view object as XML select **视图 | 数据为 XML**.\
  \ A window for the view object XML data is displayed\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_396_0.png)\n\
  \nThe SQL query used to create a view object may be modified in the **视图对象编辑器**.\
  \ Right-click on the view object node and select **编辑 CatalogView**. In the **视图对象编辑器**\
  \ window select the **SQL 语句** node. By default the `SELECT` list and the `FROM`\
  \ clause of the SQL query are automatically defined. To override the default setting\
  \ of the `SELECT` list and the `FROM` clause, check the **专家模式** checkbox. As an\
  \ example, specify a `WHERE` clause for the SQL query. Click on the **应用** button\
  \ to apply the changes to the SQL query.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_397_0.png)\n\
  \nA window pops up to test the SQL query syntax. If the query syntax is correct,\
  \ a **查询有效消息** is displayed. Click on **确定** in the **视图对象编辑器** window. Right-click\
  \ on the application module node and select **测试** to test the modified business\
  \ components application. Click on Connect in the Connect window. In the **Oracle\
  \ 业务组件浏览器**, the results of the filtered query are displayed. With the WHERE clause\
  \ set to `section='ORACLE DEVELOPER'`, only the results with the section column\
  \ value `'ORACLE DEVELOPER'` are displayed.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_397_1.png)\n\
  \nA new attribute may also be added/removed to the view object in the **视图对象编辑器**.\
  \ For example, select the transient attribute `ArticleAbstract` and add it to the\
  \ `CatalogView` view object. Click on the **应用** button to apply the attribute additions\
  \ or removals. Click on **确定**.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_398_0.png)\n\
  \nRight-click on the application module node and select **测试** to test the modified\
  \ business components application. A new field **ArticleAbstract** is added to the\
  \ results of the view object query. If the added attribute is a `transient` attribute,\
  \ it does not get persisted to the database with the **数据库 | 提交** selection; only\
  \ a `persistent` attribute is added to the database. A `transient` attribute does\
  \ get displayed in the **视图对象 XML 数据** window with **视图 | 数据为 XML** selection if\
  \ a value is specified for the attribute.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_399_0.png)\n\
  \nThe updatable view object, CatalogView1, is updatable as explained in the previous\
  \ section. Next, select the read-only view object instance node CatalogView1_1.\
  \ The read-only view object instance only displays the results; the results from\
  \ the view object query are not modifiable.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_399_1.png)\n\
  \nIn this section, a business components application module was created and tested\
  \ with the Oracle database. In the next section, we will create a web application\
  \ for the business components.\n\n## 开发 BC4J Web 应用程序\n\nIn this section a web application\
  \ is created in the ViewController project of the Model-View-Controller application.\
  \ A web application JSP will invoke the business components in the Model project.\
  \ Add the Model project business components to the classpath of the ViewController\
  \ project. Select the ViewController project in the Applications Navigator. Select\
  \ Tools | Project Properties in the JDeveloper IDE. In the Project Properties window,\
  \ select the Common | Dependencies node. In the Project Dependencies window, click\
  \ in the Model.jpr checkbox. Click on the OK button. The Model project gets added\
  \ to the classpath of the View project.\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_400_0.png)\n\
  \nThe JSP application will be integrated with the BC4J components in the Model project.\
  \ To create a JSP right-click on the ViewController project and select New. In the\
  \ New Gallery window, select Web Tier | Java Server Pages. Select JSP Page in the\
  \ Items listed. In the Create JSP page, specify TestClient as the File Name and\
  \ a Directory Name for the JSP page. The JSP page TestClient.jsp is added to the\
  \ ViewController project of the BC4J application workspace. JDeveloper provides\
  \ integrated support for the Oracle JDBC driver. For ADF/BC4J applications with\
  \ a database other than Oracle database copy JDBC JAR file to BC4J/lib directory.\n\
  \n![](img/553e44bc30e70d0d8e58278a7ece8da8_401_0.png)\n\nIn the TestClient.jsp,\
  \ import the oracle.jbo package and the oracle.jbo.client.Configuration class:\n\
  \n```\n<%@page import=\"oracle.jbo.*, oracle.jbo.client.Configuration\"%>\n```\n\
  \nCreate an application module name variable:\n\n```\nString appModule = \"model.AppModule\"\
  ;\n```\n\nThe application module name is specified in the AppModuleJndiName, element\
  \ in the <BC4JApp>\\Model\\src\\model\\common\\bc4j.xcfg configuration file. <BC4JApp>\
  \ is the application workspace directory:\n\n```\n<AppModuleJndiName>model.AppModule</AppModuleJndiName>\n\
  ```\n\nCreate an application module config name variable:\n\n```\nString cfg=\"\
  AppModuleLocal\";\n```\n\nThe application module config name is specified in the\
  \ name attribute of the AppModuleConfig element in the bc4j.xcfg file:\n\n```\n\
  <AppModuleConfig name=\"AppModuleLocal\"> </AppModuleConfig>\n```\n\nCreate a view\
  \ object instance variable:\n\n```\nString viewObject = \"CatalogView1\";\n```\n\
  \nThe view object instance is listed in the View Object Instances node in the application\
  \ module Structure window in the JDeveloper. Create an ApplicationModule object\
  \ from the BC4J application module using the createRootApplicationModule() static\
  \ method of the Configuration class:\n\n```\nApplicationModule applicationModule\
  \ = (ApplicationModule)\n    Configuration.createRootApplicationModule(appModule,\
  \ cfg);\n```\n\nObtain a Transaction object from the ApplicationModule object using\
  \ the getTransaction() method. If the application module is not connected to the\
  \ database connect to the database with the connect method.\n\n```\nTransaction\
  \ transaction=applicationModule.getTransaction();\n    if(transaction.isConnected()==false)\n\
  \    transaction.connect(\"jdbc:oracle:thin:@<HOST>:<PORT>:<SID>\", \"OE\",\n  \
  \      \"<password>\");\n```\n\n- <HOST> is the database host name.\n- <PORT> is\
  \ the database port.\n- <SID> is the database instance.\n- <password> is the password\
  \ for the OE schema.\n\nObtain the view object instance from the application module\
  \ using the findViewObject() method:\n\n```\nViewObject vo = applicationModule.findViewObject(viewObject);\n\
  ```\n\nIterate over the view object to output the attributes of the view object\
  \ rows to the browser. A row in a view object is represented with the oracle.jbo.Row\
  \ interface. Obtain the first row with the first() method of the ViewObject interface.\n\
  \n```\nRow row = vo.first();\n```\n\nA row attribute is obtained using the getAttribute()\
  \ method of the Row interface:\n\n```\n<% out.println(row.getAttribute(i++).toString());%>\n\
  ```\n\nObtain the next row in the view object using the next() method:\n\n```\n\
  row = vo.next();\n```\n\nRelease and remove the application module using the releaseRootApplicationModule()\
  \ method of the Configuration class:\n\n```\nConfiguration.releaseRootApplicationModule(applicationModule,\
  \ true);\n```\n\nTestClient.jsp JSP is listed below.\n\n```\n<%@ page\ncontentType=\"\
  text/html;charset=windows-1252\"%>\n<%@ page import=\"oracle.jbo.*,\noracle.jbo.client.Configuration\"\
  \ %>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\"\ncontent=\"text/html; charset=windows-1252\"\
  >\n<title>BC4J Web Application</title>\n</head>\n<body>\n<%\nString appModule =\
  \ \"model.AppModule\"; //App Module name\nString cfg=\"AppModuleLocal\";//Config\
  \ Name\nString viewObject = \"CatalogView1\"; //name of view object\nApplicationModule\
  \ applicationModule =(ApplicationModule)\nConfiguration.createRootApplicationModule(appModule,\
  \ cfg);\n//Establish connection with database\nTransaction\ntransaction=applicationModule.getTransaction();\n\
  if(transaction.isConnected()==false)\ntransaction.connect(\"jdbc:oracle:thin:@localhost:1521:ORCL\"\
  , \"OE\",\n\"pw\");\n// Find the viewobject included in the appmodule\nViewObject\
  \ vo = applicationModule.findViewObject(viewObject);\n%>\n<table border=\"1\" cellspacing=\"\
  0\">\n<tr>\n<th>CatalogId</th>\n<th>Journal</th>\n<th>Publisher</th>\n<th>Edition</th>\n\
  <th>Section</th>\n<th>Title</th>\n<th>Author</th>\n</tr>\n<% Row row = vo.first();\n\
  while (row != null)\n{ int i=0;\n```\n\n```\n%> <tr>\n<td><%= out.println(row.getAttribute(i++).toString());\
  \ %></td>\n<td><%=out.println(row.getAttribute(i++).toString()); %></td>\n<td><%=out.println(row.getAttribute(i++).toString());\
  \ %></td>\n<td><%=out.println(row.getAttribute(i++).toString()); %></td>\n<td><%=out.println(row.getAttribute(i++).toString());\
  \ %></td>\n<td><%= out.println(row.getAttribute(i++).toString()); %></td>\n<td><%=out.println(row.getAttribute(i).toString());\
  \ %></td>\n</tr>\n<%\n    row = vo.next();\n} %>\n</table>\n<%\n    Configuration.releaseRootApplicationModule(applicationModule,\n\
  \        true);\n%>\n</body>\n</html>\n```\n\n在 JSP TestClient.jsp 中，应用程序模块使用 JDBC\
  \ URL 连接数据库。应用程序模块也可以通过数据源连接到数据库。对于 Connections-Navigator 中的 JDBC 连接 DBConnection1，可使用\
  \ JNDI 名称为 jdbc/DBConnection1DS 的数据源。应用程序模块通过 Transaction 接口的 connectToDataSource\
  \ 方法使用数据源连接到数据库：\n\n```\ntransaction.connectToDataSource(null,\"jdbc/DBConnection1DS\"\
  ,\"OE\",\n    \"<password>\", false);\n```\n\n要运行 TestClient.jsp，请在 Applications\
  \ Navigator 中右键单击 JSP 节点并选择 Run。JSP 的输出将在默认浏览器中显示。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_404_0.png)\n\
  \n## JDBC 4.0 版本\n\nADF Business Components 使用 JDBC 访问数据库。嵌入 JDeveloper 10g 或 JDeveloper\
  \ 中的 OC4J 服务器不支持 JDBC 4.0。JDBC 4.0 的新功能可在支持 JDBC 4.0 的 JDeveloper 版本中使用。要在 ADF Business\
  \ Components 中使用 JDBC 4.0，请使用 Oracle 数据库 11g JDBC 4.0 驱动程序 JAR 文件 ojdbc6.jar 配置数据库连接。我们还需要将\
  \ JDK 版本设置为 JDK 6.0。要设置 JDK 版本，请选择 Tools | Project Properties。在 Project Properties\
  \ 窗口中，选择 Libraries。在 J2SE Version 字段中，单击 Change 以选择 JDK 6.0 Java 可执行文件。\n\n我们能够使用由\
  \ OC4J 服务器实现的那部分 JDBC 4.0 功能。连接状态跟踪由连接池管理器实现，用于跟踪不可用的连接。在引入连接状态跟踪新功能之前，连接池管理器通常会在连接池中的某些连接变得不可用时关闭所有连接并重新初始化连接池。使用\
  \ JDBC 4.0 中 Connection 接口的 isValid() 方法，连接池管理器能够判断连接是否仍然有效。如果连接无效，连接池管理器将关闭该连接。\n\
  \n```\nif (!connection.isValid())\nconnection.close();\n```\n\n## 摘要\n\nADF Business\
  \ Components 是一个基于 JDBC 的框架。正如本章所述，JDeveloper 中的 ADF Business Components 可以配置为使用\
  \ Oracle 数据库，或通过为数据库配置 JDBC 驱动程序库来使用第三方数据库。可以使用 oracle.jbo 包中的类和接口，使用 ADF business\
  \ components 创建 Web 应用程序。在支持 JDBC 4.0 的 JDeveloper 版本中，我们还可以添加 JDBC 4.0 功能。\n"
- "## 15 Hibernate\n\nHibernate 是一个开源的、基于 JDBC 的对象/关系持久化和查询服务。Hibernate 用于将 Java 对象中的数据表示映射到数据库。Hibernate\
  \ 支持多个数据库，包括 DB2、MySQL、Oracle 和 PostgreSQL。使用 Hibernate，Java 数据类型映射到 SQL 数据类型。Hibernate\
  \ 生成创建、更新和删除数据库表所需的 SQL。Hibernate 用于从 Java Bean 类生成表，并向表中添加、检索、更新和删除数据。\n\n由于复杂度更低、灵活性更高、开源架构以及支持不同数据库而无需在数据访问层提供特定于厂商的\
  \ SQL 代码，Hibernate 比其他数据库持久化技术（如 Castor、TopLink 和 Entity EJB）更受青睐。Hibernate 还提供了\
  \ Ant 构建任务的类，可集成到 Ant 构建文件中。在本章中，我们将把 Hibernate 与 JDeveloper 10.1.3 IDE 和 Oracle\
  \ 数据库 10g 集成，以开发对象/关系应用程序。\n\nHibernate 提供的数据库持久化基于映射文件和数据库属性文件。.hbm.xml 映射文件包含数据库持久化的类定义，指定要映射到数据库表的\
  \ JavaBean 属性、数据库模式名称、数据库表名称以及与 JavaBean 属性对应的表列。表可以从映射文件生成，或在开发 Hibernate 应用程序之前生成。\n\
  \n映射文件指定用于数据库持久化的 Java 类、Java 对象中的不同字段和字段类型，以及对应的数据库表列和列类型。数据库应用程序的 Java 类可以从映射文件生成，或在开发\
  \ Hibernate 应用程序之前生成。数据库属性文件（hibernate.properties 文件）指定数据库、JDBC 驱动程序和数据库应用程序的连接\
  \ URL。Ant 任务类 net.sf.hibernate.tool.hbm2java.HbmJavaTask 和 org.hibernate.tool.hbm2ddl.SchemaExportTask\
  \ 分别用于将映射文件映射到 Java 类和数据库表。随后使用这些 Java 类在数据库表中添加/检索/更新/删除数据。在本章中，一个示例映射文件 (`catalog.hbm.xml`)，包含期刊目录的属性，被映射到数据库表\
  \ `OE.Catalog` 和 Java 类 `Catalog.java`。\n\n## Hibernate 与 JDBC\n\nHibernate 是一个基于\
  \ JDBC 的数据库持久化框架。Hibernate 应用程序的 Java 到 SQL 映射在 `org.hibernate.cfg.Configuration`\
  \ 对象中定义。映射是从 XML 映射文件编译而来的。XML 映射文件按如下方式添加到 `Configuration` 对象：\n\n```java\nConfiguration\
  \ cfg = new\n    Configuration().addResource(\"Catalog.hbm.xml\");\n```\n\nHibernate\
  \ 配置属性（包括 JDBC 属性）可通过以下方法之一设置：\n\n- 1. 使用 `Configuration` 对象的 `setProperties()`\
  \ 方法设置配置属性。\n- 2. 在 `hibernate.properties` 文件中指定配置属性。\n- 3. 将属性指定为 System 属性。\n\
  - 4. 在 `hibernate.cfg.xml` 文件中指定属性。\n\n使用 `SessionFactory` 创建和池化连接。`SessionFactory`\
  \ 按如下方式从 `Configuration` 对象创建：\n\n```java\nSessionFactory sessionFactory = cfg.buildSessionFactory();\n\
  ```\n\n创建 `Session` 对象时，从连接池获取 JDBC 连接。\n\n```java\nSession session = sessionFactory.openSession();\n\
  ```\n\nHibernate 使用 `java.sql.DriverManager` 或数据源创建和池化连接。如果使用 `DriverManager` 创建和池化连接，则需要指定下表中讨论的\
  \ JDBC 连接属性。\n\n| 属性 | 描述 |\n|---|---|\n| `hibernate.connection.driver_class` |\
  \ JDBC 驱动程序类 |\n| `hibernate.connection.url` | JDBC 连接 URL |\n| `hibernate.connection.username`\
  \ | 数据库用户名 |\n| `hibernate.connection.password` | 数据库用户密码 |\n| `hibernate.connection.pool_size`\
  \ | 可选属性。池化连接的最大数量。 |\n| `hibernate.dialect` | 数据库的方言。对于 Oracle 数据库指定 org.hibernate.dialect.OracleDialect\
  \ |\n\n要在应用程序服务器中开发 Hibernate 应用程序，请从具有 JNDI 名称绑定的数据源获取连接。下表中讨论的数据源属性将 Hibernate\
  \ 应用程序配置为使用数据源。\n\n| 属性 | 描述 |\n|---|---|\n| hibernate.connection.datasource | 数据源\
  \ JNDI 名称 |\n| hibernate.jndi.url | JNDI 提供程序 URL（可选） |\n| hibernate.jndi.class\
  \ | JNDI InitialContextFactory 类（可选） |\n| hibernate.connection.username | 数据库用户名\
  \ |\n| hibernate.connection.password | 数据库密码 |\n\n从数据源获取的 JDBC 连接会自动参与应用程序服务器的容器管理事务。可以使用\
  \ hibernate.connection 前缀设置任意连接属性。例如，连接属性 hibernate.connection.charSet 设置字符集。可在以下表中讨论的其他一些\
  \ Hibernate、JDBC 和连接配置属性：\n\n| 属性 | 描述 |\n|---|---|\n| hibernate.jdbc.fetch_size\
  \ | 指定 JDBC 获取大小 |\n| hibernate.jdbc.batch_size | 启用批量更新 |\n| hibernate.default_schema\
  \ | 指定未限定表名的模式名称。 |\n| hibernate.jdbc.use_scrollable_resultset | 启用可滚动结果集 |\n| hibernate.connection.isolation\
  \ | 指定 JDBC 事务隔离级别。 |\n| hibernate.connection.autocommit | 为 JDBC 池化连接启用自动提交。 |\n\
  \n\n\n\n| 属性 | 描述 |\n|---|---|\n| hibernate.connection.release_mode | 指定 Hibernate\
  \ 何时应将 JDBC 连接释放回连接池。默认情况下，JDBC 连接在 Session 对象关闭时释放。可以指定以下值：auto（默认） on_close -\
  \ 当连接关闭时。 after_transaction - 在事务结束时。 after_statement - 在语句结束时。 |\n| hibernate.jdbc.use_scrollable_resultset\
  \ | 启用可滚动结果集 |\n| hibernate.connection.<propertyName> | 指定由 DriverManager.getConnection()\
  \ 使用的 JDBC 属性 |\n| hibernate.jndi.<propertyName> | 指定 JNDI InitialContextFactory\
  \ 的 JDBC 属性 |\n\n如果 JDeveloper OC4J 服务器支持 JDBC 4.0，则可以使用 JDBC 4.0 功能，例如连接状态跟踪。连接状态跟踪由连接池管理器实现，以识别并关闭不可用的连接。\n\
  \n在本章中，您将学习以下内容：\n\n- 使用 Hibernate 创建数据库表\n- 使用 Hibernate 向数据库表添加数据\n- 使用 Hibernate\
  \ 从数据库表检索数据\n- 使用 Hibernate 更新数据库表中的数据\n- 使用 Hibernate 从数据库表删除数据\n\n## 设置环境\n\n\
  需要 Hibernate API 类将 Hibernate 与 JDeveloper 集成。从 http://www.hibernate.org/ 下载 Hibernate\
  \ 3.2 和 Hibernate Extension 2.1.3 ZIP 文件，并将文件解压到安装目录 C:/Hibernate。为 Hibernate 3.2\
  \ 创建 hibernate-3.2 目录，为扩展类创建 tools 目录。还需下载 Hibernate 2.1.6，因为 net.sf.hibernate.tool.hbm2java.Hbm2JavaTask\
  \ 工具需要它。\n\n将 Hibernate 2.1.6 ZIP 文件解压到 c:/Hibernate 目录；创建 hibernate 2.1.6 目录。安装\
  \ JDeveloper 10g IDE。安装 Oracle 数据库 10g 并创建包含示例模式的数据库实例。\n\n接下来，将开发 Hibernate 应用程序所需的\
  \ Hibernate JAR 文件集成到 JDeveloper 10g 项目中。首先，在 JDeveloper IDE 中选择 File | New。在 New\
  \ Gallery 窗口中，在列出的 Categories 中选择 General | Applications，并在列出的 Items 中选择 Application。在\
  \ Create Application 窗口中指定应用程序名称和目录名称，应用程序模板为 No Template。在 Create Project 窗口中指定项目名称并单击\
  \ OK。Hibernate 应用程序和项目已添加到 Applications-Navigator。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_411_0.png)\n\
  \n接下来，将生成 Hibernate 应用程序所需的库添加到项目中。在 Applications-Navigator 中选择 Hibernate 项目节点。选择\
  \ Tools | Project Properties。在 Project Properties 窗口中选择 Libraries 节点。选择 Add Library\
  \ 按钮以创建新库。在 Add Library 窗口中选择 New 按钮。在 Create Library 窗口中，在 Library Name 字段中指定 Hibernate\
  \ 并单击 Add Entry 按钮。在 Select Path Entry 窗口中选择 hibernate3.jar 文件并单击 Select 按钮。所选 JAR\
  \ 文件已添加到 Create Library 窗口中的 Class Path 节点。单击 Create Library 窗口中的 OK 按钮。单击 Add Library\
  \ 窗口中的 OK 按钮。Hibernate 库已创建并添加到 Selected Libraries。同样为 Hibernate 应用程序所需的其他 JAR 文件创建库。\n\
  \n创建的库和相应的 JAR 文件列在下表中：\n\n| 项目库 | 描述 | JAR/Zip 文件 |\n|---|---|---|\n| Hibernate\
  \ | Hibernate API 类，包括 org.hibernate.tool.hbm2ddl.SchemaExportTask 类。 | <Hibernate>/hibernate-3.2/hibernate3.jar\
  \ |\n| Hibernate-Extensions | Hibernate 扩展类，包括 net.sf.hibernate.tool.hbm2java.Hbm2JavaTask\
  \ 类。 | <Hibernate>/tools/hibernate-tools.jar |\n| Hibernate-Lib | 辅助 Hibernate 类。\
  \ | <Hibernate>/hibernate3.2/lib/dom4j-1.6.1.jar,<Hibernate>/hibernate-3.2/lib/commons-logging-1.0.4.jar,<Hibernate>/hibernate-3.2/lib/commons-collections-2.1.1.jar,<Hibernate>/hibernate-3.2/lib/ehcache-1.2.3.jar,<Hibernate>/hibernate-3.2/lib/cglib-2.1.3.jar,<Hibernate>/hibernate-3.2/lib/jta.jar,<Hibernate>/hibernate-3.2/lib/asm.jar,<Hibernate>/hibernate-3.2/lib/antlr-2.7.6.jar\
  \ |\n| Oracle JDBC | Oracle JDBC 库。删除 <JDeveloper 10.1.3>\\jdbc\\lib 中的 orai18n.jar。\
  \ |  |\n\n> 在上表中 <Hibernate> 是 Hibernate 安装的目录。 <JDeveloper 10.1.3> 是 JDeveloper\
  \ 10.1.3 安装的目录。\n\n创建的库在 Libraries 窗口中列出，如下表所示：\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_413_0.png)\n\
  \n## 开发 Hibernate 映射和属性文件\n\nHibernate 映射文件（.hbm.xml 文件）和 Hibernate 属性文件（hibernate.properties\
  \ 文件）构成了 Hibernate 应用程序的基础。映射文件由类定义组成。每个类定义由一组要映射到 Java 类和数据库表的属性组成。字段/列类型以及列的附加特征，如长度、非空和唯一，也与属性一起指定。映射文件中经常使用的一些标签列在下表中：\n\
  \n| 标签名称 | 描述 | 属性 | 子元素 |\n|---|---|---|---|\n| hibernate-mapping | 根元素 | schema,\
  \ package | class |\n| class | 指定用于将 Hibernate Java 类映射到数据库表的类定义。 | table,schema\
  \ | id,property,set,list |\n| id | 类定义中的必需元素。 | column,type,length | column,generator\
  \ |\n| property | 指定类属性，该属性对应于表列和 Java 类字段。 | type,column,length,not-null,unique\
  \ | column |\n\n本章中的示例映射文件由期刊目录的类和类属性组成。元素 <generator class=\"native\" /> 在 <id>\
  \ 元素中是必需的，以从映射文件生成 Java 类。元素 <generator class=\"native\" /> 指定标识符生成策略。示例映射文件 catalog.hbm.xml\
  \ 如下所示。\n\n```\n<?xml version=\"1.0\"?><!DOCTYPE hibernate-mapping PUBLIC \"-//Hibernate/Hibernate\
  \ Mapping DTD 3.0//EN\" \"http://hibernate.sourceforge.net/hibernate-mapping-3.0.dtd\"\
  >\n<hibernate-mapping>\n<class name=\"hibernate.Catalog\" table=\"OE.CATALOG\">\n\
  <id name=\"id\" type=\"string\" column=\"ID\">\n<generator class=\"native\"/>  </id>\n\
  <property name=\"journal\" column=\"JOURNAL\" type=\"string\"/>\n<property name=\"\
  publisher\" column=\"PUBLISHER\" type=\"string\"/>\n<property name=\"edition\" column=\"\
  EDITION\" type=\"string\"/>\n<property name=\"title\" column=\"TITLE\" type=\"string\"\
  />\n<property name=\"author\" column=\"AUTHOR\" type=\"string\"/>\n</class>\n</hibernate-mapping>\n\
  ```\n\n在 C:/Hibernate 目录中创建 mappings 目录并将 catalog.hbm.xml 文件复制到其中。Hibernate 属性文件\
  \ hibernate.properties 指定用于持久化和从数据库查询的数据库配置。属性文件是文本文件，属性以 <property>=<value> 的形式指定。本章第一表中列出了\
  \ hibernate.properties 文件所需的 JDBC 连接属性。\n\n在本章示例应用程序的 hibernate.properties 文件中，Oracle\
  \ 数据库示例模式 OE 指定为 username 属性。Oracle Thin Type 4 驱动程序用于驱动程序类为 oracle.jdbc.OracleDriver。Oracle\
  \ 数据库的 hibernate.properties 文件如下所示。\n\n```\nhibernate.connection.driver_class=oracle.jdbc.OracleDriver\n\
  hibernate.connection.url=jdbc:oracle:thin:@localhost:1521:ORCL\nhibernate.connection.username=OE\n\
  hibernate.connection.password=\nhibernate.dialect=org.hibernate.dialect.OracleDialect\n\
  ```\n\n在 C:/Hibernate 目录中创建 properties 目录并将 hibernate.properties 文件复制到 properties\
  \ 目录。\n\n## 创建数据库表\n\n在本节中，从示例 Hibernate 映射文件 catalog.hbm.xml 生成 Java 类，并从映射文件和属性文件\
  \ hibernate.properties 生成 Oracle 数据库表。映射类和数据库表使用 Ant 构建文件生成。Hibernate API 提供了 net.sf.hibernate.tool.hbm2java.Hbm2JavaTask\
  \ 任务类，用于从 hbm.xml 映射文件生成 Java 类，以及 org.hibernate.tool.hbm2ddl.SchemaExportTask 任务类，用于从映射文件生成数据库表。首先，在\
  \ Jdeveloper 10g IDE 中创建 Ant 构建文件。选择 File | New。在 New Gallery 窗口中选择 General | Ant。在列出的\
  \ Items 中选择 Empty Buildfile。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_415_0.png)\n\
  \n\n\n在 **创建 Ant 构建文件** 中指定一个 **文件名**、`build.xml`，以及构建文件的 **目录名称**。一个 `build.xml`\
  \ 文件被添加到 Applications-Navigator 中的 Hibernate 项目中。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_416_0.png)\n\
  \n示例 `build.xml` 包含以下目标：\n\n- 1. 从映射文件生成 Java 类。\n- 2. 编译 Java 类。\n- 3. 从映射文件和 `hibernate.properties`\
  \ 文件生成数据库表。\n\n我们将详细讨论 `build.xml` 文件的结构。添加 `<project/>` 标签，该标签指定项目名称、默认目标和 `basedir`\
  \ 属性。添加构建文件属性，这些属性对应于 Hibernate 目录。目录相对于基本目录指定，而基本目录在 `project` 元素的 `basedir` 属性中指定。示例\
  \ `build.xml` 中的属性在下表中列出。\n\n| 属性 | 值 | 描述 |\n|---|---|---|\n| src.dir | src | 从映射文件生成\
  \ Java 类的目录。 |\n| classes.dir | classes |  |\n| hibernate-3.2 | hibernate-3.2 |\
  \  |\n| hibernate-2.1 | hibernate-2.1 |  |\n| hibernate.mappings | mappings |  |\n\
  | jdbc | C:\\oracle\\product\\10.2.0\\db_1\\jdbc\\lib | 包含 classes12.jar 文件和 ojdbc14.jar\
  \ 的目录。 |\n| hibernate.extensions | tools | 包含 hibernate-tools.jar 文件的目录。 |\n| hibernate.properties\
  \ | properties | 包含 hibernate.properties 文件的目录。 |\n\n在 build.xml 文件中，添加一个 <path/>\
  \ 元素以指定 build.xml 文件目标的类路径。类路径包括 hibernate3.jar、hibernate-tools.jar、ojdbc14.jar\
  \ 以及辅助的 Hibernate 和 Hibernate 扩展 JAR 文件。init 目标为 build.xml 文件生成目录。javaGenerator\
  \ 目标使用 net.sf.hibernate.tool.hbm2java.Hbm2JavaTask 类从 Hibernate 映射文件生成 Java 类。compile\
  \ 目标编译从映射文件生成的 Java 类。schemaGenerator 目标使用 org.hibernate.tool.hbm2ddl.SchemaExportTask\
  \ 类从映射文件和属性文件生成数据库表。示例 build.xml 文件如下所示。\n\n```\n<?xml version=\"1.0\"?>\n<project\
  \ name=\"Hibernate\"\ndefault=\"schemaGenerator\" basedir=\"C:\\Hibernate\">\n \
  \   <property name=\"src.dir\" value=\"src\"/>\n    <property name=\"classes.dir\"\
  \ value=\"classes\"/>\n    <property name=\"hibernate-3.2\" value=\"hibernate-3.2\"\
  />\n    <property name=\"hibernate-2.1\" value=\"hibernate-2.1\"/>\n    <property\
  \ name=\"hibernate.mappings\" value=\"mappings\"/>\n    <property name=\"jdbc\"\n\
  \        value=\"C:\\oracle\\product\\10.2.0\\db_1\\jdbc\\lib\"/>\n    <property\
  \ name=\"hibernate.extensions\" value=\"tools\"/>\n    <property name=\"hibernate.properties\"\
  \ value=\"properties\"/>\n    <path id=\"project.class.path\">\n    <pathelement\
  \ location=\"${classes.dir}\" />\n<fileset dir=\"${hibernate-3.2}\">\n    <include\
  \ name=\"hibernate3.jar\"/>\n</fileset>\n    <fileset dir=\"${hibernate-2.1}\">\n\
  \        <include name=\"hibernate2.jar\"/>\n    </fileset>\n    <fileset dir=\"\
  ${hibernate-3.2}/lib\">\n        <include name=\"*.jar\"/>\n    </fileset>\n   \
  \ <fileset dir=\"${hibernate-2.1}/lib\">\n        <include name=\"commons-lang-1.0.1.jar\"\
  />\n    </fileset>\n    <fileset dir=\"${hibernate.extensions}/lib\">\n        <include\
  \ name=\"*.jar\"/>\n    </fileset>\n    <fileset dir=\"${hibernate.extensions}\"\
  >\n        <include name=\"hibernate-tools.jar\"/>\n    </fileset>\n    <fileset\
  \ dir=\"${jdbc}\">\n        <include name=\"ojdbc14.jar\"/>\n    </fileset>\n</path>\n\
  \    <target name=\"init\">\n<mkdir dir=\"${src.dir}\"/>\n    <mkdir dir=\"${classes.dir}\"\
  />\n    </target>\n    <taskdef name=\"javaGen\"\n        classname=\"net.sf.hibernate.tool.hbm2java.Hbm2JavaTask\"\
  \n        classpathref=\"project.class.path\"/>\n    <target name=\"javaGenerator\"\
  \ depends=\"init\">\n    <javaGen output=\"${src.dir}\">\n        <fileset dir=\"\
  ${hibernate.mappings}\">\n            <include name=\"catalog.hbm.xml\"/>\n    \
  \    </fileset>\n    </javaGen>\n    </target>\n    <target name=\"compile\" depends=\"\
  javaGenerator\">\n        <javac srcdir=\"${src.dir}\"\n            destdir=\"${classes.dir}\"\
  >\n            <classpath refid=\"project.class.path\"/></javac>\n    </target>\n\
  \    <taskdef name=\"schemaGen\"\nclassname=\"org.hibernate.tool.hbm2ddl.SchemaExportTask\"\
  \nclasspathref=\"project.class.path\"/>\n    <target name=\"schemaGenerator\" depends=\"\
  compile\">\n<schemaGen properties=\"${hibernate.properties}/hibernate.properties\"\
  \noutput=\"schema.ddl\" create=\"true\" quiet=\"no\">\n    <fileset\n dir=\"${hibernate.mappings}\"\
  >\n        <include name=\"catalog.hbm.xml\"/>\n</fileset>\n</schemaGen>\n</target>\n\
  </project>\n```\n\n将 build.xml 列表复制到 JDeveloper Hibernate 项目中的 build.xml 文件。构建 build.xml\
  \ 文件中的目标。右键单击 build.xml 文件节点并选择 Run Ant。在 Run Ant 窗口中，选择 schemaGenerator 目标。由于目标在\
  \ depends 属性中指定，因此 schemaGenerator 目标之前的前置目标也会被构建。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_419_0.png)\n\
  \n对应于映射文件的 Java 类被生成。Java 类为映射文件中指定的每个类属性具有 getter 和 setter 方法。Catalog.java，即使用\
  \ Hibernate 映射文件生成的 Java 类，如下所示：\n\n```\npackage hibernate;\nimport java.io.Serializable;\n\
  import org.apache.commons.lang.builder.ToStringBuilder;\n/** @author Hibernate CodeGenerator\
  \ */\npublic class Catalog implements Serializable {\n    /** identifier field */\n\
  \    private Integer id;\n    /** nullable persistent field */\nprivate String journal;\n\
  /** nullable persistent field */\nprivate String publisher;\n/** nullable persistent\
  \ field */\nprivate String edition;\n/** nullable persistent field */\nprivate String\
  \ title;\n/** nullable persistent field */\nprivate String author;\n/** full constructor\
