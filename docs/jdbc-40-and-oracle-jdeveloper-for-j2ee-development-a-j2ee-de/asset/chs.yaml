  ```\n\n| JOURNAL | PUBLISHER | EDITION | TITLE | AUTHOR |\n|---|---|---|---|---|\n\
  | Oracle Magazine | Oracle Publishing | July-August 2005 | Configuring Undo Tablespace\
  \ | Floss, Kimberly |\n| Oracle Magazine | Oracle Publishing | March-April 2004\
  \ | Oracle Certified Master | Jim Dillani |\n\n在本节中，从数据库表生成了一个 Web RowSet，对 WebRowSet\
  \ 进行了修改，并使用修改后的 Web RowSet 更新了数据库表。\n\n## JDBC 4.0 版本\n\n嵌入在 JDeveloper 10g 或 JDeveloper\
  \ 11g 中的 OC4J 未实现 JDBC 4.0 规范。JDBC 4.0 中的新功能可在支持 JDBC 4.0 规范的 JDeveloper 的后续版本中使用。\n\
  \n在 Web 应用程序的 JDBC 4.0 版本中，将 Oracle 数据库 11g JDBC 4.0 驱动 JAR 文件 ojdbc6.jar 添加到 j2ee/home/applib\
  \ 目录中，该目录位于在 OC4J 服务器中运行的 Web 应用程序的运行时类路径中。还通过选择 Tools | Project Properties 然后选择\
  \ Libraries | Add Jar/Directory 将 ojdbc6.jar 添加到项目库中。对于 JDBC 4.0 驱动程序，我们需要将 JDK\
  \ 版本设置为 JDK 6.0。在 Applications-Navigator 中选择项目节点并选择 Tools | Project Properties。在\
  \ Project Properties 窗口中选择 Libraries 节点，然后单击 J2SE Version 字段的 Change 按钮以设置 JDK 版本。在\
  \ Edit J2SE Definition 窗口中，单击 New。在 Create J2SE 窗口中，选择一个 JDK 6.0 J2SE Executable\
  \ 并单击 OK。\n\n\n\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_277_0.png)\n\n在 **编辑\
  \ J2SE 定义** 窗口中，选择 JDK 6.0 **J2SE 定义** 并单击 **确定**。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_277_1.png)\n\
  \n在 **项目属性** 窗口中，**J2SE 版本** 被设置为 JDK 6.0。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_278_0.png)\n\
  \nJDBC 4.0 提供了增强的连接管理。JDBC 4.0 已添加对连接状态跟踪的支持，可借此识别并关闭不可用的连接。连接状态跟踪由连接池管理器实现，使用 `Connection`\
  \ 接口中的新方法 `isValid()`。连接池管理器通过在 `Connection` 对象上调用 `isValid()` 方法来确定 `Connection`\
  \ 对象是否有效。如果 `Connection` 对象无效，连接池管理器将关闭该连接。在该新功能之前，为了跟踪连接状态，连接池管理器通常必须关闭连接池中的所有连接，并在连接池性能因不可用连接而下降时重新初始化连接池。连接池管理器按如下方式实现连接状态跟踪：\n\
  \n```\nif (!connection.isValid())\nconnection.close();\n```\n\nJDBC 应用程序中的 SQLException\
  \ 可能会链接到其他 SQLException，开发人员可能有兴趣检索这些链接的异常。\n在 JDBC 3.0 中，必须通过递归调用 getNextException()\
  \ 和 getCause() 方法来检索链接的异常和异常的链接原因。\n\n```java\ncatch(SQLException e)\n{\nwhile(e\
  \ != null)\n{\nSystem.out.println(\"SQLException Message:\" + e.getMessage());\n\
  Throwable t = e.getCause();\nwhile(t != null)\n{\nSystem.out.println(\"SQLException\
  \ Cause:\" + t);\nt = t.getCause();\n}\ne = e.getNextException();\n}\n}\n```\n\n\
  JDBC 4.0 已添加对 Java SE 链接异常设施的支持，也称为原因设施。对 Java SE 链接异常设施的支持通过以下新功能实现。\n\n- SQLException\
  \ 类中新增了四个构造函数，其中一个参数为 Throwable cause。\n- SQLException 类支持 J2SE 5.0 中引入的增强 for-each\
  \ 循环，以在不递归调用 getNextException() 和 getCause() 方法的情况下检索链接的异常和链接的原因。\n- getCause()\
  \ 方法支持非 SQLException。\n\n链接的异常和链接的原因可使用增强的 for-each 循环按如下方式检索：\n\n```java\ncatch(SQLException\
  \ sqlException)\n{\nfor(Throwable e : sqlException )\n{\nSystem.out.println(\"Error\
  \ encountered: \" + e);\n}\n}\n```\n\nJDBC 4.0 驱动程序还在 RowSet 接口中添加了对 SQL 数据类型 ROWID\
  \ 和国家字符集数据类型 NCHAR、NVARCHAR、LONGNVARCHAR 和 NCLOB 的支持。\n\n本章中使用的 WebRowSetQuery 类，其中使用增强的\
  \ for-each 循环检索链接的异常，列出如下：\n\n```java\npackage webrowset;\nimport oracle.jdbc.rowset.*;\n\
  import java.io.*;\nimport java.sql.SQLException;\npublic class WebRowSetQuery\n\
  {\n    public OracleWebRowSet webRowSet;\n    public String selectQuery;\n    public\
  \ WebRowSetQuery() {\n    }\n    public WebRowSetQuery(OracleWebRowSet webRowSet)\n\
  \    {\n        this.webRowSet = webRowSet;\n    }\n    public void generateWebRowSet(String\
  \ selectQuery)\n    {\n        try\n        {\n            webRowSet = new OracleWebRowSet();\n\
  \            webRowSet.setDataSourceName(\"jdbc/OracleDataSource\");\n         \
  \   webRowSet.setCommand(selectQuery);\n            webRowSet.setUsername(\"oe\"\
  );\n            webRowSet.setPassword(\"pw\");\n            webRowSet.setReadOnly(false);\n\
  \            webRowSet.setFetchSize(5);\n            webRowSet.setMaxRows(3);\n\
  \            webRowSet.execute();\n        }\n        catch (SQLException sqlException)\n\
  \        {\n            for (Throwable e: sqlException)\n            {\n       \
  \         System.out.println(\"Error encountered: \" + e);\n            }\n    \
  \    }\n    }\n    public void generateXMLDocument()\n{\n    try\n{\n        OutputStreamWriter\
  \ output =\n            new OutputStreamWriter(new FileOutputStream(new\n      \
  \          File(\"c:/output/output.xml\")));\n        webRowSet.writeXml(output);\n\
  \    } catch (SQLException sqlException)\n{\n        for (Throwable e: sqlException)\n\
  {\n            System.out.println(\"Error encountered: \" + e);\n        }\n   \
  \ }\n    catch (IOException e)\n{\n    }\n}\npublic void deleteRow(int row)\n{\n\
  \    try\n{\n        webRowSet.absolute(row);\n        webRowSet.deleteRow();\n\
  \    } catch (SQLException sqlException)\n{\n        for (Throwable e: sqlException)\n\
  {\n            System.out.println(\"Error encountered: \" + e);\n        }\n   \
  \ }\n}\npublic void insertRow(String journal, String publisher, String\n       \
  \     edition,\n                    String title, String author)\n{\n    try\n{\n\
  \        webRowSet.moveToInsertRow();\n        webRowSet.updateString(1, journal);\n\
  \        webRowSet.updateString(2, publisher);\n        webRowSet.updateString(3,\
  \ edition);\n        webRowSet.updateString(4, title);\n        webRowSet.updateString(5,\
  \ author);\nwebRowSet.insertRow();\n} catch (SQLException sqlException)\n{\n   \
  \ for (Throwable e: sqlException)\n    {\n        System.out.println(\"Error encountered:\
  \ \" + e);\n    }\n}\npublic void updateRow(int rowUpdate, String journal, String\n\
  \    publisher,\n    String edition, String title, String author)\n{\n    try\n\
  {\n    webRowSet.absolute(rowUpdate);\n    webRowSet.updateString(1, journal);\n\
  \    webRowSet.updateString(2, publisher);\n    webRowSet.updateString(3, edition);\n\
  \    webRowSet.updateString(4, title);\n    webRowSet.updateString(5, author);\n\
  \    webRowSet.updateRow();\n} catch (SQLException sqlException)\n{\n    for (Throwable\
  \ e: sqlException)\n    {\n        System.out.println(\"Error encountered: \" +\
  \ e);\n    }\n}\n}\npublic String[] readRow(int rowRead)\n{\n    String[] resultSet\
  \ = null;\n    try\n{\n    resultSet = new String[5];\n    webRowSet.absolute(rowRead);\n\
  \    resultSet[0] = webRowSet.getString(1);\n    resultSet[1] = webRowSet.getString(2);\n\
  \    resultSet[2] = webRowSet.getString(3);\n    resultSet[3] = webRowSet.getString(4);\n\
  \    resultSet[4] = webRowSet.getString(5);\n} catch (SQLException sqlException)\n\
  {\nfor (Throwable e: sqlException)\n{\n    System.out.println(\"Error encountered:\
  \ \" + e);\n}\n}\nreturn resultSet;\n}\npublic void updateDatabase()\n{\n    try\
