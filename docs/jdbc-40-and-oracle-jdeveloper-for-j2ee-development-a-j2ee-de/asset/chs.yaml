  \           Null?    Type\n------------------------------ -------- ----------------------------\n\
  ID                            NOT NULL VARCHAR2(255)\nJOURNAL                  \
  \              VARCHAR2(255)\nPUBLISHER                              VARCHAR2(255)\n\
  EDITION                                VARCHAR2(255)\nTITLE                    \
  \              VARCHAR2(255)\nAUTHOR                                 VARCHAR2(255)\n\
  SQL>\n```\n\n在以下部分，将使用从映射文件生成的 Java 类和 hibernate.properties 属性文件添加、检索、更新和删除表数据。\n\
  \n## 使用 Hibernate 修改表数据\n\n在本节中，开发了一个中间层 Hibernate Java 应用程序，以向从映射文件 catalog.hbm.xml\
  \ 生成的表添加/更新和删除数据。Java 应用程序不是从映射文件生成的 JavaBean 类。Java 应用程序集成从映射文件生成的 JavaBean 类、映射文件和属性文件，以提供数据库持久化和查询服务。\n\
  \n选择 File | New，并在 New Gallery 窗口中选择 General | Java Class。在 Create Java Class 窗口中，指定类名\
  \ HibernateDB.java 和类包 hibernate。一个 Java 类被添加到 Hibernate 项目中。接下来，将映射文件 catalog.hbm.xml\
  \ 和 C:/Hibernate/src/hibernate/Catalog.java java bean 类复制到 hibernate 目录。Hibernate\
  \ 应用程序的目录结构如以下图所示。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_422_0.png)\n\n\n\n\
  将包含 hibernate.properties 文件的目录添加到项目库中。还请从 Hibernate 2.1.6 目录中添加 Commons lang JAR\
  \ 文件。\n\n![](img/553e44bc30e70d0d8e58278a7ece8da8_423_0.png)\n\n在 Hibernate Java\
  \ 应用程序中导入 Hibernate API 类。导入从映射文件生成的 Java 类。\n\n## 向数据库表添加数据\n\n创建 Catalog 类对象并使用\
  \ setter 方法为 Java 类的不同字段设置值。\n\n```\nCatalog catalog=new Catalog();\ncatalog.setId(\"\
  catalog 1\");\ncatalog.setJournal(\"Oracle Magazine\");\ncatalog.setPublisher(\"\
  Oracle Publishing\");\ncatalog.setEdition(\"Jan-Feb 2004\");\ncatalog.setTitle(\"\
  Understanding Optimization\");\ncatalog.setAuthor(\"Kimberly Floss\");\n```\n\n\
  接口 org.hibernate.Session 是 Java 应用程序与 Hibernate 之间主要的运行时接口，用于在数据库中创建、更新和删除数据。Session\
  \ 对象从 SessionFactory 获取。SessionFactory 接口提供 openSession() 方法来创建数据库连接并在该连接上打开会话，或在指定的连接上打开会话。org.hibernate.cfg.Configuration\
  \ 类用于指定配置属性、JavaBean 持久化类和映射文件以创建 SessionFactory 对象。创建 Configuration 对象：\n\n```\n\
  Configuration config=new Configuration();\n```\n\n使用 addClass() 方法将 JavaBean 持久化类\
  \ Catalog.class 添加到 Configuration 对象。\n\n```\nconfig.addClass(example.hibernate.Catalog.class);\n\
  ```\n\n映射文件 catalog.hbm.xml 被复制到映射的 Java 类所在的同一目录中，并使用 Configuration 对象进行配置。Hibernate\
  \ 应用程序类路径中的 hibernate.properties 文件被配置为 Configuration 对象的属性文件。使用 buildSessionFactory()\
  \ 方法从 Configuration 对象创建 SessionFactory 对象。\n\n```\nSessionFactory sessionFactory=config.buildSessionFactory();\n\
  ```\n\nSessionFactory 为 Hibernate 应用程序创建并池化 JDBC 连接。首先，我们将向使用 hibernate 映射文件和 hibernate\
  \ 属性文件创建的数据库表添加数据。使用 openSession() 方法从 SessionFactory 对象获取 Session 对象。\n\n```\n\
  Session sess = sessionFactory.openSession();\n```\n\n当打开 Session 时，JDBC 连接会从连接池中获取。Hibernate\
  \ 使用 java.sql.DriverManager 获取并池化连接。使用 beginTransaction() 方法从 Session 对象获取 Transaction\
  \ 对象以向数据库表添加数据。\n\n```\norg.hibernate.Transaction tx = sess.beginTransaction();\n\
  ```\n\n使用 save() 方法将之前创建的 JavaBean 对象存储到数据库中，并使用 commit() 方法提交事务：\n\n```\nsess.save(catalog);\n\
  tx.commit();\n```\n\nCatalog 对象中指定的值将被存储到数据库表中。使用 close() 方法关闭 Session 对象：\n\n```\n\
  sess.close();\n```\n\n## 从数据库表检索数据\n\n接下来，我们将检索存储在数据库表中的数据。创建查询以从表中选择数据。查询使用 Hibernate\
  \ 查询语言（HQL）语法定义，该语法与 SQL 类似。\n\n```\nString hqlQuery =\"from example.hibernate.Catalog\"\
  ;\n```\n\n如果查询中未指定 Select 子句，则 From 子句中选择的全部字段都将从映射类中选择。From 子句使用映射的 Java 类 example.hibernate.Catalog\
  \ 指定，而不是数据库表。Java 类对象到数据库的映射由映射文件和属性文件执行。使用 openSession() 方法从 SessionFactory 对象打开\
  \ Session 对象：\n\n```\nSession sess = sessionFactory.openSession();\n```\n\n使用 Session\
  \ 对象的 createQuery(hqlQuery) 方法创建 Query 对象：\n\n```\nQuery query = sess.createQuery(hqlQuery);\n\
  ```\n\n使用 Query 对象的 list() 方法从 HQL 查询获取 List：\n\n```\nList list = query.list();\n\
  ```\n\n遍历 List 并输出指定 HQL 查询的值。例如，Journal 列值输出如下：\n\n```\nfor (int i = 0; i < list.size();\
  \ i++) {\nCatalog catalog = (Catalog) list.get(i);\n    System.out.println(\"CatalogId\
  \ \" + catalog.getId() +\n    \" Journal: \" + catalog.getJournal());\n}\n```\n\n\
  ## 更新数据库表\n\n接下来，我们将使用 Hibernate Java 应用程序更新表值。创建查询以从表中选择要修改的数据\n\n```\nString hqlQuery=\"\
  from Catalog\";\n```\n\n从 SessionFactory 对象获取 Session 对象。\n\n```\nSession sess =\
  \ sessionFactory.openSession();\n```\n\n从 Session 对象获取 Transaction 对象。\n\n```\n\
  Transaction tx = sess.beginTransaction();\n```\n\n使用 Session 对象的 createQuery() 方法从\
  \ HQL 查询创建 Query 对象。使用 list() 方法获取 List 结果集。获取要修改的 JavaBean 对象。\n\n```\nQuery query\
  \ = sess.createQuery(hqlQuery);\nList list = query.list();\nCatalog catalog = (Catalog)\
  \ list.get(0);\n```\n\n例如，将 publisher 字段的值设置为 \"Oracle Magazine\"。\n\n```\ncatalog.setPublisher(\"\
  Oracle Magazine\");\n```\n\n使用 Session 对象的 beginTransaction() 方法开始 Session 事务。\n\
  \n```\nTransaction tx = sess.beginTransaction();\n```\n\n使用 Session 对象的 saveOrUpdate()\
  \ 方法更新数据库表并提交事务：\n\n```\nsess.saveOrUpdate(catalog);\ntx.commit();\n```\n\n## 删除数据\n\
  \n接下来，使用 Hibernate API 删除表行。例如，删除 edition 为 \"March-April 2005\" 的表行。创建 HQL 查询以选择要删除的数据库表行。\n\
  \n```\nString hqlQuery=\"from Catalog as catalog where catalog.edition='March-April\
  \ 2005'\";\n```\n\n使用 SessionFactory 对象的 openSession() 方法打开数据库会话：\n\n```\nSession\
  \ sess = sessionFactory.openSession();\n```\n\n使用 HQL 查询创建 Query 对象。获取 HQL 查询的结果集\
  \ List。获取要删除的结果集项：\n\n```\nQuery query = sess.createQuery(hqlQuery);\nList list\
  \ = query.list();\nCatalog catalog = (Catalog) list.get(0);\n```\n\n使用 beginTransaction()\
  \ 方法开始会话事务：\n\n```\nTransaction tx = sess.beginTransaction();\n```\n\n使用 `Session`\
  \ 对象的 `delete()` 方法删除 HQL 查询中指定的行并提交事务：\n\n```\nsess.delete(catalog);\n tx.commit();\n\
  ```\n\n示例 Java 应用程序 `HibernateDB.java` 具有用于添加数据的 `addToCatalog` 方法、用于检索数据的 `retrieveFromCatalog`\
