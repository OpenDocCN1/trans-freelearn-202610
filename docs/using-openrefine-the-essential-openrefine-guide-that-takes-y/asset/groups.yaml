  - '[PAGE 49]


    Finally, add a third facet, a simple text facet this time, to list the different
    registration numbers that feature more than once in the dataset. Sorting by count,
    we can see that out of the 79 choices, 77 are indeed strict duplicates (values
    present twice), whereas one value appears thrice (2008/37/1), and one as many
    as six times (86/1147-3). The three facets can be seen in the following screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_49_0.png)


    Now back to our record IDs. Since the duplicates facet is of no use on integers,
    we will use a workaround to detect duplicates in that column. To achieve that,
    we will first sort the data on their IDs by navigating to Record ID | Sort...
    and toggling numbers and smallest first. As you may recall from Chapter 1, Diving
    Into OpenRefine, sorting is but a visual aid, so the reordering needs to be made
    permanent by going to the Sort menu that has just appeared (right of Show: 5 10
    25 50 rows), and clicking on Reorder rows permanently. If you forget to reorder
    the rows, further operations will ignore the sorting and yield unexpected results.'
  - '[PAGE 50]


    Now that the rows are sorted by ID, duplicates will necessarily be grouped together,
    so we can navigate to **Record ID | Edit cells | Blank down** to replace the IDs
    of duplicate rows by blanks (every original row will keep its ID, only subsequent
    ones will lose them). Faceting the blanked rows by navigating to **Record ID |
    Facet | Customized facets | Facet by blank** will display the 86 redundant rows
    (or maybe 84 if you already removed blank rows) including one row from each pair,
    two of the triplet, and five of the sextuplet. These 86 rows are the real duplicates
    without the original rows to be preserved, and we will learn how to remove them
    in *Recipe 6 – removing matching rows.*


    # Recipe 4 – applying a text filter


    In this recipe, you will learn about filters that allow you to search for values
    displaying some patterns.


    When you want to find rows matching a certain string, it is easier to rely on
    a simple text filter than on cumbersome facets. Let''s start with a simple example.
    Suppose you want to filter all titles relating to the United States. Navigate
    to **Object Title | Text filter** and watch the filter box open on the left, in
    the same tab where facets appear. Now type in USA. OpenRefine tells you that there
    are 1,866 matching rows. Select the **case sensitive** checkbox to eliminate happenstance
    matches, such as karakusa and Jerusalem, and we are down to 1,737 rows:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_50_0.png)'
  - '[PAGE 51]


    Still, we cannot be sure that there is no noise left in these matches; there could
    be occurrences of JERUSALEM in capital letters for instance. To get around this
    problem, we could try to add spaces to either side of USA, but at the risk of
    losing cases, such as [USA] or /USA, along with occurrences of the beginning or
    the end of a title. As a matter of fact, the filter USA with whitespace only returns
    172 matches, about one-tenth of all occurrences of USA, which is a lot of silence.


    On the other side of the coin, our simple text filter does not account for spellings
    such as U.S.A. (201 matches), U S A (29 matches), or U.S.A (22 matches). It can
    quickly become a nightmare to keep track of all the variants, and you will need
    to star the rows individually in order to group them all together later.


    This is where regular expressions come into the picture. Regexes, as they are
    often called, are extremely powerful, but they demand a basic understanding of
    their peculiar syntax before they can be used fruitfully. For instance, an expression
    such as \bU.?S.?A\b (with the regular expression box selected) would match all
    preceding relevant cases while excluding problematic ones, and would return 1,978
    matching rows.


    It is beyond the scope of this recipe to teach you how to master regexes, but
    Appendix, Regular Expressions and GREL, is waiting for you to explain the basics.


    Another useful thing we can do with text filters is checking the aptness of separators.
    In the Categories column, pipe characters (|) are used to single out categories.
    Let''s add a text filter on that column and start by typing a single pipe. OpenRefine
    displays 71105 matching rows, which means that most of the objects are described
    with at least two categories (since a single category does not need a pipe separator).


    Now add a second pipe to get ||; nine problematic rows are detected containing
    a double pipe instead of a single one. In Chapter 3, Advanced Data Operations,
    we will see how to use the GREL to fix this issue. Another problem is cells beginning
    or ending with a pipe, but finding them requires the use of regular expressions
    as well, so that will have to wait until Appendix, Regular Expressions and GREL.'
  - '[PAGE 52]


    # # Recipe 5 – using simple cell transformations


    In this recipe, you will learn how to use OpenRefine''s built-in transformations
    to modify subsets of your data.


    When playing with facets and filters, we have essentially displayed the data in
    various ways, but we have not really affected them. Now comes the time to modify
    your data at last, and this means entering the powerful **Edit cells** menu. While
    we already used **Blank** down in order to detect duplicates, other transformations,
    such as splitting and joining multi-valued cells or clustering and editing values,
    are more advanced, so we will delay their discussion until the next chapter. Other
    transforms are easier to grasp; however, we will focus now on those available
    through the **Common transforms** submenu pictured in the following screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_52_0.png)'
  - '[PAGE 53]


    **Trimming whitespace** at the beginning and end of a string is a good first step
    to improve the quality of your data. It will ensure that their identical values
    will not differ by leading and trailing whitespace only, which can be quite tricky
    to detect, making your data more consistent. It can also help reduce the size
    of your dataset by eliminating unnecessary characters; while a small space does
    not weigh much, several thousands of them can make a difference and cause hidden
    havoc. Remember the blank values that were categorized as non-numeric because
    of a single whitespace character.


    Unique identifiers should not contain spaces either; let''s check if all is well
    by navigating to **Registration Number | Edit cells | Common transforms | Trim
    leading and trailing whitespace**. 2,349 cells are affected by the operation,
    which means it was well needed. Note that we cannot do the same on the Record
    ID column, since trimming only works on strings, not on integers; the result would
    be to suppress all IDs!


    **Consecutive whitespace** is also common when typing too fast, and we would expect
    to find some in long text fields such as object titles or descriptions. Surprisingly,
    these are not to be found in these columns, whereas running **Collapse consecutive
    whitespace** on the column **Production Date** reveals 7671 values affected, but
    these are mostly integers being converted to strings. Do try these two transformations
    on other columns for yourself; they are safe and can only prove beneficial for
    your data.


    If your data were exported from some web application, it is likely that they will
    contain **HyperText Markup Language (HTML)** code. In HTML, special characters
    are escaped (that is, protected) by a number or with custom shortcuts known as
    HTML entities. For instance, the French é character (e with an acute accent) would
    be encoded either as `&#233;` or as `&eacute;` depending on the paradigm used.


    While these are useful on the Web to avoid encoding problems in your browser,
    they can make reading difficult when they are not properly unescaped (unescaping
    `&eacute;` for instance would mean transforming it back into é). So, if you spot
    some of those values beginning with an ampersand (&) and ending with a semi-colon
    (;), go to **Edit cells | Common transforms | Unescape HTML entities** and watch
    your data being transformed into something legible.'
