    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_28_0.png)\n\n### Renaming and removing\
    \ columns\n\n在同一个 **Edit column** 菜单项下，你也有可能：\n\n- Rename this column\n- Remove\
