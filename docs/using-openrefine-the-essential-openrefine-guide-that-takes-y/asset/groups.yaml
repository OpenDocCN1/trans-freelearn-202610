    +   - XML and Resource Description Framework (RDF) as XML

    +   - Line-based formats (logs)


    If you need other formats, you can add them by way of OpenRefine extensions.


    Project creation with OpenRefine is straightforward and consists of three simple
    steps: selecting your file, previewing the import, and validating to let OpenRefine
    create your project. Let''s create a new project by clicking on the **Choose Files**
    button from the **This Computer** tab, selecting your dataset (refer to the following
    information box), then clicking on **Next**.


    > Although we encourage you to experiment with OpenRefine on your own dataset,
    it may be useful for you to be able to reproduce the examples used throughout
    this book. In order to facilitate this, all recipes are performed on the dataset
    from the Powerhouse Museum in Sydney, freely available from your account at http://www.packtpub.com
    (use the file chapter1.tsv). Feel free to download this file and load it into
    OpenRefine in order to follow the recipes more easily. Files are also present
    for the remaining chapters in a similar format for download. If you purchased
    this book elsewhere, you can visit http://www.packtpub.com/support and register
    to have the files e-mailed directly to you.


    On the next screen, you get an overview of your dataset as it will appear in OpenRefine.
    In the bottom-right corner, you can see the following parsing options as shown
    in the following screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_23_0.png)


    By default, the first line will be parsed as column headers, which is a common
    practice and relevant in the case of the Powerhouse dataset. OpenRefine will also
    attempt a guess for each cell type in order to differentiate strings from integers,
    dates, and URLs among others. This will prove useful later when sorting your data
    (if you choose to keep the cells in plain text format, 10 will come before 2,
    for instance).'
