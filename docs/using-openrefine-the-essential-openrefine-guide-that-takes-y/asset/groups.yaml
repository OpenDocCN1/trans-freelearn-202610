  - '[PAGE 45]


    Yet, OpenRefine also provides a few customized facets; these are predefined custom
    facets that have proved to be of a common use to many users. In what follows,
    we will browse these facets, paying particular attention to the most useful of
    them. Let''s first have a quick look at the Customized facets submenu, which can
    be accessed from any column:


    | Word facet |

    | Duplicates facet |

    | Numeric log facet |

    | 1-bounded numeric log facet |

    | Text length facet |

    | Log of text length facet |

    | Unicode char-code facet |

    | Facet by error |

    | Facet by blank |


    **Word facet** lists all the different words used in a field, a word being simplistically
    defined as a text string between two whitespace characters. This is something
    you will want to try on a subset of your data, as the number of choices can quickly
    grow very large; a word facet on the column **Description**, for instance, would
    display 212,751 different words, which is a sure way to crash the application.


    Word facets could be used to refine your list of categories. For instance, while
    a simple text facet will tell you how many objects were described as cocktail
    dresses, a word facet will split that category into two words, and let you browse
    separately the various dresses on one hand and the objects related to cocktail
    (including cocktail glasses for instance) on the other hand.


    **Duplicates facet** allows you to detect duplicate values; so we will keep that
    for the next recipe.


    **Numeric log facet** is a shortcut to display the logarithm of numbers instead
    of their actual values, which can be useful if your data follows a power law distribution.
    The **1-bounded numeric log facet** is the same, except that it does not accept
    values under one.'
  - '[PAGE 46]


    # Analyzing and Fixing Data


    **Text length facet** organizes the objects according to the number of characters
    contained in some string, the **Object Title** for instance. Navigating to **Facet
    | Customized facets | Text length facet** in that column menu will show you that
    the titles range from 0 to 260 characters. You can then focus on the 92 titles
    that are shorter than 10 characters (no more than a word in most cases, and not
    very informative) or on the 2007 titles that are longer than 250 characters (which
    are often redundant with descriptions).


    Speaking of descriptions, an analysis of their length is also of interest, but
    the distribution is so large (ranging from 0 to 4,100 characters, although 85
    percent of the descriptions are shorter than 500 characters) that it is quite
    difficult to make sense of it. This is where the log of text length facet (the
    following screenshot) comes into the picture, allowing for a much clearer chart:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_46_0.png)


    The **Unicode char-code facet** does not compute a string''s length, but lists
    all the characters used in the string. Try that on the **Object Title** column
    for instance; most English characters are under 128, but accented letters from
    other European languages can range up to 256, or even higher for Arabic or Chinese
    characters, for instance. If you notice suspiciously high values, however, it
    could mean that OpenRefine did not recognize your dataset''s encoding properly.
    In this case, start again with a new project and select the right encoding manually.'
  - '[PAGE 47]


    Finally, you can facet your data by error (assuming they contain any), or facet
    them by blank. This last option is very useful to know what proportion of the
    collection has been filled for a given field, and can often be used in combination
    with another facet. A quick glance at the **Marks** column shows that the first
    few cells are empty, so we could navigate to **Facet | Customized facets | Facet
    by blank** to learn more about it. This facet informs us that 18,968 values are
    false (that is, not blank), and 56,846 are true (that is, blank). In other words,
    only a quarter of the objects have some marks described in the file.


    Even more significant is that the column **Weight** (on the right, use the horizontal
    scrollbar to view it) has only been filled for 179 objects, leaving it empty in
    99.998 percent of cases. And faceting by blank on the object titles shows that
    118 records are dummies; they got a record ID along with a persistent link and
    some fake license information based on this ID, but all the other columns are
    empty, so they do not really refer to an object.


    # Faceting by star or flag


    In *Chapter 1, Diving Into OpenRefine*, we briefly mentioned the existence of
    stars and flags in the special **All** column on the left. It is now time to see
    how these can be used as well to facet your data in meaningful ways. Stars can
    be used to mark good rows or favorite rows that you want to pick up in order to
    come back to them later; conversely, flags can be used to indicate bad rows or
    problematic rows that will need special attention further on. Note that this is
    just a suggestion; you could use stars and flags to mean something completely
    different.


    To star or flag a single row, just click on the corresponding symbol on the left.
    Most of the time, however, you will want to mark multiple rows in one go. To do
    that, you first need to isolate these rows in the display, often by using another
    facet. For instance, you could detect empty rows by going to the **Registration
    Number** column menu and navigating to **Facet | Customized facets | Facet by
    blank**, and clicking on **true** on the left in order to display the 118 matching
    (empty) rows only. To flag them all, open the **All** column menu and navigate
    to **Edit rows | Flag rows**. The same works for stars, and you can unflag and
    unstar multiple rows as well in the same menu.'
  - '[PAGE 48]


    Now imagine that you want to display the rows that have some information about
    the diameter or their weight. If you facet by blank on both columns at the same
    time and click on false twice, you will end with only 29 matching rows which correspond
    to those having a diameter and a weight recorder in the dataset. To achieve what
    we want, the solution is to proceed in two steps: facet by blank on the column
    Diameter, and select the 2106 rows marked as false (that is, for which the diameter
    is present) and star them with All | Edit rows | Star rows. Clear the facet and
    repeat these steps with the 179 rows from the Weight column (you may notice that
    only 150 rows are effectively starred, the 29 remaining ones having already been
    starred since they have both measurements). Clear the facet again and display
    what we were looking for by navigating to All | Facet | Facet by star. The same
    works for flags, of course.


    Hooray, we have reached the end of this long recipe at last! It may have felt
    somewhat disproportionate, but facets are really the ABC of OpenRefine, so it
    was worth the effort.


    # Recipe 3 – detecting duplicates


    In this recipe, you will learn what duplicates are, how to spot them, and why
    it matters.


    The only type of customized facet that we left out in the previous recipe is the
    duplicates facet. Duplicates are annoying records that happen to appear twice
    (or more) in a dataset. Keeping identical records is a waste of space and can
    generate ambiguity, so we will want to remove these duplicates. This facet is
    an easy way to detect them, but it has a downside; it only works on text strings,
    at least straightforwardly (to learn how to tweak it to work on integers as well,
    have a look at Appendix, Regular Expressions and GREL).


    Too bad then; we cannot use a duplicate facet on the Record ID column. The next
    best thing is to run it on the registration numbers, which are an internal classification
    of objects in the collection, though they are not as reliable as the IDs, since
    they have an extrinsic meaning for collection managers. Anyway, let''s give it
    a try by navigating to Registration Number | Facet | Customized facets | Duplicates
    facet; 281 rows are marked as duplicates, and we can display them by clicking
    on the word true in the facet on the left.


    Now scroll down some rows to have a look at those duplicates. We see there is
    a problem; the duplicates facet included all the blank rows which are indeed the
    same, but not duplicates of an object since they do not represent any. To exclude
    these 118 empty rows, we need another facet that can be accessed through Registration
    Number | Facet | Customized facets | Facet by blank. Click on false to keep the
    163 real duplicates and notice that the first facet above refreshes automatically.'
