    ## Mac


    Mac的说明稍微复杂一些，因为这个操作系统将配置文件隐藏了起来。关闭OpenRefine后，按住control键并点击其图标，从弹出菜单中选择“显示包内容”。然后，从Contents文件夹中打开`info.plist`文件。现在你应该看到一系列OpenRefine设置。导航到Java设置并编辑`VMOptions`的值（这些是Java虚拟机的属性）。查找以`-Xmx`开头的部分，并将其默认值1024
    M改为所需的内存量，例如，`-Xmx2048M`。


    ## Linux


    这可能会让你感到惊讶，但在Linux中增加分配的内存是最简单的。不要像通常那样用`./refine`启动OpenRefine，只需输入`./refine -m
    2048M`，其中2048是所需的内存量（以MB为单位）。要使更改永久生效，你可以在主文件夹中隐藏的`.bashrc`文件中创建一个别名，在文件末尾添加以下行：


    ```

    alias refine=''cd path_to_refine ; ./refine -m 2048M''

    ```


    这里，`path_to_refine`是从你的主文件夹到OpenRefine文件夹的相对路径。然后，下次你用`./refine`启动OpenRefine时，它将默认分配2
    GB内存。


    ## Summary


    在本章中，你已经了解了OpenRefine，它是你在数据剖析、清洗、转换以及许多其他有待发现的功能方面的新好朋友。你现在已经运行了一个OpenRefine安装，并且知道如何通过创建新项目将数据导入其中，以及完成后如何再次导出数据。行和列的机制对你来说已不再是秘密，你也理解了如何在项目历史中导航。你还掌握了内存分配，这使你能够处理更大的数据集。


    虽然在弄脏双手之前，先全面了解数据集中有什么总是很重要的，但你现在可能已经迫不及待地想要对你的数据执行实际更改了。如果是这样，你已经准备好进入第2章“分析和修复数据”，这一章将继续教你分析和修复数据所需的所有基本操作的来龙去脉。


    ## 2


    ## 分析和修复数据


    在本章中，我们将更深入地了解OpenRefine，并回顾其大部分用于数据修复和分析的基本功能。我们将涵盖以下主题，分布在六个配方中：


    - 配方1 – 排序数据

    - 配方2 – 分面数据

    - 配方3 – 检测重复项

    - 配方4 – 应用文本过滤器

    - 配方5 – 使用简单的单元格转换

    - 配方6 – 删除匹配的行


    与*第1章，深入OpenRefine*相比，这些配方更是为了让读者可以根据自己的需求和兴趣，以任意方式从一个配方跳到另一个配方。当然，连续阅读本章也是可行的，但完全不是必须的。


    请注意，这些配方的长度并不相同；有些非常简短且切中要点，但其他一些则无法压缩到一两页。例如，*配方2 – 分面数据*涵盖了分面这一广泛主题，跨越了许多页，并分为子配方。


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_35_0.png)


    > 要跟随本章使用的示例，我们建议你在启动时选择**导入项目**直接加载`chapter2.openrefine.tar.gz`文件。或者，你也可以使用从`chapter1.tsv`文件创建自己的OpenRefine项目，如*第1章，深入OpenRefine*所述。


    ## 配方1 – 排序数据


    在本配方中，你将学习如何将数据排序作为视觉辅助，以及如何永久地重新排序行，作为更高级操作的前提。


    因为排序后的值更容易探索和操作，排序数据当然是你使用OpenRefine时在某个时刻想要做的事情；你可以将排序后的值用作视觉辅助，也可以永久地重新排序你的记录。例如，要按**记录ID**对数据进行排序，请在列菜单中选择**排序...**以访问以下窗口：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_36_0.png)


    单元格值可以根据其类型进行排序：文本（区分大小写或不区分大小写）、数字、日期或布尔值。对于每种类型，我们有两种可能的排序顺序：


    - **文本：** 字母顺序（a到z）或字母逆序（z到a）

    - **数字：** 最小在前或最大在前

    - **日期：** 最早在前或最晚在前

    - **布尔值：** 先false后true或先true后false


    此外，我们可以通过按所需顺序拖放，选择错误值和空值相对于有效值的位置。例如，错误值可以排在前面（以便更容易发现），空值排在最后（因为我们对它们不太感兴趣），有效（正常）值排在中间。


    例如，通过选择**数字**和**最小在前**按**记录ID**对数据进行排序，将得到新的顺序7、9、14等，而之前是**267220、346260、267098**等。以下截图说明了排序前后的顺序：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_37_0.png)


    按文本排序会产生不同的顺序，从100、1001、10019等开始。但请注意，此排序并未记录在项目历史中；你可以通过点击屏幕左上角的**撤销/重做**选项卡自行检查。


    这是因为OpenRefine中排序的默认行为不是影响数据，而只是按你喜欢的方式显示它们，例如行/记录的交替或折叠不需要的列（你也可以想到电子表格软件中的排序过滤器）。因此，每次你对给定列的数据进行排序时，你都会面临三个选项：移除排序并返回原始顺序，将其保留为临时的视觉辅助，或者使重新排序永久生效。


    这些选项不能在原始的列菜单中选择，但可以在顶部出现的专用“排序”菜单中使用，如下面的截图所示：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_38_0.png)


    ### 重新排序行


    “排序”菜单允许你移除排序或永久地重新排序行。此外，它会提醒你哪些列用于排序，这使得组合各种排序标准成为可能（参见前面的截图）。例如，你可以首先按注册号排序数据，然后按对象标题排序，作为双重视觉辅助。之后，你可以决定仅移除对数字的排序（通过导航到“排序
    | 按注册号 | 移除排序”）并使对标题的排序永久化。各个排序子菜单还允许你一键反转排序顺序。


    如果你需要将任何重新排序用于其他操作（例如清空或向下填充单元格），请务必使其永久生效，以避免不一致的结果。在配方3 – 检测重复项中，我们将看到如何使用排序作为删除重复项的初步步骤。


    ## 配方2 – 分面数据


    你经常使用的OpenRefine功能之一是分面。分面不影响数据的值，但允许你获得数据集的有用见解；你可以将分面视为查看数据的各种方式，就像一颗仍需打磨的宝石的各个刻面。分面还允许你对数据的子集应用转换，因为它们允许你仅显示符合给定条件的行。


    在本配方中，我们将根据数据的值和你的需求探索分面的各种方式：用于字符串的文本分面、用于数字和日期的数值分面、一些预定义的自定义分面，最后是如何使用星标和旗标。OpenRefine的大部分强大之处在于能够组合这些不同类型的分面。


    ### 文本分面


    例如，如果你的数据集有一个包含城市或国家名称的列，你会希望一眼看到该字段的不同值以及每个值的出现次数。这正是文本分面的用途。当然，分面只有在可供选择的选项数量有限时才有用；列出所有对象标题或描述是没有意义的，因为它们不太可能重复出现（除非是重复项，这将在下一个配方中处理）。


    在Powerhouse藏品中，文本分面的最佳候选显然是“类别”列，因为它包含来自受控词表的关键词（如果你好奇的话，该词表称为Powerhouse博物馆对象名词词库）。简单来说，类别是用于描述藏品中对象的几千个术语的集合。


    那么，让我们尝试通过在“类别”列菜单中选择“分面 | 文本分面”来概览这些类别。此分面的结果显示在屏幕左侧的“分面/过滤器”选项卡中。糟糕的是，OpenRefine告诉我们总共有14,805个选项，由于内存原因，显示太多选项了。实际上，分面选项的默认上限仅为2,000。我们可以尝试通过点击“设置选项计数限制”链接并将上限提高到例如15,000来克服此限制，但请注意，这可能会减慢应用程序的速度，尤其是在你没有更改默认RAM分配的情况下（参见第1章“深入OpenRefine”中的配方7
    – 争取更多内存）。


    > 如果你选择在弹出的窗口中提高限制，OpenRefine真正做的是更改一个名为`ui.browsing.listFacet.limit`的Java变量的值。虽然在大多数情况下你不需要理会这个古怪的名称，但如果你意识到自己把值增加得太高并想将其降低时，它可能会派上用场。事实上，当选项计数超出标准时，OpenRefine总是会提供提高限制的选项，但绝不会提供降低的选项。要做到这一点，请转到系统偏好设置
    http://127.0.0.1:3333/preferences，编辑键为`ui.browsing.listFacet.limit`的偏好设置，并将其值设置为较小的值。要恢复默认的2000值，你也可以完全删除此偏好设置。


    '
