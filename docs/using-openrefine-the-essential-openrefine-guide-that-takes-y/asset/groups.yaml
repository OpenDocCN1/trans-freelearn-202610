    \ identifier `$0` is used for the result of the entire expression.\n\nThe functionality\
    \ is only limited by the complexity of your expressions. A more difficult example\
    \ we have noticed before is that cells in the multi-valued **Categories** column\
    \ sometimes contain empty values. For instance, a value such as `\"|Stones||Bones||Buildings\"\
    ` actually only contains three values, but if you split on the vertical bar, you\
    \ will get seven of them (including four empty ones) because there are six divider\
    \ bars. We can get rid of all these fake bars. Bars at the beginning must be removed,\
    \ so we first do `value.replace(/^\\|/, \"\")`. This looks a little more complicated\
    \ than it is because the bar has to be escaped as it has a special meaning in\
    \ regular expressions. To change multiple occurrences into a single one, we can\
    \ do `value.replace(/\\|+/, \"|\")`. Note how the vertical bar is escaped in the\
    \ regular expression, but not in the replacement string, as it has no special\
    \ meaning there.\n\nOpenRefine has other methods than `replace`, as you can see\
    \ in the useful **Help** tab of the expression editor, or in the overview at https://github.com/OpenRefine/OpenRefine/wiki/GREL-Functions.\
    \ One example is the `split` method. When used on the **Categories** field, we\
    \ can count how many different values are present in each cell as follows: `value.split(\"\
    |\").length()`. Here, we instruct OpenRefine to split the value whenever it encounters\
    \ a vertical bar, and then uses the length function to count the number of resulting\
    \ values. You can even build more complicated expressions such as `value.split(\"\
    |\").unique().join(\"|\")`, which, as we've seen in *Chapter 3, Advanced Data\
    \ Operations*, removes duplicate values from the field.\n\nIf you want a facet\
    \ of your own, you don't have to start with any of the pre-made facets. For instance,\
    \ if we want to filter on the number of categories, we can create a custom facet\
    \ by going to the **Categories** dropdown and clicking on **Facet | Custom text\
    \ facet...**. Enter the expression `value.split(\"|\").length()` and click on\
    \ **OK**. You see a new **Categories** facet on the left-hand side which lets\
    \ you choose the number of categories. If, like here, the output of your expression\
    \ is a number, you might want to create a numeric facet instead. Follow the same\
    \ steps, but navigate to **Facet | Custom numeric facet...** this time. This allows\
    \ you to filter your records in a numeric way. Custom facets are a great way to\
    \ explore your dataset in detail without touching your data.\n\n## Solving problems\
    \ with GREL\n\nFinally, some knowledge of GREL comes in handy in those places\
    \ where something doesn't quite work the way you expect. For instance, we saw\
    \ in *Chapter 2, Analyzing and Fixing Data,* that the duplicates facet works fine\
    \ on the **Registration Number** column, but not on **Record ID**. Let's see if\
    \ we can fix that. Create a duplicates facet by clicking on the **Record ID**\
    \ dropdown and navigating to **Facets | Customized facets | Duplicates** facet.\n\
    \n> Be sure to try this with the original dataset that has not been cleaned, otherwise\
    \ the duplicates have already been removed.\n\nAs you might recall, OpenRefine\
    \ does not find duplicates. So, let's edit the expression to update that. When\
    \ we click on the **Change** link, we see the original expression:\n\n```\nfacetCount(value,\
    \ 'value', 'Record ID') > 1\n```\n\nThe problem here is that value is a number\
    \ and facetCount only works with strings. The solution is to convert value to\
    \ a string, like this:\n\n```\nfacetCount(value.toString(), 'value', 'Record ID')\
    \ > 1\n```\n\nThis will correctly indicate the duplicate rows in the facet.\n\n\
    You might be wondering: how could I ever have found this out myself? The secret\
    \ is practice and exploration. The more datasets you analyze, clean, and link\
    \ in OpenRefine, the better you will get at it. Also, you'll gain more and more\
    \ experience with regular expressions and GREL as you gradually begin to master\
    \ the basics. From that point onwards, it is a small step to the things that are\
    \ increasingly complex. This book has tried to show you the direction; now it's\
    \ time to go your own way.\n\n## Index\n\n### A\n\n- anchors 86\n\n### C\n\n-\
