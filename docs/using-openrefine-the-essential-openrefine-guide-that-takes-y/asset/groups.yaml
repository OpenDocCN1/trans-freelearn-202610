    ;，它将过滤掉所有其他值。现在重试单元格变换，你会看到变换只应用于选中的单元格，不会引发任何错误。


    最后，为了展示单元格变换的强大功能，我们将做一些真正复杂的事情。虽然竖线现在已经被改成逗号，但 **分类** 字段仍然存在问题。确实，有些对象同一个类别出现了多次，比如记录
    14：**教学展示、珍珠贝壳、纽扣、教学展示**。不幸的是，我们无法像之前消除重复行那样解决这个问题，因为这里的重复发生在一行之内。幸运的是，GREL 可以帮我们。在
    **分类** 列上打开变换对话框，输入以下表达式：`value.split(", ").uniques().join(", ")`。这个表达式看起来复杂，但很容易理解各个部分：首先，值按每个
    ,（逗号加空格）拆分，然后通过 `uniques` 函数保留唯一值，最后再将它们重新连接起来。点击 **OK** 时，OpenRefine 将应用变换并告知有多少单元格受到影响。


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_71_0.png)


    ## 掌握 GREL 很容易


    本操作介绍了一些示例，但如果这些不能满足你的需求怎么办？*附录 A，正则表达式与 GREL* 将向你介绍 GREL，使你可以学习如何自行构建表达式。


    ## 操作 5 – 添加派生列


    有时，你确实想变换单元格的内容，但同时保留原始值。虽然在出错时可以使用 撤销 / 重做 选项卡回到单元格之前的状态，但能够同时看到原始值和变换后的值也很有用。因此，OpenRefine
    允许你基于另一列添加一列。


    假设我们想有一个单独的字段，统计每条记录的分类数量。点击 分类 下拉菜单，点击 编辑列 和 基于此列添加列... 一个与单元格变换对话框非常相似的对话框弹出；不过，这次它还额外要求输入列名。在
    新列名称 字段中输入 Category Count。现在，我们必须创建统计分类数量的表达式。由于所有分类都由一个字符分隔（竖线，如果你遵循了上一个操作则是逗号），我们可以直接拆分它们并统计分段数量。这个表达式可以做到：`value.split(",").length()`。预览面板显示了前几个单元格的结果，看起来没问题，所以点击
    OK。


    OpenRefine 现在已经创建了一个新列。我们现在可以使用 Category Count 列来分析数据。例如，我们可以通过点击 Category Count
    下拉菜单并导航到 分面 | 文本分面 来创建分面。注意，这里文本分面更合适，即使数据是数值型的，因为我们不想选择范围，而是想检查各个计数。分面出现在左侧，告诉我们有多少对象被分配了特定数量的分类，如下面的截图所示：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_73_0.png)


    我们还注意到一些奇怪的地方：其中一个值是 (blank)。如果我们点击它，会看到所有对应记录的 分类 字段都是空的。为什么 Category Count 列不直接显示有
    0 个分类呢？答案是，对于这些空单元格，变换表达式出错了，因为没有可拆分的值。和上一个操作一样，我们本可以在开始变换之前过滤掉这些行。


    相反，让我们修复这些行。在分面中仍然选中 (blank) 选项时，点击 Category Count 列下拉菜单，导航到 编辑单元格 | 变换.... 如果我们输入
    0 作为表达式并点击 OK，空单元格现在就包含 0。如果现在看不到任何行，不要困惑：分面中的 blank 过滤器仍然处于活动状态。点击 0 过滤器（或其他任何过滤器），你就会看到预期的数据。


    从数据分析的角度来看，现在有趣的是看看每条记录有多少个分类是常见的。在 Category Count 分面中，将 **排序依据：** 设置为 count。我们现在可以得出结论，每条记录
    2 个分类是最常见的情况。请注意，如果你已经按照前面的操作对值进行了聚类并移除了重复项，这些数字会更加合适。GREL 又一次派上了用场。


    ## 操作 6 – 将数据拆分到多列


    本章开头我们展示了如何将单个单元格中的多个值拆分到不同行。然而，这并不总是你想要的。在迄今为止的示例中，每个不同的值都扮演着相同的角色：一个分类与其他分类没有区别，它们的顺序可以互换。当一个字段中堆满了不同类型的值时，情况就不同了。例如，当
    `Clients` 表包含电话字段但没有电子邮件字段，而联系人同时提供了这两种信息时，就可能发生这种情况。结果，这个人的电话号码和电子邮件地址可能会出现在同一个字段中，用斜杠分隔。


    我们在 Powerhouse Museum Collection 数据的各个列中也看到了类似的情况。例如，在 **来源** 字段中，我们看到了关于设计师、制作者以及其他各种信息。把这些信息放到不同的列中，以便我们可以单独分析它们，是很有意义的。为此，点击
    **来源（生产）** 下拉菜单，导航到 **编辑列 | 拆分为多列…**。然后我们会看到一个包含各种拆分选项的对话框：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_74_0.png)


    我们可以在 **按分隔符** 拆分（这是目前我们一直在做的）或 **按字段长度** 拆分之间选择。如果你的字段包含结构化数据，例如 `1987 en-us,x/Y`，其中没有固定的分隔符（或根本没有分隔符），后者就很有意义。然而，我们的数据使用简单的分隔符。一个有趣的选项是设置限制，因为否则可能会产生很多列，所以将其设置为
    5 之类的值是明智的。别忘了让分隔符与数据中的分隔符匹配，在我们的例子中就是竖线 `|`。你可以选择让 OpenRefine 在拆分后猜测单元格类型（例如，如果你有数值）以及是否移除原始列。


    点击 **OK** 后，你会看到 OpenRefine 将名为 Provenance (Production) 的一列替换为多个带编号的列，称为 Provenance
    (Production) 1、Provenance (Production) 2 等，之后可以根据它们包含的值重命名。并非所有列都包含值；只有那些字段中至少有
    5 个项目的记录才能找到值。虽然拆分创建的列永远不会超过你设置的限制，但如果单元格中实际出现的值没有那么多，则可能创建更少的列。


    另一个适合拆分的候选是 **对象标题** 列。我们看到在某些字段中，标题前面有一个数字。将数字与实际的标题拆分开来会很有趣。首先，让我们过滤掉以数字开头的行。点击
    **对象标题** 下拉菜单，点击 **文本过滤器**。我们需要在这个字段中写入 `starts with a number`，但我们可以用正则表达式 `^\d`
    来表达这一点。这告诉过滤器从开头（`^`）开始查找任意数字（`\d`）。不过别忘了勾选 **正则表达式** 复选框，否则 OpenRefine 会尝试按字面意思查找该表达式。我们现在只能看到以数字开头的标题。


    再次点击 **对象标题** 下拉菜单，导航到 **编辑列 | 拆分为多列....** 现在我们使用单个空格作为分隔符，指出我们希望最多 2 列，然后点击 **OK**。描述编号和标题已移动到单独的列中。


    拆分列远比拆分多值单元格强大，因为你有多种配置选项。你甚至可以使用正则表达式来定义分隔符，这样分隔符可以根据上下文而不同。顺便说一句，如果这个操作让你对正则表达式产生了好奇，别忘了查看
    *附录 A，正则表达式与 GREL*，那里会更详细地介绍它们。


    ## 操作 7 – 行列转置


    有时数据的行列排列方式并不符合你的喜好。确实，安排内容归属的方式多种多样，选择取决于具体情况。例如，在 Powerhouse Museum 数据集中，有多个维度分别占据单独的列：高度、宽度、深度、直径和重量。然而，并没有多少对象在这些列中有数据，因此相对于它们增加的价值，维护它们的成本可能很高。另一种选择是将这五列转换为两列：一列包含维度名称（例如
    高度 或 重量），另一列包含测量值（例如 35mm 或 2kg）。

