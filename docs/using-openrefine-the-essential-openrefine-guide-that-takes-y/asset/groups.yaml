    The second option we can choose is **Auto-match candidates with high confidence**.
    Reconciliation services also return a match score that indicate how confident
    they are that the match is the right one. The auto-match option is on by default,
    and it means that if the score is sufficiently high, OpenRefine will assume it
    has made the right choice and declare it a match. For other cell values (or if
    you have unticked the checkbox), you will have to confirm the match manually.
    Our advice would be to leave this one ticked, as it saves you a considerable amount
    of work.


    The third and final option allows you to send additional data to the reconciliation
    service. Instead of basing the match on a single column value, it is possible
    to consider different columns. For this, you will have to indicate the property
    name. For the Powerhouse Museum dataset, no such other relevant column exists.
    But if you had a dataset of country names with country codes, it could be helpful
    to send both to the reconciliation service.


    With **Reconcile against no particular type** ticked, click on **Start Reconciling**.
    The reconciliation process might take some time, as OpenRefine will now ask the
    reconciliation service to find a URL for each unique cell value. The yellow information
    bar on top of the window will tell you how much has been done.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_82_0.png)


    This might be the moment to take a coffee break or to do another task on your
    computer and let reconciliation run in the background. When the process has finished,
    you will notice that OpenRefine has automatically created a **judgement** and
    a **best candidate''s score** facet for you.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_82_1.png)


    The **judgement** facet allows you to partition the dataset in rows that have
