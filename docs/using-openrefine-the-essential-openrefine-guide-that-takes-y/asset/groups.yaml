    # Quantifiers


    So far, we''ve seen ways in regular expressions to indicate that we want to encounter
    certain characters. However, we cannot yet express if we want to see characters
    a certain number of times without this number being known in advance. For instance,
    how can we say "a number within single quotes"? We could start with '' \d '',
    but that would show us only texts that contain 0, 1, 5, and so on, but not multidigit
    numbers such as 23 or 478. Indeed, computers follow the expression slavishly:
    one single quote, one digit, one single quote.


    **Quantifiers** can express repetition. There are three simple quantifiers: a
    plus sign +, which means one or more times, an asterisk *, which means zero or
    more times, and a question mark ?, which means zero or one time. They only exert
    an effect on the symbol that is directly to the left of them:


    +   - `bre+d` matches texts that contain bred, breed, or breeed with any number
    of e, as long as at least one e is present.

    +   - `bre*d` matches texts that contain brd, bred, breed, or breeed with any
    number of e, even without. Note how brd is matched with the asterisk, but not
    with the plus sign.

    +   - `bre?d` matches brd and bred, but not breed or any other number of es. Put
    simply, it makes the e optional.

    +   - Combinations are also possible. `br?e+d` matches bed, bred, beed, breed,
    beeed, breeed, and so on.

    +   - In addition, you can be explicit about the number of times you would like
    a symbol to occur by using curly braces {min,max}. You can specify the minimum
    and maximum number of times it can occur. Either one can be empty, in which case
    there is no minimum or maximum. Leave the comma in so OpenRefine knows whether
    you specified the minimum or the maximum. If you just supply a single number without
    a comma, the exact number of times will be matched.

    +   - `N\d{5,8}`, matches texts that contain a code that starts with N followed
    by five, six, seven, or eight digits, and then a comma.

    +   - `N\d{5,}`, matches texts that contain a code that starts with N, at least
    five digits, and then a comma.

    +   - `N\d{,8}`, matches texts which contain a code that starts with N, at most
    eight digits, and then a comma.

    +   - `N\d{5}`, matches texts which contain a code that starts with N, exactly
    five digits, and then a comma. This is equivalent to N\d\d\d\d\d but much more
    compact (especially if numbers get large).'
  - '[PAGE 100]


    Needless to say, the quantifiers and braces are special symbols, so if you want
    to match them literally, you should escape them with a backslash. For instance,
    question marks can be matched with \?.


    # Anchors


    Sometimes, you don''t only want to say how many characters to match, but also
    where they should be matched. This is possible with anchors. A caret ^ indicates
    that the match should happen at the beginning of a line, while a dollar sign $
    indicates that the match should stop at the end of a line. (Don''t confuse this
    with the caret inside square brackets to indicate a negation; it has a different
    meaning if it occurs outside of brackets.) Additionally, we can indicate that
    the match should begin or end at a word boundary with the anchor \b:


    +   - ^\d matches all texts that begin with a number.

    +   - \d$ matches all texts that end with a number.

    +   - ^\d.*\d$ matches all texts that begin and end with a number. Read this expression
    as: start of the text, a number, zero or more times any character (the dot), a
    number, end of the text. If we would use ^\d+$ instead, we would have all texts
    that contain only a number (of any length).

    +   - \b\d{3}\b searches for texts that contain at least one number of exactly
    three digits, since the \b anchor matches at word boundaries. If the text contains
    four-digit numbers but no three-digit numbers, it does not match. (If we would
    remove the \b anchors, it would.)

    +   - ^\d{3}\b finds texts that start with a three-digit number.


    # Choices


    We have already seen a mechanism for indicating choices. Square brackets give
    regular expressions the possibility to choose one of the many characters: [a-z123]
    searches for texts with at least one lowercase letter or any of the digits 1,
    2, and 3. Often, the choices are larger, as they can be several letters or words
    long. For this, the or operator | was introduced. It works as an OR operator between
    several alternatives:


    +   - glass|wood|steel will match texts that contain glass, wood, or steel.

    +   - \d+|many|few matches either a number, many or few.

    +   - N\d{5}, |N\d{8}, matches either five-digit or eight-digit numbers that start
    with an N and end with a comma, but nothing in between (so no six-digit numbers
    for instance).'
  - '[PAGE 101]


    # Groups


    The only things we haven''t covered so far are **groups**. If you want to use
    quantifiers on a group of characters instead of on a single character, you have
    to enclose them in parentheses ():


    +   - While `1a+` matches texts that contain `1a`, `1aa`, `1aaa`, and so on, the
    expression `(1a)+` finds texts that contain `1a`, `1ala`, `1alala`, and so on.

    +   - The expression `analyz|se` would match texts that contain `analyz` and texts
    that contain `se`. This is probably not that useful. On the other hand, the expression
    `analy(z|s)e` matches both `analyze` and `analyse`. Note that in this case, this
    is equivalent to `analy[zs]e` because the choice consists of a single letter.
    However, this would not be the case with `analyz(e|ing)`, which would match `analyze`
    and `analyzing`.


    As parentheses have a special meaning, they need to be escaped as well. `\ (`
    and `\ )` match parenthesis literally.


    # Overview


    The following table provides an overview of the special symbols in regular expressions:


    | Symbol | Meaning |

    |---|---|

    | `ABC... abc...` | Match the corresponding letters literally |

    | `123...` | Match the corresponding numbers literally |

    | `[xyz]` | Match one of the characters inside the braces |

    | `[ ^xyz]` | Match any character that is not inside the braces |

    | `[0-9]` | Match one of the characters inside the range |

    | `\d` | Match a digit |

    | `\D` | Match a non-digit |

    | `\w` | Match a letter, number, or underscore |

    | `\W` | Match anything that is not a letter, number, or underscore |

    | `.` | Match any character except a newline |

    | `\n` | Match a newline |

    | `\.` | Match an actual dot (the backslash escapes the next character) |

    | `?` | Match the preceding item zero or one time |

    | `*` | Match the preceding item zero or more times |

    | `+` | Match the preceding item one or more times |'
  - '[PAGE 102]


    | Symbol | Meaning |

    |---|---|

    | {3} | Match the preceding item three times |

    | {3,6} | Match the preceding item three to six times |

    | {3,} | Match the preceding item at least three times |

    | {,6} | Match the preceding item up to six times |

    | ^ | Match at the beginning of the text |

    | $ | Match at the end of the text |

    | \b | Match at a word boundary |

    | cat|dog|cow | Match one of the alternatives |


    # General Refine Expression Language (GREL)


    The true power of regular expressions emerges if we can use them not only for
    finding data, but also for manipulating data. GREL enables that and a lot of other
    functionality as well. It is a simple language designed for easily manipulating
    values. It consists of a set of built-in functions as well as several variables
    that are available through OpenRefine. We''ve briefly touched upon it in several
    recipes and we will show you the way to build your own GREL expressions here.


    # Transforming data


    One place where GREL comes in handy especially is when you need to transform the
    values in your cells. You can either change cells in-place (by navigating to the
    respective column dropdown and then to Edit cells | Transform...) or make a new
    column with the transformed values (by navigating to the respective column dropdown
    and then to Edit column | Add column based on this column...). We will try some
    examples on the Object Title column here.


    When you open any of the transformation dialogs, you see a first GREL expression.
    It is simply called value and gives back the original value of the cell. That
    is not really useful, but we can start from there to learn some tricks. For instance,
    the GREL expression "TITLE: " + value + "." adds the text TITLE: before the value
    and appends a dot to the end. Note that literal text must be surrounded by single
    or double quotes so OpenRefine doesn''t confuse it with commands. You can see
    the preview get updated as you build the expression.'
