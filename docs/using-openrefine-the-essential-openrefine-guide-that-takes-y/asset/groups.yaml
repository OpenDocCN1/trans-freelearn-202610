    ## Summary


    This chapter has introduced recipes for advanced data operations. We have looked
    at multi-valued cells in different ways: when they had values of equal importance,
    we split them across several rows; when they had a different function, we split
    them across columns. We have also seen that OpenRefine has a special mode for
    working with multi-valued cells spread over different rows called **records**
    mode. In **records** mode, multiple rows that belong to the same object can be
    treated as one, giving you powerful search and manipulation options.


    We also introduced you to clustering, which is really helpful if some of your
    cell values need to be consistent but are actually a bit messy. You can even go
    further and define your own transformation operations on cell values, and even
    create a new column based on an existing one. Finally, you have learned how to
    move data flexibly across rows and columns. Therefore, this chapter has given
    you access to the advanced possibilities offered by OpenRefine, which are hidden
    just a little deeper in the interface. By now, you can almost call yourself an
    OpenRefine master.


    ## 4 Linking Datasets


    Your dataset is not an island. Somewhere, related datasets exist, even in places
    where you might not expect them. For instance, if your dataset has a Country of
    Origin column, then it is related to a geographical database that lists the total
    area per country. An Author column in a book dataset relates to a list of authors
    with biographical data. All datasets have such connections, yet you might not
    know about them, and neither does the computer which contains your dataset. For
    instance, the record for The Picture of Dorian Gray might list Wilde, O. as its
    author, whereas a biographical dataset might only have an entry for Oscar Wilde.
    Even though they point to the same person, the string values are different, and
    thus difficult to connect the datasets. Furthermore, it would be really impractical
    to link all possible datasets to each other, as there are a huge number of them.


    Instead, the approach is to find unique identifiers for cell values, and in particular,
    a URL (Uniform Resource Locator). Instead of identifying Oscar Wilde by his name,
    we identify him with a URL such as http://en.wikipedia.org/wiki/Oscar_Wilde. Not
    only does this URL uniquely identify the writer Oscar Wilde (and not other people
    who happen to have the same name), it can also be visited in a browser to find
    more information about him, such as related datasets. Therefore, URLs allow us
    to connect different datasets together. In this chapter, we will learn methods
    to transform field values into URLs of the concepts they identify using the following
    recipes:


    - Recipe 1 – reconciling values with Freebase

    - Recipe 2 – installing extensions

    - Recipe 3 – adding a reconciliation service

    - Recipe 4 – reconciling with Linked Data

    - Recipe 5 – extracting named entities


    As usual, you can go straight to the recipe you''re interested in. However, be
    sure to learn how to install OpenRefine extensions first before you continue to
    the last three recipes. Every recipe starts from the cleaned Powerhouse Museum
    dataset, in which the Categories column has been spread across several rows.


    ### Recipe 1 – reconciling values with Freebase


    When you want to transform your cell values from simple strings to URLs, different
    choices are possible. After all, a given concept can be identified with many URLs
    as there are many pages on the Web about the same topic. This need not be a problem
    as long as each URL unambiguously identifies a single concept. However, we must
    choose which URL we want to use. On the Web, there are many databases of concepts,
    the most well-known being Wikipedia. In addition to databases for humans, there
    are also several databases targeted at machines. One example is Freebase, a collaborative
    knowledge base in which machine-readable facts about virtually every topic are
    stored.


    > Before OpenRefine was called Google Refine, it was owned by Freebase creator
    MetaWeb and called Freebase Gridworks. As a tool for manipulating large datasets,
    it fitted nicely in the Freebase philosophy of making structured data available.


    Therefore, we will reconcile our cell values with Freebase URLs. Since Freebase
    reconciliation is built in OpenRefine, we can try it right away. Note that we''re
    starting from the Powerhouse dataset in which the Categories column has been split
    across rows. This is important, as each cell should contain a single value that
    matches a Freebase topic. A full-text field such as Description is thus not a
    good candidate for reconciliation (it is, however, a good candidate for named-entity
    extraction, as you can see in the last recipe of this chapter).


    To start reconciliation, go to the Categories dropdown and navigate to Reconcile
    | Start reconciling... OpenRefine shows the reconciliation dialog. On the right
    side of the dialog, you see all possible reconciliation services. Two Freebase
    reconciliation services are built-in:


    - **Freebase Query-based Reconciliation**: This is useful if your column values
    are already Freebase IDs (such as `/en/solar_system`) or GUIDs (hexadecimal identifiers).

    - **Freebase Reconciliation Service**: This offers a more general approach for
    terms that are not necessarily related to Freebase identifiers.


    Clearly we are in the second case here, so select **Freebase Reconciliation Service**.
    After some processing, OpenRefine loads the options of this service on the right-hand
    side:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_81_0.png)


    > The services in your OpenRefine installation might be different from the ones
    you see in the screenshot. That''s because you can add reconciliation services
    yourself, as we''ll show you in one of the next recipes.


    There are three options you can set now. First, you have to decide against what
    type of records you want to reconcile. This can restrict the search to specific
    topics, which is handy if your column contains only city or person names for instance.
    This way, reconciliation can happen faster, and there is a lower chance of finding
