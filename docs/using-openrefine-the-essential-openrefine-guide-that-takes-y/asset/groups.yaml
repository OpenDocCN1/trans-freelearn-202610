  - '[PAGE 66]


    # Recipe 3 – clustering similar cells


    Thanks to OpenRefine, you don''t have to worry about inconsistencies that slipped
    in during the creation process of your data. If you have been investigating the
    various categories after splitting the multi-valued cells, you might have noticed
    that the same category labels do not always have the same spelling. For instance,
    there is Agricultural Equipment and Agricultural equipment (capitalization differences),
    Costumes and Costume (pluralization differences), and various other issues. The
    good news is that these can be resolved automatically; well, almost. But, OpenRefine
    definitely makes it a lot easier.


    The process of finding the same items with slightly different spelling is called
    clustering. After you have split multi-valued cells, you can click on the Categories
    dropdown and navigate to Edit cells | Cluster and edit.... OpenRefine presents
    you with a dialog box where you can choose between different clustering methods,
    each of which can use various similarity functions. When the dialog opens, key
    collision and fingerprint have been chosen as default settings.


    After some time (this can take a while, depending on the project size), OpenRefine
    will execute the clustering algorithm on the Categories field. It lists the found
    clusters in rows along with the spelling variations in each cluster and the proposed
    value for the whole cluster, as shown in the following screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_66_0.png)'
  - '[PAGE 67]


    Note that OpenRefine does not automatically merge the values of the cluster. Instead,
    it wants you to confirm whether the values indeed point to the same concept. This
    avoids similar names, which still have a different meaning, accidentally ending
    up as the same.


    Before we start making decisions, let''s first understand what all of the columns
    mean. The **Cluster Size** column indicates how many different spellings of a
    certain concept were thought to be found. The **Row Count** column indicates how
    many rows contain either of the found spellings. In **Values in Cluster**, you
    can see the different spellings and how many rows contain a particular spelling.
    Furthermore, these spellings are clickable, so you can indicate which one is correct.
    If you hover over the spellings, a **Browse this cluster** link appears, which
    you can use to inspect all items in the cluster in a separate browser tab. The
    **Merge?** column contains a checkbox. If you check it, all values in that cluster
    will be changed to the value in the **New Cell Value** column when you click on
    one of the **Merge Selected** buttons. You can also manually choose a new cell
    value if the automatic value is not the best choice.


    So, let''s perform our first clustering operation. I strongly advise you to scroll
    carefully through the list to avoid clustering values that don''t belong together.
    In this case, however, the algorithm hasn''t acted too aggressively: in fact,
    all suggested clusters are correct. Instead of manually ticking the **Merge?**
    checkbox on every single one of them, we can just click on **Select All** at the
    bottom. Then, click on the **Merge Selected & Re-Cluster** button, which will
    merge all the selected clusters but won''t close the window yet, so we can try
    other clustering algorithms as well.


    OpenRefine immediately reclusters with the same algorithm, but no other clusters
    are found since we have merged all of them. Let''s see what happens when we try
    a different similarity function. From the **Keying Function** menu, click on **ngram-fingerprint**.
    Note that we get an additional parameter, **Ngram Size**, which we can experiment
    with to obtain less or more aggressive clustering. We see that OpenRefine has
    found several clusters again. It might be tempting to click on the **Select All**
    button again, but remember we warned to carefully inspect all rows in the list.
    Can you spot the mistake? Have a closer look at the following screenshot:


    | 2 | 12 | • Bookmarks (11 rows)

    • book marks (1 rows) | ☐ | Bookmarks |

    | 2 | 202 | • Shirts (115 rows)

    • T-shirts (87 rows) | ☐ | Shirts |

    | 2 | 3 | • Bonbon dishes (2 rows)

    • Bon bon dishes (1 rows) | ☐ | Bonbon dishes |'
  - '[PAGE 68]


    Indeed, the clustering algorithm has decided that **Shirts** and **T-shirts**
    are similar enough to be merged. Unfortunately, this is not true. So, either manually
    select all correct suggestions, or deselect the ones that are not. Then, click
    on the **Merge Selected & Re-Cluster** button.


    Apart from trying different similarity functions, we can also try totally different
    clustering methods. From the **Method** menu, click on **nearest neighbor**. We
    again see new clustering parameters appear (**Radius** and **Block Chars**, but
    we will use their default settings for now). OpenRefine again finds several clusters,
    but now, it has been a little too aggressive. In fact, several suggestions are
    wrong, such as the **Lockets / Pockets / Rockets** cluster. Some other suggestions,
    such as "Photocopiers" and "Photocopier", are fine. In this situation, it might
    be best to manually pick the few correct ones among the many incorrect clusters.


    Assuming that all clusters have been identified, click on the **Merge Selected
    & Close** button, which will apply merging to the selected items and take you
    back into the main OpenRefine window. If you look at the data now or use a text
    facet on the **Categories** field, you will notice that the inconsistencies have
    disappeared.


    # What are clustering methods?


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_68_0.png)


    OpenRefine offers two different clustering methods, **key collision** and **nearest
    neighbor**, which fundamentally differ in how they function. With key collision,
    the idea is that a **keying function** is used to map a field value to a certain
    key. Values that are mapped to the same key are placed inside the same cluster.
    For instance, suppose we have a keying function which removes all spaces; then,
    A B C, AB C, and ABC will be mapped to the same key: ABC. In practice, the keying
    functions are constructed in a more sophisticated and helpful way.


    Nearest neighbor, on the other hand, is a technique in which each unique value
    is compared to every other unique value using a **distance function**. For instance,
    if we count every modification as one unit, the distance between Boot and Bots
    is 2: one addition and one deletion. This corresponds to an actual distance function
    in OpenRefine, namely `levenshtein`.


    In practice, it is hard to predict which combination of method and function is
    the best for a given field. Therefore, it is best to try out the various options,
    each time carefully inspecting whether the clustered values actually belong together.
    The OpenRefine interface helps you by putting the various options in the order
    they are most likely to help: for instance, trying key collision before nearest
    neighbor.'
  - '[PAGE 69]


    # Recipe 4 – transforming cell values


    In Chapter 2, Analyzing and Fixing Data, we saw that OpenRefine can automatically
    change the contents of all cells in a column, such as trimming whitespace. In
    the previous recipe, we learned that clustering is another method to perform column-wide
    value changes. However, these operations are part of a more general mechanism
    for transforming cell contents. You can change the value of each cell in various
    complex ways. Although this looks a bit like Excel formulas, it is surprising
    to see how much can be done with just a little.


    For instance, suppose you don''t like the vertical bar as a separator in the Categories
    field and want to have a comma followed by a space instead. While this could be
    solved by first splitting the multi-valued cell and then joining it back together,
    we can do this actually in a single transformation step. Click on the Categories
    dropdown and navigate to Edit cells | Transform.... The transformation dialog
    appears as follows:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_69_0.png)'
  - '[PAGE 70]


    The heart of this dialog is **Expression**, a small script that explains OpenRefine
    how each of the values should change. The **Language** list allows us to choose
    the language for the expression, with current support for the **General Refine
    Expression Language (GREL)**, **Jython** (Python implemented in Java), and **Clojure**
    (a functional language that resembles Lisp). If you are familiar with the latter
    two, you might find it easier to write expressions in those languages. However,
    GREL was specifically created with simple transformations in mind, which is why
    we will use it in this book.


    In the **Preview** tab, you see the values of the first few cells before and after
    the transformation. This allows you to iteratively change your transformation
    expression while seeing its result in real time. The **History** tab keeps track
    of expressions that you have used in the past, which is handy to recycle previous
    transformations. Expressions that you use a lot can be starred in the **History**
    tab, which makes them also appear in the **Starred** tab for even faster access.
    Finally, the **Help** tab gives an overview of the most important expression constructs.


    At the bottom of the dialog, you can decide what happens if your expression results
    in an error for a particular cell value. You can opt to keep the value as it was,
    to make the cell blank, or to store the error in the cell. Furthermore, you can
    also choose to apply the transformation expression repeatedly, which can be useful
    if the result of the transformation is to be inspected again. For instance, if
    you have an expression that removes the first word that starts with a capital
    letter, you can repeat it until no words with capital letters are left.


    Back to our mission: changing vertical bars into commas followed by a space. The
    default expression is `value`, but as you might have guessed, this is equivalent
    to the initial cell value. Let''s try a simple example first and see what happens;
    so, enter `1234` as the new cell value. The preview is updated and shows that
    the new value of each cell will now be **1234**. Not very helpful, but you get
    the idea. What we actually want is to start from the original value and perform
    some replacements. In the **Help** tab, we can see that the corresponding GREL
    function for this is called `replace`. Since we want to replace vertical bars
    by commas, we enter the expression `value.replace("|", ", ")`. Note that we add
    quotation marks around the characters since they are strings, not numbers. The
    preview gets updated with the new cell values and the result is indeed what we
    expect, so we click on **OK**. In an amazingly short timespan, OpenRefine has
    transformed all cells in the **Categories** column, and all the vertical bars
    are now gone.


    > Always be careful when you change separators, because this can have unintended
    side-effects if the new separator occurs as part of the value. In fact, this is
    also the case here: the category **Cup, saucer and plate sets** contains a comma.
    So, if the field is to be processed again, this will likely cause mistakes. However,
    we will continue here with the comma for the sake of example.'
