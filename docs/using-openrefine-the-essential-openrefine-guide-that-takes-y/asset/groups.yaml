    10 25 50行”右侧）并点击“永久重新排序行”来使重新排序永久生效。如果你忘记重新排序行，后续操作将忽略排序并产生意外结果。


    现在行已按ID排序，重复项必然会被分组在一起，因此我们可以导航到 **Record ID | Edit cells | Blank down**，将重复行的ID替换为空白（每个原始行都会保留其ID，只有后续行会失去ID）。通过导航到
    **Record ID | Facet | Customized facets | Facet by blank** 对空白行进行分面，将显示86个冗余行（如果你已经删除了空白行，则可能是84个），其中包括每对中的一个、三个一组中的两个以及六个一组中的五个。这86行是真正的重复项，不包括需要保留的原始行，我们将在*配方6
    – 删除匹配行*中学习如何删除它们。


    ## 配方4 – 应用文本过滤器


    在本配方中，你将了解允许你搜索显示某些模式值的过滤器。


    当你想要查找匹配特定字符串的行时，依赖简单的文本过滤器比使用繁琐的方面（facet）更容易。让我们从一个简单的例子开始。假设你想要筛选所有与美国相关的标题。导航到
    **Object Title | Text filter**，观察过滤器框在左侧打开，与方面出现的选项卡相同。现在输入USA。OpenRefine会告诉你共有1,866行匹配。选中**区分大小写**复选框，以消除偶然匹配，例如karakusa和Jerusalem，这样我们就减少到1,737行：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_50_0.png)


    尽管如此，我们仍不能确定这些匹配中没有剩余噪声；例如，可能存在全大写的JERUSALEM。为了解决这个问题，我们可以尝试在USA两侧添加空格，但这样可能会丢失诸如[USA]或/USA等情形，以及标题开头或结尾的出现。事实上，仅带空格的过滤器USA只返回172个匹配，约占USA所有出现次数的十分之一，这造成了大量漏检。


    另一方面，我们简单的文本过滤器没有考虑到诸如U.S.A.（201个匹配）、U S A（29个匹配）或U.S.A（22个匹配）等拼写。跟踪所有变体很快就会变成一场噩梦，你需要逐条对行进行星标，以便稍后将它们全部组合在一起。


    这就是正则表达式登场的时候。正则表达式（通常被称为regex）非常强大，但在有效使用之前，它们需要对其特殊语法有基本的理解。例如，像\bU.?S.?A\b这样的表达式（选中正则表达式框）将匹配所有前面提到的相关情况，同时排除有问题的情形，并返回1,978个匹配行。


    本配方不打算教你如何掌握正则表达式，但附录“正则表达式和GREL”将为你解释基础知识。


    我们可以用文本过滤器做的另一件有用的事情是检查分隔符的适用性。在Categories列中，管道字符（|）用于分隔类别。让我们在该列上添加一个文本过滤器，先输入一个单独的管道。OpenRefine显示71,105个匹配行，这意味着大多数对象至少用两个类别来描述（因为单个类别不需要管道分隔符）。


    现在添加第二个管道以得到||；检测到九个有问题的行包含双管道而不是单管道。在第3章“高级数据操作”中，我们将看到如何使用GREL来修复此问题。另一个问题是单元格以管道开头或结尾，但找到它们也需要使用正则表达式，因此这必须等到附录“正则表达式和GREL”。


    ## 配方5 – 使用简单的单元格转换


    在本配方中，你将学习如何使用OpenRefine的内置转换来修改数据的子集。


    在使用方面和过滤器时，我们基本上是以各种方式显示数据，但并没有真正影响它们。现在终于到了修改数据的时候了，这意味着进入强大的**Edit cells**菜单。虽然我们已经使用**Blank
    down**来检测重复项，但其他转换（例如拆分和合并多值单元格，或聚类和编辑值）更为高级，因此我们将把它们的讨论推迟到下一章。其他转换则更容易掌握；不过，我们现在将重点放在**Common
    transforms**子菜单中可用的转换，如下面的截图所示：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_52_0.png)


    **修剪字符串开头和结尾的空白**是提高数据质量的良好第一步。这将确保相同的值不会仅仅因前导和尾随空白而不同（这可能很难检测），从而使数据更加一致。它还有助于通过消除不必要的字符来减小数据集的规模；虽然一个小空格占不了多少空间，但几千个空格就可能产生影响并造成隐藏的破坏。还记得那些仅因单个空白字符而被归类为非数字的空白值吗？


    唯一标识符也不应包含空格；让我们通过导航到 **Registration Number | Edit cells | Common transforms |
    Trim leading and trailing whitespace** 来检查一切是否正常。2,349个单元格受到此操作的影响，这意味着它非常必要。请注意，我们不能对Record
    ID列执行相同操作，因为修剪仅适用于字符串，不适用于整数；结果将是删除所有ID！


    **连续空白**在快速输入时也很常见，我们预计会在诸如对象标题或描述等长文本字段中找到一些。令人惊讶的是，这些列中并没有发现连续空白，而在**Production
    Date**列上运行**Collapse consecutive whitespace**却显示有7,671个值受到影响，但这些大多是整数被转换为字符串。请务必自己在其他列上尝试这两种转换；它们是安全的，只会对你的数据有益。


    如果你的数据是从某个Web应用程序导出的，那么它们很可能包含**超文本标记语言（HTML）**代码。在HTML中，特殊字符通过数字或被称为HTML实体的自定义快捷方式来进行转义（即保护）。例如，法语字符é（带尖音符的e）将根据所使用的范式编码为`&#233;`或`&eacute;`。


    虽然这些在Web上有助于避免浏览器中的编码问题，但当它们没有被正确反转义时（例如，反转义`&eacute;`意味着将其转换回é），可能会使阅读变得困难。因此，如果你发现某些值以与号（&）开头并以分号（;）结尾，请转到
    **Edit cells | Common transforms | Unescape HTML entities**，然后观察你的数据被转换为可读的内容。


    '
