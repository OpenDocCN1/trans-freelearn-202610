  - '[PAGE 63]


    # Recipe 2 – alternating between rows and records mode


    Now let''s have a look at how OpenRefine gives you access to multi-valued cells.
    When we follow the instructions of the previous recipe to split a column''s values,
    we see that OpenRefine does two things. On one hand, it takes the first of the
    different values of a cell and puts it in the original row. On the other hand,
    it takes each of the remaining values and puts all of them in a cell of their
    own on an otherwise empty row. For instance, in the following screenshot, you
    can see that the record with ID 9 has been stretched out over three rows, each
    of which contains a category name. Only the first category is on a row that contains
    the other values of the field; the others are empty except for the category value
    (some columns have been hidden for clarity).


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_63_0.png)


    A row is a single line of data in your dataset.


    A record consists of all rows that belong to a single object. The first row of
    a record starts with non-null cells that identify the record; in subsequent rows,
    those identifying values are blank to indicate they belong to the same record.'
  - '[PAGE 64]


    # Advanced Data Operations


    While this avoids duplication of information and the errors that can occur because
    of that, it makes it difficult to see which categories belong to which object.
    For instance, if we create a text facet on **Categories** (see the previous recipe),
    we can click on each of the category names within the facet to see the rows that
    contain this category. However, if we do this, we will see a lot of empty rows:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_64_0.png)


    The reason for this is that OpenRefine indeed shows us all the rows where the
    category value is **Numismatics**, which includes the empty rows for all those
    objects where **Numismatics** was not the first category. However, it does not
    include the other rows that belong to the same object. This poses a problem if
    we are interested in all the rows of an object. For instance, we might want to
    star all objects in the **Numismatics** category so we can perform operations
    on them. Let''s try this now and see what happens.


    With **Numismatics** highlighted in the text facet, click on the **All** dropdown
    and navigate to **Edit rows | Star rows**. Now click on **reset** on the facet
    to see what has happened. We notice that only the rows with **Numismatics** in
    them are starred, but not the rows of the object to which these rows belong. Clearly
    we are missing something. So, let''s undo the starring operation by reverting
    to the previous state from the **Undo / Redo** tab.


    OpenRefine allows you to treat all rows that belong to the same object as a single
    **record**. That way, you have the benefits of splitting multi-valued cells to
    different rows while still being able to treat them as a whole. To switch to records
    mode, change the **Show as** setting on the top bar from **rows** to **records**.
    You will notice immediately that the alternate coloring scheme of OpenRefine changes.
    Instead of shading every other row, it now shades every other record, depending
    on the number of rows per record.'
  - "[PAGE 65]\n\nIf we apply the **Numismatics** filter from the **Categories** facet\
    \ now, while still in **records** mode, we see that all the fields of objects\
    \ within the **Numismatics** category are selected instead. If we star those records\
    \ using the **All** dropdown now, by navigating to **Edit rows | Star rows**,\
    \ we see that all rows belonging to the object become starred:\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_65_0.png)\n\
    \nThis indicates that, while in **records** mode, all operations happen on the\
    \ entire record for which at least one row is matching. To summarize, we can say\
    \ that **rows** mode shows you all individual rows that match your selection criteria,\
    \ whereas **records** mode shows you all objects that have a matching row.\n\n\
    > **Matching records that fit multiple criteria**\n> \n> What if we want to match\
    \ all records that are in the category **Numismatics** and also in the category\
    \ **Medals**? To do this, we make sure that we are in **records** mode and we\
    \ add a second text facet on the **Categories** field. In the first facet, we\
    \ select **Numismatics**, and in the second facet, we select **Medals**. We now\
    \ see all the records that are in both categories.\n> \n> Now what happens if\
    \ we switch back to **rows** mode? Suddenly, zero records are matching our selection.\
    \ This seems strange at first, but it is actually pretty logical: no single row\
    \ has a category which is equal to **Numismatics** and **Medals** at the same\
    \ time; each row contains at most one of these two. Therefore, complex selections\
    \ such as this one should be made in **records** mode.\n\nAlso, make sure you\
    \ are back in **rows** mode for the other recipes in this book, or you might get\
    \ totally unexpected results. If something inexplicable happens, always check\
    \ first whether you are in the correct mode. This can save you a lot of headaches."
