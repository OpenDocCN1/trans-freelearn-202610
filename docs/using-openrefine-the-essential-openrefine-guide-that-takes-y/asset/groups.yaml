    然而，OpenRefine 还提供了一些自定义分面；这些是预定义的自定义分面，已被证明对许多用户来说具有常见用途。接下来，我们将浏览这些分面，特别关注其中最有用的几个。首先让我们快速查看一下自定义分面子菜单，该子菜单可以从任何列访问：


    | 单词分面 |

    | 重复项分面 |

    | 数值对数分面 |

    | 1-有界数值对数分面 |

    | 文本长度分面 |

    | 文本长度对数分面 |

    | Unicode 字符代码分面 |

    | 按错误分面 |

    | 按空白分面 |


    **单词分面**列出字段中使用的所有不同单词，而单词被简单定义为两个空白字符之间的文本字符串。你可能会想在数据的子集上尝试此功能，因为选项数量可能迅速变得非常庞大；例如，对**描述**列使用单词分面会显示
    212,751 个不同的单词，这肯定会让应用程序崩溃。


    单词分面可用于细化你的类别列表。例如，简单文本分面会告诉你有多少对象被描述为“鸡尾酒裙”，而单词分面会将该类别拆分为两个词，让你可以分别浏览各种连衣裙，以及另一边与鸡尾酒（例如鸡尾酒杯）相关的对象。


    **重复项分面**允许你检测重复值；因此我们将把它留到下一个技巧中。


    **数值对数分面**是显示数字对数而非实际值的快捷方式，如果你的数据遵循幂律分布，这将非常有用。**1-有界数值对数分面**与之相同，只是它不接受小于 1
    的值。


    ## 分析和修复数据


    **文本长度分面**根据某个字符串中包含的字符数来组织对象，例如**对象标题**。在该列菜单中导航到**分面 | 自定义分面 | 文本长度分面**，你将看到标题长度从
    0 到 260 个字符。然后你可以关注 92 个短于 10 个字符的标题（在大多数情况下不超过一个词，而且信息量不大），或 2007 个长于 250 个字符的标题（这些标题通常与描述重复）。


    说到描述，对其长度的分析也很值得关注，但分布范围太大（从 0 到 4,100 个字符，尽管 85% 的描述短于 500 个字符），因此很难理解。这时，文本长度对数分面（见下图）便派上了用场，它提供了更清晰的图表：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_46_0.png)


    **Unicode 字符代码分面**不是计算字符串长度，而是列出字符串中使用的所有字符。例如，在**对象标题**列上试试；大多数英文字符的字符代码在 128
    以下，但其他欧洲语言中的带重音字母可以达到 256，甚至更高，例如阿拉伯语或中文字符。不过，如果你注意到高得可疑的值，这可能意味着 OpenRefine 没有正确识别你的数据集的编码。在这种情况下，请重新开始一个新项目并手动选择正确的编码。


    最后，你可以按错误对数据进行分面（假设数据包含错误），或者按空白进行分面。最后这个选项非常有用，可以了解某个字段在集合中的填充比例，并且通常可以与另一个分面结合使用。快速查看**标记**列，可以看到前几个单元格是空的，因此我们可导航到**分面
    | 自定义分面 | 按空白分面**以进一步了解。此分面告诉我们，18,968 个值为 false（即非空白），56,846 个值为 true（即空白）。换句话说，只有四分之一的对象在文件中有一些标记描述。


    更值得注意的是，**重量**列（在右侧，使用水平滚动条查看）只填充了 179 个对象，在 99.998% 的情况下都是空白的。对对象标题按空白分面显示，有
    118 条记录是虚假的；它们有一个记录 ID，以及一个基于此 ID 的持久链接和一些伪造的许可信息，但其他所有列都是空的，因此它们并不真正指向一个对象。


    ## 按星标或旗标分面


    在*第 1 章：深入探索 OpenRefine*中，我们简要提到了左侧特殊**全部**列中星标和旗标的存在。现在该来看看如何利用它们以有意义的方式对数据进行分面。星标可用于标记好的行或你希望选中的收藏行，以便稍后返回查看；相反，旗标可用于指示需要进一步特别关注的问题行或错误行。请注意，这只是一个建议；你也可以赋予星标和旗标完全不同的含义。


    要标记或旗标单个行，只需单击左侧对应的符号。然而大多数时候，你会希望一次性标记多行。为此，你首先需要在显示中隔离这些行，通常可以使用另一个分面。例如，你可以通过转到**登记号**列菜单并导航到**分面
    | 自定义分面 | 按空白分面**来检测空行，然后点击左侧的**true**，仅显示 118 个匹配（空）行。要全部标记为旗标，请打开**全部**列菜单并导航到**编辑行
    | 旗标行**。星标操作同理，你也可以在同一菜单中对多行取消旗标或取消星标。


    现在假设你想显示那些具有直径或重量信息的行。如果同时对这两列按空白分面并点击两次 false，你最终只会得到 29 个匹配行，它们对应于数据集中同时具有直径和重量记录的对象。要实现我们想要的，解决方案分两步进行：对“直径”列按空白分面，选择标记为
    false 的 2106 行（即具有直径的行），并通过“全部 | 编辑行 | 星标行”为它们添加星标。清除分面，然后对“重量”列中的 179 行重复这些步骤（你可能会注意到实际只有
    150 行被星标，因为其余 29 行已经具有两项测量值，因此已被星标）。再次清除分面，并通过导航到“全部 | 分面 | 按星标分面”来显示我们正在寻找的内容。当然，旗标操作也同样适用。


    呼，我们终于到达了这个长技巧的终点！也许感觉有些不成比例，但分面确实是 OpenRefine 的基础，所以这是值得的。


    ## 技巧3 —— 检测重复项


    在本技巧中，你将了解什么是重复项、如何发现它们以及为什么这很重要。


    我们在前一个技巧中唯一没有提到的自定义分面类型是重复项分面。重复项是令人讨厌的记录，它们在数据集中出现了两次（或更多）。保留完全相同的记录会浪费空间并可能产生歧义，因此我们会希望移除这些重复项。这个分面是检测它们的一种简单方法，但它有一个缺点：它只对文本字符串有效，至少直接使用是这样（要了解如何调整它使其也适用于整数，请参阅附录“正则表达式和
    GREL”）。


    真遗憾，我们不能在“记录 ID”列上使用重复项分面。次优的选择是在“登记号”上运行它，登记号是集合中对象的内部分类，尽管它们不如 ID 可靠，因为对集合管理者来说它们具有外在意义。无论如何，让我们尝试一下，导航到“登记号
    | 分面 | 自定义分面 | 重复项分面”；281 行被标记为重复项，我们可以通过点击左侧分面中的 true 来显示它们。


    现在向下滚动几行查看这些重复项。我们发现了一个问题；重复项分面包含了所有空白行，这些行本身确实是相同的，但它们并不是对象的重复项，因为它们不代表任何对象。要排除这
    118 个空行，我们需要另一个分面，可通过“登记号 | 分面 | 自定义分面 | 按空白分面”访问。点击 false 以保留 163 个真正的重复项，并注意上方的第一个分面会自动刷新。

    '
