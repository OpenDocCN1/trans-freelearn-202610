    # Linking Datasets


    A final option is to create a new topic for the cell value by clicking on the
    **Create new topic** link, or by choosing the **New Topic** button from the **Search
    for Match** dialog. This will not create a new URL in the LCSH dataset (as you
    don''t have the permission to do that), but it will mark the cell value as **new**.
    This will enable you to select all those cells in the **judgement** facet so you
    will be able to do something else with them. For instance, you could reconcile
    all new values with another dataset to see if you find matches there.


    You''ll probably wonder how you can get the URLs that reconciliation has brought
    us. Yet, at the same time, we still want to keep the original category names.
    So, the right way to do this would be to create a new column based on the **Categories**
    column as we''ve done before. Click on the **Categories** dropdown and navigate
    to **Edit Column | Add column based on this column...**. We will call this column
    `Category URLs`. The expression that transforms the reconciled cell to its URL
    is `cell.recon.match.id`. This piece of GREL selects the cell, takes its reconciliation
    information, gets out the accepted reconciliation match, and extracts the ID (the
    URL in this case). The cells that do not have a match will result in an error,
    so make sure that for error, the **set to blank** option is chosen. After clicking
    on OK, you will see a new column with the corresponding URLs.


    When you''re done with the reconciliation process and have extracted the URLs
    that you need, you might want to give the **Categories** column back its old appearance.
    After all, the reconciliation data is still there and this can be distracting.
    To clear it, go to the **Categories** dropdown one more time, navigating to **Reconcile
    | Actions | Clear reconciliation data**. The categories column is now a regular
    column again. Additionally, you can remove the facets by clicking on **Remove
    All** on top of the left sidebar.


    # Recipe 5 – extracting named entities


    Reconciliation works great for those fields in your dataset that contain single
    terms, such as names of people, countries, or works of art. However, if your column
    contains running text, then reconciliation cannot help you, since it can only
    search for single terms in the datasets it uses. Fortunately, another technique
    called `named-entity extraction` can help us. An extraction algorithm searches
    texts for named entities which are text elements, such as names of persons, locations,
    values, organizations, and other widely-known things. In addition to just extracting
    the terms, most algorithms also try to perform disambiguation. For instance, if
    the algorithm finds Washington in a text, it will try to determine whether the
    city or the person is mentioned. This saves us from having to perform reconciliation
    on the extracted terms.'
  - '[PAGE 91]


    OpenRefine does not support named-entity recognition natively, but the Named-Entity
    Recognition extension adds this for you. Before continuing with this recipe, download
    the extension from `http://software.freeyourmetadata.org/ner-extension/` and follow
    the *Installing extensions* recipe. If the installation was successful, you are
    greeted by the **Named-entity recognition** button in the top-right of your screen
    after restarting OpenRefine.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_91_0.png)


    > For this recipe, you might want to start from the dataset where the categories
    have not been split over several rows, as named-entity recognition will create
    new rows if multiple terms have been found for a single record. That can become
    confusing if you already have multiple rows per record.


    Looking at the Powerhouse Museum dataset, we see that the **Descriptions** column
    is a good candidate for named-entity extraction as it contains running text. If
    we want to link this field to other datasets, we must extract entities first.
    To do this, click on the **Descriptions** dropdown and choose **Extract named
    entities…** at the bottom. The **Extract named entities** dialog appears on your
    screen.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_91_1.png)'
  - '[PAGE 92]


    The extension itself does not contain any named-entity recognition algorithms
    but uses existing services instead, just like the reconciliation functionality
    also relies on external reconciliation services. This allows you to choose the
    services that you prefer. However, in contrast with the reconciliation services,
    which are open, some of the named-entity recognition services require that you
    create an account. While all supported services have a free option, some of them
    also offer premium accounts that give you additional benefits, such as faster
    or unlimited extraction.


    The DBpedia Spotlight service does not require an account, and is thus already
    available. Therefore, tick on its checkbox in the dialog and choose Start extraction.
    OpenRefine will now start the extraction process, which can take some time. Therefore,
    as we explained before, it might be interesting to try the extraction on a subset
    first. Premium services might offer faster extraction. However, if you tick on
    multiple checkboxes to perform the extraction with multiple services at once,
    the extraction is only as fast as the slowest service.


    When named-entity recognition has finished, you see that OpenRefine has created
    a new column next to the Description column called DBpedia Spotlight.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_92_0.png)


    In this new column, you see the extracted terms. If multiple terms were found,
    they are split across several rows, so you can switch between the rows and records
    modes of OpenRefine. The screenshot shows that DBpedia Spotlight found two terms
    in record 162, no terms in record 173, and one term in record 184. As you can
    see, the terms are displayed in blue, indicating that they are in fact links.
    For instance, if you click on Leeds Town Hall, you arrive at a page about this
    building with links to related resources. This is Linked Data at its best; what
    used to be a human-only text field now has machine-interpretable links to the
    concepts it contains.'
  - '[PAGE 93]


    However, you might be disappointed to see that not all cell values have associated
    terms. So, let''s see if other services do a better job. For that, we have to
    add our account information for each of those services. To do this, click on the
    Named-entity recognition button in the top-right and choose Configure API keys....
    The following dialog shows you the supported services and the configuration parameters
    they require:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_93_0.png)


    For instance, if you want to perform named-entity recognition with Zemanta, add
    your Application programming interface (API) key to the corresponding field. If
    you don''t have an API key yet, click on the configuration instructions link.
    This will take you to a page that lists the steps to obtain an API key with Zemanta.
    All services have a free option, so you can just register for an account to try
    out the service on your data. In addition to that, some services can be configured
    with additional parameters that determine the service''s functionality. The configuration
    instructions can be very helpful here.'
  - '[PAGE 94]


    When you have configured additional services and have tried named-entity extraction
    on the **Description** column again, you will now be able to select multiple services
    at once. The results of each separate service will be added to a new column, so
    you could have additional **Zemanta** and **AlchemyAPI** columns, each of which
    will contain extracted terms. Depending on the dataset, you might have more success
    with one service or another, so be sure to experiment!


    # Summary


    In this chapter, we have seen how your dataset can be transformed from an isolated
    island into a connected collection of data. On one hand, you can perform reconciliation
    on columns that contain simple field values. Therefore, the text in the cells
    is given meaning by adding a URL to it which can be looked up online. You can
    either use the built-in Freebase reconciliation or install the RDF extension which
    allows reconciliation against Linked Data sources. On the other hand, you can
    perform named-entity recognition on cells that contain flowing text, again with
    an extension. This lets OpenRefine search for concepts inside the cell values,
    and it will try to find a URL for each of them. In the end, your dataset becomes
    enriched with links to other datasets, which is a valuable asset when you''re
    publishing your dataset on the Web.'
