    process every time? Not if you make clever use of facets! We tend to try reconciliation
    first on a small part of the dataset and then decide whether we want to run it
    on all rows. To make a more or less random selection, we can for instance add
    a text filter on the Record ID column and enter a digit such as 4. Given an equal
    distribution of digits in all IDs, this would select about 10 percent of the rows.
    If that''s still too much, just keep adding digits until the number of rows has
    come down to a few hundred. For instance, 413 did the trick for us.


    # Recipe 2 – installing extensions


    While OpenRefine allows you out-of-the-box to add new reconciliation services,
    these are only services that work in a certain way under the hood. However, there
    are several other types of services out there, and if you want to use them, you
    will need to add some functionality to OpenRefine in the form of extensions. So,
    before we can show you how to add those services, we first have to explain how
    to install OpenRefine extensions. Not all extensions offer reconciliation services,
    so this recipe describes the general installation procedure. At the time of writing,
    several OpenRefine extensions are available, including the following points:


    +   - The RDF extension by Digital Enterprise Research Institute (DERI), which
    adds support for RDF export and reconciliation with SPARQL endpoints. We''ll explain
    both terms in the next recipe.

    +   - The Named-Entity Recognition (NER) extension written by one of the authors
    of this book, which allows you to extract URLs from full-text fields. Usage of
    this extension is covered in detail in the last recipe of this chapter.'
  - '[PAGE 84]


    Like OpenRefine, all extensions are available freely. An up-to-date list of available
    extensions is maintained at https://github.com/OpenRefine/OpenRefine/wiki/Extensions,
    which also includes their download locations. As the extensions are very diverse,
    it might look tricky to install them. However, this recipe will show you the technique
    to install any extension.


    First, you will have to find the path where extensions need to be installed. This
    depends on your operating system, but OpenRefine can help you find it. At the
    bottom of the starting page, there is a link called Browse workspace directory.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_84_0.png)


    If you click on this link, you will end up in the OpenRefine application folder
    (at least on Windows and Mac; for Linux, read on). In this folder, you have to
    create a new folder called extensions if it doesn''t exist yet. This will be the
    path in which you need to add the extensions. For the different operating systems,
    it should look like the following points:


    +   - Windows: C:\Documents and Settings\(your username)\Application Data\OpenRefine\extensions
    or possibly in the Local Settings folder instead at C:\Documents and Settings\(your
    username)\Local Settings\Application Data\OpenRefine\extensions

    +   - Mac OS X: /Users/(your username)/Library/Application Support/OpenRefine/extensions
    or, starting from your home folder, in /Users/(your username)/Library/Application
    Support/OpenRefine/extensions

    +   - Linux: /home/refine/webapp/extensions'
