  - '[PAGE 39]


    In this recipe, we will explore the various ways of faceting data depending on
    their values and on your needs: text facets for strings, numeric facets for numbers
    and dates, a few predefined customized facets, and finally how to use stars and
    flags. Most of the power of OpenRefine lies in the ability to combine these different
    types of facets.


    # Text facets


    If your dataset has a column containing cities or country names, for instance,
    you will want to see at a glance what the different values are for that field
    and the number of occurrences for each one. This is exactly what text facets are
    for. Of course, faceting is only useful when a limited number of choices are at
    hand; it does not make sense to list all the object titles or descriptions, as
    it is very unlikely that they will appear twice (except in the case of duplicates,
    which will be dealt with in the next recipe).


    The best candidate for text faceting in the Powerhouse collection is obviously
    the Categories column, as it contains keywords from a controlled vocabulary (called
    the Powerhouse museum Object Name Thesaurus, if you are curious). To put it simply,
    categories are a set of a few thousand terms used to describe the objects in the
    collection.


    So, let''s try to get an overview of these categories by navigating to Facet |
    Text facet in the Categories column menu. The result of this facet appears in
    the Facet/Filter tab on the left of the screen. Too bad; OpenRefine informs us
    that there are a total of 14,805 choices, which is far too much to display for
    memory''s sake. In fact, the default upper bound for facet choices is only 2,000.
    We could attempt to get over this limitation by clicking on the Set choice count
    limit link and raising the upper limit to 15,000, for instance, but beware that
    this is likely to slow down the application, especially if you did not change
    the default RAM allocation (refer to Recipe 7 – going for more memory, of Chapter
    1, Diving Into OpenRefine).


    > If you choose to raise the limit in the pop-up window, what OpenRefine really
    does is change the value of a Java variable called ui.browsing.listFacet.limit.
    While in most cases you will not need to bother about this barbaric name, it might
    come in handy if you realize that you increased the value too much and want to
    get it down again. In fact, OpenRefine will always offer to step up when the choice
    count overshoots the mark, but never the opposite. To do that, go to the system
    preferences at http://127.0.0.1:3333/preferences, edit the preference with key
    ui.browsing.listFacet.limit, and set its value to something smaller. To go back
    to the default 2000 value, you can also delete this preference altogether.'
