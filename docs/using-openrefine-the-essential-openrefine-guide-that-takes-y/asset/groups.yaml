    Clearly, 79 cells out of a total of 75,814 is not a lot, but a timeline facet
    on these values would still show objects created on a given date range from 26
    February, 1880 to 31 January, 1952, while most values are either not time expressions
    (19,820) or blank (55,915).


    The following screenshot shows what can be obtained with a timeline facet on the
    **Production Date** column after converting dates to OpenRefine''s internal time
    format:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_44_0.png)


    Finally, scatterplot facets allow for a graphical representation of numerical
    values. We won''t go into the details of this particular facet, but do try it
    yourself if you are curious about it.


    ## Customized facets


    We have now seen the two main types of facets, text facets and numeric facets,
    but many more of them exist, and you could think of almost any way of faceting
    the data depending on your needs. Custom facets allow you to do just that; defining
    your own facets, whether text ones (for instance, faceting on the first character
    of a string), or numeric ones (for instance, faceting on the square root of a
    number). However, they require a basic understanding of the **General Refine Expression
    Language (GREL)**, which will be introduced in *Appendix, Regular Expressions
    and GREL*.

