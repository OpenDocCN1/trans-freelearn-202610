    # 食谱 3 – 聚类相似单元格


    得益于 OpenRefine，你不必担心在数据创建过程中溜进来的不一致性。如果你已经在拆分多值单元格后调查了各个类别，你可能会注意到相同的类别标签并不总是拼写相同。例如，有
    Agricultural Equipment 和 Agricultural equipment（大小写差异），Costumes 和 Costume（单复数差异），以及各种其他问题。好消息是，这些问题可以自动解决；好吧，几乎可以。但
    OpenRefine 确实让它变得容易得多。


    寻找拼写略有不同的相同项目的过程称为聚类。在拆分多值单元格后，你可以点击 Categories 下拉菜单并导航到 Edit cells | Cluster
    and edit.... OpenRefine 会为你呈现一个对话框，你可以在其中在不同的聚类方法之间进行选择，每种方法都可以使用各种相似度函数。当对话框打开时，key
    collision 和 fingerprint 已被选为默认设置。


    过了一段时间（这可能需要一段时间，具体取决于项目大小），OpenRefine 将在 Categories 字段上执行聚类算法。它按行列出找到的聚类以及每个聚类中的拼写变体和整个聚类的建议值，如以下屏幕截图所示：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_66_0.png)


    请注意，OpenRefine 并不会自动合并聚类的值。相反，它希望你确认这些值是否确实指向同一个概念。这避免了相似名称但含义仍然不同而意外合并的情况。


    在开始做决定之前，让我们先了解所有列的含义。**Cluster Size** 列指示被认为找到的某个概念的不同拼写数量。**Row Count** 列指示包含其中任一找到拼写的行数。在
    **Values in Cluster** 中，你可以看到不同的拼写以及包含特定拼写的行数。此外，这些拼写是可以点击的，因此你可以指出哪个是正确的。如果你将鼠标悬停在拼写上，会出现一个
    **Browse this cluster** 链接，你可以使用它在单独的浏览器标签页中检查聚类中的所有项目。**Merge?** 列包含一个复选框。如果你勾选它，所有该聚类中的值都将在你点击
    **Merge Selected** 按钮之一时更改为 **New Cell Value** 列中的值。你也可以手动选择新的单元格值，如果自动值不是最佳选择的话。


    那么，让我们执行第一次聚类操作。我强烈建议你仔细滚动浏览列表，以避免将不属于一起的值聚类。在这种情况下，算法并没有过于激进：事实上，所有建议的聚类都是正确的。与其在每一个上手动勾选
    **Merge?** 复选框，我们可以简单地点击底部的 **Select All**。然后，点击 **Merge Selected & Re-Cluster**
    按钮，这将合并所有选定的聚类，但不会关闭窗口，因此我们也可以尝试其他聚类算法。


    OpenRefine 立即使用相同的算法重新聚类，但由于我们已经合并了所有聚类，因此没有找到其他聚类。让我们看看当我们尝试不同的相似度函数时会发生什么。从
    **Keying Function** 菜单中，点击 **ngram-fingerprint**。请注意，我们获得了额外的参数 **Ngram Size**，我们可以尝试它以获得更少或更激进的聚类。我们看到
    OpenRefine 又找到了几个聚类。可能会很诱人再次点击 **Select All** 按钮，但请记住我们警告过要仔细检查列表中的所有行。你能发现错误吗？请仔细查看以下屏幕截图：


    | 2 | 12 | • Bookmarks (11 rows) • book marks (1 rows) | ☐ | Bookmarks |

    | 2 | 202 | • Shirts (115 rows) • T-shirts (87 rows) | ☐ | Shirts |

    | 2 | 3 | • Bonbon dishes (2 rows) • Bon bon dishes (1 rows) | ☐ | Bonbon dishes
    |


    确实，聚类算法决定 **Shirts** 和 **T-shirts** 相似到足以合并。不幸的是，这是不正确的。因此，要么手动选择所有正确的建议，要么取消选择不正确的建议。然后，点击
    **Merge Selected & Re-Cluster** 按钮。


    除了尝试不同的相似度函数外，我们还可以尝试完全不同的聚类方法。从 **Method** 菜单中，点击 **nearest neighbor**。我们再次看到新的聚类参数出现（**Radius**
    和 **Block Chars**，但我们目前将使用其默认设置）。OpenRefine 又找到了几个聚类，但现在，它有点过于激进了。事实上，几个建议是错误的，例如
    **Lockets / Pockets / Rockets** 聚类。一些其他建议，例如 "Photocopiers" 和 "Photocopier"，是可以的。在这种情况下，最好手动挑选出少数正确的建议，而不是众多不正确的聚类。


    假设所有聚类都已识别，点击 **Merge Selected & Close** 按钮，这将对选定的项目应用合并并带你返回到主 OpenRefine 窗口。如果你现在查看数据或在
    **Categories** 字段上使用文本分面，你会注意到不一致性已经消失。


    ## 什么是聚类方法？


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_68_0.png)


    OpenRefine 提供了两种不同的聚类方法，**key collision** 和 **nearest neighbor**，它们在功能上根本不同。对于
    key collision，想法是使用一个 **keying function** 将字段值映射到某个键。映射到相同键的值被放在同一个聚类中。例如，假设我们有一个
    keying function 去除所有空格；那么，A B C、AB C 和 ABC 将被映射到同一个键：ABC。在实践中，keying functions
    的构造方式更为复杂和有帮助。


    Nearest neighbor 另一方面是一种技术，其中每个唯一值都使用 **distance function** 与每个其他唯一值进行比较。例如，如果我们将每次修改计为一个单位，则
    Boot 和 Bots 之间的距离为 2：一次添加和一次删除。这对应于 OpenRefine 中的一个实际距离函数，即 `levenshtein`。


    在实践中，很难预测对于给定字段哪种方法和函数的组合是最好的。因此，最好尝试各种选项，每次都仔细检查聚类的值是否确实属于一起。OpenRefine 界面通过按最有可能有帮助的顺序排列各种选项来帮助你：例如，先尝试
    key collision 再尝试 nearest neighbor。


    # 食谱 4 – 转换单元格值


    在第 2 章《分析和修复数据》中，我们看到 OpenRefine 可以自动更改列中所有单元格的内容，例如修剪空白。在之前的食谱中，我们了解到聚类是执行列范围值更改的另一种方法。然而，这些操作是转换单元格内容更一般机制的一部分。你可以以各种复杂的方式更改每个单元格的值。虽然这看起来有点像
    Excel 公式，但令人惊讶的是，仅用一点点就能完成多少。


    例如，假设你不喜欢 Categories 字段中的垂直条作为分隔符，而希望改用逗号后跟空格。虽然这可以通过先拆分多值单元格然后再重新连接来解决，但我们实际上可以在一次转换步骤中完成此操作。点击
    Categories 下拉菜单并导航到 Edit cells | Transform.... 转换对话框如下所示：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_69_0.png)


    此对话框的核心是 **Expression**，一个小的脚本，解释 OpenRefine 如何更改每个值。**Language** 列表允许我们选择表达式的语言，目前支持
    **General Refine Expression Language (GREL)**、**Jython**（用 Java 实现的 Python）和 **Clojure**（一种类似于
    Lisp 的函数式语言）。如果你熟悉后两者，你可能会发现用这些语言编写表达式更容易。然而，GREL 是专门为简单的转换而创建的，这就是为什么我们将在本书中使用它。


    在 **Preview** 选项卡中，你可以看到前几个单元格的值在转换前后的情况。这使你可以在实时查看结果的同时迭代更改转换表达式。**History**
    选项卡跟踪你过去使用过的表达式，这对于重复使用之前的转换非常方便。你经常使用的表达式可以在 **History** 选项卡中加星标，这使得它们也出现在 **Starred**
    选项卡中以便更快访问。最后，**Help** 选项卡提供了最重要的表达式构造的概述。


    在对话框底部，你可以决定如果表达式对某个单元格值导致错误会发生什么。你可以选择保留原值、使单元格为空，或将错误存储在单元格中。此外，你还可以选择重复应用转换表达式，这在转换结果需要再次检查时很有用。例如，如果你有一个表达式删除以大写字母开头的第一个单词，你可以重复它，直到没有大写字母的单词为止。


    回到我们的任务：将垂直条更改为逗号后跟空格。默认表达式是 `value`，但正如你可能猜到的，这相当于初始单元格值。让我们先尝试一个简单的例子，看看会发生什么；因此，将新单元格值输入为
    `1234`。预览已更新并显示每个单元格的新值现在将为 **1234**。不是很有帮助，但你明白了。我们真正想要的是从原始值开始并执行一些替换。在 **Help**
    选项卡中，我们可以看到对应的 GREL 函数称为 `replace`。由于我们想用逗号替换垂直条，我们输入表达式 `value.replace("|", ",
    ")`。请注意，我们在字符周围添加了引号，因为它们是字符串，而不是数字。预览使用新的单元格值进行了更新，结果确实是我们期望的，因此我们点击 **OK**。在惊人地短暂的时间内，OpenRefine
    已转换 **Categories** 列中的所有单元格，所有垂直条现在都不见了。


    > 更改分隔符时务必小心，因为如果新分隔符作为值的一部分出现，可能会产生意想不到的副作用。事实上，这里也是这种情况：类别 **Cup, saucer and
    plate sets** 包含一个逗号。因此，如果该字段再次被处理，这很可能会导致错误。然而，为了示例的缘故，我们在这里继续使用逗号。


    '
