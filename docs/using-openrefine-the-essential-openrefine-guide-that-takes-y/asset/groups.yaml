  - '[PAGE 54]


    # Analyzing and Fixing Data


    The next family of transforms is **case transformations**; we can convert text
    strings to lowercase, UPPERCASE, or Titlecase. For instance, we could check that
    no lowercase letters are present in the registration numbers by navigating to
    **Registration Number | Edit cells | Common transforms | To uppercase**. 2,349
    cells are transformed, which could mean huge quality issues, but it is in fact
    much ado about nothing. The values transformed were simply integers that were
    converted to strings in the process (since numbers do not have a case). You can
    check that for yourself by adding a numeric facet on the **Registration Number**
    column first, then launch the case transform and watch the numeric values vanish,
    replaced by a message informing you that no numeric values are present.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_54_0.png)


    Similarly, we can use **To lowercase** to verify that no capital letters are present
    in the persistent link URL or **To titlecase** to standardize the spelling of
    categories, smoothing the difference between Didactic Displays and Didactic displays
    for instance. However, **To titlecase** only keeps capital letters after whitespace,
    so **Spacecraft | Models | Space Technology** would be transformed into **Spacecraft
    | models | space Technology**, which is far from ideal. Do not bother too much
    about that now, though, as *Chapter 3, Advanced Data Operations*, will introduce
    a better and more powerful way of dealing with such cases: clustering.'
  - '[PAGE 55]


    In Recipe 2 – faceting data, we used one of the type transformations available.
    In fact, you may remember that temporal expressions had to be converted to dates
    (that is, OpenRefine''s internal format for dates, which is yyyy-mm-ddThh:mm:ssZ)
    before we could use a timeline facet on them. The same works for converting values
    to text or to numbers. We could transform record IDs into text, for instance,
    in order to be able to use a duplicates facet on them, but then we will need to
    convert them to numbers again before sorting them (to avoid 10 being put before
    2) or working with numeric facets.


    The last transformation predefined for us by OpenRefine is pretty blunt; Blank
    out cells does just that; it deletes all values in a given column. Of course,
    this is best used on a subset of the rows, not on the whole dataset. A useful
    combination would be to flag rows with problematic values for a given field, navigate
    to All | Facet | Facet by flag, and then blank out the cells from the matching
    rows.


    We are now done with the common transforms, but be assured that this is only the
    tip of the iceberg; the possibilities of transformations are countless, as you
    will discover in Chapter 3, Advanced Data Operations and Appendix, Regular Expressions
    and GREL. In fact, Edit cells | Transform... opens the Custom text transform window,
    which lets you define your own transformation with GREL. This may sound frightening
    at first, but trust us that it is worth the trouble.


    # Recipe 6 – removing matching rows


    In this recipe, you will learn how to suppress problematic rows that have been
    previously singled out through the use of facets and filters.


    Detecting duplicates or flagging redundant rows is fine, but it is only part of
    the job. At some point, you will want to cross the mark between data profiling
    (or analysis) and data cleaning. In practice, this means that rows that have been
    identified as inappropriate during the diagnosis phase (and probably flagged as
    such) will need to be removed from the dataset, since they are detrimental to
    its quality.


    To remove rows, be sure to have a facet or filter in place first, otherwise you
    will remove all rows in the dataset. Let''s start from the clean project again
    (import it for a second time or toggle the Undo / Redo tab and select 0. Create
    project to cancel all modifications) and see what we can do to clean up this dataset.
    Also, check that OpenRefine shows your data as rows, not records.'
  - '[PAGE 56]


    We will first remove the rows lacking a record ID. To do that, navigate to Record
    ID | Facet | Numeric facet and deselect the Numeric checkbox from the facet opening
    in the left pane. This leaves us with only Non-numeric checked and three matching
    rows. Remember that Facet by blank would not have worked, since these three rows
    are not really blank, but have a single whitespace character in the Record ID
    cells. Now go to All | Edit rows | Remove all matching rows and watch the rows
    disappear.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_56_0.png)


    Well done, the dataset is three rows shorter, no non-numeric record IDs are left
    (as you can see in the facet that has been refreshed), and data quality has already
    been improved. Clear the facet and check that the total is down to 75,811 rows.


    Next, we will handle rows without a registration number that are also suspicious
    in a museum collection. No spaces are in the way here (you can check that with
    a simple text filter on the column Registration Number by typing in a single whitespace
    character; no matching rows are found), so we can navigate to Registration Number
    | Facet | Customized facets | Facet by blank. Click on true on the left to select
    the 115 corresponding rows; they are all empty as well, so we can select Remove
    all matching rows again.


    As you can see, removing blank rows is quite easy; we will now focus on duplicate
    rows. Duplicates are a bit trickier, as you may recall from Recipe 3 – detecting
    duplicates, but we want to get rid of them nonetheless. Start by navigating to
    Registration Number | Facet | Customized facets | Duplicates facet and click on
    true to see the 163 matching rows. The problem is, if we suppress all these rows,
    we will not only delete duplicates, but also original values. In other words,
    if a row appears twice in the dataset, removing all matching rows will delete
    both of them instead of just one. If this happens, remember you can always go
    back in the project history.'
  - '[PAGE 57]


    So, we need a way to remove duplicates while safeguarding original rows. This
    can be achieved in the following manner: sort on column **Registration Number**,
    selecting **text** and **a-z** as options (the **case sensitive** box need not
    be checked since there are only uppercase letters in this field), then reorder
    the rows based on that sorting by navigating to **Sort | Reorder rows permanently**.
    Finally, replace repeated values with a blank by navigating to **Registration
    Number | Edit cells | Blank down**, which should affect 84 cells.


    If you left the duplicates facet open, you will witness it refreshed to display
    these 84 matching rows. What happened is that the original values (that were part
    of the 163) are now singled out, so they are no longer considered duplicates and
    swung to **false**. The real duplicates, however, have been blanked down, so they
    all have one and the same value now: blank. It is as if it were a big duplicate
    cluster of 84 rows. In any case, you can now remove these matching rows, leaving
    the original ones untouched.


    If all went well, you should now be left with 75,612 rows. We could go on with
    other removals, but you probably have got the general idea by now, so we will
    leave it to you to experiment with other columns. Have a look at the project history
    in the **Undo / Redo** tab to review to steps that we have been through.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_57_0.png)'
  - '[PAGE 58]


    We first removed three blank rows followed by 115 further rows that were nearly
    blank but for their record ID. In order to remove the 84 duplicates, we had to
    reorder the rows and to blank them down on the column **Registration Number**.
    In total, we have deleted 202 rows, leaving our dataset that much cleaner. Notice
    that the text facets and sorting operations are not listed in the history, since
    they did not affect the data but only served as visual aids for performing the
    removals.


    # Summary


    During the course of this chapter, we have learned how to master the basics of
    OpenRefine in order to analyze and fix datasets, essential components of data
    profiling and cleaning.


    Analyzing data involved sorting and the use of various facets, but also the application
    of text filters and the detection of duplicates.


    Fixing data was accomplished through reordering, cell transformations, and deletion.


    In the next chapter, we will bring our understanding of the inner workings of
    OpenRefine to another level by venturing into advanced data operations.'
