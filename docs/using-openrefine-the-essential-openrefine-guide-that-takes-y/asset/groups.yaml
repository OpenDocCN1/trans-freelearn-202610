  - '[PAGE 40]


    Instead, click on the **Facet by choice counts** link just below, which will open
    a second facet under the first one. This new facet, which is also on the **Categories**
    column, will allow you to restrict the range of categories to be displayed in
    the first text facet. When it first opens, OpenRefine tries to show all categories,
    whether they appear only once in the collection or several thousand times. Since
    there are too many categories to display, it makes sense to focus on the most
    popular ones, in the first phase at least.


    Drag the left handle to increase the lower limit to 1000 instead of 0. The preceding
    text facet refreshes automatically, and now the categories shown are only those
    that are used to describe at least 1000 objects in the collection. There are only
    7 of them, which is a lot easier to display and to browse. To get an even better
    picture, you can choose to sort them by **count** (from most frequent to least
    frequent) instead of by **name** (alphabetically).


    The following screenshot shows what you should now have in your two facets:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_40_0.png)'
  - '[PAGE 41]


    If you want to export these seven top categories, just click on the **7 choices**
    link and you will get them as nice **tab separated values (TSV)**, ready to copy
    and paste in your favorite text editor or spreadsheet. However, most of these
    categories are looking very suspicious. As a matter of fact, **Photographic prints
    | Photographs** is not a single category, but rather two categories separated
    by a vertical bar, or pipe character (|).


    This is exactly why we had so many choices in the first place. As a result, **Glass
    plate negatives | Gelatin dry plate negatives | Photographs, Glass plate negatives
    | Photographs, and Glass plate negatives** are all listed as distinct choices
    even though they contain the same category. This, however, is the plague of multi-valued
    cells, and we are not ready for dealing with them right now. We will have to wait
    until *Chapter 3, Advanced Data Operations*, where we will also learn more about
    this intriguing **Cluster** button that we have ignored purposefully for the time
    being.


    As the faceting of categories was somewhat skewed, let''s have a quick look at
    another text facet before moving on to numeric ones. The choice of column is less
    obvious, but we can see that the **Height** field does not contain only numbers,
    but also numbers followed by units of measurement, such as **990 mm**. This means
    that we will not be able to apply a numeric facet to this column (or at least,
    not straightforwardly), but we can try with a text facet, hoping that there will
    not be too many different values to display.


    Fortunately, navigating to **Facet | Text facet** from the **Height** column menu
    informs us that there are 1313 choices, well under the 2000 default limit. Sorting
    them by **count** instead of name reveals the surprising fact that **1368** objects
    in the collection have a height of exactly **164 mm**, whereas the second most
    frequent size of **215 mm** is only found in **400** objects. These values can
    be found in the following screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_41_0.png)'
  - '[PAGE 42]


    At the bottom of that list, we can also see that 45501 objects have a blank value
    for Height, which means that no height has been recorded for them. However, we
    will not linger with them now, since OpenRefine offers us a special facet for
    dealing with blank rows which we will discover when we talk about customized facets.


    # Numeric facets


    Finding a column that is relevant for a numeric facet is quite easier than for
    text facets, as several of them contain numerals. Numbers are easily spotted as
    they are colored in green, assuming the Parse cell text into numbers, dates...,
    checkbox was selected at the time of the project creation. The Record ID column
    is as good a choice as any, as a facet will allow us to have an overview of the
    distribution of IDs, and to check that all objects have one.


    In the Record ID column menu, navigate to Facet | Numeric facet and look at what
    appears in the Facet/Filter tab on the left. Whereas a text facet returned a list
    of different choices, numeric facets yield ranges of values, just like the one
    we had when faceting by choice counts.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_42_0.png)


    We can see that the values for the Record ID column range from 0 to 510,000, with
    a small gap between 270,000 and 280,000, and a larger one between 410,000 and
    500,000. By sliding the handles, we can have a closer look at the 533 rows that
    have an ID superior to 500,000, for instance.


    Under the graph, the values are divided into four categories: Numeric, Non-numeric,
    Blank, and Errors resulting from a problematic operation. No errors were found
    since we did not modify these values yet, and no blanks were found either, which
    means that all objects in the collections have been assigned a record ID. However,
    three rows have a non-numeric value, which is unexpected for an ID. Let''s find
    out more about these rows by deselecting the Numeric checkbox, leaving only the
    Non-numeric one checked.'
  - '[PAGE 43]


    On the right, we can now see the three matching rows. Not only do they lack a
    record ID, but all other columns are blank too, except for a persistent link to
    the object and the license information that were generated automatically. These
    rows do not represent actual objects, they are simply void rows that can be safely
    removed (we will see how in the last recipe of this chapter).


    However, something is amiss here; if these rows are truly blank, why were they
    categorized as non-numeric instead of being counted up under the **Blank** checkbox?
    Whitespace is the culprit here, as we can verify by editing one of the three cells.
    To do that, just hover with the mouse over one of them under the **Record ID**
    column and a small edit button will appear. Now click on it and observe for yourself
    that they contain a single space, as pictured in the following screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_43_0.png)


    To correct this, remove the problematic whitespace by hitting the *Backspace*
    or *Delete* key then click on the **Apply to All Identical Cells** button below
    or press *Ctrl + Enter*. OpenRefine informs you on top of the screen in a yellow
    box that three cells have been mass-edited in the column **Record ID**. As a result,
    the facet on the left refreshes and the three cells in question switched to the
    Blank box.


    Before moving to customized facets, let''s quickly mention two other ways for
    faceting that are related to the numeric facet: the timeline facet and scatterplot
    facet.


    A timeline facet requires dates, so text strings such as 17/10/1890 need to be
    converted to the date format first. You can try that on the **Production Date**
    column, but notice that real dates are a minority, since it also contains years
    such as 1984 and ranges such as 2006 to 2007. We can nonetheless navigate to **Edit
    cells | Common transforms | To date** in that column menu, transforming 79 cells
    into date format; for instance, 17/10/1890 will be converted to 1890-10-17T00:00:00Z,
    with the zeros indicating the time of day in hours, minutes, and seconds.'
  - '[PAGE 44]


    # Analyzing and Fixing Data


    Clearly, 79 cells out of a total of 75,814 is not a lot, but a timeline facet
    on these values would still show objects created on a given date range from 26
    February, 1880 to 31 January, 1952, while most values are either not time expressions
    (19,820) or blank (55,915).


    The following screenshot shows what can be obtained with a timeline facet on the
    **Production Date** column after converting dates to OpenRefine''s internal time
    format:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_44_0.png)


    Finally, scatterplot facets allow for a graphical representation of numerical
    values. We won''t go into the details of this particular facet, but do try it
    yourself if you are curious about it.


    # Customized facets


    We have now seen the two main types of facets, text facets and numeric facets,
    but many and more of them exist, and you could think of almost any way of faceting
    the data depending on your needs. Custom facets allow you to do just that; defining
    your own facets, whether text ones (for instance, faceting on the first character
    of a string), or numeric ones (for instance, faceting on the square root of a
    number). However, they require a basic understanding of the **General Refine Expression
    Language (GREL)**, which will be introduced in *Appendix, Regular Expressions
    and GREL*.'
