    # What this book covers


    Chapter 1, Diving Into OpenRefine, teaches you the basic steps of OpenRefine,
    showing you how to import a dataset and how to get around in the main interface.


    Chapter 2, Analyzing and Fixing Data, explains how you can get to know your dataset
    and how to spot errors in it. In addition, you''ll also learn several techniques
    to repair mistakes.


    Chapter 3, Advanced Data Operations, dives deeper into dataset repair, demonstrating
    some of the more sophisticated data operations OpenRefine has to offer.


    Chapter 4, Linking Datasets, connects your dataset to others through reconciliation
    of single terms and with named-entity recognition on full-text fields.


    Appendix, Regular Expressions and GREL, introduces you to advanced pattern matching
    and the General Refine Expression Language.


    # What you need for this book


    This book does not assume any prior knowledge; we''ll even guide you through the
    installation of OpenRefine in Chapter 1, Diving Into OpenRefine.


    # Who this book is for


    This book is for anybody who is working with data, particularly large datasets.
    If you''ve been wondering how you can gain an insight into the issues within your
    data, increase its quality, or link it to other datasets, then this book is for
    you.


    No prior knowledge of OpenRefine is assumed, but if you''ve worked with OpenRefine
    before, you''ll still be able to learn new things in this book. We cover several
    advanced techniques in the later chapters, with Chapter 4, Linking Datasets, entirely
    devoted to linking your dataset.'
