    # Preface


    Data is often dubbed the new gold, as it is of tremendous value for today''s data-driven
    economy. However, we prefer to think of data as diamonds.

    At first they''re raw, but through great skills, they can be polished to become
    the shiny assets that are so worthy to us. This is precisely what this book covers;
    how your dataset can be transformed in OpenRefine so you can optimize its quality
    for real-world (re)use.


    As the vast amount of functionality of OpenRefine can be overwhelming to new users,
    we are convinced that a decent manual can make the difference. This book will
    guide you from your very first steps to really advanced operations that you probably
    didn''t know were possible. We will spend time on all different aspects of OpenRefine,
    so in the end, you will have obtained the necessary skills to revive your own
    datasets. This book starts out with cleaning the data to fix small errors, and
    ends by linking your dataset to others so it can become part of a larger data
    ecosystem.


    We realize that every dataset is different, yet learning is easiest by example.

    This is why we have chosen the Powerhouse Museum dataset to demonstrate the techniques
    in this book. However, since not all steps apply on your dataset, we have structured
    the different tasks as recipes. Just like in a regular cookbook, you can just
    pick the recipes you need for what you want to achieve. Some recipes depend on
    each other, but this is indicated at the start of each chapter.


    In addition, the example dataset in this book illustrates a healthy data culture;
    the people at Powerhouse decided to bring it online even though they were aware
    that there were still some quality issues. Interestingly, that didn''t stop them
    from doing it, and in fact, it shouldn''t stop you; the important thing is to
    get the data out. Since then, the data quality has significantly improved, but
    we''re providing you with the old version so you can perform the cleaning and
    linking yourself.'
