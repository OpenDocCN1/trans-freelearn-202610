    ## 2


    ## Analyzing and Fixing Data


    In this chapter, we will go deeper into OpenRefine and review most of its basic
    functionalities intended for data fixing and analysis. We will cover the following
    topics, spread over six recipes:


    - Recipe 1 – sorting data

    - Recipe 2 – faceting data

    - Recipe 3 – detecting duplicates

    - Recipe 4 – applying a text filter

    - Recipe 5 – using simple cell transformations

    - Recipe 6 – removing matching rows


    Even more so than in *Chapter 1, Diving Into OpenRefine*, the recipes are designed
    to allow readers to jump from one recipe to another in any way you like, depending
    on your needs and interests. Flowing reading of the chapter is also possible of
    course, but not mandatory at all.


    Be warned that recipes are unequal in length; some are quite short and to the
    point, but others could not be constricted to one or two pages. *Recipe 2 – faceting
    data*, for instance, which covers the broad topic of faceting, runs over many
    pages and is divided into subrecipes.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_35_0.png)


    > To follow the examples used throughout this chapter, we recommend that you load
    the `chapter2.openrefine.tar.gz` file directly by selecting **Import Project**
    at startup. Alternatively, you can work with your own OpenRefine project created
    from the `chapter1.tsv` file, as explained in *Chapter 1, Diving Into OpenRefine*.


    ## Recipe 1 – sorting data


    In this recipe, you will learn how to sort data as a visual aid and how to reorder
    rows permanently as a prerequisite for more advanced operations.


    Because sorted values are easier to explore and manipulate, sorting data is certainly
    something you will want to do at some point when working with OpenRefine; you
    can either use the sorted values as a visual aid or reorder your records permanently.
    In order to sort your data by their **Record ID**, for instance, choose **Sort...**
    in the column menu to access the following window:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_36_0.png)


    Cell values can be sorted according to their type: text (case-sensitive or not),
    numbers, dates, or Boolean values. For each type, we are offered two possible
    sorting orders:


    - **Text:** alphabetical (a to z) or reversed alphabetical (z to a)

    - **Numbers:** smallest first or largest first

    - **Dates:** earliest first or latest first

    - **Booleans:** false then true or true then false


    Moreover, we can select where errors and blanks will be stored in relation to
    the valid values by dragging them in the desired order. For instance, errors could
    be sorted first (to spot them more easily) and blank values at the end (since
    they interest us less) with valid (normal) values in the middle.


    Sorting the data by **Records ID** by selecting **numbers** and **smallest first**,
    for instance, will give the new ordering 7, 9, 14, and so on, where you formerly
    had **267220, 346260, 267098**, and so on. The following screenshot illustrates
    the order before and after sorting:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_37_0.png)


    Sorting as text would have produced a different ordering starting with 100, 1001,
    10019, and so on. Notice, however, that this sorting has not been recorded in
    the project history; you can check that yourself by clicking on the **Undo / Redo**
    tab in the top-left of the screen.


    This is because the default behavior of sorting in OpenRefine is not to affect
    the data, but only to display them in any way you like, such as the rows/records
    alternation or the collapsing of unwanted columns (you may also think of sort
    filters in spreadsheet software). So every time you sort your data on a given
    column, you are faced with three options: to remove your sorting and go back to
    the original order, to keep it as a temporary visual aid, or to make the reordering
    permanent.


    These options cannot be selected in the original column menu, but are available
    in a dedicated Sort menu appearing at the top as shown in the following screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_38_0.png)


    ### Reordering rows


    The Sort menu allows you to remove the sorting or to reorder rows permanently.
    In addition, it reminds you of what columns were used for the sorting, which makes
    it possible to combine various sort criteria (see the preceding screenshot). For
    instance, you could sort your data first on Registration Number then on Object
    Title as a double visual aid. Later, you could decide to remove the sort on the
    numbers only (by navigating to Sort | By Registration Number | Remove sort) and
    make the sort on the titles permanent. The individual sort submenus also let you
    reverse the sort order with one click.


    Be sure to make any reordering permanent if you need it for some other operation,
    such as blanking or filling down cells, in order to avoid inconsistent results.
    In Recipe 3 – detecting duplicates, we will see how to use sorting as a preliminary
    step to removing duplicates.


    ## Recipe 2 – faceting data


    One of the functionalities of OpenRefine that you will use most often is faceting.
    Facets do not affect the values of your data, but they allow you to get useful
    insights of your dataset; you can think of facets as various ways to look at your
    data, just like the facets of a gemstone that still have to be refined. Facets
    also allow you to apply a transformation to a subset of your data, as they allow
    you to display only rows corresponding to a given criterion.


    In this recipe, we will explore the various ways of faceting data depending on
    their values and on your needs: text facets for strings, numeric facets for numbers
    and dates, a few predefined customized facets, and finally how to use stars and
    flags. Most of the power of OpenRefine lies in the ability to combine these different
    types of facets.


    ### Text facets


    If your dataset has a column containing cities or country names, for instance,
    you will want to see at a glance what the different values are for that field
    and the number of occurrences for each one. This is exactly what text facets are
    for. Of course, faceting is only useful when a limited number of choices are at
    hand; it does not make sense to list all the object titles or descriptions, as
    it is very unlikely that they will appear twice (except in the case of duplicates,
    which will be dealt with in the next recipe).


