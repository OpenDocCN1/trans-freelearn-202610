    If you want a facet of your own, you don''t have to start with any of the pre-made
    facets. For instance, if we want to filter on the number of categories, we can
    create a custom facet by going to the **Categories** dropdown and clicking on
    **Facet, Custom text facet....** Enter the expression `value.split("|").length()`
    and click on **OK**. You see a new **Categories** facet on the left-hand side
    which lets you choose the number of categories. If, like here, the output of your
    expression is a number, you might want to create a numeric facet instead. Follow
    the same steps, but navigate to **Facet | Custom numeric facet...** this time.
    This allows you to filter your records in a numeric way. Custom facets are a great
    way to explore your dataset in detail without touching your data.


    # Solving problems with GREL


    Finally, some knowledge of GREL comes in handy in those places where something
    doesn''t quite work the way you expect. For instance, we saw in *Chapter 2, Analyzing
    and Fixing Data,* that the duplicates facet works fine on the **Registration Number**
    column, but not on **Record ID**. Let''s see if we can fix that. Create a duplicates
    facet by clicking on the **Record ID** dropdown and navigating to **Facets | Customized
    facets | Duplicates** facet.


    > Be sure to try this with the original dataset that has not been cleaned, otherwise
    the duplicates have already been removed.


    As you might recall, OpenRefine does not find duplicates. So, let''s edit the
    expression to update that. When we click on the **Change** link, we see the original
    expression:


    ```

    facetCount(value, ''value'', ''Record ID'') > 1

    ```


    The problem here is that value is a number and facetCount only works with strings.
    The solution is to convert value to a string, like this:


    ```

    facetCount(value.toString(), ''value'', ''Record ID'') > 1

    ```


    This will correctly indicate the duplicate rows in the facet.


    You might be wondering: how could I ever have found this out myself? The secret
    is practice and exploration. The more datasets you analyze, clean, and link in
    OpenRefine, the better you will get at it. Also, you''ll gain more and more experience
    with regular expressions and GREL as you gradually begin to master the basics.
    From that point onwards, it is a small step to the things that are increasingly
    complex. This book has tried to show you the direction; now it''s time to go your
    own way.'
