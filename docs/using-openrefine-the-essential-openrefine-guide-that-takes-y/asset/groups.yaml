    \n# File formats supported by OpenRefine\n\nHere are some of the file formats\
    \ supported by OpenRefine:\n\n+   - Comma-Separated Values (CSV), Tab-Separated\
    \ Values (TSV), and other *SV\n+   - MS Excel documents (both .XLS and .XLSX)\
    \ and Open Document Format (ODF) spreadsheets (.ODS), although the latter is not\
    \ explicitly mentioned\n+   - JavaScript Object Notation (JSON)"
