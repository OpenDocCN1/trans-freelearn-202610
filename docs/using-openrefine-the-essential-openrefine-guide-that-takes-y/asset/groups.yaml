    - `\d$` matches all texts that end with a number.

    - `^\d.*\d$` matches all texts that begin and end with a number. Read this expression
    as: start of the text, a number, zero or more times any character (the dot), a
    number, end of the text. If we would use `^\d+$` instead, we would have all texts
    that contain only a number (of any length).

    - `\b\d{3}\b` searches for texts that contain at least one number of exactly three
    digits, since the `\b` anchor matches at word boundaries. If the text contains
    four-digit numbers but no three-digit numbers, it does not match. (If we would
    remove the `\b` anchors, it would.)

    - `^\d{3}\b` finds texts that start with a three-digit number.


    ## Choices


    We have already seen a mechanism for indicating choices. Square brackets give
    regular expressions the possibility to choose one of the many characters: `[a-z123]`
    searches for texts with at least one lowercase letter or any of the digits 1,
    2, and 3. Often, the choices are larger, as they can be several letters or words
    long. For this, the or operator `|` was introduced. It works as an OR operator
    between several alternatives:


    - `glass|wood|steel` will match texts that contain glass, wood, or steel.

    - `\d+|many|few` matches either a number, many or few.

    - `N\d{5}, |N\d{8},` matches either five-digit or eight-digit numbers that start
    with an N and end with a comma, but nothing in between (so no six-digit numbers
    for instance).


    ## Groups


    The only things we haven''t covered so far are **groups**. If you want to use
    quantifiers on a group of characters instead of on a single character, you have
    to enclose them in parentheses `()`:


    - While `1a+` matches texts that contain `1a`, `1aa`, `1aaa`, and so on, the expression
    `(1a)+` finds texts that contain `1a`, `1a1a`, `1a1a1a`, and so on.

    - The expression `analyz|se` would match texts that contain `analyz` and texts
    that contain `se`. This is probably not that useful. On the other hand, the expression
    `analy(z|s)e` matches both `analyze` and `analyse`. Note that in this case, this
    is equivalent to `analy[zs]e` because the choice consists of a single letter.
    However, this would not be the case with `analyz(e|ing)`, which would match `analyze`
    and `analyzing`.


    As parentheses have a special meaning, they need to be escaped as well. `\(` and
    `\)` match parenthesis literally.


    ## Overview


    The following table provides an overview of the special symbols in regular expressions:


    | Symbol | Meaning |

    |---|---|

    | `ABC... abc...` | Match the corresponding letters literally |

    | `123...` | Match the corresponding numbers literally |

    | `[xyz]` | Match one of the characters inside the braces |

    | `[^xyz]` | Match any character that is not inside the braces |

    | `[0-9]` | Match one of the characters inside the range |

    | `\d` | Match a digit |

    | `\D` | Match a non-digit |

    | `\w` | Match a letter, number, or underscore |

    | `\W` | Match anything that is not a letter, number, or underscore |

    | `.` | Match any character except a newline |

    | `\n` | Match a newline |

    | `\.` | Match an actual dot (the backslash escapes the next character) |

    | `?` | Match the preceding item zero or one time |

    | `*` | Match the preceding item zero or more times |

    | `+` | Match the preceding item one or more times |

    | `{3}` | Match the preceding item three times |

    | `{3,6}` | Match the preceding item three to six times |

    | `{3,}` | Match the preceding item at least three times |

    | `{,6}` | Match the preceding item up to six times |

    | `^` | Match at the beginning of the text |

    | `$` | Match at the end of the text |

    | `\b` | Match at a word boundary |

    | `cat\|dog\|cow` | Match one of the alternatives |


    ## General Refine Expression Language (GREL)


    The true power of regular expressions emerges if we can use them not only for
    finding data, but also for manipulating data. GREL enables that and a lot of other
    functionality as well. It is a simple language designed for easily manipulating
    values. It consists of a set of built-in functions as well as several variables
    that are available through OpenRefine. We''ve briefly touched upon it in several
    recipes and we will show you the way to build your own GREL expressions here.


    ## Transforming data


    One place where GREL comes in handy especially is when you need to transform the
    values in your cells. You can either change cells in-place (by navigating to the
    respective column dropdown and then to Edit cells | Transform...) or make a new
    column with the transformed values (by navigating to the respective column dropdown
    and then to Edit column | Add column based on this column...). We will try some
    examples on the Object Title column here.


    When you open any of the transformation dialogs, you see a first GREL expression.
    It is simply called `value` and gives back the original value of the cell. That
    is not really useful, but we can start from there to learn some tricks. For instance,
    the GREL expression `"TITLE: " + value + "."` adds the text TITLE: before the
    value and appends a dot to the end. Note that literal text must be surrounded
    by single or double quotes so OpenRefine doesn''t confuse it with commands. You
    can see the preview get updated as you build the expression.

    '
  mdcn: '


    ## 量词


    到目前为止，我们已经在正则表达式中看到了表示要匹配特定字符的方法。然而，我们还无法表达想要看到某个字符出现一定次数，而这个次数事先未知的需求。例如，我们如何表达“单引号内的一个数字”？我们可以从
    `''\d''` 开始，但那样只会匹配包含 0、1、5 等单个数字的文本，而不会匹配像 23 或 478 这样的多位数。事实上，计算机会严格遵循表达式：一个单引号、一个数字、一个单引号。


    **量词**可以表达重复。有三个简单的量词：加号 +，表示一次或多次；星号 *，表示零次或多次；问号 ?，表示零次或一次。它们只对紧邻其左侧的符号起作用：


    - `bre+d` 匹配包含 bred、breed 或 breeed 的文本，这些文本中 e 的数量可以是任意个，但至少得有一个 e。

    - `bre*d` 匹配包含 brd、bred、breed 或 breeed 的文本，e 的数量可以是任意个，甚至可以没有。注意，星号可以匹配 brd，但加号不行。

    - `bre?d` 匹配 brd 和 bred，但不匹配 breed 或其他任意数量的 e。简单来说，它使 e 变为可选项。

    - 组合也是可以的。`br?e+d` 匹配 bed、bred、beed、breed、beeed、breeed 等等。

    - 此外，你可以使用花括号 {min,max} 来明确指定某个符号出现的次数。你可以设定它出现的最小和最大次数。两者都可以为空，表示没有最小或最大限制。请保留逗号，这样
    OpenRefine 才能知道你指定的是最小值还是最大值。如果你只提供一个不带逗号的数字，则会匹配该确切次数。

    - `N\d{5,8}` 匹配包含以 N 开头、后跟五、六、七或八位数字，再跟一个逗号的代码的文本。

    - `N\d{5,}` 匹配包含以 N 开头、至少五位数字，再跟一个逗号的代码的文本。

    - `N\d{,8}` 匹配包含以 N 开头、最多八位数字，再跟一个逗号的代码的文本。

    - `N\d{5}` 匹配包含以 N 开头、恰好五位数字，再跟一个逗号的代码的文本。这等同于 `N\d\d\d\d\d`，但更简洁（尤其是数字变大时）。


    毋庸置疑，量词和花括号是特殊符号，因此如果你想按字面意思匹配它们，就应该使用反斜杠对它们进行转义。例如，问号可以用 `\?` 来匹配。


    ## 锚点


    有时候，你不仅想指定要匹配多少个字符，还想指定匹配发生的位置。锚点可以实现这一点。脱字符 ^ 表示匹配应发生在行的开头，而美元符号 $ 表示匹配应在行的末尾结束。（不要将其与方括号内表示否定的脱字符混淆；它在方括号外出现时含义不同。）此外，我们还可以使用锚点
    `\b` 来指示匹配应在单词边界开始或结束：


    - `^\d` 匹配所有以数字开头的文本。

    - `\d$` 匹配所有以数字结尾的文本。

    - `^\d.*\d$` 匹配所有以数字开头和结尾的文本。可以将这个表达式理解为：文本开头、一个数字、任意字符出现零次或多次（即点号）、一个数字、文本结尾。如果我们改用
    `^\d+$`，那么匹配的就是只包含一个数字（任意长度）的所有文本。

    - `\b\d{3}\b` 搜索包含至少一个恰好为三位数字的数字的文本，因为 `\b` 锚点匹配单词边界。如果文本包含四位数字但不包含三位数字，则不匹配。（如果我们移除
    `\b` 锚点，它就会匹配。）

    - `^\d{3}\b` 查找以三位数字开头的文本。


    ## 选择


    我们已经看到了一种表示选择的机制。方括号让正则表达式可以从众多字符中选择一个：`[a-z123]` 搜索包含至少一个小写字母或 1、2、3 中任意一个数字的文本。通常情况下，选择范围更大，可能是多个字母或单词。为此，引入了或运算符
    `|`。它作为多个候选项之间的 OR 运算符：


    - `glass|wood|steel` 将匹配包含 glass、wood 或 steel 的文本。

    - `\d+|many|few` 匹配一个数字、many 或 few。

    - `N\d{5}, |N\d{8},` 匹配以 N 开头并以逗号结束的五位或八位数字，但不匹配中间长度的数字（例如六位数字）。


    ## 分组


    到目前为止，我们唯一还没涉及的是**分组**。如果你想对一组字符而不是单个字符使用量词，就必须用圆括号 `()` 将它们括起来：


    - `1a+` 匹配包含 `1a`、`1aa`、`1aaa` 等内容的文本，而 `(1a)+` 则匹配包含 `1a`、`1a1a`、`1a1a1a` 等内容的文本。

    - 表达式 `analyz|se` 会匹配包含 `analyz` 的文本和包含 `se` 的文本。这可能不太有用。另一方面，表达式 `analy(z|s)e`
    同时匹配 `analyze` 和 `analyse`。请注意，在这种情况下，它等同于 `analy[zs]e`，因为选项是单个字母。但对于 `analyz(e|ing)`
    就不是这样了，它会匹配 `analyze` 和 `analyzing`。

    - 由于圆括号具有特殊含义，因此也需要转义。`\(` 和 `\)` 按字面意思匹配圆括号。


    ## 概览


    下表列出了正则表达式中的特殊符号概览：


    | 符号 | 含义 |

    |---|---|

    | `ABC... abc...` | 按字面意思匹配相应的字母 |

    | `123...` | 按字面意思匹配相应的数字 |

    | `[xyz]` | 匹配方括号内的一个字符 |

    | `[^xyz]` | 匹配不在方括号内的任意字符 |

    | `[0-9]` | 匹配指定范围内的一个字符 |

    | `\d` | 匹配一个数字 |

    | `\D` | 匹配一个非数字 |

    | `\w` | 匹配一个字母、数字或下划线 |

    | `\W` | 匹配不是字母、数字或下划线的任意内容 |

    | `.` | 匹配除换行符之外的任意字符 |

    | `\n` | 匹配一个换行符 |

    | `\.` | 匹配实际的点号（反斜杠对下一个字符进行转义） |

    | `?` | 匹配前面的元素零次或一次 |

    | `*` | 匹配前面的元素零次或多次 |

    | `+` | 匹配前面的元素一次或多次 |

    | `{3}` | 匹配前面的元素三次 |

    | `{3,6}` | 匹配前面的元素三到六次 |

    | `{3,}` | 匹配前面的元素至少三次 |

    | `{,6}` | 匹配前面的元素最多六次 |

    | `^` | 匹配文本开头 |

    | `$` | 匹配文本结尾 |

    | `\b` | 匹配单词边界 |

    | `cat\|dog\|cow` | 匹配其中一个候选项 |


    ## 通用 Refine 表达式语言（GREL）


    正则表达式的真正威力在于，我们不仅可以用它查找数据，还可以用它操作数据。GREL 可以实现这一点以及许多其他功能。它是一种为轻松操作值而设计的简单语言。它由一组内置函数以及通过
    OpenRefine 可用的几个变量组成。我们在几个示例中已经简要提到过它，接下来我们将向你展示如何构建自己的 GREL 表达式。


    ## 转换数据


    GREL 特别有用的一个场景是当你需要转换单元格中的值时。你可以就地修改单元格（转到相应列的下拉菜单，然后选择“编辑单元格 | 转换...”），或者使用转换后的值创建新列（转到相应列的下拉菜单，然后选择“编辑列
    | 基于此列添加列...”）。我们将在 Object Title 列上尝试一些示例。


    当你打开任意一个转换对话框时，会看到一个最初的 GREL 表达式。它简单地称为 `value`，返回单元格的原始值。这确实没什么用，但我们可以从它开始学习一些技巧。例如，GREL
    表达式 `"TITLE: " + value + "."` 会在值前面加上文本 TITLE:，并在末尾附加一个点号。请注意，字面文本必须用单引号或双引号括起来，以免
    OpenRefine 将其与命令混淆。你可以在构建表达式时看到预览随之更新。


    '
