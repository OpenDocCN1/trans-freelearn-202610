    已联系服务并使用部分数据来尝试猜测你的列数据类型。不幸的是对我们而言，它提供的两个选项与 **Categories** 字段不相关：persons 和 locations。幸运的是，我们也有
    **Reconcile against type** 选项来自行选择类型。然而，由于我们不确定我们的数据集中的类别是否实际上属于单一特定类型，我们只需选择
    **Reconcile against no particular type.**


