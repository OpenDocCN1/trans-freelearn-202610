    \ 的一个非常有用的功能是它对自项目创建以来影响数据的所有修改的历史记录处理。实际上，这意味着你永远不必害怕尝试新事物：随时都可以随意摆弄数据并应用任何想到的转换，因为如果意识到是错误，一切都可以撤销（即使更改已过去数月）。\n\
    \n要访问项目历史记录，请点击屏幕左上角的 **Undo / Redo** 选项卡，就在 **Facet / Filter** 旁边，如以下截图所示：\n\n\
    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_29_0.png)\n\n为了回溯时间，请点击你想要保留的最后一步。例如，要取消列\
    \ **Provenance (Production)** 的删除以及所有后续步骤，请点击 **2. Rename column Description.\
    \ to Description.** 第 2 步将被高亮显示，第 3 步到第 5 步将被灰显。这意味着重命名将被保留，但接下来的三个步骤不会被保留。要取消所有更改并恢复数据到任何转换之前的状态，请点击\
    \ **0. Create project**。要撤销取消操作（重做），请点击你想要恢复历史记录到的步骤：例如，点击 **4. Reorder rows**\
    \ 再次应用步骤 3 和 4，同时保持步骤 5（行删除）的抑制。\n\n然而要谨慎，后退并做其他事情会删除所有后续步骤。例如，如果你从步骤 5 后退到步骤\
    \ 2，然后选择将列 **Description** 移到左侧，步骤 3 现在将读作 **3. Move column description to position\
    \ 1**，而前一张截图中的灰色步骤将永远消失：你不能同时记录两个冲突的历史记录。务必在此进行实验，以避免将来出现不愉快的意外。\n\n重要的是要注意，只有实际影响数据的操作才会在项目历史记录中列出。诸如在行视图和记录视图之间切换、每页显示更少或更多记录、再次折叠和展开列等视觉辅助工具并不是真正的转换，因此不会被保存。其结果是它们会在一次会话到另一次会话之间丢失：当你返回之前关闭的项目时，所有列都将再次展开，而重命名和删除的列仍将保持你上次离开时的状态，以及项目历史记录中存储的每一次其他操作。在\
    \ *Chapter 2, Analyzing and Fixing Data* 中，我们将看到这也适用于其他类型的操作：虽然单元格和列转换会记录在历史记录中，但过滤器和分面不会。\n\
    \n请注意，操作历史记录也可以通过点击 **Undo / Redo** 下方的 **Extract...** 按钮以 JSON 格式提取。这将允许你选择要提取的步骤（请注意，只有可重用的操作可以提取，这排除了对特定单元格执行的操作），然后它们将被自动转换为\
    \ JSON，可以复制粘贴。前一张截图中的步骤 1 和 2 将表示为：\n\n```\n[\n  {\n    \"op\": \"core/column-move\"\
    ,\n    \"description\": \"Move column Registration Number to position 1\",\n \
    \   \"columnName\": \"Registration Number\",\n    \"index\": 1\n  },\n  {\n  \
    \  \"op\": \"core/column-rename\",\n    \"description\": \"Rename column Description.\
    \ to Description\",\n    \"oldColumnName\": \"Description.\",\n    \"newColumnName\"\
    : \"Description\"\n  }\n]\n```\n\n## Downloading the example files\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_30_0.png)\n\
    \n你可以从 http://www.packtpub.com 在你购买的所有 Packt 书籍的账户中下载示例文件。如果你是在其他地方购买本书，你可以访问\
    \ http://www.packtpub.com/support 并注册以便将文件直接发送到你的电子邮件。\n\n在前面的代码中，**op** 代表操作，**description**\
    \ 实际上描述了操作的作用，而其他变量是传递给操作（函数）的参数。之前保存为文本文件中的 JSON 的步骤随后可以通过点击 **Apply...** 按钮并将提取的\
    \ JSON 历史记录粘贴到文本区域，重新应用于同一项目或另一个项目。最后，如果你执行了数百次操作并且难以找到某个特定步骤，你可以使用 **Filter**\
    \ 字段将历史记录限制为匹配文本字符串的步骤。例如，对 remove 的过滤（甚至是 rem）将把显示的历史记录限制为步骤 3 和 5。\n\n## Recipe\
    \ 6 – exporting a project\n\n在本菜谱中，你将探索保存修改后的数据以便在其他上下文中重用的各种方法，包括 **templating**，它允许使用任何自定义导出格式。\n\
    \n尽管你可能已经移动、重命名，甚至删除了列，但这些修改都没有保存到原始数据集中（即 *Recipe 1 – installing OpenRefine*\
    \ 中的 chapter1.tsv 文件保持不变）。事实上，与大多数直接将更改记录到与其打开的文件中的电子表格软件不同，OpenRefine 总是在内存中对数据的内部副本进行操作。虽然这是一个额外的安全保障，但这也意味着在与他人共享或注入到另一个应用程序之前，任何修改后的数据都需要导出。屏幕右上角的\
    \ **Export** 菜单允许你这样做：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_31_0.png)\n\
    \n"
