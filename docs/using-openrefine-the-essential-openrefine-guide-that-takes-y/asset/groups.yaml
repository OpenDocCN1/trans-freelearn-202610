    Something more useful is to change some text. For instance, we can replace the
    string stone by stones in each cell using `value.replace("stone", "stones")`.
    The replace function is called here on the value with the dot notation. We''re
    telling OpenRefine to take the cell value and to replace all occurrences of stone
    with stones.


    It gets all the more powerful if we combine this with regular expressions. As
    you can see, some of the cell values start with a number. We can remove this number
    by doing `value.replace(/^\d+ /, "")`. Note how the regular expression is enclosed
    in slashes `/`, whereas the replacement string is enclosed in double quotes `""`.


    We can even go further by using groups. Not only are those used within regular
    expressions to treat several characters as a single unit, they also save the matched
    contents for later reuse. Therefore, we can replace the numbers at the start with
    something more meaningful. For instance: `234` becomes `Object 234`. This is possible
    with the following expression: `value.replace(/^(\d+) /, "Object $1: ")`. You
    identify a group with a dollar sign followed by its number. The first group is
    called `$1`, and the special identifier `$0` is used for the result of the entire
    expression.


    The functionality is only limited by the complexity of your expressions. A more
    difficult example we have noticed before is that cells in the multi-valued **Categories**
    column sometimes contain empty values. For instance, a value such as `"|Stones||Bones||Buildings"`
    actually only contains three values, but if you split on the vertical bar, you
    will get seven of them (including four empty ones) because there are six divider
    bars. We can get rid of all these fake bars. Bars at the beginning must be removed,
    so we first do `value.replace(/^\|/, "")`. This looks a little more complicated
    than it is because the bar has to be escaped as it has a special meaning in regular
    expressions. To change multiple occurrences into a single one, we can do `value.replace(/\|+/,
    "|")`. Note how the vertical bar is escaped in the regular expression, but not
    in the replacement string, as it has no special meaning there.


    OpenRefine has other methods than `replace`, as you can see in the useful **Help**
    tab of the expression editor, or in the overview at https://github.com/OpenRefine/OpenRefine/wiki/GREL-Functions.
    One example is the `split` method. When used on the **Categories** field, we can
    count how many different values are present in each cell as follows: `value.split("|").length()`.
    Here, we instruct OpenRefine to split the value whenever it encounters a vertical
    bar, and then uses the length function to count the number of resulting values.
    You can even build more complicated expressions such as `value.split("|").unique().join("|")`,
    which, as we''ve seen in *Chapter 3, Advanced Data Operations*, removes duplicate
    values from the field.'
