  - '[PAGE 34]


    # Mac


    The instructions for Mac are a bit more complicated, as this operating system
    hides the configuration files from sight. After closing OpenRefine, hold control
    and click on its icon, selecting Show package contents from the pop-up menu. Then,
    open the info.plist file from the Contents folder. You should now see a list of
    OpenRefine settings. Navigate to the Java settings and edit the value of VMOptions
    (these are the properties of the Java Virtual Machine). Look for the part that
    starts with -Xmx and change its default value of 1024 M to the desired amount
    of memory, for instance, -Xmx2048M.


    # Linux


    This might come in as a surprise, but increasing allocated memory is easiest in
    Linux. Instead of starting OpenRefine with ./refine as you usually would do, just
    type in ./refine -m 2048M, where 2048 is the desired amount of memory in MB. To
    make the change permanent, you can create an alias in the hidden .bashrc file
    located in your home folder by adding the following line at the end of the file:


    ```

    alias refine=''cd path_to_refine ; ./refine -m 2048M''

    ```


    Here, path_to_refine is the relative path from your home folder to the OpenRefine
    folder. Then, the next time you start OpenRefine with ./refine, it will be allocated
    2 GB by default.


    # Summary


    In this chapter, you have got to know OpenRefine, your new best friend for data
    profiling, cleaning, transformation, and many other things that you are still
    to discover. You now have an OpenRefine installation running and you know how
    to import your data into it by creating a new project and how to export them again
    after you are done. The mechanisms of rows and columns do not have any secrets
    for you any longer, and you understand how to navigate in the project history.
    You have also mastered memory allocation, which allows you to work on larger datasets.


    Although it is always important to first have a good overview of what is in your
    dataset before dirtying your hands, you may now be getting impatient to perform
    actual changes on your data. If so, you are ready for Chapter 2, Analyzing and
    Fixing Data, which will move on to teach you the ins and outs of all the basic
    operations needed to analyze and fix your data.'
