    The second option we can choose is **Auto-match candidates with high confidence**.
    Reconciliation services also return a match score that indicate how confident
    they are that the match is the right one. The auto-match option is on by default,
    and it means that if the score is sufficiently high, OpenRefine will assume it
    has made the right choice and declare it a match. For other cell values (or if
    you have unticked the checkbox), you will have to confirm the match manually.
    Our advice would be to leave this one ticked, as it saves you a considerable amount
    of work.


    The third and final option allows you to send additional data to the reconciliation
    service. Instead of basing the match on a single column value, it is possible
    to consider different columns. For this, you will have to indicate the property
    name. For the Powerhouse Museum dataset, no such other relevant column exists.
    But if you had a dataset of country names with country codes, it could be helpful
    to send both to the reconciliation service.


    With **Reconcile against no particular type** ticked, click on **Start Reconciling**.
    The reconciliation process might take some time, as OpenRefine will now ask the
    reconciliation service to find a URL for each unique cell value. The yellow information
    bar on top of the window will tell you how much has been done.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_82_0.png)


    This might be the moment to take a coffee break or to do another task on your
    computer and let reconciliation run in the background. When the process has finished,
    you will notice that OpenRefine has automatically created a **judgement** and
    a **best candidate''s score** facet for you.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_82_1.png)


    The **judgement** facet allows you to partition the dataset in rows that have
    been reconciled and rows that have not, as well as rows that have a blank value
    for the **Categories** cell and were thus not reconciliation candidates. What
    you see here might surprise you, there are only **(blank)** and **none** filters
    in the facet. Where are the reconciled rows?


    It turns out that, unfortunately, reconciliation with Freebase has not been successful
    no single match was found. Does this mean we did something wrong? No, we did not,
    it just happens that the terms in our database are apparently not the kind of
    topics that Freebase covers. Does that mean that Freebase is not a good candidate
    for reconciliation? Not at all, it just so happens that our dataset is not a good
    fit. You might have more luck with other datasets, so definitely try that.


    Let''s undo the unsuccessful reconciliation by removing the facets with the Remove
    All button and by going a step back in the Undo / Redo menu. (You can get them
    back by going to the Categories dropdown | Reconcile | Facets.) The next recipes
    will show you how to try other reconciliation services.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_83_0.png)


    > Sometimes you just want to try out reconciliation with a certain service to
    see how it works. Does that mean you have to sit through the whole reconciliation
    process every time? Not if you make clever use of facets! We tend to try reconciliation
    first on a small part of the dataset and then decide whether we want to run it
    on all rows. To make a more or less random selection, we can for instance add
    a text filter on the Record ID column and enter a digit such as 4. Given an equal
    distribution of digits in all IDs, this would select about 10 percent of the rows.
    If that''s still too much, just keep adding digits until the number of rows has
    come down to a few hundred. For instance, 413 did the trick for us.


    ## Recipe 2 – installing extensions


    While OpenRefine allows you out-of-the-box to add new reconciliation services,
    these are only services that work in a certain way under the hood. However, there
    are several other types of services out there, and if you want to use them, you
    will need to add some functionality to OpenRefine in the form of extensions. So,
    before we can show you how to add those services, we first have to explain how
    to install OpenRefine extensions. Not all extensions offer reconciliation services,
    so this recipe describes the general installation procedure. At the time of writing,
    several OpenRefine extensions are available, including the following points:


    - The RDF extension by Digital Enterprise Research Institute (DERI), which adds
    support for RDF export and reconciliation with SPARQL endpoints. We''ll explain
    both terms in the next recipe.

    - The Named-Entity Recognition (NER) extension written by one of the authors of
    this book, which allows you to extract URLs from full-text fields. Usage of this
    extension is covered in detail in the last recipe of this chapter.


    Like OpenRefine, all extensions are available freely. An up-to-date list of available
    extensions is maintained at https://github.com/OpenRefine/OpenRefine/wiki/Extensions,
    which also includes their download locations. As the extensions are very diverse,
    it might look tricky to install them. However, this recipe will show you the technique
    to install any extension.


    First, you will have to find the path where extensions need to be installed. This
    depends on your operating system, but OpenRefine can help you find it. At the
    bottom of the starting page, there is a link called Browse workspace directory.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_84_0.png)


    If you click on this link, you will end up in the OpenRefine application folder
    (at least on Windows and Mac; for Linux, read on). In this folder, you have to
    create a new folder called extensions if it doesn''t exist yet. This will be the
    path in which you need to add the extensions. For the different operating systems,
    it should look like the following points:


    - Windows: C:\Documents and Settings\(your username)\Application Data\OpenRefine\extensions
    or possibly in the Local Settings folder instead at C:\Documents and Settings\(your
    username)\Local Settings\Application Data\OpenRefine\extensions

    - Mac OS X: /Users/(your username)/Library/Application Support/OpenRefine/extensions
    or, starting from your home folder, in /Users/(your username)/Library/Application
    Support/OpenRefine/extensions

    - Linux: /home/refine/webapp/extensions


    The next step is to download an extension and to place it in the folder. For instance,
    let''s install the RDF extension. Download the extension from http://refine.deri.ie/;
    this will get you a ZIP file in your downloads folder. Unpack the contents of
    this ZIP archive in the way you''re used to. Depending on the software you use,
    additional folders might be generated, but the folder we are interested in is
    called rdf-extension.


    Move this folder to the OpenRefine''s extensions folder we found earlier. In the
    extensions folder, you should now see a folder called rdf-extension, which in
    turn contains other folders, such as images, MOD-INF, scripts, and styles.


    Now restart OpenRefine to make the extension active. Just closing the browser
    window is not enough; you have to actually close the OpenRefine application itself
    by right or control-clicking on its icon on the bottom of your screen and choosing
    Close. Then, start OpenRefine again as usual and open a project. When the project
    has loaded, a new RDF button in the top-right tells you that the installation
    has been successful:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_85_0.png)


    If you don''t see the button, make sure that the right extension folder has been
    placed in the correct location and that OpenRefine has been properly restarted.


    You can repeat the steps in this recipe for other extensions as well. In the next
    recipes, we will use the RDF extension, so make sure to install it. In a later
    recipe, we will also need the NER extension, so you should install that as well
    while you''re at it.


    ## Recipe 3 – adding a reconciliation service


    For this recipe, you need to have installed the RDF extension. If you didn''t,
    have a look at the previous recipe. If you did, you might wonder what the terms
    RDF and SPARQL mean, as they are used throughout this extension. This will become
    clear right now.

