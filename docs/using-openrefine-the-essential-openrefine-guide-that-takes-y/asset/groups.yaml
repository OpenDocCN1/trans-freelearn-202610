- raw:
  - '[PAGE 26]


    Before starting to profile and clean your data, it is important to get to know
    them well and to be at ease with OpenRefine: have a look at each column (using
    the horizontal scrollbar) to verify that the column headers have been parsed correctly,
    that the cell types were rightly guessed, and so on. Change the number of rows
    displayed per page to 50 and go through a few pages to check that the values are
    consistent (ideally, you should already have done so during preview before creating
    your project). When you feel that you are sufficiently familiar with the interface,
    you can consider moving along to the next recipe.


    # Recipe 4 – manipulating columns


    In this recipe, you will learn how the columns in OpenRefine can be **collapsed**
    and **expanded** again, **moved** around in any direction, or **renamed** and
    **removed** at leisure.


    Columns are an essential part of OpenRefine: they contain thousands of values
    of the same nature and can be manipulated in a number of ways.


    # Collapsing and expanding columns


    By default, all columns are expanded in OpenRefine, which can be cumbersome if
    there are many in the project. If you want to temporarily hide one or more columns
    to facilitate the work on the others, click on the dropdown in any column to show
    the menu and select **View**. Four options are available to you:


    +   - Collapse this column

    +   - Collapse all other columns

    +   - Collapse columns to left

    +   - Collapse columns to right'
  - '[PAGE 27]


    Here is a screenshot of the Powerhouse dataset after navigating to **View | Collapse
    all other columns** on the column **Categories**. To expand a column again, just
    click on it. To expand all of them and go back to the initial view, see the *Moving
    columns around* section in this recipe.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_27_0.png)


    # Moving columns around


    In some cases, it might be useful to change the order of the columns from the
    original file, for instance, to bring together columns that need to be compared.
    To achieve this, enter the menu of the chosen column and click on **Edit column**.
    Again, four options are available at the bottom of the submenu:


    +   - Move column to beginning

    +   - Move column to end

    +   - Move column to left

    +   - Move column to right'
  - '[PAGE 28]


    If you want to reorder the columns completely, use the first column called **All**.
    This column allows you to perform operations on several columns at the same time.

    The **View** option offers a quick way to collapse or expand all columns, while
    **Edit columns | Re-order / remove columns...** is an efficient way to rearrange
    columns by dragging them around or suppressing them by dropping them on the right,
    as shown in the following screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_28_0.png)


    # Renaming and removing columns


    Under the same **Edit column** menu item, you also have the possibility to:


    +   - Rename this column

    +   - Remove this column


    You could use renaming to suppress the unnecessary dot at the end of the **Description**
    column header, for instance. Removing a column is clearly more radical than simply
    collapsing it, but this can nevertheless be reversed, as you will learn by reading
    *Recipe 5 – using the project history.*


    # Recipe 5 – using the project history


    In this recipe, you will learn how you can go back in time at any point in the
    project''s life and how to navigate through the history even if your project has
    been closed and opened again.'
  - '[PAGE 29]


    A very useful feature of OpenRefine is its handling of the history of all modifications
    that affected the data since the creation of the project. In practice, this means
    that you should never be afraid to try out things: do feel free at all times to
    fiddle with your data and to apply any transformation that crosses your mind,
    since everything can be undone in case you realize that it was a mistake (even
    if months have passed since the change was made).


    To access the project history, click on the **Undo / Redo** tab in the top-left
    of the screen, just next to the **Facet / Filter** one, as shown in the following
    screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_29_0.png)


    In order to turn back the clock, click on the last step that you want to be maintained.
    For instance, to cancel the removal of the column **Provenance (Production)**
    and all subsequent steps, click on **2. Rename column Description. to Description.**
    Step 2 will be highlighted, and steps 3 to 5 will be grayed out. This means that
    the renaming will be kept, but not the next three steps. To cancel all changes
    and recover the data as they were before any transformation was made, click on
    **0. Create project**. To undo the cancellation (redo), click on the step up to
    which you want to restore the history: for instance, click on **4. Reorder rows**
    to apply steps 3 and 4 again, while maintaining the suppression of step 5 (rows
    removing).'
  - "[PAGE 30]\n\nBe cautious, however, that going back and doing something else will\
    \ erase all subsequent steps. For instance, if you go back from step 5 to step\
    \ 2 and then choose to move the column **Description** on the left, step 3 will\
    \ now read **3. Move column description to position 1** and the gray steps in\
    \ the preceding screenshot will disappear for good: you cannot have two conflicting\
    \ histories recorded at the same time. Be sure to experiment with this in order\
    \ to avoid nasty surprises in the future.\n\nIt is important to notice that only\
    \ the operations actually affecting data are listed in the project history. Visual\
    \ aids such as switching between the rows and records view, displaying less or\
    \ more records on a page, or collapsing and expanding columns again, are not really\
    \ transformations and are therefore not saved. A consequence is that they will\
    \ be lost from one session to the other: when you come back to a project that\
    \ was previously closed, all columns will be expanded again, whereas renamed and\
    \ removed columns will still be the way you left them last time, along with every\
    \ other operation stored in the project history. In *Chapter 2, Analyzing and\
    \ Fixing Data*, we will see that this is also true for other types of operations:\
    \ while cell and column transformations are registered in the history, filters\
    \ and facets are not.\n\nNote that operation history can also be extracted in\
    \ JSON format by clicking on the **Extract...** button just under **Undo / Redo**.\
    \ This will allow you to select the steps you want to extract (note that only\
    \ reusable operations can be extracted, which excludes operations performed on\
    \ specific cells), which will then be converted into JSON automatically and can\
    \ then be copy-pasted. Steps 1 and 2 from the preceding screenshot would be expressed\
    \ as:\n\n```\n[\n  {\n    \"op\": \"core/column-move\",\n    \"description\":\
    \ \"Move column Registration Number to position 1\",\n    \"columnName\": \"Registration\
    \ Number\",\n    \"index\": 1\n  },\n  {\n    \"op\": \"core/column-rename\",\n\
    \    \"description\": \"Rename column Description. to Description\",\n    \"oldColumnName\"\
    : \"Description.\",\n    \"newColumnName\": \"Description\"\n  }\n]\n```\n\n#\
    \ Downloading the example files\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_30_0.png)\n\
    \nYou can download the example files for all Packt books you have purchased from\
    \ your account at http://www.packtpub.com. If you purchased this book elsewhere,\
    \ you can visit http://www.packtpub.com/support and register to have the files\
    \ e-mailed directly to you."
  - '[PAGE 31]


    In the preceding code, **op** stands for operation, **description** actually describes
    what the operation does, and other variables are parameters passed to the operation
    (function). Steps that were previously saved as JSON in a text file can subsequently
    be reapplied to the same or another project by clicking on the **Apply...** button
    and pasting the extracted JSON history in the text area. Finally, in case you
    have performed several hundreds of operations and are at a loss to find some specific
    step, you can use the **Filter** field to restrict the history to the steps matching
    a text string. A filter on remove, for instance (or even on rem), would limit
    the displayed history to steps 3 and 5.


    # # Recipe 6 – exporting a project


    In this recipe, you will explore the various ways to save your modified data in
    order to reuse them in other contexts, including **templating** that allows for
    any custom export format to be used.


    Although you may already have moved, renamed, or even removed columns, none of
    these modifications have been saved to your original dataset (that is, the chapter1.tsv
    file from *Recipe 1 – installing OpenRefine* has been left untouched). In fact,
    unlike most spreadsheet softwares that directly record changes into the files
    opened with them, OpenRefine always works in memory on an internal copy of the
    data. While this is an extra safety catch, it also means that any modified data
    needs to be exported before they are shared with others or injected in another
    application. The **Export** menu in the top-right of the screen allows you to
    do just that:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_31_0.png)'
