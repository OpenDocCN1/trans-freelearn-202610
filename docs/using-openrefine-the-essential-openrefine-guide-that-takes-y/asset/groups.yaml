    Text facet in the Categories column menu. The result of this facet appears in
    the Facet/Filter tab on the left of the screen. Too bad; OpenRefine informs us
    that there are a total of 14,805 choices, which is far too much to display for
    memory''s sake. In fact, the default upper bound for facet choices is only 2,000.
    We could attempt to get over this limitation by clicking on the Set choice count
    limit link and raising the upper limit to 15,000, for instance, but beware that
    this is likely to slow down the application, especially if you did not change
    the default RAM allocation (refer to Recipe 7 – going for more memory, of Chapter
    1, Diving Into OpenRefine).


    > If you choose to raise the limit in the pop-up window, what OpenRefine really
    does is change the value of a Java variable called ui.browsing.listFacet.limit.
    While in most cases you will not need to bother about this barbaric name, it might
    come in handy if you realize that you increased the value too much and want to
    get it down again. In fact, OpenRefine will always offer to step up when the choice
