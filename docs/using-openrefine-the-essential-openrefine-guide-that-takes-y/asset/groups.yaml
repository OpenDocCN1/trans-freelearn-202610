    \ **View**。有四个选项可供选择：\n\n- Collapse this column\n- Collapse all other columns\n\
    - Collapse columns to left\n- Collapse columns to right\n\n以下是导航到 **View | Collapse\
    \ all other columns** 在列 **Categories** 上后的 Powerhouse 数据集的截图。要再次展开列，只需点击它。要展开所有列并返回初始视图，请参阅本菜谱中的\
    \ *Moving columns around* 部分。\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_27_0.png)\n\
    \n### Moving columns around\n\n在某些情况下，可能需要更改原始文件中的列顺序，例如，将需要比较的列放在一起。为此，进入所选列的菜单并点击\
    \ **Edit column**。再次，在子菜单底部有四个选项：\n\n- Move column to beginning\n- Move column\
    \ to end\n- Move column to left\n- Move column to right\n\n如果你想完全重新排序列，请使用第一个名为\
