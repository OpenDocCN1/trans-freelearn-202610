  - '[PAGE 60]


    # Recipe 1 – handling multi-valued cells


    It is a common problem in many tables: what do you do if multiple values apply
    to a single cell? For instance, consider a clients table with the usual name,
    address, and telephone fields. A typist is adding new contacts to this table,
    when he/she suddenly discovers that Mr. Thompson has provided two addresses with
    a different telephone number for each of them. There are essentially three possible
    reactions to this:


    +   - **Adding only one address to the table**: This is the easiest thing to do,
    as it eliminates half of the typing work. Unfortunately, this implies that half
    of the information is lost as well, so the completeness of the table is in danger.

    +   - **Adding two rows to the table**: While the table is now complete, we now
    have redundant data. Redundancy is also dangerous, because it leads to error:
    the two rows might accidentally be treated as two different Mr. Thompsons, which
    can quickly become problematic if Mr. Thompson is billed twice for his subscription.
    Furthermore, as the rows have no connection, information updated in one of them
    will not automatically propagate to the other.

    +   - **Adding all information to one row**: In this case, two addresses and two
    telephone numbers are added to the respective fields. We say the field is overloaded
    with regard to its originally envisioned definition. At first sight, this is both
    complete yet not redundant, but a subtle problem arises. While humans can perfectly
    make sense of this information, automated processes cannot. Imagine an envelope
    labeler, which will now print two addresses on a single envelope, or an automated
    dialer, which will treat the combined digits of both numbers as a single telephone
    number. The field has indeed lost its precise semantics.


    Note that there are various technical solutions to deal with the problem of multiple
    values, such as table relations. However, if you are not in control of the data
    model you are working with, you''ll have to choose any of the preceding solutions.


    Luckily, OpenRefine is able to offer the best of both worlds. Since it is also
    an automated piece of software, it needs to be informed whether a field is **multi-valued**
    before it can perform sensible operations on it. In the Powerhouse Museum dataset,
    the **Categories** field is multi-valued, as each object in the collection can
    belong to different categories. Before we can perform meaningful operations on
    this field, we have to tell OpenRefine to somehow treat it a little different.'
  - '[PAGE 61]


    Suppose we want to give the **Categories** field a closer look to check how many
    different categories are there and which categories are the most prominent. First,
    let''s see what happens if we try to create a text facet on this field by clicking
    on the dropdown next to **Categories** and navigating to **Facet | Text Facet**
    as shown in the following screenshot. As you might remember from *Chapter 2, Analyzing
    and Fixing Data* this doesn''t work as expected because there are too many combinations
    of individual categories. OpenRefine simply gives up, saying that there are 14,805
    choices in total, which is above the limit for display. While you can increase
    the maximum value by clicking on **Set choice count limit**, we strongly advise
    against this. First of all, it would make OpenRefine painfully slow as it would
    offer us a list of 14,805 possibilities, which is too large for an overview anyway.
    Second, it wouldn''t help us at all because OpenRefine would only list the combined
    field values (such as Hen eggs | Sectional models | Animal Samples and Products).
    This does not allow us to inspect the individual categories, which is what we''re
    interested in.


    To solve this, leave the facet open, but go to the **Categories** dropdown again
    and select **Edit Cells | Split multi-valued cells...** as shown in the following
    screenshot:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_61_0.png)


    OpenRefine now asks **What separator currently separates the values?**. As we
    can see in the first few records, the values are separated by a vertical bar or
    pipe character, as the horizontal line tokens are called. Therefore, enter a vertical
    bar `|` in the dialog. If you are not able to find the corresponding key on your
    keyboard, try selecting the character from one of the Categories cells and copying
    it so you can paste it in the dialog. Then, click on **OK**.'
