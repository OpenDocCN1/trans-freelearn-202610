  - '[PAGE 19]


    # # Diving Into OpenRefine


    In this opening chapter, we will discover what OpenRefine is made for, why you
    should use it, and how. After a short introduction, we will go through seven fundamental
    recipes that will give you a foretaste of the power of OpenRefine:


    +   - Recipe 1 – installing OpenRefine

    +   - Recipe 2 – creating a new project

    +   - Recipe 3 – exploring your data

    +   - Recipe 4 – manipulating columns

    +   - Recipe 5 – using the project history

    +   - Recipe 6 – exporting a project

    +   - Recipe 7 – going for more memory


    Although every recipe can be read independently from the others, we recommend
    that readers who are new to OpenRefine stick to the original order, at least for
    the first few recipes, since they provide crucial information about its general
    workings. More advanced users who already have an OpenRefine installation running
    can pick our tricks in any order they like.


    # ## Introducing OpenRefine


    Let''s face a hard fact: your data are messy. All data are messy. Errors will
    always creep into large datasets no matter how much care you have put into creating
    them, especially when their creation has involved several persons and/or has been
    spread over a long timespan. Whether your data are born-digital or have been digitized,
    whether they are stored in a spreadsheet or in a database, something will always
    go awry somewhere in your dataset.'
  - '[PAGE 20]


    <!-- no content -->'
  - '[PAGE 21]


    # Windows


    +   1. Download the ZIP archive.

    +   2. Unzip and extract the contents of the archive to a folder of your choice.

    +   3. To launch OpenRefine, double-click on `openrefine.exe`.


    # Mac


    +   1. Download the DMG file.

    +   2. Open the disk image and drag the OpenRefine icon into the `Applications`
    folder.

    +   3. Double-click on the icon to start OpenRefine.


    # Linux


    +   1. Download the gzipped tarball.

    +   2. Extract the folder to your home directory.

    +   3. In a terminal, enter `./refine` to start.


    It should be noted that, by default, OpenRefine will allocate only 1 GB of RAM
    to Java. While this is sufficient to handle small datasets, it soon becomes restrictive
    when dealing with larger collections of data. In *Recipe 7 – going for more memory*,
    we will detail how to allow OpenRefine to allocate more memory, an operation that
    also differs from one OS to the other.


    # Recipe 2 – creating a new project


    In this recipe, you will learn how to get data into OpenRefine, whether by **creating**
    a new project and loading a dataset, **opening** an existing project from a previous
    session, or **importing** someone else''s project.


    If you successfully installed OpenRefine and launched it as explained in *Recipe
    1 – installing OpenRefine*, you will notice that OpenRefine opens in your default
    browser. However, it is important to realize that the application is run locally:
    you do not need an Internet connection to use OpenRefine, except if you want to
    reconcile your data with external sources through the use of extensions (see *Appendix,
    Regular Expressions and GREL* for such advanced uses). Be also reassured that
    your sensitive data will not be stored online or shared with anyone. In practice,
    OpenRefine uses the port 3333 of your local machine, which means that it will
    be available through the URL `http://localhost:3333/` or `http://127.0.0.1:3333/`.'
