  - '[PAGE 95]


    # Regular Expressions

    and GREL


    Two more utilities are available in the advanced OpenRefine user''s toolbox: regular
    expressions and GREL. **Regular expressions** are patterns for matching and replacing
    text that come in very handy when dealing with large quantities of data. The **General
    Refine Expression Language, GREL**, gives you access to a bit of programming power
    for those cases where a specialized manipulation is necessary. This appendix will
    introduce you to both techniques.


    # Regular expressions for text patterns


    OpenRefine offers many ways to find the data you need. But what if you don''t
    know the exact text, or more commonly with large datasets, what if the text slightly
    varies from cell-to-cell? While finding all cells with a value that contains the
    letter a is easy, finding values that contain a number (or worse, the letter a
    followed by a number) is more difficult. This is where regular expressions come
    in handy.


    The purpose of a regular expression is to define a pattern of text instead of
    a precise chunk of text. It allows you to say things such as "a letter followed
    by a number" and many more complex things. Regular expressions are built from
    **character classes** that represent the characters you are looking for woven
    together by **quantifiers, anchors, choices**, and **groups**.'
  - '[PAGE 96]


    OpenRefine allows you to try out regular expressions in an easy way. Create a
    text filter on any column (the **Object Title** column in the Powerhouse Museum
    dataset is especially interesting) by clicking on its dropdown and choosing **Text
    filter**. In the newly created filter, tick the **regular expression** checkbox
    and you''re ready to go (refer to the following screenshot). The data will now
    be filtered according to the expression you enter:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_96_0.png)


    # Character classes


    Regular expressions use **character classes** (letters, numbers, whitespace) as
    an indication for the character you are looking for. For instance, if you are
    looking for letters or numbers, you can type them directly:


    +   - The pattern `Aar` will look for all texts that contain a capital A followed
    by a small a and r. If the **case sensitive** box is not ticked, the capitalization
    will not matter.

    +   - The pattern `123` finds all texts that contain this number. Note that texts
    with the number 41235 are also matched, since `123` is a textual part of that.

    +   - As you can see, this does not differ from regular text matching yet. With
    regular expressions, we can also say that we can expect any letter or any number.
    We can give a **set of characters** from which can be chosen by surrounding the
    alternatives with square brackets `[]`. We can indicate a **character range**
    in those brackets by separating the limits with a hyphen.

    +   - The pattern `[0123456789]` matches all texts that contain a number.

    +   - The pattern `[0-9]` does the same, only it is more condense. It says everything
    between 0 and 9 is fine.

    +   - Similarly, the pattern `[a-z]` matches all lowercase letters (and also uppercase
    if the case-sensitive option is not used). `[A-Z]` matches uppercase letters and
    `[a-zA-Z]` matches all letters, regardless of the case-sensitive option.

    +   - If you want to look for numbers and letters, use `[0-9a-zA-Z]`. Read this
    as "every character between 0 and 9, between a and z, or between A and Z".

    +   - As in the earlier examples, we can put several matchers next to each other.
    `analy[sz]e` will match both American (analyze) and British (analyse) spellings.'
  - '[PAGE 97]


    +   - Similarly, the expression `[0-9][a-z]` will find numbers directly followed
    by at least one letter. The expression `[a-z][0-9][0-9][0-9]` finds letters directly
    followed by at least three numbers.

    +   - If you want to find measurements such as `1 cm` or `25 in`, you will not
    find them with the preceding expressions because of the space in between. Luckily,
    a space is also a symbol, so the expression `[0-9] [a-z]` will find them. Note
    the space in between the bracket pairs, and note the fact that this will even
    find longer measurements such as `12345 meters`. Indeed, the expression matches
    a number followed by a space and a letter, so in this case, `5 m`. It doesn''t
    matter whether other numbers or letters are also present.

    +   - If you''re just looking for measurements in inches, the expression `[0-9]
    in` will do the job.

    +   - It might be a bit cumbersome to write `[0-9]` in full every time. This is
    why **shorthand character classes** were introduced. They are symbols that stand
    for a set of characters. For instance, the symbol `\d` stands for any digit and
    is thus equivalent to `[0-9]`, but a lot faster to write. The opposite is `\D`,
    which means anything that is not a digit and includes letters as well as symbols.
    Unfortunately, there is no shorthand for any letter, but there is a shorthand
    for any letter, number, or underscore, which is `\w`, which stands for any word
    character. Again, the opposite is `\W`, which matches for all non-letters and
    non-numbers that are not underscores either.

    +   - `\d [a-z]` will again match for texts with measurements: any number followed
    by a space and a letter.

    +   - `\d\d\d` matches texts with numbers with a length of at least three.

    +   - `\D\D` matches texts that have at least two consecutive non-numbers. If
    you''re surprised to see texts with numbers as well, think about it: the expression
    only says that the text should contain a non-number followed by a non-number;
    it doesn''t say that there should be no numbers at all. However, if a text field
    only contains numbers, it won''t be matched. To rephrase the expression means
    "I''m looking for two non-numbers in a row, do you have them?"

    +   - You might wonder how `\D` works. Does it then translate to a huge set that
    includes everything but numbers? The answer is more simple: using a caret `^`
    as the first character in braces means none of the characters should be present
    in the pattern. Therefore, `\D` stands for `[^0-9]`.

    +   - The expression `[^a-zA-Z0-9]` looks for texts that contain something which
    is not a letter or number. Most texts will match, as for instance spaces and punctuation
    marks are still allowed. However, empty fields will not match, as there must be
    at least one character which is not a letter or number.'
  - '[PAGE 98]


    +   - The expression `[^a-zA-Z0-9]\d[^a-zA-Z0-9]` means any digit surrounded by
    non-letters or non-numbers. For instance, we see that single digits in parentheses
    are matched. Note that items such as `(123)` will not be matched, but `(3)` will,
    as we explicitly say that it should be a single digit.


    If you really want to match any character, the dot `.` is what you need. This
    symbol matches anything (except newlines, which are `\n`). While that might not
    seem useful by itself, it is very useful when combined with other character classes:


    +   - The pattern `a.a.a` matches any text where an a is followed by any character,
    another a, any character, and another a. For instance, texts with the words `dulcamara`,
    `alabaster`, and `salamander` will match.

    +   - The pattern `19..` (there is a space before and after) will match years
    in the 20th century.

    +   - However, you should be careful with the dot: the last pattern also matches
    `19th` and `19$`, because a dot really means anything. If a year is what you want,
    `19\d\d` is more accurate.


    Now, you might wonder what to do if you want to match an actual dot, actual square
    brackets, or an actual backslash followed by a "d". The trick is to tell in the
    regular expression when you don''t want a symbol to be recognized as something
    special. For letters, numbers, spaces, and a few other characters, this is the
    default. Characters that have a special meaning need to be escaped by preceding
    them with a backslash `\`. A literal dot is thus represented as `\.`; the backslash
    itself as `\\`.


    +   - To find texts that have three consecutive dots in them, use `\. \. \.`.
    (This can actually be done in a more handy way, as we''ll see in the next section.)

    +   - To find texts with a backslash, use `\\`. (There are none in the dataset.)

    +   - Texts that contain an opening or a closing square bracket are found with
    `[\[\]]`. This looks complicated, but it is quite logical: the first and last
    bracket say "choose any of the things within". And the things within are actual
    square brackets, but they have to be escaped, so they become `\[` and `\]`.

    +   - With `[2]`, you find texts that contain the number 2 ("choose any of the
    things within", and the only thing within is a 2). With `\[2\]`, you find texts
    with the number 2 surrounded in square brackets, as the brackets are escaped this
    time and thus have no special meaning anymore.'
