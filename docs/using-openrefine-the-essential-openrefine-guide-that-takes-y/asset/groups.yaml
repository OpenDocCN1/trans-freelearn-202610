  - '[PAGE 71]


    To increase our confidence in cell transformations, we should probably try it
    again. Suppose we want to change semicolons into commas in the **Provenance**
    column. Click on the **Provenance (Production)** dropdown, **Edit cells, Transform...**,
    and type in the expression `value.replace(";", ",")`. The expression itself looks
    fine, but we see several error messages in the preview pane. This might be an
    opportunity to test the different **On error** settings (and I encourage you to
    do this), but we should actually reflect on what went wrong. The error messages
    read: **Error: replace expects 3 strings, or 1 string, 1 regex, and 1 string;**
    so somehow, our expression is passing the wrong input to replace. If we look at
    the values where this error message occurs, we see that null values are the culprit.
    Indeed, null is not a string, so we cannot replace characters inside of it. We
    need to tell OpenRefine that only non-empty cells must be transformed. Close the
    dialog by clicking on **Cancel**, click on the **Provenance (Production)** dropdown,
    and choose **Text filter**. Although we might have opted to select **Facet by
    blank**, we can save a little processing time by only transforming those cells
    that actually contain a semicolon. Enter ; in the text filter, which will filter
    out all other values. Now retry the cell transformation and you will see that
    the transformation is only applied to the selected cells without causing any errors.


    Finally, to show the power of cell transformations, we are going to do something
    really sophisticated. Although the vertical bars have now been changed into commas,
    there is still a problem with the **Categories** field. Indeed, several objects
    have the same category more than once, such as Record 14: **Didactic displays,
    Pearl shells, Buttons, Didactic displays**. Unfortunately, we cannot solve this
    the same way we eliminated duplicate rows before, because the duplicates here
    occur within one row. Luckily, GREL can help us. Open the transformation dialog
    on the **Categories** column and enter the following expression: `value.split(",
    ").uniques().join(", ")`. This expression looks complicated, but it is easy to
    understand the different parts: first, the value is split on every , (a comma
    followed by a space), then the unique values are retained with the `uniques` function,
    and finally they are joined back together. When you click on **OK**, OpenRefine
    will apply the transformation and inform you how many cells have been affected.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_71_0.png)


    # Mastering GREL is easy


    This recipe introduced a few examples, but what if that doesn’t fulfill your needs?
    *Appendix A, Regular Expressions and GREL* will introduce you to GREL so you can
    learn how to build expressions yourself.'
  - '[PAGE 72]


    # Recipe 5 – adding derived columns


    Sometimes you do want to transform the contents of a cell, but also keep the original
    value. While you can go back to a cell''s previous state using the Undo / Redo
    tab if something went wrong, it could be useful to see both the original value
    and the transformed value at the same time. Therefore, OpenRefine enables you
    to add a column based on another one.


    Suppose we want to have a separate field that counts the number of categories
    per record. Click on the Categories dropdown, click on Edit column and Add column
    based on this column... A dialog very similar to the cell transformation dialog
    pops up; however, this time it additionally asks for a column name. Enter Category
    Count into the New column name field. Now, we have to create the expression that
    will count the number of categories. Since all categories are separated by a character
    (a vertical bar, or a comma if you followed the last recipe), we can simply split
    them and count the number of segments. This expression does the trick: value.split(",").length().
    The Preview pane shows the result for the first view cells, and it looks alright,
    so click on OK.


    OpenRefine has now created a new column. We can now use the Category Count column
    to analyze our data. For instance, we can create a facet by clicking on the Category
    Count dropdown and navigating to Facet | Text facet. Note that a text facet is
    easier here, even though the data is numeric, because we don''t want to select
    ranges, but rather we want to inspect the individual counts. The facet appears
    on the left, informing us of how many objects have a specific number of categories
    assigned to them as shown in the following screenshot:'
  - '[PAGE 73]


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_73_0.png)


    We also note something strange: one of the values is (blank). If we click on it,
    we see that all corresponding records have an empty Categories field. Why doesn''t
    the Category Count column just display that there are 0 categories? The answer
    is that for those empty cells, the transformation expression has resulted in an
    error because there was no value to split. As in the previous recipe, we could
    have filtered out those rows before we started the transformation. Instead, let''s
    fix these rows. With the (blank) choice still highlighted in the facet, click
    on the Category Count column dropdown and navigate to Edit cells | Transform....
    If we enter 0 as the expression and click on OK, the blank cells now contain 0.
    Don''t be confused if you don''t see any rows now: the blank filter is still active
    in the facet. Click on the 0 filter (or any other one) and you will see the data
    you expect.


    From a data analysis standpoint, it is now interesting to see what numbers of
    categories per record are common. In the Category Count facet, set the Sort by:
    setting to count. We can now conclude that 2 categories per record is the most
    common case. Note that these numbers are all the more adequate if you have clustered
    the values and then removed duplicates, as indicated in the previous recipes.
    Once again, GREL has saved the day.'
  - '[PAGE 74]


    # # Recipe 6 – splitting data across columns


    We started this chapter by showing how you could split multiple values in a single
    cell across different rows. However, this might not always be what you want. In
    the examples so far, each of the different values had an identical role: one category
    is just like any other, and their order is interchangeable. The situation is different
    when a field is overloaded with different types of values. This can happen, for
    instance, when a `Clients` table contains a telephone field but no e-mail field
    and a contact person has provided both pieces of information. As a result, the
    person''s telephone number and e-mail address could end up in the same field,
    separated by a slash.


    We see a similar situation happen in various columns of the Powerhouse Museum
    Collection data. For instance, in the **Provenance** field, we see information
    about designers, makers, and various other things. It could be meaningful to put
    those in different columns so we can analyze them separately. To do this, click
    on the **Provenance (Production)** dropdown and navigate to **Edit column | Split
    into several columns…**. We then see a dialog with various splitting options:


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_74_0.png)


    We can choose between splitting **by separator**, which is what we have done so
    far, or **by field lengths**. The latter is meaningful if your field contains
    structured data such as `1987 en-us,x/Y`, where there are no fixed separators
    (or none at all). However, our data uses a simple separator. An interesting option
    is to set a limit, as there might otherwise be a lot of columns, so it might be
    wise to set it to something like 5. Don''t forget to match the separator with
    the one of the data, which is the vertical bar `|` in our case. You can choose
    to let OpenRefine guess the cell type after the split (in case you have numeric
    values for instance) and to remove the original column.'
  - '[PAGE 75]


    After you click on **OK**, you will see that OpenRefine has replaced the one column
    called Provenance (Production) with several numbered columns called Provenance
    (Production) 1, Provenance (Production) 2, and so on, which can later be renamed
    according to the values they contain. Not all of the columns contain a value;
    values are found only in those records that had at least 5 items in the field.
    Although splitting will never create more columns than the limit you have set,
    it is possible that less columns are created if not as many values actually occur
    within a cell.


    Another candidate for splitting is the **Object Title** column. We see that in
    some fields, the title is preceded by a number. It would prove interesting to
    split the number from the actual title. First, let''s filter out the columns that
    start with a number. Click on the **Object Title** dropdown and click on **Text
    filter**. We need to write `starts with a number` in this field, which we can
    express with the regular expression `^\d`. This tells the filter to start at the
    beginning (`^`) and look for any digit (`\d`). Don''t forget to tick the **regular
    expression** checkbox though, or OpenRefine will try to find that expression literally.
    We now only see titles that start with a number.


    Click on the **Object Title** dropdown again and navigate to **Edit column | Split
    into several columns....** We now use a single space as a separator, indicate
    that we want at most 2 columns, and then click on **OK**. The description number
    and title have moved to separate columns.


    Splitting columns is far more powerful than splitting multi-valued cells as you
    have several configuration options. You can even use a regular expression to define
    the separator, which can then be different depending on the context. By the way,
    if this recipe made you curious about regular expressions, don''t forget to check
    out *Appendix A, Regular Expressions and GREL*, which introduces them in more
    detail.


    # Recipe 7 – transposing rows and columns


    Sometimes data is not arranged into rows and columns the way you like. Indeed,
    there are different ways of arranging what belongs where, and the choices depend
    on the situation. In the Powerhouse Museum dataset, for instance, there are separate
    columns for several dimensions: Height, Width, Depth, Diameter, and Weight. However,
    not many objects have data for these columns, so the cost of maintaining them
    might be high with respect to the value they add. An alternative would be to transform
    these five columns into two columns: one that contains the name of the dimension
    (for instance, Height or Weight) and another that contains the measurement (for
    instance, 35mm or 2kg).'
