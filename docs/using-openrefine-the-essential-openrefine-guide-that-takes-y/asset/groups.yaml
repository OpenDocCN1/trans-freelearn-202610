  - '[PAGE 86]


    The **Resource Description Framework (RDF)** is a model for data that can be interpreted
    by machines. While humans can read HTML on the Web, machines do not understand
    natural language and must therefore be given information in another form. Disambiguation
    is an important aspect; does Washington refer to the city or the person? And which
    person? To express this, information in RDF is referred to by URIs or URLs, just
    like we do with reconciliation in OpenRefine. This is why RDF comes in handy for
    reconciliation.


    The **SPARQL Protocol and RDF Query Language** (a recursive acronym for **SPARQL**)
    is a language for querying RDF datasources. Traditional relational databases use
    SQL as a query language; RDF databases and important for us, reconciliation services,
    communicate in SPARQL.


    If you want to reconcile your data with an RDF datasource, then you must tell
    OpenRefine how it must communicate with this datasource. When you installed the
    RDF extension, you already added support for SPARQL to OpenRefine. However, before
    we can reconcile our cell values to URLs, we must configure the datasource. To
    do this, click on the new RDF button in the top-right and navigate to **Add reconciliation
    service | Based on SPARQL endpoint....** Note that you can also reconcile with
    a local RDF file, which is handy if you have your own dataset of URLs. OpenRefine
    shows you the **Add SPARQL-based reconciliation service** dialog.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_86_0.png)'
  - '[PAGE 87]


    This dialog allows you to choose a name for the SPARQL endpoint, to add the endpoint''s
    details (where it is located and how it works), and what kind of information is
    used to match the cell value to a URL. You can use a SPARQL endpoint of your own
    or any of the publicly available endpoints listed at `http://www.w3.org/wiki/SparqlEndpoints`.


    For this example, we will use an endpoint that we have set up. It includes a processed
    version of the publicly available **Library of Congress Subject Headings (LCSH)**
    dataset. To use this endpoint, fill out the details as follows:


    +   - **Name:** LCSH

    +   - **Endpoint URL:** `http://sparql.freeyourmetadata.org/`

    +   - **Graph URI:** `http://sparql.freeyourmetadata.org/authorities-processed/`

    +   - **Type:** Virtuoso

    +   - **Label properties:** tick only **skos:prefLabel**


    The **Endpoint URL** is the address where the endpoint is located, and the **Graph
    URI** identifies which dataset within this endpoint should be used. The **Type**
    of the endpoint is used to indicate the underlying endpoint software; it is not
    mandatory to specify this, but knowing the correct type enables low-level tricks
    that greatly improve the reconciliation speed. Finally, the **Label properties**
    indicate names of fields that can be used to look up the cell value. In RDF, these
    properties usually have common names (which are in fact mostly URLs themselves).
    Once these properties have been set, click on the **OK** button.


    As nothing happens right now, you might be curious to know how you can check whether
    the new reconciliation has been added properly. You can verify this by bringing
    up the reconciliation dialog by going to the **Categories** dropdown and navigating
    to **Reconcile | Start reconciling...**. On the left-hand side, you will see the
    newly added service. Now read on to the next recipe if you can''t wait to start
    using it!


    # # Recipe 4 – reconciling with Linked Data


    In the previous recipe, we talked about RDF and SPARQL without sketching the broader
    context in which these technologies were created, so let''s introduce them now.
    Around the year 2000, web researchers and engineers were noticing that humans
    were no longer the only consumers of the Web; more and more machine clients, and
    thus pieces of software, started using the Web for various purposes. However,
    every such piece of software had to be hardcoded for a particular task, and they
    could not parse the natural language in documents on the human Web. Therefore,
    a vision called the **Semantic Web** was coined, a Web in which information would
    also be interpretable for machines. This was the start of RDF and SPARQL.'
  - '[PAGE 88]


    # Linking Datasets


    However, the vision was rather abstract and difficult to many people. Several
    of the concepts relied on concepts such as ontologies and reasoning, which can
    become very complex rapidly. *Tim Berners-Lee*, inventor of the Web and one of
    the creators of the Semantic Web vision, realized this and launched the Linked
    Data principles (http://www.w3.org/DesignIssues/LinkedData.html). These principles
    shifted the focus of the Semantic Web to the creation of data that was interlinked
    with other datasets. The principles are as follows:


    +   1. Use URIs as names for things

    +   2. Use HTTP URIs so that people can look up those names

    +   3. When someone looks up a URI, provide useful information using the standards
    (RDF, SPARQL)

    +   4. Include links to other URIs so that they can discover more things


    So, the first principle asks to use unambiguous identifiers for your concepts
    and the second principle asks specifically for HTTP URIs, which are thus URLs.
    These principles have been used in the datasets we will use for reconciliation.
    The third principle is concerned with how your data is published. In fact, the
    RDF extension allows us to export our dataset as RDF, so that''s covered as well.
    The fourth principle is about linking to other datasets, which is exactly what
    reconciliation will do for us.


    Without further ado, let''s start reconciliation. Like in *Recipe 1 – reconciling
    values with Freebase*, go to the **Categories** dropdown and navigate to **Reconcile
    | Start reconciling...**, which will bring up the reconciliation dialog on your
    screen. This time, however, select the **LCSH reconciliation service** from the
    left-hand side which you installed in the previous recipe. OpenRefine will now
    try out some of the cell values to see if it can determine its type. After a few
    seconds, it suggests that the values have type skos:Concept. This is indeed true,
    as all **Category** values are in fact concepts. You can leave all settings as
    they are and click on **Start Reconciling**.


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_88_0.png)


    When the reconciliation is done, you will notice three things. First, OpenRefine
    has created the two facets that help us find matched and unmatched rows. Second,
    you see a green bar on top of the **Category** column, which indicates how many
    of the cell values have been reconciled. Third, the cell values are displayed
    differently; some of them are in blue and others have new options.'
  - '[PAGE 89]


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_89_0.png)


    Let''s first focus on the reconciled values displayed in blue. The more of them
    you see, the more successful the reconciliation has been (and thus, the greener
    the bar on top of the column will be). They are blue because they are in fact
    links; if you click on them, you end up on the page with the URL the term has
    been reconciled to. For instance, if we click on the **Specimens** link, we are
    directed towards `http://id.loc.gov/authorities/subjects/sh87006764.html`, which
    is indeed the entry for Specimens in the Library of Congress Subject Headings.
    So this is how we create Linked Data; instead of just the string Specimens, which
    looks like nine random characters to a computer, OpenRefine reconciled the value
    with a URL. This URL can be interpreted by a machine, as that URL in turn links
    to other URLs that help define its meaning.


    When you see unreconciled values in black, you have not been so lucky for this
    particular term. They are not links, so OpenRefine has not been able to find a
    matching URL automatically. There are two cases of unreconciled values; first,
    those where some suggestions have been found, but OpenRefine was not able to find
    the right one. In that case, it will list several alternatives for you. If any
    of those alternatives is correct, you can either click on the single checkmark,
    which will replace only the current cell value by the chosen term, or the double
    checkmark, which will replace all cells that have the same value. Be careful when
    replacing all identical values though, as some might actually refer to another
    term. Note that you can also click on the suggestions, which will bring you to
    their corresponding web page for more information.


    The other case with unreconciled values is when OpenRefine did not find any suggestions.
    In that case, you''re out of luck. Maybe the term in question does not exist in
    the dataset you''re reconciling against, or maybe it is named differently. In
    any case, the only thing you can do is assign a URL manually. To do this, click
    on the **search for match** link, which will show you a dialog that helps with
    finding the correct match.'
