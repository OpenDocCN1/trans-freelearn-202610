    个单元格被转换，这可能意味着巨大的质量问题，但实际上只是小题大做。被转换的值只是整数，在转换过程中被转换为字符串（因为数字没有大小写）。你可以通过先在 **Registration
    Number** 列上添加一个数值分面，然后启动大小写转换并观察数值消失，被一条信息取代，告知你没有数值存在，来自行检查。


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_54_0.png)


    同样，我们可以使用 **To lowercase** 来验证持久链接 URL 中是否不存在大写字母，或使用 **To titlecase** 来标准化类别的拼写，例如将
    Didactic Displays 和 Didactic displays 之间的差异平滑处理。然而，**To titlecase** 仅在空白字符后保留大写字母，因此
    **Spacecraft | Models | Space Technology** 将被转换为 **Spacecraft | models | space
    Technology**，这远非理想。不过现在不必太在意这个问题，因为 *第 3 章，高级数据操作* 将介绍一种更好、更强大的处理此类情况的方法：聚类。


    在 Recipe 2 – faceting data 中，我们使用了其中一种类型转换。事实上，你可能还记得，时间表达式必须先转换为日期（即 OpenRefine
    对日期的内部格式，为 yyyy-mm-ddThh:mm:ssZ），我们才能对其使用时间线分面。同样的方法也适用于将值转换为文本或数字。我们可以将记录 ID
    转换为文本，以便能够对其使用重复项分面，但随后在排序时（以避免 10 被排在 2 之前）或使用数值分面时，我们需要再次将其转换回数字。


    OpenRefine 为我们预定义的最后一个转换相当粗暴；Blank out cells 正如其名，它会删除给定列中的所有值。当然，这最好在行子集上使用，而不是整个数据集。一个有用的组合是标记出对某个字段具有问题值的行，导航到
    All | Facet | Facet by flag，然后对匹配的行清空单元格。


    我们现在已经完成了常用转换，但请放心，这只是冰山一角；转换的可能性无穷无尽，正如你在第 3 章，高级数据操作 和附录，Regular Expressions
    and GREL 中会发现的那样。事实上，Edit cells | Transform... 会打开自定义文本转换窗口，让你可以用 GREL 定义自己的转换。这乍听起来可能令人害怕，但请相信这是值得的。


    ## Recipe 6 – 删除匹配的行


    在本教程中，你将学习如何通过使用分面和过滤器先前筛选出的有问题行进行抑制。


    检测重复项或标记冗余行是可以的，但这只是工作的一部分。在某个时候，你会想要跨越数据剖析（或分析）与数据清洗之间的界限。实际上，这意味着在诊断阶段被识别为不合适的行（并且可能已被标记）需要从数据集中删除，因为它们会损害其质量。


    要删除行，请先确保已设置分面或过滤器，否则你将删除数据集中所有行。让我们再次从干净的项目开始（重新导入一次或切换到 Undo / Redo 选项卡并选择 0.
    Create project 以取消所有修改），看看我们能对这个数据集做哪些清理工作。另请检查 OpenRefine 显示你的数据为行，而不是记录。


    我们首先删除缺少记录 ID 的行。为此，导航到 Record ID | Facet | Numeric facet 并取消在左侧打开的分面中的 Numeric
    复选框。这会只留下 Non-numeric 被选中，并且有三行匹配。请记住 Facet by blank 不会起作用，因为这三行并非真正空白，而是在 Record
    ID 单元格中有一个单个空白字符。现在转到 All | Edit rows | Remove all matching rows 并观看行消失。


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_56_0.png)


    做得好，数据集减少了三行，不再有非数值记录 ID（正如已刷新的分面所示），数据质量已得到改善。清除分面并检查总数是否降至 75,811 行。


    接下来，我们将处理没有注册号且在博物馆收藏中也令人怀疑的行。这里没有空格干扰（你可以通过在 Registration Number 列上使用简单的文本过滤器输入单个空白字符来检查；没有匹配行），因此我们可以导航到
    Registration Number | Facet | Customized facets | Facet by blank。点击左侧的 true 以选择
    115 个对应行；它们也都是空的，因此我们可以再次选择 Remove all matching rows。


    正如你所见，删除空白行相当容易；我们现在将重点放在重复行上。重复项有点棘手，正如你在 Recipe 3 – detecting duplicates 中回忆的那样，但我们仍然想摆脱它们。开始导航到
    Registration Number | Facet | Customized facets | Duplicates facet 并点击 true 查看
    163 个匹配行。问题是，如果我们抑制所有这些行，我们不仅会删除重复项，还会删除原始值。换句话说，如果一行在数据集中出现两次，删除所有匹配行将删除两者，而不仅仅是一个。如果发生了这种情况，请记住你始终可以返回项目历史。


    因此，我们需要一种在保护原始行的同时删除重复项的方法。这可以通过以下方式实现：按列 **Registration Number** 排序，选择 **text**
    和 **a-z** 作为选项（**case sensitive** 框无需勾选，因为该字段中只有大写字母），然后基于该排序重新排列行，导航到 **Sort
    | Reorder rows permanently**。最后，通过导航到 **Registration Number | Edit cells | Blank
    down** 将重复值替换为空白，这应影响 84 个单元格。


    如果你保持重复项分面打开，你会看到它刷新为显示这 84 个匹配行。发生的情况是，原始值（原本是 163 中的一部分）现在被单独列出，因此不再被视为重复项并切换到
    **false**。真正的重复项 however 已被向下清空，因此它们现在都具有相同的值：空白。就好像它们是一个包含 84 行的大重复簇。在任何情况下，你现在可以删除这些匹配行，而原始行保持不变。


    如果一切顺利，你现在应该剩下 75,612 行。我们本可以继续进行其他删除，但你现在可能已经掌握了总体思路，所以我们将留给你自行尝试其他列。查看 **Undo
    / Redo** 选项卡中的项目历史以回顾我们所经历的步骤。


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_57_0.png)


    我们首先删除了三行空白行，随后删除了 115 行几乎空白但因其记录 ID 而存在的行。为了删除 84 个重复项，我们必须重新排序行并在列 **Registration
    Number** 上向下清空。总共，我们删除了 202 行，使数据集更加干净。请注意，文本分面和排序操作未列在历史记录中，因为它们并未影响数据，而只是作为执行删除的视觉辅助。


    ## 总结


    在本章中，我们学习了如何掌握 OpenRefine 的基础知识以分析和修复数据集，这是数据剖析和清洗的重要组成部分。


    分析数据涉及排序和各种分面的使用，也包括文本过滤器的应用和重复项的检测。


    修复数据是通过重新排序、单元格转换和删除来完成的。


    在下一章中，我们将通过深入高级数据操作，将对 OpenRefine 内部工作原理的理解提升到另一个层次。


    '
