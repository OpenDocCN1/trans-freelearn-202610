    会尝试显示所有类别，无论它们在集合中只出现一次还是出现数千次。由于要显示的类别太多，因此在第一阶段至少关注最常用的类别是有意义的。


    拖动左侧的手柄，将下限从 0 提高到 1,000。之前的文本分面会自动刷新，现在显示的类别只是那些用于描述集合中至少 1,000 个对象的类别。它们只有 7
    个，显示和浏览起来要容易得多。为了更好地了解情况，你可以选择按**计数**（从最频繁到最不频繁）而不是按**名称**（按字母顺序）对它们进行排序。


    以下截图显示了你现在应该在这两个分面中看到的内容：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_40_0.png)


    如果你想导出这七个顶级类别，只需点击**7 个选择**链接，就能以整洁的**制表符分隔值（TSV）**格式获得它们，可以随时复制并粘贴到你喜欢的文本编辑器或电子表格中。然而，这些类别中的大多数看起来都非常可疑。事实上，**Photographic
    prints | Photographs（摄影印品 | 照片）** 并不是一个单一类别，而是由竖线（管道符 |）分隔的两个类别。


    这恰恰是一开始我们有这么多选择的原因。因此，**Glass plate negatives | Gelatin dry plate negatives |
    Photographs, Glass plate negatives | Photographs, and Glass plate negatives（玻璃板底片
    | 明胶干板底片 | 照片、玻璃板底片 | 照片和玻璃板底片）**都被列为不同的选择，尽管它们包含相同的类别。然而，这就是多值单元格的弊病，我们目前还没有准备好处理它们。我们必须等到*第
    3 章“高级数据操作”*，在那里我们还将了解这个有趣的**聚类**按钮的更多信息，我们暂时故意忽略了它。


    由于类别的分面结果有些偏斜，在继续使用数值分面之前，让我们快速看一下另一个文本分面。列的选择不那么明显，但我们可以看到**高度**字段不仅包含数字，还包含数字后跟度量单位，例如**990
    mm**。这意味着我们将无法对此列应用数值分面（或者至少不能直接应用），但我们可以尝试使用文本分面，希望不会有太多不同的值需要显示。


    幸运的是，从**高度**列菜单导航到**分面 | 文本分面**，我们得知有 1,313 个选择，远低于 2,000 的默认限制。按**计数**而不是名称排序，揭示了一个令人惊讶的事实：集合中有
    **1,368** 个对象的高度恰好为 **164 mm**，而第二常见的尺寸 **215 mm** 仅出现在 **400** 个对象中。这些值可以在以下截图中看到：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_41_0.png)


    在该列表的底部，我们还可以看到有 45,501 个对象的高度值为空白，这意味着没有为它们记录任何高度。但是，我们现在不会在这些对象上多费时间，因为 OpenRefine
    为我们提供了一种专门处理空白行的分面，我们将在讨论自定义分面时发现它。


    ## 数值分面


    找到与数值分面相关的列比文本分面容易得多，因为其中几列包含数字。数字很容易发现，因为它们以绿色显示，前提是在创建项目时选中了**将单元格文本解析为数字、日期...**复选框。Record
    ID 列与其他列一样都是不错的选择，因为分面可以让我们概览 ID 的分布，并检查所有对象是否都有一个 ID。


    在“记录 ID”列菜单中，导航到**分面 | 数值分面**，查看左侧“分面/筛选”选项卡中出现的内容。文本分面返回的是不同选择的列表，而数值分面产生的是值范围，就像我们按选择计数分面时看到的那样。


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_42_0.png)


    我们可以看到“记录 ID”列的值范围从 0 到 510,000，在 270,000 和 280,000 之间有一个小间隙，在 410,000 和 500,000
    之间有一个较大的间隙。通过滑动滑块手柄，我们可以更仔细地查看 ID 大于 500,000 的 533 行。


    在图下方，值分为四类：数值、非数值、空白和由问题操作导致的错误。由于我们还没有修改这些值，所以没有发现错误，也没有发现空白，这意味着集合中的所有对象都已分配了记录
    ID。然而，有三行的值是非数值，这对 ID 来说出乎意料。让我们取消选中“数值”复选框，只选中“非数值”复选框，来进一步了解这些行。


    在右侧，我们现在可以看到三个匹配的行。它们不仅缺少记录 ID，而且所有其他列都是空白的，除了自动生成的对象持久链接和许可信息。这些行不代表实际对象，它们只是可以安全删除的空行（我们将在本章最后一个操作指南中了解如何删除）。


    然而，这里有些不对劲；如果这些行确实是空白的，为什么它们被归类为非数值而不是计入**空白**复选框之下呢？罪魁祸首是空白字符，我们可以通过编辑三个单元格中的一个来验证。为此，只需将鼠标悬停在**记录
    ID**列下的其中一个单元格上，就会出现一个小编辑按钮。点击它，自己观察一下，它们包含一个空格，如下面的截图所示：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_43_0.png)


    要纠正这种情况，请按*Backspace*或*Delete*键删除有问题的空白字符，然后点击下方的**应用到所有相同单元格**按钮，或按*Ctrl + Enter*。OpenRefine
    在屏幕顶部的黄色框中提示你，**记录 ID**列中有三个单元格已被批量编辑。因此，左侧的分面会刷新，所涉及的三个单元格会切换到“空白”框。


    在进入自定义分面之前，让我们简要提一下与数值分面相关的另外两种分面方式：时间轴分面和散点图分面。


    时间轴分面需要日期，因此类似 17/10/1890 这样的文本字符串需要先转换为日期格式。你可以尝试对**制作日期**列进行转换，但要注意真正的日期只占少数，因为它还包含年份（如
    1984）和范围（如 2006 到 2007）。不过，我们仍然可以在该列菜单中导航到**编辑单元格 | 常用转换 | 转换为日期**，将 79 个单元格转换为日期格式；例如，17/10/1890
    将被转换为 1890-10-17T00:00:00Z，其中零表示一天中的小时、分钟和秒。


    显然，在总共 75,814 个单元格中，79 个单元格并不多，但基于这些值的时间轴分面仍然会显示在 1880 年 2 月 26 日至 1952 年 1 月
    31 日这一给定日期范围内创建的对象，而大多数值要么不是时间表达式（19,820），要么是空白（55,915）。


    以下截图显示，将日期转换为 OpenRefine 的内部时间格式后，在**制作日期**列上使用时间轴分面可以得到的结果：


    ![](img/f5874463a5242c6e8e1824fdc2a73ac7_44_0.png)


    最后，散点图分面允许以图形方式表示数值。我们不会深入介绍这种分面的细节，但如果你好奇，可以自己尝试一下。


    ## 自定义分面


    现在我们已经了解了两种主要的分面类型，文本分面和数值分面，但还有更多类型存在，你可以根据自己的需求几乎任意地对数据进行分面。自定义分面正是让你做到这一点；定义你自己的分面，无论是文本类型（例如，对字符串的第一个字符进行分面），还是数值类型（例如，对一个数的平方根进行分面）。然而，它们需要对**通用提炼表达式语言（GREL）**有基本的了解，这将在*附录“正则表达式与
    GREL”*中介绍。

    '
