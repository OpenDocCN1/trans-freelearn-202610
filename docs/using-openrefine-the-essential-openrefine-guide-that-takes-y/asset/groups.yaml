  mdcn: "\n\n## 高级数据操作\n\n### 技巧 1 – 处理多值单元格\n\n在许多表格中，这是一个常见问题：当单个单元格有多个值时该怎么办？例如，考虑一个包含常规姓名、地址和电话字段的客户表。一位打字员正在向表中添加新联系人，突然发现汤普森先生提供了两个地址，且每个地址对应不同的电话号码。对此基本上有三种可能的处理方式：\n\
    \n- **只向表中添加一个地址**：这是最简单的做法，因为它省去了一半的录入工作。不幸的是，这也意味着有一半信息丢失，因此表的完整性会受到威胁。\n- **向表中添加两行**：虽然表现在完整了，但产生了冗余数据。冗余同样危险，因为它会导致错误：这两行可能意外地被当成两个不同的汤普森先生，如果汤普森先生被重复收取订阅费，这会很快成为问题。此外，由于这两行之间没有关联，更新其中一行的信息不会自动传播到另一行。\n\
    - **将所有信息添加到一行中**：在这种情况下，两个地址和两个电话号码被加入到相应字段。我们说该字段相对于其最初设想的定义而言过载了。乍一看，这既完整又不冗余，但一个微妙的问题出现了。人类能完美理解这些信息，而自动化流程却不能。想象一下信封标签打印机，它现在会在一个信封上打印两个地址；或者自动拨号器，它会把两个号码的数字合并当成一个电话号码。该字段确实失去了其精确语义。\n\
    \n请注意，有多种技术解决方案可以处理多值问题，例如表关系。但是，如果你无法控制所处理的数据模型，就只能选择前述解决方案之一。\n\n幸运的是，OpenRefine\
    \ 能够兼顾两者优点。由于它同样是一款自动化软件，在对字段执行合理操作之前，需要告知它该字段是否为**多值**。在 Powerhouse Museum 数据集中，**Categories**\
    \ 字段是多值的，因为馆藏中的每个对象可能属于不同类别。在该字段上执行有意义的操作之前，我们必须告诉 OpenRefine 以某种方式对其进行稍微不同的处理。\n\
    \n假设我们想仔细查看 **Categories** 字段，以了解其中有多少个不同类别，以及哪些类别最为突出。首先，让我们看看尝试通过点击 **Categories**\
    \ 旁边的下拉菜单并导航到**分面 | 文本分面**来创建文本分面时会发生什么，如下面的截图所示。正如你可能从*第 2 章，分析和修复数据*中记得的那样，这并不会按预期工作，因为单个类别的组合实在太多。OpenRefine\
    \ 干脆放弃，提示总共有 14,805 个选项，超出了显示上限。虽然你可以通过点击**设置选项数量限制**来增加最大值，但我们强烈建议不要这样做。首先，这会让\
    \ OpenRefine 慢得令人痛苦，因为它会给我们列出一个包含 14,805 种可能性的列表，对于概览来说无论如何都太大了。其次，这对我们毫无帮助，因为\
    \ OpenRefine 只会列出组合后的字段值（例如 Hen eggs | Sectional models | Animal Samples and Products）。这让我们无法检查单独的类别，而这才是我们感兴趣的。\n\
    \n要解决这个问题，请保持分面打开，但再次进入 **Categories** 下拉菜单，选择**编辑单元格 | 拆分多值单元格...**，如下面的截图所示：\n\
    \n![](img/f5874463a5242c6e8e1824fdc2a73ac7_61_0.png)\n\nOpenRefine 现在会询问：**当前用什么分隔符来分隔这些值？**\
    \ 正如我们在前几条记录中看到的，值之间用竖线（pipe character）分隔。因此，请在对话框中输入竖线 `|`。如果你在键盘上找不到对应按键，可以尝试从某个\
    \ Categories 单元格中选择该字符并复制，然后粘贴到对话框中。接着，点击**确定**。\n\n### 技巧 2 – 在行模式和记录模式之间切换\n\
    \n现在，让我们来看一下 OpenRefine 是如何让你访问多值单元格的。当我们按照上一个技巧的说明拆分列的值时，我们会看到 OpenRefine 做了两件事。一方面，它取出单元格不同值中的第一个，放入原始行；另一方面，它将每个剩余值分别放在一个单元格中，这些单元格所在的行原本为空。例如，在下面的截图中，你可以看到\
    \ ID 为 9 的记录被展开成三行，每行都包含一个类别名称。只有第一个类别所在的行包含该字段的其他值；其他行除了类别值外都是空的（为了清晰起见，隐藏了部分列）。\n\
    \n![](img/f5874463a5242c6e8e1824fdc2a73ac7_63_0.png)\n\n行（row）是数据集中的单行数据。\n\n\
    记录（record）由属于同一对象的所有行组成。记录的第一行以标识该记录的非空单元格开始；在后续行中，这些标识值为空，表示它们属于同一记录。\n\n虽然这避免了信息重复以及由此可能产生的错误，但也使得查看哪些类别属于哪个对象变得困难。例如，如果我们在\
    \ **Categories** 上创建文本分面（参见上一个技巧），我们可以点击分面中的每个类别名称来查看包含该类别的行。然而，如果这样做，我们会看到很多空行：\n\
    \n![](img/f5874463a5242c6e8e1824fdc2a73ac7_64_0.png)\n\n原因是 OpenRefine 确实会显示所有类别值为\
    \ **Numismatics** 的行，其中包括所有那些 **Numismatics** 不是第一个类别的对象的空行。但它并不包含属于同一对象的其他行。如果我们关心一个对象的所有行，这就成了问题。例如，我们可能想给\
    \ **Numismatics** 类别中的所有对象加星标，以便对它们执行操作。现在让我们试试，看看会发生什么。\n\n在文本分面中高亮 **Numismatics**\
    \ 后，点击**全部**下拉菜单，导航到**编辑行 | 星标行**。现在点击分面上的**重置**，查看发生了什么。我们注意到，只有包含 **Numismatics**\
    \ 的行被加星标，但属于同一对象的其他行没有被加星标。显然我们遗漏了什么。所以，让我们从**撤销 / 重做**标签页恢复到之前的状态，以撤销加星标操作。\n\
    \nOpenRefine 允许你将属于同一对象的所有行视为单个**记录**。这样，你既能享受将多值单元格拆分为不同行的好处，又能将它们作为一个整体来处理。要切换到记录模式，请将顶部栏的**显示为**设置从**行**改为**记录**。你会立即注意到\
    \ OpenRefine 的交替着色方案发生了变化。它不再每隔一行进行着色，而是每隔一条记录进行着色，具体取决于每条记录包含的行数。\n\n如果现在，在仍处于**记录**模式时，从\
    \ **Categories** 分面应用 **Numismatics** 过滤器，我们会看到，选中的是 **Numismatics** 类别中对象的所有字段。如果我们现在通过**全部**下拉菜单导航到**编辑行\
    \ | 星标行**来给这些记录加星标，我们会看到属于该对象的所有行都变成了加星标状态：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_65_0.png)\n\
    \n这表明，在**记录**模式下，所有操作都作用于至少有一行匹配的整个记录。总结一下，我们可以说，**行**模式会显示所有符合你选择条件的单个行，而**记录**模式则会显示所有具有匹配行的对象。\n\
    \n> **匹配满足多个条件的记录**\n> \n> 如果我们想匹配所有同时属于 **Numismatics** 类别和 **Medals** 类别的记录，该怎么办？要做到这一点，我们需要确保处于**记录**模式，并在\
    \ **Categories** 字段上添加第二个文本分面。在第一个分面中选择 **Numismatics**，在第二个分面中选择 **Medals**。现在我们会看到同时属于这两个类别的所有记录。\n\
    > \n> 那么，如果我们切回**行**模式会发生什么？突然，零条记录符合我们的选择。乍一看这似乎很奇怪，但实际上非常合乎逻辑：没有任何单行的类别同时等于\
    \ **Numismatics** 和 **Medals**；每行最多只包含这两者之一。因此，像这样的复杂选择应该在**记录**模式下进行。\n\n另外，请确保在本书的其他技巧中恢复到**行**模式，否则你可能会得到完全出乎意料的结果。如果发生了无法解释的情况，请始终先检查你是否处于正确的模式。这可以为你省去很多麻烦。\n\
    \n"
