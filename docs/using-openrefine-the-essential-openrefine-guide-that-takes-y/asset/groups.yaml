  mdcn: "\n\n开始对数据进行剖析和清理之前，了解数据并熟悉 OpenRefine 很重要：使用水平滚动条查看每一列，以验证列标题是否已正确解析，单元格类型是否被正确猜测，等等。将每页显示的行数改为\
