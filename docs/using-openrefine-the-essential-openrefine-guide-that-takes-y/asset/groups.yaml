    `value.replace(";", ",")`。表达式本身看起来没问题，但我们在预览面板中看到几条错误消息。这可能是测试不同 **出错时** 设置的良机（我鼓励你这么做），但我们应该真正反思出错的原因。错误消息显示：**错误：replace
    需要 3 个字符串，或 1 个字符串、1 个正则表达式和 1 个字符串；** 也就是说，我们的表达式向 replace 传递了错误的输入。如果我们查看出现该错误消息的值，会发现
