  # 序言


  2008 年我加入 Metaweb Technologies, Inc. 时，我们正在认真构建 Freebase；实体一个接一个，事实一个接一个。现在你可能通过其最新形态
  Google 的 Knowledge Graph 了解 Freebase，它为 www.google.com 上的“知识面板”提供支持。


  构建“世界上所有事物的数据库”是一项艰巨的任务，仅靠机器和算法是不够的，即使原始公共领域数据大量存在。从多个来源获得的原始数据必须清理、规范化，然后与 Freebase
  中已有的数据进行核对。即使是数据清理的第一步也无法完全自动化；需要人类读者的常识来判断如果名为 cost 的列中同时出现 0.1 和 10,000,000，它们很可能使用不同的单位（也许分别是百万美元和美元）。也需要人类读者来决定
  UCBerkley 与 University of California in Berkeley, CA 相同，但与 Berkeley DB 不同。


  如果这些错误频繁出现，我们还不如放弃或直接雇佣足够的人进行手工数据录入。但这些错误出现的频率足以成为问题，却又不足以让未处理过此类数据的人认为简单自动化就足够了。但亲爱的读者，你处理过数据，你知道它可能有多么不可预测地混乱。


  我们想要加载到 Freebase 的每个数据集都成为编程与人工检查交替进行的迭代练习，导致硬编码转换规则，从将两位数年份转为四位数，到如果中间有逗号则交换名字和姓氏。对我们大多数程序员来说，这项练习很快就变得乏味，每次开始都令人痛苦。


  因此，我们创建了 Freebase Gridworks，这是一款用于清理数据并使其准备好加载到 Freebase 的工具。我们将其设计为数据库-电子表格混合体；它像电子表格软件一样交互式，像数据库一样可编程。正是因为这种结合，Gridworks
  成为此类工具的先驱。


  在创建并使用 Gridworks 的过程中，我们意识到清理、转换和单纯玩弄数据至关重要且普遍有用，即使目标不是将数据加载到 Freebase。因此，我们重新设计了该工具使其更通用，并在
  Google 收购 Metaweb 后以“Google Refine”的名称发布其第 2 版。


  此后，Refine 在许多不同社区中得到广泛认可；数据记者、开放数据爱好者、图书管理员、档案员、黑客行动主义者，甚至是职业程序员和开发者。早期采用的传播主要通过口口相传、在黑客松和由其自身用户举办的非正式教程中进行。


  经过早期采用者的验证，Refine 现在需要更有组织的努力来推广并成为一个成熟的产品，拥有可持续的社区。专家用户、开源贡献者和数据爱好者团体正在积极在巡回讲座和课堂上教授如何使用
  Refine。来自 Free Your Metadata 团队的 Ruben 和 Max 已经迈出了下一步，将这些教程整合并将这些配方整理成这本 Refine
  缺失的手册。


  退一步看大局，我们可能会意识到混乱的数据不是任何人的个人问题，而更像是确保自己社区安全清洁。问题本身不大，但它对透明政府等重大问题有影响。混乱的数据阻碍分析并掩盖现实世界的问题，我们所有人都必须撸起袖子来做清理工作。


  **David Huynh**


  OpenRefine 原始创建者


