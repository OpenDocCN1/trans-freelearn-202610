  \ 部分。\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_27_0.png)\n\n### 移动列\n\n在某些情况下，可能需要更改原始文件中的列顺序，例如，将需要比较的列放在一起。为此，进入所选列的菜单并点击\
  \ **Edit column**。再次，在子菜单底部有四个选项：\n\n- Move column to beginning\n- Move column to\
  \ end\n- Move column to left\n- Move column to right\n\n如果你想完全重新排序列，请使用第一个名为 **All**\
  \ 的列。此列允许你同时对多个列执行操作。\n**View** 选项提供了一种快速折叠或展开所有列的方法，而 **Edit columns | Re-order\
  \ / remove columns...** 则是一种高效的方式，通过拖拽列或将它们丢弃到右侧来重新排列列，如以下截图所示：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_28_0.png)\n\
  \n### 重命名和删除列\n\n在同一个 **Edit column** 菜单项下，你也有可能：\n\n- Rename this column\n- Remove\
  \ this column\n\n你可以使用重命名来消除 **Description** 列标题末尾不必要的点，例如。删除列比简单地折叠它要激进得多，但这仍然可以逆转，正如你在阅读\
  \ *Recipe 5 – using the project history.* 时将学到的那样。\n\n## 配方 5 – 使用项目历史\n\n在本菜谱中，你将学习如何在项目的任何阶段回到过去，以及如何在项目已关闭并重新打开后仍在历史记录中导航。\n\
  \nOpenRefine 的一个非常有用的功能是它对自项目创建以来影响数据的所有修改的历史记录处理。实际上，这意味着你永远不必害怕尝试新事物：随时都可以随意摆弄数据并应用任何想到的转换，因为如果意识到是错误，一切都可以撤销（即使更改已过去数月）。\n\
  \n要访问项目历史记录，请点击屏幕左上角的 **Undo / Redo** 选项卡，就在 **Facet / Filter** 旁边，如以下截图所示：\n\n\
  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_29_0.png)\n\n为了回溯时间，请点击你想要保留的最后一步。例如，要取消列\
  \ **Provenance (Production)** 的删除以及所有后续步骤，请点击 **2. Rename column Description. to\
  \ Description.** 第 2 步将被高亮显示，第 3 步到第 5 步将被灰显。这意味着重命名将被保留，但接下来的三个步骤不会被保留。要取消所有更改并恢复数据到任何转换之前的状态，请点击\
  \ **0. Create project**。要撤销取消操作（重做），请点击你想要恢复历史记录到的步骤：例如，点击 **4. Reorder rows** 再次应用步骤\
  \ 3 和 4，同时保持步骤 5（行删除）的抑制。\n\n然而要谨慎，后退并做其他事情会删除所有后续步骤。例如，如果你从步骤 5 后退到步骤 2，然后选择将列\
  \ **Description** 移到左侧，步骤 3 现在将读作 **3. Move column description to position 1**，而前一张截图中的灰色步骤将永远消失：你不能同时记录两个冲突的历史记录。务必在此进行实验，以避免将来出现不愉快的意外。\n\
  \n重要的是要注意，只有实际影响数据的操作才会在项目历史记录中列出。诸如在行视图和记录视图之间切换、每页显示更少或更多记录、再次折叠和展开列等视觉辅助工具并不是真正的转换，因此不会被保存。其结果是它们会在一次会话到另一次会话之间丢失：当你返回之前关闭的项目时，所有列都将再次展开，而重命名和删除的列仍将保持你上次离开时的状态，以及项目历史记录中存储的每一次其他操作。在\
  \ *Chapter 2, Analyzing and Fixing Data* 中，我们将看到这也适用于其他类型的操作：虽然单元格和列转换会记录在历史记录中，但过滤器和分面不会。\n\
  \n请注意，操作历史记录也可以通过点击 **Undo / Redo** 下方的 **Extract...** 按钮以 JSON 格式提取。这将允许你选择要提取的步骤（请注意，只有可重用的操作可以提取，这排除了对特定单元格执行的操作），然后它们将被自动转换为\
  \ JSON，可以复制粘贴。前一张截图中的步骤 1 和 2 将表示为：\n\n```\n[\n  {\n    \"op\": \"core/column-move\"\
  ,\n    \"description\": \"Move column Registration Number to position 1\",\n   \
  \ \"columnName\": \"Registration Number\",\n    \"index\": 1\n  },\n  {\n    \"\
  op\": \"core/column-rename\",\n    \"description\": \"Rename column Description.\
  \ to Description\",\n    \"oldColumnName\": \"Description.\",\n    \"newColumnName\"\
  : \"Description\"\n  }\n]\n```\n\n## 下载示例文件\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_30_0.png)\n\
  \n你可以从 http://www.packtpub.com 在你购买的所有 Packt 书籍的账户中下载示例文件。如果你是在其他地方购买本书，你可以访问 http://www.packtpub.com/support\
  \ 并注册以便将文件直接发送到你的电子邮件。\n\n在前面的代码中，**op** 代表操作，**description** 实际上描述了操作的作用，而其他变量是传递给操作（函数）的参数。之前保存为文本文件中的\
  \ JSON 的步骤随后可以通过点击 **Apply...** 按钮并将提取的 JSON 历史记录粘贴到文本区域，重新应用于同一项目或另一个项目。最后，如果你执行了数百次操作并且难以找到某个特定步骤，你可以使用\
  \ **Filter** 字段将历史记录限制为匹配文本字符串的步骤。例如，对 remove 的过滤（甚至是 rem）将把显示的历史记录限制为步骤 3 和 5。\n\
  \n## 配方 6 – 导出项目\n\n在本菜谱中，你将探索保存修改后的数据以便在其他上下文中重用的各种方法，包括 **templating**，它允许使用任何自定义导出格式。\n\
  \n尽管你可能已经移动、重命名，甚至删除了列，但这些修改都没有保存到原始数据集中（即 *Recipe 1 – installing OpenRefine* 中的\
  \ chapter1.tsv 文件保持不变）。事实上，与大多数直接将更改记录到与其打开的文件中的电子表格软件不同，OpenRefine 总是在内存中对数据的内部副本进行操作。虽然这是一个额外的安全保障，但这也意味着在与他人共享或注入到另一个应用程序之前，任何修改后的数据都需要导出。屏幕右上角的\
  \ **Export** 菜单允许你这样做：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_31_0.png)\n\n\
  \n\n\n\n### Mac\n\nMac的说明稍微复杂一些，因为这个操作系统将配置文件隐藏了起来。关闭OpenRefine后，按住control键并点击其图标，从弹出菜单中选择“显示包内容”。然后，从Contents文件夹中打开`info.plist`文件。现在你应该看到一系列OpenRefine设置。导航到Java设置并编辑`VMOptions`的值（这些是Java虚拟机的属性）。查找以`-Xmx`开头的部分，并将其默认值1024\
  \ M改为所需的内存量，例如，`-Xmx2048M`。\n\n### Linux\n\n这可能会让你感到惊讶，但在Linux中增加分配的内存是最简单的。不要像通常那样用`./refine`启动OpenRefine，只需输入`./refine\
  \ -m 2048M`，其中2048是所需的内存量（以MB为单位）。要使更改永久生效，你可以在主文件夹中隐藏的`.bashrc`文件中创建一个别名，在文件末尾添加以下行：\n\
  \n```\nalias refine='cd path_to_refine ; ./refine -m 2048M'\n```\n\n这里，`path_to_refine`是从你的主文件夹到OpenRefine文件夹的相对路径。然后，下次你用`./refine`启动OpenRefine时，它将默认分配2\
  \ GB内存。\n\n## 总结\n\n在本章中，你已经了解了OpenRefine，它是你在数据剖析、清洗、转换以及许多其他有待发现的功能方面的新好朋友。你现在已经运行了一个OpenRefine安装，并且知道如何通过创建新项目将数据导入其中，以及完成后如何再次导出数据。行和列的机制对你来说已不再是秘密，你也理解了如何在项目历史中导航。你还掌握了内存分配，这使你能够处理更大的数据集。\n\
  \n虽然在弄脏双手之前，先全面了解数据集中有什么总是很重要的，但你现在可能已经迫不及待地想要对你的数据执行实际更改了。如果是这样，你已经准备好进入第2章“分析和修复数据”，这一章将继续教你分析和修复数据所需的所有基本操作的来龙去脉。\n"
