  \n- **只向表中添加一个地址**：这是最简单的做法，因为它省去了一半的录入工作。不幸的是，这也意味着有一半信息丢失，因此表的完整性会受到威胁。\n- **向表中添加两行**：虽然表现在完整了，但产生了冗余数据。冗余同样危险，因为它会导致错误：这两行可能意外地被当成两个不同的汤普森先生，如果汤普森先生被重复收取订阅费，这会很快成为问题。此外，由于这两行之间没有关联，更新其中一行的信息不会自动传播到另一行。\n\
  - **将所有信息添加到一行中**：在这种情况下，两个地址和两个电话号码被加入到相应字段。我们说该字段相对于其最初设想的定义而言过载了。乍一看，这既完整又不冗余，但一个微妙的问题出现了。人类能完美理解这些信息，而自动化流程却不能。想象一下信封标签打印机，它现在会在一个信封上打印两个地址；或者自动拨号器，它会把两个号码的数字合并当成一个电话号码。该字段确实失去了其精确语义。\n\
  \n请注意，有多种技术解决方案可以处理多值问题，例如表关系。但是，如果你无法控制所处理的数据模型，就只能选择前述解决方案之一。\n\n幸运的是，OpenRefine\
  \ 能够兼顾两者优点。由于它同样是一款自动化软件，在对字段执行合理操作之前，需要告知它该字段是否为**多值**。在 Powerhouse Museum 数据集中，**Categories**\
