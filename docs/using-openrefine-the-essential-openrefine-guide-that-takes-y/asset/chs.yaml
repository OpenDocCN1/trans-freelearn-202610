  \ **Categories** 分面应用 **Numismatics** 过滤器，我们会看到，选中的是 **Numismatics** 类别中对象的所有字段。如果我们现在通过**全部**下拉菜单导航到**编辑行\
  \ | 星标行**来给这些记录加星标，我们会看到属于该对象的所有行都变成了加星标状态：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_65_0.png)\n\
  \n这表明，在**记录**模式下，所有操作都作用于至少有一行匹配的整个记录。总结一下，我们可以说，**行**模式会显示所有符合你选择条件的单个行，而**记录**模式则会显示所有具有匹配行的对象。\n\
  \n> **匹配满足多个条件的记录**\n> \n> 如果我们想匹配所有同时属于 **Numismatics** 类别和 **Medals** 类别的记录，该怎么办？要做到这一点，我们需要确保处于**记录**模式，并在\
  \ **Categories** 字段上添加第二个文本分面。在第一个分面中选择 **Numismatics**，在第二个分面中选择 **Medals**。现在我们会看到同时属于这两个类别的所有记录。\n\
  > \n> 那么，如果我们切回**行**模式会发生什么？突然，零条记录符合我们的选择。乍一看这似乎很奇怪，但实际上非常合乎逻辑：没有任何单行的类别同时等于 **Numismatics**\
  \ 和 **Medals**；每行最多只包含这两者之一。因此，像这样的复杂选择应该在**记录**模式下进行。\n\n另外，请确保在本书的其他技巧中恢复到**行**模式，否则你可能会得到完全出乎意料的结果。如果发生了无法解释的情况，请始终先检查你是否处于正确的模式。这可以为你省去很多麻烦。\n\
  \n\n\n\n\n## 配方 3 – 聚类相似单元格\n\n得益于 OpenRefine，你不必担心在数据创建过程中溜进来的不一致性。如果你已经在拆分多值单元格后调查了各个类别，你可能会注意到相同的类别标签并不总是拼写相同。例如，有\
  \ Agricultural Equipment 和 Agricultural equipment（大小写差异），Costumes 和 Costume（单复数差异），以及各种其他问题。好消息是，这些问题可以自动解决；好吧，几乎可以。但\
  \ OpenRefine 确实让它变得容易得多。\n\n寻找拼写略有不同的相同项目的过程称为聚类。在拆分多值单元格后，你可以点击 Categories 下拉菜单并导航到\
  \ Edit cells | Cluster and edit.... OpenRefine 会为你呈现一个对话框，你可以在其中在不同的聚类方法之间进行选择，每种方法都可以使用各种相似度函数。当对话框打开时，key\
  \ collision 和 fingerprint 已被选为默认设置。\n\n过了一段时间（这可能需要一段时间，具体取决于项目大小），OpenRefine 将在\
  \ Categories 字段上执行聚类算法。它按行列出找到的聚类以及每个聚类中的拼写变体和整个聚类的建议值，如以下屏幕截图所示：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_66_0.png)\n\
  \n请注意，OpenRefine 并不会自动合并聚类的值。相反，它希望你确认这些值是否确实指向同一个概念。这避免了相似名称但含义仍然不同而意外合并的情况。\n\n\
  在开始做决定之前，让我们先了解所有列的含义。**Cluster Size** 列指示被认为找到的某个概念的不同拼写数量。**Row Count** 列指示包含其中任一找到拼写的行数。在\
  \ **Values in Cluster** 中，你可以看到不同的拼写以及包含特定拼写的行数。此外，这些拼写是可以点击的，因此你可以指出哪个是正确的。如果你将鼠标悬停在拼写上，会出现一个\
  \ **Browse this cluster** 链接，你可以使用它在单独的浏览器标签页中检查聚类中的所有项目。**Merge?** 列包含一个复选框。如果你勾选它，所有该聚类中的值都将在你点击\
  \ **Merge Selected** 按钮之一时更改为 **New Cell Value** 列中的值。你也可以手动选择新的单元格值，如果自动值不是最佳选择的话。\n\
  \n那么，让我们执行第一次聚类操作。我强烈建议你仔细滚动浏览列表，以避免将不属于一起的值聚类。在这种情况下，算法并没有过于激进：事实上，所有建议的聚类都是正确的。与其在每一个上手动勾选\
  \ **Merge?** 复选框，我们可以简单地点击底部的 **Select All**。然后，点击 **Merge Selected & Re-Cluster**\
  \ 按钮，这将合并所有选定的聚类，但不会关闭窗口，因此我们也可以尝试其他聚类算法。\n\nOpenRefine 立即使用相同的算法重新聚类，但由于我们已经合并了所有聚类，因此没有找到其他聚类。让我们看看当我们尝试不同的相似度函数时会发生什么。从\
  \ **Keying Function** 菜单中，点击 **ngram-fingerprint**。请注意，我们获得了额外的参数 **Ngram Size**，我们可以尝试它以获得更少或更激进的聚类。我们看到\
  \ OpenRefine 又找到了几个聚类。可能会很诱人再次点击 **Select All** 按钮，但请记住我们警告过要仔细检查列表中的所有行。你能发现错误吗？请仔细查看以下屏幕截图：\n\
  \n| 2 | 12 | • Bookmarks (11 rows) • book marks (1 rows) | ☐ | Bookmarks |\n| 2\
  \ | 202 | • Shirts (115 rows) • T-shirts (87 rows) | ☐ | Shirts |\n| 2 | 3 | • Bonbon\
  \ dishes (2 rows) • Bon bon dishes (1 rows) | ☐ | Bonbon dishes |\n\n确实，聚类算法决定 **Shirts**\
  \ 和 **T-shirts** 相似到足以合并。不幸的是，这是不正确的。因此，要么手动选择所有正确的建议，要么取消选择不正确的建议。然后，点击 **Merge\
  \ Selected & Re-Cluster** 按钮。\n\n除了尝试不同的相似度函数外，我们还可以尝试完全不同的聚类方法。从 **Method** 菜单中，点击\
  \ **nearest neighbor**。我们再次看到新的聚类参数出现（**Radius** 和 **Block Chars**，但我们目前将使用其默认设置）。OpenRefine\
  \ 又找到了几个聚类，但现在，它有点过于激进了。事实上，几个建议是错误的，例如 **Lockets / Pockets / Rockets** 聚类。一些其他建议，例如\
  \ \"Photocopiers\" 和 \"Photocopier\"，是可以的。在这种情况下，最好手动挑选出少数正确的建议，而不是众多不正确的聚类。\n\n\
  假设所有聚类都已识别，点击 **Merge Selected & Close** 按钮，这将对选定的项目应用合并并带你返回到主 OpenRefine 窗口。如果你现在查看数据或在\
  \ **Categories** 字段上使用文本分面，你会注意到不一致性已经消失。\n\n### 什么是聚类方法？\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_68_0.png)\n\
  \nOpenRefine 提供了两种不同的聚类方法，**key collision** 和 **nearest neighbor**，它们在功能上根本不同。对于\
  \ key collision，想法是使用一个 **keying function** 将字段值映射到某个键。映射到相同键的值被放在同一个聚类中。例如，假设我们有一个\
  \ keying function 去除所有空格；那么，A B C、AB C 和 ABC 将被映射到同一个键：ABC。在实践中，keying functions\
  \ 的构造方式更为复杂和有帮助。\n\nNearest neighbor 另一方面是一种技术，其中每个唯一值都使用 **distance function**\
  \ 与每个其他唯一值进行比较。例如，如果我们将每次修改计为一个单位，则 Boot 和 Bots 之间的距离为 2：一次添加和一次删除。这对应于 OpenRefine\
  \ 中的一个实际距离函数，即 `levenshtein`。\n\n在实践中，很难预测对于给定字段哪种方法和函数的组合是最好的。因此，最好尝试各种选项，每次都仔细检查聚类的值是否确实属于一起。OpenRefine\
  \ 界面通过按最有可能有帮助的顺序排列各种选项来帮助你：例如，先尝试 key collision 再尝试 nearest neighbor。\n\n## 配方\
  \ 4 – 转换单元格值\n\n在第 2 章《分析和修复数据》中，我们看到 OpenRefine 可以自动更改列中所有单元格的内容，例如修剪空白。在之前的食谱中，我们了解到聚类是执行列范围值更改的另一种方法。然而，这些操作是转换单元格内容更一般机制的一部分。你可以以各种复杂的方式更改每个单元格的值。虽然这看起来有点像\
  \ Excel 公式，但令人惊讶的是，仅用一点点就能完成多少。\n\n例如，假设你不喜欢 Categories 字段中的垂直条作为分隔符，而希望改用逗号后跟空格。虽然这可以通过先拆分多值单元格然后再重新连接来解决，但我们实际上可以在一次转换步骤中完成此操作。点击\
  \ Categories 下拉菜单并导航到 Edit cells | Transform.... 转换对话框如下所示：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_69_0.png)\n\
  \n此对话框的核心是 **Expression**，一个小的脚本，解释 OpenRefine 如何更改每个值。**Language** 列表允许我们选择表达式的语言，目前支持\
  \ **General Refine Expression Language (GREL)**、**Jython**（用 Java 实现的 Python）和 **Clojure**（一种类似于\
  \ Lisp 的函数式语言）。如果你熟悉后两者，你可能会发现用这些语言编写表达式更容易。然而，GREL 是专门为简单的转换而创建的，这就是为什么我们将在本书中使用它。\n\
  \n在 **Preview** 选项卡中，你可以看到前几个单元格的值在转换前后的情况。这使你可以在实时查看结果的同时迭代更改转换表达式。**History**\
  \ 选项卡跟踪你过去使用过的表达式，这对于重复使用之前的转换非常方便。你经常使用的表达式可以在 **History** 选项卡中加星标，这使得它们也出现在 **Starred**\
  \ 选项卡中以便更快访问。最后，**Help** 选项卡提供了最重要的表达式构造的概述。\n\n在对话框底部，你可以决定如果表达式对某个单元格值导致错误会发生什么。你可以选择保留原值、使单元格为空，或将错误存储在单元格中。此外，你还可以选择重复应用转换表达式，这在转换结果需要再次检查时很有用。例如，如果你有一个表达式删除以大写字母开头的第一个单词，你可以重复它，直到没有大写字母的单词为止。\n\
  \n回到我们的任务：将垂直条更改为逗号后跟空格。默认表达式是 `value`，但正如你可能猜到的，这相当于初始单元格值。让我们先尝试一个简单的例子，看看会发生什么；因此，将新单元格值输入为\
  \ `1234`。预览已更新并显示每个单元格的新值现在将为 **1234**。不是很有帮助，但你明白了。我们真正想要的是从原始值开始并执行一些替换。在 **Help**\
  \ 选项卡中，我们可以看到对应的 GREL 函数称为 `replace`。由于我们想用逗号替换垂直条，我们输入表达式 `value.replace(\"|\"\
  , \", \")`。请注意，我们在字符周围添加了引号，因为它们是字符串，而不是数字。预览使用新的单元格值进行了更新，结果确实是我们期望的，因此我们点击 **OK**。在惊人地短暂的时间内，OpenRefine\
  \ 已转换 **Categories** 列中的所有单元格，所有垂直条现在都不见了。\n\n> 更改分隔符时务必小心，因为如果新分隔符作为值的一部分出现，可能会产生意想不到的副作用。事实上，这里也是这种情况：类别\
  \ **Cup, saucer and plate sets** 包含一个逗号。因此，如果该字段再次被处理，这很可能会导致错误。然而，为了示例的缘故，我们在这里继续使用逗号。\n\
  \n\n\n\n为了增加对单元格变换的信心，我们或许应该再试一次。假设我们想把 **来源** 列中的分号改成逗号。点击 **来源（生产）** 下拉菜单，选择 **编辑单元格，变换...**，然后输入表达式\
  \ `value.replace(\";\", \",\")`。表达式本身看起来没问题，但我们在预览面板中看到几条错误消息。这可能是测试不同 **出错时** 设置的良机（我鼓励你这么做），但我们应该真正反思出错的原因。错误消息显示：**错误：replace\
  \ 需要 3 个字符串，或 1 个字符串、1 个正则表达式和 1 个字符串；** 也就是说，我们的表达式向 replace 传递了错误的输入。如果我们查看出现该错误消息的值，会发现\
  \ null 值是罪魁祸首。确实，null 不是字符串，所以我们无法替换其中的字符。我们需要告诉 OpenRefine，只有非空单元格才需要变换。点击 **取消**\
  \ 关闭对话框，点击 **来源（生产）** 下拉菜单，选择 **文本过滤器**。虽然我们本可以选择 **按空值分面**，但只变换那些确实包含分号的单元格可以节省一些处理时间。在文本过滤器中输入\
  \ ;，它将过滤掉所有其他值。现在重试单元格变换，你会看到变换只应用于选中的单元格，不会引发任何错误。\n\n最后，为了展示单元格变换的强大功能，我们将做一些真正复杂的事情。虽然竖线现在已经被改成逗号，但\
  \ **分类** 字段仍然存在问题。确实，有些对象同一个类别出现了多次，比如记录 14：**教学展示、珍珠贝壳、纽扣、教学展示**。不幸的是，我们无法像之前消除重复行那样解决这个问题，因为这里的重复发生在一行之内。幸运的是，GREL\
  \ 可以帮我们。在 **分类** 列上打开变换对话框，输入以下表达式：`value.split(\", \").uniques().join(\", \")`。这个表达式看起来复杂，但很容易理解各个部分：首先，值按每个\
  \ ,（逗号加空格）拆分，然后通过 `uniques` 函数保留唯一值，最后再将它们重新连接起来。点击 **OK** 时，OpenRefine 将应用变换并告知有多少单元格受到影响。\n\
  \n![](img/f5874463a5242c6e8e1824fdc2a73ac7_71_0.png)\n\n### 掌握 GREL 很容易\n\n本操作介绍了一些示例，但如果这些不能满足你的需求怎么办？*附录\
  \ A，正则表达式与 GREL* 将向你介绍 GREL，使你可以学习如何自行构建表达式。\n\n## 操作 5 – 添加派生列\n\n有时，你确实想变换单元格的内容，但同时保留原始值。虽然在出错时可以使用\
  \ 撤销 / 重做 选项卡回到单元格之前的状态，但能够同时看到原始值和变换后的值也很有用。因此，OpenRefine 允许你基于另一列添加一列。\n\n假设我们想有一个单独的字段，统计每条记录的分类数量。点击\
  \ 分类 下拉菜单，点击 编辑列 和 基于此列添加列... 一个与单元格变换对话框非常相似的对话框弹出；不过，这次它还额外要求输入列名。在 新列名称 字段中输入\
  \ Category Count。现在，我们必须创建统计分类数量的表达式。由于所有分类都由一个字符分隔（竖线，如果你遵循了上一个操作则是逗号），我们可以直接拆分它们并统计分段数量。这个表达式可以做到：`value.split(\"\
  ,\").length()`。预览面板显示了前几个单元格的结果，看起来没问题，所以点击 OK。\n\nOpenRefine 现在已经创建了一个新列。我们现在可以使用\
  \ Category Count 列来分析数据。例如，我们可以通过点击 Category Count 下拉菜单并导航到 分面 | 文本分面 来创建分面。注意，这里文本分面更合适，即使数据是数值型的，因为我们不想选择范围，而是想检查各个计数。分面出现在左侧，告诉我们有多少对象被分配了特定数量的分类，如下面的截图所示：\n\
  \n![](img/f5874463a5242c6e8e1824fdc2a73ac7_73_0.png)\n\n我们还注意到一些奇怪的地方：其中一个值是 (blank)。如果我们点击它，会看到所有对应记录的\
  \ 分类 字段都是空的。为什么 Category Count 列不直接显示有 0 个分类呢？答案是，对于这些空单元格，变换表达式出错了，因为没有可拆分的值。和上一个操作一样，我们本可以在开始变换之前过滤掉这些行。\n\
  \n相反，让我们修复这些行。在分面中仍然选中 (blank) 选项时，点击 Category Count 列下拉菜单，导航到 编辑单元格 | 变换.... 如果我们输入\
  \ 0 作为表达式并点击 OK，空单元格现在就包含 0。如果现在看不到任何行，不要困惑：分面中的 blank 过滤器仍然处于活动状态。点击 0 过滤器（或其他任何过滤器），你就会看到预期的数据。\n\
  \n从数据分析的角度来看，现在有趣的是看看每条记录有多少个分类是常见的。在 Category Count 分面中，将 **排序依据：** 设置为 count。我们现在可以得出结论，每条记录\
  \ 2 个分类是最常见的情况。请注意，如果你已经按照前面的操作对值进行了聚类并移除了重复项，这些数字会更加合适。GREL 又一次派上了用场。\n\n## 操作\
  \ 6 – 将数据拆分到多列\n\n本章开头我们展示了如何将单个单元格中的多个值拆分到不同行。然而，这并不总是你想要的。在迄今为止的示例中，每个不同的值都扮演着相同的角色：一个分类与其他分类没有区别，它们的顺序可以互换。当一个字段中堆满了不同类型的值时，情况就不同了。例如，当\
  \ `Clients` 表包含电话字段但没有电子邮件字段，而联系人同时提供了这两种信息时，就可能发生这种情况。结果，这个人的电话号码和电子邮件地址可能会出现在同一个字段中，用斜杠分隔。\n\
  \n我们在 Powerhouse Museum Collection 数据的各个列中也看到了类似的情况。例如，在 **来源** 字段中，我们看到了关于设计师、制作者以及其他各种信息。把这些信息放到不同的列中，以便我们可以单独分析它们，是很有意义的。为此，点击\
  \ **来源（生产）** 下拉菜单，导航到 **编辑列 | 拆分为多列…**。然后我们会看到一个包含各种拆分选项的对话框：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_74_0.png)\n\
  \n我们可以在 **按分隔符** 拆分（这是目前我们一直在做的）或 **按字段长度** 拆分之间选择。如果你的字段包含结构化数据，例如 `1987 en-us,x/Y`，其中没有固定的分隔符（或根本没有分隔符），后者就很有意义。然而，我们的数据使用简单的分隔符。一个有趣的选项是设置限制，因为否则可能会产生很多列，所以将其设置为\
  \ 5 之类的值是明智的。别忘了让分隔符与数据中的分隔符匹配，在我们的例子中就是竖线 `|`。你可以选择让 OpenRefine 在拆分后猜测单元格类型（例如，如果你有数值）以及是否移除原始列。\n\
  \n点击 **OK** 后，你会看到 OpenRefine 将名为 Provenance (Production) 的一列替换为多个带编号的列，称为 Provenance\
  \ (Production) 1、Provenance (Production) 2 等，之后可以根据它们包含的值重命名。并非所有列都包含值；只有那些字段中至少有\
  \ 5 个项目的记录才能找到值。虽然拆分创建的列永远不会超过你设置的限制，但如果单元格中实际出现的值没有那么多，则可能创建更少的列。\n\n另一个适合拆分的候选是\
  \ **对象标题** 列。我们看到在某些字段中，标题前面有一个数字。将数字与实际的标题拆分开来会很有趣。首先，让我们过滤掉以数字开头的行。点击 **对象标题**\
  \ 下拉菜单，点击 **文本过滤器**。我们需要在这个字段中写入 `starts with a number`，但我们可以用正则表达式 `^\\d` 来表达这一点。这告诉过滤器从开头（`^`）开始查找任意数字（`\\\
  d`）。不过别忘了勾选 **正则表达式** 复选框，否则 OpenRefine 会尝试按字面意思查找该表达式。我们现在只能看到以数字开头的标题。\n\n再次点击\
  \ **对象标题** 下拉菜单，导航到 **编辑列 | 拆分为多列....** 现在我们使用单个空格作为分隔符，指出我们希望最多 2 列，然后点击 **OK**。描述编号和标题已移动到单独的列中。\n\
  \n拆分列远比拆分多值单元格强大，因为你有多种配置选项。你甚至可以使用正则表达式来定义分隔符，这样分隔符可以根据上下文而不同。顺便说一句，如果这个操作让你对正则表达式产生了好奇，别忘了查看\
  \ *附录 A，正则表达式与 GREL*，那里会更详细地介绍它们。\n\n## 操作 7 – 行列转置\n\n有时数据的行列排列方式并不符合你的喜好。确实，安排内容归属的方式多种多样，选择取决于具体情况。例如，在\
  \ Powerhouse Museum 数据集中，有多个维度分别占据单独的列：高度、宽度、深度、直径和重量。然而，并没有多少对象在这些列中有数据，因此相对于它们增加的价值，维护它们的成本可能很高。另一种选择是将这五列转换为两列：一列包含维度名称（例如\
  \ 高度 或 重量），另一列包含测量值（例如 35mm 或 2kg）。\n\n\n\n\n我们在这里要做的是将列转置为行。要做到这一点，请点击高度下拉菜单并导航到\
  \ Transpose | Transpose cells across columns into rows...，这将弹出以下对话框：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_76_0.png)\n\
  \n左侧，你可以选择 From Column，即开始转置的列。Height 列已被选中，因为我们正是用它来调出转置对话框的。To Column 是转置停止的位置。这两个设置之间的范围是将被转换的列（因此如果它们是分开的，你必须先将它们放在一起）。在这里，我们将选择\
  \ Weight，因此这两列以及它们之间的所有内容都将被包含在转置操作中。\n\n在右侧，我们可以选择转置列后会发生什么。第一个选项 Two new columns\
  \ 允许我们拥有一个 Key 列，其中包含原始列名（Height、Weight...），以及一个 Value 列，其中包含原始单元格值（35mm、2kg...）。你可以为两列选择名称，例如\
  \ Dimension 和 Measurement。或者，One column 选项允许你将键和值合并到单个单元格中；然而，这在以后分析时可能更困难。设置好选项后，点击\
  \ Transpose 开始操作。五列现在被重新排列为两列，如以下屏幕截图所示：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_77_0.png)\n\
  \n注意 OpenRefine 如何再次使用记录来将相关信息保持在一起。因此，如果某一行存在不同的测量值，它们已被分散到几行中。也许你希望看到全部五个值，即使其中一些是空的。要实现这一点，请在转置对话框中取消选择\
  \ Ignore blank cells 选项。\n\n执行反向操作也是可能的，通过导航到 Transpose | Columnize by key/value\
  \ columns... 命令即可。然而，此操作对空白单元格很敏感，因此请谨慎进行。有一定技巧的话，你甚至可以将包含键/值对的 Provenance 列转换为完整的列。\n\
  \n## 总结\n\n本章介绍了高级数据操作的配方。我们以不同的方式查看了多值单元格：当它们的值同等重要时，我们将它们拆分到多行；当它们具有不同功能时，我们将它们拆分到多列。我们还看到\
  \ OpenRefine 有一种特殊模式，用于处理跨不同行分布的多值单元格，称为 **records** 模式。在 **records** 模式下，属于同一对象的多行可以被视为一个，从而为你提供强大的搜索和操作选项。\n\
  \n我们还向你介绍了聚类，如果你的某些单元格值需要一致但实际上有点混乱，这非常有帮助。你甚至可以进一步为单元格值定义自己的转换操作，并基于现有列创建新列。最后，你学会了如何灵活地在行和列之间移动数据。因此，本章为你提供了\
  \ OpenRefine 提供的更深层次界面中隐藏的高级可能性。到现在为止，你几乎可以自称 OpenRefine 大师了。\n"
- '# 4 链接数据集


  你的数据集不是孤岛。在某些地方，甚至在你可能不期望的地方，都存在相关的数据集。例如，如果你的数据集有一个 Country of Origin 列，那么它就与列出每个国家总面积的地理数据库相关。图书数据集中的
  Author 列与包含传记数据的作者列表相关。所有数据集都有这样的联系，但你可能不知道这一点，包含你数据集的计算机也不知道。例如，The Picture of
  Dorian Gray 的记录可能将 Wilde, O. 列为作者，而传记数据集可能只有 Oscar Wilde 的条目。尽管它们指向同一个人，但字符串值不同，因此很难连接数据集。此外，将所有可能的数据集相互链接将非常不切实际，因为它们的数量巨大。


  相反，方法是为单元格值找到唯一标识符，特别是 URL（统一资源定位符）。我们不是通过姓名来识别 Oscar Wilde，而是通过诸如 http://en.wikipedia.org/wiki/Oscar_Wilde
  这样的 URL 来识别他。不仅此 URL 唯一标识作家 Oscar Wilde（而不是其他同名的人），它还可以在浏览器中访问以查找有关他的更多信息，例如相关数据集。因此，URL
  允许我们将不同的数据集连接在一起。在本章中，我们将学习如何使用以下配方将字段值转换为它们所标识概念的 URL：


  - Recipe 1 – reconciling values with Freebase

  - Recipe 2 – installing extensions

  - Recipe 3 – adding a reconciliation service

  - Recipe 4 – reconciling with Linked Data

  - Recipe 5 – extracting named entities


  与往常一样，你可以直接跳到感兴趣的配方。然而，在继续进行最后三个配方之前，请确保先学习如何安装 OpenRefine 扩展。每个配方都从清理后的 Powerhouse
  Museum 数据集开始，其中 Categories 列已分散到多行。


  ## 配方 1 – 与 Freebase 协调


  当你想将单元格值从简单字符串转换为 URL 时，有不同的选择。毕竟，给定概念可以用许多 URL 来标识，因为网络上关于同一主题有很多页面。只要每个 URL 明确标识单个概念，这就不是问题。然而，我们必须选择要使用的
  URL。在网络上，有许多概念数据库，其中最著名的是 Wikipedia。除了面向人类的数据库外，还有一些面向机器的数据库。一个例子是 Freebase，这是一个协作知识库，其中存储了几乎所有主题的机器可读事实。


  > 在 OpenRefine 被称为 Google Refine 时，它由 Freebase 创建者 MetaWeb 拥有并称为 Freebase Gridworks。作为操作大型数据集的工具，它很好地契合了
  Freebase 让结构化数据可用的理念。


  因此，我们将把单元格值与 Freebase URL 进行协调。由于 Freebase 协调已内置于 OpenRefine 中，我们可以立即尝试。注意，我们从 Categories
  列已按行拆分的 Powerhouse 数据集开始。这很重要，因为每个单元格应包含与 Freebase 主题匹配的单个值。像 Description 这样的全文字段因此不是协调的好候选（它却是命名实体提取的好候选，如本章最后一个配方所示）。


  要开始协调，请转到 Categories 下拉菜单并导航到 Reconcile | Start reconciling... OpenRefine 显示协调对话框。在对话框的右侧，你可以看到所有可能的协调服务。两个
  Freebase 协调服务是内置的：


  - **Freebase Query-based Reconciliation**：如果你的列值已经是 Freebase ID（例如 `/en/solar_system`）或
  GUID（十六进制标识符），这很有用。

  - **Freebase Reconciliation Service**：这为不一定与 Freebase 标识符相关的术语提供更通用的方法。


  很明显我们在这里属于第二种情况，因此选择 **Freebase Reconciliation Service**。经过一些处理后，OpenRefine 在右侧加载此服务的选项：


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_81_0.png)


  > 你 OpenRefine 安装中的服务可能与屏幕截图中看到的不同。那是因为你可以自己添加协调服务，正如我们将在下一个配方之一中向你展示的那样。


  现在你可以设置三个选项。首先，你必须决定要针对什么类型的记录进行协调。这可以限制搜索到特定主题，如果你的列只包含城市或人名，这很有用。这样，协调可以更快进行，并且找到假阳性的可能性更低。在你选择服务后的处理步骤中，OpenRefine
  已联系服务并使用部分数据来尝试猜测你的列数据类型。不幸的是对我们而言，它提供的两个选项与 **Categories** 字段不相关：persons 和 locations。幸运的是，我们也有
  **Reconcile against type** 选项来自行选择类型。然而，由于我们不确定我们的数据集中的类别是否实际上属于单一特定类型，我们只需选择 **Reconcile
  against no particular type.**






  我们可选的第二个选项是 **自动匹配高置信度的候选项**。对账服务还会返回一个匹配分数，用来表示其对匹配结果的信心程度。自动匹配选项默认是开启的，这意味着如果分数足够高，OpenRefine
  就会假定它做出了正确的选择并将其声明为匹配。对于其他单元格值（或如果你取消了复选框），你将需要手动确认匹配。我们建议保留此选项的勾选，因为它可以为你节省相当多的工作。


  第三个也是最后一个选项允许你向对账服务发送额外数据。匹配不再基于单一列值，而是可以考虑不同的列。为此，你需要指明属性名称。对于 Powerhouse Museum
  数据集，并不存在此类其他相关列。但如果你有一个包含国家名称和国家代码的数据集，将两者都发送给对账服务可能会有所帮助。


  在勾选了 **不对特定类型进行对账** 后，点击 **开始对账**。对账过程可能需要一些时间，因为 OpenRefine 现在会要求对账服务为每个唯一的单元格值查找一个
  URL。窗口顶部的黄色信息栏会告诉你已完成多少。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_82_0.png)


  这可能是你去喝杯咖啡或在电脑上做另一项任务，让对账在后台运行的好时机。当过程完成后，你会注意到 OpenRefine 已自动为你创建了 **判断** 和 **最佳候选分数**
  两个分面。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_82_1.png)


  **判断** 分面允许你将数据集划分为已完成对账的行和未完成的行，以及 **Categories** 单元格为空值因此不是对账候选的行。你在这里看到的内容可能会让你感到惊讶，分面中只有
  **(blank)** 和 **none** 两个过滤器。已对账的行在哪里？


  事实证明，不幸的是，使用 Freebase 进行对账并未成功，没有找到任何匹配项。这是否意味着我们做错了什么？不，我们没有做错，只是我们数据库中的术语似乎并不是
  Freebase 所涵盖的那种主题。这是否意味着 Freebase 不是对账的好选择？完全不是，只是碰巧我们的数据集不太合适。你在其他数据集上可能会有更好的运气，所以一定要试试。


  让我们通过使用 Remove All 按钮删除分面并在 Undo / Redo 菜单中后退一步来撤销这次不成功的对账。（你可以通过转到 Categories 下拉菜单
  | Reconcile | Facets 来恢复它们。）接下来的食谱将向你展示如何尝试其他对账服务。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_83_0.png)


  > 有时你只是想尝试使用某个服务进行对账，看看它是如何工作的。这是否意味着每次都要经历整个对账过程？如果巧妙地使用分面，就不必如此！我们倾向于先在数据集的一小部分上尝试对账，然后再决定是否要在所有行上运行它。为了做出或多或少的随机选择，我们可以在
  Record ID 列上添加一个文本过滤器并输入一个数字，例如 4。假设所有 ID 中的数字分布相等，这将选择大约 10% 的行。如果这仍然太多，只需不断添加数字，直到行数减少到几百行。例如，413
  对我们来说就奏效了。


  ## 配方 2 – 安装扩展


  虽然 OpenRefine 可以开箱即用地添加新的对账服务，但这些只是底层以某种方式工作的服务。然而，还有其他类型的服务，如果你想使用它们，你需要在 OpenRefine
  中添加一些功能形式的扩展。因此，在向你展示如何添加这些服务之前，我们首先必须解释如何安装 OpenRefine 扩展。并非所有扩展都提供对账服务，因此本食谱描述的是通用安装程序。截至撰写时，有多个
  OpenRefine 扩展可用，包括以下几点：


  - 由 Digital Enterprise Research Institute (DERI) 提供的 RDF 扩展，它增加了对 RDF 导出和与 SPARQL
  端点对账的支持。我们将在下一个食谱中解释这两个术语。

  - 由本书作者之一编写的 Named-Entity Recognition (NER) 扩展，它允许你从全文字段中提取 URL。本章最后一个食谱将详细介绍该扩展的使用。


  与 OpenRefine 一样，所有扩展都是免费提供的。可用扩展的最新列表维护在 https://github.com/OpenRefine/OpenRefine/wiki/Extensions，也包括它们的下载位置。由于扩展种类繁多，安装它们看起来可能很棘手。然而，本食谱将向你展示安装任何扩展的技术。


  首先，你需要找到扩展需要安装的路径。这取决于你的操作系统，但 OpenRefine 可以帮助你找到它。在起始页底部，有一个名为 Browse workspace
  directory 的链接。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_84_0.png)


  如果你点击此链接，你将进入 OpenRefine 应用程序文件夹（至少在 Windows 和 Mac 上；Linux 请继续阅读）。在此文件夹中，你需要创建一个名为
  extensions 的新文件夹（如果它还不存在）。这将是你需要添加扩展的路径。对于不同的操作系统，它应该如下所示：


  - Windows: C:\Documents and Settings\(your username)\Application Data\OpenRefine\extensions
  或可能在 Local Settings 文件夹中 C:\Documents and Settings\(your username)\Local Settings\Application
  Data\OpenRefine\extensions

  - Mac OS X: /Users/(your username)/Library/Application Support/OpenRefine/extensions
  或从你的主文件夹开始，在 /Users/(your username)/Library/Application Support/OpenRefine/extensions

  - Linux: /home/refine/webapp/extensions


  下一步是下载一个扩展并将其放置在该文件夹中。例如，让我们安装 RDF 扩展。从 http://refine.deri.ie/ 下载扩展；这将为你在下载文件夹中获取一个
  ZIP 文件。以你习惯的方式解压此 ZIP 归档的内容。根据你使用的软件，可能会生成额外的文件夹，但我们感兴趣的文件夹名为 rdf-extension。


  将此文件夹移动到我们之前找到的 OpenRefine 的 extensions 文件夹中。在 extensions 文件夹中，你现在应该看到一个名为 rdf-extension
  的文件夹，其中包含其他文件夹，例如 images、MOD-INF、scripts 和 styles。


  现在重新启动 OpenRefine 以使扩展生效。仅仅关闭浏览器窗口是不够的；你必须真正关闭 OpenRefine 应用程序本身，通过在屏幕底部右键或 control-点击其图标并选择
  Close。然后，像往常一样重新启动 OpenRefine 并打开一个项目。当项目加载后，右上角出现一个新的 RDF 按钮，这表明安装成功：


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_85_0.png)


  如果你看不到该按钮，请确保正确的扩展文件夹已放置在正确的位置，并且 OpenRefine 已正确重新启动。


  你也可以对其他扩展重复本食谱中的步骤。在接下来的食谱中，我们将使用 RDF 扩展，因此请确保安装它。在后面的食谱中，我们也将需要 NER 扩展，所以趁此机会也安装它吧。


  ## 配方 3 – 添加对账服务


  本食谱需要你已安装 RDF 扩展。如果没有，请查看上一食谱。如果你已安装，你可能会想知道 RDF 和 SPARQL 这些术语的含义，因为它们在整个扩展中都被使用。这马上就会变得清晰。






  **资源描述框架（RDF）**是一种可被机器解释的数据模型。虽然人类可以在网络上阅读 HTML，但机器无法理解自然语言，因此必须以另一种形式提供信息。消歧是一个重要方面；华盛顿指的是城市还是人物？是哪个人？为了表达这一点，RDF
  中的信息通过 URI 或 URL 来引用，就像我们在 OpenRefine 中进行 reconciliation 时所做的那样。这就是 RDF 在 reconciliation
  中派上用场的原因。


  **SPARQL**（**SPARQL 协议和 RDF 查询语言**的递归缩写）是一种用于查询 RDF 数据源的语言。传统的 relational 数据库使用
  SQL 作为查询语言；RDF 数据库以及对我们而言重要的 reconciliation 服务使用 SPARQL 进行通信。


  如果你想将你的数据与 RDF 数据源进行 reconciliation，那么你必须告诉 OpenRefine 它如何与该数据源通信。当你安装了 RDF 扩展时，你已经为
  OpenRefine 添加了 SPARQL 支持。然而，在我们能够将单元格值 reconciliation 到 URL 之前，我们必须配置数据源。为此，点击右上角的新
  RDF 按钮并导航到 **Add reconciliation service | Based on SPARQL endpoint...**。请注意，你也可以使用本地
  RDF 文件进行 reconciliation，如果你有自己的 URL 数据集，这很方便。OpenRefine 会显示 **Add SPARQL-based reconciliation
  service** 对话框。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_86_0.png)


  此对话框允许你为 SPARQL 端点选择一个名称，添加端点的详细信息（它位于何处以及如何工作），以及用于将单元格值匹配到 URL 的信息类型。你可以使用自己的
  SPARQL 端点或在 `http://www.w3.org/wiki/SparqlEndpoints` 上列出的任何公共可用端点。


  对于本示例，我们将使用我们设置的一个端点。它包含公开可用的 **美国国会图书馆主题词表（LCSH）** 数据集的处理版本。要使用此端点，请按如下方式填写详细信息：


  - **Name:** LCSH

  - **Endpoint URL:** `http://sparql.freeyourmetadata.org/`

  - **Graph URI:** `http://sparql.freeyourmetadata.org/authorities-processed/`

  - **Type:** Virtuoso

  - **Label properties:** 仅勾选 **skos:prefLabel**


  **Endpoint URL** 是端点所在的地址，而 **Graph URI** 标识在此端点中应使用的数据集。端点的 **Type** 用于指示底层端点软件；指定此项不是强制性的，但知道正确的类型可以启用低级技巧，从而大大提高
  reconciliation 速度。最后，**Label properties** 指示可用于查找单元格值的字段名称。在 RDF 中，这些属性通常具有通用名称（实际上它们本身大多是
  URL）。设置好这些属性后，点击 **OK** 按钮。


  由于现在没有任何反应，你可能会好奇如何检查新 reconciliation 是否已正确添加。你可以通过转到 **Categories** 下拉菜单并导航到 **Reconcile
  | Start reconciling...** 来验证这一点。在左侧，你会看到新添加的服务。现在如果迫不及待想使用它，请继续阅读下一条 recipe！


  ## 配方 4 – 与链接数据协调


  在上一条 recipe 中，我们谈到了 RDF 和 SPARQL，但没有勾勒出这些技术诞生的更广泛背景，所以现在让我们介绍一下。2000 年左右，网络研究人员和工程师注意到人类不再是网络的唯一消费者；越来越多的机器客户端，也就是软件，开始为各种目的使用网络。然而，每一个这样的软件都必须为特定任务硬编码，并且无法解析人类网络上文档中的自然语言。因此，提出了一个名为
  **Semantic Web** 的愿景，即一个信息也能被机器解释的网络。这是 RDF 和 SPARQL 的开端。


  ### Linking Datasets


  然而，该愿景对许多人来说相当抽象且难以理解。其中几个概念依赖于本体和推理等概念，这些概念会迅速变得非常复杂。*Tim Berners-Lee*，网络的发明者，也是
  Semantic Web 愿景的创建者之一，意识到了这一点，并推出了 Linked Data 原则（http://www.w3.org/DesignIssues/LinkedData.html）。这些原则将
  Semantic Web 的重点转移到创建与其他数据集互联的数据上。原则如下：


  - 1. 使用 URI 作为事物的名称

  - 2. 使用 HTTP URI，以便人们可以查找这些名称

  - 3. 当有人查找一个 URI 时，使用标准（RDF、SPARQL）提供有用的信息

  - 4. 包含指向其他 URI 的链接，以便他们可以发现更多事物


  因此，第一条原则要求为你的概念使用无歧义的标识符，第二条原则特别要求使用 HTTP URI，即 URL。这些原则已在我们将用于 reconciliation 的数据集中使用。第三条原则关注你的数据如何发布。事实上，RDF
  扩展允许我们将数据集导出为 RDF，所以这也涵盖了。第四条原则是关于链接到其他数据集，这正是 reconciliation 将为我们做的事情。


  言归正传，让我们开始 reconciliation。像 *Recipe 1 – reconciling values with Freebase* 一样，转到
  **Categories** 下拉菜单并导航到 **Reconcile | Start reconciling...**，这将在你的屏幕上打开 reconciliation
  对话框。这次，选择左侧你已在上一条 recipe 中安装的 **LCSH reconciliation service**。OpenRefine 现在将尝试一些单元格值，以查看是否能确定其类型。几秒钟后，它建议值类型为
  skos:Concept。这确实是正确的，因为所有 **Category** 值实际上都是概念。你可以保留所有设置不变并点击 **Start Reconciling**。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_88_0.png)


  当 reconciliation 完成后，你会注意到三件事。首先，OpenRefine 创建了两个 facets，帮助我们找到匹配和未匹配的行。其次，你会在 **Category**
  列顶部看到一个绿色条，指示有多少单元格值已被 reconciliation。第三，单元格值显示方式不同；有些是蓝色的，其他则有新选项。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_89_0.png)


  让我们先关注显示为蓝色的已 reconciliation 值。你看到的越多，reconciliation 就越成功（因此列顶部的条会越绿）。它们是蓝色的，因为它们实际上是链接；如果你点击它们，就会进入该术语已被
  reconciliation 到的 URL 页面。例如，如果我们点击 **Specimens** 链接，我们将被导向 `http://id.loc.gov/authorities/subjects/sh87006764.html`，这确实是美国国会图书馆主题词表中
  Specimens 的条目。这就是我们创建 Linked Data 的方式；而不是仅仅字符串 Specimens，对计算机来说看起来像九个随机字符，OpenRefine
  将该值与一个 URL 进行了 reconciliation。该 URL 可被机器解释，因为该 URL 又链接到其他 URL，有助于定义其含义。


  当你看到黑色未 reconciliation 的值时，对于该特定术语你运气不佳。它们不是链接，因此 OpenRefine 无法自动找到匹配的 URL。未 reconciliation
  的值有两种情况；首先是找到了一些建议，但 OpenRefine 无法找到正确的一个。在这种情况下，它会为你列出几个替代方案。如果其中任何一个替代方案是正确的，你可以点击单个复选标记，这将仅用所选术语替换当前单元格值，或点击双重复选标记，这将替换所有具有相同值
  的单元格。请注意替换所有相同值时要小心，因为其中一些可能实际上指的是另一个术语。请注意，你也可以点击建议，这会带你到其对应的网页以获取更多信息。


  未 reconciliation 值的另一种情况是 OpenRefine 没有找到任何建议。在这种情况下，你就没什么运气了。也许所讨论的术语在你进行 reconciliation
  的数据集中不存在，或者名称不同。无论如何，你唯一能做的就是手动分配一个 URL。为此，点击 **search for match** 链接，这将显示一个对话框，帮助你找到正确的匹配项。






  ## 链接数据集


  最后一种选项是通过点击**创建新主题**链接，或从**搜索匹配**对话框中选择**新主题**按钮，为单元格值创建一个新主题。这不会在LCSH数据集中创建新的URL（因为您没有这样做的权限），但会将单元格值标记为**新**。这将使您能够在**判断**分面中选择所有这些单元格，以便您能够对它们进行其他操作。例如，您可以将所有新值与另一个数据集进行调和，看看是否能在那里找到匹配项。


  您可能会想知道如何获取调和带来的URL。但同时，我们仍然想保留原始类别名称。因此，正确的方法是基于**类别**列创建一个新列，就像我们之前做的那样。点击**类别**下拉菜单，导航到**编辑列
  | 基于此列添加列...**。我们将此列命名为`Category URLs`。将已调和的单元格转换为其URL的表达式是`cell.recon.match.id`。这行GREL选择单元格，获取其调和信息，取出接受的调和匹配，并提取ID（在这种情况下是URL）。没有匹配的单元格将导致错误，因此请确保针对错误选择了**设为空白**选项。点击确定后，您将看到带有相应URL的新列。


  当您完成调和过程并提取了所需的URL后，您可能希望让**类别**列恢复其原来的外观。毕竟，调和数据仍然存在，而且可能会分散注意力。要清除它，再次进入**类别**下拉菜单，导航到**调和
  | 操作 | 清除调和数据**。此时类别列再次成为普通列。此外，您可以通过点击左侧边栏顶部的**全部移除**来移除分面。


  ## 方法5 – 提取命名实体


  调和对于数据集中包含单个词条的字段效果很好，例如人名、国家或艺术作品。然而，如果您的列包含连续文本，则调和无法帮助您，因为它只能在其使用的数据集中搜索单个词条。幸运的是，另一种称为`named-entity
  extraction`的技术可以帮助我们。提取算法在文本中搜索命名实体，这些实体是文本元素，例如人名、地点、数值、组织和其他广泛知名的事物。除了仅仅提取词条外，大多数算法还会尝试进行消歧。例如，如果算法在文本中找到华盛顿，它会尝试确定提到的是城市还是人物。这使我们不必对提取的词条执行调和。


  OpenRefine本身不支持命名实体识别，但命名实体识别扩展为您添加了此功能。在继续本方法之前，请从`http://software.freeyourmetadata.org/ner-extension/`下载扩展，并按照*安装扩展*的方法操作。如果安装成功，在重新启动OpenRefine后，屏幕右上角会出现**命名实体识别**按钮。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_91_0.png)


  > 对于本方法，您可能希望从类别未被拆分为多行的数据集开始，因为如果单个记录中找到多个词条，命名实体识别将创建新行。如果每个记录已经有多个行，这可能会变得混乱。


  查看Powerhouse Museum数据集，我们看到**描述**列是命名实体提取的良好候选，因为它包含连续文本。如果我们想将此字段链接到其他数据集，我们必须首先提取实体。为此，点击**描述**下拉菜单，并在底部选择**提取命名实体…**。屏幕上将出现**提取命名实体**对话框。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_91_1.png)


  该扩展本身不包含任何命名实体识别算法，而是使用现有服务，就像调和功能也依赖外部调和服务一样。这使您可以选择自己喜欢的服务。然而，与开放的调和服务相比，一些命名实体识别服务要求您创建账户。虽然所有受支持的服务都有免费选项，但其中一些还提供高级账户，为您带来额外好处，例如更快或无限制的提取。


  DBpedia Spotlight服务不需要账户，因此已经可用。因此，在对话框中勾选其复选框，并选择开始提取。OpenRefine现在将开始提取过程，这可能需要一些时间。因此，正如我们之前解释的那样，先在子集上尝试提取可能会很有趣。高级服务可能提供更快的提取。但是，如果您勾选多个复选框以同时使用多个服务进行提取，则提取速度只与最慢的服务一样快。


  当命名实体识别完成后，您会看到OpenRefine在描述列旁边创建了一个名为DBpedia Spotlight的新列。


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_92_0.png)


  在这个新列中，您可以看到提取的词条。如果找到多个词条，它们会跨多行拆分，因此您可以在OpenRefine的行和记录模式之间切换。截图显示DBpedia Spotlight在记录162中找到两个词条，在记录173中没有找到词条，在记录184中找到一个词条。如您所见，词条以蓝色显示，表明它们实际上是链接。例如，如果您点击Leeds
  Town Hall，您会到达一个关于这座建筑的页面，其中包含指向相关资源的链接。这是Linked Data的最佳体现；过去只能由人类阅读的文本字段，现在包含了机器可解释的指向其所含概念的链接。


  但是，您可能会失望地发现并非所有单元格值都有相关的词条。那么，让我们看看其他服务是否做得更好。为此，我们必须为每一项服务添加账户信息。要执行此操作，点击右上角的命名实体识别按钮，并选择配置API密钥...。以下对话框显示支持的服务及其所需的配置参数：


  ![](img/f5874463a5242c6e8e1824fdc2a73ac7_93_0.png)


  例如，如果您想使用Zemanta执行命名实体识别，请将您的应用程序编程接口（API）密钥添加到相应字段。如果您还没有API密钥，请点击配置说明链接。这将带您进入一个页面，其中列出了通过Zemanta获取API密钥的步骤。所有服务都有免费选项，因此您只需注册一个账户，就可以在您的数据上试用该服务。除此之外，某些服务还可以配置额外的参数，这些参数决定服务的功能。配置说明在这里非常有帮助。


  当您配置了额外的服务，并再次在**描述**列上尝试命名实体提取时，您现在将能够同时选择多个服务。每个单独服务的结果将被添加到一个新列，因此您可能会有额外的**Zemanta**和**AlchemyAPI**列，每列都包含提取的词条。根据数据集的不同，您可能会在某个服务上取得更大的成功，因此一定要进行实验！


  ## 总结


  在本章中，我们看到了如何将您的数据集从一座孤岛转变为互联的数据集合。一方面，您可以对包含简单字段值的列执行调和。因此，单元格中的文本通过添加一个可以在线查找的URL而获得意义。您可以使用内置的Freebase调和，或安装RDF扩展，该扩展允许针对Linked
  Data源进行调和。另一方面，您可以再次使用扩展对包含流动文本的单元格执行命名实体识别。这使OpenRefine能够在单元格值中搜索概念，并尝试为每个概念找到URL。最终，您的数据集将丰富地链接到其他数据集，当您在网上发布数据集时，这是一项宝贵的资产。




