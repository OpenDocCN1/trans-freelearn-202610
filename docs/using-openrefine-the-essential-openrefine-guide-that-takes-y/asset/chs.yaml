- "# 深入 OpenRefine\n\n在本开篇章中，我们将了解 OpenRefine 的用途、为什么要使用它，以及如何使用它。在简短介绍之后，我们将学习七个基本操作指南，让你初步领略\
  \ OpenRefine 的强大功能：\n\n- 操作指南 1 – 安装 OpenRefine\n- 操作指南 2 – 创建新项目\n- 操作指南 3 – 探索你的数据\n\
  - 操作指南 4 – 操作列\n- 操作指南 5 – 使用项目历史\n- 操作指南 6 – 导出项目\n- 操作指南 7 – 增加内存\n\n虽然每个操作指南都可以独立阅读，但我们建议\
  \ OpenRefine 的新手用户按照原有顺序阅读，至少前几个操作指南应按顺序阅读，因为它们提供了有关其整体运作方式的关键信息。已经安装并运行 OpenRefine\
  \ 的高级用户则可以按任何顺序挑选他们喜欢的技巧。\n\n## OpenRefine 简介\n\n让我们面对一个不争的事实：你的数据是杂乱的。所有数据都是杂乱的。无论你在创建大型数据集时多么小心，错误总会出现，尤其是当数据集的创建涉及多人并且/或者跨越了较长时间时。无论你的数据是数字原生还是数字化而来的，无论它们存储在电子表格还是数据库中，总会有某些地方出错。\n\
  \n### Windows\n\n- 1. 下载 ZIP 压缩包。\n- 2. 解压缩并将压缩包内容提取到你选择的文件夹中。\n- 3. 双击 `openrefine.exe`\
  \ 启动 OpenRefine。\n\n### Mac\n\n- 1. 下载 DMG 文件。\n- 2. 打开磁盘映像并将 OpenRefine 图标拖入 `Applications`\
  \ 文件夹。\n- 3. 双击图标启动 OpenRefine。\n\n### Linux\n\n- 1. 下载 gzipped tar 压缩包。\n- 2. 将文件夹解压到你的主目录。\n\
  - 3. 在终端中输入 `./refine` 启动。\n\n需要注意的是，默认情况下，OpenRefine 只会为 Java 分配 1 GB 内存。虽然这足以处理小型数据集，但在处理较大的数据集合时很快就会显得捉襟见肘。在\
  \ *操作指南 7 – 增加内存* 中，我们将详细介绍如何让 OpenRefine 分配更多内存，该操作也因操作系统的不同而有所差异。\n\n## 操作指南 2\
  \ – 创建新项目\n\n在本操作指南中，你将学习如何将数据导入 OpenRefine，无论是通过**创建**新项目并加载数据集、**打开**之前会话中的现有项目，还是**导入**他人的项目。\n\
  \n如果你按照 *操作指南 1 – 安装 OpenRefine* 中的说明成功安装并启动了 OpenRefine，你会注意到 OpenRefine 会在你的默认浏览器中打开。然而，重要的是要认识到该应用程序是在本地运行的：你不需要互联网连接即可使用\
  \ OpenRefine，除非你想通过使用扩展程序将你的数据与外部来源进行调和（有关此类高级用法，请参阅 *附录：正则表达式和 GREL*）。同时请放心，你的敏感数据不会被存储到网上或与任何人共享。实际上，OpenRefine\
  \ 使用你本地机器的 3333 端口，这意味着你可以通过 URL `http://localhost:3333/` 或 `http://127.0.0.1:3333/`\
  \ 访问它。\n\n## 深入 OpenRefine\n\n这是你首次打开 OpenRefine 时会看到的启动界面：\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_22_0.png)\n\
  \n在左侧，有三个选项卡可用：\n\n- **创建项目**：此选项将数据集加载到 OpenRefine 中。这是你首次使用 OpenRefine 时需要的选项。如前面的截图所示，支持多种格式。你可以通过不同的方式导入数据：\n\
  \  - **这台计算机**：选择存储在你本地机器上的文件\n  - **网址（URL）**：直接从在线来源导入数据*\n  - **剪贴板**：将你的数据复制粘贴到文本字段中\n\
  \  - **Google 数据**：启用对 Google 电子表格或 Fusion Table 的访问*\n  \n  *需要互联网连接\n- **打开项目**：此选项帮助你返回到之前会话中创建的现有项目。下次启动\
  \ OpenRefine 时，它会显示现有项目列表，并建议你继续处理之前使用过的数据集。\n- **导入项目**：使用此选项，我们可以直接导入现有的 OpenRefine\
  \ 项目归档文件。这使你能够打开其他人导出的项目，包括自项目创建以来对数据执行的所有转换的历史记录。\n\n## OpenRefine 支持的文件格式\n\n\
  以下是 OpenRefine 支持的一些文件格式：\n\n- 逗号分隔值（CSV）、制表符分隔值（TSV）和其他 *SV 格式\n- MS Excel 文档（.XLS\
  \ 和 .XLSX）以及 Open Document Format（ODF）电子表格（.ODS），尽管后者未被明确提及\n- JavaScript 对象表示法（JSON）\n\
  - XML 和资源描述框架（RDF）作为 XML\n- 基于行的格式（日志）\n\n如果你需要其他格式，可以通过 OpenRefine 扩展程序添加。\n\n\
  使用 OpenRefine 创建项目非常简单，只需三个简单步骤：选择文件、预览导入，以及确认让 OpenRefine 创建项目。让我们通过点击**这台计算机**选项卡中的**选择文件**按钮来创建一个新项目，选择你的数据集（请参阅下面的信息框），然后点击**下一步**。\n\
  \n> 虽然我们鼓励你在自己的数据集上尝试 OpenRefine，但你能够重现本书中使用的示例可能会很有用。为了便于阅读，本书所有操作指南均使用悉尼动力博物馆（Powerhouse\
  \ Museum）的数据集进行演示，你可以从 http://www.packtpub.com 的账户中免费获取该数据集（使用 chapter1.tsv 文件）。请随意下载此文件并将其加载到\
  \ OpenRefine 中，以便更轻松地跟随操作指南进行操作。其余章节也有类似格式的文件可供下载。如果你在其他地方购买了这本书，可以访问 http://www.packtpub.com/support\
  \ 并注册，以便将文件直接通过电子邮件发送给你。\n\n在下一个屏幕上，你会看到数据集在 OpenRefine 中的呈现概览。在右下角，你可以看到以下解析选项，如下面的截图所示：\n\
  \n![](img/f5874463a5242c6e8e1824fdc2a73ac7_23_0.png)\n\n默认情况下，第一行将被解析为列标题，这是一种常见做法，并且适用于\
  \ Powerhouse 数据集。OpenRefine 还会尝试猜测每个单元格的类型，以区分字符串、整数、日期和 URL 等。这在之后对数据进行排序时会很有用（例如，如果你选择将单元格保持为纯文本格式，10\
  \ 会排在 2 之前）。\n\n此屏幕上可以看到四个区域；让我们从上到下逐一介绍，即前面截图中编号为 1 到 4 的区域：\n\n- 1. **总行数：** 如果你没有忘记指定忽略引号（请参阅\
  \ *操作指南 2 – 创建新项目*），你应该会看到 Powerhouse 文件中共有 **75814 行**。当数据按给定条件过滤时，此栏会显示类似 **123\
  \ 行匹配（共 75814 行）** 的信息。\n  \n- 2. **显示选项：** 尝试点击**行**或**记录**这两个词之一来切换。确实，不会有太大变化，只是你现在可能会在区域\
  \ 1 中看到 **75814 条记录**。在新建项目中，行数总是等于记录数，但从现在起它们将独立变化。该区域还允许你选择每页显示 5、10、25 或 50 行/记录，并提供了正确的翻页导航方式。\n\
  \  \n- 3. **列标题和菜单：** 你可以在这里找到创建项目时被解析为列标题的第一行。在 Powerhouse 数据集中，列显示为**记录 ID、对象标题、注册号**等（如果你取消选中**将接下来的\
  \ 1 行解析为列标题**选项框，则会看到**列 1、列 2**等）。最左侧的列始终称为**全部**，分为三个子列，分别包含星标（例如用于标记好记录）、旗帜（例如用于标记坏记录）和\
  \ ID。带星标和带旗帜的行可以轻松地进行分面操作，我们将在 *第 2 章，分析和修复数据* 中看到。每一列还有一个菜单（请参阅下面的截图），可以通过点击列标题左侧的小下拉箭头来访问。\n\
  \  \n- 4. **单元格内容：** 此区域为显示单元格实际值的主要区域。\n\n![](img/f5874463a5242c6e8e1824fdc2a73ac7_25_0.png)\n\
  \n\n开始对数据进行剖析和清理之前，了解数据并熟悉 OpenRefine 很重要：使用水平滚动条查看每一列，以验证列标题是否已正确解析，单元格类型是否被正确猜测，等等。将每页显示的行数改为\
