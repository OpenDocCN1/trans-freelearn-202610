  ## 配方 4 – 操作列\n\n在本菜谱中，你将学习如何在 OpenRefine 中**折叠**列并再次**展开**，**移动**列到任意方向，或随意**重命名**和**删除**列。\n\
  \n列是 OpenRefine 的重要组成部分：它们包含成千上万相同性质的值，并且可以以多种方式进行操作。\n\n### 折叠和展开列\n\n默认情况下，OpenRefine\
  \ 中所有列都是展开的，如果项目中有很多列，这可能会很麻烦。如果你想暂时隐藏一列或多列以便于对其他列进行操作，请点击任意列中的下拉菜单显示菜单并选择 **View**。有四个选项可供选择：\n\
