  \ back and try to pinpoint the problem with `testAddResultToTempAt`。\n\n## 摘要\n\n\
  在本章中，我们介绍了使用 Eclipse 和 JUnit 创建单元测试的基础知识。你看到了 Eclipse 如何能够生成测试方法存根并通过无缝集成 JUnit\
  \ 来自动化这些方法的执行。此外，我们还概述了 JUnit 的主要功能，例如最常用的注解。除了单元测试之外，本章还简要介绍了如何使用 Java 内置的 Eclipse\
  \ 调试器。\n\n请记住，本章中我们没有涵盖一些与测试相关的话题。早些时候在章节中，我们提到测试需要彼此独立，以便你可以按任意顺序重新运行它们。有时，对象会与其他对象交互，这使得创建独立的测试方法变得更加复杂。在单元测试中，当存在可能损害测试独立性的对象或其复杂性使得使用真实对象不切实际时，就会使用模拟对象。这些模拟对象模拟真实对象的行为。幸运的是，有框架可以自动化创建模拟对象所涉及的大部分过程。我们鼓励感兴趣的读者阅读关于\
  \ Mockito（http://code.google.com/p/mockito/）的内容。\n\n除了一个好的测试方法集合之外，每当你着手开发一个合理规模的应用程序时，你都需要有一个备份策略。通常，对于代码项目而言，此策略包括使用版本控制程序。跟踪程序不同版本的程序称为版本控制系统。下一章描述了一个版本控制系统的示例，即\
  \ Git。\n\n\n"
- "# 4 版本控制系统\n\n**源代码管理**，或 **版本控制**，是管理代码修订（并附带注释）的实践，以便代码可以轻松检索。**版本控制系统（VCS）**\
  \ 的概念由来已久。最早的实现是面向文件的、集中的，并且没有网络访问能力。\n\n进化伴随着 **Concurrent Versions System (CVS)**\
  \ 而来，它专为协作开发而设计，采用合并机制而非基于锁定的机制。最新一代带来了重大的概念修改，即完全去中心化。\n\n这显然更合适，因为如今基于网络的系统在不久的将来很可能会成为最常用的系统。一个良好的版本控制系统至少应提供以下功能：\n\
  \n- 添加、删除、重命名或删除文件的可能性\n- 查找哪些文件被哪个用户在何时更改的可能性\n- 跟踪产品多个版本的提供\n- 在版本之间前后切换的可能性\n\
  - 合并代码的可能性\n- 撤销修改的提供（回溯历史）\n\n在本章中，我们将介绍 VCS 的主要特征以及如何在 **Eclipse** 平台中使用三种最流行的版本控制系统，即\
  \ CVS、**Subversion (SVN)**，和 **Git**。\n\n## CVS\n\n产品的开发通常由多名软件工程师完成。CVS 等版本控制系统通常用于管理与开发相关的文件。虽然版本控制系统通常应用于编程项目，但它们并不限于此目的，可用于任何涉及数据文件管理的任务。\n\
  \nCVS 基于分支的概念，其中每个开发人员都可以将自己的修改提交到同一组资源中。主分支 HEAD 通常在确定实现稳定时使用。可以随时使用多个分支并将文件合并到主分支。\n\
  \nCVS 仓库维护了随时间推移对资源所做的每次提交更改的历史记录。资源可以与任何先前的现有修订进行比较或替换。\n\nEclipse 提供了合并、提交和访问项目历史的设施。在以下各节中，我们将介绍有关使用\
  \ CVS 技术的基本功能。\n\n### 仓库\n\n首先需要做的是将 Eclipse 工作区连接到 CVS 仓库。此操作可以通过导航到 文件 | 新建 |\
  \ CVS | CVS 仓库位置 来执行。如下图所示的窗口将会出现：\n\n### 添加新的 CVS 仓库\n\n将新的 CVS 仓库添加到 CVS 仓库视图\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_89_0.png)\n\n需要选择所需仓库的主机、仓库路径、用户名和密码。仓库将被添加到工作区，并将看到\
  \ CVS 仓库视图的以下截图：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_89_1.png)\n\n### 检出项目\n\
  \n要检出项目，请展开 **HEAD** 标签，选择下面的项目，右键单击它，然后转到 **Checkout**。这将把项目加载到工作区。\n\n也可以通过导航到\
  \ **文件 | 新建 | CVS | 来自 CVS 的项目** 使用向导。您可以选择 **仓库位置**，然后在第二页中选择您想要工作的项目列表。\n\n###\
  \ 同步\n\n在编辑项目的资源时，您有时会想要将其提交回仓库。为此，您可以单击资源并选择 **Synchronize with Repository**。\n\
  \n一个 **synchronize** 视图将被打开。其中有三个选项：\n\n- **Incoming** 模式，视图仅显示传入的更改\n- **Outgoing**\
  \ 模式，显示传出的更改\n- **Both modes together**\n\n要将更改提交到仓库，您可以导航到 **outgoing changes**\
  \ 选项并选择 **Commit**。要将任何可能的更改加载到工作区，请右键单击 **incoming changes** 选项并选择 **Update** 选项。\n\
  \n在提交或更新时可能会发生冲突；例如，假设您和另一位开发人员修改了同一资源。在这种情况下，可以使用 **merge** 工具来选择要保留的版本。\n\n###\
  \ 分支\n\n例如，当需要保留产品的多个版本时，建议创建分支；可以通过执行以下步骤完成：\n\n- 1. 右键单击项目后，转到 **Branch** 选项。\n\
  - 2. 在随后的窗口中，保持 **start working in the branch** 复选框被选中。\n  CVS 将自动提出一个版本名称，可稍后用于合并目的。\n\
  - 3. 在 **CVS repository** 视图中，可以在 **Branches** 节点下看到创建的分支。\n\n## SVN\n\nSVN 或 Subversion，允许多个开发人员在同一项目上工作。项目通常保存在服务器上，正在其上工作的开发人员会从服务器检出（创建本地副本）文件。也可以将修改后的文件提交回服务器。为了执行任何操作，需要连接到服务器。\n\
  \n与 CVS 相比，SVN 不仅可以跟踪文件更改历史，还可以跟踪有关共享项目的全部更改，例如允许添加、删除或移除所有资源而不创建新项目，并且不会丢失有关已删除项目的信息。SVN\
  \ 中的提交操作是绝对原子的，即仓库永远不会处于不一致状态，并且支持版本化属性。\n\nEclipse 默认情况下不集成 SVN 客户端。需要安装额外的插件，即\
  \ **Subversive project**。尽管如此，它在 Eclipse 门户中作为 Eclipse 项目维护。另一个选项是使用 **Subclipse\
  \ project** (http://subclipse.tigris.org/)。Subversive 插件旨在将 Subversion 版本控制系统与 Eclipse\
  \ 平台集成。该插件允许直接从 Eclipse 工作台以与 CVS 和 Git 等其他 Eclipse 版本控制提供程序类似的方式处理存储在 Subversion\
  \ 仓库中的项目。\n\n该项目由 Polarion 公司于 2005 年作为开源项目启动，后于 2007 年迁移到 Eclipse 旗下，成为官方 Eclipse\
  \ 项目。如今，Subversive 项目包括作为 Eclipse 开源项目开发的 Eclipse 用 Subversive 插件，以及作为外部开源项目开发的\
  \ Subversion 连接器。\n\nSubversive 被设计为功能齐全的 SVN 客户端，因此可以从 Eclipse 环境直接更新、提交、合并更改、使用\
  \ SVN 属性、查看更改历史记录并执行其他 SVN 操作。此外，Subversive 与 Subversion 项目一起发展，为 Eclipse 用户提供在\
  \ SVN 实现新版本中出现的特性。\n\n插件的 **Juno version** 可以使用 update-site http://download.eclipse.org/technology/subversive/1.0/update-site-1.0.1/\
  \ 进行安装。\n\n## 版本控制系统\n\n要安装它，只需导航到 **Help | Install new Software** 并按以下截图所示添加更新站点：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_92_0.png)\n\n为了举例说明 SVN 的使用，我们将以 **Apache\
  \ Hadoop repository** 为基础。要将仓库与 Eclipse 工作区关联，您需要导航到 **File | New | SVN | Repository\
  \ Location** 并用服务器位置 `http://svn.apache.org/repos/asf/hadoop/common/` 填写以下屏幕。请看以下截图：\n\
  \n\n![](img/d7c3f2018603810fae83e1a6fd98749e_93_0.png)\n\n点击 **Finish** 后，仓库将被添加到\
  \ **SVN Repositories** 视图中，并且可以在此处查看 **trunk**、**branches** 和 **tags** 节点。在 **trunk**\
  \ 节点中，您将看到所有维护的文件和早期版本。可以选择特定版本来指定起点。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_93_1.png)\n\
  \n可能在给定的版本控制系统中存在多个分支，可以在 **branch** 节点中进行选择。\n\n**tags** 通常被定义以便更轻松地转到产品的特定版本，并将其与提交关联；例如，指定产品版本号。\n\
  \n与 **Checkout**、**Update** 和 **Commit** 相关的操作与我们在 CVS 部分介绍的内容非常相似。\n\n## Git\n\n\
  Git 与 SVN 的工作方式略有不同。它不会复制仓库，而是克隆它。在这种情况下，由于完整的仓库可用，可以在不连接互联网的情况下执行任何操作。可以执行多个操作，例如分支、合并或提交。\n\
  \nGit 与 SVN 之间的一些差异如下：\n\n- Git 是分布式的\n- Git 存储的是元数据而不是实际文件以及现有提交\n- 由于操作在本地执行，Git\
  \ 可以在没有活动互联网连接的情况下工作\n\nEclipse 自带一个预装插件来处理 Git 程序。**EGit** 是 Eclipse 插件，提供 Git\
  \ 版本控制系统。如前所述，由于 Git 是分布式源代码管理器，每个开发人员都拥有代码每个版本历史的完整副本，使得对历史的查询非常快速和灵活。\n\n如果需要安装它，用户可以导航到\
  \ **Help | Install New Software** 并添加仓库 http://download.eclipse.org/egit/updates，如以下屏幕截图所示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_95_0.png)\n\n使用 EGit 插件时，可以将透视图更改为 EGit\
  \ 透视图。为此，只需导航到 **Window** | **Open Perspective** 并选择 **Git Repository Exploring**。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_96_0.png)\n\n要创建 **Git repository**，可以导航到\
  \ **File** | **New** | **Git** | **Git Repository**。如果需要，可以创建本地仓库。另一个选项是从已存在的项目导入文件，方法是导航到\
  \ **File** | **Import** | **Git** | **Projects from Git**，如下图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_96_1.png)\n\
  \n在此示例中，我们使用 Eclipse 项目的仓库和 Linux 工具，可以使用以下 URL 克隆\n\n```\ngit://git.eclipse.org/gitroot/linuxtools/org.eclipse.linuxtools.git.\n\
  ```\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_97_0.png)\n\n仓库克隆后，**Local** 和 **Remote\
  \ Tracking** 会在 **Git** 透视图中显示。主要的 **Branches** 节点是 master 节点；不过，其他分支也可以在透视图的 **Branches**\
  \ 节点中创建和可视化。通过支持分支，Git 允许您并行处理资源集合的不同版本。可以在一个不同的分支上处理 bug 修复，并在工作完成后将其合并回主分支。Git\
  \ 中的 **Branches** 是本地的。从另一个仓库克隆的本地仓库中创建的分支不需要在 **remote repository** 中有对应项。**Local**\
  \ 分支可以与充当另一个远程仓库中分支状态代理的 **Remote Tracking** 分支进行比较。\n\n像 SVN 和 CVS 一样，也可以通过转到以下屏幕截图中显示的\
  \ **History** 选项卡来查看更改历史记录：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_98_0.png)\n\
  \n在之前的屏幕截图中，可以看到最近的提交，以及 **Author**、**Committer** 和 **Committed Date** 的详细信息。如果选择\
  \ **commit**，就可以可视化更多信息。也可以通过右键单击特定提交并选择 **Rebase** 选项，将资源重新定位到该提交的位置。\n\n通过右键单击某个分支并转到\
  \ **Checkout** 选项检出该分支后，项目将在 Eclipse 工作区中可用。当您修改某个文件时，通常需要将该修改添加到本地提交，以便将其推送到远程仓库。通常在提交到\
  \ **Git repository** 之前，您需要标记应提交的更改。此操作称为将文件添加到暂存区。然而，在 EGit 插件中，您可以在右键单击正在使用的分支时选择\
  \ **commit** 选项，从而在 **GUI interface** 中选择要提交的文件。之后，需要输入提交消息描述所执行的修改。\n\n执行此操作后，可以使用\
  \ **push** 选项将此修改推送到上游。在某些情况下，当其他人也修改了同一资源时，可能会出现合并冲突；它们可以借助 EGit 的合并工具解决。右键单击包含当前分支（本例中为\
  \ **master**）的节点时可以看到 **commit** 选项。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_99_0.png)\n\
  \n另一个可以执行的操作是 checkout。此操作允许您在仓库的分支之间跳转。在 EGit 中，只需右键单击所需分支并选择 **Checkout** 选项即可。记住检查您是否已提交在上一个分支中执行的任何更改，否则如果您将其暂存（丢弃），它们可能会丢失。\n\
  \n当使用 **remote repository** 更新本地仓库时，您需要使用 **fetch** 选项。之后，您可以选择使用 **rebase** 选项将上游仓库与您的仓库\
  \ **rebase** 或 **merge**；这意味着仓库将被克隆，您尚未上游的可能提交稍后将应用于树。另一个选项是将本地提交中存在的文件与 **remote\
  \ repository** 合并。如果选择使用 **pull** 选项，默认情况下它会执行 **fetch** 和 **merge** 操作。\n\n## Summary\n\
  \n本章中，我们讨论了一种组织和跟踪源文件修改的方法，这对于软件项目的开发通常是必要的。\n我们介绍了 CVS、SVN 和 Git 版本控制系统，它们可以被认为是当今最流行的系统。我们特别关注了\
  \ Git，这是一种趋势技术，因为它是一种最近引入的分布式选项。\n\n在下一章中，我们将讨论如何使用 Eclipse 最常用的 API 之一：SWT 来处理图形编程。\n"
- "# 5 SWT\n\n**Standard Widget Toolkit (SWT)** 由 Eclipse 项目开发人员创建的一组工具组成，用于轻松构建 **Graphical\
  \ User Interface (GUI)** 应用程序。此开源小部件工具包通过专注于目标操作系统，提供对用户界面设施的高效和可移植访问。\n\n尽管 Java\
  \ 通过使用 **Abstract Windowing Toolkit (AWT)** 和 Java 基础类（swing）提供了 GUI 应用程序开发的支持，但两者都无法与目标操作系统无缝集成。\n\
  \nSWT 支持使用操作系统特定库的小部件，并通过一组负责与本地代码通信的 Java 类授予对其的访问权限。其结果是与本地代码实现更好的性能，同时保留仅编写一次所需代码的能力，以便可在多个平台上使用。由于代码是本地的，应用程序的外观和感觉遵循目标平台，绘制图形的任务由编译代码执行，该代码不是\
  \ **Java Virtual Machine (JVM)** 的一部分。一个小缺点是需要为每个将执行应用程序的平台部署运行时库。\n\n本章讨论以下主题：\n\
  \n- 设置用于开发 SWT 应用程序的环境\n- 小部件和显示\n- 各种用户界面元素（控件），例如标签、文本、列表、按钮和组合框\n- 布局样式\n\n\n\
  \n\n## 入门\n\n如前所述，SWT 是 Java 的部件工具包。部件是为与用户交互而开发的 GUI 元素。文本、标签、列表和按钮都是部件的例子。为了使用部件并开始\
  \ SWT 应用的开发，必须执行一些配置，如下一节所述。\n\n## 设置\n\n尽管 SWT 已作为 Eclipse 插件 API 的一部分集成，但对于旧版本或独立应用程序的开发，可能需要下载独立的\
  \ SWT。\n\n为此，必须前往 www.eclipse.org/swt。选择适当的版本后（在本例中为 swt-4.2.1-gtk-linux-x86.zip），需要通过\
  \ 文件 | 导入... | 将现有项目导入工作区 | 选择归档文件 将下载的文件导入 Eclipse，并点击 浏览 按钮定位 SWT 库文件，如以下截图所示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_102_0.png)\n\n(a) 导入源\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_103_0.png)\n\
  \n(b) SWT 库归档文件\n\n完成这些初始步骤后，需要将库包含在工作项目的 Java 构建路径中。以下展示了一个示例 Hello World SWT 程序的源代码，我们在解释如何将库添加到路径时使用它：\n\
  \n```\nimport org.eclipse.swt.widgets.*;\npublic class HelloWorld {\n    public\
  \ static void main(String[] args) {\n        Display display = new Display();\n\
  \        Shell shell = new Shell(display);\n        shell.setText(\"Hello, World.\"\
  );\n        shell.open();\n        while (!shell.isDisposed()) {\n            if\
  \ (!display.readAndDispatch())\n                display.sleep();\n        }\n  \
  \      display.dispose();\n    }\n}\n```\n\n在此示例代码中展示了 SWT 应用的基础，该代码的输出如以下截图所示。Display\
  \ 对象创建了与平台窗口系统的连接，Shell 对象使用该连接构建一个包含文本 Hello, World. 的窗口。随后在循环中，窗口系统等待用户执行会导致应用程序终止的操作。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_104_0.png)\n\n要正确运行和编译此示例 SWT 程序，您需要将\
  \ SWT 库项目添加为依赖项。此操作可以通过打开 Java 项目的属性对话框，并在 Java 构建路径 页面中包含 org.eclipse.swt 项目来完成，如以下截图所示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_104_1.png)\n\n## 部件\n\n部件是负责维护与用户交互的\
  \ GUI 元素，根据执行的运算保持并重绘其状态。当事件发生时，该事件可能是用户操作或程序代码内部操作的结果，部件会重绘自身以显示新的状态。\n\n使用标准构造函数创建部件。如\
  \ *设置* 节代码片段所示，当不再需要它们时，它们会被显式释放。与传统的 Java 类不同，您可以注意到这种行为，因为部件使用必须手动释放以避免资源泄漏的操作系统资源。Java\
  \ 垃圾回收器不会释放操作系统资源。\n\n在此上下文中，当创建 SWT 对象或调用基于 SWT 资源的 对象时，需要手动释放它。如果资源有父级，释放它也会导致其子级被释放。\n\
  \n在 SWT 中，使用一组部件实例构建用户界面。为此我们有控制元素，即包含在应用程序窗口（称为 Shell）中的用户界面。诸如 Buttons、Texts、Labels\
  \ 和 Tables 等多个普通元素继承自抽象类 Control。\n\n为了处理操作，而不是通过子类化来实现对 GUI 修改做出反应的代码，建议程序员使用适当添加到部件的事件和监听器。监听器用于在事件发生时通知程序。\n\
  \n您必须了解部件的最后一个主要特性是其应用程序数据。由于不鼓励使用子类化（由于可能因超类修改后子类未重新编译而导致的行为不当），应用程序数据可用于将任何对象与部件关联。setData\
  \ 和 getData 方法可用于此目的，如下例所示：\n\n```\nwidget.setData(\"Doctor\", \"Walter Bishop\"\
  );\nif (\"Walter Bishop\".equals(widget.getData(\"Doctor\"))) {\n    System.out.println(\"\
  I'm perfectly sane!\");\n}\n```\n\n在此示例中，我们将数据作为键/值对存储在部件中，其中键用于获取/查找值对象，即 Doctor\
  \ 键对应于 Walter Bishop 对象，如果 if 语句返回 true，则打印 I'm perfectly sane 消息。\n\n实际情况下可能需要工厂来促进数据的存储，如\
  \ *部件* 节所示。\n\n## 显示\n\n`Display` 类负责将 SWT 与底层窗口系统连接。它不是一个部件；尽管如此，*部件* 节中讨论的一些原则仍然相同，例如事件、监听器和应用程序数据的处理。`Display`\
  \ 的生命周期也类似于部件，应由程序员显式创建和释放。\n\n其中最重要的一个方法是 `readAndDispatch` 方法，可读取和分发事件。该方法从原生部件读取事件并将其分发到\
  \ SWT 事件系统。此连续循环一直执行到主 shell 关闭为止。如果循环被中断，应用程序会立即终止。它在用户界面线程中被调用，许多部件方法也在其中被调用。如\
  \ *设置* 节所示，独立应用程序可以在其 `main` 方法内部创建并调用显示事件处理类。\n\n还可以通过 `setAppName` 方法为应用程序命名，该方法接受单个\
  \ `String` 作为参数。\n\n## 控件\n\n控件是属于更高层窗口的用户界面元素。在本节中，我们将详细介绍其中的一些基本控件，例如标签、文本、列表、布局、按钮和组合框。这些简单控件在开发使用\
  \ SWT 的应用程序时常用。在下一章中，我们将使用更高级的控件和示例扩展本节。\n\n### 标签部件\n\n标签是静态部件，表示不可修改或选择的 对象，可充当字符串、图像或分隔符。它们通常放置在屏幕左侧以描述文本字段，作为不相关字段之间的分隔符或放置图像。\n\
  \n创建标签时可以选择以下样式，并可使用 `|` 运算符组合：\n\n- `SWT.SEPARATOR`: 绘制分隔符\n- `SWT.HORIZONTAL`:\
  \ 水平绘制分隔符\n- `SWT.VERTICAL`: 垂直绘制分隔符\n- `SWT.SHADOW_IN`: 带内阴影效果的分隔符\n- `SWT.SHADOW_OUT`:\
  \ 带外阴影效果的分隔符\n- `SWT.SHADOW_NONE`: 无阴影效果的分隔符\n- `SWT.CENTER`: 将标签对齐到中心\n- `SWT.LEFT`:\
  \ 将标签左对齐\n- `SWT.RIGHT`: 将标签右对齐\n- `SWT.WRAP`: 自动换行文本以适应容器\n\n创建标签部件时使用的主要方法有：\n\
  \n- `setText(String string)`: 设置标签的文本\n- `getText()`: 返回标签的文本\n- `setImage(Image\
  \ image)`: 设置包含在标签中的图像\n- `getImage()`: 返回标签的图像\n\n以下是使用标签的示例代码，以及表示它的部件：\n\n```\n\
  Display display = new Display();\nShell shell = new Shell(display);\nshell.setText(\"\
  Label Sample\");\nshell.setSize(300,200);\nLabel label = new Label(shell, SWT.CENTER);\n\
  label.setText(\"Nothing But The Rain\");\nlabel.setSize(300,300);\n```\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_107_0.png)\n\
  \n需要注意的是，继承的 `setSize` 方法以像素为单位接受水平和垂直尺寸作为参数。\n\n\n\n## 文本控件\n\n文本控件是用于字符串的可编辑文本字段。这些字符串可以包含一行或多行，可用于密码字段。用户也可以对其进行选择。\n\
  \n创建文本控件时可用的样式如下：\n\n- SEARCH：搜索行为，可与图标组合\n- ICON_CANCEL：显示 **取消** 图标\n- ICON_SEARCH：显示\
  \ **搜索** 图标\n- MULTI：允许多行\n- SINGLE：允许单行\n- PASSWORD：显示密码字段行为\n- CENTER：将文本内容对齐到中心\n\
  - RIGHT：将文本内容右对齐\n- LEFT：将文本内容左对齐\n- READ_ONLY：使字段只读\n- WRAP：换行文本而不是滚动行为\n\n文本控件仅支持纯文本，这意味着字符必须具有相同的字体和大小。如果需要更灵活的文本控件，可以使用一个\
  \ `StyledText` 控件，它不是 SWT 的原生控件。\n\n在 SWT 程序中使用文本字段时，控件在应用程序中具有某种功能的情况相当常见。程序员通常需要检测文本何时发生变化或过滤正在输入的字符串。为此，可能需要监听器处理以下文本控件事件：\n\
  \n- `DefaultSelection`：按下 *回车*\n- `Modify`：文本被修改\n- `Verify`：文本待验证\n- `OrientationChange`：方向已更改\n\
  \n在下面的示例中，我们展示如何处理上述提到的其中一个事件，SWT.Modify。为此，我们创建一个文本控件，并为 SWT.Modify 事件添加一个监听器。此事件在用户输入任何字符时发送。此类监听器中代码的目的是计算已输入的字符数。消息显示在文本控件下方的标签中。\n\
  \n```\nDisplay display = new Display();\nShell shell = new Shell(display);\nshell.setSize(200,200);\n\
  final Text text = new Text(shell, SWT.CENTER | SWT.BORDER);\ntext.setSize(200,25);\n\
  final Label label = new Label(shell, SWT.CENTER);\nlabel.setLocation(0,100);\nlabel.setSize(200,25);\n\
  text.addListener(SWT.Modify, new Listener() {\n  public void handleEvent(Event event)\
  \ {\n    label.setText(Integer.toString(text.getText().length()));\n  }\n});\nshell.pack();\n\
  shell.open();\nwhile (!shell.isDisposed()) {\n  if (!display.readAndDispatch())\
  \ display.sleep();\n}\ndisplay.dispose();\n```\n\n以下截图显示了与此代码片段相关的 GUI 输出：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_109_0.png)\n\
  \n需要说明的是，在此示例中我们还使用了 setSize 和 setLocation 方法，它们分别负责设置控件的大小及其位置，以像素为单位的 x 和 y 坐标。pack()\
  \ 方法也用于将控件自动调整为其首选大小。\n\n## 按钮控件\n\n按钮在桌面应用程序中经常使用，因为这些应用程序通常使用鼠标设备。当用户选择一个选项时，可以处理选择事件。按钮可以填充文本或图像，但不能同时使用，并且屏幕上没有获取多行文本的选项。\n\
  \n创建按钮控件时可用的样式如下：\n\n- `ARROW`：以箭头外观绘制按钮\n- `CHECK`：复选按钮行为\n- `PUSH`：按下按钮行为\n- `RADIO`：显示单选按钮行为\n\
  - `TOGGLE`：切换按钮行为\n- `FLAT`：以扁平外观绘制按钮\n- `UP`：绘制上箭头\n- `DOWN`：绘制下箭头\n- `LEFT`：绘制左箭头或左对齐\n\
  - `RIGHT`：绘制右箭头或右对齐\n- `CENTER`：绘制中心箭头或居中对齐\n\n唯一可用的事件是 SWT.Selection 事件，当按钮被点击时触发。\n\
  \n我们展示了如何使用按钮控件的示例，随后是应用程序输出如下：\n\n```java\nDisplay display = new Display ();\n\
  Shell shell = new Shell (display);\nLabel label = new Label (shell, SWT.NONE);\n\
  label.setText (\"Enter your name:\");\nText text = new Text (shell, SWT.BORDER);\n\
  text.setLayoutData (new RowData (100, SWT.DEFAULT));\nfinal Label resultLabel =\
  \ new Label(shell, SWT.BORDER);\nresultLabel.setText(\"Nothing pressed\");\nButton\
  \ ok = new Button (shell, SWT.PUSH);\nok.setText (\"OK\");\nok.addListener(SWT.Selection,\
  \ new Listener() {\n    public void handleEvent(Event event) {\n        resultLabel.setText(\"\
  OK pressed\");\n    }\n});\nButton cancel = new Button (shell, SWT.PUSH);\ncancel.setText\
  \ (\"Cancel\");\ncancel.addListener(SWT.Selection, new Listener() {\n    public\
  \ void handleEvent(Event event) {\n        resultLabel.setText(\"Cancel pressed\"\
  );\n    }\n});\nshell.setLayout (new RowLayout ());\nshell.pack ();\nshell.open\
  \ ();\nwhile (!shell.isDisposed ()) {\n    if (!display.readAndDispatch ()) display.sleep\
  \ ();\n}\ndisplay.dispose ();\n```\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_111_0.png)\n\
  \n在此示例中，我们创建了两个按下按钮，即 OK 和 Cancel，并添加了两个监听器，当每个按钮被按下时触发，显示消息 OK pressed，或 Cancel\
  \ pressed。在实际应用中，此类应用程序的可能用途之一是在按下 OK 按钮时读取文本控件中输入的名称以进行记录。\n\n## 列表控件\n\n列表可用于显示用户可选择的一组字符串。它们以单列呈现，并且有用于从中选择、添加和删除项目的方法。列表的内容可以通过\
  \ setItems(String[] items) 方法设置。当需要设置或替换特定项目时，可以使用 setItem(int index, String item)。\n\
  \n类似于 setItem 方法，该控件通过使用 getItem 或 getItems 方法来获取列表中的一个或多个项目。\n\n项目也可以通过 add 方法添加，并使用\
  \ remove 方法删除。\n\nsetSelection 和 getSelection 方法通常在需要执行与项目选择相关的操作时使用。\n\n列表控件可用的样式如下：\n\
  \n- SINGLE：只能选择一个项目\n- MULTI：可选择多个项目\n\n每个样式的描述相当直接。我们按如下方式列出此控件可用的事件：\n\n- SWT.Selection：选择了一个项目\n\
  - SWT.DefaultSelection：双击了一个项目\n\n使用 SWT.Selection 方法的代码示例如下所述，其后是 GUI 结果如下：\n\n\
  ```\nDisplay display = new Display();\nShell shell = new Shell (display);\nfinal\
  \ List list = new List (shell, SWT.BORDER | SWT.MULTI | SWT.V_SCROLL);\nfor (int\
  \ i=0; i<10; i++) list.add (\"Item \" + i);\nlist.setSize(200, 200);\nlist.addListener\
  \ (SWT.Selection, new Listener () {\n    public void handleEvent (Event e) {\n \
  \       String string = \"\";\n        int [] selection = list.getSelectionIndices();\n\
  \        for (int i=0; i<selection.length; i++)\n            string += selection[i]\
  \ + \" \";\n        System.out.println (\"Selected: \" + string);\n    }\n});\n\
  shell.pack ();\nshell.open ();\nwhile (!shell.isDisposed ()) {\n    if (!display.readAndDispatch\
  \ ()) display.sleep ();\n}\ndisplay.dispose ();\n```\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_113_0.png)\n\
  \n在此示例中，我们使用 add 方法向列表添加了 10 个项目，并处理了事件 `SWT.Selection`。当选择我们示例中的这三个项目时，应用程序将以下字符串输出到控制台：**Selected:\
  \ 2 4 5.**\n\n## 组合框控件\n\n一个 `Combo` 控件， commonly known as combo box， 是 `Text` 控件和\
  \ `List` 控件的组合。`Combo` 控件通常在用户点击 `Combo` 控件中的小图标时显示为下拉列表。\n\n用户可以输入文本字段或从列表中选择项目，但如果需要，组合框可以设置为只读，此时只能选择预定义的项目值。\n\
  \n`Combo` 控件的方法是 `Text` 控件和 `List` 控件方法的组合。\n\n`Combo` 控件可用的样式如下：\n\n- `SIMPLE`：组合框始终具有可见列表\n\
  - `DROP_DOWN`：组合框是下拉列表\n- `READ_ONLY`：组合框不可编辑\n\n`Combo` 控件可用的事件如下：\n\n- `DefaultSelection`：项目被双击或按下\
  \ *回车*\n- `Modify`：文本已被修改\n- `Selection`：项目被选中\n\n\n\n\n我们展示一个如何使用组合框的示例，之后是 GUI\
  \ 输出。\n\n```\nDisplay display = new Display ();\nShell shell = new Shell (display);\n\
  Combo combo = new Combo (shell, SWT.SIMPLE | SWT.READ_ONLY);\ncombo.setItems(new\
  \ String [] {\"Three\", \"Six\", \"Eight\"});\ncombo.setSize(200, 50);\nshell.pack\
  \ ();\nshell.open ();\nwhile (!shell.isDisposed ()) {\n    if (!display.readAndDispatch\
  \ ()) display.sleep ();\n}\ndisplay.dispose ();\n```\n\n在此示例中，使用简单样式与只读样式合并创建了一个组合框。添加了三个项目，且未处理任何事件。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_114_0.png)\n\n## 布局\n\n布局是用于在顶层窗口内定位和调整控件大小的类。它们是平台无关的，并且不与小部件共享相同的行为。\n\
  \n在开发 SWT 应用程序时使用布局不是强制性的；不过，强烈建议使用布局。布局是一种便于管理和定位实际应用程序控件的方式，因为在大型程序中使用 setSize\
  \ 和 setLocation 方法会成为负担。\n\n与手工定位相比，布局提供了一些优势。它们通常能够计算控件的初始大小，并在发生调整大小操作时重新定位它们。\n\
  \n布局类有两种类型：\n- 提供特定 API 给其实现的布局类\n- 与特定布局数据算法一起工作的布局类，该算法可为复合控件的每个子控件分配\n\n布局数据遵循一种算法，该算法利用有关控件应如何定位的额外信息。使用这种类型的布局时，我们需要将复合控件与布局类关联，并将复合控件的子控件与布局数据关联。\n\
  \n无论如何，每个布局都呈现不同的底层算法，在以下各节中我们将描述可用的 SWT 布局。\n\n### FillLayout\n\n最简单的布局类是 FillLayout，它不与布局数据一起工作。它使用可用空间将控件定位在单行或单列中，并为每个控件划分和分配相同的空间。如果未指定任何内容，它假定控件将与最高的一个一样高，与最宽的一个一样宽。FillLayout\
  \ 通常在应用程序只有一个子控件时使用，因为它将完全填充 shell。\n\nFillLayout 提供以下公共字段：\n- `type`：布局方向，可以是 `SWT.HORIZONTAL`\
  \ 或 `SWT.VERTICAL`\n- `marginWidth`：沿布局左右边缘放置的边距像素数\n- `marginHeight`：沿布局顶部和底部边缘放置的边距像素数\n\
  - `spacing`：控件之间空间的像素数\n\n我们按如下方式展示如何定位 10 个 Text 小部件的元素示例。请注意，当应用程序被调整大小时，控件也会由\
  \ FillLayout 调整大小。\n\n```java\nDisplay display = new Display();\nShell shell = new\
  \ Shell(display);\nshell.setLayout(new FillLayout());\nfor (int i=0; i<10; i++)\
  \ {\n    Text text = new Text(shell, SWT.BORDER);\n    text.setText(\"Fill\" + i);\n\
  }\nshell.pack();\nshell.open();\nwhile (!shell.isDisposed()) {\n    if (!display.readAndDispatch())\
  \ display.sleep();\n}\ndisplay.dispose();\n```\n\n以下显示了此代码片段的输出：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_116_0.png)\n\
  \n以下图像显示了调整大小的行为：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_116_1.png)\n\n###\
  \ RowLayout\n\nRowLayout 根据实例化方式将控件定位在行（水平）或列（垂直）中。它与 FillLayout 不同，因为它不会填充所有可用空间，并且提供了一个名为\
  \ RowData 的布局数据类来单独配置每个控件。可以指定它们在复合控件中定位时的高度和宽度。\n\n以下公共字段可用：\n- center：指定控件是否应居中\n\
  - fill：指定水平布局中行中的所有控件是否应具有相同的高度，或垂直布局中是否应具有相同的宽度\n- justify：指定是否应将任何剩余空间分配给控件之间\n\
  - marginBottom：指定布局底部边缘的像素数\n- marginHeight：指定布局顶部和底部边缘的像素数\n- marginLeft：指定布局左侧边缘的像素数\n\
  - marginRight：指定布局右侧边缘的像素数\n- marginTop：指定布局顶部边缘的像素数\n- marginWidth：指定布局左右边缘的像素数\n\
  - `pack`：指定所有控件是否可以采用其首选大小\n- `spacing`：指定单元格边缘之间的像素数\n- `type`：指定布局是否使用行或列\n- `wrap`：指定如果没有可用空间，控件是否应换行到下一行\n\
  \nRowLayout 可用于在列和行中定位控件。尽管其名称如此，如果程序员将字段设置为 SWT.VERTICAL，布局方向将遵循此模式。\n\n在以下示例中，我们展示如何使用\
  \ RowLayout 和 RowData 定位几个按钮。在以下示例中，请注意，在后两个按钮中，我们使用 RowData 类通过定义高度和宽度来指定按钮的大小：\n\
  \n```\nDisplay display = new Display();\nShell shell = new Shell(display);\nRowLayout\
  \ layout = new RowLayout(SWT.HORIZONTAL);\nlayout.wrap = true;\nlayout.fill = false;\n\
  layout.justify = true;\nshell.setLayout(layout);\nButton b = new Button(shell, SWT.PUSH);\n\
  b.setText(\"Button 1\");\nb = new Button(shell, SWT.PUSH);\nb.setText(\"Button 2\"\
  );\nRowData data = new RowData();\nb.setLayoutData(data);\nb = new Button(shell,\
  \ SWT.PUSH);\nb.setText(\"150 vertical\");\ndata = new RowData();\ndata.height =\
  \ 150;\nb.setLayoutData(data);\nb = new Button(shell, SWT.PUSH);\nb.setText(\"150\
  \ horizontal\");\ndata = new RowData();\ndata.width = 150;\nb.setLayoutData(data);\n\
  shell.pack();\nshell.open();\nwhile (!shell.isDisposed()) {\n    if (!display.readAndDispatch())\n\
  \        display.sleep();\n}\ndisplay.dispose();\n```\n\n样本应用程序的输出显示如下：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_118_0.png)\n\
  \n### GridLayout\n\nGridLayout 是处理布局的绝佳选择。它有多个配置字段，并且可以通过将每个控件与 GridData 类提供的布局数据对象关联来组织复合控件的控件。\n\
  \n在 GridLayout 中，需要指定网格的列数。小部件按创建顺序分配给列，从左到右移动。当没有更多列可用时，下一个控件将放置在下一行。它提供了很大的灵活性，因为每个控件也可以水平和垂直跨越单元格。\n\
  \nGridLayout 可用的以下公共字段：\n- horizontalSpacing：指定单元格水平边缘之间的像素数\n- makeColumnsEqualWidth：指定所有列是否需要具有相同的宽度\n\
  - marginBottom：指定单元格底部边缘垂直边距中的像素数\n- marginHeight：指定单元格底部和顶部边缘垂直边距中的像素数\n- marginLeft：指定单元格左侧边缘水平边距中的像素数\n\
  - marginRight：指定单元格右侧边缘水平边距中的像素数\n- marginTop：指定单元格顶部边缘垂直边距中的像素数\n- `marginWidth`：指定单元格左右边缘水平边距中的像素数\n\
  - `numColumns`：指定 `Layout` 小部件中单元格列数\n- `verticalSpacing`：指定单元格垂直边缘之间的像素数\n\n当应用\
  \ `GridLayout` 来定位应用程序的元素时，需要创建 `GridData` 对象以提供有关此定位将如何执行的进一步信息。我们展示 `GridData`\
  \ 类可用的主要公共字段如下：\n- `verticalAlignment`：指定垂直对齐方式\n- `horizontalAlignment`：指定水平对齐方式\n\
  - `widthHint`：指定用作单元格宽度默认值的像素空间量\n- `heightHint`：指定用作单元格高度默认值的像素空间量\n- `horizontalIndent`：指定放置在单元格左侧的像素数\n\
  - `horizontalSpan`：指定单元格将填充的列数\n- `verticalSpan`：指定单元格将填充的行数\n- `grabExcessHorizontalSpace`：如果有可用空间则抓取水平剩余空间\n\
  - `grabExcessVerticalSpace`：如果有可用空间则抓取垂直剩余空间\n\n我们按如下方式展示如何使用 `GridLayout` 和 `GridData`\
  \ 的示例：\n\n```\nDisplay display = new Display ();\nShell shell = new Shell (display);\n\
  GridLayout layout = new GridLayout(4, false);\nshell.setLayout(layout);\nButton\
  \ b = new Button(shell, SWT.PUSH);\nb.setText(\"LEFT, TOP\");\nb.setLayoutData(new\
  \ GridData(SWT.LEFT, SWT.TOP, true, true, 1, 1));\nb = new Button(shell, SWT.PUSH);\n\
  b.setText(\"LEFT, CENTER\");\nb.setLayoutData(new GridData(SWT.LEFT, SWT.CENTER,\
  \ true, true, 1, 1));\nb = new Button(shell, SWT.PUSH);\nb.setText(\"LEFT, BOTTOM\"\
  );\nb.setLayoutData(new GridData(SWT.LEFT, SWT.BOTTOM, true, true, 1, 1));\nb =\
  \ new Button(shell, SWT.PUSH);\n```\n\n```\nb.setText(\"LEFT, FILL\");\n b.setLayoutData(new\
  \ GridData(SWT.LEFT, SWT.FILL, true, true, 1, 1));\n b = new Button(shell, SWT.PUSH);\n\
  \ b.setText(\"FILL, TOP\");\n b.setLayoutData(new GridData(SWT.FILL, SWT.TOP, true,\
  \ true, 1, 1));\n b = new Button(shell, SWT.PUSH);\n b.setText(\"FILL, CENTER\"\
  );\n b.setLayoutData(new GridData(SWT.FILL, SWT.CENTER, true, true, 1, 1));\n b\
  \ = new Button(shell, SWT.PUSH);\n b.setText(\"FILL, BOTTOM\");\n b.setLayoutData(new\
  \ GridData(SWT.FILL, SWT.BOTTOM, true, true, 1, 1));\n b = new Button(shell, SWT.PUSH);\n\
  \ b.setText(\"FILL, FILL\");\n b.setLayoutData(new GridData(SWT.FILL, SWT.FILL,\
  \ true, true, 1, 1));\n shell.open ();\n while (!shell.isDisposed ()) {\n     if\
  \ (!display.readAndDispatch ()) display.sleep ();\n }\n display.dispose ();\n```\n\
  \n在此示例中可以看出 GridLayout 接收两个参数。第一个是列数，第二个是指定列不具有相同的宽度。类似地，GridData 方法接收六个参数：horizontalAlignment、verticalAlignment、grabExcessHorizontalSpace、grabExcessVerticalSpace、horizontalSpan\
  \ 和 verticalSpan，这些在之前已作解释。\n\n以下 GUI 输出由我们的示例生成：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_120_0.png)\n\
  \n## 新功能与亮点\n\n本节中，我们尝试指出 Eclipse Juno 版本 SWT API 的一些新特性。\n\n第一个涉及的 `StyledText`\
