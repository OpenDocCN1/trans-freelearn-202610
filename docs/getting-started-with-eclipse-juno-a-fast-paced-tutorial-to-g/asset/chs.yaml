  \n## 品牌化 Eclipse RCP 应用程序\n\n你可能觉得为 ContactList 应用使用名为 eclipse 的可执行文件很奇怪。缺少图标和启动画面也是问题。让我们修复这些问题。双击\
  \ contactlist.product 文件返回产品配置编辑器。在 Launching 选项卡可找到 Program Launcher 部分，用于个性化启动器。为应用选择合适名称。如需添加启动器图标，将其放入项目文件夹（RCP\
  \ 模板生成 Icons 文件夹），并在 Icon 字段指向它。还可在 Launching 选项卡指定应用和 JVM 的启动参数。注意这些配置特定于平台（Linux、Mac\
  \ OS X、Solaris、Win32）。\n\nSplash 选项卡允许添加启动画面。启动画面让用户知道应用启动期间正在工作。添加启动画面需让应用的某个插件包含\
  \ splash.bmp 位图文件于插件根目录。打开 Plug-in Manifest Editor，切换到 Build 选项卡，确保 Binary Build\
  \ 列表中 splash.bmp 已勾选。文件就位并包含后，在 Splash 选项卡的 Location 部分引用该插件。也可加入进度条或加载信息，类似 Eclipse。\n\
  \nBranding 选项卡允许选择应用窗口图像，用于操作系统工具栏和任务栏。也可在此自定义 About 对话框消息和图像。要显示 About 窗口，需在应用菜单中创建条目。因\
  \ About 窗口尚未移植到命令框架，需在 ApplicationActionBarAdvisor 类中创建条目。以下代码示例展示如何实现 Help 菜单中的\
  \ About Contact List 条目，显示 contactlist.product 文件中指示的消息和图像。导入部分省略。\n\n\n\npublic\
  \ class ApplicationActionBarAdvisor extends ActionBarAdvisor {\n    private IWorkbenchAction\
  \ aboutAction;\n    public ApplicationActionBarAdvisor(IActionBarConfigurer configurer)\n\
  \    {\n        super(configurer);\n    }\n    protected void makeActions(IWorkbenchWindow\
  \ window) {\n        aboutAction = ActionFactory.ABOUT.create(window);\n    }\n\
  \    protected void fillMenuBar(IMenuManager menuBar) {\n        MenuManager helpMenu\
  \ = new MenuManager(\"&Help\", IWorkbenchActionConstants.M_HELP);\n        menuBar.add(helpMenu);\n\
  \        helpMenu.add(aboutAction);\n    }\n}\n\n您还可以在 **Branding** 选项卡中为应用程序添加欢迎页面，类似于启动\
  \ Eclipse 时首次出现的那种。通过点击 **Intro ID** 字段前面的 **New** 按钮，您将看到欢迎页面向导窗口。将当前插件选择为 **Target**，为\
  \ **Intro** 选择一个 ID，然后点击 **Finish**。这将为 `org.eclipse.ui.intro` 和 `org.eclipse.ui.intro.config`\
  \ 扩展点创建实现，以便将欢迎页面添加到您的应用程序中。欢迎页面的内容由放置在插件根目录中名为 `introContent.xml` 的 XML 文件描述。不幸的是，此文件没有专用编辑器，因此您必须手动创建和编辑它。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_239_0.png)\n\n> `introContent.xml` 格式的内容超出了本书的范围，但您可以在\
  \ *Platform Plug-in Developer Guide* 文章中找到大量相关信息，方法是前往 help.eclipse.org 上的 **User\
  \ assistance** **support** | **Welcome**。\n\n最后但并非最不重要，**Licensing** 选项卡允许您为应用程序指定许可证文本和\
  \ URL。\n\n## 摘要\n\n在本章中，我们了解了如何利用 Eclipse 提供的所有基础设施创建客户端应用程序。通过使用 Eclipse RCP 构建一个简单的示例应用程序，我们看到了使用\
  \ SWT 和 JFace 图形元素编码和打包模块化客户端应用程序是多么容易。\n\n## 键盘快捷键\n\nEclipse 包含大量键盘快捷键，熟练掌握后可以大大加快您的编码速度。通过使用它们，您可以避免将手从键盘上移开去使用鼠标。过于频繁地使用鼠标执行操作会损害您的生产力。\n\
  \n显然，想法并不是要记住整个列表以便超高生产力。此列表应作为参考，用于在您意识到必须反复执行耗时任务时，问自己“有没有更快的方法来完成此操作？”的那些时刻。\n\
  \n这不是一个详尽的列表。我们选择了一些最有用的快捷键并按主题组织，以便更易于浏览。\n\n### 文件编辑器快捷键\n\n在本节中，我们将介绍在使用文件编辑器时可能有用的一些快捷键。掌握它们可以简化代码编辑、导航和代码生成等任务。\n\
  \n### 代码编辑快捷键\n\n下表包含一些最常用的与代码编辑相关的快捷键：\n\n| 快捷键 | 用途 |\n|---|---|\n| Ctrl + C |\
  \ 复制 |\n| Ctrl + X | 剪切 |\n| Ctrl + V | 粘贴 |\n| Ctrl + Z | 撤销 |\n| Ctrl + Y | 重做\
  \ |\n| Ctrl + F | 查找/替换 |\n| Ctrl + D | 删除当前行 |\n| Alt + up arrow | 将当前行上移或下移 |\n\
  | Alt + down arrow |  |\n| Ctrl + Shift + Delete | 删除插入点后当前行的内容 |\n| Ctrl + Shift\
  \ + C | 通过添加 \"//\" 对当前选中的行进行注释/取消注释 |\n| Ctrl + Shift + / | 通过添加 /* ... */ 对当前选择进行注释\
  \ |\n| Alt + Shift + J | 为当前选中的元素生成元素注释 |\n| Ctrl + Shift + B | 在当前行添加/移除断点 |\n\
  | Tab | 增加/减少所选行的缩进 |\n| Shift + Tab |  |\n| Ctrl + I | 修正所选行的缩进 |\n| Ctrl + Shift\
  \ + up arrow | 将当前选择扩展到封闭元素（例如，如果选择了方法代码的一部分，则选择整个方法） |\n| Ctrl + Shift + left arrow\
  \ | 将当前选择扩展到下一个/上一个元素 |\n| Ctrl + Shift + right arrow |  |\n\n### 代码生成和代码重构快捷键\n\
  \n正如我们在第 2 章 Java 开发中所看到的，Eclipse 可以为您生成和重构代码。它可以执行诸如创建方法片段、组织类的导入等任务。下表显示了这些任务的一些快捷键：\n\
  \n| 快捷键 | 用途 |\n|---|---|\n| Alt + Shift + R | 重命名当前选中的方法 |\n| Alt + Shift + M |\
  \ 将当前选择提取为方法 |\n| Alt + Shift + O | 组织导入 |\n| Alt + Shift + F | 格式化选择 |\n| Alt +\
  \ Shift + S | 打开源对话框（允许生成 getter/setter、构造函数、to String 方法等） |\n| Ctrl + 1 | 打开快速修复对话框\
  \ |\n\n### 代码导航快捷键\n\n在大型项目中，浏览源代码可能是一项痛苦的任务。庞大且众多的源文件使得难以找到所需内容。掌握以下快捷键可能会很有帮助：\n\
  \n| 快捷键 | 用途 |\n|---|---|\n| *Ctrl + Shift + up arrow* | 移动到源代码的下一个/上一个元素 |\n| *Ctrl\
  \ + Shift + down arrow* | （参数、方法等） |\n| *Ctrl + Shift + P* | 当选择括号时，跳转到匹配的括号 |\n\
  | *Ctrl + L* | 转到行 |\n| *Ctrl + Q* | 返回上次编辑位置 |\n| *Ctrl + .* | 转到下一个/上一个注释（警告、错误等）\
  \ |\n| *Ctrl + ,* |  |\n| *Ctrl + Page Up* | 转到下一个/上一个编辑器窗口 |\n| *Ctrl + Page Down*\
  \ |  |\n| *Ctrl + left-click* | 当选择类名时，打开其源代码（如果在工作区中可用） |\n| *Ctrl + Shift + T*\
  \ | 打开类型 – 允许您按名称搜索工作区的类 |\n| *Ctrl + Shift + R* | 打开资源 – 允许您按名称搜索工作区的资源 |\n\n###\
  \ Java 快捷键\n\n以下 Java 特定快捷键也非常有用：\n\n| 快捷键 | 用途 |\n|---|---|\n| *F2* | 在工具提示框中打开当前选中类的\
  \ JavaDoc |\n| *F3* | 转到当前选中的元素定义（如果选择类则为类定义，如果选择变量则为变量声明） |\n| *F4* | 为当前选中的类打开类型层次结构视图\
  \ |\n| *Ctrl + O* | 打开当前正在编辑的类的outline工具提示框 |\n| *Ctrl + Alt + H* | 为当前正在编辑的方法打开调用层次结构视图\
  \ |\n\n### 文件快捷键\n\n在下表中，您将找到一些与文件相关任务（保存、打开等）的快捷键：\n\n| 快捷键 | 用途 |\n|---|---|\n\
  | Ctrl + S | 保存当前文件 |\n| Ctrl + Shift + S | 保存所有打开的文件 |\n| Ctrl + W | 关闭当前编辑器窗口\
  \ |\n| Ctrl + Shift + W | 关闭所有编辑器窗口 |\n| Ctrl + N | 打开新建文件向导 |\n\n### 运行和调试快捷键\n\
  \n以下快捷键可以使运行和调试项目更快、更轻松：\n\n| 快捷键 | 用途 |\n|---|---|\n| Ctrl + F11 | 运行当前项目 |\n|\
  \ F11 | 调试当前项目 |\n| F5 | 单步进入（调试模式） |\n| F6 | 单步跳过（调试模式） |\n| F7 | 单步返回（调试模式） |\n\
  | F8 | 继续（调试模式） |\n\n### 视图快捷键\n\n某些视图可以使用快捷键打开或显示。只需使用 *Alt + Shift + Q* 快捷键，然后按要打开的视图对应的字母。如果在\
  \ *Alt + Shift + Q* 快捷键后不按任何键，将出现一个包含视图字母的列表。下表包含最常用的视图的字母：\n\n| 视图 | 字母 |\n|---|---|\n\
  | Breakpoints | B |\n| Console | C |\n| Outline | O |\n| Package Explorer | P |\n\
