  \ main 方法。\n\n要在包内创建类，输入名称或点 **Browse** 选择包。包不存在时 Eclipse 会创建。新建包：右键项目，**New** |\
  \ **Package**。右键包再 **New** | **Class**，类将在该包内创建。\n\n## 创建工作集\n\n工作集用于将工作区项目分组。项目多时在\
