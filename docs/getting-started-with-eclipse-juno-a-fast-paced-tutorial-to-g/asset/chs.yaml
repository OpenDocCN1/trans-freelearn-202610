  \ 视图中右键单击 RCP 应用程序项目，导航到 New | Product Configuration。确保使用 Plug-in Development 透视图以看到这些选项。在向导窗口中输入\
  \ contactlist.product 作为产品配置文件名。向导允许使用现有产品或启动配置作为基配置。因我们已在开发环境中启动产品，已有符合基本需求的启动配置。选择\
  \ Use a launch configuration 并选择 ContactsList 配置。单击 Finish 后，产品配置编辑器将打开，如下图所示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_236_0.png)\n\n用上一截图中显示的相同值填充 General\
  \ Information 部分。在 Product Definition 部分，单击 New 按钮创建新产品。单击 Browse 选择 ContactList\
  \ 作为产品的定义插件。保留 Product 作为产品 ID。在 Application 中选择 ContactList.application。单击 Finish。我们未在产品中使用功能，保持\
  \ plug-ins 作为产品配置。\n\n切换到产品配置编辑器的 **Dependencies** 选项卡。列表中已包含若干插件，其中包括 `ContactsList`。此信息来自指向向导的启动配置。可检查列表并在必要时添加/删除插件。保留来自启动配置的那些即可。\n\
  \n这足以生成包含联系人列表应用程序的捆绑包。保存产品配置编辑器，在 **Package Explorer** 窗口中右键单击 `ContactsList` 项目，选择\
  \ **Export**。在 **Export** 向导的 **Plug-in Development** 类别下，选择 **Eclipse product**\
  \ 并单击 **Next**。\n\n在下一页，将刚创建的 `contactlist.product` 配置文件指向 **Configuration** 字段。**Root\
  \ directory** 字段决定包含产品的[content]\n现在已有双击监听器，通过修改 ContactListView 的 createControl\
  \ 方法并添加以下行，将其添加到联系人 TableViewer 小部件：\n\n```\ncontactsViewer.addDoubleClickListener(new\n\
  ContactListDoubleClickListener());\n```\n\n为进一步集成联系人视图窗口和编辑器，需在每次编辑器保存时强制刷新联系人条目，以反映姓名可能变化。ContactsList\
  \ 视图将监听编辑器保存时触发的特定事件。先在 ContactEditor 类添加私有 IViewPart 字段 contactListView 保存联系人视图实例。向\
  \ ContactEditor 的 createPartControl() 方法添加以下行获取实例：\n\n```\ncontactListView = PlatformUI.getWorkbench().\n\
  getActiveWorkbenchWindow().getActivePage().findView(\"ContactsList.ContactsListView\"\
  );\n```\n\n将以下代码添加到 doSave() 方法末尾，通知联系人列表实例编辑器已保存：\n\n```\nif(contactListView !=\
  \ null){\n    if (contactListView instanceof IPropertyChangeListener){\n       \
  \ PropertyChangeEvent changeDirty = new PropertyChangeEvent(this,\n\"isDirty\",\
  \ true, false);\n        ((IPropertyChangeListener)contactListView).\npropertyChange(changeDirty);\n\
  \    }\n}\n```\n\n现在只需让 ContactListView 实现 IPropertyChangeListener 接口并添加 propertyChange()\
  \ 方法，使其在编辑器保存时相应执行。用以下代码实现：\n\n```\n@Override\npublic void propertyChange(PropertyChangeEvent\
  \ event) {\n    refreshEntries();\n}\n```\n\n## 运行应用程序\n\n我们已为此简单应用准备好所有内容。运行它看看效果。你应得到如下窗口：\n\
