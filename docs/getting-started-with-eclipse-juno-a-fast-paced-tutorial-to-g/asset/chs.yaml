  \ 的根目录。实际上，您可以通过单击 **浏览...** 来浏览并选择 Tomcat 根目录。例如，在以下截图中，Tomcat 根目录为 `/usr/local/apache-tomcat-7.0.33`。之后，单击\
  \ **完成**。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_153_0.png)\n\n> 请确保字段 Workbench\
