- "# 6 更多 SWT\n\n如前所述，**Standard Widget Toolkit (SWT)** 是 Eclipse 项目开发的一套工具，用于帮助构建\
  \ **Graphical User Interface (GUI)** 应用程序。\n\n在 *Chapter 5, SWT* 中，我们介绍了 SWT API\
  \ 的一些基本概念。这些知识很重要，以便我们能轻松跟上本章介绍的内容。对于本章的后续部分，我们将深入 SWT 事件，并展示如何处理菜单、工具栏、对话框和表格。\n\
  \n### 事件\n\n在上一章的多个示例中，尽管不是我们试图解释的重点，我们已展示如何处理一些用户事件，例如按钮点击。对于用户执行的每个操作，例如鼠标点击或按下键，操作系统都会生成一个事件。我们可以选择处理对正在开发的应用程序而言相关的部分。要捕获事件，需要向代码添加监听器，这些监听器必须附加到容器中存在的界面元素，例如\
  \ shell、composite 或 widget。\n\n主要过程从操作系统的事件队列开始，该队列处理用户采取的操作（记录和列出）。当 SWT 应用程序运行时，`Display`\
  \ 类使用 `readAndDispatch` 方法监控来自操作系统的消息。它筛选出相关的消息并将其发送到 shell 对象，后者负责将其重定向到关联的 widget。事件信息最终被\
  \ widget 监听器捕获，后者随后调用方法来处理事件。\n\n在本章中，我们将讨论如何处理与 SWT API 相关的事件，并通过一些示例来说明我们的解释。\n\
  \n### 类型化与非类型化事件\n\n处理事件需要使用监听器。在 SWT API 的早期版本中，只有非类型化监听器。这些监听器提供了一种简单的机制来处理事件。只有一个通用的接口称为\
  \ Listener 和一个事件类称为 Event。要添加监听器，需要使用 addListener 方法。\n\n在 Eclipse 社区讨论后，决定在 SWT\
  \ API 中引入更熟悉的模式。这些是类型化监听器，它们以非类型化监听器为基础定义，可以在 org.eclipse.swt.events 包中找到。我们可以在以下代码片段中看到它们之间的区别：\n\
  \n```\n...\nwidget.addListener(SWT.Dispose, new Listener() {\n    public void handleEvent(Event\
  \ event) {\n        // widget was disposed\n    }\n});\n...\n...\nwidget.addDisposeListener(new\
  \ DisposeListener() {\n    public void widgetDisposed(DisposeEvent event) {\n  \
  \      // widget was disposed\n    }\n});\n...\n```\n\n在此示例中，DisposeListener 是一个接口。当监听器中定义了多个方法时，SWT\
  \ API 提供了一个包含这些方法的适配器类。例如，SelectionListener 接口有两个方法 widgetSelected 和 widgetDefaultSelected，它们以\
  \ SelectionEvents 作为参数。因此，SelectionAdapter 类包含这两个方法。\n\n下表显示了类型化事件及其对应的非类型化事件：\n\
  \n| Event | Listener | Method | Untyped event |\n|---|---|---|---|\n| ArmEvent |\
  \ ArmListener | widgetArmed | SWT.Arm |\n| ControlEvent | ControlListener | controlMoved\
  \ | SWT.Move |\n|  | ControlAdapter | controlResized | SWT.Resize |\n| DisposeEvent\
  \ | DisposeListener | widgetDisposed | SWT.Dispose |\n| FocusEvent | FocusListener\
  \ | focusGained | SWT.FocusIn |\n|  | FocusAdapter | focusLost | SWT.FocusOut |\n\
  | HelpEvent | HelpListener | helpRequested | SWT.Help |\n| KeyEvent | KeyListener\
  \ | keyPressed | SWT.KeyPressed |\n|  | KeyAdapter | keyReleased | SWT.KeyReleased\
  \ |\n| MenuEvent | MenuListener | menuHidden | SWT.Hide |\n|  | MenuAdapter | menuShown\
  \ | SWT.Show |\n| ModifyEvent | ModifyListener | modifyText | SWT.Modify |\n| MouseEvent\
  \ | MouseListener | mouseDoubleClick | SWT.MouseDoubleClick |\n|  | MouseAdapter\
  \ | mouseDown | SWT.MouseDown |\n|  |  | mouseUp | SWT.MouseUp |\n| MouseMoveEvent\
  \ | MouseMoveListener | MouseMove | SWT.MouseMove |\n| MouseTrackEvent | MouseTrackListener\
  \ | mouseEnter | SWT.MouseEnter |\n|  | MouseTrackAdapter | mouseExit | SWT.MouseExit\
  \ |\n|  |  | mouseHover | SWT.MouseHover |\n| PaintEvent | PaintListener | paintControl\
  \ | SWT.Paint |\n| SelectionEvent | SelectionListener | widgetDefaultSelected |\
  \ SWT.DefaultSelection |\n|  | SelectionAdapter | widgetSelected | SWT.Selection\
  \ |\n| ShellEvent | ShellListener | shellActivated | SWT.Activate |\n|  | ShellAdapter\
  \ | shellClosed | SWT.Close |\n|  |  | shellDeactivated | SWT.Deactivate |\n|  |\
  \  | shellDeiconified | SWT.Deiconify |\n|  |  | shellIconified | SWT.Iconify |\n\
  | TraverseEvent | TraverseListener | keyTraversed | SWT.Traverse |\n| TreeEvent\
  \ | TreeListener | treeCollapsed | SWT.Collapse |\n|  | TreeAdapter | treeExpanded\
  \ | SWT.Expand |\n| VerifyEvent | VerifyListener | verifyText | SWT.Verify |\n\n\
  前述表格中提到的适配器仅适用于监听器具有多个方法的事件。适配器对象可以使用类似的结构 addXListener 创建：\n\n```\n```\n...\nbutton.addMouseListener(new\
  \ MouseAdapter()\n{\n    public void mouseDoubleClick(MouseEvent e)\n    {\n   \
  \     System.out.println(\"Double click.\");\n    }\n})};\n.....\n```\n```\n\n由于存在多个事件和监听器，很难在解释中全部关注它们。在下面的小节中，我们尝试给出一些最常用事件的使用示例。\n\
  \n## KeyEvent\n\n大多数事件都易于理解和使用。然而，KeyEvent 尤其可能需要更好的解释。KeyEvent 类是在用户按下键时创建的。它有两个子类：TraverseEvent\
  \ 和 VerifyEvent。当用户按下箭头键或 Tab 键以到达不同的控件时，会生成 TraverseEvent，而 VerifyEvent 子类则在用户向控件输入文本时被激活。\n\
  \nThree member fields of the KeyEvent class typically used are as follows:\n\n-\
  \ **character**: 它提供一个表示所按键的 char 值\n- **stateMask**: 它返回一个表示键盘修改状态的整数（可以验证是否按下了某些\
  \ Alt、Ctrl、Shift 或 command 键）\n- **keyCode**: 它提供与输入键相对应的 SWT 公共常量\n\n以下代码片段展示了如何使用\
  \ KeyEvent 类的示例：\n\n```java\npublic class ComboListenerEx {\n    public static void\
  \ main(String[] args) {\n        Display display = new Display();\n        Shell\
  \ s = new Shell(display);\n\n        s.setSize(500,400);\n        s.setText(\"Combo\
  \ KeyListener\");\n        s.setLayout(new RowLayout( ));\n        final Combo c\
  \ = new Combo(s, SWT.DROP_DOWN | SWT.BORDER);\n        c.add(\"Brazil\");\n    \
  \    c.add(\"Argentina\");\n        c.add(\"Spain\");\n\n        c.addKeyListener(new\
  \ KeyListener() {\n            String selectedItem = \"\";\n            public void\
  \ keyPressed(KeyEvent e) {\n                if(c.getText().length() > 0) {\n   \
  \                 return;\n                }\n                String key = Character.toString(e.character);\n\
  \                String[] items = c.getItems();\n                for(int i =0;i<items.length;i++)\
  \ {\n                    if(items[i].toLowerCase().startsWith(key.toLowerCase()))\
  \ {\n                        c.select(i);\n                        selectedItem\
  \ = items[i];\n                        return;\n                    }\n        \
  \        }\n            }\n            public void keyReleased(KeyEvent e) {\n \
  \               if(selectedItem.length() > 0)\n                    c.setText(selectedItem);\n\
  \                selectedItem = \"\";\n            }\n        });\n        s.open();\n\
  \        while(!s.isDisposed()) {\n            if(!display.readAndDispatch())\n\
  \                display.sleep();\n        }\n        display.dispose();\n    }\n\
  }\n```\n\n此示例创建了一个简单的组合框控件。由于它采用 SWT.DROP_DOWN 样式，因此可编辑。这段代码的目标是选择与用户按下的首字母相对应的项。例如，如果按下的字母是\
  \ B 键，则会选择 \"Brazil\" 项。\n\n## MouseEvent\n\nA `MouseEvent` 发生在鼠标按钮被按下时。A `MouseListener`\
  \ 可用于处理三种类型的事件：\n\n- `MouseButtonPressed`: 该事件发生在按钮被按下但未释放时\n- `MouseButtonReleased`:\
  \ 该事件发生在已按下的按钮被释放时\n- `MouseDoubleClick`: 该事件发生在鼠标按钮被双击时。Each of these events have\
  \ a corresponding method in the listener class that is called when an event takes\
  \ place.\n\n以下代码片段展示了一个处理鼠标事件的监听器：\n\n```java\n...\npublic class MouseExample {\n\
  \    public static void main(String[] args) {\n        Display display = new Display();\n\
  \        final Shell s = new Shell(display);\n        s.setSize(500,400);\n    \
  \    s.setText(\"MouseEvent\");\n        s.open();\n\n        s.addMouseListener(new\
  \ MouseListener() {\n            public void mouseDown(MouseEvent e) {\n       \
  \         System.out.println(\"Position:\" + e.x + \" \" +\n                   \
  \ e.y);\n            }\n            public void mouseUp(MouseEvent e) {\n      \
  \          System.out.println(\"Position2:\" + e.x + \" \" +\n                 \
  \   e.y);\n            }\n            public void mouseDoubleClick(MouseEvent e)\
  \ {\n                System.out.println(\"Double click\");\n            }\n    \
  \    });\n        while(!s.isDisposed()){\n            if(!display.readAndDispatch())\n\
  \                display.sleep();\n        }\n        display.dispose();\n    }\n\
  }\n...\n```\n\n在此示例中，`mouseUp` 和 `mouseDown` 方法在鼠标单击发生时被触发。`mouseDoubleClick` 方法在双击发生时在控制台显示一条消息。\n\
  \n## Menus\n\n大多数图形应用程序都会使用某种菜单。其标签通常被称为 File、Edit 或 Exit 等，并且通常放置在应用程序窗口顶部以显示选项列表。在\
  \ SWT 中，`Menu` 和 `MenuItem` 类负责处理与菜单相关的操作。\n\nBasically, we can divide menus into\
  \ three different kinds:\n\n- **Main**: 这些菜单使用 `SWT.BAR` 样式在 shell 标题下方创建\n- **Drop\
  \ down**: 这些菜单也称为子菜单或级联菜单，并使用 `SWT.DROP_DOWN` 样式创建\n- **Pop up**: 这些菜单使用 `SWT.POP_UP`\
  \ 样式创建，并在用户在控件中请求菜单时显示\n\nThe relationship among these three types of menus works\
  \ by having the menu bars and pop-up menus as the root of the hierarchy. Both of\
  \ them are usually composed of drop-down menus.\n\nMenu 充当 `MenuItems` 的容器，并包含可添加\
  \ `MenuItems` 的方法。`MenuItem` 是一个小部件，可以由用户选择或显示另一个菜单。它可以分为以下几类：\n\n- `SWT.PUSH`:\
  \ 在此类别中创建标准菜单项\n- `SWT.CHECK`: 用于复选框按钮\n- `SWT.RADIO`: 用于单选按钮\n- `SWT.SEPARATOR`:\
  \ 用于分隔多个菜单项\n- `SWT.CASCADE`: 用于以级联样式创建子菜单\n\n可以从 `Menu` 对象和 `MenuItem` 对象触发多个事件：\n\
  \n- The `Menu` events are as follows:\n  - `SWT.Hide`: 菜单被隐藏\n  - `SWT.Show`: 菜单被显示\n\
  \  - `SWT.Help`: 菜单帮助\n- The MenuItem events are as follows:\n  - `SWT.Selection`:\
  \ 菜单项被选中\n  - `SWT.Arm`: 菜单项以武装状态绘制\n  - `SWT.Help`: 菜单项帮助\n\n以下代码片段展示了如何使用 Menu\
  \ 对象和 MenuItem 对象的示例。Their implementation is quite straightforward. Notice that\
  \ the MenuItem object is created using the Menu object as basis.\n\n```\n...\nDisplay\
  \ display = new Display();\nShell shell = new Shell(display);\nMenu menuBar = new\
  \ Menu(shell, SWT.BAR);\nshell.setMenuBar(menuBar);\nMenuItem fileItem = new MenuItem(menuBar,\
  \ SWT.CASCADE);\nfileItem.setText(\"File\");\nMenuItem editItem = new MenuItem(menuBar,\
  \ SWT.CASCADE);\neditItem.setText(\"Edit\");\nMenu fileMenu = new Menu(shell, SWT.DROP_DOWN);\n\
  fileItem.setMenu(fileMenu);\nString [] fileStrings = {\"New\", \"Exit\"};\nfor (int\
  \ i=0; i<fileStrings.length; i++) {\n    MenuItem item = new MenuItem(fileMenu,\
  \ SWT.PUSH);\n    item.setText(fileStrings[i]);\n}\nMenu editMenu = new Menu(shell,\
  \ SWT.DROP_DOWN);\nString [] editStrings = {\"Copy\", \"Paste\"};\neditItem.setMenu(editMenu);\n\
  for (int i=0; i<editStrings.length; i++) {\n    MenuItem item = new MenuItem(editMenu,\
  \ SWT.PUSH);\n    item.setText(editStrings[i]);\n}\nshell.pack();\nshell.open();\n\
  while (!shell.isDisposed()) {\n    if (!display.readAndDispatch()) display.sleep();\n\
  }\ndisplay.dispose();\n...\n```\n\n以下屏幕截图显示了相应的图形输出：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_131_0.png)\n\
  \n## Toolbars\n\n工具栏是一排按钮，显示在菜单和工作区域之间。尽管相当常见，但并非所有应用程序都会使用它。工具栏可以有文本标签或图像。通常，当鼠标悬停在按钮上时，会使用提供按钮行为提示的图像以及工具提示帮助文本。\n\
  \n创建工具栏的方式与创建菜单相当相似。`ToolBar` 类被视为单个按钮的容器，这些按钮由 `ToolItem` 对象表示。以下样式可用于 `ToolBar`\
  \ 和 `ToolItem` 对象：\n\n- The `ToolBar` styles are as follows:\n  - `SWT.WRAP`: 换行以适应可见区域\n\
  \  - `SWT.FLAT`: 具有平面样式的工具栏\n  - `SWT.HORIZONTAL`: 水平布局按钮\n  - `SWT.VERTICAL`: 垂直布局按钮\n\
  \  - `SWT.RIGHT`: 将文本放置在项目的右侧\n  - `SWT.SHADOW_OUT`: 工具栏上方的分隔符\n- The `ToolItem`\
  \ styles are as follows:\n  - `SWT.PUSH`: 创建一个推按钮\n  - `SWT.CHECK`: 创建一个复选按钮\n \
  \ - `SWT.RADIO`: 创建一个单选按钮\n  - `SWT.SEPARATOR`: 创建一个分隔符\n  - `SWT.DROP_DOWN`: 创建一个下拉项\n\
  \n\n\n\n-   `ToolItem` 事件如下：\n  -   `SWT.Selection`：工具项已被选中\n\n在下面的代码片段中，我们展示了一个关于创建工具栏以及工具项的非常简单的示例。也可以使用图像代替文本。\n\
  \n```\n...\nDisplay display = new Display();\nShell shell = new Shell(display);\n\
  ToolBar toolBar = new ToolBar(shell, SWT.HORIZONTAL);\n\nToolItem item = new ToolItem(toolBar,\
  \ SWT.DROP_DOWN);\nitem.setText(\"Drop Down Behavior (Combo)\");\ntoolBar.pack();\n\
  shell.pack();\nshell.open();\nwhile (!shell.isDisposed()) {\n    if (!display.readAndDispatch())\
  \ display.sleep();\n}\ndisplay.dispose();\n...\n```\n\n我们可以看到创建了一个 `ToolBar` 项，之后一个具有下拉行为的工具项被插入到其中。在实际应用中，可能有必要为\
  \ `ToolItems` 对象添加监听器，以便处理生成的事件。\n\n## 表格\n\n表格可以被视为由多个单元格组成的二维网格。表格的一个可能用途是存储数据库查询的结果。为了向表格添加数据，有必要使用一个\
  \ `TableItem` 对象。每个 `TableItem` 对象的实例负责表格的一整行。值可以通过 `setText` 和 `setImage` 方法设置，这些方法接受一个整数作为参数来标识应修改的列。\n\
  \n与 TableItem 对象类似，TableColumn 对象接收一个表格作为参数以关联这两个对象。每次关联一个 TableColumn 对象时，对应表格中就会创建一个新列。\n\
  \n以下代码片段展示了如何创建 SWT 表格：\n\n```\n...\n    Display display = new Display();\n    Shell\
  \ shell = new Shell(display);\n\n    shell.setSize(500,400);\n    shell.setText(\"\
  Table Example\");\n    shell.setLayout(new FillLayout( ));\n\n    Table table =\
  \ new Table(shell, SWT.BORDER);\n    TableColumn tc1 = new TableColumn(table, SWT.CENTER);\n\
  \    TableColumn tc2 = new TableColumn(table, SWT.CENTER);\n    TableColumn tc3\
  \ = new TableColumn(table, SWT.CENTER);\n    tc1.setText(\"Name\");\n    tc2.setText(\"\
  Age\");\n    tc3.setText(\"Country\");\n    tc1.setWidth(80);\n    tc2.setWidth(40);\n\
  \    tc3.setWidth(80);\n    table.setHeaderVisible(true);\n    TableItem item1 =\
  \ new TableItem(table,SWT.NONE);\n    item1.setText(new String[] {\"Rodrigo\",\"\
  28\",\"France\"});\n    TableItem item2 = new TableItem(table,SWT.NONE);\n    item2.setText(new\
  \ String[] {\"Vinicius\",\"28\",\"USA\"});\n    TableItem item3 = new TableItem(table,SWT.NONE);\n\
  \    item3.setText(new String[] {\"Rafael\",\"28\",\"Brazil\"});\n    shell.open(\
  \ );\n    while(!shell.isDisposed()){\n        if(!display.readAndDispatch( ))\n\
  \            display.sleep( );\n    }\n    display.dispose();\n...\n```\n\n相应代码的表格\
  \ GUI 如下所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_134_0.png)\n\n尽管可以直接在列上设置属性，但最好使用\
  \ TableLayout 类。TableLayout 提供了 addColumnData 方法，这使得描述表格中每列的外观变得更容易。\n\nJFace 是一个用于处理常见\
  \ UI 编程任务的工具包。JFace 设计为与 SWT 协同工作并且依赖于系统。其最相关的特性是 actions 和 viewers。action 机制允许用户命令独立于其在\
  \ UI 中的确切位置来定义。Viewers 是某些 SWT 组件的基于模型的适配器，简化了以列表、表格或树结构组织的应用程序数据的展示，这在我们的示例中使用。TableLayout\
  \ 是 org.eclipse.jface.viewers 包的一部分。它可以像 SWT 一样导入，其解释在上一章的开头，通过访问以下网站： http://wiki.eclipse.org/JFace\n\
  \n以下代码片段展示了如何使用 TableLayout 对象：\n\n```\n...\nTableLayout layout = new TableLayout();\n\
  layout.addColumnData(new ColumnWeightData(40, 80, true));\nlayout.addColumnData(new\
  \ ColumnWeightData(40, 80, true));\nlayout.addColumnData(new ColumnWeightData(40,\
  \ 80, true));\nTable table = new Table(shell, SWT.SINGLE);\ntable.setLayout(layout);\n\
  TableColumn column1 = new TableColumn(table, SWT.CENTER);\nTableColumn column2 =\
  \ new TableColumn(table, SWT.CENTER);\nTableColumn column3 = new TableColumn(table,\
  \ SWT.CENTER);\nTableItem item = new TableItem(table, SWT.NONE);\nitem.setText(\
  \ new String[] { \"column 1\",\n    \"column 2\",\n    \"column 3\" } );\nitem =\
  \ new TableItem(table, SWT.NONE);\nitem.setText( new String[] { \"a\", \"b\", \"\
  c\" } );\n...\n```\n\n每次创建 addColumnData 时，它都会向表格添加一列。ColumnWeightData 对象以权重、最小宽度以及是否可调整大小作为参数。重要的是要记住，有必要实例化\
  \ TableLayout 对象来处理列特征以及 TableColumns 本身。\n\n## 对话框\n\n对话框是与主应用程序分离的窗口。通常将其置于用户面前，以引起其对需要执行的操作的注意。dialog\
  \ 抽象类为 SWT 中的对话框提供了基础。可以扩展它以创建自定义对话框或使用已有的多个模板，例如确认消息框或文件对话框。\n\n### MessageBox\n\
  \nMessageBox 对话框通常用于向用户显示信息，例如可能的错误，或在需要执行的操作上获取用户的输入。对话框可以显示多个按钮，例如是或否。当用户做出选择时，对应的代码分支将被执行。\n\
  \n使用 MessageBox 对话框时最简单的事情是通过 setMessage 方法设置其消息。尽管如此，还可以指定多种图标样式以及多种类型的按钮。我们按如下方式展示可能的样式组合，然后是可用图标的描述：\n\
  \n样式组合如下：\n-   `SWT.OK`\n-   `SWT.OK | SWT.CANCEL`\n-   `SWT.YES | SWT.NO`\n-  \
  \ `SWT.YES | SWT.NO | SWT.CANCEL`\n-   `SWT.RETRY | SWT.CANCEL`\n-   `SWT.ABORT\
  \ | SWT.RETRY | SWT.IGNORE`\n\n可用对话框图标的描述如下：\n-   `SWT.ERROR_ICON`：用于告知发生错误\n- \
  \  `SWT.ICON_INFORMATION`：用于提供非交互式信息\n-   `SWT.ICON_QUESTION`：用于为给定问题选择答案\n-   `SWT.ICON_WARNING`：用于告知用户可能有害的操作\n\
  -   `SWT.ICON_WORKING`：告知用户工作正在进行中\n\n以下代码片段展示了 MessageBox 对话框的使用：\n\n```\n...\n\
  MessageBox messageBox = new MessageBox(shell, SWT.ICON_QUESTION | SWT.\nYES | SWT.NO);\n\
  messageBox.setMessage(\"Do you really want to quit?\");\nmessageBox.setText(\"Exiting\
  \ Application\");\nint response = messageBox.open( );\nif (response==SWT.YES) {\n\
  \    shell.dispose();\n    System.exit(0);\n}\n...\n```\n\n以下屏幕截图显示了 MessageBox\
  \ 示例的结果：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_136_0.png)\n\n### FileDialog\n\
  \nFileDialog 打开一个带有按钮以及列表框或树视图的对话框，可实现文件系统的导航。程序员只需实例化此类，指定几个参数，而无需进行繁重的编程。\n\n\
  ```\nFileDialog fd = new FileDialog(shell, SWT.OPEN);\nfd.setText(\"Open\");\nfd.setFilterPath(\"\
  /\");\nString[] filterExt = {\"*.txt\"};\nfd.setFilterExtensions(filterExt);\nString\
  \ selected = fd.open( );\nSystem.out.println(selected);\n```\n\n相应的 GUI 对话框在以下屏幕截图中显示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_137_0.png)\n\n### ColorDialog\n\nColorDialog\
  \ 的目的是允许在组件或文本中选择颜色。可以图形化地选择所需颜色，然后将其传递给组件。也可以手动选择 RGB 值。\n\n```\nText text = new\
  \ Text(shell, SWT.CENTER | SWT.BORDER);\ntext.setSize(200,25);\nColorDialog cd =\
  \ new ColorDialog(shell);\ncd.setText(\"ColorDialog\");\ncd.setRGB(new RGB(255,255,255));\n\
  RGB newColor = cd.open( );\ntext.setBackground(new Color(display, newColor));\n\
  ```\n\n相应的组件如下所示。请注意，该组件依赖于操作系统，在不同系统间可能有所不同。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_138_0.png)\n\
  \n\n\n## 字体对话框\n\n字体对话框可用于在图形用户界面中为文本控件选择字体。其用法与前述示例类似。\n\n代码片段及对应的输出如下所示：\n\n```\n\
  ...\nText text = new Text(shell, SWT.CENTER | SWT.BORDER);\nFontDialog fd = new\
  \ FontDialog(shell, SWT.NONE);\nfd.setText(\"Font Selection\");\nfd.setRGB(new RGB(0,0,255));\n\
  FontData defaultFont = new FontData(\"Verdana\",10,SWT.BOLD);\nfd.setFontData(defaultFont);\n\
  FontData newFont = fd.open();\ntext.setFont(new Font(display, newFont));\ntext.setForeground(new\
  \ Color(display, fd.getRGB()));\n...\n```\n\n对应的输出如下：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_139_0.png)\n\
  \n## 打印对话框\n\n打印对话框允许用户选择打印机设备，应用程序可以将输出发送到该设备。要使用它，程序员必须按照前面解释的相同流程进行。我们在此展示一段关于打印对话框使用情况的代码片段：\n\
  \n```\n...\nPrintDialog printDialog = new PrintDialog(shell, SWT.NONE);\nprintDialog.setText(\"\
  Print\");\nPrinterData printerData = printDialog.open();\nPrinter p = new Printer(printerData);\n\
  p.startJob(\"PrintJob\");\np.startPage();\nRectangle trim = p.computeTrim(0, 0,\
  \ 0, 0);\nPoint dpi = p.getDPI();\nint leftMargin = dpi.x + trim.x;\nint topMargin\
  \ = dpi.y / 2 + trim.y;\nGC gc = new GC(p);\nFont font = gc.getFont();\nString printText\
  \ = \"printExample\";\nPoint extent = gc.stringExtent(printText);\ngc.drawString(printText,\
  \ leftMargin, topMargin + font.getFontData()[0].getHeight());\np.endPage();\np.endJob();\n\
  p.dispose();\n...\n```\n\n如果执行此代码，系统配置的打印机对话框将向用户呈现，并且会打印一个简单的句子。在此示例中，设置了边距，并使用指定字体绘制了一串字符。\n\
  \n## 摘要\n\n本章中，您已了解 SWT API 的更高级工具，这些工具专为在 Eclipse 中开发图形界面而设计。您已学习了其中的一些原理，例如工具栏、表格、菜单和对话框。我们还重点介绍了如何处理\
  \ SWT 事件，这些事件可分为类型化事件和非类型化事件。\n\n在下一章中，我们将以 Eclipse 和 Apache Tomcat 为基础，讨论当前最热门的技术之一——Web\
  \ 开发。\n"
- "# 7 使用 Eclipse WTP 进行 Web 开发\n\n本章中，我们将暂时停止使用 Eclipse 开发客户端应用程序。相反，我们将探讨如何使用 Eclipse\
  \ 开发基于 Web 的 Java 应用程序。为了开发此类应用程序，我们将使用 Java servlet 和 **Java 服务器页面 (JSP)**。为了运行和部署我们的示例应用程序，我们将使用\
  \ Apache Tomcat。与以独立方式运行的桌面应用程序不同，Web 应用程序在服务器上运行。因此，本章还详细介绍了如何在服务器上部署 Java servlet\
  \ 和 Java 服务器页面，即 Apache Tomcat。\n\n本章首先简要介绍基于 Java 的 Web 技术的优势。然后，我们介绍 servlet 和\
  \ Java 服务器页面的一些背景知识。我们还简要描述了 Apache Tomcat 在实现这些技术中所扮演的角色。如果您已经熟悉这些主题，只需快速浏览这些章节，然后跳到下一个主题：安装\
  \ Apache Tomcat。您还将学习如何将 Tomcat 集成到 Eclipse IDE 中，以便在部署和运行 Web 应用程序时无需离开开发环境。\n\n\
  本章将涵盖以下内容：\n\n- 基于 Java 的 Web 技术优势简介\n- Servlet\n- Java 服务器页面\n- 安装 Eclipse Web\
  \ 工具\n- 开发和部署您的第一个 servlet\n- 开发和部署您的第一个 Java 服务器页面\n\n## Java Web 应用程序技术优势的简要介绍\n\
  \n多年来，人们探索了多种编写服务器端软件的方法。在早期，通用网关接口（CGI）是开发 Web 内容最广泛使用的技术。然而，CGI 有许多缺点。由于这些缺点，人们提出了几种技术来取代\
  \ CGI。基于 Java 的技术，特别是 servlet 和 Java 服务器页面，很快成为构建基于 Web 应用程序的事实标准。Java 在服务器端的广泛采用可归因于几个因素。首先，Java\
  \ 通常比脚本语言更快。对于长时间运行的应用程序尤其如此，因为如今主流的 Java 虚拟机实现可以执行自适应优化，从而带来显著的性能提升。其次，像 CGI 这样的旧技术要求服务器为每个请求生成单独的进程，而\
  \ servlet 可以以多线程方式执行。最后，Java 字节码是平台中立的，这使得应用程序可以在不同平台之间移植而无需重大更改。\n\n人们提出了许多对 CGI\
  \ 的改进，例如 FastCGI、Apache 的 mod_perl 和 Netscape 的 NSAPI。这些技术解决了阻碍 CGI 更广泛采用的性能问题。然而，所有这些\
  \ CGI 的替代方案都存在相同的问题：HTML 代码直接嵌入到编程语言代码中。因此，使用这些技术编写 Web 应用程序的开发人员需要具备混合技能：编写业务逻辑的编程语言技能以及用于展示的与\
  \ Web 相关的 HTML 技能。这在许多方面都是不可取的。虽然 servlet 也存在同样的问题，但 Java 服务器页面通过使业务逻辑和展示能够得到适当分离来克服了这个问题，正如我们在以下章节的快速概述中所描述的那样。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_142_0.png)\n\n> 您可能想知道什么是 HTTP 以及 HTTP\
  \ 代表什么。HTTP 是一种网络协议，可以看作是客户端和服务器通信的媒介。这两个元素之间的对话通常按以下顺序进行：客户端（浏览器）发送 HTTP 请求，服务器用\
  \ HTTP 响应进行回答。通常，此响应是使用 HTTP 发送的 HTML（超文本标记语言）页面。HTML 告诉客户端如何显示服务器的响应：客户端读取消息，将其渲染为网页并在用户显示器上显示。HTTP\
  \ 代表超文本传输协议。\n\n## 理解 Servlet\n\nServlet 是在 Web 服务器环境中运行的 Java 程序。更具体地说，servlet\
  \ 是符合 servlet API 的 Java 程序。两个包构成了 servlet API 的大部分功能，即 `javax.servlet` 和 `javax.servlet.http`。前者包含最通用的\
  \ servlet API。后者包含处理 HTTP 请求的 API。`javax.servlet.http` 有许多类和接口，其主要目标是实现 HTTP 功能。`javax.servlet.http`\
  \ 包中最重要的类之一是抽象类 `HttpServlet`。Servlet 从此类继承其与 HTTP 相关的 方法。自定义开发的 servlet 重写 `HttpServlet`\
  \ 中定义的一个或多个方法。这些方法接收一个包含底层请求数据的对象作为参数，以及一个用于写入响应的对象。我们将在本章后面详细介绍这些方法和其参数。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_143_0.png)\n\
  \n> 编写与 HTTP 相关的 servlet 是常见的做法。原则上，可以实现针对其他客户端-服务器协议的 servlet。在本章中，我们只会实现基于 HTTP\
  \ 的 servlet。\n\n## 理解 Java 服务器页面\n\n简单来说，Java 服务器页面是一种旨在促进开发包含动态内容的网页的技术。与内容基本保持不变的\
  \ HTML 页面不同，JSP 根据诸如用户先前提供的信息等多种因素更改其内容。JSP 由嵌入标签和 Java 脚本片段的 HTML 或 XML（**可扩展标记语言**）内容组成。与\
  \ servlet 相比，JSP 可以被视为将动态元素嵌入 HTML 的更便捷方法。事实上，在运行时，JSP 会被翻译成 servlet。此外，为了提高性能，servlet\
  \ 容器会缓存编译后的 servlet。\n\n\n\n## 使用 Apache Tomcat 入门\n\nServlet 被部署到 servlet 容器中，而\
  \ servlet 容器是运行并跟踪与 servlet 相关的多个方面的组件。Apache Tomcat（或简称为 Tomcat）就是 servlet 容器的一个例子。简而言之，Tomcat\
  \ 是 Apache 软件基金会（http://tomcat.apache.org）提供的开源 Web 服务器和 Java servlet 容器。Tomcat\
  \ 用 Java 编写，并实现了 Oracle 公司的 Java Servlet 和 JSP 规范。作为主要是一个 servlet 容器，Tomcat 在 servlet\
  \ 的生命周期中发挥着核心作用：它加载类、实例化并初始化 servlet、将 URL 映射到 servlet、强制执行对 servlet 的正确访问权限，并创建（或分配）线程来运行\
  \ servlet。大致来说，Tomcat 对于 servlet 和 JSP 就如同 JVM 对于基于桌面的应用程序——不过请记住，Tomcat 运行在 JVM\
  \ 上。\n\nTomcat 拥有众多的功能、配置和选项。仅了解其中一小部分就能应付（我们在本章中会尽量涵盖），但你应该知道，Tomcat 远不止下载并运行起来这么简单。然而，对这个功能齐全的\
  \ servlet 容器的深入解释超出了本书的范围。如果你正在寻找有关如何快速上手使用 Tomcat 的详细参考，请务必阅读 Tanuj Khare 所著的《Apache\
  \ Tomcat 7 Essentials》。\n\n## 安装 Tomcat\n\n在将 Tomcat 与 Eclipse 集成之前，你需要下载并安装 Tomcat。有多种方法可以让\
  \ Tomcat 运行。在光谱的一端，你可以下载 Tomcat 的源代码并自行构建和测试。另一端，你可以简单地下载其二进制版本。在这里，我们采用了 arguably\
  \ 最简单的方法来安装 Tomcat：下载、配置并运行编译好的二进制文件。在本章中，我们假设你使用的是 Tomcat 的最新发行版。截至本文撰写时，最新版本是\
  \ 7.0。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_144_0.png)\n\n> 也可通过让 Eclipse\
  \ 为你下载来安装 Tomcat。只要你已安装 WTP（如何安装该插件将在后面介绍），在 Eclipse 下创建一个新服务器并将其类型设为 **Apache Tomcat**\
  \ 时，你可以使用服务器定义向导上的 **Download and Install** 按钮来安装 Tomcat。你甚至可以选择要安装服务器容器的文件夹。\n\n\
  你可以在 `http://tomcat.apache.org/download-70.cgi` 下载最新版本的二进制版本。下载后，只需解压 Tomcat 即可安装，这会创建以下目录层次结构：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_145_0.png)\n\n可以说，最重要的目录是 webapps 目录。这是部署目录，需要提供给客户端浏览器的文件、JAR\
  \ 文件、配置文件等都放置在其中。在本章中，我们将提供有关如何在该目录下组织 Web 应用程序的详细信息。\n\n要在 Eclipse 外部设置和运行 Tomcat，你需要配置两个环境变量，即\
  \ `JAVA_HOME` 和 `CATALINA_HOME`。`JAVA_HOME` 环境变量应设置为 JDK 的基本路径。Tomcat 7.0 需要 Java\
  \ SE 6.0 或更高版本。`CATALINA_HOME` 应指向 Tomcat 目录层次结构的基本路径。有关如何在所有操作系统上设置这些环境变量的说明，可在\
  \ `http://tomcat.apache.org/tomcat-7.0-doc/setup.html` 找到。此外，Tomcat 根目录中的文件 `RUNNING.txt`\
  \ 也包含安装说明。\n\n> 值得一提的是，虽然本章中使用 Tomcat，但这里展示的示例并非 Tomcat 专属。因此，你可以在其他 servlet 容器中部署并运行本章中展示的所有示例。\n\
  \n起初我们将在 Eclipse 外部执行 Tomcat，本章后面会解释如何在 Eclipse 内部执行它。在设置了上述环境变量（按照之前提供的 URL 中针对你操作系统的说明）之后，你需要切换到\
  \ Tomcat 的 bin 目录。从那里，如果你是 Windows 用户，只需输入 startup；如果是基于 Unix 的操作系统用户，则输入 startup.sh。如果一切顺利，Tomcat\
  \ 已启动。要验证 Tomcat 是否正在运行，请打开浏览器并输入 http://localhost:8080。你应该会看到 Tomcat 的欢迎页面，如以下屏幕截图所示。关于此\
  \ URL，有几点说明。首先，localhost 是你用来访问本地 Web 服务器的名称。此 URL 部分解析为以下 IP 地址：127.0.0.1。至于 8080\
  \ 部分，这对应于端口号。通常 Web 服务器使用端口 80。Tomcat 则配置为监听端口 8080，以避免与其他 Web 服务器发生可能的冲突。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_146_0.png)\n\
  \n在某些操作系统中，例如 Ubuntu，Tomcat 会自动启动。因此，每当你想停止和启动 Tomcat 时，请使用 bin 目录中的 stop 和 restart\
  \ 脚本。\n\nTomcat 附带一个基于 Web 的管理控制台。该应用程序名为 Manager Webapp，并且会随 Tomcat 一起自动启动。但是，在使用它之前你需要进行一些配置。为了允许登录并使用\
  \ Manager Webapp，你必须先配置位于 conf 目录中的文件 tomcat-users.xml。通过添加以下行来编辑此文件：\n\n```\n<tomcat-users>\n\
  \    <role rolename=\"manager-gui\"/>\n    <user username=\"tomcat\" password=\"\
  tomcat\" roles=\"manager-gui\"/>\n</tomcat-users>\n```\n\n请记住，修改 Tomcat 的配置文件后，更改不会立即生效。要通知\
  \ Tomcat 有所更改，你需要停止服务器然后重新启动它。重新启动 Tomcat 后，访问以下 URL 以访问该应用程序：\n\n```\nhttp://localhost:8080/manager/html\n\
  ```\n\nManager Webapp 的 HTML 界面显示在以下屏幕截图中。如你所见，它列出了所有已部署的 Web 应用程序。Manager 允许你安装、重新加载、卸载和停止\
  \ Web 应用程序。如果你想了解如何使用 Manager Webapp 执行这些操作，请查阅随附的文档。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_147_0.png)\n\
  \n## Eclipse Web Tools 平台\n\n我们将使用 Eclipse 平台的一个扩展来帮助我们编写、部署和运行本章的应用程序。更具体地说，我们将使用\
  \ Eclipse **Web Tools Platform (WTP)**，这是一组插件，包含用于支持 Java Web 应用程序开发和部署的工具。其中包括，你可以从\
  \ Eclipse 内部启动、停止和重启 Web 服务器。因此，在部署 Web 应用程序时，你无需在 Eclipse 和 Tomcat（或你选择的服务器）之间来回切换。要了解所有\
  \ Eclipse WTP 插件及其功能的概览，请访问项目的网站：`http://www.eclipse.org/webtools/`。\n\n你可以从项目网站下载\
  \ Eclipse WTP 的二进制发行版：`http://download.eclipse.org/webtools/downloads/`。不过，这并不是最好的方法。让\
  \ WTP 快速运行的最直接方法是下载预先打包了 WTP 组件的 Eclipse 版本：`www.eclipse.org/downloads` 页面上的 Eclipse\
  \ IDE for Java EE Developers。然而，大多数 Eclipse 版本不附带 Eclipse WTP。截至本文撰写时，只有 Eclipse\
  \ 4.2 提供了附带 WTP 的版本。如果你需要使用 Eclipse 3.8 与 WTP，你将不得不使用本章中解释的方法。\n\n另外，如果你下载的是用于 Java\
  \ 开发的 Eclipse 版本，你可以通过 Eclipse Update Manager 更新 IDE 来安装 Eclipse WTP，这也是一种简单的方法。\n\
  \n要使用 Eclipse Update Manager 安装 Eclipse WTP，请点击 **Help**，然后点击 **Install New Software**。你需要输入软件站点的地址或使用安装窗口顶部\
  \ **Work with** 下拉菜单选择现有站点。请在 **Work with** 字段中输入以下内容：\n\nhttp://download.eclipse.org/releases/juno/\
  \ （如下截图所示）：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_149_0.png)\n\n前面的截图所示为可用更新列表。在浏览可用软件选项时，选择项目\
  \ **Web、XML、Java EE 和 OSGi 企业开发**，如前一截图所示。确保选中属于 **Web、XML、Java EE 和 OSGi 企业开发**\
  \ 项目下的所有条目，但 **PHP 开发工具 (PDT) SDK 功能** 除外。选择所需项目后，单击 **下一步** 进行安装。单击 **下一步** 后会发生以下情况：\n\
  \n- 单击 **下一步** 后，Eclipse 会将您的选择与已安装的软件进行验证。此外，Eclipse 还负责管理所选插件之间的依赖关系。因此，如果所选项目需要其他软件才能运行，则所需软件也会自动下载。这就是使用\
  \ Eclipse 更新管理器更简单的原因之一。\n- 在您同意许可协议（选中 **我接受许可协议条款** 单选按钮）后，Eclipse 开始安装所选扩展。\n\
  - 下载完成后，Eclipse 会提示您重新启动；单击 **是** 重新启动 Eclipse。\n\n如果一切顺利，您将看到以下截图（与首次打开 Eclipse\
  \ 时看到的类似）：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_150_0.png)\n\n## 配置服务器\n\n\
  现在，您已成功安装 Eclipse WTP。然而，在使用 Eclipse 急于开发 Web 应用程序之前，还需要进行一些配置。下一步是设置 Eclipse WTP，通过指定要使用的服务器以及其安装位置（即您解压\
  \ Tomcat 的位置）。让我们先告诉 Eclipse 我们想要使用哪个服务器。为此，您需要导航到 首选项 | 服务器 | 运行时环境。您将看到如下截图所示的\
  \ 首选项 窗口。在开发过程中，每当您需要添加或删除服务器时，您都会回到此窗口：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_151_0.png)\n\
  \n接下来，单击对话框右侧的 **添加...** 按钮。包含服务器列表的窗口将弹出。除了 Tomcat，Eclipse WTP 还支持其他多个服务器。如果在列表中找不到所需的服务器，您可以下载额外的服务器适配器（如以下图窗口右上角所示）。要选择\
  \ Tomcat，请展开 `Apache` 文件夹，然后选择您想要的 Tomcat 版本。在本章中，我们将使用 Apache Tomcat v7.0（如以下截图所示）。选择正确的\
