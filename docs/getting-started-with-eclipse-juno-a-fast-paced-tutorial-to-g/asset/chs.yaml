  \ Explorer 视图菜单，选择 **Select Working Set**，单击 **New** 选择项目类型 **Java**，输入名称并选择项目。创建后选择\
  \ **Selected Working Sets** 并标记工作集，单击 **OK**，Package Explorer 仅显示该工作集项目。\n\n工作集会列在视图菜单中。选择其一则唯一可见。要同时查看多个工作集，选择\
  \ **Select Working Set** 并标记项目。要恢复整个工作区，选择 **Deselect Workspace**。也可将工作集设为 **Package\
  \ Explorer** 顶级元素查看所有工作集及其嵌套项目，导航到 **Top Level Elements** | **Working Sets**。\n\n\
  选择工作集时其他工作集项目仍加载会占用资源。可右键选择 Close Project 关闭无关项目。可使用 Ctrl + A 选择工作集中所有项目。\n\n项目很多但不同时使用全部时，可为每个项目集创建特定工作区。创建新工作区：菜单\
  \ File | Switch Workspace | Other，输入文件夹名称并单击 OK。可在 Copy Settings 部分选择是否复制当前布局和工作集。\n\
  \n## 导入 Java 项目\n\n处理现有项目时可根据源代码获取方式导入 Eclipse。打开导入向导：File | Import。General 类别选项如下：\n\
  \n- Archive file: 项目已存在于工作区且只想导入归档文件中的新资源时选择。向导会列出归档文件资源供选择。单击 Browse 按钮选择导入目标项目，也可选择资源包含的文件夹。完成后单击\
  \ Finish，资源将被解压缩并复制到项目文件夹。\n- Existing Projects into Workspace: 导入新项目时选择。若源文件已压缩为\
  \ .zip、.tar、.jar 或 .tgz，无需解压，标记 Select archive file 并指向归档文件。若已解压，标记 Select root\
  \ directory 并指向项目。向导会列出找到的 Eclipse 项目，选择后单击 Finish。可将项目添加到特定工作集并选择是否复制到工作区文件夹，强烈建议这样做。\n\
  - **File System**: 工作区已有项目且想添加文件系统中现有资源时使用。下一页勾选选择资源，单击 **Browse** 选择项目和导入文件夹。单击\
  \ **Finish** 后资源复制到工作区项目文件夹。\n- **Preferences**: 选择此选项可导入 Eclipse 首选项文件。文件包含代码风格、编译器首选项、已安装\
  \ JRE 列表及 **Problems** 视图配置。可选择要导入的首选项。\n\n## 从版本控制服务器导入项目\n\n版本控制服务器中的项目可直接导入 Eclipse。多种版本控制软件各有优缺点，大多数可通过插件支持。GIT\
  \ 是最常用的之一，将在 *Chapter 4, Managing a Project* 中详细介绍。**CVS** 是默认唯一支持的系统。导入其管理的项目：导入向导中导航到\
  \ **CVS | Projects**，填写服务器信息后单击 **Finish**。\n\n## 介绍 Java 视图\n\n如 *Chapter 1, Introduction*\
