  \n## 前言\n\n第一个版本的 Eclipse 于 2001 年 11 月发布。自那时起，无论在增强功能还是用户数量方面，它都取得了长足的进步。由于经历了许多改进，Eclipse\
  \ 随着时间的推移变得流行并获得了大量赞誉。如今，Eclipse 无疑是用于开发 Java 应用程序的最广泛使用的集成开发环境（IDE）。它免费且开源，并附带用于执行大量与软件开发相关活动的插件。此外，还可以根据个人需求和偏好轻松下载和安装更多插件。另一个优点是，由于\
  \ Eclipse 大部分是用 Java 编写的，因此它是跨平台的。\n\n如果你一直在使用没有 IDE 帮助的 Java，你现在一定已经意识到 Java 有时可能很粗糙且令人不安。大多数时候，编译器（javac）不会显示有用的错误信息。即使是像遗漏分号这样简单的事情，也可能导致它显示冗长的错误信息列表。在\
  \ IDE 内部，这类问题可以在你尝试运行程序之前被发现。IDE 甚至可以在你开始抓头之前就建议解决方案。毫无疑问，使用功能齐全的 IDE 提供了各种好处。例如，IDE\
  \ 提供代码自动完成，它帮助你正确格式化代码，其中一些还附带用于测试、调试以及跟踪你对代码所做的更改的精巧插件。\n\n然而，尽管使用 IDE 有诸多好处，我们还是要坦率地说：学习如何使用这些高端开发工具绝非易事。IDE\
  \ 具有陡峭的学习曲线，这意味着掌握此类工具通常需要时间和精力。更糟糕的是，有时许多开发人员会同时尝试学习一种新的编程语言和一个 IDE。\n\n本书将帮助你克服\
  \ Eclipse 陡峭的学习曲线。阅读本书后，你将能够熟练使用 Eclipse 执行许多开发活动。\n\n## 本书涵盖内容\n\n本书涵盖了 Eclipse\
  \ Juno，即在撰写本文时 IDE 的最新稳定版本（于 2012 年 6 月发布）。本书首先展示如何执行与实现 Java 应用程序相关的最基本活动（如创建和组织\
  \ Java 项目、重构以及设置启动配置），逐步深入到更复杂的主题，如测试、Web 开发、GUI 编程以及扩展 Eclipse 编辑器以满足你的需求。\n\n\
  本书采用实践方法，直接深入使用 Eclipse，而不会让你陷入技术细节的泥潭。以下是本书涵盖的一些主题：\n\n- 有效使用 Eclipse 编写 Java 代码\n\
  - 将 JUnit 4 集成到 Eclipse 中，开发和运行基于 JUnit 的测试方法\n- 使用版本控制系统 Git/EGit 管理你的项目\n- 使用\
  \ SWT 开发 GUI 应用程序\n- 带有示例的高级 GUI 开发\n- 使用 Eclipse WTP 插件开发和部署基于 Web 的 Java 应用程序\n\
  - 通过开发新编辑器、视图以及为 IDE 的现有元素做出贡献来扩展 Eclipse\n\n第 1 章，简介，介绍了如何开始使用 Eclipse。它从如何启动 Eclipse\
  \ 到对 Eclipse Juno 的新功能和值得注意功能的简要概述。\n\n第 2 章，Java 开发，涵盖使用 Eclipse 进行基本的 Java 开发。对于初学者来说，Eclipse\
  \ 可能相当令人望而生畏。主窗口包含许多较小的窗口，其中一些较小的窗口有许多按钮和下拉菜单。本章的全部内容是了解 Eclipse 用于开发 Java 程序的主要功能。我们将逐步介绍从创建\
  \ Java 项目开始的所有步骤，详细说明用于 Java 开发的 Eclipse 视图、Java 代码生成，到构建和运行 Java 项目，这涉及设置启动配置。此外，我们还涵盖了一些重构，以便你能够改进\
  \ Java 代码——当你处理更复杂的项目时，你会发现重构是 Java 开发中非常重要的一方面。\n\n第 3 章，使用 JUnit 进行单元测试和调试，介绍了\
  \ JUnit，即用于在 Java 中实现单元测试的最广泛使用的框架。你将学习如何设置 JUnit，以便它可以与 Eclipse 结合使用。此外，本章还描述了使用\
  \ JUnit 注解创建测试方法。正如你将看到的，注解还可以用来告知 JUnit 何时跳过特定的测试方法以及给定方法是否预期抛出异常。本章以介绍如何使用 Eclipse\
  \ 的调试器来精确定位代码中难以找到的问题作为结尾。\n\n第 4 章，版本控制系统，解释了如何将 Eclipse 与版本控制系统结合使用。当处理复杂的软件项目（或涉及多人的项目）时，你需要使用一个管理并跟踪相关软件项目不同版本的工具。本书涵盖了\
  \ CVS、SVN 和 Git，以及如何通过原生和外部插件在 Eclipse 内部使用它们。阅读本章后，你将能够在 Eclipse 内部使用它们来支持协作开发。\n\
  \n第 5 章，SWT，涵盖使用标准部件工具包（SWT）进行图形用户界面（GUI）开发。本章介绍了最基本的部件，例如按钮、标签和组合框。从某种意义上说，本章为第\
  \ 6 章《更多 SWT》奠定了基础。\n\n第 6 章，更多 SWT，在前一章的基础上构建，展示了如何通过引入高级部件（如工具栏和表格）来创建更具吸引力的 GUI。本章还包含一个完整的示例。\n\
  \n第 7 章，使用 Eclipse WTP 进行 Web 开发，关注使用 Eclipse 开发基本 Web 应用程序。在本章中，我们展示了 Eclipse 如何与一组名为\
  \ Web Tools Platform（WTP）的插件一起使用，以支持基于两种基本 Web 技术——即 servlet 和 JavaServer Pages（JSP）的\
  \ Web 应用程序的开发。\n\n第 8 章，Eclipse 开发，涵盖一个更高级的主题：扩展 Eclipse。你将学习 Eclipse 的架构是如何组织的。此外，通过阅读本章，你将看到如何利用扩展点来创建自己的插件、编辑器，甚至扩展特定的视图。\n\
  \n\n\n第9章《Eclipse Rich Client Platform》展示了如何利用上一章学到的知识，使用 Eclipse Rich Client Platform\
  \ 开发自己的富客户端应用程序。通过创建示例应用程序，您将学习如何添加视图、菜单和面板，以及使它们相互交互。我们还将介绍如何为应用程序品牌化和打包，让您能够使用\
  \ Eclipse 平台构建功能齐全的跨平台应用程序。\n\n附录《Keyboard Shortcuts》包含了书中介绍的所有键盘快捷键，以及其他能够大大提高您\
  \ Eclipse 生产力的实用快捷键。\n\n## 本书所需\n## 本书所需\n\n本书所需的两款软件是 Java 虚拟机（JVM）和 Eclipse。两者都是免费的，可供下载。还需要一些额外的插件和软件，但我们将在全书中详细介绍如何获取和安装它们。下一节详细介绍了如何安装\
  \ Eclipse，并提供了有关如何安装 JVM 版本的信息来源提示。\n\n## 本书适合谁阅读\n## 本书适合谁阅读\n\n尽管 Eclipse 可用作多种语言的\
  \ IDE，但它在 Java 社区中更受欢迎。我们撰写本书时以对充分利用 Eclipse 感兴趣的 Java 程序员为目标。因此，主要重点将是使用 Eclipse\
  \ 进行 Java 开发，本书的主要读者是 Java 程序员。\n\n本书的编写方式使其既适合初学者，也适合中级 Java 程序员。熟悉 Java 的研究生也会从本书中受益。实践中的软件开发人员可能会将本书作为进入\
  \ Eclipse 世界的首次尝试。如果您是一位经验丰富的 Java 开发人员，一直在使用其他 IDE 并想知道 Eclipse 有何优势，本书将为您提供主要\
  \ IDE 功能的实践指导。经验丰富的 Eclipse 用户可能不会从本书中受益，因为本书旨在作为入门介绍。换句话说，本书可以被视为掌握 Eclipse 的第一步；它是一份快节奏的教程，适合那些希望立即上手并开始高效使用\
  \ Eclipse 的人。\n\n如果您不熟悉 Java，那么这本书不适合您。如果您刚刚接触 Java，在进行一次 Java 语法速成课程后，您将能够跟上本书的大部分内容（只要确保手边有一本\
  \ Java 教科书）。总体而言，这里展示的 Java 代码片段对 Java 初学者来说是可理解的。我们尽量让示例中的代码尽可能简单，以便初学者不会被 Java\
  \ 语法相关的技术细节困住。每当出现稍微复杂一点的内容时，我们都会提供概述或引导读者阅读该主题的更深入讨论。\n\n## 惯例\n## 惯例\n\n本书中您会发现多种文本样式，用于区分不同类型的信息。以下是这些样式的一些示例及其含义说明。\n\
  \nCode words in text are shown as follows: \" The option to transform a for loop\
  \ into an indexed for loop is available for expressions.\"\n正文中代码词的显示方式如下：\"可以将\
  \ for 循环转换为索引 for 循环的选项可用于表达式。\"\n\nA block of code is set as follows:\n代码块的设置方式如下：\n\
  \n```\n@Test(timeout=1000)\npublic void testSquareRoot() {\n    while(true);\n}\n\
  ```\n\nWhen we wish to draw your attention to a particular part of a code block,\
  \ the relevant lines or items are set in bold:\n当我们希望引起您对代码块中特定部分的注意时，相关行或项目会以粗体显示：\n\
  \n```\n@Test(timeout=1000)\n**public void testSquareRoot() {**\n    while(true);\n\
  }\n```\n\n**New terms** and **important words** are shown in bold. Words that you\
  \ see on the screen, in menus or dialog boxes for example, appear in the text like\
  \ this: \" We strongly recommend you to download the **Eclipse IDE for Java Developers**.\n\
  **新术语**和**重要词语**以粗体显示。例如，您在屏幕、菜单或对话框中看到的词语，会在正文中这样出现：\"我们强烈建议您下载**Eclipse IDE for\
  \ Java Developers**。\n\n[  Warnings or important notes appear in a box like this.\
  \  ]\n[  警告或重要说明会以这样的方框出现。  ]\n\n[  Tips and tricks appear like this.  ]\n[  技巧和窍门会这样出现。\
