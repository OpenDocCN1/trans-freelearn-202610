  \ 视图\n\n如 *Chapter 1, Introduction* 所述，Eclipse UI 由视图组成。以下介绍 Java 相关视图。\n\n## Package\
  \ Explorer 视图\n\n**Package Explorer** 为默认显示项目内容的视图。按包层次显示类，也显示构建路径。\n\n截图：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_38_0.png)\n\
  \n## Java Editor 视图\n\nJava Editor 用于编辑 Java 源文件，为 Java 透视图主视图，位于屏幕中间。\n\n截图：\n\n\
  ![](img/d7c3f2018603810fae83e1a6fd98749e_38_1.png)\n\nJava Editor 不止文本编辑器，含多项功能，便于新手写代码并提升资深程序员生产力。以下介绍部分功能。\n\
  \n\n\n## 编译错误和警告标注\n\n如你在“构建和运行”部分中将更详细地看到，Eclipse 默认会在每次保存修改后自动构建你的代码。这使得 Eclipse\
  \ 能够获取 Java 编译器的输出并在代码中标记错误和警告，从而更容易发现和纠正它们。警告以下划线黄色显示，错误则为红色。\n\n## 内容辅助\n\n这可能是初学者和经验丰富的\
  \ Java 程序员都最常用的 Java 编辑器功能。它允许你列出给定实例可调用的所有方法以及其文档。该功能默认适用于所有 Java 类以及工作区中的类。要为外部库启用它，你需要为项目配置构建路径。我们将在本章的“管理项目构建路径”部分进一步讨论构建路径。\n\
  \n要查看此功能的工作方式，请打开一个 Java 编辑器，并创建一个新的 String 实例。\n\n```\nString s = new String();\n\
  ```\n\n现在添加对该 String 实例的引用，后跟一个点，然后按 Ctrl + Space 键。你将看到所有 String() 和 Object() 方法的列表。这比在\
  \ Java 文档中搜索类的 API 或死记硬背要实用得多。\n\n以下屏幕截图显示了内容辅助功能的工作情况：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_39_0.png)\n\
  \n此列表可以通过在点之后输入方法名称的开头来过滤。假设你想替换此 String 实例中的某些字符。作为一名初级 Java 程序员，你不确定是否有这样的方法；如果有，你也不确定它接收哪些参数。合理猜测该方法名称可能以\
  \ replace 开头，对吧？那么请继续输入：\n\n```\ns.replace\n```\n\n当你按下 Ctrl 键并同时按空格键时，你将获得所有名称以\
  \ replace 开头的 String() 方法的列表。通过选择其中一个并按 Enter，编辑器会用方法的其余名称及其参数完成代码。它甚至会建议代码中你可能想要用作参数的某些变量，如以下屏幕截图所示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_40_0.png)\n\n内容辅助将适用于项目类路径中的所有类。你可以通过在首选项窗口中取消选中“启用自动激活”，并导航到\
  \ Java | 编辑器 | 内容辅助 来禁用内容辅助的自动激活。\n\n## 代码导航\n\n当你正在处理的项目足够大的时候，在程序包资源管理器中查找类可能会很麻烦。你经常会问自己：“那个类又在哪个包里？”你可以将正在处理的类的源代码留在不同的标签页中打开，但很快你就会打开比想要的更多的标签页。\n\
  \nEclipse 对此有一个简单的解决方案。在工具栏中，选择 **Navigate | Open Type**。现在，只需输入类名，然后单击 **OK**。如果不记得类的全名，可以使用通配符\
  \ ?（匹配一个字符）和 *（匹配任意数量的字符）。你也可以仅使用驼峰命名法的字母大写（例如 `SIOOBE` 代表 `StringIndexOutOfBoundsException`）。**Open\
  \ Type** 对话框的快捷键是 *Ctrl + Shift + T*。还有一个等效功能可用于查找和打开除 Java 类之外的资源，例如 HTML 文件、图像和纯文本文件。**Open\
  \ Resource** 对话框的快捷键是 *Ctrl + Shift + R*。\n\n你也可以按住 *Ctrl* 并在代码中单击对该类的引用来导航到类的源文件。要直接导航到方法的实现或定义，请按住\
  \ *Ctrl* 并单击方法调用。\n\n另一个便于浏览项目源文件的有用功能是 **Package Explorer** 视图中的 **Link With Editor**\
  \ 功能，如以下屏幕截图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_41_0.png)\n\n启用后，Package\
  \ Explorer 中选中的资源将始终是编辑器中打开的那个。将此功能与 Open Type 结合使用，绝对是在 Package Explorer 中查找资源的最简单方法。\n\
  \n## 快速修复\n\n每当代码中有错误或警告标记时，Eclipse 可能会提供一些消除它的建议。要打开包含建议的 **Quick Fix** 菜单，请将插入点放在与错误或警告相关的标记代码上，右键单击它，然后选择\
  \ **Quick Fix**。你也可以使用快捷键 *Ctrl + 1*，将插入点放在标记的代码上。\n\n以下屏幕截图显示了快速修复功能建议你删除未使用的变量，为其创建\
  \ getter 和 setter，或添加 SuppressWarnings 注解：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_42_0.png)\n\
  \n让我们看看 Eclipse 提供的一些最常用的快速修复。你可以利用这些快速修复来加快代码编写。例如，你可以故意在没有 try/catch 块的情况下调用抛出异常的方法，并使用快速修复来生成它，而不是自己编写\
  \ try/catch 块。\n\n- **未处理的异常：** 当调用抛出异常的方法且异常未被捕获或抛出时，Eclipse 会将该调用标记为错误。你可以使用快速修复功能自动将代码用适当的\
  \ try/catch 块包围。只需打开 **Quick Fix** 菜单，然后选择 **Surround with Try/Catch**。它将生成一个 `catch`\
  \ 块，然后调用所抛异常的 `printStackTrace()` 方法。如果方法已在 `try` 块内，你也可以选择 **Add catch clause to\
  \ the surrounding try** 选项。如果异常不应在当前方法中处理，你也可以使用 **Add throws declaration** 快速修复。\n\
  - **对不存在的方法和变量的引用：** Eclipse 可以使用快速修复为代码中引用的不存在的方法创建存根。为了说明此功能的有用性，假设你正在处理一个类的代码，并意识到你需要一个方法，使用两个整数执行特定操作并返回另一个整数值。你可以简单地使用该方法，假装它存在：\n\
  \n```\nint b = 4;\nint c = 5;\nint a = performOperation(b,c);\n```\n\n方法调用将被标记为错误，提示\
  \ `performOperation is undefined`。要为此方法创建存根，请将插入点放在方法名称上，打开 **Quick Fix** 菜单，然后选择\
  \ **create method** `performOperation(int, int)`。将创建一个私有方法，具有正确的参数和返回类型，并在其中包含一个\
  \ TODO 标记，提醒你必须实现该方法。你也可以使用快速修复在其他类中创建方法。使用相同的上一个示例，你可以在不同的类中创建 `performOperation()`\
  \ 方法，例如以下内容：\n\n```\nOperationPerformer op = new OperationPerformer();\nint a =\
  \ op.performOperation(b,c);\n```\n\n说到类，如果你添加对不存在的类构造函数的调用，快速修复也可以创建类。\n\n不存在的变量也可以通过快速修复创建。与方法创建类似，只需引用一个仍不存在的变量，将插入点放在其上，然后打开\
  \ **Quick Fix** 菜单。你可以创建变量作为局部变量、字段或参数。\n- **删除死代码**：未使用的方法、构造函数和私有可见性的字段都会被标记为警告。虽然为未使用的方法和构造函数提供的快速修复是最明显的（删除死代码），但也可以使用快速修复为未使用的私有字段生成\
  \ getter 和 setter。\n\n## 自定义编辑器\n\n与 Eclipse 中的几乎所有内容一样，你可以自定义 Java 编辑器的外观和行为。**Preferences**\
  \ 窗口（**Window** | **Preferences**）中有大量配置，肯定可以让你根据需要定制编辑器。与外观相关的配置大多位于 **General**\
  \ | **Appearance** | **Colors and Fonts** 下，而行为和功能配置大多位于 **General** | **Editors**\
  \ | **Text Editors** 下。由于存在大量不同的类别和配置，**Preferences** 窗口中的过滤文本可能有助于你找到想要的内容。你最有可能想要更改的偏好设置简短列表如下：\n\
  \n- **颜色和字体**：导航到 **General** | **Appearance**。在 **Colors and Fonts** 配置屏幕中，你可以看到选项按类别组织。**Basic**\
  \ 和 **Java** 类别中的选项将影响 Java 编辑器。\n- **启用/禁用拼写检查**：Eclipse 编辑器自带拼写检查器。虽然在某些情况下它可能有用，但在许多其他情况下你可能不会用到它。要禁用或配置它，请导航到\
  \ **General** | **Editors** | **Text Editors** | **Spelling**。\n\n\n\n-   **注解：**\
  \ 你可以通过在 **首选项** 窗口中导航到 **常规 | 编辑器 | 文本编辑器 | 注解** 来编辑注解（警告和错误等）在编辑器中显示的方式。你可以更改颜色、注解在代码中高亮显示的方式（下划线、波浪线、方框等），以及它们是否显示在代码之前的垂直栏中。\n\
  -   **显示行号：** 要在编辑器左侧显示行号，请通过导航到 **常规 | 编辑器 | 文本编辑器** 勾选相应的复选框。在编辑器左侧栏上右键单击会弹出一个对话框，在其中你也可以启用/禁用行号。\n\
  \n## 问题视图\n\n正如我们在 Java 编辑器描述中所看到的，Eclipse 使用类的自动编译输出在整个代码中标记编译器的错误和警告信息。这些信息也列在\
  \ **问题** 视图中。以下截图显示了该视图的外观：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_44_0.png)\n\
  \n默认情况下，它显示当前工作区中所有打开项目中的所有错误和警告。如你所见，每个条目都包含编译器错误/警告信息以及问题所在的位置。双击条目后，将打开 Java\
  \ 编辑器的新标签页（用于包含问题的资源，除非该标签页已存在），并且插入点将被放置在问题的行上。\n\n## 自定义问题视图\n\n**问题** 视图允许大量自定义设置以便于浏览其条目。例如，你可以通过进入\
  \ **视图** 菜单（视图右上角的白色三角形）并选择 **分组依据** 条目来按严重程度和类型对它们进行分组。\n\n当工作区中打开的项目太多时，显示所有项目的所有错误和警告可能不是一个好主意。幸运的是，你可以自定义\
  \ **问题** 视图将显示的内容。为此，请在视图菜单中打开 **配置内容** 窗口。\n\n窗口左侧有一个问题配置列表。你可以选择显示与全部或任意配置匹配的项目。可以通过单击\
  \ **新建** 按钮添加新配置。四个默认配置不能被删除或重命名，但可以像你创建的那些一样进行编辑。\n\n你可以修改配置将在其中搜索问题的范围以及配置包含的问题类型（其中一些类型可能不涉及\
  \ Java 代码）。你还可以筛选包含或不包含某些文本的问题。\n\n**问题** 视图的另一个有助于组织问题列表的功能是创建其他视图。要创建另一个视图，请打开视图菜单并选择\
  \ **新建问题** 视图。每个视图都有自己的配置，因此你可以创建多个视图并让每个视图显示一种类型的问题。\n\n## 大纲视图\n\n**大纲** 视图提供所选类的概述。默认情况下，它显示类的字段和方法列表。你可以配置视图以隐藏静态元素、字段、非公共成员和本地类型。\n\
  \n以下截图显示了 Book 类的大纲：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_45_0.png)\n\n##\
  \ 类型层次结构视图\n\n**类型层次结构** 视图用于可视化类的超类和扩展。要在此视图中加载类的类型层次结构，请在 Java 编辑器中选择类名的引用，右键单击它并选择\
  \ **打开类型层次结构**；或者，你可以使用 *F4* 键盘快捷键。当你有一个接口并想列出其所有实现时，此工具会很有用。\n\n以下截图包含 **类型层次结构**\
  \ 视图，显示 `java.awt.Button` 类的超类型层次结构：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_46_0.png)\n\
  \n**类型层次结构** 视图的替代方案名为 **快速类型层次结构**。它不会加载并显示 **类型层次结构** 视图，而是在弹出窗口中显示类的层次结构。**快速类型层次结构**\
  \ 的键盘快捷键是 *Ctrl + T*。\n\n## 调用层次结构视图\n\n要查看项目中对特定方法所做的所有调用，请在 Java 编辑器中选择方法名的引用，右键单击它并选择\
  \ **打开调用层次结构**；或者使用 *Ctrl + Alt + H* 键盘快捷键。该视图提供了所选方法调用的完整递归层次结构，如以下截图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_47_0.png)\n\
  \n## 组织导入\n\nEclipse 使管理类的导入变得容易。通过在 Java 编辑器上右键单击并导航到 **源代码 | 组织导入**，所有在代码中没有引用的未使用导入和导入类将被删除。你也可以使用\
  \ *Ctrl + Shift + O* 快捷键来组织导入。\n\n为了说明此功能的有用性，假设你想在代码中添加一个 `ArrayList` 实例。与其导入 `ArrayList`\
  \ 并使用它（你可能知道也可能不知道 `ArrayList` 的包名），你可以简单地写：\n\n```\nArrayList a;\n```\n\n或者，你也可以按\
  \ *Ctrl + Shift + O* 来添加导入。\n\n如果类名在当前类路径中的多个包中出现，你将被提示选择你要引用的那个包。\n\n## 保存操作\n\n\
  你可以定义每次保存 Java 源文件时要执行的操作。为此，在工具栏中导航到 **窗口 | 首选项**；然后在左侧菜单中导航到 **Java | 编辑器**，并选择\
  \ **保存操作**。勾选 **在保存时执行所选操作** 复选框，并选择你想要执行的操作。可以自动组织导入以删除未使用的导入、添加缺失的注解、格式化源代码并强化代码风格。\n\
  \n你也可以为每个项目定义特定的保存操作，方法是右键单击包资源管理器中项目的条目并单击 **属性**。然后在新窗口中导航到 **Java 编辑器 | 保存操作**，并勾选\
  \ **启用项目特定设置**。\n\n## 使用格式化程序强制执行编码风格\n\n一些公司和开源项目对编码风格要求非常严格。它们对何时跳行、何处放置空白、缩进应如何显示等有明确的指导。所有这些指导都可以在\
  \ Eclipse 的 Formatter 工具中实现，该工具帮助开发人员在无忧的情况下设置代码样式。格式化程序将修改你的代码以符合一组编码风格规则。要运行格式化程序，请在工具栏中导航到\
  \ 源代码 | 格式化 或使用 Ctrl + Shift + F 快捷键。你也可以使用保存操作强制 Eclipse 在文件保存后运行格式化程序。\n\n要编辑工作区的格式化设置，请转到首选项窗口（窗口\
  \ | 首选项），并在左侧菜单中导航到 Java | 代码风格 | 格式化程序。格式化程序的设置保存在配置文件下，可以保存、导入和导出。编辑按钮会打开大量设置，可满足大多数代码样式需求。\n\
  \n你也可以定义项目特定的格式规则。在项目属性窗口中（在包资源管理器中右键单击项目并选择属性），在左侧菜单中导航到 Java 代码风格 | 格式化程序，并勾选启用项目特定设置。\n\
  \n## 生成代码\n\n在 Java 中，你最终会发现自己一遍又一遍地编写相似的代码片段。尽管良好的设计原则使用倾向于最小化这种情况，但某些方法，例如 getters、setters\
  \ 和 constructors，在大多数情况下看起来完全相同。Eclipse 可以通过为这些简单方法生成代码来帮助你。\n\n你可以通过在 Java 编辑器中的任何位置右键单击并选择\
  \ 源代码 条目来查看 Eclipse 可以生成的所有代码。此菜单也可以使用 Alt + Shift + S 快捷键打开。\n\n## 生成 getters 和\
  \ setters\n\nGetters 和 setters 通常相同。它们通过返回其值或分配新值来提供对类的某些私有字段的访问。为了避免这种显而易见的任务并节省时间来编写真正的代码，请从\
  \ 源代码 条目中选择 生成 Getters 和 Setters。你将看到一个窗口，如以下截图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_49_0.png)\n\
  \n在 **生成 Getter 和 Setter** 窗口中，你可以确定要为哪些字段生成 getter 和 setter，以及选择它们的访问修饰符和在代码中插入的位置。\n\
  \n## 生成构造器\n\n与 getter 和 setter 一样，类构造器也有一个非常典型的模板，它接收要分配给类字段的值并调用超类的构造器。你也可以通过在\
  \ **源** 菜单项中点击 **使用字段生成构造器** 来跳过这个繁琐的任务。你会看到一个与 **生成 Getter 和 Setter** 类似的窗口，在其中会被提示选择哪些字段的值将由构造器初始化，以及构造器将在代码中的何处插入等。\n\
  \n## 生成 hashCode() 和 equals() 方法\n\n在某些情况下，你需要重写从 Object 类继承的 equals() 和 hashCode()\
  \ 方法，以便当它们具有相同的参数值时，将两个不同的实例视为相等。\n\nEclipse 也为这两个方法提供了模板。通过在 源 菜单项中选择 Generate\
  \ hashCode() and equals()，你将能够生成利用你选择的字段来比较两个实例并生成实例哈希码的方法。equals() 方法的模板将检查另一个对象是否为空，是否属于同一类的实例，以及所选参数是否相等。\n\
  \n## 生成 toString() 方法\n\n要生成一个 toString() 方法以以人类可读的形式返回类字段的值，请选择 Generate toString()\
  \ 选项。与之前的生成器一样，此生成器也允许你选择希望 toString() 方法包含哪些字段。\n\n## 生成方法注释\n\nEclipse 中可以轻松生成\
  \ Javadoc 格式的方法注释。为此，右键单击所需的方法，并导航到 Source | Generate Element Comment，或使用快捷键 Alt\
  \ + Shift + J，同时将光标定位在方法的签名行。这些注释将在用户将鼠标悬停在方法调用上时或使用内容辅助功能时在 Eclipse 中显示。\n\n生成的注释包含方法参数和返回类型。你只需要添加对方法用法的简单描述，并在需要时对参数进行一些说明。以下截图中展示了生成的注释示例：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_50_0.png)\n\n> 这些快捷键看起来可能没用且难以记忆，但一旦你习惯了它们，它们就会变得非常方便，并且会显著提高你的编码速度，因为当你熟记最常用的快捷键时，你很少需要把手从键盘上移开。附录、键盘快捷键\
  \ 包含本书中介绍的所有快捷键的详尽列表。\n\n```java\n/**\n * @param isbn\n * @param author\n * @param\
  \ name\n * @param editor\n */\npublic Book(String isbn, Author author, String name,\
  \ Editor editor) {\n    super();\n    this.isbn = isbn;\n    this.author = author;\n\
  \    this.name = name;\n    this.editor = editor;\n}\n```\n\n## 编辑代码和注释模板\n\n尽管这些模板在大多数情况下都能正常工作，但你的项目可能有一些特殊之处，需要特定类型的构造器。你仍然可以通过编辑模板并根据需要对其进行定制来利用代码和注释生成。为此，右键单击\
  \ Package Explorer 中项目的条目并选择 **属性**。在左侧菜单中展开 **Java 代码风格** 条目并选择 **代码模板**。以下窗口将打开：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_51_0.png)\n\n通过选择一种生成的代码或注释类型并点击 **编辑**，你将能够向模板添加代码和变量。你还可以选择自动为新生成的方法和类型添加注释。\n\
  \n在此窗口中编辑的代码模板设置是项目特定的。设置保存在项目文件夹内的元数据文件中，因此当项目被导入时，编码风格设置会自动设置。这使你能够在项目的所有开发人员之间强制执行项目的编码风格。如果你想为整个工作区编辑默认代码模板，请打开\
  \ **首选项** 窗口并导航到 **Java | 代码风格 | 代码模板**。不包含模板特定设置的项目将使用这些设置。\n\n## 重构\n\n代码重构可能是一件很痛苦的事。随着项目的增长，为方法添加参数或重命名它可能会变成一场噩梦。Eclipse\
  \ 有一些重构工具，使此类任务变得轻松自如。\n\n### 重命名变量\n\n手动重命名变量可能很繁琐且耗时。你可以求助于查找/替换来使其不那么痛苦。但由于变量名可能在代码的其他地方匹配，你必须逐一检查变量名的每个匹配项并验证是否需要修改它（尝试在一个足够大的类中重命名名为\
  \ x 的变量，你就会明白）。如果变量是公共的，你还必须扫描整个项目中该变量的引用。\n\n幸运的是，Eclipse 会为你完成此操作。只需右键单击代码中变量的任何出现位置并导航到\
  \ **重构 | 重命名**。输入新变量的名称并按 *回车*。\n\n你可以看到，即使变量名在代码的其他部分出现，也只有变量名内的文本被修改。Eclipse 能够做到这一点是因为它编译代码并使用此过程中的信息来知道代码中哪些是变量的引用。由于它依赖于编译后的代码，因此无法在存在编译错误的类中重命名变量。Eclipse\
  \ 也不会允许你将变量名更改为同一上下文中已存在的名称。重命名也适用于其他元素，例如类、方法和接口。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_53_0.png)\n\
  \n> 不要让 Eclipse 的功能让你变软！仅仅因为重命名变量变得超级容易，你就不应该随意忽视良好的编码实践，例如变量封装。好的代码就是好的代码，无论使用什么\
  \ IDE。\n\n### 修改方法签名\n\n修改方法签名与重命名变量一样会带来类似的不便。Eclipse 也能在该任务中提供帮助。右键单击方法名并导航到 **重构\
  \ | 更改方法签名**。你将看到一个窗口，允许你更改方法的访问修饰符、返回类型、方法名，并添加/删除参数。\n\n在修改方法签名时，对该方法的调用也会被修改。当你在签名中添加新参数时，可以选择一个默认值，该值将被添加到调用中。\n\
  \n## 构建和运行项目\n\n默认情况下，Eclipse 会在每次保存修改后自动构建项目的代码。它使用一个定制的内部编译器，具有一些有趣的功能，例如即使类包含错误也能执行类以及增量编译（允许仅编译项目的一部分）。修改重新编译后，它可以即时突出显示代码中的问题。你可以在\
  \ **问题** 视图中看到这些错误的列表。如果视图当前在工作区中不可见，可以通过导航到 **Window | Show View | Problems** 来打开它。\n\
  \n然而，如果你正在处理一个太大的项目，或者你使用的是资源较低的机器，自动构建可能会减慢速度。要禁用它，请点击 **项目** 并取消选中 **自动构建** 选项。一旦这样做，项目将只在你导航到\
  \ **Project | Build Project** 或 **Project | Build All** 时才会被构建。\n\n要运行你的项目，请在 **Package\
  \ Explorer** 视图中选择它，然后点击工具栏中的绿色播放按钮，或从 **运行** 选项卡中选择 **运行**。这将无需任何进一步配置即可启动你的项目。如果你的项目包含一个带有\
  \ `public static void main(String[] args)` 方法的类，它将被执行。如果有多个类包含它，你将能够选择要运行的类。你可以在\
  \ **控制台** 选项卡中看到你的程序的输出（如果有的话）。\n\n\n\n\n## 创建启动配置\n\n如果你的项目需要自定义，例如运行时的参数或特定的类路径配置来运行，你可以创建一个启动配置来满足这些需求。为此，导航到\
  \ 运行 | 运行配置。以下截图显示了启动配置窗口：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_54_0.png)\n\
  \n在 Run Configurations 窗口的左侧，你有一份所有启动配置类别的列表。要为 Java 项目创建新的启动配置，双击 Java Application\
  \ 类别。如果你已经使用运行按钮运行过一次应用程序，则该类别中将有一个默认配置。\n\n通过选择配置，你将看到包含启动配置的选项卡。以下是每个选项卡的简要说明：\n\
  \n- **Main**：在这里你将选择项目和主类。**Main class** 文本字段旁边的 **Search** 按钮允许浏览项目中所有带有 main 方法的类。\n\
  - **Arguments**：此选项卡让你为 main 类本身和 JVM 设置参数。\n- **JRE**：此选项卡让你选择用于运行类的 JRE。\n- **Classpath**：编辑此选项卡以创建具有特定类路径配置的启动配置。修改此选项卡的配置不会修改项目的类路径配置。\n\
  - **Source**：此选项卡让你更改源查找路径。与 **Classpath** 选项卡一样，这些配置不会修改项目本身，仅对该启动配置有效。\n- **Environment**：此选项卡允许你为此运行配置定义环境变量。\n\
  - **Common**：此选项卡包含启动的通用配置。它允许你选择为启动分配控制台并将输出写入文件而不是控制台。**Save as** 部分指的是启动配置文件。\n\
  \n## 管理项目构建路径\n\n构建路径是 Eclipse 用于解析依赖项的 JAR、类和源文件文件夹的列表。你可以通过进入项目的属性并选择 **Java Build\
  \ Path** 来编辑项目的构建路径。配置选项已分为四个选项卡：\n\n- **Source**：此选项卡包含管理项目源文件夹的选项。它允许你创建新的源文件夹并在文件系统中添加对外部源的链接。\n\
  - **Projects**：你可以在此选项卡中管理项目在工作区中对其他项目的依赖。当你向另一个项目添加依赖时，默认情况下你将完全访问其所有类。然而，其中一些类在项目在\
  \ Eclipse 外编译和执行时可能不可见。你可能会得到一个在 Eclipse 内部工作但在外部运行 JAR 文件时不起作用的项目。为了避免这些令人困惑的问题，你可以为外部项目创建访问规则，以防止它们使用其他项目的内部包。为此，展开所需项目，选择\
  \ **Access Rules**，并点击 **Edit**。点击 **Add Access Rule** 并添加 **Rule Pattern**。你可以阻止访问（编译但显示警告）或禁止访问（编译时出现错误）。\n\
  - **Libraries**：在此选项卡中，你可以编辑将添加到项目构建路径的库。你可以从工作区内部或外部添加 JAR 和类文件夹，也可以添加库和变量。你可以从库添加链接到其\
  \ Javadoc。这将允许你拥有带有描述其用法的注释的方法和类，就像它们在你的工作区中一样。要为库添加 Javadoc，展开列表中的条目，选择 **Javadoc\
  \ location**，并点击 **Edit** 按钮。输入 Javadoc 的路径并点击 **OK**。如果你有访问权限，也可以指向库的源代码。\n- **Order\
  \ and Export:** 在这里你将定义项目的哪些源文件夹和库将被导出，以便其他项目可以导入它们。此选项卡还允许你选择库在运行时加载的顺序。顺序将决定在两个不同的库提供同一类时将加载哪个类。要提高或降低库的优先级，选择它并按\
  \ **Up** 和 **Down** 按钮。\n\n## 总结\n\n本章中，我们涵盖了使用 Eclipse 进行 Java 开发的基础知识：创建和导入 Java\
  \ 项目、在工作集中组织项目、添加新类等。我们浏览了 Eclipse 用于 Java 开发的所有视图，了解了它们如何用于浏览代码、查找错误、警告等。特别关注了\
  \ Java 编辑器，涵盖了其最有用的功能。我们还涵盖了一些更高级的主题，例如创建代码生成模板和项目设置，这些可以由团队中的开发人员共享以强制执行代码风格和最佳实践。\n\
  \n在下一章中，你将学习 Eclipse 如何帮助你调试 Java 应用程序以及使用 JUnit 测试它们。\n"
- "# 3 使用 JUnit 进行单元测试和调试\n\n到目前为止，你已经过了基础阶段，应该熟悉使用 Eclipse IDE 开发 Java 应用程序。虽然你一定对最近获得的技能感到非常自信，但在继续之前，你应该知道，代码越多，引入\
  \ bug 的可能性就越高。即使 Eclipse 提供了所有功能，随着 Java 应用程序规模的扩大，事情也注定会出错。因此，当我们的应用程序代码开始变得难以管理时，我们需要建立一个安全网。一种方法是测试我们的程序，而测试正是本章要涵盖的内容之一。\n\
  \n在理想世界中，我们测试检测到的所有问题都很容易追踪和修复。然而，这并不总是如此。事实证明，讨厌的 bug 可能会进入我们的代码。如前所述，拥有良好的测试集有助于我们发现问题，然而，有时测试集提供的反馈不足，我们需要深入挖掘以发现问题。理解软件为何行为不正常并为其制定修复方案的行为称为\
  \ **debugging**。调试将在本章后面介绍。\n\n在测试和调试 Java 程序方面，Eclipse 提供了全方位的支持。它内置了自动化创建和执行 JUnit\
  \ 测试的功能，并提供了一个令人印象深刻的 Java 调试器。\n\n本章将涵盖以下主题：\n\n- 在 Eclipse 中配置 JUnit\n- 使用 Eclipse\
  \ 内部的 JUnit 组织、开发和运行单元测试\n- 在出现 bug 时使用 Eclipse 内置调试器，并理解仅测试方法不足以确定问题原因\n\n## 使用\
  \ JUnit 进行测试 – 入门\n\n在描述 JUnit 之前，我们认为有必要先谈谈单元测试。在进行单元测试活动时，重点放在代码的小块上。换句话说，你并不是试图用一个测试覆盖整个程序。相反，你通过为每个类编写一套测试、每个方法编写一个或多个测试来测试程序的基础。在处理代码时编写测试有很多好处。例如，单元测试时更容易找到\
  \ bug。这是因为每个单元测试都应评估一个功能单元，这使得需要追踪 bug 的范围远小于在整个程序中搜索 bug。然而，根据 Robert C. Martin，要充分利用单元测试的好处，你的测试套件必须遵守以下原则（也称为\
  \ FIRST 首字母缩写）：\n\n- **Fast**：测试应该是完全自动的，并且能够检查自己的结果。但最重要的是，你应该能够快速执行它们，以便可以频繁执行。\n\
  - **Independent**：测试不应相互依赖。你应该能够以任何特定顺序运行测试。\n- **Repeatable**：你应该能够在任何环境（不仅是生产环境）中以所需的频率执行测试。\n\
  - **Self-validating**：测试应产生布尔结果，即它们要么通过要么失败；中间不应有任何状态。实际上，这归结为避免需要手动评估的主观输出。\n-\
  \ **Timely**：根据 Robert C. Martin，单元测试应在代码实现其评估的功能之前编写。据他说，在实现生产代码后编写测试更困难。从学术角度来看，关于在实现代码之前编写测试与之后编写测试的好处之间并没有实质性证据。这显然是一个有争议的话题，我们不寻求影响你偏向特定方法。尝试在实现代码之前和之后编写测试，看看哪种方法最适合你。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_58_0.png)\n\n> 如果你认为在实现代码之前编写测试更适合你，你应该阅读关于测试驱动开发（TDD）的资料。在此期间，你可能还想学习重构，即在不改变其外部行为的情况下改进代码。\n\
  \n\n\n\n现在你已经对支撑单元测试的哲学有了基本了解，你已准备好迈出下一步，开始编写自己的测试——学习如何使用单元测试框架。鉴于 JUnit 可谓 Java\
  \ 社区中最流行的测试框架，我们将在此介绍它。\n\n更具体地说，JUnit 是一个开源测试框架，最初由 Kent Beck 和 Erich Gamma 创建（www.junit.org）。截至本文撰写时，该框架（也是\
  \ IDE 中捆绑的版本）的最新稳定版本是 4.10 版。由于 Erich 主导了 Eclipse Java 开发工具（JDT）的设计，JUnit 已与 IDE\
  \ 很好地集成。Eclipse 已随附捆绑的 JUnit JAR。因此，只要你计划使用 JUnit 4.10，就没有太多关于安装的内容需要说明。然而，也可以使用不同版本的\
  \ JUnit。设置默认和非默认 JUnit JAR 的步骤将在以下章节中介绍。\n\n尽管 JUnit 和 Eclipse 这对组合支持并自动化了大部分测试过程，你仍需手动编写自己的测试文件。由于\
  \ Eclipse 将测试文件的组织方式交由你决定，有必要说明一下如何组织这些文件。\n\n基于 JUnit 的测试文件可以按以下方式组织。假设你的应用程序有一个名为\
  \ MyAppClass 的类，并且你想对其进行测试。为此，你需要将测试放在另一个名为 MyAppClassTest 的类中。通常，测试类与常规代码分开存放。惯例是将它们放在名为\
  \ test 的子包中。于是，假设 MyAppClass 位于名为 org.myapp 的包中，与该类相关的测试需要放在名为 org.myapp.test 的子包中。至于测试本身，它们以\
  \ Java 方法的形式分组在 MyAppClassTest 中，并会进行一些稍后的说明的轻微修改。以下截图展示了这种典型组织的概览，其中使用了一个名为 MyTestProject\
  \ 的假设 Java 项目来说明这种组织方式：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_59_0.png)\n\n\
  > 值得一提的是，JUnit 和 Eclipse 都不会强制执行这种命名约定。为测试创建单独的文件夹/子包也不是强制性的。然而，遵循这些约定是一种良好的编程实践。还值得一提的是，组织测试代码的另一种广泛使用的约定是\
  \ Maven 约定。遵循此约定，你需要为常规 Java 代码和测试代码创建单独的文件夹，`src/main/java` 和 `src/test/java`。此外，测试类应放在与它们所测试的类相同的包中。\n\
  \n## 设置 JUnit\n\n为了在 Eclipse 中使用 JUnit，你需要将 `junit.jar` 添加到项目的构建路径中。为此，右键单击你的项目，并导航到\
  \ **Build Path | Add Libraries...**，如下图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_60_0.png)\n\
  \n以下截图显示了 Eclipse 列出的选项。选择第二个选项 **JUnit**。你可以选择 JUnit 版本 3 或版本 4。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_60_1.png)\n\
  \n在本章中，我们将使用 JUnit 4（更具体地说是 4.10）；因此请继续选择 JUnit 4，如下图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_61_0.png)\n\
  \nJUnit 3 和 JUnit 4 之间存在显著差异，主要是因为 JUnit 4 大量依赖于最新版本 Java 引入的新特性。更具体地说，JUnit 3 和\
  \ JUnit 4 的主要区别在于后者依赖于注解而不是层次结构和方法名约定。如果你熟悉 JUnit 3，但尚未使用过 JUnit 4，你会发现后者比前者更简单、更易于使用。\n\
  \n通过选择 JUnit 4，Eclipse 会将 JUnit 4.10 添加到你的项目构建路径中。如果你需要使用不同版本的 JUnit，可以从 JUnit 网站下载该特定版本并将其添加到项目的构建路径中。为此，从\
  \ JUnit 网站下载所需版本，右键单击你的项目名称，并导航到 Build Path | Configure Build Path...，如下图所示：\n\n\
  ![](img/d7c3f2018603810fae83e1a6fd98749e_61_1.png)\n\n项目属性窗口将会出现，显示项目的构建路径当前配置（如下图所示）。选择\
  \ Libraries 选项卡，单击 Add External JARs...，找到并选择你最近下载的 JAR，然后单击 OK。再次单击 OK 关闭属性窗口。完成，现在\
  \ JUnit 已运行。我们已准备好创建基于 JUnit 的测试。值得一提的是，通过项目属性窗口，你也可以通过单击 Add Library... 选项来添加 JUnit\
  \ 4。选择此选项会打开前面截图中显示的弹出窗口。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_62_0.png)\n\
  \n将新的 JAR 添加到构建路径可以通过多种方式完成。在本节中我们只介绍了两种。如果你采用了第一种方法，JUnit JAR 文件将被放置在 JUnit 4 下，如下图所示的\
  \ (a) 所示。否则，JAR 文件将出现在 Referenced Libraries 下，如 (b) 所示。继续阅读以发现设置 JUnit 的更简单方法。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_62_1.png)\n\n## 使用 JUnit 进行测试\n\n使用 JUnit，编写可重复的测试非常简单。事实上，从第一天起，易于使用就是\
  \ Kent 和 Erich 做出的一项关键设计决策。据他们说，如果 JUnit 不易于学习和执行，程序员实际上不会使用它。\n\n基本上，当你需要使用 JUnit\
  \ 测试某物时，你执行以下基本操作：\n\n- 1. 创建将包含所有测试的 Java 类。确保按照上一节中描述的约定对其命名。\n- 2. 创建一个方法并用 `@org.junit.Test`\
  \ 为其注解。\n- 3. 在之前创建的方法内部编写与你想要测试的行为相关的代码。\n- 4. 为了检查被测代码是否产生预期结果，静态导入 `org.junit.Assert`，并调用\
  \ Assert 系列中的一个方法（`assertTrue`、`assertEquals` 等）来比较测试结果与预期结果。\n\nJUnit 框架还有其他几个特性，但这些是你入门需要理解的特性。因此，让我们通过测试一个实现基本计算器的\
  \ Java 类来深入了解这些基本特性的技术细节。\n\n首先，我们需要为计算器类创建一个新的 Java 项目。因此，在 Eclipse 中导航到 **File**\
  \ | **New** | **Java Project**。要为项目命名，在 **Project name** 字段中输入 `BasicCalculatorProject`，然后单击\
  \ **Finish**。你可能会被提示切换到 Java Perspective。如果发生这种情况，请回答 **Yes**。完成所有这些步骤后，**Package\
  \ Explorer** 视图应显示你的新 Java 项目。然而，如果出现问题，你可能会遇到困难，请返回上一章并回顾如何创建 Java 项目。\n\n在我们最近创建的\
  \ Java 项目中，创建一个新包。要创建名为 `chapter3.basiccalc` 的包，选择 `src` 文件夹，右键单击它，并导航到 **New**\
  \ | **Package**。输入包名，然后单击 **Finish** 按钮。\n\n让我们创建一个名为 BasicCalculator 的类。右键单击你最近创建的包并导航到\
  \ New | Class。我们要测试的类如下：\n\n```java\npackage chapter3.basiccalc;\n\npublic class\
  \ BasicCalculator {\n    private static int[] tempVars; //acts as an array of temp\
  \ variables\n    private static int result;\n\n    public void add(int n) {\n  \
  \      result += n;\n    }\n\n    public void subtract(int n) {\n        result\
  \ -= n;\n    }\n\n    public void addResultToTempAt(int index) {\n        tempVars[index]\
  \ = result;// BUG: tempVars wasn't initialized properly\n    }\n\n    public void\
  \ squareRoot(int n) {\n        //not implemented yet\n    }\n\n    public void divide(int\
  \ n) {\n        result /= n;\n    }\n\n    public void multiply(int n) {\n     \
  \   result = n * n;\n    }\n\n    public void clear() {\n        result = 0;\n \
  \   }\n\n    public void clearTemps() {\n        for (int i =0; i < tempVars.length;\
  \ i++) {\n            tempVars[i] = 0;\n        }\n    }\n}\n```\n\n```\npublic\
  \ int getResult() {\n    return result;\n}\n}\n```\n\n## 下载示例代码\n\n你可以从你的账户 http://www.PacktPub.com\
  \ 下载所有已购买的 Packt 书籍的示例代码文件。如果你是在其他地方购买本书，可以访问 http://www.PacktPub.com/support 并注册以便直接将文件发送到你的邮箱。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_65_0.png)\n\n我们的计算器实现包含两个错误，但暂时不用担心。使用有缺陷的实现会使我们的示例更有趣。\n\
  \nBasicCalculator 类的目的是执行基本算术运算（加法、减法、乘法和除法）并计算平方根；在每次运算后存储结果。除了 result 变量外，还使用一个数组来存储中间结果；使其可以在后续计算中重复使用。用于重用此数组中存储的值的方法尚未实现。到目前为止，我们的计算器只能存储中间结果（保存在\
  \ tempVars 数组中）并清除其内存（通过将 tempVars 的所有元素赋值为零）。此外，请注意，应该计算平方根的方法也尚未实现。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_65_1.png)\n\
  \n好吧，我们的类应该计算平方根，然而，正如你所见，这一特定功能尚未实现。不要担心，我们出于演示目的没有实现这一特定功能。本章后面我们将向你展示如何让 JUnit\
  \ 跳过测试用例，而该用例要么没有实现，要么当前实现出现问题。\n\n由于我们坚持上一节介绍的命名约定，在测试 BasicCalculator 之前，你应该创建一个名为\
  \ chapter3.basiccalc.test 的包。包含所有测试用例的类应在此包内创建。\n\n现在你已经设置好 Java 项目并处理了测试代码周围的所有脚手架，你可以按照上述说明将\
  \ JUnit 添加到项目构建路径中，也可以继续阅读并发现添加 JUnit 到构建路径的更简单方法（正如我们提到的，在 Eclipse 中执行操作有多种方式）。\n\
  \n## 使用 JUnit 进行单元测试和调试\n\n右键单击 BasicCalculator 并导航到 New | JUnit Test Case。\n以下截图中显示的窗口将会出现：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_66_0.png)\n\n选择 JUnit Test Case 选项后，将弹出一个新窗口，测试用例的名称已自动填入（BasicCalculatorTest）。它还显示了被测试的类（BasicCalculator）。你只需要在\
  \ Package 字段中输入测试包名。因此，继续输入 chapter3.basiccalc.test，就像我们在以下截图中所做的那样（或点击 Browse 按钮并选择所需包）。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_66_1.png)\n\n## 实现 Eclipse 生成的测试方法\n\n\
  请注意我们取消选中 setUp() 和 tearDown() 选项。我们稍后会解释这些术语的含义。但目前，我们不希望 Eclipse 自动为我们生成这些方法。取消选中这些选项（如果默认情况下未取消选中），点击\
  \ Next 并选择你想要测试的方法，如以下截图所示。这里 Eclipse 提示你选择应为其生成存根的方法。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_67_0.png)\n\
  \n当你点击 Finish 时，如果尚未将 JUnit 添加到项目构建路径，Eclipse 将提示你将 JUnit 4 添加到构建路径（如下图所示）。你应通过点击\
  \ OK 来响应。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_67_1.png)\n\n然后 Eclipse 将为你生成以下代码：\n\
  \n```java\npackage chapter3.basiccalc.test;\n\nimport static org.junit.Assert.*;\n\
  import org.junit.Test;\n\npublic class BasicCalculatorTest {\n\n    @Test\n    public\
  \ void testAdd() {\n        fail(\"Not yet implemented\");\n    }\n\n    @Test\n\
  \    public void testSubtract() {\n        fail(\"Not yet implemented\");\n    }\n\
  \n    @Test\n    public void testAddResultToTempAt() {\n        fail(\"Not yet implemented\"\
  );\n    }\n\n    @Test\n    public void testSquareRoot() {\n        fail(\"Not yet\
  \ implemented\");\n    }\n\n    @Test\n    public void testDivide() {\n        fail(\"\
  Not yet implemented\");\n    }\n\n    @Test\n    public void testMultiply() {\n\
  \        fail(\"Not yet implemented\");\n    }\n}\n```\n\n```\n@Test\npublic void\
  \ testClear() {\n    fail(\"Not yet implemented\");\n}\n\n@Test\npublic void testClearTemps()\
  \ {\n    fail(\"Not yet implemented\");\n}\n}\n```\n\n正如你所见，Eclipse 自动生成了大量样板代码。更具体地说，Eclipse\
  \ 为我们被测试类的每个方法生成了所有测试方法（每个方法一个），并用 org.junit.Test（@Test）对其进行注释，并静态导入了断言方法。\n\n@Test\
  \ 注解用于指示 JUnit 将带注解的方法作为测试用例运行。在运行每个测试用例之前，JUnit 会创建该类的一个实例，然后在该实例上调用测试用例方法。本章后面我们将看到\
  \ JUnit 如何允许程序员利用这一特性，在需要对象创建后才能执行的测试方法之前初始化测试方法的上下文。\n\n如果测试抛出异常，JUnit 会将其报告为失败。正如你可能已经猜到的，Eclipse\
  \ 生成的所有测试方法存根都是失败的测试方法。事实上，我们的测试方法失败是因为它们调用了 org.junit.Assert 中的 fail() 方法，该方法通过抛出\
  \ AssertionError 来表示测试方法的失败。\n\n为了执行基于 JUnit 的测试类，右键单击它并导航到 Run As | JUnit Test，如以下截图所示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_69_0.png)\n\n按照刚才所示的方法，尝试运行 `BasicCalculatorTest`。测试结果在以下截图中显示在\
  \ **JUnit Runner** 视图中。每当你运行基于 JUnit 的类时，此视图会显示在当前透视图中。此视图会显示失败列表和测试套件的树结构。失败的测试用红色条指示。（如下图所示，我们有八个失败的测试）。下一节将提供有关此窗口每个工具栏的更多信息。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_70_0.png)\n\n到目前为止，你应该已经习惯于在 Eclipse\
  \ 中可以用不同方式执行相同的操作。运行测试用例也不例外。以下是你可以运行测试用例的一些方法：\n\n- 假设你想运行单个测试方法。从 Outline 或 Package\
  \ Explorer 中右键单击该测试方法，并导航到 **Run As | JUnit Test**\n- 要重新运行单个测试，请在 **JUnit Runner**\
  \ 视图中选择一个测试，右键单击它并选择 **Run**\n- 要运行项目或包中的所有测试，请选择该包，右键单击它并导航到 **Run As | JUnit Test**\n\
  \n为了查看通过的测试是什么样子的，请按以下代码片段注释 testAdd() 方法的主体，并使用上面描述的方法仅运行 testAdd()：\n\n```\n@Test\n\
  public void testAdd() {\n    //fail(\"Not yet implemented\");\n}\n```\n\n你应该会看到绿色条；如下图所示。更具体地说，它显示\
  \ testAdd() 是一个通过的测试方法，而其他测试方法未被执行。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_71_0.png)\n\
  \n在实现真正评估计算器行为的测试之前，值得更仔细地查看 JUnit Runner 视图，因为你将在本章中 throughout 与其交互。\n\n## Eclipse\
  \ JUnit Runner 视图概述\n\n执行基于 JUnit 的类后，将显示 JUnit Runner 视图。除了指示最近运行的测试是否成功或失败之外，此视图还显示失败的测试为何失败以及一些有用的工具栏命令。JUnit\
  \ Runner 视图有两个窗格，测试窗格和失败跟踪窗格。测试窗格以树形列出所有已执行的测试。选择失败的测试后，失败跟踪窗格会显示所选测试失败的原因。以下表格介绍了测试窗格中每个工具栏命令的描述：\n\
  \n| 图标 | 描述 |\n|------|-------------|\n| ↓ | 将选择移动到下一个失败的测试 |\n| ↓ | 将选择移动到上一个失败的测试\
  \ |\n\n\n\n\n| 图标 | 描述 |\n|------|-------------|\n|  | 仅显示失败的测试（如有） |\n|  | 保持测试列表不滚动\
  \ |\n|  | 重新运行所有测试 |\n|  | 仅重新运行所有失败的测试 |\n|  | 停止当前执行 |\n|  | 显示测试运行历史 |\n\n下表描述了\
  \ **Failure Trace** 面板中可用的选项。要从某个失败导航到相关的源代码，请在 **Failure Trace** 面板中双击相应的行。\n\n\
  | 图标 | 描述 |\n|------|-------------|\n|  | 通过移除不需要的堆栈帧来过滤堆栈跟踪 |\n|  | 比较字符串比较的实际结果和预期结果\
  \ |\n\n## 创建测试用例\n\n到目前为止，我们几乎没有输入什么内容；Eclipse 已经为我们完成了所有工作。然而，现在轮到我们进行一些输入了。为了实现我们的测试用例，我们将逐步进行。首先，我们需要注释掉尚未实现的测试用例。事实证明，JUnit\
  \ 提供了一种更好的方法来禁用未完成的测试方法，即通过使用 `@Ignore` 对其进行注解。用 `@Test` 和 `@Ignore` 注解的方法根本不会被\
  \ JUnit 执行。JUnit 将它们视为已注释掉一样。当使用 `@Ignore` 注解方法时，您还可以提供一个字符串来解释为什么底层测试方法被忽略。\n\n\
  要使用 `@Ignore`，您必须导入 `org.junit.Ignore`。导入后，`@Ignore` 可用于注解方法，如以下代码所示。在以下代码中，我们告诉\
  \ JUnit 忽略 `testSubtract`，因为它尚未正确实现。请继续将除 `testAdd()` 之外的所有方法都标记为 `@Ignore`。现在执行我们的测试套件将不会出现任何失败。\n\
  \n```java\n@Ignore(\"Not implemented yet\")\n@Test\npublic void testSubtract() {\n\
  \    fail(\"Not yet implemented\");\n}\n```\n\n现在其他测试用例不会妨碍我们，让我们开始实现 `testAdd()`。幸运的是，编写单元测试非常简单。您只需要调用应用程序代码的片段，获取结果，然后检查它们是否完全符合预期。使用\
  \ JUnit 时，不必编写大量 if 语句来比较结果，您可以依赖断言方法。使用断言方法，您指定预期结果，然后传递从调用应用程序代码获得的实际结果。\n\n例如，我们可以通过执行以下代码所示的简单加法运算来实现\
  \ `testAdd()` 方法。首先，我们需要创建一个 `BasicCalculator` 的实例。其次，我们调用正在尝试测试的代码片段，即 `add()`\
  \ 方法。最后，我们使用断言方法来评估调用 `add()` 方法的结果，参数两次都为 2。`assertEquals()` 方法期望 `getResult()`\
  \ 返回 4。运行我们的测试用例后，我们可以看到被测方法似乎工作正常，因为 `getResult()` 返回了 4，正如预期的那样。以下是我们实现 `testAdd()`\
  \ 的方式：\n\n```java\n@Test\npublic void testAdd() {\n    BasicCalculator calculator\
  \ = new BasicCalculator();\n    calculator.add(2);\n    calculator.add(2);\n   \
  \ // result should be 4\n    assertEquals(4 /*expected*/, calculator.getResult()\
  \ /*actual*/);\n    calculator.clear();\n}\n```\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_73_0.png)\n\
  \n> 通常，编写单元测试应该是容易的。如果编写它们花费的时间太长，可能意味着您的设计需要改进；您应该考虑重构代码。\n\n在实现更多测试之前，有必要再说几句关于断言方法的话。如前例所示，assertEquals()\
  \ 接受两个参数，预期结果和要与预期结果进行比较的值。在我们的代码中，我们通过静态导入引用此方法（请查看 Eclipse 为我们自动生成的静态导入语句）。如果我们不通过静态导入使用\
  \ assertEquals()，我们就需要输入更多内容：Assert.assertEquals(4, calculator.getResult())。\n\n\
  减法操作的测试与加法操作的测试类似。同样，我们创建被测类的实例，调用被测代码片段，并检查调用的代码是否产生了预期结果。请继续按照以下代码片段实现 testSubtract()。请注意，我们的\
  \ testSubtract() 方法依赖于 add() 来为 subtract() 做好准备。更具体地说，add() 被调用以将值 35 存储到计算器的 result\
  \ 变量中。然后我们从结果中减去 5，并使用断言方法来评估执行这些算术运算后结果是否包含值 30。\n\n```java\n@Test\npublic void\
  \ testSubtract() {\n    BasicCalculator calculator = new BasicCalculator();\n  \
  \  calculator.add(35);\n    calculator.subtract(5);\n    assertEquals(30, calculator.getResult());\n\
  \    calculator.clear();\n}\n```\n\n如您所见，所有测试都从创建 BasicCalculator 的实例开始（在该实例上调用被测方法），并以调用\
  \ calculator.clear() 结束（以便清除 result 中存储的值，从而不会干扰其他测试方法产生的结果）。从应用程序和测试代码中消除重复代码始终是一个好主意。我们可以将这段重复代码提取到一个执行测试环境所有初始化和配置的方法中，以及一个包含清理代码的方法中。在\
  \ JUnit 4 中，为了让一个方法在每个测试用例之前执行，只需用 @Before (org.junit.Before) 标记它。以下是我们如何消除部分重复代码的方法：\n\
  \n```java\nprivate BasicCalculator calculator;\n\n@Before\npublic void setup() {\n\
  \    calculator = new BasicCalculator();\n}\n\n@Test\npublic void testAdd() {\n\
  \    calculator.add(2);\n    calculator.add(2);\n    // result should be 4\n   \
  \ assertEquals(4/*expected*/, calculator.getResult()/*actual*/);\n    calculator.clear();\n\
  }\n```\n\n请注意，calculator 现在是一个实例变量，testAdd() 和 testSubtract()（代码片段中未显示）都不需要实例化 BasicCalculator\
  \ 的本地版本；它们只需使用 calculator 实例变量即可。另请注意，所有初始化代码都已移至 setup 方法，JUnit 会确保在执行每个测试方法之前调用它。通常，包含对被测程序进行测试所需初始化代码的方法命名为\
  \ setup。同样，包含清理代码的方法命名为 teardown。鉴于每个测试用例现在都使用自己的 BasicCalculator 实例，如果 result 不是静态变量，我们就不需要在这些实例上调用\
  \ clear()。因此，我们可以安全地去掉所有对 clear() 的调用。然而，由于它是一个静态变量，我们仍需要在每个测试方法之后调用 clear()。\n\n\
  > 由于带有 @Before 注解的方法在每个测试用例之前运行，因此测试运行之间没有副作用。\n\n在我们的示例中，清理代码应提取到用 @After 标记的方法中。这样，该方法将在每个测试用例之后执行。请继续按照如下方式实现清理代码：\n\
  \n```java\n@After\npublic void teardown() {\n    calculator.clear();\n    calculator\
  \ = null; //this isn't really necessary\n}\n```\n\n仔细查看我们的代码，我们可以看到在执行测试方法之前不需要新的\
  \ BasicCalculator 对象。只要我们在每个测试方法执行后对该实例调用 clear()，我们就可以重用一个 BasicCalculator 实例。您可能想知道如何使用\
  \ JUnit 实现这一点。实际上，这非常简单。JUnit 提供了一个注解，允许我们指定在运行所有测试方法之前必须执行的方法。实现这一点的注解是 @BeforeClass。要用\
  \ @BeforeClass 注解，方法必须声明为 public 且 static，并且不能接受参数。我们不再需要之前的 setup() 方法，因此让我们对其进行调整，使其仅为所有测试用例执行一次（请注意，我们的\
  \ teardown() 方法仍在每个测试方法之后被调用以重置计算器的结果）：\n\n```java\nprivate static BasicCalculator\
  \ calculator;\n\n@BeforeClass\npublic static void setup() {\n    calculator = new\
  \ BasicCalculator();\n}\n\n@After\npublic void teardown() {\n    calculator.clear();\n\
  }\n```\n\n现在，让我们继续进行更具挑战性的算术运算。让我们开始着手测试 multiply() 和 divide() 方法。幸运的是，对我们来说，测试\
  \ multiply 是很直接的，如以下代码片段所示：\n\n```java\n@Test\npublic void testMultiply() {\n  \
  \  calculator.add(10);\n    calculator.multiply(3);\n    assertEquals(30, calculator.getResult());\n\
  }\n```\n\n虽然 testMultiply() 看起来很简单，但在运行它时，我们发现了一个 bug。如以下屏幕截图所示，getResult() 返回的不是\
  \ 30，而是 9。请注意，错误消息如何使用期望值和实际值来告知我们测试失败。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_76_0.png)\n\
  \n困惑之下，我们查看了 multiply 的实现，发现它并没有将 `result` 与参数 `n` 相乘，而是将 `n` 自身相乘并将该值赋给 `result`。幸运的是，修复方法很简单：\n\
  \n```\npublic void multiply(int n) {\n    result *= n;\n}\n```\n\n正如你所见，即使是简单的测试方法也是对抗潜伏在我们代码中的\
  \ bug 的有效武器。尽管如此，到目前为止，我们只是编写了测试我们 `BasicCalculator` 代码的 happy path 的测试方法。有时我们需要编写测试方法来测试被测代码块的边界情况。在\
  \ Java 中，导致某个方法抛出异常的输入可以被视为边界情况。例如，我们的计算器必须应对的边界情况之一是除以零。\n\n在 Java 中，尝试将整数除以零将导致\
  \ `ArithmeticException`。如果期望我们的计算器在除以零时抛出 `ArithmeticException`，我们需要在测试中明确说明这一期望。\n\
  \n幸运的是，JUnit 提供了有效处理这些边界情况和相关预期异常的方法。`@Test` 注解支持两个可选参数。第一个 `expected` 指定测试方法应抛出异常。如果底层方法未抛出异常或抛出的异常与指定的不同，测试将失败。\n\
  \n例如，我们可以使用此注解来实现 `testDivision()` 方法的边界情况，如以下代码所示。它指定 `BasicCalculator` 中的方法 `divide()`\
  \ 在发生除以零时应抛出异常（`ArithmeticException`）。请注意，我们不需要使用任何断言方法，因为我们期望的唯一结果是 `ArithmeticException`。值得一提的是，作为参数传递给\
  \ `expected` 的类必须是 `java.lang.Throwable` 的子类。\n\n```\n@Test(expected=ArithmeticException.class)\n\
  public void testDivide() {\n    calculator.add(10);\n    calculator.divide(0);\n\
  }\n```\n\n还有另一种实现相同行为的方法。你可以通过 JUnit 的 ExpectedException 规则来声明预期异常。首先，让我们给你一个关于\
  \ JUnit 规则的速成课程。\n\n在测试框架的早期版本中，不可能修改或增强 JUnit 对给定测试套件的内部知识。使用当前版本，我们可以使用规则来修改测试结果、在运行测试前以某种方式更改测试，并向测试结果添加信息。我们将使用\
  \ @Rule 注解来告知 JUnit 对底层测试应用哪些规则。\n\n通过将 ExpectedException 与 @Rule 结合使用，你可以指定针对特定测试方法应抛出的异常的测试内期望。虽然比预期需要多打一些字，但如图所示，你对期望的内容有更大的控制权。例如，你甚至可以指定预期异常应包含的消息。\n\
  \n```java\n@Rule\npublic ExpectedException thrown = ExpectedException.none();\n\n\
  @Test\npublic void testDivide() {\n    thrown.expect(ArithmeticException.class);\n\
  \    thrown.expectMessage(\"/ by zero\"); //specify the expected message\n    calculator.add(10);\n\
  \    calculator.divide(0);\n}\n```\n\n至于 @Test 的第二个可选参数 timeout，如果测试方法执行时间超过指定的毫秒数，则会导致测试失败。为了举例说明，假设我们将\
  \ testSquareRoot 实现为一个无限循环，并在 1 秒后失败。运行以下代码时，你应该会得到一个红色条以及一个包含以下消息的 java.lang.Exception：\"\
  test timed out after 1000 milliseconds\"。\n\n```java\n@Test(timeout=1000)\npublic\
  \ void testSquareRoot() {\n    while(true);\n}\n```\n\n好吧，到目前为止，我们相信你已经掌握了使用 JUnit\
  \ 和 Eclipse 编写测试方法的大致思路。我们甚至能够在计算器中发现一个 bug。 granted，它是一个非常简单、易于发现的 bug。\n\n很抱歉地说，并非每个\
  \ bug 都很容易发现。有时你可能会遇到一个红色条，让你束手无策，不知道如何解决问题。换句话说，当测试失败时，即使花了相当多的时间盯着代码也无法弄清楚原因时，你需要求助于调试器。为了说明这一点，让我们实现测试方法\
  \ testAddResultToTempAt。addResultToTemp 方法应执行以下操作：根据作为参数传递的索引，将存储在变量 result 中的当前值添加到\
  \ tempVars 数组中的某个位置。在实现此测试方法期间，我们意识到我们没有实现一个方法来获取这个临时结果数组。在实现单元测试时，意识到自己遗忘了某些东西的情况屡见不鲜。为了解决这个问题，我们添加了一个简单的\
  \ get 方法，名为 getTemps，它只是返回变量 tempVars。\n\n```\npublic int[] getTemps() {\n    return\
  \ tempVars;\n}\n```\n\n至于我们的测试方法，它使用了我们最近实现的 getTemps，我们将其实现如下：\n\n```\n@Test\n\
  public void testAddResultToTempAt() {\n    calculator.add(9);\n    calculator.addResultToTempAt(1);\n\
  \    int[] temps = calculator.getTemps();\n    assertEquals(9, temps[1]);\n}\n```\n\
  \n正如你所见，我们再次使用 add 将值 9 存储到变量 `result` 中。之后，为了将 9 存储到临时内存的槽号 1 中，我们调用 `addResultToTempAt`\
  \ 并传递 1 作为参数。预期的行为是代表计算器临时内存的数组现在在索引 1 处包含值 9。然而，测试失败了（如以下屏幕截图所示）。与预期行为不同，我们得到一个\
  \ `NullPointerException`。通过观察 **Failure Trace** 面板获得的唯一线索是异常是在我们的 `BasicCalculator`\
  \ 类的第 16 行抛出的。仅凭查看这一行，无法猜出出了什么问题（好吧，这也取决于你的 Java 经验）。调试器就是为这类问题而存在的。因此，我们不会破坏发现此问题根本原因的乐趣。相反，我们将介绍专业工具。也就是说，我们将解释如何使用\
  \ Eclipse 内置的 Java 调试器，以便你自己找到并修复此 bug。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_80_0.png)\n\
  \n## 问题出现时的调试\n\n如果你已经编程一段时间了，你很可能熟悉一种经典的调试技术，称为 trace code。如果你不熟悉 trace code，让我们为你分解一下。在这种调试技术中，我们在被检查的代码中引入\
  \ `println` 或 `print` 语句，以便显示有关变量的信息或程序是否已采取某条路径。考虑到这个定义，你可能会想，为什么需要调试器？答案很简单，有两方面。首先，使用调试器，你可以在不费太多周折的情况下达到同样的效果。应用\
  \ trace code 时，你需要包含打印语句，重新编译程序（或被检查的特定部分），运行并分析 trace code 的输出。此外，在找到 bug 后，你必须删除所有\
  \ trace code。更不用说每当出现 bug 时，你都必须重复整个过程。Trace code 是一种繁琐的技术。相比之下，使用调试器时，实现所有这些只需几次点击即可。其次，你可以从调试器中获得更多；它们允许你查看仅通过查看输出就很难弄清楚的程序方面。\n\
  \n正如我们提到的，Eclipse 配备了完整的调试器。此内置 Java 调试器提供所有调试支持功能；可以逐步执行程序、设置断点、检查变量和值，以及暂停和恢复线程。\n\
  \n有多种方法可以在调试模式下启动 Java 程序。一个选项是在 **Package Explorer** 视图中选择要调试的包含 main 方法的 Java\
  \ 类文件，然后单击工作台工具栏中的 **Debug** [*] 按钮（或从工作台菜单栏选择 **Run | Debug**）。也可以通过从工作台菜单栏选择 **Run\
  \ | Debug as | Java Application**，或在 **Package Explorer** 弹出菜单或 **Debug** 工具栏按钮的下拉菜单中单击\
  \ **Debug as | Java Application** 来实现同样的效果。在调试活动期间，Eclipse 会切换到 Debug Perspective，但在切换之前，以下屏幕截图中显示的窗口会询问你是否要从当前透视图更改为\
  \ Debug Perspective。\n\n\n\n\n运行配置和调试配置是共享的，也就是说，你用来运行应用程序的任何运行配置都应该在调试相关菜单中可用。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_82_0.png)\n\n当你点击 **yes** 时，调试透视图会出现，如以下截图所示。此透视图允许你控制正在检查的程序的所有执行线程。在调试透视图中：左上角的调用栈指示了你的程序中被调用的方法，右上角你可以管理断点并检查变量的内容。随着你通过逐步执行其执行并添加和移除断点与正在运行的程序交互，这些视图会得到更新。\n\
  \n与调试器交互的基本方式是通过设置断点。断点是一种指示调试器在你想要暂停执行的那行代码的方式。要设置断点，在 Java 透视图中，选择你想要调试的源代码文件并在编辑器中打开它（通过双击）。浏览代码并将光标放在标记栏上，该标记栏位于编辑器区域的左侧边缘，放在你想要停止执行的那一行上。然后双击以设置断点。或者，你也可以右键单击此位置并选择\
  \ **Toggle Breakpoint**。\n\n除了常规断点之外，还有条件断点。条件断点在与其关联的布尔表达式求值为 true 时被激活。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_83_0.png)\n\
  \n一旦断点被命中，Eclipse 会暂停执行，并且包含断点的行会被高亮显示，这会给你提供下一个将被执行的行的视觉反馈。这给了你一个机会来检查变量的状态等等。\n\
  \n> 如果你在包含断点的行之前或之后添加代码，Eclipse 会确保将该断点与其相应的行一起移动。因此你可以添加代码而无需担心改变断点的定位。\n\n要命中断点后恢复执行，请单击\
  \ Debug 视图工具栏中的 Resume 按钮。此按钮使程序执行直到完成或继续直到它到达下一个断点。\n\n> 你甚至可以在调试会话期间添加断点；你不需要暂停或停止程序的执行。另外，请记住由于你不能在一行设置多个断点，因此在一行上放置多个语句很重要。如果你这样做，你将无法正确检查这些行。还值得一提的是，如果没有断点，执行将不会暂停，你的程序将正常执行，就像你在\
  \ Java 透视图中运行它一样。\n\n旨在检查你的程序的行为，Eclipse 调试器允许你逐行逐步进入程序执行。这可以通过两个命令完成：step into（F5）和\
  \ step over（F6）。这两个命令之间的区别只有在下一条指令是方法调用时才明显。选择 step over 会使调试器执行该方法（而不进入它）并继续到方法调用之后的下一条语句。值得一提的是，即使调试器不显示方法的主体，它仍会正常执行。另一方面，如果你选择\
  \ step into 命令，调试器将继续到底层方法的第一行。\n\n进入方法调用后仍然可以跳过其余部分：使用 step return 命令（F7）。调试器将继续到方法调用之后的下一行。下面的表格概述了\
  \ Debug 工具栏中的主要命令。\n\n| Icon | Description |\n|------|-------------|\n|  | 禁用所有断点。\
  \ |\n|  | 恢复执行。 |\n|  | 通过终止当前执行来停止当前的调试会话。 |\n|  | 进入程序检查的下一条语句。如果下一条语句是方法调用，此命令将进入方法主体代码。\
  \ |\n|  | 进入程序检查的下一条语句。如果下一条语句是方法调用，此命令将在不进入的情况下执行方法主体。 |\n|  | 退出当前方法并转到调用代码。 |\n\
  |  | 重新进入 Debug 视图中选定的栈帧。由于它依赖于栈帧的存在，因此在调试本地方法时无法使用此选项。 |\n\n随着你逐步执行程序，你也可以浏览和修改程序的状态。你可以通过查看\
  \ **Variables** 窗口来检查局部变量、参数和可见字段的内容。你也可以通过在 Java 编辑器中将鼠标指针悬停在变量上来调查变量的内容。对于非原始变量，它们可以展开以检查其各个元素。除了检查变量的值之外，你还可以在\
  \ Debug 透视图的编辑器中检查 Java 表达式的值。选择一个表达式，然后右键单击它并选择 **Display**。Eclipse 会评估所选表达式，同时考虑当前作用域，并在弹出窗口中显示结果。\n\
  \n在调试会话期间，你也可以修改变量的值。为此，在 **Variables** 视图中选择你想要修改的变量；这会使其值出现在 **Variables** 视图的下半部分窗口中，以便你可以编辑它。编辑后，右键单击并选择\
  \ **Assign Value**。\n\n假设在你的调试会话中你发现了一个错误，幸运的是，你也知道如何立即修复它。你需要停止调试会话才能开始修复程序吗？答案是否定的。得益于称为热代码替换的功能，编辑和调试可以同时进行；你可以在不必停止调试会话的情况下编辑程序。唯一的副作用是，在修改方法后，Eclipse\
  \ 必须丢弃之前的栈帧并从第一行重新开始该方法。\n\n> 很可能你使用的是 Java 虚拟机 1.5 或更高版本，但我们应该警告你，热代码替换仅由 1.4.2\
