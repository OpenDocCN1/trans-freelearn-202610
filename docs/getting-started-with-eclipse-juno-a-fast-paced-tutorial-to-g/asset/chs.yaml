  \ Eclipse Juno 入门\n\n## 关于 Packt 出版社\n\nPackt，发音为 'packed'，于 2004 年 4 月出版了首部图书 \"\
  Mastering phpMyAdmin for Effective MySQL Management\"，此后一直专注于出版针对特定技术和解决方案的高度聚焦的图书。\n\
  \n我们的图书和出版物分享了您同行的 IT 专业人士在适应和定制当今系统、应用程序和框架方面的经验。我们的解决方案型图书为您提供知识和能力，以便定制您正在使用的软件和技术来完成工作。与您过去看到的\
  \ IT 图书相比，Packt 的图书更具体、更少泛泛而谈。我们独特的商业模式使我们能够提供更聚焦的信息，让您了解更多所需的内容，而减少不必要的信息。\n\n\
  Packt 是一家现代而独特的出版公司，专注于为开发人员、管理员和新手等社区生产优质、前沿的图书。欲了解更多信息，请访问我们的网站：www.packtpub.com。\n\
  \n## 关于 Packt 开源\n\n2010 年，Packt 推出了两个新品牌 Packt Open Source 和 Packt Enterprise，以继续专注于专业化。本书是\
  \ Packt Open Source 品牌的一部分，该品牌汇集了以开源许可证为基础的软件出版物，并为从高级开发人员到初级网页设计师的任何人提供信息。Open\
  \ Source 品牌还运营着 Packt 的开源版税计划，Packt 会向其软件被出版图书的每个开源项目支付版税。\n\n## 为 Packt 撰稿\n\n\
  我们欢迎所有有意撰稿的人士的咨询。图书提案请发送至 author@packtpub.com。如果您的图书想法仍处于早期阶段，并希望在撰写正式提案前先进行讨论，请联系我们；我们的其中一位约稿编辑会与您联系。\n\
  \n我们不仅寻找已出版的作者；如果您具备扎实的技术技能但缺乏写作经验，我们经验丰富的编辑可以帮助您发展写作事业，或为您提供专业知识的额外回报。\n\n## [PACKT]\
