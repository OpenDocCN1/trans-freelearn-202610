  ![](img/d7c3f2018603810fae83e1a6fd98749e_154_0.png)\n\n您现在已准备好使用 Eclipse 和 Tomcat\
  \ 来开发 servlet 和 JSP。不过，在实现第一个 servlet 之前，让我们先看看 servlet 是如何由 servlet 容器执行的。\n\n\
  ## Servlet 生命周期\n\n在继续之前，有必要先介绍一下 servlet 的生命周期。实现 servlet 生命周期有三个方法：init()、service()\
  \ 和 destroy()。在处理客户端请求之前，servlet 会由 servlet 容器（在本例中为 Tomcat）实例化并初始化。servlet 容器只实例化每个\
  \ servlet 的一个实例。在此初始化阶段，容器调用 init() 以给 servlet 一个运行初始化代码的机会。Servlet 以多线程方式运行，这意味着其方法可能由多个线程调用。在收到第一个客户端请求时，容器启动一个新线程或从池中分配一个线程。然后，servlet\
  \ 的执行被分配给该线程，该线程通过调用 servlet 的 service() 方法继续执行。\n\n> 值得强调的是，init() 只执行一次。此外，容器在\
  \ init() 完成之前无法调用 service()。\n\nservice() 接受两个参数：一个请求对象（它是 javax.servlet.http.HttpServletRequest\
  \ 的实例）和一个响应对象（它是 javax.servlet.http.HttpServletResponse 的实例）。容器正是通过这两个实例来访问客户端请求并生成输出。在\
  \ service() 中，会检查请求对象以确定请求的类型。确定请求类型后，service() 会将请求和响应对象分派给负责实现该请求的 HTTP 相关方法。HTTP\
  \ 相关方法的两个示例是 doGet() 和 doPost()。这些方法分别对应 HTTP GET 和 POST 操作。\n\n> 除了最常用的 doGet()\
  \ 和 doPost() 之外，HttpServlet 还包含 doPut() 和 doDelete() 方法。这些方法分别对应 HTTP PUT 和 DELETE\
  \ 操作。但由于这两种方法很少使用，我们将不详细介绍。您只需知道它们存在即可。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_155_0.png)\n\
  \n最后，destroy() 的主要目的是给 servlet 一个清理的机会。总结一下，在实现自己的 servlet 时，大多数情况下您需要重写的方法是 init、doGet\
  \ 和 doPost（如果需要清理某些资源，则可能还需要 destroy）。\n\n## 使用 Eclipse WTP 实现您的第一个 Java servlet\n\
  \n首先，我们将解释如何使用 Eclipse WTP 实现 servlet，然后稍后我们再介绍如何实现 JSP。我们将创建一个相当简单的 servlet，它打印经典短语\
  \ \"Hello, World!\"。您会看到，使用 Eclipse WTP 编写和部署 servlet 非常轻松。使用 Eclipse WTP 开发 Web\
  \ 应用程序的某些方面如此简单，以至于您可能几乎不需要输入任何内容。因此，如果您真的想认真学习如何使用 servlet 和 JSP 开发 Web 应用程序，我们建议您先浏览本章以了解如何使用\
  \ WTP，然后完全离开 Eclipse，开始手动安排 Web 应用程序的所有结构。这将帮助您更好地理解此类应用程序的组织方式以及 Eclipse 为您优雅自动化的步骤数量。在掌握了如何组装、开发和部署\
  \ Web 应用程序的要点后，您可以返回 Eclipse 以加快开发过程。我们将感兴趣的读者引导至 http://tomcat.apache.org/tomcat-7.0-doc/appdev/index.html\
  \ 以获取有关 Web 应用程序开发的更多信息。\n\n要使用 Eclipse WTP 开发 servlet 和 JSP，首先，我们需要创建一个新的动态 Web\
  \ 项目：转到 文件 | 新建 | 其他... | Web。在新建向导中，展开 Web，然后选择 动态 Web 项目。您应到达以下截图所示的向导。\n\n如果您花点时间观察\
  \ Web 选项下的项目，您会看到有两种类型的 Web 项目：动态和静态。动态 Web 项目包含动态资源，例如 servlet、JSP 以及大量元数据，仅举几项。静态\
  \ Web 项目仅包含静态资源，例如层叠样式表。\n\n\n\n\n> Java 规范会带来很多开销；你必须遵守一个指定类路径位置、支持元数据和部署描述符的目录结构。因此，当你想要创建一个仅包含静态内容的简单\
  \ Web 应用程序时，你可能希望使用静态 Web 项目类型。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_156_0.png)\n\
  \n选择 **Dynamic Web Project** 后，单击 **Next**。让我们将项目命名为 `chapter7.examples`（在 **Project\
  \ name** 文本字段中输入）。关于 **New Dynamic Web Project** 向导（如下图所示）需要说明一些内容。首先，如下图所示，你可以通过从\
  \ **Target runtime** 下拉列表中选择一个选项来指定要使用的服务器。鉴于我们已安装 Tomcat，它应该是默认选项。其次，关于 **Dynamic\
  \ web module version** 下的数字，它与项目中将使用的 servlet API 版本有关。截至本文撰写时，3.0 是最新版本，也是本章将使用的版本。因此，在单击\
  \ **Next** 之前，将此选项设置为 **3.0**。最后，你可以让 **Configuration** 选项保持为 **<custom>** 或 **Default\
  \ Configuration for Apache Tomcat v7.0**。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_157_0.png)\n\
  \n下一个窗口名为 **Configure project for building Java application**（此窗口未显示），可用于在构建路径上添加源文件夹。在此窗口中，不要更改任何内容，只需接受默认值（src），然后再次单击\
  \ **Next**。\n\n最后，最后一个窗口询问是否应生成应用程序部署描述（web.xml）。请注意，生成此 XML 文件不是默认选项。目前我们不需要此类文件，因此请保持此选项未选中。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_158_0.png)\n\n单击 Finish 后，Eclipse 会提示你更改透视图。动态\
  \ Web 项目与 Java EE 透视图相关联。要继续，请选择 Yes。你刚刚创建了一个具有 Java Web 应用程序结构的项目。请注意，你无需创建大量文件夹或\
  \ XML 文件。下一张截图显示了动态 Web 项目的组织概览。目前对我们来说重要的部分是文件夹 WebContent 和 Java Resources，你的\
  \ servlet 将放在这里。WebContent 包含两个子文件夹：META-INF 和 WEB-INF。后者在本文中尤为重要。WEB-INF 包含应用程序部署描述符（web.xml，一个包含配置信息的文件）以及其他类型资源的子文件夹，例如配置文件。需要说明的是，客户端无法访问该文件夹下的文件，这使其成为存放不打算公开的文件的安全位置。WEB-INF\
  \ 内部有一个名为 lib 的子文件夹，用于放置 JAR 文件。未打包到 JAR 文件中的类文件被放置在另一个名为 classes 的文件夹中。然而，需要注意的是，你不应将任何\
  \ .class 文件放置到此目录中。相反，当 Eclipse 的 Java 编译器将 Java Resources 目录中的 Java 源文件翻译时，这些文件会自动放置在那里。编译器运行时，它会删除直接放置在此目录中的所有文件。\n\
  \n> `classes` 文件夹中的 Java 文件必须存储在反映其包结构的目录结构中。例如，属于名为 `foo.bar` 的包的类必须存储在 `WEB-INF/classes/foo/bar`\
  \ 文件夹中。在 Eclipse 内部开发时，它会为你处理大多数部署相关问题。然而，由于这种结构在大多数 Java Web 应用程序中很常见，了解每个文件应放置的位置可以帮助你在检查他人的\
  \ Web 应用程序时更好地定位。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_159_0.png)\n\nEclipse\
  \ 尚未创建任何 servlet。要让 Eclipse 创建我们的第一个 servlet，请右键单击 WebContent 文件夹，并导航到 New | Other...\
  \ | Web | Servlet。按以下截图所示填写空白字段：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_159_1.png)\n\
  \n你刚刚将 servlet 命名为 `HelloWorldServlet` 并将其放置在名为 `chapter7.examples.servlets` 的包中。生成的代码如下所示。为简洁起见，大多数生成的注释已被省略：\n\
  \n```java\npackage chapter7.examples.servlets;\nimport java.io.IOException;\nimport\
  \ javax.servlet.ServletException;\nimport javax.servlet.annotation.WebServlet;\n\
  import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
  import javax.servlet.http.HttpServletResponse;\n@WebServlet(\"/HelloWorldServlet\"\
  )\npublic class HelloWorldServlet extends HttpServlet {\n    private static final\
  \ long serialVersionUID = 1L;\n    public HelloWorldServlet() {\n        super();\n\
  \    }\n    protected void doGet(HttpServletRequest request,\nHttpServletResponse\
  \ response) throws ServletException, IOException {\n        // TODO Auto-generated\
  \ method stub\n    }\n    protected void doPost(HttpServletRequest request,\nHttpServletResponse\
  \ response) throws ServletException, IOException {\n        // TODO Auto-generated\
  \ method stub\n    }\n}\n```\n\n我们不希望你盲目地在计算机上输入内容，因此在修改生成的代码以满足我们的需求之前，让我们先了解一下这段代码的一些细节。Servlet\
  \ 3.0 API 引入了许多新功能。其中一项新功能是注解的引入，这使得用于声明 servlet（以及其他内容）的 XML 文件（`web.xml`）成为可选。这些注解位于包\
  \ `javax.servlet.annotation` 中。使用它们，你只需用 `@WebServlet` 对其进行注解即可定义有关 servlet 的元数据。你使用\
  \ `@WebServlet` 来告知 Tomcat 相关类是一个 servlet。`@WebServlet` 可以接受多个参数，并且可以使用这些参数为 servlet\
  \ 指定元数据。在此示例中，`/HelloWorldServlet` 表示 servlet 的 URL。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_160_0.png)\n\
  \n> servlet 的 URL 可以被视为客户端所知道的名称。换句话说，这是客户端访问的 HTML 代码中出现的名称——它是对客户端而言的虚构名称。容器负责根据客户端提供的\
  \ URL 调用正确的 servlet。\n\n除了 @WebServlet 之外，另一个表明前一个类是 servlet 的特征是它扩展了 javax.servlet.http.HttpServlet。自动生成的代码还提供了在实现\
  \ servlet 时最常重写的两个方法的存根实现，即 doGet 和 doPost。如你所见，doGet 和 doPost 方法都接受 HttpServletRequest\
  \ 和 HttpServletResponse 的实例。这些实例分别提供输入和输出流，并分别用于读取和写入客户端数据。\n\n编写 servlet 时，你会发现自己\n\
  throws ServletException, IOException {\n        response.setContentType(\"text/html\"\
  );\n\n```\nPrintWriter pw = response.getWriter();\npw.println(\"<html><head><title>Warm\
  \ Greeting</title></head>\" +\n\"<body>\" +\n\"<h1> Hello, World! </h1>\" +\n\"\
  </body></html>\"\n);\npw.close();\n}\n```\n\n在运行 servlet 之前，让我们先看看你在 doGet 中刚刚输入的内容。首先，你应该记住我们正在重写\
  \ doGet 以处理客户端请求。在本示例的上下文中，对 /HelloWorldServlet 的 GET 请求将由打印消息 Hello, World! 的 HTML\
  \ 文档来响应。最初，你需要告知容器返回的数据是 HTML 文档。为此，你调用 HttpServletResponse 对象名为 setContentType\
  \ 的方法。在此示例中，我们将内容类型设置为 text/html。有关内容类型的信息会放在 HTTP 响应的头部。此类信息告知客户端应期望请求的结果是什么。正是通过这些信息，客户端浏览器才知道下一步该做什么：渲染\
  \ HTML、启动 PDF 查看器、将返回的数据保存为下载文件等等。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_162_0.png)\n\
  \n> 当你调用 setContentType 时，你正在为 servlet 返回的数据设置 MIME 类型。大多数情况下，servlet 使用的 MIME 类型是\
  \ text/html。然而，也可能使用其他 MIME 类型。例如，返回 PDF 文档的 servlet 应将 MIME 类型设置为 application/pdf。\n\
  \n通过 setContentType 你还可以指定字符编码。假设我们希望 servlet 容器将字符编码设置为 UTF-8，我们将按如下方式调用 setContentType：\n\
  \n```\nresponse.setContentType(\"text/html; charset=UTF-8\");\n```\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_162_1.png)\n\
  \n> 从 Java 5 开始，你还可以通过 servlet 响应对象的 setCharacterEncoding 方法设置字符编码。\n\n\n\n下一步是获取输出流并向其写入所需的\
  \ HTML 内容。Servlet 响应对象提供了用于将数据发送回客户端的输出流。要获取输出流，需要调用 getWriter，它返回一个 PrintWriter\
  \ 实例。如果你已经使用过 java.io，那么你已经熟悉 PrintWriter 了。如果你没有使用过 java.io，这里是关于 PrintWriter 的速成课程：它设计用于处理字符数据。当你需要从\
  \ servlet 返回其他内容时，将使用 OutputStream 实例。你可以通过在响应对象上调用 getOutputStream 来获取 OutputStream\
  \ 实例，如以下代码片段所示：\n\n```\nServletOutputStream out = response.getOutputStream();\n\
  ```\n\nPrintWriter 有很多方法；然而，大多数时候你只需要使用 println 或 print 将文本数据打印到字符流中。如前例所示，为了向流写入\
  \ HTML，你只需执行 I/O 操作。更具体地说，HTML 被嵌入到 Java 字符串中并发送到输出流。\n\n此时你应该能够运行最近创建的 servlet。在\
  \ Eclipse 中运行我们的示例相当直接。选择 HelloWorldServlet，右键单击它，然后从 Run As 中选择 Run on Server，如以下屏幕截图所示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_163_0.png)\n\n> 值得一提的是，Eclipse 也允许你调试\
  \ Web 应用程序。你甚至可以在 JSP 文件中设置断点。因此，如果你在开发过程中遇到任何问题，知道可以借助逐步执行来发现错误是很有帮助的。\n\n将出现一个列出可用服务器的窗口。由于我们之前配置了\
  \ Tomcat，它应该包含在此列表中（如以下屏幕截图所示）。选择 **Tomcat** 后，单击 **Finish**。你可以勾选 **Always use\
  \ this server when running this project** 选项，这样每次运行应用程序时此对话框就不会弹出。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_164_0.png)\n\
  \n按下 **Finish** 后，Eclipse 将在 Tomcat 上配置示例 servlet。你应该会在 Eclipse 的内部浏览器中看到以下消息。如果你看到了这条消息，恭喜你，你刚刚使用\
  \ Eclipse WTP 创建了第一个 servlet：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_164_1.png)\n\
  \n我们可以让此 servlet 显示的消息更有趣。到目前为止，它没有任何动态内容。每次运行示例时，你都会得到相同的消息。换句话说，无论你刷新 Eclipse\
  \ 内部浏览器多少次，你都会看到 Hello, World! 消息。让我们在此消息中添加当前时间。为此，按以下代码所示修改 doGet 方法。请注意，每当你需要更改发送回客户端的\
  \ HTML 数据时，你都必须更改嵌入在 Java 代码中的 HTML 数据：\n\n```\nprotected void doGet(HttpServletRequest\
  \ request, HttpServletResponse response) throws ServletException, IOException {\n\
  \    response.setContentType(\"text/html\");\n\n    java.util.Date currentTime =\
  \ new java.util.Date();\n    PrintWriter pw = response.getWriter();\n    pw.println(\"\
  <html><head><title>Warm Greeting</title></head>\" +\n        \"<body>\" +\n    \
  \    \"<h1> Hello, World! </h1>\" +\n        \"<ul> <li>current time: \" + currentTime\
  \ + \"</li></ul>\" +\n        \"</body></html>\"\n    );\n    pw.close();\n}\n```\n\
  \n要查看新 servlet 的运行情况，按之前描述的方式运行它。运行上述代码后，你应该会看到类似于以下屏幕截图的内容。现在，每次点击刷新时，你都会得到一个全新的时间戳。此时间戳在运行时获取并动态添加到响应中：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_165_0.png)\n\n## 一个更复杂的示例 – 又一个计算器\n\n\
  现在你已经了解了基础知识，让我们继续一个更复杂的示例。我们将开发一个简单的计算器（到此时，你可能已经意识到作者之一是计算器迷）。为了保持简单，我们的 Web 计算器一次只能处理两个操作数。在输入每个操作数的值后，用户可以选择希望计算器执行的运算。运算结果将在新页面中显示。\n\
  \n我们的示例将包含三个类，其中两个是 servlet，一个是普通的 Java 类。普通类实现了计算器本身，而 servlet 负责展示以及展示与计算器类之间的交互。让我们从小处着手，先实现第一个\
  \ servlet，即用户输入两个操作数值的地方。值得一提的是，我们本可以使用纯 HTML 实现相同的功能，但我们喜欢让事情更有趣。此外，将此功能作为 servlet\
  \ 实现将给你另一个机会来实践你最近获得的知识。好了，开始吧。\n\n我们将在一个新项目中开发计算器。因此，首先，创建一个新的动态 Web 项目，并将其命名为\
  \ `webcalculator`（如果你不记得如何创建动态 Web 项目，请回到我们解释如何在 Eclipse 中创建 servlet 的章节开头）。然后，创建一个名为\
  \ `OperationSelect` 的 servlet 并将其放在包 `com.example.calculator.web` 中。下一个屏幕截图显示了你在\
  \ **Create Servlet** 窗口中应输入的内容。请记住，你无需事先创建包。创建 servlet 后，Eclipse 会确保创建其关联的包结构。由于我们的项目同时包含\
  \ servlet 和普通 Java 类，我们将使用一种广泛使用的约定来组织这些元素。Servlet 将放在包 `com.example.calculator.web`\
  \ 中，而我们的计算器类将放在名为 `com.example.calculator.model` 的包中。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_166_0.png)\n\
  \n连续点击 **Next** 两次以进入以下窗口。然后取消选择 **doPost** 选项；我们不会为此 servlet 重写此方法。顺便也取消选择 **Constructors\
  \ from superclass** 选项；我们也不需要构造函数。最后，点击 **Finish**：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_167_0.png)\n\
  \nEclipse 将生成一个包含空 `doGet` 方法的 servlet。尽管生成的代码没做什么，但我们现在无需从头开始输入所有内容。让我们开始通过修改 `doGet`\
  \ 方法来更改生成的 servlet，如以下代码所示。请注意，我们执行的操作与前例所示相同。首先，我们将内容类型设置为 `text/html`。其次，我们获取了输出流以便将\
  \ HTML 内容写入输出。\n\n正如你所见，你需要添加到输出中的 HTML 越多，你的代码就越臃肿。为了简单起见，我们在示例 servlet 中没有使用复杂的\
  \ HTML 结构。前两个元素是文本字段，最后一个是下拉列表，用户可以从中选择使用两个操作数执行的运算。我们还添加了一个提交按钮，它将操作数和运算信息转发给另一个\
  \ servlet，而该 servlet 又将触发我们计算器类的执行：\n\n```\n@Override\nprotected void doGet(HttpServletRequest\
  \ request, HttpServletResponse response) throws ServletException, IOException {\n\
  \    response.setContentType(\"text/html\");\n    PrintWriter pw = response.getWriter();\n\
  \    pw.write(\"<html><body>\");\n    pw.write(\"<h1 align=\\\"center\\\">Web Calculator\
  \ v1.0</h1>\");\n    pw.write(\"<form method=\\\"POST\\\" action=\\\"PerformCalculation.do\\\
  \">\");\n    pw.write(\"<tt>1st operand:</tt> <input type=\\\"text\\\" \" + \"name=\\\
  \"firstOperand\\\"><br>\");\n    pw.write(\"<tt>2nd operand:</tt> <input type=\\\
  \"text\\\" \" + \"name=\\\"secondOperand\\\"><br>\");\n    pw.write(\"Operation\
  \ to be performed: \");\n    pw.write(\"<select name=\\\"operation\\\" size=\\\"\
  1\\\">\");\n    pw.write(\"<option value=\\\"+\\\" > + </option>\");\n    pw.write(\"\
  <option value=\\\"-\\\" > - </option>\");\n    pw.write(\"<option value=\\\"*\\\"\
  \ > * </option>\");\n    pw.write(\"<option value=\\\"/\\\" > / </option>\");\n\
  \    pw.write(\"</select></br></br>\");\n    pw.write(\"<input type=\\\"submit\\\
  \" value=\\\"Submit\\\">\");\n    pw.write(\"</form>\");\n    pw.write(\"</body></html>\"\
  );\n    pw.close();\n}\n```\n\n## 部署计算器示例\n\n在输入前面显示的方法后，我们准备好试用计算器示例的第一部分。如果你不记得如何在\
  \ Eclipse 中运行 Web 应用程序，这里有一个快速提醒：选择所需程序（本例中为 OperationSelect），右键单击它，然后在 Run As 中导航到\
  \ Run on Server。从可用服务器列表中选择 Tomcat，然后单击 Finish。下一个屏幕截图显示了执行此 servlet 后你将看到的内容：\n\
  \n\n![](img/d7c3f2018603810fae83e1a6fd98749e_169_0.png)\n\n我们尚未实现负责将值和操作转发给实现计算器的类的\
  \ servlet。因此，如果你在 1st operand 和 2nd operand 字段中输入两个数字，选择一个操作，然后按下 Submit，你将看到下一张截图中显示的页面。这表明\
  \ servlet 容器未找到我们正在查找的资源。那么，让我们退一步看看为什么 servlet 容器试图将数据转发到 webcalculator/PerformCalculation.do。\n\
  \n这个问题的答案归结为我们的表单正在向名为 PerformCalculation.do 的内容提交信息（请查看之前的代码片段）。此外，由于没有名为此的名称的资源（例如\
  \ servlet 或 HTML 页面），容器会显示错误消息。在此示例中，PerformCalculation.do 是一个逻辑名称。也就是说，它不是一个实际的文件名。我们不希望客户端能够访问我们的\
  \ servlet 类的名称。因此，我们改用映射到实际 servlet 的虚构名称。这就解释了为什么我们得到错误页面：我们尚未告知容器哪个 servlet 通过逻辑名称\
  \ PerformCalculation.do 进行响应。\n\n> .do 扩展名（意味着 *做某事*）只是一个约定。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_169_1.png)\n\
  \n实现我们示例的第二部分意味着将 servlet 映射到上述虚构名称。再次使用 Eclipse 为你生成 servlet。将它命名为 `ArithmeticExpert`，并将其放置在前一个\
  \ servlet 的同一包中（`com.example.calculator.web`）。在创建 `ArithmeticExpert` 时，并在输入 servlet\
  \ 名称和包的第一个窗口之后，点击 **下一步**，然后点击 **编辑...**，如以下截图所示。在这里你可以编辑 servlet URL 映射。鉴于我们希望告知容器新\
  \ servlet 可以映射到 `PerformCalculation.do`，请按以下代码片段所示编辑此选项（确保不要以 / 字符开头）并按下 **下一步**：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_170_0.png)\n\n而不是重写 `doGet`，这次我们将重写 `doPost`。因为\
  \ `OperationSelect` 中的表单会生成 `POST` 操作，所以我们必须重写 `doPost`。否则，按下 **提交** 按钮将不会调用我们的方法。因此，取消选择\
  \ **doGet** 和 **从超类构造** 选项。最后，点击 **完成**。按以下片段所示更改生成的代码：\n\n```\n@WebServlet(\"/PerformCalculation.do\"\
  )\npublic class ArithmeticExpert extends HttpServlet {\n    private static final\
  \ long serialVersionUID = 1L;\n    @Override\n    protected void doPost(HttpServletRequest\
  \ request,\nHttpServletResponse response)\n    throws ServletException, IOException\
  \ {\n        response.setContentType(\"text/html\");\n        PrintWriter pw = response.getWriter();\n\
  \        pw.write(\"<html><body>\");\n        pw.write(\"The result of \" +\n  \
  \      request.getParameter(\"firstOperand\") + \" \" +\n        request.getParameter(\"\
  operation\") + \" \" +\n        request.getParameter(\"secondOperand\") +\n    \
  \    \" is surprise, surprise\");\n        pw.write(\"</body></html>\");\n     \
  \   pw.close();\n    }\n}\n```\n\n我们分阶段实现计算器示例。在这个第一个版本中，我们的目标是确保第一个和第二个 servlet\
  \ 之间的通信链路正常工作。因此，我们的代码不会调用计算器类来执行选定的操作。相反，它只会打印出一条消息，表明两个 servlet 之间的通信正在工作，并且我们能够在它们之间共享信息。前述代码中有两个重要点需要注意。首先，看看\
  \ servlet 及其虚构名称之间的映射是如何使用 @WebServlet 注解实现的，该虚构名称出现在 OperationSelect 的输出中。请注意，括号中包含的字符串是我们创建底层\
  \ servlet 时输入的模式（请查看之前的截图）。其次，注意我们如何从请求中访问参数。我们使用 HttpServletRequest 的 getParameter\
  \ 方法（实际上，此方法在 ServletRequest 接口中定义，并由包括 HttpServletRequest 在内的子类实现）。使用 getParameter，每个参数都按其名称检索。\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_171_0.png)\n\n参数名称区分大小写。\n\n在运行之前的 servlet\
  \ 并在 **第一个操作数** 文本字段中输入 2，在 **第二个操作数** 文本字段中输入 1，选择减法作为要执行的操作，然后按下 **提交** 后，你应该会看到类似下一张截图的内容。如以下截图所示，现在应用程序可以访问用户在一个\
  \ servlet 中输入的数据，以便在另一个 servlet 中执行计算：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_172_0.png)\n\
  \n为了完成计算器示例，我们需要实现一个能够执行第一个 servlet 中显示的算术操作的计算器类。这对你来说应该很简单。在查看以下片段中显示的解决方案之前，请尝试自己编写这个类。只需确保将其命名为\
  \ `Calculator`，并将其放置在名为 `com.example.calculator.model` 的包中。以下是我们实现 Calculator 的方式：\n\
  \n```java\npackage com.example.calculator.model;\npublic class Calculator {\n  \
  \  private double op1, op2;\n    private String operation;\n    public Calculator(String\
  \ op1, String op2, String operation) {\n        try {\n            this.op1 = Double.parseDouble(op1);\n\
  \            this.op2 = Double.parseDouble(op2);\n            this.operation = operation;\n\
  \        }\n        catch (NumberFormatException e) {\n            //reset the value\
  \ of both operands\n            this.op1 = 0.0;\n            this.op2 = 0.0;\n \
  \       }\n    }\n    public double performCalculation() {\n        if (operation.equals(\"\
  +\")) {\n            return op1 + op2;\n        } else if (operation.equals(\"-\"\
  )) {\n            return op1 - op2;\n        } else if (operation.equals(\"/\"))\
  \ {\n            return op1 / op2;\n        } else if (operation.equals(\"*\"))\
  \ {\n            return op1 * op2;\n        }\n        return 0;\n    }\n}\n```\n\
  \n实现 Calculator 后，你只需将其集成到 ArithmeticExpert servlet 中，如以下片段所示。请注意，我们的实现不处理除零等边界情况。再次执行示例后，你将看到与以下截图类似的内容：\n\
  \n```\n@Override\nprotected void doPost(HttpServletRequest request, HttpServletResponse\
  \ response) throws\n    ServletException, IOException {\n    response.setContentType(\"\
  text/html\");\n    PrintWriter pw = response.getWriter();\n    pw.write(\"<html><body>\"\
  );\n    String operandOne = request.getParameter(\"firstOperand\");\n    String\
  \ operandTwo = request.getParameter(\"secondOperand\");\n    String operation =\
  \ request.getParameter(\"operation\");\n    pw.write(\"The result of \" +\n    \
  \    operandOne + \" \" +\n        operation + \" \" +\n        operandTwo +\n \
  \       \" is \" +\n        new Calculator(operandOne, operandTwo,\n           \
  \ operation).performCalculation());\n    pw.write(\"</body></html>\");\n    pw.close();\n\
  }\n```\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_173_0.png)\n\n## 使用 Eclipse WTP\
  \ 实现你的第一个 JSP\n\n前面的章节让我们开始使用 Tomcat、servlet 和 Eclipse WTP。如你所见，尽管 Eclipse WTP 提供了好处（它为我们生成了整个\
  \ Web 项目的结构，并在实现之前的示例 servlet 时负责生成大量代码），但将 HTML 嵌入到 Java 代码中感觉有点别扭。正如我们提到的，JSP\
  \ 被引入是为了使动态内容的创建更直接和更具吸引力。JSP 让你比 servlet 以更好的方式混合 HTML 和 Java 代码。不是将 HTML 嵌入到 Java\
  \ 代码中，JSP 使嵌入动态内容到 HTML 成为可能。回顾之前的章节，JSP 是一个包含一些特殊元素的 HTML 页面。渲染为动态内容的元素类似于 HTML\
  \ 元素。然而，它们是组件化的 Java 程序。除了这些类似 HTML 的元素外，JSP 页面还可以包含 Java 代码（scriptlets）。\n\n需要提醒你的是，尽管\
  \ JSP 看起来像带有额外元素的标准 HTML 页面，但它们会被编译为 servlet。正如我们提到的，在运行时，Tomcat 将 JSP 页面编译为 servlet，将\
  \ servlet 编译为字节码，并最终执行它们。\n\n在本节中，我们将演示如何使用 Eclipse WTP 创建 JSP。我们将实现一个 JSP，它显示与\
  \ servlet 示例相同的消息。\n\n你不需要创建一个新的 Web 应用程序项目；我们将使用之前的那个。要让 Eclipse 为你创建一个新的 JSP 文件，请执行以下操作：选择文件夹\
  \ `WebContent`（Tomcat 将在此文件夹中查找 JSP），然后在 **新建** 中右键单击 **JSP 文件**。将其命名为 `HelloWorldJSP.jsp`（如以下截图所示），然后点击\
  \ **下一步**。实际上，你不需要输入扩展名（`.jsp`），Eclipse 会自动添加：\n\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_175_0.png)\n\
  \n之后，选择名为 **新建 JSP 文件 (html)** 的选项，其描述为 **使用 html 标记的 JSP**（如下图所示），然后单击 **完成**：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_175_1.png)\n\nEclipse 将生成以下代码。第一行是一个\
  \ JSP 指令元素。指令元素指定与页面本身相关的各种属性。因此，它不一定会改变发送到浏览器的响应，但会告知容器应如何处理该页面。第一行是一个页面指令，其中除了其他内容外，还指定了相关页面的内容类型：text/html。JSP\
  \ 指令元素以 <%@ 开始，以 %> 结束，在这两个分隔符之间，名称/值对的列表代表所谓的指令属性。\n\n除页面指令外，自动生成的代码主要包含 HTML 代码。在\
  \ JSP 用语中，一切不是 JSP 元素的内容都称为模板文本。模板文本是静态的，这意味着它会被发送到浏览器而不会经过任何转换。\n\n至于自动生成的代码中的模板文本，存在一个标题占位符，而\
  \ body 部分为空。如果你熟悉 HTML 和 Java，编写 JSP 页面对你来说应该很轻松。如果你对 HTML 不太熟悉，创建 JSP 页面起初可能会有点棘手。\n\
  \n```\n<%@ page language=\"java\" contentType=\"text/html; charset=ISO-8859-1\"\n\
  \    pageEncoding=\"ISO-8859-1\"%>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01\
  \ Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\">\n<html>\n<head>\n\
  <meta http-equiv=\"Content-Type\" content=\"text/html;\ncharset=ISO-8859-1\">\n\
  <title>Insert title here</title>\n</head>\n<body>\n</body>\n</html>\n```\n让我们先将标题占位符替换为我们在前一个示例中使用的标题，即\
  \ \"Warm Greeting\"：\n<title>Warm Greeting</title>\n\n接下来，让我们添加 Hello, World! 静态消息以及消息的动态部分：时间戳。添加前者很简单，只需复制示例\
  \ servlet 中显示的 HTML 代码的一部分即可。要包含后者，我们将在页面中嵌入 Java 表达式，将其放在 <%= 和 %> 之间，如以下代码片段所示：\n\
  \n```\n<%@ page language=\"java\" contentType=\"text/html; charset=ISO-8859-1\"\
  \ pageEncoding=\"ISO-8859-1\"%>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\
  \ \"http://www.w3.org/TR/html4/loose.dtd\">\n<html>\n<head>\n<meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=ISO-8859-1\">\n<title>Warm Greeting</title>\n\
  </head>\n<body>\n<h1> Hello, World! </h1> <%-- title as template text --%>\n<%--\
  \ timestamp as embedded expression --%>\n<ul> <li>current time: <%= new java.util.Date()\
  \ %> </li></ul>\n</body>\n</html>\n```\n\n如果你运行前面的示例，你将得到与执行示例 servlet 时完全相同的消息。现在，让我们回顾一下前面代码块中最重要的部分。首先，如你可能注意到的那样，放在\
  \ <%-- 和 --%> 之间的所有内容都会被容器忽略。你可以用它来描述代码中正在发生的事情或注释掉代码的一部分。鉴于 JSP 注释也是 JSP 元素，它们永远不会到达浏览器。其次，与其拼接字符串并使用纯\
  \ I/O 将其写入响应，前面的代码使用了一个脚本元素，通过它你可以在 JSP 中添加 Java 代码。当你只想添加 Java 代码而不将结果写入响应时，使用\
  \ <% 和 %>。当结果需要添加到响应中时，使用 <%= 和 %>。因此，我们使用了后者将时间戳写入响应。下一个示例展示了另一种实现相同功能的方法，但这次使用了更多\
  \ JSP 元素和 scriptlet。请注意，页面指令也用于导入 java 类（和包），如以下示例所示。此外，当导入多个类时，完全限定名称的列表必须用逗号分隔。向页面指令添加导入指令后，你就不必在\
  \ scriptlet 中使用完全限定的类名。\n\n> 你也可以在 <% 和 %> 对内打印内容。为此，你必须使用 out 对象。该对象始终隐式存在。例如，你可以这样打印\
  \ Hello, World! 消息：<% out.println(\"Hello, World!\") %>。不过值得一提的是，在 scriptlet 中使用\
  \ out.println() 是一种不良做法。只要可能，请改用表达式（<%= 和 %>）。\n\n```\n<%@ page language=\"java\"\
  \ contentType=\"text/html; charset=ISO-8859-1\" pageEncoding=\"ISO-8859-1\" import=\"\
  java.util.Date\" %>\n<!DOCTYPE html PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\
  \ \"http://www.w3.org/TR/html4/loose.dtd\">\n<html>\n<head>\n<meta http-equiv=\"\
  Content-Type\" content=\"text/html; charset=ISO-8859-1\">\n<title>Warm Greeting</title>\n\
  </head>\n<body>\n<h1> <% out.println(\"Hello, World!\"); %> </h1>\n<% Date date\
  \ = new Date(); %>\n<ul> <li>current time: <%= date %> </li></ul>\n</body>\n</html>\n\
  ```\n\n> 切勿在表达式末尾加上分号。<%= date %> 是正确的，<%= date; %> 则不是。\n\n## 生成 WAR 文件\n\nJava\
  \ Web 应用程序以 WAR（Web application Archive）文件形式分发。WAR 文件是一个压缩文件，它保留了 Web 应用程序的结构（除了\
  \ Web 应用程序上下文目录，即应用程序的顶级目录），并包含一个名为 META-INF 的额外文件夹。这些压缩文件具有 .war 扩展名。META-INF 文件夹包含\
  \ WAR 文件中文件相关的元数据。该文件夹中保存的一个重要文件是 MANIFEST.MF 文件。除了其他信息外，此类特殊文件还包含有关打包在 WAR 文件中的文件的信息。\n\
  \n当 WAR 文件被部署时，它们会被容器解包，从而创建以下图所示的结构。顶级目录的名称取决于所使用的容器。例如，Tomcat 会将顶级目录命名为 WAR 文件的名称。因此，例如，Tomcat\
  \ 在解包 `deployedapp.war` 文件时将创建以下结构。如你所见，WAR 文件的内部结构与 Eclipse 动态 Web 项目的结构几乎相同：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_179_0.png)\n\n要从项目创建 WAR 文件，请右键单击项目并选择\
  \ **导出**。选择如下图所示的 WAR 文件选项，通过 **浏览...** 按钮指定目标目录，然后单击 **完成**。现在你可以通过将其放置在 `webapp`\
  \ 目录下并重新启动容器，将你的 WAR 文件部署到 Tomcat。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_179_1.png)\n\
  \n## 总结\n\n在本章中，我们介绍了用于开发 Java Web 应用程序的主要技术概述。我们还强调了这些技术的一些优点。本章还介绍了这些技术的一个重要元素：容器。特别是，本章中使用的容器是\
  \ Tomcat。你看到了如何设置 Tomcat，以及如何执行一些基本操作，如启动和停止它；既可以通过命令行，也可以通过 Eclipse。\n\n你了解到，要使\
  \ Eclipse 支持 Web 应用程序的开发，你需要安装一组统称为 Eclipse WTP 的插件。事实上，正如你所见，你不需要安装整套插件，本章解释了你必须安装的插件。\n\
  \n在了解了 servlet 的生命周期以及容器在此上下文中的作用后，使用已安装的插件集，我们回顾了基本 servlet 的创建以及一个更复杂的示例。在此过程中，我们解释了\
  \ `doGet` 和 `doPost` 之间的区别。因此，你现在知道何时重写它们。使用新 servlet API 的优点之一是使用注解。用 `@WebServlet`\
  \ 注解 servlet 消除了编辑 `web.xml` 文件的需要。此外，你还了解到 servlet 可以通过 Eclipse 的内部浏览器进行测试：你只需要正确配置\
  \ servlet 容器。你还学习了如何使用 Eclipse WTP 创建 JSP。最后，本章展示了如何从 Eclipse Web 项目创建 WAR 文件。从下一章开始，我们将深入探讨更高级的主题。更具体地说，下一章将介绍使用\
  \ Eclipse 开发插件。\n\n\n"
- "# 8 Eclipse 开发\n\n在本书的前几章中，我们已经看到了如何以各种方式使用 Eclipse，例如为 Java 开发代码、使用 Git 管理项目以及开发\
  \ Web 应用程序。在本章中，我们将转换重点，学习如何使用 Eclipse 为 Eclipse 开发代码。由于 Eclipse 是用 Java 开发的，因此对该语言有良好的了解是本章的先决条件。\n\
  \nEclipse 能够成为最受欢迎的 IDE 之一的一个特性是其可插拔架构。它包含一个运行时平台，提供 IDE 运行所需的必要基础设施，例如主要的 UI 元素、已加载插件的注册表、日志基础设施等，而基本上所有其他内容都是插件。你可以通过查看机器上的\
  \ Eclipse 文件夹来检查这一点。在 plugins 文件夹内有许多 JAR 文件和文件夹，每个都与一个插件相关。插件可以打包在简单的文件夹中，也可以打包在\
  \ JAR 文件中（这只是一个重命名的 zip 文件）。这些插件中的每一个都为 Eclipse 的某个方面做出贡献。例如 org.eclipse.jdt.* 提供的就是\
  \ Java 开发工具，如 Java 调试、Java 编辑器和 Java 项目类型。\n\n在 Eclipse 的主文件夹中，你还会找到一个名为 features\
  \ 的文件夹。功能基本上是一组插件。你可以使用功能将只有在捆绑在一起时才有意义的插件分组。查看 features/org.eclipse.jdt_<version>\
  \ 文件夹内的 feature.xml 文件。它包含此功能包含的所有插件的列表。\n\n功能和插件之间可以存在依赖关系。例如，提供插件开发工具的 org.eclipse.pde\
  \ 功能依赖于 org.eclipse.jdt 功能，因为所有 Eclipse 插件都是用 Java 语言编写的。\n\n你可以通过导航到 **Help | About\
  \ Eclipse SDK** 并在出现的窗口中点击 **Installation Details** 来查看已安装在你的 Eclipse 实例中的所有功能和插件的列表。**Installed\
  \ Software** 选项卡列出了所有已安装的功能组，而 **Installation History** 选项卡显示每个额外插件或功能安装的时间。**Features**\
  \ 和 **Plug-ins** 选项卡包含有关插件和功能提供者、版本和 ID 的信息。你还可以通过点击 **Legal Info** 按钮，或在 **Features**\
  \ 选项卡中的 **License** 按钮来检查插件是在何种许可下发布的。\n\n到本章结束时，你将能够做到以下事项：\n\n- 创建一个新的插件项目\n-\
  \ 运行和调试插件项目\n- 声明并实现扩展点\n- 为 Eclipse 工具栏和菜单创建自定义条目\n- 使用 Plugin Spy 功能\n- 创建新的 Eclipse\
  \ 视图\n- 导出你的插件\n\n### 创建你的第一个插件\n\n由于 Eclipse 中包含的大多数功能都是由插件提供的，因此开始学习 Eclipse 开发的一个好方法是学习如何创建自己的插件。最好的做法是使用\
  \ Eclipse 的新建插件项目向导。选择 **File | New | Other** 以查看向导列表。选择 **Plug-in Project** 选项并点击\
  \ **Next**。向导的第一个窗口包含基本项目配置。我们默认选项就足够了。为你的项目取一个好名字，例如 \"HelloWorldPlugin\"，然后点击\
  \ **Next**。\n\n下一页包含更多插件属性。同样，默认选项即可，所以直接点击 **Next**。下一页允许你从模板构建插件，而不是从头开始。让我们选择\
  \ **Hello, World** 模板，它会创建插件的基本文件结构并在工具栏中添加一个按钮，按下时显示 **Hello, Eclipse World**。点击\
  \ **Finish**。系统会询问你是否要打开插件开发透视图。此透视图与 Java 透视图非常相似，只是包含了一些特定于插件开发的视图，例如插件视图。\n\n\
  在尝试运行此项目之前，让我们先看看生成的文件结构。以下截图显示了 **HelloWorldPlugin** 项目的 Package Explorer 视图：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_183_0.png)\n\nMANIFEST.MF 文件包含有关插件的基本信息。它包含插件的名称和版本，以及插件提供的内容和依赖的内容等信息。该文件的格式和提供的内容由\
  \ OSGi 规范决定。\n\nplugin.xml 文件是插件基本文件结构中的另一个重要文件。它包含有关插件提供哪些扩展点以及实现哪些扩展点的信息。扩展点在一般意义上是插件之间“对话”的机制。我们将在本章中更详细地讨论扩展点。\n\
  \nbuild.properties 文件包含有关哪些文件夹包含源文件，以及哪些文件应包含在二进制和源构建中的信息。\n\n通过双击这三个文件中的任何一个，Eclipse\
  \ 将打开插件清单编辑器，而不是使用纯文本编辑器显示文件内容。此编辑器可用于管理插件的各个方面：依赖项、扩展点、导出的包等。编辑器在幕后会编辑 MANIFEST.MF、build.properties\
  \ 和 plugin.xml 文件，以添加你通过其表单提供的信息。一些 Eclipse 开发指南更喜欢通过展示如何直接编辑这些文件来介绍插件管理。然而，本章将始终使用编辑器的表单，因为它们对新手\
  \ Eclipse 开发者更友好。\n\n以下截图显示了插件清单编辑器的外观：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_184_0.png)\n\
  \n正如你所见，编辑器的下部有水平标签页。每个标签页允许你控制插件的不同方面。第一个标签页包含有关插件的基本信息，以及指向其他标签页和插件开发向导的链接。现在例如看看\
  \ Dependencies 标签页。我们可以看到我们的插件依赖于 org.eclipse.ui 和 org.eclipse.runtime，因为它们在必需插件列表中。我们将在使用它们时描述每个标签页。最后三个标签页允许你查看三个插件配置文件中的实际内容。\n\
  \nsrc 文件夹包含两个源文件：Activator.java 和 SampleAction.java，后者是按下按钮时实际显示消息的类。\n\n激活器类管理插件在\
  \ Eclipse 平台中的生命周期。它包含在插件启动或停止时执行的代码，以及其他与生命周期相关的操作。向导生成的 Activator.java 类包含我们所需的一切。\n\
  \n### 运行和调试插件项目\n\n运行或调试插件项目与我们对 Java 项目的操作没有区别。只需点击工具栏中的绿色播放按钮即可运行我们的 **Hello World**\
  \ 插件。你会看到一个新的 Eclipse 实例将启动。默认情况下，此 Eclipse 实例包含开发环境中安装的所有插件，以及工作区中打开的每个插件项目。此测试实例称为\
  \ Runtime Workbench。\n\n在你的运行时工作台的工具栏中查找 Eclipse 符号。点击它，你将被 **Hello, Eclipse World**\
  \ 消息迎接。\n\n调试的工作方式也一样。通过点击控制台中的红色方块按钮或关闭 Eclipse 窗口来停止当前运行时工作台。在 `SampleAction`\
  \ 类中放置一个断点（第 59 行），然后点击工具栏中的 **Debug** 按钮（带绿色虫子的那个）。现在，在运行时工作台中点击我们的 **Hello World**\
  \ 按钮。执行将在所选行处暂停。*第 3 章，单元测试与 JUnit 调试* 中关于调试所讨论的一切内容在这里也同样适用。\n\n### 运行和调试配置\n\n\
  Eclipse 为运行和调试插件应用程序提供了进一步的配置。在顶部菜单中选择 **Run | Run Configurations** 以更详细地查看它们。\n\
  \n在 **Main** 选项卡中，你可以选择运行时工作台的工作区位置。那里将存储你在测试和调试应用程序时创建的项目。你可以通过点击工作区位置下方的 **Clear**\
  \ 选项来选择在启动运行时工作台前清除工作区。**Main** 选项卡中的 **Program to Run** 部分允许你选择运行不同的产品或应用程序，而 **Java\
  \ Runtime Environment** 允许你为运行时环境使用不同的 JRE。如果你在测试插件与不同 JRE 的兼容性，这会很有用。\n\n**Arguments**\
  \ 选项卡允许你在启动运行时工作台时为 Eclipse 和 JVM 选择参数。\n\n\n\n\n## Eclipse 开发\n\n插件选项卡允许您选择将在运行时工作台中加载的插件，既可以来自您的\
  \ Workspace，也可以来自您的开发环境。这对于在无需关闭它们的情况下单独测试工作区项目非常有用，或者可以从开发环境中移除无关插件以节省机器资源。以下截图显示了\
  \ **运行配置** 菜单的插件选项卡：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_186_0.png)\n\n\
  在 **配置** 选项卡中，您可以设置要用于运行时工作台实例的 `config.ini` 文件，以及修改配置区域。**跟踪** 选项卡允许您为每个插件启用跟踪。跟踪是一个有趣的功能，允许您在运行时打开或关闭调试消息。这在您为安装在客户端环境中的基于\
  \ Eclipse 的应用程序提供支持时可能特别有用。您可以简单地要求客户端为您的插件启用跟踪，而无需向其发送启用了调试消息的插件调试版本。本书不会涵盖跟踪。**环境**\
  \ 和 **通用** 选项卡与常规 Java 应用程序中的完全相同。\n\n## 扩展点\n\n扩展点是 Eclipse 用于允许插件扩展和修改其他插件行为的机制。扩展点概念的主要目标是提供松耦合的架构，公开一些可由其他插件实现的接口。扩展点及其实现均在\
  \ plugin.xml 文件中声明。\n\nEclipse 平台提供了许多这些扩展点，以便插件能够为 IDE 的各个元素做出贡献。我们将在本章中查看其中一些扩展点，但它们的完整列表可以在\
  \ Eclipse 文档中找到，该文档位于 http://help.eclipse.org/indigo/topic/org.eclipse.platform.doc.isv/reference/extension-points/index.html。\n\
  \n我们的 Hello World 插件实现了其中一个扩展点。让我们通过在插件清单编辑器中打开扩展选项卡来看看它是什么样子的。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_187_0.png)\n\
  \n扩展选项卡显示我们，为了向工具栏添加按钮或向菜单添加新条目，我们的插件实现了一个名为 org.eclipse.ui.actionSets 的扩展点。您可以通过在扩展列表中选择它并单击“显示扩展点描述”来获取有关此扩展点的更多信息。\n\
  \n### 声明扩展点\n\n目前，我们的 HelloWorldPlugin 项目仅实现了由其他插件提供的扩展点，但本身并未声明任何扩展点。让我们通过扩展我们的\
  \ Hello World 插件来声明一个扩展点，从而学习如何操作。我们将创建一个扩展点，允许其他插件提供单击工具栏按钮时显示的消息。\n\n要创建新的扩展点，请在插件清单编辑器中选择\
  \ **扩展点** 选项卡，然后单击其中的 **添加** 按钮。系统会提示您提供三个属性：**ID**、**Name** 和 **Schema**。ID 是扩展点的内部唯一标识符。为了保证其唯一性，您可能希望使用反向域名表示法来创建\
  \ ID，其中包含扩展点所属的从不具体到具体的域。让我们使用 `com.packt.messageProvider` 作为 ID。当您填写此属性时，**Schema**\
  \ 会自动填充相同的内容，后跟 `.xsd` 扩展名。**点名称** 属性是扩展点的人类可读名称。这里让我们使用 `Message provider`。完成后，单击\
  \ **完成**。将打开一个名为模式编辑器的新编辑器。以下截图显示了模式编辑器的示例：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_188_0.png)\n\
  \n模式是描述扩展点的 XML 文件。这些文件以 `.xsd` 扩展名标识，并且与我们对 `plugin.xml`、`build.properties` 和 `MANIFEST.MF`\
  \ 文件所做的操作一样，我们将使用编辑器向其添加内容，而不是直接编辑。模式编辑器包含三个水平选项卡：**概述**、**定义** 和 **源**。\n\n第一个水平选项卡包含插件的基本描述。它还允许您为扩展点添加文档，该文档将直接显示在\
  \ Eclipse 界面中，使其他开发人员能够轻松找到有关如何实现扩展点的信息。还记得我们在 **扩展** 选项卡中看到的 `org.eclipse.ui.actionSets`\
  \ 描述吗？它就来自这里。彻底描述您的扩展点并提供使用示例和 API 信息非常重要。\n\n现在，我们必须描述扩展点包含的内容，即其他插件可以向我们的插件提供什么。为此，我们必须向扩展点添加新元素。打开模式编辑器的\
  \ **定义** 选项卡以查看扩展点的元素列表。\n\n单击 **新建元素** 并将新元素的名称更改为 `hello_message`。您可以为该元素添加简短描述。现在选择该元素并单击\
  \ **新建属性** 为其添加一个属性。将它重命名为 `value`。属性的其他属性允许您选择必须提供的类型（字符串、布尔值、资源、Java 类或标识符）。在我们的例子中，我们希望扩展提供一个字符串。您的\
  \ **定义** 选项卡应如下所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_189_0.png)\n\n一旦元素被定义，我们必须声明它如何组成扩展点。如果我们有另一种类型的消息（例如\
  \ goodbye_message），我们可以要求扩展点实现具有一个或多个每个。元素组合是通过向“extension”元素添加选择和序列来实现的。选择是“或”组合，而序列是“与”组合。这些元素可以一起使用以创建更复杂的组合。\n\
  \n由于我们每个扩展点实现只需要一个 `hello_message` 元素，让我们通过选择它并单击 **新建序列** 向扩展元素添加一个新序列。将 **最小出现次数**\
  \ 和 **最大出现次数** 都配置为 1。现在，右键单击 **序列** 条目，然后选择 new | `hello_message` 以声明我们需要一个 `hello_message`\
  \ 元素实现。\n\n选择的工作方式非常相似。向扩展元素添加一个选择并向该选择添加元素。如果选择中的任何元素得到满足，则扩展点已成功实现。\n\n### 提供接口\n\
  \n扩展点最常用的机制之一是提供可由其他插件实现的接口。为了举例说明其工作原理，让我们稍微修改一下扩展点：不是要求其他插件提供字符串，而是要求提供实现 IMessageProvider\
  \ 接口的类。\n\n让我们首先在我们的插件中创建接口。接口必须放在将被导出的包内，以便其他插件可以实现它，因此请确保您创建一个新包来存储接口。在项目的 src\
  \ 文件夹中创建一个名为 IMessageProvider.java 的新接口，其内容如下：\n\n```\npublic interface IMessageProvider\
  \ {\n\n    public String getHelloMessage();\n\n}\n```\n\n如您所见，接口仅要求实现一个返回字符串的 getHelloMessage()\
  \ 方法。\n\n现在让我们修改扩展点的模式，以要求接口实现而不是字符串。首先，“value”这个名称现在意义不大了，让我们将其更改为 message_provider。现在将\
  \ Type 属性从 string 更改为 Java。将出现两个新属性：Extends 和 Implements。由于我们提供的是接口，让我们填写 Implements\
  \ 字段（请记住类是被扩展的，而接口是被实现的）。单击浏览按钮并选择我们的 IMessageProvider。请记住，您可以使用过滤器轻松找到它。单击确定。\n\
  \n以下截图显示了我们的扩展点最终的样子：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_190_0.png)\n\n\
  \n\n插件默认不会外部化源包。这意味着接口对其他插件不可见，从而无法被实现。要导出包含接口的包，我们将切换到插件清单编辑器的 Runtime 选项卡。在 Exported\
  \ Packages 部分下点击 Add 按钮，选择包含接口的包，然后点击 OK。\n\n## 使用扩展点实现的代码\n\n一旦声明了扩展点，我们插件中的代码必须进行修改，以便利用其他插件通过它提供的功能。在我们的示例插件中，这意味着将硬编码的\
  \ Hello World 消息替换为由扩展点实现提供的消息。\n\n让我们看看代码中 Hello World 消息实际显示的位置。以下代码片段位于 SampleAction\
  \ 类中，该类由 Hello World 插件项目模板生成：\n\n```\npublic void run(IAction action) {\n    MessageDialog.openInformation(\n\
  \        window.getShell(),\n        \"HelloWorldPlugin\",\n        \"Hello, Eclipse\
  \ world\");\n}\n```\n\n这里是我们的工作位置。利用来自扩展点的内容的首要步骤是验证是否存在可用的扩展，如果存在多个，则插件应使用哪一个扩展。请记住，扩展点的整个思想是解耦插件，因此如果你的扩展点没有实现，你的插件不应崩溃。\n\
  \nEclipse 平台提供了可用扩展点实现的注册表。一旦获得它，你的代码必须验证特定扩展点的实现，然后查找所需的元素。\n\n这就是 run 方法应如何重构以利用来自扩展点的消息的示例：\n\
  \n```\npublic void run(IAction action) {\n    String helloMessage = null;\n    IExtensionRegistry\
  \ extensionRegistry = Platform.getExtensionRegistry();\n    IConfigurationElement[]\
  \ elements = extensionRegistry.getConfigurationElementsFor(\"com.packt.messageProvider\"\
  );\n    try{\n        for (IConfigurationElement element : elements) {\n       \
  \     Object object = element.createExecutableExtension(\"message_provider\");\n\
  \            if (object instanceof IMessageProvider){\n                IMessageProvider\
  \ messageProvider = (IMessageProvider)object;\n                helloMessage = messageProvider.getHelloMessage();\n\
  \            }\n        }\n    } catch (CoreException e){\n        e.printStackTrace();\n\
  \    }\n\n    if(helloMessage == null){\n        helloMessage = \"No providers found\"\
  ;\n    }\n\n    System.out.println(helloMessage);\n    MessageDialog.openInformation(\n\
  \        window.getShell(),\n        \"HelloWorldPlugin\",\n        helloMessage);\n\
  }\n```\n\n在前面的代码中，我们使用 Platform 类的 getExtensionRegistry 静态方法获取一个 IExtensionRegistry\
  \ 对象，该对象包含平台中所有可用扩展点的信息。然后我们使用此对象获取 com.packt.messageProvider 扩展点可用的所有配置元素。请注意，如果存在多个扩展，使用哪个扩展并没有真正的问题，它将简单地遍历所有可用的配置元素并将其分配给\
  \ helloMessage 变量。如果未找到扩展，则存在回退机制，我们会打印出消息“No providers found”。因此，无论扩展点的实现数量如何，我们的插件代码都能正常执行。\n\
  \n## 实现扩展点\n\n现在我们已经创建了扩展点，让我们创建一个实现它的新插件。首先创建一个名为 MessageProvider 的新插件项目。这次我们不想使用任何模板，因此在新建插件项目向导的\
  \ Templates 页面中取消选中 Create a plugin using one of the templates 复选框。\n\n在开始使用扩展点之前，我们必须声明\
  \ MessageProvider 插件依赖于 HelloWorldPlugin，如果平台中没有 HelloWorldPlugin，就没有扩展点可以实现，MessageProvider\
  \ 插件也就毫无意义。要声明依赖关系，让我们打开 MessageProvider 项目的插件清单编辑器并切换到 Dependencies 选项卡。在 Required\
  \ Plug-ins 部分点击 Add 按钮并输入 HelloWorldPlugin。以下截图显示了 Dependencies 选项卡应有的外观：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_193_0.png)\n\
  \n现在我们必须声明我们的插件包含 messageProvider 扩展点的实现。切换到 Extensions 选项卡，然后点击 Add 按钮。选择 com.packt.messageProvider\
  \ 扩展点。\n\n下一步是实际实现 messageProvider 扩展点。如你所见，com.packt.messageProvider 扩展已包含一个 hello_message\
  \ 元素。Extension Element Details 面板向我们展示了我们已知的东西。我们需要一个实现 IMessageProvider 的类来实现此扩展点。\n\
  \n你可以通过在 Extension Elements Details 面板中简单点击 message_provider* 链接来创建该类。现在将以下代码复制到其中：\n\
  \n```\nimport helloworldplugin.IMessageProvider;\n\npublic class MyMessageProvider\
  \ implements IMessageProvider {\n\n    @Override\n    public String getHelloMessage()\
  \ {\n        return \"Hello world from MessageProvider\";\n    }\n\n}\n```\n\n如你所见，这是一个非常基础的实现。我们现在准备测试我们的扩展点及其实现。选择我们刚刚创建的两个项目之一，然后选择\
  \ Run | Run as | Eclipse Application。当我们点击按钮时，来自扩展点的消息会显示出来，如以下截图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_194_0.png)\n\
  \n## 为平台的菜单和工具栏贡献\n\n我们在用于说明如何声明和实现扩展点的示例中，创建了一个向 Eclipse 工具栏添加按钮的插件。现在，让我们更仔细地看看这个按钮是如何添加在那里的，以及我们如何向\
  \ Eclipse 界面的其他部分添加元素。\n\n## 操作与命令\n\n我们首先应该知道的是，在 Eclipse UI 中向菜单贡献有两种不同方式：操作和命令。我们在前一个示例中使用的操作方式乍一看可能更简单，但简单是有代价的；正如你所见，逻辑和界面紧密相连，如果你想添加例如执行与工具栏按钮相同操作的右键菜单项，就可能导致代码重复。如你所知，代码重复是项目的噩梦，应不惜一切代价避免。因此，相对于命令，不建议使用操作。\n\
  \nCommand 框架通过完全解耦处理与界面来解决此问题。它需要为三个扩展点提供实现：org.eclipse.ui.menus、org.eclipse.ui.commands\
  \ 和 org.eclipse.ui.handlers。menus 扩展点负责向平台添加界面元素。commands 扩展点声明命令，这些命令由处理器实现。\n\n\
  为了展示如何使用 commands 框架，让我们实现我们刚刚实现的同一个 hello world 工具栏按钮，但现在使用命令而不是操作。创建一个新的 HelloWorldCommand\
  \ 插件项目，开始时不使用任何模板。\n\n## org.eclipse.ui.menus\n\n正如我们已经讨论过的，这个扩展点用于向 Eclipse 添加用户界面贡献，并取代了操作框架中的多个扩展点，例如\
  \ org.eclipse.ui.ActionSets、org.eclipse.ui.EditorActions 和 org.eclipse.ui.popupMenus。\n\
  \n添加此扩展点的实现以及具有以下参数的 menuContribution 元素：\n\n- **locationURI**: toolbar:org.eclipse.ui.workbench.file?after=additions\n\
  - **allPopups**: false\n\nLocationURI 指定贡献将在 Eclipse UI 中的何处添加。在这种情况下，它将出现在 Print\
  \ 按钮的正旁边。在下一节中，我们将学习如何使用插件间谍发现 locationURIs。\n\n如果 allPopups 布尔值设置为 false，则此菜单贡献只会添加到包含名为\
  \ \"additions\" 的标记的上下文菜单中。\n\n\n\n## org.eclipse.ui.commands\n\n命令扩展点声明将与不同菜单项绑定的命令。在命令扩展点添加一个扩展，并在其中添加一个\
  \ command 元素，具有以下属性：\n\n- **id:** `com.packt.helloworldcommand.command`\n- **name:**\
  \ `helloWorldCommand`\n\n## org.eclipse.ui.handlers\n\n这里是命令实际实现的地方。这是通过创建一个扩展 org.eclipse.core.commands.AbstractHandler\
  \ 的类来实现的。因此，在为 handlers 扩展点添加实现之前，让我们创建一个名为 DefaultHelloWorldCommandHandler 的类，代码如下：\n\
  \n```\npackage com.packt.helloworldcommand;\n\nimport org.eclipse.core.commands.AbstractHandler;\n\
  import org.eclipse.core.commands.ExecutionEvent;\nimport org.eclipse.core.commands.ExecutionException;\n\
  import org.eclipse.jface.dialogs.MessageDialog;\nimport org.eclipse.swt.widgets.Shell;\n\
  import org.eclipse.ui.PlatformUI;\n\npublic class DefaultHelloWorldCommandHandler\
  \ extends AbstractHandler {\n\n    @Override\n    public Object execute(ExecutionEvent\
  \ event) throws\nExecutionException {\n        Shell shell = PlatformUI.getWorkbench().\n\
  getActiveWorkbenchWindow().getShell();\n        MessageDialog.openInformation(shell,\
  \ \"Hello\", \"Hello World!\");\n        return null;\n    }\n\n}\n```\n\n在前面的代码中，你唯一需要实现的方法是\
  \ execute，显然这是在命令执行时会被调用的方法。\n\n现在我们已经实现了处理器，让我们在 Extensions 选项卡中引用它。为 org.eclipse.ui.handlers\
  \ 创建一个实现，并添加一个包含以下属性的 handler 元素：\n\n- **commandId:** `com.packt.helloworldcommand.command`\n\
  - **class:** `com.packt.helloworldcommand.DefaultHelloWorldCommandHandler`\n\n我们已经为三个扩展点实现了实现，但请注意，菜单项与命令或处理器之间没有任何关联。这是通过在\
  \ `org.eclipse.ui.menus` 扩展点的 `menuContribution` 元素中添加一个 \"command\" 元素来实现的。使用以下参数创建一个：\n\
  \n- **commandId:** `com.packt.helloworldcommand.command`\n- **label:** `click me`\n\
  \n你的 **Extensions** 选项卡应如下图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_197_0.png)\n\
  \n现在让我们通过运行它来看看我们的插件的行为。你应该会在 **Print** 按钮旁边看到一个写有 **click me** 的按钮。点击它，你会收到另一个\
  \ hello world 消息。如果你想在工具栏中使用图标而不是文本，请导航到 `org.eclipse.ui.menus` | `menuContribution`\
  \ | `command` 元素进行编辑并更改 icon 参数。\n\n由于命令框架的全部意义在于轻松地将同一命令添加到多个 UI 贡献中，让我们通过添加一个在右键单击时弹出的菜单项来测试这种灵活性。我们真正需要的只是在\
  \ `org.eclipse.ui.menus` 中再添加一个 `menuContribution` 元素。因此，请继续创建一个新的，包含 command 子元素，仅将\
  \ `locationURI` 属性更改为 `popup:org.eclipse.ui.popup.any?after=additions`。\n\n再次运行插件，并在运行时工作台\
  \ UI 中右键单击 Package Explorer。你应该会看到如下条目：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_198_0.png)\n\
  \n点击它与点击工具栏按钮的结果相同。\n\n## Restricting and disabling contributions\n\n你可能已经注意到，右键菜单中的\
  \ click me 条目并未限制在 Package Explorer 中。右键单击其他视图，例如 Java Editor 或 Outline，你会发现该条目无处不在。这可能不是期望的行为；大多数菜单贡献仅适用于某些上下文，在不适用的地方保留条目的可见或启用状态只会给\
  \ Eclipse 界面增加杂乱。\n\n幸运的是，有一种简单的方法可以隐藏菜单贡献。`menuContribution` 下的 `command` 元素有一个可选元素称为\
  \ `visibleWhen`。顾名思义，它允许你确定在什么条件下该命令将被启用。\n\n让我们将右键菜单项的可见性限制为仅在文本编辑器中出现。有两种方法可以做到这一点。一种是在为此命令注册的\
  \ AbstractHandler 扩展（本例中为 DefaultHelloWorldCommandHandler）中实现 isEnabled() 方法。方法执行返回的值将决定贡献是否可见。另一种方法是通过向\
  \ visibleWhen 元素添加子元素来构建一个表达式，以确定元素的可见性。在本示例中，我们将采用第二种选项。\n\n首先添加 visibleWhen 元素。该元素中的\
  \ checkEnabled 属性决定使用哪种限制可见性的方法。如果为 true，则会评估 isEnabled() 方法，并且 visibleWhen 的任何子元素将被忽略。如果为\
  \ false，则会使用子元素。将此属性设置为 false。\n\nvisibleWhen 元素有许多类型的有效子元素。with 元素用于评估变量。这些变量由扩展点和\
  \ Eclipse 框架提供。Eclipse 提供的变量的完整列表可以在此链接的 Eclipse wiki 页面上找到：http://wiki.eclipse.org/Command_Core_Expressions#Variables_and_the_Command_Framework。此类变量的一些示例包括\
  \ activeEditor，其中包含当前活动的编辑器，activeWorkbenchWindow，其中包含当前活动的工作台窗口，以及 activePart，其中包含当前活动的部件。部件是工作台内的视觉组件，可以是视图或编辑器。由于我们希望我们的贡献仅在编辑器中可见，我们将评估\
  \ activePart 变量。因此，请继续添加一个 with 元素，并将其变量值更改为 activePart。\n\n我们现在可以在 with 元素下添加其他元素来评估\
  \ activePart 变量。activePart 包含工作台中当前活动部件的实例，因此要验证它是否为文本编辑器，我们必须检查该对象实例化的类。这是通过 instanceof\
  \ 元素完成的。让我们添加它并将 org.eclipse.ui.texteditor.AbstractTextEditor 提供给 value 参数。但是，要使其工作，我们必须能够访问属于\
  \ org.eclipse.ui.editors 插件的 org.eclipse.ui.texteditor 包。切换到 Dependencies 选项卡并将插件添加到依赖项列表中。现在切换回\
  \ Extensions 选项卡，你应该能够通过单击 Browse 按钮找到 AbstractTextEditor 类。\n\n请注意，visibleWhen\
  \ 还有许多其他子元素，例如 \"and\" 和 \"or\"，它们允许你组合不同的条件。systemTest 元素可用于测试系统属性，例如 osgi.os，其中包含\
  \ Eclipse 运行的操作系统（Win32、Linux、AIX、Solaris 等），osgi.ws，其中包含当前窗口系统（Win32、Motif、GTK\
  \ 等）以及 osgi.arch，其中包含平台运行的架构（x86、x86_64、PPC、SPARC 等）。\n\n下面的屏幕截图显示了你的 org.eclipse.ui.menus\
  \ 扩展应如何显示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_200_0.png)\n\n现在，运行你的项目，并尝试在运行时工作台视图上右键单击。只有文本编辑器会显示\
  \ click me 条目。\n\n菜单项也可以被禁用而不是隐藏。以文本编辑器中的 copy 条目为例；当没有选择文本时，它为灰色且无法点击，尽管在选择文本时它表现正常。让我们将相同的行为添加到我们的菜单项中以举例说明如何操作。\n\
  \n当当前情况没有注册处理器时，条目将被禁用。由于我们尚未对处理器进行任何条件限制，因此它始终处于启用状态。与 menuContribution 的可见性类似，限制处理程序激活有两种方法。你可以通过向\
  \ handler 元素添加 enabledWhen 子元素并使用与 visibleWhen 中相同的子元素（with、and、or、instanceof 等）来完成，组装一个表达式以确定处理器是否处于活动状态。你也可以选择实现\
  \ isEnabled()，根据情况返回 true 或 false。由于我们已经展示了如何在 Extensions 选项卡中使用子元素来完成此操作的示例，这次让我们重写\
  \ isEnabled() 方法。\n\n以下代码是重写 isEnabled() 以将处理器限制为在文本编辑器中选择代码时的示例：\n\n```\n@Override\n\
  public boolean isEnabled() {\n    boolean enabled = true;\n    IWorkbenchPart activePart\
  \ = PlatformUI.getWorkbench().\ngetActiveWorkbenchWindow().getPartService().getActivePart();\n\
  \    if(activePart instanceof IEditorPart){\n        ISelection selection = PlatformUI.getWorkbench().\n\
  getActiveWorkbenchWindow().getSelectionService().getSelection();\n        if(selection\
  \ instanceof ITextSelection){\n```\n\n\n\n```\nif (((ITextSelection) selection).getText().\n\
  \    isEmpty()){\n        enabled = false;\n    }\n}\n}\n    return enabled;\n}\n\
  ```\n\n`PlatformUI` 类是 Eclipse 用户界面的入口。我们使用其静态方法 `getWorkbench()`，然后从 workbench\
  \ 对象使用 `getActiveWorkbenchWindow()` 方法来获取对 `PartService` 的访问，从而可以获取 workbench 中当前活动的\
  \ part。如果 `activePart` 变量恰好是 `IEditorPart` 的实例，我们获取其选择服务，该服务可让我们访问编辑器中当前选中的内容。如果选择恰好是\
  \ `ITextSelection` 的实例，我们验证其内容。如果选择为空，则 enabled 值设为 false。注意 `ITextSelection` 属于\
  \ `org.eclipse.jface.text` 插件，因此如果在 **Dependencies** 选项卡的 required plugins 部分未指定此插件，此代码将无法工作。\n\
  \nAdd this code to the `DefaultHelloWorldCommand` class and run the project. The\
  \ following screenshot shows the popup menu that you should get if you right-click\
  \ your Java editor with no code selected:\n\n添加此代码到 `DefaultHelloWorldCommand` 类并运行项目。以下截图显示了当你在未选中任何代码的情况下右键点击\
  \ Java 编辑器时应得到的弹出菜单：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_201_0.png)\n\n\
  ## The Plugin Spy feature\n\n## 插件 Spy 功能\n\nYou might have wondered where did the\
  \ locationURIs we used for our contributions came from. As we promised, we'll now\
  \ show how to use the Plugin Spy, a very useful feature for Eclipse developers,\
  \ to find locationURIs and much more.\n\n你可能曾想过我们用于贡献的 locationURIs 是从哪里来的。如我们所承诺的，现在我们将展示如何使用\
  \ Plugin Spy，这是一个对 Eclipse 开发者非常有用的功能，用于查找 locationURIs 以及更多内容。\n\nThis feature\
  \ allows you to obtain information from the UI elements of your workbench straight\
  \ from the Eclipse interface, thus making it easy to find out from which plugin\
  \ does that element come, its class, the current selection's type, among other useful\
  \ information. The Plugin spy has two modes: the Plugin Selection Spy and the Plugin\
  \ Menu Spy. As the names imply, the Selection Spy allows you to get information\
  \ regarding the currently selected element and its containing part, but the Menu\
  \ Spy provides information about menu contributions.\n\n此功能允许你直接从 Eclipse 界面获取 workbench\
  \ UI 元素的信息，从而轻松查明该元素来自哪个插件、其类、当前选择的类型等其他有用信息。Plugin spy 有两种模式：Plugin Selection Spy\
  \ 和 Plugin Menu Spy。顾名思义，Selection Spy 允许你获取有关当前选中元素及其包含 part 的信息，而 Menu Spy 则提供有关菜单贡献的信息。\n\
  \nTo enable the Selection Spy, press Alt + Shift + F1. You will be presented with\
  \ a pop-up window containing information similar to this one:\n\n要启用 Selection Spy，请按\
  \ Alt + Shift + F1。你将看到一个弹出窗口，其中包含类似以下的信息：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_202_0.png)\n\
  \nThe preceding screenshot is the output of the **Plug-in Selection Spy** with **Java\
  \ Editor** as the **Active Part**. As you can see, it contains the class of the\
  \ active editor, the plugin that provides this part, the part's identifier, and\
  \ the menu contribution identifiers. In the previous example of how to disable menu\
  \ entries, we have implemented the `isEnabled()` method using information gathered\
  \ from the plugin selection spy: We know that the Java editor class is `CompilationUnitEditor`\
  \ and the text selection is an instance of `TextSelection`. If we didn't have the\
  \ plugin selection spy, we would have to scavenge for this information in the Java\
  \ Development Tool's code or documentation.\n\n前面的截图是 **Plug-in Selection Spy**\
  \ 的输出，其中 **Java Editor** 为 **Active Part**。如你所见，它包含活动编辑器的类、提供该 part 的插件、part 的标识符以及菜单贡献标识符。在之前如何禁用菜单项的示例中，我们使用从插件选择\
  \ spy 收集的信息实现了 `isEnabled()` 方法：我们知道 Java 编辑器类是 `CompilationUnitEditor`，文本选择是 `TextSelection`\
  \ 的实例。如果没有插件选择 spy，我们就必须在 Java 开发工具的代码或文档中搜寻这些信息。\n\nThe other Plugin Spy mode is\
  \ the Plugin Menu Spy. It allows you to get info from menu entries instead of views\
  \ and selections. To enable this mode, press *Alt + Shift + F2*. You will notice\
  \ that your mouse cursor will have a different look. Let's click on the **Run**\
  \ toolbar button, for example, to see how the Plugin Menu Spy output looks as follows:\n\
  \n另一个 Plugin Spy 模式是 Plugin Menu Spy。它允许你从菜单项而不是视图和选择中获取信息。要启用此模式，请按 *Alt + Shift\
  \ + F2*。你会注意到鼠标光标的外观会发生变化。例如，让我们点击 **Run** 工具栏按钮，看看 Plugin Menu Spy 的输出如下：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_203_0.png)\n\
  \nAs you can see, it gives us the active contribution item identifier, the location\
  \ URI of the contribution, and the action set identifier. This field can either\
  \ point to an action or a command, since the action framework, as we have discussed\
  \ previously in this chapter, is deprecated but there's still a lot of code that\
  \ hasn't been ported to the command framework.\n\n如你所见，它提供了活动贡献项标识符、贡献的 location\
  \ URI 以及 action set 标识符。此字段可以指向 action 或 command，因为正如我们在本章前面讨论过的，action 框架已被弃用，但仍有大量代码尚未移植到\
  \ command 框架。\n\nThe Plugin Menu Spy can also be used to get info from pop-up menus,\
  \ such as right-click context menus and toolbar drop-down menus.\n\nPlugin Menu\
  \ Spy 还可用于从弹出菜单获取信息，例如右键上下文菜单和工具栏下拉菜单。\n\nSo now you know from where did we get\
  \ the locationURI to use in the **click me** menu entry example. Since the Plugin\
  \ Menu Spy also gives us the action or the command that actually implements the\
  \ menu entry, it allows us to re-use them by adding new menu contributions that\
  \ use these actions or commands when required.\n\n所以现在你知道我们在 **click me** 菜单项示例中使用的\
  \ locationURI 是从哪里得到的。由于 Plugin Menu Spy 还提供了实际实现菜单项的 action 或 command，因此它允许我们通过添加在需要时使用这些\
  \ action 或 command 的新菜单贡献来重用它们。\n\nTo exit the Plugin Menu Spy mode, press *Esc*.\n\
  \n要退出 Plugin Menu Spy 模式，请按 *Esc*。\n\n## Creating new views\n\n## 创建新视图\n\nWhen\
  \ creating an Eclipse plugin, you might need to create a whole new view instead\
  \ of extending the current ones. Like almost everything in the Eclipse platform,\
  \ this is achieved by implementing extension points.\n\n在创建 Eclipse 插件时，你可能需要创建全新的视图而不是扩展现有视图。像\
  \ Eclipse 平台中的几乎所有内容一样，这通过实现扩展点来实现。\n\nThe org.eclipse.ui.views is the most important\
  \ extension point regarding views. There are three elements in this extension point:\n\
  \norg.eclipse.ui.views 是关于视图的最重要的扩展点。此扩展点中有三个元素：\n\n- **View**: Describes the view\
  \ itself. It contains information regarding the view's class, category, icon, and\
  \ name\n- **Category**: If the view you're creating doesn't belong to any of the\
  \ existing categories , you can create a new one using this element. You can see\
  \ all the existing views and its categories by selecting **Window | Show View |\
  \ Other**.\n- **StickyView**: Use this element if you want to create a view that\
  \ will be shown in all perspectives by default.\n\n- **View**：描述视图本身。它包含有关视图的类、类别、图标和名称的信息\n\
  - **Category**：如果你要创建的视图不属于任何现有类别，你可以使用此元素创建一个新类别。你可以通过选择 **Window | Show View |\
  \ Other** 查看所有现有视图及其类别。\n- **StickyView**：如果要创建默认在所有透视图中显示的视图，请使用此元素。\n\nThe class\
  \ required by the view element must be one that implements the org.eclipse.ui.part.IViewPart\
  \ interface. It's more recommended, however, to extend the ViewPart abstract class,\
  \ which is a base implementation of IViewPart that makes the task of implementing\
  \ IViewPart easier. It leaves two methods to be implemented:\n\nview 元素所需的类必须是实现\
  \ org.eclipse.ui.part.IViewPart 接口的类。然而，更推荐的是扩展 ViewPart 抽象类，它是 IViewPart 的基础实现，使实现\
  \ IViewPart 的任务更容易。它剩下两个方法需要实现：\n\n- `createPartControl(Composite parent)`: This\
  \ is the method that's called when the view is created. According to the method\
  \ comments of `IViewPart`, the following actions must be taken in implementations:\n\
  \  - Create one or more controls within the parent\n  - Set the parent layout as\
  \ needed\n  - Register any global actions with the site's `IActionBars`\n  - Register\
  \ any context menus with the site\n  - Register a selection provider with the site,\
  \ to make it available to the workbench's `ISelectionService` (optional)\n- `setFocus()`:\
  \ This method is called when focus is set in your view. Code in this method should\
  \ focus one of the elements inside the view.\n\n- `createPartControl(Composite parent)`：这是视图创建时调用的方法。根据\
  \ `IViewPart` 的方法注释，实现中必须执行以下操作：\n  - 在父容器内创建一个或多个控件\n  - 根据需要设置父布局\n  - 将任何全局操作与\
  \ site 的 `IActionBars` 注册\n  - 将任何上下文菜单与 site 注册\n  - 将选择提供者与 site 注册，使其可用于 workbench\
  \ 的 `ISelectionService`（可选）\n- `setFocus()`：此方法在视图中设置焦点时调用。此方法中的代码应使视图内的一个元素获得焦点。\n\
  \nBasically, every SWT element presented in Chapter 5, SWT, and Chapter 6, More\
  \ SWT, can be used to compose a view, as well as your own custom composites.\n\n\
  基本上，第 5 章 SWT 和第 6 章 More SWT 中介绍的每个 SWT 元素都可用于组成视图，以及你自己的自定义复合控件。\n\n## Saving\
  \ the view's current state\n\n## 保存视图的当前状态\n\nIt's important for most of the views\
  \ to be able to save its state so that it can be retrieved when Eclipse is restarted.\
  \ There is a saveState(IMemento memento) method in IViewPart that must be implemented\
  \ in order to achieve that. If you take a look at ViewPart's implementation, though,\
  \ you will be disappointed:\n\n对于大多数视图来说，能够保存其状态以便在 Eclipse 重启时恢复非常重要。IViewPart\
  \ 中有一个 saveState(IMemento memento) 方法必须实现才能实现这一点。不过，如果你查看 ViewPart 的实现，你会感到失望：\n\
  \n```\npublic void saveState(IMemento memento) {\n    // do nothing\n}\n```\n\n\
  If you want your view to be capable of saving its own state, you have to override\
  \ this method. Let's see how to do this.\n\n如果你希望你的视图能够保存自己的状态，你必须重写此方法。让我们看看如何做到这一点。\n\
  \nWe can see that the method receives a IMemento object as a parameter. This is\
  \ the object we have to update in order to save the view's state. From the IMemento's\
  \ JavaDoc, mementos are objects to which you can assign a \"mapping of arbitrary\
  \ string keys to primitive values, and by allowing mementos to have other mementos\
  \ as children (arranged into a tree)\". This mapping is created by calling the put<type>(String\
  \ key, <type> value) methods, such as putFloat, putInteger, putString, and so on.\
  \ Child mementos are created with the createChild method.\n\n我们可以看到该方法接收一个 IMemento\
  \ 对象作为参数。这是我们必须更新以保存视图状态的对象。根据 IMemento 的 JavaDoc，memento 是你可以为其分配“任意字符串键到原始值的映射”的对象，并且允许\
  \ memento 拥有其他 memento 作为子项（按树形排列）。此映射是通过调用 put<type>(String key, <type> value)\
  \ 方法创建的，例如 putFloat、putInteger、putString 等。子 memento 是通过 createChild 方法创建的。\n\n\
  Once you have accordingly implemented the saveState method, Eclipse guarantees that\
  \ the information stored in the memento object will be available across different\
  \ Eclipse sessions, using an xml-based storage format under the hood. However, we\
  \ still have to tell Eclipse how to use this information to recompose the view's\
  \ state. This is done by overriding the init(IViewSite site, IMemento memento) method,\
  \ since the ViewPart implementation simply ignores the memento object and delegates\
  \ to init(IViewSite site). As a general rule, information from the memento is only\
  \ saved in the current object, leaving the task of assigning the values back to\
  \ the SWT elements to the createPartControl method. This happens because the platform\
  \ calls init before createPartControl.\n\n一旦你相应地实现了 saveState 方法，Eclipse 保证 memento\
  \ 对象中存储的信息将在不同的 Eclipse 会话中可用，其底层使用基于 xml 的存储格式。然而，我们仍需告诉 Eclipse 如何使用这些信息来重新组合视图的状态。这是通过重写\
  \ init(IViewSite site, IMemento memento) 方法完成的，因为 ViewPart 实现只是忽略 memento 对象并委托给\
  \ init(IViewSite site)。作为一般规则，来自 memento 的信息仅保存在当前对象中，将值重新赋给 SWT 元素的工作留给 createPartControl\
  \ 方法。这是因为平台在 createPartControl 之前调用 init。\n\n## Adding context help to your view\n\
  \n## 为你的视图添加上下文帮助\n\nThe easiest way of getting help in Eclipse is through the Dynamic\
  \ Help, which can be activated in Help | Dynamic Help. This opens a Help view which\
  \ contains basic information and usage guidance for the currently focused view.\
  \ Each view provides the help content, and the Eclipse platform takes care of assembling\
  \ the help view.\n\n在 Eclipse 中获取帮助的最简单方式是通过 Dynamic Help，可在 Help | Dynamic Help\
  \ 中激活。这会打开一个 Help 视图，其中包含当前聚焦视图的基本信息和使用指南。每个视图提供帮助内容，而 Eclipse 平台负责组装帮助视图。\n\n\n\
  \n为了提供帮助内容，插件必须实现 `org.eclipse.help.contexts` 扩展点。实现必须提供一个 contexts 元素，该元素指向 XML\
  \ 格式的上下文帮助文件。无需从头创建并手动编辑，您可以使用 **Context Help** 编辑器。为此，通过选择 **File | New | Other**\
  \ 创建 XML 文件，然后浏览到 **User Assistance | Context Help**。在下一页提供文件名和位置，然后单击 **Finish**。您可以向上下文添加主题和命令。主题指向将在\
  \ **Dynamic Help** 视图中呈现的 HTML 文件。\n\n## 新视图示例\n\n为了说明我们迄今为止所看到的创建新视图的内容，让我们创建一个非常简单的视图，只包含一个标签和一个文本字段。让我们开始通过扩展\
  \ ViewPart：\n\n```java\npackage sampleview.views;\n\nimport org.eclipse.swt.SWT;\n\
  import org.eclipse.swt.layout.GridData;\nimport org.eclipse.swt.layout.GridLayout;\n\
  import org.eclipse.swt.widgets.Composite;\nimport org.eclipse.swt.widgets.Label;\n\
  import org.eclipse.swt.widgets.Text;\nimport org.eclipse.ui.IMemento;\nimport org.eclipse.ui.IViewSite;\n\
  import org.eclipse.ui.PartInitException;\nimport org.eclipse.ui.part.ViewPart;\n\
  \npublic class SampleView extends ViewPart {\n\n    public static final String ID\
  \ = \"sampleview.views.SampleView\";\n\n    private Label label;\n    private Text\
  \ text;\n    private IMemento memento;\n\n    public SampleView() {\n    }\n\n \
  \   public void createPartControl(Composite parent) {\n        parent.setLayout(new\
  \ GridLayout(2, false));\n        label = new Label(parent, SWT.NONE);\n       \
  \ label.setText(\"Write down something here:\");\n\n        text = new Text(parent,\
  \ SWT.BORDER);\n        text.setLayoutData(new GridData(SWT.FILL, SWT.NONE,\n  \
  \  true, false));\nif(memento != null){\n    if(memento.getString(\"content\") !=\
  \ null){\n        text.setText(memento.getString(\"content\"));\n    }\n}\n}\n\n\
  public void setFocus() {\n    text.setFocus();\n}\n\n@Override\npublic void init(IViewSite\
  \ site, IMemento memento) throws\n    PartInitException {\n    this.memento = memento;\n\
  \    init(site);\n}\n\n@Override\npublic void saveState(IMemento memento) {\n  \
  \  memento.putString(\"content\", text.getText());\n}\n}\n```\n\n现在我们有了 IViewPart\
  \ 实现，让我们修改 plugin.xml 以便在 Eclipse 平台中注册该视图。下面的屏幕截图显示了在注册视图后，我们的插件清单编辑器的 Extensions\
  \ 选项卡的样子：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_207_0.png)\n\n现在运行项目。通过选择\
  \ Window | Show View | Other 或使用 Ctrl + 3 快捷键并输入视图的名称来打开我们刚刚创建的视图。我们的视图应该如下所示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_208_0.png)\n\n尝试在文本字段中写入一些内容并重新启动运行时工作台。请注意，您必须关闭\
  \ Eclipse 实例，而不是在开发环境中单击 Terminate 按钮（红色停止按钮）。Terminate 按钮只是终止实例，没有给平台保存视图状态的时间。\n\
  \n## 导出插件\n\n到目前为止，我们只在运行时工作台中执行了我们的插件。为了将我们的插件提供给在其他机器上安装，我们必须导出它。为此，右键单击您的插件项目并选择\
  \ Export。导出向导包含四种不同的导出插件项目的方式。我们将使用 Deployable plug-ins and fragments 选项。选择它并单击\
  \ Next。\n\n下一个向导页面允许您选择要导出的插件。您的插件有三种可能的目的地：目录、归档文件或主机。如果您选择将插件导出到目录中，每个插件将被打包到自己的\
  \ .jar 文件中并放置在 plugins 文件夹内。要安装您的插件，只需将这些 jar 文件移动到 Eclipse 安装文件夹内的 plugins 文件夹中即可。归档选项做同样的事情，但在此基础上将\
  \ plugins 文件夹归档到 .zip 文件中。Install into host 选项允许您直接将插件部署到 Eclipse 安装中。\n\nOptions\
  \ 选项卡还允许您导出插件的源代码。如果您选择此选项，包含插件的 JAR 文件还将包含一个 src 文件夹，其中包含所有类的代码。JAR Signing 选项卡让您使用密钥库签署插件的\
  \ JAR 文件。\n\n## 摘要\n\n正如您在本章中所看到的，Eclipse 为有兴趣扩展它的开发人员提供了一套非常好的工具。插件清单编辑器通过消除了解如何编辑插件配置文件的需求，使开始创建插件变得更容易。Eclipse\
  \ 提供的插件文档非常完善，并且与 Plugin Spy 等功能一起，能让您迅速上手。\n\n现在我们对如何为 Eclipse 开发扩展有了一些基本了解，在下一章中我们将了解如何使用\
  \ Eclipse 的平台和基础设施来开发我们自己的客户端应用程序。\n\n# 9 Eclipse 丰富客户端平台\n\n# Eclipse 丰富客户端平台\n\
  \n在上一章中，我们谈到了 Eclipse 的插件开发。我们还看到 **Eclipse** 由一个基本平台和提供 **IDE** 所有功能的插件组成。我们没有告诉您的是，您可以使用此平台从头构建自己的客户端应用程序，利用\
  \ Eclipse 提供的一切。想象一下没有任何视图、透视图或工具栏的 Eclipse——这就是 **Rich Client Platform (RCP)**\
  \ 提供的。它是一个空白画布，您可以在此之上使用 Eclipse 的所有构建块以及您可能想到的任何其他构建块来开发您的应用程序。\n\n在本章中我们将：\n\n\
  - 了解什么是丰富客户端平台以及开发人员如何通过使用它来构建应用程序获益\n- 了解 Eclipse Rich Client Platform 是什么以及它提供什么\n\
  - 使用 **Eclipse RCP** 开发一个非常简单的客户端应用程序，以展示如何使用其最重要的功能\n- 了解如何捆绑和品牌化您的客户端应用程序\n\n\
  ## 理解丰富客户端平台\n\n在深入 Eclipse RCP 之前，让我们先定义什么是丰富客户端平台。在客户端/服务器架构的上下文中，客户端应用程序负责从用户获取请求并将其发送到将处理请求的机器，访问数据库和内部系统。互联网的普及以及速度和稳定性的改进促使许多公司将客户端应用程序从桌面转向基于互联网的应用程序。这种转变带来了许多好处，例如部署和更新的便利性，因为只需修改\
  \ Web 服务器中应用程序的代码即可将任何修改部署到所有客户端。因此，客户端的硬件和软件要求更少，等等。然而，由于网络延迟和连接问题导致的停机时间（尽管很少见，但对业务至关重要）造成的用户体验不佳，保持了对基于桌面的应用程序的兴趣。\n\
  \n然而，从头开发其中一个客户端应用程序是一项昂贵且耗时的任务。必须考虑许多不同的方面，例如可移植性、模块化以及更新方法。这就是丰富客户端平台发挥作用的地方。它为开发人员提供所有这些功能，以便他们构建自己的客户端应用程序，而无需担心他们处理的每种类型的客户端应用程序的不同方面。由于客户端应用程序的用户界面彼此差异不大，其中大多数基本上由包含数据输入元素的表单组成，例如文本字段和组合框。RCP\
  \ 还应提供可重用的小部件，可轻松添加到应用程序中。\n\nEclipse 从客户端/服务器架构的角度来看并不是一个客户端应用程序。它包含所有这些理想的功能，并且这些功能通过\
  \ Eclipse RCP 提供给有兴趣为自己的客户端应用程序利用它们的开发人员。\n\n## Eclipse 丰富客户端平台\n\n现在我们知道了什么是丰富客户端平台，让我们更详细地了解\
  \ Eclipse RCP 提供的功能。\n\n\n\n## OSGi 框架实现\n\nEclipse RCP 提供了 Equinox，即 OSGi 框架的一种实现。根据其规范文档，OSGi\
  \ 框架提供了一个通用、安全、受管理的 Java 框架，支持部署称为 bundles 的可扩展且可下载的应用程序。Equinox 为您的客户端应用程序提供所有必要的[content]\n\
