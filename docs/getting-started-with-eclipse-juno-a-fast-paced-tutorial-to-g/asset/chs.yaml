  \ test.\n\n[content]\n## OSGi 框架实现\n\nEclipse RCP 提供了 Equinox，即 OSGi 框架的一种实现。\n\n\
  \n\n如名称所示，start 方法在应用程序启动期间被调用，而 stop 方法在应用程序停止时被调用。start 方法可以返回任何类型的对象，包括整数，就像\
  \ Application 实现的情况一样。这是一个非常基础的实现，它只是创建一个新的 Display 对象并调用静态的 PlatformUI.createAndRunWorkbench\
  \ 方法。该方法接收一个 WorkbenchAdvisor 对象作为参数。该对象允许您配置应用程序外观和感觉的一些基本方面。每个 RCP 应用程序都必须实现一个\
  \ WorkbenchAdvisor 对象。Display 对象管理 SWT 与操作系统之间的连接。对于大多数 RCP 应用程序而言，要使其运行起来，start\
  \ 方法中通常不需要比这些更多的内容。stop 方法只是关闭在 start 方法期间创建的工作台。\n\n现在让我们更仔细地查看 WorkbenchAdvisor\
  \ 类的生成扩展，即 ApplicationWorkbenchAdvisor 扩展：\n\n```\npublic class ApplicationWorkbenchAdvisor\
  \ extends WorkbenchAdvisor {\n\n    private static final String PERSPECTIVE_ID =\
  \ \"HelloRCP.perspective\";\n\n    public WorkbenchWindowAdvisor createWorkbenchWindowAdvisor(\n\
  \        IWorkbenchWindowConfigurer configurer) {\n        return new ApplicationWorkbenchWindowAdvisor(configurer);\n\
  \    }\n\n    public String getInitialWindowPerspectiveId() {\n        return PERSPECTIVE_ID;\n\
  \    }\n\n}\n```\n\ngetInitialWindowPerspectiveId 方法决定在打开应用程序的新窗口时将显示哪个透视图。createWorkbenchWindowAdvisor\
  \ 方法负责实例化并返回一个 WorkbenchWindowAdvisor 对象，该对象配置应用程序窗口本身。我们的实现返回 ApplicationWorkbenchWindowAdvisor\
  \ 扩展的一个实例，该扩展继承自 WorkbenchWindowAdvisor 对象。让我们查看其实现：\n\n```\npublic class ApplicationWorkbenchWindowAdvisor\
  \ extends\nWorkbenchWindowAdvisor {\n\n    public ApplicationWorkbenchWindowAdvisor(IWorkbenchWindowConfigurer\n\
  configurer) {\n        super(configurer);\n    }\n\n    public ActionBarAdvisor\
  \ createActionBarAdvisor(\n    IActionBarConfigurer configurer) {\n    return new\
  \ ApplicationActionBarAdvisor(configurer);\n}\n\n    public void preWindowOpen()\
  \ {\n    IWorkbenchWindowConfigurer configurer = getWindowConfigurer();\n    configurer.setInitialSize(new\
  \ Point(400, 300));\n    configurer.setShowCoolBar(false);\n    configurer.setShowStatusLine(false);\n\
  \    configurer.setTitle(\"RCP Application\");\n}\n}\n```\n\npreWindowOpen 方法的实现调用\
  \ getWindowConfigurer 并对 IWorkbenchWindowConfigurer configurer 执行一些操作，例如为应用程序窗口设置初始大小、禁用\
  \ coolbar 和状态行，以及为应用程序设置标题。createActionBarAdvisor 方法实例化并返回 ApplicationActionBarAdvisor，后者扩展自\
  \ ActionBarAdvisor。ActionBarAdvisor 创建、添加和释放工作台窗口的 JFace 操作。JFace 操作是一条命令，可以由最终用户通过使用\
  \ UI 元素（如按钮、菜单项和工具栏中的项）触发。ApplicationActionBarAdvisor 实现不会修改 ActionBarAdvisor 的行为。\n\
  \n现在，让我们回到 **插件清单编辑器** 窗口，看看构建一个功能完整的 RCP 应用程序还需要哪些其他插件。正如我们在本章开头所说，RCP 应用程序就像是剥离了所有\
  \ Eclipse 图形元素的 Eclipse 实例。这意味着如果您希望应用程序正常运行，就必须创建这些元素。我们需要的第一件事是透视图，它是通过实现 org.eclipse.ui.perspectives\
  \ 扩展点创建的。perspective 元素包含一个 ID，该 ID 在应用程序之间必须是唯一的，还必须是一个用户友好的名称，将在界面中显示，以及一个类。让我们看看\
  \ Perspective 类的代码：\n\n```\npublic class Perspective implements IPerspectiveFactory\
  \ {\n\n    public void createInitialLayout(IPageLayout layout) {\n        layout.setEditorAreaVisible(false);\n\
  \        layout.setFixed(true);\n\n    }\n}\n```\n\n代码显示我们透视图类必须实现 `IPerspectiveFactory`\
  \ 接口，该接口包含 `createInitialLayout` 方法。模板生成的实现只是通过调用 `setFixed` 方法从应用程序中移除编辑器区域，并禁止用户修改视图的大小和位置。编辑器区域是应用程序窗口中央为编辑器保留的空间。任何其他视图都将渲染在此区域下方、左侧或右侧。编辑器区域对于我们的应用程序被禁用，因为它没有任何编辑器。\n\
  \n此方法也可以通过调用 `layout.addView` 方法将视图添加到透视图中。然而，模板生成的代码采用了不同的方法。返回 **插件清单编辑器** 窗口并查看\
  \ `org.eclipse.ui.perspectiveExtensions` 实现。此扩展点允许您向现有透视图添加视图。这种方法通常用于您想要向非您开发的透视图添加视图时。在这种情况下，您将无法访问\
  \ `IPerspectiveFactory` 实现来向 `createInitialLayout` 实现添加 `layout.addView` 调用。\n\n\
  `perspectiveExtension` 元素是您定义将接收视图的透视图 ID 的地方。此字段允许使用 * (星号) 字符，这将导致视图被添加到与模式匹配的每个透视图中。例如，`org.eclipse.jdt.*`\
  \ 将在每个 **Java 开发工具 (JDT)** 透视图中包含该视图。这是使用 `perspectiveExtensions` 扩展点而不是在 `IPerspectiveFactory`\
  \ 实现中调用 `layout.addView` 的另一个好处。它简化了管理视图将被添加到的透视图的任务。在我们的示例中，`targetID` 只是 *，这意味着在\
  \ `HelloRCP.view` 中，视图将被添加到所有可用的透视图中（我们的应用程序中只有一个透视图）。\n\n说到视图，让我们看看 `org.eclipse.ui.views`\
  \ 扩展。这是一个简单的视图，就像我们在 *第 8 章，Eclipse 开发* 中创建的那样。它指向一个扩展 `ViewPart` 抽象类的 View 类。`createPartControl`\
  \ 方法实例化一个 `TableViewer` 对象并为其关联一个内容提供者和一个标签提供者。我们将在后面的章节扩展此示例时探索标签和内容提供者的概念。`TableViewer`\
  \ 是一个 JFace 小部件，以类似表格的列表显示内容，类似于 JDT 的 Problems 视图中使用的那种。\n\n我们的 RCP 应用程序实现的最后一个扩展点是\
  \ `org.eclipse.ui.menus`。它只是提供一个 **文件** 菜单贡献，其中包含一个 **退出** 条目。此条目运行 `org.eclipse.ui.file.exit`\
  \ 命令，导致程序退出。\n\n## 运行和调试 RCP 应用程序\n\n运行 RCP 应用程序最简单的方法是打开 RCP 项目的 插件清单编辑器 窗口，切换到\
  \ Overview 选项卡，然后单击右侧列上的 启动 Eclipse 应用程序 链接。这将创建一个包含 RCP 插件和必要的平台插件的默认配置。您也可以通过选择项目并在\
  \ Eclipse 菜单中导航到 Run | Run Configurations 来创建自定义运行配置，就像使用常规插件一样。双击左侧的 Eclipse Application\
  \ 选项为所选项目创建一个新的运行配置。要将项目作为 RCP 应用程序而不是 Eclipse 插件运行，请确保切换到 Run an application 并在\
  \ Program to run 部分中选择您的应用程序，如以下屏幕截图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_221_0.png)\n\
  \n此配置还将包含开发平台中的所有插件。要仅选择所需的插件，请切换到 Plug-ins 选项卡，并从 Launch with 下拉菜单中选择仅以下选择的插件。单击\
  \ Deselect all，选择您的 RCP 插件，然后单击 Add Required Plug-ins，使应用程序中仅包含必要的平台插件。\n\n在 第 8\
  \ 章，Eclipse 开发 中介绍的其他选项卡的配置选项在这里也有效。您也可以转到 Run | Run Configuration，如果您尚未创建，Eclipse\
  \ 将为您创建一个默认的运行配置。您将看到多种运行应用程序的方式：作为 Eclipse 应用程序、Java applet 或应用程序，或作为 OSGi Framework\
  \ 应用程序。选择 Eclipse Application 并单击 OK。此配置将仅包含当前选择的插件和必要的平台插件。\n\n\n\n以下截图显示了我们在上一节中构建的示例应用程序的外观。正如您所见，它符合我们所有的规范：一个\
  \ 400 x 300 像素的窗口、一个视图、**RCP 应用** 标题等等。\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_222_0.png)\n\
  \n调试也是一项直接的操作——只需在您希望调试的类中设置断点，然后导航到 **运行** | **调试**。它将使用与 **运行** 命令相同的配置。\n\n##\
  \ 扩展示例 – 创建联系人列表应用程序\n\n现在我们已经了解了 Eclipse RCP 应用程序的基础知识，让我们扩展示例并创建一个用于存储联系人信息的应用程序。为了保持简单并专注于学习如何使用\
  \ Eclipse RCP 功能，我们将开发一个独立的应用程序，而不是连接到服务器的客户端应用程序。然而，该应用程序可以很容易地修改为从服务器存储和获取联系人信息。这种设计相对于基于\
  \ Web 的客户端的优势在于，可以实现机制使您的应用程序在 Internet 连接故障或根本不存在的情况下也能工作。\n\n这里的想法是开发一个非常简单的应用程序，但它具有功能并探索比前一个示例更多的功能。它将在应用程序窗口左侧有一个视图，其中包含联系人姓名的列表。每当在此视图中选择一个联系人姓名时，联系人编辑器将在窗口中间打开，允许用户查看联系人信息并更新它。**应用程序**\
  \ 菜单将包含创建新联系人、保存当前编辑联系人的条目，以及带有 **保存** 按钮的工具栏。我们还将使用此示例来介绍内容和标签提供者的概念。\n\n我们将在此示例中创建多个类。以下截图包含它们各自包中的所有类，以便您在需要了解应用程序的整体情况时可以参考：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_223_0.png)\n\n好吧，让我们动手吧。正如您在前一个示例中看到的，Eclipse\
  \ 模板是入门的好方法；因此让我们也在此示例中使用它。导航到 文件 | 新建 | 插件项目 并使用 HelloRCP 模板创建一个名为 ContactsList\
  \ 的新 RCP 项目。将应用程序窗口标题更改为更合适的名称，例如 Contacts List。\n\n该项目与前一个示例的结构相似，但类更少。让我们运行应用程序以确保一切正常。打开\
  \ 插件清单编辑器，切换到 概览 选项卡，然后单击右侧列中的 启动 Eclipse 应用程序 链接。您将看到一个名为 Contacts List 的空窗口，这正是我们现在所期望的。让我们关闭它并继续开发应用程序。\n\
  \n## 联系人列表视图\n\n我们将首先编写包含联系人列表的视图。要创建此列表，我们将使用 SWT 的 TableViewer 元素。尽管这是一个非常基本的视图，但为了演示目的，我们将使用标签和内容提供者。标签提供者是一个特殊类，负责将模型映射到查看器中的相应条目。在我们的\
  \ TableViewer 情况下，它将提供代表联系人的标签。我们将为此使用联系人的姓名。内容提供者为查看器提供其应包含的元素。我们将使用一个名为 ArrayContentProvider\
  \ 的简单 SWT 实现，它通过数组提供元素。\n\n让我们从联系人模型开始。创建一个名为 Contact 的类，其中包含三个字符串及其 getter 和 setter：name、address\
  \ 和 phoneNumber。还创建一个包含所有字符串的构造函数。\n\n我们接下来要处理的类是标签提供者。创建一个名为 ContactLabelProvider\
  \ 的类并使其实现 ILabelProvider 接口。使用第 2 章《Java 开发》中介绍的 Eclipse 代码生成功能为接口的方法创建默认实现。我们唯一要修改的方法是\
  \ getText。在这里我们将确定联系人将在联系人列表中以其姓名表示。我们需要获取 element 参数，检查它是否是 Contact 的实例，并返回联系人的姓名。以下代码实现了这一点：\n\
  \n```\n@Override\npublic String getText(Object element) {\n    if(element instanceof\
  \ Contact){\n        return ((Contact)element).getName();\n    }\n    return null;\n\
  }\n```\n\n现在我们拥有所需的一切，让我们开始处理 ContactList 视图本身。创建一个名为 ContactListView 的类，代码如下：\n\
  \n```\npublic class ContactListView extends ViewPart {\n\n    private TableViewer\
  \ contactsViewer;\n    private List<Contact> contacts;\n\n@Override\npublic void\
  \ createPartControl(Composite parent) {\n    contactsViewer = new TableViewer(parent);\n\
  \    contactsViewer.setContentProvider(new ArrayContentProvider());\n    contactsViewer.setLabelProvider(new\
  \ ContactLabelProvider());\n    contacts = new ArrayList<Contact>();\n    contactsViewer.setInput(contacts);\n\
  }\n\n@Override\npublic void setFocus() {\n\n}\n\npublic void addEntry(Contact contact){\n\
  \    contacts.add(contact);\n    contactsViewer.refresh(true);\n}\n\npublic void\
  \ refreshEntries(){\n    contactsViewer.refresh(true);\n}\n}\n```\n\n导入部分已省略。正如我们在上一章中看到的，创建视图的一种简单方法是扩展\
  \ `ViewPart` 类。这要求我们实现 `createPartControl` 和 `setFocus` 方法。在 `createPartControl`\
  \ 方法中，我们应该实例化视图中包含的所有 SWT 元素。`setFocus` 方法在焦点分配给视图时执行。此方法通常将焦点分配给视图中的一个 SWT 元素。我们现在将忽略\
  \ `setFocus` 并使用空实现。在 `createPartControl` 方法中，我们初始化 `TableViewer` 接口并将其与我们刚刚创建的\
  \ `ContactLabelProvider` 类关联。我们还创建了一个新的 `ArrayContentProvider` 实例并为其提供一个空的 `ArrayList`\
  \ 实例。随着我们创建新的联系人条目，此列表将被修改。我们还创建了两个方法（`addEntry` 和 `refreshEntries`）以简化并封装将新联系人添加到列表的任务。\n\
  \n现在我们有了 ContactList 类，让我们修改 plugin.xml 文件以在工作台中注册它。我们将为此使用插件清单编辑器窗口，就像我们在上一章中所做的那样。双击\
  \ plugin.xml 文件以打开它，切换到 Extensions 选项卡，并添加一个新的 org.eclipse.ui.views 条目。向扩展添加一个新的\
  \ view 元素。以下截图包含此元素的属性：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_226_0.png)\n\
  \n我们还必须将我们的视图添加到应用程序的默认透视图中。让我们为此使用 perspectiveExtension，就像我们在前一个示例中所做的那样。创建一个对\
  \ org.eclipse.ui.perspectiveExtensions 的扩展，添加一个 targetID 为 * 的 perspectiveExtension，并在其下添加一个\
  \ view 元素，其属性如以下截图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_226_1.png)\n\n\
  relative 字段确定将作为我们视图窗口定位的参考的部分。在这种情况下，我们使用编辑器空间（org.eclipse.ui.editors），它代表工作台中当前活动的编辑器。单击\
  \ Browse 按钮可以搜索部件 ID。relationship 字段确定它相对于 relative 字段中选定的部分的位置。\n\n## 联系人编辑器\n\n\
  为了创建新的联系人条目并编辑现有的条目，我们将创建一个联系人编辑器。在处理 ContactEditor 类本身之前，让我们为其创建一个编辑器输入。编辑器输入表示正在编辑的条目。例如，文件的编辑器输入可能包含正在编辑的文件的路径。由于我们的应用程序内容仅存储在内存中，因此编辑器输入必须包含\
  \ Contact 对象本身。创建一个名为 ContactEditorInput 的类，使其实现 IEditorInput 接口，代码如下：\n\n```\n\
  public class ContactEditorInput implements IEditorInput {\n\n    private Contact\
  \ contact;\n\n    public ContactEditorInput(Contact contact) {\n        super();\n\
  \        this.contact = contact;\n    }\n\n    public Contact getContact() {\n \
  \       return contact;\n    }\n\n    @Override\n    public String getToolTipText()\
  \ {\n        return contact.getName();\n    }\n\n    @Override\n    public String\
  \ getName() {\n        return contact.getName();\n    }\n\n    @Override\n    public\
  \ boolean equals(Object obj) {\n        if(obj instanceof ContactEditorInput){\n\
  \            if(((ContactEditorInput)obj).getContact().equals(this.contact)){\n\
  \                return true;\n            }\n        }\n        return false;\n\
  \    }\n\n    //Auto-generated method stub\n}\n```\n\n\n\n我们创建了一个接收 Contact 对象的构造函数，并为其实现了\
  \ getter。我们还实现了 getToolTipText 和 getName 方法以返回联系人姓名。为了确保对同一个联系人只打开一个编辑器，还必须实现 equals\
  \ 方法。我们已为其他方法使用了自动生成的代码存根。这些方法在代码中被省略了。\n\n现在让我们来处理联系人编辑器。以下代码是 ContactEditor 类的实现：\n\
  \n```\npublic class ContactEditor extends EditorPart {\n\n    private boolean dirty\
  \ = false;\n    private Text addressText;\n    private Text nameText;\n    private\
  \ Text phoneText;\n\n    @Override\n    public void init(IEditorSite site, IEditorInput\
  \ input)\n        throws PartInitException {\n        setSite(site);\n        setInput(input);\n\
  \    }\n\n    @Override\n    public void createPartControl(Composite parent) {\n\
  \        parent.setLayout(new GridLayout(2, false));\n        Label nameLabel =\
  \ new Label(parent, SWT.NONE);\n        nameLabel.setText(\"Name\");\n        nameLabel.setLayoutData(new\
  \ GridData());\n        nameText = new Text(parent, SWT.BORDER | SWT.FILL);\n  \
  \      nameText.setLayoutData(new GridData());\n\n        Label addressLabel = new\
  \ Label(parent, SWT.NONE);\n        addressLabel.setText(\"Address\");\n       \
  \ addressLabel.setLayoutData(new GridData());\n        addressText = new Text(parent,\
  \ SWT.BORDER);\n        addressText.setLayoutData(new GridData());\n\n        Label\
  \ phoneLabel = new Label(parent, SWT.NONE);\n        phoneLabel.setText(\"Phone\
  \ number\");\n        phoneLabel.setLayoutData(new GridData());\n        phoneText\
  \ = new Text(parent, SWT.BORDER );\n        phoneText.setLayoutData(new GridData());\n\
  \n        ContactEditorInput editorInput = (ContactEditorInput)\n        getEditorInput();\n\
  \        if(editorInput != null){\n            Contact contact = editorInput.getContact();\n\
  \            nameText.setText(contact.getName());\n            this.setPartName(contact.getName());\n\
  \            addressText.setText(contact.getAddress());\n            phoneText.setText(contact.getPhoneNumber());\n\
  \        }\n\n        nameText.addModifyListener(new ContactEditorModifyListener());\n\
  \        addressText.addModifyListener(new ContactEditorModifyListener());\n   \
  \     phoneText.addModifyListener(new ContactEditorModifyListener());\n    }\n\n\
  \    @Override\n    public void doSave(IProgressMonitor monitor) {\n        dirty\
  \ = false;\n        firePropertyChange(IWorkbenchPartConstants.PROP_DIRTY);\n\n\
  \        ContactEditorInput editorInput = (ContactEditorInput)\n        getEditorInput();\n\
  \        if(editorInput != null){\n            Contact contact = editorInput.getContact();\n\
  \            contact.setName(nameText.getText());\n            contact.setAddress(addressText.getText());\n\
  \            contact.setPhoneNumber(phoneText.getText());\n\n            this.setPartName(contact.getName());\n\
  \        }\n    }\n\n    @Override\n    public boolean isDirty() {\n        return\
  \ dirty;\n    }\n\n    @Override\n    public void doSaveAs() {\n    }\n\n    @Override\n\
  \    public boolean isSaveAsAllowed() {\n        return false;\n    }\n\n    @Override\n\
  \    public void setFocus() {\n    }\n\n    private class ContactEditorModifyListener\
  \ implements ModifyListener\n    {\n        @Override\n        public void modifyText(ModifyEvent\
  \ e) {\n            dirty = true;\n            firePropertyChange(IWorkbenchPartConstants.PROP_DIRTY);\n\
  \        }\n    }\n}\n```\n\n请注意 ContactEditor 扩展的是 EditorPart 而不是 ViewPart，就像 ContactListView\
  \ 一样。它还包含必须实现的 createPartControl 方法。我们的实现创建了 SWT 元素，组成了联系人字段的基础表单。如果当前编辑器输入不为 null，也会填充这些字段，这将在编辑联系人而不是创建新联系人时发生。还有一个名为\
  \ ContactEditorModifyListener 的内部类，其名称暗示它会在文本元素被修改时收到通知。我们使用此类将 dirty 状态更改为 true。dirty\
  \ 状态表示编辑器的输入包含未保存的更改。此状态在编辑器名称前用星号字符 (*) 表示。此状态还允许我们相应地启用或禁用保存按钮。请注意我们在 doSave 方法中如何更改\
  \ dirty 状态。\n\n现在，让我们在 plugin.xml 文件中注册 ContactEditor 类。为 org.eclipse.ui.editors\
  \ 扩展点添加一个新的扩展，并添加一个编辑器元素，其属性如以下屏幕截图所示：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_231_0.png)\n\
  \n编辑器不会像普通视图那样添加到透视图中。编辑器是通过调用当前活动 WorkbenchPage 的 openEditor 方法以编程方式打开的，如本章后面将看到的那样。它们可以在任何透视图中打开，并放置在编辑器区域中，该区域位于窗口中间。\n\
  \n## 保存和新建命令及菜单项\n\n下一步是实现命令、处理器和菜单项，以使用户能够创建新联系人并保存工作。让我们从处理器类开始。这是保存命令处理器的代码：\n\
  \n```\npublic class SaveContactHandler extends AbstractHandler {\n    @Override\n\
  \    public Object execute(ExecutionEvent event) throws ExecutionException {\n \
  \       PlatformUI.getWorkbench().getActiveWorkbenchWindow().\n        getActivePage().getActiveEditor().doSave(new\
  \ NullProgressMonitor());\n        return null;\n    }\n}\n```\n\n请注意有两个 AbstractHandler\
  \ 类，一个在 org.eclipse.core.commands 包中，另一个在 org.eclipse.ui.commands 中。我们将使用前者，因为后者已弃用。\n\
  \n这是新建联系人处理器：\n\n```\npublic class NewContactHandler extends AbstractHandler {\n\
  \n    @Override\n    public Object execute(ExecutionEvent event) throws\nExecutionException\
  \ {\n        Contact contact = new Contact(\"New Contact\", \"\", \"\");\n     \
  \   IViewPart view = PlatformUI.getWorkbench().\ngetActiveWorkbenchWindow().getActivePage().findView(\"\
  ContactsList.ContactsListView\");\n        ((ContactListView) view).addEntry(contact);\n\
  \        return null;\n    }\n}\n```\n\n新建联系人处理器 simply 创建一个新的 Contact 对象并在 ContactsListView\
  \ 视图中调用 addEntry 方法。\n\n让我们继续在 plugin.xml 文件中进行必要的修改，这与上一章演示的类似。为 org.eclipse.ui.commands\
  \ 扩展点添加一个扩展，并为保存和新建命令添加命令元素。在示例中，我们使用 contactsList.save 和 contactsList.new 作为 ID，使用\
  \ Save 和 New 作为名称。现在添加 org.eclipse.ui.handlers 扩展，并为命令创建两个处理器元素，将它们链接到我们刚刚创建的处理器类。\n\
  \n下一步是为这些命令添加菜单项。让我们在主菜单中添加一个 File 条目，其中包含新建和保存条目，并在工具栏中添加一个保存按钮。添加以下屏幕截图中显示的元素以创建它们：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_232_0.png)\n\n新建和保存命令分别指向 contactsList.new\
  \ 和 contactsList.save 命令 ID。\n\n如果此时运行应用程序，你会发现工具栏中的保存按钮不存在。事实上，我们的应用程序中根本没有工具栏！这是因为模板提供的\
  \ ApplicationWorkbenchWindowAdvisor 扩展的实现禁用了工具栏。打开此类，并在 preWindowOpen 方法内部注释掉 configurer.setShowCoolBar(false)\
  \ 调用，或将参数更改为 true 以显示工具栏。\n\n## 连接两个视图\n\n现在我们有了两个视图和菜单项，下一步是通过在用户在列表中双击条目时打开编辑器来连接这两个视图。我们将通过向\
  \ ContactList 视图添加双击监听器来实现这一点。让我们开始编写监听器。创建一个名为 ContactListDoubleClickListener 的类，代码如下：\n\
  \n```\npublic class ContactListDoubleClickListener implements\n    IDoubleClickListener\
  \ {\n\n    @Override\n    public void doubleClick(DoubleClickEvent event) {\n  \
  \      TableViewer viewer = (TableViewer) event.getSource();\n        StructuredSelection\
  \ selection = (StructuredSelection) viewer.getSelection();\n        Contact contact\
  \ = (Contact) selection.getFirstElement();\n        try {\n            PlatformUI.getWorkbench().getActiveWorkbenchWindow().getActivePage().openEditor(new\
  \ ContactEditorInput(contact), \"ContactsList.ContactEditor\");\n        } catch\
  \ (PartInitException e) {\n            e.printStackTrace();\n        }\n    }\n\
  }\n```\n\n当 IDoubleClickListener 实现注册到 SWT 小部件时，其 doubleClick 方法会在小部件被双击时执行。我们的\
  \ doubleClick 实现获取 TableViewer 小部件并发现选择了哪个元素。这也是使用内容提供程序的另一个优点；它们允许你轻松访问 TableViewer\
  \ 条目所引用的对象。\n\n\n\n现在我们已经有了双击监听器，通过修改 ContactListView 的 createControl 方法并添加以下行，将其添加到联系人的\
  \ TableViewer 小部件中：\n\n```\ncontactsViewer.addDoubleClickListener(new\nContactListDoubleClickListener());\n\
  ```\n\n为了进一步集成联系人视图窗口和编辑器，我们必须在每次编辑器保存时强制刷新联系人条目，以便反映联系人姓名可能的更改。为此，ContactsList\
  \ 视图将监听编辑器在每次保存时触发的特定事件。让我们先在 ContactEditor 类中添加一个名为 contactListView 的私有 IViewPart\
  \ 字段来保存联系人视图的实例。添加以下行到 ContactEditor 的 createPartControl() 方法中以获取实例：\n\n```\ncontactListView\
  \ = PlatformUI.getWorkbench().\ngetActiveWorkbenchWindow().getActivePage().findView(\"\
  ContactsList.ContactsListView\");\n```\n\n现在将以下代码添加到 doSave() 方法的末尾，以通知联系人列表实例编辑器已保存：\n\
  \n```\nif(contactListView != null){\n    if (contactListView instanceof IPropertyChangeListener){\n\
  \        PropertyChangeEvent changeDirty = new PropertyChangeEvent(this,\n\"isDirty\"\
  , true, false);\n        ((IPropertyChangeListener)contactListView).\npropertyChange(changeDirty);\n\
  \    }\n}\n```\n\n现在我们要做的就是更改 ContactListView 类以实现 IPropertyChangeListener 接口并添加一个\
  \ propertyChange() 方法，以便在编辑器保存时相应地执行。使用以下代码实现 propertyChange 方法：\n\n```\n@Override\n\
  public void propertyChange(PropertyChangeEvent event) {\n    refreshEntries();\n\
  }\n```\n\n## 运行应用程序\n\n我们现在已经为这个简单应用程序提出了所有内容。让我们通过运行它来看看它是什么样子的。你应该会看到一个如下所示的窗口：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_235_0.png)\n\n导航到应用程序主菜单中的 File | New\
  \ 以创建新的联系人。编辑器将打开。以下截图显示了编辑器：\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_235_1.png)\n\
  \n## 打包和品牌化 Eclipse RCP 应用程序\n\n我们的联系人列表应用程序已经运行，但到目前为止我们只能从开发环境中运行它。在本节中，我们将了解如何将我们的应用程序转变为可分发给用户的自包含产品。\n\
  \n为了实现这一点，我们需要创建一个产品配置文件，描述我们的产品将如何打包以及包含什么内容。幸运的是，就像其他插件开发配置文件一样，Eclipse 为产品配置文件提供了一个向导和一个专用编辑器。要使用向导创建文件，请在\
  \ Package Explorer 视图中右键单击你的 RCP 应用程序项目，并导航到 New | Product Configuration。确保你正在使用\
  \ Plug-in Development 透视图，以便看到这些选项。在向导窗口中，输入 contactlist.product 作为产品配置文件名。向导允许你使用现有产品或启动配置作为产品的基配置。因为我们已经在开发环境中启动了产品，所以我们已经有一个符合基本需求的启动配置。选择\
  \ Use a launch configuration 并选择 ContactsList 配置。单击 Finish 后，产品配置编辑器将打开，如以下截图所示：\n\
  \n![](img/d7c3f2018603810fae83e1a6fd98749e_236_0.png)\n\n用与上一张截图中显示的相同值填充 General\
  \ Information 部分。在 Product Definition 部分，让我们通过单击 New 按钮创建一个新产品。单击 Browse 选择 ContactList\
  \ 作为产品的定义插件。保留 Product 作为产品 ID。在 Application 中，选择 ContactList.application。单击 Finish。我们在产品中没有使用功能，所以将产品配置保留为\
  \ plug-ins。\n\n切换到产品配置编辑器的 **Dependencies** 选项卡。列表中应该已经包含了一些插件；其中包括 `ContactsList`。此信息来自我们指向向导的启动配置。你可以检查列表并在必要时添加/删除插件。让我们保留来自启动配置的那些。\n\
  \n这应该足以让我们生成一个包含联系人列表应用程序的捆绑包。保存产品配置编辑器，在 **Package Explorer** 窗口中右键单击 `ContactsList`\
  \ 项目，并选择 **Export**。在 **Export** 向导的 **Plug-in Development** 类别下，选择 **Eclipse product**\
  \ 并单击 **Next**。\n\n在下一页中，将我们刚刚创建的 `contactlist.product` 配置文件指向 **Configuration**\
