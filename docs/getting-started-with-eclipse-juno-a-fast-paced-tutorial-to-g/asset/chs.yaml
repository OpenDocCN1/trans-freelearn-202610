  \ Browse 按钮。您还可以选择资源将被包含到的文件夹。完成后单击 Finish。导入的资源将被解压缩并复制到项目的[content]\n## 创建 Java\
  \ 类\n\n要创建新的 Java 类，请在 Package Explorer 视图中右键单击项目并导航到 **New** | **Class**。您将看到 **New\
  \ Java Class** 窗口，在其中输入有关类的信息。您可以更改类的超类，并添加其实现的接口，以及为从接口和抽象超类继承的抽象方法添加存根、从超类添加构造函数，并添加\
  \ main 方法。\n\n要在包内创建类，只需在相应字段中输入其名称，或单击旁边的 **Browse** 按钮并选择包。如果您输入的包名不存在，Eclipse\
  \ 会为您创建它。新的包也可以通过在 Package Explorer 中右键单击项目并导航到 **New** | **Package** 来创建。在 Project\
  \ Explorer 中右键单击包而不是项目并导航到 **New** | **Class** 将导致类在该包内创建。\n\n## 创建工作集\n\n工作集提供了一种将工作区中的项目组织成子集的方式。当工作区中的项目太多时，很难在\
  \ **Package Explorer** 视图中找到所需的项目。例如，您当前未处理的项目可以保存在单独的工作集中。它们不会妨碍您当前的工作，但在需要时仍可使用。\n\
  \n要创建新的工作集，请打开 Package Explorer 的视图菜单（视图右上角的白色三角形），并选择 **Select Working Set**。单击\
  \ **New** 并选择工作集将包含的项目类型（本例中为 **Java**）。在下一页中，输入工作集的名称，并选择其将包含的项目。工作集创建后，选择 **Selected\
  \ Working Sets** 选项，并标记您的工作集。单击 **OK**，Package Explorer 将仅显示您刚刚创建的工作集中的项目。\n\n工作集创建后，它们会列在\
  \ Package Explorer 的视图菜单中。选择其中一个将使其成为 Package Explorer 中唯一可见的工作集。要同时查看多个工作集，请选择\
  \ **Select Working Set** 选项并标记要显示的项目。要再次查看整个工作区，请在视图菜单中选择 **Deselect Workspace**。您还可以通过将工作集选为\
  \ **Package Explorer** 视图的顶级元素来查看所有工作集及其嵌套项目。为此，请在视图菜单中导航到 **Top Level Elements**\
  \ | **Working Sets**。\n\n虽然在选择工作集时看不到属于其他工作集的项目，但它们仍加载在工作区中，因此会占用机器资源。为避免浪费这些资源，您可以通过右键单击它们并选择\
  \ Close Project 来关闭不相关的项目。您可以使用 Ctrl + A 键盘快捷键选择工作集中的所有项目。\n\n如果您有大量项目，但从不同时处理所有项目（个人/业务项目、不同客户的项目等），您还可以为每个项目集创建特定的工作区。要创建新的工作区，请在菜单中导航到\
  \ File | Switch Workspace | Other，输入新工作区的文件夹名称，然后单击 OK。您可以在 Copy Settings 部分选择是否复制当前工作区的布局和工作集。\n\
