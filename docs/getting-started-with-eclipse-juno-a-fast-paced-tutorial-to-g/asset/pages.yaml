- pgno: 204
  md: '# Creating new views


    When creating an Eclipse plugin, you might need to create a whole new view instead
    of extending the current ones. Like almost everything in the Eclipse platform,
    this is achieved by implementing extension points.


    The org.eclipse.ui.views is the most important extension point regarding views.
    There are three elements in this extension point:


    +   - **View**: Describes the view itself. It contains information regarding the
    view''s class, category, icon, and name

    +   - **Category**: If the view you''re creating doesn''t belong to any of the
    existing categories , you can create a new one using this element. You can see
    all the existing views and its categories by selecting **Window | Show View |
    Other**.

    +   - **StickyView**: Use this element if you want to create a view that will
    be shown in all perspectives by default.


    The class required by the view element must be one that implements the org.eclipse.ui.part.IViewPart
    interface. It''s more recommended, however, to extend the ViewPart abstract class,
    which is a base implementation of IViewPart that makes the task of implementing
    IViewPart easier. It leaves two methods to be implemented:


    +   - `createPartControl(Composite parent)`: This is the method that''s called
    when the view is created. According to the method comments of `IViewPart`, the
    following actions must be taken in implementations:

    +     - Create one or more controls within the parent

    +     - Set the parent layout as needed

    +     - Register any global actions with the site''s `IActionBars`

    +     - Register any context menus with the site

    +     - Register a selection provider with the site, to make it available to the
    workbench''s `ISelectionService` (optional)

    +   - `setFocus()`: This method is called when focus is set in your view. Code
    in this method should focus one of the elements inside the view.


    Basically, every SWT element presented in Chapter 5, SWT, and Chapter 6, More
    SWT, can be used to compose a view, as well as your own custom composites.'
  merge: -1
  img_proc: true
- pgno: 205
  md: "# Saving the view's current state\n\nIt's important for most of the views to\
    \ be able to save its state so that it can be retrieved when Eclipse is restarted.\
    \ There is a saveState(IMemento memento) method in IViewPart that must be implemented\
    \ in order to achieve that. If you take a look at ViewPart's implementation, though,\
    \ you will be disappointed:\n\n```\npublic void saveState(IMemento memento) {\n\
    \    // do nothing\n}\n```\n\nIf you want your view to be capable of saving its\
    \ own state, you have to override this method. Let's see how to do this.\n\nWe\
    \ can see that the method receives a IMemento object as a parameter. This is the\
    \ object we have to update in order to save the view's state. From the IMemento's\
    \ JavaDoc, mementos are objects to which you can assign a \"mapping of arbitrary\
    \ string keys to primitive values, and by allowing mementos to have other mementos\
    \ as children (arranged into a tree)\". This mapping is created by calling the\
    \ put<type>(String key, <type> value) methods, such as putFloat, putInteger, putString,\
    \ and so on. Child mementos are created with the createChild method.\n\nOnce you\
    \ have accordingly implemented the saveState method, Eclipse guarantees that the\
    \ information stored in the memento object will be available across different\
    \ Eclipse sessions, using an xml-based storage format under the hood. However,\
    \ we still have to tell Eclipse how to use this information to recompose the view's\
    \ state. This is done by overriding the init(IViewSite site, IMemento memento)\
    \ method, since the ViewPart implementation simply ignores the memento object\
    \ and delegates to init(IViewSite site). As a general rule, information from the\
    \ memento is only saved in the current object, leaving the task of assigning the\
    \ values back to the SWT elements to the createPartControl method. This happens\
    \ because the platform calls init before createPartConrol.\n\n# Adding context\
    \ help to your view\n\nThe easiest way of getting help in Eclipse is through the\
    \ Dynamic Help, which can be activated in Help | Dynamic Help. This opens a Help\
    \ view which contains basic information and usage guidance for the currently focused\
    \ view. Each view provides the help content, and the Eclipse platform takes care\
    \ of assembling the help view."
  merge: -1
  img_proc: true
- pgno: 206
  md: "To provide help content, plugins must implement the `org.eclipse.help.contexts`\
    \ extension point. The implementation must provide a contexts element, which points\
    \ to a Context Help file in the XML format. Instead of creating it from scratch\
    \ and editing manually, you can use the **Context Help** editor. To do so, create\
    \ the XML file by selecting **File | New | Other**, and then browsing to **User\
    \ Assistance | Context Help**. Provide the filename and location in the next page,\
    \ and click on **Finish**. You can add topics and commands to the context. Topics\
    \ point to HTML files that will be rendered in the **Dynamic Help** view.\n\n\
    # Example of a new view\n\nTo illustrate what we have seen about creating a new\
    \ view so far, let's create a very simple one containing just a label and a text\
    \ field. Let's begin by extending ViewPart:\n\n```\n```java\npackage sampleview.views;\n\
    \nimport org.eclipse.swt.SWT;\nimport org.eclipse.swt.layout.GridData;\nimport\
    \ org.eclipse.swt.layout.GridLayout;\nimport org.eclipse.swt.widgets.Composite;\n\
    import org.eclipse.swt.widgets.Label;\nimport org.eclipse.swt.widgets.Text;\n\
    import org.eclipse.ui.IMemento;\nimport org.eclipse.ui.IViewSite;\nimport org.eclipse.ui.PartInitException;\n\
    import org.eclipse.ui.part.ViewPart;\n\npublic class SampleView extends ViewPart\
    \ {\n\n    public static final String ID = \"sampleview.views.SampleView\";\n\n\
    \    private Label label;\n    private Text text;\n    private IMemento memento;\n\
    \n    public SampleView() {\n    }\n\n    public void createPartControl(Composite\
    \ parent) {\n        parent.setLayout(new GridLayout(2, false));\n        label\
    \ = new Label(parent, SWT.NONE);\n        label.setText(\"Write down something\
    \ here:\");\n\n        text = new Text(parent, SWT.BORDER);\n```\n```"
  merge: -1
  img_proc: true
