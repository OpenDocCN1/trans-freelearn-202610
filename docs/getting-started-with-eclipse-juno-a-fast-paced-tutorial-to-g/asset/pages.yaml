- pgno: 185
  md: '# Running and debugging a plugin project


    Running or debugging a plugin project is not different than how we do it with
    a Java project. Simply click on the green play button in the toolbar to give a
    go to our **Hello World** plugin. You will see that a new Eclipse instance will
    start. By default, this Eclipse instance contains all of the plugins installed
    in your development environment, plus every plugin project that''s open in your
    workspace. This test instance is called Runtime Workbench.


    Look for an Eclipse symbol in the toolbar of your runtime workbench. Click on
    it, and you''ll be greeted with the **Hello, Eclipse World** message.


    Debugging works just the same. Stop the current runtime workbench by clicking
    on the red square button in the console or by closing the Eclipse window. Place
    a breakpoint in the `SampleAction` class (on line 59), and hit the **Debug** button
    in the toolbar (the one with a green bug). Now, click on our **Hello World** button
    in the runtime workbench. The execution will be halted in the selected line. Everything
    that was discussed in *Chapter 3, Unit Testing with JUnit and Debugging* about
    debugging is also valid here.


    # Running and debugging configurations


    Eclipse provides further configurations for running and debugging plugin applications.
    In the top menu, select **Run | Run Configurations** to take a closer look at
    them.


    In the **Main** tab, you will be able to select the workspace location for the
    runtime workbench. That''s where the projects you create while testing and debugging
    your application will be stored. You can choose to clear the workspace before
    starting the runtime workbench by clicking on the **Clear** option beneath the
    workspace location. The **Program to Run** section in the **Main** tab allows
    you to choose a different product or application to run, and **Java Runtime Environment**
    allows you to use a different JRE for the runtime environment. This can be useful
    if you are testing your plugin''s compatibility with different JRE''s.


    The **Arguments** tab allows you to choose arguments both for Eclipse and for
    JVM to be used when launching the runtime workbench.'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Eclipse Development


    The plugins tab allows you to select the plugins that will be loaded in the runtime
    workbench, both from your Workspace and from your development environment. This
    can be useful to test your workspace projects individually without having to close
    them, or to remove the unrelated plugins from the development environment to save
    your machine''s resources. The following screenshot displays the Plugins tab of
    the **Run Configurations** menu:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_186_0.png)


    In the **Configuration** tab, you can set the `config.ini` file that you want
    to use for the runtime workbench instance, as well as modify the configuration
    area. The **Tracing** tab allows you to enable tracing for each plugin. Tracing
    is an interesting feature that allows you to turn on or off debug messages during
    runtime. This can be particularly useful if you are providing support for an Eclipse-based
    application installed in the client''s environment. You can simply require the
    client to enable tracing for your plugin instead of sending him or her a debug
    version of the plugin with debug messages enabled. We won''t cover tracing on
    this book. The **Environment** and **Common** tabs are just the same as in a regular
    Java application.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Extension points


    Extension points are the mechanism that Eclipse uses to allow the plugins to extend
    and modify other plugins'' behavior. The main goal of the extension point concept
    is to provide a loosely-coupled architecture, exposing a few interfaces that can
    be implemented by other plugins. Both the extension points and its implementations
    are declared in the plugin.xml file.


    The Eclipse platform provides a number of these extension points to allow plugins
    to contribute to various elements of the IDE. We will take a look at some of these
    extension points throughout this chapter, but a complete list of them can be found
    in the eclipse documentation, which can be found at http://help.eclipse.org/indigo/topic/org.eclipse.platform.doc.isv/reference/extension-points/index.html.


    Our Hello World plugin implements one of these extension points. Let''s see how
    it looks like by opening the Extensions tab in the plugin manifest editor.


    ![](img/d7c3f2018603810fae83e1a6fd98749e_187_0.png)


    The Extensions tab shows us that, in order to add a button to the toolbar or a
    new entry to a menu, our plugin implements an extension point called org.eclipse.ui.actionSets.
    You can have more information about this extension point by selecting it in the
    extensions list and clicking on Show extension point description.


    # Declaring an extension point


    Currently, our HelloWorldPlugin project only implements extension points provided
    by other plugins, but doesn''t declare any extension points itself. Let''s learn
    how to do it by expanding our Hello World plugin to declare one. We will create
    an extension point that allows other plugins to provide the message displayed
    when clicking on the toolbar button.'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'To create a new extension point, select the **Extension Points** tab in the
    plugin manifest editor and click on the **Add** button in it. You will be prompted
    to provide three properties: **ID**, **Name**, and **Schema**. The ID is an internal
    unique identifier of your extension point. To guarantee its uniqueness, you might
    want to use the reverse domain name notation to create the ID, containing the
    domains from less to more specific to which your extension point belongs. Let''s
    use `com.packt.messageProvider` as ID. As you fill this property, the **Schema**
    is automatically filled with the same content, followed by the `.xsd` extension.
    The **Point Name** property is a human-readable name for the extension point.
    Let''s use `Message provider` here. When you''re done, click on **Finish**. A
    new editor called schema editor will be opened. The following screenshot shows
    an example of schema editor:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_188_0.png)


    Schemas are XML files that describes extension points. These files are identified
    by a `.xsd` extension and, just like we did with `plugin.xml`, `build.properties`,
    and `MANIFEST.MF` files, we will use an editor to add content to it instead of
    editing it directly. The schema editor contains three horizontal tabs: **Overview**,
    **Definition**, and **Source**.


    The first horizontal tab contains a basic description of your plugin. It also
    allows you to add documentation to your extension point, which will be shown directly
    in the Eclipse interface, making it easy for other developers to find information
    about how to implement your extension point. Remember the `org.eclipse.ui.actionSets`
    description that we saw in the **Extensions** tab? That''s where it comes from.
    It''s very important to thoroughly describe your extension point, as well as provide
    usage examples and API information.'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'Now, we have to describe what the extension point contains, that is, what other
    plugins can provide to our plugin. For this, we have to add new elements to the
    extension point. Open the **Definition** tab of the schema editor to see a list
    of the extension point''s elements.


    Click on **New Element** and change the new element''s name to `hello_message`.
    You can add a small description to the element. Now add an attribute to this element
    by selecting it and clicking on **New Attribute**. Rename it to `value`. The other
    properties of the attribute allow you to choose the type that must be provided
    (string, Boolean, resource, Java classes, or identifiers). In our case, we want
    the extensions to provide a string. Your **Definition** tab should look as follows:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_189_0.png)


    Once the element is defined, we must declare how it composes the extension point.
    If we had another type of message (a goodbye_message, for example), we could require
    that the extension point implementation had one or more of each. Element compositions
    are achieved by adding choices and sequences to the "extension" element. Choices
    are an "or" composition, while sequences are an "and" composition. These elements
    can be used together to create more sophisticated compositions.


    Since we just want one `hello_message` element per extension point implementation,
    let''s add a new sequence to the extensions element by selecting it and clicking
    on **New Sequence**. Configure both **Min Occurrences** and **Max Occurrences**
    to be 1. Now, right-click on the **Sequence** entry, and select new | `hello_message`
    to declare that we need a `hello_message` element implementation.


    Choices work in a very similar fashion. Add a choice to extension element and
    add elements to this choice. If any of the elements inside the choice are satisfied,
    the extension point is successfully implemented.'
  merge: -1
  img_proc: true
- pgno: 190
  md: "# Providing interfaces\n\nOne of the most utilized mechanisms of extension\
    \ points is to provide interfaces that can be implemented by other plugins. To\
    \ give an example of how this works, let's modify our extension point a little:\
    \ instead of requiring a string from other plugins, we'll ask for a class that\
    \ implements a IMessageProvider interface.\n\nLet's start by creating the interface\
    \ in our plugin. The interface must be placed inside a package that will be exported\
    \ in order to be implemented by other plugins, so make sure you create a new package\
    \ to store the interface. Create a new interface in the project's src folder called\
    \ IMessageProvider.java with the following content:\n\n```\npublic interface IMessageProvider\
    \ {\n\n    public String getHelloMessage();\n\n}\n```\n\nAs you can see, the interface\
    \ only requires a getHelloMessage() method that returns a string to be implemented.\n\
    \nNow let's modify the extension point's schema to require an interface implementation\
    \ instead of a string. To begin with, the name \"value\" doesn't make much sense\
    \ anymore, so let's change it to message_provider. Now change the Type property\
    \ from string to Java. Two new properties will appear: Extends and Implements.\
    \ Since we are providing an interface, let's fill the Implements field (remember\
    \ that classes are extended and interfaces are implemented). Click on the Browse\
    \ button and select our IMessageProvider. Remember that you can use the filter\
    \ to easily find it. Click on OK.\n\nThe following screenshot shows how our extension\
    \ point will look in the end:\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_190_0.png)"
  merge: -1
  img_proc: true
- pgno: 191
  md: "Plugins do not externalize source packages by default. This means that the\
    \ interface will not be visible to other plugins, thus making it impossible to\
    \ be implemented. To export the package that contains the interface, we will switch\
    \ to the Runtime tab of the plugin manifest editor. Click on the Add button under\
    \ the Exported Packages section, select the package that contains the interface,\
    \ and click on OK.\n\n# Using extension points implementation in code\n\nOnce\
    \ the extension point is declared, code in our plugin must be modified in order\
    \ to utilize what other plugins are providing through it. In our example plugin,\
    \ this means switching a hardcoded Hello World message for a message provided\
    \ by an extension point implementation.\n\nLet's take a look at where in the code\
    \ the Hello World message is actually being displayed. The following piece of\
    \ code is in the SampleAction class, which has been generated by the Hello World\
    \ plugin project template:\n\n```\npublic void run(IAction action) {\n    MessageDialog.openInformation(\n\
    \        window.getShell(),\n        \"HelloWorldPlugin\",\n        \"Hello, Eclipse\
    \ world\");\n}\n```\n\nThis is where we'll work. The first step of utilizing the\
    \ content coming from the extension points is verifying if there are extensions\
    \ available and, if there's more than one, which extension the plugin should use.\
    \ Keep in mind that the whole idea of extension points is to decouple plugins,\
    \ so your plugin should not crash if there are no implementations to your extension\
    \ point.\n\nA registry of the available extension point implementations is provided\
    \ by the Eclipse platform. Once you have it, your code must verify for implementations\
    \ for your specific extension point, and then look for the elements you need."
  merge: -1
  img_proc: true
- pgno: 192
  md: "This is an example of how the run method should be refactored in order to utilize\
    \ the message coming from the extension point:.\n\n```\npublic void run(IAction\
    \ action) {\n    String helloMessage = null;\n    IExtensionRegistry extensionRegistry\
    \ = Platform.\ngetExtensionRegistry();\n    IConfigurationElement[] elements =\
    \ extensionRegistry.getConfigurat\nionElementsFor(\"com.packt.messageProvider\"\
    );\n    try{\n        for (IConfigurationElement element : elements) {\n     \
    \       Object object = element.createExecutableExtension(\"mes\nsage_provider\"\
    );\n            if (object instanceof IMessageProvider){\n                IMessageProvider\
    \ messageProvider =\n(IMessageProvider)object;\n                helloMessage =\
    \ messageProvider.\ngetHelloMessage();\n            }\n        }\n    } catch\
    \ (CoreException e){\n        e.printStackTrace();\n    }\n\n    if(helloMessage\
    \ == null){\n        helloMessage = \"No providers found\";\n    }\n\n    System.out.println(helloMessage);\n\
    \    MessageDialog.openInformation(\n        window.getShell(),\n        \"HelloWorldPlugin\"\
    ,\n        helloMessage);\n}\n```\n\nIn the preceding code, we use the getExtensionRegistry\
    \ static method from the Platform class to get an IExtensionRegistry object that\
    \ contains all the information about extension points available in the platform.\
    \ We then use this object to get all the configuration elements available for\
    \ the com.packt.messageProvider extension point. Note that there's no real concern\
    \ on which extension should be used in case there's more than one it will simply\
    \ iterate through every configuration element available and assign it to the helloMessage\
    \ variable. There's a fallback in the case where no extensions are found and we\
    \ get a printed message \"No providers found\". So regardless of the number of\
    \ implementations available to our extension point, our plugin code will execute\
    \ just fine."
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Implementing an extension point


    Now that we have created the extension point, let''s create a new plugin that
    implements it. Start by creating a new plugin project named MessageProvider. We
    don''t want to use any templates this time, so unmark the Create a plugin using
    one of the templates checkbox in the Templates page of the new plugin project
    wizard.


    Before we start working with the extension point, we have to declare that the
    MessageProvider plugin depends on HelloWorldPlugin, If there''s no HelloWorldPlugin
    in the platform, there''s no extension point to implement and MessageProvider
    plugin is pointless. To declare the dependency, let''s open the plugin manifest
    editor for the MessageProvider project and switch to the Dependencies tab. Click
    on the Add button in the Required Plug-ins section and type HelloWorldPlugin.
    The following screenshot shows how the Dependencies tab should look like:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_193_0.png)


    Now we have to declare that our plugin contains an implementation of the messageProvider
    extension point. Switch to the Extensions tab, and click on the Add button. Select
    the com.packt.messageProvider extension point.


    The next step is to actually implement the messageProvider extension point. As
    you can see, the com.packt.messageProvider extension already contains a hello_message
    element. The Extension Element Details pane shows us what we already know. We
    need a class that implements IMessageProvider to implement this extension point.'
  merge: -1
  img_proc: true
- pgno: 194
  md: "You can create the class by simply clicking on the message_provider* link in\
    \ the Extension Elements Details pane. Now copy the following code into it:\n\n\
    ```\nimport helloworldplugin.IMessageProvider;\n\npublic class MyMessageProvider\
    \ implements IMessageProvider {\n\n    @Override\n    public String getHelloMessage()\
    \ {\n        return \"Hello world from MessageProvider\";\n    }\n\n}\n```\n\n\
    As you can see, this is a very basic implementation. We are now ready to test\
    \ our extension point and its implementation. Select one of the two projects that\
    \ we've just created and select Run | Run as | Eclipse Application. The message\
    \ coming from the extension point is displayed when we click on the button, as\
    \ shown in the following screenshot:\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_194_0.png)\n\
    \n# Contributing to the platform's menus and toolbars\n\nIn the example that we\
    \ used to illustrate how to declare and implement an extension point, we created\
    \ a plugin that adds a button to the Eclipse toolbar. Now, let's take a more careful\
    \ look at how this button was added there, as well as find out how we could add\
    \ elements to other parts of the Eclipse interface."
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Actions versus commands


    The first thing we should know is that there are two different ways of contributing
    to menus in the Eclipse UI: actions and commands. The action way that we used
    in the previous example might look simpler at first, but simplicity has a price
    here; as you can see, logic and interface are closely tied, which might lead to
    code replication if you want to add, for example, a right-click menu entry that
    performs the same action as the toolbar button. As you know, code replication
    is a project''s nightmare and should be avoided at all costs. For this reason,
    usage of actions is discouraged in detriment of commands.


    The Command framework solves this issue by completely decoupling handling from
    interface. It requires implementations for three extension points: org.eclipse.ui.menus,
    org.eclipse.ui.commands, and org.eclipse.ui.handlers. The menus'' extension point
    is responsible for adding the interface element to the platform. The commands
    extension point declare commands, which are implemented by handlers.


    To show how to use the commands framework, let''s implement the same hello world
    toolbar button that we''ve just implemented, but now using commands instead of
    actions. Create a new HelloWorldCommand plugin project without using any templates
    to start.


    # org.eclipse.ui.menus


    As we already discussed, this extension point is used to add user-interface contributions
    to Eclipse, and it replaces a number of extension points from the action framework,
    such as org.eclipse.ui.ActionSets, org.eclipse.ui.EditorActions, and org.eclipse.ui.popupMenus.


    Add an implementation of this extension point and a menuContribution element with
    the following parameters:


    +   - **locationURI**: toolbar:org.eclipse.ui.workbench.file?after=additions

    +   - **allPopups**: false


    LocationURI specifies where in the Eclipse UI the contribution will be added.
    In this case, it will appear right next to the Print button. In the next section,
    we''ll learn how to discover locationURIs using the plug-in spy.


    If the allPopups Boolean value is set to false, this menu contribution will only
    be added to context menus that include a marker called "additions".'
  merge: -1
  img_proc: true
- pgno: 196
  md: "# org.eclipse.ui.commands\n\nThe commands extension point declares commands\
    \ that will be tied to different menu entries. Add an extension to the command\
    \ extension point and a command element inside it with the following properties:\n\
    \n+   - **id:** `com.packt.helloworldcommand.command`\n+   - **name:** `helloWorldCommand`\n\
    \n# org.eclipse.ui.handlers\n\nThis is where the command is actually implemented.\
    \ This is done by creating a class that extends org.eclipse.core.commands.AbstractHandler.\
    \ So, before adding the implementation for the handlers extension point, let's\
    \ create a class called DefaultHelloWorldCommandHandler with the following code:\n\
    \n```\npackage com.packt.helloworldcommand;\n\nimport org.eclipse.core.commands.AbstractHandler;\n\
    import org.eclipse.core.commands.ExecutionEvent;\nimport org.eclipse.core.commands.ExecutionException;\n\
    import org.eclipse.jface.dialogs.MessageDialog;\nimport org.eclipse.swt.widgets.Shell;\n\
    import org.eclipse.ui.PlatformUI;\n\npublic class DefaultHelloWorldCommandHandler\
    \ extends AbstractHandler {\n\n    @Override\n    public Object execute(ExecutionEvent\
    \ event) throws\nExecutionException {\n        Shell shell = PlatformUI.getWorkbench().\n\
    getActiveWorkbenchWindow().getShell();\n        MessageDialog.openInformation(shell,\
    \ \"Hello\", \"Hello World!\");\n        return null;\n    }\n\n}\n```\n\nIn the\
    \ preceding code, the only method you have to implement is execute, which is obviously\
    \ the one that will be called when the command is executed.\n\nNow that we have\
    \ the handler implemented, let's reference to it in the Extensions tab. Create\
    \ an implementation for org.eclipse.ui.handlers and add a handler element containing\
    \ the following properties:"
  merge: -1
  img_proc: true
- pgno: 197
  md: '+   - **commandId:** `com.packt.helloworldcommand.command`

    +   - **class:** `com.packt.helloworldcommand.DefaultHelloWorldCommandHandler`


    We have implementations for the three extension points, but note that there''s
    nothing tying up the menu entry with the commands or handlers. This is achieved
    by adding a "command" element to the `menuContribution` element in the `org.eclipse.ui.menus`
    extension points. Create one with these parameters:


    +   - **commandId:** `com.packt.helloworldcommand.command`

    +   - **label:** `click me`


    Your **Extensions** tab should look like the following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_197_0.png)


    Now let''s see how our plugin behaves by running it. You should see a button with
    **click me** written on it right beside the **Print** button. Click on it to be
    greeted with yet another hello world message. If you want an icon instead of a
    text in the toolbar, navigate to `org.eclipse.ui.menus` | `menuContribution` |
    `command` element to edit it and change the icon parameter.


    Since the whole point of the command framework is to allow adding the same command
    to multiple UI contributions easily, let''s test this flexibility by adding an
    entry to the menu that pops up when the right-mouse button is pressed. All we
    really need is another `menuContribution` element in `org.eclipse.ui.menus`. So
    go ahead and create another one, full with the command child element, changing
    only the `locationURI` property to `popup:org.eclipse.ui.popup.any?after=additions`.'
  merge: -1
  img_proc: true
- pgno: 198
  md: 'Run the plugin again, and right-click on the Package Explorer in the runtime
    workbench UI. You should see an entry as follows:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_198_0.png)


    Clicking on it has the same result as clicking the toolbar button.


    # Restricting and disabling contributions


    You might have noticed that the click me entry in the right-click menus is not
    restricted to the Package Explorer. Right-click other views, such as Java Editor
    or Outline, and you will see that the entry is everywhere. This is probably not
    the desired behavior; most of the menu contributions apply to some context only,
    and leaving the entry visible or enabled where they don''t apply will only add
    clutter to the Eclipse interface.


    Fortunately, there''s an easy way of hiding the menu contribution. The `command`
    element under `menuContribution` has an optional element called `visibleWhen`.
    As the name implies, it allows you to determine under which conditions that command
    will be enabled.'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Let''s restrict the right-click menu entry visibility to appear only in text
    editors. There are two ways of doing this. One is implementing the isEnabled()
    method in the AbstractHandler extension registered for this command (DefaultHelloWorldCommandHandler
    in this case). The return value of the method''s execution will determine if the
    contribution is visible or not. The other way is by adding child elements to the
    visibleWhen element in order to build an expression that is to be evaluated to
    determine the element''s visibility. We''ll go for the second option in this example.


    Start by adding the visibleWhen element. The checkEnabled property in the element
    determines which of the two methods of restricting visibility will be used. If
    true, isEnabled() method will be evaluated, and any child element of visibleWhen
    will be ignored. If false, child elements will be used. Set this property to false.


    There are many types of valid child elements to the visibleWhen element. The with
    element is utilized to evaluate a variable. These variables are provided by the
    extension points and the Eclipse framework. A comprehensive list of the variables
    provided by Eclipse can be found at the Eclipse wiki page in this link: http://wiki.eclipse.org/Command_Core_Expressions#Variables_and_the_Command_Framework.
    Some examples of such variables are activeEditor, which contains the currently
    active editor, activeWorkbenchWindow, which contains the currently active workbench
    window, and activePart, which contains the currently active part. A part is a
    visual component within the workbench that can be either a view or an editor.
    Since we want our contribution to be visible in editors only, we''ll evaluate
    the activePart variable. So go ahead and add a with element, and change it''s
    variable value to activePart.


    We can add now other elements under the with element to evaluate the activePart
    variable. activePart contains the instance of the the current active part in the
    workbench, so to verify if it is a text editor or not, we have to check which
    classes this object instantiates. This is done with the instanceof element. Let''s
    add it and provide org.eclipse.ui.texteditor.AbstractTextEditor to the value parameter.
    For this to work, however, we must have access to the org.eclipse.ui.texteditor
    package, which belongs to the org.eclipse.ui.editors plug-in. Switch to the Dependencies
    tab and add the plugin to the dependencies list. Now switch back to the Extensions
    tab and you should be able to find the AbstractTextEditor class by clicking on
    the Browse button.


    Notice that there are many other child elements to visibleWhen, such as "and"
    and "or", which allow you to compose different conditions. The systemTest element
    can be used to test system properties, such as osgi.os, that contains the operating
    system on which Eclipse is running (Win32, Linux, AIX, Solaris, and so on), osgi.ws,
    which contains the current windowing system (Win32, Motif, GTK, and so on) and
    osgi.arch, which contains the architecture on which the platform is running (x86,
    x86_64, PPC, SPARC, and so on).'
  merge: -1
  img_proc: true
- pgno: 200
  md: "The following screenshot shows how your org.eclipse.ui.menus extension should\
    \ look:\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_200_0.png)\n\nNow, run your\
    \ project, and try right-clicking on the runtime workbench views. Only text editors\
    \ will show the click me entry.\n\nMenu entries can also be disabled instead of\
    \ hidden. Take the copy entry in a text editor as an example; it's grayed out\
    \ and un-clickable when there's no text selected, although it behaves normally\
    \ when there's text selected. Let's add that same behavior to our menu entry to\
