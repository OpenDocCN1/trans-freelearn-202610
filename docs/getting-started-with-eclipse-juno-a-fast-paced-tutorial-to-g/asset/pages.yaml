- pgno: 63
  md: '# Testing with JUnit


    Using JUnit, it is remarkably simple to write repeatable tests. Actually, from
    day one, being simple to use was a key design decision made by Kent and Erich.
    According to them, if JUnit was not easy to learn and execute, programmers would
    not actually use it.


    Basically, when you need to test something using JUnit, you perform these basic
    actions:


    +   1. Create the Java class that is going to enclose all your tests. Make sure
    to name it according to the convention we described in the previous section.

    +   2. Create a method and annotate it with `@org.junit.Test`.

    +   3. Write the code related to the behavior that you want to test inside the
    previously created method.

    +   4. To check whether the code under test yielded the expected result, import
    `org.junit.Assert` statically, and invoke one of the methods of the Assert family
    (`assertTrue`, `assertEquals`, and so on) to compare the result of your test with
    the expected result.


    The JUnit framework has several other features, but these are the ones you will
    need to understand in order to get started. So, let''s dive into the technical
    details of these basic features by testing a Java class that implements a basic
    calculator.


    First, we need a new Java project for our calculator class. So, inside Eclipse
    navigate to **File** | **New** | **Java Project**. To give our project a name,
    type `BasicCalculatorProject` in the **Project name** field, and then click on
    **Finish**. You might be prompted to switch to the Java Perspective. If this happens,
    answer **Yes**. After performing all these steps, the **Package Explorer** view
    should show your new Java project. However, if something goes wrong and you can
    run into problems, go back to the previous chapter and review how to create a
    Java project.


    Inside our recently created Java project, create a new package. To create a package
    named `chapter3.basiccalc`, select the `src` folder, right-click on it, and navigate
    to **New** | **Package**. Enter the package name, and click on the **Finish**
    button.'
