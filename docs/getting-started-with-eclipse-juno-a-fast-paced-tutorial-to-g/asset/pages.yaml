- pgno: 73
  md: "In order to use `@Ignore`, you have to import `org.junit.Ignore`. Once imported,\
    \ `@Ignore` can be used to annotate the methods, as illustrated in the following\
    \ code. In the following code, we are telling JUnit to ignore `testSubtract`,\
    \ because it has not been properly implemented yet. Go ahead and mark all methods\
    \ but `testAdd()` with `@Ignore`. Executing our test suite now will result in\
    \ no failures.\n\n```\n```java\n@Ignore(\"Not implemented yet\")\n@Test\npublic\
    \ void testSubtract() {\n    fail(\"Not yet implemented\");\n}\n```\n```\n\nNow\
    \ that the other test cases won't get in our way, let's start implementing `testAdd()`.\
    \ Fortunately, writing unit tests is very straightforward. You just need to call\
    \ chunks of your application's code, get the results back, and then check if they\
    \ are exactly what you expected. Instead of having to write lots of if statements\
    \ to compare the results when using JUnit, you can rely on the assert methods.\
    \ Using assert methods, you specify the expected outcome, and then pass the actual\
    \ result from invoking your application code.\n\nFor example, we can implement\
    \ our `testAdd()` method by performing simple addition operations as shown in\
    \ the following code. First, we need to create an instance of `BasicCalculator`.\
    \ Second, we invoke the chunk of code that we are trying to test, namely, the\
    \ `add()` method. Finally, we use an assert method to evaluate the result of invoking\
    \ the `add()` method by passing 2 as parameter twice. The `assertEquals()` method\
    \ expects `getResult()` to return 4. Upon running our test case, we can see that\
    \ the method under test seems to be working properly since `getResult()` returned\
    \ 4, as expected. Here is how we implemented `testAdd()` :\n\n```\n```java\n@Test\n\
    public void testAdd() {\n    BasicCalculator calculator = new BasicCalculator();\n\
    \    calculator.add(2);\n    calculator.add(2);\n    // result should be 4\n \
    \   assertEquals(4 /*expected*/, calculator.getResult() /*actual*/);\n    calculator.clear();\n\
    }\n```\n```\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_73_0.png)\n\n> Usually,\
    \ writing unit tests should be easy. If writing them is taking too long, it might\
    \ mean that your design needs some improvement; you should think about refactoring\
    \ your code."
  merge: -1
  img_proc: true
- pgno: 74
  md: "Before implementing more tests, a few more words about assert methods are in\
    \ order. As you can see in the previous example, assertEquals() takes two parameters,\
    \ the expected result and the value to check against the expected result. In our\
    \ code, we are referring to this method through static import (check out the static\
    \ import statement that Eclipse autogenerated for us). If we were to use assertEquals()\
    \ without statically importing it, we would have to do more typing: Assert.assertEquals(4,\
    \ calculator.getResult()).\n\nThe test for subtraction operations is similar to\
    \ the one for addition operations. Again, we create an instance of the class under\
    \ test, invoke the chunk of code under test, and check if the invoked code yielded\
    \ the expected outcome. Go ahead and implement testSubtract() as shown in the\
    \ following code snippet. Note that our testSubtract() method relies on add()\
    \ to set the stage for subtract(). More specifically, add() is invoked to store\
    \ the value 35 into the calculator's result variable. Then we subtract 5 from\
    \ the result and use an assert method to evaluate whether after performing these\
    \ arithmetic operations the result contains the value 30.\n\n```\n@Test\npublic\
    \ void testSubtract() {\n    BasicCalculator calculator = new BasicCalculator();\n\
    \    calculator.add(35);\n    calculator.subtract(5);\n    assertEquals(30, calculator.getResult());\n\
    \    calculator.clear();\n}\n```\n\nAs you can see, all tests start by creating\
    \ an instance of BasicCalculator (the one upon which the methods under test are\
    \ invoked) and conclude with an invocation to calculator.clear() (in order to\
    \ clear the value stored in result, so that it will not tamper with the results\
    \ yielded by the other test methods). It is always a good idea to eliminate duplicated\
    \ code from both your application and test code. We can extract this duplicated\
    \ code into a method that does all the initialization and configuration of the\
    \ test environment, and a method that contains the cleanup code. In JUnit 4, in\
    \ order to have a method executed before each test case, simply denote it with\
    \ @Before (org.junit.Before). Here is how we can remove part of the duplicated\
    \ code:\n\n```\nprivate BasicCalculator calculator;\n\n@Before\npublic void setup()\
    \ {\n    calculator = new BasicCalculator();\n}\n\n@Test\n```"
