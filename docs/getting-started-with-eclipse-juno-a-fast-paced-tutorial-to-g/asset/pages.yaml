- pgno: 94
  md: 'There may be more than one branch on a given version control system that can
    be selected in the **branch** node.


    The **tags** are usually defined to make it easier to go to a specific revision
    of the product, relating it to a commit; for example, to specify a product version
    number.


    The operations related to **Checkout**, **Update**, and **Commit** are pretty
    similar to what we have presented in the CVS section.


    # Git


    Git works a little bit different from SVN. It does not copy the repository, but
    it clones it. In this context, it is possible to perform any operation locally,
    without a connection to the Internet, because the complete repository is available.
    It is possible to perform several actions, such as branching, merging, or committing.


    A few differences between Git and SVN are as follows:


    +   - Git is distributed

    +   - Git stores the metadata instead of the actual files along with the existing
    commits

    +   - Git can work without an active Internet connection since the operations
    are performed locally


    Eclipse comes with a preinstalled plugin to deal with the Git program. The **EGit**
    is an Eclipse plugin that provides the Git version control system. As previously
    mentioned, because Git is a distributed source code manager, every developer has
    a full copy of all the history of every revision of the code, making the queries
    against the history very fast and versatile.'
