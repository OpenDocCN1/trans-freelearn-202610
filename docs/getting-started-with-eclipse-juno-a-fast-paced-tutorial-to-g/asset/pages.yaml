    \ request,\nHttpServletResponse response) throws ServletException, IOException\
    \ {\n        // TODO Auto-generated method stub\n    }\n}\n```\n```\n\nWe do not\
    \ want you to type stuff into your computer mindlessly, so before modifying the\
    \ generated code to suit our needs, let's go over some of the details of this\
    \ piece of code. Servlet 3.0 API introduced a lot of new features. One of the\
    \ new features is the introduction of annotations, which has made the XML file\
    \ (`web.xml`) that is used to declare servlets—among other things—optional. These\
    \ annotations reside in the package `javax.servlet.annotation`. Using them you\
    \ can define metadata regarding a servlet by simply annotating it with `@WebServlet`.\
    \ You use `@WebServlet` to let Tomcat know that the class in question is a servlet.\
    \ `@WebServlet` can take a number of parameters, and metadata can be specified\
    \ for the servlet using such parameters. In this example, `/HelloWorldServlet`\
    \ represents the URL of the servlet.\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_160_0.png)\n\
