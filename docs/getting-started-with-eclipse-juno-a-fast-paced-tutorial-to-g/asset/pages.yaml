    Upon clicking on Finish, Eclipse will prompt you to change perspective. Dynamic
    web projects are associated with the Java EE perspective. To proceed, select Yes.
    You just created a new project that sports the structure of Java web applications.
    Note that you did not have to create a myriad of folders nor XML files. The next
    screenshot shows an overview of how dynamic web projects are organized. For the
    time being, the important parts for us are the folders, WebContent and Java Resources,
    which is where your servlet will go. WebContent comprises two subfolders: META-INF
    and WEB-INF. The latter is of particular importance here. WEB-INF contains the
    application deployment descriptor (web.xml, a file that contains configuration
    information) and subfolders for other sorts of resources, for instance, configuration
    files. It is important to mention that clients do not have access to the files
    under this folder, which makes it a safe place for files that are not meant to
    be publicly available. Inside WEB-INF there is a subfolder named lib, where you
    place JAR files. Class files that are not packaged in JAR files are placed into
    another folder named classes. However, it bears mentioning that you should not
    place any .class file into this directory. Instead, these files are placed there
    automatically when Eclipse''s Java compiler translates Java source files that
    are in the Java Resources directory. When the compiler runs, it deletes all files
    placed directly in this directory.'
