    # A more elaborate example – yet another calculator\n\nNow that you know the basics,\
    \ let's move on to a more elaborate example. We are going to develop a simple\
    \ calculator (by this time, you might have realized that one of the authors is\
    \ a calculator buff). To keep things simple, our web calculator will be able to\
    \ deal with only two operands at a time. After typing the value for each operand,\
    \ the user will be able to select the operation that he or she wants the calculator\
    \ to compute. The result of the operation will be shown in a new page."
