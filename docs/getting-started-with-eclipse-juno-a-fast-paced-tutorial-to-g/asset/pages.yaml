  md: 'The method call will be marked with an error that says `performOperation is
    undefined`. To create a stub for this method, place the caret over the method''s
    name, open the **Quick Fix** menu, and choose **create method** `performOperation(int,
    int)`. A private method will be created with the correct parameters and return
    type as well as a TODO marker inside it, reminding you that you have to implement
    the method. You can also use a quick fix to create methods in other classes. Using
    the same previous example, you can create the `performOperation()` method in a
    different class, such as the following:


    ```

    OperationPerformer op = new OperationPerformer();

    int a = op.performOperation(b,c);

    ```


    Speaking of classes, quick fix can also create one if you add a call to a non-existing
    class constructor.


    Non-existing variables can also be created with quick fix. Like with the method
    creation, just refer to a variable that still doesn''t exist, place the caret
    over it, and open the **Quick Fix** menu. You can create the variable either as
    a local variable, a field, or a parameter.


    +   - **Remove dead code**: Unused methods, constructors and fields with private
    visibility are all marked with warnings. While the quick fix provided for unused
    methods and constructors is the most evident one (remove the dead code), it''s
    also possible to generate getters and setters for unused private fields with a
    quick fix.


    # Customizing the editor


    Like almost everything in Eclipse, you can customize the Java Editor''s appearance
    and behavior. There are plenty of configurations in the **Preferences** window
    (**Window** | **Preferences**) that will certainly allow you to tailor the editor
    to suit your needs. Appearance-related configurations are mostly found in **General**
    | **Appearance** | **Colors and Fonts** and behavior and feature configurations
    are mostly under **General** | **Editors** | **Text Editors**. Since there are
    lots of different categories and configurations, the filter text in the **Preferences**
    window might help you find what you want. A short list of the preferences you
    will most likely want to change is as follows:


    +   - **Colors and fonts**: Navigate to **General** | **Appearance**. In the **Colors
    and Fonts** configuration screen, you can see that options are organized by categories.
    The ones inside the **Basic** and **Java** categories will affect the Java Editor.

    +   - **Enable/Disable spell checking**: The Eclipse editor comes with a spellchecker.
    While in some cases it can be useful, in many others you won''t find much use
    for it. To disable or configure it, navigate to **General** | **Editors** | **Text
    Editors** | **Spelling**.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '+   - **Annotations:** You can edit the way annotations (warnings and errors,
    among others) are shown in the editor by navigating to **General | Editors | Text
    Editors | Annotations** inside the **Preferences** window. You can change colors,
    the way annotations are highlighted in the code (underline, squiggly line, box,
    among others), and whether they are shown in the vertical bar before the code.

    +   - **Show Line Numbers:** To show line numbers on the left-hand side of the
    editor, mark the corresponding checkbox by navigating to **General | Editors |
    Text Editors**. Right-clicking on the bar on the editor''s left-hand side brings
    a dialog in which you can also enable/disable line numbers.


    # The Problems view


    As we have seen in the Java Editor description, Eclipse uses the output of the
    automatic compilation of the class to mark the compiler''s error and warning messages
    throughout the code. These messages are also listed in the **Problems** view.
    The following screenshot shows how the view looks:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_44_0.png)


    By default, it shows all the errors and warnings in all the open projects inside
    the current workspace. As you can see, every entry contains the compiler error/warning
    message and where the problem is located. By double-clicking on the entry, a new
    tab of the Java Editor, for the resource that contains the problem, will be opened
    (unless the tab already exists), and the caret will be placed on the problem''s
    line.


    # Customizing the Problems view


    The **Problems** view allows plenty of customization to make it easier to browse
    its entries. You can, for example, group them by severity and type by entering
    the **View** menu (white triangle in the top-right side of the view) and selecting
    the **Group By** entry.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'When you have too many different projects open in your workspace, showing all
    the errors and warnings from all the projects might not be a good idea. Fortunately,
    you can customize what the **Problems** view will show. For this, open the **Configure
    Contents** window in the view menu.


    There''s a list of problem configurations on the left-hand side of the window.
    You can choose to show items that match either all or any of the configurations.
    New configurations can be added by clicking on the **New** button. The four default
    configurations cannot be removed or renamed, but they can be edited just as the
    ones you created.


    You can modify the scope in which your configuration will search for problems
    and the type of problem that your configuration contains (some of these types
    may not refer to Java code). You can also filter problems that either contain
    or do not contain some text.


    Another feature of the **Problems** view that helps organize the problems'' listing
    is creating other views. To create another view, open the view menu and choose
    the **New Problems** view. Each view will have its own configuration, so you can
    create multiple views and have each one displaying one type of problem.


    # The Outline view


    The **Outline** view provides an overview of the selected class. By default, it
    shows a list of the class''s fields and methods. You can configure the view to
    hide static elements, fields, nonpublic members, and local types.


    The following screenshot shows the outline of a Book class:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_45_0.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# The Type Hierarchy view


    The **Type Hierarchy** view is where you visualize a class''s superclasses and
    extensions. To load a class''s type hierarchy in this view, select the reference
    to the class name in the Java Editor, right-click on it, and select **Open Type
    Hierarchy**; alternatively, you can use the *F4* keyboard shortcut. This tool
    can be useful when you have an interface and want to list all of its implementations.


    The following screenshot contains the **Type Hierarchy** view showing the supertype
    hierarchy of the `java.awt.Button` class:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_46_0.png)


    There''s an alternative to the **Type Hierarchy** view named **Quick Type Hierarchy**.
    Instead of loading and displaying the **Type Hierarchy** view, it shows the class''s
    hierarchy in a pop-up window. The keyboard shortcut for **Quick Type Hierarchy**
    is *Ctrl + T*.


    # The Call Hierarchy view


    To see all the calls made to a specific method in the project, select a reference
    to the method''s name in the Java Editor, right-click on it, and select **Open
    Call Hierarchy**; alternatively, use the *Ctrl + Alt + H* keyboard shortcut. The
    view provides a full, recursive hierarchy of the selected method''s calls, as
    shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/d7c3f2018603810fae83e1a6fd98749e_47_0.png)


    # Organizing imports


    Eclipse makes it easy to manage a class''s imports. By right-clicking on the Java
    Editor and navigating to **Source | Organize Imports**, all unused imports and
    import classes are removed if there are references to them in the code. You can
    also use the *Ctrl + Shift + O* shortcut to organize the imports.


    To illustrate how this functionality is useful, let''s suppose you want to add
    an `ArrayList` instance in your code. Instead of importing `ArrayList` and using
    it (and you may or may not know the package name of `ArrayList` from the top of
    your head), you can simply write:


    ```

    ArrayList a;

    ```


    Alternatively, you can also press *Ctrl + Shift + O* to add the import.


    If the class''s name occurs in more than one package in the current classpath,
    you will be prompted to choose the one to which you''re referring.


    # Save actions


    You can define actions that are to be performed every time a Java source file
    is saved. For this, navigate to **Window | Preferences** in the toolbar; then,
    in the left menu, navigate to **Java | Editor**, and select **Save Actions**.
    Check the **Perform the selected actions on save** checkbox, and choose the actions
    you want to perform. It''s possible to organize imports automatically to remove
    unused ones, add missing annotations, format the source code, and reinforce code
    style.


    You can also define specific save actions for each project by right-clicking on
    the project''s entry in the Package Explorer and clicking on **Properties**. Then,
    on the new window, navigate to **Java Editor | Save Actions**, and check **Enable
    project specific settings**.'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Enforcing Coding Style with Formatter


    Some companies and open source projects are very strict with their coding style.
    They have clear guidelines on when to skip lines or not, where to put whitespaces,
    how the indentation should look, and so on. All these guidelines can be implemented
    in Eclipse''s Formatter tool that helps the developers to style the code without
    any worry. The formatter will modify your code to comply with a set of coding
    style rules. To run the formatter, navigate to Source | Format in the toolbar
    or use the Ctrl + Shift + F shortcut. You can also force Eclipse to run the formatter
    after file saves using Save Actions.


    To edit your workspace''s formatting settings, go to the preferences window (Window
    | Preferences), and navigate to Java | Code Style | Formatter in the left menu.
    The formatter''s settings are saved under profiles that can be saved, imported,
    and exported. The Edit button brings up a huge number of settings that will suit
    most of your code-styling needs.


    You can also define project-specific format rules. In the project properties window
    (right-click on the project in the Package Explorer and select Properties), navigate
    to Java Code Style | Formatter in the left menu, and check Enable project specific
    settings.


    # Generating code


    In Java, you will eventually find yourself writing similar pieces of code over
    and over. Even though the good usage of design principles tends to minimize this,
    there are some methods, such as getters, setters, and constructors, in most cases
    look exactly the same. Eclipse can help you by generating code for these simple
    methods.


    You can see all the code that Eclipse can generate by right-clicking anywhere
    in the Java Editor and choosing the Source entry. This menu can also be opened
    with the shortcut Alt + Shift + S.


    # Generating getters and setters


    Getters and setters are generally the same. They provide access to some private
    field of the class by either returning its value or by assigning a new one. To
    avoid this no-brainer task and save some time to write real code, choose Generate
    Getters and Setters from the Source entry. You will be presented with a window,
    as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/d7c3f2018603810fae83e1a6fd98749e_49_0.png)


    In the **Generate Getters and Setters** window, you will be able to determine
    for which fields you want to generate getters and setters, as well as choosing
    their access modifiers and where in the code they will be inserted.


    # Generating constructors


    Just like getters and setters, class constructors have a very typical template
    that receives values to be assigned to the class''s fields and calls the superclass''s
    constructor. You can also skip this tedious task by clicking on **Generate Constructor
    using Fields** in the **Source** menu entry. You will be presented with a window
    similar to the **Generate Getters and Setters** one in which you will be prompted
    to choose which fields will have their values initialized by the constructor,
    and where the constructor will be inserted in the code, among others.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Generating the hashCode() and equals() methods


    There are cases in which you have to override the equals() and hashCode() methods
    inherited from the Object class in order to treat two different instances as being
    equal when they have the same parameter values.


    Eclipse also has a template for these two methods. By choosing Generate hashCode()
    and equals() inside the Source menu entry, you will be able to generate methods
    that utilize the fields of your choice to compare two instances and to generate
    the hash code of the instance. The template for the equals() method will check
    if the other object is null, if it is an instance of the same class, and if the
    selected parameters are equal.


    # Generating the toString() method


    To generate a toString() method that returns the value of the class''s fields
    in a human-readable form, choose the Generate toString() option. Like the previous
    generators, this one will allow you to choose which fields you want your toString()
    method to contain.


    # Generating method comments


    Comments for methods in the Javadoc format can easily be generated in Eclipse.
    For this, right-click on the desired method, and navigate to Source | Generate
    Element Comment, or use the shortcut Alt + Shift + J with the caret positioned
    in the method''s signature line. These comments will be shown in Eclipse when
    the user hovers the mouse over the method''s call or when the content assist feature
    is used.


    The generated comment contains the method''s parameters and return type. You only
    have to add a simple description of the method''s usage and some words about the
    parameters when required. An example of a generated comment is presented in the
    following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_50_0.png)


    > These shortcuts might look useless and hard to memorize, but once you get used
    to them, they become incredibly handy and increase your coding speed considerably
    since you''ll rarely have to take your hands off your keyboard when you know the
    ones you use most by heart. The Appendix, Keyboard Shortcuts contains an extensive
    list of all the shortcuts presented in this book.'
  merge: -1
  img_proc: true
