- pgno: 140
  md: '# PrintDialog


    The PrintDialog allows the user to select a printer device to which an application
    can direct its output. In order to use it, the programmer must follow the same
    process as previously explained. We present a snippet of code regarding the use
    of PrintDialog:


    ```

    ...

    PrintDialog printDialog = new PrintDialog(shell, SWT.NONE);

    printDialog.setText("Print");

    PrinterData printerData = printDialog.open();

    Printer p = new Printer(printerData);

    p.startJob("PrintJob");

    p.startPage();

    Rectangle trim = p.computeTrim(0, 0, 0, 0);

    Point dpi = p.getDPI();

    int leftMargin = dpi.x + trim.x;

    int topMargin = dpi.y / 2 + trim.y;

    GC gc = new GC(p);

    Font font = gc.getFont();

    String printText = "printExample";

    Point extent = gc.stringExtent(printText);

    gc.drawString(printText, leftMargin, topMargin + font.getFontData()[0].getHeight());

    p.endPage();

    p.endJob();

    p.dispose();

    ...

    ```


    If this code is executed, the system configuration printer dialog is presented
    to the user, and it will print a simple sentence. In this example, the margins
    are set and a string is drawn using a specified font.


    # Summary


    In this chapter, you have been introduced to more advanced tools of the SWT API
    that are designed for the development of graphical interfaces in Eclipse. You
    have learned some of its principles, such as toolbars, tables, menus, and dialogs.
    We have also focused on how to deal with the SWT events that can be divided into
    typed and untyped events.


    In the next chapter, we will discuss one of the latest trending technologies,
    the web development, by using Eclipse and Apache Tomcat as a basis.'
