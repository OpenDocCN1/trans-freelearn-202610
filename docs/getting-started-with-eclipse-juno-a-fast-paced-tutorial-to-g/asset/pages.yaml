    `result`. Afterwards, in order to store 9 into the slot number 1 of the temporary
    memory, we invoke `addResultToTempAt` and pass 1 as parameter. The expected behavior
    is that the array that represents the calculator''s temporary memory now contains
    the value 9 at index 1. However, the test fails (as shown in the following screenshot).
    Instead of the expected behavior, we get a `NullPointerException`. The only clue
    we got from observing the **Failure Trace** pane is that the exception is thrown
    at line number 16 of our `BasicCalculator` class. Just by looking at this line
    there is no way you can guess what is wrong (well, it also depends on your Java
    experience). It is for problems like this that the debuggers exist. So, we will
    not spoil the fun of discovering the root cause of this problem. Rather, we are
    going to go over the tools of the trade. That is, we are going to explain how
    to use Eclipse built-in Java debugger so that you can find and fix this bug by
