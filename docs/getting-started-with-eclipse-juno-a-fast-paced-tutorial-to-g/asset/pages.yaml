- pgno: 52
  md: 'By choosing a type of generated code or comment and clicking on **Edit**, you
    will be able to add code and variables to the template. You can also choose to
    add comments on newly generated methods and types automatically.


    The code template settings edited in this window are project specific. The settings
    are saved in a metadata file inside the project folder, so when a project is imported,
    the coding style settings are automatically set. This allows you to enforce the
    project''s coding style among all the project''s developers. If you want to edit
    the default code templates for the whole workspace, open the **Preferences** window
    and navigate to **Java | Code Style | Code Templates**. Projects that don''t contain
    any specific setting for templates will use these settings.


    # Refactoring


    Code refactoring can be a real pain. As your project grows, adding a parameter
    to a method or renaming it can turn into a nightmare. Eclipse has some refactoring
    tools that make such tasks a walk in the park.


    # Renaming variables


    Renaming variables manually can be tedious and time consuming. You could resort
    to find/replace to make it a little less painful. But since the variable name
    might be matched in other places of the code, you have to go through each match
    of the variable name and verify if it has to be modified (try renaming a variable
    named x in a big enough class and you''ll understand). If the variable is public,
    you would also have to scan the whole project for references of this variable.


    Luckily, Eclipse does this for you. Just right-click on any occurrence of the
    variable in the code and navigate to **Refactor | Rename**. Type the new variable''s
    name and hit *Enter*.


    You can see that even if the name''s variable occurs in other parts of the code,
    only the text that''s within the variable''s name is modified. Eclipse is only
    able to do that because it compiles the code and uses information from this process
    to know which ones are references of the variable in the code. Because it relies
    on the compiled code, it''s not possible to rename a variable inside a class with
    compiling errors. Eclipse also won''t allow you to change a variable''s name to
    one that already exists in the same context. Renaming also works with other elements,
    such as classes, methods, and interfaces.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/d7c3f2018603810fae83e1a6fd98749e_53_0.png)


    > Don''t let Eclipse''s features soften you! Just because it''s super easy to
    rename a variable, you shouldn''t feel free to ignore good code practice, such
    as variable encapsulation. Good code is good code, regardless of the IDE.


    # Modifying a method''s signature


    Modifying a method''s signature poses similar inconveniences for renaming variables.
    Eclipse can also help in that task. Right-click on the method''s name, and navigate
    to **Refactor | Change Method''s Signature**. You will be presented with a window
    that allows you to change the method''s access modifier, return type, method name,
    and add/remove parameters.


    On modifying a method''s signature, all calls to that method are also modified.
    When you add a new parameter to the signature, you can choose a default value
    that will be added to the calls.


    # Building and running the project


    By default, Eclipse builds your project''s code automatically after every saved
    modification. It uses a customized internal compiler with some interesting features,
    such as executing a class even when it contains errors and incremental compilation
    (which allows compiling just parts of the project). After the modifications have
    been recompiled, it can highlight the problems with the code on the fly. You can
    see a list of these errors in the **Problems** view. If the view is not currently
    visible in the workspace, you can open it by navigating to **Window | Show View
    | Problems**.


    However, if you are working on a project that''s too big, or if you are using
    a machine with low resources, automatic building can slow things down. To disable
    it, click on **Project** and unmark the **Build Automatically** option. Once you
    do this, the project will only be built when you navigate to **Project | Build
    Project** or **Project | Build All**.


    To run your project, select it in the **Package Explorer** view, and click on
    the green play button in the toolbar, or select **Run** from the **Run** tab.
    This will launch your project without any further configuration. If your project
    contains a class with a `public static void main(String[] args)` method, it will
    be executed. If more than one class contains it, you will be able to choose which
    one you wish to run. You can see the output of your program (if there is any)
    in the **Console** tab.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Creating a launch configuration


    If your project needs customizations, such as arguments or a specific classpath
    configuration to run, you can create a launch configuration to meet these needs.
    For this, navigate to Run | Run Configurations. The following screenshot shows
    the launch configuration window:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_54_0.png)


    On the left-hand side of the Run Configurations window, you have a list of all
    the launch configuration categories. To create a new launch configuration for
    a Java project, double-click on the Java Application category. If you have already
    run your application once with the Run button, there will be a default configuration
    in this category.


    By selecting the configuration, you will be presented with the tabs that contain
    the launch configurations. A brief description of what each tab contains is as
    follows:


    +   - **Main**: This is where you will choose the project and the main class.
    The **Search** button beside the **Main class** text field allows browsing through
    all the classes with a main method within the project.

    +   - **Arguments**: This tab lets you set arguments for both the main class itself
    and for the JVM.

    +   - **JRE**: This tab lets you choose the JRE that will be used to run the class.

    +   - **Classpath**: Edit this tab to create a launch configuration with a specific
    classpath configuration. Modifying this tab''s configurations doesn''t modify
    the project''s classpath configuration.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   - **Source**: This tab lets you change the source lookup path. As in the
    **Classpath** tab, these configurations don''t modify the project itself and are
    only valid for this launch configuration.

    +   - **Environment**: This tab allows you to define environment variables for
    this run configuration.

    +   - **Common**: This tab contains the general configuration of the launch. It
    allows you to choose to allocate a console for the launch and write the output
    to a file instead of the console. The **Save as** section refers to the launch
    configuration file.


    # Managing the project build path


    The build path is a list of JARs, classes, and source file folders in which Eclipse
    will look to resolve dependencies. You can edit the build path for a project by
    entering the project''s properties and selecting **Java Build Path**. The configuration
    options have been divided into four tabs:


    +   - **Source**: This contains options to manage the project''s source folders.
    It allows you to create new source folders and add links to external sources in
    the filesystem.

    +   - **Projects**: You can manage you project''s dependency on other projects
    in your workspace in this tab. When you''ll add a dependency to another project,
    you''ll have full access to all of its classes by default. However, some of these
    classes might not be visible when the project is compiled and executed outside
    Eclipse. You might end up with a project that works inside Eclipse but doesn''t
    work when you run the JAR files outside it. To avoid these head-scratching issues,
    you can create access rules to external projects to keep them from using other
    projects'' internal packages. For this, expand the required project, choose **Access
    Rules**, and click on **Edit**. Click on **Add Access Rule** and add **Rule Pattern**.
    You can discourage (compiles but shows a warning) or forbid (compiling fails with
    an error) access.

    +   - **Libraries**: In this tab, you''ll be able to edit the libraries that will
    be added to the project''s build path. You can add JARs and class folders from
    inside or outside the workspace, and you can also add libraries and variables.
    You can add a link from a library to its Javadoc. This will allow you to have
    methods and classes with comments that describe their usage, as if they were in
    your workspace. To add a Javadoc for a library, expand its entry in the list,
    select **Javadoc location**, and click on the **Edit** button. Enter the path
    for the Javadoc and click on **OK**. You can also point to the library''s source
    if you have access to it.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - **Order and Export:** This is where you''ll define which source folders
    and libraries from the project will be exported so that other projects can import
    them. This tab also allows you to choose the order in which the libraries will
    be loaded during runtime. The order will determine which class will be loaded
    in case two different libraries provide that same class. To increase or decrease
    a library''s priority, select it and press the **Up** and **Down** buttons.


    # Summary


    In this chapter, we have covered the basics of Java developing with Eclipse: creating
    and importing a Java project, organizing projects in working sets, adding new
    classes, among others. We went through all of Eclipse''s views for Java developing,
    learned how they can be used to navigate through code, found errors, warnings,
    and much more. Special attention was given to the Java Editor by covering its
    most useful features. We also covered some more advanced topics, such as creating
    templates for code generation and project settings, that can be shared among developers
    in a team to enforce code style and best practices.


    In the next chapter, you will learn how Eclipse can help you debug your Java applications
    as well as test them using JUnit.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 3

    Unit Testing with JUnit

    and Debugging


    By now, you are past the basics and should be familiar with developing Java applications
    using the Eclipse IDE. Although you must be feeling very confident with your recent
    acquired skills, before we go any further, you should know that the more you code,
    the higher are the chances of you introducing a bug into your code. Even with
    all the facilities provided by Eclipse, things are bound to go wrong as Java applications
    scale up. So, we need to build a safety net whenever our application code starts
    to become nontrivial to manage. One way of doing this is to test our programs,
    and testing is one of the things that we are going to cover in this chapter.


    In an ideal world, all problems detected by our tests would be easy to track down
    and fix. Nevertheless, this is not always the case. It turns out that nasty bugs
    might make their way into our code. As mentioned, having a good set of tests helps
    us to spot problems, however, sometimes the feedback provided by the test set
    is not enough, and we need to dig deeper to uncover problems. The act of understanding
    why the software is not behaving properly and working out a fix for it is called
    **debugging**. Debugging is covered later in this chapter.


    When it comes to testing and debugging Java programs, Eclipse has got you covered.
    It comes with built-in features for automating the creation and execution of JUnit
    tests, and it features an impressive Java debugger.


    We will cover the following topics in this chapter:


    +   - Configuring JUnit inside Eclipse

    +   - Organizing, developing, and running unit tests using JUnit inside Eclipse

    +   - Using Eclipse''s built-in debugger when bugs arise and understanding that
    only test methods are not enough to pinpoint the problem cause'
