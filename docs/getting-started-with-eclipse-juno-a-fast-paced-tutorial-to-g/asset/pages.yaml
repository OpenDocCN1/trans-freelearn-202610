    let''s take a step back and see why the servlet container is trying to forward
    the data to webcalculator/PerformCalculation.do.


    The answer to this question boils down to the fact that our form is submitting
    information to something named PerformCalculation.do (take a look at the previous
    chunk of code). Further, given that there is no resource (servlet or HTML page,
    for instance) with such a name, the container shows an error message. In this
    example, PerformCalculation.do is a logical name. That is to say, it is no actual
    filename. We do not want the client to have access to the names of our servlet
    classes. So, we use made-up names that are mapped to actual servlets instead.
    That explains why we got an error page: we have not informed the container yet
    about which servlet answers by the logical name PerformCalculation.do.


    > The .do extension (which implies *do something*) is just a convention.


