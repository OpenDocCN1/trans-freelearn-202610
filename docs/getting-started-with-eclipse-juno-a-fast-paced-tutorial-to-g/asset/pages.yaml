- pgno: 166
  md: 'Our example will comprise three classes, of which two are servlets and one
    is a plain Java class. The plain class implements our calculator itself, while
    the servlets are responsible for the presentation and the interplay between the
    presentation and the calculator class. Let''s start small by implementing the
    first servlet, the one in which the user will type the value of the two operands.
    It bears mentioning that we could have implemented the same functionality using
    plain HTML, but we like to make things more interesting. Moreover, implementing
    this functionality as a servlet will give you another opportunity to put your
    recently acquired knowledge into practice. Okay, let''s get down to business.


    We are going to develop our calculator in a new project. So, first, create a new
    dynamic web project, and name it `webcalculator` (if you do not remember how to
    create a dynamic web project, go back to the beginning of the section in which
    we explain how to create servlets in Eclipse). Then, create a servlet named `OperationSelect`
    and place it in the package `com.example.calculator.web`. The next screenshot
    shows what you should type in the **Create Servlet** window. Remember that you
    do not need to create the package beforehand. Upon creating your servlet, Eclipse
    makes sure to create its associated package structure. Because our project comprises
