- pgno: 112
  md: "The following styles are available for a List widget:\n\n+   - SINGLE: Only\
    \ one item can be selected\n+   - MULTI: Multiple items can be selected\n\nThe\
    \ description of each style is pretty straightforward. We present the available\
    \ events for this control as follows:\n\n+   - SWT.Selection: An item is selected\n\
    +   - SWT.DefaultSelection: An item is double-clicked\n\nA code sample using the\
    \ SWT.Selection method is described, followed by the GUI outcome as follows:\n\
    \n```\nDisplay display = new Display();\nShell shell = new Shell (display);\n\
    final List list = new List (shell, SWT.BORDER | SWT.MULTI | SWT.V_SCROLL);\nfor\
    \ (int i=0; i<10; i++) list.add (\"Item \" + i);\nlist.setSize(200, 200);\nlist.addListener\
    \ (SWT.Selection, new Listener () {\n    public void handleEvent (Event e) {\n\
    \        String string = \"\";\n        int [] selection = list.getSelectionIndices();\n\
    \        for (int i=0; i<selection.length; i++)\n            string += selection[i]\
    \ + \" \";\n        System.out.println (\"Selected: \" + string);\n    }\n});\n\
    shell.pack ();\nshell.open ();\nwhile (!shell.isDisposed ()) {\n    if (!display.readAndDispatch\
    \ ()) display.sleep ();\n}\ndisplay.dispose ();\n```"
