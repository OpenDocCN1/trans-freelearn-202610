- pgno: 113
  md: '![](img/d7c3f2018603810fae83e1a6fd98749e_113_0.png)


    In this example, we added 10 items to a list using the add method, and handled
    the event `SWT.Selection`. When selecting those three items of our example, the
    application outputs the following string to the console: **Selected: 2 4 5.**


    # The Combo widgets


    A `Combo` widget, commonly known as combo box, is a combination of a `Text` widget
    and of a `List` one. The `Combo` widget is generally displayed as a drop-down
    list when an user clicks on a small icon in the `Combo` control.


    It is possible for the user to type in the text field or to choose an item from
    the list, but if desired, the combo box can be set as read-only, where only the
    pre-defined item values can be selected.


    The methods for the `Combo` widget are a combination of the ones from the `Text`
    widget together with the ones from the `List` widget.


    The following styles are available for the `Combo` widget:


    +   - `SIMPLE`: Combo always has a visible list

    +   - `DROP_DOWN`: Combo is a drop-down list

    +   - `READ_ONLY`: Combo is non-editable


    The available events for the `Combo` widget are as follows:


    +   - `DefaultSelection`: Item is double-clicked or *Enter* is pressed

    +   - `Modify`: Text has been modified

    +   - `Selection`: Item is selected'
