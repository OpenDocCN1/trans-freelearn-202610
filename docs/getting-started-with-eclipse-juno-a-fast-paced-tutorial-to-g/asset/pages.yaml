- pgno: 58
  md: '# Testing with JUnit – getting started


    Before describing JUnit, we believe that some words about unit testing are in
    order. When carrying out unit testing activities, emphasis is given to small chunks
    of code. In other words, you are not trying to cover the whole program with a
    single test. Rather, you are testing the foundations of your programs by writing
    a suite of tests per class, one or more tests per method. Writing tests while
    you are working on the code at hand has a host of benefits. For instance, it is
    easier to find bugs when unit testing. This is the case because each unit test
    should evaluate exactly one functional unit, which makes the scope one has to
    hunt for bugs significantly smaller than searching the whole program for bugs.
    However, according to Robert C. Martin, to reap the full benefits of unit testing,
    your test suite has to comply with the following principles (also known as the
    FIRST acronym):


    +   - **Fast**: The tests should be fully automatic and should be able to check
    their own results. But most importantly, you should be able to execute them fast
    so that they can be frequently executed.

    +   - **Independent**: The tests should not depend on each other you should be
    able to run your tests in any particular order.

    +   - **Repeatable**: You should be able to execute your tests in any environment
    (not only production) and as frequently as required.

    +   - **Self-validating**: The tests should produce a Boolean outcome, that is,
    they should either pass or fail; there should be nothing in between. In fact,
    it boils down to avoiding subjective outputs that require manual evaluation.

    +   - **Timely**: According to Robert C. Martin, unit tests should be written
    before the code implements the feature that they evaluate. According to him, it
    is harder to write tests after implementing the production code. From an academic
    perspective, there is no substantial evidence regarding the benefits of writing
    tests before, in comparison to writing tests after implementing the code that
    they evaluate. This is clearly a controversial topic, we do not seek to influence
    you in favor of a particular approach. Try writing tests before and after implementing
    the code and see which works best for you.


    ![](img/d7c3f2018603810fae83e1a6fd98749e_58_0.png)


    > In case you think that writing tests before implementing code suits you better,
    you should read about Test Driven Development (TDD). While you are at that, you
    might also want to study refactoring, which consists of improving your code without
    changing its external behavior.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'Now that you have a basic understanding of the philosophy that backs up unit
    testing, you are ready to take the next step towards writing your own tests –
    learning how to use a unit testing framework. Since JUnit is arguably the most
    popular testing framework in the Java community, we will cover it here.


    More specifically, JUnit is an open source testing framework, which was initially
    contrived by Kent Beck and Erich Gamma (www.junit.org). As of the time of this
    writing, the latest stable version of this framework (and the one bundled with
    the IDE) is Version 4.10. Due to the fact that Erich led the design of the Eclipse
    Java Development Tools (JDT), JUnit is well-integrated into the IDE. Eclipse already
    ships with a bundled JUnit JAR. So, as long as you are planning on using JUnit
    4.10, there is not much to say about installing it. However, it is also possible
    to use a different JUnit version. The steps for setting up the default and a non-default
    JUnit JAR are covered in the following sections.


    Although the duo, JUnit and Eclipse, supports and automates most of the testing
    process, you still need to write your own test files manually. Since Eclipse leaves
    the organization of your test files up to you, a word about how to organize these
    files is in order.


    JUnit-based test files can be organized in the following way. Suppose your application
    has a class named MyAppClass, and you want to test it. To do so, you need to place
    your tests in another class named MyAppClassTest. Usually, test classes are kept
    separated from regular code. The convention is placing them into a subpackage
    called test. So, let''s say that MyAppClass is in a package called org.myapp,
    tests related to this class need to be placed in the subpackage named org.myapp.test.
    As for the tests themselves, they are grouped in MyAppClassTest in the form of
    Java methods with some slight modifications that we will describe shortly. An
    overview of this typical organization is shown in the following screenshot, which
    illustrates this organization using a hypothetical Java project named MyTestProject:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_59_0.png)'
