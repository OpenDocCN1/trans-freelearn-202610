- pgno: 202
  md: '# The Plugin Spy feature


    You might have wondered where did the locationURIs we used for our contributions
    came from. As we promised, we''ll now show how to use the Plugin Spy, a very useful
    feature for Eclipse developers, to find locationURIs and much more.


    This feature allows you to obtain information from the UI elements of your workbench
    straight from the Eclipse interface, thus making it easy to find out from which
    plugin does that element come, its class, the current selection''s type, among
    other useful information. The Plugin spy has two modes: the Plugin Selection Spy
    and the Plugin Menu Spy. As the names imply, the Selection Spy allows you to get
    information regarding the currently selected element and its containing part,
    but the Menu Spy provides information about menu contributions.


    To enable the Selection Spy, press Alt + Shift + F1. You will be presented with
    a pop-up window containing information similar to this one:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_202_0.png)'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'The preceding screenshot is the output of the **Plug-in Selection Spy** with
    **Java Editor** as the **Active Part**. As you can see, it contains the class
    of the active editor, the plugin that provides this part, the part''s identifier,
    and the menu contribution identifiers. In the previous example of how to disable
    menu entries, we have implemented the `isEnabled()` method using information gathered
    from the plugin selection spy: We know that the Java editor class is `CompilationUnitEditor`
    and the text selection is an instance of `TextSelection`. If we didn''t have the
    plugin selection spy, we would have to scavenge for this information in the Java
    Development Tool''s code or documentation.


    The other Plugin Spy mode is the Plugin Menu Spy. It allows you to get info from
    menu entries instead of views and selections. To enable this mode, press *Alt
    + Shift + F2*. You will notice that your mouse cursor will have a different look.
    Let''s click on in the **Run** toolbar button, for example, to see how the Plugin
    Menu Spy output looks as follows:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_203_0.png)


    As you can see, it gives us the active contribution item identifier, the location
    URI of the contribution, and the action set identifier. This field can either
    point to an action or a command, since the action framework, as we have discussed
    previously in this chapter, is deprecated but there''s still a lot of code that
    hasn''t been ported to the command framework.


    The Plugin Menu Spy can also be used to get info from pop-up menus, such as right-click
    context menus and toolbar drop-down menus.


    So now you know from where did we get the locationURI to use in the **click me**
    menu entry example. Since the Plugin Menu Spy also gives us the action or the
    command that actually implements the menu entry, it allows us to re-use them by
    adding new menu contributions that use these actions or commands when required.


    To exit the Plugin Menu Spy mode, press *Esc*.'
  merge: -1
