- pgno: 104
  md: 'In this sample code that results in the output that is shown in the following
    screenshot, the basics of a SWT application is presented. A connection to the
    platform window system is created by the Display object, in which a window is
    built using that connection containing the text Hello, World. by the Shell object.
    In the loop that follows, the window system waits for an action by the user that
    would cause the application to terminate.


    ![](img/d7c3f2018603810fae83e1a6fd98749e_104_0.png)


    To properly run and compile this sample SWT program, you will need to add the
    SWT library project as a dependency. This operation can be performed by opening
    the Properties dialog of your Java project, and on the Java Build Path page, including
    the org.eclipse.swt project, as it is shown in the following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_104_1.png)


    # Widgets


    Widgets are GUI elements responsible for maintaining the interaction with the
    user, keeping and redrawing their state, depending on which operation is performed.
    When an event occurs, which could be the result of an user action or an operation
    contained inside a program code, a widget redraws itself so that the new state
    can be shown.'
