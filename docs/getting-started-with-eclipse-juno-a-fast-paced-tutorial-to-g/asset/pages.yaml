  img_proc: true
- pgno: 105
  md: "Standard constructors are used to create a widget. As seen in the code snippet\
    \ of the *Setting up* section , they are explicitly disposed when there is no\
    \ more need for them. In a different matter from traditional Java classes, you\
    \ can note this behavior because widgets use operating systems resources that\
    \ must be manually disposed in order to avoid resource leaks. The Java garbage\
    \ collector does not dispose operating system resources.\n\nIn this context, when\
    \ an SWT object is created, or when an SWT resource-based object is called, there\
    \ is a need to manually dispose it. If there the resource has a parent, disposing\
    \ it also causes the disposal of its children.\n\nA group of widgets instances\
    \ are used to build a user interface in the SWT. For that we have the control\
    \ element, that is a user interface contained inside an application window, called\
    \ a Shell. Several ordinary elements as Buttons, Texts, Labels and Tables subclass\
    \ the abstract class Control.\n\nTo deal with actions, instead of sub-classing\
    \ to implement code that reacts to modifications in a GUI, programmers are encouraged\
    \ to use events and listeners that are added to widgets appropriately. Listeners\
    \ are used to notify the program when an event has happened.\n\nThe last main\
    \ feature that you must be aware of a widget, regards its application data. Due\
    \ to the discouraged use of sub-classing (due to possible misbehavior regarding\
    \ modifications in the superclass followed by the non-recompilation of the subclass),\
    \ application data can be used to associate any object with a widget. The setData\
    \ and getData methods can be used for that purpose, as we exemplify as follows:\n\
    \n```\nwidget.setData(\"Doctor\", \"Walter Bishop\");\nif (\"Walter Bishop\".equals(widget.getData(\"\
    Doctor\"))) {\n    System.out.println(\"I'm perfectly sane!\");\n}\n```\n\nIn\
    \ this example, we store the data as a key/value pair in the widget, where the\
    \ key is used to get/find the value object, that is, the Doctor key corresponds\
    \ to the Walter Bishop object, and if the if statement returns true, the I'm perfectly\
    \ sane message is printed.\n\nReal-world situations may require factories to facilitate\
    \ the storage of data, as it can be seen in the *Widgets* section."
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Displays


    The `Display` class is responsible for connecting the SWT with the underlying
    window system. It is not a widget; nevertheless, some of the principles discussed
    in *Widgets* section are still the same, such as the handling of events, listeners,
    and application data. The `Display` lifecycle is also similar to that of a widget,
    and should be explicitly created and disposed by the programmer.


    One of the most important methods inside it is the `readAndDispatch` method, that
    can read and dispatch events. The method reads events from native widgets and
    dispatches them to the SWT event system. This continuous loop is executed until
    the main shell is closed. If the loop is interrupted, the application terminates
    immediately. It is called inside the user-interface thread, where many widgets
    methods are also called. As seen in the *Setting up* section, standalone applications
    can create and make calls to the display event processing class inside its `main`
    method.


    It is also possible to name the application via the `setAppName` method, that
    takes a single `String` as argument.


    # Controls


    A control is an user-interface element that belongs to a higher-level window.
    In this section, we are going to describe some of the basic ones in detail, such
    as labels, texts, lists, layouts, buttons, and combos. These simple controls are
    commonly used when developing applications using the SWT. In the next chapter,
    we will extend this section with more advanced controls and examples.


    # The Label widgets


    Labels are static widgets that represent an object that cannot be modified or
    selected, and can act like a string, image, or separator. They are usually placed
    in the left-hand side of the screen to describe text fields, act as separators
    among non-related fields or to place an image.


    The following styles can be selected when you create a label, and can be combined
    using the `|` operator:


    +   - `SWT.SEPARATOR`: Draws a separator

    +   - `SWT.HORIZONTAL`: Draws the separator horizontally

    +   - `SWT.VERTICAL`: Draws the separator vertically

    +   - `SWT.SHADOW_IN`: Separator with shadow in effect'
  merge: -1
  img_proc: true
- pgno: 107
  md: '+   - `SWT.SHADOW_OUT`: Separator with shadow out effect

    +   - `SWT.SHADOW_NONE`: Separator with no shadow effect

    +   - `SWT.CENTER`: Aligns the label to the center

    +   - `SWT.LEFT`: Aligns the label to the left

    +   - `SWT.RIGHT`: Aligns the label to the right

    +   - `SWT.WRAP`: Automatically wraps the text to fit the container


    The main methods used when creating a label widget are:


    +   - `setText(String string)`: Sets the text of the label

    +   - `getText()`: Returns the text of the label

    +   - `setImage(Image image)`: Sets an image to be included in the label

    +   - `getImage()`: Returns the image of the label


    We show a sample code of how to use a label, along with the widget representing
    it as follows:


    ```

    Display display = new Display();

    Shell shell = new Shell(display);

    shell.setText("Label Sample");

    shell.setSize(300,200);

    Label label = new Label(shell, SWT.CENTER);

    label.setText("Nothing But The Rain");

    label.setSize(300,300);

    ```


    ![](img/d7c3f2018603810fae83e1a6fd98749e_107_0.png)


    It bears mentioning that the inherited `setSize` method takes as parameters an
    horizontal and a vertical size in pixels.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# The Text widgets


    Text widgets are editable text fields for strings. These strings can comprehend
    one or more lines, and can be used for password fields. They are also selectable
    by an user.


    The following are several styles available for the creation of a Text widget:


    +   - SEARCH: Searches behavior, can be combined with icon

    +   - ICON_CANCEL: Shows the **Cancel** icon

    +   - ICON_SEARCH: Shows the **Search** icon

    +   - MULTI: Allows multiple lines

    +   - SINGLE: Allows single line

    +   - PASSWORD: Shows the password field behavior

    +   - CENTER: Aligns the text content to the center

    +   - RIGHT: Aligns the text content to the right

    +   - LEFT: Aligns the text content to the left

    +   - READ_ONLY: Makes the field read-only

    +   - WRAP: Wraps the text instead of scroll behavior


    Text widgets support only plain text, which means that the characters must have
    the same font and size. If a more flexible text control is needed, one could use
    a `StyledText` widget, which is not a native widget from SWT.


    When using text fields in an SWT program, it is rather common that the widget
    will have some kind of functionality in the application. A programmer often needs
    to detect when a text has changed or to filter a string that is being typed. For
    this purpose, it may be necessary for listeners to handle the following text-control
    events:


    +   - `DefaultSelection`: *Enter* is pressed

    +   - `Modify`: Text is modified

    +   - `Verify`: Text is to be validated

    +   - `OrientationChange`: Orientation is changed'
  merge: -1
  img_proc: true
- pgno: 109
  md: "In the following example we show how to deal with one of the mentioned events,\
    \ SWT.Modify. For that we create a Text widget, and add a listener for the SWT.Modify\
    \ event. This event is sent when any character is entered by an user. The purpose\
    \ of the code inside such listener is to count the number of characters that have\
    \ been typed. A message is displayed in a label located underneath the Text widget.\n\
    \n```\nDisplay display = new Display();\nShell shell = new Shell(display);\nshell.setSize(200,200);\n\
    final Text text = new Text(shell, SWT.CENTER | SWT.BORDER);\ntext.setSize(200,25);\n\
    final Label label = new Label(shell, SWT.CENTER);\nlabel.setLocation(0,100);\n\
    label.setSize(200,25);\ntext.addListener(SWT.Modify, new Listener() {\n  public\
    \ void handleEvent(Event event) {\n    label.setText(Integer.toString(text.getText().length()));\n\
    \  }\n});\nshell.pack();\nshell.open();\nwhile (!shell.isDisposed()) {\n  if (!display.readAndDispatch())\
    \ display.sleep();\n}\ndisplay.dispose();\n```\n\nThe following screenshot shows\
    \ the GUI output related to this snippet of code:\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_109_0.png)\n\
    \nIt bears mentioning that in this example we also use the setSize and setLocation\
    \ methods, that are respectively responsible for setting the size of the control\
    \ and its location, by x and y coordinates in pixels. The pack() method is also\
    \ used to auto resize the widget to its preferred size."
  merge: -1
  img_proc: true
- pgno: 110
  md: "# The Button widgets\n\nButtons are often used in desktop applications because\
    \ these usually make use of the mouse device. When a user selects an option, it\
    \ is possible to handle the selection event. Buttons can be filled with text or\
    \ images, but not at the same time, and there is no option to obtain multiple\
    \ lines of text on the screen.\n\nThe following styles are available when creating\
    \ a Button control:\n\n+   - `ARROW`: Draws the button with arrow appearance\n\
    +   - `CHECK`: Checks button behavior\n+   - `PUSH`: Pushes button behavior\n\
    +   - `RADIO`: Shows radio button behavior\n+   - `TOGGLE`: Toggles button behavior\n\
    +   - `FLAT`: Draw the button with flat appearance\n+   - `UP`: Draws an up arrow\n\
    +   - `DOWN`: Draws a down arrow\n+   - `LEFT`: Draws a left arrow or aligns to\
    \ the left\n+   - `RIGHT`: Draws a right arrow or aligns to the right\n+   - `CENTER`:\
    \ Draws a center arrow or aligns to the center\n\nThe only available event is\
    \ the SWT.Selection event, that is triggered when a button is clicked.\n\nWe show\
    \ an example of how to use a Button control, followed by the application output\
    \ as follows:\n\n```\n```java\nDisplay display = new Display ();\nShell shell\
    \ = new Shell (display);\nLabel label = new Label (shell, SWT.NONE);\nlabel.setText\
    \ (\"Enter your name:\");\nText text = new Text (shell, SWT.BORDER);\ntext.setLayoutData\
    \ (new RowData (100, SWT.DEFAULT));\nfinal Label resultLabel = new Label(shell,\
    \ SWT.BORDER);\nresultLabel.setText(\"Nothing pressed\");\nButton ok = new Button\
    \ (shell, SWT.PUSH);\nok.setText (\"OK\");\nok.addListener(SWT.Selection, new\
    \ Listener() {\n    public void handleEvent(Event event) {\n        resultLabel.setText(\"\
    OK pressed\");\n    }\n});\n```\n```"
  merge: -1
