- pgno: 174
  md: '# Implementing your very first JSP using Eclipse WTP


    The previous sections got us started with Tomcat, servlets, and Eclipse WTP. As
    you saw, despite the benefits provided by Eclipse WTP (it generated all the structure
    of the web project for us and also took care of generating a significant chunk
    of code when we implemented the previous example servlet), embedding HTML into
    your Java code feels a little awkward. As we mentioned, JSPs were introduced to
    make the creation of dynamic content more straightforward and appealing. JSPs
    let you mix HTML and Java code in a better way than servlets. Rather than embedding
    HTML into Java code, JSP makes it possible to embed dynamic content into HTML.
    Recall from the previous sections that a JSP is an HTML page containing some special
    elements. The elements that are rendered into dynamic content resemble HTML elements.
    However, they are componentized Java programs. Besides these HTML-like elements,
    a JSP page can also include Java code (scriptlets).


    It bears reminding you of the fact that although JSPs look like standard HTML
    pages with additional elements, they are compiled down to servlets. As we mentioned,
    at runtime, Tomcat compiles JSP pages down to servlets, compiles the servlets
    to bytecodes, and executes them eventually.


    In this section we will demonstrate how to use Eclipse WTP to create JSPs. We
    will implement a JSP that shows the same message of the servlet example.


    You do not need to create a new web application project; we will use the previous
    one. To get Eclipse to create a new JSP file for you, do the following: select
    the folder `WebContent` (Tomcat will look for JSPs in this folder), and right-click
    on **JSP File** in **New**. Name it `HelloWorldJSP.jsp` (as shown in the following
    screenshot), and then hit **Next**. Actually, you do not need to type the extension
    (`.jsp`), Eclipse will include it automatically:'
  merge: -1
  img_proc: true
- pgno: 175
