- pgno: 141
  md: '# 7


    # Web Development Using

    Eclipse WTP


    In this chapter, we are going to take a break from using Eclipse to develop applications
    for the client side. Instead, we are going to explore how Eclipse can be used
    to develop web-based Java applications. In order to develop such applications,
    we are going to use Java servlets and **JavaServer Pages (JSP)**. To run and deploy
    our example applications, we are going to use Apache Tomcat. Different from desktop
    applications that run in a standalone fashion, web applications run in a server.
    Thus, this chapter also details how to deploy Java servlets and JavaServer Pages
    on a server, namely, Apache Tomcat.


    This chapter starts off with a brief introduction to the benefits of Java-based
    web technologies. Then, we present some background on servlets and JavaServer
    Pages. We also briefly describe the role that Apache Tomcat plays in implementing
    these technologies. If you are already familiar with these topics, just skim these
    first sections and skip to the next subject: installing Apache Tomcat. You will
    also learn how to integrate Tomcat into Eclipse IDE so that you do not need to
    leave your development environment to deploy and run your web applications.


    We will cover the following in this chapter:


    +   - Introduction to the benefits of the Java-based web technologies

    +   - Servlets

    +   - JavaServer Pages

    +   - Installing Eclipse web tools

    +   - Developing and deploying your first servlet

    +   - Developing and deploying your first JavaServer Page'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Brief introduction to the benefits of Java web application technologies


    Over the years, a multitude of ways of writing server-side software has been explored.
    In the early days, the Common Gateway Interface (CGI) was the most widely used
    technology to develop web content. However, CGI has many shortcomings. Because
    of these drawbacks, several technologies have been proposed to replace CGI. Java-based
    technologies, in particular servlets and JavaServer Pages, rapidly became de facto
    standard in building web-based applications. Java''s widespread adoption in the
    server side can be ascribed to several factors. First, Java is usually faster
    than scripting languages. This is especially true for long-running applications
    because nowadays mainstream Java virtual machine implementations can perform adaptive
    optimizations that yield substantial performance improvements. Second, older technologies,
    such as CGI, require the server to spawn a separate process to deal with each
    request, whereas servlets can be executed in a multithreaded fashion. Finally,
    Java bytecodes are platform neutral, which allows for applications to be ported
    to different platforms without significant changes.


    A number of enhancements to CGI have been proposed, such as FastCGI, mod_perl
    from Apache, and NSAPI from Netscape. These technologies solve the performance
    issue that hindered CGI from becoming even more widespread adopted. However, all
    of these alternatives to CGI share the same problem: HTML code is embedded directly
    into programming language code. Thus, the developer writing web applications in
    these technologies needs to have a mixed skill set: programming language skills
    for writing the business logic and web-related HTML skills for presentation. This
    is not desirable for a number of reasons. While servlets suffer from the same
    problem, JavaServer Pages overcomes this problem by making it possible to separate
    business logic and presentation properly, as we describe in our quick overview
    in the following sections.


    ![](img/d7c3f2018603810fae83e1a6fd98749e_142_0.png)


    > You might be wondering what is HTTP and what does HTTP stand for. HTTP is a
    network protocol, it can be seen as the mean through which clients and servers
    communicate. The conversation between these two elements usually takes the following
    sequence: a client (browser) sends an HTTP request, which is answered with an
    HTTP response by the server. Usually, this response is an HTML (HyperText Markup
    Language) page, which is sent using HTTP. HTML tells the client how to show the
    server''s response: the client reads through the message, renders it into a web
    page and shows it in the user''s display. HTTP stands for HyperText Transfer Protocol.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Understanding servlets


    Servlets are Java programs that run within a web server environment. More specifically,
    servlets are Java programs that conform to the servlet API. Two packages make
    up most of the functionalities of the servlet API, namely, `javax.servlet` and
    `javax.servlet.http`. The former encompasses the most general servlet APIs. The
    latter contains the API for handling HTTP requests. `javax.servlet.http` has a
    number of classes and interfaces whose main goal is to implement HTTP functionality.
    One of the most important classes in the package `javax.servlet.http` is the abstract
    class `HttpServlet`. Servlets inherit their HTTP-related methods from this class.
    Custom-developed servlets override one or more methods defined in `HttpServlet`.
    These methods receive an object as a parameter that contains data about the underlying
    request and an object that they use to write the response. We will go into details
    about these methods and their parameters later on in the chapter.


    ![](img/d7c3f2018603810fae83e1a6fd98749e_143_0.png)


    > It is common to write servlets that are HTTP-related. In principle, however,
    it is possible to implement servlets that are geared towards other client-server
    protocols. Throughout this chapter we are only going to implement HTTP-based servlets.


    # Understanding JavaServer Page


    Put simply, JavaServer Pages are technology geared towards facilitating the development
    of web pages that contain dynamic content. Differently from an HTML page whose
    content stays pretty much the same, a JSP changes its content based on a number
    of things as, for instance, the information previously provided by the user. JSPs
    consist of HTML or XML (**eXtensible Markup Language**) content embedded with
    tags and Java scriptlets. JSPs can be seen as a more convenient approach for embedding
    dynamic elements into HTML than servlets. In fact, at run time, JSPs are translated
    into servlets. Moreover, aimed at increasing performance, servlet containers cache
    the compiled servlets.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Getting started with Apache Tomcat


    Servlets are deployed into a servlet container, which is the component that runs
    and keeps track of several aspects related to servlets. An example of a servlet
    container is Apache Tomcat (or simply Tomcat). Put succinctly, Tomcat is an open
    source web server and Java servlet container from the Apache Software Foundation
    (http://tomcat.apache.org). Tomcat is written in Java, and it implements both
    the Java servlet and the JSP specifications from Oracle Corporations. Being primarily
    a servlet container, Tomcat plays a central role in the lifecycle of servlets:
    it loads classes, instantiates and initializes servlets, maps URLs to servlets,
    enforces the correct access rights to servlets, and creates (or allocates) threads
    to run servlets. Roughly, Tomcat is to servlets and JSPs what the JVM is to desktop-based
    applications — nevertheless, keep in mind that Tomcat runs on the JVM.


    Tomcat has a plethora of features, configurations, and options. It is possible
    to get by with knowing only a small part of all that (which we try to cover throughout
    this chapter), but you should know that there is a lot more to Tomcat than just
    downloading it and getting it up and running. However, an in-depth explanation
    of this full-fledged servlet container is out of the scope of this book. If you
    are looking for a detailed reference on how to get up to speed on using Tomcat,
    be sure to read Apache Tomcat 7 Essentials by Tanuj Khare.


    # Installing Tomcat


    Before integrating Tomcat with Eclipse, you need to download and install Tomcat.
    There are several ways to get Tomcat up and running. On one end of the spectrum,
    it is possible to download Tomcat''s source code and build and test it. On the
    other end, you can simply download a binary version of it. Here, we are taking
    the arguably easiest path to installing Tomcat: downloading, configuring, and
    running the compiled binary. Throughout this chapter, we assume you are using
    the most recent release of Tomcat. As of the time of this writing, the latest
    version is 7.0.


    ![](img/d7c3f2018603810fae83e1a6fd98749e_144_0.png)


    > It is also possible to install Tomcat by getting Eclipse to download it for
    you. Provided that you already have WTP installed (how to install this plugin
    is described later on), when you create a new server under Eclipse and set its
    type as **Apache Tomcat**, you can use the **Download and Install** button on
    the server definition wizard to install Tomcat. You can even select in which folder
    you want to install the server container.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'You can download the binary version of the latest version at `http://tomcat.apache.org/download-70.cgi`.
    After being downloaded, Tomcat can be installed by simply unzipping it, which
    creates the following directory hierarchy:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_145_0.png)


    Arguably, the most important directory is the webapps directory. This is the deployment
    directory, and files that need to be made available to client browsers, JAR files,
    configuration files, and so on are placed into it. Throughout this chapter we
    are going to provide details on how to organize web applications under this directory.


    To set up and run Tomcat outside Eclipse, you need to configure two environment
    variables, namely, `JAVA_HOME` and `CATALINA_HOME`. The `JAVA_HOME` environment
    variable should be set to the base path of your JDK. Tomcat 7.0 requires Java
    SE 6.0 or later. `CATALINA_HOME` should point to the base path of the Tomcat directory
    hierarchy. Instructions on how to set these environment variables for all operating
    systems can be found at `http://tomcat.apache.org/tomcat-7.0-doc/setup.html`.
    In addition, the file `RUNNING.txt` in the Tomcat''s root directory also contains
    installation instructions.


    > It is worth mentioning that, although we use Tomcat throughout this chapter,
    the examples shown here are not Tomcat-specific. Therefore, you can deploy and
    run all examples shown here in other servlet containers.'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'At first we are going to execute Tomcat outside Eclipse, later in this chapter
    we are going to explain how to execute it inside Eclipse. After setting the aforementioned
    environment variables (following the instructions for your operating system, as
    described in the URL provided previously), you need to change to Tomcat''s bin
    directory. From there, you just need to type startup if you are a Windows user
    or startup.sh if you are a Unix-based operating system user. If everything went
    well, Tomcat has started. To verify if Tomcat is up and running, open a browser
    and type http://localhost:8080. You should see Tomcat''s welcome page, as shown
    in the following screenshot. A few words about this URL are in order. First, localhost
    is what you use to access local web servers. This part of the URL resolves to
    the following IP address: 127.0.0.1. As for the 8080 part, this corresponds to
    the port number. Usually, web servers use port 80. Tomcat, however, is configured
