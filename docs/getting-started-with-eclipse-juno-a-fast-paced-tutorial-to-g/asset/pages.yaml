  md: "![](img/d7c3f2018603810fae83e1a6fd98749e_231_0.png)\n\nEditors are not added\
    \ to perspectives as regular views are. Editors are opened programmatically by\
    \ calling the openEditor method of the currently active WorkbenchPage, as we will\
    \ see later in this chapter. They can be opened in any perspective, and they are\
    \ placed in the editor space, which lies in the middle of the window.\n\n# The\
    \ Save and New commands and menu entries\n\nThe next step is to implement commands,\
    \ handlers, and menu entries that enable users to create new contacts and to save\
    \ their work. Let's start with the handler classes. This is the code for the save\
