  md: "Note that there are two AbstractHandler classes, one in the org.eclipse.core.commands\
    \ package and the other in org.eclipse.ui.commands. We'll be using the former\
    \ because the latter is deprecated.\n\nThis is the new contact handler:\n\n```\n\
    public class NewContactHandler extends AbstractHandler {\n\n    @Override\n  \
