    We must also add our view to the default perspective of our application. Let''s
    use perspectiveExtension for that, just like we did in the previous example. Create
    an extension to org.eclipse.ui.perspectiveExtensions, add a perspectiveExtension
    with * as targetID, and a view element under it with the properties as shown in
