  md: "```\n}\n\n    @Override\n    public void setFocus() {\n    }\n\n    private\
    \ class ContactEditorModifyListener implements ModifyListener\n    {\n       \
    \ @Override\n        public void modifyText(ModifyEvent e) {\n            dirty\
    \ = true;\n            firePropertyChange(IWorkbenchPartConstants.PROP_DIRTY);\n\
    \        }\n    }\n}\n```\n\nNotice that ContactEditor extends EditorPart instead\
    \ of ViewPart, just like ContactListView did. It also contains a createPartControl\
    \ method that must be implemented. Our implementation creates SWT elements that\
    \ compose a basic form for the contact's fields. It also fills these fields if\
    \ the current editor input is not null, which will happen when we edit a contact\
    \ instead of creating a new one. There's also an inline class named ContactEditorModifyListener,\
    \ which, as the name implies, gets notified whenever a text element is modified.\
    \ We use this class to change the dirty status to true. The dirty status means\
    \ that the editor's input contains unsaved changes. This state is represented\
    \ by an asterisk character (*) in front of the editor's name. This state will\
    \ also allow us to enable or disable the save button accordingly. Notice how we\
    \ change the dirty status in the doSave method.\n\nNow, let's register the ContactEditor\
    \ class in the plugin.xml file. Add a new extension for the org.eclipse.ui.editors\
    \ extension point and add an editor element with the properties shown in the following\
    \ screenshot:"
