  img_proc: true
- pgno: 234
  md: "Now that we have a double-click listener, add it to the contact's TableViewer\
    \ widget by modifying the createControl method of ContactListView by adding the\
    \ following line:\n\n```\ncontactsViewer.addDoubleClickListener(new\nContactListDoubleClickListener());\n\
    ```\n\nTo further integrate the contact's view window and the editor, we must\
    \ forcibly refresh the contact's entries every time the editor is saved, in order\
    \ to reflect a possible change in the contact's name. To do this, the ContactsList\
    \ view will listen to a specific event that the editor will fire whenever it is\
    \ saved. Let's start by adding a private IViewPart field named contactListView\
    \ to the ContactEditor class that will contain the instance of the contacts view.\
    \ Add the following line to the createPartControl() method of ContactEditor to\
    \ get the instance:\n\n```\ncontactListView = PlatformUI.getWorkbench().\ngetActiveWorkbenchWindow().getActivePage().findView(\"\
    ContactsList.\nContactsListView\");\n```\n\nNow add the following code to the\
    \ end of the doSave() method to notify the contact list's instance that the editor\
    \ was saved:\n\n```\nif(contactListView != null){\n    if (contactListView instanceof\
    \ IPropertyChangeListener){\n        PropertyChangeEvent changeDirty = new PropertyChangeEvent(this,\n\
    \"isDirty\", true, false);\n        ((IPropertyChangeListener)contactListView).\n\
    propertyChange(changeDirty);\n    }\n}\n```\n\nNow all we have to do is change\
    \ the ContactListView class to implement the IPropertyChangeListener interface\
    \ and add a propertyChange() method that acts accordingly when the editor is saved.\
    \ Implement the propertyChange method with the following code:\n\n```\n@Override\n\
    public void propertyChange(PropertyChangeEvent event) {\n    refreshEntries();\n\
    }\n```"
  merge: -1
