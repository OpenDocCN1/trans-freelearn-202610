    # Creating test cases


    So far, we have not typed much; Eclipse has done everything for us. However, now
    it''s time for us to do some typing. Aimed at implementing our test cases, we
    are going to take small steps. First, we need to comment out test cases that have
    not been implemented yet. It turns out that JUnit provides a better way to disable
    unfinished test methods, by annotating them with `@Ignore`. Methods annotated
    with `@Test` and `@Ignore` will not be executed by JUnit at all. JUnit treats
    them as if they were commented out. When annotating a method with `@Ignore`, you
    can also provide a string that explains why the underlying test method is being
    ignored.'
