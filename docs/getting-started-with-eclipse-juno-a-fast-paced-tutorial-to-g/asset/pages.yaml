- pgno: 233
  md: "The New and Save commands point to the contactsList.new and contactsList.save\
    \ command IDs respectively.\n\nIf you run the application at this point, you will\
    \ realize that the Save button in the toolbar is not there. In fact, there's no\
    \ toolbar in our application! That's because the implementation of the ApplicationWorkbenchWindowAdvisor\
    \ extension provided by the template disables the toolbar. Open this class, and\
    \ either comment out the configurer.setShowCoolBar(false) call inside the preWindowOpen\
    \ method or change the parameter to true to display the toolbar.\n\n# Tying up\
    \ the two views\n\nNow that we have the two views and the menu entries, the next\
    \ step is to connect the two views by opening an editor when the user double-clicks\
    \ on an entry in the list. We will do that by adding a double-click listener to\
    \ the ContactList view. Let's start by coding the listener. Create a class named\
    \ ContactListDoubleClickListener with the following code:\n\n```\npublic class\
    \ ContactListDoubleClickListener implements\n    IDoubleClickListener {\n\n  \
    \  @Override\n    public void doubleClick(DoubleClickEvent event) {\n        TableViewer\
    \ viewer = (TableViewer) event.getSource();\n        StructuredSelection selection\
    \ = (StructuredSelection) viewer.getSelection();\n        Contact contact = (Contact)\
    \ selection.getFirstElement();\n        try {\n            PlatformUI.getWorkbench().getActiveWorkbenchWindow().getActivePage().openEditor(new\
    \ ContactEditorInput(contact), \"ContactsList.ContactEditor\");\n        } catch\
    \ (PartInitException e) {\n            e.printStackTrace();\n        }\n    }\n\
    }\n```\n\nWhen a IDoubleClickListener implementation is registered to a SWT widget,\
    \ its doubleClick method is executed when the widget is double-clicked. Our doubleClick\
    \ implementation gets the TableViewer widget and discovers which element was selected.\
    \ This is another advantage of using content providers; they allow you to access\
    \ the object to which the TableViewer entry refers easily."
