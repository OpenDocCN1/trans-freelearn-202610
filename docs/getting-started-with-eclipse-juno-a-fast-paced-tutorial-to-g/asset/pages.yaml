    );\n}\n}\n```\n\nThe preWindowOpen method implementation calls getWindowConfigurer\
    \ and performs some actions on the IworkbenchWindowConfigurer configurer, such\
    \ as setting an initial size for the application window, disabling the coolbar\
    \ and status line, and setting a title for the application. The createActionBarAdvisor\
    \ method instantiates and returns ApplicationActionBarAdvisor, which extends ActionBarAdvisor.\
    \ ActionBarAdvisor creates, adds, and disposes the JFace actions of a workbench\
    \ window. A JFace action is a command that can be triggered by the end user utilizing\
    \ UI elements, such as buttons, menu items, and items in the toolbar. The ApplicationActionBarAdvisor\
    \ implementation doesn't modify ActionBarAdvisor's behavior.\n\nNow, let's go\
    \ back to the Plug-in Manifest Editor window and see what other plugins are required\
    \ to build a fully functional RCP application. As we said in the beginning of\
    \ the chapter, an RCP application is something like an Eclipse instance stripped\
    \ of every Eclipse graphical element. This means you must create these elements\
    \ if you want your application to function properly. The first thing we need is\
    \ a perspective, which is created by implementing the org.eclipse.ui.perspectives\
    \ extension point. The perspective element contains an ID, which must be unique\
    \ across the applications, must be a user-friendly name that will be displayed\
    \ in the interface, and a class. Let's take a look at the Perspective class code:\n\
    \n```\npublic class Perspective implements IPerspectiveFactory {\n\n    public\
    \ void createInitialLayout(IPageLayout layout) {\n        layout.setEditorAreaVisible(false);\n\
    \        layout.setFixed(true);\n\n    }\n}\n```"
