- pgno: 220
  md: 'The code shows us that perspective classes must implement the `IPerspectiveFactory`
    interface, which contains the `createInitialLayout` method. The implementation
    generated by the template simply removes the editor area from the application
    and disallows users to modify the view''s size and placement by calling the `setFixed`
    method. The editor area is a space in the center of the application''s window
    that is reserved for editors. Any other views will be rendered either below, to
    the left of, or to the right of this area. The editor area is disabled for our
    application because it doesn''t have any editors.


    This method could also be used to add the views to the perspective by calling
    the `layout.addView` method. However, the code generated by the template uses
    a different approach. Go back to the **Plug-in Manifest Editor** window and take
    a look at the `org.eclipse.ui.perspectiveExtensions` implementation. This extension
    point allows you to add a view to an existing perspective. This approach is generally
    used when you want to add a view to a perspective that wasn''t developed by you.
    In this case, you wouldn''t have access to the `IPerspectiveFactory` implementation
    to add a `layout.addView` call to the `createInitialLayout` implementation.


    The `perspectiveExtension` element is where you define the ID of the perspective
    that will receive the view. This field allows using the * (asterisk) character,
    which will cause the view to be added to every perspective that matches the pattern.
    For example, `org.eclipse.jdt.*` would include the view in every **Java Development
    Tools (JDT)** perspective. This is another benefit of using the `perspectiveExtensions`
    extension point instead of calling `layout.addView` in the `IPerspectiveFactory`
    implementation. It simplifies the task of managing the perspectives into which
    the view is added. In our example, `targetID` is simply *, which means that in
    `HelloRCP.view`, the view will be added to every perspective available (there''s
    only one perspective in our application).


    Speaking of the view, let''s take a look at the `org.eclipse.ui.views` extension.
    This is a simple view, just like the one we created in *Chapter 8, Eclipse Development*.
    It points to a View class that extends the `ViewPart` abstract class. The `createPartControl`
    method instantiates a `TableViewer` object and associates a content provider and
    a label provider to it. We will explore the concepts of a label and content providers
    when we expand this example in the later sections. `TableViewer` is a JFace widget
    that displays content in a table-like list, similar to the one utilized in JDT''s
    Problems view.


    The last extension point that our RCP application implement is `org.eclipse.ui.menus`.
    It simply provides a **File** menu contribution that contains an **Exit** entry.
    This entry runs the `org.eclipse.ui.file.exit` command, which causes the program
    to exit.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Running and debugging RCP applications


    The easiest way of running an RCP application is by opening the Plug-in Manifest
    Editor window for the RCP project, switching to the Overview tab, and clicking
    on the Launch an Eclipse application link on the column to the right. This will
    create a default configuration containing the RCP plugin and the necessary platform
    plugins. You can also create custom run configurations, just like with regular
    plugins, by selecting your project and navigating to Run | Run Configurations
    in the Eclipse menu. Double-click on the Eclipse Application option on the left
    to create a new run configuration for the selected project. To run your project
    as an RCP application instead of an Eclipse plugin, make sure you switch to Run
    an application and select your application in the Program to run section, as shown
    in the following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_221_0.png)


    This configuration will also contain all the plugins from your development platform.
    To select only the required plugins, switch to the Plug-ins tab, and select plug-ins
    selected below only from the Launch with drop-down menu. Click on Deselect all,
    select your RCP plugin, and click on Add Required Plug-ins to have only the necessary
    platform plugins in your application.


    The configuration options for the other tabs presented in Chapter 8, Eclipse Development,
    are also valid here. You can also go to Run | Run Configuration and Eclipse will
    create a default run configuration for you if you haven''t created one yet. You
    will be presented with a number of different ways to run your app: as an Eclipse
    application, a Java applet or application, or as an OSGi Framework application.
    Select Eclipse Application and click on OK. This configuration will contain only
    the currently selected plugin and the necessary platform plugins.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'The following screenshot shows what the sample application we built in the
    previous section looks like. As you can see, it complies with all our specifications:
    a 400 x 300 pixel window, a view, the **RCP Application** title, and so on.


    ![](img/d7c3f2018603810fae83e1a6fd98749e_222_0.png)


    Debugging is also a straightforward operation—just place breakpoints in the classes
    you wish to debug and navigate to **Run** | **Debug**. It will use the same configurations
    as the **Run** command.


    # Expanding the example – creating a contact list application


    Now that we have seen the basics of an Eclipse RCP application, let''s expand
    the example and create an application to store contact information. To keep it
    simple and focus on learning how to use the Eclipse RCP features, we will develop
    a standalone application instead of a client application that connects to a server.
    The application, however, could be easily modified to store and fetch contact
    information from a server. The advantage of such a design over a web-based client
    lies in the possibility of implementing mechanisms that allow your application
    to work in situations where Internet connection is faulty or simply nonexistent.


    The idea here is to develop a very simple application, but one that has functionality
    and explores more features than the one in the previous example. It will have
    a view on the left side of the application window, containing a list of the contact
    names. Whenever a contact name is selected in this view, a contact editor is opened
    in the middle of the window, allowing the user to view the contact information
    and update it. The **application** menu will contain entries to create a new contact,
    save the currently edited one, as well as a toolbar with a **save** button. We
    will also use this example to introduce the concept of content and label providers.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'We will create a number of classes in this example. The following screenshot
    contains all of them in their respective packages so that you can refer to it
