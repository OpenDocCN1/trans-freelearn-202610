    # RowLayout


    RowLayout positions the controls in a row (horizontally) or in a column (vertically),
    depending on how it was instantiated. It differs from FillLayout, as it does not
    fill out all the available space and it presents a layout data class called RowData
    to configure each of the controls individually. It is possible to specify their
    height and width when positioning them in the composite.


    The following public fields are available:


    +   - center: Specifies whether the control should be centered

    +   - fill: Specifies whether all controls in a row should be of the same height
    for horizontal layouts or the same width for vertical layouts

    +   - justify: Specifies if any remaining space should be allocated among the
    controls

    +   - marginBottom: Specifies the number of pixels at the bottom edge of the layout

    +   - marginHeight: Specifies the number of pixels at the top and bottom edges
    of the layout

    +   - marginLeft: Specifies the number of pixels at the left edge of the layout

    +   - marginRight: Specifies the number of pixels at the right edge of the layout

    +   - marginTop: Specifies the number of pixels at the top edge of the layout

    +   - marginWidth: Specifies the number of pixels at the left and right edges
    of the layout'
