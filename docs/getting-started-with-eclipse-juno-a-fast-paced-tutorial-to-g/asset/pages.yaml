- pgno: 32
  md: 'A lot of non-GUI-related improvements have also been made. For instance, now
    you can use the quick assist (Ctrl + 1) to turn an enhanced for loop into either
    an indexed for loop or an iterator-based loop. The option to transform a for loop
    into an indexed for loop is available for expressions that iterate over arrays
    or list-based types. The option to turn a for loop into an iterator-based for
    loop is only available for expressions of the type iterable. The following screenshot
    shows the new quick assist in action:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_32_0.png)


    As we will see in *Chapter 3, Unit Testing with JUnit and Debugging*, Eclipse
    now ships with JUnit 4.10. Also, Eclipse supports the latest servlet application
    programming interface (3.0) that we will briefly discuss in *Chapter 7, Web Development
    Using Eclipse WTP*. The complete list of improvements is available at http://help.eclipse.org/juno/index.jsp?topic=%2Forg.eclipse.platform.doc.user%2FwhatsNew%2Fplatform_whatsnew.html.


    # Summary


    Eclipse is arguably the most popular Java IDE (maybe that is why you bought this
    book; you figured it was about time you jumped on the bandwagon). In this chapter,
    we introduced Eclipse Juno and what this new version of the IDE brings to the
    table. As you saw, Eclipse has undergone lots of changes.


    Besides introducing Eclipse, this chapter laid the foundation for the rest of
    the book. We emphasized some of the changes of the new version of the IDE. We
    could have spent more pages describing what is new, but that would not be appropriate
    for those of you who can barely wait to start using Eclipse. Above all, the most
    important changes have already been documented elsewhere (as mentioned before).


    The next chapter delves into our hands-on tutorial, describing how to use Eclipse
    to develop Java applications. Good reading, and make sure not to get sidetracked
    by social networking sites.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 2

    Java Development


    IDEs have evolved so much along the years that it''s hard to imagine writing Java
    code without using one. It''s always possible, of course, to use text editors
    or very simple IDEs, but Eclipse provides so many features to make the writing
    of code easier and faster, that once you get used to it, chances are you will
    never look back.


    Given the productivity gain that an IDE like Eclipse might provide, mastering
    it is almost as important as mastering Java programming itself. The goal of this
    chapter is to present the most important features Eclipse has to offer to Java
    programmers.


    By the end of this chapter, you will be able to:


    +   - Create a new Java project or import an existing one

    +   - Navigate swiftly through the code

    +   - Use Java views effectively

    +   - Refactor code in an easy and safe way

    +   - Get Eclipse to generate code and fix code issues'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# Creating a Java project


    To create a new Java project, navigate to File | New | Project. You will be presented
    with the New Project wizard window that is shown in the following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_34_0.png)


    Choose the Java Project option, and click on Next. The next page of the wizard
    contains the basic configuration of the project that you will create. The JRE
    section allows you to use a specific JRE to compile and run your project. The
    Project layout section allows you to choose if both source and binary files are
    created in the project''s root folder or if they are to be separated into different
    folders (src and bin by default). The latter is the default option.


    You can create your project inside a working set. This is a good idea if you have
    too many projects in your workspace and want to keep them organized. Check the
    Creating working sets section of this chapter for more information on how to use
    and manage working sets.


    The next page of the wizard contains build path options. In the Managing the project
    build path section of this chapter, we will talk more about these options. You
    can leave everything as the default for now, and make the necessary changes after
    the project is created.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Creating a Java class


    To create a new Java class, right-click on the project in the Package Explorer
    view and navigate to **New** | **Class**. You will be presented with the **New
    Java Class** window, where you will input information about your class. You can
    change the class''s superclass, and add interfaces that it implements, as well
    as add stubs for abstract methods inherited from interfaces and abstract superclasses,
    add constructors from superclasses, and add the main method.


    To create your class inside a package, simply enter its name in the appropriate
    field, or click on the **Browse** button beside it and select the package. If
    you input a package name that doesn''t exist, Eclipse will create it for you.
    New packages can also be created by right-clicking on the project in the Package
    Explorer and navigating to **New** | **Package**. Right-clicking on a package
    instead of a project in the Project Explorer and navigating to **New** | **Class**
    will cause the class to be created inside that package.


    # Creating working sets


    Working sets provide a way to organize your workspace''s projects into subsets.
    When you have too many projects in your workspace, it gets hard to find the project
    you''re looking for in the **Package Explorer** view. Projects you are not currently
    working on, for example, can be kept in separate working sets. They won''t get
    in the way of your current work but will be there in case you need them.


    To create a new working set, open the Package Explorer''s view menu (white triangle
    in the top-right corner of the view), and choose **Select Working Set**. Click
    on **New** and select the type of projects that the working set will contain (**Java**,
    in this case). On the next page, insert the name of the working set, and choose
    which projects it will contain. Once the working set is created, choose the **Selected
    Working Sets** option, and mark your working set. Click on **OK**, and the Package
    Explorer will only display the projects inside the working set you''ve just created.


    Once your working sets are created, they are listed in the Package Explorer''s
    view menu. Selecting one of them will make it the only working set visible in
    the Package Explorer. To view more than one working set at once, choose the **Select
    Working Set** option and mark the ones you want to show. To view the whole workspace
    again, choose **Deselect Workspace** in the view menu. You can also view all the
    working sets with their nested projects by selecting working sets as the top-level
    element of the **Package Explorer** view. To do this, navigate to **Top Level
    Elements** | **Working Sets** in the view menu.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Although you don''t see projects that belong to other working sets when a working
    set is selected, they are still loaded in your workspace, and therefore utilize
    resources of your machine. To avoid wasting these resources, you can close unrelated
    projects by right-clicking on them and selecting Close Project. You can select
    all the projects in a working set by using the Ctrl + A keyboard shortcut.


    If you have a big number of projects, but you never work with all of them at the
    same time (personal/business projects, different clients'' projects, and so on),
    you can also create a specific workspace for each project set. To create a new
    workspace, navigate to File | Switch Workspace | Other in the menu, enter the
    folder name of your new workspace, and click on OK. You can choose to copy the
    current workspace''s layout and working sets in the Copy Settings section.


    # Importing a Java project


    If you are going to work on an existing project, there are a number of different
    ways you can import it into Eclipse, depending on how you have obtained the project''s
    source code. To open the Import wizard, navigate to File | Import. Let''s go through
    the options under the General category:


    +   - Archive file: Select this option if the project you are working on already
    exists in your workspace, and you just want to import an archive file containing
    new resources to it. The Import wizard will list all the resources inside the
    archive file so that you can select the ones you wish to import. To select to
    which project the resources will be imported click on the Browse button. You can
    also select in which folder the resources are to be included. Click on Finish
    when you are done. The imported resources will be decompressed and copied into
    the project''s folder.

    +   - Existing Projects into Workspace: If you want to import a new project, select
    this option from the Import wizard. If the project''s source file has been compressed
    into an archive file (the .zip, .tar, .jar, or .tgz format), there''s no need
    to decompress it; just mark the Select archive file option on the following page
    of the wizard, and point to the archive file. If you have already decompressed
    the code, mark Select root directory and point to the project. The wizard will
    list all the Eclipse projects found in the folder or archive file. Select the
    ones you wish to import and click on Finish. You can add the imported projects
    to a specific working set and choose whether the projects are to be copied into
    your workspace folder or not. It''s highly recommended to do so for both simplicity
    and portability; you know where all your Eclipse projects are, and it''s easy
    to backup or move all of them to a different machine.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '+   - **File System**: Use this wizard if you already have a project in your
    workspace and want to add new existing resources in your filesystem. On the next
    page, select the resources you wish to import by checking them. Click on the **Browse**
    button to select the project and the folder where the resources will be imported.
    When you click on the **Finish** button, the resources will be copied to the project''s
    folder inside your workspace.

    +   - **Preferences**: You can import Eclipse preferences files to your workspace
    by selecting this option. Preferences file contains code style and compiler preferences,
    the list of installed JREs, and the **Problems** view configurations. You can
    choose which of these preferences you wish to import from the selected configuration
    file.


    # Importing a project from Version Control Servers


    Projects that are stored in Version Control Servers can be imported directly into
    Eclipse. There''s a number of version control softwares, each with its pros and
    cons, and most of them are supported by Eclipse via plugins. GIT is one of the
    most used softwares for version control; we will discuss it with more details
    on how to use it efficiently inside Eclipse in *Chapter 4, Managing a Project*.
    **CVS** is the only version control system supported by default. To import a project
    managed by it, navigate to **CVS | Projects** from CVS in the Import wizard. Fill
    in the server information on the following page, and click on **Finish**.


    # Introducing Java views


    As discussed in *Chapter 1, Introduction*, Eclipse''s user interface consists
    of elements called views. The following sections will introduce the main views
    related to Java development.


    # The Package Explorer view


    The **Package Explorer** view is the default view used to display a project''s
    contents. As the name implies, it uses the package hierarchy of the project to
    display its classes, regardless of the actual file hierarchy. This view also displays
    the project''s build path.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The following screenshot shows how the Package Explorer view looks:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_38_0.png)


    # The Java Editor view


    The Java Editor is the Eclipse component that will be used to edit Java source
    files. It is the main view in the Java perspective and is located in the middle
    of the screen.


    The following screenshot shows the Java Editor view:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_38_1.png)


    The Java Editor is much more than an ordinary text editor. It contains a number
    of features that makes it easy for newcomers to start writing Java code and increases
    the productivity of experienced Java programmers. Let''s talk about some of these
    features.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Compiling errors and warnings annotations


    As you will see in the Building and running section with more details, Eclipse
    builds your code automatically after every saved modification by default. This
    allows Eclipse to get the Java Compiler output and mark errors and warnings through
    the code, making it easier to spot and correct them. Warnings are underlined in
    yellow and errors in red.


    # Content assist


    This is probably the most used Java Editor feature both by novice and experienced
    Java programmers. It allows you to list all the methods callable by a given instance,
    along with their documentation. This feature will work by default for all Java
    classes and for the ones in your workspace. To enable it for external libraries,
    you will have to configure the build path for your project. We''ll talk more about
    build paths further in this chapter in the Managing the project build path section.


    To see this feature in action, open a Java Editor, and create a new String instance.


    ```

    String s = new String();

    ```


    Now add a reference to this String instance, followed by a dot, and press Ctrl
    + Space bar. You will see a list of all the String() and Object() methods. This
    is way more practical than searching for the class''s API in the Java documentation
    or memorizing it.


    The following screenshot shows the content assist feature in action:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_39_0.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'This list can be filtered by typing the beginning of the method''s name after
    the dot. Let''s suppose you want to replace some characters in this String instance.
    As a novice Java programmer, you are not sure if there''s a method for that; and
    if there is, you are not sure which parameters it receives. It''s a fair guess
    that the method''s name probably starts with replace, right? So go ahead and type:


    ```

    s.replace

    ```


    When you press Ctrl along with the space bar, you will get a list of all the String()
    methods whose name starts with replace. By choosing one of them and pressing Enter,
    the editor completes the code with the rest of the method''s name and its parameters.
    It will even suggest some variables in your code that you might want to use as
    parameters, as shown in the following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_40_0.png)


    Content assist will work with all classes in the project''s classpath. You can
    disable content assist''s automatic activation by unmarking Enable auto activation
    inside the Preferences window and navigating to Java | Editor | Content Assist.


    # Code navigation


    When the project you are working on is big enough, finding a class in the Package
    Explorer can be a pain. You will frequently find yourself asking, "In which package
    is that class again?". You can leave the source code of the classes you are working
    on open in different tabs, but soon enough you will have more open tabs than you
    would like to have.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Eclipse has an easy solution for this. In the toolbar, select **Navigate |
    Open Type**. Now, just type in the class''s name, and click on **OK**. If you
    don''t remember the full name of the class, you can use the wildcard characters,
    ? (matches one character) and * (matches any number of characters). You can also
    use only the uppercase letters for the CamelCase names (for example, `SIOOBE`
    for `StringIndexOutOfBoundsException`). The shortcut for the **Open Type** dialog
    is *Ctrl + Shift + T*. There''s also an equivalent feature for finding and opening
    resources other than Java classes, such as HTML files, images, and plain text
    files. The shortcut for the **Open Resource** dialog is *Ctrl + Shift + R*.


    You can also navigate to a class'' source file by holding *Ctrl* and clicking
    on a reference to that class in the code. To navigate to a method''s implementation
    or definition directly, hold *Ctrl* and click on the method''s call.


    Another useful feature that makes it easy to browse through your project''s source
    files is the **Link With Editor** feature in the **Package Explorer** view, as
    shown in the following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_41_0.png)


    By enabling it, the selected resource in the Package Explorer will always be the
    one that''s open in the editor. Using this feature together with OpenType is certainly
    the easiest way of finding a resource in the Package Explorer.


    # Quick fix


    Whenever there''s an error or warning marker in your code, Eclipse might have
    some suggestions on how to get rid of it. To open the **Quick Fix** menu containing
    the suggestions, place the caret on the marked piece of code related to the error
    or warning, right-click on it, and choose **Quick Fix**. You can also use the
    shortcut by pressing *Ctrl + 1* with the caret placed on the marked piece of code.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'The following screenshot shows the quick fix feature suggesting you to either
    get rid of the unused variable, create getters and setters for it, or add a SuppressWarnings
    annotation:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_42_0.png)


    Let''s see some of the most used quick fixes provided by Eclipse. You can take
    advantage of these quick fixes to speed up your code writing. You can for example,
    deliberately call a method that throws an exception without the try/catch block,
    and use the quick fix to generate it instead of writing the try/catch block yourself.


    +   - **Unhandled exceptions:** When a method that throws an exception is called,
    and the exception is not caught or thrown, Eclipse will mark the call with an
    error. You can use the quick fix feature to surround the code with a proper try/catch
    block automatically. Just open the **Quick Fix** menu, and choose **Surround with
    Try/Catch**. It will generate a `catch` block that will then call the `printStackTrace()`
    method of the thrown exception. If the method is already inside a `try` block,
    you can also choose the **Add catch clause to the surrounding try** option. If
    the exception shouldn''t be handled in the current method, you can also use the
    **Add throws declaration** quick fix.

    +   - **References to nonexisting methods and variables:** Eclipse can create
    a stub for methods referenced through the code that doesn''t exist with quick
    fix. To illustrate this feature''s usefulness, let''s suppose you are working
    on a class''s code, and you realize that you will need a method that performs
    some specific operation with two integers, returning another integer value. You
    can simply use the method, pretending that it exists:


    ```

    int b = 4;

    int c = 5;

    int a = performOperation(b,c);

    ```'
