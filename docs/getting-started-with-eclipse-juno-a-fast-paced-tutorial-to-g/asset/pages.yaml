- pgno: 123
  md: '# 6

    More SWT


    As previously explained, the **Standard Widget Toolkit (SWT)** consists of a set
    of tools developed by the Eclipse project in order to help building **Graphical
    User Interface (GUI)** applications.


    In *Chapter 5, SWT*, we have introduced some basic concepts regarding the SWT
    API. This knowledge is important so that we can easily follow the content presented
    in this chapter. For the later sections of this chapter, we delve deep into SWT
    events, and show how to deal with menus, toolbars, dialogs, and tables.


    # Events


    In several examples of our previous chapter, despite not being the focus of what
    we were trying to explain, we have shown how to deal with a few user events, such
    as the click of button, for instance. For every action a user takes, such as a
    mouse click, or a pressed key, an event is generated by the operating system.
    We can choose to handle what is considered relevant for the application being
    developed. To capture an event, it is necessary to add listeners to the code,
    that must be attached to an interface element, such as a shell, a composite, or
    a widget, present in a container.


    The main process starts with the operating system event queue, that deals (record
    and list) with actions taken by an user. When an SWT application is being executed,
    the `Display` class uses the `readAndDispatch` method to monitor the messages
    from the operating system. It sorts through the relevant ones and sends them to
    the shell object, which is responsible for redirecting it to the associated widget.
    The information regarding the event is finally caught by the widget listener,
    which then invokes a method to handle the event.


    In this chapter, we will discuss how to deal with events related to the SWT API,
    and illustrate our explanation with some examples.'
  merge: -1
  img_proc: true
- pgno: 124
  md: "# Typed and untyped events\n\nFor processing an event, it is necessary to use\
    \ a listener. In the first versions of the SWT API, there were only untyped listeners.\
    \ These listeners provide a simple mechanism to handle the events. There is only\
    \ one generic interface called Listener and an event class called Event. In order\
    \ to add a listener, it is necessary to use the addListener method.\n\nAfter some\
    \ discussion among the Eclipse community, it was decided that a more familiar\
    \ pattern would be introduced in the SWT API. These are the typed listeners, that\
    \ were defined in terms of the untyped ones, and they can be found in the org.eclipse.swt.events\
    \ package. We can see the difference among them in the following snippet of code:\n\
    \n```\n...\nwidget.addListener(SWT.Dispose, new Listener() {\n    public void\
    \ handleEvent(Event event) {\n        // widget was disposed\n    }\n});\n...\n\
    ...\nwidget.addDisposeListener(new DisposeListener() {\n    public void widgetDisposed(DisposeEvent\
    \ event) {\n        // widget was disposed\n    }\n});\n...\n```\n\nIn this example,\
    \ DisposeListener is an interface. When there is more than one method defined\
    \ in the listener, the SWT API provides an adapter class with these methods. For\
    \ instance, the SelectionListener interface has two methods, widgetSelected and\
    \ widgetDefaultSelected, that takes SelectionEvents as arguments. As a result,\
    \ the SelectionAdapter class contains both methods.\n\nA table containing the\
    \ typed events and the corresponding untyped ones is shown as follows:\n\n| Event\
    \ | Listener | Method | Untyped event |\n|---|---|---|---|\n| ArmEvent | ArmListener\
    \ | widgetArmed | SWT.Arm |\n| ControlEvent | ControlListener | controlMoved |\
    \ SWT.Move |\n|  | ControlAdapter | controlResized | SWT.Resize |\n| DisposeEvent\
    \ | DisposeListener | widgetDisposed | SWT.Dispose |"
  merge: -1
  img_proc: true
