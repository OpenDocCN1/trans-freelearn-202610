- pgno: 115
  md: "A layout data follows an algorithm that makes use of additional information\
    \ on how the control should be positioned. When using this type of layout, we\
    \ need to associate the composite with the layout class, and the composite children\
    \ with the layout data.\n\nRegardless, each layout presents a different underlying\
    \ algorithm, and in the following sections we describe the available SWT layouts.\n\
    \n# FillLayout\n\nThe simplest layout class is FillLayout, which does not work\
    \ along with a layout data. It positions the controls in a single row or column\
    \ using the available space, and divides and assigns the same space for each one.\
    \ If nothing is specified, it assumes that the controls will be as high as the\
    \ highest one, and as wide as the widest. FillLayout is often used when the application\
    \ has one child, as it will completely fill the shell.\n\nFillLayout provides\
    \ the following public fields:\n\n+   - `type`: Layout orientation, that can be\
    \ `SWT.HORIZONTAL` or `SWT.VERTICAL`\n+   - `marginWidth`: Number of pixels of\
    \ the margin to be placed along the left and right edges of the layout\n+   -\
    \ `marginHeight`: Number of pixels of the margin to be placed along the top and\
    \ bottom edges of the layout\n+   - `spacing`: Number of pixels responsible for\
    \ the space among controls\n\nWe show an example of how to position 10 elements\
    \ of a Text widget as follows. Note that when the application is resized, the\
    \ controls are also resized by FillLayout.\n\n```\n```java\nDisplay display =\
    \ new Display();\nShell shell = new Shell(display);\nshell.setLayout(new FillLayout());\n\
    for (int i=0; i<10; i++) {\n    Text text = new Text(shell, SWT.BORDER);\n   \
    \ text.setText(\"Fill\" + i);\n}\nshell.pack();\nshell.open();\nwhile (!shell.isDisposed())\
    \ {\n    if (!display.readAndDispatch()) display.sleep();\n}\ndisplay.dispose();\n\
    ```\n```"
