  md: '```

    PrintWriter pw = response.getWriter();

    pw.println("<html><head><title>Warm Greeting</title></head>" +

    "<body>" +

    "<h1> Hello, World! </h1>" +

    "</body></html>"

    );

    pw.close();

    }

    ```


    Before running your servlet, let''s take a look at what you just typed inside
    doGet. First, you should keep in mind that we are overriding doGet to handle client
    requests. Within the context of this example, the GET requests to /HelloWorldServlet
    will be answered by an HTML document that prints the message Hello, World!. Initially,
    you need to indicate to the container that the data that is being sent back is
    an HTML document. To do so, you invoke the method of the HttpServletResponse object
    named setContentType. In this example, we set the content type to text/html. Information
    concerning the content type goes in the header of the HTTP response. Such information
    tells the client what to expect as result from the request. It is through this
    information that the client browser knows what to do next: render the HTML, launch
    a PDF viewer, save the returned data as a downloaded file, and so on.


    ![](img/d7c3f2018603810fae83e1a6fd98749e_162_0.png)


    > When you invoke setContentType, you are setting the MIME type for the data returned
    by the servlet. Most of the time, the MIME type used by servlets is text/html.
    However, other MIME types might be used. For instance, a servlet that returns
    a PDF document should set the MIME type to application/pdf.


    Through setContentType you can also specify the character encoding. Let''s say
    we wanted the servlet container to set the character encoding to UTF-8, we would
    invoke setContentType as follows:


    ```

    response.setContentType("text/html; charset=UTF-8");

    ```


    ![](img/d7c3f2018603810fae83e1a6fd98749e_162_1.png)


    > From Java 5 onwards, you can also set the character encoding via the servlet
    response object''s setCharacterEncoding method.'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'The next step is to fetch the output stream and write the desired HTML content
    to it. The servlet response object provides the output stream for sending data
    back to the client. To get the output stream, you need to invoke getWriter, which
    returns a PrintWriter instance. If you have already used java.io, then you are
    already familiar with PrintWriter. If you have not used java.io, here is a crash
    course on PrintWriter: it is designed to handle character data. When you need
    to return something else from your servlet, you will use an OuputStream instance.
    You can obtain an OuputStream instance by invoking getOutputStream on a response
    object as shown in the following snippet:


    ```

    ServletOutputStream out = response.getOutputStream();

    ```


    PrintWriter has a lot of methods; however, most of the time you will be using
    just println or print to print text data to the character stream. As shown in
    the previous example, in order to write HTML to the stream, you simply perform
    I/O operations. To be more specific, HTML is embedded into Java strings and sent
    to the output stream.


    At this point you should be able to run the recently created servlet. Running
    our example inside Eclipse is quite straightforward. Select HelloWorldServlet,
    right-click on it, and then select Run on Server from Run As, as shown in the
    following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_163_0.png)


    > It is worth mentioning that Eclipse also allows you to debug web applications.
    You can even set breakpoints within JSP files. So if you ever face any problem
    during development, it is good to know that you can resort to a step-by-step execution
    in order to uncover bugs.'
  merge: -1
  img_proc: true
