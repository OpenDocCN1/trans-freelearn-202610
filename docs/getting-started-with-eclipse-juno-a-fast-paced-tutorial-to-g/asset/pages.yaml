  md: "# MouseEvent\n\nA `MouseEvent` occurs when a mouse button is pressed. A `MouseListener`\
    \ can be used to handle three types of events:\n\n+   - `MouseButtonPressed`:\
    \ This event takes place when a button is pressed, but not released\n+   - `MouseButtonReleased`:\
    \ This event takes place when a button that has been pressed is released\n+  \
    \ - `MouseDoubleClick`: This event takes place when a mouse button is double-clicked.\
    \ Each of the these events have a corresponding method in the listener class that\
    \ is called when an event takes place.\n\nThe following code snippet shows a listener\
    \ handling mouse events:\n\n```\n```java\n...\npublic class MouseExample {\n \
    \   public static void main(String[] args) {\n        Display display = new Display();\n\
    \        final Shell s = new Shell(display);\n        s.setSize(500,400);\n  \
    \      s.setText(\"MouseEvent\");\n        s.open();\n\n        s.addMouseListener(new\
    \ MouseListener() {\n            public void mouseDown(MouseEvent e) {\n     \
    \           System.out.println(\"Position:\" + e.x + \" \" +\n               \
    \     e.y);\n            }\n            public void mouseUp(MouseEvent e) {\n\
    \                System.out.println(\"Position2:\" + e.x + \" \" +\n         \
    \           e.y);\n            }\n            public void mouseDoubleClick(MouseEvent\
    \ e) {\n                System.out.println(\"Double click\");\n            }\n\
    \        });\n        while(!s.isDisposed()){\n            if(!display.readAndDispatch())\n\
    \                display.sleep();\n        }\n        display.dispose();\n   \
    \ }\n}\n...\n```\n```"
