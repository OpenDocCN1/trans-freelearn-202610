- pgno: 208
  md: 'Now run the project. Open the view that we just created by selecting Window
    | Show View | Other or by using the Ctrl + 3 shortcut and typing the view''s name.
    Our view should look like this:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_208_0.png)


    Try writing something in the text field and restarting the runtime workbench.
    Note that you must close the Eclipse instance instead of clicking the Terminate
    button (red stop button) in your development environment. The Terminate button
    simply kills the instance, giving no time for the platform to save your view''s
    state.


    # Exporting a plugin


    So far we have only executed our plugins in our runtime workbench. In order to
    provide our plugin to be installed in other machines, we have to export it. To
    do it, right-click your plugin project and select Export. The export wizard contains
    four different ways of exporting plugin projects. We will use the Deployable plug-ins
    and fragments option. Select it and click on Next.


    The next wizard page allows you to choose the plugins you wish to export. There
    are three possible destinations for your plugins: a directory, an archive file,
    or a host. If you choose to export your plugins into a directory, each plugin
    will be bundled into its own .jar file and placed inside a plugins folder. To
    install your plugins, simply move these jar files into the plugins folder inside
    your Eclipse installation folder. The archive option does the same thing, but
    on top of that archives the plugins folder into a .zip file. The Install into
    host option allows you to deploy your plugin directly into an Eclipse installation.


    The Options tab allows you to also export your plugin''s source code. If you select
    this option, the JAR file containing your plugin will also contain a src folder
    with all your classes'' code in it. The JAR Signing tab lets you sign your plugin''s
    JAR file using a keystore.'
  merge: -1
  img_proc: true
