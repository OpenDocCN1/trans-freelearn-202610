- pgno: 75
  md: "```\npublic void testAdd() {\n    calculator.add(2);\n    calculator.add(2);\n\
    \    // result should be 4\n    assertEquals(4/*expected*/, calculator.getResult()/*actual*/);\n\
    \    calculator.clear();\n}\n```\n\nNote that calculator is now an instance variable,\
    \ and neither testAdd() nor testSubtract() (not shown in the code snippet) need\
    \ to instantiate a local version of BasicCalculator; they simply use the calculator\
    \ instance variable. Also note that all initialization code was moved to the setup\
    \ method, which JUnit makes sure to invoke before executing each test method.\
    \ Normally, methods that contain the initialization code needed for exercising\
    \ the program under test are named setup. Likewise, methods containing the cleanup\
    \ code are named teardown. Given that each test case now uses its own instance\
    \ of BasicCalculator, if result were not a static variable, we would not need\
    \ to invoke clear() on those instances. So, we would be able to safely get rid\
    \ of all calls to clear(). However, since it is a static variable, we still need\
    \ to invoke clear() after each test method.\n\n> Since methods noted with @Before\
    \ run before each test case, there are no side effects among test runs.\n\nIn\
    \ our example, the cleanup code should be extracted into a method denoted with\
    \ @After. By doing so, this method will be executed after each test case. Go ahead\
    \ and implement the cleanup code as follows:\n\n```\n@After\npublic void teardown()\
    \ {\n    calculator.clear();\n    calculator = null; //this isn't really necessary\n\
    }\n```\n\nLooking closely at our code, we can see that we do not need a new BasicCalculator\
    \ object before executing our test methods. We can re-use one instance of BasicCalculator\
    \ as long as we invoke clear() on that instance, after the execution of each test\
    \ method. You might be wondering how to achieve this using JUnit. Actually, it\
    \ is quite straightforward. JUnit provides an annotation that allows us to signal\
    \ what methods must be executed prior to running all the test methods. The annotation\
    \ that makes this possible is @BeforeClass. To be annotated with @BeforeClass,\
    \ a method must be declared as public as well as static, and it can take no parameters.\
    \ We no longer need the previous setup() method, so let's tweak it so that it\
    \ will be executed only once for all the test cases (note that our teardown()\
    \ method is still invoked after each test method to reset the result of calculator):"
  merge: -1
  img_proc: true
- pgno: 76
  md: "```\n```java\nprivate static BasicCalculator calculator;\n\n@BeforeClass\n\
    public static void setup() {\n    calculator = new BasicCalculator();\n}\n\n@After\n\
    public void teardown() {\n    calculator.clear();\n}\n```\n```\n\nNow, let's move\
    \ on to more challenging arithmetic operations. Let's get down to tackling the\
    \ test of the multiply() and divide() methods. Luckily for us, testing multiply\
    \ is straightforward, as shown in the following code snippet:\n\n```\n```java\n\
    @Test\npublic void testMultiply() {\n    calculator.add(10);\n    calculator.multiply(3);\n\
    \    assertEquals(30, calculator.getResult());\n}\n```\n```\n\nAlthough testMultiply()\
    \ looks quite simple, upon running it, we discover a bug. As shown in the following\
    \ screenshot, instead of returning 30, getResult() returns 9. Note how the error\
    \ message uses the expected value and the actual value to inform us that our test\
    \ failed.\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_76_0.png)"
  merge: -1
  img_proc: true
- pgno: 77
  md: "Puzzled, we take a look at the implementation of multiply to discover that\
    \ rather than multiplying `result` by the parameter `n`, we are multiplying `n`\
    \ by itself and assigning this value to `result`. Fortunately, the fix is easy:\n\
    \n```\npublic void multiply(int n) {\n    result *= n;\n}\n```\n\nAs you can see,\
    \ even simple test methods are effective weapons against the bugs that lurk in\
    \ our code. Nevertheless, so far we just wrote test methods that exercise the\
    \ happy path of the code of our `BasicCalculator`. Sometimes we need to write\
    \ test methods that exercise edge cases of the chunk of code under test. In Java,\
    \ inputs that cause a certain method to throw an exception can be considered edge\
    \ cases. For example, an edge case that our calculator has to cope with is division\
    \ by zero.\n\nIn Java, an attempt to divide an integer by zero will lead to an\
    \ `ArithmeticException`. If it is expected from our calculator to throw an `ArithmeticException`\
    \ whenever there is a division by zero, we need to explicitly state this expectation\
    \ in our tests.\n\nFortunately, JUnit provides a way to deal with these edge cases\
    \ and the associated expected exceptions effectively. The `@Test` annotation supports\
    \ two optional parameters. The first, `expected`, specifies that a test method\
    \ should throw an exception. If the underlying method throws no exception or the\
    \ thrown exception is different than the one specified, the test fails.\n\nFor\
    \ instance, we can use this annotation to implement an edge case of our `testDivision()`\
    \ method as in the following code. It specifies that the method `divide()` from\
    \ `BasicCalculator` should throw an exception (`ArithmeticException`) whenever\
    \ a division by zero takes place. Note that we do not need to use any assert method\
    \ since the only outcome that we are expecting is an `ArithmeticException`. It\
    \ is worth mentioning that the class passed as parameter to `expected` must be\
    \ a subclass of `java.lang.Throwable`.\n\n```\n@Test(expected=ArithmeticException.class)\n\
    public void testDivide() {\n    calculator.add(10);\n    calculator.divide(0);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 78
  md: "There is yet another way of achieving the same behavior. You can go about declaring\
    \ expected exceptions through JUnit's ExpectedException rule. First, let us give\
    \ you a crash course in JUnit rules.\n\nIn earlier versions of the test framework,\
    \ it was not possible to modify or augment JUnit's internal knowledge about a\
    \ given test suite. Using the current version, we can use rules to modify test\
    \ results, change a test in a certain way before running it, and add information\
    \ to test results. We will use the @Rule annotation to inform JUnit which rules\
    \ to apply to the underlying test.\n\nBy using ExpectedException in conjunction\
    \ with @Rule, you can specify in-test expectations regarding the exceptions that\
    \ should be thrown for a particular test method. It takes more typing than expected,\
    \ however, as shown here, you have more control over what is expected. For instance,\
    \ you can even specify the message what the expected exception should contain.\n\
    \n```\n```java\n@Rule\npublic ExpectedException thrown = ExpectedException.none();\n\
    \n@Test\npublic void testDivide() {\n    thrown.expect(ArithmeticException.class);\n\
    \    thrown.expectMessage(\"/ by zero\"); //specify the expected message\n   \
    \ calculator.add(10);\n    calculator.divide(0);\n}\n```\n```\n\nAs for the second\
    \ optional parameter of @Test, timeout, it causes a test method to fail if it\
    \ takes longer than a specified amount of milliseconds to execute. To give you\
    \ an example, let's say that we implemented testSquareRoot as an infinite loop,\
    \ which fails after 1 second. Upon running the code below you should get a red\
    \ bar along with a java.lang.Exception containing the following message: \"test\
    \ timed out after 1000 milliseconds\".\n\n```\n```java\n@Test(timeout=1000)\n\
    public void testSquareRoot() {\n    while(true);\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 79
  md: "Okay, by now, we believe that you got the gist of writing test methods using\
    \ JUnit and Eclipse. We even were able to uncover a bug in our calculator. Granted,\
    \ it was a very simple, easy-to-spot bug.\n\nWe are sorry to say that not every\
    \ bug is simple to uncover. Sometimes you might get a red bar that leaves you\
    \ at a loss to figure out how to fix the problem. In other words, when a test\
    \ fails, and you just cannot figure out why, even after spending quite some time\
    \ staring at the code, you need to turn to a debugger. To illustrate this somehow,\
    \ let's implement the test method, testAddResultToTempAt. The addResultToTemp\
    \ method should perform the following operation: add the current value of store\
    \ in the variable result to a position in the tempVars array, according to the\
    \ index passed as parameter. During the implementation of this test method, we\
    \ realized that we did not implement a method to get this array of temporary results\
    \ back. When implementing unit tests, realizing that you forgot something happens\
    \ more often than not. To set this matter right, we add a simple get method, named\
    \ getTemps, which simply returns the variable tempVars.\n\n```\npublic int[] getTemps()\
    \ {\n    return tempVars;\n}\n```\n\nAs for our test method, which uses our recently\
    \ implemented getTemps, we implemented it as the following:\n\n```\n@Test\npublic\
    \ void testAddResultToTempAt() {\n    calculator.add(9);\n    calculator.addResultToTempAt(1);\n\
    \    int[] temps = calculator.getTemps();\n    assertEquals(9, temps[1]);\n}\n\
    ```"
