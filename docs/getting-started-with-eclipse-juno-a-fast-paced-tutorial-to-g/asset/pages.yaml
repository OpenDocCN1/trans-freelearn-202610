  md: "# The contact editor\n\nIn order to create new contact entries and edit the\
    \ existing ones, we will create a contact editor. Before we work on the ContactEditor\
    \ class itself, let's create an editor input for it. An editor input represents\
    \ the entry that is being editing. An editor input for a file, for example, could\
    \ contain the path for the file being edited. Because our application's contents\
    \ will be stored in-memory only, the editor input must contain the Contact object\
    \ itself. Create a class named ContactEditorInput that implements the IEditorInput\
    \ interface, with the following code:\n\n```\npublic class ContactEditorInput\
    \ implements IEditorInput {\n\n    private Contact contact;\n\n    public ContactEditorInput(Contact\
    \ contact) {\n        super();\n        this.contact = contact;\n    }\n\n   \
    \ public Contact getContact() {\n        return contact;\n    }\n\n    @Override\n\
    \    public String getToolTipText() {\n        return contact.getName();\n   \
    \ }\n\n    @Override\n    public String getName() {\n        return contact.getName();\n\
    \    }\n\n    @Override\n    public boolean equals(Object obj) {\n        if(obj\
    \ instanceof ContactEditorInput){\n            if(((ContactEditorInput)obj).getContact().equals(this.contact)){\n\
    \                return true;\n            }\n        }\n        return false;\n\
    \    }\n\n    //Auto-generated method stub\n}\n```"
