  md: 'Like SVN and CVS, it is also possible to look at the history of the changes
    by going to the **History** tab shown in the following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_98_0.png)


    In the previous screenshot, it is possible to see the last commits, along with
    details of the **Author**, **Committer**, and **Committed Date**. If one selects
    **commit**, it becomes possible to visualize further information. It is also possible
    to move to the position of a specific commit, rebasing the resources in that position
    by right-clicking on it and selecting the **Rebase** option.


    After checking out a given branch by right-clicking on it and going to the **Checkout**
    option, the project will be available on the Eclipse workspace. When you modify
    a given file, you often need to add that modification to a local commit so that
    it gets pushed to the remote repository. Usually before committing to a **Git
    repository**, you need to mark the changes that should be committed. This operation
    is called by adding the files to the staging area. Nevertheless, in the EGit plugin,
    you can select which file is going to be committed in the **GUI interface** by
    selecting the **commit** option when right-clicking on the branch being used.
    Afterwards, it is necessary to type a commit message describing what modification
    was performed.


    After this operation, the **push** option can be used so that this modification
    gets pushed upstream. In some cases, when another person has also modified the
    same resource, there may be merge conflicts; they can be resolved with the assistance
    of the merge tool of EGit. The **commit** option can be seen when right-clicking
    on the node containing the current branch (**master**, in this case).'
