- pgno: 224
  md: "# The contact list view\n\nWe will start by coding the view that contains a\
    \ list of the contacts. To create this list, we will use the SWT's TableViewer\
    \ element. Even though this is a very basic view, we will use label and content\
    \ providers for the sake of demonstration. A label provider is a special class\
    \ that is responsible for mapping models to their corresponding entries in a viewer.\
    \ In our TableViewer case, it will provide a label that represents contact. We\
    \ will use the contact's name for that. The content provider feeds the viewer\
    \ with the elements it should contain. We will use a simple SWT implementation\
    \ named ArrayContentProvider, which supplies elements via an array.\n\nLet's begin\
    \ with the contact model. Create a class named Contact that contains three strings\
    \ along with their getters and setters: name, address, and phoneNumber. Also create\
    \ a constructor with all the strings.\n\nThe next class we will work on is the\
    \ label provider. Create a class named ContactLabelProvider and make it implement\
    \ the ILabelProvider interface. Use the Eclipse code generation features presented\
    \ in Chapter 2, Java Development, to create default implementations for the interface's\
    \ methods. The only method we will modify is getText. This is where we will determine\
    \ that the contact will be represented by its name in the contact list. We need\
    \ to get the element parameter, check if it is an instance of Contact, and return\
    \ the contact's name. The following code does that:\n\n```\n```\n@Override\npublic\
    \ String getText(Object element) {\n    if(element instanceof Contact){\n    \
    \    return ((Contact)element).getName();\n    }\n    return null;\n}\n```\n```\n\
    \nNow that we have everything we need, let's start working on the ContactList\
    \ view itself. Create a class named ContactListView with the following code:\n\
    \n```\n```\npublic class ContactListView extends ViewPart {\n\n    private TableViewer\
    \ contactsViewer;\n    private List<Contact> contacts;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 225
  md: "```\n@Override\npublic void createPartControl(Composite parent) {\n    contactsViewer\
    \ = new TableViewer(parent);\n    contactsViewer.setContentProvider(new ArrayContentProvider());\n\
    \    contactsViewer.setLabelProvider(new ContactLabelProvider());\n    contacts\
    \ = new ArrayList<Contact>();\n    contactsViewer.setInput(contacts);\n}\n\n@Override\n\
    public void setFocus() {\n\n}\n\npublic void addEntry(Contact contact){\n    contacts.add(contact);\n\
    \    contactsViewer.refresh(true);\n}\n\npublic void refreshEntries(){\n    contactsViewer.refresh(true);\n\
    }\n}\n```\n\nThe imports section was omitted. As we have seen in the previous\
    \ chapter, an easy way of creating a view is by extending the `ViewPart` class.\
    \ This requires us to implement the `createPartControl` and `setFocus` methods.\
    \ In the `createPartControl` method, we are supposed to instantiate all of the\
    \ SWT elements contained in the view. The `setFocus` method is executed when focus\
    \ is assigned to the view. This method typically assigns focus to one of the SWT\
    \ elements in the view. We will ignore `setFocus` for now and use an empty implementation.\
    \ In the `createPartControl` method, we initialize the `TableViewer` interface\
    \ and associate it with the `ContactLabelProvider` class we just created. We also\
    \ create a new `ArrayContentProvider` method and supply it with an empty `ArrayList`\
    \ instance. This list will be modified as we create new contact entries. We have\
    \ also created two methods (`addEntry` and `refreshEntries`) to simplify and encapsulate\
    \ the task of adding new contacts to the list."
