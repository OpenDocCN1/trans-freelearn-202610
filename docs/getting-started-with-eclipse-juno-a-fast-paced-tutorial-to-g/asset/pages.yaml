    of São Paulo, Brazil. He has spent a year as a visiting scholar at the Institut
    National de Recherche en Informatique et Automatique, Rocquencourt, France. He
    is also a software engineer and since 2011, is working at IBM.


    > I would specially like to thank Carolina, who gave me the strength to work on
    this book.


    **Vinicius H. S. Durelli** is a Ph.D. candidate in Computer Science at the University
    of São Paulo, Brazil. As part of his doctoral studies, from 2011 to 2012, he was
    a visiting scholar at the George Mason University, Virginia, USA. He received
    his M.S. in Computer Science from the Federal University of São Carlos in 2008.
    He has been a Sun Certified Java Programmer since 2006. Also, he has been using
