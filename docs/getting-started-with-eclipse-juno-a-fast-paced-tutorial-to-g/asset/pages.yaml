    # GridLayout


    GridLayout is an excellent option for dealing with layouts. It has several configuration
    fields and it is possible to organize the controls of a composite by associating
    each one with a layout data object provided by the GridData class.


    In GridLayout, it is necessary to specify the number of columns of a grid. The
    widgets are assigned to the columns in the order they are created, starting from
    the left and moving to the right. When no more columns are available, the next
    control is placed in the next row. It provides great flexibility, as each control
    can also span cells horizontally and vertically.


    The following public fields are available for GridLayout:


    +   - horizontalSpacing: Specifies the number of pixels among the horizontal edges
    of a cell

    +   - makeColumnsEqualWidth: Specifies whether all the columns need to have the
    same width

    +   - marginBottom: Specifies the number of pixels in the vertical margin of the
    bottom edge of a cell

    +   - marginHeight: Specifies the number of pixels in the vertical margin of the
    bottom and top edges of a cell

    +   - marginLeft: Specifies the number of pixels in the horizontal margin of the
    left edge of a cell

    +   - marginRight: Specifies the number of pixels in the horizontal margin of
    the right edge of a cell

    +   - marginTop: Specifies the number of pixels in the vertical margin of the
    top edge of a cell'
