- pgno: 99
  md: '![](img/d7c3f2018603810fae83e1a6fd98749e_99_0.png)


    Another operation that can be performed is the checkout. This operation allows
    you to jump among the branches of a repository. In EGit, you simply need to right-click
    on the desired branch and select the **Checkout** option. Remember to verify if
    you have committed any changes that you performed in the previous branch, otherwise
    they may get lost if you stash (discard) them.


    When updating the local repository with the **remote repository**, you need to
    use the **fetch** option. Afterwards, you can choose to **rebase** or **merge**
    the upstream repository with yours using the **rebase** option; this means that
    the repository is going to get cloned and the possible commits of yours that are
    not upstream will later be applied to the tree. The other option is to merge the
    files present in the local commits with the **remote repository**. If you choose
    to use the **pull** option, by default it performs the **fetch** and **merge**
    operations.'
