- pgno: 101
  md: '# 5

    SWT


    The **Standard Widget Toolkit (SWT)** consists of a set of tools created by the
    Eclipse project developers to build **Graphical User Interface (GUI)** applications
    easily. This open source widget toolkit provides efficient and portable access
    to the user interface facilities by focusing on the target operating system.


    Although Java provides support for the development of GUI applications by using
    the **Abstract Windowing Toolkit (AWT)** and the Java foundation classes (swing),
    both cannot seamlessly integrate with the target operating system.


    SWT supports widgets that makes use of operating-systems-specific libraries and
    grant access to them from a set of Java classes that are responsible for communicating
    with the native code. The outcome is the achievement of better performance with
    the native code, preserving the ability of writing the desired code only a single
    time so that it can be used across multiple platforms. Since the code is native,
    the look and feel of the applications follow the target platform, and the task
    of drawing the graphics is performed by the compiled code that is not part of
    the **Java Virtual Machine (JVM)**. A minor setback is the necessity of deploying
    a run-time library for each platform that is going to execute the application.


    In this chapter the following topics are discussed:


    +   - Setting up an environment for developing SWT applications

    +   - Widgets and displays

    +   - Several user interface elements (controls), such as labels, texts, lists,
    buttons, and combos

    +   - Layout styles'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Getting started


    As previously mentioned, SWT is a widget toolkit for Java. A widget is a GUI element
    developed to provide interaction with an user. Text, labels, lists and buttons
    are examples of widgets. For making use of widgets and getting started with the
    development of SWT applications, some configurations must be performed, as described
    in the next section.


    # Setting up


    Although SWT is integrated as part of the Eclipse plug-in API, for older versions
    or for the development of standalone applications, it may be necessary to download
    the standalone SWT.


    For that, one must go to www.eclipse.org/swt. After selecting the appropriate
    version (in our case swt-4.2.1-gtk-linux-x86.zip), it is necessary to import the
    downloaded file into Eclipse by going to File | Import... | Existing projects
    into workspace | Select archive file, and by hitting the Browse button to locate
    the SWT library file, as it is shown in the following screenshots:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_102_0.png)


    (a) Import Source'
  merge: -1
  img_proc: true
- pgno: 103
  md: "![](img/d7c3f2018603810fae83e1a6fd98749e_103_0.png)\n\n(b) SWT Library Archive\
    \ File\n\nAfter these first steps, it is necessary to include the library in the\
    \ Java build path of the working project. We show the source code of a sample\
    \ Hello World SWT program that is used in our explanation on how to add library\
    \ in the path, as follows:\n\n```\nimport org.eclipse.swt.widgets.*;\npublic class\
    \ HelloWorld {\n    public static void main(String[] args) {\n        Display\
    \ display = new Display();\n        Shell shell = new Shell(display);\n      \
    \  shell.setText(\"Hello, World.\");\n        shell.open();\n        while (!shell.isDisposed())\
    \ {\n            if (!display.readAndDispatch())\n                display.sleep();\n\
    \        }\n        display.dispose();\n    }\n}\n```"
