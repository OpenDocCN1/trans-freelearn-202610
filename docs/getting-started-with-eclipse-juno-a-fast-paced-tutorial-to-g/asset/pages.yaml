  md: '> It is worth mentioning that neither JUnit nor Eclipse enforces this naming
    convention. The creation of separate folders/subpackages for tests is not mandatory
    either. However, following these conventions is a good programming practice. It
    is also worth mentioning that another widely used convention to organize test
    code is the maven convention. By following this convention, you need to create
    separate folders for regular Java code and test code, `src/main/java` and `src/test/java`.
    Also, the test classes are placed in the same package in which the classes they
    test are placed.


