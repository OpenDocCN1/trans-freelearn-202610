- pgno: 176
  md: "Eclipse will generate the following code. The first line is a JSP directive\
    \ element. Directive elements specify various attributes related to the page itself.\
    \ Thus, it does not necessarily change the response sent to the browser, but it\
    \ informs the container how it should deal with the page. The first line is a\
    \ page directive that, among other things, specifies the content type for the\
    \ page in question: html/text. JSP directive elements start with <%@ and end with\
    \ %>, and between these two delimiters a list of name/value pairs represents the\
    \ so-called directive attributes.\n\nApart from the page directive, the auto-generated\
    \ code contains mostly HTML code. In JSP parlance, everything that is not a JSP\
    \ element is named template text. Template text is static, which means that it\
    \ is sent to the browser without undergoing any transformation.\n\nAs for the\
    \ template text in the auto-generated code, there is a title placeholder and the\
    \ body part is empty. If you know HTML and Java, writing JSP pages should be a\
    \ breeze for you. If you are not that familiar with HTML, creating JSP pages may\
    \ be a little tricky at first.\n\n```\n<%@ page language=\"java\" contentType=\"\
    text/html; charset=ISO-8859-1\"\n    pageEncoding=\"ISO-8859-1\"%>\n<!DOCTYPE\
    \ html PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\"\n\"http://www.w3.org/TR/html4/loose.dtd\"\
    >\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\ncharset=ISO-8859-1\"\
    >\n<title>Insert title here</title>\n</head>\n<body>\n</body>\n</html>\nLet's\
    \ start by replacing the title placeholder by the title we used in\nthe previous\
    \ example, namely, \"Warm Greeting\":\n<title>Warm Greeting</title>\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: 'Next, let''s add the Hello, World! static message as well as the dynamic part
    of the message: the timestamp. Adding the former is straightforward, just copy
    part of the HTML code shown in the example servlet. To include the latter, we
    are going to embed a Java expression in our page by putting them between <%= and
    %> as shown in the following code snippet:


    ```

    ```

    <%@ page language="java" contentType="text/html; charset=ISO-8859-1" pageEncoding="ISO-8859-1"%>

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">

    <title>Warm Greeting</title>

    </head>

    <body>

    <h1> Hello, World! </h1> <%-- title as template text --%>

    <%-- timestamp as embedded expression --%>

    <ul> <li>current time: <%= new java.util.Date() %> </li></ul>

    </body>

    </html>

    ```

    ```


    If you run the preceding example, you will get exactly the same message that you
    got when you executed the example servlet. Now, let''s go over the most important
    parts of the chunk of the preceding code. First, as you might have noticed, everything
    placed within <%-- and --%> is ignored by the container. You can use this to describe
    what is going on in your code or to comment out parts of the code. Given that
    JSP comments are also JSP elements, they never make it to the browser. Second,
    instead of concatenating a string and using plain I/O to write to the response,
    the preceding code uses a scripting element through which you can add Java code
    to JSPs. When you want to simply add Java code without writing the result to the
    response, you use <% and %>. When the result needs to be added to the response,
    you use <%= and %>. Thus, we used the latter to write the timestamp to the response.
    The next example shows yet another way to achieve the same thing, but this time
    using more JSP elements and scriptlets. Note that the page directive is also used
    to import java classes (and packages), as shown in the following example. In addition,
    when importing more than one class, the list of fully-qualified names must be
    separated by commas. After adding import instructions to the page directive, you
    do not need to use the fully qualified class name inside scriptlets.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '> You can also print stuff within a <% and %> pair. To do so, you have to use
    the out object. This object is always implicitly there. For example, you could
    print the Hello, World! message as: <% out.println("Hello, World!") %>. Nevertheless,
    it bears mentioning that using out.println() inside a scriptlet is a bad practice.
    Whenever possible, use an expression (<%= and %>) instead.


    ```

    <%@ page language="java" contentType="text/html; charset=ISO-8859-1" pageEncoding="ISO-8859-1"
    import="java.util.Date" %>

    <!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=ISO-8859-1">

    <title>Warm Greeting</title>

    </head>

    <body>

    <h1> <% out.println("Hello, World!"); %> </h1>

    <% Date date = new Date(); %>

    <ul> <li>current time: <%= date %> </li></ul>

    </body>

    </html>

    ```


    > Never end expressions with a semicolon. <%= date %> is correct, <%= date; %>
    is not.


    # Generating WAR files


    Java web applications are distributed in WAR (Web application Archive) files.
    A WAR file is a compressed file that keeps the structure of web applications (apart
    from the web application context directory, which is the application''s top directory),
    and includes one extra folder named META-INF. These compressed files have a .war
    extension. The META-INF folder contains metadata about the files within a WAR
    file. An important file kept in this folder is the MANIFEST.MF file. Among other
    things, such a special file has information about the files packaged in a WAR
    file.'
  merge: -1
  img_proc: true
- pgno: 179
