- pgno: 154
  md: 'Now, as you can see in the following screenshot, the server view displays the
    status of Tomcat. Through this view you can start, stop, and restart Tomcat by
    right-clicking on Tomcat''s icon:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_154_0.png)


    You are now ready to start using Eclipse with Tomcat to develop servlets and JSPs.
    Nevertheless, before implementing your first servlet, let''s take a look at how
    servlets are executed by servlet containers.


    # The servlet lifecycle


    Before we go on, a few words about the lifecycle of servlets is in order. There
    are three methods implement the lifecycle of a servlet: init(), service(), and
    destroy(). Prior to handling client requests, the servlet is instantiated and
    initialized by the servlet container (Tomcat in our case). Only one instance of
    each servlet is instantiated by the servlet container. During this initialization
    phase, the container calls init() to give the servlet a chance to run initialization
    code. Servlets operate in a multithreaded fashion, which means that their methods
    may be invoked by a number of threads. Upon receiving the first client request,
    the container starts a new thread or allocates one from the pool. Then, the execution
    of the servlet is assigned to that thread, which carries on by invoking the servlet''s
    service() method.


    > It is worth emphasizing that init() is executed only once. Also the container
    is not able to invoke service() before init() completes.


    service() takes two parameters: a request object (which is an instance of javax.servlet.http.HttpServletRequest)
    and a response object (which is an instance of javax.servlet.http.HttpServletResponse).
    It is through these two instances that the container accesses the client request
    and generates output. Within service(), the request object is examined to determine
    what sort of request it is. After determining the request type, service() dispatches
    the request and response objects to the HTTP-related method responsible for implementing
    the request in question. Two examples of HTTP-related methods are doGet() and
    doPost(). These methods correspond to the HTTP GET and POST operations, respectively.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '> In addition to doGet() and doPost(), which are used most of the time, HttpServlet
    also contains the doPut() and doDelete() methods. These methods correspond to
    the HTTP PUT and DELETE operations, respectively. But since these two are seldom
    used, we will not go into detail. It suffices you to know that they exist.


    ![](img/d7c3f2018603810fae83e1a6fd98749e_155_0.png)


    Lastly, the main purpose of destroy() is to give servlets a chance to clean things
    up. Summing up, most of the time when implementing your own servlets, the three
    methods that you will have to override are init, doGet, and doPost (and possibly
    destroy if you need to clean some resources up).


    # Implementing your very first Java servlet using Eclipse WTP


    First, we will explain how to implement servlets using Eclipse WTP, and then we
    will come around to implementing JSPs later. We will create a quite simple servlet
    that prints the classic phrase "Hello, World!". You will see that writing and
    deploying servlets using Eclipse WTP is a breeze. Certain aspects of developing
    web applications using Eclipse WTP are so easy that you may not need to type almost
    anything. So, if you are really serious about learning how to develop web applications
    using servlets and JSP, we recommend you to skim through this chapter just to
    get a feel of how to use WTP, and then take a break from Eclipse altogether and
    start arranging all the structure of your web applications by hand. That will
    help you to better understand how this sort of applications are organized and
    the number of steps Eclipse has graciously automated for you. After getting the
    gist of how to assemble, develop, and deploy web applications, you can go back
    to Eclipse in order to speed up the development process. We direct the interested
    readers to http://tomcat.apache.org/tomcat-7.0-doc/appdev/index.html for further
    information on web application development.


    To develop servlets and JSPs using Eclipse WTP, first, we need to create a new
    dynamic web project: go to File | New | Other... | Web. In the New wizard, expand
    Web, and then select Dynamic Web Project. You should reach the wizard shown in
    the following screenshot.


    If you take some time observing the items under the option Web, you will see that
    there are two types of web projects: dynamic and static. Dynamic web projects
    contain dynamic resources, such as servlets, JSPs, and a bunch of metadata, to
    name but a few items. Static web projects include only static resources, for instance,
    cascading stylesheets.'
  merge: -1
  img_proc: true
