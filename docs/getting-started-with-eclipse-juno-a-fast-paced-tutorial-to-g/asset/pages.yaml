- pgno: 211
  md: '# 9


    # Eclipse Rich Client Platform


    In the previous chapter, we have talked about plugin development for Eclipse.
    We also saw that **Eclipse** is composed of a basic platform and plugins that
    provide all of the functionalities of the **IDE**. What we didn''t tell you is
    that you can use this platform to build your own client applications from scratch,
    taking advantage of everything Eclipse offers. Imagine Eclipse without any views,
    perspectives, or toolbars – this is what the **Rich Client Platform (RCP)** provides.
    It is an empty canvas onto which you can develop your application using all of
    Eclipse''s building blocks, and any other ones you might come up with.


    In this chapter we will:


    +   - Learn what a Rich Client Platform is and how developers can benefit from
    building their applications using it

    +   - See what the Eclipse Rich Client Platform is and what it provides

    +   - Develop a very simple client application using **Eclipse RCP** to showcase
    how to use its most important features

    +   - Learn how to bundle and brand your client application'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Understanding a Rich Client Platform


    Before plunging into the Eclipse RCP, let''s define what a Rich Client Platform
    is. In the context of client/server architecture, the client application is responsible
    for getting requests from the user and sending them to a machine that will service
    the requests, accessing databases and internal systems. The popularization of
    the Internet and improvements in speed and stability has led many companies to
    switch their client applications from desktop to Internet-based ones. This switch
    conveys a number of benefits, such as ease of deployment and updates, because
    any modification can be deployed to all clients by simply modifying the code of
    the application in the web server. Therefore, there are less hardware and software
    requirements for the client side, among others benefits. However, poor user experience
    due to network latency and downtime caused by connection issues, which even though
    rare, can be crucial for business, kept alive the interest in desktop-based applications.


    Developing one of these client applications from scratch, however, is an expensive
    and time-consuming task. A number of different aspects must be thought of, such
    as portability, modularity, and update methods. That''s where a Rich Client Platform
    comes in. It offers all of these features for developers to build their own client
    applications without having to worry about the different aspects for every type
    of client application they work on. Since client applications'' user interfaces
    don''t differ much from each other, most of them are basically composed of forms
    with data-input elements, such as text fields and combo boxes. An RCP should also
    provide reusable widgets that can easily be added to the applications.


    Eclipse is not exactly a client application from a client/server architecture
    perspective. It contains all of these desirable features, and they are made available
    through the Eclipse RCP for developers interested in taking advantage of them
    for their own client applications.


    # The Eclipse Rich Client Platform


    Now that we know what a rich client platform is, let''s see in more detail what
    features the Eclipse RCP provides.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# OSGi framework implementation


    Eclipse RCP provides Equinox, an implementation of the OSGi framework. The OSGi
    framework, according to its specification document, provides a general-purpose,
    secure, managed Java framework that supports the deployment of extensible and
    downloadable applications known as bundles. Equinox provides to your client application
    all the infrastructure it needs to be a modularized application that can easily
    ship and orchestrate pieces of software from various origins.


    The functionalities that the OSGi framework specification provides can be divided
    into different layers. Let''s see these in detail.


    # The module layer


    The module layer extends the Java platform to provide packaging, deploying, and
    validating services to Java-based projects. This layer defines a unit of modularization
    named bundle, which contains the necessary resources to provide a certain functionality.
    Once loaded, a bundle can also provide services to other bundles through the OSGi
    service platform. Bundles translate to plugins in the Equinox implementation.


    Bundles are JAR files with a specific format and content. They must contain a
    MANIFEST file, which determines what the bundle provides to other bundles, the
    services it provides for the end user, and the resources that must be available
    in order to load the bundle.


    # The life cycle layer


    The life cycle layer determines the API (Application Programming Interface) that
    provides services to manage all the phases of a bundle''s life cycle, such as
    installation, starting, stopping, updating, and uninstallation. Before installation,
    the bundle is verified for a number of errors, such as compatibility between the
    bundle and current execution environment and the previous installation of the
    bundle with the same name and version. If no errors are detected, the bundle is
    considered valid and can be installed in the OSGi framework. Once installed, the
    bundle can be started. Before starting a bundle, the OSGi framework must resolve
    it, which means verifying if all of the bundle''s dependencies are met in the
    current OSGi service platform. The bundle is started by calling its Activator
    object, which is determined in the MANIFEST file. When the bundle is stopped,
    all of its resources must be released and the services it provides must be unregistered.
    Uninstalling a package notifies other bundles about the removal of the bundle
    and removes every resource associated to it from the persistent storage.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# The service layer


    The service layer defines the model through which bundles share functionalities
    between themselves. This layer is tightly integrated with the life cycle layer,
    as it determines how the bundles'' state modifications, such as installation,
    starting, and stopping, should notify other bundles about its services. Bundles
    can register or unregister services at any time. Once registered, other bundles
    can search for that service and utilize them.


    # The security layer


    The security layer is an optional layer that adds security services based on the
    Java 2 specification. In general terms, it specifies how JAR files that represent
    bundles (plugins) must be signed so that their authenticity can be verified. This
    includes determining which signing algorithms can be used and where hash files
    must be placed in the JAR file, among others.


    # SWT


    The Eclipse RCP provides the **Standard Widget Toolkit (SWT)** to supply you with
    all the building blocks you might need to create your application''s user interface.
    This means that every widget presented in *Chapters 5, SWT* and *Chapter 6, More
    SWT* can be used here.


    # JFace


    **JFace** is a user interface framework that goes on top of the widget toolkit.
    Its main objective is to make UI programming easier and increase code reuse by
    providing the following among others:


    +   - Bigger building blocks than the ones provided by SWT, such as wizards, dialogs,
    and context help menus

    +   - Image descriptors and registry, lifting the developer from the obligation
    of loading, and managing and disposing images

    +   - Viewers that help populating, sorting, and updating widgets'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'JFace does not intend to completely hide SWT. It allows the developer to choose
    between using JFace or SWT directly, depending on what is more convenient in each
    situation. While JFace is completely dependent on SWT, SWT does not depend on
    JFace whatsoever.


    We have already used some of the JFace features in *Chapter 8, Eclipse Development*.
    We utilized the `MessageDialog` class to display the `hello world` message without
    having to worry about creating the dialog and adding its elements, such as the
    **OK** button, the information icon, and the message itself. We have also used
    the `ITextSelection` class to get the text selected in a text editor.


    # Eclipse workbench


    The Eclipse RCP also allows the Eclipse workbench to be utilized in client applications.
    You can re-use Eclipse''s toolbars, views, editors, and perspectives according
    to your needs, as well as make custom ones specifically for your application,
    extending existing Eclipse classes, or making them from scratch. Given that, everything
    we saw in the *Creating New Views* section of the previous chapter is also valid
    here. You will have the whole underlying platform that''s required to display
    and manage the arrangement of these UI elements.


    # Developing a client application using the Eclipse RCP


    The best way of showing the basics of client application development with the
    Eclipse RCP is by using an example. As we have seen in *Chapter 8, Eclipse Development*,
    Eclipse contains useful plugin project templates that can get you going into plugin
    development in no time. The same goes for RCP applications. Let''s create a new
    RCP application project using a template to have an idea of what a basic RCP application
    project looks like.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Creating a new client application project using a template


    The process of creating an RCP application is very similar to that of creating
    a plugin project. Navigate to **File | New | Other**, and in the wizard window,
    select **Plug-in Project**. Click on **Next**. In the next wizard window, fill
    in the project''s **Name** field with something such as `HelloRCP`, and then click
    on **Next**. In the next window, select **Yes** for the **Would you like to create
    a rich client application** question, as shown in the following screenshot:


    ![](img/d7c3f2018603810fae83e1a6fd98749e_216_0.png)


    The next wizard window contains the available RCP templates. Let''s use the **RCP
    application with a view** template. The last page contains some basic information
    required by this template. Let''s leave the default values and click on **Finish**.
    You will be asked if you want to switch to the **Plug-in Development** perspective
    at this point if you''re not already using it. This perspective adds views and
    menu entries that can be very useful for plugin development, so go ahead and choose
    **Yes**. The project will appear in the **Package Explorer** window and the **Plug-in
    Manifest Editor** window will be opened.'
  merge: -1
  img_proc: true
- pgno: 217
  md: "If you take a look at the project's contents, you will notice that they are\
    \ very similar to the contents of a Plug-in project. This is because an RCP application\
    \ is actually a plugin. The implementation of the org.eclipse.core.runtime.applications\
    \ extension point, which can be verified in the Extensions tab of the Plug-in\
    \ Manifest Editor window, sets it apart from a regular plugin project. Notice\
    \ that the Application element points to a class named Application.\n\n# A closer\
    \ look at the generated source code\n\nWe will now look at the content of classes\
    \ generated by the template to understand what they do and why they are there.\
    \ Let's start with the Application.java source file. As you can see, this class\
    \ is an implementation of the IApplication interface, which contains the following\
    \ two methods:\n\n```\npublic Object start(IApplicationContext context) {\n  \
    \  Display display = PlatformUI.createDisplay();\n    try {\n        int returnCode\
    \ = PlatformUI.createAndRunWorkbench(display, new ApplicationWorkbenchAdvisor());\n\
    \        if (returnCode == PlatformUI.RETURN_RESTART) {\n            return IApplication.EXIT_RESTART;\n\
    \        }\n        return IApplication.EXIT_OK;\n    } finally {\n        display.dispose();\n\
    \    }\n}\n```\n\nAnd\n\n```\n/* (non-Javadoc)\n * @see org.eclipse.equinox.app.IApplication#stop()\n\
    \ */\npublic void stop() {\n    if (!PlatformUI.isWorkbenchRunning())\n      \
    \  return;\n    final IWorkbench workbench = PlatformUI.getWorkbench();\n    final\
    \ Display display = workbench.getDisplay();\n    display.syncExec(new Runnable()\
    \ {\n        public void run() {\n            if (!display.isDisposed())\n   \
    \             workbench.close();\n        }\n    });\n}\n```"
  merge: -1
  img_proc: true
- pgno: 218
  md: "As the names imply, the start method is called during the application's startup,\
    \ and the stop method is called when the application is stopped. The start method\
    \ can return any type of object, including integers, as is the case with the Application\
    \ implementation. This is a very basic implementation that simply creates a new\
    \ Display object and calls the static PlatformUI.createAndRunWorkbench method.\
    \ This method receives a WorkbenchAdvisor object as a parameter. This object allows\
    \ you to configure some basic aspects of your application's look and feel. Every\
    \ RCP application must implement a WorkbenchAdvisor object. The Display object\
    \ manages the connection between SWT and the operating system. For most RCP applications,\
    \ you won't need much more than these in the start method to get it going. The\
    \ stop method simply closes the workbench created during the start method.\n\n\
    Now let's take a closer look at the generated extension of the WorkbenchAdvisor\
    \ class, the ApplicationWorkbenchAdvisor extension:\n\n```\npublic class ApplicationWorkbenchAdvisor\
    \ extends WorkbenchAdvisor {\n\n    private static final String PERSPECTIVE_ID\
    \ = \"HelloRCP.perspective\";\n\n    public WorkbenchWindowAdvisor createWorkbenchWindowAdvisor(\n\
