    \        Contact contact = new Contact(\"New Contact\", \"\", \"\");\n       \
    \ IViewPart view = PlatformUI.getWorkbench().\ngetActiveWorkbenchWindow().getActivePage().findView(\"\
    ContactsList.\nContactsListView\");\n        ((ContactListView) view).addEntry(contact);\n\
    \        return null;\n    }\n}\n```\n\nThe new contact handler simply creates\
    \ a new Contact object and calls the addEntry method in the ContactsListView view.\n\
    \nLet's proceed with the necessary modifications in the plugin.xml file, which\
    \ is similar to what was demonstrated in the previous chapter. Add an extension\
    \ to the org.eclipse.ui.commands extension point and add command elements for\
    \ the Save and New commands. In the example, we use contactsList.save and contactsList.new\
    \ as IDs and Save and New as names. Now add the org.eclipse.ui.handlers extension,\
    \ and create two handler elements for the commands, linking them to the handler\
    \ classes we just created.\n\nThe next step is to add the menu entries for these\
    \ commands. Let's add a File entry in the main menu with the New and Save entries\
    \ and a Save button in the toolbar. Add the elements shown in the following screenshot\
    \ to create them:\n\n![](img/d7c3f2018603810fae83e1a6fd98749e_232_0.png)"
