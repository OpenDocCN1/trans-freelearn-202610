    ![](img/d7c3f2018603810fae83e1a6fd98749e_223_0.png)


    Ok, so let''s get our hands on it. As you have seen in the previous example, Eclipse
    templates are a good way of getting started; so let''s use it in this example
    too. Navigate to File | New | Plug-in Project and create a new RCP project named
    ContactsList using the HelloRCP template. Change the application window title
    to something more appropriate, such as Contacts List.


    The project has a similar structure to the previous example, but with fewer classes.
    Let''s run the application to make sure everything is okay. Open the Plug-in Manifest
    Editor, switch to the Overview tab, and click on the Launch an Eclipse Application
    link in the column to the right. You will see an empty window named Contacts List,
    which is exactly what we expected by now. Let''s close it and proceed to developing
    the application.'
