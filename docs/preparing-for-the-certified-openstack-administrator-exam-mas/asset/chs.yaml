- "# 5 Nova 计算服务\n## Nova 计算服务\n\n在上一章中，我们讨论了 Glance 镜像服务以及认证 OpenStack 管理员考试中与 Glance\
  \ 相关的目标。但如果我们无法启动镜像，它有什么用呢？这就是 Nova 登场的地方！Nova 是 OpenStack 计算服务，是 OpenStack 云的核心。它旨在管理和自动化计算资源池，并与各种现有的虚拟化技术协同工作。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- Nova 架构\n- Hypervisor 类型\n- 考试目标 - 管理密钥对\n- 考试目标 - 管理 flavor\n\
  - 考试目标 - 启动实例\n- 考试目标 - 访问实例\n- 考试目标 - 快照实例\n- 考试目标 - 管理实例状态\n\n在阅读本章后，您应对 Nova\
  \ 有扎实的理解，并具备成功完成考试中所有与 Nova 相关目标所需的技能。\n\n### Nova - 计算编排器\n\nNova 服务是 OpenStack\
  \ 云的核心。它是一组守护进程，共同编排计算资源的可获得性，利用在 Linux 机器上运行多年的虚拟化功能！与其重新发明轮子，Nova 可与多种现有的 hypervisor\
  \ 技术协同工作，包括 QEMU-KVM、QEMU、Hyper-V、VMware ESXi、Xen 和 XenServer。它还支持利用现有的 Linux 容器技术，如\
  \ LXC 和 Docker。当启动一个实例时，Nova 利用计算节点上的可用 CPU、内存和磁盘资源。在生产 OpenStack 环境中，客户可能拥有从 5\
  \ 到 5,000 个托管虚拟机实例的计算节点。\n\n### Nova 架构\n\n图 5.1 显示了 Nova 架构的高级图。Nova 由六个守护进程组成：\n\
  \n- **nova-api**：通往 Nova 的主要网关。必须与 `nova-api` 交互以创建、列出、删除和管理实例。\n- **nova-scheduler**：评估并过滤所有可用的计算主机，以确定启动实例的最佳计算节点。`nova-scheduler`\
  \ 的行为可以根据特定特征进行修改，例如 CPU 架构或数据中心中的特定位置。\n- **nova-conductor**：一个“数据库代理”，直接连接到 OpenStack\
  \ 环境的关系数据库。由于计算节点（或 hypervisor）是多租户虚拟化环境中信任度最低的组件，所有数据库通信都通过 `nova-conductor` 进行。\n\
  - **nova-novncproxy**：通过 VNC 客户端或 Web 浏览器为 Nova 实例提供串行控制台访问。\n- **nova-consoleauth**：接收来自\
  \ `nova-novncproxy` 的请求以授权用户的令牌，并映射实例 VNC 服务器的私有主机和端口。\n- **nova-compute**：在 hypervisor\
  \ 上管理虚拟机。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_146_0.png)\n\n图 5.1：Nova 架构的高级图\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_146_1.png)\n\n在 OpenStack 中，术语 *启动* 用于指代虚拟机的创建。用\
  \ Nova 启动的虚拟机通常称为实例。要用 Nova 启动实例，通常需要提供所需的 Glance 镜像和 Nova flavor。Nova flavor 是预先配置的\
  \ CPU、内存和本地磁盘配置的配置文件，将在后续章节中更详细地讨论。\n\n### Hypervisor 类型\n\nNova 与多种 hypervisor\
  \ 类型兼容。让我们谈谈其中一些流行的类型：\n\n- **QEMU (Quick Emulator)**：发布于 2003 年，QEMU 是一个开源 hypervisor，提供全系统仿真。它可以在没有\
  \ CPU 协助的情况下仿真一个或多个处理器，尽管它往往有点慢。\n- **XEN**：发布于 2003 年，最初是剑桥大学的一个项目，Xen 是开源的，实现了称为\
  \ *准虚拟化*（PV）的技术。PV 不需要具有虚拟化扩展的处理器，而是依赖于 VM 客户机内部的驱动程序。Xen 已被许多流行的公共云服务使用，包括 Slice\
  \ Host、Rackspace 和 Amazon Web Services。\n- **QEMU-KVM (Quick Emulator-Kernel-based\
  \ Virtual Machine)**：发布于 2006 年，QEMU-KVM 是 QEMU 的一个分支，继续使用 QEMU 来虚拟化客户机的外设，但也利用具有硬件虚拟化扩展的处理器。QEMU-KVM\
  \ 速度很快，因为它能够以接近原生速度虚拟化客户机！这通常被称为硬件辅助虚拟化或 HVM。\n\nLibvirt 是一个开源 API 守护进程，通常用于管理上述任何\
  \ hypervisor。在 OpenStack 环境中，`nova-compute` 将利用 Libvirt 守护进程 `libvirtd` 来管理虚拟机。参见图\
  \ 5.2。\n\n除了这些开源 hypervisor 之外，`nova-compute` 还与 Microsoft 的 Hyper-V hypervisor、VMware\
  \ vCenter 和 XenServer（基于 Xen 构建的商业支持虚拟化产品）兼容。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_147_0.png)\n\
  \n图 5.2：nova-compute 与多种商业和开源 hypervisor 兼容\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_148_0.png)\n\
  \n本书随附的 OpenStack 虚拟设备配置为使用 QEMU hypervisor。如果您尝试启动较大的云镜像（例如 Ubuntu 或 Centos），它将运行缓慢。不幸的是，即使在笔记本电脑或桌面的\
  \ BIOS 中打开了虚拟化扩展，VirtualBox 也不会允许嵌套虚拟化。有关更多信息，请参阅 https://www.virtualbox.org/ticket/4032。\n\
  \n### 考试目标\n\n让我们看一下 Nova 考试目标。\n\n下表分解了您应为 COA 考试了解的各种 Nova 相关目标。正如您所见，所有这些任务都可以在\
  \ Horizon 仪表板和 CLI 上完成。请记住，考试时间至关重要——在许多情况下，在仪表板上处理任务可能更快。如果您对使用 CLI 有信心，并且不需要翻阅帮助来查找参数，请随意使用它！\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_148_1.png)\n\n图 5.3：Nova 考试目标\n\n###\
  \ 考试目标 - 管理密钥对\n\n密钥对是在通过 SSH 访问实例时对基于密码的身份验证的替代方案。密钥对由两个密钥组成：**public key** 和 **private\
  \ key**。这些密钥必须一起使用才能访问实例。\n\n就 SSH 密钥和 Nova 而言，OpenStack 用户有两个选项：\n\n1. 向 Nova 发送请求为您生成全新的\
  \ SSH 公钥和私钥。在这种情况下，Nova 将公钥存储在其数据库中并将私钥交给您。一旦私钥传递给您，就无法再恢复。用户必须将私钥安全保存！\n2. 如果您之前使用\
  \ `ssh-keygen`（或其他实用程序）生成了公钥和私钥对，您可以提供您的公钥供 Nova 存储在其数据库中。\n\n一旦您的公钥在 Nova 中注册，您在启动实例时选择公钥的名称。这隐式地授予拥有匹配私钥的任何人访问权限。在通过\
  \ SSH 访问实例时，您将指定您的私钥和用户名。如果实例上存在匹配的公钥，您将被授予访问权限。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_149_0.png)\n\
  \n来自同一项目的多个用户无法看到彼此注册的公钥。与 OpenStack 中的其他资源不同，**public keys are not owned by the\
  \ project**。它们归创建或注册它的用户所有。当您删除一个用户时，您也会从 Nova 中删除该用户的公钥。\n\n### Horizon 仪表板\n\n\
  让我们看看如何从 Horizon 仪表板创建 SSH 密钥对。参见图 5.4。\n\n1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定为\
  \ **human-resources** 项目。\n2. 从 **Project-Compute** 面板组中选择 **Access & Security**\
  \ 面板。\n3. 选择 **Key Pairs** 选项卡。\n4. 选择 **Create Key Pair**。\n\n\n\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_150_0.png)\n\
  \n图 5.4：在 Horizon 仪表盘上创建 SSH 密钥对\n\n- 5. 将密钥对命名为 `my-new-keypair-dashboard` 并选择\
  \ **创建密钥对**。\n- 6. Horizon 将自动向您展示私钥以供下载到本地系统。\n\nNova 不会保留私钥记录。一旦您离开下载私钥屏幕，就无法再检索它。请务必始终将私钥保存在安全的地方！\n\
  \n## CLI\n\n在 `human-resources` 项目中使用 `python-openstackclient` 创建另一个 SSH 密钥对。\n\n\
  请记住，提供的 openrc 文件包含以变量形式提供的凭证，用于正确地向 Keystone 进行身份验证并设置项目范围。\n\n让我们将原始的 openrc 文件复制到名为\
  \ `openrc-human-resources` 的新文件中。\n\n```\n$ cp openrc openrc-human-resources\n```\n\
  \n复制完成后，让我们编辑 `openrc-human-resources` 文件，更新项目和租户名称变量以反映我们希望作用域到 `human-resources`\
  \ 项目。如果您更习惯使用其他编辑器，这里也可以随意使用。\n\n```\n$ nano openrc-human-resources\n```\n\n将以下变量更改为\
  \ human-resources：\n\n```\nexport OS_PROJECT_NAME=human-resources\nexport OS_TENANT_NAME=human-resources\n\
  ```\n\n> 我们正在更改 OS_TENANT_NAME 变量，因为一些较旧的基于服务的客户端依赖于它而不是 OS_PROJECT_NAME。\n\n导入新创建的\
  \ openrc-human-resources 文件：\n\n```\n$ source openrc-human-resources\n```\n\n验证是否已正确设置变量：\n\
  \n```\n$ export | grep OS\n```\n\n现在我们已正确设置作用域，让我们为管理员用户创建一个全新的密钥对。我们将提供 > 来将私钥输出重定向到名为\
  \ my-new-keypair-cli.pem 的文件。\n\n```\n$ openstack keypair create my-new-keypair-cli\
  \ > my-new-keypair-cli.pem\n```\n\n我们使用 > 来避免在标准输出中打印私钥，并将其重定向到名为 my-new-keypair-cli.pem\
  \ 的文件。\n\n出于安全考虑，我们还应更改密钥的权限，仅允许我们（登录虚拟设备的 openstack 用户）读取该密钥。\n\n```\n$ chmod 400\
  \ my-new-keypair-cli.pem\n```\n\n我们可以通过运行以下命令来确认公钥已创建并存储在 Nova 中：\n\n```\n$ openstack\
  \ keypair list\n```\n\n请参阅图 5.5。您应该会看到输出，确认管理员用户已创建两个独立的密钥对：一个来自 Horizon 仪表盘，一个通过\
  \ python-openstackclient 创建：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_151_0.png)\n\
  \n图 5.5：'openstack keypair list' 命令的输出\n\n## 考试目标 - 管理规格\n\n在 OpenStack 中，您始终需要为虚拟机实例指定所需的\
  \ RAM、本地磁盘驱动器大小和虚拟 CPU。为了控制使用情况，OpenStack 要求用户从称为 flavors 的预定义硬件配置集合中进行选择。请参阅图 5.6。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_152_0.png)\n\n图 5.6：典型 OpenStack 环境中\
  \ Nova 规格的列表\n\n- **ID：** 规格的 UUID。\n- **Name：** 规格的名称。\n- **RAM：** 以兆字节为单位使用的 RAM\
  \ 数量。\n- **Disk：** 以千兆字节为单位用于根分区的磁盘空间量。\n- **VCPU：** 虚拟 CPU 的数量。默认情况下，Nova 使用 16:1\
  \ 的 CPU 分配比例。这允许您在每个物理核心上启动十六个 1VCPU 实例。\n- **Ephemeral：** 用于二级分区的磁盘空间量。\n- **Swap：**\
  \ 以千兆字节为单位用于交换的磁盘空间量。\n- **RXTX Factor：** 这仅由基于 Xen 或 NSX 的系统使用，允许限制附加到实例的网络的入站/出站流量。\n\
  - **Properties：** 设置在规格上的任何元数据。\n\n默认情况下，仅授予具有管理员角色的用户创建新规格的权限。作为管理员，从 Horizon 仪表盘或\
  \ `python-openstackclient` 创建和自定义新规格非常容易。\n\n### Horizon 仪表盘\n\n让我们从 Horizon 仪表盘创建一个新的规格。请参阅图\
  \ 5.7。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_153_0.png)\n\n图 5.7：创建新规格的能力仅对具有管理员角色的用户可用（默认情况下）\n\
  \n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己作用域到 **human-resources** 项目。如前所述，**Admin**\
  \ 面板组将对具有管理员角色的用户可用，无论作用域如何。我们在创建新规格时可以作用域到任何可用项目。\n- 2. 从 **Admin-System** 面板组中选择\
  \ **Flavors** 面板。\n- 3. 选择 **创建规格**。\n- 4. **Name（必填）**：规格的名称。输入 `awesome-flavor-dashboard`\n\
  - 5. **ID（可选）**：规格的 UUID。输入 `100`。将 ID 保留为 `auto` 将自动分配 UUID。\n- 6. **VCPU（必填）**：要使用的虚拟\
  \ CPU 数量。输入 `1`。超visor 上的默认超额分配比例为 16:1。这意味着大约 16 个 vCPU 对应一个逻辑处理器。\n- 7. **RAM（MB）（必填）**：以兆字节为单位使用的\
  \ RAM 数量。输入 `512`。\n- 8. **Root Disk（GB）（必填）**：以千兆字节为单位用于主磁盘的磁盘空间量。输入 `1`。\n- 9.\
  \ **Ephemeral Disk（GB）（可选）**：以千兆字节为单位用于次要磁盘的磁盘空间量。将此设置为 `0`。\n- 10. **Swap Disk（MB）**（可选）：以兆字节为单位用于交换的磁盘空间量。将此设置为\
  \ 0。\n- 11. **RXTX Factor**（可选）：这仅由基于 Xen 或 NSX 的系统使用，允许限制附加到实例的网络的入站/出站流量。如果您使用其中一个超visor，您将在配置文件中设置基本网络速度，系数<|message|>值将乘以它。要完全使用，请输入\
  \ 1。如果我们使用其中一个超visor 并希望限制为一半，我们可以输入 .5。\n- 12. **Flavor Access**（可选）：允许您将规格与特定项目或项目组共享。如果您未指定任何项目，规格将为\
  \ **public** 并可供所有域中的所有项目访问。让我们保持此规格为公开。\n- 13. 选择 **创建规格**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_154_0.png)\n\
  \n图 5.8：Flavor Access 选项卡允许您将规格设置为公开可访问或仅与特定项目共享\n\n### CLI\n\n从虚拟设备内部，验证您是 root\
  \ 用户并导入 openrc 文件：\n\n```\n$ source openrc\n```\n\n提示 输入 openstack help flavor create\
  \ 将提供有关所有可用位置参数和可选参数的详细信息。\n\n使用 python-openstackclient，创建一个 ID 为 200、RAM 为 512\
  \ MB、主磁盘为 1 GB、VCPU 为 1 的新规格。规格默认情况下为公开。将规格命名为 awesome-flavor-cli。\n\n```\n$ openstack\
  \ flavor create --id 200 --vcpus 1 --ram 512 --disk 1 \"awesome-flavor-cli\"\n```\n\
  \n您应该会看到与图 5.9 相似的输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_155_0.png)\n\n\
  图 5.9：'openstack flavor create' 命令的输出\n\n## 考试目标 - 启动实例\n\n您终于到达了有趣的部分：启动 Nova 实例。启动实例可以在\
  \ Horizon 仪表盘和 python-openstackclient 上完成。让我们深入创建我们的第一个实例。\n\n### Horizon 仪表盘\n\n\
  通过 Horizon 仪表盘创建实例非常容易。请参阅图 5.10。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_156_0.png)\n\
  \n图 5.10：从 Horizon 仪表盘启动实例\n\n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己作用域到 **human-resources**\
  \ 项目。当我们创建实例时，它将由 **human-resources** 项目拥有。\n- 2. 从 **Project-Compute** 面板组中选择 **Instances**\
  \ 面板。您应该会看到两个处于 **Shutoff** 状态的实例。这两个实例由 **human-resources** 项目拥有。我们稍后会回到它们。\n-\
  \ 3. 选择 **启动实例**。\n- 4. 详细信息：\n  - **Instance Name（必填）**：实例的名称。您可以拥有多个具有相同名称的虚拟机，这要归功于自动分配给您创建的任何资源的\
  \ UUID。在此部分，插入 `instance3-dashboard`。\n  - **可用性区域**：Nova 可用性区域用于划分您的 Nova 部署。这允许您将计算主机放入逻辑组中以提供物理隔离或硬件差异化。Nova\
  \ 是开箱即用的默认可用性区域，包含环境中的所有计算节点。\n\n\n\n-   **计数（必需）**：您希望启动的实例数量。指定多个实例会在虚拟机名称末尾添加\
  \ -#。例如，如果您启动三个名为 `myinstance` 的实例，它们将被命名为 `myinstance-1`、`myinstance-2` 和 `myinstance-3`。为实例计数插入\
  \ 1。\n\n5.  **源（必需）**：\n-   **启动源**：有三种主要的启动源：\n  -   **从镜像启动**：这是最常见的启动类型，允许用户选择特定的\
  \ Glance 镜像进行启动。选择 `cirros` 镜像。\n  -   **从快照启动**：用户可以对正在运行的虚拟机进行快照以捕获磁盘内容。用户能够从\
  \ Glance 中现有的快照启动。\n  -   **从卷启动**：当用户从云镜像或快照启动实例时，主要和/或次要驱动器始终位于计算节点的本地存储上。从 Cinder\
  \ 卷启动允许我们将实例的主要或次要磁盘设置在计算节点之外的 Cinder 存储节点上。其优点是在出现超visor 故障或计划维护等紧急情况时数据持久性。这将在第\
  \ 7 章 Cinder 块存储服务中更详细地讨论。\n\n6.  **规格（必需）**：从任何可用规格中选择。选择 `m1.tiny`。\n\n7.  **网络（必需）**：此部分允许您选择要启动实例的网络。如果您希望实例连接到多个网络，可以选择多个网络；网络的顺序决定了网络接口。选择预先创建的\
  \ `tenant-network1-dashboard` 网络。\n\n8.  **网络端口（可选）**：此部分允许您选择要连接实例的端口。如果您希望实例连接到多个端口，可以选择多个端口。不幸的是，从此面板区域无法创建新端口。不应有任何可用的网络端口。\n\
  \n9.  **安全组（可选）**：我们将在 *第 6 章，Neutron 网络服务* 中更详细地讨论安全组，但现在重要的是您要理解安全组控制端口的进出网络流量。即使您不勾选此框，每个创建的实例都会自动获得默认安全组。如果您创建了额外的安全组，它们将显示在此处。一个实例可以关联多个安全组。验证\
  \ **默认** 安全组是否已选中。\n\n10. **密钥对（可选）**：这将确保您请求的镜像中驻留的 `cloud-init` 程序获取此公钥并将其放入指定启动源镜像上默认用户的\
  \ `authorized_keys` 文件中。选择 `my-new-keypair-dashboard`。\n\n11. **配置（可选）**：\n-   **自定义脚本**：此部分允许您通过放置在实例启动后运行的脚本来自定义实例。这通常被称为用户数据，是一个庞大的主题。考试不需要您完成用户数据目标，但您可以在\
  \ `https://docs.openstack.org/pike/` 了解更多信息。\n-   **磁盘分区**：如果您使用 QEMU 或 QEMU-KVM\
  \ 作为超visor 类型，此选项将被完全忽略。自动磁盘分区会根据所需规格自动创建一个分区。换句话说，如果您选择一个具有 20 GB 主磁盘的规格，您将有一个可用的\
  \ 20 GB 单个根分区（`/dev/vda1`）。如果您运行 QEMU 或 QEMU-KVM 并有兴趣修改此行为，请搜索 `growpart` cloud-init\
  \ 模块。验证 **自动** 是否已选中。\n\n-   **配置驱动**：勾选此框会在实例启动时自动附加特殊的 OpenStack 元数据 ConfigDrive。如果您已正确设置\
  \ neutron 元数据服务，则选择此项不应是必要的。验证此选项是否 **未选中**。\n\n12. **Server Groups**（可选）：服务器组由\
  \ OpenStack 管理员创建，并基于 ServerGroup Nova 过滤器是否已启用。管理员必须设置服务器组以启用亲和/反亲和调度（请参阅下一项 **调度提示**）。\n\
  13. **Scheduler Hints**（可选）：调度提示允许用户影响虚拟机放置的位置。例如，用户可以使用提示确保多个虚拟机全部放置在同一计算节点或不同的节点上（亲和/反亲和）。在某些情况下，您可能希望两个实例位于不同的计算节点上以保持服务高度可用。服务器组和调度提示超出了考试范围。\n\
  14. **Metadata**（可选）：元数据允许用户将预定义的 Glance 元数据定义键/值对应用于虚拟机。\n15. 选择 **启动实例**。\n\n\
  ![](img/da864e0670c65edf6f5ab861ef9906b3_159_0.png)\n\n在 Horizon 仪表板上，除非有可访问的网络可用，否则您将无法启动实例。尽管您可以通过\
  \ CLI、SDK 或直接通过 API 在没有网络或端口的情况下启动实例，但实例将没有网络连接，也无法与其他实例或网络资源通信。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_159_1.png)\n\
  \n当前 Newton 版本 COA 考试的目标不需要您设置可用区。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_160_0.png)\n\
  \n图 5.11：启动实例时有多种选项可用\n\n请耐心等待！根据系统上可用的资源，这可能需要一点时间。如果一切顺利，您应该会看到您的新 instance3-dashboard。此时，human-resources\
  \ 项目拥有三个实例：instance1-dashboard（状态：Shutoff）、instance2-dashboard（状态：Shutoff）和 instance3-dashboard（状态：Active）。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_160_1.png)\n\n如果在尝试启动实例时出现错误，请验证您在其他项目中没有正在运行的实例。本书包含的虚拟设备需要至少分配\
  \ 6GB RAM，但一次无法支持运行许多实例。如果您继续遇到启动实例的问题，请通过在终端运行 sudo reboot 重启虚拟设备，或在 VirtualBox\
  \ 中手动关闭设备。如果您的笔记本电脑或台式机上有可用内存，请随意在 VirtualBox 中增加分配的 RAM。\n\n## 命令行界面\n\n源化新创建的\
  \ openrc-human-resources 文件。如果您尚未执行此操作，请参考前一个目标的 python-openstackclient 部分。\n\n\
  ```\n$ source openrc-human-resources\n```\n\n验证是否已设置正确的变量：\n\n```\n$ export | grep\
  \ OS\n```\n\n现在我们已正确限定范围，让我们使用 Horizon 仪表板练习中提供的相同参数创建一个新的虚拟机。\n\n```\n$ openstack\
  \ server create --image cirros --flavor m1.tiny --key-name my-new-keypair-cli \\\
  \ninstance3-cli\n```\n\n在实例构建时，您应该会看到与图 5.12 类似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_161_0.png)\n\
  \n图 5.12：'openstack server create' 命令的输出\n\n确认实例的状态变为 active。human-resources 项目现在应拥有四个实例。instance1-dashboard\
  \ 和 instance2-dashboard 之前已在虚拟设备上创建。请确保暂时将它们保持在 SHUTOFF 状态。\n\n```\n$ openstack\
  \ server list\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_162_0.png)\n\n图 5.13：'openstack\
  \ server list' 命令的输出\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_162_1.png)\n\n\
  在此示例中，我们不需要指定要启动实例的网络，因为 human-resources 项目只有一个网络可用。如果有多个网络可用，您将无法启动，除非使用 --nic\
  \ 参数指定网络。\n\n如果我们想查看实例的更多详细信息，可以运行以下命令：\n\n```\n$ openstack server show <instance-name-or-id>\n\
  ```\n\n## 考试目标 - 访问您的实例\n\n现在您的虚拟机已启动并运行，让我们进入内部！有多种方法可以做到这一点。让我们讨论三种主要方式：\n\n控制台：由于\
  \ nova-novncproxy 和 nova-consoleauth 守护进程，用户可以轻松地通过 Horizon 仪表板或 HTTP URL 访问虚拟机串行控制台。串行控制台提供对实例的访问，就像您直接与其交互一样。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_162_2.png)\n\n如果禁用了密码身份验证或镜像中未设置密码，您将无法通过控制台登录到实例。您必须传递用户数据来设置密码，或通过提供私钥通过\
  \ SSH 登录到实例。\n\n\n\n\n**Floating IP：** 通过将浮动或外部 IP 地址与实例关联并从系统通过 SSH 连接是一种访问实例的替代方式。请注意，这不仅需要在\
  \ OpenStack 环境中配置提供商网络，还需要允许端口 `22` 上的入站流量。我们将在第 6 章中更详细地讨论这个问题。\n\n**Network Namespace：**\
  \ 如果您有权访问安装了 OpenStack 服务的实际底层服务器，则可以通过网络命名空间访问实例。网络命名空间是 Linux 内核的一项功能，允许隔离网络接口和路由表。每当\
  \ OpenStack 用户创建一个启用 DHCP 的 Neutron 网络时，就会创建一个网络命名空间。这超出了考试范围，但具有 OpenStack 基础设施访问权限的用户可以通过命名空间通过\
  \ SSH 进入实例来获得对 OpenStack 实例的访问权限。一个示例是 `ip netns exec <qdhcp-namespace_id> ssh <instance-fixed-ip-address>`。\n\
  \n## Horizon 仪表板\n\n让我们继续查看我们的远程串行控制台。参见图 5.14。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_163_0.png)\n\
  \nFigure 5.14. 从 Horizon Dashboard 访问实例控制台\n\n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到\
  \ human-resources 项目。\n- 2. 从 **Project-Compute** 面板组中选择 **Instances** 面板。\n- 3.\
  \ 从实例列表中选择 **instance3-dashboard**。\n- 4. 让我们先查看 Log 选项卡。Log 选项卡显示串行控制台的初始启动过程。点击\
  \ View Full Log。在这里我们可以看到实例的启动过程。我们可以看到它获取 IP 地址以及在启动时选择的公钥。如果我们启动实例时遇到问题，这是一个很好的故障排除位置。\n\
  - 5. 选择 Console 选项卡。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_164_0.png)\n\n\
  Figure 5.15: Horizon 仪表板上运行实例的日志和控制台选项卡\n\n- 6. 选择 **Show Only Console**。如果您仍然看不到任何内容，请点击\
  \ **Enter**，这应该会唤醒控制台屏幕。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_165_0.png)\n\
  \nFigure 5.16: 选择“仅显示控制台”链接将允许您与实例控制台交互\n\n我们现在可以登录到我们的实例：\n\n- **Username:** `cirros`\n\
  - **Password:** `cubswin:)`\n\n现在我们已登录，可以运行以下命令来显示实例主机名。\n\n```\n$ hostname\n```\n\
  \n您应该会看到与图 5.17 相似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_166_0.png)\n\n\
  Figure 5.17: 在 instance3-dashboard 实例内运行 hostname 命令\n\n## CLI\n\n源化新创建的 openrc-human-resources\
  \ 文件：\n\n```\n$ source openrc-human-resources\n```\n\n验证是否设置了正确的变量：\n\n```\n$ export\
  \ | grep OS\n```\n\n查看所有正在运行的实例：\n\n```\n$ openstack server list\n```\n\n获取 instance3-cli\
  \ 的控制台日志。您应该会看到实例启动日志。\n\n```\n$ openstack console log show instance3-cli\n```\n\
  \n获取 instance3-cli 的控制台 URL：\n\n```\n$ openstack console url show instance3-cli\n\
  ```\n\n您应该会看到与图 5.18 相似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_167_0.png)\n\
  \nFigure 5.18: 'openstack console url show' 命令的输出\n\n将 URL 复制并粘贴到您的 Web 浏览器中。\n\n\
  - **Username:** cirros\n- **Password:** cubswin:)\n\n现在我们已登录，可以运行以下命令来显示实例主机名。\n\
  \n```\n$ hostname\n```\n\n## 考试目标 - 创建实例快照\n\nNova 允许用户创建实例快照。快照与镜像一样，是整个磁盘或磁盘内容的快照。考虑一个用户从镜像启动实例，然后对该运行中的实例进行更改和自定义。用户可以随后创建实例的快照并从此快照启动实例。所有更改和自定义都将保留。当创建快照时，它会作为可启动镜像放置在\
  \ Glance 中，并由用户所限定的项目拥有。\n\nNova 快照仅包含主磁盘的快照。它们不会快照实例可能关联的任何其他磁盘。这包括包含二级或“临时”存储的\
  \ flavor 以及附加的 Cinder 卷。\n\n## Horizon 仪表板\n\n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到\
  \ **human-resources** 项目。\n- 2. 从 Project-Compute 面板组中选择 **Instances** 面板。\n- 3.\
  \ 选择 **instance3-dashboard** 旁边的下拉菜单并选择 **Create Snapshot**。\n- 4. 将快照命名为 **instance3-dashboard-snapshot**。参见图\
  \ 5.19。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_168_0.png)\n\nFigure 5.19: 在\
  \ Horizon 仪表板上创建实例快照\n\n您的快照将被创建，现在应该在 **human-resources** 项目拥有的 Glance 镜像列表中可见。参见图\
  \ 5.20。您可能需要在浏览器上点击 **Refresh**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_169_0.png)\n\
  \nFigure 5.20: Nova 实例快照存储在 Glance 中\n\n您现在可以通过点击 **Launch** 实例或在创建实例时将其选为启动源来轻松启动此快照。\n\
  \n## CLI\n\n源化 `openrc-human-resources` 文件：\n\n```\n$ source openrc-human-resources\n\
  ```\n\n验证是否设置了正确的变量：\n\n```\n$ export | grep OS\n```\n\n首先，列出所有实例：\n\n```\n$ openstack\
  \ server list\n```\n\n从 instance3-cli 创建名为 instance3-cli-snapshot 的快照。\n\n```\n\
  $ openstack server image create --name instance3-cli-snapshot instance3-cli\n```\n\
  \n您应该会看到与图 5.21 相似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_170_0.png)\n\n\
  Figure 5.21: 'openstack server image create' 命令的输出\n\n验证快照现在是否出现在 Glance 中：\n\n\
  ```\n$ openstack image list\n```\n\n我们可以通过检查镜像的详细信息来验证它是否由 human-resources 项目拥有：\n\
  \n```\n$ openstack image show instance3-cli-snapshot\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_170_1.png)\n\
  \n您可以使用 `openstack project list` 来查找所有项目的 UUID。\n\n## 考试目标 - 管理实例操作\n\n我们可以对现有实例执行多种操作。您可以通过点击\
  \ Project 面板实例部分中实例旁边的下拉菜单来查看这些操作。参见图 5.22。\n\n您应该有两个处于 Shutoff 状态的实例：instance1\
  \ 和 instance2。\n\n现在这两个都已运行，让我们探索下拉菜单中的一些可用选项。参见图 5.22。\n\n- **Associate Floating\
  \ IP**: 允许我们将浮动 IP（外部 IP）映射到我们的实例，如果有可用。第 6 章 Neutron Networking Service 中有更多内容。\n\
  - **Attach Interface**: 将另一个（或相同的）网络附加到实例。这相当于向实例插入一个额外的虚拟 NIC（或端口）。\n- **Detach\
  \ Interface**: 移除虚拟 NIC 或端口。\n- **Edit Instance**: 重命名实例或添加/移除安全组。如果您完全从实例的端口中移除所有安全组，所有入站和出站流量将被阻止。\n\
  - **Console**: 另一种获取控制台访问的方式。\n- **View Log**: 另一种查看控制台日志的方式。\n- **Pause Instance**:\
  \ 将 VM 的状态存储在内存中。\n- **Suspend**: 将 VM 的状态存储在计算节点硬盘上。\n- **Shelve**: 实例将被停止并快照。然后它将从计算节点中移除，但仍会以\
  \ Shelved 状态出现在您的实例列表中。所有相关数据和资源都保留，尽管状态信息会丢失。然后可以将其 unshelve 并使用。\n- **Resize**:\
  \ 指定另一个 flavor 以调整实例大小。\n- **Lock**: 在锁定状态下，非管理员用户无法修改或终止实例。\n- **Unlock**: 解锁实例，允许项目内的用户修改或终止。\n\
  - **Soft Reboot**: 使用 ACPI 事件触发实例的优雅重启。\n- **Hard Reboot**: 关闭实例电源然后重新打开。也称为冷重启。\n\
  - **Shut Off Instance**: 使用 ACPI 事件触发实例的优雅关机。\n- **Rebuild Instance**: 从全新镜像重新创建实例，同时保持相同的固定和浮动\
  \ IP 地址，以及其他元数据。\n\n\n\n\n- **终止实例**：完全删除实例。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_172_0.png)\n\
  \n图 5.22：可在 Horizon 仪表盘上对虚拟机实例应用的各种操作\n\n## Horizon 仪表盘\n\n1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到\
  \ **human-resources** 项目。\n2. 从 **Project-Compute** 面板组中选择 **Instances** 面板。\n3.\
  \ 在 **Instances** 部分，选择 **instance1-dashboard** 旁边的下拉菜单并选择 **Start**。实例将启动。\n\n\
  ## 命令行界面\n\n加载 openrc-human-resources 文件：\n\n```\n$ source openrc-human-resources\n\
  ```\n\n验证变量是否已设置为限定到 human-resources 项目：\n\n```\n$ export | grep OS\n```\n\n列出所有实例：\n\
  \n```\n$ openstack server list\n```\n\n让我们启动 instance2-dashboard。\n\n```\n$ openstack\
  \ server start instance2-dashboard\n```\n\n查看 instance2-dashboard 的状态。\n\n```\n\
  $ openstack server show instance2-dashboard\n```\n\n状态现在应为 ACTIVE。参见图 5.23。\n\n\
  ![](img/da864e0670c65edf6f5ab861ef9906b3_173_0.png)\n\n图 5.23：运行中的实例将显示状态为 ACTIVE\n\
  \n我们现在应该在虚拟设备中有总共四个正在运行的实例。\n\n在进入下一章之前，让我们清理环境并停止 human-resources 项目中的所有正在运行的实例。\n\
  \n```\n$ openstack server delete instance1-dashboard instance2-dashboard\ninstance3-dashboard\
  \ instance3-cli\n```\n\n验证实例是否已不再在 human-resources 项目中运行：\n\n```\n$ openstack server\
  \ list\n```\n\n## 摘要\n\n您刚刚学习了考试中所有与 Nova 相关的目标。Nova 还有更多功能，但了解如何管理 flavors、密钥对、实例和虚拟实例操作，应能让您在进入考试时处于有利位置。请记住，所有与\
  \ Nova 相关的考试目标都可以通过 Horizon 仪表盘完成。如果您想使用 python-openstackclient，请确保熟悉任何位置参数或可选参数。如果您忘记了它们，请依赖\
  \ openstack help 命令。请记住，密钥对是 OpenStack 资源之一，由用户而不是项目拥有。当您删除用户时，其公钥也会被删除。Nova 仅存储公钥的副本。如果您丢失了私钥，必须生成新的密钥对。默认情况下，flavors\
  \ 可供所有域中的所有项目中的所有用户访问。要使 flavor 成为公开，必须具有管理员角色。\n\n在下一章中，我们将讨论 Neutron，即 OpenStack\
  \ 网络服务，并完成考试中所有与 Neutron 相关的目标。\n"
- "# 6 Neutron 网络服务\n\n## Neutron 网络服务\n\n在上一章中，我们讨论了 Nova 计算服务和 Certified OpenStack\
  \ Administrator 考试的 Nova 相关目标。现在我们将讨论 Neutron。Neutron 是一个网络服务，管理 OpenStack 环境的虚拟网络、子网、IP地址、路由器、防火墙规则等。由于\
  \ Neutron 约占 COA 目标的 17%，从管理员角度充分理解其工作原理对于通过考试至关重要。Neutron，尤其是 SDN（软件定义网络），是一个复杂的话题，涵盖许多领域。然而，需要记住的是，考试不需要您修改\
  \ Neutron 配置文件或在 OpenStack 环境之外配置网络。\n\n在本章中，我们将涵盖以下主题：\n\n- Neutron 架构\n- Neutron\
  \ 概念\n- 考试目标 - 管理租户网络\n- 考试目标 - 管理租户子网\n- 考试目标 - 管理安全组和规则\n- 考试目标 - 管理路由器（东西向流量）\n\
  - 考试目标 - 管理提供商网络\n- 考试目标 - 管理提供商子网\n- 考试目标 - 管理路由器（南北向流量）\n- 考试目标 - 管理浮动 IP\n\n\
  在本章之后，您应该对 Neutron 有扎实的理解，并具备成功完成考试中所有与 Neutron 相关目标所需的技能。\n\n## 关于 Neutron\n\n\
  在第 5 章中，我们讨论了在 OpenStack 环境中启动实例的最低要求：\n\n- 一个启动源\n- 一个 flavor\n- 一个可用的 Neutron\
  \ 网络\n\nNeutron 允许用户创建必要的虚拟资源，不仅确保其实例获得内部 IP 地址（也称为 **固定 IP**），而且能够将外部 IP 地址（也称为\
  \ **浮动 IP**）映射到实例。这使得驻留在 OpenStack 实例中的应用程序可以从外部访问。通过 Neutron，用户可以通过 Horizon 仪表盘、命令行界面、OpenStack\
  \ SDK 或直接通过 API 查看自己的网络、子网、防火墙规则、路由器和负载均衡器。Neutron 还包含一个由各种插件、代理和驱动程序驱动的模块化框架，包括\
  \ LinuxBridge 和 Open vSwitch。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_177_0.png)\n\
  \n本章对 Neutron 提供了简要说明。如需深入了解，请查阅 James Denton 所著的 *OpenStack Networking Essentials*，Packt，2016\
  \ 年。\n\n## Neutron 架构\n\nNeutron 由五个守护进程组成，如图 6.1 所示。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_178_0.png)\n\
  \n图 6.1：Neutron 架构的高级视图\n\n- **neutron-server**：Neutron 的 API 和主要网关。必须与 neutron-server\
  \ 交互以创建、列出、删除和管理网络及其他网络资源。\n- **neutron-dhcp-agent**：为启用 DHCP 的 Neutron 子网提供 DHCP\
  \ 服务。在幕后，`neutron-dhcp-agent` 实际上在网络命名空间中使用 `dnsmasq`，这是一种流行的轻量级 DHCP 服务器软件。网络命名空间是\
  \ Linux 内核的一项功能，可划分网络使用，允许在 IP 地址范围相似的情况下隔离网络资源。\n- **neutron-l3-agent**：创建 Neutron\
  \ 路由器。在幕后，Neutron 路由器是具有唯一路由表和 `iptables` 规则的网络命名空间。\n- **neutron-metadata-agent**：为实例提供元数据服务。元数据服务由\
  \ Amazon Web Services 推广，是一种不可路由的 IP 地址（`169.254.169.254`），用户或脚本可以联系该地址以获取有关该实例的个人信息。\n\
  - **neutron-linuxbridge-agent**：在环境中的每个计算节点上运行。负责计算节点上所有网络相关功能的创建和管理——包括为新创建的实例创建虚拟网络接口，以及创建和连接\
  \ Linux 桥和 `iptables` 规则。\n\n## LinuxBridge 插件\n\n在本书提供的虚拟设备中，Neutron 配置为使用 LinuxBridge\
  \ 插件。LinuxBridge 插件利用现有的 Linux 内核功能以及 Linux 程序来提供虚拟网络组件。考试不需要您理解这些关系，但了解幕后运作的原理很有趣。\n\
  \n| Neutron 功能 | 现有的 Linux 内核功能和/或程序 |\n|---|---|\n| neutron-dhcp-agent | 网络命名空间,\
  \ dnsmasq |\n| neutron-l3-agent | 网络命名空间, iptables（netfilter 内核模块）, conntrack（conntrack\
  \ 内核模块） |\n| neutron-plugin-agent | iptables（netfilter 内核模块）, iproute2（gre、vlan\
  \ 和 vxlan 内核模块）, bridge-utils（bridge 内核模块） |\n\n## Neutron 概念\n\n让我们谈谈 Neutron 概念。参见图\
  \ 6.2。\n\n- **网络**：网络类似于物理网络的逻辑切片。Neutron 中主要有两种网络：**租户网络** 和 **提供商网络**：\n  - **租户网络**：由希望在其专属虚拟二层广播域上启动实例的\
  \ OpenStack 用户创建。租户网络始终归用户在网络创建请求期间所限定到的项目所有。\n  - **提供商网络**：通常由具有管理员级别角色的人员管理。提供商网络用于为\
  \ OpenStack 环境之外的资源提供网络访问。此资源可能是互联网，甚至是您数据中心中存在于特定 VLAN 或 VXLAN 上的裸机数据库服务器。\n- **子网**：子网是与特定网络关联的\
  \ IPv4 或 IPv6 地址块。子网允许将 IP 地址分配给虚拟机实例或其他网络资源。必须将子网与网络关联才能在其上启动实例。在创建子网时，始终提供网络 CIDR。与租户网络关联的子网通常启用\
  \ DHCP。\n\n\n\n\n\n- **端口**：端口类似于虚拟网络接口卡。它代表数据流量的入口和出口点。端口始终关联一个 MAC 地址和 UUID。当在网络上启动实例时，端口会自动创建，或者如果用户希望使用特定\
  \ IP 地址，也可以预留端口。\n- **安全组和规则**：安全组控制进出端口的流量。默认情况下，实例的所有出站流量都被允许，而入站流量不被允许——除非是包含默认安全组的另一个实例。\n\
  - **路由器**：路由器是由 `neutron-l3-agent` 守护进程生成的设备，可将不同的广播域连接在一起。Neutron 路由器通常用于将不同租户网络之间的流量连接在一起（东西向流量），以及将租户网络连接到提供商网络，以便访问环境外部的资源，例如互联网（南北向流量）。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_180_0.png)\n\n图 6.2：Neutron 概念图\n\n##\
  \ 考试目标\n\n让我们来看看 Neutron 考试目标。\n\n下图分解了你在 COA 考试中应了解的各种 Neutron 相关目标。如图 6.3 所示，所有这些任务都可以在\
  \ Horizon 控制台和 CLI 上完成。请记住：考试期间时间至关重要，在许多情况下，在控制台上处理任务会快得多。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_181_0.png)\n\
  \n图 6.3：Neutron 考试目标可以在 Horizon 控制台或 CLI 上完成\n\n## 考试目标 - 管理租户网络\n\n租户网络是 OpenStack\
  \ 用户生活中必不可少的一部分。默认情况下，非管理员用户可以创建多个租户网络（最高达最大项目配额）并为其附加多个子网。相同的项目/所有者理念适用于网络和子网：任何新创建的网络和子网都将归用户在创建时所限定到的项目所有。只有项目内的用户才能管理新创建的网络和子网。尽管用户可以通过\
  \ RBAC 规则与特定项目共享网络，但这超出了 COA 复习的范围，也不是必需的目标。\n\n## Horizon 控制台\n\n让我们从 Horizon 控制台创建一个租户网络。见图\
  \ 6.4。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_182_0.png)\n\n图 6.4：在 Horizon\
  \ 控制台上创建租户网络\n\n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到 logistics 项目。\n- 2. 从 Project-Network\
  \ 面板组中选择 Networks 面板。\n- 3. 选择创建网络。\n- 4. 见图 6.5。网络名称（可选）：租户网络的名称。输入 `tenant-network1-dashboard`。\n\
  - 5. 管理状态（必填）：管理状态控制网络是关闭还是开启。如果将其设置为 DOWN 状态，与网络关联的任何子网在重新设置为 UP 之前将无法使用。请验证其设置为\
  \ UP。\n- 6. 共享（必填）：这类似于公共选项。如果租户网络是共享的，所有项目（即使跨其他域）都能够创建子网——从而在此网络上启动实例。然而，他们将无法修改网络属性或删除它。我们将保持此项未选中，仅对\
  \ logistics 项目内的用户可访问。\n- 7. 为了本次练习，让我们取消选中创建子网，以便仅创建网络。我们将在下一节中创建子网。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_183_0.png)\n\
  \n图 6.5：Horizon 控制台上的“创建网络”属性\n\n- 8. 选择创建。\n\n我们现在应该有一个由 logistics 项目拥有的租户网络。见图\
  \ 6.6。需要注意的是，因为我们尚未为新网络关联子网，所以目前还无法在此网络上启动实例。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_183_1.png)\n\
  \n图 6.6：Horizon 控制台上由 logistics 项目拥有的租户网络\n\n请记住，Admin-System 面板组提供了 OpenStack 环境中所有资源的视图。这包括所有域中的所有项目。如果我们查看\
  \ Admin-System 面板组的网络部分，我们应该能够看到上一章中 human-resources 项目的 tenant-network1-dashboard\
  \ 网络。见图 6.7。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_184_0.png)\n\n图 6.7：Admin-System\
  \ 面板组的网络部分将显示环境中所有项目的所有网络\n\n## CLI\n\n请回忆，提供给你的 openrc 文件包含用于正确向 Keystone 进行身份验证并设置项目范围的变量形式凭据。\n\
  \n在本章中，我们将在 logistics 项目中完成所有 Neutron 相关任务。让我们将原始的 openrc 文件复制到名为 openrc-logistics\
  \ 的新文件中。\n\n```\n$ cp openrc openrc-logistics\n```\n\n现在我们已经复制了文件，让我们编辑 openrc-logistics\
  \ 文件，将项目和租户名称变量更新为反映我们希望限定到 logistics 项目的范围。如果你更习惯使用其他编辑器，这里也可以使用它。\n\n```\n$ nano\
  \ openrc-logistics\n```\n\n将以下变量更改为 logistics：\n\n```\nexport OS_PROJECT_NAME=logistics\n\
  export OS_TENANT_NAME=logistics\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_185_0.png)\n\
  \n我们更改 OS_TENANT_NAME 变量，因为我们在后续章节中使用的一些旧服务型客户端依赖于此变量。\n\n载入新创建的 openrc-logistics\
  \ 文件：\n\n```\n$ source openrc-logistics\n```\n\n验证正确的变量是否已设置，并且我们正在 logistics 项目中工作：\n\
  \n```\n$ export | grep OS\n```\n\n现在我们已正确限定范围，从现在开始创建的任何新网络都将归 logistics 项目所有。需要牢记的一件非常重要事情是，我们在考试中以管理员用户身份执行所有目标。由于我们在\
  \ logistics 项目上拥有管理员角色，我们可以看到默认域中所有项目的所有网络。这类似于从 Admin-System 面板组查看网络，如图 6.7 所示。例如，运行以下命令：\n\
  \n```\n$ openstack network list\n```\n\n请注意，此命令显示的是 OpenStack 环境中的所有网络，而不仅仅是 logistics\
  \ 项目中的网络。\n\n作为管理员用户保持组织有序的一种方法是向命令添加 --long 参数。这将提供项目列，让我们知道特定网络位于哪个项目中。\n\n```\n\
  $ openstack network list --long\n```\n\n你应该会看到类似于图 6.8 的输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_185_1.png)\n\
  \n图 6.8：所有网络（跨所有项目/域）的列表。此视图类似于图 6.7 中的控制台视图\n\n注意项目列？它会告诉我们哪个项目拥有特定网络。要获取与项目关联的\
  \ UUID 列表，请运行 openstack project list。\n\n让我们使用 python-openstackclient 在 logistics\
  \ 项目中创建一个新的租户网络。语法很简单！\n\n使用 openstack help network create 查看其他可用参数。\n\n```\n$ openstack\
  \ network create tenant-network1-cli\n```\n\n验证网络是否已成功创建并且归 logistics 项目关联的 UUID\
  \ 所有。见图 6.9。\n\n```\n$ openstack network list --long\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_186_0.png)\n\
  \n图 6.9：'openstack network list --long' 命令的输出\n\n我们现在应该有两个由 logistics 项目拥有的租户网络：tenant-network1-dashboard\
  \ 和 tenant-network1-cli。\n\n请注意，我们只需要提供网络的名称。与网络关联的其他属性（VXLAN 网络类型、段 ID 等）是默认值，已在\
  \ /etc/neutron/* 的 Neutron 配置文件中预先配置。\n\n## 考试目标 - 管理租户子网\n\n在 Neutron 中，子网是从中可为虚拟机实例和其他网络资源分配\
  \ IP 地址的 IPv4 或 IPv6 地址块。每个 Neutron 子网必须与租户网络关联。\n\n\n\n\n创建子网时，用户可以指定多种参数：限制子网中哪些地址可用的分配池、自定义网关地址、DNS\
  \ 服务器列表以及单个主机路由。我们将在下一节中更详细地讨论这一点。\n\n多个子网可以关联到一个 Neutron 网络，但它们都必须具有唯一的 CIDR 范围。要创建具有完全相同\
  \ IP 地址范围的多个子网，请创建另一个网络。这被称为 **overlapping IPs**。\n\n## Horizon 控制面板\n\n让我们从 Horizon\
  \ 控制面板创建租户子网。参见图 6.10。\n\n1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到 **logistics** 项目。\n\
  2. 从 **Project-Network** 面板组中选择 **Networks** 面板。你应该会看到两个需要我们管理的租户网络：\n    - **tenant-network1-dashboard**\n\
  \    - **tenant-network1-cli**\n3. 选择 **tenant-network1-dashboard** 旁边的下拉菜单并选择 **Add\
  \ Subnet**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_187_0.png)\n\n图 6.10：在 Horizon\
  \ 控制面板中创建新的子网\n\n4. 参见图 6.11。子网名称（可选）：`tenant-subnet1-dashboard`\n\n5. 网络地址（必填）：`192.168.1.0/24`。这必须采用无类别域间路由（CIDR）表示法。CIDR\
  \ 表示法是 IP 地址及其相关路由前缀的紧凑表示。\n\n由于这是 Neutron 网络中较令人困惑的方面之一，让我们花点时间了解它与现实世界网络有何不同。\n\
  \n- 在现实世界网络中，`192.168.1.0/24` 的分解如下：\n    - `192.168.1.0`：网络\n    - `192.168.1.1`\
  \ 至 `192.168.1.254`：网络上的主机\n    - `192.168.1.255`：广播\n- 在 Neutron 子网中，CIDR（如果所有默认子网选项均适用）将分解如下：\n\
  \    - `192.168.1.0`：表示网络\n    - `192.168.1.1`：保留给路由器（网关），即使当前不存在路由器\n    - `192.168.1.2`：DHCP\
  \ 服务器\n    - `192.168.1.3` 至 `192.168.1.254`：实例或其他资源\n    - `192.168.1.255`：广播\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_188_0.png)\n\n6. IP 版本（必填）：我们将其设置为 IPv4。\n\
  \n7. 网关 IP（可选）：留空，以便自动默认为 `192.168.1.1` 作为网关地址。\n\n8. 禁用网关：应保持未选中。选中此选项将阻止连接到子网的任何实例从\
  \ DHCP 服务器接收默认路由公告。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_189_0.png)\n\n图\
  \ 6.11：在 Horizon 控制面板上提供子网详细信息\n\n9. 选择下一步。\n\n10. 参见图 6.12。启用 DHCP：应选中以确保子网启用 DHCP。\n\
  \n11. 分配池（可选）：允许你指定 IP 地址的起始和结束。例如，输入分配池 192.168.1.100,192.168.1.105 将导致你的 DHCP\
  \ 服务器获得 192.168.1.100，而连接到子网的第一台实例将为 192.168.1.101。如果我们留空，它将尝试使用 CIDR 范围的大部分，在我们的例子中为：192.168.1.2,192.168.1.254。我们将保持空白。\n\
  \n12. **DNS 名称服务器**（可选）：这是要通告给实例的 DNS 名称服务器的 IP 地址列表。不提供值将把 DHCP 服务器 IP 作为 DNS 服务器通告给连接到子网的所有实例。这可以自动提供\
  \ OpenStack 内实例主机名到其各自 IP 地址的解析。为了解析 OpenStack 外的名称，我已将内部 DNS 选项设置为使用 Google DNS\
  \ 8.8.8.8。`/etc/neutron/dhcp_agent.ini` 中还有额外的 DNS 选项。我们将保持框 **空白**。\n13. **主机路由**（可选）：通告给主机的任何额外路由。我们将保持此项\
  \ **空白**。\n14. 选择 **创建**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_190_0.png)\n\
  \n图 6.12：在 Horizon 控制面板上为子网提供 DHCP 选项\n\n太好了！我们刚刚在 Horizon 控制面板上创建了一个全新的子网。请记住，你始终可以通过选择编辑子网从\
  \ Horizon 控制面板更新此子网。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_191_0.png)\n\n\
  图 6.13：在 Horizon 控制面板上编辑/更新子网\n\n让我们继续将此子网的默认分配池从默认的 192.168.1.2,192.168.1.254 更改为\
  \ 192.168.1.50-192.168.1.60。选择保存。参见图 6.14。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_191_1.png)\n\
  \n图 6.14：在 Horizon 控制面板上更改子网的分配池\n\n尽管 DHCP 服务器已被分配到 ...，在此子网上启动的第一台实例将接收 IP 地址\
  \ ...\n\n## 命令行界面\n\n现在让我们学习如何创建子网...\n\n源化 ... 文件。如果尚未执行此操作，请参考本章开头。\n\n```\n$\
  \ source openrc-logistics\n```\n\n验证是否已设置正确的变量：\n\n```\n$ export | grep OS\n```\n\
  \n让我们创建一个新的子网并将其附加到上一节中创建的租户网络 tenant-network1-cli：\n\n```\n$ openstack subnet create\
  \ --network tenant-network1-cli --subnet-range 192.168.1.0/24 tenant-subnet1-cli\n\
  ```\n\n现在让我们确认新的 tenant-subnet1-cli 是否出现在我们的列表中。与 openstack network list 命令类似，我们将添加\
  \ --long 标志以验证 logistics 项目是否拥有该子网。\n\n```\n$ openstack subnet list --long\n```\n\
  \n你应该会看到与图 6.15 相似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_192_0.png)\n\n\
  ## 考试目标 - 管理安全组和规则\n\n现在我们已经创建了租户网络和子网，让我们谈谈安全组。安全组为控制端口进出流量的虚拟防火墙规则提供配置文件。该配置文件通常与实例的端口相关联。\n\
  \n每个项目都包含一个默认安全组，允许所有出站流量但拒绝所有入站流量。安全组经常用于打开用户可能需要访问以与 OpenStack 外部应用程序通信的端口，以及防止同一子网中不同应用程序之间不必要的东西向流量——从而增加额外的保护层。\n\
  \n安全组规则是有状态的，允许已建立的流量。一个例子是允许入站 TCP 端口 22 用于 SSH。该规则会自动允许已建立的返回流量。另一个例子是允许出站 ICMP\
  \ 用于 ping。这将自动允许返回流量，以便用户可以看到 ping 的回复。\n\n## Horizon 控制面板\n\n1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到\
  \ logistics 项目。\n2. 在 Project-Compute 面板组上选择 Access & Security 面板。你应该会自动设置为 Security\
  \ Groups 选项卡。在这里你应该会看到一个当前的安全组，名为 default。默认情况下，每个项目有一个默认安全组。\n3. 让我们检查默认安全组中的规则。选择管理规则。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_193_0.png)\n\n图 6.16：从 Horizon 控制面板管理安全组\n\
  \n4. 参见图 6.17。我们现在应该会看到属于默认安全组的所有规则的列表。所有 IPv4 和 IPv6 出站流量均被允许。所有 IPv4 和 IPv6 入站流量均被阻止，除来自具有默认安全组的端口的流量外。例如，这可能是同一项目中的另一个实例。让我们选择添加规则。\n\
  \n5. 参见图 6.18。规则（必填）：规则定义允许分配给安全组的实例的流量。我们将选择 ALL ICMP（ping）。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_194_0.png)\n\
  \n图 6.17：从 Horizon 控制面板管理安全组规则\n\n6. 方向（必填）：Ingress（进入实例）或 Egress（从实例发出）。我们将选择 Ingress\
  \ 以允许传入 ICMP（ping）。\n\n7. 远程（必填）：你必须指定允许的流量的来源。这可以是 CIDR 形式中的 IP 地址块或安全组。选择安全组将允许应用该安全组的任何其他实例。\n\
  \n8. CIDR（必填）：要允许来自任何 IP 地址的传入 ping，我们可以选择远程 CIDR 0.0.0.0/0。让我们在这里输入。\n\n\n\n- 9.\
  \ 选择“添加”以添加规则。\n\n你还可以从规则下拉菜单中选择预定义的协议，包括 HTTP（80）、HTTPS（443）和 SSH（22）。使用自定义 TCP\
  \ 规则允许我们自行填写端口号。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_195_0.png)\n\n图 6.18：添加一条允许从任何源\
  \ IP 地址传入 ICMP 的新安全组规则\n\n见图 6.19。新的 ICMP 现在应出现在 **logistics** 项目中的 **default**\
  \ 安全组中。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_196_0.png)\n\n图 6.19：在 logistics\
  \ 项目的 default 安全组中新建的 ICMP 安全组规则\n\n现在我们已向 default 安全组添加了新规则，让我们创建一个全新的安全组并向其添加规则。许多\
  \ OpenStack 用户会为特定的实例角色创建全新的安全组。例如，创建名为 `database-sg` 的新安全组可能是合适的。该安全组可以包含一条规则，仅允许具有\
  \ `webserver-sg` 安全组的任何实例的 TCP 入站流量。\n\n让我们在仪表板上创建一个全新的安全组，名为 `webserver-sg-dashboard`。该安全组将包含一条允许从任何地方传入\
  \ SSH 流量（端口 22）的规则！\n\n- 1. 见图 6.20。从 OpenStack 概览页面，通过选择顶部下拉菜单将范围限定到 **logistics**\
  \ 项目。\n- 2. 在 **Project-Compute** 面板组中选择 **Access & Security** 面板。你应自动切换到 **Security\
  \ Groups** 选项卡。这里你应该看到一个当前的安全组，名为 **default**。默认情况下，每个项目都有一个 **default security\
  \ group**。\n\n- 3. 选择 **Create Security Group**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_197_0.png)\n\
  \n图 6.20：从 Horizon 仪表板创建新的安全组：\n\n- 4. 见图 6.21。**Name**（必填）：安全组的名称。请记住，由于 UUID 的存在，我们可以拥有多个同名安全组。将组命名为\
  \ `webserver-sg-dashboard`。\n\n- 5. **Description**（可选）：安全组的描述。输入 `A security group\
  \ for web server instances`。\n\n- 6. 选择 **Create Security Group**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_197_1.png)\n\
  \n图 6.21：Horizon 仪表板上的新安全组选项\n\n现在你应该有一个新创建的安全组。该组仅包含两条规则，允许 IPv4 和 IPv6 的所有出站流量。\n\
  \n让我们通过选择 Add Rule 创建一条新的安全组规则。该规则将允许从任何地方传入 SSH。它应具有以下内容：\n\n- **Rule:** Custom\
  \ TCP Rule\n- **Direction:** Ingress\n- **Open Port:** Port\n- **Port:** 22\n- **Remote:**\
  \ CIDR\n- **CIDR:** 0.0.0.0/0\n\n见图 6.22。创建后，你应该会看到与 webserver-sg-dashboard 关联的新规则。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_198_0.png)\n\n图 6.22：一条允许从任何源 IP 地址传入\
  \ SSH（TCP/端口 22）的安全组规则\n\n## CLI\n\n让我们继续学习如何通过 python-openstackclient 添加新的组和规则。\n\
  \n导入 openrc-logistics 文件：\n\n```\n$ source openrc-logistics\n```\n\n验证是否已设置正确的变量以允许你限定到\
  \ logistics 项目：\n\n```\n$ export | grep OS\n```\n\n让我们使用 python-openstackclient\
  \ 列出环境中的所有安全组。你会注意到我们可以看到 OpenStack 环境中所有项目中的所有安全组（每个项目内一个默认组）。\n\n```\n$ openstack\
  \ security group list\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_199_0.png)\n\
  \n图 6.23：OpenStack 环境中所有安全组的列表。每个项目有一个默认安全组\n\n如我们所见，logistics 项目目前有两个安全组：default\
  \ 和我们新创建的 webserver-sg-dashboard。\n\n让我们创建一个全新的安全组：\n\n```\n$ openstack security\
  \ group create webserver-sg-cli\n```\n\n现在我们可以轻松添加一条允许从任何地方传入 SSH（端口 22）的新规则。\n\n\
  ```\n$ openstack security group rule create --protocol tcp --ingress --dst-port\
  \ 22 --src-ip 0.0.0.0/0 webserver-sg-cli\n```\n\n你应该会看到与图 6.24 相似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_200_0.png)\n\
  \n图 6.24：'openstack security group rule create' 命令的输出\n\n现在让我们验证我们新创建的 webserver-sg-cli\
  \ 安全组是否包含我们的入站 SSH 规则（除了允许 IPv4 和 IPv6 所有出站流量的两条规则之外）。见图 6.25。\n\n```\n$ openstack\
  \ security group rule list webserver-sg-cli --long\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_200_1.png)\n\
  \n图 6.25：'openstack security group rule list' 命令的输出\n\n## Exam objective - managing\
  \ routers - east/west traffic\n\n在 OpenStack 世界中，路由器是提供子网之间三层连接的虚拟网络设备。路由器本质上为两种类型的场景提供路由：东西向和南北向流量。\n\
  \n在本节中，我们将重点了解和创建东西向流量场景。如果两个虚拟机实例位于两个不同的子网中，除非有路由器在它们之间转发流量，否则它们将无法相互通信。OpenStack\
  \ 用户可以创建多个网络和子网并用路由器连接它们。\n\n让我们通过创建类似于图 6.26 的东西向路由场景来实现此目标：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_201_0.png)\n\
  \n图 6.26：两个 Neutron 租户网络之间的东西向流量\n\n### Horizon dashboard\n\n在 Neutron 准备的这个阶段，我们应该在\
  \ logistics 项目中有一个仪表板租户网络：`tenant-network1-dashboard`。\n\n为了设置图 6.26 中的场景，我们需要执行以下操作：\n\
  \n- 创建另一个名为 `tenant-network2-dashboard` 的仪表板租户网络并添加一个名为 `tenant-subnet2-dashboard`\
  \ 的子网\n- 启动两个虚拟机实例。一个虚拟机实例将附加到 **tenant-network1-dashboard**，另一个将附加到 **tenant-network2-dashboard**。\n\
  - 创建一个路由器\n- 将 `tenant-subnet1-dashboard` 和 `tenant-subnet2-dashboard` 连接到路由器\n\n\
  让我们开始在仪表板上创建新的租户网络和子网。按以下详细信息创建网络和子网：\n\n### Create Network (Figure 6.27)\n\n验证你是否已限定到\
  \ logistics 项目。\n\n**Network Name**: `tenant-network2-dashboard`\n\n**Admin State**:\
  \ UP\n\n**Shared**: unchecked\n\n**Create Subnet**: checked\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_202_0.png)\n\
  \n图 6.27：在 Horizon 仪表板上创建 tenant-network2-dashboard\n\n### Create Subnet (Figure\
  \ 6.28)\n\nSubnet Name: tenant-subnet2-dashboard\n\nNetwork Address: 192.168.2.0/24\n\
  \nIP Version: IPv4\n\nGateway IP: blank (it will automatically use 192.168.2.1)\n\
  \nDisable Gateway: unchecked\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_203_0.png)\n\
  \n图 6.28：在 Horizon 仪表板上创建 tenant-subnet2-dashboard\n\n### Subnet Details (Figure\
  \ 6.29)\n\nEnable DHCP: checked\n\nAllocation Pools: blank\n\nDNS Name Servers:\
  \ blank\n\nHost Routes: blank\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_204_0.png)\n\
  \n图 6.29：Horizon 仪表板上 tenant-subnet2-dashboard 的子网详细信息\n\n现在我们应该在 logistics 项目中有两个租户网络。见图\
  \ 6.30。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_205_0.png)\n\n图 6.30：Horizon\
  \ 仪表板上的两个租户网络（带子网）\n\n现在让我们创建两个虚拟机实例：一个在 **tenant-network1-dashboard** 中，另一个在 **tenant-network2-dashboard**\
  \ 中。再次确保你已限定到 **logistics** 项目！不要忘记 **耐心等待并给实例足够的时间启动！**\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_205_1.png)\n\
  \n如果在尝试启动实例时遇到错误，请验证你是否没有在其他项目中运行实例。本书附带的虚拟设备至少需要分配 6GB RAM，但 **不能** 同时支持运行大量实例。如果继续遇到启动实例的问题，请通过在终端运行\
  \ `sudo reboot` 或在 VirtualBox 中手动关闭设备来重启虚拟设备。如果你的笔记本电脑或台式机上有可用内存，请随时将 VirtualBox\
  \ 中虚拟设备的分配 RAM 增加到大于 6GB 的值。\n\n以下是实例的详细信息：\n\n### Instance1 (See Figure 6.31)\n\
  \nInstance Name: `instance1-dashboard`\n\nAvailability Zone: `nova`\n\nCount: 1\n\
  \n\n\n源: cirros\n\n规格: m1.tiny\n\n网络: tenant-network1-dashboard\n\n安全组: default\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_206_0.png)\n\n图 6.31：在 Horizon 控制台上启动新的虚拟机实例\n\
  \n## Instance2（参见图 6.32）\n\n实例名称: instance2-dashboard\n\n可用区: nova\n\n数量: 1\n\n\
  源: cirros\n\n规格: m1.tiny\n\n网络: tenant-network2-dashboard\n\n安全组: default\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_207_0.png)\n\
  \n图 6.32：验证 instance2-dashboard 是否在 tenant-network2-dashboard 上启动\n\n不要担心如果你的实例在启动时未获得\
  \ .3 IP 地址。我们无法保证仅将实例附加到网络时就能获得第一个可用的 IP 地址。如果您想保留或指定特定的 IP 地址，可以通过 Admin-System\
  \ Networks 面板或通过 python-openstackclient 创建端口来实现。例如，在创建实例之前，您可以通过运行以下命令为 192.168.1.3\
  \ 创建一个端口： `openstack port create --network <network-uuid> --fixed-ip subnet=<subnet-uuid>,ip-address=192.168.1.3\
  \ my-new-port`。创建端口后，在启动实例时指定端口（而不是网络）。有关更多详细信息，请检查 `openstack help port create`。\n\
  \n请参阅图 6.33。我们现在应该在 logistics 项目中拥有两个实例。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_208_0.png)\n\
  \n图 6.33：Horizon 控制台上 logistics 项目中的两个实例\n\n在这一点上，这些网络上的两个子网彼此完全隔离。为了使 instance1-dashboard\
  \ 能够与 instance2-dashboard 通信，我们需要创建一个路由器。\n\n请参阅图 6.34。要创建路由器，请按照以下步骤操作：\n\n- 1.\
  \ 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到 **logistics** 项目。\n- 2. 从 **Project-Network**\
  \ 面板组中选择 **Routers** 面板。\n- 3. 选择 **Create Router**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_209_0.png)\n\
  \n图 6.34：在 logistics 项目中创建路由器\n\n- 4. 请参阅图 6.35。**Router Name**（必填）：路由器的名称。输入 `router-dashboard`。\n\
  - 5. **Admin State**（必填）：控制网络是关闭还是开启。如果将其设置为 DOWN 状态，它将不会路由任何流量。验证其是否设置为 **UP**。\n\
  - 6. **External Network**（可选）：选择路由器的网关。我们将在处理南北向流量时更详细地探讨这一点。现在，将其保持在 **Select Network**。\n\
  \n- 7. 选择 **Create Router**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_210_0.png)\n\
  \n图 6.35：通过控制台添加路由器详细信息\n\n太好了！我们现在有一个由 logistics 项目拥有的路由器。路由器本身不能做太多事情，因此我们需要将其连接到我们的两个网络。\n\
  \n- 1. 请参阅图 6.36。选择 **router-dashboard**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_210_1.png)\n\
  \n图 6.36：在 Horizon 控制台上选择路由器\n\n- 2. 请参阅图 6.37。选择 **Interfaces** 选项卡。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_211_0.png)\n\
  \n图 6.37：在 Horizon 控制台上向路由器添加接口\n\n- 3. 选择 **Add Interface**。\n- 4. 请参阅图 6.38。**Subnet**（必填）：选择要连接到路由器的子网名称。我们将选择\
  \ **tenant-network1-dashboard:192.168.1.0/24**。\n- 5. **IP Address**（可选）：这允许我们为网关指定特定的\
  \ IP 地址。我们将将其留空，因为我们假设它将是默认的 `192.168.1.1`。\n- 6. 选择 **Submit**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_211_1.png)\n\
  \n图 6.38：通过控制台添加接口详细信息\n\n继续创建另一个路由器接口，执行相同的步骤序列，但添加 tenant-network2-dashboard:192.168.2.0/24。\n\
  \n结果应类似于图 6.39。由于我们没有费心手动创建端口，因此此处的 IP 地址可能不同。只需确保记下每个实例的 IP 地址即可。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_212_0.png)\n\
  \n图 6.39：Horizon 控制台上连接到路由器的两个接口\n\n让我们继续检查实例之间的连通性。通过按照第 5 章 Nova Compute Service\
  \ 中概述的说明，通过控制台访问 instance1-dashboard 实例。\n\n如果您忘记了，这里是 Cirros 登录凭据：\n\nusername:\
  \ cirros\n\npassword: cubswin:)\n\n现在我们已登录，让我们尝试 ping（3 次）instance2-dashboard，地址为\
  \ 192.168.2.x。如果您记不起 instance2-dashboard 的 IP 地址，请返回控制台上的实例页面进行检查！\n\n```\n$ ping\
  \ -c 3 192.168.2.x\n```\n\n我们应该会收到回复！并且会看到类似于图 6.40 的内容。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_213_0.png)\n\
  \n图 6.40：驻留在另一个租户网络上并响应 ping 的实例。这证实了东西向流量通信成功\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_213_1.png)\n\
  \n如果您在不使用 -c 计数参数的情况下执行 ping，可以通过按 Ctrl + C 来取消它。\n\n## CLI\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_213_2.png)\n\
  \n如果您计划在 CLI 上尝试此练习，请确保删除您刚刚在控制台上创建的实例！虚拟设备很可能无法处理所有这些正在运行的虚拟机！如果您想继续在控制台上进行练习，请随时跳到下一节：Horizon\
  \ 控制台上的管理提供商网络。\n\n让我们使用 python-openstackclient 设置我们的东西向流量场景。\n\n导入 openrc-logistics\
  \ 文件：\n\n```\n$ source openrc-logistics\n```\n\n验证是否已设置正确的变量：\n\n```\n$ export |\
  \ grep OS\n```\n\n让我们创建新的附加网络和子网：\n\n```\n$ openstack network create tenant-network2-cli\n\
  $ openstack subnet create --network tenant-network2-cli --subnet-range 192.168.2.0/24\
  \ tenant-subnet2-cli\n```\n\n让我们启动我们的实例：\n\n```\n$ openstack server create --image\
  \ cirros --flavor m1.tiny --nic net-id=tenant-network1-cli instance1-cli\n$ openstack\
  \ server create --image cirros --flavor m1.tiny --nic net-id=tenant-network2-cli\
  \ instance2-cli\n```\n\n确认实例是否成功创建：\n\n```\n$ openstack server list\n```\n\n让我们创建路由器：\n\
  \n```\n$ openstack router create router-cli\n```\n\n我们应该会看到以下输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_214_0.png)\n\
  \n图 6.41：'openstack router create' 命令的输出\n\n现在让我们将两个子网连接到路由器。在此之前，让我们列出可用的子网：\n\n\
  ```\n$ openstack router add subnet router-cli tenant-subnet1-cli\n$ openstack router\
  \ add subnet router-cli tenant-subnet2-cli\n```\n\n您不会看到这些命令的任何输出。为了验证我们的工作，我们可以使用\
  \ --router 标志运行 openstack port list 命令：\n\n```\n$ openstack port list --router router-cli\n\
  ```\n\n我们应该会看到以下输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_215_0.png)\n\n图\
  \ 6.42：'openstack port list --router' 命令的输出\n\n我们现在可以确认实例应该能够成功相互 ping。\n\n## 考试目标\
  \ - 管理提供商网络\n\n现在我们了解了如何管理租户网络和子网，以及如何在两个不同的租户网络之间设置东西向流量，让我们创建一些提供商网络。提供商网络对于任何云环境都至关重要，因为它们使\
  \ OpenStack 实例能够访问 OpenStack 环境之外的外部资源。如果 Nova 实例只能与存在于 OpenStack 环境中的资源通信，那将非常无用！如果实例无法访问互联网来下载最新的操作系统软件包，有什么用？如果我们的客户无法从外部访问我们的\
  \ Web 应用程序，实例有什么用？提供商网络是提供对 OpenStack 之外事物网络访问的魔力。\n\n## Horizon 控制台\n\n在控制台上创建提供商网络之前，务必记住，默认情况下，只有具有管理员角色的用户才能创建提供商网络。\n\
  \n\n\nSee Figure 6.43. Provider networks will only show up in the Admin-System panel\
  \ group section of the Horizon dashboard.\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_216_0.png)\n\
  \nFigure 6.43: Creating a provider network from the Horizon dashboard\n\n- 1. From\
  \ the OpenStack overview page, select the **Admin** panel group.\n- 2. Select the\
  \ Networks Panel on the **Admin-System** panel group. Here you should see all current\
  \ tenant networks owned by all projects in the environment. You can identify them\
  \ as tenant networks because you can see that the **External** column is set to\
  \ No.\n- 3. Let’s create a brand new provider network. Select **Create Network**.\n\
  \nSee Figure 6.44. The **Create Network** screen for provider networks is a bit\
  \ different than the one for tenant networks previously reviewed in this chapter.\
  \ Let’s explore the options:\n\n- 1. **Network Name** (optional): The name for your\
  \ tenant network. Enter `provider-network-dashboard`.\n- 2. **Project** (required):\
  \ The specific project we want to own this provider network. In our environment,\
  \ regular users will not be modifying the provider network, so let’s place it in\
  \ the **admin** project.\n- 3. **Provider Network Type** (required): We can specify\
  \ a tagging or encapsulation method for the provider network. This is useful if\
  \ we want the provider network to link to a resource that resides on a specific\
  \ VLAN, VXLAN, or GRE tunnel. We also have the ability to select FLAT to represent\
  \ no encapsulation or tagging of the provider network traffic. Let's specify FLAT.\n\
  - 4. **Physical Network** (required): The name of the physical interface mapping\
  \ we want associated with this provider network. This is not an interface name (such\
  \ as eth0, eth1, or eth2) but rather a label defined in the file `/etc/neutron/plugins/ml2/linuxbridge_agent.ini`.\
  \ I have previously created a mapping between the interface veth1 on the virtual\
  \ appliance and the label `public-dashboard`. This network will provide your OpenStack\
  \ environment access to the outside world, a.k.a. the internet (as long as you have\
  \ internet access on your host machine). Type in `public-dashboard`.\n- 5. **Segmentation\
  \ ID** (optional): You only need to specify the segmentation ID if you specify a\
  \ VLAN, VXLAN, or GRE Provider Network Type in Step 6. This could be a VLAN tag,\
  \ VXLAN VNI, or GRE ID. We will leave this blank since we are using Provider Network\
  \ Type FLAT (no encapsulation/tagging).\n- 6. **Admin State** (required): The Admin\
  \ State controls whether the provider network is off or on. If you set it in the\
  \ DOWN state, any subnets you associate with the provider network will not be functional\
  \ until turned back to UP. Verify it is set to UP.\n- 7. **Shared** (optional):\
  \ If a provider network is shared, all projects across all domains will be able\
  \ to directly attach their instances to this provider network. We are only going\
  \ to allow our users to set their router gateways to the provider network, so we\
  \ will make sure we uncheck this option.\n- 8. **External Network** (optional):\
  \ This is the magic that allows our users to set their router's gateway to the network.\
  \ This will allow us to get our virtual machine instances access to the resources\
  \ that live outside OpenStack. Let's make sure it is checked.\n\n- 9. Select **Submit**\
  \ to create the network.\n\n## Create Network\n\n### Description:\n\nCreate a new\
  \ network for any project as you need.\n\nProvider specified network can be created.\
  \ You can specify a physical network type (like Flat, VLAN, GRE, and VXLAN) and\
  \ its segmentation_id or physical network name for a new virtual network.\n\nIn\
  \ addition, you can create an external network or a shared network by checking the\
  \ corresponding checkbox.\n\n| Field | Value |\n|---|---|\n| Name | provider-network-dashboard\
  \ |\n| Project * | admin |\n| Provider Network Type * | Flat |\n| Physical Network\
  \ * | public-dashboard |\n| Segmentation ID * |  |\n| Admin State * | UP |\n| Shared\
  \ |  |\n| External Network |  |\n| Cancel |  |\n| Submit |  |\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_218_0.png)\n\
  \nFigure 6.44: Entering provider network details on the Horizon dashboard\n\nAfter\
  \ you have created provider-network-dashboard, you should see it in the list of\
  \ networks in the Networks panel in the Admin-System panel group. See Figure 6.44.\
  \ Notice how the provider network shows Yes in the External column.\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_219_0.png)\n\
  \nFigure 6.45: A newly created provider network on the Horizon dashboard\n\n## CLI\n\
  \nIt's time to jump on the command line again. This time, we will be creating a\
  \ provider network. Remember: we want the provider network to exist inside the admin\
  \ project so users in other projects can't modify it. In that case, we only need\
  \ to source the openrc file.\n\n```\n$ source openrc\n```\n\nVerify that the proper\
  \ variables are set and you are scoped to the admin project:\n\n```\n$ export |\
  \ grep OS\n```\n\nNow let's create our new provider network. This time, we will\
  \ specify the public-cli for the provider's physical network. This is a physical\
  \ network mapping that I previously provisioned for the virtual appliance. Like\
  \ the public-dashboard physical network we used in the previous exercise, this provides\
  \ your OpenStack environment with access to your system's internet connection. Also\
  \ take note of the --external flag. Without this flag, your users will not be able\
  \ to set their router's gateway to the provider network.\n\n```\n$ openstack network\
  \ create --provider-physical-network public-cli --provider-network-type flat provider-network-cli\
  \ --external\n```\n\nYou should see the following output:\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_220_0.png)\n\
  \nFigure 6.46: Output from the 'openstack network create' command\n\nConfirm provider-network-cli\
  \ was successfully created by running the following:\n\n```\n$ openstack network\
  \ list --long\n```\n\nCongratulations! You've created a brand new provider network\
  \ on the CLI.\n\n## Exam objective - manage provider subnets\n\nManaging provider\
  \ subnets is identical to managing tenant subnets. We will follow a very similar\
  \ process to the tenant subnet creation process outlined earlier in the beginning\
  \ of this chapter. One slight difference is that our provider subnet will not have\
  \ DHCP enabled. Remember: our users will not be attaching instances directly to\
  \ the provider network and subnet. When we demonstrate north/south traffic in the\
  \ next section, you will only set your router gateway to the provider network/subnet.\n\
  \nIt's also important to note that the subnet CIDR defined in the provider subnet\
  \ will become the available floating IP address pool. We will learn about floating\
  \ IP addresses in the last section of this chapter.\n\n## Horizon dashboard\n\n\
  - 1. See Figure 6.47. Select `provider-network-dashboard` from the Networks panel\
  \ under the Admin-System panel group.\n- 2. See Figure 6.48. Select the **Subnets**\
  \ tab.\n- 3. Select **Create Subnet**.\n- 4. See Figure 6.49. **Subnet Name**: `provider-subnet-dashboard`\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_221_0.png)\n\nFigure 6.47: Creating a\
  \ provider subnet on the Horizon dashboard\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_221_1.png)\n\
  \nFigure 6.48: Creating a provider subnet on the Horizon dashboard\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_222_0.png)\n\
  \nFigure 6.49: Filling in provider subnet details on the Horizon dashboard\n\n-\
  \ 5. Network Address: 172.16.0.0/24. Because you most likely only have access to\
  \ one public IP address in your home, we will temporarily suspend our disbelief\
  \ and select an internal IP address range to act as our external provider network\
  \ IP address. We are using this private network range because the virtual appliance\
  \ has a previously created gateway interface, which will allow the provider network\
  \ to talk out to the internet connection on the host machine. In the real world,\
  \ this could be an external IP address range provided by an Internet Service Provider.\n\
  - 6. IP Version: IPv4\n- 7. Gateway IP: This is the previously created gateway interface\
  \ on your virtual appliance. This will typically be the IP of your gateway device\
  \ or router that lives outside OpenStack. For the sake of this exercise, we will\
  \ enter 172.16.0.1. In your virtual appliance, this is an IP address assigned to\
  \ a virtual interface that routes out to your VirtualBox NAT network and out the\
  \ default gateway on your host system. You can see it by running `ip a show tap0`\
  \ inside the virtual appliance.\n\n\n\n- 8. **禁用网关**：未选中。\n- 9. 参见图 6.50。**启用 DHCP**：用户不会在提供者网络上启动实例，因此请确保此项**未选中**。\n\
  - 10. **分配池**：这允许我们限制之前定义的网络地址 `172.16.0.0/24` 的范围。这将成为本章最后一节中将使用的**浮动 IP** 池。输入\
  \ `172.16.0.10,172.16.0.30`。\n- 11. **DNS 名称服务器**：我们将留空，因为没有实例附加到此提供者子网。\n- 12.\
  \ **主机路由**：我们将留空，因为我们不会注入任何主机路由。\n- 13. 选择 **创建**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_223_0.png)\n\
  \n图 6.50：Horizon 仪表板上的提供者子网 DHCP 选项\n\n参见图 6.51。我们现在应该有一个新创建的子网！\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_224_0.png)\n\
  \n图 6.51：Horizon 仪表板上新配置的提供者子网\n\n## 命令行界面\n\n让我们在 CLI 上创建提供者子网。我们将首先 source openrc。\n\
  \n```\n$ source openrc\n```\n\n验证正确变量是否已设置：\n\n```\n$ export | grep OS\n```\n\n\
  因为我们为 CLI 示例使用不同的 provider-physical-network，所以我们将使用不同的子网、网关和分配池。\n\n```\n$ openstack\
  \ subnet create --network provider-network-cli --subnet-range 172.16.1.0/24 --gateway\
  \ 172.16.1.1 --no-dhcp provider-subnet-cli\n```\n\n您应该会看到以下输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_225_0.png)\n\
  \n图 6.52：'openstack subnet create' 命令的输出\n\n通过运行以下命令确认 provider-network-cli 是否成功创建：\n\
  \n```\n$ openstack subnet list --long\n```\n\n恭喜！您已在 CLI 上创建了一个全新的提供者子网。\n\n## 考试目标\
  \ - 管理路由器 - 北/南 流量\n\n此时，我们的东/西路由器流量场景应与图 6.26 相似。这是一个很好的例子，说明 Neutron 路由器如何帮助您路由内部\
  \ Neutron 租户网络。现在我们已经创建了一些提供者网络，得益于我们的路由器，我们应该能够将实例的租户网络连接到它们。连接后，我们的实例将可以访问互联网！\n\
  \n在开始此练习之前，请验证运行虚拟设备的宿主机是否具有有线/无线互联网访问权限。请务必禁用任何 VPN 或代理。它们可能会干扰外部连接。\n\n## Horizon\
  \ 仪表板\n\n是时候将我们的路由器网关连接到之前创建的提供者网络，以便 tenant-network1-dashboard 和 tenant-network2-dashboard\
  \ 上的实例可以访问互联网：\n\n- 1. 参见图 6.53。从 OpenStack 概览页面，通过选择顶部下拉菜单将范围限定到 logistics 项目。\n\
  - 2. 选择 Project-Network 面板组中的面板。这里您应该能看到我们之前创建的路由器：router-dashboard。\n- 3. 在 router-dashboard\
  \ 旁边选择 Set Gateway。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_226_0.png)\n\n图\
  \ 6.53：Horizon 仪表板上设置路由器网关\n\n- 4. 参见图 6.54。**外部网络**（必填）：这里我们将选择之前创建的提供者网络：`provider-network-dashboard`\n\
  - 5. 选择 **提交**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_227_0.png)\n\n图 6.54：为路由器指定提供者网络网关\n\
  \n恭喜！您刚刚将实例连接到互联网！在我们继续测试连接之前，请参见图 6.55。这是我们当前网络拓扑的高级视图。路由器的默认网关设置为 `provider-network-dashboard`。所有未发往\
  \ `tenant-network-dashboard` 和 `tenant-network2-dashboard` 的流量都将流经此处。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_228_0.png)\n\
  \n图 6.55：北/南 流量网络拓扑\n\n要从 OpenStack 实例测试互联网连接，运行 VirtualBox 的个人笔记本电脑或台式机必须连接到互联网。\n\
  \n让我们现在访问 logistics 项目中的 `instance1-dashboard`，以确保它可以访问互联网：\n\n从实例部分选择 `instance1-dashboard`。\n\
  \n选择 **Console** 选项卡。选择 **Show Only Console**。如果仍然看不到任何内容，请点击 **Enter**，这应该会唤醒控制台屏幕。\n\
  \n我们现在可以登录到实例：\n\nusername: cirros\n\npassword: cubswin:)\n\n登录后，让我们尝试 ping（3 次）openstack.org。请耐心等待！可能需要几分钟才能看到\
  \ ping 回复。\n\n```\n$ ping -c 3 openstack.org\n```\n\n您应该会看到以下响应：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_229_0.png)\n\
  \n图 6.56：来自 openstack.org 的 ping 响应确认北/南 流量通信成功\n\n如果您在不使用 -c 计数参数的情况下执行 ping，可以通过按\
  \ Ctrl + C 来取消它。\n\n## 命令行界面\n\n让我们通过 python-openstackclient 将 router-cli 设置为 provider-network-cli。这是一个相当简单的命令。\n\
  \n开始之前，请务必 source openrc-logistics 凭据文件，因为我们正在 logistics 项目中工作。\n\n```\n$ source\
  \ openrc-logistics\n```\n\n验证正确变量是否已设置：\n\n```\n$ export | grep OS\n```\n\n列出所有可用的路由器：\n\
  \n```\n$ openstack router list\n```\n\n列出所有可用的网络并验证 provider-network-cli 是否列出：\n\
  \n```\n$ openstack network list --long\n```\n\n将 router-cli 的网关设置为 provider-network-cli。\n\
  \n对于此命令，我们需要使用基于服务的客户端 python-neutronclient。这是因为 python-openstackclient 版本 2.7.12\
  \ 不支持设置路由器网关。\n\n要使用 python-neutronclient 设置路由器网关，请运行以下命令：\n\n```\n$ neutron router-gateway-set\
  \ router-cli provider-network-cli\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_230_0.png)\n\
  \n截至本书撰写时，python-openstackclient 版本 3.6 支持使用以下命令设置路由器网关：openstack router set router-cli\
  \ --external-gateway provider-network-cli。注意！考试可能只包含较旧版本的 python-openstackclient\
  \ 且不支持此功能。\n\n## 考试目标 - 管理浮动 IP\n\n在之前的目标中，我们将路由器网关设置为提供者网络。这为连接到路由器的网络上的所有实例提供了互联网访问权限。但如果我们想从\
  \ *OpenStack 环境* 外部访问这些实例中的某个应用程序或资源怎么办？由于分配给我们实例的 IP 地址是内部的且不可公网路由，Neutron 允许用户将浮动\
  \ IP 与其实例关联。浮动 IP 类似于 Amazon Web Services 世界中的弹性 IP 概念。使用它们是一个两步过程：\n\n- 1. **分配**\
  \ 一个浮动 IP 给您的项目。\n- 2. **分配** 浮动 IP 给实例。\n\n如果您不再需要浮动 IP，可以轻松地将其从项目中取消分配并释放，发送回原始浮动\
  \ IP 地址池。记住：浮动 IP 地址池是在提供者网络子网中定义的。在现实世界中，这可能是由我们的互联网服务提供商提供的外部 IP 地址范围。\n\n## Horizon\
  \ 仪表板\n\n让我们为 **logistics** 项目中的 **instance1-dashboard** 实例关联一个浮动 IP 地址。然后我们将尝试通过其浮动\
  \ IP 从虚拟设备 ping 该实例。由于我们拥有管理员角色，我们将了解如何通过 admin-system 面板组分配特定 IP 地址。让我们开始！\n\n\
  - 1. 参见图 6.57。从 OpenStack 概览页面，选择 **Admin-System** 面板组。\n- 2. 选择 **Floating IPs**\
  \ 面板。\n\n3. 选择 **Allocate IP to Project**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_232_0.png)\n\
  \n图 6.57：从 Horizon 仪表板分配浮动 IP 地址\n\n4. 参见图 6.58。**Pool**（必填）：选择我们之前创建的提供者网络，`provider-network-dashboard`。\n\
  \n5. **Project**（必填）：选择将拥有浮动 IP 地址的项目。由于我们一直在 logistics 项目中进行 Neutron 工作，请选择 `logistics`。\n\
  \n6. **Floating IP Address**（可选）：我们可以在此处指定想要的浮动 IP 地址。在我们的练习中，让我们请求 `172.16.0.100`。如果我们不指定\
  \ IP 地址，我们将从在 **提供者子网** 练习中创建的提供者子网中定义的 `172.16.0.0/24` 池中分配一个随机的可用浮动 IP 地址。\n\n\
  \n\n7. 选择“分配浮动 IP”以将浮动 IP 地址分配给 logistics 项目。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_233_0.png)\n\
  \n图 6.58：在 Horizon 仪表板上提供分配浮动 IP 地址的详细信息\n\n8. 请参阅图 6.59。现在 logistics 项目拥有 172.16.0.100\
  \ 地址，我们需要将其分配给 instance1-dashboard。首先，将自身范围限定到 logistics 项目。\n\n9. 在 instance1-dashboard\
  \ 虚拟机实例旁边的下拉菜单中选择“关联浮动 IP”。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_233_1.png)\n\
  \n图 6.59：从 Horizon 仪表板关联实例的 IP 地址\n\n10. 请参阅图 6.60。IP 地址：logistics 项目拥有的任何浮动 IP\
  \ 地址都会显示在此处。选择我们之前分配的 172.16.0.100。\n11. 要关联的端口：此处我们指定要与浮动 IP 地址关联的实例端口。我们需要确保 instance-1-dashboard\
  \ 及其内部 IP 地址被选中。\n12. 选择“关联”以继续映射。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_234_0.png)\n\
  \n图 6.60：提供将 IP 地址与实例关联的详细信息\n\n你做到了！如图 6.61 所示，instance1-dashboard 现在有两个 IP 地址：\n\
  \n固定/内部 IP: 192.168.1.3\n\n浮动 IP/外部 IP: 172.16.0.100\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_235_0.png)\n\
  \n图 6.61：具有内部 IP 地址和浮动 IP 地址的实例\n\n我们现在应该能够从虚拟设备内部 ping 172.16.0.100 IP 地址：\n\n\
  ```\n$ ping -c 3 172.16.0.100\n```\n\n我们应该能收到响应。请参阅图 6.62。\n\n成功了！\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_235_1.png)\n\
  \n图 6.62：在虚拟设备内部通过其浮动 IP 地址成功 ping instance1-dashboard\n\n那么现在我们知道浮动 IP 正在工作，SSH\
  \ 呢？让我们尝试 SSH 到该实例。\n\n```\n$ ssh cirros@172.16.0.100\n```\n\n你会注意到它不会工作！我们可以通过使用\
  \ SSH -v 标志获取更多信息。\n\n```\n$ ssh cirros@172.16.0.100 -v\n```\n\n请参阅图 6.63。注意我们的\
  \ SSH 客户端未连接到实例。是什么阻挡了它？\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_236_0.png)\n\
  \n图 6.63：尝试从虚拟设备内部通过其浮动 IP SSH 到实例。某些东西阻挡了此通信！\n\n一定是 **security groups**！\n\n默认情况下，所有进入实例的入站流量都被阻止！\n\
  \n在本章开始时，我们创建了一个名为 **webserver-sg-dashboard** 的安全组。我们向该组添加了一条安全组规则，允许入站 SSH（TCP/端口\
  \ 22）。让我们将此组应用到 **instance1-dashboard**。请参阅图 6.64。\n\n1. 验证你已限定到 **logistics** 项目。\n\
  2. 从 **Project-Compute** 面板中选择 **Instances**。\n\n3. 从 instance1-dashboard 下拉菜单中选择“编辑安全组”。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_237_0.png)\n\n图 6.64：在 Horizon 仪表板上编辑与实例关联的安全组\n\
  \n4. 请参阅图 6.65。将 webserver-sg-dashboard 安全组添加到实例。\n\n5. 选择“保存”。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_237_1.png)\n\
  \n图 6.65：在 Horizon 仪表板上将安全组应用于实例\n\n现在让我们再试一次。\n\n```\n$ ssh cirros@172.16.0.100\
  \ -v\n```\n\n成功！\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_238_0.png)\n\n如果向实例应用了多个安全组，则最宽松的安全组规则将优先。\n\
  \n## Bonus exercise\n\n如何在无需输入密码的情况下 SSH 到此实例？当然是使用 SSH 密钥！\n\n作为额外练习，删除 instance1-dashboard\
  \ 并使用我们在第 5 章 Nova Compute Service 中创建的 my-new-keypair-cli 重新创建它。在为实例关联浮动 IP 后，我们就可以尝试通过其浮动\
  \ IP 地址并使用我们的私钥 SSH 到实例！它应该看起来像这样：\n\n```\n$ ssh -i my-new-keypair-cli.pem cirros@172.16.0.100\n\
  ```\n\n太棒了！无需输入密码！\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_238_1.png)\n\n如果你收到警告，你可能需要通过运行\
  \ ssh-keygen -f \"/home/openstack/.ssh/known_hosts\" -R 172.16.0.100 删除旧的 known_hosts\
  \ 密钥\n\n## CLI\n\n通过 python-openstackclient 将浮动 IP 地址分配给实例的方法与 Horizon 仪表板相同：\n\n\
  1. 为你的项目分配浮动 IP 地址。\n2. 将浮动 IP 分配给实例。\n\n加载 openrc-logistics 文件：\n\n```\n$ source\
  \ openrc-logistics\n```\n\n验证是否已设置正确的变量：\n\n```\n$ export | grep OS\n```\n\n让我们使用\
  \ python-openstackclient 首先为 logistics 项目分配所需的浮动 IP 地址：\n\n```\n$ openstack floating\
  \ ip create --floating-ip-address 172.16.1.100 provider-network-cli\n```\n\n现在 logistics\
  \ 项目拥有 172.16.1.100 地址，我们可以通过运行以下命令轻松将其分配给 instance1-cli：\n\n```\n$ openstack server\
  \ add floating ip instance1-cli 172.16.1.100\n```\n\n虽然此命令不会产生任何输出，请参阅图 6.65。你可以通过使用\
  \ openstack server show 命令并观察 addresses 字段来验证浮动 IP 是否已正确关联。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_239_0.png)\n\
  \n图 6.66：'openstack server show' 命令的 addresses 字段显示实例的固定 IP 地址和浮动 IP 地址\n\n如果你想将安全组与此实例关联，可以轻松运行以下命令：\n\
  \n```\n$ openstack server add security group instance1-cli webserver-sg-cli\n```\n\
  \n## Before proceeding...\n\n在进入下一章之前，请确保删除所有正在运行的实例以释放可用资源。你可以运行以下命令：\n\n```\n\
  $ openstack server list --all-projects\n$ openstack server delete <server-uuid>\n\
  ```\n\n## Summary\n\n理解如何作为 OpenStack 终端用户和管理员与 Neutron 交互对于通过 COA 考试至关重要。Neutron\
  \ 是一个复杂的话题，但请记住，你只需负责作为 OpenStack 终端用户或管理员处理 OpenStack 网络，而不是负责底层网络配置的人员。这意味着你无需担心\
  \ Neutron 配置文件的细节或配置网络基础设施。通过本章详细说明的目标，你将获得成功完成所有与 Neutron 相关目标所需的信心。\n\n在下一章中，我们将讨论\
  \ Cinder 块存储和所有与 Cinder 相关的目标。\n"
- "# 7 Cinder Block-Storage Service\n\n## Cinder Block-Storage Service\n\n在上一章中，我们讨论了\
  \ Neutron 网络服务以及 Certified OpenStack Administrator 考试上的 Neutron 相关目标。现在我们将讨论 Cinder。Cinder\
  \ 是 OpenStack 块存储服务，它允许用户创建 **persistent** 卷，这些卷可以由 Nova 虚拟机实例挂载为设备。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- About Cinder\n- Exam objective - managing Cinder volumes\n- Exam objective -\
  \ attaching/detaching Cinder volumes from instances\n- Exam objective - managing\
  \ Cinder snapshots\n- Exam objective - managing Cinder backups\n\n完成本章后，你应该对 Cinder\
  \ 有扎实的理解，并具备成功完成考试上所有与 Cinder 相关目标所需的技能。\n\n### About Cinder\n\n当 Amazon Web Services\
  \ EC2 于 2006 年推出时，其外观与我们今天所知的截然不同。主要区别之一是 AWS 如何处理虚拟机存储。当时，AWS 仅为虚拟机实例提供 **ephemeral**\
  \ 存储。考虑一个用户使用提供 20 GB 主磁盘和 50 GB 次要磁盘的实例类型（或 flavor）启动 EC2 实例。写入这些本地磁盘的任何数据（即操作系统内部的\
  \ `/dev/xvda` 或 `/dev/xvdb`）都将驻留在托管该实例的计算节点上。请参阅图 7.1。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_243_0.png)\n\
  \n图 7.1：Amazon EC2 虚拟机临时存储\n\n不久后，许多用户遇到了问题：\n\n- 复制到磁盘的数据无法轻松转移到其他虚拟机。\n- 停止或终止实例意味着完全数据丢失（重新启动后，虚拟机将在另一个计算节点上启动，并使用新配置的磁盘）。\n\
  - 如果实例失败，你的数据将无法访问且无法轻松恢复。\n\n\n\n如果用户希望持久化其数据，则鼓励他们使用 S3 对象存储服务。\n\n2008 年 4 月，AWS\
  \ 做出了一项改变这一切的巨大公告。“我们即将推出的持久存储功能将使您能够为 EC2 创建可靠的持久存储卷”公告博文称。“这些卷可以被视为原始的未格式化驱动器，可以进行格式化后按需使用（如果您愿意，甚至可以作为原始存储使用）。”\n\
  \n这是 IT 历史上的一个令人难以置信的时刻：弹性云持久块存储的引入！\n\n类似于便携式 USB 驱动器，用户可以创建指定为千兆字节的块卷。一旦附加到虚拟机实例，卷在操作系统内部就会显示为原始未格式化的硬盘。格式化驱动器后，它可以像传统硬盘一样挂载并使用。写入磁盘的所有数据实际上都驻留在\
  \ AWS 数据中心内的专用服务器上，而不是实例所在的计算节点。参见图 7.2。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_244_0.png)\n\
  \n现在，用户还可以使用其主驱动器（即 `/dev/xvda`）作为 EBS 卷。参见图 7.3。这在实例故障时为基础操作系统提供完整的数据持久性；它被称为“EBS-backed”实例。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_245_0.png)\n\n图 7.3：主硬盘也可以由块卷支持\n\n受\
  \ AWS 弹性块存储启发，OpenStack 在 2011 年 Bexar 版本中于 Nova 项目中引入了块卷的概念。2012 年，OpenStack Folsom\
  \ 版本将块存储作为其自己的项目引入，名为 Cinder。\n\n## Cinder 架构\n\nCinder 由四个守护进程组成，如图 7.4 所示：\n\n\
  - **cinder-api**：Cinder 的 API 和主要网关。必须与 `cinder-api` 交互以创建、列出、删除和管理块卷、快照和备份。\n-\
  \ **cinder-scheduler**：评估并过滤所有可用的存储节点，以确定为要创建的块卷选择最佳存储节点。`cinder-scheduler` 的行为可以根据容量或存储能力等特定特征进行修改。\n\
  - **cinder-volume**：驻留在 Cinder 存储节点上，负责块卷的创建和删除。\n- **cinder-backup**：协助将块卷备份到 OpenStack\
  \ Swift 或其他第三方存储目标。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_246_0.png)\n\n图\
  \ 7.4：Cinder 架构的高级视图\n\n## Cinder 背后\n\n默认情况下，Cinder 由两种特定技术提供支持：\n\n- 1. **LVM\
  \ (Logical Volume Manager)**：LVM 工具集在 1990 年代后期开发，允许用户在不中断服务的情况下添加和更换硬盘。这是通过创建整个硬盘的单个逻辑卷来实现的，从而允许动态调整大小。\n\
  - 2. **iSCSI (Internet Small Computer Systems Interface)**：iSCSI 是一种基于 IP 的存储标准，用于在网络上提供对存储设备的块级访问。\n\
  \n考虑一个用户创建 Cinder 块卷的情况。用户通过 Horizon 仪表板或 CLI 向 cinder-api 发送 API 请求。一旦 cinder-api\
  \ 收到请求，它就会使用有关卷的详细信息更新 Cinder 数据库并将其放置在消息总线上。cinder-scheduler 确定为请求的卷配置最佳的 Cinder\
  \ 存储节点。一旦选定，cinder-volume 负责生成 LVM 命令以从预定义的卷组创建逻辑卷。然后用户向 nova-api 发送 API 调用以将卷附加到其选择的实例。此连接过程实际上是实例的计算节点（发起方）与\
  \ Cinder 存储节点（目标）之间的 iSCSI 连接。参见图 7.5。用户然后可以继续在实例的操作系统内格式化块设备并写入数据。写入 Cinder 的所有数据都存储在\
  \ Cinder 存储中。用户然后可以从实例分离卷并将其重新附加到另一个实例，从而重新建立到不同计算节点的 iSCSI 连接。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_247_0.png)\n\
  \n图 7.5：Cinder 使用 LVM 和 iSCSI 向 Nova 实例呈现原始块设备\n\n## Cinder 后端软件和硬件驱动程序\n\nCinder\
  \ 支持多种软件和硬件驱动程序用于存储后端。在硬件驱动程序的情况下，这允许用户将现有的硬件存储设备（如 SAN 或 NAS）用作 Cinder 存储节点。\n\n\
  | 软件驱动程序 | 硬件驱动程序 |\n|---|---|\n| LVM | NetApp |\n| NFS | Dell EqualLogic |\n| GlusterFS\
  \ | EMC V-MAX |\n| Ceph | SolidFire |\n\n## Cinder 概念\n\n- **Volume**：可附加到 Nova\
  \ 虚拟机实例的原始未格式化块设备。然后实例的操作系统可以像传统硬盘一样使用它。\n- **Snapshot**：卷内容的只读、时间点副本。可以从当前使用中或可用状态的卷创建快照。然后快照可用于创建新卷。\n\
  - **Backup**：存储在 Swift 对象存储容器中或 Google Cloud Platform 等其他第三方提供商中的卷内容的压缩归档文件。\n\n\
  ## 考试目标\n\n让我们看看 Cinder 考试目标。\n\n以下图表分解了您在 COA 考试中应负责了解的各种 Cinder 相关目标。如您所见，所有这些任务都可以在\
  \ Horizon 仪表板和 CLI 上完成。记住：考试期间时间就是一切，在许多情况下，在仪表板上处理任务会快得多。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_249_0.png)\n\
  \n图 7.6：Cinder 考试目标可以在 Horizon 仪表板或 CLI 上完成\n\n## 考试目标 - 管理 Cinder 卷\n\n创建 Cinder\
  \ 卷非常简单，应该是在考试中轻松得分的方式。让我们看看！\n\n## Horizon 仪表板\n\n让我们在 Horizon 仪表板上创建一个卷。参见图 7.7。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_250_0.png)\n\n图 7.7：从 Horizon 仪表板创建块卷\n\
  \n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定为 **quality-control** 项目。\n- 2. 从 **Project-Compute**\
  \ 面板组中选择 **Volumes** 面板。\n- 3. 选择 **Create Volume**。\n- 4. 参见图 7.8。**Volume Name\
  \ (optional)**：卷的名称。输入 `volume-dashboard`。\n- 5. **Description (optional)**：卷的描述。输入\
  \ `COA exam prep dashboard volume`。\n- 6. **Volume Source (optional)**：默认情况下，您创建的任何卷都是全新的且为空。卷源是您希望复制到卷中的现有数据源。以下是卷源的示例：\n\
  \  - 1. **No Source, Empty Volume**：一个空卷。卷必须由虚拟机实例的操作系统格式化和挂载。我们将选择此项。\n  - 2. **Image**：这会将现有\
  \ Glance 镜像的内容复制到您的块卷。您必须确保卷的大小等于或大于指定镜像的大小。这将自动使您的镜像 **bootable**，以便在启动实例时将其指定为主要磁盘（启动源）。这是一个强大的功能，将导致您的\
  \ `/dev/vda` 文件夹驻留在 Cinder 存储节点上，类似于 AWS EBS-backed 实例。\n  - 3. **Volume**：这会将现有卷的内容复制到您的块卷。您必须确保卷的大小等于或大于指定卷的大小。\n\
  - 7. **Type (optional)**：允许用户指定由 OpenStack 基础设施工程师先前配置和定义的特定卷后端。一个例子是只有 SSD 驱动器的\
  \ Cinder 存储服务器/节点组。另一个例子可以是具有传统 SATA 驱动器的 Cinder 存储节点组。这赋予了您的 OpenStack 用户选择的权力。\n\
  - 8. **Size (required)**：卷的大小（以千兆字节为单位）。输入 1。\n- 9. **Availability Zone (optional)**：类似于\
  \ Nova 可用区，Cinder 可用区在安装期间定义，并为您提供分隔 cinder 存储节点的通用方法。默认情况下，所有 Cinder 存储节点都属于 Nova\
  \ 可用区。\n- 10. 选择 **Create Volume**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_251_0.png)\n\
  \n图 7.8：在 Horizon 仪表板上提供块卷详细信息\n\n\n\n我们现在应该已经拥有一个由 quality-control 项目拥有的新创建的卷。此时，quality-control\
  \ 项目中的所有用户都应该有权修改该卷，但它在附加到实例之前无法真正使用。\n\n我们一次只能将块卷附加到一个实例；需要注意的是，我们无法将此卷对所有项目公开。我们可以做的是，使用卷面板中的\
  \ Create Transfer 选项将卷的所有权转移到另一个项目。这将生成一个特殊的 ID 和授权密钥，我们将其提供给另一个项目中的用户。另一个项目中的用户然后输入\
  \ Accept Transfer，输入 ID 和 auth key，然后获得对该卷的完全控制权和所有权。卷转移到另一个项目后，除非原始所有者接受回传，否则将无法再访问。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_252_0.png)\n\n我们也有将卷设为可启动的选项。可启动卷是可以作为\
  \ Nova 启动源选择的卷。为了成为合适的启动源，卷必须包含引导加载程序或虚拟机实例 BIOS 可以读取的指令。选择 Edit Instance 并勾选 Bootable\
  \ 框即可使卷可启动。\n\n## CLI\n\n请回忆提供的 openrc 文件包含用于正确向 Keystone 进行身份验证并设置项目范围的变量形式凭据。\n\
  \n在本章中，我们将在 quality-control 项目中执行所有 Cinder 相关任务。让我们将原始 openrc 文件复制到名为 openrc-quality-control\
  \ 的新文件中。\n\n```\n$ cp openrc openrc-quality-control\n```\n\n现在我们已经制作了副本，让我们编辑 openrc-quality-control\
  \ 文件并更新项目和租户名称变量，以反映我们希望对 logistics 项目的范围。如果您更习惯使用其他编辑器，请在此处随意使用：\n\n```\n$ nano\
  \ openrc-quality-control\n```\n\n将以下变量更改为 quality-control：\n\n```\nexport OS_PROJECT_NAME=quality-control\n\
  export OS_TENANT_NAME=quality-control\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_253_0.png)\n\
  \n我们更改 OS_TENANT_NAME 变量，因为一些较旧的基于服务的客户端可能仍依赖于旧变量 OS_TENANT_NAME。\n\n载入新创建的 openrc-quality-control\
  \ 文件：\n\n```\n$ source openrc-quality-control\n```\n\n验证是否已正确设置变量：\n\n```\n$ export\
  \ | grep OS\n```\n\n现在我们已正确限定范围，从现在开始创建的任何新卷都将由 quality-control 项目拥有。与 python-openstackclient\
  \ 的其他一些 list 命令不同，openstack volume list 仅显示我们当前限定范围的项目内的卷。在考试期间务必牢记这一点。运行以下命令：\n\
  \n```\n$ openstack volume list --long\n```\n\n我们应该会看到在上一练习中创建的 volume-dashboard\
  \ 卷。作为管理员，我们应该能够查看和列出环境中所有项目的所有卷。运行以下命令：\n\n```\n$ openstack volume list --all-projects\
  \ --long\n```\n\n您现在应该会看到一个之前在虚拟设备上创建的额外卷。\n\n让我们继续使用 CLI 创建一个全新的 1 GB 卷。我们将它命名为\
  \ volume-cli，描述为 COA exam prep cli volume：\n\n```\n$ openstack volume create --size\
  \ 1 volume-cli --description \"COA exam prep cli volume\"\n```\n\n我们应该会看到与图 7.9\
  \ 相似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_254_0.png)\n\n图 7.9：openstack\
  \ volume create 命令的输出\n\n让我们确认卷是否已成功创建：\n\n```\n$ openstack volume list --long\n\
  ```\n\n我们应该会看到与图 7.10 相似的内容。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_254_1.png)\n\
  \n图 7.10：'openstack volume list --long' 命令的输出\n\n请记住，此命令仅显示您所限定范围的项目内的卷！要查看 OpenStack\
  \ 环境中所有项目的所有卷，请使用 --all-projects 标志。\n\n## Horizon 仪表盘\n\n在之前的 Horizon 仪表盘练习中，我们创建了一个\
  \ 1 GB 的 Cinder 块卷。为了使用该卷，我们必须将其附加到虚拟机实例。在进行此练习之前，请确保您没有来自之前章节练习的当前正在运行的实例。\n\n\
  我们需要启动一个 Nova 实例。然后我们将 Cinder 卷附加到此实例并写入一些文件。如果您忘记了如何创建租户网络、子网和虚拟机实例，请参阅第 5 章和第\
  \ 6 章中的说明。\n\n以下是详细信息。对未指定的任何内容假设使用默认值：\n\n### Network/subnet\n\n- **Project**:\
  \ `quality-control`\n- **Network Name**: `tenant-network-dashboard`\n- **Subnet\
  \ Name**: `tenant-subnet-dashboard`\n- **Network Address**: `192.168.1.0/24`\n\n\
  ### Instance\n\n- **Project**: `quality-control`\n- **Instance Name**: `instance-dashboard`\n\
  - **Source**: `cirros`\n- **Flavor**: `m1.tiny`\n- **Networks**: `tenant-network-dashboard`\n\
  \n现在我们已经在 **quality-control** 项目的 **tenant-network-dashboard** 网络上拥有了 **instance-dashboard**，让我们将一个卷附加到它。见图\
  \ 7.11。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_256_0.png)\n\n图 7.11：从 Horizon\
  \ 仪表盘将卷附加到实例\n\n1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到 **quality-control** 项目。\n2.\
  \ 从 **Project-Compute** 面板组中选择 **Instances** 面板。\n3. 在 **instance-dashboard** 旁边的\
  \ **Actions** 下拉菜单中选择 **Attach Volume**。\n4. 见图 7.12。**Volume ID (required)**：这是您想要附加到实例的卷。选择\
  \ `volume-dashboard`。\n5. 选择 **Attach Volume**。\n6. 如果我们想分离卷，可以轻松地从 **Actions**\
  \ 下拉菜单中选择 **Detach Volume** 并再次选择该卷。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_256_1.png)\n\
  \n图 7.12：在 Horizon 仪表盘上指定要附加到实例的卷\n\n我们可以通过转到仪表盘上的 **Volumes** 面板组并观察 **Attached\
  \ To** 列来验证卷是否已成功附加到实例。见图 7.13。卷已作为 `/dev/vdb` 挂载到实例。让我们现在进入实例，看看如何使用该卷。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_257_0.png)\n\
  \n图 7.13：Cinder 卷成功附加到 Nova 实例\n\n如第 5 章 Nova Compute Service 中所述，访问 **instance-dashboard**\
  \ 虚拟机实例的 Nova 控制台。\n\n使用以下默认 Cirros 用户名/密码登录实例：\n\n- **Username:** cirros\n- **Password:**\
  \ cubswin:)\n\n现在我们已登录，可以使用流行的 fdisk 实用程序列出任何已识别的块设备：\n\n```\n$ sudo fdisk -l\n\
  ```\n\n您应该会看到与图 7.14 相似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_258_0.png)\n\
  \n图 7.14：/dev/vdb 是新附加的 Cinder 块卷\n\n然后我们可以用 ext3 文件系统格式化此原始块设备：\n\n```\n$ sudo\
  \ mkfs.ext3 /dev/vdb\n```\n\n尽管我们的磁盘已格式化，但仍需要将其挂载才能使用：\n\n```\n$ sudo mount /dev/vdb\
  \ /mnt\n```\n\n现在文件已挂载，我们应该能够在卷上创建文件。让我们使用 touch 实用程序在卷上创建一个名为 helloworld.txt 的文件：\n\
  \n```\n$ sudo touch /mnt/helloworld.txt\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_258_1.png)\n\
  \n请记住，我们的 OpenStack 虚拟设备只是一台虚拟机，因此它充当超visor 和 Cinder 存储节点。在真实的 OpenStack 环境中，我们的\
  \ Cinder 卷将驻留在专用的 Cinder 存储服务器上。\n\n让我们将卷从 /mnt 文件夹卸载：\n\n```\n$ sudo umount /dev/vdb\
  \ /mnt\n```\n\n现在我们可以轻松地将此卷从 instance-dashboard 分离并将其附加到另一个已启动的实例。写入此卷的任何数据都可供可以附加它的任何实例访问。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_259_0.png)\n\n在我们的练习中，我们手动挂载并格式化了驱动器。某些操作系统在识别到新附加磁盘时可能会自动执行此过程。\n\
  \n请务必在本次练习结束时分离卷。您可以通过在虚拟机实例旁边的 Actions 下拉菜单中选择 Detach Volume 来执行此操作。\n\n## CLI\n\
  \n让我们通过 python-openstackclient 创建一个新实例并附加一个新卷。\n\n载入新创建的 openrc-quality-control\
  \ 文件：\n\n```\n$ source openrc-quality-control\n```\n\n验证是否已正确设置变量：\n\n```\n$ export\
  \ | grep OS\n```\n\n在 quality-control 项目中启动一个新实例：\n\n```\n$ openstack server create\
  \ --image cirros --flavor m1.tiny instance-cli\n```\n\ninstance-cli 启动后且其状态为 ACTIVE，将\
  \ volume-cli 卷附加到它：\n\n```\n$ openstack server add volume instance-cli volume-cli\n\
  ```\n\n您可以通过运行以下命令确认卷已附加到实例：\n\n```\n$ openstack volume list --long\n```\n\n\n\n\
  请参阅图 7.15。观察状态列。这显示卷是否可用或正在使用。请记住：OpenStack 的 Newton 版本一次只允许将卷附加到一个实例。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_260_0.png)\n\
  \n图 7.15：'Attached to' 列显示卷所附加到的实例\n\n您可以通过运行以下命令获取 instance-cli 控制台 URL：\n\n```\n\
  $ openstack console url show instance-cli\n```\n\n您可以随意通过虚拟机实例控制台格式化并挂载该卷，如上一节所示。\n\
  \n要分离卷，请运行以下命令：\n\n```\n$ openstack server remove volume instance-cli volume-cli\n\
  ```\n\n## 考试目标 - 管理 Cinder 快照\n\nCinder 支持捕获卷当前状态的卷快照。这些对于提供备份保护很有用，也可用于实例化包含快照确切数据的新的卷。在幕后，Cinder\
  \ 快照是 LVM 快照，将驻留在与原始逻辑卷相同的 LVM 卷组中。需要注意的是，快照不是备份。与 Cinder 快照不同，Cinder 备份存储在异地。我们将在下一节介绍它们。让我们在仪表板中逐步创建和恢复快照。\n\
  \n### Horizon 仪表板\n\n请参阅图 7.16。让我们从 Horizon 仪表板创建卷快照。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_261_0.png)\n\
  \n图 7.16：从 Horizon 仪表板创建快照\n\n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到 **quality-control**\
  \ 项目。\n- 2. 从 **Project-Compute** 面板组中选择 **Volumes** 面板。\n- 3. 在 **volume-dashboard**\
  \ 下拉菜单旁边选择 **Create Snapshot**。\n- 4. 见图 7.17。 **Snapshot Name (required)**：快照的名称。输入\
  \ `volume-snapshot-dashboard`。\n- 5. **Description (optional)**：卷快照的描述。输入 `COA exam\
  \ prep dashboard volume snapshot`。\n\n- 6. 选择 **Create Volume Snapshot**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_262_0.png)\n\
  \n图 7.17：在 Horizon 仪表板上为快照提供源卷的名称\n\n您现在应该能在 **Snapshots** 选项卡下看到新创建的卷快照。该快照归 `quality-control`\
  \ 项目所有。您可以通过选择 **Create Volume** 按钮轻松从中创建卷。\n\nTIP\n从现有快照创建新卷时，卷的大小必须等于或大于快照的大小。为了删除具有关联快照的卷，您必须先删除快照。\n\
  \n### CLI\n\n让我们通过 `python-openstackclient` 创建一个新的 Cinder 快照。\n\n载入新创建的 `openrc-quality-control`\
  \ 文件：\n\n```\n$ source openrc-quality-control\n```\n\n验证是否设置了正确的变量：\n\n```\n$ export\
  \ | grep OS\n```\n\n查看当前所有 Cinder 卷：\n\n```\n$ openstack volume list\n```\n\n对 volume-cli\
  \ 卷进行快照。快照名称为 volume-snapshot-cli。\n\n```\n$ openstack snapshot create --name volume-snapshot-cli\
  \ volume-cli\n```\n\n您应该会看到与图 7.18 相似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_263_0.png)\n\
  \n图 7.18：'openstack snapshot create' 命令的输出\n\n您可以通过运行以下命令确认快照已创建：\n\n```\n$ openstack\
  \ snapshot list --long\n```\n\n如果您想从此快照创建卷，可以运行以下命令：\n\n```\n$ openstack volume\
  \ create --snapshot volume-snapshot-cli --size 1 restored-snapshot-volume-cli\n\
  ```\n\n## 考试目标 - 管理 Cinder 备份\n\n与 Cinder 快照类似，Cinder 备份包含源卷中的所有数据。与 Cinder 快照不同，Cinder\
  \ 备份是压缩的 bz2 或 zlib 归档文件，存储在 Cinder 存储节点之外。目标备份位置可以根据使用的驱动程序存在于多种位置。驱动程序包括 OpenStack\
  \ Swift、Google Cloud Platform、GlusterFS，甚至 NFS 共享（仅举几例）。您的虚拟设备目前配置为使用安装在设备上的 OpenStack\
  \ Swift 部署。我们将在第 8 章《Swift 对象存储服务》中更深入地讨论 Swift。让我们在仪表板中逐步创建和恢复快照。\n\n### Horizon\
  \ 仪表板\n\n让我们从 Horizon 仪表板创建 Cinder 备份。请参阅图 7.19。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_264_0.png)\n\
  \n图 7.19：在 Horizon 仪表板上创建备份\n\n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到 **quality-control**\
  \ 项目。\n- 2. 从 **Project-Compute** 面板组中选择 **Volumes** 面板。\n- 3. 在 **volume-dashboard**\
  \ 下拉菜单旁边选择 **Create Backup**。\n- 4. 见图 7.20。 **Backup Name (required)**：备份的名称。输入\
  \ `volume-backup-dashboard`。\n- 5. **Description (optional)**：卷快照的描述。输入 `COA exam\
  \ prep dashboard volume backup`\n- 6. **Container Name (optional)**：备份的 Swift 对象容器目标名称。输入\
  \ `volume-backup-container-dashboard`\n\n- 7. 选择 Create Volume Backup。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_265_0.png)\n\
  \n图 7.20：在 Horizon 仪表板上为 Cinder 备份设置目标容器名称\n\n一旦备份创建完成，我们应该会有一个新的 Swift 对象容器，其中包含压缩并归档的卷内容。\n\
  \n我们将在第 8 章更详细地讨论 Swift。现在，请确保您已限定到 **quality-control** 项目，并在 **Project-Object Store**\
  \ 面板组中选择 **Containers** 面板。请参阅图 7.21。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_265_1.png)\n\
  \n图 7.21：'openstack volume backup list' 命令的输出\n\n要恢复此备份，我们可以在 **Volume Backups**\
  \ 选项卡中使用 **Restore Backup** 按钮。\n\n### CLI\n\n让我们通过 `python-openstackclient` 创建一个新的\
  \ Cinder 备份。\n\n载入新创建的 `openrc-quality-control` 文件：\n\n```\n$ source openrc-quality-control\n\
  ```\n\n验证是否设置了正确的变量：\n\n```\n$ export | grep OS\n```\n\n创建备份：\n\n```\n$ openstack\
  \ volume backup create --name volume-backup-cli --description \"COA exam prep dashboard\
  \ volume backup\" --container volume-backup-container-cli volume-cli\n```\n\n备份完成后，您应该能够确认备份已成功创建：\n\
  \n```\n$ openstack volume backup list\n```\n\n您应该会看到与图 7.22 相似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_266_0.png)\n\
  \n图 7.22：'openstack volume backup list' 命令的输出\n\n如果您想在 CLI 上恢复备份，您必须先手动创建一个空卷，然后运行以下命令：\n\
  \n```\n$ openstack volume backup restore volume-backup-cli <target-volume>\n```\n\
  \n## 注意\n\n在继续下一章之前，请务必删除所有正在运行的实例以释放可用资源。您可以运行以下命令：\n\n```\n$ openstack server\
  \ list --all-projects\n$ openstack server delete <server-uuid>\n```\n\n## 总结\n\n\
  您刚刚学习了考试中所有与 Cinder 相关的目标。如您所见，所有与 Cinder 相关的目标都可以在 Horizon 仪表板上完成。您可以通过使用要附加卷的实例旁边的下拉菜单轻松地将卷附加到实例。请记住，在\
  \ OpenStack 的 Newton 版本中，一次只能将卷附加到一个实例。在下一章中，我们将讨论 Swift，即 OpenStack 对象存储服务，并完成考试中所有与\
  \ Swift 相关的目标。\n"
- "# 8 Swift 对象存储服务\n\n## Swift 对象存储服务\n\n在上一章中，我们讨论了 Cinder 块存储服务以及 Certified OpenStack\
  \ Administrator 考试中的 Cinder 相关目标。现在我们将讨论 Swift。Swift 是 OpenStack 对象存储服务，为用户提供通过\
  \ RESTful API 访问的冗余云存储。\n\n在本章中，我们将涵盖以下主题：\n\n- Swift 架构\n- Swift 概念\n- 考试目标 - 管理容器和对象\n\
  - 考试目标 - 在容器上设置 ACL\n- 考试目标 - 设置对象过期\n\n在本章之后，您应该对 Swift 有扎实的理解，并具备成功完成考试中所有与 Swift\
  \ 相关目标所需的技能。\n\n### 关于 Swift\n\n如果您想在 90 年代末或 2000 年代初注册网站托管服务提供商，您通常会使用一个提供商为您提供服务器访问权限的服务。该服务器会为您分配特定量的存储空间供您使用和存储文件。每月支付固定费用。您可以通过\
  \ Secure SSH 或 FTP 客户端上传网站的 HTML 页面、照片和其他静态文件。如果您需要额外的存储空间，您将提交请求，托管服务提供商会扩展您的容量。\n\
  \n\n\n2006年，AWS 推出了其首批服务之一：Amazon Simple Storage Service，简称 S3。Amazon 将 S3 宣传为“高度可扩展、可靠且低延迟的数据存储基础设施，成本极低。”\
  \ 但这意味着什么？嗯，让我们分解几点，说明当时 S3 为何如此受追捧：\n\n- 与当时流行的托管服务提供商不同，用户可以根据实际使用量按需付费（前提是已存档信用卡）。这很像电费或公用事业账单。\n\
  - 用户可通过 Web API 存储文件，从而将其编程上传和下载集成到 Web 应用代码中（想想相册 Web 应用：超级强大！）。\n- 价格非常便宜！用户每月只需几美元即可存储数千个对象。\n\
  - 所有对象都写入三个不同的故障域，因此即使 AWS 数据中心发生服务器故障也能得到保障。\n\n现在，世界上一些最受欢迎的应用都在使用 S3。Dropbox\
  \ 是一个使用 S3 存储用户文件的前端，而 Pinterest 和 Tumblr 使用 S3 来托管图像！\n\n2009 年 8 月，Rackspace 受\
  \ Amazon S3 启发，开始着手开发自己的对象存储服务 Cloud Files（至今仍可用）。该项目演变成我们所知的 OpenStack Swift，这是一个具有\
  \ RESTful API 的开源可扩展冗余存储系统。与 S3 类似，Swift 为用户提供一种使存储看起来无限的对象存储服务。它还提供许多很酷的额外功能，例如静态网站托管、对象版本控制、访问控制列表（ACL）和对象过期。\n\
  \n在幕后，OpenStack Swift 将对象写入数据中心服务器中分布的多个磁盘驱动器。Swift 的软件（像其他 OpenStack 服务一样用 Python\
  \ 编写）负责确保集群中数据的复制和完整性。如果服务器或硬盘发生故障，Swift 会从其他活动节点复制其内容到集群中的新位置。存储集群只需添加新服务器即可水平扩展。由于\
  \ OpenStack 使用软件逻辑确保数据在不同设备间的复制和分布，因此可以使用廉价的通用硬盘和服务器。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_270_0.png)\n\
  \n图 8.1：Swift 允许用户通过 RESTful API 上传和下载文件\n\n## Swift 架构\n\nSwift 由十四项主要守护进程组成，如图\
  \ 8.2 所示：\n\n- **swift-proxy-server**：Swift 的 API 和主要网关，负责将 Swift 架构的其余部分连接起来。必须与\
  \ swift-proxy-server 交互才能创建容器、向这些容器上传对象、设置 ACL 以及启用特殊功能，例如对象版本控制或启用静态网站。对于每个请求，它都会在环中查找账户、容器或对象的位置并相应地路由请求。\n\
  - **swift-object-server**：负责检索和删除存储在 Swift 集群本地驱动器上的对象。对象以文件系统上的二进制文件形式存储，元数据存储在文件的扩展属性（xattrs）中。这要求对象服务器所选的底层文件系统支持文件上的\
  \ xattrs。每个对象都使用基于对象名称哈希和操作时间戳派生的路径进行存储。\n- **swift-object-auditor**：遍历本地对象系统检查对象的完整性。如果发现损坏，文件将被隔离，复制将从另一个副本替换损坏的文件。\n\
  - **swift-object-expirer**：提供对象的计划删除。\n- **swift-object-reconstructor**：擦除编码对象的重建守护进程。\n\
  - **swift-object-replicator**：在网络中断或驱动器故障等临时错误条件下保持系统处于一致状态。复制过程比较本地数据与每个远程副本，以确保它们都包含最新版本。对象复制使用哈希列表快速比较每个分区的子部分。\n\
  - **swift-container-server**：处理特定容器内对象的列出。列表以 SQLite 数据库文件形式存储，并在集群中进行复制（类似于对象）。\n\
  - **swift-container-auditor**：遍历本地容器系统，检查 SQLite 数据库文件的完整性。如果发现损坏，文件将被隔离，复制将从另一个副本替换损坏的文件。\n\
  - **swift-container-replicator**：类似于 swift-object-replicator，只是针对容器 SQLite 数据库文件。\n\
  - **swift-container-updater**：更新账户数据库中的容器信息。它会遍历系统中的容器路径，查找容器 SQLite 文件，并在需要时向账户服务器发送更新。\n\
  - **swift-container-sync**：负责允许通过后台同步将一个容器的内容镜像到另一个容器。\n- **swift-account-server**：处理特定账户内容器的列出。列表以\
  \ sqlite 数据库文件形式存储，并在集群中进行复制（类似于对象）。\n- **swift-account-auditor**：与 swift-container-auditor\
  \ 相同，只是针对账户 sqlite 数据库文件。\n- **swift-account-replicator**：类似于 swift-container-replicator，只是针对账户\
  \ sqlite 数据库文件。\n- **swift-account-reaper**：删除已被 OpenStack 管理员标记为删除的账户。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_271_0.png)\n\
  \n图 8.2：Swift 架构的高级视图\n\n## Swift 概念\n\n- **Account**：Swift 使用术语“account”来指代 OpenStack\
  \ 项目。\n  记住：在 OpenStack 世界中，accounts、tenants 和 projects 含义相同！\n- **Container**：用于静态文件（也称为\
  \ **objects**）的“存储桶”。用户必须创建一个容器才能将对象上传到 Swift 账户。所有容器都由用户创建时所作用域的账户（或项目）拥有。默认情况下，容器中上传的所有对象都是私有的。\n\
  - **Objects**：对象是用户上传到容器中的文件。这些通常是静态文件，例如图片、电影、文档或日志。\n- **Object expiration**：可以设置对象在特定时间过期。一旦对象过期，它将无法再访问并从\
  \ Swift 集群中删除。对象过期的一个很好的用例是临时注册码或密钥，其有效期很短。\n- **ACL (access control list)**：默认情况下，Swift\
  \ 容器是私有的，其他用户或项目无法访问。默认情况下，具有 admin 或 swiftoperator 角色的用户可以在容器级别设置 ACL 并支持读取和写入访问列表。\n\
  - **Static website hosting**：而不是使用传统的 Web 服务器如 Apache 或 Nginx 来托管网站，Swift 可以托管静态网站文件，例如\
  \ HTML、CSS 和客户端 JavaScript。通过将容器的 web-index 头设置为容器的公共 URL，它将导航到指定的文件，例如 `index.html`。然后可以更新\
  \ DNS 以指向可公开访问的 Swift 容器的 URL。\n- **Object versioning**：版本控制允许用户上传特定文件的多个版本。用户只需创建一个用于存储版本的备用容器。当用户向\
  \ Swift 容器上传同名文件时，旧版本会被发布到备用容器。可以轻松检索并恢复到以前的版本。如果向对象发送 `DELETE` 请求，最新版本将被删除，并恢复之前的版本。\n\
  \n## 考试目标\n\n让我们看看 Swift 的考试目标。记住，Certified OpenStack Administrator 考试期望你从管理员的角度理解如何使用\
  \ OpenStack，而不是基础设施或 DevOps 工程师。你不需要过于关注后端 Swift 配置。这是一个复杂的话题，你可以在 Packt Publishing\
  \ 出版的《OpenStack Object Storage (Swift) Essentials》一书中了解更多。\n\n下图分解了你在 COA 考试中应负责了解的各种\
  \ Swift 相关目标。如你所见，其中只有一些任务可以在 Horizon 仪表板和 CLI 上完成。当涉及到 ACL 和对象过期时，你需要掌握本章中所示的 CLI\
  \ 命令。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_273_0.png)\n\n图 8.3：Swift ACL\
  \ 和对象过期只能通过 CLI 完成\n\n要在 Horizon 仪表板上向 Swift 上传对象，文件必须可通过本地文件系统访问。如果你想上传大于 5 GB\
  \ 的文件，必须使用 CLI。\n\n### 考试目标 - 管理容器和对象\n\n容器在 Amazon S3 世界中类似于存储桶。容器由项目拥有（在 Swift\
  \ 世界中也称为账户）。就权限而言，Swift 容器与传统的 OpenStack 资源略有不同。默认情况下，用户必须具有 admin 或 swiftoperator\
  \ 角色才能创建、删除和修改容器。我们将在下一节学习如何设置 ACL。\n\n\n\n## Horizon 仪表盘\n\n请参阅图 8.4。让我们在 Horizon\
  \ 仪表盘上创建一个新的容器。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_274_0.png)\n\n图 8.4：在\
  \ Horizon 仪表盘上创建 Swift 容器\n\n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到 **operations**\
  \ 项目。\n- 2. 从 **项目-对象存储** 面板组中选择 **容器** 面板。\n- 3. 选择 **容器**。\n- 4. 请参阅图 8.5。**容器名称（必填）**：为您的容器命名。输入\
  \ `container-dashboard`。\n- 5. **容器公开访问（必填）**：使此容器的内容对公众可访问。这意味着世界上的任何人都可以浏览容器内的任何对象（前提是\
  \ swift API 端点是公开可访问的）。让我们保持此项 **未选中**，从而使容器保持私有。默认情况下，私有容器的对象仅可供具有 **admin** 或\
  \ **swiftoperator** 角色的用户访问。我们将在下一节中了解更多关于 ACL 的内容。\n- 6. 选择 **创建**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_275_0.png)\n\
  \n图 8.5：在 Horizon 仪表盘上设置容器名称和访问权限\n\n创建容器后，我们现在将向其上传一个对象。\n\n在本地系统上创建一个名为 `object-dashboard.txt`\
  \ 的文本文件。在文本文件中，只需写入 `object-dashboard` 并保存文件。\n\n选择 `object-dashboard.txt` 文件并选择\
  \ **上传文件** 图标。如果文件成功上传，您应该会看到类似于图 8.6 的内容。图 8.7 显示了我们的对象在其容器、项目和域上下文中的可视化表示。\n\n\
  ![](img/da864e0670c65edf6f5ab861ef9906b3_275_1.png)\n\n如果您想上传大于 5 GB 的文件，必须使用 `python-swiftclient`。\n\
  \n如果我们想下载此文件，可以通过选择 **下载** 轻松完成：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_276_0.png)\n\
  \n图 8.6：Horizon 仪表盘上包含一个对象的私有 Swift 容器\n\n小心！Swift 会自动覆盖您上传的任何文件名和文件扩展名完全相同的文件。我们可以通过启用对象版本控制来更改此行为。这超出了\
  \ COA 考试准备的范围，但您可以在 https://docs.openstack.org/swift 了解更多信息。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_276_1.png)\n\
  \n图 8.7：在项目和域上下文中位于容器内的 Swift 对象\n\n## CLI\n\n令人惊讶的是，python-openstackclient 目前没有设置容器\
  \ ACL 所需的功能，尽管这将在未来版本中提供。为了保持一致并简化操作，我将向您展示如何使用 python-swiftclient，它包含在 python-openstackclient\
  \ 中。请记住，提供的 openrc 文件包含以变量形式提供的凭据，用于正确地向 Keystone 进行身份验证并设置项目范围。在本章中，我们将在 operations\
  \ 项目中执行所有与 Swift 相关的任务。让我们将原始的 openrc 文件复制到一个名为 openrc-operations 的新文件中：\n\n```\n\
  $ cp openrc openrc-operations\n```\n\n现在我们已经制作了副本，让我们编辑 openrc-operations 文件并更新项目和租户名称变量，以反映我们希望限定到\
  \ logistics 项目的范围。如果您更习惯使用其他编辑器，请在此处随意使用。\n\n```\n$ nano openrc-operations\n```\n\
  \n将以下变量更改为 operations：\n\n```\nexport OS_PROJECT_NAME=operations\nexport OS_TENANT_NAME=operations\n\
  ```\n\n我们更改 OS_TENANT_NAME 变量，因为某些较旧的基于服务的客户端可能依赖于它。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_277_0.png)\n\
  \n导入新创建的 openrc-operations 文件：\n\n```\n$ source openrc-operations\n```\n\n验证是否已正确设置变量：\n\
  \n```\n$ export | grep OS\n```\n\n现在我们可以继续列出 operations 项目拥有的容器：\n\n```\n$ swift\
  \ list\n```\n\n我们应该会看到 container-dashboard 容器。如果我们想列出此容器内的所有对象，可以运行以下命令：\n\n```\n\
  $ swift list container-dashboard\n```\n\n我们应该会看到上一个练习中的 object-dashboard.txt 文件。要将文件下载到当前工作目录，可以运行以下命令：\n\
  \n```\n$ swift download container-dashboard object-dashboard.txt\n```\n\n现在让我们创建一个新的容器：\n\
  \n```\n$ swift post container-cli\n```\n\n创建一个名为 object-cli.txt 的新对象：\n\n```\n$\
  \ touch object-cli.txt\n```\n\n让我们在文件中添加文件名：\n\n```\n$ echo \"object-cli\" > object-cli.txt\n\
  ```\n\n现在我们可以将对象上传到容器：\n\n```\n$ swift upload container-cli object-cli.txt\n```\n\
  \n我们可以通过运行以下命令来确认容器和文件是否已成功上传：\n\n```\n$ swift list container-cli\n```\n\n让我们创建并上传另一个对象：\n\
  \n```\n$ touch object-deleteme.txt\n```\n\n让我们将此文件上传到我们的容器：\n\n```\n$ swift upload\
  \ container-cli object-deleteme.txt\n```\n\n确认文件是否已成功上传：\n\n```\n$ swift list container-cli\n\
  ```\n\n现在让我们删除此文件：\n\n```\n$ swift delete container-cli object-deleteme.txt\n```\n\
  \n创建容器、向这些容器上传对象以及删除对象就是这么简单！非常容易！\n\n## 考试目标：管理容器 ACL\n\n请记住，默认情况下，容器的内容只能由具有 admin\
  \ 或 swiftoperator 角色的人访问。如果某人拥有其中任一角色，他们就有权限设置 ACL。ACL 在容器级别工作，并适用于容器内的所有对象。\n\n\
  - Read ACL 控制谁可以读取/下载容器内的文件。您还可以将读取/下载访问权限限制为特定项目内的所有用户或一个特定用户。\n- Write ACL 允许您为容器设置上传权限。例如，您可能希望允许特定用户或项目内的所有用户向容器上传文件。您甚至可以将容器设置为匿名写入，从而允许任何人，无论项目如何，都可以向容器上传对象。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_279_0.png)\n\n只能使用原始 API 或通过 python-swiftclient\
  \ 设置 ACL。唯一可以通过 Horizon 仪表盘设置的 ACL 是通过图 8.6 中的 Public 复选框允许匿名访问容器。\n\n## CLI\n\n\
  ![](img/da864e0670c65edf6f5ab861ef9906b3_279_1.png)\n\n小心！python-swiftclient 帮助（swift\
  \ post --help）关于 ACL 语法的信息不正确！错误修复已经提交，但在考试期间不要依赖它！请确保遵循此处或官方社区文档 https://docs.openstack.org/ocata/\
  \ 中的 ACL 语法！\n\n让我们导入我们的 openrc-operations 文件：\n\n```\n$ source openrc-operations\n\
  ```\n\n验证是否已正确设置变量并且您已限定到 operations 项目：\n\n```\n$ export | grep OS\n```\n\n让我们首先列出我们当前的容器。我们应该能够看到我们在上一节中创建的\
  \ container-cli 容器：\n\n```\n$ swift list\n```\n\n要查看此容器的 ACL，请运行以下命令：\n\n```\n$\
  \ swift stat container-cli\n```\n\n我们应该会看到类似于图 8.8 的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_280_0.png)\n\
  \n图 8.8：'swift stat' 命令的输出显示容器上未设置读取或写入 ACL\n\n如您所见，Read ACL 和 Write ACL 为空。这意味着容器当前为私有，仅可供具有\
  \ admin 或 swiftoperator 角色的人访问。\n\n让我们开始使容器公开可访问，以便互联网上的任何人都可以从中下载文件。让我们分解 Read\
  \ ACL 的语法。\n\n看看以下语法：\n\n```\n$ swift post container-cli --read-acl \".r:*,.r:listings\"\
  \n```\n\n.r 指的是 referrer 头。referrer 头是链接到所请求资源的网页的地址。换句话说，如果有人在 https://www.openstack.org/\
  \ 上链接到此容器中的对象，则向 Swift 请求该对象的请求将包含 referrer 头中的 openstack.org。通配符星号 (*) 表示 referrer\
  \ 头可以包含任何值，因此可以来自 Swift 链接可能发布的任何网站。语法中的 .r:listings 使容器能够列出容器中的所有对象。现在让我们运行此命令！\n\
  \n设置 ACL 时您不会得到任何确认输出，因此我们可以运行以下命令来验证 read ACL 是否已应用：\n\n```\n$ swift stat container-cli\n\
  ```\n\n我们应该会看到类似于图 8.9 的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_281_0.png)\n\
  \n图 8.9：设置公共读取 ACL 后 'swift stat' 命令的输出\n\n为了验证容器是否公开，我们需要从服务目录中获取公共 URL。\n\n运行以下命令：\n\
  \n```\n$ openstack catalog list\n```\n\n找到 Swift 公共端点并将其复制并粘贴到浏览器中。确保在末尾附加容器名称，使其看起来类似于这样：\n\
  \n```\nhttp://192.168.56.56:8080/v1/AUTH_c03401d3e99f4d4ea1aede321b7a61ff/container-cli\n\
  ```\n\n\n\n通过导航到此公共 Swift URL 并附加容器名称，您应该会看到容器中对象的列表。请参阅图 8.10。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_282_0.png)\n\
  \n图 8.10：通过 Web 浏览器查看 Swift 容器内的对象列表\n\n如果我们然后通过输入完整路径名直接导航到文件，http://192.168.56.56:8080/v1/AUTH_c03401d3e99f4d4ea1aede321b7a61ff/container-cli/object-cli.txt，我们应该会看到其内容。请参阅图\
  \ 8.11。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_282_1.png)\n\n图 8.11：通过 Web\
  \ 浏览器直接导航到对象\n\n图 8.12 是在启用了读取 ACL 的情况下公共用户访问我们容器内容的示意图：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_283_0.png)\n\
  \n图 8.12：如果 Swift 代理服务器（API）URL 在外部可访问，任何用户都应能够列出并获取具有公共读取 ACL 的容器的内容\n\n如果我们想将容器访问限制为位于特定项目中的\
  \ OpenStack 环境内的用户怎么办？\n\n我们可以使用以下语法：--read-acl <project-uuid:user-uuid>\n\n重要的是我们使用\
  \ UUID。在多域环境中，这是系统识别我们所引用的特定项目和用户的唯一方式。\n\n让我们只允许 accounting 项目中的 lisaw 读取/下载 container-cli\
  \ 容器中的文件。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_283_1.png)\n\n回顾第 3 章，我们可以通过运行\
  \ openstack user list 获取所有用户列表，并通过运行 openstack project list 获取所有项目。\n\n运行以下命令。您的\
  \ UUID 可能与此处显示的不同：\n\n```\n$ swift post container-cli --read-acl \\\n\"fe8787fda267442bbea280391e8500d6:2a0c974a13b042e9849a9366a2e5b589\"\
  \n```\n\n然后我们可以通过运行以下命令来验证 ACL 是否已正确设置：\n\n```\n$ swift stat container-cli\n```\n\
  \n如果我们想允许 accounting 项目中的多个特定用户，我们可以使用逗号分隔它们，如 --read-acl <project_id>:user1,id,user2,id,\n\
  \n要允许 accounting 项目中的所有用户，我们可以使用通配符：--read-acl <project_id>:*.\n\n要设置写入 ACL，我们使用\
  \ --write-acl 标志。\n\n让我们添加一个写入 ACL，允许 accounting 项目内的任何用户向容器写入对象：\n\n```\n$ swift\
  \ post container-cli --write-acl \"fe8787fda267442bbea280391e8500d6:*\"\n```\n\n\
  验证写入 ACL 是否已正确设置：\n\n```\n$ swift stat container-cli\n```\n\n您应该会看到与图 8.13 类似的输出：\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_284_0.png)\n\n图 8.13 Swift 容器上的读取和写入\
  \ ACL\n\n## 考试目标：设置对象过期\n\n可以通过设置 X-Delete-At 或 X-Delete-After 对象头来设置对象在特定时间过期。一旦对象过期，它将无法访问并最终从\
  \ Swift 集群中删除。\n\n要在特定时间使对象过期，时间和日期必须采用 Unix Epoch 格式。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_285_0.png)\n\
  \n要在系统上以 Unix Epoch 格式获取当前时间，可以运行 date +%s。\n\n### 命令行界面\n\n让我们将 object-cli.txt\
  \ 对象设置为在 2018 年 9 月 1 日星期六上午 9:09:14，GMT 删除。这将转换为 UNIX Epoch 格式的 1535792954。\n\n\
  ```\n$ swift post container-cli object-cli.txt -H \"X-Delete-At:1535792954\"\n```\n\
  \n我们可以通过运行以下命令来验证是否已设置过期：\n\n```\n$ swift stat container-cli object-cli.txt\n```\n\
  \n您应该会看到与图 8.14 类似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_285_1.png)\n\n\
  图 8.14：在 Unix Epoch 格式的特定日期和时间设置要过期的对象\n\n一旦达到指定日期，文件将被删除。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_286_0.png)\n\
  \n图 8.15：Swift 容器中对象在未来特定时间过期的可视化\n\n我们还可以设置对象在经过一定时间后删除。\n\n让我们使用 X-Delete-After\
  \ 头将对象设置为 60 秒后删除。这将覆盖之前的命令，并将过期时间设置为从系统当前时间/日期起 60 秒。\n\n```\n$ swift post container-cli\
  \ object-cli.txt -H \"X-Delete-After:60\"\n```\n\n验证是否已设置过期：\n\n```\n$ swift stat\
  \ container-cli object-cli.txt\n```\n\n60 秒后，您将无法再检查对象的状态，因为它将被删除。您将看到错误，表明对象不再可用。请参阅图\
  \ 8.16。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_286_1.png)\n\n图 8.16：对象过期并从集群中删除后，您将收到\
  \ 404 'Not Found'\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_287_0.png)\n\n您仍可能在运行\
  \ `swift list container-cli` 时看到已删除的对象。虽然对象肯定已从集群中删除，但 SQLite 数据库列表尚未更新。请耐心等待，它最终会从列表中删除！\n\
  \n如果您想删除过期头，可以通过使用空值的 `X-Remove-Delete-At` 头轻松完成。例如：\n\n```\n$ swift post container-cli\
  \ object-cli.txt -H \"X-Remove-Delete-At: \"\n```\n\n## 总结\n\n在本章中，我们回顾了 Swift 架构和诸如帐户、容器、对象之类的概念。重要的是要记住，大多数\
  \ Swift 功能在 Horizon 仪表板上未启用，必须直接通过 API 或通过 `python-swiftclient` 设置。不要忘记：容器默认是私有的，只能由具有\
  \ admin 或 swiftoperator 角色的用户管理。要授予公共或单个 OpenStack 用户访问容器的权限，必须设置读取和/或写入 ACL。\n\n\
  记住 ACL 语法绝对至关重要！一些较旧版本的 `python-swiftclient` 在帮助输出中报告了错误的信息！本章中描述的 ACL 语法并且工作正常。有关\
  \ Swift 的更多信息，请查看官方文档 https://docs.openstack.org/swift。\n"
- "# 9 Heat 编排服务\n\n## Heat 编排服务\n\n在上一章中，我们讨论了 Swift 对象存储服务以及 COA 考试中的所有 Swift 相关目标。现在我们将讨论\
  \ Heat。Heat 是 OpenStack 编排服务，其目标是帮助 OpenStack 用户建模、设置和自动化 OpenStack 资源的创建和管理。由于考试中\
  \ Heat 内容很少，本章将简明扼要。我们将涵盖以下主题：\n\n- 关于 Heat\n- Heat 架构\n- Heat 模板\n- 考试目标 - 管理堆栈\n\
  - 考试目标 - 更新堆栈\n\n在本章之后，您应该对 Heat 有扎实的理解，并具备成功完成考试中所有 Heat 相关目标所需的技能。\n\n### 关于 Heat\n\
  \n在第 1 章中，我们讨论了 OpenStack 用户可以使用 OpenStack 创建资源的各种方式。直到我们 COA 考试准备之旅的这一点，我们一直使用\
  \ Horizon 仪表板和 CLI。虽然使用它们很有趣，但使用它们部署 OpenStack 资源可能相当繁琐。事实上，在 2007 年至 2010 年间，Amazon\
  \ 用户主要依赖 AWS 控制台、CLI 或 SDK 为其应用程序配置虚拟资源。许多用户开始使用 CLI 创建 bash 脚本来自动化为其应用程序创建整个环境。\n\
  \n这在一段时间里效果很好，但如果用户不小心再次运行脚本、想要删除资源或只添加一个额外更改时，用户开始遇到问题。然后用户必须在 bash 脚本中构建逻辑以使其幂等，并添加额外的脚本来协助删除环境。这是一项大量工作。\n\
  \n然后在 2011 年 2 月，AWS CloudFormation 发布了！有了 CloudFormation，用户可以在 JSON 模板文件中描述其期望的\
  \ AWS 架构。然后他们可以启动此模板并部署其“堆栈”，同时 AWS 会在适当顺序下处理所有操作，并在创建过程中记录所有事件。在用户完成堆栈环境后，他们可以轻松地向其添加额外资源或通过删除它来销毁整个环境。\n\
  \nHeat 于 2013 年 4 月随 OpenStack Grizzly 版本引入。与 CloudFormation 类似，Heat 以蓝图或 Heat 编排模板开始，该模板描述了要配置的\
  \ OpenStack 资源。Heat 会处理配置和配置，无需担心依赖关系或执行顺序。\n\n您可以同样轻松地删除堆栈，这会删除与堆栈关联的所有资源。如果您想对堆栈进行更改，甚至可以通过提供带有新参数的修改模板轻松更新它。\n\
  \n### Heat 架构\n\nHeat 由三个守护进程组成：\n\n- **heat-api**：Heat 的 API 和主要网关。必须与 `heat-api`\
  \ 交互以创建、列出、删除和管理堆栈。\n- **heat-api-cfn**：这提供了一个 AWS 风格的查询 API，允许服务或人工用户利用类似 CloudFormation\
  \ 的功能，例如等待条件和触发自动缩放。\n- **heat-engine**：负责启动堆栈并管理模板中指定的所有资源。\n\n\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_290_0.png)\n\
  \nFigure 9.1: Heat 架构的高级视图\n\n## Heat 模板\n\nHeat 模板（heat orchestration templates\
  \ 或 HOT，简写）是 heat-api 可以消费的模板，用于在 OpenStack 环境中创建虚拟资源。它们描述了所有期望的资源及其相关参数。堆栈创建后，OpenStack\
  \ 资源即可运行。模板非常方便，因为它们允许你将它们提交到 GitHub 等版本控制系统中，以便轻松跟踪更改并与团队协作。如果部署 Heat 模板后出现问题，只需恢复到模板的先前版本即可。\n\
  \nFigure 9.2 拆解了 Heat 模板的结构。\n\n## Heat 模板结构\n\n```yaml\nheat_template_version:\
  \ 2013-05-23\ndescription: Test Stack\n\nparameters:\n  ServerName:\n    type: string\n\
  \    description: A name for the server\n  Image:\n    type: string\n    description:\
  \ Image ID used to boot the server\n  Flavor:\n    type: string\n    description:\
  \ Flavor of server\n  Net:\n    type: string\n    description: Network ID for the\
  \ server\n  Volume:\n    type: string\n    description: A volume ID to attach to\
  \ the server\n\nresources:\n  server1:\n    type: OS::Nova::Server\n    properties:\n\
  \      name: { get_param: ServerName }\n      image: { get_param: Image }\n    \
  \  flavor: { get_param: Flavor }\n      networks:\n        - network: { get_param:\
  \ Net }\n\n  volumeattach:\n    type: OS::Cinder::VolumeAttachment\n    properties:\n\
  \      volume_id: { get_param: Volume }\n      instance_uuid: { get_resource: server1\
  \ }\n\noutputs:\n  myinstance_ip:\n    description: IP address of the first instance\n\
  \    value: { get_attr: [server1, first_address] }\n```\n\n### 模板头\n\n- version（对应\
  \ OpenStack 版本）\n  - 2013-05-23 = Grizzly、Havana 和 Icehouse\n- description（可选）\n\
  \n### 参数\n\n- 指定任何输入参数（可选）\n\n### 资源\n\n- 你正在创建的 OpenStack 资源（必填）\n\n### 输出\n\n\
  - 堆栈创建后提供给用户的信息，即 IP 地址、URL、UUID、密码等。\n\nFigure 9.2: Heat 模板的结构\n\n1. **模板头：** 模板版本是必填项，描述是可选的。OpenStack\
  \ 的每个新版本都会发布额外的功能和能力。这意味着用户创建的新模板可能引用旧版本中不存在的功能，因此使模板与旧环境不兼容。以下是 Heat 模板版本及其兼容的\
  \ OpenStack 版本列表：\n\n| Heat 模板版本 | OpenStack 版本 |\n|---|---|\n| 2013-05-23 | Grizzly、Havana、Icehouse\
  \ 及更高版本 |\n| 2014-10-16 | Juno 及更高版本 |\n| 2015-04-30 | Kilo 及更高版本 |\n| 2015-10-15\
  \ | Liberty 及更高版本 |\n| 2016-04-08 | Mitaka 及更高版本 |\n| 2016-10-14 | Newton 及更高版本\
  \ |\n\n2. **参数：** 这些是可选的，可以是任何你希望用户能够插入的特定值。这些值在部署或“创建”堆栈时由用户传入。\n\n3. **资源：** 这些是必填项，表示你想要创建的任何\
  \ OpenStack 资源。\n\n4. **输出：** 堆栈创建后提供给用户的信息。这可以是 IP 地址到特殊注册代码或密码的任何内容。\n\n## Heat\
  \ 资源\n\n资源是必填项，是你想要创建的任何 OpenStack 资源的引用。OpenStack 资源可以是 Nova 虚拟机实例到 Neutron 安全组等任何内容。参见图\
  \ 9.3。你可以在 Horizon 仪表板上通过从 Project-Orchestration 面板组导航到 Resource Types 面板来获取兼容资源的完整列表。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_293_0.png)\n\nFigure 9.3: Horizon 仪表板上可用的\
  \ Heat 资源列表\n\n## 与 AWS 的向后兼容性\n\n你可能已经注意到一些 Heat 资源具有 AWS:: 前缀。这些资源用于使 CloudFormation\
  \ 模板与 OpenStack Heat 兼容。正如你所知，AWS 和 OpenStack 具有许多不同的功能，因此我不建议尝试使用为 AWS 环境设计的模板创建堆栈。你最好重构你的\
  \ CloudFormation 模板以使用 Heat 资源。但对于好奇的人，这里有一些 AWS Heat 资源及其作用：\n\n| AWS Heat 资源 |\
  \ 操作 |\n|---|---|\n| AWS::EC2::Instance | OS::Nova::Server（创建 Nova 实例） |\n| AWS::EC2::SecurityGroup\
  \ | OS::Neutron::SecurityGroup（创建 Neutron 安全组） |\n| AWS::EC2::VPC | OS::Neutron::Network（创建\
  \ Neutron 租户网络） |\n| AWS::EC2::Volume | OS::Cinder::Volume（创建 Cinder 卷） |\n| AWS::IAM::AccessKey\
  \ | OS::Nova::KeyPair（为指定用户生成公钥/私钥） |\n| AWS::S3::Bucket | 类似于 OS::Swift::Container（创建\
  \ Swift 容器） |\n\n## 考试目标\n\n让我们看看 Heat 考试目标。\n\nFigure 9.4 拆解了你在 COA 考试中应负责了解的各种与\
  \ Heat 相关的目标。如你所见，所有这些任务都可以在 Horizon 仪表板和 CLI 上完成。请记住考试期间时间至关重要，在许多情况下，在仪表板上处理任务会快得多。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_294_0.png)\n\nFigure 9.4: Heat 考试目标可以在\
  \ Horizon 仪表板或 CLI 上执行\n\n## 考试目标 - 管理堆栈\n\n当你创建 heat 模板时，你正在创建堆栈。堆栈归用户在创建时所作用域的项目所有。在\
  \ Horizon 仪表板和 CLI 上创建堆栈相当简单。我们先尝试仪表板。\n\n本章假设你已完成第 6 章中的考试目标练习。如果尚未完成第 6 章，*Neutron\
  \ 网络服务*，请返回并确保你已创建 **tenant-network1-dashboard** 和 **tenant-network1-cli**。用户必须具有\
  \ `heat_stack_owner` 角色才能管理堆栈。随附虚拟设备提供的管理员用户应已具有此角色。\n\n### Horizon 仪表板\n\n- 1.\
  \ 从 OpenStack 概览页面，通过选择顶部下拉菜单将作用域限定为 **logistics**。\n- 2. 从 **Project-Orchestration**\
  \ 面板组中选择 **Stacks** 面板。\n- 3. 选择 **Launch Stack**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_295_0.png)\n\
  \nFigure 9.5: 从 Horizon 仪表板启动堆栈\n\n4. 参见图 9.6。Template Resource（必填）：你可以指定希望提供将要使用的模板的方式。\n\
  \n- **File**：允许你选择本地文件系统上的模板。\n- **Direct Input**：将模板复制并粘贴到文本字段中。\n- **URL**：提供指向托管在网站或\
  \ GitHub 上的公开可访问模板的 URL。\n\n5. 粘贴以下模板。此模板使用我们指定的 flavor 和 image 创建一个全新的实例，将其连接到现有的租户网络，然后附加一个全新的\
  \ 1 GB 块卷。粘贴到 Horizon 仪表板时请注意间距。模板的副本可在虚拟设备和官方书籍 GitHub 仓库中找到。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_296_0.png)\n\
  \nYAML（YAML Ain't Markup Language）是 JSON 的超集，使人类设置值更容易。YAML 中不允许使用 Tab，因此务必始终使用空格。所有属性和列表必须缩进\
  \ 1 个或多个空格。如果模板让你感到困难，请在线查找示例 Heat 模板或在 http://yaml-online-parser.appspot.com/ 上使用在线\
  \ YAML 解析器进行尝试。\n\n```yaml\nheat_template_version: 2013-05-23\ndescription: Test\
  \ Stack\n\nparameters:\n  ServerName:\n    type: string\n    description: A name\
  \ for the server\n  Image:\n    type: string\n    description: Image ID used to\
  \ boot the server\n  Flavor:\n    type: string\n    description: Flavor of server\n\
  \  Net:\n    type: string\n    description: Network ID for the server\n  VolumeName:\n\
  \    type: string\n    description: A name for the volume\n\nresources:\n  server1:\n\
  \    type: OS::Nova::Server\n    properties:\n      name: { get_param: ServerName\
  \ }\n```\n\n```\nimage: { get_param: Image }\nflavor: { get_param: Flavor }\nnetworks:\n\
  \  - network: { get_param: Net }\nvolume1:\n  type: OS::Cinder::Volume\n  properties:\n\
  \    name: { get_param: VolumeName }\n    size: 1\n\nvolumeattach1:\n  type: OS::Cinder::VolumeAttachment\n\
  \  properties:\n    volume_id: { get_resource: volume1 }\n    instance_uuid: { get_resource:\
  \ server1 }\n```\n\n6. Environment Resource (optional): This allows you to specify\
  \ an environment file that fills in input parameters for the selected template.\
  \ We will ignore this for now.\n6. 环境资源 (可选)：这允许您指定一个环境文件，用于填充所选模板的输入参数。我们现在将忽略它。\n\
  \n7. Select Next.\n7. 选择下一步。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_297_0.png)\n\
  \nFigure 9.6: Providing a heat template for a stack on the Horizon dashboard\n图\
  \ 9.6：在 Horizon 控制面板上为堆栈提供热模板\n\n8. **Stack Name** (required): Name of the stack\
  \ to be created. Let's name this `stack-dashboard`.\n8. **堆栈名称** (必需)：要创建的堆栈的名称。我们将其命名为\
  \ `stack-dashboard`。\n\n9. **Creation Timeout** (required): Minutes to wait before\
  \ canceling the stack. This will automatically cancel the stack creation process\
  \ if the stack does not complete. Leave this as the default.\n9. **创建超时** (必需)：在取消堆栈前等待的分钟数。如果堆栈未完成，这将自动取消堆栈创建过程。将其保留为默认值。\n\
  \n10. **Rollback On Failure** (optional): If checked, this will undo the stack creation\
  \ process, cleaning up any created resources. We will leave this unchecked.\n10.\
  \ **失败时回滚** (可选)：如果选中，这将撤销堆栈创建过程，清理已创建的资源。我们将保持未选中状态。\n\n11. **Password for user\
  \ \"admin\"** (required): This is the password for the current user logged into\
  \ the dashboard, in our case, `admin`. We provide this for security purposes (although\
  \ it can be disabled in the Horizon dashboard with the `enable_user_pass` value\
  \ in the dashboard config file at `/etc/openstack-dashboard/local_settings.py`).\
  \ Enter `admin`.\n11. **用户 \"admin\" 的密码** (必需)：这是当前登录到控制面板的用户的密码，在我们的例子中是 `admin`。我们出于安全目的提供此密码（尽管可以在\
  \ Horizon 控制面板中通过仪表板配置文件 `/etc/openstack-dashboard/local_settings.py` 中的 `enable_user_pass`\
  \ 值禁用它）。输入 `admin`。\n\n12. **Flavor** (required): The input parameter specified\
  \ in our Heat template. The flavor we want to use for our instance. Let's use `m1.tiny`.\n\
  12. **规格** (必需)：我们在 Heat 模板中指定的输入参数。我们希望为实例使用的规格。让我们使用 `m1.tiny`。\n\n13. **Image**\
  \ (required): The input parameter specified in our Heat template. The image we want\
  \ to use for our instance. Let's use `cirros`.\n13. **镜像** (必需)：我们在 Heat 模板中指定的输入参数。我们希望为实例使用的镜像。让我们使用\
  \ `cirros`。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_298_0.png)\n\n> When providing\
  \ parameters of existing OpenStack resources to Heat, it's sometimes safer to provide\
  \ their specific UUIDs rather than the names. This helps in avoiding conflicts when\
  \ you may have multiple resources with the same name.\n> 当向 Heat 提供现有 OpenStack\
  \ 资源的输入参数时，有时提供其特定的 UUID 而不是名称会更安全。这有助于避免在您可能有多个同名资源时发生冲突。\n\n14. **Net** (required):\
  \ The input parameter specified in our Heat template that refers to the network\
  \ we want our instance to attach to. Let's use `tenant1-dashboard`.\n14. **网络**\
  \ (必需)：我们在 Heat 模板中指定的输入参数，指的是我们希望实例连接到的网络。让我们使用 `tenant1-dashboard`。\n\n15. **ServerName**\
  \ (required): The input parameter specified in our Heat template. The name we want\
  \ for our server.\n15. **服务器名称** (必需)：我们在 Heat 模板中指定的输入参数。我们希望服务器的名称。\n\n16. **VolumeName**\
  \ (required): The input parameter specified in our Heat template. The name of the\
  \ volume we want our stack to create and attach to the instance.\n16. **卷名称** (必需)：我们在\
  \ Heat 模板中指定的输入参数。我们希望堆栈创建并附加到实例的卷的名称。\n\n17. Select Launch.\n17. 选择启动。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_299_0.png)\n\
  \nFigure 9.7: Providing parameters for a stack on the Horizon dashboard\n图 9.7：在\
  \ Horizon 控制面板上为堆栈提供参数\n\nYour stack status should be in Create in Progress. Be\
  \ patient, it may take a few minutes to complete. Once complete, you will see the\
  \ status change to Create Complete. Take a look at Figure 9.8 for the finished product.\n\
  您的堆栈状态应为创建进行中。请耐心等待，完成可能需要几分钟。一旦完成，您将看到状态更改为创建完成。请参阅图 9.8 查看最终产品。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_300_0.png)\n\
  \nFigure 9.8: Once completed, the stack status should show 'create complete'\n图\
  \ 9.8：完成后，堆栈状态应显示“create complete”\n\nWe should now be able to see our newly created\
  \ virtual machine and attached volume.\n我们现在应该能够看到我们新创建的虚拟机和附加的卷。\n\n## CLI\n##\
  \ 命令行界面\n\nRemember that in Chapter 6, we created the openrc-logistics file. We\
  \ are going to use that file here. If you skipped Chapter 6, feel free to flip back\
  \ to see how we created a new credential file that allowed us to scope to the logistics\
  \ project.\n请记住，在第 6 章中，我们创建了 openrc-logistics 文件。我们将在此处使用该文件。如果您跳过了第 6 章，请随意翻回去查看我们如何创建新的凭证文件以允许我们限定到\
  \ logistics 项目。\n\nSource the openrc-logistics file:\n为 openrc-logistics 文件设置来源：\n\
  \n```\n$ source openrc-logistics\n```\n\nVerify that the proper variables are set\
  \ and we are scoped to logistics:\n验证是否已设置正确的变量并且我们已限定到 logistics：\n\n```\n$ export\
  \ | grep OS\n```\n\nNow that we are properly scoped, let's begin by listing any\
  \ current stacks in the logistics project. We should have one stack from the previous\
  \ Horizon dashboard exercise:\n现在我们已正确限定范围，让我们先列出 logistics 项目中的任何当前堆栈。我们应该有一个来自之前\
  \ Horizon 控制面板练习的堆栈：\n\n```\n$ openstack stack list\n```\n\nYou should see output\
  \ similar to Figure 9.9:\n您应该会看到与图 9.9 类似的输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_301_0.png)\n\
  \nFigure 9.9: Output from the 'openstack stack list' command\n图 9.9：'openstack stack\
  \ list' 命令的输出\n\nLet's create a file called test-stack.yaml using the Heat template\
  \ from the previous section. If you are using the virtual appliance, you may already\
  \ see the test-stack.yaml residing in the /home/openstack directory.\n让我们使用上一节的\
  \ Heat 模板创建一个名为 test-stack.yaml 的文件。如果您使用的是虚拟设备，您可能已经看到 test-stack.yaml 位于 /home/openstack\
  \ 目录中。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_301_1.png)\n\nTo find the UUIDs\
  \ of the resources, use the openstack image list and openstack network list --long\
  \ commands.\n要查找资源的 UUID，请使用 openstack image list 和 openstack network list --long\
  \ 命令。\n\n```\n$ openstack stack create -t test-stack.yaml --parameter Flavor=m1.tiny\
  \ --parameter Image=<image-uuid> --parameter Net=<network-uuid> --parameter ServerName=stackserver-cli\
  \ --parameter VolumeName=stackvolume-cli stack-cli\n```\n\nYou should see output\
  \ similar to Figure 9.10.\n您应该会看到与图 9.10 类似的输出。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_301_2.png)\n\
  \nFigure 9.10: Output from the 'openstack stack create' command\n图 9.10：'openstack\
  \ stack create' 命令的输出\n\nRun the openstack stack list command to check the status\
  \ of the stack:\n运行 openstack stack list 命令以检查堆栈的状态：\n\n```\n$ openstack stack list\n\
  ```\n\nIf your stack status changes to `CREATE_FAILED`, use the `openstack stack\
  \ show` command on the stack to see the specific error. If it's due to `No Valid\
  \ Host`, ensure that there are no other instances running outside the **logistics**\
  \ project. If all else fails, reboot the virtual appliance, delete the stack using\
  \ the `openstack stack delete` command, and retry creating the stack.\n如果您的堆栈状态更改为\
  \ `CREATE_FAILED`，请在堆栈上使用 `openstack stack show` 命令查看具体错误。如果是由于 `No Valid Host`\
  \ 引起，请确保 **logistics** 项目之外没有运行的其他实例。如果其他方法都失败，请重新启动虚拟设备，使用 `openstack stack delete`\
  \ 命令删除堆栈，然后重试创建堆栈。\n\n## Exam objective - updating stacks\n## 考试目标 - 更新堆栈\n\nAfter\
  \ creating a stack, you may want to modify an aspect of it, including adding, removing,\
  \ or modifying a resource. This can be easily done via the dashboard or CLI. Note\
  \ that doing this on the dashboard is a bit of a hassle as we need to provide all\
  \ original parameters.\n创建堆栈后，您可能想要修改其某个方面，包括添加、删除或修改资源。这可以通过控制面板或 CLI 轻松完成。请注意，在控制面板上执行此操作有点麻烦，因为我们需要提供所有原始参数。\n\
  \n## Horizon dashboard\n## Horizon 控制面板\n\n- 1. From the OpenStack overview page,\
  \ scope yourself to the **logistics** by selecting the top dropdown.\n- 2. Select\
  \ the **Stacks** panel from the **Project-Orchestration** panel group.\n- 3. See\
  \ Figure 9.11. Select the dropdown next to **stack-dashboard** and select **Change\
  \ Stack Template**.\n- 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到 **logistics**。\n- 2.\
  \ 从 **Project-Orchestration** 面板组中选择 **Stacks** 面板。\n- 3. 请参阅图 9.11。选择 **stack-dashboard**\
  \ 旁边的下拉菜单并选择 **Change Stack Template**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_302_0.png)\n\
  \nFigure 9.11: Updating a stack on the Horizon dashboard\n图 9.11：在 Horizon 控制面板上更新堆栈\n\
  \nSee Figure 9.12. Follow the exact same instructions shown in the previous Horizon\
