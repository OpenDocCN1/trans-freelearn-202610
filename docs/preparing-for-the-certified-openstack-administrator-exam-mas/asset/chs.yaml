  ## 摘要


  OpenStack 是一个开源云软件，提供基础设施即服务环境，使用户能够通过创建虚拟服务器、网络和块存储卷等虚拟资源快速部署应用程序。IT 行业对具备 OpenStack
  技能人员的需求持续增长，而证明你拥有这些技能的最佳方式之一就是参加 Certified OpenStack Administrator 考试。


  在下一章中，我们将导入基于 OpenStack Newton 版本的 All-in-One 虚拟设备。该设备是一个不可思议的学习辅助工具，使我们能够随时随地与
  OpenStack 交互，同时完成本书中解释的所有考试目标。准备好成为一名正式的 Certified OpenStack Administrator 吧！

