  \ 仪表板概览屏幕\n\nTIP 在生产 OpenStack 云中，您将通过 HTTPS（SSL/TLS）连接到 Horizon 仪表板和 API 端点。\n\n\
  ## 摘要\n\n您现在应该拥有自己完全部署并在笔记本电脑或台式机上运行的工作 OpenStack 环境！本章讨论了 VirtualBox 以及 OVA 格式的便利性，以及构成传统\
  \ OpenStack 环境的组件。\n\n到目前为止，您应该能够通过系统上的 Horizon 仪表板和终端客户端连接到虚拟设备。您当然可以自由使用自己的 OpenStack\
  \ 环境，但本书中的练习和模拟考试将需要先前在提供的虚拟设备中创建的资源。\n\n在下一章中，我们将讨论 Keystone 标识服务，并通过 CLI 和 Horizon\
  \ 仪表板完成所有 Keystone 考试目标。让我们开始吧！\n"
- "# 3 Keystone 标识服务\n\n## Keystone 标识服务\n\n让我们通过讨论 Keystone、OpenStack 标识服务，来开始准备\
  \ Certified OpenStack Administrator 考试目标。理解 Keystone 是通过 COA 考试的主要构建块之一。\n\n在本章中，我们将涵盖以下主题：\n\
  \n- 身份验证和授权？\n- Keystone 架构\n- Keystone 概念\n- 身份验证实践\n- Horizon 仪表板和 CLI 上的项目范围\n\
  - 考试目标 - 管理配额\n- 考试目标 - 管理用户、角色、组、项目和域\n- 考试目标 - 管理服务目录 - 服务和端点\n\n完成本章后，您应该对 Keystone\
  \ 有扎实的理解，并具备成功完成考试中所有与 Keystone 相关的目标所需的技能。\n\n## 关于 Keystone\n\n所有用户和服务都依赖 Keystone。没有\
  \ Keystone，用户将无法正确进行身份验证并创建虚拟机、网络和其他资源。OpenStack 服务将无法正确进行身份验证以成功履行用户请求，或向其他 OpenStack\
  \ 服务发出请求。\n\n## 身份验证或授权？\n\n在开始深入 Keystone 的细节之前，让我们花点时间思考 **身份验证** 和 **授权** 的概念。这两个词有时会被误用，因此让我们提供一个正确的定义。\n\
  \n**身份验证** 是确认特定用户身份的行为——换句话说，证明用户就是其声称的那个人。\n\n**授权** 是确定该特定用户的访问权限的功能。\n\nKeystone\
  \ 有多种功能，但首先也是最重要的是，它提供 **身份验证**。所有 OpenStack 用户都必须通过 **Horizon 仪表板**、**命令行界面 (CLI)**、SDK\
  \ 或直接通过 **API** 对 Keystone 进行身份验证。\n\n一旦用户通过身份验证，Keystone 就不再参与确定用户的访问权限。访问权限包括诸如用户是否可以创建\
  \ Neutron 虚拟路由器或创建可公开访问的 Glance 镜像等事项。此 **授权** 由名为 `policy.json` 的文件处理，该文件位于每个已安装\
  \ OpenStack 服务的配置目录中。考试不要求您了解如何通过此文件修改授权，但在继续之前理解身份验证和授权之间的区别是基础。\n\n## Keystone\
  \ 架构\n\n让我们简要了解一下 Keystone 架构。Keystone 是整个云的通用身份验证系统，接收的请求比任何其他 OpenStack 服务都多。自\
  \ OpenStack Liberty 版本以来，Keystone 开发团队改用 Apache 作为 Keystone 的 API 前端。见图 3.1。Apache\
  \ 守护进程绑定到端口 5000，是通往 Keystone 的主要网关。所有用户和服务都依赖 Keystone 进行身份验证。OpenStack 环境的关系数据库管理系统（通常是\
  \ MariaDB，MySQL 的分支）包含一个 Keystone 数据库，用于存储所有各种 Keystone 资源的数据。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_80_0.png)\n\
  \n图 3.1：Keystone 是中央 OpenStack 身份验证服务，并使用 Apache Web 服务器作为其前端 Web 服务器。所有用户和 OpenStack\
  \ 服务都必须对 Keystone 进行身份验证\n\n## Keystone 概念\n\n让我们看一些常见的 Keystone 术语。如果您对这些概念的介绍感到有点困惑，不用担心。随着我们完成特定的考试目标并在实验室环境中执行任务，我们将更详细地介绍它们。\n\
  \n- **域：** 域是用于用户、组和项目的高级逻辑容器。考虑一家新 IT 公司想要创建一个 OpenStack 公有云。如果这家公司真的想在 IT 世界产生影响，他们需要托管和支持多个客户为自己的\
  \ OpenStack 账户注册。该公司很可能会将每个新客户放在自己的域中。与 Amazon Web Services 或 Google Cloud Platform\
  \ 等流行的公有云类似，每个客户都会创建与同一环境中其他客户隔离的资源。客户不仅能够创建自己的虚拟资源，例如虚拟机或网络，还能在该域内创建自己的用户、项目和组。\n\
  \nOpenStack 中的几乎每个资源或对象都会获得一个 **通用唯一标识符 (UUID)**。尽管我们可以为这些资源分配人类可读的名称，但 UUID 用于在日志、数据库和\
  \ OpenStack 基础设施的其他区域中唯一标识资源和对象。\n\n- **项目：** 项目代表资源被创建的区域。考虑我们之前提到的运行 OpenStack\
  \ 公有云的公司。他们为每个客户设置自己的域，并在该域内允许客户创建多个 **项目**。见图 3.2。这些项目很可能代表各种业务单元，以便他们可以轻松隔离资源。存在于其他项目中的用户将无法看到您项目中创建的资源，除非明确共享。会计、财务或人力资源是现实世界\
  \ OpenStack 项目中可能的项目的例子。用户当然可以属于一个或多个项目，但他们一次只能对一个项目进行身份验证。自己对单个项目进行身份验证的概念称为 **scope**。经过身份验证的用户创建的任何资源始终归用户当前作用域的项目所有。有一些例外，但我们将在本书后面讨论它们。\n\
  \n如果您听到 OpenStack 世界中的人使用 **tenant** 这个词，不要感到困惑。在 OpenStack 的早期版本中，“tenant”用于描述我们现在所知的项目。您甚至可能会听到有人将项目称为账户！**项目、租户和账户**\
  \ 在 OpenStack 世界中含义相同。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_81_0.png)\n\n\
  图 3.2：域是用于用户、组和项目的高级逻辑容器。项目存在于域内，并代表虚拟资源被创建的区域\n\n\n\n-   **用户：** 用户是为组织中的个人创建的账户。用户通常驻留在\
  \ Keystone 数据库中，但也可能存在于 Active Directory 或 LDAP 服务器中。每个域可以包含任意数量的用户；由于每个资源都被分配了一个\
  \ UUID，存在于不同域中的两个用户账户可以具有完全相同的名称。需要记住的另一点是，你总会在 Keystone 内部看到并非人类用户的用户账户！还记得我们看到\
  \ Keystone 为整个 OpenStack 云提供了一个通用的身份验证系统吗？那么，不仅用户会针对 Keystone 进行身份验证，像 Glance、Neutron\
  \ 和 Nova 这样的 OpenStack 服务也会进行身份验证。在任何 OpenStack 云中几乎总会有一个名为 **service** 的项目。service\
  \ 项目将始终包含该特定 OpenStack 环境中安装的每个 OpenStack 服务（Glance、Neutron 等）的用户账户。当一个服务想要与另一个服务通信时，它必须通过驻留在\
  \ **service** 项目中的用户账户进行身份验证。Keystone 是你不会在 service 项目中看到的唯一用户账户，因为 Keystone 不需要对自身进行身份验证。\n\
  \n-   **角色：** 角色是直接应用于用户或组的标签。还记得我们讨论过 Keystone 与授权无关吗？角色只是一个与项目上的用户关联的标签。名为 `policy.json`\
  \ 的文件通过确定具有特定角色的用户可以或不可以做什么来处理授权。参见图 3.3。当用户 lisad 对 Keystone 进行身份验证并限定到 **Trade**\
  \ 项目时，她拥有 `_member_` 角色。如果 Lisa 想启动一台虚拟机，则在 **nova** 配置目录中找到的 `policy.json` 文件（`/etc/nova/policy.json`）将定义\
  \ `_member_` 角色是否可以启动实例（未经修改，具有 `_member_` 的用户应该能够启动实例）。我们还看到用户 frankd 在 **Legal**\
  \ 项目上拥有 **read-only** 角色。如果 Frank 进行身份验证并限定到 Legal 项目，他可能想要创建一个 Neutron 网络，但不幸的是他无法这样做，因为\
  \ Neutron 的 `policy.json` 文件明确声明 read-only 角色只能列出网络。作为 OpenStack 管理员，你可能需要通过 `policy.json`\
  \ 文件来定义这些角色，但你的客户永远不会。客户只能查看哪些角色存在并将它们应用于项目上的用户。\n\n不要过于沉迷于编辑 `policy.json` 等配置文件。在当前官方\
  \ COA 目标要求中，没有关于配置文件修改的考试目标。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_83_0.png)\n\
  \n图 3.3：角色是直接应用于特定项目上的用户或组的标签。当用户限定到一个项目时，他们会获得其关联的角色\n\n-   **组：** 组是 Keystone\
  \ 的一个较新概念，提供了一种将现有角色轻松应用于多个用户的方式。它们是可选的，创建目的是消除一次只为一个用户应用角色的麻烦。参见图 3.4。用户 frankd\
  \ 是 **Legal** 项目上 **Interns** 组的成员。因为 **read-only** 角色已分配给 **Legal** 项目上的 **Interns**\
  \ 组，所以当 Frank 进行身份验证并限定到 **Legal** 项目时，他会自动获得 **read-only** 角色。用户 lisad 是 **Operators**\
  \ 组的成员。Lisa 在她进行身份验证并限定到 Trade 项目时将获得 _member_ 角色。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_84_0.png)\n\
  \n图 3.4：组是用户的可选容器。它们是同时将现有角色应用于多个用户的简便方式\n\n-   **配额：** 配额决定了可在特定项目内创建的资源的数量或大小。它们充当护栏，防止用户超出容量。虽然每个\
  \ OpenStack 服务都会跟踪这些资源的使用情况，但调整配额可以在 Horizon 仪表板的 Keystone 面板中轻松完成（将在本章后面展示）。\n\n\
  -   **服务目录/端点：** 服务目录是存储在 Keystone 中的映射，其中包含服务和端点的列表。我喜欢把服务目录想象成 OpenStack 的电话簿。它为环境中安装的所有服务提供\
  \ API 端点的列表。目录中每个服务都提供了三个 URL：public、internal 和 admin；当我们讨论 Keystone 考试目标时，我们将更深入地讨论这个问题。\n\
  \n## 虚拟设备中的 Keystone\n\n图 3.5 显示了本书提供的 COA 虚拟设备中的 Keystone 布局。如你所见，存在两个域：**Default**\
  \ 和 **Heat**。当最初设置 OpenStack 环境时，默认域就是默认域！在我们的实验室环境中，我们将使用的各种项目都位于默认域内。\n\n注意我们云中的用户拥有\
  \ _member_ 角色。虽然该角色并未在每个相应服务的 `policy.json` 文件中明确定义，但它只是赋予用户普通操作员权限的一种方式。拥有此角色的用户可以创建、读取、更新和删除资源，只要他们拥有该资源。注意\
  \ admin 用户被分配了 admin 角色并可以访问域中的所有项目。admin 角色在所有 `policy.json` 文件中都被定义为对所有域中的所有项目具有完全管理员访问权限。我知道这看起来有点不安全，但请记住，我们永远不会在每个域中都有客户的环境中将\
  \ admin 角色授予客户。为了解决这个问题，OpenStack 管理员会创建 **domain_admin** 角色。这超出了 COA 准备的范围，但有关此问题的更多信息，请访问\
  \ https://wiki.openstack.org/wiki/Horizon/DomainWorkFlow。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_86_0.png)\n\
  \n图 3.5：本书中包含的虚拟设备的 Keystone 布局\n\n**heat_stack_owner** 角色是任何想要管理 Heat 堆栈的用户所必需的。你将在第\
  \ 9 章 *Heat Orchestration Service* 中了解更多关于 Heat 的信息。\n\n## 身份验证实战\n\n现在你的 OpenStack\
  \ 环境已经运行起来，打开你的网络浏览器并导航到 https://192.168.56.101/horizon 上的 Horizon 仪表板。登录屏幕是你提交由\
  \ OpenStack 管理员提供的用户名和密码的地方。OpenStack 管理员需要配置此账户，以及密码、电子邮件地址和一些其他选项。\n\n你可以使用以下凭据登录提供的环境：\n\
  \nUser Name: `admin`\n\nPassword: `admin`\n\n恭喜！你已由 Keystone 正确身份验证，并获得了访问 Horizon\
  \ 仪表板概览屏幕的权限。图 3.6 显示了点击 Connect 按钮如何自动发送包含你的域、用户名和密码的 API 请求到 Keystone API 端点。连接后，你将自动限定到你所属的项目。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_87_0.png)\n\n图 3.6：通过登录 Horizon 仪表板与\
  \ Keystone 交互\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_87_1.png)\n\n你可能已经注意到登录屏幕没有输入域名的字段。这是因为在\
  \ Horizon 仪表板中多域功能已关闭。如果你是高级用户并希望更改此设置，请前往 `/etc/openstack-dashboard/local_settings.py`\
  \ 并将 `OPENSTACK_KEYSTONE_MULTIDOMAIN_SUPPORT` 设置为 True。确保通过运行 `sudo systemctl restart\
  \ apache2` 重启 Apache。\n\n## 通过仪表板进行项目范围限定\n\n现在你已经登录，找到屏幕顶部的 Project 下拉菜单。你会注意到有各种项目：accounting、logistics、marketing、operations、trade\
  \ 等等。这些项目代表我们域中的不同业务领域，也是资源被创建的区域。如你所见，你登录的 admin 用户属于多个项目。参见图 3.7。通过选择特定项目，用户将自己限定到该项目。一旦用户限定到项目，用户创建的任何资源（实例、卷、网络、路由器等）都将由该项目拥有。此规则有一些例外，但我们稍后会讨论。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_88_0.png)\n\n\n\n## 管理员生活\n\n我们虚拟设备环境中的管理员用户在环境中的每个项目上都具有管理员角色。由于我们使用具有管理员角色的用户登录，Horizon\
  \ 仪表板除了项目面板组外，还会显示一个管理面板组。没有管理员角色的用户将看不到管理面板组。参见图 3.8。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_89_0.png)\n\
  \nFigure 3.8: 默认情况下，只有具有管理员角色的用户才会看到 Horizon 仪表板管理面板组\n\n管理面板组将允许已登录用户查看所有域中所有项目创建的所有资源。在执行考试目标时，务必不要忘记这一点。一些考试目标可能需要访问管理面板，我们将在后续章节中探讨这一点。\n\
  \n## 身份面板\n\n身份面板会向所有用户展示，无论其角色如何。具有管理员角色的用户将拥有更多可见选项，包括在默认域内创建额外项目以及创建新用户、组和角色的能力。\n\
  \n选择“项目”会显示环境中所有域中的所有用户。\n\n需要注意的是，在此环境中关闭了多域功能，您将无法创建新域或向默认域以外的任何域添加新资源。这正是 OpenStack\
  \ CLI 灵活性发挥作用的地方。\n\n## Keystone 与 OpenStack CLI\n\n95% 的 COA 目标可以通过 Horizon 仪表板完成，但仍有一些任务需要使用\
  \ CLI。\n\n让我们开始 CLI 工作。打开您的终端客户端并通过 SSH 连接到您的虚拟设备（有关如何执行此操作的说明，请参阅第 2 章《设置您的练习考试环境》）。\n\
  \n请记住，OpenStack 用户需要向其 OpenStack 管理员（就是您！）索取初始身份验证信息才能开始使用 OpenStack 和 CLI。那么用户为了向\
  \ OpenStack 进行身份验证所需的最少信息是什么？\n\n- **Keystone 身份验证端点：** Keystone API 守护进程的 URL 位置。在生产\
  \ OpenStack 环境中，它通常是可解析的名称，如 `https://mycloud.example.com:5000/v3`，或外部 IP 地址。\n\
  - **域：** 您的用户所在的域。\n- **项目：** 您想要作用域到的项目。\n- **用户名：** 您的 Keystone 用户名。\n- **密码：**\
  \ 您的 Keystone 密码。\n\n用户可以通过 CLI 向 OpenStack 提供身份验证信息主要有两种方式：\n\n- 1. CLI 参数\n- 2.\
  \ Bash 变量\n\n这是一个管理员用户使用 python-openstackclient 并通过 CLI 参数获取环境中所有用户列表的示例：\n\n```\n\
  $ openstack --os-auth-url http://192.168.56.56:5000/v3 --os-user-domain-name default\
  \  --os-project-name marketing --os-username admin --os-password admin --os-identity-api-version\
  \ 3 user list\n```\n\n您应该会得到以下输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_91_0.png)\n\
  \nFigure 3.9: openstack user list 命令的输出\n\n在此示例中，域、用户、密码和项目 CLI 参数被发送到 Keystone\
  \ 身份验证端点。您的凭据经过验证，并且您的角色（管理员）会与 Keystone 的 policy.json 文件进行比较。请记住，管理员角色拥有完全访问权限，因此您看到的是环境中所有域中的所有用户列表。\n\
  \n您能想象每次想要与 OpenStack 交互时都需要将 CLI 参数放入命令中吗？这会非常烦人。这就是为什么许多人依赖另一种提供这些凭据的方式：Bash 变量。\n\
  \n在 OpenStack 用户主目录 (/home/openstack) 中，您应该会看到一个名为 openrc 的文件。该文件包含通过 CLI 与 OpenStack\
  \ 交互所需的身份验证信息。我已为您提供此文件，因此您无需费心自行创建。\n\n运行以下命令以在当前 Bash 会话中设置凭据：\n\n```\n$ source\
  \ openrc\n```\n\n您可以通过运行以下命令来验证变量是否已设置，该命令显示所有变量并通过管道传递给 grep 以根据 OS 前缀进行过滤。\n\n\
  ```\n$ export | grep OS\n```\n\n在验证变量已设置后，您现在可以无需手动提供凭据即可运行命令：\n\n```\n$ openstack\
  \ user list\n```\n\n您应该会看到与图 3.9 相同的输出。\n\n再次说明，我们看到的是跨所有域的整个 OpenStack 环境中的用户。如果我们只想缩小特定项目内的用户范围，可以运行以下命令：\n\
  \n```\n$ openstack user list --domain heat\n```\n\n您应该会看到类似于图 3.10 的输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_92_0.png)\n\
  \nFigure 3.10: 'openstack user list --domain heat' 命令的输出\n\n需要注意的是，这些变量是临时的，仅在 Bash\
  \ 会话期间保持有效。如果您连接到真实的生产 OpenStack 环境，请注意不要将变量暴露给周围的人。您不希望任何人窃取您的密码！\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_93_0.png)\n\
  \nCLI 参数始终优先于 Bash 变量。如果缺少 CLI 参数，python-openstackclient 将在 Bash 会话中查找变量的值。\n\n\
  ## 通过 CLI 进行项目范围限定\n\n对于需要 CLI 的目标，理解如何将自己限定到项目至关重要。在 CLI 上限定到项目的最简单方法是直接更改凭据文件中的项目或租户变量。\n\
  \n让我们尝试将项目范围从 admin 项目更改为 legal 项目。首先将原始的 openrc 文件复制到 openrc-legal：\n\n```\n$ cp\
  \ openrc openrc-legal\n```\n\n现在我们已制作副本，让我们编辑 openrc-legal 文件并更新项目和租户名称变量以反映我们希望限定到\
  \ legal 项目的范围。如果您更习惯使用 vim、emacs 或其他编辑器，请在此处随意使用。\n\n```\n$ nano openrc-legal\n\
  ```\n\n将以下变量更改为 legal 并保存文件。要使用 nano 退出并保存更改，请按 Ctrl + X，然后按 Y 保存。\n\n```\nexport\
  \ OS_PROJECT_NAME=legal\nexport OS_TENANT_NAME=legal\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_93_1.png)\n\
  \n我们更改 OS_TENANT_NAME 变量是因为一些较旧的基于服务的客户端可能依赖它。\n\n现在我们为 legal 项目创建了新的凭据文件，让我们载入该文件：\n\
  \n```\n$ source openrc-legal\n```\n\n验证变量是否已正确设置：\n\n```\n$ export | grep OS\n```\n\
  \n使用 openstack token issue 命令，确认您可以正确地向 Keystone 进行身份验证并获取限定到 legal 项目的令牌。\n\n```\n\
  $ openstack token issue\n```\n\n您应该会看到类似于图 3.11 的输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_94_0.png)\n\
  \nFigure 3.11: 'openstack token issue' 命令的输出\n\nproject_id 应与 legal 项目的 ID 匹配。通过运行以下命令进行确认：\n\
  \n```\n$ openstack project list\n```\n\n## 基于服务的客户端与 OpenStack 客户端\n\nOpenStack\
  \ 新手最大的问题之一是是否使用 python-openstackclient 还是较旧的基于服务的客户端，例如 Neutron（python-neutronclient）、Nova（python-novaclient）或\
  \ Cinder（python-cinderclient）。只要我们与 Keystone v3 API 交互，就必须使用 python-openstackclient。所有无法在\
  \ Horizon 仪表板上执行的与 Keystone 相关的 COA 目标都将要求您使用 python-openstackclient。\n\n## 考试目标\n\
  \n现在我们已经对如何通过 Horizon 仪表板和 CLI 使用 Keystone 对特定项目进行身份验证和范围限定有了很好的了解，让我们来看一下考试目标。\n\
  \n图 3.12 详细说明了来自官方目标列表的各种目标，该列表显示在 *第 1 章，介绍 OpenStack 和认证 OpenStack 管理员考试* 中，并且可在\
  \ `http://www.openstack.org/coa/requirements` 获取。如您所见，大多数任务可以通过 Horizon 仪表板完成，但仍有一些必须通过\
  \ CLI 完成。您会发现许多仪表板目标非常直观，而一些 CLI 目标需要进行更多研究。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_95_0.png)\n\
  \nFigure 3.12: 一些与 Keystone 相关的目标必须通过 CLI 完成\n\n\n\n\n## 考试目标 - 调整配额\n\n配额决定特定项目内资源的最大数量或大小。如图\
  \ 3.13 所示，用户创建的任何资源都归其作用域所属的项目所有。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_96_0.png)\n\
  \n图 3.13：镜像、网络、路由器和实例归用户作用域所属的项目所有。在此示例中，管理员用户的作用域为 human-resources 项目，并具有 admin\
  \ 和 heat_stack_owner 角色\n\n配额是 OpenStack 的一项功能，作为项目的防护栏。必须设置配额以防止用户超出 OpenStack\
  \ 基础设施工程师和/或 OpenStack 管理员设定的容量。在原生的开箱即用 OpenStack 环境中，您必须拥有管理员角色才能控制配额。参见图 3.14。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_97_0.png)\n\n图 3.14：配额作为项目的防护栏，允许 OpenStack\
  \ 管理员设置虚拟资源的具体数量或容量\n\n### Horizon 仪表板\n\n参见图 3.15。从 OpenStack 仪表板，您可以通过以下操作修改配额：\n\
  \n- 1. 选择 **身份** 面板。\n- 2. 选择 **项目**。这会显示环境中所有域中的所有项目。\n- 3. 选择生产项目旁边的下拉箭头并选择修改配额。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_98_0.png)\n\n图 3.15：从项目下拉菜单修改配额\n\n-\
  \ 4. 参见图 3.16。将生产项目中可创建的实例数量增加到 20。\n- 5. 选择保存。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_99_0.png)\n\
  \n图 3.16：可从 Horizon 仪表板轻松调整配额\n\n恭喜！您刚刚成功允许在生产项目中启动总共 20 个虚拟机实例。请记住，这是生产项目内的实例总数，而不是每个用户。\n\
  \n### CLI\n\n要获取特定项目的默认配额综合列表，请使用 python-openstackclient。首先确保已加载您的 openrc 文件：\n\n\
  ```\n$ source openrc\n```\n\n验证变量是否已设置：\n\n```\n$ export | grep OS\n```\n\n获取环境中所有项目的列表：\n\
  \n```\n$ openstack project list\n```\n\n查找 Trade 项目 UUID。您环境中的 UUID 可能与此处显示的不同。使用\
  \ openstack quota show 命令查看 trade 项目的所有默认配额。\n\n```\n$ openstack quota show eb1a2580ea87490bbe206162ecf2fde5\n\
  ```\n\n您应该会看到类似于图 3.17 的输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_101_0.png)\n\
  \n图 3.17：'openstack quota show' 命令的输出显示所有默认配额\n\n这是一个配额的综合列表，并将显示仪表板配额视图中缺少的任何内容。要通过\
  \ CLI 修改配额，您有两个选项。让我们先看看第一个。\n\n查看以下内容以了解可用的参数/参数：\n\n```\n$ openstack help quota\
  \ set\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_102_0.png)\n\n图 3.18：'openstack\
  \ help quota set' 命令的输出\n\n如果您想增加 trade 项目中最大实例数量的配额，可以执行以下操作：\n\n```\n$ openstack\
  \ quota set --instances 20 eb1a2580ea87490bbe206162ecf2fde5\n```\n\n不会有任何输出。\n\n\
  再次运行 openstack quota show 命令以验证实例配额是否已增加到 20：\n\n```\n$ openstack quota show eb1a2580ea87490bbe206162ecf2fde5\n\
  ```\n\n您应该会看到类似于图 3.19 的输出：\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_102_1.png)\n\
  \n图 3.19：trade 项目的配额现在应反映可创建最多 20 个实例的能力\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_103_0.png)\n\
  \n查看幕后进行的原始 API 调用的一种很好的方法是使用 `--debug` 选项。将它附加到任何 `python-openstackclient` 命令以查看对\
  \ OpenStack API 的调用！\n\n为方便您，图 3.20 显示了所有可用配额的综合列表、其定义、默认值以及负责管理配额的服务。\n\n| 配额名称\
  \ | 定义 | 数量/大小 | 服务 |\n|---|---|---|---|\n| 固定 IP | 项目内的固定 IP 地址的最大数量 | -1 | Neutron\
  \ |\n| 浮动 IP | 项目内的浮动 IP 地址的最大数量 | 50 | Neutron |\n| 密钥对 | 项目内的 SSH 密钥对的最大数量 | 100\
  \ | Nova |\n| 注入文件内容 | 可注入的最大文件大小（字节） | 10240 | Nova |\n| 注入文件 | 可注入的最大文件数 | 5 |\
  \ Nova |\n| 注入路径大小 (KB) | 注入文件的最大大小（千字节） | 255 | Nova |\n| 实例 | 可创建的虚拟机最大数量 | 10\
  \ | Nova |\n| 元数据项 | 项目内的元数据键值对的最大数量 | 128 | Nova |\n| 网络 | 项目内的网络最大数量。 | 10 | Neutron\
  \ |\n| 端口 | 项目内的端口最大数量。 | 50 | Neutron |\n| 内存 | 分配给所有实例的 RAM 最大大小（MB） | 51200 |\
  \ Nova |\n| RBAC 策略 | 项目内的 RBAC 策略规则的最大数量 | 10 | Neutron |\n| 路由器 | 项目内的路由器最大数量。\
  \ | 10 | Neutron |\n| 安全组 | 项目内的安全组最大数量 | 10 | Neutron |\n| 安全组规则 | 项目内的安全组规则最大数量\
  \ | 100 | Neutron |\n| 服务器组 | 项目内的服务器组最大数量 | 10 | Nova |\n| 服务器组成员 | 服务器组成员的最大数量\
  \ | 10 | Nova |\n| 子网 | 项目内的子网最大数量。 | 10 | Neutron |\n| 子网池 | 项目内的子网池最大数量 | -1 |\
  \ Neutron |\n| 卷和的总大小 | 所有卷和的最大大小（GB） | 1000 | Cinder |\n| 虚拟 CPU | 分配给所有实例的核心最大数量\
  \ | 20 | Nova |\n| 卷 | 可创建的卷最大数量 | 10 | Cinder |\n| 卷大小 | 项目内每个卷的最大大小（GB） | -1 |\
  \ Cinder |\n| 卷备份 | 项目内的卷备份最大数量 | 10 | Cinder |\n| 卷备份大小 | 所有卷备份的总大小（GB）最大 | 1000\
  \ | Cinder |\n| 卷快照 | 项目内的卷快照最大数量 | 10 | Cinder |\n| 卷 | 项目内的卷最大数量。 | 10 | Cinder\
  \ |\n\n图 3.20：所有可用配额的完整列表。-1 值表示“无限制”\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_104_0.png)\n\
  \nGlance 在哪里？Glance 镜像不受配额控制。要对 Glance 镜像设置限制，高级用户可以在 `/etc/glance/glance-api.conf`\
  \ 中查找 `image_member_quota` 值\n\n## 考试目标 - 管理用户\n\n管理 Keystone 用户非常简单直观。请记住，默认情况下，您必须拥有\
  \ **管理员** 角色才能管理用户帐户。\n\n### Horizon 仪表板\n\n参见图 3.21。从 OpenStack 仪表板，您可以通过以下操作创建新用户：\n\
  \n- 1. 点击 **身份** 面板。\n- 2. 点击 **用户**。这会显示环境中所有域中的所有用户。您可以点击 **用户名** 字段将用户名按升序排列。此视图令人烦恼，因为它没有指定用户帐户所属的域或项目。要获取该信息，我们需要点击\
  \ **编辑** 按钮。\n- 3. 点击 **创建用户**。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_104_1.png)\n\
  \n图 3.21：从 Horizon 仪表板创建新用户\n\n- 4. **域 ID**：用户的域 UUID。由于多域被禁用，我们可以使用 CLI 在默认域以外的域中创建用户。\n\
  - 5. **域名称**：用户的域名。\n- 6. **用户名（必填）**：用户的名称。我们将插入 `johnnyc-dashboard`。\n- 7. **描述（可选）**：用户的描述。输入\
  \ `Developer`\n- 8. **电子邮件（可选）**：用户的电子邮件地址。默认情况下，OpenStack 未安装任何电子邮件服务，因此这只是管理员的数据。输入\
  \ `johnnyc@example.com`。\n- 9. **密码（必填）**：用户的密码。输入 `openstack`。\n- 10. **确认密码（必填）**：通过再次输入来确认密码。\n\
  - 11. **主项目（可选）**：与用户关联的主要项目。请记住，用户可以属于零个或 5,000 个项目。主要项目是用户最初设置关联的第一个项目，对用户 Openstack\
  \ 体验没有可见影响。选择 `trade`。\n- 12. **角色（可选）**：用户在所选主要项目中应具有的角色。选择 `_member_`。\n- 13.\
  \ **已启用（必填）**：用户帐户是打开还是关闭。确保已启用。\n- 14. 选择 **创建用户**。\n\n\n\n\n## 创建用户\n\n描述：\n创建新用户并设置相关属性，包括主项目和角色\n\
  \n- 4 域 ID\n- 5 域名称\n- 6 用户名\n- 7 描述\n- 8 电子邮件\n- 9 密码 *\n- 10 确认密码 *\n- 11 主项目\n\
  - 12 角色\n- 13 已启用\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_106_0.png)\n\n图 3.22：在\
  \ Horizon 仪表板上添加有关新 OpenStack 用户的详细信息\n\n参见图 3.23。你现在应该在 Horizon 仪表板的用户列表中看到 johnnyc-dashboard。\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_107_0.png)\n\n图 3.23：新创建的用户将出现在用户列表中\n\
  \n你可以通过选择图 3.23 中显示的编辑按钮轻松更新用户的姓名、描述、电子邮件和项目。要删除或禁用帐户，请使用编辑按钮旁边的下拉菜单。\n\n### 命令行界面\n\
  \n我们可以使用 python-openstackclient 通过 CLI 添加用户。确保已加载管理员用户凭据：\n\n```\n$ source openrc\n\
  ```\n\n我们将创建一个名为 johnnyc-cli 的新用户。\n\n在运行命令之前，请探索 user create 命令的帮助：\n\n```\n$ openstack\
  \ help user create\n```\n\n现在让我们通过 python-openstackclient 创建用户：\n\n```\n$ openstack\
  \ user create --domain default --project trade \\\n--description \"Developer\" --email\
  \ johnnyc@example.com \\\n--password openstack johnnyc-cli\n```\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_107_1.png)\n\
  \n由于用户默认已启用，因此无需使用 enable 标志。要在创建时禁用用户，请使用 --disable 标志。\n\n确认用户已成功创建：\n\n```\n\
  $ openstack user list\n```\n\njohnnyc-cli 用户在项目中拥有角色之前将无法创建资源。\n\n运行以下命令。你不会收到任何输出。\n\
  \n```\n$ openstack role add --user johnnyc-cli --project trade _member_\n```\n\n\
  通过运行以下命令验证 _member_ 角色是否已分配给 trade 项目上的用户：\n\n```\n$ openstack role assignment list\
  \ --names\n```\n\n## 考试目标 - 创建域、项目、组和角色\n\n请记住，只要在禁用多域的情况下登录 Horizon 仪表板，我们就会登录到默认域。我们可以通过\
