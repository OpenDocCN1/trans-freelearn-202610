  \ 需要依赖 CLI 进行 acme-corp 域的身份验证。\n\n## 考试目标 - 管理服务目录 - 服务和端点\n\n对于 OpenStack 新手来说，服务目录的概念令人困惑，因为大多数初级\
  \ OpenStack 用户和管理员通过仪表板或 CLI 间接与 OpenStack 服务 API 交互。\n\n你可以将目录视为存储在 Keystone 中的\
  \ URL 列表。该列表显示了 OpenStack 环境中当前安装的所有服务的 API URL（也称为 *端点*）。虽然不是考试目标的一部分，但让我们从宏观角度看看直接与\
  \ API 交互的用户如何使用服务目录：\n\n- 1. OpenStack 操作员/开发人员决定直接与 API 交互，因此他们直接从 OpenStack 管理员处接收\
  \ Keystone 身份验证 URL、用户名、密码、域和项目。他们使用工具（如 `curl` 或 `wget`）通过 API 请求将此信息发送到 Keystone。\n\
  - 2. Keystone 回复两件事：一个限定到特定项目的令牌和一个服务目录。\n- 3. 用户浏览服务目录的方式类似于在最喜欢的餐厅浏览菜单，决定购买哪种餐点。在这种情况下，他们决定要使用哪种服务。服务目录显示\
  \ OpenStack 环境中所有服务 API 的位置。如果他们决定要创建一个新实例，他们会从 `http://developer.openstack.org`\
  \ 提供的 Nova API 文档中查找如何进行 API 调用。\n- 4. 然后 OpenStack 操作员/开发人员将他们在 **步骤 2** 中收到的令牌连同创建服务器的\
  \ API 请求一起直接发送到 Nova API 公共 URL 端点。\n- 5. 如果用户的角色已被授予创建服务器的授权，Nova 服务将履行创建服务器的请求，并且用户将从\
  \ Nova API 收到 `HTTP 200 OK`——确认请求已成功完成。\n\n某些服务使用目录查找如何向其他服务发送 API 调用。\n\n直接通过 API\
  \ 完成此操作很有趣。仪表板、CLI、SDK 和 Heat 的优点是它们不需要显式处理令牌、服务目录或直接 API 调用。\n\n作为 OpenStack 管理员，您可能负责向环境用户宣传新安装的\
  \ OpenStack 服务。一旦 OpenStack 基础设施工程师安装了该服务，您需要将其添加到服务目录中，以便用户知道该服务可用。可以通过 python-openstackclient\
  \ 轻松地将新服务和端点添加到目录中。\n\n服务目录中每个服务有三个端点：\n\n- **Public**：用户用于外部访问 API 的 URL。这通常是外部\
  \ IP 地址（或解析为外部 IP 地址的名称）。可以想象在咖啡店或 OpenStack 环境外部的某个地方。甚至智能手机应用程序也可以使用公共端点向服务发出\
  \ API 调用。\n- **Internal**：服务通常用于内部通信的 URL。这通常是只能从 OpenStack 集群内部访问的内部 IP 地址。如果用户或服务位于\
  \ OpenStack 环境内部，则无需使用公共端点。已通过 SSH 登录 OpenStack 服务器的 OpenStack 管理员或基础设施工程师也可以使用此端点。\n\
  - **Admin**：该 URL 用于公开服务的特殊仅限管理员的功能，尽管它通常与内部 URL/端口相同。事实上，Keystone 是包含的虚拟设备中唯一为管理员\
  \ URL 广告不同端口的服务（端口 35357）。Keystone 的早期版本在此端口上解锁了特殊功能，但从 Newton 版本开始，如果使用 v3 Keystone\
  \ API，则 5000 和 35357 之间没有功能差异。\n\n\n\n## Horizon 仪表盘\n\n需要注意的是，自 OpenStack Newton\
  \ 版本起，只能通过 Horizon 仪表盘查看服务目录。你可以在 Horizon 中的两个区域查看服务目录：\n\n- 1. 管理面板组 | 系统信息（见图\
  \ 3.25）\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_113_0.png)\n\n图 3.25：管理面板组的“系统信息”部分将显示服务目录中的所有端点\n\
  \n- 2. 访问与安全 | API 访问（见图 3.26）\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_114_0.png)\n\
  \n图 3.26：项目面板组的“访问与安全”部分列出了目录中的所有公共端点\n\n## CLI\n\n我们必须依赖 OpenStack CLI 来添加和删除服务目录中的条目。让我们考虑一个\
  \ OpenStack 管理员需要编辑目录的场景。想象一下，OpenStack 基础设施工程师刚刚在 OpenStack 环境中安装了一个全新的服务。该服务是\
  \ Trove，它允许 OpenStack 用户轻松创建关系型和 NoSQL 数据库。我们将如何让 OpenStack 用户知道他们现在有能力创建这些数据库？当然是通过在服务目录中进行宣传！\n\
  \n为了查看整个目录，请确保已 source 你的 openrc 文件并运行以下命令：\n\n```\n$ openstack catalog list\n```\n\
  \n你应该会看到完整的服务目录，如图 3.27 所示。\n\n![](img/da864e0670c65edf6f5ab861ef9906b3_115_0.png)\n\
  \n图 3.27：“openstack catalog list”命令显示整个服务目录\n\n要查看目录中的所有单个服务，请运行以下命令：\n\n```\n$\
  \ openstack service list\n```\n\n要查看构成该列表的 URL 端点，请使用以下命令：\n\n```\n$ openstack endpoint\
  \ list\n```\n\n现在让我们想象一下，我们的工程师提供了有关新安装的 Trove 服务在我们环境中监听 8779 端口的以下 API URL 信息：\n\
  \n- **RegionOne：公共端点：**\n  http://192.168.56.56:8779/v1.0/$(tenant_id)s\n- **RegionOne：内部端点：**\n\
  \  http://192.168.56.56:8779/v1.0/$(tenant_id)s\n- **RegionOne：管理端点：**\n  http://192.168.56.56:8779/v1.0/$(tenant_id)s\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_116_0.png)\n\n服务目录中的 Region 代表一个完整的 OpenStack\
  \ 部署，包括其自己的公共、内部和管理 API 端点。不同的 Region 可以共享一套 Keystone 和 Horizon 服务，以提供访问控制和 Web\
  \ 界面。我们环境中的所有服务都使用一个区域：RegionOne。\n\n让我们通过为该服务创建列表来开始宣传 Trove。这将包括服务名称、描述和类型：\n\n\
  ```\n$ openstack service create --name trove --description \"OpenStack Trove\" database\n\
  ```\n\n现在让我们宣传提供的 URL，以便我们的 OpenStack 用户知道如何联系 Trove API。我们将宣传公共、内部和管理 API 端点：\n\
  \n```\n$ openstack endpoint create --region RegionOne database public\nhttp://192.168.56.56:8779/v1.0/\n\
  $ openstack endpoint create --region RegionOne database internal\nhttp://192.168.56.56:8779/v1.0/\n\
  $ openstack endpoint create --region RegionOne database admin\nhttp://192.168.56.56:8779/v1.0/\n\
  ```\n\n确认 Trove 服务和端点已添加到目录中：\n\n```\n$ openstack catalog list\n```\n\n你应该在服务目录输出中看到\
  \ Trove：\n\n| 名称 | 类型 | 端点 |\n|---|---|---|\n| trove | database | RegionOne |\n\
  |  |  | Internal: http://192.168.56.56:8779/v1.0/ |\n|  |  | RegionOne |\n|  | \
  \ | admin: http://192.168.56.56:8779/v1.0/ |\n|  |  | RegionOne |\n|  |  | public:\
  \ http://192.168.56.56:8779/v1.0/ |\n\n图 3.28：服务目录现在应宣传新添加的 Trove 服务以及公共、内部和管理端点\n\
  \n![](img/da864e0670c65edf6f5ab861ef9906b3_117_0.png)\n\n如果你通过 CLI 添加新服务和公共端点，它在你使用用户名和密码注销并重新登录之前不会显示在\
  \ Horizon 仪表盘上。\n\n## 摘要\n\n你现在应该对 Keystone 以及 COA 考试所需的以 Keystone 为中心的 目标 有了扎实的理解。请记住通过\
  \ Horizon 仪表盘和 CLI 更改项目范围的重要性。我们需要在创建默认之外的任何新域并将项目、用户和组放置在这些域中时使用 python-openstackclient。我们在添加或删除服务目录中的条目时也需要\
  \ CLI。\n\n在下一章中，我们将讨论 Glance 镜像服务，并通过 CLI 和 Horizon 仪表盘完成所有 Glance 考试目标。让我们开始吧！\n"
- '# 4 Glance 镜像服务


  ## Glance 镜像服务


  在上一章中，我们讨论了 Keystone 标识服务以及针对 OpenStack 认证管理员考试的与 Keystone 相关的目标。现在我们将讨论 Glance。Glance
  是 OpenStack 镜像服务，提供云镜像的注册、存储和交付。


  在本章中，我们将涵盖以下主题：


  - 云镜像

  - 镜像文件格式

  - Glance 架构

  - Glance 镜像属性与 Glance 元数据定义

  - 考试目标 - 创建 Glance 镜像

  - 考试目标 - 下载 Glance 镜像

  - 考试目标 - 与特定项目共享 Glance 镜像

  - 考试目标 - 更新 Glance 元数据


  读完本章后，你应该对 Glance 有扎实的理解，并具备成功完成考试中所有与 Glance 相关目标所需的技能。


  ## 什么是云镜像？


  如果你刚接触弹性云世界，你可能对云镜像的概念感到有些困惑。想想创建虚拟机实例的过程（如果你还没有做过，你将在下一章中进行）。你通常会为实例提供名称以及内存大小、虚拟
  CPU 数量、本地磁盘大小和镜像。虚拟机如果没有操作系统或可从本地磁盘读取的内容，无法启动。


  过去，通常的做法是下载你喜欢的操作系统作为 ISO，即光盘的单个归档文件。在启动虚拟机后，你也许会在安装菜单中提供答案并通过安装向导。


  重要的是要理解，在弹性云世界中，敏捷性是首要任务，我们很少浪费时间在安装程序上！在 OpenStack 环境中启动实例时，始终需要提供磁盘镜像（我们也可以另行提供现有卷或
  Nova 快照，但稍后再详细介绍）。然后 Nova 会发送 API 请求从 Glance 获取镜像。镜像被放置在计算节点上，虚拟机被启动。


  与典型的 ISO 不同，存在于 Glance 中的云镜像通常是磁盘内容的快照。这些镜像之前已由人员或脚本配置过，该人员或脚本已完成初始安装程序并安装了特定的程序和配置文件，以确保其具备云感知能力。


  Glance 可以将这些镜像存储在各种称为 **数据存储** 的后端中。Glance 支持多种数据存储，包括本地文件系统、NFS 或 OpenStack Swift
  容器。


  ## 构建云镜像


  虽然超出了 COA 考试范围，但重要的是我们要理解构建这些云镜像的过程是在 OpenStack *之外* 完成的。让我们快速了解一下创建云镜像的几种流行方法：


  - **OpenStack disk image builder project**：OpenStack disk image builder project
  是一个用于自动构建用于云中定制的操作系统镜像的工具。它包括基于 Ubuntu、Red Hat、CentOS、SUSE 等构建镜像的支持（https://github.com/openstack/diskimage-builder）。

  - **Hashicorp Packer**：Packer 自动化任何类型镜像的构建，并连接到现有的配置管理框架，如 Chef 和 Puppet（packer.io）。

  - **Oracle VirtualBox**：虽然非常繁琐，但你可以使用 Oracle VirtualBox 通过将虚拟机设置到所需状态并将其上传到 Glance
  来构建云镜像（virtualbox.org）。




  ## 镜像文件格式


  磁盘镜像存储硬盘的所有内容，并采用多种文件格式。以下是一些最受欢迎的选项：


  - **QCOW2（QEMU 复制时写入）**：与 QEMU 和 QEMU-KVM 超级管理器一起使用，其名称源于其磁盘存储优化策略，该策略会延迟存储分配，直到实际需要时为止。

  - **VMDK（虚拟机磁盘）**：最初设计用于 VMware 系列超级管理器，但现在是一种开放格式，与 VirtualBox 等其他非 VMware 超级管理器兼容。

  - **VHD 和 VHDX（虚拟硬盘）**：最初由 Connectix Corporation 为类型 2 超级管理器 Virtual PC 创建，2003
  年被微软收购。它通常与 Microsoft 相关产品和服务一起使用，例如 Hyper-V 和 Azure。

  - **VDI（虚拟磁盘映像）**：由 Oracle 的 VirtualBox 使用。

  - **ISO（国际标准化组织，ISO9660）**：光盘的归档文件。它由光盘上每个已写入扇区的数据内容组成，包括光盘文件系统。

  - **RAW**：未压缩的磁盘映像。Nova 会在启动虚拟机实例时解压缩任何压缩的云映像并将其置于原始格式。


  ![](img/da864e0670c65edf6f5ab861ef9906b3_120_0.png)


  虽然我们使用 Glance 来注册、存储和检索镜像，但它并不关心存储的数据类型。事实上，Glance 会存储您扔给它的 .txt、.doc 或任何其他文件类型。确保
  Glance 镜像与环境中部署的超级管理器（或超级管理器）兼容是 OpenStack 管理员的责任。


  ## Glance 架构


  参见图 4.1。Glance 由两个主要守护进程组成：


  - **glance-api**：Glance 的主要网关。必须与 `glance-api` 交互才能存储和检索磁盘镜像。

  - **glance-registry**：负责在关系数据库中存储与镜像关联的元数据。镜像元数据的示例包括镜像名称、镜像位置、UUID、镜像大小、所有者（项目
  ID）、可用性状态和磁盘格式。


  Glance 可以将镜像存储在多种数据存储中，包括 Swift、Amazon S3、`glance-api` 守护进程所在的本地文件系统，甚至是公开可访问的 Web
  服务器。


  ![](img/da864e0670c65edf6f5ab861ef9906b3_121_0.png)


  图 4.1：Glance 架构的高级图


  本书提供的虚拟设备将 `glance-api` 配置为使用 Swift 数据存储。这是生产 OpenStack 环境中最常用的数据存储。


  ## Horizon 仪表板上的 Glance


  Glance 出现在 Horizon 仪表板 **Project Panel Group** 的左侧。参见 *Figure 4.2*。在提供的虚拟设备中，您可以看到一个先前上传的云镜像，名为
  **Cirros**。Cirros 是一种轻量级、最小化操作系统镜像，专为用作云的测试镜像而设计。您永远不会在 Cirros 上运行生产工作负载，但它非常适合云教育、开发和测试！这个特定的
  Cirros 镜像由 admin 项目拥有。还请仔细注意 **visibility** 列。这个特定 Cirros 镜像的 **visibility** 设置为
  *public*，因此使其可供所有域中的所有项目访问并可启动。**Visibility** 是理解 Glance 并通过 Glance 相关 COA 目标的基础。


  让我们分解一下镜像的可能可见性状态：


  - **Public**：公开的镜像可供 OpenStack 环境中所有域中的所有项目使用。根据默认 Glance `policy.json` 文件，只有具有管理员角色的用户才能将镜像设置为公开。公开镜像只有在您限定到拥有该镜像的项目时才可以修改或删除。

  - **Private**：根据默认 Glance `policy.json` 文件，任何具有任何角色的用户都可以将镜像上传到 Glance。为了在 Glance
  中创建/上传镜像，用户必须限定到一个项目。镜像成功创建/上传后，它将由用户当时限定到的项目拥有，并显示为 *Private*。该项目中的任何用户现在都可以修改镜像的属性或启动镜像。拥有私有镜像的项目之外的任何用户都无法看到该镜像，除非它已被明确与项目共享。

  - **Shared with Project:** 如果用户具有管理员角色，他们可以将镜像与一个特定项目共享。如果用户明确将镜像与您的项目共享，它将显示为 *Shared
  with Project*。除非您限定到拥有该镜像的项目，否则您无法修改或删除与您的项目共享的镜像。


  ![](img/da864e0670c65edf6f5ab861ef9906b3_123_0.png)


  图 4.2：Horizon 仪表板上的可见性列决定 Glance 镜像是公开、私有还是与项目共享


  ## Glance 镜像属性与 Glance 元数据定义


  当镜像上传到 Glance 时，只要用户限定到拥有该镜像的项目，用户就可以修改与镜像关联的元数据。由于 Horizon 仪表板上有两种修改 Glance 镜像属性的方法，因此最初可能会有点令人困惑。


  参见图 4.3。从 Horizon 仪表板选择 Edit Image 选项允许用户编辑名称、描述、格式、最小磁盘/最小内存、公开和受保护属性。这些不是由 Glance
  元数据定义服务设置的定义，而是 Glance 镜像固有的简单镜像属性。


  ![](img/da864e0670c65edf6f5ab861ef9906b3_124_0.png)


  图 4.3：在 Horizon 仪表板上编辑 Glance 镜像属性


  另一方面，Glance 元数据定义是可以设置在 OpenStack 资源上的属性。默认 Glance `policy.json` 文件只允许具有管理员角色的用户管理元数据定义，而所有其他具有其他角色的用户可以将这些定义应用于
  OpenStack 中所有允许的资源。


  图 4.4 显示了在 Admin-System 面板组中可用的元数据定义面板：


  ![](img/da864e0670c65edf6f5ab861ef9906b3_125_0.png)


  图 4.4：由 OpenStack 管理员加载的默认 Glance 元数据定义模板


  正如您所见，OpenStack 管理员已加载默认模板。这些元数据定义模板可在 `github.com/openstack/glance/etc/metadefs.`
  获取。


  典型的 OpenStack 用户将能够将这些已加载的属性应用于他们在 OpenStack 中创建的资源。这里有一个例子：考虑一个由 KVM、Hyper-V 和
  XEN 超级管理器组成的多个超级管理器的 OpenStack 环境。如果用户创建 Glance 镜像，他们可以在该镜像上设置元数据，以仅允许在与镜像文件格式兼容的超级管理器上启动它。


  要将此元数据应用于镜像，用户上传其镜像，然后可以单击操作下拉菜单中的更新元数据。现在您可以从左侧的可用元数据窗格中选择 hypervisor_type 属性并将其添加到镜像中。


  然后您可以选择适当的超级管理器值：


  ![](img/da864e0670c65edf6f5ab861ef9906b3_126_0.png)


  图 4.5：在 Horizon 仪表板上更新与 Glance 镜像关联的元数据定义


  ## 考试目标


  在回顾了 Glance 镜像服务的一些基本细节后，我们可以看到它相当简单。与 Keystone 考试目标类似，并非所有 Glance 相关目标都可以在仪表板上执行。


  下表根据第 1 章《介绍 OpenStack 和 Certified OpenStack Administrator 考试》中显示的官方目标列表中的各种目标进行了细分，可在
  http://www.openstack.org/coa/requirements 获取：


  ![](img/da864e0670c65edf6f5ab861ef9906b3_127_0.png)


  图 4.6：Glance 考试目标


  要在 Horizon 仪表板上将镜像上传到 Glance，镜像必须通过本地文件系统访问。


  ## 考试目标 - 创建 Glance 镜像


  作为 OpenStack 管理员，您将负责创建（也称为上传）Glance 镜像，以便您的 OpenStack 用户可以使用它们来启动实例。


  让我们看看如何通过 OpenStack 仪表板和 python-openstackclient 来完成此操作。


  我们将使用 python-openstackclient 显示所有 Glance 目标，但您当然也可以使用 python-glanceclient。记住：考试不关心您如何完成目标，只要它们成功完成任务即可。




  ## Horizon 仪表盘


  通过 Horizon 仪表盘创建镜像是一个相当简单的过程。让我们首先从官方网站下载 Cirros 云镜像到本地笔记本电脑或桌面。它可在 https://download.cirros-cloud.net/0.3.5/cirros-0.3.5-x86_64-disk.img
  获取。


  现在您已下载 Cirros，我们需要确保已限定到 procurement 项目。请参阅图 4.7。


  ![](img/da864e0670c65edf6f5ab861ef9906b3_128_0.png)


  图 4.7：在通过 Horizon 仪表盘将镜像上传到 Glance 之前，请确保您已限定到 procurement 项目


  - 1. 从 OpenStack 概览页面，通过选择顶部下拉菜单将自己限定到 procurement 项目。

  - 2. 从 **Project-Compute** 面板组中选择 **Images** 面板。如果查看当前 **Public** 镜像列表，您会注意到目前有一个云镜像，其可见性设置为
  `public`。该镜像当前可供环境中所有域下的所有项目访问。我们将上传一个新镜像，该镜像将仅由 procurement 项目拥有。

  - 3. 选择 **Create Image**。

  - 4. 请参阅图 4.8。**Image Name**（必填）：镜像的显示名称。请记住 Glance 可以存储多个同名镜像，因为它还会生成镜像 UUID。我们将此镜像命名为
  `cirros-dashboard`。

  - 5. **Image Description**（可选）：提供您正在上传的镜像的描述。我们输入 `Cirros Cloud Image for COA Exam
  Prep`。

  - 6. **File Browse**（必填）：这允许我们指定本节开头下载的文件。点击 **Browse** 并从本地系统选择已下载的 Cirros 镜像。

  - 7. **Format**（必填）：指定您正在上传的镜像的磁盘格式。我们将指定 `QCOW2 -- QEMU Emulator`。

  - 8. **Kernel**（可选）：此选项允许您为正在上传的云镜像指定单独的内核镜像。由于内核已存在于我们的 Cirros 镜像中，我们将保持为空。

  - 9. **Ramdisk**（可选）：此选项允许您为正在上传的云镜像指定单独的 ramdisk 镜像。由于 ramdisk 已存在于我们的 Cirros 镜像中，我们将保持为空。

  - 10. **Architecture**（可选）：Architecture 是用于 OpenStack 实例的元数据值，但我们将输入 `x64` 以向 OpenStack
  用户表明该镜像与 `x64` 系列处理器兼容。

  - 11. **Minimum Disk**（可选）：设置使用此镜像启动实例时允许的最小主磁盘。我们将其设置为 `1`。这将要求任何启动该镜像的人指定主磁盘大小至少为
  1 GB 的 flavor。我们将在 `Chapter 5, Nova Compute Service` 中讨论 flavors。

  - 12. **Minimum RAM**（可选）：将其设置为 512。这设置了使用此镜像启动实例时允许的最小 RAM。将此设置为 `512`。

  - 13. **Visibility：** 选择 **Private**。创建后，此镜像将仅可供限定到 procurement 项目的用户访问。

  - 14. **Protected：** 选择 **No**。我们将此镜像保持为未受保护。我们可以选择 Yes，这将防止用户意外删除镜像。要删除镜像，受保护标志必须由限定到镜像拥有者项目（在本例中为
  procurement 项目）的任何用户移除。

  - 15. 选择 **Create Image**。


