  如果您以具有 admin 角色的用户登录，Newton 版本的 OpenStack 将显示所有项目中的所有镜像。请密切注意图 4.9 中的 owner 列。这是确定特定镜像属于哪个项目的最佳方法。


  ## 命令行界面


  现在我们了解了如何在 Horizon 仪表盘上创建 Glance 镜像，让我们使用 python-openstackclient 创建一个。


  通过 SSH 登录提供的虚拟设备。如果需要 SSH 指导，请参阅第 2 章，设置您的练习考试环境。


  因为我们位于设备内部，而不是笔记本电脑或桌面的文件系统，让我们获取 Cirros 镜像并将其下载到设备的 Ubuntu 16.04 文件系统。我们使用 wget
  命令行工具。如果您不熟悉 wget，它是访问网站和从互联网下载文件的快速便捷工具。


  ```bash

  $ wget https://download.cirros-cloud.net/0.3.5/cirros-0.3.5-x86_64-disk.img

  ```


  回顾一下，我们在上一节中将此镜像作为 procurement 项目上传。为了从 CLI 限定到 procurement，我们需要为 python-openstackclient
  提供正确的身份验证凭据。对我们来说最简单、最方便的方法是创建一个具有正确 Bash 变量设置的另一个凭据文件。让我们将原始 openrc 文件复制到名为 openrc-procurement
  的文件：


  ```bash

  $ cp openrc openrc-procurement

  ```


  现在我们已复制文件，让我们编辑 openrc-procurement 文件并更新项目和租户名称变量，以反映我们希望限定到 procurement 项目的范围。请随意使用您选择的编辑器。


  ```

  $ nano openrc-procurement

  ```


  将以下变量更改为 procurement 并保存文件。要使用 nano 退出并保存更改，请按 CTRL + X，然后按 Y 保存。


  ```

  export OS_PROJECT_NAME=procurement

  export OS_TENANT_NAME=procurement

  ```


  ![](img/da864e0670c65edf6f5ab861ef9906b3_132_0.png)


  我们正在更改 OS_TENANT_NAME 变量，因为一些较旧的基于服务的客户端依赖于此而不是 OS_PROJECT_NAME。


  载入新创建的 openrc-procurement 文件：


  ```

  $ source openrc-procurement

  ```


  不要忘记始终验证我们的变量是否已正确设置为限定到 procurement 项目：


  ```

  $ export | grep OS

  ```


  现在我们已限定到 procurement 项目，运行 openstack image list 命令以验证是否可以看到任何可用镜像：


  ```

  $ openstack image list

  ```


  请参阅图 4.10。如果您正确遵循了上一节，您应该会看到公开可用的 cirros 镜像（由 admin 项目拥有）以及在上一节通过 Horizon 仪表盘创建的
  cirros-dashboard 项目。


  ![](img/da864e0670c65edf6f5ab861ef9906b3_132_1.png)


  图 4.10：''openstack image list'' 命令的输出


  ![](img/da864e0670c65edf6f5ab861ef9906b3_133_0.png)


  您可以通过在初始命令后、操作前放置 help 单词来获取任何 OpenStack 命令的帮助——例如：openstack help image create、openstack
  help image list 和 openstack help image save。


  要获取特定镜像的更多详细信息，您可以使用 openstack image show 命令。让我们查看之前创建的 cirros-dashboard 镜像的详细信息：


  ```

  $ openstack image show cirros-dashboard

  ```


  如图 4.11 所示，在此特定镜像中，owner 字段显示了 procurement 项目的 UUID 以及我们在上一节中指定的其他一些详细信息。


  在上传新镜像之前，我们可以使用 help 探索此命令的一些可用参数。


  ```

  $ openstack help image create

  ```


  使用这些信息，我们现在可以通过 CLI 创建一个新的 Glance 镜像。我们将使用 openstack image create 命令：


  ```

  $ openstack image create --file cirros-0.3.5-x86_64-disk.img --disk-format qcow2
  --min-disk 1 --min-ram 512 --property description=''Cirros Cloud Image for COA Exam
  Prep'' --property architecture=''x64'' cirros-cli

  ```


  ![](img/da864e0670c65edf6f5ab861ef9906b3_133_1.png)


  --container-format 是一个可选参数，如果镜像采用的文件格式也包含有关镜像的元数据，则会设置该参数。容器格式目前未被 Glance 或其他 OpenStack
  组件使用，因此如果不确定，指定 bare 作为容器格式是安全的。




  We should now see the output shown in Figure 4.11:


  ![](img/da864e0670c65edf6f5ab861ef9906b3_134_0.png)


  图 4.11：''openstack image create'' 命令的输出


  Use this to verify that the image was successfully created by using the openstack
  image list command:


  ```

  $ openstack image list

  ```


  You should see output similar to Figure 4.12 with all images set to active, verifying
  the image is available to be used:


  ![](img/da864e0670c65edf6f5ab861ef9906b3_134_1.png)


  图 4.12：''openstack image list'' 命令的输出


  If we wanted to delete this image, we could easily use the simple openstack image
  delete command. See openstack help image delete for more information.


  ## 考试目标 - 下载镜像


  Downloading images stored in Glance is not possible via the Horizon dashboard in
  the Newton version of OpenStack. We will rely on the python-openstackclient to accomplish
  this.


  ### CLI


  Verify you are scoped to the procurement project by sourcing the openrc-procurement
  file created in the previous section:


  ```

  $ source openrc-procurement

  ```


  List all available images:


  ```

  $ openstack image list

  ```


  Download the cirros-cli image to the /tmp directory inside your virtual appliance.
  You can also use the image''s UUID instead of the name.


  ```

  $ openstack image save --file /tmp/mydownloadedimage.img cirros-cli

  ```


  Verify the image successfully downloaded to the /tmp location:


  ```

  $ ls /tmp

  ```


  ## 考试目标 - 与特定项目共享镜像


  An OpenStack user with the admin role has the ability to share an image with a specific
  project. As of the Newton version of OpenStack, Horizon does not have the capability
  to share images with specific projects. We will do this via python-openstackclient.


  ### CLI


  Ensure you are scoped to the procurement project:


  ```

  $ source openrc-procurement

  ```


  Get a list of all images we currently have access to:


  ```

  $ openstack image list

  ```


  Get a list of all the projects in our environment so you can lookup the UUID of
  the marketing project:


  ```

  $ openstack project list

  ```


  Share the cirros-cli image with the marketing project:


  ```

  $ openstack image add project cirros-cli 99a06694e4444e038d632aca0cc1a89e

  ```


  After sharing the image, you should see the output similar to Figure 4.13:


  ![](img/da864e0670c65edf6f5ab861ef9906b3_136_0.png)


  图 4.13：''openstack image add'' 命令的输出


  ![](img/da864e0670c65edf6f5ab861ef9906b3_136_1.png)


  Although you''ll see a pending status, anyone in the marketing project should now
  be able to see and launch the shared image. Accepting the image is not necessary
  with the Glance v2 API.


  Any non-admin user in the marketing project will now be able to launch an instance
  or create a volume from the image but will not be able to delete the image or modify
  the properties/metadata associated with it.


  ## 考试目标 - 设置 Glance 镜像属性和元数据定义


  It''s extremely easy to set Glance image properties and metadata definitions on
  images that reside in Glance. Remember that you can only set metadata on images
  owned by the project to which you are currently scoped.


  ### Horizon 仪表盘


  Recall earlier in this section, where we pointed out the two specific sections for
  setting Glance image properties and metadata definitions.


  ![](img/da864e0670c65edf6f5ab861ef9906b3_137_0.png)


  图 4.14：在 Horizon 仪表盘上编辑 Glance 镜像属性


  See Figure 4.14. Let''s first update the image properties associated with the `cirros-dashboard`
  image:


  - 1. Verify you are scoped to the procurement project.

  - 2. Select the **Images** panel from the **Project-Compute** panel group.

  - 3. Click on the `cirros-dashboard` dropdown next to the **Launch** button and
  select **Edit Image**.

  - 4. See Figure 4.15. Lower the minimum RAM value to 256.

  - 5. Click on **Update Image**.


  ![](img/da864e0670c65edf6f5ab861ef9906b3_138_0.png)


  图 4.15：在 Horizon 仪表盘上编辑 Glance 镜像的最小内存


  Let''s now apply a Glance metadata definition key/value to the image. Let''s use
  the existing *Common Operating Systems Properties-OS Distro* metadata definition
  property. This will be used to help identify the specific distribution contained
  in the image. See *Figure 4.16*.


  - 1. Verify you are scoped to the procurement project.

  - 2. Select the **Images** panel from the **Project-Compute** panel group.

  - 3. Click on the `cirros-dashboard` dropdown next to the **Launch** button and
  select **Update Metadata**.


  ![](img/da864e0670c65edf6f5ab861ef9906b3_139_0.png)


  图 4.16：在 Horizon 仪表盘上更新 Glance 镜像元数据


  - 4. See *Figure 4.17*. Select the plus sign on the left to open the **Common Operating
  System Properties** group. Select **OS Distro** definition. Fill in the value as
  `Cirros`. See *Figure 4.16*. Take note that the description we originally set on
  the image is a Glance metadata definition key/value pair.

  - 5. Select **Save**.


  ### 更新镜像元数据


  You can specify resource metadata by moving items from the left column to the right
  column. In the left column there are metadata definitions from the Glance Metadata
  Catalog. Use the ''Custom'' option to add metadata with the key of your choice.


  - **可用元数据**

  - - Custom

  - - CiM Processor Allocation Setting

  - - Cinder Volume Type

  - - Common Operating System Properties

  - - OS Admin User

  - - OS Version

  - - CPU Pinning

  - - Database Software

  - - Guest Memory Backing


  - **现有元数据**

  - - description: Cirros Cloud Im...

  - - os_distro: Cirros


  ### OS Distro (os_distro)


  The common name of the operating system distribution in lowercase. Uses the same
  data vocabulary as the libosinfo project. Specify only a recognized value for this
  field. Deprecated values are listed to assist you in searching for the recognized
  value.


  To verify your work, click on the blue hyperlink for the cirros-dashboard in the
  image list page. See Figure 4.18. You should see the newly updated Min. RAM value
  set to 256 MB and the os_distro value set to Cirros.


  ![](img/da864e0670c65edf6f5ab861ef9906b3_141_0.png)


  图 4.18：具有已更新 Min. RAM（镜像属性）和 os_distro（从元数据定义应用的元数据）的 Glance 镜像


  ### CLI


  Ensure you have sourced credentials for the procurement project:


  ```

  $ source openrc-procurement

  ```


  Verify you can get a list of all available images:


  ```

  $ openstack image list

  ```


  Let''s set the minimum RAM requirements on the cirros-cli image to 256 MB. You will
  not receive any confirmation output from this command:


  ```

  $ openstack image set cirros-cli --min-ram 256

  ```


  Let''s now apply the Glance metadata definition os_distro key/value to the image:


  ```

  $ openstack image set cirros-cli --property os_distro=''Cirros''

  ```


  We can now verify that the Glance property and metadata definitions were properly
  set to the image. We should see output similar to Figure 4.19.


  ```

  $ openstack image show cirros-cli

  ```


  ![](img/da864e0670c65edf6f5ab861ef9906b3_142_0.png)


  图 4.19：CLI 上具有已更新 Min. RAM 和 os_distro 属性的镜像


  ## 摘要


  The Glance image service is one of the easier OpenStack services to understand and
  use. We''ve covered the basics of cloud images, image file types, Glance architecture
  as well as image properties and metadata definitions. It''s important to remember
  that the only user that can make an image public (publicly accessible to all projects
  across all domains) must have the admin role. A user with the admin role can also
  share an image with a specific project. If a user does not have the admin role,
  they cannot modify or delete existing images unless that image was created by someone
  within the project to which they are currently scoped.


  In the next chapter, we will discuss the first part of the Nova compute service
  and work through all objectives relating to key pairs, flavors, and the launching
  of virtual machines on the Horizon dashboard and python-openstackclient.




