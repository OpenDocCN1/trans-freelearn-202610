  \ OpenStack 考试所需的目标。\n\n## 关于 VirtualBox\n\nVirtualBox 是一款流行的可供 Windows、Mac、Linux\
  \ 和 Solaris 下载的超visor。与 VMware Workstation Pro for Windows 和 VMware Fusion for Mac\
  \ 不同，VirtualBox 是免费的开源软件。它非常适合测试或开发，并允许你在同一系统上设置多个操作系统。VirtualBox 被认为是 Type-2 超visor，旨在在主机操作系统上运行。Type-1\
  \ 超visor，也称为原生或裸机超visor，直接在主机的硬件上运行。\n\n## Open Virtual Appliance（OVA）\n\n为了使你的练习\
  \ COA 考试环境部署变得简单易行，本书为你提供了一个 OVA 或 Open Virtual Appliance，以便轻松导入 VirtualBox。OVA\
  \ 是一个压缩的 .tar 文件，包含以下内容：\n- **虚拟机磁盘文件（VMDK）**：磁盘内容的快照。包含在你的 OVA 中的特定 VMDK 包含一个预先配置的\
  \ OpenStack Newton 环境。\n- **开放虚拟化格式（OVF）**：描述 VMDK 如何运行的 XML 文件。它包括虚拟 CPU 数量、内存大小、网络配置和虚拟设备的信息。\n\
  - **清单（MF）**：它包含每个文件的哈希值，以验证软件包的真实性和完整性。\n\n## 传统的 OpenStack 云\n\n典型的生产 OpenStack\
  \ 云由以下部分组成：\n- **Controller**：控制器是 OpenStack 云的支柱。它通常包含：\n  - **MariaDB 数据库**：MySQL\
  \ 关系数据库的社区开发分支。大多数 OpenStack 服务使用 SQL 数据库来存储列和行表中的数据。例如，想象一下查看 Nova 数据库中的所有表。你会看到实例的名称、它们的唯一标识符（UUID）、拥有这些实例的项目以及其他\
  \ Nova 相关元数据。\n  - **RabbitMQ**：一种流行的消息队列服务，通过 AMQP 协议提供消息服务。RabbitMQ 允许特定服务内的守护进程通信状态信息并协调特定操作的履行。虽然\
  \ OpenStack 支持多种消息队列程序，但 RabbitMQ 是最常用的，因为大多数 Linux 发行版都支持它。\n  - **API 守护进程**：所有与\
  \ OpenStack 相关服务关联的 API 守护进程都在控制器上运行。将这些 API 视为通往每个服务的首要网关。当用户想要与服务交互时，他们会向驻留在控制器上的\
  \ API 守护进程发送 API 调用。\n  - **Horizon 仪表板**：Horizon 仪表板运行在流行的 Apache Web 服务器下，也驻留在控制器上。\n\
  - **Network nodes**：网络节点包含 Neutron 守护进程，提供 DHCP 服务，以便实例可以自动获取 IP 地址。网络节点还包含第 3 层服务，允许用户创建将\
  \ Neutron 网络相互连接的路由器。还有网络插件代理来协助将实例连接到这些网络，以及 Neutron 元数据守护进程（受 Amazon Web Service\
  \ 流行的 EC2 Metadata Service 启发）。\n\n\n\n- **计算节点**：如果将控制器视为 OpenStack 云的大脑，那么计算节点就是肌肉。计算节点提供磁盘、CPU\
  \ 和内存资源，供实例消耗。每个节点都包含一个 Type-1 hypervisor，以及用于直接与该 hypervisor 通讯的 Nova-compute 守护进程。这些服务器上还有一个\
  \ Neutron 插件代理，帮助实例接入虚拟网络基础设施。\n- **块存储节点**：块存储节点为 OpenStack 中运行的实例提供 Cinder 块卷。它们通常运行\
  \ **逻辑卷管理器**（LVM），这是一种用于管理存储的流行 Linux 程序，以及一个 iSCSI 目标守护进程。当用户想要将卷附加到实例时，会从实例的计算节点向块存储服务器发起\
  \ iSCSI 连接，该卷位于该服务器上。\n- **对象存储节点**：对象存储节点构成 Swift 对象存储系统。这些节点由具有廉价、大容量存储的商品服务器组成。在这些服务器上运行的\
  \ Swift 守护进程负责确保整个对象存储集群中的数据复制和完整性。\n\n## 一体化 Newton 环境\n\n提供的虚拟设备在单个虚拟机上包含所有核心\
