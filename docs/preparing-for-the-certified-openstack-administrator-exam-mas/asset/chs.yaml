  \ Administrator 考试做准备\n本书为您提供了一种具体的策略，以通过 OpenStack 基金会的第一项专业认证：Certified OpenStack\
  \ Administrator。最近的一项调查显示，78% 的受访者表示 OpenStack 技能短缺阻碍了他们采用 OpenStack。请将此视为一个机会，通过证明您拥有管理现实世界\
  \ OpenStack 云所需技能来提高雇主和客户的信心。\n\n您将从熟悉 OpenStack 环境开始，了解参加考试的好处，并安装包含的 OpenStack\
  \ 一体化虚拟设备，以完成书中涵盖的目标。在探索各个服务的基础知识后，您将学习实现与 Keystone、Glance、Nova、Neutron、Cinder、Swift、Heat\
  \ 和故障排除相关的考试目标的策略。\n\n最后，您将受益于特别提示部分和一次练习考试，以检验您的知识。到旅程结束时，您将准备好成为一名 Certified OpenStack\
  \ Administrator！\n\n## 您将学到什么：\n- 通过创建和修改域、组、项目、用户、角色、服务、端点和配额来管理 Keystone 身份服务\n\
  - 上传 Glance 镜像、启动新的 Nova 实例，并创建规格、密钥对和快照\n- 发现 Neutron 租户和提供商网络、安全组、路由器和浮动 IP\n\
  - 通过创建卷并将其附加到实例来管理 Cinder 块存储服务\n- 创建 Swift 容器并设置访问控制列表以允许对对象进行读/写访问\n- 探索 Heat\
  \ 编排模板并创建、列出和更新堆栈\n"
