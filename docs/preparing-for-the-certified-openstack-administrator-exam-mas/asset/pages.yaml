- pgno: 327
  md: '# Question 12


    Create a Nova snapshot of instance1 in the accounting project. The snapshot should
    be called instance1-snapshot.


    # Question 13


    Create a router within the accounting project called router1. Add tenant-subnet1
    to the router interface. Set the router gateway to provider-network-dashboard.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_327_0.png)


    If you don''t see provider-network-dashboard, please go to Chapter 6, Neutron
    Networking Service and follow the exercises to create it.


    # Question 14


    In the accounting project, allocate the floating IP address 172.16.0.99. Assign
    this floating IP to instance1.


    # Question 15


    Attempt to get a reply by pinging instance1 via its floating IP address (172.16.0.99)
    set in the previous question. If you do not receive a reply, set the specific
    security group rule in the default security group to permit this.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_327_1.png)


    You must attempt to ping the instance from inside the virtual appliance, not your
    laptop or desktop system running VirtualBox.


    # Question 16


    Perform this specific task on the CLI only. Use wget to fetch a Cirros image from
    the official upstream website at https://download.cirros-cloud.net/0.3.5/cirros-0.3.5-x86_64-disk.img.
    Upload the qcow2 image to the trade project. The image should be named awesome-cirros.
    The image description should be "COA Exam Prep Awesome Image". The image should
    have a minimum RAM of 256 and minimum disk of 1 GB. It should be accessible only
    to the trade project.'
  merge: -1
  img_proc: true
