- pgno: 188
  md: '4. See Figure 6.11. Subnet Name (optional): `tenant-subnet1-dashboard`


    5. Network Address (required): `192.168.1.0/24`. This must be in Classless Inter-Domain
    Routing (CIDR) notation. CIDR notation is a compact representation of an IP address
    and its associated routing prefix.


    Since this is one of the more confusing aspects of Neutron networking, let''s
    take a moment to understand how this differs from real-world networking.


    +   - In real-world networking, `192.168.1.0/24` would break down as follows:

    +     - `192.168.1.0`: network

    +     - `192.168.1.1` through `192.168.1.254`: hosts on the network

    +     - `192.168.1.255`: broadcast

    +   - On a Neutron subnet, the CIDR (if all default subnet options apply) will
    break down as follows:

    +     - `192.168.1.0`: represents the network

    +     - `192.168.1.1`: reserved for a router (gateway) even if no router currently
    exists

    +     - `192.168.1.2`: DHCP server

    +     - `192.168.1.3` through `192.168.1.254`: instances or other resources

    +     - `192.168.1.255`: broadcast


    ![](img/da864e0670c65edf6f5ab861ef9906b3_188_0.png)


    6. IP Version (required): We will set this to IPv4.


    7. Gateway IP (optional): Leave this blank so it will automatically default to
    `192.168.1.1` as the gateway address.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '8. Disable Gateway: This should be unchecked. Checking this option will prevent
    any instances connected to the subnet from receiving default route announcements
    from the DHCP server.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_189_0.png)


    Figure 6.11: Providing subnet details on the Horizon dashboard


    9. Select Next.


    10. See Figure 6.12. Enabled DHCP: This should be checked to ensure the subnet
    will be DHCP enabled.


    11. Allocation Pools (optional): This allows you to specify the IP address start
    and end. For example, entering an allocation pool of 192.168.1.100,192.168.1.105
    will result your DHCP server getting 192.168.1.100 and your first instance connected
    to the subnet will be 192.168.1.101. If we leave it blank, it will attempt to
    use most of the CIDR range, in our case: 192.168.1.2,192.168.1.254. We will keep
    this blank.'
  merge: -1
  img_proc: true
