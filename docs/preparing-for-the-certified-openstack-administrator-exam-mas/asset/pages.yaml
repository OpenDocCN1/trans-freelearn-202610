- pgno: 36
  md: 'But what specific positions are available to those who know OpenStack? Let''s
    break down a few of the different roles an individual with OpenStack skills may
    possess.


    # Application developer - developing on OpenStack


    The application developer who understands OpenStack uses it to create virtual
    resources so they can deploy their applications on top of OpenStack. They typically
    have a background in Amazon Web Services, Azure, or Google Cloud Platform, and
    treat OpenStack as an **Infrastructure as a Service (IaaS)** platform. They are
    most likely full-stack developers, well-versed in all layers of web applications.
    They love the speed and agility of OpenStack. It allows them to instantly deploy
    an application when inspiration strikes and ship applications to their customers
    quickly and efficiently.


    # OpenStack administrator/operator - administrating the cloud


    The OpenStack administrator or operator is the target audience for the Certified
    OpenStack Administrator exam. This individual typically has some years of experience
    as a Linux System Administrator, and is comfortable acting as the go-to individual
    for all OpenStack-related questions. They are responsible for managing new users,
    domains, and projects. They must also know how to interact with OpenStack, as
    well as how to train others to create virtual resources using the services installed
    in the environment.


    # OpenStack engineer/infrastructure engineer - doing the DevOps thing


    An OpenStack engineer may spend a lot of their time in the datacenter working
    with automation tools like Puppet, Chef, and Ansible. When OpenStack needs more
    capacity, the OpenStack engineer is responsible for racking, stacking, and wiring
    up the servers, ensuring the operating systems have the latest patches, and seeing
    that all proper OpenStack components get the proper configuration file values,
    permissions, and settings. Although the Certified OpenStack Administrator exam
    doesn''t require test takers to understand specific values for configuration files
    (or how to upgrade existing services), OpenStack engineers most likely know how
    to do this inside and out—often finding themselves working on automation scripts
    to ease their daily responsibilities.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# OpenStack product developer - simplifying OpenStack deployment/management


    The OpenStack product developer works on developing an OpenStack distribution
    or appliance. They understand the difficulty of building clouds; in turn, they
    create opinionated distributions to ease the OpenStack deployment and management
    process. Examples include Red Hat OpenStack Platform Director, SUSE OpenStack
    Cloud, and Rackspace Private Cloud. These companies may also offer professional
    service or support in addition to the product.


    # Upstream OpenStack developer - making OpenStack better!


    Those eager to contribute to the actual OpenStack project are known as OpenStack
    upstream developers. These developers develop for OpenStack—building blueprints,
    chatting with other OpenStack developers on IRC, attending the PTG meet-ups, and
    contributing code—as they to make OpenStack the ubiquitous cloud operating system.
    Upstream developers have an impact on the OpenStack roadmap and are part of a
    healthy community that strengthens enterprise adoption.


    # OpenStack services overview


    OpenStack is made up of a variety of services that are all written in the Python
    programming language and serve a specific function. OpenStack’s modular nature
    facilitates the modern cloudy application design philosophy and also allows easy
    expandability; any person, community, or company can develop an OpenStack service
    that can easily integrate into its ecosystem.


    The OpenStack Foundation has successfully identified nine key services they consider
    part of the core of OpenStack, which we’ll explore in detail.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Keystone - identity service


    Keystone handles authentication. It acts as a common authentication system across
    all core services in an OpenStack environment. Both human users and services must
    authenticate to Keystone to retrieve a token before interacting with other services
    in the environment.


    Visualize the process of logging on to a website with your username and password.
    When a user does this on the Horizon dashboard, they authenticate against Keystone
    to successfully login and begin creating virtual resources. Keystone also stores
    the service catalog, users, domains, projects, groups, roles, and quotas—exam
    objective concepts you’ll examine in Chapter 3, Keystone Identity Service.


    # Glance - image service


    Glance provides discovery, registration, and delivery services for disk images.


    When one boots a virtual machine (also known as an instance), it is typically
    required to provide a disk image. These typically contain an operating system
    (such as Ubuntu or Red Hat Enterprise Linux), and are best described as a snapshot
    of a disk’s contents. Examples of disk image types include QCOW2, VMDK, VHDX,
    ISO, and RAW. The disk image has usually been previously created by a person or
    script who has gone through the initial installation procedure and has installed
    specific configuration files to ensure it is cloud-aware. Glance can store images
    in a variety of data stores, including the local filesystem or OpenStack Swift.


    # Nova - compute service


    Inspired by Amazon EC2, Nova is the compute service and the core of the OpenStack
    cloud. It is designed to manage and automate pools of compute resources, and can
    work with widely available virtualization technologies as well as bare metal servers.


    It’s important to note that Nova is not a hypervisor. It’s a system of services
    that sit above the hypervisor, orchestrating availability of compute resources.
    Some examples of hypervisors include Hyper-V, VMware ESXi, Xen, and the most popular,
    KVM (Kernel-based Virtual Machine). Nova also supports the ability to utilize
    Linux container technology such as LXC and Docker.


    In OpenStack, the term booting is used to refer to the creation of a virtual machine.
    A virtual machine booted with Nova is often called an instance.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Neutron - networking service


    Neutron is a service that allows users to manage virtual network resources and
    IP addresses.


    If one wants to boot an instance, they typically need to provide a virtual network
    on which to boot that instance so that it has network connectivity. With Neutron,
    users can view their own networks, subnets, firewall rules, and routers—all through
    the Horizon dashboard, CLI, or API. One’s ability to create and manage network
    resources depends on the specific role they have been assigned.


    Neutron also contains a modular framework powered by a variety of plugins, agents,
    and drivers, including Linux bridge and Open vSwitch.


    # Cinder - block storage service


    Inspired by Amazon''s Elastic Block Storage (EBS) offering, Cinder allows users
    to create volumes that can be mounted as devices by Nova instances.


    Cinder volumes behave as if they were raw unformatted hard drives. Once data is
    written to these volumes, the data persists even after terminating the instance
    or an instance failure. This is because the written data is stored on a dedicated
    Cinder storage server, not the compute nodes where the instances reside. Cinder
    also supports snapshots which capture the current state of a volume. These are
    useful for providing backup protection, and they can also be used to instantiate
    new volumes that contain the exact data of the snapshot. You can also write images
    to a block storage devices for compute to use as a bootable persistent instance.


    # Swift - object storage service


    Inspired by Amazon S3, Swift is a redundant storage system that provides developers
    and IT teams with secure, durable, and highly scalable cloud storage. A user creates
    a container and stores static files, also known as objects, in the container.
    These objects can be anything from pictures or movies to spreadsheets and HTML
    files. From the end user''s perspective, storage is limitless, inexpensive, and
    accessible via a REST API. Features can also be turned on via the Swift API. These
    include hosting a static website, versioning, setting specific objects to expire,
    and even setting Access Control Lists (ACLs) allowing public access to the objects
    inside the container.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'On the backend of Swift, static files (also known as objects) are written to
    multiple disk drives spread throughout servers in a data center. The Swift software
    is responsible for ensuring data replication and integrity across the cluster.
    Should a server or hard drive fail, Swift replicates its contents from other active
    nodes to a new location in the cluster.


    # Heat - orchestration service


    Inspired by Amazon''s CloudFormation service, Heat helps operators model and set
    up OpenStack resources so that they can spend less time managing these resources
    and more time focusing on the applications that run on OpenStack.


    You begin with a blueprint or Heat Orchestration Template (HOT) that describes
    all the OpenStack resources to be provisioned. Heat then takes care of provisioning
    and configuring, with no need to worry about dependencies or order of execution—a
    template describes all the resources and their parameters. After the stack has
    been created, your resources are up and running.


    Templates are extremely convenient because they allow operators to check them
    into a version control system to easily track changes to the infrastructure. If
    problems occur after deploying a Heat template, you simply restore to a previous
    version of the template. If you want to make a change to the stack, you can easily
    update it by providing a modified template with new parameters.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# OpenStack services in action


    Let''s take a high-level look at these OpenStack services in the wild, from the
    perspective of the Horizon dashboard home screen. See Figure 1.4.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_41_0.png)


    Figure 1.4: OpenStack services on the Horizon dashboard


    Let''s start from the top:


    +   - **Instances**: The **Nova** instances section is where you can manage your
    virtual machines. You can start, stop, pause, lock, and suspend instances—as well
    as create snapshots, view console logs, and log in into the instances via an interactive
    console. Learn more about this section in Chapter 5, Nova Compute Service.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '+   - **Volumes**: In this section, you can create **Cinder** block volumes,
    snapshots, and backups. You can also attach your volumes to instances. Learn more
    about this section in *Chapter 7, Cinder Block Storage Service*.

    +   - **Images**: The **Glance** images section is where you can see your currently
    available images as well as upload images and edit metadata associated with the
    images. Learn more about this section in *Chapter 4, Glance Image Service*.

    +   - **Access & Security**: This section is a mix of a few services and contains
    four primary sections: Neutron Security Groups, Nova Keypairs, a list of Service
    Catalog public endpoints, and a place to download a pre-populated credential file
    for interacting with OpenStack with a command-line interface with the currently
    logged-in user. Learn more about this section in *Chapter 3, Keystone Identity
    Service, Chapter 5, Nova Compute Service, and Chapter 6, Neutron Networking Service*.

    +   - **NETWORK**: In this section, you can utilize Neutron by creating tenant
    networks, tenant subnets, routers, and floating IPs. Learn more about this section
    in *Chapter 6, Neutron Networking Service*.

    +   - **ORCHESTRATION**: Here, you can create Heat stacks by either uploading
    a Heat orchestration template or pasting it into the dashboard. You can also list
    and update existing stacks in this area. Learn more about this section in *Chapter
    9, Heat—Orchestration Service*.

    +   - **OBJECT STORE**: Create Swift containers and upload static objects such
    as photos, movies, and HTML files. Learn more about this section in *Chapter 8,
    Swift—Object Storage Service*.

    +   - **Admin**: This admin panel only appears when the user logging in has the
    admin role. It features an admin-only look at all virtual resources across all
    domains and projects in the environment.

    +   - **Identity**: This is where Keystone domains, projects, users, roles, and
    quotas are listed. If one has the admin role, they can do a variety of things
    in here, including creating new projects, adding new users to those projects,
    assigning roles, and modifying quotas. Learn more about this section in *Chapter
    3, Keystone Identity Service*.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Interacting with OpenStack


    The power of OpenStack is in the REST API of each core service. These APIs can
    be publicly exposed and thus accessible from anywhere in the world with public
    internet access: a smartphone, a laptop on the coffee shop WiFi network, or remote
    office.


    There are a variety of ways in which one can interact with OpenStack to create
    virtual resources from anywhere. As we work our way down these various methods,
    the amount of automation increases, allowing a software developer to easily create
    virtual resources and deploy applications on top of those resources with minimal
    user interaction. See Figure 1.5.


    +   - **Horizon dashboard (GUI)**: If you are new to OpenStack, this is the best
    place to begin your journey. You simply navigate to the Horizon URL via the web
    browser, enter your username and password, verify you are scoped to the proper
    project, and then proceed—creating instances, networks, and volumes with the click
    of a button. See Figure 1.4 for where the services are located upon first logging
    in. Because not all OpenStack service features are available via the Horizon dashboard,
    you will need to also interact with OpenStack services via the command-line interface
    to utilize additional functionality.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_43_0.png)


    A majority of the exam objectives can be completed via the Horizon dashboard.
    Each chapter will break down completing objectives via the command-line interface
    and Horizon dashboard (when available).


    +   - **Command-line interface (CLI)**: The OpenStack command line interface will
    unlock a majority of the OpenStack service features and can easily be installed
    on Windows, Mac, and Linux systems. For Linux gurus with Bash shell experience,
    the CLI is the tool of choice.


    +   - **Software development kit (SDK)**: Although the bash shell and OpenStack
    CLI combination are extremely powerful, SDKs provide more expressiveness. One
    example scenario: a developer hosting their popular application on OpenStack virtual
    infrastructure so that additional resources can be automatically provisioned when
    specific thresholds are met. Or, imagine an Android application that allows an
    organization’s employees to create OpenStack resources with a few simple clicks
    of a button. Simply put, OpenStack SDKs allow you to programmatically interact
    with OpenStack services in the comfort of your favorite language. OpenStack SDKs
    are currently available in the following languages: C, C++, Closure, Erlang, Go,
    Java, JavaScript, .NET, Node.js, Perl, PHP, Python, and Ruby.'
