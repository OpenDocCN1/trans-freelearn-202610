    Before you begin, be sure to source the openrc-logistics credentials file, since
    we are working within the logistics project.


    ```

    $ source openrc-logistics

    ```


    Verify that the proper variables are set:


    ```

    $ export | grep OS

    ```


    List all available routers:


    ```

    $ openstack router list

    ```


    List all available networks and verify that provider-network-cli is listed:


    ```

    $ openstack network list --long

    ```


    Set the gateway of router-cli to provider-network-cli.


    For this command, we will need to use the service-based client, python-neutronclient.
    This because version 2.7.12 of python-openstackclient does not support setting
    a router gateway.


    To set the router-gateway with python-neutronclient, run the following:


    ```

    $ neutron router-gateway-set router-cli provider-network-cli

    ```


    ![](img/da864e0670c65edf6f5ab861ef9906b3_230_0.png)


    As of the writing of this book, the python-openstackclient version 3.6 supports
    setting the router gateway with the following command: openstack router set router-cli
    --external-gateway provider-network-cli. Beware! The exam may only contain an
    older version python-openstackclient and not support this.'
