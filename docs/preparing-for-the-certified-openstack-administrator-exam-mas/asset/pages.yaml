    # Exam objective - managing tenant networks


    Tenant networks are a necessary part of life for the OpenStack user. By default,
    a non-admin user can create multiple tenant networks (up to the max project quota)
    and attach multiple subnets to them. The same project/owner philosophy is applied
    to networks and subnets: any newly created network and subnet will be owned by
    the project to which a user was scoped at the time of its creation. Only users
    within the project will be able to manage the newly created networks and subnets.
    Although users can share networks with specific projects via RBAC rules, this
    is outside the scope of the COA review and not a required objective.'
  merge: -1
  img_proc: true
