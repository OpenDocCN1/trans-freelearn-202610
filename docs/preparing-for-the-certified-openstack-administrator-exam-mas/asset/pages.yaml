- pgno: 118
  md: '# 4


    # Glance Image Service


    In the previous chapter, we discussed the Keystone identity service, as well as
    the Keystone-related objectives for the Certified OpenStack administrator exam.
    Now we will discuss Glance. Glance is the OpenStack image service and it provides
    the registration, storage, and delivery of cloud images.


    In this chapter, we will cover the following topics:


    +   - Cloud Images

    +   - Image file formats

    +   - Glance architecture

    +   - Glance image properties versus Glance metadata definitions

    +   - Exam objective - creating Glance images

    +   - Exam objective - downloading Glance images

    +   - Exam objective - sharing Glance images with specific projects

    +   - Exam objective - updating Glance metadata


    After this chapter, you should have a solid understanding of Glance and the skills
    necessary to successfully fulfill all Glance-related objectives on the exam.


    # What is a cloud image?


    If you are new to the elastic cloud world, you may be a bit confused by the concept
    of a cloud image. Think about the process of creating a virtual machine instance
    (if you haven''t done this yet, you will do so in the next chapter). You typically
    provide a name for the instance as well as the memory size, virtual CPU count,
    local disk size, and an image. The virtual machine cannot boot without an operating
    system or something to read from the local disk.'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'In the past, it was customary to download your favorite operating system as
    an ISO, a single archive file of an optical disc. After getting your virtual machine
    booted, you perhaps provided answers during an install menu and went through an
    install wizard.


    It''s important to understand that in the elastic cloud world, agility is the
    priority and we rarely waste time with installers! When one boots an instance
    in an OpenStack environment, it is always required to provide a disk image (we
    can alternately supply an existing volume or Nova snapshot, but more on that later).
    Nova then proceeds to send an API request to retrieve the image from Glance. The
    image is placed on the compute node and the virtual machine is booted.


    Unlike a typical ISO, cloud images that exist in Glance are typically snapshots
    of a disk''s contents. These images have been previously configured by a person
    or script that has gone through the initial installation procedure and has installed
    specific programs and configuration files to ensure it is cloud aware.


    Glance can store these images in a variety of backends called **data stores**.
    Glance supports a variety of data stores, including the local filesystem, NFS,
    or an OpenStack Swift container.


    # Building cloud images


    Although outside the scope of the COA exam, it''s important that we understand
    that the process of building these cloud images is done *outside* of OpenStack.
    Let''s take a quick look at a few popular methods for creating a cloud image:


    +   - **OpenStack disk image builder project**: The OpenStack disk image builder
    project is a tool for automatically building customized operating system images
    for use in clouds. It includes support for building images based on Ubuntu, Red
    Hat, CentOS, SUSE, and many others (https://github.com/openstack/diskimage-builder).

    +   - **Hashicorp Packer**: Packer automates the building of any type of image
    and connects into existing configuration-management frameworks such as Chef and
    Puppet (packer.io).

    +   - **Oracle VirtualBox**: Although extremely tedious, you can use Oracle VirtualBox
    to build cloud images by setting up a virtual machine to your desired state and
    uploading it into Glance (virtualbox.org).'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# Image file formats


    Disk images store all the contents of a hard drive and come in a variety of file
    formats. Here are a few of the most popular options:


    +   - **QCOW2 (QEMU Copy-On-Write)**: Used with the QEMU and QEMU-KVM hypervisors
    and named after their disk storage optimization strategies, which delay allocation
    of storage until actually needed.

    +   - **VMDK (Virtual Machine Disk)**: Initially designed to be used with VMware''s
    line of hypervisors but now an open format compatible with other non-VMware hypervisors
    such as VirtualBox.

    +   - **VHD and VHDX (Virtual Hard Drive)**: Originally created by the Connectix
    Corporation for the Type-2 hypervisor Virtual PC, acquired by Microsoft in 2003.
    It''s commonly used with Microsoft-related products and services, such as Hyper-V
    and Azure.

    +   - **VDI (Virtual Disk Image)**: Used by Oracle''s VirtualBox.

    +   - **ISO (International Organization for Standardization, ISO9660)**: An archive
    file of an optical disc. It is composed of the data contents from every written
    sector on an optical disc, including the optical disc filesystem.

    +   - **RAW**: An uncompressed disk image. Nova will uncompress any compressed
    cloud image and place it into raw format at the time of booting a virtual machine
    instance.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_120_0.png)


    Although we use Glance to register, store, and retrieve images, it does not care
    about the type of data it stores. In fact, Glance will store a .txt, .doc, or
    any other file type you throw at it. It''s up to the OpenStack administrator to
    ensure Glance images are compatible with with the hypervisor (or hypervisors)
    deployed in the environment.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Glance architecture


    See Figure 4.1. Glance is comprised of two primary daemons:


    +   1. **glance-api**: The primary gateway to Glance. One must interact with `glance-api`
    to store and retrieve disk images.

    +   2. **glance-registry**: Responsible for storing metadata associated with the
    image in the relational database. Examples of image metadata include the image
    name, image location, UUID, image size, owner (project ID), availability status,
    and disk format.


    Glance can store images in a variety of data stores, including Swift, Amazon S3,
    the local filesystem on which the `glance-api` daemon resides, or even a publicly
    accessible web server.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_121_0.png)


    Figure 4.1: High-level diagram of the Glance architecture'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'The virtual appliance provided with this book configures `glance-api` to use
    the Swift data store. This is the most common data store used in production OpenStack
    environments.


    # Glance on the Horizon dashboard


    Glance appears on the left side of the **Project Panel Group** in the Horizon
    dashboard. See *Figure 4.2*. In the provided virtual appliance, you can see a
    previously uploaded cloud image called **Cirros**. Cirros is a lightweight, minimal
    operating system image designed for use as a test image for clouds. You would
    never run production workloads on Cirros, but it''s great for cloud education,
    development, and testing! This particular Cirros image is owned by the admin project.
    Also take careful note of the **visibility** column. This particular Cirros image''s
    **visibility** is set to *public*, therefore making it accessible and thus bootable
    to all projects across all domains. **Visibility** is fundamental to understanding
    Glance and passing the Glance-related COA objectives.


    Let''s break down the possible visibility statuses for an image:


    +   - **Public**: Images that are public are available to all projects, across
    all domains in the OpenStack environment. The default Glance `policy.json` file
    only allows a user with the admin role to set an image as public. Public images
    cannot be modified or deleted unless you are scoped to the project that owns the
    image.

    +   - **Private**: Based on the default Glance `policy.json` file, any user with
    any role can upload images to Glance. In order to create/upload an image to Glance,
    a user must be scoped to a project. Once the image is successfully created/uploaded,
    it is owned by the project to which the user was scoped at that time and will
    be shown as *Private*. Any user within that project can now modify the image''s
    properties or boot the image. Any users outside the project that owns the private
    image will not be able to see the image, unless it has been explicitly shared
    with a project.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '+   - **Shared with Project:** If a user has the admin role, they have the
    ability to share an image with one specific project. If a user explicitly shares
    an image with your project, it will show as *Shared with Project*. You cannot
    modify or delete images shared with your project unless you are scoped to the
    project that owns the image.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_123_0.png)


    Figure 4.2: The visibility column on the Horizon dashboard determines whether
    a Glance image is Public, Private, or Shared with Project


    # Glance image properties versus Glance metadata definitions


    When an image is uploaded to Glance, a user can modify metadata associated with
    the image as long as the user is scoped to the project that owns the image. Modifying
    Glance image properties can be a little confusing at first because there are two
    options for doing so on the Horizon dashboard.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'See Figure 4.3. Selecting the Edit Image option from the Horizon dashboard
    allows a user to edit the Name, Description, Format, Minimum Disk/Minimum Ram,
    Public, and Protected properties. These are not definitions set by the Glance
    metadata definitions service, but simply image properties native to Glance images.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_124_0.png)


    Figure 4-3: Editing Glance image properties on the Horizon dashboard


    Glance metadata definitions, on the other hand, are properties that can be set
    on OpenStack resources. The default Glance `policy.json` file only allows users
    with the admin role to manage the metadata definitions, while all other users
    with any other role can apply those definitions to all allowed resources in OpenStack.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'Figure 4.4 shows the Metadata Definitions panel available in the Admin-System
    panel group:


    ![](img/da864e0670c65edf6f5ab861ef9906b3_125_0.png)


    Figure 4.4: The default Glance metadata definitions template loaded by an OpenStack
    administrator


    As you can see, the OpenStack administrator has loaded in the default templates.
    These metadata definition templates are available at `github.com/openstack/glance/etc/metadefs.`


    A typical OpenStack user will be able to apply these loaded properties to resources
    they create in OpenStack. Here''s an example: consider a multi-hypervisor OpenStack
    environment consisting of KVM, Hyper-V, and XEN hypervisors. If a user creates
    a Glance image, they could set metadata on that image to only allow booting it
    on a hypervisor compatible with the image file format.'
  merge: -1
  img_proc: true
