  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_63_0.png)


    OpenStack can be installed on a variety of operating system environments, including
    Ubuntu, CentOS, Fedora, Red Hat Enterprise Linux, SUSE Linux Enterprise Server,
    and OpenSUSE. As of June 2017, a test taker can choose between taking the exam
