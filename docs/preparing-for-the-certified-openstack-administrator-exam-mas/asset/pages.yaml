- pgno: 317
  md: '# Project scope


    Project scope is the most fundamental aspect of any OpenStack environment. If
    you are attempting an objective on the Horizon dashboard, don''t forget to always
    scope yourself to the proper project from the top dropdown. Refer to Figure 11.1.


    If for any reason you do not see a project from the top dropdown, you should jump
    to the CLI.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_317_0.png)


    Figure 11.1: Scoping to a project on the Horizon dashboard


    If you are on the CLI, the easiest way to scope yourself to a new project is using
    the method presented in the previous chapters of this book:


    ```

    $ cp openrc openrc-<project-name>

    ```


    After making a copy of the original openrc file, use the editor of your choice
    to fill in the proper variables for project and tenant:


    ```

    $ nano openrc-<project-name>

    ```'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'Ensure that you set both the OS_PROJECT_NAME and OS_TENANT_NAME variables:


    ```

    export OS_PROJECT_NAME=<project-name>

    export OS_TENANT_NAME=<project-name>

    ```


    ![](img/da864e0670c65edf6f5ab861ef9906b3_318_0.png)


    Although python-openstackclient needs only the OS_PROJECT_NAME variable, some
    older clients may rely on the legacy OS_TENANT_NAME variable. We set it here for
    consistency.


    After saving your file with the newly set variables, source the file to set the
    variables in the current Bash session:


    ```

    $ source openrc-<project-name>

    ```


    Before running any commands, verify that the variables have been set properly!


    ```

    $ export | grep OS

    ```


    You should see output similar to Figure 11.2.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_318_1.png)


    Figure 11.2: Continuing Bash session variables are set to the proper project scope


    # Time management


