- pgno: 283
  md: 'Figure 8.12 is a visual of public users accessing the contents of our container
    with our read ACLs enabled:


    ![](img/da864e0670c65edf6f5ab861ef9906b3_283_0.png)


    Figure 8.12: If the Swift proxy-server (API) URL is externally accessible, any
    user should be able to list and grab the contents of a container with public read
