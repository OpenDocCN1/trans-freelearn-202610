- pgno: 19
  md: 'Chapter 6, Neutron Networking Service, dives into the world of OpenStack networking
    by providing an overview of Neutron and covers exam objectives including managing
    tenant and provider networks, subnets, security groups, routers, and floating
    IPs.


    Chapter 7, Cinder Block-Storage Service, explains Cinder persistent block storage
    and exam objectives including creating volumes, attach/detaching volumes, volume
    snapshots, and creating volume types.


    Chapter 8, Swift Object-Storage Service, discusses the birth of AWS S3, Swift
    object storage, and exam objectives, including setting Access Control Lists (ACLs)
    on containers and setting objectives to expire at specific times.


    Chapter 9, Heat Orchestration Service, explains OpenStack Heat and exam objectives
    including creating and updating stacks.


    Chapter 10, Troubleshooting, shows you how to perform debugging on the OpenStack
    CLI, manage OpenStack daemons, analyze OpenStack log files, and perform basic
    operations on an OpenStack database.


    Chapter 11, Final Tips and Tricks, gives you some useful tips and tricks to keep
    in mind before taking the COA exam.


    Chapter 12, Practice Exam, is a mock COA exam that you can use to put your OpenStack
    skills to test!


    # What you need for this book


    Please download all materials from the official book repository at https://github.com/PacktPublishing/Preparing-for-the-Certified-OpenStack-Administrator-Exam.
    The repository also contains an OpenStack virtual appliance that can be imported
    into VirtualBox to perform all exam objective exercises.


    # Who this book is for


    This book targets IT professionals, system administrators, DevOps engineers, and
    software developers with basic Linux command line and networking knowledge.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Conventions


    In this book, you will find a number of text styles that distinguish between different
    kinds of information. Here are some examples of these styles and an explanation
    of their meaning.


    Code words in text, database table names, Linux programs, folder names, filenames,
    file extensions, pathnames, dummy URLs, user input, and Twitter handles are shown
    as follows: "You can fulfill majority of the exam objectives with `python-openstackclient`."


    A block of code is set as follows:


    ```

    export OS_AUTH_URL=http://192.168.56.56:5000/v3

    export OS_REGION_NAME=RegionOne

    export OS_PROJECT_DOMAIN_NAME=default

    export OS_USER_DOMAIN_NAME=default

    export OS_USERNAME=admin

    export OS_PASSWORD=admin

    export OS_PROJECT_NAME=logistics

    export OS_TENANT_NAME=logistics

    ```


    Any command-line input or output is written as follows:


    ```

    $ openstack help

    ```


    New terms and **important words** are shown in bold. Words that you see on the
    screen, for example, in menus or dialog boxes, appear in the text like this: "From
    the VirtualBox menu bar, select **Preferences**."


    ![](img/da864e0670c65edf6f5ab861ef9906b3_20_0.png)


    Warnings or important notes appear in a box like this.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_20_1.png)


    Tips and tricks appear like this.'
  merge: -1
  img_proc: true
