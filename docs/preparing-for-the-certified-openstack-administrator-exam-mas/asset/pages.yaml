- pgno: 144
  md: '# 5


    # Nova Compute Service


    In the previous chapter, we discussed the Glance image service and the Glance-related
    objectives of the Certified OpenStack Administrator exam. But what use is an image
    if we can''t boot it? That''s where Nova comes in! Nova is the OpenStack compute
    service and it is the core of the OpenStack cloud. It is designed to manage and
    automate pools of compute resources and work with a variety of existing virtualization
    technologies.


    In this chapter, we will cover the following topics:


    +   - Nova architecture

    +   - Hypervisor types

    +   - Exam objective - managing keypairs

    +   - Exam objective - managing flavors

    +   - Exam objective - launching instances

    +   - Exam objective - accessing instances

    +   - Exam objective - snapshotting instances

    +   - Exam objective - managing instance states


    After this chapter, you should have a solid understanding of Nova and the skills
    necessary to successfully fulfill all Nova-related objectives on the exam.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Nova - the compute orchestrator


    The Nova service is the heart of the OpenStack cloud. It is a collection of daemons
    that work to orchestrate availability of compute resources, leveraging virtualization
    features that have been running on Linux machines for years! Rather than reinventing
    the wheel, Nova works with a variety of existing hypervisor technologies, including
    QEMU-KVM, QEMU, Hyper-V, VMware ESXi, Xen, and XenServer. It also supports the
    ability to leverage existing Linux container technologies such as LXC and Docker.
    When one boots an instance, Nova leverages available CPU, memory, and disk resources
    on compute nodes. In a production OpenStack environment, a customer may have anywhere
    from five to 5,000 compute nodes hosting virtual machine instances.


    # Nova architecture


    Figure 5.1 shows a high-level diagram of Nova''s architecture. Nova is made up
    of six daemons:


    +   - **nova-api**: The primary gateway to Nova. One must interact with `nova-api`
    to create, list, delete, and manage instances.

    +   - **nova-scheduler**: Evaluates and filters all available compute hosts to
    determine the best compute node for an instance you''d like to boot. The behavior
    of `nova-scheduler` can be modified based on specific characteristics, such as
    CPU architecture or a specific location in the data center.

    +   - **nova-conductor**: A "database broker" that directly connects to the OpenStack
    environment''s relational database. Because the compute node (or hypervisor) is
    the least trusted component of a multi-tenant virtualized environment, all database
    communication goes through `nova-conductor`.

    +   - **nova-novncproxy**: Provides serial console access to Nova instances via
    a VNC client or web browser.

    +   - **nova-consoleauth**: Receives requests from `nova-novncproxy` to authorize
    a user''s token and maps the private host and port of an instance''s VNC server.

    +   - **nova-compute**: Manages virtual machines on the hypervisor.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_146_0.png)


    Figure 5.1: High-level diagram of Nova architecture


    ![](img/da864e0670c65edf6f5ab861ef9906b3_146_1.png)


    In OpenStack, the term *booting* is used to refer to the creation of a virtual
    machine. A virtual machine booted with Nova is often called an instance. To boot
    an instance with Nova, one would typically provide a desired Glance image and
    Nova flavor. A Nova flavor is a previously provisioned profile of the CPU, memory,
    and local disk desired and will be discussed in more detail in the upcoming sections.


    # Hypervisor types


    Nova is compatible with a variety of hypervisor types. Let''s talk about a few
    of the popular ones:


    +   - **QEMU (Quick Emulator)**: Released in 2003, QEMU is an open source hypervisor
    that provides full system emulation. It can emulate one or several processors
    without assistance from the CPU, although it does have the tendency to be a bit
    slow.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '+   - **XEN**: Released in 2003 and originally a project at the University
    of Cambridge, Xen is open source and implements a technique called *paravirtualization*
    (PV). PV does not require processors with virtualization extensions, and instead
    relies on drivers inside the VM guests. Xen has been used by many popular public
    cloud offerings, including Slice Host, Rackspace, and Amazon Web Services.

    +   - **QEMU-KVM (Quick Emulator-Kernel-based Virtual Machine)**: Released in
    2006, QEMU-KVM is a fork of QEMU that continues to use QEMU to virtualize a guest''s
    peripherals, but also takes advantage of processors with hardware-virtualization
    extensions. QEMU-KVM is fast because of its ability to virtualize guests at near-native
    speeds! This is often referred to as hardware-assisted virtualization or HVM.


    Libvirt is an open source API daemon that is often used for managing any of the
    aforementioned hypervisors. In an OpenStack environment, `nova-compute` will utilize
    the Libvirt daemon, `libvirtd`, to manage virtual machines. See Figure 5.2.


    In addition to these open source hypervisors, `nova-compute` is also compatible
    with Microsoft''s Hyper-V hypervisor, VMware vCenter, and XenServer (a commercially
    supported virtualization product built on Xen).


    ![](img/da864e0670c65edf6f5ab861ef9906b3_147_0.png)


    Figure 5.2: nova-compute is compatible with a variety of commercial and open source
    hypervisors'
  merge: -1
  img_proc: true
- pgno: 148
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_148_0.png)


    Your OpenStack virtual appliance provided with this book is configured to use
    the QEMU hypervisor. If you attempt to boot a larger cloud image (such as Ubuntu
    or Centos), it will run slowly. Unfortunately, VirtualBox does not allow nested
    virtualization, even if you have virtualization extensions turned on in the BIOS
    of your laptop or desktop. See https://www.virtualbox.org/ticket/4032 for more
    information.


    # Exam objectives


    Let''s take a look at the Nova exam objectives.


    The following table breaks down various Nova-related objectives you should know
    for the COA exam. As you can see, all of these tasks can be completed on both
    the Horizon dashboard and CLI. Remember, time is of the essence on the exam—and
    in many cases, it may be faster to tackle a task on the dashboard. If you feel
    confident using the CLI and don''t need to fumble through help to discover arguments,
    feel free to use it!


    ![](img/da864e0670c65edf6f5ab861ef9906b3_148_1.png)


    Figure 5.3: Nova exam objectives'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Exam objective - managing key pairs


    Key pairs are an alternative to password-based authentication when accessing an
    instance over SSH. A key pair consists of two keys: a **public key** and a **private
    key**. These keys must be used together to gain access to an instance.


    When it comes to SSH keys and Nova, an OpenStack user has two options:


    +   1. Send a request to Nova to generate a brand new SSH public and private key
    for you. In this case, Nova will store the public key in its database and give
    you the private key. Once the private key is passed to you, it can no longer be
    recovered. The user must keep the private key in a safe place!

    +   2. If you have previously generated a public and private key pair using `ssh-keygen`
    (or another utility), you can provide your public key for Nova to store in its
    database.


    Once your public key is registered with Nova, you select the name of the public
    key when you boot the instance. This implicitly grants access to anyone with the
    matching private key. When accessing an instance over SSH, you will specify your
    private key and username. If the matching public key is present on the instance,
    you will be granted access.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_149_0.png)


    Multiple users from the same project cannot see each other''s registered public
    keys. Unlike other resources in OpenStack, **public keys are not owned by the
    project**. They are owned by the user that creates or registers it. When you delete
    a user, you also delete the user''s public key from Nova.


    # Horizon dashboard


    Let''s take a look at how to create SSH key pairs from the Horizon dashboard.
    See Figure 5.4.


    +   1. From the OpenStack overview page, scope yourself to the **human-resources**
    project by selecting the top dropdown.

    +   2. Select the **Access & Security** panel from the **Project-Compute** panel
    group.

    +   3. Select the **Key Pairs** tab.

    +   4. Select **Create Key Pair**.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_150_0.png)


    Figure 5.4: Creating a SSH key pair on the Horizon dashboard


    +   5. Name the key pair `my-new-keypair-dashboard` and select **Create Key Pair**.

    +   6. Horizon will automatically present the private key for you to download
    to your local system.


    Nova does not keep a record of the private key. Once you have navigated away from
    the download private key screen, you will no longer be able to retrieve it. Be
    sure to always keep your private keys in a safe place!


    # CLI


    Let''s create another SSH key pair in the `human-resources` project with `python-openstackclient`.


    Recall that the provided openrc file contains credentials in the form of variables
    for proper authentication to Keystone and setting project scope.


    Let''s copy our original openrc file to a new file called `openrc-human-resources`.


    ```

    $ cp openrc openrc-human-resources

    ```


    Now that we''ve made a copy, let''s edit the `openrc-human-resources` file, updating
    the project and tenant name variables to reflect our desired scope to the `human-resources`
    project. If you are more comfortable with another editor, feel free to use it
    here.


    ```

    $ nano openrc-human-resources

    ```'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'Change the following variables to human-resources:


    ```

    export OS_PROJECT_NAME=human-resources

    export OS_TENANT_NAME=human-resources

    ```


    > We are changing the OS_TENANT_NAME variable since some of the older service-based
    clients rely on it instead of OS_PROJECT_NAME.


    Source the newly created openrc-human-resources file:


    ```

    $ source openrc-human-resources

    ```


    Verify that the proper variables are set:


    ```

    $ export | grep OS

    ```


    Now that we are properly scoped, let''s create a a brand new key pair for the
    admin user. We will supply > to redirect our private-key output to a file called
    my-new-keypair-cli.pem.


    ```

    $ openstack keypair create my-new-keypair-cli > my-new-keypair-cli.pem

    ```


    We use > to avoid the standard-output printing of our private key and redirect
    it to a file called my-new-keypair-cli.pem.


    For security, we should also change permissions on the key to only allow us, the
    openstack user logged into the virtual appliance, to read the key.


    ```

    $ chmod 400 my-new-keypair-cli.pem

    ```


    We can confirm that the public key has been created and stored in Nova by running
    the following command:


    ```

    $ openstack keypair list

    ```


    See Figure 5.5. You should see output confirming that the admin user has created
    two separate key pairs: one from the Horizon dashboard and one via python-openstackclient:


    ![](img/da864e0670c65edf6f5ab861ef9906b3_151_0.png)


    Figure 5.5: Output from the ''openstack keypair list'' command'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Exam objective - managing flavors


    In OpenStack, you always need to specify the desired RAM, local disk drive size,
    and virtual CPUs for your virtual machine instance. To control usage, OpenStack
    requires users to choose from a collection of previously defined hardware configurations
    called flavors. See Figure 5.6.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_152_0.png)


    Figure 5.6: A list of Nova flavors in a typical OpenStack environment


    +   - **ID:** UUID of the flavor.

    +   - **Name:** Name of the flavor.

    +   - **RAM:** Amount of RAM to use in megabytes.

    +   - **Disk:** Amount of disk space to use for the root partition in gigabytes.

    +   - **VCPU:** Number of virtual CPUs. By default, Nova uses a 16:1 CPU allocation
    ratio. This allows you to boot sixteen 1VCPU instances per physical core.

    +   - **Ephemeral:** Amount of disk space to use for the secondary partition.

    +   - **Swap:** Amount of disk space to use for swap in gigabytes.

    +   - **RXTX Factor:** This is only used by Xen or NSX-based systems and allows
    throttling of the inbound/outbound traffic from the network attached to the instance.

    +   - **Properties:** Any metadata set on the flavor.


    By default, creating a new flavor is only granted to a user with the admin role.
    As an admin, it''s easy to create and customize new flavors from the Horizon dashboard
    or `python-openstackclient`.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Horizon dashboard


    Let''s create a new flavor from the Horizon Dashboard. See Figure 5.7.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_153_0.png)


    Figure 5.7: The ability to create a new flavor is only accessible to users with
    the admin role (by default)


    +   1. From the OpenStack overview page, scope yourself to the **human-resources**
    project by selecting the top dropdown. As previously mentioned, the **Admin**
    panel group will be available to users with the admin role, regardless of scope.
    We could be scoped to any available project when creating a new flavor.

    +   2. Select the **Flavors** panel from the **Admin-System** panel group.

    +   3. Select **Create Flavor**.

    +   4. **Name (required)**: Name of the flavor. Type in `awesome-flavor-dashboard`

    +   5. **ID (optional)**: UUID of the flavor. Type in `100`. Leaving the ID on
    `auto` will automatically assign a UUID.

    +   6. **VCPU (required)**: Number of virtual CPUs to use. Type in `1`. The default
    overcommit ratio on a hypervisor is 16:1. This means approximately 16 vCPUs for
    one logical processor.

    +   7. **RAM (MB) (required)**: Amount of RAM to use in megabytes. Type in `512`.

    +   8. **Root Disk (GB) (required)**: Amount of disk space to use for the primary
    disk in gigabytes. Type in `1`.

    +   9. **Ephemeral Disk (GB) (optional)**: Amount of disk space to use for the
    secondary disk in gigabytes. Set this to `0`.'
  merge: -1
