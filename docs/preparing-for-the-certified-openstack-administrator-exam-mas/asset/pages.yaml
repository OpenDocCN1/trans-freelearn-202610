  md: 'In this section, we will focus on understanding and creating east/west traffic
    scenarios. If two virtual machine instances are on two different subnets, they
    will not be able to communicate with each other unless there is a router to forward
    traffic between them. OpenStack users can create multiple networks and subnets
    and connect them with routers.


