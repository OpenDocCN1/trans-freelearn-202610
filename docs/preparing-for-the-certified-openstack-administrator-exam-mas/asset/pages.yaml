- pgno: 294
  md: '# Backward compatibility with AWS


    You may have noticed that some of the Heat resources have a prefix AWS::. These
    resources are used to make CloudFormation templates compatible with OpenStack
    Heat. As you know, AWS and OpenStack have many different features so I do not
    recommend attempting to create stacks with templates that have been designed to
    work with AWS environments. You would be much better off refactoring your CloudFormation
    templates with Heat resources. But for the curious, here are a few AWS Heat resources
    and what they do:


    | AWS Heat Resource | Action |

    |---|---|

    | AWS::EC2::Instance | OS::Nova::Server (Creates a Nova instance) |

    | AWS::EC2::SecurityGroup | OS::Neutron::SecurityGroup (Creates a Neutron security
    group) |

    | AWS::EC2::VPC | OS::Neutron::Network (Creates a Neutron tenant network) |

    | AWS::EC2::Volume | OS::Cinder::Volume (Creates a Cinder volume) |

    | AWS::IAM::AccessKey | OS::Nova::KeyPair (Generates a public/private key for
    a specified user) |

    | AWS::S3::Bucket | Similar to OS::Swift::Container (Creates a Swift container)
    |


