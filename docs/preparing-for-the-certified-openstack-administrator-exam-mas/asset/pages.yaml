- pgno: 52
  md: '# Step 1 - study!


    Practice. Practice. Practice. Use this book and the included OpenStack All-in-One
    Virtual Appliance as a resource as you begin your Certified OpenStack Administrator
    journey. If you still find yourself struggling with the concepts and objectives
    in this book, you can always refer to the official OpenStack documentation—or
    even seek out a live training class at https://www.openstack.org/marketplace/training/.


    # Step 2 - purchase


    Once you feel that you''re ready to conquer the exam, head to https://www.openstack.org/coa/
    and click on Get Started. After signing in, you will be directed to checkout to
    purchase your exam. The OpenStack Foundation accepts all major credit cards, and
    costs $300.00 USD as of September 2017 (subject to change, so keep an eye on the
    website). You can also get a free retake within 12 months of the original exam
    purchase date if you do not pass on the first attempt.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_52_0.png)


    To encourage students in academia to get their feet wet with OpenStack technologies,
    the OpenStack Foundation is offering the exam for $150.00 (50% off the retail
    price) with a valid student ID. Check out https://www.openstack.org/coa/student/
    for more info.


    # Step 3 - COA portal page


    Once your order is processed, you will receive an email with access to the COA
    portal. Think of the portal as your personal COA website, where you can download
    your exam receipt and keep track of your certification efforts. Once you take
    the exam, you can come back to the COA portal to check your exam status and score,
    and even download certificates and badges for your website or business cards.


    # Step 4 - hardware compatibility check


    The COA exam can be taken from your personal laptop or desktop, but you must ensure
    that your system meets the exam''s minimum system requirements. A link on the
