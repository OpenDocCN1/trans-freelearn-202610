- pgno: 306
  md: '# 10

    Troubleshooting


    Congratulations! We''ve covered all the OpenStack service-related exam objectives
    in the COA exam. Knowing these objectives will put you in good shape for the exam,
    but keep in mind that there are also some basic OpenStack troubleshooting skills
    that you will need to bring to the table. In this chapter, we will cover the following:


    +   - Debugging the CLI

    +   - Managing OpenStack daemons

    +   - Using the API to check component/agent status

    +   - Exam objective - important OpenStack service directories

    +   - Exam objective - analyzing log files

    +   - Exam objective - managing MySQL


    After this chapter, you should have a solid understanding of successfully meeting
    all troubleshooting-related objectives in the COA exam.


    # Debugging the CLI


    When you use `python-openstackclient` or the traditional service-based clients
    (that is, `python-novaclient`, `python-neturonclient`, or `python-swiftclient`),
    there is a lot going on behind the scenes! To see the API calls being made, we
    can use the `--debug` flag to see the requests and responses in real time. Let''s
    try using it with the following command. Ensure that you source the `openrc` file
    before running it.'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'Although understanding the --debug flag is not required to pass the exam, it
    is an invaluable tool that can really help you narrow down issues in real-world
    OpenStack environments.


    ```

    $ openstack server list --debug

    ```


    We should see output similar to Figure 10-1. Wow, that''s a lot of text!


    ![](img/da864e0670c65edf6f5ab861ef9906b3_307_0.png)


    Figure 10.1: Output from using the --debug flag on the CLI


    How can we decipher this? As you already know from the first chapter of this book,
    we communicate with RESTful APIs via the HTTP protocol. To understand the debug,
    we can look for the requests and responses being made to the Keystone and Nova
    APIs.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_308_0.png)


    Figure 10.2: Initial request/response to the Keystone API


    1. python-openstackclient first makes a GET call to the Keystone authentication
    endpoint specified in the `openrc` file. This is just to ensure that the authentication
    endpoint is alive and responding.


    2. We can see that the Keystone API responds back with an `HTTP 200 OK`. This
    means that the response has succeeded and we are ready to proceed.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_308_1.png)


    Figure 10.3: Request/response to get a scoped token from Keystone API


    3. Although the debug output obscures the body of the request, here, `python-openstackclient`
    sends the username, password, domain, and project name to the authentication endpoint
    in order to request a scoped token.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '4. The response of this request contains the scoped token (not visible on the
    debug output) and the entire OpenStack environment service catalog. `python-openstackclient`
    can use the catalog to look up the nova/compute API endpoint URL.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_309_0.png)


    Figure 10.4: Request/Response to get a list of all running servers from Nova API


    5. `python-openstackclient` then sends a request to the discovered nova/compute
    API endpoint URL from step 4. As you can see, there is an X-Auth-Token header
    in the request, which contains the token. The debug output shows an SHA1 hash
    of the token to obscure the actual token contents.


    6. And finally, we see a response from nova-api: a list of any running instances
    (in the JSON format) within our project. Thanks to `python-openstackclient`, this
    JSON will be converted into a nicely formatted table.


    Although understanding the `--debug` flag is not required to pass the exam, it''s
    an invaluable tool that can really help you narrow down your issue in real-world
    OpenStack environments.


    # Managing OpenStack daemons


    If we are using an operating system with the `systemd` init system, we can easily
    use the `systemctl` command to start, stop, or check the status of any OpenStack
    daemons running on a particular server.


    For example, to check the status of the nova-api service, we can run the following
    command:


    ```

    $ sudo systemctl status nova-api

    ```'
  merge: -1
  img_proc: true
- pgno: 310
  md: 'We should see output similar to Figure 10.5.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_310_0.png)


    Figure 10.5: Output from the systemdctl status command


    This shows us that the nova-api service is currently running and will be started
    on reboot (enabled). If the service was stopped, we could easily start it back
    up by running the following:


    ```

    $ sudo systemctl start nova-api

    ```


    If we want to restart a service, we can run the following:


    ```

    $ sudo systemctl restart nova-api

    ```


    ![](img/da864e0670c65edf6f5ab861ef9906b3_310_1.png)


    The exam does not require you to edit any specific OpenStack configuration files—but
    a good rule of thumb for live OpenStack environments is to remember to restart
    the service any time you want new changes to configuration files to be applied.


    # Using the APIs to check the component status


    Some OpenStack service APIs feature the ability to allow users to check the status
    of the service components without interacting with the daemons directly on the
    physical machine. These are typically admin-role-only functions and are a convenient
    way to verify the OpenStack component health. Let''s try checking the status of
    nova components with the openstack compute service list command:


    ```

    $ openstack compute service list

    ```'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'We should get output similar to Figure 10.6.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_311_0.png)


    Figure 10.6: Output from the ''openstack compute service list'' command


    The output of this command shows us that the nova-conductor, nova-consoleauth,
    nova-scheduler, and nova-compute services are all up and running. In a real-world
    OpenStack infrastructure, we would see multiple nova-compute services for every
    hypervisor in the environment.


    Here are some other services that feature component status commands:


    +   - Neutron

    +   - Cinder

    +   - Heat


    ```

    $ openstack network agent list

    ```


    ```

    $ openstack volume service list

    ```


    ```

    $ openstack orchestration service list

    ```


    # Important OpenStack service directories


    When an OpenStack infrastructure engineer installs a brand new service in an OpenStack
    environment, that OpenStack service''s package will most likely use the following
    directories by default:


    +   - Configuration files


    ```

    /etc/<service-name>/*

    ```'
  merge: -1
  img_proc: true
- pgno: 312
  md: 'In this location, we find configuration files for the respective service, typically
    using the `.conf` file extension. These files control the behavior of the API
    and any associated components that may be installed on the machine. This is also
    the directory where the `policy.json` authorization file resides.


    +   - Data files


    ```

    `/var/lib/<service-name>/*`

    ```


    Data files are where the OpenStack service will store any relevant data. For example,
    in `/var/lib/glance`, Glance will store images in this directory. In `/var/lib/nova`,
    Nova will store the actual data written to an instance''s ephemeral disk as well
    as all associated virtual machine configuration information.


    +   - Log files


    ```

    `/var/log/<service-name>/*`

    ```


    Most OpenStack services will write their log files to this directory. We will
    discuss logs in greater detail in the next section.


    # Exam objective - analyzing log files


    As discussed in the previous section, OpenStack services write log files to `/var/log/<service-name>/*`.
    The OpenStack service operating system packages automatically set up the `logrotate`
    program to tar and compress old OpenStack log files, thus avoiding excessive storage
    consumption. The exception to this default log directory is Keystone and Swift.
    Keystone utilizes Apache and therefore writes log files to `/var/log/apache2/*`.
    Swift writes log files to `/var/log/syslog`.


    Anytime a user makes a request to an OpenStack service''s API, a request UUID
    is generated. You will sometimes see these request IDs when attempting to interact
    with a service on the Horizon dashboard or CLI. To get more information on service
    errors, you can easily browse log files for clues regarding the specific request
    ID.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'For example, when attempting to create a new Neutron security group called
    `default` on the Horizon dashboard, you get an error that looks like Figure 10.7.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_313_0.png)


    Figure 10.7: Error with request-ID generated by attempting to create an additional
    default Neutron security group


    We can then `grep` for that specific request ID in the `neutron-server` log file
    to see the specific time the request was made:


    ```

    $ sudo grep -nar "req-017786ad-5b66-4b06-9dc5-ed35a9dff22c"

    /var/log/neutron/neutron-server.log

    ```


    We should see output similar Figure 10.8:


    ![](img/da864e0670c65edf6f5ab861ef9906b3_313_1.png)


    Figure 10.8: An error in the neutron-server logs when attempting to create an
    additional ''default'' Neutron security group


    ![](img/da864e0670c65edf6f5ab861ef9906b3_313_2.png)


    You will need to either use `sudo` or become the root (`sudo su -`) to analyze
    log files in your virtual appliance environment. The `openstack` user does not
    have permissions to these directories.


    # Managing MySQL


    As an OpenStack administrator, you will most likely rely on an experienced database
    administrator for all OpenStack-related database maintenance. The official OpenStack
    exam requirements contain a broad objective to "analyze database servers and back
    up a database". Here are some basics for working with a MySQL/MariaDB, which should
    put you in good shape for the exam.'
  merge: -1
  img_proc: true
- pgno: 314
  md: 'We can use the mysql command-line tool to explore MySQL on our virtual appliance.


    Run the following:


    ```

    $ sudo mysql -h localhost

    ```


    After connecting, we can run the following command to see all the OpenStack service
    databases:


    ```

    MariaDB [(none)]> show databases;

    ```


    You should see output similar to Figure 10.9


    ![](img/da864e0670c65edf6f5ab861ef9906b3_314_0.png)


    Figure 10.9: Output from the ''show databases'' SQL statement


    To use a specific database, we can run the following:


    ```

    MariaDB [(none)]> use nova;

    ```


    To see all the tables in the Nova database, we can run this:


    ```

    MariaDB [(none)]> show tables;

    ```


    If we wanted to see all the data regarding our virtual machine instances, we can
    run the following:


    ```

    MariaDB [(none)]> select * from instances;

    ```'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'To exit the MySQL/MariaDB prompt, run the following:


    ```

    MariaDB [(none)]> exit;

    ```


    If we wanted to perform a SQL dump of a specific database, you can run this:


    ```

    $ sudo mysqldump -h localhost --databases nova > nova.sql

    ```


    To restore a SQL dump, run the following:


    ```

    $ sudo mysql -h localhost < nova.sql

    ```


    # Summary


    So there we have it! In this section, we covered some general OpenStack troubleshooting
    skills that will prepare you for the COA exam. Remember that the troubleshooting
    domain covers only about 13% of the exam, so don''t expect many questions on this
    content. Although it''s not an exam objective, you should understand how to use
    the --debug flag to provide clues when troubleshooting OpenStack issues on the
    CLI. I also showed you how some OpenStack service APIs allow you to check the
    status of their components/agents. The most important exam objective in this section
    is to remember the OpenStack service log file locations, and how to grep through
    them when identifying specific messages. And lastly, we ended the chapter with
    some very basic MySQL/MariaDB skills, including showing tables of specific databases,
    backing up, and restoring databases.'
  merge: -1
  img_proc: true
