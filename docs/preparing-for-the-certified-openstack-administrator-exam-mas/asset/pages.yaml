- pgno: 250
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_250_0.png)


    Figure 7.7: Creating a block volume from the Horizon dashboard


    +   1. From the OpenStack overview page, scope yourself to the **quality-control**
    project by selecting the top dropdown.

    +   2. Select the **Volumes** panel from the **Project-Compute** panel group.

    +   3. Select **Create Volume**.

    +   4. See Figure 7.8. **Volume Name (optional)**: A name for your volume. Enter
    `volume-dashboard`.

    +   5. **Description (optional)**: A description for the volume. Enter `COA exam
    prep dashboard volume`.

    +   6. **Volume Source (optional)**: By default, any volume you create will be
    completely new and empty. A volume source is an existing data source that you
    would like copied to your volume. The following are examples of volume sources:

    +      1. **No Source, Empty Volume**: An empty volume. The volume must be formatted
    and mounted by your virtual machine instance''s operating system. We will select
    this.

    +      2. **Image**: This copies the contents of an existing Glance image to your
    block volume. You must ensure that the size of your volume is equal to or greater
    than the size of the specified image. This will automatically make your image
    **bootable** so that you can specify it as the primary disk (boot source) when
    booting an instance. This is a powerful feature that will result in your `/dev/vda`
    folder residing on a Cinder storage node, similar to AWS EBS-backed instances.

    +      3. **Volume**: This copies the contents of an existing volume to your block
    volume. You must ensure that the size of your volume is equal to or greater than
    the size of the specified volume.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '+   7. **Type (optional)**: Allows your users to specify a specific volume
    backend previously configured and defined by your OpenStack infrastructure engineers.
    An example would be a group of Cinder storage servers/nodes that only have SSD
    drives. Another example could be a group of Cinder storage nodes that have traditional
    SATA drives. This gives your OpenStack users the power of choice.

    +   8. **Size (required)**: Size of the volume in gigabytes. Enter 1.

    +   9. **Availability Zone (optional)**: Similar to Nova availability zones, Cinder
    availability zones are defined during installation and give you a common method
    for segregating cinder storage nodes. By default, all Cinder storage nodes belong
    to the Nova availability zone.

    +   10. Select **Create Volume**.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_251_0.png)


