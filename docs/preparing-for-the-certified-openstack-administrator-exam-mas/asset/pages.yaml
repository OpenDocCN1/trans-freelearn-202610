- pgno: 176
  md: '# 6


    # Neutron Networking Service


    In the previous chapter, we discussed the Nova compute service and the Nova-related
    objectives of the Certified OpenStack Administrator exam. Now we will discuss
    Neutron. Neutron is a networking service that manages the OpenStack environment''s
    virtual networks, subnets, IP addresses, routers, firewall rules, and more. Because
    Neutron makes up approximately 17% of the COA objectives, fully understanding
    how it works from the administrator perspective is essential to passing the exam.
    Neutron, and SDN (Software Defined Networking) in particular, is a complex topic
    and spans many areas. However, it''s important to remember that the exam does
    not require you to modify Neutron configuration files or work with configuring
    networks outside of the OpenStack environment.


    In this chapter, we will cover the following topics:


    +   - Neutron architecture

    +   - Neutron concepts

    +   - Exam objective - managing tenant networks

    +   - Exam objective - managing tenant subnets

    +   - Exam objective - managing security groups and rules

    +   - Exam objective - managing routers (east/west traffic)

    +   - Exam objective - managing provider networks

    +   - Exam objective - managing provider subnets

    +   - Exam objective - managing routers (north/south traffic)

    +   - Exam objective - managing floating IPs


    After this chapter, you should have a solid understanding of Neutron and the skills
    necessary to successfully fulfill all Neutron-related objectives on the exam.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# About Neutron


    In Chapter 5, we discussed the minimum requirements for booting an instance in
    an OpenStack environment:


    +   - A boot source

    +   - A flavor

    +   - An available Neutron network


    Neutron allows users to create the necessary virtual resources not only to ensure
    that their instances obtain internal IP addresses (also known as **fixed IPs**),
    but also to have the ability to map external IP addresses (also known as **floating
    IPs**) to instances. This allows applications residing in OpenStack instances
    to be externally accessible. With Neutron, users can view their own networks,
    subnet, firewall rules, routers, and load balancers, all through the Horizon dashboard,
    command-line interface, OpenStack SDKs, or directly via the API. Neutron also
    contains a modular framework powered by a variety of plugins, agents, and drivers,
    including LinuxBridge and Open vSwitch.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_177_0.png)


    This chapter provides a brief explanation of Neutron. For a deeper dive, check
    out *OpenStack Networking Essentials* by James Denton, Packt, 2016.


    # Neutron architecture


    Neutron is made up of five daemons, as shown in Figure 6.1.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_178_0.png)


    Figure 6.1: High-level view of Neutron architecture


    +   - **neutron-server**: The API and primary gateway to Neutron. One must interact
    with neutron-server to create, list, delete, and manage networks and other network
    resources.

    +   - **neutron-dhcp-agent**: Provides DHCP services to DHCP-enabled Neutron subnets.
    Behind the scenes, `neutron-dhcp-agent` actually uses `dnsmasq`, the popular lightweight
    DHCP server software, within a network namespace. Network namespaces are a feature
    of the Linux kernel and partition the use of the network, allowing segregation
    of network resources despite similar IP address ranges.

    +   - **neutron-l3-agent**: Creates Neutron routers. Behind the scenes, Neutron
    routers are network namespaces with unique routing tables and `iptables` rules.

    +   - **neutron-metadata-agent**: Provides metadata services to instances. The
    metadata service was popularized by Amazon Web Services and is a non-routable
    IP address (`169.254.169.254`) that a user or script can contact for personal
    information regarding that instance.

    +   - **neutron-linuxbridge-agent**: Runs on each compute node in the environment.
    Responsible for the creation and management of all network-related functions on
    the compute nodes—including the creation of virtual network interfaces for newly-created
    instances, as well as the creation and connection of Linux bridges and `iptables`
    rules.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# LinuxBridge plugin


    In the virtual appliance provided with this book, Neutron is configured to utilize
    the LinuxBridge plugin. The LinuxBridge plugin utilizes existing Linux kernel
    features, as well as Linux programs, to provide virtual networking components.
    The exam does not require you to understand these relationships, but it''s interesting
    to see the magic working behind the scenes.


    | Neutron feature | Existing Linux kernel feature and/or programs |

    |---|---|

    | neutron-dhcp-agent | network namespaces, dnsmasq |

    | neutron-l3-agent | network namespaces, iptables (netfilter kernel module), conntrack
    (conntack kernel module) |

    | neutron-plugin-agent | iptables (netfilter kernel module), iproute2 (gre, vlan,
    and vxlan kernel modules), bridge-utils (bridge kernel module) |


    # Neutron concepts


    Let''s talk Neutron concepts. See Figure 6.2.


    +   - **Network**: A network is analogous to a logical slice of the physical network.
    There are two primary types of networks in Neutron: **tenant networks** and **provider
    networks**:

    +     - **Tenant network**: Created by OpenStack users wishing to boot an instance
    on their very own virtual layer-2 broadcast domain. Tenant networks are always
    owned by the project to which the user is scoped during the network creation request.

    +     - **Provider network**: Typically managed by someone with an admin-level
    role. Provider networks are used to provide network access to resources outside
    the OpenStack environment. This resource could be something like the internet,
    or even a bare-metal database server that exists on a specific VLAN or VXLAN in
    your datacenter.

    +   - **Subnet**: A subnet is an IPv4 or IPv6 address block associated with a
    specific network. A subnet allows the assignment of IP addresses to virtual machine
    instances or other network resources. A subnet must be associated with a network
    in order to boot an instance on it. Upon subnet creation, one always supplies
    a network CIDR. Subnets attached to tenant networks are typically DHCP enabled.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '+   - **Port**: A port is analogous to a virtual network interface card. It
    represents entry and exit points for data traffic. There is always a MAC address
    and UUID associated with a port. A port is automatically created when one boots
    an instance on a network, or one can reserve a port if they prefer a specific
    IP address.

    +   - **Security groups and rules**: Security groups control the traffic to and
    from a port. By default, all traffic is allowed out of an instance and nothing
    is allowed in—except another instance that contains the default security group.

    +   - **Routers**: Routers are devices generated by the `neutron-l3-agent` daemon
    and allow one to connect different broadcast domains together. Neutron routers
    are commonly used to connect traffic from different tenant networks together (east/west
    traffic) as well as connecting a tenant network to a provider network in order
    to access something outside the environment such as the internet (north/south
    traffic).


