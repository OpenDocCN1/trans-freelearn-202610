    # Exam objective - manage provider networks


    Now that we understand how to manage tenant networks and subnets, as well as set
    up east/west traffic between two different tenant networks, let''s create some
    provider networks. Provider networks are critical to any cloud environment because
    they enable OpenStack instances to access external resources beyond the OpenStack
    environment. Nova instances would be pretty useless if they could only talk to
    resources that lived inside the OpenStack environment! What good is an instance
    that can''t talk out to the internet to download the latest operating system packages?
    What good is an instance if our customers can''t access our web application from
    the outside world? Provider networks are the magic that provides network access
    to things that live outside OpenStack.


    # Horizon dashboard


    Before we create a provider network on the dashboard, it''s very important to
    remember that by default, provider networks can only be created by users with
    the admin role.'
  merge: -1
  img_proc: true
