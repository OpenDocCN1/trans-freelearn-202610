    What if we wanted to limit container access to users within our OpenStack environment
    that reside within a specific project?


    We can use the following syntax: --read-acl <project-uuid:user-uuid>


    It''s important that we use the UUID. In a multi-domain environment, this is the
    only way our system knows the specific project and user to which we are referencing.


    Let''s only allow lisaw from the accounting project to be able to read/download
    files from the container-cli container.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_283_1.png)


    Recall from Chapter 3 that we can get a list of all users by running openstack
    user list and all projects by running openstack project list.


    Run the following command. Your UUIDs may be different than what appear here:


    ```

    $ swift post container-cli --read-acl \

    "fe8787fda267442bbea280391e8500d6:2a0c974a13b042e9849a9366a2e5b589"

    ```'
