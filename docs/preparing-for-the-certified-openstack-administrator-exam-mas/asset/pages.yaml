- pgno: 156
  md: '# Horizon dashboard


    Creating instances via the Horizon dashboard is easy. See Figure 5.10.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_156_0.png)


    Figure 5.10: Launching an instance from the Horizon dashboard


    +   1. From the OpenStack overview page, scope yourself to the **human-resources**
    project by selecting the top dropdown. When we create the instance, it will be
    owned by the **human-resources** project.

    +   2. Select the **Instances** panel from the **Project-Compute** panel group.
    You should see two instances in the **Shutoff** state. These two instances are
    owned by the **human-resources** project. We will return to these in a bit.

    +   3. Select **Launch Instance**.

    +   4. Details:


    +   - **Instance Name (required)**: The name of your instance. You can have multiple
    virtual machines with the same name, thanks to the UUID that automatically gets
    assigned to any resource you create. In this section, insert `instance3-dashboard`.

    +   - **Availability Zone**: Nova availability zones are used to partition your
    Nova deployment. This allows you to put compute hosts into logical groups to provide
    physical isolation or hardware differentiation. Nova is the default availability
    zone out of the box and contains all compute nodes in your environment.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '+   - **Count (required)**: The number of instances you''d like to boot. Specifying
    more than one instance will append a -# to the end of the virtual machine. For
    example, if you boot three instances named `myinstance`, they will be named `myinstance-1`,
    `myinstance-2`, and `myinstance-3`. Insert 1 for the instance count.


    5. **Source (required):**


    +   - **Boot Source**: There are three primary boot sources:

    +     - **Boot From Image**: This is the most common type of booting and allows
    the user to select a specific Glance image to boot from. Select the `cirros` image.

    +     - **Boot From Snapshot**: Users can take snapshots of running virtual machines
    to capture the contents of the disk. A user has the ability to boot from an existing
    snapshot residing in Glance.

    +     - **Boot From Volume**: When a user boots an instance from a cloud image
    or snapshot, the primary and/or secondary drives always reside on the local storage
    of the compute node. Booting from a Cinder volume allows us to set an instance''s
    primary or secondary disk off the compute node on a Cinder storage node. The advantages
    of this are data persistence in case of an emergency such as a hypervisor outage
    or planned maintenance. This will be discussed in more detail in Chapter 7, Cinder
    Block-Storage Service.


    6. **Flavor (required)**: Choose from any available flavors. Select `m1.tiny`.


