- pgno: 89
  md: '# The admin life


    The admin user in our virtual appliance environment has the admin role on every
    project in the environment. Because we are logged in with a user who has the admin
    role, the Horizon dashboard exposes an Admin Panel Group, in addition to the Project
    Panel Group. Users who do not have the admin role will not see the admin panel
    group. See Figure 3.8.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_89_0.png)


    Figure 3.8: By default, the Horizon dashboard admin panel group is only seen by
    users with the admin role'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'The admin panel group will allow the logged-in user to see all resources created
    in all projects across all domains. It''s very important to not forget this when
    performing exam objectives. Some exam objectives may require access to the admin
    panel and we will explore this in upcoming chapters.


    # The Identity panel


    The Identity panel is presented to all users, regardless of role. Users with the
    admin role will have more visible options, including the ability to create additional
    projects within the default domain and create new users, groups, and roles.


    Selecting Projects shows you all users across all domains in the environment.


    It''s important to note that with multi-domain turned off in this environment,
    you will lack the ability to create new domains or add new resources to any domain
    other than default. This is where the flexibility of the OpenStack CLI comes into
    play.


    # Keystone and the OpenStack CLI


    95% of the COA objectives can be completed via the Horizon dashboard, but there
    still some tasks that require using the CLI.


    Let''s begin our work on the CLI. Open up your terminal client and SSH into your
    virtual appliance (see Chapter 2, Setting Up Your Practice Exam Environment, for
    instructions on how to do this).


    Recall that an OpenStack user needs to ask their OpenStack administrator (that''s
    you!) for the initial authentication information to get started using OpenStack
    and the CLI. So what''s the minimal amount of information a user would need to
    authenticate against OpenStack?


    +   - **Keystone authentication endpoint:** A URL location of the Keystone API
    daemon. In production OpenStack environments, it is typically a resolvable name
    like `https://mycloud.example.com:5000/v3`, or an external IP address.

    +   - **Domain:** The domain your user lives in.

    +   - **Project:** The project to which you want to be scoped.

    +   - **Username:** Your Keystone username.

    +   - **Password:** Your Keystone password.'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'There are two primary ways a user can provide authentication information to
    OpenStack with the CLI:


    +   1. CLI arguments

    +   2. Bash variables


    Here is an example of an admin user using python-openstackclient with CLI arguments
    to get a list of all users in the environment:


    ```

    $ openstack --os-auth-url http://192.168.56.56:5000/v3 --os-user-domain-name default  --os-project-name
    marketing --os-username admin --os-password admin --os-identity-api-version 3
    user list

    ```


    You should get the following output:


    ![](img/da864e0670c65edf6f5ab861ef9906b3_91_0.png)


    Figure 3.9: Output from the openstack user list command


    In this example, the domain, user, password, and project CLI arguments are being
    sent to the Keystone authentication endpoint. Your credentials are validated and
    your role (admin) is evaluated in comparison to Keystone''s policy.json file.
    Recall that the admin role gives access to everything, so you are seeing a list
    of all users in the environment, across all domains.'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'Can you imagine needing to put CLI arguments into your commands every time
    you want to interact with OpenStack? It would be pretty annoying. This is why
    many people rely on the alternate way of suppling these credentials: Bash variables.


    In the Openstack user home directory (/home/openstack), you should see a file
    called openrc. This file contains the authentication information necessary to
    interact with OpenStack via the CLI. I''ve provided this file for you so you don''t
    need to mess around with creating your own.


    Run the following to set the credentials in your current Bash session:


    ```

    $ source openrc

    ```


    You can verify the variables have been set by running the following command to
    show all variables, and piping them to grep to filter based off the OS prefix.


    ```

    $ export | grep OS

    ```


    After verifying the variables have been set, you can now run a command without
    manually providing credentials:


    ```

    $ openstack user list

    ```


    You should see the same output as Figure 3.9.


    Again, we are seeing users across the entire OpenStack environment across all
    domains. If we wanted to narrow the scope of users within a specific project only,
    we could run the following:


    ```

    $ openstack user list --domain heat

    ```


    You should see output similar to Figure 3.10:


    ![](img/da864e0670c65edf6f5ab861ef9906b3_92_0.png)


    Figure 3.10: Output from the ''openstack user list --domain heat'' command


    It''s important to note that these variables are temporary and only remain for
    the duration of the Bash session. If you are connecting to a real-world production
    OpenStack environment, be careful not to expose your variables to anyone around
    you. You don''t want anyone stealing your password!'
  merge: -1
  img_proc: true
- pgno: 93
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_93_0.png)


    CLI arguments always take priority over Bash variables. If there is a CLI argument
    missing, python-openstackclient will look to the variables in the Bash session
    for the value.


    # Project scope via CLI


    For objectives that require the CLI, it''s critical that you understand how to
    scope yourself to a project. The easiest way to scope to a project on the CLI
    is by simply changing the project or tenant variables inside your credential file.


    Let''s try changing the project scope from the admin project to the legal project.
    Let''s first copy our original openrc file to openrc-legal:


    ```

    $ cp openrc openrc-legal

    ```


    Now that we''ve made a copy, let''s edit the openrc-legal file and update the
    project and tenant name variables to reflect our desired scope to the legal project.
    If you are more comfortable with vim, emacs, or any other editor, feel free to
    use it here.


    ```

    $ nano openrc-legal

    ```


    Change the following variables to legal and save the file. To exit and save your
    changes with nano, hit Ctrl + X, and then Y to save.


    ```

    export OS_PROJECT_NAME=legal

    export OS_TENANT_NAME=legal

    ```


    ![](img/da864e0670c65edf6f5ab861ef9906b3_93_1.png)


    We are changing the OS_TENANT_NAME variable since some of the older service-based
    clients may rely on it.


    Now that we have created a new credential file for the legal project, let''s source
    the file:


    ```

    $ source openrc-legal

    ```


    Verify that the variables have been properly set:


    ```

    $ export | grep OS

    ```'
  merge: -1
  img_proc: true
