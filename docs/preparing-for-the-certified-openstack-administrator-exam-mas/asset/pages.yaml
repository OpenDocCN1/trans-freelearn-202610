- pgno: 45
  md: '# Service-based clients - traditional clients


    Every core OpenStack service has an associated command-line client. Like the OpenStack
    services, the command-line clients are written in the Python programming language
    (available at http://github.com/openstack). The clients also contain the service
    API bindings for developing Python code that can talk directly to a specific service
    without requiring long-winded API requests. For years, the most popular clients
    used by OpenStack administrators were the following:


    +   - `python-keystoneclient`

    +   - `python-glanceclient`

    +   - `python-neutronclient`

    +   - `python-novaclient`

    +   - `python-cinderclient`

    +   - `python-swiftclint`

    +   - `python-heatclient`


    # Python-openstackclient - the unified client


    Because it was quite frustrating to remember commands for each separate client,
    the OpenStack community created a new OpenStack client called OSC (OpenStack Client)
    in 2013. The actual program is named python-openstackclient and available at http://github.com/openstack/python-openstackclient.


    See Figure 1.6. python-openstackclient is a CLI client for OpenStack that brings
    all the traditional service-based clients into a single shell with a uniform command
    structure. It has a consistent and predictable format for all of its commands
    and takes the following form:


    ```

    openstack [<global-options>] <object-1> <action> [<object-2>] [<command-arguments>]

    ```


    For example, if you wanted to create a brand new Nova virtual machine instance,
    you could simply run:


    ```

    $ openstack server create demo-instance1 --flavor m1.tiny --image cirros

    MyFirstInstance

    ```'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_46_0.png)


    Figure 1.6: python-openstackclient brings the traditional service-based clients
    into a single shell with a uniform command structure


    You can also view help commands by running the following:


    ```

    $ openstack help

    ```


    ![](img/da864e0670c65edf6f5ab861ef9906b3_46_1.png)


    The OpenStack clients will be discussed in more detail in upcoming chapters. As
    of September 2017, the COA exam tests on the Newton version of OpenStack. The
    exam will provide access to python-openstackclient and all service-based clients.
    A majority of the exam objectives can be completed with python-openstackclient,
    except where noted in this book.


    # OpenStack daemon communication


    Now that we''ve discussed the various ways in which an OpenStack operator interacts
    with OpenStack via the API, let''s discuss internal communication among the core
    OpenStack services. In Figure 1.7, you can see the color code in the top left
    that shows the service and daemon. The service is simply the name of the OpenStack
    service, while the daemon represents the program that is actually running to bring
    the service to life.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'To avoid tight coupling, communication amongst the daemons within a specific
    service is achieved via an Advanced Message Queueing Protocol (AMQP). In a typical
    OpenStack environment, this can be software such as RabbitMQ or Qpid.


    Recall the cloudy development methodology that we discussed in the history portion
    of this chapter. While OpenStack encourages its software developers to follow
    this methodology when deploying applications on it, the actual OpenStack infrastructure
    follows the exact same principles: highly available, scalable, and loosely coupled.


    For example, when a user sends a request to `nova-api` to boot a server, `nova-api`
    will publish this message on the AMQP bus. This message will then be read by `nova-scheduler`.
    Now let''s visualize an OpenStack cloud that often receives hundreds of requests
    to boot instances. To solve this problem you would deploy more servers in the
    infrastructure, install more `nova-scheduler` daemons, and simply point them to
    the OpenStack environment''s AMQP server. That''s Horizontal scaling in action!


    ![](img/da864e0670c65edf6f5ab861ef9906b3_47_0.png)


    Figure 1.7: OpenStack daemons within a specific service use the AMQP bus to communicate
    among themselves'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# OpenStack API communication


    While the OpenStack service daemons rely on AMQP for communication among daemons
    within their specific service, the APIs are used both by OpenStack users wishing
    to create virtual resources and for service-to-service communication.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_48_0.png)


    Figure 1.8: An example of API communication amongst OpenStack services


    Envision a user sending a request to nova-api to boot an instance. In order to
    boot that server, quite a few internal API calls would need to take place. Let''s
    look at an example sequence of API calls that would take place when booting a
    virtual machine instance.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'An OpenStack user would first send a POST API call to the `nova-api` daemon
    with details about what sort of virtual machine they''d like. That message would
    get put on the AMQP message bus and consumed by the `nova-scheduler` daemon. The
    `nova-scheduler` daemon would then choose the best fit for the virtual machine
    using its scheduling algorithm. The `nova-compute` daemon residing on the compute
    node consumes this message. Before the server can be boot, the following must
    occur (see Figure 1.8):


    +   - (1): The `nova-compute` daemon sends an API request to Keystone to retrieve
    a scoped token.

    +   - (2): `nova-compute` gets back a 200 HTTP response along with a scoped token.
    Now `nova-compute` has a scoped token and can freely communicate with other OpenStack
    services.

    +   - (3): `nova-compute` now sends a request to `neutron-server` to verify whether
    the specified virtual network on which to boot the instance is available.

    +   - (4): `nova-compute` receives a response that the network is available and
    capable of attaching to the instance.

    +   - (5): `nova-compute` must then send an API call to `glance-api` to retrieve
    the operating system image.

    +   - (6): The `glance-api` responds back with the image that will reside on the
    compute node.


    Now our instance will be booted! That was a lot of work!


    ![](img/da864e0670c65edf6f5ab861ef9906b3_49_0.png)


    Don''t worry! You don''t need to understand all the magic occurring behind the
    scenes in OpenStack to be successful on the exam. This is for educational purposes
    only!


    # About the Certified OpenStack Administrator exam


    Now that you''ve learned a bit about OpenStack, let''s get down to why you''re
    really here:


    To pass the Certified OpenStack Administrator exam!'
  merge: -1
