    OpenStack and the Certified OpenStack Administrator Exam, you are free to use
    the official upstream OpenStack documentation at https://docs.openstack.org/ocata/.
    However, I would not rely on this during the exam. Scouring through the site for
    answers will eat up your precious time! If a question appears to be taking longer
    than 4–5 minutes to complete, you should click on the forward button and move
    on! Come back to it later if you still have time left!'
