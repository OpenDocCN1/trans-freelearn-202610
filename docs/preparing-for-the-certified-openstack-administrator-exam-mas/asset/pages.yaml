    # Exam objective - managing security groups and rules


    Now that we have our tenant networks and subnets created, let''s talk about security
    groups. Security groups provide a profile for virtual firewall rules that control
    the inbound (ingress) and outbound (egress) flow of traffic to and from a port.
    This profile is typically associated with an instance''s port.'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Each project contains a default security group that allows all egress traffic
    but denies all ingress traffic. Security groups are frequently used to open ports
    that users may need to access for talking to applications outside OpenStack, as
    well as to prevent unnecessary east-west traffic between different applications
    on the same subnet—thus adding an additional layer of protection.


    Security group rules are stateful and allow established traffic. An example of
    this would be allowing ingress TCP port 22 for SSH. This rule automatically allows
    established return traffic. Another example is allowing egress ICMP for pinging
    out. This will automatically allow return traffic so the user can see a reply
    to their ping.


    # Horizon dashboard


    +   1. From the OpenStack overview page, scope yourself to the logistics project
    by selecting the top dropdown.

    +   2. Select the Access & Security panel on the Project-Compute panel group.
    You should automatically be set to the Security Groups tab. Here you should see
    one current security group called default. By default, there is one default security
    group per project.

    +   3. Let''s examine the rules in the default security group. Select Manage Rules.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_193_0.png)


    Figure 6.16: Managing security groups from the Horizon dashboard'
  merge: -1
  img_proc: true
- pgno: 194
  md: '4. See Figure 6.17. We should now see a list of all rules that belong to the
    default security group. All IPv4 and IPv6 egress traffic is allowed. All IPv4
    and IPv6 ingress traffic is blocked with the exception of traffic coming from
    a port with the default security group. This could be another instance within
    the same project, for example. Let''s select Add Rule.


    5. See Figure 6.18. Rule (required): Rules define which traffic is allowed to
    instances assigned to the security group. We will select ALL ICMP (ping).


    ![](img/da864e0670c65edf6f5ab861ef9906b3_194_0.png)


    Figure 6.17: Managing security group rules from the Horizon dashboard


    6. Direction (required): Ingress (inbound to the instance) or Egress (outbound
    from the instance). We will select Ingress to allow incoming ICMP (ping).


    7. Remote (required): You must specify the source of traffic to be allowed. This
    can be an IP address block in CIDR form or a security group. Selecting a security
    group will allow any other instance with that security group applied.


    8. CIDR (required): To allow incoming ping from any IP address, we can select
    Remote CIDR 0.0.0.0/0. Let''s put that here.'
  merge: -1
