    Figure 8.10: Listing of objects inside a Swift container via a web browser


    If we then navigate directly to the file by typing in the full path name, http://192.168.56.56:8080/v1/AUTH_c03401d3e99f4d4ea1aede321b7a61ff/container-cli/object-cli.txt,
