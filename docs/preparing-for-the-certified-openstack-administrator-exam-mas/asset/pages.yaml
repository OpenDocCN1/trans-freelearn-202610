- pgno: 187
  md: 'When creating subnets, users can specify a variety of parameters: the allocation
    pools that limit availability of which addresses in the subnet, a custom gateway
    address, a list of DNS servers, and individual host routes. We will discuss this
    in more detail in the upcoming section.


    Multiple subnets can be associated with one Neutron network, but they all must
    have a unique CIDR range. To create multiple subnets with the exact same IP address
    range, create another network. This is known as **overlapping IPs**.


    # Horizon dashboard


    Let''s create a tenant subnet from the Horizon dashboard. See Figure 6.10.


    +   1. From the OpenStack overview page, scope yourself to the **logistics** project
    by selecting the top dropdown.

    +   2. Select the **Networks** panel from the **Project-Network** panel group.
    You should see two tenant networks for us to manage:

    +      - **tenant-network1-dashboard**

    +      - **tenant-network1-cli**

    +   3. Select the dropdown next to **tenant-network1-dashboard** and select **Add
    Subnet**.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_187_0.png)


