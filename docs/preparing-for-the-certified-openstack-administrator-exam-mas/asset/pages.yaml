- pgno: 50
  md: '# Benefits of passing the exam


    Ask anyone about getting started in the IT world and they may suggest looking
    into industry-recognized technical certifications. IT certifications measure competency
    in a number of areas and are a great way to open doors to opportunities. While
    they certainly should not be the only determining factor in the hiring process,
    achieving them can be a measure of your competence and commitment to facing challenges.


    # If you pass...


    Upon achieving a passing grade, you will receive your certificate (see Figure
    1.9). Laminate, frame, or pin it to your home office wall or work cubicle—it’s
    proof that you have met all the requirements to become an official OpenStack administrator.
    The certification is valid for three years from the pass date, so don’t forget
    to renew.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_50_0.png)


    Figure 1.9: A certificate you receive when you pass the Certified OpenStack Administrator
    exam'
