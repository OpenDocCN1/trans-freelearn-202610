- pgno: 277
  md: '# CLI


    Surprisingly enough, python-openstackclient does not currently have the functionality
    necessary to set ACLs on containers, although this will be featured in future
    versions. To be consistent and keep things simple, I am going to show you how
    to utilize python-swiftclient, which is included with python-openstackclient.
    Recall that the provided openrc file contains credentials in the form of variables
    for proper authentication to Keystone and setting project scope. In this chapter,
    we will perform all of our Swift-related tasks in the operations project. Let''s
    copy our original openrc file to a new file called openrc-operations:


    ```

    $ cp openrc openrc-operations

    ```


    Now that we''ve made a copy, let''s edit the openrc-operations file and update
    the project and tenant name variables to reflect our desired scope to the logistics
    project. If you are more comfortable with another editor, feel free to use it
    here.


    ```

    $ nano openrc-operations

    ```


    Change the following variables to operations:


    ```

    export OS_PROJECT_NAME=operations

    export OS_TENANT_NAME=operations

    ```


    ![](img/da864e0670c65edf6f5ab861ef9906b3_277_0.png)


    We are changing the OS_TENANT_NAME variable since some of the older service-based
    client may rely on it.


    Source the newly created openrc-operations file:


    ```

    $ source openrc-operations

    ```


    Verify that the proper variables are set:


    ```

    $ export | grep OS

    ```'
