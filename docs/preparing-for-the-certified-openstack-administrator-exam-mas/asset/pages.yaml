- pgno: 128
  md: '# Horizon dashboard


    Creating images via the Horizon dashboard is a fairly easy process. Let''s begin
    by downloading a Cirros cloud image from the official website to our local laptop
    or desktop. It is available at https://download.cirros-cloud.net/0.3.5/cirros-0.3.5-x86_64-disk.img.


    Now that you''ve downloaded Cirros, we need to ensure that we are scoped to the
    procurement project. See Figure 4.7.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_128_0.png)


    Figure 4.7: Before we upload an image to Glance via the Horizon dashboard, ensure
    you are scoped to the procurement project


    +   1. From the OpenStack overview page, scope yourself to the procurement project
    by selecting the top dropdown.

    +   2. Select the **Images** panel from the **Project-Compute** panel group. If
    you look at the current **Public** list of images, you will notice there is currently
    one cloud image with visibility set to `public`. This image is currently accessible
    to all projects across all domains in your environment. We are going to upload
    a new image that will be owned only by the procurement project.

    +   3. Select **Create Image**.

    +   4. See Figure 4.8. **Image Name** (required): the display name for the image.
    Remember that Glance can store multiple images with the same name because it also
    generates an image UUID. Let''s call this image `cirros-dashboard`.

    +   5. **Image Description** (optional): Provides a description of the image you
    are uploading. Let''s put in `Cirros Cloud Image for COA Exam Prep`.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   6. **File Browse** (required): This allows us to specify the file we downloaded
    in the beginning of this section. Click on **Browse** and select the downloaded
    Cirros image from your local system.

    +   7. **Format** (required): Specifies the disk format of the image you are uploading.
    We will specify `QCOW2 -- QEMU Emulator`.

    +   8. **Kernel** (optional): This option allows you to specify a separate kernel
    image for the cloud image you are uploading. Since the kernel already resides
    inside our Cirros Image, we will leave this empty.

    +   9. **Ramdisk** (optional): This option allows you to specify a separate ramdisk
    image for the cloud image you are uploading. Since the ramdisk already resides
    inside our Cirros Image, we will leave this empty.

    +   10. **Architecture** (optional): Architecture is a metadata value that is
    used for your OpenStack instance, but we are going to input `x64` to show our
    OpenStack users that the image is compatible with the `x64` family of processors.

    +   11. **Minimum Disk** (optional): Sets the minimum allowed primary disk when
    one boots an instance with this image. We will set this to `1`. This will require
    anyone who boots the image to specify a flavor with primary disk size of at least
    1 GB. We will discuss flavors in `Chapter 5, Nova Compute Service`.

    +   12. **Minimum RAM** (optional): Set this to 512. This sets the minimum permitted
    RAM when one boots an instance with this image. Set this to `512`.

    +   13. **Visibility:** Select **Private**. Once created, this image will only
    be accessible to users scoped to the procurement project.

    +   14. **Protected:** Select **No**. Let''s leave this image unprotected. We
    could select Yes, which would prevent users from accidentally deleting the image.
    To delete the image, the protected flag must be removed by any user scoped to
    the image owner project (in this case, the procurement project).

    +   15. Select **Create Image**.'
  merge: -1
  img_proc: true
