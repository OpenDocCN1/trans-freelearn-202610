  md: 'Verify that the proper variables are set and you are scoped to the operations
    project:


    ```

    $ export | grep OS

    ```


    Let''s begin by listing our current containers. We should be able to see our container-cli
    container we created in the previous section:


    ```

    $ swift list

    ```


    To view the ACLs for this container, run the following command:


    ```

    $ swift stat container-cli

    ```


    We should see output similar to Figure 8.8.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_280_0.png)


    Figure 8.8: Output from the ''swift stat'' command shows no read or write ACLs
    set on the container


    As you can see, the Read ACL and Write ACL are empty. This means that the container
    is currently private and only accessible to those with the admin or swiftoperator
    role.


    Let''s begin by making a container publicly accessible so anyone on the internet
    can download a file from it. Let''s break down the syntax for the Read ACL.


    Take a look at the following syntax:


    ```

    $ swift post container-cli --read-acl ".r:*,.r:listings"

    ```'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'The .r refers to the referrer header. The referrer header is the address of
    the webpage that is linked to the resource being requested. In other words, if
    someone linked to the object in this container on https://www.openstack.org/,
    the request to Swift for the object would contain openstack.org in the referrer
    header. The wildcard asterisk (*) suggests that the referrer header can contain
    any value and thus come from any website where the Swift link may be published.
    The .rlistings in the syntax enables the container to list all objects in the
    container. Let''s run this command now!


    You won''t get any confirmation output when you set ACLs so we can verify that
    the read ACL has been applied by running the following:


    ```

    $ swift stat container-cli

    ```


    We should see output similar to Figure 8.9.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_281_0.png)


    Figure 8.9: Output from the ''swift stat'' command after setting public read ACLs


    To verify that the container is public, we need to grab the public URL from the
    service catalog.


    Run the following command:


    ```

    $ openstack catalog list

    ```


    Find the Swift public endpoint and copy and paste it into your browser. Be sure
    to append the container name to the end so it looks similar to this:


    ```

    http://192.168.56.56:8080/v1/AUTH_c03401d3e99f4d4ea1aede321b7a61ff/container-cli

    ```'
  merge: -1
  img_proc: true
