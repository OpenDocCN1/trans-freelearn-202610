  md: '# About the Author


    **Matt Dorn** is a senior technical instructor who has previously served in IT
    leadership roles and has helped hundreds of teams around the world build private
    clouds with OpenStack. He understands that many feel a great deal of intimidation
    when approaching open source projects and is fanatical about providing an easy-to-understand
    learning path that makes OpenStack accessible and fun.


