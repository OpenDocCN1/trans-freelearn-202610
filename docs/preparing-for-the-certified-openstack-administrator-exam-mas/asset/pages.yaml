    # Summary


    You should now have a solid understanding of Keystone and the Keystone-centric
    objectives required for the COA exam. Remember the importance of changing one''s
    project scope via the Horizon dashboard and CLI. We need to use the python-openstackclient
    when creating any new domains outside of default and placing projects, users,
    and groups in those domains. We will also need the CLI when adding or removing
    entries from the service catalog.


    In the next chapter, we will use discuss the Glance image service and work through
    all Glance exam objectives via the CLI and Horizon dashboard. Let''s go!'
