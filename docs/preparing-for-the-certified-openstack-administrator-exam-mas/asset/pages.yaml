- pgno: 242
  md: '# 7


    # Cinder Block-Storage Service


    In the previous chapter, we discussed the Neutron networking service and the Neutron-related
    objectives on the Certified OpenStack Administrator exam. Now we will discuss
    Cinder. Cinder is the OpenStack block-storage service, and it allows users to
    create **persistent** volumes that can be mounted as devices by Nova virtual machine
    instances.


    In this chapter, we will cover the following topics:


    +   - About Cinder

    +   - Exam objective - managing Cinder volumes

    +   - Exam objective - attaching/detaching Cinder volumes from instances

    +   - Exam objective - managing Cinder snapshots

    +   - Exam objective - managing Cinder backups


    After this chapter, you should have a solid understanding of Cinder and the skills
    necessary to successfully fulfill all Cinder-related objectives on the exam.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# About Cinder


    When Amazon Web Services EC2 launched in 2006, it looked a lot different than
    we know it today. One of the primary differences was how AWS handled virtual machine
    storage. At that time, AWS only offered **ephemeral** storage for virtual machine
    instances. Consider a user booting an EC2 instance with an instance type (or flavor)
    that offered a 20 GB primary disk and a 50 GB secondary disk. Any data written
    to those local disks (that is, `/dev/xvda` or `/dev/xvdb` inside the operating
    system) would reside on the compute node hosting that instance. See Figure 7.1.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_243_0.png)


    Figure 7.1: Amazon EC2 virtual machine ephemeral storage


    It wasn''t long before many users encountered problems:


    +   - Data copied to the disks could not be easily transferred to other virtual
    machines.

    +   - Stopping or terminating the instance meant complete data loss (once started
    again, the virtual machine would boot another compute node with newly provisioned
    disks).

    +   - If the instance failed, your data was not accessible and could not be easily
    recovered.'
  merge: -1
  img_proc: true
- pgno: 244
  md: 'If users were looking to persist their data, they were encouraged to use S3,
    the object storage service.


    In April of 2008, AWS made a huge announcement that changed all of this forever.
    "Our forthcoming persistent storage feature will give you the ability to create
    reliable, persistent storage volumes for use with EC2" said the announcement blog
    post. "These volumes can be thought of as raw, unformatted drives which can be
    formatted and then used as desired (or even used as raw storage if you''d like)."


    This was an incredible moment in IT history: the introduction of elastic cloud
    persistent block storage!


    Similar to a portable USB drive, a user creates a block volume specified in gigabytes.
    Once attached to a virtual machine instance, the volume appears as a raw unformatted
    hard drive inside the operating system. Once the drive is formatted, it can be
    mounted and used like a traditional hard drive. All data written to the disk would
    actually reside on a dedicated server within the AWS data center, not the compute
    node where the instance resides. See Figure 7.2.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_244_0.png)'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'Now, users also have the ability to utilize their primary drive (that is, `/dev/xvda`)
    as an EBS volume. See Figure 7.3. This provides full data persistence for the
    base operating system in the event of instance failure; it''s known as an "EBS-backed"
    instance.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_245_0.png)


    Figure 7.3: The primary hard drive can also be backed by a block volume


    Inspired by AWS elastic block storage, OpenStack introduced the concept of block
    volumes inside the Nova project in the Bexar version in 2011. In 2012, the OpenStack
    Folsom release introduced block storage as its own project, called Cinder.


    # Cinder architecture


    Cinder is made up of four daemons, as shown in Figure 7.4:


    +   - **cinder-api**: The API and primary gateway to Cinder. One must interact
    with `cinder-api` to create, list, delete, and manage block volumes, snapshots,
    and backups.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '+   - **cinder-scheduler**: Evaluates and filters all available storage nodes
    to determine the best storage node for a block volume you''d like to create. The
    behavior of `cinder-scheduler` can be modified based off specific characteristics
    such as capacity or storage capability.

    +   - **cinder-volume**: Resides on the Cinder storage nodes and is responsible
    for the creation and deletion of block volumes.

    +   - **cinder-backup**: Assists in backing up block volumes to OpenStack Swift
    or other third-party storage targets.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_246_0.png)


    Figure 7.4: High-level view of Cinder architecture


    # Cinder behind the scenes


    By default, Cinder is powered by two specific technologies:


    +   1. **LVM (Logical Volume Manager)**: The LVM toolset was developed in the
    late 1990s to allow users to add and replace hard drives without downtime or service
    disruption. This is done by creating single logical volumes of entire hard disks,
    thus allowing dynamic resizing.

    +   2. **iSCSI (Internet Small Computer Systems Interface)**: iSCSI is an IP-based
    storage standard for providing block-level access to storage devices across a
    network.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'Consider a user creating a Cinder block volume. The user sends an API request
    to cinder-api via the Horizon dashboard or CLI. Once the cinder-api receives the
    request, it updates the Cinder database with details about the volume and places
    it on the message bus. cinder-scheduler determines the best Cinder storage node
    to provision the requested volume. Once selected, cinder-volume is responsible
    for generating the LVM commands to create the logical volume from a predefined
    volume group. The user then sends an API call to nova-api to attach the volume
    to the instance of their choice. This connection process is actually an iSCSI
    connection between the instance''s compute node (the initiator) and the Cinder
    storage node (the target). See Figure 7.5. The user can then proceed to format
    the block device and write data to it within the instance''s operating system.
    All data written to Cinder is stored in Cinder storage. The user can then detach
    the volume from the instance and reattach it to another instance, thus reestablishing
    the iSCSI connection to a different compute node.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_247_0.png)


    Figure 7.5: Cinder uses LVM and iSCSI to present raw block devices to Nova instances'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# Cinder backend software and hardware drivers


    Cinder supports a variety of software and hardware drivers for the storage backend.
    In the case of hardware drivers, this allows users to utilize existing hardware
    storage devices (such as SAN or NAS) as Cinder storage nodes.


    | Software drivers | Hardware drivers |

    |---|---|

    | LVM | NetApp |

    | NFS | Dell EqualLogic |

    | GlusterFS | EMC V-MAX |

    | Ceph | SolidFire |


    # Cinder concepts


    +   - **Volume**: A raw unformatted block device that can be attached to a Nova
    virtual machine instance. It can then be used as a traditional hard drive by the
    instance''s operating system.

    +   - **Snapshot**: A read-only, point-in-time copy of a volume''s contents. A
    snapshot can be created from a volume that is currently in use or in an available
    state. The snapshot can then be used to create a new volume.

    +   - **Backup**: A compressed, archived file of a volume''s contents stored in
    a Swift object storage container, or another third-party provider such as Google
    Cloud Platform.'
  merge: -1
  img_proc: true
