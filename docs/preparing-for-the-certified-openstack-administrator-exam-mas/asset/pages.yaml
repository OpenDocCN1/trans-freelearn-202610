- pgno: 217
  md: "+   3. **Provider Network Type** (required): We can specify a tagging or encapsulation\
    \ method for the provider network. This is useful if we want the provider network\
    \ to link to a resource that resides on a specific VLAN, VXLAN, or GRE tunnel.\
    \ We also have the ability to select FLAT to represent no encapsulation or tagging\
    \ of the provider network traffic. Let's specify FLAT.\n+   \n+   4. **Physical\
    \ Network** (required): The name of the physical interface mapping we want associated\
    \ with this provider network. This is not an interface name (such as eth0, eth1,\
    \ or eth2) but rather a label defined in the file `/etc/neutron/plugins/ml2/linuxbridge_agent.ini`.\
    \ I have previously created a mapping between the interface veth1 on the virtual\
    \ appliance and the label `public-dashboard`. This network will provide your OpenStack\
    \ environment access to the outside world, a.k.a. the internet (as long as you\
    \ have internet access on your host machine). Type in `public-dashboard`.\n+ \
    \  \n+   5. **Segmentation ID** (optional): You only need to specify the segmentation\
    \ ID if you specify a VLAN, VXLAN, or GRE Provider Network Type in Step 6. This\
    \ could be a VLAN tag, VXLAN VNI, or GRE ID. We will leave this blank since we\
    \ are using Provider Network Type FLAT (no encapsulation/tagging).\n+   \n+  \
    \ 6. **Admin State** (required): The Admin State controls whether the provider\
    \ network is off or on. If you set it in the DOWN state, any subnets you associate\
    \ with the provider network will not be functional until turned back to UP. Verify\
    \ it is set to UP.\n+   \n+   7. **Shared** (optional): If a provider network\
    \ is shared, all projects across all domains will be able to directly attach their\
    \ instances to this provider network. We are only going to allow our users to\
    \ set their router gateways to the provider network, so we will make sure we uncheck\
    \ this option.\n+   \n+   8. **External Network** (optional): This is the magic\
    \ that allows our users to set their router's gateway to the network. This will\
