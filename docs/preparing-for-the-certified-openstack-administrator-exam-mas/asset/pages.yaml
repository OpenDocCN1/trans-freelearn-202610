- pgno: 78
  md: '# 3


    # Keystone Identity Service


    Let''s begin our preparation of the Certified OpenStack Administrator exam objectives
    by discussing Keystone, the OpenStack identity service. Understanding Keystone
    is one of the primary building blocks of passing the COA exam.


    In this chapter, we will cover the following topics:


    +   - Authentication and authorization?

    +   - Keystone architecture

    +   - Keystone concepts

    +   - Authentication in action

    +   - Project scope on the Horizon dashboard and CLI

    +   - Exam objective - managing quotas

    +   - Exam objective - managing users, roles, groups, projects, and domains

    +   - Exam objective - managing the service catalog - services and endpoints


    After this chapter, you should have a solid understanding of Keystone and the
    skills necessary to successfully fulfill all Keystone-related objectives on the
    exam.


    # About Keystone


    All users and services rely on Keystone. Without Keystone, users would not have
    the ability to properly authenticate and create virtual machines, networks, and
    other resources. OpenStack services would not be able to properly authenticate
    in order to successfully fulfill user requests, or to make requests to other OpenStack
    services.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Authentication or authorization?


    Before we begin to dive into the details of Keystone, let''s take a moment to
    think about the concepts of **authentication** and **authorization**. These two
    words are sometimes misused, so let''s provide a proper definition.


    **Authentication** is the act of confirming the identity of a specific user—in
    other words, proving that a user is whom she or he claims to be.


    **Authorization** is the function of determining access rights for that specific
    user.


    Keystone has a variety of functions, but first and foremost, it provides **authentication**.
    All OpenStack users are required to authenticate to Keystone via the **Horizon
    dashboard**, **command-line interface (CLI)**, SDK, or directly to the **API**.


    Once a user is authenticated, Keystone is not involved in determining the user''s
    access rights. Access rights include things such as whether a user can create
    a Neutron virtual router or perhaps create Glance images that are publicly accessible.
    This **authorization** is handled by a file called `policy.json`, and it lives
    in each installed OpenStack service''s configuration directory. The exam does
    not require you to understand how to modify authorization via this file, but understanding
    the difference between authentication and authorization is fundamental before
    we proceed.


    # Keystone architecture


    Let''s take a brief look at the Keystone architecture. Keystone is the common
    authentication system across the entire cloud, receiving more requests than any
    other OpenStack service. Since the Liberty version of OpenStack, the Keystone
    development team moved over to using Apache as the API frontend to Keystone. See
    Figure 3.1. The Apache daemon is bound to port 5000 and is the primary gateway
    to Keystone. All users and services rely on Keystone for authentication. The OpenStack
    environment''s relational database management system (typically MariaDB, a fork
    of MySQL) contains a Keystone database that stores data for all the various Keystone
    resources.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_80_0.png)


    Figure 3.1: Keystone is the central OpenStack authentication service and utilizes
    the Apache web server for its frontend web server. All users and OpenStack services
    are required to authenticate to Keystone


    # Keystone concepts


    Let''s take a look at some common Keystone terminology. If you are a bit confused
    by the introduction of these concepts, don''t worry. We will cover all of them
    in more detail as we work through specific exam objectives and perform tasks in
    our lab environment.


    +   - **Domains:** Domains are high-level logical containers used for users, groups,
    and projects. Consider a new IT company wanting to create an OpenStack public
    cloud. If this company really wanted to make an impact in the IT world, they would
    need to host and support more than one customer signing up for their very own
    OpenStack account. The company would most likely put each new customer in their
    own domain. Similar to popular public clouds such as Amazon Web Services or Google
    Cloud Platform, each customer would create resources that are segregated from
    other customers residing in the same environment. The customer would not only
    be able to create their very own virtual resources, such as virtual machines or
    networks, but also create their very own users, projects, and groups within that
    domain.'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Almost every resource or object in OpenStack gets a **universal unique identifier
    (UUID)**. Although we can assign human-readable names to these resources, the
    UUID is used to uniquely identify resources and objects in logs, databases, and
    other areas of the OpenStack infrastructure.


    +   - **Projects:** A project represents an area where resources get created.
    Consider our previously mentioned company running an OpenStack public cloud. They
    set up each customer in their own domain and within that domain allow the customer
    to create multiple **projects**. See Figure 3.2. These projects would most likely
    be representations of various business units so that they could easily segregate
    resources. Users existing in other projects would not be able to see resources
    created in your project unless explicitly shared. Accounting, finance, or human-resources
    are examples of projects possible in real-world OpenStack projects. A user could
    certainly belong to one or more projects, but they can only be authenticated to
    one project at one time. The concept of authenticating oneself to a single project
    is called **scope**. Any resource an authenticated user creates is always owned
    by the project to which the user is currently scoped. There are a few exceptions,
    but we will discuss them later in the book.


    Don''t get confused if you hear people in the OpenStack world use the word **tenant**.
    In previous versions of OpenStack, "tenant" was used to describe what we now know
    as projects. You may even hear someone referring to projects as accounts! **Projects,
    tenants, and accounts** all mean the same thing in the OpenStack world.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_81_0.png)


    Figure 3.2: Domains are high-level logical containers used for users, groups,
    and projects. Projects live inside domains and represent an area where virtual
    resources get created'
  merge: -1
  img_proc: true
- pgno: 82
  md: '+   - **Users:** Users are that have been created for individual people in
    an organization. Users typically reside in the Keystone database, but could possibly
    live in an Active Directory or LDAP server. Each domain can contain any number
    of users; because each resource is assigned a UUID, two user accounts existing
    in different domains can have the exact same name. Another thing to keep in mind
    is that you will always see user accounts residing inside Keystone that are not
    human users! Remember how we saw that Keystone provides a common authentication
    system across the entire OpenStack cloud? Well, not only do users authenticate
    against Keystone, but OpenStack services such as Glance, Neutron, and Nova do
    as well. There will almost always be a project called **service** in any OpenStack
    cloud. The service project will always contain user accounts for each OpenStack
    service (Glance, Neutron, and so on) installed in that particular OpenStack environment.
    When a service wants to talk to another service, it must authenticate via its
    user account residing in the **service** project. Keystone is the only user account
    you will not see in the service project, because Keystone does not need to authenticate
    against itself.

    +   - **Roles:** Roles are labels that are applied directly to a user or a group.
    Remember when we discussed that Keystone has nothing to do with authorization?
    A role is just a label associated with a user on a project. A file called `policy.json`
    handles authorization by determining what a user with a specific role can or cannot
    do. See Figure 3.3. When user lisad authenticates to Keystone and gets scoped
    to the **Trade** project, she has the `_member_` role. If Lisa wanted to boot
    a virtual machine, the `policy.json` file found in the **nova** configuration
    directory (`/etc/nova/policy.json`) would define whether the `_member_` role can
    boot instances (without modifications, a user with `_member_` should be able to
    boot instances). We also see that user frankd has the **read-only** role on the
    **Legal** project. If Frank authenticates and scopes to the Legal project, he
    may want to create a Neutron network, but unfortunately will not be able to do
    so because of the Neutron `policy.json` file—which explicitly declares the read-only
    role as only being capable of listing networks. As an OpenStack Administrator,
    you may have some part to play in defining these roles via the `policy.json` file,
    but your customers never will. A customer only has the ability to see which roles
    exist and apply them to users on a project.'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'Don''t get too caught up editing configuration files such as `policy.json`.
    There are no exam objectives regarding configuration file modification in the
    current official COA objective requirements.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_83_0.png)


    Figure 3.3: Roles are labels that get applied directly to a user or group on a
    specific project. When a user is scoped to a project, they receive their associated
    role


    +   - **Groups:** Groups are a newer Keystone concept that provide an easy way
    to apply an existing role to multiple users. They are optional and were created
    to eliminate the hassle of applying roles to one user at a time. See Figure 3.4.
    User frankd is a part of the **Interns** group on the **Legal** project. Because
    the **read-only** role is assigned to the **Interns** group on the **Legal** project,
    Frank automatically gets the **read-only** role when he authenticates and scopes
    to the **Legal** project. User lisad is a member of the **Operators** group. Lisa
    will get the _member_ role when she authenticates and scopes to the Trade project.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_84_0.png)


    Figure 3.4: Groups are an optional container for users. They are an easy way to
    apply an existing role to multiple users at one time


    +   - **Quotas**: Quotas determine the quantity or size of resources that can
    be created within a specific project. They act as guardrails by preventing users
    from exceeding capacity. Although each OpenStack service keeps track of the utilization
    of these resources, adjusting quotas is easily done within the Keystone panel
    of the Horizon dashboard (which will be shown later in this chapter).

    +   - **Service Catalog/Endpoints**: The Service Catalog is a map stored in Keystone
    that contains a list of services and endpoints. I like to think of the Service
    Catalog as the OpenStack telephone book. It provides a listing of API endpoints
    for all services installed in the environment. There are three URLs provided for
    each service in the catalog: public, internal, and admin; we will talk about this
    in more depth when we discuss the Keystone exam objectives.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# Keystone in your virtual appliance


    Figure 3.5 shows you the Keystone layout of the COA virtual appliance provided
    with this book. As you can see, there are two domains present: **Default** and
    **Heat**. When one initially sets up an OpenStack environment, the default domain
    is just that: the default domain! In the case of our lab environment, the various
    projects we will work with are all within the default domain.


    Notice how the users in our cloud have the _member_ role. This role, although
    not explicitly defined in the `policy.json` file for each respective service,
    is simply a way to give users regular operator rights. With this role, users can
    create, read, update, and delete resources, as long as they own that resource.
    Notice how the admin user has the admin role assigned to it and has access to
    all projects in the domain. The admin role is defined in all `policy.json` files
    as having full admin access to all projects within all domains. I know this seems
    to be a bit non-secure, but keep in mind that we would never give the admin role
    to a customer in an environment with customers in each domain. To work around
    this, OpenStack administrators create **domain_admin** roles. This is outside
    the scope of COA prep, but for more information on this, visit https://wiki.openstack.org/wiki/Horizon/DomainWorkFlow.'
  merge: -1
  img_proc: true
