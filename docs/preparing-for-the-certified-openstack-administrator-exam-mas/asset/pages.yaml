  md: '**Floating IP:** An alternate way of getting access to an instance is by associating
    a floating or external IP address with your instance and connecting via SSH from
    your system. Keep in mind that this not only requires configuring provider networks
    in your OpenStack environment but also allowing incoming traffic on port `22`.
    We will discuss this more in Chapter 6.


    **Network Namespace:** If you have access to the actual underlying servers where
    the OpenStack services are installed, you have the ability to access your instances
    via network namespaces. Network namespaces are a feature of the Linux kernel and
    allow isolation of network interfaces and routing tables. Any time an OpenStack
    user creates a DHCP-enabled Neutron network, a network namespace gets created.
    This is outside the scope of the exam, but a user with access to the OpenStack
    infrastructure can gain access to OpenStack instances by SSH-ing into the instance
    via the namespace. An example would be `ip netns exec <qdhcp-namespace_id> ssh
    <instance-fixed-ip-address>`.


