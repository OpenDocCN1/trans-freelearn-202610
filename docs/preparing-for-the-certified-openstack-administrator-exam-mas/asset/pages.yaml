    # Service-based clients versus OpenStack client


    One of the biggest questions from OpenStack newcomers is whether to use python-openstackclient
    or the older service-based clients such as Neutron (python-neutronclient), Nova
    (python-novaclient), or Cinder (python-cinderclient). Any time we interact with
    the Keystone v3 API, you must use the python-openstackclient. All Keystone-related
    COA objectives that cannot be performed on the Horizon dashboard will require
    you to use python-openstackclient.


    # Exam objectives


    Now that we have a good idea of how to authenticate and scope ourselves to a specific
    project with Keystone via the Horizon dashboard and CLI, let''s take a look at
    the exam objectives.'
  merge: -1
  img_proc: true
