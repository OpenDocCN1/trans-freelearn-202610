- pgno: 298
  md: '8. **Stack Name** (required): Name of the stack to be created. Let''s name
    this `stack-dashboard`.


    9. **Creation Timeout** (required): Minutes to wait before canceling the stack.
    This will automatically cancel the stack creation process if the stack does not
    complete. Leave this as the default.


    10. **Rollback On Failure** (optional): If checked, this will undo the stack creation
    process, cleaning up any created resources. We will leave this unchecked.


    11. **Password for user "admin"** (required): This is the password for the current
    user logged into the dashboard, in our case, `admin`. We provide this for security
    purposes (although it can be disabled in the Horizon dashboard with the `enable_user_pass`
    value in the dashboard config file at `/etc/openstack dashboard/local_settings.py`).
    Enter `admin`.


    12. **Flavor** (required): The input parameter specified in our Heat template.
    The flavor we want to use for our instance. Let''s use `m1.tiny`.


    13. **Image** (required): The input parameter specified in our Heat template.
    The image we want to use for our instance. Let''s use `cirros`.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_298_0.png)


    > When providing parameters of existing OpenStack resources to Heat, it''s sometimes
    safer to provide their specific UUIDs rather than the names. This helps in avoiding
    conflicts when you may have multiple resources with the same name.


    14. **Net** (required): The input parameter specified in our Heat template that
    refers to the network we want our instance to attach to. Let''s use `tenant1-dashboard`.


    15. **ServerName** (required): The input parameter specified in our Heat template.
    The name we want for our server.


    16. **VolumeName** (required): The input parameter specified in our Heat template.
    The name of the volume we want our stack to create and attach to the instance.'
  merge: -1
  img_proc: true
