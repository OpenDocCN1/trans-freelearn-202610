- pgno: 268
  md: '# 8


    # Swift Object-Storage Service


    In the previous chapter, we discussed the Cinder block-storage service and the
    Cinder-related objectives on the Certified OpenStack Administrator exam. Now we
    will discuss Swift. Swift is the OpenStack object-storage service, and it provides
    users with redundant cloud storage accessible via a RESTful API.


    In this chapter, we will cover the following topics:


    +   - Swift architecture

    +   - Swift concepts

    +   - Exam objective - managing containers and objects

    +   - Exam objective - setting ACLs on a container

    +   - Exam objective - setting objects to expire


    After this chapter, you should have a solid understanding of Swift and the skills
    necessary to successfully fulfill all Swift-related objectives on the exam.


    # About Swift


    If you wanted to sign-up with a website hosting provider in the late 90''s or
    early 2000''s, you usually used a provider that would give you access to a server.
    That server would be allocated a particular amount of storage for you to use and
    store your files on. All for one monthly cost. You could upload your website''s
    HTML pages, photos, and other static files via Secure SSH or an FTP client. If
    you needed additional storage, you would submit a request and the hosting provider
    would expand your capacity.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'In 2006, AWS launched one of their first services: Amazon Simple Storage Service,
    or S3 for short. Amazon advertised S3 as "highly scalable, reliable and low-latency
    data storage infrastructure at very low costs." But what did this mean? Well,
    let''s break down a few points to show why there was so much hype around S3 at
    that time:


    +   - Unlike popular hosting providers at that time, a user could pay for what
    they actually used, as they used it (as long as they had a credit card on file).
    This was much like an electricity or utility bill.

    +   - The user could store their files via a web API, allowing them to integrate
    programmatic uploading and downloading into their web application code (consider
    a photo album web application: super powerful!).

    +   - It was incredibly cheap! Users could store thousand of objects for a few
    dollars a month.

    +   - All objects were written to three different failure domains, so you were
    covered in the event of a server failure in an AWS data center.


    Now, some of the most popular applications in the world use S3. Dropbox is a frontend
    that uses S3 to store your files, and Pinterest and Tumblr use S3 to host images!


    In August 2009, Rackspace was inspired by Amazon S3 and began working on their
    very own object-storage service called Cloud Files (still available today). This
    project became what we know as OpenStack Swift, the open source scalable redundant
    storage system with a RESTful API. Like S3, Swift presents users with an object-storage
    service that makes storage appear limitless. It also features a lot of cool extras,
    such as static website hosting, object versioning, access control lists (ACLs),
    and object expiration.


    Behind the scenes, OpenStack Swift writes the objects to multiple disk drives
    spread through servers in the datacenter. Swift''s software (written in Python
    like other OpenStack services), is responsible for ensuring data replication and
    integrity across the cluster. Should a server or hard drive fail, Swift replicates
    its contents from other active nodes to new locations in the cluster. Storage
    clusters scale horizontally simply by adding new servers. Because OpenStack uses
    software logic to ensure data replication and distribution across different devices,
    inexpensive commodity hard drives and servers can be used.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_270_0.png)


    Figure 8.1: Swift allows users to upload and download files via a RESTful API


    # Swift architecture


    Swift is made up of fourteen primary daemons, as shown in Figure 8.2:


    +   - **swift-proxy-server**: The API and primary gateway to Swift and responsible
    for tying together the rest of the Swift architecture. One must interact with
    swift-proxy-server to create containers, upload objects to those containers, set
    ACLs, and enable special features such as object versioning or enabling static
    websites. For each request, it will look up the location of the account, container,
    or object in the ring and route the request accordingly.

    +   - **swift-object-server**: Responsible for retriving and deleting objects
    stored on local drives in the Swift cluster. Objects are stored as binary files
    on the filesystem, with metadata stored in the file''s extended attributes (xattrs).
    This requires that the underlying filesystem choice for object servers support
    xattrs on files. Each object is stored using a path derived from the object name''s
    hash and the operation''s timestamp.

    +   - **swift-object-auditor**: Crawls the local object system checking the integrity
    of objects. If corruption is found, the file is quarantined, and replication will
    replace the bad file from another replica.

    +   - **swift-object-expirer**: Offers scheduled deletion of objects.

    +   - **swift-object-reconstructor**: Daemon for reconstruction of erasure code
    objects.

    +   - **swift-object-replicator**: Keeps the system in a consistent state in the
    face of temporary error conditions such as network outages or drive failures.
    The replication processes compare local data with each remote copy to ensure they
    all contain the latest version. Object replication uses a hash list to quickly
    compare subsections of each partition.

    +   - **swift-container-server**: Handles the listing of objects within a particular
    container. The listings are stored as SQLite database files, and are replicated
    across the cluster (similar to objects).'
  merge: -1
  img_proc: true
- pgno: 271
  md: '+   - **swift-container-auditor**: Crawls the local container system, checking
    the integrity of SQLite database files. If corruption is found, the file is quarantined,
    and replication will replace the bad file from another replica.

    +   - **swift-container-replicator**: Similar to the swift-object-replicator,
    only with container SQLite database files.

    +   - **swift-container-updater**: Updates container information in the account
    database. It will walk the container path in the system, looking for container
    SQLite files, and send updates to the account server as needed.

    +   - **swift-container-sync**: Responsible for allowing contents of a container
    can be mirrored to another container through background synchronization.

    +   - **swift-account-server**: Handles the listing of containers within a particular
    account. The listings are stored as sqlite database files, and are replicated
    across the cluster (similar to objects).

    +   - **swift-account-auditor**: Same as the swift-container-auditor, only with
    account sqlite database files.

    +   - **swift-account-replicator**: Similar to swift-container-replicator, only
    with account sqlite database files.

    +   - **swift-account-reaper**: Removes accounts that have been marked for deletion
    by an OpenStack administrator.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_271_0.png)


    Figure 8.2: High-level view of Swift architecture'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# Swift concepts


    +   - **Account**: Swift uses the term "account" to refer to an OpenStack project.

    +     Remember: in the OpenStack world, accounts, tenants, and projects all mean
    the same thing!

    +   - **Container**: A "bucket" for static files (also known as **objects**).
    A user must create a container to upload an object into a Swift account. All containers
    are owned by the account (or project) to which the user was scoped when they created
    them. By default, all objects uploaded into a container are private.

    +   - **Objects**: Objects are files that one uploads into a container. These
    are usually static files, such as pictures, movies, documents, or logs.

    +   - **Object expiration**: One can set an object to expire at a specific time.
    Once an object is expired, it will no longer be accessible and is deleted from
    the Swift cluster. One great use case for object expiration is temporary registration
    codes or keys that are valid for a short time.

    +   - **ACL (access control list)**: By default, a Swift container is private
    and not accessible to other users or projects. By default, a user with the admin
    or swiftoperator role can set ACLs at the container level and support lists for
    read and write access.

    +   - **Static website hosting**: Rather than using a traditional web server such
    as Apache or Nginx to host a website, Swift can host static website files, such
    as HTML, CSS, and client-side JavaScript. By setting the web-index header on a
    container to the public URL of the container, it will navigate to a specified
    file, such as an `index.html`. One can then update their DNS to point to the URL
    of the publicly accessible Swift container.

    +   - **Object versioning**: Versioning allows a user to upload multiple versions
    of a specific file. The user simply creates an alternate container for storing
    the versions. As the user uploads a file with the same name to a Swift container,
    the previous version gets posted to the alternate container. One can easily retrieve
    and restore to a previous version. If a `DELETE` request is sent to the object,
    the latest version gets deleted, and the previous version restored in its place.'
  merge: -1
  img_proc: true
