    book or the `http://docs.openstack.org/swift`. And finally, be sure to check out
    other OpenStack books currently on the market! If this is your first OpenStack
    book, the cloud learning as just begun!'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# 12

    Practice Exam


    Use this practice test to prepare for the Certified OpenStack Administrator exam.


    # Before you begin...


    Be sure to delete any previously running instances prior to starting. If you need
    help detecting running instances and deleting them, refer to the end of Chapter
    5, Nova Compute Service.


    # Instructions


    Complete all objectives on the Horizon dashboard or CLI. Some questions may depend
    on resources created in other questions. Being able to complete all these objectives
    within one hour should put you in good standing for the exam. If a specific detail
    is not provided, assume the default value.


    # Question 1


    Within the **accounting** project, create a new tenant network called **tenant-network1**.
    It should have a subnet called **tenant-subnet1** with the following details:


    +   - CIDR: 192.168.5.0/24

    +   - DHCP: Enabled

    +   - Allocation range: 192.168.5.50 to 192.168.5.60'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# Question 2


    From inside your terminal environment, build an openrc credential file for the
    admin user that will scope to the auto project.


    # Question 3


    Create a new keypair in the accounting project called keypair1.


    # Question 4


    Your infrastructure engineers just installed the Manilla service in your OpenStack
    environment. Create a new entry in the service catalog that advertises the following
    information:


    +   - Service name: manilla

    +   - Service description: OpenStack Shared File Systems

    +   - Type: share

    +   - Region: RegionOne

    +   - Public endpoint: http://192.168.56.56:8786/v1/

    +   - Internal endpoint: http://192.168.56.56:8786/v1/

    +   - Admin endpoint: http://192.168.56.56:8786/v1/


    # Question 5


    Create a new security group in the trade project called database-sg. It should
    have one rule that allows incoming 3306 from the default security group.


    # Question 6


    Boot a new instance in the accounting project called instance1 with the m1.tiny
    flavor. It should use the Cirros image and should be attached to tenant-network1.
    Ensure that the keypair1 public key gets injected into the instance.'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# Question 7


    Create a new Nova flavor, accessible only by the **production** project. It should
    have the following properties:


    +   - **Name**: nice-flavor

    +   - **RAM**: 512 MB

    +   - **VCPU**: 1

    +   - **Disk**: 1 GB

    +   - **Ephemeral**: 0

    +   - **Swap**: 0


    # Question 8


    In the **accounting** project, create a new 1 GB empty volume called **volume1**.
    Attach the volume to **instance1**. After you have successfully attached the volume,
    use the novnc console to log in to the instance [username: cirros, password: cubswin:].
    Format the attached volume with the ext3 filesystem and mount to the **/mnt**
    directory. Place a file on the mounted drive called `myfile.txt`. Unmount and
    detach the volume from **instance1**.


    # Question 9


    From the **auto** project, create an empty 1 GB volume called **volume1**. The
    volume should be from type: lvm.


    # Question 10


    Adjust the quotas in the **admin** project, allowing a total of 20 **instances**
    and 100 **volumes**.


    # Question 11


    Change the **sallyp** user email address to `sallyp@openstack.org`. Disable the
    account.'
