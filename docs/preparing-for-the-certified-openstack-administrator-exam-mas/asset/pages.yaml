  md: 'We should now have two tenant networks in the logistics project. See Figure
    6.30.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_205_0.png)


    Figure 6.30: Two tenant networks (with subnets) on the Horizon dashboard


    Let''s now create two virtual machine instances: one in **tenant-network1-dashboard**
    and the other in **tenant-network2-dashboard**. Again, make sure you are scoped
    to the **logistics** project! Don''t forget to **be patient** an give your instance
    time to boot!


    ![](img/da864e0670c65edf6f5ab861ef9906b3_205_1.png)


    If you get an error when attempting to boot an instance, please verify that you
    do not have instances running in any other projects. The virtual appliance included
    with this book requires a minimum of 6GB RAM assigned, but **cannot** support
    many instances running at one time. If you continue to have issues booting instances,
    restart the virtual appliance by running `sudo reboot` from the terminal or manually
    shutting down the appliance within VirtualBox. If you have available memory on
    your laptop or desktop machine, feel free to increase the allocated RAM to the
