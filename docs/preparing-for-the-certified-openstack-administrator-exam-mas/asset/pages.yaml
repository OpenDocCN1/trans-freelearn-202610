- pgno: 285
  md: '# Exam objective: settings objects to expire


    One can set an object to expire at a specific time by setting the X-Delete-At
    or X-Delete-After object headers. Once an object is expired, it will be inaccessible
    and eventually deleted from the Swift cluster.


    To expire an object at a certain time, the time and date must be in Unix Epoch
    format.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_285_0.png)


    To get the current time in Unix Epoch format on your system, you can run date
    +%s.


    # CLI


    Let''s set our object-cli.txt object to delete at Saturday, September 1, 2018
    9:09:14 AM, GMT. This will convert to 1535792954 in UNIX Epoch format.


    ```

    $ swift post container-cli object-cli.txt -H "X-Delete-At:1535792954"

    ```


    We can verify that the expiration was set by running the following:


    ```

    $ swift stat container-cli object-cli.txt

    ```


    You should see output similar to Figure 8.14.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_285_1.png)


    Figure 8.14: An object set to expire at a specific date and time in Unix Epoch
    format'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'Once we hit the specified date, the file will be deleted.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_286_0.png)


    Figure 8.15: A visual of a Swift object in a container to expire at a specific
    time in the future


    We can also set an object to delete after a certain amount of time has passed.


    Let''s set the object to delete in 60 seconds using the X-Delete-After header.
    This will overwrite the previous command and set an expiration time for 60 seconds
    from the current time/date of the system.


    ```

    $ swift post container-cli object-cli.txt -H "X-Delete-After:60"

    ```


    Verify that the expiration was set:


    ```

    $ swift stat container-cli object-cli.txt

    ```


    In 60 seconds, you should no longer be able to check the status of the object
    because it will have been deleted. You will see an error, indicating the object
    is no longer available. See Figure 8.16.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_286_1.png)


    Figure 8.16: You will receive a 404 ''Not Found'' once the object has been expired
    and deleted from the cluster'
  merge: -1
  img_proc: true
- pgno: 287
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_287_0.png)


    You may still be able to see the deleted object when running `swift list container
    cli`. Although the object has definitely been deleted from the cluster, the SQLite
    database listing has not been updated yet. Be patient, and it will eventually
    be removed from the listing!


    If you want to remove an expiration header, you can easily do so by using the
    `X-Remove-Delete-At` header with an empty value. For example:


    ```

    $ swift post container-cli object-cli.txt -H "X-Remove-Delete-At: "

    ```


    # Summary


    In this chapter, we reviewed Swift architecture and concepts like accounts, containers,
    objects. It''s important to remember that a majority of Swift features are not
    enabled on the Horizon dashboard and must be set directly via the API or via `python-swiftclient`.
    Don''t forget: containers are private by default and can only be managed by users
    with the admin or swiftoperator roles. To grant public or individual OpenStack
    users access to containers, you must set read and/or write ACLs.


    It is absolutely critical that you remember the ACL syntax! Some older versions
    of `python-swiftclient` report incorrect information in the help output! The ACL
    syntax described in this chapter and does work properly. For more information
    on Swift, check out the official documentation at https://docs.openstack.org/swift.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# 9


    # Heat Orchestration Service


    In the previous chapter, we discussed the Swift object storage service and all
    the Swift-related objectives in the COA exam. Now we will discuss Heat. Heat is
    the OpenStack orchestration service, and its goal is to help OpenStack users model,
    set up, and automate the creation and management of OpenStack resources. Due to
    the minimal amount of Heat content in the exam, this chapter will be short and
    sweet. We will cover the following topics:


    +   - About Heat

    +   - Heat architecture

    +   - Heat templates

    +   - Exam objective - managing stacks

    +   - Exam objective - updating stacks


    After this chapter, you should have a solid understanding of Heat and the skills
    required to successfully fulfill all Heat-related objectives in the exam.


    # About Heat


    In Chapter 1, we discussed the various ways OpenStack users can create resources
    with OpenStack. Up until this point in our COA exam prep journey, we''ve utilized
    the Horizon dashboard and CLI. Although these have been fun to use, working with
    them to deploy OpenStack resources can be pretty tedious. In fact, between 2007
    and 2010, Amazon users primarily relied on the AWS console, CLI, or SDK to provision
    virtual resources for their applications. Many users began creating bash scripts
    with the CLI to automate the creation of entire environments for their applications.'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'This worked great for a while, but users began to run into problems if they
    accidentally ran the script again, wanted to delete the resources, or add just
    one additional change. Users then had to build the logic into their bash scripts
    in order to make them idempotent and add additional scripts to assist in removing
    the environments. It was a lot of work.


    Then in February of 2011, AWS CloudFormation was released! With CloudFormation,
    a user could describe their desired AWS architecture in a JSON template file.
    They could then launch this template and deploy their "stack" while AWS took care
    of doing everything in the proper order, while logging all events of the creation
    process. After a user was done with the stack environment, they could easily add
    additional resources to it or destroy the whole thing by deleting it.


    Heat was introduced in April 2013 with the Grizzly version of OpenStack. Like
    CloudFormation, Heat begins with a blueprint or Heat orchestration template that
    describes all the OpenStack resources to be provisioned. Heat takes care of provisioning
    and configuring with no need to worry about dependencies or the order of execution.


    You can delete the stack just as easily, which deletes all the resources associated
    with the stack. If you want to make a change to the stack, you can even easily
    update it by providing a modified template with new parameters.


    # Heat architecture


    Heat is made up of three daemons:


    +   - **heat-api**: The API and primary gateway to Heat. One must interact with
    `heat-api` to create, list, delete, and manage stacks.

    +   - **heat-api-cfn**: This provides an AWS-style Query API that allows services
    or human users to utilize CloudFormation-like functionalities, such as wait conditions
    and triggering autoscaling.

    +   - **heat-engine**: This is responsible for launching stacks and managing all
    resources specified in the template.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_290_0.png)


    Figure 9.1: High-level view of Heat architecture


    # Heat templates


    Heat templates (heat orchestration templates or HOT, for short) are templates
    that heat-api can consume to create virtual resources in the OpenStack environment.
    They describe all the desired resources and their associated parameters. After
    the stack has been created, the OpenStack resources are up and running. Templates
    are extremely convenient because they allow you to check them into a version control
    system such as GitHub to easily track changes and collaborate with the team. If
    problems occur after deploying a Heat template, simply restore to a previous version
    of the template.'
  merge: -1
  img_proc: true
- pgno: 291
  md: "Figure 7.2 breaks down the anatomy of a Heat template.\n\n# Anatomy of a Heat\
    \ Template\n\n```\n```yaml\nheat_template_version: 2013-05-23\ndescription: Test\
    \ Stack\n\nparameters:\n  ServerName:\n    type: string\n    description: A name\
    \ for the server\n  Image:\n    type: string\n    description: Image ID used to\
    \ boot the server\n  Flavor:\n    type: string\n    description: Flavor of server\n\
    \  Net:\n    type: string\n    description: Network ID for the server\n  Volume:\n\
    \    type: string\n    description: A volume ID to attach to the server\n\nresources:\n\
    \  server1:\n    type: OS::Nova::Server\n    properties:\n      name: { get_param:\
    \ ServerName }\n      image: { get_param: Image }\n      flavor: { get_param:\
    \ Flavor }\n      networks:\n        - network: { get_param: Net }\n\n  volumeattach:\n\
    \    type: OS::Cinder::VolumeAttachment\n    properties:\n      volume_id: { get_param:\
    \ Volume }\n      instance_uuid: { get_resource: server1 }\n\noutputs:\n  myinstance_ip:\n\
    \    description: IP address of the first instance\n    value: { get_attr: [server1,\
    \ first_address] }\n```\n```\n\n# Template Header\n\n+   - version (corresponds\
    \ with OpenStack Version)\n+     2013-05-23 = Grizzly, Havana, and Icehouse\n\
    +   - description (optional)\n\n# Parameters\n\n+   - specify any input parameters\
    \ (optional)\n\n# Resources\n\n+   - OpenStack resources you are creating (mandatory)\n\
    \n# Outputs\n\n+   - Information provided to a user after the stack has been created,\
    \ i.e. IP addresses, URLs, UUIDs, passwords, etc.\n\nFigure 9.2: Anatomy of a\
    \ Heat template"
  merge: -1
  img_proc: true
- pgno: 292
  md: '1. **Template header:** The template version is mandatory and the description
    is optional. Additional features and capabilities are released in every new version
    of OpenStack. This means that newer templates that users create may reference
    features not found in older versions, therefore making the templates incompatible
    with older environments. Here is a list of Heat template versions and the OpenStack
    versions they are compatible with:


    | Heat template version | OpenStack version |

    |---|---|

    | 2013-05-23 | Grizzly, Havana, Icehouse, and higher |

    | 2014-10-16 | Juno and higher |

    | 2015-04-30 | Kilo and higher |

    | 2015-10-15 | Liberty and higher |

    | 2016-04-08 | Mitaka and higher |

    | 2016-10-14 | Newton and higher |


    2. **Parameters:** These are optional and can be any particular value you''d like
    the user to be able to insert. These values get passed in by the user at the time
    of deploying or “creating” the stack.


    3. **Resources:** These are mandatory and represent any OpenStack resource you
    want to create.


    4. **Outputs:** Information provided to the user after stack creation. This could
    be anything from an IP address to a special registration code or password.'
  merge: -1
  img_proc: true
