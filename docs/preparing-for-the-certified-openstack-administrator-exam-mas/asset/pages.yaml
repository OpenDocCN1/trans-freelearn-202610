  md: 'Confirm that the file has been successfully uploaded:


    ```

    $ swift list container-cli

    ```


    Let''s now delete this file:


    ```

    $ swift delete container-cli object-deleteme.txt

    ```


    That''s all there to creating containers, uploading objects to those containers,
    and deleting objects! Pretty easy!


    # Exam objective: managing container ACLs


    Recall that by default, the contents of a container can only be accessed by those
    with the admin or swiftoperator role. If one has either of these roles, they have
    the permission to set ACLs. ACLs work on the container level and apply to all
    objects within the container.


    +   - Read ACLs control who can read/download the files within the container.
    You can also limit read/download access to all users within a specific project
    or one specific user.

    +   - Write ACLs allow you to set upload permissions for a container. For example,
    you may want to allow a specific user or all users within a project to upload
    files to a container. You can even set a container to anonymous write, which will
    allow anyone, regardless of project, to upload objects into the container.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_279_0.png)


    ACLs can only be set using the raw API or via python-swiftclient. The only ACL
    one can set via the Horizon dashboard is allowing anonymous access to a container
    via the Public checkbox in Figure 8.6.


    # CLI


    ![](img/da864e0670c65edf6f5ab861ef9906b3_279_1.png)


    Beware! The python-swiftclient help (swift post --help) does not have correct
    information regarding ACL syntax! A bug fix has already submitted, but don''t
    rely on it during the exam! Be sure to the follow the ACL syntax here or official
    community documentation at https://docs.openstack.org/ocata/!


    Let''s source our openrc-operations file:


    ```

    $ source openrc-operations

    ```'
  merge: -1
