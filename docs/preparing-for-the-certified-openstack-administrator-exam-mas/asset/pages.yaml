    # Exam objective - managing the service catalog - services and endpoints


    For those new to OpenStack, the concept of the service catalog is confusing because
    most novice OpenStack users and administrators indirectly interact with OpenStack
    service APIs via the dashboard or CLI.'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'You can think of the catalog as a listing of URLs that are stored in Keystone.
    This listing shows the API URLs (otherwise known as *endpoints*) for all services
    currently installed in the OpenStack environment. Although not part of the exam
    objectives, let''s take a big picture look at how a user interacting directly
    with the API would use the service catalog:


    +   1. The OpenStack operator/developer decides they want to directly interact
    with the API, so they receive the Keystone authentication URL, username, password,
    domain, and project directly from their OpenStack administrator. They send this
    information via an API request (using a tool such as `curl` or `wget`) to Keystone.

    +   2. Keystone responds back with two things: a token scoped to the specific
    project and a service catalog.

    +   3. The user browses the service catalog much like browsing the menu at their
    favorite restaurant, deciding which meal to purchase. In this case, they are deciding
    which service they want to use. The service catalog shows the location of all
    the services'' APIs in the OpenStack environment. If they decide they want to
    create a new instance, they look up how to make their API call from the Nova API
    documentation available at `http://developer.openstack.org`.

    +   4. The OpenStack operator/developer then sends the token they received in
    **step 2** along with the API request for creating a server directly to the Nova
    API public URL endpoint.

    +   5. If the user''s role has been granted the authorization to create servers,
    the Nova service would fulfill the request to create a server, and the user would
    receive an `HTTP 200 OK` from the Nova API—confirming the request was successfully
    fulfilled.


    Some services use the catalog to do lookups on how to send API calls to other
    services.'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'It''s interesting to see how this is done directly via the API. The great thing
    about the dashboard, CLI, SDKs, and Heat is that they do not require any explicit
    fumbling with tokens, service catalogs, or direct API calls.


    As an OpenStack administrator, you may be responsible for advertising a newly
    installed OpenStack service to users of the environment. Once this service gets
    installed by the OpenStack infrastructure engineer, you need to add it to the
    service catalog so that users know the service is available. Adding new services
    and endpoints to the catalog can easily be done via python-openstackclient.


    There are three endpoints for each service in the service catalog:


    +   - **Public**: The URL that users would use for externally accessing the API.
    This would typically be a external IP address (or name that resolves to an external
    IP address). One can imagine being at a coffee shop or somewhere external to the
    OpenStack environment. Even a smartphone app can use the public endpoint to make
    API calls to the service.

    +   - **Internal**: The URL typically used by services for internal communication.
    This would typically be an internal IP address only accessible from within the
    OpenStack cluster. There is no need for a user or service to use a public endpoint
    if they are inside the OpenStack environment. An OpenStack administrator or infrastructure
    engineer who has SSH''d into an OpenStack server could also use this endpoint.

    +   - **Admin**: The URL is used to expose special admin-only features for a service,
    although it is typically the same URL/port as internal. In fact, Keystone is the
    only service installed in the included virtual appliance that advertises a different
