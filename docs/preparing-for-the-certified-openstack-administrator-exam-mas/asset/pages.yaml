- pgno: 252
  md: 'We should now have a newly created volume owned by the quality-control project.
    At this point, all users in the quality-control project should have access to
    modify the volume, but it cannot truly be used until it is attached to an instance.


    We can only attach a block volume to one instance at a time; it''s important to
    note that we cannot make this volume publicly accessible to all projects. What
    we can do, however, is transfer ownership of the volume to another project using
    the Create Transfer option in the volume panel. This will generate a special ID
    and authorization key that we provide to a user in an alternative project. A user
    in the alternate project then enter Accept Transfer, enter the ID and auth key,
    and then gain full control and ownership of the volume. After a volume has been
    transferred to another project, it will no longer be accessible to the original
    owner unless they accept the transfer back.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_252_0.png)


    We also have the option of making a volume bootable. A bootable volume is one
    that can be selected as a Nova boot source. In order to be a proper boot source,
    the volume must contain a bootloader or instructions that the virtual machine
    instance BIOS can read. Select Edit Instance and check the Bootable box to make
    a volume bootable.


    # CLI


    Recall that the provided openrc file contains credentials in the form of variables
    for proper authentication to Keystone and setting project scope.


    In this chapter, we will do all of our Cinder-related tasks in the quality-control
    project. Let''s copy our original openrc file to a new file called openrc-quality-control.


    ```

    $ cp openrc openrc-quality-control

    ```


    Now that we''ve made a copy, let''s edit the openrc-quality-control file and update
    the project and tenant name variables to reflect our desired scope to the logistics
    project. If you are more comfortable with another editor, feel free to use it
    here:


    ```

    $ nano openrc-quality-control

    ```'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'Change the following variables to quality-control:


    ```

    export OS_PROJECT_NAME=quality-control

    export OS_TENANT_NAME=quality-control

    ```


    ![](img/da864e0670c65edf6f5ab861ef9906b3_253_0.png)


    We are changing the OS_TENANT_NAME variable since some of the older service-based
    clients may rely on the older variable, OS_TENANT_NAME.


    Source the newly created openrc-quality-control file:


    ```

    $ source openrc-quality-control

    ```


    Verify that the proper variables are set:


    ```

    $ export | grep OS

    ```


    Now that we are properly scoped, any new volume that we create from this point
    forward will be owned by the quality-control project. Unlike some of the other
    python-openstackclient list commands, openstack volume list only shows volumes
    within the project to which we are currently scoped. This is very important to
    keep in mind during the exam. Run the following:


    ```

    $ openstack volume list --long

    ```


    We should see the volume-dashboard volume we created in the previous exercise.
    As an admin, we should be able to see and list all volumes across all projects
    in our environment. Run the following:


    ```

    $ openstack volume list --all-projects --long

    ```


    You should now see an additional volume that was previously created on the virtual
    appliance.


    Let''s proceed with creating a brand-new 1 GB volume with the CLI. We will name
    it volume-cli, with the description COA exam prep cli volume:


    ```

    $ openstack volume create --size 1 volume-cli --description "COA exam prep cli
    volume"

    ```'
  merge: -1
  img_proc: true
