- pgno: 171
  md: '# Exam objective - managing instance actions


    There are a variety of actions we can perform on existing instances. You can see
    these actions by clicking on the dropdown next to the instance in the instances
    section of the Project panel. See Figure 5.22.


    You should have two instances in the Shutoff status: instance1 and instance2.


    Now that these are both running, let''s explore a few of the available options
    in the dropdown. See Figure 5.22.


    +   - **Associate Floating IP**: Allows us to map a floating IP (external IP)
    to our instance, if available. More on this in Chapter 6, Neutron Networking Service.

    +   - **Attach Interface**: Attach another (or the same) network to the instance.
    This is comparable to plugging an additional virtual NIC (or port) to the instance.

    +   - **Detach Interface**: Remove a virtual NIC or port.

    +   - **Edit Instance**: Rename the instance or add/remove security groups. If
    you completely remove all security groups from an instance''s port, all ingress
    and egress traffic will be blocked.

    +   - **Console**: Another way to gain console access.

    +   - **View Log**: Another way to view the console log.

    +   - **Pause Instance**: Store the state of the VM in memory.

    +   - **Suspend**: Store the state of the VM on the compute node hard disk.

    +   - **Shelve**: The instance will be stopped and snapshotted. It will then be
    removed from the compute node but will still appear in your list of instances
    with status Shelved. All the associated data and resources are kept, although
    the state information will be gone. It can then be unshelved and used.

    +   - **Resize**: Specify another flavor to resize the instance.

    +   - **Lock**: In locked state, an instance cannot be modified or terminated
    by non-admin users.

    +   - **Unlock**: Unlocks an instance, allowing users within the project to modify
    or terminate.

    +   - **Soft Reboot**: Triggers a graceful reboot of the instance with an ACPI
    event.

    +   - **Hard Reboot**: Powers the instance off and turns it back on. Also known
    as a cold reboot.

    +   - **Shut Off Instance**: Triggers a graceful shutdown of the instance with
    an ACPI event.

    +   - **Rebuild Instance**: Recreates the instance from a fresh image while maintaining
    the same fixed and floating IP addresses, among other metadata.'
  merge: -1
  img_proc: true
