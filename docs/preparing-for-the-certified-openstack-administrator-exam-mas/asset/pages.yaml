    # CLI


    Now that we understand how to create a Glance image on the Horizon dashboard,
    let''s create one with python-openstackclient.


    SSH into the provided virtual appliance. If you need instructions on how to SSH,
    refer to Chapter 2, Setting up Your Practice Exam Environment.


    Because we are inside the appliance and not on our laptop''s or desktop''s filesystem,
    let''s fetch the Cirros image and download it onto the appliance''s Ubuntu 16.04
    filesystem. We use the wget command-line utility. If you are unfamiliar with wget,
    it''s a fast and convenient tool for accessing websites and downloading files
    from the internet.


    ```

    ```bash

    $ wget https://download.cirros-cloud.net/0.3.5/cirros-0.3.5-x86_64-disk.img

    ```

    ```


    Recall that we uploaded this image as the procurement project in the previous
    section. In order to scope ourselves to procurement from the CLI, we will need
    to provide python-openstackclient with the proper authentication credentials.
    The easiest and most convenient way for us to do this is by creating another credential
    file with the proper Bash variables set. Let''s copy our original openrc file
    to a file called openrc-procurement:


    ```

    ```bash

    $ cp openrc openrc-procurement

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'Now that we''ve made a copy, let''s edit the openrc-procurement file and update
    the project and tenant name variables to reflect our desired scope to the procurement
    project. Feel free to use your editor of choice.


    ```

    $ nano openrc-procurement

    ```


    Change the following variables to procurement and save the file. To exit and save
    your changes with nano, hit CTRL + X, and then Y to save.


    ```

    export OS_PROJECT_NAME=procurement

    export OS_TENANT_NAME=procurement

    ```


    ![](img/da864e0670c65edf6f5ab861ef9906b3_132_0.png)


    We are changing the OS_TENANT_NAME variable, since some of the older service-based
    clients rely on this rather than than OS_PROJECT_NAME.


    Source the newly created openrc-procurement file:


    ```

    $ source openrc-procurement

    ```


    Don''t forget to always verify that our variables have been properly set to scope
    to the procurement project:


    ```

    $ export | grep OS

    ```


    Now that we are sourced to the procurement project, run the openstack image list
    command to verify we can see if there are any available images:


    ```

    $ openstack image list

    ```


    See Figure 4.10. If you followed the previous section correctly, you should see
    the publicly available cirros image (owned by the admin project) and the cirros-dashboard
    project created via the Horizon dashboard in the previous section.


    ![](img/da864e0670c65edf6f5ab861ef9906b3_132_1.png)


    Figure 4.10: Output of the ''openstack image list'' command'
  merge: -1
  img_proc: true
- pgno: 133
  md: '![](img/da864e0670c65edf6f5ab861ef9906b3_133_0.png)


    You can get the help for any OpenStack command by placing the word help after
    the initial command and before the action—for example: openstack help image create,
    openstack help image list, and openstack help image save.


    To get more details about a specific image, you can use the openstack image show
    command. Let''s see the details of the previously created cirros-dashboard image:


    ```

    $ openstack image show cirros-dashboard

    ```


    As you can see in Figure 4.11, in this particular image, the owner field shows
    the UUID of the procurement project along with some other details we specified
    in the previous section.


    Before uploading our new image, we can explore some of the available arguments
    for this command using help.


    ```

    $ openstack help image create

    ```


    Using this information, we can now create a new Glance image via the CLI. We will
    use the openstack image create command:


    ```

    $ openstack image create --file cirros-0.3.5-x86_64-disk.img --disk-format qcow2
    --min-disk 1 --min-ram 512 --property description=''Cirros Cloud Image for COA
    Exam Prep'' --property architecture=''x64'' cirros-cli

    ```


    ![](img/da864e0670c65edf6f5ab861ef9906b3_133_1.png)


    --container-format is an optional argument that one would set if the image were
    in a file format that also contained metadata about the image. Container formats
    are not currently used by Glance or other OpenStack components, so it is safe
    to simply specify bare as the container format if you are unsure.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'We should now see the output shown in Figure 4.11:


