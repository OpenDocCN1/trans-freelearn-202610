- "# 1 使用 Spring Python 入门\n\nSpring Python 采用了 Spring Framework 和 Spring Security\
  \ 的概念，并将其带入 Python 世界。它并不是代码逐行移植。相反，它汲取了在 Java 领域发现的一些强大思想，并在 Python 世界中务实地应用它们。\n\
  \nSpring（Java）提供许多简单易用的功能部件来组装应用程序，而不是一个用于扩展的单体框架。Spring Python 使用相同的方法。这意味着我们可以根据每个\
  \ Python 应用程序的需求使用尽可能少或多的 Spring Python 来完成工作。\n\n在本章中，我们将学习：\n\n- 了解 Spring Python\
  \ 的非侵入式 API，它使使用其他库变得容易，而无需对自己的代码库进行重大更改\n- Spring Python 如何使用控制反转来解耦对象的创建与使用，从而赋能开发者\n\
  - Spring Python 如何通过提供非侵入式 API 来帮助专业 Python 开发者轻松访问高级服务\n- Spring Python 为专业 Java\
  \ 开发者提供通过 Python/Jython/Java 组合轻松混合 Python 和 Java 的方式\n- 如何从二进制和源代码安装库\n- Spring\
  \ Python 的可扩展性如何，以及一些指向 Spring Python 社区的链接\n\n### 面向 Python 开发者的 Spring Python\n\
  \n您已经选择了最受欢迎且技术上功能强大的动态语言之一 Python 来开发软件。Spring Python 使解决 Python 开发者每天遇到的常见问题变得更加容易。\n\
  \n### 探索 Spring Python 的非侵入式特性\n\nSpring Python 具有非侵入式特性，这意味着可以轻松采用满足需求的部分，而无需重写大量代码。例如，Pyro\
  \ (http://pyro.sourceforge.net) 是一个第三方库，可轻松进行远程过程调用。\n\n为了演示 Spring 的非侵入式方法，让我们编写一个简单的服务，使用\
  \ Pyro 的 API 将其发布为 Web 服务，然后使用 Spring Python 对 Pyro 的封装将其发布。这将展示 Spring Python 如何简化我们的\
  \ API 访问，以及它如何使第三方库更容易使用，而无需对自己的代码进行太多重构。\n\n- 1. 首先，让我们编写一个简单的服务，从 Web 请求字符串中解析参数：\n\
  ```python\nclass ParamParser(object):\n    def parse_web_parms(self, parm):\n  \
  \      return [tuple(p.split(\"=\")) for p in parm.split(\"&\")]\n```\n- 2. 现在我们可以编写一段简单、功能性的代码，使用我们的服务以获得可工作的版本。\n\
  ```python\nparser = ParamParser()\nparser.parse_web_parms(\"pages=5&article=Spring_Python\"\
  )\n```\n这只是实例化 `ParamParser` 并访问函数。要使其成为有用的互联网服务，它需要在中央服务器上实例化，并应配置为监听来自客户端的调用。\n\
  - 3. 下一步是使用 Pyro 的 API 将其作为 Web 服务发布。这将使其可被多个 Pyro 客户端访问。为此，我们定义一个守护进程，在端口 9000\
  \ 上托管我们的服务并对其进行初始化。\n```python\nimport Pyro\n\ndaemon = Pyro.core.Daemon(host=\"\
  localhost\", port=\"9000\")\nPyro.core.initServer()\n```\n- 4. 接下来，我们创建一个 `Pyro`\
  \ 对象实例作为我们服务的代理，以及我们 `ParamParser` 的一个实例。我们配置代理将所有方法调用委托给我们的服务。\n```\npyro_proxy\
  \ = Pyro.core.ObjBase()\nparser = ParamParser()\npyro_proxy.delegateTo(parser)\n\
  ```\n- 5. 最后，我们将 `pyro_proxy` 对象注册到 `daemon`，并启动监听-分发循环，使其准备好处理请求：\n```\ndaemon.connect(pyro_proxy,\
  \ \"mywebservice\")\ndaemon.requestLoop(True)\n```\n当我们运行此服务器代码时，我们的 `ParamParser`\
  \ 的一个实例将被创建并在 `PYROLOC://localhost:9000/mywebservice` 上发布。\n\n为了使此服务完整，我们需要创建一个\
  \ `Pyro` 客户端来调用我们的服务。代理使用 `Pyro` 库无缝地在有线上传输 Python 对象，在本例中为请求参数的元组。\n```\nimport\
  \ Pyro\n\nurl_base = \"PYROLOC://localhost:9000\"\nclient_proxy = Pyro.core.getProxyForURI(\
  \ \\\n    url_base + \"/mywebservice\")\nprint client_proxy.parse_web_parms( \\\n\
  \    \"pages=5&article=Spring_Python\")\n```\n`Pyro` 库易于使用。一个关键因素是我们的 `ParamParser`\
  \ 从未与用于将其提供给远程客户端的 `Pyro` 机制紧密耦合。然而，它非常侵入性。\n\n如果我们已经在单台机器上开发了一个简单的应用程序，其中大量方法使用我们的实用程序？为了将我们的应用程序转换为客户端-服务器应用程序，我们必须在每次调用时重写它以使用\
  \ `Pyro` 客户端代理模式。如果我们遗漏任何实例，我们将会有需要清理的错误。如果我们编写了自动化测试，它们也必须重写。将简单的单机应用程序转换为多节点应用程序会迅速产生大量工作。\n\
  \n这就是 Spring Python 发挥作用的地方。它提供了一种不同的创建对象的方式，使我们能够轻松地用远程机制（如 `Pyro`）替换本地对象。稍后，我们将更详细地探讨\
  \ Spring Python 容器的概念。\n\n\n\n让我们利用 Spring Python 的容器来创建我们的解析器，并通过 Pyro 提供服务。\n\n\
  ```\nfrom springpython.config import PythonConfig\nfrom springpython.config import\
  \ Object\nfrom springpython.remoting.pyro import PyroServiceExporter\nfrom springpython.remoting.pyro\
  \ import PyroProxyFactory\n\nclass WebServiceContainer(PythonConfig):\n    def __init__(self):\n\
  \        super(WebServiceContainer, self).__init__()\n\n    @Object(lazy_init=True)\n\
  \    def my_web_server(self):\n        return PyroServiceExporter(service=ParamParser(),\n\
  \                                    service_name=\"mywebservice\",\n          \
  \                          service_port=9000)\n\n    @Object(lazy_init=True)\n \
  \   def my_web_client(self):\n        myService = PyroProxyFactory()\n        myService.service_url=\"\
  PYROLOC://localhost:9000/mywebservice\"\n        return myService\n```\n\n借助此容器定义，很容易同时编写服务器应用程序和客户端应用程序。要启动我们\
  \ Pyro 服务器的一个实例，我们使用以下代码：\n\n```\nfrom springpython.context import ApplicationContext\n\
  container = ApplicationContext(WebServiceContainer())\ncontainer.get_object(\"my_web_server\"\
  )\n```\n\n客户端应用程序看起来非常相似。\n\n```\nfrom springpython.context import ApplicationContext\n\
  container = ApplicationContext(WebServiceContainer())\nmyService = container.get_object(\"\
  my_web_client\")\nmyService.parse_web_parms(\"pages=5&article=Spring_Python\")\n\
  ```\n\nSpring Python 容器通过包含创建关键对象的全部定义来工作。我们创建容器的一个实例，向其请求特定对象，然后使用它。\n\n这看起来很容易就和直接使用\
  \ Pyro API 一样多（如果不是更多）的代码。那么为什么它被认为侵入性更小呢？\n\n看看最后的代码块，我们可以看到我们不再创建解析器或 Pyro 代理。相反，我们依赖容器为我们创建它。Spring\
  \ Python 容器解耦了我们解析器的创建，无论是用于本地应用程序，还是使用 Pyro 远程连接它们。服务器应用程序不知道它被导出为 Pyro 服务，因为所有这些信息都存储在\
  \ WebServiceContainer 中。对容器定义所做的任何更改都不会被服务器应用程序代码感知。\n\n对于客户端也是如此。通过将客户端的创建放在容器内部，我们不必知道我们获取的是服务实例还是代理。这意味着可以在\
  \ Spring Python 容器的定义内部进行额外的更改，而不会影响我们的客户端和服务器应用程序。这使得将服务器和客户端调用拆分为单独的脚本变得容易，以便在\
  \ Python 的单独实例或企业中的单独节点上运行。\n\n这演示了如何将远程调用混合到现有应用程序中。通过使用将关键对象的创建委托给容器的这种模式，可以轻松地从简单的对象创建开始，然后再添加诸如远程调用之类的有用服务。本书后面我们还将看到，这如何使添加事务和安全等其他服务变得容易。由于\
  \ Spring Python 开放式的设计，我们可以轻松创建新服务并添加它们，而无需更改原始框架。\n\n## 添加一些有用的模板\n\n除了以非侵入性的方式混合服务的能力之外，Spring\
  \ Python 还提供了多个实用工具，通过模板模式简化了低级 API 的使用。模板模式涉及捕获一系列逻辑步骤。在每个步骤中发生的事情可以由开发人员自定义，同时仍保持相同的整体顺序。\n\
  \n模板在编写 SQL 查询时非常有用。使用 Python 的数据库 API（http://www.python.org/dev/peps/pep-0249）手工编写\
  \ SQL 查询非常繁琐。我们必须妥善处理错误并收集结果。将事物连接起来并处理问题所涉及的额外代码通常被称为样板代码。让我们看看以下代码，了解 Python 的数据库\
  \ API 如何工作。\n\n我们需要维护的样板代码越多，成本就越高。拥有包含数十或数百个查询的应用程序可能会变得难以管理，甚至维护成本过高。\n\n- 1.\
  \ 使用 Python 的数据库 API，我们只需为设置编写一次以下代码。\n- 2. 现在让我们使用 Python 的数据库 API 执行单个查询。\n\n\
  ```\n### One time setup\nimport MySQLdb\nconn = MySQLdb.connect(username=\"me\"\
  ,\n    password=\"secret\",\n    hostname=\"localhost\",\n    db=\"springpython\"\
  )\n```\n\n```\n### Repeated for every query\ncursor = conn.cursor()\nresults = []\n\
  try:\n    cursor.execute(\"\"\"select title, air_date, episode_number, writer\n\
  \        from tv_shows where name = %s\"\"\",\n        (\"Monty Python\",))\n  \
  \  for row in cursor.fetchall():\n        tvShow = TvShow(title=row[0],\n      \
  \      airDate=row[1],\n            episodeNumber=row[2],\n            writer=row[3])\n\
  \        results.append(tvShow)\nfinally:\n    try:\n        cursor.close()\n  \
  \  except Exception:\n        pass\nconn.close()\nreturn results\n```\n\n我们编写的用于查找\
  \ TV 节目的专用代码包含在 execute 语句中，以及创建 TvShow 实例的部分。其余的只是处理错误、管理数据库游标以及遍历结果所需的样板代码。\n\n\
  这可能看起来不多，但你是否曾经开发过只有一个 SQL 查询的应用程序？我们可能有数十甚至数百个查询，反复编写这些步骤会变得难以承受。Spring Python\
  \ 的 DatabaseTemplate 让我们只需注入查询字符串和行映射器即可减少需要编写的总代码量。\n\n- 3. 我们需要比之前稍微不同的设置。\n\n\
  ```\n\"\"\"One time setup\"\"\"\nfrom springpython.database.core import *\nfrom\
  \ springpython.database.factory import *\nconnectionFactory = MySQLConnectionFactory(username=\"\
  me\",\n                                          password=\"secret\",\n        \
  \                                  hostname=\"localhost\",\n                   \
  \                       db=\"springpython\")\n```\n\n- 4. 我们还需要定义一个映射来生成我们的 TvShow\
  \ 对象。\n\n```\nclass TvShowMapper(RowMapper):\n    def map_row(self, row, metadata=None):\n\
  \        return TvShow(title=row[0],\n                      airDate=row[1],\n  \
  \                    episodeNumber=row[2],\n                      writer=row[3])\n\
  ```\n\n- 5. 完成所有这些设置后，我们现在可以创建一个 DatabaseTemplate 实例并使用它以更低的占用空间执行相同的查询。\n\n```\n\
  dt = DatabaseTemplate(connectionFactory)\n```\n\n```\n\"\"\"Repeated for each query\"\
  \"\"\nresults = dt.query(\"\"\"select title, air_date, episode_number, writer from\
  \ tv_shows where name = %s\"\"\",\n                   (\"Monty Python\",), TvShowMapper())\n\
  ```\n\n此示例展示了我们如何使用 Spring Python 的模板解决方案用单条语句替换 19 行代码。\n\n对象关系映射器（ORMs）应运而生，以应对\
  \ ANSI SQL 协议的低级特性。许多应用程序具有简单的对象持久化需求，我们中的许多人更愿意在代码上工作，而不是数据库设计。通过拥有一个帮助进行模式管理工作的工具，这些\
  \ ORM 已成为巨大的生产力提升。\n\n但它们不一定是每种用例的答案。一些查询非常复杂，涉及查找分散在多个表中的信息，或涉及进行复杂计算和解码特定值。此外，许多遗留系统是去规范化的，不符合\
  \ ORM 最初设计的处理范式。这些查询的复杂性可能需要绕过，甚至违背基于 ORM 的解决方案，使其不值得付出努力。\n\n为缓解使用 SQL 的挫败感，Spring\
  \ Python 的 DatabaseTemplate 大大简化了 SQL 的编写，同时让你完全自由地将结果映射到对象、字典和元组中。DatabaseTemplate\
  \ 可以轻松增强你的应用程序，无论你是否已在使用 ORM。这样，简单的对象持久化可以用 ORM 管理，而复杂查询可以交给 Spring Python 的 DatabaseTemplate，从而实现富有成效、功能性的代码的良好融合。\n\
  \n其他模板，例如 TransactionTemplate，免除了你处理编码事务所需的低级习惯用法负担，这些习惯用法使其正确集成具有挑战性。本书后面我们将学习如何以编程方式和声明方式轻松地向代码添加事务。\n\
  \n应用所需的服务并抽象掉低级 API 是 Spring 之道的关键部分，让我们可以将时间和精力集中在客户的业务需求上，而不是我们自己的技术需求上。\n\n通过使用我们刚刚查看的各种组件，开发一个从关系数据库提供\
  \ TV 节目的简单 Pyro 服务并不困难。\n\n```\nfrom springpython.database.factory import *\nfrom\
  \ springpython.config import *\nfrom springpython.remoting.pyro import *\n\nclass\
  \ TvShowMapper(RowMapper):\n    def map_row(self, row, metadata=None):\n       \
  \ return (title=row[0],\n                airDate=row[1],\n                episodeNumber=row[2],\n\
  \                writer=row[3])\n\nclass TvShowService(object):\n    def __init__(self):\n\
  \        self.connFactory = MySQLConnectionFactory(username=\"me\",\n          \
  \                                      password=\"secret\",\n                  \
  \                              hostname=\"localhost\",\n                       \
  \                         db=\"springpython\")\n        self.dt = DatabaseTemplate(connFactory)\n\
  \n    def get_tv_shows(self):\n        return dt.query(\"\"\"select title, air_date,\
  \ episode_number,\n                            writer\n                        from\
  \ tv_shows where name = %s\"\"\",\n                        (\"Monty Python\",),\
  \ TvShowMapper())\n```\n\n```\nclass TvShowContainer(PythonConfig):\n    def __init__(self):\n\
  \        super(TvShowContainer, self).__init__()\n\n    @Object(lazy_init=True)\n\
  \    def web_server(self):\n        return PyroServiceExporter(service=TvShowService(),\n\
  \                                    service_name=\"tvshows\",\n               \
  \                     service_port=9000)\n\n    @Object(lazy_init=True)\n    def\
  \ web_client(self):\n        myService = PyroProxyFactory()\n        myService.service_url=\"\
  PYROLOC://localhost:9000/tvshows\"\n        return myService\n\nif __name__ == \"\
  __main__\":\n    container = ApplicationContext(TvShowContainer())\n    container.get_object(\"\
  web_server\")\n```\n\n通过查询数据库中的电视节目并通过 Pyro 提供服务，这段代码演示了在不将它们混合在一起的情况下使用这些强大模块是多么容易。当事物保持简单和分离时，随着时间的推移维护软件会容易得多。\n\
  \n我们刚刚快速浏览了 SQL 和 Pyro 并检查了它们的低级 API。许多低级 API 需要按特定顺序执行步骤才能正确使用它们。我们刚刚看了一个 SQL 查询。模板的需求也存在于数据库事务和\
  \ LDAP 调用中。通过在 Spring Python 模板中捕获 API 的流程并允许你插入自定义代码，你可以摆脱编写管道代码，转而专注于应用程序的业务逻辑。\n\
  \n## 面向 Java 开发者的 Spring Python\n\nJava 开发者经常寻求提高生产力的方法。随着 Java 虚拟机 (JVM) 上替代语言的惊人增长，开发者探索\
  \ Jython (http://www.jython.org) 作为编写脚本、片段和子系统的替代方式也就不足为奇了。虽然使用你已知的 Java 库很方便，但有时与库的\
  \ Java 习惯用法交互会很粗糙。\n\nSpring Python 用纯 Python 编写，这使得它在 Jython 中也很容易使用。你可能会发现使用 Spring\
  \ Python 的 Pythonic API 比 Spring Framework 的 Java 习惯用法更容易、更有吸引力。最终选择权在你，而且这不是非此即彼的决定；你可以在\
  \ Java 和 Python 段中同时使用这两个库。\n\n下图展示了 Python、Jython 和纯 Java 的组合作为一个栈。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_28_0.png)\n\
  \n使用 Spring Python，很容易将 Java 和 Python 混合在一起。让我们编写一个简单的示例，在其中编写一个与上一节所示的 TV 服务通信的\
  \ Jython 客户端。通过重用该代码，我们可以轻松编写客户端。为了真正展示 Python/Jython/Java 集成的威力，让我们将我们的 Jython\
  \ 客户端暴露给纯 Java 消费者。\n\n- 1. 首先，我们需要一个纯 Java 接口，让我们的 Jython 代码可以扩展它。\n- 2. 接下来，我们编写\
  \ Jython 类来扩展此接口。\n\n```\nimport org.python.core.PyList;\n\npublic interface JavaTvShowService\
  \ {\n    public PyList getTvShows();\n}\n```\n\n```\nclass JythonTvShowService(JavaTvShowService):\n\
  \    def __init__(self):\n        self.container = ApplicationContext(TvShowContainer())\n\
  \        self.client = container.get_object(\"web_client\")\n\n    def getTvShows(self):\n\
  \        return self.client.get_tv_shows()\n```\n\n- 3. 为了让 Java 客户端调用 Jython，我们需要创建一个工厂来创建嵌入式\
  \ Jython 解释器。\n\n```java\nimport org.python.core.PyObject;\nimport org.python.util.PythonInterpreter;\n\
  \npublic class TvShowServiceFactory {\n    private PyObject clazz;\n\n    public\
  \ TvShowServiceFactory() {\n        PythonInterpreter interp = new PythonInterpreter();\n\
  \        interp.exec(\"import JythonTvShowService\");\n        clazz = interp.get(\"\
  JythonTvShowService\");\n    }\n\n    public JavaTvShowService createTvShowService()\
  \ {\n        PyObject tvShowService = clazz.__call__();\n        return (JavaTvShowService)\n\
  \        tvShowService.__tojava__(JavaTvShowService.class);\n    }\n}\n```\n\n-\
  \ 4. 最后，我们可以编写一个 main 函数，先调用工厂，然后调用 JavaTvShowService。\n\n```java\npublic class\
  \ Main {\n    public static void main(String[] args) {\n        TvShowServiceFactory\
  \ factory =\n            new TvShowServiceFactory();\n        JavaTvShowService\
  \ service =\n            factory.createTvShowService();\n        PyList tvShows\
  \ = service.getTvShows();\n        for (int i = 0; i < tvShows.__len__(); i++) {\n\
  \            PyObject obj = tvShows.__getitem__(i);\n            PyTuple tvShow\
  \ =\n                (PyTuple)obj.__tojava__(PyTuple.class);\n            System.out.println(\"\
  Tv show title=\" + tvShow.get(0) +\n                \" airDate=\" + tvShow.get(1)\
  \ +\n                \" episode=\" + tvShow.get(2) +\n                \" writer=\"\
  \ + tvShow.get(3));\n        }\n    }\n}\n```\n\n我们定义了一个接口，为同时针对 Java 消费者和 Jython\
  \ 服务进行编码提供了一个良好的边界。我们的 Jython 类扩展了该接口，并在创建时创建了一个 IoC 容器，该容器请求一个 `web_client` 对象。这就是我们的\
  \ `PyroProxyFactory`，它使用 Pyro 通过线路调用我们的纯 Python 服务。通过实现接口，我们方便地将远程过程调用暴露给 Java 消费者。我们的\
  \ Java 应用程序需要一个 `factory` 类来创建 Jython 解释器，进而创建我们 Jython 类的实例。我们在应用程序 main 中使用它来获取\
  \ TV 服务的实例。使用该服务，我们调用暴露的方法，这会进行 Pyro 远程调用。我们遍历接收到的列表并提取元组以打印结果。\n\n在瞥见如何将纯 Python\
  \ 服务暴露给纯 Java 消费者之后，从这里开始的选项是无穷无尽的。我们可以使用 Spring Java 的 `RmiServiceExporter` 或 `HessianServiceExporter`\
  \ 将我们的 Python 服务暴露给其他协议。该服务可以集成到 Spring Integration 工作流中或成为 Spring Batch 作业的一部分。真的没有限制。我们将在\
  \ *第 10 章* 中通过案例研究更详细地探讨这一点。\n\n我们已经了解了将 Python 服务暴露给 Java 消费者是多么容易。如果你已经熟悉 Spring\
  \ Java，希望在阅读本书时，你会注意到 *Spring 方式* 不仅适用于 Java，也适用于 Python。Spring Python 使用与 Spring\
  \ Java 相同的概念，与 Spring Java 共享一些类名，甚至有一个 XML 解析器可以读取 Spring Java 的格式。所有这些都增加了在对配置文件进行少量更改的同时将某些部分重写为\
  \ Python 的能力。所有这些方面都使我们更容易逐步将应用程序迁移到我们为提高生产力所需的最佳位置。\n\n## 扩展 Spring Python\n\n\
  Spring Python 通过其整洁分段的模块集提供对服务、库和 API 的便捷访问。Spring Python 的灵活性源于其模块化特性。提供给你一组易于组合的小块，比提供一组单体类以供扩展更具可重用性。这些技术为轻松集成当前技术和未来技术打开了大门。\n\
  \n在本章中，我们已经查看了各种功能，包括 remoting、`DatabaseTemplate` 和 Python 与 Java 的集成。随着我们探索 Spring\
  \ Python 的其他功能，我希望你能意识到使用 *Spring 方式* 编写有用的抽象并将对象创建委托给 Spring Python 容器，使得编写尚未成为此项目一部分的更多模块变得容易。\n\
  \n随着你的需求增长，该项目也会随之增长。Spring Python 使编写自己的模板和模块变得容易。你可以像 Spring Python 的预构建服务一样轻松地编写和注入自定义服务。如果你有关于新功能的想法，认为它们属于\
  \ Spring Python，你可以访问网站 http://springpython.webfactional.com 了解如何提交想法、补丁，或许加入团队帮助\
  \ Spring Python 发展。\n\n## 安装 Spring Python\n\nSpring Python 安装很容易。它附带两个可安装的 tar\
  \ 包。一个是核心库本身。另一个是一组可选安装的示例，可帮助你更好地理解 Spring Python。由于它是用纯 Python 编写的，已安装的文件也是源代码，因此你可以了解\
  \ Spring Python 的工作原理。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_31_0.png)\n\n\
  > 本安装部分不展示安装开发 Spring Python 项目补丁所需的所有部分。如需了解设置开发环境方面的更多信息，请加入 Spring Python 邮件列表\
  \ http://lists.springsource.com/listmanager/listinfo/springpython-users，在那里你可以询问当前开发要求。\n\
  \n## 为 Spring Python 设置环境\n\n安装 Spring Python 目前需要 Python 2.4、2.5 或 2.6。它也可以在 Jython\
  \ 2.5 上运行。在撰写本文时，由于缺乏向后兼容性和成熟度，它尚未扩展以支持 Python 3。然而，随着 Python 3 在用户社区中获得认可，Spring\
  \ Python 也将迁移以支持它。\n\nSpring Python 使与某些第三方库的集成变得更容易。本书不涵盖这些第三方库的安装。例如，要针对 Oracle\
  \ 数据库编写查询，你需要安装 **cxora** 包。\n\n\n\n## 从预构建的二进制下载安装\n\n二进制文件由 SpringSource 以 tar\
  \ 包的形式托管在社区部分。它们是非操作系统特定的，应该可以在任何平台上运行。\n\n1. 访问 http://www.springsource.org/download/community。你可以填写注册信息，或直接点击链接前往下载站点\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_32_0.png)\n\n2. 点击 Spring Python 查看最新版本：\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_33_0.png)\n\n3. 下载 `springpython-<release>.tar.gz`\
  \ 以获取核心库\n\n4. 解压 tar 包，并进入包含 `setup.py` 的目录\n\n5. 输入以下命令安装 Spring Python\n\n> 注意：此步骤可能需要管理员权限！\n\
  > $ python setup.py install\n\n6. 现在你应该能够测试安装。\n\n```\n$ python\n>>> import springpython\n\
  >>> dir()\n['__builtins__', '__doc__', '__name__', 'springpython']\n```\n\n## 从源代码安装\n\
  \nSpring Python 可以像许多其他开源项目一样从源代码安装。代码托管在 Subversion 仓库中。以下步骤将帮助你下载代码并在机器上安装：\n\n\
  1. 输入以下命令检出最新的 trunk 仓库：\n```bash\n$ svn checkout https://src.springframework.org/svn/se-springpython-py/trunk/springpython\
  \ springpython\n```\n这将在本地创建包含最新更改的目录 `springpython`。\n\n2. 进入包含 `build.py` 的目录。该脚本是构建、打包和测试\
  \ Spring Python 的关键工具。输入以下命令生成可安装的 Spring Python 包：\n```bash\n$ ./build.py -package\n\
  ```\n\n3. 进入 `target/artifacts`，该目录包含新生成的 tar 包。\n\n4. 解压 tar 包 `springpython-<release>.tar.gz`，并进入包含\
  \ `setup.py` 的目录，然后输入以下命令安装 Spring Python：\n```bash\n$ python setup.py install\n\
  ```\n\n5. 现在你应该能够测试安装。\n```bash\n$ python\n>>> import springpython\n>>> dir()\n\
  ['__builtins__', '__doc__', '__name__', 'springpython']\n```\n\n6. 使用 Subversion\
  \ 仓库获取源代码可让你轻松安装新更新。\n\n7. 输入以下命令更新你的检出。\n```bash\n$ svn update /path/for/springpython\n\
  ```\n\n8. 使用 `build.py`、`target/artifacts` 和 `setup.py` 重复上述步骤。\n\n> 注意：此步骤可能需要管理员权限。\n\
  > $ python setup.py install\n\n> 正式发布版本位于 Subversion 仓库的 tags 部分，紧邻 trunk。\n\n>\
  \ 你也可以使用 SpringSource 的 Fisheye 查看器在 https://fisheye.springframework.org/browse/se-springpython-py\
  \ 可视化检查代码。这提供了一种查看代码、变更集和变更日志的方式。\n\n## Spring Python 社区\n\nSpring Python 重视其用户社区，并在关键功能上以用户请求为依据。Spring\
  \ Python 中目前的许多功能都是基于用户请求、提交的补丁和反馈添加的。\n\n- `http://springpython.webfactional.com`—项目网站，包括参考文档的链接\n\
