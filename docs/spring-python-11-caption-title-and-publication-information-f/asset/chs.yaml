  \        self.data.append(Flight(\"SpringAir 14\", \"9:02am Melbourne\", \"10:45am\
  \ Nashville\"))\n        self.data.append(Flight(\"Python Airways 28\", \"10:40am\
  \ Orlando\", \"2:15pm San Francisco\"))\n\n    def flights(self):\n        return\
  \ self.data\n```\n\n## 案例研究 II – 将 Spring Python 与您的 Java 应用程序集成\n\n那里没什么，只是包含一个\
  \ Flight 实例的简单 Python 数组。但我们希望从易于可视化的小型简单部分构建起来。有了所有这些部分，让我们再次查看网页。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_242_0.png)\n\
  \n现在我们可以看到这小段示例航班数据。\n\n- 5. 让我们添加一个搜索框以提供一些最小的过滤功能\n\n```\n@cherrypy.expose\ndef\
  \ flight_listings(self, criteria=\"\"):\n    page = header() + \"\"\"\n        <H2>Search\
  \ Flight Listings</H2>\n        <form method=\"POST\" action=\"/flight_listings\"\
  >\n            Search: <input type=\"text\"\n                        name=\"criteria\"\
  \n                        value=\"%s\"\n                        size=\"10\"/>\n\
  \            <input type=\"submit\"/>\n        </form>\n        <table border=\"\
  1\">\n            <tr>\n                <th>Flight</th>\n                <th>Departure</th>\n\
  \                <th>Arrival</th>\n            </tr>\n        \"\"\" % criteria\n\
  \n    for f in self.controller.flights(criteria):\n        page += \"<tr><td>%s</td><td>%s</td><td>%s</td></tr>\"\
  \ % \\\n            (f.flight, f.departure, f.arrival)\n\n    page += \"</table>\"\
  \ + footer()\n\n    return page\n```\n\n我们在屏幕顶部添加了一个文本输入框和一个按钮。搜索条件现在会传递给控制器对象以进行任何过滤。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_243_0.png)\n\n6. 你将如何利用用户输入的文本在控制器中进行过滤？我们应该区分大小写还是稍微放宽一点？如果你作为客户使用，你希望与哪些字段进行比较？这里有一个使用方法：\n\
  \n```\ndef flights(self, criteria):\n    return [f for f in self.data \\\n     \
  \   if criteria.lower() in str(f).lower()]\n```\n\n这会抓取示例数据并应用过滤列表推导式。过滤器会对 criteria\
  \ 以及航班记录的字符串化版本同时应用 lower()。\n\n7. 让客户搜索的一种方法是针对航班记录中的所有数据进行搜索\n\n```\ndef __str__(self):\n\
  \    return \"%s %s %s\" % \\\n        (self.flight, self.departure, self.arrival)\n\
  ```\n\n经过所有这些更改后，我们现在可以进行简单的航班搜索。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_244_0.png)\n\
  \n你会考虑哪些其他搜索选项来使其更复杂？\n\n## 从示例 Python 数据迁移到真实 Java 数据\n\n到目前为止，我们查看的是几行示例数据。更现实的场景将是接入某种实时系统，列出实时航班。如果数据存储在后端数据库中，并且服务已经用\
  \ Java 编写，你会怎么做？\n\n- 你会尝试绕过 Java 系统直接与数据库通信吗？这种方法有哪些风险？\n- 你会放弃我们刚刚构建的 Python 前端，转而启动一个基于\
  \ Java 的门户吗？如果这已经花费了几个月的时间努力呢？\n\n\n\n让我们看看 Jython 如何将这两个世界整合在一起。Jython 是否支持我们迄今为止使用过的所有\
  \ Python 组件？\n\nJython 在 2009 年底追上了 Python 2.5 并具有许多有用的功能。但尽管有显著改进，许多第三方 Python\
  \ 库仍然无法在 Jython 上运行。许多库利用了 Python 的 C 扩展能力，但 Jython 不支持这一点。还有一些平台假设涉及线程等事物，这些在 CPython\
  \ 中与 Jython 运行所在的 JVM 相比有所不同。\n\n> 在撰写本文时，CherryPy 在没有进行一些小调整的情况下在 Jython 上存在问题。Sqlite\
  \ 支持也尚未可用。可以从 Jython 访问 Java 组件，但假设我们计划使用的所有 Python 组件都能运行是不现实的。\n\nSpring Python\
  \ 通过其与 Pyro 远程库的集成，使得弥合这一差距变得容易。\n\n- 1. 要将我们的数据访问控制器迁移到 Java，我们也需要将 Flight 记录一起迁移。\n\
  \n```java\npublic class Flight {\n\n    private long id;\n    private String flight;\n\
  \    private String departure;\n    private String arrival;\n\n    public long getId()\
  \ {\n        return this.id;\n    }\n\n    public void setId(long id) {\n      \
  \  this.id = id;\n    }\n\n    public String getFlight() {\n        return this.flight;\n\
  \    }\n\n    public void setFlight(String flight) {\n        this.flight = flight;\n\
  \    }\n\n    public String getDeparture() {\n        return this.departure;\n \
  \   }\n\n    public void setDeparture(String departure) {\n        this.departure\
  \ = departure;\n    }\n\n    public String getArrival() {\n        return this.arrival;\n\
  \    }\n\n    public void setArrival(String arrival) {\n        this.arrival = arrival;\n\
  \    }\n\n    public String toString() {\n        return flight + \" \" + departure\
  \ + \" \" + arrival;\n    }\n}\n```\n\n- 2. 接下来，让我们用 Java 重写控制器。为了简化操作，我们将使用原始的\
  \ Spring Framework 来编写查询\n\n```java\nimport java.sql.ResultSet;\nimport java.sql.SQLException;\n\
  import java.util.List;\n\nimport javax.sql.DataSource;\n\nimport org.springframework.jdbc.core.JdbcTemplate;\n\
  import org.springframework.jdbc.core.RowMapper;\n\npublic class FlightDataSystem\
  \ {\n\n    private JdbcTemplate jdbcTemplate;\n\n    public FlightDataSystem(DataSource\
  \ dataSource) {\n        this.jdbcTemplate = new JdbcTemplate(dataSource);\n   \
  \ }\n\n    public List<Flight> flights(String criteria) {\n        return jdbcTemplate.query(\n\
  \            \"SELECT id, flight, departure, arrival \" +\n            \"FROM flights\"\
  ,\n            new RowMapper<FlightData>() {\n                @Override\n      \
  \          public FlightData mapRow(final ResultSet rs, int row)\n             \
  \       throws SQLException {\n                    return new Flight() {{\n    \
  \                    setId(rs.getLong(\"id\"));\n                        setFlight(rs.getString(\"\
  flight\"));\n                        setDeparture(rs.getString(\"departure\"));\n\
  \                        setArrival(rs.getString(\"arrival\"));\n              \
  \      }};\n                }\n            });\n    }\n}\n```\n\n> 注意这段 Java 代码中的双大括号吗？这是一个\
  \ Flight 的匿名子类，带有一个初始化代码块。这是一种方便的方式，可以减少填充 POJO（Plain Old Java Object，普通旧 Java 对象）的样板代码。\n\
  \n- 3. 为了让我们的控制器能够与 MySQL 数据库通信并利用 Spring Framework，我们需要一些额外的 jar 文件。包括：\n- org.springframework.beans\n\
  - org.springframework.core\n- org.springframework.jdbc\n- org.springframework.transaction\n\
  - commons-dbcp\n- commons-logging\n- commons-pool\n- mysql-connector-java\n\n编写脚本重新构建\
  \ Java 部分，考虑到这些 jar 文件，是读者的练习。\n\n- 4. 在测试此代码之前，我们需要设置数据库：\n\n```sql\nDROP DATABASE\
  \ IF EXISTS booking;\n\nCREATE DATABASE booking;\n\nGRANT ALL ON booking.* TO booking@localhost\
  \ IDENTIFIED BY 'booking';\n```\n\n```sql\nUSE booking;\n\nCREATE TABLE flights\
  \ (\n    id INT(4) UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY KEY,\n    flight VARCHAR(30),\n\
  \    departure VARCHAR(30),\n    arrival VARCHAR(30)\n);\n\nINSERT INTO flights\
  \ (flight, departure, arrival) values ('SpringAir 14', '9:02am Melbourne', '10:45am\
  \ Nashville');\nINSERT INTO flights (flight, departure, arrival) values ('Python\
  \ Airways 28', '10:40am Orlando', '2:15pm San Francisco');\n```\n\n以下截图显示了运行此脚本以设置和加载数据的过程：\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_248_0.png)\n\n- 5. 现在我们已经将控制器代码迁移到 Java\
  \ 并设置了模式，让我们编写一个简单的 Jython 脚本来打印出航班数据\n\n```python\nimport FlightDataSystem\nfrom\
  \ org.apache.commons.dbcp import BasicDataSource\n\nsource = BasicDataSource()\n\
  source.driverClassName = \"com.mysql.jdbc.Driver\"\nsource.url = \"jdbc:mysql://localhost/booking\"\
  \nsource.username = \"booking\"\nsource.password = \"booking\"\n\nsystem = FlightDataSystem(source)\n\
  \nfor f in system.getFlightData():\n    print f\n```\n\n运行它时，我们需要包含几个 jar 文件。\n\n\
  ![](img/bcf886d8b665372ee8afbb620d4273bb_249_0.png)\n\n你可以看到输入的命令，以及将航班数据打印到控制台的输出。\n\
  \n在将事物连接起来之前，还有一个关键因素需要处理：数据的序列化。当我们的 Java 代码返回一个 Java 对象数组时，它必须由 Pyro 序列化，通过线路发送，然后由\
  \ CPython 反序列化。对于标量来说，这不是问题。Jython 可以轻松处理。但移动类对象需要在线路的两侧都有类定义。CPython 无法访问我们的 Java\
  \ Flight 类，而 Java 代码也无法访问 CPython 类。我们需要在中间有一段薄代码，可以调用我们的 Java 服务并将 Java 对象列表转换为\
  \ Python 对象。Jython 包装器将是完美的。\n\n```python\nfrom model import *\n\nclass JythonFlightDataSystem(object):\n\
  \    def __init__(self, java_system):\n        self.java_system = java_system\n\n\
  \    def flights(self, criteria):\n        return [Flight(f.flight, f.departure,\
  \ f.arrival) \\\n                for f in self.java_system.flights(criteria)]\n\
  ```\n\n这个包装类具有相同的签名。在 Jython 中运行它将使其能够访问 Java 类以及我们的 Python 类。\n\n- 6. 让我们使用 Spring\
  \ Python IoC 配置来连接我们的服务，然后使用 PyroServiceExporter 暴露它\n\n```python\nimport logging\n\
  from springpython.config import *\nfrom springpython.context import *\nfrom springpython.remoting.pyro\
  \ import *\n\nimport FlightDataSystem\nfrom org.apache.commons.dbcp import BasicDataSource\n\
  from java_wrapper import *\n\nclass JavaSystemConfiguration(PythonConfig):\n   \
  \ def __init__(self):\n        super(JavaSystemConfiguration, self).__init__()\n\
  \n    @Object\n    def data_source(self):\n        source = BasicDataSource()\n\
  \        source.driverClassName = \"com.mysql.jdbc.Driver\"\n        source.url\
  \ = \"jdbc:mysql://localhost/booking\"\n        source.username = \"booking\"\n\
  \        source.password = \"booking\"\n        return source\n\n    @Object\n \
  \   def exported_controller(self):\n        exporter = PyroServiceExporter()\n \
  \       exporter.service_name = \"JavaFlightDataSystem\"\n        exporter.service\
  \ = self.controller()\n        return exporter\n\n    @Object\n    def controller(self):\n\
  \        java_system = FlightDataSystem(self.data_source())\n        wrapper = JythonFlightDataSystem(java_system)\n\
  \        return wrapper\n```\n\n- 7. 使用此配置，我们使用 Apache Commons BasicDataSource 创建连接池来访问\
  \ MySQL 数据库\n\n- 8. 我们创建了基于 Java 的 FlightDataSystem 的实例。但我们不会直接返回它，而是将其注入到我们的 JythonFlightDataSystem\
  \ 中，以便它可以在 Java 和 Python 记录之间进行转换\n\n- 9. 我们还创建了一个 PyroServiceExporter，并让它指向我们的\
  \ controller()。它以 JavaFlightDataSystem 的名称进行广告\n\n- 10. 我们需要一个启动脚本来启动我们的 Jython\
  \ 服务\n\n```python\nimport logging\nimport os\nimport java_app_context\nfrom springpython.context\
  \ import ApplicationContext\n\nif __name__ == '__main__':\n    logger = logging.getLogger(\"\
  springpython\")\n    loggingLevel = logging.DEBUG\n    logger.setLevel(loggingLevel)\n\
  \    ch = logging.StreamHandler()\n    ch.setLevel(loggingLevel)\n    formatter\
  \ = logging.Formatter(\"%(asctime)s - %(name)s - %(levelname)s - %(message)s\")\n\
  \    ch.setFormatter(formatter)\n    logger.addHandler(ch)\n\n    applicationContext\
  \ = ApplicationContext(\\\n        java_app_context.JavaSystemConfiguration())\n\
  \    controller = applicationContext.get_object(\"controller\")\n```\n\n- 11. 使用第三方库运行\
  \ Jython 脚本可能有点棘手。为了确保 JVM 可以从 jar 文件加载类，需要将 jar 文件作为类路径条目传递给 JVM\n\n```\njython\
  \ -J-classpath org.springframework.jdbc-3.0.1.RELEASE.jar:org.springframework.core-3.0.1.RELEASE.jar:org.springframework.transaction-3.0.1.RELEASE.jar:org.springframework.beans-3.0.1.RELEASE.jar:commons-logging-1.1.1.jar:commons-dbcp-1.4.jar:commons-pool-1.5.4.jar:mysql-connector-java-5.1.12-bin.jar\
  \ java_system.py\n```\n\n\n\n12. -J 参数向 JVM 传递参数。这对于类加载器能够从 jar 文件中提取类是必要的\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_252_0.png)\n\
  \n我们可以看到 Pyro 已启动并准备好为任何客户端提供数据。\n\n13. 在我们的 Jython 数据源运行时，我们现在可以在应用程序上下文中用 PyroProxyFactory\
  \ 替换原始的控制器定义\n\n```\n@Object\ndef controller(self):\n    java_system = PyroProxyFactory()\n\
  \    java_system.service_url = \\\n        \"PYROLOC://localhost:7766/JavaFlightDataSystem\"\
  \n    return java_system\n```\n\n14. 通过添加以下导入语句，我们现在可以在一个 shell 中重新启动预订应用程序，并在另一个\
  \ shell 中运行 Jython 服务\n\n```\nfrom springpython.remoting.pyro import *\n```\n\n\
  15. 现在，让我们使用 CPython 重新启动 booking.py 应用程序，并查看屏幕\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_253_0.png)\n\
  \n如果我们重新访问航班数据页面，它看起来一样：\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_253_1.png)\n\
  \n## 案例研究 II – 将 Spring Python 与您的 Java 应用程序集成\n\n然而，更仔细地查看 Jython 脚本的控制台输出，我们看到一条消息表明我们的\
  \ Java 代码正在被调用。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_254_0.png)\n\n过滤逻辑也已移至\
  \ Java 服务，因此我们得到了响应。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_254_1.png)\n\n\
  ## 包装 Java 代码的问题\n\n该解决方案中不太优雅的一部分是转换 CPython 与 Java 航班数据之间的包装代码。当将这些系统连接在一起时，将这些类型相互转换是必要的步骤。虽然包装代码解决了我们眼前的难题，但该代码的维护成本可能会增加。\n\
  \n由于很可能其他类也需要同样的关注，无论它们是输入参数还是结果，都需要一个更易于维护的解决方案。该行为涉及包装 Java 服务并检查输入和输出。这正是面向方面编程非常适合的用例类型。\n\
  \n将编写一个方面来扫描输入和输出并在 CPython 类型和 Java 类型之间应用某种映射，并将其连接起来以替换 Java 包装器，作为读者的练习留出。\n\
  \n## 摘要\n\n我们现在在 Python 中运行前端 Web 服务器，后端运行在 JVM 上。虽然这个示例并不花哨或一定是动态的，但它展示了将这两个系统集成的能力。\n\
  \n由于 Jython 的全部意义在于能够运行编译后的类文件，因此可以把基于 Java 的数据库代码替换为更复杂的方案，例如使用其简洁的 xmlSlurper\
  \ 模块的基于 Groovy 的源阅读器，或基于 Scala 的系统来监控多个航空公司的 RSS 源。\n\n与此同时，我们可以在 CherryPy 中继续使用我们喜爱的\
  \ Python 技术进行编码，或者选择另一个 Web 框架。我们还可以编写有用的命令行脚本来访问相同的后端信息。\n\n一个关键点是我们不必自己进行 wiring。Spring\
  \ Python 为我们完成了这项工作，而不是管理 Pyro 的低级 API。\n\nSpring Python 提供了我们在本书中介绍过的许多有价值的功能。有许多有用的抽象。但这些抽象与\
  \ Spring Java 提供的抽象并不是一一对应的。相反，它专注于 Python 库。例如，Spring Python 与 Pyro 集成，而 Spring\
  \ Java 与 RMI 集成。这是有道理的，因为 Python 开发者不太可能与基于 RMI 的系统集成，而更可能将 Python 组件连接在一起。\n\n\
  本书还介绍了强大的依赖注入概念。Spring Python 和 Spring Java 共享这一理念。在本书的各个示例中，我们看到了如何将组件解耦并在容器中连接它们。这使得测试变得容易，以小的影响引入服务，并允许随着需求变化而重新接线。这为开发人员提供了适应不断变化需求所需的灵活性。\n\
  \n在本章中我们学习了如何：\n\n- 使用 CherryPy 在 CPython 中构建前端，然后将其链接到用 Java 编写的后端\n- 创建必要的适配器代码来处理\
  \ CPython 和 Java 之间的序列化\n- 在不影响前端或后端的情况下，用 Python 到 Java 的调用替换 Python 到 Python 的调用\n\
  - 编译 Java 代码并使用第三方库从 Jython 运行它\n\n我希望你喜欢这本书，并且它能以新的方式激发你设计、编码和维护更强大的系统。\n\n## 索引\n\
