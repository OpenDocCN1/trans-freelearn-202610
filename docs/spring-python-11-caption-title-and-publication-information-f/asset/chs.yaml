- "# Spring Python 1.1\n\n## Credits\n\n**Author**\nGreg Lee Turnquist\n\n**Editorial\
  \ Team Leader**\nAanchal Kumar\n\n**Reviewers**\nBala Sundarasamy\nRuss Miles\n\
  Sylvain Hellegouarch\n\n**Project Team Leader**\nLata Basantani\n\n**Project Coordinator**\n\
