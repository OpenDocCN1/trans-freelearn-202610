  \ Security 将用户凭证存入 SecurityContextHolder。这可在不改动 API 的情况下从应用内部查询安全信息。\n\n目前我们已有一个简单\
  \ Web 应用，并用基于角色的 URL 保护层包装它。有时这不够。除了保护 URL，还可根据用户角色禁用或隐藏链接。这是更精细且易实现的方案。\n\nPage\
  \ 对象用于渲染 HTML，其页脚定义如下：\n\n```\ndef footer(self):\n    \"\"\"Standard footer used\
  \ for all pages.\"\"\"\n    footer = \"\"\"\n        <ul>\n            <li><a href=\"\
  /edit/\"\"\" + self.article + \"\"\"\">Edit</a></li>\n        </ul>\n        <a\
  \ href=\"http://springpythonbook.com\">Spring Python book</a>\n    </body>\n   \
  \ \"\"\"\n    return footer\n```\n\n查看文章时用户会看到编辑链接。若无 ROLE_EDIT，请求会被重定向到访问被拒绝页。\n\
  \n更优做法是隐藏该链接，避免点击。减少访问被拒绝页的出现可降低安全层压力并提升体验。当前方案不处理条件修改 HTML。写过滤器不实际。最好在此直接检查凭证并选择性渲染链接。\n\
  \n```\ndef footer(self):\n    \"\"\"Standard footer used for all pages.\"\"\"\n\
  \    footer = \"\"\nif \"ROLE_EDIT\" in SecurityContextHolder.getContext().\n  \
  \                      authentication.granted_auths:\n    footer += \"\"\"\n   \
  \ <ul>\n        <li><a href=\"/edit/\"\"\" + self.article + \"\"\">Edit\n      \
  \      </a></li>\n    </ul>\n    \"\"\"\n\n    footer += \"\"\"\n        <a href=\"\
  http://springpythonbook.com\">Spring Python book\n        </a>\n    </body>\n  \
  \  \"\"\"\n    return footer\n```\n\nSecurityContextHolder 是全局可访问对象，包含指定当前认证凭证存储位置的上下文。\n\
  \n- 若模式为 \"GLOBAL\"，整个 Python VM 只有一个上下文，所有线程共享同一安全凭证\n- 若模式为 \"THREADLOCAL\"，上下文存储在\
  \ threading.local() 中，每个线程有独立上下文。适用于为每个用户提供独立线程的多线程服务器\n\n执行时 SecurityContextHolder\
  \ 已填充用户数据，可快速检查并仅在用户有必要角色时提供链接，无需改动应用 API。这满足要求：凭证数据和其他安全 API 必须可非侵入式访问。\n\n## 测试应用安全\n\
  \n测试安全传统上很困难，因涉及多方面。需检查与第三方认证系统集成，确认应用使用安全系统，并验证好坏账户处理。常编码成功场景，也需验证失败场景。尤其要测试安全失败场景。若系统无法正确处理无效或过期凭证，安全就无意义。\n\
  \n使用替代应用上下文中的 `InMemoryUserDetailsService` 可轻松创建各种角色、权限、密码组合的用户账户。CherryPy 易于测试，因无需运行\
  \ Web 容器。CherryPy 将 URL 映射到方法，可直接从测试框架调用方法而非验证 CherryPy 的 Web 处理。交换数据访问层为 stub 或\
  \ mock 可隔离业务逻辑。\n\n这些有助于构建高置信度的自动化测试套件。应用核心易于自动化测试后，便于决定是否对 Web 层使用自动化 Web 容器测试工具。也可通过自动化集成测试第三方安全系统。\n\
  \n移除在业务逻辑中手工编码安全 API 并解耦 Web 层，使自动化测试更易，实现更强大的系统。\n\n## 配置基于 SQL 的安全\n\n我们用 `InMemoryUserDetailsService`\
  \ 为 Wiki 应用配置了启动安全。升级为数据库管理安全只需将其换为 `DatabaseUserDetailsService`。\n\n在 `SpringWikiAppContext`\
  \ 中，只需将 `user_details_service` 改为：\n\n```\n@Object\ndef user_details_service(self):\n\
  \    service = DatabaseUserDetailsService()\n    service.dataSource = self.factory()\n\
  \    return service\n```\n\n此处省略了 `factory()` 的编码。它是用于创建 `DatabaseTemplate` 连接数据库的连接工厂，如\
  \ SQL 章节所述。\n\n`DatabaseUserDetailsService` 定义了以下查询来查找用户数据和授权：\n\n- 查找用户：`SELECT\
  \ username,password,enabled FROM users WHERE username = ?`\n- 查找授权：`SELECT username,authority\
  \ FROM authorities WHERE username = ?`\n\n即使这些是默认设置，也易于支持其他 Schema。只需按如下覆盖变量。\n\n\
  ```\n@Object\ndef user_details_service(self):\n    service = DatabaseUserDetailsService()\n\
  \    service.dataSource = self.factory()\n    service.DEF_USERS_BY_USERNAME_QUERY\
  \ = \"<alt user qry>\"\n    service.DEF_AUTHORITIES_BY_USERNAME_QUERY = \"<alt auth\
  \ qry>\"\n    return service\n```\n\n## 配置基于 LDAP 的安全\n\nLDAP 是用于托管用户账户和组关联的流行协议。Spring\
  \ Python 提供便捷的 LdapAuthenticationProvider，支持常规 Schema 和自定义 Schema。\n\n> 写作时，Spring\
  \ Python LDAP 仅在 CPython 上工作，不在 Jython 上工作。\n\nLdapAuthenticationProvider 有两个组件：\n\
  \n- BindAuthenticator 和 PasswordComparisonAuthenticator 用于认证\n- DefaultLdapAuthoritiesPopulator\
  \ 基于常规 LDAP 组关联查找授权\n\nLDAP 支持绑定，服务器确认用户密码。BindAuthenticator 利用此功能确认密码。\n\n也可从目录服务器获取密码，并在正确哈希用户密码后进行比较。PasswordComparisonAuthenticator\
  \ 用于此操作。\n\n确认用户凭证后，LdapAuthenticationProvider 的第二步是搜索用户关联的组。\n\n以下代码展示了使用 BindAuthenticator\
  \ 和授权填充器的应用上下文。\n\n```\nfrom springpython.config import PythonConfig\nfrom springpython.config\
  \ import Object\n\nfrom springpython.security.providers.Ldap import *\n\nclass LdapAppContext(PythonConfig):\n\
  \    def __init__(self):\n        super(LdapAppContext, self).__init__()\n\n   \
  \ @Object\n    def auth_manager(self):\n        auth_manager = AuthenticationManager()\n\
  \        auth_manager.auth_providers = [self.auth_provider()]\n        return auth_manager\n\
  \n    @Object\n    def auth_provider(self):\n        provider = LdapAuthenticationProvider()\n\
  \        provider.ldap_authenticator = self.authenticator()\n        provider.ldap_authorities_populator\
  \ =\n            self.authorities_populator()\n        return provider\n\n    @Object\n\
  \    def context(self):\n        return DefaultSpringSecurityContextSource(\n  \
  \          url=\"ldap://localhost:53389/dc=springpythonbook,dc=com\")\n\n    @Object\n\
  \    def authenticator(self):\n        return BindAuthenticator(\n            context_source=self.context(),\n\
  \            user_dn_patterns=\"uid={0},ou=people\")\n\n    @Object\n    def authorities_populator(self):\n\
  \        return DefaultLdapAuthoritiesPopulator(\n            context_source=self.context(),\n\
  \            group_search_base=\"ou=groups\")\n```\n\n\n\n-   所有 LDAP 组件都指向一个目录服务器，格式为\
  \ `ldap://<server>:<port>/<baseDN>`\n-   `BindAuthenticator` 配置为从 `<baseDN>` 递归搜索，模式为\
  \ `uid={0},ou=people`，其中 `{0}` 将被提供的用户名替换。当找到 dn 时，会使用提供的密码执行绑定\n-   `DefaultLdapAuthoritiesPopulator`\
  \ 将在 baseDN 下一层级 `ou=groups` 中搜索，查找任何具有指向用户 dn 的 `member` 属性的条目。可以根据目录架构的不同，使用类似\
  \ `uniqueMember={0}` 的内容覆盖 `group_search_filter`。默认情况下，获取的组名将为组的 `cn`。覆盖 `group_role_attr`\
  \ 允许选择另一个属性。默认情况下，组名将被转换为大写，并加上 `ROLE_` 前缀。这些可以通过 `role_prefix` 和 `convert_to_upper`\
  \ 进行覆盖\n\n若要改为进行密码检查，请将 `BindAuthenticator` 替换为 `PasswordComparisonAuthenticator`\n\
  -   默认情况下它同时支持明文密码以及 base64 编码的 SHA 哈希密码。可以通过向 `encoder` 属性提供替代密码编码器来覆盖此设置\n-  \
  \ 它的构造函数参数与 `BindAuthenticator` 相同，这意味着你可以指定 `user_dn_patterns`\n-   默认情况下，它查找存储在\
  \ `userPassword` 属性中的密码。你可以通过设置 `password_attr_name` 属性来覆盖此设置\n\n如果你对密码认证或组管理有非传统的使用方式，可以插入你自己的\
  \ authenticator 或 authorities populater。我自己也遇到过这个问题，当时一个遗留系统将角色存储在用户记录内的自定义属性中，而不是单独的组。\n\
  \n凭借所有可覆盖默认设置的选择，启动 LDAP 安全管理应该相当容易。\n\n## 使用多个安全提供者很容易\n\n支持多个安全提供者是一个很有价值的功能。有几个常见用例在此情况下非常有益。\n\
  \n-   从旧的安全解决方案迁移到新的解决方案 — 这是指你已经开始使用一个安全提供者，但需要迁移到另一个提供者。例如，我们最初使用数据库存储用户账户，但希望迁移到双因素认证系统。\n\
  -   支持多个用户社区 – 这是指在两个不同服务器上运行的两个不同站点合并到一台服务器上运行。无需维护两个不同的应用程序，我们希望整合数据但保留现有的角色和账户。\n\
  -   提供冗余安全访问 – 这是在我们需要多个安全提供者来处理故障和维护窗口时。\n\n让我们更详细地探讨这些场景。\n\n### 从旧的安全解决方案迁移到新的解决方案\n\
  \n一个非常实用的用例是当你想将用户从旧的登录系统迁移到新的系统时。例如，你的项目可能有多个工具都使用各自的自定义数据库解决方案。然而，你最终希望将每个人的详细信息集中到一个公共的\
  \ LDAP 服务器中。在两个系统都启用后，随着新用户获得新凭证，他们可以无服务中断地登录。一旦所有人都迁移完成，你就可以移除旧的安全提供者。\n\n它也使得拥有冗余的安全提供者变得容易，例如指向多个\
  \ LDAP URL。\n\n之前，我们看到过如下所示的 AuthenticationManager 配置：\n\n```\n@Object\ndef auth_manager(self):\n\
  \    auth_manager = AuthenticationManager()\n    auth_manager.auth_providers = [self.auth_provider()]\n\
  \    return auth_manager\n```\n\nAuthenticationManager 支持一个提供者列表。它会依次遍历每个提供者，直到匹配成功为止。为了支持迁移用例，可以将其修改为如下所示：\n\
  \n```\n@Object\ndef auth_manager(self):\n    auth_manager = AuthenticationManager()\n\
  \    auth_manager.auth_providers = [\n        self.old_auth_provider(),\n      \
  \  self.new_auth_provider()]\n    return auth_manager\n```\n\n采用这种设置后，我们的系统将首先尝试使用旧的身份验证提供者。但是，如果失败，Spring\
  \ Python Security 将尝试新的身份验证提供者。\n\n### 支持多个用户社区\n\n我们的应用程序可能需要支持多个用户。想象一下，我们已经开发了应用程序，并且也完成了\
  \ Spring Python Security 配置，基于 DatabaseUserDetailsService 处理用户。在此之后不久，我们的公司收购了另一家公司，带来了许多需要访问系统的员工。将他们迁移到新系统可能代价太高。或者至少成本太高。相反，配置另一个身份验证提供者指向他们的当前系统会容易得多。唯一需要的其他功能就是将新用户的额外角色添加到访问决策管理器中。\n\
  \n该解决方案看起来与之前的用例非常相似。公司现在可以轻松决定是否继续这种方式，或开始将新用户迁移到已有的系统中，如前一用例所示。\n\n### 提供冗余安全访问\n\
  \n我们刚刚完成了配置 LDAP 服务器安全访问的过程。在当前版本的 Spring Python 中，它仅支持一个 URL。要在冗余解决方案中处理两个 LDAP\
  \ 服务器，只需配置每个组件的两个实例，然后将其插入 AuthenticationManager 即可。\n\n```python\nfrom springpython.config\
  \ import PythonConfig\nfrom springpython.config import Object\n\nfrom springpython.security.providers.Ldap\
  \ import *\n\nclass LdapAppContext(PythonConfig):\n    def __init__(self):\n   \
  \     super(LdapAppContext, self).__init__()\n\n    @Object\n    def auth_manager(self):\n\
  \        auth_manager = AuthenticationManager()\n        auth_manager.auth_providers\
  \ = [\n            self.auth_provider1(),\n            self.auth_provider2()]\n\
  \        return auth_manager\n\n    @Object\n    def auth_provider1(self):\n   \
  \     provider = LdapAuthenticationProvider()\n        provider.ldap_authenticator\
  \ = self.authenticator1()\n        provider.ldap_authorities_populator =\n     \
  \       self.authorities_populator1()\n        return provider\n\n    @Object\n\
  \    def auth_provider2(self):\n        provider = LdapAuthenticationProvider()\n\
  \        provider.ldap_authenticator = self.authenticator2()\n        provider.ldap_authorities_populator\
  \ =\n            self.authorities_populator2()\n        return provider\n\n    @Object\n\
  \    def context1(self):\n        return DefaultSpringSecurityContextSource(\n \
  \           url=\"ldap://server1:53389/dc=springpythonbook,dc=com\")\n    @Object\n\
  \    def context2(self):\n        return DefaultSpringSecurityContextSource(\n \
  \           url=\"ldap://server2:53389/dc=springpythonbook,dc=com\")\n\n    @Object\n\
  \    def authenticator1(self):\n        return BindAuthenticator(\n            context_source=self.context1(),\n\
  \            user_dn_patterns=\"uid={0},ou=people\")\n\n    @Object\n    def authenticator2(self):\n\
  \        return BindAuthenticator(\n            context_source=self.context2(),\n\
  \            user_dn_patterns=\"uid={0},ou=people\")\n\n    @Object\n    def authorities_populator1(self):\n\
  \        return DefaultLdapAuthoritiesPopulator(\n            context_source=self.context1(),\n\
  \            group_search_base=\"ou=groups\")\n\n    @Object\n    def authorities_populator2(self):\n\
  \        return DefaultLdapAuthoritiesPopulator(\n            context_source=self.context2(),\n\
  \            group_search_base=\"ou=groups\")\n```\n\n虽然 Spring Python 最终可能会支持多个\
  \ URL，但组合现有组件的能力为你提供了现成的可用解决方案。\n\n## 编写自己的安全扩展\n\n虽然本章迄今为止展示的所有功能都体现了一个强大的安全框架，但可以说最重要的功能是能够编写一个自定义安全扩展并将其插入此架构。\n\
  \n在 LDAP 部分中曾提到，可以调整搜索位置以查找与用户相关的组。在 SQL 部分中，展示了可以注入自定义查询。这两个功能都允许灵活调整，然而它们的弯曲程度有限。如果我们的安全系统高度专业化，那么直接编写自己的扩展并将其插入可能更容易。\n\
  \n如果 Spring Python 尚未支持其他安全系统，例如双因素令牌、OpenID 或 X.509 证书，也需要这样做。虽然未来可能会支持这些功能，但我们的需求可能无法等待。\n\
  \n### 编写自定义身份验证提供者\n\n对于我们的示例，让我们编写一个基于登录数据库而不是进行密码比较的自定义身份验证提供者。\n\n> 这个示例与我曾经处理过的真实情况相符。我继承了一个基于将用户登录到数据库然后查找角色的应用程序。这将密码限制为数据库所支持的格式，从而不允许我们制定统一的可接受密码策略。迁移该应用程序脱离此有限解决方案的第一步需要一个与此示例类似的自定义身份验证提供者。它使我能够利用此框架，该框架提供了插入指向新用户安全数据的另一个安全提供者的能力。\n\
  \n为了编写自定义安全提供者，我们需要编写具有以下签名的 authenticate 方法：\n\n```\ndef authenticate(self, authentication)\n\
  ```\n\n\n\n认证提供者预计要么成功要么失败，其行为如下：\n\n- 如果认证 *成功*，返回一个认证对象。建议创建一个新的 `UsernamePasswordAuthenticationToken`\
  \ 实例，将 `username`、`password` 和 `granted_auths` 复制进去，然后返回它。这是 Spring Python Security\
  \ 的所有提供者都使用的同一个类。我们 *不* 需要在令牌上调用 `setAuthenticated(true)`。`AuthenticationManager`\
  \ 会为我们处理\n- 如果认证 *失败*，抛出一个 `BadCredentialsException`\n\n对于此提供者，我们可以使用 `DatabaseTemplate`\
  \ 来完成大部分工作。为此，我们需要一个注入的 SQL 连接工厂。如果我们使用用户提供的用户名和密码设置，则可以创建一个 `DatabaseTemplate`\
  \ 并尝试查询以检索用户的角色。由于我们的 `DatabaseTemplate` 实例在执行查询之前会尝试登录数据库，因此这应作为我们的认证检查。如果成功，我们将在结果集中收到授予的权限。如果失败，我们将得到一个\
  \ SQL 异常，我们可以捕获它并替换为 `BadCredentialsException`。\n\n```\nfrom springpython.security.providers\
  \ import *\nfrom springpython.database.core import *\n\nclass MySqlLoginAuthenticationProvider(AuthenticationProvider):\n\
  \    def __init__(self, factory=None):\n        self.factory = factory\n\n    def\
  \ authenticate(self, authentication):\n        self.factory.username = authentication.username\n\
  \        self.factory.password = authentication.password\n        dt = DatabaseTemplate(self.factory)\n\
  \n        try:\n            authorities =\n                dt.query(\"select authority\
  \ from user where username = ?\",\n                        (authentication.username,),\n\
  \                        rowhandler=DictionaryRowMapper())\n\n            return\
  \ UsernamePasswordAuthenticationToken(\n                authentication.username,\n\
  \                authentication.getCredentials(),\n                [auth[\"authority\"\
  ] for auth in authorities])\n        except:\n            raise BadCredentialsException(\"\
  Invalid credentials\")\n```\n\n由于每个连接工厂略有不同，我们假设传入的是一个 `MySqlConnectionFactory`。我们的新提供者可立即使用。就这么简单，满足了我们的需求：'users\
  \ must be able to quickly write custom security extensions to handle legacy security\
  \ solutions'。\n\n使此示例更复杂的一种方法将是使其处理当前的一组连接工厂。但就目前而言，它作为演示如何在 Spring Python Security\
  \ 当前未涵盖的方式下对现有系统进行身份验证的合适示例是有效的。\n\n## 使用 Spring Python Security 的一些挑战\n\nSpring\
  \ Python Security — 如本章所示 — 极其灵活、高度可扩展且非侵入式。然而，这是有代价的。所有内容都必须手工配置（并且配置正确）。\n\n这是针对\
  \ Acegi Security 提出的主要批评之一。此后，Acegi Security（现品牌为 Spring Security）发布了多个更新版本，减少了所需的手动配置量。他们现在为许多行业标准安全选项提供快捷方式，同时仍允许我们添加自定义选项，使为我们的需求[content]\n\
  认证提供者预计要么成功要么失败，其行为如下：\n\n- 如果认证 *成功*，返回一个认证对象。建议创建一个新的 `UsernamePasswordAuthenticationToken`\
  \ 实例，将 `username`、`password` 和 `granted_auths` 复制进去，然后返回它。这是 Spring Python Security\
  \ 的所有提供者都使用的同一个类。我们 *不* 需要在令牌上调用 `setAuthenticated(true)`。`AuthenticationManager`\
  \ 会为我们处理\n- 如果认证 *失败*，抛出一个 `BadCredentialsException`\n\n对于此提供者，我们可以使用 `DatabaseTemplate`\
  \ 来完成大部分工作。为此，我们需要一个注入的 SQL 连接工厂。如果我们使用用户提供的用户名和密码设置，则可以创建一个 `DatabaseTemplate`\
  \ 并尝试查询以检索用户的角色。由于我们的 `DatabaseTemplate` 实例在执行查询之前会尝试登录数据库，因此这应作为我们的认证检查。如果成功，我们将在结果集中收到授予的权限。如果失败，我们将得到一个\
