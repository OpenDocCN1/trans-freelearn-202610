  - `http://blog.springpython.webfactional.com`—Spring Python 作者的博客网站\n- http://lists.springsource.com/archives/springpython-users\
  \ — Spring Python 用户的邮件列表\n- http://www.linkedin.com/groups?gid=1525237 — Spring\
  \ Python 用户的 LinkedIn 群组\n\n## 摘要\n\n我们对 Spring Python 的各个部分进行了快速浏览。示例展示了 Spring\
  \ Python 如何让 Python 和 Java 开发者都更轻松。\n\n在本章中，我们了解到：\n\n- Spring Python 具有非侵入式 API，使你无需对自己的代码库进行重大更改即可轻松使用其他库\n\
  - Spring Python 具有一个容器，将对象创建与对象使用解耦，从而赋能开发者\n- Spring Python 通过提供非侵入式 API 来帮助专业\
  \ Python 开发者轻松访问高级服务\n- Spring Python 为专业 Java 开发者提供了一种简单的方式，通过 Python/Jython/Java\
  \ 的组合将 Python 和 Java 混合使用\n- Spring Python 可以从二进制和源代码安装\n- Spring Python 非常可扩展，并且很容易让我们添加新组件\n\
  - 有一个用户社区，我们可以在其中发布问题、答案、想法和补丁\n\n在下一章中，我们将深入 Spring Python 的核心，即其 `Inversion of\
  \ Control` 容器。\n\n# 2 Spring Python 的核心——控制反转\n\n# Spring Python 的核心——控制反转\n\n许多软件团队寻求在不牺牲质量的情况下提高生产力的方法。这导致自动化测试增加，进而引发了使应用程序更易于测试的兴趣。许多自动化测试框架通过用测试替身交换协作对象来提供罐装响应，从而促进对象隔离。这要求开发者以尽可能少的更改插入测试替身。\n\
  \n有时，管理者通过削减开发和集成硬件来压缩预算。这使开发者面临在比生产环境更小的环境中开发的困境。软件开发者需要能够在不同的测试配置和部署场景之间切换的能力。\n\
  \n销售给客户的软件产品通常需要在现场进行灵活调整，无论是通过公司代表还是客户本人。\n\n在本章中，我们将探讨 Spring Python 的 **控制反转\
  \ (IoC)** 容器如何通过将关键对象的创建移入容器定义来满足所有这些需求，从而在不影响核心业务代码的情况下实现灵活调整。\n\n本章将涵盖：\n\n- IoC\
  \ 容器如何使隔离测试对象变得容易，以便进行自动化测试。\n- 对 IoC 的详细解释，附带高层图表。我们将学习依赖注入是如何一种 IoC 类型，并使用好莱坞原则\
  \ *别叫我们，我们会叫你！*\n- Spring Python 的 IoC 容器，处理依赖解析、设置属性和延迟初始化。它还为开发者按需使用提供扩展点。\n-\
  \ Spring Python 对动态语言中 IoC 的社区争论的回应。\n- 如何轻松地将 Python 和 Java 组件混合使用，可以有多种方式，并为开发者提供选择最适合其需求的好方法。\n\
  \n### 用测试替身交换生产代码\n\n作为开发者，我们需要能够用模拟对象和存根交换生产对象的能力。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_38_0.png)\n\
  \n> 模拟对象和存根是生成用于测试代码的罐装响应的两种方式。**模拟对象** 用于生成罐装方法调用。**存根** 用于生成罐装数据。这两者都是模拟代码必须工作的外部组件的有用工具。更多详情请参阅\
  \ http://martinfowler.com/articles/mocksArentStubs.html\n\n在此示例中，我们将探讨 IoC 容器如何使交换生产对象与模拟实例变得容易。我们从为\
  \ wiki 引擎开发一个简单服务以及一些自动化测试开始。\n\n1. 首先，让我们为 wiki 引擎定义一个简单服务。下面的 `WikiService` 有一个函数，它查询\
  \ MySQL 数据库并返回页面的点击次数以及每次编辑的读取比率。\n\n```\nclass WikiService(object):\n\n    def\
  \ __init__(self):\n        self.data_access = MySqlDataAccess()\n```\n\n\n\n\n```python\n\
  def statistics(self, page_name):\n\"\"\"Return tuple containing (num hits, hits\
  \ per edit)\"\"\"\nhits = self.data_access.hits(page_name)\nreturn (hits, hits /\
  \ len(self.data_access.edits(page_name)))\n```\n\n在这种情况下，WikiService 直接将 data_access\
  \ 定义为使用 MySqlDataAccess。statistics 方法调用 MySqlDataAccess 获取一些信息，并返回一个包含页面命中次数以及每次编辑的读取比率的元组。\n\
  \n> 需要指出的是，我们当前版本的 WikiService 对 MySQL 具有强依赖性，这是由直接创建 MySqlDataAccess 实例所暗示的。\n\n\
  - 2. 接下来，我们将编写一些用于运行 wiki Web 服务器的启动代码。\n\n```python\nif __name__ == \"__main__\"\
  :\n    service = WikiService()\n    WikiWebApp(service).run()\n```\n\n启动代码创建了一个\
  \ WikiService 实例，进而创建了一个 MySqlDataAccess 实例。我们创建了主 Web 应用程序组件 WikiWebApp 的实例并启动它，将其服务句柄传递给它。\n\
  \n> 我们尚未定义 WikiWebApp 或 MySqlDataAccess。相反，我们将重点关注 WikiService 提供的功能以及如何隔离和测试它。\n\
  \n让我们更仔细地查看我们编写的代码的测试。 一个好的测试用例将涉及对 statistics 的测试。考虑到它使用来自 MySqlDataAccess 的 hits\
  \ 和 edits，它直接依赖于连接到实时 MySQL 数据库。测试的一种选择是预先加载数据库中的固定内容。然而，设置和拆除的成本会迅速失控。如果团队中有多个开发人员，您也不希望出现一个开发人员正在设置而另一个开发人员正在拆除相同表的竞争情况。\n\
  \n3. 由于我们不想持续设置和拆除实时的数据库表，我们将改为编写数据访问对象的存根版本。\n\n```python\nclass StubDataAccess(object):\n\
  \    def hits(self):\n        return 10.0\n\n    def edits(self, page_name):\n \
  \       return 2.0\n```\n\n> 注意我们的存根版本返回的是易于测试的固定值。\n\n4. 现在让我们编写一个测试用例来测试我们的 WikiService。为了用测试替身替换\
  \ data_access 属性，测试用例必须直接覆盖该属性。\n\n```python\nclass WikiServiceTestCase(unittest.TestCase):\n\
  \    def testHittingWikiService(self):\n        service = WikiService()\n      \
  \  service.data_access = StubDataAccess()\n\n        results = service.statistics(\"\
  stub page\")\n        self.assertEquals(10.0, results[0])\n        self.assertEquals(5.0,\
  \ results[1])\n```\n\n此解决方案通过插入我们的数据访问层的存根版本，很好地消除了处理 MySQL 数据库的需求。这些依赖关系在下面的图表中显示。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_40_0.png)\n\nWikiServiceTestCase 依赖于\
  \ WikiService 和 StubDataAccess，以及对 MySqlDataAccess 的继承依赖。任何这些依赖关系的更改都可能影响我们的测试代码。\n\
  \n如果我们构建一个包含数百个测试方法的庞大测试套件，所有测试方法都使用实例化 `WikiService` 然后用测试替身覆盖 `data_access` 的模式，我们就为自己设置了很大的风险。例如，`WikiService`\
  \ 或 `StubDataAccess` 可能添加了一些新的初始化参数。如果我们以后需要更改创建可测试 `WikiService` 的这种模式，我们可能必须更新每个测试方法！我们需要确保每次更改都是正确的。这就是\
  \ Spring Python 的控制反转可以提供帮助的地方。\n\n## 更多关于控制反转的内容\n\n在深入我们的解决方案之前，让我们更深入地了解控制反转的含义。\n\
  \n控制反转是一种范式，我们改变创建对象的方式。在简单的对象创建场景中，如果我们有模块 X 和 Y，且 X 需要 Y 的实例，我们会让 X 直接创建它。这会在\
  \ X 和 Y 之间引入直接依赖关系，如下图所示。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_41_0.png)\n\
  \n这是有依赖性的，因为 Y 的任何更改都可能影响 X 并导致必要的更新。这种依赖关系不仅仅存在于 X 和 Y 之间。X 现在依赖于 Y 以及 Y 的所有 *依赖项*（如下所示）。Y\
  \ 或其任何依赖项的任何更新都可能影响 X。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_41_1.png)\n\n\
  通过控制反转，我们通过将 Y 实例的创建委托给单独的容器，从而打破 Y 及其依赖项对 X 造成潜在影响的风险，如下所示。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_42_0.png)\n\
  \n这将 X 和 Y 之间的依赖关系转移到容器上，减少了耦合。\n\n> 需要注意的是，依赖关系并未完全消除。因为 X 仍然被赋予 Y 的实例，所以仍然存在对其\
  \ API 的依赖，但 Y 及其任何依赖项都不必导入到 X 中这一事实使得 X 成为一个更小、更易于管理的代码块。\n\n我们在 wiki 引擎代码中看到 `WikiService`\
  \ 如何依赖于 `MySqlDataAccess`。`MySqlDataAccess` 依赖于 `MySQLdb`，这是一个用于与 MySQL 通信的 python\
  \ 库。使用容器并针对定义良好的接口进行编码，为更改注入到 `WikiService` 中的数据访问版本提供了机会。\n\n在下一节继续我们的示例时，我们将看到\
  \ IoC 如何帮助我们使测试代码的管理变得更容易，从而降低长期维护成本。\n\n## 将控制反转添加到我们的应用程序中\n\n我们已经通过使用测试存根消除对\
  \ MySQL 的依赖，迈出了降低维护成本的第一步。然而，我们使用的机制由于违反了 DRY（不要重复自己）原则而带来了很大的风险。\n\n对于我们当前的问题，我们希望\
  \ Spring Python 以一种允许我们在一个地方进行更改的方式来管理 `WikiService` 的创建，这样我们就不必编辑每个测试方法。为此，我们将定义一个\
  \ IoC 容器，让它为我们处理对象的创建。以下代码显示了一个简单的容器定义。\n\n- 1. 首先，让我们使用 Spring Python 创建一个 IoC\
  \ 容器，并让它创建我们的 `WikiService` 实例。\n\n```python\nfrom springpython.config import PythonConfig\n\
  from springpython.config import Object\n\nclass WikiProductionAppConfig(PythonConfig):\n\
  \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
  \n    @Object\n    def wiki_service(self):\n        return WikiService()\n```\n\n\
  您可以通过注意 Spring Python 的 `@Object` 装饰器来识别容器中定义的 objects。\n\n- 2. 现在我们希望更改启动代码，使其使用容器而不是直接创建\
  \ `WikiService` 对象。\n\n```python\nif __name__ == \"__main__\":\n    from springpython.context\
  \ import ApplicationContext\n    container = ApplicationContext(WikiProductionAppConfig())\n\
  \    service = container.get_object(\"wiki_service\")\n    WikiWebApp(service).run()\n\
  ```\n\n在我们 wiki Web 应用程序的这个版本中，服务对象是通过向容器请求 `wiki_service` 获得的。Spring Python 将此请求分派到\
  \ `WikiProductionAppConfig`，在那里它调用 `wiki_service()` 方法。现在容器负责创建 `WikiService` 的实例并将其返回给我们。\n\
  \n依赖关系如下图所示：\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_44_0.png)\n\n在此中间阶段，请注意\
  \ WikiService 仍然依赖于 MySqlDataAccess。我们只修改了应用程序获取 WikiService 副本的方式。在后面的步骤中，我们将完全移除对\
  \ MySqlDataAccess 的依赖。\n\n- 3. 让我们看看当我们使用 IoC 容器检索 WikiService 时我们的测试用例是什么样的。\n\n\
  ```python\nfrom springpython.context import ApplicationContext\n\nclass WikiServiceTestCase(unittest.TestCase):\n\
  \    def testHittingWikiService(self):\n        container = ApplicationContext(WikiProductionAppConfig())\n\
  \        service = container.get_object(\"wiki_service\")\n        service.data_access\
  \ = StubDataAccess()\n\n        results = service.statistics(\"stub page\")\n  \
  \      self.assertEquals(10.0, results[0])\n        self.assertEquals(5.0, results[1])\n\
  ```\n\n通过此更改，我们现在从容器获取 WikiService，然后用 StubDataAccess 覆盖它。你可能会想“这有什么意义？”关键点是我们将可测试\
  \ wiki_service 对象的创建转移到了容器。为了完成过渡，我们需要从 WikiService 中移除所有对 MySqlDataAccess 的依赖。在这样做之前，让我们讨论依赖注入。\n\
  \n\n\n\n## 依赖注入 又名 好莱坞原则\n\n到目前为止，我们已经成功将 WikiService 对象的创建委托给了 Spring Python 的控制反转容器。然而，WikiService\
  \ 仍然对 MySqlDataAccess 存在硬编码依赖。\n\nIoC 的本质是将对象创建推入第三方位置。迄今为止，我们一直使用“控制反转”这一术语。Spring\
  \ Python 实现 IoC 的方式是通过依赖注入机制。依赖注入，或 DI，是指通过初始化代码将依赖项推送到对象中，或让容器直接分配属性。这有时被好莱坞的陈词滥调“不要打电话给我们，我们会打电话给你”所描述。其含义是需要特定依赖的对象不应直接创建它，而应等待外部容器在需要时提供它。\n\
  \n> 因为 Spring Python 仅使用依赖注入，因此本书中，控制反转、IoC、依赖注入和 DI 这些术语可以互换使用，以传达相同的概念。\n\n下面这个版本的\
  \ WikiService 显示了对 MySqlDataAccess 依赖的完全移除。\n\n```\nclass WikiService(object):\n\
  \    def __init__(self, data_access):\n        self.data_access = data_access\n\n\
  \    def statistics(self, page_name):\n        \"\"\"Return tuple containing (num\
  \ hits, hits per edit)\"\"\"\n        hits = self.data_access.hits(page_name)\n\
  \        return (hits, hits / len(self.data_access.edits(page_name)))\n```\n\n采用这个修改后的\
  \ WikiService 版本后，提供 data_access 的具体实例现在由 WikiService 的创建者负责。对我们的 IoC 容器所做的相应更改如下所示。\n\
  \n```\nfrom springpython.config import PythonConfig\nfrom springpython.config import\
  \ Object\n\nclass WikiProductionAppConfig(PythonConfig):\n    def __init__(self):\n\
  \        super(WikiProductionAppConfig, self).__init__()\n\n    @Object\n    def\
  \ data_access(self):\n        return MySqlDataAccess()\n\n    @Object\n    def wiki_service(self):\n\
  \        return WikiService(self.data_access())\n```\n\n我们添加了 MySqlDataAccess 的定义，以便在创建\
  \ WikiService 实例时将其注入。我们的依赖图现在显示了 WikiService 与 MySqlDataAccess 之间依赖关系的完全断开。\n\n\
  ![](img/bcf886d8b665372ee8afbb620d4273bb_46_0.png)\n\n如前所述，这类似于好莱坞的格言“不要打电话给我们，我们会打电话给你”。它使我们的代码能够注入任何变体成为可能，在无需重写系统其他部分的情况下提供了更大的灵活性。\n\
  \n## 将控制反转添加到我们的测试中\n\n通过对 WikiService 和 WikiProductionAppConfig 的此项调整，我们现在可以编写设置测试用例的替代方法。\n\
  \n- 1. 首先，我们对生产容器配置进行子类化以创建测试版本。然后我们重写 data_access 对象，使其返回我们的存根替代品。\n- 2. 现在，我们可以修改测试套件以像生产主代码一样获取\
  \ WikiService，只是使用我们的替代容器。\n\n```\nclass WikiTestAppConfig(WikiProductionAppConfig):\n\
  \    def __init__(self):\n        super(WikiTestAppConfig, self).__init__()\n\n\
  \    @Object\n    def data_access(self):\n        return StubDataAccess()\n```\n\
  \n使用这种技术，我们继承了所有生产定义。然后我们只需覆盖测试情况所需的部分。在这种情况下，我们返回一个略微修改的 WikiService 版本，适合我们的测试需求。\n\
  \n```\nfrom springpython.context import ApplicationContext\n\nclass WikiServiceTestCase(unittest.TestCase):\n\
  \    def testHittingWikiService(self):\n        container = ApplicationContext(WikiTestAppConfig())\n\
  \        service = container.get_object(\"wiki_service\")\n\n        results = service.statistics(\"\
  stub page\")\n        self.assertEquals(10.0, results[0])\n        self.assertEquals(5.0,\
  \ results[1])\n```\n\nWikiService 与 StubDataAccess 之间的依赖关系（或缺乏依赖！）在以下图表中显示：\n\n\
  ![](img/bcf886d8b665372ee8afbb620d4273bb_47_0.png)\n\n这使得插入我们的替代 `StubDataAccess`\
  \ 变得很容易。需要注意的重要一点是，我们的测试代码不再覆盖 `data_access` 属性，也不再在创建 `WikiService` 时执行任何其他特殊步骤。相反，此创建逻辑已完全交由\
  \ IoC 容器处理。我们现在可以轻松编写任意多的测试，而无需担心对 `WikiService` 或 `data_access` 的更改，只要我们继续依赖 IoC\
  \ 容器处理对象创建即可。我们只需访问 `WikiTestAppConfig` 的蓝图以进行任何未来的修改。\n\n在本示例的结论中，下图显示了我们当前的 objects\
  \ 以及系统潜在的增强。在这种可能的情况下，我们定义了多个数据访问组件。要了解哪个组件被注入到 `WikiService` 中，我们只需查看相关容器的定义，无论是生产环境还是特定测试场景。我们的当前系统可能使用\
  \ **MySQL**，但如果新客户想要使用 **PostGreSQL**，我们只需创建容器的另一个变体，并注入替代的数据访问对象。**Sqlite** 也是如此。所有这些都可以在不影响\
  \ `WikiService` 的情况下完成。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_48_0.png)\n\n\
  ## 容器与上下文\n\n你可能已经注意到在本章示例中，我们一直将包含对象定义的代码称为容器，而用于创建它的类却称为 `ApplicationContext`。本章将阐明\
  \ **上下文** 与 **容器** 之间的区别。\n\nSpring Python 有一个名为 `ObjectContainer` 的基类，它负责管理对象定义、基于这些定义创建对象实例，并且在很大程度上负责我们迄今为止所看到的功能。从面向对象的角度来看，该类的任何实例都是容器。事实上，我们可以在之前的示例中将该类替换为所有出现的\
  \ `ApplicationContext`，它的大部分行为都相同。\n\n`ObjectContainer` 有一个名为 `ApplicationContext`\
  \ 的子类。`ApplicationContext` 的实例是上下文。然而，从 OOP 角度来看，上下文就是容器。因此，通常将两者中的任何一个实例称为 IoC\
  \ 容器是常见做法。\n\n`ApplicationContext` 与 `ObjectContainer` 在行为上存在一些差异，并且还涉及生命周期管理和对象管理的额外功能。这些差异首先将在下面的功能表中显示，并将在后面更详细地介绍。\n\
  \n| 类 | 功能 |\n|---|---|\n| `ObjectContainer` | - 启动时延迟实例化对象，可选择覆盖\n- 对象默认按单例作用域\
  \ |\n| `ApplicationContext` | - 启动时急切实例化对象，可选择覆盖\n- 对象默认按单例作用域\n- 支持属性驱动对象\n- 支持后处理器\n\
  - 支持上下文感知对象 |\n\n## 惰性对象\n\n我之前说过，如果我们用 `ObjectContainer` 替换 `ApplicationContext`，本章示例的大部分行为都将相同。一个区别是，`ObjectContainer`\
  \ 在容器首次创建时不会实例化任何对象。相反，它会等待对象被请求时才实际创建它。`ApplicationContext` 在容器启动时立即自动实例化所有对象。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_49_0.png)\n\n> 在迄今为止的示例中，这种差异影响不大，因为在创建容器后，我们立即请求主要对象。在本书后面的一些示例中则不会如此。\n\
  \n可以通过在对象定义中将 lazy_init 设置为 True 来覆盖此行为。这将延迟对象创建，直到第一次请求。\n\n```\nclass WikiTestAppConfig(WikiProductionAppConfig):\n\
  \    def __init__(self):\n        super(WikiTestAppConfig, self).__init__()\n\n\
  \    @Object(lazy_init=True)\n    def data_access(self):\n        return StubDataAccess()\n\
  ```\n\n使用此方法的一个原因是，如果我们有一些仅在特定场合需要的对象，并且在创建时可能产生大量开销。将 lazy_init 设置为 True 将推迟其创建，使其表现得像按需服务。\n\
  \n此覆盖适用于 ObjectContainer 和 ApplicationContext。\n\n## 作用域对象\n\n容器的另一个关键职责是管理对象的范围。这意味着对象在何时创建、实例存储在哪里以及在何时销毁。\n\
  \nSpring Python 目前支持两种作用域：singleton 和 prototype。singleton 作用域的对象在关闭前会被缓存在容器中。prototype\
  \ 作用域的对象永远不会被存储，因此每次从容器请求对象时，对象工厂都需要创建一个新实例。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_50_0.png)\n\
  \n> 当 singleton 对象包含 prototype 对象作为其初始化属性之一时，重要的是要意识到每次使用缓存的 singleton 时，prototype\
  \ 并不会被重新创建。\n\n容器的默认策略是将所有内容设为 singleton。每个对象的范围可以单独覆盖，如下所示。\n\n```\nclass WikiTestAppConfig(WikiProductionAppConfig):\n\
  \    def __init__(self):\n        super(WikiTestAppConfig, self).__init__()\n\n\
  \    @Object(scope=scope.PROTOTYPE)\n    def data_access(self):\n        return\
  \ StubDataAccess()\n```\n\n每次请求 data_access 都会产生不同的实例。无论请求来自容器外部，还是来自另一个注入 data_access\
  \ 的容器对象，情况都如此。\n\n\n\n此覆盖同时适用于 `ObjectContainer` 和 `ApplicationContext`。\n\n## 属性驱动对象\n\
  \nApplicationContext 会在对象创建并设置完所有容器定义的属性后，对任何具有此方法的对象调用 `after_properties_set()`。以下是一些此功能可能有用的示例：\n\
  \n- 在类定义中包含验证逻辑。如果某些属性是可选的而其他属性不是（或某些属性组合需要设置），这就是我们定义它的机会，并让容器验证对象是否被正确定义。\n- 启动后台服务。例如，`PyroServiceExporter`\
  \ 在所有属性设置后在后台启动一个守护线程。\n\n## 后处理器对象\n\nApplicationContext 将搜索 **后处理器**。这些是操作容器中其他对象的类。它们扩展了\
  \ Spring Python 的 `ObjectPostProcessor` 类。\n\n```\nclass ObjectPostProcessor(object):\n\
  \    def post_process_before_initialization(self, obj, obj_name):\n        return\
  \ obj\n    def post_process_after_initialization(self, obj, obj_name):\n       \
  \ return obj\n```\n\n当上下文启动时，所有非后处理器对象会一次一个地喂给每个后处理器两次：在初始化之前和之后。默认情况下，对象会原样传递而不做任何更改。通过编写自定义后处理器，我们可以覆盖任一阶段并应用任何我们想要的更改。这可能包括修改对象本身，或替换为不同的对象。\n\
  \n```\nclass RemoteService(ObjectPostProcessor):\n    def post_process_after_initialization(self,\
  \ obj, obj_name):\n        if obj_name.endswith(\"Service\"):\n            return\
  \ PyroServiceExporter(service=obj,\n                                        service_name=obj_name,\n\
  \                                        service_port=9000)\n        else:\n   \
  \         return obj\n```\n\n此后处理器会查看对象的名称，如果名称以 `Service` 结尾，则返回一个代理，将对象作为 Pyro\
  \ 服务导出，并使用对象的名称作为 URL 的一部分。否则，它只是返回该对象。\n\n此示例展示了如何仅通过使用 Spring Python 的 IoC 容器和一些自定义后处理器，就能轻松开发一种约定优于配置的客户端-服务器机制。\n\
  \n## 上下文感知对象\n\n我们可以通过扩展 `ApplicationContextAware` 来定义类，将 `ApplicationContext` 的副本注入到属性\
  \ `app_context` 中。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_52_0.png)\n\n> 这*仅*推荐用于需要以某种方式操作上下文的对象。*不*建议使用此钩子仅仅为了获取对象，因为这会将我们的代码直接绑定到容器。\n\
  \n相反，请使用本章前面所示的依赖注入原则。\n\n## 关于动态语言中 IoC 的争论\n\n技术社区中关于 IoC 在 Python、Ruby 等动态语言中是否有价值存在激烈争论。本节讨论了其中的几个论点，并展示了\
  \ IoC 在任何语言中都具有明确价值。如果你已经认同 IoC 的理念，可以跳过本节并了解 Spring Python 提供的更多配置 IoC 定义的选项。\n\
  \n一个论点是 IoC 是作为一种范式发明的，用以促进静态语言，特别是 Java。在动态世界中，传递带有句柄的对象要流畅得多，可以理解 IoC 可能不会像在 Java\
  \ 等静态语言中那样解决许多问题。虽然许多使用 IoC 框架的 Java 开发者确实在生产力上获得了显著提升，但将动态语言排除在外也是可信的。\n\n跨越动态/静态分界并由\
  \ IoC 处理的最强原则是 **DRY (不要重复自己)**。在一个地方定义对象的创建并能够重复使用该定义非常有用，并且使调整对象的创建方式变得容易。\n\n\
  一位精通 Ruby 的开发者经历了开发 Ruby IoC 解决方案的几个阶段。第一轮涉及非常类似于 XML 选项的静态配置文件。后来他意识到编写 Ruby DSL\
  \ 更简单、更易读，更符合 Ruby 的风格。最后，他意识到在代码中直接使用 Ruby 而不使用框架实际上更容易也更突出。在他的博客文章结尾，他暗示他每天都在使用\
  \ DI。他只是不需要框架来实现它。\n\n作为回应，我是第一个说系统中创建的每个对象都不需要由 IoC 容器提供的人；只需要那些可以从使用测试替身、环境变化以及为不同客户连接不同配置中受益的关键对象。例如，编写小型脚本和简单应用可能根本不需要\
  \ IoC。然而，随着应用的增长，管理依赖和对象创建的需求也在增长，在这些情况下，Spring Python 的 IoC 容器可以满足这些需求。IoC 还为需要远程调用、事务、安全等情况提供了简单解决方案。\n\
  \n动态 IoC 解决方案的反对者认为这些解决方案只是简单的移植工作，实际上更适合不熟悉动态语言环境的人。本质上，喜欢在 C# 或 Java 等静态语言中编码时使用\
  \ IoC 的人，希望在 Python 中获得同样的温暖舒适感。虽然 Spring Python 使用了一些与 Spring Java 相同的类名，但它绝不是简单的移植工作。Spring\
  \ Python 移植了许多概念但不是代码。其中最好的例子之一是 Spring Python 的安全模块。Spring Security（最初称为 Acegi\
  \ Security）的架构已成为 Java 行业的事实上的安全标准。它们的架构概念涉及使用一组通用接口链接到无数安全系统，如数据库、X.509、LDAP、CAS、kerberos、OpenID、OpenSSO\
  \ 等，而无需绑定到特定 API。相反，认证和授权的概念已被抽象到合适的层级，使得在系统开发完成后可以轻松添加安全功能而无需大规模重构。对此的功劳很大程度上归功于\
  \ IoC 的强大功能及其将此关键服务包装在已编写业务逻辑周围的能力。基于简单的静态与动态论点放弃这种强大的安全架构将是愚蠢的。\n\n另一个论点往往基于 Spring\
  \ Java 及其历史上对 XML 配置文件的使用。虽然 XML 常用于许多基于 Java 的框架，但 Python 社区倾向于避免使用 XML，除非客户要求另行规定。一些开发者批评\
  \ Spring Python 是一个基于 XML 的容器。然而，本书已经展示了纯 Python 容器定义。开发者完全不必使用 XML 即可利用控制反转的强大功能。通过直接使用\
  \ Python 进行容器定义，可以获得以下强大选项：\n\n- 我们可以编写可切换的上下文，其中容器读取主机名并推断其是在开发、测试还是生产环境中运行\n-\
  \ 我们可以编写集群上下文，根据我们在集群中的哪一侧运行来改变对象配置\n- 我们可以编写代码从外部源读取额外属性，例如 Apache Web 服务器的 `httpd.conf`\
  \ 文件，从而保持良好集成\n- 我们可以在数据库中查找对象属性\n\n坦白说，鉴于 Python 的强大功能以及 Spring Python 提供的额外实用工具，选项是无限的。\n\
  \n## 将 Spring Java 应用迁移到 Python\n\n在上一节中，我指出 Spring Python 不要求我们使用 XML。然而，除了我们尚未查看的其他格式外，还支持\
  \ XML。提供其他格式是为了让 Spring Java 开发者更容易使用他们已知的东西迁移到 Python。\n\nSpring Python 有两个文件解析器可读取包含对象定义的\
  \ XML 文件。`SpringJavaConfig` 读取 Spring Java XML 配置文件，而 `XMLConfig` 读取类似的格式，但专门定义以提供\
  \ Python 导向的选项，例如对字典、元组、集合和冻结集合的支持。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_54_0.png)\n\
  \n> SpringJavaConfig 不支持 Spring Java XML 规范中的所有功能，包括专用命名空间、Spring 表达式语言以及属性。此时，它旨在成为一个方便的工具，用于演示\
  \ Python 与 Java 之间简单的集成。\n\n\n\n\n让我们探索如果我们的 wiki 引擎软件最初是用 Java 编写的，并且我们正在探索迁移到\
  \ Python 的选项时所采取的步骤。为了尽可能平滑地进行，我们将使用 Jython 运行 Python 部分。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_55_0.png)\n\
  \n> Jython 是一个用 Java 编写的 Python 编译器，设计用于在 JVM 上运行。Jython 脚本可以访问 Python 和基于 Java\
  \ 的库。然而，Jython 无法访问用 C 编写的 Python 扩展。Spring Python 1.1 运行在 Jython 2.5.1 上。关于 Jython\
  \ 的下载、安装和其他文档的信息可以在 http://jython.org 找到。\n\n1. 假设 Java 代码有一个定义良好的数据访问接口。\n\n```\n\
  public interface DataAccess {\n\n    public int hits(String pageName);\n\n    public\
  \ int edits(String pageName);\n}\n```\n\n2. 为了演示目的，让我们创建该接口的具体 Java 实现。\n\n```\n\
  public class MySqlDataAccess implements DataAccess {\n\n    private JdbcTemplate\
  \ jt;\n\n    public MySqlDataAccess(DataSource ds) {\n        this.jt = new JdbcTemplate(ds);\n\
  \    }\n\n    public int hits(String pageName) {\n        return jt.queryForInt(\n\
  \            \"select HITS from METRICS \" +\n            \"where PAGE = ?\", pageName);\n\
  \    }\n\n    public int edits(String pageName) {\n        return jt.queryForInt(\n\
  \            \"select count(*) from VERSIONS \" +\n            \"where PAGE = ?\"\
  , pageName);\n    }\n}\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_56_0.png)\n\
  \n> 这段 Java 代码看起来可能有些牵强，考虑到 MySqlDataAccess  supposed to be dependent on MySQL。这是为演示目的而创建的过度简化的版本。\n\
  \n3. 最后，让我们看一下 WikiService 的 Java 版本。\n\n```\npublic class WikiService {\n\n   \
  \ private DataAccess dataAccess;\n\n    public DataAccess getDataAccess() {\n  \
  \      return this.dataAccess;\n    }\n\n    public void setDataAccess(DataAccess\
  \ dataAccess) {\n        this.dataAccess = dataAccess;\n    }\n\n    public double[]\
  \ statistics(String pageName) {\n        double hits = dataAccess.hits(pageName);\n\
  \        double ratio = hits / dataAccess.edits(pageName);\n        return new double[]{hits,\
  \ ratio};\n    }\n}\n```\n\n4. 使用 Spring Java 将其连接起来的常见方式可以在 javaBeans.xml 中找到。\n\
  \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://www.springframework.org/schema/beans\"\
  \n       xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n       xsi:schemaLocation=\"\
  http://www.springframework.org/schema/\n       http://www.springframework.org/schema/beans/spring-beans-2.5.xsd\"\
  >\n\n    <bean id=\"dataAccess\" class=\"MySqlDataAccess\"/>\n\n    <bean id=\"\
  wikiService\" class=\"WikiService\">\n        <property name=\"dataAccess\" ref=\"\
  dataAccess\"/>\n    </bean>\n</beans>\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_57_0.png)\n\
  \n请注意，此 XML 格式由 Spring Java 定义和管理，而不是 Spring Python。\n\n5. 现在我们可以看到这个纯 Java 应用的所有部分，下一步是使用\
  \ Spring Python 和 Jython 启动它。\n\n```\nif __name__ == \"__main__\":\n    from springpython.context\
  \ import ApplicationContext\n    from springpython.config import SpringJavaConfig\n\
  \    ctx = ApplicationContext(SpringJavaConfig(\"javaBeans.xml\"))\n    service\
  \ = ctx.get_object(\"wikiService\")\n    service.calculateWikiStats()\n```\n\n得益于\
  \ Jython 透明创建 Python 和 Java 对象的能力，我们的 Spring Python 容器可以解析 javaBeans.xml 中的对象定义。\n\
  \n6. 随着开发周期的继续，我们找到了时间将 MySqlDataAccess 移植到 Python。\n\n7. 完成之后，我们决定想要利用更多 Python\
  \ 的特性，比如元组、集合和冻结集合。Spring Java 格式不支持这些。让我们将 javaBeans.xml 转换为 Spring Python 的 XML\
  \ 格式并保存为 production.xml。\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<objects\
  \ xmlns=\"http://www.springframework.org/springpython/schema/objects\"\n    xmlns:xsi=\"\
  http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"http://www.springframework.org/springpython/schema/objects\n\
  \    http://springpython.webfactional.com/schema/context/spring-python-context-1.0.xsd\"\
  >\n\n    <object id=\"data_access\" class=\"Py.MySqlDataAccess\"/>\n    <object\
  \ id=\"wiki_service\" class=\"WikiService\">\n        <property name=\"dataAccess\"\
  \ ref=\"data_access\"/>\n    </object>\n</objects>\n```\n\n这与 Spring Java 格式非常相似，这正是目的所在。通过更改头部并将\
  \ 'bean' 替换为 'object'，我们现在可以使用 XMLConfig。\n\n```\nif __name__ == \"__main__\":\n\
  \    from springpython.context import ApplicationContext\n    from springpython.config\
  \ import XMLConfig\n    ctx = ApplicationContext(XMLConfig(\"production.xml\"))\n\
  \    service = ctx.get_object(\"wiki_service\")\n    service.calculateWikiStats()\n\
  ```\n\n我们现在可以使用以下等更多选项：\n\n```\n<property name=\"some_set\">\n    <set>\n      \
  \  <value>Hello, world!</value>\n        <ref object=\"SingletonString\"/>\n   \
  \     <value>Spring Python</value>\n    </set>\n</property>\n```\n\n```\n<property\
  \ name=\"some_frozen_set\">\n    <frozenset>\n        <value>Hello, world!</value>\n\
  \        <ref object=\"SingletonString\"/>\n        <value>Spring Python</value>\n\
  \    </frozenset>\n</property>\n```\n\n```\n<property name=\"some_tuple\">\n   \
  \ <tuple>\n        <value>Hello, world!</value>\n        <ref object=\"SingletonString\"\
  />\n        <value>Spring Python</value>\n    </tuple>\n</property>\n```\n\n8. 迁移到这种程度后，我们决定开始编写一些测试。我们希望使用本章开头所示的风格，使用替代配置将\
  \ MySqlDataAccess 替换为 StubDataAccess。为了避免更改 production.xml，我们创建了一个替代配置文件 test.xml。\n\
  \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<objects xmlns=\"http://www.springframework.org/springpython/\n\
  schema/objects\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n\
  \    xsi:schemaLocation=\"http://www.springframework.org/\nspringpython/schema/objects\n\
  \        http://springpython.webfactional.com/schema/\ncontext/spring-python-context-1.0.xsd\"\
  >\n\n    <object id=\"data_access\" class=\"Py.StubDataAccess\"/>\n</objects>\n\
  ```\n\n9. 现在让我们使用这两个文件为专用容器编写一个测试用例。为此，我们向 ApplicationContext 提供一个配置列表。\n\n```\n\
  import unittest\nfrom springpython.context import ApplicationContext\nfrom springpython.config\
  \ import XMLConfig\n\nclass WikiServiceTestCase(unittest.TestCase):\n    def testHittingWikiService(self):\n\
  \        ctx = ApplicationContext([XMLConfig(\"production.xml\"),\n            \
  \                    XMLConfig(\"test.xml\")])\n        service = ctx.get_object(\"\
  wiki_service\")\n        results = service.statistics(\"stub page\")\n        self.assertEquals(10.0,\
  \ results[0])\n        self.assertEquals(2.0, results[1])\n```\n\n文件名的顺序很重要。首先，从\
  \ production.xml 读取一组定义。接下来，从 test.xml 读取更多定义。任何与之前定义同名的新定义都会覆盖之前的定义。在我们的例子中，我们用对\
  \ stub 对象的引用覆盖 data_access。\n\n10. 在 Python 平台取得所有成功之后，我们决定将容器定义迁移到纯 Python。首先，让我们将\
  \ `production.xml` 转换为 `WikiProductionAppConfig`。\n\n```\nfrom springpython.config\
  \ import PythonConfig, Object\nfrom Py import MySqlDataAccess\nimport WikiService\n\
  \nclass WikiProductionAppConfig(PythonConfig):\n    def __init__(self):\n      \
  \  PythonConfig.__init__(self)\n\n    @Object\n    def data_access(self):\n    \
  \    return MySqlDataAccess()\n\n    @Object\n    def wiki_service(self):\n    \
  \    results = WikiService()\n        results.dataAccess = self.data_access()\n\
  \        return results\n```\n\n11. 让我们将它与 `test.xml` 混合使用。\n\n```\nimport unittest\n\
  from springpython.context import ApplicationContext\nfrom springpython.config import\
  \ XMLConfig\n\nclass WikiServiceTestCase(unittest.TestCase):\n    def testHittingWikiService(self):\n\
  \        ctx = ApplicationContext([WikiProductionAppConfig(),\n                \
  \                  XMLConfig(\"test.xml\")])\n        service = ctx.get_object(\"\
  wiki_service\")\n        results = service.statistics(\"stub page\")\n        self.assertEquals(10.0,\
  \ results[0])\n        self.assertEquals(2.0, results[1])\n```\n\n我们只需将 `XMLConfig(\"\
  production.xml\")` 替换为 `WikiProductionAppConfig()`。ApplicationContext 能够舒适地接受以不同格式存储的任何组合定义。Spring\
  \ Python 的灵活容器为我们提供了对如何存储所有定义进行精细控制的能力。\n\n我们可以继续并轻松地将 `test.xml` 替换为用纯 Python 编写的类似\
  \ `WikiTestAppConfig` 的内容。\n\n\n\n这演示了逐件转换事物是多么容易。我们本可以根据希望保留在 Java 中的内容以及希望迁移到\
  \ Python 的内容更早地停止。如果我们将剩余的 Java 部分迁移到 Python 解决方案，那么我们可以选择使用 Python 或 Jython。关键在于\
  \ XML 支持使得从 Java 迁移到 Python 变得容易且影响最小。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_61_0.png)\n\
  \n> 必须认识到，仅因为我们从 Spring Java 应用开始，并不意味着这种技术仅适用于基于 Spring 的 Java 项目。在之前的示例中，我们迅速跳过了\
  \ javaBeans.xml，并使用 Spring Python 的 XML 格式连接了 Java 组件。\n\n## Summary\n\n在本章中，我们探讨了使用控制反转\
  \ (IoC) 交换测试替身。这并不是 IoC 的唯一用例。能够在不影响核心业务逻辑的情况下轻松重新配置事物，具有难以置信的价值。\n\nIoC 允许我们将对象创建移动到集中位置。这使我们的应用程序更容易注入替代方案。这使得诸如测试、远程调用、事务和安全之类的事情变得容易得多。\n\
  \nSpring Python 支持多种格式，包括纯 Python、Spring Python XML 和 Spring Java XML。这为用户提供了基于其需求的广泛选择。通过使用\
  \ Jython，混合 Python 和 Java 代码变得容易得多。\n\n用另一个对象定义交换一个对象定义构成了一个有用的服务。在整本书中，将会探讨其他服务。只要记住，这些服务的核心是\
  \ Spring Python 的 IoC 容器。\n\n在本章中，我们学习了：\n\n- IoC 容器通过用测试替身替换生产协作对象，使隔离被测对象变得容易\n\
  - IoC 和依赖注入的详细定义\n- IoC 容器通过将对象的创建与其使用分离，对我们的应用程序产生积极影响，这有助于模块化我们的应用程序\n- 依赖注入的好莱坞原则意味着我们的对象不会创建它们的协作对象，而是等待容器创建它们并将它们注入到我们的对象中\n\
  - Spring Python 具有 `ObjectContainer`，它包含 IoC 容器的基本部分。该容器处理依赖解析、设置属性和延迟初始化\n- Spring\
  \ Python 具有 `ApplicationContext`，它继承自容器，并为开发人员提供扩展点以操作对象的创建\n- 虽然关于在动态语言中使用 IoC\
  \ 可能存在争议，但将对象创建委托给单独容器的好处并不仅限于静态语言\n- 通过使用 Jython 中的 Spring Python 容器，很容易将 Python\
  \ 和 Java 组件混合在一起。对于已经使用 Spring Java 构建的应用程序来说，这种策略甚至更有效\n\n在下一章中，我们将研究使用 **面向切面编程\
  \ (AOP)** 向现有代码添加服务。\n\n# 3 Adding Services to APIs\n\n# Adding Services to APIs\n\
  \n在上一章中，我们研究了 Spring Python 的控制反转容器，并用它来交换生产对象和测试替身。当今使用最广泛的范式之一是使用类的 **面向对象编程 (OOP)**。类作为我们解决的领域和业务问题的表示。但这还不够！\n\
  \n我们还需要诸如缓存、存储和检索、事务、安全和日志记录等强大的功能。这些服务与我们必须解决的业务问题正交。\n\n将类与这些正交服务混合在一起，很快就会变得难以正确编码和维护。**面向切面编程\
  \ (AOP)** 通过一种称为 **切面** 的新型模块化来解决这些正交问题。\n\n在本章中，我们将学习：\n\n- 从 10,000 英尺高度看 AOP\n\
  - 为 Spring Python 对象添加缓存\n- 通过添加性能和安全顾问扩展示例\n- AOP 如何是一种范式而不仅仅是一个库\n- Spring Python\
  \ 的 AOP 与其他库以及 Python 语言特性相比的独特功能\n- AOP 的风险以及如何通过展示如何测试我们的切面来缓解这些风险\n- 关于应用 `Advice`\
  \ 的一些建议\n\n### AOP from 10,000 feet\n\n在本章中，我们将探索 AOP 的示例以及如何使用它们。为此，学习一些基本定义很重要。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_64_0.png)\n\n> 横切问题会影响一个以上的类层次结构。AOP\
  \ 高效地解决了这些问题。\n\n常见的横切问题示例包括安全、事务、跟踪、审计和日志记录。你认为是什么使这些关注点成为横切的？\n\n### Crosscutting\
  \ versus hierarchical\n\n工作中常见的循环通常从一个单一问题开始。你会如何解决一个单一、具体、定义良好的问题？通过编写单一、具体的解决方案！我们通常此时不会考虑重用。我们更有可能在需要使用已编写的代码块解决新问题时考虑重用。\n\
  \n当我们解决另一个问题并尝试重用代码块时，我们开始看到如何进行调整和抽象。我们不仅仅是为了减少代码重复而抽象事物。我们还在用更精炼、更高层次的概念调整业务解决方案的定义。随着新需求的到来，我们的业务解决方案层次结构不断演进。\n\
  \n当我们继续解决业务问题时，遇到基础设施问题并不罕见。例如，可能出现需要用事务包装操作的需求，即使客户没有要求。\n\n基础设施问题很容易横切类层次结构。SQL\
  \ 事务是完美的例子。在每个需要它的方法中手动编码事务模式会导致大量代码重复。那当事务需求发生变化时我们该怎么办？重写所有受影响的方法？需求中不可预见的变化很容易在我们维护代码时累积大量工作。更不用说，我们在每个方法中都能正确编码事务模式的几率有多大？\n\
  \nAOP 提供了一种无需使用复制粘贴技巧来解决此问题的方法。我们将在本章中更详细地探讨这一点。\n\n### Crosscutting elements\n\n\
  下列术语描述了构成面向切面编程的横切元素：\n\n| 术语 | 描述 |\n|---|---|\n| 连接点 | 连接点是程序执行中可识别的点。这是横切操作被织入的地方。\
  \ |\n| 切点 | 切点是选择连接点并在该点收集上下文的程序构造。 |\n| 通知 | 通知是要在由切点选择的连接点处执行的代码。 |\n| 切面 | 切面在\
  \ AOP 中相当于 OOP 中的类。它是定义一组切点和通知的核心编程构造。 |\n| 顾问/拦截器 | 顾问或拦截器是 Spring Python 实现切面的机制。\
  \ |\n\n在定义了这些术语后，我们将深入本章的其余部分，探索横切问题及其解决方案。\n\n### Weaving crosscutting behavior\n\
  \n如前所述，切面包含切点及其关联的通知。将切面应用于我们的代码称为编织。\n\n不同系统提供各种编织方式。AspectJ 是一种基于 Java 的 AOP 解决方案，具有静态和动态编织功能。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_65_0.png)\n\n> AspectJ 是 AOP 的先驱，目标是\
  \ Java 平台。Spring Python 不一定与 AspectJ 集成，也不试图模仿 AspectJ 的所有功能。相反，Spring Python 将\
  \ AspectJ 视为实现 AOP 的成熟示例。\n> \n> 有关 AspectJ 的更多信息，你可以阅读 *Ramnivas Laddad* 所著的 *《AspectJ\
  \ 实战》*。虽然该书侧重于 AspectJ 和 Java，但它也对 AOP 的概念有更详细的介绍。\n\n静态编织在代码编译时同时应用。动态编织应用于已编译的代码。\n\
  \n\n\nSpring Python 通过使用 **代理** 提供 **动态编织**。代理使用 IoC 容器进行配置。原本针对对象的调用现在改为通过代理路由。代理会评估可能的切点并应用\
  \ `Advice`。这也被称为 **intercepting.**\n\n## 向 Spring Python 对象添加缓存\n\n在本示例中，我们将通过编写一个从数据库检索\
  \ wiki 文本并将其转换为 HTML 的服务来增强我们一直在开发的 wiki 引擎。然后，为了限制对我们基础设施的负载，我们将添加缓存支持。\n\n- 1.\
  \ 首先，我们需要编写我们的服务。该服务将调用数据访问组件以检索存储在我们数据库中的 wiki 文本。然后我们将其转换为 HTML 并交还给调用方。\n\n```python\n\
  class WikiService(object):\n    def __init__(self, data_access):\n        self.data_access\
  \ = data_access\n\n    def get_article(self, article):\n        return self.data_access.retrieve_wiki_text(article)\n\
  \n    def store_article(self, article):\n        self.data_access.store_wiki_text(article)\n\
  \n    def html(self, text):\n        pass # return wiki text converted to HTML\n\
  \n    def statistics(self, article):\n        hits = self.data_access.hits(article)\n\
  \        return (hits, hits /\n            len(self.data_access.edits(article)))\n\
  ```\n\n这里我们有一个 `WikiService`，与我们在 IoC 示例中使用的类似。除了具有 `statistics` 方法外，此版本能够从数据库检索\
  \ wiki 文本并将其格式化为 HTML。它还可以将编辑过的 wiki 文章存储到数据库中。在本示例中，我们对将 wiki 文本转换为 HTML 的代码并不特别关心，因此我们省略了它。\n\
  \n- 2. 让我们将我们的 WikiService 放入 Spring Python IoC 容器中，以便它可以作为我们 wiki 应用程序的一部分使用。\n\
  \n```python\nfrom springpython.config import PythonConfig\nfrom springpython.config\
  \ import Object\n\nclass WikiProductionAppConfig(PythonConfig):\n    def __init__(self):\n\
  \        super(WikiProductionAppConfig, self).__init__()\n\n    @Object\n    def\
  \ data_access(self):\n        return MysqlDataAccess()\n\n    @Object\n    def wiki_service(self):\n\
  \        return WikiService(self.data_access())\n```\n\n这应该看起来很熟悉。它是我们上一章中使用的相同的\
  \ IoC 容器定义。下面的框图显示了我们应用程序的组件，其中 Wiki 的视图层调用 WikiService，而 WikiService 又调用 data_access，最终到达数据库。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_67_0.png)\n\n- 3. 假设我们的 wiki 引擎现在被用于一个非常受欢迎的网站，拥有大量文章和用户。在编辑之间对同一篇文章的多次请求很可能很常见，并且每次检索文章时都会对数据库服务器进行数据库查询，从而使其不堪重负。为了限制这种性能损失，让我们编写一个简单的缓存解决方案。\n\
  \n```python\nclass WikiServiceWithCaching(object):\n    def __init__(self, data_access):\n\
  \        self.data_access = data_access\n        self.cache = {}\n\n    def get_article(self,\
  \ article):\n        if article not in self.cache:\n            self.cache[article]\
  \ =\n                self.data_access.retrieve_wiki_text(article)\n        return\
  \ self.cache[article]\n\n    def store_article(self, article):\n        del self.cache[article]\n\
  \        self.data_access.store_wiki_text(article)\n\n    def html(self, text):\n\
  \        pass # return wiki text converted to HTML\n\n    def statistics(self, article):\n\
  \        hits = self.data_access.hits(article)\n        return (hits, hits /\n \
  \           len(self.data_access.edits(article)))\n```\n\n为了处理对同一篇文章的多次请求，WikiServiceWithCaching\
  \ 将 wiki 文本存储在名为 cache 的内部字典中。然后在文章不在缓存中的情况下回退到数据库之前，会检查缓存中是否存在请求的文章。每当进行新的编辑时，缓存就会被清除。最后，statistics\
  \ 完全没有任何缓存。\n\n要引入我们的新缓存 wiki 服务，我们只需更改 IoC 容器定义中的 wiki_service 声明即可。\n\n```python\n\
  class WikiProductionAppConfig(PythonConfig):\n    def __init__(self):\n        super(WikiProductionAppConfig,\
  \ self).__init__()\n\n    @Object\n    def data_access(self):\n        return MysqlDataAccess()\n\
  \n    @Object\n    def wiki_service(self):\n        return WikiServiceWithCaching(self.data_access())\n\
  ```\n\n这个想法相当简单，应该可以减轻我们数据库服务器的负载。然而，通过将缓存与 wiki 服务混合，我们违反了单一职责原则（SRP）：一个类应该有（且只有一个）更改原因。对其中一个功能的更改可能会破坏另一个功能。它也更难将这些功能隔离进行测试，最终使代码更难阅读和理解。\n\
  \n- 4. 让我们通过将缓存机制提取到一个单独的类中，然后委托给原始的 WikiService，来解耦这两个关注点，即维护 wiki 和缓存。\n\n```python\n\
  class CachedService(object):\n    def __init__(self, delegate):\n        self.cache\
  \ = {}\n        self.delegate = delegate\n\n    def get_article(self, article):\n\
  \        if article in self.cache:\n            return self.cache[article]\n   \
  \     else:\n            return self.delegate.get_article(article)\n\n    def store_article(self,\
  \ article):\n        del self.cache[article]\n        self.delegate.store_article(article)\n\
  \n    def html(self, text):\n        return self.delegate.html(text)\n\n    def\
  \ statistics(self, article):\n        return self.delegate.statistics(article)\n\
  ```\n\n现在我们需要更新我们的 IoC 配置。\n\n```python\nclass WikiProductionAppConfig(PythonConfig):\n\
  \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
  \n    @Object\n    def data_access(self):\n        return MysqlDataAccess()\n\n\
  \    @Object\n    def wiki_service(self):\n        return CachedService(WikiService(self.data_access()))\n\
  ```\n\n我们的架构略有变化，Wiki 视图层现在调用我们的 CachedService。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_70_0.png)\n\
  \n现在 SRP 得到遵守，因为每个类只有一个职责。一个类通过将所有必要的 WikiService 调用传递给 delegate 来处理缓存。然而，这并不实用。虽然\
  \ CachedService（代码中文本）将缓存逻辑与 WikiService 分离，但我们对适配器的使用引入了一些丑陋的限制。CachedService 必须具有与\
  \ WikiService 相同的接口才能处理其请求，我们甚至不得不为 statistics 编写一个直通。CachedService 也过于专门化，不适用于任何通用解决方案。每当我们在\
  \ WikiService 中添加另一个方法时，我们都必须更改 CachedService，这给我们带来了一对紧密耦合的类。让我们现在修复这个问题。\n\n-\
  \ 5. 让我们使用 Spring Python 编写一个 Interceptor，它不仅将缓存与 wiki 文本管理分离，而且足够通用，可以在其他地方重用。\n\
  \n```python\nfrom springpython.aop import *\n\nclass CachingInterceptor(MethodInterceptor):\n\
  \    def __init__(self):\n        self.cache = {}\n\n    def invoke(self, invocation):\n\
  \        if invocation.method_name.startswith(\"get\"):\n            if invocation.args\
  \ not in self.cache:\n                self.cache[invocation.args] =\n          \
  \          invocation.proceed()\n            return self.cache[invocation.args]\n\
  \n        elif invocation.method_name.startswith(\"store\"):\n            del self.cache[invocation.args]\n\
  \            invocation.proceed()\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_71_0.png)\n\
  \n> CachingInterceptor 定义了一个 Spring Python 切面，它具有所有缓存功能而没有任何 wiki 功能。它包含 Advice（缓存功能）和切点（仅适用于以\
  \ get 开头的方法）。\n\n- 6. 要使用 CachingInterceptor，我们必须使用我们的切面实例以及 WikiService 实例创建一个\
  \ Spring Python AOP 代理。\n\n```python\nclass WikiProductionAppConfig(PythonConfig):\n\
  \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
  \n    @Object\n    def data_access(self):\n        return MysqlDataAccess()\n\n\
  \    @Object\n    def wiki_service(self):\n        return ProxyFactoryObject(\n\
  \            target=WikiService(self.data_access()),\n            interceptors=CachingInterceptor())\n\
  ```\n\n通过创建代理并将其与我们的切面进行[content]\n通过创建代理并将其与我们的切面进行 wiring，我们已将切面动态地编织到代码中。在我们的情况下，我们创建了\
  \ Spring Python 的 ProxyFactoryObject 的一个实例来将 WikiService 与 CachingInterceptor 结合起来。\n\
  \n将 Spring Python 对象 wiki_service 从 WikiService 移动到 ProxyFactoryObject 后，我们的调用序列现在会流经新的拦截器，如下图所示。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_72_0.png)\n\n现在，我们不再拥有专门的缓存处理器，而是有了一个链接到通用缓存切面的代理。每当视图层向\
  \ wiki_service 提交请求时，调用就会被路由到 CachingInterceptor。\n\nCachingInterceptor 与之前的 CachedService\
  \ 之间的关键区别在于 Spring Python 如何将原始方法调用的所有信息打包到 invocation 参数中并将其分派到 CachingInterceptor\
  \ 的 invoke 方法。这使我们能够在一个地方管理进入和退出 WikiService 的任何方法。这种行为被称为对目标进行通知。\n\n在我们的示例中，CachingInterceptor\
  \ 检查目标方法名是否以 get 开头。如果是，则会检查缓存，使用目标方法的参数作为键（在我们的例子中为文章名称）。如果缓存中找不到参数，CachingInterceptor\
  \ 会通过 invocation.proceed() 调用 WikiService，就像我们直接调用它一样。结果会被存储到缓存中，然后返回给视图层。如果目标方法名以\
  \ store 开头，则会先删除缓存条目，然后执行 invocation.proceed()。\n\n7. ProxyFactoryObject 将所有方法请求路由通过我们的切面。然而，CachingInterceptor\
  \ 无法处理对 statistics 的调用，因为它既不以 get 开头也不以 store 开头。为了解决这个问题，让我们插入另一条建议，只将 get 和 store\
  \ 调用发送到 CachingInterceptor，而将其他所有调用直接发送到 WikiService。\n\n```python\nclass WikiProductionAppConfig(PythonConfig):\n\
  \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
  \n    @Object\n    def data_access(self):\n        return MysqlDataAccess()\n\n\
  \    @Object\n    def wiki_service(self):\n        advisor = RegexpMethodPointcutAdvisor(\n\
  \            advice=[CachingInterceptor()],\n            patterns=[\".*get.*\",\
  \ \".*store.*\"])\n        return ProxyFactoryObject(\n            target=WikiService(self.data_access()),\n\
  \            interceptors=advisor)\n```\n\nSpring Python 的 RegexpMethodPointcutAdvisor\
  \ 是一个开箱即用的顾问，它使用一组正则表达式来定义其 pointcuts。\n\n> 如前所述，advisor 是 Spring Python 对 aspect\
  \ 的实现。pointcut 是定义在何处应用 aspect 的 Advice 的定义。在这种情况下，pointcut 被定义为正则表达式。但并非所有 pointcuts\
  \ 都需要正则表达式。\n\n每个模式都会与调用栈的完整规范方法名（<package>.<class>.<method>）进行检查，直到找到匹配项（或用尽模式）。如果有匹配，则应用顾问列表。否则，它会绕过顾问列表并直接调用目标。下面的图表显示了这些组件如何链接在一起；第一个图表描绘了首次请求特定文章的序列：\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_74_0.png)\n\n在之前的步骤序列中，会检查方法名是否与缓存模式匹配。假设匹配，则会转发到缓存拦截器。然后检查缓存。如果尚未缓存，则会转发到\
  \ WikiService。到达 WikiService 后，结果会被缓存然后返回。下一个图表显示了再次请求该文章时的步骤序列：\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_75_0.png)\n\
  \n在这种情况下，我们再次检查相同的正则表达式模式，以查看该方法是否符合缓存条件。由于符合，我们接下来检查缓存。因为它已存在，所以我们不必调用 WikiService，从而节省了数据库调用。\n\
  \n最终的序列显示了如果我们调用一个与缓存模式不匹配的方法会发生什么。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_76_0.png)\n\
  \n在这种情况下，我们再次执行模式匹配。但由于不匹配，RegexpMethodPointcutAdvisor 会回退到目标对象，绕过缓存顾问。我们可以直接进入\
  \ WikiService 并找到最新的统计信息。\n\n> 必须认识到，虽然缓存拦截器减少了对数据库的访问，但对方法名进行模式匹配仍存在一定的开销成本。这种类型的开销成本必须包含在任何端到端性能分析中。\n\
  \n这解决了在不破坏 SRP 的情况下将缓存服务干净地应用到 wiki 引擎 API 的问题。通过使用 Spring Python 的 AOP 模块，我们能够编写一个通用、可重用的缓存模块并将其插入，而对\
  \ wiki API 没有任何影响。\n\n## 将多个顾问应用于服务\n\n在编写缓存解决方案的后期，我们使用了 RegexpMethodPointcutAdvisor\
  \ 根据正则表达式模式有条件地应用顾问列表。Spring Python 的 AOP 解决方案支持将一个以上的顾问应用于对象。这使得可以轻松地为不同对象混合多个服务，例如缓存、事务、安全和日志。\n\
  \nSpring Python 使在 API 之上添加服务变得容易。对建议的重新应用次数没有限制。下面显示了一个更复杂、更现实的配置示例：\n\n```python\n\
  class WikiProductionAppConfig(PythonConfig):\n    def __init__(self):\n        super(WikiProductionAppConfig,\
  \ self).__init__()\n\n    @Object\n    def data_access(self):\n        return MysqlDataAccess()\n\
  \n    @Object\n    def security_advisor(self):\n        return RegexpMethodPointcutAdvisor(\n\
  \            advice=[SecurityInterceptor()],\n            patterns=[\".*store.*\"\
  ])\n\n    @Object\n    def perf_advisor(self):\n        return RegexpMethodPointcutAdvisor(\n\
  \            advice=[PerformanceInterceptor()],\n            patterns=[\".*get.*\"\
  ])\n\n    @Object\n    def caching_advisor(self):\n        return RegexpMethodPointcutAdvisor(\n\
  \            advice=[CachingInterceptor()],\n            patterns=[\".*get.*\",\
  \ \".*store.*\"])\n\n    @Object\n    def wiki_service(self):\n        return ProxyFactoryObject(\n\
  \            target=WikiService(self.data_access()),\n            interceptors=[self.security_advisor(),\n\
  \                          self.perf_advisor(),\n                          self.caching_advisor(),\n\
  \                          self.perf_advisor()])\n```\n\n在此示例中，wiki_service 有多个顾问：security_advisor、perf_advisor\
  \ 和 caching_advisor。它们以栈的形式链接在一起，其中 perf_advisor 被使用了两次。下面的图表显示了顾问及其拦截器的调用栈，然后详细解释了每个顾问的作用。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_78_0.png)\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_79_0.png)\n\
  \nsecurity_advisor 是 RegexpMethodPointcutAdvisor 的一个实例，它对以 store 开头的任何方法应用 SecurityInterceptor。\n\
  \n```python\nclass SecurityInterceptor(MethodInterceptor):\n    def invoke(self,\
  \ invocation):\n        if user.has_access(invocation):\n            return invocation.proceed()\n\
  \        else:\n            raise SecurityException(\"Unauthorized Access\")\n```\n\
  \nSecurityInterceptor 检查用户的凭据是否足以完成此操作。如果访问被授予，它会调用 invocation.proceed()，该调用会流向\
  \ perf_advisor 的第一个实例。如果访问被拒绝，它会引发安全异常，跳出整个调用栈，让调用方处理异常。在此示例中，user 被假定为包含当前用户资料的全局变量。\n\
  \nperf_advisor 是 RegexpMethodPointcutAdvisor 的一个实例，它对以 get 开头的任何方法应用 PerformanceInterceptor。虽然\
  \ perf_advisor 只有一个实例，但在顾问链中被使用了两次。这意味着它在进入 WikiService 的正常流程中会被使用两次。\n\n```python\n\
  import time\nclass PerformanceInterceptor(MethodInterceptor):\n    def invoke(self,\
  \ invocation):\n        start = time.time()\n        results = invocation.proceed()\n\
  \        stop = time.time()\n        print \"Method took %2f seconds\" % (stop-start)\n\
  \        return results\n```\n\nPerformanceInterceptor 通过捕获系统时间、调用 invocation.proceed()，然后在调用完成时再次捕获系统时间来衡量方法性能。然后它会在屏幕上打印出时间差，最后返回给调用的顾问。它第一次使用是在\
  \ caching_advisor 之前，第二次使用是在 caching_advisor 之后。这允许衡量缓存和未缓存的调用，衡量缓存提供的缓解。\n\n我们已经看到了\
  \ CachingInterceptor 的工作原理。\n\n虽然对 WikiService 进行调用所涉及的整个流程比我们之前的示例复杂得多，但快速定义额外的服务并将其应用于\
  \ WikiService API 却很容易。每个拦截器都很整洁干净，易于理解。这有助于降低维护成本。拦截器彼此之间以及与 WikiService 都很好地解耦，使得更容易混合和匹配切面以满足我们的需求。所有内容连接在一起的确切顺序方便地保存在一个地方，即我们的\
  \ IoC 容器定义。这通过我们两次使用 perf_advisor 来说明，即在有缓存和无缓存的情况下衡量性能。这共同证明了构建新服务并将其应用于现有 API\
  \ 是多么容易。\n\n## AOP 的性能成本\n\nAOP 不是免费的。使用 Spring Python AOP 代理包装目标对象并对方法调用执行检查会产生一定的开销成本。这显然取决于你使用多少建议以及你的\
  \ pointcuts 是什么。使用大量正则表达式可能会很昂贵，而简单地对所有方法应用拦截器而不进行条件检查则成本较小。\n\n\n\nThere is also\
  \ a different impact on whether or not the advised target object is inside a tight\
  \ loop.\n\n> 在优化之前测量成本非常重要。过早优化可能导致付出大量努力却收益甚微。使用 Python 分析器（或使用 Jython 时使用 Java\
  \ 分析器）是识别性能瓶颈的关键。\n\n## AOP 是一种范式，而非库\n\n关于 AOP 的文章很多。开发者们讨论过 Python 是否需要一个 AOP\
  \ 库。\n\n> 面向方面编程不仅仅是一个库。它是一种范式，就像面向对象编程和函数式编程一样。\n\nAOP 努力解决的关键目标是在 OOP 无法胜任的地方编写横切解决方案。OOP\
  \ 解决的是解决方案可以通过继承实现的问题。AOP 是横向的，而 OOP 是纵向的。无论如何，目标是相同的：\"DRY（不要重复自己）\" 和 \"遵守 SRP\"\
  。这也由 1:1 原则描述，该原则指出一个需求在已实现代码中只有一个且仅有一个体现。这是对 DRY 和 SRP 原则的结合。\n\n在添加日志、缓存、事务等功能时，开发者会诉诸复制粘贴式的编码。这种跨多个服务类的代码是重复的，并且代表单一策略。每当有变更时，变更必须在各处重复，这既有风险又昂贵。\n\
  \n在我们的示例中，我们使用 Spring Python 编写了一个拦截器并通过切点应用它。这使我们能够避免重复代码，同时保持简单和良好的封装。这具有以下好处。\n\
  \n- 只要向 WikiService 添加新方法，我们就可以检查 IoC 配置以查看 CachingInterceptor 是否适用。只有一个地方需要检查，这意味着检查切点很容易\n\
  - 我们可以轻松调整切点，而无需触及 CachingInterceptor。这展示了 advice 如何与切点干净地解耦\n- 在我们更复杂的配置中，我们引入了\
  \ `PerformanceInterceptor`，在其中我们观察哪些方法耗时最长并评估它们是否适合缓存。由于它不需要干扰其他拦截器或其切点，因此相对容易添加。这表明未来的更新应该相对容易进行\n\
  \n当 advice 与切点解耦时，添加新的切点和新的 advice 变得很容易，从而更新我们的横切行为。并且所有这些都可以在不影响我们增强的核心 API 的情况下完成。\n\
  \n我们已经展示了 AOP 支持松耦合解决方案。我们还研究了如何精确地应用 advice，提供高内聚。这些因素将帮助我们轻松应对我们已知即将到来的变化。\n\n\
  下图显示了组件如何连接在一起的高级视图。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_82_0.png)\n\n每个拦截器的代码都由其切点与顾问干净地包装，形成定义良好的方面。每个方面也与\
  \ `WikiService` 的业务逻辑分离。通过这种关注点分离，可以在最小风险的情况下轻松进行更改。添加新的顾问并更改执行顺序也很简单。\n\n## Spring\
  \ Python AOP 模块的独特特性\n\nSpring Python 并不是编写 AOP 解决方案的唯一手段。还有其他可用的库，例如 `Aspyct` 和\
  \ `aspects.py`。Python 丰富的特性集也提供了以类似 AOP 的方式编码的能力，使用诸如元类编程和装饰器等技术。\n\n需要注意的是 Spring\
  \ Python 的 AOP 解决方案的独特之处。虽然我尝试包含了一些与 `Aspyct` 和 `aspects.py` 的高层次比较，但建议读者访问这些项目并更详细地比较功能。\n\
  \n| 差异 | 描述 |\n|---|---|\n| 适用于对象实例的 Advice。 | Spring Python 为开发者提供了将 advice 应用于对象的单个实例的选项，而无需所有实例都采用该行为。这为开发者提供了最大灵活性。权衡在于，如果希望所有实例都具有此行为，则开发者有责任将其应用于所有实例。`Aspyct`\
  \ 允许你定义方面并将其应用于函数。该行为永久修改函数，并影响所有实例。`aspects.py` 提供了将函数包装在方法周围的能力。这将适用于所有实例。它也支持以这种方式包装部分实例。\
  \ |\n| 无需元类编程。 | 对于某些问题，元类编程可能是最简单的解决方案。对于其他问题，元类编程并不是所需的方法。它是标准 OOP 和过程式开发实践的替代范式。在\
  \ OOP 中，类是创建对象的模板。元类是创建类的模板。这意味着某些横切问题可能很容易适应元类编程，而其他问题则不然。Spring Python 的 AOP 解决方案不需要学习复杂概念。相反，它基于创建类并使用\
  \ IoC 定义应用 advice 的切点。 |\n| 无需访问源代码。 | 元类编程需要访问源代码。在 AOP 库中应用装饰器也需要访问源代码。这两种选项都使向第三方库应用\
  \ advice 变得更加困难，因为开发者不太可能承担维护补丁的工作。Aspyct 和 aspects.py 不需要修改源代码。然而，Aspyct 的主要应用方式涉及使用装饰器，这需要访问源代码。考虑到\
  \ Spring Python 利用其 IoC 容器来应用 advice，很容易使用任何库中的类并应用独立的顾问。 |\n| 无猴子补丁。 | 猴子补丁是指在运行时向对象的函数添加、删除或替换。尽管有些人认为猴子补丁是有价值的工具，但必须谨慎使用。修改库的类定义存在一定程度的相关风险，可能导致不可预测的错误。Spring\
  \ Python 利用代理将目标对象与拦截器合并。这使得添加和删除 advice 变得容易，同时保持服务与目标 API 之间良好的分离。本章后面将讨论方面的自动化测试。\
  \ |\n\n## AOP 的风险\n\nAOP 也有其自身风险。当某些功能（在我们的例子中是缓存）从核心代码移出并进入拦截器时，缓存逻辑何时处于活动状态可能并不明显。我们甚至可能不知道系统中存在缓存。但同样的话也可以说\
  \ OOP 实践，其中常用功能被移动到继承层次结构上或下的其他类中。所有这些编码风格都更适合于正确的一套工具、开发者培训、文档、自动化测试套件以及开发团队之间的沟通。由于与\
  \ OOP 相比 AOP 相对较新，工具集并不成熟，开发者也不熟悉这些概念。\n\n但这并不意味着 AOP 应该被放弃。相反，它应该像团队使用的任何其他技术、语言和工具套件一样进行评估。\n\
  \n## AOP 是 Spring 三角形的一部分\n\n下图——称为 Spring 三角形——涵盖了 Spring Python 使用的关键原则：\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_85_0.png)\n\
  \n使用 Spring Python 的 IoC 容器，我们能够取一个简单的 WikiService 对象并通过 AOP 在其上层叠 CachingService。通过使用依赖注入，我们使\
  \ WikiService 免于任何 Spring Python 依赖。要阅读此内容的细节，我们只需在 WikiProductionAppConfig 中查找\
  \ IoC 容器的蓝图。Spring 还利用了便携式服务抽象，例如 DatabaseTemplate，以减少使用低级 API 的需求。本书后面我们将重新审视 Spring\
  \ 三角形以更详细地讨论这一点。\n\n## 测试我们的方面\n\n如果你是一名专业软件开发者，此时你会感到有点紧张。我们在多个方面编写了相当多的代码，而且事情“只是起作用了”。我们都知道这种情况很少见。\n\
  \n方面就像代码的任何其他部分一样，需要进行测试。为了降低风险并保持最佳实践，我们应该为我们的方面编写自动化测试。有不同类型的测试可以进行。对于我们的缓存示例，将缓存功能隔离以确保其满足我们的要求会很有用；通常称为单元测试。此外，确保正确的\
  \ advice 应用于正确的函数对于确认 AOP 正在工作至关重要，这可以通过集成测试来验证。\n\n\n\n## 将服务与建议解耦\n\n在本章中，我们开发了一个泛化缓存的切面。我们展示了包含多个切面的后续增强。在本示例的剩余部分，我们将恢复到仅插入了我们的\
  \ CachingInterceptor 的早期配置。\n\n我们的切面恰好与其缓存服务紧密耦合。尽管我们编写的缓存解决方案很简单，假设我们计划用更复杂的方案替换它。为了更轻松地编写和测试缓存服务的增强功能，让我们将其拆分为单独的模块。\n\
  \n- 1. 首先，让我们重写建议，使其使用缓存服务，而不是自行处理缓存。\n- 2. 接下来，让我们将缓存逻辑移入一个单独的类。\n\n```\nclass\
  \ CachingInterceptor(MethodInterceptor):\n    def __init__(self, caching_service=None):\n\
  \        self.caching_service = caching_service\n\n    def invoke(self, invocation):\n\
  \        if invocation.method_name.startswith(\"get\"):\n            if invocation.args\
  \ not in self.caching_service.keys():\n                self.caching_service.store(invocation.args,\n\
  \                    invocation.proceed())\n            return self.caching_service.get(invocation.args)\n\
  \n        elif invocation.method_name.startswith(\"store\"):\n            self.caching_service.del(invocation.args)\n\
  \            invocation.proceed()\n```\n\n```\nclass CachingService(object):\n \
  \   def __init__(self):\n        self.cache = {}\n\n    def keys(self):\n      \
  \  return self.cache.keys\n\n    def store(self, key, value):\n        self.cache[key]\
  \ = value\n\n    def get(self, key):\n        return self.cache[key]\n\n    def\
  \ del(self, key):\n        del self.cache[key]\n```\n\n- 3. 这需要更新我们的 IoC 蓝图，以便将\
  \ CachingService 的实例注入到 CachingInterceptor 中。\n\n```\nclass WikiProductionAppConfig(PythonConfig):\n\
  \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
  \n    @Object\n    def data_access(self):\n        return MysqlDataAccess()\n\n\
  \    @Object\n    def caching_service(self):\n        return CachingService()\n\n\
  \    @Object\n    def interceptor(self):\n        return CachingInterceptor(self.caching_service())\n\
  \n    @Object\n    def wiki_service(self):\n        advisor = RegexpMethodPointcutAdvisor(\n\
  \            advice=[self.interceptor()],\n            patterns=[\".*get.*\", \"\
  .*store.*\"])\n        return ProxyFactoryObject(\n            target=WikiService(self.data_access()),\n\
  \            interceptors=advisor)\n```\n\n下图展示了我们如何将 CachingService 提取到单独的组件中，并将其与\
  \ CachingInterceptor 一起提升为完全命名的 Spring Python 对象。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_88_0.png)\n\
  \n## 测试我们的服务\n\n现在我们已将缓存服务提取到单独的模块中，编写一些自动化测试变得很容易。\n\n- 1. 在编写任何测试之前，让我们创建一个可测试的\
  \ IoC 容器版本，使其与 WikiService 以及包含我们切面的 ProxyFactoryObject 上下层的任何层隔离。\n\n```\nclass\
  \ WikiTestAppConfig(WikiProductionAppConfig):\n    def __init__(self):\n       \
  \ super(WikiTestAppConfig, self).__init__()\n\n    @Object\n    def data_access(self):\n\
  \        return StubDataAccess()\n```\n\n- 2. 这用 StubDataAccess 替换了 MysqlDataAccess，后者运行更快，避免与其他开发人员争夺数据库，并且对每个方法都有预格式化的响应。借助\
  \ Python 的单元测试框架取代视图层作为调用者，我们已将代码库隔离用于测试。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_89_0.png)\n\
  \n- 3. 让我们编写一个测试来验证缓存服务的值。\n\n```\nclass CachedWikiTest(unittest.TestCase):\n  \
  \  def testCachingService(self):\n        context = ApplicationContext(WikiTestAppConfig())\n\
  \        caching_service = context.get_object(\"caching_service\")\n        self.assertEquals(len(caching_service.keys()),\
  \ 0)\n        caching_service.store(\"key\", \"value\")\n        self.assertEquals(len(caching_service.keys()),\
  \ 1)\n        self.assertEquals(caching_service.get(\"key\"), \"value\")\n     \
  \   caching_service.del(\"key\")\n        self.assertEquals(len(caching_service.keys()),\
  \ 0)\n```\n\n在此测试方法中，我们从 IoC 容器中获取 caching_service 的副本。然后，我们验证它是否为空。接下来，我们存储一个简单的键/值对，并验证缓存的大小和内容。最后，我们调用\
  \ caching_service 的 del() 方法，并验证缓存是否已正确清空。\n\n我承认 CachingService 有点过度设计，考虑到它只是一个\
  \ Python 字典。我通常不会为这种语言级结构编写单元测试。然而，本示例的目的是展示我们可以将解决方案移入单独的模块，摆脱任何 AOP 机制，然后用更复杂的功能增强它。我们可以将其修改为分布式缓存，使其在多个节点间持久存在，而不会影响\
  \ WikiService 或 CachingInterceptor。\n\n测试缓存服务很有价值，因为它可以防止错误重新潜入代码库。但我们也需要知道我们的切面是否已正确地与我们编写的\
  \ Wiki API 编织在一起。\n\n## 确认我们的服务已正确编织到 API 中\n\n我们已通过隔离缓存服务并编写自动化测试来确认其正常工作。我们需要完成的最后任务是验证我们是否已将缓存服务正确地连线到我们的\
  \ API 中。\n\n让我们在 CachedWikiTest 中添加另一个测试方法，展示 WikiService 是否被正确建议。\n\n```python\n\
  def testWikiServiceWithCaching(self):\n    context = ApplicationContext(WikiTestAppConfig())\n\
  \    caching_service = context.get(\"caching_service\")\n    self.assertEquals(len(caching_service.keys()),\
  \ 0)\n    wiki_service = context.get_object(\"wiki_service\")\n    wiki_service.statistics(\"\
  Spring Python\")\n    self.assertEquals(len(caching_service.keys()), 0)\n    html\
  \ = wiki_service.get_article(\"Spring Python\")\n    self.assertEquals(len(caching_service.keys()),\
  \ 1)\n    wiki_service.store_article(\"Spring Python\")\n    self.assertEquals(len(caching_service.keys()),\
  \ 0)\n```\n\n在此测试中，我们从 IoC 容器中获取 `caching_service` 的副本并验证其为空。接下来，我们从 IoC 容器中获取 `wiki_service`\
  \ 的副本。在我们的 IoC 容器内部，我们知道 `caching_service` 是通过某些 AOP 建议链接到 `wiki_service` 的。我们调用\
  \ `statistics`，并断言缓存仍然为空，因为建议不适用于该方法。接下来，我们调用 `get_article`，并验证缓存中已新增条目。最后，我们调用\
  \ `store_article`，并验证其已清空缓存。\n\n将此测试与之前的测试结合，我们清楚地表明我们的 `CachingInterceptor` 建议按预期工作。使用了\
  \ IoC 容器后，我们已很好地解耦了事物，现在可以轻松调整一个类而不影响另一个。\n\n## 摘要\n\n我们探讨了如何使用面向方面编程解决横切问题。这些问题包括缓存、安全性和性能测量；如果诉诸标准\
  \ OOP 实践，所有这些问题都需要丑陋的复制粘贴解决方案。\n\nSpring Python 的 AOP 模块帮助我们坚持 DRY 和 SRP 原则。这降低了维护成本，并帮助我们处理不断到来的未来变化。\n\
  \n在本章中，我们学习了：\n\n- 如何向 Spring Python 对象添加缓存\n- 如何通过添加性能和安全顾问来扩展示例\n- AOP 是一种范式，而不仅仅是一个库\n\
  - Spring Python 的 AOP 与其他库以及 Python 语言特性相比的独特功能\n- AOP 的风险以及如何通过自动化测试来缓解\n- 关于应用\
  \ `Advice` 的一些提示\n\n在下一章中，我们将研究如何使用 Spring Python 的 `DatabaseTemplate` 轻松编写 SQL\
  \ 查询。\n\n\n\n\n# 4 轻松编写 SQL 查询\n\n# 轻松编写 SQL 查询\n使用 Spring Python\n\n我们的许多应用程序都包含需要从关系数据库中提取并存储其中的动态数据。即使存在基于键/值的数据存储，生产环境中绝大多数数据存储都托管在基于\
  \ SQL 的关系数据库中。\n\n鉴于这一事实上的要求，如果我们可以专注于 SQL 查询本身，而不是花费大量时间编写样板代码并使每个查询都具有容错性，那么开发者的效率就会提高。\n\
  \n在本章中，我们将学习：\n\n-   影响许多现代编程语言 API 的经典 SQL 查询问题\n-   使用 Spring Python 的 `DatabaseTemplate`\
  \ 来减少查询管理代码\n-   将 `DatabaseTemplate` 与 **对象关系映射器 (ORMs)** 进行比较\n-   将 `DatabaseTemplate`\
  \ 与 ORM 结合以构建健壮的应用程序\n-   使用模拟测试查询\n\n## 经典的 SQL 问题\n\nSQL 是一种长期存在的标准，它与许多现代编程语言（包括\
  \ Python）共享编写查询的通用范式。由此产生的效果是，手写查询很繁琐。让我们通过使用 Python 的数据库 API 编写一个简单的 SQL 查询来探索这一困境。\n\
  \n1.  首先，让我们为 wiki 引擎创建一个数据库模式，以便存储和检索 wiki 上下文。\n2.  现在，让我们使用数据库的 shell 编写一个 SQL\
  \ 语句来统计系统中的 wiki 文章数量。\n\n```sql\nDROP TABLE IF EXISTS article;\n\nCREATE TABLE\
  \ article (\n    id serial PRIMARY KEY,\n    title VARCHAR(11),\n    wiki_text VARCHAR(10000)\n\
  );\n\nINSERT INTO article\n(id, title, wiki_text\nVALUES\n(1,\n'Spring Python Book',\n\
  'Welcome to the [http://springpythonbook.com Spring Python] book,\nwhere you can\
  \ learn more about [[Spring Python]].');\nINSERT INTO article\n(id, title, wiki_text\n\
  VALUES\n(2,\n'Spring Python',\n'\\'\\\\\\'\\'Spring Python\\'\\\\\\'\\' takes the\
  \ concepts of Spring and\napplies them to world of [http://python.org Python].');\n\
  ```\n\n```sql\nSELECT COUNT(*) FROM ARTICLE\n```\n\n3.  现在让我们编写一些 Python 代码，使用 Python\
  \ 的官方数据库 API (http://www.python.org/dev/peps/pep-0249) 在 sqlite3 数据库上运行相同的查询。\n\n\
  ```python\nimport sqlite3\n\ndb = sqlite3.connect(\"/path/to/sqlite3db\")\n\ncursor\
  \ = db.cursor()\nresults = None\ntry:\n    try:\n        cursor.execute(\"SELECT\
  \ COUNT(*) FROM ARTICLE\")\n        results = cursor.fetchall()\n    except Exception,\
  \ e:\n        print \"execute: Trapped %s\" % e\nfinally:\n    try:\n        cursor.close()\n\
  \    except Exception, e:\n        print \"close: Trapped %s, and throwing away\"\
  \ % e\n\nreturn results[0][0]\n```\n\n这是一段相当大的代码块，用于执行如此简单的查询。让我们更详细地检查它。\n\n4.\
  \  首先，我们连接到数据库。对于 sqlite3，我们只需要一个路径。其他数据库引擎通常需要用户名和密码。\n5.  接下来，我们创建一个用于保存结果集的游标。\n\
  6.  然后我们执行查询。为了保护自己免受任何异常的影响，我们需要用一些异常处理器将其包装起来。\n7.  完成查询后，我们获取结果。\n8.  将结果从结果集提取到变量后，我们关闭游标。\n\
  9.  最后，我们可以返回响应。Python 将结果打包成元组数组。由于我们只需要一行和第一列，因此我们进行双重索引查找。\n\n这段代码试图在数据库中找到什么？关键语句在一行中。\n\
  \n```python\ncursor.execute(\"SELECT COUNT(*) FROM ARTICLE\")\n```\n\n如果我们正在编写脚本呢？找到一个信息会是一项大量工作。当然，快速退出的脚本可能也可以跳过一些错误处理以及关闭游标。但仅为了获取一个用于运行查询的游标，仍然有相当多的样板代码。\n\
  \n但如果这是长时间运行应用程序的一部分呢？我们需要在每次查询后关闭游标，以避免泄漏数据库资源。大型应用程序也有许多不同的查询需要维护。反复编码这种模式会耗尽开发团队的精力。\n\
  \n## 参数化代码\n\n这段样板代码是一个反复出现的模式。你认为我们可以参数化它并使其可重用吗？我们已经确定了 SQL 语句的关键部分。让我们尝试将其重写为一个仅执行此操作的函数。\n\
  \n```python\nimport sqlite3\n\ndef query(sql_statement):\n    db = sqlite3.connect(\"\
  /path/to/sqlite3db\")\n\n    cursor = db.cursor()\n    results = None\n    try:\n\
  \        try:\n            cursor.execute(sql_statement)\n            results =\
  \ cursor.fetchall()\n        except Exception, e:\n            print \"execute:\
  \ Trapped %s\" % e\n    finally:\n        try:\n            cursor.close()\n   \
  \     except Exception, e:\n            print \"close: Trapped %s, and throwing\
  \ away\" % e\n\n    return results[0][0]\n```\n\n我们的第一步很好地参数化了 SQL 语句，但这还不够。返回语句被硬编码为返回第一行的第一个条目。对于计数文章，我们编写的内容是可以的。但这对于其他查询来说不够灵活。我们需要能够插入我们自己的结果处理器。\n\
  \n```python\nimport sqlite3\n\ndef query(sql_statement, row_handler):\n    db =\
  \ sqlite3.connect(\"/path/to/sqlite3db\")\n\n    cursor = db.cursor()\n    results\
  \ = None\n    try:\n        try:\n            cursor.execute(sql_statement)\n  \
  \          results = cursor.fetchall()\n        except Exception, e:\n         \
  \   print \"execute: Trapped %s\" % e\n    finally:\n        try:\n            cursor.close()\n\
  \        except Exception, e:\n            print \"close: Trapped %s, and throwing\
  \ away\" % e\n\n    return row_handler(results)\n```\n\n我们现在可以编写一个自定义处理器。\n\n```python\n\
  def count_handler(results):\n    return results[0][0]\n\nquery(\"select COUNT(*)\
  \ from ARTICLES\", count_handler)\n```\n\n有了这个自定义结果处理器，我们现在可以调用我们的查询函数，并同时提供查询和处理器。剩下的唯一事情是处理创建数据库连接。将\
  \ sqlite3 连接代码与工厂解决方案包装起来留给读者作为练习。\n\n我们在这里编写的代码本质上是 DatabaseTemplate 的核心功能。这种将算法参数化以便重用的方法被称为模板模式。还进行了一些额外的检查以保护查询免受\
  \ SQL 注入攻击。\n\n## 用 Spring Python 的一行代码替换多行查询代码\n\nSpring Python 有一个方便的实用类 DatabaseTemplate，可大大简化此问题。\n\
  \n1.  让我们用一些 Spring Python 设置代码替换之前示例中的两行导入和连接代码。\n\n```python\nfrom springpython.database.factory\
  \ import Sqlite3ConnectionFactory\nfrom springpython.database.core import DatabaseTemplate\n\
  \nconn_factory = Sqlite3ConnectionFactory(\"/path/to/sqlite3db\")\ndt = DatabaseTemplate(conn_factory)\n\
  ```\n\n乍一看，我们似乎退了一步。我们只是用四行代码替换了之前的两行代码。然而，下一个代码块应该会显著改善情况。\n\n2.  让我们用我们 DatabaseTemplate\
  \ 实例的调用替换之前的编码查询。\n\n```python\nreturn dt.query_for_object(\"SELECT COUNT(*) FROM\
  \ ARTICLE\")\n```\n\n现在我们成功将复杂的 14 行代码块减少到 Spring Python 的一行代码。这使得我们的 Python 代码看起来与我们在数据库\
  \ shell 中输入的原始 SQL 语句一样简单。而且它也减少了噪音。\n\n## Spring 三角形——可移植服务抽象\n\n我们在书中前面看到过这张图，作为\
  \ Spring Python 背后关键原则的说明。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_98_0.png)\n\
  \n`DatabaseTemplate` 代表 **可移植服务抽象**，因为：\n\n-   它是 **可移植的**，因为它使用 Python 的标准化 API，不将我们绑定到任何数据库厂商。相反，在我们的示例中，我们注入了一个\
  \ `Sqlite3ConnectionFactory` 实例\n-   它提供了有用的 **服务**，即轻松访问关系数据库中存储的信息，但让我们专注于查询，而不是样板代码\n\
  -   它在 Python 的低级数据库 API 之上提供了良好的 **抽象**，代码噪音减少。这使我们避免了编写代码来管理游标和异常处理的成本和风险\n\n\
  ![](img/bcf886d8b665372ee8afbb620d4273bb_99_0.png)\n\n> DatabaseTemplate 通过捕获并保存异常，然后正确关闭游标来处理异常。然后它将其包装在\
  \ Spring Python `DataAccessException` 中抛出。这样，数据库资源会被正确释放，而不会丢失异常堆栈跟踪。\n\n## 使用 DatabaseTemplate\
  \ 检索对象\n\n我们的第一个示例展示了如何轻松减少代码量。但它实际上只适用于简单情况。一个真正有用的操作是执行查询并将结果转换为对象列表。\n\n1.  首先，让我们定义一个简单的对象，我们希望用从数据库检索到的信息填充它。如\
  \ Spring 三角形图所示，使用简单对象是 'Spring 方式' 的核心方面。\n2.  如果我们想使用 Python 的标准 API 编码，代码会相对冗长，如下所示：\n\
  \n```python\nclass Article(object):\n    def __init__(self, id=None, title=None,\
  \ wiki_text=None):\n        self.id = id\n        self.title = title\n        self.wiki_text\
  \ = wiki_text\n```\n\n```python\ncursor = db.cursor()\nresults = []\ntry:\n    try:\n\
  \        cursor.execute(\"SELECT id, title, wiki_text FROM ARTICLE\")\n        temp\
  \ = cursor.fetchall()\n```\n\n\n\n```\nfor row in temp:\n    results.append(\n \
  \       Article(id=temp[0],\n                title=temp[1],\n                wiki_text=temp[2]))\n\
  \    except Exception, e:\n        print \"execute: Trapped %s\" % e\nfinally:\n\
  \    try:\n        cursor.close()\n    except Exception, e:\n        print \"close:\
  \ Trapped %s, and throwing away\" % e\n\nreturn results\n```\n\n这与之前的示例并没有太大不同。关键区别在于，我们不是直接将\
  \ fetchall 分配给 results，而是对其进行迭代，生成一个 Article 对象列表。\n\n3. 相反，让我们使用 DatabaseTemplate\
  \ 来减少代码量。\n\n```\nreturn dt.query(\"SELECT id, title, wiki_text FROM ARTICLE\",\n\
  \                ArticleMapper())\n```\n\n4. 我们还没有完成。我们必须编写 ArticleMapper，这是用于迭代结果集的对象类。\n\
  \n```\nfrom springpython.database.core import RowMapper\n```\n\n```\nclass ArticleMapper(RowMapper):\n\
  \    def map_row(self, row, metadata=None):\n        return Article(id=row[0], title=row[1],\
  \ wiki_text=row[2])\n```\n\nRowMapper 定义了单个方法：map_row。该方法针对每一行数据调用，不仅包含信息，还包含数据库提供的元数据。ArticleMapper\
  \ 可用于执行相同映射的每个查询。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_100_0.png)\n\n> 这与之前所示的参数化示例略有不同，在该示例中我们定义了一个行处理函数。这里我们定义一个包含\
  \ map_row 函数的类。但概念是相同的：注入一个行处理器来转换数据。\n\n## 通过约定优于配置进行查询映射\n\n我们的类定义恰好具有与数据库中列相同的属性名称。Spring\
  \ Python 提供了 `SimpleRowMapper` 作为方便的开箱即用映射器，利用了这一点。\n\n不要编写专门的 `ArticleMapper`，让我们改用\
  \ Spring Python 的 `SimpleRowMapper`。\n\n```python\nreturn dt.query(\"SELECT id,\
  \ title, wiki_text FROM ARTICLE\",\n    SimpleRowMapper(Article))\n```\n\n`SimpleRowMapper`\
  \ 要求类具有默认构造函数，并且类的属性与查询相匹配。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_101_0.png)\n\
  \n> 需要记住，列到属性的匹配基于查询，而不是表。这意味着我们可以使用 SQL 别名将表列与对象关联起来。\n\n## 将查询映射到字典\n\nSpring\
  \ Python 还提供了 `DictionaryRowMapper`，它方便地将查询映射到 Python 字典。\n\n不要使用 `SimpleRowMapper`，让我们改用\
  \ Spring Python 的 `DictionaryRowMapper`。\n\n```python\nreturn dt.query(\"SELECT\
  \ id, title, wiki_text FROM ARTICLE\",\n    DictionaryRowMapper())\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_101_1.png)\n\
  \n> 这最后一步偏离了我们最初要求返回 `Article` 对象列表的要求。但它提供简单“数据窗口”场景的一种便捷方式，可能完全符合我们的需求。\n\n##\
  \ DatabaseTemplate 与 ORM\n\n- `DatabaseTemplate` 专注于在不编写大量样板代码的情况下访问数据库\n- ORM 专注于将表映射到对象\n\
  \n`DatabaseTemplate` 与 ORM 并无冲突。我们必须做出的选择是在使用 SQL 并处理结果集之间，还是使用 ORM。\n\n> 在详细讨论\
  \ ORM 和 DatabaseTemplate 之前，查看一个流行的 Python ORM 的快速示例可能会有所帮助：**SQLAlchemy** (http://www.sqlalchemy.org)。我们本可以为此演示选择任意数量的\
  \ ORM。\n\n```\nfrom sqlalchemy import *\n\nengine = create_engine(\"sqlite:///tmp/springpython.db\"\
  , echo=True)\nmetadata = BoundMetaData(engine)\narticle_table = Table('Article',\
  \ metadata,\n    Column('id', Integer, primary_key=True),\n    Column('title', String()),\n\
  \    Column('wiki_text', String()))\n\narticle_mapper = mapper(Article, article_table)\n\
  \nsession = create_session(bind_to=engine)\narticles = session.query(Article)\n\
  ```\n\n这演示了我们如何使用 SQLAlchemy 来定义 ARTICLE 表与 Article 类之间的映射。ORM 还提供了许多其他查询选项，包括过滤器和条件。ORM\
  \ 的主要目的是将数据库映射到对象。使用 ORM 与使用原始 SQL 一样存在样板代码。\n\n## DatabaseTemplate 提供的解决方案\n\n\
  如果我们为数据需求选择 `DatabaseTemplate`，我们将使用纯 SQL 编写更新、插入、删除和查询。如果我们的团队由熟悉 SQL 的数据库设计师和软件开发人员组成，这将带来巨大的好处——更符合他们的技能。整个团队可以通过使用\
  \ SQL 这种通用语言来参与设计表、查询和数据管理的努力。\n\n在这种情况下，DatabaseTemplate 绝对会让事情变得更容易，如前所述。这将使我们的团队能够将精力投入到设计和管理应用程序数据上。\n\
  \nDatabaseTemplate 提供的操作集在下表中列出。\n\n| 操作 | 描述 |\n|---|---|\n| execute(sql_statement,\
  \ args=None) | 执行任意语句，返回受影响的行数 |\n| query(sql_query, args=None, rowhandler=None)\
  \ | 查询，返回由 rowhandler 转换的列表 |\n| query_for_list(sql_query, args=None) | 查询，返回 Python\
  \ 元组列表 |\n| query_for_int(sql_query, args=None) | 运行查询获取单行单列，并返回整数，否则抛出异常 |\n| query_for_long(sql_query,\
  \ args=None) | 查询单行单列，并返回长整数，否则抛出异常 |\n| query_for_object(sql_query, args=None,\
  \ required_type=None) | 查询单行单列，并返回对象，可选类型检查 |\n| update(sql_statement, args=None)\
  \ | 更新数据库，返回受影响的行数 |\n\n这可能看起来不是很多操作，但 DatabaseTemplate 的目的是提供轻松编写 SQL 的访问方式。此 API\
  \ 提供了编写插入、更新、删除和查询的能力，同时也能调用存储过程。\n\nDatabaseTemplate 也能很好地与 Spring Python 事务配合使用。这个横切特性将在下一章详细探讨。\n\
  \n## DatabaseTemplate 与 ORM 如何协同工作\n\n在构建应用程序时，我们往往倾向于从一种范式开始，然后发现它存在局限性。从纯 SQL\
  \ 角度或 ORM 角度构建支持大量用户和复杂功能的企业级应用程序可能会超出两者能力。这时可能就需要同时在同一个应用程序中使用 DatabaseTemplate\
  \ 和 ORM。\n\n使用 ORM 来编码和管理简单实体和直接关系将是一个实用的解决方案。我们可以快速为应用程序构建持久性，然后转向真正的业务解决方案。\n\n\
  但生成复杂报告、详细结构和存储过程所需的查询可能更适合使用 `DatabaseTemplate` 管理。\n\n如果我们能让团队摆脱为简单对象编写自定义 SQL\
  \ 的工作，他们就可以专注于为复杂查询编写专门的 SQL。\n\n使用 *合适的工具做合适的工作* 应该是我们软件开发流程的关键要素，而在工具箱中同时拥有 `DatabaseTemplate`\
  \ 和 ORM 是务实的做法。\n\n## 使用模拟测试数据访问层\n\n在之前的章节中，我们编写了涉及对数据访问层进行 stub 的自动化测试。现在我们正处于编写数据访问层的核心阶段，需要寻找测试查询的方法。具体来说，我们需要确保正确使用\
  \ `DatabaseTemplate`，以及我们编写的任何自定义行映射器。\n\nMock 主要用于记录调用了哪些函数，并提供返回特定值的选项。其思路是创建一组预期操作，然后调用实际\
  \ API 并衡量是否发生了这些操作。这与 stub 相比，stub 是你自己编写的，提供固定答案，并且不一定关心调用了哪些方法。这两种工具都对自动化测试有用。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_104_0.png)\n\n> Spring Python 使用 **pmock**，这是一个受\
  \ **jMock** (http://www.jmock.org/) 流畅 API 启发的 Python 库，来进行部分自动化测试。你不必使用这个特定的 mocking\
  \ 库。周围还有很多其他选择。就我们的目的而言，我们将在此处使用它来展示为测试而模拟数据访问层的一般思路。\n> \n> 由于 `pmock` 原始开发者的更新缺乏，该库的源代码已添加到\
  \ Spring Python 的托管代码集中，并进行了一些自定义更新。有关下载详情，请参阅 http://springpython.webfactional.com。\n\
  \n\n\n1. 首先，让我们编写一个简单的 DataAccess 类，使用 DatabaseTemplate 来获取我们拥有的文章数量。\n\n```\nclass\
  \ DataAccess(object):\n    def __init__(self, conn_factory):\n        self.dt =\
  \ DatabaseTemplate(conn_factory)\n\n    def count_wiki_articles(self):\n       \
  \ return self.dt.query_for_object(\"SELECT COUNT(*) FROM ARTICLE\")\n```\n\n这个简单的數據訪問層只有一个方法：count_wiki_articles。它使用了我们之前编写的涉及\
  \ DatabaseTemplate 的代码。在此示例中，DataAccess 预计使用连接工厂进行初始化。\n\n现在，为了测试它，我们需要 DatabaseTemplate\
  \ 执行其工作，但我们希望在正确的位置捕获它，以便注入一些预先构建的值。执行繁重工作的代码部分是 Spring Python 的 cursor 对象，它由连接提供。这意味着我们需要编写一个特殊的存根连接工厂来保存一个模拟的游标。\n\
  \n2. 让我们编写一个专门的类来充当模拟连接。\n\n```\nclass MockedConnection(object):\n    def __init__(self):\n\
  \        self.mockCursor = None\n    def cursor(self):\n        return self.mockCursor\n\
  ```\n\n该连接将为 DatabaseTemplate 提供一种特殊的模拟游标类型。稍后，我们将看到如何填充 mockCursor。\n\n3. 为了使用它，让我们为\
  \ DatabaseTemplate 编写一个连接工厂来生成这种类型的连接。\n\n```\nclass MockingDBFactory(ConnectionFactory):\n\
  \    def __init__(self):\n        ConnectionFactory.__init__(self, [types.TupleType])\n\
  \        self.mockedConnection = MockedConnection()\n    def connect(self):\n  \
  \      return self.mockedConnection\n```\n\n当此连接工厂被要求连接到数据库时，它将返回一个 MockedConnection。\n\
  \n4. 为了将这些装置连接起来，我们需要设置一个 MockTestCase。这是一种特殊的单元测试类型，它为 pmock 的库调用提供额外的钩子。\n\n```\n\
  from pmock import *\n\nclass DataAccessMockTestCase(MockTestCase):\n    def setUp(self):\n\
  \        # Create a mock instance to record events\n        self.mock = self.mock()\n\
  \        conn_factory = MockingDBFactory()\n        conn_factory.mockedConnection.mockCursor\
  \ = self.mock\n        self.data_access = DataAccess(conn_factory)\n```\n\n在这里，在我们的测试的\
  \ setUp 方法中，我们获取 mock() 的一个实例。此对象具有记录期望的 API。该对象旨在被注入，以便随后对其进行函数调用，并在 MockTestCase\
  \ 测试方法结束时，将结果与期望进行比较。\n\n在这种情况下，mockCursor 是 mock 的关键持有者。还有一个本地副本，以便 MockTestCase\
  \ 能够处理检查结果。\n\n5. 在完成所有这些设置后，让我们定义一个模拟的测试方法。\n\n```\ndef testCountingArticles(self):\n\
  \    self.mock.expects(once()).method(\"execute\")\n    self.mock.expects(once()).method(\"\
  fetchall\")\n        .will(return_value([[(2,)]]))\n\n    count = self.data_access.count_wiki_articles()\n\
  \    self.assertEquals(count, 2)\n```\n\n此测试的前两个步骤使用 mock 对象来定义期望。预计 mock 将接收一次\
  \ execute 方法调用，以及一次 fetchall 方法调用。fetchall 将返回值为 [ (2,) ]。\n\n我们不仅可以检查断言，而且 pmock\
  \ 还会验证 DatabaseTemplate 是否调用了这些方法中的每一个。\n\n## 测试多少才足够？\n\n对于此测试场景，我们深入挖掘了。这种类型的测试如果不直接与实时数据库通信，就无法更接近数据库服务器的硬件。\n\
  \n可以认为我们实际上是在测试 DatabaseTemplate 的核心。在许多开发情况下，这是不需要的。测试第三方库可能超出了范围。\n\n此示例测试场景在很大程度上基于用于确认\
  \ Spring Python 功能的自动化测试。针对您业务需求的充分测试可能涉及对数据访问层进行存根或模拟，如本书前面部分所示。\n\n这应该让您了解模拟的概念，即测量方法调用和答案。这种类型的测试可能非常适合其他测试需求。如果\
  \ SQL 查询已在此层中很好地隔离，那么可以说唯一需要的测试就是查询本身在实时数据库上的测试，从而根本不需要任何模拟或存根。\n\n## 摘要\n\n本章展示了一种编写纯\
  \ SQL 而无需处理低级游标和连接管理的方法。这消除了大量样板代码和错误处理，非常适合框架处理。\n\n我们还探讨了 DatabaseTemplate 和 ORM\
  \ 如何协同工作，使开发人员的持久性管理变得更容易。\n\n我们研究了模拟，以及我们如何深入查询过程以验证是否进行了正确的方法调用。然后我们退一步考虑测试多少才足够。\n\
  \n在本章中我们学到了：\n\n- 影响许多现代编程语言 API 的经典 SQL 查询问题也延伸到了 Python\n- 使用 Spring Python 的\
  \ DatabaseTemplate 可以让我们摆脱妨碍解决用例的查询样板代码\n- DatabaseTemplate 对于在不处理游标管理的情况下编写 SQL\
  \ 代码非常有用\n- 与 ORM 结合的 DatabaseTemplate 可以帮助我们构建健壮的应用程序\n- 模拟是自动化测试中的有价值工具，但我们必须为正确的情况选择正确的工具\n\
  \n在下一章中，我们将研究如何通过非侵入式事务增强我们的数据访问层。\n\n# 5 使用事务为数据访问添加完整性\n\n# 使用事务为数据访问添加完整性\n\n\
  SQL 操作在许多应用程序中用于提供数据。将应用程序扩展到企业规模的关键要素之一是事务。它们通过定义原子工作单元为数据管理添加完整性。\n\n原子工作单元意味着当整个步骤序列完成后必须看起来像一个步骤。如果步骤链中出现任何故障，一切都必须回滚到事务开始前的状态。对于\
  \ SQL 事务，这意味着数据库的状态必须原子地更新或回滚。\n\n本章将检查编码和使用 SQL 事务的模式，以及 Spring Python 如何使原本单调的模式变得易于编码。\n\
  \n在本章中，您将学习：\n\n- SQL 事务的经典模式以及手工编码事务时带来的问题\n- 使用 Spring Python 的 `@transactional`\
  \ 装饰器可以轻松地向银行应用程序添加事务\n- 您可以在以编程方式或通过装饰器编码事务之间进行选择\n- 您可以选择使用或不使用 IoC 容器\n- Spring\
  \ Python 提供了将事务非侵入式地混合到非事务代码中的手段，而无需编辑源代码\n\n## 经典事务问题\n\n事务具有简单的执行模式，如以下伪 Python\
  \ 代码块所示。\n\n```\n# Start transaction\ntry:\n    #*********************************\n\
  \    # Execute business logic that\n    # contains database operations.\n    #*********************************\n\
  \n    # Commit transaction\nexcept:\n    # Rollback transaction\n```\n\n让我们看看定义事务所涉及的步骤：\n\
  \n- 1. 首先，事务必须 *开始*。\n- 2. 然后，执行一段业务代码，其中包含多个数据库操作，包括 `select`、`update` 和 `insert`。\n\
  - 3. 最后，事务将被 *提交*。如果出现任何类型的错误，异常处理程序将 *回滚* 事务，撤销所做的所有更改。\n\n手工编写事务的问题与手工编写 SQL 操作的问题类似。必须编写大量样板代码。样板代码具有纠缠效应，因为它必须在业务代码之前和之后编写，以便正确处理事务。然后，此模式必须复制到需要将某些业务逻辑包装在事务中的每个位置。\n\
  \n这违反了 **DRY（不要重复自己）** 原则。它还使我们的代码不仅与业务逻辑纠缠在一起，还与事务逻辑纠缠在一起。而且它破坏了 **单一职责原则 (SRP)**，因为我们的代码同时依赖于业务和完整性要求。\n\
  \n违反这些原则会使我们面临风险。当需要对事务逻辑进行更改时，我们可能会引入错误，但未能在所有正确的位置重复这些更改。\n\n这是一个横切问题，因为它超出了我们的类层次结构。工作单元中包含的步骤可以迅速跨越多个类。这正是本书前面讨论过的面向方面编程的完美用例。随着我们在本章中更详细地探讨这个问题，我们将看到如何使用\
  \ Spring Python 轻松解决它。\n\n\n\n## 创建银行应用程序\n\n直到现在，各章展示的示例代码都涉及设计 wiki 引擎。本章将以银行应用程序为代码示例的基础。银行必须能够移动资金且不丢失一分钱，保持高度完整性。这提供了一个简单的业务场景来演示事务代码的编写。\n\
  \n- 首先，让我们编写一个简单的转账操作，在没有任何事务概念的情况下将一定金额的资金从一个账户转移到另一个账户。\n- 让我们将此操作与之前查看的事务模式结合起来，为我们的银行提供一定的完整性。\n\
  \n```\ndef transfer(transfer_amt, source_act, target_act):\n    cursor = conn.cursor()\n\
  \    cursor.execute(\"\"\"\n        update ACCOUNT\n        set BALANCE = BALANCE\
  \ - %s\n        where ACCOUNT_NUM = %s\"\"\",\n        (transfer_amt, source_act))\n\
  \    cursor.execute(\"\"\"\n        update ACCOUNT\n        set BALANCE = BALANCE\
  \ + %s\n        where ACCOUNT_NUM = %s\"\"\",\n        (transfer_amt, target_act))\n\
  \    cursor.close()\n```\n\n假设我们要从 SAVINGS 账户向 CHECKING 账户转账 10,000 美元。在我们的业务逻辑中，我们通过先从\
  \ SAVINGS 账户提取 10,000 美元，然后向 CHECKING 账户存入 10,000 美元来实现。\n\n想象一下，如果在我们从 SAVINGS\
  \ 账户提取资金之后发生了一些系统错误，导致系统重启。由于从未将转账金额存入 CHECKING 账户，银行就会将 10,000 美元泄露到无处。您会在这样的银行里存放钱多久？可能不会太久！\n\
  \n```\ndef transfer(transfer_amt, source_act, target_act):\n    conn.commit()\n\
  \    try:\n        cursor = conn.cursor()\n        cursor.execute(\"\"\"\n     \
  \       update ACCOUNT\n            set BALANCE = BALANCE - %s\n            where\
  \ ACCOUNT_NUM = %s\"\"\",\n            (transfer_amt, source_act))\n        cursor.execute(\"\
  \"\"\n            update ACCOUNT\n            set BALANCE = BALANCE + %s\n     \
  \       where ACCOUNT_NUM = %s\"\"\",\n            (transfer_amt, target_act))\n\
  \        cursor.close()\n        conn.commit()\n    except:\n        conn.rollback()\n\
  ```\n\n在我们更新的示例中，我们现在以 conn.commit() 开始，以便开始一个新事务。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_112_0.png)\n\
  \n> 如果您使用兼容 Python DB API 的数据库模块，则在连接到数据库时事务可用。connection.commit() 和 connection.rollback()\
  \ 完成现有事务并隐式启动一个新事务 (http://www.pubbs.net/python/200901/18953/)。这就是为什么这段代码块以 commit\
  \ 语句开始的原因。\n\n我们进入 try/except 块并开始执行之前编写的相同业务代码。最后，我们执行 conn.commit()，将结果提交到数据库。\n\
  \n在发生某些系统错误的情况下，commit 将永远不会被执行。这意味着从 SAVINGS 账户的提取将不会写入数据库。如果这真的是一个严重的系统故障，关系数据库将恢复到事务开始之前的状态。\n\
  \n对于较轻的故障，其中引发了某种应用程序级异常，将导致调用 conn.rollback()，将所有更改回滚到事务开始时。\n\n该解决方案解决了问题，使得我们的银行不会因系统故障和错误而泄漏资金。但为了在银行应用程序的其他部分重用此事务模式，我们必须一遍又一遍地重复编码模式，从而增加了出现错误的风险。\n\
  \n## 事务及其属性\n\n事务具有四个不同的属性：\n\n- **原子性** – 我们需要保证所有步骤都完成，或没有任何步骤完成\n- **一致性** –\
  \ 这是确保我们的数据保持一致状态的概念\n- **隔离性** – 当我们从银行取钱时，如果我们的业务伙伴同时取钱，导致我们出现负余额，那就很糟糕了\n- **持久性**\
  \ – 我们期望已完成的事务能够在硬件故障后存活\n\n一致性和持久性往往与资源相关，例如数据库及其运行的服务器，通常不会影响我们编写代码的方式。然而，原子性和隔离性通常由开发人员代码处理。\n\
  \n为了保证原子性，我们必须启动一个事务，然后提交或回滚。在本章中，我们将探讨 Spring Python 如何使定义原子事务变得容易。\n\nPython 的\
  \ DB API 规范 (http://www.python.org/dev/peps/pep-0249/) 未定义隔离级别。相反，每个厂商都以不同的方式实现这一点。为了更改隔离级别，我们必须调查正在使用的数据库引擎，然后访问连接或工厂提供的游标，以便将此设置从厂商默认值更改。\n\
  \n事务可以本地支持，也可以分布在多个数据库中。本地事务通常涉及单个数据库模式。为了扩展到其他系统，Python 规范利用了“两阶段提交”机制。\n\n> 在撰写本文时，Spring\
  \ Python 仅支持本地事务，但对未来扩展其功能持开放态度。\n\n事务定义中的另一个因素是 **传播**。当我们有多个操作定义事务时，将它们以正确的方式组合在一起非常重要。这涉及处理在已有事务正在进行时遇到新事务的情况。我们将在本章后面更详细地讨论这个问题。\n\
  \n## 正确处理事务很困难\n\n上面显示的事务模式非常简单且不完整。\n可能出现许多问题，需要更详细的说明。\n\n- 最重要的问题是底层数据库引擎是否支持事务，以及是否已正确配置以避免自动提交。如果没有适当设置，代码将无法按预期运行。自动提交通过在执行时提交每个\
  \ SQL 语句而不是等待 `conn.commit()` 来工作，因此不提供回滚的选项。\n- 如果在调用 `transfer` 时已经有一个事务正在进行，可能需要特殊处理。在我们的示例中，我们突然提交之前的工作，然后使用初始的\
  \ `commit` 开始一个新事务。如果事务正在进行中，这可能不是正确的步骤。考虑到我们没有任何周围的业务上下文，很难判断。\n- 异常处理并不是需要处理的唯一回滚场景。虽然我们的\
  \ transfer 没有任何替代返回路径，但更复杂的业务逻辑很容易编写守卫子句和其他返回语句，从而绕过 `commit` 和 `rollback`。使事务挂起且未提交到数据库将是非常粗糙且有风险的。\n\
  \n结果是，上面显示并用于我们简单示例的模式不足以处理最简单的风险。必须编写更复杂的模式。鉴于它必须为应用程序中的每个事务点重复，这使得我们的完整性问题更难解决。\n\
  \n执行事务时还有一个效率的副作用。因为使用相同的连接来执行事务，所以避免了打开和关闭连接的成本。\n\n## 使用 @transactional 简化\n\n\
  Spring Python 使用其 `TransactionTemplate` 解决了这些问题。这个实用类使得用事务功能包装业务方法变得容易，从而解决了前面列出所有问题。Spring\
  \ Python 使其易于使用其 `@transactional` 装饰器将现有的业务函数与 `TransactionTemplate` 包装起来。\n\n-\
  \ 首先，让我们将我们的简单 `transfer` 函数放入 `Bank` 类中。\n\n```\nfrom springpython.database.core\
  \ import *\nfrom springpython.database.factory import *\n```\n\n```\nclass Bank(object):\n\
  \    def __init__(self, connectionFactory):\n        self.factory = connectionFactory\n\
  \        self.dt = DatabaseTemplate(self.factory)\n\n    def transfer(self, transfer_amt,\
  \ source_act, target_act):\n        self.dt.execute(\"\"\"\n            update ACCOUNT\n\
  \            set BALANCE = BALANCE - %s\n            where ACCOUNT_NUM = %s\"\"\"\
  ,\n            (transfer_amt, source_act))\n        self.dt.execute(\"\"\"\n   \
  \         update ACCOUNT\n            set BALANCE = BALANCE + %s\n            where\
  \ ACCOUNT_NUM = %s\"\"\",\n            (transfer_amt, target_act))\n```\n\n在这种情况下，我们已剔除所有手工编写的事务代码。取而代之的是定义一个\
  \ `transfer` 操作的简单、简洁的业务逻辑。\n\n请注意，此版本的 Bank 应用尚未 *NOT* 安全。\n\n步骤可通过以下时序图轻松展示：\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_115_0.png)\n\n2. 现在让我们使用 Spring Python\
  \ 的 @transactional 装饰器为 transfer 方法添加事务保护。\n\n```python\nfrom springpython.database.core\
  \ import *\nfrom springpython.database.factory import *\nfrom springpython.database.transaction\
  \ import *\n\nclass Bank(object):\n    def __init__(self, connectionFactory):\n\
  \        self.factory = connectionFactory\n        self.dt = DatabaseTemplate(self.factory)\n\
  \n    @transactional\n    def transfer(self, transfer_amt, source_act, target_act):\n\
  \        self.dt.execute(\"\"\"\n            update ACCOUNT\n            set BALANCE\
  \ = BALANCE - %s\n            where ACCOUNT_NUM = %s\"\"\",\n            (transfer_amt,\
  \ source_act))\n        self.dt.execute(\"\"\"\n            update ACCOUNT\n   \
  \         set BALANCE = BALANCE + %s\n            where ACCOUNT_NUM = %s\"\"\",\n\
  \            (transfer_amt, target_act))\n```\n\n@transactional 是一个装饰器，它使用一个隐藏的\
  \ TransactionTemplate 实例在非常健壮的事务模式版本中执行我们的 transfer 函数。我们的交互在以下图表中展示得更好。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_116_0.png)\n\
  \n- 因为 `@transactional` 包裹了我们的 `transfer` 函数，当用户调用 `transfer` 时，他们首先命中的是装饰器\n- `@transactional`\
  \ 将请求的方法调用的所有上下文传递给其私有的 `TransactionTemplate` 实例\n- `TransactionTemplate` 开始一个事务\n\
  - `TransactionTemplate` 然后调用原始的 `Bank transfer` 函数\n- `Bank` 执行其业务，完全不知道它在事务内部\n\
  - 完成后，`Bank` 将控制权交还给 `TransactionTemplate`，后者发出一个 `commit`\n- `TransactionTemplate`\
  \ 将控制权交还给 `@transactional`，最终交还给调用者\n\n> 此配置完全将事务逻辑与我们的 transfer 操作解耦。\n\n- 由于 `TransactionTemplate`\
  \ 是 `transfer` 的调用者，它可以轻松处理任意数量的 return 语句。如果在 `transfer` 内部任何位置引发异常，`TransactionTemplate`\
  \ 将执行 `rollback` 而不是 `commit`。\n\n有了这种清晰的关注点分离，我们可以在业务代码上工作，而无需担心事务的正确性。\n\n## 关于\
  \ TransactionTemplate 的更多内容\n\n我们第一个事务模式版本简单且天真。随后我们检查了该模式的问题列表。`TransactionTemplate`\
  \ 具有更复杂的模式，可处理这些额外情况：\n\n- 它通过捕获任何抛出的异常来处理简单情况，发出回滚，然后重新抛出异常\n- 它通过捕获方法的返回值来处理所有\
  \ return 语句，发出必要的提交，然后最终返回结果\n- `@transactional` 默认编码为：如果当前没有进行中的事务则启动新事务，如果已存在事务则加入该事务。我们将在本章后面查看其他事务选项\n\
  \n在我们的 `transfer` 代码中还存在另一个完整性缺口。它位于事务模式和业务逻辑之间。你能发现它吗？\n\n没有检查来确保我们甚至有 $10,000\
  \ 可转账！此外，也没有安全检查来确保我们拥有这两个账户中的任一个。我们将在填补事务细节时稍后解决这一缺陷。\n\n我们还没完成。为了让 @transactional\
  \ 发挥作用，我们需要通过一个 AutoTransactionalObject 将其与 Transaction Manager 链接。Transaction Manager\
  \ 为 @transactional 提供进入数据库的句柄以发出必要的提交和回滚。它还跟踪现有事务的上下文并在何时启动新事务时做出适当决策。\n\n1. 为了注入所有内容，让我们定义一个纯\
  \ Python IoC 容器，将 ConnectionFactoryTransactionManager 通过 AutoTransactionalObject\
  \ 链接到 @transaction。\n\n```python\nfrom springpython.database.transaction import\
  \ *\nclass BankAppConfig(PythonConfig):\n    def __init__(self, factory):\n    \
  \    PythonConfig.__init__(self)\n        self.factory = factory\n\n    @Object\n\
  \    def transactionalObject(self):\n        return AutoTransactionalObject(self.tx_mgr())\n\
  \n    @Object\n    def tx_mgr(self):\n        return ConnectionFactoryTransactionManager(self.factory)\n\
  \n    @Object\n    def bank(self):\n        return Bank(self.factory)\n```\n\n-\
  \ tx_mgr 定义了我们的 Transaction Manager，它使用注入的工厂来执行 SQL 事务 API。这与 DatabaseTemplate 使用的工厂类型相同。tx_mgr\
  \ 跟踪事务开始和结束的时间，为 TransactionTemplate 和 @transactional 提供必要的服务。\n- transactionalObject\
  \ 定义了 AutoTransactionalObject 的一个实例，这是一个 IoC 后处理器。它的工作是找到所有 @transactional 的实例并将其与\
  \ tx_mgr 链接。这赋予了 @transactional 通过 SQL 事务确保数据完整性的能力。\n- bank 类是我们的业务类。\n\n2. 现在，让我们编写一些启动代码来执行转账。\n\
  \n```python\nif __name__ == \"__main__\":\n    from springpython.context import\
  \ ApplicationContext\n    ctx = ApplicationContext(BankAppConfig(\n        Sqlite3ConnectionFactory(\"\
  /path/to/sqlite3db\")))\n    service = ctx.get_object(\"bank\")\n    service.transfer(10000.0,\
  \ \"SAVINGS\", \"CHECKING\")\n```\n\n## Spring 三角形——可移植服务抽象\n\n我们在书中前面看到过此图，作为 Spring\
  \ Python 背后关键原则的说明。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_119_0.png)\n\nTransactionTemplate\
  \ 代表一个可移植服务抽象。\n\n- 它是可移植的，因为它使用 Python 的标准化 API 进行 SQL 事务，不将我们绑定到任何数据库厂商或自定义数据库连接库\n\
  - 它提供了有用的服务，让我们可以轻松地用复杂而强大的事务模式包装方法\n- 它提供了一个编写事务代码的良好抽象，而无需直接处理 SQL 事务 API\n\n\
  ## 编程式事务\n\n我们的银行示例展示了如何使用 Spring Python 的 `@transactional` 装饰某些业务逻辑以使操作具有事务性。在整个示例中，我们反复提到了\
  \ `TransactionTemplate`。\n\n在本节中，我们将直接使用 `TransactionTemplate` 而不是 `@transactional`。我们还将探讨如何有无\
  \ IoC 配置地执行此操作。\n\n### 使用 IoC 容器配置\n\n1. 首先，让我们重写 Bank，用 `TransactionTemplate` 替换\
  \ `@transactional`。\n\n```python\nclass Bank(object):\n    def __init__(self, connectionFactory):\n\
  \        self.factory = connectionFactory\n        self.dt = DatabaseTemplate(self.factory)\n\
  \        self.tx_mgr = ConnectionFactoryTransactionManager(self.factory)\n     \
  \   self.tx_template = TransactionTemplate(self.tx_mgr)\n\n    def transfer(self,\
  \ transfer_amt, source_act, target_act):\n        class TxDefinition(TransactionCallbackWithoutResult):\n\
  \            def doInTransactionWithoutResult(self, status):\n                self.dt.execute(\"\
  \"\"\n                update ACCOUNT\n                set BALANCE = BALANCE - %s\n\
  \                where ACCOUNT_NUM = %s\"\"\",\n                (transfer_amt, source_act))\n\
  \                self.dt.execute(\"\"\"\n                update ACCOUNT\n      \
  \          set BALANCE = BALANCE + %s\n                where ACCOUNT_NUM = %s\"\"\
  \",\n                (transfer_amt, target_act))\n        self.tx_template.execute(TxDefinition())\n\
  ```\n\n此版本的 Bank 显示了另外两个属性：`tx_mgr` 和 `tx_template`。这些可以注入到我们的类中，但我们选择只注入连接工厂。\n\
  \n\n\n在 `transfer` 函数内部，我们定义了类 `TxDefinition`。然后在调用 `tx_template.execute()` 时实例化它。\n\
  \n- 此内部类定义了一个方法：\n  `doInTransactionWithoutResult`，其中包含我们的业务逻辑。\n- 为避免 `transfer`\
  \ 中传入的 `self` 与 `TxDefinition` 中传入的 `self` 混淆，`doInTransactionWithoutResult` 将其第一个参数命名为\
  \ `s`。\n- 因为 `transfer` 不期望返回任何内容，所以它使用 `TransactionCallbackWithoutResult` 作为基类。对于返回值，请改用\
  \ `TransactionCallback`/`doInTransaction`。\n\n2. 接下来，让我们调整 IoC 配置以处理这些更改。\n\n```\n\
  from springpython.database.transaction import *\nclass BankAppConfig(PythonConfig):\n\
  \    def __init__(self, factory):\n        PythonConfig.__init__(self)\n       \
  \ self.factory = factory\n\n    @Object\n    def bank(self):\n        return Bank(self.factory)\n\
  ```\n\n3. 这不应影响用于运行我们的应用程序并执行相同转账的代码。\n\n```\nif __name__ == \"__main__\":\n   \
  \ from springpython.context import ApplicationContext\n    ctx = ApplicationContext(BankAppConfig(\n\
  \        Sqlite3ConnectionFactory(\"/path/to/sqlite3db\")))\n    service = ctx.get_object(\"\
  bank\")\n    service.transfer(10000.0, \"SAVINGS\", \"CHECKING\")\n```\n\n## 不使用\
  \ IoC 容器进行配置\n\n在这种情况下，我们的 IoC 配置相当简单。我们可以在没有它的情况下编写应用程序。只需记住：IoC 在测试、模拟以及能够替换关键对象等方面提供了有用的帮助。\n\
  \n我们首先重写启动脚本，使其不需要任何 IoC 容器。\n\n```\nif __name__ == \"__main__\":\n    service =\
  \ Bank(Sqlite3ConnectionFactory(\"/path/to/sqlite3db\"))\n    service.transfer(10000.0,\
  \ \"SAVINGS\", \"CHECKING\")\n```\n\n因为我们的 Bank 是使用简单的构造函数注入编写的，所以为了在没有容器的情况下运行它，无需对其进行更改。由于我们以编程式的方式使用\
  \ TransactionTemplate，因此没有使用 IoC 容器的要求。这为开发人员提供了一个机会，可以纯粹为了事务功能而评估 Spring Python，而无需同时尝试\
  \ IoC 容器。\n\n但重要的是要记住，本书中已经展示了 IoC 价值的多个示例，还有更多即将到来。\n\n## @transactional 与 编程式\n\
  \nSpring 的方式包括为开发人员提供选择。为了选择合适的方法，以下是一些优缺点：\n\n- @transactional\n  - 优点：\n    -\
  \ 使用单行定义事务。\n    - 清晰、简洁、易读。\n  - 缺点：\n    - 需要 IoC 来连接 AutoTransactionalObject。\n\
  \    - 需要编辑现有代码。\n\n- programmatic\n  - 优点：\n    - 明确显示事务行为发生的位置。\n    - 不需要 IoC。\n\
  \  - 缺点：\n    - 重新引入代码纠缠。\n    - 需要编辑现有代码。\n\n如果这两种解决方案中的任何一种的缺点都是不可接受的，还有第三种选择：从\
  \ IoC 容器内部声明事务。这允许在不产生代码纠缠且无需编辑已有代码的情况下轻松地用事务包装业务代码。我们将在本章后面演示这一点。但首先让我们来看一下添加新函数。\n\
  \n## 使新函数与现有事务良好协作\n\n到目前为止，我们已经成功构建了一个银行，它只做一件事：转账。如同任何软件项目一样，我们通常需要扩展功能。随着我们对\
  \ Bank 进行修改，我们希望在不危及现有事务的情况下添加新事务。Spring Python 的事务管理使这变得非常简单。\n\n在本节中，我们将回到我们的\
  \ @transactional Bank 并添加一些新功能。\n\n1. 让我们从 transfer 函数中提取 withdraw 函数和 deposit 函数。\n\
  \n```\nclass Bank(object):\n    def __init__(self, connectionFactory):\n       \
  \ self.factory = connectionFactory\n        self.dt = DatabaseTemplate(self.factory)\n\
  \n    def withdraw(self, amt, act):\n        self.dt.execute(\"\"\"\n          \
  \  update ACCOUNT\n            set BALANCE = BALANCE - %s\n            where ACCOUNT_NUM\
  \ = %s\"\"\",\n            (amt, act))\n\n    def deposit(self, amt, act):\n   \
  \     self.dt.execute(\"\"\"\n            update ACCOUNT\n            set BALANCE\
  \ = BALANCE + %s\n            where ACCOUNT_NUM = %s\"\"\",\n            (amt, act))\n\
  \n    @transactional\n    def transfer(self, transfer_amt, source_act, target_act):\n\
  \        self.withdraw(transfer_amt, source_act)\n        self.deposit(transfer_amt,\
  \ target_act)\n```\n\n通过将两个 SQL 语句移入单独的函数中，我们已将 transfer 很好地定义为先 withdraw 后 deposit。我们现在准备将这两个新函数提供给我们的客户。你注意到这里有什么问题吗？这些函数本身在事务方面安全吗？如果另一个银行操作尝试重用这些原语会怎样？\n\
  \n2. 使用 @transactional 保护 withdraw 和 deposit 方法。\n\n```\nclass Bank(object):\n \
  \   def __init__(self, connectionFactory):\n        self.factory = connectionFactory\n\
  \        self.dt = DatabaseTemplate(self.factory)\n\n    @transactional\n    def\
  \ withdraw(self, amt, act):\n        self.dt.execute(\"\"\"\n            update\
  \ ACCOUNT\n            set BALANCE = BALANCE - %s\n            where ACCOUNT_NUM\
  \ = %s\"\"\",\n            (amt, act))\n\n    @transactional\n    def deposit(self,\
  \ amt, act):\n        self.dt.execute(\"\"\"\n            update ACCOUNT\n     \
  \       set BALANCE = BALANCE + %s\n            where ACCOUNT_NUM = %s\"\"\",\n\
  \            (amt, act))\n\n    @transactional\n    def transfer(self, transfer_amt,\
  \ source_act, target_act):\n        self.withdraw(transfer_amt, source_act)\n  \
  \      self.deposit(transfer_amt, target_act)\n```\n\n我们代码中唯一的差异就是用 @transactional\
  \ 标记 withdraw 和 deposit。\n\n3. 现在让我们通过在执行 SQL 之前和之后进行一些检查，为我们的 Bank 增加一层完整性。\n\n\
  ```\nclass Bank(object):\n    def __init__(self, connectionFactory):\n        self.factory\
  \ = connectionFactory\n        self.dt = DatabaseTemplate(self.factory)\n\n    @transactional([\"\
  PROPAGATION_SUPPORTS\"])\n    def balance(self, act):\n        return self.dt.queryForObject(\"\
  \"\"\n            SELECT BALANCE\n            FROM ACCOUNT\n            WHERE ACCOUNT_NUM\
  \ = ?\"\"\",\n            (act,), types.FloatType)\n\n    @transactional\n    def\
  \ withdraw(self, amt, act):\n        if (self.balance(act) > amt):\n           \
  \ rows = self.dt.execute(\"\"\"\n                update ACCOUNT\n              \
  \  set BALANCE = BALANCE - %s\n                where ACCOUNT_NUM = %s\"\"\",\n \
  \               (amt, act))\n            if (rows == 0):\n                raise\
  \ Exception(\"Account %s does not exist.\" % act)\n            else:\n         \
  \       raise Exception(\"Account %s has insufficient funds.\" % act)\n\n    @transactional\n\
  \    def deposit(self, amt, act):\n        rows = self.dt.execute(\"\"\"\n     \
  \       update ACCOUNT\n            set BALANCE = BALANCE + %s\n            where\
  \ ACCOUNT_NUM = %s\"\"\",\n            (amt, act))\n        if (rows == 0):\n  \
  \          raise Exception(\"Account %s does not exist.\" % act)\n\n    @transactional\n\
  \    def transfer(self, transfer_amt, source_act, target_act):\n        self.withdraw(transfer_amt,\
  \ source_act)\n        self.deposit(transfer_amt, target_act)\n```\n\n我们做了一些更改，使我们的应用程序开始看起来像一个真正的银行。如下所示：\n\
  \n- 我们创建了一个 `balance` 函数，允许我们查询账户的余额\n- `withdraw` 函数现在会检查余额，以确保有足够的金额可供提取\n- `withdraw`\
  \ 函数验证是否更新了一行数据，以确认被提取的账户是真实的\n- `deposit` 函数验证是否更新了一行数据，以确认被存款的账户是真实的\n\n## Spring\
  \ Python 如何让我们定义事务的 ACID 属性\n\n如前所述，事务的 ACID 属性如下：\n\n- **Atomicity** – 我们需要保证所有步骤都完成，或者没有任何步骤完成。\n\
  - **Consistent** – 这是确保我们的数据保持一致状态的概念。\n\n\n\n- **Isolated** – 当我们从银行取款时，如果业务伙伴同时取款，导致我们最终出现负余额，那就很糟糕了。\n\
  - **Durable** – 我们期望已完成的事务能够在硬件故障后仍然存活\n\n关于原子性，我们已经通过使用 @transactional 和 TransactionTemplate\
  \ 来练习定义事务的开始和结束点。\n\nSpring Python 支持传播。之前我们提到，@transactional 的默认策略是如果不存在则启动新事务，如果已有事务正在进行则加入现有事务。Spring\
  \ Python 方便地让我们将安全的原子操作 withdraw 和 deposit 组合成 transfer，而完全无需与 SQL 事务 API 交互。\n\n\
  我们还创建了另一个函数 balance，用于查询账户的当前余额。由于 balance 不执行任何更新，单独运行时不需要事务。然而，当它被现有事务调用时，我们希望它像事务的一部分一样加入进来。这是通过为\
  \ @transactional 提供传播覆盖来实现的：\n\n```\n@transactional([\"PROPAGATION_SUPPORTS\"])\n\
  def balance(self, act):\n    return self.dt.queryForObject(\"\"\"\n        SELECT\
  \ BALANCE\n        FROM ACCOUNT\n        WHERE ACCOUNT_NUM = ?\"\"\",\n        (act,),\
  \ types.FloatType)\n```\n\n@transactional 会扫描事务定义列表。目前，Spring Python 支持以下定义：\n\n\
  | 属性 | 描述 |\n|---|---|\n| PROPAGATION_REQUIRED | 一个事务是必需的。如果存在当前事务，则加入它。否则，启动一个新事务。这是\
  \ @transactional 的默认值。 |\n| PROPAGATION_SUPPORTS | 一个事务不是必需的。此代码可在事务内或事务外运行。 |\n\
  | PROPAGATION_MANDATORY | 一个事务是必需的。如果存在当前事务，则加入它。否则，抛出异常。 |\n| PROPAGATION_NEVER\
  \ | 不允许事务。如果存在当前事务，则抛出异常。否则，运行代码。 |\n\nSpring Python 提供了非常有用的事务上下文管理、事务 API 处理，并允许我们清晰地划分事务。\n\
  \n随着 Python 数据库规范中关于隔离等事物的更好定义被添加，Spring Python 将添加更多选项来支持它。这将提高我们清晰声明用于包装代码所需的确切事务类型的能力。\n\
  \n## 将事务应用于非事务代码\n\nSpring Python 的一个重要方面是其非侵入性。这在介绍面向方面编程的章节中已详细演示。Spring Python\
  \ 提供了一个方便的非侵入式方法拦截器，允许对现有代码进行划分。\n\n这解决了前面提到的问题，即既不接受编辑现有源代码，也不接受将业务逻辑与事务管理纠缠在一起。\n\
  \n- 1. 让我们从一个没有事务划分的 Bank 类的替代版本开始。\n\n```python\nclass Bank(object):\n    def __init__(self,\
  \ connectionFactory):\n        self.factory = connectionFactory\n        self.dt\
  \ = DatabaseTemplate(self.factory)\n\n    def balance(self, act):\n        return\
  \ self.dt.queryForObject(\"\"\"\n            SELECT BALANCE\n            FROM ACCOUNT\n\
  \            WHERE ACCOUNT_NUM = ?\"\"\",\n            (act,), types.FloatType)\n\
  \n    def withdraw(self, amt, act):\n        if (self.balance(act) > amt):\n   \
  \         rows = self.dt.execute(\"\"\"\n                update ACCOUNT\n      \
  \          set BALANCE = BALANCE - %s\n                where ACCOUNT_NUM = %s\"\"\
  \",\n                (amt, act))\n            if (rows == 0):\n                raise\
  \ Exception(\"Account %s does not exist.\" % act)\n        else:\n            raise\
  \ Exception(\"Account %s has insufficient funds.\" % act)\n\n    def deposit(self,\
  \ amt, act):\n        rows = self.dt.execute(\"\"\"\n            update ACCOUNT\n\
  \            set BALANCE = BALANCE + %s\n            where ACCOUNT_NUM = %s\"\"\"\
  ,\n            (amt, act))\n        if (rows == 0):\n            raise Exception(\"\
  Account %s does not exist.\" % act)\n\n    def transfer(self, transfer_amt, source_act,\
  \ target_act):\n        self.withdraw(transfer_amt, source_act)\n        self.deposit(transfer_amt,\
  \ target_act)\n```\n\n这个 Bank 类与之前的类相同，只是没有 @transactional 装饰器。\n\n- 2. 让我们定义一个具有等效事务划分点的应用程序上下文。\n\
  \n```\nclass BankAppConfig(PythonConfig):\n    def __init__(self, factory):\n  \
  \      PythonConfig.__init__(self)\n        self.factory = factory\n\n    @Object\n\
  \    def bank_target(self):\n        return Bank(self.factory)\n\n    @Object\n\
  \    def tx_mgr(self):\n        return ConnectionFactoryTransactionManager(self.factory)\n\
  \n    @Object\n    def bank(self):\n        tx_attrs = []\n        tx_attrs.append((\"\
  .*transfer\", [\"PROPAGATION_REQUIRED\"]))\n        tx_attrs.append((\".*withdraw\"\
  , [\"PROPAGATION_REQUIRED\"]))\n        tx_attrs.append((\".*deposit\", [\"PROPAGATION_REQUIRED\"\
  ]))\n        tx_attrs.append((\".*balance\", [\"PROPAGATION_SUPPORTS\"]))\n    \
  \    return TransactionProxyFactoryObject(self.tx_mgr(),\n            self.bank_target(),\n\
  \            tx_attrs)\n```\n\n使用此替代配置，我们使用 `TransactionProxyFactoryObject`。这是一个开箱即用的\
  \ AOP 拦截器，Spring Python 提供它来自动将某些函数包装为 `TransactionTemplate`。它需要一个事务管理器以及目标对象，即我们的\
  \ `Bank`。它还需要一个元组列表，每个元组定义用于方法匹配的正则表达式以及事务属性列表，就像我们在本章前面将属性插入到 `@transactional`\
  \ 中一样。\n\n正确的选择是：`@transactional` 还是 `TransactionProxyFactoryObject`？\n\n- `@transactional`\
  \ 清晰、简洁且易于阅读。它的最大缺点是需要编辑现有代码。如果我们拥有代码，这不应该是个问题。\n- 如果我们试图将事务包装在我们不直接控制的第三方库周围，`TransactionProxyFactoryObject`\
  \ 是最佳选择。\n\n## 测试你的事务\n\n事务与数据库密不可分。尝试对其进行模拟或存根需要极大的努力，可能不值得。这是我通常同意针对实际数据库进行测试的领域之一。\n\
  \n可以使用轻量级数据库如 `sqlite` 来进行此工作，但如果这不是生产的目标平台，则可能存在风险。事实上，最佳的测试工作是使用与生产相同的数据库引擎版本正确设置测试床。重要的是，很容易针对像\
  \ `sqlite` 这样的小东西创建轻量级测试。这可以向开发人员确认事情按预期工作。更广泛的集成测试可以用生产级测试床完成。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_129_0.png)\n\
  \n> 轻松交换不同的数据库配置是使用 Spring Python 的主要优势之一。\n\n## 总结\n\n在本章中，我们利用了 Spring Python\
  \ 方便的事务功能，将一些简单的银行 SQL 转变为一个有弹性的应用程序。能够在易于阅读的 `@transactional` 装饰器和基于 AOP 的 `TransactionProxyFactoryObject`\
  \ 之间进行选择，为我们提供了灵活的选择。\n\n在本章中我们学到：\n\n- 经典的事务问题使得手工编写事务变得困难\n- Spring Python 让我们可以轻松地使用\
  \ `@transactional` 装饰器向银行应用程序添加事务\n- 我们可以有或没有 IoC 容器以编程方式轻松编写事务，从而获得最大的选择\n- 借助\
  \ AOP 的强大功能，我们可以在不编辑源代码的情况下，非侵入式地将事务混合到非事务代码中\n\n在下一章中，我们将探讨使用 Spring Python 安全模块保护\
  \ Web 应用程序的方法。\n\n\n"
- "# 6 使用 Spring Python 保护你的应用程序\n\n随着过去十年的网络兴起，许多公司采用了电子商务解决方案来支持其商业模式。零售、销售、银行、金融和其他行业已将网络作为产生收入的关键手段。这引发了一场安全危机，因为早期的\
  \ Web 应用程序几乎没有安全措施，而且系统被利用的方式层出不穷。这不仅仅涉及市场的某个小角落，而是可能危及市场的大部分。难怪公司会聘请安全顾问来想出保护已建成的电子商务网站的方法。\n\
  \n软件开发团队开始意识到安全需要在应用程序中尽早而不是晚些时候编码。然而，竞争性的截止日期以及更早而不是更晚地将产品推向市场，可能会导致安全需求被推到队列的后面。许多进入市场的\
  \ Web 应用程序的安全性更像是事后才考虑的。这部分是由于编写有效的安全协议很困难。**Acegi 安全**，一个基于 Spring Framework 的\
  \ Java 框架，最初于 2003 年发布。其可插拔架构和非侵入性特性在 Java 世界引起了轰动。通过提供对多种安全协议的支持，包括数据库、LDAP、OpenID、X.509、**中央认证服务\
  \ (CAS)**、Kerberos、**Java 认证和授权服务 (JAAS)**，以及许多其他协议，它已在许多行业以及私营和公共部门得到广泛使用。\n\n\
  Spring Python 对这一强大架构的 Pythonic 实现为 Python 社区提供了同样简单而有效的机制来保护各种类型的应用程序。Spring Python\
  \ Security 目前支持 Web 应用程序安全。未来计划支持方法级安全，就像 Spring Security 一样。\n\n在本章中，我们将学习：\n-\
  \ 软件开发人员需要处理的安全问题以及在有效编码安全方面面临的挑战\n- 有效安全解决方案的要求，以及 Spring Python Security 满足这些要求的能力\n\
  - 使用简单解决方案包装未受保护的 Web 应用程序，通过委托给安全处理器进行干净的保护\n- 用户身份验证的概念，以及确定他们被授权执行的操作\n- 测试我们应用程序的安全性\n\
  - 配置基于 SQL 的安全系统，包括适应自定义用户/角色模式\n- 配置基于 LDAP 的安全系统\n- 使你的应用程序支持多个用户社区或在没有停机的情况下从一个安全系统迁移到另一个安全系统\n\
  - 为 Spring Python Security 即开即用不支持的系统编写我们自己的安全扩展\n\n## 手工编码安全的问题\n\n保护应用程序很困难。当使用简单策略手工编码时，安全性变得非常侵入性。为了使应用程序能够真正访问安全设置，必须具备以下条件：\n\
  - 基于原始规则保护 URL 是一个开始，但随着业务规则和需求随时间修订和更新，很少足够。\n- 依赖容器安全往往缺乏灵活性且容易锁定。例如，使用 Apache\
  \ Web 服务器 `.htaccess` 文件可能适用于简单情况。但复杂规则很难正确实现，难以自动测试，也会阻碍迁移到另一种类型的容器。使安全成为应用程序的一部分，而不依赖于另一个容器，可以使应用程序摆脱容器锁定。\n\
  - 为了支持特殊情况，代码中的任何方法都必须能够查找当前用户是谁，以及他或她拥有哪些权限。通常这只在少数地方需要，但更改所有必要的 API 以将此信息从登录屏幕传递到代码逻辑可能会对如此孤立的需求产生过大的影响。\n\
  - 安全代码具有重复的模式。开发人员有时会将此行为抽象到基类中，子类处理业务逻辑。这似乎支持 **DRY（不要重复自己）** 原则，但它违反了 OOP 的 **\"\
  is-a\"** 概念。必须认识到安全是一种横切行为，与业务逻辑独立且正交，必须使用面向方面的概念来解决。\n- 手工编码时，解决方案通常硬编码到应用程序中。从简单的用户名/密码管理系统升级到更复杂的系统，如\
  \ OpenID、LDAP 或双因素认证系统，由于更改的连锁反应可能变得不可能。这种类型的切换在将用户从一个安全解决方案迁移到另一个，或在支持多个用户社区时经常需要。大多数生产系统宁愿保持现状，也不愿花钱重写应用程序的安全层。\n\
  \n这些问题阐明了实现可靠安全解决方案所需的内容：\n- 安全解决方案必须与类层次结构正交。\n- 凭证数据和其他安全 API 必须能够非侵入性地使用，以避免要求应用程序重写现有\
  \ API。\n- 应用程序对安全的使用必须与实际的安全资源解耦。例如，如果系统使用 LDAP 存储用户名和密码信息，应用程序就不必进行 LDAP 调用。\n\
  - 必须允许多个安全提供者，以便支持来自不同社区的用户，以及在向用户社区发放新凭证的同时从一个系统过渡到另一个系统的能力。\n- 安全策略必须灵活且易于微调，以便支持即将到来的业务需求。\n\
  - 尽管存在许多标准约定，用户必须能够快速编写自定义安全扩展以支持遗留安全解决方案。\n\nSpring Python Security 模块满足所有这些要求。在本章中，随着我们开发示例\
  \ Web 应用程序然后对其进行保护，我们将指出这些要求是如何得到满足的。\n\n## 忽略安全构建 Web 应用程序\n\n我们需要一个简单的应用程序。对于此示例，我们将使用\
  \ CherryPy (http://cherrypy.org)，一个 Pythonic Web 框架，方便地将 URL 映射到 Python 方法。\n\n\
  > 如果你想了解更多关于 CherryPy 框架的信息，我强烈推荐阅读 *CherryPy 精要*，作者 Sylvain Hellegouarch。\n\n在构建\
  \ Web 应用程序后，我们将回顾人们在保护事物时采取的一些选项。然后，我们将插入 Spring Python Security，展示锁定应用程序是多么容易。\n\
  \n首先，让我们构建一个简单的 Web 应用程序来提供 wiki 页面，并允许我们编辑它们。\n\n```\nimport cherrypy\n\ndef forward(url):\n\
  \    return '<META HTTP-EQUIV=\"Refresh\" CONTENT=\"0; URL=' + url + '\">'\n\nclass\
  \ Springwiki(object):\n    def __init__(self, controller = None):\n        self.controller\
  \ = controller\n\n    @cherrypy.expose\n    def index(self, article=\"Main Page\"\
  ):\n        page = self.controller.getPage(article)\n        return page.html()\n\
  \n    @cherrypy.expose\n    def default(self, article=\"Main Page\"):\n        return\
  \ self.index(article)\n\n    @cherrypy.expose\n    def submit(self, article, wpTextbox=None,\
  \ wpSummary=None):\n        self.controller.updatePage(article, wpTextbox, wpSummary)\n\
  \        return forward(\"/\" + article)\n\n    @cherrypy.expose\n    def edit(self,\
  \ article):\n        page = self.controller.getEditPage(article)\n        return\
  \ page.html()\n```\n\n这个 CherryPy 应用程序很好地将 URL 映射到用 @cherrypy.expose 装饰器标记的 Python\
  \ 方法。HTTP GET/POST 参数被转换为命名参数。方法 index 映射到 Web 路径 /，submit 映射到 /submit，edit 映射到\
  \ /edit。作为 CherryPy 应用程序，我们还没有完成。在填入更多细节后，我们将展示如何将此应用程序托管在 CherryPy Web 容器内。\n\n\
  在这种情况下，我们的应用程序有一个注入的控制器，负责处理对 wiki 的更新以及返回生成发送回浏览器的 HTML 内容的组件。\n\n让我们编写一个简单的控制器来处理这些\
  \ Web 请求。现在，让我们使用一个简单的 Python 字典作为存储信息的位置。稍后，我们可以将其迁移到数据库服务器。\n\n```python\nimport\
  \ time\nfrom model import EditPage\nfrom model import NoPage\nfrom model import\
  \ Page\n\nwiki_db = {\n    \"Main Page\":[\"\"\"\nWelcome to the Spring Python book's\
  \ wiki!\n\"\"\", [(\"Original\", \"Initial entry\", \"13:22, 24 November 2009\"\
  )]]\n}\n\nclass SpringWikiController(object):\n    def exists(self, article):\n\
  \        return article in wiki_db\n\n    def getPage(self, article):\n        if\
  \ self.exists(article):\n            return Page(article=article,\n            \
  \            wikitext=wiki_db[article][0],\n                        controller=self)\n\
  \        else:\n            return NoPage(article=article,\n                   \
  \       controller=self)\n\n    def getEditPage(self, article):\n        if self.exists(article):\n\
  \            return EditPage(article=article,\n                            wikitext=wiki_db[article][0],\n\
  \                            controller=self)\n        else:\n```\n\n\n\n```\nreturn\
  \ EditPage(article=article,\n                wikitext=\"\",\n                controller=self)\n\
  \ndef create_edit_tuple(self, text, summary):\n    return (text,\n            summary,\n\
  \            time.strftime(\"%H:%M:%S %d %b %Y\", time.localtime()))\n\ndef updatePage(self,\
  \ article, wikitext, summary):\n    if self.exists(article):\n        wiki_db[article][1].append(\n\
  \            self.create_edit_tuple(wiki_db[article][0],summary))\n        wiki_db[article][0]\
  \ = wikitext\n    else:\n        wiki_db[article] = [None, None]\n        wiki_db[article][1]\
  \ = [\n            self.create_edit_tuple(wikitext,summary)]\n        wiki_db[article][0]\
  \ = wikitext\n```\n\n存在一个用于检索页面的方法。它会检查文章是否存在。如果不存在，则返回一个专门的页面以支持创建新页面；否则，返回一个包含检索到的\
  \ wiki 文本的普通页面。\n\n存在另一个用于返回编辑页面的方法，用于编辑现有的文章条目。\n\n最后，还有一个用于用新的 wiki 文本来更新当前页面的函数。如果注意一下，在\
  \ wiki 文本更新时，会以元组的形式创建一个条目记录，并存储在文章条目的末尾列表中。\n\n让我们定义一些简单的模型对象以在应用程序中传递。首先，我们需要一个页面的基本表示，包含一些基本的\
  \ wiki 格式规则。\n\n```\nimport re\n\nintrawikiR = re.compile(\"\\[\\[(?P<link>.*?)(\
  \ \\| (?P<desc>.*?))?\\]\\]\")\nexternalLinkR = re.compile(\"\\[(?P<link>.*?)\\\
  s(?P<description>.*)\\]\")\n\nclass Page(object):\n    def __init__(self, article,\
  \ wikitext, controller):\n        self.article = article\n        self.wikitext\
  \ = wikitext\n        self.controller = controller\n\n    def link_substitution(self,\
  \ match):\n        g = match.groupdict()\n```\n```\nif self.controller.exists(g[\"\
  link\"]):\n    str = '<a href=\"' + g[\"link\"] + '\">' \nelse:\n    str = '<a href=\"\
  edit/' + g[\"link\"] + '\">' \n\nif g[\"desc\"]:\n    str += g[\"desc\"]\nelse:\n\
  \    str += g[\"link\"]\n\nstr += \"</a>\"\nreturn str\n\ndef header(self):\n  \
  \  \"\"\"Standard header used for all pages\"\"\"\n    return \"\"\"\n    <html>\n\
  \    <head>\n    <title>Spring Python book demo</title>\n    </head>\n\n    <body>\n\
  \        <h1>\"\"\" + self.article + \"\"\"</h1>\n    \"\"\"\n\ndef footer(self):\n\
  \    \"\"\"Standard footer used for all pages.\"\"\"\n    footer = \"\"\"\n    \
  \    <ul>\n            <li><a href=\"/edit/\"\"\" + self.article + \"\"\"\">Edit</a></li>\n\
  \            </ul>\n            <a href=\"http://springpythonbook.com\">Spring Python\
  \ book</a>\n        </body>\n    \"\"\"\n    return footer\n\ndef wiki_to_html(self):\n\
  \    htmlText = self.wikitext\n    try:\n        htmlText = intrawikiR.sub('<a href=\"\
  \\g<link>\">\\g<desc></a>', htmlText)\n    except:\n```\n```\nhtmlText = intrawikiR.sub('<a\
  \ href=\"\\\\g<link>\">\\\\g<link></a>', htmlText)\n    htmlText = externalLinkR.sub('<a\
  \ href=\"\\\\g<link>\">\\\\g<description></a>', htmlText)\n    return htmlText\n\
  \ndef html(self):\n    results = self.header()\n    results += \"\"\"\n    <!--\
  \ BEGIN main content -->\n    \"\"\"\n    results += self.wiki_to_html()\n    results\
  \ += \"\"\"\n    <!-- END main content -->\n    \"\"\"\n    results += self.footer()\n\
  \    return results\n```\n\nPage 持有文章的标题、与其关联的 wiki 文本以及控制器的句柄。此类中的大部分代码用于支持 html()，该函数用于以\
  \ HTML 格式渲染此页面。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_138_0.png)\n\n> 大多数\
  \ Web 框架鼓励使用模板以避免在应用程序中嵌入 HTML。这有助于将页面上显示的信息与显示格式解耦。由于本章的重点是安全而非干净的模型-视图-控制器（MVC）策略，因此\
  \ HTML 直接嵌入到应用程序中。\n\n我们的 wiki 页面基本上生成三个部分：一个 header、一些转换为 HTML 的 wiki 文本，然后是 footer()。对于我们的示例，wiki\
  \ 文本规则很简单：\n\n- 它支持维基百科的自由链接风格，其中 `[[article to link to]]` 映射到本地 Web 路径 `/article_to_link_to`。你也可以插入一个管道，后跟要显示的备用文本块\
  \ `[[article to link|my alt text]]`。\n- 外部链接 `[http://springpythonbook.com Spring\
  \ Python book site]` 映射到完整 URL，第一个空格后的文本将在页面上显示\n\n虽然实现更多 wiki 格式规则很容易，但我们希望坚持演示\
  \ Web 应用程序的安全性。\n\n接下来我们需要编辑页面的表示。\n\n```\nclass EditPage(Page):\n    def __init__(self,\
  \ article, wikitext, controller):\n        Page.__init__(self, article, wikitext,\
  \ controller)\n\n    def header(self):\n        \"\"\"Standard header used for all\
  \ pages\"\"\"\n        return \"\"\"\n            <html>\n            <head>\n \
  \           <title>Spring Python book demo</title>\n            </head>\n\n    \
  \        <body>\n                <h1>Editing \"\"\" + self.article + \"\"\"</h1>\n\
  \        \"\"\"\n\n    def wiki_to_html(self):\n        htmlText = \"\"\"\n    \
  \        <form method=\"post\"\n                    action=\"/submit?article=\"\"\
  \" + \\\n                    self.article + \"\"\"\" enctype=\"multipart/form-data\"\
  >\n                <textarea name=\"wpTextbox\"\n                    rows='25' cols='80'>\"\
  \"\" + \\\n                    self.wikitext + \"\"\"</textarea>\n             \
  \   <br/>\n                Summary: <input type='text' value=\"\"\n            \
  \        name=\"wpSummary\" maxlength='200' size='60'/>\n                <br/>\n\
  \                <input type='submit' value=\"Save page\"\n                    title=\"\
  Save your changes\"/>\n                <em><a href=\"/\"\"\" + self.article + \"\
  \"\"\" title=\"\"\"\" + \\\n                    self.article + \"\"\"\">Cancel</a></em>\n\
  \            </form>\n        \"\"\"\n        return htmlText\n```\n\nEditPage 本质上是一个具有特殊渲染的\
  \ Page。header() 块在文章名称前插入 Editing。HTML 的主要块显示一个包含 wiki 文本、摘要输入框和保存按钮的表单。\n\n让我们创建最终的对象来建模一个不存在的页面。\n\
  \n```\nclass NoPage(Page):\n    def __init__(self, article, controller):\n     \
  \   Page.__init__(self, article,\n            \"This page does not yet exist.\"\
  , controller)\n```\n\nNoPage 是一个带有硬编码 wiki 文本的 Page。它继承了与 Page 相同的格式规则，并且还具有编辑按钮，因此用户可以用真实页面替换不存在的页面。\n\
  \n让我们创建一个纯 Python 应用程序上下文来连接这些组件。\n\n```\nimport controller\nimport view\nfrom springpython.config\
  \ import PythonConfig\nfrom springpython.config import Object\n\nclass SpringWikiAppContext(PythonConfig):\n\
  \    def __init__(self):\n        super(SpringWikiAppContext, self).__init__()\n\
  \n    @Object\n    def view(self):\n        return view.Springwiki(self.controller())\n\
  \n    @Object\n    def controller(self):\n        return controller.SpringWikiController()\n\
  ```\n\n在所有部分都编写完成后，让我们编写一个 CherryPy 服务器应用程序来托管我们的 Web 应用程序。\n\n```\nimport cherrypy\n\
  import os\nimport noxml\nfrom springpython.context import ApplicationContext\n\n\
  if __name__ == '__main__':\n    cherrypy.config.update({'server.socket_port': 8003})\n\
  \n    applicationContext = ApplicationContext(noxml.SpringWikiAppContext())\n  \
  \  cherrypy.tree.mount(\n        applicationContext.get_object(\"view\"),\n    \
  \    '/',\n        config=None)\n\n    cherrypy.engine.start()\n    cherrypy.engine.block()\n\
  ```\n\n假设我们的控制器代码在 `controller.py` 中，视图代码在 `view.py` 中，应用程序上下文在 `noxml.py` 中，我们应该能够启动我们的\
  \ CherryPy 应用程序。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_141_0.png)\n\nCherryPy\
  \ 运行自己的 Web 服务器，在本例中我们将其配置为在端口 `8003` 上运行。然后它创建我们应用程序上下文的一个实例。接下来，它获取 `view` 对象，并将其与\
  \ Web 路径 `/` 挂载。最后，它启动 CherryPy 引擎并阻塞以处理任何 Web 请求。打开浏览器并指向 http://localhost:8003，你将看到结果。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_141_1.png)\n\n\n\n\n## 从一万英尺高度审视我们的 Web\
  \ 应用\n\n下图展示了我们 Web 应用的高层视图，即用户查找一篇文章，点击编辑按钮，进行修改，然后提交更新。通过点击保存按钮，新的 Wiki 文本会被发布到\
  \ Spring Wiki。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_142_0.png)\n\n在我们的示例应用中，我们实现了一个简化的数据库：一个\
  \ Python 字典。然而，它可以很容易地被托管在独立服务器上的关系型数据库取代。概念相同：保存用户提交的更改。\n\n如果我们从任何人都可以阅读和编辑任何文章的前提开始开发此应用，该方案是可行的。它简单易懂，而且可能唯一需要的安全措施就是防火墙来保护服务器免受外部攻击。\n\
  \n## 处理新的安全需求\n\n我们毫无疑问地了解到新的需求总是在不断出现，我们必须做好快速实施的准备。我们通过实现核心功能开始了应用的开发。现在我们需要支持多用户，并需要控制谁可以编辑哪些页面。\n\
  \n## 身份认证确认“你是谁”\n\n保护应用的第一步是用户身份认证。这用于识别用户是谁，通常通过用户提供用户名和密码来完成。下图展示了我们应用设计的更新。它包含前一图中没有的新组件：一个\
  \ Spring Python Security 代理，它与第三方安全资源一起监管每个 Web 请求。在允许用户实际访问我们的 Wiki 应用或数据库之前，我们的安全代理会检查用户是否已通过身份认证。如果没有，Spring\
  \ Python 会将用户重定向到登录页面。在图中，我们从用户提交新的 Wiki 文本的点开始。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_143_0.png)\n\
  \n安全代理满足了我们之前的一个要求：安全性的应用必须与应用本身解耦。该代理是一段独立的代码，负责管理用户与我们应用之间的安全。它的配置不是 Wiki 应用的一部分，而是使用\
  \ IoC 容器进行配置。我们很快就会看到如何配置此代理。\n\n下图展示了用户提交凭据。安全代理将凭据与第三方安全资源进行核对以确认用户身份。最常见的实现是一个包含用户数据的简单数据库表。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_144_0.png)\n\n## 授权确认“你可以做什么”\n\n需要指出的是，我们的安全代理尚未完成。在确认用户身份后，Spring\
  \ Python 接下来会查找用户被授予的权限。一个用户可能只有阅读文章的权限，而另一个用户则拥有阅读文章和编辑文章的权限。前一图的最后几个步骤展示了这一点，权限被查找并存储在\
  \ Spring Python Security 的上下文持有者中。\n\n标准惯例是允许用户拥有零个或多个角色。收集这些信息后，我们的安全代理将用户的身份、授予的权限和已认证状态存储在全局可访问的\
  \ `SecurityContextHolder` 中。这很重要，因为它为我们的应用提供了一种在不修改应用 API 的情况下查找用户安全状态信息的方式。这满足了我们另一个要求：凭据数据必须能够非侵入式地访问。在为应用添加安全措施后，我们将看到如何访问它。\n\
  \n在对用户进行身份认证和授权后，Web 请求将被允许通过到 Web 应用。下图展示了当我们再次提交新的 Wiki 文本时会发生什么，假设我们已通过身份认证并获得授权。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_145_0.png)\n\n需要指出的是，这不需要对 SpringWiki\
  \ 或 SpringWikiController 进行任何更改。我们将很快演示，应用这些更改仅涉及一些配置更改。\n\n## 为应用添加安全性的时机\n\n现在是时候将这些安全特性添加到我们的应用中了。\n\
  \n首先我们需要定义 Spring Python Security 代理。为此，我们需要在 SpringWikiAppContext 中添加以下代码。\n\n\
  ```python\n@Object\ndef filterChainProxy(self):\n    return CP3FilterChainProxy(filterInvocationDefinitionSource\
  \ =\n        [\n        (\"/login.*\",  [\"httpSessionContextIntegrationFilter\"\
  ]),\n        (\"/.*\",       [\"httpSessionContextIntegrationFilter\",\n       \
  \                \"exception_translation_filter\",\n                       \"auth_processing_filter\"\
  ,\n                       \"filter_security_interceptor\"])\n        ])\n```\n\n\
  springpython.security.cherrypy3.CP3FilterChainProxy uses CherryPy APIs to insert\
  \ itself into the chain of handlers that are called before our CherryPy application\
  \ is called. This allows the filter chain proxy to apply the security policies we\
  \ are configuring.\n\n过滤器链代理使用 URL 模式列表进行配置。在每次 Web 请求时，代理会遍历此列表直到找到匹配项。\n\n找到匹配后，它会在允许访问\
  \ Web 应用本身之前应用定义的过滤器链。每个过滤器都配置为一个字符串，用于在应用上下文中反射查找实际的过滤器。\n\n如果未找到匹配，整个安全栈将被绕过。这不是推荐的解决方案。相反，最好通过使用一个捕获所有模式（/.*）来覆盖所有可能的模式，以明确显示在何处应用了哪些过滤器。\n\
  \n让我们向应用上下文添加所需的第一个过滤器：\n\n```python\nhttpSessionContextIntegrationFilter.\n@Object\n\
  def httpSessionContextIntegrationFilter(self):\n    filter = HttpSessionContextIntegrationFilter()\n\
  \    filter.sessionStrategy = self.session_strategy()\n    return filter\n\n@Object\n\
  def session_strategy(self):\n    return CP3SessionStrategy()\n```\n\n首先，注意方法名与 filterChainProxy\
  \ 中找到的过滤器字符串名相匹配。\n\nspringpython.security.web.HttpSessionContextIntegrationFilter\
  \ is used to transfer security credentials between the user's HTTP session and Spring\
  \ Python's SecurityContextHolder. The rest of the Spring Python Security components\
  \ use SecurityContextHolder to access the user's credential information.\n\n在我们应用的配置中，此过滤器在访问登录页面时使用（我们尚未编写该页面），以便登录页面可以存储凭据信息。应用的其他部分还有几个过滤器。\n\
  \n为了使 Spring Python 支持不同的 Web 框架，与 HTTP 会话数据交互的机制被封装在 cherrypySessionStrategy()\
  \ 中。在我们的例子中，我们使用 CP3SessionStrategy。\n\n让我们添加 exception_translation_filter 来管理其他过滤器或\
  \ Web 应用本身抛出的任何安全异常。\n\n```python\n@Object\ndef exception_translation_filter(self):\n\
  \    filter = ExceptionTranslationFilter()\n    filter.authenticationEntryPoint\
  \ = self.auth_filter_entry_pt()\n    filter.accessDeniedHandler = self.accessDeniedHandler()\n\
  \    return filter\n```\n\n```python\n@Object\ndef auth_filter_entry_pt(self):\n\
  \    filter = AuthenticationProcessingFilterEntryPoint()\n    filter.loginFormUrl\
  \ = \"/login\"\n    filter.redirectStrategy = self.redirectStrategy()\n    return\
  \ filter\n```\n\n```python\n@Object\ndef accessDeniedHandler(self):\n    handler\
  \ = SimpleAccessDeniedHandler()\n    handler.errorPage = \"/accessDenied\"\n   \
  \ handler.redirectStrategy = self.redirectStrategy()\n    return handler\n```\n\n\
  ```python\n@Object\ndef redirectStrategy(self):\n    return CP3RedirectStrategy()\n\
  ```\n\n该过滤器负责在发生安全异常时将用户重定向到正确的页面。如果用户尚未通过身份认证，他将被重定向到登录页面。如果他尝试访问没有适当授权的页面，他将被重定向到\
  \ accessDenied 页面。\n\n为了使 Spring Python 支持不同的 Web 框架，发出 Web 重定向的机制被封装在 redirectStrategy()\
  \ 中。在我们的例子中，我们使用 CP3RedirectStrategy。\n\n让我们添加 authenticationProcessingFilter 以在继续之前确认用户已通过身份认证。\n\
  \n```python\n@Object\ndef auth_processing_filter(self):\n    filter = AuthenticationProcessingFilter()\n\
  \    filter.auth_manager = self.auth_manager()\n    filter.alwaysReauthenticate\
  \ = False\n    return filter\n```\n\n\n\nThis filter's job is to confirm the user\
  \ is authenticated. If not, a security exception is thrown, and the exception_translation_filter\
  \ handles the outcome. At this stage, it is possible to configure the system to\
  \ re-authenticate on every web request, or to avoid consuming as many resources\
  \ by caching the authentication status.\n\n该过滤器的任务是确认用户已通过身份验证。如果没有，则会抛出安全异常，并且\
  \ exception_translation_filter 处理结果。在此阶段，可以配置系统在每次 Web 请求时重新进行身份验证，或通过缓存身份验证状态来避免消耗过多资源。\n\
  \nThe following diagram shows how the filters are nested together. A call into this\
  \ stack of filters gives each filter a chance to perform security functions on entry\
  \ and/or exit. It also shows how the entire Spring Python Security stack is neatly\
  \ staged between the caller and the application, without having to intertwine itself\
  \ into the application itself through either class hierarchy or meddling with the\
  \ application's API.\n\n下图显示了过滤器是如何嵌套在一起的。对该过滤器栈的调用为每个过滤器提供了在进入和/或退出时执行安全功能的機會。它还显示了整个\
  \ Spring Python Security 栈是如何整齐地放置在调用方和应用程序之间，而无需通过类层次结构或干预应用程序的 API 将其与应用程序本身交织在一起。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_148_0.png)\n\nLet's define the AuthenticationManager\
  \ that manages the lookup of user credentials. For our situation, we will define\
  \ a fixed list of users for test purposes.\n\n让我们定义管理用户凭据查找的 AuthenticationManager。对于我们的情况，我们将为测试目的定义一个固定的用户列表。\n\
  \n```\n@Object\ndef auth_manager(self):\n    auth_manager = AuthenticationManager()\n\
  \    auth_manager.auth_providers = [self.auth_provider()]\n    return auth_manager\n\
  ```\n\n```\n@Object\ndef auth_provider(self):\n    provider = DaoAuthenticationProvider()\n\
  \    provider.user_details_service = self.user_details_service()\n    provider.password_encoder\
  \ = PlaintextPasswordEncoder()\n    return provider\n```\n\n```\ndef user_details_service(self):\n\
  \    user_details_service = InMemoryUserDetailsService()\n    user_details_service.user_dict\
  \ = {\n        \"alice\": (\"alicespassword\", [\"ROLE_READ\", \"ROLE_EDIT\"], True),\n\
  \        \"bob\": (\"bobspassword\", [\"ROLE_READ\"], True)\n    }\n    return user_details_service\n\
  ```\n\nauth_manager references a list of authentication providers that are used\
  \ to check credentials. When an authentication request is submitted, AuthenticationManager\
  \ goes down this list, asking each one to attempt authentication until one of them\
  \ succeeds. If no provider succeeds, AuthenticationManager throws a security exception,\
  \ denying access.\n\nauth_manager 引用了一组用于检查凭据的身份验证提供程序列表。当提交身份验证请求时，AuthenticationManager\
  \ 会遍历此列表，要求每个提供程序尝试身份验证，直到其中一个成功。如果没有提供程序成功，AuthenticationManager 会抛出安全异常，拒绝访问。\n\
  \nRight now, we have only one provider defined, but it is possible to have more.\
  \ This meets another one of our key requirements: multiple security providers must\
  \ be allowed.\n\n目前，我们只定义了一个提供程序，但可以有更多。这满足了我们另一个关键要求：必须允许多个安全提供程序。\n\nOur provider,\
  \ DaoAuthenticationProvider, taps its user_details_service in order to lookup the\
  \ user. It then runs the user-supplied password through its password_encoder and\
  \ compares it to the stored password. In our situation, we are using an InMemoryUserDetailsService\
  \ instead of an actual database, and the password is stored in the clear instead\
  \ of hashed.\n\n我们的提供程序 DaoAuthenticationProvider 利用其 user_details_service 来查找用户。然后它将用户提供的密码通过其\
  \ password_encoder 运行并与存储的密码进行比较。在我们的情况下，我们使用 InMemoryUserDetailsService 而不是实际数据库，并且密码以明文存储而不是哈希存储。\n\
  \n> It is highly recommended to not store passwords in the clear on any production\
  \ system.\n\n> 在任何生产系统上都不建议以明文存储密码。\n\nAs you can see, we currently have two user\
  \ accounts defined:\n\n如你所见，我们目前定义了两个用户账户：\n\n- alice has two defined roles: ROLE_READ\
  \ and ROLE_EDIT. alice is an enabled account\n- alice 有两个定义的角色：ROLE_READ 和 ROLE_EDIT。alice\
  \ 是一个已启用的账户\n- bob has one defined role: ROLE_READ. bob is an enabled account\n\
  - bob 有一个定义的角色：ROLE_READ。bob 是一个已启用的账户\n\nUsing the InMemoryUserDetailsService makes\
  \ it easy to get our application up and running from a security perspective, since\
  \ we don't have to worry about integrating with any external systems.\n\n使用 InMemoryUserDetailsService\
  \ 使从安全角度快速启动和运行应用程序变得容易，因为我们不必担心与任何外部系统集成。\n\nWith all the components nicely separated,\
  \ we can later swap InMemoryUserDetailsService with DatabaseUserDetailsService when\
  \ we are ready to go online. We can also replace PlaintextPasswordEncoder with either\
  \ ShaPasswordEncoder or Md5PasswordEncoder, to easily support different hashing\
  \ algorithms.\n\n由于所有组件都很好地分离，后续在准备上线时可以把 InMemoryUserDetailsService 替换为 DatabaseUserDetailsService。我们还可以将\
  \ PlaintextPasswordEncoder 替换为 ShaPasswordEncoder 或 Md5PasswordEncoder，以便轻松支持不同的哈希算法。\n\
  \nLet's define the last filter needed in our chain: filter_security_interceptor.\n\
  \n让我们定义链中所需的最后一个过滤器：filter_security_interceptor。\n\n```\n@Object\ndef filter_security_interceptor(self):\n\
  \    filter = FilterSecurityInterceptor()\n    filter.auth_manager = self.auth_manager()\n\
  \    filter.access_decision_mgr = self.access_decision_mgr()\n    filter.sessionStrategy\
  \ = self.session_strategy()\n    filter.obj_def_source = [\n        (\"edit.*\"\
  , [\"ROLE_EDIT\"]),\n        (\"/.*\", [\"ROLE_READ\"])\n    ]\n    return filter\n\
  ```\n\n```\n@Object\ndef access_decision_mgr(self):\n    access_decision_mgr = AffirmativeBased()\n\
  \    access_decision_mgr.allow_if_all_abstain = False\n    access_decision_mgr.access_decision_voters\
  \ = [RoleVoter()]\n    return access_decision_mgr\n```\n\nfilter_security_interceptor\
  \ is the last security check in our app. Its job is to make sure the user is authorized\
  \ to complete the request. It looks at the URL of the web request, and then goes\
  \ down its list of URL patterns until it finds a match. When it does, it sees a\
  \ list of roles. The roles along with the user's credentials are given to the access_decision_mgr,\
  \ who submits a request for a vote from each of its access_decision_voters. In our\
  \ configuration, we are using RoleVoter, which votes on whether or not the user\
  \ has the role supplied in the list.\n\nfilter_security_interceptor 是我们应用中的最后一个安全检查。其任务是确保用户有权完成请求。它查看\
  \ Web 请求的 URL，然后遍历其 URL 模式列表直到找到匹配项。当找到匹配项时，它会看到一个角色列表。角色连同用户的凭据一起交给 access_decision_mgr，后者向其每个\
  \ access_decision_voters 请求投票。在我们的配置中，我们使用 RoleVoter，它会投票决定用户是否具有列表中提供的角色。\n\naccess_decision_mgr\
  \ tallies up the votes, and decides if access is granted based on the policy. In\
  \ our case, we have an AffirmativeBased policy, meaning that we need only one up\
  \ vote, i.e. we only need to have one of the roles in the list. If we switched to\
  \ a UnanimousBased policy, we would be required to have all the roles. A ConsensusBased\
  \ policy would require that we have a majority of the roles.\n\naccess_decision_mgr\
  \ 汇总投票，并根据策略决定是否授予访问权限。在我们的情况下，我们使用的是 AffirmativeBased 策略，这意味着我们只需要一个赞成票，即列表中的角色只需有一个即可。如果我们切换到\
  \ UnanimousBased 策略，则需要拥有所有角色。ConsensusBased 策略则要求我们拥有多数角色。\n\nThis policy indicates\
  \ that a user can only access /edit* URLs if he has ROLE_EDIT. For any other web\
  \ path, the user must have ROLE_READ. Note: don't forget that /login* is excluded\
  \ from this filter.\n\n该策略表明用户只有在拥有 ROLE_EDIT 时才能访问 /edit* URL。对于任何其他 Web 路径，用户必须拥有\
  \ ROLE_READ。注意：不要忘记 /login* 已从此过滤器中排除。\n\n- Let's add a login page to our view layer\n\
  - 让我们在视图层添加一个登录页面\n- Let's add the code to create and process a login page in our\
  \ controller\n- 让我们在控制器中添加创建和处理登录页面的代码\n\n```python\n@cherrypy.expose\ndef login(self,\
  \ fromPage=\"/\", login=\"\", password=\"\",\nerrorMsg=\"\"):\n    return self.controller.getLoginPage(\n\
  \        fromPage, login, password, errorMsg)\n```\n\n```python\ndef getLoginPage(self,\
  \ fromPage=\"/\", login=\"\", password=\"\", errorMsg=\"\"):\n    if login != \"\
  \" and password != \"\":\n        try:\n            self.authenticate(login, password)\n\
  \            return [self.redirector.redirect(fromPage)]\n        except AuthenticationException,\
  \ e:\n            return [self.redirector.redirect(\n                \"?login=%s&errorMsg=Username/password\
  \ failure\" %\n                login)]\n\n    results = \"\"\"\n<html>\n    <head>\n\
  \        <title>Spring Python book demo</title>\n    </head>\n    <body>\n     \
  \   <form method=\"POST\" action=\"\">\n            Login: <input type=\"text\"\
  \ name=\"login\" value=\"%s\"\nsize=\"10\"/><br/>\n            Password: <input\
  \ type=\"password\" name=\"password\" size=\"10\"/>\n<br/>\n            <input type=\"\
  hidden\" name=\"fromPage\" value=\"%s\"/><br/>\n            <input type=\"submit\"\
  />\n        </form>\n        <a href=\"http://springpythonbook.com\">Spring Python\
  \ book</a>\n    </body>\n</html>\n    \"\"\" % (login, fromPage)\n```\n\n```\nreturn\
  \ [results]\n\ndef authenticate(self, username, password):\n    token = UsernamePasswordAuthenticationToken(username,\
  \ password)\n    SecurityContextHolder.getContext().authentication = self.auth_manager.authenticate(token)\n\
  \    self.httpContextFilter.saveContext()\n```\n\n- We also need to initialize the\
  \ controller with some of the security components\n- 我们还需要使用一些安全组件初始化控制器\n\n```\n\
  def __init__(self):\n    self.httpContextFilter = None\n    self.auth_manager =\
  \ None\n    self.redirector = None\n```\n\n- These controller attributes must be\
  \ injected from the IoC container\n- 这些控制器属性必须从 IoC 容器注入\n\n```\n@Object\ndef controller(self):\n\
  \    ctrl = controller.SpringWikiController()\n    ctrl.httpContextFilter = self.httpSessionContextIntegrationFilter()\n\
  \    ctrl.auth_manager = self.auth_manager()\n    ctrl.redirector = self.redirectStrategy()\n\
  \    return ctrl\n```\n\nWith these parts injected into the controller, it now has\
  \ the ability to process a login request, store it into the context, and have the\
  \ user's authenticated credentials stored in their HTTP session data.\n\n将这些部分注入到控制器后，它现在能够处理登录请求，将其存储到上下文中，并将用户的已验证凭据存储在其\
  \ HTTP 会话数据中。\n\nWith all these modifications in place, Spring Python has clearly\
  \ made it possible to wrap an existing application with a layer of security. The\
  \ IoC definitions show fine grained control over what URLs require which filters,\
  \ and also which authorization roles. This meets the important requirement: 'the\
  \ security solution must be orthogonal to the class hierarchy'. At no time were\
  \ we required to extend any security-based classes. Instead, we used a series of\
  \ filters and security classes, all defined outside the hierarchy of our business\
  \ model.\n\n在所有这些修改到位后，Spring Python 显然使为现有应用程序包装一层安全成为可能。IoC 定义显示了对哪些 URL 需要哪些过滤器以及哪些授权角色的精细控制。这满足了重要要求：'安全解决方案必须与类层次结构正交'。我们从未被要求扩展任何基于安全的类。相反，我们使用了一系列过滤器和安全类，所有这些都定义在业务模型层次结构之外。\n\
  \nBy keeping the policies in the centralized location of the application context,\
  \ it is easy to adjust them as necessary. For example, if we needed a /admin.* pattern\
  \ linked with ROLE_ADMIN, it is easy to adjust the access_decision_manager to easily\
  \ support this. We can also put various URL patterns underneath different policies,\
  \ all from within the application context. This supports the key requirement: 'security\
  \ policies must be flexible and easy to fine tune'.\n\n通过将策略保留在应用程序上下文的集中位置，可以根据需要轻松调整它们。例如，如果我们需要将\
  \ /admin.* 模式与 ROLE_ADMIN 关联，则可以轻松调整 access_decision_manager 以轻松支持此功能。我们还可以将各种 URL\
  \ 模式置于不同的策略之下，所有这些都来自应用程序上下文。这支持了关键要求：'安全策略必须灵活且易于微调'。\n\n\n\n\n## 在应用内部访问安全数据\n\
  \n我们简要提到过 Spring Python Security 如何将用户凭证存储在 SecurityContextHolder 中。这提供了一种便捷的方式，可以在不修改\
  \ API 的情况下从应用内部查找重要的安全信息。\n\n到目前为止，我们已经成功开发了一个相对简单的 Web 应用，并为其添加了一层基于角色保护 URL 的安全层。在某些情况下，这可能还不够。虽然保护\
  \ URL 很不错，但根据用户的角色权限禁用或隐藏某些链接可能更有用。这是一种更精细的选项，且易于实现。\n\n在用于渲染 HTML 的 Page 对象定义中，页脚定义包含以下内容：\n\
  \n```\ndef footer(self):\n    \"\"\"Standard footer used for all pages.\"\"\"\n\
  \    footer = \"\"\"\n        <ul>\n            <li><a href=\"/edit/\"\"\" + self.article\
  \ + \"\"\"\">Edit</a></li>\n        </ul>\n        <a href=\"http://springpythonbook.com\"\
  >Spring Python book</a>\n    </body>\n    \"\"\"\n    return footer\n```\n\n在这种情况下，在查看文章时，我们向用户提供点击编辑链接的选项。然而，如果用户没有\
  \ ROLE_EDIT，请求将被重定向到访问被拒绝页面。\n\n更优的解决方案是隐藏此链接，以免用户一开始就点击它。减少用户进入访问被拒绝页面的机会不仅降低了对安全层的压力，也改善了用户体验。但我们目前实施的安全方案并不能处理有条件地修改\
  \ HTML。编写过滤器来管理这一点并不实际。相反，最好在此处加入一些条件检查来验证用户凭证，并选择性地渲染超链接。\n\n```\ndef footer(self):\n\
  \    \"\"\"Standard footer used for all pages.\"\"\"\n    footer = \"\"\nif \"ROLE_EDIT\"\
  \ in SecurityContextHolder.getContext().\n                        authentication.granted_auths:\n\
  \    footer += \"\"\"\n    <ul>\n        <li><a href=\"/edit/\"\"\" + self.article\
  \ + \"\"\">Edit\n            </a></li>\n    </ul>\n    \"\"\"\n\n    footer += \"\
  \"\"\n        <a href=\"http://springpythonbook.com\">Spring Python book\n     \
  \   </a>\n    </body>\n    \"\"\"\n    return footer\n```\n\nSecurityContextHolder\
  \ 是一个全局可访问的对象。它包含一个上下文，指定当前认证凭证的存储位置。\n\n- 如果 SecurityContextHolder 配置为模式 \"GLOBAL\"\
  ，则整个 Python 虚拟机只有一个上下文，意味着所有线程都会看到相同的[content]\n## 在应用内部访问安全数据\n\n我们简要提到过 Spring\
  \ Python Security 如何将用户凭证存储在 SecurityContextHolder 中。这提供了一种便捷的方式，可以在不修改 API 的情况下从应用内部查找重要的安全信息。\n\
