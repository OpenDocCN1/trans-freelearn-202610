  Invalid credentials\")\n```\n\n由于每个连接工厂略有不同，我们假设传入的是一个 `MySqlConnectionFactory`。我们的新提供者可立即使用。就这么简单，满足了我们的需求：'users\
  \ must be able to quickly write custom security extensions to handle legacy security\
  \ solutions'。\n\n使此示例更复杂的一种方法将是使其处理当前的一组连接工厂。但就目前而言，它作为演示如何在 Spring Python Security\
  \ 当前未涵盖的方式下对现有系统进行身份验证的合适示例是有效的。\n\n## 使用 Spring Python Security 的一些挑战\n\nSpring\
  \ Python Security — 如本章所示 — 极其灵活、高度可扩展且非侵入式。然而，这是有代价的。所有内容都必须手工配置（并且配置正确）。\n\n这是针对\
  \ Acegi Security 提出的主要批评之一。此后，Acegi Security（现品牌为 Spring Security）发布了多个更新版本，减少了所需的手动配置量。他们现在为许多行业标准安全选项提供快捷方式，同时仍允许我们添加自定义选项，使为我们的需求连接安全框架变得容易得多。\n\
  \n随着 Spring Python Security 的发展，它将做出类似的更改，同时增加其支持的协议。直到那时，使用尽可能多的自动化测试以确保配置按预期执行是良好的实践。对于问题和文档，请务必使用：\n\
  \n- 在线参考手册（`http://springpython.webfactional.com`）\n- 支持论坛（`http://forum.springsource.org/forumdisplay.php?f=45`）\n\
  - 邮件列表（`http://lists.springsource.com/archives/springpython-users`）以获取最新答案\n\n##\
  \ 摘要\n\n在本章中，我们深入探讨了复杂但功能强大的 Spring Python Security 架构的细节，并看到了其灵活性和可配置性。我们研究了将安全编码到应用程序中的挑战，并列出了一份有用的安全解决方案的需求清单。在整个章节中，我们看到了\
  \ Spring Python Security 如何满足这些需求。\n\n我们开发了一个简单的应用程序，然后应用了简单、可硬编码的测试安全。后来，我们看到了由于\
  \ Spring Python 的 IoC 容器，可以轻松将其替换为 SQL 驱动的解决方案。我们还探索了配置 LDAP 解决方案。\n\n我们通过了解如何轻松添加自己的自定义安全扩展，这些扩展可以轻松插入到\
  \ Spring Python Security 中来结束。\n\n我们也坦率地观察到，使用 Spring Python Security 需要仔细配置。希望本书能降低门槛，使其更易于访问。\n\
  \n在本章中，我们涵盖了：\n\n- 软件开发人员必须处理的安全问题以及有效编码解决方案非常具有挑战性\n- 构建安全框架涉及许多需求，而 Spring Python\
  \ 都满足了它们\n- 我们用一个简单的解决方案包装了一个未受保护的应用程序，该解决方案通过委托给安全控制器来干净地保护应用程序\n- 认证用户身份的概念，以及确定他们被授权执行的操作\n\
  - 测试应用程序的安全性是可能、实用且必要的\n- 我们配置了一个基于 SQL 的安全系统，包括适应自定义用户/角色模式\n- 我们配置了一个基于 LDAP 的安全系统\n\
  - 我们探索了使应用程序支持多个用户社区或在没有停机时间的情况下从一个安全系统迁移到另一个安全系统\n- 我们研究了如何为 Spring Python Security\
  \ 目前未开箱即支持的系统编写自己的安全扩展\n\n在下一章中，我们将探索使用 Spring 的方式通过远程链接连接系统的方法。\n\n# 7 使用 Spring\
  \ Python 的远程处理跨节点扩展应用程序\n\n# 使用 Spring Python 的远程处理跨节点扩展应用程序\n\n随着近年来互联网在电子商务中的爆炸式增长，公司面临着支持大量同时客户的压力。随着用户希望拥有执行更多业务功能的更丰富界面，这不断导致对前所未有的更多计算能力的需求，无论是基于\
  \ Web 还是厚客户端。看到总 CPU 性能增长放缓，人们正在寻找多核 CPU、64 位芯片或向企业添加更多服务器以满足其不断增长的需求。\n\n开发人员面临的挑战是在为节省成本而精简的桌面简单环境中设计应用程序。然后他们必须能够部署到多核、多服务器环境中，以满足公司的业务需求。\n\
  \n为了支持这一点，已经开发了不同的技术。已经起草了不同的协议来帮助节点之间进行通信。关于网络间通信是否应在 API 中可见或抽象掉的争论仍在继续。支持远程连接客户端进程与服务器进程的不同技术仍在不断开发中。\n\
  \nSpring Python 提供了一种干净的方式来采用简单的应用程序并使用远程处理技术将其拆分到多台机器上，可以无缝注入而不会导致代码重写头痛。Spring\
  \ Python 使利用现有技术变得容易，同时也为支持尚未设计的技术做好准备。\n\n在本章中我们将学习如何：\n\n- Pyro 提供了一个不错的 Python\
  \ 到 Python 的远程处理功能，可以轻松创建客户端-服务器应用程序\n- Spring Python 与 Pyro 无缝集成，因此您的应用程序不必学习 API\n\
  - 您可以将简单应用程序转换为分布式应用程序，全部在同一台机器上\n- 通过将应用程序拆分为部分，插入轮询队列管理器并运行服务器的多个副本而对业务逻辑没有影响，只需很少的精力即可重新布线应用程序\n\
  \n## Pyro（Python 远程对象）简介\n\nPyro 是一个开源项目（http://pyro.sourceforge.net），它提供了一种面向对象的\
  \ RPC 形式。如项目网站所述，它类似于 Java 的远程方法调用（RMI）。它与 CORBA（http://www.corba.org）不太相似，CORBA\
  \ 是一种技术中立的线路协议，用于将多个进程连接在一起，因为它不需要接口定义语言，也不是面向将不同语言连接在一起的。Pyro 支持 Python 到 Python\
  \ 的通信。得益于 Jython 的强大功能，轻松链接 Java 到 Python，反之亦然。\n\n> Python Remote Objects 不应与 Python\
  \ Robotics 开源项目（也名为 Pyro）混淆。\n\nPyro 在开箱即用的现有 Python 应用程序中非常易于使用。将发布服务的能力添加到现有应用程序并不困难。Pyro\
  \ 使用自己的协议进行 RPC 通信。\n\n从根本上说，基于 Pyro 的应用程序涉及启动 Pyro 守护程序线程，然后将服务器组件与此线程注册。从那时起，线程以及您的服务器代码处于待机模式，等待处理客户端调用。下一步涉及创建一个\
  \ Pyro 客户端代理，该代理配置为找到守护程序线程，然后将客户端调用转发到服务器。从高层次的角度来看，这与 Java RMI 和 CORBA 提供的类似。然而，由于\
  \ Python 的动态特性，配置步骤要容易得多，并且没有要求扩展任何类或实现任何接口。\n\n\n\n尽管使用 Pyro 很简单，仍然需要编写少量代码来实例化对象并进行注册。你还必须编写客户端代码，使其同样感知到\
  \ Pyro。鉴于本章的目的是深入使用 Spring Python，我们将跳过编写纯 Pyro 应用。相反，让我们看看如何使用 Spring Python 即开即用的基于\
  \ Pyro 的组件，从而消除编写任何 Pyro 黏合代码的需求。这让我们可以将一切委托给 IoC 容器，使其自行完成所有集成步骤。这使得将应用程序分布式化的成本降为零。\n\
  \n## 将简单应用程序在同一台机器上转换为分布式应用\n\n对于本示例，让我们开发一个处理一些数据并产生响应的简单服务。然后，我们将其转换为分布式服务。\n\n\
  首先，让我们创建一个简单服务。对于本示例，让我们创建一个返回字符串数组的服务，该数组代表嵌入了某人姓名的生日快乐歌曲。\n\n```python\nclass\
  \ Service(object):\n    def happy_birthday(self, name):\n        results = []\n\
  \        for i in range(4):\n            if i == 2:\n                results.append(\"\
  Happy Birthday Dear %s!\" % name)\n            else:\n                results.append(\"\
  Happy Birthday to you!\")\n        return results\n```\n\n我们的服务并不复杂。不是直接将数据打印到屏幕上，而是将其收集起来返回给调用者。这允许调用者打印它、测试它、存储它，或对结果做任何它想做的事情。在下面的屏幕文本中，我们看到一个简单的客户端在\
  \ Python shell 中接收结果并以少量格式打印它们。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_170_0.png)\n\
  \n如我们所见，我们已经定义了一个简单服务，并且可以直接调用它。在我们的例子中，我们只是用换行符将列表连接起来，并打印到屏幕上。\n\n## 从 IoC 容器获取服务\n\
  \n让我们定义一个简单的 IoC 容器来创建我们服务的实例。\n\n```python\nfrom springpython.config import *\n\
  \nfrom simple_service import *\n\nclass HappyBirthdayContext (PythonConfig):\n \
  \   def __init__(self):\n        PythonConfig.__init__(self)\n\n    @Object\n  \
  \  def service(self):\n        return Service()\n```\n\n## 创建调用服务的客户端\n\n现在让我们编写一个客户端脚本来创建此\
  \ IoC 容器的实例、获取服务并使用它。\n\n```python\nfrom springpython.context import *\n\nfrom simple_service_ctx\
  \ import *\n\nif __name__ == \"__main__\":\n    ctx = ApplicationContext(HappyBirthdayContext())\n\
  \    s = ctx.get_object(\"service\")\n    print \"\\n\".join(s.happy_birthday(\"\
  Greg\"))\n```\n\n运行此客户端脚本会整洁地创建我们 IoC 容器的实例、获取服务，并使用前面显示的相同参数调用它。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_171_0.png)\n\
  \n## 在不更改客户端的情况下使应用程序分布式化\n\n为了进行这些更改，我们将把应用程序上下文拆分为两个不同的类：一个包含服务器部分，一个包含客户端部分。\n\
  \n虽然 API 没有变化，但我们必须稍微修改原始客户端脚本，以便导入我们修改后的上下文文件。\n\n首先，让我们通过对 IoC 配置进行一些小改动，使用 Pyro\
  \ 发布我们的服务。\n\n```python\nfrom springpython.config import *\nfrom springpython.remoting.pyro\
  \ import *\n\nfrom simple_service import *\n\nclass HappyBirthdayContext(PythonConfig):\n\
  \    def __init__(self):\n        PythonConfig.__init__(self)\n\n    @Object\n \
  \   def target_service(self):\n        return Service()\n\n    @Object()\n    def\
  \ service_exporter(self):\n        exporter = PyroServiceExporter()\n        exporter.service_name\
  \ = \"service\"\n        exporter.service = self.target_service()\n        return\
  \ exporter\n```\n\n我们已将服务方法重命名为 target_service，以表明它是我们的导出代理的目标。\n\n然后我们创建了一个 PyroServiceExporter。这是\
  \ Spring Python 用于使用 Pyro 广告任何 Python 服务的即开即用解决方案。它处理启动 Pyro 守护线程和注册我们服务的全部细节。\n\
  \nPyro 要求服务使用不同的名称注册，这通过将导出器的 service_name 属性设置为 \"service\" 来配置。我们还需要通过导出器的 service\
  \ 属性为其提供对实际服务对象的句柄。我们通过插入 target_service 来实现这一点。\n\n- 默认情况下，Pyro 在 IP 地址 127.0.0.1\
  \ 上进行广告，但可以通过设置导出器的 service_host 属性来覆盖\n- 默认情况下，Pyro 在端口 7766 上进行广告，但可以通过设置导出器的\
  \ service_port 属性来覆盖\n\n1. 为了完成服务器端的工作，让我们编写一个服务器脚本来启动并广告我们的服务。\n\n```python\nfrom\
  \ springpython.context import *\n\nfrom simple_service_server_ctx import *\n\nif\
  \ __name__ == \"__main__\":\n    ctx = ApplicationContext(HappyBirthdayContext())\n\
  \    ctx.get_object(\"service_exporter\")\n```\n\n现在让我们启动我们的服务器进程。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_173_0.png)\n\
  \n2. 如你所见，它正在待命，等待被调用。\n\n3. 接下来，我们需要一个基于客户端的应用程序上下文。\n\n```python\nfrom springpython.config\
  \ import *\nfrom springpython.remoting.pyro import *\n\nclass HappyBirthdayContext(PythonConfig):\n\
  \    def __init__(self):\n        PythonConfig.__init__(self)\n\n    @Object\n \
  \   def service(self):\n        proxy = PyroProxyFactory()\n        proxy.service_url=\"\
  PYROLOC://127.0.0.1:7766/service\"\n        return proxy\n```\n\n我们使用 Spring Python\
  \ 的 PyroProxyFactory 定义 Pyro 客户端，这是一个易于配置的 Spring Python 代理工厂，处理使用 Pyro API 查找远程服务的任务。并且通过在\
  \ URL 中嵌入 IoC 容器原始的 service 名称（PYROLOC://127.0.0.1:7766/service），我们的客户端脚本无需任何更改。\n\
  \n- 让我们创建一个客户端脚本来使用此上下文。\n\n```python\nfrom springpython.context import *\n\nfrom\
  \ simple_service_client_ctx import *\n\nif __name__ == \"__main__\":\n    ctx =\
  \ ApplicationContext(HappyBirthdayContext())\n    s = ctx.get_object(\"service\"\
  )\n    print \"\\n\".join(s.happy_birthday(\"Greg\"))\n```\n\n- 现在让我们运行我们的客户端。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_174_0.png)\n\n不幸的是，服务器端屏幕上没有任何打印输出。那是因为我们没有任何打印语句或日志记录。然而，如果我们去修改\
  \ simple_service.py 中的原始服务，我们可以引入一个打印语句来验证我们的服务是否在服务器端被调用。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_174_1.png)\n\
  \n让我们重新启动它并再次调用客户端脚本。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_175_0.png)\n\n\
  这表明我们的服务器代码是从客户端调用的。并且它很好地与 Pyro 的机制解耦了。\n\n## 我们的示例是否牵强？\n\n这个示例看起来是否牵强？当然是的。然而，从客户端访问服务的基本概念并不是。\n\
  \n除了我们的生日快乐服务之外，这可以是应用程序的数据访问层、航空公司航班预订系统的接口，或由运营中心提供的故障工单数据的访问。\n\n我们的示例仍然具有相同的输入参数、输出结果以及事后客户端处理的根本概念。\n\
  \n## Spring Python 是非侵入式的\n\n我们取了一个非常简单的服务，并通过 IoC 容器提供它，很容易用 Pyro 导出器包装它，而我们的应用程序却浑然不觉。如本书所示，IoC\
  \ 容器打开了许多选项的大门。现在，我们看到它如何使我们能够将代码作为 Pyro 服务公开。这个概念并不止于 Pyro。相同的模式可以应用于为其他远程机制导出服务。通过能够将配置与实际业务逻辑分离，我们可以再次应用一个有用且实用的服务，而无需重写代码以使其与服务配合工作。\n\
  \n\n\n## 扩展我们的应用程序\n\n本章开头，我们谈到了扩展应用程序的需求。到目前为止，我们展示了如何将一个非常简单的客户端-服务器应用程序拆分到两个\
  \ Python 实例之间。\n\n然而，扩展应用程序通常意味着运行应用程序的多个副本以处理更大的负载。通常需要某种类型的负载均衡器。让我们探索如何使用 Spring\
  \ Python 的远程服务结合一些简单的 Python 来创建服务的<|message|>多节点版本。\n\n## 将单节点后端转换为多个实例\n\n第一步是创建另一个应用程序上下文。我们将启动组件的不同配置，即不同的蓝图，并计划在不做任何更改的情况下重用现有的业务代码。\n\
  \n- 1. 创建一个双节点配置，该配置创建两个 Service 实例，并在不同的端口上进行广告。\n\n```python\nfrom springpython.config\
  \ import *\nfrom springpython.context import scope\nfrom springpython.remoting.pyro\
  \ import *\n\nfrom simple_service import *\n\nclass HappyBirthdayContext (PythonConfig):\n\
  \    def __init__(self):\n        PythonConfig.__init__(self)\n\n    @Object(scope.PROTOTYPE)\n\
  \    def target_service(self):\n        return Service()\n\n    @Object()\n    def\
  \ service_exporter1(self):\n        exporter = PyroServiceExporter()\n        exporter.service_name\
  \ = \"service\"\n        exporter.service = self.target_service()\n        exporter.service_port\
  \ = 7001\n        return exporter\n\n    @Object()\n    def service_exporter2(self):\n\
  \        exporter = PyroServiceExporter()\n        exporter.service_name = \"service\"\
  \n        exporter.service = self.target_service()\n        exporter.service_port\
  \ = 7002\n        return exporter\n```\n\n2. 在此上下文中，我们有两个不同的 PyroServiceExporters，每个都有不同的端口号。虽然看起来它们都使用\
  \ target_service，请注意我们已将 scope 更改为 PROTOTYPE。这意味着每个导出器都有自己的实例。要运行此新上下文，我们需要一个不同的启动脚本。\n\
  \n```python\nimport logging\nfrom springpython.context import *\n\nfrom multi_server_ctx\
  \ import *\n\nif __name__ == \"__main__\":\n    logger = logging.getLogger(\"springpython.remoting\"\
  )\n    loggingLevel = logging.DEBUG\n    logger.setLevel(loggingLevel)\n    ch =\
  \ logging.StreamHandler()\n    ch.setLevel(loggingLevel)\n    formatter = logging.Formatter(\"\
  %(asctime)s - %(name)s - %(levelname)s - %(message)s\")\n    ch.setFormatter(formatter)\n\
  \    logger.addHandler(ch)\n\n    ctx = ApplicationContext(HappyBirthdayContext())\n\
  ```\n\n3. 现在让我们启动脚本：\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_178_0.png)\n\n\
  在此脚本中，我们打开了 Spring Python 的一些内置日志记录，以便可以看到启动远程处理所涉及的部分。我们可以看到两个不同的 Pyro 守护线程被启动，每个端口一个。然后我们看到我们的\
  \ Service 代码的两个实例被注册，每个线程一个。\n\n我们现在有两个服务副本已准备就绪，等待被调用。\n\n## 创建轮询调度器\n\n编写调度器的方式有很多。对于我们的示例，让我们选择一个简单的轮询算法，在其中循环遍历一个固定列表。\n\
  \n让我们创建一个应用程序上下文，其中包含一个轮询调度器，它的行为像我们的服务，并由 PyroProxyFactory 元素的列表提供。\n\n```python\n\
  from springpython.config import *\nfrom springpython.remoting.pyro import *\n\n\
  class RoundRobinDispatcher(object):\n    def __init__(self, proxies):\n        self.proxies\
  \ = proxies\n        self.counter = 0\n\n    def happy_birthday(self, parm):\n \
  \       self.counter += 1\n        proxy = self.proxies[self.counter % 2]\n    \
  \    print \"Calling %s\" % proxy\n        return proxy.happy_birthday(parm)\n\n\
  class HappyBirthdayContext(PythonConfig):\n    def __init__(self):\n        PythonConfig.__init__(self)\n\
  \n    @Object\n    def service_proxies(self):\n        proxies = []\n        for\
  \ port in [\"7001\", \"7002\"]:\n            proxy = PyroProxyFactory()\n      \
  \      proxy.service_url = \"PYROLOC://127.0.0.1:%s/service\" % port\n         \
  \   proxies.append(proxy)\n        return proxies\n\n    @Object\n    def service(self):\n\
  \        return RoundRobinDispatcher(self.service_proxies())\n```\n\n我们将 service_proxies\
  \ 配置为 PyroProxyFactorys 的数组。这使我们能够定义一个静态连接列表。\n\nRoundRobinDispatcher 类被注入代理，并模仿我们的\
  \ Happy Birthday 服务的 API。调度器上的每次调用都会递增计数器。然后它选择其中一个代理来实际调用。\n\n## 调整客户端配置，而无需客户端代码知道它正在与多节点后端通信\n\
  \n让我们编写客户端脚本以使用我们的轮询调度器。\n\n```python\nfrom springpython.context import *\n\nfrom\
  \ multi_client_ctx import *\n\nif __name__ == \"__main__\":\n    ctx = ApplicationContext(HappyBirthdayContext())\n\
  \    s = ctx.get_object(\"service\")\n\n    print \"\\n\".join(s.happy_birthday(\"\
  Greg\"))\n    print \"\\n\".join(s.happy_birthday(\"Greg\"))\n    print \"\\n\"\
  .join(s.happy_birthday(\"Greg\"))\n```\n\n对客户端几乎没有影响。唯一的区别是 import 语句，以及我们多次调用服务这一事实。如果客户端实际上是一个\
  \ GUI 应用程序，并且此操作绑定到按钮，则不会有任何区别。\n\n现在让我们运行客户端脚本。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_180_0.png)\n\
  \n如图所示，每次调用都会显示调用了哪个 PyroProxyFactory，并且它们清楚地显示在两个已注册的代理之间来回切换。随着每次调用与相应的 PyroServiceExporter\
  \ 平稳集成，我们已将应用程序扩展为双节点版本。\n\n## 摘要\n\n此示例再次演示了如何利用 IoC 容器实现组件的复杂连接，而无需客户端或服务器知道它。\n\
  \n最新示例仅通过编写不同的蓝图集，即 IoC 配置，就完全重新布线了应用程序的原始概念。它还演示了使用纯 Python IoC 配置时事物更加强大和复杂。我们能够混合代码和参数，这比编写\
  \ XML 文件要顺畅得多。\n\n我们的应用程序最初是一个简单的客户端调用服务。通过重新布线以使用 IoC，它使我们能够轻松重新配置以在多个节点上运行服务的多个副本，而无需更改核心逻辑。\n\
  \n我们的轮询调度器 admittedly 很简单。真正的生产解决方案需要：\n\n- 更复杂的错误处理来处理诸如远程访问异常之类的事情。\n- 我们还需要一种方法来扩展新节点并将它们添加到列表中。\n\
  - 也许通过让调度器自行导出，其他服务可以挂钩并找出有哪些服务可用。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_181_0.png)\n\
  \n> Spring Python 不提供用于集成系统的调度器、路由器和其他类型的组件。Spring Integration (http://www.springsource.org/spring-integration)\
  \ 是 Spring 组合的单独部分，为 Java 带来这些功能。Spring Python Remoting 是一个构建块，未来可用于构建 Spring Python\
  \ Integration 模块。\n\n我们可以花费无数小时来完善我们的调度器。我们也可以专注于为核心业务逻辑添加更多功能。\n\n在所有这些中，重要因素在于我们已演示了\
  \ Spring Python 如何提供一种非侵入式的方式，将我们的原始应用程序扩展到远超其最初设计的目的。\n\n在本章中我们学到了：\n\n- Pyro 如何提供良好的\
  \ Python 到 Python 远程处理功能，以便轻松创建客户端-服务器应用程序\n- Spring Python 如何与 Pyro 无缝集成，使您的应用程序不必学习\
  \ API\n- 将简单应用程序转换为分布式应用程序是很容易的，所有这些都在同一台机器上\n- 我们通过将应用程序拆分为部分、插入轮询队列管理器并在不影响业务逻辑的情况下运行服务器的多个副本来重新布线应用程序\n\
  \n在下一章中，我们将使用 Spring Python 的所有组件构建一个简单、可扩展且安全的应用程序，具有强大的完整性。\n\n\n\n# 8 案例研究 I—将\
  \ Spring Python 与您的 Web 应用程序集成\n\n# 案例研究 I—将 Spring Python 与您的 Web 应用程序集成\n\n在之前的章节中，我们已经介绍了\
  \ Spring Python 的构建模块：依赖注入、面向方面编程、数据库模板、事务管理、安全性和远程调用。所有这些组件就像建造房屋时使用的砖块。我们单独查看了每块砖，并了解了如何利用它。在本章中，我们将探讨如何将它们全部结合起来构建一个全面的银行应用程序。\n\
  \n本章我们将学习如何：\n\n- 组装一个简单的银行应用程序，具有良好解耦的视图和控制器层\n- 应用简单的身份验证机制以授予不同类型用户访问权限\n- 应用基于角色的授权，区分不同的用户组\n\
  - 创建自定义授权以防止客户查看彼此的数据\n- 通过受信任的网络以原始的机器可读格式导出数据\n- 向外部用户导出数据，通过既定的安全协议仅向经过身份验证和授权的客户端提供此数据\n\
  - 无缝审计银行操作\n- 将多步骤操作标记为原子事务\n\n## 一个优秀银行的需求\n\n在开始构建应用程序之前，我们需要确定在编码冲刺中将实现的故事。我们需要做什么才能实现一个良好的银行应用程序？\n\
  \n- 客户可以开设余额为 $0.00 的新账户\n- 客户可以关闭余额为 $0.00 的账户\n- 开户和销户记录写入日志，账户所有者和任何经理均可查看\n\
  - 客户可以提取账户总额范围内的任意金额\n- 客户可以向其拥有的现有账户存入任意金额\n- 客户可以将其拥有的一个账户向其拥有的另一个账户转账，金额不超过源账户总额\n\
  - 所有取款、存款和转账均写入日志，账户所有者和任何经理均可查看\n- 日志将通过安全的机器对机器格式提供，需要有效凭据\n- 经理查看日志的操作将单独记录。此日志可由主管查看\n\
  \n这并不是我们希望银行具备的全部功能，但这是一个不错的开始。我们的冲刺专注于构建一些基本的存款/取款功能，同时记录这些交易。这要求保持完整性以避免资金泄露。\n\
  \n我们还需要对经理进行监督，以监控他们何时检查交易日志。客户、经理和主管的访问将需要在我们的银行应用程序中设置一些细粒度的安全控制。\n\n最后，通过远程连接读取日志的能力将很好地支持与其他银行的集成，而我们的客户可能与这些银行合作。\n\
  \n开始吧！\n\n## 构建骨架 Web 应用程序\n\n为了开始，我们需要一个 Web 应用程序的外壳，以便我们可以开始填充细节。我们之前使用 CherryPy\
  \ (http://cherrypy.org) 构建了一个简单的 Web 应用，因此让我们用它来启动。\n\n1. 首先，让我们编写一个主应用程序来引导 CherryPy\
  \ 以及我们的应用程序上下文。\n\n```\nimport cherrypy\nimport os\nimport ctx\nfrom springpython.context\
  \ import ApplicationContext\n\nif __name__ == '__main__':\n    cherrypy.config.update({'server.socket_port':\
  \ 8009})\n\n    applicationContext =\n        ApplicationContext(ctx.SpringBankAppContext())\n\
  \n    cherrypy.tree.mount(\n        applicationContext.get_object(\"view\"),\n \
  \       '/',\n        config=None)\n\n    cherrypy.engine.start()\n    cherrypy.engine.block()\n\
  ```\n\n你可能会注意到，它在包 ctx 中查找 SpringBankAppContext 以找到视图对象。\n\n2. 让我们编写一个简单的纯 Python\
  \ IoC 容器来创建我们需要的 CherryPy 视图对象。\n\n```\nfrom springpython.config import PythonConfig,\
  \ Object\n\nfrom app import *\n\nclass SpringBankAppContext(PythonConfig):\n   \
  \ def __init__(self):\n        PythonConfig.__init__(self)\n\n    @Object\n    def\
  \ view(self):\n        return SpringBankView()\n```\n\n这是最简单的容器。我们基本上只有一个对象 view，它返回\
  \ SpringBankView 的一个实例。以后如果需要其他注入对象或功能，我们可以轻松更新此配置。\n\n3. 现在让我们编写一个简单的视图层，具有 Hello,\
  \ world 风格的打开页面。\n\n```\nimport cherrypy\n\nclass SpringBankView(object):\n\n  \
  \  @cherrypy.expose\n    def index(self, args=None):\n        return \"\"\"\n  \
  \          Welcome to SpringBank!\n        \"\"\"\n```\n\n4. 让我们启动应用程序看看它是什么样子。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_186_0.png)\n\n5. 现在让我们访问 http://127.0.0.1:8009\
  \ 的广告位置。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_186_1.png)\n\n这是我们 Web 应用程序的起点。从这里开始，我们将在本章剩余部分处理我们刚刚描述的功能。\n\
  \n## 保护应用程序\n\n在开始之前，让我们先插入一些安全功能。在安全章节中，我们讨论了安全功能如何方便地在事后添加。但如果一开始就先实现会更好。我们将通过添加一个简单的登录页面并硬编码三个账户来实现：客户、银行经理和银行主管。\n\
  \n1. 让我们修改引导主程序，添加一些额外功能以启用安全。\n\n```\nimport cherrypy\nimport os\nfrom springpython.context\
  \ import ApplicationContext\nfrom springpython.security.context import *\n\nfrom\
  \ ctx2 import *\n\nif __name__ == '__main__':\n    cherrypy.config.update({'server.socket_port':\
  \ 8009})\n\n    ctx = ApplicationContext(SpringBankAppContext())\n\n    SecurityContextHolder.setStrategy(SecurityContextHolder.MODE_GLOBAL)\n\
  \    SecurityContextHolder.getContext()\n\n    conf = {\"/\": {\"tools.sessions.on\"\
  :True,\n                  \"tools.filterChainProxy.on\":True}}\n\n    cherrypy.tree.mount(\n\
  \        ctx.get_object(\"view\"),\n        '/',\n        config=conf)\n\n    cherrypy.engine.start()\n\
  \    cherrypy.engine.block()\n```\n\n首先，我们需要初始化存储在 SecurityContextHolder 中的安全上下文设置。CherryPy\
  \ 要求的另一件事是打开 HTTP 会话。我们还必须激活 filterChainProxy。Spring Python 的 FilterChainProxy 在我们的应用程序上下文中设置后，会自动注册为\
  \ CherryPy 工具。\n\n2. 让我们将安全组件添加到我们的 IoC 配置中。\n\n```python\nfrom springpython.config\
  \ import PythonConfig, Object\nfrom springpython.security.providers import *\nfrom\
  \ springpython.security.providers.dao import *\nfrom springpython.security.userdetails\
  \ import *\nfrom springpython.security.vote import *\nfrom springpython.security.web\
  \ import *\nfrom springpython.security.cherrypy3 import *\n\nfrom app2 import *\n\
  \nclass SpringBankAppContext(PythonConfig):\n    def __init__(self):\n        PythonConfig.__init__(self)\n\
  \n    @Object\n    def view(self):\n        view = SpringBankView()\n        view.auth_provider\
  \ = self.auth_provider()\n        view.filter = self.auth_processing_filter()\n\
  \        view.http_context_filter = self.\n        httpSessionContextIntegrationFilter()\n\
  \        return view\n\n    @Object\n    def filterChainProxy(self):\n        return\
  \ CP3FilterChainProxy(filterInvocationDefinitionSource =\n            [\n      \
  \      (\"/login.*\",  [\"httpSessionContextIntegrationFilter\"]),\n           \
  \ (\"/.*\",\n                [\"httpSessionContextIntegrationFilter\",\n       \
  \         \"exception_translation_filter\",\n                \"auth_processing_filter\"\
  ,\n                \"filter_security_interceptor\"])\n            ])\n```\n\n@Object\n\
  def httpSessionContextIntegrationFilter(self):\n    filter = HttpSessionContextIntegrationFilter()\n\
  \    filter.sessionStrategy = self.session_strategy()\n    return filter\n\n@Object\n\
  def session_strategy(self):\n    return CP3SessionStrategy()\n\n@Object\ndef exception_translation_filter(self):\n\
  \    filter = ExceptionTranslationFilter()\n    filter.authenticationEntryPoint\
  \ = self.auth_filter_entry_pt()\n    filter.accessDeniedHandler = self.accessDeniedHandler()\n\
  \    return filter\n\n@Object\ndef auth_filter_entry_pt(self):\n    filter = AuthenticationProcessingFilterEntryPoint()\n\
  \    filter.loginFormUrl = \"/login\"\n    filter.redirectStrategy = self.redirectStrategy()\n\
  \    return filter\n\n@Object\ndef accessDeniedHandler(self):\n    handler = SimpleAccessDeniedHandler()\n\
  \    handler.errorPage = \"/accessDenied\"\n    handler.redirectStrategy = self.redirectStrategy()\n\
  \    return handler\n\n@Object\ndef redirectStrategy(self):\n    return CP3RedirectStrategy()\n\
  \n@Object\ndef auth_processing_filter(self):\n    filter = AuthenticationProcessingFilter()\n\
  \    filter.auth_manager = self.auth_manager()\n    filter.alwaysReauthenticate\
  \ = False\n\n\n\n```python\nreturn filter\n\n@Object\ndef auth_manager(self):\n\
  \    auth_manager = AuthenticationManager()\n    auth_manager.auth_providers = [self.auth_provider()]\n\
  \    return auth_manager\n\n@Object\ndef auth_provider(self):\n    provider = DaoAuthenticationProvider()\n\
  \    provider.user_details_service = self.user_details_service()\n    provider.password_encoder\
  \ = PlaintextPasswordEncoder()\n    return provider\n\n@Object\ndef user_details_service(self):\n\
  \    user_details_service = InMemoryUserDetailsService()\n    user_details_service.user_dict\
  \ = {\n        \"alice\": (\"alicespassword\", [\"ROLE_CUSTOMER\"], True),\n   \
  \     \"bob\": (\"bobspassword\", [\"ROLE_MGR\"], True),\n        \"carol\": (\"\
  carolspassword\", [\"ROLE_SUPERVISOR\"], True)\n    }\n    return user_details_service\n\
  \n@Object\ndef filter_security_interceptor(self):\n    filter = FilterSecurityInterceptor()\n\
  \    filter.auth_manager = self.auth_manager()\n    filter.access_decision_mgr =\
  \ self.access_decision_mgr()\n    filter.sessionStrategy = self.session_strategy()\n\
  \    filter.obj_def_source = [\n        (\"/*\", [\"ROLE_CUSTOMER\", \"ROLE_MGR\"\
  , \"ROLE_SUPERVISOR\"])\n    ]\n    return filter\n\n@Object\ndef access_decision_mgr(self):\n\
  \    access_decision_mgr = AffirmativeBased()\n    access_decision_mgr.allow_if_all_abstain\
  \ = False\n    access_decision_mgr.access_decision_voters = [RoleVoter()]\n    return\
  \ access_decision_mgr\n```\n\n这无疑是要添加到我们的应用程序上下文中的大量代码。Spring Python 需要很多步骤来添加安全组件，这与\
  \ Spring Security 项目的命运相同。他们花费了相当多的精力来减少为典型配置配置安全所需的代码量。希望未来 Spring Python 也能以类似的方式得到改进。\n\
  \n在此配置中，我们使用 InMemoryUserDetailsService 来硬编码三个用户：alice（客户）、bob（银行经理）和 carol（银行主管）。这样在开发应用程序时就无需配置数据库。\n\
  \n- 3. 让我们更改核心应用，使其具有登录页面并能够处理登录和注销。\n\n```python\nimport cherrypy\n\nfrom springpython.security\
  \ import *\nfrom springpython.security.providers import *\nfrom springpython.security.context\
  \ import *\n\nclass SpringBankView(object):\n\n    def __init__(self):\n       \
  \ self.filter = None\n        self.auth_provider = None\n        self.http_context_filter\
  \ = None\n\n    @cherrypy.expose\n    def index(self):\n        return \"\"\"\n\
  \            Welcome to SpringBank!\n            <p>\n            <p>\n        \
  \    <a href=\"logout\">Logout</a>\n        \"\"\"\n\n    @cherrypy.expose\n   \
  \ def login(self, from_page=\"/\", login=\"\", password=\"\", error_msg=\"\"):\n\
  \        if login != \"\" and password != \"\":\n            try:\n            \
  \    self.attempt_auth(login, password)\n                raise cherrypy.HTTPRedirect(from_page)\n\
  \            except AuthenticationException, e:\n                raise cherrypy.HTTPRedirect(\n\
  \                    \"?login=%s&error_msg=Username/password failure\"\n       \
  \             % login)\n\n                return \"\"\"\n                    %s<p>\n\
  \                    <form method=\"POST\" action=\"\">\n                    <table>\n\
  \                        <tr>\n                            <td>Login:</td>\n   \
  \                         <td><input type=\"text\" name=\"login\"\n            \
  \                    value=\"%s\"/></td>\n                        </tr>\n      \
  \                  <tr>\n                            <td>Password:</td>\n      \
  \                      <td>\n                                <input type=\"password\"\
  \ name=\"password\"/>\n                            </td>\n                     \
  \   </tr>\n                    </table>\n                    <input type=\"hidden\"\
  \ name=\"from_page\"\n                        value=\"%s\"/><br/>\n            \
  \        <input type=\"submit\"/>\n                    </form>\n               \
  \ \"\"\" % (error_msg, login, from_page)\n\n    def attempt_auth(self, username,\
  \ password):\n        token = UsernamePasswordAuthenticationToken(username,\n  \
  \          password)\n        SecurityContextHolder.getContext().authentication\
  \ = \\\n            self.auth_provider.authenticate(token)\n        self.http_context_filter.saveContext()\n\
  \n    @cherrypy.expose\n    def logout(self):\n        self.filter.logout()\n\n\
  \        self.http_context_filter.saveContext()\n        raise cherrypy.HTTPRedirect(\"\
  /\")\n```\n\n这里我们稍微修改了 index，使其打印我们的“欢迎”信息，同时还提供了一个注销的超链接。我们还添加了一个 /login 链接，该链接要么尝试将用户登录，要么显示\
  \ HTML 表单以便用户尝试登录。\n\n- 4. 在进行这些更改后，让我们重新启动应用并打开浏览器。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_193_0.png)\n\
  \n如你所见，我们现在看到的是一个非常简单的登录屏幕。如果查看我们更新的应用程序正在运行的 shell，我们可以看到发生了什么。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_193_1.png)\n\
  \n我们将浏览器指向根 URL，但 Spring Python 的安全过滤器注意到我们没有凭据，因此将其重定向到 /login。\n\n- 5. 让我们以银行经理\
  \ Bob 的身份登录。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_194_0.png)\n\n现在我们已登录到\
  \ SpringBank 网站。有了安全措施，我们应该能够轻松开始添加更多功能并控制谁可以访问什么。\n\n## 构建一些基本客户功能\n\n为了让我们的银行网站运行起来，我们需要开始允许客户开设银行账户。这是仅客户可见的功能。\n\
  \n- 1. 首先，我们需要更新主页面，以便当客户 Alice 登录时，她可以选择开设银行账户。我们可以通过修改 `SpringBankView` 中的 `index`\
  \ 函数来实现，根据用户的凭据提供选项。\n\n```python\n@cherrypy.expose\ndef index(self, message=\"\"\
  ):\n    results = \"\"\"\n        <h1>Welcome to SpringBank!</h1>\n        <p>\n\
  \        %s\n        <p>\n    \"\"\" % message\n\n    if \"ROLE_CUSTOMER\" in \\\
  \n        SCH.getContext().authentication.granted_auths:\n        results += \"\"\
  \"\n            <h2>Customer Options</h2>\n            <ul>\n                <li><a\
  \ href=\"openAccount\">Open Account</a></li>\n            </ul>\n        \"\"\"\n\
  \n    results += \"\"\"\n        <a href=\"logout\">Logout</a>\n    \"\"\"\n   \
  \ return results\n\n@cherrypy.expose\ndef openAccount(self, account=\"\", desc=\"\
  \"):\n    if account != \"\" and desc != \"\":\n        self.controller.open_account(account,\
  \ desc)\n        raise cherrypy.HTTPRedirect(\"/?message=Account created successfully\"\
  )\n\n    return \"\"\"\n    <form method=\"POST\" action=\"\">\n    <table>\n  \
  \      <tr>\n            <td>Account Name</td>\n            <td><input type=\"text\"\
  \ name=\"account\"/></td>\n        </tr>\n        <tr>\n            <td>Description</td>\n\
  \            <td><input type=\"text\" name=\"desc\"/></td>\n        </tr>\n    </table>\n\
  \    <input type=\"submit\"/>\n    </form>\n    <a href=\"/\">Cancel</a>\n    \"\
  \"\"\n```\n\n要使其工作，我们需要修改其中一个导入语句：\n\n```python\nfrom springpython.security.context\
  \ import SecurityContextHolder as SCH\n```\n\n## 案例研究 I – 将 Spring Python 与您的 Web\
  \ 应用程序集成\n\n基本上，index 函数现在会检查用户的 granted_auths，如果他们拥有 ROLE_CUSTOMER，就会显示客户选项。提供的第一个选项是一个链接，可调用\
  \ openAccount 函数。如下面所示，如果 Alice 登录，她现在会看到这个额外选项。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_196_0.png)\n\
  \n点击该链接会将用户带到一个页面，在那里他们可以填写申请新账户所需的信息。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_196_1.png)\n\
  \n当页面提交时，信息会被发送到控制器。这个代码片段有一个大问题：没有控制器！如果你点击按钮，它会生成错误，表明我们需要填充支持功能。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_197_0.png)\n\
  \n- 2. 现在让我们创建一个控制器来处理诸如开设新银行账户之类的请求。\n\n```python\nclass SpringBankController(object):\n\
  \    def __init__(self, factory):\n        self.factory = factory\n        self.dt\
  \ = DatabaseTemplate(self.factory)\n\n    def open_account(self, account, desc):\n\
  \        self.dt.execute(\"\"\"\n            INSERT INTO account\n            (account,\
  \ description, balance)\n            VALUES\n            (?, ?, 0.0)\"\"\", (account,\
  \ desc))\n```\n\n此控制器有一个业务功能：open_account。它利用 DatabaseTemplate 来管理此操作。如你所见，我们已将其编码为以\
  \ $0.00 的余额初始化新账户。它还设计为依赖于依赖注入来提供必要的连接工厂。\n\n\n\n### 3. 通过注入连接工厂将控制器与我们的 IoC 配置连接起来\n\
  \n```\n@Object\ndef controller(self):\n    return SpringBankController(self.factory())\n\
  ```\n\n```\n@Object\ndef view(self):\n    view = SpringBankView()\n    view.auth_provider\
  \ = self.auth_provider()\n    view.filter = self.auth_processing_filter()\n    view.http_context_filter\
  \ = self.httpSessionContextIntegrationFilter()\n    view.controller = self.controller()\n\
  \    return view\n```\n\n```\n@Object\ndef factory(self):\n    factory = MySQLConnectionFactory()\n\
  \    factory.username = \"springbank\"\n    factory.password = \"springbank\"\n\
  \    factory.hostname = \"localhost\"\n    factory.db = \"springbank\"\n    return\
  \ factory\n```\n\n这里我们有了新的控制器对象以及工厂对象，后者允许我们的控制器访问数据库。我们稍微修改了视图对象，使其注入了控制器的副本。\n\
  \n### 4. 调整 SpringBankView 以便可以注入控制器\n\n```\nclass SpringBankView(object):\n   \
  \ def __init__(self):\n        self.filter = None\n        self.auth_provider =\
  \ None\n        self.http_context_filter = None\n        self.controller = None\n\
  ```\n\n现在我们的 SpringBankView 已持有控制器的句柄，使其能够在需要时进行数据库调用。然而，还缺少一个部分。我们需要设置一个数据库。\n\n\
  ### 5. 我们可以使用以下脚本初始化 MySQL 数据库\n\n```\nDROP DATABASE IF EXISTS springbank;\n\nCREATE\
  \ DATABASE springbank;\n\nGRANT ALL ON springbank.* TO springbank@localhost IDENTIFIED\
  \ BY 'springbank';\n\nUSE springbank;\n\nCREATE TABLE account (\n    id INT(4) UNSIGNED\
  \ NOT NULL AUTO_INCREMENT PRIMARY KEY,\n    description VARCHAR(30),\n    balance\
  \ DECIMAL(10,2)\n);\n```\n\n如果我们使用 MySQL 的 root 账户运行它，应该会设置我们的账户表。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_199_0.png)\n\
  \n### 6. 现在让我们尝试创建该银行账户\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_199_1.png)\n\
  \n成功！如果仔细查看 SpringBankView 的 index 方法的修订版本，你会注意到一个可选的消息参数。这让我们可以在完成任何操作后重定向用户到首页的同时传递状态消息。在我们的情况下，我们创建了一个余额为\
  \ $0.00 的银行账户。\n\n我们目前还看不到列出的现有银行账户，但你仍然可以从命令行检查数据库以验证我们的操作是否成功。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_200_0.png)\n\
  \n## 编写更多功能\n\n到目前为止，我们已经从前到后实现了一些需求。我们使用 CherryPy 构建了视图层。接下来，我们配置了安全措施以保护站点。然后我们完全实现了一个客户功能，使其将新账户存储在数据库中。\n\
  \n编写更多功能遵循类似的模式。步骤执行的顺序取决于个人喜好。完全可以使用自动化测试编写整个后端，然后再用 Web 层对其进行美化。在我们的例子中，我们采用了更具示范性的风格，即先构建界面，然后再完善后端。无论哪种方式，都很容易迭代并看到\
  \ Spring Python 的 IoC 容器如何很好地将安全、视图和控制器逻辑解耦。\n\n现在让我们快进到所有客户功能都已实现的地步。\n\n## 使用更多功能更新主页面\n\
  \n我们更新了 SpringBankView 中的 index 页面，使其列出客户的当前账户以及可用的其他功能。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_201_0.png)\n\
  \n在此示例中，Alice 已创建了两个账户。在之前的版本中，它们未被列出，但现在列出了。\n\n```\n@cherrypy.expose\ndef index(self,\
  \ message=\"\"):\n    results = \"\"\"\n        <h1>Welcome to SpringBank!</h1>\n\
  \            <p>\n            %s\n            <p>\n    \"\"\" % message\n\n    if\
  \ \"ROLE_CUSTOMER\" in \\\n        SCH.getContext().authentication.granted_auths:\n\
  \        results += \"\"\"\n            <h2>Existing Accounts</h2>\n<table border=\"\
  1\">\n    <tr><th>Account</th><th>Description\n    </th><th>Balance</th></tr>\n\"\
  \"\"\n\nfor account in self.controller.get_accounts(\n    SCH.getContext().authentication.username):\n\
  \    results += '''\n    <tr>\n    <td>%s</td><td><a href=\"history?id=%s\">%s</a>\n\
  \    </td><td>%s</td>\n    </tr>\n    ''' % (account[\"id\"], account[\"id\"],\n\
  \        account[\"description\"], account[\"balance\"])\n\nresults += \"\"\"\n\
  \    </table>\n    <h2>Customer Options</h2>\n    <ul>\n        <li><a href=\"openAccount\"\
  >Open Account</a></li>\n        <li><a href=\"closeAccount\">Close Account</a></li>\n\
  \        <li><a href=\"withdraw\">Withdraw Money</a></li>\n        <li><a href=\"\
  deposit\">Deposit Money</a></li>\n        <li><a href=\"transfer\">Transfer</a></li>\n\
  \    </ul>\n\"\"\"\n\nresults += \"\"\"\n    <a href=\"logout\">Logout</a>\n\"\"\
  \"\nreturn results\n```\n\n如你所见，中间嵌入了一个 for 循环，用于生成 HTML 表格中的行，列出用户拥有的账户。get_accounts\
  \ 被委托给控制器。\n\n```\ndef get_accounts(self, username):\n    return self.dt.query(\"\
  \"\"\n    SELECT id, description, balance\n    FROM account\n    WHERE owner = ?\n\
  \    AND status = 'OPEN'\"\"\", (username,), \n    DictionaryRowMapper())\n```\n\
  \n每一行都包含一个链接以查看该账户的历史记录，屏幕底部是其他新功能的链接。\n\n## 完善开户功能\n\n我们通过将新账户标记为 OPEN 状态来修改了 openAccount\
  \ 的后端。\n\n```\ndef open_account(self, description):\n    self.dt.execute(\"\"\"\n\
  \        INSERT INTO account\n        (description, balance, owner, status)\n  \
  \      VALUES\n        (?, 0.0, ?, 'OPEN')\"\"\", (description,\\\n            SCH.getContext().authentication.username))\n\
  \n    self.log(\"TX\", self.get_latest_account(), \"Opened account %s\"\n% description)\n\
  ```\n\n我们还添加了写入交易日志条目的额外步骤。为了支持写入日志条目，控制器必须检索为该客户创建的最新账户。\n\n```\ndef get_latest_account(self):\n\
  \    return self.dt.query_for_long(\"\"\"\n        SELECT max(id)\n        FROM\
  \ account\n        WHERE owner = ?\n        AND status = 'OPEN'\"\"\", \\\n    \
  \    (SCH.getContext().authentication.username,))\n```\n\nopen_account 以及其他几个控制器操作使用以下代码来写入日志条目。\n\
  \n```\ndef log(self, type, account, message):\n    self.dt.execute(\"\"\"\n    \
  \    INSERT INTO log\n        (type, account, message)\n        values\n       \
  \ (?, ?, ?)\"\"\", \\\n        (type, account, message))\n```\n\n## 添加关闭账户功能\n\n\
  我们在 `SpringBankView` 中添加了 `closeAccount`，以便客户在账户余额为零时关闭现有账户。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_204_0.png)\n\
  \n```\n@cherrypy.expose\ndef closeAccount(self, id=\"\"):\n    if id != \"\":\n\
  \        self.controller.close_account(id)\n        raise cherrypy.HTTPRedirect(\"\
  /?message=Account successfully closed\")\n\n    results = \"\"\"\n        <h2>Close\
  \ an Account</h2>\n        <form method=\"POST\" action=\"\">\n        <table border=\"\
  1\">\n            <tr><th>Account</th></tr>\n    \"\"\"\n\n    for account in self.controller.closeable_accounts(SCH.getContext().authentication.username):\n\
  \        results += \"\"\"\n            <tr><td><a href=\"closeAccount?id=%s\">%s\
  \ - %s</a></td></tr>\n        \"\"\" % (account[\"id\"], account[\"id\"], account[\"\
  description\"])\n\n    results += \"\"\"\n        </table>\n        </form>\n  \
  \      <a href=\"/\">Cancel</a>\n    \"\"\"\n    return results\n```\n\n查找 closeable_accounts\
  \ 以及完成 close_account 操作都委托给了控制器。\n\n```\ndef closeable_accounts(self, username):\n\
  \    return self.dt.query(\"\"\"\n        SELECT id, description\n        FROM account\n\
  \        WHERE owner = ?\n        AND balance = 0.0\n        AND status = 'OPEN'\"\
  \"\", (username,), \n        DictionaryRowMapper())\n\ndef close_account(self, id):\n\
  \    self.dt.execute(\"\"\"\n        UPDATE account\n        SET status = 'CLOSED'\n\
  \        WHERE id = ?\"\"\", (id,))\n    self.log(\"TX\", id, \"Closed account\"\
  )\n```\n\n开设新账户会在 ACCOUNT 表中插入一行。然而，关闭账户并不意味着删除同一行。相反，其状态会被更新为 CLOSED。\n\n## 添加取款功能\n\
  \n我们在 SpringBankView 中添加了 withdraw，以便客户从现有账户中取款。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_205_0.png)\n\
  \n\n\n```\n@cherrypy.expose\ndef withdraw(self, id=\"\", amount=\"\"):\n    if id\
  \ != \"\" and amount != \"\":\n        self.controller.withdraw(id, float(amount))\n\
  \    raise cherrypy.HTTPRedirect(\"/?message=Successfully withdrew %s\" % amount)\n\
  \n    results = \"\"\"\n        <h2>Withdraw Money</h2>\n        <form method=\"\
  POST\" action=\"\">\n        <table border=\"1\">\n            <tr>\n          \
  \      <td>Amount</td>\n                <td><input type=\"text\" name=\"amount\"\
  /></td>\n            </tr>\n            <tr><td colspan=\"2\">\n    \"\"\"\n   \
  \ for account in self.controller.get_accounts(SCH.getContext().authentication.username):\n\
  \        results += \"\"\"\n            <input type=\"radio\" name=\"id\" value=\"\
  %s\">%s - %s</input><br/>\n            \"\"\" % (account[\"id\"], account[\"id\"\
  ], account[\"description\"])\n\n        results += \"\"\"\n            </td></tr>\n\
  \            <tr><td colspan=\"2\"><input type=\"submit\"/></td></tr>\n        </form>\n\
  \    \"\"\"\n\n    return results\n```\n\n当用户点击提交时，withdraw 会委托给控制器。\n\n```\ndef\
  \ withdraw(self, id, amount):\n    self.dt.execute(\"\"\"\n        UPDATE account\n\
  \        SET balance = balance - ?\n        WHERE id = ?\"\"\", (amount, id))\n\
  \    self.log(\"TX\", id, \"Withdrew %s\" % amount)\n```\n\n## 添加存款功能\n\n我们在 SpringBankView\
  \ 中添加了 `deposit`，以便客户向现有账户存款。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_207_0.png)\n\
  \n```\n@cherrypy.expose\ndef deposit(self, id=\"\", amount=\"\"):\n    if id !=\
  \ \"\" and amount != \"\":\n        self.controller.deposit(id, float(amount))\n\
  \    raise cherrypy.HTTPRedirect(\"/?message=Successfully deposited %s\" % amount)\n\
  \n    results = \"\"\"\n        <h2>Deposit Money</h2>\n        <form method=\"\
  POST\" action=\"\">\n        <table border=\"1\">\n            <tr>\n          \
  \      <td>Amount</td>\n                <td><input type=\"text\" name=\"amount\"\
  /></td>\n            </tr>\n            <tr><td colspan=\"2\">\n    \"\"\"\n\n \
  \   for account in self.controller.get_accounts(SCH.getContext().authentication.username):\n\
  \        results += \"\"\"\n            <input type=\"radio\" name=\"id\" value=\"\
  %s\">%s - %s</input><br/>\n            \"\"\" % (account[\"id\"], account[\"id\"\
  ], account[\"description\"])\n\n        results += \"\"\"\n            </td></tr>\n\
  \            <tr><td colspan=\"2\"><input type=\"submit\"/></td></tr>\n        </form>\n\
  \    \"\"\"\n\n    return results\n```\n\n当用户点击提交时，deposit 会委托给控制器。\n\n```\ndef\
  \ deposit(self, id, amount):\n    self.dt.execute(\"\"\"\n        UPDATE account\n\
  \        SET balance = balance + ?\n        WHERE id = ?\"\"\", (amount, id))\n\
  \    self.log(\"TX\", id, \"Deposited %s\" % amount)\n```\n\n## 添加转账功能\n\n我们在 SpringBankView\
  \ 中添加了 transfer，以便客户在账户之间转账。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_208_0.png)\n\
  \n```\n@cherrypy.expose\ndef transfer(self, amount=\"\", source=\"\", target=\"\"\
  ):\n    if amount != \"\" and source != \"\" and target != \"\":\n        self.controller.transfer(amount,\
  \ source, target)\n        raise cherrypy.HTTPRedirect(\"/?message=Successful transfer\"\
  )\n\n    results = \"\"\"\n        <h2>Transfer Money</h2>\n        <form method=\"\
  POST\" action=\"\">\n        <table border=\"1\">\n            <tr>\n          \
  \      <td>Amount</td>\n                <td><input type=\"text\" name=\"amount\"\
  /></td>\n            </tr>\n    \"\"\"\n\n    accounts = self.controller.get_accounts(SCH.getContext().authentication.username)\n\
  \n    for param in [\"source\", \"target\"]:\n        results += '<tr><td>%s</td><td>'\
  \ % (param[0].upper() + param[1:])\n        for account in accounts:\n         \
  \   results += \"\"\"\n                <input type=\"radio\" name=\"%s\" value=\"\
  %s\">%s - %s</input><br/>\n            \"\"\" % (param, account[\"id\"], account[\"\
  id\"], account[\"description\"])\n            results += \"</td></tr>\"\n\n    \
  \    results += \"\"\"\n            <tr><td colspan=\"2\"><input type=\"submit\"\
  /></td></tr>\n        </form>\n        \"\"\"\n\n    return results\n```\n\n当用户点击提交时，transfer\
  \ 会委托给控制器。\n\n```\ndef transfer(self, amount, source, target):\n    self.withdraw(source,\
  \ amount)\n    self.deposit(target, amount)\n```\n\ntransfer 方便地复用了 withdraw 和 deposit。\n\
  \n## 显示账户历史\n\n最后添加的面向客户的功能是查看账户历史的能力。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_210_0.png)\n\
  \n```\n@cherrypy.expose\ndef history(self, id):\n    results = \"\"\"\n        <table\
  \ border=\"1\">\n    \"\"\"\n\n    for entry in self.controller.history(id):\n \
  \       results += \"\"\"\n            <tr><td>%s</td><td>%s</td></tr>\n       \
  \ \"\"\" % (entry[\"date\"], entry[\"message\"])\n\n    results += \"\"\"\n    \
  \    </table>\n    \"\"\"\n\n    return results\n```\n\n当用户点击提交时，history 会委托给控制器。\n\
  \n```\ndef history(self, id):\n    return self.dt.query(\"\"\"\n        SELECT type,\
  \ date, message\n        FROM log\n        WHERE log.account = ?\n        AND log.type\
  \ = 'TX'\"\"\", (id,),\n        DictionaryRowMapper())\n```\n\n## 客户功能的问题\n\n在此版本的功能中，我们已经初步实现了一些有用的银行功能。然而，仍有一些问题需要处理。\n\
  \n- 没有足够的保护措施防止其他客户访问 Alice 的账户并转移资金。\n- 从账户取款没有透支保护。这也会影响转账，因为它们复用了 withdraw 函数。一个简单的解决方案是，如果请求金额超过余额则失败。\n\
  - 转账应该是事务性的，以避免资金泄漏。\n\n## 保护 Alice 的账户\n\n如果我们以 Alice 的身份登录，可以查看 Checking 账户的历史记录。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_211_0.png)\n\n这是可以的。然而，如果有另一个客户，安全性可能不如你想象的那样。让我们调整上下文，使另一个客户\
  \ \"Dave\" 存在。\n\n```\n@Object\ndef user_details_service(self):\n    user_details_service\
  \ = InMemoryUserDetailsService()\n    user_details_service.user_dict = {\n     \
  \   \"alice\": (\"alicespassword\", [\"ROLE_CUSTOMER\"], True),\n        \"bob\"\
  : (\"bobspassword\", [\"ROLE_MGR\"], True),\n        \"carol\": (\"carolspassword\"\
  , [\"ROLE_SUPERVISOR\"], True),\n        \"dave\": (\"davesspassword\", [\"ROLE_CUSTOMER\"\
  ], True)\n    }\n    return user_details_service\n```\n\n## 案例研究 I – 将 Spring Python\
  \ 与您的 Web 应用程序集成\n\n查看 Alice 的账户历史后，我们可以轻松地将 URL 从浏览器复制到剪贴板，注销，然后以 Dave 的身份重新登录。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_212_0.png)\n\nDave 目前还没有账户。然而，Dave 可以粘贴该\
  \ URL 并轻松查看 Alice 的账户历史。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_212_1.png)\n\
  \n这是因为这两个用户都拥有 ROLE_CUSTOMER。这意味着我们需要编写一个自定义的 AccessDecisionVoter 来决定某个记录是否可以被当前用户查看。\n\
  \n安全章节向我们展示了如何编写自定义身份验证器。在这种情况下，用户已经通过身份验证。我们需要的是对授权的适当处理。我们的任务要求确认当前登录的用户是否有权限查看当前账户。\n\
  \n- 1. 让我们编写自己的 AccessDecisionVoter。\n\n```\nclass OwnerVoter(AccessDecisionVoter):\n\
  \    def __init__(self, controller=None):\n        self.controller = controller\n\
  \n    def supports(self, attr):\n        \"\"\"This voter will support a list.\"\
  \"\"\n        if isinstance(attr, list) or \\\n            (attr is not None and\
  \ attr == \"OWNER\"):\n            return True\n        else:\n            return\
  \ False\n\n    def vote(self, authentication, invocation, config):\n        \"\"\
  \"Grant access if any of the granted\n        authorities matches any of the required\
  \ roles.\n        \"\"\"\n        results = self.ACCESS_ABSTAIN\n        for attribute\
  \ in config:\n            if self.supports(attribute):\n                results\
  \ = self.ACCESS_DENIED\n                id = cgi.parse_qs(\n                   \
  \ invocation.environ[\"QUERY_STRING\"])[\"id\"][0]\n                if self.controller.get_username(id)\
  \ == \\\n                    authentication.username:\n                    return\
  \ self.ACCESS_GRANTED\n\n        return results\n```\n\n- OwnerVoter 需要一个 supports\
  \ 方法来确定是否进行投票。在这种情况下，如果以列表形式给出安全配置，并且其中一个列表值是 OWNER，则会投票。\n- 为了投票，投票器会提供用户身份验证凭据的副本，以及对调用对象的句柄，其中包含所有\
  \ Web 请求参数和安全角色配置。\n\n\n\n投票者将其结果初始化为 ACCESS_ABSTAIN。它遍历角色列表，并检查其中是否匹配 OWNER。如果匹配，则将结果更改为\
  \ ACCESS_DENIED。然后，它检查是否存在 id 参数，如果有则检索其值。它请求控制器查找与账户 id 关联的用户，如果与当前用户的用户名匹配，则将结果更新为\
  \ ACCESS_GRANTED。\n\n- 2. 向控制器添加一个方法以查找账户的用户名。\n\n```\ndef get_username(self, id):\n\
  \    return self.dt.query_for_object(\"\"\"\n        SELECT owner\n        FROM\
  \ account\n        WHERE id = ?\n        AND status = 'OPEN'\"\"\", (id,), str)\n\
  ```\n\n- 3. 现在我们需要将 OwnerVoter 集成到上下文的 AccessDecisionManager 配置中。\n\n```\n@Object\n\
  def access_decision_mgr(self):\n    access_decision_mgr = AffirmativeBased()\n \
  \   access_decision_mgr.allow_if_all_abstain = False\n    access_decision_mgr.access_decision_voters\
  \ = [RoleVoter(),\n            OwnerVoter(self.controller())]\n    return access_decision_mgr\n\
  ```\n\n如你所见，我们刚刚向 access_decision_voters 列表中添加了一个 OwnerVoter 实例。OwnerVoter 需要持有控制器的句柄，以便它可以查询与账户关联的用户名。\n\
  \n- 4. 更新 filter_security_interceptor，使历史记录请求通过 OwnerVoter 路由。\n\n```\n@Object\n\
  def filter_security_interceptor(self):\n    filter = FilterSecurityInterceptor()\n\
  \    filter.auth_manager = self.auth_manager()\n    filter.access_decision_mgr =\
  \ self.access_decision_mgr()\n    filter.sessionStrategy = self.session_strategy()\n\
  \    filter.obj_def_source = [\n        (\"/history.*\", [\"OWNER\"]),\n       \
  \ (\"/.*\", [\"ROLE_CUSTOMER\", \"ROLE_MGR\", \"ROLE_SUPERVISOR\"])\n    ]\n   \
  \ return filter\n```\n\n注意我们为 /history.* 添加了一条规则。因为 OWNER 不以 ROLE_ 开头，所以 RoleVoter\
  \ 不会对它进行投票。只有 OwnerVoter 会检查此规则以确定当前用户是否被授权访问。\n\n由于拦截器从第一条规则开始并迭代直到找到匹配项，因此重要的是将专用规则放在顶部，而更通用的规则放在底部。\n\
  \n- 5. 在视图级别添加一个 accessDenied 页面，以便当 Dave 尝试访问 Alice 账户的历史记录时，由于缺乏所有权而被重定向。\n\n\
  ```\n@cherrypy.expose\ndef accessDenied(self):\n    return \"\"\"\n    <h2>You are\
  \ trying to access\n    an un-authorized page.</h2>\n    \"\"\"\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_215_0.png)\n\
  \n我们现在已基于所有权保护了页面。这样，只有账户持有人才能查看自己的历史记录。将基于 id 的其他页面使用相同的 OwnerVoter 进行保护作为练习留给读者。\n\
  \n## 为取款添加透支保护\n\n最简单的业务规则之一是不允许人们从账户中提取超过现有金额的资金。\n\n- 1. 修改 withdraw 操作，先检索账户余额并将其与金额进行比较，如果资金不足则抛出异常。\n\
  \n```\ndef withdraw(self, id, amount):\n    balance = self.dt.query(\"\"\"\n   \
  \     SELECT balance\n        FROM account\n        WHERE id = ?\"\"\", (id,),\n\
  \        DictionaryRowMapper())[0][\"balance\"]\n    if float(balance) < amount:\n\
  \        raise BankException(\"Insufficient balance in acct %s\" % id)\n    self.dt.execute(\"\
  \"\"\n        UPDATE account\n        SET balance = balance - ?\n        WHERE id\
  \ = ?\"\"\", (amount, id))\n    self.log(\"TX\", id, \"Withdrew %s\" % amount)\n\
  ```\n\n这里一个重要点是没有任何重定向操作发生。此方法不知道其上方的 Web 层。虽然很容易抛出 cherrypy.HTTPRedirect 消息，但最好将其留给视图层。这也会影响转账操作，如果资金不足则会抛出异常。\n\
  \n- 2. 定义一个简单的 BankException 类。\n\n```\nclass BankException(Exception):\n    pass\n\
  ```\n\n- 3. 通过添加 try-except 块来修改 withdraw Web 方法的开头，该块要么重定向并显示成功消息，要么显示错误消息。\n\n\
  ```\n@cherrypy.expose\ndef withdraw(self, id=\"\", amount=\"\"):\n    if id != \"\
  \" and amount != \"\":\n        try:\n            self.controller.withdraw(id, float(amount))\n\
  \            raise cherrypy.HTTPRedirect(\\\n                \"/?message=Successfully\
  \ withdrew %s\" % amount)\n        except BankException, e:\n            raise cherrypy.HTTPRedirect(\"\
  /?message=%s\" % e)\n```\n\n此视图级方法的其余部分保持不变。这提供了一个清晰的行为模式，基于控制器 withdraw 操作中抛出的任何异常。\n\
  \n- 4. 通过添加 try-except 块来修改 transfer Web 方法的开头，该块要么重定向并显示成功消息，要么显示错误消息。\n\n```\n\
  @cherrypy.expose\ndef transfer(self, amount=\"\", source=\"\", target=\"\"):\n \
  \   if amount != \"\" and source != \"\" and target != \"\":\n        try:\n   \
  \         self.controller.transfer(amount, source, target)\n            raise cherrypy.HTTPRedirect(\\\
  \n                \"/?message=Successful transfer\")\n        except BankException,\
  \ e:\n            raise cherrypy.HTTPRedirect(\"/?message=%s\" % e)\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_217_0.png)\n\
  \n取款和转账现在已受到透支保护。\n\n## 使转账具有事务性\n\n需要实现的关键最后一点是提高转账的完整性。对于任何银行操作来说，以原子一致性执行它们至关重要。否则，银行会泄露资金。\n\
  \n- 1. 使用 `@transactional` 装饰器标记控制器的 transfer 操作。\n\n```\n@transactional\ndef transfer(self,\
  \ amount, source, target):\n    self.withdraw(source, amount)\n    self.deposit(target,\
  \ amount)\n```\n\n- 2. 为了使 @transactional 装饰器可用，需要以下导入语句。\n\n```\nfrom springpython.database.transaction\
  \ import *\n```\n\n- 3. 在应用程序上下文中，定义一个 TransactionManager 和一个 AutoTransactionalObject，以便激活\
  \ @transactional 装饰器。\n\n```\n@Object\ndef tx_mgr(self):\n    return ConnectionFactoryTransactionManager(self.factory())\n\
  ```\n\n```\n@Object\ndef transactionalObject(self):\n    return AutoTransactionalObject(self.tx_mgr())\n\
  ```\n\n- 4. 对应用程序上下文的此更改也需要上面显示的相同导入语句。\n\n- 5. 这就是所需的一切。transfer 方法现在利用事务来避免资金泄露。\n\
  \n## 远程访问日志\n\n这是在网上银行中常见的功能，用户希望下载交易历史记录。它允许将数据导入到另一个财务工具中进行分析、审计或复式记账。\n\n对于我们的案例研究，我们将使用\
  \ PyroServiceExporter 进行导出。然而，我们只想公开日志，而不想公开其他任何功能。你可能还记得 PyroServiceExporter 会公开其目标对象的所有方法。为了做到这一点，我们需要一个单独的服务，它可以委托给我们的控制器并代替它进行公开。\n\
  \n- 1. 创建一个面向公众的服务，其中将包含公开服务。\n\n```\nclass SpringBankPublic(object):\n    def __init__(self,\
  \ controller):\n        self.controller = controller\n\n    def history(self, id):\n\
  \        return self.controller.history(id)\n```\n\n该类非常简单。构造函数调用需要控制器的副本。它只有一个方法，即用于公开暴露的方法。\n\
  \n- 2. 使用 Pyro 在应用程序上下文中导出面向公众的服务。\n\n```\n@Object\ndef public_service(self):\n\
  \    return SpringBankPublic(self.controller())\n\n@Object\ndef spring_bank_exporter(self):\n\
  \    exporter = PyroServiceExporter()\n    exporter.service_name = \"springbank\"\
  \n    exporter.service = self.public_service()\n    return exporter\n```\n\n为了运行此代码，必须添加以下导入语句：\n\
  \n```\nfrom springpython.remoting.pyro import *\n```\n\n- 3. 编写一个简单的客户端脚本，远程连接到公共服务并检索其中一个账户。\n\
  \n```\nfrom springpython.config import *\nfrom springpython.remoting.pyro import\
  \ *\n\nclass RemoteClient(PythonConfig):\n    def __init__(self):\n        PythonConfig.__init__(self)\n\
  \n    @Object\n    def client(self):\n        service = PyroProxyFactory()\n   \
  \     service.service_url = \"PYROLOC://localhost:7766/springbank\"\n        return\
  \ service\n\nif __name__ == \"__main__\":\n    from springpython.context import\
  \ ApplicationContext\n    ctx = ApplicationContext(RemoteClient())\n    service\
  \ = ctx.get_object(\"client\")\n    for row in service.history(1):\n        print\
  \ row\n```\n\n此客户端脚本通过 Pyro 模块连接。它请求账户 1 的历史记录，然后以原始形式将其打印到屏幕上。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_219_0.png)\n\
  \n\n\nThis easily fetches the raw data we requested. It is a perfect example of\
  \ how to pipe raw data to other machines.\n\n> > This form of raw data access has\
  \ no security restrictions and would be ill advised for exposure to an untrusted\
  \ network. This type of data would also be more secure if Pyro was configured with\
  \ SSL. However, at this point in time, Spring Python does not support configuring\
  \ Pyro with SSL.\n\n4. Let's create a raw version visible through the web layer.\n\
  \n```\n@cherrypy.expose\ndef raw_history(self, id):\n    return str(self.controller.history(id))\n\
  ```\n\nThis basically takes the results of the history call, converts them to a\
  \ string, and returns it for display with no extra HTML formatting.\n\n5. Let's\
  \ secure raw_history with the same protections as history.\n\n```\n@Object\ndef\
  \ filter_security_interceptor(self):\n    filter = FilterSecurityInterceptor()\n\
  \    filter.auth_manager = self.auth_manager()\n    filter.access_decision_mgr =\
  \ self.access_decision_mgr()\n    filter.sessionStrategy = self.session_strategy()\n\
  \    filter.obj_def_source = [\n        (\"/raw_history.*\", [\"OWNER\"]),\n   \
  \     (\"/history.*\", [\"OWNER\"]),\n        (\"/.*\", [\"ROLE_CUSTOMER\", \"ROLE_MGR\"\
  , \"ROLE_SUPERVISOR\"])\n    ]\n    return filter\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_220_0.png)\n\
  \nNow it's possible to write a web-based script that would get redirected to the\
  \ login page. It must supply login credentials. After that, it can issue the URL\
  \ necessary to retrieve Python's literal array of dictionaries. It could then convert\
  \ it to a Python data structure, and harvest the data.\n\n## Creating audit logs\n\
  \nThe logs that our application is currently writing are banking transactions. Another\
  \ level of logging may be needed to analyze operations the controller is performing.\
  \ This can service either performance analysis, post-mortem analysis, and for generating\
  \ audit reports.\n\nTo do this, let's code an aspect that logs all of the controllers\
  \ (except for the log operation itself).\n\n- 1. Code a simple aspect that logs\
  \ anything except the log method using a copy of the controller.\n\n```\nclass AuditInterceptor(MethodInterceptor):\n\
  \    def __init__(self, controller):\n        self.controller = controller\n\n \
  \   def invoke(self, invocation):\n        results = invocation.proceed()\n    \
  \    if invocation.method_name != \"log\":\n            self.controller.log(\"AUDIT\"\
  , -1,\n                                \"Method: %s Args: %s\" % (\n           \
  \                     invocation.method_name, invocation.args))\n        return\
  \ results\n```\n\nFor this code to work, add the following import statement:\n\n\
  ```\nfrom springpython.aop import *\n```\n\nThis interceptor requires a copy of\
  \ the controller to write its log message. All the other logging done earlier in\
  \ this chapter was of type TX. These log entries are of type AUDIT, meaning they\
  \ won't appear on any user's history or through the remote log access. Also, the\
  \ account number is hard-coded -1 since not all operations have an account.\n\n\
  2. Update the definition of the controller in the application context in order to\
  \ embed this interceptor.\n\n```\n@Object\ndef controller(self):\n    target = SpringBankController(self.factory())\n\
  \    return ProxyFactoryObject(\n        target=target,\n        interceptors=AuditInterceptor(target))\n\
  ```\n\nThis update to the application context smoothly replaces the SpringBankController\
  \ with a ProxyFactoryObject. This proxy points at the real controller object, while\
  \ also plugging in an instance of the AuditInterceptor we just coded.\n\nAlso notice\
  \ that the AuditInterceptor needs a copy of the controller. However, using self.controller()\
  \ like all the other methods would generate a recursive stack error.\n\n3. Let's\
  \ use MySQL's command-line interface to look at the log table after several operations.\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_222_0.png)\n\nThis provides a nice view\
  \ of what happened on a transaction level, and also on a lower level from an auditing\
  \ perspective.\n\nIt is left as an exercise for the reader to change the advice,\
  \ so that only when a manager is viewing an account history does it write an audit\
  \ log entry. It is also an exercise to build a view for the supervisor to view these\
  \ audit trails.\n\n## Summary\n\nWith this case study, we have examined the various\
  \ building blocks of Spring Python and utilized them to develop a simple, yet sophisticated\
  \ banking site. While it may not have all the visual appeal, that task can easily\
  \ be handed over to a web interface expert for improvement.\n\nWhat is important\
  \ is that key functional concepts have been implemented such as security and integrity.\
  \ Customer data cannot be seen by other customers. It also has some simple banking\
  \ protocols implemented such as overdraft prevention. Transactions are also implemented\
  \ with little impact to the code.\n\nThe use cases involving managers and supervisors\
  \ were not implemented with the intent that the reader could implement them as exercises.\n\
  \nWith a functional banking application, the door is opened to further enhancements\
  \ and implementation or more use cases needed to meet the customers' and the bank's\
  \ needs.\n\nIn this chapter we learned how to:\n\n- Wire together the components\
  \ of our banking application using dependency injection\n- Easily setup user authentication\n\
  - Restrict what pages a user can visit based on their role and whether or not they\
  \ own the data being viewed\n- Export raw data using Pyro to another trusted machine\
  \ inside the enterprise\n- Export raw data for the customer, to be used by some\
  \ external tool\n- Write an aspect that audits the database operations performed\
  \ by the controller\n- Easily mark up atomic transfer operations with the `@transactional`\
  \ decorator\n\nIn the next chapter, we will take a look at Spring Python's command-line\
  \ application, coily, which can help us build Spring Python applications quicker.\
  \ We will also see how to write our own plugins to add functionality as we need.\n"
- "# 9 Creating Skeleton Apps with Coily\n\nSpring Python has many useful building\
  \ blocks. In the last chapter we used these features in concert to build a simple\
  \ banking application. This illustrated the bottom line task for software developers:\
  \ delivering runnable applications.\n\nTo speed up the process for building apps,\
  \ Spring Python provides the Python script `coily`. This script is built to support\
  \ extensible plugins. The first plugin provided by the Spring Python team is `gen-cherrypy-app`,\
  \ which is based on creating a skeleton CherryPy application using Spring Python\
  \ IoC and security.\n\nIn this chapter, we will learn:\n\n- The plugin driven approach\
  \ of `coily`, which allows us to utilize plugins written by other developers or\
  \ to write our own\n- The easy-to-code requirements of creating a plugin\n- Building\
  \ a CherryPy application from scratch, with fully configured security, using the\
  \ template-based `gen-cherrypy-app` plugin\n\n## Plugin approach of Coily\n\n`coily`\
  \ is a Python script designed from the beginning to provide a plugin based platform\
  \ for building Spring Python apps. Another important feature is version control\
  \ of the plugins. Developers should not have to worry about installing an out-of-date\
  \ plugin that was designed for an older version of Spring Python. `coily` allows\
  \ different users on a system to have different sets of plugins installed. It also\
  \ requires no administrative privileges to install a plugin.\n\n## Key functions\
  \ of coily\n\ncoily is included in the standard installation of Spring Python, as\
  \ documented earlier in this book. To see the available commands, just ask for help.\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_226_0.png)\n\nThe following table elaborates\
  \ these commands.\n\n| Command | Description |\n|---|---|\n| `--help` | Prints out\
  \ the help menu. It is worth noting that when plugins are installed, they will also\
  \ be listed as well. |\n| `--list-installed-plugins` | Lists the plug-ins already\
  \ installed in this account. Each installed plugin exists in a sub-folder in `HOME/.springpython`.\
  \ |\n| `--list-available-plugins` | Lists the plugins available for installation.\
  \ `coily` is currently configured to search SpringSource's S3 site where Spring\
  \ Python downloads are found for officially supported plugins. It also looks in\
  \ the current directory where `coily` is being run, so that you can develop plugins\
  \ locally. |\n| `--install-plugin` | Installs a plugin by copying its files into\
  \ `HOME/.springpython`. |\n| `--uninstall-plugin` | Uninstalls the plugin by deleting\
  \ its directory from `HOME/.springpython`. |\n| `--reinstall-plugin` | Shortcut\
  \ command that uninstalls a plugin and then installs it again. This is very useful\
  \ when developing a new plugin in an iterative fashion. |\n\n\n\n\n## 插件的必需部分\n\n\
  一个 `coily` 插件与 Python 包非常相似，只是做了一些细微的调整。这并不意味着插件是要作为 Python 包安装的。它只是文件夹结构的一种描述。\n\
  \n让我们以 `gen-cherrypy-app` 插件的布局为例。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_227_0.png)\n\
  \n该布局中的某些部分是必需的，其他部分则不是。顶层文件夹是插件的名称。\n\n- 一个插件需要在顶层目录内包含一个 `__init__.py` 文件。\n-\
  \ `__init__.py` 必须包含一个 `__description__` 变量。当我们运行 `coily --help` 命令时，该描述会显示出来。\n\
  - `__init__.py` 必须包含一个命令函数，该函数要么是 `create` 要么是 `apply` 函数。当插件需要用户提供一个参数时使用 `create`；当不需要用户提供参数时使用\
  \ `apply`。\n\n让我们看看 `gen-cherrypy-app` 如何满足这些要求。\n\n- 1. 我们可以从图中看出，顶层文件夹的名称与我们的插件相同。\n\
  - 2. 在 `__init__.py` 内部，我们可以看到以下帮助信息定义。\n  `__description__ = \"plugin to create\
  \ skeleton CherryPy applications\"`\n- 3. `gen-cherrypy-app` 用于创建骨架应用程序。它需要用户提供将要创建的应用程序的名称。再次查看\
  \ `__init__.py` 内部，可以找到以下方法签名。\n  `def create(plugin_path, name)`\n- 4. `plugin_path`\
  \ 是由 `coily` 提供给 `gen-cherrypy-app` 的参数，指向 `gen-cherrypy-app` 的基本目录。该参数也为使用 `apply`\
  \ 命令函数的插件提供。\n- 5. `name` 是用户提供的应用程序名称。\n\n> 需要认识到，`create` 允许一个命令行参数，但还会从 `coily`\
  \ 本身接收另一个参数 `plugin_path`，以便为插件提供足够的信息来完成工作。`apply` 不允许命令行参数，但仍会从 `coily` 接收 `plugin_path`。\n\
  \n其余文件不是插件的必需项，而是由 `gen-cherrypy-app` 使用，如下一节所示。\n\n## 创建 CherryPy 骨架应用\n\n上图中列出的其余文件构成了应用程序的模板。\n\
  \n|  |  |\n|---|---|\n| `app_context.py` | 用于使用基于装饰器的 `PythonConfig` 对生成的应用程序进行装配的\
  \ Spring Python 应用程序上下文 |\n| `cherrypy-app.py` | 可运行的应用程序主体部分 |\n| `controller.py`\
  \ | 包含应用程序的业务逻辑 |\n| `view.py` | 包含应用程序的部分 CherryPy 渲染部分 |\n| `images` | 一个包含视图层使用的图像的子目录\
  \ |\n\n- 1. 在创建 CherryPy 应用程序之前，我们缺少了一些东西。在之前的截图中，该插件未列出。我们需要找到它并安装它。首先，让我们看看如何查找现有插件。\n\
  \n![](img/bcf886d8b665372ee8afbb620d4273bb_228_0.png)\n\n- 2. 看到列出了 gen-cherrypy-app，让我们使用\
  \ coily 安装它，而无需打开浏览器。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_229_0.png)\n\n\
  ## 使用 Coily 创建骨架应用\n\n3. 让我们使用该插件创建一个名为 `sample_app` 的 CherryPy 应用程序。由于我们刚刚安装了它，插件现在会出现在\
  \ `coily` 的帮助菜单中。有了它，我们就可以运行命令来创建 `sample_app`。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_230_0.png)\n\
  \n`gen-cherrypy-app` 创建一个名为 `sample_app` 的目录，并将上面列出的文件复制到其中。它还会根据参数 `sample_app`\
  \ 对文件进行一些转换。\n\n- 它用 `sample_app` 替换每个文件中所有 `${name}` 的实例\n- 它用 `Sample_app` 替换每个文件中所有\
  \ `${properName}` 的实例\n- 它将 `cherrypy-app.py` 重命名为 `sample_app.py`\n\n4. 要运行该应用，请切换到\
  \ sample_app 目录并运行主脚本。\n\n```\n./sample_app.py\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_231_0.png)\n\
  \n5. 现在我们可以访问正在运行的应用程序 http://127.0.0.1:8080。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_231_1.png)\n\
  \n- 6. 让我们检查 `app_context.py` 并查看 `gen-cherrypy-app` 接线的一些关键特性。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_232_0.png)\n\
  \n这是正在接线的根对象。其余配置（此处未显示）主要是安全配置步骤。\n\n> 在 *第 6 章，使用 Spring Python 保护您的应用程序* 中指出，使用\
  \ Spring Python 进行安全配置需要许多步骤。`gen-cherrypy-app` 通过预先接线大部分安全部分来提供帮助，使用户可以根据需要进行修改，而无需从头构建。\n\
  \n从这里，我们可以使用硬编码的凭据登录以查看我们的可扩展应用程序。\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_233_0.png)\n\
  \n目前没有控制器对象。然而，添加这样一层的工作量不大，正如上一章案例研究中所示。\n\n该插件足够简单，以至于改进该插件所花费的大部分工作都可以集中在模板文件上。这种策略对于为其他类型的应用程序构建其他模板非常有用。\n\
  \n## 摘要\n\n`coily` 用于下载、安装和利用插件。`gen-cherrypy-app` 使用一组模板很好地创建了一个 Spring 化 CherryPy\
  \ 应用程序。这种模式很容易复制到其他类型的应用程序。\n\n在本章中，我们学习了：\n\n- 用于安装和卸载插件的基本 `coily` 命令\n- 插件的结构，包括在\
  \ `coily` 的帮助屏幕上显示的描述的定义以及处理命令所需的函数\n- 使用模板文件和模式替换使得 `gen-cherrypy-app` 能够轻松生成 CherryPy\
  \ 应用程序\n\n在下一章中，我们将研究如何将 Spring Python 与 Java 应用程序集成。\n"
- "# 10 案例研究 II—将 Spring Python 与您的 Java 应用程序集成\n\n在本书中，我们在检查代码示例的同时探索了 Spring Python\
  \ 的许多方面。到目前为止，我们探索的所有代码都是使用 CPython 创建的，即 Python 语言的原始实现。\n\n在当今时代，多语言编程在开发者社区中引起了越来越多的兴趣。Java\
  \ 开发者正在寻找其他选择以提高开发人员生产力，同时仍保留对 Java 生态系统的访问。Python 开发者正在研究如何在可扩展的资源（如 Google App\
  \ Engine）上运行系统。\n\nSpring Python 用纯 Python 编写，使其易于在 Jython 中运行。这打开了集成的可能性，使开发人员能够轻松地将\
  \ Java 和 Python 组件与 Spring Python 的轻量级功能混合使用。\n\n在本章中，我们将学习如何：\n\n- 使用 Pythonic\
  \ 的 CherryPy Web 应用程序框架构建航班预订系统前端\n- 使用 Java 构建航班预订系统后端\n- 使用 Spring Python、Jython\
  \ 和 Pyro 将两者连接起来\n\n## 构建航班预订系统\n\n在本章中，我们将在构建航班预订系统的同时探索 Java 和 Python 的集成。构建此类系统的第一步是向客户展示现有航班并允许客户筛选数据。虽然实现可用系统需要更多功能，但此功能将是本次演示的重点。\n\
  \n我们已经探索过使用 CherryPy Web 应用程序框架，并将再次使用它来为该系统创建前端。对于后端，我们将使用 Java 组件开发持久层，同时使用 Spring\
  \ Python 的 IoC 容器将所有内容连接起来，并在 Jython 内部运行所有内容。我们将探索的另一个关键特性是如何使用 Spring Python 和\
  \ Pyro 将纯 Java 与纯 Python 组件集成。\n\n## 以最快的方式构建 Web 应用\n\n您将如何构建我们的 Python 前端？一种流行的方法是构建小型、可测试且易于组合的块。从这个角度来看，用户界面将是最后一步。\n\
  \n另一种策略是专注于客户的视角并开发屏幕，然后再填充后端。由于我们的目标是测试 Spring Python 的功能，让我们采用这种更直观的方法。\n\n为了加快我们的应用程序，让我们使用\
  \ Spring Python 的命令行 coily 工具，我们之前已经探索过它。\n\n- 1. 使用 coily，让我们创建一个预订应用程序\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_236_0.png)\n\
  \n\n\nThis command generates a set of files:\n\n| 文件名 | 描述 |\n|---|---|\n| booking.py\
  \ | 可运行的 CherryPy 应用程序。 |\n| app_context.py | Spring Python 应用上下文，其中包含我们组件的 wiring。\
  \ |\n| view.py | 包含所有网页部分，包括 HTML。 |\n| controller.py | 包含视图访问以生成屏幕动态内容的函数。 |\n\n\
  此自动生成的应用程序包含预先连接的组件，包括安全机制、一些基本链接以及启动 CherryPy Web 服务器引擎所需的引导程序。在开始编写功能代码之前，它只需要进行一些小的修改。\n\
  \n- 2. 删除应用中嵌入的任何许可注释。虽然模板文件本身带有许可标记，但此应用程序可能不会以相同的许可发布\n- \n- 3. 放宽 app_context.py\
  \ 中定义的安全限制，允许匿名用户访问网站的主要部分，同时对 /customer/* 下的任何链接实施完整的安全限制并要求 ROLE_CUSTOMER\n\n\
  ```\n@Object\ndef filterChainProxy(self):\n    return CP3FilterChainProxy(filterInvocationDefinitionSource\
  \ =\n    [\n        (\"/images.*\", []),\n        (\"/html.*\", []),\n        (\"\
  /accessDenied.*\", []),\n        (\"/login.*\", [\"httpSessionContextIntegrationFilter\"\
  ]),\n        (\"/customer/.*\", [\"httpSessionContextIntegrationFilter\",\n    \
  \        \"exceptionTranslationFilter\",\n            \"authenticationProcessingFilter\"\
  ,\n            \"filterSecurityInterceptor\"])\n    ])\n```\n\n```\n@Object\ndef\
  \ filterSecurityInterceptor(self):\n    filter = FilterSecurityInterceptor()\n \
  \   filter.auth_manager = self.authenticationManager()\n    filter.access_decision_mgr\
  \ = self.accessDecisionManager()\n    filter.sessionStrategy = self.cherrypySessionStrategy()\n\
  \    filter.obj_def_source = [\n        (\"/customer/.*\", [\"ROLE_CUSTOMER\"])\n\
  \    ]\n\n    return filter\n```\n\n4. 删除图像和 CSS 代码并用更简单的页眉和页脚替换它们：\n\n```\ndef\
