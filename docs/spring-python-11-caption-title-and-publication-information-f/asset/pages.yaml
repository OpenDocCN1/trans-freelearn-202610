- pgno: 72
  md: 'By creating a proxy and wiring it with our aspect, we have dynamically woven
    the aspect into the code. In our situation, we have created an instance of Spring
    Python''s ProxyFactoryObject to combine WikiService with CachingInterceptor.


    By moving the Spring Python object wiki_service from WikiService to the ProxyFactoryObject,
    our call sequence now flows through our new interceptor, as shown in the following
    diagram.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_72_0.png)


    Now, instead of having a specialized cache handler, we have a proxy that links
    to our generic caching aspect. Whenever the view layer submits a request to wiki_service,
    the calls get routed to CachingInterceptor.


    The key difference between CachingInterceptor and the earlier CachedService is
    how Spring Python bundles up all the information of the original method call into
    the invocation argument and dispatches it to the invoke method of CachingInterceptor.
    This allows us to manage entering and exiting from any method on WikiService in
    one place. This behavior is known as advising the target.'
  merge: -1
  img_proc: true
- pgno: 73
  md: "In our example, CachingInterceptor checks if the target method name starts\
    \ with get. If so, it checks the cache, using the target method's arguments as\
    \ the key (in our case, the article name). If the arguments are not found in the\
    \ cache, CachingInterceptor calls WikiService through invocation.proceed() as\
    \ if we had called it directly. The results are stored in the cache, and then\
    \ returned to the view layer. If the target method name starts with store, the\
    \ cache entry is deleted followed by invocation.proceed().\n\n7. ProxyFactoryObject\
    \ routes all method requests through our aspect. However, CachingInterceptor can't\
    \ handle a call to statistics, because it doesn't start with get or store. To\
    \ deal with this, let's insert another piece of advice that only sends get and\
    \ store calls to CachingInterceptor, and all others directly to WikiService.\n\
    \n```\n```python\nclass WikiProductionAppConfig(PythonConfig):\n    def __init__(self):\n\
    \        super(WikiProductionAppConfig, self).__init__()\n\n    @Object\n    def\
    \ data_access(self):\n        return MysqlDataAccess()\n\n    @Object\n    def\
    \ wiki_service(self):\n        advisor = RegexpMethodPointcutAdvisor(\n      \
    \      advice=[CachingInterceptor()],\n            patterns=[\".*get.*\", \".*store.*\"\
    ])\n        return ProxyFactoryObject(\n            target=WikiService(self.data_access()),\n\
    \            interceptors=advisor)\n```\n```\n\nSpring Python's RegexpMethodPointcutAdvisor\
    \ is an out-of-the-box advisor that uses a set of regular expressions to define\
    \ its pointcuts.\n\n> As mentioned earlier, an advisor is Spring Python's implementation\
    \ of an aspect. A pointcut is a definition of where to apply an aspect's Advice.\
    \ In this case, the pointcut is defined as a regular expression. But not all pointcuts\
    \ require regular expressions."
  merge: -1
  img_proc: true
