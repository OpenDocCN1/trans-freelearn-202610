- pgno: 172
  md: "First, let's publish our service using Pyro by making some small changes to\
    \ the IoC configuration.\n\n```\n```python\nfrom springpython.config import *\n\
    from springpython.remoting.pyro import *\n\nfrom simple_service import *\n\nclass\
    \ HappyBirthdayContext(PythonConfig):\n    def __init__(self):\n        PythonConfig.__init__(self)\n\
    \n    @Object\n    def target_service(self):\n        return Service()\n\n   \
    \ @Object()\n    def service_exporter(self):\n        exporter = PyroServiceExporter()\n\
    \        exporter.service_name = \"service\"\n        exporter.service = self.target_service()\n\
    \        return exporter\n```\n```\n\nWe have renamed the service method to target_service,\
    \ to indicate it is the target of our export proxy.\n\nWe then created a PyroServiceExporter.\
    \ This is Spring Python's out-of-the-box solution for advertising any Python service\
    \ using Pyro. It handles all the details of starting up Pyro daemon threads and\
    \ registering our service.\n\nPyro requires services to be registered with a distinct\
    \ name, and this is configured by setting the exporter's service_attribute attribute\
    \ to \"service\". We also need to give it a handle on the actual service object\
    \ with the export's service attribute. We do this by plugging in target_service.\n\
    \n+   - By default, Pyro advertises on IP address 127.0.0.1, but this can be overridden\
    \ by setting the exporter's service_host attribute\n+   - By default, Pyro advertises\
    \ on port 7766, but this can be overridden by setting the exporter's service_port\
    \ attribute"
  merge: -1
  img_proc: true
