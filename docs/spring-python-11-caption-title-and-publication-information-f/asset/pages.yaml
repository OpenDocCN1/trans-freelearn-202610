- pgno: 19
  md: '# 1

    Getting Started with Spring Python


    Spring Python takes the concepts of the Spring Framework and Spring Security,
    and brings them to the world of Python. It isn''t a simple line-by-line port of
    the code. Instead, it takes some powerful ideas that were discovered in the realm
    of Java, and pragmatically applies them in the world of Python.


    Spring (Java) provides many simple, easy-to-use functional parts to assemble applications
    instead of a monolithic framework to extend. Spring Python uses this same approach.
    This means we can use as little or as much Spring Python as we need to get the
    job done for each Python application.


    In this chapter, we will learn:


    +   - About Spring Python''s a non-invasive API which makes it easy to use other
    libraries without having to make major changes to your own code base

    +   - How Spring Python uses inversion of control to decouple object creation
    from object usage to empower the developer

    +   - How Spring Python provides the means to help professional Python developers
    by offering a non-invasive API to easily access advanced services

    +   - The ways in which Spring Python offers professional Java developers an easy
    way to mix Python and Java together through the combination of Python/Jython/Java

    +   - How to install the library from both binary and source code

    +   - How extensible Spring Python is, and also some links to the Spring Python
    community'
  merge: -1
  img_proc: true
- pgno: 20
  md: "# Spring Python for Python developers\n\nYou have already picked one of the\
    \ most popular and technically powerful dynamic languages to develop software,\
    \ Python. Spring Python makes it even easier to solve common problems encountered\
    \ by Python developers every day.\n\n# Exploring Spring Python's non-invasive\
    \ nature\n\nSpring Python has a non-invasive nature, which means it is easy to\
    \ adopt the parts that meet your needs, without rewriting huge blocks of code.\
    \ For example, Pyro (http://pyro.sourceforge.net) is a 3rd party library that\
    \ provides an easy way to make remote procedure calls.\n\nIn order to demonstrate\
    \ the Spring way of non-invasiveness, let's code a simple service, publish it\
    \ as a web service using Pyro's API, and then publish it using Spring Python's\
    \ wrapper around Pyro. This will show the difference in how Spring Python simplifies\
    \ API access for us, and how it makes the 3rd party library easier to use without\
    \ as much rework to our own code.\n\n+   1. First, let's write a simple service\
    \ that parses out the parameters from a web request string:\n+   ```python\n+\
    \   class ParamParser(object):\n+       def parse_web_parms(self, parm):\n+  \
    \         return [tuple(p.split(\"=\")) for p in parm.split(\"&\")]\n+   ```\n\
    +   2. Now we can write a simple, functional piece of code that uses our service\
    \ in order to have a working version.\n+   ```python\n+   parser = ParamParser()\n\
    +   parser.parse_web_parms(\"pages=5&article=Spring_Python\")\n+   ```\n+   This\
    \ is just instantiating the `ParamParser` and accessing the function. To make\
    \ this a useful internet service, it needs to be instantiated on a central server\
    \ and should be configured to listen for calls from clients.\n+   3. The next\
    \ step is to advertise it as a web service using the API of Pyro. This will make\
    \ it reachable by multiple Pyro clients. To do this, we define a daemon which\
    \ will host our service on port 9000 and initialize it.\n+   ```python\n+   import\
    \ Pyro\n+   \n+   daemon = Pyro.core.Daemon(host=\"localhost\", port=\"9000\"\
    )\n+   Pyro.core.initServer()\n+   ```"
  merge: -1
  img_proc: true
- pgno: 21
  md: "4. Next, we create a `Pyro` object instance to act as proxy to our service\
    \ as well as an instance of our `ParamParser`. We configure the proxy to delegate\
    \ all method calls to our service.\n\n```\npyro_proxy = Pyro.core.ObjBase()\n\
    parser = ParamParser()\npyro_proxy.delegateTo(parser)\n```\n\n5. Finally, we register\
    \ the `pyro_proxy` object with the `daemon`, and startup a listen-dispatch loop\
    \ so that it's ready to handle requests:\n\n```\ndaemon.connect(pyro_proxy, \"\
    mywebservice\")\ndaemon.requestLoop(True)\n```\n\nWhen we run this server code,\
    \ an instance of our `ParamParser` will be created and advertised at `PYROLOC://localhost:9000/mywebservice`.\n\
    \nTo make this service complete, we need to create a `Pyro` client that will call\
    \ into our service. The proxy seamlessly transfers Python objects over the wire\
    \ using the `Pyro` library, in this case the tuple of request parameters.\n\n\
    ```\nimport Pyro\n\nurl_base = \"PYROLOC://localhost:9000\"\nclient_proxy = Pyro.core.getProxyForURI(\
    \ \\\n    url_base + \"/mywebservice\")\nprint client_proxy.parse_web_parms( \\\
    \n    \"pages=5&article=Spring_Python\")\n```\n\nThe `Pyro` library is easy to\
    \ use. One key factor is how our `ParamParser` never gets tightly coupled to the\
    \ `Pyro` machinery used to serve it to remote clients. However, it's very invasive.\n\
    \nWhat if we had already developed a simple application on a single machine with\
    \ lots of methods making use of our utility? In order to convert our application\
    \ into a client-server application, we would have to rewrite it to use the `Pyro`\
    \ client proxy pattern everywhere that it was called. If we miss any instances,\
    \ we will have bugs that need to be cleaned up. If we had written automated tests,\
    \ they would also have to be rewritten as well. Converting a simple, one-machine\
    \ application into a multi-node application can quickly generate a lot of work.\n\
    \nThat is where Spring Python comes in. It provides a different way of creating\
    \ objects which makes it easy for us to replace a local object with a remoting\
    \ mechanism such as `Pyro`. Later on, we will explore the concepts of Spring Python's\
    \ container in more detail."
  merge: -1
  img_proc: true
- pgno: 22
  md: "Let's utilize Spring Python's container to create our parser and also to serve\
    \ it up with Pyro.\n\n```\nfrom springpython.config import PythonConfig\nfrom\
    \ springpython.config import Object\nfrom springpython.remoting.pyro import PyroServiceExporter\n\
    from springpython.remoting.pyro import PyroProxyFactory\n\nclass WebServiceContainer(PythonConfig):\n\
    \    def __init__(self):\n        super(WebServiceContainer, self).__init__()\n\
    \n    @Object(lazy_init=True)\n    def my_web_server(self):\n        return PyroServiceExporter(service=ParamParser(),\n\
    \                                    service_name=\"mywebservice\",\n        \
    \                            service_port=9000)\n\n    @Object(lazy_init=True)\n\
    \    def my_web_client(self):\n        myService = PyroProxyFactory()\n      \
    \  myService.service_url=\"PYROLOC://localhost:9000/mywebservice\"\n        return\
    \ myService\n```\n\nWith this container definition, it is easy to write both a\
    \ server application as well as a client application. To spin up one instance\
    \ of our Pyro server, we use the following code:\n\n```\nfrom springpython.context\
    \ import ApplicationContext\ncontainer = ApplicationContext(WebServiceContainer())\n\
    container.get_object(\"my_web_server\")\n```\n\nThe client application looks very\
    \ similar.\n\n```\nfrom springpython.context import ApplicationContext\ncontainer\
    \ = ApplicationContext(WebServiceContainer())\nmyService = container.get_object(\"\
    my_web_client\")\nmyService.parse_web_parms(\"pages=5&article=Spring_Python\"\
    )\n```\n\nThe Spring Python container works by containing all the definitions\
    \ for creating key objects. We create an instance of the container, ask it for\
    \ a specific object, and then use it.\n\nThis easily looks like just as much (if\
    \ not more) code than using the Pyro API directly. So why is it considered less\
    \ invasive?"
