- pgno: 30
  md: 'We defined an interface, providing a good boundary to code both Java consumers
    and Jython services against. Our Jython class extends the interface and when created,
    creates an IoC container which requests a `web_client` object. This is our `PyroProxyFactory`
    that uses Pyro to call our pure Python service over the wire. By implementing
    the interface, we conveniently expose our remote procedure call to the Java consumers.
    Our Java app needs a `factory` class to create a Jython interpreter which in turn
    creates an instance of our Jython class. We use this in our application main to
    get an instance of our TV service. Using the service, we call the exposed method
    which makes our Pyro remote call. We iterate over the received list and extract
    a tuple in order to print out results.


    After taking a glance at how to expose a pure Python service to a pure Java consumer,
    the options from here are endless. We could use Spring Java''s `RmiServiceExporter`
    or `HessianServiceExporter` to expose our Python service to other protocols. This
    service could be integrated into a Spring Integration workflow or made part of
    a Spring Batch job. There really is no limit. We will explore this in more detail
    in *Chapter 10* with our case study.


    We have already looked at how easy it is to expose Python services to Java consumers.
    If you are already familiar with Spring Java, hopefully as you read this book,
    you will notice that the *Spring way* works not only in Java but in Python as
    well. Spring Python uses the same concepts as Spring Java, shares some class names
    with Spring Java, and even has an XML parser that can read Spring Java''s format.
    All of these things increase the ability to rewrite some parts in Python while
    making small changes in the configuration files. All of these aspects make it
    easier to incrementally move our application to the sweet spot we need for improved
    productivity.


    # Extending Spring Python


    Spring Python provides easy access to services, libraries, and APIs through its
    neatly segmented set of modules. Spring Python''s flexibility is due to its modular
    nature. Providing you with a small set of blocks that are easy to combine is much
    more reusable than a monolithic set of classes to extend. These techniques open
    the door to easily integrating with current technologies and future ones as well.


    In this chapter, we have already looked at various features, including remoting,
    `DatabaseTemplate`, and integrating Python with Java. As we explore the other
    features of Spring Python, I hope you can realize that using the *Spring way*
    of writing useful abstractions and delegating object creation to the Spring Python
    container makes it easy to write more modules that aren''t part of this project
    yet.'
  merge: -1
  img_proc: true
