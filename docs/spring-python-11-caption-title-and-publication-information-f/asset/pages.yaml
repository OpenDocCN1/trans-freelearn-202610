- pgno: 142
  md: '# Looking at our web application from 10,000 feet


    The following diagram shows a high level view of our web application as a user
    looks up an article, clicks on the Edit button, makes changes, and then submits
    an update. By clicking on the Save button, the new wiki text is posted to Spring
    Wiki.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_142_0.png)


    In our example application, we have coded a simplistic database: a Python dictionary.
    However, that could easily be replaced by a relational database hosted on a separate
    server. The concept is the same: save the changes submitted by the user.'
