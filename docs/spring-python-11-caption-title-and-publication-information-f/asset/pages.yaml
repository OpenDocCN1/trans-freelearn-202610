- pgno: 235
  md: '# 10

    Case Study II—Integrating Spring Python with your Java Application


    In this book, we have explored the many facets of Spring Python while examining
    code samples. So far, all the code we explored was created using CPython, the
    original implementation of the Python language.


    In this day and age, polyglot programming has attracted an ever increasing interest
    in the developer community. Java developers are looking at other options to increase
    developer productivity while still retaining access to the Java ecosystem. Python
    developers are looking at how to run systems on scalable assets such as the Google
    App Engine.


    Spring Python is coded in pure Python, making it easy to run inside Jython. This
    opens the door to integration, allowing developers to easily mix Java and Python
    components with the lightweight power of Spring Python.


    In this chapter, we will learn how to:


    +   - Build a flight reservation system front end using the pythonic CherryPy
    web application framework

    +   - Build a flight reservation system back end using Java

    +   - Connect the two together using Spring Python, Jython, and Pyro'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Building a flight reservation system


    For this chapter, we will explore integrating Java and Python together while building
    a flight reservation system. The first step towards building a system like this
    is to show the customer existing flights and allow the customer to filter the
    data. While many more features are needed to implement a usable system, this feature
    will be the focus of this demonstration.


    We have already explored using the CherryPy web application framework and will
    use it again to create the front end for this system. For the back end, we will
    develop a persistence layer using Java components, while wiring everything together
    using Spring Python''s IoC container and run everything from inside Jython. The
    other key feature that we will explore is how to integrate pure Java with pure
    Python components using Spring Python and Pyro.


    # Building a web app the fastest way


    How would you look at building our Python frontend? One popular approach is to
    build small, testable blocks that are easily composable. From this perspective,
    the user interface would be the last step.


    Another tactic is to focus on the customer''s view and develop the screens, followed
    by filling in the back end. Since our goal is to test drive the features of Spring
    Python, let''s take this more visual approach.


    To speed up our application, let''s use Spring Python''s command-line coily tool,
    which we explored earlier.


    +   1. Using coily, let''s create a booking application


    ![](img/bcf886d8b665372ee8afbb620d4273bb_236_0.png)'
