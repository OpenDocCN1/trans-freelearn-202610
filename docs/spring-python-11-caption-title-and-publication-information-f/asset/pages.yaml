- pgno: 117
  md: '+   - Because `@transactional` wraps our `transfer` function, when the user
    invokes `transfer`, they are hitting the decorator first

    +   - `@transactional` passes all the context of the requested method call to
    its private instance of `TransactionTemplate`

    +   - `TransactionTemplate` starts a transaction

    +   - `TransactionTemplate` then calls the original `Bank transfer` function

    +   - `Bank` carries out its business, totally unaware it is inside a transaction

    +   - When complete, `Bank` hands control back to the `TransactionTemplate`, which
    issues a `commit`

    +   - `TransactionTemplate` hands control back to `@transactional`, and finally
    back to the caller


    > This configuration totally decouples transactional logic from our transfer operation.


    +   - Since `TransactionTemplate` is the caller of `transfer`, it can easily handle
    any number of return statements. If an exception is raised anywhere inside `transfer`,
    `TransactionTemplate` will `rollback` instead of `commit`.


    With this clean separation of concerns, we can work on the business code without
    having to worry about getting transactions right.


    # More about TransactionTemplate


    Our first version of the transaction pattern was simple and naïve. We then examined
    the list of issues with that pattern. `TransactionTemplate` has a much more sophisticated
    pattern that handles these extra situations:


    +   - It handles the simple case of catching any exception thrown by catching
    it, issuing a rollback, and then re-throwing the exception

    +   - It handles all return statements by catching the return value of the method,
    issuing the necessary commit, and then finally returning the results

    +   - `@transactional` is coded by default to start new transactions if one isn''t
    currently in progress, and to join a transaction if one already exists. We will
    look at the other transactional options later in this chapter


    Another integrity gap exists in our `transfer` code. It lies somewhere between
    the transaction pattern and our business logic. Can you spot it?'
