- pgno: 140
  md: "Let's create the final object modeling a non-existent page.\n\n```\nclass NoPage(Page):\n\
    \    def __init__(self, article, controller):\n        Page.__init__(self, article,\n\
    \            \"This page does not yet exist.\", controller)\n```\n\nNoPage is\
    \ a Page with some hard-coded wiki text on it. It inherits the same format rules\
    \ as Page, and also has an edit button, so the user can replace the non-existent\
    \ page with a real one.\n\nLet's create a pure Python application context to wire\
    \ these components together.\n\n```\nimport controller\nimport view\nfrom springpython.config\
    \ import PythonConfig\nfrom springpython.config import Object\n\nclass SpringWikiAppContext(PythonConfig):\n\
    \    def __init__(self):\n        super(SpringWikiAppContext, self).__init__()\n\
    \n    @Object\n    def view(self):\n        return view.Springwiki(self.controller())\n\
    \n    @Object\n    def controller(self):\n        return controller.SpringWikiController()\n\
    ```\n\nWith all the parts coded up, let's write a CherryPy server application\
    \ to host our web application.\n\n```\nimport cherrypy\nimport os\nimport noxml\n\
    from springpython.context import ApplicationContext\n\nif __name__ == '__main__':\n\
    \    cherrypy.config.update({'server.socket_port': 8003})\n\n    applicationContext\
    \ = ApplicationContext(noxml.SpringWikiAppContext())\n    cherrypy.tree.mount(\n\
    \        applicationContext.get_object(\"view\"),\n        '/',\n        config=None)\n\
    \n    cherrypy.engine.start()\n    cherrypy.engine.block()\n```"
