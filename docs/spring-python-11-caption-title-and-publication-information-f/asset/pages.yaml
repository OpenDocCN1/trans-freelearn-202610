- pgno: 114
  md: '# Getting transactions right is hard


    The transactional pattern shown earlier above is very simplistic and incomplete.

    There are many issues that can occur which requires even more detail.


    +   - The most important issue is whether or not the underlying database engine
    supports transactions, and if it''s been properly configured to avoid auto commits.
    If this isn''t set up appropriately, the code won''t function as expected. Auto
    commits work by committing every SQL statement as executed, instead of waiting
    for `conn.commit()`, hence not offering any option to rollback.

    +   - If a transaction was already in progress when the `transfer` is called,
    there may be special handling required. In our example, we abruptly commit previous
    work and then start a new transaction with the initial `commit`. With a transaction
    in progress, this may not be the right step. It''s hard to tell considering we
    don''t have any surrounding business context.

    +   - Exception handling isn''t the only type of rollback scenario to handle.
    While our transfer doesn''t have any alternate return paths, more complex business
    logic can easily code guard clauses and other return statements that bypass both
    the `commit` and the `rollback`. Leaving the transaction hanging and not committed
    to the database would be very sloppy and risky.


    The result is that the pattern shown above and utilized for our simple example
    isn''t comprehensive enough to handle the simplest risks. A more complex pattern
    has to be coded. Given that it must be repeated for every transactional point
    in our application, it makes our integrity problem even harder to solve.


    There is a side effect of efficiency when performing transactions. Because the
    same connection is used to conduct the transaction, the cost of opening and closing
    connections is avoided.


    # Simplify by using @transactional


    Spring Python solves these problems with its `TransactionTemplate`. This utility
    class makes it easy to wrap business methods with transactional functionality
    that solves all of the problems listed earlier. Spring Python makes it easy to
    wrap our existing business functions with the `TransactionTemplate` using its
    `@transactional` decorator.


    +   1. First, let''s take our simple `transfer` function, and put into a `Bank`
    class.


    ```

    from springpython.database.core import *

    from springpython.database.factory import *

    ```'
