- pgno: 60
  md: "10. After all the success we have had with the Python platform, we decide to\
    \ migrate the container definitions to pure Python. First, let's convert `production.xml`\
    \ to `WikiProductionAppConfig`.\n\n```\nfrom springpython.config import PythonConfig,\
    \ Object\nfrom Py import MySqlDataAccess\nimport WikiService\n\nclass WikiProductionAppConfig(PythonConfig):\n\
    \    def __init__(self):\n        PythonConfig.__init__(self)\n\n    @Object\n\
    \    def data_access(self):\n        return MySqlDataAccess()\n\n    @Object\n\
    \    def wiki_service(self):\n        results = WikiService()\n        results.dataAccess\
    \ = self.data_access()\n        return results\n```\n\n11. Let's mix this with\
    \ `test.xml`.\n\n```\nimport unittest\nfrom springpython.context import ApplicationContext\n\
    from springpython.config import XMLConfig\n\nclass WikiServiceTestCase(unittest.TestCase):\n\
    \    def testHittingWikiService(self):\n        ctx = ApplicationContext([WikiProductionAppConfig(),\n\
    \                                  XMLConfig(\"test.xml\")])\n        service\
    \ = ctx.get_object(\"wiki_service\")\n        results = service.statistics(\"\
    stub page\")\n        self.assertEquals(10.0, results[0])\n        self.assertEquals(2.0,\
    \ results[1])\n```\n\nWe simply replace `XMLConfig(\"production.xml\")` with `WikiProductionAppConfig()`.\
    \ ApplicationContext comfortably accepts any combination of definitions stored\
    \ in different formats. Spring Python's flexible container gives us a fine grained\
    \ control over how we store all our definitions.\n\nWe could continue and easily\
    \ replace `test.xml` with something like `WikiTestAppConfig` written in pure Python."
