- pgno: 80
  md: "perf_advisor is an instance of RegexpMethodPointcutAdvisor that applies PerformanceInterceptor\
    \ against any methods that begin with get. While there is only one instance of\
    \ perf_advisor, it is used twice in the chain of advisors. This means it will\
    \ be used twice during the normal flow into WikiService.\n\n```\nimport time\n\
    class PerformanceInterceptor(MethodInterceptor):\n    def invoke(self, invocation):\n\
    \        start = time.time()\n        results = invocation.proceed()\n       \
    \ stop = time.time()\n        print \"Method took %2f seconds\" % (stop-start)\n\
    \        return results\n```\n\nPerformanceInterceptor measures the performance\
    \ of a method by capturing system time, calling invocation.proceed(), and then\
    \ capturing system time again when the invocation is complete. It then prints\
    \ out the difference in times on the screen, and finally returns back to the calling\
    \ advisor. The first time it is used is before caching_advisor, and the second\
    \ time after caching_advisor. This allows measuring both cached and un-cached\
    \ calls, measuring relief provided by the caching.\n\nWe've already seen how the\
    \ CachingInterceptor works.\n\nWhile the entire flow involved in making a call\
    \ to WikiService is much more complicated than our earlier example, it was easy\
    \ to quickly define extra services and apply them to our WikiService API. Each\
    \ interceptor is neat and clean, and easy to understand. This helps lower maintenance\
    \ costs. The interceptors are nicely decoupled from each other as well as WikiService,\
    \ making it easier to mix and match aspects to suit our requirements. The exact\
    \ sequence in which everything is wired together is conveniently kept in one place,\
    \ our IoC container definition. This is shown by how we used perf_advisor twice,\
    \ measuring performance with and without caching. This collectively demonstrates\
    \ how easy it is to build new services and apply them to existing APIs.\n\n# Performance\
    \ cost of AOP\n\nAOP isn't free. There is a certain overhead cost involved with\
    \ wrapping a target object with a Spring Python AOP proxy and performing checks\
    \ on method calls. This clearly depends on how much advice you are using and what\
    \ your pointcuts are. Using lots of regular expressions can get expensive, while\
    \ simply applying an interceptor to every method with no conditional checks has\
    \ a smaller cost."
