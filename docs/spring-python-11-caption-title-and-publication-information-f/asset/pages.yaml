- pgno: 225
  md: '# 9

    Creating Skeleton Apps

    with Coily


    Spring Python has many useful building blocks. In the last chapter we used these
    features in concert to build a simple banking application. This illustrated the
    bottom line task for software developers: delivering runnable applications.


    To speed up the process for building apps, Spring Python provides the Python script
    `coily`. This script is built to support extensible plugins. The first plugin
    provided by the Spring Python team is `gen-cherrypy-app`, which is based on creating
    a skeleton CherryPy application using Spring Python IoC and security.


    In this chapter, we will learn:


    +   - The plugin driven approach of `coily`, which allows us to utilize plugins
    written by other developers or to write our own

    +   - The easy-to-code requirements of creating a plugin

    +   - Building a CherryPy application from scratch, with fully configured security,
    using the template-based `gen-cherrypy-app` plugin


    # Plugin approach of Coily


    `coily` is a Python script designed from the beginning to provide a plugin based
    platform for building Spring Python apps. Another important feature is version
    control of the plugins. Developers should not have to worry about installing an
    out-of-date plugin that was designed for an older version of Spring Python. `coily`
    allows different users on a system to have different sets of plugins installed.
    It also requires no administrative privileges to install a plugin.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Key functions of coily


    coily is included in the standard installation of Spring Python, as documented
    earlier in this book. To see the available commands, just ask for help.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_226_0.png)


    The following table elaborates these commands.


    | Command | Description |

    |---|---|

    | `--help` | Prints out the help menu. It is worth noting that when plugins are
    installed, they will also be listed as well. |

    | `--list-installed-plugins` | Lists the plug-ins already installed in this account.
    Each installed plugin exists in a sub-folder in `HOME/.springpython`. |

    | `--list-available-plugins` | Lists the plugins available for installation. `coily`
    is currently configured to search SpringSource''s S3 site where Spring Python
    downloads are found for officially supported plugins. It also looks in the current
    directory where `coily` is being run, so that you can develop plugins locally.
    |

    | `--install-plugin` | Installs a plugin by copying its files into `HOME/.springpython`.
    |

    | `--uninstall-plugin` | Uninstalls the plugin by deleting its directory from
    `HOME/.springpython`. |

    | `--reinstall-plugin` | Shortcut command that uninstalls a plugin and then installs
    it again. This is very useful when developing a new plugin in an iterative fashion.
    |'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Required parts of a plugin


    A `coily` plugin closely resembles a Python package with some slight tweaks. This
    doesn''t mean that a plugin is meant to be installed as a Python package. It is
    only a description of the folder structure.


    Let''s look at the layout of the `gen-cherrypy-app` plugin as an example.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_227_0.png)


    Some parts of this layout are required, and other parts are not. The top folder
    is the name of the plugin.


    +   - A plugin requires a `__init__.py` file inside the top directory.

    +   - `__init__.py` must include a `__description__` variable. This description
    is shown when we run the `coily --help` command.

    +   - `__init__.py` must include a command function, which is either a `create`
    or `apply` function. `create` is used when the plugin needs one argument from
    the user. `apply` is used when no argument is needed from the user.


    Let''s look at how `gen-cherrypy-app` meets each of these requirements.


    +   1. We can already see from the diagram that the top level folder has the same
    name as our plugin.

    +   2. Inside `__init__.py`, we can see the following help message defined.

    +      `__description__ = "plugin to create skeleton CherryPy applications"`

    +   3. `gen-cherrypy-app` is used to create a skeleton application. It needs the
    user to supply the name of the application it will create. Again, looking inside
    `__init__.py`, the following method signature can be found.

    +      `def create(plugin_path, name)`

    +   4. `plugin_path` is an argument provided to `gen-cherrypy-app` by `coily`,
    which points at the base directory of `gen-cherrypy-app`. This argument is also
