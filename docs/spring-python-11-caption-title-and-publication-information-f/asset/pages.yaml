- pgno: 143
  md: 'If we started out developing this application on the premise that anyone can
    read and edit any article, this solution works. It is simple, easy to understand,
    and probably the only security needed would be a firewall to protect our servers
    from external attack.


    # Handling new security requirements


    We have doubtlessly learned that new requirements are always coming, and we have
    to be ready to implement them quickly. We started our application by implementing
    the core functionality. Now we need to support multiple users and need to control
    who edits what pages.


    # Authentication confirms "who you are"


    The first step towards securing an application is authenticating the user. This
    identifies who the user is, and is usually accomplished by the user providing
    a username and a password. The following diagram shows an update to our application''s
    design. It includes a new component not found in the previous diagram: a Spring
    Python Security agent that polices every web request combined with a 3rd party
    security resource. Before allowing the user to actually touch our wiki application
    or the database, our security agent checks if the user has been authenticated.
    If not, Spring Python redirects the user to a login page. In the diagram, we pick
    up at the point where the user submits new wiki text.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_143_0.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'The security agent meets one of our earlier requirements: application of security
    must be decoupled from the application. The agent is a separate piece of code
    charged with the responsibility of managing security between the user and our
    application. Its configuration its not part of our wiki application, but instead
    configured using the IoC container. We will see how to configure this agent shortly.


    The following diagram shows the user submitting credentials. The security agent
    checks the credentials against the 3rd party security resource to confirm the
    user''s identity. The most common implementation is a simple database table containing
    user data.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_144_0.png)


    # Authorization confirms "what you can do"


    It is important to point out that our security agent is not done. After confirming
    the user''s identity, Spring Python next looks up what authorities the user is
    granted. One user may have the authority to read articles, while another has the
    authority to read articles and also edit them. The last few steps of the previous
    diagram shows this as authorities are looked up and stored in Spring Python Security''s
    context holder.


    The standard convention is to allow a user to have zero or more roles. Having
    collected this information, our security agent stores the user''s identity, granted
    authorities, and authenticated status in a globally accessible `SecurityContextHolder`.
    This is important, because it provides a way for our application to look up information
    about the user''s security status without modifying the application''s APIs. This
    meets another one of our requirements: credential data must be available non-intrusively.
    After securing our application, we will see how this is available.'
  merge: -1
  img_proc: true
- pgno: 145
  md: "After authenticating and authorizing the user, the web request is allowed through\
    \ to the web application. The following diagram shows what happens when we again\
    \ submit our new wiki text, assuming we are authenticated and authorized to do\
    \ so.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_145_0.png)\n\nIt is important\
    \ to point out that this requires no changes in either SpringWiki or SpringWikiController.\
    \ We will quickly demonstrate that applying these changes involves only some configuration\
    \ changes.\n\n# Time to add security to our application\n\nNow it's time to add\
    \ these security features to our application.\n\nFirst we need to define the Spring\
    \ Python Security agent. To do this, we need to add the following code to our\
    \ SpringWikiAppContext.\n\n```\n```python\n@Object\ndef filterChainProxy(self):\n\
    \    return CP3FilterChainProxy(filterInvocationDefinitionSource =\n        [\n\
    \        (\"/login.*\",  [\"httpSessionContextIntegrationFilter\"]),\n       \
    \ (\"/.*\",       [\"httpSessionContextIntegrationFilter\",\n                \
    \       \"exception_translation_filter\",\n                       \"auth_processing_filter\"\
    ,\n                       \"filter_security_interceptor\"])\n        ])\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 146
  md: "springpython.security.cherrypy3.CP3FilterChainProxy uses CherryPy APIs to insert\
    \ itself into the chain of handlers that are called before our CherryPy application\
    \ is called. This allows the filter chain proxy to apply the security policies\
    \ we are configuring.\n\nThe filter chain proxy is configured with a list of URL\
    \ patterns. On every web request, the proxy will iterate over this list until\
    \ it finds a match.\n\nWhen a match is found, it applies the defined chain of\
    \ filters before allowing access to the web application itself. Each filter is\
    \ configured as a string used to reflectively look up the actual filter in the\
    \ application context.\n\nIf a match is not found, the entire security stack is\
    \ bypassed. This is not the recommended solution. Instead, it is best to cover\
    \ all the possible patterns by having a catch-all pattern (/ .*) to clearly show\
    \ what filters are applied where.\n\nLet's add the first filter needed to the\
    \ application context:\n\n```\nhttpSessionContextIntegrationFilter.\n@Object\n\
    def httpSessionContextIntegrationFilter(self):\n    filter = HttpSessionContextIntegrationFilter()\n\
    \    filter.sessionStrategy = self.session_strategy()\n    return filter\n\n@Object\n\
    def session_strategy(self):\n    return CP3SessionStrategy()\n```\n\nFirst, note\
    \ that the method name matches the filter's string name found in filterChainProxy.\n\
    \nspringpython.security.web.HttpSessionContextIntegrationFilter is used to transfer\
    \ security credentials between the user's HTTP session and Spring Python's SecurityContextHolder.\
    \ The rest of the Spring Python Security components use SecurityContextHolder\
    \ to access the user's credential information.\n\nIn our application's configuration,\
    \ this filter is used when accessing the login page (which we haven't coded yet),\
    \ so that the login page can store credential info. The rest of the application\
    \ has several more filters.\n\nIn order for Spring Python to support different\
    \ web frameworks, the mechanism to interact with HTTP session data is encapsulated\
    \ inside cherrypySessionStrategy(). In our case, we use CP3SessionStrategy."
  merge: -1
  img_proc: true
- pgno: 147
  md: "Let's add the exception_translation_filter to manage any security exceptions\
    \ thrown by other filters or the web application itself.\n\n```\n@Object\ndef\
    \ exception_translation_filter(self):\n    filter = ExceptionTranslationFilter()\n\
    \    filter.authenticationEntryPoint = self.auth_filter_entry_pt()\n    filter.accessDeniedHandler\
    \ = self.accessDeniedHandler()\n    return filter\n```\n\n```\n@Object\ndef auth_filter_entry_pt(self):\n\
    \    filter = AuthenticationProcessingFilterEntryPoint()\n    filter.loginFormUrl\
    \ = \"/login\"\n    filter.redirectStrategy = self.redirectStrategy()\n    return\
    \ filter\n```\n\n```\n@Object\ndef accessDeniedHandler(self):\n    handler = SimpleAccessDeniedHandler()\n\
    \    handler.errorPage = \"/accessDenied\"\n    handler.redirectStrategy = self.redirectStrategy()\n\
    \    return handler\n```\n\n```\n@Object\ndef redirectStrategy(self):\n    return\
    \ CP3RedirectStrategy()\n```\n\nThis filter is responsible for redirecting the\
    \ user to the right page in the event of a security exception. If the user has\
    \ not been authenticated yet, he is redirected to the login page. If he is trying\
    \ to access a page without the appropriate authorization, he is redirected to\
    \ the accessDenied page.\n\nIn order for Spring Python to support different web\
    \ frameworks, the mechanism to issue a web redirect is encapsulated inside redirectStrategy().\
    \ In our case, we uses CP3RedirectStrategy.\n\nLet's add the authenticationProcessingFilter\
    \ to confirm a user is authenticated before proceeding.\n\n```\n@Object\ndef auth_processing_filter(self):\n\
    \    filter = AuthenticationProcessingFilter()\n    filter.auth_manager = self.auth_manager()\n\
    \    filter.alwaysReauthenticate = False\n    return filter\n```"
  merge: -1
  img_proc: true
- pgno: 148
  md: "This filter's job is to confirm the user is authenticated. If not, a security\
    \ exception is thrown, and the exception_translation_filter handles the outcome.\
    \ At this stage, it is possible to configure the system to re-authenticate on\
    \ every web request, or to avoid consuming as many resources by caching the authentication\
    \ status.\n\nThe following diagram shows how the filters are nested together.\
    \ A call into this stack of filters gives each filter a chance to perform security\
    \ functions on entry and/or exit. It also shows how the entire Spring Python Security\
    \ stack is neatly staged between the caller and the application, without having\
    \ to intertwine itself into the application itself through either class hierarchy\
    \ or meddling with the application's API.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_148_0.png)\n\
    \nLet's define the AuthenticationManager that manages the lookup of user credentials.\
    \ For our situation, we will define a fixed list of users for test purposes.\n\
    \n```\n@Object\ndef auth_manager(self):\n    auth_manager = AuthenticationManager()\n\
    \    auth_manager.auth_providers = [self.auth_provider()]\n    return auth_manager\n\
    ```\n\n```\n@Object\ndef auth_provider(self):\n    provider = DaoAuthenticationProvider()\n\
    \    provider.user_details_service = self.user_details_service()\n    provider.password_encoder\
    \ = PlaintextPasswordEncoder()\n    return provider\n```"
  merge: -1
  img_proc: true
- pgno: 149
  md: "```\ndef user_details_service(self):\n    user_details_service = InMemoryUserDetailsService()\n\
    \    user_details_service.user_dict = {\n        \"alice\": (\"alicespassword\"\
    , [\"ROLE_READ\", \"ROLE_EDIT\"], True),\n        \"bob\": (\"bobspassword\",\
    \ [\"ROLE_READ\"], True)\n    }\n    return user_details_service\n```\n\nauth_manager\
    \ references a list of authentication providers that are used to check credentials.\
    \ When an authentication request is submitted, AuthenticationManager goes down\
    \ this list, asking each one to attempt authentication until one of them succeeds.\
    \ If no provider succeeds, AuthenticationManager throw a security exception, denying\
    \ access.\n\nRight now, we have only one provider defined, but it is possible\
    \ to have more. This meets another one of our key requirements: multiple security\
    \ providers must be allowed.\n\nOur provider, DaoAuthenticationProvider, taps\
    \ its user_details_service in order to lookup the user. It then runs the user-supplied\
    \ password through its password_encoder and compares it to the stored password.\
    \ In our situation, we are using an InMemoryUserDetailsService instead of an actual\
    \ database, and the password is stored in the clear instead of hashed.\n\n> >\
    \ It is highly recommended to not store passwords in the clear on any production\
    \ system.\n\nAs you can see, we currently have two user accounts defined:\n\n\
    +   - alice has two defined roles: ROLE_READ and ROLE_EDIT. alice is an enabled\
    \ account\n+   - bob has one defined role: ROLE_READ. bob is an enabled account\n\
    \nUsing the InMemoryUserDetailsService makes it easy to get our application up\
    \ and running from a security perspective, since we don't have to worry about\
    \ integrating with any external systems."
  merge: -1
  img_proc: true
- pgno: 150
  md: "With all the components nicely separated, we can later swap InMemoryUserDetailsService\
    \ with DatabaseUserDetailsService when we are ready to go online. We can also\
    \ replace PlaintextPasswordEncoder with either ShaPasswordEncoder or Md5PasswordEncoder,\
    \ to easily support different hashing algorithms.\n\nLet's define the last filter\
    \ needed in our chain: filter_security_interceptor.\n\n```\n@Object\ndef filter_security_interceptor(self):\n\
    \    filter = FilterSecurityInterceptor()\n    filter.auth_manager = self.auth_manager()\n\
    \    filter.access_decision_mgr = self.access_decision_mgr()\n    filter.sessionStrategy\
    \ = self.session_strategy()\n    filter.obj_def_source = [\n        (\"edit.*\"\
    , [\"ROLE_EDIT\"]),\n        (\"/.*\", [\"ROLE_READ\"])\n    ]\n    return filter\n\
    ```\n\n```\n@Object\ndef access_decision_mgr(self):\n    access_decision_mgr =\
    \ AffirmativeBased()\n    access_decision_mgr.allow_if_all_abstain = False\n \
    \   access_decision_mgr.access_decision_voters = [RoleVoter()]\n    return access_decision_mgr\n\
    ```\n\nfilter_security_interceptor is the last security check in our app. Its\
    \ job is to make sure the user is authorized to complete the request. It looks\
    \ at the URL of the web request, and then goes down its list of URL patterns until\
    \ it finds a match. When it does, it sees a list of roles. The roles along with\
    \ the user's credentials are given to the access_decision_mgr, who submits a request\
    \ for a vote from each of its access_decision_voters. In our configuration, we\
    \ are using RoleVoter, which votes on whether or not the user has the role supplied\
    \ in the list.\n\naccess_decision_mgr tallies up the votes, and decides if access\
    \ is granted based on the policy. In our case, we have an AffirmativeBased policy,\
    \ meaning that we need only one up vote, i.e. we only need to have one of the\
    \ roles in the list. If we switched to a UnanimousBased policy, we would be required\
    \ to have all the roles. A ConsensusBased policy would require that we have a\
    \ majority of the roles."
  merge: -1
  img_proc: true
- pgno: 151
  md: "This policy indicates that a user can only access /edit* URLs if he has ROLE_EDIT.\
    \ For any other web path, the user must have ROLE_READ. Note: don't forget that\
    \ /login* is excluded from this filter.\n\n+   - Let's add a login page to our\
    \ view layer\n+   - Let's add the code to create and process a login page in our\
    \ controller\n\n```\n```python\n@cherrypy.expose\ndef login(self, fromPage=\"\
    /\", login=\"\", password=\"\",\nerrorMsg=\"\"):\n    return self.controller.getLoginPage(\n\
    \        fromPage, login, password, errorMgr)\n```\n```\n\n```\n```python\ndef\
    \ getLoginPage(self,fromPage=\"/\"\n\",login=\"\",password=\"\",errorMsg=\"\"\
    ):\n    if login != \"\" and password != \"\":\n        try:\n            self.authenticate(login,\
    \ password)\n            return [self.redirector.redirect(fromPage)]\n       \
    \ except AuthenticationException, e:\n            return [self.redirector.redirect(\n\
    \                \"?login=%s&errorMsg=Username/password failure\" %\n        \
    \        login)]\n\n    results = \"\"\"\n<html>\n    <head>\n        <title>Spring\
    \ Python book demo</title>\n    </head>\n    <body>\n        <form method=\"POST\"\
    \ action=\"\">\n            Login: <input type=\"text\" name=\"login\" value=\"\
    %s\"\nsize=\"10\"/><br/>\n            Password: <input type=\"password\" name=\"\
    password\" size=\"10\"/>\n><br/>\n            <input type=\"hidden\" name=\"fromPage\"\
    \ value=\"%s\"/><br/>\n            <input type=\"submit\"/>\n        </form>\n\
    \        <a href=\"http://springpythonbook.com\">Spring Python book</a>\n    </body>\n\
    </html>\n    \"\"\" % (login, fromPage)\n```\n```"
  merge: -1
