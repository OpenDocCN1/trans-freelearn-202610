  md: 'And as your needs grow, this project will grow as well. Spring Python makes
    it easy to code your own templates and modules. You can code and inject your custom
    services just as easily as Spring Python''s pre-built ones. If you have ideas
    for new features that you think belong in Spring Python, you can visit the website
    at http://springpython.webfactional.com to find out how to submit ideas, patches,
    and perhaps join the team to help grow Spring Python.


    # Installing Spring Python


    Spring Python is easy to install. It comes with two installable tar balls. One
    is the core library itself. The other is a set of samples you can optionally install
    to help get a better understanding of Spring Python. As it is written in pure
    Python, the installed files are the source code as well, so you can see how Spring
    Python works.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_31_0.png)


    > This installation section does NOT show how to install all the parts needed
    to develop patches for the Spring Python project. For more information on setting
    up a developer''s environment, please join the Spring Python mailing list at http://lists.springsource.com/listmanager/listinfo/springpython-users
    where you can ask about current development requirements.


    # Setting up an environment for Spring Python


    Installing Spring Python currently requires Python 2.4, 2.5, or 2.6. It can also
    be run on Jython 2.5. At the time of this writing, it hasn''t been extended to
    support Python 3 due to lack of backwards compatibility and immaturity. However,
    as Python 3 gains acceptance in the user community, Spring Python will move to
    support it as well.


    Spring Python makes it easier to integrate with certain 3rd party libraries. Installation
    of those 3rd party libraries is not covered in this book. For example, to write
    queries against an Oracle database, you need to install the **cxora** package.'
