  md: "This is admittedly a lot of code to add to our application context. Spring\
    \ Python requires a lot of steps to add the security components, a fate shared\
    \ by the Spring Security project. They spent a considerable amount of effort reducing\
    \ the amount of code needed to configure security for typical configurations.\
    \ Hopefully in the future Spring Python can be improved in a similar fashion.\n\
    \nIn this configuration, we are using the InMemoryUserDetailsService in order\
    \ to hard code three users: alice (customer), bob (bank manager), and carol (bank\
    \ supervisor). This saves us from having to configure a database while we develop\
    \ our application.\n\n+   3. Let's change the core app, so that it has a login\
    \ page and can handle logging in and logging out.\n\n```\n```python\nimport cherrypy\n\
    \nfrom springpython.security import *\nfrom springpython.security.providers import\
    \ *\nfrom springpython.security.context import *\n\nclass SpringBankView(object):\n\
    \n    def __init__(self):\n        self.filter = None\n        self.auth_provider\
    \ = None\n        self.http_context_filter = None\n\n    @cherrypy.expose\n  \
    \  def index(self):\n        return \"\"\"\n            Welcome to SpringBank!\n\
    \            <p>\n            <p>\n            <a href=\"logout\">Logout</a href>\n\
    \        \"\"\"\n\n    @cherrypy.expose\n    def login(self, from_page=\"/\",\
    \ login=\"\", password=\"\", error_msg=\"\"):\n        if login != \"\" and password\
    \ != \"\":\n            try:\n                self.attempt_auth(login, password)\n\
    \                raise cherrypy.HTTPRedirect(from_page)\n            except AuthenticationException,\
    \ e:\n```\n```"
