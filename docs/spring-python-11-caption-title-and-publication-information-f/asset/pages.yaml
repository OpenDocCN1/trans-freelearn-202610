- pgno: 155
  md: "By using the `InMemoryUserDetailsService` in an alternative application context,\
    \ it is easy to create a whole host of user accounts that have all the permutations\
    \ of roles, privileges, good and bad passwords needed to checkout the services.\
    \ CherryPy is especially easy to test, because it doesn't require running the\
    \ web container. Since CherryPy conveniently maps URLs to methods, it is easy\
    \ enough to call the methods directly from a test harness rather than verify the\
    \ web handling machinery of CherryPy. And swapping the data access layer with\
    \ either stubs or mocks makes it easy to isolate business logic.\n\nAll these\
    \ things help to build a high confidence automated test suite. With the core of\
    \ our application easily subjected to automated testing, it now becomes easy to\
    \ decide whether or not to use an automated web container test kit for the web\
    \ layer. It is also an option to test the 3rd party security system through automated\
    \ integration testing.\n\nBy removing the need to code security APIs by hand inside\
    \ our business logic and also decoupling the web layer, it becomes much easier\
    \ to automate testing, leading to a more powerful system that meets expectations.\n\
    \n# Configuring SQL-based security\n\nWe configured our wiki application with\
    \ startup security by using `InMemoryUserDetailsService`. It's easy to upgrade\
    \ to database-managed security by simply swapping that component out with `DatabaseUserDetailsService`.\n\
    \nIn the `SpringWikiAppContext`, we just need to change `user_details_service`\
    \ to:\n\n```\n@Object\ndef user_details_service(self):\n    service = DatabaseUserDetailsService()\n\
    \    service.dataSource = self.factory()\n    return service\n```\n\nIn this example,\
    \ we have left out the coding of `factory()`. This is simply a connection factory\
    \ used to create a `DatabaseTemplate` to talk to the database, as covered in the\
    \ earlier SQL chapter.\n\n`DatabaseUserDetailsService` defines the following queries\
    \ to look up user data and granted authorities:\n\n+   - To lookup users: `SELECT\
    \ username,password,enabled FROM users WHERE username = ?`\n+   - To lookup authorities:\
    \ `SELECT username,authority FROM authorities WHERE username = ?`"
  merge: -1
  img_proc: true
- pgno: 156
  md: "Even though these are the default settings, it is easy to support another schema.\
    \ Just override the variables as shown below.\n\n```\n@Object\ndef user_details_service(self):\n\
    \    service = DatabaseUserDetailsService()\n    service.dataSource = self.factory()\n\
    \    service.DEF_USERS_BY_USERNAME_QUERY = \"<alt user qry>\"\n    service.DEF_AUTHORITIES_BY_USERNAME_QUERY\
    \ = \"<alt auth qry>\"\n    return service\n```\n\n# Configuring LDAP-based security\n\
    \nLDAP is a popular protocol used to host user accounts and group associations\
    \ as well. Spring Python provides a convenient LdapAuthenticationProvider with\
    \ flexible options to support conventional schemas as well as custom ones.\n\n\
    > At the time of writing, Spring Python LDAP only works on CPython and not on\
    \ Jython.\n\nLdapAuthenticationProvider has two components:\n\n+   - A BindAuthenticator\
    \ and a PasswordComparisonAuthenticator to perform authentication\n+   - A DefaultLdapAuthoritiesPopulator\
    \ to lookup granted authorities based on conventional LDAP group associations\n\
    \nLDAP supports binding, where the server confirms the user's password. BindAuthenticator\
    \ utilizes this feature to confirm the user's password.\n\nIt is also possible\
    \ to fetch the password from the directory server, and do a password comparison\
    \ after properly hashing the user's password. PasswordComparisonAuthenticator\
    \ is used to perform this operation.\n\nAfter confirming a user's credentials,\
    \ the second step of LdapAuthenticationProvider is to search the directory for\
    \ groups the user is associated with."
  merge: -1
  img_proc: true
- pgno: 157
  md: "The following code shows an application context where LdapAuthenticationProvider\
    \ is set up with a BindAuthenticator and an authorities populator.\n\n```\nfrom\
    \ springpython.config import PythonConfig\nfrom springpython.config import Object\n\
    \nfrom springpython.security.providers.Ldap import *\n\nclass LdapAppContext(PythonConfig):\n\
    \    def __init__(self):\n        super(LdapAppContext, self).__init__()\n\n \
    \   @Object\n    def auth_manager(self):\n        auth_manager = AuthenticationManager()\n\
    \        auth_manager.auth_providers = [self.auth_provider()]\n        return\
    \ auth_manager\n\n    @Object\n    def auth_provider(self):\n        provider\
    \ = LdapAuthenticationProvider()\n        provider.ldap_authenticator = self.authenticator()\n\
    \        provider.ldap_authorities_populator =\n            self.authorities_populator()\n\
    \        return provider\n\n    @Object\n    def context(self):\n        return\
    \ DefaultSpringSecurityContextSource(\n            url=\"ldap://localhost:53389/dc=springpythonbook,dc=com\"\
    )\n\n    @Object\n    def authenticator(self):\n        return BindAuthenticator(\n\
    \            context_source=self.context(),\n            user_dn_patterns=\"uid={0},ou=people\"\
    )\n\n    @Object\n    def authorities_populator(self):\n        return DefaultLdapAuthoritiesPopulator(\n\
    \            context_source=self.context(),\n            group_search_base=\"\
    ou=groups\")\n```"
