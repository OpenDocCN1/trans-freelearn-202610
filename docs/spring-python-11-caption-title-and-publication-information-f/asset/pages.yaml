    %(asctime)s - %(name)s - %(levelname)s - %(message)s\")\n    ch.setFormatter(formatter)\n\
    \    logger.addHandler(ch)\n\n    applicationContext = ApplicationContext(\\\n\
    \        java_app_context.JavaSystemConfiguration())\n    controller = applicationContext.get_object(\"\
    controller\")\n```\n\n11. Running Jython scripts with 3rd party libraries can\
    \ be a little tricky. To make sure that the JVM can load classes from jar files,\
    \ the jar files need to be passed in to the JVM as classpath entries\n\n```\n\
    jython -J-classpath org.springframework.jdbc-3.0.1.RELEASE.jar:org.springframework.core-3.0.1.RELEASE.jar:org.springframework.transaction-3.0.1.RELEASE.jar:org.springframework.beans-3.0.1.RELEASE.jar:commons-logging-1.1.1.jar:commons-dbcp-1.4.jar:commons-pool-1.5.4.jar:mysql-connector-java-5.1.12-bin.jar\
    \ java_system.py\n```"
