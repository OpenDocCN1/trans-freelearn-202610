- pgno: 122
  md: "Because our Bank was written using simple constructor injection, there was\
    \ no need to alter it in order to run it without a container. Since we are programmatically\
    \ using TransactionTemplate, there is no requirement to use the IoC container.\
    \ This offers developers an opportunity to evaluate Spring Python purely for the\
    \ transactional features without having to try out the IoC container at the same\
    \ time.\n\nBut it is important to remember that multiple examples of the value\
    \ of IoC have already been shown in this book, and many more are coming.\n\n#\
    \ @transactional versus programmatic\n\nThe Spring way includes giving developers\
    \ options. In order to choose the right approach, here are some pros and cons:\n\
    \n+   @transactional\n+   - Pros:\n+     - Defines transactions with a single\
    \ line.\n+     - Clear, concise, easy-to-read.\n+   - Cons:\n+     - Requires\
    \ IoC to wire AutoTransactionalObject.\n+     - Requires editing existing code.\n\
    +   \n+   programmatic\n+   - Pros:\n+     - Explicitly shows the transactional\
    \ behavior where it occurs.\n+     - Doesn't require IoC.\n+   - Cons:\n+    \
    \ - Re-introduces code tangling.\n+     - Requires editing existing code.\n\n\
    If the cons for either of these solutions are not acceptable, there is a third\
    \ choice: declaring transactions from inside the IoC container. This allows easy\
    \ wrapping of business code with transactions without code tangling and without\
    \ editing already existing code. We will demonstrate this later in the chapter.\
    \ But first let's look at adding new functions.\n\n# Making new functions play\
    \ nice with existing transactions\n\nSo far, we have managed to build a bank that\
    \ does one thing: transfer money. As with any software project, we typically have\
    \ to grow the functionality. As we proceed with modifications to our Bank, we\
    \ want to add new transactions without risking existing ones. Spring Python's\
    \ transaction management makes this very simple."
