- pgno: 129
  md: 'With this alternative configuration, we use `TransactionProxyFactoryObject`.
    This is an out-of-the-box AOP interceptor that Spring Python offers to automatically
    wrap certain functions with `TransactionTemplate`. It requires a transaction manager
    as well as the target object, our `Bank`. It also needs a list of tuples, with
    each tuple defining a regular expression for method matching as well as a list
    of transaction properties just like we plugged into `@transactional` earlier in
    this chapter.


    What is the right choice: `@transactional` or `TransactionProxyFactoryObject`?


    +   - `@transactional` is clear, concise, and easy-to-read. Its biggest drawback
    is the requirement to edit existing code. If we own the code, then this shouldn''t
    be a problem.

    +   - If we are trying to wrap transactions around a 3rd party library that we
    don''t directly control, `TransactionProxyFactoryObject` is the best choice.


    # Testing your transactions


    Transactions are intrinsically tied to databases. Attempting to mock or stub this
    out would require an extreme amount of effort, and probably not be worth the effort.
    This is one area where I generally agree with testing against an actual database.


    It is possible to use lightweight databases such as `sqlite` for this effort,
    but it may be risky if this isn''t the target platform for production. In fact,
    the best testing effort would be a properly setup test bed using the same version
    of database engine as production. The important point is that it is easy to create
    lightweight tests against something small such as `sqlite`. This can confirm to
    the developers that things are working as expected. More extensive integration
    testing can be done with a production grade test-bed.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_129_0.png)


    > Easily swapping out different database configurations is one of the major advantages
    of using Spring Python.'
