- pgno: 63
  md: '# 3


    # Adding Services to APIs


    In the previous chapter, we took a look at Spring Python''s Inversion of Control
    container, and used it to exchange production objects with test doubles. One of
    the most prolific paradigms used today is **Object Oriented Programming (OOP)**
    which uses classes. Classes serve as representations of the domain and business
    problems that we solve. But this isn''t enough!


    We also need robust features such as caching, storage and retrieval, transactions,
    security, and logging. These services are orthogonal to the business problems
    that we must solve.


    Mixing classes with these orthogonal services can quickly become costly to code
    correctly as well as maintain. **Aspect Oriented Programming (AOP)** solves these
    orthongal problems through a new type of modularization called an **aspect**.


    In this chapter, we will learn:


    +   - AOP from 10,000 feet

    +   - Adding caching to Spring Python objects

    +   - Extending the example by adding performance and security advisors

    +   - How AOP is a paradigm and not just a library

    +   - The distinct features of Spring Python''s AOP, compared to other libraries
    as well as Python language features

    +   - The risks of AOP and how to mitigate them by showing how to test our aspects

    +   - Some advice about applying `Advice`'
  merge: -1
