    client was actually a GUI application with this tied to a button, there would
    be no difference.


    Now let''s run the client script.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_180_0.png)


    As can be seen, each invocation shows which PyroProxyFactory was called, and they
