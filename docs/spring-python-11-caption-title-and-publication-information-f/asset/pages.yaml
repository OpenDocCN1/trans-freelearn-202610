- pgno: 178
  md: "3. Now let's launch the script:\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_178_0.png)\n\
    \nIn this script, we turned on some of Spring Python's built in logging, so we\
    \ could see some of parts involved with starting up remoting. We can see two different\
    \ Pyro daemon threads being launched, one for each of the ports. And then we see\
    \ two instances of our Service code being registered, one with each thread.\n\n\
    We now have two copies of our service ready and waiting to be called.\n\n# Creating\
    \ a round-robin dispatcher\n\nThere are many different ways to code a dispatcher.\
    \ For our example, let's pick a simple round robin algorithm where we cycle through\
    \ a fixed list.\n\nLet's create an application context that includes a round robin\
    \ dispatcher that acts like our service, fed with a list of PyroProxyFactory elements.\n\
    \n```\nfrom springpython.config import *\nfrom springpython.remoting.pyro import\
    \ *\n\nclass RoundRobinDispatcher(object):\n    def __init__(self, proxies):\n\
    \        self.proxies = proxies\n        self.counter = 0\n\n    def happy_birthday(self,\
    \ parm):\n        self.counter += 1\n        proxy = self.proxies[self.counter\
    \ % 2]\n        print \"Calling %s\" % proxy\n```"
  merge: -1
  img_proc: true
- pgno: 179
  md: "```\nreturn proxy.happy_birthday(parm)\n\nclass HappyBirthdayContext(PythonConfig):\n\
    \    def __init__(self):\n        PythonConfig.__init__(self)\n\n    @Object\n\
    \    def service_proxies(self):\n        proxies = []\n        for port in [\"\
    7001\", \"7002\"]:\n            proxy = PyroProxyFactory()\n            proxy.service_url\
    \ = \"PYROLOC://127.0.0.1:%s/service\" % port\n            proxies.append(proxy)\n\
    \        return proxies\n\n    @Object\n    def service(self):\n        return\
    \ RoundRobinDispatcher(self.service_proxies())\n```\n\nWe configured service_proxies\
    \ as an array of PyroProxyFactorys. This lets us define a static list of connections.\n\
    \nThe RoundRobinDispatcher class is injected with the proxies, and mimics the\
    \ API of our Happy Birthday service. Every call into the dispatcher increments\
    \ the counter. It then picks one of the proxies to make the actual call.\n\n#\
    \ Adjusting client configuration without client code knowing its talking to multiple\
    \ node backend\n\nLet's write the client script to use our round robin dispatcher.\n\
    \n```\nfrom springpython.context import *\n\nfrom multi_client_ctx import *\n\n\
    if __name__ == \"__main__\":\n    ctx = ApplicationContext(HappyBirthdayContext())\n\
    \    s = ctx.get_object(\"service\")\n\n    print \"\\n\".join(s.happy_birthday(\"\
    Greg\"))\n    print \"\\n\".join(s.happy_birthday(\"Greg\"))\n    print \"\\n\"\
    .join(s.happy_birthday(\"Greg\"))\n```"
