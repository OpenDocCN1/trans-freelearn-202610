    \"\",\n        (amt, act))\n    if (rows == 0) {\n        raise Exception(\"Account\
    \ %s does not exist.\" % act)\n\n@transactional\ndef transfer(self, transfer_amt,\
    \ source_act, target_act):\n    self.withdraw(transfer_amt, source_act)\n    self.deposit(transfer_amt,\
    \ target_act)\n```\n\nWe have made several changes that start to make our application\
    \ look like a real bank. They are as follows:\n\n+   - We created a `balance`\
    \ function that allows us to look up the balance for an account\n+   - The `withdraw`\
    \ function now checks the balance to make sure there is enough to withdraw\n+\
    \   - The `withdraw` function verifies that a row of data was updated, confirming\
    \ the withdrawn account is real\n+   - The `deposit` function verifies that a\
    \ row of data was updated, confirming that the deposited account is real\n\n#\
    \ How Spring Python lets us define a transaction's ACID properties\n\nAs discussed\
    \ earlier, the ACID properties of transactions are as follows:\n\n+   - **Atomicity**\
    \ – We need to guarantee that all steps complete, or no steps complete.\n+   -\
    \ **Consistent** – This is the concept of ensuring our data maintains a consistent\
    \ state."
