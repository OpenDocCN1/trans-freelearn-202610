    ![](img/bcf886d8b665372ee8afbb620d4273bb_61_0.png)


    > It is important to realize that just because we were starting with a Spring
    Java application doesn''t mean this technique is only for Spring-based Java projects.
    In the previous example, we quickly moved past javaBeans.xml and wired the Java
    components using Spring Python''s XML format.


    # Summary


    In this chapter we explored swapping test doubles using Inversion of Control (IoC).
    This is not the only use case for IoC. Being able to easily reconfigure things
    with no impact to the core business logic is of incredible value.


    IoC allows us to move object creation to a centralized location. This empowers
    our applications to be easier to inject alternatives. This makes things such as
    testing, remoting, transactions, and security much easier.


    Spring Python supports many formats including pure Python, Spring Python XML,
    and Spring Java XML. This gives users a wide range of choices based on their needs.
    By working with Jython, it is much easier to mix together Python and Java code
    together.


    Exchanging one object definition with another constitutes a useful service. Throughout
    this book, other services will be explored. Just remember, at the heart of those
    services is Spring Python''s IoC container.


    In this chapter, we learned:


    +   - IoC containers make it easy to isolate objects under test by swapping production
    collaborators with test doubles

    +   - Detailed definitions of IoC and Dependency Injection

    +   - IoC containers positively impact our application by separating creation
    of objects from their usage, and this helps modularize our applications

    +   - The Hollywood principle of Dependency Injection means that our objects don''t
    create their collaborators, but instead wait for the container to create them
    and inject them into our object'
