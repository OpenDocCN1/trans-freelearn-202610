- pgno: 152
  md: "```\nreturn [results]\n\ndef authenticate(self, username, password):\n    token\
    \ = UsernamePasswordAuthenticationToken(username, password)\n    SecurityContextHolder.getContext().authentication\
    \ = self.auth_manager.authenticate(token)\n    self.httpContextFilter.saveContext()\n\
    ```\n\n+   - We also need to initialize the controller with some of the security\
    \ components\n+   \n+   ```\n+   def __init__(self):\n+       self.httpContextFilter\
    \ = None\n+       self.auth_manager = None\n+       self.redirector = None\n+\
    \   ```\n\n+   - These controller attributes must be injected from the IoC container\n\
    +   \n+   ```\n+   @Object\n+   def controller(self):\n+       ctrl = controller.SpringWikiController()\n\
    +       ctrl.httpContextFilter = self.httpSessionContextIntegrationFilter()\n\
    +       ctrl.auth_manager = self.auth_manager()\n+       ctrl.redirector = self.redirectStrategy()\n\
    +       return ctrl\n+   ```\n\nWith these parts injected into the controller,\
    \ it now has the ability to process a login request, store it into the context,\
    \ and have the user's authenticated credentials stored in their HTTP session data.\n\
    \nWith all these modifications in place, Spring Python has clearly made it possible\
    \ to wrap an existing application with a layer of security. The IoC definitions\
    \ show fine grained control over what URLs require which filters, and also which\
    \ authorization roles. This meets the important requirement: 'the security solution\
    \ must be orthogonal to the class hierarchy'. At no time were we required to extend\
    \ any security-based classes. Instead, we used a series of filters and security\
    \ classes, all defined outside the hierarchy of our business model.\n\nBy keeping\
    \ the policies in the centralized location of the application context, it is easy\
    \ to adjust them as necessary. For example, if we needed a /admin.* pattern linked\
    \ with ROLE_ADMIN, it is easy to adjust the access_decision_manager to easily\
    \ support this. We can also put various URL patterns underneath different policies,\
    \ all from within the application context. This supports the key requirement:\
    \ 'security policies must be flexible and easy to fine tune'."
  merge: -1
  img_proc: true
- pgno: 153
  md: "# Accessing security data from within the app\n\nWe briefly mentioned how Spring\
    \ Python Security stores user credentials in the SecurityContextHolder. This provides\
    \ an easy way to lookup important security information from within our application\
    \ without having to alter our APIs.\n\nSo far, we have managed to develop a relatively\
    \ simple web application, and then wrap it with a layer of security that protects\
    \ URLs based on roles. There may be situations where that isn't enough. While\
    \ protection of URLs is nice, it may be useful to disable or hide some links based\
    \ on the user's role power. This is a more fine grained option, and is easy to\
    \ implement.\n\nIn the definition of the Page object that is used to render html,\
    \ the footer definition contains this:\n\n```\ndef footer(self):\n    \"\"\"Standard\
    \ footer used for all pages.\"\"\"\n    footer = \"\"\"\n        <ul>\n      \
    \      <li><a href=\"/edit/\"\"\" + self.article + \"\"\"\">Edit</a></li>\n  \
    \      </ul>\n        <a href=\"http://springpythonbook.com\">Spring Python book</a>\n\
    \    </body>\n    \"\"\"\n    return footer\n```\n\nIn this situation, when viewing\
    \ an article, we present the user with option to click on the edit link. However,\
    \ if the user doesn't have ROLE_EDIT, the request will redirect him to an access\
    \ denied page.\n\nThe preferred solution would be to hide this link so they don't\
    \ click on it in the first place. Reducing the opportunities for users to wander\
    \ into access denied pages not only reduces the demand on the security layer,\
    \ but also improves the user experience. But our current security solution we\
    \ have put in doesn't deal with conditionally altering HTML. Writing a filter\
    \ to manage this isn't pragmatic. Instead, it is best to put some conditional\
    \ checks right here to check user credentials, and optionally render the hyperlink.\n\
    \n```\ndef footer(self):\n    \"\"\"Standard footer used for all pages.\"\"\"\n\
    \    footer = \"\"\n```"
  merge: -1
  img_proc: true
- pgno: 154
  md: "```\nif \"ROLE_EDIT\" in SecurityContextHolder.getContext().\n            \
    \            authentication.granted_auths:\n    footer += \"\"\"\n    <ul>\n \
    \       <li><a href=\"/edit/\"\"\" + self.article + \"\"\">Edit\n            </a></li>\n\
    \    </ul>\n    \"\"\"\n\n    footer += \"\"\"\n        <a href=\"http://springpythonbook.com\"\
    >Spring Python book\n        </a>\n    </body>\n    \"\"\"\n    return footer\n\
    ```\n\nSecurityContextHolder is a globally accessible object. It contains a context,\
    \ which specifies where the current authentication credentials are being stored.\n\
    \n+   - If SecurityContextHolder is configured with mode \"GLOBAL\", then there\
    \ is a single context for the entire Python VM, meaning all threads will see the\
    \ same security credentials\n+   - If SecurityContextHolder is configured with\
    \ mode \"THREADLOCAL\", then the context is stored in threading.local(), meaning\
    \ there is a separate context for each thread. This is useful for multi-threaded\
    \ server apps where a separate thread exists for each user\n\nBy the time this\
    \ code is actually executed, SecurityContextHolder will have been populated with\
    \ user data, allowing us to do a quick check and only offer this link of the user\
    \ has the necessary role, without altering our application API. This satisfies\
    \ the requirement: 'credential data and other security APIs must be available\
    \ non-intrusively'.\n\n# Testing application security\n\nTesting security has\
    \ traditionally been a challenge, because there are many facets to cover. Integrating\
    \ with a 3rd party authentication system is one part that needs to be checked\
    \ out. Making sure the application is using the security system is also needed.\
    \ And confirming that both good and bad accounts are handled properly is important.\
    \ Often, we tend to code successful scenarios. Its important to know that our\
    \ software responds to failing scenarios as well. While this is important for\
    \ general coding, it is especially critical to test failing security scenarios.\
    \ If the system doesn't properly handle invalid or expired credentials, what is\
    \ the point in securing the system?"
