- pgno: 181
  md: 'Our application started off as a simple client calling a service. By rewiring
    it to use IoC, it allowed us to easily reconfigure things to run multiple copies
    of our service on multiple nodes, without having to change the core logic.


    Our round robin dispatcher is admittedly very simplistic. A real production solution
    would require:


    +   - More sophisticated error handling to deal with things like remote access
    exceptions.

    +   - We would also need a way to grow new nodes and have them added to the list.

    +   - Perhaps by letting the dispatcher export itself, other services can latch
    on and find out what services are available.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_181_0.png)


    > Spring Python doesn''t provide dispatchers, routers, and other types of components
    used to integrate systems together. Spring Integration (http://www.springsource.org/spring-integration)
    is a separate part of the Spring portfolio that brings these features to Java.
    Spring Python Remoting is a building block that in the future can be used to build
    a Spring Python Integration module.


    We could spend countless hours refining our dispatcher. We can also focus on adding
    more features to our core business logic.


    The important factor in all this as that we have demonstrated how Spring Python
    provides a non-invasive way to scale our original application far beyond what
    it was originally designed for.


    In this chapter we have learned:


    +   - How Pyro provides a nice Python-to-Python remoting capability to easily
    create client-server applications

    +   - How Spring Python seamlessly integrates with Pyro so that your application
    doesn''t have to learn the API

    +   - That it is easy to convert a simple application into a distributed one,
    all on the same machine

    +   - We rewired our application by splitting it up into parts, plugging in a
    round-robin queue manager, and running multiple copies of the server with no impact
    to our business logic


    In the next chapter, we will use all of Spring Python''s components to build a
    simple, scalable, and secure application with strong integrity.'
