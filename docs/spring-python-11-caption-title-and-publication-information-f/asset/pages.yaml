- pgno: 83
  md: '# Distinct features of Spring Python''s AOP module


    Spring Python isn''t the only means to code an AOP solution. There are other libraries
    available, such as `Aspyct` and `aspects.py`. Python''s rich feature set also
    provides the ability to code in an AOP-like fashion, using things like meta-class
    programming and decorators.


    It is important to note what makes Spring Python''s AOP solution distinct. While
    I have tried to include some high-level comparison with `Aspyct` and `aspects.py`,
    the reader is encouraged to visit these projects and compare the features in more
    detail.


    | Difference | Description |

    |---|---|

    | Advice applicable to instances of objects. | Spring Python gives the developer
    the option of applying advice to individual instances of objects, without requiring
    all instances to adopt the behavior. This gives the developer maximum flexibility.
    The tradeoff is that if this behavior is desired for all instances, then the developer
    is responsible to apply it to all instances.


    `Aspyct` allows you to define aspects and apply them to functions. The behavior
    permanently modifies the function, and this impacts all instances.


    The ability to wrap functions around methods is offered by `aspects.py`. This
    would apply to all instances. It also supports wrapping a subset of instances
    in this fashion. |

    | No metaclass programming. | For certain problems, metaclass programming may
    be the easiest solution. For other problems, metaclass programming isn''t what
    is needed. It is an alternative paradigm from standard OOP and procedural development
    practices. In OOP, classes are templates for creating objects. Metaclasses are
    templates for creating classes. This means that some crosscutting problems may
    easily fit metaclasses programming, while other problems do not.


    Spring Python''s AOP solution doesn''t require learning a complex concept. Instead,
    it is based on creating classes and using IoC to define pointcuts that apply the
    advice. |'
  merge: -1
  img_proc: true
- pgno: 84
  md: '| Difference | Description |

    |---|---|

    | Don''t need access to source code. | Metaclass programming requires access to
    the source code. So does applying decorators defined in an AOP library. Both of
    these options make it harder to apply advice to a 3rd party library, since developers
    are less likely to take on maintaining patches.


    Asp yct and aspects.py don''t require altering the source code. However, Asp yct''s
    primary means of application involves using decorators, which would require access
    to the source code.


    Considering how Spring Python leverages its IoC container to apply advice, it
    is easy to utilize classes from any library and apply independent advisors. |

    | No monkey patching. | Monkey patching is where an object''s functions are added,
    removed, or replaced at runtime. While some people consider monkey patching a
    valuable tool, it must be used with care. There is a certain level of associated
    risk with altering the class definitions of libraries, which may result in unpredictable
    bugs.


    Spring Python utilizes proxies to merge target objects with interceptors. This
    makes it easy to add and remove advice, while maintaining a nice separation between
    services and target APIs. Later on in this chapter, automated testing of aspects
    will be discussed. |


    # The risks of AOP


    AOP carries its own risks. When some of the functionality (in our case, caching),
    is moved out of our core code and into an interceptor, it may not be apparent
    when the caching logic is active. We may not even be aware that there is caching
    in the system. But the same could be said about OOP practices, where commonly
    used functionality is moved to other classes up or down the inheritance hierarchy.
    All of these coding styles are better served by the right set of tools, developer
    training, documentation, automated test suites, and communication amongst the
    development team. Since AOP is relatively new compared to OOP, the tool sets aren''t
    as mature and developers are not as familiar with the concepts.


    But this doesn''t mean AOP should be abandoned. Instead, it should be evaluated
    just like any other technology, language, and tool suite used by the team.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# AOP is part of the Spring triangle


    The following diagram — known as the Spring triangle — encompasses the key principles
    used by Spring Python:


    ![](img/bcf886d8b665372ee8afbb620d4273bb_85_0.png)


    Using Spring Python''s IoC container we have been able to take a simple WikiService
    object and layer on a CachingService through AOP. By using Dependency Injection,
    we have kept WikiService clear of any Spring Python dependencies. To read the
    details of this, we just look up the blue prints of our IoC container in WikiProductionAppConfig.
    Spring also utilized Portable Service Abstractions, such as DatabaseTemplate,
    to reduce the need to work with low level APIs. Later on in this book, we will
    revisit the Spring triangle to discuss this in more detail.


    # Testing our aspects


    If you''re a professional software developer, you''ll be feeling a little nervous
    at this point. We''ve written quite a bit of code, in a number of aspects, and
    things have ''just worked''. We all know this is rarely the case.


    Aspects are just like any other piece of code, they need to be tested. To mitigate
    risks, and to keep to best practices, we should write automated tests for our
    aspects. There are different types of tests to pursue. For our caching example,
    it would be useful to isolate the caching functionality to make sure it meets
    our requirements; commonly referred to as unit testing. Also, ensuring that the
    right advice is being applied to the right functions is critical to confirming
    that AOP is working and this can be exercised using an integration test.'
  merge: -1
  img_proc: true
