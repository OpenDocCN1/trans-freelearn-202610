  md: "```\n(transfer_amt, source_act))\ncursor.execute(\"\"\"\n    update ACCOUNT\n\
    \    set BALANCE = BALANCE + %s\n    where ACCOUNT_NUM = %s\"\"\",\n    (transfer_amt,\
    \ target_act))\ncursor.close()\nconn.commit()\nexcept:\n    conn.rollback()\n\
    ```\n\nIn our updated example, we now start with conn.commit() in order to start\
    \ a new transaction.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_112_0.png)\n\n\
    > If you use a Python DB API compatible database module, then transactions are\
    \ available when you connect to the database. connection.commit() and connection.rollback()\
    \ finishes an existing transaction and implicitly starts a new one (http://www.pubbs.net/python/200901/18953/).\
    \ This is the reason this block of code starts with a commit statement.\n\nWe\
    \ enter the try/except block and start executing the same business code that we\
    \ wrote earlier. In the end, we execute conn.commit(), to commit our results to\
    \ the database.\n\nIn the event of some system error, the commit would never be\
    \ executed. This means the withdrawal from the SAVINGS account would not be written\
    \ into the database. If this was really a hard system failure, relational databases\
    \ would revert to the state before the transaction started.\n\nFor softer failures\
    \ where some sort of application level exception raised would result in conn.rollback()\
    \ being called, reverting all changes back to when the transaction started.\n\n\
    This solution solves the problem such that our bank doesn't leak money due to\
    \ system faults and errors. But in order to re-use this transactional pattern\
    \ in other parts of our banking application, we must repeat the coding pattern\
    \ over and over, increasing the risk of bugs."
