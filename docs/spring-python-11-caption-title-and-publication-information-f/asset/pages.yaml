  md: "```\n@Object\ndef data_access(self):\n    return MysqlDataAccess()\n\n@Object\n\
    def wiki_service(self):\n    return CachedService(WikiService(self.data_access()))\n\
    ```\n\nOur architecture has changed slightly, with the Wiki view layer calling\
