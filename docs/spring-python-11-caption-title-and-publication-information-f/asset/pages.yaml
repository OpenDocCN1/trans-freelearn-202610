- pgno: 160
  md: "With this setup, our system will first try to use the old authentication provider.\
    \ However, if it fails, Spring Python Security will try the new authentication\
    \ provider.\n\n# Supporting multiple user communities\n\nIt is possible our application\
    \ may have to support multiple users. Imagine we had developed our application\
