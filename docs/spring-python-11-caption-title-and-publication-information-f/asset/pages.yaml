- pgno: 211
  md: "# Issues with customer features\n\nWith this version of the features, we have\
    \ roughed in some useful banking features. However, there are some things that\
    \ still need to be handled.\n\n+   - There is not enough security preventing another\
    \ customer from accessing Alice's accounts and transferring money away.\n+   -\
    \ Withdrawing money from an account has no overdraft protection. This also impacts\
    \ transfers, because they reuse the withdraw function. A simple solution would\
    \ be to fail if the requested amount exceeds the balance.\n+   - Transferring\
    \ money should be transactional to avoid leaking money.\n\n# Securing Alice's\
    \ accounts\n\nIf we log in as Alice, we can view the history of the Checking account.\n\
    \n![](img/bcf886d8b665372ee8afbb620d4273bb_211_0.png)\n\nThat is alright. However,\
    \ if there is another customer, then things are not as secured as you might think.\
    \ Let's adjust the context so that another customer, \"Dave\" exists.\n\n```\n\
    @Object\ndef user_details_service(self):\n    user_details_service = InMemoryUserDetailsService()\n\
    \    user_details_service.user_dict = {\n        \"alice\": (\"alicespassword\"\
    , [\"ROLE_CUSTOMER\"], True),\n        \"bob\": (\"bobspassword\", [\"ROLE_MGR\"\
    ], True),\n        \"carol\": (\"carolspassword\", [\"ROLE_SUPERVISOR\"], True),\n\
    \        \"dave\": (\"davesspassword\", [\"ROLE_CUSTOMER\"], True)\n    }\n  \
    \  return user_details_service\n```"
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Case Study I – Integrating Spring Python with your Web Application


    After looking at Alice''s account history, we can easily copy the URL from the
    browser to clipboard, logout, and then log back in as Dave.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_212_0.png)


    Dave has no accounts yet. However, Dave can paste in the URL and easily view Alice''s
    account history.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_212_1.png)


    This is because both of these users have ROLE_CUSTOMER. This means we need to
    write a customized AccessDecisionVoter that will decide whether or not a certain
    record can be viewed by the current user.'
  merge: -1
  img_proc: true
- pgno: 213
  md: "The security chapter showed us how to code a custom authenticator. In this\
    \ situation, the users are already authenticated. What we need is proper handling\
    \ of authorization. Our problem requires confirming that the currently logged\
    \ in user has permission to look at the current account.\n\n+   1. Let's code\
    \ our own AccessDecisionVoter.\n\n```\nclass OwnerVoter(AccessDecisionVoter):\n\
    \    def __init__(self, controller=None):\n        self.controller = controller\n\
    \ndef supports(self, attr):\n    \"\"\"This voter will support a list.\"\"\"\n\
    \    if isinstance(attr, list) or \\\n        (attr is not None and attr == \"\
    OWNER\"):\n        return True\n    else:\n        return False\n\ndef vote(self,\
    \ authentication, invocation, config):\n    \"\"\"Grant access if any of the granted\n\
    \    authorities matches any of the required roles.\n    \"\"\"\n    results =\
    \ self.ACCESS_ABSTAIN\n    for attribute in config:\n        if self.supports(attribute):\n\
    \            results = self.ACCESS_DENIED\n            id = cgi.parse_qs(\n  \
    \              invocation.environ[\"QUERY_STRING\"])[\"id\"][0]\n            if\
    \ self.controller.get_username(id) == \\\n                authentication.username:\n\
    \                return self.ACCESS_GRANTED\n\n    return results\n```\n\n+  \
    \ - OwnerVoter needs a supports method to determine if it is going to vote. In\
    \ this case, it will if given security configuration in the form of a list, and\
    \ also if one of the list values is OWNER.\n+   - In order to vote, the voter\
    \ is provided with a copy of the user's authentication credentials, and a handle\
    \ on the invocation object which includes all the web request parameters, and\
    \ what the security role configuration is."
  merge: -1
  img_proc: true
- pgno: 214
  md: "The voter initializes its results to ACCESS_ABSTAIN. It iterates over the list\
    \ of roles, and checks if any of them match OWNER. If so, it then changes the\
    \ results to ACCESS_DENIED. Then, it checks if the there are any id parameters,\
    \ and if so, retrieves the value. It requests that the controller lookup the user\
    \ associated with the account id and if it matches the current user's username,\
    \ it updates the results to ACCESS_GRANTED.\n\n2. Add a method to the controller\
    \ to look up the username of an account.\n\n```\ndef get_username(self, id):\n\
    \    return self.dt.query_for_object(\"\"\"\n        SELECT owner\n        FROM\
    \ account\n        WHERE id = ?\n        AND status = 'OPEN'\"\"\", (id,), str)\n\
    ```\n\n3. Now we need to plug the OwnerVoter into the context's AccessDecisionManager\
    \ configuration.\n\n```\n@Object\ndef access_decision_mgr(self):\n    access_decision_mgr\
    \ = AffirmativeBased()\n    access_decision_mgr.allow_if_all_abstain = False\n\
    \    access_decision_mgr.access_decision_voters = [RoleVoter(),\n            OwnerVoter(self.controller())]\n\
    \    return access_decision_mgr\n```\n\nAs you can see, we just added an instance\
    \ of OwnerVoter to the access_decision_voters list. OwnerVoter needs a handle\
    \ on the controller so it can query for the username linked to the account.\n\n\
    4. Update the filter_security_interceptor so that history requests are routed\
    \ through the OwnerVoter.\n\n```\n@Object\ndef filter_security_interceptor(self):\n\
    \    filter = FilterSecurityInterceptor()\n    filter.auth_manager = self.auth_manager()\n\
    \    filter.access_decision_mgr = self.access_decision_mgr()\n    filter.sessionStrategy\
    \ = self.session_strategy()\n    filter.obj_def_source = [\n        (\"/history.*\"\
    , [\"OWNER\"]),\n        (\"/.*\", [\"ROLE_CUSTOMER\", \"ROLE_MGR\", \"ROLE_SUPERVISOR\"\
    ])\n    ]\n    return filter\n```"
  merge: -1
  img_proc: true
- pgno: 215
  md: "Notice how we added a rule for /history.*. Because OWNER doesn't start with\
    \ ROLE_, the RoleVoter will not vote on it. Only the OwnerVoter will examine this\
    \ rule to determine if the current user is authorized to access.\n\nBecause the\
    \ interceptor starts with the first rule and iterates until it finds a match,\
    \ it is important to put specialized rules towards the top, with more general\
    \ ones at the bottom.\n\n+   5. Add an accessDenied page at the view level, so\
    \ that when Dave tries to access the history of Alice's account, he is redirected\
    \ due to lack of ownership.\n\n```\n@cherrypy.expose\ndef accessDenied(self):\n\
    \    return \"\"\"\n    <h2>You are trying to access\n    an un-authorized page.</h2>\n\
    \    \"\"\"\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_215_0.png)\n\nWe\
    \ have now secured pages based on ownership. This way, only the account holder\
    \ can view his or her own history. It is left as an exercise to secure other pages\
    \ that are id-based using the same OwnerVoter.\n\n# Adding overdraft protection\
    \ to withdrawals\n\nOne of the simplest business rules is to not allow people\
    \ to draw more from an account than exists.\n\n+   1. Modify the withdraw operation\
    \ to first retrieve the account's balance and check it against the amount, throwing\
    \ an exception if there are insufficient funds.\n\n```\ndef withdraw(self, id,\
    \ amount):\n    balance = self.dt.query(\"\"\"\n        SELECT balance\n     \
    \   FROM account\n        WHERE id = ?\"\"\", (id,),\n```"
  merge: -1
  img_proc: true
- pgno: 216
  md: "```\nDictionaryRowMapper() [0] [\"balance\"]\nif float(balance) < amount:\n\
    \    raise BankException(\"Insufficient balance in acct %s\" % id)\nself.dt.execute(\"\
    \"\"\n    UPDATE account\n    SET balance = balance - ?\n    WHERE id = ?\"\"\"\
    , (amount, id))\nself.log(\"TX\", id, \"Withdrew %s\" % amount)\n```\n\nAn important\
    \ point here is that there is no redirect operation happening. This method isn't\
    \ aware of the web layer above it. While it would be easy to raise a cherrypy.HTTPRedirect\
    \ message, it is best left to the view layer. This also impacts transfer operations\
    \ by causing an exception to be thrown if there are insufficient funds.\n\n2.\
    \ Define a simple BankException class.\n\n```\nclass BankException(Exception):\n\
    \    pass\n```\n\n3. Modify the beginning of the withdraw web method by adding\
    \ a try-except block that either redirects with a success message or an error\
    \ message.\n\n```\n@cherrypy.expose\ndef withdraw(self, id=\"\", amount=\"\"):\n\
    \    if id != \"\" and amount != \"\":\n        try:\n            self.controller.withdraw(id,\
    \ float(amount))\n            raise cherrypy.HTTPRedirect(\\\n               \
    \ \"/?message=Successfully withdrew %s\" % amount)\n        except BankException,\
    \ e:\n            raise cherrypy.HTTPRedirect(\"/?message=%s\" % e)\n```\n\nThe\
    \ rest of this view-level method is unchanged. This provides a clear behavior\
    \ pattern based on any exception thrown down in the controller's withdraw operation.\n\
    \n4. Modify the beginning of the transfer web method by adding a try-except block\
    \ that either redirects with a success message or an error message.\n\n```\n@cherrypy.expose\n\
    def transfer(self, amount=\"\", source=\"\", target=\"\"):\n    if amount != \"\
    \" and source != \"\" and target != \"\":\n        try:\n            self.controller.transfer(amount,\
    \ source, target)\n            raise cherrypy.HTTPRedirect(\\\n              \
    \  \"/?message=Successful transfer\")\n        except BankException, e:\n    \
    \        raise cherrypy.HTTPRedirect(\"/?message=%s\" % e)\n```"
  merge: -1
  img_proc: true
- pgno: 217
  md: "![](img/bcf886d8b665372ee8afbb620d4273bb_217_0.png)\n\nWithdrawals and transfers\
    \ are now protected from overdrafts.\n\n# Making transfers transactional\n\nThe\
    \ final key thing that needs to be implemented is increasing the integrity of\
    \ transfers. It is vital for any banking operation that they be performed with\
    \ atomic consistency. Otherwise, the bank will leak money.\n\n+   1. Markup the\
    \ controller's transfer operation using the `@transactional` decorator.\n\n```\n\
    @transactional\ndef transfer(self, amount, source, target):\n    self.withdraw(source,\
    \ amount)\n    self.deposit(target, amount)\n```"
  merge: -1
  img_proc: true
- pgno: 218
  md: "2. In order to have the @transactional decorator available, the following import\
    \ statement is required.\n\n```\nfrom springpython.database.transaction import\
    \ *\n```\n\n3. In the application context, define a TransactionManager and an\
    \ AutoTransactionalObject, in order to activate the @transactional decorator.\n\
    \n```\n@Object\ndef tx_mgr(self):\n    return ConnectionFactoryTransactionManager(self.factory())\n\
    ```\n\n```\n@Object\ndef transactionalObject(self):\n    return AutoTransactionalObject(self.tx_mgr())\n\
    ```\n\n4. This change to the application context also requires the same import\
    \ statement shown above.\n\n5. This is all that is needed. The transfer method\
    \ now utilizes transactions to avoid leaking money.\n\n# Remotely accessing logs\n\
    \nThis is a common feature found in online banking, where the user wants to download\
    \ the transaction history. It allows the importing data into another financial\
    \ tool for analysis, auditing, or double bookkeeping.\n\nFor our case study, we\
    \ will export using PyroServiceExporter. However, we only want to expose the logs\
    \ and none of the other functions. You may recall that PyroServiceExporter exposes\
    \ all the methods its target object. In order to do this, we need a separate service\
    \ that can delegate to our controller, and instead expose it.\n\n1. Create a public-facing\
    \ service, which will contain exposes services.\n\n```\nclass SpringBankPublic(object):\n\
    \    def __init__(self, controller):\n        self.controller = controller\n\n\
    \    def history(self, id):\n        return self.controller.history(id)\n```\n\
    \nThis class is pretty simple. The constructor call requires a copy of controller.\
    \ It has only one method, the one intended for public exposure."
  merge: -1
  img_proc: true
- pgno: 219
  md: "2. Export the public-facing service in the application context using Pyro.\n\
    \n```\n@Object\ndef public_service(self):\n    return SpringBankPublic(self.controller())\n\
    \n@Object\ndef spring_bank_exporter(self):\n    exporter = PyroServiceExporter()\n\
    \    exporter.service_name = \"springbank\"\n    exporter.service = self.public_service()\n\
    \    return exporter\n```\n\nIn order to run this code, the following import statement\
    \ must be added:\n\n```\nfrom springpython.remoting.pyro import *\n```\n\n3. Write\
    \ a simple client script that will remotely connect to the public service, and\
    \ retrieve one of the accounts.\n\n```\nfrom springpython.config import *\nfrom\
    \ springpython.remoting.pyro import *\n\nclass RemoteClient(PythonConfig):\n \
    \   def __init__(self):\n        PythonConfig.__init__(self)\n\n    @Object\n\
    \    def client(self):\n        service = PyroProxyFactory()\n        service.service_url\
    \ = \"PYROLOC://localhost:7766/\nspringbank\"\n        return service\n\nif __name__\
    \ == \"__main__\":\n    from springpython.context import ApplicationContext\n\
    \    ctx = ApplicationContext(RemoteClient())\n    service = ctx.get_object(\"\
    client\")\n    for row in service.history(1):\n        print row\n```\n\nThis\
    \ client script connects through Pyro module. It requests the history of Account\
    \ 1, and then prints it out in raw form on the screen.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_219_0.png)"
  merge: -1
  img_proc: true
- pgno: 220
  md: "This easily fetches the raw data we requested. It is a perfect example of how\
    \ to pipe raw data to other machines.\n\n> > This form of raw data access has\
    \ no security restrictions and would be ill advised for exposure to an untrusted\
    \ network. This type of data would also be more secure if Pyro was configured\
    \ with SSL. However, at this point in time, Spring Python does not support configuring\
    \ Pyro with SSL.\n\n4. Let's create a raw version visible through the web layer.\n\
    \n```\n@cherrypy.expose\ndef raw_history(self, id):\n    return str(self.controller.history(id))\n\
    ```\n\nThis basically takes the results of the history call, converts them to\
    \ a string, and returns it for display with no extra HTML formatting.\n\n5. Let's\
    \ secure raw_history with the same protections as history.\n\n```\n@Object\ndef\
    \ filter_security_interceptor(self):\n    filter = FilterSecurityInterceptor()\n\
    \    filter.auth_manager = self.auth_manager()\n    filter.access_decision_mgr\
    \ = self.access_decision_mgr()\n    filter.sessionStrategy = self.session_strategy()\n\
    \    filter.obj_def_source = [\n        (\"/raw_history.*\", [\"OWNER\"]),\n \
    \       (\"/history.*\", [\"OWNER\"]),\n        (\"/.*\", [\"ROLE_CUSTOMER\",\
    \ \"ROLE_MGR\", \"ROLE_SUPERVISOR\"])\n    ]\n    return filter\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_220_0.png)"
  merge: -1
  img_proc: true
- pgno: 221
  md: "Now it's possible to write a web-based script that would get redirected to\
    \ the login page. It must supply login credentials. After that, it can issue the\
    \ URL necessary to retrieve Python's literal array of dictionaries. It could then\
    \ convert it to a Python data structure, and harvest the data.\n\n# Creating audit\
    \ logs\n\nThe logs that our application is currently writing are banking transactions.\
    \ Another level of logging may be needed to analyze operations the controller\
    \ is performing. This can service either performance analysis, post-mortem analysis,\
    \ and for generating audit reports.\n\nTo do this, let's code an aspect that logs\
    \ all of controllers (except for the log operation itself).\n\n+   1. Code a simple\
    \ aspect that logs anything except the log method using a copy of the controller.\n\
    \n```\nclass AuditInterceptor(MethodInterceptor):\n    def __init__(self, controller):\n\
    \        self.controller = controller\n\n    def invoke(self, invocation):\n \
    \       results = invocation.proceed()\n        if invocation.method_name != \"\
    log\":\n            self.controller.log(\"AUDIT\", -1,\n                     \
    \           \"Method: %s Args: %s\" % (\n                                invocation.method_name,\
    \ invocation.args))\n        return results\n```\n\nFor this code to work, add\
    \ the following import statement:\n\n```\nfrom springpython.aop import *\n```\n\
    \nThis interceptor requires a copy of the controller to write its log message.\
    \ All the other logging done earlier in this chapter was of type TX. These log\
    \ entries are of type AUDIT, meaning they won't appear on any user's history or\
    \ through the remote log access. Also, the account number is hard-coded -1 since\
    \ not all operations have an account."
  merge: -1
  img_proc: true
- pgno: 222
  md: "2. Update the definition of the controller in the application context in order\
    \ to embed this interceptor.\n\n```\n@Object\ndef controller(self):\n    target\
    \ = SpringBankController(self.factory())\n    return ProxyFactoryObject(\n   \
    \     target=target,\n        interceptors=AuditInterceptor(target))\n```\n\n\
    This update to the application context smoothly replaces the SpringBankController\
    \ with a ProxyFactoryObject. This proxy points at the real controller object,\
    \ while also plugging in an instance of the AuditInterceptor we just coded.\n\n\
    Also notice that the AuditInterceptor needs a copy of the controller. However,\
    \ using self.controller() like all the other methods would generate a recursive\
    \ stack error.\n\n3. Let's use MySQL's command-line interface to look at the log\
    \ table after several operations.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_222_0.png)\n\
    \nThis provides a nice view of what happened on a transaction level, and also\
    \ on a lower level from an auditing perspective.\n\nIt is left as an exercise\
    \ for the reader to change the advice, so that only when a manager is viewing\
    \ an account history does it write an audit log entry. It is also an exercise\
    \ to build a view for the supervisor to view these audit trails."
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Summary


    With this case study, we have examined the various building blocks of Spring Python
    and utilized them to develop a simple, yet sophisticated banking site. While it
    may not have all the visual appeal, that task can easily be handed over to a web
    interface expert for improvement.


    What is important is that key functional concepts have been implemented such as
    security and integrity. Customer data cannot be seen by other customers. It also
    has some simple banking protocols implemented such as overdraft prevention. Transactions
    are also implemented with little impact to the code.


    The use cases involving managers and supervisors were not implemented with the
    intent that the reader could implement them as exercises.


    With a functional banking application, the door is opened to further enhancements
    and implementation or more use cases needed to meet the customers'' and the bank''s
    needs.


    In this chapter we learned how to:


    +   - Wire together the components of our banking application using dependency
    injection

    +   - Easily setup user authentication

    +   - Restrict what pages a user can visit based on their role and whether or
    not they own the data being viewed

    +   - Export raw data using Pyro to another trusted machine inside the enterprise

    +   - Export raw data for the customer, to be used by some external tool

    +   - Write an aspect that audits the database operations performed by the controller

    +   - Easily mark up atomic transfer operations with the `@transactional` decorator


    In the next chapter, we will take a look at Spring Python''s command-line application,
    coily, which can help us build Spring Python applications quicker. We will also
    see how to write our own plugins to add functionality as we need.'
