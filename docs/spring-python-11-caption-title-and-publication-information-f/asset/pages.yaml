  md: "```\nreturn DefaultLdapAuthoritiesPopulator(\n    context_source=self.context2(),\n\
    \    group_search_base=\"ou=groups\")\n```\n\nWhile it is possible Spring Python\
    \ will eventually support multiple URLs, the ability to combine existing components\
    \ gives you an already working solution right now.\n\n# Coding our own security\
    \ extension\n\nWhile all the features shown in this chapter so far demonstrate\
    \ a powerful security framework, arguably the most important feature is the ability\
    \ to write a custom security extension that plugs into this architecture.\n\n\
    Earlier in the LDAP section, it was mentioned that it is possible to adjust where\
    \ searches are conducted to find groups related to the users. In the SQL section,\
    \ it was shown that custom queries can be injected. Both of these features allow\
    \ flexible adjustments, however, they can only bend so far. If our security system\
    \ is highly specialized, it may be easier to simply code our own extension, and\
    \ plug it in.\n\nThis is also necessary if another security system is not yet\
    \ supported by Spring Python, such as two-factor tokens, OpenID, or X.509 certificates.\
    \ While support for these may appear in the future, our needs may not be able\
    \ to wait.\n\n# Coding a custom authentication provider\n\nFor our example, let's\
    \ write a custom authentication provider that is based on logging in to a database\
    \ instead of doing a password comparison.\n\n> This example matches a real situation\
    \ I had to deal with. I inherited an application that was based on logging the\
    \ user into the database and then looking up roles. This confined passwords to\
    \ whatever the database supported, and in turn not allowing us to have a unified\
    \ policy for acceptable passwords. The first step to migrate that application\
    \ off of this limited solution required a custom authentication provider just\
    \ like this example. It allowed me to utilize this framework, which provided the\
    \ ability to plug in another security provider pointed at our new user security\
    \ data.\n\nIn order to code our custom security provider, we need to write an\
    \ authenticate method with the following signature:\n\n```\ndef authenticate(self,\
    \ authentication)\n```"
