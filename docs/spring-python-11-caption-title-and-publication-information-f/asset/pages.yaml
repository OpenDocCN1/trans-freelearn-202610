- pgno: 163
  md: "Authentication providers are expected to either succeed or fail with the following\
    \ behavior:\n\n+   - If authentication is *successful*, return an authentication\
    \ object. It is recommended to create a new instance of `UsernamePasswordAuthenticationToken`,\
    \ copy in the `username`, `password`, and `granted_auths`, and then return it.\
    \ This is the same class used by all of Spring Python Security's providers. We\
    \ do *not* have to call `setAuthenticated(true)` on the token. `AuthenticationManager`\
    \ handles this for us\n+   - If authentication *fails*, raise a `BadCredentialsException`\n\
    \nFor this provider, we can use `DatabaseTemplate` to do most of our work. To\
    \ do that, we need an injected SQL connection factory. If we set the username\
    \ and password with the values supplied by our user, we can create a `DatabaseTemplate`\
    \ and attempt a query to retrieve the user's roles. Since our instance of `DatabaseTemplate`\
    \ will try to login to the database before doing the query, this should serve\
    \ as our authentication check. If successful, we will receive the granted authorities\
    \ in a result set. If it fails, we will get a SQL exception, which we can catch\
    \ and replace with a `BadCredentialsException`.\n\n```\nfrom springpython.security.providers\
    \ import *\nfrom springpython.database.core import *\n\nclass MySqlLoginAuthenticationProvider(AuthenticationProvider):\n\
    \    def __init__(self, factory=None):\n        self.factory = factory\n\n   \
    \ def authenticate(self, authentication):\n        self.factory.username = authentication.username\n\
    \        self.factory.password = authentication.password\n        dt = DatabaseTemplate(self.factory)\n\
    \n        try:\n            authorities =\n                dt.query(\"select authority\
    \ from user where username = ?\",\n                        (authentication.username,),\n\
    \                        rowhandler=DictionaryRowMapper())\n\n            return\
    \ UsernamePasswordAuthenticationToken(\n                authentication.username,\n\
    \                authentication.getCredentials(),\n                [auth[\"authority\"\
    ] for auth in authorities])\n        except:\n            raise BadCredentialsException(\"\
    Invalid credentials\")\n```"
  merge: -1
  img_proc: true
- pgno: 164
  md: 'Because each connection factory is slightly different, we will assume this
    is a `MySqlConnectionFactory` being passed in. Our new provider is ready for immediate
    use. It''s that easy, meeting our requirement: ''users must be able to quickly
    write custom security extensions to handle legacy security solutions''.


    One way to make this example more sophisticated would be to make it handle the
    current set of connection factories. But for now, it works as a suitable demonstration
    of how easy it is to authenticate against an existing system in a way not currently
    covered by Spring Python Security.


    # Some of the challenges with Spring Python Security


    Spring Python Security — as demonstrated throughout this chapter — is extremely
    flexible, highly extensible, and non-invasive. However, there is a cost. Everything
    must be configured by hand (and also configured correctly).


    This was one of the major criticisms levied against Acegi Security. Since then,
    Acegi Security (now branded as Spring Security) has made several updated releases,
    reducing the amount of manual configuration required. They now provide short-cuts
    to many industry standard security options, while still allowing us to add customization
    options, making it much easier to wire up the security framework for our needs.


    As Spring Python Security develops, it will be making similar changes while also
    increasing the protocols it supports. Until then, it is good practice to use as
    much automated testing as possible to make sure the configuration is performing
    as expected. And for issues and documentation, be sure to make use of:


    +   - Online reference manual (`http://springpython.webfactional.com`)

    +   - Support forum (`http://forum.springsource.org/forumdisplay.php?f=45`)

    +   - Mailing list (`http://lists.springsource.com/archives/springpython-users`)
    to get up-to-date answers'
