- pgno: 23
  md: 'Looking at the last block of code, we can see that we are no longer creating
    the parser or the Pyro proxy. Instead, we are relying on the container to create
    it for us. The Spring Python container decouples the creation of our parser, whether
    its for a local application, or if it uses Pyro to join them remotely. The server
    application doesn''t know that it is being exported as a Pyro service, because
    all that information is stored in the WebServiceContainer. Any changes made to
    the container definition aren''t seen by the server application code.


    The same can be said for the client. By putting creation of the client inside
    the container, we don''t have to know whether we are getting an instance of our
    service or a proxy. This means that additional changes can be made inside the
    definition of the container of Spring Python, without impacting our client and
    server apps. This makes it easy to split the server and client calls into separate
    scripts to be run in separate instances of Python or on separate nodes in our
    enterprise.


    This demonstrates how it is possible to mix in remoting to our existing application.
    By using this pattern of delegating creation of key objects to the container,
    it is easy to start with simple object creation, and then layer on useful services
    such as remoting. Later in this book, we will also see how this makes it easy
    to add other services like transactions and security. Due to Spring Python''s
    open ended design, we can easily create new services and add them on without having
    to alter the original framework.


    # Adding in some useful templates


    In addition to the non-invasive ability to mix in services, Spring Python has
    several utilities that ease the usage of low level APIs through a template pattern.
    The template pattern involves capturing a logical flow of steps. What occurs at
    each step is customizable by the developer, while still maintaining the same overall
    sequence.


    One example where a template would be useful is for writing a SQL query. Coding
    SQL queries by hand using Python''s database API (http://www.python.org/dev/peps/pep-0249)
    is very tedious. We must properly handle errors and harvest the results. The extra
    code involved with connecting things together and handling issues is commonly
    referred to as plumbing code. Let''s look at the following code to see how Python''s
    database API functions.'
  merge: -1
  img_proc: true
- pgno: 24
  md: "The more plumbing code we have to maintain, the higher the cost. Having an\
    \ application with dozens or hundreds of queries can become unwieldy, even cost\
    \ prohibitive to maintain.\n\n+   1. Using Python's database API, we only have\
    \ to write the following code once for setup.\n+   2. Now let's use Python's database\
    \ API to perform a single query.\n\n```\n### One time setup\nimport MySQLdb\n\
    conn = MySQLdb.connection(username=\"me\",\n    password\"secret\",\n    hostname=\"\
    localhost\",\n    db=\"springpython\")\n```\n\n```\n### Repeated for every query\n\
    cursor = conn.cursor()\nresults = []\ntry:\n    cursor.execute(\"\"\"select title,\
    \ air_date, episode_number, writer\n        from tv_shows where name = %s\"\"\"\
    ,\n        (\"Monty Python\",))\n    for row in cursor.fetchall():\n        tvShow\
    \ = TvShow(title=row[0],\n            airDate=row[1],\n            episodeNumber=row[2],\n\
    \            writer=row[3])\n        results.append(tvShow)\nfinally:\n    try:\n\
    \        cursor.close()\n    except Exception:\n        pass\nconn.close()\nreturn\
    \ results\n```\n\nThe specialized code we wrote to look up TV shows is contained\
    \ in the execute statement and also the part that creates an instance of TvShow.\
    \ The rest is just plumbing code needed to handle errors, manage the database\
    \ cursor, and iterate over the results.\n\nThis may not look like much, but have\
    \ you ever developed an application with just one SQL query? We could have dozens\
    \ or even hundreds of queries, and having to repeatedly code these steps can become\
    \ overwhelming. Spring Python's DatabaseTemplate lets us just inject the query\
    \ string and a row mapper to reduce the total amount of code that we need to write."
