- pgno: 158
  md: "+   - All the LDAP components are pointed at one directory server, with the\
    \ format `ldap://<server>:<port>/<baseDN>`\n+   - `BindAuthenticator` is configured\
    \ to search recursively from the `<baseDN>` with the pattern `uid={0},ou=people`,\
    \ where `{0}` is where the supplied username will be substituted. When the dn\
    \ is found, a bind is performed using the supplied password\n+   - `DefaultLdapAuthoritiesPopulator`\
    \ will search one level below baseDN at `ou=groups`, looking for any entries that\
    \ have a `member` attribute pointed at the user's dn. It is possible to override\
    \ `group_search_filter` with something else like `uniqueMember={0}`, if the directory\
    \ schema is different. By default, the name of the group fetched will be the group's\
    \ `cn`. Overriding `group_role_attr` allows picking another attribute. By default,\
    \ the group name will be converted to upper case, and prefixed with `ROLE_`. These\
    \ can be overridden with `role_prefix` and `convert_to_upper`\n+   \n+   To do\
    \ a password check instead, replace `BindAuthenticator` with `PasswordComparisonAuthenticator`\n\
    +   - By default it supports both plain text passwords as well as SHA hashed ones\
    \ that are base64 encoded. This can be overridden by supplying an alternative\
    \ password encoder to `encoder` attribute\n+   - It has the same constructor arguments\
    \ as `BindAuthenticator`, meaning you can specify `user_dn_patterns`\n+   - By\
    \ default, it looks for the password stored in the `userPassword` attribute. You\
    \ can override this by setting the `password_attr_name` attribute\n\nIf you have\
    \ a non-conventional usage of either password authentication, or group management,\
    \ you can plug in your own authenticator or authorities populater. I ran into\
    \ this problem myself when a legacy system stored the roles in a custom attribute\
    \ inside the user's record instead of a separate group.\n\nWith all the options\
    \ to override the defaults, it should be pretty easy to get LDAP security management\
    \ underway.\n\n# Using multiple security providers is easy\n\nSupporting multiple\
    \ security providers is a valuable feature. There are several common use cases\
    \ where this is quite beneficial.\n\n+   - Migrating from an old security solution\
    \ to a new one — This is where started with security provider, but need to migrate\
    \ to another one. For example, we started with user accounts stored in the database,\
    \ but want to move to a two-factor authentication system."
  merge: -1
  img_proc: true
- pgno: 159
  md: "+   - Supporting multiple user communities – This is where two different sites\
    \ running on two different servers are merged to run on a single server. Instead\
    \ of maintaining two different applications, we want to consolidate the data but\
    \ maintain existing roles and accounts.\n+   - Providing redundant security access\
    \ – This is when we need to have multiple security providers to handle failures\
    \ and maintenance windows.\n\nLet's explore these scenarios in more detail.\n\n\
    # Migrating from an old security solution to a new one\n\nOne very handy use case\
    \ is where you want to migrate users from an old login system to a new one. For\
    \ example, your project may have several tools that have all been using their\
    \ own custom database solution. However, you finally want to centralize everyone's\
    \ details in a common LDAP server. With both systems keyed up, as new users are\
    \ issued new credentials, they can log in with no interruption of service. Once\
    \ everyone has been migrated, you can remove the old security provider.\n\nIt\
    \ also makes it easy to have redundant security providers, such as having more\
    \ than one LDAP URL to point at.\n\nEarlier, we saw the configuration for an AuthenticationManager\
    \ that looked like this:\n\n```\n@Object\ndef auth_manager(self):\n    auth_manager\
    \ = AuthenticationManager()\n    auth_manager.auth_providers = [self.auth_provider()]\n\
    \    return auth_manager\n```\n\nAuthenticationManager supports a list of providers.\
    \ It will iterate over each one until a successful match is made. To support the\
    \ migration use case, it can be altered to look like this:\n\n```\n@Object\ndef\
    \ auth_manager(self):\n    auth_manager = AuthenticationManager()\n    auth_manager.auth_providers\
    \ = [\n        self.old_auth_provider(),\n        self.new_auth_provider()]\n\
    \    return auth_manager\n```"
