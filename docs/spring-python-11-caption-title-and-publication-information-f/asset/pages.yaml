  md: "```\nreturn MysqlDataAccess()\n\n@Object\ndef wiki_service(self):\n    return\
    \ WikiServiceWithCaching(self.data_access())\n```\n\nThis idea is pretty simple\
    \ and should lessen the load on our database server. However, by mixing caching\
    \ with wiki services we have violated the Single Responsibility Principle (SRP):\
    \ a class should have one (and only one), reason to change. Changes to one of\
    \ these functions could break the other. It is also harder to isolate these functions\
    \ for testing and, ultimately, makes the code harder to read and understand.\n\
    \n+   4. Let's decouple these two concerns, maintaining the wiki and caching,\
    \ by pulling our caching mechanism into a separate class and then delegating to\
    \ our original WikiService.\n\n```\nclass CachedService(object):\n    def __init__(self,\
    \ delegate):\n        self.cache = {}\n        self.delegate = delegate\n\n  \
    \  def get_article(self, article):\n        if article in self.cache:\n      \
    \      return self.cache[article]\n        else:\n            return self.delegate.get_article(article)\n\
    \n    def store_article(self, article):\n        del self.cache[article]\n   \
    \     self.delegate.store_article(article)\n\n    def html(self, text):\n    \
    \    return self.delegate.html(text)\n\n    def statistics(self, article):\n \
    \       return self.delegate.statistics(article)\n```\n\nNow we need to update\
    \ our IoC configuration.\n\n```\nclass WikiProductionAppConfig(PythonConfig):\n\
    \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
    ```"
