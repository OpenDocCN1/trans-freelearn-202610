- pgno: 113
  md: '# Transactions and their properties


    Transactions carry four distinct properties:


    +   - **Atomicity** – We need to guarantee that all steps complete, or no steps
    complete

    +   - **Consistent** – This is concept of ensuring our data maintains a consistent
    state

    +   - **Isolated** – When we withdraw money from the bank, it would be bad if
    our business partner was withdrawing at the same time, and we ended up with a
    negative balance

    +   - **Durable** – We expect completed transactions to survive hardware failures


    Consistency and durability tend to be related to resources, such as the database
    and the server it runs on, and typically doesn''t affect the way we write code.
    Atomicity and Isolation however are commonly handled by developer code.


    To guarantee atomicity, we must start a transaction, and then commit or rollback.
    Throughout this chapter we will explore how Spring Python makes it easy to define
    atomic transactions.


    Python''s DB API specification (http://www.python.org/dev/peps/pep-0249/) doesn''t
    define Isolation levels. Instead, each vendor implements this differently. To
    alter Isolation levels, we must investigate the database engine we are using,
    and then access either the connection or the cursor provided with our factory
    in order to alter this setting from vendor defaults.


    Transactions can either be supported locally or be distributed across multiple
    databases. Local transactions typically involved a single database schema. In
    order to extend to other systems, the Python specification utilizes a ''two-phase
    commit'' mechanism.


    > At the time of writing, Spring Python only supports local transactions, but
    is open to the possibility of expanding its capabilities in the future.


    Another factor in transaction definition is **propagation**. When we have multiple
    operations that are defining a transaction, it is important to combine them together
    in the right fashion. This involves dealing with circumstances where a new transaction
    is encountered while one is already in progress. We will look at this in more
    detail later in this chapter.'
