  md: "# Installing from source\n\nSpring Python can be installed from source code\
    \ like many other open source projects. The code is hosted on a subversion repository.\
    \ The following steps will help you download the code and install it on your machine:\n\
    \n+   1. Type the following command to checkout the latest trunk repository:\n\
    +   ```bash\n+   $ svn checkout https://src.springframework.org/svn/se-springpython-py/trunk/springpython\
    \ springpython\n+   ```\n+   This will create a local directory `springpython`\
    \ containing the latest changes.\n+   \n+   2. Move in to the directory where\
    \ `build.py` is located. This script serves as the key tool to build, package,\
    \ and test Spring Python. Type the following command to generate an installable\
    \ Spring Python package:\n+   ```bash\n+   $ ./build.py -package\n+   ```\n+ \
    \  \n+   3. Move to `target/artifacts`, the directory containing the newly generated\
    \ tar balls.\n+   \n+   4. Unpack the tar ball `springpython-<release>.tar.gz`,\
    \ and go to the directory containing `setup.py` and type the following command\
    \ to install Spring Python:\n+   ```bash\n+   $ python setup.py install\n+   ```\n\
    +   \n+   5. You should now be able to test the installation.\n+   ```bash\n+\
    \   $ python\n+   >>> import springpython\n+   >>> dir()\n+   ['__builtins__',\
    \ '__doc__', '__name__', 'springpython']\n+   ```\n+   \n+   6. Using the subversion\
    \ repository to fetch source code sets you up to easily install new updates.\n\
    +   \n+   7. Type the following command to update your checkout.\n+   ```bash\n\
    +   $ svn update /path/for/springpython\n+   ```\n+   \n+   8. Repeat the steps\
    \ with `build.py`, `target/artifacts`, and `setup.py`.\n\n> Note: This step may\
    \ require admin privileges.\n> $ python setup.py install\n\n> Official releases\
    \ are found in the tags section of the subversion repository, adjacent to the\
    \ trunk."
