- pgno: 77
  md: "# Applying many advisors to a service\n\nTowards the end of coding our caching\
    \ solution, we used RegexpMethodPointcutAdvisor to conditionally apply a list\
    \ of advisors based on regular expression patterns. Spring Python's AOP solution\
    \ supports applying more than one advisor to an object. This makes it easy to\
    \ mix multiple services together for different objects, such as caching, transactions,\
    \ security, and logging.\n\nSpring Python makes it easy to add a service on top\
    \ of an API. There is no limit on how many places a piece of advice can be reapplied.\
    \ An example of a more complex and realistic configuration is shown below:\n\n\
    ```\nclass WikiProductionAppConfig(PythonConfig):\n    def __init__(self):\n \
    \       super(WikiProductionAppConfig, self).__init__()\n\n    @Object\n    def\
    \ data_access(self):\n        return MysqlDataAccess()\n\n    @Object\n    def\
    \ security_advisor(self):\n        return RegexpMethodPointcutAdvisor(\n     \
    \       advice=[SecurityInterceptor()],\n            patterns=[\".*store.*\"])\n\
    \n    @Object\n    def perf_advisor(self):\n        return RegexpMethodPointcutAdvisor(\n\
    \            advice=[PerformanceInterceptor()],\n            patterns=[\".*get.*\"\
    ])\n\n    @Object\n    def caching_advisor(self):\n        return RegexpMethodPointcutAdvisor(\n\
    \            advice=[CachingInterceptor()],\n            patterns=[\".*get.*\"\
    , \".*store.*\"])\n\n    @Object\n    def wiki_service(self):\n        return\
    \ ProxyFactoryObject(\n            target=WikiService(self.data_access()),\n \
    \           interceptors=[self.security_advisor(),\n                         \
    \ self.perf_advisor(),\n                          self.caching_advisor(),\n  \
    \                        self.perf_advisor()])\n```"
  merge: -1
  img_proc: true
