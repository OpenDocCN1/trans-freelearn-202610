    \    self.dt.execute(\"\"\"\n        INSERT INTO account\n        (description,\
    \ balance, owner, status)\n        VALUES\n        (?, 0.0, ?, 'OPEN')\"\"\",\
    \ (description,\\\n            SCH.getContext().authentication.username))\n\n\
    \    self.log(\"TX\", self.get_latest_account(), \"Opened account %s\"\n% description)\n\
    ```\n\nWe also added the extra step of writing a transaction log entry. To support\
    \ writing the log entry, the controller must retrieve the latest account created\
    \ for this customer.\n\n```\ndef get_latest_account(self):\n    return self.dt.query_for_long(\"\
    \"\"\n        SELECT max(id)\n        FROM account\n        WHERE owner = ?\n\
    \        AND status = 'OPEN'\"\"\", \\\n        (SCH.getContext().authentication.username,))\n\
    ```\n\nopen_account, along with several of the other controller operations uses\
    \ the following code to write log entries.\n\n```\ndef log(self, type, account,\
    \ message):\n    self.dt.execute(\"\"\"\n        INSERT INTO log\n        (type,\
    \ account, message)\n        values\n        (?, ?, ?)\"\"\", \\\n        (type,\
    \ account, message))\n```"
