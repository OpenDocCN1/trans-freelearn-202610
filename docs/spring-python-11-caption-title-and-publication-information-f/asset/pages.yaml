- pgno: 64
  md: '# AOP from 10,000 feet


    Throughout this chapter, we will explore examples of AOP and how to use them.
    To do that, it''s important that we learn some basic definitions.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_64_0.png)


    > Crosscutting problems impact more than one hierarchy of classes. AOP efficiently
    solves these problems.


    Commonly cited examples of crosscutting problems include security, transactions,
    tracing, auditing, and logging. What do you think makes these concerns crosscutting?


    # Crosscutting versus hierarchical


    A common cycle of work often starts with a single issue. How would you solve a
    single, concrete, well defined issue? By coding a single, concrete solution! We
    usually don''t think of reuse at this time. We are more likely to think of reuse
    when we need to solve a newer problem using an already-written block of code.


    When we are solving another problem and trying to reuse a block of code, we start
    to see how we can make adjustments and abstractions. We don''t just abstract things
    to reduce duplication of code. We are also adjusting our definition of the business
    solution with a more refined, higher level concept. As new requirements come in,
    our business solution hierarchy evolves.


    As we continue solving business issues, it is not unusual to run into infrastructure
    issues. For example, the need to wrap operations with transactions may arise even
    though the customer may not have asked for it.


    Infrastructure issues can easily crosscut hierarchies of classes. SQL transactions
    are the perfect example. Manually coding the transactional pattern in every method
    that needs it would lead to a lot of code duplication. And then what do we do
    when the transactional requirements change? Rewrite all impacted methods? Unforeseen
    changes in requirements could easily accrue a of work as we maintain the code.
    And to top it off, what are the odds that we will code the transaction pattern
    correctly in every method?


    AOP provides another means to address this issue without using copy-and-paste
    tactics. We will explore this is in more detail throughout this chapter.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "# Crosscutting elements\n\nThe following terms describe the crosscutting elements\
    \ that make up aspect oriented programming:\n\n|  |  |\n|---|---|\n| Join point\
    \ | A Join point is an identifiable point in the execution of a program. This\
    \ is the place where crosscutting actions are woven in. |\n| Pointcut | A Pointcut\
    \ is a program construct that selects join points and collects context at that\
    \ point. |\n| Advice | Advice is code that is to be executed at a join point that\
    \ has been selected by a pointcut. |\n| Aspect | An Aspect is to AOP what a class\
    \ is to OOP. It is the central programming construct where a set of pointcuts\
    \ and advice are defined. |\n| Advisor/\ninterceptor | An Advisor or interceptor\
    \ is Spring Python's mechanism for implementing an aspect. |\n\nWith these terms\
    \ defined, we will dig in through the rest of this chapter to explore crosscutting\
    \ problems and their solutions.\n\n# Weaving crosscutting behavior\n\nAs stated\
    \ earlier, aspects contain pointcuts and their associated advice. Applying aspects\
    \ to our code is known as weaving.\n\nDifferent systems provide various ways to\
    \ weave. AspectJ is a Java-based AOP solution that has both static and dynamic\
    \ weaving.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_65_0.png)\n\n> AspectJ\
    \ is the trail blazer of AOP and targets the Java platform. Spring Python doesn't\
    \ necessarily integrate with AspectJ, nor attempt to mimic everything AspectJ\
    \ does. Instead, Spring Python looks at AspectJ as a mature example of implementing\
    \ AOP.\n> \n> For more information about AspectJ, you could read *AspectJ in Action*\
    \ by *Ramnivas Laddad*. While that book focuses on AspectJ and Java, it also has\
    \ much more detail about the concepts of AOP.\n\nStatic weaving is applied at\
    \ same time that code compilation occurs. Dynamic weaving is applied to already\
    \ compiled code."
  merge: -1
  img_proc: true
- pgno: 66
  md: "Spring Python provides **dynamic weaving** through the use of **proxies**.\
    \ Proxies are configured using the IoC container. Calls that are normally targeted\
    \ at the object are instead routed through the proxy. The proxy evaluates possible\
    \ pointcuts and applies `Advice`. This is also known as **intercepting.**\n\n\
    # Adding caching to Spring Python objects\n\nIn this example, we will enhance\
    \ the wiki engine that we have been developing by writing a service that retrieves\
    \ wiki text from the database and converts it to HTML. Then, to limit the load\
    \ on our infrastructure, we will add caching support.\n\n+   1. First, we need\
    \ to code our service. The service will call a data access component to retrieve\
    \ the wiki text stored in our database. Then we will convert it to HTML and hand\
    \ it back to the caller.\n\n```\n```python\nclass WikiService(object):\n    def\
    \ __init__(self, data_access):\n        self.data_access = data_access\n\n   \
    \ def get_article(self, article):\n        return self.data_access.retrieve_wiki_text(article)\n\
    \n    def store_article(self, article):\n        self.data_access.store_wiki_text(article)\n\
    \n    def html(self, text):\n        pass # return wiki text converted to HTML\n\
    \n    def statistics(self, article):\n        hits = self.data_access.hits(article)\n\
    \        return (hits, hits /\n            len(self.data_access.edits(article)))\n\
    ```\n```\n\nHere we have a `WikiService` similar to the one we used in our IoC\
    \ example. In addition to having a `statistics` method, this version is able to\
    \ retrieve wiki text from the database and format it into HTML. It can also store\
    \ edited wiki articles in the database. In this example we aren't particularly\
    \ concerned with the code that transforms wiki text to HTML and so we've omitted\
    \ it."
