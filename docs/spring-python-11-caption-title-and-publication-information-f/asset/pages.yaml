    \     results += \"\"\"\n                <input type=\"radio\" name=\"%s\" value=\"\
    %s\">%s - %s</\ninput><br/>\n            \"\"\" % (param, account[\"id\"], account[\"\
    id\"], account[\"description\"])\n            results += \"</td></tr>\"\n\n  \
    \      results += \"\"\"\n            <tr><td colspan=\"2\"><input type=\"submit\"\
    /></td></tr>\n        </form>\n        \"\"\"\n\n    return results\n```\n\nWhen\
    \ the user clicks submit, transfer is delegated to the controller.\n\n```\ndef\
    \ transfer(self, amount, source, target):\n    self.withdraw(source, amount)\n\
    \    self.deposit(target, amount)\n```\n\ntransfer conveniently re-uses withdraw\
    \ and deposit."
