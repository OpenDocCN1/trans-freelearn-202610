- pgno: 116
  md: "2. Now let's wrap our transfer method with transaction protection by using\
    \ Spring Python's @transactional decorator.\n\n```\n```python\nfrom springpython.database.core\
    \ import *\nfrom springpython.database.factory import *\nfrom springpython.database.transaction\
    \ import *\n\nclass Bank(object):\n    def __init__(self, connectionFactory):\n\
    \        self.factory = connectionFactory\n        self.dt = DatabaseTemplate(self.factory)\n\
    \n    @transactional\n    def transfer(self, transfer_amt, source_act, target_act):\n\
    \        self.dt.execute(\"\"\"\n            update ACCOUNT\n            set BALANCE\
    \ = BALANCE - %s\n            where ACCOUNT_NUM = %s\"\"\",\n            (transfer_amt,\
    \ source_act))\n        self.dt.execute(\"\"\"\n            update ACCOUNT\n \
    \           set BALANCE = BALANCE + %s\n            where ACCOUNT_NUM = %s\"\"\
    \",\n            (transfer_amt, target_act))\n```\n```\n\n@transactional is a\
    \ decorator that uses a hidden instance of TransactionTemplate to execute our\
    \ transfer function inside a very robust version of the transaction pattern. Our\
    \ interactions are better shown in the following diagram.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_116_0.png)"
