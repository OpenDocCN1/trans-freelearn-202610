  md: "2. Let's put our WikiService in a Spring Python IoC container, so that it can\
    \ be used as part of our wiki application.\n\n```\nfrom springpython.config import\
    \ PythonConfig\nfrom springpython.config import Object\n\nclass WikiProductionAppConfig(PythonConfig):\n\
    \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
    \n    @Object\n    def data_access(self):\n        return MysqlDataAccess()\n\n\
    \    @Object\n    def wiki_service(self):\n        return WikiService(self.data_access())\n\
    ```\n\nThis should look familiar. It is the same IoC container definition we used\
