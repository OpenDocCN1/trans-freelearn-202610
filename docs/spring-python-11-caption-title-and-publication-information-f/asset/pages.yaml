  md: 'The final sequence shows what happens if we invoke a method that doesn''t match
    our caching pattern.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_76_0.png)


    In this situation, we again exercise the pattern match. But because it doesn''t
