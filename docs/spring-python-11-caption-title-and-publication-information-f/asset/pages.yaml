- pgno: 197
  md: "When the page is submitted, the information gets fed to the controller. There\
    \ is one big problem with this piece of code: there is no controller! If you click\
    \ the button, it will generate an error, indicating we need to fill in the supporting\
    \ functionality.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_197_0.png)\n\n2.\
    \ Now let's create a controller that will process requests such as opening new\
    \ bank accounts.\n\n```\nclass SpringBankController(object):\n    def __init__(self,\
    \ factory):\n        self.factory = factory\n        self.dt = DatabaseTemplate(self.factory)\n\
    \n    def open_account(self, account, desc):\n        self.dt.execute(\"\"\"\n\
    \            INSERT INTO account\n            (account, description, balance)\n\
    \            VALUES\n            (?, ?, 0.0)\"\"\", (account, desc))\n```\n\n\
    This controller has one business function: open_account. It utilizes a DatabaseTemplate\
    \ to manage this. As you can see, we have coded it to initialize new accounts\
    \ with a balance of $0.00. It is also designed to depend on dependency injection\
    \ to supply it the necessary connection factory."
  merge: -1
  img_proc: true
- pgno: 198
  md: "3. Let's wire up the controller from our IoC configuration by injecting it\
    \ with a connection factory.\n\n```\n@Object\ndef controller(self):\n    return\
    \ SpringBankController(self.factory())\n```\n\n```\n@Object\ndef view(self):\n\
    \    view = SpringBankView()\n    view.auth_provider = self.auth_provider()\n\
    \    view.filter = self.auth_processing_filter()\n    view.http_context_filter\
    \ = self.httpSessionContextIntegrationFilter()\n    view.controller = self.controller()\n\
    \    return view\n```\n\n```\n@Object\ndef factory(self):\n    factory = MySQLConnectionFactory()\n\
    \    factory.username = \"springbank\"\n    factory.password = \"springbank\"\n\
    \    factory.hostname = \"localhost\"\n    factory.db = \"springbank\"\n    return\
    \ factory\n```\n\nHere we have the new controller object as well as the factory\
    \ object, which allows our controller to access the database. We have slightly\
    \ revised the view object so that it gets injected with a copy of the controller.\n\
    \n4. Adjust SpringBankView so that a controller can be injected.\n\n```\nclass\
    \ SpringBankView(object):\n    def __init__(self):\n        self.filter = None\n\
    \        self.auth_provider = None\n        self.http_context_filter = None\n\
    \        self.controller = None\n```\n\nNow our SpringBankView has a handle on\
    \ the controller, arming it to make database calls as needed. However, one piece\
    \ is missing. We need to set up a database."
