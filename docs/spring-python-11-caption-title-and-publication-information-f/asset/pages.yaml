  md: "8. Having migrated this much, we decide to start coding some tests. We want\
    \ to use the style shown at the beginning of this chapter where we swap out MySqlDataAccess\
    \ with StubDataAccess using an alternative configuration. To avoid changing production.xml,\
    \ we create an alternate configuration file test.xml.\n\n```\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<objects xmlns=\"http://www.springframework.org/springpython/\n\
    schema/objects\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n\
    \    xsi:schemaLocation=\"http://www.springframework.org/\nspringpython/schema/objects\n\
    \        http://springpython.webfactional.com/schema/\ncontext/spring-python-context-1.0.xsd\"\
    >\n\n    <object id=\"data_access\" class=\"Py.StubDataAccess\"/>\n</objects>\n\
    ```\n```\n\n9. Now let's code a test case using these two files for a specialized\
    \ container. To do that, we give ApplicationContext with a list of configurations.\n\
    \n```\n```python\nimport unittest\nfrom springpython.context import ApplicationContext\n\
    from springpython.config import XMLConfig\n\nclass WikiServiceTestCase(unittest.TestCase):\n\
    \    def testHittingWikiService(self):\n        ctx = ApplicationContext([XMLConfig(\"\
    production.xml\"),\n                                XMLConfig(\"test.xml\")])\n\
    \        service = ctx.get_object(\"wiki_service\")\n        results = service.statistics(\"\
    stub page\")\n        self.assertEquals(10.0, results[0])\n        self.assertEquals(2.0,\
    \ results[1])\n```\n```\n\nThe order of filenames is important. First, a list\
    \ of definitions is read from production.xml. Next, more definitions are read\
    \ from test.xml. Any new definitions with the same name as previous ones will\
    \ overwrite the previous definitions. In our case, we overwrite data_access with\
    \ a reference to our stub object."
