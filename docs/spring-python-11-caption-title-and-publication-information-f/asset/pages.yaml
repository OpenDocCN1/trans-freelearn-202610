- pgno: 41
  md: 'If we build a huge test suite involving hundreds of test methods, all using
    this pattern of instantiating `WikiService` and then overriding `data_access`
    with a test double, we have set ourselves up with a big risk. For example, `WikiService`
    or `StubDataAccess` could have some new initializing arguments added. If we later
    need to change something about this pattern of creating our testable `WikiService`,
    we may have to update every test method! We would need to make every change right.
    This is where Spring Python''s Inversion of Control can help.


    # More about Inversion of Control


    Before diving into our solution, let''s look a little deeper into the meaning
    of Inversion of Control.


    Inversion of Control is a paradigm where we alter the way we create objects. In
    simple object creation scenarios, if we have modules X and Y, and X needs an instance
    of Y, we would let X directly create it. This introduces a direct dependency between
    X and Y, as shown in the following diagram.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_41_0.png)


    It''s dependent because any changes to Y may impact X and incur required updates.
    This dependency isn''t just between X and Y. X is now dependent on Y and all of
    Y''s *dependencies* (as shown below). Any updates to Y or any of its dependencies
    run the risk of impacting X.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_41_1.png)'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'With Inversion of Control, we break this potential risk of impacts from Y and
    its dependencies to X by delegating creation of instances of Y to a separate container,
    as shown below.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_42_0.png)


    This shifts the dependency between X and Y over to the container, reducing the
    coupling.


    > It''s important to note that the dependency hasn''t been entirely eliminated.
    Because X is still given an instance of Y, there is still some dependency on its
    API, but the fact that Y and none of its dependencies have to be imported into
    X makes X a smaller, more manageable block of code.


    We saw in our wiki engine code how `WikiService` was dependent on `MySqlDataAccess`.
    `MySqlDataAccess` is dependent on `MySQLdb`, a python library for communicating
    with MySQL. Using the container and coding against a well defined interface opens
    up the opportunity to change what version of data access is being injected into
    `WikiService`.


    As we continue our example in the next section, we''ll see how IoC can help us
    make management of test code easier, reducing long term maintenance costs.


    # Adding Inversion of Control to our application


    We already took the first step in reducing maintenance costs by eliminating our
    dependency on MySQL by using a test stub. However the mechanism we used incurred
    a great risk due to violation of the DRY (Don''t Repeat Yourself) principle.'
  merge: -1
  img_proc: true
- pgno: 43
  md: "For our current problem, we want Spring Python to manage the creation of `WikiService`\
    \ in a way that allows us to make changes in one place, so we don't have to edit\
    \ every test method. To do this, we will define an IoC container and let it handle\
    \ creating the objects for us. The following code shows a simple container definition.\n\
    \n+   1. First of all, let's create an IoC container using Spring Python and have\
    \ it create our instance of `WikiService`.\n\n```\nfrom springpython.config import\
    \ PythonConfig\nfrom springpython.config import Object\n\nclass WikiProductionAppConfig(PythonConfig):\n\
    \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
    \n    @Object\n    def wiki_service(self):\n        return WikiService()\n```\n\
    \nYou can spot the objects defined in the container by noting Spring Python's\
    \ `@Object` decorator.\n\n+   2. Now we want to change our startup code so that\
    \ it uses the container instead of creating `WikiService` object directly.\n\n\
    ```\nif __name__ == \"__main__\":\n    from springpython.context import ApplicationContext\n\
    \    container = ApplicationContext(WikiProductionAppConfig())\n    service =\
    \ container.get_object(\"wiki_service\")\n    WikiWebApp(service).run()\n```\n\
    \nIn this version of our wiki web application, the service object was obtained\
    \ by asking the container for `wiki_service`. Spring Python dispatches this request\
    \ to `WikiProductionAppConfig` where it invokes the `wiki_service()` method. It\
    \ is now up to the container to create an instance of `WikiService` and return\
    \ it back to us."
  merge: -1
  img_proc: true
- pgno: 44
  md: "The dependencies are shown in the following diagram:\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_44_0.png)\n\
    \nAt this intermediate stage, please note that WikiService is still dependent\
    \ on MySqlDataAccess. We have only modified how our application gets a copy of\
    \ WikiService. In later steps, we will completely remove this dependency to MySqlDataAccess.\n\
    \n+   3. Let's see what our test case looks like when we use the IoC container\
    \ to retrieve WikiService.\n\n```\nfrom springpython.context import ApplicationContext\n\
    \nclass WikiServiceTestCase(unittest.TestCase):\n    def testHittingWikiService(self):\n\
    \        container = ApplicationContext(WikiProductionAppConfig())\n        service\
    \ = container.get_object(\"wiki_service\")\n        service.data_access = StubDataAccess()\n\
    \n        results = service.statistics(\"stub page\")\n        self.assertEquals(10.0,\
    \ results[0])\n        self.assertEquals(5.0, results[1])\n```\n\nWith this change,\
    \ we are now getting WikiService from the container, and then overriding it with\
    \ the StubDataAccess. You may wonder \"what was the point of that?\" The key point\
    \ is that we shifted creation of our testable wiki_service object to the container.\
    \ To complete the transition, we need to remove all dependency of MySqlDataAccess\
    \ from WikiService. Before we do that, let's discuss Dependency Injection."
  merge: -1
  img_proc: true
- pgno: 45
  md: "# Dependency Injection a.k.a. the Hollywood principle\n\nSo far, we have managed\
    \ to delegate creation of our WikiService object to Spring Python's Inversion\
    \ of Control container. However, WikiService still has a hard-coded dependency\
    \ to MySqlDataAccess.\n\nThe nature of IoC is to push object creation into a 3rd\
    \ party location. Up to this point, we have been using the term Inversion of Control.\
    \ The way that Spring Python implements IoC, is through the mechanism of Dependency\
    \ Injection. Dependency Injection, or DI, is where dependencies are pushed into\
    \ objects through either initialization code or by letting the container directly\
    \ assign attributes. This is sometimes described by the Hollywood cliché of Don't\
    \ call us, we'll call you. It means that the object which needs a certain dependency\
    \ shouldn't make it directly, but instead wait on the external container to provide\
    \ it when needed.\n\n> Because Spring Python only using Dependency Injection,\
    \ the terms, Inversion of Control, IoC, Dependency Injection, and DI may be used\
    \ interchangeably throughout this book to communicate the same idea.\n\nThe following\
    \ version of WikiService shows a complete removal of dependence on MySqlDataAccess.\n\
    \n```\nclass WikiService(object):\n    def __init__(self, data_access):\n    \
    \    self.data_access = data_access\n\n    def statistics(self, page_name):\n\
    \        \"\"\"Return tuple containing (num hits, hits per edit)\"\"\"\n     \
    \   hits = self.data_access.hits(page_name)\n        return (hits, hits / len(self.data_access.edits(page_name)))\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 46
  md: "With this altered version of WikiService, it is now up to WikiService's creator\
    \ to provide the concrete instance of data_access. The corresponding change to\
    \ make to our IoC container looks like this.\n\n```\nfrom springpython.config\
    \ import PythonConfig\nfrom springpython.config import Object\n\nclass WikiProductionAppConfig(PythonConfig):\n\
    \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
    \n    @Object\n    def data_access(self):\n        return MySqlDataAccess()\n\n\
    \    @Object\n    def wiki_service(self):\n        return WikiService(self.data_access())\n\
    ```\n\nWe have added a definition for MySqlDataAccess so that we can inject this\
    \ into the instance of WikiService when it's created. Our dependency diagram now\
    \ shows a complete break of dependency between WikiService and MySqlDataAccess.\n\
    \n![](img/bcf886d8b665372ee8afbb620d4273bb_46_0.png)\n\nAs described earlier,\
    \ this is akin to the Hollywood mantra Don't call us, we'll call you. It opens\
    \ up our code to the possibility of having any variation injected, giving us greater\
    \ flexibility, without having to rewrite other parts of the system."
  merge: -1
  img_proc: true
- pgno: 47
  md: "# Adding Inversion of Control to our test\n\nWith this adjustment to WikiService\
    \ and WikiProductionAppConfig, we can now code an alternative way of setting up\
    \ our test case.\n\n+   1. First, we subclass the production container configuration\
    \ to create a test version. Then we override the data_access object so that it\
    \ returns our stub alternative.\n+   \n+   2. Now, we can alter our test suite\
    \ to fetch WikiService just like the production main code, except using our alternative\
    \ container.\n\n```\nclass WikiTestAppConfig(WikiProductionAppConfig):\n    def\
    \ __init__(self):\n        super(WikiTestAppConfig, self).__init__()\n\n    @Object\n\
    \    def data_access(self):\n        return StubDataAccess()\n```\n\nUsing this\
    \ technique, we inherit all the production definitions. Then we simply override\
    \ the parts needed for our test situation. In this case, we return a slightly\
    \ modified version of WikiService that is suitable for our testing needs.\n\n\
    ```\nfrom springpython.context import ApplicationContext\n\nclass WikiServiceTestCase(unittest.TestCase):\n\
    \    def testHittingWikiService(self):\n        container = ApplicationContext(WikiTestAppConfig())\n\
    \        service = container.get_object(\"wiki_service\")\n\n        results =\
    \ service.statistics(\"stub page\")\n        self.assertEquals(10.0, results[0])\n\
    \        self.assertEquals(5.0, results[1])\n```\n\nThe dependencies (or lack\
    \ of!) between WikiService and StubDataAccess are shown in following diagram:\n\
    \n![](img/bcf886d8b665372ee8afbb620d4273bb_47_0.png)"
  merge: -1
  img_proc: true
- pgno: 48
  md: 'This makes it easy to plug in our alternative `StubDataAccess`. An important
    thing to note is how our test code is no longer overriding the `data_access` attribute,
    or doing any other special steps when creating `WikiService`. Instead, this creation
    logic has been totally turned over to the IoC container. We can now easily write
    as many tests as we want with no risk of changes to `WikiService` or `data_access`,
    provided we continue to rely on the IoC container to handle object creation. We
    just visit the blueprints of `WikiTestAppConfig` to make any future alterations.


    In conclusion of this example, the following diagram shows our current objects
    as well as potential enhancement to our system. In this possible situation, we
    have defined multiple data access components. To find out which one is being injected
    into `WikiService`, we simply look at the relevant container''s definition, whether
    its production or a particular test scenario. Our current system may use **MySQL**,
    but if a new customer wanted to use **PostGreSQL**, we simply create another variation
    of our container, and inject the alternate data access object. The same can be
    said for **Sqlite**. And all of this can be done with no impact to `WikiService`.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_48_0.png)


    # Container versus Context


    You may have noticed in this chapter''s example how we keep referring to the code
    that contains our object definitions as a container, and yet, the class used to
    create it is called `ApplicationContext`. This chapter will clarify the differences
    between a **context** and a **container**.'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'Spring Python has a base class called `ObjectContainer`, which is responsible
    for managing the object definitions, creating instances of objects based on these
    definitions, and is largely responsible for the functionality that we have looked
    at so far. Any instance of this class would be a container in object oriented
    terms. In fact, we could substitute that class in our previous example everywhere
    we see `ApplicationContext`, and it would act mostly the same.


    `ObjectContainer` has a subclass called `ApplicationContext`. An instance of `ApplicationContext`
    is a context. However, from an OOP perspective, a context is a container. So generally
    referring to instances of either one as an IoC container is common practice.


    An `ApplicationContext` has some differences in behavior from an `ObjectContainer`
    as well as extra features involving life cycle management and object management.
    These differences will first be shown in the following table of features and will
    be covered in more detail later.


    | Class | Features |

    |---|---|

    | `ObjectContainer` | - Lazily instantiates objects on startup with option to
    override

    - Objects are scoped singleton by default |

    | `ApplicationContext` | - Eagerly instantiates objects on startup with option
    to override

    - Objects are scoped singleton by default

    - Supports property driven objects

    - Supports post processors

    - Supports context-aware objects |


    # Lazy objects


    Earlier I said that most of the behavior in this chapter''s example would be the
    same if we had replaced `ApplicationContext` with `ObjectContainer`. One difference
    is that `ObjectContainer` doesn''t instantiate any objects when the container
    is first created. Instead, it waits until the object is requested to actually
    create it. `ApplicationContext` automatically instantiates all objects immediately
    when the container is started.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_49_0.png)


    > In the examples so far, this difference would have little effect, because right
    after creating a container, we request the principle object. This won''t be the
    case with some of the examples later in this book.'
  merge: -1
  img_proc: true
- pgno: 50
  md: "It is possible to override this by setting lazy_init to True in the object's\
    \ definition. This will delay object creation until first request.\n\n```\nclass\
    \ WikiTestAppConfig(WikiProductionAppConfig):\n    def __init__(self):\n     \
    \   super(WikiTestAppConfig, self).__init__()\n\n    @Object(lazy_init=True)\n\
    \    def data_access(self):\n        return StubDataAccess()\n```\n\nOne reason\
    \ for using this is if we had some object that was only needed on certain occasions\
    \ and could incur a lot of overhead when created. Setting lazy_init to True would\
    \ defer its creation, making it behave as an on-demand service.\n\nThis override\
    \ works for both ObjectContainer and ApplicationContext.\n\n# Scoped objects\n\
    \nAnother key duty of the container is to also manage the scope of objects. This\
    \ means at what time that objects are created, where the instances are stored,\
    \ and how long before they are destroyed.\n\nSpring Python currently supports\
    \ two scopes: singleton and prototype. A singleton-scoped object is cached in\
    \ the container until shutdown. A prototype-scoped object is never stored, thus\
    \ requiring the object factory to create a new instance every time the object\
    \ is requested from the container.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_50_0.png)\n\
    \n> When a singleton object includes a prototype object as one of its initializing\
    \ properties, it is important to realize that the prototype isn't recreated every\
    \ time the cached singleton is used.\n\nThe default policy for the container is\
    \ to make everything singleton. The scope for each object can be individually\
    \ overridden as shown below.\n\n```\nclass WikiTestAppConfig(WikiProductionAppConfig):\n\
    \    def __init__(self):\n        super(WikiTestAppConfig, self).__init__()\n\n\
    \    @Object(scope=scope.PROTOTYPE)\n    def data_access(self):\n        return\
    \ StubDataAccess()\n```\n\nEach request for data_access will yield a different\
    \ instance. This happens whether the request is from outside the container, or\
    \ from another container object injecting data_access."
  merge: -1
  img_proc: true
- pgno: 51
  md: "This override works for both `ObjectContainer` and `ApplicationContext`.\n\n\
    # Property driven objects\n\nApplicationContext will invoke `after_properties_set()`\
    \ on any object that has this method, after it has been created and all container-defined\
    \ properties have been set. Here are some examples of how this can be useful:\n\
    \n+   - Including validation logic in class definitions. If some properties are\
    \ optional and others are not (or certain combinations of properties need to be\
    \ set), this is our opportunity to define it, and let the container validate that\
    \ an object was defined correctly.\n+   - Starting up background services. For\
    \ example, `PyroServiceExporter` launches a daemon thread in the background after\
    \ all properties are set.\n\n# Post processor objects\n\nApplicationContext will\
    \ search for **post processors**. These are classes that manipulate other objects\
    \ in the container. They extend Spring Python's `ObjectPostProcessor` class.\n\
    \n```\nclass ObjectPostProcessor(object):\n    def post_process_before_initialization(self,\
    \ obj, obj_name):\n        return obj\n    def post_process_after_initialization(self,\
    \ obj, obj_name):\n        return obj\n```\n\nWhen the context starts up, all\
    \ non-post processors are fed one-at-a-time to each post processor twice: before\
    \ the initialization and after. By default, the object is passed through with\
    \ no change. By coding a custom post processor, we can override either stage,\
    \ and apply any changes we wish. This can include altering the object itself,\
    \ or substituting a different object.\n\n```\nclass RemoteService(ObjectPostProcessor):\n\
    \    def post_process_after_initialization(self, obj, obj_name):\n        if obj_name.endswith(\"\
    Service\"):\n            return PyroServiceExporter(service=obj,\n           \
    \                             service_name=obj_name,\n                       \
    \                 service_port=9000)\n        else:\n            return obj\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 52
  md: 'This post processor looks at an object''s name, and if its name ends with `Service`,
    returns a proxy that exports the object as a Pyro service, using the object''s
    name as part of the URL. Otherwise, it simply returns the object.


    This example shows how we can easily develop a convention-over-configuration client-server
    mechanism, simply by using Spring Python''s IoC container and some custom post
    processors.


    # Context aware objects


    We can define classes that get a copy of the `ApplicationContext` injected into
    the attribute `app_context` by extending `ApplicationContextAware`.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_52_0.png)


    > This is *only* recommended for objects that need to manipulate the context in
    some fashion. It is *not* a good practice to use this hook to simply fetch objects,
    because it ties our code directly to the container.


    Instead, use the principles of Dependency Injection as shown earlier in this chapter.


    # Debate about IoC in dynamic languages


    There is a powerful debate in the technical community about whether or not IoC
    is of any value in dynamic languages such as Python, Ruby, and others. This section
    addresses several of the arguments, and shows how IoC definitely has value in
    any language. If you are already sold on the idea of IoC, you can skip this section
    and learn about more options to configure IoC definitions provided by Spring Python.


    One argument is that IoC was invented as a paradigm to facilitate static languages,
    particularly Java. In the dynamic world, where passing around objects with handles
    is much more fluid, it is understandable that IoC may not solve as many problems
    as it does for static languages such as Java. While it is true that many Java
    developers that engaged in using IoC frameworks saw considerable leverage in productivity,
    it is also credible to not leave dynamic languages out of this.


    The strongest principle that transcends the dynamic/static divide and is handled
    by IoC is **DRY (Don''t Repeat Yourself)**. By defining the creation of an object
    in one place, and being able to use that definition repeatedly is very useful,
    and makes it easy to adjust how the object is created.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'One keen Ruby developer went through several phases of developing a Ruby IoC
    solution. The first round involved static configuration files very similar to
    the XML option. Later on, he realized that coding a Ruby DSL was simpler, easier
    to read, and more of the Ruby way. Finally, he realized that using Ruby directly
    in his code without the framework was actually easier and more salient. In finishing
    his blog article, he alludes to the fact that he uses DI every day. He just doesn''t
    need a framework to do it.


    In response, I am the first person to say that not every object created in a system
    needs to be served up by an IoC container; just the critical ones that would benefit
    from being swapped with test doubles, environmental changes, and wiring up different
    configurations for different customers. For example, coding small scripts and
    simple apps may actually not require any IoC at all. However, as our apps grow,
    the need to manage dependencies and object creation grows, and in those situations,
    Spring Python''s IoC container can meet those needs. IoC also provides easy solutions
    for situations that need remoting, transactions, security, and other.


    Opponents to dynamic IoC solutions have suggested that these solutions are simple
    port jobs and are really more for people not familiar with the dynamic language
    environment. In essence, people that like IoC when coding statically with C# or
    Java, want the same warm comforts in Python. While Spring Python has utilized
    some of the same class names as Spring Java, it is by no means a simple port job.
    Spring Python has ported many of the concepts but not the code. One of the best
    examples of this is Spring Python''s security module. The architecture of Spring
    Security (originally known as Acegi Security) has become a de facto security standard
    in the Java industry. Their architectural concepts involve using a common set
    of interfaces to link into countless security systems such as database, X.509,
    LDAP, CAS, kerberos, OpenID, OpenSSO, and more, without having to get tied down
    to a specific API. Instead, the concepts of authentication and authorization have
    been abstracted to the right level, such that it is easy to add security after
    a system has been developed without major rework. The credit for this strongly
    resides in the power of IoC and its ability to wrap this critical service around
    already written business logic. It would be foolish to pass up this powerful security
    architecture on the basis of simple static versus. dynamic arguments.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'Another argument tends to be based on Spring Java and its historical use of
    XML for configuration files. While XML is commonly used for many Java-based frameworks,
    the Python community tends to avoid XML unless customer requirements dictate otherwise.
    Some developers have criticized Spring Python for being an XML-based container.
    However, this book has already shown pure Python container definitions. Developers
    don''t have to use XML at all to harness the power of Inversion of Control. By
    using Python directly for container definitions, the following powerful options
    are available:


    +   - We can code a switchable context where the container reads the hostname
    and deduces whether it is running in development, test, or production environment

    +   - We can code a clustered context where we vary object configurations based
    on which side of a cluster we are running

    +   - We can write code that reads extra properties from an external source, like
    an Apache web server''s `httpd.conf` file, allowing us to stay nicely integrated

    +   - We can look up object properties in a database


    Frankly, the options are limitless, given the power of Python and the added utilities
    Spring Python provides


    # Migrating a Spring Java application to Python


    In the previous section, I made the point that Spring Python doesn''t require
    us to use XML. However, there is support for XML along with other formats we haven''t
    looked at yet. Other formats are provided to make it easier for Spring Java developers
    to migrate to Python using what they already know.


    Spring Python has two file parsers that read XML files containing object definitions.
    `SpringJavaConfig` reads Spring Java XML configuration files, and `XMLConfig`
    reads a format similar to that, but uniquely defined to offer Python-oriented
    options, such as support for dictionaries, tuples, sets, and frozen sets.


    ![](img/bcf886d8b665372ee8afbb620d4273bb_54_0.png)


    > SpringJavaConfig does not support all the features found in Spring Java''s XML
    specifications, including the specialized namespaces, Spring Expression Language,
    nor properties. At this point in time, it is meant to be convenient tool to demonstrate
    simple integration between Python and Java.'
