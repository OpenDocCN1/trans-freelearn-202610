- pgno: 71
  md: "5. Let's use Spring Python to code an Interceptor that not only separates caching\
    \ from wiki text management, but is also general enough to be reused in other\
    \ places.\n\n```\nfrom springpython.aop import *\n\nclass CachingInterceptor(MethodInterceptor):\n\
    \    def __init__(self):\n        self.cache = {}\n\n    def invoke(self, invocation):\n\
    \        if invocation.method_name.startswith(\"get\"):\n            if invocation.args\
    \ not in self.cache:\n                self.cache[invocation.args] =\n        \
    \            invocation.proceed()\n            return self.cache[invocation.args]\n\
    \n        elif invocation.method_name.startswith(\"store\"):\n            del\
    \ self.cache[invocation.args]\n            invocation.proceed()\n```\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_71_0.png)\n\
    \n> CachingInterceptor defines a Spring Python aspect that has all the caching\
    \ functionality and none of the wiki functionality. It contains both Advice (the\
    \ caching functionality) and a pointcut (only applies to methods starting with\
    \ get).\n\n6. To use CachingInterceptor, we must create a Spring Python AOP proxy\
    \ with an instance of our aspect as well as an instance of WikiService.\n\n```\n\
    class WikiProductionAppConfig(PythonConfig):\n    def __init__(self):\n      \
    \  super(WikiProductionAppConfig, self).__init__()\n\n    @Object\n    def data_access(self):\n\
    \        return MysqlDataAccess()\n\n    @Object\n    def wiki_service(self):\n\
    \        return ProxyFactoryObject(\n            target=WikiService(self.data_access()),\n\
    \            interceptors=CachingInterceptor())\n```"
