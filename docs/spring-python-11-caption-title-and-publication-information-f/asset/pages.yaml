- pgno: 28
  md: "Spring Python is written in pure Python, which makes it easy to use inside\
    \ Jython as well. You may find it easier and more appealing to utilize the pythonic\
    \ APIs of Spring Python rather than the Java idioms of the Spring Framework. The\
    \ choice ultimately is yours, and it's not an either/or decision; you can use\
    \ both libraries in both your Java and Python segments.\n\nThe following diagram\
    \ shows a combination of Python, Jython, and pure Java as a stack.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_28_0.png)\n\
    \nWith Spring Python, it's easy to mix Java and Python together. Let's code a\
    \ simple example, where we write a Jython client that talks to the TV service\
    \ shown in the previous section. By reusing that code, we can easily code a client.\
    \ To really show the power of Python/Jython/Java integration, let's expose our\
    \ Jython client to a pure Java consumer.\n\n+   1. To begin, we need a pure Java\
    \ interface that our Jython code can extend.\n+   2. Next, we write our Jython\
    \ class to extend this interface.\n\n```\nimport org.python.core.PyList;\n\npublic\
    \ interface JavaTvShowService {\n    public PyList getTvShows();\n}\n```\n\n```\n\
    class JythonTvShowService(JavaTvShowService):\n    def __init__(self):\n     \
    \   self.container = ApplicationContext(TvShowContainer())\n        self.client\
    \ = container.get_object(\"web_client\")\n\n    def getTvShows(self):\n      \
    \  return self.client.get_tv_shows()\n```"
