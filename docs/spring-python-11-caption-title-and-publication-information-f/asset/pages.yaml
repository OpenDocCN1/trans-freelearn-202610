- pgno: 26
  md: "To alleviate the frustration of working with SQL, Spring Python's DatabaseTemplate\
    \ greatly simplifies writing SQL, while giving you complete freedom in mapping\
    \ the results into objects, dictionaries, and tuples. DatabaseTemplate can easily\
    \ augment your application, whether or not you are already using an ORM. That\
    \ way, simple object persistence can be managed with ORM, while complex queries\
    \ can be handed over to Spring Python's DatabaseTemplate, resulting in a nice\
    \ blend of productive, functional code.\n\nOther templates, such as TransactionTemplate,\
    \ relieve you of the burden of dealing with the low level idioms needed to code\
    \ transactions that makes them challenging to incorporate correctly. Later in\
    \ this book, we will learn how easy it is to add transactions to our code both\
    \ programmatically and declaratively.\n\nApplying the services you need and abstracting\
    \ away low level APIs is a key part of the Spring way and lets us focus our time\
    \ and effort on our customer's business requirements instead of our own technical\
    \ ones.\n\nBy using the various components we just looked at, it isn't too hard\
    \ to develop a simple Pyro service that serves up TV shows from a relational database.\n\
    \n```\nfrom springpython.database.factory import *\nfrom springpython.config import\
    \ *\nfrom springpython.remoting.pyro import *\n\nclass TvShowMapper(RowMapper):\n\
    \    def map_row(self, row, metadata=None):\n        return (title=row[0],\n \
    \               airDate=row[1],\n                episodeNumber=row[2],\n     \
    \           writer=row[3])\n\nclass TvShowService(object):\n    def __init__(self):\n\
    \        self.connFactory = MySQLConnectionFactory(username=\"me\",\n        \
    \                                        password=\"secret\",\n              \
    \                                  hostname=\"localhost\",\n                 \
    \                               db=\"springpython\")\n        self.dt = DatabaseTemplate(connFactory)\n\
    \n    def get_tv_shows(self):\n        return dt.query(\"\"\"select title, air_date,\
    \ episode_number,\n                            writer\n                      \
    \  from tv_shows where name = %s\"\"\",\n                        (\"Monty Python\"\
    ,), TvShowMapper())\n```"
