  md: "![](img/bcf886d8b665372ee8afbb620d4273bb_79_0.png)\n\nsecurity_advisor is an\
    \ instance of RegexpMethodPointcutAdvisor that applies SecurityInterceptor against\
    \ any method that begins with store.\n\n```\nclass SecurityInterceptor(MethodInterceptor):\n\
    \    def invoke(self, invocation):\n        if user.has_access(invocation):\n\
    \            return invocation.proceed()\n        else:\n            raise SecurityException(\"\
    Unauthorized Access\")\n```\n\nSecurityInterceptor checks if the user's credentials\
    \ are adequate to complete this operation. If access is granted, it calls invocation.proceed(),\
    \ which flows on to the first instance of perf_advisor. If access is denied, it\
    \ raises a security exception, breaking out of the entire call stack, leaving\
    \ the caller to handle the exception. In this example, user is assumed to be a\
    \ global variable containing the current user's profile."
