- pgno: 176
  md: "# Scaling our application\n\nAt the beginning of this chapter, we talked about\
    \ the need to scale applications. So far, we have shown how to take a very simple\
    \ client-server application and split it between two instances of Python.\n\n\
    However, scaling applications typically implies running multiple copies of an\
    \ application in order to handle larger loads. Usually, some type of load balancer\
    \ is needed. Let's explore how we can use Spring Python's remoting services mixed\
    \ with some simple Python to create a multi-node version of our service.\n\n#\
    \ Converting the single-node backend into multiple instances\n\nThe first step\
    \ is to create another application context. We are going to spin up a different\
    \ configuration of components, that is a different blue print, and plan to re-use\
    \ our existing business code without making any changes.\n\n+   1. Create a two-node\
    \ configuration, which creates two instances of Service, advertised on different\
    \ ports.\n\n```\n```python\nfrom springpython.config import *\nfrom springpython.context\
    \ import scope\nfrom springpython.remoting.pyro import *\n\nfrom simple_service\
    \ import *\n\nclass HappyBirthdayContext (PythonConfig):\n    def __init__(self):\n\
    \        PythonConfig.__init__(self)\n\n    @Object(scope.PROTOTYPE)\n    def\
    \ target_service(self):\n        return Service()\n\n    @Object()\n    def service_exporter1(self):\n\
    \        exporter = PyroServiceExporter()\n        exporter.service_name = \"\
    service\"\n        exporter.service = self.target_service()\n        exporter.service_port\
    \ = 7001\n        return exporter\n```\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "```\n@Object()\ndef service_exporter2(self):\n    exporter = PyroServiceExporter()\n\
    \    exporter.service_name = \"service\"\n    exporter.service = self.target_service()\n\
    \    exporter.service_port = 7002\n    return exporter\n```\n\n2. In this context,\
    \ we have two different PyroServiceExporters, each with a different port number.\
    \ While it appears they are both using the target_service, notice how we have\
    \ changed the scope to PROTOTYPE. This means each exporter gets its own instance.\
    \ To run this new context, we need a different startup script.\n\n```\nimport\
    \ logging\nfrom springpython.context import *\n\nfrom multi_server_ctx import\
    \ *\n\nif __name__ == \"__main__\":\n    logger = logging.getLogger(\"springpython.remoting\"\
    )\n    loggingLevel = logging.DEBUG\n    logger.setLevel(loggingLevel)\n    ch\
    \ = logging.StreamHandler()\n    ch.setLevel(loggingLevel)\n    formatter = logging.Formatter(\"\
    %(asctime)s - %(name)s - %(levelname)s - %(message)s\")\n    ch.setFormatter(formatter)\n\
    \    logger.addHandler(ch)\n\n    ctx = ApplicationContext(HappyBirthdayContext())\n\
    ```"
