  md: 'In this test, we fetch a copy of `caching_service` from our IoC container and
    verify that it''s empty. Next, we fetch a copy of `wiki_service` from our IoC
    container. Inside our IoC container, we know that `caching_service` is linked
    to `wiki_service` through some AOP advice. We call `statistics`, and assert that
    the cache is still empty, since the advice doesn''t apply to that method. Next,
    we call `get_article`, and verify that the cache has a new entry. Finally, we
    call `store_article`, and verify that it cleared the cache.


    Combining this test with the earlier one, we clearly show that our `CachingInterceptor`
    advice is working as expected. Having used the IoC container, we have decoupled
    things nicely, and it is now easy to adjust one class with no impact to the other.


    # Summary


    We have explored how to solve cross cutting problems using aspect oriented programming.
    These problems include things like caching, security, and performance measuring;
    problems that all require ugly copy-paste solutions, if we resort to standard
    OOP practices.


    Spring Python''s AOP module helps us to uphold the DRY and SRP principles. This
    reduces maintenance costs and helps us to handle future changes that are always
    coming.


    In this chapter, we learned:


    +   - How to add caching to Spring Python objects

    +   - How to extend the example by adding performance and security advisors

    +   - AOP is a paradigm, and not just a library

    +   - The distinct features of Spring Python''s AOP, compared to other libraries
    as well as Python language features

    +   - The risks of AOP and how to mitigate them by automated testing

    +   - Some tips about applying `Advice`


    In the next chapter, we will look at easily writing SQL queries using Spring Python''s
    `DatabaseTemplate`.'
