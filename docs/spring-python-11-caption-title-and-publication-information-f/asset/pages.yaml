  md: "3. Let's assume that our wiki engine is now being used for a very popular site\
    \ with lots of articles and users. Multiple requests for the same article between\
    \ edits are likely going to be common and will tax the database server with a\
    \ database query every time an article is retrieved. To limit that performance\
    \ hit, let's code a simple caching solution.\n\n```\nclass WikiServiceWithCaching(object):\n\
    \    def __init__(self, data_access):\n        self.data_access = data_access\n\
    \        self.cache = {}\n\n    def get_article(self, article):\n        if article\
    \ not in self.cache:\n            self.cache[article] =\n                self.data_access.retrieve_wiki_text(article)\n\
    \        return self.cache[article]\n\n    def store_article(self, article):\n\
    \        del self.cache[article]\n        self.data_access.store_wiki_text(article)\n\
    \n    def html(self, text):\n        pass # return wiki text converted to HTML\n\
    \n    def statistics(self, article):\n        hits = self.data_access.hits(article)\n\
    \        return (hits, hits /\n            len(self.data_access.edits(article)))\n\
    ```\n\nTo handle multiple requests for the same article, WikiServiceWithCaching\
    \ stores the wiki text in an internal dictionary called cache. This cache is then\
    \ checked for the requested article before falling back to the database if the\
    \ article is not in the cache. The cache is cleared whenever new edits are made.\
    \ Finally the statistics don't have any caching at all.\n\nTo bring in our new\
    \ caching wiki service, we just need to change the wiki_service declaration in\
    \ our IoC container definition.\n\n```\nclass WikiProductionAppConfig(PythonConfig):\n\
    \    def __init__(self):\n        super(WikiProductionAppConfig, self).__init__()\n\
    \n    @Object\n    def data_access(self):\n```"
