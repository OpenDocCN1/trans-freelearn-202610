- pgno: 183
  md: '# 8


    # Case Study I—Integrating Spring Python with your Web Application


    Throughout the earlier chapters, we have covered the building blocks of Spring
    Python: dependency injection, aspect oriented programming, database template,
    transaction management, security, and remoting. All of these pieces are like the
    bricks used to build a house. We looked at each brick by itself, and saw how to
    utilize it. In this chapter we will explore using all of them together to build
    a comprehensive banking application.


    In this chapter we will learn how to:


    +   - Put together a simple banking application with a nicely decoupled view and
    controller layer

    +   - Apply simple authentication mechanisms to grant access to different types
    of users

    +   - Apply role-based authorization, distinguishing between different groups
    of users

    +   - Create custom authorization to prevent customers from seeing each other''s
    data

    +   - Export data over a trusted network in a raw, machine-readable format

    +   - Export data to external users, going through established security protocols
    to only provide this data to authenticated and authorized clients

    +   - Seamlessly audit banking operations

    +   - Mark up multi-step operations as atomic transactions'
