    /\"\"\" + self.article + \"\"\"\" title=\"\"\"\" + \\\n                    self.article\
    \ + \"\"\"\">Cancel</a></em>\n            </form>\n        \"\"\"\n        return\
    \ htmlText\n```\n\nAn EditPage is really a Page with some special rendering. The\
