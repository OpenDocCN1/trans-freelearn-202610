- pgno: 120
  md: "# Programmatic transactions\n\nOur banking example has shown how to decorate\
    \ some business logic with Spring Python's `@transactional` in order to make the\
    \ operation transactional. Throughout the example, we have repeatedly mentioned\
    \ `TransactionTemplate`.\n\nIn this section, we will use `TransactionTemplate`\
    \ directly instead of `@transactional`. We will also explore how to do this with\
    \ and without IoC configuration.\n\n# Configuring with the IoC container\n\n+\
    \   1. First, let's rewrite Bank, replacing `@transactional` with `TransactionTemplate`.\n\
    \n```\nclass Bank(object):\n    def __init__(self, connectionFactory):\n     \
    \   self.factory = connectionFactory:\n        self.dt = DatabaseTemplate(self.factory)\n\
    \        self.tx_mgr = ConnectionFactoryTransactionManager(self.\nfactory)\n \
    \       self.tx_template = TransactionTemplate(self.tx_mgr)\n\n    def transfer(self,\
    \ transfer_amt, source_act, target_act):\n        class TxDefinition(TransactionCallbackWithoutResult):\n\
    \            def doInTransactionWithoutResult(s, status):\n                self.dt.execute(\"\
    \"\"\n                update ACCOUNT\n                set BALANCE = BALANCE -\
    \ %s\n                where ACCOUNT_NUM = %s\"\"\",\n                (transfer_amt,\
    \ source_act))\n                self.dt.execute(\"\"\"\n                update\
    \ ACCOUNT\n                set BALANCE = BALANCE + %s\n                where ACCOUNT_NUM\
    \ = %s\"\"\",\n                (transfer_amt, target_act))\n        self.tx_template.execute(TxDefinition())\n\
    ```\n\nThis version of our Bank shows two more attributes: `tx_mgr` and `tx_template`.\
    \ These could be injected into our class, but we chose to inject the connection\
    \ factory only."
  merge: -1
  img_proc: true
- pgno: 121
  md: "Inside the `transfer` function, we have defined class `TxDefinition`. We then\
    \ instantiate it when calling `tx_template.execute()`.\n\n+   - This inner class\
    \ defines one method:\n+     `doInTransactionWithoutResult`, which contains our\
    \ business logic.\n+   - To avoid confusion between `self` passed into `transfer`\
    \ and `self` passed into `TxDefinition`, `doInTransactionWithoutResult` names\
    \ its first argument `s`.\n+   - Because transfer is not expected to return anything,\
    \ it uses `TransactionCallbackWithoutResult` as a base class. For return values,\
    \ use `TransactionCallback`/`doInTransaction` instead.\n\n2. Next, let's adjust\
    \ the IoC configuration to handle these changes.\n\n```\nfrom springpython.database.transaction\
    \ import *\nclass BankAppConfig(PythonConfig):\n    def __init__(self, factory):\n\
    \        PythonConfig.__init__(self)\n        self.factory = factory\n\n    @Object\n\
    \    def bank(self):\n        return Bank(self.factory)\n```\n\n3. This should\
    \ have no effect on the code used to run our app and execute the same transfer.\n\
    \n```\nif __name__ == \"__main__\":\n    from springpython.context import ApplicationContext\n\
    \    ctx = ApplicationContext(BankAppConfig(\n        Sqlite3ConnectionFactory(\"\
    /path/to/sqlite3db\")))\n    service = ctx.get_object(\"bank\")\n    bank.transfer(10000.0,\
    \ \"SAVINGS\", \"CHECKING\")\n```\n\n# Configuring without the IoC container\n\
    \nIn this situation, our IoC configuration is pretty simple. We could code the\
    \ application without it. Just remember: IoC provides useful assistance in things\
    \ like testing, mocking, and being able to swap out key objects.\n\nWe begin by\
    \ rewriting the startup script, so that it doesn't need any IoC container.\n\n\
    ```\nif __name__ == \"__main__\":\n    service = Bank(Sqlite3ConnectionFactory(\"\
    /path/to/sqlite3db\"))\n    bank.transfer(10000.0, \"SAVINGS\", \"CHECKING\")\n\
    ```"
