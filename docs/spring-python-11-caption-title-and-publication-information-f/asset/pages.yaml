- pgno: 199
  md: "5. We can initialize a MySQL database with the following script.\n\n```\nDROP\
    \ DATABASE IF EXISTS springbank;\n\nCREATE DATABASE springbank;\n\nGRANT ALL ON\
    \ springbank.* TO springbank@localhost IDENTIFIED BY 'springbank';\n\nUSE springbank;\n\
    \nCREATE TABLE account (\n    id INT(4) UNSIGNED NOT NULL AUTO_INCREMENT PRIMARY\
    \ KEY,\n    description VARCHAR(30),\n    balance DECIMAL(10,2)\n);\n```\n\nIf\
    \ we run that using MySQL's root account, it should set up our account table.\n\
    \n![](img/bcf886d8b665372ee8afbb620d4273bb_199_0.png)\n\n6. Now let's try to create\
    \ that bank account.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_199_1.png)"
