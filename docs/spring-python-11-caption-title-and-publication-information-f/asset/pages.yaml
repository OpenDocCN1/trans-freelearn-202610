    each call smoothly integrated with a corresponding PyroServiceExporter, we have
    scaled our application into a two-node version.


    # Summary


    This example again demonstrates how utilizing an IoC container allows sophisticated
    wiring of components while not requiring either the client or the server to know
    about it.


    The latest example has totally rewired the original concept of the application
    simply by coding a different set of blue prints, i.e. IoC configuration. It also
    demonstrates how things are more powerful and sophisticated when using the pure
    Python IoC configuration. We were able to mix in code as well as parameters, which
    is much smoother than writing XML files.'
