  md: "To run it, we need to include several jar files.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_249_0.png)\n\
    \nYou can see the command typed, and the output of printing the flight data to\
    \ the console.\n\nThere is one other key factor to deal with before we can wire\
    \ things together: serialization of the data. When our Java code returns an array\
    \ of Java objects, it has to be serialized by Pyro, sent over the wire, and then\
    \ deserialized by CPython. For the scalars, this is not a problem. Jython handles\
    \ it easily. But moving class objects requires class definitions on both sides\
    \ of the wire. CPython doesn't have access to our Java Flight class and the Java\
    \ code doesn't have access to the CPython class. We need a thin piece of code\
    \ in the middle that can call our Java service and convert the list of Java objects\
    \ into Python objects. A Jython wrapper would be perfect.\n\n```\nfrom model import\
    \ *\n\nclass JythonFlightDataSystem(object):\n    def __init__(self, java_system):\n\
    \        self.java_system = java_system\n\n    def flights(self, criteria):\n\
    \        return [Flight(f.flight, f.departure, f.arrival) \\\n               \
    \ for f in self.java_system.flights(criteria)]\n```\n\nThis wrapper class has\
    \ the same signature. Running it in Jython will give it access to the Java classes\
    \ as well as our Python classes."
