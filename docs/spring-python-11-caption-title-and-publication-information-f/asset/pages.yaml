  md: 'There is also a different impact on whether or not the advised target object
    is inside a tight loop.


    > It is important to measure costs before optimizing. Premature optimization can
    result in wasted effort with little benefit. Using a Python profiler (or Java
    profiler when using Jython) is key to identifying performance bottlenecks.


    # AOP is a paradigm, not a library


    There are many articles about AOP. Developers have discussed whether or not Python
    needs an AOP library.


    > Aspect oriented programming is not just a library. It''s a paradigm, just like
    object oriented programming and functional programming.


    The key goal that AOP strives to solve is writing crosscutting solutions in places
    where OOP can''t. OOP solves problems where the solution can be inherited. AOP
    is transversal whilst OOP is vertical. Either way, the goals are the same: "DRY
    (Don''t Repeat Yourself)" and "obey the SRP". This also is described by the 1:1
    Principle, which states that one requirement has one and only one manifestation
    in the implemented code. This is a combination of the DRY and SRP principles.


    Developers resort to copy-and-paste style coding when it comes to adding logging,
    caching, transactions, etc. This code which spans across multiple service classes
    is repetitive and represents a single strategy. Whenever there is a change the
    change must be repeated everywhere, and this is risky and costly.


    In our example, we used Spring Python to code an interceptor and applied it using
    pointcuts. This allowed us to avoid repetitive code while still keeping things
    simple and nicely encapsulated. This has the following benefits.


    +   - Any time a new method is added to WikiService, we can check the IoC configuration
    to see if the CachingInterceptor applies. There is only one place to check, meaning
    it is easy to check the pointcuts

    +   - We can easily tune the pointcuts without touching CachingInterceptor. This
    demonstrates how the advice is cleanly decoupled from the pointcuts'
