  md: "There are no checks to make sure that we even have $10,000 to transfer! Also,\
    \ there is no type of security check ensuring that we own either of these two\
    \ accounts. We will address this deficiency later on, when filling in the transactional\
    \ details.\n\nWe're not done yet. In order to have @transactional do its job,\
    \ we need to link it with a Transaction Manager through an AutoTransactionalObject.\
    \ The Transaction Manager provides @transactional with a handle into the database\
    \ to issue necessary commits and rollbacks. It also tracks the context of existing\
    \ transactions and make appropriate decisions about when to start new transactions.\n\
    \n+   1. To inject everything, let's define a pure Python IoC container that links\
    \ ConnectionFactoryTransactionManager to @transaction through an AutoTransactionalObject.\n\
    \n```\nfrom springpython.database.transaction import *\nclass BankAppConfig(PythonConfig):\n\
    \    def __init__(self, factory):\n        PythonConfig.__init__(self)\n     \
    \   self.factory = factory\n\n    @Object\n    def transactionalObject(self):\n\
    \        return AutoTransactionalObject(self.tx_mgr())\n\n    @Object\n    def\
    \ tx_mgr(self):\n        return ConnectionFactoryTransactionManager(self.factory)\n\
    \n    @Object\n    def bank(self):\n        return Bank(self.factory)\n```\n\n\
    +   - tx_mgr defines our Transaction Manager, which uses an injected factory in\
    \ order to perform the SQL transaction APIs. This is the same type of factory\
    \ used by DatabaseTemplate. tx_mgr tracks when transactions begin and end, providing\
    \ the necessary services for TransactionTemplate and @transactional.\n+   - transactionalObject\
    \ defines an instance of AutoTransactionalObject, an IoC post processor. Its job\
    \ is to find all instances of @transactional and link them with the tx_mgr. This\
    \ is what empowers @transactional to do its job of ensuring data integrity through\
    \ SQL transactions.\n+   - The bank class is our business class."
