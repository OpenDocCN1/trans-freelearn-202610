- pgno: 37
  md: '# 2


    # The Heart of Spring Python—Inversion of Control


    Many software teams seek ways to improve productivity without sacrificing quality.
    This has led to an increase in automated testing and, in turn, sparked an interest
    in making applications more testable. Many automated test frameworks promote isolating
    objects by swapping collaborating objects with test doubles to provide canned
    responses. This generates a need for developers to plugin test doubles with as
    little change as possible.


    On some occasions, managers have trimmed budgets by cutting back on development
    and integration hardware. This leaves developers with the quandary of having to
    develop on a smaller footprint than their production environment. Software developers
    need the ability to switch between different test configurations and deployment
    scenarios.


    Software products sold to customers often need the ability to make flexible adjustments
    on site, whether its through a company representative or from the customer.


    In this chapter, we will explore how Spring Python''s **Inversion of Control (IoC)**
    container meets all these needs by making it possible to move the creation of
    critical objects into a container definition, allowing flexible adjustment without
    impacting the core business code.'
  merge: -1
  img_proc: true
- pgno: 38
  md: "This chapter will cover:\n\n+   - How IoC containers make it easy to isolate\
    \ objects under test in order to work with automated testing.\n+   - A detailed\
    \ explanation of IoC with high level diagrams. We will learn how Dependency Injection\
    \ is a type of IoC and uses the Hollywood principle of *Don't call us, we'll call\
    \ you!*\n+   - Spring Python's IoC container, which handles dependency resolution,\
    \ setting properties, and lazy initialiation. It also provides extension points\
    \ for developers to utilize as needed.\n+   - Spring Python's answer to the community\
    \ debate of IoC in dynamic languages.\n+   - How mixing Python and Java components\
    \ together is easy, can be done many ways, and provides a good way for developers\
    \ to choose what best fits their needs.\n\n# Swapping production code with test\
    \ doubles\n\nAs developers, we need the ability to exchange production objects\
    \ with mocks and stubs.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_38_0.png)\n\
    \n> Mocks and stubs are two ways of generating canned responses used to test our\
    \ code. **Mocks** are used to generate canned method calls. **Stubs** are used\
    \ to generate canned data. Both of these are useful tools to simulate external\
    \ components our code must work with. For more details, see http://martinfowler.com/articles/mocksArentStubs.html\n\
    \nIn this example, we are going to explore how an IoC container makes it easy\
    \ to exchange production objects with mock instances. We start by developing a\
    \ simple service along with some automated testing for a wiki engine.\n\n+   1.\
    \ First of all, let's define a simple service for our wiki engine. The following\
    \ `WikiService` has a function that looks into a MySQL database and returns the\
    \ number of hits for a page as well as the ratio of reads per edit.\n\n```\nclass\
    \ WikiService(object):\n\n    def __init__(self):\n        self.data_access =\
    \ MySqlDataAccess()\n```"
  merge: -1
  img_proc: true
- pgno: 39
  md: "```\ndef statistics(self, page_name):\n\"\"\"Return tuple containg (num hits,\
    \ hits per edit)\"\"\"\nhits = self.data_access.hits(page_name)\nreturn (hits,\
    \ hits / len(self.data_access.edits(page_name)))\n```\n\nIn this situation, WikiService\
    \ directly defines data_access to use MySqlDataAccess. The statistics method calls\
    \ into MySqlDataAccess to fetch some information, and returns a tuple containing\
    \ the number of hits against the page as well as the ratio of reads per edit.\n\
    \n> It is important to point out that our current version of WikiService has a\
    \ strong dependency on MySQL as implied by directly creating an instance of MySqlDataAccess.\n\
    \n+   2. Next, we will write some startup code used to run our wiki web server.\n\
    \n```\nif __name__ == \"__main__\":\n    service = WikiService()\n    WikiWebApp(service).run()\n\
    ```\n\nThe startup code creates an instance of WikiService, which in turn creates\
    \ an instance of MySqlDataAccess. We create an instance of our main web application\
    \ component, WikiWebApp, and start it up, giving it a handle on our service.\n\
    \n> We have not defined WikiWebApp or MySqlDataAccess. Instead, we will be focusing\
    \ on the functionality WikiService provides, and on how to isolate and test it.\n\
    \nLet's look more closely at testing the code we've written. A good test case\
    \ would involve exercising statistics. Considering that it uses hits and edits\
    \ from MySqlDataAccess, it is directly dependent on connecting to a live MySQL\
    \ database. One option for testing would be pre-loading the database with fixed\
    \ content. However, the cost of set up and tear down can quickly scale out of\
    \ control. If you have multiple developers on your team, you also don't want the\
    \ contention where one developer is setting up while another is tearing down the\
    \ same tables."
