  md: '# About the Author


    Greg Lee Turnquist has worked in the software industry since 1997. He is an active
    participant in the open source community, and has contributed patches to several
    projects including MythTV, Spring Security, MediaWiki, and the TestNG Eclipse
    plugin. As a test-bitten script junky, he has always sought the right tool for
    the job. He is a firm believer in agile practices and automated testing. He has
    developed distributed systems, LAMP-based setups, and supported mission critical
    systems hosted on various platforms.


    After graduating from Auburn University with a Master''s in Computer Engineering,
    Greg started working with Harris Corporation. He worked on many contracts utilizing
    many types of technology. In 2006, he created the Spring Python project, which
    became the first official Spring Extension to reach live status. He recently joined
    SpringSource as part of their international software development team.


    > I would like to extend thanks to Russ Miles and Sylvain Hellegouarch for taking
    the time to technically review this book and provide valuable feedback. I also
    thank my father, Dr. Paul Turnquist, for providing inspiration to write. And most
    importantly, I thank my wife Sara, for the support, encouragement, and patience.'
