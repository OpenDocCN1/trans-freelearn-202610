- pgno: 109
  md: '# 5


    # Adding Integrity to your Data Access with Transactions


    SQL operations are used in lots of applications in order to supply data. A key
    ingredient used to grow applications to enterprise scale are transactions. They
    add integrity to data management by defining an atomic unit of work.


    An atomic unit of work means that the whole sequence of steps when completed must
    appear like a single step. If there is any failure in the chain of steps, everything
    must rollback to the state before the transaction started. For SQL transactions,
    this means that the state of the database must update or rollback atomically.


    This chapter will inspect the pattern of coding and using SQL transactions, and
    how Spring Python makes it easy to code an otherwise monotonous pattern.


    In this chapter, you will learn:


    +   - The classic pattern of SQL transactions and the issues imposed when coding
    transactions by hand

    +   - That it is easy to add transactions to a banking application using Spring
    Python''s `@transactional` decorator

    +   - You can choose between coding transactions programmatically or by decorator

    +   - You can choose between using and not using the IoC container

    +   - Spring Python provides the means to non-intrusively mix in transactions
    to non-transactional code without editing the source'
  merge: -1
  img_proc: true
- pgno: 110
  md: "# Classic transaction issues\n\nTransactions have a simple pattern of execution\
    \ as shown in this block of pseudo-Python.\n\n```\n# Start transaction\ntry:\n\
    \    #*********************************\n    # Execute business logic that\n \
    \   # that contains database operations.\n    #*********************************\n\
    \n    # Commit transaction\nexcept:\n    # Rollback transaction\n```\n\nLet's\
    \ look at the steps involved in defining a transaction:\n\n+   1. First, the transaction\
    \ must be *started*.\n+   2. Then, a block of business code is executed, which\
    \ contains several database operations, including `select`, `update`, and `insert`.\n\
    +   3. Finally, the transaction is *committed*. If any type of error occurs, an\
    \ exception handler *rolls back* the transaction, undoing all the changes that\
    \ were made.\n\nThe problem with writing transactions manually is similar to the\
    \ problem with writing SQL operations manually. There is a lot of boilerplate\
    \ code that must be written. The boilerplate has a tangling effect because it\
    \ must be written before and after the business code in order for the transaction\
    \ to be handled correctly. This pattern must then be copied into every location\
    \ where some business logic needs to be wrapped in a transaction.\n\nThis violates\
    \ the **DRY (Don't Repeat Yourself)** principle. It also tangles our code with\
    \ not only business logic, but transactional logic as well. And it breaks the\
    \ **Single Responsibility Principle (SRP)** by having our code depend on both\
    \ business and integrity requirements.\n\nViolating these principles puts us at\
    \ risk. We might introduce bugs when changes to the transactional logic are needed,\
    \ but we fail to to repeat them in all the right places.\n\nThis is a crosscutting\
    \ problem because it extends beyond our class hierarchy. Steps contained within\
    \ the unit of work can quickly cut across several classes. This is a perfect use\
    \ case for aspect oriented programming that was discussed earlier in this book.\
    \ As we delve into this in more detail in this chapter, we will see how to solve\
    \ it with ease using Spring Python."
  merge: -1
  img_proc: true
- pgno: 111
  md: "# Creating a banking application\n\nUntil now, the various chapters have shown\
    \ sample code that involved designing a wiki engine. For this chapter, a banking\
    \ application will be used as the basis for code examples. Banks must be able\
    \ to move money around and not lose a single penny, maintaining a high integrity.\
    \ This provides a simple problem space to demonstrate writing transactional code.\n\
    \n+   1. First, let's write a simple transfer operation that transfers a certain\
    \ amount of money from one account to another without any concept of a transaction.\n\
    +   \n+   2. Let's combine this operation with the transaction pattern we looked\
    \ at earlier, to give our bank some integrity.\n\n```\ndef transfer(transfer_amt,\
    \ source_act, target_act):\n    cursor = conn.cursor()\n    cursor.execute(\"\"\
    \"\n        update ACCOUNT\n        set BALANCE = BALANCE - %s\n        where\
    \ ACCOUNT_NUM = %s\"\"\",\n        (transfer_amt, source_act))\n    cursor.execute(\"\
    \"\"\n        update ACCOUNT\n        set BALANCE = BALANCE + %s\n        where\
    \ ACCOUNT_NUM = %s\"\"\",\n        (transfer_amt, target_act))\n    cursor.close()\n\
    ```\n\nLet's assume we are transferring $10,000 from the SAVINGS account to the\
    \ CHECKING account. In our business logic, we accomplish this by first withdrawing\
    \ $10,000 from the SAVINGS account and then depositing $10,000 into the CHECKING\
    \ account.\n\nImagine if there was some system error that happened after we had\
    \ withdrawn from the SAVINGS account that caused the system to restart. Having\
    \ never deposited the transfer amount into the CHECKING account, the bank would\
    \ have leaked $10,000 to nowhere. How long would you keep your money in a bank\
    \ like that? Probably not for long!\n\n```\ndef transfer(transfer_amt, source_act,\
    \ target_act):\n    conn.commit()\n    try:\n        cursor = conn.cursor()\n\
    \        cursor.execute(\"\"\"\n            update ACCOUNT\n            set BALANCE\
    \ = BALANCE - %s\n            where ACCOUNT_NUM = %s\"\"\"\n```"
