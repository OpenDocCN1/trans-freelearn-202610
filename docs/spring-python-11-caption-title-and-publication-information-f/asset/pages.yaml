    \ CachingService is a bit over engineered, considering it's just a Python dictionary.\
    \ I normally wouldn't write unit tests for language-level structures like this.\
    \ However, the purpose of this example is to show that we can move our solution\
    \ into a separate module, free of any AOP machinery, and then enhance it with\
    \ more sophisticated features. We could modify it to be a distributed cache that\
    \ would persist across multiple nodes without impacting either WikiService or\
    \ CachingInterceptor.\n\nTesting the caching service is valuable because it keeps\
    \ bugs from creeping back into the code base. But we also need to know that our\
    \ aspect is being correctly woven with the Wiki API that we have coded.\n\n# Confirming\
    \ that our service is correctly woven into the API\n\nWe have confirmed that the\
    \ caching service works by isolating it and writing an automated test. The final\
    \ task we need to complete is verifying that we have wired the caching service\
    \ into our API correctly.\n\nLet's add another test method to CachedWikiTest showing\
    \ that WikiService is being properly advised.\n\n```\n```python\ndef testWikiServiceWithCaching(self):\n\
    \    context = ApplicationContext(WikiTestAppConfig())\n    caching_service =\
    \ context.get(\"caching_service\")\n    self.assertEquals(len(caching_service.keys()),\
    \ 0)\n    wiki_service = context.get_object(\"wiki_service\")\n    wiki_service.statistics(\"\
    Spring Python\")\n    self.assertEquals(len(caching_service.keys()), 0)\n    html\
    \ = wiki_service.get_article(\"Spring Python\")\n    self.assertEquals(len(caching_service.keys()),\
    \ 1)\n    wiki_service.store_article(\"Spring Python\")\n    self.assertEquals(len(caching_service.keys()),\
    \ 0)\n```\n```"
