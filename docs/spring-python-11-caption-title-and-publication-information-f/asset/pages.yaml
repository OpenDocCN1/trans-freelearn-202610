- pgno: 40
  md: "3. Since we do not want to continuously setup and tear down live database tables,\
    \ we are going to code a stubbed out version of the data access object instead.\n\
    \n```\n```python\nclass StubDataAccess(object):\n    def hits(self):\n       \
    \ return 10.0\n\n    def edits(self, page_name):\n        return 2.0\n```\n```\n\
    \n> Notice how our stub version returns canned values that are easy to test against.\n\
    \n4. Now let's write a test case that exercises our WikiService. In order to replace\
    \ the data_access attribute with a test double, the test case must directly override\
    \ the attribute.\n\n```\n```python\nclass WikiServiceTestCase(unittest.TestCase):\n\
    \    def testHittingWikiService(self):\n        service = WikiService()\n    \
    \    service.data_access = StubDataAccess()\n\n        results = service.statistics(\"\
    stub page\")\n        self.assertEquals(10.0, results[0])\n        self.assertEquals(5.0,\
    \ results[1])\n```\n```\n\nThis solution nicely removes the need to deal with\
    \ the MySQL database by plugging in a stubbed out version of our data access layer.\
    \ These dependencies are depicted in the following diagram.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_40_0.png)\n\
    \nWikiServiceTestCase depends on WikiService and StubDataAccess, as well as an\
    \ inherited dependency to MySqlDataAccess. Any change to any of these dependencies\
    \ could impact our test code."
