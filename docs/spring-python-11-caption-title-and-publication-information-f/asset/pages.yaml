    PYROLOC://localhost:9000/tvshows\"\n        return myService\n\nif __name__ ==\
    \ \"__main__\":\n    container = ApplicationContext(TvShowContainer())\n    container.get_object(\"\
    web_server\")\n```\n\nBy querying the database for TV shows and serving it up\
    \ through Pyro, this block of code demonstrates how easy it is to use these powerful\
    \ modules without mixing them together. It is much easier to maintain software\
    \ over time when things are kept simple and separated.\n\nWe just took a quick\
    \ walk through SQL and Pyro and examined their low level APIs. Many low level\
    \ APIs require a certain sequence of steps to properly utilize them. We just looked\
    \ at a SQL query. The need for templates also exists with database transactions\
    \ and LDAP calls. By capturing the flow of the API in a Spring Python template\
    \ and allowing you to insert your custom code, you can get out of writing plumbing\
    \ code and instead work on your application's business logic.\n\n# Spring Python\
    \ for Java developers\n\nJava developers often seek ways to increase productivity.\
    \ With the incredible growth of alternative languages on the Java Virtual Machine\
    \ (JVM), it is no wonder developers are looking into Jython (http://www.jython.org)\
    \ as an alternative way to write scripts, segments, and subsystems. While it's\
