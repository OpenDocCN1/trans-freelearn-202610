  md: "Let's explore the steps taken if our wiki engine software had originally been\
    \ written in Java, and we are exploring the option to migrate to Python. To make\
    \ this as seamless as possible, we will run the Python bits in Jython.\n\n![](img/bcf886d8b665372ee8afbb620d4273bb_55_0.png)\n\
    \n> Jython is a Python compiler written in Java and designed to run on the JVM.\
    \ Jython scripts can access both Python and Java-based libraries. However, Jython\
    \ can not access Python extensions coded in C. Spring Python 1.1 runs on Jython\
    \ 2.5.1. Information about download, installation, and other documentation of\
    \ Jython can be found at http://jython.org.\n\n1. Let's assume that the Java code\
    \ has a well defined interface for data access.\n\n```\npublic interface DataAccess\
    \ {\n\n    public int hits(String pageName);\n\n    public int edits(String pageName);\n\
    }\n```\n\n2. For demonstration purposes, let's create this concrete Java implementation\
    \ of that interface.\n\n```\npublic class MySqlDataAccess implements DataAccess\
    \ {\n\n    private JdbcTemplate jt;\n\n    public MySqlDataAccess(DataSource ds)\
    \ {\n        this.jt = new JdbcTemplate(ds);\n    }\n\n    public int hits(String\
    \ pageName) {\n        return jt.queryForInt(\n            \"select HITS from\
    \ METRICS \" +\n            \"where PAGE = ?\", pageName);\n    }\n\n    public\
    \ int edits(String pageName) {\n        return jt.queryForInt(\n            \"\
    select count(*) from VERSIONS \" +\n            \"where PAGE = ?\", pageName);\n\
    \    }\n}\n```"
