    > It is important to realize that while the caching interceptor reduces hits to
    the database, there is still an overhead cost of pattern matching on the method
    name. This type of overheard cost must be included in any end-to-end performance
    analysis.


    This solves the problem of cleanly applying a caching service to the API of our
    wiki engine, without breaking the SRP. By using Spring Python''s AOP module, we
    have been able to code a generic, re-usable caching module and plugged it in with
