  md: "# Building a skeleton web application\n\nTo get underway, we need a shell of\
    \ a web application where we can start filling in the details. We previously used\
    \ CherryPy (http://cherrypy.org) to build a simple web app, so let's use that\
    \ to kick things off.\n\n+   1. First of all, let's code a main application that\
    \ will bootstrap CherryPy as well as our application context.\n\n```\nimport cherrypy\n\
    import os\nimport ctx\nfrom springpython.context import ApplicationContext\n\n\
    if __name__ == '__main__':\n    cherrypy.config.update({'server.socket_port':\
    \ 8009})\n\n    applicationContext =\n        ApplicationContext(ctx.SpringBankAppContext())\n\
    \n    cherrypy.tree.mount(\n        applicationContext.get_object(\"view\"),\n\
    \        '/',\n        config=None)\n\n    cherrypy.engine.start()\n    cherrypy.engine.block()\n\
    ```\n\nYou may notice that, it is looking inside package ctx for SpringBankAppContext\
    \ to find the view object.\n\n+   2. Let's write a simple, pure Python IoC container\
    \ that will create the CherryPy view object we need.\n\n```\nfrom springpython.config\
    \ import PythonConfig, Object\n\nfrom app import *\n\nclass SpringBankAppContext(PythonConfig):\n\
    \    def __init__(self):\n        PythonConfig.__init__(self)\n\n    @Object\n\
    \    def view(self):\n        return SpringBankView()\n```"
