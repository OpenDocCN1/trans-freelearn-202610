  md: 'cipher, we can easily understand how the implementation of this algorithm in
    practice is very difficult. So, we can say that Vernam is invulnerable but only
    in theoretical security, not in practical security. A corollary of this assumption
    is this: implementing an algorithm means putting into practice its theoretical
    scheme and adding much more complexity to it. So, *complexity is the enemy of
    security*. The more complex a system is, the more points of attack can be found.
    Another consideration is related to the grade of security of an algorithm. We
    can better understand this concept by considering Shannon''s theory and the concept
    of *perfect secrecy*. The definition given by Claude Shannon in 1949 of perfect
    secrecy is based on statistics and probabilities. However, about the maximum grade
    of security, Shannon theorized that a ciphertext maintains perfect secrecy if
    an attacker''s knowledge of the content of a message is the same both before and
    after the adversary inspects the ciphertext, attacking it with unlimited resources.
    That is, the message gives the adversary precisely no information about the message
    contents. To better understand this concept, I invite you to think of different
    levels or grades of security, in which any of these degrees is secure but with
    a decreasing gradient. In other words, the highest level is the strongest and
    the lowest is the weakest but in the middle, there is a zone of an indefinite
    grade that depends on the technological computational level of the adversary.
    It''s not important how many degrees are supposed to be secure and how many are
    not. I think that, essentially, we have to consider what is certainly secure and
    what is not, but also what can be accepted as secure in a determinate time. With
    that in mind, let''s see the difference between perfect secrecy and secure:


    +   - A cryptosystem could be considered to have *perfect secrecy* if it satisfies
    at least two conditions:

    +     - It cannot be broken even if the adversary has unlimited computing power.

    +     - It''s not possible to get any information about the message, **[m]**,
    and the key, **[k]**, by analyzing the cryptogram, **[c]** (that is, Vernam is
    a theoretically perfect secrecy system but only under determinate conditions).

    +   - A cryptogram is *secure* even if, theoretically, an adversary can break
    the cryptosystem (that is, if they had quantum computational power and an algorithm
    of factorization that runs well) but the underlying'
