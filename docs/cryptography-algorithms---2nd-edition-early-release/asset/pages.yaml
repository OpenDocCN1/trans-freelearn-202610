  md: 'underlying mathematical problem. As an example, RSA, one of the most famous
    and most widely used algorithms in the history of cryptography, is supported by
    the mathematical problem of factorization. Factorization is essentially the decomposition
    of a number into its divisors: 21 = 3 × 7. It''s very easy to find the divisors
    of 21, which are **3** and **7**, for small integers, but it is also well known
    that increasing the number of digits will exponentially increase the problem of
    factorization. We will deeply analyze asymmetric algorithms such as RSA in this
    book, and in particular, in *Chapter 3, Asymmetric Encryption*, when I will explain
    asymmetric encryption. But here, it is sufficient to explain why RSA is used to
    protect financial, intelligence, and other kinds of very sensitive secrets. The
    reason is that the mathematical problem underlining RSA (factorization) is still
    a hard problem to solve for computers of this generation. However, in this introductory
    section, I can''t go deeper into analyzing RSA, so I will limit myself to saying
    that RSA suffers from not only the problem of factorization as its point of attack,
    but there is another equally competitive, in computational terms, problem, which
    is the **discrete logarithm** problem. Later in the book, we will even analyze
    both these hard computational problems. Now, we assume (incorrectly, as 99% of
    cryptographic texts do) that the pillar of security underlying RSA is factorization.
