- pgno: 120
  md: '![](img/2c67eb1b2bfb299c02a010d62900759c_120_0.png)


    *Figure 4.2 – Hash functions symbolized by a "funnel mincer"*


    The next question is: why and where are hash functions used? Recalling what we
    said at the beginning of this Chapter, in cryptography, hash functions are widely
    used for a range of different scopes:


    +   - Hash functions are commonly used in asymmetric encryption to avoid exposing
    the original message **[M]** when collecting digital signatures on it (we will
    see this later in this chapter). Instead, the hash of the original message proves
    the identity of the transmitter using **(M'')** as a surrogate.

    +   - Hashes are used to check the integrity of a message. In this case, based
    on the digital hash of the original message **(M'')**, the receiver can easily
    detect whether someone has modified the original message **[M]**. Indeed, by changing
    only 1 bit among the entire content of the British Encyclopedia **[M]**, for example,
    its hash function, **h(M)**, will have a completely different hash value **h(M'')**
    than the previous one. This particularity of hash functions is essential because
    we need a strong function to verify that the original content has not been modified.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '+   - Furthermore, hash functions are used for indexing databases. We will
    see these functions throughout this book. We will use them a lot in the implementation
    of our *Crypto Search Engine* detailed in *Chapter 9, Crypto Search Engine*, and
    will also see them in *Chapter 8, Quantum Cryptography*. Indeed, hash functions
    are candidates for being *quantum resistant*, which means that hash functions
    can overcome a quantum computer''s attack *under certain conditions*.

    +   - The foundational concept of performing a secure hash function is that given
    an output **h(M)**, it is difficult to get the original message from this output.


    A function that respects such a characteristic is the *discrete logarithm*, which
    we have already seen in our examination of asymmetric encryption: g^[a] = y (mod
    p). Where, as you may remember, given the output (y) and also knowing (**g**),
    it is very difficult to find the secret private key **[a]**. However, a function
    like this the discrete logarithm seems to be too slow to be considered for practical
    implementations, as well as weak. As you have seen above, one of the particularities
    of hashes is to be quick to calculate. As we have seen what hash functions are
    and their characteristics, now we will look at the main algorithms that implement
    hash functions.


    # Overview of the main hash algorithms


    Since a hash algorithm is a particular kind of mathematical function that produces
    a fixed output of bits starting from a variable input, it should be collision-free,
    which means that it will be difficult to produce two hash functions for the same
    input value and vice versa. There are many types of hash algorithms, but the most
    common and important ones are **MD5**, **SHA-2**, and **CRC32**, and in this chapter,
    we will focus on the **Secure Hash Algorithm (SHA)** family. Finally, for your
    knowledge, there is **RIPEMD-160**, an algorithm developed by EU scientists in
    the early 1990s available in 160 bits and in other versions of 256 bits and 320
    bits. This algorithm didn’t have the same success as the SHA family, but could
    be the right candidate for security as it has never been broken so far. The SHA
    family, developed by the **National Security Agency (NSA)**, is the object of
    study in this chapter. I will provide the necessary knowledge to understand and
    learn how the SHA family works. In particular, **SHA-256** is currently the hash
    function used in'
