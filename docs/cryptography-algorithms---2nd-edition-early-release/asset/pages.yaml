  md: '# Authentication and digital signatures


    In cryptography, the **authentication** problem is one of the most interesting
    and difficult problems to solve. Authentication is one of the most sensitive functions
    (as well as the most used) for the procedure of access control. Authentication
    is based on three methods:


    +   - On something that *only the user knows* (for example, a password)

    +   - On something that *only the user holds* (a smart card, device, or a token)

    +   - On something that *characterizes the user* (for example, fingerprints, an
    iris scan, and in general biometric characteristics of a person)


    In addition to these three methods, there is one more method involving something
    that *only the user holds, related to something that uniquely characterizes them*:
    **brain waves.** For example, when you look at a picture or think about it, the
    brain waves activated by your brain are unique, different from any other brain
    waves that characterize another person. This invention is related to the authentication
    between human/computer. In other words, with Brain Password, it is possible to
    unlock devices such as computers and telephones and get access to web applications.
    I will introduce brain passwords in *Chapter 6, New Algorithms in Public/Private
    Key Cryptography.* In the next section, we will analyze an authentication method
    based on digital signatures. Keep in mind (as we will see later on) that there
    are similar methods of authentication based, for example, on zero knowledge, which
    will be covered further in *Chapter 5, Introduction to Zero-Knowledge Protocols.*
    Let''s see how a method of authentication based on a digital signature over public/private
    key encryption works. Let''s consider an example where Alice wants to transmit
    a message to Bob. She knows Bob''s public key (as in RSA), so Alice encrypts the
    message **[M]** with RSA and sends it to Bob. Let''s look at some of the common
    problems faced when Alice transmits the message:


    +   - How can Bob be sure that this message comes from Alice (*authentication
    problem*)?

    +   - After Bob has received the message, Alice could always deny that she is
    the transmitter (*non-repudiation*).

    +   - Another possible issue is that the message **[M]** could be manipulated
    by'
