  md: '# Blind signature with RSA


    Suppose Bob has an important secret he doesn''t want to expose to the public until
    a determined date. For example, he discovered a formidable cure for coronavirus
    to avoid cancer and he aspires to get the Nobel Prize. Alice represents the commission
    for the Nobel Prize. Alice picks up two big secret primes **[pa, qa]**:


    +   - **[pa*qa] = Na**, which is Alice''s public key.

    +   - **(e)** is the same public parameter already defined in RSA.


    The parameter **[da]** is Alice''s private key, given by this operation: `INV
    (e) ≡ [da] mod (pa−1)(qa−1)` Suppose that **[M1]** is the secret belonging to
    Bob. I have just called it **[M1]** to distinguish it from the regular **[M]**.
    Bob picks up a random number **[k]** and keeps it secret. Now Bob can go ahead
    with the blind signature protocol on **[M1]**:


    +   - **Step 1** – Bob performs encryption **(t)** on **[M1]** to *blind* the
    message:


    ```

    t ≡ [M1] * [k]^e (mod Na) Bob sends (t) to Alice.

    ```


    +   - **Step 2** – Alice can perform the blind signature given by the following
    operation:


    ```

    S ≡ t^[da] (mod Na) Alice sends (S) to Bob, who can verify whether the blind signature
    corresponds to the message [M1].

    ```


    +   - **Step 3** – Verification:


    Bob calculates **(V)**: `S/k ≡ V (mod Na)` Then he can verify the following: `V^e
    ≡ [M1] (mod Na)` If the last operation is **TRUE**, it means Alice has effectively
    signed *blind* **[M1]**. In this case, Bob can be sure of the following: `[M1]^[da]
    ≡ V (mod Na)` Since no one except Alice could have performed function **(S)**
    without being able to solve the *discrete logarithm* problem (as already seen
    in *Chapter 3, Asymmetric Algorithms*), the signer must be Alice, for sure. This
    sentence remains valid until any other variable occurs; for example, when someone
    finds a logical way to solve the discrete logarithm or a quantum computer reaches
    enough qubits to break the'
