- pgno: 66
  md: '# Figure 2.21 – DES decryption process


    So, to describe the decryption process: you take the ciphertext and operate the
    first IP on it, then **XOR L0** (left part) with **R0 = f(R0, K16)**. Then you
    keep on going like that for each round, make a final permutation, and end up finding
    the plaintext. Now that we have arrived at the end of the DES algorithm process,
    let''s go ahead with the analysis of the algorithm and its vulnerabilities.


    # Analysis of the DES algorithm


    Going a little bit more into the details of the algorithm, we can discover some
    interesting things. One of the most interesting steps of DES is the **XOR** operation
    performed between the sub-keys (**K1, K2...K16**) and the half part of the message,
    **[M]**, at each round. In this step, we find the S-Box: the function *f* previously
    described in simplified DES. As we saw earlier, the S-Box is a particular matrix
    in DES that consists of 4 rows and 16 columns (S-Box 4X16) fixed by the NSA:'
