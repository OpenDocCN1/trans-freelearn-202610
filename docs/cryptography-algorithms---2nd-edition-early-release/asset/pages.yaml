  md: '# ROT13


    A modern example of an algorithm that is used on the internet is **ROT13**. Essentially,
    this is a simple cipher derived from the Caesar cipher with a shift of (+13).
    Computationally, it is easy to break the Caesar cipher, but it yields an interesting
    effect: if we shift to the left or to the right, we will have the same result.
    Just like the preceding example, in ROT13, we have to select letters that correspond
    to the pre-selected key. Essentially, the difference here is that instead of applying
    a keyphrase to perform the ciphertext, we will use 13 letters from the English
    alphabet as the *key generator*. ROT13 takes in encryption only the letters that
    occur in the English alphabet and not numbers, symbols, or other characters, which
    are left as they are. The ROT13 function essentially encrypts the plaintext with
    a key determined by the first 13 letters transposed into the second 13 letters,
    and the inverse for the second 13 letters. Take a look at the following example
    to better understand the encryption scheme:


    ![](img/2c67eb1b2bfb299c02a010d62900759c_26_0.png)


    *Figure 1.9 — The encryption scheme in ROT13*'
  merge: -1
