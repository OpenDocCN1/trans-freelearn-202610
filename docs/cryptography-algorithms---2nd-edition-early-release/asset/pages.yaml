    # Blind signatures


    *David Chaum* invented **blind signatures**. He struggled a lot to find a cryptographic
    system to anonymize *digital payments*. In 1990, David funded *eCash*, a system
    that adopted an untraceable currency. Unfortunately, the project went bankrupt
    in 1998, but Chaum will be forever remembered as one of the pioneers of digital
    money and one of the fathers of modern cryptocurrency, along with Bitcoin.The
    underlying problems that Chaum wanted to solve were the following:


    +   - To find an algorithm that was able to avoid the *double-spending problem*
    for electronic payments.

    +   - To make the digital system *secure and anonymous* to guarantee the *privacy*
    of the user.


    In 1982, Chaum wrote an article entitled *Blind Signatures for Untraceable Payments*.
    The following is an explanation of how the blind signatures described in the article
    work and how to implement them.Signing a message *blind* means to sign something
    without knowing the content. It could be used not only for digital payments but
    also if Bob, for example, wants to publicly register something that he created
    without making known to others the details of his invention. Another application
    of blind signatures is in electronic voting machines, where someone makes a choice
    (say, in an election for the president or for a party, for example). In this case,
    the result of the vote (the transmitted message) has to be known by the receiver
    obviously, but the identity of the voter has to remain a secret if the voter wants
    to be sure that their vote will be counted (that is the proper function of blind
    signatures).I will expose an innovative blind signature scheme for the *MBXI cipher*
    in *Chapter 6, New Algorithms in Public/Private Key Cryptography*, where I will
    introduce new ciphers in private/public keys, including the MBXI, invented and
    patented by me in 2011. Let''s see now how David Chaum''s protocol works by performing
    a blind signature with RSA.'
