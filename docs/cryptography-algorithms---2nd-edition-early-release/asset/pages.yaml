  md: 'As you can see in the preceding diagram, **H** becomes **U**, **E** becomes
    **R**, **L** becomes **Y** (twice), and **O** becomes **B**: **HELLO = URYYB**
    The key consists of the first 13 letters of the alphabet up to **M**, which becomes
    **Z**, then the sequence wraps back to **N**, which becomes **A**, **O** becomes
    **B**, and so on to **Z**, which becomes **M**. **ROT13** was used to hide potentially
    offensive jokes or obscure an answer in the **net.jokes** newsgroup in the early
    1980s. Also, even though ROT13 is not intended to be used for a high degree of
    secrecy, it is still used in some cases to hide email addresses from unsophisticated
    spambots. ROT13 is also used for the scope of circumventing spam filters such
    as obscuring email content. This last function is not recommended because of the
    extreme vulnerability of this algorithm. However, ROT13 was used by **Netscape
    Communicator** – the browser organization that released [https://www.mozilla.org](https://www.mozilla.org)
    – to store email passwords. Moreover, ROT13 is used in Windows XP to hide some
    registry keys, so you can understand how sometimes even big corporations can have
    a lack of security and privacy in communications.


