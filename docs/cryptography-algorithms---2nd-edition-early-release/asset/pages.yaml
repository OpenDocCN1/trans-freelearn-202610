    # Summary


    In this chapter, we have analyzed hash functions, digital signatures, and blind
    signatures. After introducing hash functions, we started by describing the mathematical
    operations behind these one-way functions followed by an explanation of SHA-1.
    We then explained digital signatures with RSA and ElGamal with practical numerical
