    # The Vernam cipher


    The **Vernam cipher** has the highest degree of security for a cipher, as it is
    theoretically completely secure. Since it uses a truly random key of the same
    length as the plaintext, it is called the **perfect cipher**. It''s just a matter
    of entropy and randomness based on Shannon''s principle of information entropy
    that determines an equal probability of each bit contained in the ciphertext.
    We will revisit this algorithm in *Chapter 8, Quantum Cryptography*, where we
    talk about quantum key distribution and the related method to encrypt the plaintext
    after determining the quantum key. Another interesting implementation is Hyper
    Crypto Satellite, which uses this algorithm to encrypt the plaintext crafted by
    a random key transmitted by a satellite radiocommunication and expressed as an
    infinite string of bits.But for now, let''s go on to explore the main characteristics
    of this algorithm.The essential element of the algorithm is using the key only
    once per session. This feature makes the algorithm invulnerable to attacks against
    the ciphertext and even in the unlikely event that the key is stolen, it would
    be changed at the time of the next transmission.The method is very simple: by
    adding the key to the message (**mod 2**) bit by bit, we will obtain the ciphertext.
    We will see this method, called **XOR**, many times throughout this book, especially
    when we discuss symmetric encryption in *Chapter 2, Introduction to Symmetric
    Encryption*. Just remember that the key has to be of the same length as the message.A
