    So, let''s start by introducing hash functions and their main scopes. Then we
    will go deeper into categorizing digital signature algorithms.


    # A basic explanation of hash functions


    Hash functions are widely used in cryptography for many applications. As we have
    already seen in *Chapter 3, Asymmetric Algorithms*, one of these applications
    is *blinding* an exchanged message when it is digitally signed. What does this
    mean? When Alice and Bob exchange a message using any asymmetric algorithm, in
    order to identify the sender, it commonly requires a signature. Generally, we
    can say that the signature is performed on the message **[M]**. For reasons we
    will learn later, it''s discouraged to sign the secret message directly, so the
    sender has to first transform the message **[M]** into a function **(M'')**, which
    everyone can see. This function is called the **hash of M**, and it will be represented
    in this chapter with these notations: **f(H)** or **h[M]**. We will focus more
    on the relations between hashes and digital signatures later on in this chapter.
    However, I have inserted hash functions in this chapter alongside digital signatures
    principally because hash functions are crucial for signing a message, even though
    we can find several applications related to hash functions outside of the scope
    of digital signatures, such as applications linked to the blockchain, like *distributed
    hash tables*. They also find utility in the search engine space. So, the first
    question we have is: what is a hash function? The answer can be found in the meaning
    of the word: hash—to *reduce into pieces*, which in this case refers to the contents
    of a message or any other information being reduced into a smaller portion. *Given
    an arbitrary-length message [M] as input, running a hash function f(H), we obtain
    an output (message digest) of a determined fixed dimension (M'')*. If you remember
    the bit expansion (*Exp-function*), seen in *Chapter 2, Introduction to Symmetric
    Encryption*, this is conceptually close to hashes. The bit expansion function
    works with a given input of bits that has to be expanded. We have the opposite
    task with hash functions, where the input dimension is bigger than the hash''s
    bit value. We call a hash function (or simply a hash) a **unidirectional function**.
    We will see later that this property'
