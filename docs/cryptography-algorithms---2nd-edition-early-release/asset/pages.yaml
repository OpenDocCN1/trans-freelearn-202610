- pgno: 71
  md: 'As I mentioned previously, one of the main weaknesses found in DES was the
    key length of 56 bits. So, to amplify the volume of keys and to extend their life,
    a new version of DES was proposed in the form of **Triple DES**. The logic behind
    3DES is the same as DES; the difference is that here we run the algorithm three
    times with three different keys. The following figure shows a scheme proposed
    to better understand 3DES:


    ![](img/2c67eb1b2bfb299c02a010d62900759c_71_0.png)


    Let''s see how the encryption and decryption stages work in DES, based on the
    scheme illustrated in the preceding figure. Encryption in 3DES works as follows:


    +   - Encrypt the plaintext blocks using single DES with the [**K₁**] key.

    +   - Now, decrypt the output of *step 1* using single DES with the [**K₂**] key.

    +   - Finally, encrypt the output of *step 2* using single DES with the [**K₃**]
    key.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'The output of *step 3* is the ciphertext (**C**).


    # Decryption in 3DES


    The decryption of ciphertext is a reverse process. The user first decrypts using
    [**K₃**], then decrypts with [**K₂**], and finally decrypts with [**K₁**].


    # DESX


    The last algorithm of the DES family is **DESX**. This is a reinforcement of DES''s
    key proposed by *Ronald Rivest* (the same coauthor of RSA). Given that DES encryption/decryption
    remains the same as earlier, there are three chosen keys: [**K₁**], [**K₂**],
    and [**K₃**]. The following encryption is performed: c = [K3] EK1 ([K2] [M]) First,
    we have to perform the encryption (**Eₖ**), making an **XOR** between [**K₂**]
    and the message, [**M**]. Then, we apply DES, encrypting with [**K₁**] 56 bits.
    Finally, we add the outputs **Eₖ₁**, **XOR**, and [**K₃**]. This method allows
    us to increase the virtual key to be **64 + 56 + 64 = 184** bits, instead of the
    normal 56 bits:'
  merge: -1
