    This kind of cryptography is particularly important in our day-to-day lives. This
    is the branch of cryptography that's deputed to cover our financial secrets, such
    as credit cards and online accounts; to generate the passwords that we use constantly
    in our lives; and, in general, to share sensitive data with others securely and
    protect our privacy. Let's learn a little bit about the history of this fascinating
    branch of cryptography. The story of asymmetric cryptography begins in the late
    1970s, but it advanced in the 1980s when the advent of the internet and the digital
    economy started to introduce computers to family homes. The late 1970s and 1980s
    was the period in which Steve Jobs founded Apple Inc. and was during the Cold
    War between the USA and the USSR. It was also a period of economic boom for many
    Western countries, such as Italy, France, and Germany. And finally, it was the
    period of the advent of the internet. The contraposition of the two blocs, Western
    and Eastern, with US allies on one side and the Soviet bloc on the other side,
    created opposing networks of spies that had their fulcrum in the divided city
    of Berlin. During this period, keys being exchanged in symmetric cryptography
    reached the point that the US Government's **Authority for Communications Security
    (COMSEC)**, which is responsible for transmitting cryptographic keys, transported
    tons of keys every day. This problematic situation degenerated to a breaking point.
    Just to give an example, with the DES algorithm in the 1970s, banks dispatched
    keys via a courier that were handed over in person. The **National Security Agency
