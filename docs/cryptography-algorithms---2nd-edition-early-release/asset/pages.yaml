- pgno: 86
  md: "+   - **Timing attack:** This is a method that exploits the time to perform\
    \ encryption based on the correlation between the timing and values of the parameters.\
    \ If an attacker knows part of the message or part of the key, they can compare\
    \ the real and modeled executed times. Essentially, it could be considered a *physical*\
    \ attack on a bad implementation of the code much more than a logical attack.\
    \ Anyway, this attack is not only referred to as AES but also RSA, D-H, and other\
    \ algorithms too, which rely on the correlation of parameters.\n+   - **Power\
    \ monitoring attack:** Just like the timing attack, there could be potential vulnerabilities\
    \ inherent to hardware implementation. You can find an interesting attack experiment\
    \ at the following link relating to the correlation of the power consumption of\
    \ an AES 128-bit implementation on Arduino Uno. The attack affected the **ARK**\
    \ and **SB** functions of this algorithm, gaining the full 16-byte cipher key\
    \ monitoring the device's power consumption. For hardware lovers, this is an exciting\
    \ attack:\n+   \n+     https://www.tandfonline.com/doi/full/10.1080/23742917.2016.1231523\n\
    +   - **Electromagnetic attack:** This is another kind of attack performed on\
    \ the implementation of the algorithm. One attack was attempted on FPGA measuring\
    \ the radiation that emanated from an antenna through an oscilloscope.\n\nFinally,\
    \ the real problem of AES is the exchanging of the key. This being a symmetric\
    \ algorithm, Alice and Bob must agree on a shared key in order to perform the\
    \ encryption and decryption required. Even if AES's few applications could be\
    \ implemented without any key exchange, most need asymmetric algorithms to make\
    \ up for the lack of key transmission. We will better understand this concept\
    \ in the next chapter when we explore asymmetric encryption. Moreover, we will\
    \ see an application that doesn't need any key exchange in *Chapter 9, Crypto\
