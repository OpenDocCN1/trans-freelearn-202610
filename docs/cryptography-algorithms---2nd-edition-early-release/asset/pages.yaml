  md: 'Bob: y1 ≡ 7^23 (mod 200003) y1 = 90914 y2 ≡ 88 * 151854^23 (mod 200003) sends
    the parameters to Bob (y1 = 90914; y2 = 161212). Bob''s **decryption**: First,
    Bob computes (Kb) by taking y1 = 90914, which is elevated to his private key,
    **b** = 2367: Kb ≡ 90914^2367 (mod 200003) Kb = 10923. Inverted Kb in (mod p)
    [Reduce[Kb**x − 1, x, Modulus -> p] (performed with Wolfram Mathematica): Inverted
    Kb ≡ 192331 (mod 200003). Finally, Bob can return the message, **[M]**. Bob takes
    (y2) and multiplies it by **[Inverted Kb]**, returning the message, [M]: y2 *
    InvKb ≡ M (mod 200003). The final result is the message **[M]**: 161212 * 192331
    ≡ 88 (mod 200003). ElGamal encryption is used in the free **GNU Privacy Guard
    (GnuPG)** software. Over the years, GnuPG has gained wide popularity and become
    the de facto standard free software for private communication and digital signatures.
    GnuPG uses the most recent version of PGP to exchange cryptographic keys. For
    more information, you can go to the web page of this software: [https://gnupg.org/software/index.xhtml](https://gnupg.org/software/index.xhtml).


    # Important Note


    As I have mentioned previously, it''s assumed that the underlying problem behind
    the ElGamal algorithm is the discrete logarithm. This is because, as we have seen,
    the public parameters and keys are all defined by equations that rely on discrete
    logarithms.


    For example, **B ≡ g^b (mod p); Y1 ≡ g^k (mod p)** and **Kb ≡ y1^b (mod p)** are
    functions related to the discrete logarithm.


    Although the discrete logarithm problem is considered to be the main problem in
    ElGamal, we also have the factorization problem, as shown here. Let''s go back
    to the encryption function, **(y2)**: y2 ≡ M*B^k (mod p). Here, you can see that
    there is multiplication. So, an attacker could also try to arrive at the message
    by factorizing **(y2)**. This will be clearer if we reduce the function: H ≡ B^k
    (mod p). Then, we have the following: y2 ≡ M* H (mod p). This can be rewritten
    like so: M ≡ y2/H (mod p). As you can see, (y2) is the product of **[M*H]**. If
    someone can find the factors of **(y2)**, they can probably find **[M]**.'
