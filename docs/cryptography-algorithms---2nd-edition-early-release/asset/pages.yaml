  md: '# Description of AES


    Discussing AES would alone require a dedicated chapter. In this section, I provide
    an overview of the algorithm. For those of you interested in knowing more, you
    can refer to the documentation presented by NIST (published on November 26, 2001)
    reported in the document titled *FIPS PUB 197*. I am limited in this chapter to
    describing the algorithm at just a high level and will give my comments and suggestions.
    Most importantly, to avoid any confusion, I will analyze AES in a different manner
