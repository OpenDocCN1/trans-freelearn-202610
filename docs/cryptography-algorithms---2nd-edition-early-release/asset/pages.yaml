    The **AND** operator transposed in mathematics is a multiplication of (**X * Y**).
    The following is a representation of the *truth table* for all the logic combinations
    of the two elements. As you can see, only when **X * Y = 1** does it mean that
    the condition of conjunction (**X^Y**) is satisfied:


    # Figure 2.2 – Mathematical table for "AND"


    +   - **OR (disjunction)**: Denoted by the symbol (**X V Y**). This condition
    is satisfied when at least one of the elements of **X** or **Y** is true. So,
    we are dealing with a proposition such as **pear OR apple**. Our example of searching
    in a database will select all the elements containing at least one of the two
    words (**pear** or **apple**).


