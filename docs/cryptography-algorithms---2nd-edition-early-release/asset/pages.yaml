- pgno: 153
  md: 'the door in the middle of the cave is locked through a secret electronic combination
    that''s strong enough to prevent the entry of anyone who doesn''t know the secret
    combination. Now, suppose that Peggy must prove to Victor that she knows the combination
    to unlock the door without revealing the numbers to him. So then, the challenge
    for Peggy is *not* to reveal the combination of the door to Victor, because Peggy
    is not sure whether Victor knows it and she doesn''t want to give Victor any information
    about the combination. She just needs to demonstrate to Victor that she can exit
    from the opposite side of the cave. Expressed differently, ZKP is a challenge
    where the answer is not revealing the exact information required, but simply proving
