  md: 'glance, the answer could be that most elliptic curves are not vulnerable (if
    well implemented) to most traditional attacks, except for the same ones we find
    against the classic discrete logarithm (such as Pollard Rho or a birthday attack)
    and man-in-the-middle attacks in D–H ECC. In the quantum case, however, Shor''s
    algorithm can probably solve the elliptic curve problem, as we will see in the
    next chapter, dedicated to quantum cryptography. Thus, if someone asks: are my
    Bitcoins secured for the next 10 or 20 years? We can answer: under determinate
    conditions, yes, but if the beginning of the quantum-computing era generates enough
    qubits to break the classical discrete logarithm problem, it will probably break
    the ECC discrete logarithm problem in polynomial time too. So, I agree with Jeremy
    Wohlwend (a Ph.D. candidate at MIT), who wrote about *Elliptic Curve Cryptography:
    Pre and Post Quantum:* "Sadly, the day that quantum computers can work with a
    practical number of qubits will mark the end of ECC as we know it."


    # Summary


    In this chapter, we have analyzed some of the most used elliptic curves. We have
    seen what an elliptic curve is and how it is designed to be used in cryptography.
    ECC has algorithms and protocols designed mainly to cover secrets related to public/private
    encryption systems, such as the D–H key exchange and the digital signature. In
    particular, we analyzed the discrete logarithm problem transposed into ECC, so
    we have familiarized ourselves with the operations at the core of ECC, such as
    adding points on the curve and scalar multiplications. These kinds of operations
    are quite different from the addition and multiplication we are familiar with;
    here, indeed, lies the strength of elliptic curves. After the experimentation
    done on D–H ECC, we analyzed in detail secp256k1, which is the elliptic curve
    used to implement digital signatures on Bitcoin protocol through the ECDSA. So,
    now that you have learned about elliptic curves and systems as alternative methods
    in public/private encryption, you can understand that one of the best properties
    of these curves is the grade of efficiency in their implementation, which can
    be a lower key size. At the end of this chapter, we asked a question about ECC''s
    robustness regarding quantum attacks. It was with this answer that I introduced
