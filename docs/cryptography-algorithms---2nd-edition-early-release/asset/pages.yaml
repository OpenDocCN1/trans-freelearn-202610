    note the following:


    +   - Cryptography has to be open source (the algorithms have to be known), except
    for the key.

    +   - The security of an algorithm depends largely on its underlying mathematical
    problem.

    +   - Complexity is the enemy of security.

    +   - Security is a dynamic concept: perfect security is only a theoretical issue.


