    # The pioneers


    Cryptographers can often appear to be strange people; sometimes, they could be
    introverts, sometimes extroverts. This is the case with *Whitfield Diffie*, an
    independent freethinker, not employed by the government or any of the big corporations.
    I met Diffie for the first time at a convention in San Francisco in 2016 while
    he was discussing cryptography with his famous colleagues, *Martin Hellmann* and
    *Ronald Rives*. One of the most impressive things that remained fixed in my mind
    was his elegant white attire, counterposed by his tall stature and long white
    hair and beard. Similar to an ever-young guy still in the 1960s, someone whose
    contemporary could be an agent at the Wall Street Stock Exchange or a holy man
    in India. He is one of the fathers of modern cryptography, and his name will be
    forever imprinted in the history of public/private key encryption. Diffie was
    born in 1944 and graduated from MIT in Boston in 1965. After his graduation, he
    was employed in the field of cybersecurity and later became one of the most authentic
    independent cryptographers of the 1970s. He has been described as *cyberpunk*,
    in honor of the *new wave* science fiction movement of the 1960s and 1970s, where
    cybernetics, artificial intelligence, and hacker culture combined into a dystopian
    futuristic setting that tended to focus on a *combination of low life and high
    tech.* Back in the 1960s, the US Department of Defense began funding a new advanced
    program of research in the field of communication called **Defense Advanced Research
    Projects Agency (DARPA)**, also called **ARPA**. The main ARPA project was to
    connect military computers to create a more resilient grade of security in telecommunications.
    The project intended to prevent a blackout of communications in the event of a
    nuclear attack, but also, the network allowed dispatches and information to be
    sent between scientists, as well as calculations that had been performed, to exploit
    the spare capacity of the connected computers. **ARPANET** started officially
    in 1969 with the connection of only four sites and grew quickly so much that in
    1982, the project spawned the internet. At the end of the 1980s, many regular
    users were connected to the internet, and thereafter their number'
