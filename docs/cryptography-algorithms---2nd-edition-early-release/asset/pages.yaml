- pgno: 151
  md: 'digital secrets they could about the participants. If a hacker knows your identity,
    they can easily find out about most of your digital life.In another case, you
    might have read a news story where a gang of thieves planted a fake ATM in a commercial
    center. Each time a person inserted a card and entered their PIN, a computer recorded
    this information and the ATM refused the operation. Once the information had been
    collected from the cards and the PINs stolen, the hackers could then clone the
    cards, reproducing them along with their PINs, and subsequently be able to withdraw
    money at an actual ATM.How is it possible to block this kind of scam? There are
    many situations in which sensitive information, such as passwords and other private
    information, is required. If a hacker obtains this information linked to a person
    or a machine, they can easily steal identities and wreak havoc for their victims.One
    way to solve these kinds of problems is by not revealing any sensitive information,
    such as: Name, Surname, address, social security number, PIN , but this is not
    always possible. Another way is to avoid exposing private information by giving
    a *proof of knowledge*. A proof of knowledge is essentially a way to bypass to
    give more information than necessary or identify yourself not exposing your personal
    data. These cryptographic protocols are called **Zero-Knowledge Protocols (ZKPs)**,
    which we are going to study in this chapter.In this chapter, we are going to cover
    the following topics:


    +   - Mainframe and logic of Zero-Knowledge Protocols

    +   - Non-interactive and interactive ZKPs (the Schnorr protocol) with examples
    and possible attacks on them

    +   - SNARK protocols and Zcash in a nutshell

    +   - One-round ZKPs

    +   - A new Protocol by the Author: ZK13 and the zero-authentication protocol


    Now that you have been introduced to the world of ZKPs and know what they are
    used for, it''s time to go deeper to analyze the main scenarios and protocols
    used in cryptography.


    # The main scenario of a ZKP – the digital cave


    Imagine this fantastic scenario: Peggy has to demonstrate to Victor that she is'
