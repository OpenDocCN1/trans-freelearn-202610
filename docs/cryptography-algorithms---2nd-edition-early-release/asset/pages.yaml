    **n**. To calculate the public key (**Q**), starting from the private key, **[d]**,
    in secp256k1, we have to use the following equation: `Q ≡ [d] * G (mod p)` The
    result of the equation will be **Q** (the public key). After this operation, we
    can switch to calculating the digital signature. Suppose that Alice is the sender
