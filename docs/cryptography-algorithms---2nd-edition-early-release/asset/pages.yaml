- pgno: 11
  md: '# Figure 1.1 – Encryption process


    To get some utility from a cipher, we have to set up two operations: encryption
    and decryption. In simpler terms, we have to keep the message secret and safe
    for a certain period of time. We define **M** as the set of all the messages and
    **C** as the set of all the cryptograms. **Encryption** is an operation that transforms
    a generic message, **m**, into a cryptogram, **c**, applying a function, **E**:
    m -------- > f(E) -------- > c. **Decryption** is an operation that returns the
    message in cleartext, **m**, from the cryptogram, **c**, applying a function,
    **D**: c -------- > f(D) -------- > m. Mathematically, **D(E(M)) = M**. This means
    that the **E** and **D** functions are the inverse of each other, and the **E**
    function has to be injective. **Injective** means different **M** values have
    to correspond to different **C** values. Note that it doesn''t matter whether
    I use capital letters or lowercase, such as (**M**) or (**m**); it''s inconsequential
    at the moment. For the moment, I have used round brackets indiscriminately, but
    later I will use square brackets to distinguish secret elements of a function
    from known ones, for which I will use square brackets. So, the secret message
    **M** will be written as **[M]**, just like any other secret parameter. Here,
    just showing how the algorithms work is within our scope; we''ll leave their implementation
    to engineers. There is another important notation that is key to encryption/decryption.
    To encrypt and decrypt a message, it is necessary to set up a key. In cryptography,
    a key is a parameter that determines the functional output of a cryptographic
    algorithm or cipher. Without a key, the algorithm would produce no useful results.
    We define **K** as the set of all the keys used to encrypt and decrypt **M**,
    and **k** as the single encryption or decryption key, also called the session
    key. However, these two ways to define a key (a set of keys is **K** and a single
    key is **k**) will always be used, specifying what kind of key it is (private
    or public). Now that we understand the main concepts of cryptographic notation,
    it is time to explain the difference between private and public keys:


    +   - In cryptography, a private or secret key (**Kpr**), denoted as **[K]** or
    **[k]**, is an encryption/decryption parameter known only to one, both, or multiple
    parties in order to exchange secret messages.

    +   - In cryptography, a public key (**Kpu**) or (**K**) is an encryption key
    known by everyone who wants to send a secret message or authenticate a user.'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'So, what is the main difference between private and public keys?The difference
    is that a private key is used both to encrypt and/or decrypt a message, while
    a public key is used only to encrypt a message and verify the identity (digital
    signatures) of humans and computers. This is a substantial and very important
    issue because it determines the difference between symmetric and asymmetric encryption.
    Let''s give a generic definition of these two methods of encryption:


    +   - **Symmetric encryption** uses only one shared key to both encrypt and decrypt
    the message.

    +   - **Asymmetric encryption** implements more parameters to generate a public
    key (to encrypt the message) and just one private key to decrypt the message.


    As we will see later on, private keys are used in symmetric encryption to encrypt/decrypt
    the message with the same key and in asymmetric encryption in a general way for
    decryption, whereas public keys are used only in asymmetric encryption to encrypt
    the message and to perform digital signatures. You will see the function of these
    two types of keys later, but for now, keep in mind that a private key is used
    both in symmetric and asymmetric encryption, while a public key is used only for
    asymmetric encryption. Note that it''s not my intention to discuss academic definitions
    and notation, so please try to figure out the scope and the use of each element.One
    of the main problems in cryptography is the transmission of the key, or the key
    exchange. This problem resulted in strong diatribes in the community of mathematicians
    and cryptographers because it was very hard to determine how to transmit a key
    while avoiding physically exchanging it. For example, if Alice and Bob wanted
    to exchange a key (before the advent of asymmetric encryption), the only trusted
    way to do that was to meet physically in one place. This condition caused a lot
    of problems with the massive adoption of telecommunication systems and the internet.
    The first problem was that internet communication relies on data exchange over
    unsafe channels. As you can easily understand, if Alice communicates with Bob
    through an insecure public communication channel, the private key has a severe
    possibility of being compromised, which is extremely dangerous for the security
    and privacy of communications.For this reason, this question arises: if we use
    a symmetric cipher to protect our secret information, how'
  merge: -1
  img_proc: true
- pgno: 13
  md: '*can we securely exchange the secret key?* A simple answer is the following:
    we have to provide a *secure channel* of communication to exchange the key. Someone
    could then reply: *how do we provide a secure channel?* We will find the answer,
    or rather multiple answers, later on in this book. Even in tough military applications,
    such as the legendary *red line* between the leaders of the US and USSR during
    the Cold War, symmetric communication keys were used; nowadays, it is common to
    use asymmetric encryption to exchange a key. Once the key has been exchanged,
    the next communication session is combined with symmetric encryption to encrypt
    the messages transmitted. For many reasons, asymmetric encryption is a good way
    to exchange a key and is good for authentication and digital signatures. Computationally,
    symmetric encryption is better because it can work with lower bit-length keys,
    saving a lot of bandwidth and timing. So, in general, its algorithms work efficiently
    for security using keys of 256-512 bits compared to the 4,000+ bits of asymmetric
    RSA encryption, for example. I will explain in detail why and how that is possible
    later during the analysis of the algorithms in asymmetric/symmetric encryption.
    While in this book I will analyze many kinds of cryptographic techniques, essentially,
    we can group all the algorithms into two big families: symmetric and asymmetric
    encryption. We need some more definitions to understand cryptography well:


    +   - **Plaintext**: In cryptography, this indicates unencrypted text, or everything
    that could be exposed in public. For example, **(meet you tomorrow at 10 am)**
    is plaintext.

    +   - **Ciphertext**: In cryptography, this indicates the result of the text after
    having performed the encryption procedure. For example, **meet you tomorrow at
    10 am** could become **[x549559*ehebicbm3494]** in ciphertext.


    As I mentioned before, I use different brackets to identify plaintext and ciphertext.
    In particular, these brackets (...) identify plaintext, while square brackets
    [...] identify ciphertext.


