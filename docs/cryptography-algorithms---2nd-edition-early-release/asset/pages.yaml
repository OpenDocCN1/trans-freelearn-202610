  md: 'of being one-way is essential in classifying hash functions. Being a unidirectional
    or one-way function means that it is easy to calculate the result in one direction,
    but very difficult (if not impossible) to get back to the original message from
    the output of the function.Let''s see the properties verified in a hash function:


    +   - Given an input message [M], its digest message h(M) can be calculated very
    quickly.

    +   - It should be almost impossible (-%) to come back from the output (M'') calculated
    through h(M) to the original message [M].

    +   - It should be computationally intractable to find two different input messages
    [m1] and [m2], such that:


    h(m1) = h(m2) In this case, we can say that the f(h) function is strongly collision-free.To
    provide an example of a hash function, if we want the message digest of the entire
    content of Wikipedia, it becomes a fixed-length bit as follows:


    1010101010010000001000010100101101011011111010101001010 101010100......


    (a very long message: British Encyclopedia encoded)


    ![](img/2c67eb1b2bfb299c02a010d62900759c_119_0.png)


    [0101010101010011011111001010]


    (Digest message of 160-bit)


    Figure 4.1 – Example of hash digest


    Another excellent metaphor for hash functions could be a funnel mincer like the
