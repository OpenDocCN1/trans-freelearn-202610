  md: 'Can you recognize the differences between this representation and the *checksum*
    in R1CS? In both cases, if the logic gate is equal to zero, the result given by
    the dot (.) product of the checks passes; if at least one of the (**x**) coordinates
    gives a non-zero result, this means that the values going into and out of that
    logic gate are inconsistent. But at this point, there could be a problem: if someone
    knows in advance which point the verifier chooses to check the validity, they
    can generate an invalid polynomial, but it could still satisfy that point. Essentially,
    this is a dangerous step and could be vulnerable to attacks. To overcome this
    problem, Zcash applied sophisticated techniques to zk-SNARKs in order to evaluate
    the polynomials *blindly*. These mathematical techniques used in Zcash, such as
    homomorphic encryption and pairings of elliptic curves, help to blind the operations
    but increase complexity. We will look at these issues in the next section, but
    now we will finish discussing the entire process of zk-SNARKs in Zcash. As I said
    at the beginning of the Zcash explanation, the goal of the protocol is to determine
    whether a statement (in this case, a transaction) is true or false, thereby preventing
    the *double-spending* problem.


    # Conclusions and the weaknesses of zk-SNARKs in Zcash


    As we saw in the previous section, one of the weak points of this protocol can
    be found in QAP. As I have explained, Zcash has tried to overcome this problem
    using homomorphic evaluation, in other words, keeping the polynomials *in blind*.
    The issue is that homomorphic encryption usually causes bit-overflow; moreover,
    the protocols and schemes required to achieve fully homomorphic encryption are
    very complex. As you already know, my theory is that *in cryptography, complexity
    is the enemy of security*. I won''t enter this debate now because it''s not within
    the scope of the book to analyze the entire protocol of Zcash. Imagine the scenario
    discussed in the *Non-interactive ZKPs* section based on the RSA problem. If I
    have to demonstrate to an expert that I hold the formula for an atomic bomb, then
    the experts will probably ask me to show something more than a hash function of
    the document, [**m**], that states the proof. The verifier will be convinced only
    when they get substantial proof. In other words, ZKPs are limited in the amount
    of evidence of knowledge they are able to provide.'
