  md: 'exploded. While ARPANET was growing, Diffie started to think that one day,
    everyone would have a computer, and with it, exchange emails with each other.
    He also imagined a world where products could be sold via the internet and real
    money was abandoned in favor of credit cards. His great consideration of privacy
    and data security led to Diffie being obsessed with the problem of how to communicate
    with others without having any idea who was at the opposite end of the cable.
    Moreover, encrypting messages and documents is often done when sending highly
    valuable information; data encryption was starting to be used by the general public
    to hide information and share secrets with others. This was the time when the
    usage of cryptography became common, and it was not just for the military, governments,
    or academics. The main issue to solve was that if two perfect strangers meet each
    other via the internet, how would it be possible to encrypt/decrypt a shared document
    without exchanging any additional information except for the document itself,
    which is encrypted/decrypted through mathematical parameters? This is the key
    exchange problem in a nutshell. One day in 1974, Diffie went to visit IBM''s *Thomas
    Watson* laboratory, where he was invited to give a speech. He spoke about various
    strategies for attacking the key distribution problem but the people in the room
    were very skeptical about his solution. Only one shared his vision: he was a senior
    cryptographer for IBM who mentioned that a Stanford professor had recently visited
    the laboratory and had a similar vision about the problem. This man was Martin
    Hellman. Diffie was so enthusiastic that the same evening, he drove to the opposite
    side of America to Palo Alto, California to visit Professor Hellman. The collaboration
    between Diffie and Hellman will remain famous in cryptography for the creation
    of one of the most beautiful algorithms in the field: the **Diffie-Hellman key
    exchange**. We''ll analyze this pioneering algorithm in the next section.


