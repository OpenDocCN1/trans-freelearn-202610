    number to indicate the column (the same as previously, just with fewer bits).
    So, 0 stands for first and 1 stands for second. Similarly, 000 stands for the
    first column, 001 stands for the second column, and so on until 111. We call the
    two S-Boxes S1 and S2. The following figure represents the elements of each one:


