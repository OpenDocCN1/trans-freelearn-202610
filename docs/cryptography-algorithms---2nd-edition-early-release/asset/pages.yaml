    I will leave the answer to this for *Chapter 6, New Algorithms in Public/Private
    Key Cryptography*. Now, let''s explore another protocol based on the RSA implementation
    that has become a popular piece of software: PGP.


    # PGP


    **Pretty Good Privacy (PGP)** is probably the most used cryptographic software
    in the world. PGP was implemented by Philip Zimmermann during the Cold War. Philip
    started planning to take his family to New Zealand because he believed that, in
    the event of a nuclear attack, the country, so isolated from the rest of the world,
    would be less impacted by atomic devastation. At some point, while planning to
    move to New Zealand, something changed his mind and he decided to remain in the
    US. To communicate with his friends, Zimmermann, who was an anti-nuclear activist,
    developed PGP to secure messages and files transmitted via the internet. He released
    the software as open source, free of charge for non-commercial use. At the time,
    cryptosystems larger than 40 bits were considered to be like munitions. That is
    to say that cryptography is still considered a military weapon. There is a requirement
    that you must obtain if you decide to patent a new cryptosystem, you must have
    authorization from the Department of Defense to publish it. This was a problem
    that was encountered by PGP, which never used keys smaller than 128 bits. Penalties
    and criminal prosecutions for violating this legal requirement are very severe,
    which is why Zimmermann had a *pending legal status* for many years until'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'the American government decided to close the investigation and clear him.PGP
    is not a proper algorithm, but a protocol. The innovation here is just to merge
    asymmetric with symmetric encryption. The protocol uses an asymmetric encryption
    algorithm to exchange the key, and symmetric encryption to encrypt the message
    and obtain the ciphertext. Moreover, a digital signature is required to identify
    the user and avoid a MiM attack.The following are the steps of the protocol:


    +   - **Step 1:** The key is transmitted using an asymmetric encryption algorithm
    (ElGamal, RSA).

    +   - **Step 2:** The key that''s been transmitted with asymmetric encryption
    becomes the session key for the symmetric encryption (DES (remember that we have
    seen that is breackble now), Triple DES, IDEA, and AES – we covered this in *Chapter
    2, Introduction to Symmetric Encryption*).

    +   - **Step 3:** A digital signature is used to identify the users (we will look
