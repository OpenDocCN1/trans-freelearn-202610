  md: '# Explanation of the SHA-1 algorithm


    **Secure Hash Algorithm 1 (SHA-1)** was designed by the NSA. Since 2005, it has
    been considered insecure and was replaced by its successors, SHA-2 and SHA-3.
    In this section, we will examine SHA-1 simply as a case study to better understand
    how hash functions are implemented. SHA-1 returns a 160-bit output based on an
    iterative procedure. This concept will become clearer in the next few lines. As
    for other hash functions, the message **[m]** made of variable bit input, is broken
    into 512-bit fixed-length blocks: **m= [m1,m2,m3,....mI]**. In the last part of
    this section, you will see how an input message **[m]** of 2,800 bits will be
    transformed into blocks **[m1,m2,.....mI]** of 512 bits each. The blocks are elaborated
    through a compression function **f(H)** (it will be better analyzed later in *Step
    3* of the algorithm) that combines the current block with the result obtained
    in the previous round. There are four rounds and they correspond to the variable
    **(t)**, whose range is divided into four t-rounds as shown in *Figure 4.12*,
    each one made of 20 steps (for a total of 80 steps). Each iteration can be seen
    as a counter that runs along the values of each range made of 20 values. As you
    can see from *Figures 4.12 and 4.13*, each iteration uses the constants **(Kt)**
    and the operations **ft (B,C,D)** of the corresponding round. Each round updates
    the sub-registers (A,B,C,D,E) after the other. At the end of the 4th round, when
    t = 79, the sub-registers (A,B,C,D,E) are added to the sub-registers (H0, H1,
    H2, H3, H4) to perform the 160 bits final hash value. Let''s now examine the issue
    of constants in SHA-1. Constants are fixed numbers expressed in hexadecimal defined
    with particular criteria. An important criterion adopted to choose the constants
    in SHA is to avoid collisions. Collisions happen when a hash function gives the
    same result for two different blocks starting from different constants. So, even
    though someone might think it would be a good idea to change the values of the
    constants, don''t try to change them because that could cause a collision problem.
    In SHA-1, for example, the given constants are as follows:'
  merge: -1
  img_proc: true
- pgno: 130
