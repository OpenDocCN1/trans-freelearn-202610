    6ED9EBA1 if 20 ≤ t ≥ 39

    8F1BBCDC if 40 ≤ t ≥ 59

    CA62C1D6 if 60 ≤ t ≥ 79 }


    Figure 4.12 – The Kt constants in SHA-1


    Where, in different ranges of (t), different values correspond with the constants
    (Kt), as you see in the preceding figure. Besides the constants, we have the function
    ft (B,C,D) defined as follows:


    fₜ (B, C, D) = { (B ∧ C) ∨ ((¬B) ∧ D) if 0 ≤ t ≥ 19

    B ⊕ C ⊕ D if 20 ≤ t ≥ 39

    (B ∧ C) ∨ (B ∧ D) ∨ (C ∧ D) if 40 ≤ t ≥ 59

    B ⊕ C ⊕ D if 60 ≤ t ≥ 79 }


    Figure 4.13 – The ft function


    The first initial register of SHA-1 is X0, a 160-bit hash function generated by
    five sub-registers (H0, H1, H2, H3, H4) consisting of 32 bits each. We will see
    the initialization of these sub-registers in Step 2 using constants expressed
    in hexadecimal numbers. Now let''s explain the SHA-1 algorithm by dividing the
    process into four steps to obtain the final hash value of 160 bits:


    +   - Step 1 – Starting with a message [m], operate a concatenation of bits such
    that:


    y= m1 || m2 || m3 || ... ||mL Where the || symbol stands for the concatenation
