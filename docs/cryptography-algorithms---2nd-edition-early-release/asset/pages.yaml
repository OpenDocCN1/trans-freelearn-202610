    # Notes on security and computation


    All the algorithms we have seen in this chapter are symmetric. The basic problem
    that remains unsolved is the transmission of the key. As I''ve already said, this
    problem will be overcome by the asymmetric cryptography that we will explore in
    the next chapter. In this section, we will analyze the computational problem related
    to the security of cryptographic algorithms generally speaking. Later in the book,
    we will focus on the security of any algorithm we will analyze. To make a similitude,
    we can say that in cryptography the weak link of the chain destroys the entire
    chain. That is the same problem as using a very strong cryptographic algorithm
    to protect the data but leaving its password on the computer screen. In other
    words, a cryptographic algorithm has to be made of a similar grade of security
    with respect to mathematical problems. To clarify this concept with an example:
    factorization and discrete logarithm problems hold similar computational characteristics
    for now; however, if tomorrow one of these problems were solved, then an algorithm
    that is based on both would be unuseful. Let''s go deeper to analyze some of the
    principles universally recognized in cryptography. The first statement is *Cryptography
    has to be open source.* With the term *open source*, I am referring to the algorithm
    and not, obviously, to the key. In other words, we have to rely on **Kerckhoffs''
    principle**, which states the following: "*A cryptosystem should be secure even
    if everything about the system, except the key, is public knowledge. Kerckhoffs''
    principle applies beyond codes and ciphers to security systems in general: every
    secret creates a potential failure point. Secrecy, in other words, is a prime
    cause of brittleness—and therefore something likely to make a system prone to
    catastrophic collapse. Conversely, openness provides ductility.*" – Bruce Schneier
    In practice, the algorithm that underlies the encryption code has to be known.
    It''s not useful and is also dangerous to rely on the secrecy of the algorithm
    in order to exchange secret messages. The reason is that, essentially, if an algorithm
    has to be used by an open community (just like the internet), it is impossible
    to keep it secret. The second statement is *The security of an algorithm depends
    largely on its'
