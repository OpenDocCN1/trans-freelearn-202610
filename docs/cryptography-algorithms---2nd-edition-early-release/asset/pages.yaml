    final permutation.Now that we have analyzed the encryption process, we can move
    on to DES decryption analysis.


    # Decryption


    DES decryption is very easy to understand. Indeed, to get back the plaintext,
    we perform an inverse process of encryption.The decryption is performed in exactly
    the same manner as encryption, but by inverting the order of the keys (K₁…K₁₆)
    so that it becomes (K₁₆…K₁).In the following figure, you see the decryption process
