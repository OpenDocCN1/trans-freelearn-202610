- pgno: 16
  md: 'explaining **Fermat''s Last Theorem**, I want to introduce some basic notation
    that will be used throughout the book to prevent confusion and for a better understanding
    of the topic. It''s important to know that some symbols, such as =, ≡ (equivalent),
    and := (this last one you can find in Mathematica to compute =), will be used
    by me interchangeably. It''s just a way to tell you that two elements correspond
    to each other in equal measure; it doesn''t matter whether it is in a finite field
    (don''t worry, you will become familiar with this terminology), computer science,
    or in regular algebra. Mathematicians may be horrified by this, but I trust your
    intelligence and that you will look for the substance and not for the uniformity.
    Another symbol, ≈ (approximate), can be used to denote similar approximative elements.
    You will also encounter the ^ (exponent) symbol in cases such as in a classical
    way to express exponentiation: a^x (**a** elevated to **x**), for example. The
    ≠ symbol, as you should remember from high school, means **not equal** or **unequal**,
    which is the same as the meaning of =, that is, not equivalent. However, you will
    always get an explanation of the equations, so if you are not very familiar with
    mathematical and logical notation, you can rely on the descriptions. Anyway, I
    will explain each case as we come across new notation. A prime number is an integer
    that can only be divided by itself and 1, for example, 2, 3, 5, 7....23....67.....p.
    Prime numbers are the cornerstones of mathematics because all other composite
    numbers originate from them. Now, let''s see what Fermat''s Last Theorem is, where
    it is applied, and why it is useful for us. Fermat''s Last Theorem is one of the
    best and most beautiful theorems of classical mathematics strictly related to
    prime numbers. According to Wikipedia, "In number theory, Fermat''s Last Theorem
    (sometimes called Fermat''s conjecture, especially in older texts) states that
    no three positive integers a, b, and c satisfy the equation a^n + b^n = c^n for
    any integer value of n greater than 2. The cases n = 1 and n = 2 have been known
    since antiquity to have infinitely many solutions." In other words, it tells us
    that given the following equation, for any exponent, **n>3**, ≥ 3 there is no
    integer, **a**, **b**, or **c**, that verifies the sum: a^n+b^n = c^n Why is this
    theorem so important for us? Firstly, it''s because Fermat''s Last Theorem is
    strictly related to prime numbers. In fact, given the properties of primes, in
    order to demonstrate Fermat''s Last Theorem, it''s sufficient to demonstrate the
    following: a^p+b^p ≠ c^p Here, **p** is any prime number greater than 2. Fermat
    stated he had *a proof that was too large to fit in the margin of his notes.*
    Fermat himself noted in a paper that he had a beautiful demonstration'
