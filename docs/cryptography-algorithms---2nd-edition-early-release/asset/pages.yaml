    go on to explore the final steps of the sequence. This protocol offers a probabilistic
    solution by performing a multiplication of polynomials. If the two polynomials
    match at a random point, we can be confident that the chosen point verifies the
    proof correctly. The reason for this transformation is that instead of checking
    the constraints individually, as in R1CS, we can now check all the constraints
