  md: 'plaintext is first divided into blocks. Because each block is encrypted separately,
    we are supposed to analyze only one block. The key, [K], is made up of 9 bits
    and the message, [M], is made up of 12 bits. The main part of the algorithm, just
    like in DES, is the S-Box, where S stands for Substitution. Here lies the true
    complexity and non-linear function of symmetric algorithms. The rest of the algorithm
    is only permutations and shifts over the bits, something that a normal computer
    can do automatically, so there is no reason to go crazy over it. An S-Box in this
    case is a 4X16 matrix consisting of 6 bits as input and 4 bits as output. We will
    find that the S-Box is present in all modern symmetric encryption algorithms,
    such as DES, Triple DES, Bluefish, Blowfish and AES. The four rows are represented
    by progressive 2 bits, as follows: 00011011 The 16 lines of the columns instead
    consist of 4 bits in this sequence: 0000 0001 0010 ..... ..... ..... ..... 1111
    The matrix''s boxes consist of random numbers between 0 and 15, which means they
    never get repeated inside the same row. In order to better understand how S-Box
    is implemented and how it works, here is an example: 011011. This string of bits
    has two outer bits, 01, and four middle bits, 1101. In this case (working in the
    binary system, using the N2 notation), (01)₂ corresponds to the second row, and
    (1101)₂ corresponds to the 13th column. By finding the intersection of the column
    and the row, we obtain (1001)₂. You can see the representation in binary numbers
    of the S-Box matrix described here:


    ![](img/2c67eb1b2bfb299c02a010d62900759c_50_0.png)


