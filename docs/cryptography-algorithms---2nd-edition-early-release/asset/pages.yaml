- pgno: 133
  md: '# Notes and example on SHA-1


    In this section, we will analyze the SHA-1 algorithm in a little more detail.
    Since Steps 1 and 2 are just message initialization and sub-register initialization,
    the algorithm''s core is in Step 3, where you can see a series of mathematical
    operations consisting of bit concatenation, XOR, bit shift, bit transposition,
    and bit addition. Finally, Step 4 reduces the output to 160 bits just because
    each sub-register H0, H1, H2, H3, and H4 is 32 bits. In Step 1, we mentioned that
    the minimum block message provided in the input has to be 512 bits. The message
    [m] could be divided into blocks of 512 bits, and if the original message is shorter
    than 512 bits, we have to apply a padding operation, involving the addition of
    bits to complete the block. SHA-1 is used to compute a message digest of 160-bit
    length for an arbitrary message that is provided as input. The input message is
    a bit string, so the length of the message is the number of bits that make up
    the message (that is, an empty message has length 0). If the number of bits in
    a message is a multiple of 8 (a byte), for compactness, we can represent the message
    in hexadecimal. Conversely, if the message is not a multiple of a byte, then we
    have to apply padding. The purpose of the padding is to make the total length
    of a padded message a multiple of 512. As SHA-1 sequentially processes blocks
    of 512 bits when computing the message digest, the trick to getting a strong message
    digest is that the hash function has to provide the best grade of confusion/diffusion
    on the bits involved in the iterative operations. The process of padding consists
    of the following sequence of passages:


    +   - SHA-1 starts by taking the original message and appends 1 bit followed by
    a sequence of 0 bits.

    +   - The 0 bits are added to ensure that the length of the new message is a multiple
    of 512 bits.

    +   - For this scope, the new message will have a final length of n*512.


    For example, if the original message has a length of 2800 bits, it will be padded
    with 1 bit at the end followed by 207 bits. So, we will have 2800 + 1 + 207 =
    3008 bits. Then to make the result of the padding a multiple of 512, using the
    division algorithm, notice that 3008 = 5 * 512 + 448, so to get to a multiple
    of 512, we pad the message with 64 zeros. So, we finally obtain 3008 + 64 = 3072,
    which is the number of bits of the padded message,'
  merge: -1
  img_proc: true
