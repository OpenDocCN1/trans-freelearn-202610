    \ 9 章，Crypto Search Engine* 将解释 CSE，该系统采用 AES 作为在云中传输加密文件的一种算法。现在你已经了解了对称加密的基础知识，是时候分析非对称加密了。\n\
    \n## 3 Asymmetric Encryption\n\n### Join our book community on Discord\n\nhttps://packt.link/SecNet\n\
    \n![](img/2c67eb1b2bfb299c02a010d62900759c_89_0.png)\n\n非对称加密意味着使用不同的密钥对来加密和解密消息。非对称加密的同义词是公钥/私钥加密，但在非对称加密和公钥/私钥加密之间存在一些差异，我们将在本章中发现这些差异。从这种革命性加密/解密方法的历史略说起，我们将了解不同类型的非对称算法以及它们如何帮助保护我们的信用卡、身份和数据。本章将涵盖以下主题：\n\
    \n- 公钥/私钥与非对称加密\n- Diffie-Hellman 密钥交换及相关的中间人问题\n- RSA 和一个针对国际威胁的有趣应用\n- 对 RSA\
    \ 的常规和非常规攻击的介绍\n- **Pretty Good Privacy (PGP)**\n- ElGamal 及其可能存在的漏洞\n\n让我们开始吧！\n\
    \n### Introduction to asymmetric encryption\n\n私钥/公钥加密最重要的功能是在两个参与方之间交换密钥，同时提供安全的信息交易。要充分理解非对称加密，我们必须了解其背景。这种密码学在我们的日常生活中尤为重要。这是负责保护我们财务秘密的密码学分支，例如信用卡和在线账户；生成我们在生活中不断使用的密码；以及通常安全地与他人共享敏感数据并保护我们的隐私。让我们了解一下这个迷人密码学分支的历史。非对称密码学的故事始于\
    \ 20 世纪 70 年代末，但在 20 世纪 80 年代，随着互联网和数字经济的兴起，计算机开始进入家庭而得到发展。20 世纪 70 年代末至 80 年代是史蒂夫·乔布斯创立苹果公司的时期，也是美国与苏联冷战时期。这也是意大利、法国和德国等许多西方国家经济繁荣的时期。最后，也是互联网诞生的时期。西方集团与东方集团的对立，美国盟友一方，苏联集团另一方，在分裂的柏林城市中形成了对立的间谍网络。在此期间，对称密码学中交换的密钥达到了美国政府的\
    \ **通信安全局 (COMSEC)** 负责传输密码密钥，每天运输大量密钥的地步，该局负责传输密码密钥。这种问题情况恶化到了崩溃的边缘。仅举一个例子，在\
    \ 20 世纪 70 年代的 DES 算法中，银行通过快递员派遣密钥并当面交接。美国的 **国家安全局 (NSA)** 在拥有全球最强大的计算资源的情况下，也在密钥分发问题上苦苦挣扎。密钥分发问题似乎无解，即使对于致力于解决与世界未来相关最困难问题的\
    \ RAND 等大型公司也是如此——RAND 是另一家旨在管理未来问题和防止崩溃性故障的强大机构。我认为，有时，崩溃点只是清理局势的一种方式，而不是简单地忽视它。有时，问题有不同的解决方式。在非对称加密的情况下，无论政府投入多少资金，也无论拥有无限计算能力和多位大脑服务的超级计算机，都无法解决一个乍看之下似乎很容易解决的问题。现在你已经对非对称加密解决的主要问题有了大致了解，即密钥交换（实际上，我们将看到在\
    \ RSA 中，这个问题被转化为消息的直接传输），让我们深入探索参与这一极其有趣的密码学分支历史的先驱们。\n\n### The pioneers\n\n\
    密码学家有时看起来很奇怪；有时他们可能是内向者，有时可能是外向者。*Whitfield Diffie* 就是这种情况，他是一位独立的自由思想家，既不受政府雇佣，也不受任何大公司的雇佣。我第一次在\
    \ 2016 年旧金山的一个会议上见到 Diffie，当时他正在与他的著名同事 *Martin Hellman* 和 *Ronald Rivest* 讨论密码学。给我留下最深刻印象的事情之一是他优雅的白色着装，与他高大的身材、长长的白发和白胡子形成鲜明对比。就像一个永远年轻、仍停留在\
    \ 20 世纪 60 年代的人，他的当代人可能是华尔街证券交易所的代理人，也可能是印度的圣人。他是现代密码学的奠基人之一，他的姓名将永远铭刻在公钥/私钥加密的历史中。Diffie\
    \ 出生于 1944 年，1965 年毕业于波士顿的麻省理工学院。毕业后，他从事网络安全领域的工作，后来成为 20 世纪 70 年代最真实的独立密码学家之一。他被描述为\
    \ *cyberpunk*，以纪念 20 世纪 60 年代和 70 年代的 *new wave* 科幻运动，在该运动中，控制论、人工智能和黑客文化结合成一个反乌托邦的未来主义设定，倾向于关注\
    \ *低生活和高科技的结合*。早在 20 世纪 60 年代，美国国防部开始资助一项名为 **国防高级研究计划局 (DARPA)**，也称为 **ARPA**\
    \ 的通信领域新先进研究计划。ARPA 的主要项目是将军事计算机连接起来，以在电信中创建更具弹性的安全等级。该项目旨在防止核攻击事件中的通信中断，但网络也允许科学家之间发送调度和信息，以及已执行的计算，以利用连接计算机的空闲容量。**ARPANET**\
    \ 于 1969 年正式启动，仅连接了四个站点，随后迅速增长，以至于到 1982 年，该项目催生了互联网。20 世纪 80 年代末，许多普通用户已连接到互联网，此后他们的数量\n\
