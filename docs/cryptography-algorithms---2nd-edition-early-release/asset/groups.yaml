    ## Attacks and vulnerabilities in AES


    The NSA and NIST publications deemed AES as invulnerable to any kind of known
    attack. However, AES has its vulnerabilities; in fact, every system that can be
    implemented has vulnerabilities.


    **Important Note**


    Recall the NIST document reporting the possible vulnerabilities of AES (documented
    on October 2, 2000). You can read it at [https://www.nist.gov/news-events/news/2000/10/commerce-department-announces-winner-global-information-security](https://www.nist.gov/news-events/news/2000/10/commerce-department-announces-winner-global-information-security).


    In the NIST document, it states *Each of the candidate algorithms was required
    to support key sizes of 128, 192 and 256 bits. For a 128-bit key size, there are
    approximately 340,000,000,000,000,000,000,000,000,000,000,000 (340 followed by
    36 zeros) possible keys.* However, even though theoretically AES remains unbreakable,
    **(-x%)**, using all the brute force in the world (you will see a computational
    analysis of AES in *Chapter 9, Crypto Search Engine*), it is still always possible
    to find a breach in any algorithm. It is common to find breaches in the implementation
    stage. Indeed, pay attention to what happens if you implement, for instance, AES
    with ECB mode. We have already seen ECB mode in DES. This basic implementation
    consists of dividing the plaintext into blocks and for each block of plaintext,
    P, calculating the ciphertext, C: `C = Encr(P)` You can see the scheme of ECB
    mode encryption in the following figure:


    ![](img/2c67eb1b2bfb299c02a010d62900759c_82_0.png)


