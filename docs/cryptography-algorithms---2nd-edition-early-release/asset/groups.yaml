    length for an arbitrary message that is provided as input. The input message is
    a bit string, so the length of the message is the number of bits that make up
    the message (that is, an empty message has length 0). If the number of bits in
    a message is a multiple of 8 (a byte), for compactness, we can represent the message
    in hexadecimal. Conversely, if the message is not a multiple of a byte, then we
    have to apply padding. The purpose of the padding is to make the total length
    of a padded message a multiple of 512. As SHA-1 sequentially processes blocks
    of 512 bits when computing the message digest, the trick to getting a strong message
    digest is that the hash function has to provide the best grade of confusion/diffusion
    on the bits involved in the iterative operations. The process of padding consists
    of the following sequence of passages:


    +   - SHA-1 starts by taking the original message and appends 1 bit followed by
    a sequence of 0 bits.

    +   - The 0 bits are added to ensure that the length of the new message is a multiple
    of 512 bits.

