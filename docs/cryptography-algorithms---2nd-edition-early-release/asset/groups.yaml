    ## Binary numbers, ASCII code, and notations


    When we manipulate data with computers, it is common to use data as strings of
    **0** and **1** named bits. So, numbers can be converted into bits (base 2) rather
    than into base 10, like our numeric system. Let''s just have a look at how the
    conversion mechanism works. For example, the number **(123)** can be written in
    base 10 as **1*10^2+2*10^1 +3*10^0**. Likewise, we can convert a base 10 number
