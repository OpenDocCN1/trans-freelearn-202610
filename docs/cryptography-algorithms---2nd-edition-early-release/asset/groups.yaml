    是一种离散幂运算，但求解离散对数和离散幂的问题在计算难度上是相同的。


    现在让我们更深入一点，解释这个运算的动态原理。考虑计算下面的表达式：2^4 ≡ (x) (mod 13) 首先，我们计算 2^4 = 16，然后用 16 除以
    13，商为 1，余数为 3，因此 x = 3。离散对数正是其逆运算：2^[y] ≡ (x) (mod 13) 在这种情况下，我们已知底数为 2，需要计算 [y]。可以证明，能够生成
    (x) 的 [y] 有无限多个解。以前面的例子来说，我们有：2^[y] ≡ 3 (mod 13) 求 [y]：一个解是 y = 4，但并非唯一解。对于这个方程的所有整数
    (n)，结果 3 同样成立：[y] = [y + (p-1)*n] 让我们证明 n = 1 的情况：2^[4+(13-1)*1] ≡ 2^16 (mod 13)，而
    2^16 ≡ 3 (mod 13)。n = 2 时同样成立：2^[4 +(13-1)*2] ≡ 2^28 (mod 13)，而 2^28 ≡ 3 (mod
    13)。以此类推……因此，该方程对所有整数（即 (n ≥ 0)）都有无限多个解：[y] ≡ 2^[4 + 12 n] (mod 13)。目前还没有在多项式时间内求解离散对数的方法。因此，在数学和密码学中，这个问题都被认为是非常难解的，即使攻击者拥有强大的计算能力。最后，我们需要引入生成元
    (g) 的定义和记号：它是一个特殊的数，我们说 (g) 生成整个群 (Zp)。如果 (p) 是素数，这意味着 (g) 可以取 1 到 p-1 之间的任意值。


    ## 解释 D-H 算法


    D-H 并不是严格意义上的非对称加密算法，但它可以被恰当地定义为公钥/私钥算法。非对称加密与公钥/私钥之间的区别不仅是形式上的，更是实质性的。在后面的 RSA
    部分（一个纯粹的非对称算法）中，你会更好地理解这一区别。相反，D-H 得到一个共享密钥，该密钥用于对称加密消息 [M]。用对称算法执行的加密会与 D-H 共享密钥传输相结合，以生成密文
    C：对称算法 E((D-H[k]), M) = C 换句话说，我们用


    D-H 算法生成共享密钥 [k]，然后用 AES 或其他对称算法加密消息 [M]。D-H 并不直接加密秘密消息；它只能确定双方之间的共享密钥。这是一个关键点，我们将在下一段看到。然而，为了在离散域中工作，并利用离散对数问题在共享密钥时保护其免受攻击者的攻击，迪菲和赫尔曼实现了密码学中最健壮、最著名的算法之一。下面我们看看
    D-H 是如何工作的：


    - **第 1 步：**爱丽丝和鲍勃首先就参数达成一致：(g) 作为环 (Zp) 中的生成元，以及一个素数 p（模 p）。

    - **第 2 步：**爱丽丝选择一个秘密数字 [a]，鲍勃选择一个秘密数字 [b]。


    爱丽丝计算 **A ≡ g^a (mod p)**，鲍勃计算 **B ≡ g^b (mod p)**。


    - **第 3 步：**爱丽丝将 (A) 发送给鲍勃，鲍勃将 (B) 发送给爱丽丝。

    - **第 4 步：**爱丽丝计算 **ka ≡ B^a (mod p)**，鲍勃计算 **kb ≡ A^b (mod p)**。


    **[ka = kb]** 将成为爱丽丝和鲍勃之间的共享密钥。下面是该算法的一个数值示例：


    - **第 1 步：**爱丽丝和鲍勃就他们将要使用的参数达成一致，即 g = 7 和（模 11）。

    - **第 2 步：**爱丽丝选择一个秘密数字 (3)，鲍勃选择一个秘密数字 (6)。


    爱丽丝计算 **7^3 (mod 11) ≡ 2**，鲍勃计算 **7^6 (mod 11) ≡ 4**。


    - **第 3 步：**爱丽丝将 (2) 发送给鲍勃，鲍勃将 (4) 发送给爱丽丝。

    - **第 4 步：**爱丽丝计算 **4^3 (mod 11) ≡ 9**，鲍勃计算 **2^6 (mod 11) ≡ 9**。


    数字 **[9]** 就是爱丽丝和鲍勃的共享密钥 **[k]**。


    ## 分析该算法


    在算法的*第 2 步*中，爱丽丝计算 **A = g^a (mod p)**，鲍勃计算 **B = g^b (mod p)**。爱丽丝和鲍勃交换了 **(A)**
    和 **(B)**，这是单向函数的公共参数。*单向函数*之所以得名，是因为不可能 **(-x%)** 从公共参数 **(A)** 反推出秘密私钥 **[a]**（对
    **(B)** 和 **[b]** 也是如此），这是由离散对数的健壮性所决定的（参见*“离散对数”*一节）。模幂运算的另一个性质是，我们可以将 **B^a**
    和 **A^b (mod p)** 写成如下形式：**B^a ≡ (g^b)^a (mod p)**，**A^b ≡ (g^a)^b (mod p)**。因此，根据模指数运算的性质，我们有：**g^(b*a)
    ≡ g^(a*b) (mod p)**。例如，我们有：


    - 爱丽丝：**(7^6)^3 ≡ 7^(6*3) ≡ 9 (mod 11)**

    - 鲍勃：**(7^3)^6 ≡ 7^(3*6) ≡ 9 (mod 11)**


    这就是使 D-H 算法得以成立的数学技巧。现在我们已经理解了该算法，接下来让我们指出它的缺陷以及可能对其进行的攻击。


    ## 对 D-H 算法的可能攻击与密码分析


    对 D-H 算法最常见的攻击是**中间人（MiM）攻击**。MiM 攻击是指攻击者潜入通信信道，窃听、阻断或篡改发送方与接收方之间的通信。通常，这种攻击由伊芙（攻击者）冒充对话中的两个真实参与者之一来实现：


    ![](img/2c67eb1b2bfb299c02a010d62900759c_99_0.png)


    *图 3.2 – 伊芙是“中间人”*


    回顾 D-H 算法*第 3 步*中的内容，爱丽丝和鲍勃交换了他们的公共参数 **(A)** 和 **(B)**。在这里，爱丽丝将 **(A)** 发送给鲍勃，然后鲍勃将
    **(B)** 发送给爱丽丝。现在，伊芙（攻击者）通过冒充爱丽丝来干扰通信。因此，MiM 攻击看起来像这样：


    - **第 3 步：**爱丽丝将 **(A)** 发送给鲍勃，鲍勃将 **(B)** 发送给爱丽丝。

    - **在这里，我们就遇到了 MiM 攻击：**伊芙将 **(E)** 发送给鲍勃，然后鲍勃将 **(B)** 发送给伊芙，以为她是爱丽丝。


    让我们分析爱丽丝的函数 **A ≡ g^a (mod p)** 和鲍勃的函数 **B ≡ g^b (mod p)**。如果这是在普通算术中而不是在有限域中进行的，这一过程将至关重要。还有另一种可能的攻击，也被称为**生日攻击**，它是针对离散对数最著名的攻击之一。众所周知，在一群人中，至少有两个人会共享同一个生日，因此在循环群中，有可能找到一些相等的值（碰撞）来求解离散对数。


    ## 重要说明


    **(E)** 这里代表伊芙的公钥参数，它是由她的私钥生成的，而不是加密。


    与它的逻辑简洁性相匹配的是，其内部隐藏着如此强大的力量，以至于 40 年后，它仍然被用于保护全球超过 80% 的商业交易。它的首字母缩写来自三位发明者的名字——**Rivest、Shamir
    和 Aldemar**。**RSA** 正是我们所称的完美的非对称算法。实际上，在 1997 年，英国密码机构 CESG 将公钥加密的发明归功于 1970
    年的詹姆斯·埃利斯（James Ellis），该机构还宣称，1973 年，克利福德·科克斯（Clifford Cocks）撰写了一份文档，展示了与 RSA
    算法类似的一个版本。非对称算法的核心概念是加密密钥和解密密钥不同。回想我在*“Diffie-Hellman 算法”*一节中关于挂锁的类比，当我描述 D-H
    算法时，我们看到任何人都（不仅仅是爱丽丝和鲍勃）可以用挂锁锁住盒子。这就是 MiM 的真正问题所在，因为无法识别挂锁究竟是属于鲍勃还是爱丽丝。为了克服这个问题，可以进行另一个有趣的思维实验，使用类似的类比，但稍微改变一下条件。假设爱丽丝复制了许多她的挂锁，并将这些副本寄送到全国的每个邮局，而将能打开所有这些挂锁的钥匙保存在一个秘密的地方。如果鲍勃想给爱丽丝发送一条秘密消息，他可以去邮局索取爱丽丝的挂锁，把消息放进盒子里，然后锁上。这样，鲍勃（发送者）从锁上盒子的那一刻起就无法再打开它，但当爱丽丝收到盒子时，她可以用她独有的安全钥匙打开它。基本上，在
    RSA 中（与 D-H 相反），鲍勃用爱丽丝的公钥加密消息。加密过程结束后，即使是鲍勃也无法解密该消息，而爱丽丝可以用她的私钥解密。正是这一步将非对称加密的概念从纯粹的理论转变为实际应用。RSA
    发现了如何用接收者的公钥加密消息并用私钥解密的方法。为了实现这一点，RSA 需要一种特殊的数学函数，稍后我们详细探讨该算法时，我会进一步解释。如前所述，这个算法有三位发明者。当时他们都是波士顿麻省理工学院的研究人员。我们说的是上世纪
    70 年代末。在 D-H 算法发明之后，罗纳德·里维斯特对这种新型密码学极为着迷。他先邀请了数学家伦纳德·阿德勒曼（Leonard Adleman），随后计算机科学系的另一位同事阿迪·沙米尔（Adi
    Shamir）也加入了团队。里维斯特试图实现的是以数学方式发送秘密

