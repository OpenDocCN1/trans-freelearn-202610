    \ 进行处理，该函数将当前块与上一轮得到的结果结合起来。有四轮，对应于变量 **t**，其范围分为如 *Figure 4.12* 所示的四个 t 范围，每个范围由\
    \ 20 步组成，共 80 步。每次迭代可以看作是一个计数器，沿着每个由 20 个值组成的范围的值运行。\n\n如 *Figures 4.12 and 4.13*\
