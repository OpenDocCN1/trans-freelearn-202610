    ## 比尔密码


    回到密码学历史，我想向你展示一种令人惊叹的加密方法，尽管现代计算器拥有强大的计算能力，但其密码至今仍未被破译。很多时候，密码学被用来隐藏珍贵的信息或迷人的宝藏，就像**比尔密码**背后那段神秘的故事一样。为了更好地理解这种密码所采用的加密方法，我认为了解一下比尔及其宝藏的故事（或传说）会很有趣。这个故事涉及价值超过
    2000 万美元的埋藏宝藏、一组神秘的加密文件、狂野西部的牛仔，以及一位毕生致力于破译这些文件的酒店老板。整个故事记载于 1885 年出版的一本小册子中。故事（你可以在这里找到完整版本：[http://www.unmuseum.org/bealepap.htm](http://www.unmuseum.org/bealepap.htm)）始于
    *1820 年 1 月*，在弗吉尼亚州*林奇堡*的*华盛顿酒店*，一个名叫*托马斯·J·比尔*的人入住于此。酒店老板*罗伯特·莫里斯*与比尔成了朋友，由于*莫里斯先生*被认为是一个值得信赖的人，他收到了一个盒子，里面装着三份写满数字的神秘文件。历经无数波折和多年的努力，三份加密文件中只有第二份被破译。


    比尔密码到底是什么样子？以下内容由三页组成，只包含数字，且顺序明显随机。第一份文件内容如下：71, 194, 38, 1701, 89, 76, 11, 83,
    1629, 48, 94, 63, 132；第二份文件（已被破译）内容如下：115, 73, 24, 807, 37, 52, 49, 17, 31, 62,
    647, 22, 7, 15；第三份文件内容如下：317, 8, 92, 73, 112, 89, 67, 318, 28, 96, 107, 41, 631,
    78。第二个密码在 1885 年左右被成功破译。在这里，我将讨论这类密码的主要考量。


    由于密码中的数字远远超过字母表中的字母数量，我们可以推断它不是替换密码，也不是换位密码。因此，我们可以假设每个数字代表一个字母，但这个字母是从外部文本中的一个单词中获得的。遵循这一准则的密码被称为书本密码：在书本密码中，一本书或任何其他文本都可以作为密钥。那么，这里真正有效的密钥就是从文本中获取字母的方法。


    利用这一系统，第二个密码通过参考《美国独立宣言》得以破译。为参考文本（《美国独立宣言》）中的每个单词分配一个数字，然后取密钥（本例中即第二个密码所对应的数字列表）所选中的每个单词的首字母，我们就能推断出明文。这种密码极为巧妙的一点在于，密钥文本（《美国独立宣言》）是公开的，但同时，除了消息的预期接收者之外，全世界都不知道它。只有当某人同时掌握密钥（数字列表）和“密钥文本”时，才能轻松解密消息。


    让我们来看一下破译第二个密码的过程：


    - 从第一个单词到最后一个单词，为文本中的每个单词按顺序分配一个数字。

    - 使用密码中包含的数字，提取每个单词的首字母。

    - 读取明文。


    以下是《美国独立宣言》的开头部分（截至第 115 个单词），显示每个单词及其对应编号：When (1) in (2) the (3) course (4)
    of (5) human (6) events (7) it ... 以下数字代表第二个密码的前几行；如你所见，粗体单词（及其对应编号）与我们在密文中找到的数字相对应：115,
    73, 24, 807, 37, 52, 49, 17, 31, 62, 647, 22, 7, 15。以下是将密码与密钥文本（《美国独立宣言》）结合进行解密的结果，即提取每个对应单词的首字母，也就是明文：115
    = instituted = I，73 = hold = h，24 = another = a，807 = …… 依此类推……我没有包含完整的《美国独立宣言》；这些只是前
    115 个单词。但如果你愿意，可以访问 [http://www.unmuseum.org/bealepap.htm](http://www.unmuseum.org/bealepap.htm)
    并尝试练习重建完整的明文。


    下面（有一些缺失的字母）是对第一句话的重建：I have deposited in the county of Bedford...... 如果我们继续下去，将数字与《美国独立宣言》中对应单词首字母的数字进行比较，解密结果将如下：


    > *我将以下物品存放在贝德福德县，距离比福德家约四英里处的一个坑道或地窖中，位于地面以下六英尺。这些物品由编号为“3”的文件中所列各方共同拥有，特此说明：第一批存物包括一千零十四磅黄金和三千八百一十二磅白银，于
    1819 年 11 月存入。第二批于 1821 年 12 月存入，包括一千九百零七磅黄金和一千二百八十八磅白银；还有珠宝，这些珠宝是在圣路易斯用白银换来的，以省去运输费用，价值
    13,000 美元。上述物品被安全地包装在带铁盖的铁罐中。地窖大致用石头砌成，容器放在坚实的石头上，并用其他石头覆盖。编号为“1”的文件描述了地窖的确切位置，因此找到它不会有任何困难。*


    许多其他密码学家和密码分析者曾试图破译比尔密码的第一和第三部分，但均徒劳无功。其他人，比如发现了价值数亿美元海底财宝的寻宝者*梅尔·费舍尔*，也曾前往贝德福德搜索该地区以寻找宝藏，但未能成功。也许比尔的故事只是一个传说；又或许它是真实的，但没有人会知道宝藏在哪里，因为没有人能破译第一份密码。又或者，宝藏永远不会被挖出，因为已经有人找到了它。无论如何，这个故事真正有趣的地方在于，在没有计算机或电子机器的帮助下，仅凭脑力、一支笔和一张纸，就实现了如此强大的密码。


    矛盾的是，假设攻击者使用暴力破解，探索当时世界上所有的文本，那么破解密码所需的尝试次数从 1 到无穷大不等。更重要的是，如果密钥文本不公开，而是由发送者本人编写并保密，那会怎样？在这种情况下，如果密码分析者没有密钥（即不掌握密钥文本），他们破解密码的可能性为零。


    比尔密码之所以令人感兴趣，还因为这类算法在现代密码学或未来可能拥有新的应用。其中一些应用可能与云计算中加密数据的研究方法有关。


    ## 弗纳姆密码


    **弗纳姆密码**是一种安全性最高的密码，因为它在理论上完全安全。由于它使用与明文等长的真正随机的密钥，因此被称为**完美密码**。这不过是基于香农信息熵原理的熵与随机性问题，它决定了密文中每个比特出现的概率相等。我们将在*第
    8 章“量子密码学”*中再次讨论该算法，届时我们会介绍量子密钥分发，以及在确定量子密钥后加密明文的相应方法。另一个有趣的实现是 Hyper Crypto Satellite（超级加密卫星），它使用该算法，利用卫星无线电通信传输并以无限比特串形式表示的随机密钥来加密明文。


    但现在，让我们继续探索该算法的主要特征。


    该算法的基本要素是每次会话只使用一次密钥。这一特性使得该算法在密文攻击面前无懈可击；即使在极少数情况下密钥被盗，也会在下一次传输时更换。


    方法非常简单：将密钥与消息逐位相加（**模 2**），即可得到密文。在本书中，我们会多次看到这种称为 **XOR（异或）** 的方法，尤其是在*第 2 章“对称加密简介”*中讨论对称加密时。只需记住，密钥必须与消息长度相同。


