    ```


    - **Bob sends (t) to Alice ———————————> Alice can now blind-sign (t):**


    ```

    S ≡ t^[da] ≡ 3524^1553 = 1533 (mod 6767)

    ```


    - **Bob can verify (S) <———————————— Alice sends (S = 1533):**


    ```

    S / k ≡ V (mod Na)

    1533 / 29 ≡ 2853 (mod 6767)

    ```


    `Reduce[k*x == S, x, Modulus -> Na]`


    Bob accepts the signature (S).


    As you can see from this example and the explanation of blind signatures, Alice
    is sure that Bob''s discovery (the coronavirus cancer cure) belongs to him, and
    Bob can preserve his invention without declaring the exact content of it before
