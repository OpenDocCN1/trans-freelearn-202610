    后跟 36 个零）种可能的密钥。* 然而，尽管理论上 AES 仍然不可攻破，**(-x%)**，即使用尽全世界的暴力破解手段（你将在*第 9 章，加密搜索引擎*中看到
    AES 的计算分析），任何算法中仍然总是可能找到漏洞。在实现阶段常见到漏洞。事实上，请注意如果你使用例如 ECB 模式的 AES 会发生什么。我们已经在 DES
    中看到了 ECB 模式。这种基本实现包括将明文划分为多个块，并对每个明文块 P，计算密文 C：`C = Encr(P)`。你可以在下图中看到 ECB 模式加密的方案：


