    ## An overview of elliptic curves


    Around 1985, Victor Miller and Neal Koblitz pioneered *elliptic curves* for cryptographic
    uses. Later on, Hendrik Lenstra showed us how to use them to factorize an integer
    number. Elliptic curves are essentially a geometrical representation of particular
    mathematical equations on the Cartesian plane. We will start to analyze their
    geometrical models in the 2D plane, conscious that their extended and deeper representation
    is in 3D or 4D, involving irrational and imaginary numbers. Don''t worry now about
    these issues; it will become clearer later on in this chapter. **Elliptic Curves
    Cryptography (ECC)** is used to implement some algorithms we have seen in previous
    chapters, such as **RSA**, **Diffie–Hellman (D–H)**, and **ElGamal**. Moreover,
    after the advent of the revolution in digital currency, a particular type of elliptic
    curve called secp256K1 and a digital signature algorithm called **Elliptic Curve
    Digital Signature Algorithm (ECDSA)** have been used to apply digital signatures
    to Bitcoin to ensure that transactions are executed successfully. This chapter
    intends to take you step by step through discovering the logic behind elliptic
    curves and transposing this logic into digital world applications. It has been
    estimated that using 313-bit encryption on elliptic curves provides a similar
    level of security as 4,096-bit encryption in a traditional asymmetric system.
    Such low numbers of bits can be convenient in many implementations requiring high
    performance in timing and bandwidth, such as mobile applications. So, let''s start
    to explore the basis of elliptic curves, which involve geometry, mathematics,
    and many logical properties that we have seen in earlier chapters of this book.


    ## Operations on elliptic curves


    The first observation is that an elliptic curve is not an *ellipse*. The general
    mathematical form of an elliptic curve is as follows:


    ```

    E: y^2 = x^3 + ax^2 + bx + c

    ```


    > **Important Note**

    >

    > **E:** represents the form of the elliptic curve, and the parameters (**a**,
    **b**, and **c**) are coefficients of the curve.

