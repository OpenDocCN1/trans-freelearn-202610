    # Violation of DES


    The history of the attacks performed to crack DES since its creation is rich in
    anecdotes. In 1975, among the academic community, skepticism against the robustness
    of the key length with respect to the 56-bit keys started to arise. Many articles
    have been published; one very interesting prediction of *Whitney Diffie* and *Martin
    Hellman* (the same pair from the *Diffie and Hellman exchange* of the key seen
    in *Chapter 3, Asymmetric Encryption*) was that a computer worth $20 million (in
    1977) could be built to break DES in only 1 day. More than 20 years later, in
    1998, the **Electronic Frontier Foundation (EFF)** developed a dedicated computer
    called **DES Cracker** to break DES. The EFF spent a little less than $250,000
    and employed 37,050 units embedded into 26 electronic boards. After 56 hours,
    the supercomputer gained the decryption of the plaintext message object of a challenge
    as there was a $10,000 reward for the decryption of the ciphertext. The method
    adopted was a simple *brute-force* method to analyze all the possible combinations
    of bits given by the **2^56** (about 72 quadrillion) possible keys. The EFF was
    able to crack DES using hardware that incorporated 1,500 microchips working at
    40 MHz, in 4.5 days of running time. Imagine, only 1 microchip would take 38 years
    to explore the entire set of keys. At this point, the authorities decided to replace
    the algorithm with a new symmetric key algorithm, and here came AES. But before
    exploring AES, let''s analyze some possible attacks on DES. I will present next
    some possible attacks on DES, taking into consideration that most of these methods
    are used to attack most symmetric algorithms. Some of the attacks are specific
    to blocking ciphers, while others are valid for streaming ciphers too. The difference
    is that in a stream cipher, 1 byte is encrypted at a time, while in a block cipher,
    ~128 bits are encrypted at a time (block):


    +   - **Brute-force attack:** This basic method of attack can be performed for
    any known cipher, meaning trying all the possibilities to find the key. If you
    recall, the key length of DES is a 56-bit key, which means an'
