    a *hash of the message*, **h[M]**, to protect the message **[M]**, and will then
    transmit the result to Bob in order to prove her identity. To sign the message
    **[M]**, Alice first has to generate the hash of the message: **h[M] = m**. Now,
    Alice can operate with the digest value of **[M]** → **(m)** in cleartext because,
    as we have learned before, it is almost impossible to return to **[M]** from its
    cryptographic hash **(m)**. Alice calculates the signature **(S)** such that:


    - **Step 1** – Making the inverse of **[k]** in **(mod p-1)**:


    ```

    [INVk] ≡ [k]^(-1) (mod p-1)

    ```


    - **Step 2** – Performing the equation:


    ```

    S ≡ [INVk] * (m - [a] * y1) (mod p-1)

    ```


    Alice sends to Bob the public parameters **(m, y1, S)**.


    - **Step 3** – In the first verification, Bob performs **V1**:


    ```

    V1 ≡ A^y1 * y1^S (mod p)

    ```


    After the verification step, if h[M] = m, Bob obtains the second parameter of
    verification, V2:


    ```

    V2 ≡ g^m (mod p)

    ```


    Finally, if V1 = V2, Bob accepts the message.


    Now, let''s better understand this algorithm with the help of a numerical example.


    ### Numerical example


    Let''s suppose that the value of the secret message is **[M] = 88**. We assign
    the following values to the other public parameters:


    - g = 7

    - p = 200003

    - h[M] = 77


    The first step is the "key initialization" of the private and public keys:


    - **[b] = 2367** (private key of Bob)

    - **[a] = 5433** (private key of Alice)


    In the initialization process, Alice calculates the inverse of the key (Step 1)
    and then the signature (Step 2):


    - **Step 1** – Alice computes the inverse of [k] in (mod p-1):


    ```

    [INVk] ≡ [k]^(-1) (mod p-1) = 23^(-1) (mod 200003 - 1) = 34783

    ```


    - **Step 2** – Alice can now get the signature (S):


    ```

    S ≡ [INVk] * (m - [a] * y1) (mod p-1)

    S ≡ 34783 * (77 - 5433 * 90914) (mod 200002) = 72577

    ```


    Alice sends to Bob the public parameters **(m, y1, S) = (77, 90914, 72577)**.


    - **Step 3** – With those parameters Bob can perform the first verification (V1).
    Consequently, he computes V2. If V2 = V1, Bob accepts the digital signature (S):


    ```

    V1 ≡ A^y1 * y1^S (mod p)

    V1 ≡ 43725^90914 * 90914^72577 (mod 200003)

    ```


    For the second verification (V2):


    ```

    V2 ≡ g^m (mod p)

    V2 ≡ 7^77 (mod 200003) = 76561

    ```


    Bob verifies that V1 = V2.


    Considering the underlying problem that makes this algorithm work, we can say
    that it is the same as the discrete logarithm. Indeed, let''s analyze the verification
    function:


    ```

    V1 ≡ A^y1 * y1^S (mod p)

    ```


    All the elements are made by discrete powers, and as we already know, it is a
    hard problem (for now) to get back from a discrete power even if the exponent
    or the base is known. It is not sufficient to say that discrete powers and logarithms
    ensure the security of this algorithm. As we saw in Chapter 3, Asymmetric Cryptography,
    the following function could also be an issue:


    ```

    y2 ≡ [M] * B^[k] (mod p)

    ```


    It''s given by multiplication. If we are able to recover [k], then we have discovered
    [M]. So, the algorithm suffers not only from the discrete logarithm problem but
    also from the factorization problem.


    Now that you have learned about the uses and implementations of digital signatures,
    let''s move forward to explore another interesting cryptographic protocol: blind
    signatures.


    ## Blind signatures


    David Chaum invented **blind signatures**. He struggled a lot to find a cryptographic
    system to anonymize *digital payments*. In 1990, David founded *eCash*, a system
    that adopted an untraceable currency. Unfortunately, the project went bankrupt
    in 1998, but Chaum will be forever remembered as one of the pioneers of digital
    money and one of the fathers of modern cryptocurrency, along with Bitcoin.


    The underlying problems that Chaum wanted to solve were the following:


    - To find an algorithm that was able to avoid the *double-spending problem* for
    electronic payments.

    - To make the digital system *secure and anonymous* to guarantee the *privacy*
    of the user.


    In 1982, Chaum wrote an article entitled *Blind Signatures for Untraceable Payments*.
    The following is an explanation of how the blind signatures described in the article
    work and how to implement them.


    Signing a message *blind* means to sign something without knowing the content.
    It could be used not only for digital payments but also if Bob, for example, wants
    to publicly register something that he created without making known to others
    the details of his invention. Another application of blind signatures is in electronic
    voting machines, where someone makes a choice (say, in an election for the president
    or for a party, for example). In this case, the result of the vote (the transmitted
    message) has to be known by the receiver obviously, but the identity of the voter
    has to remain a secret if the voter wants to be sure that their vote will be counted
    (that is the proper function of blind signatures).


    I will expose an innovative blind signature scheme for the *MBXI cipher* in *Chapter
    6, New Algorithms in Public/Private Key Cryptography*, where I will introduce
    new ciphers in private/public keys, including the MBXI, invented and patented
    by me in 2011. Let''s see now how David Chaum''s protocol works by performing
    a blind signature with RSA.


    ### Blind signature with RSA


    Suppose Bob has an important secret he doesn''t want to expose to the public until
    a determined date. For example, he discovered a formidable cure for coronavirus
    to avoid cancer and he aspires to get the Nobel Prize. Alice represents the commission
    for the Nobel Prize. Alice picks up two big secret primes **[pa, qa]**:


    - **[pa * qa] = Na**, which is Alice''s public key.

    - **(e)** is the same public parameter already defined in RSA.


    The parameter **[da]** is Alice''s private key, given by this operation:


    ```

    INV(e) ≡ [da] mod (pa−1)(qa−1)

    ```


    Suppose that **[M1]** is the secret belonging to Bob. I have just called it **[M1]**
    to distinguish it from the regular **[M]**. Bob picks up a random number **[k]**
    and keeps it secret. Now Bob can go ahead with the blind signature protocol on
    **[M1]**:


    - **Step 1** – Bob performs encryption **(t)** on **[M1]** to *blind* the message:


    ```

    t ≡ [M1] * [k]^e (mod Na)

    ```


    Bob sends (t) to Alice.


    - **Step 2** – Alice can perform the blind signature given by the following operation:


    ```

    S ≡ t^[da] (mod Na)

    ```


    Alice sends (S) to Bob, who can verify whether the blind signature corresponds
    to the message [M1].


    - **Step 3** – Verification:


    Bob calculates **(V)**:


    ```

    S / [k] ≡ V (mod Na)

    ```


    Then he can verify the following:


    ```

    V^e ≡ [M1] (mod Na)

    ```


    If the last operation is **TRUE**, it means Alice has effectively signed *blind*
    **[M1]**. In this case, Bob can be sure of the following:


    ```

    [M1]^[da] ≡ V (mod Na)

    ```


    Since no one except Alice could have performed function **(S)** without being
    able to solve the *discrete logarithm* problem (as already seen in *Chapter 3,
    Asymmetric Algorithms*), the signer must be Alice, for sure. This sentence remains
    valid until any other variable occurs; for example, when someone finds a logical
    way to solve the discrete logarithm or a quantum computer reaches enough qubits
    to break the algorithm, as we''ll see in Chapter 8, Quantum Cryptography.


    Let''s see an example to better understand the protocol.


    ### Numerical example


    The parameters defined by Alice are as follows:


    ```

    pa = 67

    qa = 101

    e = 17

    ```


    So, the public key (Na) is the following:


    ```

    67 * 101 = Na = 6767

    ```


    Alice''s private key is:


    ```

    da ≡ 1/e (mod (pa-1)(qa-1)) = 17^(-1) (mod 6600) = 1553

    ```


    - **Bob picks up a random number, [k]:**


    ```

    k = 29

    ```


