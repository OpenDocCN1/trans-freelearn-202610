    As we have already seen in Chapter 1, Deep Diving into Cryptography, the binary
    system works with a set of bits of {0,1}. So, dealing with Boolean functions means
    performing logic calculations on a sequence of bits to generate an answer that
    could be either TRUE or FALSE. The most frequently used functions are XOR (exclusive
    OR), OR (disjunction), and AND (conjunction). But there are a few other notations
    as well that will be explained soon. A Boolean circuit aims to determine whether
    a variable, (x), combined with another variable, (y), satisfies the condition
    TRUE or FALSE. This problem is called the Boolean Satisfiability Problem (SAT)
    and it is of particular importance in computer science. SAT was the first problem
    to be shown as NP-complete. The question is as follows: given a certain function,
    does an assignment of the values TRUE or FALSE exist such that the expression
    results in TRUE? A formula of propositional logic is satisfiable if there exists
    an assignment that can determine that a proposition is TRUE. If the result is
    FALSE for all possible variable assignments, then the proposition is said to be
    unsatisfiable. That is of great importance in algorithm theory, such as for the
    implementation of search engines, and even in hardware design or electronic circuits.
    Let''s give an example of propositional logic:


    +   - **Premise 1:** *If the sky is clear, then it is sunny.*

    +   - **Premise 2:** *There are no clouds in the sky.*

    +   - **Conclusion:** *It''s TRUE that it is sunny.*'
