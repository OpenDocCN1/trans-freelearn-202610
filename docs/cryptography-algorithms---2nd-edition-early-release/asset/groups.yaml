    最后，对于模幂的性质，代入 **[F]** 和 (**r**) 之后，我们得到以下内容：

    P ≡ g^(s*k) ≡ (g^k)^s ≡ g^(k*s) (mod p)

    基本上，我已将参数 (**P**)，即 Bob 创建的证明，替换为其自身参数的元素，证明了秘密 **[s]** 包含在 (**P**) 中。因此，(**P**)
    必须与 Bob 生成并连同证明 (**P**) 一起发送给 Alice 的 *临时* 参数 (**r**)^[**s**] 匹配。如果 Alice 知道 **[s]**，那么她就可以确定
    Bob 也知道 **[s]**，因为 (**P**) 包含 **[s]**。这就是我们想要证明的。


