    # 1 深入探索密码学


    # 加入我们的 Discord 图书社区


    [https://packt.link/SecNet](https://packt.link/SecNet)


    ![](img/2c67eb1b2bfb299c02a010d62900759c_8_0.png)


    本章介绍密码学的基本概念、它的用途以及为什么它在信息技术中如此重要。本章还纵览了密码学历史上的主要算法，从凯撒算法到弗纳姆密码，以及其他不太为人知的算法，如比尔密码。然后，**Rivest-Shamir-Adleman
    (RSA)**、Diffie–Hellman 以及其他著名算法将在本书后续部分中详细描述。最后，本章将为您提供学习密码学和维护安全支柱的工具。在本章中，我们将涵盖以下主题：


    +   - 密码学简要介绍

    +   - 本书使用的基本定义和主要数学符号

    +   - 二进制转换与 ASCII 码

    +   - 费马最后定理、素数和模运算

    +   - 主要密码算法的历史及其中一些算法的解释（罗塞塔密码、凯撒密码、ROT13、比尔密码、弗纳姆密码）

    +   - 安全记法（语义安全、可证明安全、一次性密码本等）


    # 密码学导论


    密码学中最重要的事情之一就是理解定义和记法。我从来都不喜欢定义和记法，首先，因为我是唯一一个使用自己发明的记法的人。但我意识到，达成一致非常重要，尤其是当我们讨论与数学相关的内容时。因此，在本节中，我将介绍与密码学相关的基础信息和引用。我们先从算法的定义开始。在数学和计算机科学中，**算法**是一系列定义明确的、可由计算机实现的有限指令序列。一个重要的问题是：什么是密码？**密码（cipher）**是一种能够将明文（消息）转换为不可理解文本（密文或密码文）的任何类型的系统：


    # 消息


    (算法)


    ![](img/2c67eb1b2bfb299c02a010d62900759c_10_0.png)


    (算法)


    # 密文


    # 图 1.1 – 加密过程


    为了从密码中获得效用，我们必须建立两个操作：加密和解密。简单来说，我们必须在一段时间内保持消息的机密性和安全性。我们将 **M** 定义为所有消息的集合，**C**
    定义为所有密文的集合。**加密**是一种操作，通过应用函数 **E**，将一般消息 **m** 转换为密文 **c**：m -------- > f(E)
    -------- > c。**解密**是一种操作，通过应用函数 **D**，从密文 **c** 返回明文消息 **m**：c -------- > f(D)
    -------- > m。在数学上，**D(E(M)) = M**。这意味着 **E** 和 **D** 函数互为逆函数，并且 **E** 函数必须是单射的。**单射**意味着不同的
    **M** 值必须对应不同的 **C** 值。请注意，我使用大写字母还是小写字母（如（**M**）或（**m**））并不重要；目前这无关紧要。目前，我随意使用了圆括号，但稍后我将使用方括号来区分函数中的秘密元素与已知元素，其中秘密元素将使用方括号。因此，秘密消息
    **M** 将写成 **[M]**，就像任何其他秘密参数一样。在这里，我们只负责展示算法的工作原理；实现则留给工程师。还有一个对加密/解密至关重要的记法。要加密和解密消息，必须设置密钥。在密码学中，密钥是决定密码算法或密码功能输出的参数。没有密钥，算法将不会产生任何有用的结果。我们将
    **K** 定义为用于加密和解密 **M** 的所有密钥的集合，将 **k** 定义为单个加密或解密密钥，也称为会话密钥。然而，这两种定义密钥的方式（密钥集合为
    **K**，单个密钥为 **k**）将始终被使用，并指定密钥的类型（私有或公开）。现在我们已经理解了密码记法的主要概念，是时候解释私钥和公钥之间的区别了：


    +   - 在密码学中，私钥或密钥（**Kpr**），表示为 **[K]** 或 **[k]**，是一种加密/解密参数，只有一方、双方或多方知道，用于交换秘密消息。

    +   - 在密码学中，公钥（**Kpu**）或（**K**）是一种加密密钥，所有想发送秘密消息或验证用户身份的人都知道。


