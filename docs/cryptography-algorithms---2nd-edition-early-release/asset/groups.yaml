    ## 椭圆曲线的概述


    大约在 1985 年，Victor Miller 和 Neal Koblitz 开创了 *椭圆曲线* 用于密码学用途。后来，Hendrik Lenstra
    向我们展示了如何使用它们来分解整数。椭圆曲线本质上是笛卡尔平面上特定数学方程的几何表示。我们将开始在 2D 平面上分析它们的几何模型，同时意识到它们的扩展和更深层次的表示是在
    3D 或 4D 中，涉及无理数和虚数。现在不要担心这些问题；在本章后面会变得更清晰。**椭圆曲线密码学 (ECC)** 用于实现我们在前几章中看到的一些算法，例如
    **RSA**、**Diffie–Hellman (D–H)** 和 **ElGamal**。此外，在数字货币革命兴起之后，一种特定的椭圆曲线类型称为 secp256K1
    以及一种数字签名算法称为 **椭圆曲线数字签名算法 (ECDSA)** 已被用于对比特币应用数字签名，以确保交易成功执行。本章旨在一步步带你发现椭圆曲线背后的逻辑并将其转置到数字世界应用中。据估计，使用
    313 位椭圆曲线加密提供的<|message|>安全级别与传统非对称系统中 4,096 位加密相当。如此少的位数可以在许多需要高性能时序和带宽的实现中很方便，例如移动应用程序。因此，让我们开始探索椭圆曲线的基础，它涉及几何、数学以及我们在本书前几章中看到的许多逻辑属性。


    ## 椭圆曲线上的运算


    第一个观察是椭圆曲线不是 *椭圆*。椭圆曲线的一般数学形式如下：


    ```

    E: y^2 = x^3 + ax^2 + bx + c

    ```


    > **重要说明**

    >

    > **E：** 表示椭圆曲线的形式，参数 (**a**、**b** 和 **c**) 是曲线的系数。


