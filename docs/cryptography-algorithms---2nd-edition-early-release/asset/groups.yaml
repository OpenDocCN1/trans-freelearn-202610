    \ of the random number with SHA-256, which gives as output a 256-bit number. This\
    \ is the way to be sure that the number is effectively 256 bits in length. Remember\
    \ that if the output gives a number lower than **(n − 1)**, then the key will\
    \ be accepted; if not, it will make another attempt.\n\nThe public key (**KPub**)\
    \ is derived by the following equation:\n\n`KPub = Kpriv * G`\n\nThus, the number\
    \ of possible private keys is the same as the order of **G**: **n**. To calculate\
    \ the public key (**Q**), starting from the private key **[d]**, in secp256k1,\
    \ we have to use the following equation:\n\n`Q ≡ [d] * G (mod p)`\n\nThe result\
    \ of the equation will be **Q** (the public key). After this operation, we can\
    \ switch to calculating the digital signature.\n\nSuppose that Alice is the sender\
    \ of the signature and her **[d]**, **(G)**, and **(Q)** parameters have already\
    \ been calculated. In a real case, Victor is the verifier (the miner) who has\
    \ to verify the true ownership. Let's go on to see how to sign a Bitcoin transaction\
    \ in secp256k1.\n\n## Step 2 – Performing the digital signature in secp256k1\n\
    \nRemember that to sign a document, **[M]**, or, even better in this case, a value\
    \ in Bitcoin, **[B]** (as we discussed in *Chapter 4, Introducing Hash Functions\
    \ and Digital Signatures*), it is always recommended to compute **Hash[B] = z**.\
    \ So, we will sign **z**, which is the hash of the message, and *not* **[M]**\
    \ directly.\n\nAnother parameter that we need is **[k]**, which is an ephemeral\
    \ key (or session key). The sub-steps to perform the digital signature **(S)**\
    \ are similar to those for a public/private key algorithm. The difference here\
    \ is that the discrete logarithm is obtained through a scalar multiplication:\n\
    \n- Alice chooses a random secret, **[k]**, which gives us the following: **1\
    \ ≤ k ≤ n − 1**.\n- She calculates the coordinates, **R(x, y) = k * G**.\n- Alice\
    \ finds **r ≡ x (mod n)**, the x-coordinate of **R(x, y)**.\n- Alice calculates\
