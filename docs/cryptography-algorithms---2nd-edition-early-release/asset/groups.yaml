    \ of Bitcoin declared.\n\nWithout the support of a practical example, it is rather\
    \ difficult to understand such a complex protocol. Some of the operations performed\
    \ on secp256k1 for the digital signature of a Bitcoin transaction are quite complex\
    \ to interpret and need a practical example to understand.\n\n## A numerical exercise\
    \ on a digital signature on secp256k1\n\nIn this section, we will deep dive into\
    \ the digital signature of secp256k1 in order to understand the mechanism behind\
    \ the operations of implementation and validation of the digital signature.\n\n\
    Suppose, for instance, that the parameters of the curve are the following:\n\n\
    - **p = 67** (modulo p)\n- **G = (2, 22)**\n- **Order n = 79**\n- **Private key:\
    \ [d] = 2**\n\nAs we have chosen a very simple private key, it is just enough\
    \ to perform a double point to obtain the public key (**Q**):\n\n**Q = d * G**\n\
    \nIn this case, we proceed to calculate the public key (**Q**). First, we will\
    \ use the following formula to calculate the double point:\n\nt = (3xP² + a) /\
    \ 2yP\n\nt = (3 × 2² + 0) / (2 × 22) = 12 / 44 = 49\n\nQ = d * G\n\nUsing numbers\
