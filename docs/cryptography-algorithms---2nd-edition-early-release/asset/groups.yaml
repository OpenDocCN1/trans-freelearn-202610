    ## ElGamal


    ElGamal 是一种公钥-私钥算法，正如我们在 *第 3 章，非对称算法* 中所见，基于 *Diffie-Hellman 密钥交换*。在 ElGamal
    中，我们对消息的签名方式与 RSA 不同，但所有方式都是有效的。回顾 ElGamal 加密技术，我们有以下元素：


    - **(g, p)**: 公共参数

    - **[a]**: Alice 的私钥

    - **[M]**: 秘密消息

    - **B ≡ g^[b] (mod p)**: Bob 的公钥

    - **A ≡ g^[a] (mod p)**: Alice 的公钥


    **Alice 的加密：** y1 ≡ g^[k] (mod p), y2 ≡ [M] * B^[k] (mod p)


    > **Note**

    >

    > 请记住，方括号内的元素表示秘密参数；其他所有都是公开的。


    现在，如果 Alice 想给消息加上她的数字签名，她将对消息做一个 *哈希*，**h[M]**，以保护消息 **[M]**，然后将结果传输给 Bob 以证明她的身份。为了对消息
    **[M]** 进行签名，Alice 首先必须生成消息的哈希值：**h[M] = m**。现在，Alice 可以使用 **[M]** 的摘要值 → **(m)**
    进行明文操作，因为正如我们之前所学，从其密码学哈希值 **(m)** 回到 **[M]** 几乎是不可能的。Alice 计算签名 **(S)** 使得：


    - **Step 1** – 求 **[k]** 在 **(mod p-1)** 下的逆元：


