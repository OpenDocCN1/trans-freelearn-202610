    **88** 对应符号 **X**，如下例所示：`88 130 58 01011000 X &#88;` 大写 X 你可以前往本书末尾的*附录*部分，查看本书中所有的符号表示，包括算法及其Mathematica代码实现。


    ## 费马大定理、素数及模运算


    当我们谈论密码学时，我们必须始终牢记这门学科本质上与数学和逻辑相关。在我开始解释**费马大定理**之前，我想介绍一些贯穿全书的基本符号，以避免混淆并更好地理解主题。重要的是要知道，一些符号，如
    =、≡（等价）和 :=（最后一个可以在Mathematica中用于计算=），我可能会互换使用。这只是告诉你两个元素在同等程度上相互对应；无论是在有限域中（别担心，你会熟悉这个术语）、计算机科学还是常规代数中，这都无关紧要。数学家们可能会对此感到震惊，但我相信你的智慧，你会寻找实质而不是形式。另一个符号
    ≈（近似）可以用来表示相似的近似元素。你还会遇到 ^（指数）符号，例如以经典方式表达幂运算：a^x（**a** 的 **x** 次方）。≠ 符号，你从高中就应该记得，意思是**不等于**，这与
    = 的意义相同，即不等价。不过，你总会得到方程式的解释，所以如果你不太熟悉数学和逻辑符号，你可以依靠描述。无论如何，我会在遇到新符号时逐一解释。


    素数是一个只能被自身和1整除的整数，例如，2、3、5、7...23...67...p。素数是数学的基石，因为所有其他合数都由它们产生。现在，让我们看看费马大定理是什么、在哪里应用，以及为什么它对我们有用。费马大定理是与素数密切相关的经典数学中最优秀、最美丽的定理之一。根据维基百科：“在数论中，费马大定理（有时称为费马猜想，尤其是在较早的文本中）指出，对于任何大于2的整数n，不存在三个正整数a、b和c满足方程a^n
    + b^n = c^n。n = 1和n = 2的情况自古以来就知道有无穷多组解。”换句话说，它告诉我们，对于以下方程，对于任何指数 **n>3**，≥3，都不存在整数
    **a**、**b** 或 **c** 满足该和：a^n+b^n = c^n。为什么这个定理对我们如此重要？首先，因为费马大定理与素数密切相关。事实上，根据素数的性质，为了证明费马大定理，只需证明以下内容：a^p+b^p
    ≠ c^p。这里，**p** 是任何大于2的素数。费马声称他有*一个证明，大得无法写进笔记的页边距*。费马本人在一篇论文中指出，他有一个优美的证明。

