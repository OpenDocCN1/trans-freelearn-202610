    假设 Eve（攻击者）想冒充 Alice 或 Bob，制造中间人攻击。这可以按如下方式完成。Eve 用 (r1) 替换 (r)，生成一个伪造的 (k1)，通过计算以下内容：

    r1 ≡ g^k1 (mod p)

