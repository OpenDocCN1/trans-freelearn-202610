    a simple cubic root, √, we can obtain the message in cleartext: 8^(1/3) = 2 Here,
    we are working in linear mathematics and no longer in modular mathematics. A way
    to overcome this problem is to lengthen the message by adding random bits to it.
    This method is very common in cryptography and cybersecurity and is known as **padding**.
    There are different ways to perform padding, but here, we are talking about **bit
    padding**. As we covered in *Chapter 1, Deep Diving into Cryptography*, we can
    use ASCII code to convert text into a binary system, so the message, **[M]**,
    is a string of bits. If we add random bits (usually at the end, though they could
    also be added at the start), we will obtain something like this: . . . | 1011
    1001 1101 0100 0010 0111 0000 0000 | As you can see, the bold digits represent
    the padding. This method can be used to pad messages that are any number of bits
    long, not necessarily a whole number of bytes long; for example, a message of
    23 bits that is padded with 9 bits to fill a 32-bit block. Now that we are more
    familiar with RSA and modular mathematics properties, we''ll explore the first
    interesting application that was implemented with this algorithm.


    # The application of RSA to verify international treaties


    Let''s say that Nation Alpha wants to monitor seismic data from Nation Beta to
    be sure that they don''t experiment with any nuclear bombs in their territory.
    A set of sensors has been installed on the ground of Nation Beta to monitor its
    seismic activity, recorded, and encrypted. Then, the output data is transmitted
    to Nation Alpha, let''s say, via a satellite. This interesting application of
    RSA works as follows:


    +   - Nation Alpha, **(A)**, wants to be sure that Nation Beta, **(B)**, doesn''t
    modify the data.

    +   - Nation Beta wants to check the message before sending it (for spying purposes).'
