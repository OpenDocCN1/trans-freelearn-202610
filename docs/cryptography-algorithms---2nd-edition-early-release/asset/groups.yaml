    \ t = 79 时，子寄存器（A, B, C, D, E）被加到子寄存器（H₀, H₁, H₂, H₃, H₄）上，以获得最终的 160 位哈希值。\n\n\
    现在让我们检查 SHA-1 中常数的问题。常数是固定数字，以十六进制表示，并根据特定标准定义。选择 SHA 中常数时采用的一个重要标准是避免碰撞。碰撞发生在哈希函数对两个不同的块给出相同的结果时，从不同的常数开始。因此，即使有人可能会认为更改常数的值是个好主意，也不要尝试更改它们，因为这可能会导致碰撞问题。在\
