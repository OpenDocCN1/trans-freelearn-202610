    ## Notations and operations in Boolean logic


    为了理解对称算法的机制，有必要回顾布尔逻辑中的一些符号以及在二进制系统上的这些运算。正如我们在第 1 章《深入密码学》中已经看到的，二进制系统使用一组位 {0,1}。因此，处理布尔函数意味着对一系列位执行逻辑计算以生成答案，该答案可能是
