    It''s just a matter of solving the following equation to recover the secret message
    [M]: S^e ≡ x (mod Nb) Where the parameters (S, e, Nb) are all known. In this case,
    hash functions come to our aid. Performing the hash function h[M] = (m), Bob will
    send the couple (c, S), signing (m) instead of [M]. Alice already got the encrypted
