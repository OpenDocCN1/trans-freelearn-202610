    identity will be verified by Alice; if it is FALSE, Bob''s claim of identity will
    be refused.


    # Why do digital signatures work?


    If anyone else who isn''t Bob tries to use this signature, they will struggle
    with the discrete logarithm problem. Indeed, generating [db] in the following
    equation is a hard problem for the attacker to solve: m^[db] ≡ S (mod Nb) Also,
    even if (m, S) are known by the attacker, it is still very difficult to calculate
    [db]. In this case, we are dealing with a discrete logarithm problem like what
    we saw in Chapter 3, Asymmetric Algorithms. Let''s try to understand what happens
    if Eve (an attacker) tries to modify the signature with the help of an example:
    Eve (the attacker) exchanges [db] with (de), computing a fake digital signature
    (S''): m^(de) ≡ S'' (mod Nb) If Eve is able to trick Alice to accept the signature
    (S''), then Eve can make an MiM attack by pretending to be Bob, substituting (S'')
    with the real signature (S). But when Alice verifies the signature (S''), she
    recognizes that it doesn''t correspond to the correct signature performed by Bob
    because the hash of the message is (m''), not (m): (S'')^e ≡ m'' (mod Nb) m''
    m So, Alice refuses the digital signature and will not open any message coming
    from this fake address. That is why cryptographers also need to pay a lot of attention
    to the collisions between hashes. Now that we have got a different result, that
    is, (m'') instead of (m), Alice understands there is a problem and doesn''t accept
    the message [M]. This is the scope of the signature (S). The preceding attack
    is a simple trick, but there are some more intelligent and sneaky attacks that
    we will see later on, in Chapter 6, New Algorithms in Public/Private Key Cryptography,
    when I will explain unconventional attacks.


