    \nNow that we have more confidence with the elliptic curve and its operations,\
    \ we can go through an interesting elliptic curve case, analyzing the algorithm\
    \ adopted for the Bitcoin digital signature ECDSA.\n\n## Elliptic curve secp256k1\
    \ – the Bitcoin digital signature\n\n**ECDSA** is the digital signature scheme\
    \ used in Bitcoin architecture that adopts an elliptic curve called secp256k1,\
    \ standardized by the **Standards for Efficient Cryptography Group (SECG)**. ECDSA\
    \ suggests **(a = 0)** and **(b = 7)** as parameters in the following equation:\n\
