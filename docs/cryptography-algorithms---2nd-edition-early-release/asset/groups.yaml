    ```


    加密的图像之间），你会发现相同的模式被重复。一个非常著名的例子是 ECB 模式下的企鹅图像：即使原始图像和加密图像看起来不同，加密图像中仍然存在可辨认的结构，这表明
    ECB 模式不能很好地隐藏明文中的模式。


    ## ECB 模式实现示例：重放攻击


    假设 Alice 通过 ATM 使用 AES 以 ECB 模式加密她的银行卡信息。当她输入密码时，ATM 会向银行发送类似以下内容的加密消息：


    - **消息**：`A3 2F 1B 7C ...`（加密的账户信息）


    - 银行在检查账户后回答：**[OK]**。


    如果 Eve 正在监听通信并截获了加密消息，她可以简单地重复该操作几次，直到她从账户中偷走 Alice 的所有钱。银行只会认为 Alice 正在进行多次 ATM
    取款，而如果不对这种攻击采取行动，受害者（Alice）将失去她账户中的所有钱。这个技巧有效是因为 Eve 多次重新发送相同的复制消息。如果 **【K】**
    密钥在每次加密会话中都不改变，Eve 就可以尝试这种攻击。一个非常有效的解决方案是只接受每个会话不同的密码文，这消除了对称加密用于多次传输的问题。否则，为了防止这种攻击，AES
    的实现之一（就像其他分组密码一样）是 CBC 密码块链接。CBC 执行分组加密，基于前一个块的值生成输出。我们将在*第 9 章，加密搜索引擎*中的*CSE
    计算分析*部分再次看到这种实现，届时我会介绍我们在 CBC 模式中实现 AES 加密的 CSE。这里我只解释它是如何工作的。CBC 方法使用 64 位块大小用于明文、密文和初始化向量
