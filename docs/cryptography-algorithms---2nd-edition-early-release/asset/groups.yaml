    \n- **Electromagnetic attack:** 这是另一种针对算法实现的攻击。曾有一项攻击尝试在 FPGA 上进行，通过示波器测量从天线发出的辐射。\n\
    \n最后，AES 的真正问题在于密钥交换。由于这是一种对称算法，Alice 和 Bob 必须在执行加密和解密操作之前就共享密钥达成一致。即使 AES 的少数应用可以在没有密钥交换的情况下实现，大多数应用仍需要非对称算法来弥补密钥传输的不足。我们将在下一章探索非对称加密时更好地理解这一概念。此外，在分析\
    \ CSE 时，我们将在 *第 9 章，Crypto Search Engine* 中看到一个不需要任何密钥交换的应用。\n\n## Summary\n\n\
    在本章中，你学习了对称加密。我们探讨了理解对称加密、KE 和 S-Box 功能所必需的布尔运算。然后，我们深入研究了简单 DES、DES、3DES 和 DESX\
    \ 的工作原理及其主要漏洞和攻击。在这些主题之后，我们分析了 AES（Rijndael），包括其实现架构以及使该算法如此强大的步骤的逻辑。关于 AES 的漏洞和攻击，你已经了解了\
