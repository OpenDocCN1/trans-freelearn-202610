    Let''s go a little bit deeper now to explain the dynamics of this operation. Let''s
    consider computing the following: 2^4 ≡ (x) (mod 13) First, we calculate 2^4 =
    16, then divide 16:13 = 1 by the remainder of 3 so that x = 3. The discrete logarithm
    is just the inverse operation: 2^[y] ≡ (x) (mod 13) In this case, we have to calculate
    [y] while knowing the base is 2. It''s possible to demonstrate that there are
    infinite solutions for [y] that generate (x). Taking the preceding example, we
    have the following: 2^[y] ≡ 3 (mod 13) for [y] One solution is y = 4, but it is
    not the only one. The result of 3 is also satisfied for all the integers, (n),
    of this equation: [y] = [y + (p-1)*n] Let''s prove n = 1: 2^[4+(13-1)*1] ≡ 2^16
    (mod 13) 2^16 ≡ 3 (mod 13) But it is also valid for n = 2: 2^[4 +(13-1)*2] ≡ 2^28
    (mod 13) 2^28 ≡ 3 (mod 13) And so on... Hence, the equation has infinite solutions
    for all the integers; that is, (n ≥ 0): [y] ≡ 2^[4 + 12 n] (mod 13) There is no
    method yet for solving the discrete logarithm in polynomial time. So, in mathematics,
    as in cryptography, this problem is considered very hard to solve, even if the
    attacker has a lot of computation power. Finally, we have to introduce the definition
    and the notation of a generator, (g), which is a particular number where we say
    that (g) generates the entire group, (Zp). If (p) is a prime number, this means
    that (g) can take on any value between 1 and p-1.


    # Explaining the D-H algorithm


    D-H is not exactly an asymmetric encryption algorithm, but it can be defined properly
    as a public/private key algorithm. The difference between asymmetric and public/private
