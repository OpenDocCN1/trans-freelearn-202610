    If Eve is listening to the communication and intercepts the encrypted message,
    she could just repeat the operation several times until she steals all of Alice''s
    money from the account. The bank would just think that Alice is making several
    more ATM withdrawals, and if no action is taken against this attack, the victim
    (Alice) will have just lost all the money in her account. This trick works because
    Eve resends the same message copied several times. If the **[K]** key doesn''t
    change for every session of encryption, Eve can attempt this attack. A very efficient
    solution is to accept only different cryptograms for each session, which gets
    rid of the use of symmetric encryption for multiple transmissions. Otherwise,
    in order to prevent this kind of attack, one of the implementations of AES (just
    like other block ciphers) is CBC Cipher Block Chaining. CBC performs the block
    encryption generating an output based on the values of the previous blocks. We
    will see this implementation again later on, in *Chapter 9, Crypto Search Engine*,
    in the *Computational Analysis on CSE* section, when I present CSE in which we
    have implemented AES encryption in CBC mode. Here I''ll just explain how it works.
    The CBC method uses a 64-bit block size for plaintext, ciphertext, and the initialization
    vector, **IV**. Essentially, **IV** is a random number, sometimes called *salt*,
    **XOR**ed to the plaintext in order to compute the block. Just remember the following:


    - **E** = Encryption

    - **D** = Decryption

    - **C** = Ciphertext


    ### Encryption works as follows:


    - Calculate the initial block, **C₀**, taking the first block of the plaintext,
    (**P₀**), **XOR**ing with the initialization vector (**IV**):


    ```

    C0 = E (P0 IV)

    ```


    - Each successive block is calculated by **XOR**ing the previous ciphertext block
    with the plaintext block and encrypting the result:


    ```

    Ci = E ( Pi Ci-1)

    ```


    ### Decryption works as follows:


    - To obtain the plaintext, (**P₀**), combine **XOR** between the decryption of
    the first block of ciphertext received (**C₀**) and the initialization vector
    (**IV**):


    ```

    P0 = D (C0) IV

    ```


    - To obtain all the other plaintext, (**Pᵢ**), we have to perform an **XOR** between
    the decryption of the ciphertext received, (**Cᵢ**), and all the other ciphertext
    excluding the first one:


    ```

    Pi= D (Ci) Ci-1

    ```


    In the following figure, the scheme of CBC mode encryption is represented:


    ![](img/2c67eb1b2bfb299c02a010d62900759c_85_0.png)


    Cipher Block Chaining (CBC) Mode Encryption


