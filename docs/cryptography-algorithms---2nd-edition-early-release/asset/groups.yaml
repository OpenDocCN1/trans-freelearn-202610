    ## 如何在 Zcash 加密货币中使用 Zk-SNARK 的简要说明


    在本节中，我们将分析 Zcash 背后的 zk-SNARK，一种新的加密货币，它旨在保护交易的安全性和隐私性，如 2020 年 11 月 12 日发布的一篇科学论文（*Demystifying
    the Role of zk-SNARKs in Zcash*）中所讨论的：”Zcash 算法的底层原理是它提供了一个功能齐全的、基于账本的数字货币，具有强大的隐私保证，而确保隐私的根源完全在于构建适当的
    zk-SNARK。“ 一篇关于 Zcash 的博客就零知识证明发表了以下声明：*允许一方（证明者）向另一方（验证者）证明某个陈述是真实的，而不会透露超出陈述本身有效性之外的任何信息。*
    在一种称为“知识证明”的零知识形式中，证明者可以在不透露任何有关内容的敏感信息的情况下证明一个陈述。但正如我们到目前为止所看到的，这些协议基于难以解决的问题，例如因式分解和离散对数，我们在前几节中看到其中一些可能容易受到各种攻击。采用
    ZKP 的一个原因是无需透露太多关于你的敏感数据或服务器身份的信息来对自己进行身份验证。另一个使用 ZKP 的原因是证明你知道 *某物* 而你想保密。这里，我们有两种主要不同的情况：


    - 在第一种情况下，假设验证者不知道陈述的内容。

    - 在第二种情况下，假设验证者已经知道陈述的内容，只需要验证其 *正确性*。


