    # Description of AES


    Discussing AES would alone require a dedicated chapter. In this section, I provide
    an overview of the algorithm. For those of you interested in knowing more, you
    can refer to the documentation presented by NIST (published on November 26, 2001)
    reported in the document titled *FIPS PUB 197*. I am limited in this chapter to
    describing the algorithm at just a high level and will give my comments and suggestions.
    Most importantly, to avoid any confusion, I will analyze AES in a different manner
    not found in other papers. My analysis of AES will be based on the subdivision
    of the algorithm into different steps. I have called these steps **Key Expansion**
    and **First Add Round Key**; then, as you will see later on, each step is divided
    into four sub-steps, called **SubBytes transformation**, **ShiftRows transformation**,
    **MixColumn**, and **AddRoundKey**. The important thing is to understand the scheme
    of the algorithm, then each round works similarly, and you can easily be guided
    to understand the mechanism of 10 rounds for a 128-bit key, 12 rounds for 192
    bits, and 14 rounds for 256 bits. **Key Expansion (KE)** works as follows:


    +   - The fixed key input of 128 bits is expanded into a key length depending
    on the size of AES: 128, 192, or 256.

    +   - Then, the **[K₁], [K₂],...[Kᵣ]** sub-keys are created to encrypt each round
    (generally adding **XOR** to the round).

    +   - AES uses a particular method called Rijndael''s *key schedule* to expand
    a short master key to a certain number of round keys.


    **First Add Round Key (F-ARK)** works as follows. It is the first operation. The
