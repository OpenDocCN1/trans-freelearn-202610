  - '[PAGE 11]


    # Figure 1.1 – Encryption process


    To get some utility from a cipher, we have to set up two operations: encryption
    and decryption. In simpler terms, we have to keep the message secret and safe
    for a certain period of time. We define **M** as the set of all the messages and
    **C** as the set of all the cryptograms. **Encryption** is an operation that transforms
    a generic message, **m**, into a cryptogram, **c**, applying a function, **E**:
    m -------- > f(E) -------- > c. **Decryption** is an operation that returns the
    message in cleartext, **m**, from the cryptogram, **c**, applying a function,
    **D**: c -------- > f(D) -------- > m. Mathematically, **D(E(M)) = M**. This means
    that the **E** and **D** functions are the inverse of each other, and the **E**
    function has to be injective. **Injective** means different **M** values have
    to correspond to different **C** values. Note that it doesn''t matter whether
    I use capital letters or lowercase, such as (**M**) or (**m**); it''s inconsequential
    at the moment. For the moment, I have used round brackets indiscriminately, but
    later I will use square brackets to distinguish secret elements of a function
    from known ones, for which I will use square brackets. So, the secret message
    **M** will be written as **[M]**, just like any other secret parameter. Here,
    just showing how the algorithms work is within our scope; we''ll leave their implementation
    to engineers. There is another important notation that is key to encryption/decryption.
    To encrypt and decrypt a message, it is necessary to set up a key. In cryptography,
    a key is a parameter that determines the functional output of a cryptographic
    algorithm or cipher. Without a key, the algorithm would produce no useful results.
    We define **K** as the set of all the keys used to encrypt and decrypt **M**,
    and **k** as the single encryption or decryption key, also called the session
    key. However, these two ways to define a key (a set of keys is **K** and a single
    key is **k**) will always be used, specifying what kind of key it is (private
    or public). Now that we understand the main concepts of cryptographic notation,
    it is time to explain the difference between private and public keys:


    +   - In cryptography, a private or secret key (**Kpr**), denoted as **[K]** or
    **[k]**, is an encryption/decryption parameter known only to one, both, or multiple
    parties in order to exchange secret messages.

    +   - In cryptography, a public key (**Kpu**) or (**K**) is an encryption key
    known by everyone who wants to send a secret message or authenticate a user.'
