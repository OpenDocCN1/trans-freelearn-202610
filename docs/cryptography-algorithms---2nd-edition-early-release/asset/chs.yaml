  \ 1 |\n| 1 ⊕ 0 | = 1 |\n| 1 ⊕ 1 | = 0 |\n\n图 2.6 – 表示 0 和 1 之间的 XOR（异或）运算\n\nXOR（异或）逻辑运算符不仅用于加密算法，还用作奇偶校验器。如果我们在逻辑电路中使用\
  \ XOR 来检查一个 8 位字中的奇偶校验位，它可以验证该字中 1 的总数是偶数还是不是偶数。现在我们已经探讨了布尔逻辑背后的运算，是时候分析对称算法家族中的第一个算法：DES。\n\
  \n明文首先被分成块。由于每个块分别加密，我们只需要分析一个块即可。密钥 [K] 由 9 位组成，消息 [M] 由 12 位组成。算法的主体部分与 DES 一样，是\
  \ S-Box，其中 S 代表替代（Substitution）。对称算法的真正复杂性和非线性函数就在这里。算法的其余部分只是对位的排列和移位，普通计算机可以自动完成，因此没有必要对此过于纠结。在这种情况下，S-Box\
  \ 是一个 4X16 矩阵，输入为 6 位，输出为 4 位。我们会发现，S-Box 存在于所有现代对称加密算法中，如 DES、Triple DES、Bluefish、Blowfish\
  \ 和 AES。四行由连续的 2 位表示，如下所示：00011011 而 16 列则由 4 位组成，顺序如下：0000 0001 0010 ..... .....\
  \ ..... ..... 1111 矩阵中的元素由 0 到 15 之间的随机数组成，这意味着它们在同一行内不会重复。为了更好地理解 S-Box 的实现方式和工作原理，这里有一个例子：011011。这串位有两个外部位\
  \ 01 和四个中间位 1101。在这种情况下（在二进制系统中，使用 N2 表示法），(01)₂ 对应第二行，(1101)₂ 对应第 13 列。通过找到列和行的交叉点，我们得到\
  \ (1001)₂。你可以在下图中看到所描述的 S-Box 矩阵的二进制数表示：\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_50_0.png)\n\
