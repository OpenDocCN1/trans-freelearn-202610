  \ 不存在。\n\n在下图中，你可以看到 AES 中加密和解密的完整过程：\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_81_0.png)\n\
  \n图 2.29 – AES 中的加密和解密方案\n\n在描述了 AES 的加密和解密操作之后，我们现在分析该算法上的攻击和漏洞。\n\n## AES 中的攻击与漏洞\n\
  \nNSA 和 NIST 的出版物认为 AES 对任何已知类型的攻击都是不可攻破的。然而，AES 有其漏洞；事实上，每一个可实现系统都存在漏洞。\n\n**重要提示**\n\
  \n回想一下 NIST 报告提到的 AES 可能存在的漏洞（2000 年 10 月 2 日记录）。你可以在 [https://www.nist.gov/news-events/news/2000/10/commerce-department-announces-winner-global-information-security](https://www.nist.gov/news-events/news/2000/10/commerce-department-announces-winner-global-information-security)\
  \ 阅读。\n\nNIST 文档中指出，*每个候选算法都被要求支持 128、192 和 256 位的密钥长度。对于 128 位密钥长度，大约有 340,000,000,000,000,000,000,000,000,000,000,000（340\
  \ 后跟 36 个零）种可能的密钥。* 然而，尽管理论上 AES 仍然不可攻破，**(-x%)**，即使用尽全世界的暴力破解手段（你将在*第 9 章，加密搜索引擎*中看到\
  \ AES 的计算分析），任何算法中仍然总是可能找到漏洞。在实现阶段常见到漏洞。事实上，请注意如果你使用例如 ECB 模式的 AES 会发生什么。我们已经在 DES\
  \ 中看到了 ECB 模式。这种基本实现包括将明文划分为多个块，并对每个明文块 P，计算密文 C：`C = Encr(P)`。你可以在下图中看到 ECB 模式加密的方案：\n\
  \n![](img/2c67eb1b2bfb299c02a010d62900759c_82_0.png)\n\n电子密码本（ECB）模式加密\n\n*图 2.30\
  \ – ECB 模式加密*\n\n如果 AES 以 ECB 模式实现，如上图所示，在中间（原始图像和用\n\n```\nCF A3 1C F4 67 F3 2D\
  \ 49.....\n```\n\n加密的图像之间），你会发现相同的模式被重复。一个非常著名的例子是 ECB 模式下的企鹅图像：即使原始图像和加密图像看起来不同，加密图像中仍然存在可辨认的结构，这表明\
  \ ECB 模式不能很好地隐藏明文中的模式。\n\n## ECB 模式实现示例：重放攻击\n\n假设 Alice 通过 ATM 使用 AES 以 ECB 模式加密她的银行卡信息。当她输入密码时，ATM\
  \ 会向银行发送类似以下内容的加密消息：\n\n- **消息**：`A3 2F 1B 7C ...`（加密的账户信息）\n\n- 银行在检查账户后回答：**[OK]**。\n\
  \n如果 Eve 正在监听通信并截获了加密消息，她可以简单地重复该操作几次，直到她从账户中偷走 Alice 的所有钱。银行只会认为 Alice 正在进行多次 ATM\
  \ 取款，而如果不对这种攻击采取行动，受害者（Alice）将失去她账户中的所有钱。这个技巧有效是因为 Eve 多次重新发送相同的复制消息。如果 **【K】**\
  \ 密钥在每次加密会话中都不改变，Eve 就可以尝试这种攻击。一个非常有效的解决方案是只接受每个会话不同的密码文，这消除了对称加密用于多次传输的问题。否则，为了防止这种攻击，AES\
  \ 的实现之一（就像其他分组密码一样）是 CBC 密码块链接。CBC 执行分组加密，基于前一个块的值生成输出。我们将在*第 9 章，加密搜索引擎*中的*CSE\
  \ 计算分析*部分再次看到这种实现，届时我会介绍我们在 CBC 模式中实现 AES 加密的 CSE。这里我只解释它是如何工作的。CBC 方法使用 64 位块大小用于明文、密文和初始化向量\
  \ **IV**。本质上，**IV** 是一个随机数，有时称为*盐*，与明文进行**异或**以计算块。只需记住以下内容：\n\n- **E** = 加密\n-\
  \ **D** = 解密\n- **C** = 密文\n\n### 加密过程如下：\n\n- 计算初始块 **C₀**，取明文第一块（**P₀**）与初始化向量（**IV**）进行**异或**：\n\
  \n```\nC0 = E (P0 IV)\n```\n\n- 每个后续块通过将前一个密文块与明文块进行**异或**，并对结果进行加密来计算：\n\n```\n\
  Ci = E ( Pi Ci-1)\n```\n\n### 解密过程如下：\n\n- 要获得明文（**P₀**），将收到的第一个密文块（**C₀**）的解密结果与初始化向量（**IV**）进行**异或**：\n\
  \n```\nP0 = D (C0) IV\n```\n\n- 要获得所有其他明文（**Pᵢ**），我们必须对收到的密文（**Cᵢ**）的解密结果与除第一个之外的所有其他密文进行**异或**：\n\
  \n```\nPi= D (Ci) Ci-1\n```\n\n下图表示了 CBC 模式加密的方案：\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_85_0.png)\n\
  \n密码块链接（CBC）模式加密\n\n*图 2.32 – CBC 模式加密方案*\n\nAES 是一种健壮的对称算法，直到 2009 年，唯一成功的攻击是所谓的侧信道攻击。这类攻击主要与\
  \ AES 在某些特定应用中的实现有关。以下是侧信道攻击的列表：\n\n- **缓存攻击：** 通常，一些信息存储在内存缓存中（计算机中的一种二级内存）；如果攻击者远程监视缓存访问，他们可以窃取密钥或明文。为了避免这种情况，有必要保持内存缓存干净。\n\
  \n\n\n\n- **Timing attack:** 这是一种利用执行加密所需时间的方法，其基于时序与参数值之间的相关性。如果攻击者已知消息的一部分或密钥的一部分，他们可以比较实际执行时间和建模的执行时间。从本质上讲，这更可以被视为对代码不良实现的一种*物理*攻击，而非逻辑攻击。无论如何，这种攻击不仅适用于\
  \ AES，还适用于 RSA、D-H 以及其他依赖于参数相关性的算法。\n\n- **Power monitoring attack:** 就像时序攻击一样，硬件实现中可能存在固有的潜在漏洞。你可以在以下链接找到一个有趣的攻击实验，涉及\
  \ Arduino Uno 上 AES 128 位实现的功耗相关性。该攻击影响了该算法的 **ARK** 和 **SB** 函数，通过监控设备的功耗获得了完整的\
  \ 16 字节密文密钥。对于硬件爱好者来说，这是一种令人兴奋的攻击：\n  https://www.tandfonline.com/doi/full/10.1080/23742917.2016.1231523\n\
  \n- **Electromagnetic attack:** 这是另一种针对算法实现的攻击。曾有一项攻击尝试在 FPGA 上进行，通过示波器测量从天线发出的辐射。\n\
  \n最后，AES 的真正问题在于密钥交换。由于这是一种对称算法，Alice 和 Bob 必须在执行加密和解密操作之前就共享密钥达成一致。即使 AES 的少数应用可以在没有密钥交换的情况下实现，大多数应用仍需要非对称算法来弥补密钥传输的不足。我们将在下一章探索非对称加密时更好地理解这一概念。此外，在分析\
  \ CSE 时，我们将在 *第 9 章，Crypto Search Engine* 中看到一个不需要任何密钥交换的应用。\n\n## Summary\n\n在本章中，你学习了对称加密。我们探讨了理解对称加密、KE\
  \ 和 S-Box 功能所必需的布尔运算。然后，我们深入研究了简单 DES、DES、3DES 和 DESX 的工作原理及其主要漏洞和攻击。在这些主题之后，我们分析了\
  \ AES（Rijndael），包括其实现架构以及使该算法如此强大的步骤的逻辑。关于 AES 的漏洞和攻击，你已经了解了 ECB 模式与 CBC 模式之间的差异如何使其容易受到分组密码实现攻击的影响。最后，我们探讨了一些适用于大多数密码算法的知名侧信道攻击。这些主题至关重要，因为现在你已经学会了如何实现一种对称密码算法，并且对它的特殊性有了更多的了解。我们将在下一章看到许多与此部分相关的关联。*第\
  \ 9 章，Crypto Search Engine* 将解释 CSE，该系统采用 AES 作为在云中传输加密文件的一种算法。现在你已经了解了对称加密的基础知识，是时候分析非对称加密了。\n"
- "# 3 Asymmetric Encryption\n\n## Join our book community on Discord\n\nhttps://packt.link/SecNet\n\
  \n![](img/2c67eb1b2bfb299c02a010d62900759c_89_0.png)\n\n非对称加密意味着使用不同的密钥对来加密和解密消息。非对称加密的同义词是公钥/私钥加密，但在非对称加密和公钥/私钥加密之间存在一些差异，我们将在本章中发现这些差异。从这种革命性加密/解密方法的历史略说起，我们将了解不同类型的非对称算法以及它们如何帮助保护我们的信用卡、身份和数据。本章将涵盖以下主题：\n\
  \n- 公钥/私钥与非对称加密\n- Diffie-Hellman 密钥交换及相关的中间人问题\n- RSA 和一个针对国际威胁的有趣应用\n- 对 RSA 的常规和非常规攻击的介绍\n\
  - **Pretty Good Privacy (PGP)**\n- ElGamal 及其可能存在的漏洞\n\n让我们开始吧！\n\n## Introduction\
  \ to asymmetric encryption\n\n私钥/公钥加密最重要的功能是在两个参与方之间交换密钥，同时提供安全的信息交易。要充分理解非对称加密，我们必须了解其背景。这种密码学在我们的日常生活中尤为重要。这是负责保护我们财务秘密的密码学分支，例如信用卡和在线账户；生成我们在生活中不断使用的密码；以及通常安全地与他人共享敏感数据并保护我们的隐私。让我们了解一下这个迷人密码学分支的历史。非对称密码学的故事始于\
  \ 20 世纪 70 年代末，但在 20 世纪 80 年代，随着互联网和数字经济的兴起，计算机开始进入家庭而得到发展。20 世纪 70 年代末至 80 年代是史蒂夫·乔布斯创立苹果公司的时期，也是美国与苏联冷战时期。这也是意大利、法国和德国等许多西方国家经济繁荣的时期。最后，也是互联网诞生的时期。西方集团与东方集团的对立，美国盟友一方，苏联集团另一方，在分裂的柏林城市中形成了对立的间谍网络。在此期间，对称密码学中交换的密钥达到了美国政府的\
  \ **通信安全局 (COMSEC)** 负责传输密码密钥，每天运输大量密钥的地步，该局负责传输密码密钥。这种问题情况恶化到了崩溃的边缘。仅举一个例子，在 20\
  \ 世纪 70 年代的 DES 算法中，银行通过快递员派遣密钥并当面交接。美国的 **国家安全局 (NSA)** 在拥有全球最强大的计算资源的情况下，也在密钥分发问题上苦苦挣扎。密钥分发问题似乎无解，即使对于致力于解决与世界未来相关最困难问题的\
  \ RAND 等大型公司也是如此——RAND 是另一家旨在管理未来问题和防止崩溃性故障的强大机构。我认为，有时，崩溃点只是清理局势的一种方式，而不是简单地忽视它。有时，问题有不同的解决方式。在非对称加密的情况下，无论政府投入多少资金，也无论拥有无限计算能力和多位大脑服务的超级计算机，都无法解决一个乍看之下似乎很容易解决的问题。现在你已经对非对称加密解决的主要问题有了大致了解，即密钥交换（实际上，我们将看到在\
  \ RSA 中，这个问题被转化为消息的直接传输），让我们深入探索参与这一极其有趣的密码学分支历史的先驱们。\n\n## The pioneers\n\n密码学家有时看起来很奇怪；有时他们可能是内向者，有时可能是外向者。*Whitfield\
  \ Diffie* 就是这种情况，他是一位独立的自由思想家，既不受政府雇佣，也不受任何大公司的雇佣。我第一次在 2016 年旧金山的一个会议上见到 Diffie，当时他正在与他的著名同事\
  \ *Martin Hellman* 和 *Ronald Rivest* 讨论密码学。给我留下最深刻印象的事情之一是他优雅的白色着装，与他高大的身材、长长的白发和白胡子形成鲜明对比。就像一个永远年轻、仍停留在\
  \ 20 世纪 60 年代的人，他的当代人可能是华尔街证券交易所的代理人，也可能是印度的圣人。他是现代密码学的奠基人之一，他的姓名将永远铭刻在公钥/私钥加密的历史中。Diffie\
  \ 出生于 1944 年，1965 年毕业于波士顿的麻省理工学院。毕业后，他从事网络安全领域的工作，后来成为 20 世纪 70 年代最真实的独立密码学家之一。他被描述为\
  \ *cyberpunk*，以纪念 20 世纪 60 年代和 70 年代的 *new wave* 科幻运动，在该运动中，控制论、人工智能和黑客文化结合成一个反乌托邦的未来主义设定，倾向于关注\
  \ *低生活和高科技的结合*。早在 20 世纪 60 年代，美国国防部开始资助一项名为 **国防高级研究计划局 (DARPA)**，也称为 **ARPA** 的通信领域新先进研究计划。ARPA\
  \ 的主要项目是将军事计算机连接起来，以在电信中创建更具弹性的安全等级。该项目旨在防止核攻击事件中的通信中断，但网络也允许科学家之间发送调度和信息，以及已执行的计算，以利用连接计算机的空闲容量。**ARPANET**\
  \ 于 1969 年正式启动，仅连接了四个站点，随后迅速增长，以至于到 1982 年，该项目催生了互联网。20 世纪 80 年代末，许多普通用户已连接到互联网，此后他们的数量\n\
  \n\n\n爆炸了。当 ARPANET 正在成长时，Diffie 开始思考有一天，每个人都会拥有一台计算机，并且借助它互相发送电子邮件。他还设想了一个世界，在那里产品可以通过互联网销售，真正的货币被信用卡所取代。他对隐私和数据安全的高度关注使\
  \ Diffie 着迷于一个问题：如何在完全不知道电缆另一端是谁的情况下与他人进行通信。此外，加密消息和文档通常是在发送极有价值的信息时进行的；数据加密开始被普通大众用来隐藏信息并与其他人分享秘密。这正是密码学使用变得普遍的时期，它不仅仅局限于军事、政府或学术界。需要解决的主要问题是，如果两个素不相识的人通过互联网相遇，如何在除了文档本身之外不交换任何额外信息的情况下加密/解密共享文档，而该文档是通过数学参数进行加密/解密的？这就是密钥交换问题的核心。1974\
  \ 年某一天，Diffie 前往 IBM 的 *Thomas Watson* 实验室进行访问，在那里他受邀发表演讲。他谈到了攻击密钥分配问题的各种策略，但房间里的人对他的解决方案持非常怀疑的态度。只有一个人分享了他的愿景：他是\
  \ IBM 的高级密码学家，提到一位斯坦福教授最近访问过实验室，并且对该问题有类似的愿景。这个人是 Martin Hellman。Diffie 如此兴奋，以至于当晚他就驱车前往美国的另一边加利福尼亚州帕洛阿尔托拜访\
  \ Hellman 教授。Diffie 与 Hellman 之间的合作将在密码学中因创造该领域最美丽的算法之一而闻名：**Diffie-Hellman 密钥交换**。我们将在下一节分析这一开创性算法。\n\
  \n## Diffie-Hellman 算法\n\n要理解 **Diffie-Hellman (D-H)** 算法，我们可以依赖所谓的 *思想实验* 或 *心理表征*，这是爱因斯坦经常使用的理论表征方法。思想实验是一个假设场景，你在其中在心理上将自己带入比纯理论方式面对问题更真实的情况。例如，爱因斯坦使用了一个非常流行的思想实验来解释相对论理论。他使用了从不同位置观察移动火车的比喻，火车内外的人都是观察者。我将在本书中经常应用这些心理形象化表征。让我们想象我们有两个角色，Alice\
  \ 和 Bob，他们想交换一条消息（在纸上），但城市里的主要邮局会检查所有信件的内容。因此，Alice 和 Bob 为如何秘密发送信件而苦恼，同时避免任何侵入；例如，把钥匙放在金属笼子里寄给\
  \ Bob。但由于 Bob 没有打开笼子的钥匙，Alice 和 Bob 必须先在某个地方见面，以便 Alice 把钥匙交给 Bob。再次，我们回到了交换钥匙的问题。经过很多很多次尝试，似乎不可能找到一个逻辑解决方案来解决这个问题，但终于有一天，Diffie\
  \ 在 Hellman 的支持下找到了解决方案，Hellman 后来对此说：“*上帝奖励傻瓜！*” 让我们探索 Alice 和 Bob 应该做什么来交换密钥的心理表征：\n\
  \n- **步骤 1：** Alice 把她的秘密信息放在一个用铁挂锁锁住的金属盒子里寄给 Bob，但自己保留钥匙。现在，请记住 Alice 用自己的钥匙锁住盒子，并且没有把它交给\
  \ Bob。\n- **步骤 2：** Bob 用自己的私钥再给盒子加上一个锁，然后重新寄回给 Alice。因此，Bob 第一次收到盒子时，他无法打开它。他只是给盒子再加了一个锁。\n\
  - **步骤 3：** 当 Alice 第二次收到盒子时，她可以自由地取下自己的挂锁，因为盒子仍然用 Bob 的钥匙锁着，如下图所示，当 Alice 最后一次重新寄出盒子时。请记住，信息始终在盒子内部。现在，盒子仅用\
  \ Bob 的挂锁锁着。\n- **步骤 4：** 当 Bob 这次收到盒子时，他可以打开它，因为盒子仅用他的挂锁锁着。最后，Bob 可以阅读 Alice 发送的信息内容，该内容一直保存在盒子内部。\n\
  \n正如你所见，Alice 和 Bob 从未见面交换任何挂锁钥匙。请注意，在这个例子中，盒子从 Alice 到 Bob 发送了两次，而在算法中则不是：\n\n\
  ![](img/2c67eb1b2bfb299c02a010d62900759c_94_0.png)\n\n前面的解释和表征并不是算法的确切做法，但它提供了一个被认为不可解决的问题的实用解决方案：密钥交换问题。现在，我们必须把这种实际论证转变成逻辑数学表征。首先，我们将回到使用模数学，同时利用有限域中运算的一些特定性质。\n\
  \n## 离散对数\n\n我将尝试在不使用过多符号的情况下解释密码学背后的数学，只是我不想让你感到困惑，或用沉重的数学论文来充斥这本书。这不在本书的范围之内。\n\
  \n当我们谈论有限域时，我们考虑的是一个有限的整数群 (**n**)，(**Z**)，位于一个环中——让我们说，(**Zn**)。这个数字群将受到与标准整数相同的数学规律的约束，例如运算。由于我们在这里在一个称为\
  \ (**modulo n**) 的有限域中工作，我们必须考虑涉及模数学的一些关键问题。正如我们在上一章看到的那样，在 *模数* 中运算意味着每次到达集合末尾时都回绕到第一个数字。这就像钟表数学，当我们到达\
  \ 12 时回绕到 1。基本上，请记住在有限域中，存在一个 *数值周期*，其中数字和域运算的结果会重复出现。\n\n例如，如果我们有一个由七个整数组成的集合，{**0,\
  \ 1, 2, 3, 4, 5, 6**}，通常简写为 (**Z7**)，我们对这个有限域内执行的所有运算都会回绕到该域的整数中。\n\n以下是有限域 (**Z7,\
  \ +, x**)、加法和乘法的运算简短示例。由于所有运算 (**modulo 7**) 都有效，我们必须考虑数字每次超过 7 时都会回绕到 **0**：\n\n\
  1 x 1 ≡ 1 (mod 7)  \n2 x 4 ≡ 1 (mod 7)  \n3 + 5 ≡ 1 (mod 7)  \n3 x 5 ≡ 1 (mod 7)\n\
  \n让我们使用这种计数方式，并认为 = 符号等价于 ≡，这就是我们在小学学到的数学，其中 **2 + 2 = 4** 如果我们考虑例如模 3 的有限域则不完全适用：2\
  \ + 2 ≡ 1 (mod 3)。\n\n从高中数学中，我们回忆起 `log_a(z)` 对数是一个函数，其中 (**a**) 是底数。我们必须确定给 (**a**)\
  \ 的指数以得到数字 (**z**)。所以，例如，如果 **a = 10** 且 **z = 100**，我们发现对数是 **2**，我们说 **100 的以\
  \ 10 为底的对数是 2**。如果我们使用 Mathematica 计算对数，我们必须使用不同的记法，即 **Log[10, 100] = 2**。\n\n\
  在离散域中工作时，事情变得更加复杂，因此我们不再使用普通对数，而是开始使用离散对数。所以，让我们说我们必须解一个这样的方程：\n\n`a^[x] ≡ b (mod\
  \ p)`\n\n这将是一个非常困难的问题，即使我们知道 (**a**) 和 (**b**) 的值，因为没有已知的有效算法可以求解离散对数，即 [**x**]。\n\
  \n### 重要说明\n\n我使用了方括号来表示 [**x**] 是秘密的。技术上 [**x**]\n\n\n是一种离散幂运算，但求解离散对数和离散幂的问题在计算难度上是相同的。\n\
  \n现在让我们更深入一点，解释这个运算的动态原理。考虑计算下面的表达式：2^4 ≡ (x) (mod 13) 首先，我们计算 2^4 = 16，然后用 16 除以\
  \ 13，商为 1，余数为 3，因此 x = 3。离散对数正是其逆运算：2^[y] ≡ (x) (mod 13) 在这种情况下，我们已知底数为 2，需要计算 [y]。可以证明，能够生成\
  \ (x) 的 [y] 有无限多个解。以前面的例子来说，我们有：2^[y] ≡ 3 (mod 13) 求 [y]：一个解是 y = 4，但并非唯一解。对于这个方程的所有整数\
  \ (n)，结果 3 同样成立：[y] = [y + (p-1)*n] 让我们证明 n = 1 的情况：2^[4+(13-1)*1] ≡ 2^16 (mod 13)，而\
  \ 2^16 ≡ 3 (mod 13)。n = 2 时同样成立：2^[4 +(13-1)*2] ≡ 2^28 (mod 13)，而 2^28 ≡ 3 (mod\
  \ 13)。以此类推……因此，该方程对所有整数（即 (n ≥ 0)）都有无限多个解：[y] ≡ 2^[4 + 12 n] (mod 13)。目前还没有在多项式时间内求解离散对数的方法。因此，在数学和密码学中，这个问题都被认为是非常难解的，即使攻击者拥有强大的计算能力。最后，我们需要引入生成元\
  \ (g) 的定义和记号：它是一个特殊的数，我们说 (g) 生成整个群 (Zp)。如果 (p) 是素数，这意味着 (g) 可以取 1 到 p-1 之间的任意值。\n\
  \n## 解释 D-H 算法\n\nD-H 并不是严格意义上的非对称加密算法，但它可以被恰当地定义为公钥/私钥算法。非对称加密与公钥/私钥之间的区别不仅是形式上的，更是实质性的。在后面的\
  \ RSA 部分（一个纯粹的非对称算法）中，你会更好地理解这一区别。相反，D-H 得到一个共享密钥，该密钥用于对称加密消息 [M]。用对称算法执行的加密会与 D-H\
  \ 共享密钥传输相结合，以生成密文 C：对称算法 E((D-H[k]), M) = C 换句话说，我们用\n\nD-H 算法生成共享密钥 [k]，然后用 AES\
  \ 或其他对称算法加密消息 [M]。D-H 并不直接加密秘密消息；它只能确定双方之间的共享密钥。这是一个关键点，我们将在下一段看到。然而，为了在离散域中工作，并利用离散对数问题在共享密钥时保护其免受攻击者的攻击，迪菲和赫尔曼实现了密码学中最健壮、最著名的算法之一。下面我们看看\
  \ D-H 是如何工作的：\n\n- **第 1 步：**爱丽丝和鲍勃首先就参数达成一致：(g) 作为环 (Zp) 中的生成元，以及一个素数 p（模 p）。\n\
  - **第 2 步：**爱丽丝选择一个秘密数字 [a]，鲍勃选择一个秘密数字 [b]。\n\n爱丽丝计算 **A ≡ g^a (mod p)**，鲍勃计算 **B\
  \ ≡ g^b (mod p)**。\n\n- **第 3 步：**爱丽丝将 (A) 发送给鲍勃，鲍勃将 (B) 发送给爱丽丝。\n- **第 4 步：**爱丽丝计算\
  \ **ka ≡ B^a (mod p)**，鲍勃计算 **kb ≡ A^b (mod p)**。\n\n**[ka = kb]** 将成为爱丽丝和鲍勃之间的共享密钥。下面是该算法的一个数值示例：\n\
  \n- **第 1 步：**爱丽丝和鲍勃就他们将要使用的参数达成一致，即 g = 7 和（模 11）。\n- **第 2 步：**爱丽丝选择一个秘密数字 (3)，鲍勃选择一个秘密数字\
  \ (6)。\n\n爱丽丝计算 **7^3 (mod 11) ≡ 2**，鲍勃计算 **7^6 (mod 11) ≡ 4**。\n\n- **第 3 步：**爱丽丝将\
  \ (2) 发送给鲍勃，鲍勃将 (4) 发送给爱丽丝。\n- **第 4 步：**爱丽丝计算 **4^3 (mod 11) ≡ 9**，鲍勃计算 **2^6 (mod\
  \ 11) ≡ 9**。\n\n数字 **[9]** 就是爱丽丝和鲍勃的共享密钥 **[k]**。\n\n## 分析该算法\n\n在算法的*第 2 步*中，爱丽丝计算\
  \ **A = g^a (mod p)**，鲍勃计算 **B = g^b (mod p)**。爱丽丝和鲍勃交换了 **(A)** 和 **(B)**，这是单向函数的公共参数。*单向函数*之所以得名，是因为不可能\
  \ **(-x%)** 从公共参数 **(A)** 反推出秘密私钥 **[a]**（对 **(B)** 和 **[b]** 也是如此），这是由离散对数的健壮性所决定的（参见*“离散对数”*一节）。模幂运算的另一个性质是，我们可以将\
  \ **B^a** 和 **A^b (mod p)** 写成如下形式：**B^a ≡ (g^b)^a (mod p)**，**A^b ≡ (g^a)^b (mod\
  \ p)**。因此，根据模指数运算的性质，我们有：**g^(b*a) ≡ g^(a*b) (mod p)**。例如，我们有：\n\n- 爱丽丝：**(7^6)^3\
  \ ≡ 7^(6*3) ≡ 9 (mod 11)**\n- 鲍勃：**(7^3)^6 ≡ 7^(3*6) ≡ 9 (mod 11)**\n\n这就是使 D-H\
  \ 算法得以成立的数学技巧。现在我们已经理解了该算法，接下来让我们指出它的缺陷以及可能对其进行的攻击。\n\n## 对 D-H 算法的可能攻击与密码分析\n\n\
  对 D-H 算法最常见的攻击是**中间人（MiM）攻击**。MiM 攻击是指攻击者潜入通信信道，窃听、阻断或篡改发送方与接收方之间的通信。通常，这种攻击由伊芙（攻击者）冒充对话中的两个真实参与者之一来实现：\n\
  \n![](img/2c67eb1b2bfb299c02a010d62900759c_99_0.png)\n\n*图 3.2 – 伊芙是“中间人”*\n\n回顾\
  \ D-H 算法*第 3 步*中的内容，爱丽丝和鲍勃交换了他们的公共参数 **(A)** 和 **(B)**。在这里，爱丽丝将 **(A)** 发送给鲍勃，然后鲍勃将\
  \ **(B)** 发送给爱丽丝。现在，伊芙（攻击者）通过冒充爱丽丝来干扰通信。因此，MiM 攻击看起来像这样：\n\n- **第 3 步：**爱丽丝将 **(A)**\
  \ 发送给鲍勃，鲍勃将 **(B)** 发送给爱丽丝。\n- **在这里，我们就遇到了 MiM 攻击：**伊芙将 **(E)** 发送给鲍勃，然后鲍勃将 **(B)**\
  \ 发送给伊芙，以为她是爱丽丝。\n\n让我们分析爱丽丝的函数 **A ≡ g^a (mod p)** 和鲍勃的函数 **B ≡ g^b (mod p)**。如果这是在普通算术中而不是在有限域中进行的，这一过程将至关重要。还有另一种可能的攻击，也被称为**生日攻击**，它是针对离散对数最著名的攻击之一。众所周知，在一群人中，至少有两个人会共享同一个生日，因此在循环群中，有可能找到一些相等的值（碰撞）来求解离散对数。\n\
  \n### 重要说明\n\n**(E)** 这里代表伊芙的公钥参数，它是由她的私钥生成的，而不是加密。\n\n与它的逻辑简洁性相匹配的是，其内部隐藏着如此强大的力量，以至于\
  \ 40 年后，它仍然被用于保护全球超过 80% 的商业交易。它的首字母缩写来自三位发明者的名字——**Rivest、Shamir 和 Aldemar**。**RSA**\
  \ 正是我们所称的完美的非对称算法。实际上，在 1997 年，英国密码机构 CESG 将公钥加密的发明归功于 1970 年的詹姆斯·埃利斯（James Ellis），该机构还宣称，1973\
  \ 年，克利福德·科克斯（Clifford Cocks）撰写了一份文档，展示了与 RSA 算法类似的一个版本。非对称算法的核心概念是加密密钥和解密密钥不同。回想我在*“Diffie-Hellman\
  \ 算法”*一节中关于挂锁的类比，当我描述 D-H 算法时，我们看到任何人都（不仅仅是爱丽丝和鲍勃）可以用挂锁锁住盒子。这就是 MiM 的真正问题所在，因为无法识别挂锁究竟是属于鲍勃还是爱丽丝。为了克服这个问题，可以进行另一个有趣的思维实验，使用类似的类比，但稍微改变一下条件。假设爱丽丝复制了许多她的挂锁，并将这些副本寄送到全国的每个邮局，而将能打开所有这些挂锁的钥匙保存在一个秘密的地方。如果鲍勃想给爱丽丝发送一条秘密消息，他可以去邮局索取爱丽丝的挂锁，把消息放进盒子里，然后锁上。这样，鲍勃（发送者）从锁上盒子的那一刻起就无法再打开它，但当爱丽丝收到盒子时，她可以用她独有的安全钥匙打开它。基本上，在\
  \ RSA 中（与 D-H 相反），鲍勃用爱丽丝的公钥加密消息。加密过程结束后，即使是鲍勃也无法解密该消息，而爱丽丝可以用她的私钥解密。正是这一步将非对称加密的概念从纯粹的理论转变为实际应用。RSA\
  \ 发现了如何用接收者的公钥加密消息并用私钥解密的方法。为了实现这一点，RSA 需要一种特殊的数学函数，稍后我们详细探讨该算法时，我会进一步解释。如前所述，这个算法有三位发明者。当时他们都是波士顿麻省理工学院的研究人员。我们说的是上世纪\
  \ 70 年代末。在 D-H 算法发明之后，罗纳德·里维斯特对这种新型密码学极为着迷。他先邀请了数学家伦纳德·阿德勒曼（Leonard Adleman），随后计算机科学系的另一位同事阿迪·沙米尔（Adi\
  \ Shamir）也加入了团队。里维斯特试图实现的是以数学方式发送秘密\n\nmessage encrypted with a public key and decrypt\
  \ it with the private key of the receiver. However, in D-H, the message can only\
  \ be encrypted once the key has been exchanged, using the same shared key. Here,\
  \ the problem was to find a way to send the message that had been encrypted with\
  \ a public key and decrypted through the private key. But as I've said, it needed\
  \ a very particular inverse mathematical function. This is the real added value\
  \ of the RSA invention that we are going to discover shortly.\n\nThe tale of this\
  \ discovery, as Rivest told it, is funny. It was April 1977 when Rivest and Adleman\
  \ met at the home of a student for Easter. They drank a little too much wine and\
  \ at about midnight, Rivest went back home. He started to think over the problem\
  \ that had been tormenting him for almost a year. Laying on his bed, he opened a\
  \ mathematics book and discovered the function that could be perfect for the goal\
  \ that the group had.\n\nThe function he found was a particular inverse function\
  \ in modular mathematics related to the factorization problem.\n\nAs I introduced\
  \ in *Chapter 1, Deep Diving into Cryptography*, the problem of factorizing a large\
  \ number made by multiplying two big prime numbers is considered very hard to solve,\
  \ even for a computer with immense computation power.\n\n## Explaining RSA\n\nTo\
  \ understand this algorithm, we will consider Alice and Bob exchanging a secret\
  \ message. Let's say that Bob wants to send a secret message to Alice, given the\
  \ following:\n\n- **M**: The secret message\n- **e**: A public parameter (usually\
  \ a fixed number)\n- **c**: The ciphertext or cryptogram\n- **p, q**: Two large\
  \ random prime numbers (the private keys of Alice)\n\nThe following is the public\
  \ and private key generation. As you will see, the core of RSA (its magic function)\
  \ is generating Alice's private key, [d].\n\nKey generation:\n\nAlice's public key,\
  \ (N), is given by the following code:\n\nN = p*q\n\nAs we mentioned earlier, multiplying\
  \ two big prime numbers makes (N) very difficult to factorize, and makes it generally\
  \ very difficult for an attacker to find [p] and [q].\n\nAlice's private key, [d],\
  \ is given by the following code:\n\n[d] * e ≡ 1 (mod [p-1]*[q-1])\n\nBob performs\
  \ the encryption:\n\nc ≡ M^e (mod N)\n\nBob sends the ciphertext, (c), to Alice.\
  \ She can now decrypt (c) using her private key, [d]:\n\nc^d ≡ M (mod N)\n\nAnd\
  \ that's it!\n\n**Note:** The bold elements – M, d, p, and q – in the algorithm\
  \ are protected and secret.\n\n**Numerical example:**\n\nM = 88\ne = 9007\np = 101\n\
  q = 67\nN = 6767\n\n**Step 1:** Bob's encryption is as follows:\n\n88^9007 ≡ 6621\
  \ (mod 6767)\n\nAlice receives a cryptogram, that is, c = 6621.\n\n**Step 2:** Alice's\
  \ decryption is as follows:\n\n9007 * d ≡ 1 (mod (101-1)*(67-1))\nd = 3943\n6621^3943\
  \ ≡ 88 (mod ...)\n\nAs you can see, the secret message, [M] = 88, comes back from\
  \ Alice's private key, [d] = 3943.\n\n## Analyzing RSA\n\nThere are several elements\
  \ to explain but the most important is to understand why this function, which is\
  \ used for decrypting (c) and obtaining [M], works:\n\nM ≡ c^[d] (mod N)\n\nThis\
  \ is Step 2; that is, the decryption function. I have just inverted the notation\
  \ by putting [M] on the left.\n\nThe reason it works is hidden in the key generation\
  \ equation:\n\n[d] * e ≡ 1 (mod [p-1]*[q-1])\n\n[d] is Alice's private key. For\
  \ Euler's theorem, the function will probably be verified because the numbers [p]\
  \ and [q] are very big and [M] is probably a co-prime of (N).\n\nIf this equation\
  \ is verified, then we can rewrite the encryption stage as follows:\n\n(M^e)^d (mod\
  \ N)\n\nFor the properties of the powers and Euler's theorem, we have the following:\n\
  \nM^(e*d) (mod N)\nde ≡ 1 (mod (p-1)*(q-1))\n\nThat is the same as writing M^1 =\
  \ M (mod N). So, by inserting [d] inside the decryption stage, Alice can obtain\
  \ [M].\n\n## Conventional attacks on the algorithm\n\nAll the attacks that will\
  \ be explained in the first part of this section are recognized and well known.\
  \ That is why we are talking about conventional attacks on RSA. The first three\
  \ methods of attack on RSA are related to the (mod N) public parameter. To perform\
  \ an attack on N = p*q, the attacker could do the following:\n\n- Use an *efficient*\
  \ algorithm of factorization to discover **p** and **q**.\n- Use new algorithms\
  \ that, under certain conditions, can find the numbers.\n- Use a quantum computer\
  \ to factorize **N** (in the future).\n\nLet's analyze the following three cases:\n\
  \n- In the first case, an efficient algorithm of factorization is not yet known.\
  \ The most common methods are as follows:\n  - The general number field sieve algorithm\n\
  \  - The quadratic sieve algorithm\n  - The Pollard algorithm\n- In the second case,\
  \ if (**n**) is the number of digits of **N = p*q** and the attacker knows the first\
  \ (**n/4**) digits or the last (**n/4**) digits of [**p**] or [**q**], then it will\
  \ be possible to factorize (**N**) in an efficient way. Anyway, there is a very\
  \ remote possibility of knowing it. For example, if [**p**] and [**q**] have 100\
  \ digits and the first (or the last) 50 digits of [**p**] are known, then it's possible\
  \ to factorize **N**.\n\nFor more information, you can refer to Coppersmith's method\
  \ of factorization. More cases related to Coppersmith attacks, as explained later\
  \ in this section, are where the exponents, (**e**) or [**d**], and even the plaintext,\
  \ [**M**], are too short.\n\n- If an attacker uses a quantum computer, it will be\
  \ theoretically possible to factorize **N** in a short time with Shor's algorithm,\
  \ and I am convinced that in the future, other, more efficient quantum algorithms\
  \ will arise. I will explain this theory in more detail in *Chapter 8, Quantum Cryptography*,\
  \ where we talk about quantum computing and Q-cryptography.\n\nFinally, if we have\
  \ a very short piece of plaintext, [**M**], and even the exponent, (**e**), is short,\
  \ then RSA could be breakable. This is because the power operation, **M^e**, remains\
  \ inside modulo **N**. So, in this phase of encryption, let's say we have the following:\n\
  \nM^e < N\n\nHere, it's enough to use the **e-th** root of (**c**) to find [**M**].\n\
  \n### Important Note\n\nI have used open brackets, **[M]**, to denote that the message\
  \ has been decrypted.\n\n**Numerical example:**\n\nM = 2\ne = 3\nN = 77\n2^3 ≡ 8\
  \ (mod 77)\n\nSince **e = 3**, by performing a simple cubic root, √, we can obtain\
  \ the message in cleartext:\n\n8^(1/3) = 2\n\nHere, we are working in linear mathematics\
  \ and no longer in modular mathematics.\n\nA way to overcome this problem is to\
  \ lengthen the message by adding random bits to it. This method is very common in\
  \ cryptography and cybersecurity and is known as **padding**. There are different\
  \ ways to perform padding, but here, we are talking about **bit padding**.\n\nAs\
  \ we covered in *Chapter 1, Deep Diving into Cryptography*, we can use ASCII code\
  \ to convert text into a binary system, so the message, **[M]**, is a string of\
  \ bits. If we add random bits (usually at the end, though they could also be added\
  \ at the start), we will obtain something like this:\n\n. . . | 1011 1001 1101 0100\
  \ 0010 0111 **0000 0000** |\n\nAs you can see, the bold digits represent the padding.\
  \ This method can be used to pad messages that are any number of bits long, not\
  \ necessarily a whole number of bytes long; for example, a message of 23 bits that\
  \ is padded with 9 bits to fill a 32-bit block.\n\nNow that we are more familiar\
  \ with RSA and modular mathematics properties, we'll explore the first interesting\
  \ application that was implemented with this algorithm.\n\n## The application of\
  \ RSA to verify international treaties\n\nLet's say that Nation Alpha wants to monitor\
  \ seismic data from Nation Beta to be sure that they don't experiment with any nuclear\
  \ bombs in their territory. A set of sensors has been installed on the ground of\
  \ Nation Beta to monitor its seismic activity, recorded, and encrypted. Then, the\
  \ output data is transmitted to Nation Alpha, let's say, via a satellite. This interesting\
  \ application of RSA works as follows:\n\n- Nation Alpha, **(A)**, wants to be sure\
  \ that Nation Beta, **(B)**, doesn't modify the data.\n- Nation Beta wants to check\
  \ the message before sending it (for spying purposes).\n\n\n\n\n\n对应于密文，(y)，确实只能由知道私钥，[d]\
  \ 的人生成。如果 Beta 之前曾试图通过改变 (x) 的值来操纵装有传感器的盒子内部的加密，那么 Beta 就很难得到有意义的消息。正如我们之前提到的，在此协议中，RSA\
  \ 被倒置了，加密是使用私钥 [d] 执行的，而不是 (e) 这个公共参数，这是通常发生的情况。本质上，Beta 在修改加密时的困难在于得到一个有意义的数字或消息。即使\
  \ (x) 参数事先已知，尝试修改密文 (y) 也具有与执行离散对数相同的复杂度（这是一个我们已经看到的难以解决的问题）。我们通过参考以下图表来可视化该过程：\n\
  \n## 地震记录系统\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_107_0.png)\n\nSensor is\
  \ buried beneath the surface\n\nSatellite Transmitter\n\nRecorder\n\nFigure 3.3\
  \ – The sensor buried underground with the data transmitted via satellite\n\n现在我们已经学会了如何使用\
  \ RSA 算法执行的国际条约，我想介绍一个将在第 6 章《公钥/私钥加密中的新算法》中稍后讨论的部分，涉及对 RSA 算法及其最著名的库 OpenSSL 的非常规攻击。\n\
  \n## 非常规攻击\n\n我称这些算法为 *非常规*，因为它们是由我实现的，并且直到现在尚未经过测试和发表。我们在继续阅读本书时会看到，这些针对 RSA 的\
  \ *非常规攻击* 甚至对其他非对称加密算法也有效。这些非常规攻击在 2011 年至 2014 年间实现，其范围在于在不知道 Alice 的解密密钥 **[d]**\
  \ 以及 (**N**) 背后的素数秘密 **[p]** 和 **[q]** 的情况下恢复秘密消息 **[M]**。我将在本节中展示这些非常规攻击，但我将在 *第\
  \ 6 章，新算法在公钥/私钥加密中* 中更详细地介绍这些方法。其中一些攻击用于 RSA，但可以转用于本章涵盖的大多数非对称算法。一种可能在未来破解因式分解问题的全新算法是\
  \ *NextPrime*。它源自一位挚友在 2009 年向我解释机制的 *遗传算法*，Gerardo Iovane。在他的文章 *The Set of Prime\
  \ Numbers* 中，Gerardo Iovane 描述了如何从一个简单算法开始，通过从模式中剔除非素数来获得所有素数。\n\n### Note\n\nFor\
  \ a more accurate and thorough discussion of Gerardo Iovane's genetic algorithm,\
  \ you can read *The Set of Prime Numbers* at https://arxiv.org/abs/0709.1539.\n\n\
  经过多年的工作和许多头痛之后，我得出了一个代表曲线的数学函数；该曲线上的每个位置代表一个素数，而在许多位置之间存在由两个素数生成的半素数 (**N**)。该曲线在几何上代表了宇宙中的所有素数。事实证明，(**N**)\
  \ 的位置始终位于曲线上两个素数 **[p]** 和 **[q]** 位置之间，并且 (**N**) 与它们的位置几乎等距。也可以证明素数具有非常清晰的顺序，并非如人们所相信的那样随机放置且无序。两个素数对象\
  \ **[p]** 和 **[q]** 之间的 *距离*，其乘积决定了 (**N**)，相当于位于 **[p]** 和 **[q]** 之间的素数个数。例如，17\
  \ 和 19 之间的 *素数距离* 为零，1 和 100 之间的距离为 25，10,000 和 10,500 之间的距离仅为 55。目前，该算法仅在特定条件下有效：例如，当\
  \ **[p]** 和 **[q]** *彼此相当接近* 时（在多项式距离内）。然而有趣的是，两个素数有多大并不重要。我用该算法进行了一些测试，使用了 10^1,000\
  \ 位量级的素数。仅为说明这些数字有多大，你可以认为 10^80 代表宇宙中的粒子数。例如，一个 10^1,000 位量级的半素数对应于 RSA 的公钥长度约为\
  \ 3,000 位（目前密码学中使用最大的公钥之一）。如果两个素数彼此接近，使用 NextPrime 算法可以在几秒钟内处理完毕。在撰写本书时，我正在基于量子计算机开发\
  \ NextPrime 算法的版本。它可能是下一代量子计算因式分解算法（类似于我们在 *第 8 章，量子密码学* 中将要研究的 Shor 算法）。现在，让我们继续分析攻击\
  \ RSA 的其他可能性。如以下图表所示，算法中有两个攻击点：一个是 (N) 的因式分解，另一个是离散幂，**[M^e]**：\n\n## 对离散对数的攻击\n\
  \n![](img/2c67eb1b2bfb299c02a010d62900759c_110_0.png)\n\n## 对因式分解的攻击\n\n> *Figure\
  \ 3.4 – Points where it is possible to attack RSA*\n\n密码学家的大多数 *常规* 分析都集中在对 **(N)**\
  \ 进行因式分解，正如我们所见。但 RSA 不仅存在因式分解问题；还有另一个与指数 **(e)** 相关的问题，我们将在 *第 6 章，新算法在公钥/私钥密码学*\
  \ 中看到。\n\n这些方法本质上是 *后门*，可以在不知道发送者的秘密参数 **[d]**、**[p]** 和 **[q]** 的情况下恢复消息 **[M]**。我们将在\
  \ *第 6 章，新算法在公钥/私钥密码学* 中理解，当我们分析这些攻击方法时，它们相当于在 RSA 算法及其主要库 OpenSSL 内部创建一个后门。我们已经检查过的\
  \ RSA 范式指出，一旦消息被交付，Bob（发送者）就无法退回消息。\n**然而，如果我们应用那些非常规方法来破解 RSA，这一范式就不再有效。** Bob\
  \ 可以自行创建他的“伪加密”以退回消息 **[M]**，该消息使用 Alice 的公钥加密，而伪密文可以通过 RSA 的解密阶段由 Alice 解密。这种方法是否是不合理的模型，不代表实际情境，还是具有实际用途？我将把这个问题的答案留给\
  \ *第 6 章，新算法在公钥/私钥密码学*。现在，让我们探索另一种基于 RSA 实现的协议，它已成为流行的软件：PGP。\n\n## PGP\n\n**Pretty\
  \ Good Privacy (PGP)** 可能是世界上使用最广泛的加密软件。PGP 由 Philip Zimmermann 在冷战期间实现。Philip 开始计划带家人搬到新西兰，因为他相信，在核攻击事件中，这个与世隔绝的国家将受到原子毁灭的影响较小。在某个时候，在计划搬往新西兰时，他的想法发生了变化，他决定留在美国。为了与朋友沟通，Zimmermann，这位反核活动家，开发了\
  \ PGP 以保护通过互联网传输的消息和文件。他以开源的方式发布软件，非商业用途免费。当时，大于 40 位的密码系统被视为弹药。也就是说，密码学仍然被视为军事武器。如果你决定为新的密码系统申请专利，你必须获得国防部授权才能发表。这是一个\
  \ PGP 遇到的问题，它从未使用小于 128 位的密钥。违反这一法律要求的处罚和刑事起诉非常严重，这就是为什么 Zimmermann 多年来一直处于 *待决法律状态*\
  \ 直到\n\n\n\n美国政府决定关闭调查并为他洗清嫌疑。PGP 并不是一个合适的算法，而是一个协议。这里的创新只是将非对称加密与对称加密合并。该协议使用非对称加密算法来交换密钥，并使用对称加密来加密消息并获得密文。此外，还需要数字签名来识别用户并避免中间人攻击。以下是该协议的步骤：\n\
  \n- **步骤 1：** 密钥使用非对称加密算法传输（ElGamal、RSA）。\n- **步骤 2：** 通过非对称加密传输的密钥成为对称加密的会话密钥（DES（请记住我们已经看到它现在可以被破解）、Triple\
  \ DES、IDEA 和 AES – 我们在 *第 2 章，对称加密简介* 中介绍过这些）。\n- **步骤 3：** 使用数字签名来识别用户（我们将在 *第\
  \ 4 章，介绍哈希函数和数字签名* 中研究 RSA 数字签名）。\n- **步骤 4：** 使用对称密钥进行解密。\n\nPGP 是一个非常好的协议，用于提供极好的隐私并保护商业秘密的传输。\n\
  \n### ElGamal 算法\n\n该算法是 D-H 算法的非对称版本。ElGamal 旨在克服 D-H 中中间人问题以及密钥所有权签名不可行的难题。此外，ElGamal（就像\
  \ RSA 一样）是一个真正的非对称算法，因为它在事先交换密钥的情况下加密消息。这里的困难通常与求解离散对数有关。正如我们稍后会看到的，这里也存在一个与因式分解相关的问题。ElGamal\
  \ 是我们将要探索的第一个呈现新元素的算法：一个由发送方选择并保密的整数随机数，**[k]**。这是一个重要的创新元素，因为它使加密具有“临时性”，即 **[k]**\
  \ 使加密函数不可预测。此外，我们将在 *第 5 章，零知识协议简介* 中经常看到这个新元素与零知识协议相关。让我们看看该算法的实现方式以及它如何用于传输秘密消息，[M]。\n\
  \nAlice 和 Bob 始终是两个参与者。Alice 是发送方，Bob 是接收方。下面的图表显示了 ElGamal 算法的流程：\n\n**公共参数**\n\
  \n- (p)：素数\n- (g)：生成元\n\n**密钥生成**\n\n- **Alice：** 随机选择 [k] 整数秘密\n- **Bob：** 选择 [b]\
  \ 作为他的私钥；Bob 计算 B ≡ g^b (mod p)（这段话类似于 D-H）\n\n**Alice 的加密**\n\n- y1 ≡ g^k (mod\
  \ p)\n- y2 ≡ M*B^k (mod p)\n- Alice 向 Bob 发送 (y1, y2)\n\n**Bob 的解密**\n\n- Kb ≡ y1^b\
  \ (mod p)\n- y2 * InvKb ≡ M (mod p)\n\n*图 3.5 – ElGamal 算法的加密/解密*\n\n如 Bob 解密的最后一步所示，我们可以看到\
  \ (mod p) 中的一个逆乘法。这种操作本质上是在有限域中执行的除法。因此，如果 A 的逆是 B，我们有 A*B = 1 (mod p)。下面的示例展示了使用\
  \ Mathematica 实现的这种倒数模函数的实现。现在，在解释了算法之后，让我们看一个数值示例来理解它。\n\n**公开定义的参数**\n\n公共参数是\
  \ p（一个大素数）和 g（一个生成元）：\n\n- p = 200003\n- g = 7\n\n**密钥生成**\n\nAlice 选择一个随机数 [k]\
  \ 并保密。\n\n- k = 23（Alice 的私钥）。\n\nBob 从他的私钥 [b] 开始计算他的公钥 (B)：\n\n- b = 2367（Bob\
  \ 的私钥）\n- B ≡ 7^2367 (mod 200003)\n- B = 151854\n\n**Alice 的加密**\n\nAlice 生成一个秘密消息\
  \ [M]：\n\n- M = 88\n\n然后，Alice 计算 (y1, y2)，她将发送给 Bob 的两个公共参数：\n\n- y1 ≡ 7^23 (mod\
  \ 200003)\n- y1 = 90914\n- y2 ≡ 88 * 151854^23 (mod 200003)\n- Alice 将参数发送给 Bob（y1\
  \ = 90914；y2 = 161212）。\n\n**Bob 的解密**\n\n首先，Bob 通过将 y1 = 90914 提升到他的私钥 **b** =\
  \ 2367 来计算 (Kb)：\n\n- Kb ≡ 90914^2367 (mod 200003)\n- Kb = 10923。\n\n使用 Reduce[Kb*x\
  \ − 1, x, Modulus -> p]（使用 Wolfram Mathematica 执行）在 (mod p) 中求倒数 Kb：\n\n- Inverted\
  \ Kb ≡ 192331 (mod 200003)。\n\n最后，Bob 可以恢复消息 **[M]**。Bob 取 (y2) 并乘以 **[Inverted\
  \ Kb]**，恢复消息 [M]：\n\n- y2 * InvKb ≡ M (mod 200003)。\n\n最终结果是消息 **[M]**：\n\n- 161212\
  \ * 192331 ≡ 88 (mod 200003)。\n\nElGamal 加密用于免费的 **GNU Privacy Guard (GnuPG)** 软件。多年来，GnuPG\
  \ 获得了广泛的流行，成为私人通信和数字签名的事实上的标准免费软件。GnuPG 使用 PGP 的最新版本来交换加密密钥。如需了解更多信息，您可以访问该软件的网页：[https://gnupg.org/software/index.xhtml](https://gnupg.org/software/index.xhtml)。\n\
  \n### 重要说明\n\n正如我之前提到的，ElGamal 算法背后的基本问题被认为是离散对数。这是因为，正如我们所见，公共参数和密钥都是由依赖于离散对数的方程定义的。\n\
  \n例如，**B ≡ g^b (mod p); Y1 ≡ g^k (mod p)** 和 **Kb ≡ y1^b (mod p)** 都是与离散对数相关的函数。\n\
  \n尽管离散对数问题被认为是 ElGamal 中的主要问题，但我们也有因式分解问题，如下所示。让我们回到加密函数 **(y2)**：y2 ≡ M*B^k (mod\
  \ p)。在这里，你可以看到存在乘法。因此，攻击者也可以尝试通过对 **(y2)** 进行因式分解来获得消息。如果我们简化该函数会更清楚：H ≡ B^k (mod\
  \ p)。然后，我们有以下关系：y2 ≡ M*H (mod p)。这可以重写为：M ≡ y2/H (mod p)。正如你所见，(y2) 是 **[M*H]**\
  \ 的乘积。如果有人能找到 **(y2)** 的因子，他们很可能能找到 **[M]**。\n"
- "# 4 哈希函数和数字签名\n\n- 哈希函数\n- 使用 RSA 和 ElGamal 的数字签名\n- 盲签名\n\n因此，让我们首先介绍哈希函数及其主要用途。然后我们将更深入地对数字签名算法进行分类。\n\
  \n## 哈希函数的基本解释\n\n哈希函数在密码学中被广泛用于许多应用。正如我们在 *第 3 章，非对称算法* 中已经看到的那样，其中一个应用是在消息被数字签名时对交换的消息进行\
  \ *盲化*。这是什么意思？当 Alice 和 Bob 使用任何非对称算法交换消息时，为了识别发送方，通常需要签名。一般来说，我们可以说签名是针对消息 **[M]**\
  \ 执行的。出于我们稍后会学到的原因，直接对秘密消息进行签名是不鼓励的，因此发送方必须首先将消息 **[M]** 转换为一个函数 **(M')**，每个人都可以看到。这个函数称为\
  \ **M 的哈希**，在本章中将用以下符号表示：**f(H)** 或 **h[M]**。我们将在本章后面更关注哈希与数字签名之间的关系。然而，我将哈希函数与数字签名一起放在本章中，主要是因为哈希函数对于签名消息至关重要，即使我们可以在数字签名的范围之外找到与哈希函数相关的许多应用，例如与区块链相关的应用，如\
  \ *分布式哈希表*。它们在搜索引擎领域也有用处。因此，我们的第一个问题是：什么是哈希函数？答案可以在这个词的含义中找到：hash——*切碎*，在这种情况下指的是消息或任何其他信息的内容被压缩成更小的一部分。*给定任意长度的消息\
  \ [M] 作为输入，运行哈希函数 f(H)，我们得到一个确定固定维度的输出（消息摘要）(M')*。如果你还记得在 *第 2 章，对称加密简介* 中看到的位扩展（*Exp-function*），这在概念上与哈希很接近。位扩展函数使用给定的位输入进行扩展。我们在哈希函数中具有相反的任务，其中输入维度大于哈希的位值。我们称哈希函数（或简单地称为哈希）为\
  \ **单向函数**。我们稍后会看到这个属性\n\n\n\n单向性对于哈希函数的分类至关重要。单向函数意味着从一个方向计算结果很容易，但从函数输出反推原始消息则极其困难（甚至不可能）。让我们看看哈希函数所具备的性质：\n\
  \n- 给定输入消息 [M]，可以非常快速地计算出其消息摘要 h(M)。\n- 从通过 h(M) 计算得到的输出 (M') 反推出原始消息 [M] 几乎是不可能的。\n\
  - 在计算上应当难以找到两个不同的输入消息 [m1] 和 [m2]，使得：\n\n  h(m1) = h(m2)\n\n在这种情况下，我们可以说该哈希函数是强无碰撞的。\n\
  \n举一个哈希函数的例子：如果我们想要维基百科全部内容的消息摘要，它会变成如下所示的固定长度位串：\n\n1010101010010000001000010100101101011011111010101001010\
  \ 101010100……\n\n（一个非常长的消息：大英百科全书编码）\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_119_0.png)\n\
  \n[0101010101010011011111001010]\n\n（160 位的消息摘要）\n\n图 4.1 – 哈希摘要示例\n\n另一个很好的哈希函数比喻可以是漏斗绞肉机，如下所示，它将明文作为输入进行消化，输出固定长度的哈希：\n\
  \n![](img/2c67eb1b2bfb299c02a010d62900759c_120_0.png)\n\n*图 4.2 – 用“漏斗绞肉机”象征哈希函数*\n\
  \n接下来的问题是：哈希函数为什么用、用在哪里？回顾本章开头所说的，在密码学中，哈希函数被广泛用于各种不同的场景：\n\n- 哈希函数通常用于非对称加密，以避免在收集数字签名时暴露原始消息\
  \ **[M]**（本章后面会讲到）。相反，原始消息的哈希以 **(M')** 作为替代物来证明发送者的身份。\n- 哈希用于检查消息的完整性。在这种情况下，接收方基于原始消息的数字哈希\
  \ **(M')**，可以轻松检测是否有人修改了原始消息 **[M]**。事实上，例如在大英百科全书 **[M]** 的整个内容中只改变 1 个比特，其哈希函数\
  \ **h(M)** 的哈希值 **h(M')** 将与之前的完全不同。哈希函数的这一特性至关重要，因为我们需要一个强大的函数来验证原始内容未被修改。\n- 此外，哈希函数还用于数据库索引。我们将在本书中多次看到这些函数。在*第\
  \ 9 章“加密搜索引擎”*中实现的*加密搜索引擎*里会大量用到它们，在*第 8 章“量子密码学”*中也会看到。实际上，哈希函数是*抗量子*的候选方案，这意味着哈希函数*在特定条件下*能够抵御量子计算机的攻击。\n\
  - 安全哈希函数的基础概念是：给定输出 **h(M)**，从该输出反推原始消息是困难的。\n\n满足这类特性的函数是*离散对数*，我们在讨论非对称加密时已经见过：g^a\
  \ = y (mod p)，你可能还记得，给定输出 (y) 并且知道 (**g**)，很难找到秘密私钥 **[a]**。然而，像离散对数这样的函数在实践中似乎太慢，而且也不够强。如上面所见，哈希函数的一个特点是计算快速。我们已经了解了哈希函数及其特性，现在来看实现哈希函数的主要算法。\n\
  \n## 主要哈希算法概述\n\n由于哈希算法是一种特殊的数学函数，它从可变输入产生固定长度的位输出，因此它应当是无碰撞的，这意味着很难找到两个产生相同哈希值的不同输入消息。哈希算法有很多类型，但最常见和最重要的是\
  \ **MD5**、**SHA-2** 和 **CRC32**，本章我们将重点介绍**安全哈希算法（SHA）** 家族。最后，作为知识补充，还有 **RIPEMD-160**，这是欧盟科学家在\
  \ 20 世纪 90 年代初开发的算法，有 160 位版本以及 256 位和 320 位的其他版本。该算法没有像 SHA 家族那样成功，但它可能是安全性的合适候选，因为至今它从未被攻破。SHA\
  \ 家族由**美国国家安全局（NSA）** 开发，是本章的研究对象。我将提供必要的知识，帮助你理解和学习 SHA 家族的工作原理。特别是 **SHA-256**\
  \ 是目前使用的哈希函数。\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_124_0.png)\n\n图 4.4 –\
  \ 左移位运算示意图\n\n例如，十进制数 23，在字节表示中是 00010111。如果我们执行一次左移位，会得到以下结果：\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_124_1.png)\n\
  \n图 4.5 – 左移位运算示例（移动 1 位）\n\n左移位运算后的结果是 (00101110)₂ = 十进制 46。\n\n- **X >> r**：这是右移位运算。它与上一个运算类似，但将位向右移动。\n\
  \n下图展示了右移位运算的示意图：\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_125_0.png)\n\n图 4.6\
  \ – 右移位运算示意图（移动 1 位）\n\n和前面一样，我们以十进制数 23 为例，它在字节表示中是 00010111。如果执行一次右移位运算，结果将是十进制数\
  \ 11，如下例所示：\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_125_1.png)\n\n图 4.7 – 右移位运算示例（移动\
  \ 1 位）\n\n- **X <<< r**：这是左循环移位。这个运算符（也表示为 <<<）表示位的循环旋转，类似于移位，但关键区别在于初始部分变成了末尾部分。它在\
  \ SHA-1 算法中用于将变量 A 和 B 分别旋转 5 位和 30 位（A<<<5; B<<<30），这一点将在下一节中进一步说明。\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_126_0.png)\n\
  \n图 4.8 – 左循环移位示意图（移动 1 位）\n\n如果我们将左循环移位应用于十进制数 23 的二进制表示，会得到以下结果：\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_126_1.png)\n\
  \n图 4.9 – 左循环移位示例\n\n在这种情况下，左循环移位运算的结果与左移位运算相同：(00101110)₂ = 46。但是，如果执行右循环移位，会得到以下结果：\n\
  \n![](img/2c67eb1b2bfb299c02a010d62900759c_127_0.png)\n\n在这种情况下，运算结果是 **(10001011)₂\
  \ = 139**，以十进制表示。\n\n- 这个运算符表示模 **和 (X+Y) (mod 2^32)**，在 SHA 中用于表示该运算，你稍后在我们分析 SHA-1\
  \ 算法时会看到（*图 4.14*）。\n\n在分析了用于执行哈希函数的逻辑运算符之后，要实现哈希函数还需要考虑两个问题：\n\n- 在 SHA 中，例如有一些常量\
  \ (**Kt**)，范围从 **0 到 n**（我们将在下一节中看到）。\n- 记号通常用十六进制表示。\n\n现在让我们看看十六进制系统是如何工作的。它使用\
  \ 0 到 9 的二进制数，每个数字由 4 位组成，例如：0 = 0000，1 = 0001，2 = 0010，… 9 = 1001。然后，从 10 到 15\
  \ 有 6 个大写字母，**A、B、C、D、E、F**，总共达到 16（hex）。\n\n\n\n\n\nnumbers: A = 1010, B = 1011,\
  \ …, F = 1111。 为了更好地理解，在下面的图中，你可以看到二进制、十六进制和十进制系统之间的比较：\n\n| Binary | Hexadecimal\
  \ | Decimal |\n|---|---|---|\n| *b = 2* | *b = 16* | *b = 10* |\n| 0000 | 0 | 0\
  \ |\n| 0001 | 1 | 1 |\n| 0010 | 2 | 2 |\n| 0011 | 3 | 3 |\n| 0100 | 4 | 4 |\n| 0101\
  \ | 5 | 5 |\n| 0110 | 6 | 6 |\n| 0111 | 7 | 7 |\n| 1000 | 8 | 8 |\n| 1001 | 9 |\
  \ 9 |\n| 1010 | A | 10 |\n| 1011 | B | 11 |\n| 1100 | C | 12 |\n| 1101 | D | 13\
  \ |\n| 1110 | E | 14 |\n| 1111 | F | 15 |\n\n*Figure 4.11 – Comparison between binary,\
  \ hexadecimal, and decimal systems*\n\n十六进制系统用于表示字节，其中 1 个字节是 8 位二进制数。例如，1 个字节（8\
  \ 位）表示为 (1111 0010)₂ = [F2]₁₆ = 242。\n\n现在我们有了定义哈希函数的工具，让我们继续实现 SHA-1，它是 SHA 家族中最简单的模型。\n\
  \n## Explanation of the SHA-1 algorithm\n\n**Secure Hash Algorithm 1 (SHA-1)** 由\
  \ NSA 设计。自 2005 年以来，它已被认为不安全，并被其继任者 SHA-2 和 SHA-3 取代。在本节中，我们将简单地将 SHA-1 作为案例研究，以更好地理解哈希函数的实现方式。\n\
  \nSHA-1 基于迭代过程返回 160 位输出。这个概念在接下来的几行中会更清晰。对于其他哈希函数，消息 **[m]** 由可变位输入组成，被拆分为 512\
  \ 位定长块：**m = [m₁, m₂, m₃, …, mₗ]**。在本节的最后一部分，你将看到如何将 2,800 位的输入消息 **[m]** 转换为每个\
  \ 512 位的块 **[m₁, m₂, …, mₗ]**。\n\n块通过压缩函数 **f(H)** 进行处理，该函数将当前块与上一轮得到的结果结合起来。有四轮，对应于变量\
  \ **t**，其范围分为如 *Figure 4.12* 所示的四个 t 范围，每个范围由 20 步组成，共 80 步。每次迭代可以看作是一个计数器，沿着每个由\
  \ 20 个值组成的范围的值运行。\n\n如 *Figures 4.12 and 4.13* 所示，每次迭代使用常数 **Kₜ** 和对应轮的运算 **fₜ(B,\
  \ C, D)**。每一轮依次更新子寄存器（A, B, C, D, E）。在第 4 轮结束时，当 t = 79 时，子寄存器（A, B, C, D, E）被加到子寄存器（H₀,\
  \ H₁, H₂, H₃, H₄）上，以获得最终的 160 位哈希值。\n\n现在让我们检查 SHA-1 中常数的问题。常数是固定数字，以十六进制表示，并根据特定标准定义。选择\
  \ SHA 中常数时采用的一个重要标准是避免碰撞。碰撞发生在哈希函数对两个不同的块给出相同的结果时，从不同的常数开始。因此，即使有人可能会认为更改常数的值是个好主意，也不要尝试更改它们，因为这可能会导致碰撞问题。在\
  \ SHA-1 中，例如，给定的常数如下：\n\nKₜ = {\n\n- 5A827999 if 0 ≤ t ≤ 19\n- 6ED9EBA1 if 20 ≤\
  \ t ≤ 39\n- 8F1BBCDC if 40 ≤ t ≤ 59\n- CA62C1D6 if 60 ≤ t ≤ 79\n\n}\n\n*Figure 4.12\
  \ – The Kₜ constants in SHA-1*\n\n其中，在 t 的不同范围内，常数 Kₜ 对应不同的值，如前图所示。除了常数之外，我们还有函数\
  \ fₜ(B, C, D) 定义如下：\n\nfₜ(B, C, D) = {\n\n- (B ∧ C) ∨ ((¬B) ∧ D) if 0 ≤ t ≤ 19\n\
  - B ⊕ C ⊕ D if 20 ≤ t ≤ 39\n- (B ∧ C) ∨ (B ∧ D) ∨ (C ∧ D) if 40 ≤ t ≤ 59\n- B ⊕\
  \ C ⊕ D if 60 ≤ t ≤ 79\n\n}\n\n*Figure 4.13 – The fₜ function*\n\nSHA-1 的第一个初始寄存器是\
  \ X₀，一个由五个子寄存器（H₀, H₁, H₂, H₃, H₄）生成的 160 位哈希函数，每个子寄存器为 32 位。我们将在第 2 步中使用十六进制数表示的常数来初始化这些子寄存器。\n\
  \n现在让我们通过将过程分为四个步骤来解释 SHA-1 算法，以获得 160 位的最终哈希值：\n\n- **Step 1 –** 从消息 [m] 开始，进行位连接操作，使得：\n\
  \n  y = m₁ || m₂ || m₃ || … || mₗ\n\n  其中 || 符号表示消息 [mₗ] 的每个块由 512 位组成的位的连接。\n\n\
  - **Step 2 – Initialization of the sub-registers:** H₀ = 67452301, H₁ = EFCDAB89,\
  \ H₂ = 98BADCFE, H₃ = 10325476, H₄ = C3D2E1F0。\n\n你可能会注意到，这些常数以十六进制表示。它们是由该算法的设计者\
  \ NSA 选择的。\n\n- **Step 3 –** 对于 **j = 0, 1, …, L − 1**，执行以下指令：\n\n  a) **mⱼ = W₀\
  \ || W₁ || … || W₁₅**，其中每个 **Wⱼ** 由 **32** 位组成。\n\n  b) 对于 **t = 16** 到 **79**，置：\n\
  \n  **Wₜ = (Wₜ₋₃ ⊕ Wₜ₋₈ ⊕ Wₜ₋₁₄ ⊕ Wₜ₋₁₆) <<< 1**\n\n  c) 在开始时，我们置：\n\n  **A = H₀,\
  \ B = H₁, C = H₂, D = H₃, E = H₄**\n\n  每个变量（A, B, C, D, E）长度为 32 位，总子寄存器长度为 160\
  \ 位。\n\n  d) 对于 80 次迭代，其中 **0 ≤ t ≤ 79**，依次执行以下步骤：\n\n  **T = (A <<< 5) + fₜ(B,\
  \ C, D) + E + Wₜ + Kₜ**\n\n  **E = D, D = C, C = (B <<< 30), B = A, A = T**\n\n\
  \  子寄存器（A, B, C, D, E）被加到子寄存器（H₀, H₁, H₂, H₃, H₄）：\n\n  **H₀ = H₀ + A, H₁ = H₁ +\
  \ B, H₂ = H₂ + C, H₃ = H₃ + D, H₄ = H₄ + E**\n\n- **Step 4 –** 取以下作为输出：\n\n  **H₀\
  \ || H₁ || H₂ || H₃ || H₄**\n\n  这是 **160** 位的哈希值。这里可以看到 SHA-1 的方案（子寄存器为 **A, B,\
  \ C, D, E**）：\n\n## Notes and example on SHA-1\n\n在本节中，我们将更详细地分析 SHA-1 算法。由于步骤 1\
  \ 和 2 只是消息初始化和子寄存器初始化，算法的核心在于步骤 3，其中可以看到一系列数学运算，包括位连接、XOR、位移、位转置和位加法。\n\n最后，步骤 4\
  \ 将输出减少到 160 位，只是因为每个子寄存器 H₀、H₁、H₂、H₃ 和 H₄ 为 32 位。\n\n在步骤 1 中，我们提到输入提供的最小块消息必须为\
  \ 512 位。消息 [m] 可以分为 512 位的块，如果原始消息短于 512 位，我们必须应用填充操作，涉及添加位以完成块。\n\nSHA-1 用于计算任意消息的\
  \ 160 位长度的消息摘要，输入为消息。输入消息是一个位串，因此消息的长度是构成消息的位数（即空消息长度为 0）。如果消息中的位数是 8 的倍数（一个字节），为了紧凑，我们可以用十六进制表示消息。相反，如果消息不是字节的倍数，则必须应用填充。\n\
  \n填充的目的是使填充后消息的总长度为 512 的倍数。由于 SHA-1 在计算消息摘要时按顺序处理 512 位的块，获得强消息摘要的技巧是哈希函数必须在迭代运算中涉及的位上提供最佳的混淆/扩散等级。\n\
  \n填充过程由以下一系列步骤组成：\n\n- SHA-1 首先取原始消息并附加 1 位，然后是一串 0 位。\n- 添加 0 位以确保新消息的长度是 512 位的倍数。\n\
  - 为此目的，新消息的最终长度将为 n × 512。\n\n例如，如果原始消息长度为 2,800 位，它将被 1 位填充在末尾，然后是 207 位。因此，我们将有\
  \ 2,800 + 1 + 207 = 3,008 位。然后，为了使填充结果为 512 的倍数，使用除法算法，注意 3,008 = 5 × 512 + 448，所以为了达到\
  \ 512 的倍数，我们用 64 个零填充消息。因此，我们最终得到 3,008 + 64 = 3,072，这就是填充后消息的位数，可被 512（每块位数）整除。\n\
  \n## Example of one block encoded with SHA-1\n\n让我们通过一个实际例子来理解这一点：\n\n- **Step 1\
  \ – Padding the message:**\n\n  假设我们想用 SHA-1 编码消息 **abc**，其在二进制系统中表示为：\n\n  **abc\
  \ = 01100001 01100010 01100011**\n\n  以十六进制，字符串为：\n\n  **abc = 616263**\n\n  如以下图所示，消息通过附加\
  \ 1，然后添加足够多的 0 直到消息长度变为 448 位来进行填充。由于消息 **abc** 的长度为 24 位，因此添加了另外 423 位。然后在末尾添加表示消息长度的\
  \ 64 位，产生一个 512 位长的消息：\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_134_0.png)\n\n\
  *Figure 4.15 – Padding of the message in SHA-1*\n\n- **Step 2 – Initialization of\
  \ the sub-registers:**\n\n  子寄存器 H₀、H₁、H₂ 和 H₃ 的初始哈希值将为：\n\n  H[0] = 67452301  \n\
  \  H[1] = EFCDAB89  \n  H[2] = 98BADCFE  \n  H[3] = 10325476  \n  H[4] = C3D2E1F0\n\
  \n- **Step 3 – Block contents:**\n\n  W[0] = 61626380  \n  W[1] = 00000000  \n \
  \ W[2] = 00000000  \n  W[3] = 00000000  \n\n  **On the sub-registers:**\n\n  | A\
  \ | B | C | D | E |\n  |---|---|---|---|---|\n  | t = 0: 011 |  |  |  |  |\n\n\n\
  \n\n\n寄存器：H[0] = 67452301 + 42541B35 = A9993E36 H[1] = EFCDAB89 + 5\n\n- **第 4 步\
  \ – 结果：**\n\n  执行完四轮后，字符串 **abc** 的 160 位哈希最终消息摘要为：A9993E36 4706816A BA3E2571 7850C26C\
  \ 9CD0D89D\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_136_0.png)\n\n图 4.16 – SHA-1\
  \ 中的完整一轮\n\n现在我们已经了解了哈希函数，接下来可以探索数字签名。\n\n## 认证与数字签名\n\n在密码学中，**认证**问题是最有趣也最难解决的问题之一。认证是访问控制过程中最敏感的功能之一（也是使用最广泛的功能）。认证基于三种方法：\n\
  \n- 基于*只有用户知道*的信息（例如密码）\n- 基于*只有用户持有*的物品（智能卡、设备或令牌）\n- 基于*表征用户*的特征（例如指纹、虹膜扫描，以及通常意义上一个人的生物特征）\n\
  \n除了这三种方法之外，还有一种方法涉及*只有用户持有、且与唯一表征他们的特征相关*的东西：**脑电波**。例如，当你看到一张图片或想到它时，你大脑激活的脑电波是独一无二的，不同于表征另一个人的任何其他脑电波。这项发明与人类/计算机之间的认证有关。换句话说，利用脑密码（Brain\
  \ Password），可以解锁计算机和电话等设备，并访问 Web 应用程序。我将在*第 6 章《公钥/私钥密码学的新算法》*中介绍脑密码。在下一节中，我们将分析一种基于数字签名的认证方法。请记住（我们稍后会看到），还有类似的认证方法，例如基于零知识的方法，这将在*第\
  \ 5 章《零知识协议入门》*中进一步介绍。让我们看看基于公钥/私钥加密的数字签名认证方法是如何工作的。考虑一个例子：Alice 想要向 Bob 发送一条消息。她知道\
  \ Bob 的公钥（如 RSA 中的公钥），因此 Alice 使用 RSA 加密消息 **[M]** 并将其发送给 Bob。让我们看看 Alice 发送消息时面临的一些常见问题：\n\
  \n- Bob 如何确定这条消息来自 Alice（*认证问题*）？\n- 在 Bob 收到消息后，Alice 总是可以否认她是发送者（*不可否认性*）。\n-\
  \ 另一个可能的问题是，消息 **[M]** 可能被篡改。\n\n我们现在将探讨如何以数学方式签署消息，以及任何人都可以如何验证签名。回顾第 3 章《非对称加密》中的\
  \ RSA 算法，我们知道 Bob 的加密过程如下：基于 Alice 的公钥 (Na) 执行加密，并定义方括号 [M] 中的秘密元素：[M]^e ≡ c (mod\
  \ Na)，其中 (Na) 是接收者（Alice）的公钥。因此，Bob 将使用 Alice 的公钥加密消息 [M]，而 Alice 将使用她的私钥 [da] 执行以下操作来解密\
  \ [M]：c^[da] = [M] (mod Na)，其中参数 [da] 是 Alice 的私钥，由以下运算给出：INV (e) ≡ [da] mod (p-1)(q-1)。Bob\
  \ 的数字签名和身份验证过程如下：\n\n- 第 1 步：Bob 选择两个大素数 [p1, q1]，并将它们保密。\n- 第 2 步：Bob 计算 Nb = [p1]\
  \ * [q1]，并将 (Nb) 作为他的公钥发布。\n- 第 3 步：Bob 计算他的私钥 [db]，使得：\n\n  ```\n  INV (e) ≡ [db]\
  \ mod (p1-1)(q1-1)\n  ```\n\n- 第 4 步：Bob 执行签名：\n\n  ```\n  S ≡ [M]^[db] (mod Nb)\
  \ 其中 (S) 和 (Nb) 是公开的，而 [db] 是秘密的。\n  ```\n\n那 [M] 呢？[M]（即消息）应该是秘密的，并且只在 Bob 和 Alice\
  \ 之间共享。然而，数字签名应该能被所有人验证。我们稍后将处理这个问题。现在让我们验证签名 (S)。\n\n- 第 5 步：验证签名：\n\n  签名验证是上述过程的逆过程。Alice（或任何人）可以验证以下等式：S^e\
  \ ≡ [M] (mod Nb)。如果上述等式成立，则 Alice 接受消息 [M]。在分析 [M] 的问题之前，让我们借助一个数值示例来理解该算法。数值示例：回顾第\
  \ 3 章《非对称加密》中的 RSA 示例，我们有以下由 RSA 算法给出的数值参数：[M] = 88, e = 9007。Alice 的参数如下：[p] =\
  \ 101, [q] = 67, Na = 6767。让我们执行 RSA 的所有步骤，以展示数字签名消息的完整过程：\n\n- 第 1 步 – Bob 的加密如下：\n\
  \n  [M]^e ≡ c (mod N), 88^9007 ≡ 6621 (mod 6767), c = 6621\n\n- 第 2 步 – Bob 将为消息\
  \ [M] 生成签名 (S)，如下所示：\n\n  Bob 选择两个素数 [p1, q1]：[p1] = 211, [q1] = 113, Nb = 211 *\
  \ 113 = 23843。[db] 的模方程为：\n\n  9007 * [db] ≡ 1 (mod (211-1)*(113-1))\n\n  [db] =\
  \ 9103\n\n  现在，Bob 可以对消息进行签名：[M]^[db] ≡ S (mod Nb), 88^9103 ≡ 19354 (mod 23843),\
  \ S = 19354。Bob 将 (c, S) 对发送给 Alice，即 (6621, 19354)。\n\n- 第 3 步 – Alice 的解密如下：\n\
  \n  c^[da] ≡ [M] (mod Na)。Alice 计算 [da]：9007 * [da] ≡ 1 (mod (101-1)*(67-1)), [da]\
  \ = 3943。Alice 解密密文 (c) 并获得消息 [M]：c^[da] ≡ [M] (mod Na), 6621^3943 ≡ 88 (mod 6767)\n\
  \n- 第 4 步 – 验证 Bob 的身份：\n\n  如果签名 (S) 取参数 (e) 次方后得到消息 [M]，那么 Alice 可以确信消息确实是由 Bob\
  \ 发送的：S^e ≡ [M] (mod Nb), 19354^9007 ≡ 88 (mod 23843)。确实，Alice 得到了消息 M=88。\n\n###\
  \ 重要说明\n\n我希望有人已经注意到，消息 [M] 可以被任何人验证，而不仅仅是 Alice，因为 (S, e, Nb) 都是公开参数。因此，如果 Bob\
  \ 使用原始消息 [M] 而不是其哈希 h[M] 来生成签名 (S)（参见上面的加密过程），那么任何知道 Bob 公钥的人都可以轻松恢复消息 [M]！只需解出以下方程即可恢复秘密消息\
  \ [M]：S^e ≡ x (mod Nb)。其中参数 (S, e, Nb) 都是已知的。在这种情况下，哈希函数就派上了用场。对消息执行哈希函数 h[M] =\
  \ (m) 后，Bob 将发送 (c, S) 对，并签署 (m) 而不是 [M]。Alice 已经收到了加密消息 [M]，因此只有 Alice 可以验证：h[M]\
  \ = m。如果为 TRUE，则 Bob 的身份将通过 Alice 的验证；如果为 FALSE，Bob 的身份声明将被拒绝。\n\n## 为什么数字签名有效？\n\
  \n如果除 Bob 之外的任何人尝试使用此签名，他们都会遇到离散对数问题。实际上，在以下等式中生成 [db] 对攻击者来说是一个难题：m^[db] ≡ S (mod\
  \ Nb)。此外，即使攻击者知道 (m, S)，计算 [db] 仍然非常困难。在这种情况下，我们处理的是离散对数问题，就像我们在第 3 章《非对称算法》中看到的那样。让我们通过一个例子来理解如果\
  \ Eve（攻击者）试图修改签名会发生什么：Eve（攻击者）将 [db] 替换为 (de)，计算伪造的数字签名 (S')：m^(de) ≡ S' (mod Nb)。如果\
  \ Eve 能够诱使 Alice 接受签名 (S')，那么 Eve 就可以通过假装自己是 Bob 进行中间人（MiM）攻击，用 (S') 替换真正的签名 (S)。但是当\
  \ Alice 验证签名 (S') 时，她会发现它不对应于 Bob 执行的正确签名，因为消息的哈希是 (m') 而不是 (m)：(S')^e ≡ m' (mod\
  \ Nb)，m' ≠ m。因此，Alice 拒绝该数字签名，并且不会打开来自该伪造地址的任何消息。这就是为什么密码学家还需要非常关注哈希之间的碰撞。现在我们得到了不同的结果，即\
  \ (m') 而不是 (m)，Alice 意识到存在问题，并且不接受消息 [M]。这就是签名 (S) 的作用。上述攻击只是一个简单的技巧，但还有一些更聪明、更隐蔽的攻击，我们将在第\
  \ 6 章《公钥/私钥密码学的新算法》中介绍非常规攻击时再作讨论。\n\n## 使用 ElGamal 算法的数字签名\n\n\n\n\n\n## ElGamal\n\
  \nElGamal 是一种公钥-私钥算法，正如我们在 *第 3 章，非对称算法* 中所见，基于 *Diffie-Hellman 密钥交换*。在 ElGamal\
  \ 中，我们对消息的签名方式与 RSA 不同，但所有方式都是有效的。回顾 ElGamal 加密技术，我们有以下元素：\n\n- **(g, p)**: 公共参数\n\
  - **[a]**: Alice 的私钥\n- **[M]**: 秘密消息\n- **B ≡ g^[b] (mod p)**: Bob 的公钥\n- **A ≡\
  \ g^[a] (mod p)**: Alice 的公钥\n\n**Alice 的加密：** y1 ≡ g^[k] (mod p), y2 ≡ [M] * B^[k]\
  \ (mod p)\n\n> **Note**\n>\n> 请记住，方括号内的元素表示秘密参数；其他所有都是公开的。\n\n现在，如果 Alice 想给消息加上她的数字签名，她将对消息做一个\
  \ *哈希*，**h[M]**，以保护消息 **[M]**，然后将结果传输给 Bob 以证明她的身份。为了对消息 **[M]** 进行签名，Alice 首先必须生成消息的哈希值：**h[M]\
  \ = m**。现在，Alice 可以使用 **[M]** 的摘要值 → **(m)** 进行明文操作，因为正如我们之前所学，从其密码学哈希值 **(m)**\
  \ 回到 **[M]** 几乎是不可能的。Alice 计算签名 **(S)** 使得：\n\n- **Step 1** – 求 **[k]** 在 **(mod\
  \ p-1)** 下的逆元：\n\n```\n[INVk] ≡ [k]^(-1) (mod p-1)\n```\n\n- **Step 2** – 执行方程：\n\
  \n```\nS ≡ [INVk] * (m - [a] * y1) (mod p-1)\n```\n\nAlice 将公共参数 **(m, y1, S)**\
  \ 发送给 Bob。\n\n- **Step 3** – 在第一次验证中，Bob 执行 **V1**：\n\n```\nV1 ≡ A^y1 * y1^S (mod\
  \ p)\n```\n\n验证步骤之后，如果 h[M] = m，Bob 得到验证的第二个参数 V2：\n\n```\nV2 ≡ g^m (mod p)\n```\n\
  \n最后，如果 V1 = V2，Bob 接受该消息。\n\n现在，让我们借助一个数值示例更好地理解该算法。\n\n### Numerical example\n\
  \n假设秘密消息的值为 **[M] = 88**。我们为其他公共参数分配以下值：\n\n- g = 7\n- p = 200003\n- h[M] = 77\n\
  \n第一步是私钥和公钥的“密钥初始化”：\n\n- **[b] = 2367** (Bob 的私钥)\n- **[a] = 5433** (Alice 的私钥)\n\
  \n在初始化过程中，Alice 计算密钥的逆元（步骤 1），然后计算签名（步骤 2）：\n\n- **Step 1** – Alice 计算 [k] 在 (mod\
  \ p-1) 下的逆元：\n\n```\n[INVk] ≡ [k]^(-1) (mod p-1) = 23^(-1) (mod 200003 - 1) = 34783\n\
  ```\n\n- **Step 2** – Alice 现在可以得到签名 (S)：\n\n```\nS ≡ [INVk] * (m - [a] * y1) (mod\
  \ p-1)\nS ≡ 34783 * (77 - 5433 * 90914) (mod 200002) = 72577\n```\n\nAlice 将公共参数\
  \ **(m, y1, S) = (77, 90914, 72577)** 发送给 Bob。\n\n- **Step 3** – 凭借这些参数，Bob 可以执行第一次验证\
  \ (V1)。因此，他计算 V2。如果 V2 = V1，Bob 接受数字签名 (S)：\n\n```\nV1 ≡ A^y1 * y1^S (mod p)\nV1\
  \ ≡ 43725^90914 * 90914^72577 (mod 200003)\n```\n\n对于第二次验证 (V2)：\n\n```\nV2 ≡ g^m\
  \ (mod p)\nV2 ≡ 7^77 (mod 200003) = 76561\n```\n\nBob 验证 V1 = V2。\n\n考虑到使该算法工作的底层问题，我们可以说它与离散对数相同。事实上，让我们分析验证函数：\n\
  \n```\nV1 ≡ A^y1 * y1^S (mod p)\n```\n\n所有元素都由离散幂构成，正如我们已经知道的那样，即使指数或底数已知，从离散幂中反推也是一件困难的问题（目前）。说离散幂和对数确保该算法的安全性是不够的。正如我们在第\
  \ 3 章《非对称密码学》中所见，以下函数也可能成为问题：\n\n```\ny2 ≡ [M] * B^[k] (mod p)\n```\n\n它由乘法给出。如果我们能够恢复\
  \ [k]，那么我们就发现了 [M]。因此，该算法不仅面临离散对数问题，还面临因子分解问题。\n\n现在你已经了解了数字签名的用途和实现，让我们继续探索另一个有趣的密码协议：盲签名。\n\
  \n## Blind signatures\n\nDavid Chaum 发明了 **盲签名**。他为匿名化 *数字支付* 而苦苦寻找一种密码系统。1990 年，David\
  \ 创立了 *eCash*，这是一种采用不可追踪货币的系统。不幸的是，该项目在 1998 年破产，但 Chaum 将永远被铭记为数字货币的先驱之一，也是现代加密货币的创始人之一，与比特币一起。\n\
  \nChaum 想要解决的底层问题如下：\n\n- 找到一种能够避免电子支付 *双花问题* 的算法。\n- 使数字系统 *安全且匿名* 以保证用户的 *隐私*。\n\
  \n1982 年，Chaum 发表了一篇题为 *Blind Signatures for Untraceable Payments* 的文章。以下是对文章中描述的盲签名的工作原理及其实现方式的解释。\n\
  \n对消息进行 *盲* 签名意味着在不知道内容的情况下进行签名。它不仅可用于数字支付，如果 Bob 例如想公开注册他创造的东西而不让他人知道其发明的细节时也可以使用。盲签名的另一个应用是在电子投票机中，在那里有人做出选择（例如，在总统选举或政党选举中）。在这种情况下，投票结果（传输的消息）显然必须为接收者所知，但如果投票者希望确保其选票被计入，则投票者的身份必须保持秘密（这正是盲签名的正确功能）。\n\
  \n我将在 *第 6 章，公钥/私钥密码学中的新算法* 中介绍 *MBXI 密码* 的一种创新盲签名方案，在那里我将介绍我在 2011 年发明并获得专利的 MBXI\
  \ 包括在内的公钥/私钥新密码。让我们现在通过使用 RSA 进行盲签名来看看 David Chaum 的协议如何工作。\n\n### Blind signature\
  \ with RSA\n\n假设 Bob 有一个重要的秘密，他不想在确定的日期之前公开。例如，他发现了一种治疗冠状病毒以避免癌症的强大疗法，并渴望获得诺贝尔奖。Alice\
  \ 代表诺贝尔奖委员会。Alice 挑选两个大的秘密素数 **[pa, qa]**：\n\n- **[pa * qa] = Na**，这是 Alice 的公钥。\n\
  - **(e)** 是 RSA 中已定义的相同公共参数。\n\n参数 **[da]** 是 Alice 的私钥，由以下运算给出：\n\n```\nINV(e)\
  \ ≡ [da] mod (pa−1)(qa−1)\n```\n\n假设 **[M1]** 是属于 Bob 的秘密。我只是称它为 **[M1]** 以将其与常规的\
  \ **[M]** 区分开来。Bob 挑选一个随机数 **[k]** 并将其保密。现在 Bob 可以对 **[M1]** 进行盲签名协议：\n\n- **Step\
  \ 1** – Bob 对 **[M1]** 执行加密 **(t)** 以 *盲化* 消息：\n\n```\nt ≡ [M1] * [k]^e (mod Na)\n\
  ```\n\nBob 将 (t) 发送给 Alice。\n\n- **Step 2** – Alice 可以通过以下运算执行盲签名：\n\n```\nS ≡ t^[da]\
  \ (mod Na)\n```\n\nAlice 将 (S) 发送给 Bob，Bob 可以验证盲签名是否对应消息 [M1]。\n\n- **Step 3** –\
  \ 验证：\n\nBob 计算 **(V)**：\n\n```\nS / [k] ≡ V (mod Na)\n```\n\n然后他可以验证以下内容：\n\n```\n\
  V^e ≡ [M1] (mod Na)\n```\n\n如果最后一次运算为 **TRUE**，则意味着 Alice 已有效地对 **[M1]** 进行了 *盲*\
  \ 签名。在这种情况下，Bob 可以确信以下内容：\n\n```\n[M1]^[da] ≡ V (mod Na)\n```\n\n由于除了 Alice 之外没有人能够在不解决\
  \ *离散对数* 问题的情况下执行函数 **(S)**（如 *第 3 章，非对称算法* 中已见），签名者一定是 Alice。这句话在任何其他变量出现之前都成立；例如，当有人找到解决离散对数的逻辑方法或量子计算机达到足以破坏算法的量子比特数时，就像我们在第\
  \ 8 章《量子密码学》中将看到的那样。\n\n让我们看一个例子以更好地理解该协议。\n\n### Numerical example\n\nAlice 定义的参数如下：\n\
  \n```\npa = 67\nqa = 101\ne = 17\n```\n\n因此，公钥 (Na) 为：\n\n```\n67 * 101 = Na = 6767\n\
  ```\n\nAlice 的私钥为：\n\n```\nda ≡ 1/e (mod (pa-1)(qa-1)) = 17^(-1) (mod 6600) = 1553\n\
  ```\n\n- **Bob 挑选一个随机数 [k]：**\n\n```\nk = 29\n```\n\nBob 计算 (t)：\n\n```\nt ≡ M1\
  \ * k^e ≡ 88 * 29^17 = 3524 (mod 6767)\n```\n\n- **Bob 将 (t) 发送给 Alice ———————————>\
  \ Alice 现在可以对 (t) 进行盲签名：**\n\n```\nS ≡ t^[da] ≡ 3524^1553 = 1533 (mod 6767)\n```\n\
  \n- **Bob 可以验证 (S) <———————————— Alice 发送 (S = 1533)：**\n\n```\nS / k ≡ V (mod Na)\n\
  1533 / 29 ≡ 2853 (mod 6767)\n```\n\n`Reduce[k*x == S, x, Modulus -> Na]`\n\nBob\
  \ 接受签名 (S)。\n\n正如你从这个例子和对盲签名的解释中看到的那样，Alice 确信 Bob 的发现（冠状病毒癌症疗法）属于他，而 Bob 可以在某个日期之前不声明其确切内容的情况下保留他的发明。\n\
  \n### Notes on the blind signature protocol\n\n你可以对 [M1] 进行双重检查，这样你就能意识到 Alice 确实在不知道其值的情况下签署了\
  \ [M1]：\n\n```\nM1^[da] ≡ V (mod Na)\n88^1553 ≡ 2853 (mod 6767)\n```\n\n关于盲签名需要一个警告，因为\
  \ Alice 不知道她将要签署的内容，因为 [M1] 隐藏在 (t) 中。因此，Bob 也可能试图说服 Alice 签署一张 100 万美元的支票。采用此类协议存在很多危险。\n\
  \n另一个考虑涉及可能的攻击。正如你在这里看到的，我们面临一个因子分解问题：\n\n```\nt ≡ M1 * [k]^e (mod Na)\n```\n\n\
  我们可以看出 (t) 是 [X * Y] 的乘积：\n\n```\nX = M1  <—— 因式分解问题\nY = k^e\n```\n\n攻击者无法确定 [k]\
  \ 并不重要，因为他们总可以尝试找到\n\n\n[M1] 通过对 φ(t) 进行因式分解，如果 [M1] 是一个小数，例如。这其实就是 M1 = 0 的情况，因为显然\
  \ φ(t) 会为零，攻击者可以发现消息 M = 0。另一方面，如果我们假设，例如，(k^e) 是一个小数，由于 [k] 是随机的，那么攻击者可以执行以下操作：\n\
  \n`Reduce[(k^e)*x == t, x, Modulus -> Na]`\n\nx = MESSAGE\n\n在这种情况下，如果不幸地 [k^e]\
  \ (mod Na) 是一个小数，攻击者就可以恢复消息 [M1]。你在阅读下一章后将理解，盲签名是零知识协议的先驱；这是下一章第 5 章《*零知识协议导论*》的研究对象。实际上，我们在这里发现的一些元素，例如随机数\
  \ [k]、盲签名的执行以及接收者执行的最后验证步骤 V = S/k，都运用了启发零知识协议的逻辑。\n\n## 小结\n\n在本章中，我们分析了哈希函数、数字签名和盲签名。在介绍哈希函数之后，我们从描述这些单向函数背后的数学运算开始，接着解释了\
  \ SHA-1。然后，我们通过实际的数值示例解释了使用 RSA 和 ElGamal 的数字签名，并研究了它们可能存在的漏洞。最后，我们引入了盲签名协议，将其作为实现电子投票和数字支付系统的加密工具。\n\
  \n因此，现在你已经了解了什么是哈希函数以及如何实现它。你也知道什么是数字签名，特别是你已经熟悉了 RSA 和 ElGamal 中的签名方案。我们还了解了可能导致数字签名泄露的漏洞以及如何修复它们。\n\
  \n最后，你已经了解了盲签名的用途及其应用领域。这些主题至关重要，因为我们在本书的后续章节中会大量使用它们。它们对于理解第 5 章《*零知识协议导论*》中解释的零知识协议，以及第\
  \ 6 章《*公钥/私钥密码学中的新算法*》中讨论的其他算法特别有用。最后，第 6 章将研究针对数字签名的新攻击方法。现在你已经学习了哈希函数和数字签名的基础知识，是时候在下一章中详细分析零知识协议了。\n\
  \n## 在 Discord 上加入我们的图书社区\n\nhttps://packt.link/SecNet\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_150_0.png)\n\
  \n正如我们在数字签名中已经看到的那样，认证问题是密码学在不久的将来将要面临的最重要、最复杂和最引人入胜的挑战之一。想象一下，你想在网上向一个不认识你的人证明你的身份。首先，你会被要求提供你的姓名、姓氏和地址；更进一步，你会被要求提供你的社会安全号码和其他能识别你的敏感数据。当然，你知道通过互联网暴露这些数据可能非常危险，因为有人可能会窃取你的私人信息并将其用于邪恶目的。\n\
  \n不久前，我看了一个给我留下深刻印象的视频。我甚至决定把它插入到我的关于隐私和安全的演示中，并在硅谷举行的一次与智慧城市相关的活动中展示了它，我当时被邀请去演讲。视频开始时，一个所谓的魔术师邀请人们进入一个搭建在城市中央的帐篷。魔术师一个接一个地读出每个人的过去和关于他们未来的某些事情。令人难以置信的是，这位魔术师（之前从未见过任何受访者）竟然知道那些惊讶的参与者生活的细节，而这些细节只有他们自己应该知道。\n\
  \n怎么可能？这真的是魔术，还是只是个把戏？在视频的结尾，把戏被揭穿了。魔术师知道参与者生活的所有细节——财务状况、拥有的资产，甚至信用卡号码——这要感谢一群坐在幕布后面的技术黑客，他们努力挖掘他们能找到的关于参与者的所有数字秘密。如果一个黑客知道你的身份，他们可以很容易地找出你大部分的数字生活。\n\
  \n在另一种情况下，你可能读过一则新闻：一伙窃贼在一个购物中心放置了一台假 ATM。每次有人插入银行卡并输入 PIN 码时，一台计算机就会记录这些信息，然后 ATM\
  \ 拒绝操作。一旦从卡中收集到信息并窃取到 PIN 码，黑客就可以克隆这些卡，连同 PIN 码一起复制，然后在真正的 ATM 机上取钱。\n\n如何阻止这种骗局？在许多情况下，需要敏感信息，例如密码和其他私人信息。如果黑客获得这些与个人或机器关联的信息，他们可以轻易地窃取身份，并对受害者造成严重破坏。\n\
  \n解决这类问题的一种方法是不要透露任何敏感信息，例如姓名、姓氏、地址、社会安全号码或 PIN 码，但这并不总是可能的。另一种方法是通过给出*知识证明*来避免暴露私人信息。知识证明本质上是一种避免提供超出必要信息，或在不暴露个人数据的情况下证明自己身份的方式。这些密码学协议被称为**零知识协议（ZKP）**，我们将在本章中学习它们。\n\
  \n在本章中，我们将涵盖以下主题：\n\n- 零知识协议的主框架和逻辑\n- 非交互式和交互式 ZKP（Schnorr 协议），包括示例和可能的攻击\n- SNARK\
  \ 协议和 Zcash 简述\n- 单轮 ZKP\n- 作者的新协议：ZK13 和零认证协议\n\n现在你已经了解了 ZKP 的世界以及它们的用途，是时候深入分析密码学中使用的主要场景和协议了。\n\
  \n## ZKP 的主要场景——数字洞穴\n\n想象这样一个奇妙的场景：佩奇必须向维克多证明她能够打开*阿里巴巴*洞穴中间的一扇锁着的门，这个洞穴是一个环形洞穴，只有一个入口/出口，可以从两个方向到达，如下图所示。我想你已经注意到，我把两个角色佩奇和维克多的名字从通常的\
  \ Alice 和 Bob 换掉了，因为这里需要验证，**佩奇**和**维克多**这两个名字与**证明者（P）**和**验证者（V）**的首字母更匹配。\n\n\
  ![](img/2c67eb1b2bfb299c02a010d62900759c_152_0.png)\n\n这个例子涉及现代版的阿里巴巴洞穴，洞穴中间的门通过一个秘密电子密码锁锁定，密码足够强大，可以阻止任何不知道秘密组合的人进入。现在，假设佩奇必须向维克多证明她知道打开门的密码，但不能把数字透露给他。因此，佩奇面临的挑战是*不*向维克多透露门的密码，因为佩奇不确定维克多是否知道它，而且她不想给维克多任何关于密码的信息。她只需要向维克多证明她可以从洞穴的另一侧出来。\n\
  \n换句话说，ZKP 是一个挑战，其答案不是透露所需的精确信息，而仅仅是证明解决底层问题的能力。事实上，证明知道某事的自然方式是透露它，验证也就自然而然地发生了。然而，这种直接展示你所知道的方法可能会透露超出所需的信息。通过\
  \ ZKP，佩奇可以避免泄露数字门的密码，同时，维克多可以肯定（即使他不知道密码），如果他看到佩奇从洞穴的另一侧出来，他就知道佩奇知道密码。\n\n实现 ZKP\
  \ 的方法有很多，因为正如你可以想象的那样，在许多场景中可能需要进行此类验证。例如，你可以把佩奇想象成一个人，把维克多想象成一台机器（ATM 或服务器）。佩奇必须向机器证明自己的身份，但她不想透露任何敏感数据，例如她的姓名或姓氏。她只需要向机器证明她确实是应该成为的那个人。在这种情况下，目的是避免泄露佩奇的身份。ZKP\
  \ 可以应用在这里。\n\nZKP 可以应用的另一个用例是计算机网络中虚拟机的认证。我们将在第 9 章《*加密搜索引擎*》中介绍这个用例，届时我们将使用 ZKP\
  \ 来抵御中间人攻击。ZKP 可以应用于除认证之外的其他类型的挑战，例如核裁军和区块链领域。\n\n现在，我们将深入探讨 ZKP 的应用，从分析用于证明陈述的非交互式协议开始。\n\
  \n## 非交互式 ZKP\n\n我们将在本节中分析的协议是一个**非交互式 ZKP**。这意味着证明者必须证明该陈述，假设\n\n\n\n\n- Eve（攻击者）选择一个随机数\
  \ **[r]**，并计算以下内容：\n\n**[r] \\* (v1) ≡ e (mod N)**\n\n**[r]** 和 **(e)** 是公开的，因此这是众所周知的。通过这个函数，Eve\
  \ 可以提取出 **(v1)**。\n\n- 与此同时，Eve 计算以下内容：\n\n**e \\* x ≡ c (mod N)**\n\n参数 **(e, c)**\
  \ 也是已知的。与第 1 步一样，这是模 **N** 下的逆乘法运算。该操作的目的是获得 **[x]**。然后，Eve 使用 **[x]**，将 **[x]**\
  \ 乘以 **[r]**，得到 **(v2)**：\n\n**x \\* r ≡ v2 (mod N)**\n\nEve 将 **(v1, v2)** 发送给\
  \ Victor，Victor 可以验证以下等式：\n\n**v1 \\* v2 ≡ c (mod N)**\n\nEve 可以冒充 Peggy，即使她并不知道\
  \ **[m]**，也可以声称自己知道 **[m]**！\n\n**数值示例：** **r = 39** 是 Eve 选择的秘密数字。（**N**、**c**、**e**）与前一个示例中的公共参数相同（**N\
  \ = 2430101**、**c = 160613**、**e = 9007**）。\n\n- **步骤 1：** Eve 计算 **v1**：\n\n**e\
  \ \\* r^-1 ≡ v1 (mod N)**\n\n**9007 \\* 436172 = 1557988 (mod 2430101)**\n\n**v1\
  \ = 1557988**\n\n- **步骤 2：** Eve 计算 **v2**。\n\n下一步操作是求解 **e \\* x ≡ c (mod N)**，通过逆模乘法得到\
  \ **(x)**：\n\n**9007 \\* x = 160613 (mod 2430101)**\n\n**x = 2031892**\n\n然后，Eve\
  \ 使用 **x** 计算 **v2**，执行以下运算：**x \\* r ≡ v2 (mod N)**，得到 **v2**：\n\n**v2 = 1480556**\n\
  \n在得到 **v2** 后，Eve 将（**v1 = 1557988**；**v2 = 1480556**）发送给 Victor。\n\n- **步骤 3：**\
  \ 验证阶段。\n\n最后，Victor 可以验证以下等式：\n\n**v1 \\* v2 ≡ c (mod N)**\n\n**1557988 \\* 1480556\
  \ = 160613 (mod 2430101)**\n\n攻击成功了！\n\n### 重要说明\n\n如果 Peggy 本人并不知道 **[m]**，但希望让\
  \ Victor 相信她知道，那么她自己也可能是这个骗局的主要参与者。\n\n这种攻击之所以有效，是因为 **(c)** 中包含 **[m]**，而我无需通过展示\
  \ **[m]** 的值来证明。该协议并不要求展示 **[m]** 或其哈希值 **[H(m)]**，因为 Peggy 不想向 Victor 透露任何关于 **[m]**\
  \ 的信息。请记住，这*不是*一个身份验证协议，而是一个 Peggy 知道 **[m]** 的断言（或知识）证明。为了完整性，我们还必须补充说明，**(c)**\
  \ 并不是两个大素数的乘积（如 **N** 那样），这一点你可能已经在示例中注意到了。因此，该协议的逻辑基础很薄弱：要找到两个乘积为 **(c)** 的数并不那么困难，即使\
  \ **(c)** 是一个很大的数。举个假设的例子，你可以设想这样一个场景：有两个国家，**(A)** 必须向 **(B)** 证明它拥有原子弹的配方。使用这种零知识证明（ZKP），**(A)**\
  \ 可以在实际上不知道 **[m]**（原子弹的配方）的情况下，声称自己知道 **[m]**。在某些条件下，这种攻击是可以避免的，其中一种条件如下：\n\n如果\
  \ Victor 已经知道 **[m]**，那么他可以要求 Peggy 向他发送消息的哈希值 **H[m]**。然后，Victor 可以验证（**v1** 和\
  \ **v2**）是否为正确的值，并根据哈希值与 **[m]** 的对应关系接受或拒绝该验证。在这种情况下，问题在于该协议的目的原本不是要证明某个已知的事实，而是要独立地证明某件事，无论它是否已知。最后这一点非常重要，因为如果\
  \ Victor 知道 **[m]**，该协议就有效；如果 Victor 不知道 **[m]**，该协议就失效。为了避免这些问题，我们必须切换到一种*交互式*协议，我们将在下一节中看到。\n\
  \n## Schnorr 的交互式 ZKP\n\n我们在前一节中看到的协议是一种非交互式协议，Peggy 和 Victor 之间并不互动，而只是存在一个*承诺*。该承诺要求\
  \ Peggy 必须向 Victor 表明她知道消息 **[m]**，同时不泄露关于它的任何信息。于是，她试图向 Victor 证明自己能够解决 RSA 难题（或其他困难的数学问题），以此作为她诚实的证明。然而，我们也已经看到，这个协议可以通过一个数学技巧被*绕过*。让我们看看下面这个交互式\
  \ ZKP 是否更健壮，能否防止可能具有破坏性的攻击。我们仍然以 Peggy 和 Victor 为主要角色。那么，让我们假设如下：\n\n- **p** 是一个大素数。\n\
  - **g** 是（**Zp**）的生成元。\n- **B ≡ g^a (mod p)** 是 Peggy 的公共参数。\n- （**p**、**g**、**B**）是公共参数。\n\
  - **[a]** 是承诺涉及的秘密数字。\n\nPeggy 声称她知道 **[a]**；假设 **[a]** 是打开钱包中一定数额资金的密码。为了证明这一说法，Peggy\
  \ 和 Victor 采用以下交互式协议：\n\n- **步骤 1：** Peggy 选择一个随机整数 **[k]**，其中 **1 ≤ k < p-1**。\n\
  \n她执行以下计算：**V ≡ g^k (mod p)**。Peggy 将 **(V)** 发送给 Victor。\n\n- **步骤 2：** Victor\
  \ 选择一个随机整数 **(r)**，其中 **1 ≤ r < p-1**。\n\nVictor 将 **(r)** 发送给 Peggy。\n\n- **步骤\
  \ 3：** Peggy 计算如下：\n\n**w ≡ (k - a \\* r) (mod p-1)**。Peggy 将 **(w)** 发送给 Victor。\n\
  \n- **步骤 4：** 最后，Victor 验证如下：\n\n**V ≡ g^w \\* B^r (mod p)**。如果该等式成立，Victor 就应该相信\
  \ Peggy 知道 **[a]**。\n\n让我们看看为什么该协议应该有效，以及为什么最后一个函数 **(V)** 能表明 Peggy 确实知道 **[a]**（即该承诺）。首先，我将说明为什么该协议在数学上是成立的，然后给出该协议的一个数值示例。\n\
  \n## 交互式 ZKP 的演示\n\n回顾以下公式：\n\n**V ≡ g^k (mod p)**\n\n**B ≡ g^a (mod p)**\n\n**w\
  \ ≡ k - a \\* r (mod p-1)**\n\n现在，我们将前面所有的等式代入最后一步的验证中。\n\n智能合约的执行（对 Peggy 而言）和所收到的付款（对\
  \ Victor 而言）均成功完成。然而，智能合约中固有的许多细节不会被透露。因此，zk-SNARKs 所起的作用对于掩盖这些秘密并执行智能合约至关重要。为了能够工作，该协议必须快速、安全且易于实现。正如我们已经看到的那样，你会注意到这正是零知识证明（ZKP）的目的——在不信任的环境中更轻松地穿行。在这里，我们讨论的是区块链和虚拟支付，但本质上这个过程是相似的。因此，在这种环境中，zk-SNARKs\
  \ 通过保护智能合约所涉及的步骤，同时证明所有这些步骤都已执行，来保守秘密。这样，它们就保护了个人和公司的隐私。请记住——并不是因为你要变得极度怀疑，而是因为你应该现实一点——上述说法在特定条件下才成立，我会尝试如下解释：\n\
  \n- 证明者给出的证明与选作知识证明的基础算法具有相同的计算难度。\n- 不存在通过捷径或伪造证明来欺骗验证者的数学方法（例如，将伪造的参数代入 **V ≡\
  \ g^w \\* B^r (mod p)** 等式中，以避免知道 **[a]**）。\n\n那么，让我们来看看 zk-SNARK 是如何工作的。\n\n##\
  \ 理解 zk-SNARK 的工作原理\n\n在本节中，首先我将尝试概述 zk-SNARKs 的一般工作原理，然后我们将介绍一个与基于离散对数的知识证明相关的\
  \ zk-SNARK 协议。正如我们在其他 ZKP 中已经看到的，一个 zk-SNARK 由三个部分或要素组成——（G）、（P）和（V）：\n\n- **G：**\
  \ 这是一个密钥生成器，它使用一个私密参数（即声明或另一个随机密钥）来生成公共参数，这些公共参数由私钥给定。\n- **P：** 这是一个证明算法，用于说明证明者想要证明的内容。\n\
  - **V：** 这是一个验证算法，返回 TRUE 或 FALSE。\n\n\n\n\n\n验证者提供的布尔变量。我现在将演示，使用 ZKP（尤其是 zk-SNARK\
  \ 协议）*不*足以保持 **[w]** 秘密，但如果它同时为 **FALSE**，则有可能使陈述被证明为 **TRUE**。\n\n让我们看看在 *Interactive\
  \ ZKP* 部分（Schnorr）中解释的类似协议示例在非交互方式（zk-SNARK 模式）下会如何工作。在此协议中，我们有 Anna 作为证明者和 Carl\
  \ 作为验证者。这里，Anna 必须证明 **[a]** 为她所知。Anna 计算她的私钥，(y)，由以下给出：y ≡ g^a (mod p) (**g** 是生成元（如\
  \ D-H 或我们在本书中已看到的其他私钥-公钥算法）。然后，Anna 在 **p-1** 内选取一个随机值 **[v]**，她将其保密，并且因此可以计算以下：t\
  \ ≡ g^v (mod p)。Anna 计算 **(c)** 作为三个参数 (**g, y, t**) 的哈希函数，她可以按如下方式计算 **(r)**：r\
  \ ≡ v − c*a (mod p-1)。验证者 Carl 可以验证以下：t ≡ g^r * y^c (mod p)。最后，如果验证验证了该函数的两个项，则\
  \ Carl 接受 Anna 提出的陈述 **[a]** 为 **TRUE**。现在我们已经分析了该 ZKP 在 zk-SNARK 环境中的工作原理，让我们在介绍数值示例之前先看看对该协议的攻击。\n\
  \n## 演示对 zk-SNARK 协议的攻击\n\n此攻击由我在 2019 年 6 月执行，仅说明没有任何东西是完全安全的。假设 Eve 是一个 **人工智能\
  \ (AI)** 服务器。我们假设 Eve（AI）拦截了 **H(g, y, t)** 公共哈希函数并执行 MiM 攻击。当 Peggy 发送 **(v)**\
  \ 给 Victor 时，Eve 用 **(c1) = H1(g, y, t1)** 替换 **(c) = H(g, y, t)**，记住 **(H)** 是哈希函数，而\
  \ **(t1)** 由以下给出：t1 ≡ g^v1 (mod p)。正如你可能已经注意到的，用 **(v1)** 替换 **(v)** 与之前攻击中用 **(k1)**\
  \ 替换 **(k)** 的技巧相同。简单地说，Eve 可以将 **(r1)** 置为如下：r1 = v1。现在，Eve 命令 AI（连接到互联网的智能第三方服务器）向\
  \ Carl 发送 **(r1, v1, c1)**，Carl 可以验证以下：t1 ≡ g^r1 * y^c1 (mod p)。由于以下原因，很容易证明 **t1\
  \ = g^v1**：y^(p-1) ≡ 1 (mod p)。最后，由于我们已将 **c1 = p-1** 且 **r1 = v1**，最终效果将为\n\n如下：t1\
  \ ≡ g^v1 ≡ g^v1 * 1 (mod p) **数值示例：** p = 3571 g = 7 x = 23 Anna 的公钥如下：y ≡ g^x (mod\
  \ p) 7^23 = 907 (mod 3571) y = 907 现在，我将向你展示 Anna 如何向 Carl 证明以获取秘密数字 [x]。她选择 v =\
  \ **67**，如下：\n\nt ≡ g^v (mod p) 7^67 = 584 (mod 3571) t = 584 假设哈希 (**g**，y，t) 如下：c\
  \ = 37 她按如下方式计算 r：r ≡ v - c*x (mod p-1) (67 - 37*23) ≡ 2786 (mod 3570-1) r = 2 发送\
  \ (**r**，**t**，**c**) = (**2786, 584, 37**) 给 Carl。Carl 可以验证以下：g^r * y^c ≡ t (mod\
  \ p-1) 7^2786 * 907^37 = 584 (mod 3571)\n\nAI 拦截了公共参数 (**y**)、(**t**) 和 (**r**)。Eve\
  \ 保持 (**y**) 不变，但她用 (**t1**) 更改 (**t**) 并用 (**r1**) 更改 (**r**)，执行中间人攻击：v1 = 57 Eve\
  \ 计算以下：t1 ≡ 7^57 (mod 3571) t1 = 712 v1 = r1 = 57 c1 = p-1 = 3570 Eve 向 Carl 发送\
  \ (**r1, t1, c1**) = (**57, 712, 3570**)。Carl 验证以下：t1 ≡ g^r1 * y^c1 (mod p) 我突出显示了\
  \ Eve 替换的参数，(**t1, r1, c1**); 她保持 (**y, g, p**) 不变。将新参数代入验证方程，我们有以下：7^57 * 907^3570\
  \ ≡ 712 (mod 3571) 确实，Carl 能够验证 **t1 = 712** 与来自 Eve 的接收参数相对应。从本质上讲，如果 Carl 无法识别\
  \ **r1 = v1** 和/或他不接受 **c = p-1**，那么这个技巧就成功了，Eve 可以取代 Anna。那么，对抗这种攻击应采取哪些保护措施？如果这种攻击以更复杂的方式实施，可能很难避免它。请注意，参数\
  \ (**y**)，Anna 的公钥，它“封装”了陈述的私有键 **[a]** 对象，在攻击期间未被修改。无论如何，zk-SNARK 可以使用其他方法和协议来实现证明陈述；我们将在下一节看到这些算法和协议是什么。区块链和加密货币正在迅速发展，以寻找新的匿名身份验证用户的方法。然而，由于该主题相对较新，最好努力找到所有可能的攻击及其修复方法。\n\
  \n## 如何在 Zcash 加密货币中使用 zk-SNARK 的简要说明\n\n在本节中，我们将分析 Zcash 背后的 zk-SNARK，一种新的加密货币，它旨在保护交易的安全性和隐私性，如\
  \ 2020 年 11 月 12 日发布的一篇科学论文（*Demystifying the Role of zk-SNARKs in Zcash*）中所讨论的：”Zcash\
  \ 算法的底层原理是它提供了一个功能齐全的、基于账本的数字货币，具有强大的隐私保证，而确保隐私的根源完全在于构建适当的 zk-SNARK。“ 一篇关于 Zcash\
  \ 的博客就零知识证明发表了以下声明：*允许一方（证明者）向另一方（验证者）证明某个陈述是真实的，而不会透露超出陈述本身有效性之外的任何信息。* 在一种称为“知识证明”的零知识形式中，证明者可以在不透露任何有关内容的敏感信息的情况下证明一个陈述。但正如我们到目前为止所看到的，这些协议基于难以解决的问题，例如因式分解和离散对数，我们在前几节中看到其中一些可能容易受到各种攻击。采用\
  \ ZKP 的一个原因是无需透露太多关于你的敏感数据或服务器身份的信息来对自己进行身份验证。另一个使用 ZKP 的原因是证明你知道 *某物* 而你想保密。这里，我们有两种主要不同的情况：\n\
  \n- 在第一种情况下，假设验证者不知道陈述的内容。\n- 在第二种情况下，假设验证者已经知道陈述的内容，只需要验证其 *正确性*。\n\n如果决定采用 *非交互式协议*\
  \ 而不是 *交互式协议*，所有事情会变得更加复杂，因为在第一种情况下，验证者不需要提供任何进一步的输入。事实上，正如你所看到的，如果证明者和验证者之间交换参数，这可能会增加算法的安全性。另一方面，我们知道交互式协议需要许多步骤才能达到目标，因此它们不像非交互式协议那样常用。正如我们在前几节中看到的，我展示了一些能够欺骗验证者，使其相信不真实事物的攻击；此外，如果验证者不知道陈述的内容，发送虚假的数学参数来欺骗他们就\
  \ *更容易*。现在，密码学的情况正在迅速变化，原因有两个：\n\n- 密码学需要解决隐私问题并匿名化互联网和电子商务中日益增多的交易的数据\n- 数字支付和加密货币的使用增加\n\
  \n为了匿名化数字金钱的交换并确保加密货币交易中用户的隐私，zk-SNARK 在多种情况下被采用。用于我们看到的两个主要问题（RSA 和离散对数）的验证几乎已经过时。它们正在为\
  \ Zcash 中看到的一种用例让位于新的、更复杂、更难解决的问题。为了实现完美的零知识隐私，Zcash 实施了一套复杂的函数系统来确定交易的 **有效性**。在\
  \ Zcash 的共识系统中，使用 zk-SNARK，目标是在不知道交易内容和条款的情况下对交易的有效性给出响应。Zcash 采用复杂的方案来匿名化交易并获得交易是否有效的最终答案。这里，我尝试对电路进行示意：Computation\
  \ → Arithmetic circuit → R1CS → QAP → zk-SNARK\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_167_0.png)\n\
  \n图 5.2 – 电路流程\n\n让我们逐一分析这些函数代表什么。第一步是将交易有效性转化为数学函数，最终必须汇总为逻辑表达式。这一步是通过创建一个算术电路来完成的，类似于布尔电路（我们在\
  \ *第 2 章，对称加密简介* 和 *第 3 章，非对称加密* 中看到过），由数学基本运算（+、-、* 和 /）和布尔运算符（**AND, OR, NOT,\
  \ and XOR**）组成，使得程序收敛到只有一个 *门*，即所有操作链的结果，如下例所示，计算表达式 **(a+b)*b*c**：\n\n\n\n![](img/2c67eb1b2bfb299c02c010d62900759c_168_0.png)\n\
  \nFigure 5.3 – An example of an arithmetic circuit. Inputs: a, b, and c. Output:\
  \ (a+b)*b*c\n\nAs you can see, the arithmetic (or algebraic) circuit converges in\
  \ only a single gate all the operations performed on the inputs: a, b, and c. Looking\
  \ at this circuit, from left to right, we have the single terms (a, b, and c); first,\
  \ (a) is added to (b), then (b) is multiplied by (c), and finally, the result is\
  \ multiplied by the result of the previous sum. All that is mathematically expressed\
  \ in only one final gate. We can represent layers and layers of these operations,\
  \ reducing them all to one arithmetic circuit. The second step is a Rank 1 Constraint\
  \ System (R1CS) representation. In R1CS, we have a group of three vectors (A, B,\
  \ and C), as you can see in the following figure. The solution to satisfy the system\
  \ is a new vector (S) given by an operation of a (.) dot product between the vectors,\
  \ of which the final result has to be zero. So, R1CS has this scheme of operations\
  \ and must satisfy the following equation with a result of zero: (S • A) * (S •\
  \ B) - (S • C) = 0 For example, this is a satisfied R1CS system:\n\ninventors of\
  \ Zcash put so much effort into this system? It is probably because the inventors\
  \ aspired to create the *perfect ZKP*. Indeed, in the paper entitled *Aurora: Transparent\
  \ Succinct Arguments for R1CS*, the authors stated that their goal is to obtain\
  \ transparent zk-SNARKs that satisfy the following conditions:\n\n- **Post-quantum\
  \ security**: *This is motivated by the desire to ensure the long-term security\
  \ of deployed systems and protocols.*\n- **Concrete efficiency**: *We seek argument\
  \ systems that not only exhibit good asymptotics (in argument size and prover/verifier\
  \ time), but also demonstrably offer good efficiency via a prototype.*\n\nGiven\
  \ the high expectations predicted by the authors for this protocol, let's go on\
  \ to explore the final steps of the sequence. This protocol offers a probabilistic\
  \ solution by performing a multiplication of polynomials. If the two polynomials\
  \ match at a random point, we can be confident that the chosen point verifies the\
  \ proof correctly. The reason for this transformation is that instead of checking\
  \ the constraints individually, as in R1CS, we can now check all the constraints\
  \ at the same time. Here, you can see an example of how the vector verification\
  \ looks in a QAP:\n\n![](img/2c67eb1b2bfb299c02c010d62900759c_170_0.png)\n\n*Figure\
  \ 5.5 – An example of the vector verification in a QAP*\n\nCan you recognize the\
  \ differences between this representation and the *checksum* in R1CS? In both cases,\
  \ if the logic gate is equal to zero, the result given by the dot (.) product of\
  \ the checks passes; if at least one of the (**x**) coordinates gives a non-zero\
  \ result, this means that the values going into and out of that logic gate are inconsistent.\
  \ But at this point, there could be a problem: if someone knows in advance which\
  \ point the verifier chooses to check the validity, they can generate an invalid\
  \ polynomial, but it could still satisfy that point. Essentially, this is a dangerous\
  \ step and could be vulnerable to attacks. To overcome this problem, Zcash applied\
  \ sophisticated techniques to zk-SNARKs in order to evaluate the polynomials *blindly*.\
  \ These mathematical techniques used in Zcash, such as homomorphic encryption and\
  \ pairings of elliptic curves, help to blind the operations but increase complexity.\
  \ We will look at these issues in the next section, but now we will finish discussing\
  \ the entire process of zk-SNARKs in Zcash. As I said at the beginning of the Zcash\
  \ explanation, the goal of the protocol is to determine whether a statement (in\
  \ this case, a transaction) is true or false, thereby preventing the *double-spending*\
  \ problem.\n\n## Conclusions and the weaknesses of zk-SNARKs in Zcash\n\nAs we saw\
  \ in the previous section, one of the weak points of this protocol can be found\
  \ in QAP. As I have explained, Zcash has tried to overcome this problem using homomorphic\
  \ evaluation, in other words, keeping the polynomials *in blind*. The issue is that\
  \ homomorphic encryption usually causes bit-overflow; moreover, the protocols and\
  \ schemes required to achieve fully homomorphic encryption are very complex. As\
  \ you already know, my theory is that *in cryptography, complexity is the enemy\
  \ of security*. I won't enter this debate now because it's not within the scope\
  \ of the book to analyze the entire protocol of Zcash. Imagine the scenario discussed\
  \ in the *Non-interactive ZKPs* section based on the RSA problem. If I have to demonstrate\
  \ to an expert that I hold the formula for an atomic bomb, then the experts will\
  \ probably ask me to show something more than a hash function of the document, [**m**],\
  \ that states the proof. The verifier will be convinced only when they get substantial\
  \ proof. In other words, ZKPs are limited in the amount of evidence of knowledge\
  \ they are able to provide.\n\ndoesn't know **[x]**. That is the exciting point,\
  \ and the innovation of this protocol: even if Victor doesn't know **[x]**, by using\
  \ this protocol, he can be confident that Peggy knows it. In other words, what the\
  \ authors of this protocol did was apply the D-H protocol to the ZKP use case. If\
  \ you look at the simplified version of the protocol shown below, you will get an\
  \ even better understanding of the steps required. There are only two, essentially:\n\
  \n- Initialization of the parameters for Peggy is **g, b, p,** and **x**.\n- Victor\
  \ generates a random **y**.\n\n**Step 1:** Victor sends the following to Peggy:\
  \ c ≡ g^y (mod p) **Step 2:** Peggy sends the following to Victor: r ≡ c^x (mod\
  \ p) Instantly, Victor can verify the following: r ≡ b^y (mod p) As you can see,\
  \ there are only two steps required to perform this protocol and verify the statement\
  \ **[x]** through Victor's validation of the parameter (**r**). This protocol gave\
  \ me the inspiration to build a new protocol, which we will explore in the next\
  \ section. My research has allowed me to reduce the number of steps to one.\n\n\
  ## A new Algorithm proposed by the Author: ZK13 – a ZKP for authentication and key\
  \ exchange\n\nThe **ZK13** protocol was invented and patented by me in 2013. It's\
  \ a non-interactive protocol that solves an issue that was very important to my\
  \ **Crypto Search Engine (CSE)** project (explained in Chapter 9): authentication\
  \ without the need of a public key. In this section, we will analyze this ZKP that's\
  \ used for authentication. It doesn't matter whether it's humans or computers; we\
  \ could call this protocol a **ZK-proof of authentication**. To better understand\
  \ the problem, imagine Alice and Bob want to share a common secret, something that\
  \ only they know. Let's say that the secret is the answer to the following question:\
  \ how many birds were counted at the lake shoreline today? The answer is known only\
  \ to Alice and Bob, unless they have revealed it to someone, but this is a problem\
  \ we will take into consideration later. For now, nobody else can know the answer\
  \ except Alice and Bob. We can consider the number of birds counted as a shared\
  \ secret, a key that doesn't need to be exchanged. It is shared by Alice and Bob,\
  \ a key that is implicitly formed by a common experience. So, besides the authentication\
  \ problem, there is also the problem of verifying a\n\nprivate **Pre-Shared Key\
  \ (PSK)**. Indeed, under ZK13, Alice tells Bob to use the secret shared key (the\
  \ number of birds counted) as a secret password, **[private key]**. What's even\
  \ more interesting here (and this is where it really differs from the D-H key exchange\
  \ algorithm we saw before) is that the secret key is not *really* exchanged at all,\
  \ but instead is simply something that is known to both parties and is only verified.\
  \ So, the problems that this ZKP can solve are several. Here, we will just consider\
  \ the authentication problem. Later in the book, we will analyze how to use a ZKP\
  \ to exchange a shared private key. In 2013, I was drawing up the architecture of\
  \ the CSE, a project that has absorbed a large part of my professional life. We\
  \ will talk in detail about the CSE in *Chapter 9, Crypto Search Engine*. At the\
  \ time, one of the toughest problems to solve with the CSE's architecture was finding\
  \ a cryptographic method to identify the **Virtual Machines (VMs)** network. Since\
  \ the algorithm chosen was symmetric, the problem was to find a method of authentication\
  \ that would work with the symmetric algorithm. As you already know from *Chapter\
  \ 2, Introduction to Symmetric Encryption*, it's common to think that symmetric\
  \ algorithms don't have a digital signature method of authentication because they\
  \ do not have public keys. At first glance, it doesn't seem easy to find such a\
  \ method of authentication, but it can be possible if the process starts with a\
  \ shared secret. The goal was to prevent a man-in-the-middle attack by an external\
  \ hostile VM against a network. To overcome all these issues, I considered implementing\
  \ a new ZKP. Taking a look at the most popular ZKPs, I did consider Schnorr (presented\
  \ earlier in this chapter) as a candidate. But an *interactive protocol* didn't\
  \ fit well. This scheme needs more steps between the prover and verifier, generating\
  \ latency in the communication. So, I decided to implement a new *personal* zero-knowledge\
  \ non-interactive protocol. After many studies and a pinch of inventiveness, I designed\
  \ ZK13. Before analyzing it, I will explain what constraints I worked under:\n\n\
  - The secret shared key (the challenge) has to be embedded inside the VM database.\
  \ Therefore, engineers could *inject* the secret parameter **[s]** into both of\
  \ the VMs without exchanging any keys through an asymmetric algorithm.\n- The goal\
  \ of ZK13 is to enable parties to identify each other by sharing a small amount\
  \ of sensitive information. This means exchanging only the minimum amount of sensitive\
  \ information (that is, the hash of **[m]**:\n\n\n\n\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_177_0.png)\n\
  \n图 5.6 – 共享哈希[s]秘密的方案\n\n让我们深入探讨 ZK13 并看看它是如何工作的。Bob（VM-1）必须向 Alice（VM-2）证明他知道秘密\
  \ [s]，以便使用 CSE 系统向 Alice 发送一组加密文件。请记住 [s] 存储在 Alice 和 Bob 这两个 VM 的大脑中，作为一种先天性注入的秘密。Bob\
  \ 选择一个随机数 [k]（zk-SNARK 的 (G) 元素或随机密钥生成器）。这个随机数 [k] 在每个会话中生成并销毁：\n\n公开参数：\np：这是一个质数。\n\
  g：这是生成元。\n\n密钥初始化：\n[k]：这是 Bob 的随机密钥。\n秘密参数：\n[s]：这是共同共享的秘密。\nH[s]：这是秘密 [s] 的哈希值。\n\
  \n步骤 1a：Bob 按如下方式计算 (r)：\nr ≡ g^k (mod p)\nr ≡ g^k (mod p)\n假设共享的秘密是 [s]，但实际上 VM\
  \ 使用 H[s]，即 [s] 的哈希函数进行操作。\n\n步骤 1b：Bob 计算 [F]，一个在每个会话中都会改变的秘密参数（只是因为 [k] 改变）：\n\
  H[s]*k ≡ F (mod p-1)\n现在，Bob 用 (g) 的 [F] 次幂来证明 (P)，即 zk-SNARK 的第二个元素：\ng^F ≡ P (mod\
  \ p)\nBob 将配对 (P, r) 发送给 Alice。\n\n步骤 2：验证步骤 (V) 根据以下函数验证证明 (P)：\n[s] ---> H[s]^r\n\
  [Hs] ≡ g^F (mod p)\n如果：\nV ≡ r^[Hs] = P (mod p)\nAlice 继续对 [s] 进行哈希：H[s]，\n\n然后如果\
  \ **V = P** 她接受认证；如果 (**V**) 不等于 (**P**)，她不接受验证。在这种情况下，正如我们在初始条件中所假设的那样，**[s]**\
  \ 假定为 Alice 所知。正如你所见，ZK13 只在两步中工作，但验证者（这里是 Alice）必须知道秘密 **[s]**；否则，不可能验证证明。\n\n\
  **数值示例：**\n现在，让我们看一下 ZK13 协议的数值示例：\n**公开参数：**\np = 2741\ng = 7\n**秘密参数：**\nH[s]\
  \ = 88\nk = 23\ng^k ≡ r (mod p)\n7^23 ≡ 2379 (mod 2741)\nr\nBob 计算 **[F]** 然后是 (**P**)：\n\
  [Hs] * k ≡ F (mod p-1)\n88 * 23 ≡ 2024 (mod 2741-1)\nF = 2024\ng^F ≡ 验证以下内容：\nr^[Hs]\
  \ ≡ P (mod p)\n2379^88 ≡ 132 (mod 2741)\nAlice 再次检查 **[Hs] = [s]** 是否成立；如果为 **TRUE**，则意味着\
  \ Bob 确实知道秘密 **[s]**。\n现在我们已经用数值示例证明了 ZK13 的有效性，我想演示它在数学上的工作原理。\n\n### 演示 ZK13 协议\n\
  \n由于 **P ≡ g^F (mod p)**，我们想要证明的是以下内容：\nP ≡ g^F ≡ r^s (mod p)\n（在这里，我使用 **[s]**\
  \ 进行演示而不是 H[**s**]。）\n由于 **r ≡ g^k (mod p)**，将 (**r**) 代入前述等式，我们得到以下内容：\nP ≡ g^F\
  \ ≡ (g^k)^s (mod p)\n我们还知道 **F** 为：\nF ≡ s*k (mod p-1)\n最后，对于模幂的性质，代入 **[F]** 和\
  \ (**r**) 之后，我们得到以下内容：\nP ≡ g^(s*k) ≡ (g^k)^s ≡ g^(k*s) (mod p)\n基本上，我已将参数 (**P**)，即\
  \ Bob 创建的证明，替换为其自身参数的元素，证明了秘密 **[s]** 包含在 (**P**) 中。因此，(**P**) 必须与 Bob 生成并连同证明 (**P**)\
  \ 一起发送给 Alice 的 *临时* 参数 (**r**)^[**s**] 匹配。如果 Alice 知道 **[s]**，那么她就可以确定 Bob 也知道\
  \ **[s]**，因为 (**P**) 包含 **[s]**。这就是我们想要证明的。\n\n### ZK13 协议的注意事项和可能的攻击\n\n你会同意我，使用此协议，可以在一次传输中确定对秘密\
  \ **[s]** 的知识证明。在解释算法时，我将其分为三个步骤，但实际上，\n\n只有两个步骤（只有一次传输），因为 (G) 密钥生成操作是离线的。因此，步骤\
  \ 1a 和 1b 可以有效地合并为仅一个步骤。\n\n### 对 ZK13 的可能攻击\n\n假设 Eve（攻击者）想冒充 Alice 或 Bob，制造中间人攻击。这可以按如下方式完成。Eve\
  \ 用 (r1) 替换 (r)，生成一个伪造的 (k1)，通过计算以下内容：\nr1 ≡ g^k1 (mod p)\n但当 Eve 计算 [F] 时，她不知道\
  \ H[s]（因为假设 [s] 会保持秘密）。因此，此攻击失败。相反，她可以收集 (r, P) 并在下一个会话中重放这些参数，激活所谓的重放攻击。此攻击在这里可以避免，因为\
  \ (r) 由随机 [k] 生成，因此可以避免接受先前选择中已出现过的 (r)。所以，这是一个可能面临的攻击，我们看到了如何避免它。\n\n## 总结\n\n\
  现在你对 ZKPs 是什么以及它们用于什么有了清晰的理解。在本章中，我们详细分析了不同种类的 ZKP，既有交互式也有非交互式。在这些协议中，我们看到了一个使用\
  \ RSA 作为底层问题的 ZKP，我提出了一种将其破解的原创方法。然后，我们看到了以交互方式用于身份验证的 Schnorr 协议，我提出了对其进行攻击的尝试。继续下去，我们探索了\
  \ zk-SNARKs 协议和诡异的月球数学，只是为了看看某些其他问题的复杂性。其中，我们看到了攻击基于离散对数 zk-SNARK 的有趣方法。我们深入研究了\
  \ Zcash 及其协议，以了解如何匿名化这种加密货币的交易。稍后在本章中，我们遇到了并分析了一个基于 D-H 算法的非交互式协议。最后，我们探索了 ZK13，一种非交互式协议，以及它如何使用共享秘密来启用\
  \ VM 的身份验证。最后，我们探索了 zkSNARKs 在加密货币世界中的应用，特别是用于匿名化交易。你熟悉了一些攻击方案，例如中间人攻击，并使用了一些数学技巧来尝试\
  \ ZKP。主题\n\n## 在 Discord 上加入我们的图书社区\n\nhttps://packt.link/SecNet\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_182_0.png)\n\
  \n椭圆曲线是去中心化金融的新前沿。Satoshi Nakamoto 采用了一种特定的椭圆曲线来实现比特币中数字货币的传输，称为 **secp256K1**。让我们看看它是如何工作的，以及这种非常强大的加密的主要特性是什么。在本章中，我们将学习椭圆曲线密码学的数学基础。这个主题涉及几何、模数学、数字签名和逻辑。此外，我将介绍为比特币数字签名实现的一种特殊类型的椭圆曲线，即\
  \ secp256K1。最后，我们将讨论对椭圆曲线进行攻击的可能性。因此，在本章中，我们将涵盖以下主题：\n\n- 椭圆曲线上密码学的起源\n- 椭圆曲线的数学和逻辑基础\n\
  - 基于椭圆曲线的 Diffie–Hellman 密钥交换\n- secp256K1 上的 ECDSA 解释 – 比特币的数字签名\n- 对椭圆曲线的可能攻击\n\
  \n让我们深入探讨这个基于几何并应用于密码学的有趣主题。\n\n## 椭圆曲线的概述\n\n大约在 1985 年，Victor Miller 和 Neal Koblitz\
  \ 开创了 *椭圆曲线* 用于密码学用途。后来，Hendrik Lenstra 向我们展示了如何使用它们来分解整数。椭圆曲线本质上是笛卡尔平面上特定数学方程的几何表示。我们将开始在\
  \ 2D 平面上分析它们的几何模型，同时意识到它们的扩展和更深层次的表示是在 3D 或 4D 中，涉及无理数和虚数。现在不要担心这些问题；在本章后面会变得更清晰。**椭圆曲线密码学\
  \ (ECC)** 用于实现我们在前几章中看到的一些算法，例如 **RSA**、**Diffie–Hellman (D–H)** 和 **ElGamal**。此外，在数字货币革命兴起之后，一种特定的椭圆曲线类型称为\
  \ secp256K1 以及一种数字签名算法称为 **椭圆曲线数字签名算法 (ECDSA)** 已被用于对比特币应用数字签名，以确保交易成功执行。本章旨在一步步带你发现椭圆曲线背后的逻辑并将其转置到数字世界应用中。据估计，使用\
  \ 313 位椭圆曲线加密提供的<|message|>安全级别与传统非对称系统中 4,096 位加密相当。如此少的位数可以在许多需要高性能时序和带宽的实现中很方便，例如移动应用程序。因此，让我们开始探索椭圆曲线的基础，它涉及几何、数学以及我们在本书前几章中看到的许多逻辑属性。\n\
  \n## 椭圆曲线上的运算\n\n第一个观察是椭圆曲线不是 *椭圆*。椭圆曲线的一般数学形式如下：\n\n```\nE: y^2 = x^3 + ax^2 +\
  \ bx + c\n```\n\n> **重要说明**\n>\n> **E：** 表示椭圆曲线的形式，参数 (**a**、**b** 和 **c**) 是曲线的系数。\n\
  \n\n\n\n\n### plot\n\ny² = x³ + 73\n\n### Implicit plot:\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_185_0.png)\n\
  \n![](img/2c67eb1b2bfb299c02a010d62900759c_187_0.png)\n\n*Figure 7.2 – Adding and\
  \ doubling points on the elliptic curve*\n\nNow, let's look at how the addition\
  \ point will be represented algebraically. First, we take the coordinates of P and\
  \ Q, and then calculate (s), as follows: s = (yP - yQ) / (xP - xQ). To compute **xR**,\
  \ the x coordinate of point R, we have to perform this operation: xR = s^2 - (xP\
  \ + xQ). To compute **yR**, the y coordinate of point R, we have to perform this\
  \ operation: yR = s(xP - xR) - yP. What about computing **P + P = R = 2P**, the\
  \ so-called **point double**? If we want to represent a P point added to itself\n\
  \nso that it becomes 2P, the geometrical representation is given by the tangent\
  \ passing through the P point and intersecting the curve at the R point, and again\
  \ finding the reflexed point of the sum that is the symmetric point R, as shown\
  \ here:\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_188_0.png)\n\nFigure 7.3 – 2P\
  \ point double\n\nGeographically, it is very similar to computing the sum of the\
  \ point, as we saw in the preceding example.We have to draw the tangent line in\
  \ the **P** point, and we find the point of intersection between the line and the\
  \ curve in the **R'=(-2P)** point; finally, the reflexed x-axis point on the curve\
  \ will give the **P** double point, that is, **R (2P)**.What about computing **P+P**\
  \ algebraically? In this case, (**t**) will be the following: t = (3XP^2 + a)/2YP\
  \ Remember that (**a**) is a parameter of the curve.So, to find the x coordinate\
  \ of **R**, we have the following: xR = t^2 - 2XP The equation for the y coordinate\
  \ of **R** is as follows: yR = t (xP - xR) - yP There is one more case we need to\
  \ address when we operate with elliptic curves: how to add vertical points.Here\
  \ is **O** represented by the *point of infinity*, given by the **SUM** value between\
  \ **P** and **Q** if **xP = xQ**:\n\ncalled **repeated addition**, and it can be\
  \ represented as follows: Q = {P + P+ P + P...+ P} n-times As we have to add the\
  \ coordinates of a point to itself, we can figure out the scalar multiplication\
  \ as the sum of a point with itself **n** times, so we have, for example, the following:\
  \ P + P = 2P This, as we have seen, is the formula of double point (geometrically\
  \ represented in *Figure 7.3*) transposed into an algebraic representation of **SUM**.\
  \ Always remember that we are dealing with a curve, so the coordinates of the new\
  \ intersection point are as follows: 2P (X2P, Y2P) For the same logic, we can go\
  \ on with **3P**, **4P**, ... **7P**: R = 3PR = 2P +P Then we follow with **4P**:\
  \ R = 4PR = 2P + 2P Then we follow with **5P**: R = 5PR = 2p + 2P + P Then we follow\
  \ with **6P**: R = 6PR = 2P + 2P +2P Alternatively, it can be given like this: R\
  \ = 2(3P)R = 2 (2P+ P) Finally, we have the following: R = 7PR = P + (P + (P + (P\
  \ + (P + (P + (P)))))) Alternativ it can be given like this: R = 7PR = P + 6PR =\
  \ P + 2(3P)R = P + 2(P + 2P) It is called multiplication, but in reality, scalar\
  \ multiplication is more of a *breakdown* of the **R** number in a scalar mode because,\
  \ as you can see, step by step, it is going to be reduced to the minimal entity\
  \ of **P**: so, for instance, **7P** becomes a product of **P** and **2P**.Following\
  \ this logic, if we have to multiply a **K** number with **P**, we have to break\
  \ it down to obtain a sum of minimal elements (**P+P**) or a **2P** double point\
  \ that will compose the multiplication required. Because of the formulas, we rely\
  \ on addition and multiplication, as we saw in *Figure 7.5*.If we have **9P**, for\
  \ example, we will have the following: 9P = 2(3P) + 3P9P = 2(2P + P) + 2P + P9P\
  \ = P + 2P + 2(2P+ P) Now that we have understood this operation's logic, let's\
  \ discover why these operations are so important to generate a cryptographic system\
  \ on elliptic curves.As we saw in the previous chapters (for example, D–H in *Chapter\
  \ 3, Asymmetric Encryption*) about cryptography, we are looking for one-way functions.\
  \ These particular functions allow it to be easy to compute in one direction but\
  \ are very difficult to perform in the opposite sense. In other words, it isn't\
  \ easy to reverse-engineer the result. Similarly, in elliptic curves, we have to\
  \ find a function such as a discrete logarithm that allows us to perform a *one-way*\
  \ function.We'll now define the discrete logarithm problem transposed on an elliptic\
  \ curve.It's stated that *scalar multiplication* is a one-way function.Given an\
  \ elliptic curve: **E**.Known: **P**, **Q** is a multiple of **P**.Find **k**: Such\
  \ that **Q = k * P**.It is a *hard problem to solve*. This is called a discrete\n\
  \nlogarithm problem of Q to the P base, and it is considered hard to solve because\
  \ to find k means to calculate very complex operations. I will proceed with an example\
  \ to better understand what we are dealing with. Example: In the elliptic curve\
  \ group defined by the following, what is the discrete logarithm k of Q = (4,5)\
  \ to the P = (16,5) base?\n\ny2 = x3 + 9x + 17 over the field F23. One (naïve) way\
  \ to find k is to compute multiples of P until Q. The first few multiples of P are\
  \ as follows:\n\nP = (16,5) 2P = (20,20) 3P = (14,14) 4P = (19,20) 5P = (13,10)\
  \ 6F 9P = (4,5) = Q, the discrete logarithm of Q to the P base is k = 9. In a real\
  \ application, k would be large enough that it would be infeasible to determine\
  \ k in this manner. This is the fundamental principle behind the D-H algorithm implemented\
  \ on elliptic curves that we will discover next.\n\n## Implementing the D-H algorithm\
  \ on elliptic curves\n\nIn this section, we will implement the D–H algorithm on\
  \ elliptic curves. We saw the D–H algorithm in Chapter 3, Asymmetric Encryption.\
  \ You should remember that the problem underlying the D–H key exchange is the discrete\
  \ logarithm. Here, we will demonstrate that the discrete logarithm problem could\
  \ be transposed on elliptic curves too. First of all, we are dealing with an elliptic\
  \ curve (mod p). The base point or generator point is the first element in the D–H\
  \ original algorithm represented by (g), and here we denote it by (G). Let's look\
  \ at some elements to take into consideration:\n\n+   - G: This is a point on the\
  \ curve that generates a cyclic group.\n\nCyclic group means that each point on\
  \ the curve is generated by a repeated addition (we have seen point addition in\
  \ the previous section).\n\n+   - Another concept is the order of G denoted by (n):\n\
  \nord(G) = n The order of (G) = (n) is the size of the group. The order (n) is also\
  \ the smallest positive integer [k], giving us the following: kG = O (Infinity Point)\n\
  \n+   - The next element to take into consideration is the h cofactor:\n\n**h**\
  \ = (number of points on E )/n In other words, (**h**) can be defined as the number\
  \ of points on **E (mod p)** divided by the order of the curve (**n**). **h = 1**\
  \ is optimal. If **h > 4**, the curve is more vulnerable to attacks. Let's now analyze\
  \ step by step how D–H transposed on **E** works. **Step 1: Parameter initialization:**\
  \ Now let's look at the public shared parameters to initialize the D–H model on\
  \ **E (mod p)**: {p, a, b, G, n, h} **p** is the (mod **p**) as we have already\
  \ seen in the original D–H algorithm. **a** and **b** are the parameters of the\
  \ curve. **G** is the generator. **n** is the order of **G**. **h** is the cofactor.\
  \ **Step 2: Crafting the shared key on E (mod p): [K]** After the parameter initialization,\
  \ Alice and Bob will define the type of the curve to adopt among the family of **E\
  \ (mod p)**: y^2 = x^3 + a x + b (mod p) Bob picks up a **[β]** private key such\
  \ that **1≤ [β] ≤ n-1**. Alice picks up a **[α]** private key such that **1≤ [α]\
  \ ≤ n-1**. After choosing random keys, Bob and Alice can compute their public keys.\
  \ Bob computes the following: B = [β] * G Alice computes the following: A = [α]\
  \ * G Now (like in the original D–H algorithm), there is a generation of shared\
  \ keys exchanging the public parameters:\n\n+   - Bob sends **B** (**xB** and **yB**)\
  \ to Alice.\n+   - Alice receives **B**.\n+   - Alice sends **A** (**xA** and **yA**)\
  \ to Bob.\n+   - Bob receives **A**.\n+   - Bob computes the following:\n+   \n\
  +   K = [β]*A\n+   \n+   - Alice computes the following:\n+   \n+   K = [α] * B\n\
  +   \n+   - Finally, Bob and Alice hold the same information: the point on **E**:\
  \ **[K]**.\n\nThis point, **[K]**, is the shared key between Alice and Bob.\n\n\
  ### Important Note\n\nIf Eve (the attacker) wants to know **[K]**, she has to know\
  \ **[α]** or **[β]**, the private keys of Alice and Bob, given by the following\
  \ functions:\n\n\n\n**B = [β] * G 或 A = [α] * G**\n\n要恢复 **[K]**，Eve 必须能够在 **E (mod\
  \ p)** 上求解离散对数，而正如我们所见，这是一个难以求解的问题。\n\n**以下是一个数值示例：** 假设曲线的域如下：\n\n**E: y² = x³\
