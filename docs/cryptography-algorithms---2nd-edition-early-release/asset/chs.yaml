  \n*图 7.6 – 用作实现 D–H 算法示例的绘制曲线*\n\n生成点如下： **G = (5, 1)**。\n\n首先，我们必须找到曲线 **n** 的阶。为此，我们应计算所有点，直到达到允许循环群的最小整数。因此，我们开始计算\
