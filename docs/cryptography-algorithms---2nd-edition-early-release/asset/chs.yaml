  \ (**X^Y**) 得到满足：\n\n### Figure 2.2 – Mathematical table for \"AND\"\n\n- **OR (disjunction)**:\
  \ 用符号 (**X V Y**) 表示。当 **X** 或 **Y** 中的至少一个元素为真时，此条件得到满足。因此，我们处理的是诸如 **pear OR apple**\
  \ 之类的命题。我们的数据库搜索示例将选择包含两个单词中至少一个（**pear** 或 **apple**）的所有元素。\n\n在下面的表中，你可以看到 **OR**\
