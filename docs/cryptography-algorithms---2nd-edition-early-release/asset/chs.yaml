  \ D–H 算法更容易，可以使用更小的参数和密钥。但是，我们必须依赖由专业密码学家和数学家设计的结构良好且架构良好的曲线。\n\n### 重要说明\n\n在 **E\
  \ (mod p)** 上实现 D–H 不一定能防止 MiM 攻击，就像原始 D–H 算法一样（如 *第 3 章《非对称加密》中所述*）。\n\n现在我们对椭圆曲线及其运算更有信心，可以通过一个有趣的椭圆曲线案例，分析用于比特币数字签名\
  \ ECDSA 的算法。\n\n## 椭圆曲线 secp256k1 – 比特币数字签名\n\n**ECDSA** 是比特币架构中使用的数字签名方案，采用名为 secp256k1\
  \ 的椭圆曲线，由 **高效加密标准组 (SECG)** 标准化。ECDSA 在以下方程中建议 **(a = 0)** 和 **(b = 7)** 作为参数：\n\
  \n**E: y² = x³ + 7**\n\n如需更正式的介绍，你可以阅读 SECG 发布的文档 [https://www.secg.org/sec2-v2.pdf](https://www.secg.org/sec2-v2.pdf)，其中可以找到与\
  \ Koblitz 曲线及其它位长姐妹曲线相关的 256 位推荐参数。这是 secp256k1 在实平面中的表示：\n\nplot y² = x³ + 7\n\n\
  ### 隐式绘图：\n\n![](img/2c67eb1b2bfb299c02a010d62900759c_199_0.png)\n\n*图 7.7 – secp256k1\
  \ 椭圆曲线*\n\n正如我们所知，椭圆曲线有一部分在实平面可见，另一部分由开发者选择。在比特币中，我们将看到将选择多少位数作为模数 (**p**)、阶 (**n**)\
  \ 和基点 (**G**) 以使 secp256k1 安全。现在让我们继续探索数字签名 ECDSA 算法在 secp256k1 中的实现方式。\n\n### 第\
  \ 1 步 – 生成密钥\n\n**[d]** 私钥是在范围 **1 ≤ k ≤ n − 1** 内随机选择的一个数，其中 **n** 是 **G** 的阶。该数字必须为\
  \ 256 位长，以便计算随机数的哈希值与 SHA-256，从而输出一个 256 位数。这是确保数字确实为 256 位长的方法。记住，如果输出的数字小于 **(n\
  \ − 1)**，则密钥将被接受；如果不是，则会再次尝试。\n\n公钥 (**KPub**) 由以下方程导出：\n\n`KPub = Kpriv * G`\n\n\
  因此，可能的私钥数量与 **G** 的阶相同：**n**。要从私钥 **[d]** 计算公钥 (**Q**)，在 secp256k1 中，我们必须使用以下方程：\n\
  \n`Q ≡ [d] * G (mod p)`\n\n方程的结果将是 **Q**（公钥）。完成此操作后，我们可以转到计算数字签名。\n\n假设 Alice 是签名的发送者，她的\
  \ **[d]**、**(G)** 和 **(Q)** 参数已经计算完毕。在实际情况下，Victor 是验证者（矿工），他必须验证真实的所有权。让我们继续了解如何在\
  \ secp256k1 中签署比特币交易。\n\n### 第 2 步 – 在 secp256k1 中执行数字签名\n\n记住，要签署文档 **[M]**，或更准确地说在这种情况下比特币中的值\
  \ **[B]**（如我们在 *第 4 章《介绍哈希函数和数字签名》中讨论的*），始终建议计算 **Hash[B] = z**。因此，我们将签署 **z**，即消息的哈希值，而非直接签署\
  \ **[M]**。\n\n我们需要的另一个参数是 **[k]**，它是临时密钥（或会话密钥）。执行数字签名 **(S)** 的子步骤与公钥/私钥算法类似。这里的区别在于离散对数是通过标量乘法获得的：\n\
  \n- Alice 选择一个随机秘密 **[k]**，得到以下结果： **1 ≤ k ≤ n − 1**。\n- 她计算坐标 **R(x, y) = k * G**。\n\
  - Alice 找到 **r ≡ x (mod n)**，即 **R(x, y)** 的 x 坐标。\n- Alice 计算 **S ≡ (z + r × d)\
  \ / k (mod p)**。这是数字签名。\n\nAlice 将 (**r**, **S**) 对发送给 Victor 以验证数字签名。\n\n### 第\
  \ 3 步 – 验证数字签名\n\nVictor 收到 (**r**, **S**) 对。现在他可以验证 **S** 是否确实由 Alice 生成。要验证 **S**，Victor\
  \ 将遵循以下协议：\n\n- 检查 **r** 和 **S** 是否都包含在 **1** 和 **n − 1** 之间。\n- 计算 **w ≡ S⁻¹ (mod\
  \ n)**。\n- 计算 **U ≡ z × w (mod n)**。\n- 计算 **V ≡ r × w (mod n)**。\n- 在 secp256k1\
  \ 中计算点： **R(x, y) = UG + VQ**。\n- 验证 **r ≡ Rₓ (mod n)**。\n\n如果 **r** 与 **Rₓ (mod\
  \ n)**——**R** 点的 x 坐标——对应，则验证者接受对应于比特币值 **[B]** 的签名 **S**，其所有者声称拥有声明的比特币数量。\n\n\
  没有实际示例的支持，很难理解如此复杂的协议。在 secp256k1 上对比特币交易进行数字签名时执行的某些操作相当复杂，难以解释，需要实际示例来理解。\n\n\
  ### secp256k1 上数字签名的一个数值练习\n\n在本节中，我们将深入研究 secp256k1 的数字签名，以便理解实现和验证数字签名的操作机制。\n\
  \n假设，例如，曲线的参数如下：\n\n- **p = 67**（模 p）\n- **G = (2, 22)**\n- **阶 n = 79**\n- **私钥:\
  \ [d] = 2**\n\n由于我们选择了一个非常简单的私钥，只需执行一次倍点即可获得公钥 (**Q**)：\n\n**Q = d * G**\n\n在这种情况下，我们继续计算公钥\
  \ (**Q**)。首先，我们将使用以下公式计算倍点：\n\nt = (3xP² + a) / 2yP\n\nt = (3 × 2² + 0) / (2 × 22)\
  \ = 12 / 44 = 49\n\nQ = d * G\n\n使用数字意味着用数字替换 **[d]** 和 **G**：\n\n**Q = 2 × (2,\
  \ 22)**\n\n依靠倍点公式，让我们找到 **Q** 的坐标（x 和 y），从 x 开始：\n\nxQ = t² − 2xG\n\nxQ ≡ 49² −\
  \ 2 × 2 = 52 (mod 67)\n\nxQ = 52\n\n同样，让我们找到 **Q** 的 y 坐标：\n\nyQ = t(xG − xQ) −\
  \ yG\n\nyQ ≡ 49(2 − 52) − 22 = 7 (mod 67)\n\nyQ = 7\n\n因此，公钥 (**Q**) 的坐标如下：\n\n\
  **Q(x, y) = (52, 7)**\n\n现在，Alice 可以执行她的数字签名 (**S**)。首先，Alice 计算 **H[M] = z** 哈希。假设\
  \ **z = 17** 是 **[B]** 值比特币的哈希。\n\nAlice 为 **[k]** 会话密钥选择一个随机秘密数：\n\n**k = 3**\n\
  \nAlice 计算 **R(x, y) = k * G** 坐标：\n\n**k * G = 3 * G = G + 2G**\n\n我们已经计算出 **2G\
  \ = (52, 7)**，因此可以依靠附加公式计算 **G + 2G = (2, 22) + (52, 7)**。\n\n让我们回顾椭圆曲线上点加法的公式：\n\
  \nt₁ = (yQ − yG) / (xQ − xG)\n\n要计算 **xR**，即 **R** 点的 x 坐标，我们必须求解此操作：\n\nt₁ ≡ (7\
  \ − 22) / (52 − 2) (mod 67)\n\nt₁ ≡ 60 (mod 67)\n\n我们正在寻找 **xR**：\n\nxR ≡ t₁² −\
  \ (xG + xQ) (mod 67)\n\nxR ≡ 60² − (2 + 52) = 62 (mod 67)\n\n考虑 **R** 的 x 坐标：\n\n\
  **r = 62 (mod 79) = 62**\n\n此时，我们可以通过应用公式执行签名：\n\nS ≡ (z + r × d) / k (mod p)\n\n\
  S ≡ (17 + 62 × 2) / 3 (mod 67) = 47\n\n我们获得了一个非常重要的点——签名 (**S**)：\n\n**S = 47**\n\
  \nAlice 将 (**S = 47, r = 62**) 对发送给 Victor。\n\n为了验证数字签名，Victor 收到 **(S, r) = (47,\
  \ 62)**。Victor 可用的公共参数如下：\n\n- **z = 17**\n- **n = 79**（G 的阶）\n- **G = (2, 22)**\n\
  - **基点 Q = (52, 7)**\n\n首先，Victor 必须检查以下内容：\n\n**1 ≤ (47, 62) ≤ (79 − 1)**\n\n事实上，这里就对了——签名通过了第一次检查。\n\
  \nVictor 现在计算 **w**，即数字签名 (**S**) 的逆：\n\nw ≡ S⁻¹ (mod n)\n\n这，如我们之前多次所见，意味着执行 **S\
  \ (mod n)** 的逆函数：\n\n`Reduce[(S) * x == 1, x, Modulus -> (n)] = Reduce[(47) * x\
  \ == 1, x,`\n\n\n\nVictor calculates\n\n(U): u ≡ z * w (mod n)  \nu ≡ 17 * 37 (mod\
  \ 79)  \nu = 76  \n\nNow Victor is able to verify the signature:  \nv ≡ r * w (mod\
  \ n)  \nv ≡ 62 * 37 (mod 79)  \nv = 3  \n\nThe game is not finished yet; we have\
  \ to *compute* through scalar multiplication the coordinates of V = 3 on secp256k1.\
  \ To do that, we have to perform the following equation:  \n\nR(x, y) = U*G + V*Q\
  \  \n\nWe will split the preceding equation into two parts: (UG) and (VQ). We start\
  \ by calculating **UG**:  \n\nu*G = 76G = 2*38G = 2*(2*19G) = 2*(2*(G + 18G)) =\
  \ 2*(2*(G + 2*(9G)))  \n\nIn order to reduce **76G** through scalar multiplication,\
  \ we have to perform six point-doubling operations and two point additions. This\
  \ shortcut will come in handy when the numbers are very large. There is *no* efficient\
  \ algorithm able to perform such an operation of reduction like this, so we have\
  \ to use our brain. We already know the results of 2G = 2*(2,22) = (52,7), so we\
  \ can reformulate the preceding operations, 2*(52,7) = (21,42), already calculated\
  \ by me, and we arrive at this further reduction:  \n\nUG = 2 * ((52, 7) + 2*((2,\
  \ 22) + (21, 42))) = 2 * ((52, 7) + 2*(...))  \n\nThe next step, we have to calculate\
  \ **VQ = 3Q = Q + 2Q**. One method to perform this scalar multiplication is first\
  \ to calculate **2Q = 2*(52,7) = (25,17)**. Then we proceed to compute Q + 2Q =\
  \ (52,7) + (25,17):  \n\nVQ = (52, 7) + (25, 17) = (11, 20)  \nVQ = (11, 20)  \n\
  \nFinally, we can add UG + VQ in a unique adding point:  \n\nR(x,y) = U*G + V*Q\
  \  \nR(x,y) = (62,4) + (11,20)  \nR(x,y) = (62,6)  \n\nThe last verification, Victor\
  \ can check the following:  \n\nr ≡ Rx (mod n)  \n\nIn fact, it turns out as follows:\
  \  \n\nr = 62 = Rx = 62 (mod 79)  \n\nSo, finally Victor accepts the signature!\
  \ We have seen how complex it is even if we use small numbers to delve inside this\
  \ protocol, as we have demonstrated in this example. So, you can imagine the enormous\
  \ complexity that must be involved if the parameters are 256 bits or more. This\
  \ elliptic curve is proposed to protect the ownership of Bitcoin. The signer, through\
  \ their signature (S), can demonstrate they own the **[B]** value corresponding\
  \ to the computed hash (**z**). It's verified that secp256k1 is a particular elliptic\
  \ curve, as we saw at the beginning of this section when I mentioned the characteristics\
  \ of this curve, which, being different from others, is more efficient and has parameters\
  \ chosen in a particular way to be implemented. If you are curious about the implementation\
  \ and the digital signature ECDSA algorithm, you can visit the NIST web page and\
  \ the **Institute of Electrical and Electronics Engineers (IEEE)**. NIST has published\
  \ a list of different kinds of ECC and the recommended parameters of the relative\
  \ implementations. You can find the document at this link:  \n\n[https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-78-4.pdf](https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-78-4.pdf).\
  \  \n\nIEEE is a private organization dedicated to promoting publications, conferences,\
  \ and standards. This organization released the IEEE P1363-2000 (Standards Specification\
  \ for Public-Key Cryptography), where it is possible to find the specifications\
  \ to implement the ECC. In the next section, you will find an attack against ECDSA\
  \ private keys made by a hacker group calling itself *fail0verflow*, which announced\
  \ it had recovered the secret keys used by Sony to sign in to the PlayStation 3.\
  \ However, this attack worked because Sony didn't properly implement ECDSA, using\
  \ a static private key instead of a random one.\n\n## Attacks on ECDSA and the security\
  \ of elliptic curves\n\nThis attack on ECDSA can recover the private key, **[d]**,\
  \ if the random key (ephemeral key), **[k]**, is not completely random or it is\
  \ used multiple times for signing the hash of the message (**[z]**). This attack,\
  \ implemented to extract the signing key used for the PlayStation 3 gaming console\
  \ in 2010, recovered the keys of more than 77 million accounts. To better understand\
  \ this disruptive attack (because it will recover not only the message but also\
  \ the private key, **[d]**), we will divide it into two steps. In this example,\
  \ we consider the case when two messages, **[M]** and **[M1]**, are digitally signed\
  \ using the same private keys, **[k]** and **[d]**.\n\n### Step 1 – Discovering\
  \ the random key, [k]\n\nThe signature (**S = 47**) generated at the time (**t0**)\
  \ from the hash of the message, **[M]**, as we know, is given by the following mathematical\
  \ passages:  \n\ns ≡ (z + r*d)/k (mod n)  \n\nHere it is presented in numbers: \
  \ \n\ns ≡ (17 + 62 * 2)/3 (mod 79) = 47  \ns = 47  \n\nSuppose now we know **z1\
  \ = 23** (the hash of the second message, **[M1]**) transmitted at the time (**t1**)\
  \ and generating the signature (**S1**). Moreover, we are supposed to know the second\
  \ signature (**S1**) given by the equation:  \n\ns1 ≡ (z1 + r*d)/k (mod n)  \n\n\
  Using the **Reduce** function of Mathematica, we have the following result for **(S1)**:\
  \  \n\n`Reduce[k*x == (z1 + r*d), x, Modulus -> (n)] = 49`  \n`S1 = 49`  \n\nGiven\
  \ **(S − S1) * k ≡ (z − z1) (mod n)**. Substituting the parameters in the preceding\
  \ equation with the numbers of our example, we can easily gain **[k]** using the\
  \ **Reduce** modular function of Mathematica, as follows:  \n\n`Reduce[(47 - 49)*x\
  \ == (17 - 23), x, Modulus -> (79)]`  \n`k = 3`  \n\nAfter we get **[k]**, we can\
  \ also gain the private key, **[d]**. Let's see what happens in the next step.\n\
  \n### Step 2 – Recovering the private key, [d]\n\nAfter we have recovered the random\
  \ key, **[k]**, we can easily compute the private key, **[d]**. We know that **(S)**\
  \ is given by the following equation:  \n\n`S = (z + r*d)/k`  \n\nSwitching **(k)**\
  \ from denominator to numerator at the left side, we can write the equation in the\
  \ following form:  \n\n`S*k = z + r*d`  \n\nFrom knowing **(k) = 3**, we can find\
  \ **[d]** because also all the other parameters **(S, z, r)** are public. So, we\
  \ can find **[d]** by writing the previous equation as follows:  \n\n`d = (S*k −\
  \ z)/r`  \n\nAll the parameters on the right side are known. We can write it out\
  \ in numbers, as follows:  \n\n`(47 * 3 − 17)/r = 2`  \n\nThat is the number of\
  \ the private key, **[d] = 2**, discovered. Analyzing this attack, we come to a\
  \ question: what happens if someone can find a method to generate multiple signatures\
  \ (S1, S2, and Sn) starting from (z1, z2, and zn) or generate multiple signatures\
  \ starting from (z)? In other words, as (z) comes from the hash of the message (the\
  \ value of Bitcoin recovered in a wallet) that we have called **[B]**, what happens\
  \ if we can generate an S1 signature starting from (z)? I invite you to think about\
  \ this question because if that is possible, then it should be possible to generate\
  \ multiple signatures on a single transaction, all verified by the receivers. Let's\
  \ now see a brief analysis of ECC's computational power compared to other encryptions.\
  \ Elliptic curve efficiency compared with the classic public/private key cryptography\
  \ algorithm is shown in the following table. You can immediately perceive the lowest\
  \ key size used in elliptic curves compared to the RSA/DSA algorithms. The equivalence\
  \ you see in the following figure also takes into consideration the symmetric scheme\
  \ key size (**Advanced Encryption Standard (AES)**, for example). This scheme is\
  \ undoubtedly shorter than the elliptic curve, but here is a comparison because,\
  \ as you already know, the elliptic curve is able to spread out digital signatures\
  \ differently by symmetric scheme encryption, so the effective comparison has to\
  \ be done with asymmetric encryption:\n\n### Comparable Key Sizes for Equivalent\
  \ Security\n\n| Symmetric scheme (key size in bits) | ECC-based scheme (size of\
  \ n in bits) | RSA/DSA (modulus size in bits) |\n|---:|---:|---:|\n| 56 | 112 |\
  \ 512 |\n| 80 | 160 | 1024 |\n| 112 | 224 | 2048 |\n| 128 | 256 | 3072 |\n| 192\
  \ | 384 | 7680 |\n| 256 | 512 | 15360 |\n\n> _Figure 7.9 – William Stallings' table\
  \ of comparison – ECC versus classical cryptography_\n\nAs you can see, 256-bit\
  \ encryption performed on ECC is equivalent to a 3,072-bit key on RSA. Moreover,\
  \ we can compare a 512-bit key on elliptic curve to a key size on RSA of 15,360\
  \ bits. Compared with symmetric encryption (AES, for example), ECC needs double\
  \ the amount of bits.\n\n### Important Note\n\nA warning regarding the key's length:\
  \ it doesn't matter how long the modulus is or how big the key size is – if an algorithm\
  \ logically breaks out, nothing will repair its defeat.\n\n## Considerations about\
  \ the future of ECC\n\nNow that we have seen how a practical attack on ECDSA works,\
  \ one of the most interesting questions we should ask for the future is the following:\
  \ Is _elliptic curve cryptography resistant to classical and quantum attacks?_ At\
  \ a\n\nglance, the answer could be that most elliptic curves are not vulnerable\
  \ (if well implemented) to most traditional attacks, except for the same ones we\
  \ find against the classic discrete logarithm (such as Pollard Rho or a birthday\
  \ attack) and man-in-the-middle attacks in D–H ECC. In the quantum case, however,\
  \ Shor's algorithm can probably solve the elliptic curve problem, as we will see\
  \ in the next chapter, dedicated to quantum cryptography. Thus, if someone asks:\
  \ are my Bitcoins secured for the next 10 or 20 years? We can answer: under determinate\
  \ conditions, yes, but if the beginning of the quantum-computing era generates enough\
  \ qubits to break the classical discrete logarithm problem, it will probably break\
  \ the ECC discrete logarithm problem in polynomial time too. So, I agree with Jeremy\
  \ Wohlwend (a Ph.D. candidate at MIT), who wrote about *Elliptic Curve Cryptography:\
  \ Pre and Post Quantum:* \"Sadly, the day that quantum computers can work with a\
  \ practical number of qubits will mark the end of ECC as we know it.\"\n\n## Summary\n\
  \nIn this chapter, we have analyzed some of the most used elliptic curves. We have\
  \ seen what an elliptic curve is and how it is designed to be used in cryptography.\
  \ ECC has algorithms and protocols designed mainly to cover secrets related to public/private\
  \ encryption systems, such as the D–H key exchange and the digital signature. In\
  \ particular, we analyzed the discrete logarithm problem transposed into ECC, so\
  \ we have familiarized ourselves with the operations at the core of ECC, such as\
  \ adding points on the curve and scalar multiplications. These kinds of operations\
  \ are quite different from the addition and multiplication we are familiar with;\
  \ here, indeed, lies the strength of elliptic curves. After the experimentation\
  \ done on D–H ECC, we analyzed in detail secp256k1, which is the elliptic curve\
  \ used to implement digital signatures on Bitcoin protocol through the ECDSA. So,\
  \ now that you have learned about elliptic curves and systems as alternative methods\
  \ in public/private encryption, you can understand that one of the best properties\
  \ of these curves is the grade of efficiency in their implementation, which can\
  \ be a lower key size. At the end of this chapter, we asked a question about ECC's\
  \ robustness regarding quantum attacks. It was with this answer that I introduced\
  \ the topic of *Chapter 8, Quantum Cryptography*. This chapter will, for sure, cover\
  \ one of the most intriguing and bizarre topics of this book. Quantum computing\
  \ and quantum cryptography will be the new challenge for cryptography's future.\n"
