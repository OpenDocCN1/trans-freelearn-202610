  #\">Separated link</a>\n                </li>\n            </ul>\n        </div>\n\
  \    </div>\n</div>\n<div class=\"panel-body\">\n    <div id=\"morris-area-chart\"\
  ></div>\n</div>\n</div>\n</div>\n```\n\n11. 接下来，将以下 section 声明添加到文件底部，该声明会将必要的 JavaScript\
  \ 文件注入到视图中，用于图表组件：\n\n```\n@section scripts{\n    <script src=\"@Url.Content(\"\
  ~/js/plugins/morris/raphael-2.1.0.min.js\")\"></script>\n```\n\n\n\n\n\n```cshtml\n\
  <script src=\"@Url.Content(\"~/js/plugins/morris/morris.js\")\"></script>\n<script\
  \ src=\"@Url.Content(\"~/js/dashboard-demo.js\")\"></script>\n}\n```\n\n12. 最后，打开\
  \ _Layout.cshtml 文件并找到以下行：\n\n    ```html\n    <a href=\"index.html\"><i class=\"\
  fa fa-dashboard fa-fw\"></i> Dashboard</a>\n    ```\n\n13. 将找到的行更改为以下行：\n\n    ```cshtml\n\
  \    <a href=\"@Url.Action(\"Index\",\"Home\")\"><i class=\"fa fa-dashboard fa-fw\"\
  ></i> Dashboard</a>\n    ```\n\n14. 保存并关闭所有文件并运行你的项目。\n\n15. 当你导航到 **Dashboard**\
  \ 页面时，你应该会看到一个图表渲染，类似于以下截图。\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_155_0.png)\n\
  \n## Summary\n\n在本章中，你学习了如何将预设计的 HTML 模板转换为可用的 ASP.NET MVC 项目。本章中展示的技术可以应用于几乎任何\
  \ HTML 模板，让你能够在无需自行设计布局的情况下构建专业设计的 Web 应用程序。\n\n在下一章中，我们将探讨如何在自己的 ASP.NET MVC 项目中包含和使用\
  \ jQuery DataTables 插件。\n\n## Using the jQuery DataTables Plugin with Bootstrap\n\
  \njQuery DataTables 插件允许开发者为任何 HTML 表格添加创新交互控件。\n\njQuery DataTables 插件支持多种选项和丰富的扩展。ASP.NET\
  \ MVC 开发者也可以将其包含在自己的项目中。本章的目的不仅是向你展示如何使用 DataTables 插件，还说明了如何将几乎任何开源 JavaScript\
  \ 和 CSS 插件或框架与 ASP.NET MVC 一起使用。\n\n在本章中，我们将涵盖以下主题：\n\n- An overview of jQuery DataTables\n\
  - Including the jQuery DataTables plugin in your ASP.NET MVC project\n- Loading\
  \ and displaying data with jQuery DataTables and ASP.NET MVC\n- Using some of the\
  \ extensions\n\n### jQuery DataTables\n\nDataTables 是一个免费的、开源的 jQuery JavaScript\
  \ 库插件，由一家名为 SpryMedia Ltd 的公司设计和创建。该插件使为任何标准 HTML 表格添加排序、过滤、分页和搜索等功能变得非常容易实现。它还提供各种扩展，可实现类似\
  \ Excel 的功能、内联编辑和固定列等。DataTables 网站提供有良好文档的示例、博客和论坛，你可以在 www.datatables.net 上找到。\n\
  \njQuery DataTables 插件可以通过两种方式添加到你的 ASP.NET MVC 项目中，DataTables NuGet 包或 **Content\
  \ Delivery Network (CDN)**。\n\n### Adding DataTables to your ASP.NET MVC project\n\
  \n要添加 DataTables 插件的基本功能，需要以下两个文件：\n\n- 第一个是 `jquery.dataTables.css`，它包含表格的默认 CSS\
  \ 样式\n- 第二个是 `jquery.dataTables.js`，它包含用于渲染 DataTables 插件并添加必要功能的 JavaScript 逻辑\n\
  \n这两个文件都可在 DataTables CDN 上获得，链接如下：\n\n- //cdn.datatables.net/1.10.0/css/jquery.dataTables.css\n\
  - //cdn.datatables.net/1.10.0/js/jquery.dataTables.js\n\n### Using the DataTables\
  \ NuGet package\n\n你也可以使用 NuGet 添加使用 jQuery DataTables 所需的所有 CSS 和 JavaScript 文件以及扩展的所有\
  \ CSS 和 JavaScript 文件。按照以下步骤使用 NuGet 添加 jQuery DataTables：\n\n1. 在 Visual Studio\
  \ 中，通过导航到 **Tools | Library Package Manager | Package Manager Console** 打开 **Package\
  \ Manager Console** 窗口。\n2. 在 **Package Manager Console** 窗口中，输入以下命令：`Install-Package\
  \ jquery.datatables`\n3. NuGet 包将在 `Content` 文件夹内添加一个 `DataTables-1.10.0` 文件夹，其中包含\
  \ DataTables 插件所需的 `css`、`images` 和 `swf` 文件。\n4. 它还将在你的项目中向 `Scripts` 文件夹添加一个 `DataTables-1.10.0`\
  \ 文件夹。该文件夹将包含 DataTables 插件的 JavaScript 文件以及所有扩展的 JavaScript 文件。\n\n### Using the\
  \ CDN\n\n你可以从上述位置保存文件或将它们添加到项目中，或者更推荐的做法是添加对托管在 CDN 上的文件的引用，这将有助于提高你网站的性能。\n\n要从\
  \ CDN 引用，请完成以下步骤：\n\n1. 在 Visual Studio 中，打开本书附带的示例项目并打开位于 `Views\\Shared` 文件夹中的\
  \ `_Layout.cshtml` 文件。\n\n2. 在 `_Layout.cshtml` 文件的 `<head>` 元素内，通过插入以下标记行添加对 jQuery\
  \ DataTables 样式表的引用：\n\n    ```html\n    <link rel=\"stylesheet\" type=\"text/css\"\
  \ href=\"//cdn.datatables.net/1.10.0/css/jquery.dataTables.css\">\n    ```\n\n3.\
  \ 打开你需要 DataTables 功能的视图，并在视图底部添加对 JavaScript 库的引用，添加以下代码：\n\n    ```cshtml\n  \
  \  @section scripts{\n        <script type=\"text/javascript\" language=\"javascript\"\
  \ src=\"//cdn.datatables.net/1.10.0/js/jquery.dataTables.min.js\"></script>\n  \
  \  }\n    ```\n\n### Adding Bootstrap styling to DataTables\n\n前一节中提到的步骤将向视图和布局文件添加生成\
  \ jQuery DataTables 基础样式和功能所需的最小文件。然而，默认的 DataTables CSS 样式在 Bootstrap 网站中看起来可能有些格格不入。\n\
  \n幸运的是，DataTables 项目团队创建了专门针对 Bootstrap 的 CSS 样式和 JavaScript 库，以匹配你网站的外观和感觉。这两个文件也可在\
  \ DataTables CDN 上获得：\n\n- `//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.css`\n\
  - `//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.js`\n\
  \n这两个文件以与普通 DataTables CSS 和 JavaScript 文件相同的方式添加。请记住，当在视图中包含特定于 Bootstrap 的 DataTables\
  \ JavaScript 文件时，你需要同时引用默认的 DataTables JavaScript 文件以及特定于 Bootstrap 的文件，如以下标记所示：\n\
  \n```html\n<script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/1.10.0/js/jquery.dataTables.min.js\"\
  ></script>\n<script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.js\"\
  ></script>\n```\n\n### Loading and displaying data in jQuery DataTables\n\n为了实现\
  \ jQuery DataTables 插件，我们首先需要创建一个新的视图，用于在 HTML 表格中列出数据。对于此示例，我们将创建一个列出 Northwind\
  \ Traders 数据库中客户的视图。为此，完成以下步骤：\n\n1. 在 Visual Studio 中，添加一个名为 CustomersController.cs\
  \ 的新控制器类。\n\n2. 我们在项目中实现了依赖注入，因此我们将向该类添加一个构造函数，该构造函数将自动使用以下代码设置对数据库上下文的引用：\n\n \
  \   ```csharp\n    public CustomersController(ApplicationDbContext context)\n  \
  \  {\n        _context = context;\n    }\n    ```\n\n3. _context 对象是在类内部声明的本地字段，如下所示：\n\
  \n    ```csharp\n    private readonly ApplicationDbContext _context;\n    ```\n\n\
  4. 向控制器添加一个名为 Index 的新方法。此方法向控制器返回一个 ActionResult 对象。向其中添加以下代码，该代码将客户对象列表传递给视图：\n\
  \n    ```csharp\n    public ActionResult Index()\n    {\n        var model = _context.Customers;\n\
  \        return View(model);\n    }\n    ```\n\n```cshtml\n<h1>Customers <small>Our\
  \ Customers</small></h1>\n</div>\n\n<ol class=\"breadcrumb\">\n    <li>@Html.ActionLink(\"\
  Home\", \"Index\", \"Home\")</li>\n    <li class=\"active\">Customers</li>\n</ol>\n\
  <table class=\"table table-striped table-hover\">\n    <thead>\n        <tr>\n \
  \           <th>\n                @Html.DisplayNameFor(model => model.\n       \
  \         CustomerCode)\n            </th>\n            <th>\n                @Html.DisplayNameFor(model\
  \ => model.\n                CompanyName)\n            </th>\n            <th>\n\
  \                @Html.DisplayNameFor(model => model.\n                ContactName)\n\
  \            </th>\n            <th>\n                @Html.DisplayNameFor(model\
  \ => model.City)\n            </th>\n            <th>\n                @Html.DisplayNameFor(model\
  \ => model.Country)\n            </th>\n            <th>\n                @Html.DisplayNameFor(model\
  \ => model.Phone)\n            </th>\n        </tr>\n    </thead>\n    <tbody>\n\
  \        @foreach (var item in Model)\n        {\n            <tr>\n           \
  \     <td>\n                    @Html.ActionLink(item.CustomerCode,\n          \
  \          \"Edit\", new { id = item.CustomerId })\n                </td>\n    \
  \            <td>\n                    @Html.DisplayFor(modelItem => item.\n   \
  \                 CompanyName)\n                </td>\n                <td>\n  \
  \                  @Html.DisplayFor(modelItem => item.\n                    ContactName)\n\
  \                </td>\n                <td>\n```\n\n\n\n\n\n## 使用 jQuery DataTables\
  \ 插件与 Bootstrap\n\n```html\n$('.table').dataTable();\n});\n</script>\n}\n```\n```\n\
  \n- 5. 在前一步中，我们添加了对 DataTables 样式表以及 JavaScript 文件的必要引用。我们创建了一个 jQuery 事件处理程序，当页面加载后，它将对所有类名为\
  \ `table` 的 HTML 元素启用 DataTable 功能。\n\n当你运行项目并导航到 customers 视图时，你会看到客户列表会自动分页为每组十条，并且你可以搜索和排序表格内的数据，如下面的截图所示。Bootstrap\
  \ 默认的表格样式也会被正确应用：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_164_0.png)\n\n## DataTables\
  \ 扩展\n\njQuery DataTables 插件提供了多种多样的扩展，可以显著增强插件的功能。\n\n### ColReorder 扩展\n\nColReorder\
  \ 扩展允许用户通过点击并将列标题拖拽到他们喜欢的位置来重新排列表列。要为你的 DataTables HTML 表格启用列重新排序，请完成以下步骤：\n\n-\
  \ 1. 打开 _Layout.cshtml 文件，并添加对 dataTables.colReorder.css 文件的引用：\n- ```\n<link rel=\"\
  stylesheet\" type=\"text/css\" href=\"//cdn.datatables.net/colreorder/1.1.1/css/dataTables.colReorder.css\"\
  >\n```\n- 2. 打开视图的 .cshtml 文件，并添加对 DataTables、DataTables Bootstrap 和 ColReorder\
  \ 扩展 JavaScript 文件的引用：\n- ```\n<script type=\"text/javascript\" language=\"javascript\"\
  \ src=\"//cdn.datatables.net/1.10.0/js/jquery.dataTables.min.js\"></script>\n<script\
  \ type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.js\"\
  ></script>\n<script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/colreorder/1.1.1/js/dataTables.colReorder.min.js\"\
  ></script>\n```\n- 3. 最后，使用 jQuery 添加一个事件处理程序，在页面加载完成后初始化 DataTables 插件和 ColReorder\
  \ 扩展：\n- ```\n<script type=\"text/javascript\">\n$(document).ready(function () {\n\
  $(\".table\").DataTable({\n\"dom\": 'Rlfrtip'\n});\n});\n</script>\n```\n\n4. 当导航到该页面时，你现在应该能够拖拽并重新排列表中的列。拖拽列时会显示一条蓝线，如下图所示：\n\
  \n![](img/371b9a67300a03b7b335eb8a6fe55d94_166_0.png)\n\n> 注意，我们从 DataTables CDN（可在\
  \ cdn.datatables.net 获取）引用了所有扩展所需的样式表和 JavaScript 文件。\n\n### ColVis 扩展\n\nColVis\
  \ 扩展会在 DataTable 顶部添加一个按钮，点击该按钮时，会显示表格中列名的列表，每列旁边有一个复选框。然后，用户可以取消选择他们不想在网格中看到的列名。\n\
  \n要启用列可见性扩展，请执行以下步骤：\n\n- 1. 打开 _Layout.cshtml 文件，并添加对 dataTables.colVis.css 文件的引用：\n\
  \n```\n<link rel=\"stylesheet\" type=\"text/css\" href=\"//cdn.datatables.net/colvis/1.1.0/css/dataTables.colVis.css\"\
  >\n```\n\n- 2. 打开视图的 .cshtml 文件，并添加对 DataTables、DataTables Bootstrap 和 ColVis 扩展\
  \ JavaScript 文件的引用：\n\n```\n<script type=\"text/javascript\" language=\"javascript\"\
  \ src=\"//cdn.datatables.net/1.10.0/js/jquery.dataTables.min.js\"></script>\n<script\
  \ type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.js\"\
  ></script>\n<script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/colvis/1.1.0/js/dataTables.colVis.min.js\"\
  ></script>\n```\n\n- 3. 最后，使用 jQuery 添加一个事件处理程序，在页面加载完成后初始化 DataTables 插件和 ColVis\
  \ 扩展：\n\n```\n<script type=\"text/javascript\">\n    $(document).ready(function\
  \ () {\n        $('table').DataTable({\n            \"dom\": 'C<\"clear\">lfrtip'\n\
  \        });\n    });\n</script>\n```\n\n- 4. 导航到 Customers 页面时，你应该会在搜索框旁边看到一个按钮，通过该按钮可以显示或隐藏表格中的列，如下面的截图所示：\n\
  \n![](img/371b9a67300a03b7b335eb8a6fe55d94_167_0.png)\n\n### TableTools 扩展\n\njQuery\
  \ DataTables 的 TableTools 扩展在表格顶部添加了一个工具栏，用户可以通过它复制到剪贴板、导出为 CSV 以及将 DataTable 中的数据打印为\
  \ PDF。这是为你的用户提供数据导出功能的一种非常简单的方法。\n\n要使用 TableTools 扩展，请执行以下步骤：\n\n- 1. 在项目根目录下创建一个名为\
  \ `swf` 的新文件夹。\n- 2. 将 `copy_csv_xls_pdf.swf` 文件添加到 `swf` 文件夹中。该 `.swf` 文件包含在 DataTables\
  \ 插件下载中。\n- 3. 打开 `_Layout.cshtml` 文件，并添加对 `dataTables.tableTools.css` 文件的引用：\n\
  - ```html\n<link rel=\"stylesheet\" type=\"text/css\" href=\"//cdn.datatables.net/tabletools/2.2.1/css/dataTables.tableTools.css\"\
  >\n```\n- 4. 打开视图的 `.cshtml` 文件，并添加对 DataTables、DataTables Bootstrap 和 TableTools\
  \ 扩展 JavaScript 文件的引用：\n\n```html\n<script type=\"text/javascript\" language=\"\
  javascript\" src=\"//cdn.datatables.net/1.10.0/js/jquery.dataTables.min.js\"></script>\n\
  <script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/tabletools/2.2.1/js/dataTables.tableTools.min.js\"\
  ></script>\n<script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.js\"\
  ></script>\n```\n\n- 5. 最后，使用 jQuery 添加一个事件处理程序，在页面加载完成后初始化 DataTables 插件和 TableTools\
  \ 扩展：\n\n```javascript\n<script type=\"text/javascript\">\n    $(document).ready(function\
  \ () {\n        var table = $('.table').dataTable();\n        var tt = new $.fn.dataTable.TableTools(table);\n\
  \        $(tt.fnContainer()).insertBefore('div.dataTables_wrapper');\n    });\n\
  </script>\n```\n\n6. 上面突出显示的代码用于初始化 TableTools 扩展，并将 Bootstrap 样式应用于 TableTools\
  \ 工具栏按钮。当打开带有 DataTable 的视图时，你应该会在 DataTable 上方看到 TableTools 按钮工具栏，如下面的截图所示：\n\n\
  ![](img/371b9a67300a03b7b335eb8a6fe55d94_169_0.png)\n\n## 总结\n\n在本章中，我们使用 jQuery\
  \ DataTables 插件实现了一个可排序、可搜索且可扩展的 HTML 表格。我们还探讨了如何指定插件使用默认的 Bootstrap 样式。本章还应让你有信心探索其他开源插件，并将它们整合到你自己的\
  \ ASP.NET MVC 项目中。\n\n在下一章也是最后一章中，我们将了解 `TwitterBootstrapMVC` 库，以及如何在你自己项目中使用它。\n\
  \n流式实现还在 Visual Studio 中提供了 IntelliSense，使开发人员能够轻松发现 Bootstrap 配置选项。该库已不再是开源或免费的，但你仍然可以在\
  \ GitHub 上查看原始项目：`https://github.com/DmitryEfimenko/TwitterBootstrapMvc`。\n\n该库的商业版本可在\
  \ `https://www.twitterbootstrapmvc.com/` 获取。\n\n## 在项目中引入 TwitterBootstrapMVC\n\n\
  你可以通过以下两种方式之一在项目中引入 `TwitterBootstrapMVC` 库。第一种也是推荐的方式是使用 NuGet 包，第二种方式是下载 `.dll`\
  \ 文件并手动添加引用。\n\n### 使用 NuGet 添加 TwitterBootstrapMVC\n\n要使用 NuGet 在项目中引入 `TwitterBootstrapMVC`\
  \ 库，请执行以下步骤：\n\n- 1. 在 Visual Studio 中，通过**工具 | 库程序包管理器 | 程序包管理器控制台**菜单打开**程序包管理器控制台**窗口。\n\
  - 2. 在**程序包管理器控制台**窗口中，输入以下命令并按 *回车*：\n- ```\nInstall-Package TwitterBootstrapMVC5\n\
  ```\n- 3. 接下来，导航到 `https://www.twitterbootstrapmvc.com/Download`，下载试用版或购买个人或商业许可证。\n\
  - 4. 下载许可证文件，该文件应名为 `TwitterBootstrapMvcLicense.lic`，并将其添加到 Visual Studio 中项目的根目录。\n\
  - 5. 打开 Views 文件夹中的 `Web.config` 文件，并将以下代码添加到 `<namespaces>` 元素中：\n- ```xml\n<add\
  \ namespace=\"TwitterBootstrapMVC\" />\n<add namespace=\"TwitterBootstrap3\" />\n\
  ```\n- 6. 最后，打开项目根目录中的 `Global.asax` 文件，并将以下代码行添加到 `Application_Start` 方法中：\n- ```csharp\n\
  Bootstrap.Configure();\n```\n\n```\nInstall-Package TwitterBootstrapMVC5\n```\n\n\
  ```\n<add namespace=\"TwitterBootstrapMVC\" />\n<add namespace=\"TwitterBootstrap3\"\
  \ />\n```\n\n```\nBootstrap.Configure();\n```\n\n\n\n\n\n## 使用 .dll 文件添加 TwitterBootstrapMVC\n\
  \n你不需要通过 NuGet 添加 TwitterBootstrapMVC 库，你也可以使用 .dll 文件来添加它。为此，请完成以下步骤：\n\n1. 在浏览器中，导航到\
  \ `https://www.twitterbootstrapmvc.com/Home/Installation`，并下载位于 **选项 2：下载 .dll**\
  \ 标题下的 zip 压缩包。\n2. 下载 zip 文件后，将文件解压到本地驱动器上的一个文件夹中。\n3. 在 Visual Studio 中，右键单击 **解决方案资源管理器**\
  \ 窗口中的 **引用** 节点，然后从上下文菜单中选择 **添加引用...**。\n4. 浏览到解压 zip 压缩包的文件夹，然后选择 `TwitterBootstrapMVC5.dll`\
  \ 文件。\n5. 接下来，导航到 `https://www.twitterbootstrapmvc.com/Download`，下载试用版或购买个人或商业许可证。\n\
  6. 下载许可证文件，它应该被命名为 `TwitterBootstrapMvcLicense.lic`，并将其添加到 Visual Studio 中项目的根目录。\n\
  7. 打开 Views 文件夹中的 Web.config 文件，并将以下代码添加到 `<namespaces>` 元素中：\n\n   ```xml\n   <add\
  \ namespace=\"TwitterBootstrapMVC\" />\n   <add namespace=\"TwitterBootstrap3\"\
  \ />\n   ```\n\n8. 最后，打开项目根目录中的 Global.asax 文件，并将以下代码行添加到 Application_Start 方法中：\n\
  \n   ```csharp\n   Bootstrap.Configure();\n   ```\n\n## 使用 TwitterBootstrapMVC 辅助方法\n\
  \nTwitterBootstrapMVC 库提供了多种 Bootstrap 辅助方法，所有这些方法都使用流畅的语法，支持方法链式调用。这些辅助方法可以减少你创建\
  \ Bootstrap 组件所需的 HTML 标记数量。库中的方法链遵循以下模式：\n\n```csharp\n@Html.Bootstrap().TextBoxFor(m\
  \ => m.PostalCode).Value(\"1.23\").\n    Size(InputSize.Large).Placeholder(\"Enter\
  \ Postal Code\").\n    Format(\"{0:0.00}\").Prepend(\"US\")\n```\n\n## 表单和输入元素\n\
  \nTwitterBootstrapMVC 为大多数表单和输入元素提供了流畅的辅助方法。\n\n### 输入元素\n\nTwitterBootstrapMVC\
  \ 为所有 HTML 输入元素提供了 ASP.NET MVC 辅助方法；这些组件中的大多数都共享相同的链式方法。这些方法列在下表中：\n\n| 方法名 | 描述\
  \ |\n|---|---|\n| .Label() | 将一个标签元素添加到该元素前面。 |\n| .Tooltip() | 向组件添加带有指定消息的工具提示。\
  \ |\n| .HelpText() | 在元素旁边添加帮助文本。 |\n| .Id() | 设置元素的 id 属性。 |\n| .Class() | 设置元素的\
  \ class HTML 属性。 |\n| .ReadOnly() | 向元素添加 readonly=\"readonly\"。 |\n| .HtmlAttributes()\
  \ | 向元素添加指定的 HTML 属性。 |\n| .Data() | 其工作方式与 .HtmlAttributes() 方法类似，但会在属性前添加 data-\
  \ 前缀。 |\n| .Disabled() | 向元素添加 disabled=\"disabled\"。 |\n| .DisabledDependsOn()\
  \ | 根据另一个元素的值，有条件地禁用某个元素。 |\n| .VisibleDependsOn() | 根据另一个元素的值，有条件地隐藏某个元素。 |\n|\
  \ .ShowValidationMessage() | 设置当元素验证失败时是否显示验证消息。 |\n\n### 表单\n\n使用以下代码，你可以生成一个简单的垂直\
  \ Bootstrap 表单，其中包含三个文本框和一个提交按钮。前两个文本框还调用了 Placeholder 方法，向空文本框添加占位符文本；最后一个文本框还有一个名为\
  \ HelpText 的方法，用于在文本框底部添加帮助文本。\n\n```csharp\n@using (var form = Html.Bootstrap().Begin(new\
  \ Form()))\n{\n    @form.FormGroup().TextBoxFor(m => m.CompanyName).Placeholder(\"\
  Enter the company name.\")\n    @form.FormGroup().TextBoxFor(m => m.ContactName).Placeholder(\"\
  Enter the name of contact person.\")\n    @form.FormGroup().TextBoxFor(m => m.Address).HelpText(\"\
  Short address for customer.\")\n    @Html.Bootstrap().SubmitButton()\n}\n```\n\n\
  生成的表单在浏览器中应该类似于以下截图：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_175_0.png)\n\n\
  你还会注意到，如果该值是必填的，FormGroup 辅助方法会自动在字段标签上添加一个星号 (*)。\n\n要生成内联或垂直形式的相同表单，只需在 Form 对象上调用\
  \ Type 方法，并将布局作为参数传递给 Type 方法即可。该参数是一个枚举（enum）值，启用 IntelliSense 后会列出所有可用选项：\n\n\
  ```csharp\n@using (var form = Html.Bootstrap().Begin(new Form().Type(FormType.Inline)))\n\
  {\n    @form.FormGroup().TextBoxFor(m => m.CompanyName).Placeholder(\"Enter the\
  \ company name.\")\n    @form.FormGroup().TextBoxFor(m => m.ContactName).Placeholder(\"\
  Enter the name of contact person.\")\n    @form.FormGroup().TextBoxFor(m => m.Address)\n\
  \    @Html.Bootstrap().SubmitButton()\n}\n```\n\n生成的表单将类似于以下截图：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_176_0.png)\n\
  \nTextbox 辅助方法提供了以下扩展方法，用于向文本框元素添加额外的格式或功能：\n\n| 方法名 | 描述 |\n|---|---|\n| .Value()\
  \ | 设置文本框的值。 |\n| .Size() | 设置文本框的大小。此方法也接受 InputSize 枚举。 |\n| .Placeholder() |\
  \ 指定文本框的占位符文本。 |\n| .Format() | 用于指定文本框的数据格式。 |\n| .Append() | 将指定的字符串追加到文本框的末尾。此方法还会创建一个输入组。\
  \ |\n| .AppendIcon() | 将图标附加到文本框的末尾。 |\n| .Prepend() | 与 .Append() 方法相反。此方法将指定的字符串添加到文本框的前面，并创建一个输入组。\
  \ |\n| .PrependIcon() | 将指定的图标添加到文本框的前面。 |\n| .TypeAhead() | 为文本框启用 TypeAhead 功能。\
  \ |\n\n在以下示例中，我们将为模型的 `PostalCode` 属性创建一个文本框，将其值设置为 1.23，并将其大小设置为 Large。然后，我们将指定占位符文本和格式，最后在文本框前面添加一个字符串：\n\
  \n```csharp\n@Html.Bootstrap().TextBoxFor(m => m.MinimumTransactionValue).\n   \
  \ Value(\"1.23\").Size(InputSize.Large).Placeholder(\"Enter Postal Code\").\n  \
  \  Format(\"{0:0.00}\").Prepend(\"US\")\n```\n\n生成的文本框在浏览器中应类似于以下截图：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_177_0.png)\n\
  \n要使用 `TwitterBootstrapMVC` 库创建文本区域输入，可以使用 `TextAreaFor` 辅助方法。该辅助方法支持另外两个方法，你可以用它们来指定文本区域的列数和行数。在以下示例中，我们将为模型的\
  \ `Address` 属性创建一个文本区域，并将其列数设置为 10，行数设置为 5：\n\n```csharp\n@Html.Bootstrap().TextAreaFor(m\
  \ => m.Address).Columns(10).Rows(5)\n```\n\n文本区域在浏览器中的渲染效果应类似于以下截图：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_177_1.png)\n\
  \n## 按钮和链接\n\n`TwitterBootstrapMVC` 库为 Bootstrap 按钮和链接提供了流畅的辅助方法。按钮和链接的辅助方法都共享以下扩展方法：\n\
  \n| 方法名 | 描述 |\n|---|---|\n| .AppendIcon() | 将指定的图标附加到按钮或链接上。 |\n| .PrependIcon()\
  \ | 将指定的图标添加到按钮或链接的前面。 |\n| .Disabled() | 向按钮或链接添加 `disabled` 类。 |\n\n在以下代码示例中，我们将创建一个简单的提交按钮，其前面和后面都有图标。请注意使用\
  \ `glyphicon` 类名来指定要使用的图标。\n\n```csharp\n@Html.Bootstrap().Button().AppendIcon(\"\
  glyphicon glyphicon-pencil\").\n    PrependIcon(\"glyphicon glyphicon-music\")\n\
  ```\n\n上述标记将在浏览器中渲染为以下截图：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_178_0.png)\n\
  \n`ActionLinkButton`、`Button` 和 `SubmitButton` 辅助方法共享以下扩展方法：\n\n| 方法名 | 描述 |\n|---|---|\n\
  | .Text() | 设置按钮的标题/文本。 |\n| .Name() | 指定 HTML name 属性。 |\n| .Value() | 设置 value\
  \ HTML 属性。 |\n| .Size() | 指定按钮的大小。此方法也接受 `ButtonSize` 枚举作为参数。 |\n| .Style() | 设置按钮的样式。此方法也接受\
  \ `ButtonStyle` 枚举作为参数。 |\n| .ButtonBlock() | 将按钮扩展到容器的整个宽度。 |\n\n\n\n\n\n| 方法名称\
  \ | 描述 |\n|---|---|\n| `.LoadingText()` | 这会在按钮被点击后设置应显示的文本。 |\n| `.DropDownToggle()`\
  \ | 这会将 dropdown-toggle 类名应用到按钮上。 |\n\n以下代码使用 `TwitterBootstrapMVC` 流畅助手语法生成一个大号的绿色\
  \ Bootstrap 按钮并设置其标题：\n\n```csharp\n@Html.Bootstrap().Button().Text(\"Buy Now\"\
  ).Size(ButtonSize.Large).Style(ButtonStyle.Success)\n```\n\n该按钮在浏览器中应类似于以下截图：\n\n\
  ![](img/371b9a67300a03b7b335eb8a6fe55d94_179_0.png)\n\n`ActionLinkButton` 和 `ActionLink`\
  \ 助手共享以下扩展方法：\n\n| 方法名称 | 描述 |\n|---|---|\n| `.Protocol()` | 这指定了 URL 的协议，例如 http\
  \ 或 https |\n| `.HostName()` | 这设置了 URL 的主机名 |\n| `.Fragment()` | 这设置了 URL 的锚点名称\
  \ |\n| `.RouteName()` | 这指定了路由名称 |\n| `.RouteValues()` | 这设置了路由值 |\n| `.Title()`\
  \ | 这设置了 title HTML 属性 |\n\n在以下代码中，我们将创建一个 `ActionLinkButton` 对象。请注意我们如何将 `.Style`\
  \ 和 `.PrependIcons` 方法与 `ActionLinkButton` 方法结合使用：\n\n```csharp\n@Html.Bootstrap().ActionLinkButton(\"\
  Go to Buttons\", \"Buttons\").Protocol(\"http\").Title(\"Buttons Link\").Style(ButtonStyle.Link).PrependIcon(\"\
  glyphicon glyphicon-film\")\n```\n\n结果将在浏览器中渲染一个带有图标的链接，如以下截图所示：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_180_0.png)\n\
  \n## 折叠面板和面板\n\nTwitterBootstrapMVC 提供的折叠面板和面板助手都应使用可释放的 Begin 方法。\n\n折叠面板方法还有另一个名为\
  \ `BeginPanel` 的方法，用于在折叠面板组件内部指示一个新的面板。以下代码将生成一个包含两个面板的折叠面板。请注意两个面板也是可释放的。\n\n```csharp\n\
  @using (var accordian = Html.Bootstrap().Begin(new Accordion(\"FAQ\")))\n{\n   \
  \ using (accordian.BeginPanel(\"Question 1\"))\n    {\n        <p>Etiam luctus nunc\
  \ ipsum, sed facilisis velit.</p>\n    }\n    using (accordian.BeginPanel(\"Question\
  \ 2\"))\n    {\n        <p>Duis volutpat iaculis nisl, ut porttitor.</p>\n    }\n\
  }\n```\n\n折叠面板在浏览器中应类似于以下截图：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_180_1.png)\n\
  \n面板助手包含三个子方法，`BeginHeading`、`BeginBody` 和 `BeginFooter`。这些方法也可以通过调用 Heading、Body\
  \ 或 Footer 方法使用简写表示法进行调用。\n\n使用以下代码，我们将生成一个带有标题和页脚的面板。我们还将通过在 Panel 对象上调用共享的 Style\
  \ 方法来指定面板的样式。\n\n```csharp\n@using (var panel = Html.Bootstrap().Begin(new Panel().Style(PanelStyle.Danger)))\n\
  {\n    @panel.Heading(\"Panel Heading\")\n\n    using (panel.BeginBody())\n    {\n\
  \        <p>Proin mattis lacus ac enim aliquam, eu malesuada tortor pretium.</p>\n\
  \    }\n    @panel.Footer(\"Panel Footer\")\n}\n```\n\n此代码将在浏览器中渲染以下截图：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_181_0.png)\n\
  \n## 标签页和模态框\n\n标签页和模态框组件也提供流畅助手。新的标签页组件应使用可释放的 Begin 方法创建。标签页组件内的每个标签页必须使用 Tab\
  \ 扩展方法声明，并且每个标签页的内容应位于 BeginPanel 方法内部。\n\n在以下示例中，我们将创建一个包含两个标签页的标签页组件。请注意 Tab 方法上\
  \ AppendBadge 扩展方法的使用。\n\n```csharp\n@using (var tabs = Html.Bootstrap().Begin(new\
  \ Tabs(\"TabComponent\")))\n{\n    @tabs.Tab(\"Tab One\")\n```\n\n## 总结\n\n在本章中，您了解了\
  \ TwitterBootstrapMVC 库，并看到了如何使用该库减少视图的标记量。这也是本书的最后一章，到目前为止，您应该对在自己的 ASP.NET MVC\
  \ 项目中使用 Bootstrap 感到相当熟练，甚至可以准备好编写自己的代码生成工具和助手。\n\n请务必从 Packt Publishing 网站下载随本书附带的示例项目，以查看本书中提到的示例的实际效果。\n\
  \n感谢您的阅读。下次见，继续编码！\n\n## Bootstrap 资源\n\nBootstrap 社区是一个充满活力和庞大的社区。以下各节按任意顺序列出了互联网上可用的\
