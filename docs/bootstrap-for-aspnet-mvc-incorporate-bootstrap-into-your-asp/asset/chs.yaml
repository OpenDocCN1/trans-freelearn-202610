- "# 将 Bootstrap HTML 模板转换为可用的 ASP.NET MVC 项目\n\n使用 Bootstrap 的主要好处之一是互联网上可用的资源种类繁多。Web\
  \ 开发社区接受了 Bootstrap，你会发现大量有价值的模板、代码片段以及使用 Bootstrap 的建议。\n\n通过结合预设计的 Bootstrap 模板和\
  \ ASP.NET MVC，你可以节省大量时间，而无需担心网站布局或设计。\n\n在本章中，我们将涵盖以下主题：\n\n+   - 为什么我们使用预建的 HTML\
  \ 模板以及它们如何节省时间\n+   - 构建主布局\n+   - 添加特定的页面视图\n+   - 在视图中包含图表\n\n# 使用预建的 HTML 模板\n\
  \n众所周知，大多数开发人员不一定是优秀的设计师。我们更喜欢在后端工作，构建性能卓越且智能的软件，有时我们倾向于把用户界面视为事后才考虑的事情。\n\n通过使用预设计的\
  \ HTML Bootstrap 模板，我们可以为用户提供直观且设计精良的用户界面，该界面由专业设计师设计。如果设计基于 Bootstrap，开发人员已经熟悉大部分\
  \ CSS 类名、组件和插件，无需重新学习任何东西。\n\nWeb 提供了各种免费和付费的 Bootstrap 模板。ThemeForest（www.themeforest.net）提供了令人眼花缭乱的各种付费网站样式和设计。\n\
  \n在本章的示例中，我们将使用 Start Bootstrap（www.startbootstrap.com）设计的免费 SB Admin 2 模板。SB Admin\
  \ 2 模板是一个使用 Bootstrap 3 的管理主题，非常适合后端管理或更复杂风格的 Web 应用程序。该主题如下图所示：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_142_0.png)\n\
  \n在我们使用该模板构建 ASP.NET MVC 网站之前，我们需要通过完成以下步骤下载源文件：\n\n+   1. 导航到 `http://startbootstrap.com/sb-admin-v2`\
  \ 并单击 **Download** 按钮，以下载包含所有必要 HTML、CSS 和 JavaScript 文件的 zip 归档。\n+   2. 将文件提取到本地硬盘上的文件夹；你会注意到归档包含熟悉的\
  \ Bootstrap 文件夹：\n+      - `css`\n+      - `font-awesome`\n+      - `fonts`\n+ \
  \     - `js`\n+   3. 归档还包含许多 HTML 文件，展示了模板的各种页面和组件布局，如下图所示：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_143_0.png)\n\
  \n# 创建 ASP.NET MVC 项目\n\n要创建新的 ASP.NET MVC 项目，请执行以下步骤：\n\n+   1. 在 Visual Studio\
  \ 中，创建新的 **ASP.NET Web Application** 项目，如下图所示：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_144_0.png)\n\
  \n+   2. 在 **New ASP.NET Project** 对话框中，选择 **Empty** 模板，勾选 **MVC** 复选框，然后单击 **OK**\
  \ 按钮。\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_144_1.png)\n\n+   3. Visual Studio\
  \ 将创建一个默认的空 MVC 项目。右键单击项目名称并导航到 Add | New Folder。创建以下四个文件夹：\n+       - css\n+  \
  \     - font-awesome\n+       - fonts\n+       - js\n+   4. 将 SB Admin 源 css 文件夹中的以下\
  \ .css 文件添加到项目中的 css 文件夹：\n+       - bootstrap.css\n+       - sb-admin.css\n\n5.\
  \ 将 SB Admin 源 font-awesome\\css 文件夹中的 font-awesome.css 文件添加到项目中的 css 文件夹。\n\n6.\
  \ 将 SB Admin 源 fonts 和 font-awesome\\fonts 文件夹中的所有文件添加到项目中的 fonts 文件夹。\n\n+   7.\
  \ 将 SB Admin 源 js 文件夹中的以下文件添加到项目中的 js 文件夹：\n+       - bootstrap.js\n+       - sb-admin.js\n\
  \n# 创建主布局\n\n我们已添加创建项目主布局文件所需的 CSS、JavaScript 和字体文件。接下来，我们需要创建一个 home 控制器以及一个主布局文件。为此，完成以下步骤：\n\
  \n+   1. 右键单击 Controllers 文件夹并导航到 Add | Controller....\n+   2. 从 Add Scaffold 对话框窗口中选择\
  \ MVC 5 Controller - Empty，然后单击 Add。\n\n3. 在 Add Controller 对话框窗口的 Controller name\
  \ 文本框中输入 HomeController，然后单击 Add。\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_146_0.png)\n\
  \n4. 接下来，右键单击项目中的 Views 文件夹并导航到 Add | New Folder。将文件夹命名为 Shared。\n\n5. 右键单击新创建的\
  \ Shared 文件夹并导航到 Add | MVC 5 Layout Page (Razor)。\n\n6. 在 Specify Name for Item\
  \ 对话框中，在 Item name 文本框中输入 _Layout，然后单击 OK。\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_146_1.png)\n\
  \n7. 打开 SB Admin 源文件中的 blank.html 文件并将其内容复制到 _Layout.cshtml 文件。\n\n8. 将 <head> 标签更改为以下代码：\n\
  \n```\n<head>\n    <meta charset=\"utf-8\">\n    <meta name=\"viewport\" content=\"\
  width=device-width, initial-scale=1.0\">\n    <title>Start Bootstrap - SB Admin\
  \ Version 2.0 :: @ViewBag.Title</title>\n    <link href=\"@Url.Content(\"~/css/bootstrap.css\"\
  )\" rel=\"stylesheet\">\n    <link href=\"@Url.Content(\"~/css/font-awesome.css\"\
  )\" rel=\"stylesheet\">\n    <link href=\"@Url.Content(\"~/css/sb-admin.css\")\"\
  \ rel=\"stylesheet\">\n</head>\n```\n\n\n9. 在前面的标记中，我们使用 Url.Content 辅助方法将虚拟路径映射到项目中的\
  \ .css 文件。\n\n10. 在结束 </body> 标签上方添加以下代码：\n\n```\n<script src=\"//ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js\"\
  ></script>\n<script src=\"@Url.Content(\"~/js/bootstrap.js\")\"></script>\n<script\
  \ src=\"@Url.Content(\"~/js/sb-admin.js\")\"></script>\n@RenderSection(\"scripts\"\
  , false)\n```\n\n11. 在前面的代码中，我们添加了对托管在 Google 内容分发网络（CDN）上的 jQuery 库的引用。我们还再次使用\
  \ Url.Content 辅助方法将虚拟路径映射到所需的 JavaScript 文件，并使用 @RenderSection 辅助方法指定了一个名为 scripts\
  \ 的节。\n\n12. 接下来，你会注意到页面被划分为三个不同的元素：\n\n- 一个 ID 设置为 wrapper 的 <div> 元素\n- 一个 <nav>\
  \ 元素\n- 一个 ID 为 page-wrapper 的 <div> 元素\n\n13. 保持 <nav> 和 <div id=\"wrapper\"> 元素不变，并将\
  \ <div id=\"page-wrapper\"> 元素内的所有标记替换为 @RenderBody() 方法。\n\n14. 主布局现已完成；接下来，我们需要为\
  \ home 控制器上的 Index 操作添加一个视图。\n\n## 为 home 控制器添加视图\n\n我们需要为 home 控制器的 Index 操作创建一个视图，以测试我们的模板。完成以下步骤：\n\
  \n- 1. 打开 HomeController.cs 文件，在 Index 方法内右键单击，然后从上下文菜单中选择“添加视图...”。\n\n- 2. 在“添加视图”对话框中，将“视图名称”文本框设置为\
  \ Index，将“模板”组合框设置为“空（无模型）”。\n\n## 将 Bootstrap HTML 模板转换为可用的 ASP.NET MVC 项目\n\n\
  - 3. 勾选**使用布局页**复选框，并选择我们之前创建的 `_Layout.cshtml` 文件作为布局页。单击**添加**。\n\n- 4. 将在 Views\\\
  \\Home 文件夹内创建一个 Index.cshtml 文件。\n\n- 5. 向视图添加以下标记：\n\n```\n```cshtml\n@{\n    ViewBag.Title\
  \ = \"Index\";\n    Layout = \"~/Views/Shared/_Layout.cshtml\";\n}\n<div class=\"\
  row\">\n    <div class=\"col-lg-12\">\n        <h1 class=\"page-header\">Blank</h1>\n\
  \    </div>\n</div>\n```\n```\n\n- 6. 运行你的项目，你应该会在浏览器中看到首页视图和布局。请注意，左侧菜单将展开显示所有项目，如下图所示：\n\
  \n- 5. 通过在 </body> 结束元素上方添加以下行来引用 metisMenu 插件：\n+   <script src=\"@Url.Content(\"\
  ~/js/plugins/metisMenu/jquery.metisMenu.js\")\"></script>\n- 6. 当运行你的项目时，左侧菜单现在应该正确显示了。\n\
  \n## 添加不同的页面视图\n\nSB Admin 模板带有多种不同的页面样式，可用于构建我们自己的视图。我们将通过完成以下步骤，创建一个自定义视图，该视图显示两个面板，一个包含简单的\
  \ Bootstrap 表单，另一个显示图像：\n\n- 1. 向你的项目添加一个新的空 MVC 5 控制器，名为 FormsController。\n- 2.\
  \ 为控制器的 Index 方法添加一个新的空视图，并选择我们之前创建的布局页作为其布局页。\n- 3. 打开 Views\\Forms 文件夹中的 Index.cshtml\
  \ 文件。\n- 4. 向视图添加以下标记：\n\n```\n@{\n    ViewBag.Title = \"Index\";\n    Layout =\
  \ \"~/Views/Shared/_Layout.cshtml\";\n}\n\n<div class=\"row\">\n    <div class=\"\
  col-lg-12\">\n        <h1 class=\"page-header\">Forms</h1>\n    </div>\n</div>\n\
  <div class=\"row\">\n    <div class=\"col-lg-6\">\n        <div class=\"panel panel-primary\"\
  >\n            <div class=\"panel-heading\">\n                First Panel with simple\
  \ form\n            </div>\n            <div class=\"panel-body\">\n           \
  \     <div class=\"row\">\n                    <div class=\"col-lg-6\">\n      \
  \                  <form role=\"form\">\n```\n\n```\n<div class=\"form-group\">\n\
  \    <label>Full name</label>\n    <input class=\"form-control\"\nplaceholder=\"\
  Your full name\">\n    </div>\n    <div class=\"form-group\">\n        <label>Bio</label>\n\
  \        <textarea class=\"form-control\"\nrows=\"3\"></textarea>\n    </div>\n\n\
  \    <div class=\"form-group\">\n        <label>Subject</label>\n        <label\
  \ class=\"checkbox-inline\">\n            <input type=\"checkbox\">Math\n      \
  \  </label>\n        <label class=\"checkbox-inline\">\n            <input type=\"\
  checkbox\">Science\n        </label>\n        <label class=\"checkbox-inline\">\n\
  \            <input type=\"checkbox\">History\n        </label>\n    </div>\n  \
  \  <button type=\"submit\" class=\"btn btn-primary\">Save</button>\n</form>\n</div>\n\
