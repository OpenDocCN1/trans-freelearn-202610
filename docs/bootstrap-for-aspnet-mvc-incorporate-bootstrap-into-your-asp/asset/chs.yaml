  ,false)\n- 6. 通过添加上一行，我们可以为每个视图向布局页注入额外的 CSS 样式。\n- 7. 打开 Views\\Home 文件夹中的 Index.cshtml\
  \ 文件。\n- 8. 将以下代码添加到文件顶部，即布局声明下方：\n  @section styles{\n    <link href=\"@Url.Content(\"\
  ~/css//morris-0.4.3.min.css\")\" rel=\"stylesheet\">\n  }\n- 9. 上述代码会将 morris 图表组件的样式注入到我们的视图中。\n\
