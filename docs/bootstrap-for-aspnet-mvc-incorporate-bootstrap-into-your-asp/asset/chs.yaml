  ## About the Author


  **Pieter van der Westhuizen** is a freelance software and web developer specializing
  in ASP.NET MVC, web technologies, and MS Office development. He started his career
  in web development using classic ASP, Visual InterDev, HoTMetaL, and FrontPage.


  Pieter has over 15 years of experience in the IT industry and is also one of the
  people fortunate enough to have his hobby become his full-time profession. He is
  also a technology evangelist for Add-in Express (www.add-in-express.com), which
  focuses on tools for Microsoft Office integration.


  This is Pieter''s first foray into book writing although he has been blogging since
  2007 on his personal blog at www.mythicalmammoth.com and on the Add-in Express blog
  since 2010. He lives with his wife and Harrier (the dog, not the bird or Jump Jet)
  in Pretoria, South Africa.


  ## Acknowledgments


  To everyone who contributed to this book, thank you! A big thanks to the team at
  Packt Publishing, especially Rebecca, Priyanka, Kartik, and Aboli, for their guidance,
  advice, and professionalism.


  Thanks to my three technical reviewers, Jaco, Tinus, and Stephan, for patiently
  reading each chapter, reviewing each line of code, and contributing suggestions.
  You helped shape this book into what it is.


  I''d like to express my greatest love and gratitude towards my wife, Andrea, for
  all her support, impromptu editing sessions, being a soundboard for brainstorming
  sessions, and the general motivational pep talks during the writing of this book.


  To my parents — even though they were not exactly sure what this book was about
  — thank you for all your support and for allowing me to tinker with the family computer
  from an early age.


  I''d also like to extend a special thank you to Eugene Starostin from Add-in Express,
  who allowed me to blog about an idea that subsequently turned into this book.


  ## About the Reviewers


  **Jaco Fouché** has been involved with software development for over 22 years and
  is currently a database architect and software developer at SilverBridge in Pretoria,
  South Africa. He holds a B.Sc degree in Computer Science from the University of
  Pretoria. He has worked with different technologies but specializes in Microsoft
  technologies with specific emphasis on ASP.NET MVC and Microsoft SQL Server.


  With a number of years in the coding field, **Tinus Smit** has a passion for good,
  clean code and solving problems. A C# .NET developer at his core, he has also gained
  extensive knowledge of Microsoft SQL, Microsoft Dynamics CRM, JavaScript, Entity
  Framework, and MVC.


  The CRM experience is not limited to clicking a few buttons and dragging fields
  around in a form. He has had a hand in solving complex business problems with CRM''s
  workflow and plugin engines, often integrating with other systems in the process.
  Over the years, he has learned exactly where CRM fits best, what the product can
  do, where and how to extend it, and the best practices thereof.


  However, in the end, these are merely tools to solve problems. In Johannesburg,
  South Africa, he finds himself working tirelessly on projects for many companies
  over the years (from small to enterprise-sized), using these tools and experience.
  He sees every new challenge as an opportunity to learn something new and finds ways
  to teach what he has learned. Armed with a database and Visual Studio, he uses pragmatism
  and logic to help users reach their goal.


  He can be reached on Twitter at @CodingWithTinus or on his blog at http://codingwithtinus.wordpress.com.


  **Stephan Swart** has been interested in software development for the last 30 years.
  He has used a variety of technologies, programming languages, and platforms. Starting
  as a Cobol developer, embracing most of the latest technologies that were released
  at the time, he has been involved in .NET development since the very first release
  of .NET. In the last few years, he has lived and worked as a senior .NET developer
  using Web, Windows, and mobile technologies for a number of different companies
  in Europe, Canada, and South Africa. Among the technologies he used recently are
  ASP.NET MVC, jQuery, Knockout, C#, VB .NET, WPF, Silverlight, MVVM, Xamarin, and
  many more.


