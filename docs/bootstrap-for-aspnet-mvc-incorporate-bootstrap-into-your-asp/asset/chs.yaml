  ><i class=\"fa fa-table fa-fw\"></i> Tables</a>\n      ```\n\n- 3. 将上述行替换为以下内容：\n\
  \n      ```html\n      <a href=\"@Url.Action(\"Index\",\"Forms\")\"><i class=\"\
  fa fa-table fa-fw\"></i> Forms</a>\n      ```\n\n- 4. 我们使用 `@Url.Action` 辅助方法将用户导航到\
  \ forms 控制器的 Index 操作。当用户点击**Forms**菜单项时，他们将看到我们之前创建的表单视图。\n\n## 向视图添加图表\n\n在 SB\
  \ Admin 模板中，Dashboard 页面包含各种吸引人的图表，你可以使用它们以交互方式向用户显示数据。我们将通过完成以下步骤，将 SB Admin 模板中包含的\
