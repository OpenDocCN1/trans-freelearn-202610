  >\n                <div class=\"col-lg-6\">\n                    <p>This is a second\
  \ panel on the page</p>\n                    <img src=\"http://placehold.it/350x150\"\
  \nalt=\"placeholder\" />\n```\n\n```\n```html\n</div>\n</div>\n</div>\n</div>\n\
  </div>\n</div>\n```\n```\n\n5. 上述代码将渲染两个面板，一个蓝色和一个红色，如下图所示：\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_152_0.png)\n\
  \n最后，我们需要更改左侧导航菜单，以包含指向我们刚刚添加的视图的链接。为此，完成以下步骤：\n\n- 1. 打开 `Views\\Shared` 文件夹中的\
