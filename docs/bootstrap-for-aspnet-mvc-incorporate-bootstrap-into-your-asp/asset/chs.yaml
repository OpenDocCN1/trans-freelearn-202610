  \ 将 SB Admin 源文件中的以下两个文件添加到该文件夹：\n  - raphael-2.1.0.min.js\n  - morris.js\n- 3.\
  \ 将 dashboard-demo.js 文件添加到 js 文件夹。\n- 4. 将 morris-0.4.3.min.css 文件添加到项目的 css 文件夹。\n\
