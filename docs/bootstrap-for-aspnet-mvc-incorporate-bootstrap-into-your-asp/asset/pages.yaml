    \ which contains the short name of the object used as the model for the view.\n\
    +   8. Next, remove the `<div class=\"form-horizontal\">` line as well as the\
    \ `<h4>` and `<hr>` elements in the line below `<div>`.\n+   9. Remove all `<div\
    \ class=\"form-group\">` and `<div class=\"col-md-10\">` elements from the template.\
    \ Make sure that you also remove all their closing `</div>` tags.\n+   10. Remove\
