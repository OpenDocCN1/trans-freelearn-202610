    # The accordion component


    The accordion component is probably best known for FAQ pages or pages that require
    a lot of content that is broken down into manageable parts. An accordion is made
    up of a number of panel groups. Each panel group, in turn, has a heading and body
    elements. To use the accordion component in our project, perform the following
    steps:


    +   1. To allow the panel to collapse when the user clicks on its heading, we
    need to add a `data-toggle` attribute to an anchor `<a>` element inside the `panel`
    heading element and set its value to `collapse`.'
  merge: -1
  img_proc: true
