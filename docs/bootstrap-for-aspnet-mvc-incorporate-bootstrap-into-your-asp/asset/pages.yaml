- pgno: 132
  md: '+   4. Open the **BootstrapBasicFormExtension** project and double-click on
    the `source.extension.vsixmanifest` file.

    +   5. Visual Studio will open the file in a visual editor in which you can set
    a range of properties for the extension. For this example, keep everything as
    is.

    +   6. Open the `CustomCodeGeneratorFactory.cs` file in the **BootstrapBasicForm**
    project.

    +   7. At the top of this class, a new `CodeGeneratorInformation` object called
    `_info` is declared. Change it to the following code:

    +   ```

    +   private static CodeGeneratorInformation _info = new CodeGeneratorInformation(

    +       displayName: "Bootstrap Basic Form",

    +       description: "Basic vertical-styled Bootstrap Form",

    +       author: "Pieter",

    +       version: new Version(1, 0, 0, 0),

    +       id: typeof(CustomCodeGenerator).Name,

    +       icon: ToImageSource(Resources._TemplateIconSample),

    +       gestures: new[] { "View" },

    +       categories: new[] { Categories.MvcView, "Bootstrap" });

    +   ```

    +   8. The `gestures` parameter indicates when the custom scaffold item will be
    shown. If the setting is set to `View`, it will only show our custom template
    when the user adds a new view in Visual Studio.

    +   9. The `categories` parameter is used to set where the template will be shown
    in the **Add Scaffold** dialog. Categories are shown on the left-hand side of
    the **Add Scaffold** dialog. You can add your own categories or use the built-in
    categories.

    +   10. This is all we need to do in the `CustomCodeGeneratorFactory` class. Create
    a new class called `ServiceProviderExtensions.cs` and add the following code to
    it:

    +   ```

    +   internal static class ServiceProviderExtensions

    +   {

    +       public static TService GetService<TService>(this IServiceProvider provider)
    where TService : class

    +       {

    +           if (provider == null)

    +           {

    +               throw new ArgumentNullException("provider");

    +           }

    +           return (TService)provider.GetService(typeof(TService));

    +       }

    +   }

    +   ```'
