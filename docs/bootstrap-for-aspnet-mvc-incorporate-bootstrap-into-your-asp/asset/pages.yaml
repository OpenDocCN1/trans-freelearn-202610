  md: '# Summary


    In this chapter, you were introduced to the TwitterBootstrapMVC library and saw
    how you can reduce the amount of markup of your views using this library. This
    is also the last chapter of this book, and by now, you should be fairly comfortable
    with using Bootstrap in your own ASP.NET MVC projects and even be ready to write
    your own code-generation tools and helpers.


    Make sure you download the sample project that accompanies this book from the
