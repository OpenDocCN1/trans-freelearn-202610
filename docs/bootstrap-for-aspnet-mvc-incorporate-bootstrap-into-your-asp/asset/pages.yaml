- pgno: 76
  md: "# Input groups\n\nInput groups are another way to provide the user with additional\
    \ information about the data you expect them to enter in a specific form element.\
    \ Bootstrap provides classes to add sections either before or after an input element.\
    \ These sections can contain either text or any of the 200 Glyphicons included\
    \ in Bootstrap.\n\n> Bootstrap comes prepackaged with 200 Glyphicon Halfling icons.\
    \ Normally, the Glyphicon Halflings icons that are set are not free, but their\
    \ creator made them available to Bootstrap free of charge. You can read more about\
    \ them at http://getbootstrap.com/components/.\n\nTo create a text input element\
    \ to indicate to the user that we require them to enter a phone number into the\
    \ field, we'll use the following markup:\n\n```\n```html\n<div class=\"form-group\"\
    >\n    @Html.LabelFor(model => model.Phone, new { @class = \"control-label\n \
    \   col-md-2\" })\n    <div class=\"col-sm-4 input-group\">\n        <span class=\"\
    input-group-addon\">\n            <span class=\"glyphicon glyphicon-phone-alt\"\
    ></span>\n        </span>\n        @Html.EditorFor(model => model.Phone)\n   \
    \     @Html.ValidationMessageFor(model => model.Phone)\n    </div>\n</div>\n```\n\
    ```\n\nThe result of this markup will be a text input element with a gray section\
    \ to its left, with an image of a telephone inside it, as illustrated in the following\
    \ screenshot:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_76_0.png)"
  merge: -1
  img_proc: true
- pgno: 77
  md: "We can also create input groups that are aligned on the right-hand side of\
    \ text inputs and that contain text instead of images. For example, the following\
    \ markup creates a text input field that indicates to the user that we only require\
    \ the first part of an e-mail address and that the last part will automatically\
    \ be appended:\n\n```\n<div class=\"form-group\">\n    @Html.LabelFor(model =>\
    \ model.Email, new { @class = \"control-label col-md-2\" })\n    <div class=\"\
    col-sm-4 input-group\">\n        @Html.EditorFor(model => model.Email)\n     \
    \   <span class=\"input-group-addon\">@@northwind.com</span>\n    </div>\n</div>\n\
    ```\n\nThe result of the preceding markup will look like the following screenshot\
    \ in your browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_77_0.png)\n\nYou\
    \ can also create a text input with a gray section on both sides with the following\
    \ code:\n\n```\n<div class=\"form-group\">\n    @Html.LabelFor(model => model.UnitPrice,\
    \ new { @class = \"col-sm-2 control-label\" })\n    <div class=\"col-sm-2 input-group\"\
    >\n        <span class=\"input-group-addon\">$</span>\n        @Html.TextBoxFor(model\
    \ => model.UnitPrice, new { @class = \"form-control\" })\n        <span class=\"\
    input-group-addon\">.00</span>\n        @Html.ValidationMessageFor(model => model.UnitPrice)\n\
    \    </div>\n</div>\n```"
