    # The carousel component


    The carousel component is a user interface element, which you''ll see on a number
    of websites. It is essentially a slideshow that cycles through different elements,
    usually images. The carousel component should be contained inside a <div> element
    with a class name of carousel and a data-ride attribute with a value of carousel.
    To use the carousel component in your project, perform the following steps:


    +   1. The carousel component consists of an ordered list element, <ol>, that
    renders as small circles in the browser and indicates which slide is currently
    active. The markup for this element is as follows:

    +   ```

    +   <ol class="carousel-indicators">

    +       <li data-target="#myCarousel" data-slide-to="0" class="active"></li>

    +       <li data-target="#myCarousel" data-slide-to="1"></li>

    +       <li data-target="#myCarousel" data-slide-to="2"></li>

    +   </ol>

    +   ```

    +   2. Next, another <div> element with a class name of carousel-inner needs to
    be created. This element will contain the actual slides and their content. The
    following markup creates such an element with one slide:

    +   ```

    +   <div class="carousel-inner">

    +       <div class="item active">

    +   ```'
  merge: -1
  img_proc: true
