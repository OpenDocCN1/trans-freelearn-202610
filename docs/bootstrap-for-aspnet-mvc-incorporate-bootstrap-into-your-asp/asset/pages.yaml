    # Mobile First Bootstrap


    ISBN: 978-1-78328-579-2      Paperback: 92 pages


    Develop advanced websites optimized for mobile devices using the Mobile First
    feature of Bootstrap


    +   1. Get to grips with the essentials of mobile-first development with Bootstrap.

    +   2. Understand the entire process of building a mobile-first website with Bootstrap
    from scratch.

    +   3. Packed with screenshots that help guide you through how to build an appealing
    website from a mobile-first perspective with the help of a real-world example.


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_197_1.png)


    # ASP.NET Web API


    # Build RESTful web applications and services on the .NET framework


    ISBN: 978-1-84968-974-8      Paperback: 224 pages


    Master ASP.NET Web API using .NET Framework 4.5 and Visual Studio 2013


    +   1. Clear and concise guide to the ASP.NET Web API with plentiful code examples.

    +   2. Learn about the advanced concepts of the WCF-windows communication foundation.

    +   3. Explore ways to consume Web API services using ASP.NET, ASP.NET MVC, WPF,
    and Silverlight clients.


    Please check www.PacktPub.com for information on our titles'
