- pgno: 157
  md: '# Using the jQuery DataTables

    Plugin with Bootstrap


    The jQuery DataTables plugin allows developers to add innovative interaction controls
    to any HTML table.


    The jQuery DataTables plugin supports a multitude of options and a rich range
    of extensions. ASP.NET MVC developers are also able to include this plugin in
    their own projects. The purpose of this chapter is not only to show you how to
    use the DataTables plugin, but also to illustrate how you can use almost any open
    source JavaScript and CSS plugin or framework with ASP.NET MVC.


    In this chapter, we will cover the following topics:


    +   - An overview of jQuery DataTables

    +   - Including the jQuery DataTables plugin in your ASP.NET MVC project

    +   - Loading and displaying data with jQuery DataTables and ASP.NET MVC

    +   - Using some of the extensions


    # jQuery DataTables


    DataTables is a free, open source plugin for the jQuery JavaScript library that
    is designed and created by a company called SpryMedia Ltd. This plugin makes adding
    features such as ordering, filtering, pagination, and searching to any standard
    HTML table incredibly easy to implement.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'It also offers various extensions that enable Excel-like features, inline editing,
    and fixed columns to name a few. The DataTables website offers well-documented
    examples, a blog, and a forum, which you can find at www.datatables.net.


    The jQuery DataTables plugin can be added to your ASP.NET MVC project in one of
    the two ways, the DataTables NuGet package or **Content Delivery Network (CDN)**.


    # Adding DataTables to your ASP.NET MVC project


    To add the basic functionality for the DataTables plugin, the following two files
    are required:


    +   - The first is `jquery.dataTables.css` and it contains the default CSS styling
    for the tables

    +   - The second is `jquery.dataTables.js` and it contains the JavaScript logic
    for rendering the DataTables plugin and adding the necessary functionality


    Both these files are available at the DataTables CDN at the following links:


    +   - //cdn.datatables.net/1.10.0/css/jquery.dataTables.css

    +   - //cdn.datatables.net/1.10.0/js/jquery.dataTables.js


    # Using the DataTables NuGet package


    You can also add all the required CSS and JavaScript files needed for jQuery DataTables
    as well as all the CSS and JavaScript files for the extensions using NuGet. Complete
    the following steps to add jQuery DataTables when using NuGet:


    +   1. In Visual Studio, open the **Package Manager Console** window by navigating
    to **Tools | Library Package Manager | Package Manager Console**.

    +   2. Inside the **Package Manager Console** window, type the following command:
    `Install-Package jquery.datatables`

    +   3. The NuGet package will add a `DataTables-1.10.0` folder inside the `Content`
    folder, which contains the `css`, `images`, and `swf` files required for the DataTables
    plugin.

    +   4. It will also add a `DataTables-1.10.0` folder to the `Scripts` folder in
    your project. This folder will contain JavaScript files for the DataTables plugin
    as well as JavaScript files for all the extensions.'
  merge: -1
  img_proc: true
- pgno: 159
  md: "# # Using the CDN\n\nYou can either save the files from the aforementioned\
    \ locations or add them to your project or rather add a reference to the files\
    \ hosted on the CDN, which is the preferred approach. This will help in increasing\
    \ your site's performance.\\nTo reference it from the CDN, complete the following\
    \ steps:\n\n+   1. In Visual Studio, open this book's accompanying sample project\
    \ and open the `_Layout.cshtml` file located inside the `Views\\\\Shared` folder.\\\
    n\\n2. Inside the `<head>` element of the `_Layout.cshtml` file, add a reference\
    \ to the jQuery DataTables style sheet by inserting the following line of markup:\\\
    n\\n   ```html\\n   <link rel=\"stylesheet\" type=\"text/css\" href=\"//cdn.datatables.net/1.10.0/css/jquery.dataTables.css\"\
    >\\n   ```\\n\\n3. Open the view in which you'll need the DataTables functionality\
    \ and add a reference to the JavaScript library by adding the following code to\
    \ the bottom of the view:\n\n```\n```cshtml\n@section scripts{\n    <script type=\"\
    text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/1.10.0/js/jquery.dataTables.min.js\"\
    ></script>\n}\n```\n```\n\n# # Adding Bootstrap styling to DataTables\n\nThe steps\
    \ mentioned in the preceding section will add the minimum required files to the\
    \ view and layout file in order to generate the basic styling and functionality\
    \ for jQuery DataTables. However, the default DataTables CSS styles can look somewhat\
    \ out of place inside a Bootstrap website.\n\nLuckily, the team behind the DataTables\
    \ project created a Bootstrap-specific CSS style and JavaScript library to match\
    \ the look and feel of your site. Both these files are also available on the DataTables\
    \ CDN:\n\n+   - `//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.css`\\\
    n- `//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.js`"
  merge: -1
  img_proc: true
- pgno: 160
  md: "These two files are added in the same way as the normal DataTables CSS and\
    \ JavaScript files. Bear in mind that when including the Bootstrap-specific DataTables\
    \ JavaScript file in your view, you need to include a reference to both the default\
    \ DataTables JavaScript files as well as the Bootstrap-specific file, as illustrated\
    \ in the following markup:\n\n```\n<script type=\"text/javascript\" language=\"\
    javascript\" src=\"//cdn.datatables.net/1.10.0/js/jquery.dataTables.min.js\"></script>\n\
    <script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.js\"\
    ></script>\n```\n\n# Loading and displaying data in jQuery DataTables\n\nIn order\
    \ to implement the jQuery DataTables plugin, we first need to create a new view\
    \ that will list data inside an HTML table. For this example, we'll create a view\
    \ that lists customers from the Northwind Traders database. For this, complete\
    \ the following steps:\n\n+   1. In Visual Studio, add a new controller class\
    \ called CustomersController.cs.\n\n+   2. We've implemented a dependency injection\
    \ in our project, so we'll add a constructor to the class that will automatically\
    \ set the reference to the database context with the following code:\n\n```\n\
    public CustomersController(ApplicationDbContext context)\n{\n    _context = context;\n\
    }\n```\n\n+   3. The _context object is a local field declared inside the class\
    \ as follows:\n\n```\nprivate readonly ApplicationDbContext _context;\n```\n\n\
    +   4. Add a new method called Index to the controller. This method returns an\
    \ ActionResult object to the controller. Add the following code to it that will\
    \ pass a list of customer objects to the view:\n\n```\npublic ActionResult Index()\n\
    {\n    var model = _context.Customers;\n    return View(model);\n}\n```"
  merge: -1
  img_proc: true
