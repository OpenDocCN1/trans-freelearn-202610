- pgno: 48
  md: 'In the preceding markup, note that the <table> element''s class name is set
    to table. When you run the project and open this view, your table should be styled
    using the Bootstrap table styles as illustrated in the following screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_48_0.png)


    # Styling Bootstrap tables


    Bootstrap provides additional classes with which you can style your tables even
    more. To create a bordered table, add table-bordered to its class name as follows:


    ```

    <table class="table table-bordered">

    ```


    To create a table where each odd row is highlighted with another color than the
    base color, change the table''s class name to table table-striped as follows:


    ```

    <table class="table table-striped">

    ```


    Lastly, Bootstrap also gives you the option to enable the hover state on a table.
    This means the row that the user hovers their cursor over will be highlighted.
    To accomplish this, change the table class to table table-hover as follows:


    ```

    <table class="table table-hover">

    ```'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'All the different class names can be combined to create a zebra-striped, bordered
    table with hovering, as illustrated in the following markup:


    ```

    <table class="table table-striped table-bordered table-hover">

    ```


    The result will look similar to the following screenshot in your browser:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_49_0.png)


    # Bootstrap contextual table classes


    Bootstrap provides additional classes with which you can style either your table''s
    rows or cells. Adding one of the following classes to either the <td> or <tr>
    element of your HTML table will highlight it in either gray, green, blue, orange,
    or red, which respectively represents the following:


    +   - Active

    +   - Success

    +   - Info

    +   - Warning

    +   - Danger'
  merge: -1
  img_proc: true
- pgno: 50
  md: "# Using Bootstrap CSS and HTML Elements\n\nOf course, we can also apply these\
    \ styles dynamically in our ASP.NET MVC views. In our ProductViewModel view model,\
    \ we have a Status property, which can be one of the five contextual Bootstrap\
    \ classes. By setting the `<tr>` element's class to this property, we can dynamically\
    \ change the color of the rows in the table, based on their data as illustrated\
    \ in the following markup:\n\n```\n```cshtml\n<tbody>\n    @foreach (var item\
    \ in Model)\n    {\n        <tr class=\"@item.Status\">\n            <td>\n  \
    \              @Html.DisplayFor(modelItem => item.ProductName)\n            </td>\n\
    \            <td>\n                @Html.DisplayFor(modelItem => item.UnitPrice)\n\
    \            </td>\n            <td>\n                @Html.DisplayFor(modelItem\
    \ => item.UnitsInStock)\n            </td>\n            <td>\n               \
    \ @Html.DisplayFor(modelItem => item.Discontinued)\n            </td>\n      \
    \      <td>\n                @Html.ActionLink(\"Edit\", \"Edit\", new { /* id=item.PrimaryKey\
    \ */ })\n                @Html.ActionLink(\"Details\", \"Details\", new { /* id=item.PrimaryKey\
    \ */ })\n                @Html.ActionLink(\"Delete\", \"Delete\", new { /* id=item.PrimaryKey\
    \ */ })\n            </td>\n        </tr>\n    }\n</tbody>\n```\n```\n\nIn the\
    \ preceding code, you will notice how the table row's class was set to `@item.status`.\
    \ This will cause the rows to be highlighted based on the mapping we've specified\
    \ for the Status property, as illustrated in the following screenshot:"
