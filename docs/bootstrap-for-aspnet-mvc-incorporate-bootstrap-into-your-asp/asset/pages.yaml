  md: '# Creating a home controller with a Bootstrap-themed view


    At the moment, the site we''ve created will return an error message that states
    that the requested resource cannot be found, when we run the project. We first
    need to add a new home controller and associate a view with its default action
    in order to avoid any errors. To add a new controller, perform the following steps:


    +   1. Right-click on the `Controller` folder in the **Solution Explorer** section
    and navigate to **Add | Controller**....

    +   2. In the **Add Scaffold** dialog, select the **MVC 5 Controller - Empty**
    item, as shown in the following screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_31_0.png)


    +   3. When prompted, in the **Add Controller** dialog, enter `HomeController`
    as the new controller name and click on **Add**.

    +   4. After the controller has been added, right-click inside the empty **Index**
    method and select **Add View**. The method is considered empty if it has only
    the one `return View()` statement in it.'
  merge: -1
