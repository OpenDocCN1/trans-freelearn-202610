  md: "```\nprivate readonly ICurrentUser _currentUser;\n\npublic SuppliersController(ApplicationDbContext\
    \ context, ICurrentUser currentUser)\n{\n    _context = context;\n    _currentUser\
    \ = currentUser;\n}\n\n//\n// GET: /Suppliers/\npublic ActionResult Index()\n\
    {\n    return View();\n}\n}\n```\n\n# Customizing the generated code for views\n\
    \nAs with controllers, the scaffolding for views can also be customized. In our\
    \ example project used throughout this book, our views followed a consistent look.\
    \ Each page has a page header followed by a breadcrumb component to indicate to\
    \ the user which page is currently being viewed.\n\nWe always want to follow this\
    \ design when adding a new page to our site, and one method of enforcing this\
    \ is to either override the default scaffolder for views or add our own. We'll\
    \ create a T4 template that will generate a standard, vertical Bootstrap form\
    \ that already contains a page header and a breadcrumb component. To accomplish\
    \ this, perform the following steps:\n\n+   1. Open the `MvcView` folder inside\
    \ the `CodeTemplates` folder.\n+   2. Right-click on the `Create.cs.t4` file and\
    \ select Copy.\n+   3. Right-click on the `MvcView` folder and select Paste.\n\
    +   4. The file will be copied as `Create.cs - Copy.t4`; rename it to `VerticalForm-Bootstrap.cs.t4`.\n\
    +   5. Double-click on `VerticalForm-Bootstrap.cs.t4` to open it.\n+   6. Add\
    \ the following HTML markup before the `@using (Html.BeginForm())` line:\n+  \
    \ ```\n+   <div class=\"container\">\n+       <div class=\"page-header\">\n+ \
    \          <h1><#= ViewDataTypeShortName #> </h1>\n+       </div>\n+   ```"
  merge: -1
