- pgno: 65
  md: '# # Using Bootstrap Components


    Bootstrap provides over a dozen components to offer input groups, dropdowns, navigation,
    alerts, as well as iconography. Using these components in your web application,
    you can provide a consistent and easy-to-use interface for your users.


    Bootstrap components are essentially made up by combining various existing Bootstrap
    elements, adding a number of unique class names, and representing a number of
    the common metaphors used on many websites.


    In this chapter, we will cover the following topics:


    +   - Using the Bootstrap navigation bar

    +   - Implementing a context-sensitive search bar

    +   - Using list groups, badges, and the media object

    +   - Implementing page headers and breadcrumbs

    +   - Creating a paged list using the PagedList library

    +   - How to use alerts, input groups, and button dropdowns

    +   - Implementing a progress bar that reports real-time progress with SignalR


    # ## The Bootstrap navigation bar


    The Bootstrap navigation bar is one of the components that is used on a majority
    of sites using the Bootstrap framework. When creating an ASP.NET MVC website in
    Visual Studio, the default template generates all the HTML markup necessary for
    a standard navigation bar. The Bootstrap navigation bar looks like the following
    screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_65_0.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: "# Using Bootstrap Components\n\nThe following code inside the `_Layout.cshtml`\
    \ file creates a fixed-top navigation bar, which is also responsive. When the\
    \ site is opened on a device with a smaller screen size, it will display a button\
    \ with three bars, and when you click on it, it will show the menu vertically:\n\
    \n```\n```cshtml\n<div class=\"navbar navbar-inverse navbar-fixed-top\">\n   \
    \ <div class=\"container\">\n        <div class=\"navbar-header\">\n         \
    \   <button type=\"button\" class=\"navbar-toggle\" data-toggle=\"collapse\" data-target=\"\
    .navbar-collapse\">\n                <span class=\"icon-bar\"></span>\n      \
    \          <span class=\"icon-bar\"></span>\n                <span class=\"icon-bar\"\
    ></span>\n            </button>\n            @Html.ActionLink(\"Northwind Traders\"\
    , \"Index\", \"Home\", null, new { @class = \"navbar-brand\" })\n        </div>\n\
    \        <div class=\"navbar-collapse collapse\">\n            @Html.Partial(\"\
    _BackendMenuPartial\")\n            @Html.Partial(\"_LoginPartial\")\n       \
    \ </div>\n    </div>\n</div>\n```\n```\n\nNote that we are using two partial views\
    \ to generate the rest of the navigation bar based on whether the current user\
    \ is logged in or not. We'll add a global search functionality to the navigation\
    \ bar when the user is logged in; this will return results based on the page the\
    \ user is currently visiting.\n\nFirst, add the following code to the `_BackendMenuPartial`\
    \ view; this will generate a search box inside the navigation bar:\n\n```\n```cshtml\n\
    @using (Html.BeginForm(\"Index\", \"Search\", FormMethod.Post, new {@class = \"\
    navbar-form navbar-left\", role = \"search\"}))\n{\n    <div class=\"form-group\"\
    >\n        @Html.TextBox(\"searchquery\", \"\", new { @id=\"searchquery\", @class=\"\
    form-control input-sm\", placeholder=\"Search\" })\n        @Html.Hidden(\"fromcontroller\"\
    , @ViewContext.RouteData.Values[\"controller\"], new { @id = \"fromcontroller\"\
    \ })\n    </div>\n    <button type=\"submit\" class=\"btn btn-default btn-xs\"\
    >GO</button>\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 67
  md: "You'll notice that in the preceding code, we have a hidden field called `fromcontroller`\
    \ that contains the name of the current controller. We get this from the `RouteData`\
    \ object, which is a property on `ViewContext`. This information will be used\
    \ to return search results based on the current page.\n\nThe form will perform\
    \ an HTTP `POST` method to the `Index` action of the `Search` controller; this\
    \ in turn will check the controller name from which the request came and return\
    \ the appropriate data and view. The code that performs the search is as follows:\n\
    \n```\n[HttpPost]\npublic ActionResult Index(string searchquery, string fromcontroller)\n\
    {\n    switch (fromcontroller)\n    {\n        case \"Products\":\n          \
    \  return RedirectToAction(\"SearchProductsResult\", new {\n            query\
    \ = searchquery });\n\n        case \"Customers\":\n            return RedirectToAction(\"\
    SearchCustomersResult\", new {\n            query = searchquery });\n\n      \
    \  case \"Employees\":\n            return RedirectToAction(\"SearchEmployeesResult\"\
    , new {\n            query = searchquery });\n    }\n    return View();\n}\n\n\
    public ActionResult SearchCustomersResult(string query)\n{\n    ViewBag.SearchQuery\
    \ = query;\n    var results = _context.Customers.Where(p => p.CompanyName.Contains(query)\n\
    \        || p.ContactName.Contains(query)\n        || p.City.Contains(query)\n\
    \        || p.Country.Contains(query)).ToList();\n    return View(results);\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 68
  md: "# List groups\n\nList groups are flexible components that either display simple\
    \ lists of elements or can be combined with other elements to create complex lists\
    \ with custom content. Our search will redirect us to the SearchProductsResult\
    \ view when the user searches for products. This view uses a list group to display\
    \ the product items found. The method that retrieves the products from the database\
    \ is as follows:\n\n```\npublic ActionResult SearchProductsResult(string query)\n\
    {\n    ViewBag.SearchQuery = query;\n    var results = _context.Products.Where(p\
    \ => p.ProductName.Contains(query)).ToList();\n    return View(results);\n}\n\
    ```\n\nThe Razor markup for the view represents the following:\n\n```\n@model\
    \ IEnumerable<Northwind.Data.Models.Product>\n@{\n    ViewBag.Title = \"Product\
    \ Search Results\";\n    Layout = \"~/Views/Shared/_Layout.cshtml\";\n}\n<div\
    \ class=\"container\">\n    <div class=\"page-header\">\n        <h1>Product Results\
    \ <small>Results for your search term: \"@ViewBag.SearchQuery\"</small></h1>\n\
    \    </div>\n    <ul class=\"list-group\">\n        @foreach (var item in Model)\n\
    \        {\n            <a href=\"@Url.Action(\"Edit\",\"Products\", new { id=@item.ProductID})\"\
    \ class=\"list-group-item\">@item.ProductName <span class=\"badge\">@item.UnitsInStock</span></a>\n\
    \        }\n    </ul>\n</div>\n```\n\nIn this markup, the product items are loaded\
    \ into an unordered list element <ul> as anchor <a> elements. Each anchor element's\
    \ class name should be set to list-group-item. The view should look like the following\
    \ screenshot in your browser:"
  merge: -1
  img_proc: true
- pgno: 69
  md: "![](img/371b9a67300a03b7b335eb8a6fe55d94_69_0.png)\n\n# Badges\n\nBadges are\
    \ used to highlight items. You would normally see badges to indicate the number\
    \ of new or unread items, depending on the type of application. We used the following\
    \ badges on the product's search result page to indicate the number of units currently\
    \ in stock:\n\n```\n<a href=\"@Url.Action(\"Edit\",\"Products\", new { id=@item.ProductID\
    \ })\" class=\"list-group-item\">@item.ProductName <span class=\"badge\">@item.UnitsInStock</span></a>\n\
    ```\n\nAdding a badge to an element is as simple as adding a <span> element and\
    \ setting its class name to badge.\n\n# The media object\n\nThe media object component\
    \ can be used to build hierarchal style lists such as blog comments or tweets.\
    \ In our example application, we used the media object to return a search result\
    \ view when the user searches for employees. As the Northwind database contains\
    \ a field (ReportsTo) that indicates which employee the other employees report\
    \ to, the media object component would be ideal to indicate this visually. The\
    \ method that searches for the employees and returns the results to the view is\
    \ as follows:\n\n```\npublic ActionResult SearchEmployeesResult(string query)\n\
    {\n    ViewBag.SearchQuery = query;\n    var results = _context.Employees.Where(p\
    \ => p.FirstName.Contains(query)\n        || p.LastName.Contains(query)\n    \
    \    || p.Notes.Contains(query)).ToList();\n    return View(results);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 70
  md: "The view for the employee's search result uses the media object component to\
    \ style the employee information and display the employee's photos as follows:\n\
    \n```\n@model IEnumerable<Northwind.Data.Models.Employee>\n@{\n    ViewBag.Title\
    \ = \"Employees Search Results\";\n    Layout = \"~/Views/Shared/_Layout.cshtml\"\
    ;\n}\n<div class=\"container\">\n    <div class=\"page-header\">\n        <h1>Employees\
    \ Results <small>Results for your search term: @ViewBag.SearchQuery</small></h1>\n\
    \    </div>\n    @foreach (var item in Model)\n    {\n        <div class=\"media\"\
    >\n            <a class=\"pull-left\" href=\"@Url.Action(\"Edit\", \"Employees\"\
    , new { id = @item.EmployeeID })\">\n                <img class=\"media-object\"\
    \ src=\"@Url.Content(\"~/Images/employees/\" + @item.EmployeeID + \".png\")\"\
    \ alt=\"@item.FirstName\" width=\"64\" height=\"64\">\n            </a>\n    \
    \        <div class=\"media-body\">\n                <h4 class=\"media-heading\"\
    >@item.FirstName @item.LastName</h4>\n                @item.Notes\n          \
    \      @foreach (var emp in @item.ReportingEmployees)\n                {\n   \
    \                 <div class=\"media\">\n                        <a href=\"#\"\
    \ class=\"pull-left\">\n                            <img alt=\"@emp.FirstName\"\
    \ src=\"@Url.Content(\"~/Images/employees/\" + @emp.EmployeeID + \".png\")\" class=\"\
    media-object\" width=\"64\" height=\"64\">\n                        </a>\n   \
    \                     <div class=\"media-body\">\n                           \
    \ <h4 class=\"media-heading\">@emp.FirstName @emp.LastName</h4>\n            \
    \                @emp.Title\n                        </div>\n                \
    \    </div>\n                }\n            </div>\n        </div>\n    }\n</div>\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 71
  md: "The media object component is built using a combination of elements with the\
    \ class names of `media`, `media-heading` and `media-body`. The `media-object`\
    \ class name is used to indicate media objects such as images, video, or audio.\
    \ The resulting view should look similar to the following screenshot:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_71_0.png)\n\
    \n# Page headers\n\nThe Bootstrap page header is used to provide a clear indication\
    \ to the user that the page consists of a heading that introduces them to the\
    \ page they are visiting. The page header is essentially a `<h1>` element wrapped\
    \ inside a `<div>` element with a class name of page-header. You can also utilize\
    \ the `<small>` element to provide additional information to the user about the\
    \ page. Bootstrap also adds a horizontal line below the page header that provides\
    \ a visual separation from the rest of the page.\n\nThe following HTML markup\
    \ creates a page header:\n\n```\n```html\n<div class=\"page-header\">\n    <h1>Categories\
    \ <small>Add, edit and delete product categories</small></h1>\n</div>\n```\n```"
  merge: -1
