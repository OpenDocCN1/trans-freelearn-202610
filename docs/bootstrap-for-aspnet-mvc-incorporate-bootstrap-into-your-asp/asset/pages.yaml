- pgno: 25
  md: "# The Content folder\n\nThe Content folder contains both the bootstrap.css\
    \ and bootstrap.min.css files as well as a style sheet called Site.css. This file\
    \ is used to apply any additional styling on top of the default styles provided\
    \ by Bootstrap, and it is also used to specify the styles to use for the jQuery\
    \ validation plugin required by ASP.NET MVC for form validation. For example,\
    \ the following CSS highlights any input element with a reddish color and draws\
    \ a border around the element if the validation for that field failed:\n\n```\n\
    .field-validation-error {\n    color: #b94a48;\n}\n\n.field-validation-valid {\n\
    \    display: none;\n}\n\ninput.input-validation-error {\n    border: 1px solid\
    \ #b94a48;\n}\n\ninput[type=\"checkbox\"].input-validation-error {\n    border:\
    \ 0 none;\n}\n\n.validation-summary-errors {\n    color: #b94a48;\n}\n\n.validation-summary-valid\
    \ {\n    display: none;\n}\n```\n\n# The fonts folder\n\nThe fonts folder contains\
    \ the Glyphicons font in all the necessary formats."
  merge: -1
  img_proc: true
- pgno: 26
  md: '# The Scripts folder


    The Scripts folder contains a number of scripts. Most notably for this book, it
    contains the bootstrap.js and bootstrap.min.js JavaScript files. The default ASP.NET
    MVC project template also adds both minified and normal files for the following
    JavaScript libraries and plugins:


    +   - jQuery

    +   - jQuery validation plugin

    +   - jQuery and jQuery validation support library for unobtrusive validation

    +   - Modernizr

    +   - Respond JS


    Visual Studio enables intelliSense for jQuery, Bootstrap, and Modernizr as well
    as responds by adding the _reference.js file to the Scripts folder. This is a
    very useful feature when working with JavaScript and well worth using when working
    with the Bootstrap components.


    Most of these libraries and files are beyond the scope of this book, but we will
    touch on some of them as we progress.


    # Creating an empty ASP.NET MVC site and adding Bootstrap manually


    The default project layout is a good start for any ASP.NET MVC project, but for
    the sample project we''ll be building throughout this book, we''ll create an empty
    ASP.NET MVC site and add the necessary files manually. This is done by performing
    the following steps:


    +   1. Start by creating a new ASP.NET web application project in Visual Studio
    and name the project Northwind.Web.

    +   2. This time, select the Empty template in the New ASP.NET Project dialog
    and make sure the MVC checkbox is selected, as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/371b9a67300a03b7b335eb8a6fe55d94_27_0.png)


    3. An empty project layout will be created for you and you''ll notice that we
    do not have the Content, Fonts, or Scripts folder—we''ll add them ourselves!


    # Adding the Bootstrap style sheets


    To add the Bootstrap style sheet files to your project, complete the following
    steps:


    +   1. Create a new folder by right-clicking on the new project''s name inside
    Visual Studio''s Solution Explorer and navigating to Add | New Folder, name the
    new folder css.

    +   2. Next, right-click on the newly created css folder and navigate to Add |
    Existing Item... from the context menu.

    +   3. Browse to the folder in which you''ve extracted the Bootstrap distribution
    files and select the bootstrap.css file that you can locate in the css folder.'
  merge: -1
