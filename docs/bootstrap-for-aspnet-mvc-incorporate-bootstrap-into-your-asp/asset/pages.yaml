- pgno: 72
  md: "*Using Bootstrap Components*\n\nThis markup will generate the following screenshot\
    \ in your browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_72_0.png)\n\n#\
    \ # Breadcrumb\n\nBreadcrumb is a common metaphor used in web design to indicate\
    \ to the user what their current location is inside a navigation tree. It is similar\
    \ to a file path in Windows Explorer. Breadcrumb is ideal for a site with many\
    \ subnavigation levels and allows the user to navigate between the varied parent\
    \ and child pages.\n\nIn the following markup, we'll use a combination of Razor\
    \ and HTML to build a breadcrumb component with which the user can navigate back\
    \ to the home page or the Manage page:\n\n```\n```html\n<ol class=\"breadcrumb\"\
    >\n    <li>@Html.ActionLink(\"Home\", \"Index\", \"Home\")</li>\n    <li>@Html.ActionLink(\"\
    Manage\", \"Index\", \"Manage\")</li>\n    <li class=\"active\">Categories</li>\n\
    </ol>\n```\n```\n\nThe preceding markup contains an ordered list <ol> element\
    \ with a class name of breadcrumb. Each child element of the breadcrumb is added\
    \ as a list item <li> element. To indicate to the user that the last level of\
    \ the breadcrumb is the active page, we set its <li> element's class name to active.\
    \ The result of the previous code will look like the following screenshot when\
    \ visiting the page:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_72_1.png)\n\n\
    # # Pagination\n\nPagination is used to divide content, usually lists, into separate\
    \ pages. For example, when scaffolding a list view, the default scaffolding template\
    \ generates a table that contains a row for each item in the collection you pass\
    \ into the view. This is fine for small amounts of data, but if the list contains\
    \ hundreds of items, your page will take a very long time to load. Ideally, we\
    \ would like to split our list view into a manageable view that has five items\
    \ per page. In the following screenshot, we've changed the **Products** page's\
    \ table to use pagination:"
  merge: -1
  img_proc: true
- pgno: 73
  md: "![](img/371b9a67300a03b7b335eb8a6fe55d94_73_0.png)\n\nThe aforementioned view\
    \ is accomplished using the PagedList.Mvc NuGet package and completing the following\
    \ steps:\n\n+   1. To install it, run the following command inside the Visual\
    \ Studio **Package Manager Console**:\n+   \n+      `Install-Package PagedList.Mvc`\n\
    \n+   2. This command will add the necessary dependencies to your project. Next,\
    \ open your controller action and change its code to the following:\n\n```\npublic\
    \ ActionResult Index(int? page)\n{\n    var models = _context.Products.Project()\n\
    \        .To<ProductViewModel>().OrderBy(p => p.ProductName);\n    int pageSize\
    \ = 5;\n    int pageNumber = (page ?? 1);\n    return View(models.ToPagedList(pageNumber,\
    \ pageSize));\n}\n```\n\nIn the preceding code, we changed the action method to\
    \ accept an integer parameter called page. This parameter is used to indicate\
    \ which page of the list the user is currently viewing. We then retrieved a list\
    \ of products from our database and ordered it using the ProductName property."
  merge: -1
  img_proc: true
- pgno: 74
  md: 'The pageSize variable is used to set the number of items each page should display.
    We then returned the product items as PagedList. The PagedList object is part
    of the PagedList.Mvc library that we installed via NuGet earlier.


    3. Next, open the associated view and add the following code to the top of the
    file:


    ```

    @using PagedList.Mvc;

    @model PagedList.IPagedList<Northwind.Web.Models.ProductViewModel>

    ```


    4. The using statement tells the view to reference the PagedList library. We then
    set the view''s model to a PagedList representation of our ProductViewModel object.


    5. You do not need to change anything in your existing markup; however, to indicate
    the current page number, add the following code to your page:


    ```

    Page @(Model.PageCount < Model.PageNumber ? 0 : Model.PageNumber)

    of @Model.PageCount

    ```


    6. The preceding code will display the current page number and the total number
    of pages. To add a paging element to the page that conforms to the default Bootstrap
    styling, add the following code just below the closing tag of the <table> element:


    ```

    @Html.PagedListPager(Model, page => Url.Action("Index", new { page }), PagedListRenderOptions.ClassicPlusFirstAndLast)

    ```


    In the preceding code, we used the PagedListPager HTML helper that is included
    in the PagedList library to display a pagination element; this element contains
    all the page numbers as well as the buttons that will navigate to the first and
    last page. You''ll notice that the last parameter of the PagedListPager helper
    supports nine different pagination layouts. They are as follows:


    +   - Classic

    +   - ClassicPlusFirstAndLast

    +   - Minimal

    +   - MinimalWithItemCountText

    +   - MinimalWithPageCountText

    +   - OnlyShowFivePagesAtATime

    +   - PageNumbersOnly

    +   - TwitterBootstrapPager

    +   - TwitterBootstrapPagerAligned'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Setting the parameter to `PagedListRenderOptions`.

    `TwitterBootstrapPagerAligned` will show two buttons, titled **Older** and **Newer**.
    They are aligned to the edges of the container, as shown in the following screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_75_0.png)


    Setting the parameter to `PagedListRenderOptions`.

    `TwitterBootstrapPager` will add the **Previous** and **Next** buttons that are
    centered below <table>:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_75_1.png)


    The `PagedList` library supports the default Bootstrap styles out of the box;
    this means that you do not need to do anything specific to enable the correct
    styling.'
