  md: "```\n$('#TerritoryId').val(territory);\n$('#territorybutton').text(territoryName);\n\
    });\n</script>\n}\n```\n\nThe preceding JavaScript creates a click handler for\
    \ the region drop-down element and saves the selected region ID to a variable.\
    \ This variable is then passed to the jQuery get method, which in turn makes a\
    \ request to the Territories method in CustomerController. The Territories method\
    \ returns a partial view with a list of territories whose region IDs match the\
    \ received parameter.\n\nThe code also uses the jQuery on method to attach an\
    \ event handler to all anchor child elements of the element whose ID is territories.\
    \ The event handler then saves the selected territory ID to the hidden field inside\
    \ the form we created earlier.\n\n# Modal dialogs\n\nModals are used to provide\
    \ a pop-up dialog style element that can be used to provide information to the\
    \ user or even allow the user to complete a form inside the modal. A Bootstrap\
    \ modal is essentially made of three parts: a header, body, and footer. You can\
    \ put any standard HTML markup inside the modal's body element, including standard\
    \ text or even an embedded YouTube video.\n\nAs a general rule, always place the\
    \ modal's markup in a top-level position inside your view — the top or bottom\
    \ of the view is the best place to put your modal markup.\n\nUsing the following\
    \ HTML and Razor markup, we'll create a modal that prompts the user whether they\
    \ would like to continue deleting a certain customer record from the database.\
    \ We'll declare a <form> element inside the modal's body and use a button that\
    \ is created inside the modal's footer element to submit the form. We'll also\
    \ create a button that the user can click on to dismiss the modal. This is accomplished\
    \ by adding the data-dismiss=\"modal\" attribute to the button as follows:\n\n\
    ```\n<div class=\"modal fade\" id=\"deleteConfirmationModal\" tabindex=\"-1\"\
    \ role=\"dialog\" aria-hidden=\"true\">\n    <div class=\"modal-dialog\">\n  \
    \      <div class=\"modal-content\">\n            <div class=\"modal-header\"\
    >\n                <button type=\"button\" class=\"close\" data-dismiss=\"modal\"\
    \ aria-hidden=\"true\">&times;</button>\n                <h4 class=\"modal-title\"\
    >Deletion confirmation</h4>\n```"
