- pgno: 168
  md: "# The TableTools extension\n\nThe TableTools extension for jQuery DataTables\
    \ adds a toolbar at the top of the table with which the user can copy to clipboard,\
    \ export to CSV, and print to PDF the data inside the DataTable. It is a really\
    \ simple way to give your users the functionality to export their data.\n\nTo\
    \ use the TableTools extension, perform the following steps:\n\n+   1. Create\
    \ a new folder in the root of your project called `swf`.\n+   \n+   2. Add the\
    \ `copy_csv_xls_pdf.swf` file to the `swf` folder. The `.swf` file is included\
    \ in the DataTables plugin download.\n+   \n+   3. Open the `_Layout.cshtml` file\
    \ and add a reference to the `dataTables.tableTools.css` file:\n+   \n+   ```html\n\
    +   <link rel=\"stylesheet\" type=\"text/css\" href=\"//cdn.datatables.net/tabletools/2.2.1/css/dataTables.tableTools.css\"\
    >\n+   ```\n\n+   4. Open the view `.cshtml` file and add a reference to the DataTables,\
    \ DataTables Bootstrap, and TableTools extension JavaScript files:\n\n```\n```html\n\
    <script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/1.10.0/js/jquery.dataTables.min.js\"\
    ></script>\n<script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/tabletools/2.2.1/js/dataTables.tableTools.min.js\"\
    ></script>\n<script type=\"text/javascript\" language=\"javascript\" src=\"//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.js\"\
    ></script>\n```\n```\n\n+   5. Lastly, using jQuery, add an event handler to initialize\
    \ the DataTables plugin and the TableTools extension after the page has loaded:\n\
    \n```\n```javascript\n<script type=\"text/javascript\">\n    $(document).ready(function\
    \ () {\n        var table = $('.table').dataTable();\n        var tt = new $.fn.dataTable.TableTools(table);\n\
    \        $(tt.fnContainer()).insertBefore('div.dataTables_wrapper');\n    });\n\
    </script>\n```\n```"
  merge: -1
  img_proc: true
