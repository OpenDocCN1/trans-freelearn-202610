- pgno: 41
  md: '# Using Bootstrap CSS and

    HTML Elements


    Bootstrap provides a wide range of HTML elements and CSS settings as well as an
    advanced grid system to aid in laying out your web page designs. These settings
    and elements include utilities to assist with typography, code formatting, table,
    and form layouts to name a few.


    All CSS settings and HTML elements combined with the mobile-first, a fluid grid
    system, enables developers to build intuitive web interfaces quickly and easily
    without having to worry about the nuts and bolts of enabling responsiveness for
    smaller device screens and styling user interface elements.


    In this chapter, we will cover the following topics:


    +   - The Bootstrap grid system

    +   - Bootstrap tables and buttons

    +   - Laying out different Bootstrap forms

    +   - Using Bootstrap''s validation styles for form validation

    +   - Using editor templates to control the HTML output for form elements

    +   - Using images in Bootstrap and configuring the images to be responsive'
  merge: -1
  img_proc: true
- pgno: 42
  md: "# The Bootstrap grid system\n\nMany websites are reporting an increasing amount\
    \ of mobile traffic and this trend is expected to increase over the coming years.\
    \ The Bootstrap grid system is mobile-first, which means it is designed to target\
    \ devices with smaller displays and then grow as the display size increases.\n\
    \nFortunately, this is not something you need to be too concerned about as Bootstrap\
    \ takes care of most of the heavy lifting.\n\n# Bootstrap grid options\n\nBootstrap\
    \ 3 introduced a number of predefined grid classes in order to specify the sizes\
    \ of columns in your design. These class names are listed in the following table:\n\
    \n| Class name | Type of device | Resolution | Container width | Column width\
    \ |\n|---|---|---|---|---|\n| col-xs-* | Phones | Less than 768 px | Auto | Auto\
    \ |\n| col-sm-* | Tablets | Larger than 768 px | 750 px | 60 px |\n| col-md-*\
    \ | Desktops | Larger than 992 px | 970 px | 1170 px |\n| col-lg-* | High-resolution\
    \ desktops | Larger than 1200 px | 78 px | 95 px |\n\nThe Bootstrap grid is divided\
    \ into 12 columns. When laying out your web page, keep in mind that all columns\
    \ combined should be a total of 12. To illustrate this, consider the following\
    \ HTML code:\n\n```\n<div class=\"container\">\n    <div class=\"row\">\n    \
    \    <div class=\"col-md-3\" style=\"background-color:green;\">\n            <h3>green</h3>\n\
    \        </div>\n        <div class=\"col-md-6\" style=\"background-color:red;\"\
    >\n            <h3>red</h3>\n        </div>\n        <div class=\"col-md-3\" style=\"\
    background-color:blue;\">\n            <h3>blue</h3>\n        </div>\n    </div>\n\
    </div>\n```"
  merge: -1
  img_proc: true
- pgno: 43
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 44
  md: "# Bootstrap tables\n\nBootstrap provides a default styling for HTML tables\
    \ with a few options to customize their layout and behaviors. The default ASP.NET\
    \ MVC scaffolding automatically adds the table class names to the table element\
    \ when generating a list view.\n\nTo see this in action, complete the following\
    \ steps:\n\n+   1. Create a new view model class in our project's Models folder\
    \ called `ProductViewModel.cs`. This class will contain six properties and its\
    \ code is listed as follows:\n\n```\npublic class ProductViewModel\n{\n    public\
    \ int ProductID { get; set; }\n    public string ProductName { get; set; }\n \
    \   public decimal? UnitPrice { get; set; }\n    public int? UnitsInStock { get;\
    \ set; }\n    public bool Discontinued { get; set; }\n    public string Status\
    \ { get; set; }\n}\n```\n\n+   2. Next, we'll add a new empty ProductsController\
    \ class and only add one action result called Index to it:\n\n```\npublic class\
    \ ProductsController : Controller\n{\n    private readonly ApplicationDbContext\
    \ _context;\n    private readonly ICurrentUser _currentUser;\n\n    public ProductsController(ApplicationDbContext\
    \ context,\n    ICurrentUser currentUser)\n    {\n        _context = context;\n\
    \        _currentUser = currentUser;\n    }\n\n    public ActionResult Index()\n\
    \    {\n        var models = _context.Products.Project().\n        To<ProductViewModel>().ToArray();\n\
    \        return View(models);\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 45
  md: "The preceding code uses a dependency injection to get a reference to the Entity\
    \ Framework `DBContext` object. The Index method then retrieves a collection of\
    \ products from the database and maps it to the `ProductViewModel` object using\
    \ AutoMapper. The list is then passed to the view.\n\n> We're using `StructureMap`\
    \ to perform our project's dependency injection and inversion of control. We're\
    \ also using a tool called AutoMapper to automatically map our domain models to\
    \ our project's view models. Both libraries are available via NuGet, and you can\
    \ read more about each on their respective websites at `www.structuremap.net`\
    \ and `www.automapper.org`.\n\nUsing AutoMapper, we create a conditional mapping\
    \ to the Status property of the `ProductViewModel` class. If the product is discontinued,\
    \ we'll set the Status property to danger; if the UnitPrice is more than 50, the\
    \ Status property is set to info; and if the UnitInStock property is less than\
    \ 20, the Status property is set to warning. The code that performs this logic\
    \ looks like the following:\n\n```\nMapper.CreateMap<Product, ProductViewModel>()\n\
    \    .ForMember(dest => dest.Status,\n        opt => opt.MapFrom\n           \
    \ (src => src.Discontinued ? \"danger\" : src.UnitPrice > 50 ?\n             \
    \   \"info\" : src.UnitsInStock < 20 ? \"warning\" : \"\"));\n```\n\nTo generate\
    \ a view that includes a Bootstrap table, complete the following steps:\n\n+ \
    \  1. Right-click inside the `Index` method and select **Add View...** from the\
    \ context menu. In the **Add View** dialog window, select **List** from the **Template**\
    \ drop-down menu and the `ProductViewModel` class from the **Model class** drop-down\
    \ menu."
  merge: -1
  img_proc: true
- pgno: 46
  md: "# Using Bootstrap CSS and HTML Elements\n\n+   2. Click on the **Add** button\
    \ to create the new view, as shown in the following screenshot:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_46_0.png)\n\
    \n+   3. The default ASP.NET MVC scaffolding will generate a basic `<table>` element\
    \ with a class name, table. We'll change the default-generated markup by adding\
    \ a table head element (`<thead>`), which will be used to define the column headings\
    \ for the table.\n\n+   4. This element will be followed by a table body element\
    \ (`<tbody>`). The table body element will contain the actual row data. The resulting\
    \ markup will look like the following code:\n\n```\n```html\n<table class=\"table\"\
    >\n    <thead>\n        <tr>\n            <th>\n                Product Name\n\
    \            </th>\n            <th>\n                Unit Price\n           \
    \ </th>\n```\n```"
  merge: -1
