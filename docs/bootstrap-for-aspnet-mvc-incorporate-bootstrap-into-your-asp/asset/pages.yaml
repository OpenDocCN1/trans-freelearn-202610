    steps:


    +   1. Right-click on your ASP.NET MVC project''s name inside Visual Studio, and
    navigate to Add | New Item.

    +   2. Navigate to Visual C# | Web | SideWaffle and select the ASP.NET Scaffolding
    T4 files item template and click on Add:


