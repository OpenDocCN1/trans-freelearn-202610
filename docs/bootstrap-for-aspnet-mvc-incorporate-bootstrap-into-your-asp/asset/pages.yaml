  md: "# Creating self-closing helpers\n\nSelf-closing helpers are helpers that can\
    \ contain HTML and Razor markup.\nThe built-in @Html.BeginForm() helper is an\
    \ example of this type of helper.\n\nIn order to create this type of HTML helper,\
    \ we'll need to create a helper class that implements the IDisposable interface.\
    \ Using the IDisposable interface, we can write the element's closing tags when\
    \ the object is disposed.\n\nThe Bootstrap Panel component is a perfect candidate\
    \ for such a helper. To create the helper, we'll have to complete the following\
    \ steps:\n\n+   1. Create a new subfolder called Panels inside the Helpers folder\
    \ in your project.\n+   2. Open the Enums.cs file, and add a new item called PanelStyle:\n\
    +   3. Add a new class file called Panel.cs to the Panels folder.\n+   4. Add\
    \ a new private read-only field to the class called _writer.\n+   5. Create a\
    \ constructor for the Panel class that accepts three parameters. The first is\
    \ a reference to the HtmlHelper object, the second specifies the title of the\
    \ panel, and the third indicates the style of the panel.\n+   6. Add the following\
    \ code to the Panel class's constructor method:\n\n```\npublic enum PanelStyle\n\
    {\n    Default,\n    Primary,\n    Success,\n    Info,\n    Warning,\n    Danger\n\
    }\n```\n\n```\npublic Panel(HtmlHelper helper, string title, Enums.PanelStyle\
    \ style = Enums.PanelStyle.Default)\n{\n    _writer = helper.ViewContext.Writer;\n\
    \n    var panelDiv = new TagBuilder(\"div\");\n    panelDiv.AddCssClass(\"panel-\"\
    \ + style.ToString().ToLower());\n    panelDiv.AddCssClass(\"panel\");\n\n   \
    \ var panelHeadingDiv = new TagBuilder(\"div\");\n    panelHeadingDiv.AddCssClass(\"\
    panel-heading\");\n```"
  merge: -1
  img_proc: true
- pgno: 117
  md: "```\nvar heading3Div = new TagBuilder(\"h3\");\nheading3Div.AddCssClass(\"\
    panel-title\");\nheading3Div.SetInnerText(title);\n\nvar panelBodyDiv = new TagBuilder(\"\
    div\");\npanelBodyDiv.AddCssClass(\"panel-body\");\n\npanelHeadingDiv.InnerHtml\
    \ = heading3Div.ToString();\n\nstring html = string.Format(\"{0}{1}{2}\", panelDiv.ToString(TagRenderMode.StartTag),\
    \ panelHeadingDiv, panelBodyDiv.ToString(TagRenderMode.StartTag));\n_writer.Write(html);\n\
    }\n```\n\nIn this code, we've set the _writer field to the Writer property of\
    \ the HtmlHelper objects' ViewContext property. By utilizing this property, we'll\
    \ be able to write HTML to the current view.\n\nWe then built up the panel element's\
    \ HTML markup using the TagBuilder object and finally, sent the result to the\
    \ _writer object to output. Note that we used the overloaded ToString method of\
    \ TagBuilder in order to specify that it should only generate the starting tags\
    \ of the <div> element.\n\nThe two <div> elements with class names panel and panel-body\
    \ will be closed in the Panel class's Dispose method, which is implemented in\
    \ the following manner:\n\n```\npublic void Dispose()\n{\n    _writer.Write(\"\
    </div></div>\");\n}\n```\n\n# Using the self-closing helper in a view\n\nTo use\
    \ the helper we created earlier in our view, we'll use the C# using keyword. The\
    \ using keyword restricts the scope of an object and thus, works well with the\
    \ IDisposable interface. In essence, as soon as the helper has finished rendering\
    \ its HTML output, the Dispose method will automatically be invoked, thus closing\
    \ the last two <div> element tags.\n\nTo use the helper in a view, use the following\
    \ markup:\n\n```\n@using (Html.Panel(\"Title\", Enums.PanelStyle.Success))\n{\n\
    \    <p>Hello World</p>\n    <p>Lorem ipsum dolor sit amet, consectetur adipiscing\
    \ elit.</p>\n}\n```"
  merge: -1
  img_proc: true
