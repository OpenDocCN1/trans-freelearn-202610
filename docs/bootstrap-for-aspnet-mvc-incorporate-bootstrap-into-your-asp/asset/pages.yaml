- pgno: 165
  md: '# DataTables extensions


    The jQuery DataTables plugin provides a wide variety of extensions, which can
    enhance the functionality of the plugin dramatically.


    # The ColReorder extension


    The ColReorder extension allows users to reorder table columns by clicking-and-dragging
    the column header to the location they prefer. To enable column reordering for
    your DataTables HTML table, complete the following steps:


    +   1. Open the _Layout.cshtml file and add a reference to the dataTables.colReorder.css
    file:

    +   ```

    +   <link rel="stylesheet" type="text/css" href="//cdn.datatables.net/colreorder/1.1.1/css/dataTables.colReorder.css">

    +   ```

    +   2. Open the view .cshtml file and add a reference to the DataTables, DataTables
    Bootstrap, and ColReorder extension JavaScript files:

    +   ```

    +   <script type="text/javascript" language="javascript" src="//cdn.datatables.net/1.10.0/js/jquery.dataTables.min.js"></script>

    +   <script type="text/javascript" language="javascript" src="//cdn.datatables.net/plug-ins/be7019ee387/integration/bootstrap/3/dataTables.bootstrap.js"></script>

    +   <script type="text/javascript" language="javascript" src="//cdn.datatables.net/colreorder/1.1.1/js/dataTables.colReorder.min.js"></script>

    +   ```

    +   3. Lastly, using jQuery, add an event handler to initialize the DataTables
    plugin and the ColReorder extension after the page has loaded:

    +   ```

    +   <script type="text/javascript">

    +   $(document).ready(function () {

    +   $(".table").DataTable({

    +   "dom": ''Rlfrtip''

    +   });

    +   });

    +   </script>

    +   ```'
  merge: -1
  img_proc: true
