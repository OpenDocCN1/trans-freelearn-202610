- pgno: 127
  md: "```\n<ol class=\"breadcrumb\">\n    <li>@Html.ActionLink(\"Home\", \"Index\"\
    , \"Home\")</li>\n    <li class=\"active\"><#= ViewDataTypeShortName #></li>\n\
    </ol>\n\n<div class=\"row clearfix\">\n    <div class=\"col-md-12\">\n```\n\n\
    +   7. The preceding markup will render a page header and a breadcrumb component\
