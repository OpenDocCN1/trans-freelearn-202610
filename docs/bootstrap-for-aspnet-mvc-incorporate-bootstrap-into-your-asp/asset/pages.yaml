- pgno: 99
  md: "# # Popovers\n\nPopovers are similar to tooltips due to the fact that they\
    \ can provide users with additional information about an element, but they are\
    \ designed to show a little more content, as popovers also allow you to display\
    \ a header.\n\nPopovers are defined in a similar fashion in which you would define\
    \ a popup by adding the `data-toggle`, `data-placement`, `data-original-title`,\
    \ and `data-content` attributes to an element. The following markup displays a\
    \ popup when a user clicks on an anchor `<a>` element:\n\n```\n```html\n<a data-content=\"\
    The protagonist of Franz Kafka's short story The Metamorphosis\" data-placement=\"\
    bottom\" title=\"\" data-toggle=\"popover\" href=\"#\" data-original-title=\"\
    From Wikipedia\">Gregor Samsa</a>\n```\n```\n\nSetting the `data-toggle` attribute\
    \ to popover specifies to the plugin that it needs to show a popover. The `data-content`\
    \ attribute contains the content that will be shown inside the popover, and the\
    \ `data-original-title` attribute sets the title of the popover. The `data-placement`\
    \ attribute indicates the placement of the popover and supports four values, which\
    \ include top, bottom, left, and right.\n\nYou can also specify the trigger that\
    \ will show the popover by setting the `data-trigger` attribute's value. Popovers\
    \ can be triggered when a user clicks or hovers over the element or when the element\
    \ has focus. You can also specify that the trigger should be activated manually.\
    \ The four options for the `data-trigger` attribute are click, hover, focus, and\
    \ manual.\n\nAs with tooltips, the data- API is an opt-in, so you would need to\
    \ initialize the popover plugin manually. In the following code, using jQuery,\
    \ we'll find all elements on a page whose `data-toggle` attribute is set to popover\
    \ and initialize the popover plugin for each one:\n\n```\n```html\n<script type=\"\
    text/javascript\">\n    $(document).ready(function () {\n        $('[data-toggle=\"\
    popover\"]').popover();\n    });\n</script>\n```\n```"
  merge: -1
  img_proc: true
