- pgno: 88
  md: "In order to use Bootstrap plugins, we'll need to include the `bootstrap.js`\
    \ or `bootstrap.min.js` file in our project. This file contains all the Bootstrap\
    \ plugins, but if you do not intend to use every plugin in your project, it is\
    \ a good idea to customize which components are to be included in the `bootstrap.js`\
    \ file. This will make the size of the Bootstrap library smaller and allow the\
    \ website to load faster. To access these plugins, navigate to http://getbootstrap.com/customize/\
    \ and select the plugins that you'll be using in your project.\n\n# Data attributes\
    \ versus the programmatic API\n\nBootstrap offers the ability to use its plugins\
    \ entirely through the HTML markup. This means that in order to use most of the\
    \ plugins, you do not need to write a single line of JavaScript. Using data attributes\
    \ is the recommended approach and should be your first option when using Bootstrap\
    \ plugins.\n\nFor example, to allow an `alert` element to be dismissible, you'll\
    \ add the `data-dismiss=\"alert\"` attribute to either a `button` or `anchor`\
    \ element, as illustrated in the following code:\n\n```\n<div class=\"alert alert-danger\"\
    >\n  <button data-dismiss=\"alert\" class=\"close\" type=\"button\">×</button>\n\
    \  <strong>Warning</strong> Shuttle launch in t-minus 10 seconds.\n</div>\n```\n\
    \nYou also have the option to perform the same action using the programmatic API\
    \ via JavaScript. The following code uses jQuery to close a specific `alert` element\
    \ when the user clicks on a button:\n\n```\n<button class=\"close\" type=\"button\"\
    \ onclick=\"$ ('#myalert').alert('close')\">×</button>\n```"
  merge: -1
  img_proc: true
- pgno: 89
  md: "# Cascading dropdowns\n\nYou can add drop-down menus to almost any Bootstrap\
    \ component using the dropdown plugin. A cascading dropdown is a dropdown that\
    \ updates its data based on a value selected in another dropdown. To add cascading\
    \ dropdowns, perform the following steps:\n\n+   1. We'll add drop-down menus\
    \ to two buttons which will list the region and territory data that was retrieved\
    \ from a database. When the user selects a region, the Territory drop-down list\
    \ will update to show only those territories associated with the selected region.\
    \ The following screenshot illustrates the end result:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_89_0.png)\n\
    \n+   2. The two drop-down menus will be used in our Edit Customer view, and in\
    \ order for the list of territories and regions to be accessible in our view,\
    \ we'll first add them to the ViewBag object using the following code:\n\n```\n\
    public ActionResult Edit(int id)\n{\n    var model = _context.Customers.First(c\
    \ => c.CustomerId == id);\n    ViewBag.RegionId = new SelectList(_context.Regions,\n\
    \    \"RegionId\", \"RegionDescription\", model.RegionId);\n    ViewBag.TerritoryId\
    \ = new SelectList(_context.Territories.\n    Where(t => t.RegionId == model.RegionId),\
    \ \"TerritoryId\",\n    \"TerritoryDescription\", model.TerritoryId);\n    return\
    \ View(model);\n}\n```"
  merge: -1
  img_proc: true
- pgno: 90
  md: "# Using Bootstrap JavaScript Plugins\n\nIn this code, we first loaded the requested\
    \ customer from the database and then added a list of regions and territories\
    \ from the database to the ViewBag object. You will notice that we only retrieved\
    \ the territories in the selected customer's region.\n\n+   3. Next, we add the\
    \ Razor markup to our view to create two buttons with drop-down menus. In the\
    \ following code, we'll create two new Bootstrap form groups that contain a label\
    \ for the region and territory properties as well as hidden elements that will\
    \ carry the selected region and territory ID. We iterate over the regions and\
    \ territories that were passed to the view via the ViewBag object and build up\
    \ the menu items.\n\n```\n```html\n<div class=\"form-group\">\n    @Html.LabelFor(model\
    \ => model.RegionId,\n        new { @class = \"control-label col-md-2\" })\n \
    \   @Html.HiddenFor(model => model.RegionId)\n    <div class=\"col-md-10\">\n\
    \        <div id=\"regiondropdown\" class=\"dropdown\">\n            <button id=\"\
    regionbutton\" class=\"btn btn-sm btn-info\"\n                    data-toggle=\"\
    dropdown\">@Model.Region.\n                RegionDescription</button>\n      \
    \      <ul class=\"dropdown-menu\">\n                @foreach (var item in ViewBag.RegionId)\n\
    \                {\n                    <li><a href=\"#\" tabindex=\"-1\" data-value=\"\
    @\n                        item.Value\">@item.Text</a></li>\n                }\n\
    \            </ul>\n        </div>\n    </div>\n</div>\n<div class=\"form-group\"\
    >\n    @Html.LabelFor(model => model.TerritoryId, new { @class =\n        \"control-label\
    \ col-md-2\" })\n    @Html.HiddenFor(model => model.TerritoryId)\n    <div class=\"\
    col-md-10\">\n        <div id=\"territorydropdown\" class=\"dropdown\">\n    \
    \        <button id=\"territorybutton\" class=\"btn btn-\n                sm btn-info\"\
    \ data-toggle=\"dropdown\">@Model.Territory.\n                TerritoryDescription</button>\n\
    \            <ul id=\"territories\" class=\"dropdown-menu\">\n               \
    \ @foreach (var item in ViewBag.TerritoryId)\n                {\n            \
    \        <li><a href=\"#\" tabindex=\"-1\" data-value=\"@\n                  \
    \      item.Value\">@item.Text</a></li>\n                }\n            </ul>\n\
    \        </div>\n    </div>\n</div>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 91
  md: "> Note that we're setting the tabindex item of the anchor element <a> inside\
    \ the menu to -1. This is done to prevent the element from being part of the tab\
    \ order.\n\n4. Next, add a new partial view called Territories.cshtml to your\
    \ project. We'll use this partial view to load the territories each time the user\
    \ changes the region. In order to load the partial view, we'll need to add a new\
    \ method to CustomerController that returns PartialViewResult. The code for this\
    \ method is as follows:\n\n```\npublic PartialViewResult Territories(int regionId)\n\
    {\n    ViewBag.TerritoryId = new SelectList(_context.Territories.Where(t => t.RegionId\
    \ == regionId), \"TerritoryId\", \"TerritoryDescription\");\n    return PartialView();\n\
    }\n```\n\nThis method receives a region ID as a parameter and then loads the region's\
    \ associated territories into the ViewBag object. Finally, the method returns\
    \ the Territories partial view we've created earlier.\n\n5. Finally, in order\
    \ to load the associated territories when the user selects a different region,\
    \ we'll need to add a bit of JavaScript to our page. To do this, create a new\
    \ section in the view, and add the following JavaScript code to it:\n\n```\n@section\
