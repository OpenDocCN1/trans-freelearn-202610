- pgno: 56
  md: "```\n@Html.LabelFor(m => m.UserName, new { @class = \"sr-only\" })\n@Html.TextBoxFor(m\
    \ => m.UserName, new { @class = \"form-control\", placeholder = \"Enter your username\"\
    \ })\n@Html.ValidationMessageFor(m => m.UserName)\n</div>\n<div class=\"form-group\"\
    >\n    @Html.LabelFor(m => m.Password, new { @class = \"sr-only\" })\n    @Html.PasswordFor(m\
    \ => m.Password, new { @class = \"form-control\", placeholder = \"Enter your username\"\
    \ })\n    @Html.ValidationMessageFor(m => m.Password)\n</div>\n<div class=\"form-group\"\
    >\n    <input type=\"submit\" value=\"Log in\" class=\"btn btn-default\" />\n\
    </div>\n}\n```\n\nThis will render the following form in your browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_56_0.png)\n\
    \n# Bootstrap validation styles\n\nThe default ASP.NET MVC project template supports\
    \ unobtrusive validation and automatically adds the required JavaScript libraries\
    \ to your project. However, you'll notice that the default validation does not\
    \ use the Bootstrap-specific CSS styles. When an input element fails validation,\
    \ the jQuery validation plugin changes its class name to input-validation-error.\
    \ This class name is declared inside the Site.css file and simply draws a red\
    \ border around the invalid input element as displayed in the following screenshot:"
  merge: -1
  img_proc: true
- pgno: 57
  md: "![](img/371b9a67300a03b7b335eb8a6fe55d94_57_0.png)\n\nBootstrap's validation\
    \ styles, however, set the invalid input element's associated label's font weight\
    \ to bold and draw a red border around the element. The reason the jQuery validation\
    \ plugin does not work with the Bootstrap validation styles is because Bootstrap\
    \ does not apply the validation style to the input element but adds the has--error\
    \ class name to the parent element:\n\n```\n```html\n<div class=\"form-group has-error\"\
    >\n    <label class=\"control-label\" for=\"name\">Name</label>\n    <input type=\"\
    text\" class=\"form-control\" id=\"name\">\n</div>\n```\n```\n\nIn this code,\
    \ the parent `<div>` element's class is changed to `form-group has--error`.\n\n\
    In order for our form to work with the Bootstrap validation classes without having\
    \ to change the jQuery validation plugin directly, we first need to add a new\
    \ JavaScript file called `jquery.validate.bootstrap.js` to our Scripts folder."
  merge: -1
  img_proc: true
- pgno: 58
  md: "# Using Bootstrap CSS and HTML Elements\n\nThe following code will modify the\
    \ default settings for the jQuery validation plugin by calling the `setDefaults`\
    \ function. We then specify how the invalid element should be highlighted using\
    \ the `highlight` function. In this function, we tell the validation plugin that\
    \ it should find the closest element with a `.form-group` class and add the `has-error`\
    \ class to it. In the `unhighlight` function, we remove the `has-error` class\
    \ as follows:\n\n```\n```javascript\n$.validator.setDefaults({\n    highlight:\
    \ function (element) {\n        $(element).closest('.form-group').addClass('has-error');\n\
    \    },\n    unhighlight: function (element) {\n        $(element).closest('.form-group').removeClass('has-error');\n\
    \    }\n});\n```\n```\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_58_0.png)\n\n\
    > You can read more about the jQuery validation plugin and its various settings\
    \ on its project site located at `http://jqueryvalidation.org/`.\n\nNext, we need\
    \ to add the new JavaScript file to the `jqueryval` bundle, which is specified\
    \ in the `BundleConfig.cs` file. The current `jqueryval` bundle uses a wildcard\
    \ to add all files that starts with `jquery.validate` to it. We need to change\
    \ this to specify each file explicitly, as the bundling order is alphabetical\
    \ for wildcard bundling and the `jquery.validation.bootstrap.js` file should be\
    \ loaded after the jQuery validation library. The following code will add all\
    \ the required validation libraries and files to our bundle:\n\n```\n```csharp\n\
    bundles.Add(new ScriptBundle(\"~/bundles/jqueryval\").Include(\n    \"~/Scripts/jquery.validate.js\"\
    ,\n    \"~/Scripts/jquery.validate.unobtrusive.js\",\n    \"~/Scripts/jquery.validate.bootstrap.js\"\
    ));\n```\n```\n\nWhen building and running the project, you should now see the\
    \ Bootstrap validation styles applied to invalid form elements as illustrated\
    \ in the following screenshot:"
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Creating editor templates for primitive types


    Editor templates are used to automatically generate form input elements based
    on the datatype of an object''s properties. ASP.NET MVC contains a number of standard
    editor templates but developers are also able to create their own. Editor templates
    are similar to partial views, but where partial views are rendered by name, editor
    templates are rendered by type.


    When using Visual Studio''s default scaffolding functionality to create an edit
    view for your model, it generates text input elements using the EditorFor HTML
    helper as follows:


    ```

    @Html.EditorFor(model => model.CategoryName)

    ```'
  merge: -1
  img_proc: true
- pgno: 60
  md: "The EditorFor helper renders HTML for the model property based on its datatype.\
    \ In the case of a string value, the resulting markup will look similar to the\
    \ following:\n\n```\n<input type=\"text\" name=\"CategoryName\"\n    id=\"CategoryName\"\
    \ data-val-required=\"The Category Name\n    field is required.\"\n    data-val=\"\
    true\" class=\"text-box single-line\">\n```\n\nIn this generated markup, the input\
    \ element has a class of text-box single-line. For the text element to render\
    \ correctly using the Bootstrap styles, the input element's class should be set\
    \ to form-control.\n\nIn order for the EditorFor helper to generate the input\
    \ element with the correct class, we need to create an editor template by completing\
    \ the following steps:\n\n+   1. First, create a new folder called EditorTemplates\
    \ inside the Shared folder.\n+   2. Next, add a new file called string.cshtml\
    \ to the EditorTemplates folder and add the following code to it:\n\n```\n@model\
    \ string\n@Html.TextBox(\"\", ViewData.TemplateInfo.FormattedModelValue, new {\n\
    @class = \"form-control\"})\n```\n\nIn the preceding code, we created a textbox\
    \ and passed in an empty string as the name for the textbox. This will cause ASP.NET\
    \ MVC to use the model's property name as the name for the textbox. The value\
    \ to show inside the textbox is specified by using the FormattedModelValue property\
    \ of TemplateInfo. Lastly, we specify the HTML attributes for the element; in\
    \ this case, we set its class property to form-control.\n\nNow, when a textbox\
    \ is rendered using the EditorFor helper, the resulting HTML markup will look\
    \ as follows:\n\n```\n<input type=\"text\" name=\"CategoryName\" id=\"CategoryName\"\
    \ data-val-required=\"The Category Name field is required.\" data-val=\"true\"\
    \ class=\"form-control\">\n```\n\n# Creating editor templates for nonprimitive\
    \ types\n\nASP.NET MVC enables developers to create editor templates for custom\
    \ datatypes. For example, in the following screenshot, we have a form with a textbox\
    \ and a multiline textbox:"
  merge: -1
  img_proc: true
