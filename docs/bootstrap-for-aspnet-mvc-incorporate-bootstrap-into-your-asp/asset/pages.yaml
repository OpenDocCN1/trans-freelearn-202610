- pgno: 147
  md: '9. In the preceding markup, we used the Url.Content helper to map a virtual
    path to the .css files in our project.


    10. Add the following code just above the closing </body> tag:


    ```

    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>

    <script src="@Url.Content("~/js/bootstrap.js")"></script>

    <script src="@Url.Content("~/js/sb-admin.js")"></script>

    @RenderSection("scripts", false)

    ```


    11. In the preceding code, we added a reference to the jQuery library that is
    hosted on a Google Content Delivery Network (CDN). We also used the Url.Content
    helper again to map a virtual path to the required JavaScript files and used the
    @RenderSection helper to specify a section called scripts.


    12. Next, you''ll notice that the page is divided into three distinguishable elements:


    +   - A <div> element whose ID is set to wrapper

    +   - A <nav> element

    +   - A <div> element with an ID of page-wrapper


    13. Leave the <nav> and <div id="wrapper"> elements as is, and replace all markup
    inside the <div id="page-wrapper"> element with the @RenderBody() method.


    14. The master layout is now complete; next, we''ll need to add a view for the
    Index action on the home controller.


    # Adding a view for the home controller


    We need to create a view for the home controller''s Index action in order to test
    our template. Complete the following steps to accomplish this:


    +   1. Open the HomeController.cs file, right-click inside the Index method, and
    select Add View... from the context-menu.

    +   2. In the Add View dialog, set the View name textbox to Index and the Template
    combobox to Empty (without model).'
