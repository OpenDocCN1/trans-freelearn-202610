- pgno: 173
  md: "# # Add TwitterBootstrapMVC using the .dll file\n\nYou do not need to add the\
    \ TwitterBootstrapMVC library via NuGet, you can also add it using the .dll file.\
    \ To do this, complete the following steps:\n\n+   1. Inside your browser, navigate\
    \ to `https://www.twitterbootstrapmvc.com/Home/Installation` and download the\
    \ zip archive located under the **Option 2: Download a .dll** heading.\n+   2.\
    \ After the zip file has been downloaded, extract the files to a folder on a local\
    \ drive.\n+   3. Inside Visual Studio, right-click on the **References** node\
    \ in the **Solution Explorer** window and select **Add Reference...** from the\
    \ context menu.\n+   4. Browse to the folder where you've extracted the zip archive\
    \ and select the `TwitterBootstrapMVC5.dll` file.\n+   5. Next, navigate to `https://www.twitterbootstrapmvc.com/Download`\
    \ and download a trial or purchase a personal or commercial license.\n+   6. Download\
    \ the license file, it should be called `TwitterBootstrapMvcLicense.lic` and add\
    \ it to the root of your project in Visual Studio.\n+   7. Open the Web.config\
    \ file located inside the Views folder and add the following code to the `<namespaces>`\
    \ element:\n+   \n+      ```xml\n+      <add namespace=\"TwitterBootstrapMVC\"\
    \ />\n+      <add namespace=\"TwitterBootstrap3\" />\n+      ```\n+   \n+   8.\
    \ Finally, open the Global.asax file in the root of your project and add the following\
    \ line of code to the Application_Start method:\n+   \n+      ```csharp\n+   \
    \   Bootstrap.Configure();\n+      ```\n\n# # Using the TwitterBootstrapMVC helpers\n\
    \nThe TwitterBootstrapMVC library offers a wide range of Bootstrap helpers, all\
    \ of whom use a fluent syntax to allow the chaining of methods. These helpers\
    \ can reduce the amount of HTML markup you need to create the Bootstrap components.\
    \ Method chaining in the library follows the following pattern:\n\n```\n```csharp\n\
    @Html.Bootstrap().TextBoxFor(m => m.PostalCode).Value(\"1.23\").\n    Size(InputSize.Large).Placeholder(\"\
    Enter Postal Code\").\n    Format(\"{0:0.00}\").Prepend(\"US\")\n```\n```"
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Forms and inputs


    TwitterBootstrapMVC offers fluent helpers for most forms and input elements.


    # Inputs


    TwitterBootstrapMVC supplies ASP.NET MVC helpers for all HTML input elements;
    most of these components share the same chaining methods. These methods are listed
    in the following table:


    | Method name | Description |

    |---|---|

    | .Label() | This prepends a label element to the element |

    | .Tooltip() | This adds a tooltip to the component with the supplied message
    |

    | .HelpText() | This adds a helper text next to the element |

    | .Id() | This sets the id attribute of the element |

    | .Class() | This sets the class HTML attribute of the element |

    | .ReadOnly() | This adds readonly="readonly" to the element |

    | .HtmlAttributes() | This adds the specified HTML attribute(s) to the element
    |

    | .Data() | This works in a similar fashion as the .HtmlAttributes() method but
    prepends data- to the attribute |

    | .Disabled() | This adds disabled="disabled" to the element |

    | .DisabledDependsOn() | This disables an element that is conditionally based
    on the value of another element |

    | .VisibleDependsOn() | This hides an element that is conditionally based on the
    value of another element |

    | .ShowValidationMessage() | This sets whether the validation message should be
    shown for an element in case its validation fails |'
  merge: -1
  img_proc: true
- pgno: 175
  md: "# Forms\n\nUsing the following code, you can generate a simple vertical Bootstrap\
    \ form containing three textboxes and a submit button. The first two textboxes\
    \ also invoke the PlaceHolder method that adds the placeholder text to the empty\
    \ textboxes and the last textbox has an additional method called HelpText that\
    \ adds the helper text to the bottom of the textbox.\n\n```\n@using (var form\
    \ = Html.Bootstrap().Begin(new Form()))\n{\n    @form.FormGroup().TextBoxFor(m\
    \ => m.CompanyName).PlaceHolder(\"Enter the company name.\")\n    @form.FormGroup().TextBoxFor(m\
    \ => m.ContactName).PlaceHolder(\"Enter the name of contact person.\")\n    @form.FormGroup().TextBoxFor(m\
    \ => m.Address).HelpText(\"Short address for customer.\")\n    @Html.Bootstrap().SubmitButton()\n\
    }\n```\n\nThe resulting form should look similar to the following screenshot in\
    \ the browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_175_0.png)\n\nYou'll\
    \ also notice that the FormGroup helper is smart enough to automatically add an\
    \ asterisk (*) to the fields' label, if the value is required."
  merge: -1
  img_proc: true
- pgno: 176
  md: "To generate the same form as an inline or vertical form is as simple as invoking\
    \ the Type method on the Form object and specifying the layout as a parameter\
    \ to the Type method. The parameter is an enumeration (enum) value, which enables\
    \ intelliSense that lists all the available options:\n\n```\n@using (var form\
    \ = Html.Bootstrap().Begin(new Form().Type(FormType.Inline)))\n{\n    @form.FormGroup().TextBoxFor(m\
    \ => m.CompanyName).Placeholder(\"Enter the company name.\")\n    @form.FormGroup().TextBoxFor(m\
    \ => m.ContactName).Placeholder(\"Enter the name of contact person.\")\n    @form.FormGroup().TextBoxFor(m\
    \ => m.Address)\n    @Html.Bootstrap().SubmitButton()\n}\n```\n\nThe resulting\
    \ form will appear similar to the following screenshot:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_176_0.png)\n\
    \nThe Textbox helper offers the following extension methods to add additional\
    \ formatting or functionality to a textbox element:\n\n| Method name | Description\
    \ |\n|---|---|\n| .Value() | This sets the value of the textbox. |\n| .Size()\
    \ | This sets the size of the textbox. This also accepts the Inputsize enum. |\n\
    | .Placeholder() | This specifies the placeholder text of the textbox. |\n| .Format()\
    \ | This is used to specify the data format of the textbox. |\n| .Append() | This\
    \ appends the specified string to the end of the textbox. This also creates an\
    \ input group. |\n| .AppendIcon() | This appends an icon to the end of the textbox.\
    \ |\n| .Prepend() | This is the opposite of the .Append() method. This adds the\
    \ specified string to the front of the textbox and also creates an input group.\
    \ |\n| .PrependIcon() | This adds the specified icon to the front of the textbox.\
    \ |\n| .TypeAhead() | This enables the TypeAhead functionality for the textbox.\
    \ |"
  merge: -1
  img_proc: true
- pgno: 177
  md: "In the following example, we'll create a textbox for the models' `PostalCode`\
    \ property, set its value element to 1.23, and its size to Large. We'll then specify\
    \ the placeholder text and the format, and finally, we add a string to the front\
    \ of the textbox:\n\n```\n```csharp\n@Html.Bootstrap().TextBoxFor(m => m.MinimumTransactionValue).\n\
    \    Value(\"1.23\").Size(InputSize.Large).Placeholder(\"Enter Postal Code\").\n\
    \    Format(\"{0:0.00}\").Prepend(\"US\")\n```\n```\n\nThe resulting textbox should\
    \ look similar to the following screenshot in your browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_177_0.png)\n\
    \nTo create a text area input using the `TwitterBootstrapMVC` library, you can\
    \ use the `TextAreaFor` helper. This helper supports two additional methods with\
    \ which you can specify the number of columns and rows for the text area. In the\
    \ following example, we'll create a text area for the models' `Address` property\
    \ and set its columns value to 10 and its rows value to 5:\n\n```\n```csharp\n\
    @Html.Bootstrap().TextAreaFor(m => m.Address).Columns(10).Rows(5)\n```\n```\n\n\
    The text areas should be rendered similar to the following screenshot in your\
    \ browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_177_1.png)"
  merge: -1
  img_proc: true
- pgno: 178
  md: "# # Buttons and links\n\nThe `TwitterBootstrapMVC` library provides fluent\
    \ helpers for Bootstrap buttons as well as links. Both buttons and links helpers\
    \ share the following extension methods:\n\n| Method name | Description |\n|---|---|\n\
    | `.AppendIcon()` | This appends the specified icon to the button or link |\n\
    | `.PrependIcon()` | This prepends the specified icon to the button or link |\n\
    | `.Disabled()` | This adds the `disabled` class to the button or link |\n\nIn\
    \ the following code example, we'll create a simple submit button that has an\
    \ icon at the back and at the front of it. Note the use of the `glyphicon` class\
    \ names in order to specify which icons to use.\n\n```\n```csharp\n@Html.Bootstrap().Button().AppendIcon(\"\
    glyphicon glyphicon-pencil\").\n    PrependIcon(\"glyphicon glyphicon-music\"\
    )\n```\n```\n\nThe preceding markup will render the following screenshot in your\
    \ browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_178_0.png)\n\nThe `ActionLinkButton`,\
    \ `Button`, and `SubmitButton` helpers share the following extension methods:\n\
    \n| Method name | Description |\n|---|---|\n| `.Text()` | This sets the caption/text\
    \ of the button. |\n| `.Name()` | This specifies the HTML name attribute. |\n\
    | `.Value()` | This sets the value HTML attribute. |\n| `.Size()` | This specifies\
    \ the size of the button. This also accepts the `ButtonSize` enum as a parameter.\
    \ |\n| `.Style()` | This sets the style of the button. This also accepts the `ButtonStyle`\
    \ enum as a parameter. |\n| `.ButtonBlock()` | This expands the button to the\
    \ full width of the container. |"
  merge: -1
  img_proc: true
- pgno: 179
  md: '| Method name | Description |

    |---|---|

    | `.LoadingText()` | This sets the text that should be displayed after the button
    was clicked. |

    | `.DropDownToggle()` | This applies the dropdown-toggle class name to the button.
    |


    The following code generates a large, green Bootstrap button and sets its caption
    using the `TwitterBootstrapMVC` fluent helper syntax:


    ```

    ```csharp

    @Html.Bootstrap().Button().Text("Buy Now").Size(ButtonSize.Large).Style(ButtonStyle.Success)

    ```

    ```


    The button will resemble the following screenshot in your browser:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_179_0.png)


    The `ActionLinkButton` and `ActionLink` helpers share the following extension
    methods:


    | Method name | Description |

    |---|---|

    | `.Protocol()` | This specifies the URL''s protocol, for example, http or https
    |

    | `.HostName()` | This sets the hostname of the URL |

    | `.Fragment()` | This sets the anchor name of the URL |

    | `.RouteName()` | This specifies the route name |

    | `.RouteValues()` | This sets the route values |

    | `.Title()` | This sets the title HTML attribute |


    In the following code, we''ll create an `ActionLinkButton` object. Note how we
    combined the `.Style` and `.PrependIcons` methods with the `ActionLinkButton`
    method:


    ```

    ```csharp

    @Html.Bootstrap().ActionLinkButton("Go to Buttons", "Buttons").Protocol("http").Title("Buttons
    Link").Style(ButtonStyle.Link).PrependIcon("glyphicon glyphicon-film")

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 180
  md: "The result will be a link with an icon rendered inside your browser, as shown\
    \ in the following screenshot:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_180_0.png)\n\
    \n# Accordions and panels\n\nBoth the accordion and panel helpers, which TwitterBootstrapMVC\
    \ provides, should be used with the disposable Begin method.\n\nThe accordion\
    \ method has another method called `BeginPanel`, which is used to indicate a new\
    \ panel inside the accordion component. The following code will generate an accordion\
    \ with two panels. Note that both panels are also disposable.\n\n```\n```csharp\n\
    @using (var accordian = Html.Bootstrap().Begin(new Accordion(\"FAQ\")))\n{\n \
    \   using (accordian.BeginPanel(\"Question 1\"))\n    {\n        <p>tiam luctus\
    \ nunc ipsum, sed facilisis velit.</p>\n    }\n    using (accordian.BeginPanel(\"\
    Question 2\"))\n    {\n        <p>Duis volutpat iaculis nisl, ut porttitor.</p>\n\
    \    }\n}\n```\n```\n\nThe accordion should look similar to the following screenshot\
    \ in your browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_180_1.png)\n\n\
    The panel helper includes three child methods, `BeginHeading`, `BeginBody`, and\
    \ `BeginFooter`. These methods can also be invoked by using a shorthand notation\
    \ by invoking either the Heading, Body, or Footer methods."
  merge: -1
  img_proc: true
- pgno: 181
  md: "Using the following code, we'll generate a panel with a heading and footer.\
    \ We'll also specify the style of the panel by calling the shared Style method\
    \ on the Panel object.\n\n```\n```csharp\n@using (var panel = Html.Bootstrap().Begin(new\
    \ Panel().Style(PanelStyle.Danger)))\n{\n    @panel.Heading(\"Panel Heading\"\
    )\n\n    using (panel.BeginBody())\n    {\n        <p>Proin mattis lacus ac enim\
    \ aliquam, eu malesuada tortor pretium.</p>\n    }\n    @panel.Footer(\"Panel\
    \ Footer\")\n}\n```\n```\n\nThis code will render the following screenshot in\
    \ your browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_181_0.png)\n\n# ##\
    \ Tabs and modals\n\nFluent helpers are also available for the tab and modal components.\
    \ A new tab component should be created using the disposable Begin method. Each\
    \ tab inside the tab component must be declared using the Tab extension method\
    \ and the content of each tab should reside inside the BeginPanel method.\n\n\
    In the following example, we'll create a tab component with two tabs. Note the\
    \ use of the AppendBadge extension method on the Tab method.\n\n```\n```csharp\n\
    @using (var tabs = Html.Bootstrap().Begin(new Tabs(\"TabComponent\")))\n{\n  \
    \  @tabs.Tab(\"Tab One\")\n```\n```"
  merge: -1
  img_proc: true
