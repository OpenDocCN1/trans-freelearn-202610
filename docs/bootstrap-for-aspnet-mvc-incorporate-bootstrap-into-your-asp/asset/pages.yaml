- pgno: 105
  md: '# # Creating ASP.NET

    # MVC Bootstrap Helpers


    ASP.NET MVC allows developers to create their own HTML helper methods either by
    creating static or extension methods. In essence, an HTML helper is simply a method
    that returns an HTML string.


    HTML helpers enable you to use the same common block of markup on multiple pages
    and make the code and markup in your pages easier to read and maintain. This promotes
    the use of reusable code, and developers can also unit test their helper methods.


    In this chapter, we will cover the following topics:


    +   - An overview of the built-in ASP.NET MVC HTML helpers

    +   - Creating helpers using the @helper syntax

    +   - Creating HTML helpers using static methods

    +   - Creating HTML helper extension methods

    +   - Creating fluent HTML helpers

    +   - Creating self-closing helpers


    # ## Built-in HTML helpers


    An HtmlHelper is a method that renders HTML content inside a view. It is intended
    to allow developers to reuse a common block of HTML markup across multiple pages.'
  merge: -1
  img_proc: true
- pgno: 106
  md: "ASP.NET MVC provides a range of standard, out-of-the-box HTML helpers. For\
    \ example, to produce the following HTML for a textbox with an ID and name attribute\
    \ of CustomerName, use the following code:\n\n```\n<input type=\"text\" name=\"\
    CustomerName\" id=\"CustomerName\">\n```\n\nYou should use the TextBox helper\
    \ as illustrated in the following code:\n\n```\n@Html.TextBox(\"CustomerName\"\
    )\n```\n\nMajority of the built-in HTML helpers offer several overloaded versions.\
    \ For instance, to create a textbox and explicitly set its name and value attributes,\
    \ you should use the following overloaded TextBox helper method:\n\n```\n@Html.TextBox(\"\
    CustomerName\", \"Northwind Traders\")\n```\n\nMost built-in helpers also offer\
    \ the option to specify HTML attributes for the element that is generated by passing\
    \ in an anonymous type. In the following example, we'll create a textbox and set\
    \ its style property using one of the overload methods:\n\n```\n@Html.TextBox(\"\
    CustomerName\",\"Northwind Traders\", new {\nstyle=\"background-color:Blue;\"\
    \ })\n```\n\n> You can read more about the standard HTML helpers available in\
    \ ASP.NET MVC at http://bit.ly/MVCFormHelpers.\n\n# Creating a custom helper\n\
    \nAs Bootstrap offers a variety of different components, it lends itself perfectly\
    \ towards the use of helpers. The simplest form of helper in ASP.NET MVC is the\
    \ one that you can create using the @helper syntax. A custom helper can include\
    \ any HTML or even Razor markup. To create a simple helper method to generate\
    \ a Bootstrap button, complete the following steps:\n\n+   1. Create a new folder\
    \ called App_Code inside the root folder of your website.\n+   2. Create a new\
    \ file called BootstrapHelpers.cshtml inside the newly created App_Code folder.\n\
    +   3. Add the following code to the BootstrapHelper.cshtml file:\n\n```\n@helper\
    \ PrimaryButtonSmall(string id,string caption)\n{\n    <button id=\"@id\" type=\"\
    button\" class=\"btn btn-primary btn-sm\">@caption</button>\n}\n```"
  merge: -1
  img_proc: true
- pgno: 107
  md: "This code employs the @helper syntax to create a new helper called PrimaryButtonSmall.\
    \ The helper accepts two parameters in order to specify the id attribute of the\
    \ button element as well as the button's caption element. We've added appropriate\
    \ Bootstrap classes to the button element in order to render a blue primary button.\
    \ Any custom helper must reside inside the App_Code folder in order for ASP.NET\
    \ MVC to recognize it inside your view.\n\n# Using a helper in a view\n\nLet's\
    \ use the helper we just created in the preceding section. To do this, open a\
    \ view in your site, and add the following code to the page:\n\n```\n```csharp\n\
    @BootstrapHelpers.PrimaryButtonSmall(\"myButton\",\"My New Button\")\n```\n```\n\
    \nWhen you run the site and view the source of the page on which the helper is\
    \ used, you'll see that the helper generated the correct HTML markup to create\
    \ the following primary Bootstrap button:\n\n```\n```html\n<button class=\"btn\
    \ btn-primary btn-sm\" type=\"button\" id=\"myButton\">My New Button</button>\n\
    ```\n```\n\nYou'll notice that although this approach works, it is not practical\
    \ because it means we would have to create an HTML helper for each style and size\
    \ of button available. A possible solution to this problem is to change our helper\
    \ code in order to accept a parameter with which the developer can specify which\
    \ style and size the button should be. To accomplish this, perform the following\
    \ steps:\n\n+   1. Open the BootstrapHelpers.cshtml file that is located inside\
    \ the App_Code folder.\n+   2. Replace the code inside the file with the following\
    \ code:\n+   \n+      ```csharp\n+      @helper Button(string style, string size,\
    \ string caption, string id)\n+      {\n+          <button id=\"@id\" type=\"\
    button\" class=\"btn btn-@style btn-@size\">@caption</button>\n+      }\n+   \
    \   ```\n+   \n+   3. Open the view that uses the helper and add the following\
    \ markup:\n+   \n+      ```csharp\n+      @BootstrapHelpers.Button(\"danger\"\
    ,\"lg\",\"A Large button\",\"myLargeButton\")\n+      ```\n\nIn the preceding\
    \ step, we've updated our helper to accept two string parameters to specify the\
    \ size and style of the Bootstrap button. The problem with this approach is that\
    \ the developer still needs to know the name of the style and size in order to\
    \ render the correct button."
  merge: -1
  img_proc: true
- pgno: 108
  md: "# Creating helpers using static methods\n\nThe easiest alternative to creating\
    \ helpers using the @helper syntax we mentioned earlier is to create static methods\
    \ that simply return a string that contains an HTML markup.\n\nIn order to accomplish\
    \ this, we need to complete the following steps:\n\n+   1. Create a new folder\
    \ called Helpers inside the root folder of your project.\n+   2. Add a new class\
    \ to this folder called Enums.cs. This file will contain all the enumerators for\
    \ our project.\n+   3. Add the following code to the Enums.cs file:\n+   4. Create\
    \ a new class called ButtonHelper.cs in the Helpers folder.\n+   5. Add a method\
    \ called Button to the ButtonHelper class, and add the following code to it:\n\
    \n```\npublic class Enums\n{\n    public enum ButtonStyle\n    {\n        Default,\n\
    \        Primary,\n        Success,\n        Info,\n        Warning,\n       \
    \ Danger,\n        Link\n    }\n\n    public enum ButtonSize\n    {\n        Large,\n\
    \        Small,\n        ExtraSmall,\n        Normal\n    }\n}\n```\n\n```\npublic\
    \ static MvcHtmlString Button(string caption, Enums.ButtonStyle style, Enums.ButtonSize\
    \ size)\n{\n    if (size != Enums.ButtonSize.Normal)\n    {\n        return new\
    \ MvcHtmlString(string.Format(\"<button type=\\\"button\\\" class=\\\"btn btn-{0}\
    \ btn-{1}\\\">{2}</button>\", style.ToString().ToLower(), ToBootstrapSize(size),\
    \ caption));\n    }\n```"
  merge: -1
  img_proc: true
- pgno: 109
  md: "```\n}\nreturn new MvcHtmlString(string.Format(\"<button type=\\\\\"button\\\
    \\\" class=\\\\\"btn btn-{0}\\\\\">{1}</button>\", style.ToString().ToLower(),\
    \ caption));\n}\n```\n\n+   6. Finally, add another method called ToBootstrapSize:\n\
    \n```\nprivate static string ToBootstrapSize(Enums.ButtonSize size)\n{\n    string\
    \ bootstrapSize = string.Empty;\n    switch (size)\n    {\n        case Enums.ButtonSize.Large:\n\
    \            bootstrapSize = \"lg\";\n            break;\n\n        case Enums.ButtonSize.Small:\n\
    \            bootstrapSize = \"sm\";\n            break;\n\n        case Enums.ButtonSize.ExtraSmall:\n\
    \            bootstrapSize = \"xs\";\n            break;\n    }\n    return bootstrapSize;\n\
    }\n```\n\nThe Button method we created earlier accepts three parameters in order\
    \ to set the button's caption, size, and style. We use the enumerator values declared\
    \ in the Enums.cs file in order to list the available sizes and styles for the\
    \ button—this releases the developer from memorizing the exact Bootstrap class\
    \ names for each.\n\nThe Button method returns an MvcHtmlString object, which\
    \ was introduced in .NET 4. The MvcHtmlString object represents an HTML-encoded\
    \ string, which does not need to be encoded again. If we simply return a normal\
    \ string object, the actual HTML would be rendered inside the view instead of\
    \ the button.\n\nThe ToBootstrapSize method basically converts the ButtonSize\
    \ value to a valid Bootstrap class name that represents the size of the button.\
