- pgno: 51
  md: '![](img/371b9a67300a03b7b335eb8a6fe55d94_51_0.png)


    # # Bootstrap buttons


    Bootstrap provides a wide range of buttons that comes in a variety of colors and
    sizes. The core buttons offer a choice of five colors and four sizes. The color
    and size of a button is applied using its class attribute. The list of classes
    to set the size of the button is as follows:


    +   - `btn btn-default btn-xs`

    +   - `btn btn-default btn-sm`

    +   - `btn btn-default`

    +   - `btn btn-default btn-lg`'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# Using Bootstrap CSS and HTML Elements\n\nTo create four white/default buttons\
    \ ranging from extra small to large, you'll implement the following HTML markup:\n\
    \n```\n```html\n<div class=\"row\">\n    <!-- Standard button -->\n    <button\
    \ type=\"button\" class=\"btn btn-default btn-xs\">Default Extra Small</button>\n\
    \    <button type=\"button\" class=\"btn btn-default btn-sm\">Default Small</button>\n\
    \    <button type=\"button\" class=\"btn btn-default\">Default</button>\n    <button\
    \ type=\"button\" class=\"btn btn-default btn-lg\">Default Large</button>\n</div>\n\
    ```\n```\n\nButton colors are also specified by a class name. The following is\
    \ a list of available color class names:\n\n+   - `btn-default`\n+   - `btn-primary`\n\
    +   - `btn-success`\n+   - `btn-info`\n+   - `btn-warning`\n\nThe range of buttons\
    \ is illustrated in the following screenshot:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_52_0.png)"
  merge: -1
  img_proc: true
- pgno: 53
  md: "In the previous screenshot, the buttons' edges are square, not rounded as the\
    \ default Bootstrap bundles. This is because the example site is using a custom\
    \ Bootstrap style. You can download a number of different Bootstrap styles from\
    \ http://bootswatch.com/.\n\n# Form layout and elements\n\nForms make up a large\
    \ section of most line-of-business applications; and therefore, applying a uniform\
    \ style to all forms in your web application is not only visually pleasing but\
    \ also provides your users with a friendlier interface. Bootstrap provides a range\
    \ of CSS styles to enable you to create visually appealing forms.\n\n# Horizontal\
    \ forms\n\nThe default create and edit templates for ASP.NET MVC scaffolding generate\
    \ horizontal-styled Bootstrap forms. This is accomplished by automatically adding\
    \ the form-horizontal class name to the <form> element. In the following code\
    \ example, a horizontal login form is created using the Html.BeginForm helper\
    \ method; this form contains two textboxes and a submit button:\n\n```\n@using\
    \ (Html.BeginForm(\"Login\", \"Account\", FormMethod.Post, new {\n@class = \"\
    form-horizontal\", role = \"form\" }))\n{\n    <div class=\"form-group\">\n  \
    \      @Html.LabelFor(m => m.UserName, new { @class = \"col-md-2 control-label\"\
    \ })\n        <div class=\"col-md-10\">\n            @Html.TextBoxFor(m => m.UserName,\
    \ new { @class = \"form-control\" })\n            @Html.ValidationMessageFor(m\
    \ => m.UserName)\n        </div>\n    </div>\n    <div class=\"form-group\">\n\
    \        @Html.LabelFor(m => m.Password, new { @class = \"col-md-2 control-label\"\
    \ })\n        <div class=\"col-md-10\">\n            @Html.PasswordFor(m => m.Password,\
    \ new { @class = \"form-control\" })\n            @Html.ValidationMessageFor(m\
    \ => m.Password)\n        </div>\n    </div>\n}\n```"
  merge: -1
  img_proc: true
