- pgno: 120
  md: '# Creating T4 Templates to Scaffold Bootstrap Views


    Visual Studio 2013 already includes code generators for ASP.NET MVC and Web API
    projects, and using these built-in scaffolding templates can drastically reduce
    the amount of time you spend on creating standard views and controller actions.
    When adding a standard controller to an ASP.NET MVC project in Visual Studio 2013,
    you''re already using scaffolding, and this is indicated by the fact that the
    dialog window used to add a new controller''s caption is **Add Scaffold**:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_120_0.png)


    # T4 templates


    T4 stands for Text Template Transformation Toolkit, which is Microsoft''s template-based
    text-generation framework. T4 is a combination of control logic and text blocks,
    which can generate any type of text file, including C# or VB source files.


    The T4 code generator is built into Visual Studio and is used to generate the
    built-in ASP.NET MVC templates, including the standard MVC and Web API controller
    templates.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '> Oleg Sych wrote a number of very informative blog posts on how to use T4
    templates and how to get optimal results by using it in your own development project.
    To read more, you can visit his blog at `http://bit.ly/OlegSychT4`.


    Unfortunately, Visual Studio does not provide syntax highlighting or IntelliSense
    support when editing T4 templates, but there are free tools available that can
    add these features to Visual Studio for you.


    # T4 tools


    Since Visual Studio does not provide T4 IntelliSense by default, we''ll need to
    install a third-party extension to enable this functionality for us. Fortunately,
    there are two free alternatives available. These are as follows:


    +   - The Devart T4 editor for Visual Studio (`http://bit.ly/DevArtT4`)

    +   - The tangible T4 editor (`http://bit.ly/TangibleT4`)


    Both these extensions provide similar functionalities, but for the T4 examples
    in this book, we''ll use the tangible T4 editor.


    Another free extension that is vital in making the creation of T4 templates much
    easier is the **SideWaffle** extension for Visual Studio. SideWaffle will add
    a number of extremely-useful item templates to Visual Studio, which we''ll use
    to build our own ASP.NET MVC scaffolded views. You can download SideWaffle from
    `http://www.sidewaffle.com/`.


    > SideWaffle not only provides item templates for T4, but also offers a range
    of project and item templates as well as a host of very useful snippets. It is
    an actively-maintained open source project on GitHub and an indispensable tool
    for any .NET developer.


    # The T4 syntax


    T4 templates have a very specific syntax, which can appear somewhat daunting,
    but once you get used to it, it is relatively simple to understand and use. T4
    uses three distinct tags to indicate code blocks.'
  merge: -1
  img_proc: true
- pgno: 122
  md: "The first code block is <#= #> and is used to execute the code within the tag\
    \ and will return a text result. For example, in the following markup, the code\
    \ will return the value in the ViewName variable inside the T4 template:\n\n```\n\
    <#= ViewName #>\n```\n\nThe <# #> code block executes the code inside the tag\
    \ and returns a void result. For example, the following markup loops through every\
    \ item in a collection and produces the item's Total property followed by a carriage\
    \ return:\n\n```\n<#foreach(var item in Orders) { #>\n    <#= item.Total + Environment.NewLine\
    \ #>\n<# } #>\n```\n\nThe <#+ #> code block is used to define reusable methods,\
    \ which can be called from inside the T4 template. For example, the following\
    \ markup defines a method called TypeName and returns the full name of the object:\n\
    \n```\n<#+ public string Typename(obj) { return obj.GetType().FullName; } #>\n\
    ```\n\nTo use the method, you simply need to call it inside your template file,\
    \ as illustrated in the following code:\n\n```\n<#= Typename(myObj) #>\n```\n\n\
    # Customizing the generated code for controllers\n\nWhen adding a new controller\
    \ class to your ASP.NET MVC project, the Add New Scaffolded Item dialog is shown,\
    \ and you have a choice between three different types of controllers to add:\n\
    \n+   - MVC 5 Controller – Empty\n+   - MVC 5 Controller with read/write actions\n\
    +   - MVC 5 Controller with views, using Entity Framework"
  merge: -1
  img_proc: true
- pgno: 123
  md: 'Each of these items generates boilerplate code, which you can customize afterwards.
    However, let''s assume that all our projects'' controller classes need a constructor
    that accepts a parameter. Using the standard items, we would have to manually
    add the constructor for each controller in our project.


    Fortunately, we are able to override the generated output for the controllers,
    because in essence, they are nothing more than T4 templates.


