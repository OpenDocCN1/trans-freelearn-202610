- pgno: 21
  md: "# Bootstrap JavaScript files (the js folder)\n\nThe js folder contains two\
    \ files. All the Bootstrap plugins are contained in the bootstrap.js file. The\
    \ bootstrap.min.js file is simply a minified version of the aforementioned file.\
    \ Before including the file in your project, make sure that you have a reference\
    \ to the jQuery library because all Bootstrap plugins require jQuery.\n\nThe default\
    \ project template automatically adds the jQuery library to your project and creates\
    \ a bundle for it. The jQuery bundle will be included in your pages if you have\
    \ the following line of code inside your view:\n\n```\n@Scripts.Render(\"~/bundles/jquery\"\
    )\n```\n\n# Downloading the example code\n\nYou can download the example code\
    \ files for all Packt books you have purchased from your account at http://www.packtpub.com.\
    \ If you purchased this book elsewhere, you can visit http://www.packtpub.com/support\
    \ and register to have the files e-mailed directly to you.\n\n# The Bootstrap\
    \ folder structure\n\nThe unzipped folder structure for Bootstrap will look something\
    \ like the following screenshot:\n\n```\nbootstrap/\n├── css/\n│   ├── bootstrap.css\n\
    │   ├── bootstrap.min.css\n│   ├── bootstrap-theme.css\n│   └── bootstrap-theme.min.css\n\
    ├── js/\n│   ├── bootstrap.js\n│   └── bootstrap.min.js\n└── fonts/\n    ├── glyphicons-halflings-regular.eot\n\
    \    ├── glyphicons-halflings-regular.svg\n    ├── glyphicons-halflings-regular.ttf\n\
    \    └── glyphicons-halflings-regular.woff\n```"
  merge: -1
  img_proc: true
