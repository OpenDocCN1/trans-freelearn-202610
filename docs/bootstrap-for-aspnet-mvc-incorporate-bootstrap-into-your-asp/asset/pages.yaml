- pgno: 37
  md: "The StyleBundle object is used to add style sheets to a bundle and the ScriptBundle\
    \ object is used to add JavaScript files. The Add method of the BundleCollection\
    \ object accepts both types of objects. The StyleBundle and ScriptBundle objects\
    \ accept a string parameter, which specifies the virtual path of the files, and\
    \ you should therefore, use the Include method to specify the path to the files\
    \ you would like to include in the bundle.\n\n> Never include files with .min\
    \ in their names, for example, bootstrap.min.css or bootstrap.min.js in bundles.\
    \ The compiler will ignore these files as they are already minified.\n\n# Including\
    \ bundles in your ASP.NET layout\n\nTo include the bundles we created earlier\
    \ in our Layout file, perform the following steps:\n\n+   1. Open the _Layout.cshtml\
    \ file in the Shared folder and change its markup to reflect the following (changes\
    \ are highlighted):\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta\
    \ charset=\"utf-8\">\n    <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\"\
    >\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"\
    >\n    <title>@ViewBag.Title</title>\n    @Styles.Render(\"~/bootstrap/css\")\n\
    \    <!--[if lt IE 9]>\n    <script src=\"https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js\"\
    ></script>\n    <script src=\"https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js\"\
    ></script>\n    <![endif]-->\n</head>\n<body>\n    @RenderBody()\n    <script\
    \ src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js\"></script>\n\
    \    @Scripts.Render(\"~/bootstrap/js\")\n</body>\n```"
  merge: -1
  img_proc: true
- pgno: 38
  md: "+   2. If the Visual Studio HTML editor indicates that it cannot find the Scripts\
    \ or Styles objects (that is indicated by the words being highlighted), this means\
    \ a reference is missing from the Web.config file inside the Views folder.\n\n\
    +   3. To fix this, add a reference to System.Web.Optimization to the list of\
    \ namespaces in this Web.config file. Consider the following example:\n\n```\n\
    <namespaces>\n    <add namespace=\"System.Web.Mvc\" />\n    <add namespace=\"\
    System.Web.Mvc.Ajax\" />\n    <add namespace=\"System.Web.Mvc.Html\" />\n    <add\
    \ namespace=\"System.Web.Routing\" />\n    <add namespace=\"AdventureBootstrap\"\
    \ />\n    <add namespace=\"System.Web.Optimization\" />\n</namespaces>\n```\n\n\
    # Testing bundling and minification\n\nIn order to enable bundling and minification,\
    \ open the Web.config file inside the root of your project and change the debug\
    \ attribute of the compilation element to true as follows:\n\n```\n<system.web>\n\
    \    <compilation debug=\"true\" targetFramework=\"4.5\" />\n    <httpRuntime\
    \ targetFramework=\"4.5\" />\n</system.web>\n```\n\nThe same can be achieved by\
    \ setting the EnableOptimizations property of the BundleTable object to true.\
    \ This statement can either be added to the Global.asax file's Application_Start\
    \ method or to the RegisterBundles method of the BundleConfig class as follows:\n\
    \n```\nBundleTable.EnableOptimizations = true;\n```\n\nAfter you've added references\
    \ to the bundles inside your Layout file and set either the debug attribute or\
    \ the EnableOptimizations property to true, build and run your project. Once the\
    \ site is open in a browser, view its source. You should see a markup similar\
    \ to the following:\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta\
    \ charset=\"utf-8\">\n```"
  merge: -1
  img_proc: true
