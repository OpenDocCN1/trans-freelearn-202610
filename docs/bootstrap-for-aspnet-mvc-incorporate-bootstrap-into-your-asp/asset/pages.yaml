- pgno: 95
  md: "# # Tabs\n\nTabs provide an option to split your content into separate pages.\
    \ This is an ideal component when you have a particularly large form, which you\
    \ want to split up into a logical grouping. For example, when you're editing a\
    \ customer's record, you might want to split their contact details from their\
    \ address details, as illustrated in the following screenshot:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_95_0.png)\n\
    \nBootstrap tabs are divided into two parts. You first need to specify the tab\
    \ names and the ID of the corresponding `<div>` element to show when the user\
    \ clicks on the tab. This is done by creating a standard unordered list `<ul>`\
    \ element with the tab names as child list items `<li>`. The `<ul>` element's\
    \ class must be set to `nav nav-tabs` or `nav nav-pills`, as illustrated in the\
    \ following script:\n\n```\n```html\n<ul class=\"nav nav-tabs\">\n    <li class=\"\
    active\"><a href=\"#info\" data-toggle=\"tab\">Customer Info</a></li>\n    <li><a\
    \ href=\"#address\" data-toggle=\"tab\">Address</a></li>\n</ul>\n```\n```"
  merge: -1
  img_proc: true
- pgno: 96
  md: "You can use a tab or pill navigation by setting the <li> element's data-toggle\
    \ attribute to either tab or pill and setting the <ul> element's class to nav-pills.\
    \ The result will look like the following screenshot in your browser:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_96_0.png)\n\
    \nTo specify the content for the tabs, create a new <div> element and set its\
    \ class to tab-content. Create a <div> element for each tab inside the parent\
    \ <div> element and set each tab's <div> element's class to tab-pane as follows:\n\
    \n```\n<div class=\"tab-content well\">\n    <div class=\"tab-pane active\" id=\"\
    info\">\n        Info Tab Content goes here\n    </div>\n    <div class=\"tab-pane\"\
    \ id=\"address\">\n        Address Tab Content goes here\n    </div>\n</div>\n\
    ```\n\nIn the preceding markup, we created two tabs and set the active tab to\
    \ the info tab by setting its class to active."
  merge: -1
  img_proc: true
- pgno: 97
  md: "You can also activate a specific page using jQuery. To activate the address\
    \ tab as soon as the page loads, use the following code:\n\n```\n$(document).ready(function\
    \ () {\n  $('.nav-tabs a[href=\"#address\"]').tab('show');\n});\n```\n\n# Tooltips\n\
    \nBootstrap's tooltip plugin is an updated version of Jason Frame's jQuery.tipsy\
    \ plugin. Tooltips can be used to provide users with additional information labels\
    \ about specific content on your pages or provide insight into what input is expected\
    \ in form elements.\n\nTooltips can be used on a variety of elements; for example,\
    \ the following markup shows a tooltip when a user hovers over an anchor <a> element:\n\
    \n```\n<a data-toggle=\"tooltip\" data-placement=\"top\" data-original-title=\"\
    Welcome to the wonderful World of Grammar!\" href=\"#\">World of Grammar</a>\n\
    ```\n\nTo use a tooltip on any element, add a data-toggle=\"tooltip\" attribute\
    \ to it. You can specify the placement of the tooltip by setting the data-placement\
    \ attribute to one of the following values:\n\n+   - top\n+   - bottom\n+   -\
    \ left\n+   - right\n\nFinally, set the value of the data-original-title attribute\
    \ to specify what text should be shown inside the tooltip.\n\nOne caveat of tooltips\
    \ is that because of performance concerns, the data- API is opt-in, which means\
    \ you have to initialize the plugin manually. To do this, add the following JavaScript\
    \ to your page:\n\n```\n<script type=\"text/javascript\">\n  $(document).ready(function\
    \ () {\n    $('[data-toggle=\"tooltip\"]').tooltip();\n  });\n</script>\n```"
  merge: -1
  img_proc: true
