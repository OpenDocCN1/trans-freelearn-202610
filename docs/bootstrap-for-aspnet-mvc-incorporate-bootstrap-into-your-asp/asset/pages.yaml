    \ all the `@Html.LabelFor` methods.\n+   11. Lastly, we need to close all the\
    \ `<div>` elements that were added to the top of the template. Add three closing\
    \ `</div>` tags after the last `@Html.ActionList` line.\n\nWith the template markup\
    \ in place, we can create a new scaffolded view based on this by completing the\
