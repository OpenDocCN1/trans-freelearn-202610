  md: "In order to show the modal, we do not need to write any JavaScript. We can\
    \ simply add a data-toggle=\"modal\" attribute to the anchor or button element\
    \ that should show the modal when the user clicks on it, as illustrated in the\
    \ following code:\n\n```\n<a href=\"#\" data-toggle=\"modal\" data-target=\"#deleteConfirmationModal\"\
    >Delete</a>\n```\n\nTo indicate which modal to show, we specify the ID of the\
    \ modal inside the data-target attribute.\n\nThe result of the aforementioned\
    \ code will display a modal similar to the one illustrated in the following screenshot:\n\
    \n![](img/371b9a67300a03b7b335eb8a6fe55d94_94_0.png)\n\nYou also have the option\
    \ to not use the data- API to show the modal, using jQuery to show and hide the\
    \ modal. The following JavaScript shows the modal which ID is set to deleteConfirmationModal\
    \ when the page loads:\n\n```\n$(document).ready(function () {\n  $('#deleteConfirmationModal').modal('show');\n\
    });\n```\n\nYou can also use the same function in order to hide the modal:\n\n\
    ```\n$('#deleteConfirmationModal').modal('hide');\n```"
