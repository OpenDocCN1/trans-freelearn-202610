- pgno: 62
  md: '# Bootstrap image classes


    Images can be made responsive by setting their `class` attribute to `img-responsive`.
    This will scale the image in relation to its parent element by setting its maximum
    `width` to 100% and `height` to auto.


    You also have the option to shape images with either rounded corners, circles,
    or with an outer border. This is accomplished by setting the `<img>` element''s
    class to one of the following Bootstrap classes:


    +   - `img-rounded`

    +   - `img-circle`

    +   - `img-thumbnail`


    In the following screenshot, we''ve displayed a list of employees and their pictures.
    The list of employees is retrieved from a database and passed to the view:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_62_0.png)'
  merge: -1
  img_proc: true
- pgno: 63
  md: "The code that achieves the preceding result (and can be viewed in the accompanying\
    \ sample project) is as follows:\n\n```\n@model Northwind.Web.Models.EmployeeViewModel\
    \ []\n<div class=\"container\">\n    <div class=\"row\">\n        <h2>About Us.</h2>\n\
    \        <p>Northwind Traders are a premier supplier of various food products,</p>\n\
    \    </div>\n    <div class=\"row\">\n        <h3>Our Team</h3>\n        @foreach\
    \ (var item in Model)\n        {\n            <div class=\"col-md-4\">\n     \
    \           <img src=\"@Url.Content(\"~/Images/employees/\" + item.EmployeeID\
    \ + \".png\")\" alt=\"@item.FirstName @item.LastName\" class=\"img-circle img-responsive\"\
    >\n                <h3>\n                    @item.FirstName @item.LastName <small>@item.Title</small>\n\
    \                </h3>\n                <p>@item.Notes</p>\n            </div>\n\
    \        }\n    </div>\n</div>\n```\n\nIn this code, we looped through each employee\
    \ item in the model and rendered an <img> element using the EmployeeID property\
    \ as the filename. Each <img> element's class attribute is set to img-circle,\
    \ which will draw the image as a circle."
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Summary


    In this chapter, we''ve explored how to lay out various elements using the Bootstrap
    grid and form classes. We''ve also solved the problem of using the standard Bootstrap
    validation classes instead of the jQuery validation classes for form validation
    as well as streamlining the creation of form elements using ASP.NET''s editor
    templates.


    In the next chapter, we''ll explore the various Bootstrap components including
    the Bootstrap navigation bar, input groups, progress bars, and alerts and how
    to implement them in your ASP.NET MVC project.'
  merge: -1
