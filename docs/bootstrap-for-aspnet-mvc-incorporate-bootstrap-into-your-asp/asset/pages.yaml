    in ASP.NET MVC, web technologies, and MS Office development. He started his career
    in web development using classic ASP, Visual InterDev, HoTMetaL, and FrontPage.


    Pieter has over 15 years of experience in the IT industry and is also one of the
    people fortunate enough to have his hobby become his full-time profession. He
    is also a technology evangelist for Add-in Express (www.add-in-express.com), which
    focuses on tools for Microsoft Office integration.


    This is Pieter''s first foray into book writing although he has been blogging
