- pgno: 185
  md: '# Bootstrap Resources


    The Bootstrap community is a vibrant and vast one. The following sections, in
    no particular order, are a list of Bootstrap resources available on the Internet.


    # Themes


    The URLs for downloading free and premium HTML themes based on Bootstrap are listed
    in the following table:


    | URL | Description |

    |---|---|

    | http://startbootstrap.com/ | This URL provides free HTML starter templates and
    themes for Bootstrap. |

    | https://wrapbootstrap.com/ | This is a marketplace for premium themes and templates
    for Bootstrap. |

    | http://bit.ly/ThemeForestHtml | ThemeForest has over 5,000 premium HTML templates.
    Many of them are based on Bootstrap. |

    | http://www.prepbootstrap.com/ | This URL provides free Bootstrap themes, templates,
    and other widgets with complete code examples. |

    | http://bootstrapzero.com/ | This URL provides open source Bootstrap themes and
    templates. |

    | http://bootswatch.com/ | This URL provides free themes for Bootstrap. |'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Add-ons


    The URLs for additional add-ons, plugins, and components for Bootstrap are listed
    in the following table:


    | URL | Description |

    |---|---|

    | `http://bit.ly/FuelUX` | FuelUX provides additional controls and enhancements
    for Bootstrap such as date pickers, spinners, trees, and form wizards. |

    | `http://bit.ly/JasnyBootstrap` | Jasny Bootstrap provides some enhancements
    to existing components such as label buttons and anchored alerts. |

    | `http://bit.ly/BootstrapNotify` | Bootstrap notify makes it easier to display
    alert style notifications to your users. |

    | `http://bootstrapformhelpers.com/` | Bootstrap Form Helpers is a plugin to help
    enhance your forms. It includes color pickers, sliders, and so on. |

    | `http://www.bootstrap-switch.org/` | This add-on turn your checkboxes into iOS-style
    switch controls. |

    | `http://bit.ly/BSAppWiz` | This add-on adds multistep, wizard-like interfaces
    to your forms with the Bootstrap Application Wizard. |

    | `http://tableclothjs.com/` | This add-on makes your Bootstrap tables sortable
    and searchable using jQuery. |

    | `http://bit.ly/TypeAhead` | This add-on provides a plugin by Twitter. This also
    adds the autocomplete feature to your forms. |


    # Editors and generators


    The URLs for tools to help you design and build your Bootstrap site are listed
    in the following table:


    | URL | Description |

    |---|---|

    | `http://www.bootstrapbundle.com/` | This URL provides an ASP.NET MVC Bootstrap
    project and item templates for Visual Studio 2013. |

    | `http://www.layoutit.com/` | This URL provides the drag-and-drop interface builder
    for Bootstrap. |'
  merge: -1
  img_proc: true
