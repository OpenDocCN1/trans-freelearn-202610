  md: "To create fluent HTML helpers, complete the following steps:\n\n+   1. Create\
    \ a new subfolder called `Alerts` inside the `Helpers` folder in your project.\n\
    +   2. Add a new interface to the `Alerts` folder called `IAlertFluent`. The interface\
    \ should implement the `IHtmlString` interface.\n+   3. Add a new `IAlertFluent`\
    \ property called `Dismissible` to the interface. The code for the `IAlertFluent`\
    \ interface should represent the following:\n+   ```\n+   public interface IAlertFluent\
    \ : IHtmlString\n+   {\n+       IAlertFluent Dismissible(bool canDismiss = true);\n\
    +   }\n+   ```\n+   4. Next, add a new interface to the `Alerts` folder called\
    \ `IAlert`, and add four `IAlertFluent` properties called `Danger`, `Info`, `Success`,\
    \ and `Warning`. These four properties will be used to set the `Alert` style as\
    \ follows:\n+   ```\n+   public interface IAlert : IAlertFluent\n+   {\n+    \
    \   IAlertFluent Danger();\n+       IAlertFluent Info();\n+       IAlertFluent\
    \ Success();\n+       IAlertFluent Warning();\n+   }\n+   ```\n+   5. Next, we'll\
    \ need to add a class that implements the `IAlert` interface. Add a new class\
    \ called `Alert.cs` to the `Alerts` folder.\n+   6. Before we can implement the\
    \ methods on the `Alert` class, we need to create a class that will implement\
    \ the `IAlertFluent` interface. Now, add a new class called `AlertFluent.cs` to\
    \ the `Alerts` folder.\n+   7. The `IAlertFluent` interface only specifies one\
    \ method, so we'll implement it in the `AlertFluent` class and create a constructor\
    \ that accepts an `Alert` object as a parameter as follows:\n+   ```\n+   public\
    \ class AlertFluent : IAlertFluent\n+   {\n+       private readonly Alert _parent;\n\
    +   \n+       public AlertFluent(Alert parent)\n+       {\n+           _parent\
    \ = parent;\n+       }\n+   }\n+   ```"
  merge: -1
