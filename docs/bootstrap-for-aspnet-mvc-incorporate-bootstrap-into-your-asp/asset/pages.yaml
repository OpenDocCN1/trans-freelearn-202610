- pgno: 33
  md: '# # Adding Bootstrap files using NuGet


    So far we''ve created two ASP.NET MVC projects that use the Bootstrap frontend
    framework. The first included the Bootstrap assets by default because we created
    it with the standard ASP.NET MVC Visual Studio project template. The second, we
    created an empty ASP.NET MVC project and added the Bootstrap files manually.


    NuGet is a package manager for the .NET framework and can be used to automatically
    add files and references to your Visual Studio projects. A Bootstrap package exists
    on the NuGet gallery site, which enables you to automatically add the Bootstrap
    assets to your project.


    Bear in mind that though the Bootstrap NuGet package assumes that you want your
    Bootstrap files in the Content and Scripts folders and will create the folders
    and files as such, it will also automatically check whether you have the jQuery
    library referenced and if not, add it by design.


    > > NuGet is a package manager for the Microsoft development platform that makes
    it easy to add references to existing libraries. You can read more about it on
    https://www.nuget.org/.


    # ## Adding the Bootstrap NuGet package using the dialog


    One option for adding the Bootstrap NuGet package to your project is to use the
    **Manage NuGet Packages** dialog box. To access the **Manage NuGet Packages**
    dialog and add the Bootstrap NuGet package, perform the following steps:'
  merge: -1
  img_proc: true
- pgno: 34
  md: '+   1. Right-click on the **References** node in the **Solution Explorer**
    section and select **Manage NuGet Packages**. Click on the **Online** tab and
    type `bootstrap` in the search box and press *Enter*, as shown in the following
    screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_34_0.png)


    +   2. Click on the **Install** button to add the Bootstrap files to your project.


    # Adding the Bootstrap NuGet package using the Package Manager Console


    The second method of adding NuGet packages to your Visual Studio project is via
    the **Package Manager Console** and completing the following steps:


    +   1. Inside Visual Studio, from the **Tools** menu, navigate to **Library Package
    Manager | Package Manager Console**. This will open the **Package Manager Console**
    window.


    +   2. To install the Bootstrap NuGet packages, type `Install-Package bootstrap`,
    as shown in the following screenshot:'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/371b9a67300a03b7b335eb8a6fe55d94_35_0.png)


    3. This will create the Content, fonts, and Scripts folders and add the necessary
    Bootstrap files to each.


    # Improving your site performance with bundling and minification


    Bundling and minification is a feature in ASP.NET that allows you to increase
    the speed at which your site loads. This is accomplished by limiting the number
    of requests to CSS and JavaScript files your site needs to make by combining these
    types of files into one large file and removing all unnecessary characters, such
    as comments, white spaces, and new line characters from the files.


    > Most modern browsers have a limit of six concurrent connections per hostname.
    This means that if you reference more than six CSS or JavaScript files on a page,
    the browser will only download six files at a time and queue the rest. Limiting
    the number of CSS and JavaScript files is always a good idea.'
  merge: -1
  img_proc: true
