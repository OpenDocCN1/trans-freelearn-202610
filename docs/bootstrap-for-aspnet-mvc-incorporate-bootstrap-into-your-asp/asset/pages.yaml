- pgno: 13
  md: '# Preface


    Twitter Bootstrap, simply known as Bootstrap, is the leading open source CSS/HTML
    and JavaScript framework on the Internet. Shortly after its launch, it became
    the most popular project on GitHub. It became so popular that Microsoft announced
    at their Build 2013 conference that all the web app project templates in Visual
    Studio 2013 will use Twitter Bootstrap by default.


    One of the main reasons why Bootstrap is so prevalent is that it allows developers,
    many of whom are notoriously bad at user interface design, to build aesthetically
    pleasant-looking sites with a relatively small amount of effort. Bootstrap also
    offers a rich ecosystem of free and commercial templates, third-party components,
    tools, and an active and helpful community.


    Using CSS frameworks and Bootstrap in particular with ASP.NET MVC is a natural
    fit. Bootstrap takes care of the typography, form layouts, and user interface
    components, and allows the developer to focus on what they are good at, that is,
    writing code. This aspect is particularly valuable for smaller development companies
    that do not necessarily have an in-house designer. Bootstrap Version 3 introduced
    a mobile-first approach, meaning all sites built with Bootstrap will be automatically
    responsive and optimized to be displayed on devices with smaller screens.


    # What this book covers


    Bootstrap for ASP.NET MVC walks you through the process of creating a fully functioning
    ASP.NET MVC website, using Bootstrap for its layout and user interface.


    Chapter 1, Getting Started with ASP.NET MVC and Bootstrap, focuses on getting
    started with Bootstrap, from where to get the files, how to include them in your
    project, and takes a closer look at the default ASP.NET MVC project template.
    We''ll also look at the benefits of bundling and minification of CSS and JavaScript.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Chapter 2, Using Bootstrap CSS and HTML Elements, examines the various Bootstrap
    CSS and HTML elements, how to include them in your ASP.NET MVC project, and how
    to configure and use their various options.


    Chapter 3, Using Bootstrap Components, will be building on what we''ve learned
    in Chapter 2, Using Bootstrap CSS and HTML Elements. This chapter scrutinizes
    the different components such as navigation, alerts, progress bars, button groups,
    and badges.


    Chapter 4, Using Bootstrap JavaScript Plugins, illustrates the use of Bootstrap''s
    JavaScript plugins. We will be experimenting with modal dialogs, contextual dropdowns,
    tooltips, buttons, and UI components such as accordion and carousel.


    Chapter 5, Creating ASP.NET MVC Bootstrap Helpers, guides you through the process
    of reducing the amount of HTML needed to generate Bootstrap elements by creating
    ASP.NET MVC helper methods and classes.


    Chapter 6, Creating T4 Templates to Scaffold Bootstrap Views, moves on to the
    more advanced topic of creating T4 templates in order to generate Bootstrap-themed
    scaffolded views.


    Chapter 7, Converting a Bootstrap HTML Template into a Usable ASP.NET MVC Project,
    shows how we can convert an open source HTML template and make it ready to be
    used with ASP.NET MVC.


    Chapter 8, Using the jQuery DataTables Plugin with Bootstrap, demonstrates how
    to use the powerful jQuery DataTables plugin with Bootstrap and ASP.NET in order
    to show tabular data.


    Chapter 9, Making Things Easier with the TwitterBootstrapMVC Library, examines
    the TwitterBootstrapMVC library, which contains a host of prebuilt HTML helpers
    to make the inclusion of Bootstrap components in ASP.NET MVC easier.


    Appendix, Bootstrap Resources, provides a list of free Bootstrap resources, themes,
    and tools.


    # What you need for this book


    To get the most out of this book, you''ll need Visual Studio 2013 and a modern
    browser. All examples have been tested with Visual Studio 2013, Google Chrome,
    and Mozilla Firefox. This book will be beneficial to those with experience ranging
    from the entry level to the advanced level in ASP.NET MVC development, as well
    as limited experience in Bootstrap.'
  merge: -1
  img_proc: true
- pgno: 15
  md: "# Who this book is for\n\nThis book is for ASP.NET MVC developers who would\
    \ like to know how to incorporate Bootstrap into their projects. ASP.NET MVC developers\
    \ could also benefit from the chapters that cover advanced topics, such as creating\
    \ helpers and using the jQuery DataTables plugin. If you have limited experience\
    \ in ASP.NET MVC and Bootstrap, this book can serve as a primer to these technologies.\n\
    \n# Conventions\n\nIn this book, you will find a number of styles of text that\
    \ distinguish between different kinds of information. Here are some examples of\
    \ these styles, and an explanation of their meaning.\n\nCode words in text, database\
    \ table names, folder names, filenames, file extensions, pathnames, dummy URLs,\
    \ user input, and Twitter handles are shown as follows: \"We would only need to\
    \ include the bootstrap.css file into our project for the Bootstrap styles to\
    \ be applied to our pages.\"\n\nA block of code is set as follows:\n\n```\n<system.web>\n\
    \    <compilation debug=\"true\" targetFramework=\"4.5\" />\n    <httpRuntime\
    \ targetFramework=\"4.5\" />\n</system.web>\n```\n\nWhen we wish to draw your\
    \ attention to a particular part of a code block, the relevant lines or items\
    \ are set in bold:\n\n```\n<script src=\"https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js\"\
    ></script>\n<script src=\"/bootstrap/js?v=raqa-So7giLQpXYq5LQiW8D-yNoxOAJewB8VXtgFHFEl\"\
    ></script>\n</body>\n</html>\n```\n\nAny command-line input or output is written\
    \ as follows:\n\n```\nInstall-Package jquery.datatables\n```\n\nNew terms and\
    \ important words are shown in bold. Words that you see on the screen, in menus\
    \ or dialog boxes for example, appear in the text like this: \"Right-click on\
    \ the Controller folder in the Solution Explorer section and navigate to Add |\
    \ Controller....\""
