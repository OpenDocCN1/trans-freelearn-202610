  md: 'The result will look like the following screenshot in your browser:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_79_0.png)


    # Alerts


    The alert component is used to provide visual feedback to the user. This can be
    used to provide the user with either confirmation messages that a record has been
    saved, warning messages that an error occurred, or an information message based
    on a system event.


    Bootstrap provides four differently styled alerts. For instance, the following
    markup generates a green, blue, orange, and red alert box:


    ```

    ```html

    <div class="alert alert-success"><strong>Success. You have successfully saved
    the file.</strong></div>

    <div class="alert alert-info"><strong>Info. Something has just happened.</strong></div>

    <div class="alert alert-warning"><strong>Warning! The file size is too big.</strong></div>

    <div class="alert alert-danger"><strong>Danger! The file could not be saved.</strong></div>

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'The alert boxes should look similar to the following screenshot in your browser:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_80_0.png)


    A dismissible alert is an alert that can be closed by the user by clicking on
    a small X icon in its top right-hand corner. In order to create a dismissible
    alert, you can use the alert-dismissible class name as follows:


    ```

    <div class="alert alert-warning alert-Dismissible" role="alert">

    <button type="button" class="close" data-dismiss="alert"><span aria-hidden="true">&times;</span><span
    class="sr-only">Close</span></button>

    <strong>Alert!</strong> This is a dismissible alert.

    </div>

    ```


    > You can refer to this book''s accompanying sample project for an indication
    of how to display specifically styled alerts directly from your ASP.NET MVC controllers.
    These alerts are adapted from Matt Honeycutt''s example on GitHub: https://github.com/MattHoneycutt/Fail-Tracker.'
  merge: -1
  img_proc: true
- pgno: 81
  md: "# Progress bars\n\nProgress bars are a metaphor used with traditional desktop\
    \ as well as web development to provide visual feedback to a user on the progress\
    \ of a task or action. Bootstrap provides a number of differently styled progress\
    \ bars.\n\n# The basic progress bar\n\nThe basic Bootstrap progress bar displays\
    \ a plain blue-colored progress bar. Adding a <span> element with a class name\
    \ of sr-only is good practice in order to allow screen readers to read the progress\
    \ percentage. The following markup generates a basic progress bar with a heading:\n\
    \n```\n<h4>Basic Progressbar</h4>\n<div class=\"progress\">\n    <div class=\"\
    progress-bar\" role=\"progressbar\" aria-valuenow=\"80\" aria-valuemin=\"0\" aria-valuemax=\"\
    100\" style=\"width: 80%;\">\n        <span class=\"sr-only\">80% Complete</span>\n\
    \    </div>\n</div>\n```\n\nThe result of this markup is shown in the following\
    \ screenshot:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_81_0.png)\n\nYou can\
    \ also display an inline label for the progress bar by adding text inside its\
    \ <div> element:\n\n```\n<h4>Basic Progressbar with label</h4>\n<div class=\"\
    progress\">\n    <div id=\"progressbarTitle\" class=\"progress-bar\" role=\"progressbar\"\
    \ aria-valuenow=\"60\" aria-valuemin=\"0\" aria-valuemax=\"100\" style=\"width:\
    \ 60%;\">\n        60%\n    </div>\n</div>\n```"
  merge: -1
  img_proc: true
- pgno: 82
  md: 'The result of this code is shown in the following screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_82_0.png)


    # Contextual progress bars


    You can use the same button and alert style classes to generate differently colored
    progress bars. This is accomplished by setting the progress bar''s class name
    to one of the following:


    +   - `progress-bar-success`

    +   - `progress-bar-info`

    +   - `progress-bar-warning`

    +   - `progress-bar-danger`


    The result is illustrated in the following screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_82_1.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: "# Striped and animated progress bars\n\nTo generate progress bars with a gradient\
    \ striped effect, add the class name of progress-striped to the progress bar's\
    \ parent <div> element:\n\n```\n<h4>Striped Progressbar (Danger)</h4>\n<div class=\"\
    progress progress-striped\">\n    <div class=\"progress-bar progress-bar-danger\"\
    \ role=\"progressbar\" aria-valuenow=\"80\" aria-valuemin=\"0\" aria-valuemax=\"\
    100\" style=\"width: 80%\">\n        <span class=\"sr-only\">80% Complete (danger)</span>\n\
    \    </div>\n</div>\n```\n\nThis result is shown in the following screenshot:\n\
    \n![](img/371b9a67300a03b7b335eb8a6fe55d94_83_0.png)\n\nTo add an animated effect\
    \ that will give the impression that the stripes on the progress bar are moving,\
    \ simply add a class of active to its parent <div> element:\n\n```\n<div class=\"\
    progress progress-striped active\">\n    <div class=\"progress-bar progress-bar-danger\"\
    \ role=\"progressbar\" aria-valuenow=\"80\" aria-valuemin=\"0\" aria-valuemax=\"\
    100\" style=\"width: 80%\">\n        <span class=\"sr-only\">80% Complete (success)</span>\n\
    \    </div>\n</div>\n```\n\n# Dynamically updating the progress bar's percentage\n\
    \nA progress bar is only worth using when it actually gives feedback on the progress\
    \ of a specific task. To update the progress bar dynamically using ASP.NET MVC,\
    \ perform the following steps:\n\n+   1. Add the SignalR NuGet package to our\
    \ project by running the following command in the Visual Studio Package Manager\
    \ Console:\n+      Install-Package Microsoft.AspNet.SignalR"
  merge: -1
  img_proc: true
- pgno: 84
  md: "# Using Bootstrap Components\n\n> SignalR is a library for ASP.NET; this library\
    \ makes it very easy\n> to add real-time functionality and feedback to your applications.\n\
    > You can read more about it at www.signalr.net.\n\n+   2. Next, add a new folder\
    \ called `Hubs` to your project, and add a new class called `ProgressbarHub.cs`\
    \ to the folder. Change its code to the following code:\n\n```\nusing System.Threading;\n\
    using Microsoft.AspNet.SignalR;\n\nnamespace Northwind.Web.Hubs\n{\n    public\
    \ class ProgressbarHub : Hub\n    {\n        public void SendProgress()\n    \
    \    {\n            for (int i = 0; i <= 100; i++)\n            {\n          \
    \      Thread.Sleep(50);\n                Clients.Caller.sendMessage(i + \"%\"\
    );\n            }\n        }\n    }\n}\n```\n\n+   3. In the preceding code, our\
    \ class inherits from the SignalR Hub class and contains a single method called\
    \ `SendProgress`, which will increment a variable and send the value to any SignalR\
    \ clients using the `sendMessage` method.\n\n+   4. Next, we add a reference to\
    \ the SignalR virtual path. Open the `_Layout.cshtml` file, and add the following\
    \ line to the bottom of the file:\n\n```\n<script src=\"~/signalr/hubs\"></script>\n\
    ```\n\n+   5. We'll also add a reference to the SignalR JavaScript library in\
    \ our existing bundles. Open the `BundleConfig.cs` file located in the `App_Start`\
    \ folder, and change the jquery bundle to include the SignalR library as follows:\n\
    \n```\nbundles.Add(new ScriptBundle(\"~/bundles/jquery\").Include(\n    \"~/Scripts/jquery-{version}.js\"\
    ,\n    \"~/Scripts/jquery.signalR-2.0.3.js\"));\n```"
  merge: -1
  img_proc: true
- pgno: 85
  md: "6. Finally, on the page where we have our progress bars, add the following\
    \ script inside the Scripts section:\n\n```\n@section scripts\n{\n    <script\
    \ type=\"text/javascript\" language=\"javascript\">\n        $(\"#start\").click(function\
    \ () {\n            $(\".progress-bar\").width('0%');\n            var progressNotifier\
    \ = $.connection.progressbarHub;\n            progressNotifier.client.sendMessage\
    \ = function\n            (message) {\n                updateProgress(message);\n\
    \            };\n\n            $.connection.hub.start().done(function () {\n \
    \               progressNotifier.server.sendProgress();\n            });\n   \
    \     });\n\n        function updateProgress(message) {\n            $(\".progress-bar\"\
    ).width(message);\n            $(\"#progressbarTitle\").html(message + ' Complete');\n\
    \        }\n    </script>\n}\n```\n\nThe preceding code will be executed when\
    \ the user clicks on a button with an ID of start. It will first set all the progress\
    \ bars on the page's width to 0 and initialize a connection to the server. We\
    \ then set the function name that will be called from the server side. In this\
    \ scenario, the JavaScript function's name is updateProgress.\n\nFinally, we establish\
    \ a connection to the server and start the server-side operation. As you can see,\
    \ we invoked the sendProgress function—this is the name of the method declared\
    \ inside the ProgressbarHub class.\n\nAs a result of the code, you will see that\
    \ all the progress bars on the page will increase their values from 0 to 100."
  merge: -1
  img_proc: true
