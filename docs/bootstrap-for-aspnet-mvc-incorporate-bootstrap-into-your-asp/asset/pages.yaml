- pgno: 28
  md: '# Adding the Bootstrap fonts


    Add the required Bootstrap fonts by performing the following steps:


    +   1. As with the style sheets, create a new folder called `fonts`.

    +   2. Next, browse to the location to where you''ve extracted the Bootstrap download
    and add all the files from the `fonts` folder to your `fonts` folder in Visual
    Studio.

    +   3. There should be four files in total, each named `glyphicons-halflings-regular`
    but with the following different file extensions:

    +      - `.eot`

    +      - `.svg`

    +      - `.ttf`

    +      - `.woff`


    # Adding the Bootstrap JavaScript files


    The final Bootstrap file we''ll need is `bootstrap.js`. To add it, perform the
    following steps:


    +   1. Before adding the `bootstrap.js` file to your Visual Studio project, create
    a new folder called `js`.

    +   2. Add the `bootstrap.js` file to this folder.

    +   3. Once completed, the project layout should look similar to the following
    screenshot in the Visual Studio''s Solution Explorer:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: "# # Creating the site Layout file\n\nTo maintain a persistent look across our\
    \ site's pages, we'll use a Layout file. This layout file will use the basic Bootstrap\
    \ HTML template at first and we'll build onto it as we progress throughout the\
    \ book. To create this file, complete the following steps:\n\n+   1. Create a\
    \ new Layout file by right-clicking on the Views folder in the Visual Studio's\
    \ **Solution Explorer** and navigate to **Add | New Folder**. Name the new folder\
    \ Shared.\n+   \n+   2. Next, right-click on the Shared folder and navigate to\
    \ **Add | New Item...** Select the **MVC 5 Layout Page (Razor)** item template,\
    \ name the new item `_Layout.cshtml` and click on **Add**, as shown in the following\
    \ screenshot:\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_29_0.png)\n\n+   3.\
    \ After the new file is added to you project, open it and replace its contents\
    \ with the following HTML markup:\n\n```\n```html\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n    <meta charset=\"utf-8\">\n```\n```"
  merge: -1
  img_proc: true
- pgno: 30
  md: '```

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width,

    initial-scale=1">

    <title>@ViewBag.Title</title>

    <!-- Bootstrap -->

    <link href="@Url.Content("~/css/bootstrap.css")" rel="stylesheet">

    <!--[if lt IE 9]>

    <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>

    <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>

    <![endif]-->

    </head>

    <body>

    @RenderBody()

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.0/jquery.min.js"></script>

    <script src="@Url.Content("~/js/bootstrap.js")"></script>

    </body>

    </html>

    ```


    In the preceding markup, we set the viewport''s width property to the device''s
    width and the initial-scale value to 1. This will cause our site to adapt to the
    screen size of the device the user is viewing it from.


    Next, we reference the Bootstrap style sheet by using the Url.Content helper method.
    This helper method converts a virtual or relative path to an absolute path, making
    sure that when the web page is opened, the style sheet will be loaded correctly.


    We then check if the browser accessing the site is Internet Explorer 9 or earlier;
    if it is, we include the HTML5shiv workaround that enables styling of HTML5 elements
    in Internet Explorer Version 9 and earlier. We also include the version of the
    Respond JS library suitable for versions of IE9 and earlier.


    Just before the closing <body> tag of the file, we include the jQuery library
    and the bootstrap JavaScript library.


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_30_0.png)


    > Note that the HTML5shiv workaround, Respond JS, and jQuery files are loaded
    from a Content Delivery Network (CDN). This is a good approach to use when referencing
    to most of the widely used JavaScript libraries. This should allow your site to
    load faster if the user has already visited a site, which uses the same library
    from the same CDN, because the library will be cached in their browser.'
  merge: -1
  img_proc: true
