- pgno: 141
  md: '# Converting a Bootstrap

    HTML Template into a

    Usable ASP.NET

    MVC Project


    One of the major benefits of using Bootstrap is the wide variety of resources
    available on the Internet. The web development community embraced Bootstrap, and
    you’ll find tons of valuable templates, snippets, and advice on using Bootstrap.


    By combining a predesigned Bootstrap template and ASP.NET MVC, you can save a
    lot of time without having to worry about site layout or design.


    In this chapter, we will cover the following topics:


    +   - Why we use prebuilt HTML templates and how they will save time

    +   - Building the master layout

    +   - Adding specific page views

    +   - Including charts in your views'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Working with prebuilt HTML templates


    It is a well-known fact that most developers are not necessarily good designers.
    We prefer to work on the backend, building great-performing and intelligent software,
    and sometimes, we tend to think of the user interface as an afterthought.


    By using a predesigned HTML Bootstrap template, we can give our users an intuitive
    and well-designed user interface that was designed by a professional designer.
    If the design was based on Bootstrap, the developer is already familiar with most
    of the CSS class names, components, and plugins, and does not have to relearn
    anything.


    The Web offers an assortment of free and premium Bootstrap templates. ThemeForest
    (www.themeforest.net) provides a mind-boggling array of different premium site
    styles and designs.


    For our example in this chapter, we''ll use the free SB Admin 2 template designed
    by Start Bootstrap (www.startbootstrap.com). The SB Admin 2 template is an admin
    theme that uses Bootstrap 3 and is ideal for a backend administration or more
    complex style web application. The theme looks like the following screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_142_0.png)'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'Before we can build an ASP.NET MVC site with the template, we need to download
    the source files by completing the following steps:


    +   1. Navigate to `http://startbootstrap.com/sb-admin-v2` and click on the **Download**
    button to download a zip archive that contains all the necessary HTML, CSS, and
    JavaScript files.


    +   2. Extract the files to a folder on your local hard drive; you''ll notice
    that the archive contains the familiar Bootstrap folders:

    +      - `css`

    +      - `font-awesome`

    +      - `fonts`

    +      - `js`


    +   3. The archive also contains a number of HTML files that illustrate various
    page and component layouts of the template, as shown in the following screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_143_0.png)'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Creating the ASP.NET MVC project


    To create a new ASP.NET MVC project, perform the following steps:


    +   1. In Visual Studio, create a new **ASP.NET Web Application** project, as
    shown in the following screenshot:


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_144_0.png)


    +   2. In the **New ASP.NET Project** dialog, select the **Empty** template, check
    the **MVC** checkbox, and click on the **OK** button.


    ![](img/371b9a67300a03b7b335eb8a6fe55d94_144_1.png)'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   3. Visual Studio will create a default empty MVC project. Right-click on
    the project name and navigate to Add | New Folder. Create the following four folders:

    +       - css

    +       - font-awesome

    +       - fonts

    +       - js


    +   4. Add the following .css files from the SB Admin source css folder to the
    css folder inside your project:

    +       - bootstrap.css

    +       - sb-admin.css


    5. Add the font-awesome.css file inside the SB Admin source''s font-awesome\css
    folder to the css folder in your project.


    6. Add all the files inside the SB Admin source''s fonts and font-awesome\fonts
    folder to the fonts folder inside your project.


    +   7. Add the following files from the SB Admin source''s js folder to the js
    folder in your project:

    +       - bootstrap.js

    +       - sb-admin.js


    # Creating the master layout


    We''ve added the CSS, JavaScript, and Font files needed to create the master layout
    file for our project. Next, we need to create a home controller as well as a master
    layout file. To do this, complete the following steps:


    +   1. Right-click on the Controllers folder and navigate to Add | Controller....

    +   2. Select MVC 5 Controller - Empty from the Add Scaffold dialog window and
    click on Add.'
  merge: -1
  img_proc: true
- pgno: 146
  md: "3. Enter HomeController in the Controller name textbox in the Add Controller\
    \ dialog window, and click on Add.\n\n![](img/371b9a67300a03b7b335eb8a6fe55d94_146_0.png)\n\
    \n4. Next, right-click on the Views folder in your project and navigate to Add\
    \ | New Folder. Name the folder Shared.\n\n5. Right-click on the newly-created\
    \ Shared folder and navigate to Add | MVC 5 Layout Page (Razor).\n\n6. In the\
