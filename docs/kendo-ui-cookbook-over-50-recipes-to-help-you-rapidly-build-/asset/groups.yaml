    \ km-ios7 km-7 km-m0 km-web km-black-status-bar km-vertical km-widget km-pane\"\
    \ data-role=\"pane\" style=\"\">\n```\n\nNotice the km-on-ios and km-ios7 class\
    \ added to the body tag. If you view the same page on an Android device, it would\
    \ be rendered differently.\n\n![](img/2a66507445090790d34dc5588b56b24c_127_0.png)\n\
    \nAgain, the framework determines the user agent and adds CSS classes to the body\
    \ tag. In this case, it would be as shown in the following code snippet:\n\n```html\n\
    <body class=\"km-on-android km-android km-4 km-m0 km-web km-black-status-bar km-vertical\
    \ km-widget km-pane\" data-role=\"pane\" style=\"\">\n```\n\nHere, the km-on-android\
    \ and km-android classes are added.\n\n### There's more...\n\nThe Mobile framework\
    \ renders the application based on the device it is accessed from. However, in\
    \ scenarios where you want to customize the layout for a given platform, you can\
    \ specify the data-platform attribute. For example, you can specify data-platform\
    \ as the iOS for the previous layout and add another layout to the page with its\
    \ data-platform attribute set to android:\n\n"
