    \ 检索。然后将内容与 kendo.template 函数一起用于生成标记。然后通过将内容附加到无序列表中，使用 $('ul.listContainer').append(result)\
    \ 将其插入页面。\n\n> 此处用于编写模板的 script 标签的 type 为 text/x-kendo-template。这是在客户端实现模板的常见方式。浏览器会简单地忽略其不认识\
    \ type 的 script 标签。\n\n# 使用模型 - 视图 - 视图模型 (MVVM) 模式在视图元素和 JavaScript 对象之间创建双向绑定\n\
    \n大多数应用程序中使用了各种架构模式。三个非常重要的架构模式如下：\n\n- 模型 - 视图 - 控制器 (MVC)\n- 模型 - 视图 - 演示器 (MVP)\n\
    - 模型 - 视图 - 视图模型 (MVVM)\n\n这些模式广泛用于构建桌面和服务器端应用程序。近年来，这些模式也已应用于客户端应用程序。AngularJS、BackboneJS\
    \ 和 EmberJS 等框架提供了可随时用于构建遵循这些模式之一的应用程序的组件。前面提到的所有三种模式都试图将用户界面的开发与业务逻辑的开发分开。\n\n\
    **模型 - 视图 - 视图模型 (MVVM)** 模式是一种架构模式，基于 MVC 和 MVP。在这里，模型层表示特定于领域的数据。示例应用程序将包括银行账号、持卡人姓名、余额等。模型层表示需要格式化以供\
    \ `View` 使用的原始数据。`View` 层使用模型提供的数据并按要求格式化。另一方面，应用程序的行为或业务逻辑被封装在名为 `ViewModel`\
    \ 的层中。\n\n有几种框架，例如 KnockoutJS、KnockbackJS 和 Kendo UI，实现了 MVVM 模式。在 Kendo UI 中，MVVM\
    \ 模式是应用程序框架的核心。该框架提供 API，使用这些 API 可以完成各种组件，例如模型、`ViewModel` 和数据绑定（将标记绑定到 `ViewModel`\
    \ 对象）。\n\n# 操作方法...\n\n为了说明 Kendo UI 中如何实现 MVVM 模式，让我们看一个非常简单的示例，其中表单元素绑定到 `ViewModel`\
    \ 对象。在此示例中，`ViewModel` 对象将定义模型数据以及元素之一的行为：\n\n```\n<form id=\"testView\">\n  Firstname:\
    \ <input id=\"firstName\" type=\"text\"\ndata-bind=\"value: firstName\">\n<br/>\n\
    Lastname: <input id=\"lastName\"\ntype=\"text\"\ndata-bind=\"value: lastName\"\
    >\n<br/>\nFullname: <input id=\"fullName\"\ntype=\"text\"\ndata-bind=\"value:\
    \ fullName\"\nreadonly>\n<br/>\n<input type=\"submit\">\n</form>\n```\n\n在前面的代码片段中，创建了一个带有\
    \ id 属性 testview 的表单，包含三个输入元素（文本框）。请注意这些输入元素中的 data-bind 属性。data-bind 属性用于指定视图元素和\
    \ ViewModel 对象之间的绑定。\n\n这里，第一个输入元素将 data-bind 属性的值指定为 value: firstName。这表明输入元素的值绑定到\
    \ firstName 模型属性。现在让我们定义 ViewModel，它封装了模型数据和行为：\n\n```\nvar viewModel = kendo.observable({\n\
    firstName: \"Sagar\",\nlastName: \"Ganatra\",\nfullName: function() {\nreturn\
    \ this.get(\"firstName\") +\n' ' + this.get(\"lastName\");\n}\n});\n```\n\n使用\
    \ kendo 对象上的 Observable 接口创建 ViewModel 对象。在此示例中，ViewModel 对象包含 firstName、lastName\
    \ 和 fullName 属性。请注意，虽然 firstName 和 lastName 是字符串类型，但 fullName 属性是一个函数，它通过连接 firstName\
    \ 和 lastName 返回一个字符串。\n\n现在我们有了标记和 ViewModel，它们应该相互绑定。bind 方法用于将视图组件绑定到 ViewModel：\n\
    \n```\nkendo.bind($('form#testView'), viewModel);\n```\n\nbind 函数的第一个参数是通过 $('form#testView')\
    \ 引用的视图组件，第二个参数是 ViewModel 对象 viewModel。一旦视图和 ViewModel 绑定，对模型所做的任何更改都将更新视图，用户所做的任何更改都将反映在模型中。\n\
    \n# 工作原理...\n\n当你执行前面提到的代码片段时，带有模型中提到的值的表单元素将被填充，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_25_0.png)\n\
    \n请注意，在标记中，FullName 的最后一个输入元素是只读的。它绑定到 fullName 模型属性，该属性是一个函数，返回由 firstName 和\
    \ lastName 连接的字符串。当你更改 firstName 或 lastName 的值时，fullName 模型也会更新，并且相同内容会反映在 View\
    \ 类中。\n\n![](img/2a66507445090790d34dc5588b56b24c_25_1.png)\n\n在前面的屏幕截图中，当 Firstname\
    \ 输入元素的值更改时，Fullname 属性的值也会更新。请注意，模型属性在视图组件上的 blur 事件时更新。\n\n# 更多...\n\n在前面的屏幕截图中，我们看到了如何使用数据绑定来设置表单中输入元素的值。除了设置页面中某些元素的值之外，数据绑定还可以用于设置属性值\
    \ (attr)、设置 HTML 内容 (html)、隐藏或显示页面中的元素 (visible 和 invisible) 等等。\n\n"
