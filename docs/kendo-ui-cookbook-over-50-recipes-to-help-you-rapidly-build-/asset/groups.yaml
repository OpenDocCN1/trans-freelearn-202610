  - "[PAGE 220]\n\n# # Generating a QR code image to represent a URL, e-mail, telephone,\
    \ and geographic location\n\nA **Quick Response code (QR code)** is generally\
    \ used to efficiently store data by encoding it. It uses ISO_8859_1 as the encoding\
    \ method by default to store data. The generated code consists of black modules\
    \ (square dots) arranged in a square grid on a white background. This code can\
    \ then be read by a camera and then processed by an application.\n\nIn this recipe,\
    \ we will see how various forms of data such as URLs, e-mail addresses, telephone\
    \ numbers, and geographic locations can be stored in a QR code.\n\n# ## How to\
    \ do it...\n\nTo generate a QR code, invoke the `kendoQRCode` function on the\
    \ DOM element:\n\n```\n```\n$(\"#chart\").kendoQRCode({\n    value: 'http://www.kendoui.com'\n\
    });\n```\n```\n\nIn the previous example, the `http://www.kendoui.com` URL is\
    \ specified. This value will be encoded using ISO_8859_1 and represented in a\
    \ square grid. When you scan the QR code, the value stored in it is identified.\
    \ Since the value is prefixed with the protocol name, `http://`, the value is\
    \ recognized as a URL. Similarly, an e-mail address should be prefixed with `mailto:`,\
    \ a telephone number with `tel`, and a geolocation with `geo` followed by the\
    \ latitude and longitude information. A geo location can be encoded in the following\
    \ way:\n\n```\n```\n$(\"#chart\").kendoQRCode({\n    value: 'geo: 12.9667, 77.5667,\
    \ 100'\n});\n```\n```\n\nBy default, the color of the QR code is black and is\
    \ drawn on a white background. This can be changed by specifying the `color` and\
    \ `background` attributes:\n\n```\n```\n$(\"#chart\").kendoQRCode({\n    value:\
    \ 'geo: 12.9667, 77.5667, 100',\n    color: 'red',\n    background: 'yellow'\n\
    });\n```\n```"
  - "[PAGE 221]\n\n# # How it works...\n\nWhen you render the page, you will see a\
    \ square grid that shows you the dots and lines that represent the QR code for\
    \ the URL.\n\n![](img/2a66507445090790d34dc5588b56b24c_221_0.png)\n\nWhen you\
    \ change the value to the geolocation and specify the color and background attributes,\
    \ the generated QR code is shown as follows:\n\n![](img/2a66507445090790d34dc5588b56b24c_221_1.png)\n\
    \n# # There's more...\n\nA QR code has an error correction capability that allows\
    \ you to restore data if the code is damaged or is dirty. There are four error\
    \ correction levels, namely, L, M, Q, and H, that can be applied to a QR code.\
    \ Each of these levels indicate the percentage of data that can be recovered,\
    \ that is, L recovers 7 percent data, M recovers 15 percent, Q recovers 25 percent\
    \ data, and H recovers 30 percent. When initializing a QR code, one can change\
    \ the error correction level by setting the errorCorrection attribute:\n\n```\n\
    $(\"#chart\").kendoQRCode({\n    value: 'geo: 12.9667, 77.5667, 100',\n    errorCorrection:\
    \ 'Q'\n});\n```\n\nIn the previous example, the errorCorrection attribute is set\
    \ to Q, and it is used to encode the value."
  - "[PAGE 222]\n\n# # Creating flow diagrams using Kendo Diagram\n\nAdding workflow\
    \ diagrams or hierarchical structure to a web page is now made easy with\nthe\
    \ introduction of diagrams in the Kendo UI library. In this recipe, we will build\
    \ a flowchart\ndiagram by creating shapes and then we will connect those with\
    \ connectors. The library also\nprovides a set of layouts that can be used to\
    \ represent a hierarchical or tree-like structure.\n\n# ## How to do it...\n\n\
    A flowchart is used to represent steps in an algorithm; these steps are shown\
    \ as shapes\n(rectangles and circles). The connectors are then used to connect\
    \ the shapes and describe\nthe flow. A diagram in Kendo UI is created by invoking\
    \ the kendoDiagram function on the\nselected DOM node:\n\n```\n```\nvar diagram\
    \ = $(\"#chart\").kendoDiagram({\n connectionDefaults: {\n  stroke: {\n   color:\
    \ '#F00'\n  },\n  startCap: 'FilledCircle',\n  endCap: 'ArrowEnd',\n }\n}).getKendoDiagram();\n\
    ```\n```\n\nIn the preceding code snippet, an empty diagram is created, with some\
    \ default attributes for\nconnections specified. A connection is used to connect\
    \ two or more shapes in the diagram.\nThe connectionDefaults option specifies\
    \ the color of the stroke to be applied; the\nstartCap and endCap options are\
    \ used to specify the decoration to be applied. In this case,\nthe startCap option\
    \ has the value FilledCircle, which will show you a circle at the start\nof the\
    \ connection. The other value that can be assigned to startCap is ArrowStart.\
    \ This will\nadd an arrow directed towards the shape. The endCap option has its\
    \ value set to ArrowEnd.\nIn this example, the shape from which the connection\
    \ is initiated will have a filled circle attached\nto it, and an arrow is shown,\
    \ which is directed towards the second shape.\n\nThe getKendoDiagram function\
    \ will return an instance of the diagram once it's initialized.\nThe diagram is\
    \ like a canvas on which you can add several shapes and also connect them."
