  - "[PAGE 44]\n\n# # How to do it...\n\nTo enable the sort by column feature, set\
    \ the sortable configuration option to true. This will make all the columns in\
    \ the Grid available for sorting. If you want some of the columns in the Grid\
    \ to not be available for sorting, then you can add the same property, sortable,\
    \ with a false value at the column level as well:\n\n```\n$(\"#grid\").kendoGrid({\n\
    \    columns: [\n    {\n    field : 'movieName',\n    title : 'Movie',\n    sortable:\
    \ false,\n    },\n    {\n    field : 'year',\n    title : 'Year'\n    },\n   \
    \ {\n    field : 'rating',\n    title : 'Rating'\n    }\n    ],\n    dataSource:\
    \ {\n    transport: {\n    read: 'http://localhost/kendo/code/chapter2/remote.json'\n\
    \    }\n    },\n    sortable: true\n    });\n```\n\nHere, by adding sortable as\
    \ true, all the columns in the Grid will be available for sorting. At the column\
    \ level, for the movieName field, the sortable option is set to false. This will\
    \ disable the sorting functionality on the first column. Also, note that adding\
    \ the sortable option for each column is not required since this is specified\
    \ at the Grid level.\n\nIn many scenarios, you would like the Grid columns to\
    \ be sorted by multiple columns. In our example, the Grid can be sorted by year\
    \ first and then by rating. To make this option available, set the option mode\
    \ as multiple:\n\n```\nsortable: {\n    mode: 'multiple'\n    }\n```\n\nBy default,\
    \ the value for mode is single, that is, the columns will be sorted based on the\
    \ selected column."
  - '[PAGE 45]


    # # How it works...


    When you render the Grid with the sortable mode set to either single or multiple,
    the Grid is shown as it is. However, when you hover over a sortable column, the
    cursor changes to a pointer and when you click on it, the Grid gets sorted by
    the selected column. In the single mode, the Grid is sorted based on the selected
    column, as shown in the following screenshot:


    | Movie | Year | Rating * |

    |---|---|---|

    | Pulp Fiction | 1994 | 8.9 |

    | The Good, the Bad and the Ugly | 1966 | 8.9 |

    | The Godfather - Part 2 | 1974 | 9 |

    | The Shawshank Redemption | 1994 | 9.2 |

    | The Godfather | 1972 | 9.2 |


    Here, the Grid is sorted by the third column, Rating; an upward arrow indicates
    that the Grid is sorted in the ascending order. Based on this column, the data
    in the Grid is sorted.


    Now, let''s take a look at an example where the sortable mode is set to multiple.
    As mentioned earlier, this mode allows users to sort by multiple columns. This
    example allows the columns in the Grid to be sorted by the first selected column
    and then by the second selected column.


    | Movie | Year * | Rating * |

    |---|---|---|

    | The Shawshank Redemption | 1994 | 9.2 |

    | Pulp Fiction | 1994 | 8.9 |

    | The Godfather - Part 2 | 1974 | 9 |

    | The Godfather | 1972 | 9.2 |

    | The Good, the Bad and the Ugly | 1966 | 8.9 |'
  - '[PAGE 46]


    Here, the Grid is sorted by the second column, Year, first and then by the third
    column, Rating. A downward arrow indicates that the column is sorted in the descending
    order. Here, the Grid is sorted by listing the recent movies that have high ratings.


    # # Using filters to display data that matches certain criteria in the Grid


    Similar to sorting columns in a Grid, you can update the Grid content by applying
    a filter. By applying a filter on the column, users will be able to search relevant
    data in the Grid that matches some criteria.


    # ## How to do it...


    To make the columns in the Grid filterable, set the configuration option, `filterable`,
    to `true`, as shown in the following line of code. Similar to the `sortable` option,
    all columns in the Grid will be available for filtering by default. If you want
    some of the columns to not be available for filtering, then set `filterable` as
    `false` under columns.


    ```

    ```

    filterable: true

    ```

    ```


    # ## How it works...


    When you mark the columns for filtering, you will see a **filter** icon for each
    of the columns in the Grid.


    | Movie                 |   Year |   Rating |

    |-----------------------|-------:|---------:|

    | The Shawshank Redemption |   1994 |      9.2 |

    | The Godfather         |   1972 |      9.2 |

    | The Godfather - Part 2 |   1974 |      9   |

    | Pulp Fiction          |   1994 |      8.9 |

    | The Good, the Bad and the Ugly |   1966 |      8.9 |'
  - '[PAGE 47]


    # # The Kendo UI Grid


    When you click on it, you will be presented with a set of options that will allow
    you to get filtered data.


    | Movie | Year | Rating |

    |---|---|---|

    | The Shawshank Redemption | Show items with value that | 9.2 |

    | The Godfather | Is equal to | 9.2 |

    | The Godfather - Part 2 | Godfather | 9 |

    | Pulp Fiction | And | 8.9 |

    | The Good, the Bad and the Ugly | Is equal to | 8.9 |

    | | Filter | Clear |


    By default, users will be presented with two conditions to enter in the search
    criteria. In this example, the user has selected **contain** from the dropdown
    and specified the **Godfather** text. On clicking on the **Filter** button, the
    Grid will be updated to show those movies that contain the name **Godfather**.
    In this example, two rows will be shown, as shown in the following screenshot:


    | Movie | Year | Rating |

    |---|---|---|

    | The Godfather | 1972 | 9.2 |

    | The Godfather - Part 2 | 1974 | 9 |


    After applying the filter, you will see that the Grid gets updated and lists only
    two rows. The column''s **filter** icon now has a white background, which indicates
    that a filter has been applied on the column. To clear the filter, click on the
    same **filter** icon and select the **Clear** option. This will clear the filter
    and show the entire Grid. When applying a filter, apart from specifying the **contains**
    condition, a user will have options to specify it as **Is equal to**, **Is not
    equal to**, **Starts with**, **Does not contain**, and **Ends with**.


    Now, when you try to apply a filter on the second column, that is, `Year`, you
