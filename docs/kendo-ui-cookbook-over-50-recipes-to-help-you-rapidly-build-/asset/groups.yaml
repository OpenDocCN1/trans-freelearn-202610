    : true\n    },\n    {\n        \"categoryId\": 2,\n        \"categoryName\": \"\
    Artists\",\n        \"hasSubCategories\": true\n    },\n    {\n        \"categoryId\"\
    : 3,\n        \"categoryName\": \"Songs\",\n        \"hasSubCategories\": true\n\
    \    },\n    {\n        \"categoryId\": 4,\n        \"categoryName\": \"Playlists\"\
    ,\n        \"hasSubCategories\": true\n    }\n]\n```\n\nThe preceding JSON response\
    \ from the service returns four records and these are top-level nodes in the TreeView\
    \ widget. Each object in the response contains three fields; when initializing\
    \ the TreeView widget, the field that should be used to display the text should\
    \ be specified:\n\n```javascript\n$('#treeView').kendoTreeView({\n    dataSource:\
    \ {\n        transport: {\n            read: '/services/music'\n        }\n  \
    \  },\n    dataTextField: 'categoryName'\n});\n```\n\n## Kendo UI TreeView\n\n\
    Now, when you execute the previous code, you would see the category names being\
    \ displayed in the TreeView widget. Here, the `dataTextField` attribute is used\
    \ to specify the field name that should be used when displaying labels in the\
    \ TreeView widget.\n\nTo populate the next level of nodes in TreeView, the widget\
    \ should be instructed whether the current node contains subitems or not. Notice\
    \ that the response contains the `categoryId` and `hasSubCategories` fields; the\
    \ `categoryId` field serves as a unique ID for each object in the response and\
    \ the `hasSubCategories` field indicates whether the object contains subitems.\
    \ This should be identified in the `DataSource` object and hence a schema for\
    \ the same should be specified:\n\n```javascript\n$('#treeView').kendoTreeView({\n\
    \    dataSource: {\n        transport: {\n            read: 'TreeView.json'\n\
    \        },\n        schema: {\n            model: {\n                id: 'categoryId',\n\
    \                hasChildren: 'hasSubCategories'\n            }\n        }\n \
    \   },\n    dataTextField: \"categoryName\",\n});\n```\n\nHere, the properties\
    \ in the schema models, `id` and `hasChildren`, are mapped to the attributes in\
    \ the response mentioned earlier. Now, TreeView shows you the list of top-level\
    \ nodes and indicates that each node in the tree has children. When you click\
    \ on any of the nodes in TreeView, a `GET` request is sent to remote services,\
    \ specifying the `categoryId` as a query parameter. For example, when you click\
    \ on the first node in the tree, a `GET` request is sent with the `categoryId`\
    \ query parameter set to 1:\n\n```\n/services/music?categoryId=1\n```\n\nThe service\
    \ is expected to return a similar JSON response, that is, a collection of objects,\
    \ each containing the `categoryId` and `hasSubCategories` attributes.\n\n## Using\
    \ the drag and drop feature to move elements in TreeView\n\nIn a TreeView widget,\
    \ elements in the tree can be dragged-and-dropped to various levels. This is applicable\
    \ not only to child elements, but also to top-level nodes in the tree.\n\n###\
    \ How to do it...\n\nTo enable the drag and drop feature, specify the dragAndDrop\
    \ property as true while initializing the TreeView widget, as shown in the following\
    \ code snippet:\n\n```javascript\n$('#treeView').kendoTreeView({\ndragAndDrop:\
    \ true,\n\ndataSource: [{\ntext: \"Directory1\",\nitems: [\n{ text: \"File1.txt\"\
    \ },\n{ text: \"File2.txt\" }\n],\nexpanded: true\n}, {\ntext: \"Directory2\"\
    ,\nitems: [\n{ text: \"File3.txt\" },\n{ text: \"File4.txt\" }\n] }, {\ntext:\
    \ \"Directory3\",\nitems: [\n{ text: \"File5.txt\" },\n{ text: \"File6.txt\" }\n\
    ]\n}\n]\n});\n```\n\nHere, when the dragAndDrop property is set to true, the elements\
    \ in TreeView can be moved between various levels in the tree.\n\n## Kendo UI\
    \ TreeView\n\nAs the user drags the node, various events are generated. The application\
    \ can listen to these events and customize its behavior. The drag, dragstart,\
    \ dragend, and drop events are the set of events for which the user can specify\
    \ the event listeners.\n\nLet's consider the drag event. The generated event contains\
    \ meta information and includes a function to set the tooltip, that is, a tooltip\
    \ is shown when the user is performing the drag operation. The event contains\
    \ properties such as sourceNode, which refers to the element being dragged; dropTarget,\
    \ which refers to the element that the sourceNode is placed over; pageX and pageY,\
    \ which refer to the x and y coordinates of the mouse pointer on the screen; and\
    \ statusClass, which indicates the status of the drag operation, that is, the\
    \ node being added, inserted, or denied if the operation is not acceptable.\n\n\
    To set the tooltip, invoke the setStatusClass function on the event object. This\
    \ function accepts a string as a parameter, which should be one of k-insert-top,\
    \ k-insert-middle, k-insert-bottom, k-add, or k-denied.\n\nThe statusClass property\
    \ can be used in the setStatusClass function to set the appropriate tooltip while\
    \ the element is being dragged:\n\n```javascript\n$('#treeView').kendoTreeView({\n\
    \    dragAndDrop: true,\n    drag: function (e) {\n        e.setStatusClass('k-'\
    \ + e.statusClass);\n    }\n});\n```\n\nNow, when the element is being dragged,\
    \ the tooltip is set by invoking the setStatusClass function. The status of the\
    \ drag operation is available in the statusClass property of the event object.\n\
    \n### How it works...\n\nAfter setting the dragAndDrop property to true, the elements\
    \ in TreeView can be dragged-and-dropped to any level in the tree.\n\n![](img/2a66507445090790d34dc5588b56b24c_67_0.png)\n\
    \nThe previous screenshot indicates that the File1.txt element is being dragged\
    \ and the tooltip indicates that the element will be inserted at the bottom, that\
    \ is, it would be the last element under the parent node, Directory1. When the\
    \ element is being dragged, the statusClass property is set to insert-bottom and\
    \ the tooltip is set to k-insert-bottom.\n\nSimilarly, when the element is moved\
    \ to a different node, you would notice that the tooltip changes to indicate that\
    \ the dragged element (sourceNode) would be added to a node in TreeView.\n\n![](img/2a66507445090790d34dc5588b56b24c_68_0.png)\n\
    \nNotice the tooltip in the preceding screenshot; it indicates that the element\
    \ is being added to Directory3. After dropping the element, the parent node is\
    \ expanded to show its content.\n\n![](img/2a66507445090790d34dc5588b56b24c_68_1.png)\n\
    \n### There’s more...\n\nIn many scenarios, you would like one of the nodes in\
    \ the tree to not accept a drop from any other element. In this case, the drop\
    \ event listener can be used to prevent a drop from any node in the tree:\n\n\
    ```javascript\n$('#treeView').kendoTreeView({\n dragAndDrop: true,\n drop: function(e)\
    \ {\n if ($(e.dropTarget)[0].innerText == 'Directory3') {\n e.setValid(false);\n\
    \ }\n }\n});\n```\n\nHere, the dropTarget node is checked to see whether it contains\
    \ the Directory3 text.\n\nIf this condition is true, then the setValid function\
    \ is invoked on the event object, passing false as the parameter. This will disable\
    \ the drop of any sourceNode over the node that contains the Directory3 text.\n\
    \nIn another scenario, if you would like to disable the dragging of top-level\
    \ nodes in the tree, that is, the root nodes of the tree, then an event listener\
    \ for the dragstart event can be added:\n\n```javascript\n$('#treeView').kendoTreeView({\n\
    dragAndDrop: true,\n\ndragstart: function (e) {\nif($(e.sourceNode).parentsUntil('.k-treeview',\
    \ '.k-item').length == 0) {\ne.preventDefault();\n}\n}\n});\n```\n\nHere, sourceNode\
    \ is checked for parent-level nodes. If one is not found, that is, if sourceNode\
    \ itself is the parent node, then by calling the preventDefault function on the\
    \ event object, the action of dragging the element is disabled.\n\n## Using checkboxes\
    \ to select nodes in TreeView\n\nIn TreeView, each node can have a checkbox associated\
    \ with it. By using a checkbox, you can select multiple nodes in the tree and\
    \ perform an action.\n\n### How to do it...\n\nTo add a checkbox next to a node\
    \ in TreeView, specify the checkboxes attribute as true when initializing the\
    \ TreeView widget:\n\n```javascript\n$('#treeView').kendoTreeView({\ncheckboxes:\
    \ true\n});\n```\n\nIf you want the child nodes to be selected when the parent\
    \ node is selected, then specify checkChildren as true:\n\n```javascript\n$('#treeView').kendoTreeView({\n\
    checkboxes: {\n"
  mdcn: "\n\n{ text: \"File1.txt\" },\n{ text: \"File2.txt\" }\n],\nexpanded: true\n\
    }, {\ntext: \"目录2\",\nitems: [\n{ text: \"File1.txt\" },\n{ text: \"File2.txt\"\
    \ }\n]},\n{\ntext: \"目录3\",\nitems: [\n{ text: \"File1.txt\" },\n{ text: \"File2.txt\"\
    \ }\n]\n}\n]\n});\n```\n\n这里，DataSource 对象是一个对象数组，每个对象指定 TreeView 小部件中节点的属性。每个对象都有一个\
    \ text 属性，用于指定 TreeView 小部件中节点的标签。它还有一个 items 集合，用于指定 TreeView 中节点的子项。\n\nDataSource\
    \ 集合中的第一个对象将 expanded 属性设置为 true，以指示该节点将展开以显示子项。\n\n## 从远程 DataSource 对象构建 TreeView\
    \ 小部件\n\n也可以通过从远程服务获取数据来构建 TreeView 小部件。DataSource 对象可以指定远程服务的 URL，用于获取层次结构数据：\n\
