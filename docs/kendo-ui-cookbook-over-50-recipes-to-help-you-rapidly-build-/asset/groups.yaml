    # # Kendo UI PanelBar


    In this chapter, we will cover the following recipes:


    +   - Creating a PanelBar

    +   - Loading the content of a PanelBar using Ajax

    +   - Binding the PanelBar to a DataSource object

    +   - Customizing the PanelBar


    # ## Introduction


    The Kendo UI PanelBar widget is similar to a tabbed panel that contains a list
    of items grouped under different tabs or panes. In a PanelBar, these lists of
    items are stacked vertically, and each list item can be expanded to show you the
    content. This widget is particularly useful when the data can be grouped into
    multiple sections and there is a constraint on the available space to display
    this data. For example, all your contacts can be grouped by some category such
    as **Favourites**, **Family**, **Friends**, and **Office Contacts**; when you
    tap on one of the these categories, the panel would expand to show you the list
    of contacts that belong to that category.


    # ## Creating a PanelBar


    A PanelBar can be created either by specifying its structure in the HTML markup
    or by configuring it using an API. In this recipe, we will take a look at the
    former approach.'
