    \ TreeView 小部件中的顶级节点。响应中的每个对象包含三个字段；在初始化 TreeView 小部件时，应指定用于显示文本的字段：\n\n```javascript\n\
    $('#treeView').kendoTreeView({\n    dataSource: {\n        transport: {\n    \
    \        read: '/services/music'\n        }\n    },\n    dataTextField: 'categoryName'\n\
    });\n```\n\n## Kendo UI TreeView\n\n现在，当你执行前面的代码时，你会看到类别名称在 TreeView 小部件中显示。这里，`dataTextField`\
    \ 属性用于指定在 TreeView 小部件中显示标签时应使用的字段名。\n\n要填充 TreeView 中的下一级节点，应指示小部件当前节点是否包含子项。请注意，响应包含\
    \ `categoryId` 和 `hasSubCategories` 字段；`categoryId` 字段用作响应中每个对象的唯一 ID，而 `hasSubCategories`\
    \ 字段指示该对象是否包含子项。这应在 `DataSource` 对象中标识，因此应为其指定一个架构：\n\n```javascript\n$('#treeView').kendoTreeView({\n\
    \    dataSource: {\n        transport: {\n            read: 'TreeView.json'\n\
    \        },\n        schema: {\n            model: {\n                id: 'categoryId',\n\
    \                hasChildren: 'hasSubCategories'\n            }\n        }\n \
    \   },\n    dataTextField: \"categoryName\",\n});\n```\n\n这里，架构模型中的属性 `id` 和 `hasChildren`\
    \ 映射到前面提到的响应中的属性。现在，TreeView 显示顶级节点列表，并指示树中每个节点都有子项。当你单击 TreeView 中的任何节点时，会向远程服务发送一个\
    \ `GET` 请求，并将 `categoryId` 作为查询参数指定。例如，当你单击树中的第一个节点时，会发送一个 `GET` 请求，并将 `categoryId`\
    \ 查询参数设置为 1：\n\n```\n/services/music?categoryId=1\n```\n\n预期该服务将返回类似的 JSON 响应，即一组对象，每个对象包含\
    \ `categoryId` 和 `hasSubCategories` 属性。\n\n## 使用拖放功能在 TreeView 中移动元素\n\n在 TreeView\
    \ 小部件中，树中的元素可以拖放到各个级别。这不仅适用于子元素，也适用于树中的顶级节点。\n\n### 操作方法...\n\n要启用拖放功能，请在初始化 TreeView\
    \ 小部件时将 dragAndDrop 属性指定为 true，如以下代码片段所示：\n\n```javascript\n$('#treeView').kendoTreeView({\n\
    dragAndDrop: true,\n\ndataSource: [{\ntext: \"目录1\",\nitems: [\n{ text: \"File1.txt\"\
    \ },\n{ text: \"File2.txt\" }\n],\nexpanded: true\n}, {\ntext: \"目录2\",\nitems:\
    \ [\n{ text: \"File3.txt\" },\n{ text: \"File4.txt\" }\n] }, {\ntext: \"目录3\"\
    ,\nitems: [\n{ text: \"File5.txt\" },\n{ text: \"File6.txt\" }\n]\n}\n]\n});\n\
    ```\n\n这里，当 dragAndDrop 属性设置为 true 时，TreeView 中的元素可以在树的各个级别之间移动。\n\n## Kendo UI\
    \ TreeView\n\n当用户拖动节点时，会生成各种事件。应用程序可以监听这些事件并自定义其行为。drag、dragstart、dragend 和 drop\
    \ 事件是用户可以为其指定事件监听器的一组事件。\n\n让我们考虑 drag 事件。生成的事件包含元信息，并包含一个设置工具提示的函数，即当用户执行拖动操作时会显示一个工具提示。该事件包含\
    \ sourceNode 等属性，指代正在拖动的元素；dropTarget，指代 sourceNode 放置其上的元素；pageX 和 pageY，指代鼠标指针在屏幕上的\
    \ x 和 y 坐标；以及 statusClass，指示拖动操作的状态，即节点被添加、插入，或者如果操作不可接受则被拒绝。\n\n要设置工具提示，请在事件对象上调用\
    \ setStatusClass 函数。该函数接受一个字符串作为参数，该字符串应为 k-insert-top、k-insert-middle、k-insert-bottom、k-add\
    \ 或 k-denied 之一。\n\n可以在元素拖动过程中使用 statusClass 属性在 setStatusClass 函数中设置适当的工具提示：\n\
    \n```javascript\n$('#treeView').kendoTreeView({\n    dragAndDrop: true,\n    drag:\
