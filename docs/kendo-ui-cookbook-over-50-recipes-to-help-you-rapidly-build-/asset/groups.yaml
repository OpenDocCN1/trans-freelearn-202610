  md: "\n\n## Setting the initial layout and view when initializing the application\n\
    \nWhen working on complex mobile applications, you will have multiple layouts\
    \ and views in the page. In this case, the initial view to render within a selected\
    \ layout would not be possible to determine. However, options can be passed to\
    \ the kendo.mobile.application function to set the layout and the initial view\
    \ to use when the application is initialized.\n\n## How to do it...\n\nLet's consider\
    \ that there are two layouts and two views in the page. The layouts differ by\
    \ the number of elements in tabstrip. In layout1, let's consider the header text,\
    \ which reads Layout1 header and has two elements in its tabstrip:\n\n```\n<div\n\
    data-role=\"layout\"\ndata-id=\"layout1\">\n<!- - header here - ->\n<footer data-role=\"\
    footer\">\n<div data-role=\"tabstrip\">\n<a data-icon=\"about\">About</a>\n<a\
    \ data-icon=\"settings\">Settings</a>\n</div>\n</footer>\n</div>\n```\n\nIn the\
    \ same page, there will be another layout with the `data-id` attribute set to\
    \ `layout2`. This layout's header text would read `Layout2 header`, and the footer\
    \ would contain four elements in its tabstrip:\n\n```\n<div\ndata-role=\"layout\"\
    \ndata-id=\"layout2\">\n<!- - header here - ->\n<footer data-role=\"footer\">\n\
    <div data-role=\"tabstrip\">\n<a data-icon=\"about\">About</a>\n<a data-icon=\"\
    settings\">Settings</a>\n<a data-icon=\"share\">Share</a>\n<a data-icon=\"refresh\"\
    >Refresh</a>\n</div>\n</footer>\n</div>\n```\n\nThe next step is to add views\
    \ to the page. Let's add two views and specify the id attribute for them:\n\n\
    ```\n<div\n data-role=\"view\"\n id=\"view1\">\n From View1\n</div>\n\n<div\n\
    \ data-role=\"view\"\n id=\"view2\">\n From View2\n</div>\n```\n\nNotice that\
    \ the views in this page do not have the data-layout attribute. When the page\
    \ is rendered, you would see that the first view in the page (with id='view1')\
    \ is rendered without any layout. To change this behavior, you can specify the\
    \ layout and the initial view to use when initializing the application:\n\n```\n\
    <script>\n var app = new kendo.mobile.Application(document.body, {\n layout: 'layout2',\n\
    \ initial: 'view2'\n });\n</script>\n```\n\nHere, the first argument of the kendo.mobile.Application\
    \ function is document.body. The first argument of this function is the target\
    \ element. It is usually the container for various widgets (the element with the\
    \ data-role attribute). The second argument is an object that contains a set of\
    \ options used to initialize the application. Here, we will specify the layout\
    \ and the initial view to use when rendering the page.\n\n## How it works...\n\
    \nWhen you render the page, you would see that `layout2` is used when rendering\
    \ `view2`.\n\n![](img/2a66507445090790d34dc5588b56b24c_131_0.png)\n\nIf you specify\
    \ the `data-layout` attribute for the view element, then the view would be rendered\
    \ with that layout instead of the one mentioned when initializing the application.\n\
    \n## There's more...\n\nIn the previous recipe, it was mentioned that the `data-platform`\
    \ attribute is used to specify the platform for which the layout is built. In\
    \ many scenarios, you might like the same look and feel to appear in all the platforms.\
    \ For example, if you are using an iOS device and would like to force the look\
    \ and feel of Android, then you can specify the attribute platform when initializing\
    \ the application:\n\n```html\n<script>\nvar app = new kendo.mobile.Application(document.body,\
    \ {\n    layout: 'layout2',\n    initial: 'view2',\n    platform: 'android'\n\
    });\n</script>\n```\n\nNow when you render the page on any device, you should\
    \ be able to see the same look and feel across all platforms.\n\n## Using the\
    \ Application object to navigate to various views\n\nWhen building a mobile application,\
    \ you will have multiple views representing various states in the application,\
    \ that is, each state is represented by a View component in the application. For\
    \ example, when you click on a button, the current view is disposed and the new\
    \ view should be displayed. The Application object is used to navigate between\
    \ various views in the application. These views can be defined in the same HTML\
    \ document or can be present as a separate document (partials).\n\n## How to do\
    \ it...\n\nA good way to structure the code is to create multiple pages and separate\
    \ the views. Specifying all the views in the same page will increase the size\
    \ of the response and, hence, hamper the performance. Let's create a page that\
    \ contains two buttons, namely, Login and Register:\n\n```\n<div\ndata-role=\"\
    layout\"\ndata-id=\"layout1\">\n<header data-role=\"header\">\n<div data-role=\"\
    navbar\">\n<span data-role=\"view-title\"></span>\n</div>\n</header>\n</div>\n\
    <div\ndata-role=\"view\"\ndata-layout=\"layout1\"\ndata-title=\"Home\">\n\n<a\n\
    data-role=\"button\"\nid=\"loginBtn\"\nclass=\"button\">\nLogin\n</a>\n<a\ndata-role=\"\
    button\"\nid=\"registerBtn\"\nclass=\"button\">\nRegister\n</a>\n</div>\n```\n\
    \nLet's call this page the **Home** page. It contains a layout widget and a view\
    \ widget. The view contains two buttons. Notice that the layout's navbar widget\
    \ contains a span element with the data-role attribute set to view-title. This\
    \ allows various views to provide a title that will be displayed in the navbar\
    \ widget. The view widget specifies the data-title attribute with its value as\
    \ Home. This will set the layout's navbar text with the same value.\n\nThe view\
    \ contains two buttons: **Login** and **Register**. The next step is to define\
    \ views that will be displayed when you click on one of these buttons; the following\
    \ code snippet shows you a description of Login View:\n\n```\n<div\ndata-role=\"\
    layout\"\ndata-id=\"login-layout\">\n<header data-role=\"header\">\n\n<div data-role=\"\
    navbar\">\n<a\nclass=\"nav-button\"\ndata-role=\"backbutton\"\ndata-align=\"left\"\
    >\nBack\n</a>\n<span data-role=\"view-title\"></span>\n</div>\n</header>\n</div>\n\
    <div\ndata-role=\"view\"\ndata-layout=\"login-layout\"\ndata-title=\"Login\">\n\
    Login Page\n</div>\n```\n\nThe preceding code snippet is placed in the login.html\
    \ file. Here, the layout is similar to the one created in the Home page, except\
    \ that it now contains a Back button (data-role=backbutton). The backbutton widget\
    \ is used as a navigation widget to navigate back to the previous page. A similar\
    \ page, register.html, is created and contains the same layout and view.\n\nThe\
    \ next step is to bind the buttons in the Home page to these pages. The Application\
    \ object is used to navigate between various pages. Let's add event handlers to\
    \ the login and register buttons on the page:\n\n```\n<script>\nvar app = new\
    \ kendo.mobile.Application();\n$('#loginBtn').on('click', function () {\napp.navigate('login.html');\n\
    });\n$('#registerBtn').on('click', function () {\napp.navigate('register.html');\n\
    });\n</script>\n```\n\nThe navigate method is used to navigate to different pages.\
    \ When the user clicks on any of these buttons, the navigate method on the Application\
    \ object is called to navigate to the corresponding page.\n\n## How it works...\n\
    \nWhen you render the page (**Home page**), there are two buttons, **Login** and\
    \ **Register**.\n\n![](img/2a66507445090790d34dc5588b56b24c_135_0.png)\n\nOn clicking\
    \ on the **Login** button, the user would be navigated to the `login.html` page,\
    \ and when you click on the **Register** button, you would be navigated to the\
    \ `register.html` page. The screenshot of the **Login** page is shown as follows:\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_135_1.png)\n\nThe navbar title is updated,\
    \ and it has a **Back** button. On clicking on the **Back** button, the user is\
    \ navigated to the **Home** page. On the **Home** page, when you click on the\
    \ **Register** button, the registration page, that is, the `register.html` page,\
    \ is shown as follows:\n\n![](img/2a66507445090790d34dc5588b56b24c_136_0.png)\n\
    \nThe **Register** view also contains the **Back** button, allowing the user to\
    \ navigate to the **Home** page.\n\nWhen navigating from one view to the other,\
    \ you can specify the transition effects that can be applied.\n\n## Specifying\
    \ view transitions\n\nWhen transitioning from one view to the other, you can specify\
    \ the transition effect that needs to be applied using the `data-transition` attribute.\
    \ The following values can be set as values of the `data-transition` attribute:\n\
    \n- `slide`: This transition effect slides the old view content to the left and\
    \ inserts the new view content slides in its place. You can specify the direction\
    \ using the slide (direction). By default, the direction is left; the other option\
    \ is right.\n- `zoom`: Here, the new view content zooms from the center of the\
    \ old view. The old view content will fade out and the new view content will be\
    \ shown.\n\n"
  mdcn: "\n\n## 设置应用程序初始化时的布局和视图\n\n在处理复杂的移动应用程序时，页面中会有多个布局和视图。在这种情况下，无法确定在所选布局中渲染的初始视图。但是，可以将选项传递给\
    \ kendo.mobile.application 函数，以设置应用程序初始化时使用的布局和初始视图。\n\n## 操作方法...\n\n假设页面中有两个布局和两个视图。布局之间的区别在于\
    \ tabstrip 中的元素数量。在 layout1 中，让我们考虑标题文本，它读取为 Layout1 header，并且其 tabstrip 中有两个元素：\n\
    \n```\n<div\ndata-role=\"layout\"\ndata-id=\"layout1\">\n<!- - header here - ->\n\
    <footer data-role=\"footer\">\n<div data-role=\"tabstrip\">\n<a data-icon=\"about\"\
    >About</a>\n<a data-icon=\"settings\">Settings</a>\n</div>\n</footer>\n</div>\n\
    ```\n\n在同一页面中，还会有另一个布局，其 `data-id` 属性设置为 `layout2`。该布局的标题文本将读取为 `Layout2 header`，页脚将包含\
    \ tabstrip 中的四个元素：\n\n```\n<div\ndata-role=\"layout\"\ndata-id=\"layout2\">\n\
    <!- - header here - ->\n<footer data-role=\"footer\">\n<div data-role=\"tabstrip\"\
    >\n<a data-icon=\"about\">About</a>\n<a data-icon=\"settings\">Settings</a>\n\
    <a data-icon=\"share\">Share</a>\n<a data-icon=\"refresh\">Refresh</a>\n</div>\n\
    </footer>\n</div>\n```\n\n下一步是向页面添加视图。让我们添加两个视图并为它们指定 id 属性：\n\n```\n<div\n data-role=\"\
    view\"\n id=\"view1\">\n From View1\n</div>\n\n<div\n data-role=\"view\"\n id=\"\
    view2\">\n From View2\n</div>\n```\n\n请注意，此页面中的视图没有 data-layout 属性。当页面渲染时，您会看到页面中的第一个视图（id='view1'）在没有任何布局的情况下渲染。要更改此行为，您可以在初始化应用程序时指定要使用的布局和初始视图：\n\
    \n```\n<script>\n var app = new kendo.mobile.Application(document.body, {\n layout:\
    \ 'layout2',\n initial: 'view2'\n });\n</script>\n```\n\n在这里，kendo.mobile.Application\
    \ 函数的第一个参数是 document.body。此函数的第一个参数是目标元素。它通常是各种小部件的容器（带有 data-role 属性的元素）。第二个参数是一个对象，包含一组用于初始化应用程序的选项。在这里，我们将指定在渲染页面时要使用的布局和初始视图。\n\
    \n## 工作原理...\n\n当您渲染页面时，您会看到在渲染 `view2` 时使用了 `layout2`。\n\n![](img/2a66507445090790d34dc5588b56b24c_131_0.png)\n\
    \n如果您为视图元素指定了 `data-layout` 属性，则该视图将使用该布局进行渲染，而不是在初始化应用程序时提到的布局。\n\n## 更多内容...\n\
    \n在之前的配方中，提到 `data-platform` 属性用于指定构建布局的平台。在许多场景中，您可能希望在所有平台上都出现相同的外观和感觉。例如，如果您使用\
    \ iOS 设备并希望强制使用 Android 的外观和感觉，那么您可以在初始化应用程序时指定 platform 属性：\n\n```html\n<script>\n\
    var app = new kendo.mobile.Application(document.body, {\n    layout: 'layout2',\n\
    \    initial: 'view2',\n    platform: 'android'\n});\n</script>\n```\n\n现在，当您在任何设备上渲染页面时，您应该能够在所有平台上看到相同的外观和感觉。\n\
    \n## 使用 Application 对象导航到各种视图\n\n在构建移动应用程序时，您将拥有代表应用程序中各种状态的多个视图，也就是说，每个状态都由应用程序中的\
    \ View 组件表示。例如，当您单击按钮时，当前视图将被销毁，新视图应显示。Application 对象用于在应用程序中导航到各种视图。这些视图可以定义在同一\
    \ HTML 文档中，也可以作为单独的文档（部分）存在。\n\n## 操作方法...\n\n构建代码的一个好方法是创建多个页面并分离视图。在同一页面中指定所有视图将增加响应的大小，从而影响性能。让我们创建一个包含两个按钮（即\
    \ Login 和 Register）的页面：\n\n```\n<div\ndata-role=\"layout\"\ndata-id=\"layout1\"\
    >\n<header data-role=\"header\">\n<div data-role=\"navbar\">\n<span data-role=\"\
    view-title\"></span>\n</div>\n</header>\n</div>\n<div\ndata-role=\"view\"\ndata-layout=\"\
    layout1\"\ndata-title=\"Home\">\n\n<a\ndata-role=\"button\"\nid=\"loginBtn\"\n\
    class=\"button\">\nLogin\n</a>\n<a\ndata-role=\"button\"\nid=\"registerBtn\"\n\
    class=\"button\">\nRegister\n</a>\n</div>\n```\n\n让我们称这个页面为 **Home** 页面。它包含一个布局小部件和一个视图小部件。视图包含两个按钮。请注意，布局的\
    \ navbar 小部件包含一个 data-role 属性设置为 view-title 的 span 元素。这允许各种视图提供将在 navbar 小部件中显示的标题。视图小部件指定了\
    \ data-title 属性，其值为 Home。这将把布局的 navbar 文本设置为相同的值。\n\n视图包含两个按钮：**Login** 和 **Register**。下一步是定义单击其中一个按钮时将显示的视图；以下代码片段向您展示了\
    \ Login View 的描述：\n\n```\n<div\ndata-role=\"layout\"\ndata-id=\"login-layout\"\
    >\n<header data-role=\"header\">\n\n<div data-role=\"navbar\">\n<a\nclass=\"nav-button\"\
    \ndata-role=\"backbutton\"\ndata-align=\"left\">\nBack\n</a>\n<span data-role=\"\
    view-title\"></span>\n</div>\n</header>\n</div>\n<div\ndata-role=\"view\"\ndata-layout=\"\
    login-layout\"\ndata-title=\"Login\">\nLogin Page\n</div>\n```\n\n前面的代码片段放在 login.html\
    \ 文件中。在这里，布局与在 Home 页面中创建的布局类似，只是它现在包含一个返回按钮（data-role=backbutton）。backbutton\
    \ 小部件用作导航小部件，用于导航回上一页。创建了一个类似的页面 register.html，包含相同的布局和视图。\n\n下一步是将 Home 页面中的按钮绑定到这些页面。Application\
    \ 对象用于在各种页面之间导航。让我们为页面上的 login 和 register 按钮添加事件处理程序：\n\n```\n<script>\nvar app\
    \ = new kendo.mobile.Application();\n$('#loginBtn').on('click', function () {\n\
    app.navigate('login.html');\n});\n$('#registerBtn').on('click', function () {\n\
    app.navigate('register.html');\n});\n</script>\n```\n\nnavigate 方法用于导航到不同的页面。当用户单击其中任何按钮时，Application\
    \ 对象上的 navigate 方法将被调用以导航到相应的页面。\n\n## 工作原理...\n\n当您渲染页面（**Home 页面**）时，有两个按钮，**Login**\
    \ 和 **Register**。\n\n![](img/2a66507445090790d34dc5588b56b24c_135_0.png)\n\n单击\
    \ **Login** 按钮时，用户将被导航到 `login.html` 页面，当您单击 **Register** 按钮时，您将被导航到 `register.html`\
    \ 页面。**Login** 页面的屏幕截图如下所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_135_1.png)\n\
    \nnavbar 标题已更新，并且它有一个 **Back** 按钮。单击 **Back** 按钮时，用户将被导航到 **Home** 页面。在 **Home**\
    \ 页面上，当您单击 **Register** 按钮时，将显示注册页面，即 `register.html` 页面，如下所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_136_0.png)\n\
    \n**Register** 视图也包含 **Back** 按钮，允许用户导航到 **Home** 页面。\n\n在从一个视图导航到另一个视图时，您可以指定可以应用的过渡效果。\n\
    \n## 指定视图过渡\n\n在从一个视图过渡到另一个视图时，您可以使用 `data-transition` 属性指定需要应用的过渡效果。以下值可以设置为\
    \ `data-transition` 属性的值：\n\n- `slide`: 此过渡效果将旧视图内容向左滑动，并将新视图内容滑动到其位置。您可以使用 slide\
    \ (direction) 指定方向。默认情况下，方向为左；另一个选项是右。\n- `zoom`: 在这里，新视图内容从旧视图的中心缩放。旧视图内容将淡出，新视图内容将显示。\n\
    \n"
