    \ event handler\nis executed.\n- 3. While the file is being uploaded, the `progress`\
    \ event is called continuously.\nNote that the event object has a `percentComplete`\
    \ property, which indicates\nthe size of the file uploaded to the server.\n- 4.\
    \ Once a file has been uploaded, the `success` handler is executed.\n- 5. If there\
    \ are multiple files being uploaded and when all selected files have been\nuploaded,\
    \ the `complete` handler is executed.\n- 6. If the user tries to cancel the upload\
    \ while the file upload is in progress,\nthen the `cancel` event is executed.\n\
    - 7. After the file upload has been completed and the user tries to remove the\n\
    uploaded file from the uploader widget by clicking on the cross (x) icon,\nthe\
    \ `remove` handler is executed.\n- 8. The `complete` handler is also executed\
    \ when the `remove` and `cancel`\nevents have completed their execution.\n\n##\
    \ Kendo UI Window\n\nIn this chapter, we will cover the following recipes:\n\n\
    - Displaying a pop up and blocking the user interaction by configuring it as a\
    \ modal window\n- Customizing the look and feel of the window and including action\
    \ buttons\n- Using the Window API to act on a window object\n\n### Introduction\n\
    \nA Kendo UI Window widget is used to show any HTML content in a pop-up window\
    \ or a modal window. The window content is shown on top of the other content in\
    \ the page and has a title bar with a close button. The content can be either\
    \ static HTML, or it can be loaded dynamically using Ajax. Any DOM node in the\
    \ page can be initialized to a window, that is, the content of any element in\
    \ the DOM can be wrapped inside a window. Also, the window can be resized, moved,\
    \ and closed.\n\nThe Kendo UI Window widget provides several configuration options\
    \ that can be used to customize the actions that can be applied and also the look\
    \ and feel of the widget. In this recipe, we will first see how to create a pop-up\
    \ window and configure it as a modal. Then, we will customize the look the feel\
    \ of the window and use APIs to invoke actions on the window object.\n\n## Displaying\
    \ a pop up and blocking the user interaction by configuring it as a modal window\n\
    \nIn this recipe, we will look at how the Kendo UI window is created for a DOM\
    \ node in the page. Later, we will also see how the content of the window is loaded\
    \ asynchronously by specifying the URL of the page.\n\n### How to do it...\n\n\
    Let's create a div element that contains some text that will be shown in the window:\n\
    \n```html\n<div id=\"window\">\n Window content goes here...\n</div>\n```\n\n\
    The next step is to invoke the kendoWindow function on the preceding DOM node:\n\
    \n```javascript\n$(\"#window\").kendoWindow();\n```\n\nAfter initializing the\
    \ DOM node using the kendoWindow function, you will notice that the window contains\
    \ the text mentioned in the div element that is being shown. Note that this will\
    \ not add a backdrop. To add a backdrop, the window should be configured as a\
    \ modal.\n\nThe difference between a window and a modal is that a backdrop that\
    \ hides the body content is shown in the case of a modal. To create the modal\
    \ window, specify the modal property as true:\n\n```javascript\n$(\"#window\"\
    ).kendoWindow({\n modal: true\n});\n```\n\nBy default, the value of the modal\
    \ property is false, and hence the backdrop is not shown.\n\n### How it works...\n\
    \nWhen you initialize any DOM node, its content will be wrapped in a window, as\
    \ shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_113_0.png)\n\
    \nThe window contains the **Window content goes here...** text, and the title\
    \ bar has a cross(x) icon. If the same is initialized as a modal window, then\
    \ a backdrop is added to the page, as shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_114_0.png)\n\
    \nNotice that the backdrop is translucent; it shows you the text present in the\
    \ page and also highlights the window. This will prevent you from interacting\
    \ with the rest of the page. Usually, a modal window is used only when the user\
    \ is required to complete an action before proceeding to the next step. For example,\
    \ a modal window that contains a login form could be shown before the same user\
    \ views the content of the page.\n\n### There's more...\n\nThe modal window can\
    \ be configured to open when the user triggers an action. For example, on click\
    \ of a button the modal window can be shown. Also, since the content of the modal\
    \ is loaded when the user triggers an action on the page, the content of the modal\
    \ can be loaded at runtime using Ajax.\n\n### Showing the modal window on a click\
    \ of button\n\nIn the previously mentioned scenarios, the window or the modal\
    \ window is shown when the page is loaded. In most of the scenarios, you would\
    \ like to show the modal only when the user initiates an action. Let's consider\
    \ that the modal window should be shown when the user clicks on a button.\n\n\
    Let's place a button on the page as follows:\n\n```html\n<button id=\"btn1\">Click</button>\n\
    ```\n\nTo hide the modal, set the `visible` attribute to `false`, as follows:\n\
    \n```javascript\n$('#window').kendoWindow({\n    visible: false,\n    modal: true\n\
    });\n```\n\n"
  mdcn: "\n\n## 本地化文件上传器小部件\n\n要本地化文件上传器小部件，请按如下方式指定本地化选项：\n\n```javascript\n$('#fileUpload').kendoUpload({\n\
    async: {\n'saveUrl': '/fileUploadService/save',\n'removeUrl': '/fileUploadService/remove',\n\
    'autoUpload': true\n},\nlocalization: {\nselect: 'Choose files...',\nremove: 'Remove\
    \ file',\nretry: 'Retry upload',\nheaderStatusUploading: 'Uploading files...',\n\
    headerStatusUploaded: 'Complete'\n}\n});\n```\n\n在此，\"Select Files...\" 标签将被替换为\
    \ \"Choose files...\"；remove 和 retry 的提示将分别为 \"Remove file\" 和 \"Retry upload\"\
    。在文件上传期间，将显示 \"Uploading files...\" 消息，一旦上传完成，将显示 \"Complete\" 消息。\n\n## 使用拖放上传文件\n\
    \n文件上传器小部件支持将文件拖放到文件上传器小部件上。此功能在所有支持 HTML5 File API 的现代浏览器中均受支持。只有当小部件配置为异步上传文件时，此方法才可用。\n\
    \n当您尝试将文件拖放到上传器小部件上时，它会显示 **drop files here to upload** 消息。\n\n![](img/2a66507445090790d34dc5588b56b24c_108_0.png)\n\
    \n放置文件后，文件将被添加到列表中，并异步上传到服务器。\n\n## 监听文件上传事件\n\n在 HTML5 出现之前，XmlHttpRequest 可用的唯一事件监听器是\
    \ `readystatechange` 事件监听器。在 HTML5 中，已向 `XmlHttpRequest` 接口添加了多个事件监听器：loadstart、progress、load、abort、error、timeout\
    \ 和 loadend。在本示例中，我们将了解可以附加到文件上传器小部件的各种事件监听器以及这些事件执行的顺序。\n\n## 操作方法\n\n文件上传器小部件会显示正在上传的文件的进度，并在所有文件上传完成时显示状态为已完成。但是，在许多情况下，您可能希望附加监听器并监听各种事件：\n\
    \n```javascript\n$('#fileUpload').kendoUpload({\n    async: {\n        'saveUrl':\
    \ '/fileUploadService/save',\n        'removeUrl': '/fileUploadService/remove',\n\
    \        'autoUpload': true\n    },\n    cancel: function () {\n        console.log('Cancel\
    \ Event.');\n    },\n    complete: function () {\n        console.log('Complete\
    \ Event.');\n    },\n    error: function () {\n        console.log('Error uploading\
    \ file.');\n    },\n    progress: function (e) {\n        console.log('Uploading\
    \ file ' + e.percentComplete);\n    },\n    remove: function () {\n        console.log('File\
    \ removed.');\n    },\n    select: function () {\n        console.log('File selected.');\n\
    \    },\n    success: function () {\n        console.log('Upload successful.');\n\
    \    },\n    upload: function () {\n        console.log('Upload started.');\n\
    \    }\n});\n```\n\n在前面的代码片段中，指定了各种事件处理程序：cancel、complete、error、success、progress、remove、select\
    \ 和 upload。\n\n## 工作原理\n\n当您尝试使用文件上传器小部件上传文件时，各种回调处理程序将按以下顺序执行：\n\n- 1. 当您选择一个文件或多个文件时，将执行\
    \ `select` 事件处理程序。\n- 2. 当上传器小部件开始上传文件时，将执行 `upload` 事件处理程序。\n- 3. 在文件上传期间，`progress`\
    \ 事件将被连续调用。请注意，事件对象具有一个 `percentComplete` 属性，用于指示上传到服务器的文件大小。\n- 4. 文件上传完成后，将执行\
    \ `success` 处理程序。\n- 5. 如果正在上传多个文件，并且所有选定的文件都已上传，则将执行 `complete` 处理程序。\n- 6. 如果用户在文件上传进行期间尝试取消上传，则将执行\
    \ `cancel` 事件。\n- 7. 文件上传完成后，如果用户尝试通过单击叉号 (x) 图标从上传器小部件中删除已上传的文件，则将执行 `remove`\
    \ 处理程序。\n- 8. 当 `remove` 和 `cancel` 事件执行完成后，也会执行 `complete` 处理程序。\n\n## Kendo\
    \ UI Window\n\n在本章中，我们将介绍以下示例：\n\n- 通过将其配置为模态窗口来显示弹出窗口并阻止用户交互\n- 自定义窗口的外观并包含操作按钮\n\
    - 使用 Window API 对窗口对象执行操作\n\n### 简介\n\nKendo UI Window 小部件用于在弹出窗口或模态窗口中显示任何 HTML\
    \ 内容。窗口内容显示在页面上的其他内容之上，并带有带关闭按钮的标题栏。内容可以是静态 HTML，也可以使用 Ajax 动态加载。页面中的任何 DOM 节点都可以初始化为窗口，也就是说，DOM\
    \ 中任何元素的内容都可以包装在窗口内。此外，窗口可以调整大小、移动和关闭。\n\nKendo UI Window 小部件提供了多个配置选项，可用于自定义可以应用的操作以及小部件的外观。在本示例中，我们将首先了解如何创建弹出窗口并将其配置为模态。然后，我们将自定义窗口的外观并使用\
    \ API 对窗口对象调用操作。\n\n## 通过将其配置为模态窗口来显示弹出窗口并阻止用户交互\n\n在本示例中，我们将了解如何为页面中的 DOM 节点创建\
    \ Kendo UI 窗口。随后，我们还将了解如何通过指定页面的 URL 来异步加载窗口的内容。\n\n### 操作方法\n\n让我们创建一个包含一些文本的\
    \ div 元素，这些文本将显示在窗口中：\n\n```html\n<div id=\"window\">\n Window content goes here...\n\
    </div>\n```\n\n下一步是在前面的 DOM 节点上调用 kendoWindow 函数：\n\n```javascript\n$(\"#window\"\
    ).kendoWindow();\n```\n\n使用 kendoWindow 函数初始化 DOM 节点后，您会注意到窗口中包含 div 元素中提到的文本并正在显示。请注意，这不会添加背景遮罩层。要添加背景遮罩层，应将窗口配置为模态。\n\
    \n窗口和模态之间的区别在于，在模态的情况下，会显示隐藏正文内容的背景遮罩层。要创建模态窗口，请将 modal 属性指定为 true：\n\n```javascript\n\
    $(\"#window\").kendoWindow({\n modal: true\n});\n```\n\n默认情况下，modal 属性的值为 false，因此不会显示背景遮罩层。\n\
    \n### 工作原理\n\n当您初始化任何 DOM 节点时，其内容将被包装在窗口中，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_113_0.png)\n\
    \n窗口包含 **Window content goes here...** 文本，标题栏上有一个叉号 (x) 图标。如果将其初始化为模态窗口，则会向页面添加背景遮罩层，如下面的屏幕截图所示：\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_114_0.png)\n\n请注意，背景遮罩层是半透明的；它会显示页面中存在的文本，并突出显示窗口。这将阻止您与页面的其余部分进行交互。通常，只有在用户需要在继续下一步之前完成某个操作时，才会使用模态窗口。例如，在同一用户查看页面内容之前，可能会显示包含登录表单的模态窗口。\n\
    \n### 更多内容\n\n模态窗口可以配置为在用户触发操作时打开。例如，单击按钮时可以显示模态窗口。此外，由于模态的内容是在用户在页面上触发操作时加载的，因此模态的内容可以在运行时使用\
    \ Ajax 加载。\n\n### 在单击按钮时显示模态窗口\n\n在前面提到的场景中，窗口或模态窗口在页面加载时显示。在大多数场景中，您可能希望仅在用户发起操作时才显示模态窗口。让我们假设当用户单击按钮时应显示模态窗口。\n\
    \n让我们按如下方式在页面上放置一个按钮：\n\n```html\n<button id=\"btn1\">Click</button>\n```\n\n\
    要隐藏模态窗口，请将 `visible` 属性设置为 `false`，如下所示：\n\n```javascript\n$('#window').kendoWindow({\n\
    \    visible: false,\n    modal: true\n});\n```\n\n"
