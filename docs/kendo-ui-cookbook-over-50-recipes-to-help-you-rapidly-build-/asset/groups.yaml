  mdcn: "\n\n## 工作原理...\n\n在本示例图表中，图表类型指定为 area，现在当你渲染页面时，将显示一个显示多年采用百分比的区域图，如下面的屏幕截图所示：\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_185_0.png)\n\n## 更多...\n\n在前面的示例中，图表中只显示了一个系列。使用多个系列时，需要将远程服务配置为以特定格式返回数据。\n\
    \n## 使用 DataSource 对象显示多个系列\n\n当你有多个系列要添加到图表时，`DataSource` 对象应包含按类别分组的数据。在本示例中，数据按年份分组，如下面的代码片段所示：\n\
    \n```\nvar browserAdoption = [{\n    'year': 2011,\n    'chrome': 40,\n    'firefox':\
    \ 30,\n    'ie': 15,\n    'safari': 15\n}, {\n    'year': 2012,\n    'chrome':\
    \ 45,\n    'firefox': 25,\n    'ie': 12,\n    'safari': 18\n}, {\n    'year':\
    \ 2013,\n    'chrome': 50,\n    'firefox': 22,\n    'ie': 8,\n    'safari': 20\n\
    }];\n```\n\n在我们的示例中，`categoryAxis` 选项将字段指定为 `year`；这将按此字段对数据进行分组。下一步是在构建图表时在 `series`\
    \ 选项中指定前面提到的配置：\n\n```\nseries: [{\n    field: 'chrome',\n    name: 'Chrome'\n\
    }, {\n    field: 'firefox',\n    name: 'Firefox'\n}, {\n    field: 'safari',\n\
    \    name: 'Safari'\n}, {\n    field: 'ie',\n    name: 'IE'\n}],\n```\n\n现在当你渲染页面时，各种浏览器的系列将绘制在图表上，如下面的屏幕截图所示：\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_187_0.png)\n\n## 在图表上以标签形式显示值\n\n图表可以自定义为在特定点上显示图表上的值。labels\
    \ 选项用于在绘制的图表上显示值：\n\n```\nseriesDefaults: {\ntype: 'area',\nlabels: {\nvisible:\
    \ true,\nformat: '{0}%'\n}\n}\n```\n\n在这里，`labels` 选项指定两个字段，即 `visible` 和 `format`。系列的\
    \ `labels` 选项将在 x 轴和 y 轴交叉处的值投影位置添加标签，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_188_0.png)\n\
    \n前面的屏幕截图显示了两个轴交叉处标签的精确值。\n\n## 创建多轴图表\n\n在许多场景中，你希望按多个字段对数据进行分组。在前面的示例中，浏览器采用数据按年份分组。现在，这些数据还可以按平台分组。例如，可以通过向图表添加多个轴来完成\
    \ 2012 年 Windows 平台上 Chrome 浏览器的采用。\n\n### 操作方法...\n\n第一步是定义系列数据，其中包含按平台分组的信息：\n\
    \n```\nseries: [{\n name: 'On Windows',\n data: ['15', '26', '40', '52', '56'],\n\
    \ type: 'column',\n}, {\n  name: 'On Linux',\n  data: ['8', '15', '28', '32',\
    \ '38'],\n  type: 'column',\n}, {\n  name: 'On Mac',\n  data: ['12', '20', '33',\
    \ '40', '45'],\n  type: 'area'\n}, {\n  name: 'On Others',\n  data: ['2', '8',\
    \ '15', '18', '22'],\n  type: 'area'\n}]\n```\n\n在这里，name 属性指定平台，data 属性指定多年的采用百分比。请注意，系列中的前两个的\
    \ type 属性为 column，另外两个为 area。下一步是更新 valueAxis 选项并指定需要绘制的轴的详细信息：\n\n```\nvalueAxis:\
    \ [{\n  title: {\n    text: 'Windows'\n  },\n  min: 0,\n  max: 60\n}, {\n  title:\
    \ {\n    text: 'Linux'\n  },\n  min: 0,\n  max: 60\n}, {\n  title: {\n    text:\
    \ 'Mac'\n  },\n  min: 0,\n  max: 45\n}, {\n  title: {\n    text: 'Others'\n  },\n\
    \  min: 0,\n  max: 45\n}]\n```\n\nvalueAxis 字段指定需要在图表上绘制的轴。这些轴的定义顺序与 series 字段中的顺序相同。min\
    \ 和 max 属性用于调整 valueAxes 选项。在前面的代码片段中，Windows 和 Linux 平台的 min 和 max 属性分别为 0 和\
    \ 60，这表示用于投影值的 y 轴将从 0 开始并延伸至 60。同样，对于其他两个平台，y 轴将从 0 到 45。\n\n当你执行页面时，你会注意到有一个水平轴（x\
    \ 轴），它指的是类别（年份数据），以及四个垂直轴（y 轴），它们指的是平台。所有四个指向平台的垂直轴都绘制在左侧。如果你想将其中一些垂直轴移动到右侧，则需要在\
    \ categoryAxis 选项中指定 axisCrossingValues 数组：\n\n```\ncategoryAxis: {\n    categories:\
    \ [2010, 2011, 2012, 2013, 2014],\n    axisCrossingValues: [0, 0, 5, 5]\n}\n```\n\
    \n在这里，axisCrossingValues 字段用于指定每个轴的交叉值。数组中的值用于指示每个系列的索引。零值表示轴对齐在左侧（无更改）；任何其他值都表示其从左侧开始的位置。在前面的示例中，值五用于将轴移动到右侧，因为索引零到四由类别\
    \ 2010 到 2014 使用。\n\n### 工作原理...\n\n当你执行页面而不指定 axisCrossingValues 字段时，各种轴将绘制在左侧，如下所示：\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_190_0.png)\n\n## Kendo UI DataViz\n\
    \n在这里，库开始按系列字段中定义的顺序绘制垂直轴，向左移动。在指定 axisCrossingValues 字段后，Mac 和 Others 系列的轴将移动到右侧，如下面的屏幕截图所示：\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_191_0.png)\n\n### 更多...\n\n使用多轴图表时，可以通过单击其图例来关闭系列。例如，当你单击\
