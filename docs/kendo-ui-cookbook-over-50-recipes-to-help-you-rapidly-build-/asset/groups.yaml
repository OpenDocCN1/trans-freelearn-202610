    \ collapsed. By adding a k-state-active class to one of the list items, one of\
    \ the panels can be set in the expanded state:\n\n```html\n<ul id=\"panelBar\"\
    >\n  <li class=\"k-state-active\">\n    Destinations\n    <li>\n      .\n    \
    \  .\n      .\n    </li>\n    .\n    .\n    .\n  </li>\n</ul>\n```\n\nThe next\
    \ configuration option that can be applied is the animation effects. An animation\
    \ effect can be applied when you expand the panel or collapse it. Also, you can\
    \ specify the duration of the animation effect as follows:\n\n```javascript\n\
    $(\"#panelBar\").kendoPanelBar({\n    expandMode: 'single',\n    animation: {\n\
    \        collapse: {\n            duration: 1000,\n            effects: \"fadeOut\"\
    \n        },\n        expand: {\n            duration: 1000,\n            effects:\
    \ \"fadeIn\"\n        }\n    }\n});\n```\n\nIn the preceding code snippet, the\
    \ animation configuration is specified, which details the animation effect that\
    \ should be applied when the panel is collapsed and expanded. Both collapse and\
    \ expand specify the duration property, which specifies the duration of the animation\
    \ effect in milliseconds. It also includes the effects property, which specifies\
    \ the type of animation effect that needs to be applied. For collapse, only the\
    \ fadeOut effect can be applied, whereas in expand, the possible values are fadeIn\
    \ and expandVertical.\n\n"
  mdcn: "\n\n## 工作原理...\n\n当页面执行时，只有带有标题的列表项会显示如下：\n\n![](img/2a66507445090790d34dc5588b56b24c_95_0.png)\n\
    \n你可以检查 DOM，会发现这些列表项没有内容。但是，有一个向下的箭头，指示该列表项包含一些内容。\n\n现在，当你点击其中任何一个列表项时，会向相应的\
    \ contentUrl 发送一个 Ajax 请求。该请求应返回应在列表项下显示的标记，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_96_0.png)\n\
    \n在运行时加载内容（而非预先加载）的优势在于，服务器返回的响应大小减小，因此显示页面所需的时间也随之减少。在许多场景中，PanelBar 包含多个部分，用户可能不会点击所有部分。在这些情况下，在运行时加载内容是理想的。\n\
    \n## 更多内容...\n\n在处理远程请求时，服务器可能需要更长时间来响应，或者服务可能不可用。在这些场景中，应向用户显示错误消息，或将其重定向到错误页面。\n\
    \n从用户点击列表标题到内容在相应面板中加载，会生成一系列事件。应用程序可以在初始化 PanelBar 小部件时为这些事件指定回调处理程序。\n\n让我们为\
    \ PanelBar 添加事件处理程序，并在 div 元素（以下代码中的 logContainer）中记录事件：\n\n```javascript\nvar\
    \ $logContainer = $('#log');\n$(\"#panelBar\").kendoPanelBar({\n    contentUrls:\
    \ [\n        \"PanelBar_Destinations.html\",\n        \"PanelBar_Flights.html\"\
    ,\n        \"PanelBar_Sights.html\"\n    ],\n    select: function(event) {\n \
    \       $logContainer.append($(event.item).find('> .k-link').text() + ' selected.\
    \ <br>');\n    },\n    expand: function(event) {\n        $logContainer.append($(event.item).find('>\
    \ .k-link').text() + ' expanded. <br>');\n    },\n    activate: function(event)\
    \ {\n        $logContainer.append($(event.item).find('> .k-link').text() + ' activated.\
    \ <br>');\n    },\n    contentLoad: function(event) {\n        $logContainer.append($(event.item).find('>\
    \ .k-link').text() + ' content loaded. <br>');\n    },\n    error: function(event)\
    \ {\n        $logContainer.append('Error occurred while loading, Status: ' + event.xhr.status);\n\
    \    }\n});\n```\n\n事件顺序如下：\n\n- 1. 当用户点击列表项时：select。\n- 2. 选中的列表项被展开：expand。\n\
    - 3. 发送 Ajax 请求并加载 Ajax 响应中的内容时：contentLoad。\n- 4. 选中的列表项被激活：activate。\n- 5. 如果从服务器加载内容时出错，则执行错误回调处理程序。\n\
    \n## 将 PanelBar 绑定到 DataSource 对象\n\nPanelBar 还可以通过在 DataSource 对象中指定内容来构建。DataSource\
    \ 可以是本地的，也可以指向返回 JSON 结构的远程服务。除了指定 PanelBar 中需要显示的数据外，DataSource 对象还可用于指定一些配置选项。在本示例中，我们将了解如何使用\
    \ DataSource 对象构建 PanelBar。\n\n## 如何操作...\n\n使用 kendoPanelBar 函数初始化 PanelBar 时，请指定\
    \ dataSource 选项：\n\n```javascript\n$(\"#panelBar\").kendoPanelBar({\n    dataSource:\
    \ [\n        {\n            text: \"Destinations\",\n            expanded: true,\n\
    \            items: [\n                {\n                    text: \"India\"\
    ,\n                    imageUrl: \"./images/India-Flag-icon.png\",\n         \
    \           cssClass: \"destinationData\"\n                }, {\n            \
    \        text: \"Australia\",\n                    imageUrl: \"./images/Australia-Flag-icon.png\"\
    ,\n                    cssClass: \"destinationData\"\n                }, {\n \
    \                   text: \"Indonesia\",\n                    imageUrl: \"./images/Indonesia-Flag-icon.png\"\
    ,\n                    cssClass: \"destinationData\"\n                }\n    \
    \        ]\n        }\n    ]\n});\n```\n\n在上述代码片段中，dataSource 配置选项指定了 PanelBar\
    \ 中需要显示的数据。text 属性指定 PanelBar 标题中显示的文本；配置选项 expanded 设置为 true 时，将展开面板以显示项目列表。items\
    \ 配置选项包含在面板展开时将显示的项目列表。items 配置中的每个对象除了应显示的文本外，还提及了 imageUrl 和 cssClass 属性。\n\n\
    在 DataSource 配置中，你还可以指定返回面板 HTML 内容的页面 URL：\n\n```javascript\ndataSource: [\n\
    \    .\n    .\n    .\n    {\n        text: \"Flights\",\n        contentUrl: \"\
    PanelBar_Flights.html\"\n    }\n]\n```\n\n在这里，contentUrl 选项指定应从中获取面板内容的 URL。当用户点击面板时，会向指定的\
    \ URL 发送请求，并将响应中接收到的 HTML 内容插入到面板中。\n\n## 工作原理...\n\n当你渲染页面时，PanelBar 将使用你在 DataSource\
    \ 中指定的数据填充。当你检查插入到 DOM 中的 HTML 标记时，你会看到 cssClass 属性中指定的类已添加到每个列表元素。此外，图像将插入到每个列表元素中，如下所示：\n\
    \n```html\n<li role=\"menuitem\" class=\"k-item k-state-default k-first destinationData\"\
    >\n    <span class=\"k-link\">\n        <img class=\"k-image\" alt=\"\" src=\"\
    ./images/India-Flag-icon.png\">\n        India\n    </span>\n</li>\n```\n\n##\
    \ 自定义 PanelBar\n\n有几个选项可用于自定义 PanelBar 小部件的行为。在本示例中，我们将了解如何设置 PanelBar 小部件的展开模式以及可以应用的动画效果。\n\
    \n## 如何操作...\n\nPanelBar 小部件的设计旨在占用页面更少的空间，同时向你显示所需内容。当你点击 PanelBar 小部件中的任何列表项时，它会展开以显示内容。现在，当你点击另一个列表项时，它也会展开以显示其内容。此时，PanelBar\
    \ 中有两个项目的内容正在显示。通过将 expandMode 属性设置为 single，列表中任何给定时间只能有一个项目保持展开状态：\n\n```javascript\n\
    $(\"#panelBar\").kendoPanelBar({\n    expandMode: 'single'\n});\n```\n\n默认情况下，expandMode\
    \ 属性的值为 multiple，因此会发生上述行为。\n\n> 如果展开的面板包含嵌套的元素列表，则展开模式不会应用于嵌套元素。\n\n当 PanelBar\
    \ 渲染时，所有面板都处于折叠状态。通过向列表项中的一个添加 k-state-active 类，可以将其中一个面板设置为展开状态：\n\n```html\n\
    <ul id=\"panelBar\">\n  <li class=\"k-state-active\">\n    Destinations\n    <li>\n\
    \      .\n      .\n      .\n    </li>\n    .\n    .\n    .\n  </li>\n</ul>\n```\n\
    \n下一个可以应用的配置选项是动画效果。在展开或折叠面板时可以应用动画效果。此外，你可以按如下方式指定动画效果的持续时间：\n\n```javascript\n\
    $(\"#panelBar\").kendoPanelBar({\n    expandMode: 'single',\n    animation: {\n\
    \        collapse: {\n            duration: 1000,\n            effects: \"fadeOut\"\
    \n        },\n        expand: {\n            duration: 1000,\n            effects:\
    \ \"fadeIn\"\n        }\n    }\n});\n```\n\n在上述代码片段中，指定了 animation 配置，详细说明了折叠和展开面板时应应用的动画效果。collapse\
    \ 和 expand 均指定了 duration 属性，该属性以毫秒为单位指定动画效果的持续时间。它还包括 effects 属性，该属性指定需要应用的动画效果类型。对于折叠，只能应用\
    \ fadeOut 效果，而对于展开，可能的值为 fadeIn 和 expandVertical。\n\n"
