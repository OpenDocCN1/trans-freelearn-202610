    DataSource object in building the map using the kendoMap function:


    ```

    $(''#chart'').kendoMap({

    center: [30.2681, -97.7448],

    zoom: 4,

    layers: [{

    type: ''shape'',

    dataSource: {

    type: ''geojson'',

    transport: {

    read: ''./geojson-us.json''

    }

    }

    }]

    });

    ```


