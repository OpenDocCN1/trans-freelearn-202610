    \ UI Cookbook\n\n# 关于 Packt Publishing\n\nPackt，发音为 'packed'，于 2004 年 4 月出版了其第一本书《Mastering\
    \ phpMyAdmin for Effective MySQL Management》，随后继续专注于出版关于特定技术和解决方案的高度聚焦书籍。\n\n\
    我们的书籍和出版物分享了您的 IT 专业同行在适应和定制当今系统、应用程序和框架方面的经验。我们的解决方案导向书籍为您提供知识和能力，以定制您正在使用的软件和技术来完成工作。Packt\
    \ 书籍比您过去见过的 IT 书籍更具体、更不笼统。我们独特的商业模式使我们能够为您带来更聚焦的信息，让您获得更多需要知道的内容，而减少不需要知道的内容。\n\
    \nPackt 是一家现代且独特的出版公司，专注于为开发者、管理员和新手社区制作高质量、前沿的书籍。如需更多信息，请访问我们的网站：www.packtpub.com。\n\
    \n# 关于 Packt Open Source\n\n2010 年，Packt 推出了两个新品牌，Packt Open Source 和 Packt Enterprise，以继续其专业化的专注。本书是\
