    # # Using client-side templates to generate HTML markup from a JSON data


    The concept of using a templating system with some data source to generate a dynamic
    web content has been around web development for a long time. Java Server Pages
    (Java), Smarty (PHP), and Django (Python) are examples of some of the server-side
    templating engines. Generating content at runtime used to be a server-side-only
    affair. In recent years, generating the content on the client side (on the browser)
    has been embraced.


    The dynamic applications that are being built today require the user interface
    to be updated frequently. This can be achieved by fetching the HTML fragment from
    the server and then inserting it into the document. However, this requires the
    server to generate such fragments as opposed to delivering complete web pages.
    In the client-side templating engine, the servers are responsible for sending
    only the dynamic data in the JSON format and then have the page assembled in the
    browser using a static client-side template. This template can be served from
    **Content Delivery Network (CDN)** instead of the same server that sends the dynamic
    data. The time taken to send the records in the form of JSON data and not generate
    the markup on the server side takes away more CPU cycles, thereby improving the
    performance of the application to a great extent. Consider a shopping cart application,
    which lists the products in the cart. The cart data can be sent to the client
    in the JSON format. Then, use templates to generate an HTML markup on the client
    side.


    There are various types of client-side templating engines to choose from; some
    of them are logic-less such as Mustache and Handlebars, some are based on the
    HAML syntax such as Jade, and some others are based on John Resig''s micro templating
    such as `underscore.js`.


    In Kendo UI, a microtemplating library is used, which is called hash templates.
    In these templates, hash symbols are used to mark regions in the template that
    will be executed when the template is used to generate dynamic content.


    # ## How to do it...


    The Kendo UI library exports an object, `kendo`, which is a namespace for various
    other objects and functions. The template function is one of them. The template
    function compiles hash-based templates into functions that can be evaluated for
    rendering. It is useful to render complicated bits of HTML from a JSON data source.
    The following are the three hash-based syntaxes:


    +   - The syntax to render literal values is #= #


    +   - The syntax to render HTML-encoded values is #: #


    +   - The syntax to execute arbitrary JavaScript code is # `for (...)` #'
