    ''Captain Phillips'', ''American Hustle'',

    ''The Wolf Of Wall Street'', ''Nebraska'',

    ''Dallas Buyers Club'', ''Philomena''];

    $(\''#listViewContainer\'').kendoMobileListView({

    dataSource: listElements

    });

    ```


    The **listElements** array contains a set of strings that will then be used as
    a dataSource to populate the ListView widget. The `kendoMobileListView` function
    is used to initialize the list element. The `dataSource` option is specified when
    initializing the widget.


    Alternatively, `dataSource` can also refer to a remote service that returns an
    array of strings:


    ```

    $(\''#listViewContainer\'').kendoMobileListView({

    dataSource: {

    transport: {

    read: \''/services/listViewService\''

    }

    }

    });

    ```


    # How it works...


    When you render the page, the ListView widget is initialized and is populated
    with data that is present in the array. If `DataSource` refers to a service URL,
    a `GET` request is sent to the service and the data returned by the service is
    used to populate the ListView widget.


