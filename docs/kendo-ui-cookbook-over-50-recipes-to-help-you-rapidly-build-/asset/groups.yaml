    \ data-icon 属性设置为 battery。你可以为 data-icon 属性指定以下值：about、action、add、bookmarks、camera、cart、compose、contacts、details、downloads、fastforward、favorites、featured、toprated、globe、history、home、info、more、mostrecent、mostviewed、organize、pause、play、recents、refresh、reply、rewind、search、settings、share、stop\
    \ 和 trash。\n\n当你渲染页面时，你会看到每个列表元素右侧都添加了详情按钮。\n\n![](img/2a66507445090790d34dc5588b56b24c_145_0.png)\n\
    \n你还可以通过将 `data-icon` 属性的值指定为 `custom` 并将 `km-custom` 类添加到 CSS 样式表来添加自定义图标。\n\n\
    ## 将 ListView 小部件绑定到 DataSource 对象\n\n如前一节所述，ListView 小部件可以通过在标记中指定列表元素或将其绑定到\
    \ `DataSource` 对象来创建。在本节中，我们将了解如何使用 `DataSource` 对象填充 ListView。\n\n### 操作方法...\n\
    \n让我们创建一个空列表，然后使用来自 `DataSource` 对象的数据对其进行填充：\n\n```html\n<ul id=\"listViewContainer\"\
    > </ul>\n```\n\n请注意，无序列表未指定 `data-role` 属性。可以通过在 DOM 元素上调用 `kendoMobileListView`\
    \ 函数来初始化 ListView 小部件：\n\n```javascript\nvar listElements = ['Her', 'Gravity',\
    \ '12 Years A Slave',\n'Captain Phillips', 'American Hustle',\n'The Wolf Of Wall\
    \ Street', 'Nebraska',\n'Dallas Buyers Club', 'Philomena'];\n$('#listViewContainer').kendoMobileListView({\n\
    dataSource: listElements\n});\n```\n\n**listElements** 数组包含一组字符串，这些字符串将用作 dataSource\
    \ 来填充 ListView 小部件。`kendoMobileListView` 函数用于初始化列表元素。`dataSource` 选项在初始化小部件时指定。\n\
    \n或者，`dataSource` 也可以指向返回字符串数组的远程服务：\n\n```javascript\n$('#listViewContainer').kendoMobileListView({\n\
    dataSource: {\ntransport: {\nread: '/services/listViewService'\n}\n}\n});\n```\n\
    \n### 工作原理...\n\n当你渲染页面时，ListView 小部件会被初始化，并使用数组中存在的数据进行填充。如果 `DataSource` 指向服务\
    \ URL，则会向服务发送 `GET` 请求，并使用服务返回的数据来填充 ListView 小部件。\n\n| 2014 年奥斯卡最佳影片提名 |\n|-------------------------------------|\n\
    | Her                                 |\n| Gravity                           \
    \  |\n| 12 Years A Slave                    |\n| Captain Phillips            \
    \        |\n| American Hustle                     |\n| The Wolf Of Wall Street\
    \             |\n| Nebraska                            |\n| Dallas Buyers Club\
    \                  |\n| Philomena                           |\n\n### 更多...\n\n\
    在前一节中，我们使用数组中的值填充了 ListView 小部件。你还可以提供一个模板，在使用 DataSource 对象填充列表时使用该模板。\n\n让我们创建一个对象数组，其中每个对象包含两个属性，name\
    \ 和 image，如下所示：\n\n```javascript\nvar listElements = [\n{name: 'Her', image: 'her.jpg'},\n\
    {name: 'Gravity', image: 'gravity.jpg'},\n{name: '12 Years A Slave', image: '12_years_a_slave.jpg'},\n\
    {name: 'Captain Phillips', image: 'captain_phillips.jpg'},\n{name: 'American Hustle',\
    \ image: 'american_hustle.jpg'},\n{name: 'The Wolf Of Wall Street',\nimage: 'wolf_of_wall_street.jpg'},\n\
    {name: 'Nebraska', image: 'nebraska.jpg'},\n{name: 'Dallas Buyers Club',\nimage:\
    \ 'dallas_buyers_club.jpg'},\n{name: 'Philomena', image: 'philomena.jpg'}\n];\n\
    ```\n\n下一步是创建一个模板，在填充列表时将使用该模板：\n\n```html\n<script type=\"text/x-kendo-template\"\
    \ id=\"list-template\">\n<a>\n<img src=\"./images/#= image #\" />\n#= name #\n\
    </a>\n</script>\n```\n\n该模板为 image 和 name 属性指定了占位符。现在，当你初始化小部件时，除了指定 dataSource\
    \ 属性外，还要指定 template 属性：\n\n```javascript\n$('#listViewContainer').kendoMobileListView({\n\
    \ dataSource: listElements,\n template: $('#list-template').html()\n});\n```\n\
    \n这里的 template 属性包含对先前指定的模板（id=#list-template）的引用；该模板针对 dataSource 对象中存在的数据进行编译。对于\
    \ dataSource 对象中的每个对象，都会生成一个列表元素并将其追加到 ListView 小部件中。\n\n## 当用户滚动列表时修复标题\n\nListView\
    \ 小部件中的项目可以按属性分组。例如，假设列表包含你目录中的一组姓名或联系人。这些联系人可以按联系人名称开头的字母进行分组。当你渲染列表时，你会看到这些联系人已分组，并且在滚动时，标题是固定的。\n\
    \n### 操作方法...\n\n要创建固定标题，即按特定属性分组的数据，集合或数组中的每个对象都应包含该属性。让我们创建一个示例数组，其中每个对象包含两个属性，`name`\
    \ 和 `startsWith`；`startsWith` 属性将用于对列表中的姓名进行分组：\n\n```javascript\nvar actors =\
    \ [\n    { \"name\": \"Leonardo DiCaprio\", \"startsWith\": \"L\" },\n    { \"\
    name\": \"Johnny Depp\", \"startsWith\": \"J\" },\n    { \"name\": \"Al Pacino\"\
    , \"startsWith\": \"A\" },\n    { \"name\": \"Bradley Cooper\", \"startsWith\"\
    : \"B\" },\n    { \"name\": \"Tom Cruise\", \"startsWith\": \"T\" },\n    { \"\
    name\": \"Jude Law\", \"startsWith\": \"J\" },\n    { \"name\": \"Robert Downey\
    \ Jr.\", \"startsWith\": \"R\" },\n    { \"name\": \"Will Smith\", \"startsWith\"\
    : \"W\" },\n    { \"name\": \"Robert De Niro\", \"startsWith\": \"R\" },\n   \
    \ { \"name\": \"Antonio Banderas\", \"startsWith\": \"A\" },\n    { \"name\":\
    \ \"Christian Bale\", \"startsWith\": \"C\" },\n    { \"name\": \"Brad Pitt\"\
    , \"startsWith\": \"B\" },\n    { \"name\": \"Tom Hanks\", \"startsWith\": \"\
    T\" },\n    { \"name\": \"Robert Pattinson\", \"startsWith\": \"R\" },\n    {\
    \ \"name\": \"Ben Stiller\", \"startsWith\": \"B\" }\n];\n```\n\n请注意，列表不是按排序顺序排列的；我们将使用此列表作为\
    \ ListView 小部件的 `DataSource`：\n\n```javascript\nfunction mobileListViewInit()\
    \ {\n    $('#listViewContainer').kendoMobileListView({\n        dataSource: kendo.data.DataSource.create({\n\
    \            data: actors,\n            group: 'startsWith'\n        }),\n   \
    \     template: '#= name #',\n        fixedHeaders: true\n    });\n}\n```\n\n\
    在前面的代码片段中，mobileListViewInit 函数用于初始化 ListView 小部件。当包含 ListView 小部件的视图被初始化时，将调用此函数。视图应指定\
    \ data-init 属性，该属性引用 mobileListViewInit 函数作为其值。dataSource 属性用于提供输入数据（引用 actors\
    \ 数组），并且还指定 group 属性，其值为 startsWith。除了 dataSource 属性外，列表视图的初始化还包含 template 和 fixedHeaders\
    \ 属性。fixedHeaders 属性用于在用户滚动列表时修复每个列表组的标题。\n\n### 工作原理...\n\n当 ListView 小部件被初始化时，数组中的姓名将按\
    \ startsWith 属性分组，你将看到姓名按升序排列，即按字母顺序列出，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_149_0.png)\n\
    \n现在，当用户向下滚动时，你会看到相应的标题固定在顶部，指示列表顶部的当前列表是特定组的列表。\n\n![](img/2a66507445090790d34dc5588b56b24c_150_0.png)\n\
    \n在前面的屏幕截图中，用户已向下滚动，但标题位于页面顶部，指示当前列表以字母 A 开头。fixedHeaders 属性将在用户向下滚动列表时修复标题。\n\
    \n## 筛选 ListView 中的元素\n\nListView 小部件可以包含多个列表元素，滚动整个列表以找到所需的列表元素会很耗时。例如，考虑你的联系人列表；要找到特定联系人，需要多次滚动。为了消除这一问题，你可以添加一个筛选器，并使用它来检索与输入文本匹配的所需列表元素。\n\
    \n### 操作方法...\n\n让我们考虑一个扁平数据源，即包含字符串列表的数组：\n\n```javascript\nvar listElements\
    \ = ['Leonardo DiCaprio', 'Johnny Depp',\n'Bradley Cooper', 'Al Pacino',\n'Tom\
    \ Cruise','Jude Law',\n```\n\n"
