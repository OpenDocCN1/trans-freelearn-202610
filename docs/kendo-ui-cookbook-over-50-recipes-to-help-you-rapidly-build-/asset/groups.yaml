    defaultLayout\">\n<div\nid=\"touchSurface\"\ndata-role=\"touch\"\ndata-enable-swipe=\"\
    1\"\ndata-touchstart=\"touchstart\"\ndata-swipe=\"swipe\"\ndata-tap=\"tap\"\n\
    data-doubletap=\"doubletap\"\ndata-hold=\"hold\"\nstyle=\"height: 200px;\">\n\n\
    Touch Surface\n\n</div>\n</div>\n```\n\nIn addition to the data-role attribute\
    \ being set to touch, the widget includes various data attributes that specify\
    \ the touch event handlers. This includes touchstart, swipe, tap, double tap,\
    \ and hold. The value assigned to these data attributes are names of the event\
    \ handlers. These event handlers would be defined in the script tag. Notice that\
    \ there is an attribute, data-enable-swipe, set to 1, indicating that the swipe\
    \ feature is enabled:\n\n```javascript\nvar app = new kendo.mobile.Application();\n\
    \nfunction touchstart(event) {\nconsole.log('Event - Touch Start' + \" X=\" +\
