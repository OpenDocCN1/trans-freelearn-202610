  mdcn: "\n\n提到的 geoJSON 数据包含与地图上的点对应的坐标。这些点将用于构建矢量形状。geoJSON 数据还列出了 NAME 和 CENSUSAREA\
    \ 等其他属性。让我们使用之前的 JSON 数据作为 DataSource 对象，通过 kendoMap 函数构建地图：\n\n```javascript\n\
    $('#chart').kendoMap({\ncenter: [30.2681, -97.7448],\nzoom: 4,\nlayers: [{\ntype:\
    \ 'shape',\ndataSource: {\ntype: 'geojson',\ntransport: {\nread: './geojson-us.json'\n\
    }\n}\n}]\n});\n```\n\n在这里，type 属性设置为 shape，并指定了 dataSource，它指向包含 geoJSON 数据的文件。框架将解析\
    \ geoJSON 数据，并引用坐标来构建地图。\n\n我们可以使用 geoJSON 数据中存在的其他属性，并为地图添加一些功能。例如，我们可以将 CENSUSAREA\
    \ 字段转换为十六进制数，并使用它来填充形状：\n\n```javascript\n$('#chart').kendoMap({\ncenter: [30.2681,\
    \ -97.7448],\nzoom: 4,\nlayers: [{\ntype: 'shape',\ndataSource: {\ntype: 'geojson',\n\
    transport: {\nread: './geojson-us.json'\n}\n}\n}]),\nshapeCreated: function (e)\
    \ {\nvar shapeColor = parseInt(e.shape.dataItem.properties.\nCENSUSAREA, 16).toString();\n\
    shapeColor = '#' + ('FFFFFF' + shapeColor).slice(-6);\ne.shape.fill(shapeColor);\n\
    }\n});\n```\n\n在前面的代码片段中，添加了 shapeCreated 函数，每当向地图添加形状时都会调用该函数。\n\n## 工作原理...\n\
    \n当你渲染页面时，你将看到一个包含形状的地图，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_238_0.png)\n\
    \n在使用 shapeCreated 函数为形状添加颜色后，你将看到一张彩色地图。\n\n![](img/2a66507445090790d34dc5588b56b24c_238_1.png)\n\
    \n形状是通过将 CENSUSAREA 字段值转换为十六进制数，然后添加前缀使其成为固定长度来计算的。\n\n## 索引\n\n### A\n\n- **ActionSheet\
    \ widget**\n  - 关于 130\n  - 用于显示操作列表 150-153\n- **activate event 86**\n- **advance\
    \ charting widgets**\n  - 用于数据可视化 193\n- **aggregate functions**\n  - avg function\
    \ 183\n  - count function 183\n  - first function 183\n  - max function 183\n\
    \  - min function 183\n  - 用于在图表上显示数据 181-184\n- **Ajax**\n  - 用于加载模态窗口内容 104\n\
    \  - 用于加载 PanelBar 内容 83-86\n- **Application object**\n  - 用于在多个视图之间导航 121-125\n\
    - **autoUpload property 95**\n- **avg function 183**\n\n### B\n\n- **barcode image**\n\
