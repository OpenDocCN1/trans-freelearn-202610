    \ 属性设置为 insert-bottom，工具提示设置为 k-insert-bottom。\n\n同样，当元素移动到不同节点时，你会注意到工具提示会发生变化，指示拖动的元素（sourceNode）将被添加到\
    \ TreeView 中的一个节点。\n\n![](img/2a66507445090790d34dc5588b56b24c_68_0.png)\n\n请注意前面屏幕截图中的工具提示；它指示该元素正在被添加到\
    \ Directory3。放下元素后，父节点将展开以显示其内容。\n\n![](img/2a66507445090790d34dc5588b56b24c_68_1.png)\n\
    \n### 更多...\n\n在许多场景中，你可能希望树中的某个节点不接受来自任何其他元素的放置。在这种情况下，可以使用 drop 事件监听器来防止来自树中任何节点的放置：\n\
