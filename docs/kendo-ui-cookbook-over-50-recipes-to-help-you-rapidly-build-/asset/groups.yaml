    # # Binding the ListView widget to a DataSource object


    As mentioned in the previous recipe, a ListView widget can be created either by
    specifying the list elements in the markup or by binding it to a `DataSource`
    object. In this recipe, we will look at how ListView is populated using the `DataSource`
    object.


    # ## How to do it...


    Let''s create an empty list that will then be populated with data from a `DataSource`
    object:


    ```

