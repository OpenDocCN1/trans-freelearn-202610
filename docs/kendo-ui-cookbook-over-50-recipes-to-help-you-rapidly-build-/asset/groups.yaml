    # # Creating, updating, and deleting in Grid


    Editing the records right within the Grid is another common task. The Kendo UI
    Grid allows users to edit the content in the Grid, which is similar to editing
    the cells in an Excel sheet. There are two modes, inline and popup, in which a
    single row in a Grid can be edited. The inline editing turns the cell into a text-input
    field and provides options to update the record. In the popup editing, a pop up
    that contains the same fields is shown, and it allows users to save the selected
    record.


    In addition to editing rows in the Grid, the library also allows you to delete
    and add records to the Grid. These actions—Create, Read, Update, and Delete—are
    mapped to a remote service that can process these requests. A common paradigm
    used in web development is to provide a RESTful web service. A RESTful service
    provides a single endpoint URL and provides resources that get invoked based on
    the http method mentioned in the request.


    # # How to do it...


    To enable editing of rows in a Grid, set the editable attribute to either inline
    or popup:

    editable: ''inline''


    This will enable the inline editing. The next step is to add Edit and Delete action
    buttons for each row. In the columns configuration, you can define commands that
    can be applied to each row in the Grid. There are two built-in commands, namely
    edit and delete.


    The edit command enables the editing of the row by turning the fields in the row
    to input fields. The delete command, on the other hand, deletes the selected row
    using the following code snippet:

    columns: [{

    field : ''movieName'',

    title : ''Movie'',

    }, {'
  - "[PAGE 51]\n\n```\nfield : 'year',\n title : 'Year'\n},{{\n field : 'rating',\n\
    \ title : 'Rating'\n}},{\n command: ['edit', 'destroy']\n}}\n]\n```\n\nHere, the\
    \ `columns` configuration lists the various fields and mentions the `edit` and\
