    ### 简介\n\nKendo UI PanelBar 小部件类似于包含分组在不同选项卡或窗格下的项目列表的选项卡式面板。在 PanelBar 中，这些项目列表是垂直堆叠的，每个列表项都可以展开以显示内容。当数据可以分组为多个部分且可用于显示这些数据的空间受到限制时，此小部件特别有用。例如，你的所有联系人都可以按某个类别（如\
    \ **Favourites**、**Family**、**Friends** 和 **Office Contacts**）分组；当你点击其中一个类别时，面板将展开以显示属于该类别的联系人列表。\n\
    \n### 创建 PanelBar\n\nPanelBar 可以通过在 HTML 标记中指定其结构，或通过使用 API 进行配置来创建。在本配方中，我们将介绍前一种方法。\n\
    \n### 如何操作...\n\nPanelBar 小部件包含垂直堆叠的项目列表。要创建 PanelBar，我们需要一个项目列表，因此使用 HTML 的有序列表或无序列表。在此示例中，我们将列出旅游目的地、航空公司和要参观的重要景点作为三个面板：\n\
    \n```\n`<ul id=\"panelBar\" style=\"width: 400px\">\n\t<li>\n\tDestinations\n\t\
    </li>\n\t<li>\n\tFlights\n\t</li>\n\t<li>\n\tImportant Sights\n\t</li>\n</ul>`\n\
    ```\n\n这里，列表包含三个项目，这些是我们希望每个面板的标题。此外，width 属性设置为 400px，这将设置 PanelBar 组件的宽度。如果未指定\
    \ width 属性，则 PanelBar 将占据整个屏幕宽度，这并不理想。\n\n前面的面板尚未列出任何内容。让我们在 HTML 标记中为每个面板指定内容：\n\
    \n```\n`<ul id=\"panelBar\" style=\"width: 400px\">\n\t<li>\n\tDestinations\n\t\
    <div class=\"destinationData\">\n\t<h2>India</h2>\n\t<img src=\"./images/India-Flag-icon.png\"\
    \ />\n\t</div>\n\t<div class=\"destinationData\">\n\t<h2>Australia</h2>\n\t<img\
    \ src=\"./images/Australia-Flag-icon.png\" />\n\t</div>\n\t<div class=\"destinationData\"\
    >\n\t<h2>Indonesia</h2>\n\t<img src=\"./images/Indonesia-Flag-icon.png\" />\n\t\
    </div>\n\t</li>\n\t<li>\n\tFlights\n\t<div class=\"destinationData\">\n\tBritish\
    \ Airways\n\t</div>\n\t<div class=\"destinationData\">\n\tAir France\n\t</div>\n\
    \t<div class=\"destinationData\">\n\tLufthansa Airlines\n\t</div>\n\t<div class=\"\
    destinationData\">\n\tSingapore Airlines\n\t</div>\n\t<div class=\"destinationData\"\
    >\n\tQatar Airways\n\t</div>\n\t</li>\n\t<li>\n\tImportant Sights\n\t<div class=\"\
    destinationData\">\n\t<h2>Taj Mahal</h2>\n\t<img src=\"./images/TajMahal.jpg\"\
    \ />\n\t</div>\n\t<div class=\"destinationData\">\n\t<h2>Sydney Opera House</h2>\n\
    \t<img src=\"./images/OperaHouse.jpg\" />\n\t</div>\n\t<div class=\"destinationData\"\
    >\n\t<h2>Tanah Lot Temple</h2>\n\t<img src=\"./images/TanahLot.jpg\" />\n\t</div>\n\
    \t</li>\n</ul>`\n```\n\n### Kendo Ui PanelBar\n\n在前面的 HTML 标记中，每个列表项包含标题和内容，当用户单击\
    \ PanelBar 中的某个项目时，需要显示这些内容。\n\n> 前面代码片段中使用的 destinationData 类仅用于样式设置。\n\n最后一步是初始化\
    \ PanelBar 小部件。要初始化，请在列表上调用 kendoPanelBar 函数，如下所示：\n\n```\n$(\"#panelBar\").kendoPanelBar();\n\
    ```\n\n### 工作原理...\n\n最初，当列表仅包含标题时，你将看到三个垂直堆叠的窗格，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_91_0.png)\n\
    \n当你向列表中的每个项目添加内容时，你将看到列表中每个标题旁有一个向下箭头，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_91_1.png)\n\
    \n现在，当你单击其中一个标题时，列表项将展开以显示其内容，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_92_0.png)\n\
    \n### 更多...\n\n在前面的示例中，列表元素遵循单层级层次结构。PanelBar 可以自定义以处理多层级层次结构数据。前面的示例现在可以包含每个旅游目的地的重要城市。在这种情况下，国家名称将作为嵌套面板元素：\n\
    \n```\n`<ul id=\"panelBar\" style=\"width: 400px\">\n<li>\nDestinations\n<ul>\n\
    <li>\n<span>India</span>\n<div class=\"destinationData\">\n<span>Bangalore</span>\n\
    </div>\n<div class=\"destinationData\">\n<span>New Delhi</span>\n</div>\n<div\
    \ class=\"destinationData\">\n<span>Mumbai</span>\n</div>\n</li>\n</ul>\n</li>\n\
    </ul>\n<ul>\n<li>\n<span>Australia</span>\n<div class=\"destinationData\">\n<span>Sydney</span>\n\
    </div>\n<div class=\"destinationData\">\n<span>Melbourne</span>\n</div>\n<div\
    \ class=\"destinationData\">\n<span>Cairns</span>\n</div>\n</li>\n</ul>\n</li>\n\
    <li>\nFlights\n</li>\n<li>\nImportant Sights\n</li>\n</ul>`\n```\n\n在前面的代码片段中，第一个列表项包含嵌套列表元素，每个嵌套列表元素包含一些内容，如下面的屏幕截图所示：\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_93_0.png)\n\n与它们的父列表元素一样，每个子列表元素都有一个标题，用户可以单击该标题以展开内容。\n\
    \n### 使用 Ajax 加载 PanelBar 的内容\n\n在前面的配方中，我们了解了如何使用页面中存在的标记创建 PanelBar 小部件。在本配方中，我们将了解如何通过从服务器使用\
    \ Ajax 获取内容来加载 PanelBar 中每个列表项的内容。\n\n如前面的配方中所观察到的，每个列表项的内容都包裹在 div 元素内。这样做会增加页面大小，从而可能影响应用程序的性能。解决此问题的方法是在使用\
    \ Ajax 请求时加载每个列表项的内容。\n\n#### 如何操作...\n\n让我们考虑相同的示例；在这里，列表标题在标记中指定，div 元素用作占位符。这些占位符将在运行时包含从服务器获取的数据：\n\
    \n```\n<ul id=\"panelBar\" style=\"width: 400px\">\n  <li>\n    Destinations\n\
    \    <div></div>\n  </li>\n  <li>\n    Flights\n    <div></div>\n  </li>\n  <li>\n\
    \    Important Sights\n    <div></div>\n  </li>\n</ul>\n```\n\n这里，使用占位符 div 元素，以便在初始化\
    \ PanelBar 时，列表标题将显示向下箭头，指示它是可展开的。\n\n下一步是创建包含列表中每个标题内容的 HTML 文件。例如，要填充前面列表中的\
    \ Destinations 列表，请创建 PanelBar_Destinations.html 文件：\n\n```\n<div class=\"destinationData\"\
    >\n  <h2>India</h2>\n  <img src=\"./images/India-Flag-icon.png\" />\n```\n\n"
