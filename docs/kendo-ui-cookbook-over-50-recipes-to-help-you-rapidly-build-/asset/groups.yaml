  - '[PAGE 106]


    Here, the async configuration specifies the three attributes: saveUrl, removeUrl,
    and autoUpload. The saveUrl property specifies the service URL where the files
    will be uploaded. The removeUrl property specifies the service URL that will handle
    the removal of the uploaded files. The Boolean autoUpload property specifies whether
    the files will be uploaded when they are selected by the user or when the user
    clicks on the Submit button. In this example, this is set to true, which means
    that the files will be uploaded to the server when the user selects the file.


    When you select multiple files using the file uploader widget, each file is uploaded
    asynchronously. The client sends a POST request with the file data in the request
    payload. It uses the XmlHttpRequest object to send an asynchronous POST request
    to saveUrl.


    # How it works...


    When you select multiple files using the file uploader widget, a POST request
    is sent to the service mentioned in the saveUrl property for each selected file,
    as shown in the following screenshot:


    ![](img/2a66507445090790d34dc5588b56b24c_106_0.png)


    Here, three files have been selected, and each file is being uploaded asynchronously.
    While the files are being uploaded, the widget shows you the progress of the upload
    process. The file uploader widget uses the XmlHttpRequest object to upload the
    files to the server. With enhancements in the XmlHttpRequest object in HTML5,
    the file uploader widget uses the progress callback handler to track the progress
    of the file that is being uploaded.


    Also, notice that the status—Uploading is shown in the top-right corner while
    the selected files are being uploaded. When all the files in the list are uploaded,
    the status is changed to Done.


    ![](img/2a66507445090790d34dc5588b56b24c_106_1.png)'
  - '[PAGE 107]


    Once these files are uploaded, the user can delete them by clicking on the cross
    (x) button. This will send a POST request to the service mentioned in the `removeUrl`
    property.


    If there is an error in uploading the file, the uploader widget indicates this
    by marking the background color as red. It also provides you with an option to
    retry the file upload.


    ![](img/2a66507445090790d34dc5588b56b24c_107_0.png)


    On clicking on **retry**, a POST request is sent to the URL specified in the `saveUrl`
    property.


    When you try to remove a file from the list after the file is uploaded, a POST
    request is sent to the service URL mentioned in `removeUrl`. If you would like
    to use a different HTTP method to remove the uploaded file, then set the `removeVerb`
    property in the `async` configuration:


    ```

    $(''#fileUpload'').kendoUpload({

    async: {

    ''saveUrl'': ''/fileUploadService/save'',

    ''removeUrl'': ''/fileUploadService/remove'',

    ''autoUpload'': true,

    ''removeVerb'': ''DELETE''

    }

    });

    ```


    Here, the `removeVerb` property is set to `DELETE`, and when the user tries to
    remove the file, a `DELETE` request is sent instead of a POST request.


    # ## There''s more...


    The file uploader widget can be localized to show a different string at various
    places in the widget. Also, in modern browsers, users can drag-and-drop files
    onto the file uploader widget.'
