    \nIf there is an error in uploading the file, the uploader widget indicates this\
    \ by marking the background color as red. It also provides you with an option\
    \ to retry the file upload.\n\n![](img/2a66507445090790d34dc5588b56b24c_107_0.png)\n\
    \nOn clicking on **retry**, a POST request is sent to the URL specified in the\
