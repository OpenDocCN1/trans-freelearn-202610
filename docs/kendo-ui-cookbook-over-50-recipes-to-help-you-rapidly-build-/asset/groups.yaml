    The next step is to specify the tooltip option that contains fields that will
    be used to display

    a tooltip when the user hovers over a data item in the series, using the following
    code snippet:


    ```

    tooltip: {

    visible: true,

    template: ''#= dataItem.feature #'',

    background: ''#0F0''

