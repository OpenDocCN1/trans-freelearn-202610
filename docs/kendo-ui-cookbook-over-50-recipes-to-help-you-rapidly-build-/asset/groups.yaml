    \ {\nconsole.log('Event - Tap');\n}\nfunction doubletap(event) {\nconsole.log('Event\
    \ - Double tap');\n}\nfunction hold(event) {\nconsole.log('Event - Hold');\n}\n\
    function swipe(event) {\nconsole.log('Swipe direction ' + event.direction);\n\
    }\n```\n\n## How it works...\n\nThe `touchstart` event is invoked when the user\
    \ touches the surface. The event object available in the `touchstart` event handler\
    \ can be used to determine the x and y coordinates where the touch was triggered.\
    \ The `tap` event is invoked when the user taps on the screen, that is, after\
    \ lifting the finger from the touch screen. Similarly, a `doubletap` event is\
    \ invoked when the user taps on the screen twice in quick succession. If the user\
    \ touches the screen and does not lift his finger for a few seconds, then the\
    \ `hold` event is fired. The `swipe` event is fired when the users swipes his\
