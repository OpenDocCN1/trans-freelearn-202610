    # # 8 Kendo UI Mobile Framework


    In this chapter, we will cover the following recipes:


    +   - Creating a layout and adding views to the layout

    +   - Setting the initial layout and view when initializing the application

    +   - Using the Application object to navigate to various views

    +   - Adding touch events to your mobile application


    # ## Introduction


    In the earlier recipes, we looked at various components available in the Kendo
    UI library that enable you to build web applications rapidly. In the upcoming
    recipes, we will take a look at the Kendo UI Mobile library that provides an application
    framework and a set of widgets that enable you to build mobile applications quickly.
    The Kendo UI Mobile framework renders the application by providing a native look
    and feel on various mobile platforms, which includes iOS, Android, Blackberry,
    and Windows Phone 8. The developers can focus on delivering functionality and
    depend on the Mobile framework to provide the native look and feel of various
    platforms, thereby reducing the development effort and maintaining the same code
    base for all the platforms.'
