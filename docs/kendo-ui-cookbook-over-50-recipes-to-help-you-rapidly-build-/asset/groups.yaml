    ## About the Author


    **Sagar Ganatra** is a frontend architect from Bangalore, India. He is an expert
    in building web applications using modern web technologies such as HTML5, CSS3,
    Object-Oriented JavaScript, Kendo UI, jQuery, and JavaScript frameworks such as
    BackboneJS, RequireJS, and AngularJS. He also writes about these technologies
    in his blog at `http://www.sagar ganatra.com/`. This is his second book; his previous
    book is _Instant Kendo UI Mobile_, _Packt Publishing_, which was published in
    2013. When he is not coding, he enjoys writing short stories, swimming, and reading
    books.


    > I dedicate this book to my extraordinary parents, Tara Ganatra and Harshad Rai
    Ganatra, two of the greatest and wisest teachers in my life.

    >

    > I also dedicate this book to my brother, Santosh Ganatra, and sister-in-law,
    Nisha Ganatra, for always standing by my side and encouraging me to write this
    book.


    ## About the Reviewers


    **Sergey N. Bolshchikov** is a senior frontend engineer at New Prolmage (Agfa),
    working on a large-scale, client-side application of workflow systems software
    for publishing houses. He also serves as a co-organizer of the Ember-IL meet-up
    group in Tel Aviv, Israel. He holds an MSc degree in Information Systems from
    Technion – Israel Institute of Technology.


    **Austin Christenberry** has experience working with technologies such as ASP.NET,
    T-SQL, Knockout.js, and Kendo UI. He currently works for Credera, a management
    and technology solutions firm based in Dallas, Texas. He graduated from Baylor
    University in Waco, Texas, in 2012 with a Bachelor of Science degree in Applied
    Mathematics. In his free time, he enjoys playing tennis and discovering new shows
    on Netflix.


    > I would like to thank my beautiful wife, Len, for supporting me in reviewing
    this book, along with everything else I do.


    **David J. McClelland** has been creating cutting-edge software and content that
    bridges design, development, and information for over 20 years. He is currently
    a Principle User Interface Engineer developing software to manage distributed
    devices via the cloud. He has been a technical reviewer for _Instant Kendo UI
    Mobile_, _Sagar Ganatra_, _Packt Publishing_.


    > I would like to thank my family for encouraging my many technical and artistic
    interests.


    Omkar Patil is currently working as a senior architect in the Global Technology
    and Architecture group of SunGard. He has 14 years experience in architecture,
    design, and development of web applications. Starting with server-side Enterprise
    Java, he has shifted focus to frontend development of web and mobile applications
    in the last few years. His current skill set consists of JavaScript, jQuery, Kendo
    UI, AngularJS, and Node.js. In his spare time, he enjoys reading, playing with
    new technologies, and contributing to open source software. He is a committer
    of the Angular-Kendo project that integrates Kendo UI with AngularJS (https://github.com/kendo-labs/angular-kendo).


    > I would like to thank my wife, Anu, for her support and encouragement over the
    past 12 years. I would also like to mention my daughter, Rewa, who at seven years
    of age, has already started coding and keeps me on my toes with her programming
    questions.


    Radu Poenaru has over 12 years experience in software engineering, ranging from
    desktop to web and mobile applications. As a freelancer based in Frankfurt, Germany,
    he focuses his skills to deliver solutions for the complete life cycle of a website,
    including architecture and user experience—in the frontend using HTML5 and CSS3
    and enhanced by JavaScript libraries such as jQuery, Knockout.js, Kendo UI, AngularJS,
    RequireJS, Modernizr, and Bootstrap; and in the backend using ASP.NET, MVC pattern
    (including Single-Page applications), Entity Framework, and Microsoft SQL. He
    discusses these and other software subjects on his blog at http://www.radu poenaru.com
    or on his company''s website at http://www.itbrainiacs.com.


