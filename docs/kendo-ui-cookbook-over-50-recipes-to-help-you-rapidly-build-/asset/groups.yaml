    you can visit http://www.packtpub.com/support and register to have the files e-mailed
    directly to you.


    Here, the #= <literal> # expression is used. Similarly, we can also use a hash-based
    expression to render HTML-encoded values:


    ```

    <script>


    var template = kendo.template("Full Name: <span> #= lastName ## </span>, <span>
    #= firstName # </span>");

    var data = {};


    data.lastName = "<b>Smith</b>";

    data.firstName = "<i>Todd</i>";


    var result = template(data);


    $('' .addressContainer'').append(result);


    </script>

    ```


