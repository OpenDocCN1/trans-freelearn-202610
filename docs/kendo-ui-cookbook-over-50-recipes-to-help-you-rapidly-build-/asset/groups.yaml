    \n单击 **刷新** 按钮时，您会注意到向 `content` 属性中指定的同一 URL 发送了异步请求。请注意，窗口本身在标题栏中没有操作按钮。单击任何按钮时，都会调用相应的操作。\n\
    \n## 8 Kendo UI Mobile 框架\n\n在本章中，我们将介绍以下配方：\n\n- 创建布局并将视图添加到布局中\n- 初始化应用程序时设置初始布局和视图\n\
    - 使用 Application 对象导航到各种视图\n- 为移动应用程序添加触摸事件\n\n### 简介\n\n在早期的配方中，我们研究了 Kendo UI\
    \ 库中可用于快速构建 Web 应用程序的各种组件。在即将介绍的配方中，我们将了解 Kendo UI Mobile 库，它提供了一个应用程序框架和一组小部件，使您能够快速构建移动应用程序。Kendo\
    \ UI Mobile 框架通过在各种移动平台（包括 iOS、Android、Blackberry 和 Windows Phone 8）上提供原生外观和感觉来渲染应用程序。开发人员可以专注于提供功能，并依赖\
    \ Mobile 框架来提供各种平台的原生外观和感觉，从而减少开发工作量，并为所有平台维护相同的代码库。\n\n### 创建布局并将视图添加到布局中\n\n\
    每个 Kendo Mobile 应用程序都有一个或多个布局以及添加到其中的多个视图。布局和视图都是小部件，即可用于构建移动应用程序的可视组件。有几个这样的小部件，我们将在下一章中探讨。在本配方中，我们将了解如何通过创建布局并添加多个视图来构建一个简单的应用程序。\n\
    \n### 入门\n\n使用移动应用程序时，需要包含单独的 CSS 和 JS 文件。CSS 文件应引用位于 `styles` 目录中的 `kendo.mobile.all.min.css`\
    \ 文件，JS 文件应引用位于 `js` 目录中的 `kendo.mobile.min.js` 文件。\n\n此外，对 jQuery 库的引用应保持不变，即\
    \ Kendo UI Mobile 库（`kendo.mobile.min.js`）依赖于 jQuery。\n\n### 操作方法...\n\n如前一节所述，让我们首先在\
    \ HTML 页面中包含 CSS 和 JS 文件引用，如以下代码片段所示：\n\n```html\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"../styles/kendo.mobile.all.min.css\">\n<script src=\"../js/jquery.min.js\"\
    ></script>\n<script src=\"../js/kendo.mobile.min.js\"></script>\n```\n\n> 您可能需要根据开发环境的目录结构调整文件路径。\n\
    \n下一步是创建布局。布局是应用程序中各种视图的容器。布局定义了应用程序的结构；它包含在用户与应用程序交互时保持不变的小部件。例如，大多数应用程序都有一个标题和一个页脚，在应用程序中导航时保持不变。标题和页脚小部件可以是布局的一部分，而动态部分（即根据应用程序状态变化的视图）将与布局关联。视图可以被视为应用程序中的单个页面，根据应用程序状态显示。例如，您可以有两个视图，即登录和注册。根据应用程序状态，将呈现其中一个视图。使用\
    \ `div` 元素并添加数据属性来创建布局小部件：\n\n```html\n<div\ndata-role=\"layout\"\ndata-id=\"\
    defaultLayout\">\n</div>\n```\n\n这里，`data-role` 属性设置为布局，将元素标识为布局小部件。Mobile 框架中的每个小部件都会将\
    \ `data-role` 属性设置为相应的小部件名称。`data-id` 属性用于在页面上标识小部件。页面上可以有多个布局小部件，每个小部件都需要有一个唯一的\
    \ ID 来在应用程序中标识该小部件。\n\n现在让我们向布局添加几个小部件，例如包含 `navbar` 的 `header` 小部件，以及包含 `tabstrip`\
    \ 的 `footer` 小部件：\n\n```html\n<div\ndata-role=\"layout\"\ndata-id=\"defaultLayout\"\
    >\n<header data-role=\"header\">\n<div data-role=\"navbar\">\nApplication Header\n\
    </div>\n</header>\n<footer data-role=\"footer\">\n  <div data-role=\"tabstrip\"\
    >\n    <a data-icon=\"about\">About</a>\n    <a data-icon=\"settings\">Settings</a>\n\
    \  </div>\n</footer>\n</div>\n```\n\n如前所述，小部件是通过为 `data-role` 属性分配适当值来创建的。在这种情况下，`header`、`navbar`、`footer`\
    \ 和 `tabstrip` 值被分配给各种元素的 `data-role` 属性。\n\n将布局添加到页面后，下一步是添加视图。视图小部件表示在呈现应用程序时需要显示的单个视图。页面上可以有多个视图，但任何给定时间点只能呈现一个视图，具体取决于应用程序的状态：\n\
    \n```html\n<div data-role=\"view\" data-layout=\"defaultLayout\">\n  Hello Kendo!!\n\
    </div>\n```\n\n这里，除了 `data-role` 属性外，`div` 元素还有一个 `data-layout` 属性。`data-layout`\
    \ 属性用于将页面上的视图小部件与布局小部件关联。在这种情况下，`data-layout` 属性的值为 `defaultLayout`，即 `layout`\
    \ 小部件的 `data-id` 属性的值。`layout` 中定义的 `header` 和 `footer` 小部件相应地定位，视图小部件在布局的可用空间内呈现。最后一步是初始化应用程序。要初始化它，请包含以下代码片段：\n\
    \n```html\n<script>\nvar app = new kendo.mobile.Application();\n</script>\n```\n\
    \n前面的代码片段将初始化页面中的所有小部件，并在布局和视图之间建立关联。然后可以使用 Application 对象在页面中的多个视图之间进行路由，我们将在即将介绍的配方中讨论此场景。\n\
    \n### 工作原理...\n\n执行页面时，您会看到页面标题和页脚中的导航栏和选项卡条。此外，**Hello Kendo!!** 消息将显示在页面的正文中。\n\
    \n以下屏幕截图显示了在运行 iOS7 的 iPhone 上查看页面时应用程序的外观：\n\n![](img/2a66507445090790d34dc5588b56b24c_126_0.png)\n\
    \n请注意，没有编写额外代码来设置应用程序的外观和感觉。Mobile 框架开箱即用提供此功能，即它确定用户代理并将 CSS 类添加到页面中的元素。\n\n\
    检查页面时，您会看到添加到 body 标签的类，如以下代码行所示：\n\n```\n<body class=\"km-on-ios km-ios7 km-7\
    \ km-m0 km-web km-black-status-bar km-vertical km-widget km-pane\" data-role=\"\
    pane\" style=\"\">\n```\n\n请注意添加到 body 标签的 km-on-ios 和 km-ios7 类。如果在 Android 设备上查看同一页面，它将呈现不同的效果。\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_127_0.png)\n\n同样，框架确定用户代理并将 CSS 类添加到\
    \ body 标签。在这种情况下，它将如以下代码片段所示：\n\n```html\n<body class=\"km-on-android km-android\
    \ km-4 km-m0 km-web km-black-status-bar km-vertical km-widget km-pane\" data-role=\"\
    pane\" style=\"\">\n```\n\n这里，添加了 km-on-android 和 km-android 类。\n\n### 更多...\n\
    \nMobile 框架根据访问它的设备呈现应用程序。但是，在您想要为给定平台自定义布局的场景中，可以指定 data-platform 属性。例如，您可以为前一个布局指定\
    \ data-platform 为 iOS，并将另一个布局添加到页面，其 data-platform 属性设置为 android：\n\n"
