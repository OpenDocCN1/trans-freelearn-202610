    ## 1 Kendo UI 应用程序框架


    在本章中，我们将介绍以下配方：


    - 使用客户端模板从 JSON 数据生成 HTML 标记

    - 使用 **模型-视图-视图模型 (MVVM)** 模式在 `View` 元素和 JavaScript 对象之间创建双向绑定

    - 使用 `ViewModel` 与 `source` 和 `template` 绑定生成 HTML 内容

    - 使用内置验证器验证用户输入


    ### 简介


    Kendo UI 库由各种小部件组成，这些小部件专为 Web 和移动平台构建。它还提供数据可视化组件，可用于构建丰富且交互式的图表。本章重点介绍 Kendo
    UI 应用程序框架。该框架包括客户端模板引擎、数据绑定和路由等工具，还可帮助用户验证表单字段。


    ## 使用客户端模板从 JSON 数据生成 HTML 标记


    使用模板系统与某个数据源来生成动态 Web 内容的概念在 Web 开发中已经存在很长时间了。Java Server Pages (Java)、Smarty
    (PHP) 和 Django (Python) 是一些服务器端模板引擎的示例。生成运行时内容过去仅是服务器端的事。近年来，在客户端（浏览器）上生成内容已被广泛采用。


    当今构建的动态应用程序要求用户界面频繁更新。这可以通过从服务器获取 HTML 片段并将其插入文档来实现。然而，这要求服务器生成此类片段，而不是提供完整的 Web
    页面。在客户端模板引擎中，服务器只负责以 JSON 格式发送动态数据，然后在浏览器中使用静态客户端模板组装页面。此模板可以从 **内容分发网络 (CDN)**
    提供，而不是从发送动态数据的同一服务器提供。以 JSON 数据形式发送记录而不在服务器端生成标记所花费的时间节省了更多 CPU 周期，从而极大地提高了应用程序的性能。考虑一个购物车应用程序，它列出购物车中的产品。购物车数据可以以
    JSON 格式发送到客户端。然后，使用模板在客户端生成 HTML 标记。


    有多种客户端模板引擎可供选择；其中一些是无逻辑的，例如 Mustache 和 Handlebars，一些基于 HAML 语法，例如 Jade，还有一些基于
    John Resig 的微型模板，例如 `underscore.js`。


    在 Kendo UI 中，使用一种称为哈希模板的微型模板库。在这些模板中，哈希符号用于标记模板中将在用于生成动态内容时执行的区域。


    ### 操作方法...


    Kendo UI 库导出一个对象 `kendo`，它是各种其他对象和函数的命名空间。模板函数是其中之一。模板函数将基于哈希的模板编译为可用于渲染的函数。它对于从
    JSON 数据源渲染复杂的 HTML 片段很有用。以下是三种基于哈希的语法：


    - 渲染文本值的语法是 #= #

    - 渲染 HTML 编码值的语法是 #: #

    - 执行任意 JavaScript 代码的语法是 # `for (...)` #


    让我们来看一个非常简单的示例，使用以下基于哈希的模板渲染某人的 firstName 和 lastName：


    ```

    <script>


    var template = kendo.template("Full Name: " +

    "<span> #= lastName # </span>," +

    "<span> #= firstName # </span>");

    var data = {};


    data.lastName = "Smith";

    data.firstName = "Todd";


    var result = template(data);


    $('' .addressContainer'').append(result);


    </script>

    ```


    ## 下载示例代码


    您可以从 http://www.packtpub.com 的帐户中下载已购买的所有 Packt 图书的示例代码文件。如果您在其他地方购买了本书，可以访问 http://www.packtpub.com/support
    并注册，以便文件直接发送到您的电子邮件。


    在这里，使用了 #= <literal> # 表达式。同样，我们也可以使用基于哈希的表达式来渲染 HTML 编码值：


    ```

    <script>


    var template = kendo.template("Full Name: <span> #= lastName ## </span>, <span>
    #= firstName # </span>");

    var data = {};


    data.lastName = "<b>Smith</b>";

    data.firstName = "<i>Todd</i>";


    var result = template(data);


    $('' .addressContainer'').append(result);


    </script>

    ```


