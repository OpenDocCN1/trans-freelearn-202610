    \n},\nzoom: {\nposition: \"bottomLeft\"\n},\n},\n```\n\n```\nattribution: {\n\
    \    position: \"topRight\"\n},\n.\n});\n```\n\n现在当您呈现页面时，控件将相应地定位。\n\n![](img/2a66507445090790d34dc5588b56b24c_235_0.png)\n\
    \nposition 属性可以具有以下值之一：topLeft、topRight、bottomLeft 和 bottomRight。也可以通过将其值设置为 false\
    \ 来隐藏控件：\n\n```\ncontrols: {\n    navigator: false\n},\n```\n\n通过将指定的控件设置为 false，该控件将不会在页面上显示。\n\
    \n# 通过绑定 GeoJSON 数据创建地图\n\nGeoJSON 是一种对多种地理数据结构进行编码的格式。它是一种开放标准格式，用于使用 JSON 对一组简单地理特征及其非空间属性进行编码。在本示例中，我们将创建一个绑定到\
