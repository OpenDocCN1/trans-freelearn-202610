    \ {\n        size: 30,\n        width: 1,\n        color: 'green'\n    },\n  \
    \  majorTicks: {\n        size: 100,\n        width: 2,\n        color: 'red'\n\
    \    }\n}\n```\n\nHere, the size option is used to specify the length of the tick\
    \ marker, width is used to specify the thickness of the tick, and the color option\
    \ is used to change the color of the tick.\n\nNow when you render the page, you\
    \ will see the changes for the major and minor ticks.\n\n![](img/2a66507445090790d34dc5588b56b24c_213_0.png)\n\
    \n## Changing the color of the radial using the ranges option\n\nThe `scale` attribute\
    \ can include the `ranges` option to specify a radial color for the various ranges\
    \ on the Radial Gauge widget:\n\n```\nscale: {\n    ranges: [\n        {\n   \
    \         from: 0,\n            to: 60,\n            color: '#00F'\n        },\
    \ {\n            from: 60,\n            to: 130,\n            color: '#0F0'\n\
    \        }, {\n            from: 130,\n            to: 200,\n            color:\
    \ '#F00'\n        }\n    ]\n}\n```\n\nIn the preceding code snippet, the `ranges`\
    \ array contains three objects that specify the color to be applied on the circumference\
    \ of the widget. The `from` and `to` values are used to specify the range of tick\
    \ values for which the color should be applied.\n\nNow when you render the page,\
    \ you will see the Radial Gauge widget showing the colors for various ranges along\
    \ the circumference of the widget, as shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_214_0.png)\n\
    \nIn the preceding screenshot, the `startAngle` and `endAngle` fields are changed\
    \ to 10 and 250, respectively. The widget can be further customized by moving\
    \ the labels outside. This can be done by specifying the `labels` attribute with\
    \ `position` as `outside`.\n\n![](img/2a66507445090790d34dc5588b56b24c_214_1.png)\n\
    \nIn the preceding screenshot, the labels are positioned outside, hence, the radial\
    \ appears inside.\n\n## Updating the pointer value using a Slider widget\n\nThe\
    \ `pointer` value is set when the Radial Gauge widget is initialized. It is possible\
    \ to change the `pointer` value of the widget at runtime using a Slider widget.\
    \ The changes in the Slider widget can be observed, and the `pointer` value of\
    \ the Radial Gauge can be updated accordingly.\n\nLet's use the same Radial Gauge\
    \ widget mentioned in the previous recipe. A Slider widget is created using an\
    \ input element:\n\n```\n<input id=\"slider\" value=\"0\" />\n```\n\nThe next\
    \ step is to initialize the previously mentioned input element to a Slider widget:\n\
    \n```\n$('#slider').kendoSlider({\n    min: 0,\n    max: 200,\n    showButtons:\
    \ false,\n    smallStep: 10,\n    tickPlacement: 'none',\n    change: updateRadialGuage\n\
    });\n```\n\nThe `min` and `max` values specify the range of values that can be\
    \ set for the slider. The `smallStep` attribute specifies the minimum increment\
    \ value of the slider. The `change` attribute specifies the function that should\
    \ be invoked when the `slider` value changes.\n\nThe `updateRadialGuage` function\
    \ should then update the value of the pointer in the Radial Gauge widget:\n\n\
    ```\nfunction updateRadialGuage() {\n    $('#chart').data('kendoRadialGauge')\n\
    \        .value($('#slider').val());\n}\n```\n\nThe function gets the instance\
    \ of the widget and then sets its value to the value obtained from the Slider\
    \ widget.\n"
  mdcn: "\n\n# 工作原理...\n\n加载页面时，您将看到显示两个窗格；导航器位于主图表下方。默认情况下，图表显示 `DataSource` 对象中所有日期的数据，如下面的屏幕截图所示：\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_207_0.png)\n\n在前面的屏幕截图中，创建了一个蜡烛图，它显示了一段时间内的股票价格。另外，请注意，在导航器窗格中，默认情况下会选择所有日期范围，因此，它们也会反映在图表（蜡烛图）中。当您将鼠标悬停在系列上时，您会注意到所选日期的股票报价会显示出来。这包括日期以及\
    \ **Open**、**High**、**Low** 和 **Close** 等其他字段。\n\n图表区域会调整以显示各种日期的股票价格，使日期均匀分布。在前面的情况中，日期范围从\
    \ 2013 年 1 月 1 日到 2013 年 1 月 31 日。但是，当您将鼠标悬停在系列上时，您会注意到某些日期被省略了。为了解决这个问题，您可以增加图表区域的宽度，或者使用导航器来减小日期范围。如果日期范围跨越数月和数年，则不建议采用前一种选项。\n\
    \n要减小导航器中的日期范围，请将两个日期范围选择器相互移动以缩小日期范围，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_208_0.png)\n\
    \n当您尝试缩小日期范围时，您会在图表中看到一个工具提示，指示您正在尝试选择的日期范围。蜡烛图会调整以显示所选日期范围的股票价格。另外，请注意，导航器中所选日期范围的不透明度保持不变，而其余区域的不透明度会降低。选择日期范围后，所选窗格可以在导航器中移动。\n\
    \n## 更多内容...\n\n有几个选项可用于自定义 Stock Chart 小部件的行为和外观。\n\n## 在初始化图表时指定导航器中的日期范围\n\n\
    默认情况下，图表中会选择所有日期范围，用户将不得不在导航器窗格中将其缩小。当您处理大型数据集时，您希望在渲染图表时显示特定日期范围的股票数据。为此，请在导航器中指定\
    \ select 选项：\n\n```\nnavigator: {\n    series: {\n        type: 'area',\n    \
    \    field: 'Volume'\n    },\n    select: {\n        from: '2013/01/07',\n   \
    \     to: '2013/01/14'\n    }\n}\n```\n\n在前面的代码片段中，指定了 from 和 to 日期范围。现在，当您渲染页面时，您将看到导航器窗格中选择了相同的日期。\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_209_0.png)\n\n## 自定义 Stock Chart 小部件的外观\n\
    \n有多个选项可用于自定义 Stock Chart 小部件中的导航器窗格。让我们增加窗格的高度，并为其添加标题文本：\n\n```\nnavigator:\
    \ {\n    pane: {\n        height: '50px',\n        title: {\n            text:\
    \ 'Stock Volume'\n        }\n    }\n}\n```\n\n现在，当您渲染页面时，您将看到导航器窗格的标题和高度已增加。\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_210_0.png)\n\n# 使用 Radial Gauge 小部件\n\
    \nRadial Gauge 小部件允许您构建类似仪表板的应用程序，其中您希望指示一个位于特定范围内的值。例如，汽车仪表板可以包含几个 Radial Gauge\
    \ 小部件，用于指示当前速度和转速。\n\n## 操作方法...\n\n要创建 Radial Gauge 小部件，请在所选 DOM 元素上调用 kendoRadialGauge\
    \ 函数。Radial Gauge 小部件包含一些组件，可以通过提供选项进行配置，如下面的代码片段所示：\n\n```\n$(\"#chart\").kendoRadialGauge({\n\
    \    scale: {\n        startAngle: 0,\n        endAngle: 180,\n        min: 0,\n\
    \        max: 180\n    },\n    pointer: {\n        value: 20\n    }\n});\n```\n\
    \n## Kendo UI DataViz - 高级图表\n\n此处使用 scale 选项来配置 Radial Gauge 小部件的范围。`startAngle`\
    \ 和 `endAngle` 选项用于指示 Radial Gauge 小部件范围应开始和结束的角度。默认情况下，它们的值分别为 30 和 210。另外两个选项，即\
    \ `min` 和 `max`，用于指示可以绘制值的范围值。`pointer` 选项用于指示 Radial Gauge 小部件中的当前值。\n\n有多个选项可用于配置\
    \ Radial Gauge 小部件；这些选项包括标签的定位和配置小部件的外观。\n\n## 工作原理...\n\n当您渲染页面时，您将看到一个 Radial\
    \ Gauge 小部件，它显示从 **0** 到 **180** 的刻度，指针指向值 **20**。\n\n![](img/2a66507445090790d34dc5588b56b24c_211_0.png)\n\
    \n此处，**0** 到 **180** 的值均匀分布，即主刻度以 **20** 为单位。有 10 个次要刻度，即两个主刻度之间的刻度。小部件以顺时针方向显示值。另外，指针值\
    \ **20** 在刻度中被选中。\n\n## 更多内容...\n\nRadial Gauge 小部件可以在初始化小部件时包含各种选项，从而进行很大程度的自定义。\n\
    \n## 更改主刻度和次要刻度值\n\n在 scale 中指定 `majorUnit` 和 `minorUnit` 选项：\n\n```\nscale: {\n\
    \    startAngle: 0,\n    endAngle: 180,\n    min: 0,\n    max: 180,\n    majorUnit:\
    \ 30,\n    minorUnit: 10\n}\n```\n\nscale 选项将 majorUnit 值指定为 30（而不是默认的 20），minorUnit\
    \ 为 10。这将在每 30 个单位处添加标签，并在两个主刻度之间显示两个次要刻度，每个刻度间距为 10 个单位，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_212_0.png)\n\
    \n前面的屏幕截图中显示的刻度也可以自定义：\n\n```\nscale: {\n    minorTicks: {\n        size: 30,\n\
    \        width: 1,\n        color: 'green'\n    },\n    majorTicks: {\n      \
    \  size: 100,\n        width: 2,\n        color: 'red'\n    }\n}\n```\n\n此处，size\
    \ 选项用于指定刻度标记的长度，width 用于指定刻度的厚度，color 选项用于更改刻度的颜色。\n\n现在，当您渲染页面时，您将看到主刻度和次要刻度的更改。\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_213_0.png)\n\n## 使用 ranges 选项更改径向颜色\n\
    \n`scale` 属性可以包含 `ranges` 选项，以指定 Radial Gauge 小部件上各个范围的径向颜色：\n\n```\nscale: {\n\
    \    ranges: [\n        {\n            from: 0,\n            to: 60,\n       \
    \     color: '#00F'\n        }, {\n            from: 60,\n            to: 130,\n\
    \            color: '#0F0'\n        }, {\n            from: 130,\n           \
    \ to: 200,\n            color: '#F00'\n        }\n    ]\n}\n```\n\n在前面的代码片段中，`ranges`\
    \ 数组包含三个对象，用于指定应用于小部件圆周上的颜色。`from` 和 `to` 值用于指定应用颜色的刻度值范围。\n\n现在，当您渲染页面时，您将看到\
    \ Radial Gauge 小部件沿着小部件圆周显示各个范围的颜色，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_214_0.png)\n\
    \n在前面的屏幕截图中，`startAngle` 和 `endAngle` 字段分别更改为 10 和 250。可以通过将标签移到外部来进一步自定义小部件。这可以通过指定\
    \ `labels` 属性并将 `position` 设置为 `outside` 来完成。\n\n![](img/2a66507445090790d34dc5588b56b24c_214_1.png)\n\
    \n在前面的屏幕截图中，标签位于外部，因此，径向位于内部。\n\n## 使用 Slider 小部件更新指针值\n\n`pointer` 值在初始化 Radial\
    \ Gauge 小部件时设置。可以在运行时使用 Slider 小部件更改小部件的 `pointer` 值。可以观察到 Slider 小部件的变化，并相应地更新\
    \ Radial Gauge 的 `pointer` 值。\n\n让我们使用前面配方中提到的同一个 Radial Gauge 小部件。使用输入元素创建一个\
    \ Slider 小部件：\n\n```\n<input id=\"slider\" value=\"0\" />\n```\n\n下一步是将前面提到的输入元素初始化为\
    \ Slider 小部件：\n\n```\n$('#slider').kendoSlider({\n    min: 0,\n    max: 200,\n\
    \    showButtons: false,\n    smallStep: 10,\n    tickPlacement: 'none',\n   \
    \ change: updateRadialGuage\n});\n```\n\n`min` 和 `max` 值指定可以为滑块设置的值范围。`smallStep`\
    \ 属性指定滑块的最小增量值。`change` 属性指定当 `slider` 值变化时应调用的函数。\n\n然后，`updateRadialGuage` 函数应更新\
    \ Radial Gauge 小部件中指针的值：\n\n```\nfunction updateRadialGuage() {\n    $('#chart').data('kendoRadialGauge')\n\
    \        .value($('#slider').val());\n}\n```\n\n该函数获取小部件的实例，然后将其值设置为从 Slider 小部件获得的值。\n\
    \n"
