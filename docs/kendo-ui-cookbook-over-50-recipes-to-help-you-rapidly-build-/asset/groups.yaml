    # # Kendo UI Window


    In this chapter, we will cover the following recipes:


    +   - Displaying a pop up and blocking the user interaction by configuring it
    as a modal window

    +   - Customizing the look and feel of the window and including action buttons

    +   - Using the Window API to act on a window object


    # ## Introduction


    A Kendo UI Window widget is used to show any HTML content in a pop-up window or
    a modal window. The window content is shown on top of the other content in the
    page and has a title bar with a close button. The content can be either static
    HTML, or it can be loaded dynamically using Ajax. Any DOM node in the page can
    be initialized to a window, that is, the content of any element in the DOM can
    be wrapped inside a window. Also, the window can be resized, moved, and closed.


    The Kendo UI Window widget provides several configuration options that can be
    used to customize the actions that can be applied and also the look and feel of
    the widget. In this recipe, we will first see how to create a pop-up window and
    configure it as a modal. Then, we will customize the look the feel of the window
    and use APIs to invoke actions on the window object.'
  - "[PAGE 113]\n\n# # Displaying a pop up and blocking the user interaction by configuring\
    \ it as a modal window\n\nIn this recipe, we will look at how the Kendo UI window\
    \ is created for a DOM node in the page. Later, we will also see how the content\
    \ of the window is loaded asynchronously by specifying the URL of the page.\n\n\
    # ## How to do it...\n\nLet's create a div element that contains some text that\
    \ will be shown in the window:\n\n```\n```\n<div id=\"window\">\n Window content\
    \ goes here...\n</div>\n```\n```\n\nThe next step is to invoke the kendoWindow\
    \ function on the preceding DOM node:\n\n```\n```\n$(\"#window\").kendoWindow();\n\
    ```\n```\n\nAfter initializing the DOM node using the kendoWindow function, you\
    \ will notice that the window contains the text mentioned in the div element that\
    \ is being shown. Note that this will not add a backdrop. To add a backdrop, the\
    \ window should be configured as a modal.\n\nThe difference between a window and\
    \ a modal is that a backdrop that hides the body content is shown in the case\
    \ of a modal. To create the modal window, specify the modal property as true:\n\
    \n```\n```\n$(\"#window\").kendoWindow({\n modal: true\n});\n```\n```\n\nBy default,\
    \ the value of the modal property is false, and hence the backdrop is not shown.\n\
    \n# ## How it works...\n\nWhen you initialize any DOM node, its content will be\
