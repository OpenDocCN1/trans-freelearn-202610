    \n## 10 Kendo UI DataViz\n\n在本章中，我们将介绍以下配方：\n\n- 使用 `kendoChart` 创建图表\n- 将图表绑定到\
    \ `DataSource` 对象\n- 创建多轴图表\n- 显示一段时间内的数据并使用聚合函数\n- 通过添加事件使图表具有交互性\n- 动态更改图表类型\n\
    \n### 简介\n\nKendo UI 库提供了一组强大的可视化组件，可用于让数据生动起来。它使用现代浏览器技术（如 SVG 和 Canvas）来渲染这些图表。在旧版浏览器上，它会回退到\
    \ VML。浏览器支持范围从 IE7+ 到 Chrome、Firefox、Opera（15+）和 Safari。在本章中，我们将学习构建一些基本图表，例如面积图、饼图和柱状图，以及如何对其进行自定义。在下一章中，我们将学习一些用于构建仪表板类应用程序的高级数据可视化图表。\n\
    \n## 使用 kendoChart 创建图表\n\nKendo 数据可视化库提供了多个图表小部件，可以轻松构建。在本配方中，我们将首先构建一个柱状图，然后自定义其外观和感觉。柱状图显示垂直条形，直观地表示提供的数据。\n\
    \n### 入门\n\nkendo.all.min.js 文件包含所有组件，即 Web、Mobile 和 DataViz 小部件。但是，如果你只构建数据可视化组件，则应包含\
    \ kendo.dataviz.min.js 文件。\n\n### 操作步骤...\n\n要创建图表，让我们向页面添加一个容器，指定图表区域的尺寸，如下面的代码行所示：\n\
    \n```html\n<div id=\"chart\" style=\"width:500px; height: 400px\">\n```\n\n请注意，图表的宽度为\
    \ 500 像素，高度为 400 像素。此区域将用于渲染图表。下一步是使用 kendoChart 函数初始化图表，如下面的代码行所示：\n\n```javascript\n\
    $(\"#chart\").kendoChart()\n```\n\n在前面的代码行中，通过在选中的 div 元素上调用 kendoChart 函数来初始化图表。当你渲染页面时，将显示仅包含坐标轴的图表。下一步是提供一些数据和一组选项，这些选项将用于显示图表。这些包括图表标题和你想要显示的图表类型，如下面的代码片段所示：\n\
    \n```javascript\n$(\"#chart\").kendoChart({\n    title: {\n        text: 'Browser\
    \ Adoption'\n    },\n    categoryAxis: {\n        categories: [2010, 2011, 2012,\
    \ 2013, 2014]\n    },\n    series: [{\n        name: 'Internet Explorer',\n  \
    \      data: ['32', '23', '17', '12', '9'],\n        type: 'column'\n    }],\n\
    \    valueAxis: {\n        labels: {\n            format: '{0}%',\n        }\n\
    \    }\n});\n```\n\n在前面的代码片段中，提供了多个选项来初始化图表小部件。让我们逐一查看：\n\n- title：此选项用于指定应显示在图表顶部的标题文本。title\
    \ 中指定的 text 选项将被显示。\n- categoryAxis：此选项用于指定应显示在图表 x 轴上的类别。\n- series：此选项用于指定需要在图表中显示的数据。name\
    \ 选项用于显示图例信息。data 选项包括需要在图表上绘制的所有数据，type 指定需要显示的图表类型。\n- valueAxis：此选项指 y 轴，在前面的示例中，它指定了\
    \ y 轴上的值应以何种格式显示。{0}% 值作为模板，其中 {0} 将被替换为基于提供的数据的值。\n\n### 工作原理...\n\n在 kendoChart\
    \ 函数中提供所有选项后，你会看到一个柱状图已添加到页面中，它还包含标题和图例信息，如下面的屏幕截图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_180_0.png)\n\
    \n请注意，前面的柱状图在顶部显示标题，在右侧显示图例信息。应用的颜色主题是默认主题。\n\n### 在图表中显示多个类别\n\n我们创建的图表只添加了一个系列；当你想要比较多个产品或类别时，系列数组可以包含它们：\n\
    \n```javascript\nseries: [{\n name: 'Internet Explorer',\n data: ['32', '23',\
    \ '17', '12', '9']\n}, {\n name: 'Firefox',\n data: ['45', '39', '34', '28', '26']\n\
    }, {\n name: 'Chrome',\n data: ['15', '26', '40', '52', '56']\n}, {\n name: 'Safari',\n\
    \ data: ['6', '5', '4', '4', '4']\n}]\n```\n\n请注意，系列中删除了类型信息。构建图表时，你可以在 seriesDefault\
    \ 下为系列指定通用选项：\n\n```javascript\nseriesDefaults: {\n type: 'column'\n}\n```\n\n\
    现在当你渲染页面时，将包含其他系列。\n\n![](img/2a66507445090790d34dc5588b56b24c_181_0.png)\n\n\
    ## 更改标题和图例信息的位置\n\n可以自定义图表以更改标题和图例信息的位置：\n\n```javascript\ntitle: {\n    text:\
