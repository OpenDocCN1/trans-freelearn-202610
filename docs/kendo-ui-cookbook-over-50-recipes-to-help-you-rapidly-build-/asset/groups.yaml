    \ will be hidden. Add a `click` event handler  \nfor the button that will open\
    \ the modal window:\n\n```\n```javascript\n$(\\'#btn1\\').on(\\'click\\', function()\
    \ {\n    var modalObject = $(\\'#window\\').data(\\'kendoWindow\\');\n    modalObject.open();\n\
    });\n```\n```\n\nThe first line gets the instance of the modal window. Then, in\
    \ the next line, the open method  \nis called on the window instance that would\
    \ open the modal window.\n\nThe `open` method is one of the several methods that\
    \ can be used to act on the window object.  \nWe will take a look at other methods\
    \ in the following recipe.\n\n# ## Loading the content of the modal using Ajax\n\
    \nIn this recipe, the content of the modal was specified in the HTML markup. The\
    \ content of the  \nmodal window can be loaded by specifying the URL that returns\
    \ the HTML markup. This content  \nwill be fetched asynchronously when the page\
    \ is loaded.\n\nTo load the content of the window, specify the content attribute\
    \ when initializing the window  \nusing `kendoWindow`:\n\n```\n```javascript\n\
    $(\\'#window\\').kendoWindow({\n    visible: false,\n    modal: true,\n    content:\
    \ \\'./jsbooks.html\\'\n});\n```\n```\n\nHere, the `./jsbooks.html` URL is specified\
    \ in the `content` attribute. This can be any URL  \nthat returns the HTML markup.\
    \ For example, it could be a PHP page that generates the HTML  \nmarkup. When\
    \ you load the page, an asynchronous request is sent to `./jsbooks.html`,  \n\
    and the generated markup is inserted into the window."
  - "[PAGE 116]\n\n# # Customizing the look and feel of the window and including action\
    \ buttons\n\nThere are various options available to the user to customize the\
    \ window object. In this recipe, we will take a look at these options.\n\n# ##\
    \ How to do it...\n\nSome of the customization options for the window have a default\
    \ value. For example, the pop-up window can be resized and is draggable. Also,\
    \ the window is shown since the visible property is set to true. Let's take a\
    \ look at some of the other properties:\n\n```\n$('#window').kendoWindow({\n \
