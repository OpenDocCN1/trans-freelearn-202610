    \n## 10 Kendo UI DataViz\n\nIn this chapter, we will cover the following recipes:\n\
    \n- Creating charts using `kendoChart`\n- Binding a chart to a `DataSource` object\n\
    - Creating a multiaxis chart\n- Displaying data over a period of time and using\
    \ aggregate functions\n- Making a chart interactive by adding events\n- Changing\
    \ the chart type dynamically\n\n### Introduction\n\nThe Kendo UI library provides\
    \ a set of powerful visualization components that can be used to bring data to\
    \ life. It uses modern browser technologies such as SVG and Canvas to render these\
    \ charts. It falls back to VML on older browsers. The browser support ranges from\
    \ IE7+ to Chrome, Firefox, Opera (15+), and Safari. In this chapter, we will look\
    \ at building some of the basic charts such as the area chart, pie chart, and\
    \ column chart, and how they can be customized. In the next chapter, we will look\
    \ at some of the advanced data visualization charts that are used to build dashboard-like\
    \ applications.\n\n## Creating charts using kendoChart\n\nThe Kendo data visualization\
    \ library provides several charting widgets that can be built with ease. In this\
    \ recipe, we will first build a column chart and then customize its look and feel.\
    \ A column chart displays vertical bars, visually representing the provided data.\n\
    \n### Getting started\n\nThe kendo.all.min.js file contains all the components,\
    \ that is, Web, Mobile, and DataViz widgets. However, if you're building only\
    \ data visualization components, then include the kendo.dataviz.min.js file.\n\
    \n### How to do it...\n\nTo create a chart, let's add a container to the page,\
    \ specifying the dimension of the chart area, as shown in the following line of\
    \ code:\n\n```html\n<div id=\"chart\" style=\"width:500px; height: 400px\">\n\
    ```\n\nNotice that the chart has a width of 500 pixels and a height of 400 pixels.\
    \ This area will be used to render the chart. The next step is to initialize the\
    \ chart using the kendoChart function, as shown in the following line of code:\n\
    \n```javascript\n$(\"#chart\").kendoChart()\n```\n\nIn the preceding code line,\
    \ a chart is initialized by invoking the kendoChart function on the selected div\
    \ element. When you render the page, a chart with only its axes will be shown.\
    \ The next step is to provide some data and a set of options that will be used\
    \ to display the chart. These includes the chart title and the type of chart that\
    \ you want to display, as shown in the following code snippet:\n\n```javascript\n\
    $(\"#chart\").kendoChart({\n    title: {\n        text: 'Browser Adoption'\n \
    \   },\n    categoryAxis: {\n        categories: [2010, 2011, 2012, 2013, 2014]\n\
    \    },\n    series: [{\n        name: 'Internet Explorer',\n        data: ['32',\
    \ '23', '17', '12', '9'],\n        type: 'column'\n    }],\n    valueAxis: {\n\
    \        labels: {\n            format: '{0}%',\n        }\n    }\n});\n```\n\n\
    In the preceding code snippet, several options have been provided to initialize\
    \ the chart widget. Let's take a look at each one of them:\n\n- title: This option\
    \ is used to specify the title text that should be shown on top of the chart.\
    \ The text option specified in the title will be displayed.\n- categoryAxis: This\
    \ option is used to specify the categories that should be displayed on the x axis\
    \ of the chart.\n- series: This option is used to specify the data that needs\
    \ to be displayed in the chart. The name option is used to display the legend\
    \ information. The data option includes all the data that needs to be plotted\
    \ on the chart and type specifies the chart type that needs to be displayed.\n\
    - valueAxis: This option refers to the y axis and in the preceding example, it\
    \ specifies the format in which the values in the y axis should be displayed.\
    \ The {0}% value serves as a template where {0} is replaced with a value based\
    \ on the data that is provided.\n\n### How it works...\n\nAfter providing all\
    \ the options in the kendoChart function, you will see that a column chart is\
    \ added to the page, which also contains the title and legend information, as\
    \ shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_180_0.png)\n\
    \nNotice that the preceding column chart shows you the title at the top and the\
    \ legend information on the right-hand side. The color theme that has been applied\
    \ is the default one.\n\n### Showing multiple categories in the chart\n\nThe chart\
    \ that we created had only one series added; when you want to compare multiple\
    \ products or categories, the series array can include them:\n\n```javascript\n\
    series: [{\n name: 'Internet Explorer',\n data: ['32', '23', '17', '12', '9']\n\
    }, {\n name: 'Firefox',\n data: ['45', '39', '34', '28', '26']\n}, {\n name: 'Chrome',\n\
    \ data: ['15', '26', '40', '52', '56']\n}, {\n name: 'Safari',\n data: ['6', '5',\
    \ '4', '4', '4']\n}]\n```\n\nNotice that the type information is removed from\
    \ the series. When building a chart, you can specify the common options for the\
    \ series under seriesDefault:\n\n```javascript\nseriesDefaults: {\n type: 'column'\n\
    }\n```\n\nNow when you render the page, other series will be included.\n\n![](img/2a66507445090790d34dc5588b56b24c_181_0.png)\n\
    \n## Changing the position of the title and legend information\n\nIt is possible\
    \ to customize the chart to change the position of the title and legend information:\n\
    \n```javascript\ntitle: {\n    text: 'Browser adoption',\n    position: 'bottom'\n\
    },\nlegend: {\n    position: 'bottom'\n}\n```\n\nWhen you render the page, the\
    \ chart will occupy the entire width and the legend and title information will\
    \ be shown below the chart.\n\n![](img/2a66507445090790d34dc5588b56b24c_182_0.png)\n\
