    # # 2 The Kendo UI Grid


    In this chapter, we will cover the following recipes:


    +   - Creating a Grid view and displaying tabular data

    +   - Displaying data from a local or remote `DataSource` component in a Grid
    view

    +   - Sorting data in a Grid using a selected column

    +   - Using filters to display data that matches certain criteria in the Grid

    +   - Creating, updating, and deleting content in the Grid

    +   - Using the visualization mechanism to improve the performance of the Grid

    +   - Customizing the look and feel of the Grid


    # ## Introduction


    The Kendo UI library comes with a powerful Grid component. A Grid component is
    very useful when you want to display tabular data and provide various functionalities,
    such as sorting based on a selected column, filtering data, using pagination,
    and editing the tabular data. The Kendo UI Grid component provides various configuration
    options to customize the way the Grid is displayed and also provides various APIs
    to manipulate the Grid''s content.


    # ## Creating a Grid view and displaying tabular data


    A Grid in Kendo UI can be created in the following two ways:


    +   - From an existing HTML table element

    +   - From an existing DIV element'
