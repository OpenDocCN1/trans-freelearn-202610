    - The `tap` event will be triggered when the user taps on the screen\n- The `doubletap`\
    \ event will be invoked after `tap` when the application recognizes the second\
    \ tap\n\nIn the case of `hold`, the following sequence is executed:\n\n- The `touchstart`\
    \ event will be triggered\n- The `hold` event will be triggered when the user\
    \ continues his focus on one point for a long time\n\n## 9 Kendo UI Mobile Widgets\n\
    \nIn this chapter, we will cover the following recipes:\n\n- Creating a list using\
