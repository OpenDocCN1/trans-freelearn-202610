    \ 的实例并将其追加到组中。该函数随后返回组对象。该函数被递归调用，节点被添加到图表中。\n\n# 工作原理...\n\n当布局子类型为 down 时，根节点位于顶部，子节点被添加，树向下生长，如以下屏幕截图所示：\n\
