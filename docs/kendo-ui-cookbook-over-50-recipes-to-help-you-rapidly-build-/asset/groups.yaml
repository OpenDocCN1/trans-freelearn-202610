    ![](img/2a66507445090790d34dc5588b56b24c_218_1.png)\n\n# Generating barcode images\
    \ using various encoding methods\n\nThe Kendo UI library provides APIs that can\
    \ be used to generate the barcode graphic image for the given value. For example,\
    \ each product in the supermarket can have a barcode associated with it. When\
    \ a customer purchases the product, the barcode would be used to get the product\
    \ price and other details. The library can generate the barcode by referring to\
    \ the unique identifier.\n\n# How to do it...\n\nA barcode image can be generated\
    \ by invoking the kendoBarcode function on the DOM element:\n\n```\n$(\"#chart\"\
    ).kendoBarcode({\n    value: '1234567'\n});\n```"
  - "[PAGE 219]\n\nHere, the 1234567 value will be encoded using the default encoding,\
    \ that is, code39. You can also specify the encoding method to be used by specifying\
