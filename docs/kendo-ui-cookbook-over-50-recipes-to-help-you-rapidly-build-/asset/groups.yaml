    \ Application object, specify the transition property with the desired effect\
    \ as its value:\n\n```javascript\nvar app = new kendo.mobile.Application(document.body,\
    \ {\n    transition: \"zoom\"\n});\n```\n\nThis allows the transition effect to\
    \ be applied to the entire application.\n\n## Adding touch events to your mobile\
    \ application\n\nThe Kendo UI Mobile framework provides various APIs to handle\
    \ touch-based events. The applications that you build should not only allow the\
