    ## Quick answers to common problems


    ## Kendo UI Cookbook


    Over 50 recipes to help you rapidly build rich and dynamic user interfaces for
    web and mobile platforms


    Sagar Ganatra


    [PACKT] open source* community experience distilled PUBLISHING


    ## Kendo UI Cookbook


    Kendo UI is a one-stop library that allows you to build applications for web and
    mobile platforms using HTML5 and JavaScript. The library includes several widgets
    that allow you to build compelling web applications rapidly. Building web applications
    for web and mobile platforms using modern web technologies is now easy with the
    Kendo UI library. This cookbook contains practical recipes that you can apply
    in your everyday projects, and build compelling applications effortlessly. It
    gets you started with the application framework and then guides you through various
    widgets that you can readily use in your project with minimum configuration. It
    also provides recipes that you can use to build web applications for various mobile
    platforms while maintaining a single codebase.


    ## What this book will do for you...


    - Get to grips with the basics of the Kendo UI application framework

    - Use various widgets such as Grid, TreeView, Editor, PanelBar, Modal Window,
    and File uploader, and customize your application to meet the business requirements

    - Build web applications for the mobile platform and provide a native look and
    feel on iOS, Android, BlackBerry, and Windows Phone 8

    - Utilize the data visualization components such as charts and dashboard widgets
    to build visually compelling and interactive applications


    ![](img/2a66507445090790d34dc5588b56b24c_1_0.png)


    ## Inside the Cookbook...


    - A straightforward and easy-to-follow format

    - A selection of the most important tasks and problems

    - Carefully organized instructions for solving the problem efficiently

    - Clear explanations of what you did

    - Apply the solution to other situations


    $ 49.99 US £ 30.99 UK


    Prices do not include local sales tax or VAT where applicable


