    # # Preface


    Kendo UI is an HTML- and jQuery-based client-side framework that enables you to
    build web applications for the web and mobile platforms. The library contains
    a multitude of widgets that can be configured with ease to build applications
    rapidly. In addition to the widgets for the web and mobile platforms, the library
    provides numerous data-visualization components that allow you to build complex
    charts, diagrams, interactive maps, and barcode and QR code generators.


    # ## What this book covers


    _Chapter 1, The Kendo UI Application Framework_, introduces you to the core components
    in the framework, such as client-side templates, using the Model View ViewModel
    (MVVM) pattern, and using the built-in validator to validate form fields.


    _Chapter 2, The Kendo UI Grid_, introduces you to the Grid component that is used
    to display data in a tabular format and includes various features such as sorting
    based on the selected column, filtering data that match certain criteria, and
    updating data.


    _Chapter 3, Kendo UI TreeView_, introduces you to the TreeView widget that is
    used to display hierarchical data such as a directory structure. The widget can
    be customized by prefixing the components in TreeView with a checkbox or representing
    them with a prefixed image.


    _Chapter 4, Kendo UI Editor_, introduces you to the Editor widget that allows
    you to create a What You See Is What You Get (WYSIWYG) interface. This interface
    contains a number of tools that can be added to the toolbar bar.


    _Chapter 5, Kendo UI PanelBar_, introduces you to the PanelBar component that
    is used to construct an accordion-like layout. This layout allows you to group
    data and stack them vertically.


    _Chapter 6, Kendo UI File Uploader_, introduces you to the Upload widget that
    allows you to upload multiple files to the server and track the progress of the
    same. It provides a consistent interface for all browsers.


    _Chapter 7, Kendo UI Window_, introduces you to the Window widget that is used
    to create pop-up windows or modal windows to display alert messages.'
  - '[PAGE 13]


    # # Preface


    Chapter 8, Kendo UI Mobile Framework, introduces you to the mobile framework,
    which includes core mobile components used in building a mobile application. This
    also includes creating layouts and views, navigating through views, and adding
    touch events.


    Chapter 9, Kendo UI Mobile Widgets, introduces you to the mobile widgets in the
    Kendo UI Mobile library. These widgets allow you to build mobile applications
    quickly. This includes the use of widgets such as ListView, ActionSheet, TabStrip,
    and SplitView for tablet applications.


    Chapter 10, Kendo UI DataViz, introduces you to the basic data visualization components
    that allow you to create interactive charts easily. These components can also
    be customized to match the desired look and feel.


    Chapter 11, Kendo UI DataViz – Advance Charting, introduces you to the advanced
    data visualization components that allow you to build dashboard-like applications
    with ease. This includes creating a Stock chart, creating a radial and linear
    gauge, generating barcode and QR code, creating flowchart-like diagrams, creating
    diagrams to represent a hierarchical structure, and creating maps to display geospatial
    data.


    # # What you need for this book


    This book includes numerous recipes on building applications using web, mobile,
    and data visualization components. You are required to download the Kendo UI framework
    from www.kendoui.com. The library has a dependency on the jQuery framework and
    therefore should be loaded before including the Kendo UI library.


    Basic knowledge of building web applications using HTML, CSS, and JavaScript is
    required. It will be helpful if you have used jQuery in your projects.


    # # Who this book is for


    This book will do wonders for web developers who have knowledge of HTML and JavaScript
    and want to polish their skills in building applications using the Kendo UI library.


    The library provides web, mobile, and data visualization widgets that can be configured
    easily to match the needs of the application.


    # # Conventions


    In this book, you will find a number of styles of text that distinguish between
    different kinds of information. Here are some examples of these styles, and an
    explanation of their meaning.


    Code words in text, database table names, folder names, filenames, file extensions,
    pathnames, dummy URLs, user input, and Twitter handles are shown as follows: "The
    Kendo UI library exports an object, kendo, which is a namespace for various other
    objects and functions."'
