    \n## There's more...\n\nWhen you render the page, the ScrollView widget shows\
    \ you the first page in the set of pages by default. If you want to display a\
    \ different page, then set the `data-page` attribute for the ScrollView widget\
    \ element:\n\n```html\n<div\n    data-role=\"scrollview\"\n    data-page=\"4\"\
    \ >\n</div>\n```\n\nThe page numbers are zero indexed, that is, when you specify\
    \ the `data-page` attribute as 4, the fifth page in the list is shown.\n\nIf you\
    \ want to hide the pager that is shown at the bottom of the ScrollView widget,\
    \ then you can set the `data-enable-pager` attribute as `false`:\n\n![](img/2a66507445090790d34dc5588b56b24c_167_0.png)\n\
    \nIn the preceding screenshot, `pager` is removed; however, the user can still\
    \ browse through the set of pages by swiping through it. This option is useful\
    \ when you have an exhaustive list of pages to browse through, and showing a pager\
    \ at the bottom of the screen would not be the experience that you want to provide.\n\
    \n## Creating a SplitView widget to display multiple panes in a tablet and building\
    \ interaction between the panes\n\nThe Kendo UI library provides a SplitView widget,\
    \ which is a tablet specific widget. A SplitView widget consists of two or more\
    \ panes, and each of these panes consist of one or more view widgets. Generally,\
    \ the SplitView widget is used to select an item in the list in one pane and update\
    \ the other pane that displays more data about the selected item.\n\n## How to\
    \ do it...\n\nLet's create two panes, Left Pane and Right Pane, and then include\
    \ these panes inside a SplitView widget. Here's the markup for the Left Pane:\n\
    \n```html\n<div data-role=\"pane\" id=\"nav-pane\" data-layout=\"left-navbar-layout\"\
    >\n  <div data-role=\"view\" id=\"test\">\n    <ul id=\"moviesList\" data-role=\"\
    listview\" data-template=\"navbar-template\"></ul>\n  </div>\n  <script type=\"\
    text/x-kendo-template\" id=\"navbar-template\">\n    <a href=\"#movieDescription?movieID=#=\
    \ data.id #\" data-target=\"content-pane\">#= data.name #</a>\n  </script>\n \
    \ <div data-role=\"layout\" data-id=\"left-navbar-layout\">\n    <header data-role=\"\
    header\">\n      <div data-role=\"navbar\">Left Pane</div>\n    </header>\n  </div>\n\
    </div>\n```\n\nA pane widget is created by setting the data-role attribute to\
    \ pane. The pane contains a view widget and the view lists items that use a ListView\
    \ widget. The view is associated with Layout, and the ListView widget is populated\
    \ using the following DataSource object:\n\n```javascript\nvar listElements =\
    \ [\n  {id: 1, name: 'Her', image: 'her.jpg'},\n  {id: 2, name: 'Gravity', image:\
    \ 'gravity.jpg'},\n  {id: 3, name: '12 Years A Slave', image: '12_years_a_slave.jpg'},\n\
    \  {id: 4, name: 'Captain Phillips', image: 'captain_phillips.jpg'},\n  {id: 5,\
    \ name: 'American Hustle', image: 'american_hustle.jpg'},\n  {id: 6, name: 'The\
    \ Wolf Of Wall Street', image: 'wolf_of_wall_street.jpg'},\n  {id: 7, name: 'Nebraska',\
    \ image: 'nebraska.jpg'},\n  {id: 8, name: 'Dallas Buyers Club', image: 'dallas_buyers_club.jpg'},\n\
    \  {id: 9, name: 'Philomena', image: 'philomena.jpg'}\n];\n```\n\nLet's now consider\
    \ the **Right Pane** widget that will be used to display details about the selected\
    \ item in **Left Pane**:\n\n```html\n<div data-role=\"pane\" id=\"content-pane\"\
    \ data-layout=\"right-content-layout\">\n  <div data-role=\"view\" data-show=\"\
    displayOrders\" id=\"movieDescription\">\n    <div id=\"movieDetails\"></div>\n\
    \  </div>\n  <div data-role=\"layout\" data-id=\"right-content-layout\">\n   \
    \ <header data-role=\"header\">\n      <div data-role=\"navbar\">Right Pane</div>\n\
    \    </header>\n  </div>\n</div>\n```\n\nThe **Right Pane** widget also contains\
    \ the view; the content of this view is generated when the user selects an item\
    \ in **Left Pane**. Notice that the anchor element specified in the Left pane\
    \ template specifies the href attribute as `#movieDescription?movieID=#= data.id\
    \ #`, which refers to the view in **Right Pane**. Also, it specifies the data-target\
    \ attribute as content-pane, which refers to **Right Pane** itself.\n\nThe next\
    \ step would be to enclose the two panes inside a SplitView widget:\n\n```html\n\
    <div data-role=\"splitview\">\n  <div data-role=\"pane\" id=\"nav-pane\" data-layout=\"\
    left-navbar-layout\">\n    .\n  </div>\n  <div data-role=\"pane\" id=\"content-pane\"\
    \ data-layout=\"right-content-layout\">\n    .\n    .\n  </div>\n</div>\n```\n\
    \nThe view widget in **Right pane** has the data-show attribute set to displayOrders;\
    \ the data-show attribute is used to specify the JavaScript function that should\
    \ be invoked when the view is used to show content. When the user clicks on any\
    \ of the items in **Left Pane**, the view in **Right Pane** is used to display\
    \ the details. Let's use the **Right Pane** widget to display the image of the\
    \ selected element in **Left Pane**. The displayOrder function is implemented\
    \ as follows:\n\n```javascript\nfunction displayOrders(e) {\n  var movieID = parseInt(e.view.params.movieID,\
    \ 10);\n  for (var i = 0; i < listElements.length; i++) {\n    if (listElements[i].id\
    \ == movieID) {\n      $('#movieDetails').html('<img src=\"images/large/' + listElements[i].image\
    \ + '\"/>');\n      break;\n    }\n  }\n}\n```\n\nHere, the function first gets\
    \ id of the selected element and then gets the image of the corresponding element.\
    \ This image is then shown in the view contained in **Right Pane**.\n\nSimilarly,\
    \ whenever a user selects an item in the ListView present in **Left Pane**, the\
    \ corresponding image would be shown in **Right Pane**.\n\n## How it works...\n\
    \nWhen you first render the page, the **Left Pane** widget is populated with the\
    \ elements from DataSource.\n\n| Left Pane | Right Pane |\n|-----------|------------|\n\
    | Her       |            |\n| Gravity   |            |\n| 12 Years A Slave | \
    \   |\n| Captain Phillips |    |\n| American Hustle |    |\n| The Wolf Of Wall\
    \ Street | |\n| Nebraska   |            |\n| Dallas Buyers Club |    |\n| Philomena\
    \  |            |\n\nInitially, **Right Pane** does not display any content since\
    \ none of the items are selected in **Left Pane**. When you select any of the\
    \ items from the ListView widget in **Left Pane**, the **Right Pane** widget is\
    \ updated to show you the image:\n\n| Left Pane | Right Pane |\n|-----------|------------|\n\
    | Her       | ![American Hustle](image) |\n| Gravity   |            |\n| 12 Years\
    \ A Slave |    |\n| Captain Phillips |    |\n| American Hustle |    |\n| The Wolf\
    \ Of Wall Street | |\n| Nebraska   |            |\n| Dallas Buyers Club |    |\n\
    | Philomena  |            |\n\n## There's more...\n\nThe SplitView widget has\
    \ stacked the panes horizontally; it's also possible to stack these panes vertically\
    \ by specifying the `data-style` attribute to `vertical`:\n\n```html\n<div data-role=\"\
    splitview\" data-style=\"vertical\">\n  .\n  .\n</div>\n```\n\nThe following screenshot\
    \ is how the panes would look when they are stacked vertically:\n\n![](img/2a66507445090790d34dc5588b56b24c_173_0.png)\n\
    \n## Tab between views in the application using a TabStrip widget\n\nThe TabStrip\
    \ widget is used to navigate between various views in the application. TabStrip\
    \ is usually placed in the footer of the layout, and on clicking the buttons present\
    \ in TabStrip, the corresponding view is shown.\n\n### How to do it...\n\nLet's\
    \ create a layout that contains a TabStrip widget in the footer:\n\n```html\n\
    <div data-role=\"layout\" data-id=\"defaultLayout\">\n  <footer data-role=\"footer\"\
    >\n    <div data-role=\"tabstrip\">\n      <a href=\"#contactsView\" data-icon=\"\
    about\">Contacts</a>\n      <a href=\"#favoritesView\" data-icon=\"favorites\"\
    >Favorites</a>\n      <a href=\"#settingsView\" data-icon=\"settings\">Settings</a>\n\
    \    </div>\n  </footer>\n</div>\n```\n\nIn the preceding code snippet, the TabStrip\
    \ widget (data-role='tabstrip') contains three buttons: **Contacts**, **Favorites**,\
    \ and **Settings**. Each of these buttons specify the href attribute whose value\
    \ is the same as the value assigned to the id attribute of the view defined in\
    \ the page.\n\n"
