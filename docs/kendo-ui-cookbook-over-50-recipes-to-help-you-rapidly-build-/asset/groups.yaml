    defaultLayout\">\n<ul\nid=\"listViewContainer\"\ndata-role=\"listview\"\ndata-template=\"\
    hierachicalTemplate\">\n</ul>\n</div>\n```\n\nThe preceding view (with id=hierarchicalView)\
    \ contains a ListView widget. The view specifies data attribute – show, whose\
    \ value refers to the function that will be invoked every time view is rendered,\
    \ that is, whenever view is reused to display the next level elements. The ListView\
    \ widget specifies the data-template attribute as hierarchicalTemplate. The template\
    \ can be specified when initializing the widget, or it can be specified as a data-\
    \ attribute:\n\n```html\n<script id=\"hierachicalTemplate\" type=\"text/x-kendo-template\"\
    >\n # if(data.hasModels) { #\n <a href=\"#hierarchicalView?parent=#: data.id #\"\
    >\n #= name #\n </a>\n # } else { #\n #= name #\n # } #\n</script>\n```\n\nThe\
    \ template first checks whether the current model object (referred in data) has\
    \ the hasModels property set to true and then adds a hyperlink that refers to\
    \ the same view (with id=hierarchicalView) with a query parameter, parent, set\
    \ to id of the model object. If the current model object is the leaf node, then\
    \ the same would be added to the list without any hyperlink.\n\nWhen the user\
    \ clicks on the hyperlink, the view should be reused to display the next elements\
    \ in the hierarchy. As mentioned earlier, the data-show attribute specifies the\
    \ function that should be invoked every time the view is used to display the content.\
    \ The attachDataSource function is invoked every time the view is shown:\n\nfunction\
    \ attachDataSource(e) {\nvar parentID = e.view.params.parent,\nlistView = $(\"\
    #listViewContainer\")\n.data('kendoMobileListView');\n\nif (!parentID) {\nlistView.setDataSource(cars);\n\
    } else {\ncars.fetch(function () {\nvar item = cars.get(parentID);\nlistView.setDataSource(item.children);\n\
    });\n}\n}\n\nWhenever the user clicks on the link, the view is reused and the\
    \ preceding function is invoked. The event object is then used to get parentID.\
    \ Initially, when the view is used to render the elements, that is, the elements\
    \ in the top level in the hierarchy, parentID would be null. In this case, the\
    \ ListView is set to the hierarchical data source that we defined earlier. When\
    \ the user navigates the view, parentID would be present and the ListView's dataSource\
    \ is set to the child nodes of the corresponding parent.\n\n# How it works...\n\
    \nWhen you render the page, the elements in the top level of the hierarchy would\
    \ be displayed as shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_157_0.png)\n\
    \n"
  mdcn: "\n\n'Robert Downey Jr.', 'Will Smith',\n'Robert De Niro', 'Christian Bale',\n\
    'Brad Pitt','Tom Hanks',\n'Robert Pattinson', 'Ben Stiller'];\n\n现在初始化 ListView\
    \ 小部件时，将前面的元素作为 dataSource 提供，并包含 filterable 属性并将其值设置为 true：\n\n$('#listViewContainer').kendoMobileListView({\n\
    dataSource: listElements,\nfilterable: true\n});\n\n当将 filterable 属性设置为 true 时，列表顶部会添加一个搜索输入字段。当用户开始在搜索输入字段中键入时，列表会被过滤以显示与用户输入匹配的选项。在这里，用户输入字符串与列表中的元素进行比较，只有那些以输入字符串开头的元素才会显示在列表中。如果您想更改此逻辑，使其返回包含输入字符串的元素，而不是以它开头的元素，那么请按如下方式提及\
    \ operator 字段：\n\n$('#listViewContainer').kendoMobileListView({\ndataSource: listElements,\n\
    filterable: {\n\"operator\": \"contains\"\n}\n});\n\noperator 字段可以包含以下值之一：startsWith,\
    \ endswith, contains, eq (等于), neq (不等于), lt (小于), lte (小于或等于), gt (大于), 和 gte\
    \ (大于或等于)。\n\n当使用包含对象的 dataSource 时，小部件将无法过滤列表，因为它不知道应将用户输入与哪个字段进行匹配。要修复此问题，您可以指定\
    \ field 选项：\n\n$('#listViewContainer').kendoMobileListView({\ndataSource: actors,\n\
    template: '#= name #',\nfilterable: {\n\"field\": \"name\",\n\"operator\": \"\
    contains\"\n}\n});\n\n前面的代码片段查找 name 字段并过滤列表中的元素。在所有先前的情况中，当用户开始在搜索输入字段中键入时，列表会被过滤。如果您希望用户单击搜索按钮，那么请指定\
    \ autoFilter 选项并将其设置为 false：\n\n$('#listViewContainer').kendoMobileListView({\n\
    dataSource: actors,\ntemplate: '#= name #',\nfilterable: {\n\"field\": \"name\"\
    ,\n\"autoFilter\": false,\n\"operator\": \"contains\"\n}\n});\n\n通过将 autoFilter\
    \ 属性设置为 false，用户将不得不单击搜索按钮才能获取过滤后的列表。当您处理长列表且不希望列表在每次按键输入时刷新时，这很有用。\n\n# 工作原理...\n\
    \n当您渲染页面时，您将在列表顶部看到搜索输入字段。\n\n![](img/2a66507445090790d34dc5588b56b24c_152_0.png)\n\
    \n当您开始在搜索字段中键入时，列表会被过滤，并且仅包含那些以输入文本开头的选项。\n\n![](img/2a66507445090790d34dc5588b56b24c_153_0.png)\n\
    \n当您将 operator 更改为 `contains` 时，列表会被过滤，并且现在包含那些包含输入文本的选项。\n\n![](img/2a66507445090790d34dc5588b56b24c_153_1.png)\n\
    \n# 更多...\n\n搜索输入字段具有占位符文本 **Search**。您可以通过指定 `placeholder` 选项来自定义此文本：\n\n$('#listViewContainer').kendoMobileListView({\n\
    dataSource: actors,\ntemplate: '#= name #',\nfilterable: {\n\"field\": \"name\"\
    ,\n\"autoFilter\": false,\n\"placeholder\": \"Find...\",\n\"operator\": \"contains\"\
    \n}\n});\n\n当您渲染页面时，您将看到 `placeholder` 文本已更改为 **Find...**：\n\n![](img/2a66507445090790d34dc5588b56b24c_154_0.png)\n\
    \n# 使用 ListView 小部件构建分层列表\n\n在所有先前的示例中，服务返回的数据包含所有记录，并且相同的记录显示在列表中。当处理分层数据结构而不是扁平结构时，可以自定义\
    \ ListView 小部件，以便以分层方式显示数据，即显示层次结构第一级中的元素，然后遍历各个层级，直到到达层次结构中的叶子节点。\n\n# 入门\n\n\
    要构建分层列表，服务应返回列出需要显示的第一组记录的数据。每条记录都应有一个字段，指示是否存在子记录，或者它是层次结构中的叶子节点。此信息将随后在 ListView\
    \ 小部件中使用，从而使用户能够在层次结构中导航。\n\n# 操作方法...\n\nListView 小部件应首先显示层次结构顶层中存在的记录。假设服务配置为在从客户端浏览器查询时返回相同数据：\n\
    \n[\n{ \"id\": 1, \"name\": \"Lamborghini\", \"hasModels\": true },\n{ \"id\"\
    : 2, \"name\": \"Ferrari\", \"hasModels\": true },\n{ \"id\": 3, \"name\": \"\
    Aston Martin\", \"hasModels\": true }\n]\n\nid 属性用于唯一标识分层结构中的每条记录。它还有一个 hasModels\
    \ 属性，指示记录是否具有关联的子节点。下一步是创建 DataSource 对象并指定服务 URL 以及架构详细信息：\n\nvar cars = new\
    \ kendo.data.HierarchicalDataSource({\ntransport: {\nread: '/carService'\n},\n\
    schema: {\nmodel: {\nid: 'id',\nhasChildren: 'hasModels'\n}\n}\n});\n\n在前面的代码片段中，我们使用\
    \ kendo.data.HierarchicalDataSource 创建分层数据源的实例。定义包含架构对象，该对象指定 id 和 hasChildren\
    \ 属性的映射。每当用户导航到层次结构中的各个层级时，都应使用渲染分层结构的视图：\n\n```html\n<div\nid=\"hierarchicalView\"\
    \ndata-role=\"view\"\ndata-title=\"Cars\"\ndata-show=\"attachDataSource\"\ndata-layout=\"\
    defaultLayout\">\n<ul\nid=\"listViewContainer\"\ndata-role=\"listview\"\ndata-template=\"\
    hierachicalTemplate\">\n</ul>\n</div>\n```\n\n前面的视图（id=hierarchicalView）包含一个 ListView\
    \ 小部件。该视图指定了 data 属性 – show，其值引用每次渲染视图时将被调用的函数，即每次视图被重用以显示下一级元素时。ListView 小部件指定了\
    \ data-template 属性为 hierarchicalTemplate。模板可以在初始化小部件时指定，也可以作为 data- 属性指定：\n\n\
    ```html\n<script id=\"hierachicalTemplate\" type=\"text/x-kendo-template\">\n\
    \ # if(data.hasModels) { #\n <a href=\"#hierarchicalView?parent=#: data.id #\"\
    >\n #= name #\n </a>\n # } else { #\n #= name #\n # } #\n</script>\n```\n\n模板首先检查当前模型对象（在\
    \ data 中引用）是否将 hasModels 属性设置为 true，然后添加一个指向同一视图（id=hierarchicalView）的超链接，并带有查询参数\
    \ parent，设置为模型对象的 id。如果当前模型对象是叶子节点，则将其添加到列表中，不带任何超链接。\n\n当用户单击超链接时，视图应被重用以显示层次结构中的下一组元素。如前所述，data-show\
    \ 属性指定每次使用视图显示内容时应调用的函数。attachDataSource 函数在每次显示视图时被调用：\n\nfunction attachDataSource(e)\
    \ {\nvar parentID = e.view.params.parent,\nlistView = $(\"#listViewContainer\"\
    )\n.data('kendoMobileListView');\n\nif (!parentID) {\nlistView.setDataSource(cars);\n\
    } else {\ncars.fetch(function () {\nvar item = cars.get(parentID);\nlistView.setDataSource(item.children);\n\
    });\n}\n}\n\n每当用户单击链接时，视图被重用，前面的函数被调用。然后使用事件对象获取 parentID。最初，当视图用于渲染元素（即层次结构顶层中的元素）时，parentID\
    \ 为 null。在这种情况下，ListView 被设置为我们先前定义的分层数据源。当用户导航视图时，parentID 将存在，并且 ListView 的\
    \ dataSource 被设置为相应父节点的子节点。\n\n# 工作原理...\n\n当您渲染页面时，层次结构顶层中的元素将如下面的屏幕截图所示显示：\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_157_0.png)\n\n\n"
