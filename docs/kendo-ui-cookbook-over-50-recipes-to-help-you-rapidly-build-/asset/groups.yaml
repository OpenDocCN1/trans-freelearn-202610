    \ />\n  12 Years A Slave\n </a>\n</li>\n</ul>\n```\n\nThe preceding markup contains\
    \ an unordered list, where each list element contains an image and a text. When\
    \ the application is initialized, the widgets that are present in the page are\
    \ initialized based on the values assigned to the `data-role` attribute.\n\n##\
    \ How it works...\n\nWhen you render the page, the ListView widget is constructed\
    \ and rendered on the mobile device, as shown in the following screenshot:\n\n\
    ![](img/2a66507445090790d34dc5588b56b24c_142_0.png)\n\nHere, each list item contains\
    \ an `anchor` (hyperlink to a page) element whose `href` attribute refers to the\
    \ `html` page. Also, it contains a right arrow aligned to the right-hand side\
    \ of each item in the list. This indicates that the user can click to view the\
