    \ and autoUpload. The saveUrl property specifies the service URL where the files\
    \ will be uploaded. The removeUrl property specifies the service URL that will\
    \ handle the removal of the uploaded files. The Boolean autoUpload property specifies\
    \ whether the files will be uploaded when they are selected by the user or when\
    \ the user clicks on the Submit button. In this example, this is set to true,\
    \ which means that the files will be uploaded to the server when the user selects\
    \ the file.\n\nWhen you select multiple files using the file uploader widget,\
    \ each file is uploaded asynchronously. The client sends a POST request with the\
    \ file data in the request payload. It uses the XmlHttpRequest object to send\
    \ an asynchronous POST request to saveUrl.\n\n### How it works...\n\nWhen you\
    \ select multiple files using the file uploader widget, a POST request is sent\
    \ to the service mentioned in the saveUrl property for each selected file, as\
    \ shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_106_0.png)\n\
    \nHere, three files have been selected, and each file is being uploaded asynchronously.\
    \ While the files are being uploaded, the widget shows you the progress of the\
    \ upload process. The file uploader widget uses the XmlHttpRequest object to upload\
