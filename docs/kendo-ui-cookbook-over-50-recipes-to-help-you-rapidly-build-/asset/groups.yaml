    \ to indicate where a value lies in the given range. It is similar to the Radial\
    \ Gauge widget and takes the same set of options as well. It is used to display\
    \ the value on a linear scale.\n\n### How to do it...\n\nLinear Gauge is created\
    \ by invoking the kendoLinearGauge function on the DOM element. It uses the same\
    \ options as the Radial Gauge widget:\n\n```javascript\n$(\"#chart\").kendoLinearGauge({\n\
    \    pointer: {\n        value: 20,\n    },\n    scale: {\n        min: 0,\n \
    \       max: 200,\n        majorUnit: 20,\n        minorUnit: 10\n    }\n});\n\
    ```\n\nThis will display the Linear Gauge widget with its pointer at **20**. By\
    \ default, the widget is displayed vertically, that is, the value is projected\
    \ on the y axis. To display the widget horizontally, specify `vertical` as `false`\
    \ under the `scale` option. This will display the widget horizontally.\n\n###\
    \ How it works...\n\nWhen you render the page, the Linear Gauge is displayed vertically,\
    \ as shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_217_0.png)\n\
    \nAfter setting `vertical` as `false`, the widget is displayed horizontally.\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_217_1.png)\n\nAs with the Radial Gauge,\
    \ the Linear Gauge can also include the ranges option. After including the ranges\
    \ option, you will see the widget showing this option along its scale.\n\n![](img/2a66507445090790d34dc5588b56b24c_218_0.png)\n\
    \n### There's more...\n\nThe pointer shown on the Linear Gauge is barIndicator\
    \ by default. The other option available is arrow. To change the pointer, set\
    \ shape to arrow under the pointer option:\n\n```javascript\npointer: {\n    value:\
    \ 20,\n    shape: 'arrow'\n}\n```\n\nNow when you render the page, you will see\
    \ an arrow.\n\n![](img/2a66507445090790d34dc5588b56b24c_218_1.png)\n\n## Generating\
    \ barcode images using various encoding methods\n\nThe Kendo UI library provides\
    \ APIs that can be used to generate the barcode graphic image for the given value.\
    \ For example, each product in the supermarket can have a barcode associated with\
    \ it. When a customer purchases the product, the barcode would be used to get\
    \ the product price and other details. The library can generate the barcode by\
    \ referring to the unique identifier.\n\n### How to do it...\n\nA barcode image\
    \ can be generated by invoking the kendoBarcode function on the DOM element:\n\
    \n```javascript\n$(\"#chart\").kendoBarcode({\n    value: '1234567'\n});\n```\n\
    \nHere, the 1234567 value will be encoded using the default encoding, that is,\
    \ code39. You can also specify the encoding method to be used by specifying the\
    \ type field:\n\n```javascript\n$(\"#chart\").kendoBarcode({\n    value: '1234567',\n\
    \    type: 'ean8'\n});\n```\n\nIn the preceding code snippet, the encoding type\
    \ is set to ean8. The other possible values are EAN13, UPCE, UPCA, Code11, Code39,\
    \ Code39Extended, Code93, Code93Extended, Code128, Code128A, Code128B, Code128C,\
    \ GS1-128, MSIMod10, MSIMod11, MSIMod1010, MSIMod1100, and POSTNET. The value\
    \ attribute is mandatory and a barcode is generated using the value and the specified\
    \ encoding type.\n\n### How it works...\n\nWhen you don't specify the encoding\
    \ type, the code39 encoding is used to generate the barcode, as shown in the following\
    \ screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_219_0.png)\n\nThe value\
    \ is shown in the previous barcode. To hide the value, specify the text attribute\
    \ and set the visible option to false:\n\n```javascript\n$(\"#chart\").kendoBarcode({\n\
    \    value: '1234567',\n    text: {\n        visible: false\n    }\n});\n```\n\
    \nWhen you use some other encoding type, for example, ean8, the barcode is generated\
    \ accordingly.\n\n![](img/2a66507445090790d34dc5588b56b24c_219_1.png)\n\n## Generating\
    \ a QR code image to represent a URL, e-mail, telephone, and geographic location\n\
    \nA **Quick Response code (QR code)** is generally used to efficiently store data\
    \ by encoding it. It uses ISO_8859_1 as the encoding method by default to store\
    \ data. The generated code consists of black modules (square dots) arranged in\
    \ a square grid on a white background. This code can then be read by a camera\
    \ and then processed by an application.\n\nIn this recipe, we will see how various\
    \ forms of data such as URLs, e-mail addresses, telephone numbers, and geographic\
    \ locations can be stored in a QR code.\n\n### How to do it...\n\nTo generate\
    \ a QR code, invoke the `kendoQRCode` function on the DOM element:\n\n```javascript\n\
    $(\"#chart\").kendoQRCode({\n    value: 'http://www.kendoui.com'\n});\n```\n\n\
    In the previous example, the `http://www.kendoui.com` URL is specified. This value\
    \ will be encoded using ISO_8859_1 and represented in a square grid. When you\
    \ scan the QR code, the value stored in it is identified. Since the value is prefixed\
    \ with the protocol name, `http://`, the value is recognized as a URL. Similarly,\
    \ an e-mail address should be prefixed with `mailto:`, a telephone number with\
    \ `tel`, and a geolocation with `geo` followed by the latitude and longitude information.\
    \ A geo location can be encoded in the following way:\n\n```javascript\n$(\"#chart\"\
    ).kendoQRCode({\n    value: 'geo: 12.9667, 77.5667, 100'\n});\n```\n\nBy default,\
    \ the color of the QR code is black and is drawn on a white background. This can\
    \ be changed by specifying the `color` and `background` attributes:\n\n```javascript\n\
    $(\"#chart\").kendoQRCode({\n    value: 'geo: 12.9667, 77.5667, 100',\n    color:\
    \ 'red',\n    background: 'yellow'\n});\n```\n\n### How it works...\n\nWhen you\
    \ render the page, you will see a square grid that shows you the dots and lines\
    \ that represent the QR code for the URL.\n\n![](img/2a66507445090790d34dc5588b56b24c_221_0.png)\n\
    \nWhen you change the value to the geolocation and specify the color and background\
    \ attributes, the generated QR code is shown as follows:\n\n![](img/2a66507445090790d34dc5588b56b24c_221_1.png)\n\
    \n### There's more...\n\nA QR code has an error correction capability that allows\
    \ you to restore data if the code is damaged or is dirty. There are four error\
    \ correction levels, namely, L, M, Q, and H, that can be applied to a QR code.\
    \ Each of these levels indicate the percentage of data that can be recovered,\
    \ that is, L recovers 7 percent data, M recovers 15 percent, Q recovers 25 percent\
    \ data, and H recovers 30 percent. When initializing a QR code, one can change\
    \ the error correction level by setting the errorCorrection attribute:\n\n```javascript\n\
    $(\"#chart\").kendoQRCode({\n    value: 'geo: 12.9667, 77.5667, 100',\n    errorCorrection:\
    \ 'Q'\n});\n```\n\nIn the previous example, the errorCorrection attribute is set\
    \ to Q, and it is used to encode the value.\n\n## Creating flow diagrams using\
    \ Kendo Diagram\n\nAdding workflow diagrams or hierarchical structure to a web\
    \ page is now made easy with the introduction of diagrams in the Kendo UI library.\
    \ In this recipe, we will build a flowchart diagram by creating shapes and then\
    \ we will connect those with connectors. The library also provides a set of layouts\
    \ that can be used to represent a hierarchical or tree-like structure.\n\n###\
    \ How to do it...\n\nA flowchart is used to represent steps in an algorithm; these\
    \ steps are shown as shapes (rectangles and circles). The connectors are then\
    \ used to connect the shapes and describe the flow. A diagram in Kendo UI is created\
    \ by invoking the kendoDiagram function on the selected DOM node:\n\n```javascript\n\
    var diagram = $(\"#chart\").kendoDiagram({\n    connectionDefaults: {\n      \
    \  stroke: {\n            color: '#F00'\n        },\n        startCap: 'FilledCircle',\n\
    \        endCap: 'ArrowEnd',\n    }\n}).getKendoDiagram();\n```\n\nIn the preceding\
    \ code snippet, an empty diagram is created, with some default attributes for\
    \ connections specified. A connection is used to connect two or more shapes in\
    \ the diagram. The connectionDefaults option specifies the color of the stroke\
    \ to be applied; the startCap and endCap options are used to specify the decoration\
    \ to be applied. In this case, the startCap option has the value FilledCircle,\
    \ which will show you a circle at the start of the connection. The other value\
    \ that can be assigned to startCap is ArrowStart. This will add an arrow directed\
    \ towards the shape. The endCap option has its value set to ArrowEnd. In this\
    \ example, the shape from which the connection is initiated will have a filled\
    \ circle attached to it, and an arrow is shown, which is directed towards the\
    \ second shape.\n\nThe getKendoDiagram function will return an instance of the\
    \ diagram once it's initialized. The diagram is like a canvas on which you can\
    \ add several shapes and also connect them.\n\n"
  mdcn: "\n\n## 使用线性度量器小部件\n\n线性度量器小部件也用于指示某个值在给定范围内的位置。它与径向度量器小部件类似，并采用相同的选项集。它用于在线性刻度上显示值。\n\
    \n### 操作方法...\n\n线性度量器是通过在 DOM 元素上调用 kendoLinearGauge 函数创建的。它使用与径向度量器小部件相同的选项：\n\
    \n```javascript\n$(\"#chart\").kendoLinearGauge({\n    pointer: {\n        value:\
    \ 20,\n    },\n    scale: {\n        min: 0,\n        max: 200,\n        majorUnit:\
    \ 20,\n        minorUnit: 10\n    }\n});\n```\n\n这将显示指针位于 **20** 的线性度量器小部件。默认情况下，小部件垂直显示，即值投影在\
    \ y 轴上。要水平显示小部件，请在 `scale` 选项下将 `vertical` 指定为 `false`。这将水平显示小部件。\n\n### 工作原理...\n\
    \n渲染页面时，线性度量器垂直显示，如下图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_217_0.png)\n\
    \n将 `vertical` 设置为 `false` 后，小部件水平显示。\n\n![](img/2a66507445090790d34dc5588b56b24c_217_1.png)\n\
    \n与径向度量器一样，线性度量器也可以包含 ranges 选项。包含 ranges 选项后，您将看到小部件沿其刻度显示此选项。\n\n![](img/2a66507445090790d34dc5588b56b24c_218_0.png)\n\
    \n### 更多内容...\n\n线性度量器上显示的指针默认是 barIndicator。另一个可用选项是 arrow。要更改指针，请在 pointer 选项下将\
    \ shape 设置为 arrow：\n\n```javascript\npointer: {\n    value: 20,\n    shape: 'arrow'\n\
    }\n```\n\n现在渲染页面时，您将看到一个箭头。\n\n![](img/2a66507445090790d34dc5588b56b24c_218_1.png)\n\
    \n## 使用各种编码方法生成条形码图像\n\nKendo UI 库提供可用于为给定值生成条形码图形图像的 API。例如，超市中的每个产品都可以关联一个条形码。当客户购买产品时，条形码将用于获取产品价格和其他详细信息。该库可以通过引用唯一标识符来生成条形码。\n\
    \n### 操作方法...\n\n可以通过在 DOM 元素上调用 kendoBarcode 函数来生成条形码图像：\n\n```javascript\n$(\"\
    #chart\").kendoBarcode({\n    value: '1234567'\n});\n```\n\n这里，1234567 值将使用默认编码（即\
    \ code39）进行编码。您也可以通过指定 type 字段来指定要使用的编码方法：\n\n```javascript\n$(\"#chart\").kendoBarcode({\n\
    \    value: '1234567',\n    type: 'ean8'\n});\n```\n\n在前面的代码片段中，编码类型设置为 ean8。其他可能的值包括\
    \ EAN13、UPCE、UPCA、Code11、Code39、Code39Extended、Code93、Code93Extended、Code128、Code128A、Code128B、Code128C、GS1-128、MSIMod10、MSIMod11、MSIMod1010、MSIMod1100\
    \ 和 POSTNET。value 属性是必需的，条形码将使用该值和指定的编码类型生成。\n\n### 工作原理...\n\n当您不指定编码类型时，将使用\
    \ code39 编码来生成条形码，如下图所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_219_0.png)\n\
    \n值显示在前面的条形码中。要隐藏值，请指定 text 属性并将 visible 选项设置为 false：\n\n```javascript\n$(\"#chart\"\
    ).kendoBarcode({\n    value: '1234567',\n    text: {\n        visible: false\n\
    \    }\n});\n```\n\n当您使用其他编码类型时，例如 ean8，条形码将相应生成。\n\n![](img/2a66507445090790d34dc5588b56b24c_219_1.png)\n\
    \n## 生成 QR 码图像以表示 URL、电子邮件、电话和地理位置\n\n**快速响应码（QR 码）**通常用于通过编码数据来高效存储数据。它默认使用 ISO_8859_1\
    \ 作为编码方法来存储数据。生成的代码由排列在白色背景上的方形网格中的黑色模块（方形点）组成。然后可以通过摄像头读取该代码，并由应用程序处理。\n\n在此示例中，我们将看到如何将各种形式的数据（如\
    \ URL、电子邮件地址、电话号码和地理位置）存储在 QR 码中。\n\n### 操作方法...\n\n要生成 QR 码，请在 DOM 元素上调用 `kendoQRCode`\
    \ 函数：\n\n```javascript\n$(\"#chart\").kendoQRCode({\n    value: 'http://www.kendoui.com'\n\
    });\n```\n\n在前面的示例中，指定了 `http://www.kendoui.com` URL。该值将使用 ISO_8859_1 进行编码，并在方形网格中表示。扫描\
    \ QR 码时，将识别其中存储的值。由于该值带有协议名称前缀 `http://`，因此该值被识别为 URL。同样，电子邮件地址应带有 `mailto:` 前缀，电话号码应带有\
    \ `tel` 前缀，地理位置应带有 `geo` 并随后跟随纬度和经度信息。地理位置可以按以下方式编码：\n\n```javascript\n$(\"#chart\"\
    ).kendoQRCode({\n    value: 'geo: 12.9667, 77.5667, 100'\n});\n```\n\n默认情况下，QR\
    \ 码的颜色为黑色，并在白色背景上绘制。可以通过指定 `color` 和 `background` 属性来更改此设置：\n\n```javascript\n\
    $(\"#chart\").kendoQRCode({\n    value: 'geo: 12.9667, 77.5667, 100',\n    color:\
    \ 'red',\n    background: 'yellow'\n});\n```\n\n### 工作原理...\n\n渲染页面时，您将看到一个方形网格，显示代表\
    \ URL 的 QR 码的点和线。\n\n![](img/2a66507445090790d34dc5588b56b24c_221_0.png)\n\n当您将值更改为地理位置并指定\
    \ color 和 background 属性时，生成的 QR 码将如下所示：\n\n![](img/2a66507445090790d34dc5588b56b24c_221_1.png)\n\
    \n### 更多内容...\n\nQR 码具有错误纠正功能，允许您在代码损坏或脏污时恢复数据。有四种可应用于 QR 码的错误纠正级别，即 L、M、Q 和 H。每个级别指示可以恢复的数据百分比，即\
    \ L 恢复 7% 的数据，M 恢复 15%，Q 恢复 25% 的数据，H 恢复 30%。初始化 QR 码时，可以通过设置 errorCorrection\
    \ 属性来更改错误纠正级别：\n\n```javascript\n$(\"#chart\").kendoQRCode({\n    value: 'geo:\
    \ 12.9667, 77.5667, 100',\n    errorCorrection: 'Q'\n});\n```\n\n在前面的示例中，errorCorrection\
    \ 属性设置为 Q，并用于编码该值。\n\n## 使用 Kendo Diagram 创建流程图\n\n随着 Kendo UI 库中引入图表，现在可以轻松地将工作流程图或层次结构添加到网页中。在此示例中，我们将通过创建形状来构建流程图，然后使用连接器将它们连接起来。该库还提供一组布局，可用于表示层次结构或树状结构。\n\
    \n### 操作方法...\n\n流程图用于表示算法中的步骤；这些步骤显示为形状（矩形和圆形）。然后使用连接器连接形状并描述流程。Kendo UI 中的图表是通过在选定的\
    \ DOM 节点上调用 kendoDiagram 函数创建的：\n\n```javascript\nvar diagram = $(\"#chart\").kendoDiagram({\n\
    \    connectionDefaults: {\n        stroke: {\n            color: '#F00'\n   \
    \     },\n        startCap: 'FilledCircle',\n        endCap: 'ArrowEnd',\n   \
    \ }\n}).getKendoDiagram();\n```\n\n在前面的代码片段中，创建了一个空图表，并为连接指定了一些默认属性。连接用于连接图表中的两个或多个形状。connectionDefaults\
    \ 选项指定要应用的描边颜色；startCap 和 endCap 选项用于指定要应用的装饰。在此示例中，startCap 选项的值为 FilledCircle，这将在连接的起始处显示一个圆形。可以分配给\
    \ startCap 的另一个值是 ArrowStart。这将添加一个指向形状的箭头。endCap 选项的值设置为 ArrowEnd。在此示例中，发起连接的形状将附带一个填充圆形，并显示一个指向第二个形状的箭头。\n\
    \ngetKendoDiagram 函数将在初始化后返回图表的实例。图表就像一个画布，您可以在其中添加多个形状并将它们连接起来。\n\n"
