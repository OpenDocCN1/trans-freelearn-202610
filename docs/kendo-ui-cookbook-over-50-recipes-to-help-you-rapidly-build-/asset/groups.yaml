    \ row in the Grid. These buttons should be bound to a remote service so that when\
    \ the user updates or deletes a record, the service will update the same in the\
    \ database. In earlier recipes, we looked at using the `DataSource` object with\
    \ a `transport` attribute. Here, you can use the same attribute to specify the\
    \ endpoint for each of the actions, as shown in the following code snippet:\n\n\
    ```\ndataSource: {\n transport: {\n read: '/test',\n create: {\n url: '/test',\n\
    \ type: 'POST'\n },\n update: {\n url: '/test',\n type: 'PUT'\n },\n destroy:\
    \ {\n url: '/test',\n type: 'DELETE'\n }\n },\n schema: {\n model: {\n id: \"\
    movieName\",\n fields: {\n movieName: { type: \"string\" },\n year: { type: \"\
    number\" },\n rating: { type: \"number\" }\n }\n }\n }\n }\n}\n```"
