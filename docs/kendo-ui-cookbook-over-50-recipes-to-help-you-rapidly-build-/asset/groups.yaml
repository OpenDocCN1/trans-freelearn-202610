  - '[PAGE 29]


    # # The Kendo UI Application Framework


    The data-bind attribute specifies a binding source that refers to the optionData
    model attribute in ViewModel. Now, the only step pending is to bind View elements
    to ViewModel, which is attained by executing the following line of code:


    ```

    kendo.bind($(''select''), viewModel);

    ```


    # # How it works...


    The select tag specifies the source binding that refers to the optionsData model
    attribute. This will make the collection of objects available to all the tags
    inside it.


    The data-template attribute that refers to the template in the page is provided
    with the collection of objects (optionsData) and the template is iterated for
    the number of entries in the array. In this example, the optionsData collection
    contains three objects and hence, the template is generated three times and inserted
    as the HTML content for the select tag. The generated content would look like
    the following code snippet:


    ```

    <select data-template="select-template" data-bind="source: optionsData"> <option
    data-bind=" attr: {value: optionValue}, html: optionName" value="1"> Test1 </option>
    <option data-bind=" attr: {value: optionValue}, html: optionName" value="2"> Test2
    </option> <option data-bind=" attr: {value: optionValue}, html: optionName" value="3">
    Test3 </option> </select>

    ```


    The data- attributes would remain as they are, and the generated content now has
    the value attribute and the HTML content. Note that the preceding code could have
    been accomplished by using a for statement in a hash-based template and then appending
    the generated output to the select tag. However, using a data-template attribute
    and source binding allows you to do this seamlessly and write more intuitive code.'
