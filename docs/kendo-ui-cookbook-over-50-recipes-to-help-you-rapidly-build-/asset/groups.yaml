    \ have the value `d`. The size of the file should be in bytes. However, when displaying\
    \ the image metadata, it would be converted to kilobytes.\n\n## Kendo UI Editor\n\
    \nThe next step is to specify the transport URLs to read the structure previously\
    \ mentioned and to get the thumbnail images from the repository:\n\n```\n$(\"\
    #editor\").kendoEditor({\n    tools: [ 'insertImage' ],\n    imageBrowser: {\n\
    \        transport: {\n            read: \"/app/ImageService/Read\",\n       \
    \     thumbnailUrl: \"/app/ImageService/ThumbNailService\",\n            imageUrl:\
    \ \"/app/ImageService/Image?path={0}\"\n        }\n    }\n});\n```\n\nHere, the\
    \ imageBrowser configuration option specifies the transport URLs to read the JSON\
