    \ 的其他可能值包括以下内容：\n\n+   - up：在此值中，根节点位于底部，其子节点向上添加，即树将被反转\n+   - left：在此值中，根节点放置在左侧，其子节点添加到右侧\n\
    +   - right：在此值中，根节点放置在右侧，其子节点添加到左侧\n+   - mindmapVertical：在此值中，根节点位于中心，其子节点在根节点上下均匀分布\n\
