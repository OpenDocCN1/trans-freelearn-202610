    \n![](img/2a66507445090790d34dc5588b56b24c_74_0.png)\n\n## 4 Kendo UI Editor\n\
    \n在本章中，我们将介绍以下配方：\n\n- 使用 `kendoEditor` 函数创建所见即所得编辑器\n- 在编辑器工具集中添加和删除工具\n- 使用图片浏览器工具将图片插入编辑器\n\
    \n### 简介\n\nKendo UI Editor 小部件允许你使用 **WYSIWYG（所见即所得）** 界面创建丰富内容。该界面允许你格式化文本、创建项目符号或编号列表，并插入表格、超链接和图像。在初始化编辑器小部件时，还可以自定义工具集。还可以创建可在编辑器中使用的自定义工具。除了各种编辑器控件外，你还可以使用图片浏览器将图片插入编辑器。\n\
    \n### 使用 kendoEditor 函数创建所见即所得编辑器\n\n编辑器可以通过使用 `textarea` 或 `div` 元素来创建。在此配方中，我们将使用\
    \ `textarea` 元素创建编辑器，并向你展示可用于格式化数据的默认工具。\n\n# 如何操作...\n\n让我们首先创建一个 textarea 元素，指定行数、列数和宽度：\n\
    \n```\n<textarea id=\"editor\"\n    row=\"20\"\n    cols=\"80\"\n    style=\"\
    width: 700px;\">\n</textarea>\n```\n\n下一步是使用此 textarea 元素并通过调用 kendoEditor 函数创建编辑器：\n\
    \n```\n$(\"#editor\").kendoEditor();\n```\n\nkendoEditor 函数用于将 textarea 初始化为编辑器小部件。编辑器现在将具有所见即所得界面，允许用户格式化文本。\n\
    \n# 工作原理...\n\n当你通过调用 kendoEditor 函数将 textarea 元素初始化为编辑器时，工具集中将提供各种工具，如下面的屏幕截图所示：\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_77_0.png)\n\n工具栏显示在编辑器顶部，允许用户格式化输入的数据。这包括对输入的文本应用不同的格式、将文本标记为粗体或斜体、下划线选定的文本、对齐文本、创建项目符号或编号列表，以及添加图像和表格。\n\
    \n# 在编辑器工具集中添加和删除工具\n\n工具栏可以自定义为仅包含所需的那组工具。例如，你可能希望从工具栏中排除插入表格的选项，或者你可能希望包含其他选项来格式化文本，例如更改字体颜色、高亮选定的文本，等等。\n\
    \n### 如何操作...\n\n在初始化编辑器小部件时，指定 tools 选项，仅包含需要在工具栏中显示的工具：\n\n```\n$(\"#editor\"\
    ).kendoEditor({\n    tools: [\n        \"bold\",\n        \"italic\",\n      \
    \  \"strikethrough\",\n        \"subscript\",\n        \"superscript\",\n    \
    \    \"foreColor\",\n        \"backColor\"\n    ]\n});\n```\n\n在前面的代码片段中，提到了应该在工具栏中显示的工具。这些工具将替换默认工具。\n\
    \n> tools 配置选项可以包含编辑器命令，例如 bold、italic、underline、strikethrough、subscript、superscript、fontName、fontSize、foreColor、backColor、justifyLeft、justifyCenter、justifyRight、justifyFull、insertUnorderedList、insertOrderedList、indent、outdent、createLink、unlink、insertImage、createTable、addColumnLeft、addColumnRight、addRowAbove、addRowBelow、deleteRow、deleteColumn、formatting、insertHtml\
    \ 和 viewHtml。\n\n"
