    \ 属性指定从中检索地图数据的 URL。它会考虑地图设置的缩放级别以及 x 和 y 坐标，即 center 属性和 subdomains 属性中指定的纬度和经度信息。请注意，在\
    \ urlTemplate 选项之后，指定了 subdomains 属性。它是一个数组，提及应用于获取地图图像的子域。浏览器对每个域可并行检索的图像数量有限制。使用子域时，图像会并行获取；因此，缩短了呈现整个地图所需的时间。attribution\
    \ 字段用于指定图层的归属信息。\n\n现在让我们向地图添加一些标记。标记是另一种可以添加的图层类型：\n\n```\n$('#chart').kendoMap({\n\
