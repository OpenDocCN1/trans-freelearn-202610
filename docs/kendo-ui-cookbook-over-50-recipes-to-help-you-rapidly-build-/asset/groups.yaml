    ```\n\n现在，当元素被拖动时，工具提示是通过调用 setStatusClass 函数来设置的。拖动操作的状态可在事件对象的 statusClass 属性中获取。\n\
    \n### 工作原理...\n\n将 dragAndDrop 属性设置为 true 后，TreeView 中的元素可以拖放到树中的任何级别。\n\n![](img/2a66507445090790d34dc5588b56b24c_67_0.png)\n\
