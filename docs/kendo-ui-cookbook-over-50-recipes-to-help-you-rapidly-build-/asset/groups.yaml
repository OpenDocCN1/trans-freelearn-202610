  - "[PAGE 218]\n\nAs with the Radial Gauge, the Linear Gauge can also include the\
    \ ranges option. After including the ranges option, you will see the widget showing\
    \ this option along its scale.\n\n![](img/2a66507445090790d34dc5588b56b24c_218_0.png)\n\
    \n# There's more...\n\nThe pointer shown on the Linear Gauge is barIndicator by\
