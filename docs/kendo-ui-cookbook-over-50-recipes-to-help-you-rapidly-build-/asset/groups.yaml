    After specifying the `DataSource` option, the next step is to specify the `layout`
    details. The `layout` option is used to specify the arrangement of shapes and
    connections in the diagram. It will parse the data and then arrange these shapes
    based on the specified layout type and subtype:


    ```

    $("#chart").kendoDiagram({

    .

