    \ 对象是一组 JavaScript 对象，用于指定列配置。配置包含两个属性，`field` 和 `title`。`field` 属性指列绑定到的 `dataSource`\
    \ 中的字段，而 `title` 指定在 Grid 中显示为标题的文本。\n\n`dataSource` 对象也是一组 JavaScript 对象，包含将在\
    \ Grid 中显示的数据。在此示例中，有五个对象，因此 Grid 将包含五行。\n\n> 请注意，`columns` 对象也可以是字符串数组：\n> `columns:\
    \ ['movieName', 'year', 'rating']`\n> 在这种情况下，columns 数组中的条目应与 `dataSource` 对象中的字段名匹配。列的标题将与字段名相同。\n\
    \n## How it works...\n\n如前所述，我们选择了一个 div 元素来创建 Grid。该元素将作为 Grid 的容器。在初始化 Grid\
    \ 时，框架将查看提供的配置并生成标记，然后将其插入到 div 元素中。它创建两个 div 元素——一个用于标题，另一个用于内容。标题显示如下：\n\n```html\n\
    <div class=\"k-grid-header\" style=\"padding-right: 16px;\">\n<div class=\"k-grid-header-wrap\"\
    >\n<table role=\"grid\">\n<colgroup>\n<col>\n<col>\n<col>\n</colgroup>\n<thead>\n\
    <tr>\n<th role=\"columnheader\"\ndata-field=\"movieName\"\ndata-title=\"Movie\"\
    \nclass=\"k-header\">\nMovie\n</th>\n<th role=\"columnheader\"\ndata-field=\"\
    year\"\ndata-title=\"Year\"\nclass=\"k-header\">\nYear\n</th>\n<th role=\"columnheader\"\
    \ndata-field=\"rating\"\ndata-title=\"Rating\"\nclass=\"k-header\">\nRating\n\
    </th>\n</tr>\n</thead>\n</table>\n</div>\n</div>\n```\n\n基于 columns 对象中提供的配置，生成一个包含标题列的表格（thead\
    \ 和 th 标签）。为了显示 Grid 数据，库会插入另一个 div 元素：\n\n```html\n<div class=\"k-grid-content\"\
    >\n<table role=\"grid\">\n<colgroup>\n<col>\n<col>\n<col>\n</colgroup>\n<tbody>\n\
    <tr data-uid=\"d71ac3fd-9769-4161-9277-432f151490c3\"\nrole=\"row\">\n<td role=\"\
    gridcell\">\nThe Shawshank Redemption</td>\n<td role=\"gridcell\">1994</td>\n\
    <td role=\"gridcell\">9.2</td>\n</tr>\n<tr class=\"k-alt\"\ndata-uid=\"3240f52d-f4bb-4a2c-9985-b6ce44d75be6\"\
    \nrole=\"row\">\n<td role=\"gridcell\">The Godfather</td>\n<td role=\"gridcell\"\
    >1972</td>\n<td role=\"gridcell\">9.2</td>\n</tr>\n...\n</tbody>\n</table>\n</div>\n\
    ```\n\n前面的代码包含一个带有显示 dataSource 对象中数据的行的表格。现在，当你在页面上查看 Grid 时，它将与先前配方中解释的 Grid\
    \ 相同。如下面的截图所示：\n\n| Movie | Year | Rating |\n|---|---|---|\n| The Shawshank Redemption\
    \ | 1994 | 9.2 |\n| The Godfather | 1972 | 9.2 |\n| The Godfather - Part 2 | 1974\
    \ | 9 |\n| Pulp Fiction | 1994 | 8.9 |\n| The Good, the Bad and the Ugly | 1966\
    \ | 8.9 |\n\n## There's more...\n\n此示例中的 `dataSource` 对象包含了本地数据，即 Grid 的数据直接写在\
    \ JavaScript 对象中。然而，在大多数场景中，数据将从远程服务获取。`dataSource` 对象可以通过指定其 URL 来从远程服务获取数据：\n\
    \n```javascript\n$(\"#grid\").kendoGrid({\n    columns: [\n    {\n    field :\
    \ 'movieName',\n    title : 'Movie'\n    },\n    {\n    field : 'year',\n    title\
    \ : 'Year'\n    },\n    {\n    field : 'rating',\n    title : 'Rating'\n    }\n\
    \    ],\n    dataSource: {\n    transport: {\n    read: 'http://localhost/kendo/code/chapter2/remote.json'\n\
    \    }\n    }\n    });\n```\n\n在前面的代码片段中，`DataSource` 对象已更改。它现在包含对远程服务 URL 的引用（在\
    \ `transport` 选项下）。当 Grid 初始化时，会向指定的 URL 发送一个 `GET` 请求，并将收到的响应数据用于填充 Grid 的内容。\n\
    \n## 使用选定列对 Grid 中的数据进行排序\n\nKendo UI Grid 带有多个功能，例如按选定列排序、分页、分组和滚动。这些配置选项可以在\
    \ Grid 配置级别和列级别指定。\n\n"
