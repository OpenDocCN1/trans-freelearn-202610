    # ## Using the ScrollView widget to navigate through a collection of pictures


    A ScrollView widget is used in picture galleries or carousel-like applications,
    where you would like to scroll to the next page to see the next picture in the
    gallery. The widget allows you to move to the next page or the previous page by
    swiping from right to left or left to right.


    # ## How to do it...


    Let''s create a `view` that contains a ScrollView widget:


    ```

    ```

    <div

    data-role="view"

    ```

    ```


    153'
