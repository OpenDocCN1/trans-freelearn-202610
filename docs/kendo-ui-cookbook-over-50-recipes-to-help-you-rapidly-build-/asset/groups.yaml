    ## 关于作者


    **Sagar Ganatra** 是来自印度班加罗尔的前端架构师。他是使用 HTML5、CSS3、面向对象 JavaScript、Kendo UI、jQuery
    以及 BackboneJS、RequireJS 和 AngularJS 等 JavaScript 框架等现代 Web 技术构建 Web 应用程序的专家。他还在自己的博客
    `http://www.sagar ganatra.com/` 上撰写关于这些技术的文章。这是他的第二本书；他的上一本书是 _Instant Kendo UI
    Mobile_，_Packt Publishing_ 出版，于 2013 年出版。当他不编码时，他喜欢写短篇小说、游泳和阅读书籍。


    > 我将此书献给我非凡的父母，Tara Ganatra 和 Harshad Rai Ganatra，他们是我生命中最伟大、最睿智的两位老师。

    >

    > 我也将此书献给我的兄弟 Santosh Ganatra 和嫂子 Nisha Ganatra，感谢他们始终支持我，鼓励我写这本书。


    ## 关于审稿人


    **Sergey N. Bolshchikov** 是 New Prolmage (Agfa) 的高级前端工程师，致力于为出版商开发大规模客户端工作流系统软件应用程序。他还担任以色列特拉维夫
    Ember-IL 聚会小组的联合组织者。他持有以色列理工学院（Technion – Israel Institute of Technology）的信息系统硕士学位。


    **Austin Christenberry** 有使用 ASP.NET、T-SQL、Knockout.js 和 Kendo UI 等技术的经验。他目前在德克萨斯州达拉斯的管理和技术解决方案公司
    Credera 工作。他于 2012 年毕业于德克萨斯州瓦科的贝勒大学，获得应用数学学士学位。在空闲时间，他喜欢打网球和在 Netflix 上发现新节目。


    > 我想感谢我美丽的妻子 Len，感谢她在审阅本书以及我所做的其他一切方面给予我的支持。


    **David J. McClelland** 超过 20 年来一直在创建连接设计、开发和信息的尖端软件和内容。他目前是一名首席用户界面工程师，开发用于通过云管理分布式设备的软件。他曾担任
    _Instant Kendo UI Mobile_、_Sagar Ganatra_、_Packt Publishing_ 的技术审稿人。


    > 我想感谢我的家人鼓励我众多的技术和艺术兴趣。


    Omkar Patil 目前在 SunGard 的全球技术和架构集团担任高级架构师。他在 Web 应用程序的架构、设计和开发方面拥有 14 年的经验。他最初从服务器端企业
    Java 开始，在过去几年中将重点转移到 Web 和移动应用程序的前端开发。他目前的技能包括 JavaScript、jQuery、Kendo UI、AngularJS
    和 Node.js。在业余时间，他喜欢阅读、尝试新技术以及为开源软件做贡献。他是 Angular-Kendo 项目的提交者，该项目将 Kendo UI 与
    AngularJS 集成（https://github.com/kendo-labs/angular-kendo）。


    > 我想感谢我的妻子 Anu，在过去 12 年里给予我的支持和鼓励。我也想提及我的女儿 Rewa，她七岁，已经开始编程，并用她的编程问题让我忙碌不停。


    Radu Poenaru 在软件工程领域拥有超过 12 年的经验，涵盖桌面、Web 和移动应用程序。作为一名位于德国法兰克福的自由职业者，他将技能集中于提供网站完整生命周期的解决方案，包括架构和用户体验——在前端使用
    HTML5 和 CSS3，并由 jQuery、Knockout.js、Kendo UI、AngularJS、RequireJS、Modernizr 和 Bootstrap
    等 JavaScript 库增强；在后端使用 ASP.NET、MVC 模式（包括单页应用程序）、Entity Framework 和 Microsoft SQL。他在自己的博客
    http://www.radu poenaru.com 或其公司网站 http://www.itbrainiacs.com 上讨论这些和其他软件主题。


