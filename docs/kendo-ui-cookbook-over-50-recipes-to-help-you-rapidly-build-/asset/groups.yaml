    \ 品牌还运行 Packt 的开源版税计划，通过该计划，Packt 为每本关于开源软件的书籍销售向相关开源项目支付版税。\n\n# 为 Packt 撰写\n\
    \n我们欢迎所有有兴趣撰写书籍的人士的咨询。书籍提案应发送至 author@packtpub.com。如果您的书籍构想仍处于早期阶段，并且希望在撰写正式书籍提案之前先讨论，请联系我们；我们的一位委托编辑将与您联系。\n\
