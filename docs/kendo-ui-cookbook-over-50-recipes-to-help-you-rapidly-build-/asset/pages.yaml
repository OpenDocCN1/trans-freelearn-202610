- pgno: 60
  md: "# # Kendo UI TreeView\n\nIn this chapter, we will cover the following recipes:\n\
    \n+   - Using a TreeView widget to display a directory structure\n+   - Using\
    \ the drag and drop feature to move elements in TreeView\n+   - Using checkboxes\
    \ to select nodes in TreeView\n+   - Associating icons with labels in TreeView\n\
    \n# ## Introduction\n\nThe Kendo UI TreeView widget allows you to display hierarchical\
    \ data in a tree-like structure. This widget allows users to expand or collapse\
    \ the hierarchical data. It also allows them to perform drag-and-drop operations,\
    \ allowing list items to be moved from one node to the other.\n\n# ## Using a\
    \ TreeView widget to display a directory structure\n\nA TreeView widget can be\
    \ created by specifying the hierarchical data either in the HTML markup or by\
    \ binding it to a `DataSource` object.\n\n# ### How to do it...\n\nTo create a\
    \ TreeView, let's specify the data in the markup, as shown in the following code\
    \ snippet:\n\n```\n```html\n<ul id=\"treeView\">\n  <li>\n    Directory1\n  </li>\n\
    </ul>\n```\n```"
  merge: -1
  img_proc: true
