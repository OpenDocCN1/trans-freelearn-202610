- pgno: 137
  md: "# # Kendo UI Mobile Framework\n\n+   - fade: Using this effect, the new content\
    \ fades in on top of the old view. The old view content will fade out, showing\
    \ you the content from the new view.\n\n+   - overlay: The overlay effect is similar\
    \ to the slide effect, except that the previous view remains under the new one.\
    \ The transition direction can be specified using overlay (direction). By default,\
    \ the direction is left; other supported directions include right, up, and down.\n\
    \nIn all of the transition effects mentioned, the content along with its header\
    \ and footer is shown. It is also possible to specify the transition effect for\
    \ the entire application instead of specifying the data-transition attribute for\
    \ each view widget in the document. When initializing the application using the\
    \ Application object, specify the transition property with the desired effect\
    \ as its value:\n\n```\n```\nvar app = new kendo.mobile.Application(document.body,\
    \ {\n    transition: \"zoom\"\n});\n```\n```\n\nThis allows the transition effect\
    \ to be applied to the entire application.\n\n# # Adding touch events to your\
    \ mobile application\n\nThe Kendo UI Mobile framework provides various APIs to\
    \ handle touch-based events. The applications that you build should not only allow\
    \ the user to perform regular select events on the touch interface, but they should\
