- pgno: 102
  md: '# # Kendo UI File Uploader


    In this chapter, we will cover the following recipes:


    +   - Using the file uploader to upload files to the server

    +   - Uploading files to the server asynchronously

    +   - Listening to file upload events


    # ## Introduction


    The Kendo UI library provides a file uploader widget that can be used to upload
    multiple

    files to the server. On modern browsers such as Chrome, Safari, Firefox, and Opera,
    the

    files can be uploaded asynchronously using the HTML5 File API. The enhancements
    to the

    XmlHttpRequest object in HTML5, such as progress tracking, are also available.
    On legacy

    browsers, it falls back and uploads the file synchronously. In this chapter, we
    will see the various

    ways in which the file uploader widget can be used to upload files to the server,
    showing the

    progress of the file upload process and the options available to customize the
    widget.


    # ## Using the file uploader to upload files

    to the server


    In this recipe, we will look at how the file uploader widget can be used to upload
    multiple files

    to the server synchronously.'
  merge: -1
  img_proc: true
- pgno: 103
  md: "# # How to do it...\n\nLet's create a form that will be used to upload the\
    \ file as follows:\n\n```\n```\n<form method=\"post\"\n action=\"/fileUploadService\"\
    \n style=\"width:500px\">\n\n<input name=\"files\" id=\"fileUpload\" type=\"file\"\
    \ />\n<input type=\"submit\" value=\"Submit\" class=\"k-button\" />\n</form>\n\
    ```\n```\n\nThe next step is to initialize the file uploader widget by invoking\
    \ the kendoUpload function on the file input type:\n\n```\n```\n$(\\'#fileUpload\\\
    ').kendoUpload();\n```\n```\n\nThis will initialize the file input type to an\
    \ uploader widget. This uploader widget can then be used to select files and upload\
    \ them to the server. You can select multiple files and the same would be shown\
    \ in the list.\n\nWhen you click on the **Submit** button, the form is submitted\
    \ to upload the files in the list. It's a `multipart/form-data` submission with\
    \ the file data in the request payload. The server will be able to accept the\
    \ form submission and route the user to the next page.\n\n# # How it works...\n\
    \nWhen you initialize the file upload widget, you see two buttons, **Select files...**\
    \ and **Submit**, as shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_103_0.png)\n\
    \nNote the look and feel of the file input type—there is a button and this is\
    \ consistent across all browsers. The button allows you to select multiple files.\n\
    \nFor the purpose of this example, let's select files twice, that is, click on\
    \ the **Select files...** button twice and select a file:"
