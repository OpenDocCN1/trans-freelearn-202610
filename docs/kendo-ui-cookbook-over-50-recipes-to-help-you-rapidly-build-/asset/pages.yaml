  md: '```

    model: {

    children: "manages"

    }

    },

    .

    .

    });

    ```


    After specifying the `DataSource` option, the next step is to specify the `layout`
    details. The `layout` option is used to specify the arrangement of shapes and
    connections in the diagram. It will parse the data and then arrange these shapes
    based on the specified layout type and subtype:


    ```

    $("#chart").kendoDiagram({

    .

    .

    layout: {

    type: "tree",

    subtype: "down",

    horizontalSeparation: 50,

    verticalSeparation: 50

    },

    .

    });

    ```


    In the `layout` option, the type is specified as `tree` and the subtype is `down`.
    This will create a tree structure with the root node at the top of the diagram,
    followed by various child nodes. The other possible values for the subtype include
    the following:


    +   - up: In this value, the root node is at the bottom and its child nodes are
    added upwards, that is, the tree will be inverted

    +   - left: In this value, the root node is placed on the left-hand side and its
    child nodes are added to the right

    +   - right: In this value, the root is placed on the right-hand side and its
    child nodes are added to the left-hand side

    +   - mindmapVertical: In this value, the root node is at the center and its child
    nodes are distributed equally above and below the root node

    +   - mindmapHorizontal: In this value, the root node is at the center and its
    child nodes are distributed equally on the left and right-hand sides of the root
    node

    +   - radial: In this value, the root node is at the center and all its child
    nodes are spread around it in the form of a radial

    +   - tipOver: This value is similar to a tree-down subtype, wherein the direct
    children are arranged horizontally and the grandchildren are arranged vertically'
