    \n# How to do it...\n\nTo create a Radial Gauge widget, invoke the kendoRadialGauge\
    \ function on the selected\nDOM element. A Radial Gauge widget contains some components,\
    \ and it can be configured\nby providing options, as shown in the following code\
    \ snippet:\n\n```\n$(\"#chart\").kendoRadialGauge({\n    scale: {\n        startAngle:\
    \ 0,\n        endAngle: 180,\n        min: 0,\n        max: 180\n    },\n    pointer:\
