  md: '```

    { field: ''chrome'', name: ''Chrome'' },

    { field: ''firefox'', name: ''Firefox'' },

    { field: ''safari'', name: ''Safari'' },

    { field: ''ie'', name: ''IE'' }]

    " data-bind="{source: dataSet}" style="width: 500px; height:

    400px">

    </div>

    ```


    In the preceding code snippet, all the options are specified as data attributes.
    The data attribute role, with its value set to chart, will initialize the div
    element as a chart widget. It also has the data-bind attribute, which specifies
    its source as dataset. The data-bind attribute is used to specify the model-binding
    values. In this case, the source binding, that is, the DataSource object to which
    this chart is bound, is specified. The ViewModel object that we will construct
    soon will specify a dataset attribute.


    The next step is to create two dropdowns, one that lists the chart types and the
    other that lists the various themes or skins that should be applied. Let''s also
    add a checkbox that represents whether the chart should be stacked or not, as
    shown in the following code snippet:


    ```

    <select id="chartTypeDropdown" data-bind="value: chartType,

    events: {change: onChangeHandler}">

    <option value="area">Area</option>

    <option value="line">Line</option>

    <option value="column">Column</option>

    </select>

    <select id="chartSkin" data-bind="value: chartSkin,

    events: {change: onChangeHandler}">

    <option value="default">Default</option>

    <option value="blueopal">BlueOpal</option>

    <option value="bootstrap">Bootstrap</option>

