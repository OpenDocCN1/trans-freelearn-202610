    <br>\n<input type=\"submit\">\n</form>\n```\n\nIn the preceding markup, the input\
    \ fields are marked as required and validation messages are defined in data- attributes.\
    \ After specifying the validation messages in the markup, the last step is to\
    \ attach the kendo validator to the form. This is attained by executing the following\
    \ code snippet:\n\n```\n$(\"form#testView\").kendoValidator();\n```\n\nIn the\
    \ previous code snippet, the form element is marked for validation by calling\
    \ the kendoValidator function on the same.\n\n# How it works...\n\nIn the previous\
    \ markup, the firstName field is of the text type and is marked as required by\
    \ adding the required attribute. Also, a validationMessage attribute that specifies\
