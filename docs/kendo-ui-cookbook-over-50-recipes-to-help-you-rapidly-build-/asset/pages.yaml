- pgno: 192
  md: "Notice that in the preceding screenshot, the **On Windows** legend is grayed\
    \ out and the corresponding series is hidden from the chart. This enables users\
    \ or consumers of the application to look through various series and compare them,\
    \ as required.\n\n# # Displaying data over a period of time and using aggregate\
    \ functions\n\nWhen you work on a data analytics project, you usually come across\
    \ use cases of plotting a chart, which displays some data over a period of time.\
    \ For example, in an order-management system, you would like to display the order\
    \ data and plot it against a period of time. This period could be for a day, week,\
    \ month, or year. Also, you would like to display data in terms of, say, the average\
    \ bill value, number of orders, or total business made during the specified period\
    \ of time.\n\nThe Kendo chart library allows you to project the data based on\
    \ the given period and also apply some of the aggregate functions when displaying\
    \ this data.\n\n# ## How to do it...\n\nLet's first consider an example dataset\
    \ that contains the order data:\n\n```\n```\nvar orderStats = [{\n    billAmount:\
    \ 80,\n    date: new Date('2014/01/01')\n}, {\n    billAmount: 95,\n    date:\
