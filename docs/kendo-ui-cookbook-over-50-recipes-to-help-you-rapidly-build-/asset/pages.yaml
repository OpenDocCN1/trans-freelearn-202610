  md: "# # Fixing the headers when the user scrolls through the list\n\nThe items\
    \ in the ListView widget can be grouped by a property. For example, assume that\
    \ the list contains a set of names or contacts in your directory. These contacts\
    \ can be grouped by the letter the contact name begins with. When you render the\
    \ list, you would see that these contacts are grouped and on scrolling, the header\
    \ is fixed.\n\n# ## How to do it...\n\nTo create fixed headers, that is, data\
    \ grouped by a particular attribute, each object in the collection or the array\
    \ should include that attribute. Let's create a sample array where each object\
    \ contains two properties, `name` and `startsWith`; the `startsWith` attribute\
    \ will be used to group the names in the list:\n\n```\n```javascript\nvar actors\
    \ = [\n    { \"name\": \"Leonardo DiCaprio\", \"startsWith\": \"L\" },\n    {\
    \ \"name\": \"Johnny Depp\", \"startsWith\": \"J\" },\n    { \"name\": \"Al Pacino\"\
    , \"startsWith\": \"A\" },\n    { \"name\": \"Bradley Cooper\", \"startsWith\"\
    : \"B\" },\n    { \"name\": \"Tom Cruise\", \"startsWith\": \"T\" },\n    { \"\
    name\": \"Jude Law\", \"startsWith\": \"J\" },\n    { \"name\": \"Robert Downey\
    \ Jr.\", \"startsWith\": \"R\" },\n    { \"name\": \"Will Smith\", \"startsWith\"\
    : \"W\" },\n    { \"name\": \"Robert De Niro\", \"startsWith\": \"R\" },\n   \
    \ { \"name\": \"Antonio Banderas\", \"startsWith\": \"A\" },\n    { \"name\":\
    \ \"Christian Bale\", \"startsWith\": \"C\" },\n    { \"name\": \"Brad Pitt\"\
    , \"startsWith\": \"B\" },\n    { \"name\": \"Tom Hanks\", \"startsWith\": \"\
    T\" },\n    { \"name\": \"Robert Pattinson\", \"startsWith\": \"R\" },\n    {\
