    \ 0 -48px;\n}\n</style>\n```\n```\n\nThe next step would be to associate nodes\
    \ in the tree with the previously mentioned CSS classes. This can be done by adding\
    \ a spriteCssClass property for each object in the DataSource collection:\n\n\
    ```\n```\n$(\\'#treeView\\').kendoTreeView({\n    dataSource: [{\n        text:\
    \ \"Directory1\",\n```\n```"
