    # ## Specifying view transitions


    When transitioning from one view to the other, you can specify the transition
    effect that

    needs to be applied using the `data-transition` attribute. The following values
    can be

    set as values of the `data-transition` attribute:


    +   - `slide`: This transition effect slides the old view content to the left
    and inserts the

    +   new view content slides in its place. You can specify the direction using
    the slide

    +   (direction). By default, the direction is left; the other option is right.

    +   - `zoom`: Here, the new view content zooms from the center of the old view.
    The old

    +   view content will fade out and the new view content will be shown.'
