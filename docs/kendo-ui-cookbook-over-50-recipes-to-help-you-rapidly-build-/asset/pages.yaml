- pgno: 186
  md: "# # There's more...\n\nIn the preceding example, only one series was shown\
    \ in the chart. When working with multiple series, the remote service needs to\
    \ be configured to return data in a specific format.\n\n# # Showing multiple series\
    \ using the DataSource object\n\nWhen you have multiple series to be added to\
    \ the chart, the `DataSource` object should contain data grouped by category.\
    \ In this example, the data is grouped by year, as shown in the following code\
    \ snippet:\n\n```\n```\nvar browserAdoption = [{\n    'year': 2011,\n    'chrome':\
    \ 40,\n    'firefox': 30,\n    'ie': 15,\n    'safari': 15\n}, {\n    'year':\
    \ 2012,\n    'chrome': 45,\n    'firefox': 25,\n    'ie': 12,\n    'safari': 18\n\
    }, {\n    'year': 2013,\n    'chrome': 50,\n    'firefox': 22,\n    'ie': 8,\n\
    \    'safari': 20\n}];\n```\n```\n\nIn our example, the `categoryAxis` option\
    \ specifies the field as `year`; this will group the data by this field. The next\
    \ step is to specify the previously mentioned configuration in the `series` option\
    \ when constructing the chart:\n\n```\n```\nseries: [{\n    field: 'chrome',\n\
    \    name: 'Chrome'\n}, {\n    field: 'firefox',\n    name: 'Firefox'\n}, {\n\
    \    field: 'safari',\n    name: 'Safari'\n}\n```\n```"
  merge: -1
  img_proc: true
