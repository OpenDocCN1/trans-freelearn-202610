- pgno: 88
  md: '# # Kendo UI PanelBar


    In this chapter, we will cover the following recipes:


    +   - Creating a PanelBar

    +   - Loading the content of a PanelBar using Ajax

    +   - Binding the PanelBar to a DataSource object

    +   - Customizing the PanelBar


    # ## Introduction


    The Kendo UI PanelBar widget is similar to a tabbed panel that contains a list
    of items grouped under different tabs or panes. In a PanelBar, these lists of
    items are stacked vertically, and each list item can be expanded to show you the
    content. This widget is particularly useful when the data can be grouped into
    multiple sections and there is a constraint on the available space to display
    this data. For example, all your contacts can be grouped by some category such
    as **Favourites**, **Family**, **Friends**, and **Office Contacts**; when you
    tap on one of the these categories, the panel would expand to show you the list
    of contacts that belong to that category.


    # ## Creating a PanelBar


    A PanelBar can be created either by specifying its structure in the HTML markup
    or by configuring it using an API. In this recipe, we will take a look at the
    former approach.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "# # How to do it...\n\nA PanelBar widget contains a list of items stacked vertically.\
    \ To create a PanelBar, we will need a list of items and hence we use the HTML's\
    \ ordered or unordered list. In this example, we will list travel destinations,\
    \ airlines, and important sights to visit as three panels:\n\n```\n`<ul id=\"\
    panelBar\" style=\"width: 400px\">\n\t<li>\n\tDestinations\n\t</li>\n\t<li>\n\t\
    Flights\n\t</li>\n\t<li>\n\tImportant Sights\n\t</li>\n</ul>`\n```\n\nHere, the\
    \ list contains three items and these are the headings for each panel that we\
    \ want to have. Also, the width property is set to 400px which will set the width\
    \ of the PanelBar component. If the width property is not specified, then PanelBar\
    \ would occupy the entire screen width, which is not desirable.\n\nThe preceding\
    \ panels do not list any content yet. Let's specify the content for each of these\
    \ in the HTML markup:\n\n```\n`<ul id=\"panelBar\" style=\"width: 400px\">\n\t\
    <li>\n\tDestinations\n\t<div class=\"destinationData\">\n\t<h2>India</h2>\n\t\
    <img src=\"./images/India-Flag-icon.png\" />\n\t</div>\n\t<div class=\"destinationData\"\
    >\n\t<h2>Australia</h2>\n\t<img src=\"./images/Australia-Flag-icon.png\" />\n\t\
    </div>\n\t<div class=\"destinationData\">\n\t<h2>Indonesia</h2>\n\t<img src=\"\
    ./images/Indonesia-Flag-icon.png\" />\n\t</div>\n\t</li>\n</ul>`\n```"
  merge: -1
  img_proc: true
