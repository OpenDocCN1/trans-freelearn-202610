    seriesDefaults: {\n\ttype: 'area'\n},\ncategoryAxis: {\n\tfield: 'year',\n},\n\
    series: [{\n\tfield: 'percentage'\n}],\nvalueAxis: {\n\tlabels: {\n\t\tformat:\
    \ '{0}%'\n\t}\n}\n});\n\n\n```\n\nHere, dataSource in the preceding code snippet\
    \ specifies a reference to the array of objects\n(chromeBrowser) that we defined\
    \ earlier. The categoryAxis option specifies the year\nfield, and the series field\
