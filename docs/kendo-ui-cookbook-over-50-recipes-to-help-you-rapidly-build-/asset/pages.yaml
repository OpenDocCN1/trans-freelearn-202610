- pgno: 236
  md: '# # Creating a map by binding it to the GeoJSON data


    GeoJSON is a format for encoding a variety of geographic data structures. It is
    an open-standard format for encoding a collection of simple geographical features
    along with non-spatial attributes using JSON. In this recipe, we will create a
    map that is bound to the geoJSON data, containing not only the coordinates, but
    also other non-spatial information about the area.


    # ## How to do it...


    To create shapes that correspond to points or coordinates, set the layer type
    as shape. Let''s first refer to the geoJSON data that contains the coordinates
    and also other non-spatial data:


    ```

    {

    "type": "FeatureCollection",

    "features": [

    {

    "type": "Feature",

    "properties": {

    "GEO_ID": "0400000US23",

    "STATE": "23",

    "NAME": "Maine",

    "LSAD": "",

    "CENSUSAREA": 30842.923

    },

    "geometry": {

    "type": "MultiPolygon",

    "coordinates": [

    [

    [-67.619761, 44.519754],

    [-67.61541, 44.521973],

    [-67.587738, 44.516196],

    .

    .

    .

    ],

    .

    .

    .

    ]

    }

    }

    ]

    }

    ```'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'The geoJSON data mentioned contains the coordinates that correspond to the
    points on

    the map. These points will be used to construct vector shapes. The geoJSON data
    also lists

    other properties such as NAME and CENSUSAREA. Let''s use the previous JSON data
    as a

    DataSource object in building the map using the kendoMap function:


    ```

    $(''#chart'').kendoMap({

    center: [30.2681, -97.7448],

    zoom: 4,

    layers: [{

    type: ''shape'',

    dataSource: {

    type: ''geojson'',

    transport: {

    read: ''./geojson-us.json''

    }

    }

    }]

    });

    ```


    Here, the type attribute is set as shape and dataSource is specified, which refers
    to the

    file that contains the geoJSON data. The framework would parse the geoJSON data
    and

    refer to the coordinates to construct the map.


    We can use other properties present in the geoJSON data and add some functionality
    to the

    map. For example, we could convert the CENSUSAREA field to a hex number and use
    this to

    fill the shape:


    ```

    $(''#chart'').kendoMap({

    center: [30.2681, -97.7448],

    zoom: 4,

    layers: [{

    type: ''shape'',

    dataSource: {

    type: ''geojson'',

    transport: {

    read: ''./geojson-us.json''

    }

    }

    }]),

    shapeCreated: function (e) {

    var shapeColor = parseInt(e.shape.dataItem.properties.

    CENSUSAREA, 16).toString();

    shapeColor = ''#'' + (''FFFFFF'' + shapeColor).slice(-6);

    e.shape.fill(shapeColor);

    }

    });

    ```'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'In the preceding code snippet, the shapeCreated function is added, which is
    called whenever a shape is added to the map.


    # How it works...


    When you render the page, you will see a map created that will contain shapes,
    as shown in the following screenshot:


    ![](img/2a66507445090790d34dc5588b56b24c_238_0.png)


    After adding colors to shapes using the shapeCreated function, you will see a
    colored map.


    ![](img/2a66507445090790d34dc5588b56b24c_238_1.png)


    The shape is calculated by converting the CENSUSAREA field value to a hex number
    and then prefixing it to make it a fixed length.'
  merge: -1
  img_proc: true
