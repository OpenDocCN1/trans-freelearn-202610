    # # Validating user input using the built-in Validator


    Validating user-input data is one of the common tasks in any project. A client-side
    validation includes checking the form-input data for the type or for the missing
    data. This is not to say that the server-side validation is not important. However,
    a client-side validation takes care of performing basic validations and shows
    error or validation messages before submitting the form data to a server for processing.
    Therefore, it provides instant feedback to the user and improves the overall user
    experience.


    With the advent of HTML5, the input fields in a form can have types defined for
    it. For example, an input field that should accept only an e-mail address can
    be specified as type=email. Similarly, the input fields can have types such as
    URL, NUMBER, RANGE, DATE, SEARCH, and COLOR. When the user specifies incorrect
    data for any of these fields, the browser will show an appropriate validation
    message. In addition to the types, the form elements can also be marked as required
    by adding an additional attribute, required, to the input elements. However, some
    of the old browsers don''t support HTML5 features, including the previously mentioned
    form validation. The Kendo UI library comes with a built-in validator that can
    be used to perform client-side validations.


    The Kendo UI validator encourages users to use HTML5-like syntax and provides
    out-of-the-box support to make the form validation work on older browsers.


    # ## How to do it...


    Let''s take a look at an example where in one input, the text field is marked
    as required, and the other input field of the email type is also marked as required.
    Please note that this is very much an HTML5 syntax and the user doesn''t have
    to alter the markup to mark the fields as required or of a different type:


    ```

    ```

    <form id="testView">

    <label for="firstName">First Name</label>

    <input id="firstName"

    name="First Name"

    type="text"

    required

    validationMessage="Please specify First Name">

    <br>

    ```

    ```'
  merge: -1
  img_proc: true
