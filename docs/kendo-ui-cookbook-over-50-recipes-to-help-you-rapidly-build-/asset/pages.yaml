- pgno: 211
  md: "# # Kendo UI DataViz - Advance Charting\n\nHere the scale option is used to\
    \ configure the range for the Radial Gauge widget.\nThe `startAngle` and `endAngle`\
    \ options are used to indicate the angle at which the\nRadial Gauge widget's range\
    \ should start and end. By default, its values are 30 and 210,\nrespectively.\
    \ The other two options, that is, `min` and `max`, are used to indicate the range\n\
    values over which the value can be plotted. The `pointer` option is used to indicate\
    \ the\ncurrent value in the Radial Gauge widget.\n\nThere are several options\
    \ available to configure the Radial Gauge widget; these include\npositioning of\
    \ the labels and configuring the look and feel of the widget.\n\n# ## How it works...\n\
    \nWhen you render the page, you will see a Radial Gauge widget that shows you\
    \ the scale\nfrom **0** to **180** and the pointer pointing to the value **20**.\n\
