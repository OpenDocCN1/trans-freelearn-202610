    # # Using drag-and-drop to upload files


    The file uploader widget supports dragging-and-dropping of files onto the file
    uploader widget. This is supported on all modern browsers that support the HTML5
    File API. This method is available only if the widget has been configured to upload
    the files asynchronously.


    When you try to drop the file(s) onto the uploader widget, it shows you the **drop
    files here to upload** message.


    ![](img/2a66507445090790d34dc5588b56b24c_108_0.png)


    Once you drop files, the files will be added to the list and will be uploaded
    to the server asynchronously.'
