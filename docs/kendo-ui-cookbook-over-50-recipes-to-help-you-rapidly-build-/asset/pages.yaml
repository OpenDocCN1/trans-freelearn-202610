    # # Using the visualization mechanism to improve the performance of the Grid


    Consider a scenario wherein the service returns a large dataset that needs to
    be displayed in the Grid. For example, say the dataset has about 10,000 records.
    As explained earlier, a table row is created for each record in the `DataSource`
    object. In this case, there are 10,000 records, and creating a table row (`tr`)
    for each record would make the browser run out of memory. Creating 10,000 DOM
    nodes and then appending the same into the document tree would consume a lot of
    memory. One way to tackle this problem is to use virtualization. In virtualization,
    only a fixed set of nodes are created and when the user scrolls over the Grid,
    the existing nodes are updated to show the next set of records in `DataSource`.
    This way, we not only optimize the use of the browser memory by reusing the DOM
    node, but we also provide a smooth experience to the user while scrolling through
    a massive list.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# # How to do it...


    The first step to visualization is to set the number of table rows to be displayed.
    These table rows will be reused to display the large list of records in the DataSource
    object. Let''s first set the pageSize attribute in the DataSource object to the
    number of rows that you want to show using the following code snippet:


    ```

    dataSource: {

    transport: {

    read: ''http://localhost/kendo/code/chapter2/remote.json'',

    },


    pageSize: 4,

    }

    ```


    The next step is to specify the scrollable object with the virtual attribute set
    to true:


    ```

    scrollable: {

    virtual: true

    }

    ```


    By setting the virtual attribute to true, the visualization of data will be enabled.


    > The value 4 set for the pageSize attribute is for demonstration purposes only.
    You should be setting this to a larger value depending on the number of records
    and the one that best matches the user experience.


    # # How it works...


    When you set the pageSize attribute to 4 and virtual to true, only four rows will
    be displayed and only four nodes are created, as shown in the following screenshot:


    | Movie | Year | Rating |

    |---|---|---|

    | The Shawshank Redemption | 1994 | 9.2 |

    | The Godfather | 1972 | 9.2 |

    | The Godfather - Part 2 | 1974 | 9 |

    | Pulp Fiction | 1994 | 8.9 |'
  merge: -1
