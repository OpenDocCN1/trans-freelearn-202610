    \ In this recipe, we will take a look at the various touch events that can be\
    \ added.\n\n# # How to do it...\n\nFor the purpose of this example, let's consider\
    \ the same layout used in the previous recipe and add a view to the page. The\
    \ content of this view would be a touch widget that specifies an area in the view\
    \ enabled for touch events:\n\n```\n```\n<div\ndata-role=\"view\"\ndata-layout=\"\
    defaultLayout\">\n<div\nid=\"touchSurface\"\ndata-role=\"touch\"\ndata-enable-swipe=\"\
    1\"\n```\n```"
