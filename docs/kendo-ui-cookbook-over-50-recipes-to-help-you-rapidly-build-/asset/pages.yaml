- pgno: 43
  md: "# # There's more...\n\nThe `dataSource` object in this example contained the\
    \ local data, that is, the data for the Grid was mentioned right within the JavaScript\
    \ object. However, in most of the scenarios, the data will be fetched from a remote\
    \ service. The `dataSource` object can be used to fetch data from a remote service\
    \ by specifying the URL for it:\n\n```\n$(\"#grid\").kendoGrid({\n    columns:\
    \ [\n    {\n    field : 'movieName',\n    title : 'Movie'\n    },\n    {\n   \
    \ field : 'year',\n    title : 'Year'\n    },\n    {\n    field : 'rating',\n\
    \    title : 'Rating'\n    }\n    ],\n    dataSource: {\n    transport: {\n  \
    \  read: 'http://localhost/kendo/code/chapter2/remote.json'\n    }\n    }\n  \
    \  });\n```\n\nIn the preceding code snippet, the `DataSource` object has changed.\
    \ It now contains a reference to the URL of a remote service (under the `transport`\
    \ option). When the Grid is initialized, a `GET` request to the specified URL\
    \ is sent and the data received as a response is then used to populate the content\
    \ of the Grid.\n\n# # Sorting data in a Grid using a selected column\n\nThe Kendo\
    \ UI Grid comes with several features, such as sorting by selected columns, pagination,\
    \ grouping, and scrolling. These configuration options can be specified at the\
    \ Grid configuration level and at the column level as well."
  merge: -1
  img_proc: true
- pgno: 44
  md: "# # How to do it...\n\nTo enable the sort by column feature, set the sortable\
    \ configuration option to true. This will make all the columns in the Grid available\
    \ for sorting. If you want some of the columns in the Grid to not be available\
    \ for sorting, then you can add the same property, sortable, with a false value\
    \ at the column level as well:\n\n```\n$(\"#grid\").kendoGrid({\n    columns:\
    \ [\n    {\n    field : 'movieName',\n    title : 'Movie',\n    sortable: false,\n\
    \    },\n    {\n    field : 'year',\n    title : 'Year'\n    },\n    {\n    field\
    \ : 'rating',\n    title : 'Rating'\n    }\n    ],\n    dataSource: {\n    transport:\
    \ {\n    read: 'http://localhost/kendo/code/chapter2/remote.json'\n    }\n   \
    \ },\n    sortable: true\n    });\n```\n\nHere, by adding sortable as true, all\
    \ the columns in the Grid will be available for sorting. At the column level,\
    \ for the movieName field, the sortable option is set to false. This will disable\
    \ the sorting functionality on the first column. Also, note that adding the sortable\
    \ option for each column is not required since this is specified at the Grid level.\n\
    \nIn many scenarios, you would like the Grid columns to be sorted by multiple\
    \ columns. In our example, the Grid can be sorted by year first and then by rating.\
    \ To make this option available, set the option mode as multiple:\n\n```\nsortable:\
    \ {\n    mode: 'multiple'\n    }\n```\n\nBy default, the value for mode is single,\
    \ that is, the columns will be sorted based on the selected column."
  merge: -1
  img_proc: true
