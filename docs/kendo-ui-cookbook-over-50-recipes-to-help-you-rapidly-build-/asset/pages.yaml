  md: '![](img/2a66507445090790d34dc5588b56b24c_196_0.png)


    # # Making a chart interactive by adding events


    The Kendo UI Chart library can define various event handlers, which will be triggered
    when the user hovers or clicks on a data item in a series. In this recipe, we
    will display a tooltip when the user hovers over a data item in the chart, and
    in another example, we will change the color of the selected column when the user
    clicks on it.


    # # How to do it...


    Let''s consider the same `DataSource` object that we used to show the adoption
    of the Chrome browser over the years. In this example, let''s add another field,
    `feature`, that we will use to show `tooltip`:


    ```

    ```

    var chromeBrowser = [{

    ''year''   : 2008,

    ''percentage'': 0,

    ''feature''   : ''First stable release''

    }, {

    ''year''   : 2009,

    ''percentage'': 4,

    ''feature''   : ''HTML5 Video and Audio tag support''

    }, {

    ''year''   : 2010,

    ''percentage'': 15,

    ''feature''   : ''Support for WebM videos''

    }, {

    ''year''   : 2011,

    ''percentage'': 26,

    ''feature''   : ''Hardware accelerated 3D CSS''

    ```


    ```'
  merge: -1
  img_proc: true
- pgno: 197
  md: '```

    }, {

    ''year''

    : 2012,

    ''percentage'' : 40,

    ''feature'' : ''New Extensions API''

    }, {

    ''year''

    : 2013,

    ''percentage'' : 52,

    ''feature'' : ''Web Speech API''

    }, {

    ''year''

    : 2014,

    ''percentage'' : 56,

    ''feature'' : ''Different look for Win8 metro mode''

    }];

    ```


    The next step is to specify the tooltip option that contains fields that will
    be used to display

    a tooltip when the user hovers over a data item in the series, using the following
    code snippet:


    ```

    tooltip: {

    visible: true,

    template: ''#= dataItem.feature #'',

    background: ''#0F0''

    }

    ```


    Here, the template field contains the dataItem.feature value. The dataItem field
    refers

    to the object that is used to plot the column in the chart. The other possible
    values include

    category, which refers to the category in categoryAxis, which, in this case, would
    be the

    year field; value, which refers to the percentage value used to draw the column;
    and series,

    which refers to the entire series object.


    To handle click events, specify the seriesClick option:


    ```

    seriesClick: function (e) {

    //iterate over series data and set the color for each series

    for (var i = 0, j = e.series.data.length; i < j; i++) {

    e.series.data[i].color = ''#00F'';

    }

    //change the color of the selected series

    e.dataItem.color = ''#F00'';

    //redraw the graph - required for the changes to get reflected

    this.redraw();

    }

    ```


    The first statement in the preceding function loops through all the objects in
    the series and

    resets the color; then, the selected item in the series is assigned a different
    color. The chart

    needs to be refreshed or redrawn to bring these changes into effect; hence, the
    last line

    invokes the redraw function on this. The this object refers to the context; in
    this case,

    this is the series object.'
  merge: -1
  img_proc: true
