- pgno: 76
  md: '# # 4 Kendo UI Editor


    In this chapter, we will cover the following recipes:


    +   - Creating a WYSIWYG Editor using the `kendoEditor` function

    +   - Adding and removing tools in the Editor toolset

    +   - Using the image browser tool to insert images into the Editor


    # ## Introduction


    The Kendo UI Editor widget allows you to create rich content using the **WYSIWYG
    (What-You -See-Is-What-You-Get)** interface. The interface allows you to format
    the text, create bulleted or numbered lists, and insert tables, hyperlinks, and
    images. The toolset can also be customized while initializing the Editor widget.
    It is also possible to create custom tools that can be used in the Editor. In
    addition to various Editor controls, you can use an image browser to insert images
    into the Editor.


    # ## Creating a WYSIWYG Editor using the kendoEditor function


    An Editor can be created either by using a `textarea` or `div` element. In this
    recipe, we will create an Editor using a `textarea` element and show you the default
    tools available for formatting the data.'
  merge: -1
  img_proc: true
- pgno: 77
  md: "# # How to do it...\n\nLet's first create a textarea element, specifying the\
    \ number of rows, columns, and width:\n\n```\n`<textarea id=\"editor\"\n    row=\"\
    20\"\n    cols=\"80\"\n    style=\"width: 700px;\">\n</textarea>`\n```\n\nThe\
    \ next step is to use this textarea element and create an Editor by invoking the\n\
    kendoEditor function:\n\n```\n$(\"#editor\").kendoEditor();\n```\n\nThe kendoEditor\
    \ function is used to initialize textarea as an Editor widget. The Editor will\n\
    now have a WYSIWYG interface, allowing the user to format the text.\n\n# # How\
    \ it works...\n\nWhen you initialize the textarea element as an Editor by invoking\
    \ the kendoEditor\nfunction, various tools are available in the toolset, as shown\
    \ in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_77_0.png)\n\
    \nThe toolset bar is shown at the top of the Editor and it allows a user to format\
    \ the entered\ndata. This includes applying different formatting for the entered\
    \ text, marking the text as bold\nor italic, underlining the selected text, aligning\
    \ the text, creating a bulleted or numbered list,\nand adding images and tables."
  merge: -1
  img_proc: true
- pgno: 78
  md: "# # Adding and removing tools in the Editor toolset\n\nThe toolbar can be customized\
    \ to include only those set of tools that are required. For example,\nyou might\
    \ like to exclude the option of inserting a table from the toolset bar, or you\
    \ might like to\ninclude other options to format the text, say, changing the font\
    \ color, highlighting the selected\ntext, and so on.\n\n# ## How to do it...\n\
    \nWhen initializing the Editor widget, specify the tools option and include only\
    \ those tools that\nare required to be displayed in the toolbar:\n\n```\n```\n\
    $(\"#editor\").kendoEditor({\n    tools: [\n        \"bold\",\n        \"italic\"\
    ,\n        \"strikethrough\",\n        \"subscript\",\n        \"superscript\"\
    ,\n        \"foreColor\",\n        \"backColor\"\n    ]\n});\n```\n```\n\nIn the\
    \ preceding code snippet, the tools that should be displayed in the toolbar are\n\
    mentioned. These would replace the default ones.\n\n> The tools configuration\
    \ option can include the Editor commands such\n> as bold, italic, underline, strikethrough,\
    \ subscript,\n> superscript, fontName, fontSize, foreColor, backColor,\n> justifyLeft,\
    \ justifyCenter, justifyRight, justifyFull,\n> insertUnorderedList, insertOrderedList,\
    \ indent, outdent,\n> createLink, unlink, insertImage, createTable, addColumnLeft,\n\
    > addColumnRight, addRowAbove, addRowBelow, deleteRow,\n> deleteColumn, formatting,\
    \ insertHtml, and viewHtml."
  merge: -1
  img_proc: true
- pgno: 79
  md: "# # How it works...\n\nAs mentioned previously, when the tools configuration\
    \ is specified while initializing the Editor widget, the default ones are replaced\
    \ with the ones specified in the configuration, as shown in the following screenshot:\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_79_0.png)\n\n# # There's more...\n\n\
    Some of the tools, such as fontName and fontSize, list the possible values in\
    \ a drop-down list. By default, a list of fonts and font sizes are listed in these\
    \ dropdowns. This list can be customized in the tools configuration:\n\n```\n\
    $(\"#editor\").kendoEditor({\n tools: [\n {\n name: \"fontName\",\n items: [{\n\
    \ text: \"Default\",\n value: \"Arial, Verdana, sans-serif\"\n }, {\n text: \"\
    Monospace\",\n value: \"monospace\"\n }]\n }, {\n name: \"fontSize\",\n items:\
    \ [{\n text: \"Small\",\n value: \"12px\"\n }, {\n text: \"Medium\",\n value:\
    \ \"16px\"\n }, {\n text: \"Large\",\n\n```"
  merge: -1
  img_proc: true
- pgno: 80
  md: "```\nvalue: \"20px\"\n}\n]\n}\n]\n});\n```\n\nIn the preceding code snippet,\
    \ the tools configuration contains an array of objects. Each object\nhas a name\
    \ property, which specifies the name of the tool to be used and an items array,\n\
    which lists the values to be displayed in the dropdown. Consider the items array\
    \ used for the\nfontName tool. It contains a collection of objects, each having\
    \ two properties, namely text\nand value. The text property specifies the text\
    \ to be displayed and the value property\nspecifies the value to be applied when\
    \ the user selects the same value from the list. In this\ncase, if the user selects\
    \ Default from the list then the Arial, Verdana, sans-serif font would\nbe applied.\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_80_0.png)\n\nIn many cases, you would\
    \ like to create your own custom command that interacts with the\nEditor interface.\
    \ For example, a custom command that would insert text into the Editor. Apart\n\
    from various tools that the user can add to the toolset, the library allows you\
    \ to define custom\ncommands that interact with the Editor:\n\n```\n$(\"#editor\"\
    ).kendoEditor({\n    tools: [{\n        name: \"custom\",\n        exec: function(e)\
    \ {\n            var editor = $(this).data('kendoEditor');\n            editor.exec(\"\
    inserthtml\",\n                {value: \"Thanks,<br>Sagar Ganatra.\"});\n    \
    \    }\n    }]\n});\n```"
  merge: -1
  img_proc: true
- pgno: 81
  md: '# # Kendo UI Editor


    Here, the name of the tool is `custom`, and it contains a function, `exec`. The
    `exec` function is executed when the user clicks on the custom tool, as shown
    in the following screenshot. The function first gets a reference of the Editor
    widget and then calls the `exec` function on the Editor instance. The function
    takes two parameters, namely the command name and an object that contains a set
    of parameters for the executed command. In the previous example, the `inserthtml`
    command is used to insert text in the Editor widget. The text that should be inserted
    is specified as a second parameter.


    ![](img/2a66507445090790d34dc5588b56b24c_81_0.png)


    The command name to be used should be one of the Editor commands.


    # # Using the image browser tool to insert images into the Editor


    One of the tools available in the Editor toolset is the image browser. The image
    browser tool allows you to insert an image into the Editor. It asks the user for
    the image URL and an optional alternate text by displaying the dialog box, as
    shown in the following screenshot:


    ![](img/2a66507445090790d34dc5588b56b24c_81_1.png)'
  merge: -1
  img_proc: true
- pgno: 82
  md: "However, many of the rich applications being built today allow users to browse\
    \ the images  \nin a repository, upload images, and also remove images from the\
    \ same repository. The image  \nbrowser tool used in the Editor can be customized\
    \ to allow these actions. In this recipe, we will  \nsee how the image browser\
    \ tool is used to address such scenarios.\n\n# # Getting ready\n\nIn this recipe,\
    \ we will first take a look at reading images from a repository and showing  \n\
    thumbnails for the same in the image browser. This requires a server-side application\
    \ to  \nrespond to a request that returns a JSON structure that provides metadata,\
    \ such as the  \nimage name and file size.\n\nAlso, to display a set of thumbnail\
    \ images, a service that returns the requested thumbnail  \nimage is required.\
    \ The format of the request and fallback options are explained in this recipe.\n\
    \n# # How to do it...\n\nAs mentioned previously, we will need a service that\
    \ returns a JSON structure that contains  \nthe image metadata. The format in\
    \ which this data should be sent is shown in the following  \ncode snippet:\n\n\
    ```\n[\n    {\n        \"name\": \"OperaHouse1.jpg\",\n        \"type\": \"f\"\
    ,\n        \"size\": 73289\n    },\n    {\n        \"name\": \"OperaHouse2.jpg\"\
    ,\n        \"type\": \"f\",\n        \"size\": 15289\n    },\n    {\n        \"\
    name\": \"HarborBridge.jpg\",\n        \"type\": \"f\",\n        \"size\": 6286\n\
    \    }\n]\n```\n\nHere, the structure is a collection of objects, and each object\
    \ specifies the image name  \n(the `name` attribute) and image size (the `size`\
    \ attribute). The `type` attribute contains the value  \n`f`, denoting that it\
    \ represents the file type. In scenarios where we are creating a directory on\
    \  \nthe server, the `type` attribute should have the value `d`. The size of the\
    \ file should be in bytes.  \nHowever, when displaying the image metadata, it\
    \ would be converted to kilobytes."
  merge: -1
  img_proc: true
- pgno: 83
  md: "# # Kendo UI Editor\n\nThe next step is to specify the transport URLs to read\
    \ the structure previously mentioned\nand to get the thumbnail images from the\
    \ repository:\n\n```\n$(\"#editor\").kendoEditor({\n    tools: [ 'insertImage'\
    \ ],\n    imageBrowser: {\n        transport: {\n            read: \"/app/ImageService/Read\"\
    ,\n            thumbnailUrl: \"/app/ImageService/ThumbNailService\",\n       \
    \     imageUrl: \"/app/ImageService/Image?path={0}\"\n        }\n    }\n});\n\
    ```\n\nHere, the imageBrowser configuration option specifies the transport URLs\
    \ to read the JSON\nstructure that contains the metadata (the read attribute),\
    \ the service URL that returns the\nthumbnail images (the thumbnailUrl attribute),\
    \ and the service that returns the image that\nhas to be inserted into the Editor\
    \ (the imageUrl attribute).\n\n# # How it works...\n\nWhen you specify the imageBrowser\
    \ configuration, the default dialog box is overridden and\nan image browser modal\
    \ window is shown as follows:\n\n![](img/2a66507445090790d34dc5588b56b24c_83_0.png)"
  merge: -1
  img_proc: true
- pgno: 84
  md: 'When you click on the image browser tool, first the image metadata is fetched
    from the

    URL mentioned as the value to the read attribute. For each object in the JSON
    structure,

    the thumbnail service is referred to get the thumbnail of the image. In our example,
    the

    image name is HarborBridge.jpg and the request to the thumbnail service would

    be http://<domain_name>/app/ImageService/ThumbNailService?path=

    HarborBridge.jpg.


    Here, the query parameter, path, contains the name of the image for which the
    thumbnail

    has to be retrieved. Since there are three objects in the JSON structure, there
    would be three

    requests sent to the thumbnail service.


    The thumbnails shown in the preceding screenshot are of the dimension 80px X 60px
    and show

    you the name of the image and its size as well. The image browser tool also has
    a search input

    field, which filters the list of thumbnails displayed in the browser. This is
    particularly useful if you

    have an exhaustive list of thumbnail images and are looking for an image by name.


    On selecting the thumbnail image from the list and clicking on the Insert button,
    the

    corresponding image would be fetched from the service mentioned in imageUrl.

    Note the usage of {0} in imageUrl:


    /app/ImageService/Image?path={0}


    Here, {0} is replaced with the selected file name. The fetched image is then inserted
    into

    the Editor.


    # There''s more...


    The image browser tool also allows you to upload images and then insert the same
    into the

    Editor. To upload an image to the server, specify the upload service URL:


    ```

    imageBrowser: {

    transport: {

    read: "/app/ImageService/Read",

    thumbnailUrl: "/app/ImageService/ThumbNailService",

    imageUrl: "/app/ImageService/Image?path={0}",

    uploadUrl: "/app/ImageService/Upload"

    }

    }

    ```'
  merge: -1
  img_proc: true
