    \ is refreshed or redrawn, an animation is shown while\n> the chart is drawn.\
    \ To disable the animation, specify the transitions\n> property as false.\n\n\
    # How it works...\n\nWhen you hover over the plotted area, you will see that the\
    \ feature value in the data item\nis shown as a tooltip, as shown in the following\
    \ screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_198_0.png)"
