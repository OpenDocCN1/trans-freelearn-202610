  md: "# # Kendo UI TreeView\n\n```\n```html\n<ul>\n    <li>File1.txt</li>\n    <li>File2.txt</li>\n\
    </ul>\n</li>\n<li>\n    Directory2\n    <ul>\n        <li>File3.txt</li>\n   \
    \     <li>File4.txt</li>\n    </ul>\n</li>\n<li>\n    Directory3\n    <ul>\n \
    \       <li>File5.txt</li>\n        <li>File6.txt</li>\n    </ul>\n</li>\n</ul>\n\
    ```\n```\n\nThe next step is to initialize the TreeView widget by invoking the\
    \ `kendoTreeView` function on the DOM node using the following line of code:\n\
    \n`$('#treeView').kendoTreeView();`\n\n# ## How it works...\n\nThe TreeView widget\
    \ displays the hierarchical data in a tree-like structure, as shown in the following\
    \ screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_61_0.png)\n\nNote that\
    \ TreeView displays only the top-level elements. It shows you a right arrow icon\
    \ before the element. On clicking on the icon, the top-level element expands to\
    \ show you the next level in the hierarchical structure."
