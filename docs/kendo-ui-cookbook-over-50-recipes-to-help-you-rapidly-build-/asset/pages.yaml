    });


    # There’s more...


    In the previous example, we saw that the validation message was specified in the
    markup. It is also possible to configure the validator so that the same message
    is applicable to all fields with a specific validation rule. For example, all
    required fields can have the same validation message, such as **This field is
    required**.


    The messages configuration option can be used to set the various validation messages
    that can be applied across all the input elements, as shown in the following code
    snippet: $("form#testView").kendoValidator({ messages: { // {0} would be replaced
    with the input element''s name required: ''{0} is required'' email: ''Enter a
    valid email address'' });'
