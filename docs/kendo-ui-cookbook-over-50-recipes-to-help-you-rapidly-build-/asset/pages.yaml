- pgno: 159
  md: "# # Building an endless scrolling list\n\nA ListView widget can be customized\
    \ to display an exhaustive list of items. There are multiple ways in which this\
    \ can be done, for example, by adding a button at the bottom of the list, after\
    \ clicking on which, the next set of elements would be added to the list. The\
    \ other way would be to add more elements as and when the user scrolls down. This\
    \ is called endless scrolling and it provides a seamless experience when the user\
    \ is scrolling through an exhaustive list. In this recipe, we will see both the\
    \ approaches, that is, adding a button to load more elements and creating an endless\
    \ scrolling list, which is loaded when the user scrolls down.\n\n# ## How to do\
    \ it...\n\nIn both the cases, the DataSource object must be configured so that\
    \ it returns a limited number of records. While configuring DataSource for the\
    \ ListView widget, specify the pageSize attribute:\n\n```\n```\ndataSource: {\n\
    \ transport: {\n read: '/movies/listService'\n },\n pageSize: 10\n}\n```\n```\n\
    \nTo add the button at the bottom of the list, specify the loadMore option with\
    \ its value set to true:\n\n```\n```\nfunction initListView (e) {\n $('#listViewContainer').kendoMobileListView({\n\
    \ dataSource: {\n transport: {\n read: '/movies/listService'\n },\n pageSize:\
    \ 10\n },\n loadMore: true\n });\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 160
