  md: '![](img/2a66507445090790d34dc5588b56b24c_96_0.png)


    The advantage of loading the content at runtime as opposed to loading it upfront
    is that the size of the response from the server is reduced, and hence, the time
    taken to display the page is also reduced. In many scenarios where the PanelBar
    contains several sections, the user might not click on all of them. In these cases,
    it is ideal to load the content at runtime.


    # There''s more...


    When working with remote requests, there are possibilities of the server taking
    more time to respond, or maybe the service is not available. In these scenarios,
    the user should be informed of the error message or be redirected to an error
    page.


    A series of events are generated right from when the user clicks on a list heading
    to the point the content is loaded in the corresponding panel. The application
    can specify callback handlers for these events while initializing the PanelBar
    widget.


