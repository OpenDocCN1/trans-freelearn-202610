- pgno: 28
  md: "# # How to do it...\n\nLet's first construct a ViewModel object:\n\n```\n```\n\
    var viewModel = kendo.observable({\n optionsData: [\n {optionValue:1, optionName:\
    \ \"Test1\"},\n {optionValue:2, optionName: \"Test2\"},\n {optionValue:3, optionName:\
    \ \"Test3\"}\n ]\n});\n```\n```\n\nThe ViewModel object here contains an optionsData\
    \ attribute, which is a collection (array) of objects. Each object in optionsData\
    \ contains two attributes, namely optionValue and optionName. The optionValue\
    \ attribute will be used for the value attribute of the option tag, and optionName\
    \ will be used for the HTML content to be shown in the dropdown. The template\
    \ that contains the option tag binding is shown in the following code snippet:\n\
    \n```\n```\n<script id=\"select-template\" type=\"text/x-kendo-template\">\n <option\
    \ data-bind=\n \"attr: {value: optionValue}, html: optionName\">\n </option>\n\
    </script>\n```\n```\n\nHere, the template with the id attribute set to select-template\
    \ contains one option tag. The option tag contains the data-bind attribute whose\
    \ value is attr: {value: optionValue}, html: optionName. We already saw the attribute\
    \ binding in action in the previous recipe. The other binding specified here is\
    \ html. This binding is used to generate the HTML content for the tag. These option\
    \ tags should be bound to the ViewModel object and be encapsulated inside a select\
    \ tag.\n\nThe select tag can refer to the template (mentioned previously) and\
    \ bind to the ViewModel object using the source attribute:\n\n```\n```\n<select\
    \ data-template=\"select-template\"\n data-bind=\"source: optionsData\">\n</select>\n\
    ```\n```\n\nHere, the select tag specifies the two attributes, namely data-template\
    \ and data-bind. The value of the data-template attribute is the id attribute\
    \ of the template (the script tag) that we defined earlier, that is, select-template.\
    \ This instructs kendo to bind the template to the select tag, and the generated\
    \ content would become the HTML content for this select tag."
  merge: -1
  img_proc: true
- pgno: 29
  md: '# # The Kendo UI Application Framework


    The data-bind attribute specifies a binding source that refers to the optionData
    model attribute in ViewModel. Now, the only step pending is to bind View elements
    to ViewModel, which is attained by executing the following line of code:


    ```

    kendo.bind($(''select''), viewModel);

    ```


    # # How it works...


    The select tag specifies the source binding that refers to the optionsData model
    attribute. This will make the collection of objects available to all the tags
    inside it.


    The data-template attribute that refers to the template in the page is provided
    with the collection of objects (optionsData) and the template is iterated for
    the number of entries in the array. In this example, the optionsData collection
    contains three objects and hence, the template is generated three times and inserted
    as the HTML content for the select tag. The generated content would look like
    the following code snippet:


    ```

    <select data-template="select-template" data-bind="source: optionsData"> <option
    data-bind=" attr: {value: optionValue}, html: optionName" value="1"> Test1 </option>
    <option data-bind=" attr: {value: optionValue}, html: optionName" value="2"> Test2
    </option> <option data-bind=" attr: {value: optionValue}, html: optionName" value="3">
    Test3 </option> </select>

    ```


    The data- attributes would remain as they are, and the generated content now has
    the value attribute and the HTML content. Note that the preceding code could have
    been accomplished by using a for statement in a hash-based template and then appending
    the generated output to the select tag. However, using a data-template attribute
    and source binding allows you to do this seamlessly and write more intuitive code.'
  merge: -1
  img_proc: true
