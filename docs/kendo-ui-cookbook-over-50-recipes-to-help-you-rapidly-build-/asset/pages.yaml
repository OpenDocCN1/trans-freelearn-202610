- pgno: 204
  md: '# # 11 Kendo UI DataViz – Advance Charting


    In this chapter, we will cover the following recipes:


    +   - Creating a chart to show stock history

    +   - Using the Radial Gauge widget

    +   - Using the Linear Gauge widget

    +   - Generating barcode images using various encoding methods

    +   - Generating a QR code image to represent a URL, e-mail, telephone, and geographic
    location

    +   - Creating flow diagrams using Kendo Diagram

    +   - Creating hierarchical structural diagrams using `layouts`

    +   - Creating a map to display geospatial information using an OpenStreet map

    +   - Creating a map by binding it to the GeoJSON data


    # ## Introduction


    The Kendo UI library provides several advance charting widgets that can be used
    to visualize data. These include the Stock Chart widget that shows you the stock
    price history of a particular stock, the Map widget that visualizes data on a
    map, the Gauge widget that creates a dashboard that contains gauge charts, Barcode
    and QRCode widgets that allow you to create codes that can be used to identify
    products, and the Diagram widget that creates diagrams that show you nested relationships
    between various entities. These are some of the advance charts in addition to
    the basic charts mentioned in the previous chapter.'
  merge: -1
  img_proc: true
- pgno: 205
  md: "# # Creating a chart to show stock history\n\nThe Kendo UI library provides\
    \ a specialized chart widget that can be used to display the stock price data\
    \ for a particular stock over a period of time. In this recipe, we will take a\
    \ look at creating a Stock chart and customizing it.\n\n# ## Getting started\n\
    \nInclude the CSS files, kendo.dataviz.min.css and kendo.dataviz.default.min.css,\
    \ in the head section. These files are used in styling some of the parts of a\
    \ stock history chart.\n\n# ## How to do it...\n\nA Stock chart is made up of\
    \ two charts: a pane that shows you the stock history and another pane that is\
    \ used to navigate through the chart by changing the date range.\n\nThe stock\
    \ price for a particular stock on a day can be denoted by the following five attributes:\n\
    \n+   - Open: This shows you the value of the stock when the trading starts for\
    \ the day\n+   - Close: This shows you the value of the stock when the trading\
    \ closes for the day\n+   - High: This shows you the highest value the stock was\
    \ able to attain on the day\n+   - Low: This shows you the lowest value the stock\
    \ reached on the day\n+   - Volume: This shows you the total number of shares\
    \ of that stock traded on the day\n\nLet's assume that a service returns this\
    \ data in the following format:\n\n```\n[\n    {\n        \"Date\" : \"2013/01/01\"\
    ,\n        \"Open\" : 40.11,\n        \"Close\" : 42.34,\n        \"High\" : 42.5,\n\
    \        \"Low\" : 39.5,\n        \"Volume\": 10000\n    }\n    .\n    .\n   \
    \ .\n]\n```"
  merge: -1
  img_proc: true
- pgno: 206
  md: "We will use the preceding data to create a Stock chart. The kendoStockChart\
    \ function is used to create a Stock chart, and it is configured with a set of\
    \ options similar to the area chart or Column chart, as mentioned in the previous\
    \ chapter. In addition to the series data, you can specify the navigator option\
    \ to show a navigation pane below the chart that contains the entire stock history:\n\
    \n```\n$(\"#chart\").kendoStockChart({\n    title: {\n        text: 'Stock history'\n\
    \    },\n\n    dataSource: {\n        transport: {\n            read: '/services/stock?q=ADBE'\n\
    \        }\n    },\n\n    dateField: \"Date\",\n\n    series: [{\n        type:\
    \ \"candlestick\",\n        openField: \"Open\",\n        closeField: \"Close\"\
    ,\n        highField: \"High\",\n        lowField: \"Low\"\n    }],\n\n    navigator:\
    \ {\n        series: {\n            type: 'area',\n            field: 'Volume'\n\
    \        }\n    }\n});\n```\n\nIn the preceding code snippet, the DataSource object\
    \ refers to the remote service that would return the stock data for a set of days.\
    \ The series option specifies the series type as candlestick; a candlestick chart\
    \ is used here to indicate the stock price for a particular day. The mappings\
    \ for openField, closeField, highField, and lowField are specified; they will\
    \ be used in plotting the chart and also to show a tooltip when the user hovers\
    \ over it. The navigator option is specified to create an area chart, which uses\
    \ volume data to plot the chart. The dateField option is used to specify the mapping\
    \ between the date fields in the chart and the one in the response."
  merge: -1
  img_proc: true
- pgno: 207
  md: '# # How it works...


    When you load the page, you will see two panes being shown; the navigator is below
    the main chart. By default, the chart displays data for all the dates in the `DataSource`
    object, as shown in the following screenshot:


    ![](img/2a66507445090790d34dc5588b56b24c_207_0.png)


    In the preceding screenshot, a candlestick chart is created and it shows you the
    stock price over a period of time. Also, notice that in the navigator pane, all
    date ranges are selected by default, and hence, they are reflected in the chart
    (candlestick) as well. When you hover over the series, you will notice that the
    stock quote for the selected date is shown. This includes the date and other fields
    such as **Open**, **High**, **Low**, and **Close**.


    The area of the chart is adjusted to show you the stock price for various dates
    such that the dates are evenly distributed. In the previous case, the dates range
    from January 1, 2013 to January 31, 2013. However, when you hover over the series,
    you will notice that some of the dates are omitted. To overcome this, you can
    either increase the width of the chart area or use the navigator to reduce the
    date range. The former option is not advisable if the date range spans across
    several months and years.'
