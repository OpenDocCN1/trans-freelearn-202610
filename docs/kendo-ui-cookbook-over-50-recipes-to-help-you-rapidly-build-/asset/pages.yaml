- pgno: 122
  md: '# # 8 Kendo UI Mobile Framework


    In this chapter, we will cover the following recipes:


    +   - Creating a layout and adding views to the layout

    +   - Setting the initial layout and view when initializing the application

    +   - Using the Application object to navigate to various views

    +   - Adding touch events to your mobile application


    # ## Introduction


    In the earlier recipes, we looked at various components available in the Kendo
    UI library that enable you to build web applications rapidly. In the upcoming
    recipes, we will take a look at the Kendo UI Mobile library that provides an application
    framework and a set of widgets that enable you to build mobile applications quickly.
    The Kendo UI Mobile framework renders the application by providing a native look
    and feel on various mobile platforms, which includes iOS, Android, Blackberry,
    and Windows Phone 8. The developers can focus on delivering functionality and
    depend on the Mobile framework to provide the native look and feel of various
    platforms, thereby reducing the development effort and maintaining the same code
    base for all the platforms.'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# # Creating a layout and adding views to the layout


    Every Kendo Mobile application has one or more layouts and multiple views added
    to it. Both the layout and view are widgets, that is, visual components that can
    be used to build a mobile application. There are several such widgets, which we
    will explore in the next chapter. In this recipe, we will take a look at building
    a simple application by creating a layout and adding multiple views to it.


    # ## Getting started


    There are separate CSS and JS files that need to be included when working with
    mobile applications. The CSS file should refer to the `kendo.mobile.all.min.css`
    file located in the `styles` directory and the JS files should refer to `kendo.mobile.min.js`,
    located in the `js` directory.


    Also, the reference to the jQuery library should remain as it is, that is, the
    Kendo UI Mobile library (`kendo.mobile.min.js`) has a dependency on jQuery.


    # ## How to do it...


    As mentioned in the previous section, let''s first include the CSS and JS files
    references in the HTML page, as shown in the following code snippet:


    ```

    ```html

    <link rel="stylesheet" type="text/css" href="../styles/kendo.mobile.all.min.css">

    <script src="../js/jquery.min.js"></script>

    <script src="../js/kendo.mobile.min.js"></script>

    ```

    ```


    > > You might have to adjust the paths of the file based on the directory structure
    of your development environment.'
  merge: -1
  img_proc: true
- pgno: 124
  md: 'The next step is to create a layout. A layout serves as a container for various
    views in the application. A layout defines the structure of the application; it
    contains widgets that will remain constant while the user is interacting with
    the application. For example, most of the applications have a header and a footer
    that remain constant while navigating through the application. The header and
    footer widgets can be a part of the layout and the dynamic part, that is, views
    that change based on the state of the application will be associated with a layout.
    Views can be considered as individual pages in the application that are displayed
    based on the state of the application. For example, you can have two views, namely,
    login and register. Based on the application state, one of these views is rendered.
    Create a layout widget using the `div` element by adding data attributes:


    ```

    ```html

    <div

    data-role="layout"

    data-id="defaultLayout">

    </div>

    ```

    ```


    Here, the `data-role` attribute is set to the layout, identifying the element
    as a layout widget. Every widget in the Mobile framework will have the `data-role`
    attribute set to the corresponding widget name. The `data-id` attribute is used
    to identify the widget on the page. There can be multiple layout widgets in the
    page, and each widget needs to have a unique ID that identifies the widget in
    the application.


    Now let''s add a couple of widgets to the layout, such as a `header` widget, which
    contains a `navbar`, and a `footer` widget, which contains `tabstrip`:


    ```

    ```html

    <div

    data-role="layout"

    data-id="defaultLayout">

    <header data-role="header">

    <div data-role="navbar">

    Application Header

    </div>

    </header>

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 125
  md: "# # Kendo UI Mobile Framework\n\n```\n```html\n<footer data-role=\"footer\"\
    >\n  <div data-role=\"tabstrip\">\n    <a data-icon=\"about\">About</a>\n    <a\
    \ data-icon=\"settings\">Settings</a>\n  </div>\n</footer>\n</div>\n```\n```\n\
    \nAs mentioned earlier, a widget is created by assigning appropriate values to\
    \ the `data-role` attribute. In this case, the `header`, `navbar`, `footer`, and\
    \ `tabstrip` values are assigned to the `data-role` attribute of various elements.\n\
    \nOnce a layout is added to the page, the next step would be to add a view. A\
    \ view widget represents a single view that needs to be shown when the application\
    \ is rendered. There can be multiple views in the page and only one view can be\
    \ rendered at any given point, depending on the state of the application:\n\n\
    ```\n```html\n<div data-role=\"view\" data-layout=\"defaultLayout\">\n  Hello\
    \ Kendo!!\n</div>\n```\n```\n\nHere, apart from the `data-role` attribute, the\
    \ `div` element also has a `data-layout` attribute. The `data-layout` attribute\
    \ is used to associate the view widget with a layout widget in the page. In this\
    \ case, the value of the `data-layout` attribute is `defaultLayout`, which is\
    \ the value of the `data-id` attribute of the `layout` widget. The `header` and\
    \ `footer` widgets defined in `layout` are positioned accordingly, and the View\
    \ widget is rendered in the available space inside the layout. The last step would\
    \ be to initialize the application. To initialize it, include the following code\
    \ snippet:\n\n```\n```html\n<script>\nvar app = new kendo.mobile.Application();\n\
    </script>\n```\n```\n\nThe preceding code snippet will initialize all the widgets\
    \ in the page and make associations between the layout and views. The Application\
    \ object can then be used to route between multiple views in the page, and we\
    \ will visit this scenario in the upcoming recipes."
  merge: -1
  img_proc: true
- pgno: 126
  md: '# # How it works...


    When you execute the page, you will see a navigational bar and a tab strip in
    the header and footer of the page. Also, the **Hello Kendo!!** message will be
