- pgno: 215
  md: "# # Updating the pointer value using a Slider widget\n\nThe `pointer` value\
    \ is set when the Radial Gauge widget is initialized. It is possible to change\
    \ the `pointer` value of the widget at runtime using a Slider widget. The changes\
    \ in the Slider widget can be observed, and the `pointer` value of the Radial\
    \ Gauge can be updated accordingly.\n\nLet's use the same Radial Gauge widget\
    \ mentioned in the previous recipe. A Slider widget is created using an input\
    \ element:\n\n```\n```\n<input id=\"slider\" value=\"0\" />\n```\n```\n\nThe next\
    \ step is to initialize the previously mentioned input element to a Slider widget:\n\
    \n```\n```\n$(\\'#slider\\').kendoSlider({\n    min: 0,\n    max: 200,\n    showButtons:\
    \ false,\n    smallStep: 10,\n    tickPlacement: \\'none\\',\n    change: updateRadialGuage\n\
    });\n```\n```\n\nThe `min` and `max` values specify the range of values that can\
    \ be set for the slider. The `smallStep` attribute specifies the minimum increment\
    \ value of the slider. The `change` attribute specifies the function that should\
    \ be invoked when the `slider` value changes.\n\nThe `updateRadialGuage` function\
    \ should then update the value of the pointer in the Radial Gauge widget:\n\n\
    ```\n```\nfunction updateRadialGuage() {\n    $(\\'#chart\\').data(\\'kendoRadialGauge\\\
    ')\n        .value($(\\'#slider\\').val());\n}\n```\n```\n\nThe function gets\
    \ the instance of the widget and then sets its value to the value obtained from\
    \ the Slider widget."
  merge: -1
  img_proc: true
