- pgno: 139
  md: '# # How it works...


    The `touchstart` event is invoked when the user touches the surface. The event
    object available in the `touchstart` event handler can be used to determine the
    x and y coordinates where the touch was triggered. The `tap` event is invoked
    when the user taps on the screen, that is, after lifting the finger from the touch
    screen. Similarly, a `doubletap` event is invoked when the user taps on the screen
    twice in quick succession. If the user touches the screen and does not lift his
    finger for a few seconds, then the `hold` event is fired. The `swipe` event is
    fired when the users swipes his finger either from left to right or from right
    to left. The `direction` attribute available on the event object can be used to
    determine the direction in which the user has initiated the swipe. The sequence
    of events is as follows:


    +   - The `touchstart` event will be triggered when the user touches the screen

    +   - The `tap` event will be triggered when the user taps on the screen

    +   - The `doubletap` event will be invoked after `tap` when the application recognizes
    the second tap


    In the case of `hold`, the following sequence is executed:


    +   - The `touchstart` event will be triggered

    +   - The `hold` event will be triggered when the user continues his focus on
    one point for a long time'
  merge: -1
  img_proc: true
