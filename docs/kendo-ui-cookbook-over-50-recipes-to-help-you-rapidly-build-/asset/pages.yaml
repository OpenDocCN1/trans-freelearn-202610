    chart.bind('seriesClick', function (e) {\n    for (var i = 0, j = e.series.data.length;\
    \ i < j; i++) {\n        e.series.data[i].color = '#00F';\n    }\n    e.dataItem.color\
    \ = '#F00';\n    this.redraw();\n});\n```\n\nThe first line in the preceding code\
    \ snippet gets a reference to the chart object. The chart\nobject is then used\
    \ to subscribe to the seriesClick event. Now when the user clicks on a\nparticular\
