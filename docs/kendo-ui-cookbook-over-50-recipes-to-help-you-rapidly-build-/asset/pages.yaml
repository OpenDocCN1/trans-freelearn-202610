  md: "# # Listening to file upload events\n\nBefore the advent of HTML5, the only\
    \ event listener that was available with XmlHttpRequest was the `readystatechange`\
    \ event listener. In HTML5, several event listeners have been added to the `XmlHttpRequest`\
    \ interface: loadstart, progress, load, abort, error, timeout, and loadend. In\
    \ this recipe, we will see the various event listeners that can be attached to\
    \ the file uploader widget and the sequence in which these events are executed.\n\
    \n# # How to do it...\n\nThe file uploader widget shows you the progress of the\
    \ files being uploaded and shows the status as completed when all files have been\
    \ uploaded. However, in many instances, you would like to attach listeners and\
    \ listen to various events:\n\n```\n```\n$(\\'#fileUpload\\').kendoUpload({\n\
    \    async: {\n        \\'saveUrl\\': \\'/fileUploadService/save\\',\n       \
    \ \\'removeUrl\\': \\'/fileUploadService/remove\\',\n        \\'autoUpload\\':\
    \ true\n    },\n    cancel: function () {\n        console.log(\\'Cancel Event.\\\
    ');\n    },\n    complete: function () {\n        console.log(\\'Complete Event.\\\
    ');\n    },\n    error: function () {\n        console.log(\\'Error uploading\
    \ file.\\');\n    },\n    progress: function (e) {\n        console.log(\\'Uploading\
    \ file \\' + e.percentComplete);\n    },\n    remove: function () {\n        console.log(\\\
    'File removed.\\');\n    },\n    select: function () {\n```\n```"
