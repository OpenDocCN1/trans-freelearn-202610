- pgno: 230
  md: 'Here, the visual attribute’s value is a function that returns a visual element
    that needs

    to be rendered on the diagram. In our example, we will create a visual element
    that includes

    the name and designation properties from the model. The function first creates
    a group

    element by creating an instance of kendo.dataviz.diagram.Group. A Group attribute

    is an invisible visual element, which is used to contain and group other visual
    elements.

    We then create instances for kendo.dataviz.diagram.Rectangle and kendo.

    dataviz.diagram.TextBlock and append it to the group. The function then returns

    the group object. This function is invoked recursively and nodes are added to
    the diagram.


    # How it works...


    When the layout subtype is down, the root node is placed at the top and the child
    nodes

    are added, growing the tree downwards, as shown in the following screenshot:


    ![](img/2a66507445090790d34dc5588b56b24c_230_0.png)


    When you change the subtype to left, the root node is placed on the right-hand
    side and the

    nodes are added such that the tree grows from right to left.


    ![](img/2a66507445090790d34dc5588b56b24c_230_1.png)'
  merge: -1
  img_proc: true
- pgno: 231
  md: "After changing the subtype to mindmapHorizontal, the root node is placed at\
    \ the center and the child nodes are added on either side.\n\n![](img/2a66507445090790d34dc5588b56b24c_231_0.png)\n\
    \nYou can try changing the subtype to radial and tipOver to see the placement\
    \ of nodes in the diagram.\n\n# # Creating a map to display geospatial information\
    \ using an OpenStreet map\n\nThe library provides APIs that you can use to display\
    \ a map of a particular location on the page. In this recipe, we will create a\
    \ map by using the kendoMap function, providing some configuration details. We\
    \ will use OpenStreet maps to fetch images for the map.\n\n# # How to do it...\n\
    \nTo create a map, invoke the kendoMap function on the selected DOM node, providing\
    \ the configuration options mentioned in the following code snippet:\n\n```\n\
    ```\n$('#chart').kendoMap({\n    center: [30.2681, -97.7448],\n    zoom: 4,\n\
    \    layers: [{\n        type: 'tile',\n        urlTemplate: \"http://#= subdomain\
    \ #.tile2.opencyclemap.org/transport/#= zoom #/#= x #/#= y #.png\",\n        subdomains:\
    \ ['a', 'b', 'c'],\n        attribution: '&copy; <a href=\"http://osm.org/copyright\"\
    >OpenStreetMap contributors</a>.' +\n            'Tiles courtesy of <a href=\"\
    http://www.opencyclemap.org/\">Andy Allan</a>'\n    }],\n    ...\n});\n```\n```"
  merge: -1
  img_proc: true
- pgno: 232
  md: 'In the preceding code snippet, the center option is used to specify the coordinates
    of the

    map''s center location. The latitude and longitude information, along with the
    provided map''s

    width and height, is used to center the map in the container. The zoom option
    is used to set

    the zoom level of the map. The layers attribute is used to specify various layers
    that will be

    displayed on the map; in the previous example, the type of layer is specified
    as tile, which is

    used to display data from the OpenStreet map. The other possible values for type
    are bing,

    which is used to retrieve maps from Bing maps; marker, which is used to add markers
    to the

    map; and shape, which is used to display a vector-shape layer. These values are
    used when

    the data is bound to the geoJSON data. The urlTemplate attribute specifies the
    URL from

    which the map data has to be retrieved. It takes into account the zoom level set
    for the map

    and the x and y coordinates, that is, the latitude and longitude information specified
    in the

    center attribute and in the subdomains property. Notice that after the urlTemplate
    option,

    the subdomains property is specified. It is an array that mentions the subdomains
    that should

    be used to get map images. The browser has a limit on the number of images that
    can be

    retrieved in parallel per domain. When using subdomains, the images are fetched
    in parallel;

    hence, it reduces the time required to render the entire map. The attribution
    field is used

    to specify the attribution for the layer.


    Let''s now add some markers to the map. A marker is another layer type that can
    be added:


    ```

    $(''#chart'').kendoMap({

    .

    .

    layers: [{

    type: ''tile'',

    .

    .

    }, {

    type: ''marker'',

    locationField: ''latlng '',

    tooltip: {

    content: function (e) {

    return e.sender.marker.dataItem.tooltip;

    }

    },

    dataSource: {

    data: [{

    latlng: [40.6700, -73.9400],

    tooltip: ''New York''

    }, {

    latlng: [34.0500, -118.2500],

    tooltip: ''Los Angeles''

    }]]

    }});

    ```'
  merge: -1
  img_proc: true
- pgno: 233
  md: "# # Kendo UI DataViz - Advance Charting\n\nIn the preceding code snippet, the\
    \ type of layer is specified as `marker` and the  \n`locationField` attribute\
    \ specifies the value as `latlng`. This refers to the property  \nin the `dataSource`\
    \ option. The `dataSource` attribute specifies the marker details, that  \nis,\
    \ the latitude and longitude information where the marker must be added and the\
    \ tooltip  \nto be shown when the user hovers over the marker. The `tooltip` option\
    \ contains a  \n`content` attribute, whose value is a function that returns the\
    \ tooltip information from  \nthe `dataSource` attribute.\n\n# ## How it works...\n\
    \nWhen you render the page, a map is shown. The map data is fetched from the specified\
    \  \nURL, that is, from OpenStreet maps using various subdomains.\n\n![](img/2a66507445090790d34dc5588b56b24c_233_0.png)\n\
    \nNotice that the map shows you the navigator and zoom controls at the top-left\
    \ corner of the  \nmap. Also, the attribution text is shown in the bottom-right\
    \ corner of the map. After adding  \nlayer markers, the map would now contain\
    \ pins at the specified latitude and longitude  \ncoordinates, as shown in the\
    \ following screenshot:"
  merge: -1
  img_proc: true
- pgno: 234
  md: '![](img/2a66507445090790d34dc5588b56b24c_234_0.png)


    In the preceding screenshot, a tooltip is shown when the user hovers over the
    marker.


    # There''s more...


    In the earlier examples, the navigator, zoom, and attribution controls were placed
    at the top-left and at the bottom-right corners of the screen. The position of
    these controls can be changed by including the controls option and specifying
    the position of these controls:


    ```

    $(''#chart'').kendoMap({

    .controls: {

    navigator: {

    position: "bottomRight"

    },

    zoom: {

    position: "bottomLeft"

    },

    },

    ```'
  merge: -1
