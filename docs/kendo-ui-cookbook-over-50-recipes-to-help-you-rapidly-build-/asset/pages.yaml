    \n# # How it works...\n\nIn this example chart, the type of chart is specified\
    \ as area, and now when you render the\npage, an area chart that shows the percentage\
    \ adoption over several years is displayed,\nas shown in the following screenshot:\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_185_0.png)"
