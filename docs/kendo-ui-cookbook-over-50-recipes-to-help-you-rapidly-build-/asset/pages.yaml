  md: '# # Kendo UI TreeView


    When you check any of the parent nodes (for example, `Directory1`), the child
    nodes will not be selected. When you set the configuration option, `checkChildren`,
    to `true`, the child level nodes would be selected.


    ![](img/2a66507445090790d34dc5588b56b24c_71_0.png)


    Also, note that when you select any of the child nodes, the parent node would
    be partially selected.


    ![](img/2a66507445090790d34dc5588b56b24c_71_1.png)


    Here, the `File1.txt` child node is selected and the root node, `Directory1`,
    is partially selected. When you select all the child nodes, the parent node would
    be marked as selected.'
