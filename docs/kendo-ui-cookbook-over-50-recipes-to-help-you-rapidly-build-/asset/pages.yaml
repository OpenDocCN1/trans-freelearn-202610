  md: '# # 9 Kendo UI Mobile Widgets


    In this chapter, we will cover the following recipes:


    +   - Creating a list using a ListView widget

    +   - Binding the ListView widget to a DataSource object

    +   - Fixing the headers when the user scrolls through the list

    +   - Filtering the elements in the ListView widget

    +   - Building a hierarchical list using the ListView widget

    +   - Building an endless scrolling list

    +   - Showing a list of actions that can be performed using the ActionSheet widget

    +   - Using the ScrollView widget to navigate through a collection of pictures

    +   - Creating a SplitView widget to display multiple panes in a tablet and building
    interaction between the panes

    +   - Using a TabStrip widget to display different views


    # ## Introduction


    The Kendo UI Mobile library contains a multitude of widgets that can be readily
    used in your mobile applications. These widgets allow you to build some of the
    common mobile-related workflows by configuring them to match your needs. Some
    of the commonly used widgets include ListView, ScrollView, ActionSheet, TabStrip,
    and Navbar. The library also provides a SplitView widget that can be used in tablet
    applications.'
