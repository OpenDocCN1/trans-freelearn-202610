- pgno: 39
  md: "# # Displaying data from a local or remote DataSource component in a Grid view\n\
    \nA Grid component can be created using the data present in the page or by referring\
    \ to model data, that is, data in the JSON format. The Kendo UI library provides\
    \ a DataSource component that can be used to store a model data. The DataSource\
    \ component can be bound to a local data source or to a remote service that returns\
    \ data in either the XML or JSON format.\n\n# ## How to do it...\n\nAs mentioned\
    \ in the previous recipe, we can either use a table element or a div element to\
    \ construct a Grid:\n\n```\n```\n<div id=\"grid\">\n</div>\n```\n```\n\nNow, when\
    \ we initialize the Grid using the kendoGrid function, we need to specify the\
    \ configuration and data for the table:\n\n```\n```\n$(\"#grid\").kendoGrid({\n\
    \    columns: [\n        {\n            field : 'movieName',\n            title\
    \ : 'Movie'\n        },\n        {\n            field : 'year',\n            title\
    \ : 'Year'\n        },\n        {\n            field : 'rating',\n           \
    \ title : 'Rating'\n        }\n    ],\n    dataSource: [\n        {\n        \
    \    movieName : 'The Shawshank Redemption',\n            year      : 1994,\n\
    \            rating    : 9.2\n        },\n```\n```"
  merge: -1
  img_proc: true
- pgno: 40
  md: "```\n{\n    movieName : 'The Godfather',\n    year    : 1972,\n    rating \
    \ : 9.2\n},\n{\n    movieName : 'The Godfather - Part 2',\n    year    : 1974,\n\
    \    rating  : 9.0\n},\n{\n    movieName : 'Pulp Fiction',\n    year    : 1994,\n\
    \    rating  : 8.9\n},\n{\n    movieName : 'The Good, the Bad and the Ugly',\n\
    \    year    : 1966,\n    rating  : 8.9\n}\n]\n});\n```\n\nIn the preceding code\
    \ snippet, the Grid is being initialized with two objects, namely `columns`\n\
    and `dataSource`. The `columns` object is a collection of JavaScript objects that\
    \ specify the\ncolumn configuration. The configuration contains two properties,\
    \ `field` and `title`. The\n`field` property refers to the field in `dataSource`\
    \ that the column is bound to and `title`\nspecifies the text to be displayed\
    \ as a header in the Grid.\n\nThe `dataSource` object is also a collection of\
    \ JavaScript objects that contains the data that\nwill be displayed in the Grid.\
    \ In this example, there are five objects and hence, the Grid will\ncontain five\
    \ rows.\n\n> Please note, the `columns` object can be an array of strings as well:\n\
    > `columns: ['movieName', 'year', 'rating']`\n> In this case, the entries in the\
    \ columns array should match the field name\n> in the `dataSource` object. The\
    \ title for the columns will be the same as\n> the field names."
  merge: -1
  img_proc: true
