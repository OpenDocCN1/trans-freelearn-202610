    \n# # Building a hierarchical list using the ListView widget\n\nIn all the previous\
    \ recipes, the data returned from the service contained all the records, and the\
    \ same were displayed in the list. When working with a hierarchical data structure\
    \ instead of a flat one, the ListView widget can be customized so that it can\
    \ display the data in a hierarchical way, that is, displaying the elements in\
    \ the first level of the hierarchy and then traversing through various levels\
    \ until the leaf nodes in the hierarchy are reached."
  merge: -1
  img_proc: true
- pgno: 155
  md: "# # Getting started\n\nTo build a hierarchical list, the service should return\
    \ data that lists the first set of records that need to be displayed. Each record\
    \ should have a field that indicates whether there are child records or it's a\
    \ leaf node in the hierarchy. This information will then be used in the ListView\
    \ widget, which would enable the user to navigate through the hierarchy.\n\n#\
    \ # How to do it...\n\nThe ListView widget should first display the records present\
    \ in the top level of the hierarchy. Let's assume that the service is configured\
    \ to return the same when it's queried from the client browser:\n\n```\n[\n  \
    \  { \"id\": 1, \"name\": \"Lamborghini\", \"hasModels\": true },\n    { \"id\"\
    : 2, \"name\": \"Ferrari\", \"hasModels\": true },\n    { \"id\": 3, \"name\"\
    : \"Aston Martin\", \"hasModels\": true }\n]\n```\n\nThe id property is used to\
    \ uniquely identify each record in the hierarchical structure. It also has a hasModels\
    \ property that indicates whether the record has child nodes associated with it.\
    \ The next step is to create a DataSource object and specify the service URL as\
    \ well as the schema details:\n\n```\nvar cars = new kendo.data.HierarchicalDataSource({\n\
    \    transport: {\n        read: '/carService'\n    },\n    schema: {\n      \
    \  model: {\n            id: 'id',\n            hasChildren: 'hasModels'\n   \
    \     }\n    }\n});\n```"
  merge: -1
  img_proc: true
- pgno: 156
  md: "In the preceding code snippet, we are using kendo.data.HierrachicalDataSource\n\
    to create an instance of hierarchical data source. The definition contains the\
    \ schema object\nthat specifies the mapping for the id and hasChildren properties.\
    \ The view that renders\nthe hierarchical structure should be used every time\
    \ the user navigates to various levels in\nthe hierarchy:\n\n```\n```html\n<div\n\
    id=\"hierarchicalView\"\ndata-role=\"view\"\ndata-title=\"Cars\"\ndata-show=\"\
    attachDataSource\"\ndata-layout=\"defaultLayout\">\n<ul\nid=\"listViewContainer\"\
    \ndata-role=\"listview\"\ndata-template=\"hierachicalTemplate\">\n</ul>\n</div>\n\
    ```\n```\n\nThe preceding view (with id=hierarchicalView) contains a ListView\
    \ widget. The\nview specifies data attribute – show, whose value refers to the\
    \ function that\nwill be invoked every time view is rendered, that is, whenever\
    \ view is reused to display\nthe next level elements. The ListView widget specifies\
    \ the data-template attribute as\nhierarchicalTemplate. The template can be specified\
    \ when initializing the widget,\nor it can be specified as a data- attribute:\n\
    \n```\n```html\n<script id=\"hierachicalTemplate\" type=\"text/x-kendo-template\"\
    >\n # if(data.hasModels) { #\n <a href=\"\\\\#hierarchicalView?parent=#: data.id\
    \ #\">\n #= name #\n </a>\n # } else { #\n #= name #\n # } #\n</script>\n```\n\
    ```\n\nThe template first checks whether the current model object (referred in\
    \ data) has the\nhasModels property set to true and then adds a hyperlink that\
    \ refers to the same view\n(with id=hierarchicalView) with a query parameter,\
    \ parent, set to id of the model\nobject. If the current model object is the leaf\
    \ node, then the same would be added to the\nlist without any hyperlink."
  merge: -1
  img_proc: true
- pgno: 157
  md: "When the user clicks on the hyperlink, the view should be reused to display\
    \ the next elements in the hierarchy. As mentioned earlier, the data-show attribute\
    \ specifies the function that should be invoked every time the view is used to\
    \ display the content. The attachDataSource function is invoked every time the\
    \ view is shown:\n\n```\nfunction attachDataSource(e) {\n    var parentID = e.view.params.parent,\n\
    \    listView = $(\"#listViewContainer\")\n        .data('kendoMobileListView');\n\
    \n    if (!parentID) {\n        listView.setDataSource(cars);\n    } else {\n\
    \        cars.fetch(function () {\n            var item = cars.get(parentID);\n\
    \            listView.setDataSource(item.children);\n        });\n    }\n}\n```\n\
    \nWhenever the user clicks on the link, the view is reused and the preceding function\
    \ is invoked. The event object is then used to get parentID. Initially, when the\
    \ view is used to render the elements, that is, the elements in the top level\
    \ in the hierarchy, parentID would be null. In this case, the ListView is set\
    \ to the hierarchical data source that we defined earlier. When the user navigates\
    \ the view, parentID would be present and the ListView's dataSource is set to\
    \ the child nodes of the corresponding parent.\n\n# ## How it works...\n\nWhen\
    \ you render the page, the elements in the top level of the hierarchy would be\
    \ displayed as shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_157_0.png)"
  merge: -1
  img_proc: true
- pgno: 158
  md: "Here, since the hasModels property is set to true, all elements in the list\
    \ are displayed along with a right arrow (▶). This indicates that the user can\
    \ navigate to the next set of nodes by clicking on it.\n\nWhen the user clicks\
    \ on any of the elements in ListView, the attachDataSource function is invoked.\
    \ The clicked element's id would be used to get the next set of elements in the\
    \ hierarchy. Note that the query parameter parentID is present when you have set\
    \ the DataSource for the ListView; a GET request is sent to the service specifying\
    \ the parentID value to the query parameter id. The remote service looks for the\
    \ records and returns it. The request URL is of the form:\n\n```\n/service?id=<parentID>\n\
    ```\n\nWhen you click on the first element (id = 1), the service will look for\
    \ the records whose parentID is 1. Let's assume that the service returns the following\
    \ records:\n\n```\n[\n  {\"id\": 11, \"name\": \"Gallardo\", \"hasModels\": false},\n\
    \  {\"id\": 12, \"name\": \"Aventador\", \"hasModels\": false},\n  {\"id\": 13,\
    \ \"name\": \"Huracan\", \"hasModels\": false}\n]\n```\n\nNotice that the value\
    \ of hasModels is false in all the three objects. Now, view is updated to show\
    \ the preceding records in ListView, and it does not contain the right arrow.\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_158_0.png)\n\nThe template used to\
    \ render the list elements checks the value of the hasModels property and adds\
    \ an anchor element only if it's set to true. In this case, it's false, and hence\
    \ it does not display the right arrow."
  merge: -1
