  md: "The other values that can be assigned to the theme property include blueopal,\
    \ bootstrap,\nhighcontrast, metro, metroblack, moonlight, silver, and uniform.\n\
    \n# # Binding a chart to a DataSource object\n\nA Kendo chart widget can be bound\
    \ to a DataSource object. This DataSource object\ncan be local or remoteDataSource.\
    \ When using a DataSource object, the series\nand configurationAxis fields must\
    \ be configured to refer to the fields in the\nDataSource object.\n\n# ## How\
    \ to do it...\n\nLet's first create a local DataSource object, which will then\
    \ be used to construct the chart:\n\n```\n```\nvar chromeBrowser = [{\n'year':\
    \ 2008,\n'percentage': 0\n}, {\n'year': 2009,\n'percentage': 4\n}, {\n'year':\
    \ 2010,\n'percentage': 15\n}, {\n'year': 2011,\n'percentage': 26\n}, {\n'year':\
    \ 2012,\n'percentage': 40\n}, {\n'year': 2013,\n'percentage': 52\n}, {\n'year':\
    \ 2014,\n'percentage': 56\n}];\n```\n```\n\nThe next step is to specify the preceding\
    \ code as a DataSource reference when constructing\nthe chart:\n\n```\n```\n$(\"\
    #chart\").kendoChart({\n dataSource: {\n  data: chromeBrowser\n },\n title: {\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 185
