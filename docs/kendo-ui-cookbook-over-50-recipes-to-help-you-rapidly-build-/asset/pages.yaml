- pgno: 72
  md: "# There's more...\n\nWhen you select any of the nodes in the tree, the corresponding\
    \ element's checked attribute is set to true. This will trigger a change event\
    \ on the DataSource object associated with TreeView. A change event listener can\
    \ be used to check which nodes in the tree are selected:\n\n```\n```\nvar treeViewWidget\
    \ = $(\"#treeView\").data(\"kendoTreeView\");\ntreeViewWidget.dataSource.bind(\"\
    change\", function() {\n var treeView = $(\"#treeView\").data(\"kendoTreeView\"\
    ),\n nodes = treeView.dataSource.view();\n (function(nodes) {\n for (var i = 0;\
    \ i < nodes.length; i++) {\n console.log(nodes[i].text + ' is checked: ' +\n (nodes[i].checked\
    \ ? 'yes': 'no'));\n if(nodes[i].hasChildren) {\n arguments.callee.call(this,\
    \ nodes[i].children.view());\n }\n }\n })(nodes);\n});\n```\n```\n\nHere, the\
    \ code checks whether the node in the tree is checked; then it iterates over its\
    \ children recursively and checks whether the child nodes are checked. When you\
    \ check the first node in the tree, you will see the following messages in the\
    \ console:\n\n```\n```\nDirectory1 is checked: no\nFile1.txt is checked: no\n\
    File2.txt is checked: no\nDirectory2 is checked: yes\nFile3.txt is checked: yes\n\
    File4.txt is checked: yes\nDirectory3 is checked: no\nFile5.txt is checked: no\n\
    File6.txt is checked: no\n```\n```"
  merge: -1
  img_proc: true
