- pgno: 66
  md: '# # Using the drag and drop feature to move elements in TreeView


    In a TreeView widget, elements in the tree can be dragged-and-dropped to various
    levels. This is applicable not only to child elements, but also to top-level nodes
    in the tree.


    # ## How to do it...


    To enable the drag and drop feature, specify the dragAndDrop property as true
    while initializing the TreeView widget, as shown in the following code snippet:


    ```

    $(''#treeView'').kendoTreeView({

    dragAndDrop: true,


    dataSource: [{

    text: "Directory1",

    items: [

    { text: "File1.txt" },

    { text: "File2.txt" }

    ],

    expanded: true

    }, {

    text: "Directory2",

    items: [

    { text: "File3.txt" },

    { text: "File4.txt" }

    ] }, {

    text: "Directory3",

    items: [

    { text: "File5.txt" },

    { text: "File6.txt" }

    ]

    }

    ]

    });

    ```


    Here, when the dragAndDrop property is set to true, the elements in TreeView can
    be moved between various levels in the tree.'
  merge: -1
  img_proc: true
- pgno: 67
  md: "# # Kendo UI TreeView\n\nAs the user drags the node, various events are generated.\
    \ The application can listen to these events and customize its behavior. The drag,\
    \ dragstart, dragend, and drop events are the set of events for which the user\
    \ can specify the event listeners.\n\nLet's consider the drag event. The generated\
    \ event contains meta information and includes a function to set the tooltip,\
    \ that is, a tooltip is shown when the user is performing the drag operation.\
    \ The event contains properties such as sourceNode, which refers to the element\
    \ being dragged; dropTarget, which refers to the element that the sourceNode is\
    \ placed over; pageX and pageY, which refer to the x and y coordinates of the\
    \ mouse pointer on the screen; and statusClass, which indicates the status of\
    \ the drag operation, that is, the node being added, inserted, or denied if the\
    \ operation is not acceptable.\n\nTo set the tooltip, invoke the setStatusClass\
    \ function on the event object. This function accepts a string as a parameter,\
    \ which should be one of k-insert-top, k-insert-middle, k-insert-bottom, k-add,\
    \ or k-denied.\n\nThe statusClass property can be used in the setStatusClass function\
    \ to set the appropriate tooltip while the element is being dragged:\n\n```\n\
    ```\n$(\\'#treeView\\').kendoTreeView({\n    dragAndDrop: true,\n    drag: function\
    \ (e) {\n        e.setStatusClass(\\'k-\\' + e.statusClass);\n    }\n});\n```\n\
    ```\n\nNow, when the element is being dragged, the tooltip is set by invoking\
    \ the setStatusClass function. The status of the drag operation is available in\
    \ the statusClass property of the event object.\n\n# ## How it works...\n\nAfter\
    \ setting the dragAndDrop property to true, the elements in TreeView can be dragged-and-dropped\
    \ to any level in the tree.\n\n![](img/2a66507445090790d34dc5588b56b24c_67_0.png)\n\
    \nThe previous screenshot indicates that the File1.txt element is being dragged\
    \ and the tooltip indicates that the element will be inserted at the bottom, that\
    \ is, it would be the last element under the parent node, Directory1. When the\
    \ element is being dragged, the statusClass property is set to insert-bottom and\
    \ the tooltip is set to k-insert-bottom."
  merge: -1
  img_proc: true
- pgno: 68
  md: "Similarly, when the element is moved to a different node, you would notice\
