    <option value="silver">Silver</option>

    <option value="uniform">Uniform</option>

    </select>

    <input type="checkbox" data-bind="checked: isStacked,

    events: {change: onChangeHandler}" />Stacked

    ```


    Here, the select elements and the input element has the data-bind attribute specified.
    This attribute specifies the model binding for value and checked, respectively
    and also specifies the event binding for the change event. All these should be
    specified in ViewModel.'
