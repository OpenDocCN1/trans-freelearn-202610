- pgno: 188
  md: "Here, the `labels` option specifies two fields, namely, `visible` and `format`.\
    \ The `labels` option for the series will add labels at the intersection of the\
    \ x and y axes where the value is projected, as shown in the following screenshot:\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_188_0.png)\n\nThe preceding screenshot\
    \ shows you the exact value of labels at the intersection of both the axes.\n\n\
    # # Creating a multiaxis chart\n\nIn many scenarios, you would like to group data\
    \ by more than one field. In the examples depicted in the earlier recipes, the\
    \ browser adoption data was grouped by year. Now, this data can be grouped by\
    \ platform as well. For example, adoption of the Chrome browser in the year 2012\
    \ on the Windows platform can be accomplished by adding multiple axes to the chart.\n\
    \n# ## How to do it...\n\nThe first step is to define the series data, which contains\
    \ information grouped by platforms:\n\n```\n```\nseries: [{\n name: 'On Windows',\n\
    \ data: ['15', '26', '40', '52', '56'],\n type: 'column',\n```\n\n```"
  merge: -1
  img_proc: true
- pgno: 189
  md: "```\n}, {\n  name: 'On Linux',\n  data: ['8', '15', '28', '32', '38'],\n  type:\
    \ 'column',\n}, {\n  name: 'On Mac',\n  data: ['12', '20', '33', '40', '45'],\n\
    \  type: 'area'\n}, {\n  name: 'On Others',\n  data: ['2', '8', '15', '18', '22'],\n\
    \  type: 'area'\n}]\n```\n\nHere, the name attribute specifies the platform and\
    \ the data attribute specifies the adoption percentage over the years. Notice\
    \ that the first two in the series have the type attribute as column and the other\
    \ two as area. The next step is to update the valueAxis option and specify the\
    \ details about the axis that needs to be plotted:\n\n```\nvalueAxis: [{\n  title:\
    \ {\n    text: 'Windows'\n  },\n  min: 0,\n  max: 60\n}, {\n  title: {\n    text:\
    \ 'Linux'\n  },\n  min: 0,\n  max: 60\n}, {\n  title: {\n    text: 'Mac'\n  },\n\
    \  min: 0,\n  max: 45\n}, {\n  title: {\n    text: 'Others'\n  },\n  min: 0,\n\
    \  max: 45\n}]\n```"
  merge: -1
  img_proc: true
- pgno: 190
  md: "The valueAxis field specifies the axes that need to be plotted on the chart.\
    \ These are defined in the same order as the ones in the series field. The min\
    \ and max attributes are used to adjust the valueAxes option. In the preceding\
    \ code snippet, the min and max attributes for the Windows and Linux platforms\
    \ are 0 and 60, which indicates that the y axis that was used to project the value\
    \ will start at 0 and will go up to 60. Similarly, for the other two platforms,\
    \ the y axis would range from 0 to 45.\n\nWhen you execute the page, you will\
    \ notice that there is one horizontal axis (the x axis), which refers to the categories\
    \ (the year data), and four vertical axes (the y axis), which refer to the platforms.\
    \ All the four vertical axes that refer to the platforms are plotted on the left-hand\
    \ side. If you want to move some of these vertical axes to the right, then you\
    \ will have to specify the axisCrossingValues array in the categoryAxis option:\n\
    \n```\ncategoryAxis: {\n    categories: [2010, 2011, 2012, 2013, 2014],\n    axisCrossingValues:\
    \ [0, 0, 5, 5]\n}\n```\n\nHere, the axisCrossingValues field is used to specify\
    \ the crossing value for each axis. The values in the array are used to indicate\
    \ the indices for each series. A zero value indicates that the axis is aligned\
    \ on the left-hand side (no changes); any other value would indicate its position\
    \ from the left. In the previous example, the value five is used to move the axis\
    \ to the right-hand side, since the indices zero to four are used by the categories\
    \ 2010 to 2014.\n\n# How it works...\n\nWhen you execute the page without specifying\
    \ the axisCrossingValues field, the various axes are plotted on the left-hand\
    \ side, shown as follows:\n\n![](img/2a66507445090790d34dc5588b56b24c_190_0.png)"
  merge: -1
  img_proc: true
- pgno: 191
  md: '# # Kendo UI DataViz


    Here, the library starts plotting the vertical axes in the order in which they
    are defined in the series field, moving towards the left. After specifying the
    axisCrossingValues field, the axis for the Mac and Others series would be moved
    to the right-hand side, as shown in the following screenshot:


    ![](img/2a66507445090790d34dc5588b56b24c_191_0.png)


    # ## There''s more...


    When working with a multiaxis chart, a series can be turned off by clicking on
    its legend. For example, when you click on the On Windows legend, the corresponding
    series would be hidden.


    ![](img/2a66507445090790d34dc5588b56b24c_191_1.png)'
  merge: -1
