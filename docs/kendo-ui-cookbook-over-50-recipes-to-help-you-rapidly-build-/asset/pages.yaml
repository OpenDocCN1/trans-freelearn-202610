- pgno: 112
  md: '# # Kendo UI Window


    In this chapter, we will cover the following recipes:


    +   - Displaying a pop up and blocking the user interaction by configuring it
    as a modal window

    +   - Customizing the look and feel of the window and including action buttons

    +   - Using the Window API to act on a window object


    # ## Introduction


    A Kendo UI Window widget is used to show any HTML content in a pop-up window or
    a modal window. The window content is shown on top of the other content in the
    page and has a title bar with a close button. The content can be either static
    HTML, or it can be loaded dynamically using Ajax. Any DOM node in the page can
    be initialized to a window, that is, the content of any element in the DOM can
    be wrapped inside a window. Also, the window can be resized, moved, and closed.


    The Kendo UI Window widget provides several configuration options that can be
    used to customize the actions that can be applied and also the look and feel of
    the widget. In this recipe, we will first see how to create a pop-up window and
    configure it as a modal. Then, we will customize the look the feel of the window
    and use APIs to invoke actions on the window object.'
  merge: -1
  img_proc: true
- pgno: 113
  md: "# # Displaying a pop up and blocking the user interaction by configuring it\
    \ as a modal window\n\nIn this recipe, we will look at how the Kendo UI window\
    \ is created for a DOM node in the page. Later, we will also see how the content\
    \ of the window is loaded asynchronously by specifying the URL of the page.\n\n\
    # ## How to do it...\n\nLet's create a div element that contains some text that\
    \ will be shown in the window:\n\n```\n```\n<div id=\"window\">\n Window content\
    \ goes here...\n</div>\n```\n```\n\nThe next step is to invoke the kendoWindow\
    \ function on the preceding DOM node:\n\n```\n```\n$(\"#window\").kendoWindow();\n\
    ```\n```\n\nAfter initializing the DOM node using the kendoWindow function, you\
    \ will notice that the window contains the text mentioned in the div element that\
    \ is being shown. Note that this will not add a backdrop. To add a backdrop, the\
    \ window should be configured as a modal.\n\nThe difference between a window and\
    \ a modal is that a backdrop that hides the body content is shown in the case\
    \ of a modal. To create the modal window, specify the modal property as true:\n\
    \n```\n```\n$(\"#window\").kendoWindow({\n modal: true\n});\n```\n```\n\nBy default,\
    \ the value of the modal property is false, and hence the backdrop is not shown.\n\
    \n# ## How it works...\n\nWhen you initialize any DOM node, its content will be\
    \ wrapped in a window, as shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_113_0.png)"
  merge: -1
  img_proc: true
- pgno: 114
  md: "The window contains the **Window content goes here...** text, and the title\
    \ bar has a cross(x) icon. If the same is initialized as a modal window, then\
    \ a backdrop is added to the page, as shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_114_0.png)\n\
    \nNotice that the backdrop is translucent; it shows you the text present in the\
    \ page and also highlights the window. This will prevent you from interacting\
    \ with the rest of the page. Usually, a modal window is used only when the user\
    \ is required to complete an action before proceeding to the next step. For example,\
    \ a modal window that contains a login form could be shown before the same user\
    \ views the content of the page.\n\n# There's more...\n\nThe modal window can\
    \ be configured to open when the user triggers an action. For example, on click\
    \ of a button the modal window can be shown. Also, since the content of the modal\
    \ is loaded when the user triggers an action on the page, the content of the modal\
    \ can be loaded at runtime using Ajax.\n\n# Showing the modal window on a click\
    \ of button\n\nIn the previously mentioned scenarios, the window or the modal\
    \ window is shown when the page is loaded. In most of the scenarios, you would\
    \ like to show the modal only when the user initiates an action. Let's consider\
    \ that the modal window should be shown when the user clicks on a button.\n\n\
    Let's place a button on the page as follows:\n\n```\n`<button id=\"btn1\">Click</button>`\n\
    ```\n\nTo hide the modal, set the `visible` attribute to `false`, as follows:\n\
    \n```\n```\n$(\\'#window\\').kendoWindow({\n    visible: false,\n    modal: true\n\
    });\n```\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "# # Kendo UI Window\n\nNow, when the page loads, the modal window will be hidden.\
    \ Add a `click` event handler  \nfor the button that will open the modal window:\n\
    \n```\n```javascript\n$(\\'#btn1\\').on(\\'click\\', function() {\n    var modalObject\
    \ = $(\\'#window\\').data(\\'kendoWindow\\');\n    modalObject.open();\n});\n\
    ```\n```\n\nThe first line gets the instance of the modal window. Then, in the\
    \ next line, the open method  \nis called on the window instance that would open\
    \ the modal window.\n\nThe `open` method is one of the several methods that can\
    \ be used to act on the window object.  \nWe will take a look at other methods\
    \ in the following recipe.\n\n# ## Loading the content of the modal using Ajax\n\
    \nIn this recipe, the content of the modal was specified in the HTML markup. The\
    \ content of the  \nmodal window can be loaded by specifying the URL that returns\
    \ the HTML markup. This content  \nwill be fetched asynchronously when the page\
    \ is loaded.\n\nTo load the content of the window, specify the content attribute\
    \ when initializing the window  \nusing `kendoWindow`:\n\n```\n```javascript\n\
    $(\\'#window\\').kendoWindow({\n    visible: false,\n    modal: true,\n    content:\
    \ \\'./jsbooks.html\\'\n});\n```\n```\n\nHere, the `./jsbooks.html` URL is specified\
    \ in the `content` attribute. This can be any URL  \nthat returns the HTML markup.\
    \ For example, it could be a PHP page that generates the HTML  \nmarkup. When\
    \ you load the page, an asynchronous request is sent to `./jsbooks.html`,  \n\
    and the generated markup is inserted into the window."
  merge: -1
  img_proc: true
- pgno: 116
  md: "# # Customizing the look and feel of the window and including action buttons\n\
    \nThere are various options available to the user to customize the window object.\
    \ In this recipe, we will take a look at these options.\n\n# ## How to do it...\n\
    \nSome of the customization options for the window have a default value. For example,\
    \ the pop-up window can be resized and is draggable. Also, the window is shown\
    \ since the visible property is set to true. Let's take a look at some of the\
    \ other properties:\n\n```\n$('#window').kendoWindow({\n    visible: false,\n\
    \    modal: true,\n    title: \"Example Modal Window\",\n    width: '400px',\n\
    \    height: '400px',\n    maxWidth: '600px',\n    maxHeight: '600px',\n    minWidth:\
    \ '200px',\n    minHeight: '200px',\n    position: {\n        top: '100px',\n\
    \        left: '100px'\n    }\n});\n```\n\nHere, the title attribute specifies\
    \ the title of the window. When the modal window is rendered, its width and height\
    \ would be 400px. This modal window can be resized; however, it can be resized\
    \ to a maximum width (maxWidth) and height (maxHeight) of 600px and a minimum\
    \ width (minWidth) and height (minHeight) of 200px. The position attribute specifies\
    \ the top and left positions as 100px, and the window would be positioned accordingly.\
    \ If the same is not specified, then the window is positioned in relation to the\
    \ document by default."
  merge: -1
  img_proc: true
- pgno: 117
  md: "The title bar of the window can be customized to add more action buttons. By\
    \ default, only\nthe close (x) button is shown. The action buttons that can be\
    \ added to the title bar include\nClose (added by default), Minimize, Maximize,\
    \ Refresh, and Pin. These options can\nbe specified as the value to the actions\
    \ attribute:\n\n```\n$('#window').kendoWindow({\n    visible: false,\n    modal:\
    \ true,\n    title: \"Example Modal Window\",\n    actions: ['Pin', 'Refresh',\
    \ 'Minimize', 'Maximize', 'Close'],\n    width: '400px',\n    height: '300px',\n\
    \    content: './jsbooks.html'\n});\n```\n\n# How it works...\n\nWhen you execute\
    \ the preceding code snippet, you will see that the window has a title bar and\n\
    various action buttons, as shown in the following screenshot:\n\n![](img/2a66507445090790d34dc5588b56b24c_117_0.png)\n\
    \nThe action buttons are added in the same order as they are specified. When you\
    \ click on the\nRefresh button, a request will be sent to the URL specified in\
    \ the content attribute. If the\ncontent of the window is specified inline, that\
    \ is, in the same page, then the refresh button\nis not required.\n\nWhen you\
    \ click on the Minimize or Maximize button, the window is adjusted such that only\n\
    the title is shown or expanded to occupy the entire screen, respectively. In both\
    \ scenarios,\nthese buttons are replaced with a Restore button. On clicking on\
    \ this button, the window is\nrestored to its original state."
  merge: -1
  img_proc: true
- pgno: 118
  md: "The Pin button allows you to fix the position of the window, that is, when\
    \ the user scrolls,\nthe window continues to be in the same fixed position. Also,\
    \ if the window is pinned, the icon\nin the title bar is replaced with the Unpin\
    \ button so that the user can restore the window to\nits original state.\n\n#\
    \ There’s more...\n\nIt is also possible to add a custom action button in the\
    \ title bar of the window instance.\nAlso, the action to perform when the custom\
    \ button is clicked on can also be defined by\nadding a click event handler.\n\
    \nTo add a custom action button to the title bar, first specify Custom in the\
    \ actions array:\n\n```\n$('#window').kendoWindow({\n\ttitle: \"Example Modal\
    \ Window\",\n\tactions: ['Custom', 'Pin', 'Refresh',\n\t\t'Minimize', 'Maximize',\
    \ 'Close'],\n\twidth: '400px',\n\theight: '300px',\n\tcontent: './jsbooks.html'\n\
    });\n```\n\nThe next step is to define an event handler for the custom button\
    \ added to the title bar:\n\n```\nvar modalObject = $('#window').data('kendoWindow');\n\
    modalObject.wrapper.find('.k-i-custom').on('click', function() {\n\talert(modalObject.options.title);\n\
    });\n```\n\nThe preceding code first gets an instance of the window and then adds\
    \ a click handler for\nthe custom button. Here, a reference to the custom icon\
    \ is used, that is, the k-i-custom\nclass to add a click handler.\n\nWhen you\
    \ execute the page, you will see the custom icon being shown in the title bar.\n\
    \n![](img/2a66507445090790d34dc5588b56b24c_118_0.png)"
  merge: -1
  img_proc: true
- pgno: 119
  md: 'In the preceding screenshot, the first icon from the left is the custom icon.
    When you click on

    the custom icon, an alert message that displays the title of the window is shown.
    For a given

    window, you can add only one custom icon.


    # # Using the Window API to act on a window object


    In this recipe, we will look at several methods that can be used to act on the
    window object.


    # ## How to do it...


    There are various methods available that help you act on an existing window object.

    These include the following methods:


    +   - **center**: This will center the window.

    +   - **open**: This will open the window.

    +   - **close**: This will close the window.

    +   - **refresh**: This will refresh the content of window. Optionally, some parameters

    +   can be passed to this function, which will override the default options.

    +   - **maximize**: This will maximize the window to the entire viewing area.

    +   - **minimize**: This will minimize the window to its title bar.

    +   - **restore**: This will restore the window from its minimized or maximized
    state.

    +   - **pin**: This will pin the window. It will fix the window''s position, and
    hence,

    +   when you scroll, the window will appear at the same position.

    +   - **unpin**: This will unpin the window and remove the fixed position.

    +   - **toggleMaximization**: This toggles the window between the maximized and

    +   restored state.


    Let''s test these functions by creating a window and adding buttons that will
    execute the

    corresponding actions when clicking on them:


    The following is HTML markup that contains buttons:


    ```

    ```

    <button id="btnOpen">Open</button><br>

    <button id="btnClose">Close</button><br>

    <button id="btnRefresh">Refresh</button><br>

    <button id="btnMaximize">Maximize</button><br>

    <button id="btnToggleMaximization">Toggle Maximization</button><br>

    <button id="btnMinimize">Minimize</button><br>

    <button id="btnRestore">Restore</button><br>

    <button id="btnPin">Pin</button><br>

    <button id="btnUnpin">Unpin</button><br>

    ```

    ```'
  merge: -1
  img_proc: true
