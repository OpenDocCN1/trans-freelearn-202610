- pgno: 220
  md: "# # Generating a QR code image to represent a URL, e-mail, telephone, and geographic\
    \ location\n\nA **Quick Response code (QR code)** is generally used to efficiently\
    \ store data by encoding it. It uses ISO_8859_1 as the encoding method by default\
    \ to store data. The generated code consists of black modules (square dots) arranged\
    \ in a square grid on a white background. This code can then be read by a camera\
    \ and then processed by an application.\n\nIn this recipe, we will see how various\
    \ forms of data such as URLs, e-mail addresses, telephone numbers, and geographic\
    \ locations can be stored in a QR code.\n\n# ## How to do it...\n\nTo generate\
    \ a QR code, invoke the `kendoQRCode` function on the DOM element:\n\n```\n```\n\
    $(\"#chart\").kendoQRCode({\n    value: 'http://www.kendoui.com'\n});\n```\n```\n\
    \nIn the previous example, the `http://www.kendoui.com` URL is specified. This\
    \ value will be encoded using ISO_8859_1 and represented in a square grid. When\
    \ you scan the QR code, the value stored in it is identified. Since the value\
    \ is prefixed with the protocol name, `http://`, the value is recognized as a\
    \ URL. Similarly, an e-mail address should be prefixed with `mailto:`, a telephone\
    \ number with `tel`, and a geolocation with `geo` followed by the latitude and\
    \ longitude information. A geo location can be encoded in the following way:\n\
    \n```\n```\n$(\"#chart\").kendoQRCode({\n    value: 'geo: 12.9667, 77.5667, 100'\n\
    });\n```\n```\n\nBy default, the color of the QR code is black and is drawn on\
    \ a white background. This can be changed by specifying the `color` and `background`\
    \ attributes:\n\n```\n```\n$(\"#chart\").kendoQRCode({\n    value: 'geo: 12.9667,\
    \ 77.5667, 100',\n    color: 'red',\n    background: 'yellow'\n});\n```\n```"
  merge: -1
  img_proc: true
- pgno: 221
  md: "# # How it works...\n\nWhen you render the page, you will see a square grid\
    \ that shows you the dots and lines that represent the QR code for the URL.\n\n\
    ![](img/2a66507445090790d34dc5588b56b24c_221_0.png)\n\nWhen you change the value\
    \ to the geolocation and specify the color and background attributes, the generated\
    \ QR code is shown as follows:\n\n![](img/2a66507445090790d34dc5588b56b24c_221_1.png)\n\
    \n# # There's more...\n\nA QR code has an error correction capability that allows\
    \ you to restore data if the code is damaged or is dirty. There are four error\
    \ correction levels, namely, L, M, Q, and H, that can be applied to a QR code.\
    \ Each of these levels indicate the percentage of data that can be recovered,\
    \ that is, L recovers 7 percent data, M recovers 15 percent, Q recovers 25 percent\
    \ data, and H recovers 30 percent. When initializing a QR code, one can change\
    \ the error correction level by setting the errorCorrection attribute:\n\n```\n\
    $(\"#chart\").kendoQRCode({\n    value: 'geo: 12.9667, 77.5667, 100',\n    errorCorrection:\
    \ 'Q'\n});\n```\n\nIn the previous example, the errorCorrection attribute is set\
    \ to Q, and it is used to encode the value."
  merge: -1
  img_proc: true
- pgno: 222
  md: "# # Creating flow diagrams using Kendo Diagram\n\nAdding workflow diagrams\
    \ or hierarchical structure to a web page is now made easy with\nthe introduction\
    \ of diagrams in the Kendo UI library. In this recipe, we will build a flowchart\n\
    diagram by creating shapes and then we will connect those with connectors. The\
    \ library also\nprovides a set of layouts that can be used to represent a hierarchical\
    \ or tree-like structure.\n\n# ## How to do it...\n\nA flowchart is used to represent\
    \ steps in an algorithm; these steps are shown as shapes\n(rectangles and circles).\
    \ The connectors are then used to connect the shapes and describe\nthe flow. A\
    \ diagram in Kendo UI is created by invoking the kendoDiagram function on the\n\
    selected DOM node:\n\n```\n```\nvar diagram = $(\"#chart\").kendoDiagram({\n connectionDefaults:\
    \ {\n  stroke: {\n   color: '#F00'\n  },\n  startCap: 'FilledCircle',\n  endCap:\
    \ 'ArrowEnd',\n }\n}).getKendoDiagram();\n```\n```\n\nIn the preceding code snippet,\
    \ an empty diagram is created, with some default attributes for\nconnections specified.\
    \ A connection is used to connect two or more shapes in the diagram.\nThe connectionDefaults\
    \ option specifies the color of the stroke to be applied; the\nstartCap and endCap\
    \ options are used to specify the decoration to be applied. In this case,\nthe\
    \ startCap option has the value FilledCircle, which will show you a circle at\
    \ the start\nof the connection. The other value that can be assigned to startCap\
    \ is ArrowStart. This will\nadd an arrow directed towards the shape. The endCap\
    \ option has its value set to ArrowEnd.\nIn this example, the shape from which\
    \ the connection is initiated will have a filled circle attached\nto it, and an\
    \ arrow is shown, which is directed towards the second shape.\n\nThe getKendoDiagram\
    \ function will return an instance of the diagram once it's initialized.\nThe\
    \ diagram is like a canvas on which you can add several shapes and also connect\
    \ them."
  merge: -1
  img_proc: true
- pgno: 223
  md: "Now let's create a function that will accept the shape details, which includes\
    \ the text that needs to be shown, the shape type, and the position of the shape\
    \ on the diagram:\n\n```\nfunction createShape(textData, type, positionX, positionY)\
    \ {\n\n    return new kendo.dataviz.diagram.Shape({\n        x: positionX,\n \
    \       y: positionY,\n        width: 100,\n        height: 50,\n        type:\
    \ type,\n        content: {\n            text: textData,\n            color: '#FFF'\n\
    \        },\n        background: '#00B'\n    });\n}\n}\n```\n\nIn the preceding\
    \ code snippet, the createShape function accepts the mentioned arguments and returns\
    \ an instance of shape, that is, kendo.dataviz.diagram.Shape. Now let's create\
    \ a few shapes and add them to the diagram:\n\n```\nvar shape1 = diagram.addShape(\n\
    \    createShape('Start', 'circle', 400, 20));\nvar shape2 = diagram.addShape(\n\
    \    createShape('counter = 0', 'rectangle', 400,\n    100));\nvar shape3 = diagram.addShape(\n\
    \    createShape('counter < 5', 'rectangle', 400,\n    190));\nvar shape4 = diagram.addShape(\n\
    \    createShape('Stop', 'circle', 600, 290));\nvar shape5 = diagram.addShape(\n\
    \    createShape('Print (counter)', 'rectangle',\n    200, 290));\nvar shape6\
    \ = diagram.addShape(\n    createShape('counter++', 'rectangle', 200,\n    390));\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 224
  md: "In the preceding code snippet, six shape objects are created by specifying\
    \ their content text along with the position data. There are two types of shapes\
    \ that you can create, rectangles and circles. Once the shapes have been created,\
    \ they are added to the diagram by calling the addShape function on the diagram\
    \ object.\n\nOnce the shapes have been added, connections between them can be\
    \ established:\n\n```\ndiagram.connect(shape1, shape2);\ndiagram.connect(shape2,\
    \ shape3);\ndiagram.connect(shape3.getConnector('Right'),\n shape4.getConnector('Top'),\
    \ {\n points: [\n new kendo.dataviz.diagram.Point(650, 215)\n ]\n });\ndiagram.connect(shape3.getConnector('Left'),\n\
    \ shape5.getConnector('Top'), {\n points: [\n new kendo.dataviz.diagram.Point(250,\
    \ 215)\n ]\n });\ndiagram.connect(shape5, shape6);\ndiagram.connect(shape6.getConnector('Bottom'),\n\
    \ shape3.getConnector('Bottom'), {\n points: [\n new kendo.dataviz.diagram.Point(250,\
    \ 470),\n new kendo.dataviz.diagram.Point(450, 470)\n ]\n });\n```\n\nThe connect\
    \ function accepts two shape objects and an optional configuration object. A connection\
    \ between the two shapes is added; there are four connector points available on\
    \ a shape instance, namely, Top, Bottom, Right, and Left. The framework identifies\
    \ the position of the shapes on the diagram and chooses the correct connector\
    \ point from the Shape instance. In the preceding example, shape2 is positioned\
    \ right below shape1, and hence, the connection between the two will be from the\
    \ shape1 bottom connector point to the shape2 top connector point.\n\nIn the third\
    \ example, the connector point to be used is explicitly mentioned by calling shape3.getConnector('Right')\
    \ and shape4.getConnector('Top'). Also, the third parameter is the configuration\
    \ object that is used to configure the connector. The third parameter in the preceding\
    \ code snippet specifies the points configuration. This is used to set intermediate\
    \ points of the connection. This will be applied in addition to connectionDefaults,\
    \ which is specified when initializing the widget."
  merge: -1
  img_proc: true
