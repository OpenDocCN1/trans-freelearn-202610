- pgno: 65
  md: "# # Kendo UI TreeView\n\nNow, when you execute the previous code, you would\
    \ see the category names being displayed\nin the TreeView widget. Here, the `dataTextField`\
    \ attribute is used to specify the field name\nthat should be used when displaying\
    \ labels in the TreeView widget.\n\nTo populate the next level of nodes in TreeView,\
    \ the widget should be instructed whether the\ncurrent node contains subitems\
    \ or not. Notice that the response contains the `categoryId`\nand `hasSubCategories`\
    \ fields; the `categoryId` field serves as a unique ID for each object\nin the\
    \ response and the `hasSubCategories` field indicates whether the object contains\n\
    subitems. This should be identified in the `DataSource` object and hence a schema\
    \ for\nthe same should be specified:\n\n```\n$('#treeView').kendoTreeView({\n\
    \    dataSource: {\n        transport: {\n            read: 'TreeView.json'\n\
    \        },\n        schema: {\n            model: {\n                id: 'categoryId',\n\
    \                hasChildren: 'hasSubCategories'\n            }\n        }\n \
    \   },\n    dataTextField: \"categoryName\",\n});\n```\n\nHere, the properties\
    \ in the schema models, `id` and `hasChildren`, are mapped to the\nattributes\
    \ in the response mentioned earlier. Now, TreeView shows you the list of top-level\n\
    nodes and indicates that each node in the tree has children. When you click on\
    \ any of the\nnodes in TreeView, a `GET` request is sent to remote services, specifying\
    \ the `categoryId` as\na query parameter. For example, when you click on the first\
    \ node in the tree, a `GET` request is\nsent with the `categoryId` query parameter\
    \ set to 1:\n\n```\n/services/music?categoryId=1\n```\n\nThe service is expected\
    \ to return a similar JSON response, that is, a collection of objects,\neach containing\
    \ the `categoryId` and `hasSubCategories` attributes."
