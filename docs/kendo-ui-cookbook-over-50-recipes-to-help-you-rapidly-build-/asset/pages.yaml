  md: "The previous screenshot shows you the Grid with four rows and a scrollbar.\
    \ When you scroll,\nthe same DOM nodes will be reused, that is, only the content\
    \ and attributes of the DOM\nnodes are updated with the new data present in the\
    \ DataSource object. Let's examine\nthe DOM tree when the Grid is rendered, as\
    \ shown in the following screenshot:\n\n```\n```\n<tbody>\n    <tr data-uid=\"\
    bbcea6f3-5e2a-4879-9a72-65a6a716a40a\" role=\"row\">...</tr>\n    <tr class=\"\
    k-alt\" data-uid=\"f3b539d9-431a-4808-92a7-029858b6ca5a\" role=\"row\">...</tr>\n\
    \    <tr data-uid=\"1e87edde-e2af-4407-adba-0aa9fdb3d485\" role=\"row\">...</tr>\n\
    \    <tr class=\"k-alt\" data-uid=\"296d489d-8018-4155-85ef-eb0c1c19b4f9\" role=\"\
    row\">...</tr>\n</tbody>\n```\n```\n\nNow, when you scroll, the same DOM nodes\
    \ are reused.\n\n```\n```\n<tbody>\n    <tr data-uid=\"f3b539d9-431a-4808-92a7-029858b6ca5a\"\
    \ role=\"row\">...</tr>\n    <tr class=\"k-alt\" data-uid=\"1e87edde-e2af-4407-adba-0aa9fdb3d485\"\
    \ role=\"row\">...</tr>\n    <tr data-uid=\"296d489d-8018-4155-85ef-eb0c1c19b4f9\"\
    \ role=\"row\">...</tr>\n    <tr class=\"k-alt\" data-uid=\"ccea6e15-8af8-47dd-a106-4ce4f7060656\"\
    \ role=\"row\">...</tr>\n</tbody>\n```\n```\n\nNote the data-uid attribute of\
    \ the DOM nodes in the two screenshots shown earlier. When you\nscroll, the DOM\
    \ nodes are transferred up by one level, and the last node that contains the fifth\n\
    element in DataSource is referred as the fourth row in the table (since pageSize\
    \ is four).\n\n# There’s more...\n\nWhen working with remote data sources, only\
    \ a set of records are fetched. When the\nuser scrolls down, the next sets of\
    \ records are fetched from a remote service. In this case,\noperations such as\
    \ sorting or filtering cannot be performed at the client side. This is because\n\
    the browser can only operate on the data it has received from the service. These\
    \ operations\nhave to be performed at the server side. To enable them, set the\
    \ serverSorting and\nserverFiltering attributes to true in the DataSource object,\
    \ as shown in the following\ncode snippet:\n\n```\n```\ndataSource: {\n    transport:\
    \ {\n        read: 'http://yourdomain.com/serviceName',\n    },\n\n    pageSize:\
    \ 4,\n\n    serverSorting: true,\n    serverFiltering: true\n}\n```\n```\n\nNow,\
    \ when you click on the column header, the records are sorted at the server side\
    \ and\nthe Grid is updated to show you the list of records sorted by the selected\
    \ column."
