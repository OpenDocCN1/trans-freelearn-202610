    In the preceding code snippet, various event handlers are specified: cancel, complete,

    error, success, progress, remove, select, and upload.


    # How it works...


    When you try to upload a file using the file uploader widget, various callback
    handlers are

    executed in the following sequence:


    +   1. When you select a file or multiple files, the `select` event handler is
    executed.

    +   2. When the uploader widget starts to upload the file, the `upload` event
    handler

    +   is executed.

    +   3. While the file is being uploaded, the `progress` event is called continuously.

    +   Note that the event object has a `percentComplete` property, which indicates

    +   the size of the file uploaded to the server.

    +   4. Once a file has been uploaded, the `success` handler is executed.

    +   5. If there are multiple files being uploaded and when all selected files
    have been

    +   uploaded, the `complete` handler is executed.

    +   6. If the user tries to cancel the upload while the file upload is in progress,

    +   then the `cancel` event is executed.

    +   7. After the file upload has been completed and the user tries to remove the

    +   uploaded file from the uploader widget by clicking on the cross (x) icon,

    +   the `remove` handler is executed.

    +   8. The `complete` handler is also executed when the `remove` and `cancel`

    +   events have completed their execution.'
  merge: -1
  img_proc: true
