- pgno: 94
  md: "# # Loading the content of a PanelBar using Ajax\n\nIn the previous recipe,\
    \ we looked at how a PanelBar widget can be created using the markup present in\
    \ the page. In this recipe, we will look at how the content of each list item\
    \ in the PanelBar can be loaded by fetching the same from the server using Ajax.\n\
    \nAs observed in the previous recipe, the content for each list item was wrapped\
    \ inside a div element. By doing so, the size of the page had increased, which\
    \ in turn would have affected the performance of the application. A workaround\
    \ to this is to load the content of each list item when it is requested using\
    \ Ajax.\n\n# ## How to do it...\n\nLet's consider the same example; here, the\
    \ list headings are specified in the markup and the div elements are used as placeholders.\
    \ These placeholders will contain the data fetched from the server at runtime:\n\
    \n```\n```\n<ul id=\"panelBar\" style=\"width: 400px\">\n  <li>\n    Destinations\n\
    \    <div></div>\n  </li>\n  <li>\n    Flights\n    <div></div>\n  </li>\n  <li>\n\
    \    Important Sights\n    <div></div>\n  </li>\n</ul>\n```\n```\n\nHere, a placeholder\
    \ div element is used so that when the PanelBar is initialized, the list headings\
    \ will display a down arrow, indicating that it is expandable.\n\nThe next step\
    \ is to create HTML files that would contain the content for each of the headings\
    \ in the list. For example, to populate the list of Destinations in the preceding\
    \ list, create a PanelBar_Destinations.html file:\n\n```\n```\n<div class=\"destinationData\"\
    >\n  <h2>India</h2>\n  <img src=\"./images/India-Flag-icon.png\" />\n```\n```"
  merge: -1
  img_proc: true
